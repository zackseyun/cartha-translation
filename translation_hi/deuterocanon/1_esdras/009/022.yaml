base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: hi
  text: 'और फैसूर के पुत्रों में से: एलियोनाइस[a], अस्सेइयास, इस्माएलोस, नथानाएलोस, ओकैलेदोस[b][c] और सल्थास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में नाम फैसूर है; अनुमानित इब्रानी समानांतर में इसके अनुरूप नाम पशहूर है।
    reason: alternative_reading
  - marker: b
    text: ओकैलेदोस नाम यहाँ यूनानी साक्ष्य के अनुसार है; अनुमानित इब्रानी समानांतर की पाठ-परंपरा किसी भिन्न मूल नाम की ओर संकेत कर सकती है, जिसे कभी-कभी योजाबाद से जोड़ा जाता है।
    reason: textual_variant
  - marker: c
    text: इस पद के कई नामों के यूनानी रूप अनुमानित इब्रानी समानांतर से पूरी तरह मेल नहीं खाते। प्रथम एसद्रास का अनुवाद यहाँ सेप्टुआजेंट के यूनानी साक्ष्य से किया गया है, इसलिए मुख्य पाठ में यूनानी रूप रखे गए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के पुत्रों में से
  rationale: सूची के इस सूत्र में ἐκ किसी वंश या कुल के सदस्यों में से चुने गए व्यक्तियों को सूचित करता है; यह हिन्दी में स्वाभाविक रहते हुए यूनानी संरचना को बनाए रखता है।
- source_word: Φαισούρ
  choice: फैसूर
  rationale: मुख्य आधार यूनानी पाठ है, इसलिए नाम का यूनानी रूप देवनागरी में लिप्यंतरित किया गया है; निकटवर्ती इब्रानी समानांतर का पशहूर रूप पादटिप्पणी में दिया गया है।
- source_word: Ἐλιωναίς
  choice: एलियोनाइस
  rationale: यूनानी नाम का निकट और पठनीय देवनागरी लिप्यंतरण।
- source_word: Ἀσσείας
  choice: अस्सेइस
  rationale: दोहरे सिग्मा और यूनानी उच्चारण-रूप को ध्यान में रखकर किया गया देवनागरी लिप्यंतरण।
- source_word: Ἰσμαήλος
  choice: इस्माएलोस
  rationale: परिचित इब्रानी रूप से सामान्यीकरण करने के बजाय प्राथमिक यूनानी साक्ष्य का नाम-रूप सुरक्षित रखा गया है।
- source_word: Ναθανάηλος
  choice: नथानाएलोस
  rationale: यूनानी रूप का लिप्यंतरण किया गया है; इसे इब्रानी-संगत किसी अन्य रूप में नहीं बदला गया।
- source_word: Ὠκαιληδός
  choice: ओकाएलेदोस
  rationale: यह कठिन नाम स्वेटे के यूनानी पाठ के अनुसार लिप्यंतरित है; अनुमानित इब्रानी समानांतर से सामंजस्य बैठाकर योजाबाद नहीं किया गया।
- source_word: Σάλθας
  choice: सल्थास
  rationale: यूनानी नाम का सीधा देवनागरी लिप्यंतरण; संभावित इब्रानी-संगत नाम को मुख्य पाठ में नहीं लाया गया।
