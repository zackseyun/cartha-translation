  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: hi
  text: और याजकों में ऐसे लोग पाए गए जिन्होंने परदेशी स्त्रियों को अपने लिए लिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “इकट्ठे किए गए वे लोग, जिनके पास परदेशी स्त्रियाँ थीं।” उपलब्ध यूनानी पाठ की शब्द-रचना कुछ असहज है; इब्रानी समानांतर उस अर्थ का समर्थन करता है कि उन्होंने परदेशी स्त्रियों को अपने लिए लिया था।
    reason: textual_variant
lexical_decisions:
- source_word: εὑρέθησαν
  choice: पाए गए
  rationale: यूनानी क्रिया का कर्मवाच्य रूप बनाए रखता है और जाँच या सूची में सामने आने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῶν ἱερέων
  choice: याजकों में
  rationale: यहाँ संबंधकारक अंशवाचक है; आशय याजकों के समूह में से कुछ लोगों से है।
- source_word: οἱ ἐπισυναχθέντες
  choice: ऐसे लोग
  rationale: ἐπισυναχθέντες का शाब्दिक अर्थ ‘इकट्ठे किए गए’ है, पर उपलब्ध यूनानी पाठ में इसकी रचना असहज है। मुख्य आशय को स्पष्ट रखते हुए पाठगत कठिनाई पाद-टिप्पणी में सुरक्षित की गई है।
- source_word: ἀλλογενεῖς γυναῖκας
  choice: परदेशी स्त्रियों
  rationale: ἀλλογενής दूसरे लोगों या जातीय समुदाय से संबंधित होने का भाव देता है। ‘परदेशी’ आधुनिक हिंदी में स्वाभाविक और सम्मानपूर्ण है।
- source_word: ἔχοντες
  choice: अपना लिया था
  rationale: शाब्दिक अर्थ ‘रखे हुए/वाले’ है, किंतु वैवाहिक प्रसंग और इब्रानी समानांतर के נָשְׂאוּ से स्त्रियों को पत्नी के रूप में ग्रहण करने का भाव स्पष्ट होता है। ‘अपना लिया था’ इस वैवाहिक क्रिया को व्यक्त करता है, बिना ‘विवाह किया था’ जितना स्पष्ट विवरण जोड़ने के।
theological_decisions:
- issue: कठिन यूनानी वाक्यांश में वैवाहिक आशय स्पष्ट करने के लिए इब्रानी समानांतर का उपयोग
  choice: ‘परदेशी स्त्रियों को अपना लिया था’
  alternative: ‘परदेशी स्त्रियाँ थीं’ अथवा ‘इकट्ठे किए गए लोग, जिनके पास परदेशी स्त्रियाँ थीं’
  rationale: यूनानी पाठ प्राथमिक आधार है, पर उसका ἔχοντες सामान्यतः केवल ‘होना/रखना’ कहता है और ἐπισυναχθέντες यहाँ असहज है। इब्रानी समानांतर तथा प्रसंग वैवाहिक संबंध की पुष्टि करते हैं। अनुवाद इसी आशय को स्पष्ट करता है, जबकि पाठगत कठिनाई को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली रखी गई है। ‘याजक’ और ‘परदेशी स्त्रियाँ’ बाइबिलीय संदर्भ में परिचित होने के साथ सामान्य पाठक के लिए भी बोधगम्य हैं।
