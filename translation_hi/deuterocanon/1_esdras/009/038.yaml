base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: hi
  text: और सारी भीड़ एक मन होकर मन्दिर के पूर्वी फाटक के खुले चौक में इकट्ठी हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर के पूर्वी फाटक के पास के चौड़े स्थान में।” यूनानी पद का अधिक शाब्दिक अर्थ “चौड़े/खुले स्थान में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθη
  choice: इकट्ठी हुई
  rationale: एकवचन सामूहिक संज्ञा ‘भीड़’ के साथ यह स्वाभाविक हिन्दी है और यूनानी के अओरिस्ट कर्मवाच्य के यहाँ व्यक्त एकत्र होने के भाव को ठीक प्रकार व्यक्त करती है।
- source_word: πᾶν τὸ πλῆθος
  choice: सारी भीड़
  rationale: πᾶν सामूहिक संज्ञा की सम्पूर्णता और πλῆθος बड़ी जनसमूह-सदृश भीड़ को दर्शाता है; ‘सारी भीड़’ आधुनिक, सहज और सार्वजनिक जमावड़े के अनुकूल है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह केवल एक ही स्थान पर होने के बजाय साझा अभिप्राय और एकता का भाव रखता है; ‘एक मन होकर’ इस अर्थ को गरिमापूर्ण और सुबोध हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: खुले चौक में
  rationale: εὐρύχωρον किसी चौड़े या खुले स्थान की ओर संकेत करता है। प्रसंग में ‘खुला चौक’ स्वाभाविक है, जबकि पाद-टिप्पणी अधिक शाब्दिक स्थानगत विकल्प सुरक्षित रखती है।
- source_word: τοῦ πρὸς ἀνατολὰς
  choice: पूर्वी
  rationale: शाब्दिक अर्थ ‘पूर्व की ओर’ है; फाटक के विशेषण के रूप में ‘पूर्वी’ हिन्दी में सहज और दिशात्मक पहचान के प्रति निष्ठावान है।
- source_word: ἱεροῦ πυλῶνος
  choice: मन्दिर के ... फाटक
  rationale: ἱερόν यहाँ पवित्र मन्दिर-परिसर और πυλών प्रवेश-फाटक को सूचित करता है; ‘मन्दिर का फाटक’ अर्थ को स्पष्ट रखता है।
