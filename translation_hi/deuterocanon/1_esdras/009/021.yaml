base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/021.yaml
  text: 'And from the sons of Emer: Ananias, Zabdaios, Manes, Thamaios, Jerel, and Azarias.'
translation:
  language: hi
  text: 'और एमेर के पुत्रों में से: अननियास, जब्दायोस, मानेस, थामायोस, येरेल और अजारियास।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἐμήρ
  choice: एमेर के वंशजों में से
  rationale: वंशावली-सूची में υἱοί का आशय केवल प्रत्यक्ष पुत्रों तक सीमित नहीं भी हो सकता; इसलिए स्वाभाविक हिन्दी में ‘वंशजों’ चुना गया। Ἐμήρ का लिप्यंतरण यूनानी रूप के निकट ‘एमेर’ रखा गया।
- source_word: Ἀνανίας
  choice: हनन्याह
  rationale: यह नाम प्रचलित बाइबलीय सेमिटिक रूप हनन्याह से मेल खाता है; हिन्दी पाठकों के लिए पहचाने जाने योग्य रूप रखा गया।
- source_word: Ζαβδαῖος
  choice: जब्‍दायोस
  rationale: यूनानी नामरूप की विशिष्टता बचाने के लिए उसका निकट देवनागरी लिप्यंतरण किया गया।
- source_word: Μάνης
  choice: मानेस
  rationale: नाम को यूनानी पाठ के अनुसार ध्वन्यात्मक रूप से प्रस्तुत किया गया।
- source_word: Θαμαῖος
  choice: थामायोस
  rationale: यूनानी नामरूप का निकट लिप्यंतरण किया गया, बिना किसी अनिश्चित हिब्रू समतुल्य को थोपे।
- source_word: Ἰερεήλ
  choice: येरेल
  rationale: स्वीकार्य अंग्रेज़ी परामर्श-पाठ के Jerel और यूनानी ध्वनि—दोनों के अनुरूप संक्षिप्त हिन्दी लिप्यंतरण चुना गया।
- source_word: Ἀζαρίας
  choice: अजर्याह
  rationale: यह प्रचलित सेमिटिक-बाइबलीय नाम अजर्याह का यूनानी रूप है; हिन्दी में परिचित रूप अपनाया गया।
