base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: hi
  text: परन्तु लोग बहुत हैं, और जाड़े का मौसम है; हम खुले में खड़े नहीं रह सकेंगे[a]। यह काम एक दिन का नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में एक कठिन पदबंध है, जिसका शाब्दिक अर्थ ‘और हमने नहीं पाया’ है। इस संदर्भ में उसका आशय अनिश्चित है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया है। एज्रा 10:13 का इब्रानी समानांतर पद के समग्र आशय की पुष्टि करता है।
    reason: textual_variant
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: लोग बहुत हैं
  rationale: यह वाक्यांश एकत्र हुए लोगों की बड़ी संख्या बताता है। ‘लोग बहुत हैं’ आधुनिक हिन्दी में सहज है और यूनानी के सामूहिक अर्थ को बनाए रखता है।
- source_word: ὥρα χειμερινή
  choice: जाड़े का मौसम है
  rationale: यूनानी का शाब्दिक अर्थ ‘शीतकालीन समय/मौसम’ है। ‘जाड़े का मौसम’ प्रतिकूल मौसमी दशा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल वर्षा का अर्थ आरोपित किए।
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: हम खुले में खड़े नहीं रह सकेंगे
  rationale: ἰσχύω यहाँ सामर्थ्य अथवा सहन करने की क्षमता और αἴθριοι खुले आकाश के नीचे रहने को दर्शाता है। ‘खड़े नहीं रह सकेंगे’ लगातार बाहर टिके रहने का प्रसंगगत भाव देता है।
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: यह काम एक दिन का नहीं है
  rationale: यह स्वाभाविक हिन्दी में यूनानी की संबंधकारक रचना को निकटता से रखता है और बताता है कि कार्य एक ही दिन में पूरा होने वाला नहीं है।
- source_word: καὶ οὐχ εὕρομεν
  choice: मुख्य पाठ में अनूदित नहीं
  rationale: प्राप्त यूनानी में इसका शाब्दिक अर्थ ‘और हमने नहीं पाया’ है, पर इस प्रसंग में वाक्य अपूर्ण या दूषित प्रतीत होता है। अर्थ गढ़ने के बजाय कठिनाई को पादटिप्पणी में पारदर्शी ढंग से बताया गया है।
theological_decisions:
- issue: कठिन यूनानी पदबंध के साथ इब्रानी समानांतर का उपयोग
  choice: मुख्य पाठ में यूनानी के सुनिश्चित अर्थ को रखा और कठिन पदबंध को पादटिप्पणी में बताया
  alternative: हर यूनानी शब्द का यांत्रिक अनुवाद करना, या एज्रा 10:13 के इब्रानी पाठ के अनुसार वाक्य को पुनर्निर्मित करना
  rationale: यूनानी प्राथमिक आधार है, पर καὶ οὐχ εὕρομεν इस संदर्भ में अस्पष्ट है। इब्रानी समानांतर समग्र प्रसंग की पुष्टि करता है, लेकिन उससे अनुपस्थित सामग्री मुख्य पाठ में आयात नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘जाड़े का मौसम’ ने यूनानी χειμερινή की शीतकालीन/प्रतिकूल मौसम वाली व्यापकता को सुरक्षित रखा है।
