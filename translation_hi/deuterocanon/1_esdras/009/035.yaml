  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण सूची-शैली वाला रूप। अपरिचित व्यक्तिनामों को यूनानी स्रोत से सीधे और पाठक-सुलभ देवनागरी में लिप्यंतरित किया गया है; मसोरेटिक समानांतर के आधार पर सूची को बदला नहीं गया।
