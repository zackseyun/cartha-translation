base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: hi
  text: 'ओओमा के वंशजों में से: ज़ेइतियास[a], ज़बदायास, एदोस, ऊएल[b] और बनायास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ इन नामों को अलग-अलग देता है; इसके लगभग समानांतर मसोरेटिक पाठ (एज्रा 10) में इस स्थान पर यही सूची सुरक्षित नहीं है, बल्कि यह खंड एक सार-वाक्य के साथ समाप्त होता है।
    reason: cross_reference
  - marker: b
    text: यूनानी पाठ में ये व्यक्तियों के नाम हैं। ‘ओओमा के वंशजों’ से उस परिवार या कुल-समूह का भाव स्पष्ट किया गया है जो यूनानी वाक्य-विन्यास में निहित है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν Ὀομά
  choice: ओओमा के वंशजों में से
  rationale: ἐκ उपसमूह का संकेत करता है और बहुवचन लेख τῶν के साथ नाम पारिवारिक या कुल-समूह को सूचित करता है। शाब्दिक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘वंशजों में से’ चुना गया।
- source_word: Ζειτιάς
  choice: ज़ेइतियास
  rationale: स्वीटे के यूनानी रूप का निकट देवनागरी लिप्यंतरण; ει को ‘ेइ’ से दर्शाया गया है।
- source_word: Ζαβαδαίας
  choice: ज़बदायास
  rationale: नाम को प्रचलित इब्रानी रूप में बदलने के बजाय यूनानी पाठ के अनुसार लिप्यंतरित किया गया है।
- source_word: Ἠδός
  choice: एदोस
  rationale: यूनानी नाम का सरल और पठनीय देवनागरी लिप्यंतरण।
- source_word: Οὐὴλ
  choice: ऊएल
  rationale: Οὐ- की ध्वनि को ‘ऊ’ और शेष नाम को ‘एल’ से प्रस्तुत करते हुए यूनानी रूप के निकट रखा गया है।
- source_word: Βαναίας
  choice: बनायास
  rationale: इसे परिचित इब्रानी नाम ‘बनायाह’ के अनुरूप बनाने के बजाय उपलब्ध यूनानी रूप से सीधे लिप्यंतरित किया गया है।
