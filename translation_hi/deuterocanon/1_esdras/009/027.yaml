base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/027.yaml
  text: 'From the sons of Elah: Mattan and Zechariah[a], Jezrikilus and Obadiah and Jeremoth and Aedeias.'
translation:
  language: hi
  text: 'एला के वंशजों में से: मत्तान और ज़करियास,[a] येज़्रीकिलोस, ओआब्दियोस, येरेमोथ और आएदेयास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के कई नाम यूनानी पाठ के निकट लिप्यंतरण में दिए गए हैं, क्योंकि 1 एसद्रास में नामों की वर्तनी और क्रम कभी-कभी समानांतर हिब्रू पाठ से भिन्न होते हैं; इनमें से कुछ नामों के अधिक परिचित हिब्रू-आधारित रूप भी संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के वंशजों में से
  rationale: यह पदबंध बड़ी नामावली के भीतर एक वंशगत समूह का परिचय देता है। ‘में से’ यूनानी ἐκ का भाव रखता है और ‘वंशज’ हिन्दी में सूची के प्रसंग में स्वाभाविक है।
- source_word: Ἠλά
  choice: एला
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण; अनिश्चित हिब्रू सामंजस्य नहीं थोपा गया।
- source_word: Ματαν
  choice: मत्तान
  rationale: यूनानी रूप का निकट लिप्यंतरण, जिसमें व्यंजन की ध्वनि स्पष्ट रखी गई है।
- source_word: Ζαχαρίας
  choice: ज़करियास
  rationale: परिचित हिब्रू-आधारित रूप ‘जकर्याह’ के बजाय प्राथमिक यूनानी रूप की समाप्ति और ध्वनि को सुरक्षित रखा गया है।
- source_word: Ἰεζρίκιλος
  choice: येज़्रीकिलोस
  rationale: यह दुर्लभ और पाठगत रूप से कठिन नाम है; अनुमानित हिब्रू समकक्ष से मिलाने के बजाय यूनानी का निकट लिप्यंतरण किया गया है।
- source_word: Ὠαβδίος
  choice: ओआब्दियोस
  rationale: ‘ओबद्याह’ जैसे अधिक परिचित रूप से सामंजस्य न करके उपलब्ध यूनानी अक्षरक्रम और अंत्यरूप को दर्शाया गया है।
- source_word: Ἱερεμὼθ
  choice: येरेमोथ
  rationale: यूनानी नाम का सीधा और हिन्दी में पठनीय लिप्यंतरण।
- source_word: Ἀηδείας
  choice: आएदेयास
  rationale: दुर्लभ यूनानी रूप को निकटता से सुरक्षित रखा गया है; संभावित हिब्रू-आधारित पहचान अनिश्चित है।
