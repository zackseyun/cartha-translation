  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
translation:
  language: hi
  text: क्योंकि जिन वचनों की शिक्षा उन्हें दी गई थी, उनमें भी वे प्रेरित हुए[a][b], और वे एकत्र किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘प्रेरित हुए’ के लिए प्रयुक्त यूनानी क्रिया असामान्य है। इसका अधिक शाब्दिक भाव ‘अंदर तक भर दिए गए’ या ‘प्राण फूँके गए’ हो सकता है; इसे ‘समझ दी गई’ अथवा ‘शिक्षित किए गए’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: नहेमायाह 8:13 के इब्रानी समानांतर में अधिक सीधे ढंग से कहा गया है कि वे ‘व्यवस्था के वचनों को समझने के लिए’ एकत्र हुए। 1 एस्द्रास में यही प्रसंग संक्षिप्त यूनानी रूप में है।
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पूर्ववर्ती कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ यूनानी संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ इसका बल योगसूचक है; ‘भी’ हिंदी में इस अर्थ को सहज रूप से प्रकट करता है।
- source_word: ἐνεφυσιώθησαν
  choice: प्रेरित हुए
  rationale: यह असामान्य क्रिया भीतर कुछ भरे या फूँके जाने से उत्पन्न प्रेरणा का भाव दे सकती है। ‘प्रेरित हुए’ उस रूपक को पूरी तरह कठोर नहीं बनाता और यूनानी कर्मवाच्य को बनाए रखता है; संभावित ‘समझ प्राप्त की/शिक्षित हुए’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἐν τοῖς ῥήμασιν
  choice: उन वचनों से
  rationale: संदर्भ में ῥήματα शिक्षण के वचनों को दर्शाता है। साधन अथवा प्रभाव बताने के लिए हिंदी में ‘से’ स्वाभाविक है, यद्यपि यूनानी ἐν का शाब्दिक रूप ‘में’ है।
- source_word: οἷς ἐδιδάχθησαν
  choice: जिन वचनों की उन्हें शिक्षा दी गई थी
  rationale: यह सापेक्ष उपवाक्य पहले बताए गए वचनों को शिक्षा की विषयवस्तु ठहराता है और यूनानी कर्मवाच्य तथा पूर्वकालिक संबंध को सुरक्षित रखता है।
- source_word: ἐπισυνήχθησαν
  choice: वे एकत्र किए गए
  rationale: यूनानी क्रिया कर्मवाच्य है। यह अनुवाद उस रूप को बनाए रखता है, जबकि इब्रानी समानांतर का ‘वे एकत्र हुए’ पाठ पादटिप्पणी में बताया गया है।
