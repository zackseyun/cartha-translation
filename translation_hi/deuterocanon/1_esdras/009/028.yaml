base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: hi
  text: और ज़ामोथ के वंशजों में से एलियादास[a], एलेइआसेइमोस, ओथोनियास, यारिमोथ, साबादोस[b] और ज़ेरालियास।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के कई नामों के यूनानी रूप समानांतर इब्रानी परंपरा से भिन्न हो सकते हैं। यहाँ सूची को एज्रा/नहेमायाह के अनुरूप बनाने के बजाय 1 एस्द्रास के यूनानी पाठ का अनुसरण किया गया है।
    reason: alternative_reading
  - marker: b
    text: उपलब्ध स्रोत-प्रतिलेखन में मामूली असंगति दर्ज होने के कारण कुछ व्यक्तिनामों की वर्तनी थोड़ी अनिश्चित है; यहाँ दिए गए यूनानी साक्ष्य का सावधानीपूर्ण लिप्यंतरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ζαμόθ
  choice: ज़ामोथ के वंशजों में से
  rationale: वंश-सूची के इस संदर्भ में ἐκ सदस्यता दर्शाता है और υἱοί किसी कुल के वंशजों के अर्थ में है; इसलिए शाब्दिक ‘पुत्रों में से’ के बजाय स्वाभाविक हिंदी ‘वंशजों में से’ चुना गया।
- source_word: Ἐλιάδας
  choice: एलियादास
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण किया गया है; इसे समानांतर इब्रानी परंपरा के किसी नाम से नहीं मिलाया गया।
- source_word: Ἐλειάσειμος
  choice: एलियासेइमोस
  rationale: दृश्य यूनानी अक्षरक्रम को सावधानी से सुरक्षित रखने वाला लिप्यंतरण चुना गया है, क्योंकि नाम असामान्य है और स्रोत-सत्यापन में मामूली असंगति दर्ज है।
- source_word: Ὀθονίας
  choice: ओथोनियास
  rationale: यूनानी रूप और उसके अंतिम प्रत्यय को बनाए रखते हुए सीधा देवनागरी लिप्यंतरण किया गया।
- source_word: Ἰαριμώθ
  choice: यारिमोथ
  rationale: यूनानी आरंभिक Ἰα- को हिंदी में स्वाभाविक ‘या-’ से दर्शाया गया और नाम के यूनानी रूप को सुरक्षित रखा गया।
- source_word: Σάβαδος
  choice: साबादोस
  rationale: प्रधान यूनानी साक्ष्य का सीधा लिप्यंतरण किया गया; संभावित इब्रानी-संगत ‘ज़ाबाद’ से सामंजस्य नहीं बैठाया गया।
- source_word: Ζεραλίας
  choice: ज़ेरालियास
  rationale: यूनानी नाम को प्रत्यक्ष रूप से लिप्यंतरित किया गया है; किसी अनुमानित इब्रानी समकक्ष को पाठ में नहीं रखा गया।
