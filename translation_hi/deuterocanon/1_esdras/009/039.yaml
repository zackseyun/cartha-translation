base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: hi
  text: और उसने एज्रा, जो याजक और पाठक था, से कहा कि वह मूसा की वह व्यवस्था ले आए, जो इस्राएल के परमेश्वर के द्वारा दी गई थी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पाठक’ का अर्थ यहाँ अधिक विशेष रूप से ‘सभा में पढ़कर सुनाने वाला’ भी हो सकता है। कुछ अनुवादों में ‘शास्त्री’ है, पर यूनानी शब्द सीधे तौर पर पढ़ने वाले व्यक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो इस्राएल के परमेश्वर के द्वारा सौंपी गई थी।” यूनानी शब्द देने के साथ-साथ सौंपे जाने या आगे पहुँचाए जाने पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: से कहा कि वह ... ले आए
  rationale: सामान्य अर्थ ‘कहा’ है; इसके साथ आए infinitive κομίσαι को हिन्दी में स्वाभाविक परोक्ष निर्देश के रूप में व्यक्त किया गया है। ‘आज्ञा दी’ कहना मूल से अधिक प्रबल होता।
- source_word: Ἔσρᾳ
  choice: एज्रा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: τῷ ἱερεῖ
  choice: याजक
  rationale: यह एज्रा के पद को बताता है; हिन्दी में नाम के बाद पद रखते समय पृथक निश्चित उपपद की आवश्यकता नहीं है।
- source_word: ἀναγνώστῃ
  choice: पाठक
  rationale: यूनानी संज्ञा मुख्यतः पढ़ने या पढ़कर सुनाने वाले व्यक्ति को दर्शाती है। इसे ‘शास्त्री’ कहने से ऐसा अर्थ जुड़ सकता है जो यहाँ प्रयुक्त शब्द में सीधे नहीं है।
- source_word: κομίσαι
  choice: ले आए
  rationale: प्रसंग में व्यवस्था को लोगों के सामने लाने का भाव है। ‘ले आए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τὸν νόμον Μωυσέως
  choice: मूसा की ... व्यवस्था
  rationale: यह यूनानी संबंधकारक रचना का पारदर्शी और परंपरागत हिन्दी रूप है तथा νόμος के लिए बाइबलीय संदर्भ में ‘व्यवस्था’ उपयुक्त है।
- source_word: τὸν παραδοθέντα
  choice: जो ... दी गई थी
  rationale: παραδίδωμι सौंपने, प्रदान करने या आगे पहुँचाने का भाव रख सकता है। मुख्य पाठ में सहज ‘दी गई’ रखा गया है और संप्रेषण के वैकल्पिक बल को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर के द्वारा
  rationale: निष्क्रिय participle के साथ ὑπό कर्ता/अभिकर्ता को चिह्नित करता है; ‘के द्वारा’ उस संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: व्यवस्था का मूसा और परमेश्वर से संबंध
  choice: मूसा की वह व्यवस्था, जो इस्राएल के परमेश्वर के द्वारा दी गई थी
  alternative: इस्राएल के परमेश्वर द्वारा मूसा के माध्यम से दी गई व्यवस्था
  rationale: यूनानी पाठ व्यवस्था को मूसा से संबद्ध करता है और परमेश्वर को उसे देने/सौंपने वाला बताता है। ‘मूसा के माध्यम से’ अर्थ की संभावित व्याख्या है, पर इस वाक्य में स्पष्ट रूप से नहीं कहा गया; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘याजक’, ‘व्यवस्था’ और ‘इस्राएल के परमेश्वर’ जैसे परिचित बाइबलीय पद बनाए रखे गए हैं। ‘पाठक’ मूल यूनानी की विशिष्ट भूमिका को सुरक्षित रखता है; संभावित सार्वजनिक पाठ का अर्थ पादटिप्पणी में स्पष्ट किया गया है।
