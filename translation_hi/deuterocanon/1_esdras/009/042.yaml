base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: hi
  text: और एज्रा याजक और व्यवस्था का पाठक उस लकड़ी के मंच पर खड़ा हुआ, जो बनाया गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नहेमायाह 8:4 के इब्रानी समानांतर पाठ में ‘एज्रा शास्त्री’ लिखा है और कहा गया है कि लकड़ी का ढाँचा ‘इस काम के लिए’ या ‘इस अवसर के लिए’ बनाया गया था। इसके विपरीत, 1 एस्द्रास के यूनानी पाठ में ‘याजक और व्यवस्था का पाठक’ लिखा है और केवल इतना कहा गया है कि मंच बनाया गया था।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: खड़ा हुआ
  rationale: ἵστημι का यह कथात्मक एओरिस्ट है; ‘खड़ा हुआ’ स्वाभाविक हिन्दी है और समानांतर इब्रानी ויעמד के भी अनुरूप है।
- source_word: Ἔσρας
  choice: एज्रा
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय प्रचलित रूप।
- source_word: ὁ ἱερεύς
  choice: याजक
  rationale: यूनानी पाठ एज्रा को स्पष्ट रूप से याजक कहता है; इसे इब्रानी समानांतर के ‘शास्त्री’ से मिलाने के लिए बदला नहीं गया।
- source_word: ἀναγνώστης τοῦ νόμου
  choice: व्यवस्था का पाठक
  rationale: ἀναγνώστης का अर्थ पाठक, विशेषकर सार्वजनिक रूप से पढ़ने वाला, है। यह यूनानी की विशिष्ट अभिव्यक्ति को बनाए रखता है और इब्रानी ‘शास्त्री’ को मुख्य पाठ में आयात नहीं करता।
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: उस लकड़ी के मंच पर
  rationale: βῆμα यहाँ सार्वजनिक पाठ के लिए ऊँचे मंच को दर्शाता है; ‘लकड़ी का मंच’ स्पष्ट और आधुनिक हिन्दी है।
- source_word: τοῦ κατασκευασθέντος
  choice: जो बनाया गया था
  rationale: कृदंत मंच के पहले से बना दिए जाने को व्यक्त करता है। ‘बनाया गया था’ भौतिक निर्माण के लिए सहज हिन्दी है।
