  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: hi
  text: ये सब दूसरे लोगों की स्त्रियों के साथ रहते थे[a], और उन्होंने उन स्त्रियों को बच्चों समेत भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, समानांतर इब्रानी पाठ के अनुसार अधिक स्पष्ट रूप से, “पराई स्त्रियों से विवाह किया था” अथवा “पराई पत्नियाँ ब्याह ली थीं।”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: इन सबने
  rationale: यूनानी में ‘पुरुष’ स्पष्ट नहीं है; हिन्दी में कर्ता और क्रिया का संबंध स्वाभाविक रखने के लिए ‘इन सबने’ चुना गया।
- source_word: συνῴκησαν
  choice: के साथ घर बसाया था
  rationale: क्रिया का मूल अर्थ साथ रहना या सहवास करना है। ‘घर बसाया था’ वैवाहिक प्रसंग का संकेत देता है, पर मुख्य पाठ में ‘विवाह किया था’ जितना स्पष्ट अर्थ आरोपित नहीं करता।
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: पराए लोगों की स्त्रियों
  rationale: ἀλλογενής का अर्थ दूसरे कुल या लोगों से संबंधित है। ‘पराए लोगों की’ केवल आधुनिक राष्ट्रीयता वाले ‘विदेशी’ अर्थ से अधिक व्यापक और प्रसंगानुकूल है; γυναῖξιν का सीधा अर्थ ‘स्त्रियों’ है।
- source_word: ἀπέλυσαν
  choice: विदा कर दिया
  rationale: यह क्रिया छोड़ देने, मुक्त करने या भेज देने के अर्थ में आती है। ‘विदा कर दिया’ यहाँ स्वाभाविक है और किसी बाद की तकनीकी तलाक-संबंधी शब्दावली को अनावश्यक रूप से नहीं जोड़ता।
- source_word: αὐτὰς
  choice: उन स्त्रियों को
  rationale: सर्वनाम का संकेत स्पष्ट करने के लिए हिन्दी में पूर्ववर्ती स्त्रियों को दोहराया गया है; इससे बच्चों को भेजने का भ्रामक अर्थ नहीं निकलता।
- source_word: σὺν τέκνοις
  choice: बच्चों समेत
  rationale: यूनानी में स्वत्वसूचक शब्द नहीं है। ‘बच्चों समेत’ उसी तटस्थता को बनाए रखता है और बच्चों को स्त्रियों के साथ भेजे जाने की बात स्पष्ट करता है।
theological_decisions:
- issue: संबंध को स्पष्ट विवाह के रूप में व्यक्त करना या यूनानी की व्यापक ‘साथ रहने’ वाली अभिव्यक्ति बनाए रखना
  choice: मुख्य पाठ में ‘के साथ घर बसाया था’
  alternative: ‘पराई स्त्रियों से विवाह किया था’ अथवा ‘पराई पत्नियाँ ब्याह ली थीं’
  rationale: प्राथमिक यूनानी पाठ συνῴκησαν कहता है, जिसका सीधा अर्थ साथ रहना है; समानांतर इब्रानी पाठ वैवाहिक संबंध को अधिक स्पष्ट करता है। चुनी हुई हिन्दी वैवाहिक संदर्भ को सुनाई देती है, पर यूनानी की शब्दगत व्यापकता को पूरी तरह समाप्त नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘विदेशी स्त्रियाँ’ के बजाय ‘पराए लोगों की स्त्रियाँ’ चुना गया, ताकि अलग जाति या समुदाय से होने का यूनानी भाव केवल आधुनिक राष्ट्रीयता तक सीमित न हो।
