base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: hi
  text: और वह भोर से दोपहर तक मन्दिर के फाटक के सामने के खुले स्थान[a] में पुरुषों और स्त्रियों के सम्मुख पढ़ता रहा; और उन सबने व्यवस्था पर पूरा ध्यान लगाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर के फाटक के सामने के चौड़े स्थान में।” यूनानी शब्द किसी चौड़े या प्रशस्त स्थान को बताता है; यहाँ उसका ठीक प्रकार—जैसे चौक या आँगन—निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, “उन्होंने अपना पूरा मन व्यवस्था की ओर लगाया,” अर्थात उन्होंने पूरी एकाग्रता से ध्यान दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: पढ़ता रहा
  rationale: अपूर्ण भूतकाल दी गई समयावधि में जारी क्रिया दर्शाता है। सार्वजनिक प्रसंग में सुनाकर पढ़ना निहित हो सकता है, पर यूनानी क्रिया में ‘ऊँचे स्वर से’ स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: ἐν τῷ πρὸ τοῦ ἱεροῦ πυλῶνος εὐρυχώρῳ
  choice: मन्दिर के फाटक के सामने के खुले स्थान में
  rationale: εὐρύχωρος किसी चौड़े या प्रशस्त स्थान को दर्शाता है। ‘खुला स्थान’ स्वाभाविक हिन्दी है और उसे अनिवार्य रूप से ‘चौक’ या ‘आँगन’ नहीं ठहराता। πρὸ ... πυλῶνος स्थान को फाटक के सामने बताता है।
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: भोर से दोपहर तक
  rationale: यह अनुवाद आरम्भ और समाप्ति—भोर तथा मध्याह्न—दोनों को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: पुरुषों और स्त्रियों के सम्मुख
  rationale: यूनानी पाठ दोनों समूहों का स्पष्ट उल्लेख करता है; ‘सम्मुख’ सार्वजनिक उपस्थिति का भाव बनाए रखता है।
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  choice: उन सबने ... पूरा ध्यान लगाया
  rationale: यूनानी मुहावरा मन को पूरी तरह किसी ओर लगाने का भाव देता है। हिन्दी में ‘पूरा ध्यान लगाया’ एकाग्रता को स्वाभाविक ढंग से व्यक्त करता है, और ‘उन सबने’ सामूहिक व्यापकता बनाए रखता है।
- source_word: εἰς τὸν νόμον
  choice: व्यवस्था पर
  rationale: νόμος यहाँ पढ़ी जा रही धार्मिक व्यवस्था को सूचित करता है। ‘व्यवस्था’ बाइबिलीय हिन्दी में अर्थपूर्ण है, जबकि यूनानी पाठ में ‘पुस्तक’ जैसा कोई अतिरिक्त शब्द नहीं है।
theological_decisions:
- issue: νόμος को औपचारिक ग्रन्थ-शीर्षक मानना
  choice: व्यवस्था
  alternative: मूसा की व्यवस्था / व्यवस्था की पुस्तक
  rationale: प्रसंग में मूसा की व्यवस्था अभिप्रेत हो सकती है, पर यूनानी में केवल τὸν νόμον है। मुख्य पाठ में अतिरिक्त पहचान या ‘पुस्तक’ जोड़ने से बचा गया है।
- issue: श्रोताओं का लैंगिक उल्लेख
  choice: पुरुषों और स्त्रियों
  alternative: लोगों / सभा
  rationale: मूल पाठ पुरुषों और स्त्रियों दोनों को अलग-अलग स्पष्ट करता है; सामान्यीकृत शब्द उस विशेषता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पढ़ता रहा’ से यूनानी अपूर्ण भूतकाल की निरन्तरता आती है। ‘मन्दिर’, ‘सम्मुख’ और ‘व्यवस्था’ जैसे शब्द औपचारिकता बनाए रखते हैं, पर वाक्य-संरचना साधारण पाठक के लिए स्पष्ट है।
