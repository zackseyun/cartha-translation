  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: hi
  text: और याजक एज्रा ने अपने लिए उन पुरुषों को चुना जो अपने-अपने पितृकुलों के मुखिया थे, और उन सभी को नाम लेकर चुना। दसवें महीने के पहले दिन[a] वे इस मामले की जाँच करने के लिए एकत्र हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दसवें महीने के नए चाँद के दिन,” अर्थात महीने के पहले दिन।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο αὐτῷ
  choice: अपने लिए ... चुना
  rationale: मध्यवाच्य और αὐτῷ चयन में एज्रा की व्यक्तिगत भूमिका तथा उसके उद्देश्य का संकेत देते हैं; हिन्दी में यह अभिव्यक्ति उस सूक्ष्मता को बनाए रखती है।
- source_word: ἄνδρας ἡγουμένους τῶν πατριῶν αὐτῶν
  choice: उन पुरुषों को ... जो अपने-अपने पितृकुलों के मुखिया थे
  rationale: ἄνδρας का पुरुषवाचक अर्थ और πατριῶν की पितृवंशीय पारिवारिक संरचना दोनों सुरक्षित हैं; 'पितृकुलों के मुखिया' प्रशासनिक और वंशावली-संबंधी संदर्भ में स्वाभाविक है।
- source_word: πάντας κατ’ ὄνομα
  choice: उन सबको नाम से नियुक्त किया गया था
  rationale: यह वाक्यांश चुने गए पुरुषों के औपचारिक नामांकन को दर्शाता है; 'नाम से नियुक्त' केवल पहचानने की अपेक्षा प्रशासनिक भाव अधिक स्पष्ट करता है।
- source_word: συνεκλείσθησαν
  choice: एकत्र हुए
  rationale: क्रिया का शाब्दिक अर्थ साथ बंद किए जाने तक जा सकता है, पर यहाँ जाँच के लिए औपचारिक रूप से इकट्ठा होने का प्रासंगिक अर्थ है।
- source_word: τῇ νουμηνίᾳ τοῦ μηνὸς τοῦ δεκάτου
  choice: दसवें महीने के पहले दिन
  rationale: νουμηνία नए चाँद अथवा नए महीने के दिन को दर्शाता है; मुख्य पाठ में स्पष्ट कालदर्शकीय अर्थ दिया गया है और अधिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: ἐτάσαι τὸ πρᾶγμα
  choice: इस मामले की जाँच करने के लिए
  rationale: ἐτάσαι औपचारिक पड़ताल का उद्देश्य बताता है और πρᾶγμα विषय को सामान्य रखता है; 'मामले की जाँच' न्यायिक-प्रशासनिक संदर्भ में सहज है।
theological_decisions:
- issue: पुरुषवाचक प्रशासनिक भाषा
  choice: उन पुरुषों को ... जो अपने-अपने पितृकुलों के मुखिया थे
  alternative: परिवारों के अगुओं को
  rationale: यूनानी पाठ स्पष्ट रूप से ἄνδρας और पितृवंशीय πατριῶν का प्रयोग करता है। अनावश्यक रूप से लिंग-तटस्थ किए बिना मूल की सामाजिक और वंशावली-संबंधी भाषा रखी गई है।
- issue: νουμηνία का कालदर्शकीय अर्थ
  choice: दसवें महीने के पहले दिन
  alternative: दसवें महीने के नए चाँद के दिन
  rationale: यहाँ मुख्य बल बैठक की तारीख पर है, किसी उपासना-विधि पर नहीं। अतः आधुनिक हिन्दी में स्पष्ट तारीख मुख्य पाठ में है, जबकि शाब्दिक छवि पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली अपनाई गई है। 'एज्रा', 'याजक', 'पितृकुल' और 'मुखिया' जैसे शब्द स्रोत की ऐतिहासिक-प्रशासनिक संरचना को सामान्य पाठक के लिए समझने योग्य रखते हैं।
