base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: hi
  text: तब एज्रा खड़े हुए और उनसे कहा, “तुमने व्यवस्था का उल्लंघन किया है और दूसरे लोगों की स्त्रियों से विवाह किया है[a], और इस्राएल के पाप में और वृद्धि की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दूसरे लोगों की स्त्रियों के साथ रहे हो” या “उनके साथ घर बसाया है”; इस प्रसंग में आशय उनसे वैवाहिक संबंध बनाने का है।
    reason: यूनानी क्रिया के शाब्दिक ‘साथ रहने’ के अर्थ और प्रसंगगत वैवाहिक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀναστὰς
  choice: खड़े होकर
  rationale: यह ἀνίστημι का कृदन्त है और एज्रा के बोलने से पहले उठ खड़े होने की कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠνομήσατε
  choice: व्यवस्था का उल्लंघन किया है
  rationale: ἀνομέω का अर्थ व्यवस्था के विरुद्ध आचरण करना है। यह अनुवाद सामान्य ‘पाप किया’ की अपेक्षा उसके व्यवस्था-संबंधी बल को स्पष्ट रखता है।
- source_word: συνῳκίσατε
  choice: विवाह किया है
  rationale: क्रिया का शाब्दिक संबंध साथ रहने या घर बसाने से है, पर इस प्रसंग में यह पराए लोगों की स्त्रियों के साथ वैवाहिक संबंध बनाने को सूचित करती है। मुख्य पाठ में ‘विवाह किया’ आधुनिक हिन्दी में सबसे स्पष्ट और स्वाभाविक है; शाब्दिक गुंजाइश पाद-टिप्पणी में रखी गई है।
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: पराए लोगों की स्त्रियों
  rationale: ἀλλογενής का आशय किसी दूसरे जनसमूह से संबंधित होना है। यह वाक्यांश जातीय-सामुदायिक अर्थ को रखता है और ‘अन्यजाति’ जैसे संभावित धार्मिक पारिभाषिक भार से बचता है।
- source_word: προσθεῖναι ἁμαρτίαν τῷ Ἰσραήλ
  choice: जिससे इस्राएल के पाप में और वृद्धि हुई है
  rationale: यह अनुवाद जोड़ने या बढ़ाने के भाव तथा सामूहिक ‘इस्राएल’ पर पड़ने वाले परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: συνῳκίσατε में वैवाहिक अर्थ को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘विवाह किया है’
  alternative: ‘साथ रहे हो’ या ‘घर बसाया है’
  rationale: यूनानी क्रिया साथ रहने का शब्दचित्र रखती है, किंतु एज्रा के प्रसंग में वैवाहिक संघ अभिप्रेत है। पाद-टिप्पणी शाब्दिक अर्थ को सुरक्षित रखते हुए मुख्य पाठ को अस्पष्ट होने से बचाती है।
- issue: इस्राएल के पाप का सामूहिक स्वरूप
  choice: ‘इस्राएल के पाप में और वृद्धि हुई है’
  alternative: ‘इस्राएल पर दोष बढ़ाया है’
  rationale: यूनानी पाठ व्यक्तिगत अपराध को पूरे इस्राएल के सामूहिक पाप से जोड़ता है। चुना हुआ पाठ इस सामूहिक आयाम को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
- issue: प्रस्तावित उद्देश्य या परिणाम के रूप में προσθεῖναι
  choice: परिणाम-सूचक ‘जिससे’
  alternative: ‘इस्राएल के पाप को बढ़ाने के लिए’
  rationale: अनन्त क्रिया उद्देश्य अथवा परिणाम की छाया दे सकती है। यहाँ प्रसंग में परिणाम अधिक स्वाभाविक है, पर अनुवाद इस कृत्य के फल को ही व्यक्त करता है, उनके सचेत उद्देश्य का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक-पैगंबरी लहजा रखा गया है। ‘व्यवस्था का उल्लंघन’ मूल के कानून-विरोधी भाव को और ‘पराए लोगों की स्त्रियाँ’ जातीय-सामुदायिक संदर्भ को स्पष्ट करता है।
