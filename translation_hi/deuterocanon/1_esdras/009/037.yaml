base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: hi
  text: और याजक, लेवी और इस्राएल के लोग सातवें महीने के नवचंद्र के दिन यरूशलेम और देहात में रहने लगे[a], और इस्राएली अपनी-अपनी बस्तियों में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवास करने लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῴκησαν
  choice: रहने लगे
  rationale: यह κατοικέω के भूतकालीन रूप का स्वाभाविक हिन्दी अनुवाद है और किसी स्थान पर बसने या निवास करने का भाव व्यक्त करता है।
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: इस्राएल के लोगों में से कुछ
  rationale: यह याजकों और लेवियों से अलग सामान्य इस्राएली लोगों की ओर संकेत करता है तथा बाद के οἱ υἱοὶ Ἰσραήλ से यूनानी पाठ में मौजूद अभिव्यक्तिगत भेद को बनाए रखता है। 'कुछ' यूनानी निश्चित पदबंध के समूहगत आशय को सहज हिन्दी में व्यक्त करता है, न कि उनकी संख्या निश्चित करता है।
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: यरूशलेम और देहात में
  rationale: χώρα यहाँ नगर यरूशलेम के विपरीत गैर-नगरीय क्षेत्र को दर्शाता है; 'देहात' आधुनिक हिन्दी में इस भौगोलिक विरोध को स्पष्ट करता है।
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: सातवें महीने के नवचंद्र के दिन
  rationale: νουμηνία नए चाँद अथवा उससे चिह्नित महीने के पहले दिन को बताता है। 'नवचंद्र के दिन' मूल की विशिष्टता को बनाए रखता है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: यह पदबंध इस्राएल की प्रजा का सामूहिक नाम है। आधुनिक हिन्दी में 'इस्राएली' स्वाभाविक और समावेशी है, जबकि शब्दशः 'इस्राएल के पुत्र' यहाँ अनावश्यक रूप से केवल पुरुषों का बोध करा सकता है।
- source_word: κατοικίαις
  choice: अपनी-अपनी बस्तियों
  rationale: κατοικία निवास-स्थान या बसावट को दर्शाता है। बहुवचन में 'बस्तियों' इसका सामूहिक भौगोलिक अर्थ देता है, और 'अपनी-अपनी' αὐτῶν के वितरणात्मक भाव को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: इस पद के यूनानी पाठ और नहेमायाह 8:1 के अनुमानित इब्रानी समानांतर का संबंध
  choice: सातवें महीने के नवचंद्र तथा निवास-स्थानों से संबंधित यूनानी क्रम का अनुवाद करना
  alternative: पाठ को पानी फाटक के सामने लोगों के एक मनुष्य के समान इकट्ठा होने वाले इब्रानी समानांतर के अनुरूप बनाना
  rationale: इस पुस्तक के लिए 1 एस्द्रास का यूनानी पाठ प्राथमिक स्रोत है। दिया गया इब्रानी समानांतर इस स्थान पर पर्याप्त रूप से भिन्न है, इसलिए उससे यूनानी पाठ का सामंजस्य नहीं किया गया।
- issue: οἱ υἱοὶ Ἰσραήλ का सामूहिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह वाचा-समुदाय का रूढ़ सामूहिक पद है; 'इस्राएली' आधुनिक हिन्दी में पूरे समुदाय को स्वाभाविक ढंग से व्यक्त करता है और किसी अतिरिक्त सांप्रदायिक अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी वाक्य की संभावित विराम-अस्पष्टता को हिन्दी में दो वाक्यों द्वारा रखा गया है, जिससे नवचंद्र का समय दूसरे खंड से स्वाभाविक रूप से जुड़ता है; मूल में इसे पहले खंड से जोड़ना भी व्याकरणतः संभव है। तकनीकी किंतु समझने योग्य 'नवचंद्र' को मूल की स्पष्ट चंद्र-सूचना बनाए रखने के लिए रखा गया है।
