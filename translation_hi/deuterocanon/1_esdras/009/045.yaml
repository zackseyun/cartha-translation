  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। 'भीड़' की अपेक्षा 'बड़ी सभा' जुटे हुए सार्वजनिक समुदाय के प्रसंग के अनुकूल है। वाक्य की कारणसूचक संरचना और यूनानी में 'सामने' की पुनरावृत्ति सुरक्षित रखी गई है।
