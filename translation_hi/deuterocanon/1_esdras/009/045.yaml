base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: hi
  text: और एज्रा ने उस बड़ी सभा के सामने पुस्तक[a] उठाई, क्योंकि वह उन सबके सामने सम्मान के स्थान पर बैठा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “पुस्तक” है; ऐतिहासिक रूप से इससे ग्रंथ-पट भी अभिप्रेत हो सकता है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “प्रमुखता से बैठा था” या “प्रतिष्ठित ढंग से बैठा था” भी हो सकता है; यूनानी शब्द सार्वजनिक रूप से विशिष्ट और सम्मानित स्थिति का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβών
  choice: उठाई
  rationale: यह कृदन्त किसी वस्तु को हाथ में लेने या उठाने का बोध देता है; यहाँ पुस्तक को हाथ में उठाना स्वाभाविक है, बिना किसी अनकहे आनुष्ठानिक अर्थ को जोड़े।
- source_word: τὸ βιβλίον
  choice: पुस्तक
  rationale: βιβλίον का सीधा अर्थ पुस्तक है; ऐतिहासिक रूप से यह पुस्तक-रोल या ग्रंथ-पट हो सकता था, इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: τοῦ πλήθους
  choice: बड़ी सभा
  rationale: πλῆθος बड़ी संख्या में एकत्र लोगों को दर्शाता है। 'बड़ी सभा' सार्वजनिक रूप से जुटे समुदाय का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον
  choice: सामने
  rationale: दोनों प्रयोगों में सार्वजनिक उपस्थिति और दृश्य स्थिति का संकेत है; 'सामने' हिन्दी में स्वाभाविक है।
- source_word: προεκάθητο
  choice: बैठा था
  rationale: अपूर्ण काल उसकी उस समय जारी बैठी हुई स्थिति को व्यक्त करता है; सरल हिन्दी में 'बैठा था' उपयुक्त है।
- source_word: ἐπιδόξως
  choice: सम्मान के स्थान पर
  rationale: क्रियाविशेषण सार्वजनिक रूप से विशिष्ट, प्रतिष्ठित या प्रमुख स्थान को सूचित करता है। यह अनुवाद सम्मान और दृश्य प्रमुखता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντων
  choice: उन सब
  rationale: यह वहाँ उपस्थित सभी लोगों की ओर संकेत करता है; 'उन सबके सामने' सम्बन्ध को स्पष्ट रखते हुए यूनानी के दूसरे ἐνώπιον को भी दर्शाता है।
