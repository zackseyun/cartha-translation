base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: hi
  text: मैंने एलीआज़र[a], इदूएल, मासमान, एनाआतान, शमायाह, योरीब, नातान, एन्नातान, ज़कर्याह और मेसोलाबोन के पास बुलावा भेजा—जो अगुवे और विद्वान थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के कई व्यक्तिनाम यूनानी रूपों में सुरक्षित हैं और उन्हें एज्रा के इब्रानी समानांतर के नामों से ठीक-ठीक मिलाना कठिन है। इसलिए यहाँ नाम मुख्यतः यूनानी पाठ के अनुसार दिए गए हैं; उन्हें पूरी तरह इब्रानी पाठ के अनुरूप नहीं बनाया गया है।
    reason: textual_variant
