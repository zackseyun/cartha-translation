- source_word: ἀπέστειλα πρὸς
  choice: के पास बुलावा भेजा
  rationale: शाब्दिक अर्थ ‘के पास भेजा’ है; व्यक्तियों की सूची वाले इस प्रसंग में आशय उन्हें बुलाने के लिए संदेशवाहक भेजना है। यह हिन्दी प्रयोग उस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: एलीआज़र, इदूएल, मासमान, एनातान, शमायाह, योरीब, नातान, एन्नातान, ज़कर्याह और मेसोलाबोन
  rationale: व्यक्तिनामों को यूनानी साक्ष्य के आधार पर देवनागरी में लिप्यंतरित किया गया है। जहाँ प्रचलित हिन्दी बाइबलीय रूप सहज उपलब्ध हैं, वहाँ पठनीय रूप रखे गए हैं, पर नामों को एज्रा के इब्रानी समानांतर से पूरी तरह मिलाने का प्रयास नहीं किया गया।
- source_word: τοὺς ἡγουμένους
  choice: अगुवे
  rationale: यह पद उन लोगों को सूचित करता है जो नेतृत्व करते या प्रमुख स्थान रखते हैं। ‘अगुवे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπιστήμονας
  choice: समझदार पुरुष
  rationale: यह शब्द ज्ञान, समझ अथवा दक्षता रखने वाले व्यक्तियों के लिए है। सूची में विशिष्ट पुरुषों का उल्लेख होने के कारण ‘पुरुष’ लिंग-सटीक है और ‘समझदार’ गुणात्मक अर्थ को सहज हिन्दी में रखता है।
