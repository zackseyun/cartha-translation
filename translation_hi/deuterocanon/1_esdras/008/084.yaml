  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: hi
  text: और हम पर जो कुछ बीतता है, वह सब हमारे बुरे कामों और बड़े पापों के कारण होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हमारे साथ जो कुछ घटता है, वह सब हमारे बुरे कामों और बड़े पापों के कारण घटता है।”
    reason: συμβαίνω और γίνεται के लिए अधिक शब्दानुरूप वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα ἡμῖν
  choice: हम पर जो कुछ बीतता है, वह सब
  rationale: συμβαίνω यहाँ घटने या किसी पर बीतने वाली घटनाओं को दर्शाता है; πάντα की व्यापकता ‘जो कुछ…वह सब’ से सुरक्षित रहती है, और ἡμῖν प्रभावित लोगों को सूचित करता है।
- source_word: γίνεται
  choice: होता है
  rationale: यह क्रिया घटना और उसके कारण के बीच संबंध जोड़ती है। ‘होता है’ स्वाभाविक हिन्दी है और वाक्य में अनावश्यक भारीपन नहीं लाता।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά स्पष्ट कारण व्यक्त करता है; ‘के कारण’ इसी कारणात्मक संबंध को सीधे बनाए रखता है।
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: हमारे बुरे कामों
  rationale: ἔργα कर्म या काम हैं और πονηρά उनकी नैतिक बुराई बताता है। ‘बुरे काम’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: बड़े पापों
  rationale: μεγάλας का मूल अर्थ ‘बड़े’ है और यहाँ पापों की गंभीरता या परिमाण पर बल देता है; इसे ‘बहुत-से’ बनाकर केवल संख्या तक सीमित नहीं किया गया।
theological_decisions:
- issue: समुदाय पर बीतने वाली घटनाओं और उसके पापों के बीच कारणात्मक संबंध
  choice: पाठ के स्पष्ट कथन के अनुसार सब कुछ उनके बुरे कामों और बड़े पापों के कारण होता है।
  alternative: कारणात्मक संबंध को नरम करके केवल घटनाओं और पापों को साथ-साथ रखना।
  rationale: διά के साथ कर्मकारक स्पष्ट कारण बताता है। अनुवाद समुदाय की दोष-स्वीकृति को बनाए रखता है, पर इस एक पद से आगे बढ़कर दुःख के विषय में कोई सार्वभौमिक धर्मसिद्धांत नहीं गढ़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘हम पर…बीतता है’ प्रभावित समुदाय की अनुभूति को स्वाभाविक ढंग से व्यक्त करता है।
