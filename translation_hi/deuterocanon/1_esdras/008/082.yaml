base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: hi
  text: उनकी बेटियों को अपने बेटों के लिए पत्नियों के रूप में मत लेना, और उनके साथ शांति स्थापित करने का प्रयत्न कभी भी मत करना[a], ताकि तुम बलवान होकर भूमि की अच्छी वस्तुएँ खा सको और उसे विरासत में पा सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इब्रानी समानांतर के अधिक विस्तृत भाव के अनुसार, “उनका कुशल-क्षेम या समृद्धि सदा न चाहना।”
    reason: यूनानी अभिव्यक्ति संक्षिप्त है; इब्रानी समानांतर उसके पीछे ‘कुशल-क्षेम अथवा समृद्धि चाहने’ का व्यापक अर्थ दर्शाता है।
lexical_decisions:
- source_word: λάβητε
  choice: पत्नी के रूप में न लेना
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर बेटियों को बेटों के लिए लेने के इस प्रसंग में विवाह स्पष्टतः निहित है। यह रूप हिन्दी में स्वाभाविक रहते हुए मूल क्रिया की छवि भी बनाए रखता है।
- source_word: ζητήσετε
  choice: कोशिश कभी न करना
  rationale: ζητέω के ‘खोजना/प्रयत्न करना’ अर्थ को यहाँ स्वाभाविक हिन्दी में ‘कोशिश करना’ से व्यक्त किया गया है; ‘कभी’ पूरे समय लागू निषेध को दर्शाता है।
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: उनके साथ शांति स्थापित करने
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और कुछ हद तक मुहावरेदार है। मुख्य पाठ उसका प्रत्यक्ष अर्थ—उनके साथ शांतिपूर्ण संबंध बनाना—रखता है, जबकि सामी समानांतर से मिलने वाला ‘शांति या समृद्धि चाहना’ का व्यापक भाव पादटिप्पणी में दिया गया है।
- source_word: τὸν ἅπαντα χρόνον
  choice: कभी न
  rationale: शाब्दिक भाव ‘पूरे समय’ है। निषेधात्मक हिन्दी वाक्य में ‘कभी न’ उसकी सर्वकालिक व्यापकता को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἵνα ἰσχύσαντες
  choice: ताकि तुम बलवान होकर
  rationale: यह प्रयोजनसूचक रचना और कृदन्तीय क्रम दोनों को संक्षेप में बनाए रखता है; ἰσχύω के बलवान होने अथवा सामर्थ्य पाने के भाव को खुला रखता है।
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: देश की उत्तम उपज खाओ
  rationale: φάγητε के प्रत्यक्ष ‘खाना’ अर्थ को रखा गया है। ‘उत्तम उपज’ भूमि की अच्छी वस्तुओं को स्वाभाविक हिन्दी में व्यक्त करती है, यद्यपि यूनानी ἀγαθά अपने आप में अधिक व्यापक है।
- source_word: κατακληρονομήσητε
  choice: उसे विरासत में पाओ
  rationale: क्रिया के विरासत संबंधी भाव को सुरक्षित रखा गया है। निहित कर्म को पिछले पद ‘देश’ के आधार पर ‘उसे’ से स्पष्ट किया गया है।
theological_decisions:
- issue: एज्रा 9:12 के इब्रानी समानांतर में ‘उनकी शांति और समृद्धि न चाहना’ का विस्तृत भाव
  choice: मुख्य पाठ में उपलब्ध यूनानी के अनुसार ‘उनके साथ शांति स्थापित करने की कोशिश’ रखा गया है।
  alternative: ‘उनकी शांति या समृद्धि कभी न चाहना।’
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक आधार है। इब्रानी समानांतर संक्षिप्त यूनानी मुहावरे का संभावित व्यापक अर्थ स्पष्ट करता है, पर उसे मुख्य पाठ में जोड़कर यूनानी का विस्तार नहीं किया गया; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। विवाह-संदर्भ को स्पष्ट करने के लिए ‘पत्नी के रूप में’ कहा गया है। सर्वकालिक निषेध को स्वाभाविक हिन्दी ‘कभी न’ से व्यक्त किया गया है।
