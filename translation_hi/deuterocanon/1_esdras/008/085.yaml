base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: hi
  text: क्योंकि हे प्रभु, तूने हमारे पापों का भार हल्का किया और हमें ऐसी जड़[a] दी; फिर हम तेरी व्यवस्था का उल्लंघन करने और देश की जातियों की अशुद्धता में घुल-मिल जाने के लिए लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जड़”; यहाँ यह किसी बचे हुए आधार, वंश या फिर से बढ़ने की संभावना का रूपक हो सकता है।'
    reason: ‘जड़’ का रूपक हिन्दी पाठक के लिए अस्पष्ट रह सकता है, पर मुख्य पाठ में उसका अर्थ निश्चित कर देना स्रोत से अधिक व्याख्यात्मक होता।
lexical_decisions:
- source_word: κουφίσας
  choice: हमारे पापों का भार हल्का किया
  rationale: क्रिया का मूल अर्थ ‘हल्का करना’ है। हिन्दी में स्वाभाविक अभिव्यक्ति के लिए ‘भार’ जोड़ा गया है, पर इसे सीधे ‘क्षमा करना’ नहीं बनाया गया, ताकि यूनानी की अर्थगत व्यापकता बनी रहे।
- source_word: ῥίζαν
  choice: जड़
  rationale: यूनानी रूपक को यथावत रखा गया है; ‘बचा हुआ समुदाय’ जैसे व्याख्यात्मक विकल्प से पाठ की वास्तविक रूपकात्मक अस्पष्टता समाप्त हो जाती।
- source_word: ἀνεκάμψαμεν
  choice: दोबारा मुड़कर … लगे
  rationale: यह फिर लौटने या पुनः उसी दिशा में मुड़ने का भाव देता है; सन्दर्भ में व्यवस्था के उल्लंघन की ओर दोबारा जाने का आशय है।
- source_word: ἐπιμιγῆναι
  choice: घुल-मिल जाने
  rationale: यह परस्पर मिश्रित होने का भाव व्यक्त करता है और वैवाहिक अथवा सामाजिक मिश्रण में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: इस देश की जातियों
  rationale: यह वाक्यांश भूमि/देश के अन्य जनसमूहों को दर्शाता है; आधुनिक हिन्दी में ‘इस देश की जातियाँ’ अर्थ को सुबोध रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘पापों को हल्का करने’ का आशय
  choice: शाब्दिक रूपक को ‘पापों का भार हल्का किया’ के रूप में बनाए रखा
  alternative: ‘हमारे पाप क्षमा किए’ या ‘हमारी सजा घटाई’
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि हल्का किया जाना पाप-दोष, दंड या उसके बोझ को विशेष रूप से सूचित करता है; इसलिए किसी एक धर्मवैचारिक व्याख्या को पाठ में आरोपित नहीं किया गया।
- issue: ‘जड़’ की पहचान
  choice: ‘जड़’
  alternative: ‘बचा हुआ समुदाय’, ‘वंश’ या ‘आधार’
  rationale: रूपक की पहचान पाठ में स्पष्ट नहीं है; उसे किसी विशिष्ट धर्मवैचारिक अवधारणा में बदलने के बजाय मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी अपनाई गई है। परमेश्वर को संबोधन में एकवचन निकटता सूचक ‘तू/तेरी’ रखा गया है। वाक्य की पश्चात्तापपूर्ण गति तथा ‘फिर भी’ से व्यक्त विरोध को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
