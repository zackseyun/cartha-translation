base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: hi
  text: और जब एज्रा प्रार्थना करते हुए स्वीकारोक्ति कर रहा था[a], रो रहा था और मंदिर के सामने भूमि पर गिरा पड़ा था, तब यरूशलेम से पुरुषों, स्त्रियों और युवा पुरुषों की एक बहुत बड़ी भीड़ उसके पास इकट्ठी हो गई; क्योंकि उस जनसमूह में बहुत विलाप हो रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद दे रहा था”; यूनानी क्रिया के दोनों अर्थ हो सकते हैं, पर यहाँ पश्चात्ताप के प्रसंग में “स्वीकारोक्ति कर रहा था” अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενος
  choice: प्रार्थना करते हुए
  rationale: वर्तमान कृदन्त एज्रा की जारी प्रार्थना को मुख्य घटनाओं के साथ-साथ घटित दिखाता है।
- source_word: ἀνθωμολογεῖτο
  choice: पापों को स्वीकार कर रहा था
  rationale: क्रिया में धन्यवाद देने का अर्थ संभव है, पर प्रार्थना, रोने और भूमि पर पड़े होने के इस पश्चात्तापपूर्ण प्रसंग में पाप-स्वीकार अधिक उपयुक्त है। 'पापों को' प्रसंगगत आशय स्पष्ट करता है।
- source_word: κλαίων
  choice: रोते हुए
  rationale: यह सरल, स्वाभाविक हिन्दी में शोक और पश्चात्ताप के आँसुओं को व्यक्त करता है।
- source_word: χαμαιπετής
  choice: भूमि पर दण्डवत पड़ा था
  rationale: शब्द भूमि पर औंधे या साष्टांग पड़े होने की दीन मुद्रा बताता है; 'दण्डवत' आधुनिक धार्मिक हिन्दी में उस शारीरिक मुद्रा को संक्षेप में व्यक्त करता है।
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: मंदिर के सामने
  rationale: ἱερόν मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं; इसलिए 'मंदिर' उपयुक्त व्यापक पद है।
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: उसके पास इकट्ठी हो गई
  rationale: यह समूह के एज्रा की ओर आकर एकत्र होने की दिशात्मकता को स्वाभाविक हिन्दी में रखता है।
- source_word: ὄχλος πολὺς σφόδρα
  choice: एक बहुत बड़ी भीड़
  rationale: यह πολὺς और बलवर्धक σφόδρα दोनों का सहज हिन्दी रूप है।
- source_word: νεανίαι
  choice: जवान पुरुषों
  rationale: यूनानी शब्द पुल्लिंग है और खास तौर पर युवा पुरुषों को दर्शाता है; इसे लिंग-निरपेक्ष 'युवाओं' से नहीं बदला गया।
- source_word: κλαυθμὸς ... μέγας
  choice: बहुत रोना-पीटना
  rationale: संज्ञा सामूहिक और श्रव्य विलाप का संकेत देती है; 'रोना-पीटना' सामान्य हिन्दी में उसकी तीव्रता व्यक्त करता है।
- source_word: ἐν τῷ πλήθει
  choice: उस जनसमूह में
  rationale: यह सामूहिक अर्थ बनाए रखता है और निकटवर्ती 'भीड़' की अनावश्यक हूबहू पुनरावृत्ति से बचता है।
theological_decisions:
- issue: पश्चात्तापपूर्ण प्रसंग में ἀνθωμολογεῖτο का अर्थ
  choice: पापों को स्वीकार कर रहा था
  alternative: धन्यवाद दे रहा था / स्तुति कर रहा था
  rationale: क्रिया दोनों अर्थ धारण कर सकती है, किंतु प्रार्थना, आँसू, भूमि पर पड़े होने और एज्रा के पश्चात्तापपूर्ण प्रसंग से पाप-स्वीकार का अर्थ अधिक संभावित है; वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: νεανίαι का लिंग-सटीक अनुवाद
  choice: जवान पुरुषों
  alternative: युवाओं / जवान लोगों
  rationale: मूल पद व्याकरणतः पुल्लिंग है और पुरुषों तथा स्त्रियों के साथ जनसमूह की अलग श्रेणी के रूप में आता है, इसलिए उसका पुरुष-संदर्भ बनाए रखा गया है।
- issue: ἱερόν के लिए मंदिर-संबंधी पद
  choice: मंदिर
  alternative: पवित्रस्थान
  rationale: ἱερόν सामान्यतः पूरे मंदिर-परिसर को दर्शाता है; 'पवित्रस्थान' भीतरी भाग का अधिक संकीर्ण अर्थ दे सकता है।
