translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वंशावली की औपचारिकता सुरक्षित रखते हुए ‘sons of Mooli’ के लिए स्वाभाविक हिन्दी ‘मूओली के वंशजों में से’ चुना गया है। यूनानी पाठ की अंतिम अर्धविराम-सदृश निरंतरता को हिन्दी अर्धविराम से रखा गया है।
