base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/047.yaml
  text: a man of understanding[a], from the sons of Mooli, son of Levi, son of Israel—Asebebias, and his sons and brothers, ten[c][b];
translation:
  language: hi
  text: एक समझदार पुरुष, मूओली[a] के वंशजों में से—मूओली लेवी का पुत्र था, और लेवी इस्राएल का पुत्र था—असेबेबियास[b], और उसके पुत्र और भाई, कुल दस[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी समानांतर पाठ में ‘मूओली’ के स्थान पर ‘महली’ है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी समानांतर पाठ में यह नाम ‘शेरेब्याह’ है; यहाँ यूनानी पाठ में ‘असेबेबियास’ है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी समानांतर पाठ में ‘दस’ के स्थान पर ‘अठारह’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: एक समझदार पुरुष
  rationale: ἄνδρα स्पष्ट रूप से पुरुषवाचक एकवचन है, और ἐπιστήμονα ज्ञान एवं समझ रखने वाले व्यक्ति को दर्शाता है। यह पदबंध समानांतर इब्रानी אִישׁ שֶׂכֶל के अर्थ से भी मेल खाता है।
- source_word: τῶν υἱῶν Μοολὶ
  choice: मूओली के वंशजों में से
  rationale: वंशावली के प्रसंग में υἱῶν का शाब्दिक अर्थ ‘पुत्रों’ है, पर आधुनिक हिन्दी में किसी कुल या वंश की सदस्यता के लिए ‘वंशजों में से’ अधिक स्वाभाविक और स्पष्ट है। मुख्य पाठ में यूनानी Μοολὶ का लिप्यंतरण रखा गया है।
- source_word: τοῦ Λευὶ τοῦ Ἰσραὴλ
  choice: जो लेवी का पुत्र और इस्राएल का पुत्र था
  rationale: यूनानी संबंधकारक शृंखला को वंशावली के रूप में स्पष्ट किया गया है। ‘इस्राएल का पुत्र’ वंशगत सूत्र को औपचारिक रूप से बनाए रखता है, यद्यपि सामान्य हिन्दी में इसे ‘इस्राएल का वंशज’ भी कहा जा सकता था।
- source_word: Ἀσεβηβίαν
  choice: असेबेबियास
  rationale: प्राथमिक यूनानी पाठ के नाम का देवनागरी लिप्यंतरण किया गया है। इब्रानी समानांतर का ‘शेरेब्याह’ पादटिप्पणी में सुरक्षित है।
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφοὺς
  choice: उसके पुत्र और भाई
  rationale: नाम के बाद की समानाधिकरणात्मक रचना से स्वाभाविक रूप से ये असेबेबियास के पुत्र और भाई समझे जाते हैं। दोनों संज्ञाओं का पुरुषवाचक और पारिवारिक अर्थ बनाए रखा गया है।
- source_word: δέκα
  choice: कुल दस
  rationale: प्राथमिक यूनानी साक्ष्य में संख्या दस है। ‘कुल’ हिन्दी में गणना को स्वाभाविक बनाता है, जबकि इब्रानी समानांतर की संख्या अठारह पादटिप्पणी में दी गई है।
