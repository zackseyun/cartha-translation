base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: hi
  text: हमारे पुरखाओं[a] के समय से आज तक हम बड़े पाप में रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पूर्वजों।” यूनानी में शाब्दिक रूप से “हमारे पिताओं” है; यह पुरुषवाची पैतृक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “हम बड़े पाप में हैं।” यूनानी में क्रिया वर्तमान काल में है; ‘समय से आज तक’ के साथ यह अतीत से वर्तमान तक जारी अवस्था बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  choice: के समय से
  rationale: यह वाक्यांश अतीत में आरम्भ-बिंदु बताता है। ‘के समय से’ आधुनिक हिन्दी में स्वाभाविक है और χρόνοι को अनावश्यक रूप से ‘वर्षों’ तक सीमित नहीं करता।
- source_word: τῶν πατέρων ἡμῶν
  choice: हमारे पुरखाओं
  rationale: πατέρων का शाब्दिक अर्थ ‘पिताओं’ है, पर यहाँ आशय पहले की पीढ़ियों के पुरुष पूर्वजों से है। ‘पुरखाओं’ स्रोत के पुरुषवाची पैतृक मुहावरे को बनाए रखते हुए सामान्य हिन्दी में सहज है।
- source_word: ἐσμεν
  choice: हम ... पड़े हुए हैं
  rationale: यूनानी क्रिया वर्तमान काल में है। ‘पड़े हुए हैं’ जारी अवस्था को व्यक्त करती है; ‘से लेकर ... तक’ के साथ यह उस अवस्था के अतीत से वर्तमान तक बने रहने का भाव देती है।
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: बड़े पाप में
  rationale: ἁμαρτία का मूल अर्थ ‘पाप’ है। ‘बड़े पाप में’ नैतिक-धार्मिक श्रेणी को बनाए रखता है और इसे अधिक व्याख्यात्मक ‘बड़े दोष के भागी’ में नहीं बदलता।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज के दिन तक
  rationale: यह वक्ता के वर्तमान दिन तक निरन्तरता बताने वाला प्रचलित कालवाचक मुहावरा है।
theological_decisions:
- issue: पुरुषवाची पैतृक भाषा
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों
  rationale: यूनानी πατέρων स्पष्ट रूप से पुरुषवाची बहुवचन है। ‘पुरखाओं’ मूल के पैतृक मुहावरे को सुरक्षित रखता है; ‘पूर्वजों’ अधिक लिंग-तटस्थ विकल्प है।
- issue: पाप की अवस्था या दोषभाव
  choice: बड़े पाप में पड़े हुए हैं
  alternative: बड़े दोष के भागी हैं
  rationale: ἁμαρτία सामान्यतः ‘पाप’ है। प्रसंग में दोष निहित हो सकता है, पर मूल शब्द को न्यायिक ‘दोष’ में बदलना आवश्यक नहीं है।
- issue: वर्तमान काल और अतीत से चली आ रही अवस्था
  choice: पड़े हुए हैं
  alternative: रहे हैं
  rationale: ἐσμεν रूपतः वर्तमान काल है, जबकि ἀπὸ ... ἕως की रचना अतीत से वर्तमान तक जारी अवस्था दिखाती है। चुना हुआ रूप दोनों पहलुओं को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पुरखाओं’ स्रोत की पुरुषवाची पैतृक भाषा को स्वाभाविक हिन्दी में रखता है; ‘पड़े हुए हैं’ जारी नैतिक अवस्था को व्यक्त करता है।
