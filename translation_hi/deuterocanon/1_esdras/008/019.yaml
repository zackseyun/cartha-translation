base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: hi
  text: और देखो, मैं, राजा अर्तक्षत्र, ने सीरिया और फोनीकिया के कोषाध्यक्षों को आदेश दिया है कि याजक और परमप्रधान परमेश्वर की व्यवस्था के पाठक[b] एज्रा जो कुछ मँगवाएँ[a], वे उन्हें पूरी सावधानी से दें—चाँदी के एक सौ तालन्त[c] तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “भेजें” है; यहाँ संभवतः आशय माँग या अपेक्षित सामग्री की सूची भेजकर उसे मँगवाने से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “व्यवस्था के पाठक।” एज्रा से जुड़ी समानांतर परंपराओं में उन्हें प्रायः “शास्त्री” कहा गया है, पर यहाँ यूनानी पाठ स्पष्ट रूप से “पाठक” कहता है।
    reason: alternative_reading
  - marker: c
    text: तालन्त प्राचीन काल की बड़ी भार-इकाई थी; उसका ठीक वजन स्थान और काल के अनुसार बदलता था।
    reason: cultural_unit
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: राजकीय घोषणा में यह संबोधन यूनानी के बल और ध्यान आकर्षित करने वाले भाव को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: προσέταξα
  choice: आदेश दिया है
  rationale: यह राजा द्वारा पहले से जारी किए गए अधिकारपूर्ण निर्देश को व्यक्त करता है और यूनानी अओरिस्ट का प्रसंगानुकूल हिन्दी रूप है।
- source_word: γαζοφύλαξι
  choice: कोषाध्यक्षों
  rationale: यह राजकोष की धनराशि के उत्तरदायी अधिकारियों के लिए संक्षिप्त और प्रचलित हिन्दी पद है।
- source_word: ἀποστείλῃ
  choice: मँगवाएँ
  rationale: शाब्दिक अर्थ 'भेजें' है, पर आपूर्ति के इस प्रसंग में आशय संदेश या माँग भेजकर सामग्री मँगवाने से है; इस निहित अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀναγνώστης
  choice: पाठक
  rationale: यूनानी पाठ स्पष्ट रूप से एज्रा को व्यवस्था का 'पाठक' कहता है। समानांतर परंपराओं के आधार पर इसे 'शास्त्री' बनाना मूल साक्ष्य को बदल देता।
- source_word: ἐπιμελῶς
  choice: पूरी सावधानी से
  rationale: यह माँगी गई वस्तुओं को ध्यानपूर्वक और जिम्मेदारी से देने का भाव रखता है, बिना अनावश्यक रूप से शीघ्रता का अर्थ जोड़ने के।
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर की व्यवस्था
  rationale: यह हिन्दी में स्वाभाविक विशेषण-क्रम के साथ दिव्य उपाधि और 'व्यवस्था' दोनों को सुरक्षित रखता है।
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: चाँदी के एक सौ तालन्त तक
  rationale: ‘तक’ अधिकतम स्वीकृत सीमा को स्पष्ट करता है; ‘तालन्त’ प्राचीन भार-मुद्रा इकाई को बिना आधुनिक राशि में अनुमानित रूपांतरण किए सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου की दिव्य उपाधि
  choice: परमप्रधान परमेश्वर
  alternative: सबसे महान परमेश्वर
  rationale: ‘परमप्रधान’ स्थापित, गरिमापूर्ण और अर्थतः निकट उपाधि है; यह इस पदवी को केवल तुलनात्मक वर्णन में नहीं बदलती।
- issue: एज्रा के पदनाम ἀναγνώστης की पहचान
  choice: व्यवस्था के पाठक
  alternative: शास्त्री
  rationale: समानांतर एज्रा परंपराएँ उन्हें शास्त्री कहती हैं, पर इस यूनानी साक्ष्य में प्रयुक्त विशिष्ट पद ‘पाठक’ है; उसी को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और राजकीय घोषणा के अनुरूप गरिमापूर्ण रखी गई है। ‘मुझ राजा अर्तक्षत्र ने’ का प्रयोग हिन्दी में प्रथम पुरुष और राजकीय आत्म-परिचय को व्याकरणसम्मत ढंग से जोड़ता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनके विषय से मेल नहीं खाता था; हिन्दी मसौदे में ‘मँगवाएँ’ और ‘पाठक’ के चिह्न उनके सही शब्दों पर लगाए गए हैं।
