base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: hi
  text: और उन्होंने राजा की राजाज्ञाएँ शाही प्रबंधकों और सीरिया तथा फोनीके के राज्यपालों को सौंप दीं; और उन्होंने उस जाति और प्रभु के पवित्रस्थान का सम्मान किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उस जाति और प्रभु के पवित्रस्थान की महिमा की।” यूनानी क्रिया का अधिक शाब्दिक अनुवाद “महिमा की” हो सकता है; यहाँ उसका आशय सम्मान या विशेष प्रतिष्ठा देने से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: सौंप दीं
  rationale: आधिकारिक राजाज्ञाओं को संबंधित अधिकारियों तक पहुँचाने और उनके हाथ में देने का प्रशासनिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ προστάγματα
  choice: राजाज्ञाएँ
  rationale: πρόσταγμα यहाँ राजा के आधिकारिक आदेशों को दर्शाता है; ‘राजाज्ञाएँ’ उनके शासकीय और औपचारिक स्वरूप को संक्षेप में बनाए रखता है।
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: शाही प्रबंधकों
  rationale: οἰκονόμος का मूल भाव किसी संपदा या गृह-व्यवस्था के प्रबंधक का है। ‘शाही प्रबंधक’ इसे दरबारी-प्रशासनिक संदर्भ में रखता है, बिना उन्हें केवल कोषाध्यक्ष मानने के।
- source_word: τοῖς ἐπάρχοις
  choice: राज्यपालों
  rationale: ἐπάρχος प्रादेशिक शासकीय अधिकारी को सूचित करता है; आधुनिक हिन्दी में ‘राज्यपाल’ स्पष्ट और सुलभ समतुल्य है।
- source_word: Συρίας καὶ Φοινίκης
  choice: सीरिया तथा फीनीके
  rationale: स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है; दोनों प्रदेश एक ही संबंधसूचक पद के अधीन रखे गए हैं।
- source_word: ἐδόξασαν
  choice: सम्मान किया
  rationale: क्रिया का शाब्दिक अर्थ ‘महिमा की’ भी हो सकता है, पर जाति और पवित्रस्थान को कर्म के रूप में देखते हुए यहाँ सार्वजनिक प्रतिष्ठा या आदर देने का भाव अधिक स्वाभाविक है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τὸ ἔθνος
  choice: उस जाति
  rationale: ἔθνος यहूदी समुदाय को एक सामूहिक जन-इकाई के रूप में दर्शाता है। ‘उस जाति’ यूनानी निश्चित पद का संकेत रखता है और आधुनिक हिन्दी में ‘राष्ट्र’ की संभावित आधुनिक राजनीतिक अतिव्यंजना से बचता है।
- source_word: τὸ ἱερὸν
  choice: पवित्रस्थान
  rationale: ἱερόν मंदिर अथवा उसके पवित्र परिसर को सूचित कर सकता है। ‘पवित्रस्थान’ इस व्यापकता को बनाए रखता है और केवल भवन तक अर्थ को सीमित नहीं करता।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: प्राथमिक यूनानी साक्ष्य में κύριος है; इसलिए इसे ‘प्रभु’ कहा गया है, न कि स्पष्ट इब्रानी परमेश्वर-नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: यूनानी व्यवस्थाविवरणेतर ग्रंथ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: इस पद का प्राथमिक पाठ यूनानी है और उसमें κύριος आया है। ‘प्रभु’ स्रोत-पाठ का सीधा प्रतिनिधित्व करता है और उसके पीछे किसी विशिष्ट इब्रानी पाठ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: गैर-ईश्वरीय कर्मों के साथ ἐδόξασαν का अर्थ
  choice: सम्मान किया
  alternative: महिमा की
  rationale: जाति और पवित्रस्थान दोनों इस क्रिया के कर्म हैं। ‘सम्मान किया’ सार्वजनिक आदर और प्रतिष्ठा का उपयुक्त भाव देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखकर वास्तविक अर्थ-सीमा सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रशासनिक पदों के लिए अत्यधिक तकनीकी शब्दों से बचते हुए ‘शाही प्रबंधक’ और ‘राज्यपाल’ चुने गए हैं। वाक्य की यूनानी समन्वयी संरचना को अर्धविराम द्वारा स्पष्ट किया गया है।
