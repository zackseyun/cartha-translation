base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: hi
  text: और उपवास से उठकर—उसके वस्त्र और पवित्र परिधान[a] फटे हुए थे—उसने घुटने टेके, प्रभु की ओर अपने हाथ फैलाए और कहने लगा:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्त्र।” यूनानी पाठ इसे स्पष्ट रूप से “याजकीय वस्त्र” नहीं कहता, यद्यपि प्रसंग किसी आधिकारिक पवित्र पोशाक की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी रूप का अर्थ व्याकरणतः “मैं कह रहा था” या “वे कह रहे थे” हो सकता है। प्रसंग एज्रा की आगामी प्रार्थना का परिचय देता है, इसलिए मुख्य पाठ में “कहने लगा” रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: उपवास से उठकर
  rationale: यह उपवास की अवस्था या अवधि से प्रार्थना के लिए उठने का संकेत देता है और यूनानी कृदन्त की क्रमिकता बनाए रखता है।
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: उसके वस्त्र ... फटे हुए थे
  rationale: यह पूर्ण कृदन्त से व्यक्त परिणामी दशा को स्वाभाविक हिन्दी में रखता है और यह अनावश्यक रूप से नहीं कहता कि वस्त्र इसी क्षण फाड़े गए थे।
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: पवित्र परिधान
  rationale: ἱερά की पवित्रता और ἐσθής के वस्त्रार्थ को व्यक्त करता है, पर मूल से आगे बढ़कर इसे स्पष्टतः याजकीय नहीं कहता।
- source_word: κάμψας τὰ γόνατα
  choice: घुटने टेके
  rationale: प्रार्थना की मुद्रा का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: ἐκτείνας τὰς χεῖρας πρὸς τὸν κύριον
  choice: प्रभु की ओर अपने हाथ फैलाए
  rationale: दिशासूचक πρὸς और प्रार्थना में हाथ फैलाने की मुद्रा, दोनों को स्पष्ट रखता है।
- source_word: ἔλεγον
  choice: कहने लगा
  rationale: रूप की वचन/पुरुष-संबंधी कठिनाई को मुख्य पाठ में अस्वाभाविक बनाए बिना आगामी प्रार्थना का परिचय देता है; पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ प्रार्थना में प्रयुक्त श्रद्धापूर्ण ईश्वरीय संबोधन है; ‘प्रभु’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- issue: पवित्र परिधान को याजकीय बताना
  choice: पवित्र परिधान
  alternative: याजकीय वस्त्र
  rationale: यूनानी पाठ परिधान को पवित्र कहता है, किंतु उसे स्पष्टतः याजकीय नहीं कहता; अनुवाद उस संस्थागत निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश के भीतर का वाक्यांश यूनानी में साथ-साथ दी गई वस्त्रों की दशा को स्वाभाविक हिन्दी में व्यक्त करता है। पद के अंत में द्विबिंदु आगामी प्रार्थना का संकेत देता है।
