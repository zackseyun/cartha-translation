base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: hi
  text: परन्तु उसने फ़ारस के राजाओं की दृष्टि में हम पर अनुग्रह किया, हमें भरण-पोषण देने, हमारे पवित्रस्थान को गौरव देने, उजड़ी हुई सिय्योन को फिर खड़ा करने, और यहूदिया तथा यरूशलेम में हमें एक दृढ़ आधार[a] देने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्थिरता,” “सुरक्षा,” अथवा “गढ़।”
    reason: στερέωμα दृढ़ आधार, स्थिरता, सुरक्षा, या किसी दृढ़ संरचना का बोध करा सकता है।
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  choice: उसने ... की दृष्टि में हम पर अनुग्रह किया
  rationale: यूनानी मुहावरे का आशय किसी के सामने अनुग्रह की स्थिति में लाना है। यह हिन्दी में स्वाभाविक है और राजाओं की कृपादृष्टि तथा परमेश्वर की कृपा—दोनों के संबंध को खुला रखता है।
- source_word: τῶν βασιλέων Περσῶν
  choice: फ़ारस के राजाओं
  rationale: यह संबंधकारक पदबंध का सीधा और ऐतिहासिक रूप से स्पष्ट अनुवाद है।
- source_word: δοῦναι ἡμῖν τροφήν
  choice: ताकि हमें जीविका मिले
  rationale: τροφή भोजन, पोषण या जीवन-निर्वाह के साधन को दर्शा सकता है। ‘जीविका’ यहाँ केवल एक बार के भोजन से व्यापक राजकीय सहायता का भाव देता है।
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: हमारे पवित्रस्थान का गौरव बढ़े
  rationale: δοξάζω यहाँ सम्मान और वैभव बढ़ाने का भाव रखता है; ἱερόν मंदिर अथवा उसके पवित्र परिसर को सूचित करता है। यह पद शाब्दिक ‘महिमा करना’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: उजड़ी हुई सिय्योन फिर उठ खड़ी हो
  rationale: ἐγείρω के ‘उठाना/पुनः खड़ा करना’ रूपक और ἔρημος की उजड़ी दशा दोनों सुरक्षित रहते हैं, जबकि पुनर्निर्माण को अनावश्यक रूप से केवल भौतिक अर्थ तक सीमित नहीं किया गया।
- source_word: στερέωμα
  choice: एक दृढ़ आधार
  rationale: शब्द दृढ़ता, स्थिर सहारा या सुरक्षित स्थापना को सूचित कर सकता है। ‘दृढ़ आधार’ मूल की व्यापकता को ‘गढ़’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: यहूदिया तथा यरूशलेम में
  rationale: Ἰουδαία के भौगोलिक रूप के लिए ‘यहूदिया’ और नगर के मानक हिन्दी बाइबलीय नाम के लिए ‘यरूशलेम’ उपयुक्त हैं।
theological_decisions:
- issue: अनुग्रह और उसके बाद आए infinitives का कर्ता
  choice: परिणामों को ‘हमें ... मिले/बढ़े/हो’ के निष्कर्तृवाच्य ढाँचे में रखना
  alternative: ‘उसने हमें जीविका दी, हमारे पवित्रस्थान का गौरव बढ़ाया...’ अथवा ‘राजाओं ने हमें जीविका दी...’
  rationale: यूनानी में δοῦναι, δοξάσαι, ἐγεῖραι के निहित कर्ता को अलग-अलग ढंग से समझा जा सकता है। हिन्दी का यह ढाँचा परमेश्वर की अंतिम कृपा और फ़ारसी राजाओं की मानवीय भूमिका के बीच संबंध को बिना अनावश्यक रूप से निश्चित किए सुरक्षित रखता है।
- issue: Σειών का रूप
  choice: सिय्योन
  alternative: सियोन
  rationale: ‘सिय्योन’ हिन्दी बाइबलीय परंपरा में परिचित स्थान-नाम है और यहाँ किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के बिना लिप्यंतरण किया गया है।
- issue: στερέωμα का पुनर्स्थापना-संदर्भ में अर्थ
  choice: दृढ़ आधार
  alternative: स्थिरता, सुरक्षा, अथवा गढ़
  rationale: यह चुनाव सुरक्षित और स्थायी स्थापना का भाव रखता है, पर इसे केवल सैन्य दुर्ग नहीं बनाता। शब्द की अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान,’ ‘सिय्योन,’ ‘यहूदिया’ और ‘यरूशलेम’ जैसे परिचित बाइबलीय पद बनाए गए हैं। यूनानी infinitive-श्रृंखला की कर्ता-संबंधी अस्पष्टता को निष्कर्तृवाच्य परिणाम-वाक्यों द्वारा सुरक्षित रखा गया है।
