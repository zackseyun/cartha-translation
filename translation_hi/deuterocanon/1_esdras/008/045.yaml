base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: hi
  text: और मैंने उनसे कहा कि वे लद्दायुस[a] के पास जाएँ, जो खजाने के स्थान पर प्रधान था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ यहाँ केवल लद्दायुस का नाम देता है, जबकि एज्रा 8:16 के इब्रानी समानांतर में भेजे गए कई पुरुषों के नाम हैं। इस स्थान पर 1 एस्द्रास समानांतर वृत्तांत को संक्षिप्त या अलग रूप में प्रस्तुत करता प्रतीत होता है।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद ‘खजाने के स्थान पर स्थित प्रधान’ या ‘खजाने की कोठरी का प्रभारी’ भी हो सकता है। यूनानी वाक्यांश संक्षिप्त है, इसलिए अंतिम पदबंध की रचना एक से अधिक प्रकार से समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα
  choice: मैंने उनसे कहा
  rationale: यहाँ λέγω के साथ आज्ञार्थक भाव वाला infinitive ἐλθεῖν है। ‘मैंने उनसे कहा कि वे…जाएँ’ आधुनिक हिन्दी में स्वाभाविक है और मूल के आदेशात्मक आशय को व्यक्त करता है।
- source_word: ἐλθεῖν πρὸς
  choice: के पास जाएँ
  rationale: πρός किसी व्यक्ति की ओर गति दर्शाता है। कथावाचक के दृष्टिकोण से हिन्दी में ‘के पास जाएँ’ अधिक स्वाभाविक है; ‘आएँ’ अनावश्यक रूप से वक्ता की ओर गति का संकेत दे सकता है।
- source_word: Λαδδαῖον
  choice: लद्दायुस
  rationale: यह यूनानी व्यक्तिनाम है; इसे अर्थानुवाद करने के बजाय उसके संभावित कर्ता-रूप Λαδδαῖος के आधार पर देवनागरी में लिप्यंतरित किया गया है।
- source_word: τὸν ἡγούμενον
  choice: प्रधान
  rationale: ἡγούμενος नेतृत्व करनेवाले या प्रभारी व्यक्ति को दर्शाता है। ‘प्रधान’ संक्षिप्त और तटस्थ है तथा ‘राज्यपाल’ जैसे अधिक औपचारिक पद का अनावश्यक संकेत नहीं देता।
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: जो खजाने के स्थान का प्रधान था
  rationale: मूल यूनानी वाक्यांश संक्षिप्त है और प्रधान के स्थान या कार्यक्षेत्र, दोनों से जुड़ सकता है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और दूसरी संभावित संरचनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: γαζοφυλακίου
  choice: खजाने
  rationale: γαζοφυλάκιον खजाना, कोषागार या खजाने की कोठरी को सूचित कर सकता है। ‘खजाना’ सामान्य पाठक के लिए स्पष्ट और सहज है।
