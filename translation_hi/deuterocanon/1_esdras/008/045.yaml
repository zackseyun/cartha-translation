  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘प्रधान’ सामान्य पाठक के लिए सुबोध है और मूल में निहित पद की व्यापकता बनाए रखता है। नाम का लिप्यंतरण यूनानी रूप से किया गया है; पाठगत और वाक्यरचनात्मक अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
