  source_fidelity: 'Draft accurately renders the first two infinitival phrases: uncover/reveal a lamp, and give food during slavery. However, it wrongly turns the final independent Greek clause, “while we were enslaved, we were not forsaken,” into a third purposive infinitive, “in order not to forsake us.” This changes both its syntax and its passive meaning.'
