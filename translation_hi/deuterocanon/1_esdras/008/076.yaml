  issues:
  - severity: high
    issue: The final clause is rendered as a purpose phrase rather than an independent passive statement.
    rationale: Greek has καὶ ἐν τῷ δουλεύειν ἡμᾶς οὐκ ἐγκατελείφθημεν, literally, “and while we were enslaved/serving, we were not forsaken.” The draft’s “हमें न त्यागने के लिए” instead means “in order not to forsake us,” obscuring the passive and incorrectly attaching it to the preceding infinitival sequence.
