base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: hi
  text: और हमारे प्रभु के भवन में हमारे लिए एक दीपक प्रकट करने[a], हमारी दासता के समय हमें भोजन देने के लिए; और जब हम दासता में थे[b], तब भी हम त्यागे नहीं गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हमारे प्रभु का भवन’ यहाँ मंदिर को दर्शाता है। ‘एक दीपक प्रकट करने’ का अनुवाद ‘हमारे लिए ज्योति प्रकट करने’ भी हो सकता है; यूनानी में दीपक या प्रकाश को आवरण हटाकर सामने लाने का बिंब है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: इसका अनुवाद ‘सेवाधीन रहते हुए’ या ‘सेवा करते हुए’ भी हो सकता है। दोनों खंडों में यूनानी मूल एक ही δουλεία शब्द-समूह का प्रयोग करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακαλύψαι
  choice: प्रकट करने
  rationale: क्रिया का मूल अर्थ आवरण हटाकर सामने लाना है। हिंदी में ‘दीपक प्रकट करने’ मूल बिंब को यथासंभव बनाए रखते हुए ‘दीपक खोलने’ की अस्वाभाविकता से बचता है।
- source_word: φωστῆρα
  choice: एक दीपक
  rationale: यह शब्द प्रकाश देने वाली वस्तु या ज्योति को सूचित कर सकता है। भवन के प्रसंग में ‘दीपक’ ठोस और स्वाभाविक है, जबकि ‘ज्योति’ एक संभव विकल्प है।
- source_word: οἴκῳ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के भवन में
  rationale: यूनानी में शाब्दिक रूप से ‘हमारे प्रभु का घर/भवन’ है। ‘भवन’ गरिमापूर्ण हिंदी है और मंदिर का संकेत दिए बिना स्रोत का बिंब बनाए रखता है।
- source_word: τροφὴν
  choice: भोजन
  rationale: यह पोषण या आहार को दर्शाता है; ‘भोजन’ इसका सीधा, ठोस और सामान्य हिंदी रूप है।
- source_word: δουλείας
  choice: दासता
  rationale: यह बंधुआ अधीनता की दशा बताता है। ‘दासता’ उसकी कठोरता और δουλεία शब्द-समूह से संबंध स्पष्ट रखता है।
- source_word: ἐν τῷ δουλεύειν ἡμᾶς
  choice: दासता में रहते हुए
  rationale: यह परिस्थितिजन्य वाक्यांश ‘जब हम दासता में थे’ अथवा ‘सेवा करते समय’ का अर्थ दे सकता है। चुना हुआ रूप पूर्ववर्ती ‘दासता’ से शब्दगत संबंध बनाए रखता है।
- source_word: οὐκ ἐγκατελείφθημεν
  choice: हमें न त्यागने
  rationale: निष्क्रिय यूनानी वाक्यांश का अर्थ ‘हम त्यागे नहीं गए’ है। हिंदी वाक्य की पूर्ववर्ती उद्देश्यसूचक रचना से जोड़ने के लिए ‘हमें न त्यागने’ स्वाभाविक है और परित्याग न किए जाने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: δουλεία / δουλεύειν शब्द-समूह का अनुवाद
  choice: दासता / दासता में रहते हुए
  alternative: सेवाधीनता / सेवा करते हुए
  rationale: विदेशी अधीनता की गंभीरता को नरम किए बिना दोनों पदों में एक ही यूनानी शब्द-समूह का संबंध दिखाया गया है; फिर भी पादटिप्पणी में ‘सेवा करते हुए’ की वास्तविक शाब्दिक संभावना सुरक्षित है।
- issue: οἶκος τοῦ κυρίου को मुख्य पाठ में मंदिर कहना या स्रोत-बिंब रखना
  choice: हमारे प्रभु का भवन
  alternative: हमारे प्रभु का मंदिर
  rationale: संदर्भ मंदिर का है, पर यूनानी में ‘भवन/घर’ है। मुख्य पाठ में स्रोत का रूप रखा गया और सांस्कृतिक संकेत पादटिप्पणी में दिया गया।
- issue: ἀνακαλύψαι φωστῆρα के बिंब की व्याख्या
  choice: एक दीपक प्रकट करने
  alternative: हमारे लिए ज्योति प्रकट करने / दीपक को फिर जलाने
  rationale: ‘प्रकट करने’ आवरण हटाकर सामने लाने का अर्थ रखता है, पर ‘फिर जलाने’ या ‘पुनर्स्थापित करने’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। यह अंश पिछले वाक्य से जुड़ी उद्देश्यसूचक श्रृंखला है, इसलिए आरंभ में ‘और’ तथा अंत तक ‘के लिए’ वाली रचना रखी गई है। ‘भवन’, ‘दीपक’, ‘भोजन’, ‘दासता’ और ‘त्यागना’ सामान्य पाठक के लिए स्पष्ट हैं तथा बाइबिलीय गंभीरता भी बनाए रखते हैं।
