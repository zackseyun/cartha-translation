base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: hi
  text: उन्होंने उनकी कुछ बेटियों को अपने लिए और अपने बेटों के लिए पत्नियों के रूप में ले लिया, और पवित्र बीज[a] उस देश की परदेशी जातियों के साथ मिल गया; और अगुओं और प्रतिष्ठित लोगों ने इस अधर्म[b] में इस मामले के आरम्भ से ही भाग लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र संतान” या “पवित्र वंश।” यूनानी में शाब्दिक रूप से, “पवित्र बीज।”
    reason: lexical_alternative
  - marker: b
    text: या, “व्यवस्था-विरोध” या “उल्लंघन।” यूनानी में शाब्दिक रूप से, “इस अधर्म में भाग लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῴκισαν
  choice: पत्नियाँ बना लिया
  rationale: क्रिया का मूल भाव साथ बसाने या वैवाहिक संबंध में रखने का है। अंतर्विवाह के इस प्रसंग में यह चुनाव विवाह का आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: उनकी कुछ बेटियों को
  rationale: यह अंशसम्बन्धी अभिव्यक्ति है; ‘कुछ’ सीमित संख्या का भाव बनाए रखता है।
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: अपने लिए और अपने बेटों के लिए
  rationale: यूनानी में वे पुरुष स्वयं और उनके पुत्र दोनों विवाह में सहभागी हैं; हिन्दी में संबंध को स्पष्ट करने के लिए ‘के लिए’ दोहराया गया है।
- source_word: ἐπεμίγη
  choice: मिल गया
  rationale: यह मिश्रण के रूपक को बनाए रखता है और उसे केवल विवाह या जातीय पहचान की व्याख्या में सीमित नहीं करता।
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: पवित्र वंश
  rationale: शाब्दिक ‘पवित्र बीज’ हिन्दी में अस्वाभाविक और भ्रमकारी हो सकता है। ‘वंश’ जनसमुदाय और वंश-परंपरा के रूपक को संक्षेप में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: उस देश की परदेशी जातियों में
  rationale: εἰς के ‘में’ वाले दिशात्मक भाव और ἀλλογενῆ के विदेशी मूल के अर्थ को रखा गया है। ‘उस देश’ स्थानीय संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετεῖχον
  choice: भाग लिया था
  rationale: यह सहभागिता का स्पष्ट और सामान्य हिन्दी रूप है।
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: अगुओं तथा बड़े अधिकारियों
  rationale: पहला पद नेतृत्व करने वालों और दूसरा उच्च पद अथवा प्रतिष्ठा रखने वालों की ओर संकेत करता है; यह अनुवाद दोनों समूहों में भेद बनाए रखता है।
- source_word: τῆς ἀνομίας ταύτης
  choice: इस अधर्म
  rationale: ἀνομία व्यवस्था अथवा विधि के उल्लंघन को नैतिक रूप से दोषपूर्ण ठहराता है। ‘अधर्म’ आधुनिक धार्मिक हिन्दी में गंभीर उल्लंघन का भाव देता है; ‘व्यवस्था-विरोध’ की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: आरम्भ से ही
  rationale: प्रसंग में ‘मामले के आरम्भ से’ का अर्थ स्पष्ट है; संक्षिप्त हिन्दी मूल कथन का कालगत बल बनाए रखती है।
theological_decisions:
- issue: अंतर्विवाह के प्रसंग में ‘पवित्र बीज’ का अर्थ
  choice: मुख्य पाठ में ‘पवित्र वंश’ रखा गया और शाब्दिक रूप पादटिप्पणी में बताया गया।
  alternative: पवित्र बीज; पवित्र संतान
  rationale: यह चुनाव परमेश्वर के लिए अलग किए गए समुदाय का वाचा-संबंधी रूपक बनाए रखता है, पर उसे किसी विशिष्ट जातीय या धर्मसैद्धान्तिक व्याख्या में नहीं बदलता।
- issue: इस कार्य का नैतिक निरूपण
  choice: ἀνομία का अनुवाद ‘अधर्म’ किया गया।
  alternative: व्यवस्था-विरोध; उल्लंघन; दुष्टता
  rationale: मूल पाठ इस कार्य की स्पष्ट निंदा करता है। ‘अधर्म’ उस गंभीर नैतिक और वाचा-संबंधी दोष को व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। ‘पवित्र वंश’ और ‘अधर्म’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल यूनानी की अधिक शाब्दिक छवियाँ पादटिप्पणियों में सुरक्षित हैं।
