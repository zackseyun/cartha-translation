base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: hi
  text: क्या तू हम पर क्रोधित नहीं हुआ था कि हमें नष्ट कर दे, यहाँ तक कि हमारी कोई जड़, बीज या नाम न बचे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भावार्थ में, “यहाँ तक कि हमारा कोई बचा हुआ अंश, संतान या नाम न रहे।” यूनानी में शाब्दिक रूप से “जड़, बीज और नाम” है।
    reason: मूल के वंश और निरंतरता संबंधी रूपकों का संभावित भावार्थ स्पष्ट करना, बिना उन्हें मुख्य पाठ में प्रतिस्थापित किए।
lexical_decisions:
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: यह प्रश्नवाचक कण ऐसे आलंकारिक प्रश्न का संकेत देता है जिसमें सहमति की अपेक्षा है; हिन्दी में ‘क्या ... नहीं’ उसका स्वाभाविक रूप है।
- source_word: ὠργίσθης ἡμῖν
  choice: तू हम पर इतना क्रोधित हुआ
  rationale: क्रोधसूचक क्रिया के साथ दत्तिव ἡμῖν को स्वाभाविक हिन्दी में ‘हम पर’ कहा गया है। ‘इतना’ आगे आने वाले परिणाम की सीमा को स्पष्ट करता है, जो ἕως की रचना में निहित है।
- source_word: ἀπολέσαι ἡμᾶς
  choice: हमें नष्ट कर दे
  rationale: ἀπόλλυμι का सीधा अर्थ ‘नष्ट करना’ है; यह न्याय और विनाश की गंभीरता बनाए रखता है, बिना बोलचाल की अतिशयोक्ति जोड़े।
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: और ... तक न छोड़े
  rationale: यह रचना विनाश की चरम सीमा या परिणाम व्यक्त करती है। हिन्दी में ‘तक न छोड़े’ उस सीमा को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ῥίζαν καὶ σπέρμα καὶ ὄνομα ἡμῶν
  choice: हमारी जड़, बीज और नाम
  rationale: मूल यूनानी की ठोस त्रयी को अक्षुण्ण रखा गया है। ‘जड़’ और ‘बीज’ वंश की निरंतरता के रूपक हैं, जबकि ‘नाम’ सामुदायिक अस्तित्व और पहचान को व्यक्त कर सकता है।
theological_decisions:
- issue: पश्चात्ताप की प्रार्थना में विनाश की पराकाष्ठा
  choice: पाठ को ऐसे आलंकारिक प्रश्न के रूप में रखा गया है जिसमें परमेश्वर के क्रोध से पूरी वंशगत और सामुदायिक निरंतरता मिट जाने की संभावना व्यक्त होती है।
  alternative: ‘क्या तूने हमें ऐसा नष्ट नहीं किया कि हमारा कोई बचा हुआ अंश, संतान या पहचान न रही?’
  rationale: यूनानी पाठ अमूर्त ‘बचा हुआ अंश’ नहीं, बल्कि ‘जड़, बीज और नाम’ कहता है। मूल बिंबों को बनाए रखने से धर्मवैचारिक तनाव पाठ के अपने शब्दों से उभरता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को संबोधित एकवचन ‘तू’ प्रार्थनात्मक निकटता और मूल यूनानी के एकवचन को बनाए रखता है। भाषा गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है।
