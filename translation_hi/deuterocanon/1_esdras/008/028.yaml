base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: hi
  text: और ये अपने-अपने पितृकुलों और दलों[b] के अनुसार अगुए[a] हैं, जो राजा अर्तक्षत्र के शासनकाल में मेरे साथ बाबेल से ऊपर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुखिये।” यूनानी शब्द उन लोगों को सूचित कर सकता है जो प्रधान स्थान पर थे; समानांतर इब्रानी पाठ पितृकुलों के मुखियाओं का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उनके दल” है; समानांतर इब्रानी पाठ में वंशावली में पंजीकरण या वंशक्रम का भाव है। यहाँ 1 एस्द्रास के मुख्य पाठ के रूप में यूनानी का अनुसरण किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: ये ... हैं
  rationale: यूनानी के क्रियारहित परिचयात्मक वाक्य में हिन्दी की स्वाभाविक वर्तमानकालीन सहायक क्रिया जोड़ी गई है।
- source_word: οἱ προηγούμενοι
  choice: अगुए
  rationale: यहाँ शब्द समय में पहले चलने वालों के बजाय समुदाय में प्रधानता रखने वालों को सूचित करता है; समानांतर इब्रानी पाठ भी पितृकुलों के मुखियाओं का भाव देता है।
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: अपने-अपने पितृकुलों के अनुसार
  rationale: πατριά वंशाधारित कुल या पैतृक घराने को दर्शाता है; ‘पितृकुल’ इस तकनीकी वंशगत अर्थ को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: καὶ τὰς μεριδαρχίας
  choice: और दलों
  rationale: यूनानी शब्द संगठित उपविभागों या समूहों की ओर संकेत करता है। ‘दल’ प्रशासनिक अर्थ को अनावश्यक रूप से निश्चित किए बिना इसे सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀναβάντες
  choice: जो ... ऊपर आए
  rationale: बाबेल से यरूशलेम की यात्रा के लिए प्रयुक्त पारंपरिक दिशात्मक मुहावरे को सुरक्षित रखा गया है।
- source_word: μετʼ ἐμοῦ
  choice: मेरे साथ
  rationale: साथ होने का सीधा अर्थ।
- source_word: ἐκ Βαβυλῶνος
  choice: बाबेल से
  rationale: स्थान से प्रस्थान का सीधा अनुवाद; आधुनिक हिन्दी बाइबलीय नामरूप ‘बाबेल’ रखा गया है।
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: राजा अर्तक्षत्र के शासनकाल में
  rationale: इस प्रसंग में βασιλεία का कालगत अर्थ ‘शासनकाल’ स्वाभाविक है; राजा की उपाधि भी सुरक्षित है।
