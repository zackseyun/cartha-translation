translation:
  language: hi
  text: और मैंने वहाँ याजकों और लेवियों में से किसी को नहीं पाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान के लिए दिया गया इब्रानी मसोराई समानांतर पाठ यहाँ के यूनानी पाठ से निकटता से मेल नहीं खाता; इसलिए प्राथमिक साक्षी के रूप में यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: याजकों में से
  rationale: ग्रीक ἐκ का समूह के भीतर खोजने का भाव स्वाभाविक हिन्दी में ‘में से’ द्वारा स्पष्ट होता है।
- source_word: ἐκ τῶν Λευειτῶν
  choice: लेवियों में से
  rationale: पहले पदबंध के समानांतर रचना रखी गई है; ‘लेवी’ इस समुदाय के लिए प्रचलित बाइबलीय नाम है।
- source_word: οὐχ εὗρον
  choice: मुझे कोई नहीं मिला
  rationale: क्रिया प्रथम पुरुष एकवचन है। ग्रीक में कर्म निहित है, जिसे सहज हिन्दी में ‘कोई’ से स्पष्ट किया गया है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: ग्रीक पाठ और दिए गए अनुमानित मसोराई समानांतर पाठ के बीच बड़ा अंतर
  choice: 'मुख्य पाठ में ग्रीक वाक्य का अनुसरण: ‘और याजकों तथा लेवियों में से मुझे वहाँ कोई नहीं मिला।’'
  alternative: दिया गया मसोराई समानांतर बिगवै के वंशजों की एक अलग सूची-प्रविष्टि प्रस्तुत करता है और इस ग्रीक वाक्य के पुनर्निर्माण का आधार नहीं बनता।
  rationale: निर्देशानुसार स्वेटे का ग्रीक पाठ प्राथमिक स्रोत है। असंगत इब्रानी समानांतर से ग्रीक पाठ को बदलने के बजाय पाठांतर की स्थिति पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास। ‘तथा’ से याजकों और लेवियों की समानांतर श्रेणियाँ स्पष्ट रहती हैं।
