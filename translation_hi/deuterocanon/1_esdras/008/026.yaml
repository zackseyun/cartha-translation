lexical_decisions:
- source_word: ἐτίμησεν
  choice: सम्मानित किया
  rationale: यह τιμάω के सामान्य अर्थ ‘आदर देना’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना किसी भौतिक पुरस्कार का अर्थ जोड़े।
- source_word: ἔναντι
  choice: के सामने
  rationale: यह सार्वजनिक उपस्थिति अथवा सभा में सम्मान दिए जाने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τῶν βασιλευόντων
  choice: राजाओं
  rationale: यूनानी में संज्ञा के बजाय ‘राजा होकर शासन करने वालों’ का कृदंत रूप है; मुख्य पाठ में संक्षिप्त और स्वाभाविक ‘राजाओं’ रखा गया है तथा रूपगत बारीकी पादटिप्पणी में दी गई है।
- source_word: φίλων
  choice: मित्रों
  rationale: मूल शब्द का सीधा अर्थ सुरक्षित रखा गया है; राजदरबार के प्रसंग में इसके शाही सहयोगियों या दरबारियों के लिए प्रयुक्त होने की संभावना पादटिप्पणी में बताई गई है।
- source_word: μεγιστάνων
  choice: सामंतों
  rationale: यह उच्च पद और प्रभाव वाले राजकीय अभिजनों का बोध कराता है तथा आधुनिक हिन्दी में ‘महापुरुषों’ जैसे भ्रामक नैतिक अर्थ से बचता है।
