base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
translation:
  language: hi
  text: और इस्राएल के पुत्रों[a], याजकों, लेवियों, मन्दिर के गायकों, द्वारपालों और मन्दिर के सेवकों[b] में से कुछ लोग भी साथ यरूशलेम गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों’। यूनानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मन्दिर के दास’। यूनानी शब्द पवित्र सेवा में बँधे हुए लोगों का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανέβησαν
  choice: भी साथ यरूशलेम गए
  rationale: क्रिया में साथ जाने और ऊपर जाने, दोनों का भाव है। यरूशलेम की यात्रा के लिए ‘गए’ स्वाभाविक हिन्दी है; ‘साथ’ उपसर्ग συν- का भाव प्रकट करता है, जबकि ‘भी’ प्रसंग की सहभागी सूची को सहज बनाता है।
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों में से कुछ लोग
  rationale: ἐκ समूह में से आए कुछ सदस्यों को सूचित करता है। ‘इस्राएल के पुत्र’ यूनानी की पारिवारिक अभिव्यक्ति को बनाए रखता है, और ‘कुछ लोग’ हिन्दी में वाक्य को स्पष्ट करता है।
- source_word: ἱερέων
  choice: याजकों
  rationale: यह मन्दिर की याजकीय श्रेणी के लिए मानक और प्रतिष्ठित हिन्दी शब्द है।
- source_word: Λευειτῶν
  choice: लेवियों
  rationale: लेवी वंश और उसकी धार्मिक सेवा से जुड़े वर्ग का प्रचलित हिन्दी रूप।
- source_word: ἱεροψαλτῶν
  choice: मन्दिर के गायकों
  rationale: यौगिक यूनानी शब्द पवित्र अथवा मन्दिर-सेवा से जुड़े गायकों को दर्शाता है; यह अनुवाद उस संस्थागत भूमिका को स्पष्ट करता है।
- source_word: θυρωρῶν
  choice: द्वारपालों
  rationale: मन्दिर के द्वारों की देखरेख करने वालों के लिए स्वाभाविक आधुनिक हिन्दी पद।
- source_word: ἱεροδούλων
  choice: मन्दिर के सेवकों
  rationale: मुख्य पाठ में यह पद मन्दिर-सेवा से जुड़े मान्य कर्मी-वर्ग को स्पष्ट रूप से व्यक्त करता है। δοῦλος से जुड़ी अधीन अथवा बँधी हुई स्थिति की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम गए
  rationale: εἰς यहाँ गन्तव्य बताता है; हिन्दी में ‘यरूशलेम गए’ स्वाभाविक रूप से वही अर्थ देता है।
theological_decisions:
- issue: υἱῶν Ἰσραήλ का सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ यूनानी की वास्तविक पारिवारिक और पुल्लिंग अभिव्यक्ति को सुरक्षित रखता है; साथ ही पादटिप्पणी बताती है कि यह पूरे जातीय समुदाय के सदस्यों के लिए प्रयुक्त सामूहिक पद है।
- issue: ἱερόδουλοι की सेवा अथवा बँधी हुई स्थिति
  choice: मन्दिर के सेवक
  alternative: मन्दिर के दास
  rationale: यहाँ शब्द मन्दिर के कर्मियों की सूची में एक संस्थागत वर्ग का नाम है, इसलिए ‘सेवक’ पाठक के लिए भूमिका को बिना अनावश्यक कानूनी निष्कर्ष के व्यक्त करता है। फिर भी मूल के δοῦλος-तत्त्व से सम्भव दासत्व का भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। धार्मिक कर्मी-वर्गों के लिए प्रचलित हिन्दी पद अपनाए गए हैं। सूची की यूनानी संरचना ‘में से कुछ लोग’ द्वारा स्पष्ट की गई है, और सभी पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरन्त बाद रखे गए हैं।
