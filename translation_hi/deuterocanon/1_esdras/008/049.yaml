base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: hi
  text: और मन्दिर के उन सेवकों में से, जिन्हें दाऊद और अगुओं ने लेवियों की सेवा के लिए नियुक्त किया था—मन्दिर-सेवक[a], दो सौ बीस; उन सबके नाम सूची में दर्ज किए गए थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नतीनीम’; यह मन्दिर के सेवकों के लिए इब्रानी से आया पारिभाषिक नाम है। यूनानी पाठ में ‘मन्दिर-सेवक’ (ἱερόδουλοι) है, जबकि इब्रानी समानांतर में נְתִינִים है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन सबको नाम लेकर दर्ज किया गया था।’ अन्तिम वाक्यांश नाम के आधार पर औपचारिक पंजीकरण या सूचीकरण की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: मन्दिर के सेवकों / मन्दिर-सेवक
  rationale: यूनानी शब्द पवित्र स्थान से जुड़ी सेवा करनेवालों को दर्शाता है। ‘मन्दिर-सेवक’ आधुनिक हिन्दी में स्पष्ट है और इब्रानी समानांतर נְתִינִים के कार्यगत अर्थ से मेल खाता है; ‘मन्दिर के दास’ उनकी सामाजिक स्थिति को अनावश्यक रूप से प्रमुख कर देता।
- source_word: ἔδωκεν
  choice: नियुक्त किया था
  rationale: शाब्दिक अर्थ ‘दिया’ है, पर यहाँ व्यक्तियों को लेवियों की सेवा के लिए सौंपने की प्रशासनिक धारणा है; ‘नियुक्त किया था’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἡγούμενοι
  choice: अगुओं
  rationale: यह दाऊद के साथ उल्लिखित नेतृत्वकारी अधिकारियों के लिए व्यापक शब्द है। ‘अगुए’ न तो विशेष पद मानता है, न राजकीय उपाधि जोड़ता है।
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: लेवियों की सेवा के लिए
  rationale: ἐργασία का अर्थ काम या सेवा हो सकता है। मन्दिर के प्रशासनिक सन्दर्भ में ‘सेवा’ सहज है और लेवियों की सहायता के लिए सौंपे जाने का भाव बनाए रखता है।
- source_word: διακόσιοι εἴκοσι
  choice: दो सौ बीस
  rationale: संख्या का सीधा और प्रचलित हिन्दी रूप।
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: उन सबके नाम सूची में दर्ज किए गए थे
  rationale: यह वाक्यांश नामों के आधार पर औपचारिक पंजीकरण या सूची बनाए जाने को दर्शाता है। यह अनुवाद उस प्रशासनिक भाव को स्वाभाविक हिन्दी में रखता है।
