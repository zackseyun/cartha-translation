  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
translation:
  language: hi
  text: और मैंने याजकों के प्रधानों में से बारह पुरुषों को अलग किया, और एसेरेबियास[a] और असोआमियास[b] को।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एसेरेबियास सम्भवतः इब्रानी समानांतर पाठ के ‘शेरेब्याह’ नाम के अनुरूप है।
    reason: alternative_reading
  - marker: b
    text: असोआमियास सम्भवतः इब्रानी समानांतर पाठ के ‘हशब्याह’ नाम के अनुरूप है।
    reason: alternative_reading
  - marker: c
    text: यहाँ यूनानी पाठ एज्रा 8:24–25 के इब्रानी समानांतर अंश से छोटा है; वहाँ आगे और नाम तथा चाँदी, सोने और पात्रों को तौलकर सौंपने का वर्णन मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: अलग किया
  rationale: क्रिया का मूल अर्थ किसी समूह से अलग करना या किसी विशेष कार्य के लिए अलग ठहराना है। ‘अलग किया’ इस पृथक्करण के भाव को स्पष्ट रखता है और नियुक्ति का भाव संदर्भ से उभरने देता है।
- source_word: φυλάρχων
  choice: प्रधानों
  rationale: यह शब्द कुल अथवा गोत्र के मुखियाओं के लिए प्रयुक्त हो सकता है। यहाँ τῶν ἱερέων के साथ यह याजकीय समूह के अगुओं को सूचित करता है; ‘प्रधानों’ आधुनिक हिन्दी में स्वाभाविक है और सामाजिक संरचना को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: τῶν ἱερέων
  choice: याजकों के
  rationale: सम्बन्धकारक पद φυλάρχων को विशेषित करता है—ये याजकों से सम्बद्ध प्रधान हैं। यह चयन यूनानी संरचना को संक्षेप में बनाए रखता है।
- source_word: ἄνδρας δέκα δύο
  choice: बारह पुरुषों
  rationale: ἄνδρας स्पष्ट रूप से पुरुषों को दर्शाता है; अतः ‘बारह पुरुषों’ मूल की लैंगिक और संख्यात्मक विशिष्टता सुरक्षित रखता है।
- source_word: Ἐσερεβίαν
  choice: एसेरेबियास
  rationale: मुख्य यूनानी साक्ष्य के नाम-रूप का देवनागरी लिप्यंतरण किया गया है। इब्रानी समानांतर का ‘शेरेब्याह’ पादटिप्पणी में दिया गया है।
- source_word: Ἀσοαμίαν
  choice: असोआमियास
  rationale: मुख्य यूनानी साक्ष्य के नाम-रूप का देवनागरी लिप्यंतरण किया गया है। इब्रानी समानांतर से सम्भावित पहचान ‘हशब्याह’ पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: καὶ … καὶ
  choice: और … और … को भी
  rationale: दोनों संयोजकों को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है। ‘को भी’ नामित व्यक्तियों और पहले उल्लिखित बारह पुरुषों के बीच यूनानी वाक्य के जोड़ को बनाए रखता है, बिना यह तय किए कि वे बारह में सम्मिलित थे या उनके अतिरिक्त।
