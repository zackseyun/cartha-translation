base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: hi
  text: ये बातें सुनते ही मैंने अपने वस्त्र और पवित्र परिधान[a] फाड़ डाले, अपने सिर और दाढ़ी के बाल नोच डाले, और स्तब्ध[b] तथा अत्यन्त शोकाकुल होकर बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र वस्त्र’; सम्भवतः कोई आधिकारिक याजकीय परिधान, यद्यपि यूनानी पाठ यह स्पष्ट रूप से नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: या ‘हतप्रभ’ अथवा ‘व्याकुल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με
  choice: सुनते ही
  rationale: यह यूनानी रचना सुनने और प्रतिक्रिया के बीच तत्कालता व्यक्त करती है; ‘सुनते ही’ आधुनिक हिन्दी में इसे स्वाभाविक और स्पष्ट ढंग से रखता है।
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: अपने वस्त्र ... फाड़ डाले
  rationale: यह शोक में वस्त्र फाड़ने की क्रिया है। हिन्दी में स्वाभाविकता के लिए निहित संबंध को ‘अपने’ से व्यक्त किया गया है, और ‘फाड़ डाले’ क्रिया की तीव्रता दिखाता है।
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: पवित्र परिधान
  rationale: ἱεράν परिधान की पवित्र अथवा धार्मिक स्थिति बताता है, पर यूनानी उसे स्पष्ट रूप से ‘याजकीय’ नहीं कहता। ‘पवित्र परिधान’ इस सीमा को बनाए रखता है।
- source_word: κατέτειλον
  choice: नोच डाले
  rationale: बालों के संदर्भ में यह बलपूर्वक उखाड़ने की क्रिया दर्शाता है। ‘नोच डाले’ आधुनिक हिन्दी में सजीव और स्वाभाविक है।
- source_word: τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: अपने सिर और दाढ़ी के बाल
  rationale: यह सिर और दाढ़ी, दोनों के बालों को निर्दिष्ट करता है। ‘अपने’ मूल में निहित संबंध को हिन्दी में सहज बनाता है।
- source_word: σύννους
  choice: स्तब्ध
  rationale: यह मानसिक आघात, अवाक् रह जाने या व्याकुल विस्मय की दशा व्यक्त करता है। ‘स्तब्ध’ प्रसंग की गंभीरता रखता है, जबकि ‘चकित’ अपेक्षाकृत तटस्थ लग सकता है।
- source_word: περίλυπος
  choice: अत्यन्त शोकाकुल
  rationale: यह गहरे और तीव्र दुःख को व्यक्त करता है। ‘अत्यन्त शोकाकुल’ गरिमापूर्ण और वर्तमान मानक हिन्दी में बोधगम्य है।
theological_decisions:
- issue: τὴν ἱερὰν ἐσθῆτα का अर्थ
  choice: पवित्र परिधान
  alternative: याजकीय वस्त्र
  rationale: मूल यूनानी परिधान को पवित्र बताता है, लेकिन उसे किसी विशेष पद का आधिकारिक याजकीय वस्त्र स्पष्ट रूप से नहीं ठहराता। इसलिए अनावश्यक पदगत या धार्मिक विशिष्टता जोड़े बिना व्यापक अर्थ रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शोक की क्रियाओं की तीव्रता के लिए ‘फाड़ डाले’ और ‘नोच डाले’ प्रयुक्त हैं। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद रखे गए हैं।
