base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: hi
  text: देखो, हम अपने अधर्मों[a] में तेरे सामने हैं; क्योंकि इन बातों के कारण अब तेरे सामने खड़े होना संभव नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था-विरोधी कामों।” यूनानी शब्द ἀνομίαι व्यवस्था के उल्लंघन के कामों या उनसे उत्पन्न दोष की अवस्था—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी समानांतर पाठ (एज्रा 9:14) इसी संकट को भिन्न शब्दों में व्यक्त करता है: वहाँ परमेश्वर के क्रोध और किसी भी बचे हुए जन के मिट जाने की आशंका पर बल है; यहाँ 1 एस्द्रास इन पापों के कारण परमेश्वर के सामने खड़े न हो सकने पर बल देता है।'
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: देख
  rationale: यह शब्द चरम स्वीकारोक्ति की ओर सीधे ध्यान खींचता है। आधुनिक हिन्दी में ‘देख’ स्वाभाविक है और यूनानी के संकेतात्मक बल को बनाए रखता है।
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: हम ... तेरे सामने हैं
  rationale: यह परमेश्वर की उपस्थिति में होने का सीधा अर्थ देता है और यहाँ ‘खड़े हैं’ नहीं जोड़ता, क्योंकि आगे στῆναι के लिए ‘खड़े रहना’ स्पष्ट रूप से आता है।
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: अपने अधर्मों सहित
  rationale: ‘अधर्म’ परमेश्वर की व्यवस्था के उल्लंघन और उससे उत्पन्न दोष—दोनों अर्थों के लिए पर्याप्त व्यापक है। ‘सहित’ यह बताता है कि वे अपने पापों की दशा में परमेश्वर के सामने उपस्थित हैं।
- source_word: οὐ γάρ ἐστιν στῆναι ἔτι
  choice: अब ... खड़े रहना संभव नहीं है
  rationale: यूनानी अस्तित्ववाचक वाक्य और क्रियार्थक रूप का स्वाभाविक हिन्दी रूप है; ‘खड़े रहना’ न्यायिक और उपासना-संबंधी बिंब को सुरक्षित रखता है।
- source_word: ἔμπροσθέν σου
  choice: तेरे सामने
  rationale: परमेश्वर की उपस्थिति और उसके सामने उत्तरदायी होने के गंभीर भाव को बनाए रखता है।
- source_word: ἐπὶ τούτοις
  choice: इन बातों के कारण
  rationale: 'संदर्भ में कारणवाचक अर्थ सबसे उपयुक्त है: अभी स्वीकार किए गए पापों के कारण वे परमेश्वर के सामने खड़े नहीं रह सकते।'
theological_decisions:
- issue: पश्चात्ताप की स्वीकारोक्ति में ἀνομίαι का अनुवाद
  choice: अधर्मों
  alternative: व्यवस्था-विरोधी कामों; अपराधों
  rationale: ‘अधर्मों’ नैतिक और व्यवस्था-संबंधी भार को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है। यह शब्द को किसी संकीर्ण पारिभाषिक धर्मसिद्धान्त तक सीमित नहीं करता।
- issue: अंतिम उपवाक्य को इब्रानी समानांतर पाठ के अनुसार विस्तृत करना या यूनानी को बनाए रखना
  choice: परमेश्वर के सामने खड़े न रह सकने की यूनानी अभिव्यक्ति को बनाए रखा
  alternative: परमेश्वर के क्रोध और बचे हुओं के पूर्ण विनाश की इब्रानी अभिव्यक्ति जोड़ना
  rationale: 1 एस्द्रास के लिए यहाँ यूनानी प्राथमिक पाठ-साक्ष्य है। इब्रानी समानांतर (एज्रा 9:14) पश्चात्ताप के संदर्भ की पुष्टि करता है, पर उसकी भिन्न शब्दावली को यूनानी वाक्य में मिलाना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और प्रार्थनामय रखी गई है। परमेश्वर को एकवचन आत्मीय-सम्मानसूचक ‘तेरे’ से संबोधित किया गया है, जो इस स्वीकारोक्ति के सीधे संबोधन और सामान्य हिन्दी बाइबलीय शैली के अनुकूल है। वाक्य-विन्यास यूनानी की पुनरुक्ति—‘तेरे सामने’—को अर्थपूर्ण रूप से बनाए रखता है।
