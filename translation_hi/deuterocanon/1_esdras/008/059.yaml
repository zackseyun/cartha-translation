base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: hi
  text: जागते रहो और उनकी रखवाली करो[a], जब तक तुम उन्हें यरूशलेम में याजकों और लेवियों के प्रधानों तथा इस्राएल के पितृकुलों के मुखियाओं को, हमारे प्रभु के भवन के कक्षों[b] में, सौंप न दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चौकस रहो और उनकी रखवाली करो।” आरम्भ की दोनों क्रियाएँ सतर्क अभिरक्षा पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: “कक्ष” से आशय मंदिर-परिसर के कमरों से है; इब्रानी समानांतर में भी “कमरे/कक्ष” है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: जागते रहो
  rationale: यह क्रिया जागते और चौकस रहने का ठोस भाव व्यक्त करती है। साथ आने वाली φυλάσσετε के साथ मिलकर यह सतर्क निगरानी पर बल देती है; सामी समानांतर שִׁקְדוּ भी चौकसी के भाव का समर्थन करता है।
- source_word: φυλάσσετε
  choice: उनकी रखवाली करो
  rationale: प्रसंग में पहले सौंपी गई पवित्र वस्तुओं को सुरक्षित रखने की आज्ञा है, इसलिए केवल ‘ध्यान रखना’ की अपेक्षा ‘रखवाली करना’ अधिक स्पष्ट है।
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: जब तक तुम उन्हें ... सौंप न दो
  rationale: यह रचना रखवाली की अवधि का अंतिम बिंदु बताती है और वस्तुओं की अभिरक्षा दूसरे अधिकारियों को दिए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: φυλάρχοις
  choice: प्रधानों
  rationale: शब्द अगुओं या प्रधानों को सूचित करता है। याजकों और लेवियों के साथ प्रयुक्त होने के कारण ‘प्रधान’ उपयुक्त है और अनावश्यक रूप से जनजातीय अर्थ आरोपित नहीं करता।
- source_word: ἡγουμένοις τῶν πατριῶν
  choice: पितृकुलों के मुखियाओं
  rationale: πατριαί औपचारिक पैतृक वंश-समूहों को और ἡγούμενοι उनके अगुओं को दर्शाता है। ‘पितृकुलों के मुखिया’ इस सामाजिक संरचना को सामान्य ‘परिवारों’ की तुलना में अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: παστοφορίοις
  choice: कक्षों
  rationale: यह मंदिर-परिसर से जुड़े कमरों या कक्षों को सूचित करता है। इब्रानी समानांतर הַלִּשְׁכוֹת भी ‘कक्षों/कमरों’ का समर्थन करता है; ‘भंडारों’ जैसा अधिक विशिष्ट अर्थ यहाँ अनावश्यक होगा।
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के भवन
  rationale: ‘भवन’ स्रोत के ‘घर’ वाले मंदिर-मुहावरे को हिन्दी में गरिमापूर्ण और बोधगम्य रूप देता है, जबकि ‘हमारे प्रभु’ यूनानी के स्पष्ट संबंधसूचक ἡμῶν को सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ οἴκου τοῦ κυρίου ἡμῶν में मंदिर और ईश्वरीय उपाधि
  choice: हमारे प्रभु के भवन
  alternative: हमारे प्रभु के मंदिर; याहवे के भवन
  rationale: यूनानी प्राथमिक पाठ में ‘हमारे प्रभु’ स्पष्ट है और ‘भवन’ मंदिर के लिए प्रयुक्त रूपक है। इब्रानी समानांतर मंदिर-संदर्भ की पुष्टि करता है, पर यूनानी पाठ के संबंधसूचक ‘हमारे’ को हटाने या उसके स्थान पर इब्रानी ईश्वरीय नाम रखने का आधार नहीं देता।
- issue: τῶν πατριῶν की सामाजिक-वंशीय संरचना
  choice: पितृकुलों
  alternative: परिवारों; पूर्वजों के घरानों
  rationale: ‘पितृकुल’ पैतृक वंश पर आधारित औपचारिक समूह को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; ‘परिवार’ इस संरचना को अत्यधिक सामान्य बना देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘जागते रहो’, ‘रखवाली करो’ और ‘सौंप न दो’ ठोस क्रियात्मक भाषा बनाए रखते हैं। ‘पितृकुल’ प्राचीन वंशीय संगठन का आवश्यक विशिष्ट भाव बचाता है। यूनानी वाक्य में स्थान-संबंधी पदों के जुड़ाव की कुछ संरचनात्मक गुंजाइश है; हिन्दी क्रम उन्हें यरूशलेम स्थित प्रभु के भवन के कक्षों में होने वाले हस्तांतरण के रूप में प्रस्तुत करता है, बिना अतिरिक्त स्थान या प्रक्रिया जोड़े।
