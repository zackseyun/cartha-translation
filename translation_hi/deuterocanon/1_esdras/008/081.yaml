base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: hi
  text: और अब अपनी बेटियों का विवाह उनके बेटों से न कराओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “अपनी बेटियों को उनके बेटों के साथ विवाह में न जोड़ो।”'
    reason: यूनानी συνοικίζω के मूल कारणवाचक अर्थ—पति-पत्नी के रूप में साथ बसाना या विवाह में जोड़ना—को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह यूनानी के संयोजक और कालसूचक क्रम को स्वाभाविक हिन्दी में बनाए रखता है और अनावश्यक रूप से निष्कर्षसूचक अर्थ नहीं जोड़ता।
- source_word: τὰς θυγατέρας ὑμῶν
  choice: अपनी बेटियों का
  rationale: सम्बन्धवाचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘अपनी’ का सम्बन्ध संबोधित समुदाय से है।
- source_word: μὴ συνοικίσητε
  choice: विवाह ... न कराओ
  rationale: συνοικίζω यहाँ किसी को पति-पत्नी के रूप में साथ बसाने, अर्थात विवाह कराने, का कारणवाचक अर्थ देता है। ‘विवाह न कराओ’ अभिभावकीय-सामुदायिक दृष्टिकोण को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: उनके बेटों से
  rationale: विवाह के साथ हिन्दी में ‘से’ स्वाभाविक है; ‘उनके’ का संकेत प्रसंग में पहले उल्लिखित लोगों की ओर है।
theological_decisions:
- issue: विवाह-निषेध की अभिव्यक्ति
  choice: अपनी बेटियों का विवाह उनके बेटों से न कराओ
  alternative: अपनी बेटियों को उनकी बेटों के साथ पत्नी के रूप में न बसाओ
  rationale: चुना हुआ पाठ यूनानी क्रिया के सामाजिक और वैवाहिक बल को बनाए रखता है, पर वचन में निहित न होने वाली कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बेटियों’ और ‘बेटों’ से पारिवारिक सम्बन्ध सीधे व्यक्त होते हैं; ‘विवाह ... कराओ’ सामान्य पाठक के लिए सहज है और मूल यूनानी की कारणवाचकता भी बनाए रखता है।
