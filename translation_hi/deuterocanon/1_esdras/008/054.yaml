  yaml_path: translation/deuterocanon/1_esdras/008/054.yaml
  text: And again we prayed to our Lord about all these things[b][a], and we found him favorable.
translation:
  language: hi
  text: और हमने इन सब बातों के विषय में फिर अपने प्रभु से प्रार्थना की[a], और हमने उन्हें कृपालु पाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी पाठ है: “और हमने इन सब बातों के विषय में फिर अपने प्रभु से प्रार्थना की, और हमने उन्हें कृपालु पाया।” इस पद के लिए दिया गया इब्रानी/मसोराई समानांतर इस कथन से मेल नहीं खाता और किसी दूसरे प्रसंग का प्रतीत होता है; इसलिए अनुवाद प्राथमिक साक्ष्य के रूप में यूनानी पाठ का अनुसरण करता है।'
    reason: textual_variant
  - marker: b
    text: या “अनुकूल पाया।” यूनानी विशेषण किसी सदय या अनुकूल मनोभाव को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह पुनरावृत्ति सूचित करता है; आधुनिक हिन्दी में ‘फिर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐδεήθημεν
  choice: हमने ... प्रार्थना की
  rationale: δέομαι आग्रहपूर्वक विनती करने को व्यक्त करता है। परमेश्वर को संबोधित इस प्रसंग में ‘प्रार्थना की’ स्वाभाविक है और याचना का भाव बनाए रखता है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: अपने प्रभु से
  rationale: δέομαι के साथ संबंधकारक उस व्यक्ति को सूचित करता है जिससे विनती की जाती है। ‘अपने प्रभु से’ हिन्दी में संबोधन का स्वाभाविक रूप है और κύριος को ‘प्रभु’ रखता है।
- source_word: πάντα ταῦτα
  choice: इन सब बातों के विषय में
  rationale: यह पहले उल्लिखित सभी विषयों की ओर सामूहिक संकेत करता है; यह रूप यूनानी बहुवचन का अर्थ स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: ἐτύχομεν
  choice: हमने ... पाया
  rationale: यहाँ τυγχάνω किसी दशा या परिणाम का अनुभव करने अथवा पाने को व्यक्त करता है; अगले विशेषण के साथ ‘पाया’ सहज हिन्दी है।
- source_word: εὐιλάτου
  choice: कृपालु
  rationale: यह शब्द अनुकूल, सदय या प्रसन्नतापूर्वक सुनने को तत्पर मनोभाव दर्शाता है। ‘कृपालु’ प्रार्थना के प्रसंग में स्वाभाविक है, पर ‘दयालु’ जैसी अधिक विशिष्ट दया-संबंधी धारणा अनिवार्य नहीं करता।
theological_decisions:
- issue: प्रार्थना के प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ संबोधन परमेश्वर से प्रार्थना का है; ‘प्रभु’ यूनानी पद और प्रसंग दोनों के अनुरूप है तथा किसी संप्रदायगत विशेषता को नहीं जोड़ता।
- issue: यूनानी पाठ और दिए गए मसोराई समानांतर के बीच बड़ा अंतर
  choice: मुख्य पाठ में यूनानी प्रार्थना-वाक्य का अनुवाद
  alternative: याजकों को अलग करने वाले मसोराई पाठ के अनुसार अनुवाद
  rationale: निर्दिष्ट प्राथमिक साक्ष्य यूनानी है, जबकि दिया गया मसोराई समानांतर इस वाक्य से मेल नहीं खाता और भिन्न प्रसंग दर्शाता है। इसलिए मुख्य अनुवाद यूनानी पर आधारित है और पाठांतर-संबंधी स्थिति पादटिप्पणी में स्पष्ट की गई है।
- issue: εὐιλάτου में अनुकूलता और कृपा का अर्थक्षेत्र
  choice: कृपालु
  alternative: अनुकूल
  rationale: ‘कृपालु’ व्यक्ति के सदय और विनती स्वीकार करने वाले रुख को सहज हिन्दी में व्यक्त करता है। ‘अनुकूल’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है; मुख्य पाठ किसी अधिक विशिष्ट प्रायश्चित्त-संबंधी अर्थ को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थना-संदर्भ के अनुकूल रूप अपनाया गया है। ‘अपने प्रभु से प्रार्थना की’ हिन्दी वाक्य-विन्यास में स्वाभाविक है। सम्मानसूचक एकवचन संदर्भ के कारण ‘उन्हें’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
