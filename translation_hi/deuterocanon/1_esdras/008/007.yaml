base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: hi
  text: क्योंकि अप्सारास के पास बहुत ज्ञान था[a], इसलिए वह प्रभु की व्यवस्था और आज्ञाओं में से कुछ भी नहीं छोड़ता था और सारे इस्राएल को विधियाँ और न्याय-विधान सिखाता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘अप्सारास’ है। इब्रानी समानांतर का संदर्भ एज्रा से मेल खाता है, पर यहाँ मुख्य यूनानी साक्ष्य में नाम का यही रूप सुरक्षित है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी पाठ का अंतिम भाग बहुत संक्षिप्त और व्याकरण की दृष्टि से असामान्य है। उसका लगभग शब्दशः क्रम है: ‘प्रभु की व्यवस्था और आज्ञाओं में से कुछ भी न छोड़ना, सारा इस्राएल, विधियाँ और न्याय-विधान।’ यहाँ संभावित आशय स्पष्ट करने के लिए ‘सिखाता था’ जोड़ा गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: अप्सारास
  rationale: मुख्य यूनानी पाठ में आए नाम का देवनागरी लिप्यंतरण किया गया है; इसे इब्रानी समानांतर के संदर्भ के अनुसार ‘एज्रा’ बनाकर समरूप नहीं किया गया।
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: उसके पास बहुत ज्ञान था
  rationale: ἐπιστήμη ज्ञान, समझ या विद्वत्ता को सूचित करता है और περιεῖχεν यहाँ उसे धारण करने का भाव देता है। यह अनुवाद सरल, स्वाभाविक और अर्थ के निकट है।
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: इसलिए वह ... कुछ भी नहीं छोड़ता था
  rationale: यह रचना उद्देश्य या परिणाम व्यक्त कर सकती है। हिंदी में ‘इसलिए’ परिणाम का स्वाभाविक भाव देता है, जबकि ‘कुछ भी नहीं छोड़ता था’ παραλείπειν के व्यापक अर्थ को बनाए रखता है।
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: प्रभु की व्यवस्था और आज्ञाओं में से
  rationale: νόμος के लिए प्रचलित बाइबलीय शब्द ‘व्यवस्था’ और ἐντολαί के लिए ‘आज्ञाएँ’ रखा गया है। यूनानी में दोहराए गए ἐκ का संबंध हिंदी के साझा ‘में से’ से स्पष्ट है।
- source_word: πάντα τὸν Ἰσραήλ
  choice: सारे इस्राएल को
  rationale: आरोप कारक पद को संक्षिप्त वाक्य-विन्यास में निहित शिक्षा-क्रिया का कर्म समझा गया है। ‘सारा इस्राएल’ सामूहिक पहचान को बनाए रखता है।
- source_word: δικαιώματα καὶ κρίματα
  choice: विधियाँ और न्याय-विधान
  rationale: दोनों यूनानी शब्द कानूनी शब्दावली हैं। ‘विधियाँ’ निर्धारित नियमों और ‘न्याय-विधान’ न्यायिक निर्णयों या नियमों का भेद यथासंभव बनाए रखते हैं।
theological_decisions:
- issue: पद के अंत में संक्षिप्त और असामान्य यूनानी वाक्य-विन्यास
  choice: अंतिम कानूनी पदों को वह विषय माना गया है जिसकी शिक्षा अप्सारास सारे इस्राएल को देता था।
  alternative: शब्दशः और अस्पष्ट ढंग से ‘कुछ भी न छोड़ना ... सारा इस्राएल, विधियाँ और न्याय-विधान’ रखा जा सकता है, बिना ‘सिखाता था’ जोड़ने के।
  rationale: प्राप्त यूनानी पाठ में πάντα τὸν Ἰσραήλ δικαιώματα καὶ κρίματα के साथ कोई स्पष्ट सीमित क्रिया नहीं है। सुसंगत हिंदी के लिए संदर्भ में निहित शिक्षा का भाव स्पष्ट किया गया है, और इस पूर्ति की सूचना पादटिप्पणी में दी गई है।
- issue: εἰς τό के उद्देश्य अथवा परिणाम का संबंध
  choice: ‘इसलिए’ द्वारा परिणाम का भाव व्यक्त किया गया है।
  alternative: इसे ‘ताकि’ कहकर उद्देश्य के रूप में भी समझा जा सकता है।
  rationale: दोनों अर्थ व्याकरणतः संभव हैं; ज्ञान से कुछ भी न छोड़ने की परिणति यहाँ अधिक स्वाभाविक लगती है। किसी धार्मिक निष्कर्ष को जोड़ने के बजाय वैकल्पिक संभावना को स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण बाइबलीय रूप अपनाया गया है। ‘व्यवस्था’, ‘आज्ञाएँ’, ‘विधियाँ’ और ‘न्याय-विधान’ कानूनी शब्दावली का औपचारिक स्वर बनाए रखते हैं। नाम को मुख्य यूनानी पाठ के अनुसार रखा गया है और पाठगत कठिनाई को छिपाने के बजाय पादटिप्पणी में बताया गया है।
