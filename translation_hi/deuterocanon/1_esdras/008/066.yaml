base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: hi
  text: शासकों, याजकों और लेवियों ने देश की विदेशी जातियों से और उनकी अशुद्धताओं से अपने आपको अलग नहीं रखा है[a]—अर्थात कनानियों, हित्तियों, परिज्जियों, यबूसियों, मोआबियों, मिस्रियों और एदोमियों से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश की विदेशी जातियों से, उनकी अशुद्धताओं सहित, अपने आपको अलग नहीं रखा है।” यूनानी वाक्य-विन्यास संक्षिप्त है; वह जातियों से अलगाव और उनकी अशुद्धताओं के सम्बन्ध को पूरी तरह स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: अपने आपको अलग नहीं रखा है
  rationale: यूनानी क्रिया अलग करने की पूरी न हुई कार्रवाई बताती है; प्रसंग में इसका भाव आत्मवाचक है। हिन्दी का पूर्ण वर्तमान इस सूचना-प्रधान कथन में स्वाभाविक है।
- source_word: οἱ ἄρχοντες
  choice: शासकों
  rationale: यह अधिकार रखने वाले सार्वजनिक पदाधिकारियों का व्यापक संकेत है; ‘शासक’ उस औपचारिक भूमिका को बनाए रखता है।
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: याजकों और लेवियों
  rationale: इन धार्मिक और वंशगत समूहों के लिए प्रचलित, स्पष्ट बाइबलीय पद रखे गए हैं।
- source_word: ἀλλογενῆ ἔθνη τῆς γῆς
  choice: देश की परदेशी जातियों
  rationale: ἀλλογενής गैर-इस्राएली अथवा दूसरे समुदाय के लोगों को और γῆ स्थानीय देश को सूचित करता है। ‘परदेशी जातियाँ’ आधुनिक नस्लीय अर्थ थोपे बिना जातीय-राष्ट्रीय भेद बनाए रखता है।
- source_word: ἀκαθαρσίας αὐτῶν
  choice: उनकी अशुद्धताओं
  rationale: बहुवचन को बनाए रखते हुए धार्मिक और नैतिक अशुद्धि का संयुक्त भाव सुरक्षित रखा गया है; इसे अधिक प्रबल ‘घृणित काम’ नहीं बनाया गया।
- source_word: Χαναναίων ... Ἰδουμαίων
  choice: कनानियों ... एदोमियों
  rationale: जाति-नामों के मानक हिन्दी रूप दिए गए हैं; Ἰδουμαῖοι का सम्बन्ध एदोम से है। ‘अर्थात’ सूची को पहले आए परदेशी समुदायों की व्याख्या के रूप में स्पष्ट करता है।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: ‘अशुद्धताओं’ द्वारा धार्मिक-नैतिक अशुद्धि का तनाव बनाए रखा गया है।
  alternative: ‘घृणित कामों’ या केवल ‘बुरी प्रथाओं’
  rationale: मूल यूनानी ἀκαθαρσία अशुद्धि की भाषा प्रयोग करता है। अधिक तीखा या केवल सामाजिक-नैतिक पद चुनना मूल से आगे जाकर अर्थ को सीमित कर देता।
- issue: अलगाव का सम्बन्ध
  choice: लोगों और उनकी अशुद्धताओं—दोनों से अलग न रहने का संक्षिप्त भाव रखा गया है।
  alternative: केवल लोगों से अलग न रहना, अथवा केवल उनकी अशुद्ध प्रथाओं से अलग न रहना
  rationale: प्रेषित यूनानी वाक्य-विन्यास संक्षिप्त और कुछ असहज है। मुख्य पाठ दोनों सम्बन्धों को खुला रखता है और पादटिप्पणी उस अस्पष्टता को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। जाति-नामों के प्रचलित बाइबलीय रूप अपनाए गए हैं। ‘अशुद्धताओं’ से मूल का धार्मिक-नैतिक स्वर और बहुवचन दोनों सुरक्षित हैं।
