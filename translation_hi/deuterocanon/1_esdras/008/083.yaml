translation:
  language: hi
  text: तुम्हारे पुत्रों को सदा तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध स्रोत में इस पद का बचा हुआ यूनानी पाठ केवल एक छोटा-सा वाक्यांश है, जिसका शाब्दिक अर्थ है, “तुम्हारे पुत्रों को सदा तक।” साथ दिया गया इब्रानी समानांतर पाठ एक अलग, अधिक लंबा प्रसंग प्रस्तुत करता है; इसलिए उससे यहाँ के लुप्त शब्दों का पुनर्निर्माण नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: तुम्हारे पुत्रों को
  rationale: बहुवचन दत्तिवाचक पदबंध का सीधा अर्थ ‘तुम्हारे पुत्रों को/के लिए’ है। खंडित यूनानी पाठ में संबंध स्पष्ट न होने के कारण स्वाभाविक और निकट रूप ‘तुम्हारे पुत्रों को’ रखा गया है; υἱοῖς के स्पष्ट पुल्लिंग अर्थ को ‘संतान’ बनाकर व्यापक नहीं किया गया।
- source_word: ἕως αἰῶνος
  choice: सदा तक
  rationale: यह यूनानी मुहावरा निरंतर या चिरस्थायी अवधि व्यक्त करता है। ‘सदा तक’ आधुनिक हिन्दी में बोधगम्य है और मूल की कालगत संरचना के निकट भी रहता है।
theological_decisions:
- issue: खंडित पाठ और समानांतर इब्रानी पाठ में बड़ा अंतर
  choice: 'उपलब्ध यूनानी अंश का उसी के खंडित रूप में सीधा अनुवाद किया गया: ‘तुम्हारे पुत्रों को सदा तक।’'
  alternative: इब्रानी समानांतर पाठ के आधार पर एक अधिक लंबा वाक्य पुनर्निर्मित करना
  rationale: प्राथमिक यूनानी साक्ष्य में इस पद के लिए केवल τοῖς υἱοῖς ὑμῶν ἕως αἰῶνος उपलब्ध है। दिया गया इब्रानी समानांतर एक अलग और अधिक लंबा प्रसंग दर्शाता है; इसलिए उससे लुप्त शब्दों का पुनर्निर्माण करना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। स्रोत की खंडित अवस्था को सहज बनाने के लिए कोई अतिरिक्त क्रिया या प्रसंग नहीं जोड़ा गया।
