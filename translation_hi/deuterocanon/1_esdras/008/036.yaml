base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: hi
  text: 'बानी के वंशजों में से: योसफियास का पुत्र सलीमोथ[a], और उसके साथ एक सौ साठ पुरुष;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा 8:8 के इब्रानी समानांतर में यहाँ उल्लेखनीय भिन्नता है: उसमें दूसरा कुल, दूसरा अगुआ और दूसरी संख्या दी गई है। चूँकि 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, मुख्य पाठ यूनानी के अनुसार ‘बानी … योसफियास का पुत्र सलीमोथ … एक सौ साठ पुरुष’ रखता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: बानी के वंशजों में से
  rationale: वंशावली-सूची में υἱοί केवल सीधे पुत्रों के बजाय कुल या वंश के सदस्यों को भी दर्शा सकता है। इसलिए आधुनिक हिन्दी में अर्थ स्पष्ट करने के लिए ‘वंशजों’ चुना गया है, जबकि Βανίας को यूनानी साक्ष्य के अनुसार ‘बानी’ लिखा गया है।
- source_word: Σαλειμὼθ
  choice: सलीमोत
  rationale: नाम का लिप्यंतरण प्राथमिक यूनानी पाठ से किया गया है; इसे भिन्न इब्रानी समानांतर के नाम के अनुरूप नहीं बदला गया।
- source_word: Ἰωσαφίου
  choice: योसफियास का पुत्र
  rationale: सम्बन्धकारक रूप Ἰωσαφίου वंशावली के इस संदर्भ में पिता-पुत्र का सम्बन्ध सूचित करता है। स्वाभाविक हिन्दी में निहित सम्बन्ध को ‘का पुत्र’ से व्यक्त किया गया है।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: यह यूनानी पदबंध का सीधा और संक्षिप्त अनुवाद है तथा मूल सूची की अपूर्ण-वाक्य शैली को बनाए रखता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ἄνδρες यहाँ सामान्य ‘लोगों’ के बजाय पुरुषों को निर्दिष्ट करता है; ‘पुरुष’ लिंग-सटीक और सूची के संदर्भ में स्वाभाविक है।
- source_word: ἑκατὸν ἑξήκοντα
  choice: एक सौ साठ
  rationale: मूल संख्या का स्पष्ट, प्रचलित हिन्दी रूप।
