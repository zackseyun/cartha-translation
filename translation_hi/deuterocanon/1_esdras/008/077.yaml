  text: from our Lord,[a]
translation:
  language: hi
  text: हमारे प्रभु के द्वारा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध कराया गया यूनानी स्रोत केवल ὑπὸ τοῦ κυρίου ἡμῶν—अर्थात् ‘हमारे प्रभु के द्वारा’—इतना ही खंड है। दिया गया समानांतर इब्रानी पाठ इस वाक्यांश से सीधे मेल नहीं खाता; इसलिए यहाँ उससे कोई पूरा वाक्य पुनर्निर्मित नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ὑπὸ
  choice: के द्वारा
  rationale: संबंधकारक के साथ ὑπό सामान्यतः कर्ता या माध्यम को सूचित करता है। खंडित संदर्भ में ‘के द्वारा’ यूनानी संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है, यद्यपि कुछ प्रसंगों में ‘से’ भी संभव होता।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ आधुनिक हिन्दी बाइबिलीय प्रयोग में स्वाभाविक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला विकल्प है।
- source_word: ἡμῶν
  choice: हमारे
  rationale: प्रथम पुरुष बहुवचन संबंधसूचक सर्वनाम को स्पष्ट रूप से रखा गया है और ‘प्रभु’ के साथ हिन्दी व्याकरण के अनुसार ‘हमारे’ किया गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ मूल शब्द की धार्मिक और अधिकारसूचक व्यापकता को बनाए रखता है; यह खंड ऐसा कोई प्रसंग नहीं देता जिसके कारण अधिक लौकिक ‘स्वामी’ चुनना आवश्यक हो।
- issue: खंडित और असंगत स्रोत-साक्ष्य का निर्वाह
  choice: केवल उपलब्ध यूनानी वाक्यांश का सावधानी से अनुवाद
  alternative: समानांतर इब्रानी पाठ के आधार पर पूरा वाक्य पुनर्निर्मित करना
  rationale: दिया गया यूनानी स्रोत केवल ὑπὸ τοῦ κυρίου ἡμῶν है, जबकि उपलब्ध इब्रानी समानांतर इससे सीधे मेल नहीं खाता। इसलिए यूनानी में अनुपस्थित सामग्री जोड़ने के बजाय पाठ की अपूर्णता को पादटिप्पणी में स्पष्ट किया गया है।
- issue: ὑπό में निहित संबंध
  choice: कर्ता/माध्यम के अर्थ में ‘के द्वारा’
  alternative: स्रोत के अर्थ में ‘से’
  rationale: संबंधकारक के साथ ὑπό का सामान्य अर्थ कर्ता को चिह्नित करना है। संदर्भ के अभाव से कुछ अनिश्चितता रहती है, पर ‘के द्वारा’ उपलब्ध यूनानी रूप का सबसे सीधा प्रतिनिधित्व करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। उपलब्ध पाठ स्वयं एक अधूरा वाक्यांश है, इसलिए अनुवाद में उसका खंडित स्वरूप बनाए रखा गया है; अल्पविराम भी आगे के लुप्त या अनुपलब्ध संदर्भ का संकेत देता है।
