base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: hi
  text: और हे एज्रा, तुम अपने परमेश्वर की बुद्धि के अनुसार न्यायियों और न्यायाधिकारियों को नियुक्त करो, ताकि वे पूरे सीरिया और फिनीके[a] में उन सभी लोगों का न्याय करें जो तुम्हारे परमेश्वर की व्यवस्था जानते हैं; और जो उसे नहीं जानते, उन्हें तुम सिखाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “सीरिया और फिनीके” है। एज्रा के सामी समानांतर पाठ में प्रांतीय शब्दावली भिन्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάδειξον
  choice: नियुक्त करो
  rationale: यह आज्ञार्थक क्रिया अधिकारियों को विधिवत पद पर नियुक्त करने का भाव देती है।
- source_word: κριτὰς καὶ δικαστάς
  choice: न्यायियों और न्याय-अधिकारियों
  rationale: दोनों यूनानी पदों के बीच भेद बनाए रखते हुए पहले को न्याय करने वालों और दूसरे को न्यायिक पदाधिकारियों के रूप में व्यक्त किया गया है।
- source_word: ὅπως δικάζωσιν
  choice: ताकि वे ... न्याय करें
  rationale: इससे उद्देश्यसूचक रचना सुरक्षित रहती है और κριτάς के साथ शाब्दिक संबंध भी बना रहता है।
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: पूरे सीरिया और फीनीके में
  rationale: यूनानी पाठ में दिए गए भौगोलिक नाम और अधिकार-क्षेत्र की व्यापकता सीधे सुरक्षित रखी गई है।
- source_word: πάντας τοὺς ἐπισταμένους
  choice: उन सभी लोगों ... जो ... जानते हैं
  rationale: ἐπίσταμαι के ज्ञान अथवा परिचय के सामान्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν νόμον τοῦ θεοῦ σου
  choice: तुम्हारे परमेश्वर की व्यवस्था
  rationale: νόμος के धार्मिक-विधिक अर्थ के लिए 'व्यवस्था' उपयुक्त है और σου को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: διδάξεις
  choice: तुम सिखाना
  rationale: भविष्यत् सूचक रूप यहाँ राजकीय निर्देश का बल रखता है; हिन्दी में यह विनम्र नहीं बल्कि स्पष्ट आदेशात्मक निर्देश के रूप में स्वाभाविक है।
theological_decisions:
- issue: यूनानी भौगोलिक पदनाम को रखना या सामी समानांतर पाठ से उसका सामंजस्य करना
  choice: मुख्य पाठ में ‘सीरिया और फीनीके’ रखा गया
  alternative: एज्रा के सामी समानांतर पाठ के प्रांतीय शब्दों के अनुसार सामंजस्यपूर्ण अनुवाद
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है और उसमें Συρίᾳ καὶ Φοινίκῃ स्पष्ट है; इसलिए समानांतर पाठ के आधार पर इसे बदला नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय-निर्देश शैली रखी गई है। ‘न्यायियों’ और ‘न्याय-अधिकारियों’ द्वारा निकटार्थक यूनानी पदों का भेद सुरक्षित है। पाद-टिप्पणी चिह्न वाक्य के अंत में रखा गया है क्योंकि वह भौगोलिक पाठांतर से संबंधित है।
