base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: hi
  text: सद्दूलूक का पुत्र[a], अखीतोब का पुत्र, अमार्थेइओस का पुत्र, ओज़ेइआस का पुत्र, बोक्का का पुत्र, अबेइसाई का पुत्र, फ़ीनेस का पुत्र, एलीआज़र का पुत्र[b], प्रथम याजक हारून का पुत्र।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ इब्रानी समानांतर से अधिक विस्तृत वंशावली देता है। संक्षिप्त इब्रानी पाठ है: “शल्लूम का पुत्र, सादोक का पुत्र, अहीतूब का पुत्र।”'
    reason: alternative_reading
  - marker: b
    text: 'इनमें से कई यूनानी नामों के अधिक परिचित इब्रानी-संबद्ध रूप हैं: अखीतोब = अहीतूब, ओज़ेइआस = उज्जी, बोक्का = बुक्की, अबेइसाई = अबीशू, और फ़ीनेस = पीनहास।'
    reason: lexical_alternative
  - marker: c
    text: या संभवतः, “प्रधान याजक हारून”; किंतु यूनानी शब्द का सामान्य अर्थ “याजक” है, “महायाजक” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: वंशावली में बार-बार आने वाला संबंधकारक पद लुप्त ‘पुत्र’ का अर्थ देता है; समानांतर इब्रानी में בֶּן स्पष्ट रूप से ‘पुत्र’ है।
- source_word: Σαδδουλούκου
  choice: सद्दूलूक
  rationale: यूनानी पाठ को प्राथमिक मानते हुए नाम का देवनागरी लिप्यंतरण किया गया है; इसे इब्रानी समानांतर के ‘शल्लूम’ से नहीं मिलाया गया।
- source_word: Ἀχειτὼβ
  choice: अहीतोब
  rationale: यूनानी रूप का स्वाभाविक हिन्दी लिप्यंतरण; प्रचलित इब्रानी-संबद्ध रूप ‘अहीतूब’ पादटिप्पणी में दिया गया है।
- source_word: Ἀμαρθείου
  choice: अमरथियस
  rationale: यूनानी वंशावली में उपस्थित अतिरिक्त पूर्वज के नाम को सुरक्षित रखा गया है।
- source_word: Ὀζείου
  choice: ओज़ियस
  rationale: यूनानी रूप का लिप्यंतरण किया गया है; इब्रानी-संबद्ध ‘उज्जी’ को मुख्य पाठ में नहीं रखा गया।
- source_word: Βοκκὰ
  choice: बोक्का
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Ἀβεισαὶ
  choice: अबीसाई
  rationale: यूनानी रूप को प्राथमिकता दी गई; इब्रानी-संबद्ध रूप ‘अबीशू’ पादटिप्पणी में है।
- source_word: Φεινεὲς
  choice: फ़ीनेस
  rationale: यूनानी नाम का लिप्यंतरण; अधिक परिचित इब्रानी रूप ‘पीनहास’ पादटिप्पणी में दिया गया है।
- source_word: Ἐλεαζὰρ
  choice: एलीआज़र
  rationale: हिन्दी बाइबलीय प्रयोग में परिचित रूप, जो यूनानी उच्चारण के भी निकट है।
- source_word: Ἀαρὼν
  choice: हारून
  rationale: हिन्दी में इस प्रसिद्ध नाम का स्थापित रूप।
- source_word: τοῦ πρώτου ἱερέως
  choice: प्रथम याजक
  rationale: πρῶτος का सीधा अर्थ ‘प्रथम’ और ἱερεύς का ‘याजक’ है; ‘महायाजक’ कहना यूनानी ἀρχιερεύς को आयात करता।
theological_decisions:
- issue: लंबी यूनानी वंशावली को छोटे इब्रानी समानांतर से मिलाना या यथावत रखना
  choice: मुख्य पाठ में पूरी यूनानी वंशावली सुरक्षित रखी गई
  alternative: ‘शल्लूम का पुत्र, सादोक का पुत्र, अहीतूब का पुत्र’ जैसा संक्षिप्त इब्रानी समानांतर
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है; स्पष्ट रूप से लंबी वंशावली को संक्षिप्त करना पाठांतर को मिटा देता।
- issue: ἱερεύς को ‘याजक’ या ‘महायाजक’ कहना
  choice: याजक
  alternative: महायाजक
  rationale: यूनानी में ἱερεύς है, ἀρχιερεύς नहीं। हारून की ऐतिहासिक भूमिका के आधार पर अनुल्लिखित पदवी जोड़ने से बचा गया है।
- issue: πρῶτος को क्रमवाचक या पद-प्रधानता के अर्थ में लेना
  choice: प्रथम
  alternative: प्रधान
  rationale: ‘प्रथम’ यूनानी शब्द का सीधा अर्थ है और यह कालक्रम अथवा वंशक्रम का अर्थ खुला रखता है; ‘प्रधान’ संभावित अर्थ को निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज वंशावली-शैली वाला गद्य। नामों में यूनानी स्रोत की विशिष्टता रखी गई है, पर हारून और एलीआज़र जैसे हिन्दी में सुस्थापित रूप अपनाए गए हैं। मुख्य पाठ में प्रत्येक पादटिप्पणी-चिह्न उपस्थित है।
