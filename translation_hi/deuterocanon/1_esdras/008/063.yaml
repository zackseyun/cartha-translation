base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: hi
  text: 'बंधुआई से आए लोगों ने इस्राएल के परमेश्वर, प्रभु को बलियाँ चढ़ाईं: छियानबे [मेढ़े][a], छिहत्तर मेमने, और कल्याण-बलि[b] के लिए बारह बकरे। ये सभी प्रभु के लिए बलि के रूप में चढ़ाए गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी पाठ में ‘छियानबे’ के बाद पशु का नाम नहीं है; ‘मेढ़े’ सूची के संदर्भ और अन्य पाठ-साक्ष्यों के आधार पर जोड़ा गया है।
    reason: textual_clarification
  - marker: b
    text: यूनानी का शाब्दिक अर्थ ‘उद्धार के लिए’ या ‘छुटकारे के लिए’ भी हो सकता है; बलिदानी संदर्भ में इसका अर्थ ‘कल्याण’ या ‘कुशल’ से संबंधित भेंट भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: बंधुआई से आए लोग
  rationale: यह παραγενόμενοι के ‘आ पहुँचना/आना’ और αἰχμαλωσία के ‘बंधुआई’ वाले अर्थ को सरल, स्वाभाविक हिन्दी में रखता है।
- source_word: προσήνεγκαν θυσίας
  choice: बलियाँ चढ़ाईं
  rationale: बलिदान-संबंधी प्रसंग में προσφέρω का स्वाभाविक हिन्दी रूप ‘चढ़ाना’ है; θυσίας का बहुवचन भी सुरक्षित है।
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: इस्राएल के परमेश्वर, प्रभु को
  rationale: दोनों दत्तिव पदों को समानाधिकरण में रखते हुए प्रभु की पहचान इस्राएल के परमेश्वर के रूप में व्यक्त की गई है।
- source_word: ἐνενήκοντα ἕξ
  choice: छियानबे [मेढ़े]
  rationale: उपलब्ध यूनानी पाठ में संख्या के साथ पशु-संज्ञा नहीं है। सूची और परंपरागत पाठ-साक्ष्य के आधार पर ‘मेढ़े’ की पूर्ति आवश्यक प्रतीत होती है, इसलिए उसे कोष्ठकों में और पाद-टिप्पणी सहित रखा गया है।
- source_word: ἄρνας ἑβδομήκοντα ἕξ
  choice: छिहत्तर मेमने
  rationale: ἄρνας यहाँ छोटे भेड़-पशुओं को सूचित करता है; ‘मेमने’ बलिदानी सूची में स्पष्ट और स्वाभाविक है।
- source_word: τράγους
  choice: बकरे
  rationale: τράγος विशेष रूप से नर बकरी है; हिन्दी में ‘बकरा’ वही भेद स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπὲρ σωτηρίου
  choice: कल्याण-बलि के लिए
  rationale: बलिदानी संदर्भ में σωτήριον का आशय कुशल, कल्याण या उद्धार से जुड़ी भेंट हो सकता है। ‘कल्याण-बलि’ संदर्भ को स्पष्ट करता है, जबकि शाब्दिक अर्थ-सीमा पाद-टिप्पणी में सुरक्षित है।
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: ये सभी प्रभु के लिए बलि थे
  rationale: सूची के सभी पशुओं को सामूहिक रूप से प्रभु को अर्पित बलि बताने वाले यूनानी निष्कर्ष को सहज हिन्दी वाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: ὑπὲρ σωτηρίου का बलिदानी अर्थ
  choice: कल्याण-बलि के लिए
  alternative: उद्धार के लिए; छुटकारे के लिए; कुशल-मंगल के लिए
  rationale: शब्द का मूल अर्थ उद्धार, छुटकारा या कुशलता तक फैलता है, पर यहाँ पशु-बलियों की सूची होने के कारण बलिदानी प्रयोग प्रमुख है। मुख्य पाठ संदर्भगत अर्थ देता है और पाद-टिप्पणी वास्तविक शब्दगत अस्पष्टता बचाती है।
- issue: छियानबे की संख्या के साथ लुप्त पशु-संज्ञा
  choice: '[मेढ़े] को संपादकीय पूर्ति के रूप में रखना'
  alternative: केवल ‘छियानबे’ लिखना
  rationale: दिए गए यूनानी पाठ में संख्या अकेली है, जिससे हिन्दी सूची अधूरी और अस्पष्ट हो जाती है। संभावित पूर्ति को बिना संकेत के मूल पाठ का भाग मानना उचित नहीं, इसलिए वर्ग कोष्ठक और पाद-टिप्पणी द्वारा पाठगत स्थिति स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण धार्मिक गद्य अपनाया गया है। ‘बंधुआई’, ‘बलि चढ़ाना’ और ‘प्रभु’ जैसे व्यापक रूप से समझे जाने वाले बाइबलीय पद रखे गए हैं। मूल पाठ की अपूर्णता को छिपाने के बजाय वर्ग कोष्ठक और पाद-टिप्पणी से स्पष्ट किया गया है।
