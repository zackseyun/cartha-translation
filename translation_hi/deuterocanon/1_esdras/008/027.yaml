base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: hi
  text: और मैं अपने प्रभु परमेश्वर की सहायता से साहसी हुआ, और मैंने इस्राएल में से पुरुषों[a] को इकट्ठा किया, ताकि वे मेरे साथ ऊपर जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 7:28 के इब्रानी समानांतर पाठ में यहाँ ‘पुरुषों’ के बजाय ‘प्रधानों’ या ‘अगुओं’ का उल्लेख है। 1 एस्द्रास यहाँ यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: मैंने साहस बाँधा
  rationale: यह पदबंध आत्मविश्वास या हिम्मत पाने का भाव व्यक्त करता है। ‘साहस बाँधा’ स्वाभाविक आधुनिक हिन्दी है और सामर्थ्य पाने के भाव को बिना बढ़ाए व्यक्त करता है।
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: सहायता पाकर
  rationale: ἀντίλημψις का अर्थ सहायता, सहारा या समर्थन है। यह अनुवाद यूनानी अर्थ को सहज हिन्दी में व्यक्त करता है; समानांतर इब्रानी पाठ के ‘हाथ’ वाले मुहावरे को अनावश्यक रूप से मुख्य पाठ में नहीं लाता।
- source_word: Κυρίου θεοῦ μου
  choice: अपने प्रभु परमेश्वर
  rationale: यूनानी κύριος और θεός का सीधा तथा प्रतिष्ठित हिन्दी रूप है; ‘अपने’ का प्रयोग वाक्य के कर्ता के साथ सम्बन्ध को स्वाभाविक बनाता है।
- source_word: συνήγαγον
  choice: इकट्ठा किया
  rationale: क्रिया के ‘एकत्र करना’ अर्थ का स्पष्ट और आम बोलचाल में समझ आने वाला रूप।
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: इस्राएल में से
  rationale: यह उन लोगों के स्रोत-समुदाय को स्पष्ट करता है जिन्हें वक्ता ने इकट्ठा किया।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: यूनानी पाठ स्पष्ट रूप से ‘पुरुषों’ कहता है। इब्रानी समानांतर में ‘प्रधान/अगुए’ है, जिसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
- source_word: ὥστε συναναβῆναί μοι
  choice: कि वे मेरे साथ ऊपर जाएँ
  rationale: यह उद्देश्य/परिणाम को स्पष्ट करता है और यरूशलेम की ओर यात्रा के लिए प्रयुक्त ‘ऊपर जाना’ मुहावरा बनाए रखता है।
theological_decisions:
- issue: इकट्ठा किए गए लोगों की पहचान के विषय में यूनानी और इब्रानी समानांतर का अंतर
  choice: पुरुषों
  alternative: प्रधानों या अगुओं
  rationale: 1 एस्द्रास के प्राथमिक यूनानी स्रोत में ἄνδρας (‘पुरुषों’) है, जबकि एज्रा 7:28 के इब्रानी समानांतर में רָאשִׁים (‘प्रधान/अगुए’) है। मुख्य पाठ यूनानी का अनुसरण करता है और भिन्न पाठ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साहस बाँधा’ तथा ‘सहायता पाकर’ स्वाभाविक हिन्दी में यूनानी अर्थ देते हैं, जबकि ‘ऊपर जाएँ’ यरूशलेम की ओर चढ़ने के प्राचीन यात्रा-मुहावरे को बनाए रखता है।
