base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: hi
  text: इस विषय में हम प्रभु के सामने शपथ लें कि विदेशी लोगों में से अपनी सभी पत्नियों को उनके बच्चों समेत निकाल दें[a], जैसा आपने निर्णय किया है और जैसा वे सभी करेंगे जो प्रभु की व्यवस्था का पालन करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विदा कर दें” अथवा “बाहर कर दें।”
    reason: ἐκβαλεῖν का अर्थ ‘निकालना,’ ‘बाहर करना,’ या ‘विदा करना’ हो सकता है।
  - marker: b
    text: 'यूनानी में अंतिम खंड संकुचित है: “जैसा आपके द्वारा निर्णय किया गया है, और जितने प्रभु की व्यवस्था का पालन करेंगे।” दूसरे खंड के साथ ‘निर्णय करेंगे’ जैसी क्रिया हिन्दी में समझने के लिए जोड़ी गई है; उसका सटीक वाक्यगत संबंध अनिश्चित है।'
    reason: ὡς ἐκρίθη σοι, καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου में दूसरे सदस्य के लिए अपेक्षित क्रिया स्पष्ट रूप से दोहराई नहीं गई है।
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इस विषय में
  rationale: यह पदबंध चर्चा के विशिष्ट मामले की ओर संकेत करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: γενέσθω ἡμῖν ὁρκωμοσία πρὸς τὸν κύριον
  choice: हम प्रभु से यह शपथ खाएँ
  rationale: यूनानी में शाब्दिक रूप से ‘हमारे लिए प्रभु की ओर शपथ हो’ है; हिन्दी मुहावरे में ‘प्रभु से शपथ खाना’ उसी प्रतिज्ञात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκβαλεῖν
  choice: निकाल दें
  rationale: क्रिया में बाहर करने या विदा कर देने का प्रबल भाव है। ‘निकाल दें’ उसका सीधा अर्थ रखता है, जबकि अन्य सम्भव अर्थ फुटनोट में दिए गए हैं।
- source_word: πάσας τὰς γυναῖκας ἡμῶν τὰς ἐκ τῶν ἀλλογενῶν
  choice: पराए लोगों में से ली गई अपनी सभी पत्नियों को
  rationale: वैवाहिक प्रसंग में γυναῖκας का अर्थ ‘पत्नियाँ’ है। ἀλλογενῶν दूसरी जाति या लोगों से सम्बन्धित होने को दर्शाता है; ‘पराए लोगों’ से यह जातीय भिन्नता व्यक्त होती है, बाद की धर्मशास्त्रीय श्रेणी आरोपित नहीं होती।
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: उनके बच्चों समेत
  rationale: संक्षिप्त और स्वाभाविक हिन्दी में σύν द्वारा व्यक्त साथ होने का अर्थ स्पष्ट रहता है।
- source_word: ὡς ἐκρίθη σοι, καὶ ὅσοι πειθαρχήσουσιν
  choice: जैसा आपने और ... पालन करने वाले सभी लोगों ने निर्णय किया है
  rationale: प्रेषित यूनानी वाक्य रचना संकुचित और कुछ अस्पष्ट है। पठनीय हिन्दी के लिए निर्णय की क्रिया को दोनों पक्षों के साथ जोड़ा गया है, और इस पूर्ति को फुटनोट में स्पष्ट किया गया है।
- source_word: τοῦ νόμου τοῦ κυρίου
  choice: प्रभु की व्यवस्था
  rationale: ‘व्यवस्था’ बाइबिलीय कानूनी और वाचागत अर्थ को बनाए रखती है तथा νόμος का प्रचलित हिन्दी प्रतिशब्द है।
theological_decisions:
- issue: κύριος द्वारा इस्राएल के परमेश्वर का उल्लेख
  choice: प्रभु
  alternative: स्वामी
  rationale: वाचा और व्यवस्था के इस प्रसंग में ‘प्रभु’ सम्मानसूचक और प्रचलित बाइबिलीय रूप है; ‘स्वामी’ यहाँ अनावश्यक रूप से मानवीय प्रभुता का आभास दे सकता है।
- issue: ἀλλογενῶν का जातीय वर्णन
  choice: पराए लोगों
  alternative: अन्यजातियों / विदेशी लोगों
  rationale: ‘पराए लोगों’ मूल के ‘दूसरे कुल या जाति के’ भाव को रखता है और बाद के यहूदी–गैरयहूदी धर्मशास्त्रीय विभाजन को पाठ में नहीं जोड़ता।
- issue: संकुचित निर्णय-वाक्य में कर्ताओं का सम्बन्ध
  choice: एज्रा और व्यवस्था का पालन करने वाले सभी लोगों को निर्णय के साथ जोड़ना
  alternative: ‘जैसा आपके लिए निर्णय हुआ, और जितने प्रभु की व्यवस्था का पालन करेंगे’
  rationale: यूनानी व्याकरण यहाँ संकुचित है और अन्तिम खंड का सम्बन्ध पूरी तरह स्पष्ट नहीं। मुख्य पाठ में सम्भावित निहित सम्बन्ध को पठनीय बनाया गया है, पर फुटनोट मूल की अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘शपथ खाएँ’, ‘पत्नियों’, ‘बच्चों समेत’ और ‘व्यवस्था का पालन’ स्वाभाविक मुहावरे हैं। कठिन यूनानी वाक्य-विन्यास को मुख्य पाठ में पठनीय बनाया गया है, जबकि उसकी अस्पष्टता फुटनोट में सुरक्षित रखी गई है।
