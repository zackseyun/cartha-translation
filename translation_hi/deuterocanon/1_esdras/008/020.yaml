  rationale: οἶνος के लिए यह स्वाभाविक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी बाइबलीय शब्द है।
- source_word: μετρητῶν ἑκατόν
  choice: सौ माप
  rationale: यूनानी μετρητής तरल पदार्थ का माप है, पर यहाँ वह किसी अधिक विशिष्ट इकाई का नाम नहीं देता; इसलिए 'बत' थोपने के बजाय स्रोत की सामान्य अभिव्यक्ति रखी गई है।
