base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: hi
  text: और अब, थोड़े समय के लिए[a], प्रभु, प्रभु की ओर से हम पर दया हुई है, ताकि हमारे लिए इस पवित्रस्थान में एक जड़ और एक नाम बचा रहे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: कुछ हद तक। यूनानी पदबंध मात्रा और छोटी अवधि—दोनों अर्थ दे सकता है।'
    reason: κατὰ πόσον τι की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: थोड़े समय के लिए
  rationale: यह असामान्य यूनानी पदबंध सीमित मात्रा या अवधि को व्यक्त करता है। प्रसंग के अनुरूप कालवाचक अर्थ मुख्य पाठ में रखा गया है, जबकि उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ἔλεος παρὰ τοῦ κυρίου Κυρίου
  choice: प्रभु, प्रभु की ओर से हम पर दया हुई है
  rationale: ἔλεος को स्वाभाविक हिन्दी में ‘दया’ और παρὰ को स्रोतसूचक ‘की ओर से’ किया गया है। κυρίου Κυρίου की जानबूझकर की गई पुनरुक्ति को हटाया नहीं गया।
- source_word: ῥίζαν καὶ ὄνομα
  choice: एक जड़ और एक नाम
  rationale: दोनों ठोस रूपकों को औपचारिक रूप से बनाए रखा गया है; ‘जड़’ को व्याख्यात्मक ‘बचा हुआ समुदाय’ से प्रतिस्थापित नहीं किया गया।
- source_word: καταλειφθῆναι ἡμῖν
  choice: हमारे लिए … बचा रहे
  rationale: यूनानी निष्क्रिय अनंत धातुरूप का उद्देश्य/परिणाम हिन्दी में ‘ताकि’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: इस पवित्र स्थान में
  rationale: ἁγιάσματος के पवित्रता/पवित्रस्थान-संबंधी अर्थ को सहज हिन्दी विशेषणात्मक पदबंध में व्यक्त किया गया है।
theological_decisions:
- issue: दया का स्रोत और प्रभु की उपाधि की पुनरुक्ति
  choice: ‘प्रभु, प्रभु की ओर से’
  alternative: ‘परम प्रभु की ओर से’ या केवल ‘प्रभु की ओर से’
  rationale: मूल यूनानी में κύριος दो बार है। इसे एक संयुक्त उपाधि या एकल उल्लेख बनाना पाठ की असामान्य किन्तु वास्तविक पुनरुक्ति को मिटा देता।
- issue: ‘जड़’ का सामुदायिक रूपक
  choice: रूपक को ‘जड़’ के रूप में बनाए रखना
  alternative: ‘बचा हुआ अंश’ या ‘वंश’
  rationale: ῥίζα का शाब्दिक रूपक वंश, निरंतरता या बचे हुए समुदाय की कई संभावित ध्वनियाँ रखता है; किसी एक व्याख्या को मुख्य पाठ में थोपना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्यांश की प्रार्थनात्मक गंभीरता, ‘प्रभु’ की पुनरुक्ति तथा ‘जड़ और नाम’ के मूल रूपक सुरक्षित रखे गए हैं। अंतिम अल्पविराम इसलिए रखा गया है क्योंकि उपलब्ध अंश आगे जारी रहने वाले वाक्य का भाग है।
