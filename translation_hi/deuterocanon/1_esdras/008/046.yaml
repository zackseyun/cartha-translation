base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
translation:
  language: hi
  text: और उन्हें यह आज्ञा देकर कि वे लोदायोस[a], उसके भाइयों और उस स्थान के कोषाध्यक्षों से बात करें कि वे हमारे पास[c] ऐसे लोगों को भेजें, जो हमारे प्रभु[b] के भवन में याजकों के रूप में सेवा करें[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘लोदायोस’ है; एज्रा 8:17 के इब्रानी समानांतर पाठ में ‘इद्दो’ है।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में ‘हमारे प्रभु’ है; इब्रानी समानांतर पाठ में ‘हमारे परमेश्वर’ है।
    reason: alternative_reading
  - marker: c
    text: यूनानी पाठ में ‘हमारे पास भेजें’ है; इब्रानी समानांतर पाठ में ‘हमारे पास ले आएँ’ है।
    reason: alternative_reading
  - marker: d
    text: यूनानी पाठ विशेष रूप से ‘याजकों के रूप में सेवा करनेवालों’ की बात करता है; इब्रानी समानांतर पाठ में अधिक व्यापक शब्द ‘सेवा करनेवाले’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: उन्हें यह आज्ञा देकर
  rationale: यूनानी में यह कृदन्त है। हिन्दी में ‘आज्ञा देकर’ उसके अधीनस्थ और पूर्वकालिक संबंध को बनाए रखता है तथा पद के खंडात्मक प्रवाह को नहीं बदलता।
- source_word: διαλεχθῆναι
  choice: बात करें
  rationale: यह सामान्य बातचीत या किसी विषय पर संवाद करने को व्यक्त करता है; ‘बात करें’ सहज आधुनिक हिन्दी है।
- source_word: Λοδαίῳ
  choice: लोदायोस
  rationale: प्रधान यूनानी पाठ के नाम का लिप्यंतरण किया गया है; समानांतर इब्रानी पाठ के ‘इद्दो’ से इसका सामंजस्य नहीं किया गया।
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: उसके भाइयों
  rationale: ἀδελφοί का सामान्य और प्रत्यक्ष अर्थ ‘भाई’ है; प्रसंग इसे अनिवार्य रूप से व्यापक संबंधियों के अर्थ में लेने की माँग नहीं करता।
- source_word: γαζοφύλαξιν
  choice: कोषाध्यक्षों
  rationale: यह शब्द कोष की देखरेख करनेवाले अधिकारियों को दर्शाता है; ‘कोषाध्यक्ष’ संक्षिप्त, स्वाभाविक और प्रशासनिक भूमिका के अनुकूल है।
- source_word: ἀποστεῖλαι ἡμῖν
  choice: हमारे पास ... भेजें
  rationale: यूनानी ἀποστέλλω का मूल अर्थ ‘भेजना’ है। हिन्दी में गंतव्य के लिए ‘हमारे पास’ अधिक स्वाभाविक है; इब्रानी समानांतर के ‘हमारे पास ले आएँ’ को पादटिप्पणी में रखा गया है।
- source_word: τοὺς ἱερατεύσαντας
  choice: ऐसे लोगों को ... जो ... याजकों के रूप में सेवा करें
  rationale: ἱερατεύω विशेष रूप से याजकीय कार्य या सेवा को सूचित करता है। यह अनुवाद उस विशेषता को बनाए रखते हुए हिन्दी में अपेक्षित भाव को सहज रूप से व्यक्त करता है।
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के भवन में
  rationale: यूनानी κύριος का अनुवाद ‘प्रभु’ किया गया है और मंदिर-संदर्भ में οἶκος के पारंपरिक तथा स्पष्ट अर्थ ‘भवन’ को रखा गया है।
theological_decisions:
- issue: मंदिर-वाक्यांश में यूनानी κύριος और इब्रानी समानांतर אֱלֹהֵינוּ का अंतर
  choice: हमारे प्रभु
  alternative: हमारे परमेश्वर
  rationale: 1 एस्द्रास के लिए उपलब्ध प्रधान स्रोत यूनानी पाठ है, जिसमें ‘हमारे प्रभु’ है। समानांतर इब्रानी पाठ का ‘हमारे परमेश्वर’ पाठांतर के रूप में पादटिप्पणी में दिया गया है, न कि मुख्य पाठ में मिलाया गया है।
- issue: τοὺς ἱερατεύσαντας की याजकीय विशिष्टता
  choice: याजकों के रूप में सेवा करें
  alternative: सेवक
  rationale: यूनानी शब्द स्पष्ट रूप से याजकीय सेवा बताता है, जबकि इब्रानी समानांतर अधिक व्यापक ‘सेवा करनेवाले’ कहता है। मुख्य अनुवाद यूनानी की विशिष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। यूनानी कृदन्त के कारण पद को पिछले वाक्य से जुड़ा हुआ खंड मानकर आरंभ में ‘और ... आज्ञा देकर’ तथा अंत में अल्पविराम रखा गया है। नाम को प्रधान यूनानी साक्ष्य के अनुसार लिप्यंतरित किया गया है और सभी महत्वपूर्ण समानांतर इब्रानी भेद पादटिप्पणियों में सुरक्षित हैं।
