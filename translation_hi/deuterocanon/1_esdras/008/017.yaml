lexical_decisions:
- source_word: κατὰ
  choice: और ... के विषय में
  rationale: κατά यहाँ प्रशासनिक पत्र में अगले विषय को प्रस्तुत करता है। खंडित वाक्य की संरचना बनाए रखते हुए हिंदी में इसे पात्रों को विषय के रूप में सामने रखकर व्यक्त किया गया है।
- source_word: ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: σκεύη उपासना में प्रयुक्त पात्रों या उपकरणों को और ἱερά उनकी पवित्र अथवा समर्पित स्थिति को दर्शाता है। ‘पवित्र पात्र’ स्वाभाविक बाइबलीय हिंदी है और वस्तुओं का प्रकार अनावश्यक रूप से सीमित नहीं करता।
- source_word: τὰ διδόμενα
  choice: जो ... दिए जा रहे हैं
  rationale: वर्तमान कर्मवाच्य कृदंत पात्रों के उस समय सौंपे जाने की प्रक्रिया बताता है; ‘दिए जा रहे हैं’ यह कालगत और कर्मवाच्य बल बनाए रखता है।
- source_word: εἰς τὴν χρείαν
  choice: उपयोग के लिए
  rationale: χρεία यहाँ आवश्यकता से अधिक व्यावहारिक धार्मिक उपयोग या प्रयोजन को सूचित करता है।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर
  rationale: यूनानी ἱερόν का प्रत्यक्ष अर्थ यहाँ यरूशलेम का मंदिर है। ‘मंदिर’ मूल यूनानी को ‘भवन/घर’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है; सामी समानांतर की भिन्न शब्दावली पादटिप्पणी में दी गई है।
- source_word: τοῦ θεοῦ σου
  choice: तुम्हारे परमेश्वर के
  rationale: संबंधकारक पदबंध को सीधा रखा गया है और एकवचन संबोधन ‘तुम्हारे’ से सुरक्षित है।
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह पद मंदिर का स्थान बताता है; हिंदी में ‘यरूशलेम में तुम्हारे परमेश्वर के मंदिर’ स्वाभाविक और स्पष्ट है।
