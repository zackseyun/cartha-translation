  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। पद मूल में पूर्ववर्ती वाक्य से जुड़ा हुआ खंड है, इसलिए अंत में अल्पविराम रखा गया है। ‘पवित्र पात्र’ धार्मिक संदर्भ सुरक्षित रखता है, जबकि ‘मंदिर’ प्राथमिक यूनानी पाठ का अनुसरण करता है।
