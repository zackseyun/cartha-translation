  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: hi
  text: हे प्रभु, मैं आपके सामने लज्जित और शर्मसार हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘आपकी उपस्थिति में।’ यूनानी में शाब्दिक रूप से ‘आपके मुख के सामने’ है; यह परमेश्वर के सीधे सम्मुख होने की ठोस, सामी-शैली की अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: κύριος का सम्बोधन-रूप है। हिन्दी में ‘हे प्रभु’ प्रत्यक्ष प्रार्थना और उसकी गरिमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ᾔσχυμμαι
  choice: मैं लज्जित हूँ
  rationale: पूर्णकालिक मध्य/कर्मवाच्य रूप से उत्पन्न वर्तमान अवस्था व्यक्त होती है। ‘लज्जित हूँ’ इस स्थायी वर्तमान भाव को सहज और संक्षिप्त हिन्दी में रखता है।
- source_word: ἐντέτραμμαι
  choice: अपमानित हूँ
  rationale: यह पहले क्रियापद के साथ मिलकर लज्जा और तिरस्कार की अवस्था को तीव्र करता है। ‘अपमानित’ दूसरे पद का अलग अर्थ बनाए रखता है, जबकि अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: κατὰ πρόσωπόν σου
  choice: आपके मुख के सामने
  rationale: यूनानी अभिव्यक्ति का ठोस ‘मुख’ बिंब और उसकी सामी शैली सुरक्षित रहती है। वाक्य के अंत में अलग रखे जाने से परमेश्वर के सीधे सम्मुख होने का भार उभरता है।
theological_decisions:
- issue: Κύριε में परमेश्वर के लिए सम्बोधन
  choice: हे प्रभु
  alternative: प्रभु
  rationale: मूल पाठ सीधे परमेश्वर को सम्बोधित करता है। ‘हे’ हिन्दी में सम्बोधन को स्पष्ट करता है, पर ऐसा कोई अधिक विशिष्ट वाचा-सूचक नाम नहीं जोड़ता जो यूनानी पाठ में नहीं है।
- issue: κατὰ πρόσωπόν σου की ठोस अभिव्यक्ति
  choice: आपके मुख के सामने
  alternative: आपके सामने / आपकी उपस्थिति में
  rationale: अधिक सहज विकल्प सम्भव हैं, पर ‘मुख’ का बिंब परमेश्वर के सीधे सम्मुख की गई स्वीकारोक्ति की निकटता और भार को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापूर्ण, गरिमामय और सामान्य पाठक के लिए बोधगम्य। दो समानार्थी क्रियापदों की तीव्रता बनाए रखी गई है और मूल की ठोस ‘मुख’ अभिव्यक्ति को पादटिप्पणी सहित सुरक्षित किया गया है।
