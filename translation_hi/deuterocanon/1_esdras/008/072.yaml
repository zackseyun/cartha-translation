base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: hi
  text: क्योंकि हमारे पाप हमारे सिरों से भी ऊपर बढ़ गए हैं, और अज्ञान में किए गए हमारे अपराध[a] स्वर्ग तक उठ गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी भूलें,” “हमारे अनजाने पाप,” अथवा “हमारे अज्ञान के काम।” यूनानी में यहाँ प्रयुक्त शब्द पिछले खंड के “पाप” वाले शब्द से अलग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: यह नैतिक दोष और पाप के लिए स्वाभाविक तथा सीधा हिन्दी शब्द है।
- source_word: ἐπλεόνασαν
  choice: बढ़ गए हैं
  rationale: क्रिया मात्रा में बढ़ने को व्यक्त करती है और सिरों से ऊपर जमा होते पापों का चित्र बनाए रखती है।
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: हमारे सिरों से भी ऊपर
  rationale: यह यूनानी के स्थानवाचक रूपक को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है और अत्यधिक, अभिभूत कर देने वाले दोष का भाव देता है।
- source_word: ἄγνοιαι
  choice: अज्ञान में किए गए हमारे अपराध
  rationale: यह ἁμαρτίαι से शब्दगत भेद बनाए रखते हुए अज्ञान या अनजानेपन से जुड़े अपराधों का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπερήνεγκαν
  choice: उठ गए हैं
  rationale: यह ऊपर की ओर बढ़ने का दृश्यात्मक भाव बनाए रखता है; 'स्वर्ग तक' के साथ इसका अर्थ स्पष्ट है।
- source_word: ἕως τοῦ οὐρανοῦ
  choice: स्वर्ग तक
  rationale: यह धार्मिक संदर्भ में οὐρανός का स्वाभाविक हिन्दी अनुवाद है और ऊर्ध्व दिशा के रूपक को बनाए रखता है।
theological_decisions:
- issue: क्या ἁμαρτίαι और ἄγνοιαι को एक ही प्रकार के पाप के रूप में अनूदित किया जाए
  choice: '''पाप'' और ''अज्ञान में किए गए अपराध'' के रूप में भेद बनाए रखा गया है।'
  alternative: दोनों को 'पाप', 'अपराध' या सामूहिक रूप से 'दोष' कहना।
  rationale: यूनानी पाठ दो अलग संज्ञाओं का प्रयोग करता है। यह संभवतः अलंकारिक तीव्रता के साथ-साथ सामान्य पाप और अज्ञान अथवा अनजानेपन से जुड़े अपराधों के बीच अंतर भी सूचित करता है; अनुवाद में इस तनाव को मिटाना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर परंतु सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर हिब्रू पाठ इस पद से मेल नहीं खाता, इसलिए अनुवाद का आधार यहाँ दिया गया यूनानी पाठ ही है।
