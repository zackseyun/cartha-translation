base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: hi
  text: और मैंने उनसे कहा, “तुम भी प्रभु के लिए पवित्र हो, और पात्र भी पवित्र हैं। चाँदी और सोना प्रभु, हमारे पूर्वजों के प्रभु, के लिए मन्नत की भेंट हैं[a][b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अधिक शाब्दिक अर्थ “मन्नत” या प्रसंगानुसार “मन्नत की भेंट” हो सकता है; इब्रानी समानांतर पाठ में “स्वेच्छा-भेंट” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “हमारे पूर्वजों के प्रभु” है; इब्रानी समानांतर पाठ में “यहोवा, तुम्हारे पूर्वजों के परमेश्वर” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί / ἅγια
  choice: पवित्र
  rationale: यह शब्द व्यक्तियों और मन्दिर के पात्रों की पवित्र स्थिति तथा प्रभु के लिए अलग किए जाने का भाव व्यक्त करता है। एक ही हिन्दी शब्द की पुनरावृत्ति यूनानी पाठ की समानांतर रचना को बनाए रखती है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: सम्बन्ध और समर्पण व्यक्त करने वाले यूनानी सम्प्रदान कारक तथा समानांतर इब्रानी לַיהוָה के अनुरूप यह सहज हिन्दी है।
- source_word: σκεύη
  choice: पात्र
  rationale: मन्दिर के प्रसंग में यह पवित्र उपयोग के बर्तनों या उपकरणों को सूचित करता है; ‘पात्र’ संक्षिप्त, स्वाभाविक और धार्मिक सूची के प्रसंग में स्पष्ट है।
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: चाँदी और सोना
  rationale: दोनों शब्द यहाँ धनराशि से अधिक मूल्यवान धातुओं को सूचित करते हैं; उनकी सीधी भौतिक अर्थवत्ता सुरक्षित रखी गई है।
- source_word: εὐχή
  choice: मन्नत की भेंट
  rationale: यूनानी शब्द का प्राथमिक अर्थ ‘मन्नत’ हो सकता है और इस प्रसंग में वह समर्पित भेंट को दर्शाता है। ‘मन्नत की भेंट’ यूनानी साक्ष्य को प्राथमिकता देती है; इब्रानी समानांतर का ‘स्वेच्छा-भेंट’ पाठ पादटिप्पणी में रखा गया है।
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के प्रभु
  rationale: यह दिए गए यूनानी पाठ का सीधा अर्थ है। ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक है और ‘हमारे’ यूनानी सर्वनाम को सुरक्षित रखता है।
theological_decisions:
- issue: εὐχή और समानांतर इब्रानी נְדָבָה के बीच अर्थभेद
  choice: मुख्य पाठ में ‘मन्नत की भेंट’
  alternative: ‘स्वेच्छा-भेंट’ या सामान्य ‘भेंट’
  rationale: प्राथमिक यूनानी पाठ εὐχή को बनाए रखना उचित है, जबकि इब्रानी समानांतर सम्भवतः स्वेच्छा से दी गई भेंट का संकेत करता है। अर्थभेद को मुख्य पाठ में मिलाकर समाप्त करने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: अन्तिम ईश्वरीय उपाधि में यूनानी और इब्रानी समानांतर का भेद
  choice: ‘हमारे पूर्वजों के प्रभु’
  alternative: ‘तुम्हारे पूर्वजों के परमेश्वर यहोवा’ अथवा ‘हमारे पूर्वजों के परमेश्वर प्रभु’
  rationale: यूनानी प्राथमिक साक्ष्य में ‘प्रभु’ और ‘हमारे’ है तथा ‘परमेश्वर’ नहीं है। इब्रानी समानांतर में ‘यहोवा, तुम्हारे पूर्वजों का परमेश्वर’ है। मुख्य पाठ यूनानी को बिना सामंजस्य किए प्रस्तुत करता है और दूसरे साक्ष्य को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुम’ यहाँ बहुवचन है। दूसरे वाक्य और दीर्घ विराम-चिह्न से यूनानी कथन की सूची स्पष्ट होती है, जबकि ‘भी’ की पुनरावृत्ति व्यक्तियों और पात्रों के समान पवित्र दर्जे को स्वाभाविक हिन्दी में उभारती है।
