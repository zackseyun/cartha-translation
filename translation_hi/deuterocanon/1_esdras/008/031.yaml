base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: hi
  text: पहत-मोआब के वंशजों में से ज़ाराइऊ का पुत्र एलियालोनियास[a], और उसके साथ दो सौ पुरुष;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘ज़ाराइऊ का पुत्र एलियालोनियास’ है; एज्रा 8:4 के इब्रानी समानांतर में ‘जरह्याह का पुत्र एल्यहोएनै’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: पहत-मोआब के वंशजों में से
  rationale: यूनानी Μααθμωάβ उस कुलनाम का रूप है जिसे एज्रा 8:4 का इब्रानी समानांतर ‘पहत-मोआब के वंशज’ के रूप में स्पष्ट करता है। सूची के प्रसंग में ‘वंशजों में से’ स्वाभाविक हिंदी है और कुल-संबंध को स्पष्ट करता है।
- source_word: Ἐλιαλωνίας
  choice: एलियालोनियास
  rationale: मुख्य पाठ को प्राथमिक यूनानी साक्ष्य पर आधारित रखते हुए नाम का यूनानी-आधारित देवनागरी लिप्यंतरण किया गया है; इब्रानी समानांतर का भिन्न रूप पादटिप्पणी में दिया गया है।
- source_word: Ζαραιου
  choice: जरायू
  rationale: यह यूनानी संबंधकारक रूप है, इसलिए हिंदी में ‘जरायू का पुत्र’ के द्वारा संबंध स्पष्ट करते हुए यूनानी-आधारित नाम सुरक्षित रखा गया है।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: यह वाक्यांश का सीधा और सूची के अनुकूल स्वाभाविक अनुवाद है।
- source_word: ἄνδρες διακόσιοι
  choice: दो सौ पुरुष
  rationale: यूनानी ἄνδρες का सामान्य अर्थ यहाँ ‘पुरुष’ है; यह गणना-सूची के प्रसंग में उपयुक्त है।
