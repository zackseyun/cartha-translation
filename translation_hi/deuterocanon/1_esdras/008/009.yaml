  yaml_path: translation/deuterocanon/1_esdras/008/009.yaml
  text: King Artaxerxes to Ezra the priest and reader of the law of the Lord[a], greetings.
translation:
  language: hi
  text: राजा अर्तक्षत्र की ओर से याजक तथा प्रभु की व्यवस्था के पाठक[a] एज्रा को नमस्कार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “प्रभु की व्यवस्था का पाठक”; एज्रा 7:12 के इब्रानी समानांतर में है, “स्वर्ग के परमेश्वर की व्यवस्था का शास्त्री।”
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς Ἀρταξέρξης
  choice: राजा अर्तक्षत्र
  rationale: पत्र के आरंभ में प्रयुक्त यूनानी राजकीय उपाधि और नाम को स्वाभाविक हिन्दी क्रम में रखा गया है; फ़ारसी राजा के नाम का प्रचलित हिन्दी बाइबलीय रूप ‘अर्तक्षत्र’ अपनाया गया है।
- source_word: Ἔσρᾳ
  choice: एज्रा को
  rationale: सम्बोधन-पंक्ति के सम्प्रदान कारक को ‘को’ से व्यक्त किया गया है और नाम का आधुनिक हिन्दी में पहचाना जाने वाला रूप रखा गया है।
- source_word: τῷ ἱερεῖ
  choice: याजक
  rationale: यह एज्रा के पद को बताने वाला समानाधिकरण पद है; ‘याजक’ प्रतिष्ठित और सहज बाइबलीय हिन्दी है।
- source_word: ἀναγνώστῃ
  choice: पाठक
  rationale: यूनानी शब्द का सीधा अर्थ पढ़ने या पढ़कर सुनाने वाला है। इसे इब्रानी समानांतर के ‘शास्त्री’ से मिलाने के बजाय यूनानी पाठ की विशिष्टता सुरक्षित रखी गई है।
- source_word: τοῦ νόμου Κυρίου
  choice: प्रभु की व्यवस्था के
  rationale: सम्बन्धकारक पदबंध को स्वाभाविक हिन्दी में प्रस्तुत किया गया है; νόμος के लिए ‘व्यवस्था’ और Κύριος के लिए ‘प्रभु’ मानक, संदर्भानुकूल विकल्प हैं।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारंभ में यह शब्द अभिवादन का रूढ़ रूप है; शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘नमस्कार’ हिन्दी पत्र-शैली में इसके कार्य को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: यूनानी ἀναγνώστῃ और इब्रानी समानांतर के ‘शास्त्री’ के बीच अंतर
  choice: पाठक
  alternative: शास्त्री
  rationale: 1 एस्द्रास के लिए प्राथमिक आधार यूनानी पाठ है, जिसमें एज्रा को स्पष्टतः ‘पाठक’ कहा गया है। इब्रानी समानांतर इस शब्द को बदलने का आधार नहीं है, पर पाठांतर-संबंधी जानकारी पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण पत्रारंभ। ‘की ओर से … को नमस्कार’ जोड़कर यूनानी प्रेषक-प्राप्तकर्ता संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि ‘पाठक’ द्वारा यूनानी पाठ की विशिष्टता बनाए रखी गई है।
