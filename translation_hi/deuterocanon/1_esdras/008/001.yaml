base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: hi
  text: इन घटनाओं के बाद, फ़ारसियों के राजा[a] अर्तक्षत्र के शासनकाल में, शल्लूम का पुत्र खेल्कियाह, उसका पुत्र जेक्री, उसका पुत्र अजर्याह, और उसका पुत्र एज्रा ऊपर आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘फ़ारसियों के राजा’ है; एज्रा 7:1 के समानांतर इब्रानी पाठ में ‘फ़ारस के राजा’ है। मुख्य पाठ 1 एस्द्रास के यूनानी स्रोत का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: इन घटनाओं के बाद
  rationale: यूनानी पदबंध संक्षिप्त और कुछ असामान्य है, पर यहाँ उसका कार्य कथा में बाद का समय बताना है। समानांतर इब्रानी पाठ भी इसी स्वाभाविक काल-संक्रमण की पुष्टि करता है।
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: अर्तक्षत्र के शासनकाल में
  rationale: Genitive absolute समय की पृष्ठभूमि बताता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक अभिव्यक्ति है।
- source_word: τοῦ βασιλέως Περσῶν
  choice: फ़ारसियों के राजा
  rationale: यूनानी में Περσῶν बहुवचन है, इसलिए मुख्य पाठ में ‘फ़ारसियों’ रखा गया है; इसे इब्रानी समानांतर के एकवचन ‘फ़ारस’ से नहीं मिलाया गया।
- source_word: προσέβη
  choice: ऊपर आया
  rationale: क्रिया में ऊँचाई की ओर यात्रा करने का भाव है और एज्रा-वृत्तांत के प्रसंग में यह यरूशलेम की ओर जाने का संकेत देता है। गंतव्य को पाठ में स्पष्ट रूप से जोड़े बिना दिशात्मक भाव सुरक्षित रखा गया है।
- source_word: Ἔσρας
  choice: एज्रा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἀζαραίου
  choice: अजर्याह
  rationale: यूनानी रूप समानांतर इब्रानी עֲזַרְיָה से मेल खाता है; हिन्दी में पहचाना जाने वाला सामी रूप अपनाया गया है।
- source_word: Ζεχρίου
  choice: जकर्याह
  rationale: इस प्रसिद्ध बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: Χελκείου
  choice: खेल्कियाह
  rationale: मुख्य पाठ यूनानी Χελκείου के रूप को दर्शाता है। समानांतर इब्रानी में अधिक परिचित ‘हिल्कियाह’ है, जिसे पादटिप्पणी में दिया गया है।
- source_word: Σαλήμου
  choice: शल्लूम
  rationale: यह रूप समान वंशावली-परंपरा के इब्रानी नाम שַׁלּוּם से सबसे स्वाभाविक रूप से मेल खाता है।
