  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: hi
  text: और इसके अलावा, तुम्हारे परमेश्वर के मंदिर की ज़रूरत के लिए तुम्हें जो कुछ भी चाहिए हो, वह राजकोष से देना।
