lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: इसके अलावा ... जो कुछ भी
  rationale: यह पद पहले बताई गई वस्तुओं या खर्चों से आगे आने वाली किसी भी अतिरिक्त आवश्यकता को समेटता है; हिन्दी में यह स्वाभाविक और व्यापक है।
- source_word: ὅσα ἂν ὑποπίπτῃ σοι
  choice: जो कुछ भी सामने आए
  rationale: यह यूनानी मुहावरा किसी आवश्यकता के उत्पन्न होने या ध्यान में आने का भाव देता है; ἂν की संभाव्यता भी बनी रहती है।
- source_word: εἰς τὴν χρείαν
  choice: आवश्यकता के लिए
  rationale: χρεία का मूल अर्थ आवश्यकता या जरूरत है; यह व्यावहारिक जरूरत को स्पष्ट रखता है।
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: तुम्हारे परमेश्वर के मन्दिर की
  rationale: प्राथमिक यूनानी पाठ में ἱερόν सीधे मन्दिर अथवा पवित्र मन्दिर-परिसर को सूचित करता है। समानान्तर अरामी पाठ में ‘तुम्हारे परमेश्वर का भवन’ है, पर वह यहाँ अनुमानित समानान्तर साक्ष्य है; इसलिए मुख्य पाठ में यूनानी को प्राथमिकता दी गई है।
- source_word: δώσεις
  choice: देना
  rationale: राजकीय आदेश के प्रसंग में भविष्यत् निर्देशात्मक बल रखता है। हिन्दी का आज्ञार्थक ‘देना’ औपचारिक आदेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: राजकोष से
  rationale: यह राजकीय खजाने या कोष का संक्षिप्त, आधुनिक और प्रशासनिक हिन्दी रूप है।
theological_decisions:
- issue: τοῦ ἱεροῦ τοῦ θεοῦ σου का अनुवाद और समानान्तर अरामी साक्ष्य
  choice: तुम्हारे परमेश्वर के मन्दिर की
  alternative: तुम्हारे परमेश्वर के भवन की / तुम्हारे परमेश्वर के पवित्रस्थान की
  rationale: प्राथमिक यूनानी साक्ष्य ἱερόν का प्रयोग करता है, जिसका इस प्रसंग में सबसे सीधा अर्थ ‘मन्दिर’ है। अरामी समानान्तर ‘भवन’ का समर्थन करता है, लेकिन यूनानी पाठ को बदलने के बजाय उस भिन्न अभिव्यक्ति को वैकल्पिक रूप में दर्ज करना अधिक स्रोत-संगत है। कोई सम्प्रदायगत अर्थ नहीं जोड़ा गया।
