base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: hi
  text: परमेश्वर की व्यवस्था के अनुसार परमप्रधान परमेश्वर के लिए यह किया जाए[a][b], ताकि राजा के राज्य और उसके पुत्रों पर क्रोध न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमप्रधान परमेश्वर के लिए परमेश्वर की व्यवस्था के अनुसार यह कार्यान्वित किया जाए।” यूनानी आज्ञार्थक क्रिया निर्धारित कार्य को पूरी तरह संपन्न करने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: एज्रा 7:23 के इब्रानी समानांतर पाठ में यहाँ काफी भिन्न सामग्री है; उसके निकटवर्ती संदर्भ में मंदिर की सेवा के लिए निश्चित मात्राएँ उपलब्ध कराने पर बल है। 1 एस्द्रास में यहाँ संक्षिप्त यूनानी कथन मिलता है; अनुवाद में यूनानी पाठ को मुख्य आधार बनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: परमेश्वर की व्यवस्था के अनुसार
  rationale: κατά यहाँ किसी मानक के अनुरूप होने का भाव देता है। νόμος के लिए ‘व्यवस्था’ धार्मिक और विधिक दोनों संदर्भों में स्वाभाविक तथा परिचित है।
- source_word: ἐπιτελεσθήτω
  choice: यह पूरा किया जाए
  rationale: यह निष्क्रिय आज्ञार्थक रूप निर्धारित कार्य को संपन्न या कार्यान्वित करने की मांग करता है। ‘पूरा किया जाए’ क्रिया के पूर्ण निष्पादन का भाव रखता है, पर ‘ठीक-ठीक’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: परमप्रधान परमेश्वर के लिए
  rationale: संप्रदान कारक यहाँ उस परमेश्वर की सेवा या हित की ओर संकेत करता है जिसके लिए कार्य किया जाना है। ‘परमप्रधान परमेश्वर’ उपाधि को सहज हिंदी में रखता है।
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: ताकि ... न आए
  rationale: यह रचना किसी अवांछित परिणाम को रोकने का उद्देश्य व्यक्त करती है; हिंदी में ‘ताकि ... न’ उसी प्रयोजनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀργήν
  choice: क्रोध
  rationale: ‘क्रोध’ गंभीर रोष और संभावित दंड—दोनों की संभावना बनाए रखता है, बिना वाक्य में ‘परमेश्वर का’ जोड़कर निहित कर्ता को स्पष्ट करने के।
- source_word: βασιλείαν τοῦ βασιλέως
  choice: राजा के राज्य
  rationale: यह सीधा और स्वाभाविक रूप से राजा के शासन-क्षेत्र को व्यक्त करता है।
- source_word: τῶν υἱῶν
  choice: उसके पुत्रों
  rationale: यूनानी पाठ स्पष्ट रूप से ‘पुत्रों’ कहता है; सर्वनाम संदर्भ से राजा की ओर लौटता है।
theological_decisions:
- issue: आने वाले क्रोध का स्वरूप
  choice: ‘क्रोध’ को बिना स्पष्ट कर्ता जोड़े रखा गया है।
  alternative: ‘परमेश्वर का क्रोध’ या सामान्य ‘विपत्ति’ कहना।
  rationale: संदर्भ में क्रोध का परमेश्वर से होना स्वाभाविक है, किंतु यूनानी वाक्य इस स्थान पर ‘परमेश्वर का’ स्पष्ट रूप से नहीं कहता। अनुवाद संदर्भगत अर्थ को रहने देता है, पर उसे विस्तार देकर निश्चित नहीं करता।
- issue: परमप्रधान परमेश्वर से कार्य का संबंध
  choice: कार्य ‘परमप्रधान परमेश्वर के लिए’ किया जाए।
  alternative: कार्य ‘परमप्रधान परमेश्वर को’ किया जाए।
  rationale: धार्मिक-प्रशासनिक संदर्भ में संप्रदान कारक का प्रयोजन या सेवा-संबंध हिंदी में ‘के लिए’ से अधिक स्वाभाविक ढंग से व्यक्त होता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘व्यवस्था’, ‘परमप्रधान परमेश्वर’ और ‘क्रोध’ जैसे स्थापित धार्मिक शब्द बनाए गए हैं; वाक्य को अनावश्यक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचाया गया है।
