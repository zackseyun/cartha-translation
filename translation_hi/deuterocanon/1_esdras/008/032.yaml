base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: hi
  text: 'ज़थोएस[a] के वंशजों में से: एइखोनियास, येथेल का पुत्र, और उसके साथ दो सौ पुरुष; आदीन के वंशजों में से: ऊबेन[b], योनातान का पुत्र, और उसके साथ ढाई सौ पुरुष।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राथमिक 1 एस्द्रास यूनानी साक्ष्य में कुलनाम का रूप ‘ज़थोएस’ है; अनुमानित मसोरेटी समानांतर में नाम का रूप भिन्न है।
    reason: alternative_reading
  - marker: b
    text: ‘ऊबेन’ अनिश्चित यूनानी नाम-रूप Οὐβὴν का लिप्यंतरण है; ‘उबेन’ या ‘ओबेन’ जैसे रूप भी संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के वंशजों में से
  rationale: यह पदबंध किसी कुल या वंश में से आए लोगों का परिचय देता है। शाब्दिक ‘पुत्रों में से’ की अपेक्षा यह हिन्दी में स्वाभाविक है और वंशावली का भाव बनाए रखता है।
- source_word: Ζαθόης
  choice: ज़थोएस
  rationale: प्राथमिक यूनानी पाठ के नाम-रूप का देवनागरी लिप्यंतरण किया गया है; अनुमानित मसोरेटी समानांतर के भिन्न नाम से इसे नहीं बदला गया।
- source_word: Εἰεχονίας
  choice: येखोनियास
  rationale: प्रेषित यूनानी वर्तनी के निकट रहते हुए हिन्दी में उच्चारणयोग्य लिप्यंतरण।
- source_word: Ἰεθήλου
  choice: येथेल का पुत्र
  rationale: सूची की संरचना में संबंध पितृनामवाचक है; यूनानी संबंधकारक को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: गणना-सूची का सूत्र और दोहराव सीधे रूप में सुरक्षित रहता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी शब्द विशेष रूप से पुरुषों को दर्शाता है, सामान्य ‘लोगों’ को नहीं।
- source_word: διακόσιοι
  choice: दो सौ
  rationale: संख्या का सीधा आधुनिक हिन्दी रूप।
- source_word: Ἀδείν
  choice: आदीन
  rationale: यूनानी कुलनाम का निकट देवनागरी लिप्यंतरण।
- source_word: Οὐβὴν
  choice: ऊबेन
  rationale: अनिश्चित यूनानी नाम-रूप का यथासंभव सीधा ध्वन्यात्मक लिप्यंतरण; पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: Ἰωνάθου
  choice: योनातान का पुत्र
  rationale: पूर्ववर्ती नाम-युग्म की तरह पितृनाम संबंध को हिन्दी में स्पष्ट किया गया है।
- source_word: διακόσιοι πεντήκοντα
  choice: ढाई सौ
  rationale: दो सौ पचास का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप।
