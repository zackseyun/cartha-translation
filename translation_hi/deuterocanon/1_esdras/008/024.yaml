  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘व्यवस्था’, ‘उल्लंघन’, ‘दंड’, ‘जुर्माना’ और ‘निर्वासन’ न्यायिक स्वर बनाए रखते हैं। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न [a] और [b] संबंधित स्थानों पर दिए गए हैं।
