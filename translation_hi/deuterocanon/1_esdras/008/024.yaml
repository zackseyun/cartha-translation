base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: hi
  text: और जो कोई तुम्हारे परमेश्वर की व्यवस्था और राजा की व्यवस्था—दोनों का उल्लंघन करे, उसे पूरी सावधानी से दंड दिया जाएगा[a]—चाहे मृत्यु-दंड हो, चाहे दंड हो, चाहे चाँदी का जुर्माना हो, या संपत्ति की जब्ती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध यूनानी पाठ दिए गए मसोराई समानांतर से काफी अलग है; इसलिए अनुवाद में यूनानी पाठ को प्राथमिक माना गया है।
    reason: textual_variant
  - marker: b
    text: यूनानी शब्द का अर्थ ‘दूर ले जाना’ हो सकता है और इसका अर्थ ‘निर्वासन’ भी लिया जा सकता है। फिर भी इस कानूनी दंड-सूची में इसका अर्थ संभवतः संपत्ति की जब्ती है। उपलब्ध यूनानी पाठ में इससे पहले μὴ (‘नहीं’) है, जिसकी भूमिका वाक्य में कठिन है; संदर्भानुसार यहाँ दंडों की वैकल्पिक सूची का अनुवाद किया गया है।
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: παραβαίνωσι
  choice: उल्लंघन करे
  rationale: यह क्रिया किसी बाध्यकारी नियम या व्यवस्था का अतिक्रमण करने को व्यक्त करती है; आधुनिक हिन्दी के न्यायिक संदर्भ में ‘उल्लंघन करना’ स्वाभाविक और सटीक है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: यहाँ νόμος परमेश्वर और राजा—दोनों के बाध्यकारी विधान के लिए प्रयुक्त है। ‘व्यवस्था’ बाइबलीय और प्रशासनिक दोनों संदर्भों में अर्थ बनाए रखती है।
- source_word: τοῦ βασιλικοῦ
  choice: राजा की व्यवस्था
  rationale: यूनानी विशेषण यहाँ संज्ञा के लोप के साथ प्रयुक्त है और पहले आए νόμον के समानांतर है; हिन्दी में लुप्त संज्ञा को दोहराने से अर्थ स्पष्ट होता है।
- source_word: ἐπιμελῶς
  choice: तत्परता से
  rationale: यह दंड को लागू करने में सावधानी, लगन और ढिलाई न बरतने का भाव देता है। ‘तत्परता से’ आधुनिक हिन्दी में स्वाभाविक है और ‘कठोरता से’ जैसी अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: κολασθήσονται
  choice: दंड दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य का स्पष्ट न्यायिक हिन्दी रूप।
- source_word: θανάτῳ
  choice: मृत्यु-दंड
  rationale: दंडों की सूची में केवल ‘मृत्यु’ की अपेक्षा ‘मृत्यु-दंड’ हिन्दी में आशय अधिक स्पष्ट करता है।
- source_word: τιμωρίᾳ
  choice: कोई और दंड
  rationale: शब्द सामान्य रूप से दंड को सूचित करता है। ‘और’ सूची में पहले उल्लिखित मृत्यु-दंड से इसका भेद स्पष्ट करता है, बिना किसी खास प्रकार के शारीरिक दंड को आरोपित किए।
- source_word: ἀργυρίῳ ζημίᾳ
  choice: चाँदी का जुर्माना
  rationale: वाक्यांश का ठोस मौद्रिक अर्थ सुरक्षित रहता है; ‘चाँदी’ मूल अभिव्यक्ति को दर्शाती है और ‘जुर्माना’ आधुनिक कानूनी हिन्दी है।
- source_word: ἀπαγωγῇ
  choice: निर्वासन
  rationale: शब्द का मूल भाव दूर ले जाने का है। दंडों की इस सूची में ‘निर्वासन’ एक स्वाभाविक न्यायिक अर्थ है; संपत्ति की जब्ती भी संदर्भगत संभावना मानी गई है और पादटिप्पणी में दी गई है।
theological_decisions:
- issue: परमेश्वर की व्यवस्था और राजा की व्यवस्था का संबंध
  choice: दोनों व्यवस्थाओं का उल्लंघन
  alternative: किसी एक व्यवस्था का उल्लंघन
  rationale: καὶ ... καὶ दोनों विधानों को समानांतर रूप में जोड़ता है। अनुवाद इस दोहरी कानूनी जवाबदेही को बनाए रखता है, इनके पारस्परिक संबंध को आगे परिभाषित किए बिना।
- issue: दिए गए मसोराई समानांतर और यूनानी पाठ में बड़ा अंतर
  choice: यूनानी पाठ को प्राथमिक आधार मानना
  alternative: पद को दिए गए मसोराई समानांतर के अनुरूप बनाना
  rationale: दिया गया अरामी समानांतर इस यूनानी वाक्य की विषयवस्तु से प्रत्यक्षतः मेल नहीं खाता; इसलिए उसे मिलाने के लिए यूनानी को बदलना उचित नहीं है।
- issue: दंडों की अंतिम सूची में μὴ की कठिनाई
  choice: संदर्भानुकूल रूप से चार वैकल्पिक दंडों की सूची प्रस्तुत करना और पाठगत कठिनाई को पादटिप्पणी में बताना
  alternative: ‘चाँदी का जुर्माना या निर्वासन नहीं’ पढ़ना
  rationale: प्रेषित यूनानी में μὴ का निषेधात्मक अर्थ लिया जाए तो कानूनी सूची असंगत बनती है। समानांतर कानूनी परंपरा और वाक्य-संरचना वैकल्पिक दंडों की सूची का समर्थन करती है, पर पाठगत कठिनाई को छिपाया नहीं गया है।
