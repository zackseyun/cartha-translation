base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
translation:
  language: hi
  text: और उन्हें उस नदी के पास इकट्ठा करने के बाद, जिसे “नदी” कहा जाता है[a], हमने वहाँ तीन दिन तक डेरा डाला, और मैंने उनकी जाँच की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “उस नदी के पास जिसे नदी कहा जाता है।” संभवतः “नदी” यहाँ किसी स्थान के नाम या परिचित स्थान-सूचक पद के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में पहले “हमने डेरा डाला” और फिर “मैंने उनकी जाँच की” है। कुछ अनुवाद पुरुष-वचन को एक समान कर सकते हैं, पर मूल पाठ सामूहिक कार्रवाई और कथावाचक की व्यक्तिगत जाँच में भेद करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγών
  choice: इकट्ठा करने के बाद
  rationale: यह συνάγω का एओरिस्ट कृदंत है और मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है। यह रूप हिन्दी में घटनाक्रम को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: “नदी” कहलानेवाली नदी के पास
  rationale: λεγόμενον का अर्थ ‘कहलानेवाला/नामक’ है, जबकि Ποταμόν का शाब्दिक अर्थ ‘नदी’ है और यहाँ संभवतः स्थान-नाम का काम करता है। हिन्दी में कुछ असामान्य लगने पर भी यह यूनानी की द्विअर्थक शब्दावली को सुरक्षित रखता है।
- source_word: παρενεβάλομεν
  choice: हमने … डेरा डाला
  rationale: क्रिया का अर्थ पड़ाव या शिविर डालना है। ‘डेरा डाला’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: αὐτόθι
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण है; ‘वहाँ’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἡμέρας τρεῖς
  choice: तीन दिन तक
  rationale: कर्मकारक रूप यहाँ समयावधि व्यक्त करता है; ‘तीन दिन तक’ हिन्दी में इस अर्थ को स्पष्ट करता है।
- source_word: κατέμαθον αὐτούς
  choice: मैंने उनकी जाँच की
  rationale: संदर्भ में καταμανθάνω एकत्रित लोगों को ध्यान से देखने या उनका जायज़ा लेने का भाव देता है। ‘जाँच की’ इस भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: वचन के भीतर कथावाचक पुरुष-वचन का परिवर्तन
  choice: ‘हमने … डेरा डाला’ से ‘मैंने … जाँच की’ का परिवर्तन बनाए रखा गया है।
  alternative: शैलीगत एकरूपता के लिए ‘हमने उनकी जाँच की’ करना।
  rationale: यूनानी पाठ में παρενεβάλομεν प्रथम पुरुष बहुवचन है, जबकि κατέμαθον प्रथम पुरुष एकवचन है। अनुवाद इस वास्तविक पाठगत तनाव को समतल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘“नदी” कहलानेवाली नदी’ की जानबूझकर असामान्य अभिव्यक्ति यूनानी पाठ में सामान्य संज्ञा और संभावित स्थान-नाम के बीच की अस्पष्टता को बनाए रखती है।
