base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: hi
  text: फारेस के वंशजों में से जकर्याह[a], और उसके साथ अभिलेख[b] के अनुसार एक सौ पचास पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी समानांतर पाठ में ‘फारेस’ के स्थान पर ‘परोश’ है। मुख्य पाठ 1 एस्द्रास के यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
  - marker: b
    text: या, “लिखित अभिलेख के अनुसार” अथवा “नामावली से”; यह वाक्यांश वंशावली के आधार पर हुए पंजीकरण की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  choice: फारेस
  rationale: यूनानी पाठ के नाम का सीधा देवनागरी लिप्यंतरण; इब्रानी समानांतर में भिन्न नाम ‘परोश’ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: Ζαχαρίας
  choice: जकर्याह
  rationale: यूनानी नाम का प्रचलित हिन्दी बाइबलीय रूप, जिसकी पुष्टि इब्रानी समानांतर זְכַרְיָה से भी होती है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ
  rationale: साथ होने का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἀπὸ γραφῆς
  choice: वंशावली के अभिलेख के अनुसार
  rationale: γραφή का मूल अर्थ लिखित अभिलेख है; जनगणना-संदर्भ और इब्रानी समानांतर הִתְיַחֵשׂ वंशावली के आधार पर पंजीकरण का संकेत देते हैं। यह रूप ‘अभिलेख’ की व्यापकता और वंशावली-संदर्भ दोनों को सुरक्षित रखता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी में स्पष्ट रूप से पुरुषवाचक संज्ञा है और इब्रानी समानांतर भी ‘नर/पुरुष’ कहता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: ἑκατὸν πεντήκοντα
  choice: एक सौ पचास
  rationale: संख्या का स्पष्ट, स्वाभाविक आधुनिक हिन्दी रूप।
