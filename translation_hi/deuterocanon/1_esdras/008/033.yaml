base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/033.yaml
  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
translation:
  language: hi
  text: 'लाम के वंशजों में से: गोथोलियास का पुत्र एसियास[a], और उसके साथ सत्तर पुरुष।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा 8:3 के अनुमानित मसोराई समानांतर पाठ में नाम और संख्या भिन्न हैं: “शकन्याह के वंशजों में से—जो यहजीएल का पुत्र था—... तीन सौ पुरुष।” चूँकि यहाँ 1 एस्द्रास का अनुवाद यूनानी पाठ से किया गया है, मुख्य पाठ में यूनानी नाम और ‘सत्तर’ की संख्या रखी गई है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के वंशजों में से
  rationale: वंशावली-सूची के प्रसंग में υἱοί किसी कुल के वंशजों को सूचित करता है। यह हिन्दी में स्वाभाविक है और यूनानी संरचना का आशय बनाए रखता है।
- source_word: Λάμ
  choice: लाम
  rationale: यूनानी रूप के आधार पर व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है; इसे भिन्न मसोराई पाठ से नहीं मिलाया गया।
- source_word: Ἐσίας
  choice: एसियास
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Γοθολίου
  choice: गोथोलियास का पुत्र
  rationale: सम्बन्धकारक रूप को सूची की प्रचलित पितृनाम-संरचना के अनुसार पुत्र-सम्बन्ध के रूप में व्यक्त किया गया है, जिससे हिन्दी स्पष्ट और पठनीय रहती है।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: साथ आने या सम्मिलित होने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἄνδρες ἑβδομήκοντα
  choice: सत्तर पुरुष
  rationale: ἄνδρες यहाँ गणना-सूची में पुरुषों को सूचित करता है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
