base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: hi
  text: और उनके साथ, उनके भाइयों में से, दस पुरुष थे। और मैंने उन्हें चाँदी, सोना और हमारे प्रभु के भवन के पवित्र पात्र सौंपे[a]; ये सब राजा, उसके मंत्रियों, उच्च अधिकारियों और समस्त इस्राएल ने भेंट में दिए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक अर्थ “मैंने उनके सामने रखा” या “मैंने उन्हें सौंपा” हो सकता है; इब्रानी समानांतर में “मैंने उन्हें तौलकर दिया” है।
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: उनके साथ उनके भाइयों में से दस पुरुष थे
  rationale: यूनानी का वाक्यांश संक्षिप्त और क्रियारहित है। हिन्दी में स्वाभाविक पूर्ण वाक्य बनाया गया है, पर ‘भाइयों में से’ और स्पष्ट ‘दस पुरुष’ दोनों सुरक्षित रखे गए हैं।
- source_word: ἔστησα αὐτοῖς
  choice: मैंने उन्हें ... सौंपे
  rationale: प्राप्त यूनानी पाठ का शाब्दिक अर्थ ‘मैंने उनके सामने रखा/उनके लिए नियुक्त किया’ हो सकता है। मूल्यवान धातुओं और पात्रों को जिम्मेदारी में देने के प्रसंग में ‘सौंपे’ स्वाभाविक है और यूनानी के निकट रहता है; इब्रानी समानांतर के ‘तौलकर दिया’ को पादटिप्पणी में रखा गया है।
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: चाँदी, सोना
  rationale: यहाँ तौली या सौंपी जाने वाली बहुमूल्य धातुएँ अभिप्रेत हैं, इसलिए ‘धन’ के बजाय उनके पदार्थ-सूचक नाम रखे गए हैं।
- source_word: τὰ ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: मंदिर की उपासना में प्रयुक्त वस्तुओं के लिए ‘पवित्र पात्र’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी है।
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के भवन के
  rationale: κυρίου ἡμῶν का सीधा अर्थ ‘हमारे प्रभु’ है। ‘भवन’ मंदिर-संदर्भ को बनाए रखता है, बिना स्रोत में अनुपस्थित ‘परमेश्वर’ जोड़ने के।
- source_word: οὕτως ἐδωρήσατο
  choice: ये सब ... ने भेंट में दिए थे
  rationale: क्रिया स्वेच्छा से उपहार देने का भाव व्यक्त करती है। हिन्दी का पूर्ण भूतकाल यह स्पष्ट करता है कि वस्तुएँ पहले भेंट की गईं और अब सौंपी जा रही थीं।
- source_word: οἱ σύμβουλοι ... οἱ μεγιστᾶνες
  choice: उसके मंत्रियों, उच्च अधिकारियों
  rationale: राजकीय प्रसंग में σύμβουλοι सलाहकार-मंत्रियों और μεγιστᾶνες उच्च पदस्थ प्रतिष्ठित व्यक्तियों को दर्शाता है। यह जोड़ी आधुनिक पाठक के लिए सहज है और दोनों वर्गों का भेद बनाए रखती है।
theological_decisions:
- issue: मंदिर-संदर्भ में κύριος का अनुवाद
  choice: हमारे प्रभु
  alternative: हमारे स्वामी; यहोवा
  rationale: यूनानी में κυρίου ἡμῶν स्पष्टतः ‘हमारे प्रभु’ है। यह यूनानी पाठ है और इस पद में प्रत्यक्ष हिब्रू दिव्य नाम नहीं है, इसलिए ‘यहोवा’ नहीं जोड़ा गया।
- issue: ἔστησα और इब्रानी समानांतर के ‘तौलकर दिया’ के बीच तनाव
  choice: मुख्य पाठ में ‘सौंपे’, पादटिप्पणी में इब्रानी समानांतर का ‘तौलकर दिया’
  alternative: मुख्य पाठ में ‘तौलकर दिया’; अथवा ‘उनके सामने रखा’
  rationale: यूनानी को प्राथमिक रखते हुए ‘सौंपे’ प्रसंगानुकूल और उसके अर्थ-क्षेत्र के निकट है। इब्रानी समानांतर अधिक विशिष्ट तौलने की क्रिया देता है; वास्तविक पाठगत तनाव को पादटिप्पणी में स्पष्ट किया गया है, न कि चुपचाप सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आरम्भिक यूनानी वाक्य की असामान्य संक्षिप्तता को अर्थ बदले बिना पूर्ण हिन्दी वाक्य बनाया गया है।
