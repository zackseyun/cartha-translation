  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: hi
  text: हे इस्राएल के प्रभु, आप सच्चे हैं; क्योंकि आज हम जड़ के रूप में बचे हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: हे इस्राएल के प्रभु
  rationale: सम्बोधन और संबंधवाचक यूनानी संरचना को स्वाभाविक, गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ἀληθινὸς
  choice: सच्चे
  rationale: विशेषण का सीधा अर्थ सुरक्षित है; इसे केवल ‘विश्वासयोग्य’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: ῥίζα
  choice: एक जड़
  rationale: यूनानी पाठ के ठोस रूपक ‘जड़’ को सुरक्षित रखा गया है; ‘बचा हुआ भाग’ करने से मूल रूपक मिट जाता।
- source_word: ἐν τῇ σήμερον
  choice: आज के दिन तक
  rationale: असामान्य यूनानी काल-सूचक पदबंध का प्रसंगानुकूल स्वाभाविक हिन्दी रूप, जो वर्तमान दिन तक बचे रहने का भाव व्यक्त करता है।
theological_decisions:
- issue: ῥίζα के रूपक की व्याख्या
  choice: एक जड़ के रूप में
  alternative: एक बचे हुए समुदाय के रूप में
  rationale: पाठ में ‘जड़’ ही है। सम्भावित ‘शेष’ का धार्मिक अर्थ अनुवाद में आरोपित करने के बजाय रूपक और उसकी व्याख्यात्मक खुली जगह सुरक्षित रखी गई है।
- issue: ἀληθινός का अर्थ-क्षेत्र
  choice: सच्चे
  alternative: विश्वासयोग्य
  rationale: ‘सच्चे’ अस्तित्वगत सत्यता और विश्वसनीयता दोनों की सम्भावना खुली रखता है, जबकि विकल्प अर्थ को अधिक संकीर्ण करता।
