  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that may be found in the land of Babylonia for the Lord in Jerusalem[b],
translation:
  language: hi
  text: और उन भेंटों को, जिनकी मन्नत मैंने और मेरे मित्रों ने प्रभु के लिए मानी है,[a] यरूशलेम ले जाने के लिए, तथा बाबुल के प्रदेश में जो भी सोना-चाँदी मिले, वह सब प्रभु के लिए यरूशलेम ले जाने के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भेंटों’ का अनुवाद ‘चढ़ावों’ भी हो सकता है; यहाँ यूनानी शब्द धार्मिक अर्पण का भाव रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम यूनानी वाक्यांश बहुत संक्षिप्त है; शाब्दिक रूप से, “प्रभु के लिए, यरूशलेम को।” आशय यरूशलेम में प्रभु के लिए निर्धारित सोने-चाँदी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: ले जाने के लिए
  rationale: क्रिया गंतव्य की ओर वस्तुएँ पहुँचाने का भाव देती है; यरूशलेम को स्पष्ट गंतव्य रखते हुए यह स्वाभाविक हिन्दी है।
- source_word: δῶρα
  choice: भेंटों
  rationale: ‘भेंट’ सामान्य उपहार और धार्मिक अर्पण—दोनों अर्थ-संभावनाएँ बनाए रखती है; प्रसंग में प्रभु के लिए समर्पण का भाव स्पष्ट है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: यहाँ सम्प्रदान उन भेंटों के अभिप्रेत प्राप्तकर्ता अथवा उपयोग को बताता है; ‘प्रभु के लिए’ हिन्दी में स्वाभाविक है।
- source_word: ἃ ηὔξαμην
  choice: जिन्हें ... अर्पित करने की मन्नत मानी है
  rationale: εὔχομαι यहाँ वस्तुओं के संबंध में प्रतिज्ञा या मन्नत का अर्थ देता है। ‘अर्पित करने’ से भेंटों और मन्नत के बीच संबंध स्पष्ट होता है, बिना किसी विशिष्ट बलिदान-विधि को जोड़ने के।
- source_word: οἱ φίλοι
  choice: मेरे मित्रों
  rationale: यह यूनानी शब्द का सीधा और सहज अर्थ है; पाठ किसी अधिक तकनीकी दरबारी पद की माँग नहीं करता।
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: जितना भी सोना और चाँदी ... वह सब
  rationale: यह सामूहिक और सर्वसमावेशी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: मिले
  rationale: अनिश्चित सापेक्ष वाक्यांश की संभाव्य और खुली प्रकृति ‘जितना भी ... मिले’ में सुरक्षित रहती है।
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: बाबुल के प्रदेश में
  rationale: χώρα यहाँ भूभाग या क्षेत्र को सूचित करता है। ‘प्रदेश’ भौगोलिक अर्थ देता है, पर अनावश्यक रूप से किसी औपचारिक प्रशासनिक इकाई को निश्चित नहीं करता।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम ले जाने
  rationale: εἰς का दिशात्मक अर्थ स्पष्ट रूप से गंतव्य की ओर गति दर्शाता है।
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: यरूशलेम में प्रभु के लिए ले जाने
  rationale: यूनानी वाक्यांश संक्षिप्त है। अनुवाद यरूशलेम को गंतव्य और वहाँ प्रभु के लिए निर्धारित उपयोग—दोनों को व्यक्त करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता बताती है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस यहूदी धर्मग्रंथीय प्रसंग में κύριος इस्राएल के परमेश्वर को सूचित करता है; ‘प्रभु’ मानक और गरिमापूर्ण हिन्दी रूप है।
- issue: δῶρα और ηὔξαμην का धार्मिक आशय
  choice: भेंटों ... अर्पित करने की मन्नत मानी है
  alternative: उपहारों ... देने का वचन दिया है
  rationale: चुना हुआ रूप परमेश्वर को समर्पण और धार्मिक मन्नत का आशय सुरक्षित रखता है, पर पाठ में न दी गई किसी विशिष्ट बलिदान-विधि को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘मन्नत मानी है’ सामान्य पाठक के लिए बोधगम्य है और धार्मिक प्रतिज्ञा का भाव देता है। मुख्य वाक्य स्रोत-पद के संयोजक और आश्रित ढाँचे को यथासंभव बनाए रखता है, क्योंकि यह संभवतः बड़े राजकीय आदेश-वाक्य का अंश है।
