base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: hi
  text: अर्तक्षत्र के शासन के सातवें वर्ष के पाँचवें महीने में[a] वे यरूशलेम पहुँचे[b]। क्योंकि वे पहले महीने के नए चाँद के दिन बाबेल से निकले थे, और प्रभु की ओर से उन्हें दी गई सफल यात्रा के अनुसार वे यरूशलेम आए—उस पर।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसके बाद यूनानी पाठ में एक कठिन वाक्यांश है: “यह वर्ष राजा के लिए दूसरा था।” यह प्रसंग में दिए गए सातवें वर्ष से मेल नहीं खाता और इब्रानी समानांतर (एज्रा 7:6–9) में भी नहीं है। सम्भवतः पाठ बिगड़ गया है या वाक्यांश अपने मूल स्थान से हट गया है; इसलिए इसे मुख्य पाठ में नहीं रखा गया।'
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में यहाँ बहुवचन है—“वे पहुँचे” और “उन्हें”—जबकि इब्रानी समानांतर में एज्रा के विषय में एकवचन है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में अन्तिम शब्द शाब्दिक रूप से केवल “उस पर” हैं और उनका वाक्य से संबंध अस्पष्ट है। सम्भवतः इसका आशय एज्रा पर प्रभु की कृपा या सहायता होने से है; इब्रानी समानांतर इसे “उसके परमेश्वर यहोवा का हाथ उस पर था” कहकर स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου
  choice: अर्तक्षत्र के शासन के सातवें वर्ष
  rationale: यूनानी काल-सूचक रचना को स्वाभाविक हिन्दी में राजकीय वर्ष के रूप में व्यक्त किया गया है। नाम के लिए हिन्दी बाइबलीय परंपरा में प्रचलित ‘अर्तक्षत्र’ रखा गया है।
- source_word: ἐν τῷ πέμπτῳ μηνί
  choice: पाँचवें महीने में
  rationale: यह सीधे समय बताने वाला वाक्यांश है।
- source_word: ἐξελθόντος ... ἐκ Βαβυλῶνος
  choice: वे ... बाबेल से निकले थे
  rationale: कृदन्त आगमन से पहले हुई क्रिया दर्शाता है; हिन्दी में पूर्वकालिक क्रिया से क्रम स्पष्ट किया गया है।
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: पहले महीने की अमावस्या को
  rationale: νουμηνία का विशिष्ट अर्थ ‘नया चाँद/अमावस्या का दिन’ है; इसे केवल ‘पहली तारीख’ नहीं बनाया गया।
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: वे यरूशलेम पहुँचे / वे यरूशलेम आए
  rationale: यूनानी पाठ में बहुवचन है और आगमन की क्रिया दोहराई गई है; हिन्दी मुख्य पाठ दोनों बातों को बनाए रखता है।
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  choice: उन्हें यात्रा में दी गई सफलता के अनुसार
  rationale: εὐοδία में सफल अथवा अनुकूल यात्रा का भाव है। यह रूप यात्रा-संदर्भ को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: παρὰ τοῦ κυρίου
  choice: प्रभु की ओर से
  rationale: παρά + संबंधकारक स्रोत दर्शाता है; ‘प्रभु की ओर से’ इसी संबंध को स्पष्ट रखता है।
- source_word: ἐπʼ αὐτῷ
  choice: प्रभु की कृपा उस पर थी
  rationale: यूनानी का शाब्दिक रूप ‘उस पर’ है और संदर्भ अस्पष्ट है। मुख्य पाठ सम्भावित आशय को सहज हिन्दी में देता है, जबकि पादटिप्पणी शाब्दिक रूप और अनिश्चितता सुरक्षित रखती है।
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: मुख्य पाठ से अलग रखकर पादटिप्पणी में
  rationale: प्रेषित यूनानी वाक्यांश प्रसंग में व्याकरणिक और कालक्रम-संबंधी कठिनाई उत्पन्न करता है तथा एज्रा 7:6–9 के इब्रानी समानांतर में नहीं है; इसलिए इसे बिना समाधान थोपे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: κύριος का अनुवाद, जबकि इब्रानी समानांतर में יהוה है
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κύριος है; इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया, इब्रानी समानांतर की विशिष्ट वाचा-संज्ञा को यूनानी पाठ पर आरोपित नहीं किया गया।
- issue: ἐπʼ αὐτῷ में निहित ईश्वरीय सहायता का स्वरूप
  choice: प्रभु की कृपा उस पर थी
  alternative: शाब्दिक ‘उस पर’ अथवा ‘प्रभु का हाथ उस पर था’
  rationale: ‘कृपा’ प्रसंग में सम्भावित अर्थ को सुबोध बनाती है, पर ‘हाथ’ यूनानी में व्यक्त नहीं है। पादटिप्पणी शाब्दिक अस्पष्टता और इब्रानी समानांतर दोनों बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी पाठ की बहुवचन क्रियाएँ और आगमन की पुनरुक्ति सुरक्षित हैं। कठिन पाठांश तथा ἐπʼ αὐτῷ की वास्तविक अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
