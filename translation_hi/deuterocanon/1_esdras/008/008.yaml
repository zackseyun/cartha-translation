base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: hi
  text: राजा अर्तक्षत्र की ओर से याजक एज्रा को दिए गए दस्तावेज़ की प्रतिलिपि नीचे दी गई है:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘प्रभु की व्यवस्था का पाठ करने वाला’ है। एज्रा 7:11 के इब्रानी समानांतर पाठ में इसके स्थान पर ‘शास्त्री’ है।
    reason: alternative_reading
  - marker: b
    text: इस शीर्षक का यूनानी वाक्य-विन्यास कुछ असहज है। आशय यह है कि अर्तक्षत्र की ओर से एज्रा को दिया गया दस्तावेज़ नीचे प्रतिलिपि के रूप में प्रस्तुत है।
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: दिए गए
  rationale: यूनानी पदबंध कठिन और संभवतः दस्तावेज़ी शीर्षक की शैली में है। संदर्भ में यह किसी राजकीय पत्र के एज्रा को दिए या भेजे जाने का भाव व्यक्त करता है; ‘दिए गए’ अनावश्यक विशिष्टता जोड़े बिना इसे स्वाभाविक हिन्दी में रखता है।
- source_word: παρὰ Ἀρταξέρξου βασιλέως
  choice: राजा अर्तक्षत्र की ओर से
  rationale: संबंधकारक के साथ παρά स्रोत को सूचित करता है। ‘की ओर से’ राजकीय दस्तावेज़ के स्रोत को स्पष्ट करता है और ‘द्वारा’ की तुलना में हिन्दी में अधिक स्वाभाविक है।
- source_word: πρὸς Ἔσραν
  choice: एज्रा को
  rationale: दस्तावेज़ी संदर्भ में πρός दिशा अथवा संबोधन बताता है; पत्र एज्रा को दिया या संबोधित किया गया है।
- source_word: τὸν ἱερέα
  choice: याजक
  rationale: एज्रा की धार्मिक पदवी का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: प्रभु की व्यवस्था का पाठक
  rationale: ἀναγνώστης का मूल अर्थ पढ़ने या पाठ करने वाला है। इब्रानी समानांतर के ‘शास्त्री’ से सामंजस्य बैठाने के बजाय यूनानी पाठ की विशिष्ट अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त धार्मिक उपाधि का स्वाभाविक हिन्दी रूप।
- source_word: ἀντίγραφον
  choice: प्रतिलिपि
  rationale: दस्तावेज़ की नकल या प्रति के लिए सटीक, प्रचलित औपचारिक शब्द।
- source_word: τὸ ὑποκείμενον
  choice: नीचे दी गई है
  rationale: शाब्दिक अर्थ ‘नीचे रखा हुआ’ है; दस्तावेज़ी शीर्षक में ‘नीचे दी गई है’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यूनानी पदवी और एज्रा 7:11 के इब्रानी समानांतर का संबंध
  choice: मुख्य पाठ में ‘प्रभु की व्यवस्था का पाठक’ रखा गया है।
  alternative: ‘प्रभु की व्यवस्था का शास्त्री’ अथवा इब्रानी समानांतर के अनुसार ‘स्वर्ग के परमेश्वर की व्यवस्था का शास्त्री’।
  rationale: इस ग्रंथ के लिए प्रत्यक्ष यूनानी साक्ष्य प्राथमिक है। इसलिए ἀναγνώστης को ‘पाठक’ अनूदित किया गया है; इब्रानी समानांतर का भिन्न पाठ टिप्पणी में सुरक्षित है, ताकि दोनों साक्ष्यों के बीच का तनाव मिटाया न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध दस्तावेज़ी शैली अपनाई गई है। ‘अर्तक्षत्र’ हिन्दी बाइबिल परंपरा में पहचाना जाने वाला नामरूप है; ‘पत्र’ संदर्भगत रूप से जोड़ा गया है, क्योंकि अगला अंश राजकीय लिखित दस्तावेज़ है। सभी टिप्पणियों के संकेत मुख्य पाठ में उपस्थित हैं।
