  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: hi
  text: ताकि वे अपने प्रभु की उस वेदी पर बलिदान चढ़ाएँ, जो यरूशलेम में है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोरेटी समानांतर (अरामी) पाठ के निकटवर्ती प्रसंग में “यरूशलेम में उनके परमेश्वर के भवन के लिए” कहा गया है; पर यूनानी पाठ यहाँ विशेष रूप से “उनके प्रभु की वेदी, जो यरूशलेम में है” कहता है।
    reason: यूनानी मुख्य पाठ और मसोरेटी/अरामी समानांतर पाठ की भिन्न शब्दावली तथा समानांतर की निकटवर्ती-संदर्भ स्थिति को स्पष्ट करना।
lexical_decisions:
- source_word: ὥστε
  choice: ताकि
  rationale: यहाँ यह अव्यय उद्देश्य अथवा अपेक्षित परिणाम बताता है; प्रशासनिक संदर्भ में ‘ताकि’ सहज है और परिणाम को अनिवार्य नहीं ठहराता।
- source_word: προσενεγκεῖν
  choice: चढ़ाएँ
  rationale: बलिदान और वेदी के संदर्भ में यह क्रिया धार्मिक रीति से अर्पित करने का भाव रखती है। हिन्दी में ‘बलिदान चढ़ाना’ स्वाभाविक और स्पष्ट है।
- source_word: θυσίας
  choice: बलिदान
  rationale: वेदी पर अर्पित की जाने वाली धार्मिक बलियों के लिए यह सीधा और प्रचलित हिन्दी शब्द है।
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: वेदी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ वेदी की ओर ले जाकर उस पर बलिदान अर्पित करने की क्रिया दर्शाता है; ‘वेदी पर’ हिन्दी में यही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ κυρίου αὐτῶν
  choice: अपने प्रभु की
  rationale: κύριος को श्रद्धासूचक ‘प्रभु’ रखा गया है और αὐτῶν का संबंध वाक्य के निहित कर्ता से होने के कारण हिन्दी में ‘अपने’ स्वाभाविक है। यूनानी में ‘परमेश्वर’ शब्द नहीं जोड़ा गया है।
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: उस वेदी ... जो यरूशलेम में है
  rationale: सविभक्ति पदबंध विशेष वेदी की पहचान करता है। ‘उस ... जो’ की रचना यूनानी के निर्धारक बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: मन्दिर-संबंधी प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ उपासना और वेदी का संदर्भ इस्राएल के परमेश्वर के लिए श्रद्धासूचक उपाधि दर्शाता है, किसी मानवीय स्वामी को नहीं।
- issue: यूनानी पाठ और इब्रानी समानांतर पाठ के बीच अंतर
  choice: मुख्य पाठ में यूनानी के अनुसार ‘अपने प्रभु की ... वेदी’
  alternative: ‘उनके परमेश्वर का भवन’
  rationale: प्राथमिक यूनानी साक्ष्य में ‘उनके प्रभु की वेदी’ है। इब्रानी समानांतर पाठ संदर्भ और अभिप्रेत सत्ता की पुष्टि करता है, पर उसकी भिन्न शब्दावली को यूनानी मुख्य पाठ में मिलाना उचित नहीं; अंतर पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बलिदान चढ़ाएँ’ धार्मिक संदर्भ में स्वाभाविक हिन्दी है। वाक्य स्रोत में पिछले कथन पर आश्रित उद्देश्यवाचक खंड है, इसलिए आरम्भ में ‘ताकि’ बनाए रखा गया है।
