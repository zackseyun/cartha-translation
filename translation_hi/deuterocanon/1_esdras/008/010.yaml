  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय आदेश के अनुरूप गरिमापूर्ण और औपचारिक रखी गई है। ‘दयापूर्ण मार्ग’, ‘आदेश दिया’ और ‘स्वेच्छा’ जैसे पद साधारण पाठक के लिए बोधगम्य हैं। यूनानी सूची की कुछ असहजता को पूरी तरह समतल नहीं किया गया, ताकि τῶνδε और αἱρετίζοντας की वास्तविक अस्पष्टता बनी रहे।
