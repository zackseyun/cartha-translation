base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: hi
  text: और मैंने मानवतापूर्ण बातों को उचित समझकर आदेश दिया कि यहूदी लोगों में से जो स्वेच्छा से चुनते हैं, और याजक, लेवी तथा हमारे राज्य के ये अन्य लोग, तुम्हारे साथ यरूशलेम जाएँ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वेच्छा से चुनते हैं’ के पीछे का यूनानी रूप दुर्लभ है और उसका ठीक अर्थ अनिश्चित है। इसका अर्थ ‘चुनने वाले’ या ‘स्वेच्छा से भाग लेने वाले’ भी हो सकता है; सम्भवतः यह स्वैच्छिक भागीदारी पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ उपलब्ध इब्रानी समानांतर का शब्दांकन काफी भिन्न है; मुख्य अनुवाद 1 एस्द्रास के यूनानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: दयापूर्ण मार्ग
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग बहुवचन यहाँ मानवीय, कृपालु या हितकारी आचरण की ओर संकेत करता है। ‘दयापूर्ण मार्ग’ राजकीय निर्णय के संदर्भ में स्वाभाविक है और अर्थ को केवल भावुक दया तक सीमित नहीं करता।
- source_word: κρίνας
  choice: उचित समझकर
  rationale: कृदंत राजा के विचार-विमर्श के बाद किए गए निर्णय को व्यक्त करता है। ‘उचित समझकर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए न्याय या निर्णय के भाव को बनाए रखता है।
- source_word: προσέταξα
  choice: मैंने ... आदेश दिया
  rationale: यह अधिकारपूर्वक दिए गए निर्देश का सामान्य और स्पष्ट हिन्दी रूप है।
- source_word: τοὺς βουλομένους
  choice: जो लोग जाना चाहते हैं
  rationale: यह कृदंत इच्छा और स्वैच्छिक सहभागिता दर्शाता है; गंतव्यगत क्रिया हिन्दी में स्पष्टता के लिए जोड़ी गई है।
- source_word: αἱρετίζοντας
  choice: स्वेच्छा से ऐसा चुनते हैं
  rationale: दुर्लभ यूनानी रूप चुनाव अथवा स्वैच्छिक निर्णय पर बल देता प्रतीत होता है। मुख्य पाठ में इस बल को रखा गया है और अनिश्चितता को पादटिप्पणी में बताया गया है।
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: यहूदी जाति के
  rationale: ἔθνος यहाँ एक जनसमुदाय को दर्शाता है। ‘यहूदी जाति’ औपचारिक राजकीय संदर्भ के अनुकूल और आधुनिक पाठकों के लिए स्पष्ट है।
- source_word: τῶν ἱερέων
  choice: याजकों
  rationale: मन्दिर-सेवा से जुड़े पद के लिए मानक बाइबलीय हिन्दी शब्द।
- source_word: τῶν Λευειτῶν
  choice: लेवियों
  rationale: समुदाय के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: τῶνδε
  choice: इन लोगों में से भी
  rationale: यूनानी संकेतवाचक शब्द यहाँ कुछ आकस्मिक और संक्षिप्त है। हिन्दी रूप उसी संदर्भ को बनाए रखता है, बिना यह निश्चित किए कि वह किसी अलग, स्पष्टतः नामित वर्ग को सूचित करता है।
- source_word: συμπορεύεσθαί σοι
  choice: तुम्हारे साथ ... जाएँ
  rationale: क्रिया का अर्थ साथ यात्रा करना है; यह रूप सरल और स्वाभाविक हिन्दी में साथ जाने का भाव रखता है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम जाएँ
  rationale: गंतव्य को हिन्दी वाक्य के अंत में रखना स्वाभाविक है; ‘यरूशलेम’ मानक हिन्दी रूप है।
theological_decisions:
- issue: यूनानी पाठ और दिए गए मसोरेटिक समानांतर में बड़ा अंतर
  choice: मुख्य पाठ में 1 एस्द्रास के उपलब्ध यूनानी राजकीय आदेश का अनुवाद
  alternative: इब्रानी समानांतर के अनुसार एज्रा के मन को व्यवस्था का अध्ययन, पालन और शिक्षण करने के लिए तैयार करने का वर्णन
  rationale: इस पद के लिए यूनानी पाठ प्राथमिक साक्ष्य है और उसमें स्पष्ट रूप से यरूशलेम जाने की राजकीय अनुमति दी गई है। इब्रानी समानांतर एक अलग कथन प्रस्तुत करता है; उसे मुख्य पाठ में मिलाने से 1 एस्द्रास का यूनानी साक्ष्य बदल जाएगा।
- issue: αἱρετίζοντας का दुर्लभ और अनिश्चित अर्थ
  choice: इसे स्वैच्छिक चुनाव पर बल देने वाले पद के रूप में प्रस्तुत करना
  alternative: इसे केवल ‘जो चाहें’ के समानार्थक मानना, या पूरे वाक्यांश को ‘जो अपने आपको चुनें’ कहना
  rationale: निकटवर्ती βουλομένους पहले ही इच्छा प्रकट करता है, इसलिए यह दुर्लभ रूप संभवतः स्वैच्छिक चुनाव पर अतिरिक्त बल देता है। फिर भी इसकी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
