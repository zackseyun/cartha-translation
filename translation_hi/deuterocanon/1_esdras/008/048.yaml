translation:
  language: hi
  text: हनूनै के वंशजों में से और उनके पुत्रों में से कुल बीस पुरुष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: हनूनै के वंशजों में से
  rationale: οἱ ἐκ के साथ संबंधकारक पदबंध किसी कुल से आए लोगों को सूचित करता है। यहाँ υἱοί व्यापक वंशावली-संदर्भ में है, इसलिए स्वाभाविक हिन्दी में ‘वंशज’ चुना गया; Χανουναίου को नाम के रूप में ‘हनूनै’ लिप्यंतरित किया गया।
- source_word: καὶ οἱ υἱοὶ αὐτῶν
  choice: और उनके पुत्रों में से
  rationale: αὐτῶν बहुवचन है, इसलिए ‘उनके’ यूनानी पाठ की वास्तविक अस्पष्टता और सामूहिक संदर्भ को बनाए रखता है; इसे इब्रानी समानांतर के अनुसार एकवचन नहीं किया गया। पहले ‘में से’ के साथ समांतर रचना हिन्दी में सूची का आशय स्पष्ट करती है।
- source_word: εἴκοσι ἄνδρες
  choice: बीस पुरुष थे
  rationale: ἄνδρες इस गणना-संदर्भ में पुरुषों को सूचित करता है। हिन्दी में पूर्ण, स्वाभाविक वाक्य बनाने के लिए ‘थे’ जोड़ा गया है।
theological_decisions:
- issue: यूनानी पाठ और लगभग समानांतर मसोरेटिक पाठ में व्यक्तियों की सूची का अंतर
  choice: मुख्य पाठ में यूनानी के अनुसार हनूनै के वंशजों और उनके पुत्रों का उल्लेख
  alternative: लगभग समानांतर इब्रानी पाठ में हशब्याह और उसके साथ मरारी के वंशज यशायाह, उसके भाइयों और उनके पुत्रों का उल्लेख है
  rationale: 1 एस्द्रास के लिए उपलब्ध यूनानी पाठ प्राथमिक स्रोत है। इब्रानी समानांतर में नाम और समूह-विन्यास पर्याप्त रूप से अलग हैं, इसलिए उससे मुख्य पाठ का सामंजस्य नहीं किया गया; महत्वपूर्ण पाठांतर को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सूची-सदृश मूल को बनाए रखते हुए वाक्य को सहज बनाने के लिए ‘थे’ जोड़ा गया है। नाम का सरल देवनागरी लिप्यंतरण किया गया है और यूनानी–इब्रानी अंतर को बिना सामंजस्य किए स्पष्ट किया गया है।
