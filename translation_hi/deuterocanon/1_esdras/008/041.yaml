  yaml_path: translation/deuterocanon/1_esdras/008/041.yaml
  text: 'From the sons of Banai: Outu son of Istakalkou, and with him seventy men.'
translation:
  language: hi
  text: 'बनै के वंशजों में से: इस्ताकाल्कू का पुत्र ऊतू, और उसके साथ सत्तर पुरुष।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναὶ
  choice: बनै के वंशजों में से
  rationale: υἱοί वंशावली-सूची में केवल प्रत्यक्ष पुत्रों के बजाय वंशजों को भी सूचित कर सकता है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: Οὐτοῦ Ἰστακάλκου
  choice: इस्ताकाल्कू का पुत्र ऊतू
  rationale: यूनानी नामरूपों को निकट ध्वन्यात्मक रूप में रखा गया है। दोनों संबंधसूचक रूपों में हैं; सूची की संरचना और परामर्श-पाठ के आधार पर इस्ताकाल्कू को ऊतू का पिता समझकर संबंध स्पष्ट किया गया है।
- source_word: ἄνδρες ἑβδομήκοντα
  choice: सत्तर पुरुष
  rationale: ἄνδρες का स्पष्ट पुरुषवाचक अर्थ बनाए रखा गया है, केवल सामान्य ‘लोग’ नहीं किया गया।
