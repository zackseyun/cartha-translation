lexical_decisions:
- source_word: εὐξάμην
  choice: मैंने ... घोषणा की
  rationale: यूनानी क्रिया का सामान्य अर्थ ‘प्रार्थना की’ या ‘मन्नत मानी’ है, पर यहाँ ‘उपवास’ के साथ वाक्य असहज है। समानांतर इब्रानी पाठ का וָאֶקְרָא स्पष्टतः ‘मैंने घोषणा की’ कहता है; इसलिए संदर्भगत अर्थ मुख्य पाठ में रखा गया और शाब्दिक यूनानी विकल्प पादटिप्पणी में सुरक्षित किया गया।
