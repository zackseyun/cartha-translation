- source_word: νηστείαν
  choice: उपवास
  rationale: घोषणा की वस्तु के रूप में हिन्दी में ‘उपवास की घोषणा’ स्वाभाविक है।
- source_word: τοῖς νεανίσκοις
  choice: जवानों के लिए
  rationale: यूनानी के ‘युवकों/जवानों’ को प्राथमिक पाठ के अनुसार बनाए रखा गया है; ‘जवान’ साधारण आधुनिक हिन्दी में सहज है।
- source_word: ἔναντι
  choice: के सामने
  rationale: ‘की उपस्थिति में/के सम्मुख’ का स्पष्ट, स्वाभाविक और गरिमापूर्ण रूप।
- source_word: κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: यूनानी प्राथमिक पाठ के ईश्वरीय संबोधन ‘हमारे प्रभु’ को बनाए रखा गया है, यद्यपि इब्रानी समानांतर पाठ ‘हमारे परमेश्वर’ कहता है।
theological_decisions:
- issue: मुख्य क्रिया में यूनानी और इब्रानी पाठ का अंतर
  choice: ‘मैंने ... उपवास की घोषणा की’
  alternative: ‘मैंने ... उपवास के लिए प्रार्थना की’ अथवा ‘मैंने ... उपवास की मन्नत मानी’
  rationale: यूनानी εὐξάμην के सामान्य अर्थों को दबाया नहीं गया, पर उपवास के प्रसंग और इब्रानी समानांतर पाठ के आधार पर मुख्य पाठ में प्रसंगानुकूल अर्थ चुना गया; वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
- issue: ईश्वरीय उपाधि
  choice: हमारे प्रभु
  alternative: हमारे परमेश्वर
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक साक्ष्य κυρίου ἡμῶν पढ़ता है, इसलिए मुख्य पाठ में ‘हमारे प्रभु’ रखा गया; इब्रानी समानांतर का भेद पादटिप्पणी में दिया गया है।
