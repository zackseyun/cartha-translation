  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: hi
  text: और वहाँ मैंने युवकों के लिए हमारे प्रभु के सामने उपवास की घोषणा की।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अर्थ हो सकता है, “और वहाँ मैंने युवकों के लिए हमारे प्रभु के सामने उपवास के लिए प्रार्थना की/उपवास की मन्नत मानी।” समानांतर इब्रानी पाठ कहता है, “और वहाँ मैंने ... हमारे परमेश्वर के सामने उपवास की घोषणा की,” जिससे यहाँ अपनाया गया अर्थ स्पष्ट होता है।
    reason: alternative_reading
  - marker: b
    text: 'एज्रा 8:21 का इब्रानी समानांतर पाठ वे बातें भी बताता है जो इस यूनानी पंक्ति में नहीं हैं: उपवास अहवा नदी के तट पर घोषित किया गया, ताकि वे परमेश्वर के सामने दीन हों और अपने लिए, अपने बाल-बच्चों के लिए और अपनी सारी संपत्ति के लिए सीधा मार्ग माँगें।'
