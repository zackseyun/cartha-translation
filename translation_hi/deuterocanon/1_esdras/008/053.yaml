base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: hi
  text: क्योंकि हमने राजा से कहा था कि हमारे प्रभु का सामर्थ्य उसे खोजनेवालों के साथ हर पुनर्स्थापना के लिए रहेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समस्त पुनर्स्थापना के लिए।” यूनानी पदबंध असामान्य है; कुछ व्याख्याकार इसे अधिक व्यापक अर्थ में “सफलता के लिए” या “अच्छे परिणाम के लिए” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'इस स्थान पर इब्रानी समानांतर पाठ बहुत भिन्न है: उसमें राजा से कही गई बात दोहराने के बजाय उपवास करने और परमेश्वर को खोजने का उल्लेख है। यहाँ अनुवाद 1 एस्द्रास के यूनानी पाठ को प्राथमिक साक्ष्य मानकर किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: हमने ... कहा था
  rationale: यह कथन कथा में पहले राजा से कही गई बात को दर्शाता है; हिन्दी का पूर्ण भूतकाल उस पूर्ववर्ती क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰσχὺς
  choice: सामर्थ्य
  rationale: ἰσχύς बल या शक्ति को सूचित करता है। ‘सामर्थ्य’ गरिमापूर्ण और सहज है तथा यहाँ प्रभु की समर्थ सहायता का भाव बनाए रखता है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु का
  rationale: यहूदी-यूनानी प्रसंग में κύριος परमेश्वर के लिए आदरपूर्ण संबोधन है; ‘हमारे प्रभु’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: उन लोगों के साथ ... जो ... उसे खोजते हैं
  rationale: ἐπιζητέω लगन से खोजने का भाव रख सकता है, पर ‘खोजना’ यहाँ स्पष्ट और स्वाभाविक है तथा अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: हर प्रकार की पुनर्स्थापना के लिए
  rationale: ἐπανόρθωσις का मूल भाव फिर से ठीक करने, सुधारने या पुनर्स्थापित करने का है। यह चयन असामान्य यूनानी पदबंध की ठोस शब्दार्थ-सामग्री को बनाए रखता है; ‘हर प्रकार की’ हिन्दी में πᾶσαν के व्यापक भाव को सहज बनाता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में संदर्भ इस्राएल के परमेश्वर का है। ‘प्रभु’ श्रद्धापूर्ण है और यूनानी सेप्टुआजेंट की प्रचलित धार्मिक शब्दावली के साथ निरंतरता रखता है।
- issue: कठिन पदबंध εἰς πᾶσαν ἐπανόρθωσιν का अर्थ
  choice: हर प्रकार की पुनर्स्थापना के लिए
  alternative: हर सफलता के लिए / अच्छे परिणाम के लिए
  rationale: यूनानी प्राथमिक साक्ष्य में ἐπανόρθωσις स्पष्ट रूप से है, इसलिए अनुवाद उसके पुनर्स्थापना अथवा फिर से ठीक करने के भाव को बनाए रखता है। अधिक व्यापक अर्थ को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। कठिन यूनानी पदबंध की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखी गई है; इब्रानी समानांतर के साथ सामंजस्य बैठाने के लिए यूनानी को बदला नहीं गया।
