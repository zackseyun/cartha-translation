base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: hi
  text: यह कहते हुए, “जिस देश में तुम विरासत में लेने के लिए प्रवेश कर रहे हो, वह उस देश में रहनेवाले परदेशियों की अपवित्रता से दूषित देश है[a], और उन्होंने उसे अपनी अशुद्धता से भर दिया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सामी समानांतर मुहावरे के अनुसार इसका अनुवाद “देश के लोग” या “देश की जातियाँ” भी हो सकता है; यूनानी पाठ अधिक स्पष्ट रूप से “परदेशी” कहता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “अशुद्धता” में अनुष्ठानिक और नैतिक—दोनों प्रकार की अशुद्धता का भाव हो सकता है; शब्द केवल एक अर्थ चुनने को बाध्य नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  choice: देश
  rationale: यहाँ γῆ उस विशेष भूभाग को दर्शाता है जिसमें समुदाय प्रवेश करने वाला है; ‘पृथ्वी’ इस संदर्भ में बहुत व्यापक होगा।
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: जिस देश में तुम ... प्रवेश कर रहे हो
  rationale: यह रूप εἰς की दिशात्मकता और यूनानी वर्तमानकाल की निकटवर्ती क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κληρονομῆσαι
  choice: विरासत पाने के लिए
  rationale: यह κληρονομέω के विरासत-संबंधी अर्थ को सुरक्षित रखता है; केवल ‘अधिकार करने’ से वह वाचायी अर्थछाया कमजोर पड़ सकती है।
- source_word: μεμολυσμένη μολυσμῷ
  choice: अशुद्धता से दूषित
  rationale: ‘दूषित’ पूर्ण कृदन्त से सूचित वर्तमान दशा को व्यक्त करता है और ‘अशुद्धता’ सजातीय संज्ञा के नैतिक तथा अनुष्ठानिक दोनों अर्थों को खुला रखती है। हिन्दी में एक ही धातु की कृत्रिम पुनरावृत्ति के बजाय अर्थपूर्ण बल सुरक्षित रखा गया है।
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: उस देश के परदेशियों की
  rationale: ἀλλογενής दूसरे जन अथवा वंश से संबंधित लोगों को दर्शाता है। ‘परदेशी’ यूनानी में निहित बाहरीपन को स्पष्ट रखता है, जबकि ‘देश के लोग’ उस विशिष्टता को मिटा देता।
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: अपनी अशुद्धता से
  rationale: ἀκαθαρσία नैतिक और अनुष्ठानिक दोनों प्रकार की अशुद्धता व्यक्त कर सकता है; ‘अशुद्धता’ किसी एक अर्थ तक इसे सीमित नहीं करती।
- source_word: ἐνέπλησαν αὐτήν
  choice: उन्होंने उसे ... भर दिया है
  rationale: यह क्रिया के ‘भरना’ अर्थ तथा उससे उत्पन्न वर्तमान स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता को केवल अनुष्ठानिक या केवल नैतिक मानना
  choice: ‘अशुद्धता’ और ‘दूषित’ जैसे व्यापक शब्दों से दोनों अर्थछायाएँ सुरक्षित रखी गईं।
  alternative: ‘धार्मिक रीति से अपवित्र’ या ‘नैतिक भ्रष्टता’
  rationale: μολυσμός और ἀκαθαρσία दोनों अनुष्ठानिक तथा नैतिक बल धारण कर सकते हैं; पाठ किसी एक अर्थ को अनिवार्य नहीं करता।
- issue: ἀλλογενῶν को यूनानी के अनुसार या सामी समानांतर मुहावरे के अनुसार व्यक्त करना
  choice: परदेशियों
  alternative: देश के लोगों / देश की जातियों
  rationale: प्राथमिक यूनानी पाठ अन्य जनसमूह से संबंधित होने का भाव स्पष्ट करता है। सामी परंपरा का ‘देश के लोग’ संभावित वैकल्पिक मुहावरा है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘विरासत’ से मूल का उत्तराधिकार-संबंधी भाव रखा गया है और ‘परदेशी’ से ἀλλογενής का बाहरी जनसमूह वाला अर्थ। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
