lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ὁ βασιλεὺς δόξαν
  choice: राजा ने उसे सम्मान दिया
  rationale: δόξα का अर्थ ‘महिमा’, ‘सम्मान’ या ‘प्रतिष्ठा’ हो सकता है। राजदरबार के इस मानवीय संदर्भ में ‘सम्मान’ स्वाभाविक है और धार्मिक अर्थ वाली ‘महिमा’ का अनावश्यक संकेत नहीं देता।
- source_word: εὑρόντος χάριν ἐναντίον αὐτοῦ
  choice: उसने ... राजा की दृष्टि में कृपा पाई थी
  rationale: यह यूनानी बाइबलीय मुहावरा किसी अधिकारी की अनुकूलता प्राप्त होने को व्यक्त करता है। हिन्दी में ‘दृष्टि में कृपा पाना’ उसके संबंधपरक और दरबारी भाव को बनाए रखता है; सर्वनाम का आशय स्पष्ट करने के लिए ‘राजा’ दोहराया गया है।
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: अपनी सभी विनतियों के विषय में
  rationale: ἀξίωμα पद, प्रतिष्ठा, दावा या अनुरोध/विनती का अर्थ दे सकता है। इस प्रसंग में राजा से अनुकूल उत्तर पाने की बात होने के कारण ‘विनतियों’ को मुख्य पाठ में रखा गया है, जबकि पदों/प्रतिष्ठित नियुक्तियों की सम्भावना पादटिप्पणी में सुरक्षित है।
