base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: hi
  text: 'अदोनियाकीम के वंशजों में से जो अन्तिम थे[a]—उनके नाम ये हैं: गेउएल का पुत्र एलीफाला और शमायाह[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘अन्तिम लोग’ है। इससे कुल का अन्तिम दल या उस वंश के बाद के सदस्य अभिप्रेत हो सकते हैं; सटीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: एज्रा की इसी सूची से सम्बन्धित मसोराई पाठ इस स्थान पर एक अलग कुल और अलग संख्या देता है। 1 एसद्रास कभी-कभी अपने इब्रानी समानान्तर पाठ की सामग्री को अलग क्रम या रूप में प्रस्तुत करता है; इसलिए यहाँ यूनानी पाठ को प्राथमिक माना गया है।
    reason: textual_variant
