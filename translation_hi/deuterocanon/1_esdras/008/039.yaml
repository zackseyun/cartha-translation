- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: उनके नाम ये हैं
  rationale: यूनानी की सूची आरम्भ करने वाली संज्ञात्मक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: Ἐλειφάλα
