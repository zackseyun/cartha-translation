  rationale: यूनानी नाम-रूप का पठनीय देवनागरी लिप्यंतरण।
- source_word: τοῦ Γεουὴλ
  choice: गेउएल का पुत्र
  rationale: व्यक्तिवाचक नाम के सम्बन्धकारक रूप को वंशावली-सूची की प्रचलित पुत्र-सूचक रचना के रूप में स्पष्ट किया गया है।
- source_word: Σαμαίας
  choice: शमायाह
  rationale: यूनानी Σαμαίας के पीछे स्थित परिचित सामी नाम का हिन्दी में प्रचलित और पठनीय रूप अपनाया गया है।
