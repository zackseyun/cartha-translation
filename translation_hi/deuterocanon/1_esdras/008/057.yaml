base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: hi
  text: और उसने तौलने के बाद उन्हें[a] चाँदी के छह सौ पचास किक्कार, सौ किक्कार के चाँदी के पात्र, सोने के सौ किक्कार, सोने के बीस कटोरे[b], और उत्तम चमकदार काँसे के दस पात्र सौंप दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ एज्रा 8:27 के इब्रानी समानान्तर पाठ से उल्लेखनीय रूप से भिन्न है। इब्रानी पाठ में उत्तम काँसे के दो पात्र हैं और सोने के कटोरों का मूल्य भी दिया गया है। चूँकि यहाँ 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, इसलिए मुख्य पाठ में उसी की सूची दी गई है।
    reason: textual_variant
  - marker: b
    text: दुर्लभ यूनानी शब्द का अर्थ सम्भवतः “सोने की बीस वस्तुएँ” भी हो सकता है; इब्रानी समानान्तर पाठ इसे एक प्रकार का कटोरा या तसला समझने का समर्थन करता है।
    reason: lexical_alternative
