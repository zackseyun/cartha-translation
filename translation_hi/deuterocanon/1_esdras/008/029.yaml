base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: hi
  text: फोरोस के वंशजों में से तारोसोतोमोस;[a] येतामार के वंशजों में से गामेलोस; दाऊद के वंशजों में से,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ के यूनानी नाम एज्रा 8:2 के लगभग समानांतर इब्रानी पाठ से उल्लेखनीय रूप से भिन्न हैं। वहाँ लिखा है: “पीनहास के वंशजों में से गेर्शोम; इतामार के वंशजों में से दानिय्येल; दाऊद के वंशजों में से हत्तूश।” प्रथम एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, इसलिए मुख्य पाठ में नामों के यूनानी रूप सुरक्षित रखे गए हैं।'
    reason: alternative_reading
  - marker: b
    text: “दाऊद के वंशजों में से” वाक्यांश यहाँ अधूरा छोड़ा गया है, क्योंकि यूनानी सूची अगले पद में जारी रहती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के वंशजों में से
  rationale: वंशावली-सूची में यह स्वाभाविक हिन्दी प्रयोग है। यह किसी कुल में से व्यक्ति चुने जाने का भाव व्यक्त करता है और यूनानी संरचना की पुनरावृत्ति बनाए रखता है।
- source_word: Φορός
  choice: फोरोस
  rationale: प्रथम एस्द्रास के लिए यूनानी पाठ प्राथमिक है; इसलिए नाम को निकट यूनानी रूप में लिप्यंतरित किया गया है, न कि समानांतर इब्रानी पाठ के अनुसार बदलकर।
- source_word: Ταροσότομος
  choice: तारोसोतोमोस
  rationale: यह यूनानी नाम समानांतर मसोरी पाठ से भिन्न है। पाठ-सामंजस्य किए बिना उपलब्ध यूनानी रूप सुरक्षित रखा गया है।
- source_word: Ἰεταμάρου
  choice: इतामार
  rationale: यूनानी Ἰεταμάρ उस परिचित नाम का रूप है जिसे हिन्दी बाइबलीय परंपरा में स्वाभाविक रूप से ‘इतामार’ लिखा जाता है; यह पहचान और स्रोत-निष्ठा दोनों बनाए रखता है।
- source_word: Γάμηλος
  choice: गामेलोस
  rationale: समानांतर इब्रानी पाठ के ‘दानिय्येल’ से बदलने के बजाय यूनानी रूप का लिप्यंतरण किया गया है।
- source_word: τῶν υἱῶν Δαυείδ
  choice: दाऊद के वंशजों में से,
  rationale: यहाँ ἐκ दोहराया नहीं गया, पर सूची की पूर्ववर्ती संरचना से ‘में से’ अध्याहृत है। अंतिम अल्पविराम दर्शाता है कि सूची अगले पद में जारी रहती है।
