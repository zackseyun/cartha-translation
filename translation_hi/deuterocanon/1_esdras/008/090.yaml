  register: भाषा आधुनिक मानक हिन्दी में सरल, सार्वजनिक स्वीकारोक्ति के अनुकूल और गरिमापूर्ण रखी गई है। नामों को यूनानी रूप के निकट देवनागरी में लिखा गया है। ‘पराई स्त्रियाँ’ ऐतिहासिक सामुदायिक भेद को व्यक्त करता है; मुख्य पाठ में विवाह का अर्थ आरोपित नहीं किया गया।
