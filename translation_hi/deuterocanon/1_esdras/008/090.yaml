base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: hi
  text: तब इस्राएल के वंशजों में से येएलुस के पुत्र येखोनियास ने पुकारकर एज्रा से कहा, “हमने प्रभु के विरुद्ध पाप किया है, और इस देश की जातियों में से विदेशी स्त्रियाँ हमारे बीच आ बसी हैं।[a] फिर भी अब समूचे इस्राएल के लिए आशा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर इब्रानी पाठ अधिक स्पष्ट रूप से कहता है, “हमने देश के लोगों में से विदेशी स्त्रियों से विवाह किया है”; यहाँ यूनानी पाठ कहता है कि विदेशी स्त्रियाँ उनके बीच “आ बसी हैं।”
    reason: alternative_reading
  - marker: b
    text: यूनानी में यह अंतिम वाक्य अत्यंत कठिन है और उसका शब्दशः अर्थ अस्पष्ट है। यहाँ समानांतर पाठ-परंपरा के संभावित आशय के अनुसार “इस्राएल के लिए आशा है” अनुवाद किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσας
  choice: पुकारकर
  rationale: यह कृदन्त ऊँची या सार्वजनिक आवाज़ में बोलने का भाव देता है; ‘पुकारकर’ उसकी तात्कालिकता बनाए रखता है।
- source_word: Ἰεχονίας Ἰεήλου
  choice: येएलुस के पुत्र यकोनियास
  rationale: यूनानी नामों का देवनागरी लिप्यंतरण किया गया है। संबंधसूचक रचना और समानांतर परंपरा के आधार पर दूसरे नाम को पिता का नाम समझना सबसे स्वाभाविक है।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के वंशजों में से
  rationale: शाब्दिक ‘इस्राएल के पुत्रों में से’ की वंशपरक और सामुदायिक पहचान को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: हमने प्रभु के विरुद्ध पाप किया है
  rationale: εἰς के साथ यह वाक्यांश किसी के विरुद्ध पाप करने का अर्थ देता है; पूर्ण भाव स्वीकारोक्ति के वर्तमान संदर्भ के अनुकूल है।
- source_word: γυναῖκες ἀλλογενεῖς
  choice: पराई स्त्रियाँ
  rationale: ἀλλογενεῖς का आशय दूसरे लोगों या जातीय समुदाय की स्त्रियों से है। ‘पराई स्त्रियाँ’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: इस देश की जातियों की
  rationale: यह अनुवाद भूमि के अन्य जनसमुदायों और इस्राएल के बीच यूनानी पाठ में निहित भेद को बनाए रखता है; ‘अन्यजाति’ से उत्पन्न हो सकने वाले बाद के धार्मिक अर्थों को नहीं जोड़ता।
- source_word: κατῴκησαν
  choice: हमारे बीच आ बसी हैं
  rationale: क्रिया का मूल अर्थ बसना या निवास करना है। ‘हमारे बीच’ यूनानी में निहित सामाजिक संबंध को स्पष्ट करता है, जबकि विवाह का अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: फिर भी अब समूचे इस्राएल के लिए आशा है
  rationale: प्राप्त यूनानी वाक्य कठिन और संभवतः संक्षिप्त या विकृत है। एज्रा 10:2 की समानांतर परंपरा के संभावित आशय से सहायता लेते हुए बोधगम्य अर्थ दिया गया है, और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: κύριον के लिए ईश्वरीय उपाधि
  choice: प्रभु
  alternative: यहोवा
  rationale: तात्कालिक स्रोत यूनानी है और उसमें κύριον है; इसलिए किसी अंतर्निहित इब्रानी दिव्य नाम को मानकर जोड़ने के बजाय ‘प्रभु’ रखा गया है।
- issue: कठिन अंतिम उपवाक्य का अर्थ
  choice: फिर भी अब समूचे इस्राएल के लिए आशा है
  alternative: और अब समूचा इस्राएल ऊपर है
  rationale: शब्दशः विकल्प आधुनिक हिन्दी में अर्थहीन है। समानांतर पाठ-परंपरा आशा के भाव का समर्थन करती है, पर यूनानी की वास्तविक कठिनाई को पादटिप्पणी में छिपाया नहीं गया है।
- issue: पराई स्त्रियों के बसने और विवाह के बीच संबंध
  choice: हमारे बीच आ बसी हैं
  alternative: हमने पराई स्त्रियों से विवाह किया है
  rationale: विवाह का भाव इब्रानी समानांतर में अधिक स्पष्ट है, पर प्रस्तुत यूनानी पाठ केवल स्त्रियों के बसने की बात करता है। इसलिए मुख्य पाठ में यूनानी को प्राथमिकता दी गई है।
