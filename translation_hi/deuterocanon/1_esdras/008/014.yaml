  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। पद बड़े वाक्य का अंश है, इसलिए आरम्भ में ‘और’ तथा अन्त में अल्पविराम रखा गया है। ‘मन्दिर’, ‘प्रभु’, ‘बैलों’, ‘मेढ़ों’ और ‘मेमनों’ जैसे परिचित बाइबिलीय शब्द प्रयुक्त हैं।
