- issue: यूनानी पाठ और एज्रा 7:16 के इब्रानी समानांतर के बीच उल्लेखनीय अंतर
  choice: यूनानी के अनुसार ‘उस जाति’ और ‘उनके प्रभु के मन्दिर’ का अनुवाद
  alternative: इब्रानी समानांतर से सामंजस्य करके ‘राजा और उसके मन्त्रियों द्वारा इस्राएल के परमेश्वर को स्वेच्छा से दिया गया सोना और चाँदी’ कहना
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है। इब्रानी समानांतर की भिन्न शब्दावली को मूल पाठ में मिलाना उचित नहीं; अंतर पादटिप्पणी में बताया गया है।
