  text: और उस दान के साथ जो उस राष्ट्र ने यरूशलेम में उनके प्रभु के मन्दिर के लिए दिया था,[a] सोना और चाँदी भी बैलों, मेढ़ों, मेमनों और उनके साथ आने वाली वस्तुओं के लिए इकट्ठा किए जाएँ,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 7:16 का इब्रानी समानांतर यहाँ उल्लेखनीय रूप से भिन्न है। उसमें राजा और उसके मन्त्रियों द्वारा इस्राएल के परमेश्वर को स्वेच्छा से दिए गए सोने और चाँदी की बात है; उस परमेश्वर का निवास यरूशलेम में है। 1 एस्द्रास के यूनानी पाठ की शब्दावली इससे समान नहीं है, इसलिए यहाँ उसी यूनानी पाठ का अनुवाद किया गया है।
