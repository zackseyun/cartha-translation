  rationale: ἱερόν को प्रसंगानुकूल ‘मन्दिर’, κύριος को ‘प्रभु’ और αὐτῶν को ‘उनके’ कहा गया है; यूनानी में निहित न होने के कारण ‘परमेश्वर’ नहीं जोड़ा गया।
- source_word: συναχθῆναι, τό τε χρυσίον καὶ ἀργύριον
  choice: सोना और चाँदी भी ... इकट्ठा की जाएँ
  rationale: निष्क्रिय अनन्त क्रिया को हिन्दी में विधेयात्मक निष्क्रिय रूप देकर राशि एकत्र किए जाने का अर्थ स्पष्ट रखा गया है।
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: बैलों, मेढ़ों, मेमनों ... के लिए
  rationale: बलिदान-संबंधी पशुओं के विशिष्ट वर्गों को सामान्य और बोधगम्य हिन्दी शब्दों में व्यक्त करता है।
- source_word: τὰ τούτοις ἀκόλουθα
  choice: उनके साथ की आवश्यक वस्तुओं
  rationale: ἀκόλουθα का साथ आने वाली वस्तुओं का सामान्य अर्थ सुरक्षित है; ‘आवश्यक’ प्रसंग में बलिदानों के साथ लगने वाली सामग्री का संकेत देता है, पर उसे किसी निश्चित सूची तक सीमित नहीं करता।
