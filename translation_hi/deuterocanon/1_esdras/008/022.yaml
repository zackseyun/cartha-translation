base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: hi
  text: और तुम्हें यह भी घोषित किया जाता है कि किसी भी याजक, लेवी, मन्दिर-गायक, द्वारपाल, मन्दिर-सेवक या इस मन्दिर के कामकाज में लगे व्यक्ति पर कोई कर या अन्य भार[a] न लगाया जाए, और किसी को भी उन पर ऐसा करने का अधिकार न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अन्य भार” का अनुवाद “अन्य लगाया गया दायित्व” या, इस कर-संबंधी प्रसंग में, “अन्य उपकर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: घोषित किया जाता है
  rationale: राजकीय आदेश के प्रशासनिक प्रसंग में निष्क्रिय क्रिया औपचारिक घोषणा का भाव रखती है; केवल ‘कहा जाता है’ अपेक्षाकृत दुर्बल होता।
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: किसी भी याजक
  rationale: निषेधात्मक वाक्य में यह स्वाभाविक हिन्दी है और सभी याजकों पर लागू व्यापकता को सुरक्षित रखती है।
- source_word: Λευείταις
  choice: लेवी
  rationale: मन्दिर-सेवा से जुड़े इस वर्ग के लिए मानक हिन्दी बाइबलीय रूप।
- source_word: ἱεροψάλταις
  choice: मन्दिर के गायक
  rationale: यौगिक यूनानी शब्द गायकों की उपासना-स्थल से जुड़ी भूमिका को स्पष्ट करता है।
- source_word: θυρωροῖς
  choice: द्वारपाल
  rationale: मन्दिर के प्रवेश-द्वारों की देखरेख करने वाले कर्मियों के लिए स्वाभाविक और प्रतिष्ठित हिन्दी शब्द।
- source_word: ἱεροδούλοις
  choice: मन्दिर के सेवक
  rationale: सूची के सन्दर्भ में यह मन्दिर-सेवा का भाव देता है, पर दासत्व की ऐसी विशिष्ट स्थिति नहीं थोपता जिसे पद स्पष्ट रूप से प्रमुख नहीं करता।
- source_word: πραγματικοῖς τοῦ ἱεροῦ τούτου
  choice: इस मन्दिर के कामकाज में लगे व्यक्ति
  rationale: πραγματικός मन्दिर के मामलों या कामकाज में लगे लोगों को सूचित कर सकता है; यह अनुवाद उन्हें केवल संकीर्ण अर्थ में ‘अधिकारी’ नहीं बनाता।
- source_word: μηδεμία φορολογία
  choice: कोई कर
  rationale: φορολογία कर या राजस्व-दायित्व को सूचित करता है; ‘कर’ संक्षिप्त और आधुनिक हिन्दी है।
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: या अन्य भार
  rationale: कर-संबंधी प्रशासनिक सन्दर्भ में शब्द किसी अतिरिक्त थोपे गए दायित्व या बोझ का अर्थ ले सकता है; ‘भार’ इसकी सम्भावित व्यापकता सुरक्षित रखता है।
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: किसी को भी उन पर ये लगाने का अधिकार न हो
  rationale: यह कानूनी अधिकार के निषेध को स्पष्ट करता है और बहुवचन ‘ये’ को कर तथा अन्य भार दोनों से जोड़ता है।
