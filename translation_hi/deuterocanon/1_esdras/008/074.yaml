base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: hi
  text: और हमारे पापों और हमारे पूर्वजों के पापों के कारण हम अपने भाइयों, अपने राजाओं और अपने याजकों समेत पृथ्वी के राजाओं[a] के हवाले कर दिए गए—तलवार, बंदी बनाए जाने और लूट[b] के लिए, अपमान के साथ—आज तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश के राजाओं’। यूनानी शब्द γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लूट-पाट’। यूनानी शब्द शत्रुओं के हाथों लूटे जाने या लूट का माल बना दिए जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: हमारे पापों और हमारे पूर्वजों के पापों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है। ‘के कारण’ इस अर्थ को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है; πατέρων को प्रसंगानुसार ‘पूर्वजों’ कहा गया है।
- source_word: παρεδόθημεν
  choice: हम ... के हाथ में सौंप दिए गए
  rationale: παραδίδωμι का कर्मवाच्य किसी दूसरे के अधिकार में कर दिए जाने का भाव रखता है। ‘के हाथ में सौंप दिए गए’ हिन्दी में इस अधीनता को स्पष्ट करता है।
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν
  choice: अपने भाइयों ... समेत
  rationale: ἀδελφοῖς का सीधा अर्थ ‘भाइयों’ है। राष्ट्रीय विलाप में इसका संकेत व्यापक स्वजातीय समुदाय की ओर हो सकता है, फिर भी मूल की अभिव्यक्ति को बनाए रखा गया है।
- source_word: σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: अपने राजाओं और अपने याजकों समेत
  rationale: दोनों समूहों को साथ में न्याय भोगने वालों के रूप में रखा गया है। ‘समेत’ बार-बार ‘के साथ’ दोहराए बिना ग्रीक σύν का समावेशी बल व्यक्त करता है।
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: पृथ्वी के राजाओं
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। निर्वासन के प्रसंग में ‘पृथ्वी के राजा’ विदेशी सांसारिक शासकों के लिए स्वाभाविक बाइबलीय अभिव्यक्ति है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: εἰς ῥομφαίαν
  choice: तलवार ... के लिए
  rationale: ῥομφαία युद्ध या हिंसक मृत्यु के साधन के रूप में ‘तलवार’ है। संक्षिप्त संज्ञात्मक रूप मूल की न्याय-सूची को बनाए रखता है।
- source_word: αἰχμαλωσίαν
  choice: बंदी बनाए जाने
  rationale: शब्द पकड़े जाकर बंदी होने की दशा व्यक्त करता है। यह आधुनिक पाठकों के लिए ‘बंधुआई’ की अपेक्षा अधिक सहज और स्पष्ट है।
- source_word: προνομὴν
  choice: लूट
  rationale: προνομή का अर्थ लूट-पाट या शत्रु के हाथों माल-असबाब लुट जाना है। ‘लूट’ संक्षिप्त, वर्तमान और स्पष्ट हिन्दी है।
- source_word: μετὰ αἰσχύνης
  choice: लज्जाजनक
  rationale: αἰσχύνη सामाजिक अपमान और लज्जा व्यक्त करता है। ‘लज्जाजनक लूट’ हिन्दी में लूट के साथ जुड़े अपमान को स्वाभाविक रूप से जोड़ता है।
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: और यह दशा आज तक बनी हुई है
  rationale: ग्रीक मुहावरा अतीत के न्याय के वक्ता के वर्तमान तक जारी रहने को बताता है। हिन्दी में स्पष्टता के लिए निरंतर दशा का भाव पूरा वाक्यांश बनाकर व्यक्त किया गया है।
theological_decisions:
- issue: पीढ़ियों में सामूहिक दोष
  choice: ‘हमारे पापों और हमारे पूर्वजों के पापों’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे नरम करके ‘हमारे और हमसे पहले के लोगों के पापों’ कहना।
  rationale: ग्रीक वर्तमान समुदाय और उनके पूर्वजों—दोनों के पापों को विपत्ति का कारण बताता है। अनुवाद इस सामुदायिक और पीढ़ीगत उत्तरदायित्व के तनाव को कम या व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’ और ‘तलवार’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, जबकि कम प्रचलित ‘बंधुआई’ के स्थान पर ‘बंदी बनाए जाने’ का प्रयोग किया गया है। मुख्य पाठ में पादटिप्पणी [a] को γῆ से संबंधित ‘पृथ्वी के राजाओं’ पर और [b] को ‘लूट’ पर लगाया गया है।
