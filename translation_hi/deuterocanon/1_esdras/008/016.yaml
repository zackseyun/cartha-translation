base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: hi
  text: और तुम अपने भाइयों के साथ सोने और चाँदी के साथ जो कुछ करना चाहो, उसे अपने परमेश्वर की इच्छा के अनुसार पूरा करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा 7:18 के अरामी समानांतर में बात अधिक विशिष्ट है: वहाँ बचे हुए सोने और चाँदी से वह करने को कहा गया है जो उचित लगे। 1 एसद्रास का यूनानी पाठ यहाँ अधिक व्यापक शब्दों में कहता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: जो कुछ करना चाहो
  rationale: यह यूनानी मुहावरा एक खुला संबंधवाचक उपवाक्य व्यक्त करता है। ‘जो कुछ ... चाहो’ उसकी व्यापकता और इच्छासूचक भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: तुम अपने भाइयों के साथ
  rationale: μετά का संगति-सूचक अर्थ ‘के साथ’ से सीधे व्यक्त होता है। ἀδελφῶν पुल्लिंग बहुवचन है, इसलिए बिना अनावश्यक विस्तार के ‘भाइयों’ रखा गया है।
- source_word: ποιῆσαι
  choice: करना
  rationale: ποιέω यहाँ धन के विषय में संभावित कार्य के लिए व्यापक क्रिया है; ‘करना’ उसी सामान्यता को सुरक्षित रखता है।
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  choice: सोने और चाँदी से
  rationale: दोनों संज्ञाएँ सम्प्रदान कारक में हैं और यहाँ साधन अथवा उपलब्ध धन के उपयोग का भाव देती हैं। ‘से’ संक्षिप्त और स्वाभाविक है, यद्यपि हिन्दी में ‘के साथ’ या ‘का’ भी संभव होता।
- source_word: ἐπιτέλει
  choice: उसे ... पूरा करो
  rationale: ἐπιτελέω किसी बात को कार्यान्वित करने या पूर्ण करने का भाव देता है। ‘पूरा करो’ पहले आए व्यापक ‘करना’ से भेद रखते हुए निष्पादन का अर्थ व्यक्त करता है।
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: अपने परमेश्वर की इच्छा के अनुसार
  rationale: यह अनुवाद यूनानी वाक्यांश के मानक अथवा नियंत्रक भाव को निकटता और सहजता से व्यक्त करता है। ‘अपने’ हिन्दी में द्वितीय पुरुष संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: यूनानी पाठ की व्यापक अनुमति और एज्रा 7:18 के अरामी समानांतर की अधिक विशिष्ट भाषा के बीच संबंध
  choice: यूनानी के अनुसार व्यापक रूप में ‘जो कुछ करना चाहो’ का अनुवाद किया गया है और उसे परमेश्वर की इच्छा के अधीन रखा गया है।
  alternative: अरामी समानांतर से सामंजस्य बैठाते हुए ‘बचे हुए सोने और चाँदी से जो करना तुम्हें और तुम्हारे भाइयों को अच्छा लगे’ कहना।
  rationale: 1 एसद्रास के लिए दिया गया यूनानी पाठ प्राथमिक आधार है। उसमें ‘बचा हुआ’ अथवा ‘जो अच्छा लगे’ के स्पष्ट शब्द नहीं हैं; अतः उन्हें मुख्य पाठ में जोड़ना यूनानी की व्यापकता को अनुचित रूप से सीमित करता। पाठांतर-संबंधी जानकारी पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘परमेश्वर’ बाइबिलीय संदर्भ के अनुरूप है; वाक्य में यूनानी पाठ की व्यापकता और परमेश्वर की इच्छा द्वारा लगाई गई सीमा दोनों सुरक्षित हैं।
