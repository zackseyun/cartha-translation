lexical_decisions:
- source_word: μετʼ αὐτῶν
  choice: उनके साथ
  rationale: μετά के साथ संबंधकारक यहाँ साथ होने का भाव व्यक्त करता है; ‘उनके साथ’ इसका स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ἄνδρες यहाँ सामान्यतः पुरुषों को सूचित करता है, न कि लिंग-निरपेक्ष लोगों को; इसलिए ‘पुरुष’ मूल के अर्थ को ठीक रूप से बनाए रखता है।
- source_word: ἑβδομήκοντα
  choice: सत्तर
  rationale: यूनानी पाठ में संख्या स्पष्ट रूप से ‘सत्तर’ है; इब्रानी समानांतर पाठ की भिन्न संख्या को मुख्य पाठ में मिलाने के बजाय पाद-टिप्पणी में बताया गया है।
