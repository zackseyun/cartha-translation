base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: hi
  text: वहाँ तीसरा दिन आने पर चाँदी और सोना तौला गया और प्रभु के भवन में ऊरियास के पुत्र मरमोथी याजक को सौंप दिया गया। उसके साथ फीनेएस का पुत्र एलेआज़ार था; और उनके साथ येसूस का पुत्र योसाबेस और साबन्नुस का पुत्र मोएथ—ये लेवी थे। सब कुछ गिनती और तौल के अनुसार था, और पूरा भार उसी समय दर्ज किया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: वहाँ तीसरा दिन आने पर
  rationale: सम्बन्धवाचक कृदन्तीय रचना समय-सूचक परिस्थिति बताती है। यह अनुवाद यूनानी के ‘तीसरा दिन आने’ वाले कथात्मक रूप और αὐτόθι के स्थानबोध दोनों को बनाए रखता है।
- source_word: σταθὲν ... παρεδόθη
  choice: तौला गया और ... सौंप दिया गया
  rationale: निष्क्रिय कृदन्त और मुख्य क्रिया क्रमशः तौलने तथा औपचारिक रूप से सुपुर्द करने की क्रियाएँ बताते हैं; अतिरिक्त अर्थ जोड़े बिना प्रशासनिक प्रसंग स्पष्ट रहता है।
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: प्रभु के भवन में
  rationale: यह मंदिर के लिए प्रयुक्त पारंपरिक बाइबलीय पदबंध है। ‘भवन’ οἶκος के रूपक को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: ऊरियास के पुत्र मरमोथी याजक को
  rationale: यूनानी नाम-रूपों को लिप्यंतरित किया गया है। समानांतर परंपरा और इस वंशावली-सूचक सूची के आधार पर ऊरियास को पिता का नाम समझना सर्वाधिक संगत है, यद्यपि यूनानी की संक्षिप्त दत्तिवीय रचना स्वयं कुछ अस्पष्ट है।
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: सब कुछ गिनती और तौल के अनुसार
  rationale: यह पदबंध सामग्री की पूर्ण और सावधानीपूर्वक गणना को व्यक्त करता है; ‘गिनती और तौल’ दोनों प्रशासनिक मानदंडों को स्पष्ट रखता है।
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: पूरा भार उसी समय दर्ज कर लिया गया
  rationale: ἐγράφη लिखित अभिलेख को और αὐτῇ τῇ ὥρᾳ तत्कालता को दर्शाता है। ‘दर्ज कर लिया गया’ वर्तमान हिन्दी में स्वाभाविक प्रशासनिक अभिव्यक्ति है।
theological_decisions:
- issue: मंदिर-सूत्र में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: ἐν τῷ οἴκῳ Κυρίου एक पवित्र मंदिर-सूत्र है। ‘प्रभु’ यूनानी पद का सीधा, व्यापक और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- issue: यूनानी और मसोराई परंपरा में भिन्न व्यक्तिनाम
  choice: मुख्य पाठ में यूनानी रूपों का लिप्यंतरण
  alternative: मसोराई परंपरा के परिचित नाम—मेरेमोत, ऊरिय्याह, योनातान, येशू और नोअद्याह आदि—मुख्य पाठ में रखना
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक साक्ष्य है। इसलिए मुख्य पाठ उसी के नाम-रूपों का अनुसरण करता है और वैकल्पिक परंपरा को पाद-टिप्पणी में पारदर्शी ढंग से बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रभु का भवन’, ‘लेवी’, ‘गिनती और तौल’ तथा ‘दर्ज कर लिया गया’ जैसे पद बाइबलीय वातावरण और लेखा-प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करते हैं। यूनानी व्यक्तिनाम देवनागरी में लिप्यंतरित हैं।
