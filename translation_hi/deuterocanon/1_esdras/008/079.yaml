base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: hi
  text: और अब, हे प्रभु, इन बातों के होते हुए हम क्या कहें?[a] उन्होंने आपकी उन आज्ञाओं का उल्लंघन किया, जिन्हें आपने अपने सेवक नबियों के हाथ से दी थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इन बातों” का सन्दर्भ ग्रीक में संक्षिप्त और अस्पष्ट है; सम्भवतः इसका संकेत प्रार्थना में अभी-अभी कही गई अनुकूल परिस्थितियों या कृपाओं की ओर है।
    reason: lexical_alternative
  - marker: b
    text: “नबियों के हाथ से” एक बाइबिलीय मुहावरा है, जिसका अर्थ है “नबियों के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: καί की संयोजक शक्ति और प्रार्थना में अगले विचार की ओर संक्रमण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τί ἐροῦμεν
  choice: हम क्या कहें?
  rationale: भविष्यकालीन रूप वाले इस आलंकारिक प्रश्न का गम्भीर और विचारमग्न भाव हिन्दी के संभावनार्थक रूप से स्वाभाविक रूप में व्यक्त होता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को स्पष्ट और प्रार्थनापूर्ण हिन्दी में व्यक्त करता है; κύριος का मानक अर्थ ‘प्रभु’ रखा गया है।
- source_word: ἔχοντες αὐτά
  choice: यह सब हमारे पास होते हुए
  rationale: ग्रीक वाक्यांश संक्षिप्त है और αὐτά का सन्दर्भ स्पष्ट नहीं करता। यह अनुवाद ‘पास होने’ का भाव बनाए रखते हुए उसके सन्दर्भ को वरदान, परिस्थिति या किसी अन्य विशिष्ट वस्तु के रूप में निश्चित नहीं करता।
- source_word: παρέβησαν
  choice: उन्होंने ... उल्लंघन किया
  rationale: तीसरे पुरुष बहुवचन को सुरक्षित रखता है और क्रिया के नैतिक-विधिक अर्थ को स्पष्ट करता है। ग्रीक एओरिस्ट के अनुरूप सरल भूतकाल रखा गया है।
- source_word: τὰ προστάγματά σου
  choice: आपकी ... आज्ञाओं
  rationale: πρόσταγμα यहाँ दिए गए आदेश या निर्देश को दर्शाता है; ‘आज्ञाएँ’ आधुनिक हिन्दी में स्पष्ट और वाचा-संबंधी प्रसंग के अनुकूल है।
- source_word: ἃ ἔδωκας
  choice: जिन्हें आपने ... दिया था
  rationale: δίδωμι के सीधे अर्थ ‘देना’ को रखा गया है; हिन्दी में पूर्वकालिक संबंध स्पष्ट करने के लिए ‘दिया था’ स्वाभाविक है।
- source_word: ἐν χειρὶ
  choice: के हाथ से
  rationale: माध्यम के द्वारा दिए जाने की मानक बाइबिलीय अभिव्यक्ति को सुरक्षित रखता है; इसका आशय ‘के द्वारा’ है।
- source_word: τῶν παίδων σου
  choice: अपने दास
  rationale: παῖς के अनेक अर्थ हो सकते हैं, पर नबियों की नियुक्ति और सेवा के प्रसंग में ‘दास’ उपयुक्त है।
- source_word: τῶν προφητῶν
  choice: नबियों
  rationale: προφήτης का प्रचलित और सहज हिन्दी समतुल्य; ‘दास नबियों’ में यह ‘दास’ का समानाधिकरण है।
theological_decisions:
- issue: παρέβησαν का अंतर्निहित कर्ता
  choice: उन्होंने ... उल्लंघन किया
  alternative: हमने ... उल्लंघन किया
  rationale: ग्रीक क्रिया तीसरे पुरुष बहुवचन में है। प्रार्थना में वक्ता समुदाय के साथ अपनी पहचान रख सकता है, फिर भी इस पद की व्याकरणिक दूरी को प्रथम पुरुष में बदलना उचित नहीं है।
- issue: ἐν χειρὶ का मध्यस्थता-सूचक मुहावरा
  choice: अपने दास नबियों के हाथ से
  alternative: अपने दास नबियों के द्वारा
  rationale: शाब्दिक बाइबिलीय मुहावरा हिन्दी में बोधगम्य है और यह दिखाता है कि आज्ञाएँ नबियों के माध्यम से दी गईं; पादटिप्पणी अधिक सहज अर्थ स्पष्ट करती है।
- issue: ἔχοντες αὐτά का अनिश्चित सन्दर्भ
  choice: यह सब हमारे पास होते हुए
  alternative: यह सब पाने के बाद
  rationale: ‘पाने के बाद’ प्राप्ति की घटना को स्पष्ट मान लेता, जबकि ग्रीक केवल ‘रखते/पास होते हुए’ कहता है। अनुवाद जानबूझकर सन्दर्भ की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर किन्तु सहज प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ रखा गया है। ‘दास नबी’ और ‘के हाथ से’ स्रोत की बाइबिलीय बनावट बनाए रखते हैं, जबकि पादटिप्पणियाँ अस्पष्टता और मुहावरे को स्पष्ट करती हैं।
