  text: And when these things had been completed, the leaders came to me, saying,
translation:
  language: hi
  text: और जब ये बातें पूरी हो गईं, तब नेता मेरे पास आए और कहने लगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: जब ये काम पूरे हो गए
  rationale: यह संबंधवाचक स्वतंत्र पदबंध पहले पूरी हो चुकी कार्रवाई को दर्शाता है। संदर्भ में τούτων को स्वाभाविक हिन्दी में ‘ये काम’ कहना अस्पष्ट ‘ये बातें’ की अपेक्षा अधिक सहज है, जबकि मूल का व्यापक संकेत बना रहता है।
- source_word: προσηλθόσαν μοι
  choice: मेरे पास आकर
  rationale: προσέρχομαι और सम्प्रदान μοι का स्वाभाविक हिन्दी रूप; इससे निकट आने और अगले कथन से जुड़ने का भाव बना रहता है।
- source_word: οἱ ἡγούμενοι
  choice: अगुए
  rationale: यह शब्द नेतृत्व करने वाले व्यक्तियों को बताता है, पर किसी निश्चित औपचारिक पद का दावा नहीं करता। ‘अगुए’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में बोधगम्य है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: वर्तमान कृदंत अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका बनाता है। ‘कहने लगे’ हिन्दी में इस अपूर्ण वाक्य-संबंध को स्वाभाविक रूप से आगे बढ़ाता है।
