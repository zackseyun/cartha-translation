base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: hi
  text: और जिन याजकों और लेवियों ने चाँदी, सोना और यरूशलेम में जो पात्र थे उन्हें ग्रहण किए थे, वे उन्हें प्रभु के मंदिर में ले आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'समानांतर इब्रानी पाठ का भाव है: “याजकों और लेवियों ने तौली हुई चाँदी, सोना और पात्र ग्रहण किए, ताकि उन्हें यरूशलेम में हमारे परमेश्वर के भवन तक ले जाएँ।” यूनानी पाठ में पात्र यरूशलेम में हैं और उन्हें “प्रभु के मंदिर में” ले आया गया।'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβόντες
  choice: ग्रहण किए थे
  rationale: अओरिस्ट कृदन्त पहले वस्तुओं को ग्रहण करने और फिर उन्हें मंदिर में लाने का क्रम बताता है। ‘ग्रहण किए थे’ इस क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: याजकों और लेवियों
  rationale: यह मंदिर-सेवा से जुड़े दो अलग, पहचाने हुए समूहों का सीधा और प्रचलित हिन्दी रूप है।
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: चाँदी, सोना
  rationale: यूनानी में मूल्यवान धातुओं के नाम सीधे दिए गए हैं; ‘धन’ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: τὰ σκεύη τὰ ἐν Ἰερουσαλήμ
  choice: यरूशलेम में रखे पात्र
  rationale: दोहराया हुआ निश्चित उपपद τὰ ... τὰ ἐν Ἰερουσαλήμ स्थान-सूचक वाक्यांश को ‘पात्रों’ का विशेषण बनाता है। ‘रखे’ हिन्दी में स्थानगत स्थिति को स्वाभाविक ढंग से व्यक्त करता है, बिना पात्रों के प्रकार को अधिक निश्चित किए।
- source_word: ἤνεγκαν
  choice: ले आए
  rationale: क्रिया वस्तुओं को एक लक्ष्य तक पहुँचाने का भाव देती है। मंदिर की ओर गति के संदर्भ में ‘ले आए’ सहज हिन्दी है।
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: प्रभु के मंदिर में
  rationale: εἰς लक्ष्य के भीतर पहुँचने का संकेत देता है और ἱερόν यहाँ मंदिर अथवा उसके पवित्र परिसर को सूचित करता है। ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय उपाधि κυρίου
  choice: प्रभु
  alternative: हमारे परमेश्वर
  rationale: मुख्य यूनानी पाठ में ‘प्रभु का मंदिर’ है, जबकि समानांतर इब्रानी पाठ में ‘हमारे परमेश्वर का भवन’ है। मुख्य पाठ यूनानी का अनुसरण करता है और इब्रानी भिन्नता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: यरूशलेम का वाक्यगत संबंध
  choice: यरूशलेम में रखे पात्र
  alternative: उन्हें यरूशलेम में हमारे परमेश्वर के भवन तक ले जाने के लिए
  rationale: यूनानी व्याकरण में ἐν Ἰερουσαλήμ, τὰ σκεύη के साथ विशेषणात्मक रूप में जुड़ा है; इब्रानी समानांतर में यरूशलेम गंतव्य है। इस वास्तविक पाठांतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप अपनाया गया है। ‘याजक’, ‘लेवी’, ‘प्रभु’ और ‘मंदिर’ जैसे व्यापक रूप से समझे जाने वाले बाइबलीय शब्द रखे गए हैं। मुख्य पाठ में यूनानी की विशेषणात्मक रचना सुरक्षित है और इब्रानी समानांतर का भिन्न स्थान-संबंध पादटिप्पणी में पारदर्शी रूप से दिया गया है।
