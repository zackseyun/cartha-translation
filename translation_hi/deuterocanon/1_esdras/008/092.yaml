  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: hi
  text: उठो और इसे पूरा करो, क्योंकि यह मामला तुम्हारे जिम्मे है, और हम तुम्हारे साथ हैं; दृढ़ होकर काम करो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम यूनानी वाक्यांश संक्षिप्त है और उसका अर्थ ‘सामर्थ्य से काम करना’ भी हो सकता है; इब्रानी समानांतर पाठ (एज्रा 10:4) के प्रकाश में इसे ‘दृढ़ हो और काम कर’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठो
  rationale: ἀνίστημι का कृदन्त यहाँ आज्ञार्थक आग्रह की तरह प्रयुक्त है; ‘उठो’ संक्षिप्त, स्वाभाविक और कार्य के लिए तत्पर होने का भाव देता है।
- source_word: ἐπίτελει
  choice: इसे पूरा करो
  rationale: ἐπιτελέω की आज्ञार्थक क्रिया किसी काम को पूर्णता तक पहुँचाने का निर्देश देती है। ‘इसे पूरा करो’ आधुनिक हिन्दी में स्पष्ट और निर्णायक है।
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: क्योंकि यह मामला तुम्हारे ही हाथ में है
  rationale: शाब्दिक रूप से ‘मामला तुम्हारी ओर है’; प्रसंग में यह उत्तरदायित्व सौंपे जाने का मुहावरा है। ‘तुम्हारे ही हाथ में है’ स्वाभाविक हिन्दी में जिम्मेदारी का अर्थ व्यक्त करता है।
- source_word: ἡμεῖς μετὰ σοῦ
  choice: हम तुम्हारे साथ हैं
  rationale: यह समर्थन और एकजुटता की सीधी अभिव्यक्ति है; अनावश्यक व्याख्या जोड़े बिना मूल अर्थ बनाए रखती है।
- source_word: ἰσχὺν ποιεῖν
  choice: दृढ़ होकर काम करो
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ असामान्य है, जिसका भाव सामर्थ्य के साथ कार्य करना है। यह अनुवाद क्रियाशीलता और दृढ़ता दोनों रखता है; पाठ में निहित अस्पष्टता को पादटिप्पणी में बताया गया है।
