base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: hi
  text: 'बाएर के वंशजों में से: जकर्याह बेमाई, और उसके साथ अट्ठाईस पुरुष।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: बाएर के वंशजों में से
  rationale: यूनानी पदबंध सूची के इस संदर्भ में किसी कुल या वंश को सूचित करता है। मूल में ‘पुत्र’ स्पष्ट नहीं है, इसलिए स्वाभाविक और अपेक्षाकृत तटस्थ हिन्दी ‘वंशजों’ चुना गया है।
- source_word: Ζαχαρίαι
  choice: जकर्याह
  rationale: यह यूनानी नाम के पीछे स्थित परिचित इब्रानी नाम का मानक हिन्दी बाइबलीय रूप है।
- source_word: Βημαί
  choice: बेमायाह का पुत्र
  rationale: यूनानी में यह केवल एक व्यक्तिनाम के रूप में आता है और संबंध स्पष्ट नहीं करता; वंशावली-सूची का संदर्भ इसे पिता का नाम समझने का समर्थन करता है। ‘का पुत्र’ जोड़कर यह निहित संबंध स्पष्ट किया गया है, जबकि यूनानी नाम सुरक्षित रखा गया है।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: साथ आए दल को बताने वाले यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: अट्ठाईस पुरुष
  rationale: ἄνδρες यहाँ गिने गए पुरुष व्यक्तियों को स्पष्ट रूप से दर्शाता है; ‘पुरुष’ इसकी लैंगिक विशिष्टता बनाए रखता है।
