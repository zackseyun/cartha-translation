base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: hi
  text: क्योंकि मुझे हमारे विरोधियों से सुरक्षा के लिए घुड़सवारों और पैदल सैनिकों को अनुरक्षक दल के रूप में माँगने में लज्जा हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे विरोधियों से सुरक्षा के लिए घुड़सवारों और पैदल सेना का अनुरक्षक दल माँगने में।”
    reason: ‘घुड़सवारों’ और ‘पैदल सैनिकों’ के लिए सामूहिक सैन्य शब्दावली वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἐνετράπην
  choice: मुझे ... लज्जा आई
  rationale: यह यूनानी क्रिया यहाँ अनुरोध करने में अनुभव हुई लज्जा या संकोच व्यक्त करती है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: αἰτῆσαι
  choice: यह माँगने में
  rationale: अनन्त क्रिया किसी वस्तु या सहायता का अनुरोध करने को दर्शाती है; ‘माँगने’ से आशय स्पष्ट रहता है।
- source_word: ἵππεις
  choice: घुड़सवार
  rationale: शब्द का सीधा अर्थ घोड़े पर लड़ने वाले सैनिक है; ‘घुड़सवार’ संक्षिप्त और सामान्य हिन्दी है।
- source_word: πεζοὺς
  choice: पैदल सैनिक
  rationale: यह घुड़सवारों के विपरीत पैदल चलकर लड़ने वाले सैनिकों को दर्शाता है।
- source_word: προπομπὴν
  choice: हमारे साथ रक्षक-दल के रूप में भेजे जाएँ
  rationale: संज्ञा यात्रियों के साथ सुरक्षा हेतु भेजे गए अनुरक्षक दल को सूचित करती है; हिन्दी वाक्य में इसके कार्य को स्पष्ट करने के लिए क्रियात्मक रूप अपनाया गया है।
- source_word: ἕνεκεν ἀσφαλείας
  choice: सुरक्षा के लिए
  rationale: यह उद्देश्य बताने वाला पदबंध है और यात्रा के दौरान संरक्षण का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: हमारे विरोधियों से
  rationale: यह उन लोगों से उत्पन्न खतरे को इंगित करता है जो उनके विरुद्ध थे; ‘विरोधियों’ में शत्रुता का भाव सुरक्षित है, पर यह औपचारिक सैन्य वर्ग को अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: दिए गए मसोरी समानांतर पाठ का इस यूनानी वचन से मेल न खाना
  choice: यूनानी पाठ में आए सैन्य रक्षक-दल के कथन का सीधे अनुवाद किया गया है।
  alternative: मसोरी समानांतर के उपवास और प्रार्थना संबंधी कथन से सामंजस्य बैठाकर सैन्य रक्षक-दल का उल्लेख छोड़ देना।
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है। दिया गया इब्रानी समानांतर इस वचन की विषयवस्तु से मेल नहीं खाता, इसलिए उसे अनुवाद पर नियंत्रक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यूनानी वाक्य का कारणसूचक आरम्भ ‘क्योंकि’ से सुरक्षित है और सैन्य शब्दावली को तकनीकी बनाए बिना स्पष्ट किया गया है।
