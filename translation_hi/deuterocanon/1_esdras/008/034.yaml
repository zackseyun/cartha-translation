base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: hi
  text: सोफोतियुस के वंशजों में से मीकाएल का पुत्र जरायास[a], और उसके साथ सत्तर पुरुष।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ के यूनानी नाम और संख्या एज्रा 8:6 के लगभग समानांतर इब्रानी पाठ से भिन्न हैं। वहाँ लिखा है, “आदीन के वंशजों में से योनातान का पुत्र एबेद, और उसके साथ पचास पुरुष।” चूँकि 1 एस्द्रास के लिए यूनानी पाठ मूल आधार है, इसलिए मुख्य पाठ में उसी के नाम और संख्या रखे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Σοφοτίου
  choice: सोफोतियुस के वंशजों में से
  rationale: ἐκ के साथ संबंधकारक किसी समूह में से चयन को व्यक्त करता है। सूची के इस प्रसंग में υἱοί वंश-समूह का संकेत देता है, इसलिए शाब्दिक ‘पुत्रों’ की अपेक्षा स्वाभाविक हिन्दी ‘वंशजों’ चुना गया; नाम यूनानी रूप के अनुसार लिप्यंतरित है।
- source_word: Ζαραίας
  choice: जरायास
  rationale: व्यक्तिनाम को यूनानी रूप से सीधे देवनागरी में लिप्यंतरित किया गया है; अनुमानित इब्रानी समानांतर से सामंजस्य नहीं बैठाया गया।
- source_word: Μειχαήλου
  choice: मीकाएल का पुत्र
  rationale: वंशावली-सूची में अकेला संबंधकारक स्वाभाविक रूप से पितृ-संबंध बताता है। स्पष्ट और सुबोध हिन्दी के लिए ‘का पुत्र’ जोड़ा गया है।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: यह साथ होने का सामान्य पदबंध है, जो नामित अगुए को उसके साथ गिने गए दल से जोड़ता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ἄνδρες यहाँ गिने गए पुरुष व्यक्तियों को सूचित करता है; ‘पुरुष’ आधुनिक मानक हिन्दी में सटीक और गरिमापूर्ण है।
- source_word: ἑβδομήκοντα
  choice: सत्तर
  rationale: मूल यूनानी की संख्या का सीधा अनुवाद।
