base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
translation:
  language: hi
  text: इसलिए जितने लोग ऐसा करने का इरादा रखते हैं, वे सब साथ निकल पड़ें, जैसा कि मैंने और मेरे सात मित्रों—जो सलाहकार हैं—ने तय किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मित्र” यहाँ केवल निजी साथियों के लिए नहीं, बल्कि राजदरबार के एक आधिकारिक पद के लिए भी प्रयुक्त हो सकता है। यूनानी वाक्यांश का अनुवाद “जैसा कि मैंने और मेरे सात मित्र-सलाहकारों ने तय किया है” भी किया जा सकता है।
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: ὅσοι οὖν
  choice: इसलिए जो कोई
  rationale: ὅσοι समूह के सभी इच्छुक लोगों को समावेशी रूप से सूचित करता है; οὖν पिछले कथन से निष्कर्ष अथवा आगे की कड़ी जोड़ता है। आधुनिक हिन्दी में यह संयोजन स्वाभाविक है।
- source_word: ἐνθυμοῦνται
  choice: ऐसा करने का विचार रखता है
  rationale: क्रिया मन में विचार रखने, निश्चय करने या इरादा करने का भाव देती है। यह अनुवाद केवल इच्छा बताने के बजाय विचारपूर्वक इरादे की अस्पष्टता बनाए रखता है।
- source_word: συνεξορμάσθωσαν
  choice: साथ चल पड़े
  rationale: आज्ञार्थक क्रिया प्रस्थान करने का अर्थ देती है और σύν- साथ होने का भाव जोड़ता है। 'साथ चल पड़े' आधुनिक हिन्दी में स्वाभाविक रहते हुए दोनों पक्ष सुरक्षित रखता है।
- source_word: καθάπερ δέδοκται
  choice: जैसा ... उचित जान पड़ा है
  rationale: राजकीय या प्रशासनिक प्रयोग में यह वाक्यांश लिए गए निर्णय अथवा उचित समझी गई बात को दर्शा सकता है। 'उचित जान पड़ा' यूनानी के शाब्दिक भाव को रखता है और उसे अनिवार्यतः औपचारिक मतदान-जैसा निर्णय नहीं बनाता।
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: मुझे और मेरे सात मित्रों—जो सलाहकार हैं—को
  rationale: सम्प्रदान कारक उन लोगों को बताता है जिन्हें यह उचित जान पड़ा। φίλοι संभवतः राजदरबार की पदवी है, जबकि συμβουλευταῖς उनकी सलाहकारी भूमिका स्पष्ट करता है; हिन्दी में दोनों को अलग रखते हुए अर्थ सुबोध किया गया है।
