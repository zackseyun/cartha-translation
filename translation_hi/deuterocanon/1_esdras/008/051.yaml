lexical_decisions:
- source_word: ζητῆσαι
  choice: माँगें
  rationale: यह अनंत क्रिया यहाँ परमेश्वर से कुछ माँगने या पाने की प्रार्थना करने का भाव रखती है। आधुनिक हिन्दी में ‘माँगें’ प्रसंग के अनुरूप स्वाभाविक है।
- source_word: παρʼ αὐτοῦ
  choice: उससे
  rationale: παρά के संबंधकारक प्रयोग से उस व्यक्ति का बोध होता है जिससे निवेदन किया जाता है; इसलिए ‘उससे’ स्पष्ट और संक्षिप्त है।
- source_word: εὐοδίαν
  choice: सफल यात्रा
  rationale: यह शब्द मार्ग में अनुकूल प्रगति या यात्रा की सफलता को व्यक्त करता है। ‘सफल यात्रा’ केवल सुरक्षा तक अर्थ सीमित किए बिना मूल यूनानी का व्यापक भाव बनाए रखती है।
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: हमारे लिए, हमारे बच्चों के लिए और हमारे मवेशियों के लिए
  rationale: τέκνα सभी बच्चों को समेटता है, इसलिए ‘बच्चों’ उपयुक्त है। κτήνη पालतू संपत्ति-पशुओं को सूचित करता है, जिसके लिए ‘मवेशियों’ सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: यात्रा के लिए परमेश्वर से माँगी गई कृपा का आशय
  choice: सफल यात्रा
  alternative: सुरक्षित यात्रा; मार्ग में सफलता
  rationale: यूनानी पाठ स्पष्ट रूप से केवल शारीरिक सुरक्षा नहीं कहता, बल्कि यात्रा में अनुकूल और सफल प्रगति का व्यापक भाव देता है। समानांतर इब्रानी प्रसंग में मार्ग के शत्रुओं से सहायता का उल्लेख है, पर उसे मुख्य यूनानी पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। पद एक आश्रित उपवाक्य है, इसलिए आरंभ में ‘कि’ मूल वाक्य-संबंध को बनाए रखता है।
