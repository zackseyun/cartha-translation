    text: यहाँ यूनानी पाठ कठिन है; उसका शाब्दिक पदक्रम लगभग ‘मेरे हृदय में, राजा के’ है। प्रसंग के अनुसार संभावित अर्थ यह है कि परमेश्वर ने ये बातें राजा के हृदय में डालीं।
    reason: textual_variant
lexical_decisions:
- source_word: εὐλογητὸς
  choice: धन्य हैं
  rationale: यह विधेयात्मक विशेषण आशीर्वचन या स्तुतिपरक उद्घोषणा के रूप में प्रयुक्त है; ‘धन्य हैं’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μόνος
  choice: केवल ... ही
  rationale: यह प्रभु की अनन्यता पर बल देता है; हिन्दी की ‘केवल ... ही’ रचना उस बल को स्पष्ट रखती है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος के सामान्य दैवीय संबोधन को प्रचलित और संप्रदाय-निरपेक्ष हिन्दी में ‘प्रभु’ कहा गया है।
- source_word: ὁ δοὺς
  choice: जिन्होंने ... डालीं
  rationale: δίδωμι का εἰς τὴν καρδίαν के साथ शाब्दिक अर्थ ‘हृदय में देना’ है, पर यह भीतर विचार, इच्छा या संकल्प उत्पन्न करने का मुहावरा है; ‘हृदय में डालना’ हिन्दी में उस बिंब को बनाए रखता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक का बहुवचन बनाए रखा गया है और उसका संदर्भ अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: εἰς τὴν καρδίαν
  choice: हृदय में
  rationale: εἰς की दिशात्मकता और भीतर प्रेरणा देने वाले मुहावरे, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μου τοῦ βασιλέως
  choice: राजा के
  rationale: प्रेषित यूनानी पदक्रम व्याकरण की दृष्टि से कठिन है। प्रसंगगत संभावित अर्थ राजा का हृदय है; मुख्य पाठ में यही स्वाभाविक अर्थ दिया गया है, जबकि वास्तविक पाठगत कठिनाई पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: आशीर्वचन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दैवीय उपाधि के रूप में आधुनिक बाइबलीय हिन्दी में स्वाभाविक है और यहाँ कोई अतिरिक्त संप्रदायगत अर्थ नहीं जोड़ता।
- issue: μου τοῦ βασιλέως की कठिन यूनानी रचना
  choice: राजा के हृदय में
  alternative: मेरे हृदय में—राजा के / मेरे स्वामी राजा के हृदय में
  rationale: मुख्य पाठ संभावित प्रसंगगत आशय को पठनीय रूप में देता है, पर कठिन रचना को निश्चित रूप से सुलझा हुआ नहीं मानता; अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
