base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: hi
  text: यह एज्रा बाबेल से ऊपर आया। वह इस्राएल के परमेश्वर द्वारा दी गई मूसा की व्यवस्था में निपुण[a] शास्त्री था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योग्य” अथवा “प्रतिभाशाली”; यूनानी शब्द स्वाभाविक क्षमता, बुद्धिमत्ता या अभ्यास से प्राप्त दक्षता को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: ऊपर आया
  rationale: यरूशलेम अथवा इस्राएल देश की ओर यात्रा के लिए प्रयुक्त पारंपरिक दिशासूचक भाव को बनाए रखता है; यूनानी क्रिया के कथात्मक संदर्भ में ‘आया’ स्वाभाविक है।
- source_word: γραμματεὺς
  choice: शास्त्री
  rationale: यह यहूदी धर्मग्रंथ और व्यवस्था के ज्ञाता तथा प्रतिलिपिकार की स्थापित भूमिका को व्यक्त करता है; ‘सचिव’ अत्यधिक प्रशासनिक अर्थ देता।
- source_word: εὐφυὴς
  choice: निपुण
  rationale: यहाँ शब्द एज्रा की योग्यता, सूझ-बूझ और व्यावहारिक दक्षता को बताता है। ‘निपुण’ आधुनिक हिन्दी में इस व्यापक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: ‘मूसा की व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और स्पष्ट है तथा νόμος के विधि/धर्म-व्यवस्था संबंधी अर्थ को बनाए रखता है।
- source_word: ἐκδεδομένῳ
  choice: दी गई
  rationale: निष्क्रिय कृदंत का सीधा अर्थ देता है और स्पष्ट करता है कि व्यवस्था परमेश्वर की ओर से प्रदान की गई थी।
- source_word: θεοῦ τοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धकारक पदबंध का सीधा और प्रचलित हिन्दी रूप, जो परमेश्वर की पहचान को इस्राएल के साथ जोड़ता है।
theological_decisions:
- issue: एज्रा की योग्यता और मूसा की व्यवस्था के बीच संबंध
  choice: मूसा की व्यवस्था में निपुण शास्त्री
  alternative: मूसा की व्यवस्था का विद्वान शास्त्री
  rationale: यह γραμματεύς के पद, εὐφυής की योग्यता और ἐν के कार्यक्षेत्र—तीनों को बनाए रखता है, पर पाठ से बढ़कर औपचारिक शिक्षा का दावा नहीं करता।
- issue: व्यवस्था का दिव्य स्रोत
  choice: इस्राएल के परमेश्वर द्वारा दी गई
  alternative: जिसे इस्राएल के परमेश्वर ने सौंपा था
  rationale: यह यूनानी निष्क्रिय कृदंत का बल और व्यवस्था के परमेश्वर से प्राप्त होने के धर्मवैचारिक कथन को स्पष्ट रखता है, बिना अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबलीय संदर्भ के अनुकूल भाषा रखी गई है। ‘ऊपर आया’ यात्रा की यूनानी दिशासूचक अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘शास्त्री’ और ‘व्यवस्था’ परिचित धार्मिक-साहित्यिक शब्द हैं।
