base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: hi
  text: ताकि वे यहूदिया और यरूशलेम का निरीक्षण करें[a], प्रभु की उस व्यवस्था के अनुसार जो उसके पास है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘देखरेख करें’ या ‘जाँच-पड़ताल करें’ भी हो सकता है; यूनानी क्रिया आधिकारिक निरीक्षण, दौरे या समीक्षा का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘जो उसके पास है’ है, जिसका संकेत संभवतः एज्रा की ओर है। एज्रा 7 के अरामी समानांतर में ‘जो तुम्हारे हाथ में है’ है, अर्थात जो व्यवस्था तुम्हें सौंपी गई है या तुम्हारे अधिकार में है।
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिन्दी में इसके प्रयोजनार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπισκέψωνται
  choice: निरीक्षण करें
  rationale: राजकीय पत्र के प्रसंग में क्रिया किसी साधारण भेंट से अधिक आधिकारिक जाँच या समीक्षा का बोध कराती है।
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम का
  rationale: दोहराया गया κατά इन स्थानों को निरीक्षण के क्षेत्र या विषय के रूप में प्रस्तुत करता है; हिन्दी में संबंधकारक प्रयोग संक्षिप्त और स्वाभाविक है।
- source_word: ἀκολούθως
  choice: के अनुसार
  rationale: यह अनुरूपता या किसी मानक के पालन को व्यक्त करता है।
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: प्रभु की उस व्यवस्था के अनुसार जो उसके पास है
  rationale: यूनानी पाठ में ἔχει तीसरे पुरुष एकवचन में है, इसलिए ‘उसके पास है’ उसके व्याकरण को सुरक्षित रखता है। वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; अरामी समानांतर का सीधा संबोधन मुख्य पाठ में चुपचाप नहीं अपनाया गया।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यह यहूदी धर्मग्रंथ के प्रसंग में इस्राएल के परमेश्वर के लिए प्रयुक्त κύριος का प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: यहूदी धर्मग्रंथ के प्रसंग में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में सामान्य पद Κυρίου है; ‘प्रभु’ उसी को सीधे व्यक्त करता है और यूनानी से परे जाकर किसी विशिष्ट नामरूप को पाठ में नहीं जोड़ता।
- issue: व्यवस्था किसके पास है
  choice: जो उसके पास है
  alternative: जो तुम्हारे हाथ में है
  rationale: यूनानी ἔχει तीसरे पुरुष एकवचन है, जबकि एज्रा 7 का अरामी समानांतर दूसरे पुरुष में ‘जो तेरे हाथ में है’ कहता है। मुख्य अनुवाद यूनानी के पुरुष को बनाए रखता है और समानांतर पाठ को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘निरीक्षण’ राजकीय-प्रशासनिक प्रसंग को व्यक्त करता है। यूनानी और अरामी समानांतर के पुरुष-भेद को मिटाने के बजाय मुख्य पाठ और पादटिप्पणी में स्पष्ट रखा गया है।
