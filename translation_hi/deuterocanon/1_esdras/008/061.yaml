  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘तेरा’ यूनानी Θερὰ का लिप्यंतरण है। कठिन यूनानी पाठ को अत्यधिक शब्दशः और अस्पष्ट बनाने के बजाय सीमित संदर्भगत स्पष्टता दी गई है, जबकि वैकल्पिक पाठ और व्याकरणिक तनाव पादटिप्पणियों में स्पष्ट किए गए हैं।
