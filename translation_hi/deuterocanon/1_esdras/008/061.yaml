base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: hi
  text: और पहले महीने के बारहवें दिन थेरा नामक स्थान से कूच करके वे यरूशलेम पहुँचे—हम पर हमारे प्रभु का शक्तिशाली हाथ था। उसने हमें हर शत्रु के आने से बचाया[b]; और वे यरूशलेम आए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इस स्थान का यूनानी वाक्यांश कठिन है और लगभग ‘हर शत्रु के प्रवेश/आने से’ पढ़ा जाता है। इब्रानी समानांतर पाठ में ‘मार्ग में शत्रु और घात लगानेवाले के हाथ से’ है।
    reason: textual_variant
  - marker: c
    text: यूनानी पाठ में यरूशलेम पहुँचने की बात दोहराई गई है और ‘हमें’ के बाद कथन फिर ‘वे आए’ में बदल जाता है। इस अनियमितता को मुख्य पाठ में बनाए रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: कूच करके
  rationale: यह क्रिया पड़ाव छोड़कर यात्रा पर निकलने का भाव देती है। ‘कूच करके’ संक्षिप्त, स्वाभाविक और यात्रा-वृत्तांत के अनुकूल है।
- source_word: τοῦ τόπου Θερὰ
  choice: तेरा नामक स्थान
  rationale: मुख्य यूनानी पाठ प्रस्थान-स्थल का नाम Θερὰ देता है। इसलिए इब्रानी समानांतर के ‘अहवा नदी’ को मुख्य पाठ में रखने के बजाय यूनानी नाम का लिप्यंतरण किया गया है।
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: पहले महीने के बारहवें दिन
  rationale: यूनानी के तिथिसूचक वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: हमारे प्रभु का शक्तिशाली हाथ हमारे ऊपर था
  rationale: ‘हाथ’ को परमेश्वर की सामर्थ्य और अनुग्रह के बाइबलीय रूपक के रूप में बनाए रखा गया है; हिन्दी वाक्य-रचना को स्वाभाविक बनाने के लिए संबंध को स्वतंत्र उपवाक्य में व्यक्त किया गया है।
- source_word: ἐρύσατο
  choice: बचाया
  rationale: यह संकट से छुड़ाने या बचाने का सामान्य अर्थ देता है। ‘बचाया’ आधुनिक पाठकों के लिए सहज है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: हर शत्रु के आक्रमण से
  rationale: प्रेषित यूनानी वाक्यांश शब्दशः कठिन और संदर्भ में अनियमित है। εἴσοδος को शत्रु के आने, धावे या प्रवेश के अर्थ में समझते हुए ‘आक्रमण’ चुना गया है; कठिनाई और इब्रानी समानांतर का पाठ पादटिप्पणी में सुरक्षित है।
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: और वे यरूशलेम आए
  rationale: यूनानी में आगमन का कथन दोहराया गया है और अंतिम क्रिया तृतीय पुरुष बहुवचन में है। पाठ की वास्तविक अनियमितता को मिटाने के बजाय दोनों को रखा गया है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος इस्राएल के परमेश्वर के लिए प्रयुक्त है। ‘प्रभु’ प्रतिष्ठित, स्वाभाविक और व्यापक हिन्दी बाइबलीय प्रयोग के अनुरूप है, जबकि ‘स्वामी’ इस संदर्भ में अधिक मानवीय पदवी जैसा सुनाई दे सकता है।
