base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: hi
  text: 'योआब के पुत्रों में से: अबदियास, इएज़ेलुस का पुत्र,[a] और उसके साथ 212 पुरुष।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा 8:12 का इब्रानी समानांतर यहाँ भिन्न पाठ देता है: उसमें एलाम के एक वंशज का नाम और सत्तर पुरुषों की संख्या है। चूँकि 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, इसलिए यहाँ इब्रानी समानांतर से सामंजस्य करने के बजाय यूनानी पाठ का अनुसरण किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: योआब के पुत्रों में से
  rationale: सूची की यूनानी शैली और υἱῶν के औपचारिक अर्थ ‘पुत्रों’ को बनाए रखता है; यहाँ यह वंशजों अथवा कुल के सदस्यों को भी सूचित कर सकता है।
- source_word: Ἀβαδίας
  choice: अबदियास
  rationale: नाम का अनुवाद या इब्रानी रूप से सामंजस्य करने के बजाय यूनानी रूप का देवनागरी लिप्यंतरण किया गया है।
- source_word: Ἰεζήλου
  choice: येज़ेलुस
  rationale: सम्बन्धकारक यूनानी नाम को हिन्दी में ‘येज़ेलुस का’ बनाया गया है और भिन्न इब्रानी समानांतर से सामंजस्य नहीं किया गया।
- source_word: καὶ μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: जनगणना-सदृश सूची में इस पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी ἄνδρες का सामान्य अर्थ ‘पुरुष’ है; इसे इब्रानी समानांतर के अधिक जैविक ‘नर’ के अनुसार नहीं बदला गया।
- source_word: διακόσιοι δέκα δύο
  choice: '212'
  rationale: यूनानी संख्या का स्पष्ट आधुनिक हिन्दी अंक-रूप; इसका मान दो सौ बारह है।
