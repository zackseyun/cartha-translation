base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: hi
  text: 'अस्ताद के वंशजों में से[a]: योआनेस, अकातान का पुत्र[b], और उसके साथ एक सौ दस पुरुष;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा 8:10 का इब्रानी समानांतर पाठ यहाँ उल्लेखनीय रूप से भिन्न है: उसमें परिवार और नामों का क्रम अलग है तथा संख्या एक सौ साठ पुरुष दी गई है। चूँकि प्रथम एस्द्रास का अनुवाद यूनानी साक्षी से किया गया है, इसलिए मुख्य पाठ में यूनानी नाम और संख्या रखे गए हैं।'
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद ‘योआनेस अकातान’ भी हो सकता है। यूनानी में ‘का पुत्र’ स्पष्ट रूप से नहीं लिखा है और दोनों नाम साथ-साथ आते हैं; फिर भी वंशावली-सूची का संदर्भ पितृनाम वाले अर्थ के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ Ἀστάδ
  choice: अस्ताद के वंशजों में से
  rationale: वंशावली-सूची में υἱοὶ किसी कुल के सदस्यों को सूचित करता है। हिन्दी में ‘वंशजों में से’ सूची के आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Ἰωάνης
  choice: योआनेस
  rationale: यूनानी रूप Ἰωάνης का देवनागरी लिप्यंतरण किया गया है, क्योंकि प्रथम एस्द्रास के लिए यूनानी पाठ मुख्य आधार है।
- source_word: Ἀκατάν
  choice: अकातान
  rationale: यूनानी रूप को व्यक्तिनाम मानकर लिप्यंतरित किया गया है। वंशावली-सूची के संदर्भ के आधार पर मुख्य पाठ में निहित पितृनाम-संबंध ‘का पुत्र’ से स्पष्ट किया गया है।
- source_word: μετʼ αὐτοῦ
  choice: और उसके साथ
  rationale: एकवचन αὐτοῦ निकटतम उल्लिखित अगुआ योआनेस की ओर संकेत करता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यह यूनानी ἄνδρες का सीधा और गरिमापूर्ण हिन्दी समतुल्य है; समानांतर इब्रानी पाठ के अधिक जैविक ‘नर’ को मुख्य पाठ पर आरोपित नहीं किया गया।
- source_word: ἑκατὸν δέκα
  choice: एक सौ दस
  rationale: यूनानी संख्या का सीधा आधुनिक हिन्दी रूप।
