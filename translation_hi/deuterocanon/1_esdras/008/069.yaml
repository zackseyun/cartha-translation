base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: hi
  text: और इस्राएल के प्रभु के वचन से जो लोग कभी व्याकुल हुए थे, वे सब मेरे पास इकट्ठे हो गए। मैं उस अधर्म के कारण शोक मना रहा था, और संध्या के बलिदान तक अत्यन्त दुःखी होकर बैठा रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठे हो गए
  rationale: यहाँ क्रिया लोगों के एज्रा के पास एकत्र होने को दर्शाती है; यह सहज हिन्दी है और सामूहिक गति को स्पष्ट रखती है।
- source_word: ἐπεκινοῦντο
  choice: प्रेरित हुए थे
  rationale: क्रिया भीतर से उद्वेलित या प्रतिक्रिया के लिए प्रेरित होने का भाव देती है। ‘प्रेरित’ आधुनिक हिन्दी में इस प्रत्युत्तरकारी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु के वचन से
  rationale: मुख्य पाठ यूनानी की संक्षिप्त और कुछ असामान्य संरचना ‘इस्राएल के प्रभु’ को बिना विस्तार द्वारा निश्चित किए सुरक्षित रखता है।
- source_word: πενθοῦντος
  choice: मैं ... शोक मना रहा था
  rationale: 'समकालिक क्रिया को स्पष्ट करता है: लोगों के एकत्र होने के समय वक्ता शोक में था।'
- source_word: ἀνομίᾳ
  choice: अधर्म
  rationale: यह परमेश्वर की व्यवस्था के उल्लंघन का व्यापक भाव देता है और साधारण आधुनिक हिन्दी में सुबोध तथा गरिमापूर्ण है।
- source_word: ἐκαθήμην περίλυπος
  choice: अत्यन्त दुःखी होकर बैठा रहा
  rationale: बैठे रहने की मुद्रा, उसकी निरंतरता और गहरे शोक—तीनों को स्पष्ट रूप से बनाए रखता है।
- source_word: δειλινῆς θυσίας
  choice: संध्या के बलिदान
  rationale: नियमित संध्याकालीन धार्मिक बलिदान के लिए यह परिचित और स्रोत-संगत पद है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: यूनानी κύριος को सीधे और परंपरागत रूप से ‘प्रभु’ कहा गया है; इससे ऐसे हिब्रू दिव्य नाम को मुख्य पाठ में नहीं जोड़ा जाता जो उपलब्ध यूनानी में प्रत्यक्ष नहीं है।
- issue: Κυρίου τοῦ Ἰσραήλ की व्याख्या
  choice: इस्राएल के प्रभु
  alternative: प्रभु, इस्राएल के परमेश्वर
  rationale: यूनानी पाठ का प्रत्यक्ष रूप ‘इस्राएल के प्रभु’ है। परामर्शी अंग्रेज़ी पाठ ने समानांतर संदर्भ के आधार पर ‘इस्राएल के परमेश्वर’ समझा है, किंतु प्रस्तुत हिब्रू समानांतर इस वाक्यांश का सीधा पाठ-साक्षी नहीं है; इसलिए मूल की वास्तविक असामान्यता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है। यूनानी के अस्पष्ट/संक्षिप्त दिव्य शीर्षक को चुपचाप विस्तृत नहीं किया गया।
