base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: hi
  text: तब फ़ारसियों के राजा कुस्रू ने उन्हें[a] बाहर निकाला और अपने कोषाध्यक्ष[b] मिथ्रिदातेस को सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पिछले पद में बताए गए मन्दिर के पात्र।
    reason: cross_reference
  - marker: b
    text: या ‘उसके राजकोष का रखवाला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: बाहर निकाला
  rationale: यह क्रिया किसी वस्तु को बाहर लाने या निकालने का भाव देती है। यह यूनानी के साथ-साथ समानांतर इब्रानी הוֹצִיא के अनुरूप भी है।
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: फ़ारसियों के राजा कुस्रू
  rationale: यह यूनानी के बहुवचन जातिवाचक Περσῶν को स्पष्ट रूप से व्यक्त करता है और नाम Κῦρος के लिए हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘कुस्रू’ रखता है।
- source_word: παρέδωκεν
  choice: सौंप दिया
  rationale: यह किसी वस्तु को औपचारिक रूप से दूसरे व्यक्ति की देखरेख या अधिकार में देने का भाव सुरक्षित रखता है।
- source_word: Μιθριδάτῃ
  choice: मिथ्रिदातेस
  rationale: यह यूनानी नाम का देवनागरी लिप्यंतरण है; नाम का अनुवाद नहीं किया गया है।
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: अपने कोषाध्यक्ष
  rationale: γαζοφύλαξ राजकोष की देखरेख करने वाले अधिकारी को दर्शाता है, और ἑαυτοῦ स्पष्ट करता है कि वह कुस्रू का अपना अधिकारी था।
- source_word: αὐτά
  choice: उन्हें
  rationale: सर्वनाम पिछले पद में उल्लिखित मन्दिर के पात्रों की ओर संकेत करता है। मूल पद की सर्वनामात्मक अभिव्यक्ति बनाए रखने के लिए ‘उन्हें’ रखा गया है।
