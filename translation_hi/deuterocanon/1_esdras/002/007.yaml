base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: hi
  text: तब यहूदा और बिन्यामीन के गोत्रों के पितृकुलों के मुखिया, याजक और लेवीय, और वे सभी लोग उठ खड़े हुए जिनकी आत्मा को प्रभु ने यरूशलेम जाकर वहाँ स्थित प्रभु का भवन बनाने के लिए प्रेरित किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 1:5 के इब्रानी समानांतर पाठ में है, “वे सभी लोग जिनकी आत्मा को परमेश्वर ने प्रेरित किया था।” यहाँ 1 एस्द्रास के यूनानी पाठ में “प्रभु” है।
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες / ויקומו
  choice: उठ खड़े हुए
  rationale: संचरित यूनानी रूप प्रसंग में कठिन है, जबकि समानांतर इब्रानी पाठ स्पष्टतः ‘उठे’ कहता है। आगामी गति और उद्देश्यसूचक क्रियाओं के साथ ‘उठ खड़े हुए’ स्वाभाविक अर्थ देता है।
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν / ראשי האבות
  choice: पितृकुलों के मुखिया
  rationale: यह पद विस्तृत वंशगत पारिवारिक इकाइयों के अगुओं को दर्शाता है। ‘पितृकुल’ किन्तु आधुनिक हिन्दी में समझ आने योग्य पारंपरिक सामाजिक संरचना को बनाए रखता है।
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: यहूदा और बिन्यामीन के गोत्रों के
  rationale: यूनानी पदबंध संक्षिप्त है, पर φυλῆς को व्यक्त करना और दोनों नामों के कारण बहुवचन ‘गोत्रों’ रखना आशय को स्पष्ट करता है।
- source_word: ἤγειρεν ... τὸ πνεῦμα
  choice: जिनकी आत्मा को ... प्रेरित किया था
  rationale: मूल रूपक में भीतर से जगाने या सक्रिय करने का भाव है। आधुनिक हिन्दी में ‘आत्मा को प्रेरित किया’ दैवी आंतरिक प्रवर्तन को स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: मुख्य यूनानी साक्ष्य Κύριος पढ़ता है; इसलिए समानांतर इब्रानी के ‘परमेश्वर’ के बजाय मुख्य पाठ में ‘प्रभु’ रखा गया है।
- source_word: ἀναβῆναι
  choice: यरूशलेम जाकर
  rationale: शाब्दिक अर्थ ‘ऊपर जाना’ है और यह यरूशलेम की यात्रा का पारंपरिक मुहावरा है। आधुनिक सामान्य हिन्दी में केवल ‘ऊपर जाना’ स्थानिक भ्रम पैदा कर सकता है, इसलिए गंतव्य के साथ ‘जाकर’ अर्थ को स्वाभाविक रखता है।
- source_word: οἰκοδομῆσαι οἶκον
  choice: भवन बनाने
  rationale: यूनानी में पुनर्निर्माण का स्पष्ट उपसर्ग नहीं है, इसलिए ‘फिर से बनाने’ के बजाय ‘बनाने’ रखा गया है। पवित्र भवन के लिए ‘भवन’ गरिमापूर्ण और स्पष्ट है।
- source_word: τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: वहाँ स्थित प्रभु का भवन
  rationale: यह अभिव्यक्ति भवन का प्रभु से संबंध और यरूशलेम में उसका स्थान दोनों बताती है। ‘वहाँ स्थित’ हिन्दी में अनावश्यक पुनरावृत्ति के बिना स्थानसूचक उपवाक्य को सुरक्षित रखता है।
theological_decisions:
- issue: इस उपवाक्य में दैवी संबोधन यूनानी मुख्य साक्ष्य और मसोराई समानांतर पाठ में भिन्न है
  choice: प्रभु ने ... प्रेरित किया था
  alternative: परमेश्वर ने ... प्रेरित किया था
  rationale: 1 एस्द्रास के लिए मुख्य स्रोत यूनानी है, जिसमें Κύριος है। एज्रा 1:5 का इब्रानी समानांतर ‘परमेश्वर’ पढ़ता है; इस भिन्नता को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘पितृकुल’, ‘गोत्र’, ‘याजक’ और ‘लेवी’ जैसे बाइबलीय सामाजिक-धार्मिक पद बनाए गए हैं। यूनानी की कठिन आरंभिक क्रिया को इब्रानी समानांतर की सहायता से ‘उठ खड़े हुए’ किया गया है, और पाठांतर को पादटिप्पणी में स्पष्ट रखा गया है।
