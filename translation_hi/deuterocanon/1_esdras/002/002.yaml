base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: hi
  text: 'प्रभु ने फ़ारसियों के राजा कुस्रू की आत्मा को उभारा, और उसने अपने सारे राज्य में घोषणा की और साथ ही उसे लिखित रूप में भी जारी किया, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγειρεν
  choice: उभारा
  rationale: यहाँ क्रिया कुस्रू की भीतरी प्रेरणा या प्रवृत्ति को सक्रिय करने का भाव देती है। ‘उभारा’ आधुनिक हिन्दी में दैवी प्रेरणा और सक्रिय पहल दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी पाठ में Κύριος है। प्रसंग में यह इस्राएल के परमेश्वर को सूचित करता है, पर अनुवाद यूनानी रूप का अनुसरण करते हुए ‘प्रभु’ रखता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: मूल में कोई स्पष्ट संबंधवाचक सर्वनाम नहीं है, किंतु प्रसंग से यह कुस्रू की आत्मा अर्थात उसकी भीतरी प्रवृत्ति है। ‘मन’ कहना मूल की मानव-स्वरूप संबंधी व्यापकता को घटा देता।
- source_word: Κύρου
  choice: कुस्रू
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप है और इब्रानी כּוֹרֶשׁ के भी अनुरूप है।
- source_word: βασιλέως Περσῶν
  choice: फ़ारसियों के राजा
  rationale: यूनानी में Περσῶν बहुवचन है, इसलिए इसे ‘फ़ारस के राजा’ बनाकर इब्रानी समानांतर से समरूप नहीं किया गया।
- source_word: ἐκήρυξεν
  choice: घोषणा करवाई
  rationale: क्रिया सार्वजनिक रूप से घोषणा प्रसारित कराने का भाव देती है। राजकीय संदर्भ में ‘घोषणा करवाई’ स्वाभाविक है और राजा की ओर से उसके राज्य भर में मुनादी या उद्घोषणा होने का संकेत देती है।
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: अपने पूरे राज्य में
  rationale: यह राज्य के संपूर्ण विस्तार में घोषणा पहुँचने का वितरणात्मक अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: ἅμα διὰ γραπτῶν
  choice: उसे लिखित रूप में भी जारी किया
  rationale: ἅμα का योगात्मक भाव ‘भी’ से और διὰ γραπτῶν का लिखित माध्यम ‘लिखित रूप में’ से व्यक्त हुआ है। ‘जारी किया’ राजकीय आदेश के प्रसार को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: λέγων
  choice: उसमें कहा गया था,
  rationale: यह आगे आने वाली राजाज्ञा की विषयवस्तु का परिचय देता है। हिन्दी में वाक्य को अगले पद के लिए खुला रखते हुए यह रूप अधिक सहज है।
theological_decisions:
- issue: कुस्रू की राजाज्ञा में दैवी सक्रियता
  choice: प्रभु ने कुस्रू की आत्मा को सक्रिय रूप से उभारा
  alternative: प्रभु ने केवल कुस्रू को कार्य करने दिया, अथवा कुस्रू केवल राजनीतिक कारणों से प्रेरित था
  rationale: यूनानी पाठ दैवी सक्रियता को सीधे व्यक्त करता है। अनुवाद इसे केवल अनुमति या राजनीतिक प्रेरणा बनाकर नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कुस्रू’ प्रचलित हिन्दी बाइबलीय नाम-रूप है। फ़ारसी शब्द में नुक्ते का प्रयोग मानक आधुनिक वर्तनी के अनुसार किया गया है।
