revisions:
- from: तब प्रभु ने फ़ारसियों के राजा कुस्रू की आत्मा को उभारा[a], और उसने अपने पूरे राज्य में घोषणा करवाई और उसे लिखित रूप में भी जारी किया। उसमें कहा गया था,
  to: 'प्रभु ने फ़ारसियों के राजा कुस्रू की आत्मा को उभारा, और उसने अपने सारे राज्य में घोषणा की और साथ ही उसे लिखित रूप में भी जारी किया, यह कहते हुए:'
  rationale: Revisions remove an unsupported temporal addition, restore Cyrus as the direct subject of the proclamation, and render the final participle as an active introduction to the words in the following verse. The Greek plural “Persians” remains represented, with its textual distinction documented in the footnote.
  reviewer_model: gpt-5.6-terra
