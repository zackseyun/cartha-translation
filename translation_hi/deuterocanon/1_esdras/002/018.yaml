  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नगर’ और ‘दीवारें’ औपचारिक लेकिन सहज हैं। प्रबल निषेध को ‘निश्चय ही’ से तथा ὑπομένω की अर्थगत कठोरता को ‘सहन नहीं करेंगे’ से सुरक्षित रखा गया है; अधिक प्रवाहपूर्ण वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
