  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: hi
  text: इसलिए यदि इस नगर को फिर से बनाया जाए और इसकी दीवारें पूरी कर दी जाएँ, तो वे निश्चय ही कर चुकाना सहन नहीं करेंगे[a], बल्कि राजाओं का विरोध भी करेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे निश्चय ही कर चुकाते नहीं रहेंगे।” यूनानी का शाब्दिक भाव है कि वे कर चुकाना ‘सहन नहीं करेंगे’; इससे केवल असमर्थता नहीं, बल्कि साम्राज्य के कर के अधीन बने रहने से इनकार भी व्यक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के लिए यूनानी पाठ को मुख्य आधार बनाया गया है। यहाँ उसकी शब्दावली उपलब्ध मसोरेटी समानांतर सामग्री से निकट मेल नहीं खाती; इसलिए अनुवाद सीधे यूनानी का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए यदि
  rationale: οὖν पिछले आरोप से निकला निष्कर्ष सूचित करता है; ‘इसलिए यदि’ तर्क और शर्त दोनों को बनाए रखता है।
- source_word: ἡ πόλις αὕτη
  choice: इस नगर को
  rationale: यूनानी निकटवाची संकेतवाचक का स्वाभाविक हिन्दी रूप ‘इस’ है; कर्मवाच्य वाक्य में ‘नगर को’ सहज है।
- source_word: οἰκοδομηθῇ
  choice: फिर से बनाया जाए
  rationale: क्रिया का मूल अर्थ ‘बनाया जाए’ है, जबकि यरूशलेम की पुनर्स्थापना का प्रसंग पुनर्निर्माण का भाव स्पष्ट करता है।
- source_word: τὰ τείχη συντελεσθῇ
  choice: इसकी दीवारें पूरी कर दी जाएँ
  rationale: συντελέω काम को पूर्ण करने का भाव देता है। ‘इसकी’ से दीवारों का नगर से संबंध हिन्दी में स्पष्ट और स्वाभाविक होता है।
- source_word: φορολογίαν
  choice: कर
  rationale: यह साम्राज्य को दिए जाने वाले कर या खिराज को सूचित करता है। ‘कर’ आधुनिक हिन्दी में व्यापक रूप से समझा जाता है; राजनीतिक संदर्भ उसके राजकीय स्वरूप को स्पष्ट करता है।
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: वे निश्चय ही कर देना सहन नहीं करेंगे
  rationale: οὐ μή प्रबल निषेध है और ὑπομένω में किसी बोझ को सहते या उसके अधीन बने रहने का भाव है। यह रूप यूनानी की तीव्रता और तनाव को रखता है, यद्यपि हिन्दी में ‘देते नहीं रहेंगे’ एक अधिक प्रवाहपूर्ण संभावित अर्थ है।
- source_word: ἀλλὰ καὶ
  choice: बल्कि … भी
  rationale: यह कर न देने से आगे बढ़कर एक अधिक गंभीर आरोप जोड़ता है; ‘बल्कि … भी’ इस आरोही बल को व्यक्त करता है।
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: राजाओं का विरोध भी करेंगे
  rationale: ἀνθίστημι का अर्थ सामने खड़ा होना, प्रतिरोध करना या विरोध करना है। बहुवचन ‘राजाओं’ को स्रोत के अनुसार रखा गया है।
