base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: hi
  text: और उसके लोग उसमें विद्रोह और युद्ध करते थे[a]; और यरूशलेम में शक्तिशाली और कठोर राजा थे, जो शासन करते और कोइले-सीरिया तथा फ़ीनीके से कर वसूल करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 4:20 के सामी समानांतर पाठ में यरूशलेम को एक विद्रोही नगर बताया गया है, जिसने राजाओं और प्रान्तों को हानि पहुँचाई थी और जिसमें प्राचीन काल से विद्रोह होता आया था। 1 एस्द्रास यहाँ वर्णन को बढ़ाकर “विद्रोह और युद्ध” तथा कोइले-सीरिया और फ़ीनीके से कर-वसूली का उल्लेख करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάσεις
  choice: विद्रोह
  rationale: यह राजनीतिक सत्ता के विरुद्ध बगावतों को सूचित करता है। हिन्दी में सामूहिक अर्थ वाला ‘विद्रोह’ यूनानी बहुवचन का स्वाभाविक रूप से प्रतिनिधित्व करता है।
- source_word: πολέμους
  choice: युद्ध
  rationale: यह यूनानी शब्द का सीधा और व्यापक अर्थ रखता है तथा इसे केवल अलग-अलग लड़ाइयों तक सीमित नहीं करता।
- source_word: συντελοῦντες
  choice: करते रहे थे
  rationale: कृदन्त यहाँ विद्रोह और युद्ध को सक्रिय रूप से करने या अंजाम देने का भाव रखता है; ‘करते रहे थे’ प्रसंग में स्वाभाविक है और सतत गतिविधि दर्शाता है।
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: शक्तिशाली और कठोर
  rationale: दोनों विशेषणों को अलग रखते हुए राजाओं की सामर्थ्य और कठोरता व्यक्त होती है।
- source_word: κυριεύοντες
  choice: शासन करते
  rationale: राजनीतिक प्रभुत्व चलाने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φορολογοῦντες
  choice: कर वसूल करते
  rationale: यह लगाए गए कर या राजस्व की वसूली का अर्थ स्पष्ट करता है। ‘नज़राना’ की अपेक्षा ‘कर’ सामान्य पाठक के लिए अधिक सहज है, जबकि बलपूर्वक राजकीय वसूली का भाव ‘वसूल’ में बना रहता है।
- source_word: κοίλην Συρίαν
  choice: कोइले-सीरिया
  rationale: यह हेलेनिस्टिक काल का भौगोलिक नाम है, इसलिए इसका अर्थानुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: Φοινίκην
  choice: फ़ीनीके
  rationale: यूनानी भौगोलिक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: ἐν αὐτῇ
  choice: उसमें
  rationale: यह पहले उल्लिखित नगर, अर्थात यरूशलेम, की ओर संकेत करता है और नगर के भीतर हुई गतिविधि को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: एज्रा 4:20 के सामी समानांतर पाठ से यूनानी विवरण का संबंध
  choice: मुख्य पाठ में यूनानी का विस्तृत वर्णन—विद्रोह, युद्ध, और कोइले-सीरिया तथा फ़ीनीके से कर-वसूली—ज्यों का त्यों रखा गया है।
  alternative: सामी समानांतर के अधिक निकट पाठ में यरूशलेम को विद्रोही नगर, राजाओं और प्रान्तों को हानि पहुँचाने वाला, तथा प्राचीन काल से विद्रोह का स्थान बताया जाता है।
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है। समानांतर सामी पाठ उपयोगी तुलनात्मक साक्ष्य है, पर यहाँ यूनानी पाठ के विस्तार और पुनर्रचना को उसके अनुसार संक्षिप्त नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की दो समन्वित धाराओं को अर्धविराम से अलग किया गया है। ‘कोइले-सीरिया’ ऐतिहासिक भौगोलिक नाम के रूप में लिप्यंतरित है; अस्पष्टता दूर करने के लिए उसका शाब्दिक अनुवाद नहीं किया गया।
