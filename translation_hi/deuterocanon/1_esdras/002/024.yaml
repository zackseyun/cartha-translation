base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: hi
  text: इसलिए अब मैंने आज्ञा दी है कि उन लोगों को नगर बनाने से रोका जाए,[a] और ध्यान रखा जाए कि इसके आगे कुछ न किया जाए,[b] और यह हानिकारक मामला और न बढ़े, जिससे राजाओं को परेशानी हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में इसका अर्थ ‘नगर का पुनर्निर्माण करने से’ हो सकता है, लेकिन यूनानी पाठ में केवल ‘नगर बनाने’ का शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या, “कि इसके विरुद्ध कुछ न किया जाए।” यूनानी वाक्यांश का अर्थ आदेश की सीमा से आगे जाना या उसके विरुद्ध काम करना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “राजाओं को हानि न पहुँचाए” अथवा “राजाओं को परेशान न करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξα
  choice: मैंने आज्ञा दी है
  rationale: राजकीय पत्र की शैली में पूर्ण हो चुकी और वर्तमान में प्रभावी आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκωλῦσαι
  choice: रोका जाए
  rationale: आज्ञा की विषयवस्तु यह है कि निर्माण-कार्य करने वालों को आगे बढ़ने से रोका जाए।
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: उन लोगों
  rationale: विशिष्ट व्यक्तियों की ओर संकेत बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: नगर बनाने से
  rationale: यूनानी पाठ में साधारणतः ‘नगर बनाना’ है; प्रसंग में पुनर्निर्माण संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: προνοηθῆναι
  choice: सावधानी रखी जाए
  rationale: प्रशासनिक निगरानी और एहतियाती व्यवस्था, दोनों का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: कि इसके आगे कुछ न किया जाए
  rationale: παρὰ ταῦτα की ‘इसके आगे/इसके विरुद्ध’ वास्तविक अस्पष्टता में मुख्य पाठ प्रसंगानुकूल पहले अर्थ को रखता है और दूसरे को पादटिप्पणी में सुरक्षित करता है।
- source_word: τὰ τῆς κακίας
  choice: यह बुराई
  rationale: हानिकारक गतिविधि या मामले को संक्षेप और सहज रूप से व्यक्त करता है; हिन्दी में संदर्भगत ‘यह’ आवश्यक स्पष्टता देता है, यद्यपि यूनानी में प्रत्यक्ष संकेतवाचक नहीं है।
- source_word: προβῇ ἐπὶ πλεῖον
  choice: आगे बढ़कर
  rationale: हानिकारक स्थिति के और अधिक बढ़ने या प्रगति करने का भाव बनाए रखता है।
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: राजाओं के लिए परेशानी का कारण न बने
  rationale: ἐνοχλέω के ‘परेशान करना/बाधा पहुँचाना’ अर्थ को बिना अनावश्यक व्याख्यात्मक विस्तार के व्यक्त करता है।
