base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: hi
  text: अतः अलग-अलग स्थानों में रहनेवाले हर व्यक्ति की सहायता उसके स्थान के लोग सोने और चाँदी, भेंटों, घोड़ों और पशुधन[a], तथा यरूशलेम में प्रभु के मन्दिर[b] के लिए मन्नतों के रूप में अतिरिक्त दी गई अन्य वस्तुओं से करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘घोड़ों और पशुधन’ है। एज्रा 1:4, 6 के समानांतर इब्रानी पाठ में इसके स्थान पर माल-सामान/सम्पत्ति और पशुओं से सम्बन्धित शब्द आते हैं। मुख्य पाठ 1 एस्द्रास के यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
  - marker: b
    text: या ‘पवित्रस्थान’। यूनानी ἱερόν का अर्थ ‘मन्दिर’ अथवा ‘पवित्रस्थान’ हो सकता है; समानांतर इब्रानी पाठ में ‘यहोवा का भवन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: अतः अलग-अलग स्थानों में रहनेवाले हर ऐसे व्यक्ति
  rationale: οὖν का निष्कर्षसूचक भाव ‘अतः’ से और ὅσοι का अनिश्चित तथा व्यापक भाव ‘हर ऐसे व्यक्ति’ से व्यक्त किया गया है। κατὰ τοὺς τόπους का वितरणात्मक बहुवचन ‘अलग-अलग स्थानों में’ से स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: उसकी सहायता उसके स्थान के लोग ... करें
  rationale: आज्ञार्थक βοηθείτωσαν को ‘सहायता ... करें’ और एकवचन αὐτῷ को ‘उसकी’ से रखा गया है। ‘उसके स्थान के लोग’ स्थानीय निवासियों को सूचित करता है और यूनानी वाक्य का सम्बन्ध स्पष्ट करता है।
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: सोने और चाँदी, भेंटों ... से
  rationale: ἐν यहाँ साधन का बोध कराता है, इसलिए हिन्दी में ‘से’ लगाया गया है। δόσεις के व्यापक अर्थ के लिए ‘भेंटें’ चुना गया है, ताकि उसे आगे आनेवाली मन्नत की वस्तुओं के समान कोई विशिष्ट धार्मिक चढ़ावा न माना जाए।
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: घोड़ों और पशुधन
  rationale: ἵππων का सीधा अर्थ ‘घोड़े’ है और κτηνῶν पालतू पशुओं के सामूहिक वर्ग को दर्शाता है, इसलिए ‘पशुधन’ उपयुक्त है। यूनानी पाठ को प्राथमिक मानते हुए ‘घोड़ों’ को सुरक्षित रखा गया है।
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: इनके साथ ... मन्नत के अनुसार चढ़ाई गई अन्य वस्तुएँ भी
  rationale: σύν और προστεθειμένοις दोनों में साथ जोड़े जाने का भाव है; ‘इनके साथ’ और ‘भी’ इसे स्वाभाविक हिन्दी में व्यक्त करते हैं। κατʼ εὐχὰς को ‘मन्नत के अनुसार’ कहा गया है, जो मन्नत मानकर दी गई वस्तुओं का भाव रखता है।
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: यरूशलेम में प्रभु के मन्दिर के लिए
  rationale: εἰς उद्देश्य को ‘के लिए’ से व्यक्त करता है। ἱερόν के इस यरूशलेम-सन्दर्भ में ‘मन्दिर’ स्पष्ट और सटीक है; κυρίου को यूनानी स्रोत के अनुसार ‘प्रभु’ कहा गया है।
theological_decisions:
- issue: इस्राएल के परमेश्वर के लिए κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κυρίου है, न कि इब्रानी चतुरक्षरीय नाम; इसलिए स्रोत-रूप का अनुसरण करते हुए ‘प्रभु’ रखा गया है।
- issue: ἱερόν का धार्मिक स्थल-सूचक अनुवाद
  choice: मन्दिर
  alternative: पवित्रस्थान
  rationale: यरूशलेम और निर्माण/सहायता के प्रसंग में ἱερόν पूरे मन्दिर को सूचित कर सकता है। ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पवित्रस्थान’ उसका सम्भव वैकल्पिक अर्थ है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। लम्बे यूनानी वाक्य को अर्थ-संबन्ध बनाए रखते हुए दो हिन्दी वाक्यों में बाँटा गया है। ‘मन्नत’, ‘भेंट’ और ‘मन्दिर’ सामान्य धार्मिक शब्दावली हैं; किसी विशेष सम्प्रदाय की पारिभाषिक भाषा नहीं अपनाई गई।
