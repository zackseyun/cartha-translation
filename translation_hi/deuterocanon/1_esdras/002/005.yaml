  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘इस्राएल,’ ‘यरूशलेम,’ ‘यहूदिया,’ ‘प्रभु’ और ‘भवन’ जैसी परिचित बाइबलीय शब्दावली रखी गई है। यूनानी पाठ का असामान्य एकवचन-बहुवचन परिवर्तन जानबूझकर नहीं सँवारा गया।
