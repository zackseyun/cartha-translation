base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: hi
  text: इसलिए[a], यदि तुममें से कोई उसकी प्रजा में से हो, तो उसका प्रभु उसके साथ रहे; वह यहूदिया में स्थित यरूशलेम को जाए, और वे इस्राएल के प्रभु का भवन बनाएँ।[b] वही प्रभु है जिसने यरूशलेम में अपना निवास स्थापित किया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य पहले एकवचन में है—“यदि ... कोई,” “उसका प्रभु ... उसके साथ,” और यरूशलेम जाने वाला रूप भी एकवचन है—लेकिन भवन बनाने की आज्ञा अचानक बहुवचन में हो जाती है—“वे ... बनाएँ।” अनुवाद ने इस वचन-परिवर्तन को ज्यों का त्यों रखा है।
    reason: textual_variant
  - marker: b
    text: 'एज्रा के इब्रानी समानांतर पाठ में यहाँ उल्लेखनीय रूप से अलग बात है: जो लोग लौटने वाले व्यक्ति के आसपास रहते हैं, वे चाँदी, सोना, सामान और पशु देकर उसकी सहायता करें और यरूशलेम में परमेश्वर के भवन के लिए स्वेच्छा-भेंट भी दें। 1 एस्द्रास यहाँ परंपरा के एक भिन्न यूनानी रूप का अनुसरण करता है।'
    reason: alternative_reading
  - marker: c
    text: या, “वही प्रभु है जो यरूशलेम में निवास करता है।” यूनानी क्रिया में डेरा डालने या अपना निवास स्थापित करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν
  choice: इसलिए, यदि तुममें से कोई ... हो
  rationale: οὖν के निष्कर्षसूचक भाव को ‘इसलिए’ से व्यक्त किया गया है, जबकि शेष वाक्यांश को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ἐκ τοῦ ἔθνους αὐτοῦ
  choice: उसकी प्रजा का
  rationale: ἔθνος यहाँ आधुनिक राजनीतिक ‘राष्ट्र’ से अधिक एक जातीय-धार्मिक जनसमुदाय को सूचित करता है; ‘प्रजा’ प्रसंगानुकूल और सहज है।
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: उसका प्रभु उसके साथ रहे
  rationale: ἔστω के इच्छासूचक/आज्ञार्थक बल को ‘रहे’ से व्यक्त किया गया है। यूनानी में ‘परमेश्वर’ शब्द नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: वह यहूदिया में स्थित यरूशलेम को जाए
  rationale: यरूशलेम की ओर जाने के लिए ἀναβαίνω का आरोहण-भाव हिन्दी में अनावश्यक कृत्रिमता से बचाते हुए ‘जाए’ में व्यक्त किया गया; स्थान-संबंध स्पष्ट रखने के लिए ‘यहूदिया में स्थित’ कहा गया।
- source_word: οἰκοδομείτωσαν
  choice: वे ... भवन बनाएँ
  rationale: प्राप्त यूनानी पाठ में पहले आए एकवचन रूपों के बाद यह क्रिया बहुवचन है। इस असामान्य वचन-परिवर्तन को सुधारकर एकवचन नहीं किया गया।
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु का भवन
  rationale: यूनानी में θεός नहीं है; इसलिए परिचित समानांतर पाठ के अनुसार ‘इस्राएल के परमेश्वर यहोवा का भवन’ जैसा विस्तार नहीं किया गया।
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: वही प्रभु है जिसने यरूशलेम में अपना निवास बनाया है
  rationale: κατασκηνόω के बसने या निवास स्थापित करने के भाव और यूनानी कृदंत के पूर्वकालिक पक्ष, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κύριος है। ‘प्रभु’ इस ईश्वरीय संदर्भ में तटस्थ और प्रचलित है; ‘यहोवा’ जोड़ना इब्रानी रूप का आयात होता।
- issue: अंतिम खंड को एज्रा के इब्रानी समानांतर के अनुरूप बनाना
  choice: वही प्रभु है जिसने यरूशलेम में अपना निवास बनाया है
  alternative: वही परमेश्वर है जो यरूशलेम में है
  rationale: 1 एस्द्रास के यूनानी पाठ में प्रभु के यरूशलेम में निवास बनाने का स्पष्ट कथन है। स्रोत-पारदर्शिता के लिए इसे परिचित इब्रानी/एज्रा शब्दावली से समरूप नहीं किया गया।
- issue: एकवचन से बहुवचन में असामान्य परिवर्तन
  choice: वह ... जाए, और वे ... बनाएँ
  alternative: वह ... जाए और ... बनाए
  rationale: यूनानी पाठ में ἀναβὰς एकवचन है, पर οἰκοδομείτωσαν बहुवचन। अर्थगत कठिनाई के बावजूद वास्तविक पाठगत तनाव को सुरक्षित रखा गया है।
