base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: hi
  text: इसलिए अब, हे प्रभु महाराज, हम आपको यह बताते हैं कि यदि यह नगर बनाया जाए और इसकी नगर-दीवारें खड़ी की जाएँ, तो कोएले-सीरिया और फोनीकिया तक जाने का मार्ग आपके लिए फिर नहीं रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मार्ग” का अनुवाद “पहुँच” या “वहाँ तक जाने का रास्ता” भी हो सकता है। यूनानी में शाब्दिक रूप से है, “कोएले-सीरिया और फोनीकिया में तुम्हारे लिए फिर कोई निकास नहीं रहेगा”; यहाँ आशय आवागमन के मार्ग या राजकीय पहुँच के समाप्त हो जाने से हो सकता है। “कोएले-सीरिया” उस क्षेत्र का प्राचीन भौगोलिक नाम है।
    reason: ἔξοδος की संदर्भगत अर्थ-व्याप्ति तथा κοίλη Συρία को स्थापित भौगोलिक नाम के रूप में स्पष्ट करना।
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: हम आपको यह बताते हैं
  rationale: औपचारिक राजकीय सूचना के प्रसंग में यह स्वाभाविक हिन्दी है और यूनानी क्रिया के ‘अवगत कराना/बताना’ भाव को व्यक्त करती है।
- source_word: κύριε βασιλεῦ
  choice: हे प्रभु राजा
  rationale: सम्बोधन में ‘प्रभु’ और ‘राजा’ दोनों को बनाए रखता है; यूनानी में ‘मेरे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: οἰκοδομηθῇ
  choice: बनाया गया
  rationale: यूनानी में पुनर्निर्माण का उपसर्ग स्पष्ट नहीं है; इसलिए प्रसंगानुकूल सम्भव ‘फिर बनाया गया’ के बजाय सरल ‘बनाया गया’ रखा गया।
- source_word: τὰ ταύτης τείχη
  choice: इसकी शहरपनाह
  rationale: नगर की किलेबन्द बाहरी दीवारों के लिए ‘शहरपनाह’ सटीक और संक्षिप्त हिन्दी शब्द है।
- source_word: ἀνασταθῇ
  choice: खड़ी की गई
  rationale: दीवारों को उठाने या खड़ा करने की निर्माण-छवि को बनाए रखता है, बिना ‘फिर बनाई गई’ अर्थ जोड़े।
- source_word: ἔξοδός
  choice: तक जाने का मार्ग
  rationale: यहाँ शाब्दिक ‘निकास’ अस्वाभाविक होगा; प्रसंग में राजा की आवागमन-सुविधा, पहुँच या साम्राज्यिक मार्ग खोने की चेतावनी है।
- source_word: κοίλην Συρίαν
  choice: खोखला सीरिया
  rationale: भौगोलिक नाम का अर्थ-सम्मत हिन्दी रूप दिया गया है; इसकी पहचान स्पष्ट करने के लिए पादटिप्पणी जोड़ी गई है।
- source_word: Φοινίκην
  choice: फीनीके
  rationale: यूनानी क्षेत्रीय नाम का निकट देवनागरी लिप्यन्तरण।
