  register: भाषा आधुनिक मानक हिन्दी में औपचारिक राजकीय निवेदन के स्वर के साथ रखी गई है। ‘ज्ञात हो’ पत्र की प्रशासनिक गरिमा बनाए रखता है; शेष वाक्य सामान्य पाठक के लिए सीधे और सुबोध हैं। विरामचिह्नों द्वारा लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर उसका तर्कक्रम सुरक्षित है।
