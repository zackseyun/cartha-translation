base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: hi
  text: अब मेरे स्वामी राजा को यह ज्ञात हो कि जो यहूदी[a] आपके यहाँ से हमारे यहाँ आए हैं, वे यरूशलेम पहुँचकर उस विद्रोही और दुष्ट नगर में बस रहे हैं। वे उसके बाज़ारों[b] और दीवारों की मरम्मत कर रहे हैं और मंदिर की नींव डाल रहे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ इस प्रसंग में ‘यहूदिया के लोग’ भी हो सकता है और अधिक व्यापक रूप से ‘यहूदी’ भी।
    reason: lexical_alternative
  - marker: b
    text: या ‘सार्वजनिक चौकों’। कुछ समानांतर पाठ-परम्पराएँ विशेष रूप से बाज़ारों के बजाय नगर के मार्गों अथवा उसके पुनर्निर्माण पर बल देती हैं।
    reason: alternative_reading
  - marker: c
    text: या ‘मंदिर बनाने का काम हाथ में ले रहे हैं’। यूनानी वाक्यांश संक्षिप्त है और संभवतः मंदिर का निर्माण आरम्भ करने, विशेषकर उसकी अधोरचना या नींव रखने, की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: यह ज्ञात हो
  rationale: यह राजकीय पत्राचार की औपचारिक सूचना-सूचक अभिव्यक्ति है और यूनानी विधि को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखती है।
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: मेरे स्वामी राजा को
  rationale: κύριος यहाँ परमेश्वर के लिए उपाधि नहीं, बल्कि मनुष्य राजा के प्रति दरबारी सम्मानसूचक संबोधन है। हिन्दी में ‘मेरे स्वामी राजा’ इस आशय और औपचारिक स्वर को स्पष्ट करता है।
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: आधुनिक हिन्दी में यह सर्वाधिक सहज और पहचाना जाने वाला शब्द है; यूनानी पद के यहूदिया-निवासी अथवा व्यापक यहूदी समुदाय—दोनों सम्भव आशयों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀναβάντες παρ' ὑμῶν πρὸς ἡμᾶς
  choice: आपके यहाँ से हमारे यहाँ आए हैं
  rationale: यह प्रशासनिक दृष्टिकोण से उनके राजा के क्षेत्र से पत्र-लेखकों के क्षेत्र में आने का भाव देता है। ‘ऊपर आए’ का शाब्दिक रूप हिन्दी में अस्वाभाविक होता; यरूशलेम पहुँचने की दिशा अगली उपवाक्य में स्पष्ट है।
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηρὰν
  choice: उस विद्रोही और दुष्ट नगर
  rationale: ἀποστάτις यहाँ साम्राज्य के विरुद्ध राजनीतिक विद्रोह का आरोप है, धार्मिक धर्मत्याग का नहीं; πονηρά आरोप की कठोर नैतिक भाषा को बनाए रखता है।
- source_word: οἰκοῦσιν
  choice: बस रहे हैं
  rationale: वर्तमानकालीन, जारी निवास का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἀγοράς
  choice: बाज़ारों
  rationale: ἀγορά का सामान्य अर्थ बाज़ार अथवा सार्वजनिक चौक है। मुख्य पाठ में संक्षिप्त और सहज ‘बाज़ारों’ रखा गया है तथा व्यापक सम्भावना पादटिप्पणी में दी गई है।
- source_word: θεραπεύουσιν
  choice: मरम्मत कर रहे हैं
  rationale: क्रिया का अर्थ देखभाल करना, सुधारना अथवा पुनः ठीक करना हो सकता है; बाज़ारों और दीवारों के संदर्भ में ‘मरम्मत’ निर्माण-कार्य को बिना बढ़ा-चढ़ाकर व्यक्त करती है।
- source_word: ναὸν ὑποβάλλονται
  choice: मंदिर की नींव डाल रहे हैं
  rationale: संक्षिप्त यूनानी वाक्यांश किसी मंदिर-निर्माण को आरम्भ करने या उसकी अधोरचना रखने का संकेत देता है। हिन्दी में बिना निश्चयवाचक या अनिश्चयवाचक लेख के ‘मंदिर’ मूल की अनिर्दिष्टता को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: मानवीय राजा के लिए κύριος का अनुवाद
  choice: मेरे स्वामी राजा
  alternative: प्रभु राजा
  rationale: इस प्रसंग में संबोधित व्यक्ति सांसारिक राजा है। ‘प्रभु’ धार्मिक या दैवी अर्थ का अनचाहा संकेत दे सकता है, जबकि ‘स्वामी’ दरबारी सम्मान को स्पष्ट रखता है।
- issue: ναὸν में लेख के अभाव और यरूशलेम के मंदिर की पहचान
  choice: मंदिर की नींव
  alternative: एक मंदिर की नींव / उस मंदिर की नींव
  rationale: यूनानी में ναόν के साथ लेख नहीं है, पर प्रसंग यरूशलेम के परिचित मंदिर की ओर संकेत कर सकता है। हिन्दी का लेखरहित ‘मंदिर’ दोनों सम्भावनाओं को अनावश्यक रूप से तय किए बिना व्यक्त करता है।
