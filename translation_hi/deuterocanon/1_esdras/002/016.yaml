base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: hi
  text: 'हमारे स्वामी राजा अर्तक्षत्र के नाम: आपके सेवक—राथिमुस[a], मामलों का अधिकारी[b]; सामेल्लियुस, लेखक; उनकी परिषद के शेष सदस्य, और कोइले-सीरिया तथा फ़िनीके में रहनेवाले लोग।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ के राथिमुस और सामेल्लियुस नाम सामी समानांतर पाठ के रहूम और शिमशै नामों से लगभग मेल खाते हैं।
    reason: alternative_reading
  - marker: b
    text: यूनानी पद का अर्थ कुछ अनिश्चित है। अधिक शाब्दिक रूप में इसका अर्थ है, ‘सामने लाए जानेवाले मामलों का अधिकारी।’
    reason: lexical_alternative
  - marker: c
    text: कोइले-सीरिया यूनानी पाठ में प्रयुक्त एक ऐतिहासिक क्षेत्रीय नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: हमारे स्वामी राजा अर्तक्षत्र के नाम
  rationale: पत्र के आरंभ में प्रयुक्त सम्प्रदान कारक को हिन्दी की स्वाभाविक पत्र-शैली में व्यक्त किया गया है। κυρίῳ राजकीय आदर-सूचक संबोधन है; प्रसंग के आधार पर ‘हमारे’ स्पष्ट किया गया है।
- source_word: οἱ παῖδές σου
  choice: आपके सेवक
  rationale: राजकीय पत्राचार में παῖδες अधीनस्थ सेवकों या अधिकारियों को दर्शाता है, न कि बच्चों को।
- source_word: Ῥάθυμος
  choice: राथिमुस
  rationale: यूनानी पाठ प्राथमिक आधार है, इसलिए यूनानी नाम-रूप का लिप्यंतरण रखा गया है; सामी समानांतर का ‘रहूम’ पादटिप्पणी में दिया गया है।
- source_word: ὁ τὰ προσπίπτοντα
  choice: अभिलेखों का अधिकारी
  rationale: शाब्दिक अर्थ लगभग ‘सामने लाए जानेवाले मामलों पर नियुक्त व्यक्ति’ है। प्रशासनिक पद को सहज हिन्दी में व्यक्त किया गया है, जबकि इसकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: Σαμέλλιος ὁ γραμματεὺς
  choice: लेखक सामेल्लियुस
  rationale: γραμματεύς प्रशासनिक संदर्भ में लेखक या सचिव हो सकता है। ‘लेखक’ मूल पद के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: उनकी परिषद के शेष सदस्य
  rationale: βουλή विचार-विमर्श करनेवाली परिषद को सूचित करता है; हिन्दी में सदस्यों को स्पष्ट करना स्वाभाविक है।
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: कोइले-सूरिया तथा फ़िनीके में रहनेवाले लोग
  rationale: ऐतिहासिक भौगोलिक नाम को सामान्य ‘सीरिया’ में समतल करने के बजाय यूनानी रूप के निकट रखा गया है।
