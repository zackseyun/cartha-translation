base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: hi
  text: और उसी के द्वारा वे यहूदिया के प्रशासक सनमस्सार[a][b][c] को सौंप दी गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सनमस्सार उस अधिकारी के नाम का यूनानी रूप है जिसे समानांतर इब्रानी पाठ में शेशबस्सर कहा गया है (एज्रा 1:8)।
    reason: alternative_reading
  - marker: b
    text: या, “उसी के हाथ से,” अर्थात उसी के माध्यम से।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “यहूदिया”; समानांतर इब्रानी पाठ में “यहूदा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: और उसी के द्वारा
  rationale: यह पदबंध माध्यम अथवा अभिकर्ता को दर्शाता है। ‘उसी के द्वारा’ यूनानी के संकेतवाचक बल को बनाए रखते हुए प्रसंग में स्वाभाविक हिन्दी है।
- source_word: παρεδόθησαν
  choice: सौंप दी गईं
  rationale: παραδίδωμι का कर्मवाच्य यहाँ पिछली पंक्ति में उल्लिखित वस्तुओं के औपचारिक हस्तांतरण को व्यक्त करता है। स्त्रीलिंग बहुवचन रूप प्रसंगगत ‘वस्तुओं’ के अनुसार है।
- source_word: Σαναμασσάρῳ
  choice: सनमस्सार
  rationale: मुख्य पाठ यूनानी नाम का देवनागरी लिप्यंतरण रखता है; समानांतर इब्रानी पाठ का ‘शेशबस्सर’ पाद-टिप्पणी में दिया गया है।
- source_word: προστάτῃ
  choice: प्रशासक
  rationale: प्रशासनिक प्रसंग में यह शब्द किसी प्रधान अधिकारी या अगुआ को सूचित करता है। ‘प्रशासक’ पद को अनावश्यक रूप से विशिष्ट बनाए बिना सरकारी भूमिका स्पष्ट करता है।
- source_word: τῆς Ἰουδαίας
  choice: यहूदिया के
  rationale: यूनानी Ἰουδαία का सीधा क्षेत्रीय नाम ‘यहूदिया’ है; समानांतर इब्रानी पाठ में ‘यहूदा’ है।
