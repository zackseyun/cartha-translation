base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: hi
  text: तब, जब राजा अर्तक्षत्र की ओर से लिखी गई बातें पढ़ी गईं, राथिमुस, लेखक सामेल्लियुस, और उनके साथ जुड़े हुए लोग[a] घुड़सवारों और युद्ध के लिए पंक्तिबद्ध भीड़ के साथ शीघ्रता से यरूशलेम को चढ़ गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘राथिमुस’ और ‘सामेल्लियुस’ हैं; इब्रानी समानांतर में इन व्यक्तियों की पहचान रहूम और शिमशै के रूप में होती है।
    reason: alternative_reading
  - marker: b
    text: या, “घुड़सवार सेना और युद्ध के लिए पंक्तिबद्ध जनसमूह के साथ।” यूनानी पदबंध संक्षिप्त और कुछ असामान्य है; संभवतः वह किसी सशस्त्र अनुरक्षक दल या बलपूर्वक कार्रवाई करने वाले दस्ते का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθέντων τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: राजा अर्तक्षत्र की ओर से लिखी गई बातों को पढ़कर
  rationale: यूनानी संबंधवाचक वाक्यांश का निष्क्रिय भाव और काल-संबंध स्वाभाविक हिन्दी में रखा गया है। παρὰ का अर्थ यहाँ राजा की ओर से जारी लिखित सामग्री है; इसे केवल एक ‘पत्र’ तक सीमित नहीं किया गया।
- source_word: Ῥάθυμος / Σαμέλλιος
  choice: राथिमुस / सामेल्लियुस
  rationale: मुख्य पाठ यूनानी स्रोत के नामरूपों का लिप्यंतरण करता है; इब्रानी समानांतर के रहूम और शिमशै को पादटिप्पणी में बताया गया है।
- source_word: ὁ γραμματεὺς
  choice: शास्त्री
  rationale: यह प्रशासनिक लेखक अथवा सचिव का पद हो सकता है। ‘शास्त्री’ पारंपरिक और बोधगम्य है, यद्यपि यहाँ धार्मिक शिक्षक की अपेक्षा सरकारी लेखक अभिप्रेत हो सकता है।
- source_word: οἱ τούτοις συντασσόμενοι
  choice: उनके साथ मिले हुए लोग
  rationale: यह उनके पक्ष में संगठित या उनसे संबद्ध लोगों को दर्शाता है, बिना संबंध की प्रकृति को आवश्यकता से अधिक निश्चित किए।
- source_word: ἀναζεύξαντες κατὰ σπουδὴν
  choice: शीघ्रता से ... गए
  rationale: ἀναζεύω के प्रस्थान और κατὰ σπουδήν की तत्परता को सरल आधुनिक हिन्दी में संयुक्त रूप से व्यक्त किया गया है।
- source_word: μεθʼ ἵππου
  choice: घुड़सवारों के साथ
  rationale: एकवचन ἵππου यहाँ सामूहिक या सैन्य अर्थ में प्रतीत होता है। ‘घुड़सवार’ ‘घोड़ों’ से अधिक संदर्भानुकूल है, पर ‘घुड़सवार सेना’ जितना विशिष्ट नहीं।
- source_word: ὄχλου παρατάξεως
  choice: युद्ध के लिए पंक्तिबद्ध भीड़
  rationale: संक्षिप्त और असामान्य यूनानी पदबंध में ὄχλος की भीड़ तथा παράταξις की युद्ध-विन्यास संबंधी धारणा दोनों सुरक्षित रखी गई हैं।
