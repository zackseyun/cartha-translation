base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: hi
  text: और राजा कुस्रू ने प्रभु के पवित्र पात्र बाहर निकाले, जिन्हें नबूकदनेस्सर यरूशलेम से उठा ले गया था और अपने देवता के भवन में रख दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में: “अपने मूर्ति-मंदिर में” या “अपने मूर्ति-भवन में”; समानांतर इब्रानी पाठ में: “अपने देवता के भवन में।”'
    reason: यूनानी εἰδώλιον के अधिक स्पष्ट ‘मूर्ति’ भाव और समानांतर इब्रानी पाठ के बीच शाब्दिक अंतर बताने के लिए।
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: बाहर निकलवाए
  rationale: यह सकर्मक क्रिया भंडार या अभिरक्षा से वस्तुओं को बाहर लाने का भाव देती है; राजकीय आदेश के प्रसंग में ‘बाहर निकलवाए’ स्वाभाविक और सटीक है।
- source_word: τὰ ἅγια σκεύη
  choice: पवित्र पात्र
  rationale: σκεύη मंदिर में प्रयुक्त पात्रों या उपकरणों का व्यापक शब्द है; ‘पवित्र पात्र’ धार्मिक समर्पण को बनाए रखता है और वस्तुओं का अनावश्यक विशिष्टीकरण नहीं करता।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: यूनानी κύριος का मानक हिन्दी रूप ‘प्रभु’ है; संबंधकारक यहाँ पात्रों के प्रभु से संबंध या स्वामित्व को व्यक्त करता है।
- source_word: μετήγαγεν
  choice: उठा ले गया था
  rationale: क्रिया एक स्थान से दूसरे स्थान ले जाने का बोध कराती है; विजय और लूट के प्रसंग में यह हिन्दी अभिव्यक्ति स्वाभाविक रूप से जबरन स्थानांतरण का संकेत देती है।
- source_word: ἀπηρείσατο
  choice: रख दिया था
  rationale: यहाँ अर्थ उन पात्रों को किसी धार्मिक स्थान में जमा या स्थापित करने का है; ‘रख दिया था’ स्पष्ट, सहज और मूल से अधिक तकनीकी नहीं है।
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: अपने देवता के भवन में
  rationale: मुख्य पाठ में यह अनुवाद समानांतर इब्रानी ‘उसके देवता के भवन में’ के अनुरूप प्रसंगगत अर्थ देता है; यूनानी εἰδώλιον में निहित ‘मूर्ति-मंदिर’ का अधिक तीखा भाव पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: मंदिर-संबंधी प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में κύριος है; ‘प्रभु’ उसी रूप का सीधा और परंपरागत हिन्दी अनुवाद है तथा समानांतर इब्रानी के आधार पर दिव्य नाम को मुख्य पाठ में नहीं जोड़ता।
- issue: εἰδώλιον और समानांतर इब्रानी के बीच अभिव्यक्ति
  choice: अपने देवता के भवन में
  alternative: अपने मूर्ति-मंदिर में
  rationale: प्रसंग और इब्रानी समानांतर भवन/मंदिर का अर्थ पुष्ट करते हैं, जबकि यूनानी में मूर्तिपूजक स्थल का अधिक स्पष्ट नकारात्मक संकेत है; मुख्य पाठ पठनीय अर्थ देता है और पादटिप्पणी यूनानी की धार को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘कुस्रू’, ‘नबूकदनेस्सर’ और ‘यरूशलेम’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। पादटिप्पणी चिह्न [a] संबंधित वाक्य के अंत में दिया गया है।
