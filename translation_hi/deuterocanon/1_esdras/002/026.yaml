base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: hi
  text: वे निर्माण करने वालों को बाधा डालने लगे; और यरूशलेम में मंदिर का निर्माण-कार्य फारसियों के राजा दारा के शासन के दूसरे वर्ष तक रुका रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ठप पड़ा रहा’ अथवा ‘निष्क्रिय पड़ा रहा’; यूनानी क्रिया बताती है कि मंदिर का निर्माण-कार्य रुक गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  choice: रोकने लगे
  rationale: यह पदबंध विरोध की कार्रवाई आरम्भ होने को व्यक्त करता है। ‘रोकने लगे’ आधुनिक हिन्दी में स्वाभाविक है और अगले उपवाक्य में बताए गए पूर्ण ठहराव को पहले से अनावश्यक रूप से नहीं दोहराता।
- source_word: τοὺς οἰκοδομοῦντας
  choice: निर्माण करनेवालों
  rationale: वर्तमान कृदन्त निर्माण में लगे लोगों पर बल देता है; यह रूप उसके क्रियात्मक भाव को बनाए रखता है।
- source_word: ἤργει
  choice: ठप पड़ा रहा
  rationale: अपूर्ण भूतकालीन क्रिया बताती है कि काम एक अवधि तक निष्क्रिय अथवा रुका रहा। ‘ठप पड़ा रहा’ उस जारी स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ οἰκοδομὴ τοῦ ἱεροῦ
  choice: मंदिर का निर्माण-कार्य
  rationale: यहाँ οἰκοδομή तैयार इमारत नहीं, निर्माण की गतिविधि अथवा परियोजना है; ἱερόν को प्रसंगानुसार ‘मंदिर’ कहा गया है।
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यूनानी पदबंध मंदिर का स्थान बताता है; हिन्दी में संक्षिप्त स्थानवाचक प्रयोग स्वाभाविक है।
- source_word: μέχρι τοῦ δευτέρου ἔτους
  choice: दूसरे वर्ष तक
  rationale: μέχρι संबंधकारक के साथ उस समय-सीमा को चिह्नित करता है जहाँ तक निर्माण निष्क्रिय रहा।
- source_word: τῆς βασιλείας Δαρείου
  choice: दारा के शासन के
  rationale: βασιλεία यहाँ भौगोलिक राज्य नहीं बल्कि राजा के शासनकाल को सूचित करता है। हिन्दी बाइबलीय नामरूप ‘दारा’ अपनाया गया है।
- source_word: τοῦ Περσῶν βασιλέως
  choice: फारसियों के राजा
  rationale: यह यूनानी संबंधकारक रचना का सीधा और स्वाभाविक अनुवाद है तथा राजा और प्रजा के संबंध को बनाए रखता है।
