base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: hi
  text: और उनके आस-पास रहनेवालों ने हर प्रकार से उनकी सहायता की—चाँदी और सोने से, घोड़ों और पशुधन से, और उन बहुतों की बहुत-सी प्रार्थनाओं[a] से, जिनका मन जगाया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “प्रार्थनाओं” है; इसका अर्थ “मन्नतों” भी हो सकता है। एज्रा 1:6 के इब्रानी समानांतर में यहाँ “बहुमूल्य भेंटें” या “उत्तम वस्तुएँ” हैं। उसी समानांतर में “घोड़ों” के स्थान पर “सम्पत्ति/सामान” आता है।
    reason: textual_variant
  - marker: b
    text: या, “जिनकी आत्मा प्रेरित हुई थी”; इब्रानी समानांतर की अभिव्यक्ति इसी के निकट है। यूनानी में शाब्दिक रूप से “जिनका मन जगाया गया था” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: उनके आस-पास रहनेवालों
  rationale: यह यूनानी पद आसपास के लोगों को सूचित करता है। ‘पड़ोसियों’ की अपेक्षा यह मूल की स्थानवाचक अभिव्यक्ति को अधिक सीधे सुरक्षित रखता है।
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: हर प्रकार से उनकी सहायता की
  rationale: यह व्यापक सहायता का स्वाभाविक हिन्दी रूप है और साधन बतानेवाली आगामी सूची से सहजता से जुड़ता है।
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: चाँदी और सोने से
  rationale: यहाँ ἐν साधन का बोध कराता है; हिन्दी में ‘से’ स्पष्ट और स्वाभाविक है।
- source_word: ἵπποις
  choice: घोड़ों
  rationale: यूनानी पाठ स्पष्ट रूप से घोड़ों का उल्लेख करता है; इब्रानी समानांतर के ‘सम्पत्ति/सामान’ के अनुसार इसे समरूप नहीं किया गया।
- source_word: κτήνεσιν
  choice: पशुधन
  rationale: यह पालतू या सम्पत्ति के रूप में रखे जानेवाले पशुओं के लिए व्यापक, आधुनिक हिन्दी शब्द है।
- source_word: εὐχαῖς ὡς πλείσταις
  choice: बहुत-सी प्रार्थनाओं
  rationale: εὐχαῖς का सामान्य अर्थ ‘प्रार्थनाएँ’ या ‘मन्नतें’ है। भौतिक वस्तुओं की सूची में इसका प्रयोग असामान्य है, पर प्राथमिक यूनानी साक्ष्य को पाठ में बनाए रखा गया है और भिन्नता टिप्पणी में दी गई है।
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: उन बहुतों ने, जिनका मन प्रेरित हुआ था
  rationale: ‘बहुतों’ यूनानी πολλῶν को सुरक्षित रखता है; ‘मन’ νοῦς का सीधा रूप है और ‘प्रेरित हुआ’ भीतर से क्रियाशील किए जाने का स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: यूनानी पाठ और एज्रा 1:6 के इब्रानी समानांतर में दी गई वस्तुओं की सूची का अंतर
  choice: मुख्य पाठ में यूनानी के ‘घोड़े’ और ‘प्रार्थनाएँ’ को बनाए रखना
  alternative: इब्रानी समानांतर के अनुसार ‘सम्पत्ति/सामान’ और ‘बहुमूल्य भेंटें’ लिखना
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है। इब्रानी समानांतर महत्त्वपूर्ण साक्ष्य है, इसलिए अंतर को पादटिप्पणी में रखा गया है, पर उसके आधार पर यूनानी को मौन रूप से समरूप नहीं किया गया।
- issue: νοῦς को मन या आत्मा के रूप में व्यक्त करना
  choice: मन
  alternative: आत्मा
  rationale: ‘मन’ यूनानी νοῦς को सीधे दर्शाता है; ‘आत्मा’ इब्रानी समानांतर की रूढ़ि के निकट है, इसलिए उसे टिप्पणी में विकल्प के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। असामान्य यूनानी सूची को सहज बनाने के लिए डैश लगाए गए हैं, पर स्रोत की वास्तविक अस्पष्टता और इब्रानी समानांतर से उसका तनाव पादटिप्पणियों में सुरक्षित है।
