base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: hi
  text: फारस के राजा कुस्रू के शासन के पहले वर्ष में, यिर्मयाह के मुख से निकले प्रभु[a] के वचन की पूर्ति के लिए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'समानांतर इब्रानी पाठ में ‘प्रभु’ के स्थान पर परमेश्वर का विशिष्ट नाम ‘यहोवा’ है। अतः इसे इस प्रकार भी व्यक्त किया जा सकता है: ‘यिर्मयाह के मुख से निकले यहोवा के वचन की पूर्ति के लिए।’'
    reason: मुख्य यूनानी पाठ Κυρίου पढ़ता है, जबकि समानांतर इब्रानी पाठ में יהוה है; यह स्रोतगत अंतर पाठक के लिए महत्त्वपूर्ण है।
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: फारस के राजा कुस्रू के शासन के पहले वर्ष में
  rationale: यूनानी संबंधकारक निरपेक्ष रचना समय बताती है। हिन्दी में यह रूप स्वाभाविक है; समानांतर इब्रानी पाठ भी कुस्रू के पहले राजकीय वर्ष की पुष्टि करता है।
- source_word: Κύρου Περσῶν
  choice: फारस के राजा कुस्रू
  rationale: यूनानी का शाब्दिक अर्थ ‘फारसियों का कुस्रू’ है, पर समानांतर इब्रानी साक्ष्य और ऐतिहासिक संदर्भ राजकीय पदवी ‘फारस का राजा’ की पुष्टि करते हैं।
- source_word: εἰς συντέλειαν
  choice: पूर्ति के लिए
  rationale: यह उद्देश्य अथवा परिणति का भाव व्यक्त करता है। ‘पूर्ति’ वचन के पूरा होने का अर्थ संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ῥήματος Κυρίου
  choice: प्रभु के वचन
  rationale: मुख्य यूनानी स्रोत में Κυρίου है, इसलिए ‘प्रभु’ उपयुक्त है; ‘वचन’ भविष्यद्वाणी के कथन का पारंपरिक और बोधगम्य रूप है।
- source_word: ἐν στόματι Ἰερεμίου
  choice: यिर्मयाह के मुख से कहे गए
  rationale: यह यूनानी की ठोस ‘मुख से’ छवि को बनाए रखते हुए हिन्दी में स्पष्ट करता है कि वचन यिर्मयाह के द्वारा कहा गया था।
theological_decisions:
- issue: मुख्य यूनानी पाठ के Κυρίου और समानांतर इब्रानी पाठ के יהוה का निरूपण
  choice: प्रभु
  alternative: यहोवा
  rationale: 1 एसद्रास के लिए यूनानी प्राथमिक स्रोत है और उसमें Κυρίου है। इब्रानी समानांतर पाठ में परमेश्वर का विशिष्ट नाम है, इसलिए उसे पाठांतर-सूचना के रूप में रखा गया है।
- issue: वचन और यिर्मयाह के संबंध का स्वरूप
  choice: यिर्मयाह के मुख से कहे गए प्रभु के वचन
  alternative: यिर्मयाह के द्वारा प्रभु के वचन
  rationale: चुना गया रूप भविष्यद्वक्ता के माध्यम से आए वचन को स्पष्ट करता है और मूल की ‘मुख’ वाली अभिव्यक्ति भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘मुख से’ मूल की भविष्यद्वाणी-संबंधी ठोस अभिव्यक्ति को सुरक्षित रखता है। पद यहाँ अधूरा वाक्यांश है, इसलिए अंत में अल्पविराम रखा गया है।
