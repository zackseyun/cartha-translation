lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: अभिलेखों
  rationale: प्रशासनिक संदर्भ में यह राजकीय या आधिकारिक लिखित अभिलेखों को सूचित करता है; ‘अभिलेख’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: γεγραμμένα
  choice: जो लिखा गया है
  rationale: पूर्णकालिक कृदंत पहले से लिखी हुई सामग्री की ओर संकेत करता है; यह रूप उस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἀποστάτις
  choice: विद्रोही
  rationale: यहाँ आरोप राजनीतिक राजद्रोह का है, धार्मिक धर्मत्याग का नहीं।
- source_word: ὀχλοῦσα
  choice: अशांत करता था
  rationale: कृदंत निरंतर उपद्रव या परेशानी उत्पन्न करने का भाव देता है; नगर के लिए हिन्दी में पुल्लिंग एकवचन क्रिया स्वाभाविक है।
- source_word: ἀποστᾶται
  choice: विद्रोही
  rationale: प्रशासनिक पत्र के संदर्भ में यह साम्राज्य-विरोधी लोगों को दर्शाता है, इसलिए धार्मिक अर्थवाला शब्द नहीं चुना गया।
- source_word: πολιορκίας
  choice: घेराबंदियाँ
  rationale: शब्द घेरने या घेरे की सैन्य गतिविधि को सूचित कर सकता है; ‘घेराबंदियाँ’ व्यापकता और बहुवचन दोनों को बनाए रखता है।
- source_word: συνεσταμένοι
  choice: आयोजित करते आए थे
  rationale: यह स्थापित या संगठित की गई गतिविधि तथा लंबे समय से चली आ रही अवस्था का संकेत देता है।
- source_word: ἔτι ἐξ αἰῶνος
  choice: प्राचीन काल से
  rationale: दीर्घकालीन पुराने इतिहास का अर्थ स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἠρημώθη
  choice: उजाड़ दिया गया था
  rationale: कर्मवाच्य नगर को विनष्ट और निर्जन किए जाने का परिणाम व्यक्त करता है।
theological_decisions:
- issue: नगर और यहूदियों पर लगाए गए आरोप का स्वरूप
  choice: राजनीतिक विद्रोह और शत्रुतापूर्ण गतिविधि
  alternative: धार्मिक धर्मत्याग
  rationale: ἀποστάτις और ἀποστᾶται कहीं-कहीं धर्मत्याग का अर्थ दे सकते हैं, पर यहाँ फ़ारसी प्रशासनिक आरोप राजसत्ता के विरुद्ध विद्रोह से संबंधित हैं; इसलिए ‘विद्रोही’ चुना गया है।
- issue: πολιορκίας συνεσταμένοι का सटीक आशय
  choice: घेराबंदियाँ आयोजित करते आए थे
  alternative: घेरे डालते आए थे / नाकाबंदियाँ स्थापित कर चुके थे
  rationale: यूनानी पदबंध कुछ असामान्य है और व्यापक घेराव-संबंधी गतिविधि का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रशासनिक-वृत्तांत वाला स्वर रखा गया है। वाक्य की आरोपात्मक संरचना और यूनानी पाठ के ‘वह नगर’ से अंतिम कारणसूचक निष्कर्ष तक की गति सुरक्षित है।
