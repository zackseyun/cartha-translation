base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: hi
  text: और अभिलेखों में तुम्हें इन बातों के विषय में जो लिखा गया है, वह मिल जाएगा; और तुम जान लोगे कि वह नगर विद्रोही था और राजाओं और नगरों के लिए उपद्रव का कारण था, और यह कि उसमें रहनेवाले यहूदी विद्रोही थे और उन्होंने बहुत प्राचीन समय से उसमें घेराबंदियाँ संगठित कर रखी थीं[a]। इसी कारण यह नगर उजाड़ दिया गया था।
  philosophy: optimal-equivalence
