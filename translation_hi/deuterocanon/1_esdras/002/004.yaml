base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: hi
  text: और उसने मुझे अपने लिए यरूशलेम में, जो यहूदिया में है, एक भवन[a] बनाने का दायित्व सौंपा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, ‘मन्दिर।’ यूनानी में शाब्दिक रूप से ‘भवन’ या ‘घर’ है, जो बाइबल में मन्दिर के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मुझे जता दिया’ अथवा ‘मुझे आज्ञा दी।’ यूनानी क्रिया किसी बात को प्रकट करने या कोई काम सौंपने का भाव दे सकती है; समानान्तर इब्रानी पाठ ईश्वरीय अधिकार-प्रदान के भाव का अधिक स्पष्ट समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν
  choice: दायित्व सौंपा
  rationale: σημαίνω यहाँ infinitive οἰκοδομῆσαι के साथ किसी कार्य को जताने अथवा सौंपने का भाव देता है। ‘दायित्व सौंपा’ ईश्वरीय अधिकार-प्रदान को स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे अनिवार्य रूप से सीधे आदेश के रूप में नहीं बाँधता।
- source_word: οἰκοδομῆσαι
  choice: बनाने
  rationale: यूनानी क्रिया का सीधा अर्थ ‘बनाना’ है। प्रसंग पुनर्निर्माण का है, फिर भी यूनानी पाठ में ‘फिर से’ स्पष्ट नहीं है।
- source_word: αὐτῷ
  choice: अपने लिए
  rationale: यहाँ dative उस व्यक्ति के लाभ अथवा समर्पण के लिए भवन बनाए जाने को दर्शाता है। कर्ता परमेश्वर होने के कारण ‘अपने लिए’ स्वाभाविक हिन्दी है।
- source_word: οἶκον
  choice: एक भवन
  rationale: οἶκος का शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ वह मन्दिर के लिए बाइबलीय पद है। ‘भवन’ स्रोत की रूपकात्मक अभिव्यक्ति बनाए रखता है; स्पष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक आधुनिक हिन्दी रूप।
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: जो यहूदिया में है
  rationale: यह पदबंध यरूशलेम का स्थान स्पष्ट करने वाला समानाधिकरण है; सम्बन्धवाचक उपवाक्य उसके व्याख्यात्मक बल को बनाए रखता है।
theological_decisions:
- issue: οἶκον को सामान्य ‘भवन’ कहना या स्पष्ट रूप से ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: यूनानी पाठ में स्पष्ट मन्दिर-वाचक शब्द नहीं, बल्कि οἶκον है। प्रसंग में यह परमेश्वर के मन्दिर को दर्शाता है, पर मुख्य पाठ स्रोत की शब्द-छवि बनाए रखता है और पाद-टिप्पणी अर्थ स्पष्ट करती है।
- issue: ἐσήμανέν को कितनी प्रबल आज्ञा के रूप में व्यक्त करना
  choice: दायित्व सौंपा
  alternative: आज्ञा दी / जता दिया
  rationale: यूनानी क्रिया ‘जताना, प्रकट करना’ से लेकर प्रसंगानुसार ‘कार्य सौंपना’ तक अर्थ दे सकती है। समानान्तर इब्रानी पाठ ईश्वरीय अधिकार-प्रदान की पुष्टि करता है, पर यूनानी अपने आप में प्रत्यक्ष आज्ञा को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यरूशलेम में, जो यहूदिया में है’ यूनानी की व्याख्यात्मक संरचना को सुरक्षित रखता है। ‘भवन’ मन्दिर-सन्दर्भ को अत्यधिक स्पष्ट करके स्रोत की शब्दावली को बदलने से बचाता है।
