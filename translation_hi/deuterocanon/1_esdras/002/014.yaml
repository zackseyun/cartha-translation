base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/014.yaml
  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: hi
  text: और उसे[b] शेशबस्सर[a] के द्वारा बंधुआई से आए लोगों के साथ बाबेल से यरूशलेम ले जाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘समनस्सार’ है। एज्रा के समानांतर प्रसंग में इसी अधिकारी का नाम ‘शेशबस्सर’ है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में कर्मवाच्य क्रिया एकवचन है—अर्थात ‘उसे ले जाया गया’—पर इस वाक्य में उस वस्तु का नाम दोहराया नहीं गया है; संभवतः संकेत पिछले प्रसंग की किसी वस्तु या पात्र की ओर है।
    reason: source_clarification
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: ले जाया गया
  rationale: यह ἀναφέρω का भूतकालिक कर्मवाच्य रूप है। प्रसंग में किसी पहले उल्लिखित वस्तु को बाबेल से यरूशलेम ले जाने का भाव है; हिन्दी में ‘ले जाया गया’ कर्मवाच्य और दिशा दोनों को स्वाभाविक रूप से व्यक्त करता है। ‘ऊपर’ को अलग से जोड़ना हिन्दी में कृत्रिम होता।
- source_word: ὑπὸ Σαμανασσάρου
  choice: शेशबस्सर के द्वारा
  rationale: यूनानी पाठ में नाम ‘समनस्सार’ के रूप में है, पर एज्रा के समानांतर प्रसंग से वही अधिकारी शेशबस्सर अभिप्रेत है। मुख्य पाठ में पाठकों से परिचित नाम रखा गया और यूनानी रूप पादटिप्पणी में बताया गया है।
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: बंधुआई से आए लोगों के साथ
  rationale: ἅμα का अर्थ ‘साथ’ और αἰχμαλωσία का अर्थ ‘बंधुआई/निर्वासन’ है। यह रूप यूनानी की संरचना के निकट रहते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐκ Βαβυλῶνος
  choice: बाबेल से
  rationale: प्रस्थान-स्थान का सीधा और प्रचलित बाइबलीय हिन्दी रूप।
- source_word: εἰς Ἱερουσαλήμ
  choice: यरूशलेम
  rationale: ‘बाबेल से यरूशलेम ले जाया गया’ में लक्ष्य-स्थान स्वाभाविक हिन्दी वाक्य-विन्यास से स्पष्ट होता है।
theological_decisions:
- issue: Σαμανασσάρου नाम की पहचान
  choice: मुख्य पाठ में ‘शेशबस्सर’
  alternative: ‘समनस्सार’ अथवा ‘सामानस्सार’ जैसा यूनानी नाम का सीधा लिप्यंतरण
  rationale: यह सिद्धान्तगत निर्णय नहीं, बल्कि समान व्यक्ति की नाम-पहचान का पाठगत निर्णय है। यूनानी रूप को छिपाया नहीं गया, बल्कि पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἀνηνέχθη के अलिखित कर्ता का स्वरूप
  choice: एकवचन वस्तु को सूचित करने वाला ‘उसे’
  alternative: पूर्ववर्ती पात्रों अथवा वस्तुओं को स्पष्ट रूप से दोहराना
  rationale: यूनानी क्रिया एकवचन है, पर संज्ञा इस वाक्य में दोहराई नहीं गई। ‘उसे’ इसी अनिश्चितता को बनाए रखता है और किसी खास पात्र को बिना पर्याप्त आधार के नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बंधुआई’ बाइबलीय संदर्भ में परिचित है, जबकि शेष वाक्य-विन्यास समकालीन मानक हिन्दी का है।
