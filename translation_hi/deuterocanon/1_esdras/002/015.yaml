base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: hi
  text: 'फ़ारसियों के राजा अर्तक्षत्र के समय में बेलेमुस, मिथ्रदातेस, ताबेल्लियुस, राथिमुस, बेएलतेथ्मुस, सामेल्लियुस लिपिक, और उनसे संबद्ध शेष लोगों ने—जो सामरिया और अन्य स्थानों में रहते थे—यहूदिया और यरूशलेम के निवासियों के विरुद्ध निम्नलिखित पत्र[a] लिखा[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ, “नीचे लिखा हुआ पत्र” या “संलग्न पत्र” है।
    reason: lexical_alternative
  - marker: b
    text: “लिखा ... के विरुद्ध” के आसपास का यूनानी वाक्य-विन्यास संक्षिप्त और कुछ कठिन है; आशय संभवतः यह है कि उन्होंने यहूदिया और यरूशलेम के निवासियों के विरुद्ध लिखित आरोप या शिकायत प्रस्तुत की।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου ... χρόνοις
  choice: अर्तक्षत्र के समय में
  rationale: χρόνοις के सामान्य कालगत अर्थ को स्वाभाविक हिन्दी में रखा गया है; δέ का हल्का कथात्मक संक्रमण अलग शब्द जोड़कर भारी नहीं किया गया।
- source_word: τοῦ Περσῶν βασιλέως
  choice: फ़ारसियों के राजा
  rationale: यूनानी संबंधकारक बहुवचन Περσῶν को जातीय-राजनीतिक पदनाम के रूप में स्पष्ट रखा गया है।
- source_word: κατέγραψεν
  choice: लिखी
  rationale: क्रिया का मूल अर्थ लिखना या लिखित रूप में दर्ज करना है; विरोधात्मक आशय κατά वाले पदबंध से व्यक्त होता है।
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: यहूदिया और यरूशलेम के निवासियों के विरुद्ध
  rationale: यूनानी वाक्यांश संक्षिप्त और αὐτῶν की दृष्टि से वाक्य-विन्यासगत रूप से कठिन है। κατά के विरोधात्मक या आरोपात्मक भाव को 'के विरुद्ध' से सुरक्षित रखा गया है।
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: बेलेमुस, मिथ्रदातेस, ताबेलियुस, राथिमुस, बेलतेथ्मुस, शमैलियुस
  rationale: व्यक्तिनामों को स्वेटे के यूनानी रूपों के आधार पर देवनागरी में लिप्यंतरित किया गया है, अनुवादित नहीं।
- source_word: ὁ γραμματεύς
  choice: मुंशी
  rationale: γραμματεύς लेखक अथवा आधिकारिक सचिव के लिए प्रयुक्त हो सकता है। 'मुंशी' आधुनिक पाठक के लिए लिखने वाले अधिकारी का अर्थ सहजता से देता है, बिना पद को अधिक विशिष्ट बनाए।
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: उनके साथ मिले हुए बाकी लोग
  rationale: συντασσόμενοι के साथ जुड़े या एक पक्ष में खड़े होने के भाव को स्वाभाविक हिन्दी में रखा गया है; सैन्य संगठन का अनावश्यक संकेत नहीं जोड़ा गया।
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: जो सामरिया और अन्य स्थानों में रहते थे
  rationale: निवास के सीधे अर्थ को रखा गया है और τοῖς ἄλλοις τόποις को सामान्यीकृत करके 'अन्य स्थानों' कहा गया है।
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: नीचे लिखी चिट्ठी
  rationale: ὑπογεγραμμένην का अधिक शाब्दिक अर्थ 'नीचे लिखी' है। यह हिन्दी में समझने योग्य है और दस्तावेज़ के आगे आने का संकेत देता है।
