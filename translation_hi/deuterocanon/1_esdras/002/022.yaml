base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: hi
  text: मैंने वह पत्र पढ़ा जो तुमने मुझे भेजा था। इसलिए मैंने जाँच करने की आज्ञा दी, और यह पाया गया कि वह नगर प्राचीन काल से राजाओं के विरोध में खड़ा रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजाओं का विरोध करता रहा है।” यूनानी शब्द राजाओं के विरुद्ध खड़े होने या उनके विरुद्ध मोर्चा लेने का भाव भी व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέγνων
  choice: मैंने पढ़ लिया है
  rationale: पत्र के उत्तर की प्रशासनिक शैली में यूनानी एओरिस्ट का यह स्वाभाविक हिन्दी रूप है; इससे यह भी स्पष्ट होता है कि पत्र पढ़ने के बाद जाँच की आज्ञा दी गई।
- source_word: ἐπιστολήν
  choice: पत्र
  rationale: यह सामान्य और सटीक अर्थ है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπέταξα
  choice: मैंने ... आज्ञा दी
  rationale: क्रिया किसी आधिकारिक आदेश के जारी किए जाने को व्यक्त करती है; ‘आज्ञा दी’ राजकीय-प्रशासनिक लहजा बनाए रखता है।
- source_word: ἐπισκέψασθαι
  choice: जाँच करने
  rationale: इस प्रशासनिक प्रसंग में इसका अर्थ मामले की आधिकारिक छानबीन या परीक्षण करना है।
- source_word: εὑρέθη
  choice: यह पाया गया
  rationale: यूनानी कर्मवाच्य की औपचारिक प्रतिवेदन-शैली को सीधे बनाए रखता है।
- source_word: ἐξ αἰῶνος
  choice: प्राचीन काल से ही
  rationale: यहाँ वाक्यांश अनादि काल नहीं, बल्कि लंबे ऐतिहासिक समय से चले आ रहे व्यवहार को दर्शाता है।
- source_word: ἀντιπαρατάσσουσα
  choice: विरुद्ध खड़ा होता आया है
  rationale: यह उस नगर के राजाओं के विरोध में अपना पक्ष जमाने या मोर्चा लेने की क्रियात्मक छवि को बनाए रखता है, पर इसे अनिवार्य रूप से खुले विद्रोह के रूप में नहीं बढ़ाता।
- source_word: βασιλεῦσιν
  choice: राजाओं
  rationale: बहुवचन का सीधा और प्रसंगानुकूल हिन्दी रूप, जो सामान्य ऐतिहासिक अर्थ को बनाए रखता है।
