base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: hi
  text: 'तब राजा ने राथ्युम[a] को, जो प्रस्तुत किए गए मामलों का अभिलेख रखता था[b], बेलतेथ्मुस को, लेखक सामेल्लियुस को, तथा उनके बाकी सहयोगियों को, जो सामरिया, सीरिया और फीनीके में रहते थे, निम्नलिखित उत्तर लिख भेजा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर अरामी परंपरा में नाम और शब्दावली भिन्न हैं। यहाँ 1 एस्द्रास के यूनानी पाठ के नाम का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “जो सामने लाए गए विषयों को लिखता था”; यह किसी प्रशासनिक अधिकारी या सचिव के कार्य का संकेत हो सकता है।
    reason: lexical_alternative
