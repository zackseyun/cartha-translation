base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: hi
  text: 'फ़ारसियों का राजा कुस्रू यह कहता है: इस्राएल के प्रभु[a], परमप्रधान प्रभु ने मुझे संसार का राजा नियुक्त किया है,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 1:2 के इब्रानी समानांतर में इसके स्थान पर ‘यहोवा, स्वर्ग के परमेश्वर’ लिखा है। यहाँ 1 एस्द्रास की घोषणा का यूनानी रूप प्रस्तुत है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: यह कहता है
  rationale: राजकीय घोषणा के सूत्रात्मक भाव को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: फ़ारसियों का राजा कुस्रू
  rationale: यूनानी के बहुवचन जातिनाम ‘फ़ारसियों’ और उसके पदबंध-क्रम को यथासंभव बनाए रखता है; ‘कुस्रू’ हिन्दी बाइबलीय परंपरा में प्रचलित नाम है।
- source_word: Ἐμὲ ἀνέδειξεν
  choice: मुझे ... नियुक्त किया है
  rationale: यहाँ ἀναδείκνυμι राजपद पर प्रतिष्ठित या नियुक्त करने का बोध देता है; ‘नियुक्त किया है’ स्पष्ट और स्वाभाविक है।
- source_word: βασιλέα
  choice: राजा
  rationale: क्रिया के साथ विधेय कर्म के रूप में राजकीय पद को सीधे व्यक्त करता है।
- source_word: τῆς οἰκουμένης
  choice: संसार का
  rationale: οἰκουμένη के बसे हुए अथवा साम्राज्यगत जगत के व्यापक दावे को संक्षिप्त, सहज हिन्दी में सुरक्षित रखता है।
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु
  rationale: यूनानी पाठ के विशिष्ट पदनाम का सीधा अनुवाद है; समानांतर इब्रानी पाठ की भिन्न उपाधि को मुख्य पाठ में नहीं मिलाया गया।
- source_word: Κύριος ὁ ὕψιστος
  choice: परमप्रधान प्रभु
  rationale: κύριος और ὕψιστος दोनों को सुरक्षित रखते हुए पूर्ववर्ती ईश्वरीय उपाधि के समानाधिकरण के रूप में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: यूनानी 1 एस्द्रास और एज्रा 1:2 के इब्रानी समानांतर में ईश्वरीय उपाधि का अंतर
  choice: इस्राएल के प्रभु, परमप्रधान प्रभु
  alternative: यहोवा, स्वर्ग के परमेश्वर
  rationale: मुख्य पाठ का आधार यूनानी साक्ष्य है, जिसमें यही उपाधियाँ हैं। इब्रानी समानांतर की भिन्नता पारदर्शिता हेतु पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय घोषणा के अनुरूप गरिमापूर्ण किंतु साधारण पाठकों के लिए स्पष्ट शैली। पद के अंत का अल्पविराम बनाए रखा गया है क्योंकि यूनानी वाक्य आगे जारी रहता है।
