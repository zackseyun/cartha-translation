base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: hi
  text: 'और इनकी संख्या यह थी: पेय-बलि के सोने के एक हज़ार कटोरे, पेय-बलि के चाँदी के एक हज़ार कटोरे, चाँदी के उनतीस धूपदान, सोने के तीस कटोरे, चाँदी के दो हज़ार चार सौ दस कटोरे[a], और एक हज़ार अन्य पात्र।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीटे के यूनानी पाठ में अंक-रूप ,βυʹ के पहले हजार का चिह्न है। सामान्य यूनानी अंक-पद्धति में इसे 2,400 पढ़ा जाता है; इसके बाद δέκα (“दस”) है। इसलिए यहाँ 2,410 अनुवादित किया गया है। अंक-रूप की प्रस्तुति कठिन होने के कारण यह पाठन पादटिप्पणी में स्पष्ट किया गया है।
    reason: textual_variant
  - marker: b
    text: एज्रा 1:9 के इब्रानी समानांतर पाठ में इस स्थान पर वस्तुओं और संख्याओं की सूची अलग है। 1 एस्द्रास का यूनानी पाठ अधिक विस्तृत और भिन्न क्रम वाली सूची देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: और उनकी गिनती यह थी
  rationale: यूनानी गणना-सूत्र का स्वाभाविक और स्पष्ट हिन्दी रूप; ‘इनकी संख्या’ भी संभव है, पर वस्तुओं की सूची से पहले ‘उनकी गिनती’ सहज है।
- source_word: σπονδεῖα
  choice: अर्घ चढ़ाने के कटोरे
  rationale: यह शब्द σπονδή, अर्थात तरल अर्पण, से जुड़ा है। ‘अर्घ चढ़ाने के’ पात्रों का धार्मिक उपयोग स्पष्ट करता है और केवल ‘कटोरे’ कहने से अधिक विशिष्ट है।
- source_word: χρυσᾶ / ἀργυρᾶ
  choice: सोने के / चाँदी के
  rationale: सामग्री बताने वाले यूनानी विशेषणों का आधुनिक मानक हिन्दी में स्वाभाविक रूप।
- source_word: θυίσκαι ἀργυραῖ
  choice: चाँदी के धूपदान
  rationale: θυίσκη धूप या बलिदानी अग्नि से जुड़ा पात्र है; मन्दिर की सामग्री की सूची में ‘धूपदान’ सबसे स्पष्ट सामान्य हिन्दी शब्द है।
- source_word: φιάλαι
  choice: कटोरे
  rationale: φιάλη चौड़ा और उथला अनुष्ठानिक पात्र है। ‘कटोरे’ सहज और बोधगम्य है; ‘कटोरेनुमा तश्तरियाँ’ अनावश्यक रूप से व्याख्यात्मक होता।
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: चाँदी के दो हज़ार चार सौ दस कटोरे
  rationale: यूनानी अंक-संकेत ,βυʹ का मान 2,400 है और उसके बाद δέκα ‘दस’ है; अतः कुल 2,410 होता है। यह मूल यूनानी साक्ष्य के अनुसार है, भले ही अंग्रेज़ी परामर्श-पाठ ने इसे 210 समझा हो।
- source_word: ἄλλα σκεύη
  choice: अन्य पात्र
  rationale: मन्दिर की सूची में σκεύη पात्रों और उपकरणों का व्यापक शब्द है; यहाँ ‘पात्र’ संक्षिप्त और प्रसंगानुकूल है।
