base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: hi
  text: ये वे लोग हैं जो यहूदिया से निर्वासन की बंदी दशा से ऊपर आए थे[a] और जिन्हें बाबुल के राजा नबूकदनेस्सर ने बंदी बनाकर बाबुल भेज दिया था[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 2:1 के इब्रानी समानांतर पाठ में “यहूदिया से” के स्थान पर “प्रदेश के लोग” (शाब्दिक रूप से, “प्रदेश के पुत्र”) है। यहाँ 1 एस्द्रास के यूनानी पाठ को प्राथमिक मानकर अनुवाद किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “जिन्हें बाबुल के राजा नबूकदनेस्सर ने बाबुल में निर्वासित किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: ये वे लोग हैं
  rationale: δὲ का संबंधसूचक बल हल्का है; हिन्दी में अलग संयोजक जोड़े बिना परिचयात्मक वाक्य स्वाभाविक रहता है।
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: जो यहूदिया से
  rationale: यूनानी पाठ स्पष्ट रूप से Ἰουδαία कहता है; इसलिए प्राथमिक यूनानी साक्ष्य के अनुसार ‘यहूदिया’ रखा गया है, न कि समानांतर इब्रानी का ‘प्रदेश के पुत्र’।
- source_word: οἱ ἀναβάντες
  choice: ऊपर आए थे
  rationale: ἀναβαίνω के चढ़ने/ऊपर आने के भौगोलिक मुहावरे को सुरक्षित रखा गया है; केवल ‘लौटे’ कहने से यह बिंब मिट जाता।
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: निर्वासन की बंदी दशा से निकलकर
  rationale: αἰχμαλωσία को ‘बंदी दशा’ और παροικία को इस पुनर्स्थापना-संदर्भ में ‘निर्वासन’ दिया गया है। ‘निकलकर’ हिन्दी में ἐκ के आशय को स्वाभाविक बनाता है और दोहरे संबंध को यथासंभव बनाए रखता है।
- source_word: οὓς μετῴκισεν
  choice: जिन्हें … निर्वासित कर दिया था
  rationale: μετοικίζω जबरन स्थानांतरण/देश-निकाले का संकेत देता है। ‘निर्वासित कर दिया’ आधुनिक हिन्दी में स्पष्ट है; ‘बंदी बनाकर ले गया’ संभावित है, पर क्रिया के पुनर्वासात्मक बल को कम कर सकता है।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर
  rationale: राजा के नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप चुना गया है।
- source_word: βασιλεὺς Βαβυλῶνος
  choice: बाबुल के राजा
  rationale: यूनानी में पद निश्चित अर्थ रखता है; हिन्दी की स्वाभाविक संबंध-रचना अपनाई गई है।
- source_word: εἰς Βαβυλῶνα
  choice: बाबुल में
  rationale: निर्वासित करने की हिन्दी क्रिया के साथ गंतव्य के लिए ‘में’ स्वाभाविक है; अर्थ ‘बाबुल को/तक’ ही है।
