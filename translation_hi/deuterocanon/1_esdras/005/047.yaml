base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: hi
  text: तब योसादाक का पुत्र येशू[a] उठा[b], और उसने अपने भाई याजकों तथा शालतीएल के पुत्र जरुब्बाबेल और उसके भाइयों के साथ मिलकर इस्राएल के परमेश्वर की वेदी तैयार की,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी नाम Ἰησοῦς निर्वासन के बाद के याजकीय व्यक्ति येशू के लिए है, न कि नासरत के यीशु के लिए। समानांतर इब्रानी परंपरा येशू/यहोशू नामरूप का समर्थन करती है।
    reason: cross_reference
  - marker: b
    text: या, “खड़ा हुआ” या “उठ खड़ा हुआ।” यूनानी कृदंत निर्णायक कार्य के आरम्भ का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: उठा
  rationale: यह क्रिया निर्णायक कार्य आरम्भ करने के लिए उठने का भाव देती है। ‘उठा’ स्वाभाविक हिन्दी है और केवल शारीरिक रूप से खड़े होने तक अर्थ को सीमित नहीं करती।
- source_word: Ἰησοῦς
  choice: येशू
  rationale: यह निर्वासन के बाद के याजकीय व्यक्ति का नाम है। ‘येशू’ उस नाम को यीशु नासरी से अलग रखता है और उत्तर-निर्वासनकालीन सेमेटिक नामरूप के निकट है।
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: योसादाक का पुत्र
  rationale: यूनानी संबंधकारक से व्यक्त पितृनाम को स्वाभाविक हिन्दी में ‘का पुत्र’ से स्पष्ट किया गया है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: उसके भाई, जो याजक थे
  rationale: यह ἀδελφοί का शाब्दिक अर्थ और याजकीय विशेषण—दोनों स्पष्ट रखता है।
- source_word: Ζοροβαβὲλ
  choice: जरुब्बाबेल
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित, पहचाना जाने वाला नामरूप है।
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: शालतीएल का पुत्र
  rationale: पितृनाम को स्वाभाविक हिन्दी में व्यक्त किया गया और परिचित सेमेटिक नामरूप अपनाया गया है।
- source_word: ἡτοίμασαν
  choice: तैयार की
  rationale: क्रिया का सीधा अर्थ ‘तैयार करना’ है। ‘स्थापित की’ वेदी को खड़ा करने का ऐसा भौतिक विवरण जोड़ सकता है जो यहाँ स्पष्ट नहीं है।
- source_word: τὸ θυσιαστήριον
  choice: वेदी
  rationale: θυσιαστήριον के लिए मानक और पर्याप्त हिन्दी धार्मिक शब्द।
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर की
  rationale: यूनानी संबंधकारक वेदी का इस्राएल के परमेश्वर से संबंध या समर्पण व्यक्त करता है; हिन्दी संबंधसूचक रूप इसे सीधे और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: Ἰησοῦς नाम की पहचान
  choice: येशू
  alternative: यीशु / यहोशू
  rationale: संदर्भ निर्वासन के बाद के महायाजकीय व्यक्ति का है, यीशु नासरी का नहीं। ‘येशू’ ऐतिहासिक पहचान बनाए रखते हुए अनावश्यक ईसाई-संबंधी भ्रम से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। नामों के लिए हिन्दी बाइबलीय प्रचलन और मूल यूनानी के ऐतिहासिक संदर्भ में संतुलन रखा गया है। यूनानी वाक्य की सहभागी संरचना को स्पष्ट हिन्दी उपवाक्यों में बदला गया है, बिना यह जोड़ने के कि अन्य लोग भी अलग से ‘उठे’। अंतिम अल्पविराम अगले पद में वाक्य जारी रहने का संकेत देता है।
