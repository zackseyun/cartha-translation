base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: hi
  text: और वे जरुब्बाबेल, येशू और पितृकुलों के मुखियाओं के पास आकर उनसे बोले, “हम तुम्हारे साथ मिलकर निर्माण करेंगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तुम्हारे साथ मिलकर बनाएँगे।” यूनानी क्रिया का अर्थ किसी के साथ मिलकर निर्माण करना है, केवल सामान्य सहायता देना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: के पास आकर
  rationale: यह भूतकालिक कृदंत मुख्य कथन से पहले नेताओं के निकट आने की क्रिया बताता है; हिन्दी में ‘के पास आकर’ स्वाभाविक और सटीक है।
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: जरुब्बाबेल, येशू
  rationale: नामों को उनके उत्तर-निर्वासनकालीन ऐतिहासिक संदर्भ के अनुरूप लिप्यंतरित किया गया है। ‘येशू’ यहाँ महायाजक का नाम है।
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: पितृकुलों के मुखियाओं
  rationale: ἡγούμενοι नेतृत्व करनेवालों को और πατριαί वंश-आधारित पारिवारिक समूहों को दर्शाता है; ‘पितृकुलों के मुखिया’ उस सामाजिक संरचना को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: λέγουσιν
  choice: बोले
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-प्रवाह में स्वाभाविक भूतकाल से व्यक्त किया गया है; आशय में कोई परिवर्तन नहीं होता।
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: हम तुम्हारे साथ मिलकर निर्माण करेंगे
  rationale: संयुक्त क्रिया συνοικοδομέω में साथ मिलकर निर्माण करने का स्पष्ट भाव है; ‘साथ मिलकर’ उसके συν- उपसर्ग की शक्ति बनाए रखता है।
theological_decisions:
- issue: उत्तर-निर्वासनकालीन संदर्भ में Ἰησοῦ का रूप
  choice: येशू
  alternative: यीशु / यहोशू
  rationale: यूनानी रूप वही है जो नए नियम में यीशु के लिए आता है, पर यहाँ संदर्भ पुनर्स्थापना-काल के महायाजक का है। ‘येशू’ ऐतिहासिक व्यक्ति की पहचान स्पष्ट रखता और अनचाहा मसीही संकेत टालता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पितृकुल’ ऐतिहासिक वंश-समूह का अर्थ बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
