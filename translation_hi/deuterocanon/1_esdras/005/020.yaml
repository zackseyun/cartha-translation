base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/020.yaml
  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
translation:
  language: hi
  text: खदियासै और अम्मिदियोई के वंशज, चार सौ बाईस; केइरामास कब्बेस से आए लोग,[a] छह सौ इक्कीस।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का निकट अर्थ है, “केइरामास कब्बेस से आए लोग।” इन दोनों नामों का आपसी संबंध स्पष्ट नहीं है; सूची की शैली के आधार पर इसे किसी कुल या समूह का उल्लेख भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: एज्रा-नहेमायाह का इब्रानी समानांतर पाठ यहाँ इन नामों और संख्याओं से निकटता से मेल नहीं खाता। इसलिए अनुवाद में प्रधान स्रोत के रूप में यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: खदियासै और अम्मिदियोई के वंशज
  rationale: जनगणना-सदृश वंश-सूची में οἱ समूह या कुल को सूचित करता है; इसलिए स्वाभाविक हिन्दी में निहित अर्थ को ‘वंशज’ से व्यक्त किया गया है। दोनों नाम प्रधान यूनानी पाठ से लिप्यंतरित हैं।
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: चार सौ बाईस
  rationale: यूनानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: केइरामास कब्बेस से आए लोग
  rationale: ἐκ के स्पष्ट ‘से/में से’ अर्थ को बनाए रखा गया है। यूनानी में Κειράμας और Κάββης के बीच संयोजक नहीं है, इसलिए हिन्दी पाठ में भी ‘और’ जोड़कर अस्पष्ट संबंध का समाधान नहीं किया गया।
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: छः सौ इक्कीस
  rationale: यूनानी संख्या का सीधा और सुबोध हिन्दी रूप।
