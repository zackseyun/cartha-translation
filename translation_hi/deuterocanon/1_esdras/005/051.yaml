base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: hi
  text: और इसके बाद नियमित चढ़ावे[a], तथा सब्तों, नए चाँदों और सभी पवित्र ठहराए गए पर्वों के लिए बलिदान चढ़ाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निरंतर चढ़ावे।’ यूनानी शब्द लगातार किए जाने वाले अथवा निर्धारित क्रम से बार-बार चढ़ाए जाने वाले चढ़ावों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह स्वाभाविक कालसूचक संक्रमण है; यूनानी बहुवचन ταῦτα का आशय पहले बताए गए कार्यों से है, जिसे हिन्दी में मुहावरेदार ढंग से ‘इसके बाद’ कहा गया है।
- source_word: προσφορὰς
  choice: चढ़ावे
  rationale: उपासना में अर्पित वस्तुओं के लिए यह सहज और व्यापक हिन्दी शब्द है तथा आगे आए अधिक विशिष्ट ‘बलिदान’ से भेद बनाए रखता है।
- source_word: ἐνδελεχισμοῦ
  choice: नियमित
  rationale: यह शब्द निरंतरता अथवा निर्धारित अंतराल पर बार-बार होने का भाव दे सकता है। ‘नियमित’ पवित्र उपासना-क्रम के प्रसंग में दोनों संभावनाओं को पर्याप्त रूप से समेटता है।
- source_word: θυσίας
  choice: बलिदान
  rationale: यह προσφοραί से अधिक विशिष्ट बलि-संबंधी शब्द है; इसलिए दोनों यूनानी पदों का भेद सुरक्षित रखा गया है।
- source_word: σαββάτων
  choice: सब्तों
  rationale: यूनानी बहुवचन आवर्ती सब्त-दिवसों की ओर संकेत करता है; हिन्दी में बहुवचन बनाए रखा गया है।
- source_word: νουμηνιῶν
  choice: नए चाँद के दिनों
  rationale: इससे मासिक अमावस्या/नवचंद्र से जुड़े धार्मिक पालन का अर्थ सामान्य पाठक के लिए स्पष्ट होता है, बिना इसे केवल खगोलीय घटना तक सीमित किए।
- source_word: ἑορτῶν
  choice: पर्वों
  rationale: धार्मिक पंचांग के संदर्भ में ‘पर्व’ स्वाभाविक, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: πασῶν ἡγιασμένων
  choice: सभी पवित्र ठहराए गए
  rationale: कृदंत ἡγιασμένων इन पर्वों के धार्मिक रीति से अलग ठहराए जाने का भाव देता है; ‘पवित्र ठहराए गए’ उस प्रक्रिया और स्थिति दोनों को व्यक्त करता है।
theological_decisions:
- issue: यूनानी पाठ की संक्षिप्त उपासना-सूची और एज्रा के निकटवर्ती इब्रानी समानांतर के बीच अंतर
  choice: यूनानी के अनुसार नियमित चढ़ावों और सब्तों, नए चाँद के दिनों तथा पवित्र पर्वों के बलिदानों की व्यापक सूची रखी गई है।
  alternative: इब्रानी समानांतर के अनुसार ‘प्रतिदिन, प्रत्येक दिन के नियत विधान के अनुसार’ होमबलि पर विशेष बल देना।
  rationale: 1 एस्द्रास के लिए दिया गया यूनानी पाठ प्राथमिक आधार है। इब्रानी समानांतर अर्थ की जाँच में सहायक है, पर वह अनुमानित समानांतर है और यूनानी की व्यापक धार्मिक-पंचांग सूची को संकुचित नहीं करना चाहिए।
- issue: ἐνδελεχισμοῦ में निरंतरता बनाम नियत आवृत्ति
  choice: नियमित
  alternative: निरंतर
  rationale: पद में लगातार चलते रहने और निर्धारित क्रम से बार-बार होने, दोनों की अर्थ-संभावना है। मुख्य पाठ में सहज ‘नियमित’ रखा गया और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; धार्मिक-पंचांग की भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य में क्रिया निहित है, इसलिए पूर्ण हिन्दी वाक्य के लिए ‘चढ़ाए गए’ स्पष्ट रूप से जोड़ा गया है।
