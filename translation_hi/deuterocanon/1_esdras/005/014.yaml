  yaml_path: translation/deuterocanon/1_esdras/005/014.yaml
  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: hi
  text: अदोनीकाम के वंशज[a] सैंतीस; बोसाई के वंशज दो हज़ार छह सौ छह; अदीलियोन के वंशज चार सौ चौवन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में अदोनीकाम के वंशजों की संख्या ‘सैंतीस’ है; एज्रा-नहेमायाह की मसोराई पाठ-परंपरा के समानांतर में ‘छह सौ छियासठ’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: इस जनगणना-सदृश वंशावली में यह पद किसी परिवार या कुल से संबंधित लोगों को दर्शाता है। शाब्दिक ‘पुत्र’ की अपेक्षा ‘वंशज’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Ἀδωνεικάμ
  choice: अदोनीकाम
  rationale: यूनानी रूप का देवनागरी लिप्यंतरण किया गया है; सामी समानांतर भी इसी नाम-रूप की पुष्टि करता है।
- source_word: τριάκοντα ἑπτά
  choice: सैंतीस
  rationale: यूनानी पाठ की संख्या 37 को यथावत रखा गया है; इसे सामी समानांतर की भिन्न संख्या से नहीं मिलाया गया।
- source_word: Βοσαί
  choice: बोसाई
  rationale: नाम को उपलब्ध यूनानी रूप के आधार पर सीधे देवनागरी में लिप्यंतरित किया गया है।
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: दो हज़ार छह सौ छह
  rationale: यूनानी पाठ की संख्या 2,606 का ठीक और स्वाभाविक हिन्दी रूप।
- source_word: Ἀδειλίου
  choice: अदीलियोन
  rationale: सम्बन्धकारक यूनानी नाम-रूप को परिवार के नाम के रूप में लिप्यंतरित किया गया है; किसी अनुमानित इब्रानी रूप से इसका सामंजस्य नहीं कराया गया।
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: चार सौ चौवन
  rationale: यूनानी पाठ की संख्या 454 का ठीक और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: वापस लौटनेवालों की सूची में यूनानी पाठ और मसोराई समानांतर के बीच नामों तथा संख्याओं का अंतर
  choice: 1 एस्द्रास के यूनानी पाठ में दी गई संख्याओं और नामों का अनुवाद बिना सामंजस्य कराए किया गया है।
  alternative: अदोनीकाम की संख्या को मसोराई समानांतर के अनुसार ‘छह सौ छियासठ’ कर देना।
  rationale: इस पुस्तक के लिए यूनानी पाठ प्राथमिक स्रोत है। महत्वपूर्ण पाठांतर को मुख्य पाठ में चुपचाप बदलने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
