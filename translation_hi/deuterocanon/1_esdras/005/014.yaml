  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली अपनाई गई है। ‘के वंशज’ वंशगत समूह का अर्थ सहज रूप से बताता है; संख्याएँ शब्दों में लिखी गई हैं और व्यक्तिनाम यूनानी स्रोत से लिप्यंतरित हैं।
