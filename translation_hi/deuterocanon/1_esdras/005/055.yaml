base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: hi
  text: और उन्होंने यहूदिया और यरूशलेम में अपने आ जाने के बाद दूसरे वर्ष के दूसरे महीने की अमावस्या के दिन परमेश्वर के मंदिर की नींव डाली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: नींव डाली
  rationale: क्रिया का अर्थ नींव रखना या स्थापित करना है; मन्दिर-निर्माण के प्रसंग में यह स्वाभाविक और सटीक हिन्दी है।
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: परमेश्वर के मन्दिर
  rationale: ναός यहाँ उपासना-स्थल के भवन को सीधे दर्शाता है; इसलिए ‘मन्दिर’ ‘भवन’ या ‘घर’ से अधिक सटीक है।
- source_word: τῇ νουμηνίᾳ τοῦ δευτέρου μηνὸς
  choice: दूसरे महीने की अमावस्या को
  rationale: νουμηνία नए चाँद अथवा नए महीने के आरम्भ का द्योतक है; ‘अमावस्या’ हिन्दी में इसका स्वाभाविक पंचांगीय रूप है और इसे केवल ‘पहला दिन’ बनाकर विशिष्टता नहीं मिटाता।
- source_word: τοῦ δευτέρου ἔτους
  choice: दूसरे वर्ष
  rationale: यह आगमन से गिने गए वर्ष का काल-सूचक है।
- source_word: ἐν τῷ ἐλθεῖν εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम में उनके आने के
  rationale: ἐν के साथ articular infinitive यहाँ समय बताता है। हिन्दी संरचना इसे ‘आने के दूसरे वर्ष’ के रूप में सहजता से व्यक्त करती है, जबकि εἰς की गंतव्य-भावना ‘में आने’ से बनी रहती है।
theological_decisions:
- issue: मन्दिर के लिए ναός का अनुवाद
  choice: परमेश्वर का मन्दिर
  alternative: परमेश्वर का भवन / परमेश्वर का घर
  rationale: यूनानी पाठ स्पष्टतः ναός कहता है। ‘मन्दिर’ इसी उपासना-भवन को सीधे व्यक्त करता है और किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। काल-सूचना को हिन्दी में स्वाभाविक क्रम में रखा गया है। ‘अमावस्या’ नए चाँद/मासारम्भ का परिचित धार्मिक-पंचांगीय पद है।
