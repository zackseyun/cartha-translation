base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: hi
  text: और उन्होंने झोंपड़ियों का पर्व[a] मनाया, जैसा व्यवस्था में आज्ञा दी गई है, और प्रतिदिन बलिदान चढ़ाए, जैसा उचित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पारंपरिक रूप से, “मण्डपों का पर्व।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: मनाया
  rationale: पर्व के साथ प्रयुक्त ἄγω का मुहावरेदार अर्थ पर्व मनाना या उसका पालन करना है; आधुनिक हिन्दी में ‘मनाया’ स्वाभाविक और स्पष्ट है।
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: झोंपड़ियों का पर्व
  rationale: σκηνοπηγία अस्थायी झोंपड़ियाँ बनाने और उनमें रहने से जुड़े पर्व को दर्शाता है। यह चयन मूल बिंब को पारंपरिक नाम की अपेक्षा अधिक पारदर्शी ढंग से रखता है।
- source_word: ὡς ἐπιτέτακται
  choice: जैसा ... आज्ञा दी गई है
  rationale: पूर्णकालिक कर्मवाच्य रूप उस आज्ञा की वर्तमान और स्थायी वैधता व्यक्त करता है; हिन्दी का यह रूप उसी बल को बनाए रखता है।
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: वाक्यांश आज्ञा को विधिक धर्मग्रंथ में स्थित करता है। बाइबलीय हिन्दी में νόμος के लिए ‘व्यवस्था’ स्वाभाविक और समझने योग्य है।
- source_word: θυσίας
  choice: बलिदान
  rationale: θυσία का सीधा संदर्भ बलि-सम्बन्धी चढ़ावों से है; ‘बलिदान’ संदर्भ के अनुरूप मानक हिन्दी पद है।
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह वितरणात्मक वाक्यांश हर दिन दोहराई गई क्रिया को व्यक्त करता है; ‘प्रतिदिन’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ὡς προσῆκον ἦν
  choice: जैसा उचित था
  rationale: यह वाक्यांश परिस्थिति के अनुसार उचित या उपयुक्त होने को दर्शाता है। ‘उचित’ इसे दूसरी बार स्पष्ट कानूनी आज्ञा बनाए बिना अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: पर्व के नाम σκηνοπηγία का अनुवाद
  choice: झोंपड़ियों का पर्व
  alternative: मण्डपों का पर्व
  rationale: ‘झोंपड़ियों’ से मूल अस्थायी आश्रयों का ठोस बिंब आधुनिक पाठक के लिए स्पष्ट रहता है; पारंपरिक ‘मण्डपों का पर्व’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘व्यवस्था’, ‘बलिदान चढ़ाए’ और ‘पर्व’ बाइबलीय संदर्भ को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्वाभाविक है।
