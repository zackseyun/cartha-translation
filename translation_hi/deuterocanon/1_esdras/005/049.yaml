  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘वेदी’, ‘बलिदान’, ‘होमबलि’ और ‘प्रभु’ जैसे परिचित बाइबलीय पद रखे गए हैं। कठिन यूनानी वाक्य-संरचना को इतना ही व्यवस्थित किया गया है कि हिन्दी स्वाभाविक रहे; कर्ताओं की वास्तविक अस्पष्टता और विरोधपूर्ण घटनाक्रम को अनावश्यक व्याख्या से नहीं सुलझाया गया।
