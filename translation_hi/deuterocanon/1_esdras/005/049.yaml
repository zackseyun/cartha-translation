base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: hi
  text: और देश की अन्य जातियों में से लोग उनके साथ आ मिले[a], और वे वेदी पर अपने स्थान में स्थापित हुए; क्योंकि वे उनके प्रति शत्रुता रखते थे। देश की सभी जातियाँ उन पर प्रबल हुईं, और वे नियत समय पर बलिदान तथा प्रभु के लिए पूर्ण होमबलियाँ[c] सुबह और शाम चढ़ाते रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके साथ इकट्ठे हुए।’ यूनानी क्रिया यह संकेत दे सकती है कि अन्य जातियों के लोग लौटे हुए समुदाय के साथ आ जुड़े।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ एज्रा 3:2 के निकटवर्ती इब्रानी समानान्तर से अधिक विस्तृत है। इसमें देश की जातियों की शत्रुता और प्रबलता तथा सुबह-शाम नियमित रूप से बलिदान चढ़ाने का उल्लेख भी है।
    reason: cross_reference
  - marker: c
    text: या ‘होमबलियाँ।’ यूनानी शब्द विशेष रूप से ऐसी भेंट का बोध करा सकता है जो आग में पूरी तरह भस्म की जाती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: लोग उनके साथ आ मिले
  rationale: यूनानी क्रिया के मध्यवाच्य/कर्मवाच्य भाव में किसी समुदाय के साथ स्वयं आ जुड़ने का संकेत हो सकता है। यह अनुवाद उस भाव को सहज आधुनिक हिन्दी में रखता है; ‘लोग’ केवल अन्तर्निहित कर्ता को स्पष्ट करता है, ‘कुछ लोग’ जैसी अतिरिक्त मात्रा नहीं जोड़ता।
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: देश की दूसरी जातियों में से
  rationale: ἔθνη के लिए ‘जातियाँ’ यहाँ राष्ट्रों/जनसमूहों का व्यापक अर्थ देता है। ‘आस-पास की’ कहने से ऐसी भौगोलिक सूचना जुड़ जाती जो यूनानी में स्पष्ट नहीं है।
- source_word: κατωρθώθησαν
  choice: दृढ़ हुए
  rationale: सन्दर्भ में कठिन इस क्रिया का अर्थ सफलतापूर्वक स्थिर या सुदृढ़ होना हो सकता है। ‘दृढ़ हुए’ इस अर्थ को रखता है, पर वेदी के निर्माण या स्थापना की कोई अनिश्चित व्याख्या आरोपित नहीं करता।
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: वेदी के पास, उसके स्थान पर
  rationale: यह वेदी और उसके नियत स्थल पर स्थानीय बल देता है। हिन्दी में ‘के पास’ व्यक्तियों की वेदी-समीप स्थिति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘उसके स्थान पर’ स्थल-संबंधी बल बनाए रखता है।
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: वे उनके प्रति शत्रुता रखते थे
  rationale: यह ἔχθρα के संज्ञात्मक और संबंधपरक भाव को बनाए रखता है तथा सीधे ‘शत्रु थे’ कहकर पहचान को अधिक कठोर नहीं बनाता।
- source_word: κατίσχυσαν αὐτοὺς
  choice: उन पर प्रबल हुईं
  rationale: क्रिया का विरोधात्मक अर्थ ‘उनके विरुद्ध अधिक शक्तिशाली होना/प्रबल होना’ है। यह हिन्दी उस तनाव को बिना नरम किए व्यक्त करती है।
- source_word: κατὰ τὸν καιρὸν
  choice: नियत समय पर
  rationale: वाक्यांश बलिदानों के उचित या निर्धारित समय का संकेत देता है; ‘नियत समय’ धार्मिक नियमितता को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: ὁλοκαυτώματα
  choice: पूर्ण होमबलियाँ
  rationale: यह यूनानी शब्द आग में पूरी तरह भस्म की जाने वाली भेंट को विशेष रूप से दर्शाता है। ‘पूर्ण’ उस विशिष्टता को सुरक्षित रखता है।
- source_word: Κυρίῳ
  choice: प्रभु के लिए
  rationale: सम्प्रदान कारक उस व्यक्ति को बताता है जिसके लिए भेंट चढ़ाई जाती है। κύριος का मानक और गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है।
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: सुबह और शाम
  rationale: यह दैनिक बलिदान के दो नियमित समयों की स्वाभाविक और स्पष्ट हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: इस पद के विस्तृत यूनानी पाठ और एज्रा 3:2 के निकटवर्ती, पर छोटे, इब्रानी समानान्तर का सम्बन्ध
  choice: 1 एस्द्रास के यूनानी पाठ की सभी धाराओं—जातियों की शत्रुता, उनके प्रबल होने तथा सुबह-शाम बलिदान चढ़ाने सहित—का अनुवाद किया गया है।
  alternative: एज्रा 3:2 के छोटे इब्रानी समानान्तर से सामंजस्य बैठाकर अतिरिक्त यूनानी धाराओं को हटाना या नरम करना।
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है। इब्रानी समानान्तर सहायक साक्ष्य है, इसलिए उसके आधार पर यूनानी पाठ की विशिष्ट और तनावपूर्ण सामग्री हटाना उचित नहीं है।
- issue: देश की दूसरी जातियों का वर्णन
  choice: केवल यूनानी में उपस्थित ‘दूसरी जातियाँ’ और ‘शत्रुता’ की भाषा रखी गई है।
  alternative: उन्हें ‘विदेशी’, ‘अविश्वासी’ या स्थायी रूप से ‘शत्रु’ कहना।
  rationale: मूल पाठ विरोध का वर्णन करता है, पर उन लोगों पर कोई अतिरिक्त जातीय या धर्मवैज्ञानिक निर्णय नहीं देता। अनुवाद वही तनाव रखता है और आगे की श्रेणियाँ नहीं जोड़ता।
- issue: विरोध के बावजूद उपासना जारी रहने का संबंध
  choice: दोनों कथनों को साधारण ‘और’ से जोड़ा गया है।
  alternative: ‘फिर भी’ जोड़कर स्पष्ट विरोधाभासी संबंध स्थापित करना।
  rationale: सन्दर्भ में विरोध के बावजूद बलिदान का भाव सम्भव है, पर यूनानी संयोजक καί केवल ‘और’ है। इसलिए निहित धर्मवैज्ञानिक साहस को स्पष्ट संयोजक जोड़कर निश्चित नहीं किया गया।
