base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: hi
  text: और उन्होंने पत्थर काटने वालों और बढ़इयों को चाँदी दी, और सीदोनियों और सोरवासियों को पेय, भोजन और रसद[a] दी, ताकि वे लबानोन से देवदार की लकड़ियाँ लाएँ और उन्हें बेड़ों द्वारा याफा के बंदरगाह तक पहुँचाएँ, फारसियों के राजा कुस्रू के उन्हें दिए गए लिखित आदेश के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘रसद’ के लिए आया यूनानी शब्द कठिन है; एज्रा 3:7 के समानांतर हिब्रू पाठ में ‘तेल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: चाँदी
  rationale: मूल यूनानी का सीधा अर्थ ‘चाँदी’ है; भुगतान के संदर्भ में यह धन का अर्थ भी दे सकता है, पर ‘चाँदी’ स्रोत की ठोस अभिव्यक्ति बनाए रखती है।
- source_word: λατόμοις
  choice: पत्थर काटने वालों
  rationale: यह शब्द पत्थर काटने या खदान में पत्थर तैयार करने वाले श्रमिकों को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: τέκτοσι
  choice: बढ़इयों
  rationale: मंदिर-निर्माण के इस संदर्भ में यह सामान्य कारीगर की अपेक्षा लकड़ी का काम करने वालों के लिए स्वाभाविक है।
- source_word: ποτὰ καὶ βρωτὰ
  choice: पेय, भोजन
  rationale: दोनों शब्द क्रमशः पीने और खाने की वस्तुओं के सामान्य सामूहिक अर्थ रखते हैं।
- source_word: χάρα
  choice: रसद
  rationale: प्रेषित यूनानी रूप इस संदर्भ में कठिन है। आपूर्ति-सूची और एज्रा 3:7 के समानांतर के आधार पर ‘रसद’ संदर्भानुकूल किंतु अनिर्दिष्ट अनुवाद है।
- source_word: ξύλα κέδρινα
  choice: देवदार की लकड़ियाँ
  rationale: निर्माण के लिए काटी गई देवदार की लकड़ी का ठोस और सहज हिन्दी रूप।
- source_word: διαφέρειν σχεδίαις
  choice: उन्हें बेड़ों पर लादकर ... पहुँचाएँ
  rationale: यह समुद्री मार्ग से बेड़ों द्वारा लकड़ी पहुँचाने की क्रिया और साधन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰόππης λιμένα
  choice: याफा के बंदरगाह
  rationale: Ἰόππη का प्रचलित आधुनिक हिन्दी नाम ‘याफा’ और λιμήν का स्पष्ट अर्थ ‘बंदरगाह’ है।
- source_word: πρόσταγμα τὸ γραφὲν
  choice: लिखित आदेश
  rationale: यह राजकीय रूप से लिखे गए आधिकारिक आदेश को व्यक्त करता है; ‘आदेश’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: Κύρου
  choice: कुस्रू
  rationale: फारसी राजा Cyrus के लिए हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप अपनाया गया है।
theological_decisions:
- issue: कठिन पाठ χάρα और एज्रा 3:7 के समानांतर का उपयोग
  choice: मुख्य पाठ में सामान्य अर्थ ‘रसद’ रखा गया और कठिनाई को पादटिप्पणी में बताया गया।
  alternative: इसे विशेष रूप से ‘तेल’ कहना, अथवा शाब्दिक किंतु संदर्भ में असंगत ‘आनंद’ कहना।
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक है। समानांतर हिब्रू आपूर्ति-सूची का संदर्भ स्पष्ट करता है, पर यूनानी में स्पष्ट रूप से न दिए गए ‘तेल’ को मुख्य पाठ में डालना अत्यधिक निर्णायक होता।
- issue: अंतिम καὶ से जुड़े वाक्य का संबंध
  choice: राजकीय आदेश को पूरी व्यवस्था के आधार के रूप में एक स्वतंत्र समापन वाक्य में व्यक्त किया गया।
  alternative: इसे उसी लंबे वाक्य में ‘और ... आदेश’ के रूप में बनाए रखना।
  rationale: यूनानी समन्वय कुछ ढीला है; हिन्दी में स्वतंत्र वाक्य आशय स्पष्ट करता है, बिना यह तय किए कि आदेश केवल परिवहन पर लागू था या पूरी व्यवस्था पर।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। श्रमिकों और आपूर्ति की सूची को स्पष्ट रखा गया है; कठिन यूनानी पद की अनिश्चितता पादटिप्पणी में संरक्षित है।
