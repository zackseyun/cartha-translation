base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: hi
  text: 'याजक: येशू के पुत्र यद्दूस के वंशज, जो सनाबेइस के वंशजों में से थे,[a] आठ सौ बहत्तर; और एमेरुस के वंशज,[b][c] दो सौ बावन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘सनाबेइस के वंशजों में/की ओर’ है। इस जनगणना-सूची में यह असामान्य रचना सम्भवतः किसी कुल से सम्बद्धता बताती है, न कि गति या उद्देश्य।
    reason: lexical_alternative
  - marker: b
    text: यूनानी नाम ‘एमेरुस’ सम्भवतः उस याजकीय कुल से सम्बद्ध है जिसे इब्रानी परम्परा में अन्यत्र ‘इम्मेर’ कहा गया है। मुख्य पाठ सीधे यूनानी साक्ष्य का अनुसरण करता है।
    reason: alternative_reading
  - marker: c
    text: इस स्थान के लिए उपलब्ध मसोरेटिक समानान्तर इस यूनानी पंक्ति से निकटता से मेल नहीं खाता। 1 एस्द्रास में ज्ञात पुनःक्रम और पुनर्संयोजन को देखते हुए यहाँ यूनानी पाठ को प्राथमिक माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: यह पद जनगणना-सूची में याजकों के समूह का परिचय देता है; संक्षिप्त शीर्षकीय रूप हिन्दी में स्वाभाविक है।
- source_word: οἱ υἱοὶ Ἰέδδου τοῦ υἱοῦ Ἰησοῦ
  choice: येशू के पुत्र यद्दूस के वंशज
  rationale: सूची के सन्दर्भ में υἱοί परिवार अथवा वंशजों को सूचित करता है, जबकि τοῦ υἱοῦ वास्तविक वंश-संबंध बनाए रखता है। Ἰησοῦ के लिए निर्वासनोत्तर नाम-रूप ‘येशू’ अपनाया गया है।
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: जो सनाबेइस के वंशजों में से थे
  rationale: εἰς का प्रयोग यहाँ असामान्य है; इसे दिशा के बजाय कुलगत सम्बद्धता के रूप में संयमपूर्वक व्यक्त किया गया है।
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: आठ सौ बहत्तर
  rationale: संख्या को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में लिखा गया है।
- source_word: υἱοὶ Ἐρμήρου
  choice: एमेरुस के वंशज
  rationale: मुख्य यूनानी साक्ष्य के नाम-रूप को प्राथमिकता दी गई है; वंशावली-सूची में υἱοί का आशय वंशजों से है।
- source_word: διακόσιοι πεντήκοντα δύο
  choice: दो सौ बावन
  rationale: संख्या को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में लिखा गया है।
