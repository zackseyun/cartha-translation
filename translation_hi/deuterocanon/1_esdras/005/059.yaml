base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: hi
  text: और सभी लोगों ने तुरहियाँ फूँकीं और ऊँचे स्वर से पुकार उठे, प्रभु के भवन के खड़े किए जाने[a] के कारण प्रभु की स्तुति करते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुनर्निर्माण किए जाने।” यूनानी में शाब्दिक भाव “उठाए जाने” या “खड़े किए जाने” का है, जो भवन के निर्माण अथवा उसकी बहाली—दोनों की ओर संकेत कर सकता है।
    reason: ἐγέρσις की व्यापक अर्थ-सीमा और प्रसंगानुकूल वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: सभी लोग
  rationale: यह एकत्र समुदाय की समग्रता व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक बहुवचन वाक्य-विन्यास देता है।
- source_word: ἐσάλπισαν
  choice: तुरहियाँ फूँकीं
  rationale: क्रिया का अर्थ तुरही बजाना है; हिन्दी में ‘तुरहियाँ फूँकीं’ स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकार उठे
  rationale: यह क्रिया और उसके साथ आए ‘बड़े/ऊँचे स्वर से’ भाव, दोनों को बनाए रखता है और केवल आनन्द का अर्थ जोड़ने वाले ‘जयजयकार’ से बचता है।
- source_word: ὑμνοῦντες
  choice: स्तुति कर रहे थे
  rationale: कृदन्त की साथ-साथ चल रही क्रिया को स्पष्ट करता है; ‘गाकर’ जोड़ना यूनानी से अधिक विशिष्ट होता।
- source_word: τῷ κυρίῳ
  choice: प्रभु की
  rationale: मन्दिर-सन्दर्भ में यह इस्राएल के परमेश्वर को सूचित करता है; यूनानी κύριος का मानक हिन्दी रूप ‘प्रभु’ रखा गया है।
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: खड़े किए जाने पर
  rationale: ἐγέρσις के मूल ‘उठाने/खड़ा करने’ के बिम्ब को बचाता है और इसे केवल नींव डालने या पुनर्निर्माण तक सीमित नहीं करता।
- source_word: τοῦ οἴκου Κυρίου
  choice: प्रभु के भवन के
  rationale: ‘भवन’ स्रोत के ‘घर’ वाले बिम्ब और धार्मिक सन्दर्भ दोनों को स्वाभाविक हिन्दी में रखता है; ‘मन्दिर’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: मन्दिर-सन्दर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में κύριος है, इसलिए अनूदित दिव्य नाम ‘प्रभु’ उचित है; सीधे इब्रानी विशिष्ट नाम को आयात नहीं किया गया।
- issue: ἐγέρσει से सूचित निर्माण-अवस्था
  choice: खड़े किए जाने
  alternative: पुनर्निर्माण किए जाने
  rationale: यूनानी शब्द भवन को उठाने, खड़ा करने या बहाल करने का व्यापक भाव रख सकता है। मुख्य पाठ उसकी अस्पष्टता बनाए रखता है और प्रसंगानुकूल संकीर्ण विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दो वाक्यों का प्रयोग यूनानी कृदन्त-रचना को सहज हिन्दी में व्यक्त करता है। ‘जयजयकार’ के बजाय ‘पुकार उठे’ रखा गया है ताकि मूल में निहित ऊँची पुकार को अनावश्यक रूप से केवल विजयोल्लास न बनाया जाए।
