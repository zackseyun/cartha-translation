base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/033.yaml
  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: hi
  text: 'सुलैमान के सेवकों के वंशज[a]: अस्सफेइयोत के वंशज, फरेइदा के वंशज, इएएलेई के वंशज, लोज़ोन के वंशज, इस्दाएल के वंशज और सफूएई के वंशज।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ कई कुलों के नाम देता है, जो अनुमानित मसोरेटिक समानांतर से बहुत भिन्न हैं। वहाँ सूची छोटी है: “गिद्देल के वंशज, गहर के वंशज और रायाह के वंशज।”'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: वंशज
  rationale: वंशावली और समुदाय-सूची के इस प्रसंग में यूनानी बहुवचन का आशय परिवार अथवा कुल के सदस्यों से है; ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक है और केवल प्रत्यक्ष पुत्रों का अर्थ लगाने से बचाता है।
- source_word: παίδων Σαλωμών
  choice: सुलैमान के सेवकों
  rationale: παῖς का अर्थ सेवक या दास हो सकता है। इस प्रशासनिक-वंशावली संदर्भ में ‘सेवकों’ स्वाभाविक और पारंपरिक है; पूरा सूत्र ‘सुलैमान के सेवकों के वंशज’ के रूप में व्यक्त किया गया है।
- source_word: Σαλωμών
  choice: सुलैमान
  rationale: राजा के नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: Ἀσσαφειώθ
  choice: अस्सफेयोत
  rationale: असामान्य नाम को यूनानी पाठ के निकट देवनागरी में लिप्यंतरित किया गया है; इसे भिन्न इब्रानी समानांतर के अनुरूप नहीं बनाया गया।
- source_word: Φαρειδά
  choice: फरीदा
  rationale: यूनानी स्वरूप का सुबोध हिन्दी लिप्यंतरण।
- source_word: Ἰεηλεί
  choice: येएली
  rationale: नाम के यूनानी अक्षरक्रम और स्वर-संयोग को यथासंभव बनाए रखने वाला देवनागरी रूप।
- source_word: Λοζών
  choice: लोजोन
  rationale: यूनानी नाम का सीधा और पठनीय हिन्दी लिप्यंतरण।
- source_word: Ἰσδαήλ
  choice: इस्दाएल
  rationale: अपरिचित यूनानी नाम को किसी अधिक परिचित सामी नाम से मिलाए बिना निकट रूप में रखा गया है।
- source_word: Σαφυεί
  choice: सफूएई
  rationale: दुर्लभ नाम के यूनानी υει स्वरक्रम को यथासंभव पारदर्शी रूप से दर्शाया गया है।
theological_decisions:
- issue: यूनानी सूची और नहेमायाह 7:57 के निकटवर्ती मसोराई समानांतर का संबंध
  choice: यूनानी पाठ में दी गई विस्तृत और भिन्न नाम-सूची का उसी रूप में अनुवाद किया गया है।
  alternative: नामों को छोटे मसोराई समानांतर—गिद्देल, गहर और रायाह—के अनुसार मिला देना।
  rationale: 1 एस्द्रास के लिए यूनानी स्रोत प्राथमिक है। इब्रानी समानांतर यहाँ सहायक साक्ष्य है, नियंत्रक पाठ नहीं; इसलिए अंतर को पाठ में मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुकूल हिन्दी। बार-बार आने वाले υἱοὶ के लिए ‘वंशज’ चुना गया है। आरंभिक वर्ग-शीर्षक के बाद कोलन और अंतिम पद से पहले ‘और’ लगाकर सूची को स्वाभाविक बनाया गया है; सभी असामान्य नाम प्राथमिक यूनानी साक्ष्य पर आधारित हैं।
