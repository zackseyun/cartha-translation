  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: hi
  text: और यहूदा के गोत्र का वह व्यक्ति, जिसने फारसियों के राजा दारा के सामने[a] उसके शासन के दूसरे वर्ष में, नीसान महीने में, जो पहला महीना है, बुद्धिमानी की बातें कहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दारा से’ अथवा ‘दारा की उपस्थिति में’; इस दरबारी प्रसंग में यूनानी वाक्यांश ἐπὶ Δαρείου के ये निकटवर्ती अर्थ संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: और यहूदा के गोत्र का
  rationale: φυλή का जातीय-वंशीय संदर्भ में स्वाभाविक मानक हिन्दी रूप ‘गोत्र’ है। δέ को पिछले कथन से जोड़ने के लिए ‘और’ से व्यक्त किया गया है; यूनानी वाक्यांश की संबंधकारकीय अपूर्णता को हिन्दी में ‘का वह व्यक्ति’ से सुबोध बनाया गया है।
- source_word: ἐλάλησεν
  choice: बातें कहीं
  rationale: λαλέω के बोलने के सामान्य अर्थ को सरल भूतकाल में व्यक्त करता है और λόγους के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἐπὶ Δαρείου τοῦ βασιλέως Περσῶν
  choice: फारसियों के राजा दारा के सामने
  rationale: दरबारी प्रसंग में ἐπί के साथ संबंधकारक को राजा की उपस्थिति में बोलने के अर्थ में लिया गया है। ‘के सामने’ इस अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि निकटवर्ती वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: λόγους σοφοὺς
  choice: बुद्धिमानी की बातें
  rationale: यह λόγους के बहुवचन और σοφούς के गुणात्मक अर्थ दोनों को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῷ δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: उसके शासन के दूसरे वर्ष में
  rationale: βασιλεία यहाँ राजा के शासनकाल को दर्शाता है; ‘शासन के दूसरे वर्ष’ हिन्दी का स्पष्ट और प्रचलित काल-सूचक प्रयोग है।
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: पहले महीने नीसान में
  rationale: यह नीसान की पहचान पहले महीने के रूप में बनाए रखता है और यूनानी के आशय को अनावश्यक पुनरुक्ति के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
