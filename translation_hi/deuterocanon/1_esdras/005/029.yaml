base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple servants: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: hi
  text: 'टोबेइस के वंशज कुल एक सौ उनतालीस थे; मंदिर के दास[a]: एसाव के वंशज, तासेइफा के वंशज, ताबाओथ के वंशज, केरास के वंशज, सूआ के वंशज, फलाइऊ के वंशज, लाबाना के वंशज[c][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ἱερόδουλοι का अनुवाद “मंदिर के सेवक” भी किया जा सकता है; “मंदिर के दास” उसके दासत्व या बंधुआ स्थिति के भाव को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: स्रोत पाठ में यह सूची का एक अंश है जो अल्पविराम पर समाप्त होता है; अगला पद मंदिर के दासों की सूची जारी रखता है।
    reason: cross_reference
  - marker: c
    text: नहेमायाह 7:43 का हिब्रू समानांतर यहाँ शब्दशः मेल नहीं खाता; 1 एसद्रास में इस स्थान पर लौटने वालों की सूची का भिन्न भाग दिया गया है।
    reason: alternative_reading
