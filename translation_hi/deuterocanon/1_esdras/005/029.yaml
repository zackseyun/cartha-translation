  rationale: दुर्लभ यूनानी व्यक्तिनाम को उसके स्रोत-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: πάντες
  choice: कुल
  rationale: गिनती के सार को आधुनिक हिन्दी में संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: एक सौ उनतालीस
  rationale: यूनानी पाठ की सटीक संख्या को प्रचलित हिन्दी संख्या-रूप में रखा गया है।
- source_word: οἱ ἱερόδουλοι
  choice: मंदिर के दास
  rationale: ἱερόδουλοι मंदिर से संबद्ध सेवा के साथ दासत्व या बंधुआ सामाजिक स्थिति भी व्यक्त करता है; ‘सेवक’ उस कठोर अर्थ को नरम कर सकता है।
- source_word: Ἠσαύ
  choice: एसाव
  rationale: इस परिचित नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: Τασειφά
  choice: तासेइफा
  rationale: दुर्लभ नाम को यूनानी ध्वनि-रूप के निकट लिप्यंतरित किया गया है।
- source_word: Ταβαώθ
  choice: ताबाओथ
  rationale: नाम का सीधे यूनानी से देवनागरी लिप्यंतरण किया गया है।
- source_word: Κηράς
  choice: केरास
  rationale: यूनानी कप्पा और दीर्घ स्वर को यथासंभव पारदर्शी ढंग से दर्शाया गया है।
- source_word: Σουά
  choice: सूआ
  rationale: यूनानी रूप को प्राथमिक रखते हुए किसी अनुमानित सामी रूप को आरोपित नहीं किया गया है।
- source_word: Φαλαίου
  choice: फलाइऊ
  rationale: दुर्लभ और अनिश्चित नाम के पाठ में उपस्थित यूनानी रूप का निकट लिप्यंतरण रखा गया है।
- source_word: Λαβανά
  choice: लाबाना
  rationale: यूनानी रूप के अंतिम -α को बनाए रखा गया है; इसे अधिक परिचित ‘लाबान’ में नहीं बदला गया।
theological_decisions:
- issue: मंदिर-कर्मियों के लिए ἱερόδουλοι का अनुवाद
  choice: मंदिर के दास
  alternative: मंदिर के सेवक
  rationale: स्रोत शब्द पवित्र-स्थान से जुड़ी सेवा के साथ अधीन या दास स्थिति का संकेत देता है। ‘मंदिर के दास’ इस सामाजिक वास्तविकता को अस्पष्ट नहीं करता, जबकि पादटिप्पणी अधिक कोमल वैकल्पिक अनुवाद बताती है।
- issue: भिन्न मसोरेटिक समानांतर के बजाय यूनानी सूची का अनुसरण
  choice: यूनानी पाठ में दी गई लौटने वालों की सूची का अनुवाद
  alternative: दिए गए हिब्रू समानांतर से लेवियों, येशूअ और कदमीएल संबंधी सामग्री लेना
  rationale: हिब्रू समानांतर इस स्थान पर केवल अनुमानित है और शब्दशः या विषयवस्तु में मेल नहीं खाता; इसलिए 1 एसद्रास के लिए प्राथमिक यूनानी साक्ष्य का ही अनुवाद किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुकूल रखी गई है। बार-बार आए υἱοὶ के लिए ‘वंशज’ चुना गया है, ताकि कुल-सूची का आशय स्पष्ट रहे। यूनानी की निरंतर संरचना दर्शाने के लिए अर्धविराम, द्विबिंदु और अंत में अल्पविराम बनाए गए हैं। सभी दुर्लभ नाम प्राथमिक यूनानी साक्ष्य के निकट देवनागरी में लिप्यंतरित हैं।
