    text: इस पद के यूनानी नाम अनुमानित इब्रानी/मसोराई समानांतर परंपरा से भिन्न हैं। वहाँ इस स्थान पर “हाशूम के पुत्र, दो सौ तेईस” मिलता है। मुख्य पाठ इब्रानी पाठ के साथ सामंजस्य करने के बजाय 1 एस्द्रास के यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: वंशावली और जनगणना-सूची के इस संदर्भ में यह पद किसी परिवार या कुल से संबंधित लोगों को दर्शाता है। आधुनिक हिन्दी में ‘के वंशज’ अर्थ को ‘के पुत्र’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Βαιτηρούς
  choice: बैतेरूस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण किया गया है; इसे निकटवर्ती इब्रानी परंपरा के किसी नाम से मिलाने का प्रयास नहीं किया गया।
- source_word: τρισχίλιοι πέντε
  choice: तीन हज़ार पाँच
  rationale: मूल पाठ की पूर्ण संख्या 3,005 को सूची की शैली में शब्दों से व्यक्त किया गया है।
- source_word: ἐκ Ῥαγεθλωμῶν
  choice: रागेथलोमोन के वंशज
  rationale: यूनानी ἐκ मूल या संबंध का भाव देता है। हिन्दी की स्वाभाविक कुल-सूची शैली में ‘के वंशज’ इस संबंध को स्पष्ट करती है, जबकि नाम यूनानी पाठ के अनुसार रखा गया है।
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: एक सौ तेईस
  rationale: मूल संख्या 123 को आसपास की सूची के अनुरूप शब्दों में दिया गया है।
theological_decisions:
- issue: इस गणना-सूची में यूनानी पाठ के नाम और संख्या निकटवर्ती मसोराई/इब्रानी परंपरा से भिन्न हैं।
  choice: मुख्य पाठ में यूनानी साक्ष्य के ‘बैतेरूस’ और ‘रागेथलोमोन’ तथा उसकी दोनों संख्याएँ रखी गई हैं।
  alternative: इब्रानी समानांतर के अनुसार ‘हाशूम के वंशज, दो सौ तेईस’ पढ़ना।
  rationale: 1 एस्द्रास के लिए प्रस्तुत यूनानी पाठ प्राथमिक स्रोत है। इब्रानी पाठ केवल अनुमानित समानांतर है, इसलिए उसके अनुसार यूनानी सूची का सामंजस्य करना मूल साक्ष्य को बदल देता।
