- source_word: τυμπάνων
  choice: डफों
  rationale: τύμπανον हाथ से बजाए जाने वाले ढोल या तंबूरिन-जैसे तालवाद्य को दर्शाता है। आधुनिक हिन्दी में ‘डफ’ उत्सवी संगीत के संदर्भ में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: αὐλῶν
  choice: बाँसुरियों
  rationale: αὐλός बाँसुरी अथवा सरकंडे से बने पाइप-जैसे वाद्य के लिए प्रयुक्त हो सकता है। ‘बाँसुरी’ सामान्य पाठक के लिए सहज है, जबकि व्यापक अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: ἀδελφοὶ
  choice: भाई
  rationale: यूनानी शब्द स्पष्टतः पुल्लिंग बहुवचन है; इसलिए बिना संदर्भगत आवश्यकता के इसे किसी लिंग-निरपेक्ष संबंध-सूचक शब्द में नहीं बदला गया।
- source_word: παίζοντες
  choice: वाद्य बजा रहे थे
  rationale: παίζω उत्सवी खेल, संगीत या नृत्य का बोध करा सकता है। निकटवर्ती वाद्यों के उल्लेख के कारण संगीत का अर्थ संभावित है; हिन्दी में केवल ‘खेल रहे थे’ भ्रामक होता, इसलिए ‘वाद्य बजा रहे थे’ चुना गया।
- source_word: ἐποίησεν ... συναναβῆναι
  choice: उसने उन्हें ... ऊपर जाने को कहा
  rationale: यह रचना कारणवाचक है और साथ ऊपर जाने का भाव रखती है। ‘जाने को कहा’ स्वाभाविक हिन्दी में प्रेरित/निर्देशित करने का अर्थ देता है, बिना अनिवार्य बल-प्रयोग का भाव जोड़े।
- source_word: μετʼ ἐκείνων
  choice: उन लोगों के साथ
  rationale: ἐκείνων दूरवर्ती संकेतवाचक सर्वनाम है। ‘उन लोगों’ से उसका संकेतवाचक बल बना रहता है; ‘लोगों’ संदर्भ-सापेक्ष पूर्ति है।
