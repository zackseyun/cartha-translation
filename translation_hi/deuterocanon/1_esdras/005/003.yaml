translation:
  language: hi
  text: डफों और बाँसुरियों के साथ।[a] और उनके सभी भाई क्रीड़ा कर रहे थे;[b] और उसने उन्हें उन लोगों के साथ ऊपर जाने को कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नलियों जैसे वाद्यों के साथ।” यूनानी αὐλῶν बाँसुरियों से अधिक व्यापक रूप से सरकंडे की नली से बने या ऐसे ही फूँककर बजाए जाने वाले वाद्यों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी वाक्य अचानक और संदर्भ पर निर्भर है। “उन लोगों” में “लोगों” शब्द संदर्भ से जोड़ा गया है; यूनानी में केवल संकेतवाचक ἐκείνων है, जिसका यहाँ अर्थ “उन लोगों के साथ” है। παίζοντες का अर्थ क्रीड़ा करना है और इसमें उत्सवी संगीत या नृत्य का भाव भी शामिल हो सकता है।
    reason: alternative_reading
