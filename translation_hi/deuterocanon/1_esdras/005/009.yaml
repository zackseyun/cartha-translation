base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
translation:
  language: hi
  text: 'उस जन-समुदाय में से आए लोगों और उनके अगुओं की संख्या: फोरोस[a] के पुत्र, बहत्तर हज़ार[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘फोरोस’ है। इस स्थान पर समानांतर इब्रानी सूची-परंपरा में नाम और संख्या दोनों अलग हैं; संभव है कि 1 एस्द्रास का यूनानी पाठ सूची का कोई भिन्न रूप सुरक्षित रखता हो।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में ‘बहत्तर हज़ार’ है। यह असामान्य रूप से बड़ी संख्या लगभग समानांतर मसोरेटिक पाठ से बहुत अलग है और संभवतः किसी पाठगत समस्या या सूची की किसी भिन्न परंपरा को दर्शाती है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  choice: संख्या
  rationale: यह जनगणना अथवा वंश-सूची के कुल की ओर संकेत करने वाला सीधा शब्द है।
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: उस जाति में से आए लोगों की
  rationale: यह यूनानी पदबंध के ‘जाति/लोगों में से’ अर्थ को बनाए रखता है। ‘उस’ निश्चित लेख का स्वाभाविक हिन्दी रूप है; ‘जाति’ यहाँ किसी सामाजिक वर्ण के बजाय जन-समुदाय के अर्थ में है।
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: उनके अगुए
  rationale: शाब्दिक अर्थ ‘उनके आगे चलनेवाले’ है, पर इस प्रशासनिक वंश-सूची में आशय प्रमुखों या नेताओं से है। ‘अगुए’ बाइबलीय गरिमा और सहजता दोनों रखता है।
- source_word: υἱοὶ
  choice: पुत्र
  rationale: वंश-सूचियों में यह प्रचलित औपचारिक अभिव्यक्ति है और परिवार या कुल के वंशजों को भी सूचित कर सकती है।
- source_word: Φορὸς
  choice: फोरोस
  rationale: यह प्राथमिक यूनानी पाठ के नाम का निकट देवनागरी लिप्यंतरण है; समानांतर इब्रानी सूची में नाम अलग है।
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: बहत्तर हज़ार
  rationale: प्राप्त यूनानी पाठ का स्पष्ट संख्यात्मक अर्थ यही है, यद्यपि सूची के संदर्भ में यह असामान्य रूप से बड़ी संख्या है।
