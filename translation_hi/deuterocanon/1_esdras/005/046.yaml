base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: hi
  text: जब सातवाँ महीना आरम्भ हुआ और इस्राएल के पुत्रों[a] में से हर एक अपने-अपने स्थान पर था[b], तब वे एक मन होकर पूर्व की ओर स्थित पहले फाटक के खुले स्थान[c] में इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “इस्राएली।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्र” है, जो पारिवारिक और वाचा-संबंधी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: नहेमायाह के समानांतर इब्रानी पाठ में इस्राएलियों के अपने-अपने नगरों में बसे होने पर बल है; यहाँ यूनानी पाठ सभा से पहले हर एक के अपने स्थान पर होने की बात कहता है।
    reason: cross_reference
  - marker: c
    text: अथवा, “चौड़ा स्थान” या “चौक।” यूनानी शब्द एक विस्तृत खुली जगह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνστάντος
  choice: आरम्भ हुआ
  rationale: यह संबंधकारक निरपेक्ष रचना सातवें महीने के आ पहुँचने या आरम्भ होने का समय बताती है। ‘आरम्भ हुआ’ स्वाभाविक हिन्दी में कालगत अर्थ स्पष्ट करता है और कोई अनावश्यक संवाद-सूचक शब्द नहीं जोड़ता।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी के पारिवारिक और वाचागत पदबंध को पारदर्शी ढंग से बनाए रखा गया है; अधिक मुहावरेदार विकल्प ‘इस्राएली’ है।
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: हर एक अपने-अपने स्थान पर था
  rationale: यह वाक्यांश प्रत्येक व्यक्ति के अपने स्थान अथवा उससे संबंधित जगह पर बसे होने को व्यक्त करता है। ‘नगरों’ को मुख्य पाठ में नहीं जोड़ा गया, क्योंकि वह समानांतर इब्रानी साक्ष्य में स्पष्ट है, यूनानी में नहीं।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: साधारण कथात्मक क्रिया का सहज आधुनिक हिन्दी रूप।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह केवल एक साथ उपस्थित होने के बजाय साझा उद्देश्य और एकमतता का भाव व्यक्त करता है।
- source_word: εἰς τὸ εὐρύχωρον
  choice: खुले स्थान में
  rationale: यूनानी शब्द किसी चौड़ी या खुली जगह को दर्शाता है; ‘चौक’ कहना संभव है, पर उससे स्थान की प्रकृति आवश्यकता से अधिक निश्चित हो सकती है।
- source_word: τοῦ πρώτου πυλῶνος
  choice: पहले फाटक के
  rationale: वास्तु-संबंधी सूक्ष्म अर्थ अनिश्चित होने के कारण यूनानी के क्रमवाचक ‘पहले’ को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: τοῦ πρὸς τῇ ἀνατολῇ
  choice: पूर्व की ओर स्थित
  rationale: यह पदबंध फाटक की पूर्वी दिशा या स्थिति बताता है; हिन्दी में यह रूप स्वाभाविक और पर्याप्त रूप से अनिर्णीत है।
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ में सामूहिक/वंशगत पुल्लिंग अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल यूनानी की पारिवारिक वाचागत अभिव्यक्ति सुरक्षित रखी गई है, जबकि पादटिप्पणी में स्वाभाविक सामूहिक विकल्प दिया गया है। इससे पाठ में निहित वाचा-संबंधी पारिवारिक भाषा को बिना किसी सांप्रदायिक व्याख्या के बनाए रखा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘एक मन होकर’ सामुदायिक एकता का भाव बनाए रखता है। ‘पहले फाटक’ की वास्तु-संबंधी अनिश्चितता तथा ‘खुले स्थान’ की स्थानगत व्यापकता को व्याख्यात्मक रूप से अधिक निश्चित नहीं किया गया है।
