  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण सूची-वाक्य रखा गया है। मूल यूनानी में क्रिया नहीं है, पर हिन्दी में वाक्य को स्वाभाविक और पूर्ण बनाने के लिए अंत में “थे” जोड़ा गया है। शब्द “ὑποζύγια” की व्यापकता बनाए रखने के लिए किसी विशिष्ट पशु-प्रजाति का नाम नहीं दिया गया। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न “camels” के बाद था, जबकि उसकी टिप्पणी ὑποζύγια से संबंधित है; हिन्दी मुख्य पाठ में चिह्न को संबंधित पदबंध के बाद रखा गया है।
