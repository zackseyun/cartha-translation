  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/042.yaml
  text: camels four hundred thirty-five[a], and horses seven thousand thirty-six, mules two hundred forty-five[b], pack animals five thousand five hundred twenty-five.
translation:
  language: hi
  text: ऊँट चार सौ पैंतीस, घोड़े सात हज़ार छत्तीस, खच्चर दो सौ पैंतालीस, और बोझ ढोने वाले पशु[a] पाँच हज़ार पाँच सौ पच्चीस थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी शब्द का अर्थ व्यापक है: भार उठाने या बोझ ढोने वाले पशु; वैकल्पिक अनुवाद: “भारवाही पशु।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ दिया गया इब्रानी समानांतर पाठ इस पद की विषय-वस्तु से मेल नहीं खाता; इसलिए अनुवाद के लिए यूनानी सूची को आधार माना गया है।
    reason: textual_variant
