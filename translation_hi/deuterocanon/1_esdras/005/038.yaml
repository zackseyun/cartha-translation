base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: hi
  text: 'और याजकों में से वे, जो याजकपद का दावा करते थे पर नहीं पाए गए[a]: ओब्बेइया के वंशज, अकबोस के वंशज, और इयद्दूस के वंशज—इयद्दूस ने फाएक्सेलदाई की बेटियों में से औगिया से विवाह किया था[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल “नहीं पाए गए” कहा गया है। सम्भवतः आशय यह है कि उनका वंशावली-अभिलेख या याजकीय पंजीकरण का अभिलेख नहीं मिला, जैसा एज्रा के समानान्तर में संकेत मिलता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ के व्यक्तिनाम निकटवर्ती इब्रानी समानान्तर पाठ के नामों से भिन्न हैं। अनुवाद ने एज्रा या नहेमायाह के अनुसार नाम बदलने के बजाय 1 एस्द्रास के यूनानी पाठ का अनुसरण किया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: याजकों में से
  rationale: यह पदबंध इस समूह को याजक वर्ग के भीतर रखता है; हिन्दी में ‘याजकों में से’ स्वाभाविक है।
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: जिन्होंने याजकपद का दावा किया
  rationale: मध्यमवाच्य कृदन्त यहाँ याजकपद पर अधिकार जताने या दावा करने का भाव देता है, केवल याजकीय सेवा करने का नहीं।
- source_word: οὐχ εὑρέθησαν
  choice: उनका नाम नहीं मिला
  rationale: यूनानी वाक्यांश संक्षिप्त और अंडाकार है। प्रसंग में आशय वंशावली या याजकीय सूची में नाम न मिलने से है; ‘नाम’ जोड़ने से हिन्दी स्पष्ट होती है, जबकि पादटिप्पणी मूल की अस्पष्टता बताती है।
- source_word: υἱοὶ Ὀββειά / υἱοὶ Ἀκβώς / υἱοὶ Ἰαδδοὺς
  choice: ओब्बेइया / अकबोस / इयद्दूस के वंशज
  rationale: वंशावली-सूची में υἱοί केवल सीधे पुत्रों के बजाय व्यापक वंशजों को भी सूचित कर सकता है। नाम यूनानी पाठ के अनुसार लिप्यंतरित किए गए हैं।
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: इयद्दूस ने … औगिया को पत्नी बनाया था
  rationale: λαμβάνω के साथ γυναῖκα विवाह करने का मुहावरा है। स्पष्ट कर्ता दोहराने से हिन्दी में सम्बन्धसूचक कृदन्त की अस्पष्टता दूर होती है।
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: फाएक्सेलदाई की बेटियों में से
  rationale: यह औगिया के परिवार का परिचय देता है। नाम को अनुमानित इब्रानी समानान्तर से मिलाने के बजाय यूनानी साक्ष्य के अनुसार रखा गया है।
theological_decisions:
- issue: याजकपद की पात्रता और न मिला हुआ अभिलेख
  choice: केवल दावे और नाम न मिलने की बात कही गई है
  alternative: उन्हें स्पष्ट रूप से अयोग्य या झूठा दावेदार कहना
  rationale: यूनानी पाठ अभिलेख न मिलने की सूचना देता है, पर उनके चरित्र या दावे की सत्यता पर अंतिम निर्णय स्पष्ट रूप से नहीं सुनाता; इसलिए इस तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘याजकपद’ धार्मिक पदनाम की संक्षिप्तता बनाए रखता है; वंशावली-सूची में बार-बार ‘पुत्र’ कहने के बजाय अर्थ-संगत ‘वंशज’ चुना गया है। यूनानी के दीर्घ वाक्य को स्पष्ट हिन्दी संरचना और विरामचिह्नों में प्रस्तुत किया गया है।
