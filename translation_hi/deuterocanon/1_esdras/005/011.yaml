base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: hi
  text: 'फथालेमोआब[a] के वंशज, अर्थात् येशू और रोबोआब[b] के वंशज: दो हज़ार आठ सौ दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘फथालेमोआब’; इब्रानी-समानांतर परंपरा में सामान्यतः ‘पखत-मोआब’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में ‘येशू और रोबोआब’ है; एज्रा और नहेमायाह की समानांतर सूची में दूसरा नाम सामान्यतः ‘योआब’ माना जाता है। 1 एस्द्रास कभी-कभी अपनी स्रोत-सामग्री के क्रम या रूप को बदलता है, इसलिए यहाँ यूनानी नाम-रूप मुख्य पाठ में रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: वंशज
  rationale: वंशावली-सूची में υἱοὶ केवल प्रत्यक्ष पुत्रों को नहीं, बल्कि किसी कुल या पूर्वज से निकले लोगों को भी सूचित करता है; इसलिए आधुनिक हिन्दी में ‘वंशज’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: Φθαλεμωάβ
  choice: फथालेमोआब
  rationale: मुख्य यूनानी पाठ के नाम Φθαλεμωάβ का निकट देवनागरी लिप्यंतरण रखा गया है; इब्रानी-समानांतर परंपरा का अधिक परिचित रूप पखत-मोआब पादटिप्पणी में दिया गया है।
- source_word: εἰς τοὺς υἱοὺς
  choice: के वंशजों में से
  rationale: इस गणना-सूची में εἰς संबंध अथवा उपसमूह को दर्शाता है, दिशा को नहीं; ‘में से’ उस कुलगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦ
  choice: येशू
  rationale: निर्वासनोत्तर वंशावली के इस व्यक्ति के लिए ‘येशू’ नाम चुना गया है, ताकि नए नियम में प्रचलित ‘यीशु’ से अनावश्यक पहचान न बने।
- source_word: Ῥοβοάβ
  choice: रोबोआब
  rationale: यूनानी मुख्य पाठ के स्पष्ट नाम-रूप को बनाए रखा गया है। समानांतर एज्रा/नहेमायाह सूची के आधार पर इसे चुपचाप ‘योआब’ नहीं किया गया; वह पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: दो हज़ार आठ सौ दो
  rationale: यूनानी संख्या का सीधा और साहित्यिक हिन्दी रूप है।
