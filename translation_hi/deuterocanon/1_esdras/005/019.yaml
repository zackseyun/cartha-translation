  rationale: मूल संख्या का सीधा और स्वाभाविक हिंदी रूप।
- source_word: Πείρας
  choice: पेइरास
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण; अनुमान के आधार पर किसी अन्य नाम से इसका सामंजस्य नहीं किया गया।
- source_word: Βηρόγ
  choice: बेरोग
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण; अंतिम गामा को ‘ग’ से दर्शाया गया है।
- source_word: ἑπτακόσιοι
  choice: सात सौ
  rationale: मूल संख्या का सीधा हिंदी रूप।
