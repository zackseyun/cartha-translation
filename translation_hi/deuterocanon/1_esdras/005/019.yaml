  rationale: यह स्थान से संबंध या उद्गम बताने वाला संक्षिप्त सूची-सूत्र है। हिंदी में ‘के लोग’ स्वाभाविक है और यूनानी में स्पष्ट न होने पर भी केवल पुरुषों का अर्थ नहीं जोड़ता।
