  rationale: यह कठिन यूनानी स्थान-नाम है। इसे इब्रानी समानांतर के नतोपा से मिलाने के बजाय यूनानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: εἴκοσι πέντε
