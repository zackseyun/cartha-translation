base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: hi
  text: तब जरुब्बाबेल, येशू[a] और इस्राएल के पितृकुलों के प्रधानों ने उनसे कहा, “हमारे प्रभु परमेश्वर के लिए भवन[b] बनाना तुम्हारा काम नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी नाम Ἰησοῦς यहाँ निर्वासनोत्तर महायाजक येशू के लिए है; एक अन्य नामरूप ‘यहोशू’ है।
    reason: lexical_alternative
  - marker: b
    text: या “मंदिर”; मूल शब्द का शाब्दिक अर्थ “घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यह सामान्य कथात्मक वाक्य-विन्यास का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ζοροβαβὲλ
  choice: जरुब्बाबेल
  rationale: निर्वासनोत्तर अगुवे के लिए प्रचलित हिन्दी बाइबलीय नामरूप।
- source_word: Ἰησοῦς
  choice: येशू
  rationale: यहाँ संकेत निर्वासनोत्तर महायाजक की ओर है; हिन्दी में प्रचलित नामरूप येशू है, जबकि यूनानी रूप वही है जिसका अन्य संदर्भों में अनुवाद यीशु भी होता है।
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  choice: पितृकुलों के प्रधान
  rationale: ἡγούμενοι नेतृत्व करने वालों को और πατριαί वंशाधारित कुलों अथवा पैतृक घरानों को सूचित करता है; यह रूप सामाजिक संरचना और नेतृत्व दोनों को बनाए रखता है।
- source_word: Οὐχ ὑμῖν
  choice: तुम्हारा काम नहीं है
  rationale: यूनानी वाक्यांश संक्षिप्त और अंडाकार है। यह स्वाभाविक हिन्दी में निषेध को व्यक्त करता है, पर एज्रा 4:3 के अधिक विस्तृत कथन को इसमें नहीं जोड़ता।
- source_word: τοῦ οἰκοδομῆσαι
  choice: बनाना
  rationale: मूल में साधारणतः ‘बनाना’ है; प्रसंग से पुनर्निर्माण अभिप्रेत हो सकता है, पर वह इस पद में स्पष्ट नहीं किया गया।
- source_word: τὸν οἶκον
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर’ है और प्रसंग में मंदिर अभिप्रेत है। ‘भवन’ हिन्दी में उपासना-स्थान के लिए स्वाभाविक है तथा सीधे ‘मंदिर’ कहकर रूपक को पूरी तरह नहीं मिटाता।
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: हमारे प्रभु परमेश्वर के लिए
  rationale: οἰκοδομέω के साथ सम्प्रदान कारक का स्वाभाविक हिन्दी अर्थ ‘के लिए बनाना’ है; शब्दक्रम में ‘हमारे’ दोनों पदों से बने संयुक्त संबोधन पर लागू होता है।
theological_decisions:
- issue: मंदिर-निर्माण के संदर्भ में κύριος का अनुवाद, जहाँ समानांतर इब्रानी परंपरा में YHWH है
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी स्रोत में Κυρίῳ है, इसलिए ‘प्रभु’ उसके शब्दरूप को सीधे दर्शाता है। इब्रानी समानांतर वाचा-नाम की पृष्ठभूमि की पुष्टि करता है, पर यहाँ यूनानी पाठ को बदलने का आधार नहीं बनता।
- issue: Οὐχ ὑμῖν में निषेध का विस्तार
  choice: बनाना तुम्हारा काम नहीं है
  alternative: इस काम में तुम्हारा हमारे साथ कोई भाग नहीं है
  rationale: चुना हुआ रूप यूनानी की संक्षिप्त अस्वीकृति को सुरक्षित रखता है; विकल्प एज्रा 4:3 के विस्तृत समानांतर कथन को इस पद में आयात कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप। ‘पितृकुल’ ऐतिहासिक वंशाधारित सामाजिक इकाई को व्यक्त करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न अपने संबंधित शब्दों के तुरंत बाद दिए गए हैं।
