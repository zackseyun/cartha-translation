base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
translation:
  language: hi
  text: इन बातों के बाद, अपने-अपने गोत्रों के अनुसार पैतृक घरानों के मुखिया ऊपर जाने के लिए चुने गए, साथ ही उनकी पत्नियाँ, बेटे और बेटियाँ, सेवक और सेविकाएँ[a], और उनका पशुधन भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दास और दासियाँ’। यूनानी शब्द घरेलू दासों या सेवकों के लिए प्रयुक्त हो सकते हैं; केवल इस पद के आधार पर उनकी कानूनी स्थिति निश्चित नहीं की जा सकती।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन संकेतवाचक को बनाए रखते हुए पिछले वृत्तांत से स्वाभाविक कालगत संबंध जोड़ता है।
- source_word: ἐξελέγησαν
  choice: चुने गए
  rationale: यूनानी निष्क्रिय क्रिया का सीधा अर्थ है ‘चुने गए’; इससे किसी औपचारिक पद पर नियुक्ति का अनावश्यक भाव नहीं जुड़ता।
- source_word: ἀναβῆναι
  choice: ऊपर जाने के लिए
  rationale: यह ‘ऊपर जाना’ के बाइबलीय भौगोलिक मुहावरे को सुरक्षित रखता है और पद में न आए गंतव्य ‘यरूशलेम’ को नहीं जोड़ता।
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: पूर्वजों के घरानों के मुखिया
  rationale: ἀρχηγοί के नेतृत्वसूचक अर्थ और οἴκου πατριῶν की वंश-आधारित पारिवारिक संरचना, दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ φυλὰς αὐτῶν
  choice: उनके गोत्रों के अनुसार
  rationale: κατά यहाँ वर्गीकरण अथवा वितरण बताता है; यह अनुवाद उसी संगठनात्मक भाव को बनाए रखता है।
- source_word: αἱ γυναῖκες αὐτῶν
  choice: उनकी पत्नियाँ
  rationale: घराने के सदस्यों की इस सूची में γυναῖκες का स्वाभाविक अर्थ ‘पत्नियाँ’ है।
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: उनके बेटे-बेटियाँ
  rationale: यूनानी पाठ बेटों और बेटियों का अलग-अलग उल्लेख करता है; संयुक्त हिन्दी पदबंध दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: οἱ παῖδες αὐτῶν καὶ αἱ παιδίσκαι
  choice: उनके सेवक-सेविकाएँ
  rationale: बेटे-बेटियाँ पहले ही गिनाए जा चुके हैं, इसलिए यहाँ घरेलू सेवकों अथवा दासों का अर्थ संदर्भानुकूल है। स्त्रीलिंग और पुल्लिंग रूपों की जोड़ी को भी बनाए रखा गया है।
- source_word: τὰ κτήνη αὐτῶν
  choice: उनका पशुधन
  rationale: κτήνη यहाँ पाले हुए पशुओं अथवा भार ढोने वाले जानवरों को सूचित करता है; ‘पशुधन’ प्रवास-सूची में स्वाभाविक और पर्याप्त व्यापक है।
