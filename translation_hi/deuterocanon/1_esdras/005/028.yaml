translation:
  language: hi
  text: द्वारपाल[a], चार सौ; इश्माएल के वंशज, लकूबात[b] के पुत्र, एक हज़ार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में आगे ‘इश्माएल के वंशज, लकूबात के पुत्र, एक हज़ार’ लिखा है। इस स्थान पर नहेमायाह 7 का इब्रानी समानांतर पाठ इससे मेल नहीं खाता; इसलिए अनुवाद ने मसोरेटिक पाठ के साथ सामंजस्य बैठाने के बजाय यहाँ यूनानी साक्ष्य का अनुसरण किया है।
    reason: textual_variant
  - marker: b
    text: ‘लकूबात’ संभवतः लौटने वालों की समानांतर सूचियों में मिलने वाले अधिक परिचित नाम ‘अक्कूब’ या ‘लक्कूब’ से संबंधित कोई नाम-रूप हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ θυρωροί
  choice: द्वारपाल
  rationale: θυρωρός द्वार की रखवाली करने वाले व्यक्ति को दर्शाता है। मंदिर और समुदाय की इस सूची में ‘द्वारपाल’ सहज, स्पष्ट और पद-सूचक हिन्दी है।
- source_word: τετρακόσιοι
  choice: चार सौ
  rationale: यह पहले बताए गए समूह की संख्या बताने वाला सामान्य गणनावाचक शब्द है।
- source_word: οἱ Ἰσμαήλου
  choice: इश्माएल के वंशज
  rationale: यूनानी में शाब्दिक अर्थ ‘इश्माएल के लोग’ है। वंशावली-सूची के संदर्भ में ‘वंशज’ स्वाभाविक हिन्दी है और केवल प्रत्यक्ष पुत्रों तक अर्थ को सीमित नहीं करता।
- source_word: υἱοὶ Λακουβάτου
  choice: लकूबात के पुत्र
  rationale: υἱοί का स्पष्ट अर्थ ‘पुत्र’ है। Λακουβάτου को उपलब्ध यूनानी पाठ के अनुसार ‘लकूबात’ के रूप में लिप्यंतरित किया गया है; इसे समानांतर सूचियों के अधिक परिचित नाम से समरूप नहीं बनाया गया।
- source_word: χίλιοι
  choice: एक हज़ार
  rationale: यह इसके ठीक पहले आए कुल अथवा परिवार की संख्या बताने वाला सामान्य गणनावाचक शब्द है।
