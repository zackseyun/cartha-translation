lexical_decisions:
- source_word: πάντες
  choice: सभी…कुल
  rationale: यह शब्द दोनों उल्लिखित समूहों को समेटकर उनकी कुल संख्या बताता है। हिन्दी में आरम्भ का ‘सभी’ और संख्या से पहले ‘कुल’ जनगणना-सूची का भाव स्वाभाविक रूप से स्पष्ट करते हैं।
- source_word: ἱερόδουλοι
  choice: मन्दिर-सेवक
  rationale: यह संयुक्त शब्द मन्दिर की सेवा से जुड़े एक आश्रित वर्ग को सूचित करता है। ‘मन्दिर-सेवक’ आधुनिक हिन्दी में स्पष्ट है; दासत्व का सम्भावित बल पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: सुलैमान के सेवकों के वंशज
  rationale: वंशावली-सूची में υἱοί केवल प्रत्यक्ष पुत्रों के बजाय वंशजों को भी सूचित कर सकता है। इसलिए ‘वंशज’ आशय को स्वाभाविक और स्पष्ट बनाता है; παίδων के लिए कम अतिनिर्धारित ‘सेवकों’ चुना गया है।
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: तीन सौ बहत्तर
  rationale: यूनानी मूल में दी गई संख्या का सीधा आधुनिक हिन्दी रूप।
theological_decisions:
- issue: जनगणना-सूची में सामाजिक रूप से आश्रित सेवा-सूचक शब्दों का अनुवाद
  choice: मुख्य पाठ में ‘मन्दिर-सेवक’ और ‘सुलैमान के सेवक’
  alternative: ‘मन्दिर के दास’ और ‘सुलैमान के दास’
  rationale: यह पद सामाजिक संस्था पर धर्मवैज्ञानिक कथन देने के बजाय एक प्रशासनिक कुल संख्या प्रस्तुत करता है। ‘सेवक’ मूल शब्दों की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता, जबकि उनके सम्भावित दासत्व-सूचक बल को पादटिप्पणी में बताया गया है।
