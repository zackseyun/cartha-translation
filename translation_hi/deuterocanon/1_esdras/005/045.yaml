  - severity: medium
    issue: ‘प्रजा के कुछ लोग’ introduces ‘some.’
    rationale: The Greek οἱ ἐκ τοῦ λαοῦ αὐτοῦ identifies people as being from the people; it does not explicitly quantify them as ‘some.’ Hindi ‘प्रजा में से लोग’ preserves the partitive construction without adding a numerical implication.
  - severity: low
    issue: ‘वहीं’ is an unnecessary added locative specification.
    rationale: Although inferable from the preceding phrase, ‘वहीं’ is not expressed in the Greek and is unnecessary when the second settlement clause is stated directly.
  - severity: low
    issue: Bare ‘लेवी’ is less precise in this personnel list.
    rationale: ‘लेवीय’ naturally denotes Levites in modern Hindi biblical register and avoids possible association with the tribal eponym.
