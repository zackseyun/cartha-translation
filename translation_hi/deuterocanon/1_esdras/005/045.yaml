base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: hi
  text: और याजक, लेवीय और प्रजा में से लोग[a] यरूशलेम और प्रदेश में बस गए; मंदिर के गायक, द्वारपाल और समस्त इस्राएल अपने-अपने गाँवों में बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी प्रजा में से लोग।” “उसकी” का संदर्भ यूनानी में स्पष्ट नहीं है; यह संभवतः याजकों और लेवियों से अलग समुदाय के लोगों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: बस गए
  rationale: यहाँ क्रिया निवास स्थापित करने का भाव देती है। पुनर्वास के प्रसंग में ‘बस गए’ स्वाभाविक है और यूनानी कर्मवाच्य को अनावश्यक रूप से बोझिल नहीं बनाता।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: यह यहूदी उपासना-संबंधी पद के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: οἱ Λευεῖται
  choice: लेवी
  rationale: लेवीय समुदाय के लिए बाइबलीय हिन्दी में प्रचलित संज्ञा।
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: प्रजा के कुछ लोग[a]
  rationale: यह पद याजकों और लेवियों से अलग सामान्य समुदाय के लोगों को सूचित करता है। यूनानी का शाब्दिक ‘उसकी प्रजा में से लोग’ अस्पष्ट है, इसलिए स्वाभाविक मुख्य पाठ के साथ शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: यरूशलेम और उस प्रदेश में
  rationale: χώρα के स्थानीय भौगोलिक अर्थ को ‘प्रदेश’ व्यक्त करता है; ‘आस-पास’ जैसा विवरण यूनानी में स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: οἵ τε ἱεροψάλται
  choice: मंदिर के गायक
  rationale: यह सामान्य गायकों के बजाय पवित्रस्थान या मंदिर में सेवा करने वाले गायकों को दर्शाता है।
- source_word: οἱ θυρωροὶ
  choice: द्वारपाल
  rationale: मंदिर और सामुदायिक व्यवस्था के प्रसंग में यह स्पष्ट और प्रतिष्ठित हिन्दी पद है।
- source_word: πᾶς Ἰσραήλ
  choice: समस्त इस्राएल
  rationale: यह वाचा-समुदाय के सामूहिक नाम को बनाए रखता है और इसे प्रत्येक व्यक्ति के गणितीय अर्थ तक सीमित नहीं करता।
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: अपने-अपने गाँवों में
  rationale: κώμη छोटे नगर या गाँव को दर्शाता है। ‘अपने-अपने’ समूह के विभिन्न गाँवों में बसने का स्वाभाविक हिन्दी भाव देता है।
theological_decisions:
- issue: πᾶς Ἰσραήλ का दायरा
  choice: समुदायवाचक पद के रूप में ‘समस्त इस्राएल’
  alternative: बिना किसी अपवाद के प्रत्येक इस्राएली व्यक्ति
  rationale: वाक्य पुनर्स्थापित समुदाय और उसके विभिन्न वर्गों का वर्णन करता है। इसलिए पद को सामूहिक रूप में रखा गया है, पर उसकी व्यापकता को व्याख्या द्वारा सीमित नहीं किया गया।
- issue: οἱ ἐκ τοῦ λαοῦ αὐτοῦ में αὐτοῦ का संदर्भ
  choice: मुख्य पाठ में स्वाभाविक ‘प्रजा के कुछ लोग’, शाब्दिक रूप पादटिप्पणी में
  alternative: ‘उसकी प्रजा में से लोग’
  rationale: सम्बन्धसूचक सर्वनाम का पूर्वपद यूनानी में असहज और अस्पष्ट है। मुख्य पाठ सामान्य समुदाय के उपसमूह का आशय देता है, जबकि पादटिप्पणी मूल की वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी की लंबी सूची को स्पष्ट करने के लिए क्रिया दोहराई गई है। ‘वहीं’ यरूशलेम और उस प्रदेश की ओर संकेत करता है और सूची के संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
