  naturalness: The revised wording is modern, clear, and suitably dignified Hindi. Repeating ‘बस गए’ for the second coordinated group makes the Greek distribution of groups between Jerusalem/the region and their villages clear in Hindi.
  terminology: ‘याजक,’ ‘लेवीय,’ ‘मंदिर के गायक,’ ‘द्वारपाल,’ and ‘समस्त इस्राएल’ are appropriate established terms. ‘लेवीय’ is preferable here to bare ‘लेवी’ for the named Levitical personnel.
