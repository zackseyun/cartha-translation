base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: hi
  text: और याजक वादकों[a] और तुरहियों के साथ सजे हुए खड़े थे; और लेवीय, आसाप के वंशज, झाँझ लिए हुए प्रभु की स्तुति और उसकी बड़ाई इस्राएल के राजा दाऊद की रीति के अनुसार करते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाद्ययंत्रों और तुरहियों के साथ।” यूनानी शब्द का अर्थ वादक, संगीत-संगति या वाद्ययंत्र हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जैसा इस्राएल के राजा दाऊद ने ठहराया था” या “इस्राएल के राजा दाऊद के अनुसार।” यूनानी वाक्यांश दाऊद के निर्देश, मिसाल, या स्थापित उपासना-रीति—इनमें से किस पर बल है, यह निश्चित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: खड़े हुए
  rationale: यह औपचारिक उपासना के लिए अपना स्थान लेने का स्वाभाविक और संक्षिप्त वर्णन है।
- source_word: ἐστολισμένοι
  choice: सजे हुए
  rationale: यह समारोह के अनुरूप वस्त्र धारण करने या सुसज्जित होने का भाव रखता है, पर किसी विशिष्ट याजकीय पोशाक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: वादकों और तुरहियों के साथ
  rationale: μουσικῶν को यहाँ संगीत प्रस्तुत करने वाले लोगों के रूप में लिया गया है; फिर भी इसका अर्थ वाद्ययंत्र या संगीत-संगति भी हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: आसाप के वंशज लेवीय
  rationale: यह उनके लेवीय पद और आसाप से उनके पारिवारिक अथवा समूहगत संबंध, दोनों को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔχοντες τὰ κύμβαλα
  choice: झाँझ हाथ में लिए हुए
  rationale: यह ἔχοντες के धारण करने वाले भाव को सीधे व्यक्त करता है और उपासना के दृश्य में स्वाभाविक है।
- source_word: ὑμνοῦντες τῷ κυρίῳ
  choice: प्रभु की स्तुति ... कर रहे थे
  rationale: ὑμνοῦντες स्तुतिगान या प्रशंसा व्यक्त करता है; 'स्तुति करना' आधुनिक धार्मिक हिन्दी में सहज और व्यापक है।
- source_word: εὐλογοῦντες
  choice: उसकी बड़ाई कर रहे थे
  rationale: परमेश्वर के संबंध में εὐλογέω का अर्थ उसकी प्रशंसा या महिमा का कथन करना है। 'बड़ाई करना' हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है और अस्पष्ट कर्म को 'उसकी' से स्पष्ट करता है।
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: जैसा इस्राएल के राजा दाऊद की रीति के अनुसार था
  rationale: यह दाऊद से प्राप्त नमूने या व्यवस्था के अनुरूप होने का भाव देता है, बिना इसे केवल विधिक आदेश के रूप में निश्चित किए।
theological_decisions:
- issue: मन्दिर-उपासना के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ इसका संदर्भ इस्राएल के परमेश्वर से है; 'प्रभु' हिन्दी बाइबलीय प्रयोग में मानक, सम्मानपूर्ण और स्पष्ट है।
- issue: κατὰ Δαυεὶδ में दाऊदी अनुरूपता का सटीक बल
  choice: दाऊद की रीति के अनुसार
  alternative: दाऊद के निर्देश के अनुसार
  rationale: यूनानी वाक्यांश रीति, उदाहरण या निर्देश—इनमें से किस पर मुख्य बल है—इसे पूरी तरह निश्चित नहीं करता। मुख्य पाठ रीति का व्यापक शब्द रखता है और पादटिप्पणी दूसरे संभव अर्थ को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। 'लेवीय', 'झाँझ', 'तुरही' और 'प्रभु' जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य की समारोहपूर्ण लय बनाए रखते हुए कठिन यूनानी अस्पष्टताओं को पादटिप्पणियों में सुरक्षित किया गया है।
