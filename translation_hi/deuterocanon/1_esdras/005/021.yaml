    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: के लोग
  rationale: यह यूनानी पद लोगों को उनके मूल स्थान से पहचानता है। ‘के लोग’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी समानांतर से ‘पुत्र’ को यहाँ आरोपित नहीं करता।
- source_word: Μακαλών
  choice: मकालोन
  rationale: अनिश्चित स्थान-नाम का यूनानी रूप से सीधा देवनागरी लिप्यंतरण किया गया है; इब्रानी समानांतर से सामंजस्य बैठाने का प्रयास नहीं किया गया।
- source_word: Βετολιώ
  choice: बेतोलियो
  rationale: पाठ-परंपरा में अस्थिर स्थान-नाम को यूनानी रूप के निकट लिप्यंतरित किया गया है।
- source_word: Νειφείς
  choice: नेइफेस
  rationale: इस अनिश्चित नाम को यूनानी उच्चारण के निकट लिप्यंतरित किया गया है और किसी भिन्न इब्रानी नाम से नहीं मिलाया गया।
- source_word: ἑκατὸν εἴκοσι δύο
  choice: एक सौ बाईस
  rationale: संख्या का स्पष्ट और प्रचलित आधुनिक हिन्दी रूप।
- source_word: πεντήκοντα δύο
  choice: बावन
  rationale: संख्या का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: एक सौ छप्पन
  rationale: संख्या का स्पष्ट और प्रचलित आधुनिक हिन्दी रूप।
theological_decisions:
- issue: यूनानी सूची और इब्रानी समानांतर में नामों तथा संख्याओं का बड़ा अंतर
  choice: मुख्य पाठ में यूनानी सूची का अनुवाद और पादटिप्पणी में इब्रानी समानांतर का उल्लेख
  alternative: मुख्य पाठ को नहेमायाह 7:25 के अनुसार ‘रामा और गेबा के वंशज—छः सौ इक्कीस’ कर देना
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है। भिन्नता इतनी बड़ी है कि चुपचाप सामंजस्य करना उचित नहीं; पादटिप्पणी दोनों पाठ-परंपराओं के बीच वास्तविक तनाव को पारदर्शी रूप से सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। स्थान-नामों का अनुमानित स्थानीयकरण करने के बजाय यूनानी से लिप्यंतरण किया गया है; डैश संख्यात्मक सूची को सहज पठनीय बनाते हैं।
