base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: hi
  text: और वे यरूशलेम तथा शेष यहूदिया में लौट आए—हर एक अपने नगर में। ये वे लोग थे जो अपने अगुओं, जरुब्बाबेल, येशुआ, नहेमायाह, जरायाह, रेसायाह, एनेनियुस, मोर्दकै, बेएलसारुस, अस्फारासुस, बोरोलेयुस, रोइमुस और बाना[a] के साथ आए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस सूची के कई नाम एज्रा–नहेमायाह के निकटवर्ती इब्रानी पाठ में पाए जाने वाले नामों से रूप में भिन्न हैं। यहाँ उन्हें इब्रानी रूपों के अनुसार बदलने के बजाय 1 एस्द्रास के यूनानी पाठ के अनुसार दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आए
  rationale: क्रिया का मूल अर्थ पहले के स्थान पर लौटना है। यूनानी में एकवचन क्रिया सामूहिक कर्ता के साथ आई है; हिन्दी में बहुवचन रूप स्वाभाविक है।
- source_word: τὴν λοιπὴν Ἰουδαίαν
  choice: शेष यहूदिया
  rationale: λοιπή यरूशलेम से अलग यहूदिया के बाकी भाग को सूचित करता है; यह संक्षिप्त और स्रोत के निकट है।
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: हर एक अपने नगर को
  rationale: वितरणात्मक एकवचन को बनाए रखते हुए πόλις का निकट अर्थ ‘नगर’ रखा गया है।
- source_word: οἱ ἐλθόντες
  choice: ये वे लोग थे जो ... आए थे
  rationale: संज्ञात्मक कृदन्त को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: जरुब्बाबेल, येशुआ
  rationale: निर्वासन-पश्चात के इन अगुओं के हिन्दी में पहचाने जा सकने वाले रूप अपनाए गए हैं; ‘येशुआ’ इस ऐतिहासिक व्यक्ति को यीशु मसीह से अलग पहचानने में सहायक है।
- source_word: τῶν προηγουμένων αὐτῶν
  choice: अपने अगुओं
  rationale: προηγουμένων का संदर्भ यहाँ उन लोगों से है जो समूह के आगे चलते या उसका नेतृत्व करते थे; ‘अगुओं’ से यह सामाजिक भूमिका स्पष्ट रहती है।
- source_word: proper-name list
  choice: नहेमायाह, जरायाह, रेसायाह, एनेनियुस, मोर्दकै, बेलसारुस, अस्फारासुस, बोरोलेयुस, रोइमुस और बाना
  rationale: नामों की सूची और उनके रूप 1 एस्द्रास के यूनानी पाठ के अनुसार रखे गए हैं, न कि निकटवर्ती इब्रानी समानांतर के अनुसार सामान्यीकृत किए गए हैं।
