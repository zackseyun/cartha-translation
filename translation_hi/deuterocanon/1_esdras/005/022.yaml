base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/022.yaml
  text: the sons of Kalamokalos and Onous[a], seven hundred twenty-five; the sons of Jericho, two hundred forty-five;
translation:
  language: hi
  text: कलामोकालोस और ओनूस के वंशज[a], सात सौ पच्चीस; यरीहो के वंशज, दो सौ पैंतालीस;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एज्रा-नहेमायाह की इब्रानी पाठ-परंपरा का समानांतर यहाँ उल्लेखनीय रूप से भिन्न है; उसमें लगभग यह लिखा है: “बेतेल और ऐ के लोग, दो सौ तेईस।” 1 एस्द्रास का यूनानी पाठ अलग नाम और संख्याएँ सुरक्षित रखता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: वंशज
  rationale: इस जनगणना-सूची में यह शब्द परिवार या कुल से संबंधित समूह को दर्शाता है; ‘वंशज’ तत्काल पुत्रों तक अर्थ सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: Καλαμωκάλου
  choice: कलामोकालोस
  rationale: यूनानी पाठ के व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण किया गया है; इसे भिन्न इब्रानी समानांतर के अनुसार नहीं बदला गया।
- source_word: Ὠνούς
  choice: ओनूस
  rationale: यूनानी रूप का सीधा देवनागरी लिप्यंतरण है; पाठ में यह कलामोकालोस के साथ संयुक्त नाम अथवा स्थान-संबद्ध समूह के रूप में आता है।
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: सात सौ पच्चीस
  rationale: यूनानी संख्या का सीधा और आधुनिक हिन्दी में स्वाभाविक रूप।
- source_word: Ἰερήχου
  choice: यरीहो
  rationale: इस प्रसिद्ध स्थान के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: दो सौ पैंतालीस
  rationale: यूनानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: इस जनगणना-सूची में यूनानी साक्ष्य और अनुमानित मसोरेटिक समानांतर का संबंध
  choice: यूनानी पाठ में दिए नामों और संख्याओं का अनुवाद, बिना उन्हें मसोरेटिक पाठ से मिलाने के
  alternative: ‘बेतेल और ऐ के लोग, दो सौ तेईस’ के अनुरूप पाठ बनाना
  rationale: 1 एस्द्रास के लिए दिया गया प्रत्यक्ष स्रोत स्वेट का यूनानी पाठ है। इब्रानी समानांतर केवल अनुमानित है और यहाँ नामों तथा कुल संख्या में स्पष्ट रूप से भिन्न है; सामंजस्य करने पर वास्तविक यूनानी पाठ छिप जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-शैली के अनुरूप संक्षिप्त रखी गई है। ‘वंशज’ से कुल-संबंधी अर्थ स्पष्ट होता है और इसे केवल सीधे पुत्रों तक सीमित नहीं किया जाता।
