    text: 'इब्रानी समानांतर पाठ (एज्रा 3:10) इस दृश्य का अधिक पूरा वर्णन करता है: याजक तुरहियों के साथ और आसाप के वंशज लेवी झाँझों के साथ यहोवा की स्तुति करते हैं। 1 एस्द्रास में वही दृश्य संक्षिप्त यूनानी रूप में है।'
    reason: cross_reference
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और बड़ी संख्या में सहभागी लोगों को सूचित करता है। हिन्दी में केवल ‘बहुत-से’ अधूरा लगता, इसलिए ‘लोग’ जोड़ा गया है, पर उनकी भूमिका निर्दिष्ट नहीं की गई।
- source_word: διὰ σαλπίγγων
  choice: तुरहियों के साथ
  rationale: διά के साथ संबंधकारक यहाँ साधन अथवा संगति का भाव देता है। ‘तुरहियों के साथ’ स्वाभाविक हिन्दी है और समानांतर इब्रानी पाठ से भी मेल खाता है।
- source_word: χαρὰ μεγάλη
  choice: बड़ा आनन्द
  rationale: यह χαρά और μεγάλη का सीधा, गरिमापूर्ण और सामान्य हिन्दी अनुवाद है।
- source_word: τῇ φωνῇ
  choice: स्वर के साथ
  rationale: यूनानी में शाब्दिक रूप से ‘उस स्वर/आवाज़ के साथ’ है और ऊँचे स्वर का कोई विशेषण नहीं है। ‘स्वर के साथ’ मूल की संक्षिप्तता और कुछ अस्पष्टता बनाए रखता है; ‘जयजयकार’ या ‘ऊँची आवाज़’ अधिक व्याख्यात्मक होते।
