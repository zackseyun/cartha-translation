  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: hi
  text: परन्तु देश के लोग यहूदिया में रहनेवालों से आ मिले[a] और उन्हें घेरे रखकर निर्माण करने में बाधा डालते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द कठिन है; इसका अर्थ ‘उनके बीच आ बसे’ या ‘उन पर दबाव डालते हुए चढ़ आए’ भी हो सकता है। आगे का वाक्यांश दिखाता है कि उनका आ मिलना शत्रुतापूर्ण था।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: देश के अन्यजाति लोग
  rationale: यह पद आसपास के गैर-यहूदी जातीय समूहों को सूचित करता है। ‘अन्यजाति लोग’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘देश की जातियाँ’ यहाँ भ्रामक हो सकता है।
- source_word: ἐπικοιμώμενα
  choice: से आ मिले
  rationale: यह असामान्य कृदन्त निकट जुड़ने, बीच आ बसने, या दबाव डालते हुए चढ़ आने का भाव दे सकता है। ‘से आ मिले’ सम्बन्धसूचक बल को बनाए रखता है; शत्रुतापूर्ण आशय अगले पद से स्पष्ट होता है।
- source_word: τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में रहनेवालों
  rationale: यह व्यापक संज्ञात्मक अभिव्यक्ति है; अनावश्यक रूप से किसी अधिक विशिष्ट समूह की पहचान नहीं कराई गई।
- source_word: πολιορκοῦντες
  choice: उन्हें घेरकर
  rationale: मूल क्रिया का सामान्य अर्थ घेरा डालना है। यह अनुवाद सैन्य और शत्रुतापूर्ण दबाव का चित्र बनाए रखता है।
- source_word: εἶργον
  choice: बाधा डालते रहे
  rationale: अपूर्ण भूतकाल निरन्तर या बार-बार किए गए अवरोध को व्यक्त करता है; यह पूर्णतः रोक देने की अपेक्षा लगातार बाधा पहुँचाने का भाव देता है।
- source_word: τοῦ οἰκοδομεῖν
  choice: मन्दिर बनाने के काम में
  rationale: यूनानी में केवल ‘बनाने’ का उल्लेख है और कर्म निहित है। निकटवर्ती कथा मन्दिर के पुनर्निर्माण के विषय में है, इसलिए सहज हिन्दी के लिए ‘मन्दिर’ स्पष्ट किया गया है, और इस पूर्ति को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘बनाने’ का निहित कर्म
  choice: मन्दिर बनाने के काम में
  alternative: बनाने के काम में
  rationale: मूल यूनानी वाक्य में कर्म व्यक्त नहीं है, पर कथा-सन्दर्भ मन्दिर-निर्माण का है। स्पष्टता के लिए ‘मन्दिर’ जोड़ा गया है, बिना किसी अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष के।
- issue: ἐπικοιμώμενα की अस्पष्टता
  choice: से आ मिले
  alternative: उनके बीच आ बसे / उन पर चढ़ आए
  rationale: दुर्लभ यूनानी रूप का सटीक भाव अनिश्चित है। मुख्य पाठ सम्बन्धसूचक अर्थ रखता है और पादटिप्पणी दबाव डालने अथवा बीच बसने की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘बाधा डालते रहे’ से यूनानी अपूर्ण भूतकाल की निरन्तरता व्यक्त हुई है। ‘मन्दिर’ सन्दर्भगत स्पष्टता के लिए जोड़ा गया और पादटिप्पणी में पारदर्शी बनाया गया है।
