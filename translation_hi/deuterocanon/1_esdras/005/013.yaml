  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। प्रत्येक समूह के नाम के बाद संख्या स्पष्ट करने के लिए विसर्ग का प्रयोग हुआ है। पाद-टिप्पणी का चिह्न ‘अरगै’ के साथ रखा गया है, क्योंकि पाठांतर उसी नाम और उससे संबद्ध कुल संख्या से संबंधित है।
