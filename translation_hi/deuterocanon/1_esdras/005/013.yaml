  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/013.yaml
  text: the sons of Bebai[a], six hundred thirty-three; the sons of Argai, one thousand three hundred twenty-two.
translation:
  language: hi
  text: 'बेबै के वंशज: छह सौ तैंतीस; अरगै[a] के वंशज: एक हज़ार तीन सौ बाईस।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘अरगै’ है। अनुमानित मसोरेटिक समानांतर में ‘अजगाद’ और एक भिन्न संख्या (1,222) मिलती है; इससे स्पष्ट है कि यहाँ 1 एस्द्रास की सूची इब्रानी सूची से ठीक-ठीक मेल नहीं खाती।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: इस जनगणना-सदृश वंश-सूची में यह पद किसी नामित पूर्वज से जुड़े परिवार या कुल के लोगों को दर्शाता है। ‘के वंशज’ आधुनिक हिन्दी में स्वाभाविक है और केवल प्रत्यक्ष पुत्रों का अर्थ लगाने से बचाता है।
- source_word: Βηβαί
  choice: बेबै
  rationale: यूनानी नाम Βηβαί का देवनागरी लिप्यंतरण।
- source_word: ἑξακόσιοι τριάκοντα τρεῖς
  choice: छः सौ तैंतीस
  rationale: यूनानी पाठ की संख्या 633 को स्पष्ट और प्रचलित हिन्दी रूप में प्रस्तुत किया गया है।
- source_word: Ἀργαί
  choice: अरगै
  rationale: मुख्य यूनानी स्रोत में आए Ἀργαί का निकट देवनागरी लिप्यंतरण किया गया है; सामी समानांतर का ‘अजगाद’ मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: χίλιοι τριακόσιοι εἴκοσι δύο
  choice: एक हज़ार तीन सौ बाईस
  rationale: यूनानी पाठ की संख्या 1,322 को आधुनिक हिन्दी में स्पष्ट रूप से प्रस्तुत किया गया है, यद्यपि मसोराई समानांतर में संख्या भिन्न है।
