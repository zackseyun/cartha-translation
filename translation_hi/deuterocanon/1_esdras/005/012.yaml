  yaml_path: translation/deuterocanon/1_esdras/005/012.yaml
  text: the sons of Iolamus[a], two; the sons of Zatou, nine hundred seventy; the sons of Chorbe, seven hundred five; the sons of Banei, six hundred forty-eight[c][b];
translation:
  language: hi
  text: योलामुस के वंशज दो; ज़ातू के वंशज[a] नौ सौ सत्तर; खोरबे के वंशज[b] सात सौ पाँच; बानेई के वंशज[c] छह सौ अड़तालीस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘ज़ातू’ है; इब्रानी समानांतर परंपरा में ‘ज़त्तू’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में नाम ‘खोरबे’ है। इब्रानी समानांतर सूचियों में यहाँ का कुलनाम निश्चित रूप से इससे मेल नहीं खाता।
    reason: textual_variant
  - marker: c
    text: यूनानी पाठ में ‘बानेई’ है; इब्रानी समानांतर में ‘बानी’ और संख्या छह सौ बयालीस है।
    reason: alternative_reading
