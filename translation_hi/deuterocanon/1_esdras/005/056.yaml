base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: hi
  text: और उन्होंने बीस वर्ष या उससे अधिक आयु के लेवियों को प्रभु के कार्यों पर नियुक्त किया। तब येशू अपने पुत्रों और भाइयों के साथ खड़ा हुआ; उसका भाई दमादीएल[a], हेमादाबून[b] के पुत्र येशू के पुत्र, तथा एलियादून के पुत्र यहूदा के पुत्र भी अपने पुत्रों और भाइयों समेत खड़े हुए। सभी लेवी एक मन होकर काम की देखरेख करने वाले[c] थे और प्रभु के भवन के कार्यों[d] में लगे रहे। और निर्माण करने वालों ने प्रभु के मंदिर का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘दमादीएल’ है; एज्रा की समानांतर पाठ-परम्परा इस लेवी की पहचान ‘कदमीएल’ के रूप में करती है।
    reason: alternative_reading
  - marker: b
    text: यूनानी ‘हेमादाबून’ सम्भवतः समानांतर इब्रानी परम्परा के ‘हेनादाद’ नाम को प्रतिबिम्बित करता है।
    reason: alternative_reading
  - marker: c
    text: ‘काम की देखरेख करने वाले’ एक दुर्लभ यूनानी शब्द का अनुवाद है, जिसका अर्थ श्रम को निर्देशित करने या आगे बढ़ाने वाले लोग है।
    reason: lexical_alternative
  - marker: d
    text: कुछ अनुवाद यहाँ ‘कार्य’ एकवचन करते हैं; यूनानी में इस पद के दोनों स्थानों पर ‘कार्य’ बहुवचन में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: नियुक्त किया
  rationale: लेवियों को कार्यों पर रखने के प्रसंग में यह केवल खड़ा करने के बजाय जिम्मेदारी सौंपने का भाव व्यक्त करता है।
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह सेवा की न्यूनतम आयु बताता है; आधुनिक हिन्दी में सीमा का भाव स्पष्ट किया गया है।
- source_word: ἐπὶ τῶν ἔργων τοῦ κυρίου
  choice: प्रभु के कार्यों की देखरेख के लिए
  rationale: ἐπί के साथ सम्बन्ध यहाँ कार्यों पर दायित्व या निरीक्षण का है; यूनानी बहुवचन को ‘कार्यों’ से बनाए रखा गया है।
- source_word: ἔστη Ἰησοῦς
  choice: येशू ... खड़ा हुआ
  rationale: मूल के ‘खड़ा हुआ’ को बनाए रखता है और कार्य के लिए आगे आने का भाव प्रसंग से स्पष्ट होता है।
- source_word: Δαμαδιὴλ
  choice: दमादीएल
  rationale: प्राथमिक यूनानी पाठ का नाम मुख्य पाठ में सुरक्षित रखा गया है; समानांतर एज्रा परम्परा का ‘कदमीएल’ पादटिप्पणी में दिया गया है।
- source_word: Ἡμαδαβούν
  choice: हेमादाबून
  rationale: प्राथमिक यूनानी रूप को मुख्य पाठ में लिप्यंतरित किया गया है; सम्भावित सामी नाम ‘हेनादाद’ को पादटिप्पणी में रखा गया है।
- source_word: Ἰούδα τοῦ Εἰλιαδοὺν
  choice: एलियादून के पुत्र यहूदा
  rationale: नामों को यूनानी के निकट रखा गया है और सम्बन्धसूचक τοῦ को वंशसूचक ‘के पुत्र’ माना गया है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: साझे उद्देश्य और एकमत सक्रियता को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: ἐργοδιῶκται
  choice: काम की निगरानी करने वाले
  rationale: दुर्लभ पद काम को निर्देशित या आगे बढ़ाने वालों को सूचित करता है; यह अनावश्यक कठोरता के बिना पर्यवेक्षण का भाव देता है।
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: कार्यों में लगे रहे
  rationale: अटपटी यूनानी अभिव्यक्ति का सक्रिय संलग्नता वाला भाव स्वाभाविक हिन्दी में दिया गया है और बहुवचन बनाए रखा गया है।
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: राजमिस्त्रियों ने ... बनाया
  rationale: निर्माण करने वाले कुशल कामगारों का अर्थ स्पष्ट करता है; हिन्दी में ‘बनाने वालों ने बनाया’ की अस्वाभाविक पुनरुक्ति से बचता है।
- source_word: ναὸν τοῦ κυρίου
  choice: प्रभु का मन्दिर
  rationale: ναός को ‘मन्दिर’ कहने से पहले आए οἶκος ‘भवन’ से शब्दगत भेद बना रहता है।
theological_decisions:
- issue: मन्दिर-निर्माण के इस यूनानी प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रत्यक्ष स्रोत में κύριος है; इसलिए किसी अनुमानित इब्रानी दिव्य नाम को मुख्य पाठ में पुनर्स्थापित किए बिना ‘प्रभु’ रखा गया है।
- issue: यूनानी पाठ में सम्भवतः विकृत या अत्यधिक यूनानीकृत व्यक्तिनाम
  choice: मुख्य पाठ में यूनानी रूप दमादीएल और हेमादाबून; समानांतर परम्परा के रूप पादटिप्पणियों में
  alternative: मुख्य पाठ में कदमीएल और हेनादाद से सामान्यीकरण
  rationale: इस पद का प्राथमिक आधार यूनानी है और उपलब्ध MT समानांतर वास्तव में इस पद से मेल नहीं खाता; अतः निश्चितता से अधिक पुनर्निर्माण न करते हुए पाठगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। व्यक्तिनाम देवनागरी में ध्वन्यात्मक रूप से दिए गए हैं। ‘प्रभु का भवन’ और ‘प्रभु का मन्दिर’ द्वारा οἶκος और ναός का भेद रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a]–[d] उपस्थित हैं।
