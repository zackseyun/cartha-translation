- source_word: υἱοὶ
  choice: वंशज
  rationale: इस गणना-सूची में यह शब्द केवल प्रत्यक्ष पुत्रों के बजाय किसी कुल या परिवार के सदस्यों को भी सूचित कर सकता है। ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस व्यापक वंशावली अर्थ को व्यक्त करता है।
- source_word: Ἀζὴρ Ἐζεκίου
  choice: अज़ेर एज़ेकियास
  rationale: यूनानी पाठ में दोनों नाम साथ आते हैं और उनका सटीक पारस्परिक संबंध अस्पष्ट है। इसलिए उन्हें अलग व्याख्यात्मक संबंध में बाँधने या मसोराई पाठ के ‘आदीन’ से मिलाने के बजाय यूनानी रूपों का लिप्यंतरण किया गया है।
- source_word: Κειλὰν καὶ Ἀζητάς
  choice: केलान और अज़ेतास
  rationale: यूनानी साक्ष्य के व्यक्तिनामों को बिना किसी अधिक परिचित इब्रानी नाम से सामंजस्य बैठाए देवनागरी में लिप्यंतरित किया गया है।
- source_word: ἐξήκοντα ἑπτά
  choice: सड़सठ
  rationale: संख्या 67 को मानक और सहज हिन्दी शब्द में ठीक-ठीक व्यक्त किया गया है।
- source_word: Ἀζάρου
  choice: अज़ारोस
  rationale: यह यूनानी संबंधकारक रूप है; मूल नाम के संभावित प्रथमा रूप Ἄζαρος को दर्शाने के लिए ‘अज़ारोस’ चुना गया है और इसे समानांतर इब्रानी सूची से नहीं बदला गया।
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: चार सौ बत्तीस
  rationale: संख्या 432 का सीधा और स्वाभाविक हिन्दी अनुवाद किया गया है।
