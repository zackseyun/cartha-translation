base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: hi
  text: अज़ेइर एज़ेकियास के वंशज[a], केइलान और अज़ेतास के वंशज—सड़सठ; अज़ारोस के वंशज—चार सौ बत्तीस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के यूनानी नाम लगभग संगत मसोरेटिक पाठ से उल्लेखनीय रूप से भिन्न हैं; वहाँ सूची के संगत स्थान पर इसके बजाय “आदीन के वंशज—चार सौ चौवन” लिखा है। 1 एस्द्रास में लौटने वालों की सूचियों का क्रम या रूप कभी-कभी भिन्न होता है, इसलिए यहाँ इब्रानी समानांतर पाठ से सामंजस्य बैठाने के बजाय यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
