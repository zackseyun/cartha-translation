base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: hi
  text: क्योंकि केवल हम ही इस्राएल के प्रभु के लिए निर्माण करेंगे, जैसा फारसियों के राजा कुस्रू[a] ने हमें आदेश दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फारस के राजा कुस्रू।” यूनानी में शाब्दिक रूप से “फारसियों के राजा” है।
    reason: जातिवाचक बहुवचन Περσῶν के शाब्दिक रूप और हिन्दी में प्रचलित देशवाचक उपाधि—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: क्योंकि ... केवल हम ही
  rationale: γὰρ पिछले कथन का कारण बताता है, और व्यक्त सर्वनाम ἡμεῖς के साथ μόνοι का विशेष बल इस बात पर है कि निर्माण वे ही करेंगे, दूसरे नहीं।
- source_word: οἰκοδομήσομεν
  choice: निर्माण ... करेंगे
  rationale: यह οἰκοδομέω का भविष्यकाल है। यूनानी में पुनर्निर्माण का भाव अलग से व्यक्त नहीं किया गया, इसलिए ‘फिर से बनाएँगे’ के बजाय सामान्य ‘निर्माण करेंगे’ रखा गया है।
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु के लिए
  rationale: मंदिर-निर्माण के संदर्भ में संप्रदान कारक समर्पण अथवा उद्देश्य बताता है। κύριος को परमेश्वर की उपाधि के रूप में ‘प्रभु’ अनूदित किया गया है।
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: जैसा ... ने हमें आदेश दिया है
  rationale: यह सहज हिन्दी में कुस्रू के निर्देश के अनुरूप कार्य करने का भाव बनाए रखता है; सम्बन्धवाचक रचना को अनावश्यक रूप से शब्दशः नहीं खींचा गया।
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: फारसियों के राजा कुस्रू
  rationale: Περσῶν जातिवाचक बहुवचन है, इसलिए ‘फारसियों के राजा’ यूनानी के अधिक निकट है। नाम Κῦρος के लिए प्रचलित हिन्दी बाइबलीय रूप ‘कुस्रू’ रखा गया है।
theological_decisions:
- issue: दैवी उपाधि κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: τῷ κυρίῳ τοῦ Ἰσραήλ यहाँ इस्राएल के परमेश्वर की दैवी उपाधि है; ‘प्रभु’ इस अर्थ को स्वाभाविक और परंपरागत ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘केवल हम ही’ यूनानी के विशेष बल को व्यक्त करता है, जबकि ‘निर्माण करेंगे’ मूल पाठ से अधिक स्पष्ट ‘पुनर्निर्माण’ का भाव नहीं जोड़ता।
