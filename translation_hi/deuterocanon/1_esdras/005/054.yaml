base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: hi
  text: और दूसरे वर्ष में, जब वे यरूशलेम में परमेश्वर के भवन[a] में आ चुके थे, तब दूसरे महीने में शालतीएल के पुत्र जरुब्बाबेल, योसादाक के पुत्र येशू, उनके भाइयों, याजकों, लेवियों और बंधुआई से यरूशलेम आए हुए सभी लोगों ने आरम्भ किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के मन्दिर’ अथवा ‘परमेश्वर के पवित्रस्थान’। यूनानी शब्द पूरे पवित्र मन्दिर-परिसर का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει … μηνὸς δευτέρου
  choice: दूसरे वर्ष के दूसरे महीने में
  rationale: दोनों काल-सूचक पदों को स्वाभाविक हिन्दी में साथ रखा गया है; इससे यूनानी का अर्थ सुरक्षित रहता है और वाक्य अनावश्यक रूप से टूटता नहीं।
- source_word: παραγενόμενοι εἰς τὸ ἱερὸν τοῦ θεοῦ εἰς Ἰερουσαλήμ
  choice: जब वे यरूशलेम में परमेश्वर के भवन में आ गए थे
  rationale: कृदन्त की मुख्य क्रिया से पहले पूरी हुई क्रिया को ‘आ गए थे’ व्यक्त करता है। ἱερόν के व्यापक पवित्र-परिसर संबंधी अर्थ और एज्रा-परंपरा की ‘परमेश्वर का भवन’ शैली, दोनों को ध्यान में रखा गया है।
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: शालतीएल के पुत्र जरुब्बाबेल
  rationale: पितृनाम-संबंध को स्पष्ट करते हुए प्रचलित बाइबलीय हिन्दी नाम-रूप अपनाए गए हैं।
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: योसादाक के पुत्र येशू
  rationale: निर्वासनोत्तर एज्रा-संदर्भ के व्यक्ति के लिए ‘येशू’ रूप रखा गया है, ताकि नए नियम के ‘यीशु’ नाम से अनावश्यक भ्रम न हो; पितृनाम का प्रचलित हिन्दी रूप ‘योसादाक’ है।
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: अपने भाइयों
  rationale: यूनानी के पुरुषवाचक पारिवारिक पद को सामान्य और सीधी हिन्दी में सुरक्षित रखा गया है।
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: याजकों, लेवियों
  rationale: यूनानी में उल्लिखित दोनों समूहों को अलग-अलग रखा गया है, न कि एक संयुक्त पद ‘लेवीय याजक’ बनाया गया है।
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας εἰς Ἰερουσαλήμ
  choice: उन सभी लोगों के साथ, जो बंधुआई से यरूशलेम आए थे
  rationale: αἰχμαλωσία का ठोस अर्थ ‘बंधुआई’ रखा गया है और आगमन की पूर्वपूर्णता ‘आए थे’ से व्यक्त की गई है।
- source_word: ἤρξαντο
  choice: आरम्भ किया
  rationale: यूनानी पद में कर्म इस पद के भीतर नहीं दिया गया; इसलिए अगले पद से जुड़ने वाला अधूरापन अल्पविराम सहित सुरक्षित रखा गया है और कोई अनुमानित कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: τὸ ἱερὸν τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मन्दिर / परमेश्वर का पवित्रस्थान
  rationale: ἱερόν मन्दिर या उसके पवित्र परिसर को सूचित कर सकता है। ‘भवन’ पुनर्स्थापना-कालीन एज्रा-परंपरा की भाषा से मेल खाता है, पर टिप्पणी में अन्य संभव अर्थ भी सुरक्षित हैं।
- issue: οἱ ἀδελφοὶ αὐτῶν का सामूहिक आशय
  choice: अपने भाइयों
  alternative: अपने बन्धुजनों / अपने साथी इस्राएलियों
  rationale: मूल के पुरुषवाचक पारिवारिक शब्द को किसी अधिक व्याख्यात्मक सामुदायिक पहचान में बदले बिना रखा गया है।
- issue: ἤρξαντο के अनुल्लिखित कर्म को पूरा करना
  choice: आरम्भ किया,
  alternative: काम आरम्भ किया
  rationale: इस पद में यह नहीं बताया गया कि उन्होंने क्या आरम्भ किया। पाठ की वाक्यगत निरंतरता और वास्तविक अपूर्णता को सुरक्षित रखने के लिए ‘काम’ जैसा अनुमानित कर्म नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। नामों के परिचित बाइबलीय हिन्दी रूप प्रयुक्त हैं। यूनानी वाक्य इस पद के अंत में आगे जारी रहता है, इसलिए अनुवाद भी ‘आरम्भ किया,’ पर खुला छोड़ा गया है।
