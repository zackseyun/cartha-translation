  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: hi
  text: और याजकों, लेवियों और अपने-अपने पितृकुलों के प्रधानों में से वे बुज़ुर्ग आए जिन्होंने पहले का भवन[b] देखा था। इस भवन के निर्माण के समय वे ज़ोर से पुकार उठे और बहुत रोए[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ऊँची पुकार और बहुत रोना—दोनों स्पष्ट हैं; यह पहले भवन को देख चुके बुज़ुर्गों की सार्वजनिक और तीव्र प्रतिक्रिया को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘पहले का भवन’ और ‘इस भवन’ है। यहाँ ‘भवन’ से आशय मंदिर है।
    reason: cultural_note
lexical_decisions:
- source_word: προκαθημένων κατὰ τὰς πατριὰς αὐτῶν
  choice: अपने-अपने पितृकुलों के प्रधानों
  rationale: προκαθημένων उन लोगों को सूचित करता है जो आगे रखे गए या अध्यक्षता करते थे, और πατριαί पैतृक वंश पर आधारित पारिवारिक समूह हैं। ‘पितृकुलों के प्रधान’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: οἱ πρεσβύτεροι
  choice: वे बुज़ुर्ग
  rationale: यहाँ शब्द आयु में बड़े पुरुषों और उनके सामुदायिक सम्मान—दोनों का संकेत दे सकता है; ‘बुज़ुर्ग’ इस दोहरे भाव को खुला रखता है।
- source_word: ἑωρακότες
  choice: जिन्होंने ... देखा था
  rationale: पूर्णकालिक कृदन्त उनके पहले भवन के प्रत्यक्ष अनुभव को वर्तमान प्रतिक्रिया से जोड़ता है; ‘देखा था’ उस पूर्व अनुभव को स्पष्ट करता है।
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: पहले का भवन
  rationale: οἶκος का शाब्दिक ‘घर’ यहाँ पवित्रस्थान अर्थात मंदिर के लिए प्रयुक्त है। ‘भवन’ हिन्दी में मंदिर-संदर्भ के अनुकूल है, जबकि ‘पहले का’ कालगत विरोध बनाए रखता है।
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: इस भवन को बनते देखकर
  rationale: यूनानी वाक्यांश संक्षिप्त है और इस भवन के निर्माण के अवसर पर उनकी प्रतिक्रिया बताता है। यह अनुवाद संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना निर्माण की पूर्णता मान लेने के।
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: ऊँची आवाज़ में पुकार उठे और फूट-फूटकर रोए
  rationale: κραυγή की मुखर पुकार और κλαυθμός के तीव्र रोने—दोनों को अलग-अलग बनाए रखा गया है; हिन्दी मुहावरा भावनात्मक तीव्रता व्यक्त करता है।
theological_decisions:
- issue: οἶκος को ‘घर’, ‘भवन’ या स्पष्टतः ‘मंदिर’ कहना
  choice: मुख्य पाठ में ‘भवन’, और पादटिप्पणी में मंदिर-संदर्भ स्पष्ट करना
  alternative: ‘पहला मंदिर’ और ‘यह मंदिर’
  rationale: यूनानी का मंदिर-संबंधी ‘भवन/घर’ रूपक बनाए रखना उचित है; सीधे ‘मंदिर’ कहने से अर्थ स्पष्ट होता, पर स्रोत की अभिव्यक्ति मिट जाती।
- issue: κραυγή और κλαυθμός को केवल शोक मानना या दोनों ध्वनियों को रखना
  choice: पुकार और रोना दोनों स्पष्ट रखना
  alternative: ‘वे बहुत विलाप करने लगे’
  rationale: यूनानी में मुखर पुकार और रोना दोनों अलग शब्दों से उपस्थित हैं; उन्हें एक सामान्य ‘विलाप’ में समेटना भावगत तनाव घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पितृकुल’, ‘प्रधान’ और ‘बुज़ुर्ग’ सामाजिक संरचना को स्पष्ट करते हैं; ‘फूट-फूटकर रोए’ तीव्र κλαυθμός को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है। पद का अंतिम अल्पविराम अगले पद से व्याकरणिक निरंतरता का संकेत देता है।
