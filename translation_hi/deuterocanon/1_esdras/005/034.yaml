  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
translation:
  language: hi
  text: हागिया के वंशज[a], फकारेत-सबेई के वंशज, सरोथेई के वंशज, मेइसाइअस के वंशज, गास के वंशज, अद्दूस के वंशज, सूबास के वंशज, अफेर्रा के वंशज, बारोथेइस के वंशज, सफाग के वंशज, अल्लोन के वंशज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'नहेमायाह 7:51 के इब्रानी समानांतर में यहाँ केवल यह संक्षिप्त सूची है: “उज्जा के वंशज, पासेह के वंशज और बेसै के वंशज।” 1 एस्द्रास में यूनानी सूची अधिक विस्तृत है; इसलिए यहाँ नामों को इब्रानी पाठ के अनुरूप बनाने के बजाय यूनानी पाठ का अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: वंशावली-सूची में यह सूत्र किसी व्यक्ति के प्रत्यक्ष पुत्रों से अधिक व्यापक रूप से उसके कुल या वंश के सदस्यों को सूचित कर सकता है। आधुनिक हिन्दी में ‘के वंशज’ इस आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, जबकि यूनानी की हर पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: Ἁγιά
  choice: हागिया
  rationale: यूनानी रूप का निकट देवनागरी लिप्यंतरण किया गया है; आरंभिक spiritus asper के कारण ‘ह’ रखा गया है।
- source_word: Φακαρὲθ Σαβειή
  choice: फकारेत-सबेई
  rationale: यूनानी में निकट जुड़े दो नाम-घटकों को योजक-चिह्न से जोड़ा गया है; किसी अनिश्चित सामी समकक्ष से इसका सामंजस्य नहीं किया गया।
- source_word: Σαρωθεί
  choice: सरोथेई
  rationale: यूनानी नाम का रूढ़ हिन्दी ध्वनियों में निकट लिप्यंतरण है; θ को ‘थ’ और ει को ‘ई’ से दर्शाया गया है।
- source_word: Μεισαίας
  choice: मेसैयास
  rationale: दुर्लभ नाम को यूनानी रूप के निकट रखा गया है और किसी अन्य पाठ-परंपरा के अनुसार सामान्यीकृत नहीं किया गया।
- source_word: Γάς
  choice: गास
  rationale: संक्षिप्त यूनानी नाम का सीधा देवनागरी लिप्यंतरण किया गया है।
- source_word: Ἀδδούς
  choice: अद्दूस
  rationale: द्वित्व δ को ‘द्द’ और ου को ‘ऊ’ से दर्शाते हुए यूनानी रूप सुरक्षित रखा गया है।
- source_word: Σουβάς
  choice: सूबास
  rationale: ου को ‘ऊ’ से दर्शाकर यूनानी नाम का निकट हिन्दी लिप्यंतरण किया गया है।
- source_word: Ἀφερρά
  choice: अफेर्रा
  rationale: यूनानी φ को आधुनिक हिन्दी में सहज ‘फ’ और द्वित्व ρ को ‘र्र’ से दर्शाया गया है।
- source_word: Βαρωθείς
  choice: बारोथेइस
  rationale: दुर्लभ नाम की पाठीय पहचान बनाए रखने के लिए θ और ει सहित यूनानी रूप का निकट लिप्यंतरण किया गया है।
- source_word: Σαφάγ
  choice: साफाग
  rationale: यूनानी नाम की दीर्घ स्वर-ध्वनि और अंतिम γ को निकट रूप में रखा गया है।
- source_word: Ἀλλών
  choice: अल्लोन
  rationale: द्वित्व λ को ‘ल्ल’ से दर्शाते हुए यूनानी नाम का सीधा लिप्यंतरण किया गया है।
