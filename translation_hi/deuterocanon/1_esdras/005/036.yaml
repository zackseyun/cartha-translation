translation:
  language: hi
  text: ये वे लोग थे जो थेरमेलेथ और थेलेरसास से ऊपर आए थे; खाराअथालान और अल्लार उनकी अगुवाई कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβάντες
  choice: ऊपर आए थे
  rationale: यह यरूशलेम की ओर जाने के लिए प्रयुक्त सामान्य बाइबलीय दिशात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: ἡγούμενος αὐτῶν
  choice: उनकी अगुवाई कर रहे थे
  rationale: यूनानी एकवचन कृदंत है, पर उसके बाद दो नाम आते हैं; अर्थगत तनाव को सहज हिन्दी में सामूहिक नेतृत्व के रूप में व्यक्त किया गया है, बिना उन्हें औपचारिक पदवी देने के।
- source_word: Θερμέλεθ καὶ Θελερσάς
  choice: थेरमेलेथ और थेलेरसास
  rationale: यूनानी पाठ के स्थान-नामों का निकट देवनागरी लिप्यंतरण।
- source_word: Χαρααθαλὰν καὶ Ἀλλάρ
  choice: खाराअथालान और अल्लार
  rationale: यूनानी पाठ में प्राप्त व्यक्तिनामों का निकट देवनागरी लिप्यंतरण; अनुमान से सामी समानार्थी नाम नहीं बैठाए गए।
