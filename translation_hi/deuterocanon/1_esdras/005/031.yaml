lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: इस वंशावली-सदृश सूची में यह पद परिवार या कुल के सदस्यों को सूचित करता है। शाब्दिक ‘के पुत्र’ की तुलना में ‘के वंशज’ आधुनिक हिन्दी में अभिप्रेत सामूहिक अर्थ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἰαείρου
  choice: याईर
  rationale: यूनानी नाम का देवनागरी में स्रोत-समीप लिप्यंतरण किया गया है; इसे भिन्न इब्रानी समानांतर के अनुसार नहीं बदला गया।
- source_word: Δαισάν
  choice: दैसान
  rationale: यूनानी ध्वनिरूप का सीधा देवनागरी लिप्यंतरण।
- source_word: Νοεβά
  choice: नोएबा
  rationale: यूनानी वर्तनी के निकट लिप्यंतरण।
- source_word: Χασεβά
  choice: ख़सेबा
  rationale: आरम्भिक यूनानी χ को ‘ख़’ से दर्शाकर नाम को स्रोत-रूप के निकट रखा गया है।
- source_word: Καζηρά
  choice: कज़ेरा
  rationale: अस्पष्ट प्राचीन नाम को किसी अनुमानित इब्रानी रूप से मिलाने के बजाय यूनानी के निकट रखा गया है।
- source_word: Ὀζείου
  choice: ओज़ेयू
  rationale: यूनानी षष्ठी रूप के आधारभूत नाम को हिन्दी में उच्चारणयोग्य स्रोत-समीप रूप दिया गया है।
- source_word: Φινόε
  choice: फ़िनोए
  rationale: यूनानी φ को ‘फ़’ से और शेष स्वरक्रम को यथासंभव सुरक्षित रखा गया है।
- source_word: Ἀσαρά
  choice: असारा
  rationale: यूनानी नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: Βασθαί
  choice: बस्थै
  rationale: यूनानी व्यंजन-समूह और अंतिम द्विस्वर को स्रोत-समीप रखा गया है।
- source_word: Ἀσσανά
  choice: अस्साना
  rationale: यूनानी के दोहरे सिग्मा को ‘स्स’ से दर्शाया गया है।
- source_word: Μανεί
  choice: मनेई
  rationale: अंतिम यूनानी स्वरक्रम को बिना अनुमानित सामान्यीकरण के सुरक्षित रखा गया है।
- source_word: Ναφεισεί
  choice: नफ़ेईसेई
  rationale: यूनानी नाम के स्वरक्रम और φ को स्रोत-समीप देवनागरी रूप में रखा गया है।
- source_word: Ἀκούφ
  choice: अकूफ़
  rationale: यूनानी नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: Ἀχειβά
  choice: अख़ेइबा
  rationale: χ और ει को क्रमशः ‘ख़’ और ‘एइ’ द्वारा स्रोत-समीप दर्शाया गया है।
- source_word: Ἀσούρ
  choice: असूर
  rationale: नाम को यूनानी रूप के अनुसार लिप्यंतरित किया गया है, किसी अधिक परिचित नाम से नहीं मिलाया गया।
- source_word: Φαρακέμ
  choice: फ़राकेम
