  yaml_path: translation/deuterocanon/1_esdras/005/016.yaml
  text: the sons of Anneis[a], one hundred one; the sons of Arom, the sons of Bassai, three hundred twenty-three; the sons of Arseiphoureith[b],
translation:
  language: hi
  text: अन्नेइस के वंशज[a] एक सौ एक; अरोम के वंशज, बस्साइ के वंशज, तीन सौ तेईस; अरसेइफूरेइत के वंशज[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ नामों की यूनानी सूची नहेमायाह 7:23 के अनुमानित इब्रानी समानांतर से भिन्न है, जहाँ ‘बेसै के वंशज’ लिखा है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में ‘अरसेइफूरेइत’ नाम अनिश्चित है; अनुमानित इब्रानी समानांतर संभवतः ‘हारीफ’ नाम की ओर संकेत करता है।
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: इस जनगणना-सूची में शब्द किसी नामित पूर्वज से निकले परिवार या कुल को दर्शाता है। आधुनिक हिन्दी में ‘के वंशज’ इस अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Ἀννείς
  choice: अन्नेइस
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण रखा गया है; इसे अनुमानित इब्रानी समानांतर के अनुसार नहीं बदला गया।
- source_word: ἑκατὸν εἷς
  choice: एक सौ एक
  rationale: यूनानी की साधारण संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἀρόμ
  choice: अरोम
  rationale: मुख्य यूनानी साक्ष्य के नाम का निकट लिप्यंतरण; इब्रानी परंपरा से सामंजस्य बैठाने का प्रयास नहीं किया गया।
- source_word: Βασσαί
  choice: बस्साइ
  rationale: यूनानी रूप का निकट देवनागरी लिप्यंतरण। अनुमानित इब्रानी समानांतर में ‘बेसै/बेजै’ मिलता है, पर यूनानी पाठ को प्राथमिकता दी गई है।
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: तीन सौ तेईस
  rationale: संख्या का सटीक और प्रचलित आधुनिक हिन्दी रूप।
- source_word: Ἀρσειφουρείθ
  choice: अरसेइफूरेइत
  rationale: अनिश्चित यूनानी नाम का यथासंभव निकट लिप्यंतरण मुख्य पाठ में रखा गया है; संभावित इब्रानी समानांतर को पाद-टिप्पणी में दिया गया है।
