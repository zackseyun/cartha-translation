base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: hi
  text: 'और वे अपने कुलों और वंशावलियों को प्रस्तुत करके यह नहीं दिखा सके कि वे इस्राएल के हैं: आसान के वंशज[a]—आसान बाएनान के पुत्र का पुत्र था—और नेकोदान के वंशज[b]; कुल छह सौ बावन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से ‘आसान, बाएनान के पुत्र का पुत्र’ है। यह असामान्य अथवा संक्षिप्त वंशावली-वाक्यांश हो सकता है; इसलिए मुख्य पाठ में दोहरा पुत्र-संबंध बनाए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ में ‘आसान … बाएनान’ और ‘नेकोदान’ नाम हैं, जबकि नहेमायाह 7 का अनुमानित मसोराई समानांतर इस स्थान पर दूसरे नाम देता है। 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक होने के कारण मुख्य पाठ में उसी के नाम रखे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: विवरण देकर यह प्रमाणित नहीं कर सके
  rationale: वंश-सूची के संदर्भ में वाक्य केवल बोल पाने की असमर्थता नहीं, बल्कि अपने इस्राएली मूल को वंश-विवरण से स्थापित न कर पाने की बात करता है। यह हिंदी में स्वाभाविक रहते हुए मूल क्रिया की असमर्थता को बनाए रखता है।
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: अपने कुलों और वंशावली का विवरण
  rationale: πατριά के पितृकुल अथवा कुल-समूह के अर्थ के लिए ‘कुलों’ और γενεά के वंशगत अभिलेख के अर्थ के लिए ‘वंशावली’ रखा गया है, ताकि दोनों निकटवर्ती शब्दों का भेद बना रहे।
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: कि वे इस्राएल से हैं
  rationale: ὡς को यहाँ आशय-वाचक ‘कि’ से व्यक्त किया गया है। असमर्थता मुख्य क्रिया में है; उपवाक्य स्वयं प्रश्नवाचक नहीं बनाया गया, जिससे यूनानी की वास्तविक अभिव्यक्ति बनी रहती है।
- source_word: υἱοὶ
  choice: वंशज
  rationale: वंश-सूची में υἱοί किसी पूर्वज से निकले व्यापक समूह को सूचित कर सकता है। हिंदी में ‘वंशज’ इस सामूहिक अर्थ को ‘पुत्र’ से अधिक स्पष्ट करता है।
- source_word: Ἀσὰν τοῦ υἱοῦ τοῦ Βαενάν
  choice: बाएनान के पुत्र के पुत्र आसान
  rationale: यूनानी में दोहरी पुत्र-संबंधी अभिव्यक्ति को सरल करके मिटाया नहीं गया। हिंदी क्रम संबंध को स्पष्ट करता है और पाठ की असामान्यता बनाए रखता है।
- source_word: Νεκωδάν
  choice: नेकोदान
  rationale: नाम का लिप्यंतरण प्राथमिक यूनानी पाठ से किया गया है; अनुमानित मसोराई समानांतर में भिन्न नाम होने पर भी मुख्य पाठ में यूनानी रूप रखा गया है।
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: छह सौ बावन
  rationale: यूनानी पाठ की ठीक संख्या को स्वाभाविक हिंदी संख्या-रूप में दिया गया है।
