base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: hi
  text: अकूद के वंशज[a], ऊता के वंशज, केताब के वंशज, अक्काबा के वंशज, सिबाई के वंशज, अनान के वंशज, कूआ के वंशज और केद्दूर के वंशज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नहेमायाह 7:45 के इब्रानी समानांतर में द्वारपालों के परिवारों की एक अलग सूची है, जिसमें शल्लूम, आतेर, तल्मोन, अक्कूब, हतीता और शोबाई सम्मिलित हैं। यहाँ 1 एस्द्रास के यूनानी पाठ में भिन्न सूची सुरक्षित है; इसलिए अनुवाद इब्रानी सूची से सामंजस्य बैठाने के बजाय यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: वंशावली-सूची में यह पद किसी परिवार या कुल के सदस्यों को सूचित करता है। ‘के वंशज’ आधुनिक हिन्दी में स्वाभाविक है और हर नाम के साथ दोहराए गए यूनानी सूत्र को भी बनाए रखता है; ‘के पुत्र’ अनावश्यक रूप से केवल प्रत्यक्ष पुत्रों का अर्थ दे सकता है।
- source_word: Ἀκούδ
  choice: अकूद
  rationale: स्वीटे के यूनानी पाठ में दिए नाम का देवनागरी लिप्यंतरण; इसे इब्रानी समानांतर के किसी अन्य नाम से नहीं मिलाया गया है।
- source_word: Οὐτά
  choice: ऊता
  rationale: यूनानी आरंभिक Οὐ- की ध्वनि को हिन्दी में स्वाभाविक रूप से ‘ऊ’ द्वारा व्यक्त किया गया है।
- source_word: Κητάβ
  choice: केताब
  rationale: प्राप्त यूनानी रूप का सीधा, पठनीय देवनागरी लिप्यंतरण है।
- source_word: Ἀκκαβά
  choice: अक्काबा
  rationale: यूनानी में दोहरे कप्पा को ‘क्क’ द्वारा सुरक्षित रखते हुए नाम का लिप्यंतरण किया गया है।
- source_word: Συβαεί
  choice: सिबाई
  rationale: यूनानी नाम का हिन्दी में उच्चारण-सुगम रूप चुना गया है; अंतिम -αεί को ‘आई’ से व्यक्त किया गया है और इसे इब्रानी समानांतर के शोबाई से नहीं मिलाया गया।
- source_word: Ἀνάν
  choice: अनान
  rationale: यूनानी रूप का सरल देवनागरी लिप्यंतरण है।
- source_word: Κουά
  choice: कूआ
  rationale: यूनानी ου स्वर-समूह को ‘ऊ’ से व्यक्त करते हुए नाम का निकट और पठनीय लिप्यंतरण किया गया है।
- source_word: Κεδδούρ
  choice: केद्दूर
  rationale: दोहरे डेल्टा को ‘द्द’ और ου को ‘ऊ’ से व्यक्त कर यूनानी रूप की विशेषताएँ सुरक्षित रखी गई हैं।
theological_decisions:
- issue: यूनानी सूची और नहेमायाह 7:45 के इब्रानी समानांतर का संबंध
  choice: 1 एस्द्रास के यूनानी पाठ में दी गई नाम-सूची का ही अनुवाद किया गया है।
  alternative: नामों को इब्रानी समानांतर के शल्लूम, आतेर, तल्मोन, अक्कूब, हतीता और शोबाई जैसे रूपों के अनुरूप कर देना।
  rationale: इस पुस्तक के लिए प्रस्तुत यूनानी पाठ प्राथमिक स्रोत है। इब्रानी समानांतर की सूची नामों और संरचना में भिन्न है, इसलिए वह सहायक साक्ष्य है, पाठ को उसके अनुरूप बदलने का आधार नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। वंशावली-सूची की लय बनाए रखने के लिए ‘के वंशज’ प्रत्येक नाम के साथ दोहराया गया है और अंतिम पद से पहले स्वाभाविक हिन्दी संयोजक ‘और’ जोड़ा गया है। व्यक्तिनाम प्राथमिक यूनानी साक्ष्य से देवनागरी में लिप्यंतरित किए गए हैं।
