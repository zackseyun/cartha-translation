translation:
  language: hi
  text: सामा के वंशज[a] तीन हज़ार तीन सौ एक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ ‘सामा’ और कुल संख्या 3,301 है। एज्रा 2:29 के निकटवर्ती मसोरेटिक समानांतर में ‘नबो के वंशज’ और संख्या बावन है। चूँकि यहाँ 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, इसलिए इतने बड़े अंतर के बावजूद मुख्य पाठ यूनानी का अनुसरण करता है।
    reason: textual_variant
