  rationale: वंशावली और जनगणना-सदृश सूची में υἱοὶ किसी कुल या परिवार के सदस्यों को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ स्वाभाविक और स्पष्ट है।
- source_word: Σαμά
