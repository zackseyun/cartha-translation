base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: hi
  text: और उन्होंने भजन गाते हुए ऊँचे स्वर से पुकारकर प्रभु को धन्य कहा, क्योंकि उसकी भलाई और उसकी महिमा समस्त इस्राएल के लिए सदा बनी रहती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि समस्त इस्राएल के लिए उसकी भलाई और महिमा सदा है।” यूनानी वाक्यांश संक्षिप्त और क्रियारहित है, इसलिए उसका एक से अधिक स्वाभाविक ढंग से विस्तार किया जा सकता है।
    reason: वैकल्पिक पाठ-विन्यास और मूल की व्याकरणिक संक्षिप्तता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐφώνησαν
  choice: ऊँचे स्वर से पुकारकर
  rationale: क्रिया सार्वजनिक रूप से आवाज़ ऊँची करने का भाव देती है; यह केवल ‘कहा’ से अधिक सशक्त है और उपासना के प्रसंग के अनुकूल है।
- source_word: δι’ ὕμνων
  choice: भजन गाते हुए
  rationale: διά के साधनसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ ὕμνοι स्तुति के भजन हैं।
- source_word: εὐλογοῦντες τῷ κυρίῳ
  choice: प्रभु को धन्य कहा
  rationale: εὐλογέω के मूल ‘धन्य कहना’ भाव को बनाए रखता है और ‘स्तुति की’ की अपेक्षा यूनानी के अधिक निकट है।
- source_word: χρηστότης
  choice: भलाई
  rationale: यह परमेश्वर के हितकारी और कृपालु स्वभाव का व्यापक, सहज हिन्दी प्रतिशब्द है।
- source_word: δόξα
  choice: महिमा
  rationale: बाइबलीय प्रसंग में δόξα का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा बनी रहती हैं
  rationale: कालगत स्थायित्व को सहज हिन्दी में व्यक्त करता है; यूनानी में मुख्य क्रिया निहित है, इसलिए हिन्दी में आवश्यक क्रिया जोड़ी गई है।
- source_word: παντὶ Ἰσραήλ
  choice: समस्त इस्राएल के लिए
  rationale: दत्तिव का संबंधसूचक/हितसूचक भाव दर्शाता है, जबकि संक्षिप्त यूनानी वाक्यांश की संभावित अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल यूनानी में κύριος है, प्रत्यक्ष इब्रानी दिव्य नाम नहीं; इसलिए ‘प्रभु’ स्रोत के सबसे निकट और पंथ-निरपेक्ष है।
- issue: क्रियारहित अंतिम उपवाक्य का विस्तार
  choice: उसकी भलाई और उसकी महिमा समस्त इस्राएल के लिए सदा बनी रहती हैं
  alternative: समस्त इस्राएल के लिए उसकी भलाई और महिमा सदा है
  rationale: हिन्दी में वाक्य पूरा करने के लिए न्यूनतम स्थायित्वसूचक क्रिया दी गई है। यह अर्थगत संबंध को स्पष्ट करती है, पर यूनानी की संक्षिप्तता से उत्पन्न वैकल्पिक स्वाभाविक विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण उपासना-शैली रखी गई है। ‘भजन गाते हुए’ और ‘ऊँचे स्वर से’ सामान्य पाठक के लिए सहज हैं; ‘प्रभु को धन्य कहा’ मूल के εὐλογοῦντες को अपेक्षाकृत औपचारिक रूप से सुरक्षित रखता है।
