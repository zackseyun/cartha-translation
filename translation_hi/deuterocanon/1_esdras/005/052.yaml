base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: hi
  text: और जिन सभी ने परमेश्वर के लिए मन्नत मानी थी, वे पहले महीने के नए चाँद के दिन से परमेश्वर को बलिदान चढ़ाने लगे, यद्यपि परमेश्वर का मंदिर अभी तक बनाया नहीं गया था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और परमेश्वर का मंदिर अभी तक बनाया नहीं गया था।” मुख्य पाठ में “यद्यपि” यूनानी समन्वय के संभावित रियायती भाव को प्रकट करता है।'
    reason: lexical_alternative
  - marker: b
    text: 'एज्रा का समानांतर इब्रानी पाठ यहाँ भिन्न है: उसमें झोपड़ियों के पर्व और नियम के अनुसार प्रतिदिन की होमबलियों का उल्लेख है। मुख्य पाठ 1 एस्द्रास के विशिष्ट यूनानी शब्दों का अनुसरण करता है।'
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: जितनों ने
  rationale: यह अनिश्चित सम्बन्धवाचक प्रयोग पूरे सम्बद्ध समूह को समेटता है; हिन्दी में ‘जितनों ने’ स्वाभाविक रूप से यह व्यापकता व्यक्त करता है।
- source_word: εὔξαντο εὐχήν
  choice: मन्नत मानी थी
  rationale: सजातीय क्रिया-संज्ञा रचना यहाँ प्रार्थना करने के बजाय मन्नत मानने का अर्थ देती है। हिन्दी का प्रचलित मुहावरा अर्थ को स्पष्ट रखता है, भले ही यूनानी की पुनरुक्ति को शब्दशः न दोहराए।
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: पहले महीने के अमावस्या-दिन से
  rationale: νουμηνία महीने के आरम्भ को चिह्नित करने वाले नए चाँद अथवा अमावस्या-दिन को दर्शाता है। ‘अमावस्या-दिन’ हिन्दी पाठक के लिए काल-सूचक अर्थ स्पष्ट करता है और इसे केवल सामान्य ‘पहले दिन’ में नहीं बदलता।
- source_word: ἤρξαντο προσφέρειν θυσίας
  choice: बलिदान चढ़ाने लगे
  rationale: आरम्भसूचक क्रिया और infinitive का स्वाभाविक हिन्दी रूप है तथा θυσίας के विशिष्ट बलिदानी अर्थ को बनाए रखता है।
- source_word: καὶ ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο
  choice: यद्यपि परमेश्वर का मन्दिर अभी तक बनाया नहीं गया था
  rationale: यूनानी में καί से साधारण समन्वय है, पर प्रसंग बलिदान आरम्भ होने और मन्दिर के न बने होने के बीच रियायती तनाव दिखाता है। ‘बनाया’ मूल के अनुरूप है; ऐतिहासिक प्रसंग के आधार पर ‘फिर से बनाया’ नहीं जोड़ा गया।
theological_decisions:
- issue: अन्तिम καί-उपवाक्य का रियायती या साधारण समन्वयी सम्बन्ध
  choice: मुख्य पाठ में ‘यद्यपि’ द्वारा रियायती सम्बन्ध व्यक्त किया गया।
  alternative: ‘और परमेश्वर का मन्दिर अभी तक बनाया नहीं गया था।’
  rationale: कथा का आशय यह उभारता है कि मन्दिर बनने से पहले ही बलिदान आरम्भ हो गए थे; फिर भी यूनानी के औपचारिक समन्वय को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: एज्रा के समानान्तर इब्रानी पाठ से भिन्नता
  choice: मुख्य पाठ में 1 एस्द्रास के यूनानी कथन—मन्नतों और अभी न बने मन्दिर—का अनुसरण किया गया।
  alternative: झोपड़ियों के पर्व और नियत दैनिक होमबलियों वाले इब्रानी समानान्तर के अनुसार सामंजस्य करना।
  rationale: यहाँ यूनानी पाठ भौतिक रूप से अलग है और वही प्राथमिक स्रोत है; इसलिए समानान्तर इब्रानी पाठ को मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण धार्मिक गद्य रखा गया है। ‘मन्नत मानना’, ‘बलिदान चढ़ाना’ और ‘मन्दिर’ सामान्य पाठकों के लिए परिचित हैं। ‘अमावस्या-दिन’ νουμηνία के विशिष्ट पंचांगीय अर्थ को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
