base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: hi
  text: और उन्होंने जान लिया कि बँधुआई से आए हुए लोग[a] इस्राएल के प्रभु परमेश्वर के लिए मन्दिर बना रहे हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्वासित लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएल के प्रभु परमेश्वर का मन्दिर बना रहे हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: उन्होंने जान लिया
  rationale: यूनानी क्रिया यहाँ किसी बात का स्पष्ट रूप से पता चलने या उसे पहचान लेने को व्यक्त करती है। ‘जान लिया’ सक्रिय वाक्य-विन्यास और कथात्मक भूतकाल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से आए हुए लोग
  rationale: यह यूनानी पदबंध के ‘बँधुआई से’ वाले रूप को सुरक्षित रखता है और उन लोगों की ओर संकेत करता है जो बँधुआई के बाद वहाँ आए थे; ‘निर्वासित लोग’ अधिक संक्षिप्त विकल्प है।
- source_word: οἰκοδομοῦσιν
  choice: बना रहे हैं
  rationale: वर्तमानकालीन यूनानी रूप जारी निर्माण-कार्य बताता है। हिन्दी में मुख्य क्रिया ‘जान लिया’ के बाद भी परोक्ष कथन में ‘बना रहे हैं’ स्वाभाविक है और यूनानी वर्तमान को सुरक्षित रखता है।
- source_word: τὸν ναόν
  choice: मन्दिर
  rationale: इस पुनर्निर्माण-सन्दर्भ में ναός इस्राएल के परमेश्वर के मन्दिर-भवन को सूचित करता है; ‘मन्दिर’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: इस्राएल के प्रभु परमेश्वर के लिए
  rationale: सम्प्रदान कारक को ‘के लिए’ से व्यक्त करने पर निर्माण के उद्देश्य या समर्पण का भाव स्वाभाविक हिन्दी में आता है। शब्द-क्रम ‘इस्राएल के प्रभु परमेश्वर’ यूनानी पदबंध का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु परमेश्वर’ इस्राएल के परमेश्वर के लिए मानक बाइबलीय पदवी है और यूनानी κύριος θεός की परम्परागत तथा प्रसंगानुकूल अभिव्यक्ति है।
- issue: τῷ κυρίῳ θεῷ के सम्प्रदान कारक का अर्थ
  choice: प्रभु परमेश्वर के लिए
  alternative: प्रभु परमेश्वर का
  rationale: ‘के लिए’ मन्दिर-निर्माण के उद्देश्य अथवा समर्पण को व्यक्त करता है, जबकि यूनानी सम्प्रदान कारक को सम्बन्धसूचक ‘का’ समझना भी सम्भव है; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बँधुआई’ बाइबलीय प्रसंग में परिचित शब्द है, जबकि ‘से आए हुए’ यूनानी पदबंध की संरचना को बिना अनावश्यक व्याख्या जोड़े स्पष्ट करता है।
