lexical_decisions:
- source_word: υἱοὶ
  choice: पुत्र
  rationale: यह वंशावली-सदृश सूची का सूत्र है। ‘पुत्र’ मूल की अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका अर्थ वंशज भी हो सकता है।
- source_word: ἱεροψάλται
  choice: मन्दिर के गायक
  rationale: यह संयुक्त यूनानी पद पवित्र अथवा मन्दिर-सम्बन्धी गायकों को सूचित करता है। ‘मन्दिर के गायक’ आधुनिक हिन्दी में स्वाभाविक है और उपासना-सम्बन्धी भूमिका स्पष्ट करता है।
- source_word: υἱοὶ Ἀσάφ
  choice: आसाप के पुत्र
  rationale: यूनानी में दोहराए गए ‘पुत्र’ को बनाए रखा गया है, क्योंकि यह गायकों के समूह को आसाप के वंश से जोड़ता है। Ἀσάφ का प्रचलित हिन्दी बाइबलीय रूप ‘आसाप’ है।
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: एक सौ अट्ठाईस
  rationale: संख्या को मानक, सहज आधुनिक हिन्दी में प्रस्तुत किया गया है।
