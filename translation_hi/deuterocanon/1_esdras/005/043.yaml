  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: hi
  text: और कुलों के अगुओं में से कुछ ने, यरूशलेम में परमेश्वर के मंदिर में पहुँचने पर, अपनी सामर्थ्य के अनुसार उसी स्थान पर उस भवन को खड़ा करने का संकल्प लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी स्थान पर उस भवन को फिर से बनाने की मन्नत मानी।” यूनानी क्रिया का अर्थ मन्नत मानना भी हो सकता है; यहाँ “भवन” से आशय मंदिर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: कुलों के अगुओं
  rationale: यह पदबंध वंश-आधारित पारिवारिक समूहों के नेतृत्व करनेवालों को सूचित करता है। ‘कुलों के अगुए’ आधुनिक हिन्दी में स्वाभाविक है और सामाजिक संरचना को स्पष्ट रखता है।
- source_word: παραγίνεσθαι
  choice: पहुँचने पर
  rationale: सन्दर्भ में क्रिया परमेश्वर के मन्दिर में उनके आगमन को व्यक्त करती है; ‘पहुँचने पर’ समय-संबंध को सहज हिन्दी में प्रकट करता है।
- source_word: ἱερὸν τοῦ θεοῦ
  choice: परमेश्वर के मन्दिर
  rationale: ἱερόν यहाँ मन्दिर-परिसर को दर्शाता है; ‘मन्दिर’ इसका स्पष्ट और प्रचलित हिन्दी अनुवाद है।
- source_word: εὔξαντο
  choice: संकल्प लिया
  rationale: क्रिया में मन्नत मानने अथवा गंभीर प्रतिज्ञा करने का भाव हो सकता है। ‘संकल्प लिया’ कार्य करने की गंभीर प्रतिबद्धता व्यक्त करता है, पर औपचारिक धार्मिक मन्नत का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐγεῖραι
  choice: खड़ा करने
  rationale: क्रिया का मूल बिंब ‘उठाने/खड़ा करने’ का है। मन्दिर के प्रसंग में पुनर्निर्माण निहित है, जबकि यह चयन यूनानी बिंब को बनाए रखता है।
- source_word: οἶκον
  choice: उस भवन
  rationale: οἶκος का शाब्दिक अर्थ ‘घर’ है और यहाँ वह परमेश्वर के मन्दिर को सूचित करता है। पहले आए ‘परमेश्वर के मन्दिर’ से संकेत स्पष्ट होने के कारण ‘उस भवन’ हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: उसी स्थान पर
  rationale: यह पदबंध भवन को उसके अपने, अर्थात मूल, स्थान पर खड़ा करने का भाव देता है। ‘उसी स्थान पर’ इस पुनर्स्थापन को स्पष्ट करता है।
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: अपनी सामर्थ्य के अनुसार
  rationale: यह उनकी उपलब्ध क्षमता अथवा साधनों के अनुपात को व्यक्त करता है और आर्थिक साधन तथा व्यावहारिक योग्यता—दोनों संभावनाएँ खुली रखता है।
theological_decisions:
- issue: εὔξαντο को औपचारिक धार्मिक मन्नत माना जाए या व्यापक गंभीर प्रतिबद्धता
  choice: संकल्प लिया
  alternative: मन्नत मानी / प्रतिज्ञा की
  rationale: मन्दिर-निर्माण का प्रसंग गंभीर प्रतिबद्धता का समर्थन करता है, किंतु यूनानी क्रिया की अर्थ-सीमा औपचारिक मन्नत और व्यापक संकल्प दोनों को संभव बनाती है। मुख्य पाठ में ‘संकल्प’ और पादटिप्पणी में वैकल्पिक अर्थ देकर इस तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘कुलों के अगुए’, ‘मन्दिर’ और ‘अपनी सामर्थ्य के अनुसार’ जैसे परिचित पद मूल की वंशगत संरचना, पवित्र स्थल और साधनानुसार प्रतिबद्धता को स्पष्ट रखते हैं।
