base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: hi
  text: उस पर होमबलियाँ चढ़ाने के लिए, परमेश्वर के जन मूसा की पुस्तक में निर्धारित बातों के अनुसार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 3:2 के इब्रानी समानांतर में है, “जैसा परमेश्वर के जन मूसा की व्यवस्था में लिखा है।” यहाँ 1 एस्द्रास में “मूसा की पुस्तक” और “निर्धारित बातों के अनुसार” कहा गया है; शब्द अलग हैं, पर मूल भाव एक ही है।
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: चढ़ाने के लिए
  rationale: बलिदान-संबंधी प्रसंग में यह क्रिया केवल लाने नहीं, बल्कि विधिपूर्वक अर्पित करने का अर्थ देती है; ‘चढ़ाना’ स्वाभाविक हिन्दी बाइबलीय प्रयोग है।
- source_word: ἐπ’ αὐτοῦ
  choice: उस पर
  rationale: सर्वनाम पिछले प्रसंग की वेदी की ओर संकेत करता है और स्थानीय अर्थ को ज्यों का त्यों रखता है।
- source_word: ὁλοκαυτώματα
  choice: होमबलियाँ
  rationale: यह पूर्णतः अग्नि में अर्पित बलिदानों का प्रचलित और संक्षिप्त हिन्दी बाइबलीय पद है; इब्रानी समानांतर עֹלוֹת भी इसकी पुष्टि करता है।
- source_word: ἀκολούθως τοῖς ... διηγορευμένοις
  choice: जैसा ... निर्धारित किया गया है
  rationale: यह वाक्यांश किसी अधिकृत विधान के अनुरूप होने का भाव व्यक्त करता है। ‘निर्धारित’ कानूनी-धार्मिक संदर्भ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: मूसा की पुस्तक में
  rationale: यूनानी पाठ स्पष्ट रूप से ‘पुस्तक’ कहता है; इसे इब्रानी समानांतर के ‘व्यवस्था’ में बदलना उचित नहीं होगा।
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: परमेश्वर के जन
  rationale: यह मूसा के लिए प्रयुक्त सम्मानसूचक बाइबलीय उपाधि है। हिन्दी में ‘परमेश्वर का जन’ की अपेक्षा विभक्ति-संबंध के कारण यहाँ ‘परमेश्वर के जन मूसा’ स्वाभाविक है।
theological_decisions:
- issue: यूनानी पाठ और एज्रा 3:2 के इब्रानी समानांतर का संबंध
  choice: यूनानी के ‘मूसा की पुस्तक’ और ‘निर्धारित’ को बनाए रखा गया है।
  alternative: इब्रानी समानांतर के अनुसार ‘जैसा परमेश्वर के जन मूसा की व्यवस्था में लिखा है’ अनुवाद करना।
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक पाठ है। इब्रानी समानांतर मूल भाव की पुष्टि करता है, पर उसकी भिन्न शब्दावली से यूनानी पाठ को प्रतिस्थापित नहीं किया गया।
- issue: τοῦ ἀνθρώπου τοῦ θεοῦ का संबंध
  choice: ‘परमेश्वर के जन’ को मूसा की उपाधि के रूप में रखा गया है।
  alternative: इसे पुस्तक या विधान से ढीले ढंग से जोड़ना।
  rationale: यूनानी व्याकरण और इब्रानी समानांतर दोनों इस उपाधि को मूसा से संबद्ध करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘होमबलियाँ’ और ‘परमेश्वर के जन’ जैसे परिचित धार्मिक पद रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट बनाया गया है।
