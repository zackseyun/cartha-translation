base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: hi
  text: क्योंकि हम भी आपकी तरह आपके प्रभु की सुनते हैं, और अश्शूरियों के राजा असबकाफाथ[a] के दिनों से हम उसे बलि चढ़ाएँगे[b]; वही हमें यहाँ ले आया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में नाम ‘असबकाफाथ’ है; एज्रा 4:2 का इब्रानी समानांतर इस राजा की पहचान एसर्हद्दोन के रूप में करता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी क्रिया का अर्थ विशेष रूप से ‘बलि चढ़ाना’ है और उसका रूप भविष्यकाल में है। ‘के दिनों से’ के साथ इसका मेल असामान्य है; प्रसंग के आधार पर कुछ लोग भावार्थ ‘बलि चढ़ाते आए हैं’ समझते हैं।
    reason: lexical_and_grammatical_note
  - marker: c
    text: ‘यहाँ ले आया’ से अश्शूरी शासन के अधीन लोगों को जबरन दूसरी जगह बसाया जाना अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοίως
  choice: हम भी आपकी तरह
  rationale: यह वक्ताओं द्वारा अपने और संबोधित लोगों के बीच समानता के दावे को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀκούομεν
  choice: की सुनते हैं
  rationale: यह ‘सुनना’ और ‘ध्यान देकर मानना’ दोनों की सम्भावना बनाए रखता है; ‘आज्ञा मानते हैं’ कहना अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: τοῦ κυρίου ὑμῶν
  choice: आपके प्रभु
  rationale: यूनानी में ‘आपके’ स्पष्ट है और केवल κύριος है; इसलिए ‘आपके परमेश्वर’ जोड़ना उचित नहीं।
- source_word: ἐπιθύσομεν
  choice: हम उसके लिए बलि चढ़ाएँगे
  rationale: क्रिया भविष्यकाल में है और विशेष रूप से बलिदान चढ़ाने का बोध देती है। निकटवर्ती काल-सूचक पद के साथ इसका तनाव मुख्य पाठ में बनाए रखा गया है और टिप्पणी में समझाया गया है।
- source_word: ἀπὸ ἡμερῶν
  choice: के दिनों से
  rationale: यह किसी समय-बिंदु से आरम्भ होने का सामान्य मुहावरा है और यूनानी पद के निकट रहता है।
- source_word: Ἀσβακαφὰθ
  choice: असबकाफात
  rationale: मुख्य यूनानी साक्ष्य में मिले नाम का देवनागरी लिप्यंतरण अपनाया गया है; एज्रा 4:2 के इब्रानी समानांतर की पहचान पादटिप्पणी में दी गई है।
- source_word: βασιλέως Ἀσσυρίων
  choice: अश्शूरियों के राजा
  rationale: यूनानी का शाब्दिक जातिवाचक रूप सुरक्षित रखा गया है।
- source_word: μετήγαγεν
  choice: ले आया था
  rationale: क्रिया एक स्थान से दूसरे स्थान तक ले जाने या स्थानांतरित करने को दर्शाती है; साम्राज्य के अधीन जबरन पुनर्वास की सम्भावना टिप्पणी में रखी गई है।
- source_word: ἐνταῦθα
  choice: यहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: क्या वक्ता यह दावा करते हैं कि वे यहूदी लौटनेवालों के ही प्रभु की उपासना करते हैं
  choice: 'उनका दावा सीधे रूप में रखा गया है: ‘हम भी आपकी तरह आपके प्रभु की सुनते हैं’ और उसके लिए बलि चढ़ाने की बात कहते हैं।'
  alternative: ἀκούομεν को ‘आज्ञा मानते हैं’ कहना या κύριος का विस्तार करके ‘आपके परमेश्वर’ लिखना।
  rationale: पद वक्ताओं का अपना दावा प्रस्तुत करता है। अनुवाद न उसकी सच्चाई को प्रमाणित करता है, न उस पर अविश्वास आरोपित करता है; साथ ही यूनानी से अधिक धर्मवैज्ञानिक भाषा नहीं जोड़ता।
- issue: भविष्यकालीन बलिदान-क्रिया और ‘के दिनों से’ के बीच कालगत तनाव
  choice: मुख्य पाठ में भविष्यकाल ‘बलि चढ़ाएँगे’ और आरम्भ-बिंदु ‘के दिनों से’ दोनों सुरक्षित रखे गए हैं।
  alternative: प्रसंग के अनुसार इसे ‘बलि चढ़ाते आए हैं’ बनाकर कालगत असंगति को सहज करना।
  rationale: ἐπιθύσομεν रूपतः भविष्यकाल है, जबकि ἀπὸ ἡμερῶν बीते समय से आरम्भ का संकेत देता है। स्रोत की वास्तविक कठिनाई को चुपचाप हल करने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक बहुवचन ‘आप’ रखा गया है। शैली सरल और गरिमापूर्ण है। ‘प्रभु’, ‘बलि चढ़ाना’ और ‘अश्शूरियों’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; यूनानी पाठ की असामान्य कालगत रचना को सहज बनाने के लिए बदला नहीं गया।
