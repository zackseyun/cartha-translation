base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/032.yaml
  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
translation:
  language: hi
  text: देद्दा के वंशज[a], बाखूस के वंशज, सेरार के वंशज, थोमथेई के वंशज, नासेई के वंशज[b], हातेफा के वंशज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ छह कुलनाम—देद्दा, बाखूस, सेरार, थोमथेई, नासेई और हातेफा—दिए गए हैं, जबकि लगभग समानांतर इब्रानी पाठ में तीन अलग नाम—लबाना, हगाबा और अक्कूब—हैं। यहाँ 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, इसलिए नामों को इब्रानी समानांतर के अनुरूप नहीं बदला गया।
    reason: alternative_reading
  - marker: b
    text: इस पद के कई नाम दुर्लभ हैं और यूनानी पाठ-परंपरा में पाठगत अस्थिरता अथवा लिप्यंतरण के अंतर को दर्शा सकते हैं; यहाँ उपलब्ध यूनानी पाठ का सतर्कता से अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: के वंशज
  rationale: इस जनगणना-सदृश वंशावली में यह शब्द केवल सीधे पुत्रों के बजाय कुल अथवा परिवार-समूह को सूचित करता है; इसलिए आधुनिक हिन्दी में ‘के वंशज’ स्वाभाविक और अर्थ-सटीक है।
- source_word: Δεδδά
  choice: देद्दा
  rationale: यूनानी प्राथमिक पाठ के नाम का निकट देवनागरी लिप्यंतरण; इसे लगभग समानांतर इब्रानी सूची के ‘लबाना’ से नहीं मिलाया गया है।
- source_word: Βαχούς
  choice: बाखूस
  rationale: यूनानी रूप का निकट लिप्यंतरण; इब्रानी समानांतर का अलग नाम प्राथमिक यूनानी पाठ का स्थान नहीं लेता।
- source_word: Σεράρ
  choice: सेरार
  rationale: यूनानी नाम का सीधा लिप्यंतरण; अनुमान के आधार पर इसे इब्रानी समानांतर के ‘अक्कूब’ में नहीं बदला गया।
- source_word: Θόμθει
  choice: थोमथेई
  rationale: दुर्लभ नाम को बिना काल्पनिक सामान्यीकरण के यूनानी रूप के निकट रखा गया है।
- source_word: Νασεί
  choice: नासेई
  rationale: उपलब्ध यूनानी पाठ से सीधा और सतर्क लिप्यंतरण।
- source_word: Ἁτεφά
  choice: हातेफा
  rationale: यूनानी के आरंभिक rough breathing को ‘ह’ से दर्शाते हुए नाम का पारदर्शी लिप्यंतरण किया गया है।
