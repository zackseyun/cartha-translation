lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: लेवी
  rationale: यह जनगणना-सूची का कर्तृकारक शीर्षक है। हिन्दी बाइबलीय प्रयोग में समुदाय के लिए ‘लेवी’ स्वाभाविक और संक्षिप्त है; यूनानी में अनुपस्थित संयोजक नहीं जोड़ा गया।
- source_word: υἱοὶ
  choice: के पुत्र
  rationale: वंशावली और जनगणना की सूची में यह पद वंश या कुल-सदस्यता बताता है। ‘के पुत्र’ स्रोत की औपचारिक अभिव्यक्ति को बनाए रखता है, यद्यपि संदर्भ में व्यापक अर्थ ‘वंशज’ संभव है।
- source_word: Ἰησουείς
  choice: येशुएइस
  rationale: नाम का लिप्यंतरण उपलब्ध यूनानी रूप के अनुसार किया गया है; इसे एज्रा-नहेमायाह की अधिक परिचित इब्रानी नाम-परंपरा से नहीं मिलाया गया।
- source_word: Κοδδηλοῦ
  choice: कोद्देलू
  rationale: यूनानी नाम का सीधा देवनागरी लिप्यंतरण है; ‘कदमीएल’ करना समानांतर परंपरा के आधार पर सामंजस्य बैठाना होता।
- source_word: Βάννου
  choice: बन्नू
  rationale: यूनानी रूप को हिन्दी उच्चारण के अनुकूल सीधे लिप्यंतरित किया गया है; ‘बानी’ इब्रानी समानांतर से सामंजस्य होगा।
- source_word: Σουδίου
  choice: सूदियू
  rationale: असामान्य यूनानी नाम को उसी रूप में सुरक्षित रखा गया है; किसी अनुमानित इब्रानी नाम से प्रतिस्थापित नहीं किया गया।
- source_word: ἑβδομήκοντα τέσσαρες
  choice: चौहत्तर
  rationale: यह संख्या का सीधा और आधुनिक मानक हिन्दी रूप है।
