base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: hi
  text: और यहूदा और बिन्यामीन के गोत्र[a] के शत्रु यह सुनकर यह जानने आए कि तुरहियों की आवाज़ क्या थी[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘गोत्र’ एकवचन है, हालाँकि यहूदा और बिन्यामीन दोनों के नाम दिए गए हैं; अनुवाद ‘यहूदा और बिन्यामीन के गोत्रों’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘तुरहियों का स्वर क्या था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालवाचक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में व्यक्त करता है और मुख्य क्रिया से पहले सुनने की परिस्थिति बनाए रखता है। ‘यह’ प्रसंगगत ध्वनि की ओर संकेत करता है, यद्यपि यूनानी में कर्म स्पष्ट रूप से नहीं दिया गया।
- source_word: οἱ ἐχθροὶ
  choice: शत्रु
  rationale: यह निश्चित विरोधियों को सूचित करने वाला सीधा और गरिमापूर्ण हिन्दी पर्याय है; स्रोत में कोई संबंधवाचक सर्वनाम नहीं जोड़ा गया है।
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: यहूदा और बिन्यामीन के गोत्र
  rationale: यूनानी में φυλή एकवचन है, यद्यपि उसके साथ दो नाम जुड़े हैं। मुख्य पाठ में एकवचन ‘गोत्र’ रखकर स्रोत की असामान्य रचना सुरक्षित रखी गई है।
- source_word: ἦλθοσαν
  choice: आए
  rationale: सरल कथात्मक आगमन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιγνῶναι
  choice: यह जानने
  rationale: 'उद्देश्यसूचक infinitive को दर्शाता है: वे ध्वनि के विषय में पता लगाने आए थे।'
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: तुरहियों की आवाज़ क्या थी
  rationale: φωνή का प्रसंगानुकूल अर्थ ‘आवाज़’ है और σάλπιγγες के लिए ‘तुरहियाँ’ उपयुक्त है। यह अनुवाद ध्वनि की पहचान या उसके कारण के बारे में प्रश्न की कुछ अस्पष्टता बनाए रखता है।
