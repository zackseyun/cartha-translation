  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: hi
  text: और योसादेक के पुत्र येशू[a] ने अपने भाई याजकों और सलातीएल[b] के पुत्र ज़रुब्बाबेल तथा उसके भाइयों के साथ उठकर इस्राएल के परमेश्वर की वेदी तैयार की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी नाम Ἰησοῦς वही रूप है जिसे संदर्भ के अनुसार ‘यहोशू’ या ‘यीशु’ भी लिखा जाता है; यहाँ निर्वासनोत्तर याजक के लिए ‘येशू’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में Σαλαθιήλ है; इसी नाम का इब्रानी रूप प्रायः ‘शालतीएल’ लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: उठकर
  rationale: यह एकवचन पुल्लिंग एओरिस्ट कृदंत येशू की निर्णायक कार्रवाई आरम्भ करने को व्यक्त करता है। ‘उठकर’ स्वाभाविक हिन्दी में मुख्य क्रिया से इसका संबंध बनाए रखता है।
- source_word: Ἰησοῦς
  choice: येशू
  rationale: निर्वासनोत्तर याजकीय संदर्भ में यह नाम येशू के रूप में जाना जाता है। यूनानी रूप वही है जिसे अन्य संदर्भों में यहोशू या यीशु कहा जा सकता है।
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: योसादेक के पुत्र
  rationale: यूनानी संबंधसूचक रचना का आशय पुत्रत्व है; हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ / οἱ τούτου ἀδελφοὶ
  choice: अपने भाई / उसके भाइयों
  rationale: ἀδελφοί के पारिवारिक और पुल्लिंग अर्थ को बनाए रखा गया है; संदर्भ में ये निकट संबंधी या समूह के पुरुष सदस्य भी हो सकते हैं।
- source_word: οἱ ἱερεῖς
  choice: याजकों
  rationale: यह पद येशू के भाइयों की पहचान बताता है। ‘याजक’ आधुनिक हिन्दी बाइबिलीय प्रयोग में स्पष्ट और प्रतिष्ठित शब्द है।
- source_word: Ζοροβαβὲλ
  choice: ज़रुब्बाबेल
  rationale: निर्वासनोत्तर अगुवे के नाम का प्रचलित हिन्दी बाइबिलीय रूप अपनाया गया है।
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: सलातीएल के पुत्र
  rationale: यूनानी पाठ के Σαλαθιήλ को निकटता से दर्शाने वाला नाम-रूप रखा गया है और पुत्रत्व को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἡτοίμασαν
  choice: तैयार की
  rationale: क्रिया का मूल अर्थ ‘तैयार करना’ है। इससे यह अनावश्यक रूप से निश्चित नहीं किया जाता कि वेदी को नया बनाया गया, पुनर्निर्मित किया गया या स्थापित किया गया।
- source_word: τὸ θυσιαστήριον
  choice: वेदी
  rationale: θυσιαστήριον के लिए मानक, संक्षिप्त और स्वाभाविक हिन्दी शब्द।
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर की
  rationale: यूनानी संबंधकारक को स्वामित्व/सम्बद्धता के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: नेतृत्व और याजकीय समुदाय के संदर्भ में ἀδελφοί का अर्थ
  choice: भाई
  alternative: संबंधी; साथी याजक; इस्राएली भाई
  rationale: यूनानी पाठ स्पष्ट रूप से पुल्लिंग पारिवारिक शब्द का उपयोग करता है। व्यापक सामुदायिक अर्थ संभव है, पर उसे मुख्य पाठ में थोपना उचित नहीं।
- issue: निर्वासनोत्तर संदर्भ में Ἰησοῦς का नाम-रूप
  choice: येशू
  alternative: यहोशू; यीशु
  rationale: ऐतिहासिक व्यक्ति को सामान्य हिन्दी पाठक के लिए पहचानने योग्य रखते हुए नए नियम के यीशु से अनावश्यक भ्रम टाला गया है; अन्य सम्भव रूप पादटिप्पणी में बताए गए हैं।
- issue: वेदी से संबंधित कार्रवाई का स्वरूप
  choice: तैयार की
  alternative: स्थापित की; बनाई
  rationale: ἡτοίμασαν तैयारी को व्यक्त करता है, पर निर्माण या पुनःस्थापना की सटीक प्रक्रिया निश्चित नहीं करता; इसलिए मूल की व्यापकता बनाए रखी गई है।
