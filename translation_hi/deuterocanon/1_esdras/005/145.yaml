  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-संरचना में येशू के एकवचन कृदंत को ‘उठकर’ से और सभी अगुवों की संयुक्त कार्रवाई को ‘तैयार की’ से व्यक्त किया गया है। नामों में यूनानी साक्ष्य और प्रचलित हिन्दी बाइबिलीय पहचान के बीच संतुलन रखा गया है।
