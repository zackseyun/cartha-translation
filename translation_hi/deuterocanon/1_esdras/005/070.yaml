base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: hi
  text: और षड्यंत्र रचकर, लोगों को भड़काकर और गुट बनाकर उन्होंने राजा कुस्रू के जीवन भर भवन का निर्माण पूरा होने में बाधा डाली; और दारा के शासनकाल तक दो वर्ष के लिए उन्हें निर्माण करने से रोक दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: “और निर्माण-कार्य दो वर्ष तक, दारा के शासनकाल तक, रुका रहा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλάς
  choice: षड्यंत्र
  rationale: विरोधपूर्ण संदर्भ में यह तटस्थ योजनाओं के बजाय निर्माण रोकने के लिए रची गई कुटिल योजनाओं को व्यक्त करता है।
- source_word: δημαγωγοῦντες
  choice: लोगों को भड़काकर
  rationale: यह जनता को अपने प्रभाव में लेकर उकसाने का नकारात्मक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συστάσεις ποιούμενοι
  choice: गुट बनाकर
  rationale: यह निर्माण-कार्य के विरुद्ध संगठित समूह या गठबंधन बनाने का भाव संक्षेप और स्पष्टता से देता है।
- source_word: ἀπεκώλυσαν
  choice: बाधा डाली
  rationale: यह सक्रिय रुकावट को व्यक्त करता है, पर पूर्णतः और स्थायी रूप से रोक देने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: τοῦ ἀποτελεσθῆναι τὴν οἰκοδομήν
  choice: भवन का निर्माण पूरा होने में
  rationale: यह निष्क्रिय और परिणामपरक अर्थ—निर्माण का पूरा किया जाना—को स्वाभाविक हिन्दी में रखता है।
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: राजा कुस्रू के जीवन भर
  rationale: यूनानी वाक्यांश का सीधा कालगत अर्थ सुरक्षित रखते हुए हिन्दी में सहज अभिव्यक्ति देता है; इसे चुपचाप केवल शासनकाल में नहीं बदलता।
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: उन्हें निर्माण करने से रोक दिया गया
  rationale: क्रिया का बहुवचन निष्क्रिय रूप स्वाभाविक रूप से व्यक्तियों की ओर संकेत करता है, यद्यपि निर्माण-कार्य को विषय मानने की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἔτη δύο
  choice: दो वर्ष के लिए
  rationale: रोक की अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: दारा के शासनकाल तक
  rationale: βασιλεία के कालगत अर्थ का सामान्य और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: अंतिम निष्क्रिय उपवाक्य का विषय और कर्तृता
  choice: बहुवचन εἰρχθησαν के अनुसार व्यक्तियों को विषय मानते हुए ‘उन्हें निर्माण करने से रोक दिया गया’
  alternative: ‘निर्माण-कार्य दो वर्ष तक रुका रहा’
  rationale: यूनानी क्रिया बहुवचन है और व्यक्तियों को विषय मानना व्याकरणतः अधिक सीधा है; फिर भी संबंधकारक निर्माण-वाक्यांश के कारण कार्य-केंद्रित अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: कुस्रू से संबंधित समय-वाक्यांश
  choice: ‘राजा कुस्रू के जीवन भर’
  alternative: ‘राजा कुस्रू के पूरे शासनकाल में’
  rationale: मूल में स्पष्टतः ‘जीवन’ (ζωῆς) है। ऐतिहासिक संदर्भ शासनकाल की ओर संकेत कर सकता है, पर अनुवाद में उस अर्थ को बिना संकेत के प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए स्पष्ट शैली। ‘कुस्रू’ और ‘दारा’ प्रचलित बाइबिलीय हिन्दी नामरूप हैं। मूल यूनानी में उपस्थित पुनरुक्ति और अंतिम निष्क्रिय वाक्य की अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
