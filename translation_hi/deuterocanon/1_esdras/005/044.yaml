base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: hi
  text: और कार्यों के लिए पवित्र भंडार[a] में सोने के एक हज़ार मीना, चाँदी के पाँच हज़ार मीना[b], और एक सौ याजकीय वस्त्र देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर का भंडार।” यूनानी पद में पवित्र-स्थान से संबंध और भंडार, दोनों भाव हैं।
    reason: lexical_alternative
  - marker: b
    text: मीना प्राचीन काल में भार और, उससे जुड़े अर्थ में, मूल्य की एक इकाई थी। यहाँ इसे किसी आधुनिक इकाई में नहीं बदला गया है।
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: देना
  rationale: यूनानी क्रिया के अनंत रूप को सीधे रूप में रखता है और प्रसंग में चल रही क्रिया-श्रृंखला से जुड़ता है; ‘दान करना’ औपचारिक दान का अतिरिक्त भाव जोड़ सकता था।
- source_word: ἱερὸν γαζοφυλάκιον
  choice: पवित्र भंडार
  rationale: γαζοφυλάκιον धन अथवा बहुमूल्य वस्तुओं के भंडार को और ἱερόν उसके पवित्र-स्थान से संबंध को व्यक्त करता है। ‘पवित्र भंडार’ दोनों तत्वों को बनाए रखता है।
- source_word: τῶν ἔργων
  choice: निर्माण-कार्यों के लिए
  rationale: शाब्दिक ‘कार्यों के लिए’ हिंदी में अस्पष्ट होता; संदर्भानुसार यह भवन के निर्माण अथवा पुनर्निर्माण के कार्य हैं। बहुवचन का भाव बनाए रखा गया है।
- source_word: χρυσίου μνᾶς χιλίας
  choice: एक हज़ार मीना सोना
  rationale: प्राचीन भार और मूल्य की इकाई μνᾶ को आधुनिक माप में बदले बिना ‘मीना’ के रूप में रखा गया है।
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: पाँच हज़ार मीना चाँदी
  rationale: सोने वाले समानांतर वाक्यांश के अनुरूप मात्रा और धातु दोनों स्पष्ट रखे गए हैं।
- source_word: στολὰς ἱερατικὰς
  choice: याजकों के वस्त्र
  rationale: στολή के व्यापक अर्थ ‘वस्त्र’ को सरल आधुनिक हिंदी में रखा गया है और ἱερατικά को उनके याजकीय उपयोग के रूप में व्यक्त किया गया है।
- source_word: ἑκατόν
  choice: एक सौ
  rationale: सूची की औपचारिक शैली के अनुरूप संख्या का सीधा अनुवाद है।
