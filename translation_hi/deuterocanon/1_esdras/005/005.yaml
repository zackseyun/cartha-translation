base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: hi
  text: याजक—पीनहास के पुत्र[a], हारून के पुत्र—सरायाह के पुत्र योसादाक के पुत्र येशू[b], और शालतीएल के पुत्र जरुब्बाबेल के पुत्र योआकीम, जो दाऊद के घराने और पेरेस के वंश से था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावली में यूनानी शब्द ‘पुत्र’ केवल सीधे बेटों के लिए नहीं, बल्कि बाद के वंशजों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी नाम Ἰησοῦς को ‘यहोशू’ भी लिखा जा सकता है और दूसरे संदर्भों में यही नाम ‘यीशु’ होता है; यहाँ निर्वासनोत्तर याजक के लिए ‘येशू’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: संज्ञा बहुवचन है और आगे दिए गए याजकीय वंश का परिचय देती है। हिंदी में ‘याजक’ का रूप एकवचन और बहुवचन दोनों में समान रह सकता है।
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: पीनहास के पुत्र, हारून के पुत्र
  rationale: ‘पुत्र’ स्रोत की वंशावली-संबंधी पुनरुक्ति को बनाए रखता है; पाद-टिप्पणी स्पष्ट करती है कि यहाँ दूर के वंशज भी अभिप्रेत हो सकते हैं।
- source_word: Ἰησοῦς
  choice: येशू
  rationale: निर्वासनोत्तर याजकीय व्यक्ति के लिए प्रचलित पुराना-नियम नामरूप है और हिंदी पाठक को नए नियम के यीशु से अनावश्यक रूप से नहीं मिलाता।
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: सरायाह के पुत्र योसादाक के पुत्र
  rationale: यूनानी संबंधकारक शृंखला को हिंदी की स्वाभाविक उलटी वंशावली-रचना में रखा गया है, जिससे येशू की पितृ-रेखा स्पष्ट रहती है।
- source_word: Ἰωακεὶμ
  choice: योआकीम
  rationale: यह रूप यूनानी नाम के निकट और आधुनिक हिंदी में सुगम है; इसे राजकीय नाम ‘यहोयाकीम’ में विस्तृत नहीं किया गया।
- source_word: ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: शालतीएल के पुत्र जरुब्बाबेल के पुत्र
  rationale: संबंधकारक वंशावली को हिंदी क्रम में व्यक्त किया गया है और स्रोत की दोनों पीढ़ियाँ सुरक्षित रखी गई हैं।
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: दाऊद के घराने से
  rationale: ‘घराना’ यहाँ परिवार के साथ राजवंशीय संबंध भी स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: पेरेस के वंश से
  rationale: γενεά यहाँ समयगत ‘पीढ़ी’ के बजाय वंश-परंपरा को दर्शाता है; इसलिए ‘वंश’ अधिक स्पष्ट है।
theological_decisions:
- issue: वंशावली में ‘पुत्र’ का दायरा
  choice: स्रोत की पुनरावृत्त ‘पुत्र’ भाषा को बनाए रखा और पाद-टिप्पणी में उसके व्यापक वंशज-अर्थ को बताया।
  alternative: हर स्थान पर ‘वंशज’ कहना।
  rationale: इससे मूल की वंशावली-संरचना सुरक्षित रहती है, पर पीढ़ियों के बीच तत्काल पिता-पुत्र संबंध को अनिवार्य नहीं ठहराया जाता।
- issue: दाऊदी और पेरेसी वंश का व्याकरणिक संबंध
  choice: ‘जो ... से थे’ द्वारा इसे निकटतम नाम योआकीम से जोड़ा, जैसा यूनानी क्रम स्वाभाविक रूप से संकेत करता है।
  alternative: इसे पूरी सूची अथवा दोनों नामित व्यक्तियों पर लागू करना।
  rationale: यूनानी में वाक्यांश योआकीम की वंशावली के तुरंत बाद आता है; अनावश्यक रूप से उसका विस्तार करना याजकीय और दाऊदी वंशों को मिला सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली-पाठ के अनुरूप है। डैश से ‘पीनहास के पुत्र, हारून के पुत्र’ को आरंभिक ‘याजक’ का वंशगत विवरण दिखाया गया है; अल्पविराम पर समाप्ति दी गई है क्योंकि उपलब्ध स्रोत-पाठ आगे चलने वाली सूची का अंश है।
