base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: hi
  text: नतीजा यह हुआ कि लोगों के रोने के कारण लोग तुरहियाँ नहीं सुन पा रहे थे[a]; क्योंकि भीड़ बहुत ऊँचे स्वर में तुरहियाँ बजा रही थी[b], इसलिए उसकी ध्वनि दूर से सुनी जाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 3:11 के इब्रानी समानांतर में लोग यहोवा की स्तुति करते हुए बड़े जोर से जयजयकार करते हैं; यहाँ 1 एस्द्रास का पाठ तुरहियों और लोगों के रोने की आवाज़ को प्रमुखता देता है।
    reason: cross_reference
  - marker: b
    text: या, “तुरहियों की ध्वनि।” यूनानी में शाब्दिक रूप से “तुरहियाँ” है, पर आशय उनके बजने की ध्वनि भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इस कारण
  rationale: यह परिणाम को व्यक्त करता है और पिछले प्रसंग से वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: τὸν λαὸν μὴ ἀκούειν τῶν σαλπίγγων
  choice: लोगों के रोने की आवाज़ में तुरहियों की ध्वनि सुनाई नहीं दे रही थी
  rationale: यूनानी में शाब्दिक रूप से ‘लोग तुरहियों को न सुन सकें’ है; हिन्दी में ध्वनियों के दब जाने का परिणाम इस रूप में स्पष्ट और स्वाभाविक है।
- source_word: διὰ τὸν κλαυθμὸν τοῦ λαοῦ
  choice: लोगों के रोने की आवाज़ में
  rationale: κλαυθμός श्रव्य रोने या विलाप को दर्शाता है; ‘रोने की आवाज़’ प्रसंग के ध्वनि-संघर्ष को सामने रखता है।
- source_word: ὁ γὰρ ὄχλος
  choice: क्योंकि भीड़
  rationale: ὄχλος जनसमूह के लिए है; ‘भीड़’ आधुनिक और सहज हिन्दी है।
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: बड़े जोर से तुरहियाँ बजा रही थी
  rationale: संक्षिप्त यूनानी रचना का स्वाभाविक हिन्दी रूप; निकटवर्ती σάλπιγγες से वाद्य का कर्म स्पष्ट किया गया है।
- source_word: μακρόθεν ἀκούεσθαι
  choice: उसकी आवाज़ दूर तक सुनाई दे रही थी
  rationale: निष्क्रिय यूनानी वाक्यांश को स्पष्ट हिन्दी में प्रस्तुत करते हुए श्रव्य ध्वनि को संकेतित किया गया है।
theological_decisions:
- issue: एज्रा 3:11 के इब्रानी समानांतर और 1 एस्द्रास के यूनानी पाठ का अंतर
  choice: मुख्य पाठ में यूनानी के अनुसार तुरहियों और रोने को रखा गया
  alternative: इब्रानी समानांतर के अनुसार यहोवा की स्तुति में लोगों की बड़ी जयजयकार लिखना
  rationale: दिए गए पद के लिए यूनानी पाठ प्राथमिक स्रोत है; इब्रानी समानांतर केवल पाठीय और प्रसंगगत तुलना के लिए है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘तुरही’ सामान्य पाठक के लिए परिचित बाइबलीय वाद्य-शब्द है। दो परस्पर प्रतिस्पर्धी ध्वनियों—रोना और तुरहियाँ—को स्पष्ट रखा गया है, जबकि यूनानी की संक्षिप्तता से उत्पन्न दूसरी उपवाक्य की हल्की अस्पष्टता पादटिप्पणी में सुरक्षित है।
