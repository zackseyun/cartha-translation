base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: hi
  text: वे सब बारह वर्ष और उससे अधिक आयु के इस्राएली थे। दास-दासियों[a] को छोड़कर उनकी संख्या 42,360 थी। उनके दास-दासियों की संख्या 7,337 थी; और गायकों तथा गायिकाओं की संख्या 245 थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सेवक-सेविकाएँ’। यूनानी शब्द घरेलू आश्रितों या दास-दासियों का अर्थ दे सकते हैं; इस जनगणना-संदर्भ में इन्हें मुख्य जनसंख्या से अलग गिना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ πάντες ἦσαν Ἰσραήλ
  choice: वे सब ... इस्राएली थे
  rationale: यह पहले गिनाए गए लौटनेवालों का समाहार है। यूनानी का शाब्दिक अर्थ ‘वे सब इस्राएल थे’ है, पर आधुनिक हिन्दी में समुदाय की पहचान के लिए ‘इस्राएली थे’ स्वाभाविक है।
- source_word: ἀπὸ δωδεκαετοῦς
  choice: बारह वर्ष और उससे अधिक आयु के
  rationale: यह जनगणना में सम्मिलित लोगों की न्यूनतम आयु बताता है; ‘और उससे अधिक’ समावेशी सीमा को स्पष्ट करता है।
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: दास-दासियों को छोड़कर
  rationale: παῖδες और παιδίσκαι के अर्थ बालक-बालिकाएँ भी हो सकते हैं, किंतु अलग से दी गई उनकी संख्या और सूची का घरेलू-सामाजिक संदर्भ आश्रित दास-दासियों की ओर संकेत करता है। हिन्दी में ‘दास-दासियाँ’ उनकी अधीन सामाजिक स्थिति को ‘सेवक-सेविकाएँ’ से अधिक स्पष्ट रखता है।
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: 42,360
  rationale: यूनानी संख्या का सीधा, पठनीय अंकात्मक रूप।
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: उनके दास-दासियों
  rationale: τούτων को ‘उनके’ और लिंगभेद वाले युग्म को संक्षिप्त, स्वाभाविक हिन्दी ‘दास-दासियों’ से व्यक्त किया गया है।
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: 7,337
  rationale: यूनानी संख्या का सीधा अंकात्मक रूप।
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: गायक तथा गायिकाएँ
  rationale: यूनानी में दो अलग रूप हैं, जो यहाँ पुरुष और स्त्री गायकों का भेद बनाए रखते हैं; हिन्दी युग्म इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: '245'
  rationale: यूनानी संख्या का सीधा अंकात्मक रूप।
theological_decisions:
- issue: ἦσαν Ἰσραήλ में सामुदायिक/वाचागत पहचान
  choice: इस्राएली थे
  alternative: इस्राएल थे
  rationale: ‘इस्राएली थे’ आधुनिक हिन्दी में व्यक्तियों की सामुदायिक पहचान स्पष्ट करता है, जबकि ‘इस्राएल थे’ अत्यधिक शाब्दिक और अस्वाभाविक होगा; इससे पद का धार्मिक-सामुदायिक आशय कम नहीं होता।
- issue: παῖδες / παιδίσκαι की सामाजिक स्थिति
  choice: दास-दासियाँ
  alternative: सेवक-सेविकाएँ; बालक-बालिकाएँ
  rationale: गणना में मुख्य समुदाय से अलग उनकी संख्या देना घरेलू अधीनस्थों की ओर संकेत करता है। ‘दास-दासियाँ’ संभव बंधुआ स्थिति को अस्पष्ट नहीं करता, यद्यपि यूनानी शब्द अपने आप में आयु अथवा कानूनी स्थिति को पूरी तरह निश्चित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। संख्याएँ लंबी शब्दावली के बजाय अंकों में दी गई हैं। यूनानी के लिंगभेद को ‘गायक तथा गायिकाएँ’ में सुरक्षित रखा गया है। कोई पाद-टिप्पणी नहीं दी गई, इसलिए मुख्य पाठ में पाद-टिप्पणी चिह्न आवश्यक नहीं हैं।
