base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: hi
  text: और नहेमायाह और अथारियास ने उनसे कहा कि वे पवित्र वस्तुओं में से तब तक भाग न लें, जब तक प्रकाशन और सत्य धारण किए हुए कोई याजक न उठे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से “प्रकाशन और सत्य” उन याजकीय वस्तुओं की ओर संकेत करते हैं जिन्हें इब्रानी समानांतर पाठ में “उरीम और तुम्मीम” कहा गया है।
    reason: alternative_reading
  - marker: b
    text: अर्थात् जब तक कोई योग्य याजक निर्णायक उत्तर न दे सके, तब तक उन्हें याजकों के लिए ठहराए गए पवित्र अंशों में से खाने की अनुमति नहीं थी।
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: ने उनसे कहा
  rationale: यह यूनानी वाक्यांश का स्वाभाविक और निर्देशात्मक हिन्दी रूप है।
- source_word: Ναιμίας
  choice: नहेमायाह
  rationale: यूनानी नाम का प्रचलित बाइबलीय हिन्दी रूप अपनाया गया है।
- source_word: Ἀθαρίας
  choice: अथरियास
  rationale: प्राथमिक यूनानी पाठ के नाम-रूप का निकट देवनागरी लिप्यंतरण किया गया है; इसे अनुमानतः अजर्याह नहीं बनाया गया।
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: पवित्र वस्तुओं में से ... भाग न लें
  rationale: μετέχω के सहभागिता/उपभोग के भाव और τὰ ἅγια के व्यापक पवित्र, विशेषतः याजकीय, पदार्थों के संकेत—दोनों को सुरक्षित रखता है।
- source_word: ἕως ἀναστῇ ἱερεὺς
  choice: जब तक ऐसा याजक न उठे
  rationale: ἕως के बाद भविष्य की अनिश्चित घटना तथा ἀναστῇ के शाब्दिक ‘उठने’ के भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐνδεδυμένος
  choice: धारण किए हो
  rationale: वस्त्र पहने होने के शाब्दिक चित्र को बनाए रखते हुए उन याजकीय वस्तुओं को साथ रखने/पहने होने का स्वाभाविक हिन्दी भाव देता है।
- source_word: τὴν δήλωσιν
  choice: प्रकाशन
  rationale: δήλωσις का अर्थ प्रकट करना, स्पष्ट करना या प्रकाशन है; मुख्य पाठ यूनानी अर्थवाची रूप को रखता है, जबकि पारंपरिक पहचान पादटिप्पणी में दी गई है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य
  rationale: ἀλήθεια का सीधा अर्थ ‘सत्य’ है; उरीम-तुम्मीम से संभावित संबंध को मुख्य पाठ में प्रतिस्थापित करने के बजाय पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: δήλωσις और ἀλήθεια को यूनानी अर्थों से अनूदित किया जाए या सीधे ‘उरीम और तुम्मीम’ कहा जाए
  choice: मुख्य पाठ में ‘प्रकाशन और सत्य’; पादटिप्पणी में ‘उरीम और तुम्मीम’ की पारंपरिक पहचान
  alternative: मुख्य पाठ में ‘उरीम और तुम्मीम’
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है और यहाँ वह इब्रानी शब्दों का लिप्यंतरण नहीं, अर्थवाची पद देता है। यह चुनाव यूनानी साक्ष्य को दृश्यमान रखता है और इब्रानी समानांतर की महत्वपूर्ण पहचान भी पादटिप्पणी में सुरक्षित करता है।
- issue: τῶν ἁγίων का आशय सामान्य पवित्र वस्तुएँ है या याजकीय पवित्र भोजन
  choice: मुख्य पाठ में व्यापक ‘पवित्र वस्तुएँ’; पादटिप्पणी में याजकीय पवित्र अंशों के भोजन का संदर्भ
  alternative: मुख्य पाठ में ‘याजकों के लिए ठहराए गए पवित्र भोजन’
  rationale: यूनानी अभिव्यक्ति व्यापक है, यद्यपि प्रसंग उसका संकेत पवित्र याजकीय अंशों की ओर करता है। मुख्य पाठ में अनावश्यक विशिष्टीकरण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’, ‘पवित्र वस्तुएँ’, ‘प्रकाशन’ और ‘सत्य’ धार्मिक प्रसंग का औपचारिक स्तर बनाए रखते हैं।
