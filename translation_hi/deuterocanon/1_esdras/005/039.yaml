base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: hi
  text: और वह उसके नाम से पुकारा गया।[a] इनमें से जिन लोगों को नामांकन-सूची में वंशावली-अभिलेख के आधार पर खोजा गया, पर उनका वंशावली-अभिलेख नहीं मिला, उन्हें याजक के रूप में सेवा करने से अलग कर दिया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका नाम उसके नाम पर रखा गया।” यूनानी वाक्यांश संक्षिप्त है और इस पद में ‘उसके’ का संदर्भ पूरी तरह स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात आधिकारिक वंशावली-अभिलेख में उनके वंश का प्रमाण नहीं मिला, इसलिए वे याजक के रूप में सेवा करने के योग्य नहीं माने गए।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: वह उसके नाम से पुकारा गया
  rationale: यह नामकरण अथवा नाम से पहचाने जाने का भाव रखता है और यूनानी की संक्षिप्तता तथा अस्पष्ट संदर्भ को बनाए रखता है।
- source_word: ἐζητήθησαν
  choice: जिन लोगों को ... खोजा गया
  rationale: यूनानी निष्क्रिय वाच्य को बनाए रखता है; अभिलेख में उनकी पहचान या प्रविष्टि खोजे जाने का प्रशासनिक भाव है।
- source_word: τῆς γενικῆς γραφῆς
  choice: वंशावली-अभिलेख
  rationale: याजकीय पात्रता प्रमाणित करने वाले लिखित वंश-संबंधी दस्तावेज़ का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἐν τῷ καταλοχισμῷ
  choice: नामांकन के ... में
  rationale: सूची में दर्ज करने या आधिकारिक पंजीकरण का प्रशासनिक अर्थ व्यक्त करता है, बिना अनावश्यक सैनिक अर्थ के।
- source_word: μὴ εὑρεθείσης
  choice: पर वे नहीं मिले
  rationale: व्याकरणिक रूप से निकटस्थ स्त्रीलिंग γενικῆς γραφῆς की ओर संकेत संभव है, जबकि आशय व्यक्तियों की अभिलेखीय पुष्टि न मिलना भी हो सकता है; मुख्य पाठ स्वाभाविक हिन्दी में इस संक्षिप्तता को रखता है और पादटिप्पणी स्पष्ट करती है।
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: उन्हें याजक के रूप में सेवा करने से अलग कर दिया गया
  rationale: मूल क्रिया के ‘अलग किए जाने’ और infinitive के याजकीय सेवा-संबंधी भाव, दोनों को सुरक्षित रखता है; यह पूर्ण और स्थायी पदच्युति का अनावश्यक दावा नहीं करता।
theological_decisions:
- issue: याजकीय सेवा से अलग किए जाने का स्वरूप
  choice: वंशावली की अभिलेखीय पुष्टि न मिलने के कारण याजकीय सेवा से अलग किया जाना
  alternative: उन्हें सर्वथा और स्थायी रूप से याजकत्व से निकाल दिया गया
  rationale: पद प्रशासनिक और वंशावली-संबंधी अयोग्यता बताता है; वह इसकी अवधि या अंतिमता स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘याजक’ और ‘वंशावली-अभिलेख’ प्रसंग की धार्मिक तथा प्रशासनिक प्रकृति को स्पष्ट रखते हैं।
