base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: hi
  text: अतः अब, हे राजा, निर्णय किया जाए; और राजा महाराज के बाबुल में स्थित राजकीय अभिलेखागारों में जाँच कराई जाए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदसमूह समय और निष्कर्ष—दोनों का संकेत देता है; ‘इसलिए अब’ दोनों बलों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κρίνεται
  choice: यह निर्णय लिया जाए
  rationale: निष्क्रिय, निर्वैयक्तिक रूप यहाँ किसी आधिकारिक निर्णय की माँग करता है; यह अनुवाद प्रशासनिक संदर्भ के अनुकूल है।
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: सम्बोधन कारक का औपचारिक और विनयपूर्ण स्वर सुरक्षित रहता है।
- source_word: ἐπισκεπτήτω
  choice: जाँच कराई जाए
  rationale: आदेशात्मक रूप अभिलेखों की आधिकारिक जाँच का आग्रह करता है; हिन्दी में प्रेरणार्थक निष्क्रिय प्रयोग यह भाव स्पष्ट करता है।
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: राजकीय अभिलेखागारों
  rationale: शब्द उन स्थानों को दर्शाता है जहाँ पुस्तकें या दस्तावेज़ सुरक्षित रखे जाते थे; इस प्रशासनिक संदर्भ में ‘अभिलेखागार’ सर्वाधिक सटीक है।
- source_word: τοῦ κυρίου βασιλέως
  choice: मेरे स्वामी राजा के
  rationale: यह सांसारिक राजा के लिए दरबारी आदरसूचक पदबंध है; ‘मेरे स्वामी राजा’ विनम्रता दिखाता है और इसे ईश्वरीय उपाधि बनने से रोकता है।
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: बाबुल में स्थित
  rationale: यह पदबंध अभिलेखागारों का स्थान निर्दिष्ट करता है; ‘स्थित’ सम्बन्ध को हिन्दी में स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: दरबारी पदबंध τοῦ κυρίου βασιλέως में κύριος का अर्थ
  choice: मेरे स्वामी राजा के
  alternative: प्रभु राजा के
  rationale: यहाँ κύριος परमेश्वर की उपाधि नहीं, बल्कि सांसारिक राजा के लिए आदरसूचक सम्बोधन है; इसलिए ‘स्वामी’ अनावश्यक धार्मिक संकेत से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में औपचारिक, विनयपूर्ण प्रशासनिक शैली रखी गई है। यूनानी वाक्य के अंत में अल्पविराम बताता है कि वाक्य अगले पद में जारी है, इसलिए अनुवाद भी अल्पविराम पर समाप्त किया गया है।
