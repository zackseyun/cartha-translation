base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: hi
  text: और मैंने भी आज्ञा दी कि उसका निर्माण पूरी तरह किया जाए और ध्यान रखा जाए[a] कि वे यहूदिया के निर्वासितों[b] के साथ मिलकर काम करें, जब तक प्रभु का भवन पूरा न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी क्रिया का शाब्दिक अर्थ ‘ध्यान से देखना’ है; यहाँ इसका भाव ‘देखरेख करना’, ‘ध्यान रखना’ या ‘सुनिश्चित करना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘यहूदिया की बंधुआई/निर्वासन से [आए] लोग।’ यूनानी वाक्यांश यहूदिया के निर्वासित लोगों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: और मैंने भी
  rationale: यह राजकीय आदेश के प्रथम-पुरुष कथन को आगे बढ़ाता है। ‘भी’ κἀγώ के योगात्मक भाव को और ‘और’ δέ के संयोजक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπέταξα
  choice: आज्ञा दी
  rationale: ἐπιτάσσω का यह रूप अधिकारपूर्वक आदेश देने का भाव रखता है; ‘आज्ञा दी’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: ὁλοσχερῶς
  choice: पूरी तरह
  rationale: यह क्रियाविशेषण निर्माण-कार्य को पूर्ण रूप से किए जाने पर बल देता है।
- source_word: οἰκοδομῆσαι
  choice: उसे ... बनाया जाए
  rationale: आदेश के बाद आया अनंत क्रियारूप निर्माण की आज्ञा की विषयवस्तु बताता है। यूनानी में कर्म स्पष्ट रूप से नहीं दोहराया गया; हिन्दी में ‘उसे’ संदर्भित भवन की ओर संकेत करता है। ‘बनाया जाए’ मूल क्रिया के निकट है और अनावश्यक रूप से ‘फिर से’ नहीं जोड़ता।
- source_word: ἀτενίσαι
  choice: यह सुनिश्चित किया जाए
  rationale: शाब्दिक अर्थ ध्यान से देखना या दृष्टि लगाए रखना है, पर यहाँ प्रशासनिक संदर्भ में सावधानी से देखरेख करने अथवा किसी बात को सुनिश्चित करने का भाव उपयुक्त है।
- source_word: ἵνα συνποιῶσιν
  choice: कि वे ... के साथ मिलकर काम करें
  rationale: ἵνα उद्देश्य या अपेक्षित परिणाम बताता है और συνποιέω संयुक्त रूप से काम करने या सहयोग देने का भाव रखता है।
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: यहूदिया की बँधुआई से आए लोगों
  rationale: यह वाक्यांश यहूदिया की बँधुआई से संबद्ध लोगों को दर्शाता है। ‘से आए’ ἐκ को बनाए रखता है, जबकि ‘लौटे हुए’ जैसी संदर्भगत बात को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ता।
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: जब तक ... पूरा न हो जाए
  rationale: यह रचना कार्य की अवधि को उसकी पूर्णता तक सीमित करती है; चुना गया रूप स्वाभाविक हिन्दी में उस अंतिम बिंदु को व्यक्त करता है।
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: प्रभु का भवन
  rationale: ‘भवन’ οἶκος की मूल छवि बनाए रखता है और इस संदर्भ में मंदिर को सूचित करता है; ‘प्रभु’ यूनानी κύριος का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: मंदिर-संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: आधार-पाठ यूनानी है और उसमें κυρίου आया है, प्रत्यक्ष रूप से इब्रानी दिव्य नाम नहीं। इसलिए मुख्य पाठ में ‘प्रभु’ स्रोत के अनुरूप है और किसी विशिष्ट इब्रानी पुनर्निर्माण को आरोपित नहीं करता।
- issue: οἶκος को मंदिर के रूप में स्पष्ट करना
  choice: भवन
  alternative: मंदिर
  rationale: संदर्भ निस्संदेह मंदिर का है, फिर भी ‘भवन’ मूल ‘घर/भवन’ रूपक को सुरक्षित रखता है और पाठ की अभिव्यक्ति को अनावश्यक रूप से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और राजकीय आदेश के अनुरूप गरिमापूर्ण रखी गई है। वाक्य की लंबी यूनानी संरचना को एक ही प्रवाह में रखा गया है, पर हिन्दी में स्पष्टता के लिए कर्मवाच्य रूपों का प्रयोग हुआ है। फुटनोट-चिह्न उन्हीं पदों के साथ लगाए गए हैं जिनकी व्याख्या वे करते हैं।
