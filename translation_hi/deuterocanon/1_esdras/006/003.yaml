base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: hi
  text: उसी समय सीरिया और फीनीके का राज्यपाल सिसिन्नेस[a], सथ्राबुज़ानेस और उनके सहयोगियों के साथ, उनके पास उपस्थित था। उसने उनसे कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उसने उनसे कहा’ की क्रिया एकवचन है। इससे सबसे स्वाभाविक रूप से सिसिन्नेस मुख्य वक्ता समझा जाता है, यद्यपि सथ्राबुज़ानेस और सहयोगी भी उसके साथ थे।
    reason: एकवचन क्रिया के वक्ता की पहचान स्पष्ट करना, बिना पाठ की संरचनात्मक गुंजाइश मिटाए।
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: उसी समय
  rationale: यह स्वाभाविक हिन्दी काल-सूचक अभिव्यक्ति है और αὐτῷ के हल्के बल सहित कथा की समयगत कड़ी को बनाए रखती है।
- source_word: παρῆν πρὸς αὐτούς
  choice: उनके पास उपस्थित था
  rationale: παρῆν मुख्यतः उपस्थित होने को दर्शाता है, आने या पहुँचने को नहीं; ‘उनके पास’ πρὸς αὐτούς के संबंधपरक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Σισίννης
  choice: सिसिन्नेस
  rationale: व्यक्तिनाम का यूनानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: ὁ ἔπαρχος
  choice: राज्यपाल
  rationale: क्षेत्र पर शासन करने वाले अधिकारी के लिए यह स्पष्ट, प्रतिष्ठित और सामान्य आधुनिक हिन्दी पद है।
- source_word: Συρίας καὶ Φοινίκης
  choice: सीरिया और फीनीके का
  rationale: सम्बन्धकारक पद अधिकारी के अधिकार-क्षेत्र बताते हैं; ‘का’ दोनों क्षेत्रों को संयुक्त रूप से ‘राज्यपाल’ से जोड़ता है।
- source_word: Σαθραβουζάνης
  choice: सथ्राबुज़ानेस
  rationale: व्यक्तिनाम का यूनानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: οἱ συνέταιροι
  choice: उनके सहयोगी
  rationale: प्रशासनिक प्रसंग में ‘सहयोगी’ साझेदारों या साथ काम करने वालों का सहज अर्थ देता है। ‘उनके’ का बहुवचन सिसिन्नेस और सथ्राबुज़ानेस से जुड़े दल को स्वाभाविक रूप से इंगित करता है, जबकि यूनानी स्वयं स्वामित्व स्पष्ट नहीं करता।
- source_word: καὶ εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: εἶπεν एकवचन है, इसलिए हिन्दी में भी एकवचन वक्ता रखा गया है; सबसे स्वाभाविक पूर्वपद सिसिन्नेस है।
