base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: hi
  text: और यदि यह पाया जाए कि यरूशलेम में प्रभु के भवन का निर्माण[a] राजा कुस्रू की अनुमति से हुआ था, और यदि हमारे स्वामी राजा को उचित लगे, तो वह इन बातों के विषय में हमें संदेश भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘यरूशलेम में प्रभु का निर्माण’ है; प्रसंग के अनुसार अर्थ यरूशलेम में प्रभु के भवन या मंदिर का निर्माण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: यदि यह पाया जाए
  rationale: यह शर्तसूचक कर्मवाच्य को बनाए रखता है और अभिलेखों में आधिकारिक जाँच के प्रसंग के अनुकूल है।
- source_word: μετὰ τῆς γνώμης
  choice: की अनुमति से
  rationale: γνώμη का अर्थ मत, निर्णय, सहमति या अधिकार देना हो सकता है; राजकीय प्रशासनिक प्रसंग में अनुमति सबसे स्वाभाविक रूप से कुस्रू की आधिकारिक स्वीकृति व्यक्त करती है।
- source_word: τὴν οἰκοδομὴν
  choice: निर्माण
  rationale: यह शब्द निर्माण की क्रिया या परियोजना को दर्शाता है। यहाँ पुनर्निर्माण कहना मूल यूनानी से अधिक विशिष्ट होता।
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: यरूशलेम में प्रभु के भवन का
  rationale: यूनानी में शाब्दिक रूप से ‘यरूशलेम में स्थित प्रभु का निर्माण’ है; मंदिर-निर्माण के प्रसंग में हिन्दी की स्पष्टता के लिए ‘भवन’ जोड़ा गया है, जिसकी सूचना पादटिप्पणी में दी गई है।
- source_word: κρίνηται
  choice: उचित लगे
  rationale: राजकीय पत्राचार में यह अभिव्यक्ति उस बात को बताती है जिसे शासक ठीक या उपयुक्त माने; ‘उचित लगे’ विनम्र निवेदन का भाव बनाए रखता है।
- source_word: τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: हमारे स्वामी राजा को
  rationale: यहाँ κύριος फारसी राजा के लिए आदरसूचक संबोधन है। ‘स्वामी’ इसे परमेश्वर के लिए प्रयुक्त ‘प्रभु’ से स्पष्ट रूप से अलग करता है।
- source_word: προσφωνησάτω ἡμῖν
  choice: वह ... हमें संदेश भेजे
  rationale: क्रिया का मूल भाव संबोधित करना या कह भेजना है; प्रशासनिक पत्राचार में ‘संदेश भेजे’ आधिकारिक उत्तर-संचार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περὶ τούτων
  choice: इन बातों के विषय में
  rationale: बहुवचन उन विषयों की ओर संकेत करता है जिनकी जाँच की जा रही है; यह औपचारिक पत्र-शैली के अनुकूल है।
theological_decisions:
- issue: एक ही पद में κύριος का परमेश्वर और राजा—दोनों के लिए प्रयोग
  choice: परमेश्वर के लिए ‘प्रभु’ और राजा के लिए ‘स्वामी’
  alternative: दोनों के लिए ‘प्रभु’ अथवा राजा के लिए ‘मालिक’
  rationale: दो अलग संदर्भों को बिना धार्मिक अर्थ मिलाए स्पष्ट रखा गया है। ‘प्रभु’ दिव्य उपाधि और ‘स्वामी’ राजकीय आदरसूचक संबोधन को स्वाभाविक हिन्दी में अलग करते हैं।
- issue: τοῦ κυρίου में भवन या मंदिर का निहित अर्थ
  choice: मुख्य पाठ में ‘प्रभु के भवन का निर्माण’
  alternative: ‘प्रभु का निर्माण’ या ‘प्रभु के मंदिर का निर्माण’
  rationale: संदर्भ उपासना-भवन के निर्माण का है। ‘भवन’ बाइबलीय मुहावरे के निकट रहते हुए अर्थ स्पष्ट करता है; ‘मंदिर’ संभव है, पर यूनानी में यहाँ वह संज्ञा प्रत्यक्ष रूप से नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में राजकीय पत्राचार की विनम्र औपचारिकता बनाए रखने के लिए ‘यदि ... उचित लगे’ और ‘संदेश भेजे’ का प्रयोग किया गया है।
