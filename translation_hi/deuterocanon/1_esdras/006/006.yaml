- source_word: οὐκ ἐκωλύθησαν
  choice: उन्हें ... नहीं रोका गया
  rationale: κωλύω के कर्मवाच्य अर्थ, ‘रोका या बाधित किया जाना,’ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τῆς οἰκοδομῆς
  choice: निर्माण करने से
  rationale: κωλύω के बाद संबंधकारक उस कार्य को बताता है जिससे वे नहीं रोके गए; क्रियात्मक हिन्दी इस अर्थ को सहज रूप से व्यक्त करती है।
- source_word: μέχρις οὗ
  choice: तब तक ... जब तक
  rationale: यह समय-सीमा बताने वाले यूनानी पद का स्पष्ट और मुहावरेदार हिन्दी रूप है।
- source_word: ὑποσημανθῆναι
  choice: सूचना भेजी जाए
  rationale: क्रिया संकेत देने, सूचित करने या आधिकारिक रूप से रिपोर्ट भेजने का अर्थ रखती है; प्रशासनिक संदर्भ में ‘सूचना भेजी जाए’ स्वाभाविक है और अत्यधिक तकनीकी भी नहीं।
- source_word: Δαρείῳ
  choice: दारा को
  rationale: राजा Darius के नाम का प्रचलित हिन्दी बाइबलीय रूप ‘दारा’ रखा गया है।
- source_word: περὶ αὐτῶν
  choice: उनके विषय में
  rationale: यह निर्माण करने वालों अथवा उनसे संबंधित मामले की ओर संकेत करने वाला सीधा पूर्वसर्गीय पद है।
- source_word: προσφωνηθῆναι
  choice: उत्तर दिया जाए
  rationale: मूल क्रिया संबोधित किए जाने या बोले जाने को दर्शा सकती है; सूचना भेजने के बाद की प्रशासनिक प्रक्रिया में यह उत्तर दिए जाने का भाव देती है, पर इसकी व्यापकता पादटिप्पणी में सुरक्षित है।
