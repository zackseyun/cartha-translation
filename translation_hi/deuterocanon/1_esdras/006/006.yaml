base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
translation:
  language: hi
  text: और उन्हें निर्माण-कार्य से तब तक नहीं रोका गया, जब तक उनके विषय में दारा को सूचना भेजी जाए और उत्तर दिया जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और किसी को संबोधित किया जाए।” यूनानी क्रिया किसी को संबोधित करने या आधिकारिक उत्तर दिए जाने—दोनों का भाव दे सकती है; यहाँ संदर्भ दारा को भेजी गई सूचना के बाद दिए जाने वाले प्रशासनिक उत्तर का संकेत देता है।
    reason: lexical_alternative
