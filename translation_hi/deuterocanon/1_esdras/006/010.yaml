lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: हमने ... पूछा
  rationale: क्रिया का अर्थ जानकारी प्राप्त करने के लिए पूछना है। आधिकारिक जाँच का भाव प्रसंग से स्पष्ट है; आधुनिक हिन्दी में ‘पूछा’ स्वाभाविक है।
- source_word: τῶν πρεσβυτέρων τούτων
  choice: इन पुरनियों से
  rationale: πρεσβύτεροι केवल अधिक आयु वाले पुरुष नहीं, बल्कि समुदाय के मान्य अगुवे हैं। ‘पुरनिये’ इस संस्थागत भूमिका को बनाए रखता है।
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: तुम्हें ... की आज्ञा किसने दी
  rationale: यह निर्माण के पीछे अधिकार देने वाले व्यक्ति के विषय में पूछता है। यह हिन्दी में स्वाभाविक रहते हुए προστάξαντος का आज्ञात्मक बल सुरक्षित रखता है।
- source_word: οἰκοδομεῖτε
  choice: बनाने
  rationale: यूनानी में सामान्यतः ‘बनाना’ है; प्रसंगतः पुनर्निर्माण होने पर भी स्रोत में निहित न होने के कारण ‘फिर से बनाने’ नहीं जोड़ा गया।
- source_word: τὸν οἶκον τοῦτον
  choice: यह भवन
  rationale: οἶκος का मूल अर्थ ‘घर’ है, पर यहाँ यरूशलेम का मन्दिर अभिप्रेत है। ‘भवन’ हिन्दी में वस्तुगत अर्थ देता है और ‘मन्दिर’ को मुख्य पाठ में स्पष्ट करके स्रोत से अधिक विशिष्ट नहीं बनता।
