base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: hi
  text: इस कारण, जिस प्रभु का नाम वहाँ पुकारा गया है, वह हर उस राजा और राष्ट्र को नष्ट करे जो यरूशलेम में स्थित प्रभु के उस भवन के काम में बाधा डालने या उसे हानि पहुँचाने के लिए अपना हाथ बढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: इस कारण
  rationale: यह पद पिछले आदेश के आधार पर उसका परिणाम अथवा शापसूचक निष्कर्ष प्रस्तुत करता है; ‘इस कारण’ यूनानी के अनुमानात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ὁ κύριος
  choice: प्रभु भी
  rationale: ‘प्रभु’ इस्राएल के परमेश्वर के लिए κύριος का प्रतिष्ठित हिन्दी रूप है; ‘भी’ καί को बनाए रखता है, जो राजकीय दंड के साथ प्रभु के न्याय को जोड़ता है।
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: जिसका नाम वहाँ पुकारा गया है
  rationale: यह पूर्ण निष्क्रिय रूप उस स्थान पर परमेश्वर के नाम के पुकारे जाने और उसके साथ जुड़े होने—दोनों भावों की गुंजाइश रखता है। ‘पुकारा गया है’ आराधनात्मक संदर्भ को व्यक्त करता है, जबकि वैकल्पिक शाब्दिकता पादटिप्पणी में दी गई है।
- source_word: ἀφανίσαι
  choice: नष्ट करे
  rationale: संदर्भ में अनन्त क्रिया राजकीय आदेश के भीतर कामनार्थक अथवा शापसूचक बल रखती है। ‘नष्ट करे’ उस बल को बिना भविष्यवाणी बना दिए स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: हर उस राजा और राष्ट्र को
  rationale: ‘हर’ यूनानी के व्यापक वितरणात्मक अर्थ को रखता है, और ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक हिन्दी संबंध बनाता है।
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: जो ... अपना हाथ बढ़ाए
  rationale: ‘हाथ बढ़ाना’ विरोधी कार्रवाई आरम्भ करने का बाइबलीय मुहावरा है और यूनानी रूपक को हिन्दी में बनाए रखता है। ‘अपना’ मिश्रित antecedent के साथ कृत्रिम लिंग-असंगति से बचाता है।
- source_word: κωλῦσαι ἢ κακοποιῆσαι
  choice: बाधा डालने या उसे हानि पहुँचाने
  rationale: κωλύω के अवरोधक भाव और κακοποιέω के व्यापक हानिकारक भाव को अलग-अलग रखा गया है। ‘हानि’ को केवल भौतिक क्षति तक सीमित नहीं किया गया।
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में स्थित प्रभु के उस भवन
  rationale: ‘भवन’ मंदिर के लिए प्रयुक्त ‘प्रभु का भवन’ मुहावरे को सुरक्षित रखता है; ‘उस’ demonstrative बल और ‘यरूशलेम में स्थित’ स्थान-सूचना को स्पष्ट करता है।
theological_decisions:
- issue: मंदिर के संबंध में परमेश्वर के नाम का सूत्र
  choice: जिसका नाम वहाँ पुकारा गया है
  alternative: जिसका नाम वहाँ लिया जाता है
  rationale: यूनानी वाक्य परमेश्वर के नाम के वहाँ पुकारे जाने अथवा उस स्थान से जुड़े होने की बात करता है। चुना हुआ रूप आराधनात्मक आह्वान का भाव रखता है, पर यह अतिरिक्त धारणा नहीं जोड़ता कि परमेश्वर ने अपना नाम वहाँ ‘निवास कराया’।
- issue: ἀφανίσαι का विधि-बल
  choice: प्रभु ... नष्ट करे
  alternative: प्रभु ... नष्ट करेगा
  rationale: यहाँ अनन्त क्रिया शापसूचक कामना या आदेश के रूप में काम करती है। हिन्दी संभावनार्थक ‘नष्ट करे’ इस तनाव को रखता है; भविष्यकाल इसे अनावश्यक रूप से निश्चित भविष्यवाणी बना देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘प्रभु का भवन’ और ‘अपना हाथ बढ़ाए’ जैसे गरिमापूर्ण बाइबलीय मुहावरे बनाए गए हैं। वाक्य को स्पष्ट रखने के लिए नाम-संबंधी उपवाक्य को डैश के बीच रखा गया है।
