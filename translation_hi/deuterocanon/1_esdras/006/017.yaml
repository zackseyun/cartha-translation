base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: hi
  text: और सोने-चाँदी के वे पवित्र पात्र, जिन्हें नबूकदनेस्सर यरूशलेम में स्थित भवन से निकालकर अपने मंदिर में रख दिया था, राजा कुस्र ने फिर बाबुल के मंदिर से निकाल लिए, और वे जरुब्बाबेल और राज्यपाल सबानस्सर[a] को सौंप दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी नाम Σαβανασσάρ है; संभवतः यह एज्रा में प्रायः ‘शेशबस्सर’ लिखे जाने वाले नाम के अनुरूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: यह पद वस्तुओं के धार्मिक रूप से पवित्र ठहराए जाने का भाव रखता है; ‘पात्र’ मंदिर में प्रयुक्त वस्तुओं के लिए स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: सोने-चाँदी के वे
  rationale: दोनों विशेषण पीछे आए ‘पात्र’ की ओर संकेत करते हैं। हिन्दी में यह रूप स्वाभाविक रहते हुए सोने और चाँदी की दोनों श्रेणियाँ बनाए रखता है।
- source_word: ἐξήνεγκεν
  choice: निकालकर / निकलवाया
  rationale: क्रिया का मूल अर्थ बाहर ले जाना है। नबूकदनेस्सर के कार्य के लिए ‘निकालकर’ और राजा कुस्र के आदेशाधीन कार्य के लिए स्वाभाविक हिन्दी ‘निकलवाया’ प्रयुक्त है।
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: यरूशलेम के भवन
  rationale: οἶκος का शाब्दिक भेद ‘भवन’ से सुरक्षित रहता है, जबकि प्रसंग इसे पवित्र भवन के रूप में स्पष्ट करता है; बाद के ναός को ‘मंदिर’ कहा गया है।
- source_word: ἀπηρείσατο
  choice: रख गया था
  rationale: यह जानबूझकर वहाँ स्थापित या जमा करने का भाव सरल, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: अपने मंदिर में
  rationale: ναός के लिए ‘मंदिर’ स्वाभाविक है और αὐτοῦ का निजवाचक बल ‘अपने’ से व्यक्त होता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पहले किए गए स्थानांतरण के उलट दूसरे निष्कासन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: बाबुल के मंदिर में से
  rationale: Βαβυλωνία को इस कथात्मक संदर्भ में परिचित स्थान-नाम ‘बाबुल’ से प्रस्तुत किया गया है; ναός के लिए ‘मंदिर’ रखा गया है।
- source_word: παρεδόθη
  choice: सौंप दिए गए
  rationale: निष्क्रिय रूप और औपचारिक अभिरक्षा-हस्तांतरण दोनों का भाव स्पष्ट करता है।
- source_word: Ζοροβαβὲλ
  choice: जरुब्बाबेल
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है और सामी परंपरा से भी मेल खाता है।
- source_word: Σαβανασσάρῳ
  choice: सनाबस्सर
  rationale: मुख्य पाठ यूनानी नामरूप का हिन्दी लिप्यंतरण रखता है; एज्रा के परिचित ‘शेशबस्सर’ से संभावित साम्य पादटिप्पणी में दिया गया है।
- source_word: τῷ ἐπάρχῳ
  choice: राज्यपाल
  rationale: यह प्रशासकीय अधिकारी के पद को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: Κῦρος ὁ βασιλεὺς
  choice: राजा कुस्र
  rationale: Κῦρος के लिए हिन्दी बाइबल परंपरा में परिचित ‘कुस्र’ और पदवी के लिए ‘राजा’ रखा गया है।
theological_decisions:
- issue: यरूशलेम के पवित्र स्थान और बाबुल के मंदिर के लिए प्रयुक्त अलग यूनानी शब्द
  choice: οἶκος को ‘भवन’ और ναός को ‘मंदिर’ कहना
  alternative: दोनों को ‘मंदिर’ कहना
  rationale: यूनानी पाठ का शब्दगत भेद सुरक्षित रखा गया है, यद्यपि प्रसंग में यरूशलेम का भवन भी मंदिर ही है।
- issue: Σαβανασσάρ नाम का रूप
  choice: मुख्य पाठ में ‘सनाबस्सर’, पादटिप्पणी में ‘शेशबस्सर’
  alternative: मुख्य पाठ में ‘शेशबस्सर’
  rationale: 1 एस्द्रास के लिए यूनानी साक्ष्य प्राथमिक है; परिचित सामी नाम से संभावित पहचान को बिना निश्चित ठहराए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। ‘पवित्र पात्र’, ‘भवन’, ‘मंदिर’, ‘राज्यपाल’ और ‘सौंप दिए गए’ जैसे पद स्रोत की धार्मिक तथा प्रशासकीय भाषा को सामान्य पाठक के लिए स्पष्ट रखते हैं।
