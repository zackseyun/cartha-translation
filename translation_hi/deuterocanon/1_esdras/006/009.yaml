  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: hi
  text: बहुमूल्य तराशे हुए पत्थरों और भवनों में लगाई जाने वाली लकड़ी के साथ वे काम तत्परता से किए जा रहे हैं[a]। काम उनके हाथों में सफल हो रहा है, और वे हर प्रकार के वैभव और सावधानी के साथ संपन्न किए जा रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शीघ्रता से’; यूनानी पद ἐπὶ σπουδῆς में लगन और तत्परता के साथ-साथ शीघ्रता का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘वैभव’ से आशय संभवतः कारीगरी की भव्यता या शोभा है, केवल अमूर्त सम्मान नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: बहुमूल्य तराशे हुए पत्थरों
  rationale: ξυστός निर्माण के लिए काटे-तराशे या तैयार किए हुए पत्थर को सूचित करता है, जबकि πολυτελής उनकी महँगी और उत्कृष्ट गुणवत्ता बताता है। ‘बहुमूल्य तराशे हुए पत्थर’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: भवनों में लकड़ी लगाई जा रही है
  rationale: ξύλον यहाँ निर्माण में प्रयुक्त लकड़ी है और τιθεμένων लगाए या रखे जाने की प्रक्रिया बताता है। οἴκοις को प्रसंगानुसार घरेलू ‘घरों’ के बजाय व्यापक ‘भवनों’ से व्यक्त किया गया है।
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: वे निर्माण-कार्य तत्परता से किए जा रहे हैं
  rationale: ἔργα को निर्माण-संदर्भ में ‘निर्माण-कार्य’ कहना स्पष्ट है। σπουδή में लगन, तत्परता और शीघ्रता—तीनों की छाया हो सकती है; ‘तत्परता’ बिना असावधानी का अर्थ दिए ऊर्जापूर्ण गंभीरता व्यक्त करती है।
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: उनके हाथों में काम सफल हो रहा है
  rationale: εὐοδόω का अर्थ सफल होना या अच्छी तरह आगे बढ़ना है। ‘उनके हाथों में’ यूनानी की कर्तृत्व-सूचक मूर्त अभिव्यक्ति को सुरक्षित रखता है और हिन्दी में भी बोधगम्य है।
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: पूरे वैभव और सावधानी के साथ पूर्ण किए जा रहे हैं
  rationale: निर्माण के प्रसंग में δόξα केवल अमूर्त महिमा नहीं, बल्कि भव्यता या वैभव भी दर्शाती है; ἐπιμέλεια ध्यानपूर्वक देखभाल और सावधानी का भाव देता है। συντελέω को ‘पूर्ण किए जा रहे हैं’ से व्यक्त किया गया है।
