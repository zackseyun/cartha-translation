  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। यूनानी के क्रमिक कृदन्तों को हिन्दी के प्रगतिशील कर्मवाच्य रूपों में व्यक्त किया गया है, और एक अत्यधिक लंबा वाक्य बनने से बचाने के लिए अर्थ-प्रवाह को दो वाक्यों में बाँटा गया है।
