base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: hi
  text: और क्योंकि हमारे पुरखाओं ने उन्हें क्रोधित किया और इस्राएल के प्रभु, स्वर्गीय प्रभु[a], के विरुद्ध पाप किया, इसलिए उन्होंने उन्हें बाबुल के राजा, कसदियों के राजा नबूकदनेस्सर के हाथों में सौंप दिया;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के परमेश्वर।” यूनानी पाठ में शाब्दिक रूप से “स्वर्गीय” है, जबकि एज्रा से संबंधित परंपरा में प्रायः “स्वर्ग के परमेश्वर” की अधिक पूर्ण उपाधि मिलती है।
    reason: वैकल्पिक पाठार्थ और संबंधित परंपरा की उपाधि को दर्ज करना।
lexical_decisions:
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह निर्वासन के कारण का परिचय देता है; हिन्दी में कारणात्मक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पुरखाओं
  rationale: सामुदायिक और ऐतिहासिक वंश-स्मृति को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: παραπικράναντες
  choice: उन्हें क्रोधित किया
  rationale: यह कृदन्त परमेश्वर को विद्रोह द्वारा उकसाने या रुष्ट करने का भाव रखता है। हिन्दी में संयुक्त क्रिया-वाक्य मूल क्रिया के साथ इसका संबंध स्पष्ट रखता है।
- source_word: ἥμαρτον εἰς
  choice: के विरुद्ध पाप किया
  rationale: ἁμαρτάνω के साथ εἰς यहाँ अपराध के लक्ष्य को दिखाता है; ‘के विरुद्ध’ स्वाभाविक और अर्थसंगत है।
- source_word: τὸν κύριον τοῦ Ἰσραὴλ
  choice: इस्राएल के प्रभु
  rationale: यूनानी पाठ में ‘प्रभु’ है; संबंधित परंपरा से ‘परमेश्वर’ जोड़ने के बजाय स्रोत का रूप रखा गया है।
- source_word: τὸν οὐράνιον
  choice: जो स्वर्गीय हैं
  rationale: विशेषण यहाँ संज्ञा के समान, ‘इस्राएल के प्रभु’ के समानाधिकरण में प्रयुक्त है। यह अनुवाद यूनानी की संक्षिप्त उपाधि को रखता है और ‘स्वर्ग के परमेश्वर’ को मुख्य पाठ में आयात नहीं करता।
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: उन्होंने उन्हें ... के हाथों में सौंप दिया
  rationale: ‘हाथों में सौंपना’ किसी दूसरे की सत्ता में कर देने की स्पष्ट और परिचित बाइबलीय उक्ति है। प्रभु के लिए आदरसूचक बहुवचन हिन्दी के स्वाभाविक प्रयोग के अनुरूप है।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर
  rationale: बाबुल के इस राजा के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: बाबुल के राजा, कसदियों के राजा
  rationale: यूनानी में दोहराई गई दोनों राजकीय उपाधियाँ और उनका क्रम सुरक्षित रखा गया है।
theological_decisions:
- issue: τὸν οὐράνιον की दिव्य उपाधि
  choice: जो स्वर्गीय हैं
  alternative: स्वर्ग के परमेश्वर
  rationale: प्राथमिक यूनानी पाठ में ‘स्वर्गीय’ विशेषण संज्ञा के समान प्रयुक्त है, पूरा पद ‘स्वर्ग के परमेश्वर’ नहीं है। मुख्य पाठ यूनानी रूप को बनाए रखता है और संबंधित एज्रा-परंपरा के विस्तृत पद को पादटिप्पणी में देता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: दिव्य संदर्भ में ‘प्रभु’ सटीक, प्रतिष्ठित और सामान्य हिन्दी रूप है।
- issue: निर्वासन में परमेश्वर की कर्तृता
  choice: उन्होंने उन्हें ... सौंप दिया
  alternative: वे ... के हाथों में पड़ गए
  rationale: मूल पाठ निर्वासन को प्रभु की सक्रिय न्यायिक क्रिया बताता है; कर्मवाच्य विकल्प इस तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘पुरखाओं’, ‘प्रभु’ और ‘हाथों में सौंप दिया’ जैसे रूप सामान्य पाठक के लिए बोधगम्य हैं तथा बाइबलीय ऐतिहासिक स्वर भी बनाए रखते हैं। पादटिप्पणी-चिह्न उसी पद के बाद रखा गया है जिससे वह संबंधित है।
