base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: hi
  text: तब शालतीएल का पुत्र जरुब्बाबेल उठ खड़ा हुआ और योसेदेक के पुत्र येशू[a] के साथ मिलकर यरूशलेम में प्रभु का भवन बनाना शुरू किया। प्रभु के भविष्यद्वक्ता उनके साथ थे और उनकी सहायता कर रहे थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी नाम Ἰησοῦς वही रूप है जिसका अनुवाद दूसरे प्रसंगों में “यीशु” भी किया जाता है; यहाँ यह निर्वासनोत्तर महायाजक येशू का नाम है, यीशु नासरी का नहीं।
    reason: lexical_alternative
  - marker: b
    text: समानांतर सामी परम्परा में इस पुनर्निर्माण को प्रोत्साहित करने वाले भविष्यद्वक्ताओं के रूप में हाग्गै और जकर्याह का उल्लेख है; इस यूनानी पद में उन्हें केवल “प्रभु के भविष्यद्वक्ता” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह पिछले प्रसंग के बाद की घटना को जोड़ने वाला स्वाभाविक कथात्मक शब्द है।
- source_word: στάς
  choice: उठ खड़े हुए
  rationale: यह ἵστημι के कृदन्त का ठोस चित्र और कार्य आरम्भ करने का मुहावरेदार भाव—दोनों बनाए रखता है। यूनानी में यह एकवचन होकर पहले कर्ता से जुड़ा है, पर संयुक्त कर्ता के साथ स्वाभाविक हिन्दी में बहुवचन रखा गया है।
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: शालतीएल के पुत्र जरुब्बाबेल
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं; शालतीएल यूनानी Σαλαθιήλ के निकट है।
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: योसादेक के पुत्र येशू
  rationale: यह निर्वासनोत्तर महायाजक है। 'येशू' ऐतिहासिक व्यक्ति की पहचान स्पष्ट करता है और यीशु नासरी से अनावश्यक भ्रम घटाता है; 'योसादेक' यूनानी रूप के निकट है।
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: बनाने लगे
  rationale: यह आरम्भसूचक क्रिया और infinitive को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: प्रभु के भवन
  rationale: '''भवन'' स्रोत के ''घर/भवन'' रूपक को बनाए रखता है और इस प्रसंग में मंदिर का संकेत स्वाभाविक रूप से देता है, बिना मुख्य पाठ में अर्थ खोलकर ''मंदिर'' जोड़ने के।'
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थानसूचक विशेषण-पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου
  choice: प्रभु के भविष्यद्वक्ता उनके साथ थे
  rationale: Genitive absolute को सहवर्ती परिस्थिति के रूप में स्पष्ट, स्वाभाविक हिन्दी वाक्य बनाया गया है।
- source_word: βοηθούντων αὐτοῖς
  choice: उनकी सहायता कर रहे थे
  rationale: वर्तमान कृदन्त से व्यक्त जारी सहायता का भाव सुरक्षित है।
theological_decisions:
- issue: मंदिर-प्रसंग में κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: प्राथमिक यूनानी पाठ में κυρίου है; 'प्रभु' उसका सामान्य, गरिमापूर्ण हिन्दी रूप है और यहाँ मुख्य पाठ में इब्रानी परमेश्वर-नाम को पुनर्निर्मित करना आवश्यक नहीं।
- issue: यूनानी के सामान्य उल्लेख और समानांतर सामी पाठ के विशिष्ट भविष्यद्वक्ताओं के नाम
  choice: मुख्य पाठ में केवल 'प्रभु के भविष्यद्वक्ता' रखा गया
  alternative: हाग्गै और जकर्याह के नाम मुख्य पाठ में जोड़ना
  rationale: प्राथमिक यूनानी साक्ष्य भविष्यद्वक्ताओं को सामान्य रूप से बताता है। समानांतर परम्परा संदर्भ स्पष्ट करती है, पर उसके नाम यूनानी पद में जोड़ना पाठ-विस्तार होता।
- issue: Ἰησοῦς की ऐतिहासिक पहचान
  choice: येशू
  alternative: यीशु / यहोशू
  rationale: यहाँ अभिप्रेत व्यक्ति निर्वासनोत्तर महायाजक है, यीशु नासरी नहीं। 'येशू' पहचान और यूनानी/सामी नाम-परम्परा के बीच संतुलन रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। 'बनाने लगे' और 'सहायता कर रहे थे' सामान्य पाठक के लिए स्वाभाविक हैं; 'प्रभु का भवन' पारम्परिक धार्मिक मुहावरे और यूनानी οἶκος दोनों को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
