base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: hi
  text: ताकि परमप्रधान परमेश्वर को राजा और उसके पुत्रों[b] के लिए पेय-बलियाँ[a] चढ़ाई जाएँ और वे उनके लिए प्रार्थना करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अर्घ्य’। यूनानी शब्द का अर्थ ऐसी पेय-भेंटें है जो उँडेलकर चढ़ाई जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ ‘संतान’ या ‘बच्चे’ भी हो सकता है; राजकीय संदर्भ में यहाँ ‘पुत्रों’ लिया गया है।
    reason: lexical_ambiguity
  - marker: c
    text: यूनानी में अंतिम पदबंध में अपेक्षित संज्ञा व्यक्त नहीं की गई है; उसका शाब्दिक भाव ‘उनके विषय में/उनके लिए’ है। संदर्भ में इसका आशय उनके हित या कल्याण के लिए प्रार्थना करना हो सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य व्यक्त करने वाले यूनानी संयोजक का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: προσφέρωνται
  choice: चढ़ाए जाएँ
  rationale: मध्यम/कर्मवाच्य संभावनार्थक रूप को उद्देश्यवाचक वाक्य में कर्मवाच्य हिन्दी से व्यक्त किया गया है; बलिदानी संदर्भ में ‘चढ़ाना’ स्वाभाविक है।
- source_word: σπονδαὶ
  choice: अर्घ्य
  rationale: यह देवता को उँडेलकर चढ़ाई जाने वाली पेय-भेंट को दर्शाता है; सामान्य पाठक की सहायता के लिए ‘पेय-बलि’ को पादटिप्पणी में रखा गया है।
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: परमप्रधान परमेश्वर को
  rationale: θεός और उसकी उपाधि ὕψιστος दोनों को स्पष्ट रखते हुए प्रचलित, गरिमापूर्ण हिन्दी दी गई है।
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: राजा और उसके पुत्रों के लिए
  rationale: ὑπέρ यहाँ हितार्थ भाव देता है। राजवंशीय संदर्भ में παῖδες के लिए ‘पुत्र’ उपयुक्त है, जबकि ‘संतान/बच्चे’ की व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: προσεύχωνται
  choice: वे ... प्रार्थना करें
  rationale: समन्वित संभावनार्थक क्रिया को उद्देश्यवाचक हिन्दी में सीधे व्यक्त किया गया है।
- source_word: περὶ τῆς αὐτῶν
  choice: उनके लिए
  rationale: यूनानी पदबंध अपूर्ण/लुप्त संज्ञा वाला है। ‘उनके लिए’ संदर्भगत हितार्थ भाव देता है, पर ‘उनके कल्याण के लिए’ जैसी अतिरिक्त स्पष्टता मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ὁ ὕψιστος की ईश्वरीय उपाधि
  choice: परमप्रधान परमेश्वर
  alternative: परमप्रधान परमेश्वर को / परमेश्वर, जो परमप्रधान है
  rationale: यह इस्राएल के परमेश्वर की उपाधि को स्पष्ट रखता है और किसी बाद की सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: राजा और उसके पुत्रों के लिए बलि तथा प्रार्थना
  choice: हितार्थ ‘के लिए’
  alternative: ‘के विषय में’
  rationale: ὑπέρ स्पष्टतः हितार्थ है और अंतिम περί भी संदर्भ में प्रार्थना के लाभार्थियों की ओर संकेत करता है; फिर भी अंतिम यूनानी वाक्यांश की व्याकरणिक अपूर्णता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है। ‘अर्घ्य’ की धार्मिक-सांस्कृतिक संक्षिप्तता को पादटिप्पणी में साधारण भाषा से समझाया गया है। मुख्य पाठ ने अंतिम यूनानी पदबंध की अस्पष्टता को ‘कल्याण’ जोड़कर अनावश्यक रूप से निश्चित नहीं किया।
