base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: hi
  text: 'उस पत्र की प्रतिलिपि जिसे सीरिया और फीनीके के राज्यपाल सिसिन्नेस ने राजा दारा को लिखा था, और जिसे सथ्राबूज़ानेस तथा सीरिया और फीनीके के उसके सहकर्मी शासकों ने भेजा था[a]: अभिवादन!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में व्याकरणिक बदलाव है: ‘लिख रहा था’ एकवचन में है, जबकि ‘भेजा’ बहुवचन में। अनुवाद में नामित अधिकारियों की सामूहिक भूमिका को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: उस पत्र की प्रतिलिपि
  rationale: यह पदबंध किसी पत्र की नकल या आधिकारिक प्रतिलिपि को दर्शाता है; ‘प्रतिलिपि’ आधुनिक हिन्दी में स्पष्ट और दस्तावेज़ी प्रसंग के अनुकूल है।
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: जिसे ... ने ... लिखकर भेजा था
  rationale: यूनानी में क्रिया-वचन एकवचन से बहुवचन में बदलता है। मुख्य पाठ में सामूहिक कर्ता के अनुसार स्वाभाविक हिन्दी रखी गई है और व्याकरणिक बदलाव को पादटिप्पणी में बताया गया है।
- source_word: Σισίννης
  choice: सिसिन्नेस
  rationale: नाम का यूनानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: ὁ ἔπαρχος
  choice: राज्यपाल
  rationale: यह प्रादेशिक प्रशासन के अधिकारी को सूचित करता है; ‘राज्यपाल’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: Συρίας καὶ Φοινίκης
  choice: सीरिया और फीनीके
  rationale: क्षेत्रों के नाम यूनानी रूप के निकट और हिन्दी में सहज ढंग से दिए गए हैं।
- source_word: Σαθραβουζάνης
  choice: सथ्राबूज़ानेस
  rationale: व्यक्तिनाम का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: οἱ συνέταιροι
  choice: उनके सहयोगी
  rationale: राजकीय पत्र के प्रसंग में यह निजी मित्रों के बजाय साथ काम करने वाले अधिकारियों का बोध कराता है।
- source_word: ἡγεμόνες
  choice: शासक
  rationale: यह नेतृत्व या प्रशासनिक अधिकार रखने वालों के लिए व्यापक पद है; ‘राज्यपाल’ की अनावश्यक पुनरावृत्ति से भी बचता है।
- source_word: Βασιλεῖ Δαρείῳ
  choice: राजा दारा को
  rationale: सम्प्रदान कारक पत्र के प्राप्तकर्ता को दर्शाता है; ‘दारा’ हिन्दी बाइबलीय परंपरा में प्रचलित नाम है।
- source_word: χαίρειν
  choice: अभिवादन!
  rationale: यह पत्रारंभ में प्रयुक्त रूढ़ अभिवादन है; शाब्दिक ‘आनन्दित रहो’ की अपेक्षा प्रसंगानुकूल पत्र-शैली व्यक्त करता है।
