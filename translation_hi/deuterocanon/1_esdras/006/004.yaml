base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: hi
  text: “किसके आदेश पर[a] तुम इस भवन[b] का निर्माण कर रहे हो और इस छत तथा बाकी सभी कामों को पूरा कर रहे हो? और इन कामों को पूरा करनेवाले निर्माण-कारीगर कौन हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “किसके अधिकार से” भी हो सकता है। यूनानी शब्द उस आदेश या निर्देश पर बल दे सकता है जिसके आधार पर यह काम किया जा रहा था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से मन्दिर अभिप्रेत है; यूनानी पाठ में सामान्य शब्द “घर/भवन” आया है।
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: किसके आदेश पर
  rationale: सम्बन्धकारक प्रश्नवाचक Τίνος और συντάσσω के कृदन्त का संयुक्त अर्थ उस व्यक्ति के बारे में पूछना है जिसके निर्देश या आदेश के आधार पर काम हो रहा था। यह हिन्दी में प्रशासनिक पूछताछ का स्वाभाविक रूप है।
- source_word: οἰκοδομεῖτε
  choice: निर्माण कर रहे हो
  rationale: वर्तमान काल यहाँ चल रहे निर्माण-कार्य को दर्शाता है। यूनानी में पुनर्निर्माण का भाव स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: οἶκον
  choice: भवन
  rationale: यूनानी में सामान्य शब्द ‘घर/भवन’ है; सन्दर्भ में यह मन्दिर है। ‘भवन’ हिन्दी में स्वाभाविक है और ‘मन्दिर’ को सीधे मूल पाठ में जोड़ने से बचाता है।
- source_word: στέγην
  choice: छत
  rationale: यह भवन की छत या आवरण को दर्शाने वाला सीधा और स्वाभाविक हिन्दी पर्याय है।
- source_word: τἄλλα πάντα
  choice: बाकी सब काम
  rationale: यह निर्माण-परियोजना के शेष सभी कार्यों की ओर संकेत करता है; ‘काम’ जोड़ने से हिन्दी स्पष्ट और सहज बनती है।
- source_word: ἐπιτελεῖτε
  choice: पूरे कर रहे हो
  rationale: क्रिया किसी काम को पूरा करने या अन्त तक पहुँचाने का भाव देती है।
- source_word: οἰκοδόμοι
  choice: कारीगर
  rationale: यह निर्माण में लगे लोगों के लिए सामान्य शब्द है। ‘कारीगर’ किसी एक विशेष पेशे को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: τελοῦντες
  choice: काम करनेवाले
  rationale: यह उन लोगों को बताता है जो उक्त कार्यों को क्रियान्वित कर रहे हैं; सरल हिन्दी में यही भाव स्वाभाविक है।
