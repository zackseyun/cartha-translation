base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: hi
  text: और उसे आदेश दिया गया कि वह इन सभी पात्रों को वापस ले जाकर यरूशलेम के मंदिर में रखे[a], और प्रभु का मंदिर उसी स्थान पर बनाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सभी पात्रों को वापस पहुँचाए ... और प्रभु के मंदिर को उसके स्थान पर फिर से बनाए।” यूनानी वाक्य-विन्यास में आदेश और पुनर्स्थापना को थोड़ा भिन्न ढंग से समझने की गुंजाइश है।
    reason: यूनानी ἀπήνεγκεν तथा आदेशसूचक वाक्य-विन्यास के संबंध और अंतिम स्थानवाचक पदबंध की वास्तविक अनिश्चितता को दर्ज करना।
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: उसे आदेश दिया गया
  rationale: यूनानी कर्मवाच्य और आदेश पाने वाले व्यक्ति के लिए प्रयुक्त संप्रदान कारक—दोनों को बनाए रखता है, और आदेश देने वाले का नाम नहीं जोड़ता।
- source_word: ἀπήνεγκεν
  choice: वापस ले जाकर
  rationale: मंदिर के पात्रों की पुनर्स्थापना के प्रसंग में क्रिया की दिशात्मक और पुनरागमन-संबंधी भावना व्यक्त होती है। यूनानी वाक्य-विन्यास कुछ असामान्य है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: σκεύη
  choice: पात्रों
  rationale: मंदिर में उपयोग होने वाली वस्तुओं के लिए यह स्वाभाविक और परंपरागत हिन्दी शब्द है; यहाँ सामान्य घरेलू बर्तनों का अर्थ नहीं लिया गया।
- source_word: ἀποθεῖναι
  choice: रखे
  rationale: वस्तुओं को मंदिर में स्थापित या जमा करने का सीधा और सुबोध भाव देता है।
- source_word: ναός
  choice: मंदिर
  rationale: यरूशलेम के पवित्र भवन के लिए आधुनिक हिन्दी में सर्वाधिक स्पष्ट शब्द।
- source_word: κυρίου
  choice: प्रभु
  rationale: कुरियोस के लिए परियोजना-संगत, प्रतिष्ठित और सामान्य हिन्दी रूप।
- source_word: οἰκοδομηθῆναι
  choice: बनाया जाए
  rationale: यूनानी कर्मवाच्य निर्माण-क्रिया को सीधे रखता है। प्रसंग में पुनर्निर्माण निहित हो सकता है, पर क्रिया में 'फिर से' स्पष्ट रूप से नहीं है।
- source_word: ἐπὶ τοῦ τόπου
  choice: उसी स्थान पर
  rationale: मंदिर को उसके निर्धारित या मूल स्थल पर बनाने का स्थानवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मंदिर के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ पद इस्राएल के परमेश्वर के मंदिर की बात करता है। 'प्रभु' धार्मिक संदर्भ में स्पष्ट और प्रचलित है, जबकि 'स्वामी' अनावश्यक रूप से मानवीय स्वामित्व का संकेत दे सकता है।
- issue: οἰκοδομηθῆναι में निर्माण या पुनर्निर्माण
  choice: बनाया जाए
  alternative: फिर से बनाया जाए
  rationale: ऐतिहासिक प्रसंग पुनर्निर्माण का है, पर यूनानी क्रिया स्वयं केवल निर्माण व्यक्त करती है। मुख्य पाठ मूल की औपचारिक अनिश्चितता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'आदेश दिया गया' राजकीय आदेश का औपचारिक भाव बनाए रखता है। 'पात्र' मंदिर-संबंधी वस्तुओं के लिए संक्षिप्त और प्रतिष्ठित शब्द है।
