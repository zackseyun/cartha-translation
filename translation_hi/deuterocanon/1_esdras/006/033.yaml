  naturalness: The revised wording is natural, formal modern Hindi suitable to a royal decree. “ऐसा ... किया जाए” preserves the Greek impersonal construction without introducing an explicit object such as “सब कुछ.”
  terminology: “राजा दारा” is appropriate and conventional. “आदेश दिया है” accurately conveys a royal decree now in force. “इन बातों के अनुसार” appropriately retains the breadth of κατὰ ταῦτα; the footnote gives the contextual alternative without making it the main text.
  issues:
