    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट प्रथम-पुरुष सर्वनाम को राजकीय घोषणा के बलाघात सहित बनाए रखा गया है।
- source_word: βασιλεὺς Δαρεῖος
  choice: राजा दारा
  rationale: उपाधि और नाम को स्वाभाविक आधुनिक हिन्दी क्रम में रखा गया है।
- source_word: δεδογμάτικα
  choice: यह आदेश देता हूँ
  rationale: यह पाठ में प्राप्त रूप का औपचारिक राजकीय निर्णय का भाव व्यक्त करता है; हिन्दी में वर्तमान घोषणा-शैली उस आदेश के तत्काल और प्रभावी होने को स्वाभाविक ढंग से प्रकट करती है।
- source_word: ἐπιμελῶς
  choice: सावधानी से
  rationale: क्रियान्वयन में अपेक्षित ध्यान और सतर्कता को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: κατὰ ταῦτα
  choice: इन बातों के अनुसार
  rationale: यूनानी वाक्यांश की व्यापक और कुछ हद तक संदर्भ-निर्भर प्रकृति को बनाए रखता है; यह पूर्ववर्ती प्रावधानों की ओर संकेत करता है।
- source_word: γίνεσθαι
  choice: सब कुछ ... किया जाए
  rationale: प्रशासनिक संदर्भ में आज्ञापित कार्यों के संपन्न किए जाने का स्वाभाविक हिन्दी निष्क्रिय विधान है; ‘सब कुछ’ अन्तर्निहित समग्र क्रियान्वयन को स्पष्ट करता है।
