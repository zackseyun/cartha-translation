base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: hi
  text: और वह भवन[a] इस्राएल के एक महान और शक्तिशाली राजा के समय से पहले[b] बहुत वर्षों तक बनता रहा, और उसका निर्माण पूरा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भवन” से मन्दिर का अभिप्राय है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल के एक महान और शक्तिशाली राजा के द्वारा।” यूनानी वाक्यांश संक्षिप्त और अस्पष्ट है; उसका करणवाचक अर्थ भी लिया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: निर्माण ... होता रहा
  rationale: अपूर्ण भूतकाल और कर्मवाच्य रूप निर्माण की जारी प्रक्रिया को व्यक्त करता है; ‘होता रहा’ उसके पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ οἶκος
  choice: उस भवन
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है। प्रसंग में यह मन्दिर है, पर मूल रूपक को बनाए रखने और सामान्य हिन्दी में स्पष्टता के लिए ‘भवन’ चुना गया है।
- source_word: ἔμπροσθεν
  choice: के समय से पहले
  rationale: प्रेषित यूनानी में यह पद विन्यास की दृष्टि से कठिन है। यहाँ इसका सम्भावित कालवाचक अर्थ लिया गया है और राजा से सम्बन्ध स्पष्ट करने के लिए ‘के समय से पहले’ कहा गया है।
- source_word: ἐτῶν πλειόνων
  choice: बहुत वर्षों तक
  rationale: यह दीर्घ अवधि को व्यक्त करता है; ‘बहुत वर्षों तक’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: इस्राएल के एक महान और शक्तिशाली राजा के समय से पहले
  rationale: διά के कारण करणवाचक अर्थ सम्भव है, पर निकटवर्ती कालवाचक भाषा और ऐतिहासिक संकेत के आधार पर मुख्य पाठ में कालवाचक अर्थ रखा गया है। यूनानी की संक्षिप्तता और अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐπετέλεσθη
  choice: वह पूरा हुआ
  rationale: यह निष्पादन या पूर्णता बताने वाला कर्मवाच्य रूप है। ‘पूरा हुआ’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: ‘भवन’ का अभिप्राय
  choice: मुख्य पाठ में ‘भवन’, जिसका अभिप्राय मन्दिर है
  alternative: मन्दिर
  rationale: प्रसंग मन्दिर की ओर संकेत करता है, फिर भी οἶκος की शाब्दिक छवि को मुख्य पाठ में बनाए रखना स्रोत-पारदर्शिता के अनुकूल है।
- issue: इस्राएल के राजा वाले खण्ड का अर्थ
  choice: कालवाचक अर्थ—‘राजा के समय से पहले’
  alternative: करणवाचक अर्थ—‘राजा के द्वारा’
  rationale: यूनानी वाक्य-विन्यास संकुचित और कठिन है। कालवाचक अर्थ ἔμπροσθεν तथा सम्भावित ऐतिहासिक संकेत के साथ अधिक संगत प्रतीत होता है, पर करणवाचक अर्थ व्याकरणतः सम्भव होने के कारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रूप रखा गया है। ‘भवन’ बाइबलीय ‘घर’ की धारणा को अत्यधिक बोलचाल का बनाए बिना सुरक्षित रखता है। कठिन यूनानी संरचना को मुख्य पाठ में सम्भावित कालवाचक अर्थ के साथ स्पष्ट किया गया है और वैकल्पिक करणवाचक अर्थ पादटिप्पणी में दिया गया है।
