base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: hi
  text: और कोएले-सीरिया[c] और फ़ोनीकिया के कर-राजस्व में से इन पुरुषों को प्रभु के लिए बलि चढ़ाने हेतु पूरी सावधानी से आवंटन दिया जाए[a], राज्यपाल जरुब्बाबेल को[b], बैलों, मेढ़ों और मेमनों के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भत्ता दिया जाए’ अथवा ‘प्रावधान किया जाए।’ यूनानी पद σύνταξιν δίδοσθαι प्रांतीय राजस्व से दिए जाने वाले आधिकारिक आवंटन या सहायता को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘राज्यपाल जरुब्बाबेल को’ का वाक्यगत संबंध संक्षिप्त है। इससे जरुब्बाबेल इस आवंटन का प्राप्तकर्ता या प्रशासक समझा जा सकता है, अथवा यह राजाज्ञा में समानाधिकरणात्मक पहचान हो सकती है।
    reason: alternative_reading
  - marker: c
    text: ‘कोएले-सीरिया’ उस प्रदेश का प्रचलित यूनानी नाम है; इसका शाब्दिक अर्थ ‘खोखला सीरिया’ है।
    reason: cultural_note
lexical_decisions:
- source_word: φορολογίας
  choice: कर-राजस्व
  rationale: यह शब्द यहाँ प्रांतीय करों से प्राप्त सरकारी आय को सूचित करता है। ‘कर-राजस्व’ आधुनिक हिन्दी में धन के स्रोत को ‘कर’ या ‘नज़राना’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: κοίλης Συρίας
  choice: खोले-सूरिया
  rationale: यह यूनानी-हेलेनिस्टिक काल का स्थापित भौगोलिक नाम है; इसलिए इसके शाब्दिक अर्थ ‘खोखला सीरिया’ के बजाय नाम का लिप्यंतरण रखा गया है।
- source_word: ἐπιμελῶς
  choice: सावधानीपूर्वक
  rationale: यह प्रबंध को पूरी देखरेख और तत्परता से किए जाने पर बल देता है।
- source_word: σύνταξιν δίδοσθαι
  choice: प्रबंध-राशि दी जाए
  rationale: σύνταξις यहाँ राजस्व से दी जाने वाली आधिकारिक धनराशि या व्यवस्था है। ‘प्रबंध-राशि’ आर्थिक आशय को स्पष्ट रखती है, जबकि पादटिप्पणी व्यापक विकल्पों को दर्ज करती है।
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: इन पुरुषों को
  rationale: यूनानी पद पुल्लिंग बहुवचन है और प्रसंग में विशिष्ट पुरुष अधिकारियों अथवा मन्दिर से जुड़े पुरुषों की ओर संकेत करता है।
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: प्रभु के लिए बलि चढ़ाने हेतु
  rationale: εἰς उद्देश्य व्यक्त करता है; हिन्दी में यह वाक्यांश धनराशि के बलिदानी उपयोग को स्वाभाविक रूप से बताता है।
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: राज्यपाल जरुब्बाबेल को
  rationale: मूल का संक्षिप्त दत्तिव संबंध ज्यों का त्यों खुला रखा गया है; इससे जरुब्बाबेल धन पाने वाला या उसके प्रशासन से जुड़ा अधिकारी, दोनों समझा जा सकता है।
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: बैलों, मेढ़ों और मेमनों
  rationale: तीनों बलि-पशुओं को अलग-अलग और उसी क्रम में रखा गया है; ‘मेमने’ बलिदानी प्रसंग में ἄρνας का उपयुक्त अर्थ है।
theological_decisions:
- issue: बलिदानी यहूदी प्रसंग में κυρίῳ का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रत्यक्ष यूनानी पाठ κυρίῳ पढ़ता है। ‘प्रभु’ उसी शब्द का निकट अनुवाद है और यूनानी पाठ से परे जाकर किसी अनुमानित इब्रानी दिव्य नाम को स्थापित नहीं करता।
- issue: τούτοις τοῖς ἀνθρώποις में लिंग का निरूपण
  choice: इन पुरुषों को
  alternative: इन लोगों को
  rationale: मूल पद व्याकरणतः पुल्लिंग बहुवचन है और प्रसंग में पुरुष अधिकारियों या मन्दिर-कर्मियों का संकेत संभव है; अतः लिंग को सामान्य सामूहिक रूप में समतल नहीं किया गया।
- issue: Ζοροβάβελ ἐπάρχῳ का वाक्यगत संबंध
  choice: अल्पविरामों के बीच ‘राज्यपाल जरुब्बाबेल को’
  alternative: राज्यपाल जरुब्बाबेल के माध्यम से
  rationale: यूनानी रचना संक्षिप्त और अस्पष्ट है। मुख्य पाठ में कोई अतिरिक्त संबंधसूचक पद जोड़कर यह तय नहीं किया गया कि जरुब्बाबेल प्राप्तकर्ता, प्रशासक या समानाधिकरणात्मक पहचान है।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और राजाज्ञा-सदृश रखी गई है। ‘दी जाए’ आदेशात्मक प्रसंग के अनुकूल है। मूल यूनानी की संक्षिप्त वाक्य-रचना और जरुब्बाबेल से जुड़े संबंध की अस्पष्टता को अल्पविरामों तथा पादटिप्पणी द्वारा सुरक्षित रखा गया है; ‘खरीदने के लिए’ जैसा कोई ऐसा भाव नहीं जोड़ा गया जो मूल में स्पष्ट नहीं है।
