  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: hi
  text: और यहूदियों के पुरनियों ने प्रभु से अनुग्रह पाया; वे बंधुआई की देखरेख का दायित्व सँभालने लगे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बंधुआ लोगों पर देखरेख के लिए नियुक्त किए गए थे।” यूनानी वाक्यांश संक्षिप्त है और लौटे हुए समुदाय के संबंध में पुरनियों द्वारा देखरेख का दायित्व सँभालने का वर्णन कर सकता है।
    reason: वैकल्पिक पाठ और संक्षिप्त यूनानी वाक्यरचना की अस्पष्टता
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: अनुग्रह पाया
  rationale: यह यूनानी मुहावरा किसी की कृपापूर्ण स्वीकृति या सहायता पाने को व्यक्त करता है। ‘अनुग्रह पाया’ कथात्मक संदर्भ में स्वाभाविक है और χάρις को अमूर्त सिद्धान्त तक सीमित नहीं करता।
- source_word: ἐπισκοπῆς
  choice: देखरेख
  rationale: ἐπισκοπή यहाँ निरीक्षण, देखरेख या पर्यवेक्षण का भाव रख सकता है। ‘देखरेख’ प्रशासनिक जिम्मेदारी को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: वे बंधुआई की देखरेख करने आए थे
  rationale: यूनानी वाक्यांश अत्यंत संक्षिप्त है और किसी भूमिका में आने अथवा किसी समुदाय पर नियुक्त होने—दोनों का संकेत दे सकता है। मुख्य पाठ स्रोत की गति और प्रयोजन वाली सम्भावना रखता है; नियुक्ति वाली सम्भावना पादटिप्पणी में दी गई है।
- source_word: παρὰ τοῦ κυρίου
  choice: प्रभु से
  rationale: संबंधकारक के साथ παρά स्रोत बताता है; इसलिए यह अनुग्रह प्रभु से प्राप्त हुआ।
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: यहूदियों के पुरनियों
  rationale: πρεσβύτεροι समुदाय के मान्य वरिष्ठ जनों या अगुवों को दर्शाता है। ‘पुरनिए’ हिन्दी बाइबलीय प्रयोग में इस पद की सामुदायिक भूमिका को सुरक्षित रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में κύριος है। ‘प्रभु’ उसी को सीधे व्यक्त करता है और समानांतर सामी पाठ के आधार पर किसी विशिष्ट दिव्य नाम को मुख्य पाठ में आयात नहीं करता।
- issue: αἰχμαλωσία का आशय
  choice: बंधुआई
  alternative: बंधुआ लोग
  rationale: संज्ञा का मूल अर्थ बंधुआई या निर्वासन है। मुख्य पाठ अमूर्त संज्ञा को बनाए रखता है ताकि कठिन यूनानी वाक्य का तनाव न मिटे; व्यक्तियों के अर्थ की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- issue: γενόμενοι ἐπὶ की भूमिका-संबंधी अस्पष्टता
  choice: देखरेख करने आए थे
  alternative: बंधुआ लोगों पर देखरेख के लिए नियुक्त किए गए थे
  rationale: रचना किसी स्थिति या दायित्व में आने का बोध करा सकती है, पर यह स्पष्ट नहीं करती कि औपचारिक नियुक्ति हुई थी। इसलिए मुख्य पाठ कम निर्णायक है और वैकल्पिक समझ पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पुरनिए’ पद समुदाय के मान्य वरिष्ठ अगुवों के लिए प्रचलित बाइबलीय हिन्दी शब्द है; ‘बंधुआई’ स्रोत की अमूर्त संज्ञा और उसकी वास्तविक अस्पष्टता को बनाए रखता है।
