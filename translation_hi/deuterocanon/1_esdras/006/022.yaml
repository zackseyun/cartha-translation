  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: hi
  text: तब राजा दारा ने बाबुल में रखे अभिलेखागारों में खोज करने की आज्ञा दी। फिर मादै देश में स्थित दुर्ग एकबतना में एक स्थान मिला, जहाँ ये बातें अभिलिखित थीं:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शाब्दिक अर्थ है, “एक स्थान मिला, जहाँ ये बातें अभिलिखित थीं।” संभवतः यह अभिलेखागार के भीतर उस स्थान या अभिलेख-विभाग का संकेत है जहाँ आगे दिया गया स्मरण-पत्र दर्ज था।
    reason: textual_ambiguity
lexical_decisions:
- source_word: προσέταξεν
  choice: आज्ञा दी
  rationale: यह राजकीय अधिकार से दिए गए निर्देश को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπισκέψασθαι
  choice: खोज करने
  rationale: संदर्भ किसी दस्तावेज़ की आधिकारिक जाँच और तलाश का है; इसलिए केवल ‘निरीक्षण’ की अपेक्षा ‘खोज’ अधिक स्पष्ट है।
- source_word: βιβλιοφυλακίοις
  choice: राजकीय अभिलेखागारों
  rationale: यह सामान्य पुस्तकालय नहीं, सरकारी अभिलेखों के भंडार को सूचित करता है; ‘राजकीय’ संदर्भ को स्पष्ट करता है।
- source_word: τοῖς κειμένοις
  choice: रखे
  rationale: बाबुल में सुरक्षित या संग्रहित अभिलेखागारों के लिए यह सहज आधुनिक हिन्दी है।
- source_word: Ἐκβατάνοις
  choice: एकबतना
  rationale: यूनानी स्थान-नाम का हिन्दी में सुबोध लिप्यंतरण।
- source_word: τῇ βάρει
  choice: दुर्ग
  rationale: शब्द एक किलेबंद प्रशासनिक केंद्र या गढ़ का बोध देता है; ‘दुर्ग’ संक्षिप्त और सामान्यतः समझ में आने वाला है।
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: मादै देश में
  rationale: χώρα के भौगोलिक अर्थ को बिना उसे निश्चित रूप से प्रशासनिक ‘प्रांत’ बनाए व्यक्त करता है।
- source_word: τόπος
  choice: एक ऐसा स्थान
  rationale: यूनानी पाठ के वास्तविक और कुछ असामान्य शब्द ‘स्थान’ को सुरक्षित रखा गया है; इसे अनुमान के आधार पर ‘पुस्तक’ या ‘पत्र’ नहीं बनाया गया।
- source_word: ὑπομνημάτιστο
  choice: अभिलिखित थीं
  rationale: यह आधिकारिक स्मरण-पत्र या अभिलेख में दर्ज किए जाने का दस्तावेज़ी भाव व्यक्त करता है।
- source_word: τάδε
  choice: ये बातें
  rationale: यह आगे आने वाली अभिलेख-सामग्री का संकेत देता है और यूनानी बहुवचन का स्वाभाविक हिन्दी रूप है।
