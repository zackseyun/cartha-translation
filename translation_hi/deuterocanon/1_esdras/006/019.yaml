base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: hi
  text: तब सनाबस्सार ने आकर यरूशलेम में स्थित प्रभु के भवन की नींव डाली[a]; और उस समय से अब तक उसका निर्माण होता आ रहा है, पर वह पूरा नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सनाबस्सार की पहचान सामान्यतः एज्रा-परंपरा के शेशबस्सर से की जाती है।
    reason: यूनानी नामरूप और एज्रा-परंपरा में प्रचलित नामरूप के संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: सनाबस्सार
  rationale: यूनानी पाठ के नामरूप का देवनागरी लिप्यंतरण किया गया है; एज्रा-परंपरा का शेशबस्सर नाम पादटिप्पणी में रखा गया है।
- source_word: παραγενόμενος
  choice: ने आकर
  rationale: यह कृदंत मुख्य कार्य से पहले सनाबस्सार के आगमन को बताता है; ‘ने आकर’ स्वाभाविक हिन्दी में वही क्रम व्यक्त करता है।
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: नींव डाली
  rationale: निर्माण-संदर्भ में यह स्वाभाविक हिन्दी मुहावरा है और यूनानी अभिव्यक्ति का आशय स्पष्ट रखता है।
- source_word: τοῦ οἴκου Κυρίου
  choice: प्रभु के भवन की
  rationale: ‘भवन’ यूनानी οἶκος के बाइबलीय रूपक को बनाए रखता है; ‘मन्दिर’ संदर्भानुकूल होता, पर स्रोत से कुछ अधिक व्याख्यात्मक है।
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: यरूशलेम में स्थित
  rationale: यह विशेषणात्मक वाक्यांश भवन का स्थान स्पष्ट करता है और हिन्दी में सहज है।
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: उस समय से अब तक
  rationale: यह समय की निरंतरता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἰκοδομουμένου
  choice: उसका निर्माण होता आ रहा है
  rationale: मध्य/कर्मवाच्य कृदंत की जारी निर्माण-प्रक्रिया और वर्तमान तक की अवधि दोनों व्यक्त होती हैं।
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: वह पूरा नहीं हुआ
  rationale: शाब्दिक ‘पूर्णता प्राप्त नहीं की’ की अपेक्षा यह वर्तमान हिन्दी में स्वाभाविक है और अपूर्ण परिणाम को यथावत रखता है।
theological_decisions:
- issue: मन्दिर-संदर्भ में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मुख्य आधार यूनानी पाठ है, जिसमें Κυρίου है। इसलिए किसी अनुमानित सेमिटिक दिव्य नाम को मुख्य पाठ में आयात किए बिना ‘प्रभु’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘प्रभु का भवन’ बाइबलीय पदबंध को बनाए रखता है, और वाक्य का अंतिम भाग जारी निर्माण तथा अब तक की अपूर्णता दोनों स्पष्ट करता है।
