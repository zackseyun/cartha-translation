base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: hi
  text: उसने सीरिया और फोनीकिया के राज्यपाल सिसिन्नेस, सथ्रबुज़ानेस और उनके सहयोगियों तथा सीरिया और फोनीकिया में नियुक्त शासकों को यह आदेश भी दिया कि वे उस स्थान से दूर रहें और प्रभु के सेवक, यहूदिया के राज्यपाल जरुब्बाबेल और यहूदी पुरनियों को न रोकें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें रहने दें” या “उन्हें आगे काम करने दें।” यहाँ आशय सरकारी अधिकारियों द्वारा हस्तक्षेप न करने से है।
    reason: ἐᾶσαι के ‘अनुमति देना/रहने देना’ और प्रसंगगत ‘न रोकना’ के बीच की अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: यह आदेश भी दिया
  rationale: दोनों यूनानी क्रियाओं को शब्दशः दोहराने के बजाय प्रशासनिक निर्देश की प्रबलता को स्वाभाविक हिन्दी में व्यक्त किया गया है। δέ के प्रसंग-संयोजक भाव को ‘भी’ से दर्शाया गया है।
- source_word: ἐπάρχῳ
  choice: राज्यपाल
  rationale: यह प्रांतीय प्रशासन के अधिकारी को सूचित करता है; ‘राज्यपाल’ आधुनिक हिन्दी में स्पष्ट और सम्मानपूर्ण है।
- source_word: συνεταίροις
  choice: सहयोगियों
  rationale: प्रशासनिक प्रसंग में यह निजी मित्रों के बजाय साथ काम करने वाले व्यक्तियों को सूचित करता है।
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: नियुक्त शासकों
  rationale: इससे नियुक्त किए जाने का कृदन्तीय भाव और अधिकार रखने वाले पदाधिकारियों का अर्थ, दोनों बने रहते हैं।
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: उस स्थान से दूर रहें
  rationale: यह यूनानी के स्थान-संबंधी शब्दों को सीधे बनाए रखता है और प्रसंग में हस्तक्षेप न करने का भाव भी देता है।
- source_word: ἐᾶσαι
  choice: न रोकें
  rationale: ἐάω का अर्थ ‘रहने देना/अनुमति देना’ है। पहले अधिकारियों को दूर रहने की आज्ञा के बाद ‘न रोकें’ आधिकारिक अहस्तक्षेप का स्वाभाविक हिन्दी रूप है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: παῖδα Κυρίου
  choice: प्रभु के सेवक
  rationale: παῖς के ‘बालक’ और ‘सेवक’ दोनों अर्थ हो सकते हैं, पर यहाँ जरुब्बाबेल के लिए सम्मानसूचक और शास्त्रीय प्रसंग में ‘सेवक’ उपयुक्त है।
- source_word: ὕπαρχον
  choice: राज्यपाल
  rationale: यह किसी क्षेत्र पर अधिकार रखने वाले प्रशासक को सूचित करता है; पद का कृत्रिम भेद बनाए बिना ‘राज्यपाल’ प्रसंगानुकूल है।
- source_word: πρεσβυτέρους
  choice: पुरनियों
  rationale: यह केवल अधिक आयु वाले पुरुषों के बजाय यहूदी समुदाय के मान्य वरिष्ठ नेतृत्व को सूचित करने वाला प्रचलित बाइबलीय पद है।
theological_decisions:
- issue: παῖδα Κυρίου में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह यहूदी शास्त्रीय प्रसंग में श्रद्धापूर्ण उपाधि है; ‘प्रभु’ उसके धार्मिक भार को बनाए रखता है।
- issue: जरुब्बाबेल के लिए παῖς का अर्थ
  choice: सेवक
  alternative: बालक
  rationale: यहाँ संबंध जैविक आयु या पुत्रत्व का नहीं, सम्मान और सेवा का है; फिर भी इससे पाठ से परे कोई विशेष मसीही दावा नहीं जोड़ा गया है।
- issue: ἐᾶσαι में अनुमति और अहस्तक्षेप का संबंध
  choice: न रोकें
  alternative: रहने दें / आगे बढ़ने दें
  rationale: प्रसंग अधिकारियों को निर्माण-स्थल से दूर रहने का आदेश देता है, इसलिए मुख्य पाठ में अहस्तक्षेप स्पष्ट किया गया है; यूनानी की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। प्रशासनिक पदों के लिए ‘राज्यपाल’ और ‘शासक’ रखे गए हैं। ‘पुरनियों’ बाइबलीय सामुदायिक नेतृत्व का परिचित पद है, जबकि वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
