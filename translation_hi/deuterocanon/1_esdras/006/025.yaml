base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: hi
  text: और प्रभु के भवन के पवित्र पात्र[a]—सोने और चाँदी के दोनों प्रकार के—जिन्हें नबूकदनेस्सर यरूशलेम में स्थित भवन से निकालकर बाबेल ले गया था, यरूशलेम में स्थित उस भवन[b] में लौटा दिए जाएँ, जहाँ वे रखे हुए थे, ताकि उन्हें वहीं रखा जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र वस्तुएँ।’ यूनानी पद मंदिर में पवित्र उपयोग के लिए समर्पित पात्रों और उपकरणों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भवन’ से आशय मंदिर है।
    reason: contextual_clarification
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: ‘पात्र’ मंदिर में पवित्र उपयोग के लिए समर्पित बर्तनों और उपकरणों का स्वाभाविक बाइबलीय शब्द है; ‘पवित्र’ ἱερά का धार्मिक आशय बनाए रखता है।
- source_word: οἴκου Κυρίου
  choice: प्रभु का भवन
  rationale: ‘भवन’ οἶκος के शाब्दिक रूप और मंदिर-संबंधी अर्थ, दोनों को बनाए रखता है; Κυρίου के लिए ‘प्रभु’ यूनानी स्रोत के अनुरूप है।
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: सोने और चाँदी, दोनों के
  rationale: ये विशेषण पहले आए ‘पात्र’ की ओर संकेत करते हैं; हिंदी में यह रूप अनावश्यक पुनरावृत्ति के बिना दोनों प्रकार स्पष्ट करता है।
- source_word: ἐξήνεγκεν … ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: निकालकर बाबेल ले गया था
  rationale: यह अनुवाद भवन से बाहर निकालने और फिर बाबेल पहुँचाने, दोनों दिशात्मक क्रियाओं को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀποκατασταθῆναι
  choice: लौटा दिए जाएँ
  rationale: सामग्री को उसके पहले और उचित स्थान पर पुनः पहुँचाने का भाव स्पष्ट करता है; आज्ञापत्र के प्रसंग में कर्मवाच्य रूप उपयुक्त है।
- source_word: οὗ ἦν κείμενα
  choice: जहाँ वे रखे हुए थे
  rationale: κείμενα का मूल भाव ‘रखे/स्थित हुए’ है; अपूर्ण भूतकाल की स्थिति को ‘रखे हुए थे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: ताकि उन्हें वहीं रखा जाए
  rationale: उद्देश्यवाचक उपवाक्य को स्पष्ट रखता है। यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ एकवचन क्रिया संभव है; हिंदी में बहुवचन प्रयोग संदर्भानुकूल और व्याकरणसंगत है।
- source_word: Ναβουχοδονοσόρ
  choice: नबूकदनेस्सर
  rationale: यह आधुनिक हिंदी बाइबलों में व्यापक रूप से पहचाना जाने वाला नामरूप है और उसी ऐतिहासिक व्यक्ति को स्पष्ट करता है।
- source_word: Βαβυλῶνα
  choice: बाबेल
  rationale: यह नगर के लिए प्रचलित हिंदी बाइबलीय नाम है और यूनानी Βαβυλών के संदर्भ को स्पष्ट रखता है।
theological_decisions:
- issue: मंदिर-संबंधी वाक्यांश में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: मूल यूनानी पाठ में Κυρίου है। ‘प्रभु’ स्रोत की शब्दावली और गरिमामय बाइबलीय शैली को बनाए रखता है, जबकि पाठ में न दिए गए विशिष्ट इब्रानी नाम को आयात नहीं करता।
- issue: οἶκος को अर्थ खोलकर ‘मंदिर’ कहना या रूपक बनाए रखना
  choice: भवन
  alternative: मंदिर
  rationale: ‘भवन’ मूल के ‘घर/भवन’ रूपक को सुरक्षित रखता है; पादटिप्पणी प्रसंगगत अर्थ ‘मंदिर’ स्पष्ट करती है, इसलिए मुख्य पाठ अनावश्यक रूप से अर्थ का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज वाक्य-विन्यास रखा गया है। ‘प्रभु का भवन’ मूल के धार्मिक रूपक को सुरक्षित रखता है, और लंबे यूनानी वाक्य को डैश तथा स्पष्ट उपवाक्यों से पठनीय बनाया गया है।
