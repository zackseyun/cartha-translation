base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: hi
  text: 'हमारे स्वामी राजा को सब कुछ ज्ञात हो: जब हम यहूदिया देश और यरूशलेम नगर में पहुँचे, तो हमने यरूशलेम नगर में बंधुआई के यहूदियों के पुरनियों[a] को प्रभु के लिए एक बड़ा, नया भवन[b] बनाते पाया,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: ‘बंधुआई के यहूदियों के पुरनियों।’ यूनानी पदबंध संक्षिप्त है; आशय बंधुआई से संबद्ध यहूदी समुदाय के अगुओं से है।'
    reason: lexical_alternative
  - marker: b
    text: ‘प्रभु के लिए भवन’ से आशय मंदिर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: सब कुछ ज्ञात हो
  rationale: यह पत्र या राजकीय प्रतिवेदन में प्रयुक्त सूचना-सूत्र है। यह ἔστω की आज्ञार्थक शक्ति और πάντα की व्यापकता, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: हमारे स्वामी राजा को
  rationale: यहाँ κύριος फारसी राजा के लिए आदरसूचक दरबारी उपाधि है, ईश्वर का संबोधन नहीं। ‘स्वामी’ दोनों संज्ञाओं को बनाए रखते हुए हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: παραγενόμενοι
  choice: जब हम ... पहुँचे
  rationale: संदर्भ में कृदन्त कालवाचक है और प्रतिवेदन की परिस्थिति बताता है।
- source_word: χώραν τῆς Ἰουδαίας
  choice: यहूदिया देश
  rationale: χώρα का अर्थ देश, भूभाग या क्षेत्र हो सकता है। ‘देश’ प्रशासनिक अर्थ को अनावश्यक रूप से निश्चित किए बिना व्यापक भौगोलिक भाव देता है।
- source_word: Ἰερουσαλὴμ τὴν πόλιν
  choice: यरूशलेम नगर
  rationale: यूनानी के समानाधिकरण को सहज हिन्दी में संक्षिप्त रूप से व्यक्त करता है।
- source_word: κατελάβομεν
  choice: हमने ... पाया
  rationale: यहाँ क्रिया का अर्थ किसी काम में लगे लोगों को पाना या उनसे सामना होना है, उन्हें पकड़ना नहीं।
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: यहूदी बंधुआई-समुदाय के पुरनियों
  rationale: यूनानी पदबंध संक्षिप्त और कुछ असहज है। यह अनुवाद बंधुआई से संबद्ध यहूदी समुदाय के अगुओं का भाव देता है, पर ‘लौटे हुए’ जैसी बात स्पष्ट रूप से नहीं जोड़ता।
- source_word: οἰκοδομοῦντας οἶκον
  choice: भवन बनाते
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है। ‘भवन’ धार्मिक संदर्भ में स्वाभाविक है और ‘मंदिर’ को मुख्य पाठ में स्पष्ट करके मूल से अधिक नहीं कहता।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: यहाँ κύριος इस्राएल के परमेश्वर के लिए है। ‘प्रभु’ हिन्दी में प्रचलित और गरिमापूर्ण दैवी संबोधन है।
- source_word: μέγαν καινόν
  choice: एक बड़ा, नया
  rationale: दोनों विशेषणों को सीधे बनाए रखा गया है; ‘भव्य’ कहना μέγαν की व्याख्या को बढ़ा देता।
theological_decisions:
- issue: एक ही पद में κύριος का राजा और इस्राएल के परमेश्वर—दोनों के लिए प्रयोग
  choice: राजा के लिए ‘स्वामी’ और परमेश्वर के लिए ‘प्रभु’
  alternative: दोनों स्थानों पर ‘प्रभु’ रखना
  rationale: यूनानी में शब्द एक ही है, पर हिन्दी में एक ही रूप रखने से राजा और परमेश्वर के बीच अनावश्यक भ्रम हो सकता है। संदर्भानुकूल दो सम्मानसूचक शब्द अर्थ और भेद दोनों सुरक्षित रखते हैं।
- issue: οἶκος को ‘भवन’ या ‘मंदिर’ कहना
  choice: मुख्य पाठ में ‘भवन’, पादटिप्पणी में मंदिर का संदर्भ स्पष्ट करना
  alternative: मुख्य पाठ में सीधे ‘मंदिर’
  rationale: मूल यूनानी ‘घर/भवन’ कहता है, यद्यपि संदर्भ निस्संदेह मंदिर का है। इस प्रकार मूल रूपक और संदर्भगत अर्थ दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में राजकीय प्रतिवेदन का विनम्र, गरिमापूर्ण स्वर रखा गया है। ‘पुरनियों’ बाइबलीय सामुदायिक पद को व्यक्त करता है; कठिन यूनानी संबंध को पादटिप्पणी में अधिक शाब्दिक रूप सहित सुरक्षित रखा गया है। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न [a] और [b] अपने संबंधित पदबंधों के तुरंत बाद दिए गए हैं।
