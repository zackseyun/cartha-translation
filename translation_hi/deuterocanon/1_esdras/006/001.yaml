base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: hi
  text: दारयवेश के शासन के दूसरे वर्ष में, भविष्यद्वक्ताओं हाग्गै और इद्दो के पुत्र जकर्याह[c] ने यहूदिया[a] और यरूशलेम में रहनेवाले यहूदियों को लक्ष्य करके इस्राएल के प्रभु परमेश्वर के नाम से उनके विषय में भविष्यवाणी की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी समानांतर पाठ में यहाँ ‘यहूदा और यरूशलेम’ है; यूनानी पाठ में ‘यहूदिया और यरूशलेम’ है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम यूनानी वाक्यांश का अनुवाद ‘उन पर’, ‘उनके विषय में’ या प्रसंगानुसार ‘उन्हें’ भी किया जा सकता है। यूनानी और अरामी दोनों में अभिव्यक्ति संक्षिप्त और कुछ अस्पष्ट है।
    reason: alternative_reading
  - marker: c
    text: यूनानी पाठ में ‘भविष्यद्वक्ताओं’ से पहले निश्चित उपपद दो बार आया है, जो संभवतः प्रतिलिपि या पाठ-परंपरा की अनियमितता है; अनुवाद में अभिप्रेत अर्थ दिया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: दारयवेश के शासन के दूसरे वर्ष में
  rationale: δέ का संबंधसूचक बल यहाँ हल्का है, इसलिए अलग से ‘अब’ जोड़ना आवश्यक नहीं। βασιλεία इस प्रसंग में राज्य-क्षेत्र नहीं, दारयवेश का शासनकाल दर्शाता है।
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: हाग्गै और इद्दो के पुत्र जकर्याह
  rationale: एकवचन संबंधसूचक पद स्वाभाविक रूप से केवल जकर्याह को इद्दो का पुत्र बताता है। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: οἱ οἱ προφῆται
  choice: भविष्यद्वक्ता
  rationale: यूनानी पाठ में निश्चित उपपद दो बार आया है, पर आशय स्पष्टतः हाग्गै और जकर्याह को भविष्यद्वक्ता बताना है; हिन्दी में बहुवचन का बोध संयुक्त कर्ता और क्रिया से स्वाभाविक रूप से होता है।
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: यहूदियों के सामने
  rationale: ἐπί यहाँ भविष्यवाणी के श्रोताओं अथवा उसकी ओर निर्देशित समुदाय को दर्शाता है। ‘के सामने’ हिन्दी में इस दिशा को सहजता से व्यक्त करता है और विरोधसूचक ‘विरुद्ध’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम में रहनेवाले
  rationale: प्राथमिक यूनानी पाठ में Ἰουδαία है, इसलिए क्षेत्र का रूप ‘यहूदिया’ रखा गया है; अरामी समानांतर में ‘यहूदा’ मिलता है, जिसे पाद-टिप्पणी में बताया गया है।
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु परमेश्वर के नाम से
  rationale: यह वाक्यांश भविष्यद्वाणी के दैवी अधिकार या प्रतिनिधित्व को व्यक्त करता है। ‘नाम से’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: ἐπ’ αὐτούς
  choice: उनके विषय में
  rationale: अंतिम संक्षिप्त वाक्यांश का अर्थ ‘उनके विषय में’, ‘उन पर’ या प्रसंगानुसार ‘उन्हें’ हो सकता है। मुख्य पाठ में प्रसंग के अनुकूल सहज अर्थ चुना गया और अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: यहूदी धर्मग्रंथीय प्रसंग में Κυρίου θεοῦ Ἰσραήλ का अनुवाद
  choice: इस्राएल के प्रभु परमेश्वर
  alternative: इस्राएल के प्रभु, परमेश्वर
  rationale: प्राथमिक पाठ यूनानी है और उसमें Κύριος है; इसलिए ‘प्रभु’ रखा गया है, न कि इब्रानी परमेश्वर-नाम का कोई विशिष्ट रूप। संपूर्ण पद को सहज हिन्दी संबंध-रचना में रखा गया है।
- issue: ἐπί द्वारा व्यक्त भविष्यवाणी और यहूदी समुदाय का संबंध
  choice: यहूदियों के सामने ... उनके विषय में
  alternative: यहूदियों के विरुद्ध ... उन पर
  rationale: प्रसंग भविष्यद्वक्ताओं द्वारा समुदाय को संबोधित करने का है, शत्रुतापूर्ण निंदा का नहीं। फिर भी दूसरे ἐπί की संक्षिप्त और बहुअर्थी प्रकृति को पाद-टिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की पुनरुक्ति घटाई गई है, पर यूनानी पाठ की अंतिम अर्थगत अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
