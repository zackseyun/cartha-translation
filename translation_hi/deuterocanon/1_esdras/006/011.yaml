base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: hi
  text: इसलिए हमने उनसे पूछताछ की, ताकि हम तुम्हें सूचना दे सकें और तुम्हें उन पुरुषों के नाम लिख सकें जो अगुवाई कर रहे थे[a]; और हमने उनसे उन लोगों के नामों की सूची माँगी जो उनके प्रधान थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो औपचारिक विवरण दे रहे थे।” यूनानी शब्द का अर्थ अगुवाई करना अथवा औपचारिक विवरण प्रस्तुत करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “नामों की सूची” एक आधिकारिक लिखित अभिलेख को सूचित करती है, जिसमें काम की देखरेख करनेवाले प्रधानों के नाम दर्ज थे।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: हमने उनसे पूछताछ की
  rationale: क्रिया औपचारिक रूप से प्रश्न करने या जानकारी लेने का भाव रखती है; प्रशासनिक प्रतिवेदन के संदर्भ में ‘पूछताछ की’ साधारण ‘पूछा’ से अधिक उपयुक्त है।
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  choice: ताकि हम तुम्हें सूचना दे सकें
  rationale: यह उद्देश्यसूचक रचना है। चुना गया वाक्यांश आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ बनाए रखता है।
- source_word: γράψαι σοι τοὺς ἀνθρώπους
  choice: तुम्हें उन पुरुषों के बारे में लिख सकें
  rationale: यूनानी में पहले खंड में ‘नाम’ स्पष्ट रूप से नहीं है। इसलिए अंग्रेज़ी परामर्श-पाठ में जोड़े गए ‘names’ को मुख्य पाठ में नहीं जोड़ा गया; व्यक्तियों की पहचान लिख भेजने का प्रशासनिक भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοὺς ἀφηγουμένους
  choice: जो अगुवाई कर रहे थे
  rationale: दुर्लभ और संदर्भगत रूप से कठिन कृदन्त अगुवाई करने या विवरण प्रस्तुत करने, दोनों की ओर संकेत कर सकता है। निर्माण-कार्य के उत्तरदायी लोगों के संदर्भ में मुख्य पाठ नेतृत्व का अर्थ देता है, जबकि दूसरा सम्भव अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ὀνοματογραφίαν
  choice: नामों की सूची
  rationale: यह दुर्लभ शब्द नामों के लिखित अभिलेख या पंजिका को दर्शाता है। ‘नामों की सूची’ स्पष्ट, स्वाभाविक और प्रशासनिक संदर्भ के अनुकूल है।
- source_word: τῶν προκαθηγουμένων
  choice: जो उनके मुखिया थे
  rationale: कृदन्त उन लोगों को सूचित करता है जो दूसरों के आगे या उन पर नियुक्त होकर नेतृत्व करते थे। ‘मुखिया’ संबंधपरक नेतृत्व को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
