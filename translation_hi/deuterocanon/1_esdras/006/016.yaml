  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: hi
  text: बाबुल देश पर कुस्रू के शासन के पहले वर्ष में राजा कुस्रू ने लिखा[a] कि यह भवन[b] बनाया जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “राजा कुस्रू ने लिखित आदेश दिया कि यह भवन बनाया जाए।” यूनानी में शाब्दिक रूप से “लिखा ... इस भवन को बनाने के लिए” है; प्रसंग में यह राजा का लिखित आदेश है।
    reason: lexical_alternative
  - marker: b
    text: “यह भवन” यरूशलेम के मंदिर को दर्शाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει
  choice: पहले वर्ष में
  rationale: ἐν के साथ सप्तमी समय को सूचित करती है। δέ हल्का संयोजक है; हिन्दी में प्रसंग के प्रवाह से संबंध स्पष्ट होने के कारण अलग विरोधसूचक शब्द जोड़ना आवश्यक नहीं है।
- source_word: βασιλεύοντος Κύρου χώρας Βαβυλωνίας
  choice: बाबुल देश पर कुस्रू के राज्य के
  rationale: यह पदबंध कुस्रू के बाबुलिया क्षेत्र पर शासन करने का समय बताता है। χώρα को नगर नहीं, भूभाग के अर्थ में ‘देश’ और βασιλεύοντος को स्वाभाविक हिन्दी में ‘राज्य’ से व्यक्त किया गया है।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: यूनानी क्रिया का सीधा अर्थ ‘लिखा’ है। प्रसंग में यह राजकीय लिखित आदेश है, पर मुख्य पाठ में मूल से अधिक विशिष्ट प्रशासनिक पद नहीं जोड़ा गया।
- source_word: βασιλεὺς Κῦρος
  choice: राजा कुस्रू
  rationale: यह हिन्दी में उपाधि और नाम का स्वाभाविक क्रम है; ‘कुस्रू’ बाइबलीय हिन्दी में Cyrus का प्रचलित रूप है।
- source_word: οἰκοδομῆσαι
  choice: बनाया जाए
  rationale: ἔγραψεν के बाद अनंत क्रिया लिखित निर्देश की विषयवस्तु बताती है। हिन्दी का कर्मवाच्य निर्देशात्मक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν οἶκον τοῦτον
  choice: यह भवन
  rationale: οἶκος का मूल अर्थ घर/भवन है। यहाँ संकेत मंदिर की ओर है, फिर भी मुख्य पाठ में ‘मंदिर’ जोड़कर निहित संदर्भ को स्पष्ट अर्थ में नहीं बदला गया। ‘भवन’ इस राजकीय निर्माण-संदर्भ में सहज है।
theological_decisions:
- issue: ‘यह भवन’ का संदर्भ
  choice: मुख्य पाठ में ‘यह भवन’ रखा गया
  alternative: यह मंदिर
  rationale: यूनानी में οἶκος है, जबकि व्यापक प्रसंग से यरूशलेम का मंदिर अभिप्रेत है। मूल की उपासना-संबंधी ‘घर/भवन’ की भाषा बचाने के लिए संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: राजकीय लेख का बल
  choice: ‘लिखा’
  alternative: ‘आदेश जारी किया’ या ‘लिखित आदेश दिया’
  rationale: प्रसंग राजकीय आदेश का है, पर यूनानी पाठ केवल ἔγραψεν कहता है। इसलिए मुख्य पाठ उसके सरल शाब्दिक बल को रखता है और प्रशासनिक आशय पादटिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘बाबुल देश’ सामान्य पाठक के लिए क्षेत्रीय अर्थ स्पष्ट करता है; ‘भवन’ मूल οἶκος को सुरक्षित रखते हुए निर्माण-संदर्भ में ‘घर’ से अधिक स्वाभाविक है। पद के अंत का अल्पविराम अगले वाक्यांश से इसके जुड़ाव को बनाए रखता है।
