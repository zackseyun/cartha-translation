base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: hi
  text: कुरूश के शासन के पहले वर्ष में राजा कुरूश ने आदेश दिया कि यरूशलेम में प्रभु का भवन बनाया जाए, जहाँ वे निरन्तर अग्नि के द्वारा बलि चढ़ाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ वे अग्नि के द्वारा निरन्तर बलि चढ़ाते हैं।” यूनानी पदबंध संक्षिप्त है और इसका आशय लगातार जलती अग्नि अथवा नियमित अग्नि-बलियों से हो सकता है।
    reason: मूल यूनानी में ‘निरन्तर’ का सम्बन्ध अग्नि से है, पर पूरा पदबंध निरन्तर अग्नि-बलि चढ़ाने का भाव भी दे सकता है।
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: कुस्रू के शासन के पहले वर्ष में
  rationale: यह राजकीय काल-निर्धारण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और यूनानी वाक्यांश का कालगत अर्थ बनाए रखता है।
- source_word: βασιλεὺς Κῦρος
  choice: राजा कुस्रू
  rationale: राजकीय उपाधि को स्पष्ट रखते हुए हिन्दी के स्वाभाविक उपाधि-नाम क्रम का प्रयोग किया गया है।
- source_word: προσέταξεν
  choice: आदेश दिया
  rationale: यह क्रिया अधिकारपूर्वक आज्ञा देने को दर्शाती है; ‘आदेश दिया’ प्रशासनिक संदर्भ में स्वाभाविक है और औपचारिक राजाज्ञा का अनावश्यक विशेषीकरण नहीं करता।
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: प्रभु का भवन
  rationale: ‘भवन’ οἶκος के ‘घर/भवन’ रूपक को बनाए रखता है और इस संदर्भ में मन्दिर के अर्थ में सहज समझा जा सकता है।
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह भवन के स्थान को संक्षिप्त और स्वाभाविक हिन्दी में बताता है।
- source_word: οἰκοδομῆσαι
  choice: बनाया जाए
  rationale: आदेश की विषय-वस्तु को कर्मवाच्य रूप में व्यक्त किया गया है, क्योंकि भवन ही निर्माण की जाने वाली वस्तु है।
- source_word: ὅπου
  choice: जहाँ
  rationale: यह स्थानवाचक सम्बन्धसूचक शब्द का सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐπιθύουσιν
  choice: वे ... बलि चढ़ाते हैं
  rationale: सन्दर्भ में क्रिया बलिदान अर्पित करने का धार्मिक अर्थ रखती है; हिन्दी में ‘बलि चढ़ाते हैं’ इसे स्पष्ट और सहज बनाता है।
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: निरन्तर अग्नि के द्वारा
  rationale: 'यह संक्षिप्त यूनानी पदबंध की रचनात्मक अस्पष्टता को बनाए रखता है: ‘निरन्तर’ अग्नि को विशेषित कर सकता है, जबकि व्यापक अर्थ लगातार अग्नि-बलियों का भी हो सकता है।'
theological_decisions:
- issue: मन्दिर के सन्दर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: मूल यूनानी में κυρίου है। ‘प्रभु’ यूनानी पद को सीधे और परम्परागत ढंग से व्यक्त करता है, जबकि ‘यहोवा’ ऐसा इब्रानी आधार मान लेता जिसे इस यूनानी पाठ में प्रत्यक्ष रूप से नहीं लिखा गया।
- issue: διὰ πυρὸς ἐνδελεχοῦς में निरन्तरता का सम्बन्ध
  choice: निरन्तर अग्नि के द्वारा
  alternative: अग्नि के द्वारा निरन्तर बलि चढ़ाते हैं
  rationale: यूनानी पदबंध संक्षिप्त है और ἐνδελεχοῦς व्याकरणतः πυρός के साथ जुड़ा है। मुख्य पाठ उसी निकट सम्बन्ध को रखता है; पादटिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रभु का भवन’ मूल के रूपक को सुरक्षित रखता है, जबकि प्रसंग से मन्दिर का अर्थ स्पष्ट है। पादटिप्पणी-चिह्न उसी अस्पष्ट बलिदानी पदबंध के बाद रखा गया है जिससे वह सम्बन्धित है।
