base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: hi
  text: वे निरन्तर अग्नि के द्वारा बलिदान चढ़ाएँ; उसकी[a] ऊँचाई साठ हाथ और चौड़ाई साठ हाथ हो; वह तराशे हुए पत्थर की तीन परतों और स्थानीय नई लकड़ी की एक परत से बनाया जाए। खर्च राजा कुस्रू के राजघराने से दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ ऊँचाई और चौड़ाई का व्याकरणिक संबंध कठिन है और उसका स्पष्ट पूर्वपद नहीं दिया गया है। आगे के निर्माण-विवरण के आधार पर इसे भवन की ऊँचाई और चौड़ाई समझा गया है।
    reason: स्रोत-पाठ के कठिन व्याकरणिक संक्रमण को पारदर्शी ढंग से चिह्नित करना, बिना उसे किसी विशेष व्याख्यात्मक परंपरा के अनुसार निश्चित किए।
lexical_decisions:
- source_word: θύουσιν διὰ πυρὸς ἐνδελεχοῦς
  choice: वे निरन्तर जलती आग में बलिदान चढ़ाएँ
  rationale: θύω का स्वाभाविक हिन्दी रूप ‘बलिदान चढ़ाना’ है। διὰ πυρὸς ἐνδελεχοῦς को ऐसी आग के रूप में रखा गया है जो लगातार जलती रहती है; इससे यूनानी की विधि-संबंधी अभिव्यक्ति बनी रहती है, पर हिन्दी अस्वाभाविक नहीं होती।
- source_word: πηχέων ἑξήκοντα
  choice: साठ हाथ
  rationale: πηχύς प्राचीन लंबाई की इकाई ‘हाथ’ (cubit) है; सामान्य पाठक के लिए पारंपरिक और सुबोध हिन्दी शब्द चुना गया है।
- source_word: δόμων λιθίνων ξυστῶν τριῶν
  choice: तराशे हुए पत्थरों की तीन कतारों
  rationale: δόμος यहाँ निर्माण की क्षैतिज कतार या course है और ξυστός गढ़े/तराशे हुए पत्थर को दर्शाता है। ‘कतार’ सामान्य हिन्दी में निर्माण-विन्यास स्पष्ट करती है।
- source_word: δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  choice: स्थानीय नई लकड़ी की एक कतार
  rationale: ἐγχώριος का अर्थ स्थानीय/देश में उपलब्ध और καινός का अर्थ नया है। विशेषणों को बिना विस्तार जोड़े सुरक्षित रखा गया है।
- source_word: ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: राजा कुस्रू के राजभवन से
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है; राजकीय संदर्भ में ‘राजभवन’ स्वाभाविक है और इसे अनिश्चित रूप से ‘राजकोष’ बनाकर अर्थ सीमित नहीं किया गया। ‘कुस्रू’ बाइबिलीय हिन्दी में Cyrus का प्रचलित रूप है।
theological_decisions:
- issue: बलिदान और निरन्तर आग का संबंध
  choice: ‘निरन्तर जलती आग में बलिदान चढ़ाएँ’
  alternative: ‘निरन्तर आग के द्वारा बलिदान चढ़ाएँ’
  rationale: चुना हुआ रूप अग्नि को बलिदान चढ़ाने के माध्यम/परिवेश के रूप में रखता है और किसी विशिष्ट सांप्रदायिक बलिदान-सिद्धांत को नहीं जोड़ता।
- issue: ‘उसकी’ का व्याकरणिक पूर्वपद
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम रखा और पादटिप्पणी में समस्या बताई
  alternative: स्पष्ट रूप से ‘मन्दिर की ऊँचाई’ जोड़ना
  rationale: प्राप्त यूनानी पाठ में ऊँचाई और चौड़ाई बताने वाले सर्वनाम का स्पष्ट एकवचन पूर्वपद इस अंश में नहीं है। ‘मन्दिर’ जोड़ने से अर्थ सहज होता, पर वह स्रोत में निहित अस्पष्टता को चुपचाप हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। प्राचीन माप के लिए ‘हाथ’, निर्माण के course के लिए ‘कतार’, और राजकीय house के लिए ‘राजभवन’ चुना गया है। वाक्य-विभाजन हिन्दी में स्पष्टता के लिए किया गया है; आदेशात्मक भाव बनाए रखा गया है।
