base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: hi
  text: परन्तु उन्होंने हमें उत्तर दिया, “हम उस प्रभु के सेवक[a] हैं, जिसने आकाश और पृथ्वी की सृष्टि की।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सन्तान।” यूनानी शब्द का अर्थ “सन्तान” या “सेवक” दोनों हो सकता है; यहाँ प्रसंग सेवा के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν
  choice: उन्होंने हमें उत्तर दिया
  rationale: यूनानी क्रिया और उसके संप्रदान कारक को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: παῖδες
  choice: सेवक
  rationale: इस प्रशासनिक प्रसंग में यह शब्द परमेश्वर की सेवा और उसके प्रति अधीनता बताता है; फिर भी इसका अर्थ ‘सन्तान’ भी हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: τοῦ κυρίου
  choice: उस प्रभु के
  rationale: κύριος के लिए ‘प्रभु’ यहूदी शास्त्रीय प्रयोग और परमेश्वर की सार्वभौमता दोनों को बनाए रखता है; ‘उस’ आगे आने वाले विशेषणात्मक उपवाक्य से सहज सम्बन्ध बनाता है।
- source_word: τοῦ κτίσαντος
  choice: जिसने … की सृष्टि की
  rationale: कृदन्त के परिचयात्मक अर्थ को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त करता है और सृजन के आशय को स्पष्ट रखता है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: आकाश और पृथ्वी
  rationale: यह समस्त सृष्टि को सूचित करने वाली पारम्परिक शास्त्रीय युग्म-अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर के सम्बन्ध में παῖδες का अनुवाद
  choice: सेवक
  alternative: सन्तान
  rationale: प्रसंग में वक्ता अपने निर्माण-कार्य को परमेश्वर की सेवा के रूप में प्रस्तुत कर रहे हैं, इसलिए ‘सेवक’ अधिक उपयुक्त है; पर यूनानी शब्द की सन्तान-संबन्धी सम्भावना को दबाया नहीं गया है।
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ शास्त्रीय गरिमा और परमेश्वर की सार्वभौमता को सुरक्षित रखता है, जबकि यहाँ केवल मानवीय स्वामित्व का भाव अपेक्षित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सृष्टि की’ शास्त्रीय प्रतिध्वनि बनाए रखते हुए सामान्य हिन्दी पाठक के लिए स्पष्ट है।
