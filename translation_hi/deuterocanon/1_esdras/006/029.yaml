base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: hi
  text: इसी प्रकार गेहूँ, नमक, दाखमधु और तेल भी वर्ष-दर-वर्ष नियमित रूप से उपलब्ध कराए जाएँ; जैसा यरूशलेम के याजक निर्धारित करें, उसी के अनुसार इन्हें प्रतिदिन बिना किसी विवाद के[a] खर्च किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना चूके।” यूनानी क्रियाविशेषण का अर्थ “बिना किसी विवाद या आपत्ति के” हो सकता है; यह आदेश के निश्चित रूप से पालन किए जाने पर भी बल दे सकता है।
    reason: ἀναμφισβητήτως के ‘निर्विवाद/अनापत्तिजनक’ और ‘निश्चित रूप से’ दोनों संभावित अर्थों को सुरक्षित रखता है।
lexical_decisions:
- source_word: πυρὸν
  choice: गेहूँ
  rationale: यहाँ πυρός का अर्थ सामान्य अनाज नहीं, विशेष रूप से गेहूँ है; सामग्री की ठोस सूची को बनाए रखा गया है।
- source_word: ἅλα
  choice: नमक
  rationale: बलिदान-संबंधी सामग्री की सूची में इसका सीधा और स्वाभाविक अर्थ नमक है।
- source_word: οἶνον
  choice: दाखमधु
  rationale: उपासना और बलिदान के संदर्भ में οἶνος के लिए यह स्पष्ट, गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी शब्द है।
- source_word: ἔλαιον
  choice: तेल
  rationale: संदर्भ में जैतून का तेल अभिप्रेत है, पर हिन्दी में ‘तेल’ स्वाभाविक है और सूची में पर्याप्त रूप से स्पष्ट है।
- source_word: ἐνδελεχῶς κατʼ ἐνιαυτόν
  choice: हर वर्ष नियमित रूप से
  rationale: यह अभिव्यक्ति निरन्तर और आवर्ती वार्षिक व्यवस्था का बोध कराती है; हिन्दी में इसे सहज प्रशासनिक भाषा में व्यक्त किया गया है।
- source_word: ὑπαγορεύσωσιν
  choice: जैसा निर्देश दें
  rationale: क्रिया याजकों द्वारा आवश्यक सामग्री या मात्रा बताने और निर्धारित करने का भाव देती है।
- source_word: ἀναλίσκεσθαι
  choice: उपयोग में लाया जाए
  rationale: बलिदान-संबंधी सामग्री के खर्च या उपभोग का व्यापक भाव रखा गया है, ताकि अर्थ केवल खाने तक सीमित न हो।
- source_word: καθʼ ἡμέραν
  choice: प्रतिदिन
  rationale: यह दिन-प्रतिदिन होने वाले नियमित उपयोग को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναμφισβητήτως
  choice: बिना किसी आपत्ति के
  rationale: मूल शब्द का प्राथमिक भाव निर्विवाद या बिना विरोध के है; प्रशासनिक प्रसंग में आपूर्ति को बिना आपत्ति के पूरा करने की बात उपयुक्त बैठती है, जबकि ‘बिना चूके’ की सम्भावना पादटिप्पणी में रखी गई है।
