  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ ने बलिदान-संबंधी सूची का बाइबलीय स्वर बनाए रखा है। वाक्य की आज्ञार्थक प्रशासनिक प्रकृति स्पष्ट करने के लिए ग्रीक के आश्रित infinitive को हिन्दी में ‘दिए जाएँ’ और ‘उपयोग में लाया जाए’ से व्यक्त किया गया है।
