base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: hi
  text: उन्होंने भवन को ढा दिया और उसे आग लगा दी[a], और लोगों को बंदी बनाकर बाबेल ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् परमेश्वर का भवन—मंदिर।
    reason: ‘भवन’ के ऐतिहासिक संदर्भ और अभिप्राय को स्पष्ट करना।
lexical_decisions:
- source_word: οἶκον
  choice: भवन
  rationale: ग्रीक शब्द का मूल अर्थ ‘घर/भवन’ है और इस ऐतिहासिक संदर्भ में यह परमेश्वर के भवन, अर्थात् मंदिर, को दर्शाता है। ‘भवन’ हिन्दी में गरिमापूर्ण और स्वाभाविक है तथा मुख्य पाठ में निहित संकेत को बनाए रखता है।
- source_word: καθελόντες
  choice: ढा दिया
  rationale: यह क्रिया किसी संरचना को गिराने या ध्वस्त करने का भाव देती है। ‘ढा दिया’ विनाश की क्रिया को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐνεπύρισαν
  choice: आग लगा दी
  rationale: ग्रीक क्रिया का अर्थ आग लगाना या जला देना है। ‘आग लगा दी’ कर्तृवाच्य बल को स्पष्ट रखता है और पूर्ववर्ती ‘ढा दिया’ के साथ अनावश्यक पुनरुक्ति से बचता है।
- source_word: λαὸν
  choice: लोगों
  rationale: यह सामूहिक रूप से वहाँ के जनसमुदाय को दर्शाता है। ‘लोगों’ आधुनिक हिन्दी में सीधा और स्वाभाविक अनुवाद है।
- source_word: ᾐχμαλώτευσαν
  choice: बंदी बनाकर ... ले गए
  rationale: क्रिया युद्धबंदी बनाने का अर्थ देती है। हिन्दी में ‘बंदी बनाकर ले गए’ पकड़ने और निर्वासन की दिशा—दोनों को स्वाभाविक रूप से व्यक्त करता है; केवल ‘निर्वासित किया’ मूल की बंदी बनाए जाने वाली छवि को कम कर देता।
- source_word: εἰς Βαβυλῶνα
  choice: बाबेल ले गए
  rationale: εἰς गंतव्य की दिशा बताता है। ‘बाबेल ले गए’ हिन्दी में स्वाभाविक है और बंदियों को वहाँ पहुँचाए जाने का भाव स्पष्ट करता है।
theological_decisions:
- issue: ‘भवन’ का अभिप्राय
  choice: मुख्य पाठ में ‘भवन’, और पाद-टिप्पणी में परमेश्वर का भवन अर्थात् मंदिर
  alternative: मुख्य पाठ में सीधे ‘मंदिर’
  rationale: ग्रीक में οἶκος (‘घर/भवन’) है, मंदिर के लिए अधिक स्पष्ट शब्द नहीं। इसलिए मुख्य पाठ स्रोत की शब्दावली सुरक्षित रखता है, जबकि पाद-टिप्पणी ऐतिहासिक अभिप्राय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बाबेल’ बाइबलीय स्थान-नाम के रूप में रखा गया है। मुख्य पाठ में स्रोत का ‘भवन’ रूप सुरक्षित है और पाद-टिप्पणी में मंदिर का संकेत स्पष्ट किया गया है।
