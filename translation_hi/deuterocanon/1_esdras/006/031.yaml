base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: hi
  text: और यह आदेश दिया जाए कि यदि कोई लिखी हुई बातों में से किसी बात का उल्लंघन करे और उसे अमान्य करे, तो उसकी अपनी संपत्ति से एक शहतीर लिया जाए और उसे उस पर लटका दिया जाए[a]; और उसकी संपत्ति राजकीय संपत्ति हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उस पर बेधकर चढ़ाया जाए” अथवा “उसे उस पर टाँग दिया जाए।” यूनानी क्रिया का सीधा अर्थ “लटकाया जाना” है, पर यहाँ वर्णित प्राचीन दंड में किसी को शहतीर पर बेधकर चढ़ाना या सार्वजनिक रूप से टाँगना भी शामिल हो सकता था।
    reason: κρεμασθῆναι के सीधे अर्थ तथा प्राचीन दंड-विधि की संभावित ऐतिहासिक प्रकृति—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: προστάξαι
  choice: यह आदेश दिया जाए
  rationale: यह पद राजकीय प्रशासनिक आदेश की पूर्ववर्ती शृंखला को आगे बढ़ाता है; कर्मवाच्य हिंदी में औपचारिक और स्वाभाविक है।
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: लिखी हुई बातों में से किसी का उल्लंघन करे
  rationale: τι के साथ संबंधकारक बहुवचन का अर्थ लिखे हुए प्रावधानों में से किसी एक बात या अंश से है; ‘उल्लंघन’ विधिक बल बनाए रखता है।
- source_word: ἀκυρώσωσιν
  choice: उसे निष्प्रभावी करे
  rationale: क्रिया का अर्थ किसी आदेश को अमान्य या प्रभावहीन करना है; यह चयन विधिक अर्थ को स्पष्ट रखता है।
- source_word: λημφθῆναι ξύλον
  choice: एक शहतीर निकाला जाए
  rationale: ξύλον लकड़ी, काष्ठ या शहतीर हो सकता है। दंड के इस प्रसंग में संरचना से निकाला जाने वाला ‘शहतीर’ सर्वाधिक उपयुक्त है।
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: उसकी अपनी संपत्ति में से
  rationale: यूनानी अभिव्यक्ति घर तक सीमित न होकर उसकी अपनी वस्तुओं या संपत्ति का व्यापक अर्थ देती है; इसलिए पाठ से अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: κρεμασθῆναι
  choice: उसे उस पर लटका दिया जाए
  rationale: मूल क्रिया का सीधा अर्थ लटकाना या टाँगना है। प्राचीन दंड-विधि में सूली पर चढ़ाने या शहतीर पर प्रदर्शित करने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: उसकी सारी संपत्ति
  rationale: यह अभिव्यक्ति उसकी भौतिक मिल्कियत और साधनों को समग्र रूप से दर्शाती है।
- source_word: βασιλικά
  choice: राजकीय संपत्ति
  rationale: विशेषण का अर्थ राजा या राजसत्ता से संबंधित होना है; यहाँ दंडस्वरूप संपत्ति के राजकोष में चले जाने का विधिक परिणाम व्यक्त होता है।
theological_decisions:
- issue: फ़ारसी-कालीन दंड-विधान में κρεμασθῆναι की सटीक प्रकृति
  choice: उसे उस पर लटका दिया जाए
  alternative: उसे उस पर सूली पर चढ़ाया जाए; अथवा उसे उस पर टाँग दिया जाए
  rationale: यूनानी क्रिया स्वयं लटकाने या टाँगने को व्यक्त करती है, जबकि ऐतिहासिक संदर्भ बेधकर शहतीर पर चढ़ाने या मृत शरीर को सार्वजनिक रूप से प्रदर्शित करने की ओर संकेत कर सकता है। मुख्य पाठ सीधे शाब्दिक अर्थ को रखता है और अधिक विशिष्ट संभावनाएँ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में औपचारिक राजकीय आदेश का गरिमापूर्ण किंतु सहज रजिस्टर रखा गया है। ‘निष्प्रभावी’, ‘शहतीर’ और ‘राजकीय संपत्ति’ विधिक तथा प्रशासनिक संदर्भ को स्पष्ट करते हैं। आरंभिक ζωῆς को इस पद में शामिल नहीं किया गया, क्योंकि उपलब्ध पाठ-संदर्भ में वह पिछले वाक्य का अंतिम शब्द प्रतीत होता है और परामर्श-पाठ भी वर्तमान पद को καὶ προστάξαι से आरंभ करता है।
