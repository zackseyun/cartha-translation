- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: बाबेल के लिए निकल पड़ा
  rationale: ἐξέρχομαι में बाहर निकलने अथवा प्रस्थान करने का भाव है और εἰς गंतव्य बताता है; यह रूप दोनों बातों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀπήγγειλεν
  choice: यह समाचार सुनाया
  rationale: ἀπαγγέλλω का अर्थ सूचना देना, सुनाना या घोषणा करना है। यूनानी में कर्म अनुक्त है; हिन्दी में ‘यह समाचार’ निकटवर्ती प्रसंग की ओर संकेत करते हुए वाक्य को स्वाभाविक बनाता है।
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: अपने सभी भाइयों को
  rationale: यह यूनानी पदबंध का सीधा रूप है और πᾶσιν ‘सभी’ को स्पष्ट रखता है। संदर्भ में ‘भाई’ व्यापक रूप से अपने समुदाय के लोगों को भी सूचित कर सकता है।
