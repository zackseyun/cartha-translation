  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: hi
  text: और उसके न्याय में कुछ भी अन्यायपूर्ण नहीं है। उसी का बल, राज्य, अधिकार और महिमा सभी युगों[b] की है। सत्य के परमेश्वर धन्य हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: अर्थात सदा-सर्वदा; यूनानी में शाब्दिक रूप से, ‘सभी युगों की।’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: न्याय
  rationale: ἐν τῇ κρίσει αὐτῆς में न्याय करने अथवा न्यायिक निर्णय का भाव है। ‘न्याय’ हिन्दी में स्वाभाविक है और साथ आए ἄδικον के साथ विधिक विरोध को बनाए रखता है।
- source_word: ἄδικον
  choice: अन्यायपूर्ण
  rationale: यह उस बात को दर्शाता है जो न्यायसंगत नहीं है। ‘अन्यायपूर्ण’ न्यायिक संदर्भ को स्पष्ट रखता है और अनावश्यक रूप से भारी धर्मशास्त्रीय शब्दावली नहीं जोड़ता।
- source_word: ἰσχύς
  choice: बल
  rationale: ‘बल’ सामर्थ्य के मूल भाव को संक्षेप और गरिमा के साथ व्यक्त करता है तथा ἐξουσία से अलग रहता है।
- source_word: βασίλειον
  choice: राज्य
  rationale: इस स्तुतिपरक सूची में यह राजकीय शासन अथवा प्रभुत्व को सूचित करता है; ‘राज्य’ इसका स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: यह वैध सत्ता या अधिकार-क्षेत्र का भाव सुरक्षित रखता है और ἰσχύς (‘बल’) के साथ अर्थगत भेद बनाए रखता है।
- source_word: μεγαλειότης
  choice: महिमा
  rationale: स्तुति के प्रसंग में ‘महिमा’ उत्कर्ष और महानता को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करती है।
- source_word: τῶν πάντων αἰώνων
  choice: सभी युगों का
  rationale: यह यूनानी पदबंध की संरचना और काल-विस्तार को सीधे सुरक्षित रखता है; मुहावरेदार अर्थ ‘सदा-सर्वदा’ पादटिप्पणी में दिया गया है।
- source_word: εὐλογητός
  choice: धन्य हैं
  rationale: यह स्तुतिपरक उद्घोष को वर्तमान मानक हिन्दी में स्वाभाविक रूप देता है। ‘धन्य हों’ भी संभव है, पर यहाँ कथनात्मक स्तुति यूनानी विशेषण के अधिक निकट है।
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: सत्य के परमेश्वर
  rationale: यह संबंधकारक रचना को बनाए रखता है और परमेश्वर को सत्य से अभिलक्षित करता है। ‘सच्चे परमेश्वर’ कहने से वाक्य-रचना और बलाघात बदल जाते।
theological_decisions:
- issue: αὐτῆς और αὕτη के स्त्रीलिंग संकेत का अभिप्राय
  choice: इनका अभिप्राय निकटवर्ती संदर्भ में व्यक्ति-रूप में प्रस्तुत ‘सच्चाई/सत्य’ से माना गया है; इसलिए ‘उसके’ और ‘वही’ रखा गया है।
  alternative: अमूर्त शैली में सर्वनामों के स्थान पर हर बार ‘सत्य’ दोहराया जा सकता था।
  rationale: यूनानी पाठ सत्य के मानवीकरण को आगे बढ़ाता है। हिन्दी सर्वनाम व्याकरणिक लिंग स्पष्ट नहीं करते, इसलिए पादटिप्पणी साहित्यिक संकेत को दृश्यमान रखती है।
- issue: καὶ αὕτη ἡ ἰσχὺς... की वाक्यगत भूमिका
  choice: ‘वही ... बल, राज्य, अधिकार और महिमा है’
  alternative: ‘बल, राज्य, अधिकार और महिमा उसी के हैं’
  rationale: चुना हुआ रूप αὕτη को कर्ता मानकर स्रोत की अधिक सीधी पहचान-वाचक रचना सुरक्षित रखता है। स्वामित्व-वाचक विकल्प अर्थ की व्याख्या करता है, पर यूनानी की तीव्र पहचान को कुछ नरम कर देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्तुतिपरक रखी गई है। समानार्थी सत्ता-सूचक संज्ञाओं—‘बल’, ‘राज्य’ और ‘अधिकार’—का भेद बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी का चिह्न ‘unjust’ के बाद था, जबकि उसका विषय ‘of all the ages’ है; हिन्दी में चिह्न को संबंधित पद ‘सभी युगों’ पर लगाया गया है।
