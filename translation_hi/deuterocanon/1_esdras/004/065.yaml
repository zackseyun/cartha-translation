  yaml_path: translation/deuterocanon/1_esdras/004/065.yaml
  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: hi
  text: तब उसने राजा से कहा, “उस मन्नत को याद कीजिए[a], जो मैंने उस दिन यरूशलेम का पुनर्निर्माण करने के लिए मानी थी, जिस दिन आपने अपना राज्य प्राप्त किया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस प्रार्थना को याद कीजिए, जो मैंने यरूशलेम का पुनर्निर्माण करने के लिए की थी …।” यूनानी शब्द εὐχή और ηὐξάμην मन्नत या प्रार्थना, दोनों का बोध करा सकते हैं; यहाँ प्रसंग मन्नत के अर्थ के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: याद कीजिए
  rationale: यह राजा से किया गया सीधा आग्रह है। आदरसूचक आज्ञार्थक रूप आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: εὐχήν / ηὐξάμην
  choice: मन्नत / मानी थी
  rationale: संज्ञा और क्रिया का यह युग्म प्रार्थना अथवा मन्नत, दोनों का अर्थ दे सकता है। यहाँ यरूशलेम के पुनर्निर्माण का ठोस संकल्प व्यक्त होने के कारण मुख्य पाठ में ‘मन्नत’ चुना गया है; दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: οἰκοδομῆσαι
  choice: पुनर्निर्माण करने के लिए
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है, पर नष्ट हो चुके यरूशलेम की बहाली के प्रसंग में ‘पुनर्निर्माण’ आशय को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: παρέλαβες
  choice: प्राप्त किया था
  rationale: यहाँ क्रिया राजकीय अधिकार या राज्य पाने का बोध कराती है। ‘प्राप्त किया’ किसी हिंसक अधिग्रहण का अनावश्यक अर्थ जोड़े बिना यूनानी अभिव्यक्ति के निकट रहता है।
- source_word: τὸ βασίλειόν σου
  choice: अपना राज्य
  rationale: वाक्यांश का अर्थ ‘राज्य’, ‘राजपद’ अथवा ‘राजसत्ता’ हो सकता है। ‘अपना राज्य प्राप्त किया’ हिन्दी में सहज है और राजकीय शासन मिलने का भाव भी समेटता है।
theological_decisions:
- issue: εὐχή / ηὐξάμην का अर्थ
  choice: वक्ता द्वारा मानी गई मन्नत
  alternative: वक्ता द्वारा की गई प्रार्थना
  rationale: यूनानी शब्द-युग्म दोनों अर्थों की अनुमति देता है। यरूशलेम का पुनर्निर्माण करने जैसी निश्चित प्रतिबद्धता के कारण मुख्य पाठ में ‘मन्नत’ अधिक प्रसंगानुकूल है, जबकि वास्तविक lexical ambiguity को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरसूचक और गरिमापूर्ण रूप अपनाया गया है। ‘राजा से कहा’ और ‘याद कीजिए’ सामान्य पाठकों के लिए सहज हैं; ‘पुनर्निर्माण’ बहाली के ऐतिहासिक प्रसंग को स्पष्ट करता है।
