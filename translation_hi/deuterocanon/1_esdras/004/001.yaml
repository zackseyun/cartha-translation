  yaml_path: translation/deuterocanon/1_esdras/004/001.yaml
  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: hi
  text: और राजा दारा ने अपने अधीन रहने वाले सभी लोगों, अपने घराने के सभी लोगों, और मादै तथा फ़ारस के सभी प्रमुख जनों के लिए एक भव्य भोज आयोजित किया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοχή
  choice: भोज
  rationale: यह शब्द आतिथ्य के लिए आयोजित औपचारिक भोजन या दावत को दर्शाता है; राजकीय प्रसंग में ‘भोज’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μεγάλην
  choice: विशाल
  rationale: यह आयोजन के बड़े पैमाने और भव्यता को व्यक्त करता है; ‘विशाल भोज’ आधुनिक हिन्दी में सहज है।
- source_word: τοῖς ὑπʼ αὐτόν
  choice: अपने अधीन सभी लोगों
  rationale: यह यूनानी पदबंध के श्रेणीगत और अधिकार-संबंधी अर्थ को बनाए रखता है, बिना सबको संकीर्ण रूप से केवल ‘प्रजा’ कहे।
- source_word: οἰκογενέσιν αὐτοῦ
  choice: अपने पूरे घराने
  rationale: οἰκογενέσιν निकट परिवार से अधिक व्यापक राजकीय गृहस्थी या घराने के सदस्यों को समेट सकता है; ‘घराने’ से यह व्यापकता बनी रहती है।
- source_word: μεγιστᾶσιν
  choice: बड़े अधिकारियों
  rationale: यह उच्च पद और प्रभाव वाले प्रमुख व्यक्तियों को सूचित करता है। ‘बड़े अधिकारी’ साधारण आधुनिक हिन्दी में स्पष्ट है और अनिवार्य वंशानुगत कुलीनता नहीं जोड़ता।
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: मादै तथा फ़ारस
  rationale: दोनों भौगोलिक-राजनीतिक प्रदेशों के पारंपरिक हिन्दी नाम दिए गए हैं।
