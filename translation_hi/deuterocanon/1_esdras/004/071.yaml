  rationale: शाब्दिक ‘हर सामर्थी व्यक्ति’ प्रशासनिक सूची में अस्वाभाविक है; ‘अधिकारी’ अधिकार-संपन्न व्यक्ति का प्रसंगगत अर्थ स्पष्ट करता है। निषेध के साथ स्वाभाविक हिंदी के लिए ‘कोई भी’ प्रयुक्त है।
- source_word: σατράπην
  choice: क्षत्रप
  rationale: फारसी प्रशासनिक पद की ऐतिहासिक विशिष्टता बनाए रखने वाला प्रचलित हिंदी रूप है।
- source_word: τοπάρχην
  choice: प्रांतीय शासक
  rationale: τοπάρχης किसी स्थानीय क्षेत्र के शासक को दर्शाता है; यह रूप सामान्य पाठक के लिए अर्थ स्पष्ट रखता है।
- source_word: οἰκονόμον
  choice: भंडारी
  rationale: οἰκονόμος प्रबंधक अथवा संपत्ति-व्यवस्थापक है; ‘भंडारी’ संक्षिप्त, गरिमापूर्ण और प्रशासनिक सूची के अनुकूल है।
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: उनके द्वारों पर चढ़ न आए
  rationale: θύρας का प्रत्यक्ष चित्र ‘द्वारों’ में और ἐπέρχομαι का विरोधपूर्ण आगमन ‘चढ़ न आए’ में सुरक्षित है; सटीक प्रशासनिक आशय को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: राजकीय आदेश में स्वतंत्रता अथवा कानूनी छूट
  choice: उनकी स्वतंत्रता के संबंध में
  alternative: उनकी छूट के संबंध में
  rationale: ἐλευθερία सामान्यतः स्वतंत्रता है, पर इस प्रशासनिक प्रसंग में विशेषाधिकार या दायित्वों से छूट भी हो सकती है। मुख्य पाठ स्रोत का व्यापक अर्थ रखता है और संभावित कानूनी अर्थ पादटिप्पणी में देता है।
