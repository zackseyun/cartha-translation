  text: और उसने राज्य से यहूदिया जा रहे सभी यहूदियों को उनकी स्वतंत्रता[a] के विषय में लिखा कि कोई भी अधिकारी, क्षत्रप, प्रांतीय शासक या भंडारी उनके द्वारों पर आ न चढ़े[b],
