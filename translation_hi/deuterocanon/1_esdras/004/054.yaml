translation:
  language: hi
  text: उसने आपूर्ति और याजकीय पोशाक के विषय में भी लिखा—जिसमें वे उसमें सेवा करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी वाक्य-विन्यास असहज है; इसका शाब्दिक भाव है, “आपूर्ति और याजकीय पोशाक, जिसमें वे उसमें सेवा करते हैं।” स्त्रीलिंग सर्वनाम सम्भवतः ‘पोशाक’ की ओर संकेत करता है, पर वाक्य किसी संक्षिप्त या अस्थिर पाठ-रूप का परिणाम भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिखा
  rationale: γράϕω के सामान्य अर्थ को बनाए रखा गया है। प्रसंग में यह लिखित राजकीय आदेश या व्यवस्था हो सकती है, पर क्रिया स्वयं केवल लिखने को व्यक्त करती है।
- source_word: χορηγίαν
  choice: आपूर्ति
  rationale: χορηγία किसी उद्देश्य के लिए उपलब्ध कराई गई सामग्री या सहायता को दर्शाता है। ‘आपूर्ति’ इसके व्यापक अर्थ को बनाए रखती है और इसे वेतन या राशन तक सीमित नहीं करती।
- source_word: ἱερατικὴν στολήν
  choice: याजकीय पोशाक
  rationale: στολή यहाँ पुरोहितों द्वारा पहने जाने वाले विशिष्ट वस्त्र को दर्शाता है। यूनानी का एकवचन बनाए रखा गया है; ‘पोशाक’ आधुनिक हिन्दी में स्वाभाविक है और केवल एक चोगे का अनावश्यक रूप से निश्चित अर्थ नहीं देती।
- source_word: ἐν τίνι
  choice: जिसमें
  rationale: सम्बन्धवाचक पद का निकटतम पूर्वपद स्त्रीलिंग στολή (‘पोशाक’) है। स्रोत की असहज रचना को किसी निश्चित पाठ-सुधार द्वारा हल नहीं किया गया।
- source_word: λατρεύουσιν
  choice: सेवा करते हैं
  rationale: मन्दिर और याजकीय प्रसंग में λατρεύω धार्मिक या उपासना-संबंधी सेवा का बोध कराता है। ‘सेवा करते हैं’ सहज हिन्दी है और ‘आराधना करते हैं’ की अपेक्षा याजकीय कार्य के भाव को अधिक खुला रखता है।
- source_word: ἐν αὐτῇ
  choice: उसी में
  rationale: स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक सम्बन्ध στολή (‘पोशाक’) से है। ‘उसी में’ यूनानी की पुनरुक्ति को बनाए रखता है, यद्यपि हिन्दी में भी यह असहज सुनाई देती है।
theological_decisions:
- issue: याजकीय λατρεύω का अनुवाद
  choice: सेवा करते हैं
  alternative: आराधना करते हैं / उपासना-सेवा करते हैं
  rationale: यहाँ प्रसंग याजकीय पोशाक और धार्मिक कार्य का है। ‘सेवा’ सांप्रदायिक विशिष्टता जोड़े बिना धार्मिक सेवा और याजकीय कार्य—दोनों की सम्भावना बनाए रखती है।
- issue: दो स्थानवाचक पदों ἐν τίνι … ἐν αὐτῇ की व्याख्या
  choice: जिसमें वे उसी में
  alternative: जिसे पहनकर वे सेवा करते हैं / जिसमें वे वहाँ सेवा करते हैं
  rationale: यूनानी पाठ असहज और सम्भवतः संक्षिप्त या अस्थिर है। मुख्य पाठ स्रोत की पुनरुक्ति को सुरक्षित रखता है; ‘पहनकर’ या ‘वहाँ’ कहने से अस्पष्टता अनावश्यक रूप से सुलझ जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। मूल यूनानी की वास्तविक असहजता और सर्वनाम-संबंध की अनिश्चितता को मुख्य पाठ तथा पाद-टिप्पणी में सुरक्षित रखा गया है।
