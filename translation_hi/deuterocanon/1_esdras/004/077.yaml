  yaml_path: translation/deuterocanon/1_esdras/004/077.yaml
  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
translation:
  language: hi
  text: और उसने लिखित आदेश दिया कि लेवियों को उस दिन तक सहायता दी जाए, जब तक भवन पूरा न हो जाए और यरूशलेम का निर्माण न हो जाए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर”; यूनानी में शाब्दिक रूप से “भवन” है, जो इस प्रसंग में मन्दिर के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरूशलेम का पुनर्निर्माण न हो जाए।” प्रसंग बहाली का है, यद्यपि यूनानी क्रिया अपने आप में केवल “निर्माण होना” कहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: उसने लिखित आदेश दिया
  rationale: क्रिया का मूल अर्थ ‘उसने लिखा’ है, पर इसके बाद आने वाला infinitive लिखित निर्देश की विषयवस्तु बताता है; यह अनुवाद उस निर्देशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοῦναι
  choice: दी जाए
  rationale: यह aorist infinitive ἔγραψεν पर निर्भर है और लिखित आदेश की विषयवस्तु व्यक्त करता है; हिन्दी में कर्मवाच्य आज्ञार्थक रूप उपयुक्त है।
- source_word: τὴν χορηγίαν
  choice: सहायता
  rationale: χορηγία आवश्यकताओं के लिए दी जाने वाली सामग्री, व्यवस्था या निर्वाह-सहायता को सूचित करता है; ‘सहायता’ इसके स्वरूप को अनावश्यक रूप से सीमित नहीं करती।
- source_word: τοῖς Λευείταις
  choice: लेवियों को
  rationale: सम्प्रदान कारक सहायता पाने वालों को चिह्नित करता है।
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: उस दिन तक, जब तक
  rationale: यह सहायता की समय-सीमा प्रस्तुत करता है; हिन्दी में इसके साथ आगामी दोनों निर्माण-कार्यों की पूर्णता स्वाभाविक ढंग से जुड़ती है।
- source_word: ἐπιτελεσθῇ
  choice: पूरा न हो जाए
  rationale: passive subjunctive किसी कार्य के पूर्ण किए जाने को दर्शाता है; हिन्दी का ‘पूरा न हो जाए’ ‘जब तक’ के साथ स्वाभाविक है।
- source_word: ὁ οἶκος
  choice: भवन
  rationale: यूनानी में शाब्दिक अर्थ ‘घर/भवन’ है और प्रसंग में इससे मन्दिर अभिप्रेत है। ‘भवन’ स्रोत की अभिव्यक्ति को बनाए रखते हुए गरिमापूर्ण हिन्दी देता है।
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: यरूशलेम का निर्माण न हो जाए
  rationale: infinitive का अर्थ शाब्दिक रूप से ‘बनाया जाना’ है। बहाली के प्रसंग में ‘पुनर्निर्माण’ सम्भव है, पर यूनानी क्रिया स्वयं पुनः का भाव स्पष्ट नहीं करती।
