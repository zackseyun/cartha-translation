base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: hi
  text: सारी पृथ्वी सत्य को पुकारती है[a], और स्वर्ग उसे आशीष देता है; सभी कृतियाँ हिलती और काँपती हैं[b], और उसके साथ कुछ भी अन्यायपूर्ण नहीं है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य का आह्वान करती है।” यूनानी क्रिया का अर्थ पुकारना, बुलाना या नाम लेना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सभी रचे हुए कार्य।” यूनानी शब्द का शाब्दिक अर्थ “कार्य” या “कृतियाँ” है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में यहाँ सर्वनाम पुल्लिंग/नपुंसकलिंग रूप में है, यद्यपि पहले “सत्य” के लिए स्त्रीलिंग रूप आए हैं। संदर्भ में इसका संकेत संभवतः सत्य की ओर ही है।
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: सारी पृथ्वी
  rationale: स्वर्ग के साथ रखे गए इस विश्वव्यापी कथन में γῆ का अर्थ किसी सीमित भूभाग के बजाय पूरी पृथ्वी है।
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: सत्य को पुकारती है
  rationale: καλεῖ का सामान्य अर्थ ‘पुकारना/आह्वान करना’ है। यूनानी में ‘धन्य’ के लिए कोई अलग शब्द नहीं है, इसलिए समानांतर अगले खंड से उसे मुख्य पाठ में जोड़ना उचित नहीं।
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: स्वर्ग उसे आशीष देता है
  rationale: εὐλογεῖ का सीधा अर्थ ‘आशीष देना’ है। ‘उसे’ सत्य की ओर संकेत करता है और हिन्दी में अनावश्यक लिंग-निर्धारण से बचते हुए संदर्भ बनाए रखता है।
- source_word: πάντα τὰ ἔργα
  choice: सभी कृतियाँ
  rationale: ἔργα का मूल अर्थ ‘कार्य/कृतियाँ’ है। विश्वव्यापी संदर्भ में इसका संकेत रची हुई वस्तुओं की ओर हो सकता है, पर इस संभावना को पादटिप्पणी में रखा गया है।
- source_word: σείεται καὶ τρέμει
  choice: हिलती और काँपती हैं
  rationale: दोनों क्रियाओं की तीव्र, वर्तमानकालीन जोड़ी को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ
  rationale: यह वाक्यांश सामान्यतः संगति या साथ होने को व्यक्त करता है। हिन्दी का ‘उसके’ यूनानी सर्वनाम की लिंग-संबंधी अनियमितता को कृत्रिम ढंग से हल नहीं करता।
- source_word: ἄδικον οὐθέν
  choice: कुछ भी अन्यायपूर्ण नहीं
  rationale: यह यूनानी पदबंध के ‘कोई भी अन्यायपूर्ण वस्तु/बात नहीं’ वाले विशेषणात्मक बल को बनाए रखता है और अनावश्यक धर्मशास्त्रीय शब्दावली नहीं जोड़ता।
theological_decisions:
- issue: सत्य का आलंकारिक मानवीकरण
  choice: ‘उसे’ और ‘उसके’ द्वारा संदर्भ बनाए रखना
  alternative: सत्य को स्पष्टतः स्त्री रूप में व्यक्त करना
  rationale: ἀλήθεια यूनानी में स्त्रीलिंग है और उसके बाद स्त्रीलिंग सर्वनाम आता है, किंतु हिन्दी में ‘सत्य’ पुल्लिंग है। लिंग बदलकर कोई पृथक व्यक्तित्व या धर्मसैद्धांतिक दावा उत्पन्न करने के बजाय तटस्थ संकेतवाचक रूप मूल अलंकार को यथासंभव बनाए रखता है।
- issue: अंतिम सर्वनाम का संदर्भ
  choice: ‘उसके’ को संदर्भतः सत्य की ओर संकेत करने देना और पाठगत कठिनाई बताना
  alternative: सर्वनाम को किसी अन्य, अनुल्लिखित पुल्लिंग/नपुंसकलिंग संदर्भ से जोड़ना
  rationale: निकटवर्ती विषय सत्य ही है, पर यूनानी αὐτοῦ का रूप पूर्ववर्ती स्त्रीलिंग संदर्भ से मेल नहीं खाता। इसलिए अर्थ को सहज रखा गया है, जबकि असंगति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की काव्यात्मक विश्वव्यापकता तथा दोहराव सुरक्षित हैं। ‘सत्य को पुकारती है’ को अंग्रेज़ी परामर्श-पाठ के ‘सत्य को धन्य कहती है’ के बजाय यूनानी καλεῖ के आधार पर चुना गया है।
