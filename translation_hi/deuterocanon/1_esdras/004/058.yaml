lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: जब ... बाहर निकला
  rationale: यह कालवाचक उपवाक्य और घटनाक्रम दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ νεανίσκος
  choice: वह युवक
  rationale: νεανίσκος के लिए ‘युवक’ स्वाभाविक और पर्याप्त रूप से विशिष्ट है; इसमें ‘सेवक’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  choice: अपना मुख स्वर्ग की ओर उठाया
  rationale: यह प्रार्थना अथवा स्तुति के शारीरिक भाव को स्पष्ट रखते हुए यूनानी कृदन्त का स्वाभाविक हिन्दी रूप देता है।
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: यरूशलेम की ओर मुँह करके
  rationale: स्थान-संबंधी अभिमुखता को स्पष्ट करता है। वाक्य को स्वाभाविक बनाने के लिए इस वाक्यांश को ‘मुख स्वर्ग की ओर उठाया’ से पहले रखा गया है, बिना दोनों दिशात्मक संकेतों को एक-दूसरे में मिलाए।
- source_word: εὐλόγησεν
  choice: धन्य कहा
  rationale: परमेश्वर को उद्देश्य बनाकर प्रयुक्त εὐλογέω के बाइबलीय मुहावरे को बनाए रखता है। आधुनिक पाठक के लिए ‘स्तुति की’ निकट और स्पष्ट विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा को
  rationale: यूनानी संबंधवाचक रचना और परमेश्वर के लिए प्रयुक्त उपाधि दोनों को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की ओर निर्देशित εὐλόγησεν का अनुवाद
  choice: स्वर्ग के राजा को धन्य कहा
  alternative: स्वर्ग के राजा की स्तुति की
  rationale: ‘धन्य कहा’ स्रोत के बाइबलीय धार्मिक मुहावरे और उसकी अर्थगत बनावट को सुरक्षित रखता है; ‘स्तुति की’ वही भाव अधिक व्याख्यात्मक और सामान्य हिन्दी में व्यक्त करता है। पादटिप्पणी दोनों संभावनाओं को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख’ और ‘धन्य कहा’ जैसे शब्द बाइबलीय शैली का हल्का रंग बनाए रखते हैं, पर वाक्य-विन्यास वर्तमान मानक हिन्दी के अनुसार स्वाभाविक है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान और उसका विषय परस्पर असंगत था; यूनानी स्रोत के अनुसार यरूशलेम की ओर अभिमुखता मुख्य पाठ में स्पष्ट की गई है।
