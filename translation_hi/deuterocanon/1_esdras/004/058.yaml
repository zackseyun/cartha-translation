  text: And when the young man went out[a], lifting up his face toward heaven, in the direction of Jerusalem, he blessed the King of heaven[b],
translation:
  language: hi
  text: जब वह युवक बाहर निकला, तब उसने यरूशलेम की दिशा में स्वर्ग की ओर अपना मुख उठाया और स्वर्ग के राजा को धन्य कहा[a]।
  philosophy: optimal-equivalence
  footnotes:
