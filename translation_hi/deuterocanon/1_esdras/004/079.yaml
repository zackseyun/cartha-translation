  yaml_path: translation/deuterocanon/1_esdras/004/079.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: hi
  text: और उसने वे सभी पात्र वापस भेज दिए जिन्हें कुस्रू ने बाबुल में से अलग रखा था[a]। और कुस्रू ने जो कुछ करने को कहा था, वह सब उसने स्वयं भी करने और यरूशलेम भेजने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबुल में से अलग कर लिया था।” यूनानी क्रिया का अर्थ अलग करना, अलग रखना या हटा लेना हो सकता है; यहाँ आशय उन मन्दिर-पात्रों से है जिन्हें लौटाने के लिए अलग किया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: वापस भेज दिए
  rationale: क्रिया का मूल अर्थ ‘भेज देना’ है; कथा-संदर्भ में ये मन्दिर के पात्र यरूशलेम लौटाए जा रहे हैं, इसलिए ‘वापस’ दिशा को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: τὰ σκεύη
  choice: पात्र
  rationale: मन्दिर-संदर्भ में σκεύη उपासना में प्रयुक्त पात्रों या सामान को दर्शाता है। ‘पात्र’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी में बोधगम्य है।
- source_word: ἃ ἐχώρισεν
  choice: जिन्हें ... अलग रखा था
  rationale: χωρίζω अलग करने, अलग रखने या हटा लेने का अर्थ दे सकता है। यहाँ ‘अलग रखा’ वापसी के लिए वस्तुओं को पृथक किए जाने का अर्थ देता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀπὸ Βαβυλῶνος
  choice: बाबुल में से
  rationale: यह स्रोत अथवा स्थान से पृथक्करण को व्यक्त करता है; ‘बाबुल में से’ χωρίζω के साथ स्वाभाविक हिन्दी है।
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: कुस्रू ने जो कुछ करने को कहा था
  rationale: यह अनुवाद यूनानी अनन्त क्रिया ποιῆσαι को स्वाभाविक हिन्दी में व्यक्त करता है और εἶπεν को अनावश्यक रूप से अधिक प्रबल ‘आज्ञा दी’ नहीं बनाता।
- source_word: καὶ αὐτὸς
  choice: उसे भी उसने स्वयं
  rationale: ‘भी’ καί के योगात्मक बल और ‘स्वयं’ αὐτός के विशेष बल—दोनों को बनाए रखता है।
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: राजकीय अथवा प्रशासनिक आदेश के लिए यह स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: करने और यरूशलेम भेजने की
  rationale: दोनों समानान्तर अनन्त क्रियाओं—‘करना’ और ‘भेजना’—को बनाए रखता है और यरूशलेम को गन्तव्य के रूप में स्पष्ट करता है।
