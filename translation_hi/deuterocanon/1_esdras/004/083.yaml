  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘बाबुल के लिए निकल पड़ा’ शाब्दिक ‘बाहर गया’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि मूल की प्रस्थान-सूचना को सुरक्षित रखता है।
