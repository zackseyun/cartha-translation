  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: hi
  text: और उसने पत्र लिए, बाबुल के लिए निकल पड़ा और अपने सब भाइयों को बताया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यह स्पष्ट नहीं किया गया है कि उसने क्या बताया; बात प्रसंग से समझी जाती है।
    reason: मूल पाठ में ἀπήγγειλεν के साथ कोई स्पष्ट प्रत्यक्ष कर्म नहीं है, इसलिए उसकी अस्पष्टता बनाए रखी गई है।
lexical_decisions:
- source_word: ἔλαβεν
  choice: लिए
  rationale: λαμβάνω के सामान्य आख्यानात्मक अर्थ ‘लेना’ को रखा गया है; ‘प्राप्त किए’ भी संभव है, पर यहाँ आगे की कार्रवाइयों के क्रम में ‘लिए’ अधिक स्वाभाविक है।
- source_word: τὰς ἐπιστολάς
  choice: पत्र
  rationale: ἐπιστολή का सीधा और प्रसंगानुकूल अर्थ ‘पत्र’ है; बहुवचन का बोध ‘पत्र लिए’ में स्वाभाविक रूप से बना रहता है।
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: बाबुल के लिए निकल पड़ा
  rationale: ἐξῆλθεν की ‘निकलने’ की गति और εἰς Βαβυλῶνα की दिशा, दोनों को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: ἀπαγγέλλω का अर्थ ‘सूचित करना/समाचार देना/बताना’ हो सकता है। ‘बताया’ स्वाभाविक है और यूनानी में अनकहे प्रत्यक्ष कर्म को हिन्दी में भी अनकहा रहने देता है।
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: अपने सब भाइयों को
  rationale: ἀδελφοῖς का शाब्दिक पारिवारिक अर्थ ‘भाइयों’ रखा गया है; ‘अपने सब’ αὐτοῦ πᾶσιν को स्पष्ट और सहज ढंग से व्यक्त करता है।
