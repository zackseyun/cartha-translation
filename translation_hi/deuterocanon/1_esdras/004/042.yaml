base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “जो कुछ लिखा जा चुका है, उसके अतिरिक्त तुम जो भी चाहो, माँग लो[a], और हम तुम्हें वह देंगे, क्योंकि तुम अधिक बुद्धिमान पाए गए हो। तुम मेरे पास बैठोगे[b], और मेरे कुटुम्बी कहलाओगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ लिखा जा चुका है, उससे अधिक जो चाहो।” “लिखा जा चुका है” संभवतः पहले से लिखी या निर्धारित बातों अथवा पुरस्कारों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे बगल में बैठोगे।” यह अभिव्यक्ति राजदरबार में निकटता और सम्मान का पद सूचित करती है।
    reason: lexical_alternative
  - marker: c
    text: या, “मेरे संबंधी कहलाओगे।” यहाँ राजकीय कृपा और ऊँचे दर्जे का भाव है; आवश्यक नहीं कि वास्तविक रक्त-संबंध अभिप्रेत हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  choice: माँग लो
  rationale: प्रत्यक्ष राजकीय आमंत्रण/आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: जो कुछ लिखा जा चुका है, उसके अतिरिक्त तुम जो भी चाहो
  rationale: πλείω की अतिरिक्तता और τῶν γεγραμμένων के लिखित वादों अथवा पुरस्कारों के संभावित संकेत को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: δώσομέν σοι
  choice: हम तुम्हें वह देंगे
  rationale: यूनानी भविष्यकाल और राजकीय बहुवचन को सीधा तथा स्वाभाविक रूप देता है।
- source_word: ὃν τρόπον
  choice: क्योंकि
  rationale: इस प्रसंग में राजा की उदारता का कारण बताने वाले प्रयोग को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: εὑρέθης σοφώτερος
  choice: तुम अधिक बुद्धिमान पाए गए हो
  rationale: निष्क्रिय वाच्य और तुलनात्मक अर्थ दोनों सुरक्षित हैं; तुलना का आधार प्रसंग में निहित रहने दिया गया है।
- source_word: ἐχόμενός μου καθήσῃ
  choice: तुम मेरे पास बैठोगे
  rationale: ἐχόμενος + संबंधकारक के निकटता-सूचक अर्थ और राजसभा में सम्मानपूर्ण स्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συγγενής μου κληθήσῃ
  choice: मेरे कुटुम्बी कहलाओगे
  rationale: συγγενής के पारिवारिक संबंध और सम्मानसूचक दरबारी भाव को बनाए रखता है, पर वास्तविक रक्त-संबंध का दावा नहीं जोड़ता।
theological_decisions:
- issue: συγγενής में राजकीय पारिवारिक-सम्मान की भाषा
  choice: मेरे कुटुम्बी कहलाओगे
  alternative: मेरे संबंधी कहलाओगे
  rationale: ‘कुटुम्बी’ पारिवारिक निकटता और ऊँचे राजकीय दर्जे दोनों को व्यक्त करता है; ‘मित्र’ कहना यूनानी पाठ से परे अर्थ जोड़ता।
- issue: ἐχόμενός μου में निकट बैठने का सम्मान
  choice: मेरे पास बैठोगे
  alternative: मेरे बगल में बैठोगे
  rationale: ‘मेरे पास’ स्थानिक निकटता को सुरक्षित रखते हुए हिन्दी में गरिमापूर्ण है और शारीरिक सटाव का अनचाहा संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण राजदरबारी शैली। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, जबकि तुलनात्मक निष्क्रिय वाक्यांश और सामाजिक सम्मान की मूल अस्पष्टता सुरक्षित रखी गई है।
