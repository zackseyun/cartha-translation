  rationale: दोनों यूनानी शब्दों के संबंधपरक अर्थ और पुल्लिंग रूप को सीधे तथा स्वाभाविक हिंदी में रखा गया है।
- source_word: μετʼ οὐ πολὺ
  choice: थोड़ी ही देर बाद
  rationale: यह मुहावरा बहुत कम समय बीतने को व्यक्त करता है और पहले के मैत्रीपूर्ण व्यवहार से हिंसा की ओर तीखे परिवर्तन को बनाए रखता है।
- source_word: σπῶνται μαχαίρας
  choice: वे तलवारें खींच लेते हैं
  rationale: σπάω का μαχαίρας के साथ अर्थ तलवारों को खींचना या म्यान से निकालना है; हिंदी में यह संक्षिप्त और प्रचलित समतुल्य है।
