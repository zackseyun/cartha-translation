  choice: उन्हें ... की सुध नहीं रहती
  rationale: यूनानी क्रिया एकवचन में है, पर आगे की बहुवचन क्रियाएँ सामान्य रूप से शराब पीने वालों की ओर संकेत करती हैं। हिंदी में यह भावाभिव्यक्ति स्वाभाविक है और मद्यपान के समय विवेक या स्मरण खोने का अर्थ देती है।
