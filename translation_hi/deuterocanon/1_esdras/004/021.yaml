  yaml_path: translation/deuterocanon/1_esdras/004/021.yaml
  text: and they do not remember[a], while they are drinking, to show affection to friends and brothers, and before long they draw swords.
translation:
  language: hi
  text: और जब वे पीते हैं, तो उन्हें मित्रों और भाइयों के प्रति स्नेह दिखाने[a] की सुध नहीं रहती[b]; और थोड़ी ही देर बाद वे तलवारें खींच लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मित्रों और भाइयों के साथ मित्रवत व्यवहार करने।” यूनानी क्रिया व्यापक रूप से स्नेहपूर्ण या मित्रवत व्यवहार का अर्थ दे सकती है; यह केवल किसी शाब्दिक हाव-भाव को नहीं दर्शाती।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “सुध नहीं रहती” की क्रिया एकवचन में है, जबकि इसी वाक्य में पीने और तलवारें खींचने की क्रियाएँ बहुवचन में हैं। यहाँ इसे लोगों के बारे में सामान्य कथन के रूप में अनूदित किया गया है।
    reason: grammatical_ambiguity
