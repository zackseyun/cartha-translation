  yaml_path: translation/deuterocanon/1_esdras/004/024.yaml
  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
translation:
  language: hi
  text: और दूसरा व्यक्ति, जो राजा की शक्ति के बारे में बोल चुका था, बोलने लगा, “हे पुरुषों, क्या मनुष्य प्रबल नहीं हैं, जो धरती और समुद्र पर तथा उनमें जो कुछ है, उस सब पर अधिकार रखते हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: बोलने लगा
  rationale: ग्रीक आरंभसूचक मुहावरे को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ δεύτερος
  choice: दूसरा व्यक्ति
  rationale: क्रम में दूसरे वक्ता को स्पष्ट करता है; केवल ‘दूसरा’ भी संभव है, पर ‘व्यक्ति’ हिन्दी में संदर्भ को सहज बनाता है।
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: जिसने राजा के सामर्थ्य के विषय में कहा था
  rationale: पूर्वकालिक कृदंत का आशय बनाए रखता है और ἰσχύς के लिए ‘सामर्थ्य’ शक्ति तथा प्रभुत्व—दोनों की गुंजाइश रखता है।
- source_word: Ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: पुरुषों को किए गए प्रत्यक्ष संबोधन को गरिमापूर्ण और लिंग-सटीक रूप में रखता है।
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: क्या मनुष्य प्रबल नहीं हैं
  rationale: नकारात्मक आलंकारिक प्रश्न को सुरक्षित रखता है, जिसका अपेक्षित उत्तर ‘हाँ’ है; ὑπερισχύω के तुलनात्मक/विजयी बल को ‘प्रबल’ व्यक्त करता है।
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: जो धरती और समुद्र पर ... अधिकार रखते हैं
  rationale: वर्तमान कृदंत को संबंधसूचक उपवाक्य से स्वाभाविक हिन्दी में प्रस्तुत करता है और κατακρατέω के नियंत्रण/प्रभुत्व के अर्थ को बनाए रखता है, बिना स्पष्ट कारणसूचकता जोड़े।
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: उनमें जो कुछ है, उस सब पर
  rationale: धरती और समुद्र में स्थित समस्त वस्तुओं के समावेशी अर्थ को स्पष्ट और निकटता से व्यक्त करता है।
