    issue: The phrase for the requested reward is mildly awkward in Hindi.
    rationale: Reordering it as ‘जो कुछ लिखा गया है, उससे बढ़कर जो चाहे, माँग’ makes the imperative and its scope clear while retaining the source ambiguity concerning what was written.
