  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “जो कुछ लिखा गया है, उससे बढ़कर जो चाहे, माँग; और हम तुझे वह देंगे, क्योंकि तू अधिक बुद्धिमान पाया गया है। तू मेरे बगल में बैठेगा और मेरा संबंधी कहलाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείω τῶν γεγραμμένων
  choice: जो कुछ लिखा गया है, उससे बढ़कर
  rationale: तुलनात्मक अर्थ और पहले से लिखे गए वचनों/पुरस्कारों की ओर संकेत, दोनों को स्पष्ट और स्वाभाविक रूप में बनाए रखता है।
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: क्योंकि तू अधिक बुद्धिमान पाया गया है
  rationale: εὑρέθης के निष्क्रिय भाव और σοφώτερος के तुलनात्मक अर्थ को सुरक्षित रखता है; ὃν τρόπον यहाँ कारणसूचक रूप में समझा गया है।
- source_word: ἐχόμενός μου
  choice: मेरे पास
  rationale: स्थानिक निकटता का स्वाभाविक हिन्दी रूप; इसे पद या शासन-साझेदारी जैसे अधिक विशिष्ट अर्थ में नहीं बदला गया।
- source_word: συγγενής μου
  choice: मेरा संबंधी
  rationale: सगोत्रीय/परिजन का व्यापक अर्थ रखता है और किसी अधिक विशिष्ट पारिवारिक रिश्ते को आरोपित नहीं करता।
