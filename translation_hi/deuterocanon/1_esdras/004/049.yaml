  rationale: ἐπέρχομαι में केवल आने के बजाय विरोधी ढंग से चढ़ आने का भाव हो सकता है। यह अनुवाद द्वारों की मूल छवि और संभावित उत्पीड़न—दोनों को सुरक्षित रखता है।
