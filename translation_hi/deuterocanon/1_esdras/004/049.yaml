- source_word: πάντα δυνατὸν
  choice: कोई भी सामर्थी अधिकारी
  rationale: कठिन यूनानी पदबंध का शाब्दिक भाव ‘हर सामर्थी/शक्तिशाली व्यक्ति’ है। प्रशासनिक सूची के संदर्भ में ‘सामर्थी अधिकारी’ सत्ता और पद—दोनों संकेतों को बनाए रखता है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: σατράπην
