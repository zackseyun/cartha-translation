  yaml_path: translation/deuterocanon/1_esdras/004/060.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
translation:
  language: hi
  text: आप धन्य हैं, जिन्होंने मुझे बुद्धि दी; और हे पितरों के स्वामी[b], मैं आपका धन्यवाद करता हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं आपको स्वीकार करता हूँ’ अथवा ‘मैं आपकी स्तुति करता हूँ।’ यूनानी क्रिया खुले रूप से स्वीकार या अंगीकार करने का अर्थ दे सकती है; यहाँ प्रार्थना के संदर्भ में संभवतः धन्यवाद का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पितरों के सर्वाधिपति।’ यहाँ ‘स्वामी’ के लिए आया यूनानी शब्द δέσποτα है, जो सामान्यतः ‘प्रभु’ अनूदित होने वाले κύριος से अलग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: धन्य
  rationale: परमेश्वर को सीधे संबोधित करने वाले स्तुतिपरक कथन में यह यूनानी विशेषण ‘धन्य’ के अर्थ में है; यह ‘प्रशंसित’ की अपेक्षा मूल रूप को अधिक निकटता से रखता है।
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: जिन्होंने मुझे बुद्धि दी
  rationale: सम्बन्धवाचक उपवाक्य संबोधित व्यक्ति का वर्णन करता है। हिन्दी में ‘दी’ पूर्ण हो चुके वरदान को स्वाभाविक रूप से व्यक्त करता है, जिसका वर्तमान प्रार्थना में महत्त्व बना हुआ है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: σοφία का सामान्य और संदर्भानुकूल हिन्दी प्रतिशब्द ‘बुद्धि’ है।
- source_word: ὁμολογῶ
  choice: मैं आपका धन्यवाद करता हूँ
  rationale: ὁμολογέω का मूल अर्थ स्वीकार या अंगीकार करना हो सकता है, पर यहाँ σοὶ के साथ प्रार्थना के संदर्भ में यह खुले रूप से कृतज्ञता प्रकट करने का भाव रखता है।
- source_word: δέσποτα
  choice: स्वामी
  rationale: δέσποτα अधिकार और स्वामित्व सूचित करता है तथा κύριος से अलग शब्द है। ‘स्वामी’ इस भेद को हिन्दी में ‘प्रभु’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: τῶν πατέρων
  choice: पितरों के
  rationale: यूनानी पाठ में ‘हमारे’ नहीं है और πατέρων पुरुषवाचक बहुवचन है। ‘पितरों’ से पूर्वज पिताओं का आशय और मूल की लैंगिक अभिव्यक्ति दोनों बने रहते हैं।
theological_decisions:
- issue: परमेश्वर के लिए δέσποτα की उपाधि
  choice: स्वामी
  alternative: सर्वाधिपति; प्रभु
  rationale: ‘स्वामी’ अधिकार का भाव रखते हुए δέσποτα और κύριος के बीच का शब्दगत अंतर सुरक्षित रखता है; ‘प्रभु’ उस अंतर को मिटा देता।
- issue: πατέρων का पुरुषवाचक रूप
  choice: पितरों
  alternative: पूर्वजों
  rationale: ‘पितरों’ मूल के स्पष्ट पुरुषवाचक रूप और संभवतः कुलपिताओं अथवा पूर्वज पिताओं की ओर संकेत को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘पितरों’ सामान्य बातचीत की अपेक्षा कुछ अधिक शास्त्रीय है, पर यह मूल के पुरुषवाचक ‘पिताओं/पूर्वज पिताओं’ को संक्षेप और स्वाभाविक बाइबलीय हिन्दी में सुरक्षित रखता है। फुटनोट चिह्न अंग्रेज़ी परामर्श-पाठ के स्थानों के बजाय उनसे संबंधित वास्तविक यूनानी शब्दों के बाद लगाए गए हैं।
