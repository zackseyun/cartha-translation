  terminology: ‘स्थानीय शासकों’ suitably conveys τοπάρχαις without over-specifying a modern administrative office. ‘देवदार की लकड़ी,’ ‘यरूशलेम,’ and ‘नगर’ are appropriate. The historical regional names are standardized as ‘कोएले-सीरिया’ and ‘फोनीकिया.’
