  source_fidelity: 'The draft preserves the principal source features: letters are sent to the regional rulers in Coele-Syria and Phoenicia and to an unspecified group in Lebanon; cedar wood is to be transported from Lebanon to Jerusalem; and the stated building object is the city, not the temple. However, ‘फिर’ adds a sequential sense not expressed by καὶ, and ‘खोले-सूरिया’ is not an appropriate or recognizable Hindi rendering of the historical name Κοίλη Συρία.'
