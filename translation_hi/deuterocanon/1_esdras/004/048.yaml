base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: hi
  text: और उसने कोएले-सीरिया[a] और फोनीकिया के सभी स्थानीय शासकों[b] तथा लबानोन में रहने वालों को पत्र लिखे कि वे लबानोन से देवदार की लकड़ी यरूशलेम पहुँचाएँ, ताकि वे उसके साथ मिलकर नगर का निर्माण करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कोएले-सीरिया’ यूनानी पाठ में एक ऐतिहासिक क्षेत्र का नाम है।
    reason: cultural_note
  - marker: b
    text: या ‘जिला-शासकों’; यूनानी शब्द उन शासकों के लिए है जो किसी स्थानीय क्षेत्र या जिले पर अधिकार रखते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: स्थानीय शासकों
  rationale: यह शब्द किसी क्षेत्र या जिले पर अधिकार रखनेवाले अधिकारियों को सूचित करता है। ‘स्थानीय शासक’ आधुनिक हिन्दी में स्वाभाविक है और पद के क्षेत्रीय स्वरूप को बनाए रखता है।
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: खोले-सूरिया
  rationale: यह यूनानी पाठ में एक ऐतिहासिक क्षेत्र का नाम है; इसलिए इसे केवल ‘सूरिया’ करके सामान्यीकृत नहीं किया गया।
- source_word: Φοινίκῃ
  choice: फीनीके
  rationale: इस ऐतिहासिक क्षेत्र के यूनानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: लबानोन में जो लोग थे
  rationale: यूनानी यहाँ कोई पद दोहराए बिना व्यापक और कुछ हद तक अनिश्चित उल्लेख करता है। यह अनुवाद उस अनिश्चितता को बनाए रखता है और उन्हें अनावश्यक रूप से अधिकारी नहीं ठहराता।
- source_word: μεταφέρειν
  choice: पहुँचाएँ
  rationale: निर्माण-सामग्री को लबानोन से यरूशलेम ले जाने के निर्देश को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ξύλα κέδρινα
  choice: देवदार की लकड़ी
  rationale: यह निर्माण में प्रयुक्त देवदार की लकड़ी को दर्शाता है; हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: ὅπως οἰκοδομήσωσιν
  choice: ताकि वे ... निर्माण करें
  rationale: ὅπως के प्रयोजनार्थक बल और उसके साथ आए संभावनार्थक क्रियारूप को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ मिलकर
  rationale: सहभागिता का अर्थ स्पष्ट करता है, पर यह तय नहीं करता कि वह व्यक्ति स्वयं शारीरिक रूप से निर्माण करेगा या परियोजना को संरक्षण देगा।
- source_word: τὴν πόλιν
  choice: नगर
  rationale: यूनानी स्पष्ट रूप से ‘नगर’ कहता है। इसे संबंधित परंपराओं के आधार पर ‘मन्दिर’ या ‘परमेश्वर का भवन’ नहीं बनाया गया।
theological_decisions:
- issue: निर्माण-कार्य का विषय
  choice: नगर
  alternative: मन्दिर या परमेश्वर का भवन
  rationale: मूल यूनानी में τὴν πόλιν, अर्थात् ‘नगर’, स्पष्ट है। अन्य एज्रा-परंपराओं से सामंजस्य बैठाने के लिए इसे मन्दिर-निर्माण में नहीं बदला गया।
- issue: μετʼ αὐτοῦ में सहभागिता
  choice: उसके साथ मिलकर
  alternative: उसकी सहायता से / उसके लिए
  rationale: यूनानी वाक्यांश सहभागिता दर्शाता है, पर उसका सटीक व्यावहारिक स्वरूप नहीं बताता। सीधा अनुवाद इस खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ऐतिहासिक स्थान-नाम लिप्यंतरित किए गए हैं। वाक्य में ‘लबानोन में जो लोग थे’ मूल की अनिश्चितता बनाए रखता है, जबकि ‘नगर’ मूल पाठ का स्पष्ट आशय सुरक्षित करता है।
