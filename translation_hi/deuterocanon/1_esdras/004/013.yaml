    text: या “लिखित बात” अथवा “दस्तावेज़”; यूनानी γράμμα के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अर्थ केवल “पढ़ा” या कुछ प्रसंगों में “पढ़कर सुनाया” हो सकता है; यहाँ यह स्पष्ट नहीं है कि उसने ऊँचे स्वर में पढ़ा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη
  choice: जब राजा जागा
  rationale: ἐξηγέρθη रूप की दृष्टि से अओरिस्ट पैसिव है, पर यहाँ अकर्मक अर्थ में जागने या उठने के लिए प्रयुक्त हो सकता है। प्रसंग में “जागा” स्वाभाविक है और यह नहीं जोड़ता कि किसी ने राजा को जगाया।
- source_word: λαβόντες
  choice: उन्होंने ... लेकर
  rationale: अओरिस्ट कृदन्त को हिन्दी में पूर्वकालिक क्रिया “लेकर” से व्यक्त करने पर मूल क्रिया-क्रम और कथात्मक प्रवाह दोनों बने रहते हैं।
- source_word: τὸ γράμμα
  choice: वह पत्र
  rationale: γράμμα यहाँ राजा को सौंपे गए लिखित कथन या दस्तावेज़ को सूचित करता है। “पत्र” सहज और संक्षिप्त है; व्यापक अर्थों को पादटिप्पणी में रखा गया है।
- source_word: ἔδωκαν αὐτῷ
  choice: उसे दिया
  rationale: यह यूनानी पदबंध का सीधा रूप है। पिछले वाक्यांश से वस्तु स्पष्ट होने के कारण हिन्दी में उसे दोहराना आवश्यक नहीं है।
- source_word: ἀνέγνω
  choice: उसने उसे पढ़ा
  rationale: क्रिया का अर्थ “पढ़ना” है और कुछ प्रसंगों में “पढ़कर सुनाना” भी हो सकता है। यहाँ ऊँचे स्वर में पढ़ने की बात स्पष्ट नहीं है, इसलिए तटस्थ “पढ़ा” चुना गया है।
