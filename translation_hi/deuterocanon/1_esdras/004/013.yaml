  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: hi
  text: और जब राजा जागा, तब उन्होंने वह पत्र[a] लेकर उसे दिया, और उसने उसे पढ़ा[b]।
  philosophy: optimal-equivalence
  footnotes:
