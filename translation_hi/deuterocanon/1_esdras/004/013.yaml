  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। सर्वनामों और क्रिया-क्रम को स्वाभाविक बनाया गया है, जबकि यूनानी पाठ की अर्थगत अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने संबंधित शब्दों पर नहीं थे; हिन्दी मसौदे में [a] को “पत्र” और [b] को “पढ़ा” के साथ सही स्थान पर रखा गया है।
