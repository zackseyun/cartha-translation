  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
translation:
  language: hi
  text: कि वे ऊपर जाकर यरूशलेम और उस मंदिर को फिर से बनाएँ, जिस पर उसका नाम रखा गया था[a]; और उन्होंने सात दिन तक संगीत और आनंद के साथ उत्सव मनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप में: ‘जो उसके नाम से कहलाता है।’'
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त दुर्लभ क्रिया का अर्थ ‘उत्सवी आनंद मनाना’ या ‘उल्लास के साथ उत्सव मनाना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: ऊपर जाकर
  rationale: यह यरूशलेम जाने के लिए प्रयुक्त बाइबलीय भौगोलिक मुहावरे को सुरक्षित रखता है; इसे केवल ‘लौटना’ मानकर अर्थ सीमित नहीं किया गया।
- source_word: οἰκοδομῆσαι
  choice: फिर से बनाएँ
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है, पर विनाश के बाद यरूशलेम और मंदिर की पुनर्स्थापना के संदर्भ में ‘फिर से बनाना’ उसका आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ ἱερὸν
  choice: मंदिर
  rationale: यहाँ शब्द मंदिर-परिसर को सूचित करता है; आधुनिक हिन्दी में ‘मंदिर’ सबसे सहज और स्पष्ट शब्द है।
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: जिस पर उसका नाम पुकारा गया था
  rationale: यह अनुवाद यूनानी में सुरक्षित सामी नामकरण-सूत्र को बनाए रखता है और उसे केवल स्वामित्व अथवा नामकरण की व्याख्या में नहीं बदलता। अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐκωθωνίζοντο
  choice: उत्सव मनाया
  rationale: दुर्लभ क्रिया उल्लासपूर्ण उत्सवी आयोजन को सूचित करती है। ‘उत्सव मनाया’ नकारात्मक उच्छृंखलता का भाव जोड़े बिना अर्थ देता है; वैकल्पिक बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: μετὰ μουσικῶν
  choice: संगीत के साथ
  rationale: यूनानी रूप संगीत, संगीतकारों या वाद्य-संगति की ओर संकेत कर सकता है। ‘संगीत के साथ’ स्वाभाविक है और अनावश्यक रूप से किसी एक विकल्प को निश्चित नहीं करता।
- source_word: χαρᾶς
  choice: आनंद
  rationale: यह उत्सव के प्रसंग में χαρά का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन तक
  rationale: यह अवधि को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मंदिर पर परमेश्वर के नाम का पुकारा जाना
  choice: जिस पर उसका नाम पुकारा गया था
  alternative: जो उसके नाम से कहलाता है
  rationale: मूल पाठ के पारंपरिक दैवी-नाम सूत्र और उसकी धर्मवैचारिक गूंज को सुरक्षित रखा गया है। इसे केवल मंदिर के नाम या परमेश्वर के शाब्दिक निवास के बारे में स्पष्ट कथन बनाकर तनाव का समाधान नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऊपर जाकर’ और दैवी-नाम सूत्र जैसे मूल-पाठ के विशिष्ट मुहावरों को जहाँ संभव हो सुरक्षित रखा गया है; कठिन स्थानों पर पादटिप्पणियाँ दी गई हैं।
