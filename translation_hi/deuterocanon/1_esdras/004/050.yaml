  text: और जिस समस्त भूभाग पर उनका अधिकार होगा, वह उनके लिए कर-मुक्त रहे[a]; और कसदी लोग यहूदियों के उन गाँवों को छोड़ दें, जिन्हें वे अपने अधिकार में रखे हुए हैं।
