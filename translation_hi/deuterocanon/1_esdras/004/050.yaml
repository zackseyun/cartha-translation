lexical_decisions:
- source_word: χώραν
  choice: भूभाग
  rationale: χώρα यहाँ भूमि, क्षेत्र या प्रदेश को दर्शाता है। ‘भूभाग’ प्रशासनिक और भौगोलिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे किसी निश्चित राजनीतिक इकाई तक सीमित किए।
- source_word: κρατήσουσιν
  choice: उनका अधिकार होगा
  rationale: κρατέω भूमि पर अधिकार, कब्ज़ा या नियंत्रण रखने का भाव देता है। भविष्यकालीन रूप को बनाए रखते हुए ‘अधिकार होगा’ अनावश्यक रूप से अवैध कब्ज़े का संकेत नहीं देता।
- source_word: ἀφορολόγητον
  choice: कर-मुक्त
  rationale: यह विशेषण कर या राजस्व से छूट को सीधे व्यक्त करता है। ‘कर-मुक्त’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ὑπάρχειν
  choice: रहे
  rationale: आज्ञप्ति-सदृश आश्रित रचना में ὑπάρχειν किसी स्थिति के होने या बने रहने को दर्शाता है; ‘रहे’ हिन्दी में इस विधिक निर्देश को स्वाभाविक बनाता है।
- source_word: Χαλδαῖοι
  choice: कसदी लोग
  rationale: यूनानी में स्पष्ट रूप से Χαλδαῖοι है। ‘कसदी लोग’ पारंपरिक और सीधा जातिनाम है; ‘बाबिली’ कहना अधिक व्याख्यात्मक होता।
- source_word: ἀφίουσι
  choice: छोड़ दें
  rationale: ἀφίημι यहाँ गाँवों पर अपना अधिकार छोड़ने या उनसे हट जाने का भाव देता है। ‘छोड़ दें’ आदेशात्मक संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: κώμας
  choice: गाँवों
  rationale: κώμη सामान्यतः गाँव या ग्रामीण बस्ती है; ‘गाँव’ इसका सबसे सीधा और सामान्य हिन्दी रूप है।
- source_word: διακρατοῦσιν
  choice: अपने अधिकार में रखे हुए हैं
  rationale: διακρατέω लगातार दृढ़तापूर्वक अधिकार या नियंत्रण बनाए रखने को दर्शाता है। यह वाक्यांश उस निरंतर नियंत्रण को व्यक्त करता है और ‘कब्ज़ा’ शब्द से जुड़ी अतिरिक्त वैधानिक धारणा से बचता है।
