  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: hi
  text: तब राजा दारा उठ खड़ा हुआ और उसने उसे चूमा। उसने उसके लिए सभी प्रबंधकों, प्रांतीय शासकों, सेनापतियों और क्षत्रपों को पत्र लिखे कि वे उसे और उसके साथ यरूशलेम का पुनर्निर्माण करने के लिए जा रहे सभी लोगों को आगे भेजें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν
  choice: उसे चूमा
  rationale: क्रिया स्नेहपूर्ण या गहन चुंबन का संकेत दे सकती है, पर हिन्दी में भाव को बढ़ाए बिना सरल और स्वाभाविक रूप रखा गया है।
- source_word: οἰκονόμους
  choice: प्रबंधकों
  rationale: यहाँ राजकीय संसाधनों या कामकाज की देखरेख करने वाले अधिकारियों का बोध है; ‘प्रबंधक’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τοπάρχας
  choice: प्रांतीय शासकों
  rationale: स्थानीय भूभागों पर शासन करने वाले अधिकारियों के लिए सुबोध प्रशासनिक पद चुना गया है।
- source_word: σατράπας
  choice: क्षत्रपों
  rationale: फ़ारसी साम्राज्य के विशिष्ट उच्च प्रांतीय पद को ऐतिहासिक शब्द ‘क्षत्रप’ से सुरक्षित रखा गया है।
- source_word: προπέμψωσιν
  choice: यात्रा में सहायता देकर आगे भेजें
  rationale: यूनानी क्रिया में विदाई देने के साथ यात्रा के लिए सहायता, प्रबंध या सुरक्षित आगे बढ़ाने का भाव हो सकता है; यह अभिव्यक्ति उस व्यापकता को बनाए रखती है।
- source_word: ἀναβαίνοντας
  choice: जा रहे
  rationale: यरूशलेम की ओर ‘ऊपर जाने’ का स्रोतगत मुहावरा हिन्दी में केवल ‘जा रहे’ कहकर स्वाभाविक बनाया गया है, बिना यात्रा की दिशा पर अनावश्यक जोर दिए।
- source_word: οἰκοδομῆσαι
  choice: पुनर्निर्माण करने
  rationale: शाब्दिक अर्थ ‘निर्माण करना’ है, किंतु उजड़े हुए यरूशलेम को फिर से बनाने के कथात्मक संदर्भ में ‘पुनर्निर्माण’ आशय को स्पष्ट करता है।
theological_decisions:
- issue: यरूशलेम को ‘बनाना’ या उसका ‘पुनर्निर्माण करना’
  choice: पुनर्निर्माण करना
  alternative: निर्माण करना
  rationale: यूनानी क्रिया अपने आप में ‘निर्माण’ कहती है, पर कथा पहले से विद्यमान और नष्ट नगर की बहाली से संबंधित है; ‘पुनर्निर्माण’ कोई अतिरिक्त सांप्रदायिक अर्थ जोड़े बिना ऐतिहासिक संदर्भ व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य रखा गया है। राजकीय पदों में सामान्य पाठक की समझ के लिए ‘प्रबंधक’ और ‘प्रांतीय शासक’ प्रयुक्त हैं, जबकि ऐतिहासिक रूप से विशिष्ट ‘क्षत्रप’ सुरक्षित रखा गया है।
