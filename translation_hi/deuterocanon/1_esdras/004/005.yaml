  text: हममें से हर एक एक ऐसी बात कहे जो प्रबल सिद्ध हो[a]; और जिसकी बात दूसरे की बात से अधिक बुद्धिमानी भरी दिखाई दे, उसे राजा दारा बड़े-बड़े उपहार और विजय के बड़े सम्मान देगा[b],
  philosophy: optimal-equivalence
