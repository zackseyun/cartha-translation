  rationale: ὑπερισχύω में दूसरों पर भारी पड़ने अथवा अधिक शक्तिशाली सिद्ध होने का भाव है; प्रतियोगिता के संदर्भ में यह हिन्दी स्पष्ट और स्वाभाविक है।
- source_word: φανῇ
