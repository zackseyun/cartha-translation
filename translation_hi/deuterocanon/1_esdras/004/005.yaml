- source_word: τὸ ῥῆμα αὐτοῦ
  choice: जिसकी बात
  rationale: ῥῆμα यहाँ कही गई बात या कथन है। हिन्दी में ‘बात’ सहज है और पहले λόγος के साथ मूल की निकटार्थक पुनरावृत्ति को भी बनाए रखता है।
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: दूसरे की बात से अधिक बुद्धिमानी की
  rationale: तुलनात्मक अर्थ और दूसरे प्रतियोगी के कथन की मूल में निहित पुनःपूर्ति को हिन्दी में स्पष्ट करता है।
- source_word: Δαρεῖος ὁ βασιλεὺς
  choice: राजा दारा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप लेते हुए यूनानी पदक्रम को स्वाभाविक हिन्दी में रखा गया है।
- source_word: δωρεὰς μεγάλας
  choice: बड़े-बड़े उपहार
  rationale: δωρεά के वास्तविक उपहार के अर्थ को बनाए रखता है और बहुवचन तथा μεγάλας के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπινίκια μεγάλα
  choice: विजय के बड़े सम्मान
  rationale: ἐπινίκια विजेता को मिलने वाले सम्मान या पुरस्कारों का द्योतक है। यह अनुवाद विजय-संबंधी अर्थ बनाए रखते हुए केवल भौतिक पुरस्कार का अर्थ नहीं थोपता।
