    text: “एक बात” का अनुवाद “एक कथन” या “एक तर्क” भी हो सकता है; यूनानी λόγον संक्षिप्त है और प्रतियोगिता में रखे गए प्रस्ताव या तर्क को सूचित कर सकता है।
    reason: lexical_alternative
