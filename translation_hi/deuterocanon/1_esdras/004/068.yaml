base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: hi
  text: 'और अब, हे महाराज, मैं यही माँगता हूँ और आपसे यही निवेदन करता हूँ; और आपकी ओर से यही महान कृपा है: इसलिए मैं विनती करता हूँ कि जिस मन्नत को मैंने स्वर्ग के राजा के सामने आपके मुख से पूरा करवाने की मानी थी, उसे पूरा करें।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मन्नत को करें’; अर्थात जो मन्नत मानी गई थी, उसे कार्यान्वित या पूरा करें।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपने मुख से’; अर्थात अपनी कही हुई आज्ञा या स्वीकृति के द्वारा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ
  choice: मैं यही माँगता हूँ
  rationale: राजदरबार में की गई विनती के संदर्भ में यह अधिकार जताने या माँग पर अड़ने के बजाय आदरपूर्वक माँगने का भाव व्यक्त करता है।
- source_word: αἰτοῦμαί
  choice: आपसे यही निवेदन करता हूँ
  rationale: ἀξιῶ के साथ आए आलंकारिक दोहराव को बनाए रखते हुए औपचारिक और विनम्र याचना का भाव देता है।
- source_word: ἡ μεγαλωσύνη ἡ παρὰ σοῦ
  choice: आपकी ओर से यही महान कृपा होगी
  rationale: παρὰ σοῦ राजा की ओर से मिलने वाली किसी महान उदारता या अनुग्रह की ओर संकेत करता है; केवल राजा के अमूर्त ‘महान प्रताप’ की ओर नहीं।
- source_word: δέομαι
  choice: मैं विनती करता हूँ
  rationale: यह साधारण माँग से अधिक प्रबल आग्रह है, पर आधुनिक हिन्दी में सम्मानपूर्ण दरबारी स्वर बनाए रखता है।
- source_word: ποιήσῃς τὴν εὐχὴν ἣν ηὐξάμην
  choice: जिस मन्नत को मैंने ... माना था, उसे ... पूरा करें
  rationale: εὐχή और ηὐξάμην की सजातीय रचना यहाँ सामान्य प्रार्थना से अधिक मन्नत का संकेत देती है। ‘मन्नत पूरी करना’ यूनानी ‘मन्नत को करना’ का स्वाभाविक हिन्दी मुहावरा है।
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा के सामने
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण उपाधि को सुरक्षित रखता है; हिन्दी में मन्नत मानने के साथ ‘के सामने’ स्वाभाविक संबंध व्यक्त करता है।
- source_word: ἐκ στόματός σου
  choice: अपने मुख के वचन से
  rationale: ‘आपके मुख से’ की ठोस छवि बनाए रखते हुए संदर्भगत अर्थ—राजा की कही हुई आज्ञा या स्वीकृति—को स्पष्ट करता है।
theological_decisions:
- issue: ‘स्वर्ग के राजा’ का संदर्भ
  choice: पृथ्वी के राजा से भिन्न, परमेश्वर के लिए प्रयुक्त दिव्य उपाधि
  alternative: सामान्य अर्थ में कोई स्वर्गीय राजा
  rationale: यहूदी राजदरबारी संदर्भ में यह परमेश्वर के लिए श्रद्धापूर्ण पदवी है।
- issue: εὐχή / ηὐξάμην का अर्थ
  choice: मन्नत की भाषा
  alternative: सामान्य प्रार्थना की भाषा
  rationale: संज्ञा और सजातीय क्रिया का मेल किसी मानी हुई मन्नत की ओर प्रबल संकेत करता है, यद्यपि εὐχή अपने आप में प्रार्थना भी व्यक्त कर सकता है।
- issue: राजा द्वारा मन्नत पूरी करने का आशय
  choice: राजा अपनी मौखिक आज्ञा अथवा स्वीकृति से उसके पूरा होने को संभव करे
  alternative: राजा स्वयं उस मन्नत का व्रती हो और उसे व्यक्तिगत रूप से पूरा करे
  rationale: ἐκ στόματός σου राजकीय वचन या प्राधिकरण की ओर संकेत करता है; पाठ यह नहीं कहता कि मन्नत मूलतः राजा ने मानी थी।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण राजदरबारी स्वर रखा गया है। ‘हे प्रभु राजा’ संबोधन की औपचारिकता सुरक्षित करता है; ‘महान कृपा’ सामान्य पाठक के लिए ‘महानता’ की अपेक्षा प्रसंगानुकूल और स्पष्ट है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
