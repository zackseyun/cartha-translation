  text: 'और उन्होंने उनसे कहा, “जो लिखा गया है, उसके विषय में हमें बताओ।” तब पहले व्यक्ति ने—जिसने मदिरा की शक्ति[a] के विषय में कहा था—बोलना आरम्भ किया और इस प्रकार कहा:'
  philosophy: optimal-equivalence
