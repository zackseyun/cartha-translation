- source_word: Ἀπαγγείλατέ
  choice: हमें बताओ
  rationale: बहुवचन आज्ञार्थक क्रिया औपचारिक रूप से सूचना देने या घोषणा करने का भाव रखती है। ‘हमें बताओ’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में सार्वजनिक उत्तर देने का भाव बनाए रखती है।
- source_word: περὶ τῶν γεγραμμένων
  choice: जो लिखा गया है, उसके विषय में
  rationale: यह अनुवाद περὶ को स्पष्ट रखता है और γεγραμμένων के पूर्ण निष्क्रिय, परिणामसूचक भाव को बिना लेखक को निर्धारित किए व्यक्त करता है।
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: पहले व्यक्ति ने—जिसने … कहा था—
  rationale: दोनों सव्यंजक पदबंधों को बनाए रखते हुए यह हिन्दी में स्पष्ट करता है कि प्रतियोगियों में पहला व्यक्ति वही था जिसने पहले मदिरा के विषय में कथन किया था।
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: मदिरा की शक्ति के विषय में
  rationale: ἰσχύς के लिए ‘शक्ति’ उसके बल, सामर्थ्य और प्रभाव की व्यापक अर्थ-सीमा को उपयुक्त रूप से व्यक्त करता है; οἶνος के लिए ‘मदिरा’ आधुनिक, dignified और सामान्य हिन्दी है।
- source_word: ἤρξατο … καὶ ἔφη οὕτως
  choice: 'बोलना आरम्भ किया। उसने इस प्रकार कहा:'
  rationale: ग्रीक में ‘आरम्भ किया’ के पूरक का लोप हिन्दी में अस्वाभाविक होता; ‘बोलना’ उसे स्वाभाविक बनाता है। ‘इस प्रकार कहा’ οὕτως की भूमिका को प्रत्यक्ष कथन की प्रस्तावना के रूप में सुरक्षित रखता है।
