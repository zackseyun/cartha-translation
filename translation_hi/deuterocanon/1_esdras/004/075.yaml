base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: hi
  text: और बाबुल प्रदेश[a] से नगर बनाने के लिए चढ़कर जाने वाले सभी लोगों को—उन्हें और उनकी संतानों को—स्वतंत्रता[b] मिले, और चढ़कर जाने वाले सभी याजकों को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ बाबुल नगर का नहीं, बाबुल प्रदेश का नाम है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का शाब्दिक भाव है, “स्वतंत्रता उनकी हो।” इस संदर्भ में इसका आशय किसी प्रशासनिक दायित्व से छूट भी हो सकता है, पर पद उसका सटीक स्वरूप नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: चढ़कर जाने वाले सभी लोगों को
  rationale: πᾶσιν के साथ कृदंत का अर्थ ‘उन सभी को जो…’ है। वापसी और यरूशलेम की ओर भौगोलिक चढ़ाई के प्रसंग में ‘चढ़कर जाना’ मूल अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: बाबुल प्रदेश से
  rationale: यूनानी पाठ में नगर Βαβυλών नहीं, बल्कि क्षेत्र Βαβυλωνία है। ‘बाबुल प्रदेश’ सामान्य पाठक के लिए परिचित रहते हुए इस भेद को स्पष्ट करता है।
- source_word: κτίσαι τὴν πόλιν
  choice: नगर बनाने के लिए
  rationale: κτίζω का अर्थ बनाना, बसाना या स्थापित करना हो सकता है। पुनर्स्थापना के प्रसंग में ‘फिर से बनाना’ संभव है, पर मूल पाठ केवल ‘बनाना’ कहता है; इसलिए अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: स्वतंत्रता मिले
  rationale: यह अनंत-क्रिया वाली रचना आज्ञप्ति की विषय-वस्तु बताती है—स्वतंत्रता उनका अधिकार हो। ‘स्वतंत्रता मिले’ हिन्दी में स्वाभाविक है और यूनानी भाव को बिना अनावश्यक कानूनी विशिष्टता के व्यक्त करता है।
- source_word: ἐλευθερίαν
  choice: स्वतंत्रता
  rationale: ἐλευθερία का सामान्य अर्थ स्वतंत्रता या आज़ादी है। प्रशासनिक संदर्भ में इसमें कुछ दायित्वों से छूट शामिल हो सकती है, पर इस पद में उसका सटीक कानूनी दायरा नहीं बताया गया।
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: उन्हें और उनकी संतानों को
  rationale: सम्प्रदान कारक स्वतंत्रता पाने वालों को दर्शाता है। ‘संतान’ τέκνα को लिंग-विशेष तक सीमित किए बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: और चढ़कर जाने वाले सभी याजकों को भी
  rationale: अंतिम वाक्यांश उसी अनुदान को चढ़कर जाने वाले याजकों तक बढ़ाता है। ‘भी’ हिन्दी में इस समावेश को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: दी गई ἐλευθερία का स्वरूप
  choice: इसे व्यापक अर्थ में ‘स्वतंत्रता’ कहा गया है, बिना किसी निश्चित कानूनी विशेषाधिकार का नाम दिए।
  alternative: इसे ‘करों से छूट’, ‘नागरिक उन्मुक्ति’ या किसी अन्य विशिष्ट प्रशासनिक अधिकार के रूप में समझना।
  rationale: पद स्वतंत्रता दिए जाने की बात तो करता है, लेकिन उसके प्रशासनिक दायरे को परिभाषित नहीं करता। व्यापक शब्द मूल की अस्पष्टता बनाए रखता है और पाठ में न कही गई कानूनी व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘चढ़कर जाने वाले’ बाइबलीय-भौगोलिक चढ़ाई का संकेत सुरक्षित रखता है; ‘याजक’ धार्मिक पद के लिए प्रचलित हिन्दी बाइबलीय शब्द है। डैश से यह स्पष्ट किया गया है कि ‘उन्हें और उनकी संतानों को’ उन्हीं लौटने वालों की व्याख्या करता है।
