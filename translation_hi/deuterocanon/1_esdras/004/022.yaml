- source_word: ἐγερθῶσιν
  choice: जागते हैं
  rationale: यहाँ क्रिया का अर्थ मदिरा-जनित अचेतनता या नींद के बाद जागने से है; ‘उठते हैं’ की अपेक्षा ‘जागते हैं’ प्रसंग को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐ μέμνηται
  choice: उन्हें याद नहीं रहता
  rationale: स्रोत-पाठ में क्रियारूप एकवचन है, जबकि कर्ता बहुवचन है; अर्थ को सामूहिक अथवा वितरणात्मक मानते हुए स्वाभाविक हिन्दी बहुवचन-संगति अपनाई गई है।
- source_word: ἃ ἔπραξαν
  choice: कि उन्होंने क्या किया था
  rationale: यह सापेक्ष उपवाक्य का सहज हिन्दी रूप है; पूर्ण भूतकाल जागने से पहले किए गए कामों का समय-संबंध स्पष्ट करता है।
