  text: और दूसरा अपनी बुद्धि के कारण दारा के साथ बैठेगा[a], और दारा का संबंधी[b] कहलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दारा के पास बैठेगा” या “दारा के साथ आसन ग्रहण करेगा।” यूनानी क्रिया का मूल अर्थ बैठना या आसन ग्रहण करना है; राजदरबार के प्रसंग में दारा के निकट बैठना सम्मानित स्थान का संकेत हो सकता है।
