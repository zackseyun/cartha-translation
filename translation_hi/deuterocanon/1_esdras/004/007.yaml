- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप है; इससे यह खुला रहता है कि संबोधन औपचारिक पदवी है या सामान्य मान्यता।
