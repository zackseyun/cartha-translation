  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich.
translation:
  language: hi
  text: यह राजा और अनाथ की सोच को एक कर देती है[a], दास और स्वतंत्र व्यक्ति की सोच को भी, और निर्धन और धनी की सोच को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक सहज रूप में: “यह राजा और अनाथ को एक जैसा सोचने पर लाती है, और दास और स्वतंत्र व्यक्ति को, और निर्धन और धनी को भी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: कर देती है
  rationale: यह वर्तमान काल में किसी अवस्था को उत्पन्न करने का सामान्य क्रियात्मक अर्थ देता है। निकटवर्ती संदर्भ में इसका कर्ता स्त्रीलिंग होने के कारण हिन्दी में स्त्रीलिंग क्रिया रखी गई है।
- source_word: τὴν διάνοιαν μίαν
  choice: सोच को एक
  rationale: διάνοια मन, विचार या सोच को सूचित कर सकता है; μίαν के साथ यहाँ अलग-अलग सामाजिक स्थितियों के लोगों की सोच एक जैसी हो जाने पर बल है। यह रूपक को बनाए रखते हुए हिन्दी में सहज है।
- source_word: βασιλέως
  choice: राजा
  rationale: यह शब्द सामान्यतः ‘राजा’ का अर्थ देता है; इसे व्यापक अर्थ ‘शासक’ करने का कोई आवश्यक संदर्भगत कारण नहीं है।
- source_word: ὀρφανοῦ
  choice: अनाथ
  rationale: ὀρφανός के लिए आधुनिक हिन्दी का स्वाभाविक और व्यापक समतुल्य ‘अनाथ’ है।
- source_word: οἰκέτου
  choice: दास
  rationale: οἰκέτης घरेलू सेवक या दास को सूचित कर सकता है; ἐλευθέρου के साथ स्पष्ट सामाजिक-विधिक विरोध के कारण ‘दास’ अधिक उपयुक्त है।
- source_word: ἐλευθέρου
  choice: स्वतंत्र व्यक्ति
  rationale: यह दास के विपरीत स्वतंत्र स्थिति वाले व्यक्ति को सूचित करता है। केवल ‘स्वतंत्र’ की अपेक्षा ‘स्वतंत्र व्यक्ति’ हिन्दी में अधिक स्पष्ट है।
- source_word: πένητος
  choice: निर्धन
  rationale: यह गरीब या जरूरतमंद व्यक्ति को सूचित करता है। ‘निर्धन’ गरिमापूर्ण आधुनिक हिन्दी में अगले विपरीत पद के साथ संक्षिप्त समानांतर बनाता है।
- source_word: πλουσίου
  choice: धनी
  rationale: यह ‘निर्धन’ का स्वाभाविक विपरीत है और यूनानी की संक्षिप्त समांतर संरचना बनाए रखता है।
theological_decisions:
- issue: पद में विभिन्न सामाजिक स्थितियों के लोगों की सोच को एक करने की बात है, पर इसका कर्ता और तंत्र इस पद के भीतर स्पष्ट नहीं किया गया।
  choice: सामाजिक विरोधी युग्मों को सीधे प्रस्तुत किया गया और ‘सोच को एक’ की अभिव्यक्ति बनाए रखी गई।
  alternative: ‘राजा और अनाथ को एक जैसा सोचने पर विवश कर देती है’ जैसी अधिक मुहावरेदार व्याख्या।
  rationale: यूनानी अलग-अलग सामाजिक स्थितियों को समान मानसिक दशा में लाने की बात कहता है। संयत अनुवाद अलंकार और संभावित अर्थ-विस्तार को बचाता है तथा कोई अतिरिक्त धर्मवैज्ञानिक कारण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दास—स्वतंत्र व्यक्ति’ तथा ‘निर्धन—धनी’ में यूनानी के सामाजिक विरोध और लय को सुरक्षित रखा गया है।
