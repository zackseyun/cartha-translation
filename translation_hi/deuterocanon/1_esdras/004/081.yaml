lexical_decisions:
- source_word: Παρά σοῦ
  choice: तेरी ही ओर से
  rationale: παρά + संबंधकारक यहाँ स्रोत को व्यक्त करता है। ‘तेरी ही ओर से’ विजय और बुद्धि के उसी से आने का भाव तथा बलाघात दोनों बनाए रखता है।
- source_word: νίκη
  choice: विजय
  rationale: यह νίκη का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ἡ σοφία
  choice: बुद्धि
  rationale: σοφία यहाँ सामान्य अर्थ में ज्ञानयुक्त समझ या बुद्धि को दर्शाता है; ‘बुद्धि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: σὴ ἡ δόξα
  choice: महिमा तेरी ही है
  rationale: यह अधिकारसूचक बलाघात को सुरक्षित रखते हुए हिन्दी में स्वाभाविक विधेयात्मक रचना देता है।
- source_word: οἰκέτης
  choice: सेवक
  rationale: οἰκέτης विशेष रूप से घराने के सेवक को सूचित करता है। मुख्य पाठ में ‘सेवक’ अधिक सहज है, जबकि विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: द्वितीय पुरुष संबोधन का संदर्भ
  choice: ‘तेरी/तेरा’ के सीधे संबोधन को बिना संबोधित व्यक्ति की पहचान बताए रखा गया है।
  alternative: इसे स्पष्ट रूप से परमेश्वर अथवा तत्कालीन कथानक के राजा के प्रति संबोधन बताना।
  rationale: इस उपवाक्य में यूनानी पाठ संबोधित व्यक्ति का नाम नहीं देता; इसलिए अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। एकवचन निकट संबोधन ‘तेरी/तेरा’ मूल यूनानी के सीधे द्वितीय पुरुष एकवचन को दर्शाता है; ‘ही’ मूल के दोहराए गए और अधिकारसूचक बलाघात को व्यक्त करता है।
