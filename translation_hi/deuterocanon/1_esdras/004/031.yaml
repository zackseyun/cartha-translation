  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: hi
  text: और इसके अलावा, राजा मुँह खोले हुए उसे टकटकी लगाकर देखता रहता था।[a] अगर वह उस पर हँसती है, तो वह हँसता है;[b] पर अगर वह उससे नाराज़ हो जाती है, तो वह उसकी खुशामद करता है, ताकि वह उससे मेल कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में चित्र बहुत सजीव है; शाब्दिक रूप से, “राजा मुँह खोले हुए उसे देखता रहता था।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद यह भी हो सकता है, “यदि वह उसके साथ हँसती, तो वह भी हँसता।” ‘हँसती’ के बाद आया यूनानी दत्तिव एक से अधिक अर्थों में समझा जा सकता है।
    reason: lexical_alternative
