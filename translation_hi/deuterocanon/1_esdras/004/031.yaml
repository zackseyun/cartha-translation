  rationale: दोनों बार आए γελάω को ‘हँसना’ ही रखा गया है। αὐτῷ का दत्तिव ‘उस पर’ अथवा ‘उसके साथ/उसकी ओर देखकर’ समझा जा सकता है; इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: वह उससे नाराज़ हो जाती
  rationale: संबंधपरक प्रसंग में निष्क्रिय πικρανθῇ का भाव उसके प्रति कटु या अप्रसन्न होने का है; ‘नाराज़’ सामान्य आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: κολακεύει αὐτὴν
  choice: वह उसकी खुशामद करता
  rationale: κολακεύω चापलूसी या खुशामद करके किसी को प्रसन्न करने का अर्थ देता है; ‘खुशामद’ दृश्य में राजा के मनाने वाले व्यवहार को स्पष्ट रखता है।
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: ताकि वह उससे फिर मेल कर ले
  rationale: ὅπως उद्देश्य बताता है और διαλλαγῇ टूटे संबंध के फिर सुधरने को; ‘फिर मेल कर ले’ स्वाभाविक हिन्दी में पारस्परिक संबंध की बहाली व्यक्त करता है।
