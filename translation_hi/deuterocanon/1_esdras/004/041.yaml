    text: या, “सत्य महान है और सबसे प्रबल है / प्रबल पड़ता है।” यूनानी क्रिया का अर्थ “विजयी होना,” “सबसे प्रबल होना,” या “प्रबल पड़ना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: उसने बोलना बंद कर दिया
  rationale: क्रिया और संबंधवाचक क्रियारूप मिलकर बोलना समाप्त करने का भाव देते हैं; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: πᾶς ὁ λαός
  choice: सारे लोग
  rationale: यह एकत्रित जनसमुदाय को सामूहिक रूप से दर्शाता है; ‘सारे लोग’ सहज आधुनिक हिन्दी है।
- source_word: ἐφώνησεν
  choice: पुकार उठे
  rationale: एकवचन यूनानी क्रिया का कर्ता सामूहिक संज्ञा है; हिन्दी में बहुवचन रखते हुए सार्वजनिक उद्घोष का भाव व्यक्त किया गया है।
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: सत्य महान है
  rationale: विधेय विशेषण वाले विस्मयात्मक उद्घोष को गरिमापूर्ण और स्वाभाविक हिन्दी में रखा गया है; यूनानी निश्चित उपपद को हिन्दी में अलग शब्द से दिखाना आवश्यक नहीं।
- source_word: ὑπερισχύει
  choice: सबसे प्रबल है
  rationale: क्रिया का मूल भाव अधिक बलवान होने अथवा प्रबल पड़ने का है। ‘सबसे प्रबल है’ सत्य की श्रेष्ठता के उद्घोष को स्पष्ट रखता है, जबकि वैकल्पिक गतिशील अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ज्ञानोक्तिपरक उद्घोष में ἡ ἀλήθεια का रूप
  choice: सत्य
  alternative: वह सत्य / सच्चाई
  rationale: हिन्दी में अमूर्त सार्वभौमिक संज्ञा के साथ निश्चित उपपद नहीं होता; ‘सत्य’ यूनानी अभिव्यक्ति की गरिमा और व्यापकता बनाए रखता है।
- issue: ὑπερισχύει में स्थिति और विजय के बीच अर्थगत तनाव
  choice: सबसे प्रबल है
  alternative: प्रबल होता है / विजय पाता है
  rationale: यूनानी क्रिया ‘अधिक बलवान होना’, ‘प्रबल पड़ना’ या ‘विजयी होना’ व्यक्त कर सकती है। मुख्य पाठ में सामर्थ्य का भाव रखा गया है और अन्य संभव अर्थ पादटिप्पणी में सुरक्षित हैं।
