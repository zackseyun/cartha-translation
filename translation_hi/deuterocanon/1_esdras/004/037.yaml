base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: hi
  text: दाखमधु अन्यायी है, राजा अन्यायी है, स्त्रियाँ अन्यायी हैं, और मनुष्यों के सब पुत्र[a] तथा उनके सभी काम—इस प्रकार की सभी बातें—अन्यायी हैं। उनमें सत्य नहीं है, और वे अपने अन्याय के कारण नाश हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘सभी मनुष्य’; यूनानी में शाब्दिक रूप से ‘मनुष्यों के सब पुत्र,’ जो समस्त मानवजाति के लिए प्रयुक्त पुल्लिंग मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: अन्यायी
  rationale: मूल में एक ही शब्द की बार-बार आवृत्ति पद की आलंकारिक शक्ति है। ‘अन्यायी’ व्यक्तियों, दाखमधु और कामों के विषय में न्याय तथा सही व्यवस्था के अभाव को व्यक्त करता है; इसलिए पूरी शृंखला में इसे बनाए रखा गया है।
- source_word: οἶνος
  choice: दाखमधु
  rationale: यह οἶνος का स्पष्ट और गरिमापूर्ण हिन्दी पर्याय है तथा आधुनिक पाठक के लिए बोधगम्य है।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: यूनानी निश्चित पदबंध के अनुरूप हिन्दी में स्वाभाविक रूप से ‘राजा’ रखा गया है।
- source_word: αἱ γυναῖκες
  choice: स्त्रियाँ
  rationale: सामान्य बहुवचन का सीधा अर्थ ‘स्त्रियाँ’ है; प्रसंग ‘पत्नियाँ’ अर्थ की माँग नहीं करता।
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: मनुष्यों के सब पुत्र
  rationale: यह यूनानी के स्पष्ट रूप से पुल्लिंग, सामूहिक मानवता-सूचक पदबंध को रूपगत रूप से सुरक्षित रखता है; उसके व्यापक आशय को पादटिप्पणी स्पष्ट करती है।
- source_word: ἔργα
  choice: काम
  rationale: यह मनुष्यों के किए या उत्पन्न किए हुए सभी कार्यों के लिए सहज और व्यापक आधुनिक हिन्दी शब्द है।
- source_word: πάντα τὰ τοιαῦτα
  choice: ऐसी सभी चीज़ें
  rationale: यह पहले कही गई पूरी सूची का सामान्यीकरण करता है और यूनानी की कुछ असामान्य, संक्षिप्त पुनरुक्ति को मिटाता नहीं।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: ‘सत्य’ अन्याय के साथ मूल विरोध को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἀπολοῦνται
  choice: नाश हो जाएँगे
  rationale: यह भविष्यकालीन परिणाम को व्यक्त करता है, पर किसी बाहरी कर्ता द्वारा नष्ट किए जाने का भाव अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: पुल्लिंग शब्दावली वाला सार्वभौमिक मानवता-सूचक पदबंध
  choice: मनुष्यों के सब पुत्र
  alternative: सभी मनुष्य
  rationale: मूल पदबंध पुल्लिंग है, पर सामूहिक रूप से मानवता को सूचित करता है। मुख्य पाठ मूल की आकृति को बचाता है और पादटिप्पणी उसके मुहावरेदार व्यापक अर्थ को बताती है।
- issue: ἄδικος शब्द-समूह की पुनरावृत्ति
  choice: अन्यायी
  alternative: अधर्मी
  rationale: यहाँ कथन न्याय, सत्य और मानव-कर्मों के व्यापक नैतिक मूल्यांकन पर केंद्रित है। ‘अन्यायी’ उस अर्थ और पुनरावृत्ति को बनाए रखता है, जबकि ‘अधर्मी’ अनावश्यक रूप से अधिक विशिष्ट धार्मिक अर्थ ग्रहण कर सकता है।
- issue: विनाश का व्याकरणिक स्वरूप
  choice: नाश हो जाएँगे
  alternative: नष्ट किए जाएँगे
  rationale: यूनानी रूप परिणाम या अकर्मक विनाश को व्यक्त कर सकता है; चुना हुआ अनुवाद किसी अनुल्लिखित बाहरी कर्ता को निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल की तीखी पुनरावृत्ति और ‘ऐसी सभी चीज़ें’ की असामान्य संक्षिप्तता को जानबूझकर सुरक्षित रखा गया है। पादटिप्पणी का चिह्न उसी मानवता-सूचक पदबंध पर रखा गया है जिसे वह समझाती है।
