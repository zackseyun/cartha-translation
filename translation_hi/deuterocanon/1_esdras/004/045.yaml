  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: hi
  text: और तुमने उस मंदिर को फिर से बनाने की प्रतिज्ञा की थी, जिसे यहूदिया के लोगों ने तब जला दिया था जब कसदियों ने यहूदिया को उजाड़ दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “जिसे यहूदिया के लोगों ने जला दिया था।” यह एक कठिन पाठ है और उस अधिक परिचित वृत्तांत से भिन्न है, जिसके अनुसार मंदिर को कसदियों, अर्थात् बाबुलवासियों, ने जलाया था।
    reason: यूनानी स्रोत के असामान्य ऐतिहासिक वाचन को बनाए रखते हुए पाठक को अधिक परिचित परंपरा से अवगत कराना।
lexical_decisions:
- source_word: εὔξω
  choice: आपने ... मन्नत मानी थी
  rationale: यहाँ εὔχομαι के रूप का अर्थ प्रार्थना करने के बजाय किसी कार्य को करने की मन्नत या प्रतिज्ञा करना है; इसके साथ निर्माण का infinitive आया है।
- source_word: οἰκοδομῆσαι
  choice: फिर से बनाने
  rationale: क्रिया मूलतः ‘बनाना’ है, पर पहले जलाए जा चुके मन्दिर के संदर्भ में पुनर्निर्माण का भाव स्वाभाविक रूप से निहित है।
- source_word: τὸν ναὸν
  choice: उस मन्दिर को
  rationale: यरूशलेम के पवित्र भवन के लिए ‘मन्दिर’ सहज और मानक हिन्दी है।
- source_word: ἐνεπύρισαν
  choice: जला दिया था
  rationale: क्रिया आग लगाने या जलाने को व्यक्त करती है; यह अनुवाद परिणाम को ‘पूरी तरह भस्म’ कहकर अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदिया के लोगों ने
  rationale: ऐतिहासिक-भौगोलिक संदर्भ में यहूदिया से संबद्ध लोगों का संकेत है। यह हिन्दी में क्षेत्रीय अर्थ स्पष्ट करता है और यूनानी पाठ में दिए कर्ता को सुरक्षित रखता है।
- source_word: ἐρημώθη
  choice: उजाड़ दिया था
  rationale: निष्क्रिय क्रिया देश के विनाश और उजाड़े जाने को दर्शाती है; हिन्दी में कर्ता ‘कसदियों’ के साथ सक्रिय रचना अधिक स्वाभाविक है और अर्थ समान रहता है।
- source_word: Χαλδαίων
  choice: कसदियों
  rationale: यूनानी में विशेष रूप से ‘कसदी’ है; इसे ‘बाबुलवासी’ बनाकर ऐतिहासिक पहचान का सामान्यीकरण नहीं किया गया।
theological_decisions:
- issue: मन्दिर जलाने का श्रेय यहूदिया के लोगों को देने वाला कठिन ऐतिहासिक पाठ
  choice: मुख्य पाठ में यूनानी के अनुसार ‘जिसे यहूदिया के लोगों ने ... जला दिया था’ रखा गया।
  alternative: ‘जिसे कसदियों/बाबुलवासियों ने जला दिया था’
  rationale: प्राप्त यूनानी पाठ में οἱ Ἰουδαῖοι स्पष्ट रूप से ἐνεπύρισαν का कर्ता है। अधिक परिचित ऐतिहासिक वृत्तांत से सामंजस्य बैठाने के लिए इसे चुपचाप बदलना उचित नहीं; कठिनाई को पादटिप्पणी में पारदर्शी बनाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मन्नत मानी’ प्रतिज्ञात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; ‘यहूदिया के लोग’ ऐतिहासिक-भौगोलिक पहचान को स्पष्ट रखता है।
