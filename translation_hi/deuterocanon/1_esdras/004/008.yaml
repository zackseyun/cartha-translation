- source_word: ἕκαστος
  choice: हर एक
  rationale: यह प्रत्येक सहभागी को अलग-अलग इंगित करने वाला वितरणात्मक प्रयोग है। ‘हर एक’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: τὸν ἑαυτοῦ λόγον
  choice: अपना कथन
  rationale: यहाँ λόγος प्रतियोगिता के लिए लिखे गए विचार या दावे को दर्शाता है। ‘कथन’ लिखित आशय बनाए रखता है, पर इसे अनावश्यक रूप से औपचारिक ‘तर्क’ नहीं बनाता।
- source_word: ἐσφραγίσαντο
  choice: उन्होंने उन कथनों पर मुहर लगाई
  rationale: संदर्भ में लिखित कथनों को मुहरबंद करना अभिप्रेत है। हिन्दी में कर्म स्पष्ट करने के लिए ‘उन कथनों’ को व्यक्त किया गया है।
- source_word: ἔθηκαν
  choice: उन्हें ... रख दिया
  rationale: सरल कथात्मक क्रिया का स्वाभाविक हिन्दी रूप; ‘उन्हें’ पहले उल्लिखित कथनों को संदर्भित करता है।
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: तकिए के नीचे
  rationale: προσκεφάλαιον सिर रखने की वस्तु, अर्थात तकिया या सिरहाना, हो सकता है। मुख्य पाठ में ‘तकिया’ सबसे स्वाभाविक है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Δαρείου τοῦ βασιλέως
  choice: राजा दारा के
  rationale: सम्बन्धकारक पदबंध तकिए से जुड़ा है। ‘राजा दारा’ आधुनिक हिन्दी में पदवी और नाम का स्वाभाविक क्रम है।
