lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण कथा में अगली घटना का क्रम बताता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: γράψαντες
  choice: ने ... लिखा; फिर
