base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: hi
  text: और उन्होंने कहा, “जब राजा उठेगा, तब वे उसे लिखित दस्तावेज़[a] देंगे। फिर राजा और फ़ारस के तीन उच्च अधिकारी जिसके तर्क[b] को अधिक बुद्धिमत्तापूर्ण ठहराएँगे, उसी को विजय दी जाएगी, जैसा लिखा हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिखित लेख” अथवा “पत्र” (τὸ γράμμα)।
    reason: lexical_alternative
  - marker: b
    text: या “कथन” अथवा “पक्ष”; यहाँ λόγος प्रतियोगी द्वारा प्रस्तुत विचार या दलील को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: उठेगा
  rationale: संदर्भ में यह राजा के नींद या अपने स्थान से उठने को दर्शाता है; ‘उठेगा’ अर्थ को अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: τὸ γράμμα
  choice: लिखित दस्तावेज़
  rationale: यह प्रतियोगियों के लिखे हुए कथनों को राजा के सामने प्रस्तुत किए जाने वाले लेख या दस्तावेज़ के रूप में दर्शाता है; इससे निजी पत्र का अर्थ नहीं निकलता।
- source_word: κρίνῃ
  choice: ठहराएँगे
  rationale: यह मूल्यांकन करके निर्णय देने का भाव व्यक्त करता है और हिन्दी वाक्य में ‘अधिक बुद्धिमत्तापूर्ण ठहराना’ स्वाभाविक है।
- source_word: μεγιστᾶνες
  choice: उच्च अधिकारी
  rationale: यह फ़ारस के उच्च पदस्थ प्रतिष्ठित व्यक्तियों को सूचित करता है; आधुनिक हिन्दी में यह पद और अधिकार दोनों को स्पष्ट करता है।
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: जिसके तर्क को अधिक बुद्धिमत्तापूर्ण
  rationale: प्रतियोगिता के संदर्भ में λόγος किसी व्यक्ति के कथन, विचार या प्रस्तुत तर्क को सूचित करता है; तुलनात्मक σοφώτερος को ‘अधिक बुद्धिमत्तापूर्ण’ से स्पष्ट रखा गया है।
- source_word: τὸ νῖκος
  choice: विजय
  rationale: यह ज्ञान-प्रतियोगिता में मिलने वाली जीत को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा हुआ है
  rationale: यूनानी पूर्णकालिक निष्क्रिय रूप उस बात की ओर संकेत करता है जो लिखित रूप में विद्यमान है; यह हिन्दी में निकट और स्वाभाविक रूप है।
