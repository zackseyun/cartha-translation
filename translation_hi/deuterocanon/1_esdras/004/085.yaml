translation:
  language: hi
  text: ऊपर जाने और यरूशलेम तथा उस मंदिर को फिर से बनाने के लिए, जिस पर उसका नाम रखा गया था[a]; और उन्होंने सात दिन तक संगीत और आनंद के साथ उत्सव मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर उसका नाम पुकारा गया था” अथवा “जो उसके नाम से कहलाता था।” यूनानी में सामी पृष्ठभूमि वाला मंदिर-सम्बन्धी सूत्र है, जो मंदिर पर परमेश्वर के अधिकार और उससे उसके सम्बन्ध को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: ऊपर जाकर
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। यरूशलेम जाने के पारंपरिक भौगोलिक और धार्मिक भाव को बनाए रखने के लिए इसे ‘ऊपर जाकर’ कहा गया है; केवल ‘लौटना’ कहना यूनानी से अधिक व्याख्यात्मक होता।
- source_word: οἰκοδομῆσαι
  choice: फिर से निर्माण करें
  rationale: मूल क्रिया ‘बनाना’ है, पर विनाश के बाद यरूशलेम और मन्दिर की पुनर्स्थापना के प्रसंग में ‘फिर से निर्माण’ स्वाभाविक रूप से प्रासंगिक अर्थ व्यक्त करता है।
- source_word: ἱερὸν
  choice: मन्दिर
  rationale: यहाँ संकेत यरूशलेम के मन्दिर से है; आधुनिक हिन्दी में ‘मन्दिर’ सबसे स्पष्ट और स्वाभाविक समानार्थी है।
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: जिस पर उसका नाम पुकारा गया था
  rationale: यह चयन सामी पृष्ठभूमि वाले दैवी नाम के सूत्र की संरचना को बनाए रखता है और परमेश्वर के मन्दिर पर अधिकार तथा उससे उसके सम्बन्ध को बिना व्याख्यात्मक रूप से समतल किए व्यक्त करता है।
- source_word: ἐκωθωνίζοντο
  choice: उत्सव मनाया
  rationale: दुर्लभ क्रिया आनन्दपूर्ण उत्सवी आयोजन का बोध कराती है। ‘उत्सव मनाया’ वर्तमान हिन्दी में स्पष्ट है और संगीत तथा आनन्द के उल्लेख के अनुकूल है।
- source_word: μουσικῶν
  choice: संगीत के साथ
  rationale: बहुवचन सम्बन्धकारक संगीत अथवा संगीतकारों की ओर संकेत कर सकता है। ‘संगीत के साथ’ अर्थ को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से संगीतकारों को निर्दिष्ट नहीं करता।
- source_word: χαρᾶς
  choice: आनन्द
  rationale: यह मूल शब्द का सीधा और गरिमापूर्ण हिन्दी प्रतिरूप है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन तक
  rationale: अवधि व्यक्त करने के लिए आधुनिक हिन्दी में ‘सात दिन तक’ स्वाभाविक है।
theological_decisions:
- issue: मन्दिर के सम्बन्ध में दैवी नाम का सूत्र
  choice: जिस पर उसका नाम पुकारा गया था
  alternative: जिसके ऊपर उसका नाम लिया गया था; जो उसके नाम से कहलाता था
  rationale: यूनानी वाक्यांश सामी मन्दिर-सूत्र को प्रतिबिम्बित करता है, जो परमेश्वर के अधिकार और मन्दिर से उसके सम्बन्ध—दोनों का संकेत दे सकता है। मुख्य पाठ उसके रूपक और अस्पष्टता को बनाए रखता है; पादटिप्पणी स्वाभाविक वैकल्पिक अर्थ देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऊपर जाकर’ मूल दिशा-बोध को, और ‘नाम पुकारा गया था’ मन्दिर-सूत्र की वास्तविक धार्मिक अस्पष्टता को सुरक्षित रखता है।
