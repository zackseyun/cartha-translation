  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: hi
  text: 'और जब वह युवक बाहर निकला, तब उसने यरूशलेम की ओर मुँह किए हुए अपना मुख स्वर्ग की ओर उठाया और स्वर्ग के राजा की स्तुति की[a], कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के राजा को धन्य कहा।”
    reason: यूनानी εὐλόγησεν का शाब्दिक अर्थ ‘धन्य कहा’ है; इस संदर्भ में इसका स्वाभाविक हिन्दी अर्थ स्तुति करना है।
lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: वह जवान
  rationale: यह आधुनिक, सहज हिन्दी में एक युवा पुरुष को व्यक्त करता है और प्रसंग के निश्चित निर्देश को बनाए रखता है।
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  choice: अपना चेहरा आकाश की ओर उठाया
  rationale: यूनानी कृदंत वाक्यांश का स्वाभाविक और निकट अर्थ देता है।
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: यरूशलेम की ओर मुख करके
  rationale: ἔναντιον यहाँ यरूशलेम के सामने या उसकी दिशा की ओर उन्मुख होने का भाव देता है; यह अनुवाद स्थानिक अर्थ को सहज हिन्दी में रखता है।
- source_word: εὐλόγησεν
  choice: धन्य कहा
  rationale: परमेश्वर की स्तुति या प्रशंसा करने के अर्थ में बाइबलीय εὐλογέω को व्यक्त करता है, बिना इसे केवल धन्यवाद देने तक सीमित किए।
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा को
  rationale: यूनानी पदबंध का सीधा और गरिमापूर्ण अनुवाद।
- source_word: λέγων
  choice: '[विराम-चिह्न द्वारा व्यक्त]'
  rationale: अगले कथन की भूमिका को हिन्दी में कोलन से स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: εὐλόγησεν का धार्मिक अर्थ
  choice: धन्य कहा
  alternative: स्तुति की
  rationale: ‘धन्य कहा’ मूल क्रिया के आशीर्वचन/प्रशंसात्मक विस्तार को सुरक्षित रखता है; ‘स्तुति की’ अधिक सहज है, पर अर्थ को कुछ संकुचित कर सकता है।
- issue: ἔναντιον Ἰερουσαλήμ की दिशा
  choice: यरूशलेम की ओर मुख करके
  alternative: यरूशलेम के सामने
  rationale: यह पाठ में निहित यरूशलेम की ओर उन्मुख होने का भाव स्पष्ट करता है, पर किसी विशेष प्रार्थना-विधान को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु धर्मग्रंथ के अनुरूप गरिमापूर्ण। यूनानी वाक्य की क्रमिक क्रियाओं को स्पष्ट हिन्दी वाक्य-विन्यास में रखा गया है।
