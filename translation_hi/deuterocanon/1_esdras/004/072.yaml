  text: and that all the land they possess should be tax-free for them[b][a]; and that the Chaldeans should leave the villages of the Jews that they hold.
translation:
  language: hi
  text: और जिस पूरे प्रदेश पर वे अधिकार रखेंगे, वह उनके लिए कर-मुक्त हो;[a] और कसदी[b] यहूदियों के उन गाँवों को, जिन्हें वे अपने अधिकार में रखे हुए हैं, छोड़ दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पूरे भूभाग पर वे अधिकार रखेंगे, वह उनके लिए कर से मुक्त हो।”
    reason: lexical_alternative
  - marker: b
    text: “कसदी” यूनानी पाठ का शब्द है; कुछ पाठक इसे व्यापक अर्थ में “बाबेलवासी” समझ सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν
  choice: प्रदेश
  rationale: यह व्यापक भूभाग-सूचक शब्द है; कानूनी-प्रशासनिक संदर्भ में ‘प्रदेश’ स्वाभाविक है और किसी निश्चित राजनीतिक इकाई को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: κρατήσουσιν
  choice: अधिकार रखेंगे
  rationale: κρατέω का भाव यहाँ किसी भूभाग पर कब्ज़ा अथवा नियंत्रण बनाए रखने का है; ‘अधिकार रखेंगे’ भावी रूप और नियंत्रण दोनों को व्यक्त करता है।
- source_word: ἀφορολόγητον
  choice: कर-मुक्त
  rationale: यह कर अथवा राजस्व से छूट को सूचित करता है; ‘कर-मुक्त’ संक्षिप्त और आधुनिक हिन्दी है।
- source_word: ὑπάρχειν
  choice: हो
  rationale: आज्ञप्ति-सूची की infinitival रचना को हिन्दी में विधिक ‘हो’ से स्वाभाविक ढंग से व्यक्त किया गया है, बिना स्वामित्व का अतिरिक्त अर्थ जोड़े।
- source_word: Χαλδαῖοι
  choice: कसदी
  rationale: यूनानी पाठ के जातिनाम ‘खलदाई/कसदी’ को सुरक्षित रखा गया है; ‘कसदी’ हिन्दी बाइबलीय प्रयोग में परिचित रूप है।
- source_word: ἀφίουσι
  choice: छोड़ दें
  rationale: यहाँ क्रिया का अर्थ अपने नियंत्रण से मुक्त करना अथवा कब्ज़ा छोड़ना है; ‘छोड़ दें’ आज्ञप्ति के विधिक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: κώμας
  choice: गाँवों
  rationale: κώμη का सामान्य अर्थ गाँव है; यही सबसे स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: διακρατοῦσιν
  choice: अधिकार किए हुए हैं
  rationale: यौगिक क्रिया दृढ़तापूर्वक नियंत्रण बनाए रखने का भाव देती है; यह पदबंध केवल भौतिक उपस्थिति के बजाय नियंत्रण स्पष्ट करता है।
theological_decisions:
- issue: राजकीय आज्ञप्ति के संदर्भ में infinitive उपवाक्यों का कानूनी-प्रशासनिक बल
  choice: हिन्दी में विधिक ‘हो’ और ‘छोड़ दें’ का प्रयोग
  alternative: 'अधिक शब्दशः रूप: ‘कर-मुक्त होना’ और ‘छोड़ना’'
  rationale: पद आज्ञप्ति के प्रावधान गिनाता है। विधिक क्रियारूप मूल यूनानी के निर्देशात्मक बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखते हैं।
