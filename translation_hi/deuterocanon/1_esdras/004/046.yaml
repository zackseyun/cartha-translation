base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: hi
  text: और अब, हे प्रभु राजा, यही वह बात है जो मैं आपसे माँगता हूँ, और यही मेरा आपसे निवेदन है; और यही आपकी महानता होगी। इसलिए मैं विनती करता हूँ कि जिस मन्नत को मैंने स्वर्ग के राजा के सामने आपके मुख से पूरा कराने के लिए माना था, उसे आप पूरा करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपके मुख से पूरा करने के लिए।” यहाँ ‘मुख से’ राजा के बोले हुए आदेश या आज्ञा द्वारा कार्य को पूरा कराने का संकेत है।
    reason: ‘ἐκ στόματός σου’ के शाब्दिक रूपक और राजकीय आदेश के निहित आशय को स्पष्ट करना।
lexical_decisions:
- source_word: ἀξιῶ
  choice: मैं ... माँगता
  rationale: राजदरबार में की गई याचना के संदर्भ में यह अधिकार जताने के बजाय माँग रखने को व्यक्त करता है; समानांतर αἰτοῦμαί से भेद बनाए रखने के लिए ‘माँगता’ चुना गया।
- source_word: κύριε βασιλεῦ
  choice: हे प्रभु राजा
  rationale: मानवीय राजा के लिए आदरसूचक संबोधन है। ‘हे’ संबोधन को स्पष्ट करता है और ‘प्रभु राजा’ यूनानी पदक्रम के निकट रहता है।
- source_word: αἰτοῦμαί
  choice: आपसे ... निवेदन करता हूँ
  rationale: ἀξιῶ के साथ याचना की आलंकारिक पुनरुक्ति को बनाए रखते हुए अधिक औपचारिक अभिव्यक्ति दी गई है।
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: आपकी ओर से यही उदारता होगी
  rationale: μεγαλωσύνη का मूल अर्थ महानता/महत्ता है, पर यहाँ राजा से अपेक्षित महानहृदय अनुग्रह संदर्भित है; सहज हिन्दी में ‘उदारता’ प्रसंगगत भाव स्पष्ट करती है।
- source_word: δέομαι
  choice: मैं विनती करता हूँ
  rationale: यह पहले के याचना-क्रियापदों से अधिक आग्रहपूर्ण स्वर रखता है; ‘विनती’ सम्मानपूर्ण और तीव्र अनुरोध व्यक्त करती है।
- source_word: εὐχήν ... ηὔξω
  choice: मन्नत ... जिसे मैंने ... माँगते हुए कहा था
  rationale: संज्ञा और सजातीय क्रिया प्रार्थना तथा मन्नत दोनों का अर्थ दे सकती हैं। प्रसंग में ईश्वर के सामने की गई प्रतिज्ञाबद्ध याचना का भाव है; हिन्दी ‘मन्नत’ उस संयुक्त अर्थ को स्वाभाविक रूप से रखती है।
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा से
  rationale: यह परमेश्वर की उपाधि है और संबोधित सांसारिक राजा से स्पष्ट भेद बनाए रखती है।
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: वह आपके मुख से पूरी हो
  rationale: यूनानी वाक्यांश के असामान्य रूपक को मुख्य पाठ में सुरक्षित रखा गया है; अभिप्राय राजा के बोले हुए आदेश द्वारा कार्य पूरा होना है।
theological_decisions:
- issue: ‘स्वर्ग के राजा’ का संदर्भ
  choice: परमेश्वर की उपाधि के रूप में ‘स्वर्ग के राजा’
  alternative: ‘स्वर्गीय राजा’
  rationale: संबोधित सांसारिक राजा और उस परमेश्वर के बीच पाठगत विरोध स्पष्ट रखा गया है, जिसके सामने मन्नत मानी गई थी।
- issue: εὐχή / ηὔξω में प्रार्थना और मन्नत का संबंध
  choice: ‘मन्नत’ तथा ‘माँगते हुए कहा था’ द्वारा दोनों अर्थछायाएँ रखना
  alternative: केवल ‘प्रतिज्ञा की थी’ या केवल ‘प्रार्थना की थी’
  rationale: मूल शब्दावली में प्रार्थना और व्रत/मन्नत दोनों की संभावना है; किसी एक अर्थ को पूरी तरह थोपने के बजाय हिन्दी में संयुक्त भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण राजदरबारी स्वर रखा गया है। ‘आप’ का प्रयोग मानवीय राजा के लिए आदर व्यक्त करता है। वाक्य की पुनरुक्त याचना-रचना तथा ‘मुख’ का मूल रूपक सुरक्षित हैं; कठिन εὐχή/ηὔξω को ‘मन्नत’ के माध्यम से सामान्य पाठक के लिए सुबोध बनाया गया है।
