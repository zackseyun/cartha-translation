translation:
  language: hi
  text: और वह मन को दावत और आनंद की ओर मोड़ देता है, और किसी को न कोई दुःख याद रहता है, न कोई ऋण।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: हर मन
  rationale: διάνοια मन, समझ या विचार को सूचित कर सकता है। यहाँ μεταστρέφει के कर्म के रूप में “हर मन” यूनानी के वितरणात्मक भाव को बनाए रखता है और मानसिक दशा के बदलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μεταστρέφει
  choice: मोड़ देता है
  rationale: क्रिया का मूल अर्थ मोड़ना या बदलना है। “की ओर मोड़ देता है” εἰς के दिशात्मक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς εὐωχίαν καὶ εὐφροσύνην
  choice: भोज और आनंद की ओर
  rationale: εὐωχία भोज अथवा उत्सवी खान-पान और εὐφροσύνη आनंद या हर्ष को दर्शाता है। यह युग्म दोनों अलग उत्सवी भावों को संक्षिप्त और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: οὐ μέμνηται
  choice: मनुष्य को … याद रहता है
  rationale: यूनानी में कर्ता स्पष्ट नहीं है और क्रिया सामान्य रूप से उस व्यक्ति की ओर संकेत करती है जो इसके प्रभाव में है। “मनुष्य को” इस सामान्य मानवीय अर्थ को बिना अनावश्यक लिंग-विशेष के व्यक्त करता है।
- source_word: πᾶσαν λύπην
  choice: न कोई दुःख
  rationale: λύπη दुःख, शोक या क्लेश हो सकता है। “दुःख” आनंद के साथ व्यापक और स्वाभाविक विरोध प्रस्तुत करता है।
- source_word: πᾶν ὀφείλημα
  choice: न कोई ऋण
  rationale: ὀφείλημα मुख्यतः उस वस्तु या राशि को सूचित करता है जो देय है। “ऋण” इसका सबसे सीधा अर्थ है, जबकि अधिक व्यापक “दायित्व” की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
