translation:
  language: hi
  text: हे पुरुषो, दाखरस कितना प्रबल है! वह उसे पीने वाले सभी पुरुषों की बुद्धि को भ्रमित कर देता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: हे पुरुषो
  rationale: ἀνήρ का संबोधन बहुवचन है। ‘हे पुरुषो’ प्रत्यक्ष पुरुष-संबोधन और वक्तृत्वपूर्ण स्वर को बनाए रखता है।
- source_word: πῶς ὑπερισχύει
  choice: कितना प्रबल है
  rationale: यहाँ πῶς विस्मयात्मक रूप से मात्रा बताता है, और ὑπερισχύει अत्यधिक सामर्थ्य या प्रबलता व्यक्त करता है। यह हिंदी में स्वाभाविक है और किसी अनुल्लिखित कर्म को नहीं जोड़ता।
- source_word: ὁ οἶνος
  choice: दाखमधु
  rationale: οἶνος अंगूर से बने मद्य को दर्शाता है। ‘दाखमधु’ गरिमापूर्ण और स्पष्ट बाइबलीय हिंदी है।
- source_word: πάντας τοὺς ἀνθρώπους τοὺς πίοντας αὐτόν
  choice: जो भी पुरुष उसे पीते हैं ... उन सबकी
  rationale: संज्ञीकृत वर्तमान कृदंत सामान्य/निरंतर क्रिया बताता है। संदर्भ का पुरुष-संबोधन और यूनानी के पुल्लिंग रूप सुरक्षित रखते हुए हिंदी वाक्य को स्वाभाविक बनाया गया है।
- source_word: πλανᾷ τὴν διάνοιαν
  choice: बुद्धि को भटका देता है
  rationale: πλανάω भटकाने या पथ से हटाने का भाव रखता है; διάνοια सोचने-समझने की शक्ति को सूचित करता है। ‘बुद्धि को भटका देता है’ दोनों भावों को सहज हिंदी में व्यक्त करता है।
