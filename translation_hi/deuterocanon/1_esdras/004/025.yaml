  text: परन्तु राजा उनसे अधिक शक्तिशाली है, उन पर शासन करता है और उनका स्वामी है; वह उनसे जो कुछ भी कहता है, वे उसकी बात मानते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
