    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: परन्तु राजा
  rationale: δέ यहाँ तर्क के प्रवाह में हल्का विरोध दर्शाता है; इसलिए ‘परन्तु’ चुना गया है। βασιλεύς का स्वाभाविक अर्थ ‘राजा’ है।
- source_word: ὑπερισχύει
  choice: उन पर प्रबल होता है
  rationale: यह क्रिया अधिक शक्तिशाली होने या बढ़त रखने का भाव देती है। ‘प्रबल होता है’ इसके तुलनात्मक बल को बनाए रखता है।
- source_word: κυριεύει αὐτῶν
  choice: उन पर शासन करता है
  rationale: κυριεύω अधिकार या प्रभुता चलाने को व्यक्त करता है। आधुनिक हिन्दी में ‘शासन करता है’ स्पष्ट और स्वाभाविक है।
- source_word: δεσπόζει αὐτῶν
  choice: उनका स्वामी होता है
  rationale: δεσπόζω, κυριεύω की अपेक्षा अधिक पूर्ण स्वामित्व और अधिकार का भाव रखता है। अलग अभिव्यक्ति रखने से यूनानी पाठ की अर्थगत पुनरुक्ति और बढ़ती तीव्रता सुरक्षित रहती है।
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: वह उनसे जो कुछ भी कहता है
  rationale: यह रचना अनिश्चित व्यापकता व्यक्त करती है—राजा जो कुछ भी उनसे कहे। हिन्दी में यह रूप सहज है और मूल भाव को रखता है।
- source_word: ἐνακούουσιν
  choice: वे उसकी बात मानते हैं
  rationale: क्रिया मूलतः सुनने से संबंधित है, पर राजकीय आदेश के संदर्भ में ध्यान देकर पालन करने का भाव देती है। ‘बात मानते हैं’ सुनने और आज्ञापालन, दोनों के बीच की अर्थछाया बनाए रखता है।
