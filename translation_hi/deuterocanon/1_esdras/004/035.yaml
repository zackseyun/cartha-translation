  choice: ‘सत्य महान है’ और ‘सबसे अधिक शक्तिशाली है’ के रूप में कथन को यथावत रखा गया।
  alternative: ‘सत्य की विजय होती है’ जैसा व्याख्यात्मक रूप।
  rationale: मूल पद सत्य को महान और अन्य सबकी तुलना में अधिक शक्तिशाली बताता है; इसमें विजय या किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना मूल से आगे जाना होता।
