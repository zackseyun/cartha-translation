- source_word: οὐχὶ μέγας ὃς ταῦτα ποιεῖ
  choice: क्या वह महान नहीं है जो ये काम करता है?
  rationale: यूनानी का नकारात्मक आलंकारिक प्रश्न और वर्तमान कृदंत का सामान्य अर्थ स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: ἀλήθεια का सीधा और प्रसंगानुकूल हिन्दी समतुल्य है।
- source_word: ἰσχυροτέρα παρὰ πάντα
  choice: सबसे अधिक शक्तिशाली
  rationale: तुलनात्मक ἰσχυροτέρα और παρὰ πάντα का अर्थ है कि सत्य अन्य सबकी तुलना में अधिक शक्तिशाली है; हिन्दी में यह तुलना स्वाभाविक रूप से व्यक्त होती है।
theological_decisions:
