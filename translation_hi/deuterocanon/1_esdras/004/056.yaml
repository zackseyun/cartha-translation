lexical_decisions:
- source_word: φρουροῦσι
  choice: रखवाली करनेवाले
  rationale: यह वर्तमान कृदन्त नगर की रक्षा करने या उस पर पहरा देनेवालों को सूचित करता है; यह चयन सुरक्षात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: πόλιν
  choice: नगर
  rationale: यूनानी पाठ में निश्चित उपपद है; प्रसंगगत निश्चितता हिन्दी में ‘नगर’ से स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἔγραψε
  choice: उसने लिख भेजा
  rationale: क्रिया का मूल अर्थ ‘उसने लिखा’ है। प्रशासनिक प्रसंग में ‘लिख भेजा’ लिखित निर्देश के संप्रेषण को स्पष्ट करता है, बिना इसे ‘आज्ञा दी’ के रूप में अधिक व्याख्यायित किए।
- source_word: δοῦναι
  choice: दिया जाए
  rationale: अनन्त क्रिया ἔγραψε पर निर्भर होकर लिखित निर्देश की विषयवस्तु बताती है; हिन्दी का कर्मवाच्य प्रशासनिक आशय को सहजता से व्यक्त करता है।
- source_word: κλήρους
  choice: भू-भाग
  rationale: κλῆρος का अर्थ चिट्ठी द्वारा मिला भाग, निर्धारित हिस्सा, या भूमि का आवंटित भाग हो सकता है। प्रसंग में नगर के रक्षकों को वेतन के साथ दिया जानेवाला आवंटन होने के कारण ‘भू-भाग’ उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὀψώνια
  choice: वेतन
  rationale: यह शब्द विशेषतः सैनिकों या सेवकों को मिलनेवाले वेतन अथवा भत्ते को दर्शा सकता है; आधुनिक हिन्दी में ‘वेतन’ स्पष्ट और गरिमापूर्ण समतुल्य है।
