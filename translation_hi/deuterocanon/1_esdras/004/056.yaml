  naturalness: The sentence is otherwise clear and idiomatic in modern standard Hindi. ‘लिखा कि’ is more direct and closely reflects ἔγραψε than ‘लिख भेजा,’ without adding an implication of dispatch.
  terminology: ‘नगर की रखवाली करनेवाले’ and ‘वेतन’ are suitable. ‘आवंटित हिस्से’ preserves the lexical breadth of κλήρους and avoids asserting that land was granted.
