  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: hi
  text: तीसरे ने लिखा[a], “स्त्रियाँ अधिक शक्तिशाली हैं, परन्तु सब वस्तुओं से बढ़कर सत्य विजयी होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्रियाँ प्रबल होती हैं, परन्तु सत्य सब पर प्रबल होता है।”
    reason: Ὑπερισχύουσιν और νικᾷ को क्रमशः ‘प्रबल होती हैं’ और ‘प्रबल होता है’ कहना सम्भव है; यह विकल्प दोनों उपवाक्यों की समानांतर संरचना को उभारता है।
lexical_decisions:
- source_word: ὁ τρίτος
  choice: तीसरे ने
  rationale: लेखयुक्त क्रमवाचक शब्द यहाँ संज्ञा की तरह प्रयुक्त है और तीसरे प्रतियोगी को सूचित करता है; प्रसंग के कारण ‘प्रतियोगी’ जोड़ना आवश्यक नहीं।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: क्रिया का सीधा अर्थ ‘लिखा’ है और यह तीसरे वक्ता के लिखित कथन का परिचय देती है।
- source_word: Ὑπερισχύουσιν
  choice: अधिक शक्तिशाली हैं
  rationale: क्रिया शक्ति में श्रेष्ठ होने अथवा प्रबल पड़ने का अर्थ देती है; यह चयन तुलनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αἱ γυναῖκες
  choice: स्त्रियाँ
  rationale: यहाँ कथन सामान्य और लोकोक्तिपरक है, इसलिए ‘पत्नियाँ’ के बजाय व्यापक अर्थ वाला ‘स्त्रियाँ’ उपयुक्त है।
- source_word: ὑπὲρ δὲ πάντα
  choice: परन्तु सब वस्तुओं से बढ़कर
  rationale: वाक्यांश सभी अन्य चीज़ों से ऊपर या श्रेष्ठ होने की चरम तुलना व्यक्त करता है।
- source_word: νικᾷ
  choice: विजयी होता है
  rationale: वर्तमान काल सामान्य सत्य बताता है और यह रूप जीत के बिंब को सुरक्षित रखता है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: यहाँ सत्य को मानवीकृत विजेता के रूप में प्रस्तुत किया गया है; हिन्दी में अमूर्त संज्ञा के साथ अलग निर्धारक आवश्यक नहीं।
theological_decisions:
- issue: ἀλήθεια के विषय में चरम कथन का अनुवाद
  choice: सत्य विजयी होता है
  alternative: सत्य प्रबल होता है
  rationale: ‘विजयी होता है’ νικᾷ के विजय-बिंब को बनाए रखता है और सत्य को अंतिम विजेता के रूप में प्रस्तुत करने वाले मूल कथन को अस्पष्ट किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। ‘परन्तु’ औपचारिक किंतु सामान्यतः बोधगम्य संयोजक है; ‘सत्य विजयी होता है’ मूल के मानवीकरण और सार्वकालिक वर्तमान को बनाए रखता है।
