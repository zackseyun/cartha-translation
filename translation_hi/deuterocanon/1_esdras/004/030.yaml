lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: उतारकर
  rationale: यह कृदन्त राजा के सिर से मुकुट हटाने की क्रिया बताता है। सिर पर रखी वस्तु के लिए ‘उतारना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: διάδημα
  choice: मुकुट
  rationale: यह राजकीय शिरोभूषण का सामान्य, स्पष्ट और आधुनिक हिन्दी पर्याय है; ‘किरीट’ अपेक्षाकृत साहित्यिक और कम प्रचलित है।
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: अपने सिर पर रख लेती थी
  rationale: संदर्भ में स्त्री राजा का मुकुट स्वयं पर रखती है। हिन्दी में मुकुट के स्थान को स्पष्ट करने के लिए ‘अपने सिर पर’ स्वाभाविक है, यद्यपि यूनानी में ‘सिर’ दूसरी बार व्यक्त नहीं हुआ।
- source_word: ἐράπιζεν
  choice: प्रहार करती थी
  rationale: यूनानी क्रिया हाथ से मारने, विशेषतः थप्पड़ मारने, का बोध करा सकती है। ‘प्रहार करती थी’ व्यापक अर्थ को मुख्य पाठ में रखता है और अधिक विशिष्ट अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τῇ ἀριστερᾷ
  choice: अपने बाएँ हाथ से
  rationale: यूनानी में विशेषण के साथ ‘हाथ’ निहित है। हिन्दी में उसे स्पष्ट करना आवश्यक और स्वाभाविक है।
