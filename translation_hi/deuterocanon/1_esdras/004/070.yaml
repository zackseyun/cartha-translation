base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: hi
  text: और उसने कोएले-सीरिया और फोनीकिया के सभी स्थानीय शासकों[a] और लबानोन में रहने वालों को पत्र लिखे कि वे लबानोन से देवदार की लकड़ी यरूशलेम पहुँचाएँ, ताकि वे उसके साथ मिलकर नगर का निर्माण करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज़िला-शासकों’; यूनानी शब्द का अर्थ स्थानीय प्रशासनिक क्षेत्रों पर शासन करने वाले अधिकारी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: स्थानीय शासकों
  rationale: τοπάρχης किसी स्थान या प्रशासनिक क्षेत्र के शासक को दर्शाता है। ‘स्थानीय शासक’ आधुनिक हिन्दी में इसका प्रशासनिक अर्थ स्पष्ट रूप से व्यक्त करता है; अधिक तकनीकी विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: कोइले-सूरिया
  rationale: यह यूनानी-कालीन एक ऐतिहासिक क्षेत्र का नाम है, केवल ‘नीची’ या ‘खोखली’ सूरिया का वर्णन नहीं। इसलिए नाम को लिप्यंतरित करके उसकी ऐतिहासिक विशिष्टता बनाए रखी गई है।
- source_word: ἔγραψεν ἐπιστολάς
  choice: पत्र लिखे
  rationale: यूनानी पाठ स्पष्ट रूप से पत्र लिखने की क्रिया बताता है; संदर्भ में उन्हें भेजना निहित है, पर उसे मूल क्रिया के स्थान पर नहीं रखा गया।
- source_word: μεταφέρειν
  choice: पहुँचाएँ
  rationale: यहाँ आशय लबानोन से निर्माण-सामग्री को यरूशलेम ले जाने का है। ‘पहुँचाएँ’ हिन्दी में दिशा और नियोजित परिवहन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ξύλα κέδρινα
  choice: देवदार की लकड़ी
  rationale: यह वाक्यांश निर्माण में काम आने वाली देवदार की लकड़ी को सूचित करता है। ‘लकड़ी’ सामान्य पाठक के लिए स्वाभाविक है और अनावश्यक रूप से ‘लट्ठों’ का विशिष्ट रूप आरोपित नहीं करता।
- source_word: ὅπως οἰκοδομήσωσιν
  choice: ताकि वे ... निर्माण करें
  rationale: ὅπως के साथ विधिलिंग प्रयोजन व्यक्त करता है; ‘ताकि’ उस प्रयोजन को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ मिलकर
  rationale: μετά के साथ संबंधकारक संगति या सहभागिता व्यक्त करता है। ‘उसके साथ मिलकर’ इसी अर्थ को स्पष्ट करता है और इसे ‘उसके लिए’ नहीं बनाता।
- source_word: τὴν πόλιν
  choice: नगर
  rationale: πόλις यहाँ यरूशलेम को एक नगरीय केंद्र के रूप में दर्शाता है। ‘नगर’ मूल के निश्चित, पर सामान्य, उल्लेख को बनाए रखता है।
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: लबानोन के शासकों
  rationale: यूनानी में ‘जो लबानोन में हैं’ के साथ पहले आया ‘शासकों’ का संज्ञार्थ लुप्त किंतु समझा हुआ है। हिन्दी में संज्ञा दोहराने से आशय स्वाभाविक और स्पष्ट होता है।
theological_decisions:
- issue: निर्माण-कार्य का विषय
  choice: नगर का निर्माण
  alternative: मन्दिर का निर्माण
  rationale: यद्यपि लबानोन की देवदार की लकड़ी बाइबिल के अन्य प्रसंगों में मन्दिर-निर्माण से जुड़ी है, यहाँ यूनानी पाठ स्पष्टतः τὴν πόλιν, अर्थात ‘नगर’, कहता है। अनुवाद ने इसे मन्दिर के रूप में सामंजस्यपूर्ण नहीं बनाया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ऐतिहासिक क्षेत्र ‘कोइले-सूरिया’ का नाम अनूदित करने के बजाय लिप्यंतरित किया गया है। ‘लबानोन के शासकों’ में यूनानी की लुप्त संज्ञा को हिन्दी की स्पष्टता के लिए दोहराया गया है।
