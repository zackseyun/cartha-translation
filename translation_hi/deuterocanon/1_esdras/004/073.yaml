  text: and for the building of the temple[a], that twenty talents be given each year until it is built[b];
translation:
  language: hi
  text: और मन्दिर के निर्माण के लिए[a], उसके बन जाने तक हर वर्ष बीस तोड़े[b] दिए जाएँ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान के निर्माण के लिए।’ यूनानी में ἱερόν है, जो मन्दिर के लिए प्रचलित शब्द है।
    reason: lexical_alternative
  - marker: b
    text: तोड़ा भार की एक बड़ी इकाई था और इस प्रसंग में धन-मूल्य का माप भी था।
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομή
  choice: निर्माण
  rationale: यह संज्ञा यहाँ मन्दिर को बनाने के कार्य के लिए है; ‘निर्माण’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἱερόν
  choice: मन्दिर
  rationale: ἱερόν पवित्र मन्दिर अथवा उसके परिसर को सूचित कर सकता है; पुनर्निर्माण के इस प्रसंग में ‘मन्दिर’ सबसे स्पष्ट सामान्य अनुवाद है।
- source_word: δοθῆναι
  choice: दिए जाएँ
  rationale: निष्क्रिय अनन्त क्रिया आज्ञा अथवा राजकीय प्रावधान के आशय से जुड़ी है; ‘दिए जाएँ’ उस प्रशासनिक भाव को बनाए रखता है।
- source_word: κατ’ ἐνιαυτόν
  choice: हर वर्ष
  rationale: यह वितरणात्मक पदबंध प्रतिवर्ष बार-बार दिए जाने का अर्थ व्यक्त करता है।
- source_word: τάλαντα εἴκοσι
  choice: बीस तोड़े
  rationale: τάλαντον भार की बड़ी इकाई और प्रसंगानुसार धन-मूल्य का माप था; ‘तोड़ा’ हिन्दी बाइबलीय प्रयोग में इसकी परिचित पारंपरिक संज्ञा है।
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: उसके बन जाने तक
  rationale: यह पदबंध निर्माण पूर्ण होने तक की अवधि बताता है; ‘उसके’ का स्वाभाविक संकेत निकटवर्ती ‘मन्दिर’ की ओर है।
