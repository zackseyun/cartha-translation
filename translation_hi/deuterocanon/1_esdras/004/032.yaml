lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: प्रत्यक्ष संबोधन और बहुवचन को स्वाभाविक, किंतु गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἰσχυραὶ
  choice: शक्तिशाली
  rationale: यूनानी विशेषण का सामान्य अर्थ ‘बलवान/शक्तिशाली’ है; यहाँ स्त्रियों की प्रभावकारी सामर्थ्य पर बल है।
- source_word: ὅτι
  choice: जब
  rationale: यहाँ स्त्रियों के शक्तिशाली होने का प्रमाण या आधार आगे के कार्य से दिया गया है; हिन्दी में ‘जब वे...करती हैं’ इस तर्कात्मक संबंध को सहजता से व्यक्त करता है।
- source_word: οὕτως πράσσουσιν
  choice: वे ऐसे काम करती हैं
  rationale: οὕτως की निर्देशात्मकता और πράσσω के व्यापक ‘करना/कार्य करना’ अर्थ को बिना अनावश्यक विशिष्टीकरण के सुरक्षित रखता है।
