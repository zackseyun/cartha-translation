  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: hi
  text: और मन्दिर के निर्माण के लिए हर वर्ष बीस तालन्त[a] दिए जाएँ, जब तक उसका निर्माण पूरा न हो जाए।
