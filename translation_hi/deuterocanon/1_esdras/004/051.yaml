    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομήν
  choice: निर्माण
  rationale: यह संज्ञा यहाँ निर्माण-कार्य या निर्माण-परियोजना को दर्शाती है; ‘निर्माण’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἱεροῦ
  choice: मन्दिर
  rationale: ἱερόν पवित्र मन्दिर-परिसर को सूचित कर सकता है; इस पुनर्निर्माण-सन्दर्भ में ‘मन्दिर’ सबसे स्पष्ट और प्रचलित विकल्प है।
- source_word: δοθῆναι
  choice: दिए जाएँ
  rationale: यूनानी अओरिस्ट कर्मवाच्य अनन्तरूप धन उपलब्ध कराने का प्रशासनिक निर्देश व्यक्त करता है; ‘दिए जाएँ’ उसके कर्मवाच्य और अनिर्दिष्ट माध्यम को बनाए रखता है।
- source_word: κατʼ ἐνιαυτόν
  choice: हर वर्ष
  rationale: यह वाक्यांश प्रति वर्ष होने वाली आवर्ती व्यवस्था बताता है; ‘हर वर्ष’ सहज आधुनिक हिन्दी है।
- source_word: τάλαντα εἴκοσι
  choice: बीस तालन्त
  rationale: τάλαντον प्राचीन भार-माप था, जिसका उपयोग बहुमूल्य धातुओं और धन-मूल्य के लिए भी होता था। ऐतिहासिक इकाई को ‘तालन्त’ के रूप में रखकर पाद-टिप्पणी में समझाया गया है।
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: जब तक उसका निर्माण पूरा न हो जाए
  rationale: μέχρι τοῦ के साथ कर्मवाच्य अनन्तरूप अवधि की सीमा, अर्थात निर्माण की पूर्णता, बताता है। हिन्दी में यह रूप स्वाभाविक है और ‘उसका’ मन्दिर की ओर संकेत करता है।
