  yaml_path: translation/deuterocanon/1_esdras/004/047.yaml
  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: hi
  text: तब राजा दारा उठ खड़ा हुआ और उसने उसे चूमा। फिर उसने उसके लिए सभी प्रबंधकों, क्षेत्रीय शासकों, सेनापतियों और क्षत्रपों को पत्र लिखे कि वे उसे और उसके साथ के उन सभी लोगों को, जो यरूशलेम का निर्माण करने के लिए ऊपर जा रहे थे, सहायता देकर आगे भेजें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सहायता देकर आगे भेजें” का अनुवाद “साथ पहुँचाएँ” भी हो सकता है; यूनानी क्रिया में यात्रा के लिए सहायता या व्यवस्था करके आगे भेजने का भाव भी आ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε ἀναστὰς
  choice: तब ... उठ खड़ा हुआ
  rationale: यह क्रमसूचक Τότε और दारा के शारीरिक रूप से उठने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατεφίλησεν αὐτόν
  choice: उसने उसे चूमा
  rationale: क्रिया स्नेहपूर्ण या जोर देकर चूमने का भाव रख सकती है, पर साधारण अनुवाद मूल घटना को बिना अतिव्याख्या के सुरक्षित रखता है।
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: उसने उसके लिए ... पत्र लिखे
  rationale: सम्प्रदान कारक यहाँ जरुब्बाबेल के लाभ और यात्रा की अनुमति के लिए लिखे गए पत्रों को सूचित करता है।
- source_word: οἰκονόμους
  choice: प्रबंधकों
  rationale: यह संसाधनों या संपत्तियों का प्रबंध करने वाले अधिकारियों के लिए व्यापक और प्रसंगानुकूल हिन्दी शब्द है; ‘कोषाध्यक्षों’ से अर्थ अनावश्यक रूप से संकीर्ण हो सकता है।
- source_word: τοπάρχας
  choice: क्षेत्रीय शासकों
  rationale: स्थानीय भूभागों पर शासन करने वाले अधिकारियों की पदवी को लिप्यंतरित करने के बजाय अर्थानुसार व्यक्त किया गया है।
- source_word: στρατηγοὺς
  choice: सेनापतियों
  rationale: यह सैन्य अधिकारियों के लिए स्पष्ट और ऐतिहासिक रूप से उपयुक्त हिन्दी शब्द है।
- source_word: σατράπας
  choice: क्षत्रपों
  rationale: फारसी प्रशासन की विशिष्ट ऐतिहासिक पदवी के लिए हिन्दी में प्रचलित रूप रखा गया है।
- source_word: ἵνα προπέμψωσιν
  choice: सहायता सहित विदा करें
  rationale: προπέμπω केवल साथ पहुँचाने के बजाय यात्रा के लिए सहायता, व्यवस्था या संरक्षण देकर आगे भेजने का व्यापक अर्थ रख सकता है; यह रूप उस अर्थ-व्याप्ति को सुरक्षित रखता है।
- source_word: τοὺς μετʼ αὐτοῦ πάντας ἀναβαίνοντας
  choice: उसके साथ ... ऊपर जा रहे सभी लोगों को
  rationale: यरूशलेम की यात्रा के लिए प्रयुक्त ‘ऊपर जाना’ वाला बाइबिलीय भौगोलिक मुहावरा सुरक्षित रखा गया है।
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: यरूशलेम को बनाने के लिए
  rationale: मूल यूनानी क्रिया सामान्यतः ‘बनाना/निर्माण करना’ कहती है; व्यापक प्रसंग के आधार पर ‘फिर से बनाना’ नहीं जोड़ा गया।
theological_decisions:
- issue: यरूशलेम के निर्माण का पुनर्निर्माण के रूप में स्पष्टीकरण
  choice: ‘बनाने’ रखा गया
  alternative: ‘फिर से बनाने’
  rationale: यद्यपि ऐतिहासिक प्रसंग पुनर्निर्माण का है, इस पद की यूनानी क्रिया में ‘फिर से’ स्पष्ट नहीं है; इसलिए मूल की अभिव्यक्ति को विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। प्रशासनिक पदों को यथासंभव सहज हिन्दी में दिया गया है, जबकि विशिष्ट फारसी पदवी ‘क्षत्रप’ सुरक्षित रखी गई है। मुख्य पाठ में फुटनोट चिह्न [a] उपस्थित है।
