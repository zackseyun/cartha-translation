translation:
  language: hi
  text: यह कहते हुए, “विजय तुझ से है, और बुद्धि तुझ से है; महिमा तेरी है, और मैं तेरा सेवक[a] हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मैं तेरे घर का सेवक हूँ”; यूनानी शब्द का अधिक प्रबल अर्थ “मैं तेरा दास हूँ” भी हो सकता है।
    reason: οἰκέτης के ‘घरेलू सेवक’ और ‘दास’ दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत का रूप बनाए रखता है और उद्धृत वचन का स्वाभाविक हिन्दी परिचय देता है।
- source_word: Παρὰ σοῦ
  choice: तुझी से मिलती है
  rationale: सम्बन्धकारक के साथ παρά यहाँ स्रोत या उद्गम बताता है। ‘तुझी से’ मूल के बलाघात को व्यक्त करता है, और ‘मिलती है’ हिन्दी में निहित क्रिया को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: νίκη
  choice: विजय
  rationale: यह यूनानी संज्ञा का सीधा, प्रचलित और प्रसंगानुकूल अर्थ है।
- source_word: σοφία
  choice: बुद्धि
  rationale: यहाँ σοφία सामान्य अर्थ में बुद्धि या प्रज्ञा को दर्शाता है; प्रसंग इसे किसी विशेष कौशल तक सीमित नहीं करता।
- source_word: σὴ ἡ δόξα
  choice: महिमा तेरी है
  rationale: यह रूप अधिकार पर दिए गए यूनानी बल को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: οἰκέτης
  choice: सेवक
  rationale: शब्द घर से जुड़े सेवक या दास को सूचित कर सकता है। मुख्य पाठ में ‘सेवक’ समर्पण के भाव और गरिमापूर्ण शैली को स्वाभाविक रूप से व्यक्त करता है; अधिक विशिष्ट या प्रबल अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: समर्पण के कथन में οἰκέτης का अनुवाद
  choice: सेवक
  alternative: घर का सेवक; दास
  rationale: इस स्तुतिपरक कथन में वक्ता की अधीनता स्पष्ट है, पर यूनानी शब्द से बंधुआ स्थिति पर बल देना अनिवार्य नहीं। इसलिए मुख्य पाठ में ‘सेवक’ रखा गया है और वास्तविक शाब्दिक विस्तार पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्तुतिपरक शैली अपनाई गई है। एकवचन सम्बोधन के लिए ‘तू/तेरा’ के आदरसूचक भक्तिपरक प्रयोग को रखा गया है। समानांतर यूनानी रचना को स्वाभाविक हिन्दी के लिए दोहराए गए ‘तुझी से मिलती है’ द्वारा व्यक्त किया गया है।
