    reason: lexical_alternative
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: उच्च पदाधिकारी
  rationale: यह शब्द राजदरबार के ऊँचे पद और प्रभाव वाले व्यक्तियों को सूचित करता है। ‘उच्च पदाधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और केवल वंशानुगत कुलीनता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἔβλεπον
  choice: देखने लगे
  rationale: अपूर्ण भूतकाल यहाँ चल रही या आरम्भ हुई पारस्परिक दृष्टि को दर्शाता है। ‘एक-दूसरे की ओर देखने लगे’ हिन्दी कथन-शैली में स्वाभाविक है।
- source_word: εἷς τὸν ἕτερον
  choice: एक-दूसरे की ओर
  rationale: यह यूनानी पारस्परिक मुहावरे का सहज और सटीक हिन्दी रूप है।
- source_word: ἤρξατο λαλεῖν
  choice: बोलने लगा
  rationale: यह आरम्भसूचक रचना को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: περὶ τῆς ἀληθείας
  choice: सत्य के विषय में
  rationale: निश्चित उपपद के कारण ‘सत्य’ को चर्चा के विशिष्ट विषय के रूप में रखा गया है; ‘के विषय में’ περὶ का स्पष्ट, गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: ἤρξατο का अप्रकट एकवचन कर्ता
  choice: वह
  alternative: व्यक्ति का नाम जोड़ना
  rationale: यूनानी पाठ कर्ता का नाम यहाँ दोहराता नहीं है। ‘वह’ मूल की संदर्भ-निर्भरता और संभावित अस्पष्टता को सुरक्षित रखता है; नाम जोड़ने से पाठ की व्याख्या अनावश्यक रूप से निश्चित हो जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उच्च पदाधिकारी’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी यूनानी पद की सामाजिक और दरबारी अर्थ-सीमा सुरक्षित रखती है।
