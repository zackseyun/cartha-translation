  text: Then the king and the nobles looked at one another[a], and he began to speak about the truth.
translation:
  language: hi
  text: तब राजा और उच्च पदाधिकारी[a] एक-दूसरे की ओर देखने लगे, और वह सत्य के विषय में बोलने लगा।
  philosophy: optimal-equivalence
