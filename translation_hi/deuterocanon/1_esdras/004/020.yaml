  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: hi
  text: और वह सबके हृदयों को धनी बना देता है; वह न राजा को याद रखता है, न क्षत्रप को, और सबको तोड़ों में बात करने लगाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी वाक्यांश का अधिक शाब्दिक रूप है, “सब/सब कुछ को तोड़ों के द्वारा बोलने लगाता है।” ‘तोड़’ प्राचीन भार और धन की बड़ी इकाई था; यहाँ भाव संभवतः बड़ी-बड़ी रकमों में बात करने का है, न कि प्राकृतिक प्रतिभाओं का।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: सबके हृदयों को धनी बना देता है
  rationale: यह अनुवाद ‘हृदय’ के यूनानी रूपक और ποιεῖ + विशेषण की कारक रचना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: οὐ μέμνηται
  choice: याद रखता है
  rationale: क्रिया का मूल अर्थ स्मरण रखना है। प्रसंग में भाव ‘परवाह न करना’ या ‘भूल जाना’ हो सकता है, पर मूल बिंब को बनाए रखने के लिए अधिक शाब्दिक रूप चुना गया है।
- source_word: βασιλέα οὐδὲ σατράπην
  choice: न राजा को ... न क्षत्रप को
  rationale: ‘क्षत्रप’ फ़ारसी साम्राज्य के प्रांतीय शासक का ऐतिहासिक पद है; सामान्य ‘राज्यपाल’ कहने से यह ऐतिहासिक रंग मिट जाता।
- source_word: πάντα
  choice: सबको
  rationale: रूप की दृष्टि से यह नपुंसकलिंग बहुवचन ‘सब कुछ’ भी हो सकता है, किंतु ‘बोलने’ वाली क्रिया यहाँ व्यक्तियों की ओर संकेत करती है। अस्पष्टता पादटिप्पणी में दर्ज की गई है।
- source_word: διὰ ταλάντων
  choice: तोड़ों में
  rationale: τάλαντον यहाँ प्राकृतिक योग्यता नहीं, बल्कि प्राचीन भार और धन की बड़ी इकाई है। ‘तोड़ों में’ मूल सांस्कृतिक शब्द को रखते हुए बड़ी-बड़ी रकमों में बोलने का भाव देता है।
- source_word: ποιεῖ λαλεῖν
  choice: बात करने लगाता है
  rationale: यह यूनानी कारक रचना का स्वाभाविक हिन्दी रूप है और पहले आए ποιεῖ के साथ अलंकारिक समानता भी रखता है।
theological_decisions:
- issue: दोहराई गई क्रियाओं का अनकहा कर्ता
  choice: कर्त्ता को केवल ‘वह’ रखा गया है
  alternative: ‘दाखमधु’ को स्पष्ट रूप से जोड़ना
  rationale: यूनानी वाक्य में कर्ता पिछले प्रसंग से समझा जाता है और इस पंक्ति में दोहराया नहीं गया। उसे नाम देकर जोड़ने के बजाय सर्वनाम रखने से स्रोत की अभिव्यक्ति और उसकी असामान्य मानवीकरण-शैली सुरक्षित रहती है।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है; ‘क्षत्रप’ और ‘तोड़’ ऐतिहासिक सटीकता के लिए सुरक्षित हैं। महत्त्वपूर्ण पाठ-संदर्भ समस्या: दिया गया यूनानी पाठ प्रचलित अध्याय-पद क्रम में 1 एस्द्रास 3:21 से मेल खाता है, जबकि 1 एस्द्रास 4:20 का पाठ अलग है। अतः यह मसौदा दिए गए यूनानी पाठ का अनुवाद है; 4:20 के रूप में प्रकाशन से पहले संदर्भ-संख्या की जाँच आवश्यक है।'
