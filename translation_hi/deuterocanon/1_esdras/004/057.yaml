  yaml_path: translation/deuterocanon/1_esdras/004/057.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: hi
  text: और उसने वे सभी पात्र वापस भेज दिए[a], जिन्हें कुस्रू ने बाबेल से अलग रखा था; और कुस्रू ने जो कुछ करने को कहा था, उस सबको उसने स्वयं भी करने और यरूशलेम भेजने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘भेज दिया’ या ‘रवाना किया’ भी हो सकता है; ‘वापस’ का भाव मंदिर के पात्रों को लौटाने के प्रसंग से आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: वापस भिजवा दिए
  rationale: क्रिया का मूल अर्थ ‘बाहर भेजना/रवाना करना’ है। मंदिर के पात्रों को बाबेल से यरूशलेम लौटाने के प्रसंग में ‘वापस भिजवा दिए’ स्वाभाविक है; पादटिप्पणी मूल की व्यापक अर्थ-सीमा स्पष्ट करती है।
- source_word: τὰ σκεύη
  choice: पात्र
  rationale: इस प्रसंग में σκεύη मंदिर में उपयोग होने वाले पात्रों या पवित्र सामान को सूचित करता है। ‘पात्र’ संक्षिप्त, गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है।
- source_word: ἃ ἐχώρισεν
  choice: जिन्हें ... अलग रखा था
  rationale: χωρίζω के ‘अलग करना’ अर्थ को बनाए रखते हुए यह पदबंध किसी उद्देश्य के लिए अलग निर्धारित किए जाने का भाव भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ Βαβυλῶνος
  choice: बाबेल से
  rationale: ἀπό के स्थान-स्रोत संबंधी अर्थ का सीधा और स्वाभाविक अनुवाद।
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: कुस्रू ने जो कुछ करने को कहा था, वह सब
  rationale: यूनानी के संक्षिप्त infinitival विन्यास को पठनीय हिन्दी में रखते हुए ‘जो कुछ…वह सब’ πάντα ὅσα की व्यापकता सुरक्षित रखता है।
- source_word: καὶ αὐτὸς
  choice: उसने स्वयं भी
  rationale: ‘स्वयं’ αὐτός के बलाघात को और ‘भी’ καί के योगात्मक भाव को सुरक्षित रखता है।
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह प्रशासनिक आदेश देने की क्रिया है; ‘आज्ञा दी’ आधुनिक, गरिमापूर्ण और पर्याप्त रूप से सशक्त है।
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι
  choice: करने और ... भेजने
  rationale: दोनों समन्वित infinitives को समानांतर हिन्दी क्रियार्थक रूपों में रखा गया है; वाक्य यह अनावश्यक रूप से नहीं कहता कि शासक ने कार्य स्वयं किया।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: ‘यरूशलेम भेजने’ में εἰς की दिशात्मकता हिन्दी की क्रिया के साथ स्पष्ट है, इसलिए अलग परसर्ग आवश्यक नहीं।
theological_decisions:
- issue: दूसरे खंड में ‘करने’ और ‘भेजने’ के कर्म का संक्षिप्त और कुछ अस्पष्ट संबंध
  choice: यूनानी की समन्वित रचना को ‘वह सब ... करने और यरूशलेम भेजने’ के रूप में बनाए रखा गया
  alternative: ‘उसने उन पात्रों को यरूशलेम भेजने और कुस्रू की सारी आज्ञाएँ पूरी करने का आदेश दिया’
  rationale: वैकल्पिक रूप अर्थ को अधिक स्पष्ट करता, पर यूनानी वाक्य की संरचना को पुनर्व्यवस्थित करके ‘पात्रों’ को दूसरे infinitive का स्पष्ट कर्म बना देता। चुना हुआ रूप मूल की संक्षिप्तता और संभावित तनाव को अधिक निकटता से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘कुस्रू’, ‘बाबेल’ और ‘यरूशलेम’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। अर्धविराम मूल के दो निकट जुड़े खंडों को अलग करता है।
