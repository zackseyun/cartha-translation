- source_word: τὴν Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित मानक रूप।
- source_word: ἐν τῇ ἡμέρᾳ ᾗ
  choice: उस दिन … जिस दिन
  rationale: यूनानी के स्पष्ट काल-सूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ βασίλειόν σου παρέλαβες
  choice: आपने अपना राज्य प्राप्त किया था
  rationale: παρέλαβες यहाँ राजकीय शासन प्राप्त करने को दर्शाता है; यह रूप मूल की निकटता और गरिमा दोनों बनाए रखता है।
