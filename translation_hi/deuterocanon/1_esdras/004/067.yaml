  yaml_path: translation/deuterocanon/1_esdras/004/067.yaml
  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: hi
  text: और तुमने उस मन्दिर को फिर से बनाने की मन्नत मानी थी, जिसे यहूदिया के लोगों ने उस समय जला दिया था जब कसदियों ने यहूदिया को उजाड़ दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शाब्दिक अर्थ है, “जिसे यहूदिया के लोगों ने जला दिया था।” समानांतर ऐतिहासिक परम्पराओं के कारण कुछ पाठक यहाँ “जिसे कसदियों/बाबुलियों ने जला दिया था” की अपेक्षा कर सकते हैं, पर उपलब्ध यूनानी पाठ में स्पष्ट रूप से “यहूदिया के लोग” ही लिखा है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: तूने ... मन्नत मानी थी
  rationale: यहाँ εὔχομαι का रूप किसी गंभीर संकल्प या मन्नत को व्यक्त करता है। राजा को एकवचन में संबोधित करते हुए यह अनुवाद ‘प्रार्थना की’ की अपेक्षा संदर्भ के अधिक अनुकूल है।
- source_word: οἰκοδομῆσαι
  choice: फिर से बनाने
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है, पर जिस मन्दिर को जलाया जा चुका था उसके संदर्भ में ‘फिर से बनाना’ स्वाभाविक रूप से पुनर्निर्माण का भाव व्यक्त करता है।
- source_word: ναὸν
  choice: मन्दिर
  rationale: इस ऐतिहासिक संदर्भ में ναός यरूशलेम के मन्दिर-भवन को सूचित करता है; ‘मन्दिर’ स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: ἐνεπύρισαν
  choice: जला दिया था
  rationale: यह क्रिया आग लगाने या जलाने को व्यक्त करती है। ‘जला दिया’ स्पष्ट है और पूर्ण विनाश का अनावश्यक दावा नहीं करता।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदिया के लोगों ने
  rationale: यूनानी पद स्पष्ट रूप से क्रिया का कर्ता है और इस संदर्भ में यहूदिया के जातीय-भौगोलिक लोगों को सूचित कर सकता है। यह चुनाव आधुनिक हिन्दी में उस सूक्ष्मता को ‘यहूदियों’ से अधिक स्पष्ट रखता है।
- source_word: ἐρημώθη
  choice: उजाड़ दिया था
  rationale: निष्क्रिय यूनानी रूप उजाड़े या वीरान किए जाने को व्यक्त करता है। हिन्दी में कर्ता ‘कसदियों’ को सामने रखकर सक्रिय वाक्य अधिक स्वाभाविक है और अर्थ अपरिवर्तित रहता है।
- source_word: Χαλδαίων
  choice: कसदियों
  rationale: यूनानी में विशिष्ट ऐतिहासिक नाम ‘कसदी’ है; इसे ‘बाबुलियों’ से बदलना व्याख्यात्मक होता।
theological_decisions:
- issue: मन्दिर जलाने का ऐतिहासिक कर्ता
  choice: यूनानी पाठ के अनुसार ‘यहूदिया के लोगों’ को जलाने वाला रखा गया है।
  alternative: समानांतर ऐतिहासिक परम्पराओं के आधार पर ‘कसदियों/बाबुलियों ने जलाया’ कहना अथवा कर्ता हटाकर ‘जो जला दिया गया था’ कहना।
  rationale: उपलब्ध यूनानी पाठ में οἱ Ἰουδαῖοι स्पष्ट रूप से ἐνεπύρισαν का कर्ता है। परिचित ऐतिहासिक वृत्तान्तों से उत्पन्न तनाव को मुख्य पाठ में चुपचाप सुधारने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राजा के लिए एकवचन ‘तू’ मूल यूनानी के एकवचन संबोधन को बनाए रखता है। ‘मन्नत मानी थी’ solemn pledge का स्वाभाविक हिन्दी रूप है; ‘कसदी’ स्रोत के ऐतिहासिक नाम को सुरक्षित रखता है।
