  rationale: ἄλλα का अतिरिक्त मात्रा वाला भाव रखा गया; τάλαντα के लिए बाइबिलीय हिन्दी में प्रचलित भार-इकाई ‘किक्कार’ चुनी गई।
- source_word: κατ’ ἐνιαυτόν
