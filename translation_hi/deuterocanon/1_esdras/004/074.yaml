  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: hi
  text: और वेदी पर प्रतिदिन होमबलियाँ चढ़ाने के लिए, जैसा कि उन्हें आज्ञा दी गई है, सत्रह अर्पित करने और हर वर्ष दस अतिरिक्त किक्कार[c] अर्पित करने के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘सत्रह’ के बाद किस वस्तु की गिनती है, यह यूनानी पाठ में स्पष्ट रूप से नहीं दोहराया गया; संभवतः आशय प्रतिदिन चढ़ाई जाने वाली बलि की वस्तुओं से है।
    reason: alternative_reading
  - marker: c
    text: ‘किक्कार’ भार की एक बड़ी इकाई थी, जिसका प्रयोग प्रायः बहुमूल्य धातुओं के लिए होता था; यहाँ यह नहीं बताया गया कि धातु कौन-सी थी।
    reason: cultural_note
