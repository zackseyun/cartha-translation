lexical_decisions:
- source_word: ἔγραψεν
  choice: लिख दिया
  rationale: γράϕω के क्रियात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और यहाँ निर्देशों को लिखित रूप देने का भाव बनाए रखता है।
- source_word: χορηγίαν
  choice: रसद
  rationale: χορηγία किसी उद्देश्य के लिए उपलब्ध कराई गई सामग्री या व्यवस्था को सूचित कर सकता है। ‘रसद’ भौतिक आपूर्ति का संक्षिप्त, सामान्य और गैर-मौद्रिक रूप से सीमित अनुवाद है।
- source_word: ἱερατικὴν στολήν
  choice: याजकीय वस्त्र
  rationale: ἱερατικός का धार्मिक-पुजारी संबंधी अर्थ ‘याजकीय’ से और στολή का व्यापक परिधानार्थ ‘वस्त्र’ से व्यक्त होता है; इससे बाद की किसी विशिष्ट कलीसियाई शब्दावली को आरोपित नहीं किया जाता।
- source_word: ἐν τίνι
  choice: किस प्रकार
  rationale: यूनानी पदबंध संक्षिप्त और वाक्य-विन्यास की दृष्टि से असहज है। ‘किस प्रकार’ सेवा के निर्दिष्ट ढंग को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी मूल की कठिनाई बताती है।
- source_word: λατρεύσουσιν
  choice: सेवा करेंगे
  rationale: मंदिर-संदर्भ में λατρεύω धार्मिक या उपासना-संबंधी सेवा बताता है। ‘सेवा करेंगे’ सरल है और ‘आराधना करेंगे’ की अपेक्षा पुरोहितीय कार्य के व्यापक अर्थ को बचाता है।
- source_word: ἐν αὐτῇ
  choice: उसे पहनकर
  rationale: स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक पूर्वपद στολή है। हिन्दी में ‘वस्त्र में’ के स्थान पर ‘उसे पहनकर’ वही आशय स्पष्ट और स्वाभाविक रूप से देता है, पर मूल की संक्षिप्तता पादटिप्पणी में दर्ज है।
