translation:
  language: hi
  text: और बैंगनी वस्त्र पहनना, सोने के पात्रों से पीना, सोने पर सोना[a], सोने की लगामों वाला रथ[b], महीन लिनन की पगड़ी, और गले के चारों ओर हार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘सोने पर सोना’ है। सम्भवतः आशय सोने से सजे पलंग या शय्या पर सोने का है, पर यूनानी पाठ में ‘पलंग’ या ‘शय्या’ शब्द नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘सोने की लगामों वाला’ का अर्थ अधिक व्यापक रूप से सोने की लगाम, बिट या अन्य रथ-साज से युक्त भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: बैंगनी वस्त्र पहनना
  rationale: πορφύρα बैंगनी कपड़े अथवा परिधान को सूचित करता है और मध्यवाच्य περιβαλέσθαι स्वयं पहनने का भाव देता है। हिन्दी में केवल ‘बैंगनी पहनना’ अस्पष्ट होता, इसलिए ‘वस्त्र’ स्पष्ट किया गया है।
- source_word: ἐν χρυσώμασιν πίνειν
  choice: सोने के पात्रों से पीना
  rationale: χρυσώματα यहाँ पीने के लिए प्रयुक्त सोने की वस्तुओं को दर्शाता है; उनका ठीक प्रकार नहीं बताया गया, इसलिए ‘पात्र’ प्याले की अपेक्षा व्यापक और स्वाभाविक है।
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: सोने पर सोना
  rationale: यूनानी पाठ में बिस्तर या पलंग की संज्ञा नहीं है। असामान्य किन्तु स्रोत-सन्निकट अभिव्यक्ति को रखा गया है और संभावित आशय पादटिप्पणी में बताया गया है।
- source_word: ἅρμα χρυσοχάλινον
  choice: सोने की लगामों वाला रथ
  rationale: χρυσοχάλινος सोने से युक्त लगाम, बिट या व्यापक साज-सामान का बोध करा सकता है। मुख्य पाठ में सुबोध ‘लगामों’ रखा गया है, जबकि व्यापक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: κίδαριν βυσσίνην
  choice: महीन मलमल की पगड़ी
  rationale: κίδαρις सिर पर बाँधा जाने वाला मुकुटनुमा वस्त्र या पगड़ी है और βύσσινος बहुमूल्य महीन लिनन/बिस्सुस को दर्शाता है। आधुनिक हिन्दी में ‘महीन मलमल’ सामग्री और विलासिता दोनों को सहज रूप में व्यक्त करता है।
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: गले में हार पहनना
  rationale: μανιάκη गले का आभूषण है, जिसे आधुनिक हिन्दी में ‘हार’ स्वाभाविक रूप से व्यक्त करता है। पद्य की क्रियात्मक सूची को पूरा करने के लिए अन्त में ‘पहनना’ लगाया गया है।
