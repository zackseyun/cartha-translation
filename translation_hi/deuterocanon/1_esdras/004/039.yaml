  text: और उसके यहाँ न पक्षपात[a] है, न भेदभाव[b]; बल्कि वह हर अन्यायपूर्ण और दुष्ट बात से अलग रहकर वही करती है जो न्यायपूर्ण है; और सब लोग उसके कामों का अनुमोदन करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘चेहरे ग्रहण करना’; यह किसी का पक्ष लेने के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भेद’।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνειν πρόσωπα
  choice: पक्षपात
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘चेहरे ग्रहण करना’ है, पर न्याय के प्रसंग में इसका आशय किसी का पक्ष लेना है। ‘पक्षपात’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट अर्थ देता है।
- source_word: διάφορα
  choice: भेदभाव
  rationale: यहाँ शब्द पक्षपात के साथ प्रयुक्त होकर लोगों के बीच भेद या तरजीह करने का भाव देता है। ‘भेदभाव’ इस समानांतर बल को सहज हिन्दी में बनाए रखता है।
- source_word: τὰ δίκαια
  choice: वही जो न्यायपूर्ण है
  rationale: नपुंसकलिंग बहुवचन का अर्थ सामूहिक रूप से न्यायसंगत बातों या कार्यों से है। यह पद न्याय के नैतिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: हर अन्यायपूर्ण और दुष्ट बात से अलग रहकर
  rationale: ἀπό की अलगाव या दूरी की मूल शक्ति को बनाए रखते हुए यह अनुवाद न्यायपूर्ण कार्य को अन्याय और दुष्टता से पृथक दिखाता है; इसे केवल तुलनात्मक ‘के बजाय’ बनाकर अर्थ को सीमित नहीं करता।
- source_word: εὐδοκοῦσι
  choice: अनुमोदन करते हैं
  rationale: क्रिया प्रसन्न होने और स्वीकृति देने, दोनों का भाव रख सकती है। नैतिक मूल्यांकन के इस प्रसंग में ‘अनुमोदन करते हैं’ उपयुक्त है और सकारात्मक स्वीकृति व्यक्त करता है।
- source_word: αὐτὴν / αὐτῆς
  choice: वह / उसके
  rationale: आसपास के प्रसंग में सत्य को स्त्रीरूप में व्यक्त किया गया है। ‘वह ... करती है’ और ‘उसके’ द्वारा इस मानवीकरण को हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: सत्य का स्त्रीरूप मानवीकरण
  choice: स्त्रीलिंग क्रिया ‘करती है’ के साथ मानवीकरण बनाए रखना
  alternative: सत्य को नपुंसक या सामान्य पुल्लिंग भाव में ‘वह करता है’ कहना
  rationale: यूनानी पाठ में ἀλήθεια व्याकरणतः स्त्रीलिंग है और इस भाषण में सत्य का सजीव मानवीकरण किया गया है। स्त्रीलिंग रूप साहित्यिक बल को सुरक्षित रखता है, बिना किसी अतिरिक्त धर्मसिद्धान्त को जोड़े।
- issue: ἀπό के संबंध का अर्थ
  choice: अन्यायपूर्ण और दुष्ट बातों से अलग रहकर
  alternative: अन्यायपूर्ण और दुष्ट बातों के बजाय
  rationale: ἀπό का प्राथमिक अलगाव-सूचक भाव संरक्षित रखा गया है। संदर्भ में विरोध अवश्य है, पर पाठ को केवल स्पष्ट तुलना में बदलना मूल की संभावित व्यापकता को घटा सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अनुमोदन’ कुछ औपचारिक है, पर εὐδοκοῦσι के नैतिक स्वीकृति वाले भाव को सटीक रूप से व्यक्त करता है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं; विशेषतः [b] को διάφορα के अनुवाद ‘भेदभाव’ से जोड़ा गया है।
