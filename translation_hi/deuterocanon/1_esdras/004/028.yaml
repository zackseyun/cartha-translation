lexical_decisions:
- source_word: πιστεύετέ
  choice: मेरी बात पर विश्वास करते
  rationale: यहाँ वक्ता स्वयं अपने कथन को स्वीकार करने की बात कर रहा है। स्वाभाविक हिन्दी में ‘मेरी बात पर विश्वास करना’ इस आशय को स्पष्ट करता है।
- source_word: μέγας
  choice: महान
  rationale: यह शब्द राजा की हैसियत और सामर्थ्य की व्यापक महानता व्यक्त करता है; ‘महान’ मूल की सीधी आलंकारिक शक्ति बनाए रखता है।
- source_word: ἐξουσίᾳ
  choice: अधिकार
  rationale: यहाँ राजा के शासनाधिकार और प्रभाव का बोध है। ‘अधिकार’ केवल बल के बजाय वैध सत्ता का अर्थ भी सुरक्षित रखता है।
- source_word: χῶραι
  choice: देश
  rationale: बहुवचन χῶραι का अर्थ देश, भूभाग या प्रदेश हो सकता है। ‘देश’ आधुनिक हिन्दी में व्यापक राजनीतिक-भौगोलिक अर्थ स्वाभाविक रूप से देता है।
- source_word: εὐλαβοῦνται
  choice: डरते
  rationale: क्रिया भय-मिश्रित सावधानी या संकोच व्यक्त करती है। ‘छूने’ के साथ ‘डरते’ प्रसंग का व्यावहारिक भय स्पष्ट करता है, जबकि सूक्ष्म वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἅψασθαι
  choice: छूने
  rationale: मूल क्रिया का ठोस और सीधा अर्थ ‘छूना/हाथ लगाना’ है। ‘छूने’ से राजा की अगम्य स्थिति का चित्र सुरक्षित रहता है।
