translation:
  language: hi
  text: “हे पुरुषों, क्या दाख की मदिरा अधिक प्रबल नहीं है, क्योंकि वह मनुष्य को ऐसा करने के लिए विवश करती है?” ऐसा कहकर वह चुप हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: प्रत्यक्ष पुंलिंग बहुवचन संबोधन को गरिमापूर्ण और स्रोत-समीप रूप में रखा गया है। आधुनिक हिन्दी में यह कुछ औपचारिक है, इसलिए अधिक स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὐχ ὑπερισχύει
  choice: क्या ... अधिक प्रबल नहीं है
  rationale: ὑπερισχύω के ‘अधिक शक्तिशाली होना/बढ़कर सिद्ध होना’ अर्थ और यूनानी अलंकारिक प्रश्न—जिसका अपेक्षित उत्तर ‘हाँ’ है—दोनों को सुरक्षित रखता है।
- source_word: ὁ οἶνος
  choice: दाखमधु
  rationale: οἶνος का सटीक अर्थ अंगूर से बनी मदिरा है। ‘दाखमधु’ बाइबलीय हिन्दी में परिचित है और ‘मदिरा’ की अपेक्षा पदार्थ की पहचान अधिक स्पष्ट करता है।
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: क्योंकि वह मनुष्य को ऐसा करने के लिए विवश करता है
  rationale: ἀναγκάζει की बाध्य करने वाली शक्ति के लिए ‘विवश करता है’ और οὕτως के पूर्ववर्ती वर्णन की ओर संकेत के लिए ‘ऐसा’ चुना गया है। यूनानी में कर्म निहित है; हिन्दी की स्वाभाविकता के लिए सामान्य अर्थ में ‘मनुष्य को’ जोड़ा गया है।
- source_word: καὶ ἐσίγησεν οὕτως εἴπας
  choice: इतना कहकर वह चुप हो गया
  rationale: पूर्वकालिक कृदन्त और मुख्य क्रिया को स्वाभाविक हिन्दी क्रम में व्यक्त करता है। οὕτως यहाँ कही हुई बात की ओर संकेत करता है; ‘इतना कहकर’ अनावश्यक पुनरुक्ति से बचते हुए अर्थ बनाए रखता है।
