lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘बहुत-से लोग’ स्वाभाविक हिन्दी में इसकी मात्रा और मानवीय संदर्भ दोनों स्पष्ट करता है।
- source_word: ἀπώλοντο
  choice: नष्ट हुए
  rationale: यह चयन हानि की तीव्रता बनाए रखता है, पर अर्थ को केवल शारीरिक मृत्यु तक सीमित नहीं करता।
- source_word: ἐσφάλησαν
  choice: भटक गए
  rationale: क्रिया के निष्क्रिय/अकर्मक भाव में मार्ग से चूकने या गलती में पड़ने का अर्थ है; ‘भटक गए’ नैतिक संदर्भ में स्वाभाविक है और छल दिए जाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἡμάρτοσαν
  choice: उन्होंने पाप किया
  rationale: नैतिक-धार्मिक संदर्भ में ἁμαρτάνω का मानक और स्पष्ट हिन्दी रूप।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά यहाँ कारण व्यक्त करता है; ‘के कारण’ सीधा और मुहावरेदार अनुवाद है।
- source_word: τὰς γυναῖκας
  choice: स्त्रियों
  rationale: γυνή का बहुवचन संदर्भ के अनुसार ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है। यहाँ सामान्य, उक्तिपरक संदर्भ में व्यापक अर्थ ‘स्त्रियाँ’ मुख्य पाठ के लिए अधिक उपयुक्त है।
theological_decisions:
- issue: स्त्रियों को कारण बताने वाली संभावित रूप से आपत्तिजनक उक्ति
  choice: स्त्रियों के कारण
  alternative: पत्नियों के कारण
  rationale: यूनानी में διά + कर्मकारक स्पष्ट रूप से कारण बताता है और γυναῖκες व्यापक अर्थ में प्रयुक्त हो सकता है। पाठ की असहज रचनात्मक/धार्मिक तनातनी को नरम किए बिना सुरक्षित रखा गया है; साथ ही ‘पत्नियों’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में दी गई है।
