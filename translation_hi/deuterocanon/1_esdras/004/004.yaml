- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: एक-दूसरे से कहने लगे
  rationale: यह पारस्परिक यूनानी अभिव्यक्ति का सहज हिन्दी रूप है; प्रसंग में आरम्भ होने वाली बातचीत के लिए ‘कहने लगे’ स्वाभाविक है।
