- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: और इसके अतिरिक्त प्रति वर्ष दस तोड़े
  rationale: संक्षिप्त और कठिन यूनानी वाक्यांश के योगात्मक भाव को बनाए रखता है; ‘तोड़ा’ प्राचीन भार अथवा मुद्रा-मात्रा के रूप में प्रयुक्त है, बिना आधुनिक मूल्य आरोपित किए।
