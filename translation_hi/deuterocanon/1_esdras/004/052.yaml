translation:
  language: hi
  text: और वे वेदी पर प्रतिदिन होमबलियाँ चढ़ाएँ[a], जैसा कि उन्हें सत्रह चढ़ाने की आज्ञा है, और इसके अतिरिक्त प्रति वर्ष दस तोड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का यूनानी पाठ कठिन है और कई स्थानों पर, विशेषकर यहाँ ‘चढ़ाएँ’ अनूदित क्रिया तथा ‘प्रति वर्ष दस तोड़े’ वाले वाक्यांश में, पाठगत रूप से संकुचित प्रतीत होता है। अनुवाद उपलब्ध यूनानी पाठ के मुख्य भाव का अनुसरण करता है, पर हर विवरण के निश्चित होने का दावा नहीं करता।
    reason: textual_variant
