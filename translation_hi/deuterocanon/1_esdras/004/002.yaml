  yaml_path: translation/deuterocanon/1_esdras/004/002.yaml
  text: and to all the satraps and generals and local rulers under him[a], from India to Ethiopia, throughout the one hundred twenty-seven satrapies.
translation:
  language: hi
  text: और उसके अधीन सभी क्षत्रपों, सेनापतियों और स्थानीय शासकों को—भारत से इथियोपिया तक, एक सौ सत्ताईस क्षत्रप-प्रदेशों[a] में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक सौ सत्ताईस प्रांतों में।” यूनानी में यहाँ उसी फ़ारसी प्रशासनिक शब्द से बना पद है जिससे ऊपर “क्षत्रप” आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: क्षत्रपों
  rationale: यह विशिष्ट फ़ारसी प्रशासनिक पद है। प्रचलित हिंदी रूप ‘क्षत्रप’ मूल पद की ऐतिहासिक विशिष्टता बनाए रखता है।
- source_word: στρατηγοῖς
  choice: सेनापतियों
  rationale: यहाँ शब्द सैन्य अधिकारियों को सूचित करता है; ‘सेनापति’ स्वाभाविक हिंदी है और उन्हें क्षत्रपों तथा स्थानीय शासकों से अलग रखता है।
- source_word: τοπάρχαις
  choice: स्थानीय शासकों
  rationale: यह छोटे क्षेत्रों या जिलों के शासकों के लिए प्रयुक्त है। ‘स्थानीय शासक’ सामान्य पाठक के लिए स्पष्ट है और प्रशासनिक स्तर का भेद बनाए रखता है।
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: उसके अधीन
  rationale: यह राजा के राजनीतिक अधिकार के अधीनता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: भारत से इथियोपिया तक
  rationale: यह साम्राज्य के भौगोलिक विस्तार को बताने वाला सीधा वाक्यांश है; दोनों स्थान-नामों को उनके आधुनिक परिचित रूपों में रखा गया है।
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: एक सौ सत्ताईस क्षत्रप-प्रदेशों में
  rationale: ‘क्षत्रप-प्रदेश’ σατράπαις और σατραπείαις के शब्द-संबंध को हिंदी में बनाए रखते हुए प्रशासनिक इकाई का अर्थ भी स्पष्ट करता है। ἐν को ‘में’ रखा गया है, क्योंकि यूनानी पाठ स्थान अथवा प्रशासनिक विस्तार दोनों की गुंजाइश रखता है।
