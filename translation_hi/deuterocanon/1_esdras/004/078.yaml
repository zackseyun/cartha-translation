translation:
  language: hi
  text: और नगर की रखवाली करने वाले सभी लोगों को उसने लिखा कि उन्हें हिस्से[a] और वेतन[b] दिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हिस्से’ के लिए ‘चिट्ठी से ठहराए गए भाग’ या ‘आवंटन’ भी संभव हैं। यूनानी शब्द κλήρους उन भागों को सूचित कर सकता है जो उन्हें दिए गए थे, संभवतः चिट्ठी डालकर।
    reason: lexical_alternative
  - marker: b
    text: ‘वेतन’ के लिए ‘भुगतान’ या ‘रसद’ भी संभव हैं। यूनानी शब्द ὀψώνια सेवा के बदले मिलने वाली सामग्री या रकम, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: रखवाली करनेवाले
  rationale: वर्तमान कृदन्त नगर की निगरानी या रक्षा करनेवालों को दर्शाता है; यह रूप कालगत पक्ष को अनावश्यक रूप से सीमित नहीं करता।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις का सामान्य और प्रसंगानुकूल अर्थ 'नगर' है।
- source_word: ἔγραψε
  choice: उसने लिखित आदेश दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ 'उसने लिखा' है, पर इसके साथ आए infinitive δοῦναι से लिखित निर्देश का भाव निकलता है। हिंदी में यह रूप स्वाभाविक है और आदेशात्मक प्रसंग स्पष्ट करता है।
- source_word: δοῦναι
  choice: कि ... दिया जाए
  rationale: यह infinitive लिखी गई बात या निर्देश की विषयवस्तु बताता है; हिंदी में निष्क्रिय आश्रित उपवाक्य सहज और अर्थसंगत है।
- source_word: κλήρους
  choice: आवंटित हिस्से
  rationale: κλῆρος चिट्ठी द्वारा मिले भाग, हिस्से या आवंटन को सूचित कर सकता है। 'आवंटित हिस्से' किसी विशेष प्रक्रिया को निश्चित किए बिना प्राप्त हिस्सों का भाव रखता है।
- source_word: ὀψώνια
  choice: वेतन
  rationale: ὀψώνια सेवा के बदले मिलनेवाले वेतन, भुगतान या रसद को सूचित कर सकता है। नगर के रक्षकों के संदर्भ में 'वेतन' स्वाभाविक मुख्य पाठ है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
