  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: hi
  text: और यरूशलेम से ले जाए गए सभी पात्र वापस भेजे जाएँ[a]—वे पात्र जिन्हें कुस्रू ने अलग रखा था, जब उसने बाबेल का नाश करने[b] की मन्नत मानी थी और उन्हें वहाँ भेजने की भी मन्नत मानी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम से ले जाए गए सभी पात्र भेज दिए जाएँ—वे जिन्हें कुस्रू ने अलग निर्धारित किया था।” यूनानी वाक्य-विन्यास संक्षिप्त और कुछ असहज है; आगे के दोनों ‘मन्नत मानी’ खंड मूल में जुड़े हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बाबेल को काट डालने।” “वहाँ” से सम्भवतः यरूशलेम अभिप्रेत है, जहाँ मन्दिर के पात्र लौटाए जाने थे; पर यूनानी पाठ इसे स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: पात्रों
  rationale: मन्दिर के प्रसंग में यह शब्द पात्रों अथवा पवित्र काम में आने वाली वस्तुओं को सूचित करता है। ‘पात्र’ संक्षिप्त, स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: τὰ λημφθέντα
  choice: ले जाए गए
  rationale: यह यरूशलेम से हटाकर बाबेल ले जाई गई वस्तुओं को दर्शाता है। ‘ले जाए गए’ हिन्दी में सहज है और केवल ‘लिए गए’ की संभावित अस्पष्टता से बचता है।
- source_word: ἐκπέμψαι
  choice: वापस भेजा जाए
  rationale: क्रिया का मूल अर्थ ‘बाहर भेजना’ है, पर प्रसंग में पात्रों को यरूशलेम लौटाना अभिप्रेत है। ‘वापस’ दिशा को स्पष्ट करता है, बिना गंतव्य को मुख्य पाठ में दोहराए।
- source_word: ἐχώρισεν
  choice: अलग रखा था
  rationale: क्रिया अलग करने या पृथक निर्धारित करने का भाव रखती है। ‘अलग रखा’ मूल अर्थ और प्रशासनिक उद्देश्य दोनों को बनाए रखता है।
- source_word: ηὔξατο
  choice: मन्नत मानी थी
  rationale: यह सामान्यतः प्रार्थना करने या मन्नत मानने के लिए प्रयुक्त होता है। यहाँ दोनों infinitive के साथ एक गंभीर प्रतिज्ञा का भाव है; असामान्य ऐतिहासिक अभिव्यक्ति को सहज बनाकर मिटाया नहीं गया।
- source_word: ἐκκόψαι
  choice: नाश करने
  rationale: शाब्दिक अर्थ ‘काट डालना/काटकर अलग करना’ है; नगर बाबेल के साथ विनाश का भाव स्वाभाविक है। हिन्दी में ‘बाबेल को काट डालना’ भ्रामक होता, इसलिए ‘नाश करना’ चुना गया।
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: उन्हें वहाँ भेजने
  rationale: यूनानी में कर्म निहित और अभिव्यक्ति संक्षिप्त है। हिन्दी व्याकरण के लिए ‘उन्हें’ जोड़ा गया; ‘वहाँ’ की संदर्भगत संक्षिप्तता सुरक्षित रखी गई।
theological_decisions:
- issue: मन्नत/संकल्प की भाषा और संकुचित यूनानी वाक्य-विन्यास
  choice: ηὔξατο को ‘मन्नत मानी’ और दोनों infinitive को उसी के अधीन रखा गया।
  alternative: इसे ‘निश्चय किया’ या ‘संकल्प किया’ कहना।
  rationale: ‘निश्चय किया’ ऐतिहासिक रूप से अधिक सहज लगता, पर वह यूनानी की धार्मिक-गंभीर प्रतिज्ञा वाली भाषा को समतल कर देता। पाठ की असहजता को पठनीय हिन्दी में यथासंभव बनाए रखा गया।
- issue: ‘वहाँ’ का संकेत
  choice: मुख्य पाठ में अस्पष्ट ‘वहाँ’ रखा गया और संभावित संकेत को पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में सीधे ‘यरूशलेम’ कहना।
  rationale: संदर्भ से यरूशलेम संभावित है, पर यूनानी केवल ἐκεῖ कहता है; इसलिए स्पष्टता के नाम पर मूल की वास्तविक संक्षिप्तता को नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘कुस्रू’ और ‘बाबेल’ प्रचलित बाइबलीय नाम-रूप हैं। मूल यूनानी की पुनरुक्त ‘मन्नत’ संरचना को एक संयुक्त हिन्दी खंड में रखा गया है, ताकि वाक्य पठनीय रहे और असामान्य प्रतिज्ञा-भाव भी न मिटे।
