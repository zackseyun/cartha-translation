base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: hi
  text: हे पुरुषो, क्या स्त्रियाँ शक्तिशाली नहीं हैं? पृथ्वी विशाल है, आकाश ऊँचा है, और सूर्य अपनी दौड़ में तेज़ है[a], क्योंकि वह आकाश के चक्र में घूमता है और एक ही दिन में फिर अपने स्थान पर लौट जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मार्ग में तेज़”; यूनानी पद सूर्य को अपने पथ पर तेजी से दौड़ते हुए चित्रित करता है।
    reason: lexical_alternative
  - marker: b
    text: यह पद आकाश में सूर्य की प्रतिदिन दिखाई देने वाली गति का वर्णन सामान्य प्रेक्षण की भाषा में करता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: हे पुरुषो
  rationale: यह प्रत्यक्ष पुंलिंग बहुवचन संबोधन है; ‘हे पुरुषो’ यूनानी की आलंकारिक पुकार और उसके लिंग-विशिष्ट रूप को बनाए रखता है।
- source_word: ἰσχυραὶ
  choice: शक्तिशाली
  rationale: यहाँ विशेषण सामर्थ्य या शक्ति बताता है और प्रसंग की ‘सबसे शक्तिशाली कौन’ वाली तुलना से मेल खाता है।
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: सामान्य अर्थ ‘स्त्रियाँ’ है; इसे केवल ‘पत्नियाँ’ तक सीमित करने का कोई आवश्यक संकेत नहीं है।
- source_word: μεγάλη ἡ γῆ
  choice: पृथ्वी विशाल है
  rationale: ब्रह्मांडीय समानांतर में γῆ पूरी पृथ्वी को सूचित करता है; ‘विशाल’ उसके विस्तार और भव्यता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: आकाश ऊँचा है
  rationale: ὑψηλός का सीधा स्थानगत अर्थ ‘ऊँचा’ है; ‘आकाश’ यहाँ दृश्य ब्रह्मांडीय संदर्भ में सहज है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ταχὺς τῷ δρόμῳ
  choice: अपनी दौड़ में तेज़
  rationale: δρόμος दौड़, मार्ग या गतिपथ की सजीव छवि देता है; यह हिन्दी उस छवि को बनाए रखते हुए स्वाभाविक रहती है।
- source_word: στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: आकाश के चक्र में घूमता है
  rationale: ‘घूमता है’ और ‘चक्र’ स्रोत की दृश्य, चक्रीय गति को बिना आधुनिक खगोलीय विशिष्टीकरण के सुरक्षित रखते हैं।
- source_word: πάλιν ἀποτρέχει εἰς τὸν ἑαυτοῦ τόπον
  choice: फिर अपने स्थान को लौट जाता है
  rationale: ἀποτρέχει में वापस गति का भाव है; हिन्दी में ‘लौट जाता है’ स्वाभाविक है, जबकि ‘दौड़कर लौटता है’ पिछले दौड़-संबंधी वाक्यांश की अनावश्यक पुनरावृत्ति होती।
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: एक ही दिन में
  rationale: μιᾷ पर बल को ‘ही’ द्वारा व्यक्त किया गया है और दैनिक चक्र का समय स्पष्ट रखा गया है।
theological_decisions:
- issue: सूर्य की गति का ब्रह्मांड-वर्णन
  choice: स्रोत की दृश्य-अनुभव पर आधारित भाषा—‘घूमता है’ और ‘लौट जाता है’—को बनाए रखा गया है।
  alternative: इसे सूर्य की केवल ‘प्रतीत होने वाली’ गति के आधुनिक वैज्ञानिक विवरण में बदलना।
  rationale: यूनानी पाठ सूर्य के दैनिक दृश्य पथ का सामान्य मानवीय अनुभव की भाषा में वर्णन करता है। अनुवाद न तो इसे आधुनिक विज्ञान के अनुसार सुधारता है, न किसी विशिष्ट प्राचीन खगोलीय सिद्धांत में बाँधता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर वक्तृता की गरिमा बनाए रखने के लिए ‘हे पुरुषो’ और उलट क्रम वाले मूल वाक्य को सहज हिन्दी कथन में रूपांतरित किया गया है। ‘आकाश’ दृश्य ब्रह्मांडीय संदर्भ में ‘स्वर्ग’ से अधिक स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
