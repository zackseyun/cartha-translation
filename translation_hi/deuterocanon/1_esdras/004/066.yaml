translation:
  language: hi
  text: और यरूशलेम से ले जाए गए सभी पात्र वापस भेजे जाएँ—जिन्हें कुस्रू ने अलग रखा था, जब उसने बाबेल का नाश करने[a] की मन्नत मानी[b] थी, और उन्हें वहाँ भेजने की मन्नत मानी थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बाबेल को काट डालने।”
    reason: lexical_alternative
  - marker: b
    text: या, “प्रार्थना की थी।” यूनानी क्रिया का अर्थ “मन्नत मानना” या “प्रार्थना करना” हो सकता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में शाब्दिक रूप से, “वहाँ भेजना”; “वापस” प्रसंग से स्पष्ट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: पात्र
  rationale: मन्दिर के प्रसंग में यह शब्द पवित्र पात्रों या उपासना में प्रयुक्त वस्तुओं को सूचित करता है; ‘पात्र’ संक्षिप्त और स्वाभाविक है।
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: यरूशलेम से ले जाए गए
  rationale: कृदन्त उन पात्रों को दर्शाता है जिन्हें यरूशलेम से उठा ले जाया गया था; हिन्दी में यह निष्पक्ष और प्रसंगानुकूल है।
- source_word: ἐκπέμψαι
  choice: वहीं वापस भेजे जाएँ
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है, पर पहले यरूशलेम से ले जाए जाने के प्रसंग से लौटाया जाना निहित है; ‘वापस’ इसी प्रासंगिक दिशा को स्पष्ट करता है।
- source_word: ἃ ἐχώρισεν
  choice: जिन्हें ... अलग रखा था
  rationale: χωρίζω का अर्थ अलग करना या किसी उद्देश्य के लिए पृथक रखना है; ‘अलग रखा’ संभावित प्रशासनिक या पवित्र प्रयोजन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Κῦρος
  choice: कुस्रू
  rationale: यह नाम आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित रूप में दिया गया है।
- source_word: ηὔξατο
  choice: मन्नत मानी
  rationale: अनन्त क्रियाओं के साथ यह क्रिया यहाँ प्रार्थना करने के बजाय मन्नत या गंभीर प्रतिज्ञा करने का अर्थ अधिक स्वाभाविक रूप से देती है।
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: बाबेल का नाश करने
  rationale: शाब्दिक अर्थ ‘बाबेल को काट डालना/काट देना’ है; नगर के विषय में ‘नाश करना’ हिन्दी में स्वाभाविक रूप से अभिप्रेत विनाश व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: उन्हें वहाँ भेजने
  rationale: ἐξαποστέλλω प्रबल रूप से भेजने को व्यक्त करता है; कर्म को हिन्दी में स्पष्ट करने के लिए ‘उन्हें’ जोड़ा गया है, और ἐκεῖ को ‘वहाँ’ रखा गया है।
theological_decisions:
- issue: कुस्रू के कार्य के संदर्भ में ηὔξατο का अर्थ
  choice: मन्नत मानी
  alternative: प्रार्थना की
  rationale: इसके बाद आने वाली अनन्त क्रियाएँ किसी गंभीर संकल्प या मन्नत के अर्थ का समर्थन करती हैं; फिर भी ‘प्रार्थना की’ शब्द का संभव अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ἐκπέμψαι में वापसी की निहित दिशा
  choice: वहीं वापस भेजे जाएँ
  alternative: वहाँ भेजे जाएँ
  rationale: पात्र यरूशलेम से ले जाए गए थे, इसलिए प्रसंग उनकी वापसी बताता है; यूनानी में ‘वापस’ स्पष्ट रूप से नहीं है, अतः शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: ἐκκόψαι Βαβυλῶνα की रूपकात्मक अभिव्यक्ति
  choice: बाबेल का नाश करने
  alternative: बाबेल को काट डालने
  rationale: नगर के संबंध में यूनानी ‘काट देना’ विनाश का रूपक है। मुख्य पाठ में अर्थ-स्पष्ट हिन्दी रखी गई है और असामान्य शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की यूनानी संरचना और पुनरुक्ति को यथासंभव बनाए रखते हुए हिन्दी में कर्म ‘उन्हें’ स्पष्ट किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
