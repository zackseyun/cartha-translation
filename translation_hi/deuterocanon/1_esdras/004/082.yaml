  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: hi
  text: धन्य हैं आप, जिन्होंने मुझे बुद्धि दी; और मैं आपका धन्यवाद करता हूँ[a], हे पूर्वजों के स्वामी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं आपके सामने स्वीकार करता हूँ” अथवा “मैं आपकी स्तुति करता हूँ।” यूनानी क्रिया खुले रूप से स्वीकार करने, अंगीकार करने, स्तुति करने या धन्यवाद देने का भाव रख सकती है। यहाँ बुद्धि मिलने के बाद परमेश्वर को संबोधित आशीर्वाद के संदर्भ में “धन्यवाद करता हूँ” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: धन्य हैं आप
  rationale: यह परमेश्वर को सीधे संबोधित करने वाला आशीर्वाद-सूत्र है। ‘धन्य हैं आप’ यूनानी विधेय विशेषण और स्पष्ट क्रिया, दोनों को स्वाभाविक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἔδωκάς μοι σοφίαν
  choice: जिन्होंने मुझे बुद्धि दी
  rationale: अओरिस्ट क्रिया को हिन्दी के सामान्य पूर्ण भूतकाल ‘दी’ से व्यक्त किया गया है; ‘बुद्धि’ σοφία का प्रचलित और संदर्भानुकूल समतुल्य है।
- source_word: σοὶ ὁμολογῶ
  choice: मैं आपका धन्यवाद करता हूँ[a]
  rationale: प्रार्थना और स्तुति के इस संदर्भ में ὁμολογῶ कृतज्ञतापूर्ण सार्वजनिक स्वीकार या प्रशंसा का भाव रख सकता है। ‘धन्यवाद करता हूँ’ आधुनिक हिन्दी में संदर्भगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: δέσποτα
  choice: हे ... स्वामी
  rationale: ‘स्वामी’ पूर्ण अधिकार सूचित करता है और δέσποτα को सामान्यतः κύριος के लिए प्रयुक्त ‘प्रभु’ से अलग रखता है। संबोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: τῶν πατέρων
  choice: पूर्वजों के
  rationale: यहाँ πατέρων का आशय पुरखों या पूर्वजों से है। यूनानी में कोई स्वत्ववाचक सर्वनाम नहीं है, इसलिए ‘हमारे’ नहीं जोड़ा गया। ‘पूर्वज’ आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है।
theological_decisions:
- issue: ईश्वरीय संबोधन में δέσποτα का अनुवाद
  choice: स्वामी
  alternative: प्रभु; सर्वोच्च शासक
  rationale: ‘स्वामी’ यूनानी पद में निहित अधिकार के प्रबल भाव को बनाए रखता है और इसे κύριος से अनावश्यक रूप से नहीं मिलाता।
- issue: प्रार्थना में ὁμολογῶ का अर्थ
  choice: मैं आपका धन्यवाद करता हूँ
  alternative: मैं आपके सामने स्वीकार करता हूँ; मैं आपका अंगीकार करता हूँ; मैं आपकी स्तुति करता हूँ
  rationale: इस आशीर्वादात्मक प्रसंग में ‘स्वीकार करता हूँ’ आधुनिक पाठक को पाप-स्वीकार की ओर भटका सकता है। ‘धन्यवाद करता हूँ’ उपासना और प्राप्त बुद्धि के प्रति कृतज्ञता को स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: τῶν πατέρων में निहित संबंध
  choice: पूर्वजों के
  alternative: हमारे पूर्वजों के
  rationale: मूल यूनानी में ‘हमारे’ नहीं है। उसे न जोड़ने से पाठ की औपचारिक अनिश्चितता और स्रोत की संरचना बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनात्मक और गरिमापूर्ण है, पर अनावश्यक रूप से पुरातन नहीं। ‘पूर्वज’ सामान्य पाठक के लिए स्पष्ट है; ‘स्वामी’ δέσποτα की प्रबल अधिकार-सूचकता बनाए रखता है।
