  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: hi
  text: और उसने लिखित आदेश दिया कि लेवियों को निर्वाह-व्यवस्था उस दिन तक दी जाए जिस दिन भवन पूरा हो जाए और यरूशलेम बनाया जाए।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्वाह-व्यवस्था’ का अर्थ लेवियों के लिए प्रावधान, भत्ता, आवश्यक सामग्री, या आपूर्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘भवन’ से यहाँ मन्दिर अभिप्रेत है।
    reason: cross_reference
  - marker: c
    text: या, ‘यरूशलेम फिर से बनाया जाए।’ यूनानी में केवल ‘बनाया जाए’ है, यद्यपि प्रसंग पुनर्निर्माण का है। ‘उस दिन तक’ के बाद का यूनानी वाक्य-विन्यास कुछ असहज है, पर आशय यह है कि यह निर्वाह-व्यवस्था मन्दिर के पूरा होने और यरूशलेम के बनाए जाने तक जारी रहे।
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: उसने लिखित आदेश दिया कि
  rationale: क्रिया का मूल अर्थ ‘उसने लिखा’ है, पर यहाँ यह राजकीय लिखित निर्देश की विषय-वस्तु प्रस्तुत करती है। यह रूप हिन्दी में स्वाभाविक रहते हुए लिखित आदेश का भाव स्पष्ट करता है।
- source_word: δοῦναι
  choice: दी जाए
  rationale: यह infinitive लिखित निर्देश के अधीन अपेक्षित कार्य बताता है; हिन्दी में कर्मवाच्य विधिक रूप आदेश के भाव को सहजता से व्यक्त करता है।
- source_word: τὴν χορηγίαν
  choice: सहायता
  rationale: यह शब्द खर्च, निर्वाह या आवश्यक सामग्री उपलब्ध कराने का व्यापक भाव रखता है। ‘सहायता’ किसी एक प्रकार की आपूर्ति को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τοῖς Λευείταις
  choice: लेवियों को
  rationale: यह दत्तिव कारक में अप्रत्यक्ष कर्म है; समुदाय के नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: ἕως τῆς ἡμέρας
  choice: उस दिन तक
  rationale: यूनानी की कालवाचक संरचना और सहायता जारी रहने की अंतिम सीमा दोनों सुरक्षित रहती हैं।
- source_word: ᾖ ἐπιτελεσθῇ
  choice: जब ... पूरा हो जाए
  rationale: प्रेषित यूनानी पाठ व्याकरण की दृष्टि से कुछ असहज है, पर भाव भावी पूर्णता का है। यह हिन्दी रूप उसी संभावित समय-सीमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ οἶκος
  choice: भवन
  rationale: οἶκος का शाब्दिक अर्थ ‘घर/भवन’ है और प्रसंग में यह मन्दिर को सूचित करता है। ‘भवन’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी उसका संदर्भ स्पष्ट करती है।
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: यरूशलेम बनाया जाए
  rationale: यूनानी में क्रिया केवल ‘बनाया जाए’ कहती है; पुनर्स्थापना के प्रसंग से ‘फिर से बसाया/बनाया जाए’ सम्भव है, पर मुख्य पाठ में वह अर्थ जोड़ा नहीं गया।
theological_decisions:
- issue: ‘भवन’ का संदर्भ
  choice: मुख्य पाठ में ‘भवन’ रखकर पादटिप्पणी में इसे मन्दिर बताना
  alternative: मुख्य पाठ में सीधे ‘मन्दिर’ कहना
  rationale: पुनर्निर्माण के इस प्रसंग में ‘भवन’ यरूशलेम के मन्दिर का संकेत है। फिर भी मूल यूनानी की बाइबलीय अभिव्यक्ति को बनाए रखने से अनुवाद व्याख्या को पाठ में विलीन नहीं करता।
- issue: यरूशलेम का बनना या पुनर्निर्माण होना
  choice: मुख्य पाठ में ‘बनाया जाए’
  alternative: ‘फिर से बनाया जाए’ या ‘पुनर्निर्मित किया जाए’
  rationale: ऐतिहासिक प्रसंग पुनर्निर्माण का है, लेकिन यूनानी क्रिया में ‘पुनः’ स्पष्ट नहीं है। अतः मुख्य पाठ शाब्दिक सीमा बनाए रखता है और पादटिप्पणी प्रसंगगत विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लिखित आदेश’, ‘सहायता’ और ‘पूरा हो जाए’ प्रशासनिक प्रसंग को स्पष्ट करते हैं; ‘भवन’ मूल यूनानी की अभिव्यक्ति को सुरक्षित रखता है।
