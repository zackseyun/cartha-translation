  yaml_path: translation/deuterocanon/1_esdras/004/053.yaml
  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: hi
  text: और उन सब लोगों को, जो नगर का निर्माण करने के लिए बाबुल प्रदेश से ऊपर जाएँ, स्वतंत्रता[a] मिले—उन्हें, उनके बच्चों को, और उन सभी याजकों को जो ऊपर जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वाधीनता’; इस राजकीय आदेश के संदर्भ में इसका अर्थ कानूनी विशेषाधिकार या कुछ दायित्वों से छूट भी हो सकता है, पर यूनानी पाठ इसका ठीक दायरा नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: ऊपर जाएँ
  rationale: निर्वासन से लौटकर यरूशलेम जाने के संदर्भ में यह अभिव्यक्ति भौगोलिक चढ़ाई और पारंपरिक धार्मिक भाव, दोनों को बनाए रखती है।
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: बाबुल प्रदेश से
  rationale: यूनानी में नगर के बजाय क्षेत्र Βαβυλωνία का नाम है; ‘बाबुल प्रदेश’ आधुनिक हिन्दी में यह भेद स्पष्ट करता है।
- source_word: κτίσαι τὴν πόλιν
  choice: नगर का निर्माण करने के लिए
  rationale: κτίζω का अर्थ बसाना या निर्माण करना हो सकता है। पुनर्निर्माण का ऐतिहासिक संदर्भ होने पर भी यूनानी पाठ में ‘फिर से’ स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: स्वतंत्रता मिले
  rationale: यह राजकीय आदेश के रूप में किसी अधिकार या स्वतंत्रता के प्रदान किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλευθερίαν
  choice: स्वतंत्रता
  rationale: यह व्यापक अर्थ को सुरक्षित रखता है; प्रशासनिक संदर्भ में कानूनी विशेषाधिकार या कुछ दायित्वों से छूट भी अभिप्रेत हो सकती है, पर उसका ठीक दायरा निर्दिष्ट नहीं है।
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: उन्हें भी, उनकी संतानों को भी
  rationale: τέκνα का सीधा अर्थ संतान या बच्चे है। ‘संतानों’ से सामूहिक अर्थ स्वाभाविक ढंग से आता है, बिना अनिश्चित रूप से दूर के वंशजों पर बल दिए।
- source_word: πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: उन सभी याजकों को भी जो ऊपर जाएँ
  rationale: ‘ऊपर जाएँ’ की पुनरावृत्ति यूनानी संरचना को बनाए रखती और याजकों को उसी वापसी-यात्रा से जोड़ती है।
