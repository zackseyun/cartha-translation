  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: hi
  text: और उन्होंने अपने पूर्वजों के परमेश्वर को धन्य कहा, क्योंकि उसने उन्हें राहत और छुटकारा[a] दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्राम और स्वतंत्रता।” यूनानी शब्द कष्ट या दबाव कम होने और रिहाई या स्वतंत्रता मिलने का भाव दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  choice: धन्य कहा
  rationale: परमेश्वर के कर्म के प्रत्युत्तर में प्रयुक्त इस क्रिया का शाब्दिक और बाइबलीय भाव ‘धन्य कहना’ है। ‘स्तुति की’ अधिक सहज विकल्प है, पर वह मूल क्रिया की विशिष्ट अभिव्यक्ति को कुछ सामान्य बना देता है।
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह चयन इस बाइबलीय पदबंध के ऐतिहासिक और वाचागत संबंध को बनाए रखता है तथा आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक सहज है।
- source_word: ἔδωκεν
  choice: दिया था
  rationale: यूनानी अओरिस्ट एक पूरे हुए कार्य को बताता है; हिन्दी में ‘दिया था’ स्वाभाविक रूप से दिखाता है कि परमेश्वर को धन्य कहना पहले मिल चुके उपकार का प्रत्युत्तर था।
- source_word: ἄνεσιν
  choice: राहत
  rationale: यह शब्द दबाव, कष्ट या संकट के कम होने का भाव देता है। ‘राहत’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἄφεσιν
  choice: छुटकारा
  rationale: यहाँ ἄνεσιν के साथ इसका संबंध ऐतिहासिक बंधन या संकट से छूटने का संकेत देता है। ‘छुटकारा’ इस व्यापक अर्थ को रखता है और अनावश्यक रूप से पाप-क्षमा का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: गैर-अनुष्ठानिक ऐतिहासिक प्रसंग में ἄφεσιν का अर्थ
  choice: छुटकारा
  alternative: मुक्ति; स्वतंत्रता; क्षमा
  rationale: यद्यपि ἄφεσις का अर्थ ‘क्षमा’ भी हो सकता है, यहाँ निकटवर्ती शब्द ἄνεσιν और ऐतिहासिक छुटकारे का प्रसंग बंधन या संकट से रिहाई की ओर संकेत करते हैं। ‘छुटकारा’ अर्थ की व्यापकता बनाए रखता है और पद में न कही गई पाप-क्षमा संबंधी व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पूर्वजों के परमेश्वर’ पारंपरिक बाइबलीय संबंध को स्पष्ट करता है, जबकि ‘धन्य कहा’ मूल क्रिया की अभिव्यक्ति को सुरक्षित रखता है।
