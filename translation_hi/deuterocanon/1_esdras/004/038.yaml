  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। समानांतर यूनानी क्रियाओं का भेद रखा गया है और अंतिम काल-वाक्यांश की उत्कर्षात्मक शक्ति ‘युगानुयुग’ से व्यक्त की गई है।
