translation:
  language: hi
  text: और सत्य सदा बना रहता है और सामर्थी है; वह युगानुयुग जीवित रहता और प्रबल रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: निश्चित पदबंध को हिन्दी में स्वाभाविक रूप से ‘सत्य’ कहा गया है; क्रियाएँ इसके आलंकारिक व्यक्तिकरण को स्पष्ट रखती हैं।
- source_word: μένει
  choice: बना रहता है
  rationale: निरंतर स्थिर रहने का भाव आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἰσχύει
  choice: सामर्थी रहता है
  rationale: सत्य की अंतर्निहित शक्ति को व्यक्त करते हुए इसे बाद के κρατεῖ से अलग रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: इस यूनानी काल-सूचक मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: ζῇ
  choice: जीवित रहता है
  rationale: सत्य के सजीव व्यक्तिकरण को सीधे सुरक्षित रखता है।
- source_word: κρατεῖ
  choice: प्रबल रहता है
  rationale: सक्रिय प्रभुत्व और विजय का भाव देता है तथा ἰσχύει के सामान्य शक्ति-बोध से भिन्न रहता है।
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: युगानुयुग
  rationale: तीव्र और चरम काल-अभिव्यक्ति को गरिमापूर्ण, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सत्य का व्यक्तिकरण
  choice: ‘वह जीवित रहता और ... प्रबल रहता है’ जैसी व्यक्तिगत क्रियाएँ बनाए रखी गईं
  alternative: इसे अमूर्त कथन बनाना, जैसे ‘सत्य चिरस्थायी और प्रभावशाली है’
  rationale: यूनानी पाठ सत्य को स्पष्टतः जीने और प्रबल होने वाली सत्ता के रूप में चित्रित करता है; इसे बनाए रखना बिना अतिरिक्त धर्मवैज्ञानिक पहचान जोड़े मूल अलंकार की रक्षा करता है।
