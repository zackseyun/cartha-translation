  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
translation:
  language: hi
  text: और उन्होंने खाया-पिया, और तृप्त होकर वे चले गए। परन्तु राजा दारा अपने शयन-कक्ष में गया और सो गया; फिर वह जाग उठा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: उन्होंने खाया-पिया
  rationale: दोनों सामान्य कथात्मक क्रियाओं को स्वाभाविक हिन्दी संयुक्त क्रिया के रूप में रखा गया है; इससे खाने और पीने, दोनों क्रियाएँ स्पष्ट बनी रहती हैं।
- source_word: ἐμπλησθέντες
  choice: तृप्त होकर
  rationale: यह कृदन्त भोजन-पान के बाद भर जाने या तृप्त होने की अवस्था बताता है। ‘तृप्त होकर’ आधुनिक हिन्दी में स्वाभाविक है और आशय को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: ἀνέλυσαν
  choice: वे चले गए
  rationale: इस भोज-संदर्भ में क्रिया का अर्थ वहाँ से विदा होना या चले जाना है। ‘चले गए’ सामान्य पाठक के लिए सहज और कथात्मक है।
- source_word: ὁ Δαρεῖος ὁ βασιλεὺς
  choice: राजा दारा
  rationale: ग्रीक पदक्रम का अर्थ स्वाभाविक हिन्दी नाम-उपाधि क्रम में दिया गया है।
- source_word: κοιτῶνα
  choice: शयन-कक्ष
  rationale: शब्द निजी सोने के कमरे को सूचित करता है। ‘शयन-कक्ष’ राजकीय परिवेश के अनुकूल, स्पष्ट और गरिमापूर्ण है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: साधारण भूतकालीन कथन को स्वाभाविक हिन्दी में प्रस्तुत किया गया है; इसमें नींद आने की घटना स्पष्ट है।
- source_word: ἔξυπνος ἐγένετο
  choice: वह जाग उठा
  rationale: शाब्दिक अर्थ ‘जाग्रत हुआ’ है। ‘जाग उठा’ वर्तमान हिन्दी में सहज है और घटनाक्रम को ठीक प्रकार व्यक्त करता है।
