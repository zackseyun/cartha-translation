lexical_decisions:
- source_word: εὐλαβήθητε
  choice: सावधान रहो
  rationale: चेतावनी के प्रसंग में यह आज्ञार्थक रूप सतर्क रहने का आग्रह करता है। ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक है और इसे भक्ति या श्रद्धा के अर्थ में जाने से बचाता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष और चेतावनी के तार्किक संबंध को स्पष्ट रखता है।
- source_word: μὴ καὶ ὑμεῖς
  choice: कहीं ऐसा न हो कि तुम भी
  rationale: निषेधात्मक चेतावनी का स्वाभाविक हिन्दी रूप है और καὶ ὑμεῖς का ‘तुम भी’ सुरक्षित रखता है।
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  choice: समान बनकर ... समान बन जाओ
  rationale: यूनानी में एक ही क्रिया कृदंत और मुख्य क्रिया के रूप में दोहराई गई है। हिन्दी में जानबूझकर की गई यह पुनरावृत्ति मूल की बलाघातपूर्ण, किंचित असामान्य अभिव्यक्ति को बनाए रखती है।
- source_word: τοῖς ἀλλοφύλοις
  choice: पराए लोगों
  rationale: शब्द का मूल अर्थ दूसरे कुल या समुदाय के लोगों से है। ‘पराए लोगों’ से यह अर्थ सरलता से आता है, जबकि ‘अन्यजाति’ या ‘गैर-यहूदी’ जैसे तकनीकी धार्मिक अर्थ अनावश्यक रूप से आरोपित नहीं होते।
- source_word: φόβος ὑμᾶς λάβῃ
  choice: भय तुम्हें जकड़ ले
  rationale: यह भय को मनुष्य पर अधिकार कर लेने वाली शक्ति के रूप में प्रस्तुत करने वाली यूनानी सजीवता को सहज हिन्दी में बनाए रखता है।
- source_word: ἐπʼ αὐτοῖς
  choice: उनके कारण
  rationale: ἐπί के इस प्रयोग में कारण या संबंध का भाव संभव है। सर्वनाम का संदर्भ स्पष्ट किए बिना ‘उनके कारण’ मूल की संदर्भगत खुली गुंजाइश को सुरक्षित रखता है।
theological_decisions:
- issue: ἀφομοιόω की दोहराई गई चेतावनी का आशय
  choice: पराए लोगों के समान हो जाने की व्यापक भाषा को बनाए रखा गया है, जो निकट प्रसंग में उनकी मूर्तिपूजक रीति का अनुकरण करने की चेतावनी है।
  alternative: इसे सामान्य सामाजिक या जातीय घुलने-मिलने के विरुद्ध निषेध के रूप में स्पष्ट करना।
  rationale: निकट प्रसंग मूर्तियों के भय और आसपास के लोगों के अनुकरण से संबंधित है, पर पद स्वयं समान हो जाने की व्यापक भाषा रखता है। अनुवाद किसी जातीय अलगाववादी अर्थ को आरोपित किए बिना इसी तनाव को रहने देता है।
- issue: ἐπʼ αὐτοῖς में αὐτοῖς का संदर्भ
  choice: ‘उनके कारण’ कहकर संदर्भ को खुला रखा गया है।
  alternative: इसे केवल पराए लोगों अथवा केवल उनकी मूर्तियों का स्पष्ट संदर्भ मानना।
  rationale: व्याकरण और निकट प्रसंग दोनों संभावनाओं को पूरी तरह बंद नहीं करते; इसलिए मुख्य पाठ में अनावश्यक स्पष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण चेतावनी-शैली अपनाई गई है। मूल यूनानी की असामान्य क्रिया-पुनरावृत्ति को मुख्य पाठ में जानबूझकर बनाए रखा गया है और उसके अधिक शाब्दिक निष्क्रिय रूप को पादटिप्पणी में दिया गया है।
