review_pass:
  verdict: revise
  source_fidelity: The draft changes the referent of αὐτοὶ from the idols themselves to people who do not abandon idols. This is not supported by the supplied Greek audit trail, which identifies the emphatic subject as the idols, and it disrupts the polemical logic of the final clause. The neuter αὐτά should remain unspecified as “them.” The concessive participle νοήσαντες should be retained without resolving the verse’s deliberately ironic tension with “for they have no perception.”
  naturalness: The Hindi is generally fluent, but “फिर भी” duplicates the concessive force already expressed by “...पर भी” and has no corresponding force in καί. A direct coordinated opening is more natural and closer to the Greek. “यद्यपि वे समझते हैं” is clear, formal modern Hindi and preserves the source ambiguity/tension.
  terminology: “विवेक” is too interpretive for αἴσθησις, which denotes perception, sensation, or awareness rather than prudential or moral discernment. “संवेदना” more directly conveys the absence of perceptive capacity in this idol-polemic context. The footnote should not introduce “इसे,” since the Greek participle has no expressed object.
  issues:
  - severity: high
    issue: The translation and notes identify “वे स्वयं” as human worshippers rather than the idols.
    rationale: The provided source and English audit trail take αὐτοὶ emphatically as the idols themselves. Rendering humans as the subject makes “क्योंकि उनमें विवेक नहीं है” apply to those people and alters the source’s polemic.
  - severity: medium
    issue: “विवेक” over-specifies αἴσθησις.
    rationale: It can imply judgment or moral discernment. The Greek more basically denotes perception/awareness; “संवेदना” better preserves this.
  - severity: low
    issue: “फिर भी” is redundant alongside “...पर भी.”
    rationale: The Greek begins with καὶ (“and”), while the concessive nuance is already carried by νοήσαντες.
  revised_text: और वे स्वयं, यद्यपि वे समझते हैं, उन्हें छोड़ नहीं सकते[a], क्योंकि उनमें संवेदना नहीं है।
  revised_footnotes:
