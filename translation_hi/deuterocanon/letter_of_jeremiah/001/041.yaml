revisions:
- from: फिर भी वे स्वयं यह समझ जाने पर भी उन्हें छोड़ नहीं सकते[a], क्योंकि उनमें विवेक नहीं है।
  to: और वे स्वयं, यद्यपि वे समझते हैं, उन्हें छोड़ नहीं सकते[a], क्योंकि उनमें संवेदना नहीं है।
  rationale: The revision restores the idols as the emphatic subject, retains the unspecified referent of αὐτά as “उन्हें,” and preserves the Greek’s ironic juxtaposition of apparent understanding with lack of perception. It also replaces the interpretive “विवेक” with the more source-near “संवेदना” and removes an unnecessary discourse marker.
