  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: hi
  text: और वे स्वयं, यद्यपि वे समझते हैं, उन्हें छोड़ नहीं सकते[a], क्योंकि उनमें संवेदना नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे स्वयं समझकर उन्हें नहीं छोड़ सकते।” यूनानी कृदंत νοήσαντες को अधिक शाब्दिक रूप से ऐसे लिया जा सकता है; प्रसंग में इसका रियायती अर्थ “यद्यपि वे समझते हैं” अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύνανται
  choice: नहीं सकते
  rationale: यह δύναμαι से व्यक्त असमर्थता का सहज और सीधा हिन्दी रूप है।
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: बलाघाती सर्वनाम का जोर बनाए रखता है; निकटवर्ती प्रसंग में इसका संकेत उन लोगों की ओर है जो मूर्तियों की निर्बलता देखकर भी उन्हें नहीं छोड़ते।
- source_word: νοήσαντες
  choice: यह समझ जाने पर भी
  rationale: 'νοέω के कृदंत को प्रसंगानुसार रियायती अर्थ में लिया गया है: स्पष्ट बात समझ में आ जाने पर भी वे उसके अनुरूप कार्य नहीं करते।'
- source_word: καταλιπεῖν
  choice: छोड़
  rationale: यहाँ अर्थ उन मूर्तियों को त्याग देना है; संक्षिप्त 'छोड़ना' हिन्दी में स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: αὐτά
  choice: उन्हें
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का संकेत प्रसंग की मूर्तियों की ओर है; हिन्दी में 'उन्हें' सहज है।
- source_word: αἴσθησιν
  choice: विवेक
  rationale: αἴσθησις बोध, समझ या परख की क्षमता बताता है। इस व्यंग्यात्मक प्रसंग में 'विवेक' केवल इंद्रिय-बोध से अधिक स्वाभाविक ढंग से आशय व्यक्त करता है।
- source_word: οὐκ ἔχουσιν
  choice: उनमें ... नहीं है
  rationale: अभाव व्यक्त करने वाला स्वाभाविक हिन्दी विन्यास है।
theological_decisions:
- issue: बलाघाती सर्वनाम αὐτοὶ का संदर्भ
  choice: इसे मूर्तियों की निर्बलता देखकर भी उन्हें न छोड़ने वाले लोगों के लिए समझा गया है।
  alternative: इसे स्वयं मूर्तियों के लिए समझा जा सकता है, मानो वे अपने आसपास की वस्तुओं को छोड़ने में असमर्थ हों।
  rationale: निकटवर्ती प्रसंग में कसदियों द्वारा बेल से गूँगे को बोलवाने की विडंबना देखकर भी मूर्तिपूजा न छोड़ने की बात है। इसलिए मानवीय कर्ता और मूर्तियों को कर्म मानना संदर्भ तथा αὐτά के भेद के अनुकूल है।
- issue: νοήσαντες का संबंध
  choice: 'रियायती: ''समझ जाने पर भी''।'
  alternative: 'अधिक शाब्दिक रूप से: ''समझकर'' या ''समझ लेने के बाद''।'
  rationale: रियायती रूप वाक्य की विडंबना और तर्क को स्पष्ट करता है, पर कृदंत का अधिक शाब्दिक संबंध भी व्याकरणतः संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। 'फिर भी' और '...पर भी' साथ मिलकर यूनानी वाक्य की तीखी विडंबना को उभारते हैं; 'विवेक' साधारण पाठक के लिए बोध और सही परख, दोनों का भाव देता है।
