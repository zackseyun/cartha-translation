  rationale: बहुवचन θεοί का सामान्य और प्रसंगानुकूल हिन्दी समतुल्य है; यहाँ मूर्तियों द्वारा निरूपित कथित देवताओं पर विवादात्मक बल बना रहता है।
- source_word: μὴ οὖν φοβεῖσθε
  choice: इसलिए ... मत डरो
  rationale: निषेध के साथ οὖν की निष्कर्षसूचक शक्ति को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αὐτά
  choice: उनसे
  rationale: यूनानी नपुंसकलिंग सर्वनाम का संकेत चर्चा में आई मूर्तियों की ओर है। हिन्दी में भय के साथ ‘उनसे’ स्वाभाविक है और मूल में निहित संज्ञा को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: ‘वे’ और ‘उनसे’ का संदर्भ
  choice: सर्वनामों को बनाए रखा गया है; वे चर्चा में आई मूर्ति-प्रतिमाओं को कथित देवताओं के रूप में इंगित करते हैं और उनकी वास्तविक देवता-सत्ता का निषेध करते हैं।
  alternative: इन्हें अधिक व्यापक रूप से उन प्रतिमाओं द्वारा निरूपित गैर-इस्राएली देवताओं का संदर्भ माना जा सकता है।
  rationale: तात्कालिक प्रसंग बनाई हुई उपासना-प्रतिमाओं की असमर्थता उजागर करता है। मूल यूनानी की संदर्भगत व्यापकता को किसी एक व्याख्या तक सीमित न करते हुए हिन्दी में सर्वनाम सुरक्षित रखे गए हैं।
