  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: hi
  text: वे अपने ही मामले का न्याय नहीं कर सकते[a], और न अन्याय से पीड़ित किसी व्यक्ति को छुड़ा सकते हैं, क्योंकि वे असमर्थ हैं;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपने लिए न्याय का निर्णय नहीं कर सकते और न अन्याय से (किसी को) छुड़ा सकते हैं।” यूनानी वाक्य संक्षिप्त है। ἀδίκημα का शाब्दिक अर्थ “अन्याय/अनुचित कार्य” भी हो सकता है; प्रसंगानुसार यह अन्याय से पीड़ित व्यक्ति या अन्याय की स्थिति की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσίν
  choice: मामले का न्याय
  rationale: κρίσις यहाँ न्यायिक निर्णय या विवाद का संकेत देता है। ‘मामले का न्याय’ आधुनिक हिन्दी में कानूनी भाव को स्पष्ट रखता है।
- source_word: διακρίνωσιν
  choice: न्याय कर सकते
  rationale: κρίσις के साथ διακρίνω का अर्थ किसी मामले का निर्णय या न्याय करना है।
- source_word: ἑαυτῶν
  choice: अपने ही
  rationale: सम्बन्धवाचक सर्वनाम बताता है कि मामला मूर्तियों से स्वयं सम्बन्धित है; ‘अपने ही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ῥύσωνται
  choice: छुड़ा सकते
  rationale: ῥύομαι संकट, अत्याचार या विपत्ति से बचाने अथवा छुड़ाने को व्यक्त करता है। ‘छुड़ाना’ यहाँ सहज है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἀδίκημα
  choice: किसी अन्याय से
  rationale: ἀδίκημα का सामान्य अर्थ अन्याय, अनुचित कार्य या अपराध है। यूनानी पद संक्षिप्त और कुछ अस्पष्ट है, इसलिए मुख्य पाठ में अमूर्त अर्थ रखा गया है और वैकल्पिक ठोस अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀδύνατοι ὄντες
  choice: क्योंकि वे असमर्थ हैं
  rationale: कृदन्त पद पहले कही गई अक्षमता का कारण देता है; ‘क्योंकि’ उस कारणात्मक सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: मूर्तियों की अक्षमता का स्वरूप
  choice: कथन को न्याय करने और अन्याय से छुड़ाने की व्यावहारिक अक्षमता तक सीमित रखा गया है।
  alternative: इसे मूर्तियों के अस्तित्व या स्वरूप के विषय में अधिक व्यापक तत्त्वमीमांसात्मक कथन बनाया जा सकता था।
  rationale: पद प्रत्यक्षतः उनके न्याय करने और छुड़ाने में असमर्थ होने की बात करता है; इससे आगे कोई साम्प्रदायिक या तत्त्वमीमांसात्मक निष्कर्ष जोड़ना पाठ की सीमा से बाहर होगा।
- issue: ἀδίκημα की अस्पष्टता
  choice: मुख्य पाठ में ‘अन्याय’ का अमूर्त अर्थ रखा गया है।
  alternative: ‘जिसके साथ अन्याय हुआ है’ जैसे पीड़ित व्यक्ति के अर्थ में समझना सम्भव है।
  rationale: ἀδίκημα सामान्यतः अन्याय या अनुचित कार्य को दर्शाता है, पर ῥύομαι के साथ प्रसंगगत अर्थ पीड़ित व्यक्ति या अन्याय की स्थिति तक फैल सकता है; पादटिप्पणी दोनों सम्भावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘मामले का न्याय’, ‘छुड़ा सकते’ और ‘असमर्थ’ सामान्य पाठक के लिए स्पष्ट हैं। यूनानी की वास्तविक संक्षिप्तता और ἀδίκημα की अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
