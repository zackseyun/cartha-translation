  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: hi
  text: ये बढ़इयों और सुनारों के बनाए हुए हैं; कारीगर इन्हें जैसा बनाना चाहते हैं, ये वैसा ही बन सकते हैं, और कुछ नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων καὶ χρυσοχόων
  choice: बढ़इयों और सुनारों के
  rationale: ὑπό कर्ता-सूचक है और दोनों संबंधकारक संज्ञाओं को निर्माण करने वालों के रूप में प्रस्तुत करता है। ‘बढ़ई’ और ‘सुनार’ क्रमशः लकड़ी तथा सोने का काम करने वाले विशिष्ट कारीगरों को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: κατεσκευασμένα εἰσίν
  choice: बनाए हुए हैं
  rationale: यह पूर्ण निष्क्रिय भाव को बनाए रखता है और मूर्तियों को मनुष्यों द्वारा गढ़ी गई वस्तुओं के रूप में स्पष्ट करता है।
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: उसके सिवा और कुछ नहीं बन सकते
  rationale: 'यह निषेध और सीमा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है: वे अपने निर्माताओं की इच्छा से अलग कोई रूप या अस्तित्व नहीं पा सकते।'
- source_word: βούλονται
  choice: चाहते हैं
  rationale: यह कारीगरों की इच्छा या अभिप्राय को सीधे और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ τεχνῖται
  choice: कारीगर
  rationale: यह कुशल निर्माताओं के लिए व्यापक शब्द है और पहले आए विशिष्ट पेशों—बढ़ई और सुनार—दोनों को समेटता है।
- source_word: αὐτὰ γενέσθαι
  choice: इन्हें जैसा बनाना
  rationale: हिन्दी वाक्य-विन्यास में यह कारीगरों द्वारा चाही गई परिणति को स्पष्ट करता है; साथ ही γένηται और γενέσθαι की पुनरावृत्त धारणा ‘बनाना/बन सकते’ में बनी रहती है।
theological_decisions:
- issue: मूर्तियों के विषय में कथन का आशय
  choice: मूर्तियाँ पूरी तरह मानवीय कारीगरों की बनाई हुई हैं और उनके अभिप्रेत रूप से अलग कुछ नहीं बन सकतीं।
  alternative: केवल यह कहना कि उनका निर्माण मनुष्यों ने किया है, उनकी निर्भरता या असमर्थता पर कम बल देता।
  rationale: पहला खंड उनके मानवीय निर्माण को और दूसरा उनकी पूर्ण निर्भरता को सामने रखता है। अनुवाद मूर्तिपूजा-विरोधी बल को बनाए रखता है, पर मूल से आगे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘बढ़ई’, ‘सुनार’ और ‘कारीगर’ ठोस तथा परिचित शब्द हैं; वाक्य की समानांतर संरचना मानवीय निर्माण और मूर्तियों की निर्भरता—दोनों पर बल देती है।
