  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: hi
  text: लकड़ी की बनी वस्तुएँ और सोने तथा चाँदी से मढ़ी हुई वस्तुएँ पहाड़ के पत्थरों के समान हैं, और जो उनकी सेवा करते हैं[a], वे लज्जित किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उनकी उपासना करते हैं।” यूनानी क्रिया सेवा करने और धार्मिक उपासना करने—दोनों अर्थों में प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: पहाड़ से निकले पत्थरों
  rationale: यह पदबंध उन पत्थरों को सूचित करता है जिनसे इन वस्तुओं की तुलना की गई है। ‘पहाड़ से निकले’ मूल के ἀπὸ τοῦ ὄρους को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह जोड़े कि पत्थर अनिवार्यतः तराशे या खोदे गए थे।
- source_word: ὡμοιωμένοι εἰσὶν
  choice: के समान हैं
  rationale: यूनानी की पूर्ण निष्क्रिय कृदन्तीय रचना यहाँ स्थायी तुलना व्यक्त करती है; ‘के समान हैं’ आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: τὰ ξύλινα
  choice: लकड़ी की बनी वस्तुएँ
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। मूल में ‘मूर्तियाँ’ स्पष्टतः नहीं है, इसलिए प्रसंगगत संकेत बनाए रखते हुए अधिक शाब्दिक ‘वस्तुएँ’ रखा गया है।
- source_word: τὰ περίχρυσα καὶ τὰ περιάργυρα
  choice: सोने तथा चाँदी से मढ़ी हुई वस्तुएँ
  rationale: दोनों शब्द सोने या चाँदी की परत चढ़ी वस्तुओं को बताते हैं। ‘मढ़ी हुई’ स्पष्ट, स्वाभाविक और दोनों धातुओं के समानांतर बिंब को सुरक्षित रखता है।
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: जो उनकी सेवा करते हैं
  rationale: θεραπεύω का अर्थ सेवा या देखभाल करना और धार्मिक प्रसंग में उपासना करना भी हो सकता है। ‘सेवा करते हैं’ इसकी व्यापकता और मूर्ति-सेवा के बाइबलीय मुहावरे को बनाए रखता है।
- source_word: κατασχυνθήσονται
  choice: लज्जित किए जाएँगे
  rationale: यह भविष्यकालीन निष्क्रिय रूप है। ‘लज्जित किए जाएँगे’ उसकी निष्क्रियता और आने वाले अपमान या न्याय के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: मूर्तिपूजा के प्रसंग में θεραπεύοντες का अनुवाद
  choice: जो उनकी सेवा करते हैं
  alternative: जो उनकी उपासना करते हैं
  rationale: प्रसंग धार्मिक उपासना का है, इसलिए ‘उपासना’ संभव है; फिर भी ‘सेवा’ यूनानी क्रिया की व्यापक अर्थ-सीमा और उसकी जानबूझकर बनी हुई अस्पष्टता को बेहतर सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वस्तुएँ’ मूल के substantival adjectives को सुरक्षित रखता है, जबकि प्रसंग से उनका मूर्तियाँ होना स्पष्ट है।
