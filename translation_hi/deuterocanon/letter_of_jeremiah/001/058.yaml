base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: hi
  text: इसलिए अपनी वीरता दिखाने वाला राजा झूठे देवताओं से अच्छा है; घर में रखा कोई उपयोगी पात्र, जिसे उसका मालिक काम में लाएगा, झूठे देवताओं से अच्छा है; घर का वह द्वार, जो उसके भीतर की वस्तुओं को सुरक्षित रखता है, झूठे देवताओं से अच्छा है; और राजमहलों में लगा लकड़ी का खंभा झूठे देवताओं से अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में झूठे देवताओं के साथ विरोध को सूची में बार-बार दोहराया गया है; अनुवाद उस बलपूर्ण पुनरावृत्ति को बनाए रखता है।
    reason: स्रोत की अलंकारिक पुनरावृत्ति स्पष्ट करना।
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κρεῖσσον
  choice: अच्छा है
  rationale: तुलनात्मक भाव ‘बेहतर/श्रेष्ठ’ का है। ‘झूठे देवताओं से अच्छा है’ सामान्य हिन्दी में स्वाभाविक तुलना बनाता है और पूरे पद में दोहराया जा सकता है।
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: अपनी वीरता दिखाने वाला राजा
  rationale: कृदंत ‘राजा’ का वर्णन करता है; ‘अपनी’ ἑαυτοῦ के आत्मवाचक बल को और ‘वीरता’ ἀνδρεία के साहस-पराक्रम संबंधी अर्थ को बनाए रखती है।
- source_word: σκεῖος ... χρήσιμον
  choice: कोई उपयोगी पात्र
  rationale: σκεῖος किसी घरेलू पात्र, बर्तन या साधन के लिए व्यापक शब्द है। ‘पात्र’ उसकी व्यापकता बनाए रखता है और ‘उपयोगी’ उसके व्यावहारिक काम को सामने लाता है।
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: जिसे उसका मालिक काम में लाएगा
  rationale: यह पात्र की उपयोगिता स्पष्ट करता है। ‘मालिक’ स्वामित्व का स्वाभाविक आधुनिक हिन्दी रूप है और ‘काम में लाएगा’ वास्तविक उपयोग को व्यक्त करता है।
- source_word: οἱ ψευδεῖς θεοί
  choice: झूठे देवता
  rationale: यहाँ ψευδεῖς इन देवताओं के असत्य होने को बताता है। ‘झूठे देवता’ स्पष्ट, सुबोध और स्रोत की विवादात्मक धार के अनुरूप है।
- source_word: θύρα ... διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: वह द्वार ... जो उसके भीतर की वस्तुओं को सुरक्षित रखता है
  rationale: घर के संदर्भ में θύρα के लिए ‘द्वार’ उपयुक्त है; कृदंत उसका रक्षण करने वाला व्यावहारिक कार्य बताता है।
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: राजमहलों में लगा लकड़ी का खंभा
  rationale: ‘खंभा’ एक साधारण वास्तु-वस्तु के रूप में στύλος को सहजता से व्यक्त करता है; βασιλείοις का बहुवचन ‘राजमहलों’ से सुरक्षित रहता है।
theological_decisions:
- issue: बार-बार आने वाले ἢ οἱ ψευδεῖς θεοί की अलंकारिक तुलना
  choice: ‘झूठे देवताओं से अच्छा है’ को स्रोत की तीन तुलना-इकाइयों के बाद स्पष्ट रूप से दोहराया गया है।
  alternative: सभी उदाहरणों को एक सूची बनाकर अंत में केवल एक बार ‘झूठे देवताओं से अच्छे हैं’ कहना।
  rationale: यूनानी पाठ पहली इकाई में राजा और उपयोगी पात्र को साथ रखता है, फिर द्वार और लकड़ी के खंभे के बाद विरोध को दोहराता है। पुनरावृत्ति मूर्तियों की निरर्थकता पर विवादात्मक बल देती है; इसे समेट देने से वह बल घट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की लंबाई सँभालने और यूनानी की तीन तुलना-इकाइयों को स्पष्ट रखने के लिए अर्धविराम लगाए गए हैं।
