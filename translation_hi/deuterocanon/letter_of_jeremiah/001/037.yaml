    reason: lexical_alternative
lexical_decisions:
- source_word: χήραν
  choice: किसी विधवा
  rationale: यह χήρα का कर्मकारक एकवचन है। सामान्य निषेध में हिन्दी का ‘किसी विधवा’ प्रतिनिधिक एकवचन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: कभी दया नहीं करेंगे
  rationale: οὐ μή और अओरिस्ट सब्जंक्टिव का मेल प्रबल निषेध व्यक्त करता है। ‘कभी दया नहीं करेंगे’ इस जोर और ἐλεέω के दया/करुणा के भाव, दोनों को सुरक्षित रखता है।
- source_word: οὔτε
  choice: न
  rationale: οὔτε दूसरी नकारात्मक उपवाक्य को पहली से जोड़ता है; हिन्दी में ‘न’ इसका संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: ὀρφανῷ
  choice: किसी अनाथ
  rationale: ὀρφανός अनाथ अथवा पिता-विहीन व्यक्ति को दर्शाता है। ‘अनाथ’ आधुनिक हिन्दी में स्पष्ट है और यूनानी के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: εὖ ποιήσουσιν
  choice: भला करेंगे
  rationale: εὖ ποιέω का अर्थ किसी का भला करना, उसके हित में काम करना या उसे लाभ पहुँचाना है। ‘भला करेंगे’ मूल की क्रियात्मक और नैतिक अभिव्यक्ति को सहज हिन्दी में रखता है।
theological_decisions:
- issue: χήρα / ὀρφανός की सामाजिक-नैतिक जोड़ी का अनुवाद
  choice: विधवा / अनाथ
  alternative: विधवा / पिता-विहीन
  rationale: यह जोड़ी बाइबलीय नैतिकता में असुरक्षित लोगों की परिचित श्रेणियों को सामने रखती है और मूर्तियों की उनकी सहायता करने में असमर्थता बताती है। ‘अनाथ’ वर्तमान हिन्दी में अधिक सहज और व्यापक रूप से समझा जाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘किसी…कभी नहीं’ प्रबल निषेध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘भला करेंगे’ मूल यूनानी की सीधी नैतिक क्रिया को बनाए रखता है।
