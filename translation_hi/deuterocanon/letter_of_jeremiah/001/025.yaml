- source_word: ἐπʼ ὤμοις φέρονται
  choice: कंधों पर उठाकर ले जाए जाते हैं
  rationale: निष्क्रिय क्रिया और ढोए जाने के भाव, दोनों को सुरक्षित रखता है।
- source_word: ἐνδεικνύμενοι
  choice: प्रकट करते हैं
  rationale: प्रत्यक्षतः दिखाने या प्रदर्शित करने का अर्थ देता है; सन्दर्भ में उनकी असहाय दशा स्वयं उनका अपमान जाहिर करती है।
- source_word: ἀτιμίαν
  choice: अपमान
  rationale: अनादर, प्रतिष्ठाहीनता और लज्जाजनक दशा का उपयुक्त आधुनिक हिन्दी शब्द।
- source_word: τοῖς ἀνθρώποις
  choice: मनुष्यों के सामने
  rationale: यूनानी बहुवचन का निकट और समावेशी अर्थ; यहाँ दर्शकों के समक्ष प्रकट होने का भाव है।
- source_word: οἱ θεραπεύοντες αὐτά
  choice: उनकी सेवा करनेवाले
  rationale: θεραπεύω का यहाँ मूर्तियों की देखभाल/सेवा करने का अर्थ है; उपासना का अधिक विशिष्ट अर्थ थोपने से बचता है।
- source_word: αἰσχύνονται
  choice: लज्जित होते हैं
  rationale: वर्तमानकालीन निष्क्रिय/मध्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
