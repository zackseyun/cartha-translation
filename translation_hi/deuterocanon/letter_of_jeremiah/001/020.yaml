lexical_decisions:
- source_word: μεμελανωμένον
  choice: काले पड़ गए हैं
  rationale: पूर्ण निष्क्रिय कृदन्त किसी क्रिया से उत्पन्न वर्तमान दशा बताता है। ‘काले पड़ गए हैं’ धुएँ के कारण हुए ठोस दृश्य परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ πρόσωπον αὐτῶν
  choice: उनके चेहरे
  rationale: यूनानी में ‘चेहरा’ एकवचन है, पर बहुवचन संबंधवाचक के साथ इसका आशय प्रत्येक का चेहरा है; हिन्दी में ‘उनके चेहरे’ इस वितरणात्मक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: धुएँ से
  rationale: ἀπό यहाँ कारण या स्रोत सूचित करता है। ‘धुएँ से’ संक्षेप में दोनों संबंधों के अनुकूल है और हिन्दी में स्वाभाविक है।
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: घर से उठने वाले
  rationale: ἐκ धुएँ का उद्गम बताता है। ‘घर से उठने वाले’ हिन्दी में संबंध स्पष्ट करता है, जबकि οἰκία का सामान्य अर्थ ‘घर’ सुरक्षित रखता है।
theological_decisions:
- issue: मूर्तियों के प्रसंग में οἰκία का अर्थ व्याख्यात्मक रूप से ‘मन्दिर’ या ‘देवस्थान’ करना
  choice: घर
  alternative: देवस्थान या मन्दिर
  rationale: यूनानी पाठ में सामान्य शब्द οἰκία है, कोई विशिष्ट उपासना-स्थल सूचक शब्द नहीं। इसलिए मुख्य पाठ मूल की शब्दगत व्यापकता बनाए रखता है और प्रसंगगत विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काले पड़ गए हैं’ परिणामी दशा को स्पष्ट करता है; ‘उठने वाले’ धुएँ के घर से निकलने का संबंध प्राकृतिक हिन्दी में बताता है।
