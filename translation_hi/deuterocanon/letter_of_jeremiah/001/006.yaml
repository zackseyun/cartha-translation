translation:
  language: hi
  text: क्योंकि मेरा स्वर्गदूत तुम्हारे साथ है, और वह स्वयं तुम्हारे प्राणों की खोज कर रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राणों’ के लिए यूनानी शब्द का अनुवाद ‘आत्माओं’, ‘जीवन’ या ‘व्यक्तियों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελός
  choice: स्वर्गदूत
  rationale: ἄγγελος का अर्थ ‘दूत’ भी हो सकता है, पर परमेश्वर के प्रथम-पुरुष कथन ‘मेरा ... तुम्हारे साथ है’ के इस संदर्भ में ‘स्वर्गदूत’ संभावित अलौकिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μεθʼ ὑμῶν
  choice: तुम्हारे साथ
  rationale: μετά संबंधकारक के साथ सामान्यतः ‘साथ’ का अर्थ देता है; यह सीधा और सहज हिन्दी रूप है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: बलाघाती सर्वनाम का जोर सुरक्षित रखा गया है और व्याकरण की दृष्टि से इसे निकटतम कर्ता ‘स्वर्गदूत’ से जोड़ा गया है।
- source_word: ἐκζητῶν
  choice: खोज-खबर ले रहा है
  rationale: मूल क्रिया के ‘ढूँढ़ने/खोजने’ के भाव को हिन्दी मुहावरे में बनाए रखते हुए यहाँ व्यक्त सक्रिय सरोकार को भी संप्रेषित करता है; केवल ‘रक्षा कर रहा है’ कहने से मूल क्रिया का बिंब मिट जाता।
- source_word: τὰς ψυχὰς ὑμῶν
  choice: तुम्हारे प्राणों की
  rationale: ψυχή जीवन, प्राण, आत्मा या व्यक्ति का बोध करा सकता है। ‘प्राण’ यहाँ जीवन और व्यक्ति—दोनों से जुड़ा अर्थ रखता है और अनावश्यक शरीर-आत्मा द्वैत आरोपित नहीं करता।
theological_decisions:
- issue: ψυχαί का अर्थ और स्वर्गदूत की क्रिया का स्वरूप
  choice: तुम्हारे प्राणों की खोज-खबर ले रहा है
  alternative: तुम्हारी आत्माओं को खोज रहा है; तुम्हारे जीवन की देखभाल कर रहा है
  rationale: यह रूप जीवन/प्राण संबंधी व्यापकता तथा ἐκζητέω के खोजने वाले भाव को बनाए रखता है, साथ ही हिन्दी में वाक्य को अनावश्यक रूप से धमकीपूर्ण नहीं बनाता। ‘आत्माओं’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: αὐτός का संदर्भ
  choice: वह स्वयं—अर्थात स्वर्गदूत
  alternative: मैं स्वयं—अर्थात परमेश्वर
  rationale: प्रस्तुत यूनानी पाठ में पुल्लिंग αὐτός का निकटतम स्पष्ट पूर्वपद ὁ ἄγγελός है और ‘मैं’ के लिए ἐγώ नहीं है। इसलिए व्याकरणतः स्वर्गदूत को कर्ता माना गया है, बिना उसके कार्य के विषय में अतिरिक्त धर्मवैज्ञानिक विवरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘खोज-खबर लेना’ सामान्य पाठक के लिए स्वाभाविक है और मूल क्रिया के खोजने तथा सक्रिय सरोकार—दोनों भावों को साथ रखता है।
