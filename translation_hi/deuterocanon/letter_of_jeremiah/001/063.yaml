  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: hi
  text: इसलिए न तो उन्हें देवता मानना चाहिए और न ही देवता कहना चाहिए, क्योंकि वे न तो किसी मुकदमे का न्याय कर सकते हैं और न मनुष्यों का भला कर सकते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्ष निकालने वाला संबंधसूचक शब्द है; ‘इसलिए’ उसके तार्किक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νομιεῖσθαι
  choice: मानना चाहिए
  rationale: यहाँ क्रिया किसी को एक विशेष हैसियत में मानने या समझने का भाव रखती है; इस प्रसंग में ‘देवता मानना’ सहज और सटीक है।
- source_word: κλητέον ὑπάρχειν
  choice: देवता कहना चाहिए
  rationale: यह संरचना उचित नामकरण या संबोधन का भाव देती है। ‘देवता कहना’ यूनानी की दूसरी, नामकरण-संबंधी अस्वीकृति को स्पष्ट रखता है।
- source_word: θεούς
  choice: देवता
  rationale: यह कथित उपास्य देवों के लिए सीधा बहुवचन है; ‘देवता’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: क्योंकि वे ... नहीं कर सकते
  rationale: संबंधवाचक स्वतंत्र रचना निष्कर्ष का कारण बताती है; हिन्दी में कारणवाचक उपवाक्य उसका भाव स्पष्ट रूप से रखता है।
- source_word: κρίσιν κρῖναι
  choice: किसी मुकदमे का न्याय करना
  rationale: सजातीय पदबंध न्यायिक निर्णय देने की क्षमता पर बल देता है। ‘मुकदमे का न्याय करना’ कानूनी आशय को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: εὖ ποιεῖν
  choice: भला करना
  rationale: यह किसी का हित या उपकार करने का सामान्य मुहावरा है; ‘भला करना’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀνθρώποις
  choice: मनुष्यों का
  rationale: यह समस्त मानवों के लिए सामान्य बहुवचन है; ‘मनुष्यों’ मूल के व्यापक मानवीय संदर्भ को ठीक रखता है।
theological_decisions:
- issue: मूर्तियों के देवत्व और उनके उचित नामकरण—दोनों का निषेध
  choice: न तो उन्हें देवता मानना चाहिए और न ही देवता कहना चाहिए
  alternative: उन्हें न तो देवता समझना चाहिए और न देवता कहलाना चाहिए
  rationale: अनुवाद वास्तविक या मानी हुई हैसियत तथा उचित संबोधन, दोनों के निषेध को अलग-अलग बनाए रखता है। यह मूर्तिपूजा-विरोधी बल को सुरक्षित रखता है, पर मूल से आगे बढ़कर कोई दार्शनिक व्याख्या नहीं जोड़ता।
