translation:
  language: hi
  text: तुम्हारे उन पापों[a] के कारण, जो तुमने परमेश्वर के विरुद्ध किए हैं, बेबीलोनियों के राजा नबूकदनेस्सर द्वारा तुम्हें बंदी बनाकर बेबीलोन ले जाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “पापों” और “पाप किया” एक ही मूल के संज्ञा और क्रिया रूप हैं; अधिक शाब्दिक रूप होगा, “तुम्हारे उन पापों के कारण, जिन्हें तुमने परमेश्वर के विरुद्ध पाप किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας
  choice: तुम्हारे उन पापों के कारण
  rationale: διά के साथ कर्मकारक कारण व्यक्त करता है। ‘के कारण’ आधुनिक हिन्दी में स्पष्ट है, और ‘उन’ आगे आने वाले सम्बन्धवाचक उपवाक्य से पापों को स्वाभाविक रूप से जोड़ता है।
- source_word: ἃς ἡμαρτήκατε
  choice: जो तुमने ... किए हैं
  rationale: यूनानी में ‘पापों’ और ‘पाप किया’ का सजातीय दोहराव है। उसका शब्दशः हिन्दी रूप अस्वाभाविक होगा; इसलिए मुख्य पाठ में अर्थ स्पष्ट रखा गया और मूल की पुनरुक्ति को पादटिप्पणी में बताया गया है।
- source_word: ἐναντίον τοῦ θεοῦ
  choice: परमेश्वर के विरुद्ध
  rationale: इस नैतिक और न्याय-संबंधी प्रसंग में ἐναντίον केवल उपस्थिति नहीं, बल्कि परमेश्वर के विरोध में किए गए अपराध को व्यक्त करता है।
- source_word: ἀχθήσεσθε
  choice: तुम्हें ... ले जाया जाएगा
  rationale: ἄγω का भविष्यत् कर्मवाच्य निर्वासन के प्रसंग में बलपूर्वक ले जाए जाने का भाव देता है। हिन्दी कर्मवाच्य मूल की वाच्यता को बनाए रखता है।
- source_word: εἰς Βαβυλῶνα
  choice: बेबीलोन
  rationale: εἰς गंतव्य बताता है; ‘बेबीलोन ले जाया जाएगा’ हिन्दी में स्वाभाविक रूप से वही दिशा व्यक्त करता है।
- source_word: αἰχμάλωτοι
  choice: बंदी बनाकर
  rationale: यह उनके ले जाए जाते समय की अवस्था बताता है। ‘बंदी बनाकर’ युद्धबंदी अथवा निर्वासन की स्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर द्वारा
  rationale: कर्मवाच्य के साथ ὑπό कर्ता अथवा माध्यम बताता है। ‘द्वारा’ इस अभिकर्ता-संबंध को स्पष्ट रखता है।
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: बेबीलोनियों के राजा
  rationale: यूनानी पाठ का शाब्दिक अर्थ ‘बेबीलोनियों का राजा’ है, न कि केवल ‘बेबीलोन का राजा’; जातिवाचक संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: ἁμαρτίας ... ἡμαρτήκατε की सजातीय पुनरुक्ति
  choice: मुख्य पाठ में स्वाभाविक ‘पापों ... किए हैं’ और पादटिप्पणी में मूल पुनरुक्ति का उल्लेख
  alternative: ‘उन पापों के कारण, जिनका पाप तुमने किया’ जैसे अधिक शाब्दिक रूप
  rationale: यूनानी की पुनरुक्ति उत्तरदायित्व पर बल देती है, पर उसका शब्दशः हिन्दी रूप कृत्रिम और अस्पष्ट है। पादटिप्पणी बल को सुरक्षित रखते हुए मुख्य पाठ को सुबोध रखती है।
- issue: ἐναντίον τοῦ θεοῦ का नैतिक अर्थ
  choice: परमेश्वर के विरुद्ध
  alternative: परमेश्वर के सामने / परमेश्वर की दृष्टि में
  rationale: पाप के कारण निर्वासन का यह प्रसंग विरोध और अपराध का भाव रखता है; केवल स्थान या दैवी अवलोकन का अर्थ अपेक्षाकृत कमजोर होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी का कर्मवाच्य, निर्वासन का बलपूर्वक भाव और ‘बेबीलोनियों के राजा’ वाली जातिवाचक संरचना सुरक्षित है।
