base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/003.yaml
  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: hi
  text: पर अब बाबुल में तुम चाँदी, सोने और लकड़ी के देवताओं को कंधों पर उठाकर ले जाए जाते हुए देखोगे, जो जातियों को भय दिखाते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो जातियों में भय उत्पन्न करते हैं” अथवा “जो जातियों के मन में भय जगाते हैं।” यूनानी में शाब्दिक रूप से “जातियों को भय दिखाते हैं” है; यह उनके प्रदर्शन या उसे देखने वालों पर पड़े प्रभाव—दोनों की ओर संकेत कर सकता है।
    reason: δεικνύντας φόβον τοῖς ἔθνεσιν की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: ‘पर’ δέ के विरोध अथवा प्रसंग-परिवर्तन को और ‘अब’ νυνί की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὄψεσθε
  choice: तुम ... देखोगे
  rationale: ὁράω के भविष्यत्कालीन रूप का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: ἐν Βαβυλῶνι
  choice: बाबुल में
  rationale: स्थानवाचक अर्थ को आधुनिक बाइबलीय हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: θεοὺς
  choice: देवताओं
  rationale: यूनानी पाठ में ‘देवता’ है, ‘मूर्तियाँ’ नहीं। मूल शब्द रखने से उन वस्तुओं के विषय में जातियों का दावा और लेखक की अंतर्निहित विडंबना दोनों सुरक्षित रहते हैं।
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: चाँदी, सोने और लकड़ी के
  rationale: तीनों विशेषण निर्माण-सामग्री बताते हैं; हिन्दी में ‘के’ के साथ यह क्रम सहज और स्पष्ट है।
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: कंधों पर उठाकर ले जाते हुए
  rationale: यह उन देवताओं के दूसरों द्वारा कंधों पर ढोए जाने का दृश्य व्यक्त करता है; केवल ‘उठाए हुए’ की तुलना में गतिशील प्रसंग अधिक स्पष्ट है।
- source_word: δεικνύντας φόβον
  choice: भय दिखाते हैं
  rationale: शाब्दिक ‘भय दिखाना’ यूनानी अभिव्यक्ति की संक्षिप्तता और अस्पष्टता बनाए रखता है; सम्भावित प्रभावार्थ पादटिप्पणी में दिया गया है।
- source_word: τοῖς ἔθνεσιν
  choice: जातियों को
  rationale: ἔθνη के बहुवचन और सम्प्रदानात्मक दिशा को बनाए रखता है; यहाँ ‘गैर-यहूदी’ जैसा अधिक व्याख्यात्मक पद आवश्यक नहीं है।
theological_decisions:
- issue: θεοὺς का अनुवाद ‘देवता’ किया जाए या व्याख्यात्मक रूप से ‘मूर्तियाँ’
  choice: देवताओं
  alternative: मूर्तियों
  rationale: मूल पाठ इन वस्तुओं को θεούς कहता है। ‘देवता’ रखने से पाठ में निहित विडंबना सुरक्षित रहती है और अनुवादक पहले से ही लेखक का निष्कर्ष संज्ञा में नहीं भरता।
- issue: δεικνύντας φόβον का अर्थ प्रदर्शन है या जातियों पर उत्पन्न प्रभाव
  choice: जातियों को भय दिखाते हैं
  alternative: जातियों में भय उत्पन्न करते हैं / जातियों के मन में भय जगाते हैं
  rationale: यूनानी का शाब्दिक रूप ‘भय दिखाते हुए’ है, पर वाक्यांश इन प्रतिमाओं द्वारा दर्शकों में भय उत्पन्न करने का अर्थ भी दे सकता है। मुख्य पाठ मूल की तनावपूर्ण अस्पष्टता रखता है और प्रभावार्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाबुल’ और ‘देवता’ प्रचलित बाइबलीय शब्द हैं। ‘भय दिखाते हैं’ जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल यूनानी भी संक्षिप्त और अर्थगत रूप से खुला है; पादटिप्पणी सहज प्रभावार्थ स्पष्ट करती है।
