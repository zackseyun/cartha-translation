- issue: αὐτὰ ὠφελῆσαι का आशय
  choice: ‘अपना बचाव कर सकते हैं’।
  alternative: ‘स्वयं को लाभ पहुँचा सकते हैं’।
  rationale: मूल अभिव्यक्ति में अपने हित के लिए कार्य करने का भाव है। आश्रय में भागने के निकट प्रसंग में यह आत्म-संरक्षण को दर्शाता है; फिर भी पादटिप्पणी में व्यापक शाब्दिक विकल्प सुरक्षित रखा गया है।
