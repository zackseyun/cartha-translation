  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/070.yaml
  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: hi
  text: उसी प्रकार उनके लकड़ी के देवता, जिन पर सोना और चाँदी मढ़े हुए हैं, बगीचे में लगे उस बिजूके[a] के समान हैं, जिस पर हर पक्षी बैठता है; और अँधेरे में फेंके हुए शव के समान भी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बगीचे का खंभा’ अथवा ‘रखवाली की आकृति।’ यूनानी शब्द दुर्लभ है। चित्र बगीचे में रखी ऐसी वस्तु का है जिस पर पक्षी आकर बैठते हैं।
    reason: दुर्लभ यूनानी शब्द βάμψῳ का सटीक अर्थ अनिश्चित है; पादटिप्पणी वैकल्पिक शाब्दिक चित्र को सुरक्षित रखती है।
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: उसी प्रकार
  rationale: यह वाक्यांश पहले के संदर्भ से तुलना जोड़ता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: βάμψῳ
  choice: बिजूके
  rationale: यह दुर्लभ यूनानी शब्द बगीचे में रखी ऐसी आकृति या खंभे का संकेत देता है जिस पर पक्षी बेखटके बैठते हैं। मुख्य पाठ में ‘बिजूका’ चित्र को सामान्य पाठक के लिए स्पष्ट करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: जिस पर हर पक्षी आ बैठता है
  rationale: यह सापेक्ष उपवाक्य मूल चित्र को सरल और स्वाभाविक हिन्दी में रखता है; ‘आ बैठता है’ पक्षियों के उस निर्जीव वस्तु पर बेखटके बैठने का भाव देता है।
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: उस मुर्दे के समान भी, जिसे अँधेरे में फेंक दिया गया हो
  rationale: νεκρός को यहाँ ठोस अर्थ में ‘मुर्दा’ और ἐρριμμένῳ को ‘फेंक दिया गया’ कहा गया है। ‘अँधेरे में’ मूल अभिव्यक्ति को बिना आध्यात्मिक अर्थ जोड़े सुरक्षित रखता है।
- source_word: ἀφωμοίωνται
  choice: के समान हैं
  rationale: मूल क्रिया समानता या तुलना प्रकट करती है। हिन्दी में ‘के समान हैं’ दोनों तुलनाओं को स्पष्ट और सहज रूप से व्यक्त करता है, बिना यह संकेत दिए कि मूर्तियों का रूप वास्तव में बदल गया।
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: उनके लकड़ी के देवता, जिन पर सोना और चाँदी मढ़े हैं
  rationale: ξύλινοι उनकी मूल सामग्री को लकड़ी बताता है, जबकि περίχρυσοι और περιάργυροι सोने-चाँदी के बाहरी आवरण का संकेत देते हैं। ‘मढ़े हैं’ आधुनिक हिन्दी में इस भेद को स्पष्ट रखता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में तुलना का स्वरूप
  choice: देवताओं की तुलना निर्जीव और असहाय वस्तुओं—बगीचे के बिजूके और अँधेरे में फेंके मुर्दे—से की गई है।
  alternative: दुर्लभ βάμψῳ को ‘बगीचे का खंभा’ या ‘रखवाली की आकृति’ कहा जा सकता है।
  rationale: अनुवाद मूर्तियों की निष्क्रियता और असमर्थता पर मूल व्यंग्य को बनाए रखता है, लेकिन चित्र से आगे बढ़कर कोई सांप्रदायिक या सिद्धान्तगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बिजूका’ सामान्य पाठक के लिए तत्काल बोधगम्य है; ‘मुर्दा’ यहाँ ठोस और प्रभावशाली है, पर अनावश्यक रूप से तकनीकी या अलंकृत नहीं।
