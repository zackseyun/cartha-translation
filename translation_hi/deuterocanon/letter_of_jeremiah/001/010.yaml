  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/010.yaml
  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
translation:
  language: hi
  text: वे उनमें से कुछ छत पर की वेश्याओं को दे देते हैं।[a][b] और वे उन चाँदी, सोने और लकड़ी के देवताओं को मनुष्यों की तरह वस्त्रों से सजाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनमें से”; सर्वनाम संभवतः आसपास के प्रसंग में मूर्तियों से जुड़ी वस्तुओं की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ व्याख्याकार “छत पर की वेश्याओं” को उपासना-पद्धति से जुड़ी वेश्याएँ समझते हैं, पर यूनानी पाठ स्पष्ट रूप से “मंदिर की वेश्याएँ” नहीं कहता।
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: दे देते हैं
  rationale: यूनानी रूप भविष्यत्काल का है, पर इस प्रसंग में मूर्तियों से जुड़े प्रचलित व्यवहार का सजीव वर्णन हो रहा है; हिन्दी का सामान्य वर्तमान काल स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: ἀπʼ αὐτῶν
  choice: उनमें से कुछ
  rationale: मूल में केवल ‘उनमें से’ है और सर्वनाम का सटीक संदर्भ स्पष्ट नहीं किया गया। इसलिए किसी विशिष्ट वस्तु या स्वामित्व को मुख्य पाठ में जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता रखी गई है।
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: छत पर रहनेवाली वेश्याओं को
  rationale: πόρναι का सीधा अर्थ ‘वेश्याएँ’ है। ἐπὶ τοῦ στέγους को ‘छत पर’ के रूप में रखा गया है; यूनानी पाठ उन्हें स्पष्ट रूप से मंदिर की वेश्याएँ नहीं कहता। ‘रहनेवाली’ हिन्दी में संबंध को स्वाभाविक बनाता है, बिना कोई पंथ-संबंध जोड़ने के।
- source_word: κοσμοῦσί
  choice: सजाते हैं
  rationale: यहाँ क्रिया का अर्थ वस्त्रों से अलंकृत या सज्जित करना है; ‘सजाते हैं’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὡς ἀνθρώπους
  choice: मनुष्यों की तरह
  rationale: ἀνθρώπους सामान्य रूप से मनुष्यों को सूचित करता है, केवल पुरुषों को नहीं।
- source_word: τοῖς ἐνδύμασιν
  choice: वस्त्रों से
  rationale: करण कारक का भाव है—वस्त्र सजाने का साधन हैं। ‘वस्त्र’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: उन चाँदी, सोने और लकड़ी के देवताओं को
  rationale: हिन्दी में कर्म को क्रिया से पहले रखकर वाक्य स्वाभाविक बनाया गया है। सामग्री की तीनों श्रेणियाँ सुरक्षित हैं, यद्यपि यूनानी में ‘देवताओं’ की पुनरावृत्ति पहले दो विशेषणों के साथ होती है।
theological_decisions:
- issue: क्या πόρναι को पंथ या मंदिर से जुड़ी वेश्याएँ कहा जाए
  choice: वेश्याएँ
  alternative: मंदिर की वेश्याएँ / देवदासियाँ
  rationale: यूनानी पाठ केवल πόρναι कहता है और उन्हें छत पर स्थित बताता है; वह स्पष्ट रूप से उन्हें धार्मिक पद या मंदिर से संबद्ध नहीं करता। अतः मुख्य पाठ में अतिरिक्त पंथ-संबंध नहीं जोड़ा गया।
- issue: ἀπʼ αὐτῶν के संदर्भ को कितना स्पष्ट किया जाए
  choice: उनमें से कुछ
  alternative: उनकी कुछ वस्तुएँ / इन भेंटों में से कुछ
  rationale: आसपास के प्रसंग से मूर्तियों या उनसे जुड़ी वस्तुओं की ओर संकेत संभव है, पर मूल सर्वनाम स्वयं अस्पष्ट है। धर्मवैचारिक या वस्तुगत पहचान निश्चित करने के बजाय अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य अपनाया गया है। ‘देवताओं’ शब्द इस प्रसंग में कथित मूर्तिदेवताओं के लिए मूल का सीधा अनुवाद है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए बदला गया, जबकि मूल की संदर्भगत और धार्मिक अस्पष्टताएँ सुरक्षित रखी गई हैं।
