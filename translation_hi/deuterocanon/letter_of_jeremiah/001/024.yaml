    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: हर कीमत देकर
  rationale: यह यूनानी पदबंध मूर्तियों को कीमत चुकाकर खरीदी गई वस्तुओं के रूप में प्रस्तुत करता है। ‘हर कीमत देकर’ वाणिज्यिक भाव को स्वाभाविक हिन्दी में बनाए रखता है और किसी निश्चित मूल्य का अनुमान नहीं लगाता।
- source_word: ἠγορασμένα ἐστίν
  choice: खरीदे गए हैं
  rationale: ἀγοράζω के पूर्ण निष्क्रिय रूप का अर्थ खरीदे जाने के फलस्वरूप वर्तमान अवस्था है। ‘खरीदे गए हैं’ निष्क्रियता और पूर्ण पक्ष—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα
  choice: साँस
  rationale: मूर्ति-विरोधी प्रसंग में मुख्य बात इन वस्तुओं का निर्जीव होना है। ‘साँस’ जीवन के ठोस चिह्न को व्यक्त करती है; ‘आत्मा’ भी शब्दार्थ की दृष्टि से सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: ἐν οἷς
  choice: उनमें
  rationale: यह पहले उल्लिखित खरीदी गई मूर्तियों की ओर संकेत करता है। ‘उनमें’ स्थानवाचक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्ति-विरोधी प्रसंग में πνεῦμα का अर्थ
  choice: साँस
  alternative: आत्मा
  rationale: पंक्ति का निकटतम आशय यह है कि महँगी या खरीदी हुई मूर्तियाँ भी निर्जीव हैं। ‘साँस’ जीवन के अभाव को मूर्त रूप से बताती है, जबकि ‘आत्मा’ अधिक तत्त्वमीमांसक कथन का आभास दे सकती है। फिर भी यूनानी शब्द की वास्तविक अर्थ-सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
