  text: They are bought at every price[a], but there is no breath in them.
translation:
  language: hi
  text: वे हर कीमत देकर खरीदे गए हैं, लेकिन उनमें साँस[a] नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
