  rationale: बहुवचन दत्तिव का सीधा और सामान्य हिन्दी समतुल्य; ‘सामना करना’ के साथ ‘का’ स्वाभाविक है।
- source_word: οὐ μὴ ἀντιστῶσιν
  choice: न तो … और न ही … सामना कर सकेंगे
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को निश्चित भविष्य-असमर्थता से व्यक्त किया गया है; दो दत्तिव पदों को हिन्दी के ‘न तो…न ही’ ढाँचे में स्वाभाविक रूप दिया गया है।
