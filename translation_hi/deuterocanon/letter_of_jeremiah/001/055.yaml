- source_word: Βασιλεῖ
  choice: किसी राजा का
  rationale: यूनानी एकवचन दत्तिव ‘राजा’ को हिन्दी में अनिश्चित अर्थ के साथ व्यक्त करता है और ἀντιστῶσιν के स्वाभाविक परसर्गीय प्रयोग से जुड़ता है।
- source_word: πολεμίοις
