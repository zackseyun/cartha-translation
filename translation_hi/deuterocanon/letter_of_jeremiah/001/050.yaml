base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: hi
  text: क्योंकि वे लकड़ी के हैं और उन पर सोने और चाँदी की परत चढ़ी हुई है, बाद में यह ज्ञात होगा कि वे मिथ्या हैं; सभी राष्ट्रों और राजाओं के लिए यह स्पष्ट होगा कि वे देवता नहीं, बल्कि मनुष्यों के हाथों के बनाए हुए काम हैं, और उनमें परमेश्वर का कोई काम नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξύλινα
  choice: लकड़ी के
  rationale: मूर्तियों की मूल सामग्री को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περίχρυσα καὶ περιάργυρα
  choice: उन पर सोने और चाँदी की परत चढ़ी है
  rationale: दोनों विशेषणों का आशय धातु से मढ़े या आवृत होने का है; संयुक्त हिन्दी अभिव्यक्ति पुनरुक्ति से बचते हुए दोनों धातुओं को स्पष्ट रखती है।
- source_word: ψευδῆ
  choice: झूठे
  rationale: यूनानी शब्द के 'मिथ्या/नकली' भाव को बनाए रखता है और मूर्तियों के देवता होने के दावे का खंडन करता है।
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: मनुष्यों के हाथों की बनाई हुई वस्तुएँ
  rationale: मुहावरे की हस्तनिर्मित होने वाली बात को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: οὐθὲν θεοῦ ἔργον
  choice: परमेश्वर का कोई कार्य नहीं
  rationale: θεοῦ को संदर्भानुसार सच्चे परमेश्वर के रूप में लिया गया है और मूल की संक्षिप्त संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: मूर्तियों के लिए θεοί और सच्चे ईश्वर के लिए θεοῦ का भेद
  choice: पहले को ‘देवता’ और दूसरे को ‘परमेश्वर’ कहा गया है।
  alternative: दोनों स्थानों पर ‘ईश्वर’ अथवा ‘देवता’
  rationale: वाक्य झूठे देवताओं और परमेश्वर के कार्य के बीच जानबूझकर विरोध स्थापित करता है; हिन्दी का यह भेद उस विरोध को स्वाभाविक रूप से स्पष्ट करता है।
- issue: ‘उनमें परमेश्वर का कोई कार्य नहीं’ का अर्थ
  choice: मूल कथन को बिना विस्तार के रखा गया है।
  alternative: ‘उनमें कोई दैवी सामर्थ्य नहीं’
  rationale: वैकल्पिक रूप व्याख्यात्मक है और ἔργον को ‘सामर्थ्य’ बना देता है; मूल की संभावित व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य; ‘परत चढ़ी है’ सामान्य पाठक के लिए ‘मढ़ी हुई’ से अधिक स्पष्ट है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए लंबे यूनानी वाक्य को दो वाक्यों में बाँटा गया है।
