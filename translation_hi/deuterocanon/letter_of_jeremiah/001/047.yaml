  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/047.yaml
  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: hi
  text: तो फिर उनकी बनाई हुई वस्तुएँ कैसे टिकी रह सकती हैं?[a][b] क्योंकि वे अपने बाद आने वालों के लिए झूठ और अपमान छोड़ गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके द्वारा गढ़ी गई चीज़ें।” यूनानी कृदन्त मनुष्य के हाथों बनाई या तैयार की गई वस्तुओं को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तो फिर उनकी बनाई हुई वस्तुएँ कैसे बनी रहेंगी?” यूनानी में यह आलंकारिक प्रश्न इन मानव-निर्मित वस्तुओं के टिके रहने पर संदेह प्रकट करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: तो फिर ... कैसे
  rationale: यह पदबंध पिछले कथन से निष्कर्ष निकालते हुए एक जोरदार आलंकारिक प्रश्न आरम्भ करता है। आधुनिक हिन्दी में ‘तो फिर ... कैसे’ उसके अनुमानात्मक और बलात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μέλλει
  choice: टिकी रह सकती हैं
  rationale: यहाँ क्रिया पिछले संदर्भ में कारीगरों के अधिक समय तक न रहने की बात से जुड़ी है और उनके बनाए पदार्थों के भावी टिकाव पर प्रश्न उठाती है। इसलिए केवल ‘होनेवाली हैं’ की अपेक्षा यह प्रसंगानुकूल और स्वाभाविक है।
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: उनकी बनाई हुई वस्तुएँ
  rationale: कृदन्त मनुष्यों द्वारा बनाई या गढ़ी गई वस्तुओं को सूचित करता है। प्रसंग में वे मूर्तियाँ हैं, पर मूल की सामान्य अभिव्यक्ति बनाए रखने के लिए मुख्य पाठ में ‘मूर्तियाँ’ नहीं जोड़ा गया।
- source_word: κατέλιπον
  choice: छोड़ गए हैं
  rationale: क्रिया बाद में आनेवालों को विरासत में कुछ सौंप जाने या पीछे छोड़ जाने का भाव रखती है।
- source_word: ψεύδη
  choice: झूठ
  rationale: बहुवचन यूनानी संज्ञा मूर्तियों से जुड़ी मिथ्याओं या छलपूर्ण दावों को सूचित करती है; हिन्दी में सामूहिक अर्थ वाला ‘झूठ’ सीधा और स्वाभाविक है।
- source_word: ὄνειδος
  choice: बदनामी
  rationale: यह शब्द सार्वजनिक अपमान, निंदा या कलंक का अर्थ देता है। ‘बदनामी’ साधारण आधुनिक हिन्दी में इस भाव को स्पष्ट करता है।
- source_word: τοῖς ἐπιγινομένοις
  choice: अपने बाद आनेवालों के लिए
  rationale: यह उन लोगों या पीढ़ियों को दर्शाता है जो बाद में आते हैं; चुना हुआ रूप सामान्य और स्पष्ट है।
theological_decisions:
- issue: मनुष्यों द्वारा बनाई गई वस्तुओं का संदर्भ
  choice: मुख्य पाठ में सामान्य अभिव्यक्ति ‘बनाई हुई वस्तुएँ’ रखी गई है, जबकि प्रसंग उन्हें मूर्तियों के रूप में पहचानता है।
  alternative: मुख्य पाठ में सीधे ‘मूर्तियाँ’ कहना।
  rationale: पूरे प्रसंग में मूर्तिपूजा की वस्तुएँ अभिप्रेत हैं, पर यूनानी पदबंध स्वयं सामान्य है। सामान्य शब्दावली रखना मूल की सीमा और उसके आलंकारिक प्रभाव को सुरक्षित रखता है।
- issue: μέλλει में निहित टिके रहने का भाव
  choice: ‘कैसे टिकी रह सकती हैं?’
  alternative: ‘उनका क्या होगा?’ या ‘वे कैसे बनी रहेंगी?’
  rationale: पिछले संदर्भ से दीर्घजीविता का विचार यहाँ निहित है। चुना हुआ अनुवाद उस लोपित प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि प्रश्न की आलंकारिक शक्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचन के अनुकूल रखी गई है। ‘तो फिर’ आलंकारिक निष्कर्ष को और ‘टिकी रह सकती हैं’ पिछले संदर्भ में निहित दीर्घजीविता को व्यक्त करता है। ‘वस्तुएँ’ मूल की सामान्य अभिव्यक्ति को बनाए रखता है, जबकि ‘मूर्तियाँ’ को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ा गया।
