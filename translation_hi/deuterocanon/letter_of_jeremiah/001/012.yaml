lexical_decisions:
- source_word: ἐκμάσσονται
  choice: पोंछे जाते हैं
  rationale: मध्य/कर्मवाच्य रूप को हिन्दी में कर्मवाच्य रखकर यह स्पष्ट किया गया है कि मूर्तियों के चेहरे साफ किए जाते हैं; कर्ता को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τὸ πρόσωπον αὐτῶν
  choice: उनके चेहरे
  rationale: यूनानी में संज्ञा एकवचन और सर्वनाम बहुवचन है। अनेक मूर्तियों के संदर्भ में हिन्दी का स्वाभाविक बहुवचन अर्थ को ठीक प्रकार व्यक्त करता है।
- source_word: διὰ τὸν ... κονιορτόν
  choice: धूल के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है, और κονιορτός का विशिष्ट अर्थ ‘धूल’ है, सामान्य ‘गंदगी’ नहीं।
- source_word: ἐκ τῆς οἰκίας
  choice: घर की
  rationale: οἰκία का मूल अर्थ ‘घर’ है। संदर्भ में यह मूर्तियों को रखने वाला भवन हो सकता है, पर ‘मन्दिर’ या ‘देवालय’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: वह उन पर बहुत अधिक जम जाती है
  rationale: πλείω का शाब्दिक अर्थ ‘अधिक’ है। धूल के संदर्भ में ‘जम जाती है’ स्वाभाविक हिन्दी में उसकी अधिक मात्रा को मूर्त रूप देता है, जबकि ‘बहुत अधिक’ मूल की तुलनात्मक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: बहुवचन सर्वनामों और क्रिया का आशय
  choice: सर्वनाम मूर्तियों की ओर संकेत करते हैं और कर्मवाच्य बताता है कि उनके चेहरे किसी और के द्वारा पोंछे जाते हैं।
  alternative: शब्दों को इस प्रकार पढ़ा जा सकता है मानो मूर्तियाँ स्वयं अपने चेहरे पोंछती हों।
  rationale: आसपास का प्रसंग असहाय मूर्तियों पर व्यंग्य करता है, जिन्हें मनुष्यों की देखभाल चाहिए। हिन्दी कर्मवाच्य बिना किसी अनुल्लिखित कर्ता को जोड़ने के इस आशय को सुरक्षित रखता है।
