  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घर’ मूल शब्द के निकट है; ‘मन्दिर’ जैसी संदर्भगत व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
