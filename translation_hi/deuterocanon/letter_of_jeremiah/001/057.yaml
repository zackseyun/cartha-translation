  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/057.yaml
  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: hi
  text: बलवान[a] लोग उनसे सोना और चाँदी उतार लेंगे और उन पर लिपटे वस्त्र लेकर चले जाएँगे; पर वे मूर्तियाँ अपनी सहायता भी कदापि नहीं कर सकेंगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शक्तिशाली’।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में अंतिम कथन का निषेध अत्यंत प्रबल है: वे मूर्तियाँ अपनी सहायता भी कदापि नहीं कर सकेंगी।'
    reason: emphatic_negative
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: बलवान लोग
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत है और उन लोगों को बताता है जिनमें लूटने की शक्ति या सामर्थ्य है। ‘बलवान लोग’ संक्षिप्त और स्वाभाविक है; ‘शक्तिशाली लोग’ भी संभव है।
- source_word: περιελοῦνται
  choice: उतार लेंगे
  rationale: क्रिया किसी वस्तु के चारों ओर या ऊपर लगी चीज़ को हटा लेने का भाव देती है। मूर्तियों से धातु की सजावट लूटे जाने के प्रसंग में ‘उतार लेंगे’ इस ठोस चित्र को बनाए रखता है।
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: सोना और चाँदी
  rationale: यूनानी पाठ दोनों धातुओं को सीधे कर्म के रूप में रखता है और कोई स्पष्ट संबंधसूचक सर्वनाम नहीं जोड़ता।
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: उन पर लिपटे वस्त्र
  rationale: ἱματισμός वस्त्र या पहनावे को और περικείμενον उनके चारों ओर पड़े या लिपटे होने को व्यक्त करता है। यह अनुवाद मूर्तियों पर चढ़े वस्त्रों का भौतिक चित्र सुरक्षित रखता है।
- source_word: ἀπελεύσονται ἔχοντες
  choice: लेकर चले जाएँगे
  rationale: मुख्य क्रिया और सहभागी कृदंत मिलकर बताते हैं कि लुटेरे वस्त्र अपने अधिकार में लेकर वहाँ से चले जाएँगे।
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: पर वे अपनी सहायता भी कदापि नहीं कर सकेंगे
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है। ‘कदापि नहीं’ उसकी प्रबलता को रखता है, जबकि ‘कर सकेंगे’ प्रसंग में मूर्तियों की असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘वे’ का संदर्भ
  choice: यह सर्वनाम मूर्तियों की ओर संकेत करता है, जो अपनी सहायता भी नहीं कर सकतीं।
  alternative: इसे उनकी असहायता के बारे में कुछ अधिक सामान्य कथन माना जा सकता है।
  rationale: प्रतिवाचक ἑαυτοῖς का स्वाभाविक अर्थ ‘अपनी/स्वयं की’ है, और पत्र के निकटवर्ती संदर्भ में मूर्तियों की निष्क्रियता बार-बार मुख्य विषय है। अनुवाद इसी संदर्भ को रखता है, उससे आगे कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘उतार लेंगे’ और ‘लिपटे वस्त्र’ मूल के ठोस लूट-चित्र को बनाए रखते हैं; ‘कदापि नहीं’ प्रबल निषेध को स्पष्ट करता है।
