  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: hi
  text: तो फिर यह कैसे स्वीकार किया जाए या माना जाए कि वे देवता हैं?[a] लकड़ी के वे देवता, जो चाँदी और सोने से मढ़े हुए हैं,[b] चोरों या लुटेरों से अपने को किसी भी तरह नहीं बचा सकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो फिर यह कैसे स्वीकार या समझा जाए कि वे देवता हैं?” यूनानी में दो कर्तव्यवाचक विशेषणों के द्वारा इस आलंकारिक प्रश्न पर बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का अधिक शब्दशः रूप है, “लकड़ी के देवता, चाँदी से मढ़े हुए और सोने से मढ़े हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: तो फिर यह कैसे
  rationale: यह प्रयोग निष्कर्षसूचक और चुनौतीपूर्ण आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: स्वीकार किया या माना जा सकता है
  rationale: दोनों कर्तव्यवाचक विशेषणों की समानांतरता रखते हुए यह स्वीकार करने और समझने/मानने के निकट, किंतु अलग, भावों को व्यक्त करता है।
- source_word: ὅτι εἰσὶν θεοί
  choice: कि वे देवता हैं
  rationale: ग्रीक के स्पष्ट विधेय को ज्यों का त्यों रखता है और मूर्तिपूजा-विरोधी विडंबना को पाठक पर छोड़ता है।
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: चोरों या लुटेरों से
  rationale: κλέπται और λῃσταί के बीच चोरी और हिंसक लूट का अर्थभेद सहज आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: οὐ μὴ διασώσωνται
  choice: अपने को कदापि नहीं बचा सकते
  rationale: οὐ μή की प्रबल निषेधात्मकता को 'कदापि नहीं' व्यक्त करता है; आत्मरक्षात्मक अर्थ मूर्तियों की असमर्थता पर व्यंग्य को उभारता है।
- source_word: θεοὶ ξύλινοι
  choice: लकड़ी के वे देवता
  rationale: मूल के 'देवता' शब्द को बदलकर 'मूर्तियाँ' नहीं किया गया, ताकि कथन की विडंबना बनी रहे।
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: जिन पर चाँदी और सोना मढ़ा है
  rationale: दोनों यौगिक विशेषणों का अर्थ बाहरी आवरण है; 'मढ़ा' निर्मित वस्तु और उसकी सतही सजावट को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में θεοί का अनुवाद
  choice: देवता
  alternative: मूर्तियाँ; तथाकथित देवता
  rationale: मूल पाठ सीधे 'देवता' कहता है और संदर्भ उस दावे का उपहास करता है। व्याख्यात्मक शब्द जोड़ने के बजाय मूल की धार्मिक और आलंकारिक खींचतान सुरक्षित रखी गई है।
- issue: διασώσωνται में आत्मरक्षा या बच निकलने का भाव
  choice: अपने को ... बचा सकते
  alternative: बच नहीं सकते; सुरक्षित नहीं रह सकते
  rationale: मध्यवाच्य रूप और प्रसंग कथित देवताओं की स्वयं को बचाने की असमर्थता पर जोर देते हैं; फिर भी वैकल्पिक रूप को पादटिप्पणी में स्वीकार किया गया है।
