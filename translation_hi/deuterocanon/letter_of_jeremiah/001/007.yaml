  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: hi
  text: क्योंकि उनकी जीभ को कारीगर ने खुरचा है[a], और वे सोने और चाँदी से मढ़े हुए हैं; पर वे असत्य हैं[b] और बोल नहीं सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कारीगर ने उनकी जीभ को घिसा है” या “तराशा है।” यूनानी क्रिया कारीगर के खुरचने या घिसकर समतल करने के काम पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे झूठ हैं।” यूनानी शब्द मूर्तियों को झूठी वस्तुएँ अथवा झूठ का मूर्त रूप बता सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: जीभ
  rationale: यहाँ मूर्तियों के बोल न सकने की बात है, इसलिए शारीरिक अंग के अर्थ में ‘जीभ’ उपयुक्त है, न कि अमूर्त ‘भाषा’।
- source_word: κατεξυσμένη
  choice: खुरचकर बनाई गई है
  rationale: पूर्ण कृदन्त कारीगर द्वारा खुरचने या घिसने की प्रक्रिया दर्शाता है। ‘बनाई गई’ जोड़ने से हिन्दी में वाक्य स्वाभाविक रहता है, जबकि ठोस शिल्प-क्रिया भी बनी रहती है।
- source_word: ὑπὸ τέκτονος
  choice: कारीगर द्वारा
  rationale: τέκτων लकड़ी या अन्य सामग्री पर काम करने वाले शिल्पी का व्यापक बोध करा सकता है; प्रसंग किसी विशेष पेशे को निश्चित नहीं करता।
- source_word: περίχρυσα καὶ περιάργυρα
  choice: सोने और चाँदी से मढ़े हुए
  rationale: दोनों विशेषण मूर्तियों पर इन धातुओं का बाहरी आवरण बताते हैं। ‘मढ़े हुए’ हिन्दी में स्वाभाविक और सामग्री-केंद्रित अभिव्यक्ति है।
- source_word: ψευδῆ
  choice: झूठे
  rationale: नपुंसकलिंग बहुवचन विधेय मूर्तियों को असत्य या झूठी वस्तुएँ ठहराता है। ‘झूठे’ संक्षिप्त है और सक्रिय छल का अतिरिक्त अर्थ अनिवार्य नहीं करता।
- source_word: οὐ δύνανται λαλεῖν
  choice: बोल नहीं सकते
  rationale: असमर्थता और बोलने की क्रिया का सीधा, स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: मूर्तियों के लिए ψευδῆ विधेय का स्वरूप
  choice: वे झूठे हैं
  alternative: वे झूठ हैं
  rationale: यूनानी शब्द मूर्तियों को झूठी वस्तुएँ भी कह सकता है और स्वयं ‘झूठ’ भी। मुख्य पाठ में विशेषणात्मक रूप मूल की अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है; अधिक प्रबल संज्ञात्मक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘कारीगर’, ‘मढ़े हुए’ और ‘बोल नहीं सकते’ सामान्य पाठक के लिए सहज हैं। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न [a] और [b] स्पष्ट रूप से उपस्थित हैं।
