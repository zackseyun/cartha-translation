  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/009.yaml
  text: And there are times when the priests[a], taking gold and silver from their gods, spend it on themselves,
translation:
  language: hi
  text: और कभी-कभी याजक अपने देवताओं से सोना और चाँदी निकालकर[a] अपने लिए खर्च करते हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चुपके से निकालकर’ अथवा ‘चुराकर’।
    reason: ὑφαιρούμενοι का मूल अर्थ निकाल लेना या हटा लेना है; इसमें गुप्त रूप से लेने अथवा चोरी करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: और कभी-कभी
  rationale: यह मुहावरा किसी एक घटना के बजाय समय-समय पर होने वाली बात बताता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ὑφαιρούμενοι
  choice: चुपके से निकालकर
  rationale: कृदंत में किसी वस्तु को गुप्त ढंग से हटा लेने या चुरा लेने का भाव हो सकता है। यह चयन उस निहित गोपनीयता को रखता है, पर सीधे ‘चुराकर’ कहकर अपराध की तीव्रता को अनिवार्य नहीं बनाता।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: मन्दिर और देव-सेवा के प्रसंग में ἱερεῖς का प्रचलित, गरिमापूर्ण हिन्दी रूप।
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: अपने देवताओं से
  rationale: यह उस स्रोत को व्यक्त करता है जहाँ से बहुमूल्य धातुएँ हटाई जाती हैं और इस विडंबना को बनाए रखता है कि याजक उन्हीं देवताओं को लूटते हैं जिनकी वे सेवा करते हैं।
- source_word: χρυσὸν καὶ ἀργύριον
  choice: सोना और चाँदी
  rationale: यूनानी पाठ केवल बहुमूल्य धातुओं के नाम देता है, उनके आभूषण या वस्तुएँ होने का उल्लेख नहीं करता।
- source_word: εἰς ἑαυτοὺς
  choice: अपने ऊपर
  rationale: καταναλοῦσιν के साथ यह अपने निजी लाभ या उपयोग के लिए खर्च करने का भाव देता है।
- source_word: καταναλοῦσιν
  choice: खर्च कर देते हैं
  rationale: क्रिया का अर्थ खपा देना, उपयोग कर डालना या खर्च करना है; सोने और चाँदी के संदर्भ में ‘खर्च कर देते हैं’ सहज और सटीक है।
theological_decisions:
- issue: मूर्तियों के प्रति याजकों के दुराचार का चित्रण
  choice: याजक देवताओं से बहुमूल्य धातुएँ गुप्त ढंग से निकालकर अपने ऊपर खर्च करते हैं।
  alternative: ‘चुराकर’ कहकर अपराध को और स्पष्ट किया जा सकता है।
  rationale: पद मूर्तियों की असमर्थता और उनके याजकों के भ्रष्ट आचरण पर व्यंग्य करता है। अनुवाद इस बल को बनाए रखते हुए ὑφαιρούμενοι के अर्थ को अनावश्यक रूप से केवल ‘चोरी’ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु शास्त्रीय प्रसंग के अनुरूप गरिमापूर्ण। वाक्य के अंत का अल्पविराम स्रोत में आगे जारी रहने वाले वाक्य को दर्शाता है।
