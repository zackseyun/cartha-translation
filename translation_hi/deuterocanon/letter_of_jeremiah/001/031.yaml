  rationale: यह तुलना और अनिश्चित बहुवचन को सरल, स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: मृतक के शोक-भोज में
  rationale: περίδειπνον मृत व्यक्ति से संबंधित शोक या अंत्येष्टि के अवसर के भोज को सूचित करता है। ‘शोक-भोज’ सांस्कृतिक अर्थ स्पष्ट करता है, जबकि ‘मृतक के’ संबंध को बनाए रखता है।
