  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/023.yaml
  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: hi
  text: क्योंकि शोभा के लिए उन पर चढ़ाया गया सोना—यदि कोई उसकी जंग[a] न पोंछे—तो वे निश्चय ही नहीं चमकेंगे; क्योंकि जब वे ढाले जा रहे थे, तब भी उन्हें कुछ पता नहीं चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: क्षरण अथवा मैल।'
    reason: यूनानी ἰός सामान्यतः जंग या क्षरण का बोध कराता है, यद्यपि सोने के संदर्भ में मैल या धूमिल परत अभिप्रेत हो सकती है।
lexical_decisions:
- source_word: χρυσίον
  choice: सोना
  rationale: यह यूनानी संज्ञा मूर्तियों पर सजावट के लिए चढ़ाए गए सोने को दर्शाती है।
- source_word: περιτίθενται εἰς κάλλος
  choice: शोभा के लिए उन पर चढ़ाया गया
  rationale: περιτίθημι का आशय किसी वस्तु के चारों ओर लगाने या उस पर मढ़ने से है; हिन्दी में सोने की सजावटी परत के लिए ‘चढ़ाया गया’ स्वाभाविक है।
- source_word: ἰόν
  choice: जंग
  rationale: मूल शब्द धातु के जंग या क्षरण को दर्शा सकता है। सोने के संदर्भ में ‘मैल’ या ‘कलंक’ अधिक व्यवहारिक लग सकता है, पर मूल की असामान्य और तीखी छवि बनाए रखने के लिए ‘जंग’ रखा गया है।
- source_word: οὐ μὴ στίλψωσιν
  choice: वे निश्चय ही नहीं चमकेंगे
  rationale: οὐ μή प्रबल निषेध है। बहुवचन क्रिया στίλψωσιν को सुरक्षित रखते हुए इसका कर्ता प्रसंग की मूर्तियाँ समझा गया है, न कि एकवचन ‘सोना’।
- source_word: ἐχωνεύοντο
  choice: ढाले जा रहे थे
  rationale: χωνεύω धातु गलाने और साँचे में ढालने की प्रक्रिया के लिए प्रयुक्त होता है; यहाँ निर्मित मूर्तियों के संदर्भ में ‘ढाले’ उपयुक्त है।
- source_word: ᾐσθάνοντο
  choice: उन्हें कुछ पता नहीं चला
  rationale: क्रिया का अर्थ अनुभव करना या बोध होना है; यह रूप मूर्तियों की संवेदनहीनता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: निर्जीव मूर्तियों की संवेदनहीनता
  choice: ‘जब वे ढाले जा रहे थे, तब भी उन्हें कुछ पता नहीं चला’
  alternative: ‘ढाले जाते समय भी उन्होंने उसे महसूस नहीं किया’
  rationale: मूल पाठ मूर्तियों के न देख पाने या न समझ पाने पर व्यंग्य करता है। हिन्दी में अनावश्यक कर्म ‘उसे’ जोड़ने के बजाय मूल की खुली अभिव्यक्ति और निर्जीवता पर उसका बल रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified किंतु सहज शैली अपनाई गई है। दीर्घ वाक्य और अर्धविराम मूल यूनानी के कारणात्मक संबंध को बनाए रखते हैं। बहुवचन ‘वे’ मूल की बहुवचन क्रिया को सुरक्षित रखता है और प्रसंग में मूर्तियों की ओर संकेत करता है।
