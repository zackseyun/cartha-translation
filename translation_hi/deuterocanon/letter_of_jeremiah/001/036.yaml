translation:
  language: hi
  text: वे किसी अंधे मनुष्य को देखने में समर्थ कदापि नहीं कर सकते[a], और संकट में पड़े किसी मनुष्य को बचा भी नहीं सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी अंधे मनुष्य को देखने के लिए खड़ा नहीं कर सकते।” यूनानी वाक्यांश संक्षिप्त है; इसका अर्थ अधिक व्यापक रूप से “किसी अंधे मनुष्य को देखने में समर्थ नहीं कर सकते” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यूनानी में दोनों बार एकवचन ἄνθρωπον है। हिन्दी में ‘मनुष्य’ प्रतिनिधिक एकवचन को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से केवल पुरुष लिंग तक अर्थ सीमित नहीं करता।
- source_word: τυφλὸν
  choice: अंधे
  rationale: यह शारीरिक दृष्टिहीनता का सीधा और सामान्य आधुनिक हिन्दी रूप है।
- source_word: εἰς ὅρασιν
  choice: देखने योग्य
  rationale: शाब्दिक भाव ‘देखने/दृष्टि के लिए’ है। ‘देखने योग्य’ उद्देश्य या परिणामी अवस्था को व्यक्त करता है, पर अपने आप चंगाई की विशिष्ट शब्दावली नहीं जोड़ता।
- source_word: οὐ μὴ
  choice: कदापि नहीं ... सकते
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को वर्तमान, गरिमापूर्ण हिन्दी में स्पष्ट करता है। दूसरी समानांतर उपवाक्य में ‘भी नहीं’ उसी पूर्ण असमर्थता को आगे बढ़ाता है।
- source_word: περιστήσωσιν
  choice: बना सकते
  rationale: क्रिया यहाँ किसी को एक अवस्था में ला खड़ा करने या स्थापित करने का भाव देती है। ‘देखने योग्य बना सकते’ यूनानी की संक्षिप्त संरचना का स्वाभाविक हिन्दी रूप है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν ἀνάγκῃ ... ὄντα
  choice: संकट में पड़े
  rationale: ἀνάγκη यहाँ दबाव, विपत्ति या कठिन दशा सूचित करता है और ὄντα उस दशा में होने को। ‘संकट में पड़े’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐξέλωνται
  choice: छुड़ा ... सकते
  rationale: ἐξαιρέω का मध्य रूप संकट या खतरे से निकालने अथवा बचाने का अर्थ देता है। ‘छुड़ाना’ प्रसंगानुकूल, स्पष्ट और धार्मिक रूप से अनावश्यक रूप से विशिष्ट नहीं है।
theological_decisions:
- issue: प्रतिनिधिक एकवचन ἄνθρωπον का लिंग-संबंधी रूप
  choice: मनुष्य
  alternative: पुरुष; व्यक्ति
  rationale: यूनानी पुल्लिंग व्याकरणिक रूप मानव व्यक्ति को सामान्य रूप से दर्शाता है। हिन्दी ‘मनुष्य’ एकवचन और मानव-संदर्भ दोनों बचाता है, जबकि अर्थ को केवल वयस्क पुरुष तक सीमित करने से बचता है।
- issue: मूर्तियों की असमर्थता की तीव्रता
  choice: कदापि नहीं ... सकते
  alternative: बिलकुल नहीं कर सकते; किसी रीति से नहीं कर सकते
  rationale: प्रबल οὐ μή को पूर्ण असमर्थता के रूप में सुरक्षित रखा गया है; इसे केवल संभाव्यता या भविष्यवाणी नहीं बनाया गया।
- issue: अंधे मनुष्य के संबंध में क्रिया का आशय
  choice: देखने योग्य ... बना सकते
  alternative: देखने के लिए खड़ा कर सकते
  rationale: περιστήσωσιν εἰς ὅρασιν संक्षिप्त और कुछ असामान्य है। मुख्य पाठ अर्थपूर्ण हिन्दी देता है, जबकि पादटिप्पणी अधिक रूप-सन्निकट संभावना सुरक्षित रखती है और किसी विशिष्ट चंगाई-सिद्धान्त को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। समानांतर निषेध और मूर्तियों की पूर्ण असमर्थता पर बल सुरक्षित रखा गया है। ‘मनुष्य’ सामान्य मानव-संदर्भ के लिए चुना गया है।
