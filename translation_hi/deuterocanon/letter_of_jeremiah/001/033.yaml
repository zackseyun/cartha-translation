  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/033.yaml
  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: hi
  text: चाहे उन्हें किसी के हाथों कुछ बुरा सहना पड़े या कुछ भला मिले, वे उसका प्रतिदान नहीं दे सकेंगे[a]; वे न किसी राजा को स्थापित कर सकते हैं, न उसे हटा सकते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ बदले में लौटाना या प्रतिदान देना है; यह हानि या भलाई, दोनों के प्रत्युत्तर के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “न राजा को स्थापित कर सकते हैं, न हटा सकते हैं”; दूसरे खंड में “राजा” स्वतः समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: चाहे ... या
  rationale: यह युग्म दो वैकल्पिक परिस्थितियाँ प्रस्तुत करता है। आधुनिक हिन्दी में ‘चाहे ... या’ मूल के संबंध को सहज रूप से व्यक्त करता है।
- source_word: κακόν τι πάθωσιν ὑπό τινος
  choice: उन्हें किसी के हाथों कुछ बुरा सहना पड़े
  rationale: πάσχω किसी बात को सहने या भोगने और ὑπό τινος अनिर्दिष्ट कर्ता को व्यक्त करता है। यह अनुवाद निष्क्रिय भाव और हानि के सामान्य अर्थ, दोनों को बनाए रखता है।
- source_word: ἀγαθόν
  choice: कुछ भला मिले
  rationale: दूसरी शर्त में क्रिया प्रसंग से समझी जाती है। ‘कुछ भला मिले’ हिन्दी में स्वाभाविक है और κακόν के साथ विरोध को स्पष्ट रखता है, बिना भलाई के प्रकार को सीमित किए।
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: वे उसका प्रतिदान नहीं दे सकते
  rationale: ἀνταποδίδωμι का अर्थ बदले में लौटाना या उसी के अनुसार फल देना है और यह भले तथा बुरे, दोनों के प्रत्युत्तर पर लागू हो सकता है। ‘प्रतिदान’ इस पारस्परिक भाव को अपेक्षाकृत संक्षिप्त ढंग से रखता है।
- source_word: καταστῆσαι βασιλέα
  choice: किसी राजा को स्थापित कर सकते हैं
  rationale: καθίστημι यहाँ राजा को नियुक्त या सत्ता में स्थापित करने के राजनीतिक अर्थ में है। ‘स्थापित करना’ औपचारिक होते हुए भी सामान्य हिन्दी में स्पष्ट है।
- source_word: ἀφελέσθαι
  choice: उसे हटा सकते हैं
  rationale: क्रिया का मूल अर्थ हटा लेना है; कर्म ‘राजा’ पिछले पद से समझा जाता है। ‘हटा सकते हैं’ अर्थ को सुरक्षित रखता है और ‘पदच्युत’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
theological_decisions:
- issue: मूर्तियों की असमर्थता का दायरा
  choice: वे अपने साथ हुए बुरे या भले व्यवहार का प्रतिदान नहीं दे सकतीं और किसी राजा को स्थापित या हटा नहीं सकतीं।
  alternative: प्रतिदान को केवल बुराई का दंड देने तक सीमित समझना।
  rationale: यूनानी वाक्य भले और बुरे, दोनों को एक ही ἀνταποδοῦναι के अधीन रखता है। इसलिए अनुवाद मूर्तियों की पारस्परिक और राजनीतिक, दोनों प्रकार की असमर्थता को बनाए रखता है और दायरे को केवल दंड तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रतिदान’ कुछ औपचारिक शब्द है, पर यहाँ वह भले और बुरे दोनों के बदले में दिए जाने वाले प्रत्युत्तर को एक ही शब्द में व्यक्त करता है।
