  verdict: revise
  source_fidelity: 'The draft correctly reflects the temporal participle, the crowd, the contrast between bodily prostration and worship, the inward imperative, the emphatic dative address to God, the necessity expressed by δεῖ, and Δέσποτα as “स्वामी.” However, the wording of the first clause is syntactically unclear in Hindi: “एक भीड़ को उनके सामने दण्डवत करते” can momentarily obscure who is bowing and to whom.'
  naturalness: “एक भीड़ को उनके आगे और पीछे एक भीड़ को उनके सामने दण्डवत करते देखो” is not idiomatic Hindi construction as drafted, especially with the repeated pronouns and the bare participial phrase after “भीड़ को.” Using “उन्हें दण्डवत करते हुए” directly and placing the spatial phrase with the crowd makes the relationships clear and natural.
  terminology: “दण्डवत” appropriately represents the bodily aspect of προσκυνέω, while “आराधना” appropriately expresses its religious sense in the address to God. “हे स्वामी” faithfully preserves the distinction between Δέσποτα and κύριε. “आपकी ही” adequately conveys the emphasis of Σοί without adding “केवल,” which is not explicitly present in the Greek.
  issues:
  - severity: medium
    issue: The first clause has unclear Hindi syntax and reference.
    rationale: The Greek states that a crowd, positioned before and behind the idols, is bowing down to the idols. The draft’s “एक भीड़ को उनके सामने दण्डवत करते” is awkward and can blur the subject/object relations. “एक भीड़ को उनके आगे और पीछे उन्हें दण्डवत करते हुए” clearly represents both the crowd’s position and its action toward the idols.
  revised_text: जब तुम एक भीड़ को उनके आगे और पीछे उन्हें दण्डवत करते हुए देखो[a], तो अपने मन में कहो, “हे स्वामी, आपकी ही आराधना करनी चाहिए।”
