lexical_decisions:
- source_word: ἰδόντας
  choice: जब तुम ... देखो
  rationale: यूनानी कृदन्त को अगले बहुवचन आदेश के निहित संबोधन के साथ कालसूचक उपवाक्य के रूप में रखा गया है; इससे अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: ὄχλον
  choice: एक भीड़
  rationale: ὄχλος का सामान्य अर्थ लोगों की भीड़ या जनसमूह है; आधुनिक हिन्दी में ‘भीड़’ सहज है।
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: उनके आगे और पीछे
  rationale: यह मूर्तियों के दोनों ओर लोगों की स्थानिक स्थिति को सीधे बनाए रखता है।
- source_word: προσκυνοῦντας αὐτά
  choice: उनके सामने दण्डवत करते
  rationale: προσκυνέω शारीरिक रूप से झुकने/दण्डवत करने और धार्मिक आराधना, दोनों को व्यक्त कर सकता है। यहाँ दृश्य शारीरिक क्रिया को रखा गया है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: तो अपने मन में कहो
  rationale: διάνοια विचार और आन्तरिक समझ को दर्शाता है। ‘मन में’ बिना बोले भीतर कहने का स्वाभाविक हिन्दी रूप है। δέ को प्रसंगानुकूल ‘तो’ से जोड़ा गया है।
- source_word: Σοί
  choice: केवल आपकी ही
  rationale: आरम्भ में रखे गए बलयुक्त दत्तिव Σοί को हिन्दी में ‘आपकी ही’ से उभारा गया है; ‘केवल’ विरोध को स्वाभाविक रूप से स्पष्ट करता है, यद्यपि अलग यूनानी शब्द के रूप में नहीं है।
- source_word: δεῖ
  choice: करनी चाहिए
  rationale: δεῖ आवश्यकता या बाध्यता व्यक्त करता है। ‘चाहिए’ हिन्दी में अवैयक्तिक दायित्व को बिना किसी अनुल्लिखित कर्ता को जोड़ने के व्यक्त करता है।
- source_word: προσκυνεῖν
  choice: आराधना करनी
  rationale: परमेश्वर को किए गए सीधे संबोधन में προσκυνέω का धार्मिक अर्थ प्रधान है; इसलिए यहाँ ‘आराधना’ उपयुक्त है।
- source_word: Δέσποτα
  choice: हे स्वामी
  rationale: Δέσποτα, κύριε से भिन्न पद है। ‘स्वामी’ उसके अधिकारपूर्ण संबोधन को सुरक्षित रखता है और आधुनिक हिन्दी में गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय संबोधन Δέσποτα का अनुवाद
  choice: हे स्वामी
  alternative: हे प्रभु / हे सार्वभौम स्वामी
  rationale: मूल में κύριος नहीं, बल्कि Δέσποτα है। ‘स्वामी’ इस शब्दभेद को बनाए रखता है और मूर्तियों के विपरीत परमेश्वर के अधिकार तथा आराधना-योग्यता को बिना किसी संप्रदायगत विस्तार के व्यक्त करता है।
- issue: Σοί में निहित बल
  choice: केवल आपकी ही आराधना
  alternative: आपकी आराधना करनी चाहिए
  rationale: Σοί वाक्य के आरम्भ में बल के साथ है और प्रसंग मूर्तियों की आराधना के निषेध का है। हिन्दी में ‘आपकी ही’ उस बल को रखता है; ‘केवल’ अनन्यता को स्वाभाविक बनाता है, पर कोई अतिरिक्त आराध्य निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन और आदरार्थक ईश्वरीय सर्वनाम अपनाए गए हैं। शैली सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘दण्डवत’ दृश्य शारीरिक क्रिया को और ‘आराधना’ परमेश्वर के प्रति धार्मिक अर्थ को अलग-अलग स्पष्ट करते हैं।
