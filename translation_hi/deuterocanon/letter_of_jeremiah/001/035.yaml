lexical_decisions:
- source_word: ἐκ θανάτου
  choice: मृत्यु से
  rationale: ἐκ के साथ θανάτου मृत्यु के क्षेत्र या संकट से बचाव व्यक्त करता है। ‘मृत्यु से’ स्वाभाविक हिन्दी है और यह तय नहीं करता कि आशय आसन्न मृत्यु है या मृत्यु की दशा।
- source_word: ἄνθρωπον
  choice: किसी मनुष्य को
  rationale: ἄνθρωπον यहाँ एकवचन में सामान्य मानव-संदर्भ रखता है। ‘किसी मनुष्य को’ यूनानी रूप और सार्वत्रिक आशय दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐ μὴ ῥύσωνται
  choice: कदापि नहीं बचा सकते
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है, जिसे ‘कदापि नहीं’ सुरक्षित रखता है। प्रसंग मूर्तियों की सामर्थ्यहीनता का है, इसलिए यूनानी भविष्यत् रूप का आशय हिन्दी में स्वाभाविक रूप से योग्यता-सूचक ‘नहीं बचा सकते’ द्वारा व्यक्त होता है।
- source_word: ἥττονα
  choice: निर्बल को
  rationale: ἥττονα तुलनात्मक विशेषण है और ἰσχυροῦ के विपरीत कम बलवान व्यक्ति को दर्शाता है। ‘निर्बल’ संक्षिप्त और स्पष्ट विरोध बनाए रखता है।
- source_word: ἀπὸ ἰσχυροῦ
  choice: बलवान के हाथ से
  rationale: ἀπό उस बलवान पक्ष को दर्शाता है जिससे छुड़ाया जाना आवश्यक है। हिन्दी मुहावरे में ‘के हाथ से’ उत्पीड़क या अधिक शक्तिशाली व्यक्ति से छुटकारे का अर्थ स्वाभाविक ढंग से देता है।
- source_word: μὴ ἐξέλωνται
  choice: न ही ... छुड़ा सकते हैं
  rationale: ἐξαιρέω का मध्यवाच्य रूप संकट या किसी के अधिकार से छुड़ाने का अर्थ दे सकता है। ‘छुड़ा सकते हैं’ पहले उपवाक्य के बचाव-अर्थ के समानांतर और हिन्दी में सहज है।
