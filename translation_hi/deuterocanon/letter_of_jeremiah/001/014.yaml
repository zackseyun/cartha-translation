base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: hi
  text: उसके दाहिने हाथ में एक कटार[a] और एक कुल्हाड़ी है, फिर भी वह युद्ध और लुटेरों[b] से अपने आपको नहीं बचा सकता। इससे स्पष्ट है कि वे देवता नहीं हैं; इसलिए उनसे मत डरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोटी तलवार।’ यूनानी शब्द हाथ में धारण किए जाने वाले हथियार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘डाकुओं से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: कटार
  rationale: यह यूनानी शब्द हाथ में धारण किए जाने वाले छोटे धारदार हथियार को दर्शाता है; आधुनिक हिन्दी में ‘कटार’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δεξιᾷ
  choice: उसके दाहिने हाथ में
  rationale: ἔχει के साथ यह दाहिने हाथ में वस्तु धारण करने का भाव देता है।
- source_word: πέλεκυν
  choice: कुल्हाड़ी
  rationale: यूनानी शब्द का सामान्य और सीधा हिन्दी समतुल्य ‘कुल्हाड़ी’ है।
- source_word: ἐξελεῖται
  choice: अपने आपको नहीं बचा सकता
  rationale: मध्यवाच्य रूप और ἑαυτόν आत्म-उद्धार का भाव देते हैं; ‘बचा सकता’ युद्ध और लुटेरों के खतरे के संदर्भ में सहज हिन्दी है।
- source_word: λῃστῶν
  choice: लुटेरों
  rationale: यह हिंसक लूट करने वालों के लिए व्यापक और आधुनिक हिन्दी शब्द है; ‘डाकुओं’ की विशेष छाया भी संभव है।
- source_word: ὅθεν
  choice: इससे
  rationale: यह पिछले कथन से निकाले गए निष्कर्ष को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: γνῶριμοί εἰσιν
  choice: स्पष्ट है
  rationale: शाब्दिक रूप से ‘ज्ञात/पहचाने जाते हैं’ का यहाँ मुहावरेदार आशय उनकी वास्तविकता का स्पष्ट हो जाना है।
- source_word: οὐκ ὄντες θεοί
  choice: वे देवता नहीं हैं
  rationale: कृदन्तीय यूनानी वाक्यांश को स्पष्ट हिन्दी सीमित क्रिया में प्रस्तुत किया गया है, बिना उसके दावे को बढ़ाए।
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: इसलिए उनसे मत डरो
  rationale: निषेधात्मक उपदेश और उससे पहले के तार्किक निष्कर्ष, दोनों को संक्षिप्त और स्वाभाविक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: एकवचन मूर्ति के वर्णन से बहुवचन निष्कर्ष की ओर परिवर्तन
  choice: पहले वाक्य में एकवचन (‘उसके’, ‘वह’) और निष्कर्ष में बहुवचन (‘वे’, ‘उनसे’) बनाए रखा गया।
  alternative: पूरे पद को बहुवचन में समतल करना।
  rationale: यूनानी पाठ पहले एक प्रतिनिधि मूर्ति का वर्णन करता है और फिर निष्कर्ष को ऐसी सभी मूर्तियों पर लागू करता है; संख्या-परिवर्तन उसकी मूल वक्तृत्व-रचना का अंग है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘देवता’ बहुवचन निष्कर्ष को स्वाभाविक रूप से व्यक्त करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
