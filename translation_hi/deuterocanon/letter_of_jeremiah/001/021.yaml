translation:
  language: hi
  text: उनकी देह और सिर पर चमगादड़, अबाबील और पक्षी आ बैठते हैं[a]; उसी प्रकार बिल्लियाँ भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उतरते हैं” अथवा “उड़कर उन पर बैठते हैं।”
    reason: ἐφίπτανται में उड़कर किसी वस्तु पर उतरने और वहाँ बैठने, दोनों का भाव हो सकता है।
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: उनकी देह और सिर पर
  rationale: दोहराए गए ἐπί का स्थान-संबंध हिन्दी के स्वाभाविक ‘पर’ से व्यक्त होता है। αὐτῶν मूर्तियों के बहुवचन संदर्भ को स्पष्ट करता है; हिन्दी में ‘उनकी देह और सिर’ सामूहिक रूप से स्वाभाविक है।
- source_word: ἐφίπτανται
  choice: आ बैठते हैं
  rationale: क्रिया उड़कर किसी सतह पर उतरने या बैठने का भाव देती है। ‘आ बैठते हैं’ पक्षियों और चमगादड़ों के लिए स्वाभाविक है तथा मूर्तियों पर उनके निर्बाध बैठने की छवि बनाए रखता है।
- source_word: νυκτερίδες
  choice: चमगादड़
  rationale: इस यूनानी शब्द का सामान्य और प्रत्यक्ष अर्थ ‘चमगादड़’ है।
- source_word: χελιδόνες
  choice: अबाबील
  rationale: χελιδών एक विशिष्ट पक्षी, swallow, को सूचित करता है; आधुनिक हिन्दी में उसका प्रचलित नाम ‘अबाबील’ है।
- source_word: τὰ ὄρνεα
  choice: दूसरे पक्षी
  rationale: अबाबील स्वयं पक्षी है, इसलिए केवल ‘पक्षी’ कहने पर सूची अस्पष्ट लग सकती है। ‘दूसरे’ यूनानी के आशय को स्वाभाविक हिन्दी में स्पष्ट करता है कि यहाँ शेष पक्षियों की बात है।
- source_word: ὡσαύτως δὲ καὶ οἱ αἴλουροι
  choice: इसी प्रकार बिल्लियाँ भी
  rationale: ὡσαύτως और καί का समानता तथा अतिरिक्तता का संयुक्त बल ‘इसी प्रकार ... भी’ से सहज रूप में आता है; αἴλουροι का सामान्य अर्थ ‘बिल्लियाँ’ है।
theological_decisions:
- issue: मूर्तियों के विरुद्ध पशु-पक्षियों की छवि का स्वरूप
  choice: 'दृश्य को शाब्दिक रखा गया है: पशु-पक्षी मूर्तियों की देह और सिर पर बैठते हैं।'
  alternative: इसे मूर्तियों की अशुद्धता या किसी विशिष्ट प्रतीकात्मक अर्थ की व्याख्या के रूप में प्रस्तुत करना।
  rationale: मूल पद का व्यंग्य मूर्तियों की असहायता को दृश्य के माध्यम से दिखाता है; अनूदित पाठ में इससे आगे कोई सांप्रदायिक या प्रतीकात्मक व्याख्या जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देह’ मूर्तियों के शरीर के लिए संक्षिप्त और साहित्यिक रूप से उपयुक्त है; ‘आ बैठते हैं’ दृश्य को स्वाभाविक हिन्दी में सजीव करता है।
