lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν
  choice: उनकी पोशाक में से वस्त्र
  rationale: ἱματισμός सामूहिक रूप से पहनावे या वस्त्रों को सूचित करता है; αὐτῶν को सर्वनाम के रूप में बनाए रखा गया है, जबकि ‘में से’ हटाकर लेने के स्रोत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀφελόμενοι
  choice: उतारकर
  rationale: ἀφαιρέω के एओरिस्ट कृदन्त से मुख्य क्रिया से पहले वस्त्र हटा लेने का भाव आता है; मूर्तियों पर पहनाए वस्त्रों के संदर्भ में ‘उतारकर’ सटीक और स्वाभाविक है।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: यूनानी में निश्चित उपपद है, पर हिन्दी में प्रसंग से पहचाने गए बहुवचन कर्ता के लिए अलग निश्चिततासूचक शब्द आवश्यक नहीं।
- source_word: ἐνδύουσιν
  choice: पहनाते हैं
  rationale: यहाँ क्रिया किसी दूसरे व्यक्ति को वस्त्र पहनाने के अर्थ में है; ‘पहनाते हैं’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: τὰς γυναῖκας αὐτῶν καὶ τὰ παιδία
  choice: अपनी पत्नियों और बच्चों को
  rationale: αὐτῶν याजकों से संबंधित पत्नियों को सूचित करता है; हिन्दी का ‘अपनी’ कर्ता-संबंध स्पष्ट करता है। παιδία को सामान्य और समावेशी ‘बच्चों’ से अनूदित किया गया है।
theological_decisions:
- issue: αὐτῶν (‘उनकी’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उनकी’ रखा गया है और पाद-टिप्पणी में स्पष्ट किया गया है कि यह मूर्तियों की ओर संकेत करता है।
  alternative: मुख्य पाठ में सीधे ‘मूर्तियों की पोशाक’ कहना।
  rationale: आस-पास के प्रसंग में सर्वनाम का संकेत मूर्तियों की ओर है, किंतु यूनानी मूल में संज्ञा दुबारा नहीं आती। इसलिए मुख्य पाठ मूल की सर्वनामिक अभिव्यक्ति को सुरक्षित रखता है और अस्पष्टता दूर करने के लिए टिप्पणी देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘याजक’ धार्मिक प्रसंग के अनुकूल प्रचलित शब्द है। वाक्य-क्रम यूनानी कृदन्त की पूर्ववर्ती क्रिया को सहज हिन्दी में व्यक्त करता है।
