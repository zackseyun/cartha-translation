translation:
  language: hi
  text: क्योंकि वे किसी देश के लिए राजा कभी स्थापित नहीं करेंगे, न ही मनुष्यों को कभी वर्षा देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλέα
  choice: राजा
  rationale: यह ἀναστήσωσιν का कर्म है; यूनानी में अनिश्चित प्रयोग है, जिसे हिन्दी में बिना अनावश्यक लेख के स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: χώρας
  choice: किसी देश के लिए
  rationale: χώρα भूमि, देश या प्रदेश का बोध करा सकता है। यहाँ राजा के राजनीतिक-भौगोलिक क्षेत्र के कारण ‘देश’ सहज है; ‘किसी’ यूनानी के अनिश्चित भाव को व्यक्त करता है।
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: खड़ा नहीं कर सकते
  rationale: οὐ μή प्रबल निषेध है। मूर्तियों की असमर्थता के प्रसंग में हिन्दी का ‘नहीं कर सकते’ निश्चित और स्वाभाविक निषेध देता है; ‘राजा खड़ा करना’ शासक को स्थापित करने का भाव बनाए रखता है।
- source_word: ὑετόν
  choice: वर्षा
  rationale: यह सामान्य रूप से वर्षा के लिए प्रयुक्त शब्द है; ‘वर्षा’ आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: ἀνθρώποις
  choice: मनुष्यों को
  rationale: बहुवचन ἄνθρωποι यहाँ समस्त मानव समुदाय के लिए सामान्य अर्थ में है। ‘मनुष्यों’ स्रोत के मानव-संदर्भ को स्पष्ट रखता है और केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: οὐ μὴ δῶσιν
  choice: न ही ... दे सकते हैं
  rationale: दूसरा οὐ μή भी प्रबल निषेध व्यक्त करता है। समन्वित हिन्दी वाक्य में ‘और न ही’ इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाला संयोजक है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट करता है।
theological_decisions:
- issue: मूर्तियों की असमर्थता और οὐ μή का बल
  choice: ‘नहीं कर सकते’ के द्वारा पूर्ण असमर्थता व्यक्त की गई
  alternative: ‘निश्चय ही नहीं करेंगे’
  rationale: संदर्भ में कथन केवल भविष्य की अनिच्छा नहीं, बल्कि राजा स्थापित करने और वर्षा देने में मूर्तियों की अक्षमता बताता है। हिन्दी में सामर्थ्यसूचक निषेध इस आशय और प्रबल नकार दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- issue: ἀνθρώποις का सामान्य मानव-संदर्भ
  choice: मनुष्यों को
  alternative: लोगों को / पुरुषों को
  rationale: यह कथन मानवजाति के बारे में सामान्य है। ‘मनुष्यों’ मूल शब्द का अर्थ स्पष्ट रखता है और इसे केवल पुरुषों का संदर्भ मानने से बचाता है।
