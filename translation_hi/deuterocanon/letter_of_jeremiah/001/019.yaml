  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/019.yaml
  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: hi
  text: वे सचमुच घर की एक शहतीर के समान हैं; पर लोग कहते हैं कि उनके हृदय चाटकर मिटा दिए जाते हैं। धरती पर रेंगने वाले जीव उन्हें और उनके वस्त्रों को खा जाते हैं, फिर भी उन्हें इसका आभास नहीं होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκός
  choice: शहतीर
  rationale: यह घर में लगी संरचनात्मक लकड़ी को दर्शाता है; ‘शहतीर’ आधुनिक हिन्दी में साधारण लट्ठे के बजाय उसी अर्थ को स्पष्ट करता है।
- source_word: καρδίας
  choice: हृदय
  rationale: यद्यपि प्रसंग में मूर्तियों के भीतरी भाग अभिप्रेत हो सकते हैं, ‘हृदय’ यूनानी की मानवीकरणपूर्ण और व्यंग्यात्मक छवि को सुरक्षित रखता है।
- source_word: ἐκλείχεσθαι
  choice: चाटकर मिटा दिए जाते हैं
  rationale: मूल क्रिया ‘चाटने’ की सजीव छवि रखती है और ἐκ- से व्यक्त होते चले जाने/समाप्त होने के भाव को स्वाभाविक हिन्दी में पहुँचाती है।
- source_word: ἑρπετῶν
  choice: रेंगने वाले जीव
  rationale: यह आधुनिक जैव-वर्ग के केवल ‘सरीसृपों’ से अधिक व्यापक है और भूमि पर रेंगने वाले जीवों को दर्शाता है।
- source_word: κατεσθιόντων
  choice: खा जाते हैं
  rationale: यह सक्रिय और पूर्ण उपभोग का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἱματισμὸν
  choice: वस्त्रों
  rationale: मूर्तियों पर चढ़े आवरण या कपड़ों के लिए गरिमापूर्ण और सहज हिन्दी।
- source_word: οὐκ αἰσθάνονται
  choice: उन्हें इसका आभास नहीं होता
  rationale: यह मूर्तियों में संवेदना और चेतना के अभाव को स्पष्ट करते हुए यूनानी के अनुभूति-संबंधी अर्थ को बनाए रखता है।
theological_decisions:
- issue: अंतिम क्रिया और सर्वनामों का संदर्भ
  choice: मूर्तियाँ ही ‘उन्हें’, ‘उनके’ और ‘उन्हें आभास नहीं होता’ की संदर्भ-वस्तु हैं।
  alternative: ‘लोग कहते हैं’ के कारण उपासकों को वाक्य के किसी अगले अंश का कर्ता मानना।
  rationale: तात्कालिक प्रसंग संवेदनहीन मूर्तियों की आलोचना है, और αὐτούς, αὐτῶν तथा οὐκ αἰσθάνονται का निकटतम संदर्भ मूर्तियाँ हैं।
- issue: मूर्तियों के καρδίας का अनुवाद
  choice: मानवीकरण को बनाए रखते हुए ‘हृदय’ रखा गया है।
  alternative: व्याख्यात्मक रूप से ‘भीतरी भाग’ या ‘अंदरूनी हिस्सा’।
  rationale: मूल का व्यंग्य लकड़ी की मूर्तियों के लिए शारीरिक भाषा प्रयुक्त करने में है; ‘हृदय’ उस तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शहतीर’ संरचनात्मक लकड़ी का सटीक शब्द है। अंग्रेज़ी परामर्श-पाठ के विराम-चिह्न का अनुसरण करने के बजाय यूनानी वाक्य-संबंध को हिन्दी में स्वाभाविक रूप से दो वाक्यों में प्रस्तुत किया गया है। मुख्य पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘हृदय’ को सीधे सुरक्षित रखा गया है और अस्पष्टता व्याख्या में दर्ज है।
