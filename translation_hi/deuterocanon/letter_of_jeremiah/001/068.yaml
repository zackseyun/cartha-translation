translation:
  language: hi
  text: किसी भी तरह से हमारे लिए यह स्पष्ट नहीं है कि वे देवता हैं; इसलिए उनसे मत डरो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: किसी भी तरह ... नहीं
  rationale: यह यूनानी मुहावरा पूर्ण निषेध पर बल देता है। यह हिन्दी अभिव्यक्ति उसके प्रबल और व्यापक निषेध को स्वाभाविक ढंग से बनाए रखती है।
- source_word: φανερὸν
  choice: स्पष्ट
  rationale: यहाँ शब्द का अर्थ प्रत्यक्ष या साफ़ तौर पर प्रमाणित होना है। ‘स्पष्ट’ इस ज्ञान-संबंधी बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεοί
  choice: देवता
  rationale: बहुवचन θεοί का सीधा और प्रसंगानुकूल अनुवाद ‘देवता’ है। इससे मूर्तियों के देवत्व का खंडन करने वाला मूल विवादात्मक बल सुरक्षित रहता है।
- source_word: διό
  choice: अतः
  rationale: यह शब्द पिछले कथन से निकले निष्कर्ष को दर्शाता है। ‘अतः’ आरंभिक ‘इसलिए’ की अनावश्यक पुनरावृत्ति से बचते हुए तार्किक संबंध बनाए रखता है।
- source_word: μὴ φοβῆσθε αὐτούς
  choice: उनसे मत डरो
  rationale: निषेधात्मक आज्ञा और बहुवचन सर्वनाम दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम खंड में αὐτούς का संदर्भ
  choice: ‘उनसे’ का संकेत प्रसंग में देवता मानी जाने वाली मूर्तियों की ओर है
  alternative: सर्वनाम के स्थान पर स्पष्ट रूप से ‘उन मूर्तियों से’ कहना
  rationale: मूल यूनानी सर्वनाम ही रखता है। ‘उनसे’ पाठ की संदर्भगत स्पष्टता को बनाए रखते हुए मूल की संरचना से अधिक व्याख्यात्मक नहीं बनता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रत्यक्ष है। ‘देवता’ सामान्य धार्मिक शब्दावली के अनुरूप है, जबकि ‘किसी भी तरह ... नहीं’ मूल के emphatic negation को स्वाभाविक हिन्दी में व्यक्त करता है।
