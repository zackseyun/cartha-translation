  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: hi
  text: और जिस प्रकार राजा के विरुद्ध अपराध करनेवाले किसी व्यक्ति को प्रांगणों से घेरकर सुरक्षित रखा जाता है[a], मानो उसे मृत्यु के लिए ले जाया जा रहा हो, वैसे ही पुरोहित उनके घरों को दरवाज़ों, तालों और अर्गलों से सुरक्षित करते हैं[b], ताकि लुटेरे उन घरों को लूट न लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे राजा के विरुद्ध अपराध करनेवाले किसी व्यक्ति के चारों ओर प्रांगण घेर दिए जाते हैं।” आरंभिक उपमा की यूनानी वाक्यरचना कठिन है; आशय यह है कि मृत्यु के लिए ले जाए जा रहे अपराधी को कड़ी सुरक्षा में रखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: “उनके घरों” से आशय मूर्तियों के घरों, अर्थात् उनके मंदिर-भवनों से है, जिनकी रखवाली पुरोहित करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: चारों ओर प्रांगण घेरकर सुरक्षित किए जाते हैं
  rationale: यूनानी वाक्यांश कठिन है। αὐλαί को ‘प्रांगण’ और पूर्ण निष्क्रिय रूप को घेरकर सुरक्षित किए जाने के रूप में प्रस्तुत किया गया है, ताकि स्थापत्य का अनावश्यक रूप से अधिक विशिष्ट अर्थ न जोड़ा जाए।
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: राजा के विरुद्ध अपराध करनेवाले किसी व्यक्ति
  rationale: ἀδικέω किसी के साथ अन्याय करने या उसके विरुद्ध अपराध करने का भाव देता है। यहाँ राजकीय और दंडात्मक संदर्भ में ‘राजा के विरुद्ध अपराध करना’ स्वाभाविक है।
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: मानो उसे मृत्यु के लिए ले जाया जा रहा हो
  rationale: ἀπάγω पहरे में ले जाए जाने का संकेत देता है। यह अनुवाद प्रक्रिया और गंभीरता बनाए रखता है, पर मुख्य पाठ में ‘फाँसी’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ὀχυροῦσιν
  choice: दृढ़ करते हैं
  rationale: क्रिया का अर्थ मजबूत या किलेबंद करना है। घरों के साथ ‘दृढ़ करते हैं’ हिंदी में स्वाभाविक रहते हुए सुरक्षा की व्यंग्यात्मक छवि बनाए रखता है।
- source_word: τοὺς οἴκους αὐτῶν
  choice: उनके घरों
  rationale: οἴκους का मूल अर्थ ‘घर’ है। सर्वनाम का संबंध प्रसंग में मूर्तियों से है; इसे मुख्य पाठ में शाब्दिक रखा गया और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: दरवाज़ों, तालों और अड़सों से
  rationale: तीनों सुरक्षा-साधनों की संचयी सूची सुरक्षित रखी गई है। μοχλοῖς के लिए ‘अड़से’ भारी पट्टियों/सरियों का स्पष्ट और उपयुक्त हिंदी रूप है।
- source_word: συληθῶσι
  choice: लूट न लें
  rationale: συλάω का अर्थ लूटना या माल छीन लेना है। सक्रिय हिंदी रचना वाक्य को सहज बनाती है और कर्म का संदर्भ ‘उनके घरों’ से स्पष्ट रहता है।
- source_word: λῃστῶν
  choice: लुटेरे
  rationale: λῃσταί साधारण चोरों से अधिक लूटमार करनेवालों या डाकुओं को सूचित कर सकता है; ‘लुटेरे’ व्यापक और सहज समतुल्य है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में ‘उनके घरों’ का संदर्भ
  choice: मुख्य पाठ में ‘उनके घरों’ रखा गया और पादटिप्पणी में इसे मूर्तियों के घरों अथवा मंदिर-भवनों के रूप में स्पष्ट किया गया।
  alternative: ‘उनके मंदिरों’ या ‘उनके देवालयों’ का व्याख्यात्मक अनुवाद।
  rationale: यह यूनानी οἴκους की शाब्दिकता और व्यंग्यात्मक प्रभाव को सुरक्षित रखता है, जबकि पादटिप्पणी पाठक को सर्वनाम के संदर्भ को समझने में सहायता देती है।
- issue: आरंभिक उपमा की कठिन वाक्यरचना
  choice: प्रांगणों को अपराधी के चारों ओर घेरकर सुरक्षित किए जाने की छवि बनाए रखी गई।
  alternative: अपराधी को किसी घेरे या कारागार के भीतर बंद दिखाना।
  rationale: यूनानी पाठ का व्याकरण असामान्य है; इसलिए ऐसे विवरण नहीं जोड़े गए जो पाठ में स्पष्ट नहीं हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज गद्य अपनाया गया है। ‘पुरोहित’, ‘प्रांगण’ और ‘अड़से’ प्रसंग की औपचारिकता बनाए रखते हैं; कठिन यूनानी उपमा की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
