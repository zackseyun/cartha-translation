lexical_decisions:
- source_word: οὗτοι
  choice: ये
  rationale: यह संकेतवाचक सर्वनाम पिछले प्रसंग में वर्णित मूर्तियों की ओर संकेत करता है; अर्थ स्पष्ट होने के कारण ‘मूर्तियाँ’ जोड़ना आवश्यक नहीं है।
- source_word: οὐ διασώζονται
  choice: बचे नहीं रहते
  rationale: यहाँ भाव भौतिक नाश से सुरक्षित या अक्षुण्ण न रह पाने का है। यह प्रयोग ‘उद्धार’ जैसे धार्मिक अर्थ से बचते हुए सहज हिन्दी देता है।
- source_word: ἀπὸ ἰοῦ
  choice: जंग से
  rationale: मूर्तियों के भौतिक क्षय के प्रसंग में ἰός का अर्थ ‘जंग’ या ‘क्षरण’ सर्वाधिक उपयुक्त है।
- source_word: βρωμάτων
  choice: कीड़ों से
  rationale: शब्द का व्यापक अर्थ खाने या नष्ट करनेवाली चीज़ें है, पर अगले वाक्यांश में वस्त्रों का उल्लेख होने से ‘कीड़े’ प्रसंगानुकूल और स्वाभाविक है; व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: περιβεβλημένων αὐτῶν
  choice: हालाँकि इन्हें … पहनाए जाते हैं
  rationale: 'सम्बन्धवाचक निरपेक्ष रचना यहाँ रियायत और विडम्बना व्यक्त करती है: बहुमूल्य वस्त्र पहनाए जाने पर भी मूर्तियाँ क्षय से नहीं बचतीं। कर्मवाच्य ‘पहनाए जाते हैं’ उनकी निष्क्रियता भी बनाए रखता है।'
- source_word: ἱματισμὸν πορφυροῦν
  choice: बैंगनी वस्त्र
  rationale: ἱματισμός सामूहिक रूप से पहनावे को और πορφυροῦν बैंगनी रंग के वैभवशाली वस्त्र को सूचित करता है। ‘बैंगनी वस्त्र’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
