  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरोहित’, ‘मढ़े’ और ‘शहतीर’ संदर्भ की धार्मिक तथा वास्तु-संबंधी सटीकता बनाए रखते हैं। अर्धविराम पुरोहितों और देव-मूर्तियों के विपरीत परिणाम को स्पष्ट करता है।
