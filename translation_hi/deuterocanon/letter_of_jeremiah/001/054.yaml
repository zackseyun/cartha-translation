base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: hi
  text: क्योंकि जैसे कौआ आकाश और पृथ्वी के बीच होता है[a], वैसे ही जब लकड़ी के, या सोने से मढ़े, या चाँदी से मढ़े देवताओं के घर[b] में आग आ पड़े, तब उनके पुरोहित भाग जाएँगे और बच निकलेंगे; पर वे देवता स्वयं बीच के शहतीरों के समान जलकर भस्म हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आरंभिक उपमा बहुत संक्षिप्त है; इस तुलना का सटीक आशय स्पष्ट नहीं किया गया है।
    reason: cultural_note
  - marker: b
    text: या, “लकड़ी के, या सोने से मढ़े, या चाँदी से मढ़े देवताओं के मंदिर में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... καὶ γάρ
  choice: क्योंकि जैसे ... वैसे ही
  rationale: आरंभिक उपमा यूनानी में संक्षिप्त और कुछ असंबद्ध है। हिन्दी में तुलनात्मक संबंध स्पष्ट करने के लिए ‘जैसे ... वैसे ही’ रखा गया है, बिना उपमा का आशय मुख्य पाठ में बढ़ाए।
- source_word: κορώνη
  choice: कौआ
  rationale: इस शब्द का सामान्य और विशिष्ट अर्थ ‘कौआ’ है; इसे केवल ‘पक्षी’ कहना मूल बिंब को अनावश्यक रूप से सामान्य बना देता।
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: आकाश और पृथ्वी के बीच
  rationale: स्थान-संबंधी यूनानी वाक्यांश का स्वाभाविक हिन्दी रूप, जो मूल बिंब को बनाए रखता है।
- source_word: ἐμπέσῃ ... πῦρ
  choice: आग आ पड़े
  rationale: क्रिया आग के अचानक भीतर या ऊपर आ पड़ने का भाव देती है। ‘आग आ पड़े’ हिन्दी में स्वाभाविक है और केवल ‘आग लग जाए’ की अपेक्षा आकस्मिक आक्रमण का भाव अधिक सुरक्षित रखता है।
- source_word: οἰκίαν θεῶν
  choice: देवताओं के घर
  rationale: οἰκία का मूल अर्थ ‘घर’ है। संदर्भ में मंदिर या देवालय अभिप्रेत हो सकता है, इसलिए वह विकल्प पादटिप्पणी में दिया गया है।
- source_word: ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: लकड़ी के, या सोने से मढ़े, या चाँदी से मढ़े
  rationale: तीनों विशेषण देवताओं अर्थात मूर्तियों का वर्णन करते हैं। ‘मढ़े’ सोने या चाँदी से चारों ओर ढके होने का भाव संक्षेप और सहजता से व्यक्त करता है।
- source_word: φεύξονται καὶ διασωθήσονται
  choice: भाग जाएँगे और बच निकलेंगे
  rationale: 'दोनों क्रियाओं को अलग रखा गया है: पहले भागना, फिर विनाश से बच निकलना। ‘बचाए जाएँगे’ संभावित धार्मिक अर्थ जोड़ सकता था, जबकि यहाँ भौतिक बचाव संदर्भानुकूल है।'
- source_word: δοκοὶ μέσοι
  choice: बीच के शहतीर
  rationale: δοκοί भवन के बड़े सहायक काष्ठ या beams हैं और μέσοι उनके भीतर अथवा बीच में होने को बताता है। ‘बीच के शहतीर’ वास्तु-बिंब को स्पष्ट रखता है।
- source_word: κατακαυθήσονται
  choice: जलकर भस्म हो जाएँगे
  rationale: संयुक्त क्रिया पूरी तरह जल जाने का तीव्र भाव रखती है; ‘जलकर भस्म’ हिन्दी में उस पूर्ण विनाश को व्यक्त करता है।
theological_decisions:
- issue: आरंभ की अपूर्ण या संक्षिप्त कौए वाली उपमा
  choice: 'उपमा को न्यूनतम व्याकरणिक सहजता के साथ मुख्य पाठ में बनाए रखा गया: ‘जैसे ... वैसे ही’।'
  alternative: उपमा का आशय मुख्य पाठ में विस्तार से बताना, अथवा कठिन होने के कारण उसे छोड़ देना।
  rationale: यूनानी पाठ का वाक्य-विन्यास अचानक है और उपमा की सटीक बात स्पष्ट नहीं करता। अनुवाद उसे मिटाता या किसी एक व्याख्या में बाँधता नहीं; संभावित आशय पादटिप्पणी में सीमित रूप से बताया गया है।
- issue: οἰκίαν θεῶν का अर्थ
  choice: मुख्य पाठ में ‘देवताओं के घर’।
  alternative: ‘देवताओं के मंदिर’ या ‘देवालय’।
  rationale: ‘घर’ मूल शब्द के अधिक निकट है, जबकि संदर्भगत ‘मंदिर’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पुरोहितों का ‘बच निकलना’ और मूर्तियों का नष्ट होना
  choice: मानवीय पुरोहितों के भागकर बचने और निष्क्रिय देव-मूर्तियों के जलने का विरोध स्पष्ट रखा गया है।
  alternative: ‘बचाए जाएँगे’ कहना, जिससे किसी अलौकिक उद्धार का संकेत समझा जा सकता है।
  rationale: संदर्भ मूर्तियों की असहायता पर व्यंग्य करता है; यूनानी की दोनों क्रियाओं को रखते हुए ऐसा धार्मिक निष्कर्ष नहीं जोड़ा गया जो पाठ में स्पष्ट नहीं है।
