  text: और स्त्रियाँ अपने चारों ओर डोरियाँ लपेटे हुए[a] सड़कों पर बैठती हैं और चोकर जलाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने चारों ओर रस्सियाँ डाले हुए।” यूनानी पाठ बताता है कि स्त्रियों ने अपने चारों ओर डोरियाँ या रस्सियाँ रखी थीं, पर यहाँ उनका प्रतीकात्मक अर्थ नहीं समझाता।
    reason: lexical_alternative
  - marker: b
    text: अर्थात चोकर जलाकर धूप-जैसा धुआँ करना। यहाँ यूनानी में सामान्यतः ‘धूप’ के लिए प्रयुक्त संज्ञा नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: περιθέμεναι
  choice: अपने चारों ओर … लपेटे हुए
  rationale: यह आत्मवाचक कृदन्त किसी वस्तु को अपने चारों ओर रखने या लपेटने का भाव देता है। यह अनुवाद क्रिया को स्पष्ट रखता है, पर उसके अनकहे धार्मिक अर्थ का अनुमान नहीं लगाता।
- source_word: σχοινία
  choice: डोरियाँ
  rationale: शब्द का अर्थ डोरी या रस्सी हो सकता है। यहाँ ‘डोरियाँ’ आकार या प्रयोजन को अनावश्यक रूप से बढ़ा-चढ़ाकर बताए बिना बहुवचन और बँधने वाली वस्तु का भाव व्यक्त करता है।
- source_word: ἐν ταῖς ὁδοῖς
  choice: सड़कों पर
  rationale: इस सार्वजनिक या नगरीय प्रसंग में यह आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: ἐγκάθηνται
  choice: बैठती हैं
  rationale: यूनानी क्रिया बैठने या बैठे रहने का वर्णन करती है; सरल वर्तमानकाल वर्णन की प्रवाहशीलता बनाए रखता है।
- source_word: θυμιῶσα
  choice: जलाकर धुआँ करती हैं
  rationale: θυμιάω धुआँ करने या धूप-सदृश भेंट जलाने का संकेत दे सकता है। केवल ‘जलाती हैं’ की अपेक्षा यह धुएँ के भाव को रखता है, पर सामान्य धूप का पदार्थ मान नहीं लेता। यूनानी में कृदन्त एकवचन है, यद्यपि मुख्य कर्ता ‘स्त्रियाँ’ बहुवचन है; हिन्दी में अर्थानुसार बहुवचन रखा गया है।
- source_word: τὰ πίτυρα
  choice: चोकर
  rationale: πίτυρα का सामान्य अर्थ अनाज का चोकर है। ‘भूसी’ कहने से अलग कृषि-उपोत्पाद का अर्थ आ सकता है।
theological_decisions:
- issue: स्त्रियों की क्रिया और डोरियों का धार्मिक अर्थ
  choice: 'दृश्य क्रियाओं का सीधा वर्णन: स्त्रियाँ डोरियाँ लपेटे बैठी हैं और चोकर से धुआँ करती हैं।'
  alternative: डोरियों को किसी विशिष्ट प्रजनन, वेश्यावृत्ति या उपासना-विधि का चिह्न मानना।
  rationale: यूनानी पाठ क्रियाओं और वस्तुओं का उल्लेख करता है, पर उनके प्रतीकात्मक अर्थ की व्याख्या नहीं करता। इसलिए अनुवाद किसी विशिष्ट सांप्रदायिक या ऐतिहासिक निष्कर्ष को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘चोकर’ शाब्दिक कृषि-संबंधी अर्थ को सुरक्षित रखता है, और ‘धुआँ करती हैं’ θυμιάω के धूप-सदृश कार्य को बिना अतिरिक्त धार्मिक व्याख्या के व्यक्त करता है।
