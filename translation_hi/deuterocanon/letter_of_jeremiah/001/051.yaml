  text: To whom[a], then, is it known that they are not gods?
translation:
  language: hi
  text: तो फिर किसे[a] यह ज्ञात है कि वे देवता नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज ढंग से: “तो फिर कौन जानता है कि वे देवता नहीं हैं?”'
    reason: यूनानी में शाब्दिक रचना “किसे … ज्ञात है” है; टिप्पणी आधुनिक हिन्दी की अधिक मुहावरेदार वैकल्पिक अभिव्यक्ति देती है।
lexical_decisions:
- source_word: Τίνι
  choice: किसे
  rationale: प्रश्नवाचक सर्वनाम के सम्प्रदान कारक को सीधे रूप में रखता है और यूनानी की निर्वैयक्तिक रचना ‘किसे ज्ञात है’ को सुरक्षित रखता है।
- source_word: οὖν
  choice: तो फिर
  rationale: पिछले कथन से निष्कर्ष अथवा आगे बढ़ने का संबंध स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अत्यधिक कठोर तार्किक अर्थ जोड़े।
- source_word: γνωστὸν ἐστὶν
  choice: यह ज्ञात है
  rationale: यूनानी निर्वैयक्तिक अभिव्यक्ति का निकट और गरिमापूर्ण हिन्दी रूप है। ‘यह’ अगले ‘कि’ उपवाक्य की ओर संकेत करता है।
- source_word: ὅτι
  choice: कि
  rationale: जिस बात का ज्ञान है, उसे बताने वाला आश्रित उपवाक्य आरम्भ करता है।
- source_word: οὐκ εἰσὶν
  choice: वे … नहीं हैं
  rationale: नकारात्मक संयोजक क्रिया का सीधा अनुवाद है; इससे यह अतिरिक्त दावा नहीं जोड़ा जाता कि उनका किसी भी अर्थ में अस्तित्व नहीं है।
- source_word: θεοί
  choice: देवता
  rationale: बहुवचन θεοί का सामान्य और प्रसंगानुकूल हिन्दी रूप है; मूर्तियों के देवत्व का निषेध स्पष्ट रहता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी कथन का स्वरूप
  choice: वे देवता नहीं हैं
  alternative: वे कोई देवता नहीं हैं
  rationale: चुना हुआ रूप यूनानी οὐκ εἰσὶν θεοί की सरल संरचना और उसके धर्मवैचारिक तनाव को बनाए रखता है। विकल्प हिन्दी में अधिक जोरदार है और मूल से अतिरिक्त बल जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-समीप शैली। मुख्य पाठ में यूनानी निर्वैयक्तिक वाक्य-विन्यास सुरक्षित है, जबकि पादटिप्पणी सहज हिन्दी विकल्प देती है।
