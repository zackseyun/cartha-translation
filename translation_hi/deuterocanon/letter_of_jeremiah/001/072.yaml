  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/072.yaml
  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: hi
  text: इसलिए मूर्तियाँ न रखने वाला धर्मी मनुष्य बेहतर है, क्योंकि वह अपमान से दूर रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपमान’ का अनुवाद ‘निंदा’ या ‘लज्जा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  choice: उत्तम है
  rationale: यह तुलनात्मक मूल्यांकन व्यक्त करता है। हिन्दी में ‘उत्तम है’ इस निष्कर्ष को स्वाभाविक और गरिमापूर्ण ढंग से प्रस्तुत करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पहले दिए गए तर्क से निकले निष्कर्ष को स्पष्ट रूप से चिह्नित करता है।
- source_word: ἄνθρωπος δίκαιος
  choice: वह धर्मी मनुष्य
  rationale: यूनानी में एकवचन पुल्लिंग पदबंध है। ‘धर्मी मनुष्य’ स्रोत की व्याकरणिक अभिव्यक्ति और उसके प्रतिनिधिक सामान्य अर्थ—दोनों को बनाए रखता है।
- source_word: οὐκ ἔχων εἴδωλα
  choice: जिसके पास कोई मूर्ति नहीं है
  rationale: कृदन्त पदबंध मनुष्य का वर्णन करता है। यह हिन्दी में स्वाभाविक रूप से मूर्तियों के न होने या उन्हें न रखने का भाव व्यक्त करता है।
- source_word: ἔσται
  choice: रहेगा
  rationale: भविष्यकाल को आधुनिक हिन्दी में सहज ढंग से व्यक्त करता है; ‘दूर’ के साथ ‘रहेगा’ स्वाभाविक है।
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: निंदा से दूर
  rationale: ὀνειδισμός में निंदा, अपमान और लज्जा का अर्थक्षेत्र है। ‘निंदा’ नैतिक और सार्वजनिक तिरस्कार के भाव को बिना अत्यधिक विशिष्ट किए व्यक्त करती है।
theological_decisions:
- issue: ἄνθρωπος का पुल्लिंग एकवचन और प्रतिनिधिक अर्थ
  choice: धर्मी मनुष्य
  alternative: धर्मी व्यक्ति
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग एकवचन को रखा गया है, जबकि इसे केवल पुरुषों तक सीमित करने वाला कोई अतिरिक्त दावा नहीं जोड़ा गया।
- issue: मूर्तिरहित धर्मी मनुष्य की तुलनात्मक श्रेष्ठता
  choice: उत्तम है
  alternative: अधिक अच्छा है
  rationale: κρείσσον का तुलनात्मक आशय सुरक्षित रखा गया है। तुलना का दूसरा पक्ष प्रसंग से समझा जाता है; पाठ में उसे जोड़कर अस्पष्टता को कृत्रिम रूप से समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और निष्कर्षात्मक है। स्रोत के प्रतिनिधिक पुल्लिंग को ‘धर्मी मनुष्य’ से रखा गया है। पदक्रम को स्वाभाविक हिन्दी के अनुसार ढाला गया है, पर तुलनात्मक कथन और भविष्यकाल सुरक्षित हैं।
