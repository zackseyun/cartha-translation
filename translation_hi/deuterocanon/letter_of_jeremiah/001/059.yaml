  choice: सूर्य, चन्द्रमा और तारों को भेजा हुआ और आज्ञाकारी बताया गया है, पर उन्हें भेजने या आदेश देने वाले का नाम पाठ में नहीं जोड़ा गया।
  alternative: इसे केवल प्रकृति की नियमित क्रिया के रूप में अनौपचारिक ढंग से व्यक्त करना।
  rationale: ἀποστελλόμενα और εὐήκοά साथ मिलकर किसी व्यवस्था या आदेश के प्रति प्रत्युत्तर का संकेत देते हैं। अनुवाद इस धार्मिक संकेत को बनाए रखता है, पर ‘परमेश्वर’ जोड़कर निहित कर्ता को स्पष्ट नहीं करता।
