  text: And in their houses the priests sit in state[a], having their tunics torn, and their heads and beards shaved, with their heads uncovered,
translation:
  language: hi
  text: और उनके घरों में याजक आसनों पर बैठते हैं[a]। उनके कुर्ते फटे हुए हैं, उनके सिर और दाढ़ियाँ मुंडे हुए हैं, और उनके सिर खुले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “औपचारिक आसनों पर बैठते हैं”; यूनानी क्रिया किसी आसन, विशेषकर समारोहिक या रथ के आसन, पर बैठने का भाव दे सकती है। घरों के भीतर यहाँ रथ पर बैठने का शाब्दिक अर्थ कम संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διφρεύουσιν
  choice: आसनों पर बैठते हैं
  rationale: क्रिया का संबंध आसन, विशेषकर औपचारिक या रथ के आसन, से है। घरों के भीतर के इस संदर्भ में ‘आसनों पर बैठते हैं’ स्वाभाविक है और ‘रथों पर सवारी करते हैं’ जैसी संदर्भ-विरुद्ध अति-शाब्दिकता से बचता है; संभावित औपचारिक भाव पादटिप्पणी में रखा गया है।
- source_word: χιτῶνας
  choice: अंगरखे
  rationale: χιτών शरीर पर पहने जाने वाले मूल वस्त्र को दर्शाता है। ‘अंगरखे’ विशिष्टता बनाए रखता है और व्यापक ‘वस्त्रों’ या बाहरी औपचारिक ‘चोगों’ का अर्थ नहीं जोड़ता।
- source_word: διερρωγότας
  choice: फटे हुए
  rationale: पूर्ण कृदंत वस्त्रों की फटी हुई अवस्था बताता है। आधुनिक हिन्दी में ‘फटे हुए’ स्पष्ट और स्वाभाविक है।
- source_word: ἐξυρημένους
  choice: मुंडी हुई
  rationale: यह सिर और दाढ़ी के बाल उस्तरे से हटाए जाने को बताता है। हिन्दी में सिर और दाढ़ी दोनों के साथ ‘मुंडी हुई’ संक्षिप्त और सहज है।
- source_word: ἀκάλυπτοί
  choice: खुले
  rationale: शब्द का सीधा अर्थ ढका न होना है। ‘सिर खुले होते हैं’ अनावृत सिर का स्वाभाविक हिन्दी वर्णन है।
- source_word: οἴκοις
  choice: घरों
  rationale: यूनानी पाठ सीधे ‘घरों’ कहता है। ‘मंदिरों’ या ‘देवालयों’ द्वारा संदर्भ की व्याख्या को मूल पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: मूर्तिपूजक याजकों की पंथ-संबंधी मुद्रा और बाहरी दशा
  choice: दृश्य बातों—बैठना, फटे अंगरखे, मुंडे सिर और दाढ़ियाँ, तथा खुले सिर—का वर्णन बिना किसी अनुष्ठानिक व्याख्या के किया गया है।
  alternative: इन्हें स्पष्ट रूप से शोक-विधियाँ कहना, या बैठने को सिंहासनारूढ़ अथवा उन्मादी अनुष्ठानिक मुद्रा बताना।
  rationale: यूनानी पद इन प्रथाओं का कारण या धार्मिक अर्थ स्पष्ट नहीं करता। इसलिए अनुवाद उनके संभावित शोक अथवा अनुष्ठानिक अर्थ को निर्णायक रूप से नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वर्णनात्मक रखी गई है। ‘याजक’ पंथ-संबंधी भूमिका को व्यक्त करता है; ‘अंगरखे’ मूल वस्त्र की विशिष्टता बनाए रखता है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि विवरणों का क्रम मूल के अनुसार रखा गया है।
