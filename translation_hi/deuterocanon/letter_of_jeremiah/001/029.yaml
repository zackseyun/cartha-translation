  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/029.yaml
  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: hi
  text: आखिर वे देवता कैसे कहलाए जा सकते हैं?[a] क्योंकि स्त्रियाँ चाँदी, सोने और लकड़ी के देवताओं के सामने भेंटें रखती हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “वे कहाँ से देवता कहलाए जा सकते हैं?”'
    reason: Πόθεν का शाब्दिक स्थानवाचक अर्थ सुरक्षित रखने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: यूनानी में “भेंटें” शब्द स्पष्ट रूप से नहीं है; क्रिया का अर्थ “सामने रखना” या “प्रस्तुत करना” भी हो सकता है।
    reason: क्रिया की शब्दार्थगत व्यापकता और संदर्भ से पूरी की गई कर्म-वस्तु स्पष्ट करना।
lexical_decisions:
- source_word: Πόθεν
  choice: कैसे
  rationale: यहाँ प्रश्न किसी स्थान के विषय में नहीं, बल्कि उन्हें देवता कहे जाने के आधार और संभावना पर व्यंग्यात्मक संदेह व्यक्त करता है। इसलिए शाब्दिक ‘कहाँ से’ की अपेक्षा ‘कैसे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κληθείησαν
  choice: कहलाए जा सकते हैं
  rationale: कर्मवाच्य संभावनार्थक रूप को हिन्दी में ‘कहलाए जा सकते हैं’ स्पष्ट रूप से व्यक्त करता है और प्रश्न की असंभवता-सूचक ध्वनि बनाए रखता है।
- source_word: θεοί
  choice: देवता
  rationale: यूनानी पाठ इन्हें व्यंग्यात्मक ढंग से ‘देवता’ कहता है; ‘मूर्तियाँ’ करने पर मूल तर्क और विडंबना कुछ हद तक खो जाती।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शब्द पहले अलंकारिक प्रश्न का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका कारणात्मक संबंध सीधे व्यक्त करता है।
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: मूल पाठ में स्त्रियों का स्पष्ट उल्लेख है, जिसे लिंग-विशिष्ट रूप में सुरक्षित रखा गया है।
- source_word: παρατιθέασιν
  choice: सामने भेंटें रखती हैं
  rationale: क्रिया का मूल भाव किसी के सामने कुछ रखने या प्रस्तुत करने का है। उपासना-संदर्भ में निहित वस्तु को ‘भेंटें’ कहने से क्रिया समझ में आती है, जबकि ‘सामने रखती हैं’ मूल स्थानिक भाव बनाए रखता है।
- source_word: θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: चाँदी, सोने और लकड़ी के देवताओं के सामने
  rationale: तीनों पदार्थ-सूचक विशेषण सुरक्षित रखे गए हैं और ‘देवताओं’ को ‘मूर्तियों’ से नहीं बदला गया, ताकि मूल की विडंबना बनी रहे।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी संदर्भ में θεοί का अनुवाद ‘देवता’ या ‘मूर्तियाँ’ करना
  choice: देवता
  alternative: मूर्तियाँ
  rationale: मूल पाठ जानबूझकर ‘देवता’ शब्द का प्रयोग करके उनके देवत्व पर प्रश्न उठाता है। ‘देवता’ रखने से यही विवादात्मक तनाव और विडंबना सुरक्षित रहती है।
- issue: παρατιθέασιν में निहित उपासना-संबंधी वस्तु को कितना स्पष्ट करना
  choice: भेंटें रखती हैं
  alternative: रखती हैं / प्रस्तुत करती हैं
  rationale: यूनानी क्रिया में रखी जाने वाली वस्तु व्यक्त नहीं है, पर संदर्भ में वह उपासना की भेंट है। ‘भेंटें’ पाठक को क्रिया समझने में सहायता देता है; पादटिप्पणी बताती है कि यह संदर्भगत पूर्ति है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आखिर’ अलंकारिक प्रश्न की तीव्रता व्यक्त करता है। ‘देवता’ की पुनरावृत्ति मूल पाठ की व्यंग्यात्मक और धर्मवैचारिक संरचना को सुरक्षित रखती है।
