  rationale: मूर्तियों की निर्जीवता की तुलना मृतकों से सीधे और गरिमापूर्ण ढंग से बनी रहती है।
theological_decisions:
- issue: मूर्तियों के लिए वचन और सर्वनाम
  choice: शर्तवाचक वाक्यों में प्रतिनिधि एकवचन ‘कोई/वह/उसे’, और अंतिम सामूहिक कथन में बहुवचन ‘उनके’
  alternative: पूरे पद में बहुवचन अथवा पूरे पद में एकवचन
  rationale: यूनानी पाठ में रूपों का असहज परिवर्तन है। यह चयन किसी सिद्धान्तगत अर्थ को जोड़े बिना एक मूर्ति को प्रतिनिधि उदाहरण और अंत में सभी मूर्तियों को सामूहिक वर्ग के रूप में प्रस्तुत करता है।
- issue: οὐ μή की प्रबल नकारात्मकता
  choice: ‘कदापि ... नहीं’
  alternative: साधारण ‘नहीं’ या ‘निश्चय ही नहीं’
  rationale: प्रबल यूनानी निषेध को दबाए बिना आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भूमि’, ‘कदापि’ और ‘भेंटें’ औपचारिकता देते हैं, पर वाक्य-विन्यास वर्तमान हिन्दी का है।
