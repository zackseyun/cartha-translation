  rationale: κλιθῇ के झुकने के भौतिक चित्र और οὐ μή की प्रबल नकारात्मकता को ‘कदापि’ से व्यक्त किया गया है।
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: उनके सामने भेंटें रखी जाती हैं
  rationale: δῶρα सामान्यतः उपहार या भेंट हो सकता है; मूर्तिपूजा के अनुष्ठानिक संदर्भ में ‘भेंटें’ स्वाभाविक है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὥσπερ νεκροῖς
