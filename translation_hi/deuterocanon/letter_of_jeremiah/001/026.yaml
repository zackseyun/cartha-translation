  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: hi
  text: इसी कारण[a], यदि उनमें से कोई भूमि पर गिर पड़े, तो वह अपने-आप उठ नहीं सकता; और यदि कोई उसे सीधा खड़ा कर दे, तो वह अपने-आप हिल नहीं सकता; और यदि वह एक ओर झुक जाए, तो उसे कदापि सीधा नहीं किया जा सकता। बल्कि उनके सामने भेंटें[b] ऐसे रखी जाती हैं, जैसे मृतकों के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “ऐसा न हो कि वह भूमि पर गिर पड़े और अपने ही द्वारा उठे”; आशय यह है कि यदि कोई मूर्ति गिर जाए, तो वह अपने-आप उठ नहीं सकती।'
    reason: lexical_alternative
  - marker: b
    text: “भेंटें” का अनुवाद “उपहार” भी हो सकता है; यहाँ मूर्तिपूजा के अनुष्ठान का संदर्भ है।
    reason: lexical_alternative
