  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: hi
  text: वे राष्ट्रों के बीच आकाश[a] में कोई चिन्ह निश्चय ही नहीं दिखाएँगे; न वे सूर्य के समान चमकेंगे और न चन्द्रमा के समान प्रकाश देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग में।” यूनानी शब्द οὐρανός का अर्थ ‘आकाश’ या ‘स्वर्ग’ हो सकता है; यहाँ प्रसंग आकाशीय घटनाओं का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖά
  choice: चिन्ह
  rationale: यह व्यापक और स्वाभाविक शब्द है, जो आकाशीय संकेत या अद्भुत लक्षण का अर्थ दे सकता है, पर उसे अनिवार्य रूप से अशुभ शकुन नहीं बनाता।
- source_word: ἐν ἔθνεσιν
  choice: राष्ट्रों के बीच
  rationale: ἔθνη का बहुवचन यहाँ विभिन्न राष्ट्रों या जनसमुदायों की ओर संकेत करता है। यह अनुवाद बाद के किसी विशेष धार्मिक अर्थ को आरोपित नहीं करता।
- source_word: ἐν οὐρανῷ
  choice: आकाश में
  rationale: सूर्य और चन्द्रमा के संदर्भ में ‘आकाश’ आधुनिक हिन्दी में सबसे स्वाभाविक है; ‘स्वर्ग’ की वास्तविक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: οὐ μὴ δείξωσιν
  choice: निश्चय ही नहीं दिखाएँगे
  rationale: οὐ μή के साथ विधिलिंग अत्यन्त प्रबल निषेध व्यक्त करता है। ‘निश्चय ही नहीं’ उस बल को स्पष्ट आधुनिक हिन्दी में बनाए रखता है।
- source_word: λάμψουσιν
  choice: चमकेंगे
  rationale: सूर्य से की गई तुलना में यह λάμπω का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: φωτιοῦσιν
  choice: प्रकाश देंगे
  rationale: यह पिछले ‘चमकेंगे’ से क्रियात्मक भेद बनाए रखते हुए प्रकाश प्रदान करने का अर्थ व्यक्त करता है।
- source_word: σελήνη
  choice: चन्द्रमा
  rationale: आकाशीय पिंड के लिए मानक, गरिमापूर्ण और सर्वबोध्य हिन्दी शब्द।
theological_decisions:
- issue: बहुवचन क्रियाओं का निहित कर्ता
  choice: पूर्ववर्ती प्रसंग से केवल ‘वे’ रखा गया है।
  alternative: पद में ही ‘मूर्तियाँ’ या ‘झूठे देवता’ स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ में कर्ता इस पद में दोहराया नहीं गया, बल्कि प्रसंग से ग्रहण किया जाता है। ‘वे’ न्यूनतम पूर्ति है और मूर्तियों के विरुद्ध चल रहे कथन को बनाए रखते हुए मूल पाठ से अधिक नहीं कहती।
- issue: οὐρανός का अर्थ
  choice: मुख्य पाठ में ‘आकाश’।
  alternative: ‘स्वर्ग’।
  rationale: सूर्य और चन्द्रमा जैसे दृश्य आकाशीय पिंडों का निकट संदर्भ ‘आकाश’ का समर्थन करता है, फिर भी यूनानी शब्द की ‘स्वर्ग’ वाली सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रबल निषेध को ‘निश्चय ही नहीं’ से व्यक्त किया गया है। समानांतर वाक्य-विन्यास सूर्य और चन्द्रमा की दोनों तुलनाओं को स्पष्ट रखता है।
