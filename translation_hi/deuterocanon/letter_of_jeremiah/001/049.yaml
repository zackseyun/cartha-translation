base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: hi
  text: तो फिर कोई यह कैसे न समझे कि वे देवता नहीं हैं,[a] क्योंकि वे न तो युद्ध से अपने आपको बचाते हैं, न विपत्तियों से?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तो फिर यह कैसे सम्भव नहीं कि समझ लिया जाए कि वे देवता नहीं हैं...?” यूनानी में आलंकारिक नकार इस बात पर बल देता है कि निष्कर्ष बिल्कुल स्पष्ट है।'
    reason: lexical_alternative
  - marker: b
    text: “विपत्तियों” के लिए यूनानी शब्द κακῶν है, जिसका यहाँ अर्थ हानिकारक घटनाएँ या आपदाएँ है; अन्य सम्भव अनुवाद हैं “बुराइयाँ” या “संकट”।
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: तो फिर कोई यह कैसे
  rationale: यह पद पिछले तर्क से निकला जोरदार निष्कर्ष एक आलंकारिक प्रश्न के रूप में प्रस्तुत करता है; ‘तो फिर’ οὖν का अनुमानसूचक बल स्वाभाविक हिन्दी में रखता है।
- source_word: οὐκ ἔστιν αἰσθέσθαι
  choice: न समझे
  rationale: αἰσθέσθαι का अर्थ ‘जान लेना, पहचानना, अनुभव से समझना’ है। आलंकारिक नकार को ‘कैसे न समझे’ के रूप में रखना निष्कर्ष की स्पष्टता और यूनानी वाक्य की नकारात्मक बनावट दोनों को व्यक्त करता है।
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: कि वे देवता नहीं हैं
  rationale: यह मूर्तियों के विषय में मूल पाठ के सीधे निषेध को बनाए रखता है; ‘मूर्तियाँ’ कहकर θεοί को व्याख्यात्मक रूप से बदलता नहीं।
- source_word: οἳ
  choice: क्योंकि वे
  rationale: सम्बन्धवाचक सर्वनाम यहाँ उस निष्कर्ष का आधार बताने वाला उपवाक्य आरम्भ करता है; हिन्दी में ‘क्योंकि वे’ इसका कारणसूचक सम्बन्ध स्पष्ट और स्वाभाविक बनाता है।
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: वे न तो ... अपने आपको बचाते हैं
  rationale: सामान्य वर्तमानकाल और आत्मवाचक ἑαυτούς दोनों सुरक्षित हैं; कथित देवताओं की अपने ही बचाव में असमर्थता का व्यंग्य भी बना रहता है।
- source_word: ἐκ πολέμου
  choice: युद्ध से
  rationale: πόλεμος का सीधा और व्यापक अर्थ ‘युद्ध’ है।
- source_word: οὔτε ἐκ κακῶν
  choice: न विपत्तियों से
  rationale: सन्दर्भ में κακά नैतिक बुराइयों के बजाय हानि पहुँचाने वाली घटनाओं, संकटों या आपदाओं को सूचित करता है; ‘विपत्तियाँ’ इस ठोस अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में θεοί का अभिप्राय
  choice: ‘देवता’ रखते हुए पाठ का कथन ‘वे देवता नहीं हैं’ अनूदित किया गया।
  alternative: ‘दैवी प्राणी’ या सीधे ‘मूर्तियाँ’ कहना।
  rationale: यूनानी पाठ स्वयं उनके देवता होने का निषेध करता है। ‘देवता’ मूल शब्द का रूप और कथन का धर्मवैचारिक तनाव बनाए रखता है, जबकि प्रसंग उनके झूठे होने को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल स्तर रखा गया है। आलंकारिक प्रश्न, कारणसूचक सम्बन्ध और कथित देवताओं की असहायता का व्यंग्य सुरक्षित हैं; अनावश्यक सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
