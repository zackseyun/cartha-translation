translation:
  language: hi
  text: ऐसे ही हैं उनके देवता[a], जो घरों में स्थापित किए गए हैं। उनकी आँखें भीतर आने वालों के पैरों से आई धूल से भरी हैं।
  philosophy: optimal-equivalence
