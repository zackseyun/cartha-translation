    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: ऐसे ही हैं
  rationale: यह संक्षिप्त कथन यूनानी वाक्य के सारात्मक और व्यंग्यपूर्ण बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ θεοὶ αὐτῶν
  choice: उनके देवता
  rationale: यूनानी पाठ स्पष्ट रूप से ‘उनके देवता’ कहता है; इसी पद को रखने से मूर्तियों के लिए लेखक का विवादात्मक संबोधन सुरक्षित रहता है।
- source_word: καθιδρυμένων αὐτῶν ἐν τοῖς οἴκοις
  choice: जिन्हें घरों में स्थापित किया गया है
  rationale: निष्क्रिय कृदन्त मूर्तियों को स्थान पर रखे या स्थापित किए जाने का भाव देता है। ‘घरों’ मूल οἴκοις को रखता है और अनावश्यक रूप से ‘मन्दिरों’ नहीं बनाता।
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: उनकी आँखें
  rationale: शरीर-अंग का शाब्दिक चित्र निर्जीव देव-प्रतिमाओं पर किए गए व्यंग्य के लिए आवश्यक है।
- source_word: πλήρεις εἰσὶν κονιορτοῦ
  choice: धूल से भरी रहती हैं
  rationale: यह धूल जमा रहने की सामान्य और सतत अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: भीतर आनेवालों के पैरों से उठी
  rationale: ἀπό स्रोत बताता है। ‘उठी’ हिन्दी में स्पष्ट करता है कि धूल प्रवेश करनेवालों के पैरों से आती है, बिना कथन का आशय बदले।
theological_decisions:
- issue: ‘उनके देवता’ का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में ‘उनके देवता’ रखा गया है।
  alternative: उनकी मूर्तियाँ
  rationale: सन्दर्भ में निर्जीव प्रतिमाओं का उपहास है, फिर भी यूनानी θεοί अर्थात ‘देवता’ कहता है। इसे बनाए रखना मूल का विवादात्मक तनाव सुरक्षित रखता है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘स्थापित’ मूर्तियों को स्थान देने का भाव व्यक्त करता है, जबकि ‘भीतर आनेवाले’ प्रवेश करनेवालों के सामान्य, बार-बार होनेवाले कार्य को स्पष्ट करता है।
