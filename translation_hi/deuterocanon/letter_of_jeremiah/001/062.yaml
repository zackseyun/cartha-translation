base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/062.yaml
  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: hi
  text: और ऊपर से भेजी गई आग, पहाड़ों और वनों को भस्म करने के लिए, वही करती है जो उसके लिए नियत किया गया है[a]; पर ये न तो रूप में और न सामर्थ्य में उसके तुल्य हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी उसे आज्ञा दी गई है” अथवा “जो उसके लिए नियत किया गया है।” यूनानी पद का अर्थ व्यवस्थित, नियत या आदेशित किया गया कार्य हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “न तो रूप में और न सामर्थ्य में उसके समान बनाए गए हैं” अथवा “उसके समान ठहराए गए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: आग
  rationale: यह इसका सीधा और स्वाभाविक अर्थ है; प्रसंग में प्राकृतिक आग की विनाशकारी शक्ति की तुलना शक्तिहीन मूर्तियों से की गई है।
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: ऊपर से भेजी गई
  rationale: यह यूनानी पदबंध के स्थानिक अर्थ को बनाए रखता है और स्रोत को ‘स्वर्ग’ या ‘परमेश्वर’ कहकर आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: ἐξαναλῶσαι
  choice: भस्म करने के लिए
  rationale: आग के संदर्भ में यह पूर्णतः नष्ट कर देने का भाव स्वाभाविक ढंग से व्यक्त करता है और क्रिया के उद्देश्य को बनाए रखता है।
- source_word: ὄρη καὶ δρυμούς
  choice: पहाड़ों और वनों
  rationale: ὄρη का सामान्य अर्थ ‘पहाड़’ और δρυμοί का अर्थ वृक्षों से भरे भूभाग या ‘वन’ है।
- source_word: ποιεῖ τὸ συνταχθέν
  choice: जो काम उसे सौंपा गया है, उसे करती है
  rationale: τὸ συνταχθέν में ठहराए, नियत किए या आदेश दिए गए कार्य का भाव हो सकता है। ‘सौंपा गया’ उद्देश्यपूर्ण व्यवस्था को सहज हिन्दी में व्यक्त करता है और अर्थ को केवल ‘आज्ञा’ तक सीमित नहीं करता।
- source_word: ταῦτα
  choice: ये
  rationale: सर्वनाम पूर्व प्रसंग की मूर्तियों की ओर संकेत करता है। यूनानी की संक्षिप्तता बनाए रखने के लिए मुख्य पाठ में ‘मूर्तियाँ’ नहीं जोड़ा गया।
- source_word: οὔτε ταῖς ἰδέαις
  choice: न तो रूप में
  rationale: ἰδέα यहाँ दृश्य रूप या आकार को सूचित करता है; ‘रूप’ संक्षिप्त, dignified और स्वाभाविक हिन्दी है।
- source_word: οὔτε ταῖς δυνάμεσιν
  choice: न सामर्थ्य में
  rationale: δύναμις यहाँ प्रभावकारी शक्ति या सामर्थ्य को व्यक्त करता है।
- source_word: ἀφωμοιωμένα
  choice: उसके तुल्य हैं
  rationale: संदर्भ में इसका आशय यह है कि मूर्तियाँ उस आग के समान या उसके बराबर नहीं ठहरतीं। ‘तुल्य’ तुलना का भाव स्पष्ट और संक्षिप्त रखता है; कर्मवाच्य की शाब्दिक छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘ऊपर से’ आई आग का निहित स्रोत
  choice: ‘ऊपर से’ को बनाए रखा गया है; ‘स्वर्ग से’ या ‘परमेश्वर की ओर से’ नहीं जोड़ा गया।
  alternative: ‘स्वर्ग से’ अथवा ‘परमेश्वर की ओर से’
  rationale: ἄνωθεν ऊपर से आने का अर्थ देता है और प्रसंग में दैवी या स्वर्गीय स्रोत का संकेत हो सकता है, पर इस उपवाक्य में स्वर्ग या परमेश्वर का स्पष्ट उल्लेख नहीं है।
- issue: आग को दिए गए कार्य की प्रकृति
  choice: ‘सौंपा गया’
  alternative: ‘जिसकी आज्ञा दी गई’ अथवा ‘जो नियत किया गया’
  rationale: συντάσσω से बना पद व्यवस्था, नियुक्ति या आज्ञा—इनमें से किसी का भाव दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है, जबकि पादटिप्पणी वास्तविक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप रखा गया है। ‘भस्म करना’, ‘वन’, ‘सामर्थ्य’ और ‘तुल्य’ सामान्य धार्मिक-साहित्यिक हिन्दी में समझने योग्य हैं। यूनानी के संक्षिप्त ‘ये’ को बनाए रखा गया है और निहित संज्ञा ‘मूर्तियाँ’ मुख्य पाठ में नहीं जोड़ी गई।
