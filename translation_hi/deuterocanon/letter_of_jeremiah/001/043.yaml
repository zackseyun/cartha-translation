base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/043.yaml
  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: hi
  text: पर जब उनमें से कोई एक राह चलते किसी व्यक्ति द्वारा खींचकर ले जाई जाती है[a] और उसके साथ सोती है[b], तो वह अपने पास वाली को उलाहना देती है कि उसे उसकी तरह इस योग्य नहीं समझा गया, और न उसकी डोरी टूटी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘खींचकर ले जाई जाती है’, ‘खींच ली जाती है’ या संभवतः ‘फुसलाकर ले जाई जाती है’ हो सकता है; प्रसंग में भौतिक रूप से खींचे जाने का भाव अधिक प्रबल है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके साथ सोती है’ यहाँ यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: cultural_note
  - marker: c
    text: ‘डोरी’ संभवतः मूर्ति-आकृति से जुड़े किसी बंधन या लगाव की ओर संकेत करती है। यह व्यंग्य मूर्तियों को यौन ध्यान के लिए आपस में होड़ करती स्त्रियों के रूप में चित्रित करता है, हालांकि इस विवरण का ठीक आशय निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: खींचकर ले जाई जाती है
  rationale: यह निष्क्रिय कृदंत किसी दूसरे के द्वारा खींचे या साथ ले जाए जाने का भाव देता है। यह चयन मूल के भौतिक और संभवतः बलपूर्ण संकेत को बनाए रखता है, जबकि पादटिप्पणी अपेक्षाकृत कोमल अर्थ की संभावना बताती है।
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: राह चलते किसी व्यक्ति द्वारा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में अनिश्चित व्यक्ति और उसके वहाँ से गुजरने—दोनों भावों को व्यक्त करता है।
- source_word: κοιμηθῇ
  choice: उसके साथ सोती है
  rationale: मूल क्रिया का सामान्य अर्थ ‘सोना’ है, पर यहाँ यह यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है। हिन्दी में भी यही शिष्टोक्ति अर्थगत तनाव को बनाए रखती है।
- source_word: τὴν πλησίον
  choice: अपने पास वाली को
  rationale: स्त्रीलिंग रूप निकट स्थित दूसरी आकृति की ओर संकेत करता है। ‘पास वाली’ स्थानिक निकटता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ὀνειδίζει
  choice: ताना देती है
  rationale: क्रिया में धिक्कारने, अपमानित करने या उलाहना देने का भाव है। व्यंग्यात्मक प्रतिस्पर्धा के इस प्रसंग में ‘ताना देती है’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἠξίωται
  choice: इस योग्य नहीं समझा गया
  rationale: पूर्ण निष्क्रिय रूप किसी को उस व्यवहार के योग्य न ठहराए जाने का भाव देता है। ‘इस’ प्रसंग से निहित व्यवहार की ओर संकेत करता है, बिना उसे पाठ में अतिरिक्त रूप से परिभाषित किए।
- source_word: ὥσπερ καὶ αὐτή
  choice: उसकी तरह
  rationale: संक्षिप्त तुलना पहली आकृति और पास वाली आकृति के बीच है। हिन्दी रूप तुलना को बनाए रखता है, यद्यपि यूनानी सर्वनाम का संदर्भ कुछ हद तक प्रसंगाधीन है।
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: न उसकी डोरी तोड़ी गई
  rationale: σχοινίον छोटी रस्सी या डोरी है और διεράγη फटने, टूटने या तोड़े जाने का भाव देता है। सीधा अनुवाद विचित्र व्यंग्यात्मक चित्र को समझाकर समाप्त नहीं करता।
theological_decisions:
- issue: स्त्रीलिंग आकृतियों का संदर्भ
  choice: पद को स्त्रीरूप में व्यक्त मूर्ति-आकृतियों का मानवीकरण मानकर अनुवादित किया गया है।
  alternative: इसे मूर्ति-पूजा के स्थान से जुड़ी वास्तविक स्त्रियों के बारे में भी समझा जा सकता है।
  rationale: आसपास का प्रसंग मूर्तियों का उपहास करता है, और स्त्रीलिंग रूपों के साथ डोरी का उल्लेख मूर्ति-आकृतियों के मानवीकरण से अच्छी तरह मेल खाता है; फिर भी पादटिप्पणी इस चित्र की अनिश्चितता स्वीकार करती है।
- issue: ὥσπερ καὶ αὐτή में तुलना का सर्वनाम-संदर्भ
  choice: पास वाली को पहली आकृति की तरह योग्य न समझे जाने की शिकायत के रूप में प्रस्तुत किया गया है।
  alternative: सर्वनामों को उलट संदर्भ के साथ पढ़ने का प्रयास किया जा सकता है, जिससे वाक्य की तुलना कम स्पष्ट हो जाती है।
  rationale: वाक्य का व्यंग्यात्मक तर्क यह है कि जिस आकृति को ध्यान मिला, वह पास वाली को इसलिए ताना देती है कि उसे वैसा ध्यान नहीं मिला। हिन्दी में ‘उसे उसकी तरह’ इस तुलना को रखता है, बिना अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ताना देती है’ व्यंग्यात्मक स्वर को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसके साथ सोती है’ मूल की शिष्टोक्ति को बनाए रखता है। सर्वनामों और डोरी के विचित्र चित्र को अत्यधिक स्पष्ट करके मूल की वास्तविक अस्पष्टता समाप्त नहीं की गई।
