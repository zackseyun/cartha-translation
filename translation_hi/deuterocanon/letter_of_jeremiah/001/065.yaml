  text: For they can neither curse kings nor bless them[a].
translation:
  language: hi
  text: क्योंकि वे राजाओं को न तो शाप दे सकते हैं, न उन्हें आशीष दे सकते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का अधिक शाब्दिक अर्थ है: “वे निश्चय ही राजाओं को शाप नहीं देंगे, न आशीष देंगे”; यहाँ निषेध पर विशेष बल है। प्रसंग में आशय यह है कि वे इनमें से कुछ भी करने में समर्थ नहीं हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: क्योंकि ... न तो
  rationale: γάρ पिछले कथन का कारण बताता है, इसलिए ‘क्योंकि’ स्वाभाविक है; οὔτε ... οὔτε की समानांतर रचना को ‘न तो ... न’ से व्यक्त किया गया है।
- source_word: βασιλεῦσιν
  choice: राजाओं को
  rationale: यह βασιλεύς का दत्तिव बहुवचन है। हिन्दी में ‘शाप देना’ और ‘आशीष देना’ के लक्ष्य को ‘को’ के साथ व्यक्त करना स्वाभाविक है।
- source_word: οὐ μὴ καταράσωνται
  choice: शाप दे सकते हैं
  rationale: οὐ μή के साथ एओरिस्ट सब्जंक्टिव प्रबल निषेध व्यक्त करता है। मूर्तियों की सामर्थ्यहीनता के प्रसंग में ‘न ... दे सकते हैं’ इस आशय को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: न उन्हें आशीष दे सकते हैं
  rationale: यह पहले खंड के समानांतर है। यूनानी में दूसरे खंड का कर्म व्यक्त नहीं है; हिन्दी में स्पष्टता के लिए पहले खंड के ‘राजाओं’ को ‘उन्हें’ के रूप में ग्रहण किया गया है।
theological_decisions:
- issue: मूर्तियों के विरुद्ध विवाद में प्रबल निषेध का बल
  choice: 'इसे असमर्थता के रूप में व्यक्त किया गया है: ‘न तो ... दे सकते हैं, न ... दे सकते हैं।’'
  alternative: 'भविष्य के प्रबल निषेध के रूप में: ‘वे निश्चय ही राजाओं को शाप नहीं देंगे, न आशीष देंगे।’'
  rationale: οὐ μή का अधिक शाब्दिक रूप प्रबल भावी निषेध हो सकता है, पर प्रसंग मूर्तियों की शक्तिहीनता पर बल देता है। ‘दे सकते हैं’ उसी आशय को बिना अतिरिक्त धार्मिक व्याख्या जोड़े स्वाभाविक हिन्दी में सामने लाता है; पादटिप्पणी मूल रचना की वास्तविक भाषिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘आशीष देना’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-विन्यास आधुनिक रखा गया है।
