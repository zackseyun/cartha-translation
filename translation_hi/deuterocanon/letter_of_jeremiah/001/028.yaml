  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/028.yaml
  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: hi
  text: अलग बैठी स्त्रियाँ[a] और प्रसूताएँ उनकी बलियों को छूती हैं। इसलिए इन बातों से जान लो कि वे देवता नहीं हैं; उनसे मत डरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः मासिक धर्म या किसी अन्य धार्मिक अशुद्धता के कारण अलग बैठी स्त्रियाँ। यूनानी अभिव्यक्ति संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: अलग बैठी स्त्रियाँ
  rationale: शब्द का मूल चित्र अलग बैठने का है और प्रसंग में संभवतः धार्मिक अशुद्धता के कारण एकांत में बैठी स्त्री की ओर संकेत करता है। मुख्य पाठ इस संकेत को बनाए रखता है, पर मासिक धर्म को निश्चित अर्थ मानकर नहीं जोड़ता।
- source_word: λεχὼς
  choice: प्रसूताएँ
  rationale: λεχώ सामान्यतः प्रसव के समय या प्रसव के बाद शय्या पर रहने वाली स्त्री को दर्शाता है। इसलिए 'प्रसूता' यहाँ 'बिस्तर पर पड़ी स्त्री' या 'किसी स्त्री के साथ सोना' से अधिक स्रोत-संगत है।
- source_word: ἅπτονται
  choice: छूती हैं
  rationale: क्रिया का सीधा अर्थ 'छूना' या 'हाथ लगाना' है। 'छूती हैं' मूर्तियों की कथित पवित्रता के विरुद्ध दिए गए तर्क को स्पष्ट रखता है।
- source_word: γνόντες
  choice: जान लो
  rationale: कृदंत यहाँ पिछले प्रमाणों से निकाले जाने वाले निष्कर्ष को प्रस्तुत करता है। हिन्दी में आज्ञार्थक मुख्य वाक्य के साथ 'जान लो' स्वाभाविक और प्रभावी है।
- source_word: θεοί
  choice: देवता
  rationale: बहुवचन θεοί का सामान्य अर्थ देवता है और मूर्तिपूजा-विरोधी तर्क में यही स्वाभाविक हिन्दी शब्द है।
- source_word: μὴ φοβηθῆτε αὐτούς
  choice: उनसे मत डरो
  rationale: निषेधात्मक आज्ञा का सीधा अर्थ भय न करने का आदेश है। यह अनावश्यक रूप से 'पूजा मत करो' या 'श्रद्धा मत रखो' जैसा अर्थ नहीं जोड़ता।
theological_decisions:
- issue: स्त्रियों की धार्मिक अशुद्धता और बलियों के अपवित्र होने का संकेत
  choice: मुख्य पाठ में अलग बैठी स्त्रियों और प्रसूताओं का उल्लेख रखा गया है; पहली अवस्था की संभावित धार्मिक-अशुद्धता को पादटिप्पणी में समझाया गया है।
  alternative: दोनों पदों को सामान्यतः बैठी हुई और लेटी हुई स्त्रियों के रूप में लेना, या पहले पद को स्पष्ट रूप से मासिक धर्म वाली स्त्रियाँ कहना।
  rationale: यूनानी पदावली धार्मिक पृथक्करण और प्रसवोत्तर अवस्था का संकेत देती है, पर पहला पद अपने आप मासिक धर्म को निर्विवाद रूप से व्यक्त नहीं करता। इस रूप में प्राचीन अशुद्धता-संबंधी संकेत दिखाई देता है और स्रोत की अस्पष्टता भी बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'प्रसूता' सामान्य हिन्दी में समझ आने वाला संक्षिप्त शब्द है। वाक्य की तर्क-श्रृंखला—इन अवस्थाओं की स्त्रियों द्वारा बलियों को छूना, फिर उनसे देवता न होने का निष्कर्ष—स्पष्ट रखी गई है।
