    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: यह जानकर
  rationale: γινώσκω का एओरिस्ट कृदंत यहाँ परिस्थितिजन्य, और संभवतः कारणसूचक, अर्थ देता है। ‘यह जानकर’ आज की स्वाभाविक हिन्दी में मुख्य आज्ञा का आधार स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को सूचित करता है; ‘इसलिए’ उसके तार्किक बल को स्पष्ट रूप से बनाए रखता है।
- source_word: οὐκ εἰσὶν θεοί
  choice: वे देवता नहीं हैं
  rationale: यह निषेधात्मक विधेय का सीधा अनुवाद है। ‘देवता’ θεοί के बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और मूर्तियों के ईश्वरत्व के खंडन को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: μὴ φοβῆσθε
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा को संक्षिप्त, सीधी और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτούς
  choice: उनसे
  rationale: सर्वनाम का संकेत पहले वर्णित मूर्तियों की ओर है। हिन्दी में डरने के भाव के साथ ‘से’ स्वाभाविक है और मूल के सर्वनाम को व्याख्यात्मक संज्ञा से नहीं बदलता।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी संदर्भ में θεοί का अनुवाद
  choice: देवता
  alternative: ईश्वरीय प्राणी; कोई देवता नहीं
  rationale: पाठ इन मूर्तियों के वास्तविक ईश्वरत्व का निषेध करता है। ‘देवता’ मूल यूनानी के सीधे अर्थ और वादात्मक बल को बनाए रखता है, पर यह स्वयं से कोई अतिरिक्त तात्त्विक श्रेणी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मत डरो’ सामान्य पाठक के लिए सहज है, जबकि ‘वे देवता नहीं हैं’ मूल की सीधी धार्मिक घोषणा को सुरक्षित रखता है।
