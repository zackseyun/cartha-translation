  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: hi
  text: इसी प्रकार, वे न धन दे सकते हैं, न काँसा[a]; यदि कोई उनसे मन्नत माने और उसे पूरा न करे, तो वे उसका बिल्कुल तकाज़ा नहीं करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ताँबा’; प्रसंग में इसका संकेत धातु के धन या मूल्यवान वस्तुओं की ओर भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसे खोजेंगे नहीं’; प्रसंग में अर्थ है कि वे अधूरी मन्नत की माँग नहीं करेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले तर्क के समानांतर मूर्तियों की असमर्थता का एक और उदाहरण जोड़ता है; आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: πλοῦτον
  choice: धन
  rationale: यह व्यापक अर्थ में संपत्ति या वैभव को सूचित करता है; हिन्दी में ‘धन’ इस अमूर्त अर्थ को सहजता से व्यक्त करता है।
- source_word: χαλκὸν
  choice: काँसा
  rationale: यूनानी शब्द ताँबे अथवा काँसे को सूचित कर सकता है। यहाँ धातु का स्पष्ट उल्लेख बनाए रखते हुए ‘काँसा’ चुना गया है।
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: वे न तो … दे सकते हैं, न …
  rationale: οὐ μή का प्रबल निषेध हिन्दी की ‘न तो…न’ संरचना और असमर्थता के स्पष्ट कथन से स्वाभाविक ढंग से व्यक्त होता है; अतिरिक्त क्रियाविशेषण वाक्य को बोझिल बनाता।
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος
  choice: यदि कोई उनके लिए मन्नत माने
  rationale: सजातीय यूनानी प्रयोग का मुहावरेदार अर्थ मन्नत मानना है। αὐτοῖς के दत्तिव संबंध को हिन्दी में ‘उनके लिए’ व्यक्त किया गया है।
- source_word: μὴ ἀποδῷ
  choice: उसे पूरा न करे
  rationale: मन्नत के संदर्भ में ἀποδίδωμι का अर्थ उसे चुकाना या पूरा करना है। हिन्दी में ‘मन्नत पूरी करना’ सर्वाधिक स्वाभाविक और अर्थ-सटीक प्रयोग है।
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: वे निश्चय ही उसका तकाज़ा नहीं करेंगे
  rationale: ἐπιζητέω का मूल भाव खोजने का है, पर इस प्रसंग में अधूरी मन्नत की माँग या जवाबदेही चाहना अभिप्रेत है। ‘तकाज़ा करना’ इस संदर्भगत अर्थ को स्पष्ट करता है, जबकि ‘निश्चय ही’ οὐ μή के प्रबल निषेध को दर्शाता है।
theological_decisions:
- issue: मूर्तियों की असमर्थता और अधूरी मन्नत
  choice: पद कहता है कि मूर्तियाँ न भौतिक लाभ दे सकती हैं और न अधूरी मन्नत का तकाज़ा कर सकती हैं।
  alternative: अंतिम क्रिया को अधिक शाब्दिक रूप में ‘वे उसे ढूँढ़ेंगे नहीं’ या सामान्य रूप में ‘वे उसकी माँग नहीं करेंगे’ कहा जा सकता है।
  rationale: व्यापक प्रसंग मूर्तियों को शक्तिहीन वस्तुओं के रूप में दिखाता है। अनुवाद इसी बात को रखता है, पर यूनानी से आगे कोई अतिरिक्त धार्मिक दावा नहीं जोड़ता।
- issue: χαλκός का आशय
  choice: मुख्य पाठ में धातु के रूप में ‘काँसा’ रखा गया है।
  alternative: इसे ‘ताँबा’ या प्रसंगानुसार धातु का धन भी समझा जा सकता है।
  rationale: मूल में धातु का नाम है; उसे सीधे बनाए रखना संभव आर्थिक संकेत को सिद्ध अर्थ बनाकर प्रस्तुत करने से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्नत मानना/पूरी करना’ स्वाभाविक हिन्दी धार्मिक मुहावरा है। ‘तकाज़ा’ जवाबदेही की माँग का अर्थ देता है और मूर्तियों की निष्क्रियता स्पष्ट करता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि वैकल्पिक अर्थ निर्णय-सूचियों में सुरक्षित हैं और मुख्य पाठ बिना अस्पष्टता के स्रोत का आशय संप्रेषित करता है।
