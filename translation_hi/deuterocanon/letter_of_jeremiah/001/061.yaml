  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/061.yaml
  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: hi
  text: पर जब परमेश्वर बादलों को सारे बसे हुए संसार के ऊपर से गुजरने की आज्ञा देता है, तब वे वह पूरा करते हैं जो ठहराया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उस बात को पूरा करते हैं जिसका आदेश दिया गया है।” यूनानी पदबंध τὸ ταχθέν का अर्थ ‘जो ठहराया या नियुक्त किया गया है’ अथवा ‘जिसका आदेश दिया गया है’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  choice: बादलों को
  rationale: यूनानी में यह बहुवचन दत्तिव है और आज्ञा पाने वाले तत्व को सूचित करता है। हिन्दी की स्वाभाविक कर्मवाच्य रचना में ‘बादलों को ... आज्ञा मिलती है’ स्पष्ट और सहज है।
- source_word: ἐπιταγῇ ὑπὸ τοῦ θεοῦ
  choice: परमेश्वर की ओर से यह आज्ञा मिलती है
  rationale: ἐπιταγῇ कर्मवाच्य आज्ञा दिए जाने को और ὑπὸ τοῦ θεοῦ कर्ता के रूप में परमेश्वर को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए दैवी कर्तृत्व सुरक्षित रखता है।
- source_word: ἐπιπορεύεσθαι
  choice: ऊपर से जाएँ
  rationale: क्रिया बादलों के आगे बढ़ने या गुजरने को दर्शाती है; अगले पदबंध में ἐπί के साथ ‘ऊपर से जाएँ’ मौसम-संबंधी गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: सारे बसे हुए संसार के ऊपर से
  rationale: οἰκουμένη का मूल भाव आबाद या बसा हुआ संसार है। यह अनुवाद उसके दायरे को केवल ‘धरती’ कहकर समतल नहीं करता।
- source_word: συντελοῦσι
  choice: पूरा करते हैं
  rationale: यहाँ क्रिया सौंपे या निर्धारित कार्य को संपन्न करने का अर्थ देती है। ‘पूरा करते हैं’ साधारण आधुनिक हिन्दी में परिणामकारी पालन को व्यक्त करता है।
- source_word: τὸ ταχθέν
  choice: जो उनके लिए ठहराया गया है
  rationale: तटस्थ कर्मवाच्य कृदंत किसी निर्धारित, नियुक्त या आदेशित बात को बताता है। ‘ठहराया गया’ दैवी व्यवस्था का भाव रखता है, पर अनावश्यक रूप से नियतिवादी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: τὸ ταχθέν में दैवी व्यवस्था और आज्ञा का संबंध
  choice: जो उनके लिए ठहराया गया है
  alternative: जिसकी उन्हें आज्ञा दी गई है / जो उनके लिए नियुक्त किया गया है
  rationale: यूनानी पदबंध निर्धारित या आदेशित कार्य—दोनों छायाएँ रख सकता है। मुख्य पाठ में ‘ठहराया गया’ इस खुलापन और दैवी व्यवस्था को सुरक्षित रखता है; पादटिप्पणी आदेश के वैकल्पिक बल को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बसा हुआ संसार’ οἰκουμένη की विशिष्टता बनाए रखता है और ‘ठहराया गया’ मूल की अर्थगत खुलावट को सुरक्षित रखता है।
