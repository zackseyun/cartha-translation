base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/048.yaml
  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: hi
  text: क्योंकि जब उन पर[a] युद्ध और विपत्तियाँ आ पड़ती हैं, तब याजक आपस में विचार करते हैं कि वे उनके साथ कहाँ छिपें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् आसपास के प्रसंग में वर्णित मूर्तियाँ या प्रतिमाएँ।
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह सामान्य रूप से घट सकने वाली भावी परिस्थिति को व्यक्त करता है; ‘जब’ स्वाभाविक हिन्दी है और प्रसंग के बार-बार घटने योग्य परिदृश्य को बनाए रखता है।
- source_word: ἐπέλθῃ
  choice: आ पड़ती हैं
  rationale: ἐπί-संयुक्त क्रिया संकट के उन पर आ पहुँचने का भाव देती है; ‘आ पड़ती हैं’ इस प्रतिकूल और दिशात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: πόλεμος
  choice: युद्ध
  rationale: यह व्यापक सशस्त्र संघर्ष का मानक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: κακά
  choice: विपत्तियाँ
  rationale: यहाँ शब्द नैतिक बुराइयों के बजाय युद्ध के साथ आने वाली हानिकारक घटनाओं या संकटों को बताता है; ‘विपत्तियाँ’ गरिमापूर्ण और स्पष्ट है।
- source_word: βουλεύονται
  choice: विचार करते हैं
  rationale: मध्यवाच्य और πρὸς ἑαυτούς के साथ यह परस्पर मंत्रणा को सूचित करता है; ‘आपस में विचार करते हैं’ स्वाभाविक हिन्दी में वही अर्थ देता है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: यह निजी मनन नहीं, बल्कि याजकों के परस्पर विचार-विमर्श को व्यक्त करता है।
- source_word: ποῦ
  choice: कहाँ
  rationale: यह स्थानवाचक प्रश्नवाचक क्रियाविशेषण है और उनके विचार-विमर्श की विषयवस्तु आरम्भ करता है।
- source_word: συγκαρυβῶσι
  choice: छिपें
  rationale: दुर्लभ क्रिया छिपने या अपने को छिपाने का अर्थ देती है; σύν का सहचारी भाव आगे के ‘उनके साथ’ से स्पष्ट बना रहता है।
- source_word: μετʼ αὐτῶν
  choice: उनके साथ
  rationale: यह आसपास के प्रसंग की मूर्तियों/प्रतिमाओं की ओर संकेत करता है और उस विडंबना को बनाए रखता है कि याजक अपने पूजित देवताओं के साथ ही छिपना चाहते हैं।
theological_decisions:
- issue: αὐτά / αὐτῶν का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उन/उनके’ बनाए रखे गए हैं; पादटिप्पणी में मूर्तियों या प्रतिमाओं का संदर्भ स्पष्ट किया गया है।
  alternative: मुख्य पाठ में सीधे ‘मूर्तियों’ या ‘प्रतिमाओं’ कहना।
  rationale: यूनानी पाठ स्वयं सर्वनाम रखता है, जबकि आसपास का प्रसंग उसके संदर्भ को स्पष्ट करता है। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति और विडंबना सुरक्षित रहती है तथा पादटिप्पणी अनावश्यक व्याख्यात्मक विस्तार के बिना पाठक को संदर्भ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘याजक’ धार्मिक पद के लिए स्थापित बाइबलीय शब्द है। वाक्य में यूनानी γάρ का कारणसूचक बल ‘क्योंकि’ से और संकट के आकस्मिक आ पड़ने का भाव ‘आ पड़ती हैं’ से व्यक्त किया गया है।
