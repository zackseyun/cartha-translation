lexical_decisions:
- source_word: ὥσπερ
  choice: जैसे
  rationale: यह तुलना का बोध कराता है; हिन्दी में ‘जैसे’ स्वाभाविक रूप से उपमा को प्रस्तुत करता है।
- source_word: παρθένῳ
  choice: युवती
  rationale: यूनानी शब्द का मूल अर्थ ‘कुँवारी/युवती’ है। यहाँ तुलना में स्त्री की वैवाहिक या यौन स्थिति पर बल नहीं है, इसलिए ‘युवती’ अर्थ को अनावश्यक रूप से संकीर्ण किए बिना मूल से निकट रहता है।
- source_word: φιλοκόσμῳ
  choice: सजना-सँवरना पसंद करनेवाली
  rationale: यह संयुक्त विशेषण साज-सज्जा या अलंकरण के प्रति लगाव बताता है; चुनी हुई अभिव्यक्ति आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: λαμβάνοντες
  choice: लेकर
  rationale: कृदन्त क्रिया को हिन्दी की स्वाभाविक पूर्वकालिक क्रिया ‘लेकर’ से व्यक्त किया गया है।
- source_word: χρυσίον
  choice: सोना
  rationale: शब्द सीधे सोने को दर्शाता है; मूल में निहित न होने के कारण किसी खास स्वर्ण-वस्तु को नहीं जोड़ा गया।
- source_word: κατασκευάζουσιν
  choice: बनाते हैं
  rationale: सन्दर्भ में मुकुट तैयार करने की क्रिया के लिए यह स्पष्ट और सहज अनुवाद है।
- source_word: στεφάνους
  choice: मुकुट
  rationale: शब्द माला अथवा मुकुट दर्शा सकता है; धातु से बनाकर सिर पर रखे जाने के सन्दर्भ में ‘मुकुट’ उपयुक्त है।
- source_word: ἐπὶ τὰς κεφαλάς
  choice: सिरों पर रखने के लिए
  rationale: ἐπί के साथ कर्मकारक यहाँ दिशा या नियत स्थान का भाव देता है; हिन्दी में यह प्रयोग मुकुट बनाए जाने के उद्देश्य और स्थान दोनों को स्पष्ट करता है।
- source_word: τῶν θεῶν αὐτῶν
  choice: अपने देवताओं के
  rationale: मूल यूनानी में ‘उनके देवताओं’ का सीधा भाव है। हिन्दी वाक्य के कर्ता के साथ सम्बन्ध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
