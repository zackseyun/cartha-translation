  choice: अपने देवताओं
  alternative: अपनी मूर्तियों
  rationale: प्रसंग मूर्तिपूजा के विरुद्ध है, फिर भी यूनानी पाठ यहाँ θεῶν, अर्थात ‘देवताओं’, कहता है। मुख्य पाठ में इसी शब्दावली को रखना व्याख्या को अनुवाद में मिलाने से बचाता है।
