base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: hi
  text: क्योंकि जैसे खीरे की बाड़ी में उसकी रखवाली करने वाला कोई नहीं होता[a], वैसे ही उनके देवता लकड़ी के और सोने-चाँदी से मढ़े हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ का यूनानी वाक्यांश पाठ और शब्दार्थ—दोनों की दृष्टि से कठिन है; आशय यह है कि खीरे की बाड़ी अरक्षित या बिना निगरानी के पड़ी है।
    reason: textual_variant
lexical_decisions:
- source_word: σικυηράτῳ
  choice: खीरे की बाड़ी
  rationale: यह संज्ञा खीरे या कद्दू-वर्ग की फसल लगाए जाने के स्थान को दर्शाती है। ‘खीरे की बाड़ी’ कृषि-संबंधी बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: προβάσκάινόν … οὐδὲν φυλάσσον
  choice: उसकी रखवाली करने वाला कोई नहीं होता
  rationale: पाठित यूनानी पद कठिन है, पर प्रसंग में बाड़ी के अरक्षित या बिना निगरानी के होने का भाव है। यह अनुवाद किसी अनिश्चित पाठ-पुनर्निर्माण को निश्चित किए बिना उस भाव को व्यक्त करता है।
- source_word: θεοὶ
  choice: देवता
  rationale: यूनानी में ‘देवता’ ही है, ‘मूर्तियाँ’ नहीं। मूल की व्यंग्यात्मक वाद-पद्धति को बनाए रखने के लिए उसी शब्द को रखा गया है।
- source_word: ξύλινοι
  choice: लकड़ी के
  rationale: यह देवताओं की सामग्री का सीधा वर्णन है और मूल के उपहासपूर्ण स्वर को बनाए रखता है।
- source_word: περίχρυσοι καὶ περιάργυροι
  choice: उन पर सोना और चाँदी मढ़ी हुई है
  rationale: दोनों विशेषण ठोस सोने-चाँदी के होने के बजाय इन धातुओं से ऊपर से ढके या मढ़े होने को बताते हैं। हिन्दी में संयुक्त वाक्यांश स्वाभाविक है और समानांतर अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: θεοὶ का अनुवाद ‘देवता’ किया जाए या प्रसंगानुसार ‘मूर्तियाँ’
  choice: देवता
  alternative: मूर्तियाँ
  rationale: मूल पाठ विरोधियों के तथाकथित ‘देवताओं’ का उल्लेख करके तुरंत उनकी लकड़ी और बाहरी मढ़ाई का वर्णन करता है। ‘देवता’ रखने से स्रोत की वाक्पटुता और धार्मिक तनाव सुरक्षित रहता है; ‘मूर्तियाँ’ अर्थ की व्याख्यात्मक पूर्व-निष्पत्ति होती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘खीरे की बाड़ी’ ग्रामीण बिंब को स्पष्ट करती है; ‘मढ़ी हुई’ सोने-चाँदी की बाहरी परत का अर्थ देती है, ठोस धातु का नहीं।
