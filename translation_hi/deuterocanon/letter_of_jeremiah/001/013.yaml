  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/013.yaml
  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: hi
  text: और उसके पास राजदण्ड है, जैसे किसी प्रदेश के किसी मनुष्य-न्यायाधीश के पास होता है; वह अपने विरुद्ध पाप करने वाले को नष्ट नहीं करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नष्ट नहीं करेगा” के स्थान पर “मार नहीं डालेगा” या “हटा नहीं देगा” भी अनुवाद हो सकता है। ग्रीक क्रिया के अर्थों में मार डालना, हटा देना, या नष्ट करना शामिल हैं; इस संदर्भ में यह मूर्ति के दण्ड देने में असमर्थ होने को रेखांकित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: राजदण्ड
  rationale: यह शासन और अधिकार के प्रतीक दण्ड को दर्शाता है; आधुनिक हिन्दी में ‘राजदण्ड’ इस राजकीय-न्यायिक बिंब को संक्षेप और गरिमा के साथ रखता है।
- source_word: κριτὴς
  choice: न्यायी
  rationale: ग्रीक शब्द न्याय करने वाले अधिकारी को दर्शाता है। ‘न्यायी’ कानूनी बिंब बनाए रखता है और ‘शासक’ की अपेक्षा मूल के अधिक निकट है।
- source_word: χώρας
  choice: किसी प्रदेश का
  rationale: χώρα देश, भूमि या प्रदेश को सूचित कर सकता है। अनिश्चित भाव को ‘किसी’ से और व्यापक भौगोलिक अर्थ को ‘प्रदेश’ से स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἀνελεῖ
  choice: नष्ट नहीं कर सकता
  rationale: ἀναιρέω का अर्थ मार डालना, हटा देना या नष्ट करना हो सकता है। प्रसंग मूर्ति की दण्ड देने की असमर्थता पर बल देता है; इसलिए हिन्दी में सामर्थ्य का नकार स्पष्ट करते हुए व्यापक अर्थ रखा गया है।
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: जो उसके विरुद्ध पाप करता है
  rationale: यह कृदन्तीय पदबंध उस व्यक्ति को दर्शाता है जो उसके विरुद्ध अपराध या पाप करता है। ‘पाप करता है’ मूल की नैतिक-धार्मिक धार बनाए रखता है।
- source_word: ὡς ἄνθρωπος κριτὴς χώρας
  choice: मानो वह किसी प्रदेश का न्यायी हो
  rationale: ग्रीक में तुलना केवल ‘मनुष्य’ से अलग करके नहीं, एक मानवीय प्रादेशिक न्यायी की मुद्रा से समझी जाती है। यह हिन्दी रूप दिखावटी अधिकार और वास्तविक असमर्थता के व्यंग्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: मूर्ति के मानवीय न्यायिक अधिकार का बिंब
  choice: मूर्ति को राजदण्ड धारण किए किसी प्रदेश के न्यायी के समान दिखाया गया है, किंतु अपराधी को दण्ड देने की उसकी असमर्थता स्पष्ट रखी गई है।
  alternative: उसे ‘प्रदेश का शासक’ कहना, या केवल यह कहना कि वह ‘मनुष्य के समान’ राजदण्ड रखता है।
  rationale: 'κριτής का न्यायिक अर्थ बनाए रखना पद के व्यंग्य को सुरक्षित रखता है: अधिकार का बाहरी चिह्न मौजूद है, पर वास्तविक दण्ड-सामर्थ्य नहीं। किसी विशिष्ट धार्मिक व्याख्या को आरोपित नहीं किया गया।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राजदण्ड’ तथा ‘न्यायी’ मूल के राजकीय-न्यायिक बिंब को बनाए रखते हैं। ‘पर’ बाहरी अधिकार और वास्तविक असमर्थता का विरोध स्वाभाविक हिन्दी में स्पष्ट करता है।
