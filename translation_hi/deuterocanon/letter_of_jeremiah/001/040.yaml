  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: hi
  text: 'इसके अलावा, स्वयं कसदी भी उनका अनादर करते हैं: जब कभी वे किसी मूक व्यक्ति को, जो बोल नहीं सकता, देखते हैं, तो बेल[a] को ले आकर उससे बोलने की माँग करते हैं[b]—मानो वह समझ सकता हो[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बेल बेबीलोन का एक दैवी नाम या उपाधि था, जिसका संबंध मरदुक से था।
    reason: cultural_note
  - marker: b
    text: यूनानी वाक्य में ‘बेल’ को ‘ले आने’ का प्रत्यक्ष कर्म बताया गया है और बोलने की माँग उसी से की जाती है। संदर्भ के आधार पर कुछ इसे मूक व्यक्ति को बोलने योग्य बनाने की प्रार्थना भी समझते हैं।
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: या, “मानो वह अनुभव कर सकता हो” अथवा “ध्यान दे सकता हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: इसके अलावा, ... भी
  rationale: यह आगे जोड़े गए तर्क और καὶ के बल, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: स्वयं कसदी
  rationale: 'αὐτῶν का गहनतासूचक बल सुरक्षित है: मूर्तियों का अनादर उन्हीं की उपासना करने वाले कसदियों द्वारा होता है।'
- source_word: ἀτιμαζόντων αὐτά
  choice: उनका अनादर करते हैं
  rationale: ἀτιμάζω के अपमान या सम्मान न देने के भाव को संक्षिप्त रूप में रखता है; सर्वनाम का पूर्ववर्ती मूर्तियों की ओर संकेत बना रहता है।
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: किसी ऐसे गूँगे व्यक्ति ... जो बोल नहीं सकता
  rationale: अर्थ को स्पष्ट रखते हुए अपमानजनक या पुरातन शब्दावली से बचता है।
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: बेल को उसके सामने लाकर
  rationale: ग्रीक में स्पष्ट कर्म Βῆλον है, इसलिए मूल स्रोत के अनुसार बेल को लाए जाने का चित्र रखा गया है; ‘उसके सामने’ प्रसंगगत दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: माँग करते हैं कि वह व्यक्ति बोल उठे
  rationale: ἐξιοῦσιν की आग्रह/माँग की शक्ति और φωνῆσαι के ‘आवाज़ निकालना, बोलना’ अर्थ को बिना अनावश्यक रूप से प्रत्यक्ष कारक क्रिया बनाने के व्यक्त करता है।
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: मानो बेल कुछ समझ सकता हो
  rationale: αἰσθάνομαι के अनुभव करने, जान लेने या समझने के व्यापक अर्थ को सहज हिन्दी में रखता है और मूर्ति की असमर्थता पर निहित व्यंग्य सुरक्षित रखता है।
theological_decisions:
- issue: कसदियों द्वारा मूर्तियों के ‘अनादर’ का आशय
  choice: उनका व्यवहार मूर्ति की असमर्थता को अनजाने में उजागर करता है, इसलिए लेखक उसे अनादर कहता है।
  alternative: इसे मूर्तियों या देवताओं के प्रति जानबूझकर किया गया तिरस्कार माना जा सकता है।
  rationale: तुरंत बाद दिया गया उदाहरण धार्मिक सहायता की अपेक्षा का है, खुले तिरस्कार का नहीं; इसलिए मुख्य पाठ लेखक के व्यंग्य को रखता है, पर कसदियों की मनोवृत्ति के बारे में अतिरिक्त दावा नहीं करता।
- issue: φωνῆσαι का कर्ता और क्रियार्थ
  choice: गूँगा व्यक्ति बोल उठे।
  alternative: बेल उस व्यक्ति को बोलने योग्य बनाए।
  rationale: ग्रीक infinitive स्वयं स्पष्ट कारक रूप नहीं है। प्रसंग में अपेक्षित परिणाम गूँगे व्यक्ति का बोलना है; हिन्दी में इसे स्पष्ट किया गया है, जबकि बेल से उस परिणाम की अपेक्षा प्रसंग से समझ में आती है।
- issue: अंतिम αὐτοῦ का संदर्भ
  choice: बेल
  alternative: निकटवर्ती गूँगा व्यक्ति
  rationale: लेखक का व्यंग्य बेल की संवेदन या समझ सकने की कथित क्षमता पर केंद्रित है; नाम दोहराने से हिन्दी में अनचाही सर्वनाम-अस्पष्टता दूर होती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गूँगा व्यक्ति’ प्रचलित अर्थ देता है, जबकि व्याख्यात्मक पुनरावृत्ति ‘जो बोल नहीं सकता’ मूल यूनानी की स्पष्टता को बनाए रखती है। वाक्य का व्यंग्य संरक्षित है, पर कसदियों की मंशा या बेल की कथित भूमिका को संप्रदायगत ढंग से नहीं बढ़ाया गया।
