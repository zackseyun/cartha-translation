  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/071.yaml
  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
translation:
  language: hi
  text: बैंगनी वस्त्र और उन पर सड़ते संगमरमर से यह जाना जाएगा कि वे देवता नहीं हैं। अन्त में वे स्वयं खा लिए जाएँगे[a], और उस देश में निंदा का विषय बनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाद में वे स्वयं नष्ट कर दिए जाएँगे/भक्षण कर लिए जाएँगे।” यूनानी का शाब्दिक अर्थ “खा लिए जाएँगे” है; इसका संकेत जीवों द्वारा कुतरे जाने या क्षय से नष्ट होने की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύρας
  choice: बैंगनी वस्त्र
  rationale: यहाँ πορφύρα मूर्तियों पर रखी गई महँगी बैंगनी सजावट या वस्त्र को सूचित करता है। केवल रंग के बजाय ‘बैंगनी वस्त्र’ सामान्य हिन्दी में आशय स्पष्ट करता है।
- source_word: μαρμάρου
  choice: संगमरमर
  rationale: μάρμαρον का सीधा और प्रसंगानुकूल अर्थ ‘संगमरमर’ है, जो मूर्तियों की बाहरी सजावट की ओर संकेत करता है।
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: उन पर सड़ते हुए
  rationale: σηπομένης क्षय या सड़ने का सजीव चित्र देता है। हिन्दी वाक्य में इसे दोनों सजावटी पदार्थों से सम्बद्ध रखा गया है, भले ही संगमरमर के ‘सड़ने’ की छवि असामान्य हो; इस प्रकार यूनानी की तीखी व्यंग्यात्मक भाषा सुरक्षित रहती है।
- source_word: γνωσθήσεται
  choice: यह जान लिया जाएगा
  rationale: भविष्यत् कर्मवाच्य यहाँ इस बात के स्पष्ट हो जाने या पहचाने जाने को व्यक्त करता है कि मूर्तियाँ देवता नहीं हैं।
- source_word: θεοί
  choice: देवता
  rationale: θεοί का सीधा बहुवचन अर्थ ‘देवता’ है और यह मूर्तियों के ईश्वरत्व का निषेध करता है।
- source_word: ἐξ ὑστέρου
  choice: अन्त में
  rationale: यह पद बाद में अथवा अन्ततः होने वाली घटना को दर्शाता है; ‘अन्त में’ उस परिणामात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: βρωθήσονται
  choice: खा लिए जाएँगे
  rationale: क्रिया का शाब्दिक अर्थ ‘खाया जाना’ है। इसे ज्यों का त्यों रखने से यह खुला रहता है कि मूर्तियाँ जीवों द्वारा कुतरी जाएँगी या व्यापक अर्थ में क्षय होकर नष्ट होंगी।
- source_word: ὄνειδος
  choice: अपमान का कारण
  rationale: ὄνειδος निन्दा, लज्जा या अपमान का विषय दर्शाता है। ‘अपमान का कारण’ आधुनिक हिन्दी में स्वाभाविक है और सार्वजनिक तिरस्कार का भाव बनाए रखता है।
- source_word: ἐν τῇ χώρᾳ
  choice: उस देश में
  rationale: χώρα का अर्थ देश, भूमि या प्रदेश हो सकता है। ‘उस देश में’ सन्दर्भ को अनावश्यक रूप से संकीर्ण किए बिना सहज हिन्दी देता है।
theological_decisions:
- issue: सड़ती हुई सजावट और अन्तिम अपमान का अभिप्रेत विषय
  choice: सजावट का क्षय मूर्तियों के देवता न होने का प्रमाण है; अन्तिम उपवाक्यों में मूर्तियाँ स्वयं खाए जाने और अपमान का कारण बनने वाली वस्तुएँ हैं।
  alternative: अन्तिम उपवाक्यों का मुख्य विषय मूर्तियों के बजाय उनकी सजावटी सामग्रियाँ भी समझी जा सकती हैं।
  rationale: नपुंसकलिंग बहुवचन αὐτά और पत्र का व्यापक मूर्तिविरोधी प्रसंग मूर्तियों की ओर संकेत करते हैं। फिर भी अनुवाद किसी भक्षक या क्षय की ठीक प्रक्रिया को निर्दिष्ट नहीं करता, जिससे मूल की अर्थगत खुली जगह बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और व्यंग्यात्मक मूल स्वर के अनुरूप रखी गई है। ‘बैंगनी वस्त्र’ सजावटी सामग्री को स्पष्ट करता है, जबकि ‘खा लिए जाएँगे’ मूल यूनानी की ठोस और कुछ हद तक अस्पष्ट छवि को सुरक्षित रखता है।
