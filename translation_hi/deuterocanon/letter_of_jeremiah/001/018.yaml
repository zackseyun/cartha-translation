translation:
  language: hi
  text: लोग उनके लिए अपने लिए जितने दीपक जलाते हैं, उनसे अधिक दीपक जलाते हैं; फिर भी मूर्तियाँ उनमें से एक को भी नहीं देख सकतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνους
  choice: दीपक
  rationale: यह यूनानी शब्द किसी ठोस दीपक, विशेषकर तेल के दीपक, को दर्शाता है; ‘दीपक’ पूजा के लिए मूर्तियों के सामने किए गए प्रकाश-प्रबंध की ठोस छवि बनाए रखता है।
- source_word: καίουσιν
  choice: जलाते हैं
  rationale: दीपक के साथ ‘जलाते हैं’ स्वाभाविक आधुनिक हिन्दी है और क्रिया के ‘जलाना/प्रज्वलित करना’ अर्थ को ठीक व्यक्त करता है।
- source_word: πλείους ἢ ἑαυτοῖς
  choice: अपने लिए जलाए जानेवाले दीपकों से भी अधिक
  rationale: यह मूर्तियों के लिए जलाए गए दीपकों की संख्या की तुलना उपासकों द्वारा अपने लिए जलाए जानेवाले दीपकों से करता है। हिन्दी में तुलना स्पष्ट करने के लिए ‘दीपकों’ को दोहराया गया है, पर यूनानी से अधिक कोई विशिष्ट विवरण नहीं जोड़ा गया।
- source_word: ὧν οὐδένα
  choice: उनमें से एक को भी नहीं
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद दीपक हैं। यह अभिव्यक्ति इस बात पर बल देती है कि मूर्तियाँ एक भी दीपक नहीं देख सकतीं।
- source_word: δύνανται ἰδεῖν
  choice: नहीं देख सकते
  rationale: यह देखने की पूर्ण असमर्थता का सीधा, सहज और सटीक हिन्दी रूप है।
theological_decisions:
- issue: δύνανται ἰδεῖν में निहित कर्ता का संदर्भ
  choice: ‘वे’ मूर्तियों को सूचित करता है, जो अपने लिए जलाए गए दीपकों को नहीं देख सकतीं
  alternative: उपासक उनसे होने वाला कोई लाभ नहीं देख सकते
  rationale: निकटवर्ती प्रसंग निर्जीव और संवेदनाहीन मूर्तियों का उपहास करता है। इसलिए ‘वे’ का सबसे निकट और सुसंगत संदर्भ मूर्तियाँ हैं; फिर भी संज्ञा को दोहराने के बजाय सर्वनाम रखकर मूल की अभिव्यक्ति का रूप बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पहले ‘लोग’ जोड़ना हिन्दी में बहुवचन क्रिया के निहित मानवीय कर्ता को स्पष्ट करता है; ‘उनके’ और ‘वे’ प्रसंग में मूर्तियों की ओर संकेत करते हैं।
