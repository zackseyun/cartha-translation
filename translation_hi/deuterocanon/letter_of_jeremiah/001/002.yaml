base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: hi
  text: इसलिए जब तुम बाबेल में प्रवेश करोगे, तो वहाँ बहुत वर्षों तक और लंबे समय तक, सात पीढ़ियों तक[a] रहोगे; पर इसके बाद मैं तुम्हें वहाँ से शांति के साथ निकाल लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘सात पीढ़ियों के लिए।’ यूनानी में शाब्दिक रूप से ‘सात पीढ़ियों तक’ है; यह निर्वासन की अवधि को गोल संख्या या शैलीगत ढंग से व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντες οὖν
  choice: इसलिए जब तुम ... प्रवेश करोगे
  rationale: भविष्यकालीन मुख्य क्रिया के साथ आए एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है; οὖν का निष्कर्ष/क्रम-सूचक बल ‘इसलिए’ से बना रहता है।
- source_word: εἰς Βαβυλῶνα
  choice: बाबेल में
  rationale: स्थान-नाम के लिए हिन्दी बाइबलीय रूप ‘बाबेल’ लिया गया है और प्रवेश की दिशा को ‘में’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔσεσθε ἐκεῖ ἔτη πλείω καὶ χρόνον μακρόν
  choice: वहाँ बहुत वर्षों और लंबे समय तक ... रहोगे
  rationale: ἔσεσθε का अर्थ प्रसंगानुसार ‘रहोगे’ है। πλείω को अस्पष्ट तुलना थोपे बिना ‘बहुत’ और दोनों अवधिवाचक पदों को बनाए रखते हुए μακρόν को ‘लंबे समय तक’ किया गया है।
- source_word: ἕως γενεῶν ἑπτά
  choice: सात पीढ़ियों तक
  rationale: ἕως का सीमावाचक अर्थ ‘तक’ और बहुवचन γενεῶν सहित संख्या सात दोनों सुरक्षित रखे गए हैं; वाक्यांश की शैलीगत या गोल अवधि होने की सम्भावना पादटिप्पणी में बताई गई है।
- source_word: μετὰ τοῦτο δὲ
  choice: पर इसके बाद
  rationale: δὲ के हल्के विरोध/संक्रमण को ‘पर’ और कालक्रम को ‘इसके बाद’ से व्यक्त किया गया है।
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: मैं तुम्हें वहाँ से ... निकाल लाऊँगा
  rationale: ἐξάξω की बाहर ले आने की गति को व्यक्त किया गया है, पर मूल में अनुपस्थित ‘छुड़ाऊँगा’ या ‘वापस’ जैसे अधिक व्याख्यात्मक अर्थ नहीं जोड़े गए।
- source_word: μετʼ εἰρήνης
  choice: शान्ति के साथ
  rationale: यह पद स्थिति अथवा रीति दोनों का संकेत दे सकता है; ‘शान्ति के साथ’ उस व्यापकता को बनाए रखता है और केवल क्रियाविशेषणीय ‘शान्तिपूर्वक’ तक सीमित नहीं करता।
theological_decisions:
- issue: बाबेल से बाहर लाने की प्रतिज्ञा में उद्धार या वापसी का अतिरिक्त भाव जोड़ा जाए या नहीं
  choice: मैं तुम्हें वहाँ से शान्ति के साथ निकाल लाऊँगा
  alternative: मैं तुम्हें वहाँ से छुड़ाकर शान्ति से वापस ले आऊँगा
  rationale: यूनानी ἐξάξω बाहर ले आने को कहता है, पर स्पष्ट रूप से ‘छुड़ाना’ अथवा ‘वापस’ नहीं कहता। इसलिए प्रतिज्ञा को सुरक्षित रखते हुए अतिरिक्त धर्मवैचारिक अर्थ नहीं जोड़ा गया।
- issue: ἕως γενεῶν ἑπτά को निश्चित सातवीं पीढ़ी मानना या सात पीढ़ियों की अवधि
  choice: सात पीढ़ियों तक
  alternative: सातवीं पीढ़ी तक
  rationale: मूल में γενεῶν बहुवचन है और उसके साथ संख्या सात है; अनुवाद इस व्याकरणिक रूप को सुरक्षित रखता है तथा उसे एक निश्चित ‘सातवीं पीढ़ी’ में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। अवधि के दोनों यूनानी पदों को अनावश्यक रूप से एक में नहीं मिलाया गया है।
