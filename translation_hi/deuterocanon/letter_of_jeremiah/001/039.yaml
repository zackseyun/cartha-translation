  alternative: तो फिर उन्हें कैसे देवता मानना या कहना चाहिए?
  rationale: ‘माना या कहा जा सकता है’ हिन्दी में स्वाभाविक अलंकारिक प्रश्न बनाता है और देवता पद की वैधता को चुनौती देता है, पर यूनानी से आगे बढ़कर कोई अलग तत्त्वमीमांसात्मक दावा नहीं जोड़ता।
