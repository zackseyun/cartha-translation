  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: hi
  text: और उनके याजक उनकी बलियाँ वापस लेकर उनका उपयोग करते हैं; उसी प्रकार उनकी स्त्रियाँ भी बलियों में से कुछ को सुरक्षित रखती हैं[a], पर किसी गरीब या असहाय को उसमें से कुछ नहीं देतीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया खाद्य पदार्थ को परिरक्षित करने की ओर संकेत करती है, सम्भवतः नमक लगाकर।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: वापस लेकर
  rationale: मध्यवाच्य कृदन्त यहाँ बलियों को वापस लेने या फिर से अपने अधिकार में लेने का भाव दे सकता है। ‘वापस लेकर’ इस अर्थ को स्वाभाविक हिन्दी में रखता है, बिना यह निश्चित किए कि प्रक्रिया औपचारिक रूप से लौटाए जाने की थी।
- source_word: καταχρῶνται
  choice: उनका उपयोग करते हैं
  rationale: क्रिया का अर्थ उपयोग करना या पूरा उपयोग करना हो सकता है और प्रसंग में नकारात्मक संकेत है। वर्णनात्मक अनुवाद मूल की निंदा को अनावश्यक रूप से तीखा किए बिना प्रसंग से उभरने देता है।
- source_word: ταριχεύουσαι
  choice: नमक लगाकर सुरक्षित रखती हैं
  rationale: यह क्रिया खाद्य पदार्थ को, सम्भवतः नमक लगाकर, परिरक्षित करने को सूचित करती है। हिन्दी में यह अभिव्यक्ति क्रिया और उसके सम्भावित प्राचीन तरीके दोनों को स्पष्ट करती है।
- source_word: μεταδῶσιν
  choice: उसमें से कुछ नहीं देतीं
  rationale: क्रिया किसी को अपने पास की वस्तु में से हिस्सा देने का अर्थ रखती है। ‘उसमें से कुछ देना’ इस सहभागी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: πτωχῷ
  choice: किसी गरीब
  rationale: एकवचन दत्तिव यहाँ वर्ग के किसी सदस्य के प्रतिनिधि अर्थ में है; ‘किसी गरीब’ हिन्दी में संख्या और सामान्य अर्थ दोनों सुरक्षित रखता है।
- source_word: ἀδυνάτῳ
  choice: असहाय
  rationale: शब्द ऐसे व्यक्ति को दर्शाता है जिसमें सामर्थ्य या क्षमता का अभाव है। इस सामाजिक संदर्भ में ‘असहाय’ केवल शारीरिक दुर्बलता की अपेक्षा अधिक उपयुक्त और व्यापक है।
theological_decisions:
- issue: याजकों और स्त्रियों द्वारा बलियों को अपने उपयोग में लेने का नैतिक स्वर
  choice: कार्यों का वर्णन किया गया है; ‘दुरुपयोग’ जैसा स्पष्ट मूल्यांकन नहीं जोड़ा गया।
  alternative: καταχρῶνται का अनुवाद ‘दुरुपयोग करते हैं’ करना।
  rationale: मूल क्रिया में नकारात्मक छाया हो सकती है, पर उसका सामान्य अर्थ ‘उपयोग करना’ भी है। पूरे प्रसंग की मूर्तिपूजा-विरोधी आलोचना वर्णित स्वार्थी आचरण से स्वयं स्पष्ट होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। अर्धविराम से यूनानी वाक्य की दो समानांतर क्रियाओं का संबंध बनाए रखा गया है।
