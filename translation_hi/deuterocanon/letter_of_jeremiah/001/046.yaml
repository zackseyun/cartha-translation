- source_word: οἱ κατασκευάσαντες
  choice: जिन्होंने ... बनाया है
  rationale: कृदंत उन कारीगरों को सूचित करता है जिन्होंने मूर्तियाँ गढ़ीं; हिन्दी में संबंधवाचक उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: αὐτά
  choice: उन्हें
  rationale: सर्वनाम का संदर्भ प्रसंग में पहले उल्लिखित मूर्तियों से है।
- source_word: οὐ μὴ γένωνται
  choice: किसी तरह ... नहीं होंगे
  rationale: οὐ μή के प्रबल निषेध को ‘किसी तरह ... नहीं’ व्यक्त करता है, जबकि γένωνται को विधेय विशेषण के साथ हिन्दी में ‘होंगे’ कहना सहज है।
- source_word: πολυχρόνιοι
  choice: दीर्घायु
  rationale: इसका अर्थ ‘बहुत समय तक जीवित रहने वाला’ है; मनुष्य-निर्माताओं के लिए ‘दीर्घायु’ संक्षिप्त, प्रतिष्ठित और सटीक है।
