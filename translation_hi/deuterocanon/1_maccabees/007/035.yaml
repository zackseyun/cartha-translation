  rationale: तत्काल वर्तमान समय पर दिए गए बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς χεῖράς μου
  choice: मेरे हाथों में
  rationale: मूल रूपक को सुरक्षित रखता है और हिन्दी में अधिकार या वश में आने का अर्थ सहजता से देता है।
- source_word: ἐπιστρέψω ἐν εἰρήνῃ
  choice: जब मैं सकुशल लौटूँगा
  rationale: ἐν εἰρήνῃ के सुरक्षित और बिना हानि लौटने के मुहावरेदार आशय को स्वाभाविक हिन्दी में देता है। ‘जब’ यहाँ शपथ की अधूरी संरचना में प्रत्याशित वापसी को व्यक्त करता है, यद्यपि यूनानी ἐάν में शर्त का स्वर भी है।
theological_decisions:
- issue: इस पद में शपथ-वाक्य का अधूरा रहना
  choice: वाक्य को दीर्घ विराम-चिह्न के साथ अधूरा रखा गया और उसकी सूचना पादटिप्पणी में दी गई।
  alternative: अगले पद की बात यहाँ जोड़कर शपथ को पूरा कर देना।
  rationale: यूनानी पाठ इस पद के अंत में शर्त का परिणाम बताए बिना रुक जाता है और वाक्य अगले पद में जारी रहता है। मूल पाठ की संरचना और तनाव को बनाए रखने के लिए इसे इसी पद में कृत्रिम रूप से पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सहज रूप अपनाया गया है। ‘यहूदा’ और ‘छावनी’ जैसे प्रचलित रूप रखे गए हैं। अंतिम दीर्घ विराम अधूरी शपथ को स्पष्ट करता है; पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
