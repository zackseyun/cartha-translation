  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: hi
  text: और उसने अल्कीमुस को देश पर नियुक्त किया और उसकी सहायता के लिए उसके पास एक सैन्य टुकड़ी छोड़ दी। फिर बक्खीदेस राजा के पास चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: नियुक्त किया
  rationale: क्रिया यहाँ अल्कीमुस को देश पर अधिकार या प्रशासन सौंपने का भाव देती है; ‘देश पर नियुक्त किया’ इसे स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: τὴν χώραν
  choice: देश
  rationale: राजनीतिक-प्रशासनिक प्रसंग में χώρα किसी भूभाग या देश को सूचित करता है; यहाँ ‘देश’ उपयुक्त है।
- source_word: ἀφῆκεν
  choice: छोड़ दी
  rationale: प्रसंग में अर्थ है कि उसने एक सैन्य बल अल्कीमुस के पास रहने दिया; ‘छोड़ दी’ सीधा और स्वाभाविक अनुवाद है।
- source_word: δύναμιν
  choice: एक सैन्य टुकड़ी
  rationale: सैन्य आख्यान में δύναμις सशस्त्र बल को दर्शाता है। ‘सैन्य टुकड़ी’ सैन्य अर्थ स्पष्ट करती है, पर उसके आकार को ‘सेना’ कहकर बढ़ा-चढ़ाकर नहीं बताती।
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: उसकी सहायता के लिए
  rationale: सव्यय क्रियार्थक रूप उद्देश्य व्यक्त करता है—उस सैन्य टुकड़ी को अल्कीमुस की सहायता करने के लिए छोड़ा गया था।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह बक्खीदेस के वहाँ से प्रस्थान को व्यक्त करता है; ‘चला गया’ आधुनिक हिन्दी में सहज है।
- source_word: πρὸς τὸν βασιλέα
  choice: राजा के पास
  rationale: πρός यहाँ राजा की ओर जाने का भाव देता है। यूनानी पाठ में ‘वापस’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
