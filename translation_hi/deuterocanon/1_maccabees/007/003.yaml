lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: उसे मालूम हो गई
  rationale: यूनानी में क्रिया कर्मवाच्य है और दत्तिव αὐτῷ उस व्यक्ति को बताता है जिसके ज्ञान में बात आई। यह हिन्दी प्रयोग उस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ πρᾶγμα
  choice: वह बात
  rationale: πρᾶγμα यहाँ किसी घटना, मामले या परिस्थिति की ओर संकेत करता है। प्रसंग में ‘वह बात’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: Μή μοι δείξητε
  choice: मुझे ... मत दिखाना
  rationale: μή के साथ आज्ञार्थक क्रिया स्पष्ट निषेध व्यक्त करती है। ‘मत दिखाना’ δείκνυμι के मूल अर्थ और कथन की सीधी तीव्रता को बनाए रखता है।
- source_word: τὰ πρόσωπα αὐτῶν
  choice: उनके चेहरे
  rationale: यह यूनानी पद का निकट और ठोस अनुवाद है। प्रसंग में यह उन्हें उसके सामने लाए जाने से इनकार करने का मुहावरेदार ढंग है, जिसकी व्याख्या पादटिप्पणी में दी गई है।
