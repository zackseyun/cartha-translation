  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
translation:
  language: hi
  text: और वे सब लोग, जो अपने लोगों को परेशान कर रहे थे, उसके पास इकट्ठे हो गए। उन्होंने यहूदा की भूमि पर अधिकार कर लिया और इस्राएल में[a] बड़ा आघात पहुँचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के बीच।” यूनानी वाक्यांश ἐν Ἰσραήλ का अर्थ केवल भौगोलिक स्थान नहीं, बल्कि इस्राएल के लोगों के बीच घटना होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: उसके पास इकट्ठे हो गए
  rationale: πρός के साथ यह वाक्यांश किसी व्यक्ति के पास आकर उसके साथ जुड़ने का भाव देता है; यह अनुवाद औपचारिक भर्ती का अतिरिक्त अर्थ जोड़े बिना उस सामूहिक जुड़ाव को व्यक्त करता है।
- source_word: πάντες οἱ ταράσσοντες τὸν λαὸν αὐτῶν
  choice: वे सब लोग, जो अपने लोगों में अशांति फैला रहे थे
  rationale: ταράσσω का अर्थ हलचल, उपद्रव या अशांति उत्पन्न करना है। ‘अशांति फैला रहे थे’ क्रियात्मक भाव बनाए रखता है, और αὐτῶν को ‘अपने’ द्वारा स्पष्ट रूप से दर्शाता है।
- source_word: κατεκράτησαν γῆν Ἰούδα
  choice: उन्होंने यहूदा देश पर अधिकार कर लिया
  rationale: κατακρατέω यहाँ किसी भूभाग पर प्रभुत्व या नियंत्रण स्थापित करने का भाव देता है। ‘अधिकार कर लिया’ प्रभावी नियंत्रण को स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्थायी वैधानिक स्वामित्व का संकेत दिए।
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: भारी विनाश किया
  rationale: यह यूनानी मुहावरा बड़े आघात, विपत्ति या संहारकारी क्षति का संकेत दे सकता है। प्रसंग में ‘भारी विनाश किया’ स्वाभाविक है और अर्थ को केवल हत्या या महामारी तक सीमित नहीं करता।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: ἐν का सीधा अर्थ ‘में’ या ‘के बीच’ है। ‘इस्राएल में’ मूल की स्थान अथवा समुदाय-संबंधी अस्पष्टता को बनाए रखता है।
