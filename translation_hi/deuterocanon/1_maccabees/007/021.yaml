- source_word: ἠγωνίσατο
  choice: संघर्ष किया
  rationale: ἀγωνίζομαι यहाँ किसी पद को पाने के लिए सक्रिय प्रयत्न और विरोधपूर्ण होड़ को व्यक्त करता है। ‘संघर्ष किया’ इस अर्थ को रखता है, पर इसे अनिवार्य रूप से शारीरिक युद्ध नहीं बनाता।
- source_word: Ἄλκιμος
  choice: अलकिमुस
  rationale: यूनानी नाम का देवनागरी में निकट और सहज लिप्यंतरण।
- source_word: περὶ
  choice: के लिए
  rationale: संघर्षसूचक क्रिया के साथ περί उस पद को बताता है जो दाँव पर था या जिसे पाने का प्रयत्न किया गया। आधुनिक हिन्दी में ‘के लिए’ स्वाभाविक है।
- source_word: τῆς ἀρχιερωσύνης
  choice: महायाजक के पद
  rationale: ἀρχιερωσύνη व्यक्ति नहीं, महायाजक के पद या पदवी को दर्शाता है। ‘महायाजक के पद’ संस्थागत अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
