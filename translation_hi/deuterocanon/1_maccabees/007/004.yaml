lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: सेना
  rationale: सैन्य कथा के इस संदर्भ में बहुवचन संज्ञा का अर्थ अमूर्त ‘शक्तियाँ’ नहीं, बल्कि संगठित सैन्य बल है। आधुनिक हिन्दी में ‘सेना’ स्वाभाविक और संक्षिप्त सामूहिक पद है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यूनानी क्रिया सीधे हत्या किए जाने को व्यक्त करती है। ‘मार डाला’ आधुनिक हिन्दी में स्पष्ट है और औपचारिक मृत्युदंड का अनावश्यक भाव नहीं जोड़ता।
- source_word: αὐτούς
  choice: उन दोनों को
  rationale: निकटवर्ती कथा-संदर्भ में यह सर्वनाम पहले उल्लिखित दो व्यक्तियों को इंगित करता है; हिन्दी में ‘उन दोनों’ संदर्भ को सहज और स्पष्ट बनाता है।
- source_word: ἐκάθισεν
  choice: बैठ गया
  rationale: क्रिया का शाब्दिक अर्थ ‘बैठा’ है और सिंहासन के संदर्भ में राजसत्ता ग्रहण करने का भाव स्वतः प्रकट होता है; अनुवाद मूल बिंब बनाए रखता है।
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: अपने राज्य के सिंहासन पर
  rationale: यह यूनानी पदबंध की संरचना और राजकीय अर्थ दोनों को निकटता से रखता है। ‘अपने’ हिन्दी में समान कर्ता देमेत्रियुस की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
