lexical_decisions:
- source_word: συνῆψαν αἱ παρεμβολαὶ εἰς πόλεμον
  choice: दोनों सेनाएँ युद्ध में भिड़ीं
  rationale: सैन्य संदर्भ में συνάπτω εἰς πόλεμον सक्रिय युद्ध में आमने-सामने भिड़ने को व्यक्त करता है। παρεμβολαί का शाब्दिक अर्थ ‘छावनियाँ’ हो सकता है, पर यहाँ उससे दोनों पक्षों की सैन्य टुकड़ियाँ अभिप्रेत हैं; इसलिए सहज हिन्दी में ‘दोनों सेनाएँ’ चुना गया।
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: अदार महीने के तेरहवें दिन
  rationale: कालसूचक दत्तिव और महीने के संबंधकारक को आधुनिक हिन्दी के स्वाभाविक दिनांक-विन्यास में प्रस्तुत किया गया है।
- source_word: συνετρίβη
  choice: चकनाचूर हो गई
  rationale: συντρίβω साधारण पराजय से अधिक प्रबल रूप से तोड़े या कुचले जाने का भाव देता है। ‘चकनाचूर हो गई’ निष्क्रिय अर्थ और पराजय की तीव्रता बनाए रखता है।
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: निकानोर की सेना
  rationale: παρεμβολή छावनी अथवा छावनी में स्थित सैन्य बल, दोनों को सूचित कर सकता है। युद्ध के परिणाम के संदर्भ में ‘सेना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
