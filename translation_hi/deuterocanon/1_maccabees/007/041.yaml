base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: hi
  text: जब राजा की ओर से आए लोग निन्दा की बातें कर रहे थे[a], तब आपका स्वर्गदूत निकला और उसने उनके बीच एक लाख पचासी हज़ार लोगों को मार गिराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की निन्दा कर रहे थे।” यूनानी क्रिया का अर्थ बुरा-भला कहना, अपमान करना या अधार्मिक ढंग से निन्दा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह हिजकिय्याह के दिनों में अश्शूरी सेना के विनाश की ओर संकेत है; 2 राजा 19:35 और यशायाह 37:36 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: राजा की ओर से आए लोग
  rationale: παρά के साथ यह पदबंध राजा की ओर से या उसके प्रतिनिधि बनकर आए लोगों को सूचित करता है। यह अनुवाद केवल ‘राजा के लोग’ कहने की अपेक्षा सम्बन्ध को स्पष्ट करता है, पर उन्हें दूत या सैनिक कहकर आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἐδυσφήμουν
  choice: निन्दा की बातें कर रहे थे
  rationale: क्रिया का अर्थ बुरा कहना, अपमानजनक बातें करना या निन्दा करना हो सकता है। ‘निन्दा की बातें’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक आशय को सम्भव रखती है, फिर भी मुख्य पाठ में अधिक तकनीकी ‘परमेश्वर की निन्दा’ को स्पष्ट रूप से नहीं जोड़ती।
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: यूनानी अओरिस्ट की सीधी भूतकालीन अभिव्यक्ति है और प्रस्थान या आगे आने की गति को बनाए रखती है।
- source_word: ἄγγελός σου
  choice: आपका स्वर्गदूत
  rationale: ἄγγελος का सामान्य अर्थ दूत भी हो सकता है, पर हिजकिय्याह के समय हुई अलौकिक दण्ड-घटना के संकेत में स्वर्गीय अभिकर्ता अभिप्रेत है; इसलिए ‘स्वर्गदूत’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐπάταξεν
  choice: मार गिराया
  rationale: क्रिया का मूल अर्थ प्रहार करना है; यहाँ बड़ी संख्या में मृत्यु के प्रसंग में ‘मार गिराया’ उसके घातक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: यह समूह के भीतर प्रभावित लोगों को दर्शाने वाला स्वाभाविक हिन्दी रूप है।
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: एक लाख पचासी हज़ार
  rationale: यह यूनानी पाठ की 185,000 की स्पष्ट संख्या है; भारतीय हिन्दी संख्या-पद्धति में शब्दों द्वारा इसका सहज रूप दिया गया है।
theological_decisions:
- issue: क्या δυσφημέω का अनुवाद स्पष्ट धार्मिक अर्थ वाले ‘परमेश्वर की निन्दा करना’ से किया जाए
  choice: निन्दा की बातें कर रहे थे
  alternative: परमेश्वर की निन्दा कर रहे थे; अपमानजनक बातें कर रहे थे
  rationale: ऐतिहासिक संकेत में वाणी परमेश्वर के विरुद्ध है, पर यूनानी क्रिया स्वयं व्यापक रूप से बुरा कहने या निन्दा करने को व्यक्त करती है और कर्म यहाँ अव्यक्त है। मुख्य पाठ व्यापकता बनाए रखता है; पादटिप्पणी अधिक स्पष्ट धार्मिक सम्भावना बताती है।
- issue: ἄγγελός σου का अभिप्रेत अर्थ
  choice: आपका स्वर्गदूत
  alternative: आपका दूत
  rationale: यद्यपि शब्द मनुष्य-दूत के लिए भी प्रयुक्त हो सकता है, यहाँ अश्शूरी सेना के विनाश की ओर संकेत एक स्वर्गीय अभिकर्ता को अभिप्रेत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को सम्बोधित प्रार्थना होने के कारण ‘आपका’ सम्मानसूचक रूप लिया गया है। संख्या को भारतीय प्रचलन के अनुसार ‘एक लाख पचासी हज़ार’ लिखा गया है।
