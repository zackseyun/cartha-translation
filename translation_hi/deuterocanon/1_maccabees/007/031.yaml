lexical_decisions:
- source_word: ἔγνω
  choice: पता चला
  rationale: अओरिस्ट यहाँ किसी तथ्य के ज्ञात होने का बोध कराता है; ‘पता चला’ आधुनिक हिन्दी में इस परिवर्तन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπεκαλύφθη
  choice: भेद खुल गया है
  rationale: कर्मवाच्य क्रिया बताती है कि योजना अब गुप्त नहीं रही। ‘भेद खुल गया’ हिन्दी में स्वाभाविक है और धार्मिक अर्थ वाला ‘प्रकट किया गया’ आरोपित नहीं करता।
- source_word: ἡ βουλὴ αὐτοῦ
  choice: उसकी योजना
  rationale: सैन्य-राजनीतिक प्रसंग में βουλή का स्पष्ट और तटस्थ अर्थ ‘योजना’ है; ‘षड्यंत्र’ यूनानी से अधिक नकारात्मक होता।
- source_word: ἐξῆλθεν
  choice: निकल पड़ा
  rationale: मूल अर्थ ‘बाहर गया’ है; इस प्रसंग में ‘निकल पड़ा’ उद्देश्यपूर्ण प्रस्थान को सहज हिन्दी में व्यक्त करता है, बिना ‘कूच किया’ जैसी अतिरिक्त सैन्य विशिष्टता जोड़े।
- source_word: εἰς συνάντησιν
  choice: सामना करने
  rationale: वाक्यांश मिलने या मुठभेड़ के लिए जाने को दर्शाता है। संघर्ष के प्रसंग में ‘सामना करने’ विरोधी भेंट का संकेत देता है, पर स्पष्ट रूप से ‘युद्ध करने’ नहीं जोड़ता।
- source_word: τῷ Ἰούδα
  choice: यहूदा
  rationale: Ἰούδας का हिन्दी बाइबलीय नामरूप ‘यहूदा’ है; इससे व्यक्ति का नाम स्वाभाविक देवनागरी रूप में रहता है।
