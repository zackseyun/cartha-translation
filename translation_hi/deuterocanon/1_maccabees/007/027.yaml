  text: And Nikanor came to Jerusalem with a large force, and he sent to Judas and his brothers deceitfully with peaceful words, saying,
translation:
  language: hi
  text: 'तब निकानोर एक बड़ी सेना लेकर यरूशलेम आया। उसने छल से यहूदा और उसके भाइयों के पास शांति की बातें कहलवा भेजीं:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: एक बड़ी सेना लेकर
  rationale: यहाँ δύναμις सैन्य संदर्भ में सेना/सैन्य बल को दर्शाता है; स्वाभाविक हिन्दी में ‘बड़ी सेना’ स्पष्ट है।
- source_word: μετὰ δόλου
  choice: छल से
  rationale: ग्रीक पद संदेश भेजने की कपटपूर्ण रीति या मंशा बताता है; ‘छल से’ उसकी नैतिक धार को बनाए रखता है।
- source_word: λόγους εἰρηνικούς
  choice: शांति की बातें
  rationale: शाब्दिक अर्थ ‘शांतिपूर्ण बातें/वचन’ है; ‘शांति की बातें’ आधुनिक हिन्दी में सहज रहते हुए बाहरी मैत्रीपूर्ण स्वर और भीतरी छल के तनाव को सुरक्षित रखता है।
- source_word: ἀπέστειλεν πρὸς
  choice: के पास … कहलवा भेजीं
  rationale: क्रिया में किसी संदेश या दूत को भेजना निहित है; हिन्दी में ‘बातें कहलवा भेजीं’ अप्रकट संदेशवाहक और वाणी—दोनों को स्वाभाविक रूप से व्यक्त करता है।
