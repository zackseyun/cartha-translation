base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: hi
  text: इस प्रकार आज हमारे सामने इस छावनी को चकनाचूर कर दे, और शेष लोग जान लें कि उसने तेरी पवित्र वस्तुओं[a] के विरुद्ध दुष्टता से बोला है। उसकी दुष्टता के अनुसार उसका न्याय कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरे पवित्रस्थान के विरुद्ध।’ यूनानी में शाब्दिक रूप से बहुवचन ‘तेरी पवित्र वस्तुओं’ है; इसका अर्थ परमेश्वर से संबंधित पवित्र वस्तुएँ या पवित्र स्थान हो सकता है, जिसमें पवित्रस्थान भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  choice: चकनाचूर कर दे
  rationale: यह निर्णायक विनाश की आज्ञार्थक प्रार्थना है। यह पद सैन्य पराजय और दैवी न्याय—दोनों की प्रबलता स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: यहाँ शब्द का अर्थ सैनिक शिविर या पड़ाव है; ‘छावनी’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἐνώπιον ἡμῶν
  choice: हमारे सामने
  rationale: यह यूनानी के ‘हमारे सम्मुख/हमारी उपस्थिति में’ को सीधा और सहज रूप देता है।
- source_word: οἱ ἐπίλοιποι
  choice: जो बाकी हैं
  rationale: यूनानी उन शेष बचे लोगों को सूचित करता है, पर स्पष्ट रूप से ‘जीवित बचे’ नहीं कहता; इसलिए व्यापक अर्थ बनाए रखा गया है।
- source_word: κακῶς ἐλάλησεν
  choice: दुष्टता की बातें कही हैं
  rationale: यह केवल अनुचित ढंग से बोलने के बजाय नैतिक रूप से बुरी वाणी को दर्शाता है।
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: तेरी पवित्र वस्तुओं के विरुद्ध
  rationale: बहुवचन τὰ ἅγια को बनाए रखता है और अर्थ को केवल एक भवन या पवित्रस्थान तक सीमित नहीं करता।
- source_word: κρῖνον αὐτὸν
  choice: उसका न्याय कर
  rationale: κρίνω की न्यायिक मूल भावना सुरक्षित रहती है; दंडात्मक आशय अगली अभिव्यक्ति से स्पष्ट होता है।
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: उसकी दुष्टता के अनुसार
  rationale: यह यूनानी की संरचना और प्रतिफलात्मक न्याय की प्रार्थना को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: सामूहिक ‘छावनी’ के बाद एकवचन αὐτόν (‘उसका’) का संदर्भ
  choice: एकवचन ‘उसने/उसका’ बनाए रखा गया है।
  alternative: इसे शत्रु सेना का सामूहिक संदर्भ मानकर बहुवचन में अनुवाद करना।
  rationale: यूनानी पाठ सामूहिक छावनी से उस एकवचन अपराधी की ओर मुड़ता है जिसने पवित्र वस्तुओं के विरुद्ध दुष्ट वचन कहे। किसी अनुल्लिखित व्यक्ति की पहचान निर्धारित किए बिना इस व्याकरणिक और धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तेरी’ और ‘कर’ का प्रयोग बाइबलीय प्रार्थना की सीधी संबोधन-शैली के अनुरूप है।
