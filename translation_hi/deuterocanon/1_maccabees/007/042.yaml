- from: इसलिए आज हमारे सामने इस छावनी को चकनाचूर कर दे, और जो बाकी हैं वे जान लें कि उसने तेरी पवित्र वस्तुओं[a] के विरुद्ध दुष्टता की बातें कही हैं। उसकी दुष्टता के अनुसार उसका न्याय कर।
  to: इस प्रकार आज हमारे सामने इस छावनी को चकनाचूर कर दे, और शेष लोग जान लें कि उसने तेरी पवित्र वस्तुओं[a] के विरुद्ध दुष्टता से बोला है। उसकी दुष्टता के अनुसार उसका न्याय कर।
  rationale: The revision makes only small, safe adjustments for closer correspondence to the Greek and more natural modern Hindi. It retains the source's singular offender, the deliberately broad plural reference to what is holy, and the imprecatory petition for judgment, without identifying the offender or narrowing τὰ ἅγια to a sanctuary in the main text.
