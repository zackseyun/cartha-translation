  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: hi
  text: वह चला और एक बड़ी सेना के साथ यहूदा के देश में आया। उसने यहूदा और उसके भाइयों के पास दूत भेजे, जो शान्तिपूर्ण बातें तो लेकर गए, पर छल के साथ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शान्ति की बातें ... छल के साथ।” यूनानी पाठ शान्तिपूर्ण प्रतीत होने वाली बातों और छलपूर्ण उद्देश्य का विरोध दिखाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: वह वहाँ से चला और ... आया
  rationale: दोनों क्रियाओं के क्रम—पहले प्रस्थान और फिर गन्तव्य पर आने—को बनाए रखता है; ‘वहाँ से’ हिन्दी में प्रस्थान का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: एक बड़ी सेना के साथ
  rationale: इस सैन्य प्रसंग में δύναμις अमूर्त सामर्थ्य नहीं, बल्कि सशस्त्र सैन्य बल को सूचित करता है। सामान्य हिन्दी में ‘बड़ी सेना’ स्पष्ट और स्वाभाविक है।
- source_word: εἰς γῆν Ἰούδα
  choice: यहूदा प्रदेश में
  rationale: γῆ के क्षेत्रीय अर्थ को ‘प्रदेश’ से व्यक्त किया गया है और व्यक्ति यहूदा से भेद भी स्पष्ट रहता है।
- source_word: ἀπέστειλεν ἀγγέλους
  choice: दूत भेजकर
  rationale: राजनीतिक-सैन्य सन्दर्भ में ἄγγελοι मनुष्य दूत हैं; ‘दूत’ संक्षिप्त, प्रतिष्ठित और सटीक हिन्दी है।
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: यहूदा और उसके भाइयों के पास
  rationale: दोनों πρὸς पदबंधों का साझा हिन्दी सम्बन्ध ‘के पास’ से स्वाभाविक रूप में व्यक्त होता है; ἀδελφοί का स्पष्ट पुल्लिंग बहुवचन ‘भाइयों’ रखा गया है।
- source_word: λόγους εἰρηνικοὺς
  choice: शान्ति की बातें
  rationale: यह अभिव्यक्ति सन्देश के बाहरी शान्तिपूर्ण स्वर को सरल आधुनिक हिन्दी में रखती है और ‘शान्तिपूर्ण वचन’ जैसी कृत्रिमता से बचती है।
- source_word: μετὰ δόλου
  choice: पर छल से
  rationale: δόλος के छलपूर्ण आशय को सीधे व्यक्त करता है। यूनानी में स्पष्ट विरोधसूचक संयोजक नहीं है, पर शान्ति की बातों और छल के अर्थगत विरोध को हिन्दी में ‘पर’ स्वाभाविक रूप से सामने लाता है।
