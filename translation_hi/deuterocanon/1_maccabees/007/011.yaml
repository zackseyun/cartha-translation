- source_word: οὐ προσεῖχον
  choice: उन्होंने ... ध्यान नहीं दिया
  rationale: προσέχω का अर्थ यहाँ दत्तिव के साथ किसी बात पर ध्यान देना या उसे मानना है; यह रूप स्वाभाविक हिन्दी में मूल अर्थ को बनाए रखता है।
- source_word: τοῖς λόγοις αὐτῶν
  choice: उनकी बातों पर
  rationale: λόγοι यहाँ उनके कहे हुए कथनों को दर्शाता है; ‘बातों’ आधुनिक हिन्दी में ‘शब्दों’ से अधिक स्वाभाविक है।
- source_word: ἴδου γὰρ
  choice: क्योंकि देखो
  rationale: γάρ कारण बताता है और ἴδου ध्यान आकर्षित करता है; दोनों को स्पष्ट रूप से रखा गया है।
- source_word: ἦλθον
  choice: वे ... आए थे
  rationale: पूर्ववर्ती घटना का कारण बताते हुए हिन्दी में पूर्ण भूतकाल सन्दर्भ के कालक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: बड़ी सेना के साथ
  rationale: कथा के सैन्य सन्दर्भ में δύναμις सशस्त्र सैन्य दल को दर्शाता है; ‘सेना’ इस अर्थ को साधारण हिन्दी में स्पष्ट करता है।
