  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
translation:
  language: hi
  text: वह निकला और यहूदिया के सभी सीमावर्ती इलाकों और आसपास के क्षेत्रों[a] में गया। उसने उन पुरुषों और पक्ष बदलकर चले गए लोगों[b] से बदला लिया, और उन्हें उस देश[c] में जाने से रोक दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और चारों ओर के इलाकों में।” यूनानी शब्द κυκλόθεν यहूदिया के सीमावर्ती इलाकों से आगे आसपास के भूभाग को भी समेटता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दलबदल कर गए लोगों” अथवा “भगोड़ों।” यूनानी शब्द उन लोगों के लिए है जो अपना पक्ष छोड़कर दूसरे पक्ष में चले गए थे।
    reason: lexical_alternative
  - marker: c
    text: या, “उस प्रदेश” अथवा “उस भूभाग।” यूनानी χώρα का अर्थ ‘देश,’ ‘प्रदेश’ या ‘भूभाग’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: गया
  rationale: यह ἐξέρχομαι का सीधा कथात्मक प्रयोग है। हिन्दी में केवल ‘गया’ स्वाभाविक है; ‘निकलकर गया’ अनावश्यक रूप से भारी होता।
- source_word: πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: यहूदिया के सभी सीमावर्ती इलाके
  rationale: ὅρια सीमा अथवा सीमावर्ती भूभाग का बोध करा सकता है। गति-सूचक εἰς के साथ ‘सीमावर्ती इलाके’ हिन्दी में ‘सीमाओं’ की अपेक्षा अधिक स्वाभाविक और भौगोलिक अर्थ में स्पष्ट है।
- source_word: κυκλόθεν
  choice: आसपास के क्षेत्र
  rationale: यह क्रियाविशेषण चारों ओर के भूभाग तक दायरा बढ़ाता है। ‘आसपास के क्षेत्र’ आधुनिक हिन्दी में सहज रूप से उसी विस्तार को व्यक्त करता है।
- source_word: ἐποίησεν ἐκδίκησιν
  choice: से बदला लिया
  rationale: यूनानी मुहावरे का अर्थ प्रतिशोध या दंडात्मक कार्रवाई करना है। ‘बदला लिया’ उसकी प्रबल प्रतिशोधात्मक शक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν τοῖς ἀνδράσιν
  choice: उन पुरुषों से
  rationale: ἐκδίκησιν के साथ ἐν प्रतिशोध के लक्ष्य को बताता है। मूल पाठ केवल ‘पुरुषों’ कहता है, इसलिए उनकी पहचान को और विशिष्ट नहीं किया गया।
- source_word: τοῖς αὐτομολήσασιν
  choice: पक्ष बदलकर शत्रु की ओर चले गए लोग
  rationale: αὐτομολέω अपने पक्ष को छोड़कर दूसरे, प्रायः शत्रु, पक्ष में चले जाने को दर्शाता है। यह वाक्यांश साधारण पलायन की अपेक्षा दलबदल का आशय स्पष्ट करता है।
- source_word: ἐνεστάλησαν
  choice: रोक दिया गया
  rationale: निष्क्रिय बहुवचन रूप प्रभावी रोक या बाधा व्यक्त करता है। हिन्दी में संयुक्त कर्ता के लिए ‘उन्हें ... रोक दिया गया’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: उस देश में जाने से
  rationale: संबंधवाचक क्रियार्थक संज्ञा बताती है कि उन्हें किस कार्य से रोका गया। χώρα के सम्भव अर्थों में ‘देश’ यहाँ व्यापक भूभाग के लिए उपयुक्त है।
