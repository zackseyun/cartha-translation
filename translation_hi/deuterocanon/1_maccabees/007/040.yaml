translation:
  language: hi
  text: यहूदा ने तीन हज़ार पुरुषों के साथ अदासा में छावनी डाली। फिर यहूदा ने प्रार्थना की और कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν
  choice: छावनी डाली
  rationale: सैन्य प्रसंग में यह क्रिया पड़ाव डालने या शिविर स्थापित करने को दर्शाती है; ‘छावनी डाली’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐν Ἀδασὰ
  choice: अदासा में
  rationale: ἐν यहाँ छावनी के स्थान को सूचित करता है; हिन्दी में स्थान के लिए ‘में’ सहज है।
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: तीन हज़ार पुरुषों के साथ
  rationale: यह वाक्यांश यहूदा के साथ मौजूद सैन्य दल को व्यक्त करता है; ‘के साथ’ मूल आशय को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: यह προσεύχομαι का सामान्य और सीधा हिन्दी रूप है।
- source_word: εἶπεν
  choice: कहा
  rationale: यह आगे आने वाली प्रार्थना का परिचय देने वाला सामान्य कथात्मक क्रिया-रूप है।
