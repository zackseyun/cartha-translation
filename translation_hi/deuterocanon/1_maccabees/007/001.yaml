base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: hi
  text: एक सौ इक्यावनवें वर्ष में, सेल्युकस का पुत्र देमेत्रियुस रोम से निकल गया। वह थोड़े से लोगों के साथ समुद्रतटीय एक नगर[a] में चढ़कर गया और वहाँ राजा बन गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र के किनारे का नगर।” यूनानी में शाब्दिक अर्थ है, “समुद्र के पास का नगर।”
    reason: lexical_alternative
  - marker: b
    text: या, “वहाँ राज्य किया।” यूनानी क्रिया प्रसंग के अनुसार राजा बनने या राजा के रूप में राज्य करने, दोनों को व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: एक सौ इक्यावनवें वर्ष में
  rationale: यह यूनानी काल-सूचक वाक्यांश का स्वाभाविक और स्पष्ट हिन्दी रूप है तथा ऐतिहासिक वर्ष-संख्या को ज्यों का त्यों रखता है।
- source_word: ἐξῆλθεν
  choice: निकल गया
  rationale: यह रोम से बाहर जाने की गति को सीधे व्यक्त करता है और ‘भाग निकला’ जैसा ऐसा भाव नहीं जोड़ता जो यूनानी क्रिया में स्वयं स्पष्ट नहीं है।
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: सेल्युकस का पुत्र देमेत्रियुस
  rationale: यूनानी लेख और संबंधकारक से बने पितृनाम-सूचक प्रयोग को आधुनिक हिन्दी में स्पष्ट पारिवारिक संबंध के रूप में व्यक्त किया गया है।
- source_word: ἀνέβη
  choice: जा पहुँचा
  rationale: इस यात्रा-वृत्तांत में हिन्दी का स्वाभाविक गति-प्रयोग चुना गया है। शाब्दिक ‘ऊपर गया’ या ‘चढ़ गया’ यहाँ भ्रामक हो सकता है, क्योंकि गंतव्य समुद्र के किनारे का नगर है और यूनानी क्रिया कथात्मक यात्रा के लिए भी प्रयुक्त होती है।
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: कुछ पुरुषों के साथ
  rationale: यह साथ आए लोगों की छोटी संख्या को बिना अतिरिक्त व्याख्या के सरलता से व्यक्त करता है।
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: समुद्र के किनारे बसे एक नगर में
  rationale: यह παραθαλασσίαν का पारदर्शी हिन्दी रूप है और नगर की समुद्रतटीय स्थिति को स्पष्ट रखता है।
- source_word: ἐβασίλευσεν
  choice: राजा बन गया
  rationale: इस प्रसंग में यूनानी भूतकालीन क्रिया उसके राजत्व आरम्भ करने की घटना को संक्षेप में बताती प्रतीत होती है। ‘राजा बन गया’ उस आरम्भिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘राज्य किया’ भी व्याकरणतः संभव है।
theological_decisions:
- issue: ἐβασίλευσεν में राजत्व आरम्भ करने अथवा राजा के रूप में शासन करने का अर्थ
  choice: वहाँ राजा बन गया
  alternative: वहाँ राज्य किया
  rationale: यूनानी क्रिया दोनों अर्थ दे सकती है। आगमन के तुरंत बाद की कथात्मक घटना होने के कारण ‘राजा बन गया’ उपयुक्त है, पर वैकल्पिक अर्थ को टिप्पणी में सुरक्षित रखा गया है; इससे ऐतिहासिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। व्यक्तिनामों को प्रचलित हिन्दी लिप्यंतरण में दिया गया है। छोटे वाक्यों से ऐतिहासिक कथन स्पष्ट हुआ है, जबकि [b] में यूनानी राजकीय क्रिया की वास्तविक अर्थगत गुंजाइश सुरक्षित रखी गई है।
