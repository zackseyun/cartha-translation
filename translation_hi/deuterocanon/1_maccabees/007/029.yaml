translation:
  language: hi
  text: वह यहूदा के पास आया, और उन्होंने शांतिपूर्वक एक-दूसरे का अभिवादन किया[a]; पर शत्रु यहूदा को झपटकर पकड़ लेने के लिए तैयार थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति से।” यूनानी क्रिया-विशेषण भेंट के शांतिपूर्ण ढंग पर बल देता है, जो आगे बताए गए शत्रुतापूर्ण इरादे के विपरीत था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अर्थ “अचानक पकड़ लेना” या “झपटकर उठा ले जाना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: वह यहूदा के पास आया
  rationale: ἔρχομαι के साथ πρός किसी व्यक्ति की ओर आने को दर्शाता है। यह अनुवाद कथा की गति को स्वाभाविक हिन्दी में बनाए रखता है और उद्देश्य के विषय में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἠσπάσαντο ἀλλήλους
  choice: उन्होंने एक-दूसरे का अभिवादन किया
  rationale: ἀσπάζομαι सामान्यतः अभिवादन करने को व्यक्त करता है; इसमें आलिंगन शामिल हो सकता है, पर क्रिया स्वयं उसे अनिवार्य नहीं बनाती।
- source_word: εἰρηνικῶς
  choice: शांतिपूर्वक
  rationale: यह क्रिया-विशेषण भेंट और अभिवादन के शांतिपूर्ण ढंग को व्यक्त करता है तथा अगले वाक्यांश में छिपी शत्रुता के साथ विडंबनापूर्ण विरोध बनाए रखता है।
- source_word: οἱ πολέμιοι
  choice: शत्रु
  rationale: संज्ञा के रूप में πολέμιοι पहले से समझे जाने वाले विरोधी दल को दर्शाता है। ‘शत्रु’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: झपटकर पकड़ लेने के लिए तैयार थे
  rationale: ἐξαρπάζω में अचानक या बलपूर्वक झपटकर पकड़ने का भाव है। यह चयन केवल सामान्य ‘पकड़ने’ की अपेक्षा विश्वासघाती घात की तीव्रता को बेहतर बनाए रखता है।
