    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν
  choice: मारा गया
  rationale: युद्ध के प्रसंग में यूनानी क्रिया का अर्थ केवल गिरना नहीं, बल्कि मारा जाना है। आधुनिक हिन्दी में ‘मारा गया’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸς πρῶτος
  choice: वह स्वयं ... सबसे पहले
  rationale: ‘स्वयं’ αὐτός के बलाघात को और ‘सबसे पहले’ πρῶτος के क्रमसूचक अर्थ को सुरक्षित रखता है।
- source_word: ἐν τῷ πολέμῳ
  choice: युद्ध में
  rationale: यहाँ निकटवर्ती सैनिक मुठभेड़ अभिप्रेत है; ‘युद्ध में’ हिन्दी में स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: उसकी सेना
  rationale: παρεμβολή का अर्थ छावनी या छावनी में स्थित सैन्य दल हो सकता है। देखने, हथियार फेंकने और भागने वाली सामूहिक कर्ता के लिए ‘सेना’ सबसे स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: अपने हथियार फेंककर
  rationale: यह हथियार त्यागकर तुरंत भागने की क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: सैनिक पराजय के प्रसंग में यह ἔφυγον का स्पष्ट और सामान्य हिन्दी रूप है।
