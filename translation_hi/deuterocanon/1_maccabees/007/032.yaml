    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: में
  rationale: युद्ध-वृत्तांत में स्थाननाम के साथ κατά मुठभेड़ के स्थान को सूचित करता है; हिन्दी में ‘में’ स्वाभाविक स्थानवाचक रूप है।
- source_word: Χαρφαρασαραμά
  choice: कफर-सलामा
  rationale: यह कठिन और पाठगत रूप से अनिश्चित स्थाननाम है। ‘कफर-सलामा’ सम्भावित नाम-रूप को आधुनिक हिन्दी में पठनीय ढंग से लिप्यंतरित करता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: ἔπεσαν
  choice: मारे गए
  rationale: सैनिक प्रसंग में इसका अर्थ युद्ध में मारे जाना है। हिन्दी में ‘गिर पड़े’ मृत्यु को अस्पष्ट छोड़ सकता है, इसलिए ‘मारे गए’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: τῶν παρὰ Νικάνορος
  choice: निकानोर के साथियों में से
  rationale: παρά यहाँ निकानोर के साथ उपस्थित उसके पक्ष के लोगों को दर्शाता है। यह रूप उन्हें अनावश्यक रूप से औपचारिक ‘सेना’ कहे बिना यूनानी वाक्यांश के निकट रहता है।
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: लगभग पाँच हज़ार पुरुष
  rationale: संख्या से पहले ὡς अनुमान सूचित करता है; ‘लगभग’ आधुनिक हिन्दी में इसे स्पष्ट रखता है।
- source_word: ἔφυγον
  choice: वे ... भाग गए
  rationale: यूनानी पाठ केवल उनके भागने की बात कहता है और ‘बचे हुए’ नहीं जोड़ता; हिन्दी में वही संक्षिप्तता रखी गई है।
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: दाऊद के नगर में
  rationale: εἰς भीतर की ओर गति दर्शाता है, इसलिए ‘नगर में’ उपयुक्त है। πόλις Δαυείδ एक वर्णनात्मक स्थाननाम है, अतः इसका अनुवाद किया गया है।
