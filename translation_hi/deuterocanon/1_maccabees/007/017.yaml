translation:
  language: hi
  text: उन्होंने यरूशलेम के चारों ओर तेरे पवित्र जनों[a] का मांस और उनका लहू उंडेल दिया[c], और उन्हें दफ़नाने वाला कोई न था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जनों’ के स्थान पर ‘भक्त जनों’ या ‘विश्वासयोग्य जनों’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति भजन 79:2–3 (सप्तति में 78:2–3) से बहुत निकटता से मेल खाती है।
    reason: cross_reference
  - marker: c
    text: ‘उंडेल दिया’ के स्थान पर ‘बहा दिया’ भी हो सकता है; यूनानी क्रिया का शाब्दिक अर्थ ‘उंडेलना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σάρκας
  choice: मांस
  rationale: यूनानी बहुवचन का ठोस अर्थ ‘मांस’ है। यह वीभत्स शारीरिक बिंब को बनाए रखता है और उसे अधिक सामान्य ‘शवों’ में नरम नहीं करता।
- source_word: ὁσίων
  choice: पवित्र जनों
  rationale: यह शब्द पवित्र, भक्त अथवा परमेश्वर के प्रति निष्ठावान लोगों को सूचित करता है। ‘पवित्र जन’ धार्मिक अर्थ बनाए रखता है, पर बाद की किसी विशिष्ट संत-परंपरा को आरोपित नहीं करता।
- source_word: ἐξέχεαν
  choice: बहा दिया
  rationale: क्रिया का मूल अर्थ ‘उंडेलना/बहाना’ है। ‘बहा दिया’ मांस और लहू के संयुक्त कर्म के साथ स्वाभाविक हिन्दी देता है और यूनानी की तीव्रता को बनाए रखता है।
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: यरूशलेम के चारों ओर
  rationale: κύκλῳ का स्थानवाचक अर्थ ‘चारों ओर’ है; यह स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: उन्हें दफ़नाने वाला कोई न था
  rationale: यह यूनानी रचना के अर्थ और करुण भाव को संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शास्त्रीय विलाप की प्रतिध्वनि में ὁσίων का अनुवाद
  choice: पवित्र जनों
  alternative: भक्त जनों; विश्वासयोग्य जनों; संतों
  rationale: ‘पवित्र जन’ मूल के पवित्रता और वाचा-संबंधी भाव को सुरक्षित रखता है, जबकि ‘संतों’ से जुड़ी बाद की विशिष्ट पारिभाषिक ध्वनि को अनावश्यक रूप से नहीं लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, किंतु विलाप की गरिमा और मूल यूनानी के तीखे शारीरिक बिंब को बनाए रखा गया है। ‘तेरे’ से भजन-सदृश प्रत्यक्ष संबोधन सुरक्षित रहता है।
