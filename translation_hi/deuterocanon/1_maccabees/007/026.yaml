  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: hi
  text: और राजा ने अपने प्रतिष्ठित अधिकारियों[a] में से एक, निकानोर को भेजा। वह इस्राएल से घृणा करता और उसके प्रति बैर रखता था। राजा ने उसे लोगों को नष्ट करने[b] की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने प्रतिष्ठित शासकों में से एक।’
    reason: ἀρχόντων पदाधिकारी, अधिकारी या शासक के अर्थ में आ सकता है; ἕνα τῶν का ‘में से एक’ भी सुरक्षित रखा गया है।
  - marker: b
    text: या, ‘लोगों को उखाड़ फेंकने।’
    reason: ἐξᾶραι में हटाने, उखाड़ने या पूरी तरह नष्ट करने का भाव हो सकता है।
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह सामान्य कथात्मक क्रिया है; ‘भेजा’ आधुनिक हिन्दी में स्वाभाविक और मूल अर्थ के अनुरूप है।
- source_word: ὁ Βασιλεὺς
  choice: राजा
  rationale: संदर्भ में यह तत्कालीन शासक की उपाधि है, कोई ईश्वरीय पदवी नहीं।
- source_word: Νικάνορα
  choice: नीकानोर
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: अपने प्रतिष्ठित अधिकारियों में से एक
  rationale: ἄρχων यहाँ राजकीय पदाधिकारी या शासक को और ἔνδοξος उसकी प्रतिष्ठित स्थिति को सूचित करता है; यह रूप हिन्दी में स्वाभाविक रहते हुए दोनों पहलुओं को व्यक्त करता है।
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: वह इस्राएल से घृणा करता और उसके प्रति बैर रखता था
  rationale: दोनों कृदंत नीकानोर के इस्राएल-विरोधी स्वभाव को बताते हैं। अलग वाक्य में सक्रिय क्रियाओं का प्रयोग अर्थ और बल को स्पष्ट रखता है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह अधिकारपूर्वक आदेश देने की प्रबल क्रिया है; ‘आज्ञा दी’ प्रसंग के राजकीय और गंभीर भाव के अनुकूल है।
- source_word: ἐξᾶραι τὸν λαόν
  choice: लोगों का नाश कर देने
  rationale: इस सैन्य और राजनीतिक प्रसंग में ἐξᾶραι का आशय लोगों को केवल हटाना नहीं, बल्कि समाप्त कर देना है; ‘नाश कर देने’ से इसका प्रबल अर्थ गरिमापूर्ण आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ἐξᾶραι τὸν λαόν की तीव्रता
  choice: लोगों का नाश कर देने
  alternative: लोगों को उखाड़ फेंकने; लोगों को हटा देने
  rationale: मूल क्रिया में हटाने, उखाड़ने या मिटा देने की अर्थ-सीमा है। इस्राएल के प्रति घृणा और बैर वाले संदर्भ में विनाशकारी आशय प्रमुख है, फिर भी पादटिप्पणी में ‘उखाड़ फेंकने’ का वैकल्पिक बिंब सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को पठनीय हिन्दी के लिए तीन वाक्यों में बाँटा गया है, पर कर्ता, नीकानोर का इस्राएल-विरोध और राजकीय आदेश—तीनों संबंध स्पष्ट रखे गए हैं।
