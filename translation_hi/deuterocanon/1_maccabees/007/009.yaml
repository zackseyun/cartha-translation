base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: hi
  text: और उसने उसे और अधर्मी अलकिमुस को भेजा, और उन्होंने उसके लिए याजकपद स्थापित किया[a]; और उसने उसे इस्राएल के पुत्रों के बीच प्रतिशोध लेने की आज्ञा दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उन्होंने अलकिमुस को याजकीय पद पर नियुक्त किया। यूनानी में शाब्दिक रूप से ‘उसके लिए याजकपद स्थापित किया’ है, और क्रिया बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘इस्राएल के पुत्रों के विरुद्ध।’ यूनानी पूर्वसर्ग उस समुदाय के बीच प्रतिशोध किए जाने का क्षेत्र बता सकता है, जबकि प्रसंग उसमें उनके विरुद्ध शत्रुतापूर्ण कार्यवाही का भाव भी देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह भेजने के सामान्य कथात्मक क्रियापद का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: Ἄλκιμον
  choice: अलकिमुस
  rationale: यूनानी नाम Ἄλκιμος का देवनागरी लिप्यंतरण।
- source_word: τὸν ἀσεβῆ
  choice: भक्तिहीन
  rationale: यह शब्द परमेश्वर के प्रति भक्ति और श्रद्धा के अभाव से जुड़ी धार्मिक-नैतिक निंदा को व्यक्त करता है; केवल सामान्य दुष्टता का अर्थ नहीं देता।
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: उन्होंने उसके लिए याजकपद स्थापित किया
  rationale: ἔστησαν के बहुवचन को सुरक्षित रखते हुए यूनानी वाक्य की संरचना और याजकीय पद पर प्रतिष्ठित किए जाने का भाव बनाए रखा गया है।
- source_word: ἱερωσύνην
  choice: याजकपद
  rationale: संदर्भ में संज्ञा याजकीय पद या अधिकार को सूचित करती है; ‘याजकपद’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह अधिकारपूर्ण आदेश को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: प्रतिशोध लेने
  rationale: यह प्रतिशोध को कार्यान्वित करने की कठोरता को बनाए रखता है और हिन्दी में सहज है।
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: इस्राएल के पुत्रों के बीच
  rationale: ἐν को पहले उसके क्षेत्र या समुदाय के अर्थ में रखा गया है और पारंपरिक, स्पष्ट रूप से पुल्लिंग जातीय पदबंध ‘इस्राएल के पुत्रों’ को सुरक्षित रखा गया है।
theological_decisions:
- issue: अलकिमुस के लिए ἀσεβῆ का कथावाचकीय मूल्यांकन
  choice: भक्तिहीन
  alternative: अधर्मी; दुष्ट
  rationale: ‘भक्तिहीन’ निंदा के धार्मिक आयाम को स्पष्ट रखता है, जबकि ‘दुष्ट’ उसे सामान्य नैतिक बुराई तक सीमित कर सकता है।
- issue: ἔστησαν में बहुवचन कर्ता
  choice: उन्होंने ... स्थापित किया
  alternative: उसने ... स्थापित किया; उसे याजकपद पर नियुक्त किया गया
  rationale: प्राप्त यूनानी पाठ में क्रिया बहुवचन है, इसलिए अस्पष्ट बहुवचन कर्ता को एकवचन बनाकर चुपचाप हल नहीं किया गया।
- issue: ἐν τοῖς υἱοῖς Ἰσραήλ में ἐν का संबंध
  choice: इस्राएल के पुत्रों के बीच
  alternative: इस्राएल के पुत्रों के विरुद्ध
  rationale: ‘बीच’ प्रतिशोध की कार्यवाही के क्षेत्र को व्यक्त करता है; प्रसंग में शत्रुतापूर्ण लक्ष्य का अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: υἱοῖς Ἰσραήλ का लिंग-सूचक जातीय पदबंध
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली लोगों
  rationale: यूनानी के स्पष्ट पुल्लिंग बहुवचन और पारंपरिक जातीय अभिव्यक्ति को बिना तटस्थ किए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य में यूनानी के एकवचन ‘उसने’ से बहुवचन ‘उन्होंने’ और फिर एकवचन ‘उसने’ की ओर परिवर्तन को जानबूझकर सुरक्षित रखा गया है। पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद लगाए गए हैं जिनकी वे व्याख्या करते हैं।
