lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: उनका तिरस्कार किया
  rationale: यह क्रिया नाक चढ़ाकर उपहास करने और गहरा तिरस्कार दिखाने का भाव रखती है। हिन्दी में ‘तिरस्कार किया’ स्वाभाविक और गरिमापूर्ण ढंग से उस अवमानना को व्यक्त करता है।
- source_word: κατεγέλασεν
  choice: उन पर हँसा
  rationale: यह पिछले पद से अलग, किसी पर हँसने या उसकी खिल्ली उड़ाने की ठोस क्रिया है; ‘उन पर हँसा’ दोनों क्रियाओं का अंतर बनाए रखता है।
- source_word: ἐμίανεν
  choice: उन्हें अपवित्र किया
  rationale: μιαίνω का मूल अर्थ दूषित या अपवित्र करना है। ‘अपवित्र किया’ इसके प्रबल धार्मिक और नैतिक भाव को सुरक्षित रखता है, बिना यह तय किए कि अपवित्रीकरण किस रीति से हुआ।
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: घमण्ड से बातें कीं
  rationale: यह अभिव्यक्ति अहंकारी या उद्दण्ड ढंग से बोलने को दर्शाती है। ‘घमण्ड से बातें कीं’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी क्रिया-विशेषण का बल बनाए रखती है।
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: और ... और ... और ... और
  rationale: बार-बार आया संयोजक लगातार किए गए अपमानजनक कामों को एक के बाद एक जोड़कर प्रभाव बढ़ाता है; इसलिए हिन्दी में भी पुनरावृत्ति रखी गई है।
