  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: hi
  text: और बक्खिदेस यरूशलेम से निकल गया और बेतज़ैथ में छावनी डाली। फिर उसने लोगों को भेजकर उन बहुत-से पुरुषों को पकड़वा लिया जो दलबदल करके उसकी ओर आ गए थे[a], और लोगों में से कुछ को भी पकड़वा लिया। उसने उन्हें बड़े गड्ढे में मार डाला[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दलबदल करके उसके पास आ गए थे” या “जो उसका साथ देने के लिए उसकी ओर चले गए थे।”
    reason: lexical_alternative
  - marker: b
    text: “मार डाला” के लिए प्रयुक्त यूनानी क्रिया का शाब्दिक अर्थ “बलि चढ़ाना” है; यहाँ प्रसंग हिंसक हत्या का है, वैध धार्मिक बलिदान का नहीं।
    reason: lexical_alternative
  - marker: c
    text: “बड़ा गड्ढा” का अनुवाद “बड़ा कुआँ” या “बड़ा जलकुंड” भी हो सकता है। यूनानी वाक्यांश का अर्थ “बड़े गड्ढे में” अथवा प्रसंगानुसार “बड़े गड्ढे के पास” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: निकल गया
  rationale: यह यरूशलेम से बक्खिदेस के प्रस्थान को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρενέβαλεν
  choice: छावनी डाली
  rationale: सैन्य प्रसंग में यह शिविर स्थापित करने का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: ἐν Βηξέθ
  choice: बेतज़ैथ में
  rationale: स्थान की मूल सामी पहचान अनिश्चित होने के कारण यूनानी रूप पर आधारित संयत लिप्यंतरण रखा गया है।
- source_word: συνέλαβεν
  choice: पकड़वा लिया
  rationale: ἀπέστειλεν के साथ यह बताता है कि उसने लोगों को भेजकर उन्हें पकड़वाया; इससे औपचारिक न्यायिक गिरफ्तारी का अनावश्यक अर्थ नहीं जुड़ता।
- source_word: αὐτομολησάντων
  choice: उसका पक्ष लेने के लिए उसके पास आ गए थे
  rationale: यह सैन्य-दलबदल और बक्खिदेस की ओर निष्ठा बदलने का भाव स्पष्ट करता है, जबकि अस्पष्ट सर्वनाम-संबंध से बचता है।
- source_word: τινας τοῦ λαοῦ
  choice: प्रजा में से भी कुछ लोगों को
  rationale: यह partitive अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔθυσεν
  choice: मार डाला
  rationale: क्रिया का मूल बलिदान-संबंधी रंग है, पर यहाँ प्रसंग हिंसक हत्या का है; मुख्य पाठ में भ्रामक अनुष्ठानिक अर्थ से बचते हुए टिप्पणी में शाब्दिक अर्थ सुरक्षित रखा गया है।
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: बड़े कुंड में
  rationale: εἰς की दिशात्मकता और φρέαρ के गड्ढे, कुएँ या जलकुंड जैसे अर्थों को ध्यान में रखकर ऐसा रूप चुना गया है जो हत्या अथवा शव फेंके जाने की जगह को खुला रखता है।
theological_decisions:
- issue: गैर-उपासना संबंधी हत्या के प्रसंग में ἔθυσεν का बलिदान-संबंधी अर्थ
  choice: मार डाला
  alternative: बलि चढ़ा दिया / निर्दयता से काट डाला
  rationale: कथानक वैध धार्मिक बलिदान का वर्णन नहीं करता। मुख्य पाठ हिंसक मृत्यु को स्पष्ट करता है, और पादटिप्पणी यूनानी क्रिया के असामान्य बलिदान-संबंधी रंग को बचाती है।
- issue: εἰς के साथ हत्या और बड़े φρέαρ का संबंध
  choice: बड़े कुंड में मार डाला
  alternative: बड़े कुंड के पास मार डाला / मारकर बड़े कुंड में डाल दिया
  rationale: यूनानी में εἰς सामान्यतः भीतर की दिशा बताता है, पर वाक्य यह पूरी तरह स्पष्ट नहीं करता कि हत्या कुंड में हुई या शव उसमें डाले गए; चुना हुआ रूप इसी तनाव को संक्षेप में रखता है और टिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। सैन्य संदर्भ के लिए “छावनी डाली” और सामूहिक पहचान के लिए “प्रजा” रखा गया है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में विभाजित किया गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
