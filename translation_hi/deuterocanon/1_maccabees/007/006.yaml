  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: hi
  text: और उन्होंने राजा के सामने लोगों पर आरोप लगाते हुए कहा, “यहूदा और उसके भाइयों ने आपके सभी मित्रों[a] का नाश कर दिया है और हमें हमारी भूमि से तितर-बितर कर दिया है।”
  philosophy: optimal-equivalence
  footnotes:
