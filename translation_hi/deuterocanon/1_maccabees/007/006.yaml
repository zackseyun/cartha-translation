lexical_decisions:
- source_word: κατηγόρησαν
  choice: दोष लगाया
  rationale: यह क्रिया किसी पर आरोप लगाने या अभियोग प्रस्तुत करने को व्यक्त करती है। ‘दोष लगाया’ आधुनिक हिन्दी में स्वाभाविक है और राजा के सामने की गई शत्रुतापूर्ण शिकायत के अनुकूल है।
- source_word: τοῦ λαοῦ
  choice: लोगों पर
  rationale: κατηγόρησαν के साथ संबंधकारक रूप आरोप के लक्ष्य को बताता है। ‘लोगों पर’ यूनानी पाठ का सीधा और सहज अनुवाद है।
- source_word: πρὸς τὸν βασιλέα
  choice: राजा के सामने
  rationale: बोलने या आरोप लगाने के प्रसंग में πρός संबोधन की दिशा बताता है; ‘राजा के सामने’ औपचारिक राजकीय सुनवाई का भाव भी व्यक्त करता है।
- source_word: Ἀπώλεσεν
  choice: नाश कर दिया है
  rationale: ἀπόλλυμι यहाँ व्यक्तियों को समाप्त या नष्ट करने के अर्थ में है। ‘नाश कर दिया है’ क्रिया की तीव्रता बनाए रखता है, बिना मृत्यु की रीति को अनावश्यक रूप से निश्चित किए।
- source_word: οἱ φίλοι σου
  choice: आपके सभी मित्रों
  rationale: φίλοι का सामान्य अर्थ ‘मित्र’ है, जबकि हेलेनिस्ती राजकीय संदर्भ में यह राजा के समर्थकों, सहयोगियों या दरबारी सहयोगियों के लिए भी प्रयुक्त हो सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है और राजनीतिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐσκόρπισεν
  choice: तितर-बितर कर दिया है
  rationale: यह επιλογή बिखेरने और विस्थापित करने की मूल छवि को बनाए रखती है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀπὸ τῆς γῆς ἡμῶν
  choice: हमारी भूमि से
  rationale: γῆ यहाँ भूमि, क्षेत्र या देश का बोध करा सकता है। ‘हमारी भूमि’ पर्याप्त व्यापक और स्रोत के निकट है।
theological_decisions:
- issue: एकवचन क्रियाओं Ἀπώλεσεν और ἐσκόρπισεν के साथ ‘यहूदा और उसके भाई’ का संबंध
  choice: हिन्दी में दोनों क्रियाओं को ‘यहूदा और उसके भाइयों’ के संयुक्त कर्ता के अनुसार बहुवचन आदरसूचक/सामान्य पूर्ण रूप में प्रस्तुत किया गया है।
  alternative: संरचना को अधिक शाब्दिक रखते हुए यहूदा को मुख्य कर्ता बनाना, जैसे ‘यहूदा ने—और उसके भाइयों ने उसके साथ—...’।
  rationale: यूनानी वाक्य यहूदा को अगुआ के रूप में अग्रभूमि में रखता है, पर स्पष्ट संयुक्त कर्ता के कारण स्वाभाविक हिन्दी में बहुवचन कर्ता के अनुरूप ‘ने ... कर दिया है’ उचित है। यह व्याकरणिक निर्णय है; इससे किसी विशिष्ट धार्मिक सिद्धांत को स्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। राजा को संबोधित करते समय ‘आपके’ अपनाया गया है। ‘तितर-बितर’ स्रोत की बिखेरने वाली छवि को बनाए रखता है, और राजकीय ‘मित्रों’ की संभावित तकनीकी अर्थछाया पादटिप्पणी में सुरक्षित है।
