  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: hi
  text: “मेरे और तुम्हारे बीच कोई लड़ाई न हो। मैं कुछ ही आदमियों के साथ आऊँगा, ताकि मैं शांति से तुम्हारे चेहरे देख सकूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: कोई ... न हो
  rationale: यह निषेधात्मक आज्ञार्थक अभिव्यक्ति है; हिंदी में यह विनती या प्रस्ताव की सीधी शक्ति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: μάχη
  choice: लड़ाई
  rationale: सैन्य-राजनीतिक प्रसंग में यह युद्ध या सशस्त्र संघर्ष को सूचित करता है; ‘लड़ाई’ आधुनिक हिंदी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: मेरे और तुम्हारे बीच
  rationale: यह वक्ता और बहुवचन संबोधित पक्ष के बीच संबंध को स्पष्ट रखता है।
- source_word: ἥξω
  choice: मैं ... आऊँगा
  rationale: भविष्यकालीन क्रिया वक्ता की ओर से आने या पहुँचने को व्यक्त करती है।
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: थोड़े-से आदमियों के साथ
  rationale: यहाँ ἐν संगति का भाव देता है; प्रसंग में साथ आने वाले पुरुष अनुचर या सैनिक हैं।
- source_word: ἵνα ἴδω
  choice: ताकि ... मिल सकूँ
  rationale: ‘ताकि’ उद्देश्यवाचक बल को बनाए रखता है; ‘मिल सकूँ’ अगले यूनानी मुहावरे के साथ मिलकर स्वाभाविक हिंदी देता है।
- source_word: ὑμῶν τὰ πρόσωπα
  choice: तुमसे आमने-सामने
  rationale: शाब्दिक अर्थ ‘तुम्हारे चेहरे देखूँ’ है, पर यहाँ यह व्यक्तिगत भेंट का मुहावरा है; ‘आमने-सामने’ उसकी ठोस छवि और आशय दोनों को रखता है।
- source_word: μετ’ εἰρήνης
  choice: शांति से
  rationale: यह भेंट के शांतिपूर्ण ढंग या परिस्थिति को व्यक्त करता है, बिना इसे मित्रता के अधिक विशिष्ट दावे में बदलने के।
