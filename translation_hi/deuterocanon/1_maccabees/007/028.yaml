    issue: The phrase “तुमसे आमने-सामने मिल सकूँ” does not explicitly translate “ὑμῶν τὰ πρόσωπα” (“your faces”).
    rationale: The Greek says that the speaker will come in order to see the addressees' faces in peace. “मिल सकूँ” introduces an encounter formulation rather than retaining the stated act of seeing; a close translation can remain natural in Hindi.
