lexical_decisions:
- source_word: πρῶτοι
  choice: सबसे पहले
  rationale: यह विधेयात्मक प्रयोग प्राथमिकता और पहल को व्यक्त करता है; हिन्दी में ‘सबसे पहले’ स्वाभाविक रूप से बताता है कि इसी समूह ने पहले कदम उठाया।
- source_word: Ἀσιδαῖοι
  choice: हसीदी
  rationale: यह एक पहचाने जाने वाले दल का लिप्यंतरित नाम है; वर्णनात्मक अनुवाद करने के बजाय समूह-नाम को सुरक्षित रखा गया है।
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: इस्राएल की सन्तानों में
  rationale: ἐν का अर्थ यहाँ ‘में/के बीच’ है। ‘इस्राएल की सन्तानें’ यूनानी की पारिवारिक-राष्ट्रीय और वाचागत अभिव्यक्ति को बनाए रखता है।
- source_word: ἐπεζήτουν
  choice: माँग की
  rationale: इस प्रसंग में क्रिया शान्ति प्राप्त करने के लिए पहल या अनुरोध का संकेत देती है। हिन्दी में ‘शान्ति की माँग की’ ‘शान्ति को खोजा’ की अपेक्षा अधिक स्वाभाविक है, यद्यपि अपूर्णकाल की प्रक्रियात्मक छाया स्पष्ट नहीं की गई।
- source_word: παρʼ αὐτῶν
  choice: उनसे
  rationale: παρά के सम्बन्धकारक प्रयोग का मूल अर्थ ‘से’ है और बहुवचन αὐτῶν को ‘उनसे’ रखा गया है; संदर्भगत संकेत को किसी एक व्यक्ति तक सीमित नहीं किया गया।
- source_word: εἰρήνην
  choice: शान्ति
  rationale: मूल संज्ञा का सीधा अर्थ रखा गया है; ‘शान्ति की शर्तें’ जैसे विस्तार से बचा गया है।
