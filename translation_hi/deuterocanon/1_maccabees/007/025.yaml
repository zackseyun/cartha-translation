base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: hi
  text: पर जब अलकिमुस ने देखा कि यहूदा और उसके साथी मज़बूत हो गए थे[a], और वह समझ गया कि वह उनका सामना नहीं कर सकता, तब वह राजा के पास लौट गया और उसने उन पर दुर्भावनापूर्ण आरोप लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ मुद्रित यूनानी पांडुलिपियों का शाब्दिक पाठ है, “वह जान गया कि वह उनका सामना कर सकता है।” प्रसंग से प्रबल संकेत मिलता है कि आशय “वह उनका सामना नहीं कर सकता” है; अनुवाद में यही अर्थ अपनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: पर जब ... ने देखा
  rationale: ὡς के साथ भूतकालिक क्रिया समयसूचक उपवाक्य बनाती है; δέ यहाँ कथा में हल्का विरोधी मोड़ देता है।
- source_word: ἐνίσχυσεν
  choice: शक्तिशाली हो गए हैं
  rationale: यह क्रिया बल प्राप्त करने और परिणामस्वरूप मजबूत स्थिति में पहुँचने का भाव देती है; हिन्दी में पूर्ण अवस्था स्वाभाविक ढंग से व्यक्त होती है।
- source_word: οἱ μετ’ αὐτοῦ
  choice: उसके साथी
  rationale: यह साथ रहने या साथ देने वालों का संबंधसूचक वाक्यांश है; ‘साथी’ संक्षिप्त और स्वाभाविक है तथा अनावश्यक रूप से लिंग नहीं जोड़ता।
- source_word: ἔγνω
  choice: समझ गया
  rationale: संदर्भ में यह परिस्थितियों को देखकर किसी निष्कर्ष पर पहुँचने का भाव देता है, इसलिए केवल ‘जान गया’ की अपेक्षा ‘समझ गया’ अधिक स्वाभाविक है।
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: वह उनका सामना नहीं कर सकता
  rationale: प्रेषित यूनानी पाठ में निषेध नहीं है, पर तत्कालीन कथा-संदर्भ असमर्थता की ओर संकेत करता है। अनुवाद प्रसंगानुकूल अर्थ देता है और पादटिप्पणी मूल पाठ की वास्तविक अस्पष्टता दर्ज करती है।
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: वह राजा के पास लौट गया
  rationale: ἐπιστρέφω यहाँ वापस मुड़ने या लौटने के अर्थ में है; यह हिन्दी में सीधा और सहज रूप है।
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: उसने उन पर दुष्ट आरोप लगाए
  rationale: κατηγορέω आरोप लगाने का अर्थ देता है और πονηρά उन आरोपों की बुरी या दुर्भावनापूर्ण प्रकृति बताता है; ‘दुष्ट आरोप’ मूल का नैतिक मूल्यांकन बनाए रखता है।
theological_decisions:
- issue: δύναται ὑποστῆναι αὐτούς में निषेध का अभाव
  choice: 'मुख्य पाठ में प्रसंगानुसार असमर्थता: ‘वह उनका सामना नहीं कर सकता।’'
  alternative: 'उपलब्ध मुद्रित यूनानी का शाब्दिक अर्थ: ‘वह उनका सामना कर सकता है।’'
  rationale: यहूदा की बढ़ी हुई शक्ति देखकर अलकिमुस का राजा के पास लौटना इस बात से अधिक संगत है कि वह उनका सामना नहीं कर सकता था। फिर भी मूल पाठ में निषेध न होने के कारण इस पाठगत तनाव को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथा-शैली सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘अलकिमुस’ और ‘यहूदा’ नाम-रूप प्रचलित बाइबलीय हिन्दी के अनुरूप हैं।
