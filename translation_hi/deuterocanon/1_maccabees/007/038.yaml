base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: hi
  text: इस मनुष्य और उसकी छावनी से बदला ले, और वे तलवार से मारे जाएँ। उनकी ईशनिन्दाओं[a] को स्मरण कर, और उन्हें टिके रहने का अवसर न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निन्दाओं’, ‘अपमानों’ अथवा ‘बदनाम करने वाली बातों’। यूनानी शब्द व्यापक रूप से अपमानजनक वाणी का अर्थ दे सकता है, पर यहाँ प्रार्थना का धार्मिक प्रसंग ‘ईशनिन्दाओं’ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्हें कोई ठिकाना न दे’, ‘उन्हें कोई राहत न दे’ अथवा ‘उन्हें जीवित न बचने दे’। यूनानी पद ठहरने, सुरक्षित बने रहने या निरंतर अस्तित्व की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: बदला ले
  rationale: यह यूनानी मुहावरा दंडात्मक प्रतिशोध की प्रार्थना व्यक्त करता है। ‘बदला ले’ आधुनिक हिन्दी में स्वाभाविक और सीधा है, जबकि केवल ‘न्याय कर’ मूल की दंडात्मक तीव्रता को कम कर देता।
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: इस मनुष्य से
  rationale: ἐκδίκησιν के साथ ἐν प्रतिशोध के लक्ष्य को सूचित करता है; हिन्दी में ‘इस मनुष्य से बदला ले’ इसका स्वाभाविक रूप है।
- source_word: παρεμβολῇ
  choice: छावनी
  rationale: παρεμβολή सैन्य शिविर अथवा उसमें डेरा डाले सैन्य दल को दर्शाता है। ‘छावनी’ प्रसंग के सैन्य भाव को स्पष्ट रखता है।
- source_word: πεσάτωσαν
  choice: वे ... मारे जाएँ
  rationale: बहुवचन आज्ञार्थक प्रार्थना इस मनुष्य और उसकी छावनी को सामूहिक रूप से संदर्भित करती है। तलवार के प्रसंग में ‘मारे जाएँ’ हिन्दी में ‘गिरें’ से अधिक स्पष्ट है।
- source_word: ἐν ῥομφαίᾳ
  choice: तलवार से
  rationale: यह युद्ध में तलवार द्वारा मृत्यु का सामान्य मुहावरा है।
- source_word: μνήσθητι
  choice: स्मरण कर
  rationale: परमेश्वर से की गई प्रार्थना में यह अपराधों को न्यायिक रूप से ध्यान में रखने का अनुरोध है; ‘स्मरण कर’ उस गंभीरता को बनाए रखता है।
- source_word: δυσφημιῶν
  choice: ईशनिन्दाओं
  rationale: शब्द अपमानजनक, बदनाम करने वाली या अशुभ वाणी को व्यापक रूप से सूचित कर सकता है। यहाँ पवित्र संघर्ष में परमेश्वर से की गई प्रार्थना धार्मिक रूप से अधिक तीव्र अर्थ ‘ईशनिन्दाओं’ का समर्थन करती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: उन्हें टिके रहने का अवसर न दे
  rationale: μονή ठहरने, बने रहने, निवास अथवा निरंतर अस्तित्व का बोध करा सकता है। यह हिन्दी रूप किसी एक अत्यधिक ठोस अर्थ को थोपे बिना उनके सुरक्षित बने रहने या बच निकलने से इनकार की प्रार्थना व्यक्त करता है।
theological_decisions:
- issue: शापात्मक प्रार्थना में δυσφημιῶν का अर्थ
  choice: ईशनिन्दाओं
  alternative: निन्दाओं, अपमानों या बदनाम करने वाली बातों
  rationale: पवित्र संघर्ष और परमेश्वर को संबोधित प्रार्थना धार्मिक अपराध के अर्थ को बल देते हैं, पर यूनानी शब्द का व्यापक वाचिक अर्थ पादटिप्पणी में रखा गया है।
- issue: μονήν में बने रहने और जीवित बचने के बीच अर्थ-संबंध
  choice: टिके रहने का अवसर न दे
  alternative: कोई ठिकाना न दे; कोई राहत न दे; जीवित न बचने दे
  rationale: मूल शब्द ठहराव, स्थायित्व या निवास का संकेत देता है और इस प्रसंग में जीवित बचे रहने तक विस्तृत हो सकता है। चुना हुआ रूप इस अर्थ-तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर प्रार्थनात्मक शैली रखी गई है। परमेश्वर को संबोधित एकवचन आज्ञार्थक रूप मूल यूनानी के सीधे निवेदन को बनाए रखते हैं। ‘छावनी’, ‘स्मरण’ और ‘ईशनिन्दा’ गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शब्द हैं।
