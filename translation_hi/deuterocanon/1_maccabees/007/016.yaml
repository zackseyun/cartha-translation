  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: hi
  text: 'और उन्होंने उस पर भरोसा किया। उन्होंने उन्हीं में से साठ पुरुषों को पकड़ लिया, और उसने उन्हें एक ही दिन में मार डाला[a]—उन वचनों के अनुसार जिन्हें उसने लिखा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘उन्होंने पकड़ लिया’ बहुवचन में है, लेकिन ‘उसने मार डाला’ एकवचन में। अनुवाद में यह कर्ता-परिवर्तन ज्यों का त्यों रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: उन्होंने उस पर भरोसा किया
  rationale: यह क्रिया किसी व्यक्ति पर विश्वास या भरोसा रखने को दर्शाती है; यहाँ धार्मिक विश्वास के बजाय कथात्मक भरोसा अभिप्रेत है।
- source_word: συνέλαβον
  choice: उन्होंने ... पकड़ लिया
  rationale: यूनानी क्रिया बहुवचन में है। हिन्दी में इसे बहुवचन ही रखा गया है, ताकि स्रोत में उपस्थित कर्ता-परिवर्तन न मिटे।
- source_word: ἐξ αὐτῶν
  choice: उन्हीं में से
  rationale: यह बड़े समूह में से कुछ व्यक्तियों के चुने या पकड़े जाने का अंशसूचक भाव स्पष्ट करता है।
- source_word: ἑξήκοντα ἄνδρας
  choice: साठ पुरुषों
  rationale: संख्या और पुरुष व्यक्तियों के स्पष्ट उल्लेख का सीधा आधुनिक हिन्दी रूप।
- source_word: ἀπέκτεινεν
  choice: उसने ... मार डाला
  rationale: यूनानी क्रिया एकवचन में है और जान से मारने की पूर्ण कार्रवाई व्यक्त करती है; ‘मार डाला’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: एक ही दिन में
  rationale: यह समय-सीमा को व्यक्त करता है और एक दिन के भीतर पूरी घटना होने पर बल बनाए रखता है।
- source_word: κατὰ τοὺς λόγους
  choice: उन वचनों के अनुसार
  rationale: यह आगे आने वाले लिखित उद्धरण के साथ अनुरूपता बताता है; ‘वचन’ लिखित धर्मग्रंथीय कथन के लिए गरिमापूर्ण, किंतु सामान्य हिन्दी में समझ आने वाला शब्द है।
- source_word: οὓς ἔγραφεν
  choice: जिन्हें उसने लिखा था
  rationale: स्रोत की सक्रिय एकवचन रचना को बनाए रखा गया है। इसे कर्मवाच्य ‘जो लिखे थे’ बनाकर लेखक के संदर्भ की वास्तविक अस्पष्टता को नहीं मिटाया गया।
theological_decisions:
- issue: συνέλαβον के बहुवचन और ἀπέκτεινεν के एकवचन के बीच कर्ता-परिवर्तन
  choice: ‘उन्होंने ... पकड़ लिया, पर उसने ... मार डाला’ के रूप में दोनों व्याकरणिक वचनों को सुरक्षित रखना
  alternative: दोनों क्रियाओं को एकवचन करके ‘उसने पकड़ लिया और मार डाला’ कहना
  rationale: प्रमाणित यूनानी पाठ में वास्तविक मिश्रित रचना है। प्रधान एजेंट के आधार पर इसे एकवचन करना सहज होता, पर ऐसा करने से स्रोत का तनाव और कार्रवाई में संभावित सामूहिक भागीदारी छिप जाती। ‘पर’ हिन्दी पाठक को परिवर्तन पहचानने में सहायता देता है, बिना उसका कारण तय किए।
- issue: οὓς ἔγραφεν में लिखने वाले एकवचन व्यक्ति की पहचान
  choice: ‘जिन्हें उसने लिखा था’ द्वारा सर्वनामगत अस्पष्टता बनाए रखना
  alternative: ‘जैसा लिखा था’ कहकर कर्मवाच्य बनाना या लेखक की स्पष्ट पहचान जोड़ना
  rationale: यूनानी पाठ लेखक का नाम यहाँ नहीं बताता। किसी धर्मग्रंथीय लेखक या अन्य व्यक्ति की पहचान जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘भरोसा किया,’ ‘पकड़ लिया’ और ‘मार डाला’ सामान्य पाठक के लिए स्पष्ट हैं; ‘वचनों के अनुसार’ आगे आने वाले धर्मग्रंथीय उद्धरण से औपचारिक संबंध बनाए रखता है।
