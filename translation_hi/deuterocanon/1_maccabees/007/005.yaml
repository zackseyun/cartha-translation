  text: And all the lawless and ungodly men from Israel came to him[a], and Alcimus led them, wanting to be priest,
translation:
  language: hi
  text: और इस्राएल में से सभी व्यवस्था-विरोधी और भक्तिहीन पुरुष उसके पास आए, और अलकिमुस उनकी अगुवाई कर रहा था; वह पुरोहित बनना चाहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरोहित का पद पाना चाहता था।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “पुरोहित के रूप में सेवा करना” है; इस प्रसंग में संभवतः अलकिमुस की महायाजकीय पद पाने की आकांक्षा अभिप्रेत है।
    reason: मूल क्रिया की व्यापकता और ऐतिहासिक प्रसंग में महायाजकीय पद की संभावना दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी संज्ञा स्पष्ट रूप से पुल्लिंग बहुवचन है और यहाँ एक विशिष्ट पुरुष-समूह को सूचित करती है।
- source_word: ἄνομοι
  choice: व्यवस्था-विरोधी
  rationale: यह शब्द केवल सामान्य दुष्टता नहीं, बल्कि व्यवस्था के विरुद्ध आचरण का भाव रखता है; इस संदर्भ में मूसा की व्यवस्था से जुड़ा अर्थ भी सुनाई देता है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीन
  rationale: यह परमेश्वर के प्रति श्रद्धा और भक्ति के अभाव को व्यक्त करता है और पहले विशेषण के कानूनी/वाचा-संबंधी भाव से अलग धार्मिक आयाम बनाए रखता है।
- source_word: ἐξ Ἰσραήλ
  choice: इस्राएल में से
  rationale: यह बताता है कि वे इस्राएल के भीतर से निकले या उसी समुदाय के सदस्य थे।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: गति-सूचक क्रिया के साथ यह किसी व्यक्ति के पास आने का स्वाभाविक हिन्दी रूप है।
- source_word: ἡγείται
  choice: अगुवाई कर रहा था
  rationale: ऐतिहासिक वर्तमान को प्रवाहपूर्ण हिन्दी कथन में अपूर्ण भूतकाल से व्यक्त किया गया है; इससे समूह में अलकिमुस की नेतृत्वकारी भूमिका स्पष्ट रहती है।
- source_word: βουλόμενος
  choice: चाहता था
  rationale: कृदंत अलकिमुस की इच्छा या उद्देश्य बताता है; सरल आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: ἱερατεύειν
  choice: पुरोहित बनना
  rationale: यूनानी क्रिया का मूल अर्थ पुरोहित के रूप में सेवा करना या पुरोहित होना है। प्रसंग महायाजकीय पद की ओर संकेत कर सकता है, पर मूल शब्द स्वयं 'महायाजक' नहीं कहता।
theological_decisions:
- issue: इस्राएली पुरुषों के लिए दो नैतिक-धार्मिक विशेषण
  choice: व्यवस्था-विरोधी और भक्तिहीन
  alternative: दुष्ट और अधर्मी
  rationale: चुना हुआ रूप ἄνομοι के व्यवस्था-विरोधी और ἀσεβεῖς के ईश्वर-विमुख धार्मिक भाव को अलग-अलग सुरक्षित रखता है।
- issue: अलकिमुस की पुरोहिताई की आकांक्षा की विशिष्टता
  choice: पुरोहित बनना
  alternative: महायाजक बनना
  rationale: ऐतिहासिक प्रसंग में महायाजकीय पद अभिप्रेत होने की प्रबल संभावना है, पर ἱερατεύειν में 'महा-' स्पष्ट नहीं है। मुख्य पाठ मूल की शब्दगत व्यापकता रखता है और टिप्पणी संदर्भगत संभावना बताती है।
