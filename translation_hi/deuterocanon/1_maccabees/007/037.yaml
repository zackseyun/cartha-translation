  yaml_path: translation/deuterocanon/1_maccabees/007/037.yaml
  text: You chose this house for your name to be called upon it[a], to be a house of prayer and petition for your people.
translation:
  language: hi
  text: तूने इस भवन को चुना कि तेरा नाम इस पर पुकारा जाए[a] और यह तेरी प्रजा के लिए प्रार्थना और विनती का भवन हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि यह तेरे नाम से कहलाए” अथवा “कि इस पर तेरे नाम का आह्वान किया जाए।” यूनानी में प्रयुक्त बाइबिलीय अभिव्यक्ति बताती है कि यह भवन परमेश्वर का है और उसके नाम से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξω
  choice: तूने चुना
  rationale: यूनानी क्रिया परमेश्वर द्वारा भवन के चयन को व्यक्त करती है। ‘चुना’ सहज आधुनिक हिन्दी है और वाचा-संबंधी भाव को बिना तकनीकी भाषा के बनाए रखता है।
- source_word: τὸν οἶκον τοῦτον
  choice: इस भवन को
  rationale: οἶκος का मूल अर्थ ‘घर’ है, पर यहाँ मंदिर का भवन अभिप्रेत है। ‘भवन’ हिन्दी में पवित्र स्थल के संदर्भ में स्वाभाविक है और अगले पदबंध ‘प्रार्थना ... का भवन’ के साथ संगति रखता है।
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: कि तेरा नाम इस पर पुकारा जाए
  rationale: यह अनुवाद यूनानी की बाइबिलीय अभिव्यक्ति को निकटता से रखता है और परमेश्वर के स्वामित्व, उपस्थिति तथा उसके नाम से भवन के संबंध की वास्तविक व्यापकता को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: εἶναι
  choice: और यह ... हो
  rationale: दूसरे उद्देश्यसूचक infinitive को सहज हिन्दी वाक्य में समानांतर उद्देश्य के रूप में व्यक्त किया गया है।
- source_word: οἶκον προσευχῆς
  choice: प्रार्थना ... का भवन
  rationale: यह परिचित बाइबिलीय पदबंध को बनाए रखता है और यूनानी संबंधकारक रचना को स्वाभाविक हिन्दी देता है।
- source_word: καὶ δεήσεως
  choice: और विनती
  rationale: δέησις विशेष या आग्रहपूर्ण प्रार्थना का बोध कराता है। ‘विनती’ आधुनिक, प्रतिष्ठित और ‘प्रार्थना’ से पर्याप्त रूप से भिन्न है।
- source_word: τῷ λαῷ σου
  choice: तेरी प्रजा के लिए
  rationale: 'सम्प्रदान कारक को हित अथवा संदर्भ के अर्थ में लिया गया है: भवन परमेश्वर की प्रजा के लिए प्रार्थना और विनती का स्थान है।'
theological_decisions:
- issue: मंदिर पर परमेश्वर का नाम पुकारे जाने की अभिव्यक्ति
  choice: कि तेरा नाम इस पर पुकारा जाए
  alternative: कि यह तेरे नाम से कहलाए / कि इस पर तेरे नाम का आह्वान किया जाए
  rationale: यूनानी वाक्यांश परमेश्वर के नाम, उसके स्वामित्व और मंदिर से उसके वाचा-संबंध की बाइबिलीय भाषा को प्रतिध्वनित करता है। मुख्य पाठ निकट रूप रखता है, जबकि पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को संबोधित एकवचन ‘तू’ प्रार्थना की प्रत्यक्षता और यूनानी दूसरे पुरुष एकवचन को दर्शाता है। भाषा dignified किन्तु सामान्य पाठक के लिए सहज रखी गई है।
