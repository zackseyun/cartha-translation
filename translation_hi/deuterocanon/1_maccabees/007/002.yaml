  text: और ऐसा हुआ कि जब वह अपने पूर्वजों के राजमहल[a] में प्रवेश कर रहा था, तब सैन्य दलों ने अन्तियोखुस और लुसियास को पकड़ लिया, ताकि उन्हें उसके पास ले जाएँ।
