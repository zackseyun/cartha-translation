- source_word: ἐγένετο ὡς
  choice: और ऐसा हुआ कि जब
  rationale: यह यूनानी कथात्मक सूत्र प्रसंग में परिवर्तन और साथ-साथ होने वाली घटना को व्यक्त करता है; हिन्दी में यह रूप उसके दोनों तत्वों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: εἰσεπορεύετο
  choice: प्रवेश कर रहा था
  rationale: अपूर्ण भूतकाल चल रही क्रिया का संकेत देता है, इसलिए प्रगतिशील हिन्दी रूप चुना गया है।
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  choice: अपने पूर्वजों के राजभवन
  rationale: ‘राजभवन’ राजकीय या वंशगत निवास का भाव स्वाभाविक हिन्दी में देता है; असामान्य शाब्दिक रचना को पादटिप्पणी में सुरक्षित रखा गया है। ‘पूर्वजों’ आधुनिक हिन्दी में बहुवचन ‘पितरों’ के वंशगत आशय को स्पष्ट करता है।
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: यह क्रिया पकड़ने या हिरासत में लेने को व्यक्त कर सकती है। ‘पकड़ लिया’ किसी औपचारिक न्यायिक गिरफ्तारी का अतिरिक्त अर्थ आरोपित नहीं करता।
- source_word: αἱ δυνάμεις
  choice: सैनिक दलों
  rationale: बहुवचन संज्ञा सैन्य शक्तियों या टुकड़ियों को सूचित करती है; ‘सैनिक दलों’ हिन्दी में बहुवचन और सैन्य सन्दर्भ दोनों बनाए रखता है।
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: ताकि उन्हें उसके पास ले जाएँ
  rationale: अनन्त क्रिया पकड़ने का उद्देश्य बताती है। सर्वनाम की संदर्भगत अस्पष्टता को नाम जोड़कर समाप्त नहीं किया गया है।
