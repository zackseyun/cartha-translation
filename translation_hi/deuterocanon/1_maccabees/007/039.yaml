lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: यह ἐξέρχομαι के स्थान से बाहर जाने के सीधे अर्थ को व्यक्त करता है; ‘कूच किया’ जोड़ने से सैन्य भाव मूल क्रिया से अधिक स्पष्ट हो जाता।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य प्रसंग में παρεμβάλλω का अर्थ शिविर लगाना या पड़ाव डालना है। यह आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: Βεθωρών
  choice: बेथ-होरोन
  rationale: स्थान-नाम को अनुवादित करने के बजाय प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: συνήντησεν αὐτῷ
  choice: उससे आ मिली
  rationale: यह मिलने या सामना होने का व्यापक अर्थ बनाए रखता है। ‘उसके साथ जा मिली’ मैत्रीपूर्ण सहायता को आवश्यकता से अधिक निश्चित कर देता।
- source_word: δύναμις Συρίας
  choice: सीरिया की एक सैन्य टुकड़ी
  rationale: सैन्य आख्यान में δύναμις सेना या सैन्य बल को दर्शा सकता है। अनिर्दिष्ट रूप के कारण ‘एक’ उचित है, जबकि सम्बन्धकारक Συρίας को ‘सीरिया की’ से सीधे व्यक्त किया गया है।
