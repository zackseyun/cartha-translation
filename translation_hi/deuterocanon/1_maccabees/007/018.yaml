  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: hi
  text: उनका भय और आतंक सारी प्रजा पर छा गया, क्योंकि उन्होंने कहा, “उनमें न सच्चाई है, न न्याय; क्योंकि उन्होंने उस समझौते[a] और उस शपथ को तोड़ दिया है जो उन्होंने खाई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संधि” अथवा “वाचा”; यूनानी शब्द किसी औपचारिक व्यवस्था को सूचित कर सकता है, और साथ उल्लिखित शपथ इस अर्थ को और पुष्ट करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν αὐτῶν ὁ φόβος, καὶ ὁ τρόμος
  choice: उनका भय और आतंक … पर छा गया
  rationale: ἐπιπίπτω के अचानक आ पड़ने के भाव को स्वाभाविक हिन्दी में ‘छा गया’ व्यक्त करता है। αὐτῶν को ‘उनका’ रखकर यह अर्थ सुरक्षित रखा गया है कि प्रजा उन लोगों से भयभीत हुई। φόβος और τρόμος के युग्म को क्रमशः ‘भय’ और ‘आतंक’ कहा गया है।
- source_word: εἰς πάντα τὸν λαόν
  choice: सारी प्रजा पर
  rationale: यह पूरे समुदाय पर भय के फैलने को व्यक्त करता है; ऐतिहासिक-सामुदायिक प्रसंग में ‘प्रजा’ स्वाभाविक है।
- source_word: ἀλήθεια καὶ κρίσις
  choice: न सच्चाई है, न न्याय
  rationale: ἀλήθεια का सीधा नैतिक अर्थ ‘सच्चाई’ और κρίσις का यहाँ न्यायपूर्ण व्यवहार का अर्थ ‘न्याय’ है। दोहरी निषेध-रचना हिन्दी में आरोप का बल बनाए रखती है।
- source_word: παρῆρσαν
  choice: तोड़ दिया है
  rationale: यहाँ क्रिया पहले स्वीकार किए गए औपचारिक दायित्वों के उल्लंघन को दर्शाती है। समझौता और शपथ ‘तोड़ना’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक मुहावरा है।
- source_word: τὴν στάσιν
  choice: उस समझौते
  rationale: इस संदर्भ में στάσις शपथ से पुष्ट औपचारिक व्यवस्था या सहमति को सूचित करता है। ‘समझौता’ अर्थ को स्पष्ट रखता है और अनावश्यक रूप से अधिक विशिष्ट धार्मिक अर्थ नहीं जोड़ता।
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: उस शपथ … जो उन्होंने खाई थी
  rationale: संज्ञा ὅρκος और क्रिया ὄμνυμι के स्पष्ट संबंध को ‘शपथ … खाई’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या στάσις का अनुवाद वाचागत शब्दावली से किया जाए
  choice: समझौता
  alternative: वाचा या संधि
  rationale: पद एक औपचारिक व्यवस्था और उसके साथ खाई गई शपथ के उल्लंघन की निंदा करता है, पर στάσις स्वयं अनिवार्य रूप से धर्मवैधानिक ‘वाचा’ नहीं दर्शाता। ‘समझौता’ विधिक-संबंधपरक भाव को बिना अति-व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘लोग कहने लगे’ बहुवचन εἶπον को स्वाभाविक हिन्दी में व्यक्त करता है; उद्धरण में ‘न … न …’ आरोप की संक्षिप्त शक्ति बनाए रखता है।
