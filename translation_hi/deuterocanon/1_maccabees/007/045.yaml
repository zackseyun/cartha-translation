translation:
  language: hi
  text: और वे अदासा से गजेरा पहुँचने तक एक दिन की यात्रा भर उनका पीछा करते रहे, और उन्होंने उनके पीछे संकेत देने वाली तुरहियाँ फूँकी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωκον
  choice: पीछा करते हुए ... गए
  rationale: अपूर्णकालिक क्रिया लगातार जारी सैन्य पीछा दर्शाती है; यह हिंदी प्रयोग उस गतिशीलता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: एक दिन की यात्रा जितनी दूर
  rationale: यह पदबंध एक दिन में तय की जाने वाली दूरी सूचित करता है; चुना गया रूप अवधि और दूरी के संबंध को स्पष्ट रखता है।
- source_word: ἀπὸ Ἀδασὰ
  choice: अदासा से
  rationale: स्थान-नाम का यूनानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: गजेरा तक गए
  rationale: ἕως के साथ क्रियार्थक संज्ञा पीछा किए जाने की अंतिम सीमा बताती है; संक्षिप्त हिंदी में वही सीमा सुरक्षित है।
- source_word: ἐσάλπισαν
  choice: फूँकी
  rationale: क्रिया का सीधा अर्थ तुरही बजाने के लिए उसमें फूँकना है; हिंदी में ‘तुरहियाँ फूँकी’ स्वाभाविक और सटीक है।
- source_word: ὀπίσω αὐτῶν
  choice: उनके पीछे
  rationale: स्थानगत अर्थ को यथावत रखा गया है और ‘उनका पीछा करते हुए’ जैसी अतिरिक्त व्याख्या इस पदबंध में नहीं जोड़ी गई।
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: संकेत देने वाली तुरहियाँ
  rationale: सम्बन्धकारक पद तुरहियों के संकेत-संबंधी सैन्य कार्य को बताता है; यह रूप अस्वाभाविक ‘संकेतों की तुरहियाँ’ की अपेक्षा स्पष्ट आधुनिक हिंदी है।
