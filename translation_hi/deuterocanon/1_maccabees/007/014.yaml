  yaml_path: translation/deuterocanon/1_maccabees/007/014.yaml
  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: hi
  text: क्योंकि उन्होंने कहा, “एक आदमी, हारून के वंश[a] का एक याजक, सैन्य बलों[b] के साथ आया है; वह हमारे साथ अन्याय नहीं करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हारून के बीज में से”; यह वंशावली संबंधी अभिव्यक्ति हारून से याजकीय वंश को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “सैन्य बलों के साथ” का अनुवाद “सेना के साथ” या “सैनिकों के साथ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: क्योंकि उन्होंने कहा
  rationale: γάρ पिछले प्रसंग का कारण स्पष्ट करता है, और अओरिस्ट εἶπαν को स्वाभाविक कथात्मक भूतकाल में रखा गया है।
- source_word: Ἄνθρωπος ἱερεὺς
  choice: एक पुरुष ... जो याजक ... है
  rationale: ἄνθρωπος यहाँ किसी विशिष्ट पुरुष को सूचित करता है और ἱερεύς उसकी पहचान को समानाधिकरण में बताता है; हिन्दी में संबंधवाचक विन्यास अधिक स्वाभाविक है।
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: हारून के वंश का
  rationale: σπέρμα का मूल अर्थ ‘बीज’ है, पर वंशावली के प्रसंग में यह संतान या वंश को दर्शाता है। ‘वंश’ आधुनिक हिन्दी में स्पष्ट रहते हुए याजकीय वंशक्रम को सुरक्षित रखता है।
- source_word: ἦλθεν
  choice: आया है
  rationale: अओरिस्ट आगमन की पूर्ण घटना बताता है; प्रत्यक्ष कथन में ‘आया है’ उस व्यक्ति की वर्तमान उपस्थिति और उससे उपजे भरोसे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ταῖς δυνάμεσιν
  choice: सेनाओं के साथ
  rationale: बहुवचन δυνάμεις यहाँ सैन्य बलों को सूचित करता है। ‘सेनाओं’ बहुवचन को बनाए रखता है और सैन्य आशय स्पष्ट करता है।
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: वह हमारे साथ अन्याय नहीं करेगा
  rationale: ἀδικέω में अन्याय करने और हानि पहुँचाने दोनों का भाव हो सकता है; ‘अन्याय नहीं करेगा’ नैतिक अर्थ को प्रत्यक्ष रखता है और परिणामगत हानि को नकारता नहीं।
theological_decisions:
- issue: याजकीय वैधता से जुड़ी वंशावली अभिव्यक्ति
  choice: हारून के वंश का
  alternative: हारून के बीज में से / हारून की संतान में से
  rationale: पाठ में भरोसा उस व्यक्ति के हारूनी याजकीय वंश पर आधारित है। ‘वंश’ इस वंशगत दावे को स्पष्ट रखता है, पर कथन की सत्यता या पात्रों के निर्णय की उचितता पर कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
- issue: ἀδικέω में अन्याय और हानि का अर्थ-संबंध
  choice: हमारे साथ अन्याय नहीं करेगा
  alternative: हमें हानि नहीं पहुँचाएगा
  rationale: ‘अन्याय’ यूनानी क्रिया के नैतिक आयाम को सुरक्षित रखता है; पादटिप्पणी व्यावहारिक हानि वाले वैकल्पिक अर्थ को सामने रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य के समानाधिकरण को हिन्दी के स्वाभाविक संबंधवाचक विन्यास में बदला गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
