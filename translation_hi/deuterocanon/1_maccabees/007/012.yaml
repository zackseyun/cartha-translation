    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठा हुआ
  rationale: यह क्रिया एक समुदाय के एकत्र होने को बताती है; हिन्दी में एकवचन सामूहिक कर्ता ‘समूह’ के साथ ‘इकट्ठा हुआ’ स्वाभाविक है।
- source_word: πρὸς
  choice: के पास
  rationale: व्यक्तियों के साथ एकत्र होने की दिशा और उनसे संबंध—दोनों का संकेत देता है; ‘के पास’ यहाँ स्वाभाविक रूप से गमन व्यक्त करता है।
- source_word: συναγωγὴ γραμματέων
  choice: शास्त्रियों का एक समूह
  rationale: συναγωγή यहाँ भवन नहीं, एकत्र समुदाय है; γραμματεῖς यहूदी संदर्भ में शास्त्री हैं।
- source_word: ἐκζητῆσαι
  choice: ताकि ... खोज करे
  rationale: अनन्त क्रिया उद्देश्य बताती है; ‘ताकि’ से यह प्रयोजन हिन्दी में स्पष्ट और सहज बनता है।
- source_word: δίκαια
  choice: न्याय
  rationale: नपुंसकलिंग बहुवचन अभिव्यक्ति नैतिक रूप से उचित बातों और वैधानिक न्याय—दोनों की ओर संकेत कर सकती है; मुख्य पाठ में ‘न्याय’ संक्षिप्त और गरिमापूर्ण है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: Ἄλκιμον
  choice: अलकिमुस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण।
- source_word: Βακχίδην
  choice: बक्खिदेस
  rationale: यूनानी Βακχίδης का निकट देवनागरी लिप्यंतरण, जिसमें χ की महाप्राण ध्वनि और प्रचलित यूनानी अंत सुरक्षित हैं।
theological_decisions:
- issue: राजनीतिक संदर्भ में δίκαια का अर्थ
  choice: न्याय
  alternative: जो उचित है; उचित शर्तें
  rationale: पद स्वयं यह निश्चित नहीं करता कि आशय कानूनी न्याय, न्यायसंगत समझौता अथवा नैतिक उचितता है। ‘न्याय’ के साथ पादटिप्पणी देकर इस अर्थ-विस्तार और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और ऐतिहासिक यहूदी संदर्भ के अनुकूल। ‘समूह’ भवन-संबंधी अर्थ से बचाता है और ‘शास्त्री’ पारंपरिक किंतु आज भी बोधगम्य पद है।
