  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: hi
  text: और शास्त्रियों की एक सभा अल्कीमुस और बक्खिदेस के पास न्याय की खोज करने के लिए इकट्ठी हुई।[a]
