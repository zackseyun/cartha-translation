translation:
  language: hi
  text: और लोग बहुत आनन्दित हुए, और उन्होंने उस दिन को बड़े आनन्द के दिन के रूप में मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐφράνθη
  choice: आनन्दित हुए
  rationale: यह क्रियारूप यहाँ लोगों की हर्षपूर्ण प्रतिक्रिया व्यक्त करता है; ‘आनन्दित हुए’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ὁ λαός
  choice: लोग
  rationale: यूनानी में केवल ‘लोग/जनता’ है; प्रसंग से उनकी पहचान स्पष्ट है, इसलिए ‘इस्राएल के लोग’ जोड़ना उचित नहीं।
- source_word: σφόδρα
  choice: बहुत
  rationale: यह आनन्द की तीव्रता को बढ़ाता है; ‘बहुत’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἦγαγον τὴν ἡμέραν ἐκείνην
  choice: उन्होंने उस दिन को ... के दिन के रूप में मनाया
  rationale: शाब्दिक अर्थ ‘उस दिन को ले गए/बिताया’ है, पर यह मुहावरा किसी दिन को विशेष रूप में मनाने या उसका पालन करने का भाव देता है।
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: बड़े आनन्द के दिन
  rationale: εὐφροσύνη उत्सवपूर्ण हर्ष या आनन्द को दर्शाता है; यह चयन उसी भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
