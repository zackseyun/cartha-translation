  text: और उन्होंने ठहराया कि इस दिन को हर वर्ष अदार महीने के तेरहवें दिन मनाया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: उन्होंने ठहराया
  rationale: इस रचना में ἵστημι का भाव किसी नियमित प्रथा को निश्चित या स्थापित करने का है। ‘ठहराया’ आधुनिक, स्वाभाविक हिन्दी में सामूहिक निर्णय और स्थापना—दोनों का भाव रखता है।
- source_word: τοῦ ἄγειν
  choice: मनाया जाए
  rationale: सव्यय क्रियार्थक संज्ञा यहाँ ठहराए गए वार्षिक पालन का आशय बताती है। ‘मनाया जाए’ किसी स्मरण-दिवस के पालन के लिए सहज हिन्दी है और अनिवार्यतः केवल उत्सवपूर्ण आनंद का अर्थ नहीं देता।
- source_word: κατʼ ἐνιαυτόν
  choice: हर वर्ष
  rationale: यूनानी मुहावरे का अर्थ वार्षिक रूप से है; ‘हर वर्ष’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: τὴν ἡμέραν ταύτην
  choice: इस दिन को
  rationale: ταύτην निकटवाची संकेत देता है; ‘इस दिन’ उसका सीधा और स्वाभाविक अनुवाद है।
- source_word: τῇ τρισκαιδεκάτῃ
  choice: तेरहवें दिन
  rationale: सम्प्रदान कारक यहाँ तिथि बताता है। हिन्दी में ‘दिन’ जोड़ने से अभिव्यक्ति स्पष्ट और स्वाभाविक होती है।
- source_word: τοῦ Ἀδάρ
  choice: अदार महीने के
  rationale: Ἀδάρ महीने का नाम है, इसलिए उसका लिप्यंतरण ‘अदार’ किया गया है; ‘महीने’ जोड़ने से सामान्य पाठक के लिए संदर्भ स्पष्ट होता है।
