  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: hi
  text: और उन्होंने युद्ध की लूट और लूटा हुआ माल ले लिया। फिर उन्होंने नीकानोर का सिर और उसका दाहिना हाथ काट दिया—वही हाथ जिसे उसने घमंड में फैलाया था—और उन्हें ले जाकर यरूशलेम के पास[a] प्रदर्शित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरूशलेम के बगल में।” यूनानी में शाब्दिक रूप से “यरूशलेम के पास/बगल में” है; ठीक स्थान नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: युद्ध की लूट
  rationale: यह शब्द पराजित शत्रु से लिए गए युद्ध-संबंधी माल को सूचित करता है; ‘युद्ध की लूट’ इसे अगले संज्ञा-पद से अलग रखता है।
- source_word: προνομήν
  choice: लूटा हुआ माल
  rationale: यह छीने गए माल या धन-संपत्ति के अर्थ को व्यक्त करता है और σκῦλα के साथ आए दोहरे कथन को बनाए रखता है।
- source_word: ἀφεῖλαν
  choice: काट दिया
  rationale: सिर और दाहिने हाथ के संदर्भ में क्रिया अंग-विच्छेद को सूचित करती है; हिंदी में ‘काट दिया’ स्पष्ट और स्वाभाविक है।
- source_word: δεξιὰν
  choice: दाहिना हाथ
  rationale: यह यूनानी शब्द के सामान्य और निकटतम अर्थ को बनाए रखता है।
- source_word: ἐξέτεινεν
  choice: बढ़ाया था
  rationale: यह पहले किए गए हाथ बढ़ाने के कार्य को वर्तमान कथानक के सापेक्ष स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐν ὑπερηφάνως
  choice: घमंड से
  rationale: यूनानी अभिव्यक्ति कुछ अनियमित है, पर उसका आशय अहंकारी ढंग से है; ‘घमंड से’ उसका नैतिक भाव सुरक्षित रखता है।
- source_word: ἤνεγκαν
  choice: ले जाकर
  rationale: कथानक में काटे गए अंगों को यरूशलेम के निकट लाने का अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐξέτειναν
  choice: सबके सामने प्रदर्शित किया
  rationale: शाब्दिक अर्थ ‘फैला दिया’ है, पर इस प्रसंग में सार्वजनिक रूप से दिखाने या प्रदर्शित करने का आशय है; हिंदी वाक्य में ‘सबके सामने’ इस व्यवहारिक अर्थ को स्पष्ट करता है।
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: यरूशलेम के पास
  rationale: παρά के साथ कर्मकारक यहाँ समीप या बगल में होने का संकेत देता है; यह ठीक स्थान बताए बिना स्थानिक संबंध बनाए रखता है।
theological_decisions:
- issue: नीकानोर के अवशेषों का सार्वजनिक प्रदर्शन
  choice: घटना को ऐतिहासिक विजय और अपमान के वर्णन के रूप में रखा गया है, बिना अतिरिक्त नैतिक टिप्पणी के।
  alternative: स्थान को नगर-द्वार या मंदिर-परिसर मानना, अथवा इस कार्य पर स्पष्ट धार्मिक अनुमोदन या निंदा जोड़ना।
  rationale: पद नीकानोर के घमंड का उल्लेख करता है, पर प्रदर्शन का सटीक स्थान या कोई अतिरिक्त नैतिक व्याख्या नहीं देता; इसलिए अनिर्णीत बातों को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधी ऐतिहासिक कथा। दो अलग यूनानी लूट-संबंधी संज्ञाओं का भेद बनाए रखा गया है। हिंसक कार्रवाई को न तो नरम किया गया है, न सनसनीखेज बनाया गया है।
