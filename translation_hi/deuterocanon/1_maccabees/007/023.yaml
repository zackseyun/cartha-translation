base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: hi
  text: और यहूदा ने वह सारी बुराई देखी जो अलकिमुस और उसके साथियों ने इस्राएल के पुत्रों के बीच की थी—अन्य जातियों से भी बढ़कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गैर-यहूदियों से भी अधिक।” यूनानी वाक्यांश का अर्थ है कि अलकिमुस और उसके साथियों की बुराई आसपास की जातियों की बुराई से भी बढ़कर थी।
    reason: τὰ ἔθνη के लिए प्रासंगिक lexical alternative और ὑπέρ की तुलनात्मक शक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: ἴδεν
  choice: देखी
  rationale: ὁράω के कथात्मक एओरिस्ट का सीधा और स्वाभाविक हिन्दी रूप; यहाँ परिस्थिति को जान लेने का भाव भी समाहित हो सकता है।
- source_word: ἅπαν τὴν κακίαν
  choice: वह सारी बुराई
  rationale: κακία की नैतिक तीव्रता और ἅπαν की समग्रता दोनों को बनाए रखता है।
- source_word: ἐποίησεν
  choice: की थी
  rationale: यह कार्य यहूदा के देखने से पहले हो चुका था; हिन्दी का पूर्ण भूतकाल कथात्मक पूर्वता स्पष्ट करता है।
- source_word: οἱ μετ’ αὐτοῦ
  choice: उसके साथियों
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जो अलकिमुस के सहयोगियों या समर्थकों को सूचित करता है।
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: इस्राएल की संतानों के बीच
  rationale: ἐν के क्षेत्रगत अर्थ ‘के बीच’ और υἱοί की वंशगत अभिव्यक्ति को आधुनिक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: ὑπὲρ τὰ ἔθνη
  choice: अन्य जातियों से भी बढ़कर
  rationale: ὑπέρ के तुलनात्मक और अतिक्रमणकारी भाव को स्पष्ट करता है; τὰ ἔθνη यहाँ इस्राएल से भिन्न आसपास की जातियों को दर्शाता है।
theological_decisions:
- issue: υἱοῖς Ἰσραήλ का अनुवाद
  choice: इस्राएल की संतानों के बीच
  alternative: इस्राएलियों के बीच
  rationale: मूल की वंशगत भाषा को बनाए रखते हुए हिन्दी में ‘पुत्रों’ की अनावश्यक रूप से केवल पुरुषों तक सीमित समझ से बचता है।
- issue: τὰ ἔθνη का अनुवाद
  choice: अन्य जातियों
  alternative: गैर-यहूदियों
  rationale: ‘जातियाँ’ मूल शब्द के सामूहिक राष्ट्रीय अर्थ के निकट है और किसी बाद की पारिभाषिक धार्मिक व्याख्या को आरोपित नहीं करता।
- issue: ὑπὲρ τὰ ἔθνη की तुलना का संबंध
  choice: बुराई की मात्रा/गंभीरता अन्य जातियों से भी बढ़कर थी
  alternative: अलकिमुस और उसके साथियों ने अन्य जातियों से अधिक बुराई की
  rationale: वाक्य-संरचना तुलना को संक्षेप में रखती है; अर्थ यही है कि उनका किया हुआ दुष्कर्म आसपास की जातियों के दुष्कर्म से बढ़ गया, पर मूल की अल्पोक्ति और तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली। ‘अलकिमुस’ यूनानी नाम का निकट देवनागरी लिप्यंतरण है। डैश अंतिम तुलनात्मक पद की तीव्रता और उसके कुछ संक्षिप्त मूल-वाक्य विन्यास को बनाए रखता है।
