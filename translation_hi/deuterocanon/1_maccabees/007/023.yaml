  terminology: “बुराई,” “जातियाँ,” and “अलकिमुस” are suitable. “अन्य जातियों” appropriately represents τὰ ἔθνη in this context. A footnote anchor is supplied for the viable alternative “गैर-यहूदी,” corresponding to the English audit trail.
