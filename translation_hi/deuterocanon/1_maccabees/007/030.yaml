  yaml_path: translation/deuterocanon/1_maccabees/007/030.yaml
  text: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
translation:
  language: hi
  text: यह बात यहूदा को मालूम हो गई[a] कि वह छल से उसके विरुद्ध आया था। तब यहूदा उससे भयभीत हो गया और फिर उसका मुँह देखना नहीं चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह समाचार यहूदा को मालूम हो गया।”
    reason: λόγος का अर्थ प्रसंग में ‘बात’ या ‘समाचार’ दोनों हो सकता है; टिप्पणी इस वास्तविक शब्दार्थ-विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: ἐγνώσθη
  choice: मालूम हो गई
  rationale: 'यूनानी का कर्मवाच्य भाव सुरक्षित रहता है: सूचना यहूदा तक पहुँची, पर किसी अज्ञात सूचक को प्रमुख नहीं बनाया गया।'
- source_word: ὁ λόγος
  choice: यह बात
  rationale: यहाँ λόγος किसी एक बोले हुए ‘शब्द’ के बजाय षड्यंत्र से जुड़ी सूचना या बात को सूचित करता है; आधुनिक हिन्दी में ‘यह बात’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: μετὰ δόλου
  choice: छल से
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है, जो कपट का अर्थ देता है पर अधिक प्रबल ‘विश्वासघात’ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: उसके विरुद्ध आया था
  rationale: इस शत्रुतापूर्ण प्रसंग में ἐπί का आशय केवल उसकी ओर आना नहीं, बल्कि उसके विरुद्ध आना है; ‘आया था’ सूचना मिलने से पहले की घटना को स्पष्ट करता है।
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: उससे भयभीत हो गया
  rationale: ἐπτοήθη घबराहट या भय को व्यक्त करता है और ἀπ’ αὐτοῦ उसके स्रोत को; यह रूप अर्थ को स्वाभाविक हिन्दी में समेटता है, बिना ‘आतंकित’ जैसे अधिक तीव्र शब्द के।
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: फिर ... नहीं चाहा
  rationale: यह उस समय से आगे की अनिच्छा या निश्चय को व्यक्त करता है; हिन्दी में ‘फिर ... नहीं चाहा’ सहज है।
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: उसका मुँह देखना
  rationale: यूनानी के ‘उसका मुख देखना’ मुहावरे को बनाए रखता है; ‘मुँह देखना’ आधुनिक हिन्दी में व्यक्तिगत भेंट से इनकार का स्वाभाविक भाव देता है।
