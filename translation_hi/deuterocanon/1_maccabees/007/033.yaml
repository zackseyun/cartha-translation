  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: hi
  text: इन बातों के बाद निकानोर सिय्योन पर्वत पर चढ़ गया, और पवित्रस्थान से कुछ याजक तथा प्रजा के पुरनियों में से कुछ लोग उसका शांतिपूर्वक अभिवादन करने और उसे वह होमबलि दिखाने के लिए बाहर आए, जो राजा के लिए चढ़ाई जा रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβη
  choice: चढ़ गया
  rationale: ऊँचे स्थान की ओर जाने की सामान्य गति को व्यक्त करता है और सिय्योन पर्वत के संदर्भ में स्वाभाविक है।
- source_word: τὸ ὄρος Σιών
  choice: सिय्योन पर्वत
  rationale: स्थान-नाम का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: ἐξῆλθαν
  choice: बाहर आए
  rationale: पवित्रस्थान के भीतर से निकलकर निकानोर की ओर आने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: कुछ याजक और प्रजा के पुरनियों में से कुछ लोग
  rationale: दोहराया गया ἀπό संभवतः अंशवाचक है; इसलिए प्रतिनिधियों के आने का अर्थ रखा गया है, सभी याजकों और पुरनियों का नहीं।
- source_word: ἐκ τῶν ἁγίων
  choice: पवित्रस्थान में से
  rationale: इस प्रसंग में बहुवचन τὰ ἅγια मंदिर के पवित्र स्थान या परिसर को सूचित करता है; हिन्दी में 'पवित्रस्थान' संक्षिप्त और संदर्भानुकूल है।
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: उससे शांतिपूर्वक मिलने
  rationale: ἀσπάζομαι के अभिवादन या भेंट करने और εἰρηνικῶς के शांतिपूर्ण ढंग या आशय—दोनों को सहज हिन्दी में रखता है।
- source_word: δεῖξαι αὐτῷ
  choice: उसे ... दिखाने
  rationale: उद्देश्यसूचक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: τὴν ὁλοκαύτωσιν
  choice: होमबलि
  rationale: पूरी तरह जलाकर चढ़ाए जाने वाले बलिदान के लिए प्रचलित बाइबिलीय हिन्दी पद।
- source_word: τὴν προσφερομένην
  choice: जो ... चढ़ाई जा रही थी
  rationale: वर्तमान कृदंत की जारी बलिदानी क्रिया को हिन्दी की अपूर्ण प्रगतिशील रचना से व्यक्त करता है।
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: राजा के लिए
  rationale: राजा की ओर से या उसके हित के लिए चढ़ाए जाने का व्यापक संबंध बनाए रखता है, बिना उसे अधिक निश्चित किए।
