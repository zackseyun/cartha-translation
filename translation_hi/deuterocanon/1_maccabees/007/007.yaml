  register: आधुनिक मानक हिन्दी, आदरसूचक राजकीय सम्बोधन और गरिमापूर्ण किंतु सरल शब्दावली अपनाई गई है। मूल यूनानी के एकवचन ‘उसने’ तथा बहुवचन ‘उन्हें/उनकी’ के तनाव को स्पष्ट किए बिना ज्यों का त्यों रखा गया है।
