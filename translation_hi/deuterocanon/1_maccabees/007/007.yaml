translation:
  language: hi
  text: इसलिए अब एक ऐसे आदमी को भेजिए जिस पर आपको भरोसा हो। वह जाकर उस पूरे विनाश को देखे जो उसने हम पर और राजा के देश पर ढाया है, और वह उन्हें तथा उन सभी को दंड दे जो उनकी सहायता कर रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστειλον
  choice: भेजिए
  rationale: आज्ञार्थक क्रिया को स्वाभाविक आदरसूचक हिन्दी में व्यक्त करता है, क्योंकि वक्ता राजा को सम्बोधित कर रहे हैं।
- source_word: ἄνδρα ᾧ πιστεύεις
  choice: किसी ऐसे पुरुष को जिस पर आपको भरोसा हो
  rationale: मूल के सम्बन्धवाचक वाक्य और राजा द्वारा उस व्यक्ति पर किए गए भरोसे, दोनों को स्पष्ट रखता है।
- source_word: πορευθεὶς ἰδέτω
  choice: वह जाकर ... देखे
  rationale: कृदन्त और आज्ञार्थक क्रिया के क्रम को सहज हिन्दी में रखता है, बिना ‘निरीक्षण’ का अतिरिक्त भाव जोड़े।
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: उस सारे विनाश को
  rationale: ἐξολέθρευσις के प्रबल विनाश-बोध और ἅπασαν की समग्रता को सुरक्षित रखता है।
- source_word: ἣν ἐποίησεν ἡμῖν καὶ τῇ χώρᾳ τοῦ βασιλέως
  choice: जो उसने हमारा और राजा के देश का किया है
  rationale: हानि या विनाश ‘करने’ की हिन्दी अभिव्यक्ति के द्वारा दोनों कर्म-सम्बन्धों—हमारा और राजकीय भूभाग का—को मूल के अनुसार बनाए रखता है।
- source_word: κολάσατο
  choice: वह ... दण्ड दे
  rationale: दण्डात्मक कार्रवाई को तटस्थ रूप से व्यक्त करता है; ‘बदला ले’ जैसा अधिक तीखा अर्थ नहीं जोड़ता।
- source_word: τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: उन सभी को ... जो उनकी सहायता कर रहे हैं
  rationale: वर्तमान कृदन्त की जारी सहायता और πάντας की समग्रता दोनों को व्यक्त करता है, सहायता को केवल सैनिक सहयोग तक सीमित नहीं करता।
