  yaml_path: translation/deuterocanon/1_maccabees/007/036.yaml
  text: “I will burn this house.” And he went out in anger[a]. Then the priests entered and stood before the altar and the sanctuary, and they wept and said[b],
translation:
  language: hi
  text: “मैं इस भवन को आग लगा दूँगा।”[a] फिर वह क्रोध में बाहर चला गया। तब याजक भीतर आए और वेदी तथा पवित्रस्थान के सामने खड़े हो गए। वे रोए और बोले,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस मंदिर को।” यूनानी में शाब्दिक रूप से “इस घर को” है; मंदिर के लिए “घर” कहना सामान्य था।
    reason: lexical_alternative
  - marker: b
    text: यह आयत “और बोले” पर समाप्त होती है; इससे आरम्भ होने वाली प्रार्थना या वाणी अगली आयत में जारी रहती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐμπυριῶ
  choice: आग लगा दूँगा
  rationale: यह भविष्यकालीन क्रिया आग लगाने की धमकी व्यक्त करती है। यह सहज हिन्दी है और ‘जलाकर राख कर दूँगा’ जैसे परिणाम को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τὸν οἶκον τοῦτον
  choice: इस भवन को
  rationale: οἶκος का मूल अर्थ ‘घर’ है, पर यहाँ मंदिर का भवन अभिप्रेत है। ‘भवन’ मूल रूपक को बनाए रखते हुए हिन्दी में मंदिर-संदर्भ के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: μετὰ θυμοῦ
  choice: क्रोध में
  rationale: यह वाक्यांश व्यक्ति की क्रोधित मनःस्थिति बताता है; ‘क्रोध में’ आधुनिक मानक हिन्दी में सीधा और स्वाभाविक है।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: मंदिर में धार्मिक सेवा करने वाले पुरोहितों के लिए यह मानक बाइबलीय हिन्दी पद है।
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: के सामने खड़े हो गए
  rationale: यूनानी मुहावरे का अर्थ किसी वस्तु के सम्मुख खड़ा होना है; यह हिन्दी रूप अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ θυσιαστηρίου
  choice: वेदी
  rationale: बलि अथवा धार्मिक अर्पण की वेदी के लिए मानक हिन्दी शब्द।
- source_word: τοῦ ναοῦ
  choice: पवित्रस्थान
  rationale: ναός यहाँ व्यापक मंदिर-परिसर के बजाय मंदिर के पवित्र भवन अथवा भीतरी पवित्रस्थान को सूचित करता है। ‘पवित्रस्थान’ इसे पहले आए οἶκος (‘भवन’) से अलग रखता है।
- source_word: ἔκλαυσαν
  choice: वे रोए
  rationale: सरल कथात्मक क्रिया है, जो उनके वास्तविक रोने को बिना अतिरिक्त व्याख्या के व्यक्त करती है।
- source_word: εἶπαν
  choice: बोले
  rationale: आगे आने वाली प्रत्यक्ष वाणी का स्वाभाविक हिन्दी परिचय; अंतिम अल्पविराम दिखाता है कि कथन अगली आयत में जारी है।
