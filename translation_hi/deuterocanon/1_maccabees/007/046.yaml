base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/046.yaml
  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
translation:
  language: hi
  text: तब यहूदिया के चारों ओर के सभी गाँवों से लोग निकल आए और उन पर सामरिक बढ़त पा ली[a]। फिर वे उनकी ओर पलट गए[b]; वे सब तलवार से मारे गए, और उनमें से एक भी न बचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया असामान्य है; इसका अर्थ “उन्हें चारों ओर से घेर लिया” या “उन पर सामरिक बढ़त पा ली” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी में शाब्दिक क्रम संक्षिप्त और कुछ असहज है: “ये इनकी ओर पलटे।” प्रसंग में दोनों सर्वनामों के ठीक-ठीक संदर्भ निहित छोड़ दिए गए हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: निकल आए
  rationale: यह सामान्य कथात्मक क्रिया गाँवों से बाहर आने को बताती है; ‘निकल आए’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में निहित लोगों को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: κωμῶν
  choice: गाँवों
  rationale: κώμη सामान्यतः नगर के बजाय गाँव या छोटी बस्ती को दर्शाता है; ‘गाँव’ स्पष्ट और प्रचलित शब्द है।
- source_word: κυκλόθεν
  choice: चारों ओर के
  rationale: यहाँ यह पद आसपास या हर ओर स्थित गाँवों की ओर संकेत कर सकता है और साथ ही युद्ध-दृश्य में चारों ओर से आने की छाया रखता है।
- source_word: ὑπερεφέρων
  choice: उन पर हावी हो गए
  rationale: इस प्रसंग में रूप और अर्थ कुछ असामान्य हैं। यह चुनाव सामरिक बढ़त या दबाव को व्यक्त करता है, पर ‘पूरी तरह घेर लिया’ जैसी अधिक निश्चित व्याख्या नहीं थोपता।
- source_word: ἀνέστρεφον
  choice: पलटकर … हुए
  rationale: क्रिया लौटने, मुड़ने या पलटने का भाव रखती है। यह अनुवाद पीछे हटने अथवा दिशा बदलने में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: οὗτοι πρὸς τούτους
  choice: वे … उनकी ओर
  rationale: यूनानी में दोनों संकेतवाचक सर्वनामों के संदर्भ संक्षिप्त और कुछ अस्पष्ट हैं। हिन्दी में सर्वनाम रखकर उसी वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: वे सब तलवार से मारे गए
  rationale: यह युद्ध में तलवार से गिराए जाने का प्रचलित मुहावरा है; आधुनिक हिन्दी में ‘मारे गए’ उसका अर्थ स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: उनमें से एक भी न बचा
  rationale: यह संक्षिप्त हिन्दी यूनानी के प्रबल निषेध और पूर्ण विनाश के बल को बनाए रखती है।
