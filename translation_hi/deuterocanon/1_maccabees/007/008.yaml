  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
translation:
  language: hi
  text: और राजा ने बक्खीदेस को चुना, जो ‘राजा के मित्रों’[a] में से एक था, नदी[b] के पार के प्रदेश पर अधिकार रखता था, राज्य में प्रतिष्ठित था और राजा के प्रति निष्ठावान था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजा के मित्र’ सम्भवतः हेलेनिस्तानी शासन-व्यवस्था में राजकीय सलाहकारों या दरबारियों के किसी आधिकारिक पद अथवा मान्य वर्ग को दर्शाता है, केवल व्यक्तिगत मित्रता को नहीं।
    reason: cultural_note
  - marker: b
    text: ‘नदी के पार’ एक प्रादेशिक पदनाम है। यहाँ नदी से सम्भवतः फरात नदी और ‘पार’ से साम्राज्य के दृष्टिकोण से उसका पश्चिमी क्षेत्र अभिप्रेत है; वैकल्पिक रूप से इसका अर्थ केवल ‘नदी के पार’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: यह क्रिया सीधे चुनने या चयन करने को व्यक्त करती है; ‘नियुक्त किया’ संदर्भतः संभव है, पर यूनानी पाठ से अधिक व्याख्यात्मक होगा।
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: ‘राजा के मित्रों’ में से एक
  rationale: षष्ठी बहुवचन का अंशवाचक अर्थ रखा गया है। उद्धरण-चिह्न संकेत करते हैं कि ‘मित्र’ हेलेनिस्तानी राजदरबार में संभवतः एक मान्य पद या दरबारी वर्ग था, केवल निजी मित्रता नहीं।
- source_word: κυριεύοντα
  choice: शासन करता था
  rationale: कृदंत बक्खीदेस के किसी भूभाग पर अधिकार और शासन को बताता है। इसे ‘शासक था’ कहना संभव है, पर ‘शासन करता था’ यूनानी क्रियात्मक रूप को बनाए रखता है और औपचारिक पदवी अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: महानद के पार के प्रदेश पर
  rationale: यह संभवतः फरात के पश्चिम के एक प्रशासनिक भूभाग का नाम है। ‘प्रदेश’ जोड़ने से आधुनिक पाठक इसे केवल दिशासूचक वाक्यांश न समझकर क्षेत्रीय अधिकार के रूप में ग्रहण कर सकता है।
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: राज्य में बड़ा था
  rationale: ‘बड़ा’ यहाँ शारीरिक आकार के बजाय प्रतिष्ठा, पद या प्रभाव का संकेत देता है। निकट रूपांतरण मूल की व्यापकता बनाए रखता है और किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: πιστὸν τῷ βασιλεῖ
  choice: राजा के प्रति निष्ठावान था
  rationale: राजनीतिक संदर्भ में πιστός राजा के प्रति विश्वसनीयता और वफादारी व्यक्त करता है; ‘निष्ठावान’ आधुनिक और गरिमापूर्ण हिन्दी में दोनों भावों को स्वाभाविक रूप से पहुँचाता है।
- source_word: Βακχίδην
  choice: बक्खीदेस
  rationale: यह विभक्तियुक्त यूनानी रूप Βακχίδης नाम का कर्मकारक है; हिन्दी में नाम को उसके प्रथमार्थक रूप के निकट लिप्यंतरित किया गया है।
