lexical_decisions:
- source_word: ἔγραψεν
  choice: लिखकर
  rationale: γράϕω के एओरिस्ट का मूल अर्थ ‘लिखा’ है। अगले समापिका क्रिया-रूप के साथ स्वाभाविक हिन्दी वाक्य बनाने के लिए इसे पूर्वकालिक कृदंत ‘लिखकर’ से व्यक्त किया गया है।
- source_word: ἐπιστολὰς
  choice: पत्र
  rationale: यूनानी रूप कर्मकारक बहुवचन है। हिन्दी में ‘पत्र’ का रूप एकवचन और बहुवचन में समान हो सकता है; इसलिए बहुवचन की स्रोत-सूचना पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: ἀποστέλλω के एओरिस्ट का सीधा और स्वाभाविक हिन्दी अनुवाद ‘भेजे’ है; बहुवचन कर्म ‘पत्र’ के अनुसार यह रूप उपयुक्त है।
- source_word: αὐτῷ
  choice: उसके पास
  rationale: पुल्लिंग दत्तिवाचक सर्वनाम का अर्थ ‘उसे/उसके पास’ है। पत्र भेजने के प्रसंग में ‘उसके पास’ स्वाभाविक है और स्रोत की तरह व्यक्ति का नाम नहीं जोड़ता।
