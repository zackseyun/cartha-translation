  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
translation:
  language: hi
  text: और ऐसा हुआ कि जब राजा सिकन्दर ने ये बातें सुनीं, तो उसने योनातान का और भी अधिक सम्मान किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: और ऐसा हुआ कि जब
  rationale: यह कथात्मक सूत्र प्रसंग में अगले घटनाक्रम की ओर संक्रमण दिखाता है। हिन्दी में यह रूप यूनानी संरचना को पर्याप्त रूप से बनाए रखते हुए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἤκουσεν
  choice: सुनीं
  rationale: ἀκούω का सामान्य प्रत्यक्ष अर्थ यहाँ ‘सुनना’ है; ‘पता चला’ कहना अधिक व्याख्यात्मक होता।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι का शाब्दिक अर्थ ‘शब्द/कथन’ है, पर इस सन्दर्भ में आधुनिक हिन्दी का ‘ये बातें’ अधिक स्वाभाविक है और सुने गए कथनों का भाव बनाए रखता है।
- source_word: προσέθετο δοξάσαι
  choice: और भी अधिक सम्मान किया
  rationale: προστίθημι के साथ infinitive यहाँ पहले से दिए जा रहे सम्मान में वृद्धि या आगे बढ़ने का भाव रखता है। ‘और भी अधिक सम्मान किया’ इस संयुक्त अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν Ἰωναθάν
  choice: योनातान
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है; यूनानी article का पृथक अनुवाद आवश्यक नहीं है।
