base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/023.yaml
  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: hi
  text: वह दुखी हुआ और बोला, “हमने यह क्या किया कि सिकंदर अपने समर्थन के लिए यहूदियों की मित्रता प्राप्त करने में[a] हमसे पहले निकल गया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों की मित्रता प्राप्त करके उनका समर्थन पाने में।”
    reason: εἰς στήριγμα को मुख्य पाठ में ‘मित्रता’ के समर्थन का साधन होने के अर्थ में लिया गया है; वैकल्पिक रूप में इसे यहूदियों से मिलने वाले समर्थन के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: ἐλυπήθη
  choice: वह दुखी हुआ
  rationale: यह रूप भावनात्मक पीड़ा या खिन्नता व्यक्त करता है; ‘दुखी हुआ’ गंभीरता बनाए रखते हुए भाव को अनावश्यक रूप से तीखा नहीं करता।
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: हमने यह क्या किया
  rationale: यूनानी वाक्य की आत्म-भर्त्सना और ‘यह’ पर दिए गए बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προέφθακεν ἡμᾶς
  choice: हमसे पहले निकल गया
  rationale: प्रोफ्थानो का अर्थ किसी से पहले पहुँच जाना या उससे आगे निकल जाना है; यह राजनीतिक होड़ के प्रसंग में सहज हिन्दी है।
- source_word: φιλίαν
  choice: मित्रता
  rationale: मूल अर्थ ‘मित्रता’ या ‘मैत्रीपूर्ण संबंध’ है। प्रसंग में राजनीतिक गठबंधन का भाव निहित है, पर ‘मित्रता’ मूल की व्यापकता बनाए रखती है।
- source_word: καταλαβέσθαι
  choice: मित्रता करने में
  rationale: मध्यवाच्य क्रिया यहाँ अपने लिए मित्रता प्राप्त करने या स्थापित करने का भाव देती है; हिन्दी में ‘मित्रता करने’ से यह बात सहज रूप में व्यक्त होती है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों से
  rationale: φιλίαν के साथ संबंधसूचक भाव है—यहूदियों के साथ/से मित्रता।
- source_word: εἰς στήριγμα
  choice: अपने सहारे के लिए
  rationale: στήριγμα सहारा, समर्थन या मजबूती देने वाले साधन को दर्शाता है। इस राजनीतिक प्रसंग में ‘अपने सहारे के लिए’ उद्देश्य और संभावित समर्थन दोनों को व्यक्त करता है।
