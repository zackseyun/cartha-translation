  yaml_path: translation/deuterocanon/1_maccabees/010/078.yaml
  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: hi
  text: और उसने अशदोद तक उसका पीछा किया, और सेनाएँ उसके पीछे युद्ध में भिड़ गईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सेनाएँ’ का शाब्दिक अर्थ ‘छावनियाँ’ है। ‘उसके पीछे’ का अनुवाद ‘उसका पीछा करते हुए’ भी हो सकता है।
    reason: मूल यूनानी में αἱ παρεμβολαὶ और ὀπίσω αὐτοῦ की छवि तथा स्थानगत/गतिशील अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: उसका पीछा किया
  rationale: सैन्य प्रसंग में κατεδίωξεν सक्रिय रूप से पीछा करने को दर्शाता है। ὀπίσω αὐτοῦ के साथ इसका स्वाभाविक आधुनिक हिन्दी रूप ‘उसका पीछा किया’ है।
- source_word: εἰς Ἄζωτον
  choice: अशदोद तक
  rationale: εἰς यहाँ नगर की ओर और पीछा किए जाने की सीमा तक गति दर्शाता है। Ἄζωτος बाइबिल के अशदोद नगर का यूनानी नाम है, इसलिए हिन्दी में प्रचलित बाइबिलीय नाम ‘अशदोद’ रखा गया है।
- source_word: συνῆψαν … εἰς πόλεμον
  choice: युद्ध में भिड़ गईं
  rationale: सैन्य प्रसंग में συνάπτω और εἰς πόλεμον का संयुक्त अर्थ युद्ध में आमने-सामने भिड़ना है। यह रूप संक्षिप्त, स्वाभाविक और मार्शल भाव को बनाए रखता है।
- source_word: αἱ παρεμβολαὶ
  choice: सेनाएँ
  rationale: παρεμβολή का शाब्दिक अर्थ ‘छावनी’ हो सकता है, पर बहुवचन में युद्ध करती हुई छावनियाँ उनसे संबद्ध सैन्य दलों, अर्थात सेनाओं, को सूचित करती हैं। मुख्य पाठ में ‘सेनाएँ’ सामान्य हिन्दी पाठक के लिए स्पष्ट है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ὀπίσω αὐτοῦ
  choice: उसके पीछे
  rationale: दूसरी बार आया वाक्यांश स्थानगत ‘उसके पीछे’ और गतिशील ‘उसका पीछा करते हुए’—दोनों अर्थ दे सकता है। मुख्य पाठ अधिक शाब्दिक स्थानगत अर्थ रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
