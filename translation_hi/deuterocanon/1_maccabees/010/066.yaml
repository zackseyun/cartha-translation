lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आया
  rationale: यरूशलेम की ओर वापस जाने का भाव है; हिन्दी कथा-शैली में “लौट आया” स्वाभाविक रूप से वापसी को व्यक्त करता है।
- source_word: Ἰωνάθαν
  choice: योनातान
  rationale: बाइबलीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: εἰς Ἱερουσαλήμ
  choice: यरूशलेम
  rationale: εἰς के दिशार्थ को हिन्दी क्रिया “लौट आया” और स्थान के प्रयोग से स्वाभाविक रूप में व्यक्त किया गया है; यरूशलेम स्थान-नाम का प्रचलित हिन्दी रूप है।
- source_word: μετʼ εἰρήνης
  choice: शान्ति के साथ
  rationale: μετά के साहचर्य भाव को बनाए रखता है और सुरक्षित, निर्विघ्न वापसी की अवस्था भी व्यक्त कर सकता है।
- source_word: εὐφροσύνης
  choice: आनन्द
  rationale: यह संज्ञा हर्ष, प्रसन्नता या आनन्द को दर्शाती है; “आनन्द” आधुनिक, गरिमापूर्ण और सामान्य हिन्दी में सहज है।
