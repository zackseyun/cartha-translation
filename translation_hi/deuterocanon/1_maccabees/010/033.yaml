base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: hi
  text: और यहूदा देश से बंदी बनाकर मेरे राज्य के किसी भी भाग में ले जाए गए प्रत्येक यहूदी व्यक्ति को मैं बिना कोई दाम लिए स्वतंत्र करता हूँ; और सभी लोग उन पर और उनके पशुओं पर लगने वाले कर माफ़ करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ विशेष रूप से उनके पशुओं पर लगाए गए कर हो सकता है; इसे अधिक व्यापक अर्थ में उन लोगों के कर तथा उनकी संपत्ति या पशुधन से जुड़ी देनदारियाँ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: प्रत्येक यहूदी व्यक्ति
  rationale: प्रशासनिक संदर्भ में ψυχή का अर्थ आंतरिक ‘प्राण’ नहीं, बल्कि ‘व्यक्ति’ है; ‘प्रत्येक’ πᾶσαν की वितरणात्मक शक्ति बनाए रखता है।
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: बंदी बनाकर ... ले जाए गए
  rationale: कृदंत पहले बंदी बनाए जाने और उसके परिणामस्वरूप बनी अवस्था को व्यक्त करता है; हिंदी में यह रूप स्वाभाविक है और अगले दिशासूचक वाक्यांश से सहजता से जुड़ता है।
- source_word: ἀπὸ γῆς Ἰούδα
  choice: यहूदा देश से
  rationale: γῆ का अर्थ यहाँ ‘देश/भूमि’ है; ‘यहूदा’ को बनाए रखना यूनानी शब्दावली के निकट है।
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: मेरे राज्य के किसी भी भाग में
  rationale: यह वाक्यांश राजा के पूरे अधिकार-क्षेत्र में कहीं भी पहुँचाए जाने का वितरणात्मक भाव देता है, न कि अमूर्त ‘राजत्व’ का।
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: मैं बिना कोई दाम लिए स्वतंत्र करता हूँ
  rationale: ἀφίημι ἐλευθέραν मुक्ति देने को और δωρεάν बिना मूल्य या फिरौती लिए ऐसा करने को व्यक्त करता है।
- source_word: πάντες ἀφιέτωσαν
  choice: सभी लोग ... माफ़ करें
  rationale: राजकीय आदेश के वित्तीय संदर्भ में ἀφίημι देयता छोड़ देने या माफ़ करने का संकेत देता है; ‘माफ़ करें’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: τοὺς φόρους
  choice: कर
  rationale: φόροι राजस्व के रूप में देय कर या लगान हैं; आधुनिक पाठक के लिए ‘कर’ सबसे स्पष्ट और व्यापक शब्द है।
- source_word: κτηνῶν αὐτῶν
  choice: उनके पशुओं पर लगने वाले
  rationale: κτῆνος पालतू पशुधन या भार ढोने वाले पशु को सूचित करता है। कर-संदर्भ में संबंधवाचक रूप को पशुओं पर लगने वाले कर के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
