base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: hi
  text: तब राजा ने उन्हें आज्ञा दी[a]। उन्होंने योनातान के वस्त्र उतारकर उसे बैंगनी वस्त्र पहनाए[b], और उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजा ने उन्हें आज्ञा दी’ के बाद यूनानी पाठ में ‘वस्त्र उतारे’ और ‘पहनाया’ वाली क्रियाएँ एकवचन में हैं; प्रसंग का आशय यह है कि सेवकों ने राजा की आज्ञा पूरी की।
    reason: textual_variant
  - marker: b
    text: इस राजदरबारी प्रसंग में ‘बैंगनी वस्त्र’ राजकीय या ऊँचे पद का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने को व्यक्त करती है। राजदरबार के प्रसंग में ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐξέδυσεν
  choice: उन्होंने ... के वस्त्र उतारकर
  rationale: यूनानी क्रिया एकवचन है, पर उससे पहले ‘उन्हें’ और अंत में बहुवचन ‘उन्होंने वैसा ही किया’ से संकेत मिलता है कि राजा के सेवकों ने उसकी आज्ञा पूरी की। हिंदी में बहुवचन रखने से आशय स्पष्ट और स्वाभाविक रहता है; व्याकरणिक असंगति पादटिप्पणी में बताई गई है।
- source_word: ἱμάτια
  choice: वस्त्र
  rationale: यह कपड़ों के लिए सामान्य शब्द है। ‘वस्त्र’ दरबारी प्रसंग के अनुरूप गरिमापूर्ण है और ‘राजकीय चोगे’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ἐνέδυσεν αὐτὸν πορφύραν
  choice: उसे बैंगनी वस्त्र पहनाए
  rationale: यूनानी में शाब्दिक रूप से उसे ‘बैंगनी’ पहनाने की बात है, जहाँ रंग से उस रंग का परिधान अभिप्रेत है। हिंदी में ‘बैंगनी वस्त्र’ अर्थ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ἐποίησαν οὕτως
  choice: उन्होंने वैसा ही किया
  rationale: यह राजा की आज्ञा के पालन का सीधा और स्वाभाविक सार-वाक्य है।
