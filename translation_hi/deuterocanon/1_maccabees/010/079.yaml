lexical_decisions:
- source_word: ἀπέλειπεν
  choice: रखा था
  rationale: अपूर्ण भूतकाल के भाव को व्यक्त करता है कि अपोल्लोनियुस ने उस दल को पीछे छोड़कर रखा था।
- source_word: χιλίαν ἵππον
  choice: एक हज़ार घुड़सवारों को
  rationale: यहाँ एकवचन ἵππον सामूहिक अर्थ में अश्वारोही सेना को सूचित करता है; प्रसंगानुकूल सहज हिन्दी में ‘घुड़सवार’ चुना गया।
- source_word: κρυπτῶς
  choice: छिपाकर
  rationale: गुप्त ढंग से पीछे रखे जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और घात की स्थिति को बिना अतिरिक्त विवरण जोड़े बनाए रखता है।
- source_word: κατόπισθεν αὐτῶν
  choice: उनके पीछे
  rationale: यूनानी पदबंध के स्थानिक अर्थ का सीधा और स्वाभाविक अनुवाद।
