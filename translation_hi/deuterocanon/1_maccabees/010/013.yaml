translation:
  language: hi
  text: और हर एक ने अपना स्थान छोड़ दिया और अपने देश को चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: छोड़ दिया
  rationale: यहाँ क्रिया किसी स्थान को पीछे छोड़ने का सीधा वर्णन करती है; ‘छोड़ दिया’ स्वाभाविक है और ‘त्याग दिया’ जैसी अधिक प्रबल धारणा नहीं जोड़ता।
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह प्रत्येक व्यक्ति पर अलग-अलग लागू होने वाले भाव को स्पष्ट रखता है और यूनानी से अधिक लैंगिक विशिष्टता नहीं जोड़ता।
- source_word: τὸν τόπον αὐτοῦ
  choice: अपना स्थान
  rationale: τόπος का मूल और व्यापक अर्थ ‘स्थान’ है। प्रसंग में इसका अर्थ चौकी या पद हो सकता है, पर ‘स्थान’ उस संभावित अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह वर्तमान स्थान से दूर जाने की गति को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: अपने देश को
  rationale: γῆ यहाँ प्रत्येक व्यक्ति की अपनी भूमि या गृह-प्रदेश को सूचित करता है। ‘देश’ आधुनिक हिन्दी में सहज है, जबकि ‘अपने’ αὐτοῦ के संबंधसूचक भाव को स्पष्ट करता है।
