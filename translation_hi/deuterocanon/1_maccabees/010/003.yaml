- source_word: λόγοις εἰρηνικοῖς
  choice: शांतिपूर्ण शब्दों में
  rationale: यह पदबंध पत्रों की भाषा या विषयवस्तु का स्वरूप बताता है और λόγοις तथा εἰρηνικοῖς, दोनों की शाब्दिक शक्ति बनाए रखता है।
- source_word: ὥστε
  choice: ताकि
  rationale: इस प्रसंग में यह देमेत्रियुस के अभिप्राय को व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में उद्देश्य को सहज रूप से प्रकट करता है।
- source_word: μεγαλῦναι
  choice: प्रतिष्ठित करे
  rationale: मूल अर्थ ‘बड़ा करना’ है; राजनीतिक प्रसंग में आशय योनातान का मान या दर्जा बढ़ाना है। ‘प्रतिष्ठित करे’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी नाम का देवनागरी में निकट और सुसंगत लिप्यंतरण।
- source_word: Ἰωναθὰν
  choice: योनातान
  rationale: बाइबलीय नाम का प्रचलित हिन्दी रूप, जो यूनानी रूप के पीछे स्थित सेमिटिक नाम से भी मेल खाता है।
