base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: hi
  text: और एक सौ साठवें वर्ष[a] में अन्तियोकुस एपिफ़ानेस का पुत्र सिकन्दर चढ़ आया और उसने पतुलमैस पर अधिकार कर लिया[b]। उन्होंने उसे स्वीकार किया, और वह वहीं राजा बन गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सेल्यूकिड संवत् का 160वाँ वर्ष, लगभग 153–152 ईसा-पूर्व।
    reason: chronology
  - marker: b
    text: या “पतुलमैस को अपने कब्ज़े में ले लिया”; यूनानी क्रिया नगर पर नियंत्रण पाने का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: या “वहाँ राज्य करने लगा”; यूनानी क्रिया का अर्थ राजा बनना या राजा के रूप में शासन करना, दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: एक सौ साठवें वर्ष में
  rationale: यह यूनानी काल-सूत्र का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: ἀνέβη
  choice: चढ़ आया
  rationale: यह यूनानी के दिशासूचक मुहावरे को बनाए रखता है और सैन्य आगे बढ़ने के प्रसंग में स्वाभाविक है।
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: अन्तियोकुस एपिफ़ानेस का पुत्र
  rationale: लेखयुक्त संबंधकारक पद यहाँ वंश-संबंध बताता है; राजकीय उपनाम को प्रचलित नाम के रूप में लिप्यंतरित किया गया है।
- source_word: κατελάβετο
  choice: अधिकार कर लिया
  rationale: यह नगर को अपने नियंत्रण में लेने का भाव व्यक्त करता है, पर अनावश्यक रूप से यह तय नहीं करता कि वह युद्ध द्वारा जीता गया था।
- source_word: ἐπεδέξαντο αὐτόν
  choice: वहाँ के लोगों ने उसे स्वीकार किया
  rationale: बहुवचन कर्ता हिन्दी में स्पष्ट किया गया है; ‘स्वीकार किया’ राजनीतिक मान्यता और स्वागत, दोनों संभावनाओं को खुला रखता है।
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: वह वहीं राजा बन गया
  rationale: घटनाक्रम में अओरिस्ट क्रिया राजपद ग्रहण करने का आरम्भिक भाव दे सकती है; विकल्प के रूप में शासन करने का अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἐβασίλευσεν का आरम्भिक या कालगत अर्थ
  choice: राजा बन गया
  alternative: वहाँ राज्य करने लगा / वहाँ राज्य किया
  rationale: स्वागत या स्वीकृति के तुरंत बाद की घटना होने के कारण राजपद ग्रहण करने का अर्थ प्रसंगानुकूल है, जबकि यूनानी की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ऐतिहासिक व्यक्तिनाम और स्थाननाम हिन्दी बाइबिलीय परंपरा के अनुरूप लिप्यंतरित हैं। छोटे वाक्य-विभाजन से पठनीयता बढ़ाई गई है, जबकि यूनानी के घटनाक्रम और वास्तविक अस्पष्टताओं को बनाए रखा गया है।
