    reason: मूल क्रिया πρᾶξαι की वास्तविक शाब्दिक और प्रसंगगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν οὐδεὶς
  choice: किसी को भी यह अधिकार नहीं होगा
  rationale: यह राजकीय आदेश के कानूनी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ἐξουσία का अर्थ यहाँ अधिकार या वैध प्राधिकार है।
- source_word: πρᾶξαι
  choice: के विरुद्ध कार्रवाई करे
  rationale: मूल क्रिया व्यापक रूप से कुछ करने या कदम उठाने को दर्शा सकती है और कानूनी अथवा राजकोषीय प्रसंग में वसूली करने का भाव भी ले सकती है। यहाँ अगले क्रियापद और संरक्षणात्मक आदेश के कारण ‘के विरुद्ध कार्रवाई करे’ प्रसंगानुकूल है, पर उसकी व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: παρενοχλεῖν
  choice: परेशान करे
  rationale: यह अनुचित बाधा डालने, तंग करने या उत्पीड़ित करने का भाव देता है। ‘परेशान करे’ साधारण आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से तीव्र कानूनी अर्थ नहीं जोड़ता।
- source_word: τινα αὐτῶν
  choice: उनमें से किसी
  rationale: यह संरक्षित समूह के किसी भी व्यक्ति को समावेशी रूप से दर्शाता है।
- source_word: περὶ παντὸς πράγματος
  choice: किसी भी मामले में
  rationale: यह हर विषय, मामले या प्रसंग पर लागू होने वाले निषेध की व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
