  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यूनानी वाक्य की संयोजक संरचना को हिन्दी में स्पष्ट करने के लिए अंतिम खंड में ‘खर्च भी’ की पूर्ति की गई है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जहाँ λόγος की वास्तविक अस्पष्टता उत्पन्न होती है।
