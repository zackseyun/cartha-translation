  yaml_path: translation/deuterocanon/1_maccabees/010/045.yaml
  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
translation:
  language: hi
  text: यरूशलेम की दीवारों को फिर से बनाने और उन्हें चारों ओर से सुदृढ़ करने, तथा यहूदिया की दीवारों को फिर से बनाने के लिए, खर्च राजा के खाते से दिया जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “खर्च राजा के आदेश पर दिया जाएगा।” यूनानी शब्द λόγος का अर्थ वित्तीय “खाता” भी हो सकता है और राजा का आधिकारिक आदेश या प्राधिकार भी।
    reason: λόγος की प्रशासनिक-वित्तीय तथा आधिकारिक-अधिकार संबंधी संभावित अर्थछटाओं को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: फिर से बनाने
  rationale: क्रियाएँ मूलतः ‘बनाने’ का अर्थ देती हैं; पहले से विद्यमान नगर-रक्षा की पुनर्स्थापना के संदर्भ में ‘फिर से बनाने’ से आशय स्वाभाविक और स्पष्ट होता है।
- source_word: τὰ τείχη
  choice: दीवारों
  rationale: यह नगरों अथवा बस्तियों की रक्षात्मक दीवारों के लिए सामान्य यूनानी शब्द है; ‘किलेबंदियाँ’ कहना मूल से अधिक व्यापक होता।
- source_word: ὀχυρῶσαι
  choice: सुदृढ़ करने
  rationale: क्रिया का अर्थ सुरक्षित या मजबूत बनाना है। ‘सुदृढ़ करना’ आधुनिक हिन्दी में स्वाभाविक है और रक्षात्मक भाव बनाए रखता है।
- source_word: κυκλόθεν
  choice: चारों ओर से
  rationale: यह चारों तरफ की स्थानिक व्यापकता व्यक्त करता है।
- source_word: ἡ δαπάνη δοθήσεται
  choice: खर्च ... दिया जाएगा
  rationale: शाब्दिक संरचना ‘खर्च दिया जाएगा’ है; हिन्दी में यह निर्माण के लिए धन उपलब्ध कराने का स्पष्ट प्रशासनिक अर्थ देता है।
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: राजा के खाते से
  rationale: λόγος का अर्थ यहाँ वित्तीय ‘खाता’ अथवा आधिकारिक आदेश, दोनों हो सकता है। खर्च के संदर्भ में मुख्य पाठ वित्तीय अर्थ अपनाता है, पर पादटिप्पणी दूसरा संभव अर्थ सुरक्षित रखती है।
- source_word: Ἰουδαίᾳ
  choice: यहूदिया
  rationale: हेलेनिस्टिक काल के इस भौगोलिक प्रदेश के लिए आधुनिक हिन्दी में प्रचलित नाम ‘यहूदिया’ है।
