base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: hi
  text: राजा ने उसे अपने पास बैठाया और अधिकारियों से कहा, “उसके साथ निकलकर नगर के बीच में जाओ और यह घोषणा करो कि कोई भी किसी मामले में उसके विरुद्ध शिकायत न लाए[a], और कोई भी किसी बात को लेकर उसे परेशान न करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध किसी मामले में निवेदन न करे।” यूनानी क्रिया का अर्थ किसी के पास जाकर निवेदन करना भी हो सकता है; यहाँ सम्भवतः इसका आधिकारिक या कानूनी भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: राजा ने उसे अपने पास बैठाया
  rationale: καθίζω के सकर्मक, प्रेरणार्थक भाव—किसी को बैठाना—को बनाए रखते हुए μετʼ αὑτοῦ से व्यक्त राजा के निकट सम्मानपूर्ण स्थान को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: τοῖς ἄρχουσιν
  choice: अधिकारियों
  rationale: ἄρχοντες अधिकार रखने वाले लोगों के लिए व्यापक शब्द है। राजदरबार के प्रसंग में ‘अधिकारी’ स्वाभाविक है और अनावश्यक रूप से सैनिक पद या राजकुमार होने का अर्थ नहीं जोड़ता।
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: उसके साथ नगर के बीच में जाओ
  rationale: वाक्यांश के ‘बाहर निकलने’ और नगर के सार्वजनिक मध्य भाग में जाने के भाव को सरल आधुनिक हिन्दी में रखता है; ‘जाओ’ में प्रसंगानुसार बाहर निकलने का भाव निहित है।
- source_word: κηρύξατε
  choice: यह घोषणा करो
  rationale: κηρύσσω सार्वजनिक और औपचारिक उद्घोषणा को दर्शाता है; ‘घोषणा करो’ इसी राजकीय आदेश के अनुकूल है।
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: कि कोई भी किसी मामले में उसके विरुद्ध शिकायत न लाए
  rationale: κατά के साथ ἐντυγχάνειν यहाँ किसी व्यक्ति के विरुद्ध आधिकारिक या कानूनी निवेदन/शिकायत करने का भाव दे सकता है। ‘शिकायत न लाए’ इस अर्थ को स्पष्ट रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω
  choice: कोई भी ... उसे परेशान न करे
  rationale: ἐνοχλέω का व्यापक अर्थ तंग करना, बाधा देना या परेशान करना है। ‘परेशान न करे’ बिना अनावश्यक तीव्रता जोड़े सामान्य निषेध व्यक्त करता है।
- source_word: περὶ παντὸς λόγου
  choice: किसी बात को लेकर
  rationale: λόγος यहाँ बात, कारण या मामला दर्शाता है। ‘किसी बात को लेकर’ निषेध की सर्वसमावेशी सीमा बनाए रखता है और पिछले πρᾶγμα के लिए प्रयुक्त ‘मामले’ की भद्दी पुनरावृत्ति से बचता है।
