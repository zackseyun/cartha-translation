base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/016.yaml
  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: hi
  text: और उसने कहा, “क्या हमें ऐसा एक भी पुरुष मिलेगा?[a] और अब हम उसे अपना मित्र[b] और सहयोगी बनाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “निश्चय ही हमें ऐसा पुरुष नहीं मिलेगा, है न?” यूनानी में यह ऐसा आलंकारिक प्रश्न है जिसका अपेक्षित उत्तर ‘नहीं’ है।
    reason: lexical_alternative
  - marker: b
    text: हेलेनिस्ती राजदरबारों की भाषा में “मित्र” केवल निजी स्नेह नहीं, बल्कि एक आधिकारिक राजनीतिक दर्जा भी सूचित कर सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: क्या हमें ... मिलेगा?
  rationale: μή के साथ भविष्यकालीन संकेतार्थक क्रिया यहाँ ऐसा आलंकारिक प्रश्न बनाती है जिसका अपेक्षित उत्तर ‘नहीं’ है। हिन्दी प्रश्नवाचक रूप इस निहित नकार को बिना स्पष्ट रूप से जोड़ने के सुरक्षित रखता है।
- source_word: ἄνδρα τοιοῦτον ἕνα
  choice: ऐसा एक भी पुरुष
  rationale: ἄνδρα का पुरुषवाचक संदर्भ रखा गया है; τοιοῦτον को ‘ऐसा’ और ἕνα को स्वाभाविक हिन्दी में बल देने वाले ‘एक भी’ से व्यक्त किया गया है।
- source_word: ποιήσωμεν
  choice: हम ... बनाएँ
  rationale: स्रोत के ‘हम बनाएँ’ को निकटता से रखते हुए हिन्दी में सम्मिलित परामर्श/प्रस्ताव का भाव व्यक्त होता है।
- source_word: φίλον
  choice: मित्र
  rationale: मूल अर्थ ‘मित्र’ है, पर हेलेनिस्ती राजकीय भाषा में यह आधिकारिक राजनीतिक पद या मान्यता भी सूचित कर सकता है; अगले σύμμαχον से इसका भेद रखा गया है।
- source_word: σύμμαχον
  choice: सहयोगी
  rationale: यह राजनीतिक या सैनिक गठबंधन में साथ जुड़े व्यक्ति को दर्शाता है। ‘सहयोगी’ आधुनिक हिन्दी में सहज है और ‘मित्र’ से अलग अर्थ बनाए रखता है।
- source_word: ἡμῶν
  choice: अपना
  rationale: हिन्दी में कर्ता के साथ संबंध दिखाने के लिए निजवाचक ‘अपना’ स्वाभाविक रूप है।
