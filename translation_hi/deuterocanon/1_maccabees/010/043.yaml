base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: hi
  text: और जो कोई राजकीय देयों या किसी अन्य दायित्व के अधीन होकर यरूशलेम में स्थित पवित्रस्थान तथा उसके समस्त सीमाक्षेत्र में भागकर शरण ले[a], उसे और मेरे राज्य में उसकी सारी संपत्ति को मुक्त कर दिया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के मंदिर और उससे जुड़े पूरे क्षेत्र में भाग जाए।” यूनानी शब्द मंदिर-परिसर या उससे संबंधित भूभाग को भी सूचित कर सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राजकीय देयों और हर प्रकार के मामले के अधीन होने वाले मुक्त किए जाएँ।” इस वाक्यांश में कर, ऋण, या अन्य कानूनी दावे शामिल हो सकते हैं; मुक्ति उनके साथ-साथ राजा के राज्य में उनकी संपत्ति तक भी विस्तृत है।
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: भागकर शरण ले
  rationale: क्रिया का मूल अर्थ ‘भागना’ है, पर पवित्रस्थान की ओर भागने के प्रसंग में शरण लेने का भाव भी निहित है; संयुक्त अभिव्यक्ति दोनों पक्षों को बनाए रखती है।
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: ἱερόν मंदिर के केवल भवन के बजाय उसके व्यापक पवित्र परिसर को भी सूचित कर सकता है; ‘पवित्रस्थान’ इस विस्तार को खुला रखता है।
- source_word: ὁρίοις
  choice: पूरी सीमा के भीतर
  rationale: ὅρια सीमा अथवा उससे घिरे क्षेत्र दोनों का अर्थ दे सकता है। यह अनुवाद किसी खास प्रशासनिक भूभाग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: βασιλικὰ
  choice: राजकीय देय
  rationale: यह राजसत्ता को दी जाने वाली करराशि या अन्य देयों का संकेत कर सकता है। ‘राजकीय देय’ केवल कर तक अर्थ को सीमित नहीं करता।
- source_word: πᾶν πρᾶγμα
  choice: किसी अन्य दावे
  rationale: शाब्दिक अर्थ ‘हर मामला’ है, किंतु ὀφείλων के साथ यह आर्थिक या कानूनी दावे/दायित्व का भाव देता है। ‘दावा’ उस व्यापकता को बनाए रखता है।
- source_word: ἀπολελύσθωσαν
  choice: मुक्त कर दिया जाए
  rationale: पूर्ण निष्क्रिय आज्ञार्थक रूप औपचारिक राजकीय आदेश में किसी व्यक्ति को देयता या दावे से छुड़ाने का भाव देता है।
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: जो कुछ उसका है, वह सब
  rationale: मूल वाक्यांश व्यापक है और संभवतः सारी संपत्ति को समेटता है; यह चयन उसे केवल किसी एक प्रकार की संपत्ति तक सीमित नहीं करता।
theological_decisions:
- issue: पवित्रस्थान से जुड़ी शरण और देयताओं से मुक्ति का विस्तार
  choice: आदेश को उन लोगों और राज्य में उनकी वस्तुओं पर लागू किया गया है जो पवित्रस्थान तथा उसकी सीमा के भीतर शरण लेते हैं और राजकीय देय या अन्य दावे के अधीन हैं।
  alternative: इसे केवल कर-माफी समझा जा सकता है, अथवा ‘हर मामला’ को आर्थिक देयता से परे अधिक सामान्य अर्थ में लिया जा सकता है।
  rationale: ὀφείλων दोनों पदों—βασιλικὰ और πᾶν πρᾶγμα—से जुड़ा है, इसलिए आर्थिक या कानूनी देयता का अर्थ सबसे स्वाभाविक है; फिर भी ‘दावा’ और पादटिप्पणी मूल की व्यापकता को सुरक्षित रखते हैं।
- issue: ‘उसकी सीमाओं’ का संबंध
  choice: सर्वनाम को पवित्रस्थान से जुड़े सीमाक्षेत्र के रूप में रखा गया है, बिना उसका सटीक प्रशासनिक स्वरूप तय किए।
  alternative: यह यरूशलेम के विस्तृत भूभाग अथवा मंदिर-परिसर और उससे जुड़े क्षेत्र को सूचित कर सकता है।
  rationale: यूनानी वाक्यरचना संबंध स्पष्ट करती है, पर क्षेत्र की वास्तविक प्रकृति निश्चित नहीं करती; इसलिए मुख्य पाठ व्यापक और पादटिप्पणी स्पष्टकारी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और राजकीय आदेश के अनुरूप रखी गई है। ‘भागकर शरण ले’ मूल क्रिया के भागने के अर्थ तथा प्रसंगगत शरण—दोनों को व्यक्त करता है। अंतिम उपवाक्य की संक्षिप्तता मूल यूनानी की संरचना और व्यापकता को बनाए रखती है।
