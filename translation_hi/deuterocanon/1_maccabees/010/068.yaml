  text: And Alexander the king heard, and he was greatly grieved, and he returned to Antioch.
translation:
  language: hi
  text: जब राजा सिकन्दर ने यह सुना, तो वह बहुत दुःखी हुआ और अन्ताकिया लौट गया।
