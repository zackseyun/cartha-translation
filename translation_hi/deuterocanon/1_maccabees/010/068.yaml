lexical_decisions:
- source_word: ἤκουσεν
  choice: यह सुना
  rationale: यूनानी क्रिया का सामान्य कथात्मक अर्थ ‘सुना’ है। पिछले प्रसंग की सूचना की ओर संकेत स्पष्ट करने और हिन्दी को स्वाभाविक बनाने के लिए ‘यह’ जोड़ा गया है।
- source_word: ἐλυπήθη σφόδρα
  choice: बहुत दुःखी हुआ
  rationale: ἐλυπήθη दुःख या व्यथा की अवस्था व्यक्त करता है और σφόδρα उसकी तीव्रता बढ़ाता है; ‘बहुत दुःखी हुआ’ आधुनिक हिन्दी में दोनों का सहज और निकट समतुल्य है।
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: अन्ताकिया लौट गया
  rationale: यहाँ ἀπέστρεψεν का भाव पहले के स्थान की ओर वापस जाने का है; ‘लौट गया’ स्वाभाविक हिन्दी कथात्मक प्रयोग है।
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: राजा सिकन्दर
  rationale: यूनानी पदबंध का आशय ‘सिकन्दर, राजा’ है; हिन्दी में उपाधि को नाम से पहले रखना अधिक स्वाभाविक है। पारंपरिक और प्रचलित हिन्दी नाम-रूप ‘सिकन्दर’ चुना गया है।
