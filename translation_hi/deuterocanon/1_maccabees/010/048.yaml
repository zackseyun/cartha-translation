lexical_decisions:
- source_word: συνήγαγεν
  choice: इकट्ठी की
  rationale: यहाँ क्रिया सैन्यबल को एकत्र करने का बोध देती है; ‘इकट्ठी की’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: δυνάμεις μεγάλας
  choice: एक बड़ी सेना
  rationale: बहुवचन यूनानी पद सैन्य टुकड़ियों या समग्र सैन्यबल को सूचित करता है। हिन्दी में ‘एक बड़ी सेना’ स्वाभाविक सामूहिक अभिव्यक्ति है, यद्यपि रूपगत बहुवचन को नहीं रखती।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य प्रसंग में इसका अर्थ शिविर लगाना है; ‘पड़ाव डाला’ वर्तमान, गरिमापूर्ण कथात्मक हिन्दी में स्वाभाविक है।
- source_word: ἐξ ἐναντίας
  choice: के सामने
  rationale: यह स्थानगत आमने-सामने होने को व्यक्त करता है और तत्काल आक्रमण का अर्थ नहीं जोड़ता।
- source_word: Δημητρίῳ
  choice: देमेत्रियुस
  rationale: यूनानी Δημήτριος का निकट देवनागरी लिप्यंतरण।
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: राजा सिकन्दर
  rationale: हिन्दी में पदवी को नाम से पहले रखना अधिक स्वाभाविक है; ‘सिकन्दर’ Alexander का प्रचलित हिन्दी नामरूप है।
