base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/015.yaml
  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: hi
  text: और राजा सिकन्दर ने उन सभी प्रतिज्ञाओं के बारे में सुना जो देमेत्रियुस ने योनातान को भेजी थीं। लोगों ने उसे उन युद्धों और वीरतापूर्ण कामों के बारे में भी बताया जो योनातान और उसके भाइयों ने किए थे, और उन कठिनाइयों के बारे में भी जो उन्होंने झेली थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञाओं
  rationale: यह शब्द देमेत्रियुस द्वारा योनातान को दिए गए आश्वासनों या वचनों को दर्शाता है। ‘प्रतिज्ञाओं’ राजनीतिक संदर्भ में उनकी प्रतिबद्धता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: διηγήσαντο
  choice: लोगों ने ... बताया
  rationale: यूनानी क्रिया विस्तार से वर्णन करने या वृत्तांत सुनाने का भाव रखती है। कर्ता अनिर्दिष्ट बहुवचन है, इसलिए हिन्दी में स्वाभाविक ‘लोगों ने’ रखा गया है, बिना उनकी पहचान निश्चित किए।
- source_word: πολέμους
  choice: युद्धों
  rationale: बहुवचन को बनाए रखते हुए यह व्यापक सैन्य संघर्षों को व्यक्त करता है; ‘लड़ाइयों’ कहने से अर्थ अनावश्यक रूप से संकरा हो सकता था।
- source_word: ἀνδραγαθίας
  choice: वीरतापूर्ण कामों
  rationale: यह साहस और पराक्रम के प्रदर्शनों को सूचित करता है। यह चयन आधुनिक हिन्दी में सुबोध है और मूल के प्रशंसात्मक भाव को बनाए रखता है।
- source_word: κόπους
  choice: कठिनाइयों
  rationale: संदर्भ में यह केवल श्रम नहीं, बल्कि संघर्ष के दौरान उठाए गए कष्टों और बोझों को दर्शाता है।
- source_word: ἔσχοσαν
  choice: झेली थीं
  rationale: κόπους के साथ यह कठिनाइयों को सहने या उनसे गुजरने का भाव देता है। ‘झेली थीं’ हिन्दी में पूर्ण हो चुके अनुभव को सहज रूप से व्यक्त करता है।
- source_word: ἀδελφοὶ
  choice: भाइयों
  rationale: संदर्भ योनातान के मक्काबी परिवार के वास्तविक भाइयों का है, इसलिए ‘भाइयों’ सटीक और विशिष्ट है।
