translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। αὐτός की पुनरावृत्ति को स्पष्ट करने के लिए दूसरे वाक्य में ‘योनातान’ दोहराया गया है। सिकन्दर, देमेत्रियुस और योनातान नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
