lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: वे बहुत डर गए
  rationale: यूनानी में सजातीय कर्म के द्वारा भय की तीव्रता पर बल दिया गया है; स्वाभाविक हिन्दी में ‘बहुत डर गए’ उसी तीव्रता को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅτε ἤκουσαν
  choice: जब उन्होंने सुना
  rationale: यह सीधा कालवाचक उपवाक्य है और यूनानी कथाक्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔδωκεν αὐτοῖς
  choice: उन्हें ... दे दिया है
  rationale: सुनाई गई सूचना के भीतर राजा द्वारा पहले दिए जा चुके अधिकार को हिन्दी के स्वाभाविक पूर्ण पक्ष में व्यक्त किया गया है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: ऐतिहासिक प्रसंग में βασιλεύς का मानक और स्पष्ट हिन्दी रूप।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ शब्द राजा द्वारा प्रदान की गई आधिकारिक अनुमति या प्राधिकार को सूचित करता है; ‘अधिकार’ इसे स्वाभाविक हिन्दी में ठीक व्यक्त करता है।
- source_word: συναγαγεῖν δυνάμεις
  choice: सेनाएँ इकट्ठी करने
  rationale: सैन्य प्रसंग में δυνάμεις सैन्य बलों या सेनाओं को सूचित करता है। बहुवचन ‘सेनाएँ’ यूनानी बहुवचन को बनाए रखता है, जबकि ‘इकट्ठी करने’ συναγαγεῖν का सीधा और स्वाभाविक अनुवाद है।
