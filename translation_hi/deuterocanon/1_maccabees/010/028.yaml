lexical_decisions:
- source_word: ἀνταποδώσομεν
  choice: हम ... देंगे
  rationale: भविष्यकाल का यह क्रिया-रूप बदले में कुछ लौटाने या देने का भाव रखता है। ‘उसके बदले ... देंगे’ हिन्दी में स्वाभाविक है और पारस्परिक प्रतिफल का अर्थ स्पष्ट करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह बहुवचन सम्बोधन का सम्प्रदान कारक है; ‘तुम्हें’ उसके अप्रत्यक्ष कर्म के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαθὰ
  choice: अच्छी चीज़ें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘अच्छी चीज़ें’ उसके बहुवचन और व्यापक, अनिर्दिष्ट अर्थ को बनाए रखता है।
- source_word: ἀνθʼ ὧν
  choice: उसके बदले
  rationale: यह पदबंध प्रतिदान के आधार को व्यक्त करता है। ‘उसके बदले’ संक्षिप्त और स्वाभाविक है तथा पारस्परिकता को सुरक्षित रखता है।
- source_word: ποιεῖτε
  choice: जो कर रहे हो
  rationale: वर्तमानकालीन क्रिया को जारी गतिविधि के रूप में प्रस्तुत किया गया है; प्रसंग में ‘कर रहे हो’ स्वाभाविक है और उसके अपूर्ण पक्ष को दर्शाता है।
- source_word: μεθʼ ἡμῶν
  choice: हमारे साथ
  rationale: μετά के साथ सम्बन्धकारक का सामान्य अर्थ ‘साथ’ है। यह अनुवाद सहयोग या अनुकूल व्यवहार की सम्भावना को खुला रखता है, बिना उसे निश्चित रूप से ‘हमारे लिए’ मान लेने के।
