- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह γράψω के साथ सम्प्रदान कारक का परोक्ष कर्म है।
- source_word: λόγους
  choice: बातें
  rationale: यह लिखी जाने वाली सामग्री के स्वरूप का परिचय देता है; ‘बातें’ आधुनिक हिन्दी में ‘शब्दों’ से अधिक स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: παρακλήσεως
  choice: प्रोत्साहन
  rationale: शब्द प्रोत्साहन, आग्रह या सांत्वना का बोध करा सकता है; इस राजनयिक प्रसंग में ‘प्रोत्साहन’ सकारात्मक आश्वासन का उपयुक्त व्यापक अर्थ देता है।
- source_word: ὕψους
  choice: सम्मान
  rationale: शाब्दिक अर्थ ‘ऊँचाई’ या ‘उन्नयन’ है; यहाँ उपहारों के साथ प्रयुक्त होने पर यह प्रतिष्ठा या पदोन्नति का संकेत दे सकता है। मुख्य पाठ में ‘सम्मान’ स्वाभाविक है, जबकि अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: δομάτων
  choice: उपहारों
  rationale: यह उपहार या भेंट को दर्शाता है; ‘उपहार’ सीधा और इस राजकीय प्रसंग में भी उपयुक्त है।
