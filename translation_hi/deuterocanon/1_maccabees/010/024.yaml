lexical_decisions:
- source_word: γράψω
  choice: मैं…लिखूँगा
  rationale: भविष्यत्कालीन कर्तृवाच्य रूप वक्ता के आगामी इरादे को व्यक्त करता है।
- source_word: κἀγώ
