- source_word: ἐπεκρίθη
  choice: उत्तर दिया
  rationale: क्रिया का सामान्य और संदर्भानुकूल अर्थ; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ἀγαθὴ ἡμέρα
  choice: यह शुभ दिन है
  rationale: ग्रीक विधेयात्मक अभिव्यक्ति की प्रशंसात्मक तीव्रता बनाए रखते हुए सहज हिन्दी।
- source_word: γῆν πατέρων σου
