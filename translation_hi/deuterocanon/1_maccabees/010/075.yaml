  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: hi
  text: और उसने याफ़ा के विरुद्ध छावनी डाली, और नगर के लोगों ने उसे भीतर आने से रोक दिया, क्योंकि याफ़ा में अपोल्लोनियुस की एक सैनिक टुकड़ी तैनात थी; और उन्होंने उस नगर के विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: याफ़ा के सामने छावनी डाली
  rationale: सैन्य प्रसंग में παρεμβάλλω छावनी डालने को और ἐπί किसी स्थान के विरुद्ध अथवा उसके सामने सैन्य जमाव को व्यक्त करता है। यह अनुवाद केवल ‘कूच किया’ की अपेक्षा मूल सैन्य बिंब को अधिक स्पष्ट रखता है।
- source_word: ἀπέκλεισαν αὐτόν
  choice: उसे भीतर आने से रोक दिया
  rationale: ἀποκλείω का अर्थ बाहर रखना या प्रवेश रोकना है। हिन्दी में यह स्वाभाविक वाक्यांश सम्भावित नगर-प्रवेश के भाव को स्पष्ट करता है, बिना बंद फाटकों का ऐसा विवरण जोड़ने के जो यूनानी में नहीं है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोगों
  rationale: इसका शाब्दिक भाव ‘नगर से जो लोग थे’ है। ‘नगर के लोगों’ से अनावश्यक रूप से केवल पुरुषों तक सीमित किए बिना स्वाभाविक हिन्दी मिलती है।
- source_word: φρουρὰ Ἀπολλωνίου
  choice: अपोल्लोनियुस की एक सैनिक चौकी
  rationale: φρουρά यहाँ तैनात सैन्य दल अथवा गैरीसन को दर्शाता है। ‘सैनिक चौकी’ साधारण आधुनिक हिन्दी में स्थान और वहाँ तैनात बल—दोनों का प्रसंगानुकूल बोध कराती है।
- source_word: ἐπολέμησαν αὐτήν
  choice: उन्होंने उस नगर पर आक्रमण किया
  rationale: πολεμέω युद्ध करने या लड़ने को व्यक्त करता है। स्त्रीलिंग एकवचन αὐτήν का निकटतम व्याकरणिक संदर्भ Ἰόππην है; हिन्दी में ‘उस नगर’ कहने से अस्पष्ट ‘उस पर’ की अपेक्षा संदर्भ स्पष्ट होता है।
