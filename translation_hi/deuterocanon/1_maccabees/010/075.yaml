  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ऐतिहासिक-सैन्य शैली रखी गई है। संयोजक ‘और’ द्वारा यूनानी καί की क्रमिक कथन-शैली को यथासंभव बनाए रखा गया है। नाम Ἰόππη के लिए प्रचलित बाइबलीय रूप ‘याफ़ा’ और Ἀπολλώνιος के लिए ‘अपोल्लोनियुस’ अपनाया गया है।
