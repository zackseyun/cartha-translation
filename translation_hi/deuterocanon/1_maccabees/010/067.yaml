  yaml_path: translation/deuterocanon/1_maccabees/010/067.yaml
  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: hi
  text: और एक सौ पैंसठवें वर्ष में दिमेत्रियुस का पुत्र दिमेत्रियुस क्रेते से अपने पूर्वजों की भूमि[a] में आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके पितरों की भूमि”; अर्थात उसकी पैतृक भूमि।
    reason: यूनानी मुहावरे के शाब्दिक रूप और उसके वंशगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: एक सौ पैंसठवें वर्ष में
  rationale: यूनानी में संख्याएँ जोड़कर शाब्दिक रूप से ‘पाँचवें और साठवें और सौवें वर्ष में’ कहा गया है। आधुनिक हिन्दी में इसका स्वाभाविक और सटीक रूप ‘एक सौ पैंसठवें वर्ष में’ है।
- source_word: ἦλθεν
  choice: आया
  rationale: यह सामान्य कथात्मक क्रिया है और εἰς द्वारा बताए गए गंतव्य की ओर गति को सहज हिन्दी में व्यक्त करती है।
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: दिमेत्रियुस का पुत्र दिमेत्रियुस
  rationale: दोनों व्यक्तिनामों का यूनानी से लिप्यंतरण किया गया है और पुत्र-संबंध को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ἐκ Κρήτης
  choice: क्रेते से
  rationale: ἐκ स्रोत अथवा प्रस्थान-स्थान बताता है; ‘से’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: अपने पूर्वजों की भूमि में
  rationale: ‘भूमि’ γῆ के प्रादेशिक अर्थ को बनाए रखता है। ‘पूर्वजों’ से बहुवचन πατέρων का वंशगत आशय स्वाभाविक हिन्दी में व्यक्त होता है, और ‘में’ εἰς की भीतर की ओर गति को दर्शाता है।
