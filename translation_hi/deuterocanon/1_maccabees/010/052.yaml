  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: hi
  text: जब मैं अपने राज्य में लौट आया, अपने पितरों के सिंहासन पर बैठा[a], शासन अपने हाथ में लिया, देमेत्रियुस को कुचल दिया और हमारे देश पर अधिकार कर लिया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पूर्वजों के सिंहासन पर।’ यूनानी में शाब्दिक रूप से ‘अपने पितरों के सिंहासन पर’ है; यह एक राजवंशीय अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: जब
  rationale: यहाँ यह अव्यय आगे कही जाने वाली बात की पूर्ववर्ती परिस्थिति बताता है। ‘जब’ हिन्दी में कालगत संबंध को स्वाभाविक रूप से व्यक्त करता है और वाक्य की आगे जारी रहने वाली संरचना को बनाए रखता है।
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: मैं अपने राज्य में लौट आया
  rationale: क्रिया और εἰς के साथ यह अपने राज्यक्षेत्र में वापस आने का अर्थ देता है; ‘राज्य’ यहाँ भौगोलिक-राजनीतिक क्षेत्र के लिए उपयुक्त है।
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: अपने पितरों के सिंहासन पर बैठा
  rationale: यह राजवंशीय उत्तराधिकार की अभिव्यक्ति है। ‘पितरों’ से यूनानी के पुरुष-पूर्वज संबंधी शब्द और उसका प्राचीन राजकीय रंग दोनों सुरक्षित रहते हैं।
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: शासन अपने अधिकार में लिया
  rationale: κρατέω के साथ संबंधकारक यहाँ शासकीय सत्ता पर नियंत्रण प्राप्त करने का भाव देता है। यह अनुवाद अवैध रूप से सत्ता छीनने का अर्थ जोड़े बिना उस प्रबल नियंत्रण को व्यक्त करता है।
- source_word: συνέτριψα
  choice: कुचल दिया
  rationale: यह तीव्र युद्धात्मक क्रिया है; ‘कुचल दिया’ साधारण ‘हरा दिया’ की अपेक्षा मूल की प्रबलता बनाए रखता है।
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: अपने देश पर अधिकार कर लिया
  rationale: क्रिया सफल राजनीतिक-सैन्य नियंत्रण व्यक्त करती है। ‘देश’ यहाँ आधुनिक राष्ट्र-राज्य का दावा किए बिना अपने भूभाग का स्वाभाविक हिन्दी संकेत देता है।
theological_decisions:
- issue: राजवंशीय पदबंध πατέρων μου
  choice: अपने पितरों के सिंहासन
  alternative: अपने पूर्वजों के सिंहासन
  rationale: मूल यूनानी में शाब्दिक रूप से ‘मेरे पिताओं’ का भाव है और यह पुरुष-वंश के राजकीय उत्तराधिकार का दावा करता है। मुख्य पाठ में ‘पितरों’ से यह स्रोत-रंग सुरक्षित है; अधिक सामान्य अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्पष्ट रखी गई है। पद मूल की तरह अगले कथन से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है। ‘पितरों’ का अपेक्षाकृत प्राचीन रंग जानबूझकर राजवंशीय अभिव्यक्ति सुरक्षित रखने के लिए रखा गया है।
