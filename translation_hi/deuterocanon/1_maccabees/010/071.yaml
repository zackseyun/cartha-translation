  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: hi
  text: तो अब, यदि तुम्हें अपनी सेनाओं पर भरोसा है, तो उतरकर मैदान में हमारे पास आओ, और वहाँ हम एक-दूसरे का सामना करें[a], क्योंकि नगरों की शक्ति मेरे साथ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वहाँ हम एक-दूसरे से भिड़ें।’ इस प्रसंग में यूनानी पदबंध प्रत्यक्ष मुठभेड़ का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगरों की सेनाएँ।’ यूनानी पदबंध का अर्थ नगरों से प्राप्त सामूहिक सैन्य सहायता भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
  choice: भरोसा है
  rationale: पूर्णकालिक रूप यहाँ अपनी सैन्य क्षमता पर टिके हुए विश्वास को व्यक्त करता है; ‘भरोसा है’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δυνάμεσίν
  choice: सेनाओं
  rationale: इस युद्ध-संदर्भ में बहुवचन δυνάμεις सशस्त्र बलों को सूचित करता है; ‘सेनाओं’ से ठोस सैन्य अर्थ स्पष्ट रहता है।
- source_word: κατάβηθι
  choice: उतरकर ... आओ
  rationale: यह आदेश नीचे आने की स्थानिक गति को बनाए रखता है और πρὸς ἡμᾶς के कारण ‘हमारे पास आओ’ स्वाभाविक है।
- source_word: πεδίον
  choice: मैदान
  rationale: πεδίον समतल, खुली भूमि को दर्शाता है; सैन्य चुनौती के प्रसंग में ‘मैदान’ उपयुक्त है।
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: हम एक-दूसरे का सामना करें
  rationale: इस युद्ध-संदर्भ में पदबंध केवल तुलना नहीं, प्रत्यक्ष मुठभेड़ का संकेत देता है; ‘सामना करें’ उस तनाव को बनाए रखता है, पर युद्ध को मूल से अधिक स्पष्ट नहीं बनाता।
- source_word: δύναμις τῶν πόλεων
  choice: नगरों की शक्ति
  rationale: यूनानी में एकवचन δύναμις और संबंधकारक पदबंध संक्षिप्त तथा कुछ हद तक अस्पष्ट है। ‘नगरों की शक्ति’ मूल रूप को निकटता से रखता है और सैन्य सहायता की सम्भावना को पादटिप्पणी में देता है।
