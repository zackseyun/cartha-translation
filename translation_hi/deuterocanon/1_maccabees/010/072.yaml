base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
translation:
  language: hi
  text: पूछ और जान ले कि मैं कौन हूँ और वे दूसरे लोग कौन हैं जो हमारी सहायता कर रहे हैं। लोग कहते हैं, “तुम लोग हमारे सामने पैर टिकाकर खड़े नहीं रह सकते[a], क्योंकि तेरे पुरखे अपनी ही भूमि में दो बार खदेड़े गए थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे मुख के सामने तुम्हारे लिए पैर टिकाकर खड़े रहने का आधार नहीं है।” यह यूनानी मुहावरा विरोधी के सामने टिक न सकने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: पूछकर जान ले
  rationale: दोनों एकवचन आज्ञार्थकों का क्रम और चुनौतीपूर्ण स्वर बना रहता है; ‘जान ले’ सूचना प्राप्त करने का भाव देता है।
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: वे दूसरे लोग ... जो हमारी सहायता कर रहे हैं
  rationale: λοιποί को ‘दूसरे लोग’ और वर्तमान कृदंत βοηθοῦντες को सक्रिय, जारी सहायता के रूप में रखा गया है; अनावश्यक रूप से सैन्य अर्थ नहीं जोड़ा गया।
- source_word: λέγουσιν
  choice: लोग कहते हैं
  rationale: यूनानी में कर्ता स्पष्ट नहीं है, यद्यपि क्रिया बहुवचन है। हिन्दी का ‘लोग कहते हैं’ इस अनिर्दिष्ट बहुवचन और वर्तमानकालीन कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: तुम लोग हमारे सामने पैर टिकाकर खड़े नहीं रह सकते
  rationale: ‘पैर टिकाने’ का मूल रूपक सुरक्षित है और सैन्य चुनौती में विरोधी के सामने टिक न सकने का आशय स्वाभाविक हिन्दी में आता है। ὑμῖν के बहुवचन को ‘तुम लोग’ से स्पष्ट किया गया है।
- source_word: ἐτροπώθησαν
  choice: खदेड़े गए थे
  rationale: युद्ध-संदर्भ में निष्क्रिय क्रिया पराजित होकर पीछे हटाए या भगा दिए जाने का अर्थ देती है; ‘खदेड़े गए’ इसकी सैन्य तीव्रता रखता है।
- source_word: οἱ πατέρες σου
  choice: तेरे पुरखे
  rationale: यहाँ ‘पिता’ पूर्वजों के अर्थ में है। ‘पुरखे’ हिन्दी में स्वाभाविक है, और σου के एकवचन को ‘तेरे’ द्वारा सुरक्षित रखा गया है, जबकि पिछले खंड का संबोधन बहुवचन है।
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: अपनी ही भूमि में
  rationale: αὐτῶν का स्वामित्व और ताने का बल ‘अपनी ही’ से स्पष्ट होता है।
