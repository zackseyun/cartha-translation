  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है, पर युद्ध-संबंधी चुनौती का तीखा स्वर भी बना हुआ है। यूनानी में पहले और अंतिम संबोधन एकवचन हैं (ἐρώτησον, μάθε; σου), जबकि बीच में ὑμῖν बहुवचन है; हिन्दी में ‘जान ले’, ‘तुम लोग’ और ‘तेरे’ द्वारा यह परिवर्तन जानबूझकर सुरक्षित रखा गया है।
