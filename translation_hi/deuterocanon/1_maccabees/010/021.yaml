base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: hi
  text: और एक सौ साठवें वर्ष के सातवें महीने में, झोंपड़ियों के पर्व[a] के अवसर पर, योनातान ने पवित्र वस्त्र पहना। उसने सेनाएँ इकट्ठी कीं और बहुत-से हथियार तैयार किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मंडपों का पर्व” भी कहा जाता है। यूनानी में शाब्दिक रूप से झोंपड़ियाँ या अस्थायी आश्रय बनाने के पर्व का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: पहना
  rationale: मध्यवाच्य क्रिया योनातान के स्वयं पवित्र वस्त्र धारण करने की ठोस क्रिया बताती है; ‘पहना’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: τὴν ἁγίαν στολήν
  choice: पवित्र वस्त्र
  rationale: στολή किसी विशिष्ट लंबे या औपचारिक परिधान को दर्शाता है और ἁγίαν उसे पवित्र ठहराता है। ‘पवित्र वस्त्र’ याजकीय संदर्भ को व्यक्त करता है, पर यूनानी से आगे जाकर उसका प्रकार निश्चित नहीं करता।
- source_word: τῷ ἑβδόμῳ μηνί
  choice: सातवें महीने में
  rationale: यह कालवाचक संप्रदान है; हिन्दी में ‘सातवें महीने में’ इसका सहज समतुल्य है।
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ साठवें वर्ष के
  rationale: यूनानी क्रमवाचक रचना 160वें वर्ष को सूचित करती है; हिन्दी वाक्य में इसे सातवें महीने के साथ संबंधवाचक रूप में रखना स्वाभाविक है।
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: झोंपड़ियों के पर्व के अवसर पर
  rationale: σκηνοπηγία अस्थायी आश्रय या झोंपड़ियाँ बनाने के पर्व को दर्शाता है। यह अनुवाद अर्थ को सीधे और सामान्य पाठक के लिए बोधगम्य रूप में रखता है।
- source_word: συνήγαγεν δυνάμεις
  choice: सेनाएँ इकट्ठी कीं
  rationale: δυνάμεις यहाँ सैन्य टुकड़ियों या बलों के अर्थ में है। ‘सेनाएँ’ बहुवचन को बनाए रखता है और प्रसंग का सैन्य आशय स्पष्ट करता है।
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: बहुत-से हथियार तैयार किए
  rationale: κατασκευάζω बनाने या तैयार करने दोनों का अर्थ दे सकता है। ‘तैयार किए’ इस वास्तविक अस्पष्टता को बनाए रखता है कि हथियार नए बनाए गए थे या युद्ध के लिए सुसज्जित किए गए थे।
