  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: hi
  text: क्योंकि उसने कहा, “इससे पहले कि वह सिकन्दर के साथ मिलकर हमारे विरुद्ध हो जाए, हम उससे मेल करने में पहल करें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इससे पहले कि वह अपने को सिकन्दर के साथ हमारे विरुद्ध रखे”; यह राजनीतिक पक्षधरता या गठजोड़ का मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: हम ... पहल करें
  rationale: 'यह προφθάνω के विध्यर्थक भाव को व्यक्त करता है: दूसरे से पहले रणनीतिक कदम उठाना। आधुनिक हिन्दी में ‘पहल करें’ स्वाभाविक है।'
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  choice: उससे मेल करने में
  rationale: εἰρηνεύω यहाँ राजनीतिक शांति या समझौता स्थापित करने का भाव रखता है; ‘मेल करना’ संक्षिप्त और सहज हिन्दी है।
- source_word: πρὶν ἢ
  choice: इससे पहले कि
  rationale: यह आशंकित कार्रवाई से पहले कदम उठाने का कालगत सम्बन्ध स्पष्ट करता है।
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: वह सिकन्दर के साथ मिलकर ... हो जाए
  rationale: यूनानी में शाब्दिक रूप से ‘वह अपने को सिकन्दर के साथ रखे’ है, जो राजनीतिक पक्षधरता या गठजोड़ का मुहावरा है। ‘साथ मिलकर’ अर्थ को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: καθʼ ἡμῶν
  choice: हमारे विरुद्ध
  rationale: κατά के सम्बन्धकारक प्रयोग से यहाँ विरोध या शत्रुता का लक्ष्य प्रकट होता है।
