base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: hi
  text: तब दोनों राजा युद्ध में भिड़ गए। दिमेत्रियुस की छावनी भाग गई, और सिकन्दर ने उसका पीछा किया और उन पर प्रबल हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में पहले एकवचन—“उसका पीछा किया”—और फिर बहुवचन—“उन पर प्रबल हुआ”—है। सम्भवतः सिकन्दर ने सेनापति के रूप में दिमेत्रियुस का पीछा किया और उसकी सेना पर विजय पाई।
    reason: मूल पाठ में एकवचन से बहुवचन की ओर हुए परिवर्तन को सुरक्षित रखते हुए उसका सम्भावित आशय स्पष्ट करना।
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: युद्ध में भिड़ गए
  rationale: यह यूनानी मुहावरा युद्ध आरम्भ करने अथवा आमने-सामने लड़ने को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और केवल सामान्य ‘लड़े’ की अपेक्षा मूल सैन्य भाव को अधिक स्पष्ट रखता है।
- source_word: οἱ δύο βασιλεῖς
  choice: दोनों राजा
  rationale: मूल के स्पष्ट कर्ता का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: दिमेत्रियुस की छावनी
  rationale: παρεμβολή का मूल अर्थ छावनी है और प्रसंग में यह वहाँ तैनात सेना को भी सूचित कर सकती है। ‘सेना’ कहने से इस लाक्षणिक अर्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
- source_word: ἔφυγεν
  choice: भाग गई
  rationale: क्रिया का सीधा अर्थ भागना है; ‘परास्त होकर भागी’ जैसी अभिव्यक्ति मूल से अधिक अर्थ जोड़ती।
- source_word: ἐδίωξεν αὐτόν
  choice: उसका पीछा किया
  rationale: सैन्य प्रसंग में ἐδίωξεν पीछा करने को दर्शाता है। एकवचन सर्वनाम सम्भवतः दिमेत्रियुस की ओर संकेत करता है।
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: उन पर प्रबल हुआ
  rationale: यह वाक्यांश विरोधियों पर बढ़त या विजय व्यक्त करता है। ‘प्रबल हुआ’ मूल की व्यापकता बनाए रखता है और पूर्ण विनाश अथवा निर्णायक पराजय का अतिरिक्त दावा नहीं करता।
