base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: hi
  text: और सभी पर्व, सब्त, नए चाँद के दिन और नियत दिन, तथा किसी पर्व से पहले के तीन दिन और पर्व के बाद के तीन दिन—ये सभी दिन मेरे पूरे राज्य में रहने वाले सभी यहूदियों के लिए कर-मुक्ति और छूट[a] के दिन हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माफी” अथवा “दायित्वों से मुक्ति”; यूनानी शब्द का अर्थ किसी बंधन या दायित्व से छुटकारा भी हो सकता है। यहाँ संभवतः राजकीय प्रशासन द्वारा दी गई राहत अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑορταὶ
  choice: पर्व
  rationale: यह धार्मिक उत्सवों अथवा पर्व-दिवसों को दर्शाता है; ‘पर्व’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: σάββατα
  choice: सब्त
  rationale: बहुवचन का आशय सभी सब्त-दिवसों से है; हिन्दी बाइबलीय प्रयोग में ‘सब्त’ इस यहूदी पंचांग-संबंधी संकेत को स्पष्ट रखता है।
- source_word: νουμηνίαι
  choice: नए चाँद के दिन
  rationale: यह नए चाँद से जुड़े मासिक धार्मिक दिनों को दर्शाता है; केवल ‘नए चाँद’ की अपेक्षा यह रूप हिन्दी में दिनों की सूची के भीतर अधिक स्पष्ट है।
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: नियत दिन
  rationale: ἀποδεδειγμέναι आधिकारिक रूप से निर्धारित अथवा नियुक्त किए गए दिनों का बोध कराता है; ‘नियत दिन’ अर्थ को संक्षेप और सहजता से व्यक्त करता है।
- source_word: ἔστωσαν
  choice: के दिन हों
  rationale: यह राजकीय आदेश का तृतीय पुरुष आज्ञार्थक रूप है; ‘हों’ उसकी आदेशात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀτελείας
  choice: कर-मुक्ति
  rationale: राजकीय-प्रशासनिक संदर्भ में यह कर, महसूल या देय राशि से छूट को दर्शाता है; ‘कर-मुक्ति’ सटीक और सुबोध है।
- source_word: ἀφέσεως
  choice: छूट
  rationale: यहाँ शब्द ἀτέλεια के साथ राजकीय सुविधाओं के संदर्भ में है। ‘छूट’ इसके व्यापक प्रशासनिक अर्थ को रखता है और इसे पापों की क्षमा तक सीमित नहीं करता; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: πᾶσι τοῖς Ἰουδαίοις τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: मेरे पूरे राज्य में रहने वाले सभी यहूदियों के लिए
  rationale: यह दत्तिव रूप लाभ पाने वालों को और सहभागी पदबंध उनके पूरे राज्य में निवास को बताता है; हिन्दी क्रम अर्थ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: राजकीय-प्रशासनिक संदर्भ में ἀφέσεως का स्वरूप
  choice: छूट
  alternative: माफी; दायित्वों से मुक्ति; रिहाई
  rationale: पद राजकीय विशेषाधिकारों और कर-मुक्ति की चर्चा करता है, पापों की क्षमा की नहीं। फिर भी यूनानी शब्द का अर्थ व्यापक है, इसलिए मुख्य पाठ में सामान्य ‘छूट’ और पादटिप्पणी में संभावित अर्थ दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु राजकीय घोषणा के अनुकूल गरिमापूर्ण स्तर रखा गया है। पंचांग-संबंधी पदों को सामान्य पाठक के लिए स्पष्ट बनाया गया है, और ἀφέσεως की वास्तविक अर्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
