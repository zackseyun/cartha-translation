- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: तलवार से मारे गए लोग
  rationale: शाब्दिक अर्थ ‘तलवार से गिरे हुए’ है; आधुनिक हिन्दी में मृत्यु का आशय स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: आग में जला दिए गए लोग
  rationale: ग्रीक कृदंत का अर्थ उन लोगों से है जो आग से जलाए गए; कर्मवाच्य भाव को बनाए रखा गया है।
- source_word: εἰς ἄνδρας ὀκτακισχιλίους
  choice: कुल संख्या आठ हज़ार पुरुषों तक पहुँची
  rationale: εἰς के साथ संख्या तक पहुँचने/कुल होने का भाव सुरक्षित रखा गया है और ἄνδρας को ‘पुरुषों’ के रूप में स्पष्ट किया गया है।
