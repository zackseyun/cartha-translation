    text: यहाँ “गढ़” से आशय यरूशलेम के किलेबंद दुर्ग से है, जिसे परंपरागत रूप से “अक्रा” कहा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: के हवाले कर दिया
  rationale: यह क्रिया किसी व्यक्ति को औपचारिक रूप से सौंप देने का भाव रखती है; प्रसंग में यह स्वाभाविक और स्पष्ट है।
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: गढ़ में रहनेवालों
  rationale: ἄκρα यरूशलेम के किलेबंद दुर्ग को दर्शाता है। यूनानी पदबंध शाब्दिक रूप से ‘गढ़ से/के लोग’ है, पर प्रसंग में वे वहीं रहने या तैनात रहनेवाले लोग हैं।
- source_word: Ἰωναθὰν
  choice: योनातान
  rationale: बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: τὰ ὅμηρα
  choice: बंधकों
  rationale: ὅμηρα यहाँ व्यक्तियों के लिए प्रयुक्त है जिन्हें सुरक्षा की गारंटी के रूप में रोका गया था; अगले वाक्यांश में उन्हें माता-पिता को लौटाना इसकी पुष्टि करता है।
- source_word: ἀπέδωκαν
  choice: लौटा दिया
  rationale: क्रिया पहले से रोके गए व्यक्तियों को वापस देने का स्पष्ट भाव व्यक्त करती है।
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: उनके माता-पिता के पास
  rationale: γονεῦσιν का सीधा अर्थ ‘माता-पिता’ है; ‘परिवार’ कहना मूल से अधिक व्यापक होता।
