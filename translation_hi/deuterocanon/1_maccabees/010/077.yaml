  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य वृत्तांत की गति बनाए रखने के लिए छोटे, स्पष्ट वाक्य प्रयुक्त हुए हैं। मूल यूनानी की संभावित छलपूर्ण मुद्रा और घुड़सवार सेना पर अपोल्लोनियुस के भरोसे को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
