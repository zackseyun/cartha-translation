base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: hi
  text: जब अपोल्लोनियुस ने यह सुना, तो उसने तीन हज़ार घुड़सवारों और एक बड़ी सेना के साथ पड़ाव डाला। वह अज़ोतुस गया, मानो केवल वहाँ से होकर आगे निकल रहा हो,[a] और साथ ही मैदान में आगे बढ़ा, क्योंकि उसके पास बहुत-से घुड़सवार[b] थे और उसे उन पर भरोसा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मानो वह वहाँ से होकर गुजर रहा हो।’ यूनानी वाक्यांश से यह भाव आता है कि वह अपनी चाल को केवल मार्ग से गुजरने जैसा दिखा रहा था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ ‘घोड़ा’ शब्द सामूहिक रूप से घुड़सवार सैनिकों या घुड़सवार सेना के लिए आया है।
    reason: cultural_note
lexical_decisions:
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य प्रसंग में यह क्रिया शिविर लगाने या पड़ाव डालने का अर्थ देती है; यह स्वाभाविक हिन्दी में यूनानी अर्थ को स्पष्ट रखती है।
- source_word: τρισχιλίαν ἵππον
  choice: तीन हज़ार घुड़सवारों
  rationale: यहाँ ἵππος सामूहिक और लाक्षणिक रूप से घुड़सवार सेना को दर्शाता है; ‘घुड़सवार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: δύναμιν πολλήν
  choice: एक बड़ी सेना
  rationale: इस सैन्य प्रसंग में δύναμις अमूर्त सामर्थ्य नहीं, बल्कि सैन्य दल को दर्शाता है।
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: अज़ोतुस की ओर गया
  rationale: ἐπορεύθη सामान्य रूप से जाने या आगे बढ़ने को व्यक्त करता है; यूनानी स्थान-नाम Ἄζωτος को ‘अज़ोतुस’ के रूप में लिप्यंतरित किया गया है।
- source_word: ὡς διοδεύων
  choice: ऐसे गया मानो केवल वहाँ से होकर आगे निकल रहा हो
  rationale: वाक्यांश इस दिखावे को व्यक्त करता है कि उसका उद्देश्य खुला आक्रमण नहीं, केवल मार्ग से गुजरना था; ‘मानो’ मूल की संभावित छलपूर्ण मुद्रा को बनाए रखता है।
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: और उसी समय मैदान की ओर बढ़ा
  rationale: ἅμα समकालिकता बताता है और προσάγω सैन्य संदर्भ में आगे बढ़ने की गतिविधि व्यक्त करता है। ‘की ओर’ दिशा को बनाए रखता है और गंतव्य तक पहुँचने को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου
  choice: क्योंकि उसके पास बहुत-से घुड़सवार थे
  rationale: यह कारणसूचक रचना उसकी रणनीतिक चाल का आधार बताती है; πλῆθος की बहुलता को सहज हिन्दी में व्यक्त किया गया है।
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: और उसे उन पर भरोसा था
  rationale: पूर्णकालिक infinitive दृढ़ या स्थापित भरोसे को दर्शाता है। हिन्दी में बहुवचन ‘उन पर’ निकटवर्ती ‘घुड़सवारों’ की ओर स्वाभाविक रूप से संकेत करता है।
