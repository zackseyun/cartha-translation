base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: hi
  text: और उसने महायाजक योनातान के पास यह संदेश भेजा, “केवल तू ही हमारे विरुद्ध सिर उठा रहा है[a]। तेरे कारण मैं उपहास और निन्दा का पात्र बन गया हूँ[b]। और तू पहाड़ी प्रदेश में हम पर अधिकार क्यों चलाता है[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे विरुद्ध उठ खड़ा हुआ है।” यूनानी क्रिया अपने को ऊँचा उठाने या किसी के विरुद्ध आक्रामक रूप से उठने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं हँसी और अपमान का पात्र बन गया हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “पहाड़ों में।” यूनानी शब्द ऊँचे पहाड़ों के साथ-साथ व्यापक पहाड़ी क्षेत्र को भी सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς
  choice: के पास यह संदेश भेजा
  rationale: यूनानी अभिव्यक्ति किसी व्यक्ति के पास दूत या संदेश भेजने का भाव रख सकती है। हिन्दी में यह स्वाभाविक है और माध्यम को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τὸν ἀρχιερέα
  choice: महायाजक
  rationale: यह यहूदी धार्मिक और राजनीतिक पद के लिए प्रचलित तथा सटीक हिन्दी पद है।
- source_word: μονώτατος
  choice: केवल तू ही
  rationale: यह अतिशयोक्तिपूर्ण रूप से व्यक्त एकाकीपन और विशिष्टता के बल को बनाए रखता है।
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: हमारे विरुद्ध सिर उठा रहा है
  rationale: यह मुहावरा अपने को ऊँचा उठाने और विरोध में उठ खड़े होने—दोनों सम्भव भावों को स्वाभाविक हिन्दी में समेटता है।
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: मैं उपहास और निन्दा का पात्र बन गया हूँ
  rationale: यह सार्वजनिक हँसी और अपमान के परिणामसूचक भाव को बनाए रखते हुए दोनों यूनानी संज्ञाओं को अलग-अलग व्यक्त करता है।
- source_word: διὰ σέ
  choice: तेरे कारण
  rationale: διά के साथ कर्मकारक का स्पष्ट कारणसूचक अर्थ यहाँ संक्षेप और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: हम पर अधिकार क्यों जताता है
  rationale: यह अधिकार या नियंत्रण के प्रयोग को व्यक्त करता है, पर मूल से अधिक तटस्थ शासन अथवा अधिक कठोर दमन का अर्थ नहीं थोपता।
- source_word: ἐν τοῖς ὄρεσιν
  choice: पहाड़ी प्रदेश में
  rationale: ὄρη पर्वतों के साथ व्यापक पहाड़ी भूभाग को भी सूचित कर सकता है; प्रसंग में ‘पहाड़ी प्रदेश’ स्वाभाविक है और भौगोलिक व्यापकता बनाए रखता है।
