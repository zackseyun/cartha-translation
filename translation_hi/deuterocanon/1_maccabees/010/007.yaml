  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: hi
  text: और योनातान यरूशलेम आया और उसने सब लोगों तथा गढ़ में रहनेवालों को वे पत्र पढ़कर सुनाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशिष्ट रूप से, “अक्रा के लोगों को”; अक्रा यरूशलेम का किलेबंद गढ़ था।
    reason: ἄκρα सामान्यतः ‘गढ़’ हो सकता है, पर यहाँ संभवतः यरूशलेम के उस विशिष्ट दुर्ग ‘अक्रा’ का नाम है।
lexical_decisions:
- source_word: ἦλθεν
  choice: आया
  rationale: कथात्मक संदर्भ में ἔρχομαι के अओरिस्ट का सीधा और स्वाभाविक हिन्दी रूप ‘आया’ है।
- source_word: ἀνέγνω τὰς ἐπιστολάς
  choice: वे पत्र पढ़कर सुनाए
  rationale: ἀναγινώσκω का मूल अर्थ ‘पढ़ना’ है, और εἰς τὰ ὦτα सार्वजनिक रूप से सुनाए जाने का भाव स्पष्ट करता है; इसलिए संयुक्त हिन्दी अभिव्यक्ति स्वाभाविक है।
- source_word: παντὸς τοῦ λαοῦ
  choice: सब लोगों
  rationale: यह सामूहिक व्यापकता को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: गढ़ में रहनेवालों
  rationale: ἄκρα यहाँ यरूशलेम के किलेबंद गढ़ को सूचित करता है; ἐκ स्थान से संबद्ध लोगों को दर्शाता है, जिसे प्रसंगानुसार ‘में रहनेवालों’ कहना सहज है।
