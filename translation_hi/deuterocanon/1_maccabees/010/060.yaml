base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: hi
  text: और वह बड़ी शान के साथ[a] पतुलमैस गया और दोनों राजाओं से मिला। उसने उन दोनों को चाँदी और सोना दिया और उनके मित्रों[b] को बहुत-से उपहार दिए, और उनकी कृपा पाई।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वैभव के साथ” या “बड़े ठाठ-बाट से”; यूनानी पद उसके आगमन में सम्मान और भव्यता के सार्वजनिक प्रदर्शन का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मित्र” से राजाओं के निकट सहयोगी या दरबारी भी अभिप्रेत हो सकते हैं।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “उनकी दृष्टि में कृपा पाई”; या, “उनकी कृपा प्राप्त की” अथवा “उनका अनुग्रह पाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: गया
  rationale: यह गति बताने वाला सामान्य कथात्मक क्रिया-रूप है; ‘गया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: μετὰ δόξης
  choice: बड़ी शान के साथ
  rationale: यह पद सार्वजनिक सम्मान, वैभव और भव्य प्रदर्शन का भाव देता है; ‘शान’ धार्मिक अर्थों वाली ‘महिमा’ की सम्भावित अतिरिक्त छाया से बचती है।
- source_word: Πτολεμαΐδα
  choice: पतुलिमयिस
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुरूप रखा गया है।
- source_word: ἀπήντησεν
  choice: से मिला
  rationale: सन्दर्भ में यह औपचारिक भेंट को सूचित करता है; ‘से मिला’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: दोनों राजाओं से
  rationale: यूनानी पद पहले से सन्दर्भित दो राजाओं को एक निश्चित जोड़े के रूप में बताता है।
- source_word: ἔδωκεν
  choice: दिया … दिए
  rationale: सामान्य अर्थ ‘देना’ ही पर्याप्त है; हिन्दी में अलग कर्मों के साथ वाक्य को स्वाभाविक बनाने के लिए क्रिया दोहराई गई है।
- source_word: ἀργύριον καὶ χρυσίον
  choice: चाँदी और सोना
  rationale: दोनों पदार्थ-संज्ञाओं का सीधा और मानक अनुवाद।
- source_word: τοῖς φίλοις αὐτῶν
  choice: उनके मित्रों
  rationale: मूल शब्द का सामान्य अर्थ सुरक्षित रखा गया है; राजदरबार के सन्दर्भ में यह राजकीय सहयोगियों या दरबारियों को भी सूचित कर सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δόματα πολλά
  choice: बहुत-से उपहार
  rationale: राजनयिक प्रसंग में यह स्वाभाविक हिन्दी है और बहुवचन तथा परिमाण दोनों को व्यक्त करती है।
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: उनकी कृपा प्राप्त की
  rationale: यूनानी मुहावरे का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है, बिना यह निर्धारित किए कि कृपा केवल भाव थी या औपचारिक स्वीकृति।
