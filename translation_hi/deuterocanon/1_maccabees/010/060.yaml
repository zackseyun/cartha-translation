    issue: स्थान-नाम “पतुलिमयिस”
    rationale: Πτολεμαΐς (Ptolemais) is more accurately and naturally transliterated in Hindi as “पतुलमैस”; the draft form inserts an unwarranted syllabic sequence.
  - severity: low
    issue: “इस प्रकार” adds an explicit consequential link
    rationale: The Greek merely coordinates the final clause (καὶ εὗρεν χάριν). “इस प्रकार” can imply that the gifts demonstrably caused the favor, a relation the wording itself does not explicitly state.
  - severity: low
    issue: Footnote c adds “समर्थन” as an explanatory outcome
    rationale: “समर्थन” is a possible contextual consequence but is narrower and more interpretive than χάρις. The note should retain lexical alternatives without adding that implication.
