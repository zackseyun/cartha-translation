base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: hi
  text: मैंने पतुलिमैस और उससे लगे हुए क्षेत्र को यरूशलेम में रहनेवाले पवित्र जनों को भेंट के रूप में दे दिया है[a], पवित्र स्थान के प्रमुख खर्चों के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पतुलिमैस और उससे संबंधित भूभाग” अथवा “पतुलिमैस और उससे जुड़ा हुआ जिला।”
    reason: lexical_alternative
  - marker: b
    text: इस अंतिम खंड का यूनानी पाठ कठिन है। संभव अर्थ है, “पवित्र स्थान के लिए पहले से निर्धारित खर्चों के लिए।” एक अन्य अनुवाद है, “पवित्र जनों के आवश्यक खर्चों के लिए।”
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: पतुलिमैस
  rationale: यूनानी स्थान-नाम का प्रचलित बाइबलीय ढंग से देवनागरी लिप्यंतरण किया गया है।
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: उससे लगे हुए क्षेत्र
  rationale: यह कृदन्तीय पद नगर से जुड़े या सटे भूभाग को सूचित करता है; यह हिंदी में स्वाभाविक और प्रशासनिक-भौगोलिक अर्थ के अनुकूल है।
- source_word: δέδωκα
  choice: मैंने ... दे दिया है
  rationale: यूनानी पूर्णकाल अनुदान की वर्तमान में कायम स्थिति पर बल देता है, जिसे हिंदी का पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है।
- source_word: δόμι
  choice: भेंट के रूप में
  rationale: पाठ का यह रूप असामान्य है, पर प्रसंग में दान या भेंट का अर्थ स्पष्टतः उपयुक्त है।
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: यरूशलेम में रहनेवाले पवित्र जनों को
  rationale: पुल्लिंग/व्यक्तिवाचक बहुवचन रूप को बनाए रखते हुए इसे पवित्र समुदाय अथवा मंदिर से संबद्ध व्यक्तियों के रूप में प्रस्तुत किया गया है; इसे चुपचाप 'पवित्र स्थान' नहीं बनाया गया।
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: ताकि ... प्रमुख खर्च पूरे किए जाएँ
  rationale: प्रेषित यूनानी वाक्यांश कठिन है; προκαθήκουσαν में प्राथमिक, पहले से निर्धारित या आवश्यक व्यय का भाव हो सकता है। 'प्रमुख खर्च' अर्थ को स्वाभाविक हिंदी में रखता है, जबकि पादटिप्पणी अनिश्चितता बताती है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र स्थान के
  rationale: अंतिम दत्तिव बहुवचन का शाब्दिक रूप 'पवित्र जनों के लिए' हो सकता है, पर मंदिर-वित्तीय प्रसंग में पवित्र स्थान या पवित्र सेवा से जुड़े खर्च का अर्थ संभव है; इस निर्णय को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पहले और अंतिम τοῖς ἁγίοις का संदर्भ
  choice: पहला पद पवित्र जनों के लिए और अंतिम पद पवित्र स्थान से संबंधित समझा गया है।
  alternative: दोनों पद पवित्र जनों को सूचित कर सकते हैं; अंतिम पद का अर्थ 'पवित्र वस्तुओं के लिए' भी हो सकता है।
  rationale: पहला पद यरूशलेम में स्थित व्यक्तियों के रूप में व्याकरणतः स्वाभाविक है। अंतिम पद खर्च के संदर्भ में होने के कारण मंदिर अथवा पवित्र सेवा की ओर संकेत कर सकता है, पर यूनानी पाठ की कठिनता के कारण विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। राजकीय अनुदान की औपचारिकता बनाए रखते हुए कठिन यूनानी वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
