base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: hi
  text: और उनमें से कुछ राजा के बड़े दुर्गों में नियुक्त किए जाएँगे। उन्हीं में से कुछ, जो भरोसेमंद हों, राज्य के कार्यों पर नियुक्त किए जाएँगे[a]। उनके ऊपर के अधिकारी और शासक भी उन्हीं में से हों, और वे अपने कानूनों के अनुसार आचरण करें[b], ठीक वैसे ही जैसे राजा ने यहूदा देश में आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज्य की आवश्यकताओं अथवा मामलों की देखरेख के लिए।” यूनानी शब्द का अर्थ आवश्यकताएँ, कार्य या प्रशासनिक मामले हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने कानूनों के अनुसार चलें।” यहाँ “चलना” उनके अनुसार जीवन और आचरण करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  choice: नियुक्त किए जाएँगे / ज़िम्मेदारी सौंपी जाएगी
  rationale: राजकीय और प्रशासनिक प्रसंग में καθίστημι का भाव किसी पद या दायित्व पर नियुक्त करना है। हिंदी में वाक्य के अनुसार दो स्वाभाविक रूप प्रयुक्त किए गए हैं।
- source_word: ὀχυρώμασιν τοῖς μεγάλοις
  choice: बड़े दुर्गों
  rationale: ὀχύρωμα सुदृढ़ किए गए सैन्य स्थान को दर्शाता है; ‘दुर्ग’ संक्षिप्त, स्पष्ट और गरिमापूर्ण हिंदी है।
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: राज्य के कामकाज की ज़िम्मेदारी
  rationale: χρεῖαι का अर्थ आवश्यकताएँ, कार्य या मामले हो सकता है। प्रशासनिक संदर्भ में ‘कामकाज की ज़िम्मेदारी’ स्वाभाविक है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὖσιν εἰς πίστιν
  choice: भरोसेमंद लोगों
  rationale: यहाँ πίστις धार्मिक विश्वास नहीं, बल्कि राजकीय सेवा के योग्य विश्वसनीयता को व्यक्त करता है।
- source_word: οἱ ἐπʼ αὐτῶν
  choice: उन पर नियुक्त अधिकारी
  rationale: यूनानी वाक्यांश संक्षिप्त रूप से उनके ऊपर अधिकार रखने वालों को दर्शाता है; यह अनुवाद संबंध को स्पष्ट करता है पर पद का अनावश्यक विशेषीकरण नहीं करता।
- source_word: οἱ ἄρχοντες
  choice: शासक
  rationale: ἄρχοντες शासन या अधिकार रखने वाले व्यक्तियों के लिए व्यापक शब्द है; ‘शासक’ राजकीय आदेश की औपचारिक शैली के अनुरूप है।
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: अपने कानूनों के अनुसार आचरण करें
  rationale: शाब्दिक ‘चलें’ यहाँ जीवन और व्यवहार को कानूनों के अनुरूप रखने का मुहावरा है; ‘आचरण करें’ आधुनिक हिंदी में उसका अर्थ स्पष्ट करता है।
- source_word: ἐν γῇ Ἰούδα
  choice: यहूदा देश में
  rationale: यह यूनानी के ‘यहूदा की भूमि में’ भाव को बनाए रखता है और ‘यहूदिया’ जैसे अधिक व्याख्यात्मक भौगोलिक रूप से बचता है।
theological_decisions:
- issue: प्रशासनिक संदर्भ में πίστις-संबंधी भाषा
  choice: भरोसेमंद
  alternative: विश्वासयोग्य / विश्वास रखने वाले
  rationale: εἰς πίστιν यहाँ राजकीय दायित्व निभाने की विश्वसनीयता बताता है, न कि धार्मिक विश्वास; इसलिए प्रशासनिक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में राजकीय आदेश के अनुरूप गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है; आदेशात्मक और भविष्यकालीन बल सुरक्षित है।
