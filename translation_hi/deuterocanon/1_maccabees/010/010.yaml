translation:
  language: hi
  text: और योनातान यरूशलेम में रहने लगा, और उसने नगर का निर्माण और नवीनीकरण करना आरम्भ किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾤκησεν
  choice: रहने लगा
  rationale: संदर्भ में योनातान के यरूशलेम में निवास स्थापित करने का स्वाभाविक हिन्दी रूप; साधारण भूतकाल ‘रहा’ की तुलना में प्रसंगगत आरम्भ को भी व्यक्त करता है।
- source_word: οἰκοδομεῖν
  choice: निर्माण करना
  rationale: नगर में निर्माण-कार्य करने के सामान्य अर्थ को बनाए रखता है, बिना यह जोड़े कि पूरा नगर नए सिरे से बनाया गया।
- source_word: καινίζειν
  choice: नवीनीकरण करना
  rationale: यूनानी क्रिया का अर्थ नया करना या फिर से दुरुस्त करना है; ‘नवीनीकरण’ इस अर्थ को व्यक्त करता है और इसे केवल ‘पुनर्स्थापित करना’ तक सीमित नहीं करता।
