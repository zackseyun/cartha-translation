lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सामान्य संयोजक; यूनानी कथन की सरल, समन्वयात्मक प्रवाह-शैली को बनाए रखता है।
- source_word: ἤκουσεν
  choice: ने…सुनीं
  rationale: ἀκούω के एओरिस्ट का यहाँ सीधा कथात्मक अर्थ किसी कही गई बात को सुनना है।
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में स्रोत-आधारित लिप्यंतरण।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι का अर्थ ‘शब्द’, ‘कथन’ या ‘बातें’ हो सकता है; इस संदर्भ में आधुनिक हिन्दी में ‘ये बातें’ स्वाभाविक है और कही गई बातों के अर्थ को सुरक्षित रखता है।
- source_word: καὶ
  choice: और…
  rationale: दिया गया यूनानी स्रोत दूसरे संयोजक पर अधूरा समाप्त होता है; ‘और…’ उस अपूर्णता को बिना कुछ जोड़े स्पष्टतः बनाए रखता है।
