base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: hi
  text: और सामरिया के भूभाग से यहूदिया में मिलाए गए तीन जिलों[a] को यहूदिया के साथ जोड़ दिया जाए, ताकि वे एक ही इकाई माने जाएँ[b] और महायाजक के अधिकार के सिवा किसी और सत्ता के अधीन न हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तीन नोम’; यह जिलों के लिए प्रयुक्त हेलेनिस्टिक प्रशासनिक शब्द है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘एक के अधीन हो जाएँ’, अर्थात उन्हें एक प्रशासनिक इकाई माना जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: जिलों
  rationale: यहाँ νόμος का अर्थ ‘व्यवस्था’ या ‘कानून’ नहीं, बल्कि हेलेनिस्टिक प्रशासनिक भूभाग है। ‘जिले’ आधुनिक हिन्दी में इस भौगोलिक-प्रशासनिक अर्थ को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: προστεθέντας / προστεθήτω
  choice: मिलाए गए / जोड़ दिया जाए
  rationale: पहला रूप पहले हो चुके भूभागीय समावेश को और दूसरा राजकीय आदेश को व्यक्त करता है। अलग-अलग हिन्दी क्रियाएँ इस भेद को स्वाभाविक ढंग से बनाए रखती हैं।
- source_word: χώρας
  choice: प्रदेश
  rationale: संदर्भ में χώρα सामरिया के भूक्षेत्र या प्रादेशिक अधिकार-क्षेत्र को सूचित करता है; ‘प्रदेश’ इस प्रशासनिक संदर्भ के अनुकूल है।
- source_word: πρὸς τὸ λογισθῆναι
  choice: ताकि वे ... माने जाएँ
  rationale: यह प्रयोजनसूचक रचना है। ‘माने जाएँ’ λογίζομαι के आधिकारिक गणना या मान्यता दिए जाने के भाव को स्पष्ट हिन्दी में रखता है।
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: एक ही इकाई
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है, जिसका शाब्दिक भाव ‘एक के अधीन होना’ है। प्रशासनिक संदर्भ में ‘एक ही इकाई’ अभिप्रेत एकीकरण को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- source_word: ὑπακοῦσαι
  choice: अधीन हों
  rationale: यद्यपि क्रिया का सीधा अर्थ ‘आज्ञा मानना’ है, भूभागों के विषय में हिन्दी में ‘सत्ता के अधीन होना’ अधिक स्वाभाविक है और आज्ञापालन का प्रशासनिक भाव बनाए रखता है।
- source_word: ἄλλης ἐξουσίας
  choice: किसी और सत्ता
  rationale: ἐξουσία यहाँ शासनाधिकार या अधिकार-क्षेत्र को दर्शाता है। ‘सत्ता’ कानूनी-प्रशासनिक व्यापकता को संक्षेप में व्यक्त करता है।
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: महायाजक के अधिकार के सिवा
  rationale: सम्बन्धकारक रूप का आशय महायाजक के अधिकार से है। हिन्दी में ‘अधिकार’ जोड़ने से स्पष्ट होता है कि अपवाद व्यक्ति मात्र नहीं, उसका अधिकार-क्षेत्र है।
theological_decisions:
- issue: राजादेश में महायाजक की भूमिका का स्वरूप
  choice: पद को भूभागीय और प्रशासनिक अधिकार के संदर्भ में प्रस्तुत किया गया है।
  alternative: इसे महायाजक के प्रति व्यापक धार्मिक और नागरिक अधीनता का कथन समझा जा सकता है।
  rationale: यूनानी पाठ भूभागों के जोड़े जाने और अन्य सत्ता की अधीनता न मानने की बात करता है। इसलिए अनुवाद कानूनी-प्रशासनिक आशय को बनाए रखता है और पद के धार्मिक दायरे के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, राजकीय आदेश के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जिले’, ‘प्रदेश’, ‘सत्ता’ और ‘अधिकार’ प्रशासनिक संदर्भ को उभारते हैं; कठिन हेलेनिस्टिक पद और संक्षिप्त यूनानी वाक्यांश पादटिप्पणियों में सुरक्षित हैं।
