translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लम्बे यूनानी वाक्य को हिन्दी में अर्धविराम से व्यवस्थित किया गया है। आरम्भिक ἀντί को अलग से ‘के बदले’ नहीं दोहराया गया, क्योंकि इस राजस्व-मुक्ति संदर्भ में हिन्दी का ‘...में से जो मुझे मिलना है, उसे छोड़ता हूँ’ वही संबंध अधिक स्वाभाविक ढंग से व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
