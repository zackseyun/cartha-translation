base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: hi
  text: और बोआई की उपज के एक-तिहाई भाग[a] के बदले, और पेड़ों के फलों के आधे भाग के बदले, जिन्हें वसूल करने का मुझे अधिकार है, मैं आज से उन्हें यहूदा देश और सामरिया तथा गलील से उसमें मिलाए गए तीन जिलों[c] से वसूल नहीं करूँगा—आज से सदा तक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “फसलों का एक-तिहाई भाग।” यूनानी में शाब्दिक रूप से “बोआई का तीसरा भाग” है।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात राजा को देय राजकीय हिस्सा या कर अब नहीं लिया जाएगा।
    reason: cultural_note
  - marker: c
    text: “जिलों” के लिए यूनानी शब्द नोमोई है, जिसका अर्थ प्रशासनिक क्षेत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  choice: बोआई की उपज के तीसरे भाग
  rationale: σπορά का मूल अर्थ बोआई/बीज-बोना है, पर राजस्व-संदर्भ में इससे बोई हुई फसल की उपज पर लगने वाला एक-तिहाई अंश अभिप्रेत है। यह रूप मूल बिंब और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: ἀντὶ τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: पेड़ों के फलों के आधे भाग
  rationale: ξύλινον यहाँ पेड़ों से मिलने वाली उपज को सूचित करता है; शाब्दिक किन्तु अस्वाभाविक रूप से बचते हुए अर्थ स्पष्ट रखा गया है।
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: जो मुझे मिलना है
  rationale: राजकोषीय संदर्भ में यह राजा को देय या उसके हिस्से में आने वाली राशि/उपज है। सहज हिन्दी में अधिकार का भाव रखा गया है, पर जबरन वसूली का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: ἀφίημι
  choice: छोड़ता हूँ
  rationale: यहाँ राजा अपने राजस्व-दावे को त्याग रहा है। ‘माफ़ करता हूँ’ नैतिक अपराध का संकेत दे सकता है और ‘परिहार करता हूँ’ सामान्य पाठक के लिए अधिक तकनीकी है।
- source_word: τοῦ λαβεῖν
  choice: अब ... नहीं लिया जाएगा
  rationale: यूनानी articular infinitive उस वसूली को बताता है जिसे समाप्त किया जा रहा है। हिन्दी में निषेधात्मक कर्मवाच्य से आशय स्पष्ट और स्वाभाविक बनता है।
- source_word: γῆς Ἰούδα
  choice: यहूदा देश
  rationale: भौगोलिक अभिव्यक्ति को मूल के निकट तथा आधुनिक हिन्दी में बोधगम्य रखा गया है।
- source_word: τῶν τριῶν νομῶν
  choice: तीन जिलों
  rationale: νομοί प्रशासनिक इकाइयाँ हैं; ‘जिले’ सामान्य पाठक के लिए स्पष्ट है, जबकि तकनीकी ‘नोम’ अपरिचित होगा।
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: उसमें मिलाए गए
  rationale: तीनों जिलों के यहूदा में जोड़े जाने का अर्थ सरल और तटस्थ ढंग से व्यक्त होता है; ‘विलय किए गए’ अनावश्यक रूप से अधिक तकनीकी होता।
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: सामरिया तथा गलील से
  rationale: तीनों जिले जिन क्षेत्रों से लेकर यहूदा में जोड़े गए थे, उन मानक भौगोलिक नामों को रखा गया है।
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: सदा तक
  rationale: स्थायी अवधि का औपचारिक पर सहज हिन्दी रूप।
