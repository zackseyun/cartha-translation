translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। विवाह-संबंधी यूनानी क्रिया का आशय मुख्य पाठ में स्पष्ट किया गया है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
