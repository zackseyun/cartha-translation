  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: hi
  text: तब राजा सिकन्दर उससे मिला और उसने अपनी बेटी क्लियोपात्रा को उसके साथ विवाह में दे दिया। उसने प्टोलेमाइस में उसका विवाहोत्सव राजाओं की रीति के अनुसार बड़े वैभव के साथ आयोजित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήντησεν
  choice: उससे मिला
  rationale: क्रिया का सामान्य अर्थ ‘मिलना’ या ‘मिलने जाना’ है। यहाँ ‘उससे मिला’ स्वाभाविक है और गति की दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐξέδοτο
  choice: अपनी बेटी क्लियोपात्रा का विवाह उसके साथ कर दिया
  rationale: विवाह के प्रसंग में यह क्रिया बेटी को विवाह में देने का स्पष्ट अर्थ रखती है। हिन्दी में यह अभिव्यक्ति उस वैवाहिक अर्थ को स्वाभाविक और स्पष्ट बनाती है।
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: उसने उसका विवाह ... सम्पन्न कराया
  rationale: ποιέω और γάμος का मेल विवाह आयोजित या सम्पन्न कराने को दर्शाता है। यह अनुवाद आयोजन के भाव को व्यक्त करता है, बिना केवल विवाह-भोज तक अर्थ सीमित किए।
- source_word: ἐν Πτολεμαΐδι
  choice: पतुलिमयिस में
  rationale: स्थान-नाम का हिन्दी बाइबलीय लिप्यंतरण चुना गया है।
- source_word: καθὼς οἱ βασιλεῖς
  choice: राजाओं की रीति के अनुसार
  rationale: तुलनात्मक वाक्यांश राजकीय प्रथा या ढंग को सूचित करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐν δόξῃ μεγάλῃ
  choice: बड़े वैभव के साथ
  rationale: यहाँ δόξα धार्मिक ‘महिमा’ के बजाय विवाह समारोह की भव्यता, प्रतिष्ठा और राजसी ठाठ को दर्शाता है।
