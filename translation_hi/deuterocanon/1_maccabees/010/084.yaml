  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। व्यक्तिनाम ‘योनातान’ और देवतानाम ‘दागोन’ के प्रचलित हिन्दी बाइबलीय रूप लिए गए हैं। यूनानी पाठ की असामान्य पुनरुक्ति को सुचारु बनाने के नाम पर हटाया नहीं गया।
