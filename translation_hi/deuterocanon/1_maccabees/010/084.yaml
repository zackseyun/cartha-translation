base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: hi
  text: और योनातान ने अज़ोतुस[a] और उसके आस-पास के नगरों को आग लगा दी और उनकी लूट ले ली; उसने दागोन के मन्दिर और उसके मन्दिर[b] को आग में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अज़ोतुस, अशदोद नाम का यूनानी रूप है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में ‘मन्दिर’ शब्द दोहराया गया है; शाब्दिक रूप से, ‘दागोन के मन्दिर और उसके मन्दिर को उसने आग में जला दिया।’ ‘उसके’ का संकेत अज़ोतुस नगर की ओर हो सकता है, पर वाक्य की असहजता और अस्पष्टता मूल पाठ के अनुसार रखी गई है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: आग लगा दी / आग में जला दिया
  rationale: क्रिया का अर्थ आग लगाना या जला देना है। दोनों प्रयोगों में मूल अर्थ समान रखते हुए हिन्दी में प्रसंगानुकूल स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: Ἄζωτον
  choice: अज़ोतुस
  rationale: यह यूनानी स्थान-नाम Ἄζωτος का देवनागरी लिप्यंतरण है; अधिक परिचित इब्रानी रूप ‘अशदोद’ पादटिप्पणी में दिया गया है।
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: उसके आस-पास के नगरों
  rationale: κύκλῳ स्थानगत घेराव या निकटवर्ती क्षेत्र दर्शाता है; यह आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: τὰ σκῦλα αὐτῶν
  choice: उनकी लूट
  rationale: σκῦλα युद्ध में छीनी गई वस्तुओं या युद्ध-लूट को दर्शाता है; αὐτῶν को ‘उनकी’ से व्यक्त किया गया है।
- source_word: τὸ ἱερὸν Δαγὼν
  choice: दागोन के मन्दिर
  rationale: ἱερόν यहाँ देवता दागोन के मन्दिर या पवित्र-स्थान को सूचित करता है; ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὸ ἱερὸν αὐτῆς
  choice: उसके मन्दिर
  rationale: उपलब्ध यूनानी पाठ दूसरे ἱερόν और स्त्रीलिंग सर्वनाम αὐτῆς को दोहराता है। ‘उसके मन्दिर’ इस असहज किंतु वास्तविक पुनरुक्ति और सर्वनाम की संदर्भगत अस्पष्टता को सुरक्षित रखता है; इसे अप्रमाणित बहुवचन ‘देवालयों’ में नहीं बदला गया।
- source_word: ἐν πυρί
  choice: आग में
  rationale: यह आग द्वारा जलाने की क्रिया को बल देता है। ‘आग में जला दिया’ हिन्दी में स्पष्ट रहते हुए यूनानी अभिव्यक्ति की पुनरुक्ति को भी कुछ हद तक बनाए रखता है।
