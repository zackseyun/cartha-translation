  text: और योनातान समझ गया कि उसके पीछे घात लगी हुई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: समझ गया
  rationale: γινώσκω के एओरिस्ट रूप का अर्थ यहाँ युद्ध के बीच किसी बात का तत्काल बोध होना है। ‘समझ गया’ आधुनिक हिन्दी में इस घटनात्मक पहचान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔνεδρον
  choice: घात
  rationale: ἔνεδρον छिपकर आक्रमण करने की व्यवस्था या घात में बैठे दल को सूचित कर सकता है। ‘घात’ संक्षिप्त, स्वाभाविक और मूल की सामूहिक अस्पष्टता को बनाए रखता है।
- source_word: κατόπισθεν αὐτοῦ
  choice: उसके पीछे
  rationale: यह पदबंध योनातान के पीछे की स्थिति बताता है। ‘उसके पीछे’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: καὶ
  choice: और
  rationale: καὶ इस वाक्य को पूर्ववर्ती कथा-क्रम से सामान्य रूप से जोड़ता है; ‘और’ बिना अतिरिक्त कारणात्मक या कालगत अर्थ जोड़े इस संबंध को बनाए रखता है।
- source_word: ἐστιν
  choice: लगी हुई है
  rationale: वर्तमानकालीन ἐστιν को हिन्दी के स्वाभाविक मुहावरे ‘घात लगी हुई है’ में व्यक्त किया गया है, जो उस समय विद्यमान घात की स्थिति बताता है।
