base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: hi
  text: “और अब आज हमने तुम्हें तुम्हारे राष्ट्र का महायाजक नियुक्त किया है और तुम्हें ‘राजा का मित्र’[a] की उपाधि दी है”—और उन्होंने उसे बैंगनी वस्त्र और सोने का मुकुट भेजा[b]—“और तुम हमारा पक्ष लो[c] और हमारे साथ मित्रता बनाए रखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजा का मित्र’ सम्भवतः हेलेनिस्ती राजदरबार की एक औपचारिक उपाधि थी; इसका अनुवाद ‘राजा का मित्र कहलाओ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ यहाँ पहले पुरुष के राजकीय कथन (‘हमने नियुक्त किया’) से तृतीय पुरुष के वर्णन (‘उन्होंने उसे भेजा’) पर चला जाता है; अनुवाद में यह बदलाव सुरक्षित रखा गया है।
    reason: textual_variant
  - marker: c
    text: शाब्दिक रूप से, ‘हमारी बातें सोचो’; इस मुहावरे का अर्थ है हमारे हितों के अनुकूल रहना या हमारा पक्ष लेना।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: हमने ... नियुक्त किया है
  rationale: पूर्णकालिक क्रिया औपचारिक पद-स्थापना बताती है; आधुनिक हिन्दी में ‘नियुक्त किया है’ स्वाभाविक और सटीक है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह यहूदी धार्मिक पद का प्रचलित और सटीक हिन्दी नाम है।
- source_word: τοῦ ἔθνους σου
  choice: तुम्हारे राष्ट्र का
  rationale: ἔθνος यहाँ राजनीतिक-सामुदायिक इकाई का बोध कराता है; ‘राष्ट्र’ इस अर्थ को बनाए रखता है।
- source_word: φίλον βασιλέως καλεῖσθαι
  choice: ‘राजा का मित्र’ कहलाने का अधिकार दिया है
  rationale: वाक्य में यह राजदरबार की औपचारिक उपाधि है। हिन्दी में केवल ‘कहलाने’ वाला असंबद्ध क्रियार्थक रूप अस्वाभाविक होता, इसलिए नियुक्ति के आशय को स्पष्ट करने हेतु ‘अधिकार दिया है’ जोड़ा गया है।
- source_word: πορφύραν
  choice: बैंजनी वस्त्र
  rationale: शब्द बैंजनी कपड़े या परिधान का संकेत कर सकता है; राजकीय उपहार के प्रसंग में ‘वस्त्र’ पर्याप्त स्पष्ट है और ‘चोगा’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: στέφανον χρυσοῦν
  choice: सोने का मुकुट
  rationale: अभिषेक या सम्मान के इस प्रसंग में ‘मुकुट’ στέφανος का स्वाभाविक हिन्दी रूप है।
- source_word: φρονεῖν τὰ ἡμῶν
  choice: हमारा पक्ष लो
  rationale: शाब्दिक अर्थ ‘हमारी बातें सोचना’ है, पर राजनीतिक मुहावरे का आशय हमारे हितों के अनुकूल रहना या हमारा पक्ष लेना है।
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: हमारे साथ मित्रता बनाए रखो
  rationale: यह निरंतर कूटनीतिक मैत्री और निष्ठा का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέστειλαν αὐτῷ
  choice: उन्होंने उसके पास ... भेजा
  rationale: उपलब्ध यूनानी पाठ का तृतीय पुरुष बहुवचन और ‘उसके’ वाला कथात्मक बदलाव ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: φίλον βασιλέως का राजदरबारी स्वरूप
  choice: ‘राजा का मित्र’ को उद्धरण-चिह्नों में औपचारिक उपाधि की तरह प्रस्तुत किया
  alternative: राजा का दोस्त; राजमित्र
  rationale: यह निजी स्नेह की अपेक्षा हेलेनिस्ती राजदरबार की पदवी होने की संभावना रखता है; चुना हुआ रूप अर्थ को पारदर्शी रखते हुए उस औपचारिकता का संकेत देता है।
- issue: ἀπέστειλαν αὐτῷ में पुरुष का अचानक बदलाव
  choice: पहले पुरुष के राजकीय कथन से तृतीय पुरुष कथन में बदलाव सुरक्षित रखा
  alternative: ‘हमने तुम्हारे पास भेजा’ कहकर वाक्य को समरूप बनाना
  rationale: प्रदत्त यूनानी पाठ स्पष्ट रूप से ‘उन्होंने उसके पास भेजा’ कहता है। उपलब्ध प्रमाण के बिना पाठ को सहज बनाने के लिए उसका सामंजस्य नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। राजकीय आदेश की औपचारिकता के लिए ‘राष्ट्र’, ‘महायाजक’ और ‘नियुक्त’ प्रयुक्त हुए हैं। मुख्य पाठ में वक्ताओं की पहचान स्पष्ट रखने हेतु उद्धरण-चिह्न लगाए गए हैं, पर यूनानी स्रोत में मौजूद पहले पुरुष से तृतीय पुरुष का असहज बदलाव नहीं मिटाया गया।
