  yaml_path: translation/deuterocanon/1_maccabees/010/069.yaml
  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: hi
  text: और देमेत्रियुस ने अपोल्लोनियुस को, जो कोइले-सिरिया का अधिकारी था, नियुक्त किया। उसने एक बड़ा सैन्य-दल[a] इकट्ठा किया और यम्निया में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बड़ी सेना।” यूनानी शब्द δύναμις व्यापक अर्थ में सैन्य-बल या सैन्य-दल को सूचित कर सकता है, केवल औपचारिक रूप से संगठित सेना को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: नियुक्त किया
  rationale: प्रशासनिक संदर्भ में यह क्रिया किसी व्यक्ति को पद या अधिकार की भूमिका में स्थापित करने का बोध देती है; ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: जो कोइले-सिरिया का अधिकारी था
  rationale: यह पदबंध अपोल्लोनियुस की शासकीय भूमिका बताता है। ‘अधिकारी था’ अधिकार का भाव बनाए रखता है, पर उसके पद की प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: क्रिया का मूल अर्थ लोगों या वस्तुओं को एक साथ लाना है। सैन्य-दल के साथ ‘इकट्ठा किया’ सहज हिन्दी है और ‘सेना जुटाई’ की अपेक्षा मूल शब्द के निकट है।
- source_word: δύναμιν μεγάλην
  choice: एक बड़ा सैन्य-दल
  rationale: δύναμις यहाँ सशस्त्र सैन्य-बल को सूचित करता है, पर अनिवार्य रूप से औपचारिक ‘सेना’ ही नहीं। ‘सैन्य-दल’ इस व्यापकता को बनाए रखता है।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: यह सैन्य संदर्भ में छावनी लगाने या डेरा डालने की मानक क्रिया है। ‘पड़ाव डाला’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य कथा का भाव रखता है।
- source_word: ἐν Ἰαμνείᾳ
  choice: यम्निया में
  rationale: ἐν का सीधा स्थानवाचक अर्थ ‘में’ है; स्थाननाम को प्रचलित निकट लिप्यंतरण ‘यम्निया’ के रूप में रखा गया है।
