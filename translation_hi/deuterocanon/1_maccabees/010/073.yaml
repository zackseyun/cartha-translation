base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/073.yaml
  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: hi
  text: और अब तुम मैदान में घुड़सवार सेना[a] और इतनी बड़ी सैन्य-शक्ति का सामना नहीं कर सकोगे, जहाँ न कोई पत्थर है, न कंकड़, और न भाग निकलने की कोई जगह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘घोड़ा’ है; यहाँ एकवचन शब्द सामूहिक अर्थ में घुड़सवार सेना या घुड़सवार सैनिकों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: नहीं कर सकोगे
  rationale: भविष्यकालीन असमर्थता को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ὑποστῆναι
  choice: सामना करना
  rationale: सैन्य प्रसंग में डटकर विरोध करने का अर्थ देता है; ‘सामना करना’ साधारण आधुनिक हिन्दी में सक्रिय प्रतिरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ἵππον
  choice: घुड़सवार सेना
  rationale: यूनानी में एकवचन सामूहिक प्रयोग है, जो सैन्य घुड़सवार दल को सूचित करता है; हिन्दी में ‘घुड़सवार सेना’ सटीक और सहज है।
- source_word: δύναμιν τοσαύτην
  choice: इतनी बड़ी सैन्य-शक्ति
  rationale: δύναμις यहाँ अमूर्त सामर्थ्य नहीं, लड़ाकू बल को दर्शाता है; ‘सैन्य-शक्ति’ इसे घुड़सवार सेना से अलग किंतु व्यापक सैन्य बल के रूप में बनाए रखता है।
- source_word: ἐν τῷ πεδίῳ
  choice: मैदान में
  rationale: समतल और खुली भूमि का संकेत देता है तथा आगे बताए गए भू-भाग के अभाव से स्वाभाविक रूप से जुड़ता है।
- source_word: λίθος
  choice: पत्थर
  rationale: मूल सामान्य शब्द का सीधा अनुवाद है और इसे छोटे κόχλας से अलग रखता है।
- source_word: κόχλας
  choice: कंकड़
  rationale: छोटे पत्थरों का अर्थ देता है और λίθος के साथ मूल में उपस्थित आकारगत भेद सुरक्षित रखता है।
- source_word: τόπος τοῦ φυγεῖν
  choice: भाग निकलने की कोई जगह
  rationale: पलायन अथवा बच निकलने की संभावना व्यक्त करने वाले यूनानी पदबंध का स्वाभाविक हिन्दी रूप है।
