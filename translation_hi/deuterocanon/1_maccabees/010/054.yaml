    issue: The main text omits “और” in “और अब” (καὶ νῦν).
    rationale: The Greek explicitly coordinates this new request with the preceding proposal; restoring it improves formal fidelity.
  - severity: low
    issue: “तब” is added before “मैं विवाह के द्वारा…”.
    rationale: The Greek has a simple coordination (“and I will”), not an explicitly sequential consequence. “और मैं” is closer and equally natural.
  - severity: low
    issue: “भेंट” is singular whereas δόματα is plural.
    rationale: Hindi should use “भेंटें” to retain the source number.
