  terminology: “मित्रता” properly preserves φιλία without prematurely narrowing it to a formal alliance; the footnote appropriately notes the diplomatic possibility. “भेंटें” preserves the plural δόματα. The footnotes are well anchored and accurately describe the lexical alternatives.
  issues:
