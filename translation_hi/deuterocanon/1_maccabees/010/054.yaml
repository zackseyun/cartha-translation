base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/054.yaml
  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: hi
  text: और हम उसके साथ मित्रता स्थापित करें।[a] और अब अपनी बेटी मुझे पत्नी के रूप में दे दो, और मैं विवाह के द्वारा तुम्हारा संबंधी बन जाऊँगा,[b] और तुम्हें और उसे तुम्हारी गरिमा के अनुरूप भेंटें दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम उसके साथ मैत्री-संधि करें।” यूनानी में शाब्दिक अर्थ “मित्रता” है, पर इस राजकीय प्रसंग में राजनयिक गठबंधन भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुम्हारे परिवार में विवाह करूँगा।” यूनानी क्रिया विवाह के द्वारा पारिवारिक संबंध में आने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: हम ... स्थापित करें
  rationale: प्रेरणार्थक संभावनार्थक क्रिया एक साझा प्रस्ताव व्यक्त करती है; ‘स्थापित करें’ संबंध आरम्भ करने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: φιλίαν
  choice: मित्रता
  rationale: यूनानी शब्द का मूल अर्थ ‘मित्रता’ है। राजनयिक प्रसंग में इसमें राजनीतिक मैत्री या गठबंधन का भाव हो सकता है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: अपनी बेटी मुझे पत्नी के रूप में दे दो
  rationale: यह विवाह-संबंधी सूत्र की सीधी अभिव्यक्ति है और मूल के राजवंशीय तथा लेन-देन जैसे स्वर को बिना कठोर अस्वाभाविकता के बनाए रखती है।
- source_word: ἐπιγαμβρεύσω
  choice: मैं विवाह के द्वारा तुम्हारा संबंधी बन जाऊँगा
  rationale: क्रिया विवाह के द्वारा ससुराली नातेदारी में प्रवेश करने को बताती है, केवल बेटी से विवाह करने की क्रिया को नहीं।
- source_word: δόματα
  choice: भेंट
  rationale: मूल संज्ञा सामान्य रूप से उपहार या भेंट को दर्शाती है; ‘विवाह की भेंट’ कहना संदर्भ से संभव है, पर मूल में स्पष्ट नहीं।
- source_word: ἄξιά σου
  choice: तुम्हारी प्रतिष्ठा के अनुरूप
  rationale: शाब्दिक ‘तुम्हारे योग्य’ हिन्दी में अस्पष्ट हो सकता है; यह चयन पिता के पद, गरिमा और प्रतिष्ठा के अनुरूप भेंट देने का आशय स्पष्ट करता है।
