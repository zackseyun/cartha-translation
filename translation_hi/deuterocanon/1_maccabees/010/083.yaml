base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: hi
  text: और घुड़सवार सेना मैदान में तितर-बितर हो गई। वे अज़ोत भाग गए और अपने को बचाने के लिए अपनी मूर्ति के मंदिर, बेत-दागोन, में जा घुसे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “बेत-दागोन, उनकी मूर्ति, में।” यूनानी में समानाधिकरण संक्षिप्त है; आशय उस उपासना-स्थल से है जो उनकी मूर्ति से संबद्ध था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: घुड़सवार सेना
  rationale: एकवचन रूप होते हुए भी सैन्य प्रसंग में यह सामूहिक रूप से अश्वारोही दल का संकेत करता है; इसलिए ‘घुड़सवार सेना’ स्वाभाविक और स्पष्ट है।
- source_word: ἐσκορπίσθη
  choice: तितर-बितर हो गई
  rationale: कर्मवाच्य क्रिया बताती है कि सेना का गठन टूट गया और वह मैदान में बिखर गई।
- source_word: ἐν τῷ πεδίῳ
  choice: मैदान में
  rationale: πεδίον यहाँ समतल खुले युद्धक्षेत्र को सूचित करता है; आधुनिक हिन्दी में ‘मैदान’ सहज है।
- source_word: ἔφυγον εἰς Ἄζωτον
  choice: वे अज़ोत भाग गए
  rationale: ग्रीक साक्ष्य के स्थान-नाम Ἄζωτον का रूप बनाए रखते हुए गंतव्य और पलायन दोनों स्पष्ट किए गए हैं।
- source_word: Βηθδαγὼν
  choice: बेत-दागोन
  rationale: इसे स्थान अथवा देवालय के नाम के रूप में लिप्यंतरित किया गया है; अगला पदबंध इसका उपासना-स्थल होना स्पष्ट करता है।
- source_word: τὸ εἴδωλον αὐτῶν
  choice: अपने देवमंदिर
  rationale: शाब्दिक अर्थ ‘उनकी मूर्ति’ है, पर संकुचित समानाधिकरण में प्रवेश किए जा सकने वाले बेत-दागोन को उनकी मूर्ति से संबद्ध देवालय बताया गया है। ‘देवमंदिर’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक बनावट सुरक्षित रखती है।
- source_word: τοῦ σωθῆναι
  choice: अपने आप को बचाने के लिए
  rationale: संज्ञीकृत अनंत क्रिया उद्देश्य प्रकट करती है; प्रसंग में वे रक्षा अथवा प्राणरक्षा पाने के लिए भीतर गए।
theological_decisions:
- issue: पलिश्ती उपासना-स्थल के संदर्भ में εἴδωλον का अनुवाद
  choice: मुख्य पाठ में ‘देवमंदिर’, शाब्दिक अर्थ पादटिप्पणी में
  alternative: ‘उनकी मूर्ति’ अथवा ‘उनकी मूर्ति का मंदिर’
  rationale: ग्रीक εἴδωλον का नकारात्मक मूल्यांकन महत्त्वपूर्ण है, लेकिन वाक्य में Βηθδαγών के साथ संकुचित समानाधिकरण है और लोग उसके भीतर प्रवेश करते हैं। मुख्य पाठ स्वाभाविक हिन्दी में स्थल का आशय देता है; पादटिप्पणी ‘मूर्ति’ शब्द और मूल की वास्तविक संक्षिप्तता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जा घुसे’ पलायन कर शरण लेने की तात्कालिकता व्यक्त करता है। स्थान-नाम सीधे यूनानी रूपों के आधार पर ‘अज़ोत’ और ‘बेत-दागोन’ दिए गए हैं।
