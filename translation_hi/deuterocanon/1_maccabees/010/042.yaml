base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: hi
  text: और इनके अतिरिक्त, चाँदी के वे पाँच हज़ार शेकेल भी माफ़ किए जाते हैं, जिन्हें वे पहले के वर्षों की तरह पवित्रस्थान के वार्षिक लेखे से राजस्व में से लिया करते थे, क्योंकि वे सेवा करने वाले याजकों के हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘पवित्रस्थान’, ‘लेखा’ और ‘हर साल’ का संबंध संक्षिप्त और कुछ अस्पष्ट है। अनुवाद “पवित्रस्थान के खाते से हर साल” या “पवित्रस्थान के वार्षिक हिसाब से” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: चाँदी के पाँच हज़ार शेकेल
  rationale: प्राचीन मौद्रिक इकाई को परिवर्तित किए बिना रखा गया है और हिन्दी में स्वाभाविक क्रम अपनाया गया है।
- source_word: ἐλάμβανον
  choice: लिया करते थे
  rationale: अपूर्ण भूतकाल किसी बीती हुई नियमित प्रथा को दर्शाता है।
- source_word: ἀπὸ τῶν χρειῶν
  choice: राजस्व में से
  rationale: इस वित्तीय संदर्भ में χρεῖαι का अर्थ आवश्यकताएँ नहीं, बल्कि आय या राजस्व है।
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: पहले के वर्षों की तरह
  rationale: यह विगत वर्षों में चली आ रही प्रथा से तुलना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἁγίου
  choice: पवित्रस्थान
  rationale: मंदिर और उसकी उपासना-संबंधी व्यवस्था का संकेत सुरक्षित रहता है, बिना किसी विशेष भाग को अनावश्यक रूप से निश्चित किए।
- source_word: ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: हर साल ... पवित्रस्थान के खाते से
  rationale: प्रशासनिक λόγος को वित्तीय खाते के अर्थ में लिया गया है; यूनानी पदबंध की संक्षिप्तता और अनिश्चित संबंध को पादटिप्पणी में बनाए रखा गया है।
- source_word: ἀφίεται
  choice: माफ़ किए जाते हैं
  rationale: कर अथवा राजस्व-संबंधी दायित्व को छोड़ देने या निरस्त करने का भाव आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: क्योंकि वे ... के हैं
  rationale: यह धन पर याजकों के उचित अधिकार या उससे उसके संबंध को सरलता से व्यक्त करता है।
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: सेवा करनेवाले याजकों
  rationale: λειτουργέω के पवित्रस्थान में की जानेवाली याजकीय सेवा के भाव को सुरक्षित रखता है।
