base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: hi
  text: पर जब योनातान ने अपुल्लोनियुस की बातें सुनीं, तो उसका मन उद्वेलित हो उठा[a]। उसने दस हज़ार पुरुषों को चुना और यरूशलेम से निकल पड़ा। उसका भाई शमौन उसकी सहायता करने के लिए उससे आ मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके मन में हलचल मच गई,” अथवा “उसका मन उत्तेजित हो उठा।” यूनानी में भीतरी हलचल या उद्वेलन का भाव है, लेकिन यह नहीं बताया गया कि ठीक कौन-सी भावना थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: पर जब ... ने ... सुनीं
  rationale: ὡς के साथ भूतकालिक क्रिया समय-संबंधी अर्थ ‘जब’ देती है, और δέ कथा में हल्का संक्रमण दिखाता है; ‘पर जब’ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: अपुल्लोनियुस की बातें
  rationale: λόγοι यहाँ अपुल्लोनियुस द्वारा कही गई बातों या चुनौती को दर्शाता है। ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल औपचारिक संदेश मानकर सीमित नहीं करता।
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: उसका मन उद्वेलित हो उठा
  rationale: κινέω का कर्मवाच्य रूप और τῇ διανοίᾳ भीतरी हलचल या उत्तेजना व्यक्त करते हैं। ‘उद्वेलित’ प्रतिक्रिया की तीव्रता रखता है, पर उसे केवल क्रोध, भय या व्याकुलता नहीं ठहराता।
- source_word: ἐπέλεξεν
  choice: उसने ... को चुना
  rationale: क्रिया का सीधा अर्थ चुनना या चयन करना है; सैन्य संदर्भ में भी ‘चुना’ स्पष्ट और सहज है।
- source_word: δέκα χιλιάδας ἀνδρῶν
  choice: दस हज़ार पुरुषों
  rationale: ἀνδρῶν का निकट अर्थ ‘पुरुष’ है। संदर्भ में वे योद्धा हैं, फिर भी मूल पाठ से अधिक स्पष्ट सैन्य पद जोड़ने से बचा गया है।
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: यरूशलेम से निकल पड़ा
  rationale: यह सामान्य प्रस्थान-सूचक अभिव्यक्ति है। ‘निकल पड़ा’ स्वाभाविक कथात्मक हिन्दी है और अनावश्यक रूप से ‘कूच किया’ जैसा सैन्य रंग नहीं जोड़ता।
- source_word: συνήντησεν αὐτῷ
  choice: उससे आ मिला
  rationale: συναντάω मिलने या मिलने के लिए आने को दर्शाता है। सहायता के उद्देश्य के संदर्भ में ‘आ मिला’ स्वाभाविक है, बिना यह अनिवार्य रूप से कहे कि वह पहले से सेना में सम्मिलित था।
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: उसकी सहायता करने के लिए
  rationale: यह पदबंध शमौन के मिलने का उद्देश्य बताता है; यह चयन आधुनिक हिन्दी में स्पष्ट और अर्थतः सटीक है।
