  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: hi
  text: और ऐसा हुआ कि जब जो लोग उससे मिले उन्होंने उसका वैभव[a] देखा, जैसा घोषित किया गया था, और उसे लिनन का वस्त्र[b] पहने हुए देखा, तो वे सब भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महिमा।” इस प्रसंग में यूनानी शब्द संभवतः किसी विशेष ईशवैज्ञानिक अर्थ के बजाय दिखाई देनेवाले राजकीय वैभव को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “लिनन का वस्त्र पहने हुए” या “लिनन के कपड़े से ढका हुआ” है। यह शब्द लिनन के कपड़े या उससे बने वस्त्र को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: और ऐसा हुआ कि जब
  rationale: यूनानी कथात्मक संक्रमण और कालसूचक बल दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ ἐντυγχάνοντες
  choice: उसके सामने आनेवाले लोग
  rationale: यह प्रयोग मिलने या किसी के सामने आने का भाव देता है। चुना हुआ पद संदर्भ में स्वाभाविक है और केवल ‘वहाँ उपस्थित लोग’ कहने की अपेक्षा अधिक विशिष्ट है।
- source_word: τὴν δόξαν αὐτοῦ
  choice: उसका वैभव
  rationale: राजकीय और सार्वजनिक प्रसंग में δόξα दिखाई देनेवाली प्रतिष्ठा, भव्यता या शानदार रूप को सूचित करता है; ‘वैभव’ इस अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: καθὼς ἐκήρυξεν
  choice: जैसा घोषित किया गया था
  rationale: κηρύσσω सार्वजनिक घोषणा को सूचित करता है। यूनानी क्रिया सक्रिय एकवचन है, पर उसका कर्ता स्पष्ट नहीं है; हिन्दी का भाववाच्य अस्पष्ट कर्ता को बिना जोड़े अर्थ सुरक्षित रखता है।
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: उसे सन का वस्त्र पहने
  rationale: περιβάλλω पहने या ओढ़े होने और σινδών सन के कपड़े अथवा उससे बने वस्त्र को दर्शाता है। यह अनुवाद सामग्री और परिधान—दोनों भावों को संक्षेप में रखता है।
- source_word: ἔφυγον πάντες
  choice: वे सब भाग गए
  rationale: क्रिया के प्रबल अर्थ और πάντες की समग्रता को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δόξα का प्रसंगानुकूल अर्थ
  choice: वैभव
  alternative: महिमा
  rationale: यहाँ शब्द का संबंध दिखाई देनेवाले राजकीय सम्मान और भव्यता से है, न कि अनिवार्य रूप से किसी विशिष्ट ईशवैज्ञानिक ‘महिमा’ से। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली अपनाई गई है। ‘वैभव’ राजकीय दृश्य-प्रभाव को व्यक्त करता है और ‘सन का वस्त्र’ यूनानी सामग्री-सूचक शब्द को बिना अनावश्यक रूप से ‘महीन’ जोड़ने के सुरक्षित रखता है।
