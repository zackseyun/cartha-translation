base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: hi
  text: पर जब योनातान और लोगों ने ये बातें सुनीं, तो उन्होंने उन पर विश्वास नहीं किया और न उन्हें स्वीकार किया[a], क्योंकि उन्हें उस बड़ी बुराई की याद थी जो उसने इस्राएल में की थी[b], और यह भी कि उसने उन्हें बहुत अधिक सताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उन पर भरोसा नहीं किया और न उन्हें ग्रहण किया।” यूनानी पाठ विश्वास न करने और संदेश को स्वीकार न करने के बीच भेद करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो उसने इस्राएल के विरुद्ध की थी।” यूनानी में शाब्दिक रूप से “इस्राएल में” है; इसका अर्थ इस्राएल के भीतर की गई या इस्राएल के लोगों के विरुद्ध की गई बुराई हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν
  choice: उन्होंने … विश्वास नहीं किया
  rationale: यहाँ क्रिया संदेश की सच्चाई या भेजने वाले की नीयत पर विश्वास न करने को व्यक्त करती है। ‘विश्वास नहीं किया’ सामान्य आधुनिक हिन्दी है और ‘इन बातों’ के साथ स्वाभाविक बैठती है।
- source_word: ἐπεδέξαντο
  choice: न उन्हें स्वीकार किया
  rationale: यह केवल सुन लेने के बजाय संदेश या प्रस्ताव को अनुकूल रूप से ग्रहण करने का भाव देता है। ‘स्वीकार’ विश्वास करने और व्यवहार में मान लेने के बीच यूनानी पाठ के भेद को बनाए रखता है।
- source_word: ἐμνήσθησαν
  choice: उन्हें … याद थी
  rationale: भूतकालीन स्मरण को स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि उनके इनकार का कारण पिछला अत्याचार था।
- source_word: τῆς κακίας τῆς μεγάλης
  choice: उस बड़ी बुराई
  rationale: κακία यहाँ गंभीर दुष्कर्म या हानि का व्यापक अर्थ रखता है। ‘बड़ी बुराई’ नैतिक गंभीरता बनाए रखता है, पर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: जो उसने इस्राएल में की थी
  rationale: ἐν का मूल अर्थ ‘में’ है। यह अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है कि बुराई इस्राएल की भूमि या समुदाय के भीतर की गई थी, जबकि ‘इस्राएल के विरुद्ध’ एक सम्भव व्याख्या है।
- source_word: ἔθλιψεν
  choice: उसने उन्हें … सताया था
  rationale: क्रिया भारी कष्ट, दबाव या उत्पीड़न पहुँचाने का अर्थ देती है। कथात्मक और राजनीतिक-सैन्य प्रसंग में ‘सताया’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: σφόδρα
  choice: बहुत अधिक
  rationale: यह सताने की तीव्रता पर बल देता है; ‘बहुत अधिक सताया’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: पिछली बुराई और उत्पीड़न करने वाले निहित कर्ता का वचन
  choice: एकवचन ‘उसने’
  alternative: व्यापक राजनीतिक पक्ष को ध्यान में रखकर बहुवचन ‘उन्होंने’
  rationale: यूनानी पाठ में ἐποίησεν और ἔθλιψεν दोनों एकवचन हैं। इसलिए अनुवाद तत्काल प्रसंग के एकवचन व्यक्ति को बनाए रखता है और सामूहिक कर्ता की व्याख्या नहीं जोड़ता।
- issue: ἐν Ἰσραήλ में इस्राएल से सम्बन्ध
  choice: ‘इस्राएल में’
  alternative: ‘इस्राएल के विरुद्ध’
  rationale: मूल पूर्वसर्ग स्थान या समुदाय के भीतर किए गए कार्य को सीधे व्यक्त कर सकता है, पर प्रसंग में इस्राएल को लक्ष्य बनाकर किया गया दुष्कर्म भी अभिप्रेत हो सकता है। मुख्य पाठ औपचारिक रूप को रखता है और विकल्प को टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘योनातान’ और ‘इस्राएल’ प्रचलित बाइबलीय नाम-रूप हैं। वाक्य में ‘और यह भी कि’ अंतिम खंड को स्वाभाविक ढंग से जोड़ता है, जबकि मूल का कारणात्मक क्रम बना रहता है।
