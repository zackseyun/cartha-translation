base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: hi
  text: तब शमौन ने अपनी सैन्य टुकड़ी को युद्ध में उतारा और फैलैंक्स[a] से भिड़ गया, क्योंकि घुड़सवार सेना अस्त-व्यस्त हो गई थी;[b] और वे उसके हाथों चूर-चूर कर दिए गए और भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फैलैंक्स’ पैदल सैनिकों का एक सघन, व्यूहबद्ध युद्ध-दल था।
    reason: historical_term
  - marker: b
    text: मूल भाषा में शाब्दिक रूप से ‘घोड़ा’ है, अर्थात घुड़सवार सेना। ‘अस्त-व्यस्त हो गई थी’ का अर्थ ‘टूट-बिखर गई थी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  choice: युद्ध में उतारा
  rationale: सैन्य प्रसंग में यह अपनी टुकड़ी को खोलने, आगे बढ़ाने या सक्रिय युद्ध में लगाने का बोध देता है। यह स्वाभाविक हिन्दी में क्रिया का आशय व्यक्त करता है।
- source_word: τὴν δύναμιν αὐτοῦ
  choice: अपनी सैन्य टुकड़ी
  rationale: δύναμις यहाँ सैनिक बल या दल है। ‘सैन्य टुकड़ी’ सामूहिक एकवचन को बनाए रखती है और पूर्ण सेना होने का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: फैलैंक्स से भिड़ गया
  rationale: वाक्यांश किसी युद्ध-व्यूह के विरुद्ध सीधे युद्ध में उतरने को दर्शाता है। ‘भिड़ गया’ आधुनिक, स्पष्ट और संक्षिप्त है।
- source_word: φάλαγγα
  choice: फैलैंक्स
  rationale: यह यूनानी-हेलेनिस्ती काल की विशिष्ट सघन युद्ध-रचना का नाम है; लिप्यंतरण ऐतिहासिक विशिष्टता को बचाता है, और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: ἡ ἵππος
  choice: घुड़सवार सेना
  rationale: शाब्दिक अर्थ ‘घोड़ा’ है, पर यहाँ सामूहिक सैन्य अर्थ में घुड़सवार सेना अभिप्रेत है।
- source_word: ἐξελύθη
  choice: का गठन टूट गया था
  rationale: निष्क्रिय क्रिया सेना की एकता या व्यूह के बिखर जाने का संकेत देती है। यह बाद में बताए गए भागने को समय से पहले नहीं दोहराती।
- source_word: συνετρίβησαν
  choice: कुचले गए
  rationale: क्रिया युद्ध में निर्णायक रूप से तोड़े या चूर किए जाने का प्रबल चित्र देती है।
- source_word: ἀπʼ αὐτοῦ
  choice: उसके हाथों
  rationale: यहाँ वाक्यांश को कर्तृत्व के अर्थ में लेना स्वाभाविक है—वे शमौन के आक्रमण से कुचले गए।
