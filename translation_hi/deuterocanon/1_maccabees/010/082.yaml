revisions:
- from: तब शमौन ने अपनी सैन्य टुकड़ी को युद्ध में उतारा और फैलैंक्स[a] से भिड़ गया, क्योंकि घुड़सवार सेना का गठन टूट गया था;[b] और वे उसके हाथों कुचले गए और भाग गए।
  to: तब शमौन ने अपनी सैन्य टुकड़ी को युद्ध में उतारा और फैलैंक्स[a] से भिड़ गया, क्योंकि घुड़सवार सेना अस्त-व्यस्त हो गई थी;[b] और वे उसके हाथों चूर-चूर कर दिए गए और भाग गए।
  rationale: A limited idiomatic revision replaces the stiff phrase ‘का गठन टूट गया था’ with ‘अस्त-व्यस्त हो गई थी,’ which faithfully represents the cavalry’s loss of cohesion. ‘चूर-चूर कर दिए गए’ retains the force of συνετρίβησαν more clearly than a merely general statement of defeat. The historical term and the source’s unresolved referential breadth in ‘वे’ are retained.
