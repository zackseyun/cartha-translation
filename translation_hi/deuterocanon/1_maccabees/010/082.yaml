  register: भाषा आधुनिक, गरिमापूर्ण और युद्ध-वर्णन के अनुरूप रखी गई है। ‘फैलैंक्स’ जैसे ऐतिहासिक पद को बनाए रखकर पादटिप्पणी में सरल व्याख्या दी गई है। अंतिम ‘वे’ का संदर्भ मूल यूनानी की तरह स्पष्ट रूप से सीमित नहीं किया गया, ताकि वास्तविक अस्पष्टता बनी रहे।
