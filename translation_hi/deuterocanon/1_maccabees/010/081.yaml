  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: hi
  text: परन्तु लोग योनातान की आज्ञा के अनुसार अपनी जगह पर डटे रहे, और उनके घोड़े थक गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में केवल “उनके घोड़े” है। प्रसंग में सम्भवतः शत्रु की घुड़सवार सेना के घोड़े अभिप्रेत हैं, जो योनातान के लोगों के अपनी जगह पर डटे रहने के दौरान थक गए।
    reason: सर्वनाम के संदर्भ की वास्तविक अस्पष्टता को स्पष्ट करना
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: परन्तु लोग
  rationale: λαός यहाँ योनातान के लोगों अथवा उसकी सेना के लिए है। δέ कथा में हल्का विरोध सूचित करता है, इसलिए ‘परन्तु’ उपयुक्त है।
- source_word: ἱστήκει
  choice: अपनी जगह पर डटे रहे
  rationale: यह क्रिया यहाँ केवल खड़े होने से बढ़कर आदेश के अनुसार स्थान न छोड़ने की निरन्तर अवस्था व्यक्त करती है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: योनातान की आज्ञा के अनुसार
  rationale: ἐπιτάσσω का अर्थ आज्ञा देना है। यह रूप पूर्व में दी गई आज्ञा और वर्तमान स्थिति का सम्बन्ध सहज हिंदी में व्यक्त करता है।
- source_word: ἐκοπίασαν
  choice: थक गए
  rationale: κοπιάω परिश्रम के कारण थक जाने को व्यक्त करता है; ‘थक गए’ परिणामसूचक अर्थ रखता है, पर पूर्ण निढाल होने का अतिशयोक्त भाव नहीं जोड़ता।
- source_word: οἱ ἵπποι αὐτῶν
  choice: उनके घोड़े
  rationale: यूनानी में सर्वनाम का सम्बन्ध व्याकरणतः स्पष्ट नहीं किया गया है। सीधा अनुवाद इस वास्तविक संदिग्धता को बनाए रखता है।
