  text: And King Alexander wrote to Jonathan to come and meet him.
translation:
  language: hi
  text: और राजा सिकन्दर ने योनातान को लिखा कि वह आकर उससे मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिखा
  rationale: γράφω के अओरिस्ट का सीधा अर्थ ‘लिखा’ है। ‘सन्देश भेजा’ अधिक व्याख्यात्मक होता, और ‘पत्र लिखा’ यूनानी में अनुल्लिखित कर्म जोड़ता।
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: राजा सिकन्दर
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है; इससे राजकीय पद और व्यक्तिगत नाम दोनों सुरक्षित रहते हैं।
- source_word: Ἰωνάθῃ
  choice: योनातान को
  rationale: ἔγραψεν के साथ चतुर्थी रूप लिखित सन्देश पाने वाले व्यक्ति को सूचित करता है।
- source_word: ἐλθεῖν
  choice: आकर
  rationale: ἔρχομαι का मूल दिशासूचक भाव ‘आना’ है। हिन्दी में अगले उद्देश्यसूचक क्रियापद के साथ ‘आकर’ सहज रूप से इसे व्यक्त करता है।
- source_word: εἰς συνάντησιν αὐτῷ
  choice: उससे मिले
  rationale: शाब्दिक भाव ‘उससे भेंट के लिए’ है। ‘उससे मिले’ आधुनिक हिन्दी में स्वाभाविक है और आमने-सामने भेंट के आशय को बनाए रखता है।
