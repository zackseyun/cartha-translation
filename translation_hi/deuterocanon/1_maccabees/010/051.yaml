lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: ἀποστέλλω के कथात्मक एओरिस्ट के लिए ‘भेजे’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: πρὸς
  choice: के पास
  rationale: भेजने की क्रिया के साथ व्यक्ति की ओर प्रेषण व्यक्त करने के लिए ‘के पास’ सहज हिन्दी प्रयोग है।
- source_word: πρέσβεις
  choice: राजदूत
  rationale: यह शब्द राजकीय कूटनीतिक प्रतिनिधियों को दर्शाता है; ‘राजदूत’ उनकी औपचारिक हैसियत को बनाए रखता है।
- source_word: κατὰ τοὺς λόγους τούτους
  choice: इस प्रकार
  rationale: यह यूनानी पदबंध आगे आने वाले संदेश की शब्दावली या आशय का परिचय देता है; हिन्दी में ‘इस प्रकार’ उद्धरण की स्वाभाविक भूमिका निभाता है।
- source_word: λέγων
  choice: कहलवाया
  rationale: एकवचन कृदन्त λέγων का आशय सिकन्दर द्वारा राजदूतों के माध्यम से आगे का संदेश कहलवाना है; यह हिन्दी में अनावश्यक दोहराव से बचते हुए माध्यमगत वचन को स्पष्ट करता है।
- source_word: βασιλέα Αἰγύπτου
  choice: मिस्र के राजा
  rationale: यह टॉलेमी के साथ समानाधिकरण में प्रयुक्त राजकीय उपाधि है; ‘मिस्र के राजा टॉलेमी’ आधुनिक हिन्दी में स्वाभाविक क्रम है।
- source_word: Ἀλέξανδρος
  choice: सिकन्दर
  rationale: इस ऐतिहासिक यूनानी नाम का प्रचलित और सामान्य हिन्दी रूप ‘सिकन्दर’ है।
- source_word: Πτολεμαῖον
  choice: टॉलेमी
  rationale: Πτολεμαῖος के लिए आधुनिक हिन्दी में पहचाना जाने वाला रूप ‘टॉलेमी’ चुना गया है।
