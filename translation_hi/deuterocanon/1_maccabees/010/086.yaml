  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: hi
  text: फिर योनातान वहाँ से चल पड़ा और अश्कलोन में पड़ाव डाला। नगर के लोग बड़े सम्मान के साथ उससे मिलने बाहर आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: चल पड़ा
  rationale: यह क्रिया पिछले स्थान से प्रस्थान करने को दर्शाती है; ‘चल पड़ा’ स्वाभाविक आधुनिक हिन्दी में गति और प्रस्थान दोनों को व्यक्त करता है।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य अथवा यात्रा-संदर्भ में यह क्रिया शिविर लगाने या पड़ाव डालने के अर्थ में आती है; यहाँ ‘पड़ाव डाला’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: Ἀσκάλωνα
  choice: अश्कलोन
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी लिप्यंतरण।
- source_word: ἐξῆλθον
  choice: बाहर आए
  rationale: नगर के भीतर से योनातान से मिलने निकलने की दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोग
  rationale: यूनानी पदबंध किसी विशेष लिंग तक सीमित नहीं है और सामान्य रूप से नगरवासियों को सूचित करता है।
- source_word: εἰς συνάντησιν αὐτῷ
  choice: उससे मिलने
  rationale: यूनानी मुहावरे का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν δόξῃ μεγάλῃ
  choice: बड़े सम्मान के साथ
  rationale: δόξα यहाँ सार्वजनिक स्वागत की प्रतिष्ठा, भव्यता या सम्मान को सूचित कर सकता है; ‘बड़े सम्मान के साथ’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से दैवी महिमा का भाव नहीं जोड़ता।
