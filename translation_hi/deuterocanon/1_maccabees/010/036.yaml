base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: hi
  text: और यहूदियों में से तीस हज़ार तक पुरुषों को राजा की सेना में भर्ती किया जाए, और उन्हें वह रसद[a] दी जाएगी जो राजा के सभी सैन्य बलों के लिए उचित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राशन,” “निर्वाह-सामग्री”; यूनानी शब्द का शाब्दिक अर्थ “अतिथि-सत्कार” भी हो सकता है, पर यहाँ इसका आशय सैनिकों को दी जाने वाली सहायता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: भर्ती किया जाए
  rationale: निष्क्रिय आज्ञार्थक रूप आधिकारिक रूप से नाम दर्ज करके सैन्य सेवा में सम्मिलित करने को व्यक्त करता है; इस संदर्भ में ‘भर्ती’ स्वाभाविक और सटीक है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों में से
  rationale: 'यहाँ अंशवाचक अर्थ है: पुरुष यहूदी जनसमुदाय में से लिए जाने हैं।'
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: राजा की सेना में
  rationale: δυνάμεις यहाँ राजकीय सैन्य बल को दर्शाता है; हिन्दी में सामूहिक एकवचन ‘सेना’ स्वाभाविक है और अलग-अलग सेनाओं की अनावश्यक धारणा उत्पन्न नहीं करता।
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: अधिक-से-अधिक तीस हज़ार पुरुषों को
  rationale: संख्या के साथ εἰς सीमा (‘तीस हज़ार तक’) व्यक्त कर सकता है; ‘अधिक-से-अधिक’ इसे स्पष्ट करता है। सैन्य संदर्भ में ἀνδρῶν का अर्थ ‘पुरुष’ है।
- source_word: δοθήσεται
  choice: दी जाएगी
  rationale: सरल भविष्यत् कर्मवाच्य को औपचारिक घोषणा के स्वाभाविक हिन्दी रूप में रखा गया है।
- source_word: ξενιά
  choice: रसद
  rationale: इस सैन्य संदर्भ में शब्द सैनिकों को दी जाने वाली भोजन-सामग्री अथवा निर्वाह-सहायता को दर्शाता है; ‘रसद’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ὡς καθῆκει πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: जो राजा की सारी सेना को देना उचित है
  rationale: यह पद मानक राजकीय सैन्य व्यवस्था के अनुसार उचित अथवा प्राप्य सहायता को व्यक्त करता है; यह हिन्दी गठन तुलना-संबंध को स्पष्ट और स्वाभाविक रखता है।
