lexical_decisions:
- source_word: μνησθήσεται
  choice: याद रखेगा
  rationale: भविष्यकालीन क्रिया का स्वाभाविक हिन्दी रूप; प्रसंग में केवल स्मरण आना नहीं, पूर्व अपराधों को ध्यान में रखना अभिप्रेत है।
- source_word: πάντων τῶν κακῶν
  choice: उन सभी बुरे कामों को
  rationale: κακά का बहुवचन यहाँ किए गए हानिकारक अथवा अन्यायपूर्ण कर्मों को सूचित करता है; ‘बुरे काम’ मूल की नैतिक गंभीरता बनाए रखते हुए सहज हिन्दी है।
- source_word: συνετελέσαμεν
  choice: हमने ... किए हैं
  rationale: क्रिया किए गए कर्मों को पूरा करने/अंजाम देने का भाव देती है; हिन्दी में ‘किए हैं’ स्पष्ट और स्वाभाविक है।
- source_word: ἀδελφοὺς
  choice: भाइयों
  rationale: मूल का सीधा अर्थ सुरक्षित रखा गया है; प्रसंगानुसार इसमें निकट जातीय सहयोगी भी निहित हो सकते हैं, पर पाठ इसे स्पष्ट नहीं करता।
- source_word: ἔθνος
  choice: जाति
  rationale: यहाँ किसी व्यक्ति के व्यापक जनसमुदाय या राष्ट्र को दर्शाता है; ‘जाति’ पारंपरिक, संक्षिप्त और प्रसंगानुकूल है।
