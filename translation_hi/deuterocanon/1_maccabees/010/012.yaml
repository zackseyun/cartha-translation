translation:
  language: hi
  text: और जो परदेशी उन किलों में थे जिन्हें बक्खिदेस ने बनाया था, वे भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: भाग गए
  rationale: यह φεύγω के अओरिस्ट रूप का स्वाभाविक हिन्दी अनुवाद है और बिना अतिरिक्त अर्थ जोड़े वहाँ से भाग निकलने की घटना व्यक्त करता है।
- source_word: ἀλλογενεῖς
  choice: परदेशी
  rationale: यह शब्द दूसरे लोगों या जाति से संबंधित व्यक्तियों को दर्शाता है। इस सैनिक-ऐतिहासिक प्रसंग में ‘परदेशी’ जातीय बाहरीपन को व्यक्त करता है, जबकि ‘अन्यजाति’ अनावश्यक धार्मिक अर्थ ला सकता है।
- source_word: ὀχυρώμασιν
  choice: किलों
  rationale: यह शब्द सुदृढ़ किए गए रक्षात्मक स्थानों को दर्शाता है। ‘किलों’ आधुनिक हिन्दी में सहज और सैनिक प्रसंग के अनुकूल है।
- source_word: οἷς οἰκοδόμησεν
  choice: जिन्हें ... ने बनवाया था
  rationale: सम्बन्धवाचक उपवाक्य किलों का वर्णन करता है। ‘बनवाया था’ हिन्दी में पूर्ववर्ती निर्माण और शासकीय या सैनिक अधिकारी द्वारा निर्माण कराए जाने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Βακχίδης
  choice: बक्खिदेस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण किया गया है; χ की ध्वनि को ‘ख’ और व्यंजन-संयोग को ‘क्ख’ से दर्शाया गया है।
