  yaml_path: translation/deuterocanon/1_maccabees/010/056.yaml
  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: hi
  text: अब मैं तुम्हारे लिए वह करूँगा जो तुमने लिखा है। पर प्टोलमाईस आकर मुझसे मिलो, ताकि हम एक-दूसरे को देख सकें; और जैसा तुमने कहा है, मैं तुम्हारे साथ विवाह-संबंध स्थापित करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारे साथ वैवाहिक गठबंधन करूँगा।” यूनानी क्रिया विवाह के द्वारा पारिवारिक संबंध स्थापित करने को दर्शाती है; व्यापक प्रसंग से स्पष्ट होता है कि यहाँ राजवंशीय विवाह का प्रस्ताव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω σοι ἃ ἔγραψας
  choice: तुमने जो लिखा है, वह मैं तुम्हारे लिए करूँगा
  rationale: यह यूनानी वाक्य के खुले अर्थ को बनाए रखता है और लिखित अनुरोध की विषय-वस्तु को अनावश्यक रूप से अधिक विशिष्ट नहीं करता।
- source_word: ἀπάντησον εἰς Πτολεμαΐδα
  choice: मुझसे मिलने पतुलिमैस आओ
  rationale: εἰς गति और गंतव्य को दर्शाता है; इसलिए हिन्दी में ‘आओ’ स्थान की ओर जाने के भाव को स्वाभाविक रूप से व्यक्त करता है। ‘मुझसे’ प्रसंग और क्रिया के अभिप्रेत पारस्परिक मिलन को स्पष्ट करता है।
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: ताकि हम एक-दूसरे को देख सकें
  rationale: ‘देखें’ यूनानी ἰδωμεν का सीधा अर्थ सुरक्षित रखता है; इसे केवल ‘मिलें’ कर देने से मूल शब्द-चित्र मिट जाता।
- source_word: ἐπιγαμβρεύσω σοι
  choice: मैं विवाह के द्वारा तुम्हारा संबंधी बनूँगा
  rationale: क्रिया विवाह द्वारा संबंध स्थापित करने का अर्थ देती है। यह अनुवाद उसी संबंधगत अर्थ को रखता है, पर इस पद में स्पष्ट न किए गए विवाह के पक्षों को स्वयं नहीं जोड़ता।
- source_word: καθὼς εἴρηκας
  choice: जैसा तुमने कहा है
  rationale: यह पहले रखे गए प्रस्ताव की ओर स्वाभाविक हिन्दी में संकेत करता है और यूनानी के पूर्णतासूचक रूप का उपयुक्त प्रतिनिधित्व करता है।
