  yaml_path: translation/deuterocanon/1_maccabees/010/053.yaml
  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: hi
  text: और मैंने उससे युद्ध किया; वह और उसकी छावनी हमारे हाथों कुचल दिए गए,[a] और हम उसके राज्य के सिंहासन पर बैठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में क्रिया एकवचन है: शाब्दिक रूप से, “वह और उसकी छावनी हमारे हाथों कुचल दिया गया।” संयुक्त कर्ता के कारण मुख्य पाठ में स्वाभाविक हिन्दी बहुवचन रखा गया है।'
    reason: मूल भाषा की असामान्य व्याकरणिक संगति को दर्ज करना
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  choice: मैंने उससे युद्ध किया
  rationale: यह यूनानी सैन्य मुहावरे का स्वाभाविक और स्पष्ट हिन्दी रूप है; इससे युद्ध में सीधे भिड़ने का भाव आता है, पर अनावश्यक रूप से यह नहीं कहा जाता कि युद्ध किसने आरम्भ किया।
- source_word: συνετρίβη
  choice: कुचल दिए गए
  rationale: यह συντρίβω की प्रबलता को सामान्य ‘हरा दिए गए’ से अधिक निकटता से व्यक्त करता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: उसकी छावनी
  rationale: παρεμβολή का सीधा सैन्य अर्थ छावनी है; प्रसंग में इससे छावनी में स्थित उसकी सेना और सैन्य दल भी सूचित होते हैं। ‘सेना’ कहने पर मूल का छावनी-वाला चित्र लुप्त हो जाता।
- source_word: ὑφʼ ἡμῶν
  choice: हमारे हाथों
  rationale: यह कर्ता-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप है और वक्ता के प्रथम-पुरुष बहुवचन को बनाए रखता है।
- source_word: ἐκαθίσαμεν
  choice: हम ... बैठे
  rationale: मूल क्रिया का साधारण अर्थ ‘बैठे’ है। आगे सिंहासन का स्पष्ट उल्लेख होने के कारण ‘राज्य संभाला’ जैसी व्याख्यात्मक अभिव्यक्ति आवश्यक नहीं है।
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: उसके राज्य के सिंहासन पर
  rationale: यह θρόνος और βασιλεία दोनों को बनाए रखता है तथा पराजित विरोधी के राज्य पर अधिकार का आशय बिना अतिरिक्त व्याख्या के व्यक्त करता है।
