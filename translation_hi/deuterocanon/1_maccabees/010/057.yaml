base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: hi
  text: और टॉलेमी अपनी बेटी क्लियोपेट्रा के साथ मिस्र से निकला और एक सौ बासठवें वर्ष[a] में टॉलेमाइस पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, सेल्यूकिड संवत् का 162वाँ वर्ष।
    reason: सांस्कृतिक और कालक्रम-संबंधी स्पष्टीकरण
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: से निकला
  rationale: ἐξέρχομαι का मूल अर्थ ‘बाहर निकलना’ है; यात्रा के इस प्रसंग में ‘मिस्र से निकला’ स्वाभाविक और स्रोत के निकट है।
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: अपनी बेटी क्लियोपेट्रा के साथ
  rationale: यूनानी पदबंध टॉलेमी और उसकी बेटी की संयुक्त यात्रा बताता है। हिन्दी में ‘अपनी बेटी ... के साथ’ इसी संबंध और समन्वय को सहज रूप में व्यक्त करता है; αὐτός पर अनावश्यक बल नहीं जोड़ा गया।
- source_word: ἦλθεν
  choice: पहुँचा
  rationale: नगर की ओर यात्रा के संदर्भ में ἔρχομαι का स्वाभाविक हिन्दी रूप ‘पहुँचा’ है, जो आगमन को स्पष्ट करता है।
- source_word: εἰς Πτολεμαΐδα
  choice: टॉलेमाइस
  rationale: εἰς के गंतव्य-बोध को हिन्दी क्रिया ‘पहुँचा’ के साथ विभक्ति-रहित नगर-नाम से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ बासठवें वर्ष में
  rationale: यूनानी की योगात्मक क्रमसूचक तिथि को सामान्य आधुनिक हिन्दी में संक्षिप्त क्रमसूचक रूप दिया गया है।
