  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। यूनानी के बार-बार आने वाले καὶ को हिन्दी के स्वाभाविक वाक्य-संबंध ‘जब…तो…और’ में ढाला गया है। नाम Δημήτριος का लिप्यंतरण ‘देमेत्रियुस’ रखा गया है।
