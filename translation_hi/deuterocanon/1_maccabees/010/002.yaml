translation:
  language: hi
  text: जब राजा देमेत्रियुस ने यह सुना, तो उसने बहुत बड़ी सेना इकट्ठी की और उससे युद्ध में सामना करने के लिए निकल पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: यह सुना
  rationale: अओरिस्ट क्रिया देमेत्रियुस को पूर्ववर्ती समाचार मिलने और उस पर प्रतिक्रिया करने का संकेत देती है। ‘यह सुना’ मूल के निकट और स्वाभाविक है; ‘पता चला’ अधिक व्याख्यात्मक होता।
- source_word: συνήγαγεν
  choice: इकट्ठी की
  rationale: क्रिया का मूल अर्थ एक साथ जमा करना है। सेना के संदर्भ में ‘इकट्ठी की’ सहज है और सैन्य प्रक्रिया को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: δυνάμεις πολλὰς σφόδρα
  choice: बहुत बड़ी सेना
  rationale: δυνάμεις सैन्य बलों को और πολλὰς σφόδρα उनकी अत्यधिक संख्या को व्यक्त करता है। हिन्दी में ‘बहुत बड़ी सेना’ स्वाभाविक रूप से विशाल सैन्य बल का अर्थ देता है, यद्यपि यूनानी में संज्ञा बहुवचन है।
- source_word: ἐξῆλθεν
  choice: निकल पड़ा
  rationale: यह ‘बाहर गया/निकला’ का भाव सुरक्षित रखता है और प्रसंगानुसार अभियान के लिए प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कूच किया’ अधिक सैन्य-विशिष्ट होता।
- source_word: εἰς συνάντησιν αὐτῷ
  choice: उससे … सामना करने के लिए
  rationale: मुहावरा किसी से मिलने या उसका सामना करने के लिए आगे जाने को दर्शाता है। अगले पदबंध से शत्रुतापूर्ण आशय स्पष्ट होने के कारण ‘सामना करने’ उपयुक्त है।
- source_word: εἰς πόλεμον
  choice: युद्ध में
  rationale: यह मुठभेड़ के युद्धात्मक उद्देश्य या क्षेत्र को व्यक्त करता है। ‘युद्ध में सामना’ हिन्दी में संक्षिप्त और स्पष्ट है।
