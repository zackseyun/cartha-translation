translation:
  language: hi
  text: हमें आनन्द हुआ। और अब भी हमारे प्रति निष्ठा बनाए रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐχάρημεν
  choice: हमें आनन्द हुआ
  rationale: χαίρω के अओरिस्ट रूप का सरल भूतकालीन और पत्रोचित अर्थ व्यक्त करता है; हिन्दी में यह ‘हम आनन्दित हुए’ से अधिक स्वाभाविक है।
- source_word: καὶ νῦν
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को सीधे बनाए रखता है तथा पत्र के विचार-क्रम को आगे बढ़ाता है।
- source_word: ἐμείνατε
  choice: बनाए रखो
  rationale: यहाँ μένω का आज्ञार्थक भाव आगामी infinitive के साथ निरन्तरता का आग्रह करता है; हिन्दी वाक्य में संयुक्त अभिव्यक्ति ‘बनाए रखो’ स्वाभाविक है।
- source_word: ἔτι
  choice: अब भी
  rationale: पहले से चली आ रही स्थिति को आगे जारी रखने का अर्थ स्पष्ट करता है।
- source_word: τοῦ συντηρῆσαι
  choice: बनाए रखो
  rationale: συντηρέω के संरक्षण अथवा निरन्तर पालन के भाव को πίστιν के साथ सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸς ἡμᾶς
  choice: हमारे प्रति
  rationale: राजनीतिक-संबंधपरक संदर्भ में वक्ता की ओर निर्देशित निष्ठा को सटीक रूप से प्रकट करता है।
- source_word: πίστιν
  choice: निष्ठा
  rationale: इस राजनयिक और राजनीतिक संदर्भ में πίστις का अर्थ धार्मिक ‘विश्वास’ नहीं, बल्कि वफादारी, विश्वसनीयता अथवा गठबंधन के प्रति निष्ठा है।
theological_decisions:
- issue: राजनीतिक/गठबंधन-संबंधी संदर्भ में πίστιν का अनुवाद
  choice: निष्ठा
  alternative: विश्वास; वफादारी
  rationale: मूल संदर्भ मनोवैज्ञानिक या धार्मिक विश्वास के बजाय पक्षों के बीच निभाई जाने वाली वफादारी की माँग करता है। ‘निष्ठा’ अर्थगत तनाव को अनावश्यक धार्मिक रंग दिए बिना औपचारिक गरिमा भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण राजकीय-पत्र शैली। मूल यूनानी की वाक्यगत प्रगति और जारी निष्ठा के आग्रह को स्वाभाविक हिन्दी में रखा गया है।
