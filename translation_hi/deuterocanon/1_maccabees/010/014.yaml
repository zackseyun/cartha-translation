  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: hi
  text: परन्तु बेत्सूरा में उन लोगों में से कुछ पीछे रह गए थे जिन्होंने व्यवस्था और आज्ञाओं को त्याग दिया था, क्योंकि वह उनके लिए शरण-स्थान था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यह पिछले कथन के अपवाद या विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν Βεθσούροις
  choice: बेत्सूरा में
  rationale: स्थान-नाम का प्रचलित ध्वन्यात्मक रूप रखा गया है; बहुवचन यूनानी रूप स्थान-नाम के व्याकरणिक रूप को दर्शाता है, अनेक नगरों को नहीं।
- source_word: ὑπελείφθησάν
  choice: पीछे रह गए थे
  rationale: क्रिया के निष्क्रिय अर्थ ‘छोड़ दिए गए/पीछे रह गए’ को सहज हिन्दी में व्यक्त करता है और अंग्रेज़ी परामर्श-पाठ की सूक्ष्मता बनाए रखता है।
- source_word: τῶν καταλειπόντων τὸν νόμον καὶ τὰ προστάγματα
  choice: उन लोगों में से ... जिन्होंने व्यवस्था और आज्ञाओं को त्याग दिया था
  rationale: भागसूचक संबंध और सक्रिय कृदन्त दोनों सुरक्षित हैं; νόμος के लिए ‘व्यवस्था’ और προστάγματα के लिए सामान्य, समझने योग्य ‘आज्ञाएँ’ चुना गया है।
- source_word: φυγαδευτήριον
  choice: शरण-स्थान
  rationale: यह आश्रय या सुरक्षित पनाह की धारणा को स्पष्ट करता है, बिना किसी अधिक विशिष्ट संस्थागत अर्थ को जोड़ने के।
theological_decisions:
- issue: व्यवस्था और आज्ञाओं को छोड़ने वालों का वर्णन
  choice: जिन्होंने व्यवस्था और आज्ञाओं को त्याग दिया था
  alternative: व्यवस्था और विधियों से विमुख हो गए थे
  rationale: मूल यूनानी का नैतिक रूप से तीखा ‘छोड़ देना’ सुरक्षित रखा गया है; उनके उद्देश्य या पश्चात्ताप के विषय में कुछ नहीं जोड़ा गया।
