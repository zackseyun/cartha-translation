  register: भाषा आधुनिक, गरिमापूर्ण और प्रशासनिक संदर्भ के अनुकूल रखी गई है। ‘शेकेल’ प्राचीन इकाई के रूप में सुरक्षित है। डैश अंतिम स्रोत-वाक्यांश को पहले वित्तीय वाक्यांश से स्पष्ट रूप से जोड़ता है, बिना उसकी सम्भावित व्याख्या को निर्णायक बनाए।
