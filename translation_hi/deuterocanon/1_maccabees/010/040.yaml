  yaml_path: translation/deuterocanon/1_maccabees/010/040.yaml
  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: hi
  text: और मैं भी हर वर्ष राजा के खाते[a] में से चाँदी के पंद्रह हज़ार शेकेल देता हूँ, उन स्थानों से जो उससे सम्बन्धित हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा के राजस्व में से’ अथवा ‘राजा के कोष में से’। यूनानी पद का शाब्दिक अर्थ ‘राजा के हिसाब या खाते में से’ है।
    reason: lexical_alternative
  - marker: b
    text: 'अन्तिम पद उन क्षेत्रों या स्थानों की ओर संकेत कर सकता है जहाँ से यह धन लिया जाना था। शाब्दिक रूप से: ‘उन स्थानों से जो [उससे] सम्बन्धित हैं।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैं भी
  rationale: καί + ἐγώ के संयोग में जोड़ने वाला भाव और कर्ता पर बल, दोनों हैं; ‘और मैं भी’ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δίδωμι
  choice: देता हूँ
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है। राजकीय संदर्भ में ‘अनुदान देता हूँ’ सम्भव है, पर वह मूल से अधिक विशिष्ट होगा।
- source_word: κατʼ ἐνιαυτόν
  choice: हर वर्ष
  rationale: यह आवर्ती वार्षिक भुगतान का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  choice: चाँदी के पंद्रह हज़ार शेकेल
  rationale: प्राचीन भार अथवा मुद्रा की इकाई σίκλος को आधुनिक मुद्रा में बदलने के बजाय ‘शेकेल’ रखा गया है; ἀργύριον धातु को चाँदी के रूप में स्पष्ट करता है।
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  choice: राजा के खाते में से
  rationale: वित्तीय संदर्भ में λόγος का अर्थ हिसाब, खाता या उससे सम्बद्ध राजस्व हो सकता है। ‘खाते’ मूल की असामान्य अभिव्यक्ति और उसकी अस्पष्टता को बनाए रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  choice: उन स्थानों से जो उसके अधीन हैं
  rationale: τόποι स्थानों अथवा जिलों को और ἀνήκω सम्बन्धित या अधीन होने को सूचित करता है। यूनानी में सम्बन्ध का लक्ष्य अप्रकट है; राजकीय संदर्भ के आधार पर ‘उसके’ जोड़ा गया है।
