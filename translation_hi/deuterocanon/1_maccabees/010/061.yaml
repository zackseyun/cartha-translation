base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: hi
  text: और इस्राएल में से उपद्रवी लोग[a]—कानून-विहीन लोग—उसके विरुद्ध इकट्ठे हुए, ताकि उसके विरुद्ध अभियोग लगाएँ[b]; पर राजा ने उनकी ओर ध्यान नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकट खड़ा करनेवाले लोग” अथवा “महामारी जैसे लोग”; यूनानी में प्रयुक्त यह अपमानसूचक रूपक असामान्य रूप से कठोर है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “उसके विरुद्ध फरियाद करें” या “उस पर दोष लगाएँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: यूनानी क्रिया यहाँ शत्रुतापूर्ण उद्देश्य से एक समूह के एकत्र होने का सीधा वर्णन करती है।
- source_word: ἐπʼ αὐτόν
  choice: उसके विरुद्ध
  rationale: संदर्भ में यह दिशा नहीं, बल्कि विरोध का भाव व्यक्त करता है।
- source_word: ἄνδρες λοιμοί
  choice: उपद्रवी लोग
  rationale: λοιμοί का मूल संबंध महामारी या विपत्ति से है और यहाँ अत्यंत कठोर रूपकात्मक अपशब्द है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘उपद्रवी’ रखा गया है, जबकि रूपक की तीव्रता पादटिप्पणी में सुरक्षित है।
- source_word: ἐξ Ἰσραήλ
  choice: इस्राएल में से
  rationale: यह उन लोगों की उत्पत्ति या समुदाय को दर्शाता है; हिन्दी में ‘इस्राएल में से’ स्रोत की संरचना के निकट और स्वाभाविक है।
- source_word: ἄνδρες παράνομοι
  choice: व्यवस्था-विरोधी लोग
  rationale: παράνομοι का अर्थ विधि या व्यवस्था के विरुद्ध चलने वाले हैं। ‘व्यवस्था-विरोधी’ नैतिक और विधिक दोनों बल को बनाए रखता है।
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: उसके विरुद्ध अभियोग लगाएँ
  rationale: प्रशासनिक-न्यायिक संदर्भ में यह किसी के विरुद्ध निवेदन, आरोप या शिकायत प्रस्तुत करने को दर्शाता है। ‘अभियोग लगाएँ’ प्रसंग का कानूनी बल स्पष्ट करता है।
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: उनकी ओर ध्यान नहीं दिया
  rationale: यह उनकी बात पर ध्यान देने या उसे स्वीकार करने से राजा के इनकार को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: कथात्मक संदर्भ में पदवी का मानक हिन्दी रूप।
