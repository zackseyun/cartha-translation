  naturalness: The sentence is clear and suitably formal in modern Hindi. «उनकी ओर ध्यान नहीं दिया» is idiomatic. «अभियोग लगाएँ» is a defensible contextual rendering, with the footnote appropriately retaining the petitionary alternative.
  terminology: «उपद्रवी लोग» is natural but somewhat less vivid than the plague-like Greek insult; the footnote adequately preserves that lexical force. «कानून-विहीन लोग» better represents παράνομοι without importing the narrower ideological connotation of «व्यवस्था-विरोधी».
  issues:
  - severity: medium
    issue: The word «कुछ» adds an unstated limitation.
    rationale: ἄνδρες λοιμοὶ ἐξ Ἰσραήλ identifies the people as men from Israel but does not say “some people.”
  - severity: low
    issue: «व्यवस्था-विरोधी» is potentially narrower or differently colored than παράνομοι.
    rationale: The Greek describes people as contrary to law/lawless; «कानून-विहीन» retains this characterization without suggesting a specific opposition to “the Law” or an established system.
