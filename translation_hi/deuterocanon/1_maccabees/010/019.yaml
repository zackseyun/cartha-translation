lexical_decisions:
- source_word: Ἰωνάθαν
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; इसका अनुवाद नहीं किया गया है।
- source_word: χαίρειν
  choice: को नमस्कार
  rationale: पत्र के आरम्भ में यह यूनानी पद अभिवादन-सूत्र है; शाब्दिक ‘आनन्दित रहो’ के बजाय ‘नमस्कार’ आधुनिक हिन्दी में इसका स्वाभाविक कार्य व्यक्त करता है।
- source_word: ἀκηκόαμεν
  choice: हमने ... सुना है
  rationale: पूर्णकाल सुनने के वर्तमान परिणाम को व्यक्त करता है; हिन्दी का ‘सुना है’ इसे स्वाभाविक रूप से बनाए रखता है।
- source_word: περὶ σοῦ
  choice: तुम्हारे विषय में
  rationale: यह περὶ के सम्बन्धवाचक अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: यह योनातान के लिए प्रयुक्त पुल्लिंग एकवचन संज्ञा का सीधा अर्थ देता है, बिना अतिरिक्त पदवी जोड़े।
- source_word: ἀγαθὸς
  choice: अच्छे
  rationale: ἀγαθός की व्यापक सकारात्मक प्रशंसा को बनाए रखता है और ‘वीर’ या ‘श्रेष्ठ’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: ἰσχύϊ
  choice: सामर्थ्य में
  rationale: दत्तिवाचक रूप को निकटता से दर्शाता है और अधूरे वाक्य को ‘बलवान’ कहकर अनावश्यक रूप से पूरा या सुचारु नहीं बनाता।
- source_word: καὶ
  choice: और
  rationale: उपलब्ध यूनानी स्रोत इसी संयोजक पर समाप्त होता है; इसे रखकर स्रोत की वास्तविक अपूर्णता सुरक्षित रहती है।
