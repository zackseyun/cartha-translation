lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: सिकन्दर से प्रसन्न हुए
  rationale: εὐδοκέω के साथ ἐν यहाँ उस व्यक्ति को व्यक्त करता है जिसके प्रति अनुकूलता या प्रसन्नता है। यह हिन्दी में स्वाभाविक है और औपचारिक अनुमोदन का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἐγένετο
  choice: बना था
  rationale: क्रिया किसी स्थिति या भूमिका में आने को सूचित करती है; पूर्वकालिक कारणवाचक उपवाक्य में ‘बना था’ सहज है।
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  choice: शान्ति की बातों की पहल करनेवाला
  rationale: ἀρχηγός आरम्भ करनेवाले या अगुआ को और λόγοι εἰρηνικοί शान्ति-संबंधी बातों अथवा प्रस्तावों को सूचित कर सकता है। चुना हुआ अनुवाद कूटनीतिक सन्दर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी संक्षिप्त यूनानी पदबंध की अन्य सम्भावनाएँ सुरक्षित रखती है।
- source_word: συνεμάχουν αὐτῷ
  choice: उसके साथ मिलकर लड़ते रहे
  rationale: संयुक्त क्रिया सहयोगी के रूप में साथ युद्ध करने का स्पष्ट सैनिक अर्थ रखती है; ‘लड़ते रहे’ अपूर्ण भूतकाल की निरन्तरता भी दिखाता है।
- source_word: πάσας τὰς ἡμέρας
  choice: सदा
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, पर इस मुहावरे का आशय पूरे समय या लगातार है। ‘सदा’ संक्षिप्त, स्वाभाविक और कालगत निरन्तरता को व्यक्त करता है।
