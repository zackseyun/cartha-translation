  yaml_path: translation/deuterocanon/1_maccabees/010/026.yaml
  text: Since you have kept faith with us in the treaties[a], and have remained in our friendship and have not joined our enemies, we have heard[b], and
translation:
  language: hi
  text: चूँकि तुमने संधियों में हमारे प्रति निष्ठा निभाई है[a], हमारी मित्रता में बने रहे हो और हमारे शत्रुओं के पक्ष में नहीं गए, हमने सुना है, और[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संधियों में हमारे प्रति विश्वासयोग्यता—अर्थात् वफ़ादारी—निभाई है।” इस राजनयिक प्रसंग में यूनानी πίστις का अर्थ निष्ठा या वफ़ादारी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्राप्त यूनानी पाठ में यह पद “हमने सुना है, और” पर समाप्त होता है; वाक्य अगले पद में जारी रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह आगे कही जाने वाली बात का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: συνετηρήσατε
  choice: बनाए रखी है
  rationale: संयुक्त क्रिया किसी बात को सुरक्षित रखने या निरंतर निभाने का भाव देती है।
- source_word: πίστιν πρὸς ἡμᾶς
  choice: हमारे प्रति निष्ठा
  rationale: राजनयिक संदर्भ में πίστις का अर्थ विश्वास की अपेक्षा विश्वसनीयता, वफ़ादारी या निष्ठा है; ‘हमारे प्रति निष्ठा’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: συνθήκας
  choice: संधियों में
  rationale: यह राजनीतिक पक्षों के बीच औपचारिक समझौतों को दर्शाता है; ‘संधियाँ’ इस प्रसंग के उपयुक्त है।
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: हमारी मित्रता में बने रहे हो
  rationale: मूल में संबंध के भीतर दृढ़तापूर्वक बने रहने का भाव है; ‘मित्रता’ राजनयिक मैत्री का संकेत भी बनाए रखती है।
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: हमारे शत्रुओं से नहीं मिले
  rationale: क्रिया विरोधी पक्ष से जा मिलने या उसका साथ पकड़ने का भाव देती है।
- source_word: ἠκούσαμεν
  choice: हमने यह सुना है
  rationale: पत्रात्मक संदर्भ में भूतकालीन सूचना के वर्तमान महत्व को व्यक्त करता है; ‘यह’ हिन्दी वाक्य को सहज बनाता है।
theological_decisions:
- issue: राजनीतिक-राजनयिक संदर्भ में πίστις का अनुवाद
  choice: निष्ठा
  alternative: विश्वास; वफ़ादारी
  rationale: यहाँ शब्द धार्मिक विश्वास नहीं, बल्कि संधि-संबंध में भरोसेमंद निष्ठा का बोध कराता है। ‘निष्ठा’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट रखती है, जबकि पादटिप्पणी विकल्पों को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज राजनयिक-पत्रात्मक रूप रखा गया है। मूल पाठ में बार-बार आया καὶ सम्भवतः संप्रेषित पाठ की पुनरावृत्ति है; उसे हिन्दी में कृत्रिम रूप से तीन बार नहीं दोहराया गया। अंतिम ‘और’ तथा वाक्य की अपूर्णता को मूल पद-विभाजन के अनुसार बनाए रखा गया है।
