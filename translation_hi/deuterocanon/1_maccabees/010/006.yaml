translation:
  language: hi
  text: और उसने उसे सैन्य दल इकट्ठे करने, हथियार तैयार करने और यह कि वह उसका सहयोगी हो, अधिकार दिया। उसने यह भी कहा कि गढ़[a] में रखे बंधकों को उसे सौंप दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अकरा’, यरूशलेम का किलाबंद गढ़।
    reason: ἄκρα यहाँ सामान्य संज्ञा ‘गढ़’ के साथ-साथ यरूशलेम के विशिष्ट किलाबंद अकरा को भी सूचित कर सकता है।
lexical_decisions:
- source_word: ἔδωκεν ... ἐξουσίαν
  choice: अधिकार दिया
  rationale: यह आधिकारिक रूप से दिया गया अधिकार या अनुमति व्यक्त करता है और राजनीतिक संदर्भ में स्वाभाविक है।
- source_word: συναγαγεῖν δυνάμεις
  choice: सैन्य दल इकट्ठे करने
  rationale: यहाँ δυνάμεις अमूर्त शक्तियों के बजाय सैनिक बलों को दर्शाता है; ‘सैन्य दल’ बहुवचन का अर्थ स्पष्ट रखता है।
- source_word: κατασκευάζειν ὅπλα
  choice: हथियार तैयार करने
  rationale: κατασκευάζειν में बनाने के साथ तैयार करने या उपलब्ध कराने का व्यापक भाव हो सकता है; यह चयन उस अर्थ-विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: अपना सहयोगी बनने
  rationale: संक्षिप्त यूनानी infinitival रचना को स्वाभाविक हिन्दी में व्यक्त करता है और σύμμαχος का राजनीतिक-सैन्य अर्थ बनाए रखता है।
- source_word: τὰ ὅμηρα
  choice: बंधकों
  rationale: ऐतिहासिक संदर्भ में ὅμηρα सुरक्षा की गारंटी के रूप में रखे गए व्यक्तियों, अर्थात बंधकों, को दर्शाता है।
- source_word: τῇ ἄκρᾳ
  choice: गढ़
  rationale: ἄκρα का सामान्य अर्थ किलाबंद दुर्ग या गढ़ है; सरल हिन्दी मुख्य पाठ में स्थान की प्रकृति स्पष्ट करती है।
- source_word: παραδοῦναι
  choice: सौंप दिया जाए
  rationale: εἶπεν के बाद आया aorist infinitive आदेशात्मक कथन का भाव देता है; कर्मवाच्य हिन्दी मूल आशय को सहज ढंग से व्यक्त करती है।
