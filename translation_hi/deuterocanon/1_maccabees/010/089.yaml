base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: hi
  text: और उसने उसे सोने का एक ब्रोच[a] भेजा, जैसा राजाओं के संबंधियों को देने की प्रथा है; और उसने उसे अक्कारोन[b] तथा उसका सारा इलाका विरासत में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ वस्त्र बाँधने वाली सजावटी पिन, ब्रोच या कुंडी हो सकता है; उसका ठीक रूप निश्चित नहीं है।
    reason: lexical_ambiguity
  - marker: b
    text: अक्कारोन इस स्थान-नाम का यूनानी रूप है; इब्रानी रूप से यह अधिकतर ‘एक्रोन’ नाम से जाना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: सोने का एक ब्रोच
  rationale: πόρπη किसी वस्त्र को बाँधने वाली सजावटी पिन, ब्रोच या कुंडी को दर्शाता है। आधुनिक हिन्दी में ‘ब्रोच’ ठोस वस्तु का बोध कराता है, जबकि उसके ठीक आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: जैसा ... देने की प्रथा है
  rationale: यह यूनानी मुहावरा स्थापित राजकीय रीति को व्यक्त करता है; हिन्दी रूप स्वाभाविक और स्रोत के निकट है।
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: राजाओं के संबंधियों को
  rationale: यूनानी में दोनों पद बहुवचन हैं और सामान्यतः राजपरिवार से संबंधित लोगों के वर्ग की ओर संकेत करते हैं। अनुवाद इस व्यापकता को बनाए रखता है।
- source_word: Ἀκκαρὼν
  choice: अक्कारोन
  rationale: यह यूनानी रूप का देवनागरी लिप्यंतरण है। अधिक परिचित इब्रानी-आधारित नाम ‘एक्रोन’ को पादटिप्पणी में दिया गया है।
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: उसका सारा इलाका
  rationale: ὅρια का शाब्दिक अर्थ सीमाएँ है, पर बहुवचन में यह प्रायः उन सीमाओं के भीतर के पूरे क्षेत्र को दर्शाता है। ‘सारा इलाका’ इस प्रसंग में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: εἰς κληρονομίαν
  choice: विरासत में
  rationale: κληρονομία विरासत या उत्तराधिकार में मिली संपत्ति को दर्शाता है। संक्षिप्त हिन्दी प्रयोग कानूनी-वंशगत भाव को बनाए रखता है।
