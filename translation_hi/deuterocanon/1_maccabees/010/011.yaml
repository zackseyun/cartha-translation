  yaml_path: translation/deuterocanon/1_maccabees/010/011.yaml
  text: And he told those doing the work to build the walls and Mount Zion all around with squared stones for fortification, and they did so.
translation:
  language: hi
  text: उसने काम करनेवालों से कहा कि वे शहरपनाह और सिय्योन पर्वत के चारों ओर तराशे हुए चौकोर पत्थरों से किलेबंदी का निर्माण करें; और उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: काम करनेवालों
  rationale: यह यूनानी पद कार्य में लगे लोगों को दर्शाता है; सरल और स्वाभाविक हिन्दी में यही अर्थ स्पष्ट होता है।
- source_word: οἰκοδομεῖν
  choice: दृढ़ करें
  rationale: क्रिया का मूल अर्थ निर्माण करना है, पर यहाँ पहले से उल्लिखित शहरपनाह और पर्वत को पत्थरों से किलेबंद करने का भाव है; अगले पद εἰς ὀχύρωσιν के साथ मिलकर ‘दृढ़ करें’ स्वाभाविक हिन्दी देता है।
- source_word: τὰ τείχη
  choice: शहरपनाह
  rationale: बहुवचन τείχη किसी नगर की रक्षात्मक दीवारों को सूचित करता है; ‘शहरपनाह’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: τὸ ὄρος Σιὼν
  choice: सिय्योन पर्वत
  rationale: ὄρος को उसके सामान्य अर्थ ‘पर्वत’ में रखा गया है; स्रोत की भौगोलिक-सांस्कृतिक संज्ञा को ‘पहाड़ी’ बनाकर हल्का नहीं किया गया।
- source_word: ἐκ λίθων τετραγώνων
  choice: चौकोर तराशे हुए पत्थरों से
  rationale: τετράγωνος का अर्थ चार कोणों वाला या चौकोर है; निर्माण-संदर्भ में पत्थरों के आकार देकर तैयार किए जाने का भाव ‘तराशे हुए’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: εἰς ὀχύρωσιν
  choice: दृढ़ करें
  rationale: यह उद्देश्यसूचक पद किलेबंदी अथवा रक्षा के लिए मजबूत करने का भाव देता है, जिसे हिन्दी वाक्य में मुख्य क्रिया के साथ समाहित किया गया है।
theological_decisions:
- issue: सिय्योन के स्थलनाम का रूप
  choice: सिय्योन पर्वत
  alternative: सिय्योन की पहाड़ी
  rationale: मूल में ὄρος स्पष्ट रूप से है; इसलिए पारंपरिक स्थलनाम और मूल की ऊँचाई-संज्ञा दोनों बनाए रखी गई हैं। इसका कोई अतिरिक्त धर्मवैज्ञानिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली। ‘शहरपनाह’ ऐतिहासिक किलेबंदी के प्रसंग में सामान्य ‘दीवारों’ से अधिक सटीक है। मूल के लंबे समन्वित वाक्य को हिन्दी में अर्धविराम से स्पष्ट किया गया है।
