- from: उसने काम करनेवालों से कहा कि वे शहरपनाह और सिय्योन पर्वत को चारों ओर चौकोर तराशे हुए पत्थरों से दृढ़ करें; और उन्होंने वैसा ही किया।
  to: उसने काम करनेवालों से कहा कि वे शहरपनाह और सिय्योन पर्वत के चारों ओर तराशे हुए चौकोर पत्थरों से किलेबंदी का निर्माण करें; और उन्होंने वैसा ही किया।
