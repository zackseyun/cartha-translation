base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: hi
  text: और आय[c] में से जो भी अतिरिक्त राशि[a] वे पहले के वर्षों की तरह नहीं चुकाते थे, वह अब से उस गृह[b] के कार्यों के लिए देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बची हुई रकम’ अथवा ‘अधिशेष’।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मंदिर; यूनानी में शाब्दिक रूप से ‘घर’ या ‘गृह’।
    reason: cultural_note
  - marker: c
    text: यूनानी शब्द का सामान्य अर्थ ‘ज़रूरतें’, ‘आवश्यक खर्च’ या ‘साधन’ भी हो सकता है; यहाँ वित्तीय संदर्भ में ‘आय’ लिया गया है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: πλεονάζον
  choice: अतिरिक्त राशि
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत उस रकम को दर्शाता है जो सामान्य देय या खर्च से अधिक बची हो। वित्तीय संदर्भ में ‘अतिरिक्त राशि’ सहज है और ‘अधिशेष’ की अपेक्षा आम पाठक के लिए अधिक स्पष्ट है।
- source_word: ἀπέδωσαν
  choice: नहीं चुकाई थी
  rationale: राजस्व और आवंटन के इस प्रशासनिक संदर्भ में क्रिया का अर्थ केवल ‘लौटाना’ नहीं, बल्कि देय रकम चुकाना या जमा करना है।
- source_word: χρειῶν
  choice: आय
  rationale: शब्द का सामान्य अर्थ ‘ज़रूरतें’ या ‘आवश्यक साधन’ है, पर यहाँ ἀπό के साथ वित्तीय संदर्भ में उस आय अथवा संसाधन को सूचित करता है जिसमें से राशि चुकाई जानी थी। स्रोत की अर्थगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: पहले के वर्षों में
  rationale: यहाँ πρῶτος वर्तमान व्यवस्था की तुलना में बीते या पहले के वर्षों की ओर संकेत करता है; इसे किसी युग के शाब्दिक ‘प्रथम वर्षों’ तक सीमित नहीं किया गया।
- source_word: τὰ ἔργα
  choice: कामों
  rationale: बहुवचन मंदिर से जुड़े विभिन्न कामों या परियोजनाओं को दर्शा सकता है। ‘मरम्मत’ या ‘निर्माण’ कहना स्रोत से अधिक विशिष्ट होता।
- source_word: τοῦ οἴκου
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर’ है और संदर्भ में यह मंदिर का श्रद्धापूर्ण उल्लेख है। ‘भवन’ मूल रूपक को कुछ हद तक बनाए रखते हुए आधुनिक हिन्दी में ‘घर के कामों’ से पैदा होने वाली गलतफहमी से बचाता है।
