- from: और आय[c] में से जो भी अतिरिक्त राशि[a] उन्होंने पहले के वर्षों की तरह नहीं चुकाई थी, उसे अब से वे भवन[b] के कामों के लिए देंगे।
  to: और आय[c] में से जो भी अतिरिक्त राशि[a] वे पहले के वर्षों की तरह नहीं चुकाते थे, वह अब से उस गृह[b] के कार्यों के लिए देंगे।
