    issue: ‘भवन’ does not preserve οἶκος.
    rationale: Although the referent is the temple, οἶκος literally means ‘house.’ ‘भवन’ narrows the expression to a structure and conflicts with the footnote’s statement that Greek says ‘घर।’
  - severity: low
    issue: Past-perfect ‘नहीं चुकाई थी’ is less suitable for the customary prior practice.
    rationale: With ‘जैसे पहले के वर्षों में,’ the Greek naturally describes what was not paid in earlier years as a pattern. ‘नहीं चुकाते थे’ communicates this more idiomatically without changing the sense.
