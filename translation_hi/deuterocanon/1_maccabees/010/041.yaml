  verdict: revise
  source_fidelity: Draft correctly represents the fiscal sense of πλεονάζον, ἀπέδωσαν, χρειῶν, and the forward-looking δώσουσιν. However, ‘भवन’ renders a building rather than οἶκος (‘house’) and weakens the source’s temple designation. The imperfect habitual sense of the former arrangement is more naturally represented by ‘नहीं चुकाते थे.’
  naturalness: The revised wording is fluent modern Hindi while retaining an appropriately formal biblical-administrative register. ‘उस गृह के कार्यों’ is clear with the temple footnote and avoids the misleadingly domestic sense of ‘घर के काम।’
  terminology: ‘अतिरिक्त राशि,’ ‘आय,’ and ‘कार्य’ suit the financial and administrative context. ‘गृह’ better preserves the literal designation οἶκος; the note identifies its temple referent without placing an interpretation into the main text.
  issues:
