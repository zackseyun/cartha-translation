  yaml_path: translation/deuterocanon/1_maccabees/010/065.yaml
  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: hi
  text: और राजा ने उसका सम्मान किया, उसका नाम ‘प्रथम मित्रों’ की सूची[a] में दर्ज किया, और उसे सेनापति तथा एक जिले का शासक[b] नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रमुख मित्रों की श्रेणी।” ‘प्रथम मित्र’ संभवतः राजदरबार की एक आधिकारिक पद-श्रेणी थी।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द किसी भू-भाग या प्रशासनिक विभाग पर शासन करने वाले अधिकारी को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  choice: सम्मानित किया
  rationale: राजदरबार के इस राजनीतिक प्रसंग में क्रिया का अर्थ किसी को प्रतिष्ठा या सम्मान देना है, न कि धार्मिक अर्थ में उसकी महिमा करना।
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: उसका नाम ‘प्रथम मित्रों’ में दर्ज किया
  rationale: यहाँ γράφω आधिकारिक सूची या पद-श्रेणी में नाम दर्ज करने का भाव देता है। हिन्दी में ‘नाम ... में दर्ज किया’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν πρώτων φίλων
  choice: ‘प्रथम मित्रों’
  rationale: यह संभवतः राजकीय दरबार की एक आधिकारिक पदवी या श्रेणी थी। शाब्दिक रूप को उद्धरण-चिह्नों में रखने से उसका पारिभाषिक स्वरूप और मूल की संभावित अस्पष्टता दोनों बने रहते हैं।
- source_word: στρατηγὸν
  choice: सेनापति
  rationale: यहाँ सैन्य पद अभिप्रेत है; ‘सेनापति’ अगले प्रशासनिक पद से इसे स्पष्ट रूप से अलग रखता है।
- source_word: μεριδάρχην
  choice: एक जिले का शासक
  rationale: यह शब्द किसी भू-भाग या प्रशासनिक विभाग के अधिकारी को सूचित करता है। यह अनुवाद पद का अर्थ बताता है, पर उस प्राचीन प्रशासनिक इकाई को आधुनिक ‘प्रांत’ के ठीक बराबर नहीं ठहराता।
