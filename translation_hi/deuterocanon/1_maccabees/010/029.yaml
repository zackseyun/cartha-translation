  register: भाषा आधुनिक मानक हिन्दी में, राजकीय घोषणा के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मुक्त करता हूँ’ और ‘छूट देता हूँ’ द्वारा मूल की दो निकटवर्ती किंतु अलग क्रियाओं का अंतर रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रमवार उपस्थित हैं।
