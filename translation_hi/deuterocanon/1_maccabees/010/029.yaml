base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/029.yaml
  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: hi
  text: और हम तुम्हें बहुत-सी छूटें[a] देंगे और तुम्हें उपहार देंगे। अब मैं तुम्हें मुक्त करता हूँ और सभी यहूदियों को करों, नमक-शुल्क[b] और मुकुट-भेंटों[c] से छूट देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बहुत-सी छूटें’ का अनुवाद ‘बहुत-सी माफियाँ’ भी हो सकता है; यहाँ यूनानी पदबंध ἀφέματα πολλά आर्थिक दायित्वों से मिलने वाली छूटों या माफियों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: मूल अभिव्यक्ति τιμῆς τοῦ ἁλός का शाब्दिक अर्थ ‘नमक का मूल्य’ भी हो सकता है; इस राजकोषीय सूची में संभवतः नमक से संबंधित निर्धारित कर या शुल्क अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: ‘मुकुट-भेंटों’ के लिए मूल शब्द στεφάνων का शाब्दिक अर्थ ‘मुकुटों’ है। यह राजाओं को सम्मानस्वरूप दिए जाने वाले मुकुटों या उनके बदले चुकाई जाने वाली धनराशि के लिए प्रयुक्त हो सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν … ἀφέματα πολλά
  choice: बहुत-सी देनदारियों से छूट देंगे
  rationale: राजकीय और आर्थिक संदर्भ में यह पदबंध पाप-क्षमा नहीं, बल्कि देय दायित्वों की माफी या छूट बताता है। ‘देनदारियों से छूट’ आधुनिक हिन्दी में इसका आशय स्पष्ट रखते हुए मूल की व्यापकता बचाता है।
- source_word: δόματα
  choice: उपहार
  rationale: यह राजा द्वारा दी जाने वाली वस्तुओं या लाभों के लिए सामान्य शब्द है; ‘उपहार’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: ἀπολύω
  choice: मुक्त करता हूँ
  rationale: क्रिया कानूनी रूप से छोड़ने या बंधन से मुक्त करने का भाव रखती है। आगे आने वाली विशिष्ट कर-छूट से अलग इसकी सामान्य औपचारिक शक्ति बनाए रखी गई है।
- source_word: ἀφίημι … ἀπὸ τῶν φόρων
  choice: करों … से छूट देता हूँ
  rationale: ἀπό के साथ यहाँ राजकोषीय दायित्वों से विमुक्ति अभिप्रेत है; हिन्दी में ‘से छूट देता हूँ’ स्वाभाविक और प्रशासनिक रूप से स्पष्ट है।
- source_word: φόρων
  choice: करों
  rationale: यह राज्य को दिए जाने वाले सामान्य अनिवार्य भुगतानों का सहज आधुनिक हिन्दी रूप है।
- source_word: τιμῆς τοῦ ἁλός
  choice: नमक पर लगने वाले शुल्क
  rationale: शाब्दिक संरचना ‘नमक का मूल्य/निर्धारित शुल्क’ है। राजकोषीय सूची में इसे नमक से जुड़ा कर या निर्धारित शुल्क समझना सबसे उपयुक्त है, पर पादटिप्पणी में मूल की संभावित अस्पष्टता सुरक्षित रखी गई है।
- source_word: στεφάνων
  choice: मुकुट-भेंटों
  rationale: शाब्दिक अर्थ ‘मुकुटों’ का है, किंतु हेलेनिस्ती राजकीय व्यवहार में ये सम्मानस्वरूप दिए जाने वाले मुकुट अथवा उनके बदले की धनराशि हो सकते थे। ‘मुकुट-भेंट’ मूल बिंब और आर्थिक संदर्भ दोनों को रखता है।
