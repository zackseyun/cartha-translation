base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: hi
  text: मैं यरूशलेम के गढ़ पर अधिकार भी छोड़ता हूँ[a] और उसे महायाजक को सौंपता हूँ, ताकि वह उसमें अपनी पसंद के पुरुषों को गढ़ की रखवाली के लिए नियुक्त करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के अक्रा पर”; ‘अक्रा’ उस किलेबंद गढ़ का पारंपरिक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίημι
  choice: छोड़ता हूँ
  rationale: यहाँ क्रिया क्षमा करने के बजाय किसी अधिकार या दावे को त्यागने का प्रशासनिक भाव व्यक्त करती है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शब्द शासन या नियंत्रण के वैधानिक अधिकार को दर्शाता है; ‘अधिकार’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄκρας
  choice: गढ़
  rationale: संदर्भ यरूशलेम के किलेबंद नगर-दुर्ग का है। ‘गढ़’ साधारण पाठक के लिए स्पष्ट और संक्षिप्त है; ऐतिहासिक नाम ‘अक्रा’ पादटिप्पणी में रखा गया है।
- source_word: δίδωμι
  choice: सौंपता हूँ
  rationale: औपचारिक हस्तांतरण के इस संदर्भ में ‘सौंपता हूँ’ केवल भेंट देने के बजाय नियंत्रण हस्तांतरित करने का भाव स्पष्ट करता है।
- source_word: ἀρχιερεῖ
  choice: महायाजक
  rationale: यह यहूदी धार्मिक और राजनीतिक संदर्भ में ἀρχιερεύς का प्रचलित हिन्दी रूप है।
- source_word: ὅπως ἂν καταστῇ
  choice: ताकि वह ... नियुक्त करे
  rationale: यहाँ καθίστημι व्यक्तियों को किसी पद या दायित्व पर लगाने का भाव रखता है।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और इस सैनिक संदर्भ में पुरुष रक्षकों की ओर संकेत करता है।
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: अपनी पसंद के
  rationale: यह सहज हिन्दी में चुनाव महायाजक के अपने विवेक से होने पर αὐτός द्वारा दिए गए बल को बनाए रखता है।
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: उसकी रखवाली के लिए
  rationale: यह गढ़ की रक्षा और निगरानी करने के उद्देश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἄκρα को सामान्य संज्ञा मानकर अनुवाद करना या ऐतिहासिक नाम के रूप में लिप्यंतरित करना
  choice: गढ़
  alternative: अक्रा; किला
  rationale: मुख्य पाठ में ‘गढ़’ स्थान के स्वरूप को सामान्य पाठक के लिए तुरंत स्पष्ट करता है, जबकि ऐतिहासिक रूप ‘अक्रा’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रशासनिक घोषणा के अनुरूप रखी गई है। वाक्य की प्रथम-पुरुष राजकीय शैली तथा महायाजक को चयन और नियुक्ति का अधिकार स्पष्ट रखा गया है।
