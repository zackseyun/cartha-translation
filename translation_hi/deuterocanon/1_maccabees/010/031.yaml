  yaml_path: translation/deuterocanon/1_maccabees/010/031.yaml
  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
translation:
  language: hi
  text: और यरूशलेम पवित्र और अलग ठहराई हुई रहे, और उसका क्षेत्र, उसके दशमांश और उसके कर भी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समर्पित” अथवा “पवित्र कार्य के लिए अलग की हुई।”
    reason: lexical_alternative
  - marker: b
    text: “क्षेत्र” का अनुवाद “उसकी सीमाएँ” भी हो सकता है; और “कर” के लिए “शुल्क,” “चुंगी” या “सीमा-शुल्क” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤτω
  choice: रहे
  rationale: εἰμί का तृतीय-पुरुष आज्ञार्थक रूप राजकीय आदेश की विधिक/आज्ञार्थक शक्ति व्यक्त करता है; हिंदी में ‘रहे’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἁγία
  choice: पवित्र
  rationale: यह यरूशलेम की धार्मिक और उपासना-संबंधी पवित्रता को सीधे और प्रचलित हिंदी में व्यक्त करता है।
- source_word: ἀφιεμένη
  choice: अलग ठहराया हुआ
  rationale: निष्क्रिय भाव को बनाए रखते हुए यह समर्पण अथवा विशेष प्रयोजन के लिए पृथक किए जाने का अर्थ देता है और ‘पवित्र’ से अलग दूसरा वर्णन सुरक्षित रखता है।
- source_word: τὰ ὅρια αὐτῆς
  choice: उसका सीमावर्ती क्षेत्र
  rationale: ὅρια सीमा-रेखाओं या उनसे संबद्ध भूभाग को सूचित कर सकता है। प्रशासनिक और राजस्व-संदर्भ में ‘सीमावर्ती क्षेत्र’ दोनों पहलुओं को यथासंभव खुला रखता है।
- source_word: αἱ δεκάται
  choice: उसके दशमांश
  rationale: δεκάται के लिए ‘दशमांश’ स्थापित बाइबलीय पद है; संबंधसूचक भाव संदर्भ से यरूशलेम और उसके क्षेत्र से जुड़ी आय को दर्शाता है।
- source_word: τὰ τέλη
  choice: कर
  rationale: τέλη कर, शुल्क, चुंगी या सीमा-शुल्क को सूचित कर सकता है; ‘कर’ आधुनिक हिंदी में व्यापक और स्वाभाविक मुख्य-पाठ विकल्प है।
theological_decisions:
- issue: ‘पवित्र’ और ἀφιεμένη का पारस्परिक संबंध
  choice: 'दोनों को अलग-अलग रखा गया: ‘पवित्र और अलग ठहराया हुआ’'
  alternative: ‘पवित्र और समर्पित’ अथवा केवल ‘पवित्र’
  rationale: यूनानी में दो समन्वित विशेषणात्मक विचार हैं। दोनों को बनाए रखने से धार्मिक पवित्रता और विशेष रूप से पृथक/समर्पित स्थिति एक ही अर्थ में विलीन नहीं होती।
- issue: τὰ ὅρια αὐτῆς का दायरा
  choice: ‘उसका सीमावर्ती क्षेत्र’
  alternative: ‘उसकी सीमाएँ’ या ‘उसका क्षेत्र’
  rationale: मूल पद सीमा-रेखाओं और उनसे घिरे अथवा संबद्ध भूभाग—दोनों अर्थों की अनुमति देता है। राजकीय और राजस्व-संदर्भ भूभाग की ओर संकेत करता है, पर पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: अंतिम राजस्व-पदों का वाक्यगत संबंध
  choice: डैश के बाद ‘उसके दशमांश और कर भी’ को उसी आदेश के विस्तार के रूप में रखा गया
  alternative: उन्हें केवल क्षेत्र की सूची के समान अनूदित करना
  rationale: यूनानी की संक्षिप्त सूची वाक्यगत संबंध को पूरी तरह स्पष्ट नहीं करती। हिंदी में ‘भी’ सूचीगत विस्तार दिखाता है, बिना यह निश्चित किए कि राजस्व स्वयं ‘पवित्र’ हैं या विधिक रूप से अलग रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में राजकीय आदेश की गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है। ‘अलग ठहराया हुआ’ धार्मिक और विधिक पृथक्करण दोनों की संभावना रखता है; पादटिप्पणियाँ मूल यूनानी की वास्तविक शाब्दिक अस्पष्टताओं को सुरक्षित रखती हैं।
