  yaml_path: translation/deuterocanon/1_maccabees/012/009.yaml
  text: And so we also[a], though having no need of these things, have the holy books that are in our hands as encouragement[b],
translation:
  language: hi
  text: इसलिए हम भी, यद्यपि हमें इन बातों की आवश्यकता नहीं है, हमारे हाथों में जो पवित्र पुस्तकें हैं, उनसे प्रोत्साहन[a] पाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ढाढ़स’ अथवा ‘सांत्वना’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हमारे हाथों में [हुई] पवित्र पुस्तकें’; इसका अर्थ उनके अधिकार में या उनके पास उपलब्ध पुस्तकें हो सकता है। संभवतः संकेत इस्राएल के पवित्र लेखों की ओर है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: आवश्यकता न होते हुए
  rationale: यह विशेषण ‘किसी चीज़ की आवश्यकता न होना’ व्यक्त करता है। यह रूप यूनानी कृदंत की रियायती छाया को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τούτων
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का संकेत प्रसंग में पहले कही गई सहायता या मैत्री से जुड़ी बातों की ओर है। ‘इन बातों’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: παράκλησιν
  choice: प्रोत्साहन
  rationale: यहाँ अर्थ पवित्र पुस्तकों से मिलने वाले बल, ढाढ़स या सांत्वना का है। ‘प्रोत्साहन’ इस व्यापक भाव को सहज हिन्दी में व्यक्त करता है, जबकि अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: τὰ βιβλία τὰ ἅγια
  choice: पवित्र पुस्तकें
  rationale: यह यूनानी पद का सीधा और ऐतिहासिक संदर्भ के अनुकूल अनुवाद है। ‘पवित्रशास्त्र’ की तुलना में यह मूल की व्यापकता को बेहतर बनाए रखता है।
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: जो ... हमारे हाथों में हैं
  rationale: यह मूल के ठोस मुहावरे ‘हमारे हाथों में’ को बनाए रखता है; इसका आशय उनके अधिकार में या सहज उपलब्ध होना भी हो सकता है।
theological_decisions:
- issue: ‘पवित्र पुस्तकों’ का संदर्भ
  choice: वाक्य में इसे सामान्य रूप से ‘पवित्र पुस्तकें’ रखा गया है, जो सम्भवतः इस्राएल के पवित्र लेखों की ओर संकेत करता है।
  alternative: इसे उनके अधिकार में मौजूद पवित्र दस्तावेज़ों का अधिक सामान्य उल्लेख माना जा सकता है।
  rationale: प्रसंग इस्राएल के पवित्र लेखों की ओर संकेत करता है, पर यूनानी पाठ स्वयं उनकी सूची या सीमा निश्चित नहीं करता; इसलिए अनुवाद उस व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की कृदंतीय संरचना को पठनीय हिन्दी में बदला गया है, पर ‘इन बातों’, ‘पवित्र पुस्तकें’ और ‘हमारे हाथों में’ जैसे प्रमुख पद मूल के निकट रखे गए हैं।
