base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: hi
  text: उसने उसका बड़े सम्मान के साथ स्वागत किया, अपने सभी मित्रों[a] से उसका परिचय कराया, उसे उपहार दिए, और अपने मित्रों तथा अपनी सेनाओं को आज्ञा दी कि वे भी उसी प्रकार उसकी आज्ञा मानें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मित्र’ यहाँ केवल निजी साथियों के लिए नहीं, बल्कि हेलेनवादी राजदरबार में राजा के निकटवर्ती मंडल के सदस्यों के लिए प्रयुक्त पद भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο ... ἐνδόξως
  choice: बड़े सम्मान के साथ स्वागत किया
  rationale: यह प्रयोग किसी व्यक्ति को आदरपूर्वक ग्रहण करने या उसका स्वागत करने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और दरबारी प्रसंग के अनुकूल है।
- source_word: συνέστησεν
  choice: परिचय कराया
  rationale: यहाँ अर्थ अपने सहयोगियों के सामने किसी को प्रस्तुत करने या उससे परिचित कराने का है। ‘परिचय कराया’ मुख्य पाठ में सर्वाधिक सहज है।
- source_word: φίλοις
  choice: मित्रों
  rationale: यूनानी का सीधा अर्थ ‘मित्रों’ है। हेलेनवादी राजदरबार में यह राजा के निकटवर्ती मंडल के सदस्यों के लिए प्रयुक्त पद भी हो सकता है; इस सांस्कृतिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: δόματα
  choice: उपहार
  rationale: बहुवचन संज्ञा का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: δυνάμεσιν
  choice: सेनाओं
  rationale: इस प्रसंग में बहुवचन शब्द शासक के अधीन सैन्य बलों को दर्शाता है; ‘सेनाओं’ साधारण पाठक के लिए स्पष्ट है।
- source_word: ὑπακούειν
  choice: आज्ञा मानें
  rationale: आदेश के इस प्रसंग में क्रिया का अर्थ किसी की बात सुनकर उसका पालन करना है; ‘आज्ञा मानें’ अधिकार-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡσαύτως
  choice: भी उसी प्रकार
  rationale: यह पहले वर्णित सम्मानपूर्ण व्यवहार से तुलना का संकेत देता है; ‘भी उसी प्रकार’ उस संबंध को हिन्दी में खुलकर बनाए रखता है।
