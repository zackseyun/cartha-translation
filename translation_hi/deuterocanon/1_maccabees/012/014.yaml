base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: hi
  text: हमने तुम्हारे पास भेजने और तुम्हारे साथ भाईचारे और मित्रता को नवीनीकृत करने का प्रयास किया, ताकि हम तुमसे पराये न हो जाएँ; क्योंकि जब से तुमने हमारे पास भेजा है, तब से बहुत समय[a] बीत चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘बहुत-से समय’ या ‘बहुत-सी अवधियाँ’; यूनानी में καιροί बहुवचन है और इसका अर्थ ‘समय’, ‘अवधियाँ’ या ‘ऋतुएँ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: हमने … प्रयत्न किया
  rationale: यह यूनानी अओरिस्ट जान-बूझकर प्रयास करने को व्यक्त करता है; हिन्दी में यह रूप स्वाभाविक है और प्रयास की सफलता को मानकर नहीं चलता।
- source_word: ἀποστεῖλαι
  choice: दूत भेजकर
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है। राजनयिक पत्राचार के प्रसंग में हिन्दी को स्वाभाविक और पूर्ण बनाने के लिए निहित कर्म को ‘दूत’ के रूप में व्यक्त किया गया है, बिना पत्र या किसी विशिष्ट व्यक्ति का अनुमान लगाए।
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: तुम्हारे साथ भाईचारे और मित्रता के सम्बन्ध को
  rationale: ἀδελφότης और φιλία के अलग-अलग भाव—भाईचारा और मित्रता—सुरक्षित रखे गए हैं; πρὸς ὑμᾶς को सम्बन्धसूचक ‘तुम्हारे साथ’ से व्यक्त किया गया है। एकवचन ‘सम्बन्ध’ दोनों को साझा राजनयिक रिश्ते के रूप में सहजता से जोड़ता है।
- source_word: ἀνανεώσασθαι
  choice: फिर से नया करने
  rationale: क्रिया पहले से विद्यमान सम्बन्ध के नवीकरण को बताती है। ‘फिर से नया करना’ साधारण पाठक के लिए स्पष्ट है और पुनर्स्थापना से अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: ताकि हम तुमसे पराये न हो जाएँ
  rationale: उद्देश्यवाचक रचना को ‘ताकि’ से और सम्बन्ध-विच्छेद या अलगाव के भाव को सहज हिन्दी ‘पराये न हो जाएँ’ से व्यक्त किया गया है।
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: क्योंकि … बहुत समय बीत चुका है
  rationale: καιροί व्याकरणतः बहुवचन है और ‘समयावधियाँ/अवसर’ कह सकता है, पर इस पत्रात्मक प्रसंग में हिन्दी का ‘बहुत समय’ वही कालगत अर्थ अधिक स्वाभाविक ढंग से देता है; बहुवचन की बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: जब से तुमने हमारे पास दूत भेजे थे
  rationale: ‘जब से’ आरम्भ-बिन्दु को स्पष्ट करता है। यूनानी में भेजी गई वस्तु या व्यक्ति अनुक्त है; पूर्वार्ध के समान राजनयिक प्रसंग के आधार पर हिन्दी में निहित कर्म ‘दूत’ व्यक्त किया गया है।
