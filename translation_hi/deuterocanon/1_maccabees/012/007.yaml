  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: hi
  text: इससे भी पहले, तुम्हारे बीच शासन करनेवाले राजा अरियुस की ओर से महायाजक ओनियास को पत्र भेजे गए थे, जिनमें लिखा था, “तुम हमारे भाई हो,” जैसा कि यहाँ प्रस्तुत प्रतिलिपि[a] से स्पष्ट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा कि नीचे दी गई प्रतिलिपि से स्पष्ट है।” यूनानी अभिव्यक्ति बताती है कि पहले के पत्र की एक प्रतिलिपि यहाँ प्रस्तुत की जा रही है या आगे जोड़ी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: इससे भी पहले
  rationale: यह अनुवाद πρότερον के तुलनात्मक कालबोध और ἔτι के बल—वर्तमान पत्राचार से भी पहले—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  choice: पत्र भेजे गए थे
  rationale: यूनानी में ἐπιστολαὶ बहुवचन है, इसलिए हिन्दी में भी ‘पत्र’ को बहुवचन अर्थ में रखा गया है; ‘भेजे गए थे’ पूर्वकालीन प्रसंग को स्पष्ट करता है।
- source_word: πρὸς Ὀνίαν τὸν ἀρχιερέα
  choice: महायाजक ओनियास को
  rationale: नाम और पदवी को आधुनिक, सहज हिन्दी क्रम में रखा गया है।
- source_word: παρὰ δʼ Ἀρείου
  choice: राजा अरियुस की ओर से
  rationale: παρά संबंधवाचक यहाँ पत्रों के स्रोत को बताता है। ‘की ओर से’ हिन्दी में आधिकारिक पत्र-प्रेषक के लिए स्वाभाविक है।
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: आपके यहाँ शासन करनेवाले राजा
  rationale: βασιλεύοντος की राजकीय क्रिया और ἐν ὑμῖν के ‘आपके बीच/आपके यहाँ’ भाव को रखा गया है, बिना इसे अनिवार्यतः ‘आप पर’ बनाकर संबंध को अधिक निश्चित किए।
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: जिनमें लिखा था, “तुम हमारे भाई हो”
  rationale: ὅτι को कथन प्रस्तुत करनेवाले चिह्न के रूप में लेकर प्रत्यक्ष कथन बनाया गया है। ἀδελφοί का सीधा और सामूहिक संबंधसूचक अनुवाद ‘भाई’ है।
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: जैसा कि यहाँ दी गई प्रतिलिपि से स्पष्ट है
  rationale: ἀντίγραφον दस्तावेज़ की प्रतिलिपि है और ὑπόκειται उसके यहाँ प्रस्तुत या आगे दिए होने का संकेत देता है। मुख्य पाठ किसी विशिष्ट पृष्ठ-विन्यास को अनावश्यक रूप से निश्चित नहीं करता।
