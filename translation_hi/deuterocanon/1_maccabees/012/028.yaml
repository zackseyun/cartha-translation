base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
translation:
  language: hi
  text: जब विरोधियों ने सुना कि योनातान और उसके साथ के लोग युद्ध के लिए तैयार हैं, तो वे डर गए और उनका दिल बैठ गया[a], और उन्होंने अपनी छावनी में आगें जलाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने अपना हृदय जमा लिया।” यह भय के कारण साहस खो देने या निरुत्साहित हो जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: विरोधियों
  rationale: यह शब्द योनातान के विरुद्ध खड़े लोगों को दर्शाता है। ‘विरोधी’ मूल के विरोधात्मक भाव को बनाए रखता है और प्रसंग से उनकी सैन्य शत्रुता स्पष्ट हो जाती है।
- source_word: ἡτοίμασται
  choice: तैयार हैं
  rationale: पूर्णकालिक रूप युद्ध के लिए तैयार हो चुकी वर्तमान अवस्था व्यक्त करता है; हिन्दी में ‘तैयार हैं’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἰωναθὰν καὶ οἱ παρʼ αὐτοῦ
  choice: योनातान और उसके साथ के लोग
  rationale: οἱ παρʼ αὐτοῦ का सीधा अर्थ उसके साथ या पास रहने वाले लोग है; यह अनावश्यक रूप से केवल सैनिक या पुरुष नहीं जोड़ता।
- source_word: εἰς πόλεμον
  choice: युद्ध के लिए
  rationale: यह तैयारी के उद्देश्य या दिशा को बताता है और πόλεμος के व्यापक सैन्य अर्थ को बनाए रखता है।
- source_word: ἐφοβήθησαν
  choice: वे डर गए
  rationale: यह यूनानी क्रिया के आकस्मिक भय को सरल और वर्तमान हिन्दी में स्पष्ट करती है।
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: उनका दिल बैठ गया
  rationale: मूल मुहावरे में हृदय के जम या जड़ हो जाने की छवि है। हिन्दी मुहावरा भय के कारण साहस टूटने और निरुत्साहित होने का अर्थ स्वाभाविक रूप से देता है; शाब्दिक छवि पादटिप्पणी में रखी गई है।
- source_word: ἀνέκαυσαν πυρὰς
  choice: आगें जलाईं
  rationale: बहुवचन πυράς और जलाने के अर्थ को सीधे व्यक्त करता है, बिना उन्हें विशेष रूप से अलाव मान लेने के।
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: अपनी छावनी में
  rationale: सैन्य प्रसंग में παρεμβολή का अर्थ छावनी है; ‘अपनी’ αὐτῶν के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
