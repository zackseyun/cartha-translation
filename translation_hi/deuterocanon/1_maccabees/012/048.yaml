  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: hi
  text: लेकिन जब योनातान प्तोलेमाइस में प्रवेश किया, तब प्तोलेमाइस के निवासियों ने फाटक बंद कर दिए, उसे पकड़ लिया, और उसके साथ आए हुए सभी लोगों को तलवार से मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: लेकिन जब
  rationale: यह पद कथा में समय-संबंधी परिवर्तन के साथ एक प्रतिकूल मोड़ भी दिखाता है; इसलिए ‘लेकिन जब’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσῆλθεν
  choice: दाखिल हुआ
  rationale: यह किसी स्थान के भीतर जाने का साधारण भूतकालीन कथन है; ‘दाखिल हुआ’ आधुनिक और सहज हिन्दी है।
- source_word: Πτολεμαΐδα
  choice: पतुलिमैस
  rationale: स्थान के यूनानी नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: οἱ Πτολεμαεῖται
  choice: पतुलिमैस के निवासी
  rationale: जातिवाचक रूप नगर के लोगों या निवासियों को दर्शाता है; यह अनुवाद स्पष्ट है और केवल पुरुषों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀπέκλεισαν τὰς πύλας
  choice: फाटक बंद कर दिए
  rationale: क्रिया का अर्थ बंद कर देना या मार्ग रोक देना है; प्रसंग में नगर के फाटकों को बंद करना सीधा और स्वाभाविक अनुवाद है।
- source_word: συνέλαβον αὐτόν
  choice: उसे पकड़ लिया
  rationale: क्रिया अचानक अपने अधिकार में लेने या बंदी बनाने को दर्शाती है; ‘पकड़ लिया’ किसी औपचारिक कानूनी गिरफ्तारी का अतिरिक्त भाव नहीं जोड़ता।
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: उन सभी को जो उसके साथ आए थे
  rationale: शाब्दिक रूप से ये वे सब हैं जो उसके साथ इकट्ठे होकर आए थे। प्रवेश का भाव संदर्भ से स्पष्ट है, इसलिए हिन्दी में अनावश्यक विस्तार किए बिना स्रोत की व्यापकता रखी गई है।
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: तलवार से मार डाला
  rationale: यह हिंसक वध का स्पष्ट मुहावरा है; ‘तलवार से मार डाला’ आधुनिक हिन्दी में सीधा और प्रभावी है।
