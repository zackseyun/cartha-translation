lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: फिर से बसाया
  rationale: क्रिया का मूल अर्थ ‘बनाया’ है, पर किसी विद्यमान नगर के संदर्भ में यह उसके पुनर्निर्माण या पुनः बसाए जाने का भाव भी दे सकती है। प्रसंग के अनुसार मुख्य पाठ में यह स्वाभाविक हिंदी चुनी गई है, और व्यापक अर्थ-सीमा पादटिप्पणी में रखी गई है।
- source_word: τὴν Ἀδιδὰ
  choice: अदीदा
  rationale: स्थान-नाम Ἀδιδά का सरल देवनागरी लिप्यंतरण।
- source_word: ἐν τῇ σεφηλά
  choice: शफेला प्रदेश में
  rationale: सेफेला/शफेला यहूदिया के पहाड़ी क्षेत्र और तटीय मैदान के बीच का विशिष्ट निम्न पहाड़ी भूभाग है। केवल ‘तराई’ कहने के बजाय क्षेत्रीय नाम रखना अधिक सटीक है; स्पष्टता के लिए ‘प्रदेश’ जोड़ा गया है।
- source_word: ὠχύρωσεν
  choice: दृढ़ किया
  rationale: यह क्रिया किसी स्थान को मजबूत और रक्षा-योग्य बनाने का अर्थ देती है। फाटकों और बेड़ों का अगला उल्लेख इस सैन्य अर्थ को स्पष्ट करता है।
- source_word: θύρας
  choice: फाटकों
  rationale: नगर की किलेबंदी के संदर्भ में ‘दरवाज़ों’ की अपेक्षा ‘फाटकों’ अधिक उपयुक्त है।
- source_word: μοχλούς
  choice: बेड़ों
  rationale: यहाँ आशय फाटकों को भीतर से रोकने वाले मजबूत आड़े शहतीरों या बेड़ों से है। ‘बेड़े’ संक्षिप्त और पारंपरिक किलाबंदी-वाचक शब्द है।
