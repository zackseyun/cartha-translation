base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: hi
  text: और अब उन्हें उनके घर भेज दे; पर अपने लिए थोड़े-से पुरुष चुन ले, जो तेरे साथ रहें। फिर मेरे साथ पतुलमैस चल; मैं उसे और बाकी गढ़ों, बहुत-से सैन्य दलों और कामकाज के सभी अधिकारियों[a] को तेरे हाथ सौंप दूँगा। तब मैं लौटकर चला जाऊँगा[b], क्योंकि मैं इसी उद्देश्य से यहाँ आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे कामकाज के प्रभारी”; यूनानी वाक्यांश का शाब्दिक अर्थ है वे लोग जो आवश्यकताओं या मामलों पर नियुक्त हैं।
    reason: lexical_alternative
  - marker: b
    text: “लौटकर चला जाऊँगा” यूनानी में संक्षिप्त अभिव्यक्ति है। लौटने की जगह और इसके बाद जाने का गंतव्य नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: उन्हें उनके घर भेज दे
  rationale: आज्ञार्थक क्रिया और घर लौटाए जाने का भाव स्वाभाविक हिन्दी में व्यक्त होता है; अलग से ‘विदा’ जोड़ना आवश्यक नहीं।
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  choice: पर अपने लिए थोड़े-से पुरुष चुन ले
  rationale: मध्यवाच्य का ‘अपने लिए’ वाला भाव रखा गया है, और ἄνδρας को प्रसंग के आधार पर अनावश्यक रूप से ‘सैनिक’ नहीं बनाया गया।
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: फिर मेरे साथ पतुलिमयिस चल
  rationale: δεῦρο यहाँ बुलावे की तरह प्रयुक्त है; गंतव्य के साथ ‘चल’ आधुनिक हिन्दी में स्वाभाविक है। Πτολεμαΐδα के लिए स्रोत-सन्निकट हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: παραδώσω σοι αὐτὴν
  choice: मैं उसे ... तेरे हाथ सौंप दूँगा
  rationale: यह नियंत्रण हस्तांतरित करने का भाव देता है; ‘तेरे हाथ’ हिन्दी में स्पष्ट और मुहावरेदार है।
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: बाकी गढ़ों
  rationale: ὀχυρώματα सैन्य दृष्टि से सुरक्षित किलाबंद स्थान हैं; ‘गढ़’ संक्षिप्त और सहज है।
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: विशाल सैन्य-दलों
  rationale: δυνάμεις का प्रसंगगत अर्थ सैन्य बल है और πολλὰς उनकी बड़ी संख्या या व्यापकता बताता है।
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: कामकाज के सभी अधिकारियों
  rationale: वाक्यांश का शाब्दिक संकेत आवश्यकताओं या मामलों पर नियुक्त लोगों की ओर है; ‘कामकाज के अधिकारी’ प्रशासनिक अर्थ रखता है, जबकि पादटिप्पणी व्यापक विकल्प बताती है।
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: तब मैं लौटकर चला जाऊँगा
  rationale: पूर्वकालिक कृदंत और भविष्य क्रिया का क्रम रखा गया है, पर लौटने की जगह या अंतिम गंतव्य नहीं जोड़ा गया।
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: क्योंकि मैं इसी उद्देश्य से यहाँ आया हूँ
  rationale: उपस्थिति के घोषित उद्देश्य को आधुनिक और स्पष्ट हिन्दी में व्यक्त किया गया है।
