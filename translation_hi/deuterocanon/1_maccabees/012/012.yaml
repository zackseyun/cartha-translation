lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: हम आनन्दित होते हैं
  rationale: यह मध्यम/कर्मवाच्य रूप प्रसन्न होने या आनन्द मनाने का भाव व्यक्त करता है; यह चयन यूनानी क्रिया का बल बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ यहाँ हल्का विरोध अथवा कथन में मोड़ दिखाता है; ‘परन्तु’ उसके संयोजक बल को स्पष्ट रखता है।
- source_word: ἐπὶ
  choice: पर
  rationale: सम्प्रदान कारक के साथ ἐπί आनन्द के आधार या अवसर को सूचित कर सकता है; ‘महिमा पर आनन्दित’ मूल संरचना के निकट है, जबकि पाद-टिप्पणी अधिक सहज अर्थों को स्पष्ट करती है।
- source_word: τῇ δόξῃ
  choice: महिमा
  rationale: δόξα का सीधा समतुल्य ‘महिमा’ है; यहाँ इसका आशय सम्मानित प्रतिष्ठा या यश भी हो सकता है, इसलिए उन अर्थों को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ὑμῶν
  choice: आपकी
  rationale: यह बहुवचन द्वितीय-पुरुष सम्बन्धवाचक रूप है; आदरपूर्ण आधुनिक हिन्दी में ‘आपकी’ उपयुक्त है।
