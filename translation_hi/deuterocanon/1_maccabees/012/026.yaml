  yaml_path: translation/deuterocanon/1_maccabees/012/026.yaml
  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
translation:
  language: hi
  text: उसने उनके शिविर में टोही भेजे। वे लौट आए और उसे खबर दी, “वे रात को उन पर टूट पड़ने के लिए इस तरह मोर्चा बाँध रहे हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे रात को उन पर आक्रमण करने के लिए इस प्रकार पंक्तिबद्ध हो रहे हैं।” यूनानी शब्द का अर्थ केवल योजना बनाना नहीं, बल्कि व्यवस्थित या युद्ध-विन्यास में तैनात होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: कथात्मक भूतकाल में यह सरल, स्वाभाविक और अर्थ-सटीक प्रयोग है।
- source_word: κατασκόπους
  choice: टोही
  rationale: सैन्य संदर्भ में यह शत्रु की स्थिति का पता लगाने के लिए भेजे गए लोगों को दर्शाता है; ‘जासूस’ भी संभव है, पर ‘टोही’ यहाँ सैन्य टोह के भाव को अधिक सीधे व्यक्त करता है।
- source_word: παρεμβολήν
  choice: शिविर
  rationale: इस सैन्य संदर्भ में यूनानी शब्द सेना के पड़ाव या छावनी को सूचित करता है; ‘शिविर’ सहज और संक्षिप्त है।
- source_word: ἀπήγγειλαν
  choice: खबर दी
  rationale: टोही अभियान के बाद लौटकर सूचना देने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: Οὕτως τάσσονται
  choice: इस तरह मोर्चा बाँध रहे हैं
  rationale: τάσσονται में अपने को व्यवस्थित करने, तैनात होने या युद्ध-विन्यास में खड़े होने का भाव है। ‘मोर्चा बाँध रहे हैं’ सामरिक तैयारी को व्यक्त करता है और केवल योजना बनाने तक अर्थ को सीमित नहीं करता।
- source_word: ἐπιπεσεῖν
  choice: टूट पड़ने के लिए
  rationale: यह शत्रुतापूर्ण और अचानक धावा बोलने की सजीव शक्ति को बनाए रखता है।
- source_word: τὴν νύκτα
  choice: रात को
  rationale: समय-सूचक यूनानी कर्मकारक का यह स्वाभाविक आधुनिक हिन्दी रूप है।
