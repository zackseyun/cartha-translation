translation:
  language: hi
  text: और उन्होंने उन्हें हर स्थान के लोगों के नाम पत्र दिए[a], ताकि वे उन्हें शांति से यहूदा देश तक आगे भेज दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्थान-स्थान के लिए पत्र’; यह वाक्यांश मार्ग में पड़ने वाले प्रत्येक स्थान के लोगों या अधिकारियों को संबोधित पत्रों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्हें आगे तक साथ ले जाएँ’; यूनानी क्रिया में यात्रियों के साथ जाने और उनकी आगे की यात्रा में सहायता करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: उन्होंने ... दिए
  rationale: δίδωμι का सीधा कथात्मक अर्थ ‘देना’ है; हिन्दी में बहुवचन ‘पत्र’ के साथ ‘दिए’ स्वाभाविक है।
- source_word: ἐπιστολὰς
  choice: पत्र
  rationale: ἐπιστολή लिखित संदेश या पत्र को सूचित करता है; ‘पत्र’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: उन्हें ... लोगों के नाम
  rationale: पहला सर्वनाम पत्र पाने वाले यात्रियों को और दूसरा मार्ग के प्रत्येक स्थान के संबोधित लोगों को दर्शाता है। ‘के नाम’ पत्रों की दिशा स्पष्ट करता है, पर व्यक्तियों को अधिकारी मानकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: κατὰ τόπον
  choice: हर स्थान के
  rationale: वितरणात्मक अर्थ ‘स्थान-स्थान पर’ या ‘प्रत्येक स्थान में’ है। ‘हर स्थान के लोगों’ से मार्ग के अलग-अलग स्थानीय संबोधन स्पष्ट होते हैं।
- source_word: ὅπως
  choice: ताकि
  rationale: उद्देश्यवाचक बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: προπέμπωσιν
  choice: आगे पहुँचा दें
  rationale: προπέμπω में किसी यात्री को आगे भेजने, यात्रा में सहायता देने या साथ पहुँचाने का अर्थ हो सकता है। ‘आगे पहुँचा दें’ इस व्यापक यात्रा-सहायता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γῆν Ἰούδα
  choice: यहूदा देश
  rationale: यूनानी पद का शाब्दिक आशय ‘यहूदा की भूमि/देश’ है। ‘यहूदा देश’ नाम और भौगोलिक भाव दोनों सुरक्षित रखता है।
- source_word: μετʼ εἰρήνης
  choice: शान्ति से
  rationale: शाब्दिक अर्थ ‘शान्ति के साथ’ है और प्रसंग में सुरक्षित, निर्विघ्न यात्रा का भाव देता है; ‘शान्ति से’ मूल अभिव्यक्ति को बनाए रखता है।
