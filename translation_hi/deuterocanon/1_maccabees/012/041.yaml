lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: यह ἐξέρχομαι के सामान्य अर्थ ‘बाहर निकलना/चल पड़ना’ को स्वाभाविक हिन्दी कथन में व्यक्त करता है और अनावश्यक सैन्य अर्थ नहीं जोड़ता।
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: उससे मिलने
  rationale: यह यूनानी प्रयोजन-सूचक मुहावरे का सहज और सटीक हिन्दी रूप है।
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: चालीस हज़ार पुरुषों को साथ लेकर
  rationale: यहाँ ἐν संगति का भाव देता है; ‘साथ लेकर’ योनातान के उन पुरुषों से घिरे/साथ होने का स्वाभाविक हिन्दी रूप है, जबकि ἀνδρῶν को ‘सैनिक’ बनाकर अधिक व्याख्या नहीं की गई।
- source_word: ἐπιλεγμέναις
  choice: चुने हुए
  rationale: यह विशेष रूप से चयनित पुरुषों का अर्थ सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: εἰς παρατάξιν
  choice: युद्ध-विन्यास के लिए
  rationale: παράταξις केवल सामान्य युद्ध नहीं, बल्कि युद्ध के लिए पंक्ति या सैन्य गठन में लगाए जाने का भाव रखता है; ‘युद्ध-विन्यास’ उस ठोस अर्थ को बचाता है।
- source_word: ἦλθεν εἰς Βεθσάν
  choice: बेत-शान पहुँचा
  rationale: गंतव्य के साथ हिन्दी में ‘पहुँचा’ स्वाभाविक है और ἦλθεν की गति तथा आगमन दोनों को स्पष्ट करता है; स्थान-नाम का लिप्यंतरण किया गया है।
