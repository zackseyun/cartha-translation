  yaml_path: translation/deuterocanon/1_maccabees/012/049.yaml
  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
translation:
  language: hi
  text: और त्रूफ़ोन ने सैनिक टुकड़ियों और घुड़सवार सेना को गलील में, बड़े मैदान में, योनातान के साथ रहने वाले सभी लोगों का नाश करने के लिए भेजा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योनातान के पक्ष के सभी लोगों को।” यूनानी वाक्यांश का शाब्दिक अर्थ “योनातान के साथ/पास के सभी लोग” है और संभवतः उसके समर्थकों या सैनिकों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सामान्य भूतकालीन क्रिया सैन्य दलों को किसी स्थान की ओर रवाना करने का सीधा अर्थ देती है; ‘भेजा’ स्वाभाविक और पर्याप्त रूप से गरिमापूर्ण है।
- source_word: δυνάμεις
  choice: सैनिक टुकड़ियों
  rationale: बहुवचन यहाँ अमूर्त ‘शक्तियों’ के बजाय सैन्य बलों को दर्शाता है। ‘सैनिक टुकड़ियों’ से सैन्य संदर्भ स्पष्ट होता है, पर पैदल सेना जैसा अनावश्यक विशेषीकरण नहीं जुड़ता।
- source_word: ἵππον
  choice: घुड़सवार सेना
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में घोड़ों पर लड़ने वाले सैन्य बल के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘घुड़सवार सेना’ स्वाभाविक है।
- source_word: εἰς Γαλιλαίαν
  choice: गलील में
  rationale: εἰς सैनिकों की गलील की ओर गति और वहाँ प्रवेश को सूचित करता है; हिन्दी में भेजने की क्रिया के साथ ‘गलील में’ यही गंतव्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: बड़े मैदान में
  rationale: दूसरा εἰς गंतव्य को और विशिष्ट करता है; πεδίον का अर्थ ‘मैदान’ और μέγα का अर्थ ‘बड़ा’ है। भौगोलिक अभिव्यक्ति को पाठ के अनुसार सामान्य रखा गया है।
- source_word: τοῦ ἀπολέσαι
  choice: ताकि ... नष्ट कर दे
  rationale: सकार्थक infinitive उद्देश्य बताता है। ‘नष्ट कर दे’ घातक सैन्य उन्मूलन की व्यापकता बनाए रखता है और केवल ‘मार डाले’ तक अर्थ सीमित नहीं करता।
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: योनातान के साथ के सभी लोगों
  rationale: παρά और व्यक्ति का नाम यहाँ संगति अथवा पक्षधरता व्यक्त कर सकता है। मुख्य पाठ का शब्दांकन निकट संबंध बनाए रखता है, जबकि पादटिप्पणी संभावित ‘समर्थकों’ वाले अर्थ को स्पष्ट करती है।
