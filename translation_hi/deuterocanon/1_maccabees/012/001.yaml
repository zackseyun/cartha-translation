translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजनयिक संदर्भ स्पष्ट करने के लिए φιλία को ‘मैत्रीपूर्ण संबंध’ कहा गया है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद मुख्य पाठ में रखे गए हैं।
