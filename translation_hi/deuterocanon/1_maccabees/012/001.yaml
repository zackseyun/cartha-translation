base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: hi
  text: जब योनातान ने देखा कि समय उसके अनुकूल था,[a] तब उसने कुछ पुरुषों को चुना और उन्हें रोम भेजा, ताकि वे रोमियों के साथ मैत्री[b] को स्थापित करने और नवीकृत करने के लिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “अवसर उसके पक्ष में था” या अधिक शाब्दिक रूप से “समय उसका साथ दे रहा था” भी हो सकता है। यूनानी मुहावरे का आशय है कि परिस्थितियाँ योनातान के लिए लाभकारी थीं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मैत्री” से संभवतः औपचारिक राजनयिक मैत्री का आशय है, केवल व्यक्तिगत स्नेह का नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... ने देखा
  rationale: अओरिस्ट कृदन्त मुख्य कार्यों की परिस्थिति बताता है; यह हिन्दी में उसके कालगत और आंशिक कारणगत भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: समय उसके अनुकूल है
  rationale: καιρός उपयुक्त अवसर या निर्णायक समय को दर्शाता है, और συνεργεῖ का शाब्दिक भाव ‘साथ काम करना’ है। हिन्दी मुहावरे में यह चयन परिस्थितियों के योनातान के पक्ष में होने का अर्थ स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐπέλεξεν ἄνδρας
  choice: उसने कुछ पुरुषों को चुना
  rationale: ἄνδρας स्पष्टतः पुरुषों को सूचित करता है। हिन्दी में अनिर्दिष्ट बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: उन्हें रोम भेजा
  rationale: राजनयिक दूतों को भेजे जाने का सीधा और स्वाभाविक अनुवाद।
- source_word: στῆσαι
  choice: स्थापित करें
  rationale: उद्देश्यसूचक क्रिया रूप है; राजनयिक संदर्भ में संबंध को दृढ़ आधार देने या कायम करने का भाव है।
- source_word: ἀνανεῶσαι
  choice: उन्हें नया करें
  rationale: पहले से विद्यमान संबंधों को फिर से ताज़ा या पुष्ट करने का भाव सुरक्षित रहता है।
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: रोमियों के साथ मैत्रीपूर्ण संबंध
  rationale: αὐτοὺς का संदर्भ रोम में रहने वालों अर्थात रोमियों से है। φιλία निजी स्नेह के साथ औपचारिक राजनीतिक मैत्री भी सूचित कर सकता है; ‘मैत्रीपूर्ण संबंध’ इस राजनयिक संदर्भ को स्पष्ट करता है, बिना इसे निश्चित रूप से ‘संधि’ बनाने के।
