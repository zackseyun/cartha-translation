base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: hi
  text: और यरूशलेम की दीवारों को सुदृढ़ करे, और गढ़[a] तथा नगर के बीच एक बहुत ऊँचा अवरोध खड़ा करे, ताकि गढ़ नगर से अलग होकर अपने आप में रहे और वहाँ के लोग न तो खरीद सकें, न बेच सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘अक्रा’, यरूशलेम में स्थित किलेबंद गढ़।
    reason: ऐतिहासिक नाम और lexical alternative को सुरक्षित रखना।
lexical_decisions:
- source_word: προφυῶσαι
  choice: सुदृढ़ करे
  rationale: यह दुर्लभ क्रिया दीवारों को आगे बढ़ाकर, अतिरिक्त रक्षात्मक निर्माण जोड़कर या अधिक मजबूत करने का भाव दे सकती है। प्रसंग में ‘सुदृढ़ करे’ सैन्य-निर्माण का आशय स्पष्ट रखता है, पर निर्माण की अनिश्चित विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: यरूशलेम की दीवारों
  rationale: τείχη नगर की रक्षात्मक दीवारों के लिए सामान्य बहुवचन है; ‘दीवारें’ सरल और सीधा हिन्दी रूप है।
- source_word: ὑψῶσαι ὕψος μέγα
  choice: एक बहुत ऊँचा अवरोध खड़ा करे
  rationale: यूनानी पदबंध शब्दशः ‘बहुत ऊँचाई उठाए’ जैसा है। गढ़ और नगर को अलग करने के स्पष्ट उद्देश्य को देखते हुए ‘बहुत ऊँचा अवरोध’ स्वाभाविक हिन्दी में उस ऊँची विभाजक रचना का भाव देता है, यद्यपि यूनानी यहाँ किसी विशिष्ट निर्माण-प्रकार का नाम नहीं लेता।
- source_word: ἄκρας
  choice: गढ़
  rationale: यह यरूशलेम के भीतर स्थित किलेबंद गढ़, ऐतिहासिक ‘अक्रा’, को सूचित करता है। ‘गढ़’ सामान्य पाठक के लिए कार्य स्पष्ट करता है; ऐतिहासिक नाम पादटिप्पणी में सुरक्षित है।
- source_word: εἰς τὸ διαχωρίσαι αὐτὴν τῆς πόλεως
  choice: ताकि गढ़ नगर से अलग होकर
  rationale: यह उद्देश्यसूचक रचना है। स्त्रीलिंग सर्वनाम αὐτή का सबसे स्वाभाविक पूर्वपद ἄκρα है; हिन्दी में संज्ञा को दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: κατὰ μόνας
  choice: अपने आप में रहे
  rationale: इस पदबंध में अलग-थलग और स्वतंत्र रूप से रहने का भाव है। यह हिन्दी रूप भौतिक अलगाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: और वहाँ के लोग न तो खरीद सकें, न बेच सकें
  rationale: यूनानी में बहुवचन कर्ता निहित है और गढ़ में रहने वालों की ओर संकेत करता है। ‘वहाँ के लोग’ हिन्दी में संदर्भ स्पष्ट करता है, जबकि खरीदने और बेचने—दोनों पर रोक—यथावत रखता है।
theological_decisions:
- issue: ἄκρα की ऐतिहासिक पहचान
  choice: मुख्य पाठ में ‘गढ़’ और पादटिप्पणी में ‘अक्रा’
  alternative: मुख्य पाठ में ही ‘अक्रा’ या ‘किला’
  rationale: यह सिद्धान्तगत विवाद नहीं, बल्कि ऐतिहासिक नाम और पठनीयता के बीच चयन है। कार्यसूचक ‘गढ़’ आधुनिक पाठक के लिए स्पष्ट है और पादटिप्पणी विशिष्ट ऐतिहासिक नाम सुरक्षित रखती है।
- issue: αὐτή का पूर्वपद
  choice: इसे गढ़ के संदर्भ में समझना
  alternative: सर्वनाम को अस्पष्ट छोड़ना
  rationale: व्याकरणिक स्त्रीलिंग और वाक्य का उद्देश्य दोनों ἄκρα की ओर संकेत करते हैं। संप्रदायगत अर्थ जोड़े बिना हिन्दी में ‘गढ़’ दोहराना आवश्यक स्पष्टता देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य संदर्भ के लिए ‘सुदृढ़’, ‘गढ़’ और ‘अवरोध’ जैसे परिचित शब्द चुने गए हैं। यूनानी की निर्माण-विधि संबंधी अनिश्चितता को किसी खास प्रकार की दीवार या प्राचीर बताकर सीमित नहीं किया गया।
