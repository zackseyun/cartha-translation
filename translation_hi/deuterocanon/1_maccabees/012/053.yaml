base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: hi
  text: उनके चारों ओर के सभी राष्ट्रों ने उन्हें मिटा डालने का प्रयत्न किया[a], क्योंकि उन्होंने कहा, “उन पर शासन करने और उनकी सहायता करने वाला कोई पुरुष नहीं है[b]। इसलिए अब आओ, हम उनके विरुद्ध युद्ध करें और मनुष्यों के बीच से उनकी स्मृति मिटा दें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका पूरी तरह नाश कर देने का प्रयत्न किया’; यूनानी क्रिया पूर्ण उन्मूलन का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से, ‘उनके पास शासन और सहायता करने वाला कोई पुरुष नहीं है’; अन्य सम्भव अनुवाद: ‘उनका नेतृत्व और सहायता करने वाला कोई शासक नहीं है।’'
    reason: lexical_alternative
  - marker: c
    text: या ‘मानव-समाज से उनका स्मरण मिटा दें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: प्रयत्न किया
  rationale: यहाँ ζητέω के साथ अनंत क्रिया उद्देश्यपूर्ण प्रयास को व्यक्त करती है; ‘प्रयत्न किया’ केवल इच्छा के बजाय सक्रिय मंशा को स्पष्ट करता है।
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: उनके चारों ओर के सभी राष्ट्रों
  rationale: ἔθνη आसपास के शत्रुतापूर्ण जनसमूहों या राजनैतिक समुदायों को सूचित करता है; ‘राष्ट्र’ तटस्थ है और ‘गैर-यहूदी’ अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἐκτρῖψαι
  choice: उन्हें मिटा डालने
  rationale: ἐκτρίβω में पूर्ण उन्मूलन का प्रबल भाव है; ‘मिटा डालना’ आधुनिक हिन्दी में उस बल को स्वाभाविक ढंग से रखता है।
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  choice: उन पर शासन करने और उनकी सहायता करने वाला कोई पुरुष
  rationale: ἄνδρα स्पष्ट रूप से एक पुरुष को सूचित करता है, जबकि दोनों कृदंत उसके शासन और सहायता के कार्य बताते हैं। हिन्दी रचना मूल अर्थ को रखते हुए सहज है।
- source_word: πολεμήσωμεν
  choice: आओ, हम उनके विरुद्ध युद्ध करें
  rationale: यह आग्रहसूचक संभावनार्थक रूप संगठित युद्ध छेड़ने का आह्वान है; ‘युद्ध करें’ उसका व्यापक सैनिक अर्थ बनाए रखता है।
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: मनुष्यों के बीच से उनकी स्मृति मिटा दें
  rationale: μνημόσυνον स्मृति या स्मरण को सूचित करता है और पूरी अभिव्यक्ति उनके अस्तित्व की याद तक समाप्त करने की मंशा बताती है।
theological_decisions:
- issue: शत्रुओं के कथन में लिंग-सूचक भाषा
  choice: ‘कोई पुरुष’ रखा गया
  alternative: ‘कोई अगुआ’ या ‘कोई शासक’
  rationale: ἄνδρα स्पष्टतः पुल्लिंग एकवचन है; केवल ‘अगुआ’ कहने से मूल में उपस्थित पुरुष-संदर्भ लुप्त हो जाएगा।
- issue: ἀνθρώπων का सामान्य मानवीय अर्थ
  choice: ‘मनुष्यों के बीच से’
  alternative: ‘मानव-समाज से’
  rationale: यहाँ बहुवचन ἀνθρώπων समस्त मानव समुदाय के सामान्य अर्थ में है। ‘मनुष्यों’ मूल की शब्दावली के निकट रहते हुए हिन्दी में समावेशी सामान्य अर्थ भी देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी है। ‘मिटा डालना’ तथा ‘स्मृति मिटा देना’ मूल के उन्मूलनकारी बल को रखते हैं; ‘कोई पुरुष’ यूनानी के स्पष्ट पुल्लिंग को सुरक्षित रखता है, जबकि ‘मनुष्यों’ का प्रयोग ἀνθρώπων के सामान्य मानव-संदर्भ में किया गया है।
