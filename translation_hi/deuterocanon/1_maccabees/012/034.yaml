  yaml_path: translation/deuterocanon/1_maccabees/012/034.yaml
  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: hi
  text: क्योंकि उसने सुना था कि वे गढ़ को दिमेत्रियुस के पक्ष के लोगों के हाथ सौंपना चाहते हैं। इसलिए उसने वहाँ एक सैनिक टुकड़ी तैनात कर दी, ताकि वे उसकी रक्षा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: उसने सुना था
  rationale: ἀκούω का सीधा अर्थ रखा गया है; यहाँ यह आगे की कार्रवाई का कारण बताने वाली सूचना को व्यक्त करता है।
- source_word: βούλονται
  choice: सौंपना चाहते हैं
  rationale: βούλομαι इच्छा या इरादा दोनों व्यक्त कर सकता है। ‘चाहते हैं’ स्वाभाविक हिन्दी है और यूनानी की इस अर्थगत गुंजाइश को बनाए रखता है।
- source_word: τὸ ὀχύρωμα
  choice: गढ़
  rationale: ὀχύρωμα किसी सुदृढ़ किलेबंद स्थान को दर्शाता है। ‘गढ़’ संक्षिप्त, सहज और सैन्य प्रसंग के अनुकूल है।
- source_word: παραδοῦναι
  choice: के हाथ सौंपना
  rationale: παραδίδωμι यहाँ किसी स्थान का नियंत्रण दूसरे पक्ष को दे देने के अर्थ में है; यह प्रयोग ‘आत्मसमर्पण’ जैसी अतिरिक्त व्याख्या से बचता है।
- source_word: τοῖς παρὰ Δημητρίου
  choice: दिमेत्रियुस के पक्ष के लोगों के हाथ
  rationale: παρά सहित यह पद दिमेत्रियुस से संबद्ध या उसके पक्ष में रहने वालों को सूचित करता है; अनुवाद उन्हें केवल सैनिक मानकर अर्थ को संकरा नहीं करता।
- source_word: ἔθετο
  choice: तैनात कर दी
  rationale: φρουράν के साथ τίθημι का भाव किसी रक्षक सैन्य दल को एक स्थान पर नियुक्त करने का है; ‘तैनात’ इसका स्वाभाविक सैन्य प्रयोग है।
- source_word: φρουράν
  choice: एक सैनिक टुकड़ी
  rationale: φρουρά रक्षक दल या छावनी को सूचित कर सकता है। ‘सैनिक टुकड़ी’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और वहाँ छोड़े गए सैन्य दल का भाव देता है।
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: ताकि वे उसकी रक्षा करें
  rationale: ὅπως और विधिलिंग उद्देश्य व्यक्त करते हैं। φυλάσσω का यहाँ आशय गढ़ को सुरक्षित रखने और उसकी रखवाली करने से है। स्त्रीलिंग ‘उसकी’ निकटवर्ती ‘टुकड़ी’ नहीं, पहले उल्लिखित गढ़ की रक्षा को संदर्भ से व्यक्त करता है।
