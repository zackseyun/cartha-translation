  yaml_path: translation/deuterocanon/1_maccabees/012/052.yaml
  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: hi
  text: और वे सब सकुशल यहूदा के देश में आए। उन्होंने योनातान और उसके साथ रहनेवालों के लिए शोक मनाया, और वे बहुत डर गए। इस्राएल ने बहुत बड़ा शोक मनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ बल देने के लिए एक ही मूल के शब्दों का प्रयोग है; इसका अधिक शाब्दिक अनुवाद है, “इस्राएल ने एक बड़ा शोक मनाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: लौट आए
  rationale: पूर्ववर्ती प्रसंग में यहूदा देश की ओर वापसी निहित है; हिन्दी कथा-प्रवाह में ‘लौट आए’ स्वाभाविक रूप से इस दिशा को व्यक्त करता है।
- source_word: πάντες
  choice: वे सब
  rationale: यूनानी के स्पष्ट समष्टिगत बल को सीधे बनाए रखता है।
- source_word: μετʼ εἰρήνης
  choice: सकुशल
  rationale: इस प्रसंग में वाक्यांश सुरक्षित और बिना हानि के पहुँचने का भाव देता है; ‘शान्ति से’ हिन्दी में केवल शांत ढंग से आने का भ्रामक अर्थ दे सकता था।
- source_word: γῆν Ἰούδα
  choice: यहूदा देश
  rationale: γῆ के भूभाग-संबंधी अर्थ और Ἰούδα नाम—न कि बाद के रोमी प्रान्त ‘यहूदिया’—दोनों को सुरक्षित रखता है।
- source_word: ἐπένθησαν
  choice: शोक मनाया
  rationale: मृत या खोए हुए लोगों के लिए सार्वजनिक और गंभीर मातम के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν Ἰωνάθαν
  choice: योनातान ... के लिए
  rationale: हिन्दी में शोक के व्यक्ति-वाचक विषय को ‘के लिए’ से स्वाभाविक रूप से व्यक्त किया जाता है।
- source_word: τοὺς μετʼ αὐτοῦ
  choice: जो उसके साथ थे
  rationale: उन लोगों की भूमिका या हैसियत को ‘साथी’, ‘सैनिक’ आदि कहकर अनावश्यक रूप से निश्चित किए बिना यूनानी की खुली अभिव्यक्ति बनाए रखता है।
- source_word: ἐφοβήθησαν σφόδρα
  choice: वे बहुत डर गए
  rationale: σφόδρα की तीव्रता और घटना के फलस्वरूप उत्पन्न भय, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: इस्राएल ने बहुत बड़ा शोक मनाया
  rationale: ‘शोक मनाया’ और ‘बड़ा शोक’ के द्वारा यूनानी की सजातीय, बलाघाती अभिव्यक्ति को पठनीय हिन्दी में यथासंभव बनाए रखता है।
