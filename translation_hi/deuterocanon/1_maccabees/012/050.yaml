  yaml_path: translation/deuterocanon/1_maccabees/012/050.yaml
  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: hi
  text: और जब उन्हें पता चला कि वह पकड़ लिया गया था और मर चुका था, और उसके साथ के लोग भी, तो उन्होंने एक-दूसरे का हौसला बढ़ाया[a] और सघन गठन में, युद्ध के लिए तैयार होकर आगे बढ़ते गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने साहस बटोरा।” यूनानी में शाब्दिक रूप से “उन्होंने अपने आपको प्रोत्साहित किया” है—यह परस्पर हौसला बढ़ाने वाली अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: उन्हें पता चला
  rationale: संदर्भ में यह सूचना प्राप्त होने या वास्तविकता जान लेने को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: συνελήμφθη
  choice: पकड़ लिया गया है
  rationale: सैन्य प्रसंग में कर्मवाच्य क्रिया का अर्थ बंदी बना लिया जाना या पकड़ लिया जाना है; यह रूप मूल की अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ἀπώλωλεν
  choice: मर चुका है
  rationale: पूर्णकालिक रूप मृत्यु की परिणामी अवस्था बताता है। यह ‘मारा गया’ की अपेक्षा मृत्यु के ढंग को कम निर्धारित करता है।
- source_word: οἱ μετʼ αὐτοῦ
  choice: उसके साथ के लोग
  rationale: यह व्यापक अभिव्यक्ति है; ‘सैनिक’ या ‘साथी’ जोड़ने से बचकर यूनानी पाठ के सामान्य अर्थ को सुरक्षित रखा गया है।
- source_word: παρεκάλεσαν ἑαυτούς
  choice: उन्होंने एक-दूसरे का हौसला बढ़ाया
  rationale: शाब्दिक प्रतिवर्ती अभिव्यक्ति सामूहिक संदर्भ में परस्पर उत्साह और दृढ़ता देने का भाव रखती है; हिन्दी में यह उसका स्वाभाविक रूप है।
- source_word: ἐπορεύοντο
  choice: आगे बढ़ते गए
  rationale: क्रिया निरंतर आगे जाने को बताती है; अपूर्णकालिक पक्ष को ‘बढ़ते गए’ से व्यक्त किया गया है।
- source_word: συνεστραμμένοι
  choice: एकजुट होकर
  rationale: कृदंत सिमटकर या घनी संगठित अवस्था में होने का भाव देता है। ‘एकजुट होकर’ सामान्य पाठक के लिए स्वाभाविक है, जबकि युद्ध-सज्जा का संदर्भ साथ वाली पदावली से स्पष्ट होता है।
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: युद्ध के लिए तैयार
  rationale: यह यूनानी सैन्य अभिव्यक्ति का सीधा और सहज हिन्दी रूप है।
