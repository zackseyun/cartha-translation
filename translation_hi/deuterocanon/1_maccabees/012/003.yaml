base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: hi
  text: और वे रोम गए और परिषद-भवन[a] में गए और बोले, “महायाजक योनातान और यहूदी राष्ट्र ने हमें भेजा है कि हम उनके साथ पहले की तरह गठबंधन का नवीनीकरण करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिषद का सभा-कक्ष”; यूनानी शब्द शासकीय परिषद के मिलने के स्थान का नाम बताता है, किसी औपचारिक रोमी संस्थागत पदवी का नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: गए / जाकर
  rationale: क्रिया यहाँ सामान्य रूप से एक स्थान से दूसरे स्थान जाने को व्यक्त करती है। हिन्दी में पुनरावृत्ति को स्वाभाविक रखते हुए पहले प्रसंग में ‘गए’ और दूसरे में ‘जाकर’ प्रयुक्त हुआ है।
- source_word: βουλευτήριον
  choice: परिषद-भवन
  rationale: यह उस भवन या सभा-कक्ष को दर्शाता है जहाँ शासकीय परिषद बैठती थी। ‘परिषद-भवन’ ठोस स्थानवाचक अर्थ को बनाए रखता है और यूनानी पाठ से अधिक विशिष्ट रोमी संस्थागत पदवी नहीं जोड़ता।
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: महायाजक योनातान
  rationale: ἀρχιερεύς का मानक और ऐतिहासिक रूप से उपयुक्त हिन्दी अनुवाद ‘महायाजक’ है।
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: यहूदी राष्ट्र
  rationale: ἔθνος यहाँ यहूदियों को एक राष्ट्रीय समुदाय के रूप में प्रस्तुत करता है; ‘यहूदी राष्ट्र’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀπέστειλαν ἡμῖς
  choice: हमें भेजा है
  rationale: यूनानी रूप में सर्वनाम का रूप व्याकरण की दृष्टि से असामान्य है, पर संदर्भ स्पष्टतः प्रतिनिधियों को भेजे जाने का है। ‘भेजा है’ उनके वर्तमान अधिकार-पत्र की प्रासंगिकता दर्शाता है।
- source_word: ἀνανεώσασθαι
  choice: फिर से नया करें
  rationale: क्रिया पहले से विद्यमान व्यवस्था को पुनः नया या बहाल करने का भाव रखती है। यह हिन्दी पदबंध उस पुनर्नवीकरण को स्पष्ट करता है।
- source_word: συμμαχίαν
  choice: संधि
  rationale: राजनयिक संदर्भ में यह पक्षों के बीच गठबंधन या औपचारिक संधि को सूचित करता है। ‘संधि’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: κατὰ τὸ πρότερον
  choice: पहले की तरह
  rationale: यह वाक्यांश पूर्व व्यवस्था या संबंध की स्थिति की ओर संकेत करता है और हिन्दी में स्वाभाविक रूप से ‘पहले की तरह’ व्यक्त होता है।
