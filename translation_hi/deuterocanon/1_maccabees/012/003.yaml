  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजनयिक प्रसंग के लिए ‘परिषद-भवन’ और ‘संधि’ चुने गए हैं। उद्धृत कथन को सामान्य आधुनिक हिन्दी में रखा गया है, जबकि मूल के क्रम और आशय को सुरक्षित रखा गया है।
