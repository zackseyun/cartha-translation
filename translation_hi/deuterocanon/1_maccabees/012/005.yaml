  text: 'और उन पत्रों की प्रतिलिपि यह है, जिन्हें योनातान ने स्पार्टावासियों को लिखा था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह संज्ञा किसी लिखित दस्तावेज़ की नकल या प्रतिलिखित प्रति को दर्शाती है। ‘प्रतिलिपि’ आधुनिक मानक हिन्दी में सटीक और स्वाभाविक है।
- source_word: ἐπιστολῶν
  choice: पत्रों
  rationale: यूनानी शब्द बहुवचन में है; इसलिए हिन्दी में भी ‘पत्रों’ रखकर स्रोत की संख्या को सुरक्षित रखा गया है, भले ही आगे एक विशिष्ट पत्र का पाठ प्रस्तुत हो।
- source_word: ἔγραψεν
  choice: लिखा था
  rationale: क्रिया का सीधा अर्थ ‘लिखा’ है। भूतपूर्व संदर्भ को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘लिखा था’ चुना गया है।
- source_word: Ἰωνάθαν
  choice: योनातान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Σπαρτιάταις
  choice: स्पार्टावासियों को
  rationale: दत्तिव रूप पत्र पाने वालों को सूचित करता है। ‘स्पार्टावासियों को’ स्पष्ट करता है कि आशय स्पार्टा के लोगों से है।
