review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the two distinct actions: he retained three thousand with himself, left approximately two thousand in Galilee, and a thousand joined/went with him. “लगभग” properly represents ὡς with the numeral. The final phrase is defensible, but can more directly reflect συνῆλθον (‘came/joined with’) in idiomatic Hindi.'
  naturalness: “तीन हज़ार पुरुष” is grammatically valid but sounds stiff in modern Hindi military narration. “तीन हज़ार आदमी” is more natural and retains the male-person reference. “उसके साथ आ मिले” is a clear, natural narrative expression for joining him.
  terminology: No theological terminology occurs. “गलील” is the standard Hindi form of Galilee. “आदमी” is appropriate here for ἄνδρας in a military context without unnecessarily specifying ‘soldiers.’
  issues:
  - severity: low
    issue: The wording “तीन हज़ार पुरुष” is overly formal and unnatural in this narrative context.
    rationale: Although lexically possible, modern standard Hindi normally uses “आदमी” for a numbered body of men in such a context.
  - severity: low
    issue: “उसके साथ हो लिए” is somewhat idiomatic and less explicit about joining him.
    rationale: “उसके साथ आ मिले” more transparently conveys the Greek συνῆλθον while remaining natural Hindi.
  revised_text: पर उसने तीन हज़ार आदमी अपने साथ रखे; लगभग दो हज़ार को उसने गलील में छोड़ दिया, और एक हज़ार उसके साथ आ मिले।
