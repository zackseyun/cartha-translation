  yaml_path: translation/deuterocanon/1_maccabees/012/047.yaml
  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: hi
  text: पर उसने तीन हज़ार आदमी अपने साथ रखे; लगभग दो हज़ार को उसने गलील में छोड़ दिया, और एक हज़ार उसके साथ आ मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν … μεθʼ ἑαυτοῦ
  choice: अपने साथ रखे
  rationale: καταλείπω का मूल भाव ‘छोड़ना/शेष रखना’ है, पर ‘अपने साथ छोड़ रखे’ हिन्दी में अस्वाभाविक होता। ‘अपने साथ रखे’ सैन्य प्रसंग में अर्थ को स्वाभाविक रूप से व्यक्त करता है और μεθʼ ἑαυτοῦ की आत्मवाचकता बनाए रखता है।
- source_word: ἄνδρας τρισχιλίους
  choice: तीन हज़ार पुरुष
  rationale: ἄνδρας का सीधा अर्थ ‘पुरुष’ है। प्रसंग सैनिकों का है, फिर भी मूल से अधिक विशिष्ट ‘सैनिक’ जोड़ना आवश्यक नहीं।
- source_word: ὡς δισχιλίους
  choice: लगभग दो हज़ार
  rationale: संख्या के साथ ὡς अनुमान या निकटता प्रकट करता है; ‘लगभग’ इस सूक्ष्मता को स्पष्ट रखता है।
- source_word: ἀφῆκεν ἐν τῇ Γαλιλαίᾳ
  choice: गलील में छोड़ दिया
  rationale: ἀφίημι यहाँ किसी को एक स्थान पर रहने देने या पीछे छोड़ने का भाव देता है। ‘छोड़ दिया’ बिना औपचारिक तैनाती का अर्थ जोड़े स्वाभाविक है।
- source_word: χίλιοι δὲ συνῆλθον αὐτῷ
  choice: और एक हज़ार उसके साथ हो लिए
  rationale: συνέρχομαι का अर्थ साथ आना या किसी के साथ सम्मिलित होना है। ‘साथ हो लिए’ साथ जुड़ने और आगे साथ चलने—दोनों प्रासंगिक भावों को समेटता है।
