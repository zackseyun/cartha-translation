translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। संबोधन के लिए बहुवचन ‘तुम्हारे/तुमसे’ रखा गया है। अंतिम उपवाक्य में मूल यूनानी की अनिर्दिष्ट भेजी गई वस्तु या व्यक्ति को जानबूझकर स्पष्ट नहीं किया गया।
