  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
translation:
  language: hi
  text: हमने तुम्हारे पास संदेश भेजकर तुम्हारे साथ भाईचारे और मित्रता के संबंध को नवीनीकृत करने का प्रयत्न किया है, ताकि हम तुमसे पराए न हो जाएँ; क्योंकि जब से तुमने हमारे पास भेजा है, बहुत समय बीत चुका है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: हमने ... प्रयत्न किया है
  rationale: यह रूप किसी कार्य को करने के प्रयास को व्यक्त करता है; पूर्ण सफलता का दावा किए बिना स्वाभाविक हिन्दी देता है।
- source_word: ἀποστεῖλαι
  choice: संदेश भेजकर
  rationale: मूल क्रिया केवल ‘भेजना’ कहती है और कर्म को स्पष्ट नहीं करती। राजनयिक पत्राचार के प्रसंग में ‘संदेश’ निहित संचार को सहज बनाता है, जबकि किसी विशेष दूत को निर्दिष्ट नहीं करता।
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: तुम्हारे साथ भाईचारे और मित्रता के संबंध
  rationale: ἀδελφότης और φιλία क्रमशः भाईचारा और मित्रता दर्शाते हैं; ‘संबंध’ जोड़ने से हिन्दी में नवीकरण का आशय स्पष्ट और स्वाभाविक होता है।
- source_word: ἀνανεώσασθαι
  choice: नया करने
  rationale: क्रिया का अर्थ पहले से स्थापित संबंध को फिर नया या ताज़ा करना है। ‘नया करने’ की भाषा सरल और वर्तमान हिन्दी के अनुकूल है।
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: ताकि हम तुमसे पराए न हो जाएँ
  rationale: यह प्रयोजनवाचक रचना है। ‘पराए न हो जाएँ’ संबंधगत दूरी और अलगाव का अर्थ सहज हिन्दी में बनाए रखता है।
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: क्योंकि ... बहुत समय बीत चुका है
  rationale: καιροί बहुवचन में अवधियों या समयांतरालों को सूचित करता है। हिन्दी में ‘बहुत समय’ उसी दीर्घ अंतराल को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: तुम्हारे हमारी ओर भेजने के बाद
  rationale: मूल पाठ भेजी गई वस्तु या व्यक्ति को अनिर्दिष्ट छोड़ता है। यह अनुवाद उस अस्पष्टता को सुरक्षित रखता है, यद्यपि हिन्दी में वाक्य-विन्यास कुछ औपचारिक है।
