    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψας
  choice: नाश कर दिया
  rationale: κόπτω का मूल अर्थ ‘काटना’ है, पर यहाँ लोगों के विरुद्ध सैनिक कार्रवाई के संदर्भ में इसका भाव मार डालने या घोर विनाश करने का है। ‘नाश कर दिया’ इस व्यापकता को स्वाभाविक हिन्दी में रखता है और पूर्ण संहार को अनिवार्य रूप से नहीं थोपता।
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: इन सारे लोगों
  rationale: λαός का सामान्य अर्थ ‘लोग/जनता’ है, न कि आवश्यक रूप से ‘सेना’। ‘इन सारे लोगों’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी समष्टिगत अभिव्यक्ति का अर्थ रखता है।
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: जब हम पर कोई युद्ध नहीं आ पड़ा है
  rationale: ἐνίστημι यहाँ उपस्थित होने, आ पड़ने या सामने आ खड़े होने का भाव देता है। यह अनुवाद युद्ध के तत्काल उन पर न होने का अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: Τίνα τί
  choice: क्यों
  rationale: पाठ में प्रश्नवाचक पदों का क्रम असामान्य और कुछ खुरदरा है; प्रसंग में यह कारण पूछने वाला प्रश्न है। ‘क्यों’ अर्थ को बिना अनावश्यक व्याकरणिक अस्वाभाविकता के स्पष्ट करता है।
- source_word: τῷ Ἰωναθάν
  choice: योनातान से
  rationale: सम्प्रदान कारक यहाँ कथन के संबोधित व्यक्ति को बताता है। ‘योनातान से कहा’ मानक और स्वाभाविक हिन्दी प्रयोग है।
