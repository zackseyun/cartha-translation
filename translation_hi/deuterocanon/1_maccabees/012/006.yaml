base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: hi
  text: राष्ट्र के महायाजक योनातान[a], पुरनियों की परिषद, याजक और शेष यहूदी प्रजा की ओर से अपने स्पार्ती भाइयों[b] को नमस्कार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राष्ट्र’ से आशय यहाँ यहूदी राष्ट्रीय समुदाय है; पदबंध योनातान के महायाजकीय पद को पूरे समुदाय से जोड़ता है।
    reason: lexical_note
  - marker: b
    text: ‘भाइयों’ राजनयिक बंधुत्व की यूनानी पदावली को दर्शाता है; इसका अर्थ सगे भाई होना आवश्यक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς τοῦ ἔθνους
  choice: राष्ट्र के महायाजक
  rationale: यह पदबंध योनातान के पद को यहूदी राष्ट्रीय समुदाय से जोड़ता है। ‘राष्ट्र के महायाजक’ यूनानी संबंध को बनाए रखता है और केवल धार्मिक पद तक अर्थ को सीमित नहीं करता।
- source_word: γερουσία
  choice: पुरनियों की परिषद
  rationale: यह शासन में भाग लेने वाले पुरनियों के निकाय को दर्शाता है; ‘परिषद’ संस्थागत अर्थ को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  choice: शेष यहूदी प्रजा
  rationale: δῆμος यहाँ नागरिक-राजनीतिक जनसमुदाय है, जिसे पहले गिनाए गए नेतृत्व और याजकों से अलग किया गया है। ‘प्रजा’ इस सामूहिक भाव को सहज हिन्दी में व्यक्त करती है।
- source_word: Σπαρτιάταις
  choice: स्पार्ती
  rationale: यह प्राप्तकर्ताओं को स्पार्टा के लोगों के रूप में पहचानता है; ‘स्पार्ती’ हिन्दी का स्पष्ट जातिवाचक रूप है।
- source_word: τοῖς ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी पाठ स्पष्टतः ‘भाइयों’ कहता है। राजनयिक संदर्भ में यह घोषित बंधुत्व या नातेदारी की भाषा है, जिसे अनुवाद में बनाए रखा गया है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह यूनानी पत्रों का प्रचलित अभिवादन-सूत्र है; हिन्दी पत्र-शैली में ‘नमस्कार’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: राजनयिक संबोधन में ‘भाइयों’ का आशय
  choice: पत्र में प्रयुक्त बंधुत्व की भाषा को ‘भाइयों’ के रूप में बनाए रखना
  alternative: बंधुओं / संबंधियों / मित्रों
  rationale: पाठ स्पार्तियों को सीधे ‘भाई’ कहता है। अनुवाद इस राजनयिक दावे को न तो शाब्दिक सहोदरता मानता है, न किसी हल्के शब्द से उसका तनाव मिटाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और पत्रात्मक हिन्दी। ‘योनातान’ देवनागरी बाइबलीय रूप है; ‘पुरनियों की परिषद’ पारदर्शी संस्थागत पद है। वाक्य में ‘की ओर से’ जोड़कर यूनानी प्रेषक-प्राप्तकर्ता अभिवादन-सूत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है।
