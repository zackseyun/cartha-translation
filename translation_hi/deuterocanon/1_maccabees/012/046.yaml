lexical_decisions:
- source_word: ἐμπιστεύσας
  choice: उस पर भरोसा करके
  rationale: यह प्रयोग किसी व्यक्ति पर विश्वास करने और उसी आधार पर आगे की कार्रवाई करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: उसने वैसा ही किया जैसा उसने कहा था
  rationale: यह यूनानी वाक्यांश के सीधे अर्थ को बनाए रखता है; हिन्दी में पूर्व कथन स्पष्ट करने के लिए ‘कहा था’ स्वाभाविक है।
- source_word: ἐξαπέστειλεν
  choice: रवाना कर दिया
  rationale: सैन्य प्रसंग में भेज देने या प्रस्थान कराने का अर्थ स्पष्ट करता है, बिना अनावश्यक तीव्रता जोड़ने के।
- source_word: τὰς δυνάμεις
  choice: सैनिक-दलों
  rationale: बहुवचन सैन्य बलों को व्यक्त करता है और यह तय नहीं करता कि पूरी सेना भेजी गई थी या उसकी अलग-अलग टुकड़ियाँ।
- source_word: ἀπῆλθον
  choice: चले गए
  rationale: स्थान से प्रस्थान और आगे जाने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς γῆν Ἰούδα
  choice: यहूदा देश में
  rationale: γῆ Ἰούδα का पारदर्शी रूप है; εἰς के गतिसूचक अर्थ के कारण ‘में’ गंतव्य के भीतर प्रवेश का भाव दे सकता है।
