    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσδεοι
  choice: हमें … आवश्यकता नहीं है
  rationale: यह विशेषण ‘आवश्यकता न होना’ व्यक्त करता है। यह सहज आधुनिक हिन्दी है और अनावश्यक रूप से पूर्ण आत्मनिर्भरता का भाव नहीं जोड़ता।
- source_word: τούτων
  choice: इन बातों की
  rationale: सर्वनाम पहले कही गई बातों या सहायताओं की ओर संकेत करता है; ‘इन बातों की’ उस संदर्भ को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: παράκλησιν
  choice: प्रोत्साहन
  rationale: यहाँ शब्द पवित्र पुस्तकों से मिलने वाले आंतरिक सहारे और दृढ़ता को व्यक्त करता है। ‘प्रोत्साहन’ व्यापक अर्थ रखता है; ‘सांत्वना’ भी संभव है।
- source_word: τὰ βιβλία τὰ ἅγια
  choice: वे पवित्र पुस्तकें
  rationale: यह यूनानी पद का सीधा और स्वाभाविक अनुवाद है। ‘पवित्रशास्त्र’ कहने से बाद की निर्धारित कैननिक धारणा जुड़ सकती है, जो मूल पद स्वयं स्पष्ट नहीं करता।
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: जो हमारे हाथों में हैं
  rationale: शाब्दिक और सजीव अभिव्यक्ति को बनाए रखा गया है; प्रसंग में इसका अर्थ अधिकार, उपलब्धता या पास होना भी हो सकता है।
theological_decisions:
- issue: ‘पवित्र पुस्तकों’ का संदर्भ
  choice: पवित्र पुस्तकें
  alternative: पवित्रशास्त्र / पवित्र लेख
  rationale: मूल यूनानी पवित्र पुस्तकों का उल्लेख करता है, पर किसी बाद की निश्चित कैननिक सीमा को परिभाषित नहीं करता; इसलिए अनुवाद उसी व्यापकता को सुरक्षित रखता है।
