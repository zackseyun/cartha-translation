  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। यूनानी के दो कृदन्तीय भावों को अर्धविराम से जोड़ा गया है, जिससे उनके संबंध को अनावश्यक रूप से कारणसूचक बनाकर निश्चित नहीं किया गया।
