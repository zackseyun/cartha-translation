lexical_decisions:
- source_word: ἐπολέμησαν
  choice: युद्ध किया
  rationale: πολεμέω का अर्थ युद्ध या सशस्त्र संघर्ष में उतरना है। ‘युद्ध किया’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य अर्थ को स्पष्ट रखता है। ‘हमारे विरुद्ध’ से यूनानी में ἡμᾶς की विरोधात्मक भूमिका व्यक्त होती है।
- source_word: οἱ βασιλεῖς
  choice: राजाओं ने
  rationale: निश्चित पदबंध οἱ βασιλεῖς प्रसंग में पहचाने जा सकने वाले राजाओं के समूह की ओर संकेत करता है; हिन्दी में इसका स्वाभाविक रूप ‘राजाओं ने’ है।
- source_word: οἱ κύκλῳ ἡμῶν
  choice: हमारे चारों ओर के
  rationale: κύκλῳ के साथ ἡμῶν आसपास या चारों ओर की स्थिति बताता है। ‘हमारे चारों ओर के’ भौगोलिक और राजनीतिक निकटता दोनों को स्वाभाविक रूप से व्यक्त करता है।
