  text: And Jonathan heard that Demetrius’s commanders had returned with a much larger force than before to make war against him.
translation:
  language: hi
  text: और योनातान ने सुना कि देमेत्रियुस के सेनापति उससे युद्ध करने के लिए पहले से कहीं बड़ी सेना लेकर लौट आए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: ने सुना
  rationale: यह सुनने या समाचार मिलने की सामान्य कथात्मक क्रिया है; ‘ने सुना’ इसके अर्थ को बिना माध्यम निश्चित किए स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: देमेत्रियुस के सेनापति
  rationale: ἄρχοντες का मूल अर्थ अगुवे या अधिकारी हो सकता है, पर यहाँ सेना और युद्ध के प्रसंग में ‘सेनापति’ उसका कार्यगत सैन्य अर्थ स्पष्ट करता है।
- source_word: ἐπέστρεψαν
  choice: लौट आए थे
  rationale: क्रिया का अर्थ लौटना है; ‘लौट आए थे’ योनातान के सुनने से पहले हो चुकी घटना का स्वाभाविक हिन्दी वर्णन है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: कहीं बड़ी सेना लेकर
  rationale: सैन्य प्रसंग में δύναμις अमूर्त सामर्थ्य नहीं, सैनिक बल को दर्शाता है। हिन्दी में ‘सेना लेकर’ स्वाभाविक है, और ‘कहीं बड़ी’ अगले तुलनात्मक वाक्यांश को साथ लेकर व्यक्त करता है।
- source_word: ὑπὲρ τὸ πρότερον
  choice: पहले से कहीं बड़ी
  rationale: यह वर्तमान सैन्य बल की तुलना पहले के बल से करता है; यह हिन्दी प्रयोग तुलना और उसकी तीव्रता दोनों को सहज ढंग से व्यक्त करता है।
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: उससे युद्ध करने के लिए
  rationale: सप्रयोजन infinitive को ‘के लिए’ से व्यक्त किया गया है। πολεμέω निरंतर या व्यापक सैन्य संघर्ष सूचित करता है, इसलिए ‘युद्ध करने’ उपयुक्त है।
