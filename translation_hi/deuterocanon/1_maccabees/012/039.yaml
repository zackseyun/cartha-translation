  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: hi
  text: और त्रूफ़ोन ने एशिया[a] पर शासन करना, राजमुकुट धारण करना और राजा अन्तियोखुस के विरुद्ध हाथ बढ़ाना[b] चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “एशिया” से आशय आधुनिक एशिया महाद्वीप से नहीं, बल्कि उस समय के हेलेनवादी सेल्यूकिड राज्य से है।
    reason: cultural_note
  - marker: b
    text: या, “राजा अन्तियोखुस पर आक्रमण करना।” यूनानी में शाब्दिक रूप से, “राजा अन्तियोखुस के विरुद्ध हाथ फैलाना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: की ठानी
  rationale: यहाँ क्रिया खोजने के बजाय उद्देश्य या राजनीतिक मंशा को व्यक्त करती है। ‘की ठानी’ उस दृढ़ अभिप्राय को सहज हिन्दी में रखता है, पर सफलता का दावा नहीं करता।
- source_word: βασιλεῦσαι τῆς Ἀσίας
  choice: एशिया पर राज करने
  rationale: βασιλεύω का अर्थ राजा होना या शासन करना हो सकता है। अगले वाक्यांश में राजचिह्न धारण करने की बात आने के कारण यहाँ ‘राज करने’ से पुनरुक्ति घटती है और क्षेत्र पर शासन का भाव स्पष्ट रहता है।
- source_word: τῆς Ἀσίας
  choice: एशिया
  rationale: भौगोलिक नाम को स्रोत के अनुरूप रखा गया है; ऐतिहासिक अर्थ को मुख्य पाठ में विस्तार देने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: περιθέσθαι τὸ διάδημα
  choice: राजमुकुट धारण करने
  rationale: διάδημα विशेष रूप से राजसत्ता का मुकुट या शाही सिरबंद है। ‘राजमुकुट धारण करना’ स्वयं राजपद ग्रहण करने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: अन्तियोखुस के विरुद्ध हाथ उठाने
  rationale: यूनानी मुहावरा शाब्दिक रूप से किसी के विरुद्ध हाथ फैलाने और भावार्थ में शत्रुतापूर्ण कार्रवाई करने को दर्शाता है। ‘विरुद्ध हाथ उठाना’ हिंसक मंशा को व्यक्त करते हुए कार्रवाई के ठीक स्वरूप को खुला रखता है।
- source_word: τὸν βασιλέα
  choice: राजा अन्तियोखुस
  rationale: स्रोत में अन्तियोखुस के साथ उसका राजकीय पद स्पष्ट रूप से दिया गया है; हिन्दी में स्वाभाविक पदक्रम के अनुसार ‘राजा’ नाम से पहले रखा गया है।
