lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आया
  rationale: यहाँ क्रिया किसी पहले स्थान पर भौतिक रूप से लौटने को व्यक्त करती है; ‘लौट आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐξεκκλησίασεν
  choice: इकट्ठा किया
  rationale: क्रिया औपचारिक रूप से सभा के लिए बुलाकर एकत्र करने का भाव रखती है; हिन्दी में यह प्रयोग स्पष्ट और सहज है।
- source_word: πρεσβυτέρους τοῦ λαοῦ
  choice: लोगों के पुरनियों
  rationale: यह पद केवल अधिक आयु वाले पुरुषों के बजाय समुदाय के मान्य अगुओं को सूचित करता है; ‘पुरनिये’ बाइबलीय-सामुदायिक पद के रूप में इस संस्थागत अर्थ को बनाए रखता है।
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: उसने उनके साथ यह विचार-विमर्श किया
  rationale: मध्यवाच्य क्रिया सहभागी परामर्श और सोच-विचार का भाव देती है; ‘विचार-विमर्श किया’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οἰκοδομῆσαι
  choice: बनाए जाएँ
  rationale: अनन्त क्रिया परामर्श की विषयवस्तु/उद्देश्य बताती है। हिन्दी का भाववाच्य रूप सामूहिक निर्णय के संदर्भ में स्वाभाविक है और यह अनावश्यक रूप से कर्ता निश्चित नहीं करता।
- source_word: ὀχυρώματα
  choice: किले
  rationale: संज्ञा रक्षात्मक दृढ़ संरचनाओं या गढ़ों को दर्शाती है; ‘किले’ सामान्य पाठक के लिए ठोस और स्पष्ट है।
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में
  rationale: यह उन किलों के निर्माण का भौगोलिक क्षेत्र है; ‘यहूदिया’ आधुनिक हिन्दी में प्रचलित रूप है।
