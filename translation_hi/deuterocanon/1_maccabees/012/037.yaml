  yaml_path: translation/deuterocanon/1_maccabees/012/037.yaml
  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: hi
  text: और वे निर्माण करने के लिए इकट्ठे हुए, और पूर्व दिशा वाले बरसाती नाले/खड्ड की दीवार का एक भाग गिर गया, और उसने उसकी मरम्मत की जिसे “खफेनाता” कहा जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν
  choice: वे ... इकट्ठे हुए
  rationale: यहाँ क्रिया अकर्मक भाव में समूह के किसी उद्देश्य से एकत्र होने को व्यक्त करती है; आधुनिक हिन्दी में “इकट्ठे हुए” स्वाभाविक और मूल के निकट है।
- source_word: τοῦ οἰκοδομεῖν
  choice: निर्माण करने के लिए
  rationale: सप्रत्यय क्रियार्थक संज्ञा यहाँ उद्देश्य बताती है। मूल में पुनर्निर्माण स्पष्ट नहीं है, इसलिए “फिर से बनाने” के बजाय सामान्य “निर्माण करने” को रखा गया है।
- source_word: ἔπεσεν τοῦ τείχους
  choice: दीवार का एक भाग गिर गया था
  rationale: γενitive τοῦ τείχους को प्रसंग में अंशवाचक समझना स्वाभाविक है—दीवार में से कुछ गिरा था। हिन्दी में केवल “दीवार का गिरा” असंगत होता, इसलिए निहित अंश को “एक भाग” से स्पष्ट किया गया है।
- source_word: τοῦ χειμάρρου
  choice: बरसाती नाले की घाटी से लगी
  rationale: χείμαρρος मौसमी जलधारा, उसके पाट या खड्ड/घाटी को सूचित कर सकता है। “बरसाती नाले की घाटी” लेवांत के भूगोल को सामान्य हिन्दी पाठक के लिए स्पष्ट करती है, जबकि पादटिप्पणी मूल की संक्षिप्तता और विकल्प सुरक्षित रखती है।
- source_word: τοῦ ἐξ ἀπηλιώτου
  choice: पूर्वी ओर
  rationale: ἀπηλιώτης का अर्थ पूर्व अथवा पुरवाई है; यहाँ स्थल-दिशा अभिप्रेत है। “पूर्वी ओर” हिन्दी में स्पष्ट है और अस्पष्ट अंग्रेज़ी-जैसी संरचना से बचता है।
- source_word: ἐπεσκεύασεν
  choice: उसने ... मरम्मत की
  rationale: क्रिया क्षतिग्रस्त वस्तु को सुधारने या बहाल करने का अर्थ देती है। “मरम्मत की” कार्य की सीमा को “पुनर्निर्माण” जितना नहीं बढ़ाती।
- source_word: τὸ καλούμενον Χαφεναθά
  choice: “खफेनाता” कहलाने वाले स्थान
  rationale: नपुंसकलिंगी पद किसी स्थान, भाग या संरचना की ओर संकेत कर सकता है, पर उसका प्रकार नहीं बताता। मुख्य पाठ में सहज हिन्दी के लिए “स्थान” रखा गया है और उसकी अनिश्चितता पादटिप्पणी में बताई गई है। नाम को यूनानी Χαφεναθά के आधार पर “खफेनाता” लिप्यंतरित किया गया है।
