translation:
  language: hi
  text: तब उसने उनका पीछा किया, पर उन्हें पकड़ न सका, क्योंकि वे एल्युथेरस नदी पार कर चुके थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν
  choice: पीछा किया
  rationale: यह क्रिया सक्रिय रूप से किसी के पीछे लगने को व्यक्त करती है; सैन्य कथा के संदर्भ में ‘पीछा किया’ स्वाभाविक और सटीक है।
- source_word: ὀπίσω αὐτῶν
  choice: उनका
  rationale: ‘पीछा करना’ के साथ संबंधसूचक ‘उनका’ आधुनिक हिन्दी में यूनानी ‘उनके पीछे’ का सहज मुहावरेदार रूप है।
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: उन्हें पकड़ न सका
  rationale: यहाँ καταλαμβάνω का अर्थ भागते हुए लोगों तक पहुँचकर उन्हें पकड़ना है। ‘पकड़ न सका’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि यूनानी में सामर्थ्यसूचक क्रिया अलग से नहीं है।
- source_word: διέβησαν
  choice: पार कर चुके थे
  rationale: यह क्रिया उस पहले पूरी हो चुकी घटना को बताती है जिसके कारण पीछा करने वाला उन्हें पकड़ नहीं पाया; हिन्दी का पूर्ण भूतकाल घटनाक्रम स्पष्ट करता है।
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: एल्युथेरस नदी
  rationale: Ἐλεύθερον नदी का व्यक्तिवाचक नाम है, इसलिए उसका लिप्यंतरण किया गया है और ποταμόν के लिए ‘नदी’ रखा गया है।
