lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... ने देखा
  rationale: यूनानी में यह एओरिस्ट कृदन्त है, जिसे प्रसंगानुसार समयसूचक उपवाक्य के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। पाठ में रूप एकवचन है, पर इसका कर्ता बहुवचन ‘पीछा करने वाले’ है।
- source_word: οἱ διώκοντες
  choice: पीछा करने वाले
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त उस समूह को बताता है जो पीछा कर रहा था; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: कि उनकी जान का सवाल है
  rationale: περὶ ψυχῆς यहाँ प्राण-संकट का मुहावरा है। ‘उनकी जान का सवाल’ मूल के ‘जीवन/प्राण’ भाव को रखते हुए साधारण आधुनिक हिन्दी में स्वाभाविक रूप से बताता है कि उनका जीवन दाँव पर था।
- source_word: ψυχῆς
  choice: जान
  rationale: इस प्रसंग में शब्द का अर्थ अमूर्त ‘आत्मा’ नहीं, बल्कि शारीरिक जीवन है; हिन्दी मुहावरे में ‘जान’ उपयुक्त है।
- source_word: ἐπέστρεψαν
  choice: वे लौट गए
  rationale: पीछा करने के प्रसंग में क्रिया दिशा बदलकर वापस जाने को दर्शाती है। ‘लौट गए’ संक्षिप्त और स्वाभाविक है।
