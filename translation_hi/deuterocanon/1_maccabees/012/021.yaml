base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/021.yaml
  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: hi
  text: एक लिखित दस्तावेज़ में स्पार्टावासियों और यहूदियों—दोनों के विषय में यह पाया गया कि वे भाई हैं और अब्राहम के वंश से हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक दस्तावेज़ में” अथवा “एक अभिलेख में।” यहाँ प्रयुक्त यूनानी शब्द किसी लिखित स्रोत को दर्शाता है; इसका अर्थ अनिवार्य रूप से पवित्रशास्त्र नहीं है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात जिस लिखित स्रोत का उल्लेख किया गया है, उसमें दोनों समुदायों के अब्राहम से साझा वंश का दावा किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: यह पाया गया
  rationale: यूनानी क्रिया एओरिस्ट कर्मवाच्य है; यह रूप साधारण भूतकाल और अनिर्दिष्ट कर्ता—दोनों को सुरक्षित रखता है।
- source_word: ἐν γραφῇ
  choice: एक लिखित अभिलेख में
  rationale: यहाँ γραφή किसी लिखित स्रोत, दस्तावेज़ या अभिलेख को दर्शाती है; इसे अनिवार्य रूप से पवित्रशास्त्र मानना उचित नहीं।
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: स्पार्टावासियों और यहूदियों—दोनों के विषय में
  rationale: περί के संबंधसूचक अर्थ और τε ... καί की युग्मबद्ध संरचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: मूल शब्द पुल्लिंग बहुवचन है और यहाँ दो जातीय समुदायों के बीच कथित बंधुत्व या रक्त-संबंध को व्यक्त करता है।
- source_word: ἐκ γένους Ἀβραάμ
  choice: अब्राहम के वंश से
  rationale: γένος यहाँ कुल, वंश या उत्पत्ति का बोध कराता है; यह आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप से साझा वंश का दावा व्यक्त करता है।
theological_decisions:
- issue: स्पार्टावासियों और यहूदियों के बीच बताए गए संबंध का स्वरूप
  choice: लिखित स्रोत में किए गए बंधुत्व और अब्राहम से वंश के दावे को सीधे प्रस्तुत किया गया है, पर अनुवाद स्वयं उसकी ऐतिहासिक सत्यता की पुष्टि नहीं करता।
  alternative: इसे केवल राजनीतिक मैत्री या संधि के रूप में ढीले ढंग से प्रस्तुत करना।
  rationale: यूनानी पाठ स्पष्टतः उन्हें ‘भाई’ और ‘अब्राहम के वंश से’ बताता है। अनुवाद को इस दावे को नरम करके केवल राजनयिक निकटता नहीं बनाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘लिखित अभिलेख’ से स्रोत की दस्तावेज़ी प्रकृति स्पष्ट होती है और ‘पवित्रशास्त्र’ का अनावश्यक धार्मिक अर्थ नहीं जुड़ता।
