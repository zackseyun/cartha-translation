    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωναθὰν δὲ καὶ οἱ παρʼ αὐτοῦ
  choice: परन्तु योनातान और उसके साथ के लोग
  rationale: यह वाक्य के विरोधसूचक δὲ और साथ आए समूह के सामान्य अर्थ को स्वाभाविक हिन्दी में रखता है; ‘उसके सैनिक’ कहना मूल से अधिक विशिष्ट होता।
- source_word: οὐκ ἔγνωσαν
  choice: पता नहीं चला
  rationale: यह γινώσκω के यहाँ निहित ‘जानने/समझ पाने’ के अर्थ को सहज हिन्दी में व्यक्त करता है और किसी अतिरिक्त कारण को नहीं जोड़ता।
- source_word: ἕως πρωί
  choice: सुबह तक
  rationale: यह उनकी अनभिज्ञता की समय-सीमा को सीधे व्यक्त करता है; ‘भोर तक’ भी संभव है, पर ‘सुबह तक’ अधिक सामान्य और मूल के समान व्यापक है।
- source_word: ἔβλεπον
  choice: देख रहे थे
  rationale: अपूर्ण भूतकाल की जारी पृष्ठभूमि-क्रिया को हिन्दी का अपूर्ण भूत स्वाभाविक ढंग से दर्शाता है।
- source_word: τὰ φῶτα
  choice: आग
  rationale: शाब्दिक अर्थ ‘रोशनियाँ’ है, पर सैन्य शिविर और रात के प्रसंग में दिखाई देने वाली जलती आग अभिप्रेत होने की प्रबल संभावना है। शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: καιόμενα
  choice: जलती हुई
  rationale: यह कृदन्त द्वारा बताई गई दृश्य अवस्था को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
