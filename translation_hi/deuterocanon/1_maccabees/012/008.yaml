  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: hi
  text: और ओनियास ने भेजे हुए उस व्यक्ति का आदरपूर्वक स्वागत किया[a] और पत्र प्राप्त किए, जिनमें संधि और मित्रता के बारे में स्पष्ट किया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेजे हुए उस व्यक्ति को आदरपूर्वक ग्रहण किया।” यूनानी में अधिक शाब्दिक रूप से यही है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनमें संधि और मित्रता का विवरण दिया गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: स्वागत किया
  rationale: क्रिया का अर्थ किसी को ग्रहण करना या उसका स्वागत करना है। व्यक्ति और सम्मानपूर्ण राजनयिक प्रसंग में ‘स्वागत किया’ स्वाभाविक हिन्दी है।
- source_word: ἐνδόξως
  choice: आदरपूर्वक
  rationale: यह क्रियाविशेषण सम्मानजनक या प्रतिष्ठापूर्ण रीति बताता है; ‘आदरपूर्वक’ आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: भेजे हुए उस व्यक्ति
  rationale: यह यूनानी के वर्णनात्मक पदबंध ‘उस व्यक्ति को जो भेजा गया था’ के निकट है और बिना आवश्यकता ‘दूत’ की पदवी नहीं जोड़ता।
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: पत्रों को ग्रहण किया
  rationale: औपचारिक पत्र-व्यवहार के प्रसंग में ἔλαβε का आशय पत्र प्राप्त करना है; पहले प्रयुक्त ‘स्वागत किया’ से अनावश्यक पुनरावृत्ति बचाने के लिए ‘ग्रहण किया’ चुना गया है।
- source_word: διεσάφειτο
  choice: बातें स्पष्ट की गई थीं
  rationale: यह रूप पत्रों में विषय के स्पष्ट किए जाने या खोलकर बताए जाने को दर्शाता है। अपूर्ण भूतकाल का भाव ‘की गई थीं’ से व्यक्त होता है।
- source_word: συμμαχίας
  choice: संधि
  rationale: यह राजनीतिक अथवा सैनिक गठबंधन का सूचक है। राजनयिक प्रसंग में ‘संधि’ संक्षिप्त और सहज है।
- source_word: φιλίας
  choice: मित्रता
  rationale: यहाँ राजनीतिक मैत्रीपूर्ण संबंध अभिप्रेत हैं; ‘मित्रता’ मूल शब्द का सीधा और स्वाभाविक प्रतिरूप है।
