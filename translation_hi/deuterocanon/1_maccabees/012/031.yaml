translation:
  language: hi
  text: और योनातान ज़बादी कहलाने वाले अरबों के विरुद्ध मुड़ गया; उसने उन पर प्रहार किया और उनकी लूट ले ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: मुड़कर … के विरुद्ध गया
  rationale: क्रिया के मूल दिशात्मक भाव ‘मुड़ना/मार्ग बदलना’ को बनाए रखते हुए सैनिक प्रसंग में विरोध की दिशा स्पष्ट करता है; केवल ‘चढ़ाई की’ कहना स्रोत से अधिक व्याख्यात्मक होता।
- source_word: Ἀράβας
  choice: अरबों
  rationale: यह अरब लोगों के एक समूह के लिए स्वाभाविक और प्रचलित आधुनिक हिन्दी शब्द है।
- source_word: τοὺς καλουμένους
  choice: कहलाने वाले
  rationale: समूह की पहचान बताने वाले यूनानी कृदंत का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: Ζαβαδαίους
  choice: ज़बादी
  rationale: यूनानी जाति-नाम का देवनागरी में पठनीय लिप्यंतरण; इसे किसी अधिक परिचित नाम से पहचानना स्रोत से सिद्ध नहीं है।
- source_word: ἐπάταξεν
  choice: प्रहार किया
  rationale: यूनानी क्रिया के सीधे ‘मारना/प्रहार करना’ अर्थ को रखता है और ‘पराजित किया’ जैसे संभावित किंतु अधिक व्याख्यात्मक परिणाम को नहीं जोड़ता।
- source_word: σκῦλα
  choice: युद्ध की लूट
  rationale: युद्ध में शत्रु से ली गई वस्तुओं का अर्थ साधारण पाठक के लिए स्पष्ट करता है; केवल ‘लूट’ की अपेक्षा सैनिक संदर्भ अधिक साफ़ है।
