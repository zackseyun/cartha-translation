base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/040.yaml
  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: hi
  text: और वह डर गया कि कहीं योनातान उसे अनुमति न दे[a] और उसके विरुद्ध युद्ध छेड़ दे; और वह उसे पकड़कर मार डालने का उपाय ढूँढ़ता रहा। फिर वह चल पड़ा और बेत-शान पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “योनातान उसे अनुमति न दे।” किस बात की अनुमति न देने की बात है, यह स्पष्ट नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: डर गया
  rationale: यहाँ क्रिया सावधान भय या आशंका व्यक्त करती है; प्रसंग में सहज और स्पष्ट हिन्दी के लिए ‘डर गया’ उपयुक्त है।
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: कहीं योनातान उसे ऐसा करने न दे
  rationale: यूनानी में व्यक्ति-सूचक कर्म ‘उसे’ स्पष्ट है, जबकि किस काम की अनुमति न मिलेगी यह प्रसंग से समझा जाता है। ‘ऐसा करने’ जोड़कर हिन्दी को स्वाभाविक बनाया गया है, और पाद-टिप्पणी मूल की अपूर्णता बताती है।
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: उसके विरुद्ध युद्ध छेड़ दे
  rationale: यह अभिव्यक्ति साधारण झगड़े के बजाय सैन्य संघर्ष का बोध कराती है।
- source_word: ἐζήτει πόρον
  choice: उपाय ढूँढ़ता रहा
  rationale: πόρος यहाँ किसी योजना को पूरा करने का साधन, रास्ता या अवसर है; ‘उपाय’ इस व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: उसे पकड़कर मार डालने
  rationale: दोनों उद्देश्यसूचक infinitives षड्यंत्र का लक्ष्य बताते हैं। ‘पकड़कर’ क्रम और ‘मार डालने’ स्पष्ट हिंसक आशय को व्यक्त करते हैं; कानूनी गिरफ्तारी का भाव नहीं जोड़ा गया।
- source_word: ἀπάρας
  choice: वहाँ से चलकर
  rationale: कृदन्त प्रस्थान करके अगले स्थान पर पहुँचने का क्रम बताता है; ‘वहाँ से चलकर’ आधुनिक हिन्दी में स्वाभाविक है और छावनी समेटने जैसी अनिश्चित बात नहीं जोड़ता।
- source_word: Βεθσά
  choice: बेत-शान
  rationale: यूनानी स्थान-नाम को प्रचलित बाइबलीय पहचान बेत-शान के रूप में प्रस्तुत किया गया है।
