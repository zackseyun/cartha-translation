  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को अर्थ-क्रम बनाए रखते हुए तीन हिन्दी वाक्यों में बाँटा गया है। सर्वनामों की मूल अस्पष्टता को अनावश्यक नाम जोड़कर पूरी तरह हल नहीं किया गया; केवल योनातान का नाम मूल के अनुसार रखा गया है।
