  text: और छावनी उठाकर वह दमिश्क आया और पूरे क्षेत्र में होकर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζεύξας
  choice: छावनी उठाकर
  rationale: यह कृदन्त सैन्य यात्रा के संदर्भ में छावनी समेटकर आगे बढ़ने का भाव देता है; ‘छावनी उठाकर’ इस विशेष अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦλθεν
  choice: आया
  rationale: εἰς Δαμασκόν के साथ यह दमिश्क पहुँचने की गति व्यक्त करता है; कथात्मक दृष्टिकोण के अनुरूप ‘आया’ सरल और स्वाभाविक है।
- source_word: διώδευσεν
  choice: में होकर यात्रा की
  rationale: क्रिया किसी भूभाग से होकर मार्ग तय करने को दर्शाती है; यह अनुवाद केवल पहुँचने के बजाय क्षेत्र के भीतर से गुजरने की गति को स्पष्ट रखता है।
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: पूरे क्षेत्र में होकर
  rationale: χώρα यहाँ किसी आधुनिक राष्ट्र के बजाय व्यापक भूभाग या इलाके को सूचित करता है; ‘क्षेत्र’ उसके दायरे को बिना अधिक निश्चित किए सुरक्षित रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों καί साधारण कथात्मक क्रम और समन्वय दिखाते हैं; उनकी पुनरावृत्ति हिन्दी में भी सहज है।
