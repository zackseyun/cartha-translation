  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: hi
  text: इसलिए हम हर समय निरन्तर आपका स्मरण करते हैं—पर्वों और अन्य नियत दिनों[a] पर, जब हम बलिदान चढ़ाते हैं और प्रार्थनाएँ करते हैं—जैसा कि भाइयों को स्मरण करना उचित और शोभनीय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नियत दिनों” का अर्थ वे अन्य दिन भी हो सकता है जिनका पालन करना उचित, अपेक्षित या रीति के अनुसार निर्धारित था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως ἐν παντὶ καιρῷ
  choice: सदा
  rationale: दोनों अभिव्यक्तियों के निरंतर और हर अवसर पर स्मरण करने के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे शाब्दिक रूप से हर क्षण चलने वाली क्रिया बताने के।
- source_word: ἑορταῖς
  choice: पर्वों
  rationale: धार्मिक पंचांग के उत्सव-दिनों के लिए प्रचलित, गरिमापूर्ण और सहज हिन्दी शब्द।
- source_word: καθηκούσαις ἡμέραις
  choice: नियत दिनों
  rationale: सन्दर्भ में वे अन्य दिन अभिप्रेत हैं जो धार्मिक रीति के अनुसार उचित, अपेक्षित या निर्धारित थे; ‘नियत’ इस भाव को संक्षेप में व्यक्त करता है।
- source_word: μνημονεύομεν ὑμῶν
  choice: आपका स्मरण करते हैं
  rationale: मानसिक स्मरण के साथ प्रार्थना और उपासना में उल्लेख करने का भाव भी बनाए रखता है।
- source_word: ἐφʼ ὧν προσφέρομεν θυσίων
  choice: जब हम बलिदान चढ़ाते हैं
  rationale: सम्बन्धवाचक वाक्यांश को उन धार्मिक अवसरों से जोड़ते हुए बलिदान अर्पित करने की उपासना-संबंधी क्रिया स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: ἐν ταῖς προσευχαῖς
  choice: अपनी प्रार्थनाओं में
  rationale: बहुवचन को बनाए रखता है और स्पष्ट करता है कि सम्बोधित लोगों का स्मरण प्रार्थनाओं में किया जाता था।
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: क्योंकि ... उचित और शोभनीय है
  rationale: δέον की नैतिक उचितता और πρέπον की अनुकूलता/शोभा, दोनों को अलग शब्दों से सुरक्षित रखता है।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी पुल्लिंग बहुवचन और इस राजनयिक-पारिवारिक सन्दर्भ में समुदायों के बीच बन्धुत्व की संज्ञा को बनाए रखता है।
theological_decisions:
- issue: ἀδελφῶν में सामुदायिक बन्धुत्व
  choice: भाइयों
  alternative: बंधुजनों
  rationale: मूल शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और यहाँ धार्मिक-जातीय तथा राजनयिक बन्धुत्व दर्शाता है; इसलिए अर्थ को लिंग-निरपेक्ष या अधिक व्यापक बनाकर नहीं खोला गया।
