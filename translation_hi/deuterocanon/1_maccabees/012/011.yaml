base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: hi
  text: इसलिए हम हर समय पर्वों और अन्य नियत दिनों[a] पर—बलिदान चढ़ाते समय और अपनी प्रार्थनाओं में भी—तुम्हें निरंतर स्मरण करते हैं, क्योंकि भाइयों को स्मरण करना उचित और शोभनीय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अन्य उचित/प्रथागत दिनों।’ यूनानी शब्द καθηκούσαις ऐसे दिनों को बता सकता है जो धार्मिक पालन के लिए उचित, प्रथागत या नियत हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: निरंतर
  rationale: यह लगातार और नियमित रूप से स्मरण करने का भाव व्यक्त करता है तथा ἐν παντὶ καιρῷ (‘हर समय’) के साथ मूल की बलाघातपूर्ण पुनरुक्ति भी बनाए रखता है।
- source_word: ἑορταῖς
  choice: पर्वों
  rationale: यह धार्मिक उत्सवों के लिए स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: अन्य नियत दिनों
  rationale: संदर्भ में καθηκούσαις उन दिनों को सूचित करता है जो उपासना या धार्मिक पालन के लिए उचित, प्रथागत अथवा निर्धारित हैं; ‘नियत’ इस प्रसंग में संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: μιμνησκόμεθα ὑμῶν
  choice: तुम्हें स्मरण करते हैं
  rationale: यह प्रार्थना और बलिदान के संदर्भ में सक्रिय रूप से याद करने अथवा उल्लेख करने के भाव को सीधे व्यक्त करता है।
- source_word: ἐφʼ ὧν
  choice: जब
  rationale: यह पर्वों और नियत दिनों को बलिदान चढ़ाने के अवसरों से जोड़ने वाला स्वाभाविक कालवाचक हिन्दी रूप है।
- source_word: προσφέρομεν θυσιῶν
  choice: हम बलिदान चढ़ाते हैं
  rationale: मन्दिर-उपासना से जुड़े बलिदान अर्पित करने के लिए ‘बलिदान चढ़ाना’ प्रचलित और सटीक हिन्दी अभिव्यक्ति है।
- source_word: ἐν ταῖς προσευχαῖς
  choice: अपनी प्रार्थनाओं में भी
  rationale: प्रथम पुरुष बहुवचन के सामुदायिक संदर्भ को हिन्दी में स्पष्ट और स्वाभाविक बनाता है; ‘भी’ बलिदानों और प्रार्थनाओं के समन्वय को दर्शाता है।
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: जैसा कि ... उचित और शोभनीय है
  rationale: δέον और πρέπον के कर्तव्य तथा उपयुक्तता के युग्मित बल को बिना एक में मिलाए सुरक्षित रखता है।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी का पुल्लिंग पारिवारिक-संबंधसूचक रूप यहाँ मित्र राष्ट्रों के बीच भ्रातृभाव की भाषा है; इसे लिंग-निरपेक्ष बनाकर मूल की अभिव्यक्ति को नहीं बदला गया।
theological_decisions:
- issue: ἀδελφῶν का लिंगयुक्त पारिवारिक संबोधन
  choice: भाइयों
  alternative: भाई-बहनों; बंधुजनों
  rationale: मूल यूनानी रूप पुल्लिंग है और यहाँ राजनीतिक-पारिवारिक भ्रातृत्व की अलंकारिक भाषा रखता है; ‘भाइयों’ मूल की व्याकरणिक और वाक्पटु शक्ति को सुरक्षित रखता है।
- issue: बलिदान और प्रार्थना की उपासना-संबंधी भाषा
  choice: बलिदान चढ़ाते हैं ... प्रार्थनाओं में
  alternative: भेंट चढ़ाते हैं; उपासना करते हैं
  rationale: मूल पाठ स्पष्ट रूप से θυσιῶν, अर्थात बलिदानों, और प्रार्थनाओं का उल्लेख करता है। सामान्यीकृत ‘उपासना’ मन्दिर-बलिदान के विशिष्ट संदर्भ को धुंधला कर देती।
- issue: ὡς के संबंध का अर्थ
  choice: जैसा कि
  alternative: क्योंकि
  rationale: ‘जैसा कि’ मूल के तुलनात्मक/औचित्यसूचक संबंध को खुला रखता है और उसे केवल कारणवाचक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘तुम्हें’ पत्र के बहुवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। वाक्य में डैश का प्रयोग स्मरण के अवसरों को मुख्य कथन से स्पष्ट रूप से जोड़ने और लंबे यूनानी वाक्य की संरचना को पठनीय रखने के लिए किया गया है।
