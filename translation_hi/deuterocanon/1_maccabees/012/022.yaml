lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: संयोजक और कालवाचक भाव दोनों को रखते हुए पत्र के प्रवाह को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: ἀφʼ οὗ
  choice: जब से
  rationale: यहाँ पदबंध समय के आरंभ-बिंदु और उससे जुड़े आधार, दोनों का संकेत देता है; ‘जब से’ इस अस्पष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔγνωμεν
  choice: हमें ... मालूम हुई हैं
  rationale: क्रिया प्राप्त ज्ञान और उसके वर्तमान परिणाम को व्यक्त करती है; हिन्दी का पूर्ण पक्ष इसे सहज ढंग से दर्शाता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पहले दी गई सूचना की ओर लौटता है; ‘ये बातें’ स्पष्ट और स्वाभाविक है।
- source_word: καλῶς ποιήσετε
  choice: तो अच्छा करेंगे
  rationale: पत्राचार में किसी अपेक्षित कार्य की विनम्र सराहना करने वाला मुहावरा है; यह हिन्दी में आग्रह को आदेश बनाए बिना व्यक्त करता है।
- source_word: γράφοντες ἡμῖν
  choice: आप हमें ... लिखेंगे
  rationale: कृदन्त उस कार्य को बताता है जिसे करने पर वे ‘अच्छा करेंगे’; हिन्दी में सशर्त वाक्य-विन्यास अधिक स्वाभाविक है।
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: अपनी कुशल-शांति के विषय में
  rationale: εἰρήνη का मूल ‘शांति’ है, पर पत्राचार में यह कुशल-मंगल या कल्याण भी बता सकता है। ‘कुशल-शांति’ दोनों अर्थ-छायाओं को संक्षेप में सुरक्षित रखता है।
