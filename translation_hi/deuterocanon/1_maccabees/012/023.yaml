base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: hi
  text: और हम भी तुम्हें उत्तर में लिखते हैं, “तुम्हारा पशुधन और तुम्हारी संपत्ति हमारी है, और जो हमारा है, वह तुम्हारा है।”[a] इसलिए हम आदेश देते हैं कि वे तुम्हें उसी बात की सूचना दें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “तुम्हारा पशुधन और तुम्हारी संपत्ति हमारी है, और जो हमारा है, वह तुम्हारा है।” यह मैत्री और पारस्परिक एकजुटता व्यक्त करने वाली राजनयिक भाषा है; इसका यह अर्थ आवश्यक नहीं कि कानूनी स्वामित्व समाप्त हो गया था।'
    reason: cultural_note
  - marker: b
    text: या, “कि वे तुम्हें उसी आशय की बात बताएँ।” यूनानी पाठ में ‘सूचना दें’ का कर्म स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: उत्तर में लिखते हैं
  rationale: पत्राचार के संदर्भ में क्रिया का अर्थ केवल ‘नकल करना’ नहीं, बल्कि लिखित उत्तर देना है; यह हिंदी में स्वाभाविक और पारस्परिक भाव को स्पष्ट करता है।
- source_word: κτήνη
  choice: पशु
  rationale: यह पालतू या संपत्ति माने जाने वाले पशुधन को सूचित करता है। ‘पशु’ सामान्य आधुनिक हिंदी में सहज है और ‘संपत्ति’ के साथ संदर्भ पर्याप्त स्पष्ट करता है।
- source_word: ὕπαρξις
  choice: संपत्ति
  rationale: यह भौतिक माल-मत्ता या अधिकार में रखी वस्तुओं का सामूहिक बोध कराता है; ‘संपत्ति’ संक्षिप्त और गरिमापूर्ण है।
- source_word: ἐντελλόμεθα
  choice: हम आदेश दे रहे हैं
  rationale: यह आधिकारिक निर्देश या आदेश जारी करने का भाव रखता है; हिंदी रूप राजनयिक पत्र की औपचारिकता बनाए रखता है।
- source_word: ἀπαγγείλωσιν
  choice: वे तुम्हें ... सूचना दें
  rationale: क्रिया किसी संदेश को पहुँचाने या सूचित करने का अर्थ देती है। यूनानी में कर्म अप्रकट है, इसलिए हिंदी में अगले वाक्यांश के साथ ‘इसी आशय की सूचना’ रखा गया है।
- source_word: κατὰ τὰ αὐτά
  choice: इसी आशय की
  rationale: वाक्यांश पहले कही गई बात के अनुरूप संदेश देने का संकेत करता है; ‘इसी आशय की’ अस्पष्ट कर्म को अनावश्यक रूप से अधिक निश्चित किए बिना स्वाभाविक हिंदी देता है।
