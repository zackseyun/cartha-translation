translation:
  language: hi
  text: और त्रूफ़ोन ने देखा कि वह बड़े सैन्य बल के साथ आ पहुँचा था, और वह उसके विरुद्ध हाथ बढ़ाने से डर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέστη
  choice: आ पहुँचा था
  rationale: यहाँ क्रिया सैन्य दल के साथ घटनास्थल पर पहुँचने को व्यक्त करती है। भूतपूर्ण रूप कथा में त्रूफ़ोन के देखने से पहले हो चुके आगमन को स्वाभाविक ढंग से दर्शाता है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: एक बड़ी सेना के साथ
  rationale: इस सैन्य प्रसंग में δύναμις अमूर्त ‘सामर्थ्य’ के बजाय सैनिक बल को सूचित करता है। ‘बड़ी सेना’ सामान्य हिन्दी में स्पष्ट है, यद्यपि यूनानी पद व्यापक अर्थ में सैन्य बल भी हो सकता है।
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: उसके विरुद्ध हाथ बढ़ाने
  rationale: यह रूपक यूनानी अभिव्यक्ति की संरचना और उसकी व्यापक शत्रुतापूर्ण धारणा को बनाए रखता है तथा उसे केवल पकड़ने या किसी एक प्रकार के आक्रमण तक सीमित नहीं करता।
- source_word: ηὐλαβήθη
  choice: डर गया
  rationale: प्रसंग में यह क्रिया भय के कारण शत्रुतापूर्ण कार्रवाई से रुक जाने को व्यक्त करती है; ‘डर गया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
