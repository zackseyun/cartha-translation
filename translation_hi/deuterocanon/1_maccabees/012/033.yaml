  yaml_path: translation/deuterocanon/1_maccabees/012/033.yaml
  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: hi
  text: और शमौन निकला और अश्कलोन तक तथा उसके आस-पास के गढ़ों से होकर गुज़रा। फिर वह याफा की ओर मुड़ा और उस पर पहले ही अधिकार कर लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे पहले ही अपने कब्जे में ले लिया’ अथवा ‘उस पर पहले ही कब्जा कर लिया’; यूनानी क्रिया किसी दूसरे पक्ष से पहले उस स्थान को अपने नियंत्रण में लेने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων
  choice: शमौन
  rationale: यह इस यूनानी नाम का प्रचलित और स्वाभाविक हिन्दी बाइबलीय रूप है।
- source_word: διώδευσεν
  choice: गया
  rationale: संदर्भ में क्रिया किसी भूभाग या मार्ग से आगे बढ़ने का बोध देती है। हिन्दी वाक्य में ‘तक गया’ सहज है और अनावश्यक रूप से सैनिक कूच का अर्थ नहीं जोड़ता।
- source_word: ἕως Ἀσκάλωνος
  choice: अश्कलोन ... तक
  rationale: ἕως गति की सीमा बताता है; ‘तक’ उस सूक्ष्म अर्थ को सुरक्षित रखता है।
- source_word: τὰ πλησίον ὀχυρώματα
  choice: उसके आस-पास के गढ़ों
  rationale: ὀχυρώματα किलेबंद स्थानों या गढ़ों को दर्शाता है और πλησίον उनकी निकटता बताता है। ‘गढ़’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: मुड़कर याफा गया
  rationale: ἐκκλίνω पहले मार्ग से दिशा बदलने का संकेत देता है। ‘मुड़कर’ इस परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προκατελάβετο αὐτήν
  choice: उस पर पहले ही अधिकार कर लिया
  rationale: यौगिक क्रिया किसी अन्य संभावित पक्ष से पहले किसी स्थान को अपने नियंत्रण में लेने का भाव रखती है। यह अनुवाद उस पूर्वता को बनाए रखता है, पर यह नहीं बताता कि वह पक्ष कौन था।
