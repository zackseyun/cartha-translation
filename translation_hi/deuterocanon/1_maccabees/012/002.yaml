  yaml_path: translation/deuterocanon/1_maccabees/012/002.yaml
  text: And he sent letters to the Spartans and to other places in the same terms[a].
translation:
  language: hi
  text: और उसने स्पार्टावासियों और अन्य स्थानों को भी इसी आशय के पत्र भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: उसने … भेजे
  rationale: ἀποστέλλω का एओरिस्ट सक्रिय रूप पत्र भेजने की पूर्ण हुई क्रिया बताता है; हिन्दी में ‘भेजे’ स्वाभाविक और स्पष्ट है।
- source_word: ἐπιστολὰς
  choice: पत्र
  rationale: यूनानी में कर्मकारक बहुवचन है। हिन्दी में ‘पत्र भेजे’ क्रिया के बहुवचन से अनेक पत्रों का अर्थ स्पष्ट करता है।
- source_word: πρὸς Σπαρτιάτας
  choice: स्पार्टावासियों … को
  rationale: भेजने की क्रिया के साथ πρός प्राप्तकर्ताओं को सूचित करता है; ‘को’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: τόπους ἑτέρους
  choice: अन्य स्थानों
  rationale: τόπους का सामान्य अर्थ ‘स्थान’ और ἑτέρους का अर्थ ‘अन्य’ है; राजनीतिक या भौगोलिक विशिष्टता जोड़े बिना यह स्रोत के निकट रहता है।
- source_word: κατὰ ταὐτά
  choice: इसी आशय के
  rationale: यह पदबंध पहले उल्लिखित पत्र के अनुरूप विषय-वस्तु या अभिप्राय का संकेत करता है। ‘इसी आशय के’ आधुनिक हिन्दी में स्वाभाविक है और समानता को केवल भेजने की रीति तक सीमित नहीं करता।
