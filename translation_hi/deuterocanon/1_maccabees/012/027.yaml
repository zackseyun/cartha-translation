  yaml_path: translation/deuterocanon/1_maccabees/012/027.yaml
  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: hi
  text: जब सूर्य अस्त हो गया, तब योनातान ने जो उसके साथ थे उन्हें आज्ञा दी कि वे जागते रहें, अपने हथियारों के पास रहें और सारी रात युद्ध के लिए तैयार रहें। उसने छावनी के चारों ओर पहरेदार तैनात कर दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: जब सूर्य अस्त हो गया
  rationale: यूनानी वाक्यांश शाम होने का समय बताता है; क्रिया का एओरिस्ट रूप सूर्यास्त को योनातान की आज्ञा से पहले घटित पूर्ण घटना के रूप में प्रस्तुत करता है।
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह अधिकारपूर्वक आदेश देने को व्यक्त करता है और सैन्य प्रसंग के अनुकूल है।
- source_word: τοῖς παρʼ αὐτοῦ
  choice: अपने साथियों को
  rationale: शाब्दिक अर्थ ‘उसके साथ के लोगों’ का स्वाभाविक और संक्षिप्त हिन्दी रूप है; यह अनावश्यक रूप से उन्हें किसी अधिक विशिष्ट सैन्य श्रेणी में नहीं रखता।
- source_word: γρηγορεῖν
  choice: जागते रहें
  rationale: मूल अर्थ जागे और सतर्क रहने का है। आगे अलग से पहरेदार तैनात किए गए हैं, इसलिए इसे ‘पहरा दें’ कहना दोनों कार्यों को मिला देता।
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: अपने हथियार तैयार रखें
  rationale: यूनानी मुहावरा हथियार हाथ में रखकर तत्पर रहने का भाव देता है; यह हिन्दी में उस ठोस सैन्य तत्परता को सहज रूप से व्यक्त करता है।
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: युद्ध के लिए तैयार रहें
  rationale: तात्कालिक सैन्य मुठभेड़ के लिए तैयारी का अर्थ स्पष्ट रखता है।
- source_word: διʼ ὅλης τῆς νυκτός
  choice: सारी रात
  rationale: पूरी रात की अवधि पर दिए गए बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξέβαλεν προφύλακας
  choice: पहरेदार भी तैनात कर दिए
  rationale: शाब्दिक रूप से बाहर भेजने या लगाने का सैन्य मुहावरा है; ‘तैनात कर दिए’ चौकसी के लिए निश्चित स्थानों पर नियुक्त करने का आशय देता है। ‘भी’ यूनानी καὶ के संयोजक/अतिरिक्त भाव को सहज हिन्दी में रखता है।
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: छावनी के चारों ओर
  rationale: παρεμβολή यहाँ सैन्य छावनी है और κύκλῳ उसके चारों ओर की परिधि को दर्शाता है।
