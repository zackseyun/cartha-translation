  yaml_path: translation/deuterocanon/1_maccabees/016/008.yaml
  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
translation:
  language: hi
  text: तब उन्होंने तुरहियाँ बजाईं, और केन्देबियुस और उसकी सेना में खलबली मच गई[a]। उनमें से बहुत से लोग घायल होकर गिर पड़े[b], परन्तु जो बचे रहे, वे गढ़ में भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे परास्त होकर तितर-बितर हो गए” अथवा “उन्हें पीछे हटने पर विवश किया गया।” यूनानी सैन्य क्रिया पराजय, पलटने और तितर-बितर होकर भागने का अधिक प्रबल भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “घायल होकर गिर पड़े” यूनानी के निकट है; इसका यह अर्थ आवश्यक नहीं कि वे सभी मर गए। यह युद्ध में घायल होकर धराशायी होने को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: तुरहियाँ बजाईं
  rationale: यूनानी क्रिया और करणवाचक संज्ञा मिलकर सैन्य संकेत के लिए तुरही बजाने का स्पष्ट अर्थ देते हैं; यह हिन्दी में स्वाभाविक और ठोस अभिव्यक्ति है।
- source_word: ἐτροπώθη
  choice: तितर-बितर हो गई
  rationale: सैन्य प्रसंग में निष्क्रिय क्रिया पराजित होकर मुड़ने, खदेड़े जाने या भागने के लिए विवश होने का बोध करा सकती है। ‘तितर-बितर हो गई’ अव्यवस्था और पराजय दोनों का संकेत देती है, जबकि आगे वर्णित पलायन को हूबहू दोहराती नहीं।
- source_word: παρεμβολὴ
  choice: सेना
  rationale: παρεμβολή का अर्थ ‘छावनी’ या ‘सेना’ हो सकता है। यहाँ उसके लोगों के घायल होकर गिरने और शेष के भागने के कारण सैन्य दल अभिप्रेत है; इसलिए हिन्दी में ‘सेना’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ἔπεσον ... τραυματίαι
  choice: घायल होकर गिर पड़े
  rationale: यह यूनानी वाक्यांश युद्ध में घायल होकर गिरने वालों को दर्शाता है और यह आवश्यक नहीं कि सभी की मृत्यु हुई हो। चुना हुआ रूप इसी भेद को बनाए रखता है।
- source_word: οἱ ... καταλειφθέντες
  choice: जो बचे रहे
  rationale: शाब्दिक अर्थ ‘जो शेष रह गए’ है। युद्ध के इस प्रसंग में ‘जो बचे रहे’ सहज हिन्दी है, पर इसे मृत्यु से बचे रहने तक सीमित करने के बजाय शेष सैनिकों के अर्थ में समझा जा सकता है।
- source_word: ὀχύρωμα
  choice: गढ़
  rationale: संज्ञा किसी सुरक्षित किलेबंद स्थान को दर्शाती है। ‘गढ़’ संक्षिप्त, वर्तमान हिन्दी में बोधगम्य और सैन्य प्रसंग के अनुकूल है।
