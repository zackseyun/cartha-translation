    reason: lexical_alternative
  - marker: b
    text: ‘जिसे’ स्वाभाविक रूप से केद्रोन की ओर संकेत करता है और ‘उसने’ का आशय यूहन्ना से है; यूनानी वाक्य इस संबंध को इससे अधिक विस्तार से नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: घायल हो गया
  rationale: युद्ध के प्रसंग में यह कर्मवाच्य क्रिया किसी के घाव लगने को व्यक्त करती है; ‘घायल हो गया’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: κατεδίωξεν
  choice: पीछा करते हुए
  rationale: क्रिया भागते हुए विरोधियों का सक्रिय रूप से पीछा करने का बोध कराती है। हिन्दी वाक्य में यह रूप पीछा जारी रहने और केद्रोन तक पहुँचने की घटनाओं को सहजता से जोड़ता है।
- source_word: ἕως ἐλθεῖν
  choice: तक पहुँचा
  rationale: यह रचना पीछा किए जाने की सीमा बताती है। मुख्य क्रिया का कर्ता यूहन्ना है, इसलिए हिन्दी में एकवचन ‘पहुँचा’ रखा गया है।
- source_word: Κεδρών
  choice: केद्रोन
  rationale: यह यूनानी नाम का सीधा देवनागरी लिप्यंतरण है और आरंभिक कप्पा ध्वनि को ‘क’ से व्यक्त करता है।
- source_word: οἰκοδόμησεν
  choice: निर्माण किया था
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। ‘किया था’ निर्माण के पहले हो चुकने को स्पष्ट करता है; ‘किलेबंदी की थी’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
