lexical_decisions:
- source_word: τὰ λοιπὰ τῶν λόγων Ἰωάννου
  choice: यूहन्ना के शेष वृत्तांत
  rationale: समापन-सूत्र के इस इतिहासलेखन-संदर्भ में λόγοι केवल ‘वचन’ नहीं, बल्कि यूहन्ना से संबंधित विवरण या वृत्तांत हैं; ‘शेष वृत्तांत’ स्वाभाविक और संक्षिप्त है।
- source_word: πολέμων
  choice: युद्धों
  rationale: यह बहुवचन यूहन्ना के सैन्य संघर्षों को व्यापक रूप से सूचित करता है; ‘लड़ाइयों’ की अपेक्षा ‘युद्धों’ में वही व्यापकता रहती है।
- source_word: ἀνδραγαθιῶν ... ἠνδραγάθησεν
  choice: उसके किए हुए वीरतापूर्ण कामों
  rationale: संज्ञा और सजातीय क्रिया दोनों में वीरता का भाव है। हिन्दी में अनावश्यक और अस्वाभाविक पुनरुक्ति से बचते हुए ‘वीरतापूर्ण कामों’ से प्रशंसात्मक अर्थ सुरक्षित रहता है।
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: उसके बनवाए हुए शहरपनाहों
  rationale: τειχέων रक्षात्मक नगर-दीवारों को दर्शाता है, इसलिए ‘शहरपनाह’ केवल ‘दीवारों’ से अधिक सटीक है। शासक के निर्माण-कार्य के संदर्भ में ‘बनवाए हुए’ स्वाभाविक हिन्दी है और यूनानी के निर्माण-सूचक पदों को संक्षेप में व्यक्त करता है।
- source_word: πράξεων
  choice: अन्य कार्यों
  rationale: यह सूची का व्यापक अंतिम पद है। हिन्दी में ‘कामों’ की निकट पुनरावृत्ति से बचने के लिए ‘कार्यों’ चुना गया है; ‘अन्य’ सूची के समापन और शेष गतिविधियों के भाव को स्पष्ट करता है।
- source_word: Καὶ
  choice: और
  rationale: यह पिछले कथन से जुड़े औपचारिक समापन को बनाए रखता है।
