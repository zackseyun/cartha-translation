translation:
  language: hi
  text: और यूहन्ना के शेष वृत्तांत, उसके युद्धों, उसके वीरतापूर्ण कार्यों जो उसने किए, उन नगर-दीवारों के निर्माण जिन्हें उसने बनाया, और उसके कार्यों के विषय में—
