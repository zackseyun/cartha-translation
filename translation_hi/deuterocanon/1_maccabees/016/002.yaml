  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: hi
  text: तब शमौन ने अपने दो बड़े पुत्रों, यहूदा और यूहन्ना को बुलाकर उनसे कहा, “मैंने, मेरे भाइयों ने और मेरे पिता के घराने ने जवानी से लेकर आज के दिन तक इस्राएल के युद्ध लड़े हैं, और हमारे हाथों इस्राएल को अनेक बार छुड़ाने में सफलता मिली है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावानुवादी रूप: “हम इस्राएल को अनेक बार छुड़ाने में सफल हुए हैं।” यूनानी का शाब्दिक भाव है, “इस्राएल को अनेक बार छुड़ाना हमारे हाथों में सफल हुआ है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: अपने दो बड़े पुत्रों
  rationale: πρεσβυτέρους तुलनात्मक अर्थ में ‘बड़े’ है। यह सहज हिन्दी है और यह अनावश्यक निष्कर्ष नहीं निकालती कि शमौन के कुल मिलाकर केवल दो ही पुत्र थे।
- source_word: ἐπολεμήσαμεν
  choice: युद्ध लड़े हैं
  rationale: यूनानी अओरिस्ट यहाँ जवानी से वर्तमान दिन तक की पिछली गतिविधि का सार देता है; हिन्दी का पूर्ण पक्ष ‘लड़े हैं’ इस अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς πολέμους Ἰσραήλ
  choice: इस्राएल के युद्ध
  rationale: 'सम्बन्धकारक की अस्पष्टता बनाए रखी गई है: ये इस्राएल द्वारा, इस्राएल के लिए, अथवा इस्राएल से सम्बन्धित युद्ध हो सकते हैं।'
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: अपनी जवानी से लेकर आज के दिन तक
  rationale: यह आरम्भिक जीवन से वक्ता के वर्तमान समय तक की निरन्तर अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: काम हमारे हाथों में सफल हुआ है
  rationale: εὐώδωθη की सफलता/समृद्धि और ‘हमारे हाथों में’ की बाइबलीय छवि दोनों सुरक्षित रहती हैं; ‘काम’ हिन्दी में निर्वैयक्तिक यूनानी रचना को बोधगम्य बनाता है।
- source_word: ῥύσασθαι
  choice: छुड़ाने
  rationale: सैन्य संकट से बचाने का अर्थ देता है और ‘उद्धार’ से जुड़ी सम्भावित अतिरिक्त धर्मवैज्ञानिक ध्वनि आरोपित नहीं करता।
- source_word: πλεονάκις
  choice: अनेक बार
  rationale: बार-बार घटित सफल छुटकारे पर मूल पाठ के बल को सीधे व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के छुटकारे में कर्तृत्व
  choice: पाठ के अनुसार शमौन और उसका परिवार मानवीय साधन हैं, और उनकी सफलता को ‘हमारे हाथों में सफल हुआ’ कहा गया है।
  alternative: 'अधिक भावानुवादी रूप: ‘हम इस्राएल को अनेक बार छुड़ाने में सफल हुए हैं।’'
  rationale: यूनानी पाठ यहाँ परमेश्वर को स्पष्ट कर्ता नहीं बनाता, यद्यपि सफलता की अभिव्यक्ति में ईश्वरीय अनुग्रह का संकेत समझा जा सकता है। अनुवाद न तो परमेश्वर को जोड़ता है, न मानवीय कर्तृत्व को दबाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘पुत्रों’, ‘घराने’ और ‘छुड़ाने’ जैसे शब्द बाइबलीय परिवेश के अनुकूल हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्पष्ट है।
