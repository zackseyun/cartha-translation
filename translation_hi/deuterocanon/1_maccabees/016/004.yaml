    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: यह क्रिया एक बड़े समूह में से सोच-समझकर चुनने को व्यक्त करती है और सैन्य भर्ती के प्रसंग में स्वाभाविक है।
- source_word: ἐκ τῆς χώρας
  choice: देश से
  rationale: χώρα यहाँ उस भूभाग या प्रदेश को सूचित करता है जहाँ से सैनिक चुने गए; ‘देश से’ संक्षिप्त और स्वाभाविक है।
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: बीस हज़ार योद्धाओं
  rationale: यह पद पुरुष युद्धकर्ताओं को दर्शाता है। ‘योद्धाओं’ से सैन्य भूमिका स्पष्ट रहती है और हिन्दी में अनावश्यक भारीपन नहीं आता।
- source_word: ἱππεῖς
  choice: घुड़सवारों
  rationale: यह संज्ञा घोड़े पर सवार लड़ाकों को दर्शाती है; ‘घुड़सवार’ यूनानी शब्द के ठोस अर्थ को सुरक्षित रखता है।
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: केन्देबायोस के विरुद्ध कूच करके
  rationale: सैन्य प्रसंग में πορεύομαι आगे बढ़ने या कूच करने और ἐπί के साथ कर्मकारक किसी विरोधी के विरुद्ध जाने को दर्शाता है।
- source_word: ἐκοιμήθησαν
  choice: रात को पड़ाव डालकर ठहरे
  rationale: क्रिया का शाब्दिक अर्थ ‘सो गए’ है, पर सैन्य यात्रा के इस प्रसंग में आशय रात बिताने के लिए पड़ाव डालना है। इस चयन से प्रसंगगत अर्थ स्पष्ट होता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: Μωδαείμ
  choice: मोदेइन
  rationale: यह स्थान-नाम का हिन्दी लिप्यंतरण है, जो प्रचलित Modein रूप के निकट है।
