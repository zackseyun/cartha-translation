lexical_decisions:
- source_word: διεῖλεν
  choice: दलों में बाँटा
  rationale: क्रिया का मूल अर्थ बाँटना या विभाजित करना है। सैन्य प्रसंग में ‘दलों में बाँटा’ स्वाभाविक है और व्यवस्था का संकेत देता है, पर किसी विशिष्ट युद्ध-व्यूह को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸν λαόν
  choice: लोगों
  rationale: यूनानी में शाब्दिक अर्थ ‘लोग’ है; प्रसंग में इससे उसके अधीन लड़ने वाले लोग अभिप्रेत हैं। ‘लोगों’ मूल शब्दावली को बनाए रखता है।
- source_word: τοὺς ἱππεῖς
  choice: घुड़सवारों
  rationale: यह शब्द घोड़े पर सवार सैनिकों को सीधे व्यक्त करता है।
- source_word: ἐν μέσῳ τῶν πεζῶν
  choice: पैदल सैनिकों के बीच
  rationale: πεζοί पैदल लड़ने वाले सैनिक हैं और ἐν μέσῳ उनके बीच स्थिति को दर्शाता है। यह स्पष्ट और वर्तमान सैन्य भाषा है।
- source_word: ἡ δὲ ἵππος
  choice: पर ... घुड़सवार सेना
  rationale: ἵππος शाब्दिक रूप से ‘घोड़ा’ है, किंतु यहाँ सामूहिक सैन्य अर्थ में घुड़सवार सेना को दर्शाता है।
- source_word: τῶν ὑπεναντίων
  choice: शत्रुओं की
  rationale: यह विरोध में खड़े लोगों को दर्शाता है; युद्ध के प्रसंग में ‘शत्रुओं’ स्वाभाविक और सटीक है।
- source_word: πολλὴ σφόδρα
  choice: बहुत बड़ी
  rationale: यह पदावली घुड़सवार सेना की अत्यधिक संख्या पर बल देती है। हिंदी में सेना के लिए ‘बहुत बड़ी’ सहज रूप से उसकी संख्यात्मक विशालता व्यक्त करता है।
