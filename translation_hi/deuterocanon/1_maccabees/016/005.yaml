  yaml_path: translation/deuterocanon/1_maccabees/016/005.yaml
  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
translation:
  language: hi
  text: और वे भोर में उठकर मैदान में गए। और देखो, पैदल सैनिकों और घुड़सवारों की एक बड़ी सेना उनका सामना करने आई, और दोनों के बीच एक बरसाती नाला[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेज़ बहने वाली धारा का सूखा पाट’ अथवा ‘मौसमी जलधारा’। यूनानी शब्द ऐसी जलधारा को सूचित करता है जो प्रायः वर्षा या शीत ऋतु में बहती है; इसका अर्थ स्वयं धारा या उसका पाट, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: भोर को उठकर
  rationale: कृदन्त और काल-सूचक पदबंध मुख्य क्रिया से पहले की क्रिया बताते हैं। यह अनुवाद क्रम को बनाए रखते हुए स्वाभाविक और संक्षिप्त हिन्दी देता है।
- source_word: ἐπορεύοντο εἰς τὸ πεδίον
  choice: मैदान की ओर चले गए
  rationale: यहाँ अपूर्णकाल कथा की अग्रसर होती घटना को व्यक्त करता है; हिन्दी में ‘चले गए’ अधिक स्वाभाविक है। εἰς गंतव्य की दिशा बताता है, इसलिए ‘की ओर’ उपयुक्त है।
- source_word: τὸ πεδίον
  choice: मैदान
  rationale: सैनिक प्रसंग में यह खेती का खेत नहीं, खुला समतल भूभाग है। ‘मैदान’ सामान्य आधुनिक हिन्दी में यही अर्थ स्पष्ट करता है।
- source_word: δύναμις πολλὴ
  choice: एक बड़ी सेना
  rationale: सैनिक वृत्तांत में δύναμις सशस्त्र सैन्य दल को सूचित करता है। साथ आए पैदल सैनिकों और घुड़सवारों के उल्लेख के कारण ‘सेना’ स्पष्ट और स्वाभाविक है, यद्यपि यूनानी शब्द औपचारिक राज्य-सेना को अनिवार्यतः निर्दिष्ट नहीं करता।
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: उनका सामना करने आ रही थी
  rationale: यह पदबंध उनकी ओर आमने-सामने की मुठभेड़ के लिए आने का भाव देता है। ‘सामना करने’ संदर्भगत विरोध को व्यक्त करता है, बिना ‘आक्रमण’ जैसी अतिरिक्त विशिष्टता जोड़े।
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: पैदल सैनिक और घुड़सवार
  rationale: ये दोनों सैन्य वर्गों का स्पष्ट, प्रचलित और सर्वसुलभ हिन्दी रूप है।
- source_word: χειμάρρους
  choice: बरसाती नाला
  rationale: χειμάρρους वर्षा अथवा शीत ऋतु में बहने वाली जलधारा या उसके पात्र को सूचित कर सकता है। ‘बरसाती नाला’ हिन्दी पाठक के लिए निकटतम स्वाभाविक भौगोलिक अभिव्यक्ति है; पद की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: दोनों के बीच ... था
  rationale: αὐτῶν का संकेत दोनों विरोधी पक्षों की ओर है। हिन्दी में ‘दोनों के बीच’ भूभाग द्वारा उनके अलग होने को सीधे और स्पष्ट रूप से व्यक्त करता है।
