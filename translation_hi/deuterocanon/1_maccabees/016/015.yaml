  yaml_path: translation/deuterocanon/1_maccabees/016/015.yaml
  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
translation:
  language: hi
  text: और अबूबुस के पुत्र ने छल से उनका स्वागत उस गढ़ में किया, जो दोक कहलाता था और जिसे उसने बनाया था। उसने उनके लिए बड़ा मद्यपान-भोज तैयार किया[a] और वहाँ लोगों को छिपा रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उनके लिए पीने का बड़ा आयोजन किया।” यूनानी में πότον विशेष रूप से पीने पर बल देता है; प्रसंग में इसका आशय मदिरा सहित भव्य भोज भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδέξατο
  choice: स्वागत किया
  rationale: क्रिया अतिथियों को ग्रहण करने और उनका सत्कार करने का भाव देती है; छलपूर्ण आतिथ्य के प्रसंग में यह स्वाभाविक है।
- source_word: ὁ τοῦ Ἀβουβον
  choice: अबूबुस के पुत्र
  rationale: यूनानी में यह संक्षिप्त पितृनाम-सूचक प्रयोग है। निकटवर्ती प्रसंग से व्यक्ति का नाम ज्ञात होने पर भी पद की अभिव्यक्ति को बनाए रखा गया है।
- source_word: εἰς τὸ ὀχύρωματιν
  choice: उस गढ़ में
  rationale: असामान्य पाठरूप के बावजूद अर्थ एक किलेबंद स्थान का है। ‘गढ़’ आधुनिक हिंदी में संक्षिप्त, स्वाभाविक और सैन्य अर्थ वाला शब्द है।
- source_word: τὸ καλούμενον Δὼκ
  choice: जो दोख कहलाता था
  rationale: नामकरण-सूचक कृदंत का सीधा अनुवाद; Δώκ का लिप्यंतरण ‘दोख’ यूनानी χ-जैसी अंतिम ध्वनि को दर्शाता है।
- source_word: μετὰ δόλου
  choice: छल से
  rationale: यह संज्ञात्मक यूनानी पदबंध स्वागत के कपटपूर्ण ढंग को बताता है। ‘छल से’ अर्थ को स्पष्ट रखता है, पर उससे आगे ‘विश्वासघात’ जैसी व्याख्या नहीं जोड़ता।
- source_word: ὃ ᾠκοδόμησεν
  choice: जिसे उसने बनवाया था
  rationale: संबंधवाचक उपवाक्य गढ़ को संदर्भित करता है। पूर्वकालिकता के लिए ‘था’ और निर्माणकर्ता के रूप में किसी प्रमुख व्यक्ति के सामान्य हिंदी प्रयोग हेतु ‘बनवाया’ चुना गया है।
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: उसने उनके लिए मदिरा का बड़ा भोज तैयार किया
  rationale: πότον विशेष रूप से पीने अथवा मद्यपान पर बल देता है। ‘मदिरा का बड़ा भोज’ इस विशेषता को सामान्य ‘भोज’ में विलीन किए बिना स्वाभाविक हिंदी देता है।
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: वहाँ कुछ पुरुषों को छिपा रखा था
  rationale: क्रिया योजनापूर्वक पहले से छिपाने का भाव देती है। ‘छिपा रखा था’ घात की तैयारी को स्वाभाविक रूप से व्यक्त करता है; ‘कुछ’ हिंदी में अनिश्चित बहुवचन को सहज बनाता है।
