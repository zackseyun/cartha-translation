  text: और उसने घोर विश्वासघात[a] किया, और भलाई के बदले बुराई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वास का घोर उल्लंघन’ अथवा ‘बड़ी विश्वासहीनता।’ यूनानी शब्द विश्वास या दायित्व को तोड़ने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: किया
  rationale: ἀθεσίαν के साथ यह क्रिया किसी विश्वासघाती काम को अंजाम देने का अर्थ देती है; हिन्दी में ‘विश्वासघात किया’ स्वाभाविक और सटीक है।
- source_word: ἀθεσίαν
  choice: विश्वासघात
  rationale: संदर्भ में यह शब्द विश्वास, संबंध या दायित्व के उल्लंघन से जुड़ी ठोस गद्दारी को दर्शाता है; ‘विश्वासघात’ इस नैतिक और संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: μεγάλην
  choice: घोर
  rationale: विशेषण अपराध की गंभीरता पर बल देता है। ‘घोर’ आधुनिक हिन्दी में नैतिक तीव्रता को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि इसका अधिक शाब्दिक रूप ‘बड़ा’ हो सकता है।
- source_word: ἀνταπέδωκεν
  choice: के बदले ... की
  rationale: क्रिया प्रत्युत्तर में लौटाने या प्रतिफल देने का भाव रखती है; ‘भलाई के बदले बुराई की’ हिन्दी में इस विनिमयात्मक अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: κακὰ
  choice: बुराई
  rationale: बहुवचन नपुंसकलिंग रूप यहाँ बुरे काम या बुरे व्यवहार को सामूहिक अर्थ में दर्शाता है; ‘बुराई’ उसके नैतिक आयाम को बनाए रखती है।
- source_word: ἀντὶ ἀγαθῶν
  choice: भलाई के बदले
  rationale: यह पदबंध अच्छे कामों या उपकारों के प्रत्युत्तर में विपरीत व्यवहार किए जाने को दर्शाता है; ‘भलाई के बदले’ स्पष्ट, संक्षिप्त और मुहावरेदार है।
theological_decisions:
- issue: ἀθεσία का नैतिक स्वरूप
  choice: इसे संबंधपरक विश्वासघात के रूप में अनूदित किया गया है।
  alternative: घोर अधर्म; बड़ी विश्वासहीनता; विश्वास का बड़ा उल्लंघन
  rationale: प्रसंग किसी अमूर्त अधर्म की अपेक्षा एक ठोस विश्वासघाती कृत्य की निंदा करता है। ‘विश्वासघात’ कथात्मक और नैतिक बल को बनाए रखता है, बिना किसी बाद की तकनीकी धर्मवैज्ञानिक श्रेणी को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घोर विश्वासघात’ ‘बड़ा विश्वासघात’ की तुलना में अधिक स्वाभाविक हिन्दी है और मूल के तीव्र नैतिक बल को व्यक्त करता है।
