base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: hi
  text: परन्तु अब मैं बूढ़ा हो गया हूँ, और तुम भी दया से अब पर्याप्त उम्र के हो। तुम मेरे और मेरे भाई के स्थान ले लो[a], और निकलकर हमारे राष्ट्र की रक्षा के लिए लड़ो; और स्वर्ग से सहायता तुम्हारे साथ रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘मेरे और मेरे भाई के बदले हो जाओ।’ यहाँ यूनानी पद किसी के स्थान पर कार्य करने का भाव देता है।'
    reason: alternative_reading
  - marker: b
    text: ‘स्वर्ग से सहायता’ परमेश्वर का नाम सीधे लिए बिना दिव्य सहायता की बात कहने का श्रद्धापूर्ण ढंग है।
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: मैं बूढ़ा हो गया हूँ
  rationale: पूर्णकालिक रूप वृद्ध होने की प्रक्रिया के फलस्वरूप वर्तमान अवस्था व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से दोनों पक्षों को रखता है।
- source_word: ἐν τῷ ἐλέει
  choice: दया से
  rationale: यूनानी में दया करने वाले का नाम स्पष्ट नहीं है। इसलिए ‘परमेश्वर की दया से’ जोड़ने के बजाय निहित दिव्य संकेत को अनिर्दिष्ट रखा गया है।
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: आयु में समर्थ हो गए हो
  rationale: ἱκανοί पर्याप्तता अथवा योग्यता व्यक्त करता है और ἐν τοῖς ἔτεσιν के साथ उचित आयु तथा परिपक्वता का बोध देता है।
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: तुम मेरे और मेरे भाई के स्थान पर खड़े हो जाओ
  rationale: ἀντί के प्रतिस्थापन-बोध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπερμαχεῖτε ὑπὲρ τοῦ ἔθνους ἡμῶν
  choice: हमारे राष्ट्र के लिए युद्ध करो
  rationale: क्रिया किसी के पक्ष या रक्षा में लड़ने का अर्थ रखती है; मक्काबी प्रसंग में ἔθνος यहूदी राष्ट्रीय समुदाय को सूचित करता है।
- source_word: ἡ ... ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: स्वर्ग से मिलने वाली सहायता
  rationale: सहायता के स्रोत के रूप में स्वर्ग की छवि और परमेश्वर का नाम न लेकर दिव्य सहायता का संकेत—दोनों सुरक्षित रहते हैं।
- source_word: ἤτω μεθʼ ὑμῶν
  choice: तुम्हारे साथ रहे
  rationale: तृतीय पुरुष आज्ञार्थक का आशीर्वादात्मक अथवा कामनात्मक भाव हिन्दी में इस रूप से स्वाभाविक है।
theological_decisions:
- issue: ‘दया’ और ‘स्वर्ग से ... सहायता’ में निहित दिव्य संदर्भ
  choice: मुख्य पाठ में परमेश्वर का नाम जोड़े बिना निहित संकेत बनाए रखा गया है।
  alternative: ‘परमेश्वर की दया से’ और ‘परमेश्वर की सहायता तुम्हारे साथ रहे’
  rationale: यूनानी पाठ दिव्य कर्तृत्व का संकेत देता है, पर इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं लेता; अनुवाद उसी अप्रत्यक्षता को सुरक्षित रखता है।
- issue: ἀντί द्वारा व्यक्त प्रतिनिधित्व या प्रतिस्थापन
  choice: ‘मेरे और मेरे भाई के स्थान पर खड़े हो जाओ’
  alternative: ‘मेरे और मेरे भाई के उत्तराधिकारी बनो’
  rationale: मूल शब्द स्थान लेने को व्यक्त करता है, पर औपचारिक उत्तराधिकार या पदवी को स्पष्ट नहीं करता; इसलिए अधिक संकीर्ण धार्मिक-राजनीतिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘राष्ट्र’ मक्काबी प्रसंग के सामुदायिक और राष्ट्रीय भाव को बनाए रखता है। ‘दया से’ की कुछ असामान्य पर अर्थपूर्ण रचना मूल की अनिर्दिष्टता बचाती है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
