translation:
  language: hi
  text: तब टॉलेमी ने ये बातें लिखकर राजा के पास संदेश भेजा कि वह उसकी सहायता के लिए सेनाएँ भेजे और उनका देश तथा नगरों को उसके हाथ सौंप दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πτολεμαῖος
  choice: टॉलेमी
  rationale: यूनानी नाम का आधुनिक हिन्दी में प्रचलित और सुबोध लिप्यंतरण।
- source_word: δυνάμεις
  choice: सेनाएँ
  rationale: इस सैन्य-राजनीतिक प्रसंग में शब्द का अर्थ सामान्य ‘शक्तियाँ’ नहीं, बल्कि सशस्त्र सैन्य दल है।
- source_word: εἰς βοήθειαν
  choice: सहायता के लिए
  rationale: उद्देश्यसूचक यूनानी वाक्यांश का स्वाभाविक हिन्दी रूप।
- source_word: παραδῷ
  choice: उसके हाथ सौंप दे
  rationale: ‘सौंप देना/अधिकार में देना’ का भाव स्पष्ट करता है और अप्रकट प्राप्तकर्ता टॉलेमी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν χώραν αὐτῶν καὶ τὰς πόλεις
  choice: उनका देश तथा नगर
  rationale: मूल के संबंधवाचक सर्वनाम और ‘देश तथा नगरों’ की समन्वित संरचना सुरक्षित रखी गई है।
