  yaml_path: translation/deuterocanon/1_maccabees/016/016.yaml
  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: hi
  text: जब शमौन और उसके बेटे नशे में हो गए, तब टॉलेमी और उसके साथ के लोग उठ खड़े हुए। उन्होंने अपने हथियार उठा लिए, दावत[a] में शमौन पर जा चढ़े, और उसे, उसके बेटों तथा उसके कुछ युवा सेवकों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मदिरा-पान की दावत”; यूनानी शब्द विशेष रूप से ऐसी दावत का संकेत भी दे सकता है जिसमें मदिरा पी जाती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: नशे में हो गए
  rationale: क्रिया का रूप नशे की अवस्था में पहुँचने को व्यक्त करता है; यह अनुवाद केवल पहले से नशे में होने की स्थिति बताने के बजाय उस परिवर्तन को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐξανέστη
  choice: उठ खड़े हुए
  rationale: यह आक्रमण के आरम्भ में की गई निर्णायक क्रिया को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ μετʼ αὐτοῦ
  choice: उसके साथ के लोग
  rationale: यूनानी पद इन लोगों का निश्चित सैन्य या सामाजिक संबंध नहीं बताता; इसलिए अनुवाद भी उन्हें सैनिक या साथी कहकर अधिक विशिष्ट नहीं बनाता।
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: अपने हथियार उठा लिए
  rationale: ὅπλα का सामान्य अर्थ हथियार है; ‘उठा लिए’ प्रसंग में उन्हें आक्रमण के लिए हाथ में लेने का सहज भाव देता है।
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι
  choice: शमौन पर जा चढ़े
  rationale: संयुक्त क्रिया और शमौन के लिए प्रयुक्त सम्प्रदान कारक hostile entry का भाव देते हैं। ‘पर जा चढ़े’ प्रवेश और आक्रमण, दोनों को संक्षेप में व्यक्त करता है।
- source_word: συμπόσιον
  choice: दावत
  rationale: यह शब्द भोज, विशेषकर मदिरा-पान से जुड़ी दावत, के लिए प्रयुक्त हो सकता है। मुख्य पाठ में व्यापक और स्वाभाविक ‘दावत’ रखा गया है तथा विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यह मूल क्रिया के ‘जान से मारना’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, बिना अलग से कानूनी या नैतिक वर्गीकरण जोड़े।
- source_word: παιδαρίων
  choice: युवा सेवकों
  rationale: शब्द लड़कों अथवा कम आयु के परिचारकों/सेवकों को सूचित कर सकता है। दरबारी प्रसंग में ‘युवा सेवकों’ से आयु और सेवा-भूमिका दोनों सुरक्षित रहते हैं।
