base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/010.yaml
  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: hi
  text: और वे अज़ोतुस[a] के खेतों में बने बुर्जों में भाग गए। उसने उस जगह को आग लगा दी[b]। उनमें से लगभग एक हज़ार पुरुष मारे गए[c], और वह शांति से यहूदिया लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अज़ोतुस, अशदोद का यूनानी नाम है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ का शाब्दिक अर्थ है, “उसने उसे आग से जला दिया।” एकवचन “उसे” संभवतः बहुवचन बुर्जों के बजाय पूरे किलेबंद स्थान को सामूहिक रूप से सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “एक हज़ार पुरुष”; यूनानी अभिव्यक्ति अनुमानित संख्या का संकेत दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: भाग गए
  rationale: सैन्य पराजय के प्रसंग में यह सरल और स्वाभाविक भूतकालीन अभिव्यक्ति है।
- source_word: πύργους τοὺς ἐν τοῖς ἀγροῖς
  choice: खेतों में बने बुर्जों
  rationale: ‘बुर्ज’ रक्षात्मक मीनारों का ठोस बिंब बनाए रखता है और ‘खेतों में बने’ ग्रामीण स्थान को स्पष्ट करता है।
- source_word: Ἀζώτου
  choice: अज़ोतुस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण रखा गया है; परिचित हिब्रानी नाम पादटिप्पणी में दिया गया है।
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: उसने उस जगह को आग लगा दी
  rationale: यूनानी स्त्रीलिंग एकवचन सर्वनाम को बहुवचन ‘बुर्जों’ में बदलने के बजाय उसके सामूहिक स्थान-संदर्भ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἔπεσον ἐξ αὐτῶν
  choice: उनमें से ... मारे गए
  rationale: युद्ध-वर्णन में ‘गिरे’ का आशय मृत्यु है; हिन्दी में ‘मारे गए’ अर्थ को स्पष्ट और स्वाभाविक ढंग से देता है, जबकि ‘उनमें से’ अंशवाचक भाव सुरक्षित रखता है।
- source_word: εἰς ἄνδρας χιλίους
  choice: लगभग एक हज़ार पुरुष
  rationale: असामान्य εἰς-रचना संख्या को करीब एक हज़ार तक पहुँचने का भाव दे सकती है; ‘लगभग’ इस संभावित अनुमान को बनाए रखता है।
- source_word: ἀπέστρεψεν εἰς τὴν Ἰουδαίαν μετʼ εἰρήνης
  choice: वह सकुशल यहूदिया लौट आया
  rationale: μετʼ εἰρήνης को इस विजय-वापसी के प्रसंग में ‘सकुशल’ कहना सहज हिन्दी है और शांतिपूर्वक सुरक्षित लौटने का भाव देता है।
