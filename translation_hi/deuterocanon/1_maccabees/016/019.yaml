  yaml_path: translation/deuterocanon/1_maccabees/016/019.yaml
  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: hi
  text: और उसने कुछ और लोगों को गाज़रा[b] भेजा कि वे यूहन्ना को ले जाएँ[a]। उसने हज़ार सैनिकों के सेनापतियों को भी पत्र भेजे कि वे उसके पास आएँ, ताकि वह उन्हें चाँदी, सोना और उपहार दे सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यूहन्ना को हटा दें।” यूनानी क्रिया का अर्थ किसी को ले जाना, दूर ले जाना, या हटा देना हो सकता है। संदर्भ शत्रुतापूर्ण मंशा दिखाता है, लेकिन कार्रवाई का ठीक स्वरूप नहीं बताता।
    reason: lexical_alternative
  - marker: b
    text: गाज़रा स्रोत-पाठ में प्रयुक्त यूनानी नाम है; यह अधिक परिचित स्थान-नाम गेज़ेर के अनुरूप है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सामान्य कथात्मक क्रिया के रूप में यह स्वाभाविक और सटीक है।
- source_word: ἑτέρους
  choice: कुछ और लोगों को
  rationale: यूनानी में कर्म निहित है; हिन्दी में ‘लोगों’ जोड़ने से वाक्य स्वाभाविक बनता है, जबकि उनकी पहचान अनिर्धारित रहती है।
- source_word: Γάζαρα
  choice: गाज़रा
  rationale: यह स्रोत में आए यूनानी स्थान-नाम का सीधा लिप्यंतरण है; अधिक परिचित नाम ‘गेज़ेर’ पादटिप्पणी में दिया गया है।
- source_word: ἄραι
  choice: हटा दें
  rationale: αἴρω यहाँ उठा लेने, दूर ले जाने या हटाने का अर्थ दे सकता है। षड्यंत्र के संदर्भ में ‘हटा दें’ शत्रुतापूर्ण आशय बनाए रखता है, पर ‘पकड़ लें’ या ‘मार डालें’ जैसी अधिक विशिष्ट कार्रवाई नहीं जोड़ता।
- source_word: τοῖς χιλιάρχοις
  choice: हज़ार-हज़ार सैनिकों के सेनापतियों को
  rationale: यह पद χιλίαρχος का सैन्य अर्थ स्पष्ट करता है—हज़ार सैनिकों का अधिकारी—और सामान्य हिन्दी पाठक के लिए केवल लिप्यंतरण से अधिक बोधगम्य है।
- source_word: ἐπιστολάς
  choice: पत्र
  rationale: मूल शब्द का सामान्य अर्थ ‘पत्र’ है; ‘आदेश’ संदर्भ से संभव है, पर यूनानी से अधिक विशिष्ट होगा।
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: वे उसके पास आएँ
  rationale: यह किसी के पास आने या उपस्थित होने का सहज हिन्दी रूप है।
- source_word: ὅπως δῷ αὐτοῖς
  choice: ताकि वह उन्हें ... दे सके
  rationale: यह ὅπως के प्रयोजनार्थक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀργύριον καὶ χρυσίον
  choice: चाँदी, सोना
  rationale: मूल की दोनों बहुमूल्य धातुओं को सीधे बनाए रखा गया है।
- source_word: δόματα
  choice: उपहार
  rationale: यह व्यापक, स्वाभाविक समतुल्य है और अनावश्यक रूप से रिश्वत या अनुदान का अर्थ नहीं जोड़ता।
