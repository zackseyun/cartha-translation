  yaml_path: translation/deuterocanon/1_maccabees/016/013.yaml
  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
translation:
  language: hi
  text: और उसका मन घमंड से भर गया,[a] और उसने देश पर कब्ज़ा करने का इरादा किया। वह शमौन और उसके पुत्रों के विरुद्ध छल से षड्यंत्र रच रहा था, ताकि उन्हें हटा दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका हृदय ऊँचा हो गया”; अर्थात वह घमंडी हो गया।
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें दूर कर दे।” यूनानी अभिव्यक्ति का मूल अर्थ “उन्हें हटा दे” है; इस प्रसंग में संभवतः हिंसा से उनका अंत कर देना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: उसका मन घमंड से भर गया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘उसका हृदय ऊँचा हो गया’ है और आशय अभिमान या आत्मोन्नति है। सहज आधुनिक हिन्दी में अर्थ स्पष्ट किया गया है, जबकि पाद-टिप्पणी में मूल बिंब सुरक्षित है।
- source_word: ἐβουλήθη
  choice: उसने ... इरादा किया
  rationale: क्रिया सोची-समझी मंशा या संकल्प व्यक्त करती है; ‘इरादा किया’ न तो इसे केवल इच्छा बनाता है, न पूर्ण निर्णय से अधिक दृढ़ बताता है।
- source_word: κατακρατῆσαι τῆς χώρας
  choice: देश पर अधिकार करने
  rationale: κατακρατέω के साथ संबंधकारक यहाँ प्रभुत्व या नियंत्रण स्थापित करने का भाव देता है। ‘अधिकार करने’ राजनीतिक वर्चस्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐβούλευετο
  choice: षड्यंत्र रच रहा था
  rationale: अपूर्णकालिक रूप जारी योजना को दिखाता है; δόλῳ और विरोधी लक्ष्य के कारण तटस्थ ‘विचार कर रहा था’ की अपेक्षा ‘षड्यंत्र रच रहा था’ प्रसंगानुकूल है।
- source_word: δόλῳ
  choice: छल से
  rationale: करण अथवा रीति का भाव रखते हुए यह चुनाव धोखे और विश्वासघाती योजना दोनों की संभावना खुली रखता है।
- source_word: ἆραι αὐτούς
  choice: उन्हें रास्ते से हटा दे
  rationale: αἴρω का मूल भाव उठा लेने या हटा देने का है। शत्रुतापूर्ण प्रसंग में हिंसक उन्मूलन संभावित है, पर मुख्य पाठ सीधे ‘मार डाले’ कहकर अस्पष्टता समाप्त नहीं करता।
- source_word: χώρα
  choice: देश
  rationale: यहाँ शब्द भौगोलिक भूमि से अधिक शासनाधीन राजनीतिक भूभाग को सूचित करता है; इसलिए ‘देश’ उपयुक्त है।
