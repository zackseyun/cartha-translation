  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: hi
  text: और वह स्वयं और उसके लोगों ने उनके सामने पड़ाव डाला। जब उसने देखा कि लोग बरसाती नाले[a] को पार करने से डर रहे हैं, तो वह सबसे पहले पार हुआ। तब पुरुषों ने उसे देखा और उसके पीछे पार हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेज़ बहती धारा” अथवा “नदी का सूखा पाट”; यूनानी शब्द ऐसे जलमार्ग के लिए है जिसमें प्रायः वर्षा के मौसम में पानी बहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य प्रसंग में क्रिया का अर्थ छावनी लगाना या पड़ाव डालना है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: उनके सामने
  rationale: यह वाक्यांश विरोधी दल के ठीक सामने या सम्मुख स्थिति को सूचित करता है।
- source_word: δειλούμενον
  choice: डर रहे हैं
  rationale: यहाँ कृदन्त लोगों की तत्काल भयभीत दशा बताता है, न कि उन पर कायरता का नैतिक आरोप लगाता है।
- source_word: διαπερᾶσαι
  choice: पार करने
  rationale: नाले के प्रसंग में इसका सीधा अर्थ एक ओर से दूसरी ओर जाना है।
- source_word: τὸν χειμάρρουν
  choice: बरसाती नाले
  rationale: χείμαρρους वर्षा के मौसम में बहने वाले जलमार्ग या वादी को दर्शाता है; 'बरसाती नाला' सामान्य हिन्दी पाठक के लिए भौगोलिक अर्थ को स्पष्ट करता है।
- source_word: διεπέρασεν πρῶτος
  choice: वह सबसे पहले पार हुआ
  rationale: यह उसके नेतृत्वकारी कार्य पर दिए गए मूल बल को बनाए रखता है।
- source_word: οἱ ἄνδρες
  choice: वे पुरुष
  rationale: मूल यूनानी में केवल 'पुरुष' है, सैनिक या उसके लोग जैसा स्पष्ट विस्तार नहीं; 'वे' पूर्वोक्त समूह से संबंध स्पष्ट करता है।
- source_word: κατόπισθεν αὐτοῦ
  choice: उसके पीछे
  rationale: यह उसके पीछे-पीछे उसी मार्ग से आगे बढ़ने का स्थानिक और क्रमिक भाव बनाए रखता है।
