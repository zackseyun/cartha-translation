  yaml_path: translation/deuterocanon/1_maccabees/016/021.yaml
  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: hi
  text: और वह आगे दौड़कर गज़ारा में यूहन्ना के पास पहुँचा और उसे खबर दी कि यूहन्ना के पिता और भाई मारे गए हैं, और उसने तुम्हें भी मार डालने के लिए लोग भेजे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “और उसने तुम्हें भी मार डालने के लिए भेजा है।” यूनानी में “भेजा है” का कर्म नहीं बताया गया है; स्पष्टता के लिए मुख्य पाठ में “लोग” जोड़ा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: आगे दौड़कर
  rationale: यह कृदन्त आगे निकल जाने और शीघ्रता, दोनों को व्यक्त करता है; ‘आगे दौड़कर’ गति और तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: सन्देश पहुँचाने या समाचार देने के अर्थ में ‘बताया’ सरल, स्वाभाविक और प्रसंगानुकूल है।
- source_word: εἰς Γάζαρα
  choice: गज़ारा में यूहन्ना के पास
  rationale: यूनानी पदबंध गज़ारा को उस स्थान के रूप में दिखाता है जहाँ यूहन्ना को समाचार दिया गया; यह हिन्दी क्रम अर्थ को स्पष्ट और सहज बनाता है।
- source_word: ἀπώλετο
  choice: मारे गए हैं
  rationale: प्रसंग हिंसक मृत्यु का है। ‘मारे गए हैं’ साधारण पाठक के लिए स्पष्ट है और परिणाम की वर्तमान प्रासंगिकता को भी व्यक्त करता है।
- source_word: Ἀπέσταλκεν
  choice: उसने ... लोग भेजे हैं
  rationale: पूर्णकाल बताता है कि भेजने की कार्रवाई हो चुकी है और खतरा अभी बना हुआ है। यूनानी में भेजी गई वस्तु/व्यक्ति अनुक्त है; सहज हिन्दी के लिए ‘लोग’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: तुम्हें भी मार डालने के लिए
  rationale: ‘भी’ यूहन्ना के खतरे को उसके पिता और भाइयों की मृत्यु से जोड़ता है; ‘मार डालने’ में ἀποκτεῖναι का स्पष्ट अर्थ सुरक्षित है।
