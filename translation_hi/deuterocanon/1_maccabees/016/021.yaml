    issue: Ambiguous possessive pronouns
    rationale: In ‘उसे बताया कि उसके पिता और उसके भाई...’, ‘उसके’ may refer to the preceding messenger (‘वह’) rather than to John. Greek αὐτοῦ refers to John, the recipient of the report; Hindi should make that reference explicit.
