  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: hi
  text: जब उसने यह सुना, तो वह बहुत घबरा उठा। उसने उन आदमियों को पकड़ लिया जो उसे मार डालने आए थे और उन्हें मार डाला, क्योंकि वह जान गया कि वे उसे मार डालने की कोशिश कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने यह सुना
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी में घटना-क्रम दर्शाने वाले उपवाक्य के रूप में प्रस्तुत किया गया है। संदर्भ से स्पष्ट सूचना के लिए ‘यह’ जोड़ा गया है।
- source_word: ἐξέστη σφόδρα
  choice: वह बहुत घबरा गया
  rationale: ἐξίστημι यहाँ हत्या के षड्यंत्र की सूचना पर तीव्र भावनात्मक विचलन या भय व्यक्त करता है; σφόδρα की तीव्रता ‘बहुत’ से बनी रहती है।
- source_word: συνέλαβεν
  choice: पकड़ लिया
  rationale: यह पकड़ने या हिरासत में लेने का व्यापक अर्थ रखता है। ‘गिरफ़्तार किया’ औपचारिक कानूनी प्रक्रिया का अनावश्यक संकेत देता।
- source_word: τοὺς ἄνδρας
  choice: उन पुरुषों को
  rationale: मूल यूनानी में स्पष्ट पुल्लिंग बहुवचन है; ‘पुरुषों’ से यह अर्थ सुरक्षित रहता है।
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: जो उसका नाश करने आए थे
  rationale: ἀπόλλυμι के ‘नाश करना’ अर्थ को रखा गया है और अगले प्रयोग में भी यही मूल शब्द दिखाई देता है; प्रसंग में इसका आशय हत्या करना है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: ἀποκτείνω का स्पष्ट अर्थ हत्या करना है; ‘मार डाला’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: ἔγνω
  choice: वह जान गया था
  rationale: अओरिस्ट यहाँ उनकी मंशा पहचान लेने को व्यक्त कर सकता है; ‘जान गया था’ इस बोध और घटनाक्रम दोनों को स्वाभाविक रूप से दिखाता है।
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: वे उसका नाश करना चाहते थे
  rationale: ζητέω के साथ infinitive उद्देश्यपूर्ण प्रयास या मंशा बताता है। हिन्दी में ‘चाहते थे’ स्वाभाविक है, जबकि अपूर्ण काल की जारी मंशा भी बनी रहती है; दोहराए गए ἀπολέσαι के लिए ‘नाश करना’ फिर रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। यूनानी में ἀπολέσαι की पुनरावृत्ति को ‘नाश करना’ दोहराकर सुरक्षित रखा गया है, जबकि ἀπέκτεινεν को अलग और अधिक विशिष्ट ‘मार डाला’ कहा गया है।
