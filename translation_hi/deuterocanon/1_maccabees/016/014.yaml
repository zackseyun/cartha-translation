  yaml_path: translation/deuterocanon/1_maccabees/016/014.yaml
  text: Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
translation:
  language: hi
  text: शमौन देश के नगरों का दौरा कर रहा था और उनके प्रशासन की देखभाल कर रहा था। वह अपने पुत्रों मत्तथियाह और यहूदा के साथ एक सौ सतहत्तरवें वर्ष के ग्यारहवें महीने में—अर्थात शबात[a] के महीने में—यरीहो को नीचे गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में महीने का नाम “सबाट” है; यहाँ मूल सामी नाम के अनुसार “शबात” लिखा गया है।
    reason: महीने के यूनानी रूप और हिन्दी में प्रयुक्त सामी-आधारित लिप्यंतरण के अंतर को स्पष्ट करना।
lexical_decisions:
- source_word: ἐφοδεύων
  choice: दौरा कर रहा था
  rationale: यह कृदंत नगरों में क्रमशः घूमने और उनका निरीक्षण करने का भाव देता है; ‘दौरा करना’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: τὰς πόλεις τὰς ἐν τῇ χώρᾳ
  choice: देश के नगरों
  rationale: χώρα यहाँ नगरों से व्यापक भूभाग को सूचित करता है; ‘देश’ मूल अर्थ के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: φροντίζω τὰς ἐπιμελίας αὐτῶν
  choice: उनके प्रशासन की देखभाल कर रहा था
  rationale: पाठ का वाक्यांश कुछ असहज है, पर φροντίζω में ध्यान/देखभाल और ἐπιμέλεια में प्रबंध/निगरानी का भाव है; यह अनुवाद दोनों को बनाए रखता है।
- source_word: κατέβη εἰς Ἰεριχώ
  choice: यरीहो की ओर नीचे गया
  rationale: καταβαίνω की दिशात्मक बारीकी ‘नीचे जाना’ को सुरक्षित रखते हुए हिन्दी में यात्रा का स्वाभाविक भाव दिया गया है।
- source_word: αὐτὸς καὶ Ματταθίας καὶ Ἰούδας καὶ οἱ υἱοὶ αὐτοῦ
  choice: वह अपने पुत्रों मत्तथियाह और यहूदा के साथ
  rationale: नामित व्यक्तियों और ‘उसके पुत्रों’ के संबंध को हिन्दी में स्वाभाविक समानाधिकरण के रूप में व्यक्त किया गया है।
- source_word: ἔτους ἑβδόμου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ सतहत्तरवें वर्ष में
  rationale: यह यूनानी क्रमसूचक अभिव्यक्ति का स्पष्ट और सीधा हिन्दी रूप है; स्रोत में न दी गई कालगणना का नाम नहीं जोड़ा गया।
- source_word: μηνὶ ἐνδεκάτῳ
  choice: ग्यारहवें महीने में
  rationale: मूल का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: Σαβάτ
  choice: शबात
  rationale: यूनानी अक्षरों में लिखे सामी महीने के नाम को हिन्दी पाठकों के लिए प्रचलित बाइबलीय रूप ‘शबात’ में लिप्यंतरित किया गया है।
