lexical_decisions:
- source_word: ἑτέρους
  choice: कुछ और लोगों को
  rationale: यह पहले बताए गए व्यक्तियों से अलग अतिरिक्त लोगों की ओर संकेत करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: किसी उद्देश्य से व्यक्तियों को रवाना करने के लिए सामान्य और गरिमापूर्ण कथात्मक क्रिया।
- source_word: καταλαβέσθαι
  choice: अधिकार करने के लिए
  rationale: सैन्य-राजनीतिक प्रसंग में इसका अर्थ किसी स्थान को बलपूर्वक अपने नियंत्रण में लेना है; यह अनुवाद विधि को अनावश्यक रूप से निश्चित किए बिना उस भाव को व्यक्त करता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रचलित रूप।
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: मन्दिर के पर्वत
  rationale: ὄρος के पर्वत/पहाड़ी और ἱερόν के मन्दिर-पवित्र परिसर संबंध को बनाए रखता है तथा हिन्दी में समझने योग्य है।
