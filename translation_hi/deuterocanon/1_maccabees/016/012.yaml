lexical_decisions:
- source_word: ἦν
  choice: था
  rationale: εἰμί का अपूर्णकाल यहाँ अतीत की सामान्य अवस्था बताता है; हिन्दी में ‘था’ इसका स्वाभाविक रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है; इस छोटे वाक्य में ‘क्योंकि’ उस संबंध को सहज हिन्दी में स्पष्ट रखता है।
- source_word: γαμβρὸς
  choice: दामाद
  rationale: संदर्भ में γαμβρός का सबसे संभावित विशिष्ट अर्थ ‘दामाद’ है, यद्यपि यह व्यापक रूप से विवाह-संबंधी रिश्तेदार को भी सूचित कर सकता है।
- source_word: τοῦ ἀρχιερέως
  choice: महायाजक का
  rationale: यहूदी संदर्भ में ἀρχιερεύς की स्थापित और सटीक हिन्दी उपाधि ‘महायाजक’ है; संबंधकारक रूप को ‘का’ से व्यक्त किया गया है।
