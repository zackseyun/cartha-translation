lexical_decisions:
- source_word: ἀνέβη
  choice: ऊपर आया
  rationale: यह ἀναβαίνω के दिशासूचक अर्थ को सहज हिन्दी में बनाए रखता है; प्रसंग में यूहन्ना गज़ारा से शमौन के पास आता है।
- source_word: Γαζάρων
  choice: गज़ारा
  rationale: यूनानी पाठ के हेलेनीकृत स्थान-नाम को हिन्दी लिपि में प्रस्तुत किया गया है; ‘गेज़ेर’ सम्भव ऐतिहासिक समकक्ष है, पर यहाँ यूनानी साक्ष्य का रूप रखा गया है।
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: क्रिया का अर्थ सूचना या समाचार पहुँचाना है। ‘बताया’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और सैनिक-राजनीतिक प्रसंग में सूचना देने का भाव व्यक्त करता है।
- source_word: συνετέλει
  choice: क्या कर रहा था
  rationale: अपूर्ण भूतकाल ongoing गतिविधि का संकेत देता है। सहज हिन्दी के लिए ‘कर रहा था’ चुना गया है, जबकि योजना को कार्यान्वित करने या पूरा करने का अधिक विशिष्ट भाव पादटिप्पणी में सुरक्षित है।
- source_word: Κενδεβαῖος
  choice: केंदेबियुस
  rationale: व्यक्तिनाम का रूप यूनानी नाम के निकट देवनागरी लिप्यंतरण के रूप में रखा गया है।
