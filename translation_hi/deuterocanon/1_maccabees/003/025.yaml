lexical_decisions:
- source_word: ἤρξατο
  choice: फैलने लगा
  rationale: यह क्रिया किसी अवस्था के आरम्भ को दर्शाती है। φόβος के साथ हिन्दी में ‘भय फैलने लगा’ स्वाभाविक रूप से बताता है कि लोगों में उनका भय उत्पन्न होकर फैलने लगा, जबकि आरम्भ का भाव सुरक्षित रहता है।
- source_word: ὁ φόβος Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: यहूदा और उसके भाइयों का भय
  rationale: 'सम्बन्धकारक पदों की वास्तविक अस्पष्टता बनाए रखी गई है: इसका अर्थ उनसे जुड़ा भय, विशेषतः लोगों में उनका भय, है; इसे ‘उनके द्वारा उत्पन्न आतंक’ कहकर अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।'
- source_word: ἡ πτῶσις
  choice: विनाश
  rationale: πτῶσις का अर्थ पतन, पराजय या विनाश हो सकता है। यहाँ युद्ध-सन्दर्भ में ‘विनाश’ सहज है और केवल शारीरिक रूप से गिरने का भ्रामक अर्थ नहीं देता।
- source_word: ἐπίπτεν
  choice: लगातार टूटने लगा
  rationale: अपूर्ण भूतकालीन रूप चलती या बार-बार घटती कार्रवाई का संकेत देता है। ‘लगातार’ उस पक्ष को स्पष्ट करता है और ‘टूटने लगा’ विपत्ति के किसी पर आ पड़ने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐπὶ τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: उनके आस-पास की जातियों पर
  rationale: ἔθνη यहाँ आसपास के गैर-यहूदी जनसमूहों या राष्ट्रों को सूचित करता है। ‘जातियाँ’ बाइबलीय सन्दर्भ में इस बहुवचन को संक्षेप में रखता है और κύκλῳ αὐτῶν का भौगोलिक भाव भी सुरक्षित है।
