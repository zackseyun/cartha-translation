  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: hi
  text: उसके सभी भाई और वे सभी, जो उसके पिता के साथ हो लिए थे[a], उसकी सहायता करते रहे; और वे आनंद के साथ इस्राएल का युद्ध लड़ते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो उसके पिता से जुड़ गए थे।’ यहाँ आशय उन लोगों से है जो मत्तथियाह के साथ जुड़ गए थे।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे आनंद के साथ इस्राएल के लिए युद्ध करते रहे।’ यूनानी में अधिक शाब्दिक रूप से, ‘वे आनंद के साथ इस्राएल का युद्ध लड़ते रहे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθουν
  choice: सहायता करते रहे
  rationale: अपूर्ण भूतकाल की निरंतर या बार-बार होने वाली सहायक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके सभी भाई
  rationale: संदर्भ में यह मत्तथियाह के पुत्रों, अर्थात यहूदा के वास्तविक भाइयों, का सीधा पारिवारिक उल्लेख है।
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: वे सब भी जो उसके पिता से जुड़ गए थे
  rationale: κολλάω में किसी से निकटता से जुड़ने और उसका साथ अपनाने का भाव है। यह अनुवाद उस चित्र को बनाए रखता है, पर निष्ठा या औपचारिक गठबंधन का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: युद्ध लड़ते रहे
  rationale: यूनानी की सजातीय रचना ‘युद्ध लड़ना’ हिन्दी में भी स्वाभाविक है; अपूर्ण भूतकाल की निरंतरता ‘लड़ते रहे’ से व्यक्त होती है।
- source_word: Ἰσραήλ
  choice: इस्राएल का
  rationale: यूनानी संबंधकारक को सीधे बनाए रखता है और मुख्य पाठ में उसे केवल ‘इस्राएल के लिए’ कहकर व्याख्यायित नहीं करता।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द के साथ
  rationale: εὐφροσύνη के प्रसन्नता, आनन्द और उत्साह के भाव को गरिमापूर्ण तथा सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस्राएल का युद्ध’ का आशय
  choice: इस्राएल का युद्ध
  alternative: इस्राएल के लिए युद्ध
  rationale: मूल संबंधकारक इस संघर्ष को इस्राएल से जोड़ता है, पर संबंध की सटीक प्रकृति को विस्तार से नहीं बताता। सीधे रूप को मुख्य पाठ में रखने से इसे ‘पवित्र युद्ध’ जैसे अतिरिक्त धार्मिक दावे में नहीं बदला जाता; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘सहायता करते रहे’ और ‘लड़ते रहे’ यूनानी अपूर्ण भूतकाल की निरंतरता दिखाते हैं। ‘इस्राएल का युद्ध’ मूल की अर्थगत कसावट और संभावित अस्पष्टता को सुरक्षित रखता है।
