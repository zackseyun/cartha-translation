- source_word: παρέλαβεν
  choice: अपने साथ लिया
  rationale: सैन्य प्रसंग में यह क्रिया साथ ले जाने या अपने अधीन लेकर चलने का भाव देती है; ‘अपने साथ लिया’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: सेना का आधा भाग
  rationale: δυνάμεις यहाँ सैन्य बल का सूचक है। ‘सेना का आधा भाग’ सामान्य पाठक के लिए सहज है और परिमाण को ठीक रखता है।
- source_word: τὰς καταλειφθείσας
  choice: पीछे छोड़ी गई
  rationale: कृदन्त पहले घट चुकी क्रिया बताता है और उन सैनिकों को निर्दिष्ट करता है जिन्हें पहले पीछे छोड़ा गया था।
- source_word: ἀπῆρεν
  choice: निकल पड़ा
  rationale: यात्रा आरम्भ करने वाली इस क्रिया के लिए ‘निकल पड़ा’ कथात्मक हिन्दी में स्वाभाविक और गतिशील है।
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: अपने राज्य के नगर
  rationale: यूनानी पदबंध अन्ताकिया की समानाधिकरणीय पहचान देता प्रतीत होता है। यह अनुवाद मूल के निकट रहते हुए ‘राजधानी’ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ सैंतालीसवें वर्ष में
  rationale: यूनानी संख्या-विन्यास को स्वाभाविक हिन्दी क्रम में प्रस्तुत किया गया है।
- source_word: διεπέρασεν
  choice: पार की
  rationale: नदी को पार करने की क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τὸν Εὐφράτην ποταμόν
  choice: फ़रात नदी
  rationale: प्रचलित हिन्दी बाइबलीय भौगोलिक नाम और स्वाभाविक हिन्दी शब्दक्रम अपनाया गया है।
- source_word: διεπορεύετο
  choice: यात्रा करता गया
  rationale: अपूर्ण भूतकाल निरन्तर आगे बढ़ने का भाव देता है; ‘करता गया’ उस प्रगतिशीलता को व्यक्त करता है।
- source_word: τὰς ἐπάνω χώρας
  choice: ऊपरी प्रदेशों
  rationale: शाब्दिक भौगोलिक अभिव्यक्ति रखी गई है; सम्भावित अर्थ ‘भीतरी’ या ‘ऊपरी प्रान्त’ पादटिप्पणी में दिए गए हैं।
