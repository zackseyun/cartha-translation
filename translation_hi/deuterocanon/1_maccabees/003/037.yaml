base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: hi
  text: और राजा ने पीछे छोड़ी गई सेना का आधा भाग अपने साथ लिया और अपने राज्य के नगर अन्ताकिया[a] से, एक सौ सैंतालीसवें वर्ष में[b], निकल पड़ा। फिर उसने फ़रात नदी पार की और ऊपरी प्रदेशों[c] से होकर यात्रा करता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्ताकिया, जो उसके राज्य का राजनगर था।” यूनानी पदबंध अन्ताकिया को राजा के राजकीय अथवा राजधानी नगर के रूप में पहचान सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् सेल्यूकिड संवत् का एक सौ सैंतालीसवाँ वर्ष।
    reason: cultural_note
  - marker: c
    text: या, “ऊपरी प्रान्तों” अथवा “भीतरी प्रदेशों।” सम्भवतः फ़रात के पूर्व के भूभाग अभिप्रेत हैं।
    reason: lexical_alternative
