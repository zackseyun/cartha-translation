  text: and to settle foreigners throughout all their territories[a], and to distribute their land by lot.
translation:
  language: hi
  text: और उनके सभी प्रदेशों में परदेशी पुत्रों[a] को बसाना और उनकी भूमि चिट्ठी डालकर बाँट देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “परदेशियों को।” यूनानी में शाब्दिक रूप से “परदेशी पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίσαι
  choice: बसाना
  rationale: यह क्रिया लोगों को किसी स्थान में निवासी बनाकर स्थापित करने का कारणवाचक भाव व्यक्त करती है; ‘बसाना’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: υἱοὺς ἀλλοτρίους
  choice: परदेशी पुत्रों
  rationale: यूनानी पदबंध में पुरुषवाचक ‘पुत्रों’ स्पष्ट रूप से उपस्थित है। मुख्य पाठ उसका रूप बनाए रखता है, जबकि पादटिप्पणी प्रसंगानुसार अधिक मुहावरेदार अर्थ ‘परदेशियों’ बताती है।
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: उनके सभी प्रदेशों में
  rationale: ὅρια यहाँ केवल सीमा-रेखाओं के बजाय उनके अधिकार-क्षेत्रों के पूरे विस्तार को सूचित करता है; ‘प्रदेशों’ से यह स्थानगत अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: κατακληρονομῆσαι
  choice: चिट्ठी डालकर बाँट देना
  rationale: इस क्रिया में भूमि को विरासत के अंशों के रूप में, प्रायः चिट्ठी द्वारा, आवंटित करने का भाव है। यह अनुवाद केवल सामान्य विभाजन न बताकर चिट्ठी से हिस्से ठहराने की विशेषता सुरक्षित रखता है।
- source_word: τὴν γῆν αὐτῶν
  choice: उनकी भूमि
  rationale: यह पद विस्थापित किए जाने वाले लोगों की भूमि को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: υἱοὺς ἀλλοτρίους में पुरुषवाचक संज्ञा का अनुवाद
  choice: परदेशी पुत्रों
  alternative: परदेशियों को
  rationale: यह कोई प्रमुख धर्मसैद्धांतिक विवाद नहीं है, फिर भी यूनानी में ‘पुत्रों’ का स्पष्ट पुरुषवाचक रूप है। उसे मुख्य पाठ में रखा गया है और पदबंध का सामान्य प्रसंगगत अर्थ पादटिप्पणी में दिया गया है, ताकि न तो स्रोत का रूप मिटे और न पाठक अर्थ को गलत समझे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परदेशी पुत्रों’ की स्रोत-सन्निकट अभिव्यक्ति को पादटिप्पणी से स्पष्ट किया गया है; वाक्य का infinitival स्वरूप पूर्ववर्ती प्रसंग से जुड़ी योजना या उद्देश्य की निरंतरता बनाए रखता है।
