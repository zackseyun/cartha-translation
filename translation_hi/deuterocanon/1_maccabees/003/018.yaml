  yaml_path: translation/deuterocanon/1_maccabees/003/018.yaml
  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: hi
  text: और यहूदा ने कहा, “बहुत-से लोगों का थोड़े-से लोगों के हाथों में फँस जाना आसान है[a], और स्वर्ग की दृष्टि में बहुतों के द्वारा या थोड़े-से लोगों के द्वारा बचाने में कोई अंतर नहीं है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से लोगों का थोड़े-से लोगों के हाथों में सौंप दिया जाना आसान है।” यूनानी क्रिया का शाब्दिक अर्थ बंद या घेर दिया जाना है; यहाँ आशय कुछ लोगों की शक्ति में फँस जाने से है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “स्वर्ग” संभवतः परमेश्वर के लिए श्रद्धासूचक परोक्ष अभिव्यक्ति है; अर्थ “परमेश्वर की दृष्टि में” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν
  choice: आसान है
  rationale: 'विशेषण ἐστιν के साथ निर्वैयक्तिक कथन बनाता है: कोई बात सहज या आसानी से हो सकती है। आधुनिक हिन्दी में ‘आसान है’ इसका स्वाभाविक और सीधा रूप है।'
- source_word: συγκλεισθῆναι
  choice: घिर जाना
  rationale: निष्क्रिय क्रिया का मूल भाव बंद कर दिए जाने या चारों ओर से घेर लिए जाने का है। युद्ध-संदर्भ में ‘घिर जाना’ स्वाभाविक हिन्दी है और दूसरे की शक्ति में फँसने का आशय भी बनाए रखता है।
- source_word: πολλοὺς ... ἐν χερσὶν ὀλίγων
  choice: बहुतों का थोड़े लोगों के हाथों में
  rationale: ‘बहुतों’ और ‘थोड़ों’ का केंद्रीय विरोध सुरक्षित रखा गया है। ‘हाथों में’ किसी की शक्ति या अधिकार में पड़ने का स्रोत-रूपक बनाए रखता है।
- source_word: διαφορὰ
  choice: अंतर
  rationale: οὐκ ἔστι διαφορὰ का स्पष्ट और सामान्य हिन्दी रूप ‘कोई अंतर नहीं है’ है; ‘लाभ’ कहना अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: स्वर्ग की दृष्टि में
  rationale: यूनानी में स्पष्ट रूप से ‘स्वर्ग’ है। ‘की दृष्टि में’ उपस्थिति या सम्मुख होने के मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और श्रद्धासूचक परोक्ष संकेत को खुलकर ‘परमेश्वर’ नहीं बनाता।
- source_word: σῴζειν
  choice: बचाने
  rationale: क्रिया का अर्थ बचाना या छुड़ाना है। युद्ध-संदर्भ में इसमें विजय द्वारा छुटकारा सम्मिलित है, पर ‘बचाने’ से इसका व्यापक धार्मिक अर्थ और यूनानी की अनिर्दिष्ट कर्म-संरचना बनी रहती है।
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: बहुतों के द्वारा या थोड़े लोगों के द्वारा
  rationale: यहाँ ἐν साधन का भाव व्यक्त कर सकता है। ‘के द्वारा’ बताता है कि बचाव बहुतों अथवा थोड़ों को माध्यम बनाकर हो सकता है।
theological_decisions:
- issue: ἐναντίον τοῦ οὐρανοῦ में ‘स्वर्ग’ का श्रद्धासूचक प्रयोग
  choice: मुख्य पाठ में ‘स्वर्ग’ बनाए रखा गया
  alternative: परमेश्वर की दृष्टि में
  rationale: मूल यूनानी ‘स्वर्ग’ कहता है, जो संभवतः परमेश्वर के लिए श्रद्धासूचक परोक्ष अभिव्यक्ति है। इसे ‘परमेश्वर’ कर देने से निहित संकेत स्पष्ट व्याख्या में बदल जाता; इसलिए मूल की अभिव्यक्ति और उसका तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घिर जाना’ युद्ध-संदर्भ में स्वाभाविक है, जबकि ‘हाथों में’ मूल रूपक को बचाता है। ‘स्वर्ग’ को मूल के अनुरूप बनाए रखा गया है।
