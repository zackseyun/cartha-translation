  text: And he left Lysias, an honored man and of the royal family, over the affairs of the king, from the Euphrates River as far as the borders of Egypt,
translation:
  language: hi
  text: और उसने लूसियास को—जो एक प्रतिष्ठित व्यक्ति और राजवंश का सदस्य था—फरात नदी से लेकर मिस्र की सीमाओं तक राजा के राज्य-कार्यों का प्रभारी छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: प्रभारी छोड़ दिया
  rationale: संदर्भ में इसका अर्थ केवल पीछे छोड़ना नहीं, बल्कि अधिकार सौंपकर नियुक्त करना है।
- source_word: ἄνθρωπον ἔνδοξον
  choice: एक प्रतिष्ठित व्यक्ति
  rationale: ἔνδοξος सम्मानित, प्रतिष्ठित या विख्यात व्यक्ति को दर्शाता है; यहाँ पद और सामाजिक मान का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀπὸ γένους τῆς βασιλείας
  choice: राजवंश का सदस्य
  rationale: शाब्दिक 'राज्य/राजसत्ता के वंश से' को स्वाभाविक हिन्दी में व्यक्त करता है और वास्तविक राजकीय पारिवारिक संबंध के दावे को बनाए रखता है।
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  choice: राजा के राज्य-कार्यों का प्रभारी
  rationale: πράγματα यहाँ राजा के प्रशासनिक या राजकीय मामलों को सूचित करता है; 'राज्य-कार्य' उस दायरे को स्पष्ट रखते हुए अनावश्यक विस्तार से बचता है।
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  choice: फरात नदी से लेकर मिस्र की सीमाओं तक
  rationale: भौगोलिक अधिकार-क्षेत्र को मूल पाठ के क्रम और विस्तार के अनुसार प्रस्तुत करता है।
