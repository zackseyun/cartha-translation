  text: और देख, राष्ट्र हमें नष्ट कर देने के लिए हमारे विरुद्ध इकट्ठे हो गए हैं[a]; तू जानता है कि वे हमारे विरुद्ध क्या योजनाएँ बना रहे हैं[b]।
  philosophy: optimal-equivalence
