  - marker: b
    text: या, ‘वे हमारे विरुद्ध क्या युक्तियाँ कर रहे हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह संबोधन की तात्कालिकता और ध्यान आकर्षित करने वाले यूनानी अव्यय का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: τὰ ἔθνη
  choice: जातियाँ
  rationale: यह आसपास के गैर-यहूदी राष्ट्रों/लोगों को सूचित करता है और धार्मिक रूप से अधिक पारिभाषिक ‘अन्यजाति’ की अपेक्षा यूनानी की व्यापकता बनाए रखता है।
- source_word: συνῆκται ἐφʼ ἡμᾶς
  choice: हमारे विरुद्ध इकट्ठी हो गई हैं
  rationale: पूर्णकाल से उत्पन्न वर्तमान स्थिति और प्रसंग के शत्रुतापूर्ण आशय दोनों को व्यक्त करता है।
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: हमें मिटा देने के लिए
  rationale: उद्देश्यवाचक रचना तथा किसी समुदाय को पूरी तरह हटा या नष्ट कर देने की प्रबल धमकी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σὺ οἶδας
  choice: यह तू जानता है
  rationale: परमेश्वर को किए गए सीधे एकवचन संबोधन को सरल और गरिमापूर्ण रूप में रखता है।
- source_word: ἃ λογίζονται ἐφʼ ἡμᾶς
  choice: वे हमारे विरुद्ध क्या-क्या योजनाएँ बना रही हैं
  rationale: λογίζονται यहाँ केवल सोचने के बजाय शत्रुतापूर्ण विचार या योजना बनाने का बोध देता है; ‘क्या-क्या’ अनिर्दिष्ट बहुविध आशयों को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: यहूदी युद्ध-प्रार्थना में τὰ ἔθνη का संकेत
  choice: जातियाँ
  alternative: अन्यजातियाँ / राष्ट्र
  rationale: यहाँ सैन्य-राजनीतिक विरोध प्रमुख है। ‘जातियाँ’ मूल की व्यापकता को रखता है और बाद के पारिभाषिक धार्मिक अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
