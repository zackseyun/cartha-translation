base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: hi
  text: और यहूदा ने कहा, “कमर कस लो और वीर पुरुष बनो[a]। सुबह इन जातियों से लड़ने के लिए तैयार रहो, जो हमें और हमारी पवित्र वस्तुओं[b] को नष्ट करने के लिए हमारे विरुद्ध इकट्ठी हुई हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शक्तिशाली पुरुष बनो”; यूनानी में शाब्दिक रूप से “बलवान पुत्र बनो।”
    reason: lexical_alternative
  - marker: b
    text: या “हमारे पवित्रस्थान”; यूनानी में बहुवचन “हमारी पवित्र वस्तुएँ” है, जो पवित्र वस्तुओं या पवित्र परिसर को व्यापक रूप से सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Περιζώσασθε
  choice: कमर कस लो
  rationale: मध्यवाच्य आज्ञार्थक का शाब्दिक बिंब और युद्ध की तैयारी का भाव दोनों इस स्वाभाविक हिन्दी मुहावरे में सुरक्षित रहते हैं।
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: वीर पुरुष बनो
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘बलवान पुत्र बनो’ है, पर यह सामी-प्रभावित मुहावरा साहसी और समर्थ योद्धा बनने का आह्वान करता है। ‘वीर पुरुष’ उसके पुरुषवाची और युद्ध-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕτοιμοι
  choice: तैयार
  rationale: सैन्य प्रसंग में यह सीधा, स्पष्ट और आधुनिक हिन्दी का स्वाभाविक शब्द है।
- source_word: εἰς τὸ πρωῒ
  choice: सुबह
  rationale: आने वाली सुबह को लड़ाई की तैयारी और युद्ध का समय बताता है; यह न्यूनतम व्याख्यात्मक अनुवाद है।
- source_word: πολεμῆσαι
  choice: लड़ने
  rationale: क्रिया के सैन्य अर्थ को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἔθνεσιν
  choice: जातियों
  rationale: यहाँ शब्द यहूदिया के विरोध में खड़े विदेशी जनसमूहों के लिए है। ‘जातियाँ’ स्रोत की बहुवचन व्यापकता रखता है; ‘अन्यजाति’ तत्काल प्रसंग से अधिक धार्मिक-जातीय विशिष्टता जोड़ सकता था।
- source_word: ἐπισυνηγμένοις
  choice: इकट्ठी हुई हैं
  rationale: पूर्ण कृदंत विरोधी समूहों के एकत्र हो चुके होने और उस परिणामी स्थिति को दिखाता है।
- source_word: ἐξᾶραι
  choice: नष्ट करने
  rationale: युद्ध के प्रसंग में हटाने या मिटा देने का आशय विनाश है; ‘नष्ट करने’ स्पष्ट और गरिमापूर्ण है।
- source_word: τὰ ἅγια ἡμῶν
  choice: हमारी पवित्र वस्तुओं
  rationale: नपुंसकलिंग बहुवचन को व्यापक रखा गया है, ताकि पवित्र वस्तुओं, पवित्र परिसर अथवा पवित्रस्थान में से किसी एक अर्थ को अनावश्यक रूप से निश्चित न किया जाए।
theological_decisions:
- issue: γίνεσθε εἰς υἱοὺς δυνατούς में पुरुषवाची सामी मुहावरा
  choice: मुख्य पाठ में ‘वीर पुरुष बनो’
  alternative: ‘बलवान पुत्र बनो’ अथवा ‘शक्तिशाली पुरुष बनो’
  rationale: ‘पुत्र’ यूनानी का शाब्दिक रूप है, किंतु हिन्दी में यहाँ अस्वाभाविक और संभावित रूप से भ्रामक होगा। ‘वीर पुरुष’ मूल के पुरुषवाची स्वरूप और युद्ध-संबंधी साहस दोनों को सुरक्षित रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: τὰ ἅγια ἡμῶν का संदर्भ
  choice: ‘हमारी पवित्र वस्तुओं’ के रूप में बहुवचन और व्यापक अनुवाद
  alternative: ‘हमारे पवित्रस्थान’
  rationale: यूनानी बहुवचन पवित्र वस्तुओं, पवित्र परिसर या समूचे पवित्रस्थान की ओर संकेत कर सकता है। मुख्य पाठ उस अस्पष्टता को संकुचित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘कमर कस लो’ मूल के सजीव सैन्य बिंब को बचाता है। ‘जातियों’ और ‘पवित्र वस्तुओं’ जैसे स्रोत-समीप शब्दों के साथ आवश्यक अर्थभेद पादटिप्पणियों में स्पष्ट किए गए हैं।
