  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: hi
  text: जब राजा अन्तियोकस ने ये बातें सुनीं, तो वह क्रोध से भड़क उठा। उसने संदेश भेजे और अपने राज्य की सारी सेनाएँ इकट्ठी कीं, जिससे एक अत्यन्त शक्तिशाली सैन्य-छावनी बनी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब ... तो
  rationale: यह अगले घटनाक्रम को समय-सूचक ढंग से जोड़ता है; हिन्दी में ‘जब ... तो’ स्वाभाविक कथात्मक रचना है।
- source_word: Ἀντίοχος ὁ βασιλεὺς
  choice: राजा अन्तियोकुस
  rationale: उपाधि और नाम को आधुनिक मानक हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι यहाँ कही या सुनाई गई बातों अथवा समाचार की ओर संकेत कर सकता है; ‘ये बातें’ मूल की व्यापकता बनाए रखता है।
- source_word: ὠργίσθη θυμῷ
  choice: क्रोध से भड़क उठा
  rationale: क्रोध-सूचक क्रिया और θυμός का संयुक्त प्रबल भाव इस मुहावरे से स्पष्ट होता है, बिना अस्वाभाविक पुनरुक्ति के।
- source_word: ἀπέστειλεν καὶ συνήγαγεν
  choice: आदेश भेजकर ... इकट्ठी कर लीं
  rationale: ἀπέστειλεν का कर्म यूनानी में व्यक्त नहीं है; सैन्य-संग्रह के प्रसंग में हिन्दी का यह रूप भेजने और सेनाएँ जुटाने की क्रमिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: अपने राज्य की सारी सेनाएँ
  rationale: δυνάμεις इस सैन्य प्रसंग में अमूर्त ‘शक्तियों’ के बजाय सैन्य बलों को दर्शाता है।
- source_word: παρεμβολὴν ἰσχυρὰν σφόδρα
  choice: एक अत्यन्त शक्तिशाली सैन्य-छावनी
  rationale: παρεμβολή छावनी या छावनी में पड़ी सेना दोनों का बोध करा सकता है; ‘सैन्य-छावनी’ मुख्य अर्थ को स्पष्ट करता है और ‘अत्यन्त शक्तिशाली’ ἰσχυράν σφόδρα की तीव्रता बनाए रखता है।
