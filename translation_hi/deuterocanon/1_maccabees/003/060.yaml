  text: As his will is in heaven[a], so he will do.
translation:
  language: hi
  text: और स्वर्ग में जैसी उसकी इच्छा हो[a], वह वैसा ही करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा अधिक विस्तार से: “स्वर्ग में उसकी इच्छा जो भी हो, वही वह करेगा।”'
    reason: ὡς ... ἂν ᾖ में तुलना के साथ अनिश्चितता का भाव है; यह वैकल्पिक रूप उस भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: फिर भी, ... जैसी ... हो
  rationale: δέ पिछले कथन से हल्का विरोध या संक्रमण दिखाता है, इसलिए ‘फिर भी’ स्वाभाविक है। ὡς ... ἂν ᾖ में तुलना के साथ अनिश्चितता का भाव है, जिसे विधिलिंग-सदृश ‘जैसी ... हो’ बनाए रखता है।
- source_word: θέλημα
  choice: इच्छा
  rationale: यहाँ θέλημα किसी की मंशा या इच्छा को दर्शाता है। ‘इच्छा’ सरल, स्वाभाविक और धर्मवैज्ञानिक रूप से तटस्थ है।
- source_word: ἐν οὐρανῷ
  choice: स्वर्ग में
  rationale: यूनानी एकवचन का सीधा और प्रचलित हिन्दी रूप ‘स्वर्ग में’ है।
- source_word: οὕτως
  choice: वैसा ही
  rationale: यह आरम्भिक ὡς के साथ ‘जैसी ... वैसा ही’ का सहसंबंध बनाता है और यूनानी तुलना को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: ποιήσει
  choice: वह ... करेगा
  rationale: क्रिया सक्रिय, भविष्यकाल और तीसरे पुरुष एकवचन में है। ‘करेगा’ उसकी सरलता बनाए रखता है और कोई अनुल्लिखित कर्म नहीं जोड़ता।
theological_decisions:
- issue: ποιήσει का निहित कर्ता
  choice: वह ... करेगा
  alternative: ऐसा किया जाएगा
  rationale: यूनानी क्रिया सक्रिय रूप में है और उसका निहित कर्ता पुल्लिंग एकवचन है; इसलिए व्यक्तिगत कर्तृत्व को रखा गया है, पर इस पद में उसका नाम जोड़कर उसे आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- issue: θέλημα के साथ निहित संबंध
  choice: उसकी इच्छा
  alternative: इच्छा
  rationale: यूनानी में अधिकारसूचक सर्वनाम स्पष्ट रूप से नहीं है, पर प्रसंग और अगली क्रिया के निहित कर्ता से यह उसी की इच्छा समझी जाती है। मुख्य पाठ में ‘उसकी’ स्वाभाविक हिन्दी के लिए रखा गया है, जबकि पादटिप्पणी विस्तृत वैकल्पिक अभिव्यक्ति देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जैसी ... वैसा ही’ यूनानी सहसंबंध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘फिर भी’ δέ के प्रसंगगत विरोध को बनाए रखता है।
