lexical_decisions:
- source_word: ὡμοιώθη
  choice: के समान था
  rationale: यह निष्क्रिय क्रिया यहाँ रूपांतरण नहीं, बल्कि उपमा व्यक्त करती है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: Λέοντι
  choice: सिंह
  rationale: दत्तिव रूप तुलना के विषय को दिखाता है; ‘सिंह के समान’ हिन्दी की स्वाभाविक उपमा है।
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: अपने कामों में
  rationale: ἔργα से उसके किए हुए कार्य, विशेषकर वीरतापूर्ण कारनामे, अभिप्रेत हैं। ‘कामों’ का प्रयोग आधुनिक पाठक के लिए सहज है और मूल की व्यापकता बनाए रखता है।
- source_word: σκύμνος
  choice: सिंह-शावक
  rationale: यह शब्द छोटे या युवा सिंह को सूचित करता है। ‘सिंह-शावक’ पहले आए ‘सिंह’ से भेद बनाए रखते हुए पशु-चित्र को स्पष्ट करता है।
- source_word: ἐρυγόμενος
  choice: गरजते हुए
  rationale: कृदंत सिंह की शिकारी गर्जना का सजीव वर्णन करता है; हिन्दी में ‘गरजना’ इसका स्वाभाविक समतुल्य है।
- source_word: εἰς θήραν
  choice: शिकार के लिए
  rationale: वाक्यांश शिकार की दिशा या उद्देश्य बताता है; यह अनुवाद मूल की संक्षिप्तता और प्रयोजन दोनों को बनाए रखता है।
