  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: hi
  text: उनके विरुद्ध एक सैन्य-दल भेजने के लिए—इस्राएल की शक्ति और यरूशलेम के शेष को कुचलने और हटा देने के लिए, और उस स्थान से उसका स्मरण मिटा देने के लिए[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी स्मृति’, अथवा ‘उसका स्मारक’।
    reason: μνημόσυνον का अर्थ ‘स्मरण/स्मृति’ हो सकता है और यह किसी स्मारक या यादगार वस्तु का भी संकेत कर सकता है।
lexical_decisions:
- source_word: ἀποστεῖλαι ἐπʼ αὐτοὺς δύναμιν
  choice: उनके विरुद्ध एक सैन्य-दल भेजने के लिए
  rationale: सैन्य प्रसंग में δύναμις अमूर्त ‘शक्ति’ नहीं, सशस्त्र बल है। ‘सैन्य-दल’ उसका अर्थ स्पष्ट करता है, पर उसे अनिवार्य रूप से पूरी ‘सेना’ नहीं ठहराता।
- source_word: τοῦ ἐκρίψαι καὶ ἐξᾶραι
  choice: कुचलकर मिटा दे
  rationale: दोनों क्रियाओं में हिंसक पराजय और उसके बाद हटाकर समाप्त करने का संयुक्त भाव है। हिन्दी में ‘कुचलकर मिटा देना’ दोनों चरणों को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: इस्राएल की शक्ति
  rationale: ἰσχύς का सीधा अर्थ ‘शक्ति’ या ‘सामर्थ्य’ है; ‘शक्ति’ मूल संबंध-संरचना को बनाए रखता है।
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: यरूशलेम के बचे हुए अंश
  rationale: κατάλιμμα केवल जीवित बचे लोगों तक सीमित नहीं है, बल्कि जो कुछ बचा है उस व्यापक शेष को बता सकता है। ‘बचा हुआ अंश’ इसी व्यापकता को सुरक्षित रखता है।
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: उसका स्मरण भी मिटा दे
  rationale: μνημόσυνον ‘स्मरण’, ‘स्मृति’ या ‘स्मारक’ हो सकता है। यहाँ शत्रुतापूर्ण उद्देश्य किसी की याद तक समाप्त करना है; ‘स्मरण मिटा देना’ स्वाभाविक हिन्दी है और ठोस स्मारक का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: ἀπὸ τοῦ τόπου
  choice: उस स्थान से
  rationale: यूनानी पद का शाब्दिक भाव ‘उस/निर्दिष्ट स्थान से’ है। यह अनुवाद स्थान के संदर्भ को खुला रखता है।
theological_decisions:
- issue: ‘यरूशलेम के बचे हुए अंश’ का दायरा
  choice: इसे व्यापक सामूहिक शेष के रूप में रखा गया है।
  alternative: ‘यरूशलेम के बचे हुए लोग’
  rationale: मूल κατάλιμμα व्यक्तियों के साथ-साथ नगर या उससे संबद्ध समुदाय के बचे हुए भाग को भी सूचित कर सकता है; केवल ‘लोग’ कहना अर्थ को संकरा कर देता।
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसका’ रखकर संदर्भ की मूल अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘इस्राएल का’ या ‘यरूशलेम का’ स्पष्ट कर देना
  rationale: यूनानी एकवचन सर्वनाम का संदर्भ इस्राएल, यरूशलेम अथवा अभी उल्लिखित सामूहिक शेष से जोड़ा जा सकता है। मूल पाठ जिसको स्पष्ट नहीं करता, अनुवाद भी उसे मनमाने ढंग से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यह वाक्य पिछले पद से जुड़ा उद्देश्यसूचक खंड है, इसलिए आरंभ और अंत में उसकी खंडात्मक संरचना बनाए रखी गई है।
