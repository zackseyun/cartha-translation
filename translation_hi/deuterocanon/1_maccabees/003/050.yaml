lexical_decisions:
- source_word: ἐβόησαν
  choice: पुकारकर
  rationale: यह क्रिया ज़ोरदार और तात्कालिक पुकार को व्यक्त करती है; प्रसंग में यह प्रार्थनापूर्ण गुहार है।
- source_word: φωνῇ
  choice: ऊँचे स्वर से
  rationale: βοάω के साथ यह पद पुकार की तीव्रता पर बल देता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: यह पुकार की दिशा बताता है। इससे प्रार्थना का आशय बना रहता है, पर मूल पाठ में अनुपस्थित ‘परमेश्वर’ को स्पष्ट रूप से नहीं जोड़ा जाता।
- source_word: Τί ποιήσωμεν
  choice: हम ... क्या करें
  rationale: विचारात्मक संभावनार्थक रूप अनिश्चितता और तत्काल निर्णय की आवश्यकता व्यक्त करता है।
- source_word: τούτοις
  choice: इनका
  rationale: सर्वनाम का संकेत मूल की तरह संदर्भ-निर्भर और अनिर्दिष्ट रखा गया है; ‘इनका क्या करें’ सहज हिन्दी है।
- source_word: ἀπαγάγωμεν
  choice: ले जाएँ
  rationale: यह वर्तमान स्थान से किसी दूसरी जगह ले जाने का भाव देता है; ‘ले जाएँ’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: पुकार का निहित संबोधन
  choice: ‘स्वर्ग की ओर’ को बनाए रखा गया
  alternative: ‘स्वर्ग में परमेश्वर से’ या ‘प्रभु से’
  rationale: यूनानी पाठ सीधे स्वर्ग का उल्लेख करता है, परमेश्वर का नहीं। प्रसंग प्रार्थना का संकेत देता है, फिर भी अनकहे संबोधन को स्पष्ट करके जोड़ना उचित नहीं।
