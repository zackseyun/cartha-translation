  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: hi
  text: वे इकट्ठे हुए और यरूशलेम के सामने स्थित मिस्पा[a] में आए, क्योंकि पूर्वकाल में मिस्पा इस्राएल के लिए प्रार्थना का स्थान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यरूशलेम के सम्मुख।’ यूनानी अभिव्यक्ति मिस्पा की यरूशलेम के सामने या उसकी ओर स्थित होने का संकेत देती है।
    reason: स्थानिक अभिव्यक्ति κατέναντι की ‘सामने/सम्मुख’ अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: συνήχθησαν
  choice: वे इकट्ठे हुए
  rationale: यह रूप प्रसंग में सामूहिक रूप से एकत्र होने की क्रिया बताता है; ‘इकट्ठे हुए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἦλθοσαν εἰς Μασσηφὰ
  choice: मिस्पा में आए
  rationale: εἰς गंतव्य को सूचित करता है; ‘में आए’ कथा में आगमन को सहज हिन्दी में व्यक्त करता है। Μασσηφά के लिए प्रचलित बाइबलीय स्थान-नाम ‘मिस्पा’ रखा गया है।
- source_word: κατέναντι Ἰερουσαλήμ
  choice: यरूशलेम के सामने स्थित
  rationale: κατέναντι का स्थानिक अर्थ ‘सामने/आमने-सामने’ है। ‘स्थित’ जोड़ने से हिन्दी में यह स्पष्ट होता है कि वाक्यांश मिस्पा की स्थिति बता रहा है, केवल दिशा नहीं।
- source_word: τόπος προσευχῆς
  choice: प्रार्थना का स्थान
  rationale: यह अभिव्यक्ति किसी ऐसे स्थान को बताती है जो प्रार्थना से जुड़ा था; इससे आराधनालय, पवित्रस्थान या वेदी जैसी अधिक विशिष्ट संस्था नहीं जोड़ी जाती।
- source_word: τὸ πρότερον
  choice: पहले
  rationale: यह पहले के समय का संकेत देता है; ‘पहले’ साधारण आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के लिए
  rationale: सम्प्रदान कारक यहाँ सम्बन्ध या हित का भाव देता है और इस्राएल को सामूहिक प्रजा के रूप में बनाए रखता है।
theological_decisions:
- issue: मिस्पा में प्रार्थना-स्थल का स्वरूप
  choice: ‘प्रार्थना का स्थान’
  alternative: ‘प्रार्थना-गृह’ या ‘आराधना का स्थान’
  rationale: यूनानी पाठ केवल प्रार्थना से जुड़े स्थान की बात करता है। किसी विशेष संस्था, भवन, बलिदान-व्यवस्था या उपासना-पद्धति का संकेत जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इकट्ठे हुए’, ‘में आए’ और ‘पहले’ सामान्य पाठकों के लिए स्पष्ट हैं; स्थान-नाम ‘मिस्पा’ और जातीय नाम ‘इस्राएल’ प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
