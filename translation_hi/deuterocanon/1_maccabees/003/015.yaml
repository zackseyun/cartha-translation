  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: hi
  text: और अधर्मियों की एक शक्तिशाली सेना[a] भी उसके साथ आ मिली और उसके साथ चढ़ गई, ताकि उसकी सहायता करे और इस्राएल के पुत्रों पर प्रतिशोध ले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्मियों की एक शक्तिशाली छावनी।” यूनानी शब्द का अर्थ छावनी या सेना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों में प्रतिशोध करे”; यहाँ आशय इस्राएल के विरुद्ध दंडात्मक कार्रवाई से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: उसके साथ आ मिली
  rationale: मध्यवाच्य रूप यहाँ पहले से उपस्थित सैन्यबल में एक और दल के जुड़ने का भाव देता है। हिन्दी में ‘साथ आ मिली’ स्वाभाविक है और निष्क्रिय ‘जोड़ी गई’ की असहजता से बचता है।
- source_word: ἀνέβη
  choice: चढ़ गई
  rationale: यह ἀναβαίνω के दिशात्मक भाव को बनाए रखता है; प्रसंग से सैन्य कूच स्पष्ट है, इसलिए ‘आक्रमण किया’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: παρεμβολὴ
  choice: सेना
  rationale: शब्द का अर्थ ‘छावनी’ अथवा ‘सेना/सैन्यदल’ हो सकता है। यहाँ उसके साथ चढ़ने और सहायता करने वाला मानवीय सैन्यबल अभिप्रेत है, इसलिए मुख्य पाठ में ‘सेना’ अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀσεβῶν
  choice: अधर्मियों
  rationale: यह केवल सामान्य दुष्टता नहीं, बल्कि परमेश्वर और पवित्र व्यवस्था के प्रति अनादर का धार्मिक-नैतिक रंग भी व्यक्त करता है। ‘अधर्मी’ आधुनिक हिन्दी में सुबोध और गरिमापूर्ण है।
- source_word: ἰσχυρὰ
  choice: शक्तिशाली
  rationale: यह सैन्यदल की सामर्थ्य बताता है और ἰσχυρά का सीधा, स्वाभाविक हिन्दी समतुल्य है।
- source_word: βοηθῆσαι αὐτῷ
  choice: उसकी सहायता करे
  rationale: अनंत क्रिया उद्देश्य व्यक्त करती है। ‘सहायता करे’ सटीक और गरिमापूर्ण है।
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: प्रतिशोध ले
  rationale: यह मुहावरा दंडात्मक बदला चुकाने या प्रतिशोध करने का भाव देता है। ‘प्रतिशोध ले’ अर्थ की तीव्रता को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: इस्राएल के पुत्रों पर
  rationale: शत्रुतापूर्ण क्रिया के इस प्रसंग में ἐν का लक्ष्यगत अर्थ ‘पर/विरुद्ध’ है। ‘इस्राएल के पुत्र’ मूल की पारंपरिक जातीय-वाचक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: सैन्य-राजनीतिक प्रसंग में ἀσεβῶν का अनुवाद
  choice: अधर्मियों
  alternative: दुष्टों; भक्तिहीनों
  rationale: ‘अधर्मियों’ में नैतिक बुराई के साथ परमेश्वर और उसकी व्यवस्था के प्रति अनादर का संकेत भी बना रहता है, पर इसमें बाद की कोई विशिष्ट सांप्रदायिक श्रेणी आरोपित नहीं होती।
- issue: υἱοῖς Ἰσραήλ की जातीय-वाचक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल के लोगों
  rationale: मूल यूनानी में ‘पुत्र’ स्पष्ट है और यह बाइबलीय जातीय/वाचा-संबंधी पदबंध है। इसलिए इसे तटस्थ सामूहिक पद में विलीन नहीं किया गया।
- issue: ἐκδίκησις की दंडात्मक तीव्रता
  choice: प्रतिशोध
  alternative: दंड; बदला
  rationale: ‘प्रतिशोध’ मूल के प्रत्युत्तरात्मक और दंडात्मक भाव को सुरक्षित रखता है, बिना इस कार्य को नैतिक रूप से उचित ठहराए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘सेना’ और ‘उसके साथ आ मिली’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘चढ़ गई,’ ‘प्रतिशोध,’ और ‘इस्राएल के पुत्र’ मूल की दिशात्मक, दंडात्मक और पारंपरिक बाइबलीय भाषा को बनाए रखते हैं।
