translation:
  language: hi
  text: 'इसके बाद यहूदा ने लोगों के अगुए नियुक्त किए: हज़ार लोगों के अधिकारी, सौ लोगों के अधिकारी, पचास लोगों के अधिकारी और दस लोगों के अधिकारी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: इसके बाद
  rationale: यह यूनानी वाक्यांश के कालक्रम को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατέστησεν
  choice: नियुक्त किए
  rationale: यहाँ क्रिया व्यक्तियों को उत्तरदायित्व अथवा पद सौंपे जाने का अर्थ देती है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: Ἰούδας का हिन्दी बाइबलीय नामरूप 'यहूदा' है और इस यहूदी ऐतिहासिक संदर्भ में स्वाभाविक है।
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: लोगों के अगुए
  rationale: यह व्यापक नेतृत्व-संज्ञा को बनाए रखता है; इसके बाद आने वाले पद स्पष्ट करते हैं कि यहाँ सैन्य संगठन अभिप्रेत है।
- source_word: χιλιάρχους
  choice: हज़ार-हज़ार लोगों के अधिकारी
  rationale: यह पद के संख्यात्मक और सैन्य-संगठनात्मक स्वरूप को किसी रोमी पदनाम का आयात किए बिना स्पष्ट करता है।
- source_word: ἑκατοντάρχους
  choice: सौ-सौ लोगों के अधिकारी
  rationale: श्रेणीबद्ध पदों की समानांतर संरचना और प्रत्येक अधिकारी के अधीन समूह का आकार सुरक्षित रहता है।
- source_word: πεντηκοντάρχους
  choice: पचास-पचास लोगों के अधिकारी
  rationale: संख्यात्मक सैन्य श्रेणी को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δεκαδάρχους
  choice: दस-दस लोगों के अधिकारी
  rationale: सूची की समानांतरता और सबसे छोटी उल्लिखित इकाई का आकार बनाए रखता है।
