  yaml_path: translation/deuterocanon/1_maccabees/003/007.yaml
  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: hi
  text: उसने अनेक राजाओं को कटु बना दिया, और अपने कामों से याकूब को आनंदित किया; और उसकी स्मृति सदा धन्य है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा, “उसकी स्मृति सदा आशीष के लिए है।” यूनानी में शाब्दिक आशीष-सूत्र है: “उसकी स्मृति सदा आशीष के लिए है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: कड़वाहट से भर दिया
  rationale: यह यूनानी क्रिया के ‘कड़वा कर देना’ वाले रूपक और विरोधी राजाओं पर पड़े प्रभाव—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βασιλεῖς πολλούς
  choice: अनेक राजाओं
  rationale: βασιλεῖς का सीधा और सटीक अर्थ ‘राजाओं’ है; ‘शासकों’ कहना अनावश्यक रूप से व्यापक होता।
- source_word: ηὔφρανεν
  choice: आनन्दित किया
  rationale: यह क्रिया किसी को आनन्द या प्रसन्नता देने का कारणवाचक भाव व्यक्त करती है।
- source_word: τὸν Ἰακώβ
  choice: याकूब
  rationale: मूल पाठ का पैतृक नाम ज्यों का त्यों रखा गया है; यहाँ यह सामूहिक रूप से परमेश्वर की प्रजा को सूचित करता है।
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: अपने कामों से
  rationale: यह उन कामों को वह साधन बताता है जिनके द्वारा याकूब आनन्दित हुआ; हिन्दी में यह सहज और मूल के निकट है।
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: उसकी स्मृति
  rationale: μνημόσυνον स्मरण या स्मृति को दर्शाता है; ‘उसकी स्मृति’ हिन्दी में स्वाभाविक रहते हुए यूनानी संज्ञात्मक रचना को बनाए रखता है।
- source_word: εἰς εὐλογίαν
  choice: आशीष के लिए
  rationale: यह मूल की बाइबलीय आशीष-सूत्र की संरचना को सीधे सुरक्षित रखता है और उसे निष्क्रिय क्रिया में नहीं बदलता।
- source_word: ἕως τοῦ αἰῶνος
  choice: सदा
  rationale: यह स्थायी, अनन्त अवधि के यूनानी मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘याकूब’ का सामूहिक अर्थ
  choice: मूल पाठ के अनुसार ‘याकूब’ रखा गया है, जो वाचा की प्रजा का सामूहिक नाम है।
  alternative: ‘इस्राएल’
  rationale: ‘इस्राएल’ अर्थ स्पष्ट कर सकता है, पर मूल में आए पैतृक और वाचागत नाम को बदल देगा।
- issue: अन्तिम खंड में आशीष-सूत्र
  choice: ‘उसकी स्मृति सदा आशीष के लिए है’
  alternative: ‘उसकी स्मृति सदा धन्य रहेगी’
  rationale: यूनानी में स्पष्ट निष्क्रिय क्रिया नहीं, बल्कि संज्ञात्मक सूत्र ‘आशीष के लिए’ है; चुना हुआ रूप इस अस्पष्टता और शास्त्रीय लहजे को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘याकूब’ और ‘आशीष के लिए’ जैसे बाइबलीय पद मूल पाठ की वाचागत तथा सूत्रात्मक ध्वनि को सुरक्षित रखते हैं।
