  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: hi
  text: और हर एक ने अपने पड़ोसी से कहा, “आओ, हम अपने लोगों और पवित्र स्थानों की उजड़ी हुई दशा को फिर से बहाल करें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “आओ, हम अपने लोगों और पवित्र वस्तुओं के उजाड़ को उठाएँ।” यूनानी में ‘उठाने’ की क्रिया के साथ ‘गिराए जाने, उजाड़ या बरबादी’ की संज्ञा आती है; इससे विनाश के बाद पुनर्स्थापना का भाव व्यक्त होता है।
    reason: मूल यूनानी के असामान्य शब्दचित्र और τῶν ἁγίων के ‘पवित्र वस्तुएँ’ वाले वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: हर एक ने अपने पास वाले से
  rationale: यह यूनानी के एकवचन और वितरणात्मक भाव को बनाए रखता है और लोगों के परस्पर बोलने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: उजड़ी दशा को फिर सँवारें
  rationale: यूनानी में शाब्दिक रूप से ‘गिराए जाने/उजाड़ को उठाएँ’ जैसा विरोधाभासी चित्र है। हिन्दी में यह चयन विनाश के बाद पुनर्स्थापना का भाव स्वाभाविक ढंग से देता है, जबकि पाद-टिप्पणी मूल शब्दचित्र स्पष्ट करती है।
- source_word: τοῦ λαοῦ ἡμῶν
  choice: अपने लोगों
  rationale: λαός यहाँ इस्राएल के जनसमुदाय को सूचित करता है; ‘अपने लोगों’ सीधा, सहज और प्रसंगानुकूल है।
- source_word: τῶν ἁγίων
  choice: पवित्र स्थानों
  rationale: मक्काबी प्रसंग में बहुवचन τὰ ἅγια मंदिर के पवित्र क्षेत्र, पवित्र स्थानों या पवित्र वस्तुओं को सूचित कर सकता है। मुख्य पाठ में ‘पवित्र स्थानों’ मंदिर-अपवित्रीकरण के प्रसंग को स्पष्ट रखता है, और व्यापक वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τῶν ἁγίων का आशय
  choice: पवित्र स्थानों
  alternative: पवित्र वस्तुओं
  rationale: राष्ट्रीय पुनर्स्थापना के साथ मंदिर और उसके पवित्र परिसर की पुनर्स्थापना प्रसंग का केंद्र है। फिर भी यूनानी बहुवचन पवित्र वस्तुओं को भी समेट सकता है, इसलिए उस संभावना को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उजड़ी दशा को फिर सँवारें’ शाब्दिक कठोरता से बचते हुए मूल के पुनर्स्थापना-भाव को व्यक्त करता है।
