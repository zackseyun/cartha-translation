  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: hi
  text: और लूसियास ने दोरीमेनेस के पुत्र टॉलेमी, निकानोर और गोरगियास को चुना। वे राजा के मित्रों[a] में से शक्तिशाली पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “राजा के दरबारियों में से।” हेलेनिस्ती राजकीय प्रचलन में “राजा के मित्र” केवल व्यक्तिगत मित्रों का संकेत नहीं करता था, बल्कि राजदरबार का एक पदनाम भी हो सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: यह क्रिया चुनने या चयन करने को व्यक्त करती है। “चुना” सीधा और स्वाभाविक है; “नियुक्त किया” मूल पाठ से अधिक आधिकारिक अर्थ जोड़ देता।
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: दोरिमेनेस के पुत्र टॉलमी
  rationale: व्यक्तिवाचक नाम के साथ प्रयुक्त संबंधकारक पद यहाँ पिता अथवा वंश-संबंध से टॉलमी की पहचान कराता है; हिन्दी में “के पुत्र” इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνδρας δυνατοὺς
  choice: सामर्थी पुरुष
  rationale: ἄνδρας वयस्क पुरुषों को स्पष्ट रूप से सूचित करता है, जबकि δυνατούς में शक्ति, योग्यता और प्रभाव के अर्थ समाहित हो सकते हैं। सैन्य प्रसंग में “सामर्थी पुरुष” इस अर्थ-व्याप्ति को पर्याप्त रूप से बनाए रखता है।
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: राजा के मित्रों में से
  rationale: यह संबंधकारक पद इन पुरुषों को राजा के “मित्रों” नामक मंडल का सदस्य बताता है। “में से” हिन्दी में इस सदस्यता-संबंध को सहज बनाता है, जबकि “मित्रों” का शाब्दिक रूप मुख्य पाठ में सुरक्षित रहता है।
