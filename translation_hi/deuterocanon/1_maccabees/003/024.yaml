  text: वे उनका पीछा करते हुए बेथ-होरोन की उतराई से नीचे मैदान तक गए। उनमें से लगभग आठ सौ पुरुष गिर पड़े[a], पर बाकी पलिश्तियों के देश में भाग गए।
