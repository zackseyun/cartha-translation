lexical_decisions:
- source_word: ἐδίωκον
  choice: पीछा करते गए
  rationale: अपूर्ण काल निरंतर चल रही पीछा करने की कार्रवाई दिखाता है; यह हिन्दी कथाशैली में स्वाभाविक रूप से उस पहलू को व्यक्त करता है।
- source_word: ἐν τῇ καταβάσει Βαιθωρὼν
  choice: बेथ-होरोन की उतराई से होते हुए
  rationale: κατάβασις नीचे उतरने वाले मार्ग या ढलान को सूचित करता है; यह रूप भूगोल और पीछा करने की दिशा दोनों स्पष्ट रखता है।
- source_word: ἕως τοῦ πεδίου
  choice: मैदान तक
  rationale: ἕως सीमा या अंतिम बिंदु और πέδιον समतल मैदान को दर्शाता है।
- source_word: ἔπεσον ἀπʼ αὐτῶν εἰς ἄνδρας ὀκτακοσίους
  choice: उनमें से लगभग आठ सौ पुरुष मारे गए
  rationale: ἀπʼ αὐτῶν पीछा किए जा रहे दल में से हताहतों को दर्शाता है और εἰς के साथ संख्या अनुमानित संख्या का भाव दे सकती है। युद्ध-वर्णन में हिन्दी का 'मारे गए' स्वाभाविक रूप से ἔπεσον का आशय देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: οἱ δὲ λοιποὶ
  choice: और बाकी
  rationale: δέ यहाँ अगले समूह की ओर हल्का विरोधात्मक संक्रमण करता है; हिन्दी में 'और बाकी' कथाप्रवाह को स्वाभाविक रखते हुए अंतर स्पष्ट करता है।
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: पलिश्तियों के देश में भाग गए
  rationale: यह यूनानी वाक्यांश का पारदर्शी और स्वाभाविक हिन्दी रूप है तथा स्थान को किसी आधुनिक भौगोलिक नाम से नहीं बदलता।
