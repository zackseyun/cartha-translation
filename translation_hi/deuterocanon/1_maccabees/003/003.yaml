  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: hi
  text: और उसने अपने लोगों की महिमा बढ़ाई[a]। उसने एक महाकाय पुरुष के समान[b] वक्ष-कवच पहना और अपनी युद्ध-सामग्री कमर से बाँधी। उसने युद्धों का आयोजन किया[c] और तलवार से छावनी की रक्षा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लोगों का सम्मान/यश बढ़ाया।” यूनानी क्रिया का शाब्दिक अर्थ “चौड़ा किया” है, जो यहाँ महिमा बढ़ाने के लिए रूपक के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “महाकाय पुरुष के समान” का भाव “महाबली योद्धा के समान” या “वीर के समान” भी हो सकता है, पर यूनानी शब्द का मूल अर्थ “विशालकाय व्यक्ति” या “दैत्याकार व्यक्ति” है।
    reason: lexical_alternative
  - marker: c
    text: या, “युद्धों को संगठित किया” अथवा “युद्ध किए।” यूनानी अभिव्यक्ति केवल युद्ध में भाग लेने के बजाय सैनिक कार्रवाइयों को व्यवस्थित करने पर भी बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν δόξαν
  choice: महिमा बढ़ाई
  rationale: ἐπλάτυνεν का मूल भाव ‘चौड़ा करना’ है, पर δόξαν के साथ इसका स्वाभाविक अर्थ महिमा, सम्मान या यश बढ़ाना है। ‘महिमा बढ़ाई’ रूपक के आशय और ऊँची बाइबलीय शैली दोनों को बनाए रखता है।
- source_word: τῷ λαῷ αὐτοῦ
  choice: अपने लोगों की
  rationale: λαός यहाँ सामूहिक राष्ट्रीय समुदाय को दर्शाता है। ‘अपने लोगों’ सीधा और स्वाभाविक है तथा अनावश्यक जातीय विशिष्टता नहीं जोड़ता।
- source_word: ἐνεδύσατο θώρακα
  choice: झिलम पहनी
  rationale: θώραξ धड़ की रक्षा करने वाला विशिष्ट कवच है। आधुनिक मानक हिन्दी में ‘झिलम’ इस सैनिक उपकरण का सटीक शब्द है और सामान्य ‘कवच’ की अपेक्षा मूल के अधिक निकट है।
- source_word: ὡς γίγας
  choice: एक दैत्य के समान
  rationale: γίγας का प्रत्यक्ष अर्थ ‘दैत्य’ या असाधारण विशालकाय व्यक्ति है। तुलना की वीरतापूर्ण और अतिशयोक्तिपूर्ण छवि को बिना व्याख्यात्मक रूप से ‘महायोद्धा’ बना देने के सुरक्षित रखा गया है।
- source_word: συνεζώσατο τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: अपने युद्ध के हथियार कमर से बाँधे
  rationale: συνεζώσατο में कमर कसकर उपकरण बाँधने का भाव है और σκεύη πολεμικά युद्ध-सामग्री या हथियारों को दर्शाता है। यह अनुवाद क्रिया की ठोस छवि बनाए रखता है।
- source_word: πολέμους συνεστήσατο
  choice: युद्धों का संचालन किया
  rationale: यह अभिव्यक्ति केवल लड़ने के बजाय युद्धों को संगठित करने, खड़ा करने या संचालित करने का भाव दे सकती है। ‘संचालन किया’ इस व्यापक सैनिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: छावनी की रक्षा की
  rationale: σκεπάζων का मूल अर्थ ढकना है, जो यहाँ सुरक्षा देने के अर्थ में प्रयुक्त है; παρεμβολή सैनिक छावनी है। हिन्दी में ‘रक्षा की’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: ἐν ῥομφαίᾳ
  choice: तलवार से
  rationale: ἐν यहाँ साधन को और ῥομφαία बड़ी तलवार को सूचित करता है। ‘तलवार से’ स्वाभाविक है; हथियार के आकार का भेद इस प्रसंग में आवश्यक नहीं।
