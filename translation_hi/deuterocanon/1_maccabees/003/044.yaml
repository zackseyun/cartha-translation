translation:
  language: hi
  text: और सभा युद्ध के लिए तैयार होने, प्रार्थना करने और दया तथा करुणा माँगने के लिए इकट्ठी हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠθροίσθη
  choice: इकट्ठी हुई
  rationale: यूनानी क्रिया रूपतः कर्मवाच्य है, पर इस प्रसंग में समुदाय के एकत्र होने का भाव देता है। ‘इकट्ठी हुई’ आधुनिक हिन्दी में स्वाभाविक है; अधिक रूपनिष्ठ विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: ἡ συναγωγή
  choice: सभा
  rationale: यहाँ शब्द एकत्र समुदाय को सूचित करता है, किसी भवन या बाद की संस्थागत ‘आराधनालय’ धारणा को नहीं। ‘सभा’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: τοῦ εἶναι ἑτοίμους
  choice: तैयार होने
  rationale: सव्यय अनंत क्रिया यहाँ उद्देश्य बताती है। ‘तैयार होने के लिए’ उसी प्रयोजनात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πόλεμον
  choice: युद्ध के लिए
  rationale: πόλεμος का सीधा अर्थ ‘युद्ध’ है; यह व्यापक सैन्य प्रसंग को ‘लड़ाई’ की अपेक्षा अधिक ठीक ढंग से बनाए रखता है।
- source_word: τοῦ προσεύξασθαι
  choice: प्रार्थना करके
  rationale: यह पहले उद्देश्य के समानांतर दूसरा उद्देश्य है। हिन्दी में अगले संयुक्त क्रियापद ‘माँगने’ के साथ ‘प्रार्थना करके’ अधिक सहज प्रवाह देता है।
- source_word: αἰτῆσαι
  choice: माँगने
  rationale: क्रिया का अर्थ माँगना या निवेदन करना है। ‘माँगने’ सरल और सीधा है तथा दया और करुणा दोनों कर्मों के साथ स्वाभाविक बैठता है।
- source_word: ἔλεον
  choice: दया
  rationale: प्रार्थना के प्रसंग में ‘दया’ धार्मिक भार और विनती के भाव को बनाए रखने वाला प्रचलित हिन्दी पर्याय है।
- source_word: οἰκτειρμούς
  choice: करुणा
  rationale: यह शब्द गहरी सहानुभूति और करुणामय कृपा का भाव रखता है। ‘करुणा’ इसे ‘दया’ से संबद्ध रखते हुए दोनों यूनानी संज्ञाओं का भेद भी बनाए रखता है।
theological_decisions:
- issue: द्वितीयकानूनी ऐतिहासिक प्रसंग में συναγωγή का अनुवाद
  choice: सभा
  alternative: मण्डली; आराधनालय
  rationale: पद में लोग एक समुदाय के रूप में युद्ध की तैयारी और प्रार्थना के लिए एकत्र हैं। ‘सभा’ किसी भवन या स्थायी संस्था का कालविपर्ययी संकेत दिए बिना सामुदायिक अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण ऐतिहासिक-वर्णन शैली। यूनानी के दोनों उद्देश्य—युद्ध की तैयारी और प्रार्थनापूर्वक विनती—स्पष्ट रखे गए हैं।
