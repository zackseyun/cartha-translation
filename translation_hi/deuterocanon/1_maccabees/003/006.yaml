  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: hi
  text: उसके भय से अधर्मी दब गए, और अधर्म के काम करनेवाले सभी लोग व्याकुल हो उठे; और उसके हाथ से छुटकारा[a] सफल हुआ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार’। यूनानी σωτηρία का अर्थ ‘छुटकारा’ या ‘उद्धार’ हो सकता है; यहाँ राष्ट्रीय और सैनिक मुक्ति का प्रसंग ‘छुटकारा’ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके हाथ से’ बाइबिल का एक मुहावरा है; इसका अर्थ है कि यह सफलता उसके माध्यम या सामर्थ्य से आई।
    reason: cultural_note
lexical_decisions:
- source_word: συνεστάλησαν
  choice: दब गए
  rationale: यह कर्मवाच्य क्रिया यहाँ भय के कारण रोके जाने, पीछे दबने या प्रभावहीन होने का भाव देती है। ‘दब गए’ इस व्यापकता को बनाए रखता है और अनावश्यक रूप से केवल युद्धभूमि से पीछे हटने तक अर्थ को सीमित नहीं करता।
- source_word: οἱ ἄνομοι
  choice: अधर्मी
  rationale: यह शब्द व्यवस्था-विरोधी या अधर्म से पहचाने जानेवाले लोगों को सूचित करता है। ‘अधर्मी’ सहज हिन्दी है और आगे आए ἀνομία के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: उसके भय से
  rationale: यूनानी पदबंध कारण बताता है—वे उसके कारण उत्पन्न भय से दब गए। संक्षिप्त हिन्दी पदबंध मूल की संरचना और अर्थ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: अधर्म के काम करनेवाले
  rationale: यह अनुवाद ‘काम करनेवाले’ की ठोस छवि और ἄνομος/ἀνομία की जानबूझकर की गई पुनरावृत्ति को यथासंभव सुरक्षित रखता है।
- source_word: συνεταράχθησαν
  choice: घबरा उठे
  rationale: क्रिया भीतर से हिल जाने, व्याकुल या आतंकित होने का भाव देती है। ‘घबरा उठे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में शत्रुओं की अचानक उत्पन्न व्याकुलता व्यक्त करता है।
- source_word: εὐωδώθη
  choice: सफल हुआ
  rationale: कर्मवाच्य क्रिया का अर्थ सफल या समृद्ध होना है। ‘सफल हुआ’ हिन्दी में स्पष्ट है और यह बताता है कि छुटकारे के कार्य को सफलता मिली।
- source_word: σωτηρία
  choice: छुटकारा
  rationale: ऐतिहासिक-सैनिक प्रसंग में यह राष्ट्रीय बचाव या मुक्ति को सूचित करता है। ‘छुटकारा’ इस प्रसंग के अनुकूल है, पर पाद-टिप्पणी में व्यापक धार्मिक विकल्प ‘उद्धार’ सुरक्षित रखा गया है।
- source_word: ἐν χειρὶ αὐτοῦ
  choice: उसके हाथों
  rationale: यूनानी बाइबिलीय मुहावरा उसकी अभिकर्तृता या सामर्थ्य के द्वारा सफलता आने को दर्शाता है। हिन्दी का ‘उसके हाथों’ वही भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: सैनिक-ऐतिहासिक प्रसंग में σωτηρία का अर्थ
  choice: छुटकारा
  alternative: उद्धार
  rationale: यह पद यहूदा के द्वारा शत्रुओं पर पड़े प्रभाव और लोगों को मिली ऐतिहासिक मुक्ति का वर्णन करता है। ‘छुटकारा’ तत्काल प्रसंग को स्पष्ट करता है, जबकि पाद-टिप्पणी मूल शब्द की व्यापक ‘उद्धार’ वाली अर्थ-संभावना को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अधर्मी’ और ‘अधर्म के काम करनेवाले’ मूल के समान-धातु वाले शब्दों की आलंकारिक पुनरावृत्ति को बनाए रखते हैं। अर्धविराम शत्रुओं की प्रतिक्रिया और उसके हाथों मिली मुक्ति के बीच भावगत मोड़ स्पष्ट करता है।
