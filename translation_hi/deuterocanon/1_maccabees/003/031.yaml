  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: hi
  text: और उसका मन बहुत व्याकुल था[a]। उसने फ़ारस जाने, उन क्षेत्रों के कर वसूल करने और बहुत-सी चाँदी[b] इकट्ठी करने का निश्चय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अपने भीतर बहुत असमंजस में था” अथवा “वह बड़े संकट में था।” यूनानी क्रिया असमंजस और कठिन संकट—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “चाँदी” से सम्भवतः सिक्कों या तौली हुई चाँदी के रूप में धन अभिप्रेत है, केवल कच्ची धातु नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο τῇ ψυχῇ αὐτοῦ σφόδρα
  choice: उसका मन बहुत व्याकुल था
  rationale: यह सहज हिन्दी में उसकी भीतरी दशा को व्यक्त करता है। ἠπορεῖτο में असमंजस, निरुपायता या संकट में पड़ने का भाव भी हो सकता है; σφόδρα उसकी तीव्रता बताता है।
- source_word: ἐβουλεύσατο
  choice: निश्चय किया
  rationale: मध्यवाच्य रूप सोच-विचार के बाद कार्य-योजना ठहराने का भाव देता है; ‘निश्चय किया’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  choice: फ़ारस जाने
  rationale: यह निर्णय की विषय-वस्तु को स्वाभाविक हिन्दी में व्यक्त करता है और प्राचीन भू-नाम को प्रचलित रूप ‘फ़ारस’ में रखता है।
- source_word: λαβεῖν τοὺς φόρους τῶν χωρῶν
  choice: उन क्षेत्रों के कर वसूल करने
  rationale: φόρους यहाँ शासकीय कर अथवा अधीन क्षेत्रों से मिलने वाले राजस्व को दर्शाता है। ‘कर वसूल करना’ आधुनिक हिन्दी में प्रशासनिक कार्य को स्पष्ट करता है, जबकि ‘क्षेत्र’ χωρῶν को अनावश्यक रूप से ‘प्रान्त’ जैसा तकनीकी अर्थ नहीं देता।
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: बहुत-सी चाँदी इकट्ठी करने
  rationale: ἀργύριον का मूल अर्थ ‘चाँदी’ है और प्रसंग में यह मुद्रा अथवा धन का द्योतक हो सकता है। ठोस धातु-संबंधी भाषा बनाए रखने के लिए ‘चाँदी’ रखा गया है।
