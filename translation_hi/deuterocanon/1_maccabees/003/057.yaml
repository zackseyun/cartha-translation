lexical_decisions:
- source_word: ἀπῆρεν
  choice: कूच कर गई
  rationale: सैन्य प्रसंग में यह क्रिया छावनी उठाकर प्रस्थान करने को व्यक्त करती है; ‘कूच कर गई’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἡ παρεμβολή
  choice: छावनी
  rationale: παρεμβολή का मूल अर्थ सैन्य छावनी है और यहाँ यह सामूहिक रूप से वहाँ ठहरी सेना को भी सूचित करती है।
- source_word: παρενεβάλοσαν
  choice: उन्होंने … पड़ाव डाला
  rationale: सैन्य यात्रा के प्रसंग में παρεμβάλλω का अर्थ किसी स्थान पर डेरा या पड़ाव डालना है।
- source_word: κατὰ νότον
  choice: के दक्षिण में
  rationale: यह अम्माऊस के सापेक्ष पड़ाव की स्थिति बताता है, केवल यात्रा की दिशा नहीं।
- source_word: Ἀμμαούμ
  choice: अम्माऊस
  rationale: यूनानी स्थान-नाम का देवनागरी में निकट और प्रचलित बाइबलीय लिप्यंतरण।
