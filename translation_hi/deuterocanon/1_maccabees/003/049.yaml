  yaml_path: translation/deuterocanon/1_maccabees/003/049.yaml
  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: hi
  text: और वे याजकीय वस्त्र, उपज के पहले फल और दशमांश ले आए; और उन्होंने उन नाज़ीरों को आगे खड़ा किया, जो अपने दिन पूरे कर चुके थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वे अपने नाज़ीर-व्रत की निर्धारित अवधि पूरी कर चुके थे। यूनानी में शाब्दिक रूप से ‘अपने दिन पूरे कर चुके थे’ है।
    reason: मुहावरे के संदर्भगत अर्थ को स्पष्ट करना और मूल की शाब्दिक अभिव्यक्ति बताना।
lexical_decisions:
- source_word: ἤνεγκαν
  choice: ले आए
  rationale: यहाँ क्रिया वस्तुओं और भेंटों को किसी स्थान पर लाने का सामान्य अर्थ देती है; ‘ले आए’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: याजकीय वस्त्र
  rationale: यह पद याजकीय सेवा से जुड़े वस्त्रों को दर्शाता है। ‘याजकीय वस्त्र’ सटीक, संक्षिप्त और अनावश्यक रूप से पंथ-विशेष की शब्दावली से मुक्त है।
- source_word: τὰ πρωτογεννήματα
  choice: उपज के पहले फल
  rationale: दशमांश के साथ आए उपासना-संबंधी संदर्भ में यह परमेश्वर को अर्पित उपज के प्रथम भाग को सूचित करता है। ‘उपज के पहले फल’ आधुनिक पाठक के लिए ‘पहली उपज’ की तुलना में अधिक स्पष्ट है।
- source_word: τὰς δεκάτας
  choice: दशमांश
  rationale: यह बाइबलीय भेंट के रूप में दिए जाने वाले दसवें भाग के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: ἤγειραν
  choice: आगे खड़ा किया
  rationale: शाब्दिक अर्थ ‘उठाया’ है, पर यहाँ व्यक्तियों को सामने उपस्थित करने या खड़ा करने का भाव है। ‘आगे खड़ा किया’ उस क्रिया को स्वाभाविक रूप से व्यक्त करता है और पुनरुत्थान अथवा नींद से जगाने का भ्रम नहीं पैदा करता।
- source_word: τοὺς Ναζιραίους
  choice: नाज़ीरों
  rationale: यह तोराह-आधारित विशेष व्रत से बँधे लोगों का तकनीकी नाम है। लिप्यंतरण ऐतिहासिक-धार्मिक श्रेणी को सुरक्षित रखता है, जबकि पद में व्याख्यात्मक विस्तार नहीं जोड़ता।
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: जो अपने दिन पूरे कर चुके थे
  rationale: यह यूनानी की संक्षिप्त अभिव्यक्ति को बनाए रखता है। संदर्भ में इसका अर्थ नाज़ीर-व्रत की निर्धारित अवधि पूरी करना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: Ναζιραίους के तकनीकी धार्मिक अर्थ को व्यक्त करना
  choice: नाज़ीरों
  alternative: नाज़ीर-व्रत मानने वालों
  rationale: मूल में एक विशिष्ट अभिषेक-व्रत से जुड़े लोगों का नाम है, सामान्य व्रतियों का वर्णन नहीं। लिप्यंतरण इस संस्था की विशिष्टता बनाए रखता है; पादटिप्पणी संदर्भगत अर्थ समझाती है।
- issue: ‘दिन पूरे करने’ की अभिव्यक्ति में व्रत का उल्लेख
  choice: मुख्य पाठ में ‘अपने दिन पूरे कर चुके थे’
  alternative: ‘अपने व्रत के निर्धारित दिन पूरे कर चुके थे’
  rationale: मूल यूनानी केवल ‘दिन’ कहता है और व्रत को स्पष्ट रूप से दोहराता नहीं। इसलिए मुख्य पाठ उसकी संक्षिप्तता और निहित अर्थ को सुरक्षित रखता है, जबकि पादटिप्पणी मुहावरे का आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘याजकीय’, ‘दशमांश’ और ‘नाज़ीर’ जैसे आवश्यक बाइबलीय तकनीकी शब्द बनाए गए हैं; वाक्य-विन्यास मूल यूनानी के क्रम और समानांतरता के निकट है।
