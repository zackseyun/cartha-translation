  yaml_path: translation/deuterocanon/1_maccabees/003/005.yaml
  text: And he hunted down the lawless[a], searching them out[b], and he burned those who troubled his people.
translation:
  language: hi
  text: उसने अधर्मियों[a] को ढूँढ़-ढूँढ़कर उनका पीछा किया, और जो अपने लोगों को सताते थे, उन्हें जला दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था-विरोधियों।”
    reason: lexical_alternative
  - marker: b
    text: या, “आग लगा दी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: पीछा किया
  rationale: यह क्रिया सक्रिय और दृढ़तापूर्वक पीछा करने का भाव देती है। ‘पीछा किया’ आधुनिक हिन्दी में स्वाभाविक है और बाद के तकनीकी अर्थों को नहीं थोपता।
- source_word: ἀνόμους
  choice: अधर्मियों
  rationale: यह शब्द व्यवस्था और नैतिक मर्यादा का उल्लंघन करनेवालों को सूचित करता है। ‘अधर्मी’ उसके नैतिक-व्यवस्थागत बल को बनाए रखता है, जबकि ‘अपराधी’ अर्थ को केवल नागरिक कानून तक सीमित कर सकता है।
- source_word: ἐξερευνῶν
  choice: ढूँढ़-ढूँढ़कर
  rationale: वर्तमान कृदन्त सावधानी और लगन से खोजने की सहायक क्रिया बताता है। पुनरुक्ति-प्रयोग हिन्दी में निरन्तर और गहन खोज का स्वाभाविक भाव देता है।
- source_word: παράσσοντας
  choice: सतानेवालों
  rationale: यह कृदन्त प्रजा को परेशान करने या हानि पहुँचानेवालों को दर्शाता है। ‘सतानेवाले’ व्यापक disruptive harm को सहज हिन्दी में व्यक्त करता है, बिना औपचारिक राजनीतिक उत्पीड़न का अनावश्यक अर्थ जोड़े।
- source_word: ἐφλόγισεν
  choice: जला दिया
  rationale: क्रिया आग से जलाने का कठोर और प्रत्यक्ष भाव रखती है। ‘जला दिया’ उसकी तीव्रता को न तो नरम करता है, न बढ़ाता है।
- source_word: τὸν λαὸν αὐτοῦ
  choice: उसकी प्रजा
  rationale: λαός सामूहिक जनसमुदाय को दर्शाता है। इस राष्ट्रीय-सामुदायिक प्रसंग में ‘प्रजा’ स्वाभाविक है और ‘उसकी’ मूल पाठ की सम्बन्धवाचकता को सुरक्षित रखता है।
theological_decisions:
- issue: ἀνόμους का नैतिक और व्यवस्था-संबंधी बल
  choice: अधर्मियों
  alternative: व्यवस्था-विरोधियों; अपराधियों
  rationale: ‘अधर्मी’ समुदाय की व्यवस्था के उल्लंघन और नैतिक दोष—दोनों आयामों को खुला रखता है; यह अर्थ को केवल नागरिक अपराध तक सीमित नहीं करता।
- issue: ἐφλόγισεν में कार्रवाई की कठोरता
  choice: जला दिया
  alternative: आग लगा दी
  rationale: यूनानी पाठ कार्रवाई को बिना व्याख्या के कठोर रूप में कहता है। अनुवाद उसी स्पष्टता को बनाए रखता है और किसी रूपक या अतिरिक्त औचित्य को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप रखा गया है। ‘ढूँढ़-ढूँढ़कर’ गहन खोज को स्वाभाविक हिन्दी में व्यक्त करता है; हिंसक कार्रवाई को मूल यूनानी की तरह स्पष्ट और अलंकरणरहित रखा गया है।
