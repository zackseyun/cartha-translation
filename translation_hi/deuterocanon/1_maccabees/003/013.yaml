  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: hi
  text: और सीरिया की सेना के प्रधान सेरोन ने सुना कि यहूदा ने अपने साथ एक दल[a] और विश्वासयोग्य लोगों[b] तथा युद्ध के लिए निकलनेवालों की एक सभा इकट्ठी कर ली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक जत्था”; यूनानी शब्द का अर्थ एकत्रित समूह है और इस प्रसंग में उसमें सैन्य भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “विश्वासयोग्य” का अर्थ “निष्ठावान” भी हो सकता है; इससे वाचा के प्रति विश्वासयोग्यता के साथ-साथ यहूदा के उद्देश्य के प्रति निष्ठा भी व्यक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σήρων
  choice: सेरोन
  rationale: यूनानी नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: सीरिया की सेना का प्रधान
  rationale: सैन्य प्रसंग में ἄρχων नेतृत्व या कमान को और δύναμις सशस्त्र सेना को सूचित करता है; ‘प्रधान’ मूल पद की व्यापकता बनाए रखता है।
- source_word: ἤθροισεν
  choice: इकट्ठी कर ली है
  rationale: लोगों को एकत्र करने का अर्थ व्यक्त करता है और ‘सुना कि’ के बाद पूर्व में पूर्ण हुई क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: ἄθροισμα
  choice: एक दल
  rationale: एकत्रित समूह का अर्थ देता है और सैन्य प्रसंग की हल्की छाया भी बनाए रखता है, बिना उसे औपचारिक सेना कहे।
- source_word: ἐκκλησίαν
  choice: एक सभा
  rationale: द्वितीय-मन्दिरकालीन यहूदी संदर्भ में ‘सभा’ उपयुक्त है और बाद के मसीही संस्थागत अर्थ को आरोपित नहीं करता।
- source_word: πιστῶν
  choice: विश्वासयोग्य लोगों
  rationale: यह चयन निष्ठा और धार्मिक विश्वासयोग्यता—दोनों संभावित भावों को खुला रखता है।
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: जो युद्ध के लिए निकलते हैं
  rationale: यूनानी संबंधवाचक कृदन्त का निकट और स्वाभाविक अनुवाद; यह सभा से जुड़े विश्वासयोग्य लोगों का वर्णन करता है।
theological_decisions:
- issue: यहूदी सैन्य-धार्मिक संदर्भ में ἐκκλησίαν का अनुवाद
  choice: सभा
  alternative: कलीसिया / मंडली
  rationale: ‘सभा’ तत्कालीन यहूदी संदर्भ के सामान्य अर्थ को व्यक्त करता है और बाद का मसीही संस्थागत अर्थ नहीं जोड़ता।
- issue: πιστῶν में विश्वास और निष्ठा का संबंध
  choice: विश्वासयोग्य लोगों
  alternative: निष्ठावान लोगों
  rationale: मूल शब्द धार्मिक विश्वासयोग्यता और किसी व्यक्ति या उद्देश्य के प्रति निष्ठा—दोनों अर्थ दे सकता है; चुना गया रूप इस तनाव को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘यहूदा’ नाम बाइबलीय हिन्दी परंपरा के अनुरूप है। अंतिम कृदन्त को संबंधवाचक उपवाक्य बनाया गया है ताकि यूनानी की संरचना और उसका संभावित संबंध विश्वासयोग्य लोगों से स्पष्ट रहे।
