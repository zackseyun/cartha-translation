revisions:
- from: तब सीरिया की सेना के प्रधान सेरोन ने सुना कि यहूदा ने अपने साथ एक दल[a] और विश्वासयोग्य लोगों[b] की एक सभा इकट्ठी कर ली है, जो युद्ध के लिए निकलते हैं।
  to: और सीरिया की सेना के प्रधान सेरोन ने सुना कि यहूदा ने अपने साथ एक दल[a] और विश्वासयोग्य लोगों[b] तथा युद्ध के लिए निकलनेवालों की एक सभा इकट्ठी कर ली है।
  rationale: The revision preserves the Greek coordination of πιστῶν (‘faithful/loyal people’) and ἐκπορευομένων εἰς πόλεμον (‘those going out to war’) by rendering both as coordinated descriptors within the assembly. It also changes the final expression from a generic present-tense relative clause to the event-specific and natural Hindi participial expression ‘युद्ध के लिए निकलनेवालों.’ No theological interpretation is added, and both lexical alternatives remain properly anchored.
