  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: hi
  text: और यहूदा को इसका पता चला, तो वह उसका सामना करने के लिए निकला। उसने उस पर वार किया और उसे मार डाला। बहुत-से घायल लोग गिर पड़े[a], और बाकी भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ बहुत-से लोगों को घायल बताया गया है; पाठ स्पष्ट रूप से यह नहीं कहता कि वे मारे गए।
    reason: lexical_clarification
lexical_decisions:
- source_word: ἔγνω
  choice: इसका पता चला
  rationale: यहाँ क्रिया किसी परिस्थिति या समाचार की जानकारी मिलने को व्यक्त करती है; यह हिन्दी में स्वाभाविक रूप से यहूदा की तत्काल प्रतिक्रिया का आधार बताती है।
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: वह उससे भिड़ने के लिए निकला
  rationale: मूल पदबंध का सामान्य अर्थ मिलने के लिए निकलना है, पर सैन्य प्रसंग में यह शत्रुतापूर्ण सामना है; ‘भिड़ने’ से प्रसंग स्पष्ट रहता है और अनावश्यक रूप से विजय का अर्थ नहीं जोड़ा जाता।
- source_word: ἐπάταξεν αὐτόν
  choice: उसने उस पर वार किया
  rationale: πατάσσω प्रहार करने को दर्शाता है। इसके बाद हत्या का अलग उल्लेख होने के कारण ‘वार किया’ दोनों क्रियाओं का भेद बनाए रखता है।
- source_word: ἀπέκτεινεν
  choice: उसे मार डाला
  rationale: ἀποκτείνω का सीधा, स्पष्ट और आधुनिक हिन्दी रूप; यह मृत्यु को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: बहुत-से लोग घायल होकर गिर पड़े
  rationale: τραυματίαι घायल व्यक्तियों को निर्दिष्ट करता है। यह अनुवाद युद्धभूमि पर गिरने की छवि और घायल होने की स्पष्ट सूचना दोनों को सुरक्षित रखता है, बिना उन्हें मृत घोषित किए।
- source_word: οἱ ἐπίλοιποι
  choice: बाकी
  rationale: विरोधी दल के शेष लोगों के लिए संक्षिप्त और स्वाभाविक आधुनिक हिन्दी।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: सैन्य प्रसंग में पलायन का सीधा और आम हिन्दी रूप।
