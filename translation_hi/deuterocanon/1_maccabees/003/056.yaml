base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: hi
  text: और उसने कहा कि जो घर बना रहे हैं, जो स्त्रियों से मंगनी कर चुके हैं, जो दाख की बारियाँ लगा रहे हैं, और जो भयभीत हैं,[a] उनमें से हर एक व्यवस्था के अनुसार अपने घर लौट जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भयभीत’ का अनुवाद ‘डरपोक’ या ‘कायर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘व्यवस्था के अनुसार’ सम्भवतः व्यवस्थाविवरण 20:5–8 में युद्ध से दी गई छूटों की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: जो घर बना रहे हैं
  rationale: वर्तमान कृदन्त और उसके कर्म का सीधा, स्वाभाविक हिन्दी रूप; एकवचन οἰκίαν को जातिवाचक अर्थ में ‘घर’ रखा गया है।
- source_word: μνηστευομένοις γυναῖκας
  choice: जो स्त्रियों से मंगनी कर चुके हैं
  rationale: μνηστεύω वैधानिक-सामाजिक मंगनी को सूचित करता है। बहुवचन ‘स्त्रियों’ का सम्बन्ध पूरे समूह से वितरणात्मक है, न कि प्रत्येक पुरुष की अनेक मंगेतरों से।
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: जो दाख की बारियाँ लगा रहे हैं
  rationale: ἀμπελῶνας का अर्थ केवल दाखलताएँ नहीं, बल्कि दाख की बारियाँ है; समानान्तर कृदन्तीय रचना को सहज हिन्दी में रखा गया है।
- source_word: δειλοῖς
  choice: जो भयभीत हैं
  rationale: δειλός में भयभीत, डरपोक या कायर होने का अर्थ हो सकता है। ‘भयभीत’ युद्ध से डरने की अवस्था को व्यक्त करता है, पर अनावश्यक नैतिक निन्दा नहीं जोड़ता।
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: उनमें से हर एक ... अपने घर लौट जाए
  rationale: εἶπεν पर आश्रित infinitive अप्रत्यक्ष आज्ञा व्यक्त करता है; ‘लौट जाए’ निर्देशात्मक बल और ἕκαστον का वितरणात्मक अर्थ दोनों देता है। हिन्दी में ‘अपने घर’ स्वाभाविक रूप से उसी व्यक्ति की ओर संकेत करता है।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: यह यूनानी पद का सीधा और संक्षिप्त अनुवाद है। ‘मूसा की’ जोड़ना मूल से अधिक स्पष्टता आरोपित करता।
theological_decisions:
- issue: व्यवस्थाविवरण 20:5–8 की पृष्ठभूमि को मुख्य पाठ में स्पष्ट करना
  choice: केवल ‘व्यवस्था के अनुसार’ रखना
  alternative: ‘मूसा की व्यवस्था के अनुसार’ अथवा युद्ध-संबंधी छूटों को मुख्य पाठ में खोलकर कहना
  rationale: यूनानी पाठ केवल τὸν νόμον कहता है। व्यवस्थाविवरण से संकेत प्रबल है, पर उसे मुख्य पाठ में विस्तार देना मूल से आगे जाना होगा।
- issue: δειλοῖς में नैतिक निन्दा की मात्रा
  choice: ‘जो भयभीत हैं’
  alternative: ‘जो कायर हैं’ या ‘जो डरपोक हैं’
  rationale: यह चयन युद्ध के भय को बनाए रखता है, पर यह निश्चित नहीं करता कि लेखक हर ऐसे व्यक्ति पर नैतिक कायरता का आरोप लगा रहा है।
- issue: वितरणात्मक पुल्लिंग का हिन्दी रूप
  choice: ‘उनमें से हर एक ... अपने घर’
  alternative: ‘वे सब ... अपने-अपने घर’
  rationale: ‘हर एक’ यूनानी ἕκαστον की एक-एक व्यक्ति पर लागू होने वाली अभिव्यक्ति को सुरक्षित रखता है; सैन्य प्रसंग में पुरुष समूह निहित है, जबकि हिन्दी का आत्मवाचक ‘अपने’ अनावश्यक भारीपन से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सहज रूप। सूची की समानान्तर संरचना सुरक्षित रखी गई है। ‘व्यवस्था’ बाइबलीय νόμος के लिए परिचित शब्द है; ‘दाख की बारियाँ’ ἀμπελῶνας का स्पष्ट और स्वाभाविक रूप है।
