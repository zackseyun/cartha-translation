  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: hi
  text: और आपकी पवित्र वस्तुएँ रौंदी गई हैं और अपवित्र की गई हैं[a], और आपके याजक शोक और अपमान की दशा में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपका पवित्रस्थान’ अथवा ‘आपका पवित्र स्थान।’ यूनानी में यह बहुवचन है; शाब्दिक अर्थ ‘आपकी पवित्र वस्तुएँ’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: आपकी पवित्र वस्तुएँ
  rationale: यूनानी में नपुंसकलिंग बहुवचन है, जिसका अर्थ पवित्र वस्तुएँ या पवित्र स्थान हो सकता है। बहुवचन को बनाए रखने से मंदिर के पवित्र परिसर और समर्पित वस्तुओं—दोनों के व्यापक संकेत को संकुचित नहीं किया जाता।
- source_word: κατεπεπάτηται
  choice: रौंदी ... की गई हैं
  rationale: पूर्ण निष्क्रिय रूप पहले घट चुकी क्रिया के वर्तमान परिणाम को व्यक्त करता है। ‘रौंदी’ मूल के पैरों तले कुचलने के सशक्त बिंब को स्वाभाविक हिन्दी में रखता है।
- source_word: βεβήλωται
  choice: अपवित्र की गई हैं
  rationale: यह पवित्र को लौकिक या अशुद्ध ठहराने का भाव व्यक्त करता है। ‘अपवित्र करना’ आधुनिक हिन्दी में स्पष्ट है और ‘पवित्र वस्तुएँ’ के साथ अर्थपूर्ण विरोध बनाता है।
- source_word: οἱ ἱερεῖς σου
  choice: आपके याजक
  rationale: मंदिर में सेवा करने वाले पुरोहितों के लिए ‘याजक’ मानक और गरिमापूर्ण बाइबलीय हिन्दी है।
- source_word: ἐν πένθει
  choice: शोक ... में पड़े हैं
  rationale: पूर्वसर्गीय पद उनकी वर्तमान दशा बताता है। ‘शोक में पड़े हैं’ स्वाभाविक रूप से गहरे और जारी मातम की स्थिति व्यक्त करता है।
- source_word: ταπεινώσει
  choice: अपमान
  rationale: यहाँ शब्द दीनता, दबाव में लाई गई नीची दशा या सार्वजनिक अपमान का संकेत दे सकता है। प्रसंग में ‘अपमान’ सामाजिक दुर्दशा को स्पष्ट रखता है, बिना इसे केवल निजी विनम्रता मानने के।
theological_decisions:
- issue: τὰ ἅγιά σου का दायरा
  choice: परमेश्वर से संबंधित पवित्र वस्तुओं और पवित्र परिसर का व्यापक संकेत, जिसे बहुवचन में रखा गया है
  alternative: आपका पवित्रस्थान; आपका पवित्र स्थान
  rationale: यूनानी बहुवचन को एक ही मंदिर-भवन तक सीमित करना आवश्यक नहीं है। मुख्य पाठ व्यापक अर्थ सुरक्षित रखता है और पादटिप्पणी संभावित स्थानवाचक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट रखी गई है। परमेश्वर को संबोधन में आदरसूचक ‘आप’ अपनाया गया है। ‘पवित्र वस्तुएँ’ जानबूझकर कुछ व्यापक है ताकि मूल यूनानी की वास्तविक संदिग्धता बनी रहे।
