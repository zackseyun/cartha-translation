  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: hi
  text: पर जब उन्होंने उस छावनी को उसका सामना करने आती देखा,[a] तो उन्होंने यहूदा से कहा, “हम इतने थोड़े होकर इतनी बड़ी सेना से कैसे लड़ सकेंगे? आज बिना कुछ खाए हम निढाल हो चुके हैं।[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विरुद्ध आते।” यूनानी वाक्यांश का अधिक तटस्थ अनुवाद “उससे मिलने आते” हो सकता है, पर इस सैनिक प्रसंग में शत्रुतापूर्ण मुठभेड़ निहित है।
    reason: lexical_alternative
  - marker: b
    text: या “हम बहुत कमज़ोर हो गए हैं।” यूनानी शब्द शारीरिक रूप से निर्बल या मन से पस्त होने की दशा भी बता सकता है; यहाँ इसे भोजन न करने से जोड़ा गया है।
    reason: lexical_alternative
  - marker: c
    text: “बिना कुछ खाए” का अनुवाद “उपवास करते हुए” भी हो सकता है, पर मूल शब्द अपने आप में धार्मिक उपवास को अनिवार्य नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: छावनी
  rationale: सैनिक प्रसंग में यह शब्द छावनी अथवा छावनी में स्थित सैन्य-दल को दर्शा सकता है। ‘छावनी’ यूनानी की ठोस छवि बनाए रखता है, जबकि आगे ‘इतनी बड़ी सेना’ प्रसंगगत आशय स्पष्ट करता है।
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: उसका सामना करने आते
  rationale: वाक्यांश का मूल अर्थ उसकी ओर मुठभेड़ के लिए बढ़ना है। ‘सामना करने’ तटस्थ भेंट की अपेक्षा सैनिक प्रसंग को स्वाभाविक रूप से व्यक्त करता है, पर सीधे ‘आक्रमण’ नहीं जोड़ता।
- source_word: ὀλιγοστοὶ ὄντες
  choice: हम इतने थोड़े होकर
  rationale: यह उनकी अत्यल्प संख्या और सामने की विशाल सेना के साथ उसके जोरदार विरोध को व्यक्त करता है।
- source_word: πολεμῆσαι
  choice: लड़ सकेंगे
  rationale: इस तात्कालिक युद्ध-संदर्भ में यह सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: इतनी बड़ी सेना से
  rationale: πλῆθος मूलतः बड़ी संख्या या जनसमूह है; यहाँ वह विरोधी सैनिकों की विशाल संख्या को सूचित करता है। ‘सेना’ हिन्दी में प्रसंग को स्पष्ट और सहज रखता है।
- source_word: ἐκλελύμεθα
  choice: हम निढाल हो चुके हैं
  rationale: पूर्णकालिक रूप वर्तमान में पहुँची हुई दुर्बलता या शिथिलता की दशा बताता है। ‘निढाल’ भूखे रहने से आई शारीरिक कमजोरी को सहज रूप से व्यक्त करता है।
- source_word: ἀσιτοῦντες
  choice: बिना कुछ खाए
  rationale: कृदन्त का सीधा अर्थ भोजन न करना है। यह धार्मिक उपवास का अनावश्यक अर्थ जोड़े बिना स्थिति स्पष्ट करता है।
- source_word: σήμερον
  choice: आज
  rationale: यह सामान्य आधुनिक हिन्दी में समयसूचक शब्द का सीधा समतुल्य है।
