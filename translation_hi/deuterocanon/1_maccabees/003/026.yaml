  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: hi
  text: और उसका नाम राजा तक भी जा पहुँचा[a], और हर राष्ट्र यहूदा के युद्ध-व्यूहों की चर्चा करता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अक्षरशः, “उसका नाम राजा के निकट तक आया”; यहाँ “नाम” से उसकी ख्याति या प्रसिद्धि का आशय है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश कठिन है; अक्षरशः इसमें “हर युद्ध-व्यूह के संबंध में” जैसा भाव है। इसका अर्थ यहूदा के युद्ध-व्यूहों, सैन्य अभियानों या विजयों की चर्चा करना हो सकता है। कुछ व्याख्याएँ इसमें तुलनात्मक भाव (“हर युद्ध-व्यूह से बढ़कर”) भी देखती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: राजा तक भी जा पहुँचा
  rationale: ἤγγισεν का मूल भाव ‘निकट आया’ है, पर ἕως के साथ यहाँ किसी समाचार या ख्याति के राजा तक पहुँचने का स्वाभाविक हिन्दी मुहावरा उपयुक्त है। ‘भी’ उस दूरगामी पहुँच पर बल देता है।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उसका नाम
  rationale: यूनानी में अक्षरशः ‘उसका नाम’ है। प्रसंग में इसका आशय ख्याति से है, फिर भी मूल बिंब बनाए रखने के लिए ‘नाम’ रखा गया है।
- source_word: ὑπὲρ πᾶν παράταξιν
  choice: हर युद्ध-व्यूह से बढ़कर
  rationale: παράταξις सुसज्जित युद्ध-पंक्ति या सैन्य व्यूह है, और कर्मकारक के साथ ὑπέρ सामान्यतः ‘से ऊपर/से बढ़कर’ का भाव देता है। वाक्यांश कठिन और संक्षिप्त है, इसलिए तुलनात्मक बल मुख्य पाठ में रखा गया और अन्य संभावनाएँ टिप्पणी में दी गई हैं।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: यहाँ संदर्भ यहूदा मक्काबी से है। आधुनिक हिन्दी बाइबलीय परंपरा में Ἰούδα के लिए ‘यहूदा’ ऐतिहासिक रूप से स्पष्ट और परिचित रूप है।
- source_word: ἐξηγεῖτο
  choice: बखान करती थी
  rationale: क्रिया का अर्थ विस्तार से कहना, वर्णन करना या सुनाना हो सकता है। अपूर्णकाल निरंतर चर्चा का संकेत देता है; ‘बखान करती थी’ वर्णन और प्रशंसात्मक ख्याति—दोनों संभावनाओं को समेटता है।
- source_word: πᾶν ἔθνος
  choice: हर जाति
  rationale: एकवचन वितरणात्मक पद का सीधा अनुवाद है। यहाँ ‘जाति’ का अर्थ जनसमुदाय या राष्ट्र है।
theological_decisions:
- issue: Ἰούδα की पहचान
  choice: मुख्य पाठ में ‘यहूदा’
  alternative: ‘यहूदा मक्काबी’
  rationale: प्रसंग में व्यक्ति स्पष्ट है, इसलिए मूल पाठ में न आया उपनाम जोड़ना आवश्यक नहीं। इससे ऐतिहासिक पहचान बनी रहती है और पाठ में विस्तार भी नहीं जोड़ा जाता।
- issue: ὑπὲρ πᾶν παράταξιν की कठिन तुलनात्मक रचना
  choice: ‘हर युद्ध-व्यूह से बढ़कर’ के रूप में तुलनात्मक बल बनाए रखना
  alternative: ‘यहूदा के युद्ध-व्यूहों/युद्धों की चर्चा’
  rationale: यूनानी ὑπέρ के साथ कर्मकारक तुलनात्मक या अतिक्रमण का भाव देता है। केवल ‘यहूदा के युद्धों की चर्चा’ कहना कठिन मूल रचना को चुपचाप सरल कर देता; इसलिए मुख्य पाठ में तनाव रखा गया है और वैकल्पिक समझ टिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘युद्ध-व्यूह’ सैन्य अर्थ को स्पष्ट करता है, जबकि टिप्पणियाँ मूल यूनानी की वास्तविक कठिनाई और संभावित वैकल्पिक अर्थ सुरक्षित रखती हैं।
