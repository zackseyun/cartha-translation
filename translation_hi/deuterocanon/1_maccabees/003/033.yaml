lexical_decisions:
- source_word: τρέφειν
  choice: पालन-पोषण करने
  rationale: τρέφειν का अर्थ खिलाना, पालना या भरण-पोषण करना हो सकता है। राजदरबार के इस संदर्भ में यह केवल भोजन देने से व्यापक है और राजा की अनुपस्थिति में उसके पुत्र की देखभाल तथा आवश्यकताओं की पूर्ति को व्यक्त करता है।
- source_word: Ἀντίοχον
  choice: अन्तियोकुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपने पुत्र
  rationale: यूनानी पदबंध पुत्र-संबंध और अधिकार-सूचक सर्वनाम दोनों को स्पष्ट करता है; हिन्दी में ‘अपने पुत्र’ स्वाभाविक रूप से उसी व्यक्ति की ओर संकेत करता है जो लौटेगा।
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: अपने लौटने तक
  rationale: ἕως के साथ प्रयुक्त क्रियार्थक संज्ञा समय-सीमा, अर्थात लौटने तक, बताती है। αὐτόν का सबसे स्वाभाविक संदर्भ अनुपस्थित राजा है; संक्षिप्त हिन्दी पदबंध मूल की संरचना और संदर्भगत अर्थ को सुरक्षित रखता है।
