    text: या ‘अपने जीवन’ अथवा ‘अपनी आत्माओं’। यूनानी शब्द का अर्थ ‘जीवन/प्राण’ और ‘आत्मा’ दोनों हो सकता है; युद्ध के इस प्रसंग में जीवन का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने कानूनों’ अथवा ‘अपनी पैतृक रीति-विधियों’।
