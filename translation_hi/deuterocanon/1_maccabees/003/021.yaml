lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: परन्तु हम
  rationale: δέ पिछले कथन के साथ विरोध दिखाता है, और स्पष्ट ἡμεῖς कर्ता पर बल देता है; ‘परन्तु हम’ दोनों बातों को बनाए रखता है।
- source_word: πολεμοῦμεν
  choice: लड़ रहे हैं
  rationale: वर्तमान काल का यह क्रिया-रूप युद्ध करने या लड़ने का अर्थ देता है; प्रसंग में जारी और तात्कालिक संघर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περὶ
  choice: के लिए
  rationale: πολεμέω के साथ περί संघर्ष के कारण या दाँव पर लगी वस्तु को दर्शाता है; हिन्दी में ‘के लिए’ इसका सहज रूप है।
- source_word: τῶν ψυχῶν ἡμῶν
  choice: अपने प्राणों
  rationale: ψυχή का अर्थ ‘जीवन’ या ‘प्राण’ के साथ ‘आत्मा’ भी हो सकता है। युद्ध के प्रसंग में ‘प्राण’ जीवन-रक्षा का ठोस अर्थ देता है और मूल की अर्थ-छाया को भी बनाए रखता है।
- source_word: τῶν νομίμων ἡμῶν
  choice: अपनी विधियों
  rationale: νόμιμα में कानून से स्थापित नियमों, रीति-विधियों और पैतृक धार्मिक आचारों का व्यापक भाव है। ‘विधियों’ से कानूनी और धार्मिक-आचार संबंधी दोनों आयाम बने रहते हैं।
theological_decisions:
- issue: युद्ध के प्रसंग में ψυχαί का अर्थ
  choice: अपने प्राणों
  alternative: अपने जीवन / अपनी आत्माओं
  rationale: यहाँ सशस्त्र संघर्ष और जीवन की रक्षा मुख्य प्रसंग है। ‘प्राणों’ से ठोस जीवन का अर्थ प्रधान रहता है, जबकि पादटिप्पणी मूल शब्द की ‘आत्माओं’ वाली सम्भावना सुरक्षित रखती है।
- issue: νόμιμα का दायरा
  choice: अपनी विधियों
  alternative: अपने कानूनों / अपनी पैतृक रीति-विधियों
  rationale: यह शब्द केवल नागरिक कानूनों तक सीमित नहीं, बल्कि स्थापित पैतृक और धार्मिक आचारों को भी समेट सकता है। ‘विधियों’ उस व्यापकता को संक्षेप में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘प्राणों’ युद्ध और जीवन-रक्षा के प्रसंग में स्वाभाविक है; ‘विधियों’ νόμιμα के कानूनी तथा पैतृक-धार्मिक दोनों आयामों को खुला रखता है।
