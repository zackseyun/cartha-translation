  text: हम उनके सामने कैसे टिक सकेंगे[a], यदि तू हमारी सहायता न करे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका सामना कर सकेंगे”; या, “उनके विरुद्ध टिक सकेंगे।” यूनानी अभिव्यक्ति में संघर्ष के समय विरोधियों का सामना करने और उनके सामने डटे रहने—दोनों का भाव हो सकता है।
