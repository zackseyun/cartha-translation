lexical_decisions:
- source_word: πῶς δυνησόμεθα
  choice: हम कैसे टिक सकेंगे
  rationale: प्रश्नवाचक πῶς और भविष्यकालीन सामर्थ्य व्यक्त करने वाले δυνησόμεθα को स्वाभाविक हिन्दी में ‘कैसे … सकेंगे’ से व्यक्त किया गया है।
- source_word: ὑποστῆναι
  choice: टिक
  rationale: युद्ध-संघर्ष के प्रसंग में इसका अर्थ केवल खड़े होना नहीं, बल्कि सामना करते हुए अपने स्थान पर बने रहना भी है। ‘टिक’ इस भाव को संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: उनके सामने
  rationale: यह यूनानी पदबंध प्रत्यक्ष रूप से विरोधियों का सामना करने का भाव रखता है। ‘उनके सामने’ मूल बिंब को बनाए रखता है, जबकि संघर्षसूचक अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἐὰν μὴ
  choice: यदि … न
  rationale: नकारात्मक शर्त को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; पूरे वाक्य में इसका अर्थ ‘जब तक नहीं/यदि नहीं’ है।
- source_word: σὺ βοηθήσῃς ἡμῖν
  choice: तू हमारी सहायता न करे
  rationale: स्पष्ट σὺ के बल को प्रत्यक्ष एकवचन सम्बोधन ‘तू’ से सुरक्षित रखा गया है। βοηθέω के लिए ‘सहायता करना’ प्रार्थनापूर्ण प्रसंग में स्वाभाविक और अर्थसंगत है।
theological_decisions:
- issue: सैन्य संकट में परमेश्वर से सीधी विनती
  choice: परमेश्वर पर निर्भरता को सीधे दूसरे पुरुष के सम्बोधन में रखा गया है, बिना विजय या किसी अतिरिक्त प्रतिज्ञा का उल्लेख जोड़े।
  alternative: यदि तू हमारी सहायता के लिए न आए, तो हम उनका सामना कैसे कर सकेंगे?
  rationale: मूल यूनानी केवल सहायता के बिना विरोधियों के सामने टिक पाने की असमर्थता व्यक्त करता है। अनुवाद इसी निर्भरता को सुरक्षित रखता है और अस्पष्टता को विजय की निश्चितता में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनापूर्ण है। ‘तू’ से मूल के एकवचन, प्रत्यक्ष और बलयुक्त सम्बोधन को रखा गया है; इसका प्रयोग यहाँ श्रद्धापूर्ण धार्मिक सम्बोधन के रूप में है।
