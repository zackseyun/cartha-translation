base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: hi
  text: और यरूशलेम निर्जन था, मानो कोई उजाड़ प्रदेश हो। उसकी संतान में से कोई भीतर आने या बाहर जाने वाला न था[a]। पवित्रस्थान पैरों तले रौंदा जा रहा था, और गढ़[b] में परदेशियों के पुत्र थे; वह राष्ट्रों के लिए ठहरने का स्थान था। याकूब से आनंद छिन गया, और बाँसुरी तथा वीणा का स्वर थम गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी संतान’ का अर्थ यहाँ संभवतः उसमें जन्मे लोग, अर्थात उसके निवासी हैं। यूनानी शब्द का शाब्दिक अर्थ ‘संतान’ या ‘उत्पन्न हुई चीज़ें’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अक्रा’; यरूशलेम में स्थित किलेबंद दुर्ग का नाम।
    reason: historical_alternative
lexical_decisions:
- source_word: ἀοίκητος ὡς ἔρημος
  choice: निर्जन था, मानो जंगल हो
  rationale: ἀοίκητος का ठोस अर्थ निवासियों से रहित होना है, जबकि ἔρημος निर्जन वनप्रदेश या उजाड़ स्थान का बिंब देता है। यह अनुवाद दोनों को अलग रखते हुए उपमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: उसकी संतान में से
  rationale: γενημάτων का शाब्दिक अर्थ उत्पन्न हुई चीज़ें या संतान है। प्रसंग में नगर से उत्पन्न अथवा उसमें जन्मे लोग अभिप्रेत हो सकते हैं; मुख्य पाठ मूल की असामान्य अभिव्यक्ति को बनाए रखता है और अर्थ-स्पष्टीकरण पादटिप्पणी में देता है।
- source_word: ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह पवित्र स्थल अथवा मंदिर-परिसर को सूचित करता है। ‘पवित्रस्थान’ अर्थ की धार्मिक विशिष्टता को बनाए रखते हुए आधुनिक हिन्दी में सुबोध है।
- source_word: καταπατούμενον
  choice: पैरों तले रौंदा जा रहा था
  rationale: शब्द में वास्तविक रूप से कुचले जाने और अपमानित किए जाने, दोनों का बल है। केवल ‘अपवित्र किया जा रहा था’ कहने से भौतिक बिंब खो जाता।
- source_word: υἱοὶ ἀλλογενῶν
  choice: परदेशियों के पुत्र
  rationale: यूनानी पद केवल ‘परदेशी’ नहीं, बल्कि शाब्दिक रूप से ‘दूसरे कुल/देश के लोगों के पुत्र’ कहता है। हिन्दी में ‘परदेशियों के पुत्र’ इस विशिष्ट रूप को सुरक्षित रखता है।
- source_word: ἄκρα
  choice: गढ़
  rationale: यह यरूशलेम के किलेबंद दुर्ग को सूचित करता है। ‘गढ़’ संक्षिप्त और सहज है; ऐतिहासिक नाम ‘अक्रा’ पादटिप्पणी में रखा गया है।
- source_word: κατάλυμα ἐν τοῖς ἔθνεσιν
  choice: राष्ट्रों के लिए ठहरने का स्थान
  rationale: κατάλυμα निवास, पड़ाव या ठहरने की जगह है। ἐν τοῖς ἔθνεσιν का संबंध कुछ कठिन है; ‘राष्ट्रों के लिए’ यूनानी के निकट रहते हुए ‘गैर-यहूदियों’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἐξῆρθη τέρψις
  choice: आनंद छिन गया
  rationale: τέρψις सुख, हर्ष या आनंद को दर्शाता है और ἐξῆρθη उसके हटा लिए जाने को। ‘छिन गया’ स्वाभाविक हिन्दी में उस हानि का बल व्यक्त करता है।
- source_word: αὐλὸς καὶ κινύρα
  choice: बाँसुरी तथा वीणा
  rationale: αὐλός एक फूँककर बजाया जाने वाला पाइप या बाँसुरी है और κινύρα तार वाला वाद्य, वीणा अथवा हार्प है। हिन्दी पाठक के लिए ‘बाँसुरी तथा वीणा’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: नगर की ‘संतान’ संबंधी असामान्य अभिव्यक्ति
  choice: उसकी संतान में से
  alternative: उसके निवासियों में से / उसमें जन्मे लोगों में से
  rationale: मूल यूनानी γενημάτων को हटाकर केवल ‘उसमें से’ कहना पाठ के एक वास्तविक शब्द और उसकी अस्पष्टता को मिटा देता। मुख्य पाठ शाब्दिक रूप रखता है, जबकि संभावित प्रासंगिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἄκρα को सामान्य संज्ञा या ऐतिहासिक नाम के रूप में प्रस्तुत करना
  choice: गढ़
  alternative: अक्रा
  rationale: सामान्य पाठक के लिए अर्थ का अनुवाद मुख्य पाठ में अधिक स्पष्ट है, पर ऐतिहासिक स्थाननाम को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἔθνεσιν का अनुवाद
  choice: राष्ट्रों
  alternative: गैर-यहूदियों
  rationale: प्रसंग में गैर-यहूदी शक्तियाँ अभिप्रेत हो सकती हैं, किंतु यूनानी पद मूलतः ‘राष्ट्रों’ कहता है। मुख्य पाठ अधिक तटस्थ शब्द रखता है और धार्मिक वर्गीकरण को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पठनीयता के लिए छोटे खंडों में बाँटा गया है। ‘परदेशियों के पुत्र’ और ‘उसकी संतान’ जैसी कुछ असामान्य संरचनाएँ जानबूझकर रखी गई हैं, क्योंकि वे यूनानी पाठ की विशिष्टता और अस्पष्टता को वहन करती हैं। अंतिम पद में ‘स्वर’ जोड़ा गया है ताकि हिन्दी में वाद्यों के ‘थमने’ का आशय स्वाभाविक हो, बिना मूल अर्थ बदले।
