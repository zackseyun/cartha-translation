  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: hi
  text: और अपोल्लोनियुस ने अन्यजातियों को इकट्ठा किया, और सामरिया से इस्राएल के विरुद्ध युद्ध करने के लिए एक बड़ी सेना इकट्ठी की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: इकट्ठा किया / जुटाई
  rationale: क्रिया का अर्थ लोगों को एक साथ लाना है। हिन्दी में अलग-अलग कर्मों के साथ स्वाभाविक अभिव्यक्ति के लिए जातियों के लिए ‘इकट्ठा किया’ और सेना के लिए ‘जुटाई’ प्रयुक्त हुआ है।
- source_word: ἔθνη
  choice: गैर-इस्राएली जातियों
  rationale: इस यहूदी युद्ध-वृत्तांत में यह शब्द सामान्यतः इस्राएल से भिन्न जातीय समूहों को सूचित करता है। यह अनुवाद संदर्भगत विरोध को स्पष्ट रखता है, पर ‘मूर्तिपूजक’ जैसा अतिरिक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: δύναμιν μεγάλην
  choice: एक बड़ी सेना
  rationale: यहाँ δύναμις प्रसंगानुसार सैन्य बल या सैनिक दल है। ‘एक बड़ी सेना’ साधारण हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοῦ πολεμῆσαι
  choice: युद्ध करने के लिए
  rationale: सव्ययी क्रियार्थक रूप उद्देश्य व्यक्त करता है। ‘युद्ध करने के लिए’ संगठित सैन्य कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς Ἰσραήλ
  choice: इस्राएल से
  rationale: πολεμέω के साथ πρὸς शत्रुतापूर्ण संबंध बताता है। हिन्दी में ‘इस्राएल से युद्ध करना’ इसका स्वाभाविक रूप है।
- source_word: ἀπὸ Σαμαρίας
  choice: सामरिया से
  rationale: पूर्वसर्ग सैन्य बल के स्रोत या उद्गम को दर्शाता है।
theological_decisions:
- issue: यहूदी युद्ध-प्रसंग में ἔθνη का अनुवाद
  choice: गैर-इस्राएली जातियाँ
  alternative: अन्यजातियाँ; राष्ट्र
  rationale: पद में इन समूहों का इस्राएल से विरोध है। ‘गैर-इस्राएली जातियाँ’ इस जातीय-सामुदायिक भेद को स्पष्ट करता है, जबकि ‘राष्ट्र’ अत्यधिक सामान्य और ‘मूर्तिपूजक’ अनावश्यक रूप से धार्मिक अर्थ वाला हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक रूप। यूनानी वाक्य के दो कर्मों को हिन्दी में स्वाभाविक बनाने के लिए ‘भी’ और दो संगत क्रियाएँ प्रयुक्त की गई हैं; कोई अतिरिक्त धार्मिक पहचान आरोपित नहीं की गई।
