- from: और अपोल्लोनियुस ने गैर-इस्राएली जातियों[a] को इकट्ठा किया, और इस्राएल से युद्ध करने के लिए सामरिया से एक बड़ी सेना भी जुटाई।
  to: और अपोल्लोनियुस ने अन्यजातियों को इकट्ठा किया, और सामरिया से इस्राएल के विरुद्ध युद्ध करने के लिए एक बड़ी सेना इकट्ठी की।
  rationale: संशोधन πρὸς Ἰσραήλ के शत्रुतापूर्ण अर्थ को ‘इस्राएल के विरुद्ध’ द्वारा स्पष्ट करता है और ἔθνη के लिए अधिक स्वाभाविक, स्थापित हिन्दी पद ‘अन्यजातियों’ अपनाता है। ‘इकट्ठी की’ मूल की एक ही क्रिया συνήγαγεν के अंतर्गत दोनों कर्मों के समन्वय को बनाए रखता है।
