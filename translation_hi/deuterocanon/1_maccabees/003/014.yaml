base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: hi
  text: और उसने कहा, “मैं अपना नाम करूँगा और राज्य में महिमा पाऊँगा। मैं यहूदा[a] और उसके साथियों से युद्ध करूँगा, जो राजा के वचन[b] को तुच्छ समझते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यहूदा मकाबी; नाम का रूप ‘यूदास’ भी लिखा जाता है।
    reason: नाम की पहचान और वैकल्पिक रूप स्पष्ट करना।
  - marker: b
    text: या “राजा की आज्ञा” अथवा “राजा के राजादेश”।
    reason: λόγος के प्रसंगगत वैकल्पिक अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: मैं अपना नाम करूँगा
  rationale: यह यूनानी मुहावरा अपने लिए यश या प्रतिष्ठा अर्जित करने को व्यक्त करता है। हिन्दी का ‘अपना नाम करना’ उसी आत्म-प्रतिष्ठा के भाव को सहज रूप से रखता है।
- source_word: δοξασθήσομαι
  choice: महिमा पाऊँगा
  rationale: भविष्यत् कर्मवाच्य रूप को स्वाभाविक हिन्दी में रखते हुए महिमा/सम्मान का मूल अर्थ सुरक्षित रहता है।
- source_word: ἐν τῇ βασιλείᾳ
  choice: राज्य में
  rationale: βασιλεία का सीधा अर्थ ‘राज्य’ है; मूल पाठ इससे अधिक विशिष्ट नहीं है।
- source_word: πολεμήσω
  choice: युद्ध करूँगा
  rationale: यह सैन्य संघर्ष का स्पष्ट और संक्षिप्त हिन्दी रूप है।
- source_word: τὸν Ἰούδαν
  choice: यहूदा
  rationale: यहाँ यूनानी नाम यहूदा मकाबी नामक व्यक्ति को सूचित करता है; हिन्दी बाइबलीय नाम-परंपरा के अनुरूप ‘यहूदा’ रखा गया है।
- source_word: τοὺς σὺν αὐτῷ
  choice: उसके साथियों
  rationale: यह वाक्यांश उसके साथ रहने या उसका पक्ष लेने वालों को बताता है, बिना उनकी भूमिका को अनावश्यक रूप से अधिक विशिष्ट किए।
- source_word: τοὺς ἐξουθενοῦντας
  choice: तुच्छ समझते हैं
  rationale: ἐξουθενέω में किसी को नगण्य मानने, उसका तिरस्कार करने या उसे ठुकराने का प्रबल भाव है; ‘तुच्छ समझना’ इस तीव्रता को ‘अनदेखा करना’ से बेहतर सुरक्षित रखता है।
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: राजा के वचन
  rationale: λόγος का मूल अर्थ ‘वचन’ है, यद्यपि प्रसंग में इससे राजा की आज्ञा या राजादेश अभिप्रेत हो सकता है।
theological_decisions:
- issue: Ἰούδαν की पहचान
  choice: व्यक्तिगत नाम ‘यहूदा’, अर्थात यहूदा मकाबी
  alternative: ‘यूदास’ अथवा ‘जूडस’
  rationale: यह कोई सैद्धान्तिक निर्धारण नहीं, बल्कि नाम-रूप का प्रश्न है। यूनानी पद यहाँ मकाबी नेता को सूचित करता है; हिन्दी बाइबलीय परंपरा में ‘यहूदा’ अधिक स्वाभाविक है।
- issue: राजा के λόγος का आशय
  choice: मुख्य पाठ में ‘राजा का वचन’
  alternative: ‘राजा की आज्ञा’ या ‘राजा का राजादेश’
  rationale: मूल की शाब्दिक व्यापकता बनाए रखने के लिए ‘वचन’ रखा गया है, जबकि प्रसंगगत प्रशासनिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपना नाम करना’ स्वाभाविक हिन्दी मुहावरा है; ‘महिमा पाना’ मूल के महिमा-संबंधी शब्द-क्षेत्र को बनाए रखता है।
