  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
translation:
  language: hi
  text: और वह यहूदा के नगरों में होकर गया, और वहाँ के अभक्तों[a] का नाश किया, और इस्राएल से क्रोध[b] टाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्मियों’ अथवा ‘दुष्टों’।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में ‘क्रोध’ से संभवतः परमेश्वर का क्रोध अभिप्रेत है, यद्यपि इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं आया है।
    reason: alternative_reading
lexical_decisions:
- source_word: διῆλθεν
  choice: घूमता रहा
  rationale: यह क्रिया विभिन्न नगरों से होकर जाने या पूरे क्षेत्र में भ्रमण करने का भाव देती है। प्रसंग में ‘घूमता रहा’ लगातार किए गए अभियान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πόλεσιν Ἰούδα
  choice: यहूदा के नगरों में
  rationale: πόλις नगर या कस्बे को सूचित कर सकता है; यहाँ बहुवचन और क्षेत्रवाचक संबंध के लिए ‘यहूदा के नगरों में’ सीधा और स्वाभाविक है।
- source_word: ἐξωλόθρευσεν
  choice: नाश किया
  rationale: यह प्रबल क्रिया विनाश करके हटा देने का अर्थ रखती है। ‘नाश किया’ इसकी कठोरता बनाए रखता है, पर विनाश के साधन को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: ἀσεβής परमेश्वर और धार्मिक-नैतिक व्यवस्था के प्रति अनादर या अभक्ति का बोध कराता है। ‘भक्तिहीन’ इस धार्मिक अर्थ को सामान्य ‘दुष्ट’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: ἐπʼ αὐτῆς
  choice: उसमें से
  rationale: स्त्रीलिंग सर्वनाम का स्वाभाविक संकेत यहूदा को भूमि या क्षेत्र के रूप में है। ‘उसमें से’ मूल के सर्वनाम को बनाए रखता है और ‘भूमि’ जैसा अस्पष्ट संज्ञा-विस्तार नहीं जोड़ता।
- source_word: ἀπέστρεψεν ὀργὴν
  choice: क्रोध टाल दिया
  rationale: इस वाक्यांश का अर्थ क्रोध को हटा देना या उससे बचा लेना है। ‘क्रोध टाल दिया’ हिन्दी में स्वाभाविक है और यूनानी मुहावरे का आशय सुरक्षित रखता है।
- source_word: ἀπὸ Ἰσραήλ
  choice: इस्राएल पर से
  rationale: यह इस्राएल को उस समुदाय के रूप में दिखाता है जिस पर से क्रोध हटाया गया। ‘इस्राएल पर से’ हिन्दी में इस संबंध को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के संबंध में ‘क्रोध’ का आशय
  choice: मुख्य पाठ केवल ‘क्रोध’ कहता है और यह स्पष्ट नहीं करता कि वह किसका क्रोध है।
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर का क्रोध’ कहना, या सामान्य विपत्ति अथवा इस्राएल के विरुद्ध रोष समझना।
  rationale: यहूदी शास्त्रीय प्रसंग में ὀργή से संभवतः परमेश्वर का क्रोध अभिप्रेत है, पर इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं आया। इसलिए मुख्य पाठ धार्मिक तनाव और मूल की अनिर्दिष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘भक्तिहीन’ धार्मिक-नैतिक अर्थ को सुरक्षित रखता है; फुटनोट सामान्य वैकल्पिक शब्द देता है। मूल यूनानी में निहित अनिर्दिष्टता को बनाए रखने के लिए मुख्य पाठ में ‘परमेश्वर का’ नहीं जोड़ा गया।
