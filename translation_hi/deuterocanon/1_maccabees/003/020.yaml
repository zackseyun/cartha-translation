translation:
  language: hi
  text: वे घमंड और अधर्म से भरी बड़ी भीड़ के साथ हम पर चढ़े आ रहे हैं[a], ताकि हमें, हमारी पत्नियों और हमारे बच्चों को मिटा दें और हमें लूट लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे घमंड और अधर्म की बहुतायत के साथ हम पर चढ़े आ रहे हैं।” यूनानी वाक्यांश में ‘बड़ी भीड़’ और ‘घमंड तथा अधर्म’ का संबंध व्याकरण की दृष्टि से संक्षिप्त है; मुख्य पाठ में बड़ी शत्रु-भीड़ को इन गुणों से युक्त समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: वे हम पर चढ़े आ रहे हैं
  rationale: सैनिक प्रसंग में πρός का भाव विरोधी दिशा का है। ‘हम पर चढ़े आ रहे हैं’ शत्रुतापूर्ण आगे बढ़ने को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  choice: घमंड और अधर्म की भारी भीड़ के साथ
  rationale: 'यह वाक्यांश असामान्य यूनानी संरचना को यथासंभव बनाए रखता है: πλήθει विशाल समूह/बहुलता को, ὕβρις उद्दंड और हिंसक घमंड को, तथा ἀνομία व्यवस्था और धर्म-विधान की अवहेलना को सूचित करता है।'
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: ताकि हमें ... मिटा दें
  rationale: सप्रत्यय क्रियारूप उद्देश्य बताता है और ἐξαίρω यहाँ पूर्णतः हटा या नष्ट कर देने का अर्थ रखता है। ‘मिटा दें’ नियोजित सर्वनाश की तीव्रता बनाए रखता है।
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: हमारी पत्नियों और हमारे बच्चों को
  rationale: स्वत्वसूचक सर्वनाम के साथ γυναῖκες का प्रसंगानुकूल अर्थ ‘पत्नियाँ’ है; τέκνα का सीधा अर्थ ‘बच्चे’ है।
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: हमें लूट लें
  rationale: σκυλεύω युद्ध में पराजितों का माल छीनने या उन्हें लूटने को सूचित करता है। ‘लूट लें’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
