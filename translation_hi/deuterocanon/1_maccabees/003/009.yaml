  text: और उसका नाम पृथ्वी के छोर तक प्रसिद्ध हो गया,[a] और उसने नाश हो रहे लोगों को इकट्ठा किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका नाम पृथ्वी के छोर तक लिया गया।” यहाँ यूनानी मुहावरा उसके नाम या ख्याति के दूर-दूर तक फैलने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “विनाश के कगार पर पड़े लोगों” या “बरबाद हो रहे लोगों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: उसका नाम … प्रसिद्ध हो गया
  rationale: यूनानी क्रिया का शाब्दिक अर्थ ‘उसका नाम लिया गया/वह कहलाया’ है, पर इस प्रसंग में यह उसके नाम या यश के दूर-दूर तक फैलने का मुहावरा है। यह अनुवाद अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘नाम’ की मूल छवि बनाए रखता है।
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: पृथ्वी के छोर तक
  rationale: यह दूर से दूर स्थान तक पहुँचने का व्यापक मुहावरा है। एकवचन यूनानी रूप को हिन्दी में स्वाभाविक ‘छोर तक’ से व्यक्त किया गया है।
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: क्रिया का सीधा अर्थ लोगों को एकत्र या साथ लाना है; ‘इकट्ठा किया’ सामान्य, स्पष्ट और प्रसंगानुकूल है।
- source_word: ἀπολλυμένους
  choice: नाश हो रहे लोगों को
  rationale: वर्तमान कृदन्त उन लोगों की जारी संकटपूर्ण दशा बताता है जो विनाश, मृत्यु या बरबादी की ओर जा रहे थे। यह किसी विशिष्ट धर्मवैज्ञानिक अर्थ में ‘खोए हुए’ कहने से बचता है।
