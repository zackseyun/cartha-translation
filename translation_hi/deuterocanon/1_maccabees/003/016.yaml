lexical_decisions:
- source_word: ἤγγισεν
  choice: आ पहुँचा
  rationale: ἐγγίζω के अओरिस्ट रूप में किसी स्थान के निकट आने का भाव है; ἕως के साथ हिंदी में ‘तक आ पहुँचा’ गति और सीमा दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕως ἀναβάσεως
  choice: चढ़ाई तक
  rationale: ἕως संबंधसूचक रूप के साथ पहुँच की सीमा बताता है, और ἀνάβασις यहाँ ऊपर जाने वाले मार्ग या चढ़ाई को सूचित करता है।
- source_word: Μεθωρών
  choice: बेथ-होरोन
  rationale: यूनानी पाठ का Μεθωρών उस स्थान के प्रचलित नाम बेथ-होरोन को दर्शाता है; मुख्य पाठ में परिचित भौगोलिक नाम रखा गया है और पाठरूप की भिन्नता पाद-टिप्पणी में बताई गई है।
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: ἐξέρχομαι का मूल अर्थ बाहर जाना या निकलना है; ‘कूच किया’ जैसी अभिव्यक्ति मूल क्रिया से अधिक सैन्य रंग जोड़ती।
- source_word: εἰς συνάντησιν αὐτῷ
  choice: उसका सामना करने
  rationale: यह मुहावरा किसी से मिलने या उसका सामना करने के लिए आगे निकलने को व्यक्त करता है। युद्ध-संदर्भ में ‘सामना करने’ स्वाभाविक है और टकराव की स्थिति को दर्शाता है।
- source_word: ὀλίγος
  choice: केवल थोड़े-से लोगों के साथ
  rationale: एकवचन विशेषण विधेयात्मक रूप से यहूदा के साथ बहुत कम संख्या होने का संकेत देता है। सहज हिंदी में निहित साथियों को ‘लोगों’ द्वारा स्पष्ट किया गया है, जबकि ‘केवल’ उनकी अल्प संख्या पर बल बनाए रखता है।
