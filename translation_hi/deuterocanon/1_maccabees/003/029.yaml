  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: hi
  text: और उसने देखा कि राजकोषों में चाँदी समाप्त हो गई थी और देश के कर-राजस्व कम थे, उस फूट और उस विपत्ति के कारण जो उसने देश पर पुराने समय से चले आ रहे नियमों को हटाने के लिए लाई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  choice: भंडारों में चाँदी समाप्त हो गई थी
  rationale: ἐκλείπω यहाँ धन के चुक जाने को व्यक्त करता है। बहुवचन θησαυρῶν के लिए ‘भंडारों’ रखा गया है और ἀργύριον का ठोस अर्थ ‘चाँदी’ सुरक्षित है।
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: देश से मिलने वाला कर बहुत कम हो गया था
  rationale: φόροι राजस्व-संबंधी कर या देय राशियों को सूचित करता है। हिंदी में ‘कर बहुत कम हो गया था’ मात्रा का स्वाभाविक बोध देता है; χώρα का संबंध ‘देश से मिलने वाला’ द्वारा स्पष्ट होता है।
- source_word: χάριν τῆς διχοστασίας καὶ πληγῆς
  choice: फूट और विपत्ति के कारण
  rationale: διχοστασία के लिए ‘फूट’ सामाजिक-राजनीतिक विभाजन का स्वाभाविक हिंदी रूप है। πληγή का शाब्दिक अर्थ प्रहार भी हो सकता है, पर यहाँ भूमि पर आई हानि या विपत्ति का व्यापक अर्थ प्रसंगानुकूल है।
- source_word: ἧς κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: उसने देश में … उत्पन्न कर दी थी
  rationale: क्रिया को उसके संयुक्त संबंधक पदों ‘फूट और विपत्ति’ के साथ हिंदी में स्वाभाविक रूप दिया गया है और कर्ता की जिम्मेदारी स्पष्ट रखी गई है।
- source_word: τοῦ ἆραι τὰ νόμιμα
  choice: नियमों को हटाकर
  rationale: τοῦ ἆραι को यहाँ हानि उत्पन्न होने के साधन या परिस्थिति के रूप में समझते हुए ‘हटाकर’ कहा गया है। νόμιμα स्थापित विधियों, रीति-नियमों या अध्यादेशों को सूचित करता है; ‘नियम’ इसकी अर्थगत व्यापकता बनाए रखता है।
- source_word: ἀφʼ ἡμερῶν τῶν πρώτων
  choice: पुराने समय से चले आ रहे
  rationale: यह अभिव्यक्ति बहुत पहले से विद्यमान व्यवस्था को सूचित करती है। ‘पुराने समय से चले आ रहे’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
