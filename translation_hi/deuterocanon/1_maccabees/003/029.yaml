translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण पर सहज गद्य रखा गया है। यूनानी वाक्य का कारण-संबंध सुरक्षित है, जबकि शब्दक्रम को स्वाभाविक हिंदी के अनुरूप बदला गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रमुख अर्थगत विस्तार मुख्य पाठ में बिना अतिव्याख्या के व्यक्त हो जाते हैं।
