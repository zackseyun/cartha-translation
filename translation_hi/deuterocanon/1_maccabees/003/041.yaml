base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: hi
  text: और उस देश के व्यापारियों ने उनकी चर्चा सुनी[a]। वे बहुत अधिक चाँदी-सोना और दासों को लेकर छावनी में आए, ताकि इस्राएल के पुत्रों को दास बना लें[b]। सीरिया और परदेशियों की भूमि से सेनाएँ भी उनके साथ आ मिलीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘उनका नाम’ है; इसका अर्थ ‘उनकी ख्याति’ या ‘उनके विषय में समाचार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘दास’ उन लोगों को दर्शाता है जिन्हें मानव-संपत्ति बनाया जाना था। यूनानी में पहले साथ लाए गए दासों और इस्राएल के पुत्रों को जो बनाया जाना था, दोनों के लिए एक ही शब्द प्रयुक्त हुआ है; उसका अर्थ ‘सेवक’ या ‘लड़के’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘सीरिया और परदेशियों की भूमि की सेनाएँ उनके साथ जोड़ दी गईं।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: उस देश के व्यापारी
  rationale: ἔμποροι वाणिज्य करने वालों को दर्शाता है; आधुनिक हिन्दी में ‘व्यापारी’ स्वाभाविक है। χώρα को प्रसंगानुसार ‘देश’ कहा गया है।
- source_word: τὸ ὄνομα αὐτῶν
  choice: उनकी चर्चा
  rationale: शाब्दिक अर्थ ‘उनका नाम’ है, पर सुनने के प्रसंग में यह उनके विषय में फैली चर्चा, ख्याति या समाचार का सूचक है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: बहुत अधिक चाँदी-सोना
  rationale: πολὺ σφόδρα मात्रा पर प्रबल बल देता है। ‘बहुत अधिक’ इस तीव्रता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: παῖδας
  choice: दासों
  rationale: παῖς का अर्थ बालक, सेवक या दास हो सकता है। यहाँ व्यापारी धन लेकर बंदियों को मानव-संपत्ति के रूप में प्राप्त करने आए हैं, इसलिए ‘दास’ प्रसंग के शोषणकारी अर्थ को ठीक व्यक्त करता है। दोनों occurrences में इसी मूल अर्थ को बनाए रखा गया है।
- source_word: παρεμβολήν
  choice: छावनी
  rationale: यहाँ शब्द सैन्य शिविर को दर्शाता है; ‘छावनी’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: ताकि इस्राएल के पुत्रों को दास बना लें
  rationale: τοῦ के साथ infinitive उद्देश्य प्रकट करता है। ‘दास बना लें’ εἰς παῖδας के परिणामी अर्थ को स्वाभाविक हिन्दी में देता है, और ‘इस्राएल के पुत्र’ मूल के υἱούς को सुरक्षित रखता है।
- source_word: προσετέθησαν πρὸς αὐτοὺς
  choice: उनके साथ आ मिलीं
  rationale: यूनानी में शाब्दिक भाव ‘उनके साथ जोड़ दी गईं’ है। सैन्य दलों के संदर्भ में ‘साथ आ मिलीं’ वही संबंध अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: सीरिया और परदेशियों के देश की सेनाएँ
  rationale: δυνάμεις यहाँ सैन्य बल हैं। ἀλλόφυλοι का मूल अर्थ दूसरी जाति के लोग या परदेशी है; इसे किसी विशेष जातीय समूह तक अनावश्यक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: दास-व्यापार के प्रसंग में παῖδας का अनुवाद
  choice: दास / दास बना लें
  alternative: सेवक; लड़के
  rationale: शब्द का अर्थ-क्षेत्र व्यापक है, पर चाँदी-सोना लेकर इस्राएलियों को प्राप्त करने आने का प्रसंग दासत्व को स्पष्ट करता है। ‘दास’ उस अमानवीय स्वामित्व को ‘सेवक’ से अधिक ठीक व्यक्त करता है, जबकि पादटिप्पणी शब्द की व्यापकता और दोनों स्थानों पर उसके दोहराव को बताती है।
- issue: ἀλλοφύλων की पहचान
  choice: परदेशियों
  alternative: पलिश्तियों; दूसरी जातियों के लोगों
  rationale: यह शब्द कुछ बाइबलीय प्रसंगों में पलिश्तियों के लिए प्रयुक्त हो सकता है, पर इस पद में उस संकीर्ण पहचान को निश्चित करना आवश्यक नहीं। व्यापक अर्थ रखने से मूल की संभावित अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य-रचना सहज रखी गई है, पर ‘इस्राएल के पुत्र’ जैसे स्रोत-सापेक्ष पदबंध और दासत्व की कठोर वास्तविकता सुरक्षित रखी गई है। ‘चर्चा’ के द्वारा यूनानी मुहावरे का प्रसंगगत अर्थ दिया गया है और उसका शाब्दिक रूप पादटिप्पणी में रखा गया है।
