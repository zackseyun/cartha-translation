- source_word: ἀπῆραν
  choice: कूच करके
  rationale: यह क्रिया सैन्य दल के पड़ाव उठाकर आगे बढ़ने का भाव देती है; प्रसंग में ‘कूच करना’ स्वाभाविक और सटीक है।
- source_word: σὺν πάσῃ τῇ δυνάμει αὐτῶν
  choice: अपनी सारी सेना के साथ
  rationale: δύναμις यहाँ अमूर्त ‘शक्ति’ नहीं, संगठित सैन्य बल को सूचित करता है।
- source_word: παρεβάλον
  choice: छावनी डाली
  rationale: सैन्य प्रसंग में क्रिया का अर्थ शिविर लगाना या पड़ाव डालना है।
- source_word: Ἀμμαοῦν
  choice: अम्माऊस
  rationale: स्वीट के यूनानी पाठ में दिए स्थाननाम Ἀμμαοῦν का निकट देवनागरी लिप्यंतरण रखा गया है; इसे अधिक परिचित ‘इम्माऊस’ में सामान्यीकृत नहीं किया गया।
- source_word: ἐν τῇ γῇ τῇ πεδινῇ
  choice: मैदानी प्रदेश में
  rationale: यूनानी पदबंध समतल अथवा मैदानी भूभाग को दर्शाता है; यह हिन्दी में संक्षिप्त और प्राकृतिक रूप है।
