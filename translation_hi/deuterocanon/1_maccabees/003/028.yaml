  yaml_path: translation/deuterocanon/1_maccabees/003/028.yaml
  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: hi
  text: तब उसने अपना खजाना खोल दिया और अपनी सेनाओं को एक वर्ष का वेतन दे दिया। उसने उन्हें आज्ञा दी कि वे एक वर्ष तक हर आवश्यकता के लिए तैयार रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: खजाना
  rationale: यह राजकीय धन-संग्रह या कोष को दर्शाता है; आधुनिक हिन्दी में ‘खजाना’ स्वाभाविक और स्पष्ट है।
- source_word: ὀψώνια
  choice: वेतन
  rationale: सैनिकों को दिए जाने वाले निर्वाह-भत्ते या पारिश्रमिक के अर्थ में यहाँ ‘वेतन’ उपयुक्त है।
- source_word: δυνάμεσιν
  choice: सेनाओं
  rationale: संदर्भ में यह शासक की सैन्य टुकड़ियों या बलों को दर्शाता है; ‘सेनाओं’ से आशय सहज रूप से स्पष्ट होता है।
- source_word: εἰς πᾶσαν χρείαν
  choice: हर आवश्यकता के लिए
  rationale: यूनानी पदबंध को व्यापक रखते हुए उसका सीधा अर्थ दिया गया है; इसे केवल युद्ध या अभियान तक सीमित नहीं किया गया।
