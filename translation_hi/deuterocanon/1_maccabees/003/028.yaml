  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यूनानी वाक्य की दो समन्वित क्रियाओं को हिन्दी में दो वाक्यों में बाँटा गया है ताकि स्पष्टता बनी रहे; दोनों बार आए ‘एक वर्ष’ को स्रोत के अनुसार सुरक्षित रखा गया है।
