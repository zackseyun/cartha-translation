lexical_decisions:
- source_word: ἀνέστη
  choice: उठ खड़ा हुआ
  rationale: यहाँ ἀνίστημι का भूतकालिक रूप पिता की मृत्यु के बाद यहूदा के आगे आने और सक्रिय होने को व्यक्त करता है। ‘उठ खड़ा हुआ’ कथात्मक बल बनाए रखता है, पर औपचारिक पदग्रहण का अर्थ नहीं जोड़ता।
- source_word: ὁ καλούμενος
  choice: जो … कहलाता था
  rationale: यह कृदन्तीय पद यहूदा के अतिरिक्त नाम या उपनाम का परिचय देता है। यह हिन्दी में स्वाभाविक है और यूनानी अभिव्यक्ति के निकट रहता है।
- source_word: Μακκαβαῖος
  choice: मक्काबियस
  rationale: यह यूनानी रूप का देवनागरी लिप्यंतरण है। अधिक प्रचलित ‘मक्काबी’ को पादटिप्पणी में दिया गया है।
- source_word: υἱὸς αὐτοῦ
  choice: उसका पुत्र
  rationale: यह पद यहूदा को पिछले प्रसंग में उल्लिखित व्यक्ति के पुत्र के रूप में स्पष्ट रूप से पहचानता है।
- source_word: ἀντʼ αὐτοῦ
  choice: उसके स्थान पर
  rationale: ἀντί के साथ सम्बन्धकारक यहाँ प्रतिस्थापन या उत्तरवर्तन का भाव देता है। ‘उसके स्थान पर’ हिन्दी में स्वाभाविक है और यूनानी से अधिक स्पष्ट राजनीतिक दावा नहीं करता।
theological_decisions:
- issue: यहूदा के उत्तरवर्तन का स्वरूप
  choice: उसके स्थान पर उठ खड़ा हुआ
  alternative: उसका उत्तराधिकारी हुआ
  rationale: पद पिता के बाद यहूदा के आगे आने का वर्णन करता है, लेकिन यूनानी में औपचारिक उत्तराधिकार के लिए कोई तकनीकी शब्द नहीं है। चुना हुआ अनुवाद इस अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘तब’ प्रसंगगत क्रम को स्वाभाविक बनाता है; ‘उठ खड़ा हुआ’ सक्रिय उदय का भाव देता है, जबकि औपचारिक राजकीय पदग्रहण का अर्थ आरोपित नहीं करता।
