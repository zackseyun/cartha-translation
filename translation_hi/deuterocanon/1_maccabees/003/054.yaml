lexical_decisions:
- source_word: ἐσάλπισαν
  choice: फूँकीं
  rationale: यह क्रिया तुरही बजाने या फूँकने को व्यक्त करती है। हिन्दी में ‘तुरहियाँ फूँकीं’ स्वाभाविक और ठोस अभिव्यक्ति है।
- source_word: ταῖς σάλπιγξιν
  choice: तुरहियाँ
  rationale: यूनानी में यह साधनवाचक चतुर्थी है; हिन्दी मुहावरे में क्रिया ‘फूँकना’ के साथ इसे सीधे कर्म के रूप में रखना सहज है।
- source_word: ἐβόησαν
  choice: पुकार उठे
  rationale: यह शब्द ऊँची आवाज़ में पुकारने या चिल्लाने का भाव देता है। ‘पुकार उठे’ प्रसंग की सामूहिक और गंभीर ध्वनि बनाए रखता है, पर पुकार की अनकही विषयवस्तु नहीं जोड़ता।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी पदबंध प्रबल या ऊँची आवाज़ का सामान्य मुहावरा है। ‘ऊँचे स्वर से’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी है।
