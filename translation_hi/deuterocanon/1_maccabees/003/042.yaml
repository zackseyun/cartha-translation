base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: hi
  text: तब यहूदा और उसके भाइयों ने देखा कि विपत्तियाँ बढ़ गई थीं और सेनाएँ उनकी सीमाओं के भीतर डेरा डाले हुए थीं। उन्होंने राजसत्ता[a] के उन आदेशों को जान लिया, जिन्हें राजसत्ता ने लोगों के विरुद्ध[b] विनाश और सर्वनाश के लिए लागू करने की आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘राज्य/राजसत्ता के वचन’; यहाँ यूनानी पाठ सीधे ‘राजा’ नहीं, बल्कि ‘राज्य’ या ‘राजकीय शासन’ कहता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘लोगों को’ या ‘लोगों के लिए’; प्रसंग बताता है कि ये आदेश लोगों के विनाश के उद्देश्य से उनके विरुद्ध थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακά
  choice: विपत्तियाँ
  rationale: बहुवचन पद यहाँ केवल नैतिक बुराइयों का नहीं, बल्कि बढ़ती हुई प्रतिकूल और विनाशकारी परिस्थितियों का बोध कराता है; ‘विपत्तियाँ’ सैन्य-राजनीतिक प्रसंग में स्वाभाविक है।
- source_word: αἱ δυνάμεις
  choice: सेनाएँ
  rationale: इस प्रसंग में δυνάμεις अमूर्त ‘शक्तियों’ के बजाय सशस्त्र सैन्य दलों को सूचित करता है।
- source_word: παρεμβάλλουσιν
  choice: डेरा डाले हुए थीं
  rationale: क्रिया सैन्य शिविर लगाने और वहाँ स्थित रहने की अवस्था व्यक्त करती है; हिन्दी कथात्मक प्रवाह में यह रूप स्वाभाविक है।
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: उनकी सीमाओं के भीतर
  rationale: ὅρια सीमा अथवा सीमाबद्ध भूभाग दोनों का बोध करा सकता है; यह अनुवाद शत्रु सेनाओं के उनके क्षेत्र में घुस आने की धमकी को स्पष्ट रखते हुए भौगोलिक अर्थ बचाता है।
- source_word: ἐπέγνωσαν
  choice: जान लिया
  rationale: क्रिया किसी बात को पहचान लेने या पूरी तरह समझ लेने का भाव देती है; ‘जान लिया’ सामान्य आधुनिक हिन्दी में दोनों के निकट है।
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: राजसत्ता के उन आदेशों
  rationale: λόγοι प्रसंग में शासकीय निर्देश हैं, जबकि βασιλεία व्यक्तिगत ‘राजा’ के बजाय राज्याधिकार या राजकीय शासन को सूचित करता है।
- source_word: ἐνετείλατο ποιῆσαι
  choice: लागू करने की आज्ञा दी थी
  rationale: यह संयोजन आदेश देने और उसे कार्यान्वित कराने, दोनों को व्यक्त करता है।
- source_word: τῷ λαῷ
  choice: लोगों के विरुद्ध
  rationale: व्याकरणतः यह सम्प्रदान कारक ‘लोगों को/के लिए’ हो सकता है, पर अगले विनाशसूचक पदों से स्पष्ट है कि आदेश लोगों के अहित के लिए थे।
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: विनाश और सर्वनाश के लिए
  rationale: दोनों संज्ञाएँ मिलकर पूर्ण और अंतिम तबाही का तीव्र भाव देती हैं; ‘सर्वनाश’ συντέλεια के यहाँ अंत तक पहुँचा देने वाले अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τῆς βασιλείας में शासकीय कर्ता की पहचान
  choice: राजसत्ता
  alternative: राजा / राज्य / राजकीय शासन
  rationale: मूल यूनानी में व्यक्तिगत ‘राजा’ नहीं, बल्कि अमूर्त βασιλεία है। ‘राजसत्ता’ उस भेद को बनाए रखते हुए आदेश देने वाली शासन-व्यवस्था का आशय स्पष्ट करती है।
- issue: τῷ λαῷ का प्रतिकूल अर्थ
  choice: लोगों के विरुद्ध
  alternative: लोगों को / लोगों के लिए
  rationale: सम्प्रदान कारक अपने आप में प्रतिकूलता नहीं बताता, इसलिए शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है; मुख्य पाठ में ‘विनाश और सर्वनाश’ के स्पष्ट उद्देश्य के कारण प्रतिकूल अर्थ व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘राजसत्ता’ मूल पाठ के अमूर्त शासकीय पद को सुरक्षित रखता है; ‘विनाश और सर्वनाश’ यूनानी युग्म की तीव्रता बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
