  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पिछले पद से जुड़ी निरंतरता के अनुरूप ‘और’ से आरंभ किया गया है। यूनानी मुहावरे ὡς ἅπαξ καὶ δὶς का यांत्रिक शब्दानुवाद न करके उसका स्वाभाविक अर्थ ‘बार-बार’ दिया गया है; δαψιλῇ χειρί का हस्त-रूपक ‘खुले हाथ से’ में सुरक्षित है।
