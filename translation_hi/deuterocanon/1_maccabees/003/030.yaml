  text: and he became afraid that he might not have enough[a], as once and twice before, for the expenses and the gifts that he had formerly given with a generous hand,
translation:
  language: hi
  text: और वह डर गया कि कहीं उसके पास खर्चों और उन उपहारों के लिए पर्याप्त धन न हो, जिन्हें वह पहले खुले हाथ से दिया करता था, जैसा कि पहले भी कई बार होता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλαβήθη
  choice: वह डर गया
  rationale: यहाँ क्रिया संभावित आर्थिक कमी को लेकर उत्पन्न भय या आशंका व्यक्त करती है; ‘डर गया’ उसके आरंभिक और स्पष्ट भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: μὴ οὐκ ἔχῃ
  choice: कहीं उसके पास ... पर्याप्त धन न रहे
  rationale: यूनानी रचना अभाव की आशंका प्रकट करती है। प्रसंग आर्थिक है, इसलिए निहित संसाधन को ‘पर्याप्त धन’ से स्पष्ट किया गया है।
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: पहले की तरह बार-बार
  rationale: शाब्दिक ‘एक और दो बार’ एक मुहावरे के रूप में पिछली अनेक अथवा बारंबार घटनाओं की ओर संकेत करता है; आधुनिक हिन्दी में ‘बार-बार’ वही आशय सहजता से देता है।
- source_word: δαπάνας
  choice: खर्चों
  rationale: राजकीय आर्थिक संदर्भ में यह सामान्य व्यय या खर्च को दर्शाता है।
- source_word: δόματα
  choice: उपहारों
  rationale: यह राजा द्वारा दिए जानेवाले दानों या अनुदानों का व्यापक अर्थ बनाए रखता है, बिना इसे किसी संकीर्ण प्रशासनिक अर्थ तक सीमित किए।
- source_word: ἐδίδου
  choice: दिया करता था
  rationale: अपूर्ण भूतकाल की क्रिया अतीत की प्रचलित या बारंबार गतिविधि को व्यक्त करती है।
- source_word: ἔμπροσθεν
  choice: पहले
  rationale: यहाँ इसका अर्थ स्थानगत नहीं, बल्कि पहले के समय से है।
- source_word: δαψιλῇ χειρί
  choice: खुले हाथ से
  rationale: यह हिन्दी का स्वाभाविक मुहावरा है जो उदारतापूर्वक और भरपूर देने के यूनानी रूपक को सुरक्षित रखता है।
