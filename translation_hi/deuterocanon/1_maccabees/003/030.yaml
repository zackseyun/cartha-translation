- from: और वह डर गया कि कहीं उसके पास पहले की तरह बार-बार होनेवाले खर्चों और उन उपहारों के लिए पर्याप्त धन न रहे, जिन्हें वह पहले खुले हाथ से दिया करता था।
  to: और वह डर गया कि कहीं उसके पास खर्चों और उन उपहारों के लिए पर्याप्त धन न हो, जिन्हें वह पहले खुले हाथ से दिया करता था, जैसा कि पहले भी कई बार होता था।
