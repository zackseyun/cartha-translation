review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys apprehension over insufficient resources, expenses, gifts, former customary giving, and generous/openhanded giving. However, “पहले की तरह बार-बार होनेवाले खर्चों” makes “बार-बार” modify the expenses. In Greek, ὡς ἅπαξ καὶ δὶς belongs with the feared insufficiency and refers to previous occasions, not to repeatedly occurring expenses.
  naturalness: The Hindi is generally fluent and appropriately dignified. Repositioning the prior-occurrences phrase removes the unintended modifier and produces a clearer sentence.
  terminology: “खर्चों,” “उपहारों,” and “खुले हाथ से” are suitable modern Hindi equivalents. “पर्याप्त धन” appropriately makes explicit the financial resources implied by the context without over-translating.
  issues:
  - severity: medium
    issue: Misattachment of “बार-बार”
    rationale: The phrase “बार-बार होनेवाले खर्चों” changes the source sense by characterizing the expenses as recurrent. The Greek idiom ὡς ἅπαξ καὶ δὶς instead qualifies the prior availability/sufficiency of resources.
  revised_text: और वह डर गया कि कहीं उसके पास खर्चों और उन उपहारों के लिए पर्याप्त धन न हो, जिन्हें वह पहले खुले हाथ से दिया करता था, जैसा कि पहले भी कई बार होता था।
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s sound renderings while relocating the sense of ὡς ἅπαξ καὶ δὶς so that it refers to prior occasions of having sufficient means rather than to the expenses. “पहले भी कई बार” conveys the idiomatic, non-strictly-numerical force of “once and twice” in natural Hindi.
