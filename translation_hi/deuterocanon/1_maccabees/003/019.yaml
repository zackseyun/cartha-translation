  yaml_path: translation/deuterocanon/1_maccabees/003/019.yaml
  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
translation:
  language: hi
  text: क्योंकि युद्ध में विजय बहुत अधिक बल पर निर्भर नहीं होती, बल्कि बल स्वर्ग से आता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल स्वर्ग से मिलता है।” यूनानी पाठ मानव की संचित शक्ति और स्वर्ग से आने वाले बल का विरोध करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει δυνάμεως
  choice: बहुत बड़ी सेना के बल पर
  rationale: शाब्दिक अर्थ ‘सामर्थ्य की बहुतायत में’ है; युद्ध के प्रसंग में यह एकत्रित सैन्य बल को दर्शाता है। यह हिन्दी में स्वाभाविक रहते हुए πλήθει और δυνάμεως दोनों का भाव रखता है।
- source_word: νίκη πολέμου
  choice: युद्ध में विजय
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से उस विजय को व्यक्त करता है जिसे πολέμου विशेषित करता है।
- source_word: ἀλλʼ ἢ
  choice: बल्कि
  rationale: नकारात्मक कथन के बाद स्रोत में आए तीखे विरोध को हिन्दी में ‘बल्कि’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: स्रोत के ‘स्वर्ग से’ को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘परमेश्वर से’ नहीं बनाया गया, ताकि यहूदी श्रद्धापूर्ण परोक्ष संकेत सुरक्षित रहे।
- source_word: ἰσχύς
  choice: सामर्थ्य
  rationale: ἰσχύς का अर्थ बल या सामर्थ्य है। ‘सामर्थ्य’ स्वर्ग से प्राप्त शक्ति को गरिमापूर्ण और व्यापक रूप में व्यक्त करता है।
theological_decisions:
- issue: क्या ἐκ τοῦ οὐρανοῦ को परमेश्वर के प्रत्यक्ष उल्लेख के रूप में अनूदित किया जाए
  choice: स्वर्ग से
  alternative: परमेश्वर से
  rationale: यूनानी पाठ स्पष्टतः ‘स्वर्ग से’ कहता है। यह दिव्य सहायता का श्रद्धापूर्ण परोक्ष संकेत हो सकता है, पर अनुवाद को उस संकेत को प्रत्यक्ष नाम में नहीं बदलना चाहिए।
- issue: पहले खंड में सैन्य बल को कितना स्पष्ट किया जाए
  choice: बहुत बड़ी सेना के बल पर
  alternative: बहुत अधिक सामर्थ्य पर
  rationale: युद्ध का प्रसंग सैन्य अर्थ का समर्थन करता है, जबकि ‘बल’ व्यापक शक्ति का भाव भी बनाए रखता है। यह व्याख्या को केवल सैनिकों की संख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘निर्भर नहीं होती’ यूनानी ἐν ... ἐστίν के आधार या क्षेत्र-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
