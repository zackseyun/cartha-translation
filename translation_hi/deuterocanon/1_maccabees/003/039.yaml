    text: शाब्दिक रूप से ‘सात हज़ार घोड़े’; यहाँ ‘घोड़े’ से आशय संभवतः घुड़सवार सैनिकों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: सैन्य संदर्भ में यह सामान्य और सीधा रूप है; अधिक शैलीगत ‘रवाना किए’ की आवश्यकता नहीं है।
- source_word: μετʼ αὐτῶν
  choice: उनके साथ
  rationale: यह पहले बताए गए अगुओं के साथ सैनिकों के जाने को सीधे व्यक्त करता है।
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: चालीस हज़ार पुरुष
  rationale: ἀνδρῶν का शाब्दिक अर्थ ‘पुरुष’ है। सैन्य संदर्भ स्पष्ट है, इसलिए ‘सैनिक’ जोड़कर अर्थ को अधिक सीमित नहीं किया गया।
- source_word: ἑπτακισχιλίον ἵππον
  choice: सात हज़ार घुड़सवार
  rationale: ἵππος शाब्दिक रूप से ‘घोड़ा’ है, पर सैन्य गणना में यहाँ घुड़सवार सेना के लिए लक्षणा है। हिन्दी में ‘घुड़सवार’ स्वाभाविक और स्पष्ट है।
- source_word: τοῦ ἐλθεῖν
  choice: ताकि वे ... जाकर
  rationale: सव्यय infinitive उद्देश्य व्यक्त करता है। हिन्दी में ‘ताकि’ उद्देश्य को स्वाभाविक रूप से प्रकट करता है; गमन को प्रसंगानुसार ‘जाकर’ कहा गया है।
- source_word: εἰς γῆν Ἰούδα
  choice: यहूदा देश में
  rationale: γῆ Ἰούδα का भौगोलिक अर्थ बनाए रखते हुए यह आधुनिक हिन्दी में ‘यहूदा की भूमि में’ से अधिक सहज है।
- source_word: καταφθεῖραι
  choice: उसे नष्ट कर दें
  rationale: यह क्रिया प्रबल विनाशकारी कार्रवाई बताती है। ‘नष्ट करना’ व्यापक अर्थ को सुरक्षित रखता है और विनाश के तरीके को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: राजा के वचन के अनुसार
  rationale: λόγος का मूल ‘वचन/बात’ है, यद्यपि यहाँ राजकीय आदेश का बल रखता है। मुख्य पाठ स्रोत की अभिव्यक्ति बचाता है और पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
