  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: hi
  text: और उसने उनके साथ चालीस हज़ार पुरुष और सात हज़ार घुड़सवार[a] भेजे, ताकि वे यहूदा की भूमि में जाकर उसे नष्ट कर दें—राजा के आदेश के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
