  yaml_path: translation/deuterocanon/1_maccabees/003/012.yaml
  text: And they took their equipment[a], and Judas took the sword of Apollonius, and he fought with it all his days.
translation:
  language: hi
  text: और उन्होंने उनका युद्ध-सामान ले लिया। यहूदा ने अपोल्लोनियुस की तलवार भी ले ली, और वह अपने जीवन भर[a] उसी से लड़ता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारे दिनों”; प्रसंग में इसका अर्थ सम्भवतः यहूदा के शेष जीवन भर है।
    reason: यूनानी वाक्यांश के शाब्दिक रूप और उसके सम्भावित मुहावरेदार अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: σκεύη
  choice: युद्ध-सामान
  rationale: सैन्य प्रसंग में यह शब्द साज-सामान या उपकरणों के व्यापक अर्थ में है; ‘युद्ध-सामान’ किसी अनिर्दिष्ट वस्तु को अनावश्यक रूप से जोड़े बिना प्रसंग स्पष्ट करता है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: μάχαιρα छोटी तलवार या बड़े चाकू को भी दर्शा सकता है, पर इस युद्ध-वृत्तांत में ‘तलवार’ स्वाभाविक और पर्याप्त रूप से व्यापक अनुवाद है।
- source_word: ἦν πολεμῶν
  choice: लड़ता रहा
  rationale: ἦν के साथ वर्तमान कृदंत निरंतर या बार-बार होने वाली क्रिया व्यक्त करता है; ‘लड़ता रहा’ इस कालगत पक्ष को सहज हिन्दी में बनाए रखता है।
- source_word: ἐν αὐτῇ
  choice: उसी से
  rationale: स्त्रीलिंग सर्वनाम निकटवर्ती ‘तलवार’ की ओर संकेत करता है और यहाँ साधन का भाव है; ‘उसी से’ यह संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάσας τὰς ἡμέρας
  choice: अपने जीवन भर
  rationale: यूनानी में शाब्दिक अर्थ ‘सारे दिनों’ है, पर प्रसंग में यह यहूदा के शेष जीवन की अवधि का मुहावरेदार संकेत जान पड़ता है; पाठक को शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
