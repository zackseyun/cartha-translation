- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: जब वह बोलना समाप्त कर चुका
  rationale: यह वाक्यांश यहूदा के भाषण के तुरंत बाद की घटना बताता है। यह हिन्दी में स्वाभाविक है और यूनानी में व्यक्त पूर्ण हुई क्रिया के भाव को बनाए रखता है।
- source_word: ἐνήλατο ἐπʼ αὐτοὺς ἄφνω
  choice: तो वह अचानक उन पर टूट पड़ा
  rationale: ἐνήλατο आकस्मिक और आक्रामक ढंग से आगे बढ़कर हमला करने का बोध देता है, जबकि ἄφνω उसकी अचानकता को स्पष्ट करता है। ‘टूट पड़ा’ दोनों भावों को सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνετρίβη
  choice: चूर हो गए
  rationale: क्रिया का मूल चित्र तोड़े या कुचले जाने का है। ‘चूर हो गए’ साधारण ‘हार गए’ की अपेक्षा यूनानी की प्रबल और सजीव अभिव्यक्ति को अधिक निकटता से रखता है।
- source_word: Σήρων
  choice: सेरोन
  rationale: यह यूनानी नाम Σήρων का स्पष्ट देवनागरी लिप्यंतरण है।
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: उसकी छावनी
  rationale: παρεμβολή का अर्थ सैन्य छावनी और प्रसंगानुसार उसमें स्थित सेना, दोनों हो सकता है। ‘छावनी’ मूल ठोस सैन्य चित्र को सुरक्षित रखती है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह यूनानी मुहावरे का निकट और स्वाभाविक अनुवाद है। इससे यहूदा के सम्मुख हुई पराजय का भाव व्यक्त होता है, बिना ‘उसके द्वारा’ जैसे अधिक व्याख्यात्मक शब्द जोड़ने के।
