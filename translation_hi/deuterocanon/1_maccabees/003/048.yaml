  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: hi
  text: और उन्होंने व्यवस्था की पुस्तक खोलकर फैला दी[a]—जिसके संबंध में अन्यजातियाँ अपनी मूर्तियों के प्रतिरूपों को खोजा करती थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था की पुस्तक खोल दी” अथवा “उसे खोलकर रख दिया।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य बहुत संक्षिप्त और कठिन है। ‘जिसके संबंध में’ का संबंध व्यवस्था की पुस्तक (या उसमें निहित विषयों) से माना जा सकता है; वाक्य यह स्पष्ट नहीं करता कि अन्यजातियाँ अपनी मूर्तियों के प्रतिरूपों को किस प्रकार या किस उद्देश्य से खोजती थीं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: फैला दी
  rationale: क्रिया किसी वस्तु को फैलाने या खोलकर सामने रखने का ठोस भाव देती है। पुस्तक/लपेटे हुए ग्रंथ के संदर्भ में यह ‘खोली’ से अधिक मूर्त है, पर उसे निश्चित रूप से ‘लपेटा हुआ ग्रंथ’ नहीं मानती।
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: व्यवस्था की पुस्तक
  rationale: यह यूनानी पदबंध का सीधा, स्वाभाविक और परंपरागत धार्मिक शब्दावली से संगत अनुवाद है; ‘पुस्तक’ मूल में ग्रंथ के भौतिक रूप को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: περὶ ὧν
  choice: जिसके संबंध में
  rationale: संबंधसूचक पदबंध को निकटता से रखा गया है, ताकि अगले कठिन और संक्षिप्त खंड से उसका संबंध अनुवाद में मनमाने ढंग से न सुलझाया जाए।
- source_word: ἐξηρεύων
  choice: खोजा करती थीं
  rationale: यह चयन जारी रहने वाली या प्रचलित क्रिया का भाव व्यक्त करता है और पूछताछ करने अथवा खोजने की संभावित अर्थ-सीमा को अत्यधिक संकीर्ण नहीं करता।
- source_word: τὰ ἔθνη
  choice: अन्यजातियाँ
  rationale: यहाँ आशय इस्राएल से बाहर की जातियों से है। ‘अन्यजातियाँ’ संक्षिप्त और प्रसंगानुकूल है तथा ‘मूर्तिपूजक’ जैसा अतिरिक्त मूल्यांकन सीधे इस शब्द में नहीं जोड़ता।
- source_word: τὰ ὁμοιώματα
  choice: प्रतिरूप
  rationale: यह समान रूप या प्रतिनिधिक आकृति का अर्थ देता है और अगले शब्द εἰδώλων (‘मूर्तियों’) से इसकी शब्दगत भिन्नता बनाए रखता है।
- source_word: τῶν εἰδώλων αὐτῶν
  choice: अपनी मूर्तियों के
  rationale: εἴδωλον का उपासना-संबंधी अर्थ ‘मूर्ति’ से स्पष्ट होता है, जबकि αὐτῶν को स्वाभाविक हिंदी में ‘अपनी’ से व्यक्त किया गया है।
theological_decisions:
- issue: व्यवस्था की पुस्तक और अन्यजातियों की मूर्तियों के प्रतिरूपों को जोड़ने वाले खंड की व्याख्या
  choice: 'मुख्य पाठ में संक्षिप्त और कठिन संबंध को बनाए रखा गया है: अन्यजातियाँ व्यवस्था की पुस्तक ‘के संबंध में’ अपनी मूर्तियों के प्रतिरूप खोजती थीं।'
  alternative: इसे इस अर्थ में स्पष्ट किया जा सकता है कि यहूदी उन विषयों पर व्यवस्था की पुस्तक से मार्गदर्शन खोज रहे थे जिन पर अन्यजातियाँ अपनी मूर्तियों के प्रतिरूपों से परामर्श करती थीं।
  rationale: यूनानी वाक्यरचना संकुचित और अनिश्चित है। किसी एक व्यावहारिक दृश्य या धर्मवैज्ञानिक तुलना को मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता; इसलिए संभावित स्पष्ट अर्थ को केवल टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘अन्यजातियाँ’, ‘मूर्तियाँ’ और ‘प्रतिरूप’ स्रोत के अलग-अलग धार्मिक तथा चित्रात्मक पदों को बिना सांप्रदायिक विस्तार के बनाए रखते हैं।
