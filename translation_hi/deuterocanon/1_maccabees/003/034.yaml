base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/034.yaml
  text: And he handed over to him half of the forces and the elephants[a], and he gave him orders concerning everything he desired, and concerning all those dwelling in Judea and Jerusalem[b],
translation:
  language: hi
  text: और उसने अपनी आधी सेना और हाथियों को उसके अधिकार में सौंप दिया[a]। उसने उसे उन सब बातों के विषय में, जो वह चाहता था[b], और यहूदिया तथा यरूशलेम में रहनेवाले सभी लोगों के विषय में आदेश दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आधी सेना और हाथियों को उसे सौंप दिया।” यूनानी क्रिया किसी को उसके प्रभार में देने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन सब बातों के विषय में जो वह चाहता था।” यूनानी में राजा की इच्छा का लक्ष्य स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: उसके अधिकार में सौंप दिया
  rationale: क्रिया किसी वस्तु या शक्ति को दूसरे के नियंत्रण या प्रभार में देने का भाव रखती है। यह रूप हिन्दी में स्वाभाविक है और केवल भौतिक रूप से ‘देने’ की अपेक्षा अधिकार के हस्तांतरण को स्पष्ट करता है।
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: अपनी आधी सेना
  rationale: सैन्य प्रसंग में δυνάμεις सशस्त्र सैन्य शक्ति को दर्शाता है। हिन्दी में ‘आधी सेना’ सहज है; ‘आधी सेनाएँ’ यूनानी बहुवचन का अत्यधिक शाब्दिक और अस्वाभाविक अनुवाद होता। स्वामित्व प्रसंग से स्पष्ट होने के कारण ‘अपनी’ जोड़ा गया है।
- source_word: τοὺς ἐλέφαντας
  choice: हाथियों
  rationale: यूनानी पाठ केवल ‘हाथी’ कहता है। सैन्य उपयोग प्रसंग से स्पष्ट है, इसलिए ‘युद्ध के हाथी’ जोड़ना अनावश्यक विस्तार होता।
- source_word: ἐνετείλατο αὐτῷ
  choice: उसे ... आदेश दिए
  rationale: यह सैन्य और राजकीय प्रसंग में निर्देश या आज्ञाएँ देने को व्यक्त करता है। ‘आदेश दिए’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त दृढ़ है।
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: उन सब बातों के विषय में, जो वह चाहता था
  rationale: यूनानी वाक्यांश में इच्छा का विषय स्पष्ट नहीं किया गया है। हिन्दी रूप उसी अस्पष्टता को बनाए रखता है और ‘पूरा करना’ या ‘करवाना’ जैसी निहित बात नहीं जोड़ता।
- source_word: τῶν κατοικούντων τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: यहूदिया तथा यरूशलेम में रहनेवाले सभी लोगों
  rationale: संज्ञार्थक कृदंत को ‘रहनेवाले ... लोग’ के रूप में प्रस्तुत किया गया है। ‘में’ स्थान-संबंध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
