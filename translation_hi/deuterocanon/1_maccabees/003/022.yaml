translation:
  language: hi
  text: और वह स्वयं उन्हें हमारे सामने कुचल देगा; पर तुम उनसे मत डरो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίψει
  choice: चूर कर देगा
  rationale: भविष्यकालीन क्रिया συντρίψει बलपूर्वक तोड़ने या कुचल डालने का भाव रखती है। ‘चूर कर देगा’ युद्ध-संदर्भ की तीव्रता को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: πρὸ προσώπου ἡμῶν
  choice: हमारे सामने
  rationale: यह वाक्यांश शाब्दिक रूप से ‘हमारे मुख/उपस्थिति के सामने’ है। ‘हमारे सामने’ स्थान और प्रत्यक्ष उपस्थिति—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: तुम उनसे मत डरो
  rationale: μὴ के साथ यह क्रियारूप निषेधात्मक आज्ञा देता है। ‘मत डरो’ संक्षिप्त, सीधा और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: αὐτός यहाँ बलाघातयुक्त है। ‘वह स्वयं’ इस बात को सुरक्षित रखता है कि निर्णायक कार्य उसी कर्ता द्वारा होगा, न कि लोगों की अपनी शक्ति से।
theological_decisions:
- issue: αὐτὸς में निहित कर्ता की पहचान और बलाघात
  choice: ‘वह स्वयं’ रखा गया है; प्रसंग में इसका संकेत परमेश्वर की ओर है।
  alternative: ‘वह’ या स्पष्ट रूप से ‘परमेश्वर स्वयं’
  rationale: मूल यूनानी में सर्वनाम बलाघातयुक्त है, पर इस पद में परमेश्वर का नाम प्रत्यक्ष रूप से नहीं आता। इसलिए ‘वह स्वयं’ बलाघात और प्रसंगगत संकेत दोनों को बचाता है, जबकि कर्ता का नाम जोड़कर मूल की अंतर्निहितता को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उत्साहवर्धक युद्ध-संदर्भीय स्वर। ‘चूर कर देगा’ मूल क्रिया की प्रबलता रखता है; ‘मत डरो’ सामान्य पाठक के लिए सीधा और स्वाभाविक है।
