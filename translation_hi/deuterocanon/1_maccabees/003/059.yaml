  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: hi
  text: क्योंकि हमारे लिए युद्ध में मर जाना इससे अच्छा है कि हम अपने राष्ट्र और पवित्र वस्तुओं[a] पर आई विपत्तियों को देखते रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान” अथवा “पवित्र स्थानों”; यूनानी में शाब्दिक रूप से “पवित्र वस्तुओं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: इससे अच्छा है
  rationale: यह तुलनात्मक रूप किसी विकल्प को अधिक उचित या वांछनीय बताता है; हिन्दी में यह स्वाभाविक रूप से दोनों विकल्पों की तुलना व्यक्त करता है।
- source_word: ἀποθανεῖν
  choice: मर जाना
  rationale: क्रिया का सीधा और सामान्य अर्थ रखा गया है; इससे मूल में निहित साधारण किंतु गंभीर कथन सुरक्षित रहता है।
- source_word: ἐν πολέμῳ
  choice: युद्ध में
  rationale: πόλεμος का मूल अर्थ ‘युद्ध’ है। प्रसंग में इसमें युद्ध करते हुए मरने का भाव है, पर हिन्दी में ‘युद्ध में’ मूल की व्यापकता को बनाए रखता है।
- source_word: ἐφιδεῖν ἐπὶ
  choice: खड़े-खड़े देखते रहें
  rationale: क्रिया केवल देखने से अधिक, किसी अनिष्ट को सामने घटते हुए निष्क्रिय दर्शक बनकर देखने का भाव देती है। यह हिन्दी अभिव्यक्ति उस पीड़ादायक निष्क्रियता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τὰ κακά
  choice: विपत्तियों
  rationale: κακά यहाँ राष्ट्र और पवित्र वस्तुओं पर आने वाली बुराइयों, संकटों और विनाशकारी घटनाओं को समेटता है। ‘विपत्तियाँ’ इस प्रसंग में स्वाभाविक है और अर्थ को केवल नैतिक बुराई तक सीमित नहीं करता।
- source_word: τοῦ ἔθνους ἡμῶν
  choice: अपने राष्ट्र
  rationale: ἔθνος यहूदी राष्ट्रीय समुदाय को सूचित करता है। ‘राष्ट्र’ उसके सामुदायिक और राष्ट्रीय आयाम को बनाए रखता है।
- source_word: τῶν ἁγίων
  choice: पवित्र वस्तुओं
  rationale: यूनानी रूप नपुंसकलिंग बहुवचन है, जिसका सीधा अर्थ ‘पवित्र वस्तुएँ’ है। इससे मंदिर, पवित्र स्थानों या उनसे जुड़ी समर्पित वस्तुओं का संभावित संदर्भ बिना संकुचित किए सुरक्षित रहता है।
theological_decisions:
- issue: τῶν ἁγίων का संदर्भ
  choice: पवित्र वस्तुओं
  alternative: पवित्रस्थान अथवा पवित्र स्थानों
  rationale: यूनानी पद नपुंसकलिंग बहुवचन है, इसलिए इसे व्यक्तियों के अर्थ में ‘पवित्र जन’ कहना उचित नहीं। व्यापक अनुवाद मूल की व्याकरणिक बनावट और मंदिर-संबंधी संभावित अर्थ, दोनों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक exhortation के अनुकूल रखी गई है। ‘खड़े-खड़े देखते रहें’ निष्क्रिय दर्शक बने रहने का भाव स्पष्ट करता है, जबकि ‘पवित्र वस्तुओं’ के साथ पादटिप्पणी मूल की वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखती है।
