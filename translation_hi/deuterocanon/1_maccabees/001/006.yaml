  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: hi
  text: और उसने अपने प्रतिष्ठित सेवकों[a] को बुलाया, जो युवावस्था से उसके साथ पले-बढ़े थे, और अपने जीते-जी अपना राज्य उनके बीच बाँट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “उसके पाइडेस” है; इस शब्द का अर्थ संतान, बालक या सेवक हो सकता है। यहाँ “प्रतिष्ठित” और “युवावस्था से उसके साथ पले-बढ़े” जैसे वर्णन जैविक पुत्रों के बजाय राजदरबार के विश्वस्त सेवक-साथियों की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: क्रिया का सीधा अर्थ ‘बुलाना’ या ‘पास बुलाना’ है; यहाँ ‘बुलाया’ स्वाभाविक और पर्याप्त है।
- source_word: τοὺς παῖδας αὐτοῦ
  choice: अपने प्रतिष्ठित सेवकों
  rationale: παῖς का अर्थ संतान, बालक या सेवक हो सकता है, पर साथ लगे विशेषण और युवावस्था से साथ पले-बढ़े होने का वर्णन राजदरबार के विश्वस्त सेवक-साथियों की ओर संकेत करता है, जैविक पुत्रों की ओर नहीं। मूल पद की वास्तविक शब्दार्थगत व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: ἐνδόξους
  choice: प्रतिष्ठित
  rationale: यह उच्च पद, सम्मान या विशिष्टता सूचित करता है। व्यक्तियों के लिए ‘प्रतिष्ठित’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  choice: जो युवावस्था से उसके साथ पले-बढ़े थे
  rationale: συνεκτρόφους साथ पालन-पोषण पाए लोगों को दर्शाता है; यह वाक्यांश उस संबंध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: διεῖλεν αὐτοῖς
  choice: उनके बीच बाँट दिया
  rationale: क्रिया विभाजन या वितरण को व्यक्त करती है; बहुवचन प्राप्तकर्ताओं के साथ ‘उनके बीच बाँट दिया’ स्पष्ट है।
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: अपना राज्य
  rationale: यहाँ जिसे अनेक लोगों में बाँटा गया, वह राजनीतिक-क्षेत्रीय राज्य है; इसलिए ‘राज्य’ उपयुक्त है।
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: अपने जीते-जी
  rationale: यह विभाजन उसकी मृत्यु से पहले होने पर बल देता है; ‘अपने जीते-जी’ संक्षिप्त, प्राकृतिक और अर्थनिष्ठ है।
