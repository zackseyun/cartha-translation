lexical_decisions:
- source_word: περιτετμηκυίας
  choice: जिन स्त्रियों ने ... खतना किया था
  rationale: पूर्ण सक्रिय कृदंत पूरी हो चुकी पूर्ववर्ती क्रिया और स्त्रियों की व्याकरणिक सक्रियता व्यक्त करता है। हिन्दी में यह प्रयोग स्वयं करने या करवाने—दोनों की कुछ गुंजाइश रख सकता है; वैकल्पिक कारक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὰ τέκνα αὐτῶν
  choice: अपने बच्चों का
  rationale: τέκνα का सामान्य अर्थ ‘बच्चे’ है। संदर्भ पुरुष बच्चों के खतने का है, फिर भी ‘बेटों’ कहना यूनानी पाठ को अनावश्यक रूप से संकरा कर देता।
- source_word: ἐθανάτωσαν
  choice: उन्हें ... मार डाला गया
  rationale: क्रिया का अर्थ मृत्यु देना है। हिन्दी का कर्मवाच्य मूल यूनानी के अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक ढंग से व्यक्त करता है और सरकारी आदेश के अधीन हत्या का भाव बनाए रखता है।
- source_word: κατὰ τὸ πρόσταγμα
  choice: उस राजाज्ञा के अनुसार
  rationale: πρόσταγμα यहाँ शासकीय आदेश या फरमान को सूचित करता है। प्रसंग में ‘राजाज्ञा’ औपचारिक राज्यादेश का स्वाभाविक और सटीक हिन्दी रूप है।
theological_decisions:
- issue: बच्चों का खतना कराने में स्त्रियों की भूमिका
  choice: 'मुख्य पाठ में सक्रिय रूप: ‘जिन स्त्रियों ने ... खतना किया था।’'
  alternative: ‘जिन स्त्रियों ने अपने बच्चों का खतना करवाया था।’
  rationale: यूनानी में सक्रिय कृदंत है, इसलिए मुख्य पाठ सक्रियता सुरक्षित रखता है; पर यह व्यवस्था करवाने का अर्थ भी दे सकता है, जिसे पादटिप्पणी में बनाए रखा गया है।
- issue: खतने के संदर्भ में τέκνα का दायरा
  choice: ‘बच्चों’
  alternative: ‘बेटों’
  rationale: खतना पुरुषों से संबंधित होने पर भी मूल संज्ञा व्यापक है; अतः अनुवाद मूल शब्द की व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘राजाज्ञा’ प्रसंगगत औपचारिकता व्यक्त करता है। वाक्य के अंत का अल्पविराम स्रोत में आगे जारी रहने वाली संरचना को सुरक्षित रखता है।
