lexical_decisions:
- source_word: ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह यूनानी शब्द किसी पवित्र स्थल या मन्दिर के पवित्र भाग को दर्शाता है। ‘पवित्रस्थान’ मन्दिर-सन्दर्भ को बनाए रखता है, पर किसी विशेष भीतरी कक्ष को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमंड के साथ
  rationale: यह पदबंध उसके प्रवेश करने के ढंग और उसके नैतिक अहंकार, दोनों को व्यक्त करता है; संज्ञात्मक बल भी बना रहता है।
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: सोने की वेदी
  rationale: यह हिन्दी में स्वाभाविक और स्रोत के संज्ञा-विशेषण विन्यास के अर्थ के अनुरूप है।
- source_word: λυχνίαν τοῦ φωτός
  choice: प्रकाश का दीपाधार
  rationale: ‘दीपाधार’ उस दीप रखने वाली मन्दिर-वस्तु को स्पष्ट करता है, और ‘प्रकाश का’ यूनानी सम्बन्धकारक τοῦ φωτός को छोड़े बिना व्यक्त करता है।
- source_word: σκεύη
  choice: उपकरण
  rationale: यह दीपाधार से जुड़ी विविध वस्तुओं के लिए व्यापक, वर्तमान और सहज शब्द है; ‘पात्र’ अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है।
