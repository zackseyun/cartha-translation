  yaml_path: translation/deuterocanon/1_maccabees/001/024.yaml
  text: And after taking everything[a], he went away to his own land. And they committed murder[b], and spoke great arrogance.
translation:
  language: hi
  text: और सब कुछ लेकर वह अपने देश को चला गया। उन्होंने हत्या की[a] और बड़े घमंड की बातें कहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रक्तपात किया’ या ‘वध किया।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘बहुत अहंकारपूर्ण बातें कहीं।’ यूनानी में शाब्दिक रूप से, ‘बड़ा अहंकार बोला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν πάντα
  choice: सब कुछ लेकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है। ‘सब कुछ लेकर’ सहज हिन्दी में वस्तुओं की समग्रता और उसके बाद चले जाने का क्रम दोनों व्यक्त करता है।
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: वह अपने देश को चला गया
  rationale: ἀπῆλθεν प्रस्थान को और γῆ यहाँ देश या स्वदेश को सूचित करता है। ‘अपने देश को चला गया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐποίησαν φονοκτονίαν
  choice: उन्होंने हत्याएँ कीं
  rationale: φονοκτονίαν जान लेने के निंदनीय और हिंसक कार्य को व्यक्त करता है। बहुवचन ‘हत्याएँ’ हिन्दी में सामूहिक या व्यापक हत्या का भाव स्वाभाविक रूप से देता है और यूनानी पद की नैतिक तीव्रता बनाए रखता है।
- source_word: ἐλάλησαν ὑπερηφανίαν μεγάλην
  choice: बड़े घमंड की बातें कहीं
  rationale: यह यूनानी संज्ञा-पद का स्वाभाविक हिन्दी रूप है। इससे अहंकारी वाणी का अर्थ बना रहता है, जबकि ‘बड़ा घमंड बोले’ जैसी असहज शब्दशः रचना से बचा जाता है।
theological_decisions:
- issue: φονοκτονίαν का नैतिक बल
  choice: हत्याएँ कीं
  alternative: रक्तपात किया; नरसंहार किया
  rationale: ‘हत्याएँ कीं’ जानबूझकर और निंदनीय ढंग से जान लेने का भाव स्पष्ट रखता है। ‘रक्तपात’ कुछ अधिक व्यापक है और ‘नरसंहार’ घटना के पैमाने को यूनानी से अधिक निश्चित कर सकता है।
- issue: एकवचन से बहुवचन कर्ता का परिवर्तन
  choice: ‘वह’ के बाद ‘उन्होंने’
  alternative: दोनों वाक्यों में एक ही कर्ता मान लेना
  rationale: यूनानी पाठ ἀπῆλθεν में एकवचन और ἐποίησαν/ἐλάλησαν में बहुवचन रखता है। अनुवाद इस तनाव को सुरक्षित रखता है और बहुवचन कर्ता की पहचान को चुपचाप एक व्यक्ति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यूनानी पाठ में कर्ता के एकवचन से बहुवचन में हुए परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
