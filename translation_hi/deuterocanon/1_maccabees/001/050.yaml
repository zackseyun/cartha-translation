lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: जो कोई … काम न करे
  rationale: ἄν के साथ यह रचना एक सामान्य और अनिश्चित शर्त व्यक्त करती है। संदर्भ में ποιέω का अर्थ राजा की आज्ञा के अनुसार आचरण करना है; ‘काम न करे’ स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: κατὰ τὸ ῥῆμα
  choice: वचन के अनुसार
  rationale: ῥῆμα का मूल अर्थ ‘कहा हुआ वचन/बात’ है। राजकीय संदर्भ में यह आदेश को सूचित करता है, फिर भी ‘वचन’ यूनानी की शाब्दिक व्यापकता को बनाए रखता है।
- source_word: τοῦ βασιλέως
  choice: राजा के
  rationale: यह सीधा संबंधकारक है और बताता है कि वचन राजा का है।
- source_word: ἀποθανεῖται
  choice: मर जाएगा
  rationale: क्रिया सीधे भविष्य में मृत्यु को व्यक्त करती है। संदर्भ में दंडस्वरूप मृत्यु निहित है, पर यूनानी पाठ मारने वाले कर्ता को स्पष्ट नहीं करता; इसलिए ‘मार डाला जाएगा’ के बजाय ‘मर जाएगा’ रखा गया है।
