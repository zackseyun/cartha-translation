  yaml_path: translation/deuterocanon/1_maccabees/001/044.yaml
  text: And the king sent letters by the hand of messengers to Jerusalem and the cities of Judah[a], that they should follow laws foreign to the land,
translation:
  language: hi
  text: और राजा ने दूतों के हाथों यरूशलेम और यहूदा के नगरों में पत्र भेजे कि वे उस देश के लिए पराए नियमों[a] का पालन करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रीति-रिवाजों।’ यूनानी शब्द νόμιμα प्रचलित रीतियों और प्रथाओं के साथ-साथ नियमों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλία
  choice: पत्र
  rationale: राजकीय आदेश भेजे जाने के इस प्रशासनिक संदर्भ में यह शब्द पुस्तकों के बजाय लिखित संदेशों या पत्रों को सूचित करता है।
- source_word: ἐν χειρὶ ἀγγέλων
  choice: दूतों के हाथ
  rationale: यह प्रयोग दूतों के माध्यम से पत्र पहुँचाए जाने को व्यक्त करता है और मूल की प्रशासनिक तथा सामी शैली को सहज हिन्दी में बनाए रखता है।
- source_word: προπορεύθηναι ὀπίσω
  choice: पालन करें
  rationale: शाब्दिक रूप से पीछे चलने का भाव यहाँ किसी निर्धारित मार्ग या व्यवस्था को अपनाने का निर्देश देता है; नियमों के साथ 'पालन करें' स्वाभाविक है।
- source_word: νομίμων
  choice: नियमों
  rationale: यह शब्द विधियों के साथ-साथ मान्य रीति-रिवाजों या प्रथाओं को भी सूचित कर सकता है। राजकीय आदेश के संदर्भ में 'नियमों' से इसकी बाध्यकारी शक्ति स्पष्ट होती है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: ἀλλοτρίων
  choice: पराए
  rationale: यह उन नियमों को दर्शाता है जो उस देश के अपने नहीं बल्कि दूसरों के हैं। 'पराए' इस विरोध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῆς γῆς
  choice: उस देश के लिए
  rationale: यूनानी में केवल 'देश/भूमि' है और संदर्भ यहूदा के देश का है। 'उस देश के लिए पराए' संबंध को स्पष्ट करता है, पर देश का नाम जोड़कर मूल से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: उत्पीड़न के संदर्भ में νομίμων का अर्थ-क्षेत्र
  choice: नियमों
  alternative: रीति-रिवाजों
  rationale: राजा द्वारा थोपी जा रही व्यवस्था के आधिकारिक और बाध्यकारी स्वरूप को 'नियमों' से व्यक्त किया गया है; फिर भी मूल शब्द में सामाजिक-धार्मिक रीति का भाव संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- issue: पत्र भेजने के बाद प्रयुक्त क्रियार्थक वाक्यांश का बल
  choice: कि वे ... पालन करें
  alternative: उन्हें ... पालन करने की आज्ञा देते हुए
  rationale: यह रचना पत्रों के उद्देश्य अथवा विषय को निर्देश के रूप में व्यक्त करती है, किंतु मूल में स्पष्ट रूप से 'आज्ञा देना' क्रिया न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण प्रशासनिक-वर्णनात्मक स्वर रखा गया है। मूल पद के अंत में जारी वाक्य को दिखाने के लिए अल्पविराम बनाए रखा गया है।
