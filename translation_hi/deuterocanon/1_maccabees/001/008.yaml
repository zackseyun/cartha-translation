lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: अधिकार जमा लिया
  rationale: ἐπικρατέω यहाँ सिकन्दर की मृत्यु के बाद उसके उत्तराधिकारियों द्वारा प्रभावी सत्ता स्थापित करने को व्यक्त करता है। ‘अधिकार जमा लिया’ आधुनिक हिन्दी में स्वाभाविक है और केवल शारीरिक रूप से ‘बलवान हुए’ का भ्रामक अर्थ नहीं देता।
- source_word: οἱ παῖδες αὐτοῦ
  choice: उसके पुत्रों
  rationale: παῖδες के अर्थ ‘सन्तान’ या ‘सेवक’ भी हो सकते हैं, पर राजवंशीय उत्तराधिकार के ऐतिहासिक संदर्भ में यहाँ ‘पुत्रों’ अभिप्रेत है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह यूनानी शब्द का सामान्य वितरणात्मक अर्थ सुरक्षित रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: अपने-अपने स्थान में
  rationale: τόπος का मूल अर्थ ‘स्थान’ है। ‘अपने-अपने’ प्रत्येक पुत्र के अलग क्षेत्र को स्पष्ट करता है, जबकि ‘स्थान’ मूल पाठ की सम्भावित व्यापकता बनाए रखता है।
