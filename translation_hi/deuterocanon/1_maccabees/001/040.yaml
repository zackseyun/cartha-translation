  yaml_path: translation/deuterocanon/1_maccabees/001/040.yaml
  text: According to her glory[a], her dishonor was multiplied[b], and her exaltation was turned into mourning.
translation:
  language: hi
  text: जितनी उसकी महिमा थी, उतना ही उसका अपमान बढ़ गया[a], और उसकी ऊँचाई शोक में बदल गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “उसकी महिमा के अनुपात में उसका अपमान बढ़ गया।”'
    reason: κατά यहाँ अनुरूपता या अनुपात व्यक्त कर सकता है।
  - marker: b
    text: “ऊँचाई” का अर्थ लाक्षणिक रूप से “ऊँचा पद,” “प्रतिष्ठा” या “उत्कर्ष” भी हो सकता है।
    reason: ὕψος में मूल ऊँचाई और लाक्षणिक उत्कर्ष, दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: जितनी उसकी महिमा थी, उतना ही
  rationale: κατά के साथ कर्मकारक यहाँ अनुपात या अनुरूपता व्यक्त करता है। यह रचना आधुनिक हिन्दी में उस तुलनात्मक संबंध को स्वाभाविक और स्पष्ट रखती है।
- source_word: ἀτιμασμὸς αὐτῆς
  choice: उसका अपमान
  rationale: ἀτιμασμός आदर या महिमा की हानि, अर्थात अपमान या तिरस्कार, को दर्शाता है। ‘अपमान’ δόξα के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἐπληθύνθη
  choice: बढ़ गया
  rationale: यूनानी कर्मवाच्य रूप का भाव मात्रा में वृद्धि है। शाब्दिक ‘बहुगुणित हुआ’ की अपेक्षा ‘बढ़ गया’ सहज हिन्दी है और अर्थ सुरक्षित रखता है।
- source_word: τὸ ὕψος αὐτῆς
  choice: उसकी ऊँचाई
  rationale: ὕψος का मूल बिंब ‘ऊँचाई’ है और प्रसंग में प्रतिष्ठित या ऊँची अवस्था का संकेत भी देता है। मूल रूपक और उसकी अर्थगत व्यापकता दोनों बनाए रखे गए हैं।
- source_word: ἐστράφη εἰς πένθος
  choice: शोक में बदल गई
  rationale: यह पदबंध एक अवस्था के दूसरी अवस्था में परिवर्तित होने को व्यक्त करता है; ‘शोक में बदल गई’ स्वाभाविक हिन्दी में उलटाव का बिंब बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग सर्वनाम का संदर्भ पिछले पदों की नगरी/यरूशलेम से है। समानांतरता और महिमा से अपमान तथा ऊँचाई से शोक की ओर उलटाव को सुरक्षित रखा गया है।
