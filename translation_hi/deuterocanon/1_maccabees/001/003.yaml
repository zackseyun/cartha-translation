  text: And he passed on to the ends of the earth, and took plunder from a multitude of nations; and the earth was quiet before him, and he was exalted, and his heart was lifted up.
translation:
  language: hi
  text: और वह पृथ्वी के छोरों तक आगे बढ़ा और उसने बहुत-सी जातियों से युद्ध की लूट ली। पृथ्वी उसके सामने शांत हो गई; वह ऊँचा उठाया गया, और उसका हृदय ऊँचा हो गया[a]।
