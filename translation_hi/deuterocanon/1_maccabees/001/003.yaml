lexical_decisions:
- source_word: διῆλθεν
  choice: आगे बढ़ा
  rationale: यह क्रिया प्रदेशों से होकर आगे जाने का भाव देती है; विजय-अभियान के संदर्भ में ‘आगे बढ़ा’ स्वाभाविक है और मार्ग या ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἕως ἄκρων τῆς γῆς
  choice: पृथ्वी के छोरों तक
  rationale: यह दूर-दूर तक विस्तृत पहुँच का पारंपरिक और अतिशयोक्तिपूर्ण मुहावरा है; ‘पृथ्वी के छोरों तक’ उसके विश्वव्यापी विजय-दावे को बनाए रखता है।
- source_word: ἔλαβεν σκῦλα
  choice: युद्ध की लूट ली
  rationale: σκῦλα युद्ध में जीती हुई लूट या शत्रु से छीनी गई संपत्ति को सूचित करता है; ‘युद्ध की लूट’ आधुनिक हिन्दी में प्रसंग स्पष्ट करता है।
- source_word: πλήθους ἐθνῶν
  choice: बहुत-सी जातियों से
  rationale: πλῆθος की बहुलता और ἔθνη के जनसमूहों/जातियों का अर्थ दोनों सुरक्षित रहते हैं; सम्बन्धकारक को यहाँ लूट के स्रोत के रूप में व्यक्त किया गया है।
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: पृथ्वी उसके सामने शांत हो गई
  rationale: ἡσυχάζω के शांत या स्थिर हो जाने के चित्र को बनाए रखा गया है। व्यापक विजय-संदर्भ के कारण γῆ के लिए ‘पृथ्वी’ चुना गया है; वाक्य अधीन हो जाने से उत्पन्न शांति का संकेत देता है, पर उसे स्पष्ट व्याख्या में नहीं बदलता।
- source_word: ὑψώθη
  choice: वह ऊँचा उठाया गया
  rationale: यूनानी निष्क्रिय रूप को बनाए रखते हुए पद, प्रतिष्ठा या महानता में ऊँचा किए जाने का भाव व्यक्त किया गया है।
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: उसका हृदय ऊँचा हो गया
  rationale: मूल का शाब्दिक मुहावरा सुरक्षित रखा गया है। यह घमंड का संकेत दे सकता है, पर मुख्य पाठ उस निहित नैतिक अर्थ को स्पष्ट विशेषण में नहीं बदलता।
