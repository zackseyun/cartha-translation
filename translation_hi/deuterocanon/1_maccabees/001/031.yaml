translation:
  language: hi
  text: और उसने नगर की लूट ले ली और नगर को आग से जला दिया; उसने उसके घरों और चारों ओर की नगर-दीवारों को ढा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: ले ली
  rationale: λαμβάνω का सामान्य कथात्मक अर्थ रखा गया है; यहाँ यह युद्ध में प्राप्त लूट को अपने अधिकार में लेने को दर्शाता है।
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: नगर की लूट
  rationale: σκῦλα युद्ध या हिंसक लूट में ली गई वस्तुओं को सूचित करता है। ‘नगर की लूट’ यूनानी संबंधकारक की संक्षिप्तता बनाए रखता है और प्रसंग में नगर से लूटी गई संपत्ति के रूप में स्वाभाविक है।
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: उसे आग से जला दिया
  rationale: ἐμπυρίζω के जलाने के अर्थ और स्पष्ट साधनवाचक πυρί, दोनों को रखा गया है। ‘आग से’ हिन्दी में कुछ बलाघात देता है, जैसा मूल में है।
- source_word: καθεῖλεν
  choice: ढा दिया
  rationale: καθαιρέω यहाँ इमारतों और दीवारों को बलपूर्वक गिराने या नष्ट करने का अर्थ देता है; ‘ढा दिया’ स्वाभाविक और सजीव हिन्दी है।
- source_word: τοὺς οἴκους αὐτῆς
  choice: उसके घरों
  rationale: οἶκοι को सीधे भौतिक घरों के रूप में अनूदित किया गया है; संबंधवाचक सर्वनाम नगर की ओर संकेत करता है।
- source_word: τὰ τείχη αὐτῆς
  choice: उसकी शहरपनाह
  rationale: τείχη सामान्य दीवारें नहीं, नगर की रक्षात्मक परकोटा-दीवारें हैं। ‘शहरपनाह’ इस विशेष अर्थ को संक्षेप में व्यक्त करता है।
- source_word: κύκλῳ
  choice: चारों ओर की
  rationale: κύκλῳ नगर को घेरे हुए दीवार की परिधीय स्थिति और व्यापक विनाश को दर्शाता है।
