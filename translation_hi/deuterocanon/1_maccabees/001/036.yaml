  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
translation:
  language: hi
  text: और वह पवित्रस्थान के विरुद्ध घात लगाने का स्थान और इस्राएल के विरुद्ध निरन्तर एक दुष्ट शत्रु बन गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक दुष्ट निन्दक।” यूनानी शब्द διάβολος का अर्थ निन्दक या विरोधी हो सकता है; यहाँ शत्रुतापूर्ण प्रसंग के कारण “शत्रु” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: बन गया
  rationale: यह क्रिया किसी विकसित या परिणामी अवस्था को व्यक्त करती है; पिछले प्रसंग में उल्लिखित गढ़ के इस रूप में काम करने लगने का भाव सुरक्षित रहता है।
- source_word: εἰς ἔνεδρον
  choice: घात
  rationale: ἔνεδρον घात लगाकर आक्रमण करने या घात की स्थिति को दर्शाता है। हिन्दी में ‘घात’ संक्षिप्त और स्वाभाविक है तथा सैन्य शत्रुता बनाए रखता है।
- source_word: τῷ ἁγιάσματι
  choice: पवित्रस्थान के लिए
  rationale: ἁγίασμα किसी पवित्र किए हुए स्थान को सूचित करता है। यरूशलेम के मन्दिर-सन्दर्भ में ‘पवित्रस्थान’ स्वाभाविक है और यूनानी से अधिक विशिष्टता नहीं जोड़ता।
- source_word: εἰς διάβολον πονηρόν
  choice: एक दुष्ट शत्रु
  rationale: यहाँ διάβολος सामान्य संज्ञा के रूप में निन्दक, विरोधी या शत्रु को सूचित कर सकता है। सैन्य और ऐतिहासिक सन्दर्भ में ‘शत्रु’ उपयुक्त है; ‘दुष्ट’ πονηρόν का नैतिक और हानिकारक भाव रखता है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के लिए
  rationale: यूनानी सम्प्रदान कारक को हिन्दी में ‘के लिए’ से रखा गया है; विधेय ‘दुष्ट शत्रु’ स्वयं प्रतिकूल सम्बन्ध को स्पष्ट करता है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: यह पद लगातार या हर समय बने रहने की अवधि व्यक्त करता है; ‘निरन्तर’ आधुनिक, गरिमापूर्ण हिन्दी में वही भाव देता है।
theological_decisions:
- issue: διάβολον को व्यक्तिवाचक उपाधि ‘शैतान’ माना जाए या सामान्य संज्ञा
  choice: 'सामान्य संज्ञा: ‘शत्रु’'
  alternative: निन्दक; शैतान
  rationale: ऐतिहासिक प्रसंग में यह गढ़ अथवा वहाँ की शत्रुतापूर्ण शक्ति की इस्राएल-विरोधी भूमिका बताता है, किसी अलौकिक व्यक्ति का नाम नहीं। ‘शैतान’ बाद के पारिभाषिक अर्थ को अनावश्यक रूप से आरोपित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ऐतिहासिक-वर्णन शैली। ‘पवित्रस्थान’ को एक शब्द के रूप में रखा गया है और διάβολος के बाद के पारिभाषिक अर्थ से बचा गया है।
