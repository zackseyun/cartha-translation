base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: hi
  text: और ऐसा हुआ कि फिलिप्पुस के पुत्र, मकदूनियाई सिकंदर ने—जो कित्तीम देश[a] से निकला था—फ़ारसियों और मादियों के राजा दारा को परास्त करने[b] के बाद उसके स्थान पर राज्य किया; इससे पहले वह यूनान पर राज्य कर चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कित्तीम एक पारंपरिक बाइबलीय स्थान-नाम है। प्रसंग के अनुसार यह विशेष रूप से साइप्रस या व्यापक अर्थ में पश्चिमी देशों को सूचित कर सकता है।
    reason: cultural_note
  - marker: b
    text: या, ‘उस पर प्रहार करने’। यूनानी क्रिया का अर्थ युद्ध में ‘परास्त करना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: और ऐसा हुआ कि
  rationale: यह यूनानी ऐतिहासिक आख्यान का आरंभिक सूत्र है। यह रूप उसकी कथात्मक भूमिका को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μετὰ τὸ πατάξαι
  choice: मार गिराने के बाद
  rationale: μετά के साथ क्रियारूप स्पष्ट कालक्रम, अर्थात् ‘के बाद’, व्यक्त करता है; πατάσσω का प्रबल सैन्य भाव भी रखा गया है।
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: फिलिप्पुस के पुत्र, मकिदुनी सिकंदर
  rationale: वंश और क्षेत्रीय पहचान दोनों सुरक्षित रखी गई हैं; शब्दक्रम स्वाभाविक हिन्दी के अनुरूप है।
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: कित्तीम देश से निकला था
  rationale: ‘निकलना’ यूनानी क्रिया की दिशात्मकता को बनाए रखता है, और पूर्णभूत रूप मुख्य घटना से पहले की पृष्ठभूमि स्पष्ट करता है।
- source_word: Χεττιείμ
  choice: कित्तीम
  rationale: परंपरागत बाइबलीय स्थान-नाम का लिप्यंतरण किया गया है ताकि उसे साइप्रस या सामान्यतः पश्चिमी देशों में से किसी एक अर्थ तक सीमित न किया जाए।
- source_word: ἐπάταξεν
  choice: मार गिराने
  rationale: यह अनुवाद शाब्दिक प्रहार और सैनिक पराजय दोनों की तीव्रता रखता है; ‘हरा देने’ का अर्थ फुटनोट में दिया गया है।
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: उसके स्थान पर राज्य किया
  rationale: यह दारा के बाद राजकीय उत्तराधिकार या प्रतिस्थापन का भाव स्पष्ट करता है और βασιλεύω की राजसत्ता-संबंधी बारीकी बनाए रखता है।
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: इससे पहले वह यूनान पर राज्य कर चुका था
  rationale: πρότερον को पूर्वकालिक अर्थ में लिया गया है; यह स्पष्ट करता है कि व्यापक विजय से पहले उसका शासन यूनान पर था।
theological_decisions:
- issue: Χεττιείμ की ऐतिहासिक-भौगोलिक पहचान
  choice: कित्तीम
  alternative: साइप्रस; मकिदुनिया; पश्चिमी देश
  rationale: मूल यूनानी स्वयं पारंपरिक बाइबलीय नाम का उपयोग करता है। मुख्य पाठ में उसका लिप्यंतरण वास्तविक भौगोलिक अस्पष्टता को सुरक्षित रखता है और किसी एक ऐतिहासिक पहचान को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ऐतिहासिक नामों के प्रचलित हिन्दी रूप लिए गए हैं; ‘कित्तीम’ को व्याख्यात्मक रूप से बदलने के बजाय सुरक्षित रखा गया है। लंबे यूनानी वाक्य को डैश और अर्धविराम से व्यवस्थित किया गया है, पर उसका कालक्रम और आशय अक्षुण्ण है।
