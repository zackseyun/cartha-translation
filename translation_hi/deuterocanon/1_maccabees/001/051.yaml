translation:
  language: hi
  text: इन सब बातों के अनुसार उसने अपने राज्य को लिख भेजा और सारी प्रजा पर निरीक्षक नियुक्त किए; और उसने यहूदा के नगरों को आदेश दिया कि वे नगर-नगर में बलि चढ़ाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: इन सब बातों के अनुसार
  rationale: λόγοι का मूल अर्थ ‘बातें/वचन’ है और κατά यहाँ अनुरूपता प्रकट करता है। ‘बातों’ से पूर्ववर्ती राजकीय निर्देशों का संबंध बना रहता है, बिना इसे केवल औपचारिक ‘आज्ञाओं’ तक सीमित किए।
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: उसने अपने राज्य को लिख भेजा
  rationale: सम्प्रदान कारक राज्य को लिखित संदेश का संबोधित क्षेत्र बताता है। ‘लिख भेजा’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी में न आए ‘सारे’ शब्द को मुख्य पाठ में नहीं जोड़ता।
- source_word: ἐποίησεν ἐπισκόπους
  choice: निरीक्षक नियुक्त किए
  rationale: यहाँ ἐπισκόπους राजकीय निगरानी करने वाले अधिकारियों के लिए है। ‘निरीक्षक’ प्रशासनिक अर्थ देता है और बाद के कलीसियाई पद ‘बिशप’ का काल-विपर्यय टालता है।
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: सारी प्रजा पर
  rationale: ἐπί के साथ कर्मकारक यहाँ अधिकार अथवा निगरानी का क्षेत्र बताता है; ‘प्रजा पर’ राजकीय संदर्भ में स्वाभाविक है।
- source_word: ἐνετείλατο
  choice: आदेश दिया
  rationale: क्रिया अधिकारपूर्वक आज्ञा देने का अर्थ रखती है; ‘आदेश दिया’ राजकीय बल को स्पष्ट रखता है।
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: यहूदा के नगरों को
  rationale: यह सीधा भौगोलिक-राजनीतिक अर्थ रखता है और नगरों को उनके निवासियों के लिए प्रयुक्त करने वाली मूल पाठ की अभिव्यक्ति को बनाए रखता है।
- source_word: θυσιάζειν
  choice: बलि चढ़ाएँ
  rationale: यह हिन्दी में धार्मिक बलिदान की क्रिया के लिए स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: नगर-नगर में
  rationale: दोहरावयुक्त यूनानी पदबंध वितरण का भाव देता है, अर्थात प्रत्येक नगर में; ‘नगर-नगर में’ उस स्थानीय और क्रमिक व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ἐπισκόπους को बाद के कलीसियाई पद के रूप में पढ़े जाने की सम्भावना
  choice: निरीक्षक
  alternative: बिशप; अधिकारी; पर्यवेक्षक
  rationale: प्रसंग राजकीय आदेश लागू कराने वाले प्रशासनिक व्यक्तियों का है। ‘निरीक्षक’ मूल निगरानी के भाव को रखता है और बाद की कलीसियाई पदावली आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास को हिन्दी के अनुकूल किया गया है, जबकि राजकीय आदेश, व्यापक निगरानी और नगर-नगर बलि चढ़ाने के वितरणात्मक भाव को सुरक्षित रखा गया है।
