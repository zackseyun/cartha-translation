  yaml_path: translation/deuterocanon/1_maccabees/001/035.yaml
  text: And they stored up weapons and provisions[a], and after gathering the spoils of Jerusalem they deposited them there, and it became a great snare,
translation:
  language: hi
  text: उन्होंने हथियार और रसद जमा कर रखे, और यरूशलेम की लूट[a] इकट्ठी करके वहीं रख दी; और वह एक बड़ा फंदा बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम से ली गई लूट।” यूनानी संबंधकारक का अर्थ “यरूशलेम की लूट” अथवा “यरूशलेम से ली गई लूट” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέθεντο
  choice: जमा कर ली
  rationale: सैन्य संदर्भ में यह हथियारों और रसद को उद्देश्यपूर्वक भंडार में रखने का भाव देता है; सामान्य ‘रख दी’ की अपेक्षा ‘जमा कर ली’ अधिक स्वाभाविक है।
- source_word: ὅπλα
  choice: हथियार
  rationale: यह यूनानी शब्द शस्त्रों या युद्ध के साधनों के लिए व्यापक रूप से प्रयुक्त हो सकता है; ‘हथियार’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: τροφήν
  choice: रसद
  rationale: मूल अर्थ भोजन या पोषण है, पर सैनिक भंडारण के प्रसंग में ‘रसद’ छावनी के लिए संचित खाद्य-सामग्री का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: συναγαγόντες
  choice: इकट्ठी करके
  rationale: कृदंत की क्रिया मुख्य क्रिया ἀπέθεντο से पहले घटती है; ‘इकट्ठी करके’ इस क्रम को संक्षेप और स्वाभाविक ढंग से दिखाता है।
- source_word: τὰ σκῦλα
  choice: लूट
  rationale: यह बलपूर्वक छीनी गई वस्तुओं को दर्शाता है। ‘लूट’ आधुनिक हिन्दी में स्पष्ट है और यहाँ सामूहिक वस्तुओं के अर्थ में स्वाभाविक बैठता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम की
  rationale: यूनानी संबंधकारक लूट और यरूशलेम का संबंध बताता है, पर उसे केवल स्रोत के रूप में स्पष्ट नहीं करता; हिन्दी का ‘यरूशलेम की लूट’ वही संक्षिप्त अस्पष्टता बनाए रखता है।
- source_word: ἀπέθεντο
  choice: रख दी
  rationale: यह इकट्ठी की गई लूट को उस स्थान पर रख देने को व्यक्त करता है। पहले प्रयुक्त ‘जमा कर ली’ से भिन्न अभिव्यक्ति मूल के क्रियात्मक अंतर को बनाए रखती है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह पिछले पद में बताए गए किलेबंद स्थान की ओर संकेत करता है; ‘वहीं’ हिन्दी में उस पूर्वोक्त स्थान को स्वाभाविक रूप से दर्शाता है।
- source_word: παγίδα
  choice: फंदा
  rationale: मूल में जाल या फंदे का रूपक है। ‘फंदा’ उस अशुभ, फँसाने वाले बिंब को बनाए रखता है और यह तय नहीं करता कि विशेष रूप से कौन उसमें फँसा।
theological_decisions:
- issue: μεγάλην παγίδα का रूपक
  choice: एक बड़ा फंदा
  alternative: एक बड़ा जाल / एक बड़ा खतरा
  rationale: ‘फंदा’ मूल रूपक को बनाए रखता है, जबकि ‘खतरा’ उसे व्याख्यात्मक रूप से सामान्य बना देता। वाक्य यह स्पष्ट नहीं करता कि वह किसके लिए फंदा बना; अनुवाद भी इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘रसद’ सैन्य संदर्भ को संक्षेप में व्यक्त करता है, और ‘फंदा’ मूल के रूपक को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
