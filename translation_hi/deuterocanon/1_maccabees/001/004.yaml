  yaml_path: translation/deuterocanon/1_maccabees/001/004.yaml
  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
translation:
  language: hi
  text: उसने एक अत्यंत शक्तिशाली सैन्य-बल इकट्ठा किया और वह भूभागों, राष्ट्रों और निरंकुश राज्यों[a] पर शासन करने लगा[b]; वे उसके अधीन होकर उसे कर देने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘निरंकुश शासन’ भी हो सकता है; यहाँ आशय सम्भवतः निरंकुश शासकों के अधीन राज्यों या क्षेत्रों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शासन किया’; यूनानी क्रिया का अर्थ ‘शासन करना’ हो सकता है, और यहाँ उसका भूतकालिक रूप उस शासन के आरम्भ पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν
  choice: इकट्ठा किया
  rationale: यहाँ क्रिया सैन्य-साधनों अथवा सैनिक शक्ति को जुटाने का बोध देती है; ‘इकट्ठा किया’ सहज और ठोस हिन्दी है।
- source_word: δύναμιν
  choice: सैन्य-बल
  rationale: ऐतिहासिक-सैन्य प्रसंग में शब्द का अर्थ सशस्त्र शक्ति या सेना है। ‘सैन्य-बल’ सेना तक सीमित हुए बिना सैन्य अर्थ स्पष्ट रखता है।
- source_word: ἰσχυρὰν σφόδρα
  choice: अत्यंत शक्तिशाली
  rationale: विशेषण और क्रिया-विशेषण का मेल प्रबल तीव्रता व्यक्त करता है, जिसे यह पदबंध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦρξεν
  choice: शासन करने लगा
  rationale: सम्बन्धकारक पदों के साथ ἄρχω का अर्थ ‘पर शासन करना’ है; भूतकालिक रूप को यहाँ शासन के आरम्भ पर बल देने वाला समझना प्रसंगानुकूल है, पर विकल्प पादटिप्पणी में रखा गया है।
- source_word: χωρῶν
  choice: देशों
  rationale: यहाँ शब्द भूभागों या राजनीतिक क्षेत्रों को दर्शाता है। ‘देशों’ आधुनिक राष्ट्र-राज्य का कठोर अर्थ आरोपित किए बिना सहज हिन्दी देता है।
- source_word: ἐθνῶν
  choice: जातियों
  rationale: शब्द विभिन्न जनसमुदायों या राष्ट्रों को सूचित करता है। ‘जातियों’ बाइबलीय-ऐतिहासिक प्रसंग में अलग-अलग peoples का स्वाभाविक हिन्दी रूप है।
- source_word: τυραννιῶν
  choice: निरंकुश राज्यों
  rationale: यूनानी शब्द केवल अत्याचार की अमूर्त अवस्था नहीं, बल्कि निरंकुश शासकों के अधीन क्षेत्रों या शासन-व्यवस्थाओं की ओर संकेत करता है।
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: वे उसके करदाता बन गए
  rationale: यह वाक्यांश कर चुकाने की राजनीतिक बाध्यता के अधीन आ जाने को व्यक्त करता है; ‘करदाता बन गए’ परिणामी स्थिति को संक्षेप और सहज रूप से बताता है।
theological_decisions:
- issue: ἦρξεν में शासन और आरम्भ का सम्भावित अर्थ-संबंध
  choice: शासन करने लगा
  alternative: शासन किया
  rationale: रूप शासन करने का अर्थ देता है और प्रसंग में उसके प्रभुत्व के आरम्भ को भी उभार सकता है। मुख्य पाठ दोनों को ‘करने लगा’ से समेटता है, जबकि साधारण भूतकाल का विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज ऐतिहासिक गद्य। ‘सैन्य-बल’ सैन्य प्रसंग स्पष्ट करता है, और ‘निरंकुश राज्य’ असामान्य यूनानी राजनीतिक श्रेणी को अत्यधिक शाब्दिक या अस्पष्ट बनाए बिना सुरक्षित रखता है।
