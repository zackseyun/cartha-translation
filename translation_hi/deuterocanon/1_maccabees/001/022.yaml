  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
translation:
  language: hi
  text: और भेंट की रोटियाँ रखने की मेज़[a], पेय-बलि के पात्र, कटोरे, सोने के धूपदान, परदा, मुकुट और मंदिर के मुखभाग पर लगी सोने की सजावट—उसने यह सब उखाड़ लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘उपस्थिति की मेज़’ या ‘दर्शन की रोटियों की मेज़’ भी कहा जा सकता है। यूनानी में शाब्दिक रूप से उस मेज़ का उल्लेख है जिस पर परमेश्वर के सामने रोटियाँ रखी जाती थीं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अर्थ ‘छीलकर उतारना’ या ‘उखाड़ लेना’ हो सकता है; इससे संभवतः मंदिर के मुखभाग पर चढ़ी सोने की परत या सजावटी आवरण हटाने का संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: भेंट की रोटियाँ रखने की मेज़
  rationale: मंदिर के संदर्भ में यह पद परमेश्वर के सामने विधिपूर्वक रखी जाने वाली रोटियों से संबंधित मेज़ को सूचित करता है। यह अनुवाद उसके धार्मिक उपयोग को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: σπονδεῖα
  choice: पेय-बलि के पात्र
  rationale: ये पेय-बलि चढ़ाने में प्रयुक्त पात्र थे; यह अभिव्यक्ति अनुष्ठानिक अर्थ को स्पष्ट और सहज रखती है।
- source_word: φιάλας
  choice: कटोरे
  rationale: यह शब्द प्रायः चौड़े, अनुष्ठान में प्रयुक्त कटोरों के लिए आता है; ‘कटोरे’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: सोने के धूपदान
  rationale: यह धूप जलाने के उपकरणों को दर्शाता है, और χρυσᾶς बताता है कि वे सोने के थे।
- source_word: καταπέτασμα
  choice: परदा
  rationale: यह मंदिर के लटकते परदे को सूचित करता है; ‘परदा’ आधुनिक हिन्दी में ‘आवरण’ या पारंपरिक ‘पर्दा/घूँघट’ से अधिक सहज और सटीक है।
- source_word: στεφάνους
  choice: मुकुट
  rationale: मूल शब्द का अर्थ मुकुट या पुष्पमालानुमा अलंकरण हो सकता है। ‘मुकुट’ मूल की ठोस छवि और उसकी संभावित सजावटी भूमिका दोनों को खुला रखता है।
- source_word: κόσμον τὸν χρυσοῦν
  choice: सोने की सजावट
  rationale: κόσμος यहाँ संसार नहीं, बल्कि अलंकरण या सजावट है। यह चयन अर्थ को सरल और स्पष्ट रखता है।
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: मंदिर के मुखभाग पर लगी
  rationale: इस सूची के स्थापत्य संदर्भ में वाक्यांश मंदिर के सामने वाले भाग या अग्रभाग पर स्थित सजावट को सूचित करता है।
- source_word: ἐλέπισεν πάντα
  choice: उसने यह सब नोचकर उतार लिया
  rationale: क्रिया में छीलने या परत उतारने जैसी प्रबल छवि है। ‘नोचकर उतार लिया’ लूट की हिंसक क्रिया और सोने की परत अथवा सजावट हटाने की संभावना को व्यक्त करता है।
