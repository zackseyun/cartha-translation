translation:
  language: hi
  text: और उन्होंने पवित्रस्थान के चारों ओर निर्दोष रक्त बहाया और पवित्रस्थान को अपवित्र कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: खून बहाया
  rationale: यूनानी क्रिया का मूल चित्र ‘उँडेलना’ है, पर खून के संदर्भ में आधुनिक हिन्दी का स्वाभाविक और सटीक प्रयोग ‘खून बहाना’ है।
- source_word: αἷμα ἀθῷον
  choice: निर्दोषों का खून
  rationale: यह अन्यायपूर्वक मारे गए निर्दोष लोगों के रक्त को दर्शाता है। ‘निर्दोषों का खून’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी पद का आशय स्पष्ट करता है।
- source_word: κύκλῳ
  choice: चारों ओर
  rationale: यह पवित्रस्थान के आसपास के क्षेत्र को सूचित करता है; ‘चारों ओर’ स्थानगत अर्थ को सहजता से व्यक्त करता है।
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह किसी अमूर्त पवित्रता के बजाय पवित्र उपासना-स्थल को दर्शाता है। दोनों बार एक ही शब्द रखकर यूनानी की पुनरावृत्ति और बल सुरक्षित रखा गया है।
- source_word: ἐμόλυναν
  choice: अशुद्ध कर दिया
  rationale: क्रिया धार्मिक और नैतिक अपवित्रीकरण का बोध कराती है। ‘अशुद्ध कर दिया’ सामान्य पाठक के लिए स्पष्ट रहते हुए इस धार्मिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ἁγίασμα का उपासना-संबंधी अर्थ
  choice: पवित्रस्थान
  alternative: पवित्र स्थान; मन्दिर का पवित्रस्थान
  rationale: संदर्भ यरूशलेम के पवित्र उपासना-स्थल के अपमान का है। ‘पवित्रस्थान’ मूल के धार्मिक अर्थ को रखता है, पर यूनानी से अधिक विशिष्ट विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। मूल यूनानी की समांतर रचना तथा ‘पवित्रस्थान’ की पुनरावृत्ति सुरक्षित है।
