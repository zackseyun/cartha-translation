translation:
  language: hi
  text: और व्यवस्था की जो पुस्तकें उन्हें मिलीं, उन्हें उन्होंने फाड़कर आग में जला दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  choice: पुस्तकें
  rationale: βιβλία लिखित पुस्तकों या ग्रंथों के लिए सामान्य बहुवचन है। प्राचीन भौतिक रूप संभवतः पुस्तक-पट था, पर यूनानी शब्द स्वयं यहाँ उस रूप को स्पष्ट नहीं करता; इसलिए आधुनिक हिन्दी में स्वाभाविक ‘पुस्तकें’ चुना गया।
- source_word: τοῦ νόμου
  choice: व्यवस्था की
  rationale: νόμος यहाँ यहूदी धर्म-व्यवस्था अर्थात तोराह को सूचित करता है। ‘व्यवस्था’ बाइबलीय सन्दर्भ में परिचित है और यूनानी सम्बन्धवाचक रचना को निकटता से व्यक्त करता है।
- source_word: ἃ εὗρον
  choice: जो ... उन्हें मिलीं
  rationale: इसका सीधा अर्थ ‘जो उन्हें मिलीं/जो उन्होंने पाईं’ है। हिन्दी में पुस्तकों के मिल जाने के लिए यह रचना स्वाभाविक है और यूनानी में निहित सामान्य सापेक्ष अर्थ को बनाए रखती है।
- source_word: κατασχίσαντες
  choice: फाड़कर
  rationale: क्रिया का अर्थ फाड़ डालना या टुकड़े करना है। पूर्वकालिक कृदन्त को हिन्दी के ‘-कर’ रूप से व्यक्त किया गया है, जिससे जलाने के साथ इसका निकट सम्बन्ध बना रहता है।
- source_word: ἐνεπύρισαν πυρί
  choice: आग में जला दिया
  rationale: क्रिया जलाने या आग लगाने को और πυρί आग को स्पष्ट करती है। ‘आग में जला दिया’ हिन्दी में स्वाभाविक रहते हुए यूनानी की प्रबल अग्नि-सम्बन्धी अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: νόμος का तोराह से सम्बन्ध
  choice: व्यवस्था
  alternative: तोराह
  rationale: सन्दर्भ यहूदी तोराह का है, किन्तु मूल पाठ सामान्य यूनानी शब्द νόμος प्रयोग करता है। ‘व्यवस्था’ मूल की शब्दावली के निकट है और अनुवाद में इब्रानी नाम को अतिरिक्त रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है; किसी सम्प्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
