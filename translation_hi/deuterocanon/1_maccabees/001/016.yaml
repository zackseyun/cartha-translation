    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: सुदृढ़ हो गया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘तैयार किया गया’ है, पर राजसत्ता के प्रसंग में राज्य के व्यवस्थित या सुरक्षित हो जाने का भाव है। ‘सुदृढ़ हो गया’ इस राजनीतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ἡ βασιλεία
  choice: राज्य
  rationale: βασιλεία का अर्थ ‘राजत्व/राजसत्ता’ अथवा ‘राज्य’ हो सकता है। आगे ‘दोनों राज्यों’ का उल्लेख होने से यहाँ ‘राज्य’ उपयुक्त है, यद्यपि राजकीय अधिकार का भाव भी निहित है।
- source_word: ἐνώπιον Ἀντιόχου
  choice: अन्तियोकुस के सामने
  rationale: यह यूनानी पदबंध का औपचारिक रूप से निकट अनुवाद है। प्रसंग में इसका आशय अन्तियोकुस के लिए राज्य के सुरक्षित या व्यवस्थित हो जाने से हो सकता है; इस सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: ὑπέλαβεν
  choice: बीड़ा उठाया
  rationale: यहाँ क्रिया के साथ अनन्त क्रिया βασιλεῦσαι है और अर्थ किसी काम को हाथ में लेने या उसका उपक्रम करने का है। ‘बीड़ा उठाया’ आधुनिक हिन्दी में प्रयास और अभिप्राय दोनों को व्यक्त करता है, बिना सफलता को मान लिए।
- source_word: βασιλεῦσαι
  choice: शासन करने
  rationale: यह राजकीय शासन करने को दर्शाता है। भूभाग के साथ ‘शासन करना’ हिन्दी में ‘राजा होना’ या ‘राज करना’ की अपेक्षा अधिक सहज है।
- source_word: γῆς Αἰγύπτου
  choice: मिस्र देश
  rationale: यह यूनानी के भूभाग-सूचक ‘मिस्र की भूमि’ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὅπως
  choice: ताकि
  rationale: यहाँ ὅπως उद्देश्य प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में इसका स्पष्ट और सहज रूप है।
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: दोनों राज्यों पर
  rationale: यह दो अलग राज्यक्षेत्रों—अन्तियोकुस के अपने राज्य और मिस्र—पर शासन करने के अभिप्राय को सीधे व्यक्त करता है।
