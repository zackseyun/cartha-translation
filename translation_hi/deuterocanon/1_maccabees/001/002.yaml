translation:
  language: hi
  text: और उसने बहुत-से युद्ध किए, गढ़ों पर अधिकार कर लिया और राजाओं का वध किया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο
  choice: किए
  rationale: πολέμους के साथ यह क्रिया युद्ध छेड़ने या लड़ने का भाव देती है। हिंदी में ‘युद्ध किए’ स्वाभाविक और व्यापक है तथा केवल आरंभ करने का अर्थ आरोपित नहीं करता।
- source_word: πολέμους πολλούς
  choice: बहुत-से युद्ध
  rationale: बहुवचन व्यापक सैन्य संघर्षों को दर्शाता है; ‘अभियान’ अधिक व्याख्यात्मक और ‘लड़ाइयाँ’ अपेक्षाकृत संकीर्ण होता।
- source_word: ἐκράτησεν
  choice: अधिकार कर लिया
  rationale: यहाँ क्रिया बलपूर्वक नियंत्रण या आधिपत्य प्राप्त करने को व्यक्त करती है; यह अर्थ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: ὀχυρωμάτων
  choice: गढ़ों
  rationale: यह शब्द किलेबंद और सुरक्षित स्थानों का द्योतक है। ‘गढ़’ संक्षिप्त, सुबोध और सैन्य संदर्भ के अनुकूल है।
- source_word: ἔσφαξεν
  choice: वध किया
  rationale: σφάζω साधारण मार डालने से अधिक तीव्र और हिंसक क्रिया है। ‘वध किया’ उसकी गंभीरता बनाए रखता है, पर अनावश्यक रूप से बोलचाल या वीभत्स नहीं बनता।
- source_word: βασιλεῖς
  choice: राजाओं
  rationale: यूनानी शब्द विशिष्ट राजकीय पद ‘राजा’ को सूचित करता है; ‘शासक’ कहना इसे अनावश्यक रूप से सामान्य बना देता।
