  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यायामशाला’ ऐतिहासिक संस्था को सामान्य पाठक के लिए बोधगम्य बनाती है; ‘रीति’ सामाजिक-सांस्कृतिक प्रथाओं के अर्थ को संक्षेप में व्यक्त करती है।
