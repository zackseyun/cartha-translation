lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: बनाई
  rationale: यूनानी क्रिया का सीधा अर्थ निर्माण करना है। स्त्रीलिंग संज्ञा ‘व्यायामशाला’ के साथ ‘बनाई’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: γυμνάσιον
  choice: व्यायामशाला
  rationale: यह शब्द हेलेनवादी शारीरिक प्रशिक्षण की संस्था को दर्शाता है। ‘व्यायामशाला’ सामान्य पाठक के लिए स्पष्ट है और केवल आधुनिक विद्यालय के खेल-कक्ष का अर्थ देने से बचती है।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: यह स्थानवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: κατὰ τὰ νόμιμα
  choice: रीति के अनुसार
  rationale: यहाँ पदबंध किसी मानक प्रथा या स्वीकृत सामाजिक व्यवहार के अनुरूप होने का भाव देता है; इसका आशय केवल लिखित कानूनों से नहीं है।
- source_word: τῶν ἐθνῶν
  choice: दूसरी जातियों
  rationale: यहूदी संदर्भ में यूनानी पद गैर-यहूदी लोगों को दर्शाता है। ‘दूसरी जातियों’ उस भेद को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल के अधिक शाब्दिक रूप को सुरक्षित रखती है।
theological_decisions:
- issue: यहूदी संदर्भ में ἐθνῶν का अनुवाद
  choice: दूसरी जातियों
  alternative: राष्ट्रों; गैर-यहूदियों
  rationale: यह विकल्प यहूदियों और अन्य लोगों के बीच मूल पाठ में उपस्थित भेद को बनाए रखता है, पर ‘मूर्तिपूजकों’ जैसा अधिक नकारात्मक या व्याख्यात्मक अर्थ नहीं जोड़ता।
