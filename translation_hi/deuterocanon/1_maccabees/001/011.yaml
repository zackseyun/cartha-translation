base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: hi
  text: उन दिनों इस्राएल में से अधर्मी लोग[a] निकले। उन्होंने बहुत-से लोगों को यह कहकर राज़ी कर लिया, “चलो, हम अपने आस-पास की जातियों के साथ वाचा बाँधें, क्योंकि जब से हम उनसे अलग हुए हैं[b], तब से हम पर बहुत-सी विपत्तियाँ आ पड़ी हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अधर्मी पुत्र”; अर्थात ऐसे लोग जिनकी पहचान व्यवस्था के उल्लंघन से थी।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “जब से हमें उनसे अलग किया गया” भी हो सकता है।
    reason: grammatical_ambiguity
  - marker: c
    text: शाब्दिक रूप से, “बहुत-सी बुराइयों ने हमें पा लिया”; यहाँ आशय अनेक विपत्तियों या संकटों के आ पड़ने से है।
    reason: source_idiom
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: इस्राएल में से ... निकले
  rationale: यह मूल पाठ की गति-छवि को बनाए रखते हुए स्पष्ट करता है कि ये लोग इस्राएल समुदाय के भीतर से उभरे थे।
- source_word: υἱοὶ παράνομος
  choice: अधर्मी लोग
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से पारिवारिक ढंग की है, पर यहाँ ऐसे लोगों को सूचित करती है जिनकी पहचान व्यवस्था के उल्लंघन से होती है। ‘अधर्मी लोग’ स्वाभाविक और प्रसंगानुकूल हिन्दी है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀνέπεισαν πολλοὺς
  choice: बहुत-से लोगों को ... राज़ी कर लिया
  rationale: क्रिया का मूल अर्थ मनाना या सहमत कर लेना है। यह अनुवाद कथाकार की असहमति को बढ़ाकर ‘बहकाया’ जैसी अतिरिक्त अर्थ-छाया नहीं जोड़ता।
- source_word: Πορευθῶμεν
  choice: चलो
  rationale: यह आग्रहसूचक प्रथम पुरुष बहुवचन का सहज आधुनिक हिन्दी रूप है।
- source_word: διαθώμεθα διαθήκην
  choice: वाचा बाँधें
  rationale: यह स्थापित बाइबलीय वाचाई शब्दावली को सुरक्षित रखता है और इसे केवल सामान्य समझौते या राजनीतिक गठबंधन तक सीमित नहीं करता।
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: अपने आस-पास की जातियों
  rationale: ἔθνη यहाँ पड़ोसी गैर-इस्राएली जनसमूहों को दर्शाता है। ‘जातियाँ’ बाइबलीय प्रयोग से संगत और सामान्य पाठक के लिए बोधगम्य है।
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: जब से हम उनसे अलग हुए हैं
  rationale: यह कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी निष्क्रिय रूप में निहित इस अस्पष्टता को खुला रखता है कि अलगाव स्वयं किया गया था या घटित/कराया गया था।
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: हम पर बहुत-सी विपत्तियाँ आ पड़ी हैं
  rationale: प्रसंग में κακά नैतिक बुराइयों के बजाय संकटों या दुर्भाग्यों को सूचित करता है। हिन्दी मुहावरा आशय को स्पष्ट करता है, जबकि मूल की सजीव शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: राजनीतिक और धार्मिक रूप से संवेदनशील प्रसंग में διαθήκη का अनुवाद
  choice: वाचा बाँधें
  alternative: समझौता करें / गठबंधन करें
  rationale: διαθήκη प्रमुख बाइबलीय शब्द है। ‘वाचा’ इस्राएल द्वारा आस-पास की जातियों के साथ औपचारिक संबंध बनाने की धार्मिक गंभीरता को बनाए रखता है और पाठ को केवल राजनीति तक सीमित नहीं करता।
- issue: इस्राएल के जातियों से अलगाव में कर्तृत्व
  choice: हम उनसे अलग हुए हैं
  alternative: हमने अपने आपको उनसे अलग किया / हमें उनसे अलग किया गया
  rationale: ἐχωρίσθημεν रूपतः निष्क्रिय है, पर मध्यवाची या आत्मवाची भाव में भी समझा जा सकता है। मुख्य पाठ का हिन्दी रूप इस प्रश्न को अनावश्यक रूप से तय नहीं करता; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ जैसे प्रमुख बाइबलीय पद को बनाए रखा गया है, जबकि ‘राज़ी कर लिया’ और ‘विपत्तियाँ आ पड़ी हैं’ स्वाभाविक हिन्दी मुहावरे प्रदान करते हैं।
