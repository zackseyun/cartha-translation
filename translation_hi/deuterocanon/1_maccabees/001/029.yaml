lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: दो वर्ष बीतने के बाद
  rationale: यूनानी मुहावरा शाब्दिक रूप से ‘दो वर्षों के दिनों के बाद’ है और बीते हुए समय को दर्शाता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह भेजने के लिए प्रयुक्त सामान्य क्रिया का सरल और सटीक हिन्दी रूप है।
- source_word: ἄρχοντα φορολογίας
  choice: कर वसूलने के लिए एक प्रधान अधिकारी
  rationale: ἄρχων अधिकारी अथवा शासकीय प्रधान को और φορολογία कर/राजस्व-वसूली को सूचित करता है। यह रूप उस व्यक्ति के आधिकारिक पद और कार्य दोनों को स्पष्ट करता है।
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: यहूदा के नगरों में
  rationale: भेजे जाने की दिशा और कार्यक्षेत्र दोनों को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: एक बड़ी सेना
  rationale: ὄχλος भीड़, जनसमूह या साथ आए दल को और βαρύς भारी/विशाल को दर्शाता है। शत्रुतापूर्ण राजकीय अभियान के प्रसंग में ‘बड़ी सेना’ स्वाभाविक है, जबकि पादटिप्पणी मूल अभिव्यक्ति की व्यापकता सुरक्षित रखती है।
