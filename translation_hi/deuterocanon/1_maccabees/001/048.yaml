  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आदेशात्मक infinitives को पिछले प्रसंग पर निर्भर विधिलिंग रूपों में प्रस्तुत किया गया है। ‘खतनारहित’ संक्षिप्त और धार्मिक संदर्भ में स्पष्ट है; ‘प्राणों’ के साथ पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
