  yaml_path: translation/deuterocanon/1_maccabees/001/048.yaml
  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
translation:
  language: hi
  text: और वे अपने पुत्रों को खतनारहित छोड़ दें, हर प्रकार की अशुद्ध वस्तु से उनके प्राणों को घृणित बनाएँ[a] और उन्हें अपवित्र करें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर प्रकार की अशुद्ध वस्तु से उनके प्राणों को दूषित करें’; यूनानी क्रिया घृणित ठहराने और दूषित करने, दोनों भावों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘अपवित्र करें’ का कर्म स्पष्ट रूप से दोहराया नहीं गया है; वह स्वाभाविक रूप से ‘उनके प्राणों’ से समझा जाता है, यद्यपि अर्थ को व्यापक रूप से उन लोगों पर भी लागू समझा जा सकता है।
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἀφεῖναι
  choice: छोड़ दें
  rationale: यहाँ ἀφίημι का अर्थ किसी को एक निश्चित अवस्था में रहने देना है; आदेशों की शृंखला में ‘छोड़ दें’ स्वाभाविक और सटीक है।
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: अपने पुत्रों को
  rationale: υἱούς विशेष रूप से पुत्रों को सूचित करता है और खतने के तात्कालिक संदर्भ के अनुरूप है।
- source_word: ἀπεριτμήτους
  choice: खतनारहित
  rationale: यह विशेषण बिना खतने की अवस्था को सीधे व्यक्त करता है और उसके वाचागत तथा धार्मिक अर्थ को बनाए रखता है।
- source_word: βδελύξαι
  choice: घृणित बनाएँ
  rationale: βδελύσσομαι से संबद्ध यह क्रिया घृणा या जुगुप्सा उत्पन्न करने का भाव रखती है; ‘घृणित बनाएँ’ इस भाव को केवल ‘अशुद्ध करें’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: τὰς ψυχὰς αὐτῶν
  choice: उनके प्राणों को
  rationale: ψυχή यहाँ प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है। ‘प्राणों’ से मूल का नैतिक-धार्मिक भार बना रहता है, जबकि इसे केवल देह या अमूर्त आत्मा तक सीमित नहीं किया जाता।
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: हर प्रकार की अशुद्ध वस्तु से
  rationale: ἐν यहाँ साधन अथवा संपर्क का भाव देता है; नपुंसकलिंग ἀκαθάρτῳ को ‘अशुद्ध वस्तु’ कहना उसकी व्यापकता बनाए रखता है।
- source_word: βεβηλώσαι
  choice: अपवित्र करें
  rationale: βεβηλόω का अर्थ पवित्रता का उल्लंघन करके अपवित्र करना है; यह पूर्ववर्ती ‘घृणित बनाएँ’ से अर्थगत भेद भी बनाए रखता है।
theological_decisions:
- issue: अनुष्ठानिक-वाचागत संदर्भ में ψυχή का अनुवाद
  choice: उनके प्राणों को
  alternative: उनके जीवन को; स्वयं उन्हें
  rationale: मूल शब्द जीवन, प्राण या व्यक्ति का बोध करा सकता है। ‘प्राणों’ से नैतिक और धार्मिक गंभीरता बनी रहती है, पर पाठ को किसी विशिष्ट आत्मा-देह सिद्धांत में नहीं बाँधा जाता।
- issue: βεβηλώσαι के निहित कर्म का संदर्भ
  choice: ‘उन्हें’ को ‘उनके प्राणों’ का संदर्भ माना गया
  alternative: ‘उन्हें’ को व्यापक रूप से उन लोगों का संदर्भ समझना
  rationale: यूनानी वाक्यरचना में स्पष्ट कर्म τὰς ψυχὰς αὐτῶν है, जो दोनों क्रियाओं के साथ स्वाभाविक रूप से जुड़ता है; फिर भी सर्वनाम को व्यापक रूप से व्यक्तियों पर लागू सुनना संभव है।
