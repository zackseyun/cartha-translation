lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: बनाने
  rationale: अओरिस्ट क्रियार्थक संज्ञा आज्ञा के अधीन किए जाने वाले कार्य को व्यक्त करती है; ‘बनाने’ तीनों कर्मों के साथ स्वाभाविक है।
- source_word: βωμούς
  choice: वेदियाँ
  rationale: βωμός बलि चढ़ाने की वेदी को दर्शाता है; ‘वेदियाँ’ इसका सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: τεμένη
  choice: पवित्र-स्थल
  rationale: τέμενος किसी देवता के लिए अलग किए गए पवित्र परिसर या उपासना-स्थल को दर्शा सकता है। ‘पवित्र-स्थल’ अर्थ को स्पष्ट रखता है और अत्यधिक तकनीकी नहीं है।
- source_word: εἴδωλα
  choice: मूर्तियाँ
  rationale: यहाँ शब्द गैर-यहूदी उपासना की प्रतिमाओं के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: θύειν
  choice: बलि चढ़ाने
  rationale: क्रियार्थक संज्ञा आज्ञा के अंतर्गत अगला कार्य बताती है; ‘बलि चढ़ाने’ हिन्दी धार्मिक-सांस्कृतिक प्रयोग में सहज है।
- source_word: ὕεια
  choice: सूअरों
  rationale: शब्द सूअरों को दर्शाता है; ‘सूअर’ आधुनिक सामान्य हिन्दी में स्पष्ट है और बलि के प्रसंग में भी उपयुक्त है।
- source_word: κτῆνη κοινά
  choice: अशुद्ध पशुओं
  rationale: κτῆνη व्यापक रूप से पशुओं को दर्शाता है। यहूदी शुद्धता-विधान के प्रसंग में κοινά का भाव केवल ‘सामान्य’ नहीं, बल्कि धार्मिक रीति से अपवित्र/अशुद्ध है।
theological_decisions:
- issue: यहूदी शुद्धता के प्रसंग में κοινά का अनुवाद
  choice: अशुद्ध पशुओं
  alternative: सामान्य पशुओं
  rationale: κοινός का मूल अर्थ ‘सामान्य’ हो सकता है, पर हेलेनवादी यहूदी प्रयोग और तोराह-विरोधी कृत्यों के इस प्रसंग में यह धार्मिक अशुद्धता का भाव रखता है। मुख्य पाठ में ‘अशुद्ध’ अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी मूल शब्द की वास्तविक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। पदांश पूर्ववर्ती आज्ञा पर निर्भर है, इसलिए हिन्दी में अर्थ-संपूर्णता हेतु ‘का आदेश दिया’ जोड़ा गया है। ‘पवित्र-स्थल’ में संयुक्त रूप पठनीयता बनाए रखते हुए cultic precinct का भाव देता है।
