  yaml_path: translation/deuterocanon/1_maccabees/001/045.yaml
  text: and to forbid whole burnt offerings and sacrifices and drink offerings from the sanctuary[a], and to profane Sabbaths and feasts[d][c][b],
translation:
  language: hi
  text: और पवित्रस्थान में पूरी तरह जलाई जाने वाली होमबलियाँ[a], बलिदान और पेयबलियाँ[b] चढ़ाने से रोकें[c], और सब्तों तथा पर्वों[d] को अपवित्र करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘होमबलियों’ के लिए प्रयुक्त यूनानी शब्द ऐसी बलियों को विशेष रूप से दर्शाता है जो आग में पूरी तरह जला दी जाती थीं।
    reason: lexical_alternative
  - marker: b
    text: अर्थात अनुष्ठान में उंडेली जाने वाली पेय-भेंटें; इन्हें ‘अर्घ’ या ‘पेय-भेंटें’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक पदबंध ‘पवित्रस्थान से’ है। κωλῦσαι (‘रोकना’) के साथ इसका आशय सम्भवतः इन विधियों को पवित्रस्थान में होने से रोकना है।
    reason: source_ambiguity
  - marker: d
    text: या ‘धार्मिक उत्सवों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλῦσαι
  choice: रोकें
  rationale: आस-पास के राजकीय आदेशों की सूची में यह क्रिया आधिकारिक निषेध बताती है; ‘रोकें’ स्वाभाविक हिन्दी में निषेध और अवरोध दोनों का भाव रखती है।
- source_word: ὁλοκαυτώματα
  choice: पूर्णतः जलाए जाने वाले होमबलियों
  rationale: यह विशिष्ट रूप से अग्नि में पूरी तरह जला दी जाने वाली बलियों को दर्शाता है। ‘होमबलि’ परिचित धार्मिक शब्द है और उसके साथ जोड़ा गया वर्णन यूनानी शब्द की पूर्ण-दहन की विशेषता स्पष्ट करता है।
- source_word: θυσίας
  choice: बलिदानों
  rationale: यह व्यापक बलिदान-संबंधी शब्द है और विशिष्ट होमबलियों तथा अर्घों से अलग श्रेणी को बनाए रखता है।
- source_word: σπονδὴν
  choice: अर्घों
  rationale: यहाँ शब्द अनुष्ठान में उंडेली जाने वाली पेय-भेंट का द्योतक है। सामान्य निषेधों की सूची में हिन्दी बहुवचन स्वाभाविक है।
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: पवित्रस्थान में ... चढ़ाने से रोकें
  rationale: ἐκ का मूल रूप ‘से’ है, पर κωλῦσαι के साथ भाव इन अनुष्ठानों को पवित्रस्थान के क्षेत्र से बाहर रखना है। हिन्दी में ‘पवित्रस्थान में ... चढ़ाने से रोकें’ इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; पदबंध की स्रोतगत बनावट पाद-टिप्पणी में दी गई है।
- source_word: βεβηλῶσαι
  choice: अपवित्र करें
  rationale: क्रिया का अर्थ पवित्र वस्तु या दिन को सामान्य अथवा अशुद्ध मानकर उसका पवित्र स्वरूप भंग करना है; ‘अपवित्र करें’ आधुनिक हिन्दी में स्पष्ट धार्मिक अर्थ रखता है।
- source_word: σάββατα
  choice: सब्तों
  rationale: यूनानी में बहुवचन है और यह सब्त के दिनों अथवा उनके पालन को सामान्य रूप से सूचित करता है; हिन्दी में भी बहुवचन सुरक्षित रखा गया है।
- source_word: ἑορτάς
  choice: पर्वों
  rationale: यह धार्मिक उत्सव-दिनों को दर्शाता है। ‘पर्व’ इस्राएल के पवित्र पंचांग के प्रसंग में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: इस्राएल के मन्दिर-अनुष्ठानों की विशिष्ट शब्दावली
  choice: होमबलि, बलिदान और अर्घ—तीनों अलग श्रेणियाँ बनाए रखी गई हैं।
  alternative: इन सबको सामान्यतः ‘भेंटें’ या ‘उपासना-विधियाँ’ कहना।
  rationale: पद उन ठोस मन्दिर-विधियों की सूची देता है जिन्हें दबाया जाना था। भेदों को बनाए रखना मूल पाठ की धार्मिक-सांस्कृतिक विशिष्टता को सुरक्षित रखता है और कोई बाद की साम्प्रदायिक व्याख्या नहीं जोड़ता।
- issue: ἐκ τοῦ ἁγιάσματος का संबंध
  choice: भावानुसार ‘पवित्रस्थान में ... चढ़ाने से रोकें’, साथ में स्रोतगत ‘पवित्रस्थान से’ की टिप्पणी।
  alternative: मुख्य पाठ में शाब्दिक ‘पवित्रस्थान से ... रोकें’।
  rationale: यूनानी पूर्वसर्ग स्रोत/बहिष्करण का भाव रख सकता है, जबकि प्रसंग में अभिप्राय इन विधियों को पवित्रस्थान में होने से रोकना है। हिन्दी मुख्य पाठ को अस्पष्ट होने से बचाते हुए पाद-टिप्पणी वास्तविक भाषिक तनाव सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद पिछले वाक्य के आदेशों की निरन्तर सूची है, इसलिए आरम्भ में ‘और’ तथा अंत में अल्पविराम रखा गया है। ‘पवित्रस्थान’ को एक संयुक्त पारंपरिक शब्द के रूप में और ‘सब्त’ को स्रोत-सांस्कृतिक संज्ञा के रूप में रखा गया है।
