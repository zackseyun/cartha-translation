    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हर महीने और महीने में,’ अर्थात प्रत्येक महीने बार-बार।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: अपने बल से
  rationale: यह पदबंध कार्य करने के साधन को दर्शाता है। ‘अपने बल से’ यूनानी रचना को निकटता से रखते हुए सत्ता और दबाव, दोनों का भाव व्यक्त करता है; ‘जबरदस्ती’ अधिक व्याख्यात्मक विकल्प है।
- source_word: ἐποίουν οὕτω
  choice: ऐसा करते रहे
  rationale: अपूर्ण भूतकाल ἐποίουν लगातार या बार-बार किए गए कार्य का संकेत देता है; ‘करते रहे’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के साथ
  rationale: यूनानी में सामान्य सम्प्रदान कारक है। सन्दर्भ में व्यवहार शत्रुतापूर्ण है, पर ‘के विरुद्ध’ कहने के बजाय ‘के साथ’ मूल की व्याकरणिक खुलावट बनाए रखता है।
- source_word: τοῖς εὑρισκομένοις
  choice: पाए जानेवाले लोगों के साथ
  rationale: कृदन्त का कर्मवाच्य भाव बनाए रखा गया है, जिससे यह संकेत मिलता है कि अधिकारी उन्हें ढूँढ़कर या निरीक्षण में पाते थे।
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: महीने-दर-महीने
  rationale: μηνὶ की दोहराई हुई वितरणात्मक अभिव्यक्ति निरन्तर मासिक पुनरावृत्ति पर बल देती है; ‘महीने-दर-महीने’ हिन्दी में इसका स्वाभाविक समतुल्य है।
- source_word: ἐν ταῖς πόλεσιν
  choice: नगरों में
  rationale: यह πόλεις का सीधा और गरिमापूर्ण हिन्दी रूप है तथा मूल में निहित स्थानसूचक अर्थ को सुरक्षित रखता है।
