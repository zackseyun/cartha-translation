  text: वे अपने बल[a] से इस्राएल के उन लोगों के साथ ऐसा करते रहे जो नगरों में पाए जाते थे, और यह महीने-दर-महीने[b] करते रहे।
  philosophy: optimal-equivalence
  footnotes:
