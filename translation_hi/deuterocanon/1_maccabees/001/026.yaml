lexical_decisions:
- source_word: ἐστέναξαν
  choice: कराह उठे
  rationale: यह क्रिया दुःख की सुनाई देने वाली शारीरिक अभिव्यक्ति बताती है। ‘कराह उठे’ मूल की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄρχοντες
  choice: शासक
  rationale: यह अधिकार रखने वालों के लिए सामान्य शब्द है; ‘शासक’ वंशानुगत राजपद का अनावश्यक संकेत दिए बिना अर्थ स्पष्ट करता है।
- source_word: πρεσβύτεροι
  choice: पुरनिए
  rationale: यह केवल अधिक आयु वाले पुरुषों के बजाय समुदाय के मान्य वरिष्ठ जनों या अगुओं को सूचित करता है; ‘पुरनिए’ बाइबलीय सामाजिक भूमिका को संक्षेप में बनाए रखता है।
- source_word: παρθένοι
  choice: कुँवारियाँ
  rationale: यूनानी शब्द विशेष रूप से अविवाहित, अक्षत युवतियों को दर्शाता है; ‘कुँवारियाँ’ उस चिह्नित अर्थ को सुरक्षित रखता है।
- source_word: νεανίσκοι
  choice: जवान
  rationale: यह युवा पुरुषों को दर्शाता है। ‘जवान’ आधुनिक हिन्दी में सहज है और साथ आए स्त्रीलिंग ‘कुँवारियाँ’ से अर्थ स्पष्ट रहता है।
- source_word: ἠσθένησαν
  choice: निर्बल हो गए
  rationale: क्रिया दुर्बल होने या शक्तिहीन पड़ने का भाव देती है; ‘निर्बल हो गए’ इस परिणामी परिवर्तन को स्पष्ट रखता है।
- source_word: τὸ κάλλος
  choice: सौन्दर्य
  rationale: संज्ञा सुन्दरता या आकर्षक रूप को दर्शाती है; ‘सौन्दर्य’ सीधा और गरिमापूर्ण समतुल्य है।
- source_word: ἠλλοιώθη
  choice: बदल गया
  rationale: निष्क्रिय क्रिया रूप बदल जाने को बताता है, पर परिवर्तन का ठीक प्रकार नहीं बताता। ‘बदल गया’ इसी अनिश्चितता को बनाए रखता है।
