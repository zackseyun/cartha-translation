  text: और उसने चाँदी और सोना तथा बहुमूल्य पात्र[a] ले लिए; और जो छिपे हुए खज़ाने[b] उसने पाए, उन्हें भी ले लिया।
  philosophy: optimal-equivalence
  footnotes:
