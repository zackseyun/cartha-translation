    text: या ‘वांछनीय पात्र’; यूनानी शब्द का शाब्दिक अर्थ ‘वांछित’ या ‘वांछनीय’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘छिपे हुए खज़ाने के भंडार’; यूनानी पद छिपी हुई बहुमूल्य वस्तुओं या खज़ाने के गुप्त भंडारों—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: ले लिए
  rationale: यह λαμβάνω के सामान्य अर्थ को सीधे व्यक्त करता है। प्रसंग में लूट निहित है, पर यूनानी क्रिया अपने आप में ‘लूटा’ या ‘छीन लिया’ नहीं कहती।
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: चाँदी और सोना
  rationale: दोनों निश्चित और ठोस बहुमूल्य वस्तुओं का उल्लेख करते हैं। हिन्दी में प्रसंग के कारण बिना अतिरिक्त संकेतक के भी उनकी विशिष्टता स्पष्ट रहती है।
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: मनभावने पात्र
  rationale: σκεύη के लिए ‘पात्र’ मन्दिर के सामान के प्रसंग में स्वाभाविक है, और ἐπιθυμητά का मूल भाव ‘चाहने योग्य/मनभावना’ है। ‘बहुमूल्य’ अधिक मुहावरेदार विकल्प है, पर वह मूल्य का अर्थ कुछ अधिक स्पष्ट रूप से जोड़ता है।
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: छिपे हुए खज़ाने
  rationale: यह सरल और स्वाभाविक हिन्दी है तथा ἀποκρύφους का ‘छिपे/गुप्त’ अर्थ बनाए रखती है। θησαυρούς वस्तुओं के खज़ाने या खज़ाने के भंडार—दोनों का संकेत दे सकता है।
- source_word: οὓς εὗρεν
  choice: जो … उसे मिले
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी क्रम में रखते हुए ‘जिन्हें उसने पाया’ का अर्थ व्यक्त करता है।
