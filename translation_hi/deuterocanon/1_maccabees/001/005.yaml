lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इन घटनाओं के बाद
  rationale: यह यूनानी पद के कालक्रम को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔπεσεν
  choice: गिर पड़ा
  rationale: यह क्रिया के ठोस अर्थ और बीमारी के कारण बिस्तर पकड़ लेने के प्रसंग—दोनों को खुला रखता है; केवल ‘लेट गया’ कहना मूल की शारीरिक अभिव्यक्ति को नरम कर देता।
- source_word: ἐπὶ τὴν κοίτην
  choice: अपने बिस्तर पर
  rationale: κοίτη का अर्थ यहाँ ‘बिस्तर’ स्वाभाविक है। ‘अपने’ हिन्दी में प्रसंगानुकूल संबंध व्यक्त करता है, यद्यपि यूनानी में अधिकारसूचक शब्द स्पष्ट रूप से नहीं है।
- source_word: ἔγνω
  choice: जान गया
  rationale: अओरिस्ट क्रिया को हिन्दी में प्राप्त बोध के रूप में स्वाभाविक ढंग से व्यक्त करता है और ‘समझ गया’ की अपेक्षा मूल ‘जानना’ के अधिक निकट है।
- source_word: ἀποθνήσκει
  choice: वह मर रहा है
  rationale: वर्तमान काल मृत्यु की जारी प्रक्रिया को व्यक्त करता है; ‘मरने वाला है’ निकट भविष्य का अधिक व्याख्यात्मक अर्थ जोड़ता।
