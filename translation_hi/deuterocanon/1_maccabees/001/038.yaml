base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: hi
  text: और यरूशलेम के निवासी उनके कारण भाग गए, और वह परदेशियों का निवास-स्थान बन गई। वह अपनी संतानों[a] के लिए पराई हो गई, और उसके बच्चों ने उसे छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी उपज के लिए पराई हो गई।” यूनानी शब्द का अर्थ संतान या उत्पन्न वस्तु/उपज—दोनों हो सकता है; तुरंत बाद आए “उसके बच्चों” के कारण मुख्य पाठ में “संतानों” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: भाग गए
  rationale: यह दबाव और भय के कारण वहाँ से निकल भागने की सीधी भूतकालीन क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ κάτοικοι
  choice: निवासी
  rationale: यह यरूशलेम में रहने वाले लोगों के लिए सहज और गरिमापूर्ण हिन्दी शब्द है।
- source_word: διʼ αὐτούς
  choice: उनके कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण या अवसर बताता है; संदर्भ में उन्हीं उत्पीड़कों के कारण निवासी भागे।
- source_word: κατοικία ἀλλοτρίων
  choice: परदेशियों का निवास-स्थान
  rationale: यह बाहरी लोगों के नगर पर अधिकार और वहाँ बस जाने के ठोस चित्र को सुरक्षित रखता है।
- source_word: ἐγένετο ἀλλοτρία
  choice: पराई हो गई
  rationale: यह ἀλλοτρίων के साथ शब्दार्थ-संबंध बनाए रखता है और व्यक्तिरूप में चित्रित यरूशलेम के अलगाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: अपनी संतानों के लिए
  rationale: γενήματα का अर्थ संतान अथवा उपज हो सकता है। अगले समानांतर वाक्यांश ‘उसके बच्चों’ के कारण मुख्य पाठ में ‘संतानों’ अधिक उपयुक्त है, जबकि दूसरा अर्थ टिप्पणी में सुरक्षित रखा गया है।
- source_word: τὰ τέκνα αὐτῆς
  choice: उसके बच्चों
  rationale: τέκνα लिंग-विशेष तक सीमित नहीं है; ‘बच्चों’ से मातृ-नगर का पारिवारिक रूपक बना रहता है।
- source_word: ἐγκατέλειπον
  choice: छोड़ दिया
  rationale: यह केवल चले जाने के बजाय त्याग देने का भाव स्पष्ट और स्वाभाविक आधुनिक हिन्दी में देता है।
theological_decisions:
- issue: यरूशलेम का स्त्रीलिंग व्यक्तिकरण
  choice: ‘वह’, ‘अपनी’ और ‘उसके’ द्वारा स्त्रीलिंग व्यक्तिकरण बनाए रखा गया।
  alternative: हर वाक्यांश में ‘यरूशलेम’ दोहराना या वर्णन को निर्वैयक्तिक कर देना।
  rationale: यूनानी पाठ नगर को स्त्री और माता के रूप में चित्रित करता है। इसे बनाए रखने से विलाप का भाव तथा ‘उसके बच्चों’ की पारिवारिक छवि सुरक्षित रहती है।
- issue: γενήματα का अर्थ
  choice: मुख्य पाठ में ‘संतानें’।
  alternative: ‘उपज’।
  rationale: दोनों अर्थ शब्दतः संभव हैं; किंतु तुरंत बाद आने वाला ‘उसके बच्चों’ का समानांतर प्रयोग ‘संतानें’ के पक्ष में है। वास्तविक शब्दार्थगत अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक-विलाप शैली रखी गई है। ‘परदेशियों’, ‘पराई’, ‘संतानों’ और ‘बच्चों’ से मूल पाठ की बाहरीपन तथा मातृ-नगर की परस्पर जुड़ी छवियाँ सुरक्षित रहती हैं।
