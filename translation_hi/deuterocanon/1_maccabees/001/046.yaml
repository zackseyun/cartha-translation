  text: and to defile the sanctuary and the holy ones;[a]
translation:
  language: hi
  text: और पवित्रस्थान और पवित्र जनों[a] को अपवित्र करें;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सन्तों” अथवा “पवित्र लोगों।” यूनानी में शाब्दिक अर्थ “पवित्र जनों” है।
    reason: मूल यूनानी के संज्ञा-रूप में प्रयुक्त विशेषण के वैकल्पिक हिन्दी रूप बताने के लिए।
lexical_decisions:
- source_word: μιᾶναι
  choice: अपवित्र करें
  rationale: यह क्रिया किसी व्यक्ति या स्थान को धार्मिक अथवा नैतिक रूप से अशुद्ध करने का भाव रखती है। यहाँ आज्ञाओं की श्रृंखला में विध्यर्थक रूप स्वाभाविक है और मंदिर-संबंधी अर्थ भी सुरक्षित रहता है।
- source_word: ἁγίασμα
  choice: पवित्रस्थान
  rationale: इस प्रसंग में यह यरूशलेम के मंदिर को पवित्र स्थान के रूप में सूचित करता है। ‘पवित्रस्थान’ संक्षिप्त, स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: ἁγίους
  choice: पवित्र जनों
  rationale: यूनानी रूप पुल्लिंग बहुवचन है और विशेषण संज्ञा के रूप में प्रयुक्त हुआ है, इसलिए इसका सबसे स्वाभाविक संकेत व्यक्तियों की ओर है। ‘पवित्र जन’ मूल की अस्पष्टता बनाए रखता है और इसे याजकों जैसे किसी खास समूह तक सीमित नहीं करता।
theological_decisions:
- issue: ἁγίους का अभिप्रेत समूह
  choice: परमेश्वर के लिए अलग किए गए व्यक्ति—‘पवित्र जन’
  alternative: ‘सन्त’, ‘पवित्र लोग’, अथवा कम संभावित अर्थ में ‘पवित्र वस्तुएँ’
  rationale: ἁγίους पुल्लिंग कर्मकारक बहुवचन है; वस्तुओं के लिए अपेक्षित नपुंसकलिंग रूप भिन्न होता। फिर भी यह शब्द किसी विशिष्ट वर्ग की पहचान नहीं करता, इसलिए अनुवाद भी समूह को अधिक निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘अपवित्र करें’ प्रसंग की आज्ञात्मक सूची के साथ स्वाभाविक है; ‘पवित्रस्थान’ और ‘पवित्र जन’ मूल के धार्मिक शब्द-संबंध को भी बनाए रखते हैं।
