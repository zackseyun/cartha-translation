base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: hi
  text: 'और उन्होंने मरना स्वीकार किया, ताकि वे उन खाद्य पदार्थों[a] से अशुद्ध न हों और पवित्र वाचा[b] को अपवित्र न करें; और वे मर गए।


    [a] या, “भोजनों।” यूनानी शब्द सामान्य रूप से खाने की चीज़ों को दर्शाता है; यहाँ आशय उन खाद्य पदार्थों से है जिन्हें खाने से वाचा की व्यवस्था के अनुसार वे अशुद्ध हो जाते।


    [b] या, “एक पवित्र वाचा।” यूनानी में यहाँ निश्चित उपपद नहीं है, पर प्रसंग इस्राएल की जानी-पहचानी वाचा की ओर संकेत करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजनों।” यूनानी शब्द सामान्य रूप से खाने की चीज़ों को दर्शाता है; यहाँ आशय उन खाद्य पदार्थों से है जिन्हें खाने से वाचा की व्यवस्था के अनुसार वे अशुद्ध हो जाते।
    reason: lexical_alternative
  - marker: b
    text: या, “एक पवित्र वाचा।” यूनानी में यहाँ निश्चित उपपद नहीं है, पर प्रसंग इस्राएल की जानी-पहचानी वाचा की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: मरना स्वीकार किया
  rationale: मध्यवाच्य क्रिया और अनन्त रूप मिलकर स्वेच्छा से मृत्यु को अपने ऊपर लेने या स्वीकार करने का भाव देते हैं। यह हिन्दी में स्वाभाविक है और ‘मृत्यु का स्वागत किया’ जैसी भावनात्मक अतिशयोक्ति से बचता है।
- source_word: μιανθῶσιν
  choice: अशुद्ध न हों
  rationale: यह वाचा की व्यवस्था के संदर्भ में खाद्य पदार्थों से होने वाली धार्मिक और नैतिक अशुद्धता को व्यक्त करता है।
- source_word: τοῖς βρώμασιν
  choice: उन खाद्य पदार्थों से
  rationale: बहुवचन शब्द सामान्यतः खाने की वस्तुओं को दर्शाता है। ‘मांस’ कहना अर्थ को अनावश्यक रूप से संकुचित कर देता; संकेत प्रसंग में निषिद्ध खाद्य पदार्थों की ओर है।
- source_word: βεβηλώσωσιν
  choice: अपवित्र न करें
  rationale: पवित्र वाचा के साथ यह क्रिया पवित्र वस्तु को साधारण या अपवित्र ठहराने का विरोधाभास स्पष्ट रखती है।
- source_word: διαθήκην ἁγίαν
  choice: पवित्र वाचा
  rationale: यूनानी पदबंध अनिश्चित उपपद के बिना है, पर संदर्भ इस्राएल की ज्ञात वाचा की ओर संकेत करता है। हिन्दी में ‘पवित्र वाचा’ स्वाभाविक है और निश्चितता को जरूरत से अधिक नहीं थोपता।
- source_word: ἀπέθανον
  choice: वे मर गए
  rationale: यूनानी पाठ केवल उनके मरने की बात कहता है; ‘उन्हें मार डाला गया’ कहना इस पद की स्पष्ट अभिव्यक्ति से आगे जाता।
theological_decisions:
- issue: खाद्य पदार्थों से अशुद्ध होने का स्वरूप
  choice: वाचा की व्यवस्था के अनुसार धार्मिक और नैतिक अशुद्धता
  alternative: केवल सामान्य नैतिक भ्रष्टता
  rationale: मक्काबियों के इस प्रसंग में निषिद्ध भोजन व्यवस्था और वाचा दोनों जुड़े हैं। ‘अशुद्ध’ दोनों आयामों को बनाए रखता है और इसे केवल प्रतीकात्मक अर्थ तक सीमित नहीं करता।
- issue: διαθήκην ἁγίαν की निश्चितता
  choice: प्रसंग में इस्राएल की ज्ञात पवित्र वाचा
  alternative: एक अनिर्दिष्ट पवित्र वाचा
  rationale: यद्यपि यूनानी में निश्चित उपपद नहीं है, ऐतिहासिक और साहित्यिक संदर्भ ज्ञात वाचा की ओर संकेत करता है। हिन्दी मुख्य पाठ स्वाभाविक अस्पष्टता रखता है और पादटिप्पणी वैकल्पिक व्याकरणिक समझ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘मरना स्वीकार किया’ स्वैच्छिक निर्णय को व्यक्त करता है, जबकि ‘और वे मर गए’ यूनानी की संक्षिप्त, गंभीर समाप्ति को बनाए रखता है।
