  text: और बहुत-से इस्राएली अपने ही मन में दृढ़ और अटल हो गए, ताकि वे अपवित्र भोजन न खाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशुद्ध भोजन”; अधिक शाब्दिक रूप में, “सामान्य वस्तुएँ।” इस प्रसंग में यूनानी शब्द उस भोजन को दर्शाता है जिसे यहूदी व्यवस्था के अनुसार धार्मिक रीति से अपवित्र माना जाता था।
    reason: κοινά के शाब्दिक अर्थ और प्रसंगगत धार्मिक अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: इस्राएल में बहुत-से लोग
  rationale: यूनानी की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘लोग’ जोड़ा गया है; इससे कोई नया समूह निर्दिष्ट नहीं होता।
- source_word: ἐκραταιώθησαν
  choice: दृढ़ हुए
  rationale: क्रिया शक्ति पाने या दृढ़ होने का भाव देती है। ‘दृढ़ हुए’ उसके सामर्थ्य और संकल्प, दोनों पहलुओं को संक्षेप में बनाए रखता है।
- source_word: ὠχυρώθησαν
  choice: अटल हो गए
  rationale: मूल क्रिया का शाब्दिक भाव किलेबंद या सुदृढ़ किए जाने का है। यहाँ संकल्प के संदर्भ में ‘अटल हो गए’ स्वाभाविक है और पहली क्रिया के साथ मूल की अलंकारिक पुनरुक्ति को पूरी तरह मिटाता नहीं।
- source_word: ἐν αὐτοῖς
  choice: अपने भीतर
  rationale: यह संक्षिप्त यूनानी वाक्यांश ‘अपने आप में/अपने भीतर’ अथवा ‘उनके बीच’ समझा जा सकता है। निकटतम व्याकरणिक अर्थ को रखते हुए ‘अपने भीतर’ चुना गया है, बिना सामुदायिक एकजुटता को स्पष्ट रूप से जोड़ने के।
- source_word: τοῦ μὴ φαγεῖν
  choice: ताकि वे … न खाएँ
  rationale: μή के साथ संबंधवाचक infinitive यहाँ उद्देश्य या लक्षित परिणाम बताता है; ‘ताकि’ इस संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κοινά
  choice: अपवित्र भोजन
  rationale: κοινά का मूल अर्थ ‘सामान्य वस्तुएँ’ है, पर यहूदी आहार-विधि के इस संदर्भ में यह धार्मिक रीति से अपवित्र ठहराए गए खाद्य पदार्थों की ओर संकेत करता है। ‘भोजन’ प्रसंग से स्पष्ट पूर्ति है।
theological_decisions:
- issue: κοινά का धार्मिक-आहार संबंधी अर्थ
  choice: अपवित्र भोजन
  alternative: अशुद्ध भोजन; सामान्य वस्तुएँ
  rationale: ‘अपवित्र’ धार्मिक स्थिति का संकेत देता है और इसे केवल भौतिक गंदगी नहीं बनाता। फिर भी मूल शब्द ἀκάθαρτα (‘अशुद्ध’) नहीं बल्कि κοινά (‘सामान्य’) है, इसलिए शाब्दिक और प्रचलित विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
- issue: ἐν αὐτοῖς का संदर्भ
  choice: अपने भीतर
  alternative: आपस में; उनके बीच
  rationale: सर्वनाम का निकट व्याकरणिक मूल्य आंतरिक या आत्म-संबंधी दृढ़ता की अनुमति देता है, जबकि प्रसंग सामुदायिक एकजुटता का अर्थ भी संभव बनाता है। मुख्य पाठ में एक अर्थ चुना गया है, पर दूसरे को सिद्धांतगत निष्कर्ष के रूप में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘दृढ़ हुए’ और ‘अटल हो गए’ मूल की दो समानार्थी शक्ति-सूचक क्रियाओं को हिन्दी में अलग-अलग किंतु संबद्ध रूपों में प्रस्तुत करते हैं।
