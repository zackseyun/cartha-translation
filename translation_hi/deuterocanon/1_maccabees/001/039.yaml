translation:
  language: hi
  text: उसका पवित्रस्थान निर्जन प्रदेश जैसा वीरान कर दिया गया; उसके पर्व शोक में बदल गए, उसके सब्त अपमान में, और उसका सम्मान तिरस्कार में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: यहाँ शब्द यरूशलेम के पवित्र मंदिर-स्थल को दर्शाता है, अमूर्त पवित्रता को नहीं। ‘पवित्रस्थान’ आधुनिक हिन्दी में स्पष्ट है और उपासना-संबंधी अर्थ बनाए रखता है।
- source_word: ἠρημώθη
  choice: उजाड़ दिया गया
  rationale: यूनानी कर्मवाच्य विनाश और वीरानी की दशा व्यक्त करता है। यह हिन्दी रूप उसकी क्रियात्मक शक्ति को सहज ढंग से बनाए रखता है।
- source_word: ὡς ἔρημος
  choice: उजाड़ प्रदेश के समान
  rationale: ὡς की स्पष्ट उपमा सुरक्षित रखी गई है। ‘उजाड़ प्रदेश’ ἔρημος के वीरान स्थान वाले व्यापक अर्थ को व्यक्त करता है और केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: αἱ ἑορταὶ
  choice: पर्व
  rationale: मंदिर-केंद्रित प्रसंग में यह इस्राएल के धार्मिक उत्सवों को दर्शाता है। ‘पर्व’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἐστράφησαν εἰς πένθος
  choice: शोक में बदल गए
  rationale: यह रूप εἰς के साथ व्यक्त परिवर्तन को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: τὰ σάββατα
  choice: सब्त
  rationale: बहुवचन यहाँ बार-बार आने वाले सब्त-दिनों और उनके पालन को दर्शाता है; हिन्दी में ‘उसके सब्त’ सामूहिक बहुवचन अर्थ स्वाभाविक रूप से देता है।
- source_word: εἰς ὀνειδισμόν
  choice: अपमान में
  rationale: ὀνειδισμός में निंदा, लज्जा और सार्वजनिक तिरस्कार का भाव है। ‘अपमान’ किसी कर्ता को अनावश्यक रूप से निर्दिष्ट किए बिना इसे स्पष्ट करता है।
- source_word: τιμὴ
  choice: सम्मान
  rationale: यहाँ शब्द यरूशलेम की प्रतिष्ठा और आदर को दर्शाता है। ‘सम्मान’ इसका सीधा और वर्तमान हिन्दी रूप है।
- source_word: εἰς ἐξουδένωσιν
  choice: तिरस्कार में
  rationale: शब्द किसी को तुच्छ या नगण्य समझे जाने की दशा व्यक्त करता है। ‘तिरस्कार’ उस परिणाम को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग सम्बन्धवाचक αὐτῆς का संदर्भ
  choice: पूरे पद में ‘उसका/उसके’ रखा गया है और यरूशलेम/सिय्योन को स्पष्ट नाम से नहीं जोड़ा गया।
  alternative: ‘यरूशलेम का’ अथवा ‘नगर का’ स्पष्ट रूप से लिखा जा सकता था।
  rationale: यूनानी पाठ स्त्रीलिंग सम्बन्धवाचक को बार-बार दोहराता है, पर संज्ञा को फिर से नहीं कहता। हिन्दी में ‘उसका/उसके’ प्रसंगगत संदर्भ और नगर के मानवीकरण से उत्पन्न विलाप-शैली दोनों को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर पद-रचना को अर्धविराम और संक्षिप्त वाक्यांशों द्वारा सुरक्षित रखा गया है; किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
