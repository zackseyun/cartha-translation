  text: और उसने स्त्रियों और बच्चों को बंदी बना लिया, और उन्होंने पशुधन को लूट के रूप में ले लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उन्होंने पशुधन को अपनी संपत्ति बना लिया” या “उन्होंने उसे विरासत में पाया।” यूनानी क्रिया सामान्यतः किसी संपत्ति को पाने का अर्थ देती है, पर यहाँ विजय के प्रसंग में पशुधन को लूट के रूप में अपने अधिकार में लेना अभिप्रेत है।
