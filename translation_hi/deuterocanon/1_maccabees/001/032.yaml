lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: बंदी बना लिया
  rationale: यह क्रिया युद्ध में लोगों को पकड़कर बंदी बनाने का अर्थ देती है। यूनानी एकवचन को सुरक्षित रखते हुए ‘उसने’ रखा गया है।
- source_word: τὰς γυναῖκας
  choice: स्त्रियों
  rationale: यहाँ बच्चों के साथ पीड़ितों की सूची में γυνή का सामान्य अर्थ ‘स्त्रियाँ’ अधिक उपयुक्त है; ‘पत्नियाँ’ अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: τὰ τέκνα
  choice: बच्चों
  rationale: τέκνα स्त्री और पुरुष दोनों संतानों को समेटने वाला सामान्य शब्द है; इसलिए ‘बच्चे’ स्वाभाविक और सटीक है।
- source_word: τὰ κτήνη
  choice: पशुधन
  rationale: κτήνη पाले हुए संपत्ति-रूप पशुओं को दर्शाता है; ‘पशुधन’ आधुनिक हिन्दी में स्पष्ट है और केवल गौवंश तक सीमित नहीं।
- source_word: ἐκληρονόμησαν
  choice: अधिकार कर लिया
  rationale: क्रिया का मूल अर्थ विरासत या संपत्ति के रूप में प्राप्त करना है, पर यहाँ विजय और लूट के प्रसंग में पशुधन को अपने अधिकार में लेने का भाव है। यह चयन मूल की संपत्ति-प्राप्ति की छाया बचाता है।
