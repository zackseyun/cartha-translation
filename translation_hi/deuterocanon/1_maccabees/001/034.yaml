  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: hi
  text: और उन्होंने वहाँ एक पापी जनसमूह, अर्थात् व्यवस्था-विरोधी पुरुषों को, तैनात किया; और उन्होंने उसमें अपनी स्थिति मज़बूत कर ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνος ἁμαρτωλὸν
  choice: एक पापी जाति
  rationale: ἔθνος को उसके सामूहिक और राजनीतिक अर्थ में ‘जाति’ रखा गया है; ἁμαρτωλόν का सीधा नैतिक मूल्यांकन ‘पापी’ के रूप में सुरक्षित है।
- source_word: ἄνδρας παρανόμους
  choice: व्यवस्था-विरोधी पुरुषों को
  rationale: παράνομος का अर्थ केवल सामान्य ‘अपराधी’ नहीं, बल्कि मान्य व्यवस्था—इस प्रसंग में विशेष रूप से यहूदी व्यवस्था—के विरुद्ध चलने वाला है। ‘पुरुषों’ से ἄνδρας का स्पष्ट रूप बना रहता है।
- source_word: ἔθηκαν ἐκεῖ
  choice: वहाँ ... तैनात किया
  rationale: किले में लोगों को रखे जाने के सैनिक संदर्भ में ‘तैनात किया’ स्वाभाविक और सटीक है।
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  choice: उन्होंने उसमें अपनी स्थिति मज़बूत कर ली
  rationale: क्रिया का मूल भाव बलवान या सुदृढ़ होने/करने का है। प्रसंग में दुर्ग के भीतर अपने नियंत्रण को सुदृढ़ करना अभिप्रेत है; ‘अपनी स्थिति’ हिंदी में इस भाव को स्वाभाविक बनाता है, जबकि सर्वनाम ‘उसमें’ की संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: ‘व्यवस्था-विरोधी’ में व्यवस्था का संदर्भ
  choice: ‘व्यवस्था’ को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: ‘मूसा की व्यवस्था का उल्लंघन करने वाले’
  rationale: यूनानी पाठ παράνομος कहता है, पर इस पद में मूसा का नाम स्पष्ट नहीं करता। विस्तृत विकल्प संदर्भ को अधिक स्पष्ट करता, किंतु स्रोत से अधिक विशिष्ट हो जाता।
- issue: ἐνίσχυσαν का कर्ता और वाच्यगत भाव
  choice: ‘उन्होंने ... अपनी स्थिति मज़बूत कर ली’
  alternative: ‘उन्होंने उसे मज़बूत किया’ या ‘वे उसमें बलवान हो गए’
  rationale: यूनानी रूप कर्तृवाच्य है और वस्तु स्पष्ट नहीं है। चुना गया रूप संदर्भानुकूल आत्म-सुदृढ़ीकरण व्यक्त करता है, पर किले को प्रत्यक्ष कर्म बनाकर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘व्यवस्था-विरोधी’ धार्मिक-कानूनी संदर्भ को बनाए रखता है और ‘अपनी स्थिति मज़बूत कर ली’ दुर्ग-संदर्भ में सहज हिंदी देता है।
