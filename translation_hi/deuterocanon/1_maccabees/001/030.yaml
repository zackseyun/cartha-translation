  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘शान्ति की बातें’, ‘भरोसा किया’ और ‘टूट पड़ा’ सामान्य पाठक के लिए सहज हैं; ‘भारी आघात’ मूल के हिंसक मुहावरे को बिना पुरातन शैली अपनाए बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
