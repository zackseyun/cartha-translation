  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: hi
  text: और उसने छल से उनसे शान्ति की बातें कीं[a], और उन्होंने उस पर भरोसा किया। तब वह अचानक नगर पर टूट पड़ा, उसे भारी आघात पहुँचाया[b], और इस्राएल के बहुत-से लोगों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शान्तिपूर्ण बातें कहीं।’ यूनानी में विशेषण सीधे ‘बातों’ का वर्णन करता है; प्रसंग बताता है कि ये शान्ति का भरोसा दिलाने वाली बातें छलपूर्वक कही गई थीं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के अधिक निकट: ‘उसे एक बड़ी मार मारी।’ यूनानी मुहावरा किसी भारी प्रहार या भीषण तबाही का संकेत दे सकता है।'
    reason: idiom_and_lexical_ambiguity
lexical_decisions:
- source_word: ἐλάλησεν αὐτοῖς λόγους εἰρηνικούς
  choice: उसने उनसे शान्ति की बातें कीं
  rationale: यह λόγους के साथ प्रयुक्त क्रिया और εἰρηνικούς विशेषण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। इसका आशय मेल-मिलाप या शान्ति का भरोसा देने वाली बातों से है, जिनकी कपटपूर्णता अगला वाक्यांश स्पष्ट करता है।
- source_word: ἐν δόλῳ
  choice: छल से
  rationale: पूर्वसर्गीय पद बोलने के ढंग या साधन को बताता है। ‘छल से’ संज्ञात्मक भाव बनाए रखते हुए संक्षिप्त और स्वाभाविक है।
- source_word: ἐπίστευσαν αὐτῷ
  choice: उन्होंने उस पर भरोसा किया
  rationale: इस कथात्मक प्रसंग में πιστεύω का आशय उसकी शान्तिपूर्ण बातों को विश्वसनीय मानकर उस पर भरोसा करने से है, न कि धार्मिक विश्वास से।
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν
  choice: वह नगर पर टूट पड़ा
  rationale: यह यूनानी क्रिया की आकस्मिक और हिंसक गति को सजीव, प्रचलित हिन्दी में रखता है; केवल ‘आक्रमण किया’ की अपेक्षा मूल बिम्ब के निकट है।
- source_word: ἐξαίφνα
  choice: अचानक
  rationale: यह आकस्मिकता का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: उसे भारी आघात पहुँचाया
  rationale: क्रिया और समानार्थक संज्ञा से बने यूनानी मुहावरे को सहज हिन्दी में रखते हुए उसकी भीषणता बचाई गई है, बिना πληγή को केवल ‘हत्या’ या ‘संहार’ तक सीमित किए।
- source_word: ἀπώλεσεν
  choice: नष्ट कर दिया
  rationale: मानवीय कर्म-वस्तु के साथ इसका प्रसंगगत अर्थ घातक विनाश है। ‘नष्ट कर दिया’ मूल क्रिया का व्यापक अर्थ बचाता है; ‘मार डाला’ अधिक स्पष्ट किंतु संकरा विकल्प है।
- source_word: λαὸν πολὺν ἐξ Ἰσραήλ
  choice: इस्राएल के बहुत-से लोगों को
  rationale: ἐξ सदस्यता या समूह में से लोगों को सूचित करता है। शब्दशः ‘इस्राएल में से बहुत-से लोगों’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
theological_decisions:
- issue: गैर-धर्मशास्त्रीय कथानक में ἐπίστευσαν का अनुवाद
  choice: उन्होंने उस पर भरोसा किया
  alternative: उन्होंने उसकी बात पर विश्वास किया
  rationale: यहाँ क्रिया कपटपूर्ण आश्वासनों को स्वीकार करने और व्यक्ति पर व्यावहारिक भरोसा रखने का वर्णन करती है। ‘भरोसा किया’ अनावश्यक धर्मशास्त्रीय अर्थ आरोपित किए बिना कथानक की विडम्बना बनाए रखता है।
- issue: ἀπώλεσεν के घातक आशय की अभिव्यक्ति
  choice: नष्ट कर दिया
  alternative: मार डाला
  rationale: प्रसंग में लोगों का मारा जाना निहित है, पर मूल क्रिया का अर्थ ‘नष्ट करना’ भी है। चुना हुआ रूप इस शब्दार्थ-विस्तार को बनाए रखता है और हिंसा को हल्का भी नहीं करता।
