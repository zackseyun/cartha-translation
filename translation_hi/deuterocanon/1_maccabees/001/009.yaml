base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: hi
  text: उसकी मृत्यु के बाद उन सबने राजमुकुट धारण किए[a], और उनके बाद उनके पुत्रों ने भी बहुत वर्षों तक राजमुकुट धारण किए; और उन्होंने देश में बुराइयाँ बढ़ा दीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकीय शिरोबंध।” यूनानी शब्द विशेष रूप से राजा के पहने हुए राजचिह्न को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “उन्होंने दुष्टता बढ़ाई” या “उन्होंने देश में विपत्तियाँ बढ़ा दीं” भी हो सकता है। यूनानी शब्द में नैतिक बुराई और उसके हानिकारक परिणाम, दोनों शामिल हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: धारण कर लिए
  rationale: मध्यवाच्य रूप और राजचिह्न के प्रसंग में यह अभिव्यक्ति स्वयं राजसत्ता का चिह्न पहन लेने का स्वाभाविक अर्थ देती है।
- source_word: διαδήματα
  choice: राजमुकुट
  rationale: यह यूनानी शब्द विशेष रूप से राजकीय प्रभुता के सिर पर पहने जाने वाले चिह्न को दर्शाता है; ‘राजमुकुट’ आधुनिक पाठक के लिए स्पष्ट और सुबोध है।
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: उसकी मृत्यु के बाद
  rationale: μετά के साथ संज्ञीकृत infinitive सिकंदर की मृत्यु के बाद का समय व्यक्त करता है।
- source_word: ὀπίσω αὐτῶν
  choice: उनके बाद
  rationale: इस राजवंशीय प्रसंग में इसका अर्थ स्थान की दृष्टि से पीछे नहीं, बल्कि उत्तराधिकार में उनके बाद है।
- source_word: ἔτη πολλά
  choice: बहुत वर्षों तक
  rationale: यह समयावधि का कर्मकारक है और दीर्घ अवधि को सीधे व्यक्त करता है।
- source_word: ἐπλήθυναν
  choice: बढ़ा दीं
  rationale: 'क्रिया का सक्रिय कारक भाव सुरक्षित रहता है: उन्होंने बुराइयों को अधिक किया।'
- source_word: κακὰ
  choice: बुराइयाँ
  rationale: बहुवचन κακά नैतिक दुष्टता और उससे उपजी विपत्तियों, दोनों को समेट सकता है; ‘बुराइयाँ’ इस व्यापकता को बनाए रखता है।
- source_word: ἐν τῇ γῇ
  choice: देश में
  rationale: ऐतिहासिक-राजनीतिक प्रसंग में γῆ का संकेत समूची पृथ्वी के बजाय संबंधित देश या भूभाग की ओर है।
theological_decisions:
- issue: κακὰ का अर्थ-क्षेत्र
  choice: व्यापक अर्थ में ‘बुराइयाँ’
  alternative: ‘दुष्टता’ या ‘विपत्तियाँ’
  rationale: मूल शब्द नैतिक बुराई और हानिकारक परिणाम दोनों को व्यक्त कर सकता है। व्यापक अनुवाद इस जानबूझकर अनिर्धारित अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘ऐसा करते रहे’ मूल में निहित राजमुकुट धारण करने की क्रिया को पुत्रों तक स्वाभाविक रूप से पहुँचाता है; अर्थगत अस्पष्टता केवल κακά में है और उसे मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
