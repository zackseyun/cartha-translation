lexical_decisions:
- source_word: ὥστε
  choice: ताकि
  rationale: यहाँ परिणाम अथवा उद्देश्य का भाव है; संदर्भ में शासकीय आदेश के अभिप्राय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιλαθέσθαι τοῦ νόμου
  choice: व्यवस्था को भूल जाएँ
  rationale: यूनानी क्रिया और संबंधकारक संज्ञा का सीधा अर्थ सुरक्षित है; धार्मिक संदर्भ में νόμος के लिए ‘व्यवस्था’ उपयुक्त है।
- source_word: ἀλλάξαι
  choice: बदल दें
  rationale: क्रिया का सामान्य और स्पष्ट अर्थ है; यह जानबूझकर परिवर्तन करने का भाव बनाए रखता है।
- source_word: πάντα τὰ δικαιώματα
  choice: सभी विधियों को
  rationale: δικαιώματα यहाँ व्यवस्था के निर्धारित नियमों/विधानों को सूचित करता है; ‘विधियों’ से संक्षिप्त और गरिमापूर्ण हिन्दी मिलती है।
theological_decisions:
- issue: νόμος और δικαιώματα के बीच भेद
  choice: ‘व्यवस्था’ और ‘विधियाँ’
  alternative: ‘कानून’ और ‘धार्मिक नियम’
  rationale: चुने हुए शब्द मूल में व्यापक तोराह और उसके निर्धारित विधानों के बीच का भेद बनाए रखते हैं, बिना किसी संप्रदायगत व्याख्या को जोड़ने के।
