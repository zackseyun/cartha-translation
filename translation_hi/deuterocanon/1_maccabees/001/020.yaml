  yaml_path: translation/deuterocanon/1_maccabees/001/020.yaml
  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: hi
  text: मिस्र पर प्रहार करने के बाद, अन्तियोकस एक सौ तैंतालीसवें वर्ष में लौट आया। फिर वह एक विशाल सेना[a] के साथ इस्राएल और यरूशलेम पर चढ़ आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बहुत बड़े दल के साथ।” यूनानी में शाब्दिक रूप से “एक भारी जनसमूह के साथ” है।
    reason: ὄχλος और βαρύς के क्रमशः ‘जनसमूह/दल’ और ‘भारी’ जैसे अधिक शाब्दिक अर्थों को दिखाना, जबकि मुख्य पाठ सैन्य संदर्भ का स्वाभाविक हिन्दी रूप देता है।
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आया
  rationale: यहाँ क्रिया मिस्र के अभियान के बाद अन्तियोखुस की वास्तविक वापसी बताती है; आधुनिक हिन्दी में ‘लौट आया’ स्वाभाविक है।
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: मिस्र पर प्रहार करने के बाद
  rationale: μετὰ τό + infinitive का कालगत अर्थ ‘के बाद’ है। ‘प्रहार करने’ से सैन्य आक्रमण का बल बना रहता है, पर यूनानी से आगे बढ़कर निर्णायक विजय मान नहीं ली जाती।
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: एक सौ तैंतालीसवें वर्ष में
  rationale: यह सेल्यूसिड कालगणना के वर्ष-सूत्र का निकट और स्पष्ट हिन्दी रूप है।
- source_word: ἀνέβη ἐπὶ
  choice: पर चढ़ आया
  rationale: ἀνέβη का मूल दिशात्मक भाव ‘ऊपर चढ़ना’ है और ἐπί के साथ सैन्य विरोध का भाव है; ‘पर चढ़ आया’ हिन्दी में दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: इस्राएल और यरूशलेम
  rationale: मूल पाठ दोनों नामों को अलग-अलग रखता है; अनुवाद किसी अतिरिक्त भौगोलिक व्याख्या को जोड़े बिना दोनों को सुरक्षित रखता है।
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: एक विशाल सेना के साथ
  rationale: ὄχλος का सामान्य अर्थ भीड़ या जनसमूह है, पर यहाँ सैन्य अभियान के संदर्भ में वह बड़ी युद्ध-शक्ति को सूचित करता है। ‘विशाल सेना’ आधुनिक हिन्दी में स्वाभाविक है; βαρεῖ के शाब्दिक बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
