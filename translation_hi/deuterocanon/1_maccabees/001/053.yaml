  text: And they drove Israel into hiding[a], into every refuge they had.
translation:
  language: hi
  text: और उन्होंने इस्राएल को उसके हर शरण-स्थान में छिपा दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने इस्राएल को छिपे हुए स्थानों में, उसके हर शरण-स्थान में, डाल दिया।” यूनानी वाक्य संक्षिप्त है; “उसके” का संबंध इस्राएल से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: उन्होंने…मजबूर कर दिया
  rationale: τίθημι के इस प्रयोग में किसी को एक स्थिति में पहुँचा देने का कारक भाव है। हिंदी में यह प्रयोग उस दबाव को स्वाभाविक ढंग से व्यक्त करता है, बिना क्रिया में अनावश्यक हिंसक तीव्रता जोड़ने के।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल / इस्राएली
  rationale: यूनानी में ‘इस्राएल’ एकवचन रूप में पूरे समुदाय के लिए आया है। पहले खंड में मूल का सामूहिक नाम रखा गया है; दूसरे खंड में हिंदी की स्पष्टता और स्वाभाविक बहुवचन क्रिया के लिए ‘इस्राएली’ कहा गया है।
- source_word: ἐν κρυφίοις
  choice: छिपने
  rationale: बहुवचन विशेषण संज्ञा के बिना प्रयुक्त होकर ‘छिपे हुए स्थानों’ का अर्थ देता है। मुख्य पाठ में ‘छिपने’ से उसके आशय को सहज आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: अपने हर शरण-स्थान में
  rationale: φυγαδευτήριον भागकर बचने या शरण लेने के स्थान को दर्शाता है। ‘शरण-स्थान’ इस अर्थ को स्पष्ट रखता है और केवल सामान्य ‘छिपने की जगह’ तक सीमित नहीं करता।
- source_word: αὐτῶν
  choice: अपने
  rationale: सर्वनाम का स्वाभाविक संबंध सामूहिक इस्राएल/इस्राएलियों से है। हिंदी में कर्ता की ओर लौटते संबंध को ‘अपने’ स्वाभाविक रूप से व्यक्त करता है।
