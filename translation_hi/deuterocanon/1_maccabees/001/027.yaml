  text: Every bridegroom took up lamentation[a]; she who sat in the bridal chamber became one in mourning.
translation:
  language: hi
  text: हर दूल्हे ने विलाप छेड़ दिया[a]; जो विवाह-कक्ष में बैठी थी, वह शोक में पड़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सरल रूप में, “हर दूल्हा विलाप करने लगा; जो विवाह-कक्ष में बैठी थी, वह शोक में थी।” यूनानी में संक्षिप्त काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς νυμφίος
  choice: हर दूल्हे ने
  rationale: एकवचन संज्ञा के साथ πᾶς यहाँ वितरणात्मक अर्थ देता है; ‘हर दूल्हा’ स्वाभाविक हिन्दी में पूरे दायरे को बनाए रखता है।
- source_word: ἀνέλαβε θρῆνον
  choice: विलाप छेड़ दिया
  rationale: क्रिया और संज्ञा का यह मेल विलाप आरम्भ करने या उठा लेने का काव्यात्मक भाव देता है। ‘विलाप छेड़ दिया’ उस सक्रिय बिंब और गंभीर स्वर को स्वाभाविक हिन्दी में रखता है।
- source_word: καθημένη
  choice: जो ... बैठी थी
  rationale: यूनानी स्त्रीलिंग कृदंत स्त्री को सूचित करता है, पर उसे स्पष्ट रूप से ‘दुल्हन’ नहीं कहता। हिन्दी में भी विषय को अनाम रखकर मूल की काव्यात्मक संक्षिप्तता और निहितार्थ सुरक्षित रखा गया है।
- source_word: ἐν παστῷ
  choice: विवाह-कक्ष में
  rationale: παστός विवाह अथवा दुल्हन के कक्ष को दर्शाता है। ‘विवाह-कक्ष’ आधुनिक पाठक के लिए स्पष्ट है और विवाह का प्रसंग बनाए रखता है।
- source_word: ἐγένετο ἐν πένθει
  choice: शोक में पड़ गई
  rationale: ἐγένετο अवस्था-परिवर्तन को व्यक्त करता है; इसलिए केवल ‘शोक में थी’ के बजाय ‘शोक में पड़ गई’ चुना गया है।
