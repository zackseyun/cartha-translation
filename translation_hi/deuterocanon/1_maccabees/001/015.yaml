  text: और उन्होंने अपने लिए अग्रचर्म बना लिया[a], और पवित्र वाचा से हट गए, और अन्यजातियों के साथ जुए में बँध गए, और बुराई करने के लिए अपने आप को बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
