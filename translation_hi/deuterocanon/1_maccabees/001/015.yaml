lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: उन्होंने अपने लिए खलड़ी बना ली
  rationale: 'यूनानी का ठोस और चौंकाने वाला शब्दचित्र अक्षुण्ण रखा गया है: उन्होंने खतने के दिखाई देने वाले चिह्न को छिपाने या उलटने का प्रयास किया। अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।'
- source_word: ἀπέστησαν
  choice: फिर गए
  rationale: यह वाचा से हट जाने और निष्ठा त्यागने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी बाद की तकनीकी धर्मशास्त्रीय शब्दावली को आरोपित किए।
- source_word: διαθήκης ἁγίας
  choice: पवित्र वाचा
  rationale: संदर्भ में यह परमेश्वर और इस्राएल के बीच ज्ञात वाचा को सूचित करता है; हिन्दी में विशेषता प्रसंग से स्पष्ट है।
- source_word: ἐζευγίσθησαν
  choice: अपने को ... के साथ जुए में जोत लिया
  rationale: मूल क्रिया में निहित जुए में जोते जाने के रूपक को सुरक्षित रखते हुए स्वेच्छा से गठबंधन और अनुरूपता अपनाने का भाव व्यक्त किया गया है।
- source_word: τοῖς ἔθνεσιν
  choice: अन्यजातियों
  rationale: यहूदी-यूनानी संदर्भ में यह गैर-इस्राएली लोगों को सूचित करता है। यह प्रचलित और संक्षिप्त हिन्दी है तथा 'विधर्मी' जैसे मूल्यात्मक शब्द से बचती है।
- source_word: ἐπράθησαν
  choice: अपने आप को बेच दिया
  rationale: मध्य/कर्मवाच्य रूप को यहाँ स्वेच्छापूर्ण आत्मसमर्पण या आत्म-दासता के अर्थ में लिया गया है, जो नैतिक उत्तरदायित्व को बनाए रखता है।
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: बुराई करने के लिए
  rationale: यह प्रयोजन अथवा परिणति की सम्भावना वाले यूनानी infinitival पदबंध का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: खतने को उलटने वाले मुहावरे को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ठोस अभिव्यक्ति 'अपने लिए खलड़ी बना ली' रखी गई
  alternative: मुख्य पाठ में अर्थ खोलकर 'अपने खतने का चिह्न मिटा दिया' लिखा जा सकता था
  rationale: मूल का शारीरिक और आघातकारी शब्दचित्र वाचा-त्याग के वर्णन का महत्त्वपूर्ण अंग है। पाठक के लिए उसका आशय पादटिप्पणी में स्पष्ट किया गया है, ताकि मुख्य पाठ मूल की ठोस भाषा को न खोए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सुबोध शैली अपनाई गई है। 'खलड़ी' शारीरिक रूप से स्पष्ट और स्रोत के निकट है; पादटिप्पणी उसके असामान्य मुहावरे को खोलती है। 'जुए में जोत लिया' जानबूझकर रूपकात्मक रखा गया है।
