  text: और राजा ने अपने पूरे राज्य में लिख भेजा कि सभी एक ही प्रजा बन जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिख भेजा
  rationale: γράϕω का सामान्य अर्थ ‘लिखना’ है। यहाँ प्राप्तकर्ता पूरा राज्य है, इसलिए ‘लिख भेजा’ स्वाभाविक हिन्दी में लिखित राजकीय आदेश का भाव देता है, बिना मूल क्रिया को अनावश्यक रूप से ‘आज्ञा जारी की’ बनाने के।
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: अपने सारे राज्य को
  rationale: पाठ में कारक-संरचना कुछ असामान्य है, पर आशय राजा के पूरे राज्य को आदेश का संबोधन करना है। ‘अपने सारे राज्य को’ मूल की व्यापकता और प्राप्तकर्ता—दोनों को सुरक्षित रखता है।
- source_word: εἶναι πάντας
  choice: कि सब लोग ... बन जाएँ
  rationale: अव्ययी क्रिया εἶναι लिखित आदेश की विषय-वस्तु व्यक्त करती है। εἰς के साथ यहाँ ‘बन जाएँ’ एक नई संयुक्त स्थिति में आने का गतिशील भाव स्वाभाविक रूप से प्रकट करता है।
- source_word: εἰς λαὸν ἕνα
  choice: मिलकर एक ही प्रजा
  rationale: λαός किसी जनसमुदाय या राजनीतिक प्रजा को दर्शाता है। राजकीय संदर्भ में ‘प्रजा’ आधुनिक हिन्दी में उपयुक्त है; ‘एक ही’ एकरूपता के आदेश पर बल देता है, और ‘मिलकर’ εἰς के एक समूह में आने के भाव को स्पष्ट करता है।
theological_decisions:
- issue: λαός में राजनीतिक-सामाजिक एकीकरण का आशय
  choice: एक ही प्रजा
  alternative: एक ही जनसमुदाय / एक राष्ट्र
  rationale: यहाँ विषय साम्राज्यगत समानीकरण है, वाचा-सम्बन्धी धार्मिक समुदाय नहीं। ‘प्रजा’ राजकीय संदर्भ को स्पष्ट रखता है और आधुनिक राष्ट्र-राज्य की धारणा अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लिख भेजा’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘एक ही प्रजा बन जाएँ’ राजकीय समानीकरण की दिशा को स्पष्ट करता है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई।
