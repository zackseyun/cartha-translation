  yaml_path: translation/deuterocanon/1_maccabees/001/013.yaml
  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: hi
  text: और लोगों में से कुछ ने इसकी बहुत इच्छा की। वे राजा के पास गए, और उन्हें अन्य जातियों के रीति-विधानों[a] को अपनाने का अधिकार दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ ‘जातियों के रीति-विधान’ है; यहूदी प्रसंग में इससे इस्राएल से बाहर की जातियों की प्रथाएँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: बहुत उत्सुक हुए
  rationale: क्रिया प्रबल इच्छा और तत्परता व्यक्त करती है। यूनानी में इसका कर्म निहित है; इसलिए पिछले प्रसंग की ओर संकेत करने के लिए ‘इसके लिए’ जोड़ा गया है।
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: लोगों में से कुछ
  rationale: यह यहूदी लोगों के भीतर के एक समूह को दर्शाता है; यूनानी में ‘पुरुष’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: वे राजा के पास गए
  rationale: यह सरल और स्वाभाविक हिन्दी में गति तथा राजा के सम्मुख पहुँचने, दोनों को व्यक्त करता है।
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: उन्हें … अधिकार दिया गया
  rationale: उपलब्ध यूनानी पाठ में क्रिया बहुवचन है—शाब्दिक रूप से ‘उन्होंने उन्हें अधिकार दिया’—जबकि ठीक पहले ‘राजा’ एकवचन है। हिन्दी में कर्मवाच्य इस व्याकरणिक असंगति को किसी अनिश्चित कर्ता से जोड़कर अर्थ को अनावश्यक रूप से तय किए बिना स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ποιῆσαι
  choice: अपनाने
  rationale: रीति-विधानों के साथ इसका आशय केवल कोई काम करना नहीं, बल्कि उन्हें व्यवहार में स्वीकार कर उनका पालन करना है।
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: अन्य जातियों के रीति-विधानों
  rationale: δικαιώματα यहाँ निर्धारित रीति, नियम या प्रथाओं को सूचित करता है। ‘रीति-विधान’ उसके सामाजिक और धार्मिक-कानूनी दोनों पहलुओं को समेटता है; प्रसंग के कारण ‘अन्य’ स्पष्ट करता है कि ये इस्राएल से बाहर की जातियाँ हैं।
theological_decisions:
- issue: यहूदी प्रसंग में ἐθνῶν का अनुवाद
  choice: अन्य जातियों
  alternative: गैर-यहूदियों
  rationale: ‘अन्य जातियाँ’ यूनानी के बहुवचन और जातीय-राजनीतिक विस्तार के निकट रहता है, जबकि प्रसंग यह स्पष्ट करता है कि आशय इस्राएल से बाहर के लोगों का है। ‘गैर-यहूदी’ अर्थ की व्याख्या करता है, पर मूल की व्यापक अभिव्यक्ति को कुछ संकरा कर देता है।
- issue: ἔδωκαν के बहुवचन कर्ता और एकवचन ‘राजा’ के बीच असंगति
  choice: कर्मवाच्य—‘अधिकार दिया गया’
  alternative: ‘राजा ने उन्हें अधिकार दिया’ अथवा शाब्दिक ‘उन्होंने उन्हें अधिकार दिया’
  rationale: प्रदत्त यूनानी पाठ में क्रिया बहुवचन है, इसलिए राजा को स्पष्ट कर्ता बनाना स्रोत की कठिनाई को चुपचाप सुधार देता। दूसरी ओर, शाब्दिक बहुवचन हिन्दी में निकटतम पूर्ववर्ती समूह को कर्ता बताने का भ्रामक आभास देता। कर्मवाच्य घटना को स्पष्ट रखता है और कर्ता को अनिर्धारित छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘बहुत उत्सुक हुए’ प्रबल झुकाव को सहज रूप में व्यक्त करता है; ‘रीति-विधान’ धार्मिक, सामाजिक और कानूनी प्रथाओं की संयुक्त छाया बनाए रखता है।
