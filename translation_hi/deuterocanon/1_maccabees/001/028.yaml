  text: And the earth shook for those who dwelt on it[a], and the whole house of Jacob clothed itself with shame.
translation:
  language: hi
  text: और पृथ्वी उस पर रहनेवालों के लिए काँप उठी[a], और याकूब के सारे घराने ने लज्जा ओढ़ ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि काँप उठी।” यूनानी शब्द γῆ का अर्थ “पृथ्वी” या “भूमि/देश” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: काँप उठी
  rationale: यह σείω के अओरिस्ट कर्मवाच्य रूप की तीव्र और पूर्ण घटना को स्वाभाविक हिन्दी में व्यक्त करता है; इससे यह तय नहीं किया जाता कि कंपन केवल भौतिक था या काव्यात्मक भी।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। विलापपूर्ण व्यापक भाषा के कारण मुख्य पाठ में ‘पृथ्वी’ रखा गया है और दूसरा अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: उस पर रहनेवालों के लिए
  rationale: ἐπί के साथ कर्मकारक का संबंध यहाँ असामान्य और अर्थ की दृष्टि से कुछ खुला है। ‘के लिए’ यूनानी संबंध को कारणवाचक बनाए बिना बनाए रखता है, यद्यपि हिन्दी में इसकी काव्यात्मक असामान्यता भी बनी रहती है।
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: याकूब का सारा घराना
  rationale: ‘घराना’ सामूहिक वाचा-सम्बन्धी अभिव्यक्ति को सुरक्षित रखता है और इसे व्याख्यात्मक रूप से ‘सारा इस्राएल’ नहीं बनाता। वाक्य में विभक्ति के कारण ‘याकूब के सारे घराने’ रूप प्रयुक्त है।
- source_word: ἐνεδύσατο
  choice: ओढ़ ली
  rationale: मध्यवाच्य क्रिया में स्वयं वस्त्र धारण करने का रूपक है। ‘ओढ़ ली’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस ठोस रूपक को बचाता है।
- source_word: αἰσχύνην
  choice: लज्जा
  rationale: यह αἰσχύνη का सीधा, गरिमापूर्ण और व्यापक रूप से समझा जानेवाला हिन्दी समतुल्य है।
theological_decisions:
- issue: γῆ को ‘पृथ्वी’ कहा जाए या ‘भूमि/देश’
  choice: पृथ्वी
  alternative: भूमि या देश
  rationale: निवासियों के उल्लेख और विलाप की व्यापक शैली के कारण ‘पृथ्वी’ मुख्य पाठ में उपयुक्त है, पर यूनानी शब्द का संकरा भौगोलिक अर्थ भी वास्तविक है और पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ἐνεδύσατο αἰσχύνην के वस्त्र-रूपक को बनाए रखना
  choice: लज्जा ओढ़ ली
  alternative: लज्जित हो गया या लज्जा से भर गया
  rationale: यूनानी में वस्त्र पहनने का रूपक स्पष्ट है। उसे बनाए रखने से पद की काव्यात्मक शक्ति और धर्मग्रन्थीय शैली सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘लज्जा ओढ़ ली’ सामान्य हिन्दी में बोधगम्य है और मूल के वस्त्र-रूपक को सुरक्षित रखता है।
