  text: And many from the people gathered to them, everyone who was abandoning the law; and they did evil in the land,
translation:
  language: hi
  text: और लोगों में से बहुत-से उनके साथ आ मिले—वे सभी जो व्यवस्था को छोड़ते जा रहे थे; और उन्होंने देश में बुरे काम किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: उनके साथ आ मिले
  rationale: यह वाक्यांश केवल एक स्थान पर इकट्ठा होने के बजाय उस समूह से जुड़ने का भाव व्यक्त करता है; हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: πᾶς ὁ ἐγκαταλείπων τὸν νόμον
  choice: वे सभी जो व्यवस्था को छोड़ते जा रहे थे
  rationale: वर्तमान कृदन्त ἐγκαταλείπων की जारी प्रक्रिया को सुरक्षित रखते हुए 'व्यवस्था' νόμος के धार्मिक-सामुदायिक अर्थ को बनाए रखती है।
- source_word: ἐποίησαν κακὰ ἐν τῇ γῇ
  choice: उन्होंने देश में बुरे काम किए
  rationale: κακά का व्यापक नैतिक अर्थ 'बुरे काम' से स्वाभाविक रूप में आता है, और γῆ यहाँ बसाए हुए देश/भूमि के अर्थ में 'देश' है।
theological_decisions:
- issue: νόμος का अनुवाद
  choice: व्यवस्था
  alternative: कानून
  rationale: यहाँ νόμος केवल नागरिक कानून नहीं, बल्कि इस्राएल की दैवी व्यवस्था को सूचित करता है; 'व्यवस्था' इस व्यापक धार्मिक अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- issue: ἐγκαταλείπων के पक्ष का संरक्षण
  choice: छोड़ते जा रहे थे
  alternative: छोड़ चुके थे
  rationale: यूनानी वर्तमान कृदन्त जारी या चरितार्थ होती क्रिया दिखाता है; पूर्ण हो चुकी दशा बताना मूल की कालगत बारीकी को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। डैश πᾶς ὁ ἐγκαταλείπων की व्याख्यात्मक/appositional भूमिका स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं।
