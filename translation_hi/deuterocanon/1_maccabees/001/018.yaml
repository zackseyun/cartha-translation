  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: hi
  text: और उसने मिस्र के राजा टॉलेमी के विरुद्ध युद्ध छेड़ दिया। टॉलेमी उसके सामने परास्त हुआ और भाग गया, और बहुत-से घायल लोग गिर पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत-से घायल जन गिर पड़े।” इसका आशय युद्ध में बड़ी संख्या में हताहत हुए लोगों से हो सकता है; यह आवश्यक नहीं कि केवल जीवित बचे घायलों की बात हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  choice: युद्ध छेड़ दिया
  rationale: यह यूनानी मुहावरा युद्ध आरम्भ करने और लड़ने का भाव देता है। ‘युद्ध छेड़ दिया’ आधुनिक हिन्दी में स्वाभाविक है और आक्रामक पहल को स्पष्ट रखता है।
- source_word: πρὸς Πτολεμαῖον τὸν βασιλέα Αἰγύπτου
  choice: मिस्र के राजा टॉलेमी के विरुद्ध
  rationale: πόλεμον के साथ πρὸς शत्रुतापूर्ण दिशा बताता है; इसलिए ‘के विरुद्ध’ उपयुक्त है। नाम को प्रचलित हिन्दी रूप ‘टॉलेमी’ में रखा गया है।
- source_word: ἐνετράπη ... ἀπὸ προσώπου αὐτοῦ
  choice: उसके सामने परास्त होकर
  rationale: युद्ध के प्रसंग में क्रिया का अर्थ पीछे धकेले जाने या परास्त होने का है। ‘उसके सामने’ मूल स्थानिक मुहावरे को बनाए रखता है, जबकि ‘परास्त होकर’ सैन्य आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: यह युद्धभूमि से पलायन को सीधे व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: बहुत-से घायल होकर गिर पड़े
  rationale: ‘गिर पड़े’ मूल युद्ध-चित्र को सुरक्षित रखता है और ‘घायल होकर’ τραυματίαι का भाव देता है, बिना यह अनिवार्य रूप से कहे कि सभी मर गए।
