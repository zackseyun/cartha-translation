  rationale: θυρίς यहाँ घर के द्वार, प्रवेश-द्वार या द्वार-स्थान को सूचित करता है। ‘द्वारों’ स्वाभाविक और पर्याप्त रूप से व्यापक है तथा ‘चौखटों’ जैसी अनावश्यक स्थापत्य-विशिष्टता नहीं जोड़ता।
