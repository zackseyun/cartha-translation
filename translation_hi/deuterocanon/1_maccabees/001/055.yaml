- source_word: πλατείαις
  choice: चौकों
  rationale: πλατεῖα चौड़ी सड़कों अथवा नगर के खुले सार्वजनिक स्थानों को सूचित कर सकता है। इस धार्मिक सार्वजनिक क्रिया के प्रसंग में ‘चौकों’ सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐθυμίων
  choice: धूप जलाते थे
  rationale: θυμιάω का अर्थ धूप जलाना अथवा उसे धार्मिक भेंट के रूप में चढ़ाना हो सकता है। ‘धूप जलाते थे’ क्रिया को सीधे और स्वाभाविक ढंग से व्यक्त करता है, और उसका धार्मिक अर्थ संदर्भ तथा पादटिप्पणी से स्पष्ट रहता है।
- source_word: ἐπὶ ... καὶ ἐν
