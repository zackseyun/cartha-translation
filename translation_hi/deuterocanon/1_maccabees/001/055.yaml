  rationale: यूनानी पाठ द्वारों के साथ ἐπί और सार्वजनिक स्थानों के साथ ἐν का प्रयोग करता है। ‘द्वारों पर और चौकों में’ इस स्थानगत भेद को बनाए रखता है।
