  yaml_path: translation/deuterocanon/1_maccabees/001/059.yaml
  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: hi
  text: और महीने के पच्चीसवें दिन वे उस वेदी पर बलि चढ़ाते थे, जो होमबलि की वेदी के ऊपर थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ दो अलग शब्द आए हैं: βωμός (‘वेदी’) और θυσιαστήριον (‘होमबलि की वेदी’)। इससे संकेत मिलता है कि मन्दिर की मुख्य वेदी के ऊपर एक दूसरी वेदी रखी गई थी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
  choice: पच्चीसवें दिन
  rationale: यह यूनानी मुहावरा महीने की पच्चीसवीं तारीख बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट रूप है।
- source_word: τοῦ μηνός
  choice: महीने के
  rationale: तिथि-सूचक वाक्यांश में संबंधकारक का स्वाभाविक हिन्दी रूप ‘महीने के पच्चीसवें दिन’ है।
- source_word: θυσιάζοντες
  choice: वे ... बलि चढ़ाते थे
  rationale: कृदंत को प्रसंगानुसार पूर्ण क्रिया बनाया गया है और अपूर्ण/चलती हुई क्रिया का भाव ‘चढ़ाते थे’ से रखा गया है।
- source_word: ἐπὶ τὸν βωμόν
  choice: उस वेदी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ वेदी की सतह पर बलि चढ़ाने का संकेत देता है; ‘पर’ इसे सीधे व्यक्त करता है।
- source_word: βωμός
  choice: वेदी
  rationale: यह सामान्यतः वेदी के लिए प्रयुक्त शब्द है। पद में आए दूसरे यूनानी शब्द θυσιαστήριον से अंतर संदर्भगत विशेषण द्वारा बनाए रखा गया है।
- source_word: θυσιαστήριον
  choice: होमबलि की वेदी
  rationale: मन्दिर के प्रसंग में यह स्थापित मुख्य बलि-वेदी को सूचित करता है। ‘होमबलि की वेदी’ βωμός और θυσιαστήριον के बीच के अंतर को हिन्दी में स्पष्ट रखता है।
theological_decisions:
- issue: अपवित्रीकरण के प्रसंग में βωμός और θυσιαστήριον का अंतर
  choice: βωμός के लिए ‘वेदी’ और θυσιαστήριον के लिए ‘होमबलि की वेदी’
  alternative: दोनों के लिए केवल ‘वेदी’; अथवा βωμός के लिए ‘मूर्तिपूजक वेदी’
  rationale: यूनानी पाठ दो अलग आराधना-संबंधी शब्दों का प्रयोग करता है और सम्भवतः मन्दिर की मुख्य वेदी के ऊपर रखी गई दूसरी वेदी का वर्णन करता है। ‘मूर्तिपूजक’ प्रसंग से सम्भव है, पर इस पद में स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बलि चढ़ाते थे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘होमबलि की वेदी’ मन्दिर-संबंधी विशिष्टता और मूल यूनानी का शब्दगत अंतर बनाए रखता है।
