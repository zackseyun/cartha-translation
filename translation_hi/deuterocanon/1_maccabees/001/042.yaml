lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: छोड़ दे
  rationale: यह क्रिया किसी स्थापित आचरण को त्याग देने का भाव रखती है। ‘छोड़ दे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में निर्णायक त्याग को व्यक्त करती है।
- source_word: ἕκαστον
  choice: हर एक
  rationale: यह यूनानी शब्द का व्यक्ति-व्यक्ति पर लागू होने वाला वितरणात्मक बल बनाए रखता है।
- source_word: τὰ νόμιμα αὐτοῦ
  choice: अपने रीति-विधानों
  rationale: νόμιμα परंपरागत रीति के साथ कानूनी-धार्मिक विधियों और आचारों को भी सूचित कर सकता है। ‘रीति-विधान’ इस संयुक्त अर्थ-क्षेत्र को केवल ‘कानून’ या केवल ‘रीति’ से अधिक अच्छी तरह व्यक्त करता है।
- source_word: ἐπεδέξαντο
  choice: मान ली
  rationale: मूल क्रिया का अर्थ ग्रहण या स्वीकार करना है। राजकीय बात के संदर्भ में ‘मान ली’ स्वाभाविक हिन्दी है और स्वीकृति के साथ अनुपालन का प्रसंगगत भाव भी रखती है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी जातियों
  rationale: यहाँ ἔθνη राजा के अधीन विभिन्न जनसमुदायों या जातियों के लिए है। ‘जातियाँ’ ऐतिहासिक-बाइबलीय गद्य में स्पष्ट है और अनावश्यक रूप से ‘अन्यजातियों’ का धार्मिक विरोध नहीं जोड़ता।
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: राजा की बात
  rationale: λόγος का शाब्दिक अर्थ ‘बात/वचन’ है, पर इस राजकीय प्रसंग में वह आदेश या फरमान भी हो सकता है। मुख्य पाठ निकट और सहज रूप रखता है तथा पादटिप्पणी अन्य संभावनाएँ देती है।
