base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: hi
  text: जहाँ कहीं किसी के पास वाचा की एक पुस्तक[a] मिलती, और यदि कोई व्यवस्था का समर्थन करता[b], तो राजा की राजाज्ञा के तहत उसे मृत्युदंड दिया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘वाचा की एक पुस्तक’; इसका अर्थ ‘वाचा का दस्तावेज़’ या ‘व्यवस्था अथवा वाचा की पुस्तक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, कोई व्यक्ति व्यवस्था से सहमत होकर उसका पक्ष लेता या उसके प्रति निष्ठावान रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου εὑρίσκετο παρὰ τινι
  choice: जहाँ कहीं किसी के पास…मिलती
  rationale: यह प्रयोग अलग-अलग स्थानों पर बार-बार होने वाली खोज और किसी व्यक्ति के पास पुस्तक पाए जाने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βιβλίον διαθήκης
  choice: वाचा की कोई पुस्तक
  rationale: ‘वाचा’ διαθήκη का बाइबलीय अर्थ सुरक्षित रखता है; ‘पुस्तक’ मूल पद की व्यापकता बनाए रखती है और उसे अनावश्यक रूप से केवल मूसा की व्यवस्था की संहिता नहीं ठहराती।
- source_word: εἴ τις συνευδόκει τῷ νόμῳ
  choice: यदि कोई व्यवस्था का समर्थन करता
  rationale: συνευδόκει केवल मानसिक सहमति नहीं, बल्कि पक्ष लेने या अनुमोदन करने का भाव भी रखता है। ‘समर्थन करता’ दमन के इस संदर्भ में उस सक्रिय निष्ठा को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: राजा की राजाज्ञा
  rationale: σύγκριμα यहाँ दंड लागू करने वाला औपचारिक शाही निर्णय या आदेश है। ‘राजाज्ञा’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐθάνατου αὐτόν
  choice: उसके अनुसार उसे मृत्युदंड दिया जाता था
  rationale: यह राजकीय आदेश के अधीन मृत्यु दिए जाने का न्यायिक भाव व्यक्त करता है। अपूर्ण भूतकाल के संदर्भ में ‘दिया जाता था’ बार-बार लागू की जाने वाली कार्रवाई को दर्शाता है।
theological_decisions:
- issue: τῷ νόμῳ में ‘व्यवस्था’ का संदर्भ
  choice: प्रसंग में यह यहूदी पैतृक/मूसा की व्यवस्था को सूचित करता है, पर अनुवाद में केवल ‘व्यवस्था’ रखा गया है।
  alternative: ‘मूसा की व्यवस्था’ या ‘यहूदी व्यवस्था’
  rationale: आस-पास का प्रसंग विशिष्ट संदर्भ स्पष्ट करता है; उसे मुख्य पाठ में विस्तार देकर जोड़ना मूल यूनानी से अधिक व्याख्यात्मक होता।
- issue: καὶ εἴ τις का संबंध
  choice: दो वैकल्पिक अपराध-स्थितियों को स्पष्ट करने के लिए ‘या यदि कोई’
  alternative: अधिक शब्दशः ‘और यदि कोई’
  rationale: यहाँ पुस्तक का पाया जाना और व्यवस्था का समर्थन करना दंड के अलग-अलग आधार हैं। हिन्दी में ‘और’ उनके संयुक्त रूप से आवश्यक होने का भ्रम दे सकता है; ‘या’ आशय को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘वाचा’, ‘व्यवस्था’ और ‘राजाज्ञा’ बाइबलीय तथा ऐतिहासिक प्रसंग के अनुरूप हैं; पादटिप्पणियाँ मूल पदों की व्यापकता और संभावित अर्थों को सुरक्षित रखती हैं।
