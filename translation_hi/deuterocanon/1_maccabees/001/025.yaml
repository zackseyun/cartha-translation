  choice: छा गया
  rationale: यह यूनानी कथात्मक सूत्र यहाँ शोक के उत्पन्न होने और व्यापक रूप से फैल जाने को व्यक्त करता है; ‘छा गया’ स्वाभाविक हिन्दी में उसी प्रभाव को दर्शाता है।
