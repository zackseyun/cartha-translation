- source_word: ἐπὶ Ἰσραήλ
  choice: इस्राएल के
  rationale: अगले स्थानवाचक वाक्यांश के साथ स्वाभाविक हिन्दी बनाने के लिए इस्राएल को उन स्थानों से जोड़ा गया है जहाँ शोक छाया। मूल में शोक के इस्राएल पर आने का भाव भी है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: हर स्थान में
  rationale: एकवचन παντὶ τόπῳ का वितरक अर्थ ‘हर स्थान में’ से स्पष्ट होता है। αὐτῶν उन स्थानों को इस्राएल के लोगों से संबद्ध करता है।
