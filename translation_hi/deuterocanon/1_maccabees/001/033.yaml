translation:
  language: hi
  text: और उन्होंने दाऊद के नगर में एक बड़ी और मज़बूत दीवार और मज़बूत मीनारें बनाईं, और वह उनके लिए एक गढ़ बन गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: बनाईं
  rationale: οἰκοδομέω का मूल अर्थ ‘बनाना/निर्माण करना’ है। हिन्दी में दीवार और मीनारों को स्पष्ट निर्मित वस्तुओं के रूप में रखकर यूनानी क्रिया का सीधा अर्थ सुरक्षित रहता है, जबकि नगर के चारों ओर रक्षात्मक निर्माण का आशय स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὴν πόλιν Δαυεὶδ
  choice: दाऊद के नगर
  rationale: यह ऐतिहासिक-स्थलाकृतिक अभिव्यक्ति का स्वाभाविक और पारंपरिक हिन्दी रूप है। ‘के चारों ओर’ दीवार के नगर से संबंध को स्पष्ट करता है।
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: एक बड़ी और मज़बूत दीवार
  rationale: μέγας के लिए ‘बड़ी’ और सैन्य संदर्भ में ὀχυρός के लिए ‘मज़बूत’ सहज आधुनिक हिन्दी है।
- source_word: πύργοις ὀχυροῖς
  choice: मज़बूत मीनारें
  rationale: πύργος के लिए ‘मीनार’ किलेबंदी के संदर्भ में सुबोध है, और ὀχυρός की रक्षात्मक शक्ति ‘मज़बूत’ से बनी रहती है।
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: वह उनके लिए एक गढ़ बन गया
  rationale: ἄκρα एक किलेबंद ऊँचे स्थान, दुर्ग या गढ़ को सूचित कर सकता है। ‘गढ़’ सामान्य पाठक के लिए स्पष्ट है; ऐतिहासिक नाम की संभावना पादटिप्पणी में सुरक्षित है।
