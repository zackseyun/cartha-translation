  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: hi
  text: और उनमें से एक पापी जड़[a] निकली—अन्तियोकस एपिफ़ानेस, राजा अन्तियोकस का पुत्र, जो रोम में बंधक था। वह यूनानियों के राज्य के एक सौ सैंतालीसवें वर्ष[b] में राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक दुष्ट जड़’ अथवा ‘एक पापी अंकुर।’ यूनानी पाठ में पौधे का रूपक अक्षरशः ‘जड़’ है।
    reason: lexical_alternative
  - marker: b
    text: यह तिथि सेल्यूकिड कालगणना के अनुसार है, जिसे यहाँ ‘यूनानियों का राज्य’ कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: उन्हीं में से ... निकली
  rationale: यह पदबंध पहले बताए गए लोगों अथवा वंश से किसी के निकलने या उत्पन्न होने को दर्शाता है। ‘में से ... निकली’ उस संबंध और आगे आने वाले पौधे के रूपक दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ῥίζα ἁμαρτωλός
  choice: एक पापी जड़
  rationale: ῥίζα का मूल अर्थ ‘जड़’ है; इसे बनाए रखने से लेखक का तीखा पौध-संबंधी रूपक सुरक्षित रहता है। ἁμαρτωλός के लिए ‘पापी’ मूल नैतिक विशेषण के निकट है और ‘दुष्ट’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: Ἀντίοχος Ἐπιφανής
  choice: अन्तियोकुस एपिफ़ानेस
  rationale: व्यक्तिनाम और उपाधि का अर्थानुवाद करने के बजाय यूनानी रूपों का देवनागरी लिप्यंतरण किया गया है।
- source_word: ὅμηρα
  choice: बंधक
  rationale: यहाँ शब्द किसी राजनीतिक समझौते की सुरक्षा के रूप में रोके गए व्यक्ति को दर्शाता है; ‘बंधक’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट करता है।
- source_word: ἐβασίλευσεν
  choice: वह राजा बना
  rationale: काल-सूचक वाक्य में यूनानी एओरिस्ट राजगद्दी सँभालने की घटना बताता है, न कि शासन की अवधि; इसलिए ‘राजा बना’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: एक सौ सैंतालीसवें वर्ष में
  rationale: यूनानी क्रमसूचक तिथि-विधान को स्पष्ट और प्रचलित हिन्दी रूप में प्रस्तुत किया गया है।
- source_word: βασιλείας Ἑλλήνων
  choice: यूनानियों के राज्य के
  rationale: यह पद यूनानी शासन से जुड़ी कालगणना का राजनीतिक ढाँचा बनाए रखता है; इसे केवल ‘यूनानी संवत्’ कहने से मूल का ‘राज्य’ लुप्त हो जाता।
theological_decisions:
- issue: ῥίζα ἁμαρτωλός में नैतिक पौध-रूपक
  choice: ‘एक पापी जड़’ कहकर रूपक को बनाए रखना
  alternative: ‘एक दुष्ट व्यक्ति’ या ‘एक पापी अंकुर’
  rationale: लेखक अन्तियोकुस का परिचय आरम्भ से ही नैतिक रूप से आरोपित रूपक द्वारा देता है। ‘जड़’ मूल छवि और उसकी कथात्मक तीव्रता को बचाती है, जबकि ‘व्यक्ति’ रूपक को मिटा देता और ‘अंकुर’ मूल संज्ञा की व्याख्या कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल यूनानी के पौध-रूपक को जानबूझकर अपरिचित लग सकने पर भी सुरक्षित रखा गया है। कालगणना संबंधी टिप्पणी का चिह्न ‘रोम’ के बाद न रखकर संबंधित तिथि-वाक्यांश के बाद रखा गया है।
