  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
translation:
  language: hi
  text: और किसलेव महीने के पंद्रहवें दिन, एक सौ पैंतालीसवें वर्ष में[b], उन्होंने वेदी पर उजाड़ करने वाली घृणित वस्तु[a] बनाई; और यहूदा भर के नगरों में वेदियाँ बनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजाड़ की घृणित वस्तु” अथवा “उजाड़ लाने वाली घृणित वस्तु।” यूनानी वाक्यांश संक्षिप्त है और इसे किसी परिचित उपाधि के रूप में या वर्णनात्मक वाक्यांश के रूप में समझा जा सकता है।
    reason: lexical_alternative
