    reason: cultural_note
lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ
  choice: पंद्रहवें दिन
  rationale: कालवाचक दत्तिव का स्वाभाविक और स्पष्ट हिन्दी रूप; ‘दिन’ को व्यक्त करने से तिथि साफ रहती है।
- source_word: Χασελεὺ
  choice: किसलेव महीने
  rationale: यह यहूदी पंचांग के महीने का लिप्यंतरण है। आधुनिक हिन्दी में प्रचलित ‘किसलेव’ अपनाया गया और स्पष्टता के लिए ‘महीने’ जोड़ा गया।
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: एक सौ पैंतालीसवें वर्ष में
  rationale: यूनानी पाठ की औपचारिक वर्ष-गणना को स्पष्ट आधुनिक हिन्दी में रखा गया है। संदर्भतः यह सेल्यूकिड संवत् है।
- source_word: ᾠκοδόμησαν
  choice: बनाई / बनाईं
  rationale: मूल क्रिया की पुनरावृत्ति को दोनों स्थानों पर ‘बनाना’ से सुरक्षित रखा गया है; हिन्दी में कर्म के लिंग-वचन के अनुसार रूप बदला है।
- source_word: βδέλυγμα ἐρημώσεως
  choice: उजाड़ की घृणित वस्तु
  rationale: यह अपेक्षाकृत औपचारिक और सघन अनुवाद यूनानी संबंधवाचक पद की वास्तविक अस्पष्टता तथा इसके धर्मग्रंथीय प्रतिध्वनि को बनाए रखता है। अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: वेदी पर
  rationale: यहाँ ἐπί स्थान या स्थापना को सूचित करता है; ‘वेदी पर’ स्वाभाविक हिन्दी है और अनावश्यक स्थानिक विस्तार नहीं जोड़ता।
- source_word: πόλεσιν Ἰούδα κύκλῳ
  choice: यहूदा के नगरों में चारों ओर
  rationale: यह रूप नगरों में व्यापक स्थापना के भाव को रखता है और ‘यहूदा के आसपास’ कहकर उन्हें यहूदा से बाहर स्थित बताने की संभावित गलतफहमी से बचता है।
- source_word: βωμούς
  choice: वेदियाँ
  rationale: βωμός का सामान्य अर्थ ‘वेदी’ है। ‘पूजा-स्थल’ या ‘ऊँचे स्थान’ कहना मूल से अधिक व्याख्या जोड़ता।
theological_decisions:
- issue: βδέλυγμα ἐρημώσεως का अनुवाद, जिसमें आगे के बाइबलीय साहित्य से धर्मवैचारिक संबंध है
  choice: उजाड़ की घृणित वस्तु
  alternative: उजाड़ लाने वाली घृणित वस्तु; उजाड़ करने वाली घृणित वस्तु
  rationale: मुख्य पाठ में संबंधवाचक वाक्यांश की संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है। कारणात्मक अर्थ संभव है, पर उसे मुख्य पाठ में अनिवार्य बनाना मूल यूनानी से अधिक निश्चितता जोड़ता; इसलिए वह पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। तिथि-विधान औपचारिक है; मुख्य धर्मवैचारिक पद को जानबूझकर कुछ सघन रखा गया है ताकि मूल की अस्पष्टता न मिटे। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
