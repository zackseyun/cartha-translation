translation:
  language: hi
  text: उन्होंने मिस्र देश के किलेबंद नगरों पर अधिकार कर लिया, और उसने मिस्र देश की लूट ले ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: अधिकार कर लिया
  rationale: यहाँ क्रिया सैन्य बल से नगरों को अपने नियंत्रण में लेने का बोध कराती है। ‘अधिकार कर लिया’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी मध्यम रूप के अधिकार-ग्रहण के भाव को व्यक्त करता है।
- source_word: πόλεις
  choice: नगरों
  rationale: सैन्य-ऐतिहासिक प्रसंग में πόλεις का सामान्य और गरिमापूर्ण हिन्दी समतुल्य ‘नगर’ है।
- source_word: ὀχυράς
  choice: किलेबंद
  rationale: यह विशेषण नगरों की रक्षात्मक सुदृढ़ता बताता है; ‘किलेबंद नगर’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: γῇ Αἰγύπτῳ
  choice: मिस्र देश
  rationale: यह भौगोलिक पदबंध ‘मिस्र देश’ के रूप में संक्षिप्त, स्वाभाविक और स्रोत के निकट रहता है।
- source_word: ἔλαβεν
  choice: उसने ... ले ली
  rationale: एकवचन क्रिया को एकवचन ‘उसने’ से सुरक्षित रखा गया है, ताकि पिछले बहुवचन से मूल पाठ का व्याकरणिक परिवर्तन बना रहे।
- source_word: σκῦλα
  choice: लूट
  rationale: σκῦλα युद्ध में छीनी या प्राप्त की गई वस्तुओं को दर्शाता है। ‘लूट’ आधुनिक पाठक के लिए स्पष्ट है और सैन्य संदर्भ को बनाए रखता है।
theological_decisions:
- issue: पहली क्रिया के बहुवचन से दूसरी क्रिया के एकवचन में परिवर्तन
  choice: ‘उन्होंने ... उसने’ के रूप में व्याकरणिक परिवर्तन सुरक्षित रखा गया
  alternative: दोनों उपवाक्यों को बहुवचन (‘उन्होंने ... उन्होंने’) या एकवचन में समतल करना
  rationale: यूनानी पाठ κατελάβοντο (बहुवचन) से ἔλαβεν (एकवचन) की ओर बदलता है। इसे बनाए रखने से संभवतः सेना द्वारा नगरों पर अधिकार और राजा द्वारा लूट लेने के बीच मूल पाठ का तनाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण ऐतिहासिक-वृत्तांत शैली। ‘उन्होंने’ और ‘उसने’ का क्रम जानबूझकर रखा गया है ताकि स्रोत का वचन-परिवर्तन स्पष्ट रहे।
