  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: hi
  text: और इस्राएल में से बहुतों ने उसकी उपासना-पद्धति को स्वीकार किया[a]; उन्होंने मूर्तियों को बलि चढ़ाई और सब्त को अपवित्र किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी उपासना-पद्धति से प्रसन्न हुए” अथवा “उसकी उपासना-पद्धति से सहमत हुए”।
    reason: ηὐδόκησαν के अर्थ में प्रसन्नता, अनुमोदन और सहमति की संभावनाएँ हैं।
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: इस्राएल में से बहुतों ने
  rationale: ἀπό समूह के भीतर से संबंध या उद्गम व्यक्त करता है। यह रूप यूनानी संरचना के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: ηὐδόκησαν
  choice: स्वीकार किया
  rationale: यहाँ क्रिया प्रसन्न होने, अनुमोदन करने या सहमति देने का भाव रखती है। धर्मत्याग के संदर्भ में ‘स्वीकार किया’ जानबूझकर दी गई सहमति को सहज हिन्दी में व्यक्त करता है, बिना भावनात्मक प्रसन्नता को अनावश्यक रूप से प्रमुख बनाए।
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: उसकी उपासना को
  rationale: λατρεία धार्मिक सेवा या उपासना को दर्शाता है। ‘उसकी उपासना’ राजा द्वारा लागू धार्मिक व्यवस्था से संबद्धता को स्पष्ट और सुलभ ढंग से व्यक्त करती है।
- source_word: ἔθυσαν
  choice: बलि चढ़ाई
  rationale: यह क्रिया बलिदान करने की धार्मिक क्रिया को सीधे व्यक्त करती है; ‘बलि चढ़ाई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῖς εἰδώλοις
  choice: मूर्तियों को
  rationale: इस संदर्भ में εἴδωλον उपासना की मूर्तियों अर्थात् idols को सूचित करता है।
- source_word: ἐβεβήλωσαν
  choice: अपवित्र किया
  rationale: क्रिया किसी पवित्र वस्तु या दिन की पवित्रता भंग करने को व्यक्त करती है; ‘अपवित्र किया’ इसका मानक और सुबोध धार्मिक पद है।
- source_word: τὸ σάββατον
  choice: सब्त
  rationale: यह यहूदी पवित्र विश्राम-दिन का प्रचलित हिन्दी बाइबलीय नाम है।
theological_decisions:
- issue: मूर्तिपूजक राजकीय धर्म के संदर्भ में λατρεία का अनुवाद
  choice: उसकी उपासना
  alternative: उसकी धार्मिक सेवा / उसकी उपासना-पद्धति
  rationale: ‘उपासना’ धार्मिक निष्ठा और आचरण दोनों का पर्याप्त संकेत देती है और आधुनिक ‘पंथ’ जैसे संभावित रूप से भ्रामक या निंदात्मक शब्द से बचती है।
- issue: ηὐδόκησαν में अनुमोदन, प्रसन्नता और सहमति का संबंध
  choice: स्वीकार किया
  alternative: उससे प्रसन्न हुए / उस पर सहमत हुए / उसका अनुमोदन किया
  rationale: मूल क्रिया इन निकटवर्ती अर्थों को वहन कर सकती है। मुख्य पाठ का चयन संदर्भ में इच्छापूर्वक अपनाने का भाव देता है, और पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की तीन समन्वित क्रियाएँ मूल यूनानी क्रम में सुरक्षित हैं; अर्धविराम हिन्दी में प्रवाह और स्पष्टता देता है।
