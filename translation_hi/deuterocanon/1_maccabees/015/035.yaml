lexical_decisions:
- source_word: Ἰόππης
  choice: याफ़ा
  rationale: प्राचीन बंदरगाह नगर के लिए आधुनिक हिन्दी में प्रचलित और पहचाना जाने वाला नाम।
- source_word: Γαζαρηνῶν
  choice: गेज़ारा
  rationale: यहाँ पाठ का रूप नगर गेज़ारा/गेज़र और उसके निवासियों अथवा क्षेत्र की ओर संकेत करता है; प्रसंग में माँगी गई संपत्तियों के समानांतर नगर का नाम रखना स्वाभाविक है।
- source_word: πληγὴν μεγάλην
  choice: बड़ी हानि
  rationale: शाब्दिक अर्थ ‘बड़ा आघात/चोट’ है, पर इस प्रसंग में लोगों और भूमि को पहुँचाई गई व्यापक क्षति अभिप्रेत है।
- source_word: τάλαντα ἑκατόν
  choice: सौ तोड़े
  rationale: τάλαντον प्राचीन भार और मौद्रिक मूल्य की इकाई है; हिन्दी बाइबलीय परंपरा में ‘तोड़ा’ इसका स्थापित रूप है।
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: उसने उसे कोई उत्तर नहीं दिया
  rationale: यूनानी मुहावरे ‘एक शब्द भी उत्तर न देना’ का सहज आधुनिक हिन्दी रूप।
