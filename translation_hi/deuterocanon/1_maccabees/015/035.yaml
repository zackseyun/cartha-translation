translation:
  language: hi
  text: परन्तु याफ़ा और गेज़ारा के विषय में तुम उनकी माँग करते हो। इन नगरों ने हमारी प्रजा और हमारे देश को बड़ी हानि पहुँचा रहे थे। इनके लिए हम सौ तोड़े देंगे। और उसने उसे एक भी शब्द का उत्तर नहीं दिया।
