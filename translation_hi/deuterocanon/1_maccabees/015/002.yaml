lexical_decisions:
- source_word: ἦσαν περιέχουσαι τὸν τρόπον τοῦτον
  choice: उनमें इस प्रकार लिखा था
  rationale: यूनानी वाक्यांश का शाब्दिक भाव ‘वे इस रूप/ढंग को समेटे हुए थीं’ है और उसका कर्ता पिछले संदर्भ की चिट्ठियाँ हैं। हिन्दी में दस्तावेज़ की विषय-वस्तु प्रस्तुत करने का स्वाभाविक और अर्थसंगत ढंग ‘उनमें इस प्रकार लिखा था’ है।
- source_word: ἱερεῖ μεγάλῳ
  choice: महायाजक
  rationale: यह यहूदी धार्मिक पद का मानक हिन्दी नाम है; शाब्दिक ‘बड़ा याजक’ पद का सही भाव नहीं देता।
- source_word: ἐθνάρχῃ
  choice: एथनार्क
  rationale: यह एक विशिष्ट ऐतिहासिक-राजनीतिक उपाधि है। लिप्यंतरण उपाधि की विशिष्टता बनाए रखता है; अर्थ पाठ-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἔθνει Ἰουδαίων
  choice: यहूदियों के राष्ट्र
  rationale: यह चयन यूनानी संबंधकारक रचना और ἔθνος के सामूहिक जनसमुदाय/राष्ट्र वाले भाव को बनाए रखता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रों में χαίρειν परंपरागत अभिवादन-सूत्र है; हिन्दी पत्र-शैली में ‘नमस्कार’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: Ἰουδαίων का जातीय-धार्मिक अथवा भौगोलिक अर्थ
  choice: यहूदियों
  alternative: यहूदिया-वासियों
  rationale: राजकीय पत्र में संबोधन पूरे सामूहिक जनसमुदाय से है, इसलिए ‘यहूदियों’ अधिक उपयुक्त है; फिर भी यूनानी शब्द का भौगोलिक अर्थ संभव है और उसे पाठ-टिप्पणी में सुरक्षित रखा गया है।
- issue: दस्तावेज़-परिचय के यूनानी वाक्यांश की शाब्दिकता
  choice: उनमें इस प्रकार लिखा था
  alternative: और वे इस रूप को समेटे हुए थीं
  rationale: यहाँ कोई धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया। स्वाभाविक हिन्दी अपनाते हुए मूल के दस्तावेज़-संबंधी अर्थ को बनाए रखा गया है और अधिक शाब्दिक रूप पाठ-टिप्पणी में दिया गया है।
