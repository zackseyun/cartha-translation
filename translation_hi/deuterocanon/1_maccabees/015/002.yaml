  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल पत्रात्मक रूप अपनाया गया है। राजकीय उपाधि ‘एथनार्क’ को उसकी ऐतिहासिक विशिष्टता बचाने के लिए लिप्यंतरित किया गया है और टिप्पणी में समझाया गया है।
