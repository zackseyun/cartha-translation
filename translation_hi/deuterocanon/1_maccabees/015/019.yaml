  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: hi
  text: इसलिए हमने राजाओं और देशों[a] को यह लिखना उचित समझा कि वे उनका अहित करने का प्रयत्न न करें, न उनके, उनके नगरों[b] और उनके प्रदेशों के विरुद्ध युद्ध करें, और न उनके विरुद्ध युद्ध करनेवालों के साथ गठबंधन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ और आगे यहूदियों के अधीन भूभागों के लिए एक ही शब्द χώρα का प्रयोग हुआ है; दोनों स्थानों पर “देश”, “भूमि” या “प्रदेश” भी संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: स्वीट के मुद्रित यूनानी पाठ में “नगरों” से पहले एक असंगत ‘A’ है, जो संभवतः संस्करण या प्रतिलिपि की त्रुटि है; प्रसंग में अर्थ स्वाभाविक रूप से “उनके नगरों” है।
    reason: textual_variant
