- source_word: μὴ συμμαχώσιν
  choice: संधि न करें
  rationale: συμμαχέω सैन्य सहयोगी बनने का भाव रखता है; 'के साथ संधि करना' औपचारिक और सहज हिन्दी है।
- source_word: τοῖς πολεμοῦσιν αὐτούς
  choice: उनके विरुद्ध युद्ध करनेवालों के साथ
  rationale: वर्तमान कृदंत के जारी सैन्य विरोध के भाव को बनाए रखता है।
