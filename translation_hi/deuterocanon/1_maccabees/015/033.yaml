  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘शमौन’, ‘पुरखाओं की विरासत’ और ‘अधिकार’ ऐतिहासिक-राजनीतिक प्रसंग के अनुकूल हैं। मूल यूनानी की लुप्त संज्ञा को ‘उस चीज़ ... जो दूसरों की है’ से स्पष्ट किया गया है, पर उसे केवल भूमि या संपत्ति तक सीमित नहीं किया गया।
