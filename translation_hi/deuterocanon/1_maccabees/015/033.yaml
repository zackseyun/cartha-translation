  yaml_path: translation/deuterocanon/1_maccabees/015/033.yaml
  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: hi
  text: शमौन ने उसे उत्तर दिया, “हमने न तो किसी दूसरे की भूमि ली है[a], न दूसरों की किसी चीज़ पर कब्ज़ा किया है; बल्कि केवल अपने पुरखाओं की विरासत ली है, जिस पर एक समय हमारे शत्रुओं ने अन्यायपूर्वक[b] कब्ज़ा कर लिया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परायी भूमि”; यूनानी अभिव्यक्ति का मुख्य आशय ऐसी भूमि है जो किसी और की हो।
    reason: lexical_alternative
  - marker: b
    text: या “बिना उचित न्याय के” अथवा “मनमाने ढंग से”; यूनानी शब्द अन्याय के साथ-साथ उचित निर्णय या जाँच के अभाव पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: किसी दूसरे की भूमि
  rationale: ἀλλότριος का मूल बल ऐसी भूमि पर है जो किसी और की हो। यह हिंदी में ‘विदेशी भूमि’ की अपेक्षा स्वामित्व का आशय अधिक स्पष्ट रखता है।
- source_word: εἴλημμεν
  choice: ली है
  rationale: पूर्णकालिक रूप ऐसे लेने को व्यक्त करता है जिसका परिणाम वर्तमान अधिकार के रूप में बना हुआ है; हिंदी का पूर्ण रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλοτρίων
  choice: उस चीज़ ... जो दूसरों की है
  rationale: मूल यूनानी में संज्ञा लुप्त है और अर्थ भूमि से कुछ व्यापक हो सकता है। इस अभिव्यक्ति से उस व्यापकता और अनिश्चितता को बनाए रखा गया है।
- source_word: κεκρατήκαμεν
  choice: अधिकार किया है
  rationale: κρατέω यहाँ नियंत्रण या कब्ज़ा स्थापित करने का भाव देता है। ‘अधिकार किया है’ राजनीतिक-भौगोलिक प्रसंग में स्वाभाविक है और अनावश्यक हिंसक अर्थ नहीं जोड़ता।
- source_word: κληρονομίας τῶν πατέρων ἡμῶν
  choice: हमारे पुरखाओं की विरासत
  rationale: यह पैतृक रूप से प्राप्त संपत्ति या भूभाग का दावा व्यक्त करता है। ‘पुरखाओं’ से पुरुष पूर्वजों का संदर्भ बना रहता है और आधुनिक हिंदी में वाक्य सहज रहता है।
- source_word: ἀκρίτως
  choice: अन्यायपूर्वक
  rationale: शब्द न्यायोचित निर्णय या उचित जाँच के बिना किए गए कार्य की ओर संकेत कर सकता है। मुख्य पाठ में ‘अन्यायपूर्वक’ स्पष्ट और स्वाभाविक है, जबकि टिप्पणी में वैकल्पिक सूक्ष्मताएँ दी गई हैं।
- source_word: ἐν τινι καιρῷ
  choice: एक समय
  rationale: यह किसी अनिश्चित अतीतकाल को सूचित करता है, अवधि की लंबाई को नहीं; ‘एक समय’ इस अनिश्चितता को बनाए रखता है।
- source_word: κατεκρατήθη
  choice: उस पर अधिकार कर लिया था
  rationale: κατακρατέω का कर्मवाच्य रूप बलपूर्वक नियंत्रण या अधीनता में लिए जाने का भाव देता है। हिंदी में कर्तृवाच्य पुनर्गठन स्वाभाविक है और मूल अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: पैतृक दावे को पाठ से आगे बढ़ाकर वाचा-संबंधी या राष्ट्रवादी व्याख्या बनाने से बचना
  choice: बल्कि यह हमारे पुरखाओं की विरासत है
  alternative: बल्कि यह हमारी वाचा में मिली हुई भूमि है
  rationale: यूनानी पाठ पैतृक विरासत का दावा करता है, पर यहाँ वाचा का स्पष्ट उल्लेख नहीं करता। चुना गया रूप दावे को ज्यों का त्यों रखता है और अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: πατέρων का लिंग-सटीक और स्वाभाविक हिंदी रूप
  choice: पुरखाओं
  alternative: पूर्वजों
  rationale: πατέρων पुरुष पूर्वजों को दर्शाता है। ‘पुरखाओं’ से यह पारिवारिक-पैतृक स्वर बना रहता है और साधारण आधुनिक हिंदी में सहज है।
- issue: पूर्वजों की विरासत को वापस लेने की क्रिया मूल पाठ में निहित होने पर भी स्पष्ट रूप से न जोड़ना
  choice: बल्कि यह हमारे पुरखाओं की विरासत है
  alternative: बल्कि हमने अपने पुरखाओं की विरासत वापस ली है
  rationale: यूनानी में विरोधसूचक वाक्यांश के बाद ‘वापस लिया’ जैसा क्रियापद स्पष्ट रूप से नहीं है। संक्षिप्त नामवाची कथन मूल की संरचना और तनाव को अधिक निकटता से सुरक्षित रखता है।
