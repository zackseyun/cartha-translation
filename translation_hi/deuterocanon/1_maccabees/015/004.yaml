  text: पर मैं देश भर में निकलना चाहता हूँ,[a] ताकि उन लोगों का पीछा करूँ जिन्होंने हमारे देश को उजाड़ दिया है और राज्य में बहुत-से नगरों को वीरान कर दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश में होकर निकलना”; यूनानी वाक्यांश का अर्थ भूभाग में होकर या देश भर में आगे बढ़ना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पीछा करूँ” का अनुवाद “उनके विरुद्ध कार्रवाई करूँ” या “उन्हें दंड दूँ” भी हो सकता है; यूनानी क्रिया में दोषियों के विरुद्ध शत्रुतापूर्वक जाने का भाव हो सकता है।
    reason: lexical_alternative
