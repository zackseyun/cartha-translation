translation:
  language: hi
  text: और राजा ने केंदेबायुस को समुद्र-तटीय प्रदेश का सेनापति नियुक्त किया और उसे पैदल और घुड़सवार सेनाएँ दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: नियुक्त किया
  rationale: प्रशासनिक और सैनिक पद पर किसी को स्थापित करने के अर्थ में यह स्वाभाविक तथा सटीक आधुनिक हिन्दी है।
- source_word: Κενδεβαῖον
  choice: केन्देबयुस
  rationale: यूनानी नाम Κενδεβαῖος का देवनागरी में निकट और पठनीय लिप्यंतरण।
- source_word: ἐπιστράτηγον
  choice: सेनापति
  rationale: यह क्षेत्र पर नियुक्त सैनिक अधिकारी को दर्शाता है; ‘सेनापति’ सैन्य अर्थ बनाए रखता है, जबकि ‘सैनिक राज्यपाल’ पद की प्रकृति को आवश्यकता से अधिक निश्चित कर देता।
- source_word: τῆς παραλίας
  choice: समुद्र-तटीय प्रदेश का
  rationale: παραλία केवल तटरेखा नहीं, तटीय भूभाग अथवा प्रशासनिक क्षेत्र का संकेत दे सकता है; ‘प्रदेश’ क्षेत्राधिकार स्पष्ट करता है।
- source_word: δυνάμεις πεζικὰς
  choice: पैदल सेनाएँ
  rationale: δυνάμεις सैन्य बलों/टुकड़ियों को और πεζικά पैदल सेना को दर्शाता है; बहुवचन रूप स्रोत की व्याकरणिक संख्या को बनाए रखता है।
- source_word: δυνάμεις ἱππικὰς
  choice: घुड़सवार सेनाएँ
  rationale: ἱππικά घुड़सवार सैन्य बलों को दर्शाता है; यह साधारण आधुनिक हिन्दी में स्पष्ट है और πεζικά के साथ समानांतरता रखता है।
- source_word: ἔδωκεν αὐτῷ
  choice: उसे ... दीं
  rationale: स्रोत के साधारण ‘दिया’ को सीधे बनाए रखता है; सैन्य संज्ञाएँ अपने आप स्पष्ट करती हैं कि बल उसके अधिकार में सौंपे गए।
