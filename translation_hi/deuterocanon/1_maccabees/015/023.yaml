  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: hi
  text: और सभी प्रदेशों[a] को, साम्प्सामे[b] को, स्पार्टावासियों को, देलोस को, मिंदोस को, सिक्योन को, कारिया को, सामोस को, पम्फिलिया को, लिसिया को, हालिकार्नास्सुस को, कोस को, सिदे को, अरादोस को, रोदोस को, फासेलिस को, गोर्त्यना को, क्निदोस को, साइप्रस को और कुरेने को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ स्थान-नामों के वैकल्पिक लिप्यंतरण मिलते हैं; जैसे कोस को कॉस और क्निदोस को कनिडोस भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘साम्प्सामे’ नाम की पहचान और उसका सटीक लिप्यंतरण अनिश्चित है; यहाँ यूनानी रूप का निकट अनुसरण किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: सभी प्रदेशों
  rationale: χώρα प्रदेश, भूभाग या देश का बोध करा सकता है। यहाँ पत्र पाने वाले स्थानों की सूची है, इसलिए ‘प्रदेशों’ आधुनिक राष्ट्र-राज्यों का अर्थ थोपे बिना व्यापक भौगोलिक अर्थ देता है।
- source_word: Σαμψάμῃ
  choice: साम्पसामे
  rationale: यह दत्तिव में आया अनिश्चित स्थान-नाम है। हिन्दी रूप यूनानी ध्वनि के निकट रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: Σπαρτιάταις
  choice: स्पार्टावासियों
  rationale: यह स्पार्टा के लोगों के लिए जातिवाचक बहुवचन है, केवल नगर का नाम नहीं; ‘स्पार्टावासियों’ इस भेद को स्पष्ट रखता है।
- source_word: καὶ εἰς …
  choice: और … को
  rationale: स्थान-नामों के साथ बार-बार आया εἰς यहाँ पत्र भेजे जाने के गंतव्य अथवा प्राप्तकर्ता बताता है; हिन्दी में ‘को’ स्वाभाविक है।
- source_word: τὴν Καρίδα
  choice: कारिया
  rationale: यह कारिया प्रदेश का नाम है; हिन्दी भौगोलिक नाम के रूप में इसे बिना किसी अतिरिक्त वर्णन के रखा गया है।
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: पम्फूलिया और लूकिया
  rationale: दोनों भौगोलिक प्रदेशों के नाम हैं। संयोजक की स्रोतगत रचना बनाए रखते हुए दोनों के बाद एक साझा ‘को’ लगाया गया है।
- source_word: Κῶ
  choice: कोस
  rationale: यूनानी Κῶς के निकट देवनागरी लिप्यंतरण ‘कोस’ है; अन्य भाषाओं में Cos/Kos जैसे रूप मिलते हैं।
- source_word: Ἄραδον
  choice: अरादोस
  rationale: यूनानी रूप Ἄραδος के निकट हिन्दी लिप्यंतरण चुना गया है।
- source_word: τὴν Φασηλίδα
  choice: फासेलिस
  rationale: यह नगर-नाम Φασηλίς का विभक्तियुक्त रूप है; हिन्दी में मूल नाम का निकट लिप्यंतरण दिया गया है।
- source_word: Κνίδον
  choice: क्निदोस
  rationale: यह Κνίδος का विभक्तियुक्त रूप है। ‘क्निदोस’ यूनानी नाम को निकटता से दर्शाता है।
- source_word: Κύπρον
  choice: साइप्रस
  rationale: यद्यपि यूनानी रूप Κύπρος है, ‘साइप्रस’ आधुनिक हिन्दी में इस द्वीप का व्यापक रूप से पहचाना जाने वाला नाम है।
- source_word: Κυρήνην
  choice: कुरेने
  rationale: यह प्राचीन नगर Κυρήνη का हिन्दी बाइबलीय परंपरा में सुबोध और स्रोत के निकट रूप है।
