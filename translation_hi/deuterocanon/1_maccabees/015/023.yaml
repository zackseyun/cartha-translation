translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची के प्रशासनिक संदर्भ के अनुकूल रखी गई है। यूनानी पाठ में εἰς की पुनरावृत्ति को अधिकांश नामों के साथ ‘को’ दोहराकर दर्शाया गया है, जबकि जहाँ यूनानी में दो नाम एक ही संरचना में जुड़े हैं वहाँ स्वाभाविक हिन्दी के लिए साझा ‘को’ रखा गया है। प्रचलित हिन्दी नाम उपलब्ध होने पर उसे अपनाया गया है; अन्यथा यूनानी का निकट देवनागरी लिप्यंतरण किया गया है।
