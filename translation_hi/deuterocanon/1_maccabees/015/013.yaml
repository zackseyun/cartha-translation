- source_word: δώδεκα μυριάδες
  choice: एक लाख बीस हज़ार
  rationale: यूनानी पद का शाब्दिक अर्थ ‘बारह दस-हज़ार’ है। आधुनिक हिन्दी में कुल संख्या देना अधिक स्वाभाविक और तुरंत बोधगम्य है; स्रोत की प्राचीन संख्या-पद्धति पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀνδρῶν πολεμιστῶν
  choice: युद्ध करनेवाले पुरुष
  rationale: यह अभिव्यक्ति पुरुष लड़ाकों को सूचित करती है। यह अनुवाद यूनानी में उपस्थित पुरुष-संदर्भ को बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἵππος
  choice: घुड़सवार
  rationale: शाब्दिक अर्थ ‘घोड़ा’ है, पर सैन्य संख्या-विवरण में यह सामूहिक रूप से घुड़सवार सेना को सूचित करता है। ‘घुड़सवार’ हिन्दी में स्वाभाविक और सटीक है।
