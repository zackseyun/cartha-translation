  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: hi
  text: और उसने केद्रोन को किलेबंद किया[a] और वहाँ घुड़सवार सैनिक[b] और सैनिक-दल तैनात किए, ताकि वे निकलकर यहूदिया की सड़कों पर गश्त करें[c], ठीक वैसे ही जैसे राजा ने उसे आदेश दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केद्रोन का निर्माण किया।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “बनाया” या “निर्माण किया” हो सकता है; यहाँ सैनिक प्रसंग के कारण “किलेबंद किया” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “घुड़सवार।”
    reason: lexical_alternative
  - marker: c
    text: “गश्त करें” के लिए प्रयुक्त क्रिया सड़कों पर चलते हुए उन्हें नियंत्रित करने, बाधित करने या उन पर छापे मारने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: किलेबंद किया
  rationale: क्रिया का मूल अर्थ ‘बनाया’ या ‘निर्माण किया’ है, पर सैनिकों की तैनाती वाले इस सैन्य प्रसंग में ‘किलेबंद किया’ निर्माण के सामरिक उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक विकल्प फुटनोट में रखा गया है।
- source_word: τὴν Κεδρὼν
  choice: केद्रोन
  rationale: यह स्थान-नाम है; यूनानी रूप Κεδρών का देवनागरी लिप्यंतरण ‘केद्रोन’ रखा गया है।
- source_word: ἔταξεν
  choice: तैनात कीं
  rationale: सैन्य दलों को किसी स्थान पर नियुक्त करने के अर्थ में यह आधुनिक हिन्दी का स्वाभाविक सैन्य प्रयोग है।
- source_word: ἵππεις
  choice: घुड़सवार सैनिक
  rationale: यह बहुवचन संज्ञा घोड़े पर लड़ने वाले सैनिकों को दर्शाती है। ‘घुड़सवार सैनिक’ सामान्य पाठक के लिए ‘अश्वारोही सेना’ से अधिक स्पष्ट है।
- source_word: δυνάμεις
  choice: सेनाएँ
  rationale: शब्द सैन्य बलों का व्यापक संकेत देता है। ‘सेनाएँ’ उसकी बहुवचनता और सामान्य सैन्य अर्थ को बनाए रखता है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐκπορευόμενοι
  choice: वहाँ से निकलकर
  rationale: कृदन्त गश्त की परिस्थिति या रीति बताता है। प्रसंगगत ‘वहाँ से’ तैनाती के स्थान केद्रोन को स्पष्ट करता है, बिना धावे का अतिरिक्त अर्थ जोड़े।
- source_word: ἐξοδεύωσιν
  choice: गश्त करें
  rationale: सड़कों पर सैन्य आवाजाही और निगरानी के प्रसंग में ‘गश्त करें’ सबसे स्वाभाविक अर्थ देता है, जबकि नियंत्रण, उत्पीड़न या छापे की संभावित छाया को फुटनोट में सुरक्षित रखा गया है।
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: यहूदिया की सड़कों पर
  rationale: ‘यहूदिया की सड़कें’ भौगोलिक संबंध को बनाए रखता है; हिन्दी में ‘सड़कों पर गश्त करना’ स्वाभाविक कारक-प्रयोग है।
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: ठीक वैसे ही जैसे राजा ने उसे आदेश दिया था
  rationale: यह राजकीय और सैन्य अधिकार से दिए गए निर्देश को व्यक्त करता है तथा यूनानी वाक्य के तुलनात्मक बल ‘ठीक वैसे ही’ को बनाए रखता है।
