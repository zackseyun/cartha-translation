base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: hi
  text: चूँकि कुछ विनाशकारी लोगों ने हमारे पूर्वजों के राज्य पर अधिकार कर लिया था[a], और मैं उस राज्य पर अपना दावा करना चाहता हूँ ताकि उसे पहले जैसी स्थिति में बहाल कर सकूँ, इसलिए मैंने बड़ी संख्या में सैनिक भरती किए हैं[b] और युद्धपोत तैयार किए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘कुछ महामारियों ने हमारे पूर्वजों के राज्य पर अधिकार कर लिया’; यूनानी शब्द λοιμοί का प्रयोग यहाँ संभवतः हानिकारक लोगों के लिए अपमानसूचक रूपक के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘बहुत-से सैनिक जुटाए हैं’ भी हो सकता है; यूनानी क्रिया में विदेशी या भाड़े के सैनिक भरती करने का भाव भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: ‘तैयार किए’ का अर्थ यहाँ ‘सुसज्जित किए’ या ‘बनवाए’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: क्योंकि
  rationale: यह आगे किए गए सैन्य उपक्रम का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक कारणवाचक रूप है।
- source_word: τινες λοιμοὶ
  choice: कुछ विनाशकारी लोगों
  rationale: λοιμοί का शाब्दिक अर्थ ‘महामारियाँ/विपत्तियाँ’ है, पर यहाँ व्यक्तियों के लिए अपमानसूचक रूपक है। ‘विनाशकारी लोग’ अर्थ को स्पष्ट रखता है और रूपक की कठोरता भी बनाए रखता है।
- source_word: κατεκράτησαν
  choice: अधिकार कर लिया है
  rationale: राज्य के संबंध में यह क्रिया उस पर प्रभुत्व या नियंत्रण प्राप्त करने को व्यक्त करती है।
- source_word: τῆς βασιλείας τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के राज्य
  rationale: यह वंशगत और पैतृक राज्य का सीधा अर्थ सुरक्षित रखता है।
- source_word: βούλομαι
  choice: मैं ... चाहता हूँ
  rationale: वक्ता की इच्छा और मंशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀντιποιήσασθαι τῆς βασιλείας
  choice: उस राज्य को फिर से अपने अधिकार में लेना
  rationale: मध्यवाच्य क्रिया किसी वस्तु पर अपना दावा जताने या उसे अपने लिए प्राप्त करने का भाव देती है। प्रसंग में पैतृक राज्य पुनः पाने की मंशा है, पर अनिवार्यतः सफल परिणाम नहीं।
- source_word: ὅπως ἀποκαταστήσω αὐτὴν ὡς ἦν τὸ πρότερον
  choice: ताकि उसे पहले जैसी स्थिति में बहाल करूँ
  rationale: उद्देश्य और पूर्व अवस्था की पुनर्स्थापना, दोनों को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: ἐξενολόγησα πλῆθος δυνάμεων
  choice: मैंने बड़ी संख्या में सैनिक भरती किए हैं
  rationale: यह सैन्य बल जुटाने को दर्शाता है; क्रिया में विदेशी अथवा भाड़े के सैनिक भरती करने की संभावित छाया है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: युद्धपोत तैयार किए हैं
  rationale: κατασκευάζω का अर्थ तैयार करना, सुसज्जित करना या बनाना हो सकता है। ‘तैयार किए’ इस अस्पष्टता पर अनावश्यक निर्णय नहीं थोपता।
