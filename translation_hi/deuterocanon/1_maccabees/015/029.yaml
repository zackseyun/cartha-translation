  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: hi
  text: तुमने उनके सीमावर्ती प्रदेशों को उजाड़ दिया है[a], उस देश पर भारी प्रहार किया है[b], और मेरे राज्य में बहुत-से स्थानों पर अधिकार कर लिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके भूभाग को उजाड़ दिया है’; यूनानी पद सीमाओं के साथ-साथ किसी प्रादेशिक क्षेत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस देश को भारी क्षति पहुँचाई है’; ‘प्रहार’ के लिए प्रयुक्त यूनानी शब्द प्रसंग के अनुसार घाव, आघात, विपत्ति या क्षति भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरे राज्य में बहुत-से स्थानों पर प्रभुत्व स्थापित कर लिया है’; यूनानी क्रिया अधिकार या प्रभुत्व चलाने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια αὐτῶν
  choice: उनके सीमावर्ती प्रदेशों
  rationale: ὅρια सीमाओं के साथ-साथ सीमावर्ती भूभाग या प्रादेशिक क्षेत्र को भी सूचित कर सकता है। ‘सीमावर्ती प्रदेशों’ से भौगोलिक अर्थ स्वाभाविक रूप में व्यक्त होता है और αὐτῶν का ‘उनके’ भी सुरक्षित रहता है।
- source_word: ἠρημώσατε
  choice: उजाड़ दिया है
  rationale: क्रिया किसी स्थान को निर्जन या विनष्ट कर देने का प्रबल भाव रखती है। ‘उजाड़ दिया है’ आधुनिक हिन्दी में सहज और पर्याप्त रूप से सशक्त है।
- source_word: πληγὴν μεγάλην
  choice: भारी प्रहार
  rationale: πληγή का अर्थ प्रहार, घाव, विपत्ति या क्षति हो सकता है। सैनिक-राजनीतिक शिकायत के प्रसंग में ‘भारी प्रहार’ मूल रूपक और उसकी तीव्रता को बनाए रखता है, पर बीमारी का अर्थ आरोपित नहीं करता।
- source_word: ἐπὶ τῆς γῆς
  choice: उस देश पर
  rationale: γῆ यहाँ समूची पृथ्वी नहीं, प्रभावित देश या भूभाग को सूचित करता है। हिन्दी में ‘उस देश पर’ प्रहार के साथ स्वाभाविक बैठता है।
- source_word: ἐκυριεύσατε
  choice: अधिकार कर लिया है
  rationale: क्रिया प्रभुत्व या नियंत्रण स्थापित करने का अर्थ देती है। ‘अधिकार कर लिया है’ प्रभावी भू-नियंत्रण व्यक्त करता है, बिना औपचारिक राजसत्ता का अनावश्यक दावा जोड़े।
- source_word: τόπων πολλῶν
  choice: बहुत-से स्थानों
  rationale: τόποι का सामान्य अर्थ स्थान या भू-स्थल है। ‘बहुत-से स्थानों’ सीधा और अनिर्दिष्ट अनुवाद है।
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: मेरे राज्य में
  rationale: βασιλεία यहाँ राजा के अधीन राज्य-क्षेत्र को दर्शाता है; ‘मेरे राज्य में’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
