lexical_decisions:
- source_word: οὐκ ἠβούλετο
  choice: तैयार नहीं हुआ
  rationale: अपूर्णकालीन βούλομαι उसकी इच्छा या तत्परता को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है और केवल क्षणिक इनकार से अधिक उसके रुख को दिखाता है।
- source_word: αὐτὰ δέξασθαι
  choice: उन्हें स्वीकार करने
  rationale: सर्वनाम को संदर्भ के अनुसार अनिर्दिष्ट बहुवचन ही रखा गया है; δέχομαι के लिए ‘स्वीकार करना’ प्रस्तावित या भेजी गई वस्तुओं/बातों को ग्रहण न करने का भाव देता है।
- source_word: ἠθέτησεν
  choice: रद्द कर दीं
  rationale: ἀθετέω यहाँ पहले के समझौते को निष्प्रभावी या अमान्य करने का संकेत देता है; ‘रद्द कर दीं’ राजनीतिक-राजनयिक संदर्भ में स्पष्ट है, जबकि ‘ठुकरा दिया’ अगले वाक्यांश से अपेक्षित संबंध को कम स्पष्ट करता।
- source_word: πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον
  choice: वे सभी बातें जिन पर वह पहले उसके साथ सहमत हुआ था
  rationale: मध्यवाच्य συντίθημι पारस्परिक सहमति या समझौता करने के अर्थ में है। हिन्दी रूप मूल की व्यापकता बनाए रखता है और ‘वाचा’ जैसा धर्मवैधानिक अर्थ नहीं जोड़ता।
- source_word: ἠλλοτριοῦτο αὐτῷ
  choice: उससे अलगाव रखने लगा
  rationale: अपूर्णकाल संबंध में बढ़ती या जारी दूरी का बोध कराता है। ‘अलगाव रखने लगा’ टूटते संबंध को व्यक्त करता है, पर खुली शत्रुता का अर्थ नहीं थोपता।
