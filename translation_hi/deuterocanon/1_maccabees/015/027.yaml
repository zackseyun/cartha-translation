  text: और वह उन्हें स्वीकार करने के लिए तैयार नहीं था, बल्कि उसने उसके साथ पहले की हुई अपनी सभी सहमतियों को अमान्य कर दिया,[a] और वह उससे विमुख होता गया।[b]
