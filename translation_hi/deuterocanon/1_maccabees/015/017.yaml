  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
translation:
  language: hi
  text: यहूदियों के राजदूत[a] हमारे पास आए। वे हमारे मित्र और सहयोगी थे, और आरम्भ से चली आ रही मित्रता और संधि को नवीनीकृत कर रहे थे। उन्हें महायाजक शमौन और यहूदी जनता[b] ने भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रतिनिधि’; यूनानी शब्द आधिकारिक कूटनीतिक प्रतिनिधियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘यहूदी जनता’ का अनुवाद ‘यहूदी राष्ट्र’ या ‘यहूदियों की सभा’ भी हो सकता है; यूनानी शब्द लोगों को एक नागरिक समुदाय के रूप में भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  choice: राजदूत
  rationale: यह यूनानी शब्द आधिकारिक कूटनीतिक प्रतिनिधियों को दर्शाता है; ‘राजदूत’ आधुनिक हिन्दी में इस औपचारिक भूमिका को स्पष्ट रूप से व्यक्त करता है।
- source_word: φίλοι
  choice: मित्र
  rationale: यह मूल शब्द का सीधा अर्थ है और यहाँ राज्यों के बीच मान्य मैत्री का भाव भी बनाए रखता है।
- source_word: σύμμαχοι
  choice: सहयोगी
  rationale: यह राजनीतिक-सैनिक गठबंधन के सहभागी को दर्शाता है; ‘सहयोगी’ स्वाभाविक हिन्दी है और ‘मित्र’ से अलग गठबंधन का भाव देता है।
- source_word: ἀνανεούμενοι
  choice: नया करने आए हैं
  rationale: कृदन्त का अर्थ पहले से स्थापित संबंध को फिर नया करना है; हिन्दी में उद्देश्यसूचक रूप वाक्य को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ἐξ ἀρχῆς
  choice: आरम्भ से चली आ रही
  rationale: यह संबंध की प्रारम्भिक स्थापना की ओर संकेत करता है; ‘चली आ रही’ जोड़ने से हिन्दी में पुराने, निरंतर संबंध का आशय स्पष्ट होता है।
- source_word: φιλίαν
  choice: मित्रता
  rationale: यह औपचारिक मैत्री-संबंध के लिए सीधा और सुबोध हिन्दी पर्याय है।
- source_word: συμμαχίαν
  choice: संधि
  rationale: राजनीतिक संदर्भ में यह गठबंधन अथवा गठबंधन-संधि को दर्शाता है; मित्रता के साथ ‘संधि’ औपचारिक संबंध को साफ़ करता है।
- source_word: ἀπεσταλμένοι
  choice: भेजा है
  rationale: यूनानी पूर्ण कर्मवाच्य कृदन्त का आशय उनके भेजे जाने की वर्तमान प्रासंगिकता है; हिन्दी में स्वतंत्र वाक्य स्वाभाविक है।
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: महायाजक शमौन
  rationale: ἀρχιερεύς का परंपरागत और स्पष्ट हिन्दी रूप ‘महायाजक’ है; Σίμων को हिन्दी बाइबलीय रूप ‘शमौन’ दिया गया है।
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: यहूदी जनता
  rationale: δῆμος यहाँ लोगों को एक सामूहिक नागरिक निकाय के रूप में दर्शा सकता है; ‘जनता’ अर्थ को खुला और सहज रखता है।
