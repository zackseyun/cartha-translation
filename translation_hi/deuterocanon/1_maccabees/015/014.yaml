  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: hi
  text: उसने नगर को चारों ओर से घेर लिया[a], और समुद्र की ओर से जहाज़ों ने पास आकर घेरा कस दिया[b]। वह स्थल की ओर से और समुद्र की ओर से नगर पर लगातार दबाव डालता रहा, और उसने किसी को न बाहर जाने दिया, न भीतर आने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर को घेर लिया।” यूनानी क्रिया में चारों ओर घेरा डालने की छवि है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी क्रिया का अर्थ साथ आ मिलना या दबाव डालते हुए पास आना हो सकता है; प्रसंग में जहाज़ समुद्र की ओर से घेराबंदी कस रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: चारों ओर से घेर लिया
  rationale: यह प्रयोग यूनानी क्रिया में निहित चारों ओर घेरा डालने की ठोस सैन्य छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: συνῆψαν
  choice: पास आकर घेरा कस दिया
  rationale: जहाज़ों और ‘समुद्र की ओर से’ के संदर्भ में क्रिया नौसैनिक बलों के पास आकर नाकाबंदी पूरी करने का भाव देती है; यह अनुवाद युद्ध आरम्भ होने की अनावश्यक स्पष्टता जोड़े बिना उस गति और दबाव को व्यक्त करता है।
- source_word: συνέθλιβεν
  choice: लगातार दबाव डालता रहा
  rationale: अपूर्ण भूतकाल की निरंतरता को ‘लगातार…रहा’ से और क्रिया के प्रबल दबाव को ‘दबाव डालता’ से व्यक्त किया गया है; शाब्दिक ‘कुचलता रहा’ इस घेराबंदी के संदर्भ में हिन्दी में अस्वाभाविक हो सकता है।
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: स्थल और समुद्र—दोनों ओर से
  rationale: दोनों दिशाओं से पड़ रहे दबाव और दोहराए गए यूनानी संबंधसूचक पद के अर्थ को स्पष्ट, संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: οὐκ εἴασεν
  choice: उसने किसी को … नहीं दिया
  rationale: अनुमति न देने का अर्थ आधुनिक हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: न बाहर जाने दिया, न भीतर आने दिया
  rationale: विपरीत दिशाओं वाली दोनों गतियों को समानांतर हिन्दी रचना में रखकर पूर्ण नाकाबंदी का भाव स्पष्ट किया गया है।
