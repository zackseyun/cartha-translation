lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रति
  rationale: यह संज्ञा किसी दस्तावेज़ की नकल या प्रतिलिपि को दर्शाती है; प्रशासनिक संदर्भ में ‘प्रति’ स्वाभाविक और सटीक है।
- source_word: αὐτῶν
  choice: उसकी
  rationale: यूनानी रूप बहुवचन है, पर संदर्भ में पहले उल्लिखित पत्रों या उनकी विषयवस्तु को सामूहिक दस्तावेज़ के रूप में इंगित करता है; हिन्दी में एकवचन ‘उसकी’ अधिक स्वाभाविक है।
- source_word: ἔγραψεν
  choice: लिखी
  rationale: मूल क्रिया का सामान्य अर्थ ‘लिखना’ है। पद स्वयं स्पष्ट रूप से ‘भेजने’ की बात नहीं कहता, इसलिए अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: Σίμωνι
  choice: शमौन
  rationale: यह बाइबिलीय नाम Σίμων का हिन्दी में प्रचलित रूप है। सम्प्रदान कारक को ‘के लिए’ से व्यक्त किया गया है।
- source_word: ἀρχιερεῖ
  choice: महायाजक
  rationale: यह यहूदी धार्मिक और राजनीतिक संदर्भ में ἀρχιερεύς का मानक तथा स्पष्ट हिन्दी अनुवाद है।
