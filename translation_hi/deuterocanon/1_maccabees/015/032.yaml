  yaml_path: translation/deuterocanon/1_maccabees/015/032.yaml
  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: hi
  text: और राजा का मित्र अथेनोबियुस यरूशलेम आया। उसने शमौन का वैभव, सोने-चाँदी की वस्तुओं से सजी मेज़[a] और सेवकों का बड़ा दल देखा। यह देखकर वह चकित रह गया और उसने शमौन को राजा की बातें सुनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द κυλίκιον दुर्लभ है और उसका अर्थ निश्चित नहीं है। इसका आशय विशेष रूप से सोने-चाँदी के महँगे पात्रों से सजी मेज़ या पेय-पात्रों की सेवा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος τοῦ βασιλέως
  choice: राजा का मित्र
  rationale: यूनानी पदवी के शब्दरूप को सुरक्षित रखता है और इसे अनावश्यक रूप से ‘दरबारी’ जैसे किसी निश्चित पद में नहीं बदलता।
- source_word: δόξαν
  choice: वैभव
  rationale: इस कथात्मक प्रसंग में दृश्यमान प्रतिष्ठा और भव्यता अभिप्रेत है; ‘वैभव’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: सोने-चाँदी की वस्तुओं से सजी मेज़
  rationale: दुर्लभ κυλίκιον संभवतः पात्रों अथवा पेय-सेवा से जुड़ी सजावटी मेज़ को सूचित करता है। मुख्य पाठ पठनीय रहता है, जबकि पादटिप्पणी इसकी वास्तविक शब्दगत अनिश्चितता बताती है।
- source_word: παράστασιν ἱκανήν
  choice: सेवकों का बड़ा दल
  rationale: वाक्यांश शमौन के आस-पास उपस्थित पर्याप्त परिचारक-मंडली या राजसी अनुचर-दल की ओर संकेत करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐξίστατο
  choice: चकित रह गया
  rationale: देखे हुए वैभव पर तीव्र आश्चर्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: उसने शमौन को राजा की बातें सुनाईं
  rationale: सर्वनाम का संदर्भ स्पष्ट करने के लिए ‘शमौन’ रखा गया है और राजा के कथन पहुँचाने का अर्थ सुरक्षित है।
