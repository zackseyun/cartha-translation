base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: hi
  text: पर यरूशलेम और पवित्र स्थान[a] स्वतंत्र रहें; और जितने हथियार तुमने तैयार किए हैं, और जिन गढ़ों को तुमने बनाया है और जो तुम्हारे अधिकार में हैं, वे तुम्हारे ही बने रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान’ अथवा ‘पवित्र वस्तुएँ’। यूनानी बहुवचन τὰ ἅγια पवित्र परिसर या पवित्र वस्तुओं—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: इस स्थान-नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: τὰ ἅγια
  choice: पवित्र स्थान
  rationale: नपुंसकलिंग बहुवचन पवित्र परिसर अथवा पवित्र वस्तुओं को सूचित कर सकता है। यरूशलेम की स्वतंत्रता और अधिकारों के इस राजनीतिक संदर्भ में ‘पवित्र स्थान’ सम्भावित मंदिर-परिसर को व्यक्त करता है, पर अर्थ को केवल एक भवन तक सीमित नहीं करता।
- source_word: ἐλεύθερα
  choice: स्वतंत्र रहें
  rationale: राजकीय रियायत के संदर्भ में हस्तक्षेप या दायित्व से मुक्ति का बोध देता है; ‘स्वतंत्र’ मूल अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅπλα
  choice: हथियार
  rationale: सैन्य उपकरणों के लिए स्पष्ट और प्रचलित आधुनिक हिन्दी शब्द।
- source_word: κατεσκεύασας
  choice: तैयार किए हैं
  rationale: क्रिया का अर्थ बनाना या तैयार करना हो सकता है; हथियारों के साथ ‘तैयार किए’ स्वाभाविक है और निर्माण अथवा व्यवस्था—दोनों की सम्भावना खुली रखता है।
- source_word: ὀχυρώματα
  choice: गढ़ों
  rationale: किलेबंद सैन्य स्थानों को सूचित करता है; ‘गढ़’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ᾠκοδόμησας
  choice: बनाया है
  rationale: किलेबंद संरचनाओं के निर्माण के लिए मूल क्रिया का सीधा हिन्दी रूप।
- source_word: ὧν κρατεῖς
  choice: जो तुम्हारे अधिकार में हैं
  rationale: κρατέω यहाँ कब्ज़े या नियंत्रण में रखने का बोध देता है; यह हिन्दी रूप कानूनी-राजनीतिक आशय स्पष्ट करता है।
- source_word: μενέτω σοι
  choice: वे तुम्हारे ही बने रहें
  rationale: यूनानी में बहुवचन विषयों के बाद सामूहिक अर्थ वाली एकवचन आज्ञार्थक क्रिया है। हिन्दी में स्वाभाविक बहुवचन के द्वारा निरंतर स्वामित्व की राजकीय अनुमति व्यक्त की गई है।
