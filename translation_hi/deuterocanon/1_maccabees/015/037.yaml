  rationale: गति की दिशा मुख्य क्रिया ‘भाग गया’ के साथ हिन्दी में बिना अलग परसर्ग के स्वाभाविक रूप से व्यक्त होती है; स्थाननाम का लिप्यंतरण किया गया है।
