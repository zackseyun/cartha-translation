  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
translation:
  language: hi
  text: इसलिए अब उन नगरों को सौंप दो जिन्हें तुमने अपने कब्ज़े में लिया है, और यहूदिया की सीमाओं के बाहर[a] के उन स्थानों के कर भी सौंप दो, जिन पर तुमने अधिकार कर लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “यहूदिया की सीमाओं से।” यूनानी में सीमासूचक पदबंध कुछ संक्षिप्त है; मुख्य पाठ में प्रसंग के अनुसार उसका सम्भावित अर्थ दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदबंध निष्कर्षसूचक संबंध और तत्काल माँग—दोनों व्यक्त करता है; ‘इसलिए अब’ आधुनिक हिन्दी में दोनों बल बनाए रखता है।
- source_word: παράδοτε
  choice: सौंप दो
  rationale: आज्ञार्थक क्रिया अधिकार या कब्ज़े के हस्तांतरण की माँग करती है। ‘सौंप दो’ प्रत्यक्ष और स्वाभाविक है तथा ‘वापस’ जोड़कर ऐसा पुनर्स्थापन स्पष्ट नहीं करता जिसे क्रिया अकेले अनिवार्य नहीं बनाती।
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: उन नगरों को ... जिन्हें तुमने अपने कब्ज़े में लिया है
  rationale: καταλαμβάνω यहाँ नगरों पर अधिकार कर लेने का भाव देता है। ‘अपने कब्ज़े में लिया’ बलपूर्वक अधिग्रहण का संकेत रखता है, पर केवल सैन्य विजय तक अर्थ सीमित नहीं करता।
- source_word: τοὺς φόρους
  choice: कर
  rationale: φόροι कर अथवा अधीनस्थ क्षेत्र से वसूले जाने वाले राजस्व/कर को दर्शाता है। ‘कर’ सामान्य आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τῶν τόπων
  choice: स्थानों
  rationale: τόποι व्यापक शब्द है और औपचारिक प्रशासनिक जिलों को अनिवार्य रूप से सूचित नहीं करता; ‘स्थान’ उसी व्यापकता को बनाए रखता है।
- source_word: ὧν κατεκυριεύσατε
  choice: जिन ... पर तुमने अधिकार कर लिया है
  rationale: κατακυριεύω प्रभुत्व या नियंत्रण प्राप्त करने को दर्शाता है। ‘अधिकार कर लिया’ राजनीतिक नियंत्रण का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: यहूदिया की सीमाओं से बाहर
  rationale: यूनानी पदबंध संक्षिप्त और व्याकरणिक रूप से कुछ अस्पष्ट है। प्रसंग में यहूदिया की उचित सीमा के बाहर के अधिगृहीत स्थान सम्भावित अर्थ हैं; मुख्य पाठ में यह अर्थ दिया गया है और अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: सीमासूचक पदबंध τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας की व्याख्या
  choice: यहूदिया की सीमाओं से बाहर
  alternative: यहूदिया की सीमाओं से
  rationale: यह कोई प्रमुख धर्मसैद्धान्तिक प्रश्न नहीं, पर अर्थ की दृष्टि से महत्त्वपूर्ण व्याख्यात्मक निर्णय है। ἐκ सहित यह संक्षिप्त पदबंध शब्दशः असहज है। प्रसंग यहूदिया की सीमा से परे अधिकार में लिए गए नगरों और उनके करों की ओर संकेत करता है; फिर भी वास्तविक भाषिक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर प्रत्यक्ष, राजकीय और गरिमापूर्ण है। ‘नगर’, ‘कर’, ‘अधिकार’ और ‘सौंप दो’ सामान्य पाठकों के लिए सहज हैं। मुख्य पाठ पठनीय रखा गया है, जबकि यूनानी सीमासूचक पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
