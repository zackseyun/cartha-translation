lexical_decisions:
- source_word: παρεγενήθη
  choice: आया
  rationale: यहाँ क्रिया किसी स्थान पर पहुँचने को व्यक्त करती है; कथा के प्रवाह में ‘आया’ सहज और सटीक है।
- source_word: Κενδεβαῖος
  choice: केंदेबियुस
  rationale: यूनानी नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: Ἰαμνείαν
  choice: यमनिया
  rationale: स्थान-नाम को यूनानी रूप के निकट रखते हुए हिन्दी में प्रचलित बाइबलीय ढंग से लिप्यंतरित किया गया है।
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: भड़काने ... लगा
  rationale: ἤρξατο आरम्भ का बोध कराता है और ἐρεθίζειν यहाँ लोगों को उकसाने अथवा भड़काने का शत्रुतापूर्ण अर्थ रखता है।
- source_word: τὸν λαόν
  choice: लोगों
  rationale: λαός सामूहिक रूप से जनता या लोगों को दर्शाता है; हिन्दी वाक्य में ‘लोगों’ स्वाभाविक है।
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: यहूदिया पर चढ़ाई करने
  rationale: मूल क्रिया का आधारभूत अर्थ भीतर प्रवेश करना है, पर बंदी बनाने और हत्या करने के सैनिक संदर्भ में ‘चढ़ाई करना’ शत्रुतापूर्ण प्रवेश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἰχμαλωτίζειν
  choice: बंदी बनाने
  rationale: यह युद्ध में लोगों को पकड़कर बंदी बनाने का विशिष्ट अर्थ देता है।
- source_word: φονεύειν
  choice: उनकी हत्या करने
  rationale: क्रिया जान लेने को दर्शाती है; हिन्दी में पूर्वोक्त लोगों को ‘उनकी’ से स्पष्ट किया गया है, यद्यपि यूनानी में कर्म दोहराया नहीं गया।
