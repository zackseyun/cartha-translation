- source_word: οἰκοδομῆσαι τὴν Κεδρὼν
  choice: केद्रोन का निर्माण करे
  rationale: οἰκοδομέω निर्माण करने को दर्शाता है, पर स्वयं यह स्पष्ट नहीं करता कि कार्य नया निर्माण था या पुनर्निर्माण; मुख्य पाठ में तटस्थ अभिव्यक्ति रखी गई है।
- source_word: ὀχυρῶσαι τὰς πόλεις
  choice: नगरों को किलेबंद करे
  rationale: क्रिया सैन्य दृष्टि से स्थानों को सुदृढ़ करने का संकेत देती है; ‘किलेबंद करे’ सटीक और स्वाभाविक है।
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: उस प्रजा से युद्ध करे
  rationale: ὅπως के साथ प्रयुक्त विधिलिंग उद्देश्य बताता है; यह अनुवाद नियत सैन्य कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐδίωκε
  choice: पीछा कर रहा था
  rationale: अपूर्ण भूतकालीन रूप जारी कार्रवाई को दर्शाता है, जिसे हिन्दी की अपूर्ण क्रिया स्पष्ट रूप से सुरक्षित रखती है।
- source_word: Τρύφωνα
  choice: त्रूफ़ोन
  rationale: यूनानी व्यक्तिगत नाम Τρύφων का देवनागरी लिप्यंतरण।
