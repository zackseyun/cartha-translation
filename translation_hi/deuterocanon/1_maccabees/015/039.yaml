  yaml_path: translation/deuterocanon/1_maccabees/015/039.yaml
  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: hi
  text: और उसने उसे यह आज्ञा दी कि वह यहूदिया के सामने पड़ाव डाले[a]। उसने उसे यह भी आज्ञा दी कि वह केद्रोन का निर्माण करे[b], नगरों को किलेबंद करे और उन लोगों से युद्ध करे। परन्तु राजा त्रूफ़ोन का पीछा कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहूदिया की ओर मुँह करके।’ यूनानी पदबंध स्थान बताता है—यहूदिया के सामने अथवा उसकी ओर मुख किए हुए।
    reason: lexical_alternative
  - marker: b
    text: इसे ‘केद्रोन को बनाए’ या ‘केद्रोन का पुनर्निर्माण करे’ भी समझा जा सकता है। यूनानी क्रिया अपने आप यह स्पष्ट नहीं करती कि वहाँ नया निर्माण होना था या पहले के स्थान को फिर से बनाना था।
    reason: lexical_alternative
