  yaml_path: translation/deuterocanon/1_maccabees/015/036.yaml
  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: hi
  text: पर वह क्रोध में राजा के पास लौट गया और उसने उसे ये बातें, शमौन का वैभव[a], और जो कुछ उसने देखा था, वह सब बता दिया; तब राजा बहुत क्रोधित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शमौन की महिमा।’ यूनानी शब्द δόξα सम्मान, महिमा या दिखाई देने वाली भव्यता का अर्थ दे सकता है; यहाँ सम्भवतः शमौन के प्रभावशाली वैभव की ओर संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: लौट गया
  rationale: क्रिया यहाँ राजा के पास वापस जाने की गति बताती है; ‘लौट गया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: μετὰ θυμοῦ
  choice: क्रोध में
  rationale: यह पद उसके लौटने की भाव-दशा बताता है; ‘क्रोध में’ यूनानी अभिव्यक्ति का बल सहज हिन्दी में रखता है।
- source_word: ἀπήγγειλεν
  choice: बता दिया
  rationale: यहाँ अर्थ राजा को सुनी और देखी हुई बातों का पूरा समाचार देना है; ‘बता दिया’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγους पिछली बातचीत में कही गई बातों को सूचित करता है; हिन्दी में ‘ये बातें’ प्रसंग को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν δόξαν Σίμωνος
  choice: शमौन का वैभव
  rationale: δόξα यहाँ शमौन के प्रत्यक्ष प्रभाव, प्रतिष्ठा और भव्यता को सूचित कर सकता है; ‘वैभव’ दृश्य भव्यता को व्यक्त करता है, जबकि ‘महिमा’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πάντα ὅσα εἶδεν
  choice: जो कुछ उसने देखा था, वह सब
  rationale: यह व्यापकता और सूचना देने से पहले घटित देखने की क्रिया—दोनों को स्पष्ट करता है।
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: राजा बहुत क्रोधित हुआ
  rationale: यूनानी की सजातीय और बलवती अभिव्यक्ति को शब्दशः अस्वाभाविक बनाए बिना ‘बहुत’ द्वारा उसका जोर सुरक्षित रखा गया है।
