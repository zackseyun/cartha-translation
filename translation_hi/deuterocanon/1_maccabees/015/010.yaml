lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ चौहत्तरवें वर्ष में
  rationale: यूनानी काल-सूचक पदबंध को स्वाभाविक हिन्दी में रखा गया है और उसमें निहित संवत्-प्रणाली की अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: ἐξῆλθεν
  choice: गया
  rationale: क्रिया का मूल भाव किसी स्थान की ओर निकलने या जाने का है। हिन्दी में 'गया' प्रसंगानुकूल और सहज है तथा इसे अनावश्यक रूप से सैनिक कूच नहीं बनाता।
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: अपने पुरखाओं के देश में
  rationale: '''पुरखाओं का देश'' पैतृक अथवा पूर्वजों के देश का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और γῆ का ''देश/भूमि'' भाव बनाए रखता है।'
- source_word: συνῆλθον πρὸς αὐτὸν
  choice: उसके पास इकट्ठी हो गईं
  rationale: इससे अन्तियोखुस की ओर आकर एकत्र होने और उसका साथ देने का भाव रहता है, बिना केवल 'उससे जा मिलीं' जैसा अधिक व्याख्यात्मक अर्थ थोपे।
- source_word: πᾶσαι αἱ δυνάμεις
  choice: सारी सेनाएँ
  rationale: सैनिक आख्यान में δυνάμεις से सैन्य बल अभिप्रेत हैं। 'सेनाएँ' साधारण हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: जिससे त्रूफ़ोन के साथ थोड़े ही लोग रह गए
  rationale: ὥστε का परिणामसूचक भाव 'जिससे' द्वारा व्यक्त किया गया है। 'थोड़े ही लोग रह गए' हिन्दी में परिणाम को सहज बनाता है; प्रसंग में शेष रह जाने का भाव निहित है।
