translation:
  language: hi
  text: एक सौ चौहत्तरवें वर्ष में अन्तियोखुस अपने पुरखाओं के देश में गया, और सारी सेनाएँ उसके पास इकट्ठी हो गईं, इस प्रकार त्रूफ़ोन के साथ थोड़े ही लोग थे।
