translation:
  language: hi
  text: और वे पाँच हज़ार मीना मूल्य की एक सोने की ढाल लाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “पाँच हज़ार मीना की एक सोने की ढाल।” यूनानी वाक्यांश का यह अधिक औपचारिक अनुवाद भी संभव है; यहाँ इससे ढाल का मूल्य अभिप्रेत होने की संभावना है।
    reason: यूनानी ἀπὸ μνῶν πεντακισχιλίων के अधिक औपचारिक वैकल्पिक रूप और प्रसंगानुकूल मूल्य-सूचक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἤνεγκαν
  choice: वे ... लाए
  rationale: φέρω के एओरिस्ट रूप का सरल कथात्मक अर्थ यहाँ ‘लाए’ है; यह राजनयिक उपहार को औपचारिक रूप से ‘भेंट किया’ कहकर मूल से अधिक विशिष्ट नहीं बनाता।
- source_word: ἀσπίδα
  choice: एक ढाल
  rationale: ἀσπίς का सामान्य और स्वाभाविक हिन्दी अर्थ ‘ढाल’ है। हिन्दी में एकवचन अनिश्चित संज्ञा के लिए ‘एक’ सहज है।
- source_word: χρυσῆν
  choice: सोने की
  rationale: यह विशेषण ढाल की सामग्री अथवा बहुमूल्यता बताता है; ‘सोने की’ आधुनिक हिन्दी में ‘स्वर्णिम’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: पाँच हज़ार मीना मूल्य की
  rationale: ἀπό के साथ धनराशि का यह प्रयोग प्रसंग में ढाल का मूल्य या लागत बताता जान पड़ता है। हिन्दी में ‘मूल्य की’ इस सम्भावित भाव को स्पष्ट करता है, जबकि अधिक शब्दशः रूप पादटिप्पणी में सुरक्षित है।
- source_word: μνῶν
  choice: मीना
  rationale: प्राचीन भार और मुद्रा-इकाई μνᾶ को किसी अनुमानित आधुनिक इकाई में बदलने के बजाय ऐतिहासिक नाम के रूप में लिप्यंतरित किया गया है।
