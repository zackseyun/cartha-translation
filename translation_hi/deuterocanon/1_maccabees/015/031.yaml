  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: hi
  text: पर यदि नहीं, तो उनके बदले चाँदी के पाँच सौ तोड़े दो, और तुम्हारे किए हुए विनाश तथा नगरों के करों[a] के लिए अतिरिक्त पाँच सौ तोड़े दो।[b] पर यदि नहीं, तो वे आकर तुमसे युद्ध करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगरों के करों” का अनुवाद “नगरों के खिराज” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी वाक्य-विन्यास संक्षिप्त है: शाब्दिक क्रम है, “और तुम्हारे किए हुए विनाश तथा नगरों के करों के लिए, पाँच सौ तोड़े और।” यहाँ अंतिम राशि को विनाश और नगरों के करों—दोनों के लिए अतिरिक्त भुगतान समझा गया है।'
    reason: lexical_alternative
