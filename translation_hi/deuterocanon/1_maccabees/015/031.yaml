- source_word: εἰ δὲ μή
  choice: पर यदि नहीं
  rationale: यह सीधे शर्त और चेतावनी को व्यक्त करता है; दोनों स्थानों पर इसकी पुनरावृत्ति यूनानी पाठ की अंतिम चेतावनी वाली संरचना बनाए रखती है।
- source_word: δότε
  choice: दो
  rationale: आर्थिक माँग के संदर्भ में इसका अर्थ भुगतान करना है, पर ‘दो’ यूनानी क्रिया के निकट और हिन्दी में स्वाभाविक है।
- source_word: ἀντʼ αὐτῶν
  choice: उनके बदले
  rationale: ἀντί प्रतिस्थापन या एवज का भाव देता है; सर्वनाम का संदर्भ निकटवर्ती प्रसंग पर खुला रखा गया है।
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: पाँच सौ तोड़े चाँदी
  rationale: प्राचीन भार एवं मुद्रा-इकाई τάλαντον के लिए हिन्दी बाइबलीय शब्द ‘तोड़ा’ रखते हुए चाँदी की राशि स्पष्ट की गई है।
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: जो विनाश तुमने किया है
  rationale: संज्ञा और उसी मूल की क्रिया को सहज हिन्दी में व्यक्त करते हुए विनाश की गंभीरता और संबोधित पक्ष की जिम्मेदारी दोनों बनाए रखी गई हैं।
- source_word: τῶν φόρων τῶν πόλεων
  choice: नगरों के करों
  rationale: φόροι कर अथवा अधीनस्थ राजस्व/खिराज हो सकता है; मुख्य पाठ में आधुनिक और स्पष्ट ‘कर’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: और पाँच सौ तोड़े
  rationale: संक्षिप्त यूनानी वाक्य-विन्यास में यह पहले भुगतान के अतिरिक्त दूसरी राशि बताता है; ‘और’ उस योगात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παραγενόμενοι ἐκπολεμήσουσιν ὑμᾶς
  choice: वे आकर तुमसे युद्ध करेंगे
  rationale: कृदन्त और मुख्य क्रिया का क्रम—आना और फिर युद्ध करना—संक्षिप्त तथा स्वाभाविक हिन्दी में सुरक्षित है।
