lexical_decisions:
- source_word: Λεύκιος
  choice: लूकियुस
  rationale: व्यक्तिवाचक नाम का यूनानी रूप से निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ὕπατος
  choice: कौंसल
  rationale: यहाँ यह शब्द रोमी शासन के ऐतिहासिक पद ‘consul’ को सूचित करता है; ‘कौंसल’ उस पद का प्रचलित और सटीक हिन्दी रूप है।
- source_word: Ῥωμαίων
  choice: रोमियों के
  rationale: सम्बन्धकारक बहुवचन को स्पष्ट रखते हुए यह पद कौंसल की रोमी पहचान बताता है।
- source_word: Πτολεμαίῳ
  choice: टॉलेमी
  rationale: राजकीय व्यक्तिवाचक नाम को हिन्दी में प्रचलित रूप में लिप्यंतरित किया गया है; सम्प्रदान कारक का अर्थ ‘को’ से व्यक्त है।
- source_word: βασιλεῖ
  choice: राजा
  rationale: यह टॉलेमी की उपाधि है और हिन्दी पत्र-शैली में नाम से पहले स्वाभाविक लगती है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह यूनानी पत्रों के आरम्भ में प्रयुक्त पारंपरिक अभिवादन-सूत्र है; शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘नमस्कार’ हिन्दी में उसके पत्रात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है।
