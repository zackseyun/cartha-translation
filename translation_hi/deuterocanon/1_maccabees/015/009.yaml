base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: hi
  text: और जब हम अपने राज्य को स्थापित कर लेंगे, तब हम आपको, आपके राष्ट्र और पवित्रस्थान[b] को बड़ा सम्मान देंगे[a], ताकि सारी पृथ्वी पर आपकी प्रतिष्ठा प्रकट हो जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘महिमा’ से संबंधित एक ही शब्द-परिवार के रूप बार-बार आए हैं; इसलिए इसका अनुवाद इस प्रकार भी हो सकता है: ‘हम आपको ... बड़ी महिमा देंगे ... ताकि आपकी महिमा प्रकट हो जाए।’ मुख्य पाठ में राजकीय और कूटनीतिक संदर्भ के कारण ‘सम्मान’ और ‘प्रतिष्ठा’ चुने गए हैं।'
    reason: lexical_alternative
  - marker: b
    text: ‘पवित्रस्थान’ का अनुवाद ‘मंदिर’ भी किया जा सकता है, क्योंकि यूनानी शब्द पवित्र मंदिर-परिसर को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सारी पृथ्वी पर’ का अर्थ प्रसंग के अनुसार ‘सारे देश में’ अथवा ‘संसार भर में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  choice: स्थापित कर लेंगे
  rationale: ὡς δʼ ἂν के साथ यह भावी अनिश्चित परिस्थिति को व्यक्त करता है—‘जब हम स्थापित कर लेंगे।’ राजनीतिक संदर्भ में यह राज्य को दृढ़ और व्यवस्थित करने का स्वाभाविक अर्थ देता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: यहाँ वक्ता के राजकीय शासन अथवा राज्य-सत्ता का संकेत है; ‘राज्य’ आधुनिक हिन्दी में सहज है और यूनानी की संस्थागत व्यापकता बनाए रखता है।
- source_word: δοξάσωμέν
  choice: सम्मान देंगे
  rationale: राजकीय पत्र के कूटनीतिक संदर्भ में δοξάζω का आशय प्रतिष्ठित या सम्मानित करना है; ‘महिमा देंगे’ यहाँ अनावश्यक रूप से धार्मिक सुनाई दे सकता है।
- source_word: ἔθνος
  choice: जाति
  rationale: यह यहूदी जनसमुदाय को एक सामूहिक राजनीतिक-सांस्कृतिक इकाई के रूप में दर्शाता है। ‘जाति’ बाइबलीय हिन्दी में इस अर्थ को संक्षेप में व्यक्त करती है, यद्यपि ‘राष्ट्र’ भी संभव है।
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: ἱερόν मंदिर अथवा उसके पूरे पवित्र परिसर का बोध करा सकता है। ‘पवित्रस्थान’ मूल की व्यापकता को ‘मंदिर’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: δόξῃ μεγάλῃ
  choice: बड़ा सम्मान
  rationale: यह क्रिया δοξάζω से जुड़ा समानमूलक प्रयोग है और सम्मान प्रदान करने की रीति या परिमाण बताता है। हिन्दी में ‘बड़ा सम्मान देंगे’ स्वाभाविक राजनयिक अभिव्यक्ति है।
- source_word: φανερὰν γενέσθαι
  choice: प्रकट हो जाए
  rationale: 'ὥστε के बाद परिणाम व्यक्त होता है: उनकी प्रतिष्ठा सार्वजनिक रूप से स्पष्ट और विख्यात हो जाए।'
- source_word: τὴν δόξαν ὑμῶν
  choice: आपकी प्रतिष्ठा
  rationale: यहाँ δόξα सार्वजनिक मान, यश या प्रतिष्ठा को सूचित करता है। ‘प्रतिष्ठा’ राजनीतिक संदर्भ में स्वाभाविक है और ‘महिमा’ की धार्मिक छाया से बचती है।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: समूची धरती पर
  rationale: γῆ का अर्थ भूमि, देश या धरती हो सकता है। राजकीय पत्र में व्यापक ख्याति के दावे को देखते हुए ‘समूची धरती’ मूल की व्यापक और कुछ हद तक खुली भौगोलिक सीमा को बनाए रखता है।
