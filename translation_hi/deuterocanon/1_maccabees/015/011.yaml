    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: पीछा किया
  rationale: यहाँ διώκω सैन्य-राजनीतिक प्रसंग में सक्रिय रूप से किसी के पीछे पड़ने का भाव देता है; ‘पीछा किया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: राजा अन्तियोकुस
  rationale: हिन्दी की स्वाभाविक पद-व्यवस्था में उपाधि नाम से पहले आती है।
- source_word: ἦλθεν εἰς Δῶρα
  choice: दोरा नगर में आ पहुँचा
  rationale: ἔρχομαι प्रसंगानुसार आने या जाने को व्यक्त कर सकता है; गंतव्य तक पहुँचने की कथा-गतिशीलता को ‘आ पहुँचा’ स्पष्ट और सहज रूप से व्यक्त करता है। ‘नगर’ जोड़ने से हिन्दी पाठक के लिए स्थान-नाम स्पष्ट होता है।
- source_word: φεύγων
  choice: भागते हुए
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ चल रही परिस्थिति को व्यक्त करता है; ‘भागते हुए’ उस समकालिकता को बनाए रखता है।
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: समुद्र के किनारे बसे
  rationale: यूनानी पदबंध दोरा की समुद्र के पास स्थित होने पर बल देता है। हिन्दी में इसे नगर के स्थान का विशेषण बनाना अर्थ को स्पष्ट रखते हुए स्वाभाविक है।
