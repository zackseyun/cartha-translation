base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: hi
  text: इसलिए यदि कुछ उपद्रवी[a] अपने देश से भागकर हमारे पास आ गए हों, तो उन्हें महायाजक शमौन के हवाले कर दो, ताकि वह उनकी व्यवस्था के अनुसार उन्हें दण्ड दे सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘हानिकारक लोग’, ‘संकट खड़ा करने वाले’ या अधिक शब्दशः ‘महामारी-जैसे लोग’ भी हो सकता है। यह खतरनाक या उपद्रवी व्यक्तियों के लिए एक कठोर शब्द है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘ताकि वह उनके विरुद्ध न्याय करे’ या ‘उनसे बदला ले’ भी हो सकता है। यूनानी क्रिया में दण्ड और प्रतिशोध दोनों के भाव आ सकते हैं, पर ‘उनकी व्यवस्था के अनुसार’ यहाँ न्यायिक अर्थ के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: उपद्रवी
  rationale: व्यक्तियों के लिए प्रयुक्त यह यूनानी शब्द हानिकारक और संकट उत्पन्न करने वाले लोगों के लिए एक कठोर तिरस्कारसूचक शब्द है। ‘उपद्रवी’ आधुनिक हिन्दी में स्वाभाविक है और कानूनी-राजनीतिक प्रसंग के अनुकूल रहते हुए शब्द की कठोरता व्यक्त करता है।
- source_word: διαπεφεύγασιν
  choice: बचकर ... आ गए हों
  rationale: पूर्णकालिक यूनानी रूप पहले हो चुके पलायन और उसके वर्तमान परिणाम को दर्शाता है। हिन्दी में यह प्रयोग उसी अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: χώρας
  choice: देश
  rationale: χώρα का अर्थ देश, भूभाग या क्षेत्र हो सकता है। यहाँ राजनीतिक-भौगोलिक संदर्भ में ‘देश’ स्पष्ट और स्वाभाविक है, पर अनावश्यक रूप से सीमा निर्धारित नहीं करता।
- source_word: παράδοτε
  choice: हवाले कर दो
  rationale: यह आज्ञार्थक क्रिया भगोड़ों को शमौन के अधिकार में सौंपने को कहती है। ‘हवाले कर दो’ आधुनिक हिन्दी में न्यायिक और प्रत्यर्पण-संबंधी प्रसंग के लिए स्वाभाविक है।
- source_word: ἀρχιερεῖ
  choice: महायाजक
  rationale: यह यहूदी प्रधान याजक का मानक पदनाम है; हिन्दी बाइबलीय प्रयोग में ‘महायाजक’ सुस्थापित और सटीक है।
- source_word: ἐκδικήσει
  choice: दण्ड दे सके
  rationale: क्रिया प्रतिशोध लेने या न्याय लागू करने, दोनों का भाव रख सकती है। ‘उनकी व्यवस्था के अनुसार’ के कानूनी संदर्भ में ‘दण्ड दे’ न्यायिक कार्रवाई को व्यक्त करता है, निजी बदला लेने को नहीं।
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: उनकी व्यवस्था के अनुसार
  rationale: यूनानी में सर्वनाम बहुवचन है, इसलिए ‘उनकी’ को सुरक्षित रखा गया है। ‘व्यवस्था’ νόμος के सामुदायिक-कानूनी अर्थ को व्यक्त करती है और यह तय नहीं करती कि सर्वनाम का संकेत ठीक किस समूह की ओर है।
theological_decisions:
- issue: कानूनी-राजनीतिक प्रसंग में ἐκδικήσει का बल
  choice: न्यायिक दण्ड
  alternative: उनसे बदला ले / उनके विरुद्ध प्रतिशोध ले
  rationale: ‘उनकी व्यवस्था के अनुसार’ कार्रवाई को विधिक ढाँचे में रखता है। इसलिए अनुवाद निजी प्रतिशोध के बजाय न्यायिक दण्ड का भाव देता है, जबकि पादटिप्पणी क्रिया के प्रतिशोधात्मक अर्थ की सम्भावना सुरक्षित रखती है।
- issue: κατὰ τὸν νόμον αὐτῶν में बहुवचन सर्वनाम का संदर्भ
  choice: ‘उनकी व्यवस्था’ कहकर संदर्भ को खुला रखना
  alternative: ‘उसकी व्यवस्था’ या ‘यहूदियों की व्यवस्था’ कहकर संदर्भ स्पष्ट करना
  rationale: मूल पाठ में αὐτῶν बहुवचन है और उसका सटीक संदर्भ पूरी तरह स्पष्ट नहीं है। उसे किसी एक समूह तक सीमित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महायाजक’, ‘व्यवस्था’ और ‘दण्ड’ बाइबलीय-कानूनी गरिमा बनाए रखते हैं; ‘उपद्रवी’ मूल के कठोर अपमानसूचक भाव को अत्यधिक अस्वाभाविक शब्दशः रूप के बिना व्यक्त करता है।
