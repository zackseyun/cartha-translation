    text: या, “उसका सहयोगी बनने के लिए” अथवा “उसकी सहायता करने के लिए।” यूनानी क्रिया व्यापक रूप से सहयोगी सहायता देने का अर्थ रख सकती है; यहाँ प्रसंग युद्ध-संबंधी सहायता का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पर्याप्त रसद।” यूनानी शब्द व्यापक है और प्रसंग के अनुसार उपकरण, साज-सामान या रसद को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: सामान्य कथात्मक क्रिया का स्वाभाविक हिन्दी रूप; वाक्य में पुरुषों और वस्तुओं दोनों पर लागू होता है।
- source_word: διαχιλίους ἄνδρας
  choice: दो हज़ार पुरुष
  rationale: यूनानी पाठ स्पष्टतः ‘दो हज़ार पुरुष’ कहता है; ‘सैनिक’ प्रसंगानुकूल है, पर मूल में प्रत्यक्ष नहीं।
- source_word: ἐκλεκτούς
  choice: चुने हुए
  rationale: चयनित होने का विशेषणात्मक भाव सुरक्षित रहता है और उन्हें अनावश्यक रूप से ‘विशिष्ट सैनिक’ नहीं ठहराता।
- source_word: συμμαχῆσαι αὐτῷ
  choice: उसके साथ युद्ध में सहायता करने के लिए
  rationale: क्रिया सहयोगी बनकर युद्ध-सहायता देने का अर्थ रखती है; यह अनुवाद सैन्य प्रसंग को स्पष्ट करता है, पर औपचारिक संधि का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἀργύριον
  choice: चाँदी
  rationale: सोने के साथ सूचीबद्ध होने के कारण धातु का शाब्दिक अर्थ ‘चाँदी’ यहाँ ‘धन’ से अधिक उपयुक्त है।
- source_word: χρυσίον
  choice: सोना
  rationale: प्रत्यक्ष और स्वाभाविक हिन्दी समतुल्य।
- source_word: σκεύη ἱκανά
  choice: पर्याप्त साज-सामान
  rationale: σκεύη एक व्यापक शब्द है, जिसका अर्थ उपकरण, सामान या रसद हो सकता है; सैन्य सहायता के प्रसंग में ‘साज-सामान’ इसकी व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है और ἱκανά को ‘पर्याप्त’ व्यक्त करता है।
