  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: hi
  text: और शमौन ने उसके साथ युद्ध में सहायता करने के लिए दो हज़ार चुने हुए पुरुष भेजे[a], और चाँदी, सोना तथा पर्याप्त साज-सामान भी भेजा[b]।
  philosophy: optimal-equivalence
  footnotes:
