- source_word: σοι
  choice: तुम्हारे लिए
  rationale: लाभार्थी का भाव स्पष्ट करता है और हिन्दी में ‘मान्य ठहराता हूँ’ के साथ स्वाभाविक है।
- source_word: πάντα τὰ ἀφαιρέματα
  choice: उन सभी रियायतों
  rationale: ἀφαιρέματα यहाँ देय राशियों में छूट या राजकोषीय रियायतों का व्यापक प्रशासनिक अर्थ रखता है। ‘रियायतें’ पूर्ण कर-मुक्ति का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: ἃ ἀφῆκάν σοι
  choice: जो ... तुम्हें दी थीं
  rationale: ἀφίημι यहाँ दायित्व में छूट अथवा रियायत देने के अर्थ में है; ‘दी थीं’ हिन्दी में पूर्ववर्ती ‘रियायतों’ के साथ सहज है।
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: मुझसे पहले के राजाओं
  rationale: राजकीय उत्तराधिकार के संदर्भ में यूनानी कालवाचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: और उन अन्य सभी रियायतों को भी
  rationale: ὅσα ἄλλα की अनिर्दिष्ट और व्यापक परिधि को बनाए रखता है तथा हिन्दी वाक्य में पहले कर्म से स्पष्ट संबंध जोड़ता है।
- source_word: ἀφῆκέν σοι
  choice: जो उसने तुम्हें दी थी
  rationale: प्राप्त यूनानी पाठ में बहुवचन ‘राजाओं’ के बाद क्रिया एकवचन है। ‘उसने ... दी थी’ उस असामान्य एकवचन को सामान्य बहुवचन में बदले बिना सुरक्षित रखता है।
