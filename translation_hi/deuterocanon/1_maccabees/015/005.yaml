  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
translation:
  language: hi
  text: इसलिए अब मैं तुम्हारे लिए उन सभी रियायतों[a] को मान्य ठहराता हूँ, जो मुझसे पहले के राजाओं ने तुम्हें दी थीं, और जो भी अन्य रियायतें उसने तुम्हें दी थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “रियायतों” से आशय राजा द्वारा करों या अन्य देय राशियों में दी गई छूट अथवा कमी है; इसका अर्थ आवश्यक रूप से सभी दायित्वों से पूरी मुक्ति नहीं है।
    reason: cultural_note
  - marker: b
    text: यूनानी पाठ के अंत में क्रिया एकवचन है—अर्थात् “उसने तुम्हें दी”—जबकि इससे पहले कर्ता बहुवचन, “मुझसे पहले के राजा,” है। स्वेट के पाठ में सुरक्षित इस रूप को हिन्दी में एकवचन “उसने” द्वारा बनाए रखा गया है; कर्म “रियायतें” के साथ हिन्दी की व्याकरणिक सहमति के कारण क्रिया “दी थीं” है। कुछ पाठक इसके स्थान पर “उन्होंने तुम्हें दी थीं” की अपेक्षा कर सकते हैं।
    reason: textual_variant
