  yaml_path: translation/deuterocanon/1_maccabees/015/015.yaml
  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: hi
  text: 'और नूमेनियुस तथा उसके साथी रोम से लौट आए[a], और वे राजाओं और देशों के नाम पत्र लेकर आए, जिनमें ये बातें लिखी थीं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘रोम से आए’ है; पर संदर्भ बताता है कि वे वहाँ भेजे गए दूत-मंडल से लौट रहे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: लौट आए
  rationale: मूल अर्थ ‘आए’ है, पर पिछले संदर्भ में नूमेनियुस के रोम भेजे जाने के कारण यहाँ वापसी का भाव स्पष्ट है। बहुवचन हिंदी में नूमेनियुस और उसके साथियों को सम्मिलित करता है।
- source_word: Νουμήνιος
  choice: नूमेनियुस
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: οἱ παρʼ αὐτοῦ
  choice: उसके साथी
  rationale: यह मुहावरा उसके साथ आए लोगों को दर्शाता है; ‘साथी’ सहज और अर्थ-संगत है।
- source_word: ἐκ Ῥώμης
  choice: रोम से
  rationale: स्थान-स्रोत सूचित करने वाले ἐκ का स्वाभाविक हिंदी रूप।
- source_word: ἔχοντες ἐπιστολάς
  choice: पत्र लाए थे
  rationale: शाब्दिक ‘पत्र लिए हुए’ की अपेक्षा आगमन के साथ पत्र लाने का आशय आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: राजाओं और देशों के नाम
  rationale: सम्प्रदान कारक पत्रों के अभिप्रेत प्राप्तकर्ताओं को दर्शाता है; ‘के नाम’ हिंदी में संबोधित पत्रों के लिए स्वाभाविक है। χώρα के लिए यहाँ ‘देश’ उपयुक्त है।
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: जिनमें ये बातें लिखी थीं
  rationale: पत्रों की विषय-वस्तु का परिचय देते हुए τάδε के बहुवचन को ‘ये बातें’ से सुरक्षित रखा गया है।
