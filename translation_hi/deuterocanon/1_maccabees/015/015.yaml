  source_fidelity: The draft accurately conveys Numenius, his companions, Rome as the point of departure, the letters addressed to kings and countries, and the introductory formula for their contents. The contextual rendering “लौट आए” is appropriately qualified by a footnote, preserving the Greek’s basic “came from Rome.”
