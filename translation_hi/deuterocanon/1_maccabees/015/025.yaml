  yaml_path: translation/deuterocanon/1_maccabees/015/025.yaml
  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: hi
  text: परन्तु राजा अन्तियोकुस ने दोरा के विरुद्ध दूसरी बार[a] पड़ाव डाला। वह लगातार उस पर हमला करता रहा और घेराबंदी के यंत्र तैयार करता रहा। उसने त्रुफोन को घेरकर उसे भीतर आने और बाहर जाने से रोक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “दूसरे दिन।” यूनानी पदबंध संक्षिप्त और कुछ अस्पष्ट है; इस सैनिक प्रसंग में “दूसरी बार” को सामान्यतः अधिक उपयुक्त समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: दोरा के विरुद्ध पड़ाव डाला
  rationale: सैनिक प्रसंग में παρεμβάλλω शिविर या पड़ाव डालने को और ἐπί नगर की ओर शत्रुतापूर्ण बढ़ने को व्यक्त करता है।
- source_word: ἐν τῇ δευτέρᾳ
  choice: दूसरी बार
  rationale: यह पदबंध कुछ असामान्य है, पर घेराबन्दी के प्रसंग में पुनः की गई कार्रवाई का अर्थ सबसे स्वाभाविक है; सम्भव अधिक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है।
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: लगातार उस पर अपनी सेना चढ़ाता रहा
  rationale: शाब्दिक रूप से 'उसके विरुद्ध हाथ लाता रहा' यहाँ निरन्तर सैनिक आक्रमण या दबाव का मुहावरा है। 'सेना चढ़ाता रहा' हिन्दी में उस सक्रिय सैन्य दबाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μηχανὰς ποιούμενος
  choice: घेराबन्दी के यंत्र बनवाता रहा
  rationale: μηχαναί इस सैन्य प्रसंग में नगर पर आक्रमण के लिए प्रयुक्त यंत्र हैं। राजा के विषय में हिन्दी का प्रेरणार्थक 'बनवाता' स्वाभाविक है और निर्माण की प्रक्रिया बनाए रखता है।
- source_word: συνέκλεισεν
  choice: घेर लिया
  rationale: क्रिया किसी को चारों ओर से बन्द कर देने या भीतर रोक देने का भाव देती है; 'घेर लिया' आगे के आवागमन-निषेध से सहज जुड़ता है।
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: कि वह न भीतर आ सकता था, न बाहर जा सकता था
  rationale: संज्ञीकृत क्रियारूप प्रभावी रोक या परिणाम व्यक्त करते हैं। यह हिन्दी रूप पूर्ण नाकाबन्दी का आशय स्पष्ट रखता है।
