  rationale: हेल्लेनिस्तीनी राजदरबार में ‘मित्र’ संभवतः एक आधिकारिक पदवी थी। उद्धरण-चिह्न इस संभावित तकनीकी अर्थ को बनाए रखते हैं, जबकि पादटिप्पणी उसे स्पष्ट करती है।
- source_word: κοινολογησόμενον αὐτῷ
  choice: उसके पास बातचीत करने के लिए
  rationale: क्रिया विचार-विमर्श या चर्चा करने को दर्शाती है। ‘बातचीत करने’ से अर्थ व्यापक रहता है और ‘समझौता करने’ जैसी अधिक विशिष्ट धारणा नहीं जुड़ती।
- source_word: κατακρατεῖτε
  choice: अपने अधिकार में कर रखा है
  rationale: यह प्रयोग निरंतर नियंत्रण या कब्ज़ा बनाए रखने का आरोप व्यक्त करता है, पर स्रोत से अधिक सैन्य बल नहीं जोड़ता।
- source_word: Ἰόππης
  choice: योप्पा
  rationale: यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Γαζάρων
  choice: गज़ारा
  rationale: अनुवाद यूनानी पाठ के स्थान-नाम रूप को सुरक्षित रखता है; अधिक परिचित ‘गेज़ेर’ की पहचान पादटिप्पणी में दी गई है।
- source_word: ἄκρας
  choice: दुर्ग
  rationale: ἄκρα का सामान्य अर्थ दुर्ग या गढ़ है। यहाँ यह यरूशलेम के विशिष्ट सेल्यूकिड गढ़ का नाम ‘अक्रा’ भी हो सकता है; यह विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πόλεις τῆς βασιλείας μου
  choice: ये नगर मेरे राज्य के हैं
  rationale: संबंधवाचक यूनानी रचना का स्वाभाविक हिन्दी रूप, जो राजा के क्षेत्राधिकार के दावे को स्पष्ट रखता है।
