  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: hi
  text: और उसने अपने मित्रों[a] में से एक, अथेनोबियुस को उससे बातचीत करने के लिए भेजा और कहा, “तुम लोगों ने योप्पा, गज़ारा[b] और यरूशलेम का दुर्ग[c] अपने अधिकार में कर रखा है; ये नगर मेरे राज्य के हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हेलेनिस्टिक राजदरबार में “मित्र” केवल निजी संबंध नहीं, बल्कि किसी दरबारी पद या सम्मान की उपाधि भी हो सकती थी।
    reason: historical_context
  - marker: b
    text: गज़ारा यूनानी स्थान-नाम है; सामान्यतः इसकी पहचान गेज़ेर से की जाती है।
    reason: cross_reference
  - marker: c
    text: या “यरूशलेम का अक्रा।” यूनानी शब्द का अर्थ “दुर्ग” या “गढ़” है, पर यहाँ यह यरूशलेम के सेल्यूकिड गढ़ के प्रचलित नाम के रूप में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
