  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: hi
  text: और हर राजकीय बकाया तथा आगे की राजकीय देय राशियाँ[a] अब से सदा के लिए तुम्हें माफ़ कर दी जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आगे के राजकीय देय” अथवा “जो आगे राजा को प्राप्त होगा।” यूनानी पाठ इनके राजकीय स्वरूप और भविष्य में देय होने के अलावा आय की ठीक-ठीक श्रेणी नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικὸν
  choice: हर राजकीय बकाया
  rationale: ὀφείλημα का मूल अर्थ देय वस्तु या बकाया है। राजकोषीय आदेश के संदर्भ में ‘राजकीय बकाया’ स्वाभाविक है और यह अस्पष्टता बनाए रखता है कि देयता कर, शुल्क या किसी अन्य मद की है।
- source_word: τὰ ἐσόμενα βασιλικά
  choice: आगे की राजकीय देय राशियाँ[a]
  rationale: नपुंसकलिंग बहुवचन और भविष्यसूचक कृदंत उन राशियों या देय मदों की ओर संकेत करते हैं जो आगे चलकर राजा अथवा राजकोष को प्राप्त होंगी। ‘देय राशियाँ’ वित्तीय संदर्भ स्पष्ट करती हैं, पर किसी खास कर-श्रेणी को आरोपित नहीं करतीं।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह समकालीन हिन्दी में समय के आरंभ-बिंदु को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: सदा के लिए
  rationale: यह आदेश में व्यक्त अनिश्चित और निरंतर अवधि को सहज, गरिमापूर्ण हिन्दी में दर्शाता है।
- source_word: ἀφέσθω σοι
  choice: तुम्हें माफ़ कर दी जाएँ
  rationale: वित्तीय और कानूनी संदर्भ में ἀφίημι देयता को छोड़ देने या निरस्त करने का बोध देता है। ‘माफ़ कर दी जाएँ’ सामान्य पाठक के लिए स्पष्ट है और σοι को लाभार्थी ‘तुम्हें’ के रूप में रखता है।
