lexical_decisions:
- source_word: ᾔδει
  choice: वह जानता था
  rationale: οἶδα का यह भूतकालिक रूप किसी विद्यमान जानकारी को व्यक्त करता है; आधुनिक हिन्दी में ‘जानता था’ स्वाभाविक और सटीक है।
- source_word: ἐπισυνῆκται
  choice: इकट्ठी हो गई हैं
  rationale: पूर्णकालिक रूप ऐसी पूर्ण हो चुकी प्रक्रिया और उसके वर्तमान परिणाम को दर्शाता है जिसमें विपत्तियाँ उसके विरुद्ध एकत्र हो चुकी थीं; हिन्दी की परोक्ष कथन-रचना में ‘हो गई हैं’ उस परिणामगत अवस्था को बनाए रखता है।
- source_word: ἐπʼ αὐτόν
  choice: उसके विरुद्ध
  rationale: κακά और एकत्र होने की क्रिया के साथ ἐπί का भाव यहाँ शत्रुतापूर्ण दिशा का है, इसलिए ‘विरुद्ध’ उपयुक्त है।
- source_word: κακά
  choice: विपत्तियाँ
  rationale: यहाँ κακά नैतिक बुराइयों के बजाय प्रतिकूल घटनाओं या संकटों को सूचित करता है; ‘विपत्तियाँ’ इस व्यापक और गंभीर अर्थ को व्यक्त करता है।
- source_word: ἀφῆκαν
  choice: छोड़ दिया है
  rationale: ἀφίημι का अर्थ यहाँ साथ छोड़ देना या त्याग देना है। परोक्ष कथन में ‘छोड़ दिया है’ पहले घट चुकी और प्रभावी अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἱ δυνάμεις
  choice: सेनाओं
  rationale: मक्काबियों के सैन्य आख्यान में δυνάμεις सशस्त्र बलों या सैनिक दलों को सूचित करता है। यूनानी में स्वामित्व स्पष्ट न होने के कारण ‘उसकी’ नहीं जोड़ा गया।
