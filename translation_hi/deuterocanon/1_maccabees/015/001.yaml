  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: hi
  text: और राजा दिमेत्रियुस के पुत्र अन्तियोकस ने समुद्र के द्वीपों से यहूदियों के याजक और एथनार्क[a] शमौन को, और समूचे राष्ट्र को, पत्र भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एथनार्क’ एक औपचारिक पद था, जिसका अर्थ किसी जाति या राष्ट्र का शासक अथवा प्रमुख है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: ἀποστέλλω के सामान्य भूतकालीन अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और बहुवचन कर्म ‘पत्र’ के साथ उपयुक्त है।
- source_word: ἐπιστολάς
  choice: पत्र
  rationale: यूनानी में यह स्पष्ट बहुवचन है; हिन्दी में ‘पत्र भेजे’ बहुवचन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: समुद्र के द्वीपों से
  rationale: यूनानी भौगोलिक अभिव्यक्ति के निकट रहते हुए सहज हिन्दी देता है और द्वीपों की पहचान अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἱερεῖ
  choice: याजक
  rationale: शमौन के पद को बताने वाला दत्तिव समानाधिकरण है; ‘याजक’ बाइबलीय संदर्भ में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐθνάρχῃ
  choice: एथनार्क
  rationale: यह किसी जाति या राष्ट्र के शासक का औपचारिक ऐतिहासिक पद है; लिप्यंतरण पद की विशिष्टता बचाता है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों के
  rationale: यहाँ पद का संबंध व्यापक यहूदी समुदाय से है; यह चयन जातीय-धार्मिक और राजनीतिक दोनों अर्थ-छायाओं को पर्याप्त रूप से समेटता है।
- source_word: παντὶ τῷ ἔθνει
  choice: सारे राष्ट्र को
  rationale: शमौन के साथ पत्रों के दूसरे प्राप्तकर्ता को दिखाता है और ἔθνος के सामूहिक-राजनीतिक भाव को बनाए रखता है।
- source_word: τοῦ βασιλέως
  choice: राजा
  rationale: ‘राजा दिमेत्रियुस के पुत्र’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी राजकीय उपाधि को ठीक से व्यक्त करता है।
theological_decisions:
- issue: ἐθνάρχης की राजनीतिक उपाधि का अनुवाद
  choice: एथनार्क
  alternative: राष्ट्र का शासक
  rationale: औपचारिक ऐतिहासिक उपाधि को बनाए रखने से यूनानी पाठ से अधिक विशिष्ट शासन-व्यवस्था आरोपित नहीं होती; अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। व्यक्तिनामों को यूनानी रूपों के निकट रखा गया है। ‘एथनार्क’ जैसी ऐतिहासिक उपाधि को लिप्यंतरित करके पादटिप्पणी में समझाया गया है।
