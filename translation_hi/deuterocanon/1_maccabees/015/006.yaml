lexical_decisions:
- source_word: ποιῆσαι
  choice: बनाने
  rationale: यह ποιέω का एओरिस्ट इनफिनिटिव है, जिसका सामान्य अर्थ ‘बनाना/करना’ है। हिन्दी में ‘सिक्के बनाने’ से प्रसंगानुसार टकसाल में ढालने का आशय स्पष्ट होता है, पर क्रिया को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाया गया।
- source_word: κόμμα
  choice: सिक्के
  rationale: इस राजकीय-प्रशासनिक प्रसंग में κόμμα ढले हुए धन अथवा सिक्का-प्रणाली को सूचित करता है। ‘सिक्के’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और मुद्रा जारी करने के अधिकार को स्पष्ट करता है।
- source_word: ἴδιον
  choice: अपनी
  rationale: ἴδιον उस वस्तु को दर्शाता है जो संबोधित व्यक्ति की अपनी अथवा उसके अधिकार की हो। ‘अपनी’ इसका सहज हिन्दी रूप है।
- source_word: νόμισμα
  choice: मुद्रा
  rationale: νόμισμα प्रचलित धन या करेंसी को दर्शाता है। κόμμα के लिए ‘सिक्के’ रखने से ‘मुद्रा के सिक्के’ दोनों संज्ञाओं का भेद बनाए रखता है।
- source_word: τῆς χώρας σου
  choice: अपने देश के लिए
  rationale: χώρα का अर्थ देश, भूभाग या क्षेत्र हो सकता है। यहाँ राजकीय अधिकार के संदर्भ में ‘देश’ स्वाभाविक है; संबंधवाचक यूनानी पदबंध को हिन्दी में प्रयोजनसूचक ‘के लिए’ से व्यक्त किया गया है।
