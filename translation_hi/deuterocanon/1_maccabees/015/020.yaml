lexical_decisions:
- source_word: ἔδοξεν
  choice: उचित लगा
  rationale: यह निर्वैयक्तिक प्रयोग किसी समूह को कोई कार्य अच्छा या उपयुक्त लगने का भाव देता है। ‘उचित लगा’ औपचारिक राजनयिक लहजा बनाए रखता है और इसे सीधे ‘निर्णय लिया गया’ नहीं बनाता।
- source_word: ἡμῖν
  choice: हमें
  rationale: संप्रदान कारक उस पक्ष को बताता है जिसे यह कार्य उचित लगा; हिन्दी में ‘हमें’ स्वाभाविक है।
- source_word: δέξασθαι
  choice: स्वीकार करना
  rationale: δέχομαι का अर्थ ग्रहण करना या स्वीकार करना हो सकता है। राजनयिक भेंट के संदर्भ में ‘स्वीकार करना’ स्वाभाविक है और मूल की अर्थ-सीमा बनाए रखता है।
- source_word: τὴν ἀσπίδα
  choice: वह ढाल
  rationale: ἀσπίς का सामान्य अर्थ ‘ढाल’ है। यूनानी पाठ इस पद में ‘सोने की’ नहीं कहता, इसलिए यह विवरण मुख्य पाठ में नहीं जोड़ा गया। निश्चित उपपद को हिन्दी में प्रसंगसूचक ‘वह’ से व्यक्त किया गया है।
- source_word: παρʼ αὐτῶν
  choice: उनसे
  rationale: सम्बन्धकारक के साथ παρά स्रोत को दर्शाता है; ‘उनसे’ संक्षिप्त और स्वाभाविक हिन्दी है।
