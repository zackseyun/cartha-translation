  text: And it seemed good to us to receive the shield from them[a].
translation:
  language: hi
  text: और हमें उनसे वह ढाल स्वीकार करना उचित लगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे वह ढाल ग्रहण करना।” यूनानी शब्द ἀσπίς सामान्य रूप से किसी ढाल को सूचित कर सकता है; इस राजनयिक प्रसंग में यह सम्मानस्वरूप दी गई भेंट हो सकती है, जिसे परंपरागत रूप से सोने की ढाल समझा गया है।
