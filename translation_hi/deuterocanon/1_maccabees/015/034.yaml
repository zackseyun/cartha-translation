lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: परन्तु हम
  rationale: δέ पिछले कथन के साथ विरोध दर्शाता है; ‘परन्तु’ उसके वैपरीत्य भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καιρὸν ἔχοντες
  choice: अवसर पाकर
  rationale: καιρός सामान्य समय के बजाय अनुकूल या उपयुक्त अवसर का संकेत देता है। यह कृदन्तीय वाक्यांश उसके परिस्थितिजन्य और कालगत, दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: ἀντεχόμεθα
  choice: दृढ़ता से थामे हुए हैं
  rationale: मध्यवाच्य क्रिया दृढ़तापूर्वक जुड़े रहने अथवा अधिकार न छोड़ने का भाव देती है। यह अनुवाद उस दृढ़ता को रखता है, पर इसे केवल कानूनी दावे तक सीमित नहीं करता।
- source_word: τῆς κληρονομίας
  choice: विरासत
  rationale: κληρονομία यहाँ उत्तराधिकार में मिली संपत्ति या पैतृक अधिकार-क्षेत्र को सूचित कर सकती है। ‘विरासत’ आधुनिक हिन्दी में सहज है और दोनों अर्थों के लिए पर्याप्त व्यापक है।
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: अपनी और अपने पूर्वजों की
  rationale: दोनों सम्बन्धकारक एक ही κληρονομία से जुड़े हैं। यह रचना एक ही विरासत के वर्तमान और पैतृक सम्बन्ध को बनाए रखती है, दो अलग विरासतों का संकेत नहीं देती।
