  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: hi
  text: उन्होंने अपने हथियार फेंक दिए और शांति की। राजा और उसके राज्य के सभी लोगों की दृष्टि में यहूदियों का आदर हुआ। वे बहुत-सी लूट लेकर यरूशलेम लौट गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: अपने हथियार फेंक दिए
  rationale: ग्रीक क्रिया ἔρριψαν का जीवंत अर्थ ‘फेंक दिए’ है; प्रसंग में यह हथियार डालने और संघर्ष छोड़ने को व्यक्त करता है।
- source_word: ἐποίησαν εἰρήνην
  choice: शांति कर ली
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और मूल की तरह किसी स्पष्ट कर्म को नहीं जोड़ता।
- source_word: ἐδοξάσθησαν
  choice: बड़ा सम्मान हुआ
  rationale: ऐतिहासिक और सार्वजनिक संदर्भ में क्रिया धार्मिक ‘महिमा’ से अधिक प्रतिष्ठा और आदर मिलने का भाव देती है। ‘बड़ा’ निष्क्रिय क्रिया में निहित प्रतिष्ठित किए जाने के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐναντίον τοῦ βασιλέως
  choice: राजा ... की दृष्टि में
  rationale: यहाँ ἐναντίον उपस्थिति मात्र नहीं, राजा के आकलन या सम्मान की दृष्टि को सूचित करता है।
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: उसके राज्य के सभी लोगों की दृष्टि में
  rationale: यह राजा से आगे पूरे राज्य में सार्वजनिक प्रतिष्ठा के विस्तार को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: यरूशलेम लौट गए
  rationale: कथात्मक प्रसंग में ἐπέστρεψαν का सीधा अर्थ वापस लौटना है।
- source_word: σκῦλα πολλά
  choice: बहुत-सी लूट
  rationale: σκῦλα युद्ध में प्राप्त लूट या युद्ध-सामग्री को दर्शाता है; ‘बहुत-सी लूट’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
