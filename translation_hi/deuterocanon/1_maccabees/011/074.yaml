- source_word: ἔπεσον
  choice: मारे गए
  rationale: युद्ध के प्रसंग में यूनानी क्रिया का अर्थ शत्रुओं के हताहत होकर गिरने से है। शाब्दिक ‘गिर पड़े’ हिन्दी में केवल जमीन पर गिरने का अर्थ दे सकता है; ‘मारे गए’ यहाँ अभिप्रेत युद्धगत अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: परदेशियों में से
  rationale: ἀλλόφυλοι का मूल भाव दूसरे लोगों या जाति से संबंधित व्यक्तियों का है। इस प्रसंग में इसे विशेष रूप से ‘पलिश्ती’ कहना अनावश्यक रूप से जातीय पहचान निश्चित कर देगा; ‘परदेशी’ व्यापक अर्थ बनाए रखता है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यह यूनानी कालवाचक पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: लगभग तीन हज़ार पुरुष
  rationale: संख्या के साथ εἰς कुल संख्या या लगभग पहुँची हुई संख्या का संकेत दे सकता है। ‘लगभग’ इस संभावित अनुमानात्मक भाव को मुख्य पाठ में दर्शाता है, जबकि निश्चित संख्या की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐπέστρεψεν
