  yaml_path: translation/deuterocanon/1_maccabees/011/071.yaml
  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
translation:
  language: hi
  text: और योनातान ने अपने कपड़े फाड़े, अपने सिर पर मिट्टी डाली[a] और प्रार्थना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिर पर मिट्टी डालना शोक, गहरे संकट या विलाप का प्रचलित संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξεν
  choice: फाड़े
  rationale: διαρρήγνυμι का भूतकालीन रूप यहाँ शोक या संकट में कपड़े फाड़ने की प्रथा को व्यक्त करता है। ‘फाड़े’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: अपने कपड़े
  rationale: ἱμάτια सामान्य रूप से वस्त्रों या कपड़ों को दर्शाता है। ‘अपने कपड़े’ सहज आधुनिक हिन्दी है और किसी विशेष प्रकार के राजसी वस्त्र का संकेत नहीं जोड़ता।
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: अपने सिर पर मिट्टी डाली
  rationale: γῆ का अर्थ धरती, भूमि या मिट्टी हो सकता है। इस शोक-संकेत के संदर्भ में ‘मिट्टी’ स्रोत के निकट रहते हुए हिन्दी में स्वाभाविक है।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: प्रσεύχομαι के इस रूप का सीधा और सामान्य हिन्दी अनुवाद ‘प्रार्थना की’ है।
- source_word: Ἰωνάθαν
  choice: योनातान
  rationale: यूनानी Ἰωνάθαν में सुरक्षित इब्रानी नाम के अनुरूप प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: शोक-संकेत का वर्णन
  choice: मुख्य पाठ में केवल योनातान के कार्यों का सीधा वर्णन रखा गया है।
  alternative: ‘मिट्टी’ के स्थान पर ‘धूल’ लिखकर पारंपरिक शोक-चित्र को अधिक स्पष्ट करना।
  rationale: यूनानी पाठ में γῆ है, जिसका सीधा अर्थ ‘मिट्टी/धरती’ है। उसके सांस्कृतिक अर्थ को मुख्य पाठ में व्याख्या बनाकर जोड़ने के बजाय पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक καί को ‘और’ से व्यक्त किया गया है, तथा क्रमिक क्रियाओं को संक्षिप्त कथात्मक शैली में रखा गया है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी [a] का चिह्न ‘clothes’ के बाद था, जबकि उसकी सामग्री सिर पर मिट्टी डालने से संबंधित थी; हिन्दी मसौदे में चिह्न को संबंधित वाक्यांश के बाद रखा गया है।
