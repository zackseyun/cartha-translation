  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: hi
  text: और वे सारी सेनाएँ जिन्हें देमेत्रियुस ने सेवा से हटा दिया था[a], उसके पास इकट्ठी हो गईं और उससे लड़ीं; वह भाग गया और युद्ध में परास्त हो गया।
  philosophy: optimal-equivalence
  footnotes:
