    text: या ‘विदा कर दिया था’ अथवा ‘भेज दिया था।’ यूनानी क्रिया का अर्थ सैनिकों को सेवा से हटाना या अपने पास से विदा करना हो सकता है; प्रसंग सैन्य सेवा से हटाए जाने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठी हो गईं
  rationale: क्रिया का कर्मवाच्य रूप और πρὸς αὐτόν मिलकर उसके पास आ जुटने का भाव देते हैं। यह स्वाभाविक हिन्दी में सैन्य दलों के एकत्र होने को व्यक्त करता है।
- source_word: δυνάμεις
  choice: सेनाओं
  rationale: इस युद्ध-संदर्भ में शब्द सशस्त्र सैन्य बलों को सूचित करता है। ‘सेनाओं’ बहुवचन को स्पष्ट और सहज रूप में रखता है।
- source_word: ἀπεκρόακεν
  choice: सेवा से हटा दिया था
  rationale: संदर्भ में देमेत्रियुस द्वारा सैनिक दलों को पहले सैन्य सेवा से हटाने या विदा करने का अर्थ सबसे उपयुक्त है। पूर्ण भूतकाल उस पूर्ववर्ती कार्य को बनाए रखता है।
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: उससे लड़ीं
  rationale: यहाँ πρὸς विरोध का संबंध दिखाता है; हिन्दी में ‘उससे लड़ीं’ स्पष्ट रूप से उसके विरुद्ध युद्ध करने का अर्थ देता है।
- source_word: ἔφυγεν
  choice: वह भाग गया
  rationale: सरल युद्ध-वृत्तांत में यह स्वाभाविक हिन्दी है और भय या पराजय के कारण पलायन का मूल अर्थ बनाए रखती है।
- source_word: ἐτροπώθη
  choice: युद्ध में परास्त हो गया
  rationale: मूल क्रिया का सैन्य भाव शत्रु द्वारा पीछे मोड़े या खदेड़े जाने का है। ‘युद्ध में’ जोड़ने से ‘परास्त’ का रणक्षेत्र-संबंधी अर्थ स्पष्ट रहता है, यद्यपि ‘तितर-बितर कर दिया गया’ जैसा विशिष्ट चित्र इसमें कुछ सामान्य हो जाता है।
