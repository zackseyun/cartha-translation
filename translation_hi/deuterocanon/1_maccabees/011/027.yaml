    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήρισεν
  choice: पुष्टि की
  rationale: राजकीय-प्रशासनिक संदर्भ में यह पहले से मिले पद को दृढ़ या आधिकारिक रूप से मान्य करने का भाव देता है, न कि पहली बार नियुक्त करने का।
- source_word: ἀρχιερωσύνην
  choice: महायाजक-पद
  rationale: यह संज्ञा महायाजक के पद और गरिमा को दर्शाती है; आधुनिक हिन्दी में ‘महायाजक-पद’ स्पष्ट और स्वाभाविक है।
- source_word: τίμια
  choice: सम्मानों
  rationale: यहाँ विशेषण संज्ञा के रूप में प्रयुक्त होकर सम्मानजनक अधिकारों या प्रतिष्ठाओं को सूचित करता है; राजकीय कृपा के संदर्भ में ‘सम्मान’ भौतिक ‘बहुमूल्य वस्तुओं’ से अधिक उपयुक्त है।
- source_word: τὸ πρότερον
  choice: पहले
  rationale: यह योनातान को पूर्व में प्राप्त सम्मानों की ओर संकेत करने वाला स्वाभाविक कालवाचक प्रयोग है।
- source_word: τῶν πρώτων φίλων
  choice: ‘प्रथम मित्रों’ में
  rationale: यह संभवतः सेल्यूकिड राजदरबार का औपचारिक पदनाम है। अपेक्षाकृत शाब्दिक अनुवाद उस तकनीकी स्वरूप को सुरक्षित रखता है।
- source_word: ἡγεῖσθαι
  choice: गिने जाने का दर्जा दिया
  rationale: इस रचना में क्रिया किसी व्यक्ति को एक विशिष्ट वर्ग का सदस्य मानने या उस श्रेणी में स्थान देने का भाव व्यक्त करती है; चुना हुआ रूप नियुक्ति और प्रतिष्ठा दोनों को स्पष्ट करता है।
