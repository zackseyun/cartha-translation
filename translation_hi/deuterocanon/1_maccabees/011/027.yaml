  terminology: “महायाजक-पद” is appropriate. Retaining ‘प्रथम मित्रों’ in quotation marks appropriately signals a technical title; the footnote supplies the more idiomatic alternative ‘प्रधान मित्रों’ and necessary historical clarification without overstating certainty.
