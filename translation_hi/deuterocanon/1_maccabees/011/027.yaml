    issue: “गिने जाने का दर्जा दिया” is overly periphrastic.
    rationale: ἡγεῖσθαι in this construction concerns placement or rank within a class. “प्रथम मित्रों में स्थान दिया” is idiomatic Hindi and preserves the formal-status sense.
