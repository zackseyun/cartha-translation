lexical_decisions:
- source_word: ἔλαβεν
  choice: अपने अधिकार में ले लिया
  rationale: λαμβάνω के एओरिस्ट रूप का यहाँ सैन्य-राजनीतिक प्रसंग में अर्थ किसी वस्तु या सैन्य संसाधन को अपने कब्ज़े अथवा अधिकार में लेना है। यह हिन्दी में केवल ‘ले लिया’ की अपेक्षा आशय अधिक स्पष्ट करता है, पर ‘पकड़ लिया’ जैसी अनावश्यक व्याख्यात्मक तीव्रता से बचता है।
- source_word: Τρύφων
  choice: त्रूफ़ोन
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: τὰ θηρία
  choice: हाथियों
  rationale: शाब्दिक अर्थ ‘पशु’ है, किन्तु प्रथम मकाबियों के हेलेनिस्टिक सैन्य प्रसंग में यह पद युद्ध-हाथियों को सूचित करता है। मुख्य पाठ में अभिप्रेत वस्तु स्पष्ट की गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: κατεκράτησεν
  choice: नियंत्रण कर लिया
  rationale: κατακρατέω के साथ Ἀντιοχίας संबंधकारक में है और यहाँ नगर पर प्रभुत्व या नियंत्रण स्थापित करने का भाव देता है। ‘नियंत्रण कर लिया’ स्वाभाविक आधुनिक हिन्दी है और किसी विशिष्ट आक्रमण-विधि को अनावश्यक रूप से नहीं जोड़ता।
- source_word: Ἀντιοχίας
  choice: अन्ताकिया
  rationale: प्राचीन नगर Antioch के लिए प्रचलित हिन्दी बाइबलीय नाम अपनाया गया है; यूनानी में यह κατακρατέω के बाद संबंधकारक रूप में है।
