base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/023.yaml
  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: hi
  text: पर जब योनातान ने यह सुना, तो उसने आज्ञा दी कि उन्हें चारों ओर से घेर लिया जाए। फिर उसने इस्राएल के पुरनियों और याजकों में से कुछ को चुना और अपने आपको खतरे में डाल दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “और उसने उसे खतरे के हवाले कर दिया।” यह कथन असहज है; सम्भवतः आशय यह है कि योनातान ने अपने आपको खतरे में डाल दिया।'
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: उन्हें चारों ओर से घेर लिया जाए
  rationale: सैन्य प्रसंग में क्रिया का अर्थ विरोधी पक्ष को चारों ओर से घेरना या घेराबंदी में लेना है। कर्मवाच्य रचना यूनानी की संक्षिप्त अभिव्यक्ति और उपलब्ध परामर्श-पाठ के अर्थ को बनाए रखती है, जबकि ‘घेराबंदी करना’ से अधिक विशिष्ट अर्थ नहीं थोपती।
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: यह क्रिया के सामान्य अर्थ को सीधे और स्वाभाविक कथात्मक हिन्दी में व्यक्त करता है।
- source_word: τῶν πρεσβυτέρων Ἰσραὴλ
  choice: इस्राएल के पुरनियों ... में से कुछ को
  rationale: ἐπέλεξεν के बाद संबंधकारक रूप अंशवाचक है; आशय सभी पुरनियों से नहीं, बल्कि उनमें से कुछ के चयन से है। ‘पुरनिये’ बाइबिलीय पद को गरिमापूर्ण और परिचित हिन्दी में व्यक्त करता है।
- source_word: τῶν ἱερέων
  choice: याजकों में से कुछ को
  rationale: पुरनियों की तरह यहाँ भी संबंधकारक अंशवाचक है, इसलिए ‘में से कुछ’ मूल अर्थ को स्पष्ट करता है।
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: अपने आपको खतरे में डाल दिया
  rationale: प्राप्त यूनानी में शाब्दिक रूप से ‘उसे खतरे को दे दिया’ है, पर एकवचन सर्वनाम का संदर्भ असहज है। कथानक में कर्ता योनातान है, इसलिए संभावित मुहावरेदार आशय उसके स्वयं खतरा उठाने का है; मूल कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ἔδωκεν αὐτὸν τῷ κινδύνῳ में सर्वनाम का असहज संदर्भ
  choice: योनातान के स्वयं खतरे में पड़ने के अर्थ में ‘अपने आपको खतरे में डाल दिया’
  alternative: ‘उसे खतरे में डाल दिया’ अथवा ‘अपने आपको खतरे के हवाले कर दिया’
  rationale: यह सिद्धान्तगत नहीं, पाठ-व्याख्यात्मक कठिनाई है। αὐτόν को यंत्रवत् ‘उसे’ कहने पर स्पष्ट पूर्वपद नहीं मिलता। प्रसंग में योनातान लगातार कर्ता है, इसलिए आत्म-संकट का अर्थ सबसे संगत है; फिर भी शाब्दिक कठिनाई पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पुरनियों’ और ‘याजकों’ जैसे परिचित बाइबिलीय पदों को बनाए रखते हुए वाक्यरचना सामान्य पाठक के लिए स्वाभाविक रखी गई है।
