  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: hi
  text: और गाज़ा के लोगों ने योनातान से अनुकूल शर्तें माँगीं, और उसने उन्हें आश्वासन दिया[b]। फिर उसने उनके शासकों के पुत्रों को बंधक बना लिया और उन्हें यरूशलेम भेज दिया[a]। इसके बाद वह उस प्रदेश से होकर दमिश्क तक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “यरूशलेम” के बाद अलग से “असालीम” (Ἀσαλήμ) शब्द भी आता है। वह वाक्य में सहज रूप से नहीं जुड़ता; सम्भव है कि यह पाठ-विकृति या यहाँ आ पड़ा कोई स्थान-नाम हो।
    reason: textual_variant
  - marker: b
    text: शाब्दिक अर्थ, “उसने उन्हें दाहिने हाथ दिए”; यह सद्भाव या विश्वास की प्रतिज्ञा देने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: अनुकूल शर्तों की विनती की
  rationale: क्रियापद का मूल अर्थ अनुरोध या विनती करना है; सैन्य-राजनीतिक प्रसंग में यह अनुकूल समझौते की शर्तें माँगने का भाव देता है, पर स्पष्ट रूप से 'शांति की याचना' जोड़ना उचित नहीं।
- source_word: οἱ ἀπὸ Γάζης
  choice: गाज़ा के लोग
  rationale: शाब्दिक अर्थ 'गाज़ा से आए/गाज़ा के लोग' है। हिन्दी में यह स्वाभाविक है और नगर के प्रतिनिधियों अथवा निवासियों—दोनों की सम्भावना खुली रखता है।
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: उसने उन्हें वचन दिया
  rationale: शाब्दिक रूप से 'उसने उन्हें दाहिने हाथ दिए' है, जो सद्भाव अथवा समझौते की प्रतिज्ञा देने का मुहावरा है। 'वचन दिया' आधुनिक हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: उनके शासकों के पुत्रों
  rationale: ἀρχόντων राजनीतिक अधिकार रखने वालों को दर्शाता है; 'शासकों' औपचारिक और प्रसंगानुकूल है।
- source_word: εἰς ὅμηρα
  choice: बंधक
  rationale: यह पुत्रों को लिए जाने का प्रयोजन बताता है; 'बंधक' स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: διῆλθεν τὴν χώραν
  choice: उस प्रदेश से होकर गया
  rationale: χώρα यहाँ आसपास के भूभाग या क्षेत्र को सूचित करता है। 'प्रदेश' आधुनिक हिन्दी में 'देश' की अपेक्षा अधिक प्रसंगानुकूल है।
- source_word: ἕως Δαμασκοῦ
  choice: दमिश्क तक
  rationale: स्थानवाचक ἕως का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἀσαλήμ
  choice: मुख्य पाठ में नहीं रखा; पाद-टिप्पणी में 'असालीम'
  rationale: यह शब्द 'यरूशलेम' के बाद अलग-थलग है और वाक्य-विन्यास में नहीं बैठता। सम्भवतः पाठ-विकृति अथवा भटका हुआ स्थान-नाम है; साक्ष्य को छिपाए बिना पठनीयता बनाए रखने हेतु इसे पाद-टिप्पणी में दर्ज किया गया है।
