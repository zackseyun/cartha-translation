    text: शाब्दिक अर्थ, “हमें दाहिने हाथ दो।” दाहिना हाथ देना शांति, संधि या सद्भाव की प्रतिज्ञा करने का मुहावरा था।
    reason: cultural_note
lexical_decisions:
- source_word: Δὸς
  choice: दो
  rationale: δίδωμι का एओरिस्ट आज्ञार्थक रूप है; यहाँ सीधा अनुरोध है, जिसके लिए सरल आधुनिक हिन्दी में ‘दो’ स्वाभाविक है।
- source_word: δεξιάς
  choice: अपने दाहिने हाथ
  rationale: बहुवचन संज्ञा के ठोस बिंब को बनाए रखा गया है। हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपने’ जोड़ा गया है; मुहावरे का आशय पाद-टिप्पणी में बताया गया है।
- source_word: παυσάσθωσαν
  choice: बंद कर दें
  rationale: तीसरे पुरुष का एओरिस्ट आज्ञार्थक रूप किसी कार्य को रोकने की माँग व्यक्त करता है; ‘बंद कर दें’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πολεμοῦντες
  choice: के विरुद्ध लड़ना
  rationale: वर्तमान कृदंत जारी शत्रुतापूर्ण कार्रवाई दर्शाता है; ‘के विरुद्ध लड़ना’ उसके निरंतर और विरोधात्मक भाव को सुरक्षित रखता है।
- source_word: τὴν πόλιν
  choice: नगर
  rationale: यूनानी में निश्चित उपपद है, पर स्वामित्वसूचक शब्द नहीं। इसलिए ‘हमारे नगर’ जोड़ने के बजाय केवल ‘नगर’ रखा गया है।
