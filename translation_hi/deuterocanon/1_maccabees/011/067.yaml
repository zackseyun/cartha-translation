lexical_decisions:
- source_word: παρεμβολὴ
  choice: छावनी
  rationale: सैनिक प्रसंग में यह शब्द पड़ाव डाले हुए सैन्य दल या उसके शिविर को सूचित कर सकता है। ‘छावनी’ इस सामूहिक और सैन्य भाव को बनाए रखता है।
- source_word: παρενέβαλον
  choice: पड़ाव डाला
  rationale: क्रिया का सीधा अर्थ शिविर लगाना या पड़ाव डालना है; आधुनिक हिन्दी में ‘पड़ाव डाला’ यहाँ स्वाभाविक है।
- source_word: ἐπὶ τὸ ὕδωρ
  choice: जल के किनारे
  rationale: पड़ाव डालने के प्रसंग में यह जलाशय के पास की स्थिति बताता है। ‘जल के किनारे’ हिन्दी में स्वाभाविक है और ‘जल पर’ जैसे भ्रामक शाब्दिक अनुवाद से बचता है।
- source_word: τοῦ Γεννησάρ
  choice: गन्नेसार
  rationale: यह रूप यूनानी Γεννησάρ का निकट देवनागरी लिप्यंतरण है; इसे अधिक परिचित ‘गन्नेसरत’ से मिलाकर नहीं बदला गया।
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: सुबह तड़के उठे
  rationale: ὤρθρισαν के जल्दी उठने और τὸ πρωὶ के सुबह के समय—दोनों भावों को स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: नासोर के मैदान की ओर चले
  rationale: εἰς गंतव्य की ओर गति सूचित करता है। यूनानी में अलग से ‘चलना’ क्रिया नहीं है, पर हिन्दी में आशय को स्वाभाविक और पूर्ण बनाने के लिए ‘चले’ जोड़ा गया है; इसे पादटिप्पणी में स्पष्ट किया गया है।
