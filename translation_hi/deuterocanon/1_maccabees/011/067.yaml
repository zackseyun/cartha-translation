    text: शाब्दिक रूप से यूनानी वाक्य में ‘चले’ के लिए अलग क्रिया नहीं है; उसका ढाँचा है, ‘सुबह तड़के उठे, नासोर के मैदान की ओर।’ गंतव्यसूचक शब्द से वहाँ जाने की गति का भाव निहित है।
    reason: lexical_alternative
