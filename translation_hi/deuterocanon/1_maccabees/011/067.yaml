  text: और योनातान और उसकी छावनी ने गेन्नेसार[b] के जल के किनारे पड़ाव डाला। वे सुबह तड़के उठे और नासोर के मैदान की ओर चले।[a]
  philosophy: optimal-equivalence
  footnotes:
