base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: hi
  text: उसने राजा देमेत्रियुस के पास राजदूत भेजे और कहा, “आओ, हम आपस में एक वाचा[a] बाँधें। मैं तुम्हें अपनी बेटी दूँगा, जो सिकन्दर के पास है[b], और तुम अपने पिता के राज्य पर राज करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम आपस में एक संधि करें।” यूनानी में διαθήκη शब्द है, जो औपचारिक समझौते के लिए प्रयुक्त होता है और प्रायः “वाचा” अनूदित किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “मेरी बेटी, जिसे सिकन्दर रखता है।” संदर्भ में यह उस बेटी की ओर संकेत करता है जो उस समय सिकन्दर की पत्नी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजकर
  rationale: यूनानी कथात्मक क्रिया का स्वाभाविक हिन्दी रूप; अगली क्रिया ‘कहा’ से सहज संबंध बनाता है।
- source_word: πρέσβεις
  choice: राजदूत
  rationale: यहाँ साधारण संदेशवाहक नहीं, बल्कि आधिकारिक कूटनीतिक प्रतिनिधि अभिप्रेत हैं।
- source_word: συνθώμεθα ... διαθήκην
  choice: हम ... एक वाचा बाँधें
  rationale: यह पदबंध औपचारिक समझौता करने को दर्शाता है। ‘वाचा’ διαθήκη का भार बनाए रखती है, जबकि ‘बाँधें’ आधुनिक हिन्दी में वाचा स्थापित करने का स्वाभाविक प्रयोग है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: पारस्परिक अर्थ को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: मैं तुम्हें अपनी बेटी दूँगा
  rationale: विवाह-संधि की प्रत्यक्ष और लेन-देनपरक भाषा को बिना नरम किए सुरक्षित रखता है।
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: जिसे सिकन्दर ने अपने पास रखा है
  rationale: ἔχει के ‘अपने पास होने/रखने’ के अर्थ को बनाए रखता है और मुख्य पाठ में उसे स्पष्ट रूप से ‘पत्नी’ कहकर मूल से अधिक निश्चित नहीं बनाता।
- source_word: βασιλεύσεις
  choice: तुम ... राज करोगे
  rationale: भविष्यकालीन राजकीय क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς βασιλείας τοῦ πατρός σου
  choice: अपने पिता के राज्य पर
  rationale: βασιλεύω के साथ संबंध को हिन्दी में ‘राज्य पर राज करना’ द्वारा स्पष्ट करता है; βασιλεία यहाँ राज्य-क्षेत्र है।
