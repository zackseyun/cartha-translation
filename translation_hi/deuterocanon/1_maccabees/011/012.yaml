lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: उसने सिकंदर से अपनी बेटी को वापस लेकर
  rationale: ἀφαιρέω का मध्यम कृदंत पहले घटित क्रिया और किसी व्यक्ति से कुछ ले लिए जाने का भाव व्यक्त करता है। संदर्भ में बेटी राजा की अपनी बेटी है और αὐτοῦ उस व्यक्ति, अर्थात् सिकंदर, को सूचित करता है जिससे उसे वापस लिया गया। हिंदी में दोनों संबंध स्पष्ट करना स्वाभाविक है।
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: देमेत्रियुस को दे दिया
  rationale: यूनानी पाठ में सामान्य क्रिया ‘दिया’ है। संदर्भ विवाह का है, पर इस पद में ‘विवाह में’ स्पष्ट रूप से नहीं कहा गया, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: सिकंदर के तेवर बदल गए
  rationale: शाब्दिक अर्थ ‘सिकंदर का चेहरा बदल गया’ है। आधुनिक हिंदी में ‘तेवर बदल गए’ चेहरे पर प्रकट भाव और मनोवृत्ति में आए बदलाव—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐφάνη ἡ ἔχθρα αὐτῶν
  choice: उन दोनों की दुश्मनी खुलकर सामने आ गई
  rationale: ἐφάνη यहाँ पहले से मौजूद शत्रुता के प्रत्यक्ष या स्पष्ट हो जाने का संकेत देता है। ‘खुलकर सामने आ गई’ इस उभरती हुई स्पष्टता को सहज हिंदी में व्यक्त करता है।
