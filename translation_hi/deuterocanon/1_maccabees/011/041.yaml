base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/041.yaml
  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: hi
  text: और योनातान ने राजा देमेत्रियुस के पास यह संदेश भेजा कि वह गढ़[a] में रहने वालों को यरूशलेम से और किलाबंद स्थानों में रहने वालों को निकाल दे, क्योंकि वे इस्राएल के विरुद्ध युद्ध कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गढ़” से विशेष रूप से यरूशलेम में स्थित सेल्यूसिड गढ़ ‘अक्रा’ का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν ... πρὸς
  choice: के पास संदेश भेजकर कहा
  rationale: संदर्भ में भेजने का उद्देश्य एक निवेदन पहुँचाना है; यह प्रयोग हिन्दी में स्वाभाविक है और ἵνα से व्यक्त अनुरोध को स्पष्ट रखता है।
- source_word: πρὸς Δημήτριον τὸν βασιλέα
  choice: राजा देमेत्रियुस के पास
  rationale: हिन्दी की स्वाभाविक पदवी-नाम क्रमावली अपनाते हुए यूनानी के संबोधन का अर्थ सुरक्षित रखा गया है।
- source_word: ἵνα ἐκβάλῃ
  choice: कि वह ... निकाल दे
  rationale: ἐκβάλλω यहाँ बलपूर्वक स्थान से हटाने या बाहर करने को सूचित करता है; ‘निकाल दे’ वर्तमान हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: गढ़ में रहनेवालों को
  rationale: ἄκρα यरूशलेम के विशिष्ट किलाबंद गढ़ को दर्शाता है। ‘गढ़’ संक्षिप्त और सामान्य पाठक के लिए बोधगम्य है; विशिष्ट ऐतिहासिक पहचान पाद-टिप्पणी में दी गई है।
- source_word: ἐξ Ἱερουσαλήμ
  choice: यरूशलेम से
  rationale: ἐκβάλῃ के साथ ‘से ... निकाल दे’ हिन्दी में बाहर निकाले जाने की दिशा स्पष्ट करता है।
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: किलाबंद स्थानों में रहनेवालों को
  rationale: ὀχυρώματα बहुवचन में सामान्यतः दृढ़ किए हुए स्थान हैं; यह अनुवाद उन्हें अनावश्यक रूप से स्वतंत्र ‘किलों’ तक सीमित नहीं करता।
- source_word: ἦσαν γὰρ πολεμοῦντες
  choice: क्योंकि वे ... युद्ध कर रहे थे
  rationale: परिप्रयुक्त यूनानी रचना जारी संगठित शत्रुता व्यक्त करती है; ‘युद्ध कर रहे थे’ उसकी कालगत निरंतरता और सैन्य अर्थ दोनों रखता है।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल के विरुद्ध
  rationale: πολεμέω के साथ कर्मकारक यहाँ विरोधी पक्ष को दर्शाता है; ‘के विरुद्ध’ इसे स्पष्ट और स्वाभाविक बनाता है।
