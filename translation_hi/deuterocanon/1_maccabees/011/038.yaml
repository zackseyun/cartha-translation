base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: hi
  text: और राजा देमेत्रियुस ने देखा कि देश उसके सामने शांत हो गया था और कोई उसके विरोध में खड़ा नहीं था। इसलिए उसने अपनी सारी सेनाओं को, हर एक को उसके अपने स्थान पर, विदा कर दिया; केवल उन विदेशी सैनिक-दलों[a] को छोड़कर जिन्हें उसने राष्ट्रों के द्वीपों से भर्ती किया था। तब उसके पुरखों से मिली सारी सेनाएँ उससे शत्रुता करने लगीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विदेशी सैनिक-दल” का अनुवाद “भाड़े के सैनिक-दल” भी हो सकता है। यूनानी शब्द गैर-देशी सैनिकों को सूचित करता है और संभवतः वेतन पर रखे गए विदेशी सैनिकों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके पुरखों से मिली सारी सेनाएँ” से संभवतः वे परंपरागत सैनिक-दल अभिप्रेत हैं जो उसके पूर्वजों के शासन से जुड़े या उनसे विरासत में मिले थे; ये उन विदेशी सैनिक-दलों से अलग थे जिन्हें उसने अपने पास रखा।
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: देश उसके सामने शांत हो गया है
  rationale: राजनीतिक और सैनिक शांति का भाव रखता है; ‘उसके सामने’ यूनानी मुहावरे को सुरक्षित रखता है और इसे पूर्ण शांति या समृद्धि नहीं बनाता।
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: कोई उसका विरोध नहीं कर रहा है
  rationale: यूनानी नपुंसकलिंग ‘कुछ भी नहीं’ को स्वाभाविक हिन्दी में व्यक्त करते हुए जारी प्रतिरोध के अभाव का भाव रखा गया है।
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: अपनी सारी सेनाओं को विदा कर दिया
  rationale: सैनिक प्रसंग में ἀπέλυσεν का अर्थ सेवा से भेज देना है; ‘भंग कर दिया’ की अपेक्षा ‘विदा कर दिया’ कम व्याख्यात्मक है।
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: हर एक को उसके अपने स्थान पर
  rationale: वितरणात्मक एकवचन और τόπος की व्यापकता सुरक्षित है; इसे अनिवार्यतः ‘घर’ या ‘प्रदेश’ नहीं बनाया गया।
- source_word: ξένων δυνάμεων
  choice: विदेशी सेनाएँ
  rationale: ξένος गैर-देशी सैनिकों को सूचित करता है और भाड़े के सैनिकों का अर्थ संभव है, पर मुख्य पाठ में उसे अनिवार्य नहीं किया गया।
- source_word: ἐξενολόγησεν
  choice: भरती किया था
  rationale: विदेशियों को सैनिक सेवा के लिए जुटाने का अर्थ देता है, बिना यह निश्चित किए कि वे वेतनभोगी भाड़े के सैनिक ही थे।
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: अन्यजातियों के द्वीपों से
  rationale: शाब्दिक संरचना ‘जातियों/अन्यजातियों के द्वीप’ को बनाए रखता है; यहाँ ἔθνη विदेशी गैर-यहूदी जनसमूहों को सूचित करता है।
- source_word: ἠχθρασαν αὐτῷ
  choice: उससे बैर रखने लगीं
  rationale: शत्रुता आरम्भ होने या उभरने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: उसके पुरखों के समय से चली आ रही सारी सेनाएँ
  rationale: संक्षिप्त यूनानी पदबंध को वंशगत शासन से जुड़ी परंपरागत सेनाओं के रूप में व्यक्त करता है, और तत्काल उल्लिखित विदेशी सेनाओं से उसका अंतर स्पष्ट रखता है।
