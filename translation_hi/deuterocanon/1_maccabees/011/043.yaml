  text: इसलिए अब तुम हमारे पास ऐसे पुरुष भेजकर अच्छा करोगे जो मेरे साथ मिलकर युद्ध करें,[a] क्योंकि मेरी सारी सेनाएँ मेरा साथ छोड़ गई हैं।
