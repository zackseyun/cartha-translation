lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदबंध पिछले कथन से निष्कर्ष निकालते हुए वर्तमान आग्रह की ओर संक्रमण करता है; ‘इसलिए अब’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ὀρθῶς ποιήσεις
  choice: अच्छा करोगे
  rationale: यह मुहावरा प्रस्तावित कार्य की सराहना और विनम्र आग्रह व्यक्त करता है; ‘अच्छा करोगे’ आधुनिक हिन्दी में उसी पत्रात्मक भाव को सहजता से प्रकट करता है।
- source_word: ἀποστείλας ἡμῖν
  choice: हमारे पास ... भेजकर
  rationale: कृदन्त उस कार्य को बताता है जिसके द्वारा संबोधित व्यक्ति ‘अच्छा करेगा’, और सम्प्रदान ἡμῖν का अर्थ यहाँ ‘हमारे पास’ है।
- source_word: ἄνδρας
  choice: पुरुष
  rationale: यूनानी में सामान्य शब्द ‘पुरुष’ है, कोई विशिष्ट सैन्य पद नहीं; उनका सैन्य कार्य अगले उपवाक्य से स्पष्ट होता है।
- source_word: οἳ συμμαχήσουσίν μοι
  choice: जो मेरे साथ मिलकर युद्ध करें
  rationale: क्रिया का अर्थ सहयोगी बनकर युद्ध करना है; यह चयन केवल सामान्य सहायता के बजाय उसके सैन्य आशय को व्यक्त करता है।
- source_word: ἀπέστησαν
  choice: मेरा साथ छोड़ गई हैं
  rationale: सैन्य संदर्भ में क्रिया का आशय वक्ता से अलग हो जाने या उसे छोड़ देने का है; यह हिन्दी अभिव्यक्ति संभावित विद्रोह की अनावश्यक विशिष्टता जोड़े बिना उस व्यावहारिक परिणाम को बताती है।
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: मेरी सारी सेनाएँ
  rationale: δυνάμεις यहाँ सैन्य बलों को सूचित करता है। ‘सेनाएँ’ साधारण पाठक के लिए स्पष्ट है और बहुवचन को बनाए रखता है।
