lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: मुझे…पछतावा है
  rationale: पूर्णकालिक मध्यम रूप बीते हुए कार्य पर वर्तमान पछतावा व्यक्त करता है। यह राजनीतिक संदर्भ में स्वाभाविक है और ‘मन फिराना’ या धार्मिक अर्थ वाला ‘पश्चात्ताप करना’ अनावश्यक रूप से नहीं जोड़ता।
- source_word: δοὺς
  choice: देने का
  rationale: भूतकालिक कृदंत पछतावे के कारण बने पूर्ण कार्य को बताता है; हिंदी में ‘देने का पछतावा’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν θυγατέρα μου
  choice: अपनी बेटी
  rationale: कर्ता के संदर्भ में हिंदी का ‘अपनी’ स्वाभाविक रूप से ‘मेरी’ बेटी का अर्थ देता है और संबंध को स्पष्ट रखता है।
- source_word: ἐζήτησεν
  choice: कोशिश की थी
  rationale: ζητέω के साथ अनंत क्रिया ‘चाहना/ढूँढ़ना’ से आगे बढ़कर प्रयास करना भी व्यक्त कर सकती है। ‘कोशिश की थी’ आधुनिक हिंदी में सहज है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀποκτεῖναί
  choice: मार डालने
  rationale: यह इच्छित कार्य को सीधे और तटस्थ रूप में व्यक्त करता है; ‘हत्या करने’ से आने वाला अतिरिक्त विधिक या नैतिक संकेत नहीं जोड़ता।
