base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: hi
  text: इसलिए हमने उनके लिए यहूदिया की सीमाएँ और तीन ज़िले[a]—अफैरेमा, लुद्दा और रामथैम—जो सामरिया से यहूदिया में मिला दिए गए थे, तथा इनसे संबद्ध सब कुछ[b], उन सभी के लिए निश्चित कर दिया है जो यरूशलेम में बलिदान चढ़ाते हैं। यह उन राजकीय करों के बदले है, जिन्हें राजा पहले उनसे हर वर्ष भूमि की उपज और वृक्षों की उपज[c] में से लिया करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द νομοὺς प्रशासनिक ज़िलों को दर्शाता है; पुराने विद्वतापूर्ण साहित्य में कभी-कभी इन्हें ‘नोम’ कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘इनसे संबद्ध सब कुछ’ का यूनानी पद व्यापक है; इसमें इन तीन ज़िलों से जुड़े आश्रित गाँव, भूमियाँ या अन्य संपत्तियाँ सम्मिलित हो सकती हैं।
    reason: lexical_ambiguity
  - marker: c
    text: अर्थात वृक्षों से मिलने वाली उपज; यूनानी शब्द में फल और मेवे दोनों सम्मिलित हो सकते हैं।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: स्थिर कर दिए हैं
  rationale: पूर्णकालिक रूप यहाँ किसी प्रशासनिक व्यवस्था को प्रभावी रूप से स्थापित या पुष्ट करने का भाव देता है; ‘स्थिर कर दिए हैं’ राजकीय आदेश के संदर्भ में स्वाभाविक है।
- source_word: τὰ ὅρια
  choice: सीमाएँ
  rationale: राजनीतिक-भौगोलिक संदर्भ में ὅρια का सीधा और स्वाभाविक अर्थ ‘सीमाएँ’ है।
- source_word: τοὺς τρεῖς νομοὺς
  choice: तीन ज़िले
  rationale: हेलेनिस्टिक प्रशासन में νομός एक प्रशासनिक क्षेत्र या ज़िला था; ‘ज़िले’ आधुनिक पाठक के लिए स्पष्ट है और तकनीकी ‘नोम’ से अधिक सहज है।
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: अफैरेमा, लुद्दा और रामथैम
  rationale: स्थान-नामों को यूनानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: ये सामरिया से यहूदिया में मिला दिए गए थे
  rationale: निष्क्रिय क्रिया प्रशासनिक हस्तांतरण या जोड़ को व्यक्त करती है; यह अनुवाद उसके राजनीतिक ढंग को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: उनसे संबद्ध सब कुछ
  rationale: यूनानी पद व्यापक है और आश्रित गाँवों, भूमियों या अन्य संबद्ध संपत्तियों को समेट सकता है; ‘सब कुछ’ उसकी व्यापकता और अस्पष्टता बनाए रखता है।
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: उन सभी के लिए है जो यरूशलेम में बलिदान चढ़ाते हैं
  rationale: θυσιάζω विशेष रूप से बलिदान चढ़ाने को व्यक्त करता है, केवल सामान्य आराधना को नहीं; दत्तिव पद को अनुदान के लाभार्थियों के रूप में रखा गया है।
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: राजकीय कर के बदले
  rationale: τὰ βασιλικά राजकीय देयों या राजस्व को दर्शाता है; आगे की वसूली-संबंधी भाषा के कारण ‘राजकीय कर’ स्पष्ट और स्वाभाविक है।
- source_word: τῶν γενημάτων τῆς γῆς
  choice: भूमि की उपज
  rationale: γενήματα भूमि से होने वाली कृषि-उपज को व्यापक रूप में दर्शाता है।
- source_word: τῶν ἀκροδρύων
  choice: वृक्षों की उपज
  rationale: ἀκρόδρυα वृक्षों से मिलने वाली उपज, विशेषतः फल या मेवे, को दर्शा सकता है; यह चयन उस व्यापकता को बनाए रखता है।
