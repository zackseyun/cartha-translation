  to: जो लोग उसके पास से भाग गए थे, उन्होंने देखा[a] और उसके पास लौट आए। फिर वे उसके साथ पीछा करते हुए कादेश तक, उनकी छावनी तक गए और वहीं छावनी डाली।
  rationale: 'The revision makes only source-sensitive and stylistic adjustments: it leaves the object of ‘देखा’ unstated as in Greek, avoids making ‘from him’ explicitly mean abandonment, improves the Hindi flow of the pursuit clause, and uses a military expression for encamping. The ambiguity of ‘उनकी’ remains in both text and note.'
