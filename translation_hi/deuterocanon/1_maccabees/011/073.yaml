  choice: जो लोग उसे छोड़कर भाग गए थे
  rationale: यह पदबंध पहले घट चुकी भगदड़ और उस व्यक्ति से अलग हो जाने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἴδον
  choice: उन्होंने यह देखा
  rationale: यूनानी में कर्म अनकहा है; हिन्दी में ‘यह’ पिछले घटनाक्रम की ओर सामान्य संकेत करता है, बिना उसे अधिक स्पष्ट करके अर्थ सीमित किए।
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: उसके पास लौट आए
  rationale: यह उनकी पहले की भगदड़ के उलटकर फिर उस व्यक्ति के साथ आ मिलने को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: वे उसके साथ ... पीछा करते गए
  rationale: ‘पीछा करते गए’ अपूर्णकालीन क्रिया की जारी कार्रवाई को व्यक्त करता है और ‘उसके साथ’ सहभागिता बनाए रखता है।
- source_word: ἕως Κάδης
  choice: कादेश तक
  rationale: ἕως पीछा किए जाने की भौगोलिक सीमा बताता है; Κάδης का मानक देवनागरी लिप्यंतरण ‘कादेश’ रखा गया है।
- source_word: ἕως τῆς παρεμβολῆς αὐτῶν
  choice: उनकी छावनी तक
  rationale: सैन्य प्रसंग में παρεμβολή के लिए ‘छावनी’ उपयुक्त है। αὐτῶν का अस्पष्ट सर्वनाम ‘उनकी’ के रूप में सुरक्षित रखा गया है।
- source_word: παρενέβαλον ἐκεῖ
  choice: वहीं डेरा डाला
  rationale: यह सैन्य शिविर लगाने की क्रिया को आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
