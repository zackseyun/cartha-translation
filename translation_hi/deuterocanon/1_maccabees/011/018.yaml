base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/018.yaml
  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: hi
  text: और राजा टॉलेमी तीसरे दिन मर गया। उसके गढ़ों में जो लोग थे, वे गढ़ों में रहनेवालों के हाथों नष्ट कर दिए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ दोनों उपवाक्यों में “गढ़ों में” दोहराता है। पहले उपवाक्य में गढ़ टॉलेमी के बताए गए हैं, जबकि दूसरे में केवल “गढ़ों में” कहा गया है। दोनों समूहों और उनके स्थानों का ठीक संबंध यूनानी में संक्षिप्त और अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: मर गया
  rationale: यह क्रिया सीधे मृत्यु को व्यक्त करती है; सरल और स्वाभाविक हिन्दी में ‘मर गया’ मूल की स्पष्टता बनाए रखता है।
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है। मूल में संदर्भ-बिंदु स्पष्ट रूप से दोहराया नहीं गया, इसलिए ‘उसके बाद’ नहीं जोड़ा गया।
- source_word: οἱ ὄντες
  choice: जो लोग थे
  rationale: यह अभिव्यक्ति वहाँ उपस्थित व्यक्तियों को सामान्य रूप से बताती है; ‘लोग’ लिंग या अन्य विवरण जोड़े बिना सहज हिन्दी देता है।
- source_word: ὀχυρώμασιν
  choice: गढ़ों
  rationale: यह शब्द किलेबंद स्थानों को सूचित करता है। ‘गढ़’ सैन्य अर्थ रखते हुए सामान्य आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: ἀπώλοντο
  choice: नष्ट कर दिए गए
  rationale: संदर्भ में ὑπό के साथ कर्ता व्यक्त है, इसलिए हिन्दी का कर्मवाच्य उपयुक्त है। यह ‘मार डाले गए’ की अपेक्षा विनाश के व्यापक मूल अर्थ को खुला रखता है।
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: गढ़ों में रहनेवालों के हाथों
  rationale: ὑπό और संबंधकारक कर्तृत्व बताते हैं। ‘के हाथों’ इसे स्पष्ट करता है, जबकि मूल की संक्षिप्त और कुछ अस्पष्ट पुनरावृत्ति बनी रहती है।
