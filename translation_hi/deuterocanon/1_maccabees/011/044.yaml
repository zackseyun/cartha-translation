lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: कथा-वर्णन में किसी को एक स्थान की ओर भेजने के लिए यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἄνδρας τρισχιλίους
  choice: तीन हज़ार पुरुषों
  rationale: ἄνδρας का सीधा अर्थ ‘पुरुष’ है। प्रसंग सैन्य है, पर यूनानी पाठ स्पष्ट रूप से ‘सैनिक’ नहीं कहता।
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: बड़े बलशाली
  rationale: मूल यूनानी की बल और सामर्थ्य पर दी गई जोरदार अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में रखा गया है; अत्यधिक शाब्दिक ‘अपने बल में सामर्थी’ असहज होता।
- source_word: εἰς Ἀντιοχίαν
  choice: अन्ताकिया
  rationale: दिशा बताने वाला भाव हिन्दी की ‘भेजा’ क्रिया और ‘को’ चिह्नित कर्म के साथ स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: वे राजा के पास आए
  rationale: यह राजा की ओर आने की गति को सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: ηὐφράνθη
  choice: आनन्दित हुआ
  rationale: यह क्रिया प्रसन्नता या आनन्द को दर्शाती है; चुना गया रूप गरिमापूर्ण और आधुनिक हिन्दी में सुबोध है।
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: उनके आगमन पर
  rationale: इस प्रसंग में ἔφοδος का सबसे सम्भावित अर्थ उन पुरुषों का राजा के सामने आ पहुँचना है, यद्यपि ‘निकट आना’ भी सम्भव है।
