  text: और योनातान ने तीन हज़ार ऐसे पुरुषों को अन्ताकिया भेजा जो अपनी शक्ति में पराक्रमी थे। वे राजा के पास आए, और उनके आगमन[a] पर राजा आनन्दित हुआ।
