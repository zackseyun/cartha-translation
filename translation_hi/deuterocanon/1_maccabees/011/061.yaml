  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: hi
  text: वह वहाँ से गाज़ा गया, और गाज़ा के लोगों ने उसे भीतर नहीं आने दिया। उसने नगर के चारों ओर पड़ाव डाला[a], उसके बाहरी इलाकों[b] को आग से जला दिया और उन्हें लूट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी घेराबंदी कर दी।” यूनानी में शाब्दिक भाव है कि उसने उसके चारों ओर “पड़ाव डाला” या “बैठ गया।”
    reason: lexical_alternative
  - marker: b
    text: “बाहरी इलाके” के लिए आया यूनानी पद कठिन है; इसका संकेत गाज़ा के आसपास के क्षेत्रों, बाहरी बस्तियों या उपनगरों की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: गया
  rationale: यह गति सूचित करने वाला सामान्य कथात्मक क्रियारूप है; ‘गया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἀπέκλεισαν
  choice: उसे भीतर आने से रोक दिया
  rationale: क्रिया का अर्थ किसी के लिए प्रवेश बंद करना या उसे बाहर रखना है। हिन्दी में यह वाक्यांश बिना किसी अनुल्लिखित ‘द्वार’ को जोड़े अर्थ स्पष्ट करता है।
- source_word: οἱ ἀπὸ Γάζης
  choice: गाज़ा के लोगों
  rationale: शाब्दिक अर्थ ‘गाज़ा से जो थे’ है। प्रसंग में इससे नगर के निवासी अथवा रक्षक अभिप्रेत हैं; ‘लोगों’ अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: नगर के चारों ओर पड़ाव डाल दिया
  rationale: मूल अभिव्यक्ति नगर के चारों ओर बैठने या डेरा डालने का चित्र प्रस्तुत करती है और घेराबंदी का भाव निहित रखती है, पर उसे केवल व्याख्यात्मक ‘घेर लिया’ में नहीं समेटती।
- source_word: τὰ περίπολα αὐτῆς
  choice: उसके बाहरी इलाकों
  rationale: यह कठिन पद संभवतः नगर के आसपास के क्षेत्रों, बाहरी बस्तियों या उपनगरों की ओर संकेत करता है। ‘बाहरी इलाके’ पर्याप्त व्यापक है और अनिश्चितता को बनाए रखता है।
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: आग से जला दिया
  rationale: यूनानी में आग का उल्लेख बलपूर्वक और कुछ पुनरुक्तिपूर्ण है; हिन्दी अभिव्यक्ति उस बल को स्वाभाविक ढंग से रखती है।
- source_word: ἐσκύλευσεν
  choice: लूट लिया
  rationale: यह युद्ध में माल लूटने की सामान्य क्रिया है; ‘लूट लिया’ स्पष्ट, वर्तमान और प्रसंगानुकूल है।
