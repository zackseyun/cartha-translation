  text: और अब से सदा के लिए इनमें से कोई भी बात रद्द नहीं की जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσεται
  choice: रद्द नहीं की जाएगी
  rationale: भविष्यत् कर्मवाच्य रूप यहाँ पहले बताई गई व्यवस्थाओं या रियायतों को अमान्य करने अथवा निरस्त करने का भाव देता है। ‘रद्द नहीं की जाएगी’ आधुनिक हिन्दी में स्पष्ट है और कर्मवाच्य अर्थ को बनाए रखता है।
- source_word: οὐδὲν τούτων
  choice: इनमें से कोई भी बात
  rationale: यह पहले कही गई व्यवस्थाओं की ओर संकेत करता है। यह प्रयोग यूनानी के निषेध और बहुवचन संकेतवाचक के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह समय के आरम्भ-बिंदु को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  choice: सदा तक
  rationale: यह व्यवस्था की निरंतर वैधता और पूरे आगामी समय की व्यापकता को व्यक्त करता है, बिना उसे किसी अतिरिक्त धर्मवैज्ञानिक अर्थ में बदलने के।
