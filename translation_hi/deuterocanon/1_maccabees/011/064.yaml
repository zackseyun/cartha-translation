lexical_decisions:
- source_word: συνήντησεν
  choice: उनसे मिलने गया
  rationale: यह क्रिया केवल मिलने की घटना ही नहीं, बल्कि सामने जाकर मिलने का भाव भी व्यक्त कर सकती है; इसलिए यह अनुवाद उसकी दिशात्मक छाया को बनाए रखता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: यूनानी पाठ में सर्वनाम दत्तिव बहुवचन है, इसलिए बहुवचन ‘उनसे’ रखा गया है।
- source_word: κατέλιπεν
  choice: छोड़ गया
  rationale: क्रिया का सामान्य अर्थ किसी व्यक्ति को किसी स्थान पर छोड़ जाना है; यहाँ ‘छोड़ गया’ स्वाभाविक हिन्दी में वही अर्थ देता है, बिना यह जोड़ने के कि शमौन को औपचारिक रूप से तैनात किया गया था।
- source_word: ἐν τῇ χώρᾳ
  choice: उस प्रदेश में
  rationale: χώρα देश, भूभाग या क्षेत्र को सूचित कर सकता है। सैन्य-भौगोलिक संदर्भ में ‘प्रदेश’ व्यापक भूभाग का स्वाभाविक और तटस्थ बोध देता है।
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: अपने भाई शमौन को
  rationale: यह संबंध और नाम दोनों को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
