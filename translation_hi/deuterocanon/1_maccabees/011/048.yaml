lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: आग लगा दी
  rationale: यह यूनानी क्रिया किसी वस्तु को जला देने के लिए उसमें आग लगाने का बोध कराती है; यह हिन्दी में स्वाभाविक और कारणवाचक अभिव्यक्ति है।
- source_word: τὴν πόλιν
  choice: नगर
  rationale: πόλις का सामान्य अर्थ नगर या शहर है; गरिमापूर्ण कथात्मक शैली में ‘नगर’ सहज है।
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: बहुत-सी लूट ले ली
  rationale: σκῦλα युद्ध में छीनी गई वस्तुओं या लूट को दर्शाता है। ‘बहुत-सी लूट’ बहुवचन-रूप के अर्थ और बड़ी मात्रा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह काल-सूचक पदबंध का सीधा और मुहावरेदार हिन्दी रूप है।
- source_word: ἔσωσαν
  choice: बचा लिया
  rationale: σῴζω यहाँ राजा को तत्काल संकट से सुरक्षित निकालने या बचाने के अर्थ में है; ‘बचा लिया’ पूर्ण हुई कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν βασιλέα
  choice: राजा को
  rationale: निश्चित प्रत्यक्ष कर्म का सीधा हिन्दी अनुवाद।
