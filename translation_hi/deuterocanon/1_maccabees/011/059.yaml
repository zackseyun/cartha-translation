base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
translation:
  language: hi
  text: और उसने अपने भाई शमौन को सोर की सीढ़ी[a] से लेकर मिस्र की सीमाओं तक सेनापति[b] नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सोर की सीढ़ी’ एक स्थान-नाम है। सम्भवतः यह सोर के निकट समुद्रतटीय दर्रे या खड़ी चढ़ाई को दर्शाता है, न कि सचमुच की कोई सीढ़ी।
    reason: cultural_note
  - marker: b
    text: या ‘सैनिक अधिकारी’। यूनानी शब्द στρατηγός सैनिक अगुआ या सेनापति को दर्शाता है; प्रसंग के अनुसार इसके पद का अधिक विशिष्ट अनुवाद भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: नियुक्त किया
  rationale: यह क्रिया किसी व्यक्ति को आधिकारिक पद या दायित्व में ठहराने का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई शमौन को
  rationale: सम्बन्धसूचक वाक्यांश को स्वाभाविक हिन्दी क्रम में रखा गया है और αὐτοῦ का सम्बन्ध वाक्य के कर्ता से स्पष्ट किया गया है।
- source_word: στρατηγὸν
  choice: सेनापति
  rationale: यह शब्द सैनिक नेतृत्व के पद को दर्शाता है। ‘सेनापति’ पद की सैन्य प्रकृति स्पष्ट करता है, पर किसी बाद की निश्चित सैन्य श्रेणी को अनावश्यक रूप से नहीं थोपता।
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: सोर की सीढ़ी से
  rationale: κλίμαξ यहाँ सम्भवतः एक स्थान-नाम है। शाब्दिक रूप को स्थान-नाम के रूप में बनाए रखने से स्रोत की भौगोलिक अभिव्यक्ति सुरक्षित रहती है।
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: मिस्र की सीमाओं तक
  rationale: यह पद उस भूभाग की सीमा बताता है जिस पर शमौन का अधिकार था; बहुवचन ὁρίων को ‘सीमाओं’ से व्यक्त किया गया है।
