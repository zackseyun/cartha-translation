base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: hi
  text: और टॉलेमी अन्ताकिया में प्रवेश किया और उसने एशिया का राजमुकुट[a] पहन लिया। उसने अपने सिर पर दो राजमुकुट पहन लिए—एक एशिया का और दूसरा मिस्र का।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दो मस्तक-पट्ट।” यूनानी में “एशिया का राजमुकुट” और “दो राजमुकुट”—दोनों के लिए एक ही राजकीय शब्द प्रयुक्त हुआ है; ये एशिया और मिस्र के थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: में आया
  rationale: नगर में प्रवेश की सीधी कथात्मक क्रिया है। हिन्दी में व्यक्ति के दृष्टिकोण को अनावश्यक रूप से निश्चित किए बिना ‘में आया’ स्वाभाविक है।
- source_word: περιέθετο
  choice: पहन लिया / पहने
  rationale: मध्यवाच्य रूप अपने ऊपर राजचिह्न धारण करने की ठोस क्रिया बताता है। ‘पहनना’ इसे सहज हिन्दी में सुरक्षित रखता है और केवल ‘राज्याधिकार का दावा किया’ जैसी व्याख्या नहीं जोड़ता।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα राजकीय शिरोभूषण या पट्ट को दर्शाता है। ‘राजमुकुट’ आधुनिक पाठक के लिए स्पष्ट है और सामान्य ‘मुकुट’ की अपेक्षा इसके राजसत्ता-संबंधी अर्थ को बेहतर व्यक्त करता है।
- source_word: τῆς Ἀσίας
  choice: एशिया का
  rationale: यूनानी पाठ केवल ‘एशिया का’ कहता है। ऐतिहासिक आशय को ‘सेल्यूकिड राज्य’ या ‘एशिया माइनर’ बनाकर सीमित नहीं किया गया।
- source_word: δύο διαδήματα
  choice: दो राजमुकुट
  rationale: संख्या और संज्ञा की पुनरावृत्ति को स्पष्ट रखा गया है, क्योंकि दोनों राजसत्ताओं के चिह्न धारण करना कथन का केंद्र है।
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: अपने सिर पर
  rationale: शाब्दिक भाव ‘अपने सिर के चारों ओर’ है, पर शिरोभूषण के लिए स्वाभाविक हिन्दी ‘अपने सिर पर’ है।
theological_decisions:
- issue: दो διάδημα धारण करने का राजकीय प्रतीकवाद
  choice: दो राजमुकुट पहनने की ठोस क्रिया के रूप में अनुवाद
  alternative: ‘एशिया और मिस्र पर शासन का दावा किया’ जैसे व्याख्यात्मक रूप में अनुवाद
  rationale: यूनानी पाठ प्रतीकात्मक राजनीतिक कार्य को ठोस क्रिया द्वारा व्यक्त करता है। अनुवाद उसी चित्र को बनाए रखता है और उसके राजनीतिक निहितार्थ को मुख्य पाठ में समझाकर तनाव समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘अन्ताकिया’, ‘टॉलेमी’ और ‘मिस्र’ प्रचलित हिन्दी नाम हैं। दूसरे वाक्य में ‘एक…और दूसरा…’ से यूनानी के आशय को स्वाभाविक हिन्दी में स्पष्ट किया गया है, बिना राजकीय प्रतीक की व्याख्या मुख्य पाठ में जोड़े।
