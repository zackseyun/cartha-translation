  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: hi
  text: और वह चाँदी, सोना, वस्त्र और बहुत-सी दूसरी भेंटें लेकर पतुलिमैस में राजा के पास गया और राजा की कृपा प्राप्त की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसका अनुग्रह पाया।’ यूनानी मुहावरे का शाब्दिक अर्थ है, ‘उसके सामने अनुग्रह पाया।’
    reason: यूनानी मुहावरे के सहज अर्थ के साथ उसका अधिक शाब्दिक रूप बताने के लिए।
lexical_decisions:
- source_word: λαβὼν
  choice: लेकर
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले की सहगामी क्रिया बताता है। हिन्दी में ‘लेकर … गया’ इस क्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀργύριον καὶ χρυσίον
  choice: चाँदी, सोना
  rationale: दोनों पदार्थ-सूचक शब्द साथ आए हैं; इसलिए ἀργύριον को ‘धन’ के बजाय उसके मूल अर्थ ‘चाँदी’ में रखना अधिक उचित है।
- source_word: ἱματισμόν
  choice: वस्त्र
  rationale: यह कपड़ों या पहनावे के लिए सामूहिक शब्द है। ‘वस्त्र’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: ἕτερα ξένια πλείονα
  choice: बहुत-सी दूसरी भेंटें
  rationale: ξένια आतिथ्य अथवा राजनयिक व्यवहार में दी जाने वाली भेंटों को सूचित करता है। ‘भेंटें’ प्रसंग के अनुकूल है; ‘दूसरी’ ἕτερα और ‘बहुत-सी’ πλείονα का भाव व्यक्त करते हैं।
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: पतुलिमैस में राजा के पास गया
  rationale: यह अनुवाद राजा की ओर जाने और पतुलिमैस में उसके स्थान—दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: उसकी दृष्टि में अनुग्रह पाया
  rationale: यह बाइबलीय मुहावरे की संरचना और अर्थ दोनों सुरक्षित रखता है। सर्वनाम का संकेत राजा की ओर है, पर मूल की शैली बनाए रखने के लिए उसे सर्वनाम ही रखा गया है।
