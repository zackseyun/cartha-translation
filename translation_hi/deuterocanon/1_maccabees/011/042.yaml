base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: hi
  text: और दिमेत्रियुस ने योनातान को संदेश भेजकर कहा, “मैं तुम्हारे और तुम्हारे राष्ट्र के लिए न केवल ये काम करूँगा, बल्कि यदि मुझे उचित अवसर मिला, तो मैं तुम्हें और तुम्हारे राष्ट्र को बहुत सम्मान दूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “सम्मान/महिमा से सम्मानित करूँगा” है; यह बहुत सम्मान देने पर बल देने वाली अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν ... πρὸς Ἰωνάθαν λέγων
  choice: योनातान के पास यह संदेश भेजा
  rationale: संदेश के प्रसंग में ἀποστέλλω और λέγων का संयुक्त भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है; πρός के साथ कर्मकारक संदेश पाने वाले को सूचित करता है।
- source_word: τῷ ἔθνει σου / τὸ ἔθνος σου
  choice: तुम्हारे राष्ट्र / तुम्हारे राष्ट्र को
  rationale: ἔθνος यहाँ यहूदी समुदाय के सामूहिक और राजनीतिक स्वरूप को दर्शाता है; ‘राष्ट्र’ इस अर्थ को ‘लोगों’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: बहुत सम्मान दूँगा
  rationale: सजातीय संज्ञा और क्रिया का यूनानी प्रयोग सम्मान देने की तीव्रता पर बल देता है; हिन्दी में ‘बहुत सम्मान दूँगा’ उसी जोर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: यदि मुझे उचित अवसर मिला
  rationale: τύχω के साथ संबंधकारक का अर्थ अवसर प्राप्त होना है, और εὐκαιρία अनुकूल या उपयुक्त अवसर को दर्शाता है; अनुवाद शर्त और अवसर की अनुकूलता दोनों सुरक्षित रखता है।
