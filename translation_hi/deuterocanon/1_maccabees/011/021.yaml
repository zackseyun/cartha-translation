lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: गए
  rationale: साधारण कथात्मक गमन को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी एओरिस्ट में निहित पूर्ण घटना को अनावश्यक विस्तार के बिना रखता है।
- source_word: τινες
  choice: कुछ
  rationale: अनिश्चित बहुवचन संदर्भ को बनाए रखता है।
- source_word: μισοῦντες τὸ ἔθνος αὐτῶν
  choice: अपने ही लोगों से घृणा करनेवाले
  rationale: ἔθνος यहाँ यहूदी सामुदायिक-जातीय समूह को सूचित करता है। ‘अपने ही लोग’ आधुनिक हिन्दी में स्वाभाविक है और ‘जाति’ से उत्पन्न हो सकनेवाली जाति-व्यवस्था संबंधी गलतफहमी से बचता है।
- source_word: ἄνδρες παράνομοι
  choice: अधर्मी पुरुष
  rationale: παράνομοι के नैतिक और व्यवस्था-विरोधी मूल्यांकन को व्यक्त करता है, मात्र अपराधी या भगोड़े होने का अर्थ नहीं देता।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: राजा तक सूचना पहुँचाने की क्रिया को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περικάθηται
  choice: घेर रहा है
  rationale: किलेबंद स्थान के संदर्भ में चारों ओर डेरा डालकर नाकाबंदी या घेराबंदी करने का सैनिक अर्थ व्यक्त करता है; परोक्ष कथन में यूनानी वर्तमान काल का बल भी बनाए रखता है।
- source_word: τὴν ἄκραν
  choice: गढ़
  rationale: किलेबंद ऊँचे दुर्ग का सामान्य अर्थ स्पष्ट करता है; ऐतिहासिक नाम ‘अकरा’ को पादटिप्पणी में सुरक्षित रखा गया है।
