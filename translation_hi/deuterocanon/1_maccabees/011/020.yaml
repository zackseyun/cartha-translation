base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: hi
  text: उन दिनों योनातान ने यहूदिया के लोगों को यरूशलेम के गढ़[a] के विरुद्ध युद्ध करने के लिए इकट्ठा किया; और उन्होंने उसके विरुद्ध घेराबंदी के बहुत-से यंत्र बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अक्रा,” यरूशलेम में स्थित किलेबंद गढ़।
    reason: ἄκρα का सामान्य अर्थ ‘गढ़’ हो सकता है, पर यहाँ यह यरूशलेम के विशिष्ट सेल्यूसिड गढ़ ‘अक्रा’ का संकेत भी देता है।
lexical_decisions:
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: सैन्य उद्देश्य से लोगों को एकत्र करने का मूल अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: यहूदिया के लोगों को
  rationale: यूनानी पदबंध की कुछ हद तक संक्षिप्तता बनाए रखता है और मूल में न दिए गए ‘पुरुषों’ को नहीं जोड़ता।
- source_word: τοῦ ἐκπολεμῆσαι
  choice: ताकि ... के विरुद्ध युद्ध करे
  rationale: सप्रयोजन infinitive और प्रबल सैन्य विरोध—दोनों को स्पष्ट करता है। एकवचन ‘करे’ का कर्ता योनातान है, जैसा यूनानी वाक्य-विन्यास संकेत करता है।
- source_word: τὴν ἄκραν
  choice: गढ़
  rationale: ἄκρα यहाँ यरूशलेम के किलेबंद सैन्य गढ़ को सूचित करता है; संक्षिप्त और सामान्य हिन्दी शब्द चुना गया है, जबकि विशिष्ट नाम ‘अक्रा’ पादटिप्पणी में सुरक्षित है।
- source_word: μηχανὰς πολλάς
  choice: घेराबंदी के बहुत-से यंत्र
  rationale: किले पर आक्रमण के संदर्भ में μηχαναί सामान्य मशीनें नहीं, बल्कि घेराबंदी में प्रयुक्त सैन्य यंत्र हैं।
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: उन्होंने उसके विरुद्ध ... बनाए
  rationale: ποιέω का निर्माणार्थक भाव और ἐπʼ αὐτήν की शत्रुतापूर्ण दिशा दोनों व्यक्त होते हैं।
