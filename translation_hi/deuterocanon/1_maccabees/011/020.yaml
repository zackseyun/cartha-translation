  to: उन दिनों योनातान ने यहूदिया के लोगों को यरूशलेम के गढ़[a] के विरुद्ध युद्ध करने के लिए इकट्ठा किया; और उन्होंने उसके विरुद्ध घेराबंदी के बहुत-से यंत्र बनाए।
