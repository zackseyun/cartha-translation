base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
translation:
  language: hi
  text: और मिस्र के राजा ने समुद्र के तट की रेत के समान असंख्य सैनिक-बल और बहुत-से जहाज़ इकट्ठे किए। उसने छल से सिकन्दर के राज्य को अपने अधिकार में करने[a] और उसे अपने राज्य में मिला लेने का प्रयत्न किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिकन्दर के राज्य पर छल से प्रबल होकर नियंत्रण पाने” या “सिकन्दर के राज्य को छल से अपने वश में करने”; यूनानी क्रिया में किसी पर प्रबल होकर नियंत्रण पाने या उसे अपने अधिकार में लेने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν
  choice: इकट्ठे किए
  rationale: यह ἀθροίζω के संग्रह या एकत्र करने के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और सैन्य जुटाव का भाव भी संदर्भ से स्पष्ट रहता है।
- source_word: δυνάμεις πολλὰς
  choice: बहुत बड़ी सेना
  rationale: सैन्य आख्यान में δυνάμεις का अर्थ सैन्य बल या सैनिक-दल है। हिन्दी में ‘बहुत बड़ी सेना’ संख्या और विशालता की आगामी उपमा के साथ अधिक स्वाभाविक है; इसे कई अलग-अलग सेनाओं तक सीमित नहीं किया गया।
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: समुद्र के किनारे की रेत के समान
  rationale: यह विशाल संख्या बताने वाली पारंपरिक बाइबलीय उपमा को स्पष्ट, गरिमापूर्ण और निकट रूप में सुरक्षित रखता है।
- source_word: πλοῖα πολλά
  choice: बहुत-से जहाज़
  rationale: मूल पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἐζήτησεν
  choice: प्रयत्न किया
  rationale: यहाँ ζητέω किसी लक्ष्य को पाने की चेष्टा दर्शाता है। ‘प्रयत्न किया’ आधुनिक हिन्दी में स्वाभाविक है और सफलता को पूर्वमान नहीं लेता।
- source_word: κατακρατῆσαι
  choice: अधिकार करने
  rationale: क्रिया में किसी पर प्रभुत्व पाने, उसे वश में करने या अपने नियंत्रण में लेने का भाव है। ‘अधिकार करने’ राजनीतिक राज्य-संदर्भ में संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: सिकन्दर के राज्य
  rationale: यहाँ βασιλεία अमूर्त राजत्व के बजाय शासित राज्य को सूचित करता है। ‘सिकन्दर’ हिन्दी में Alexander का प्रचलित ऐतिहासिक रूप है।
- source_word: δόλῳ
  choice: छल से
  rationale: δόλος के कपट या धोखे के अर्थ को बिना ‘विश्वासघात’ जैसी अधिक तीव्र अतिरिक्त धारणा जोड़े व्यक्त करता है।
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: उसे अपने राज्य में मिला लेने
  rationale: προστίθημι के ‘जोड़ने’ के अर्थ और राजनीतिक विलय दोनों को सहज हिन्दी में व्यक्त करता है; ‘अधिग्रहण’ जैसे आधुनिक प्रशासनिक शब्द से बचा गया है।
