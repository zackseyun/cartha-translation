  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: hi
  text: और नगर के लोगों ने देखा कि यहूदियों ने नगर पर वैसा ही अधिकार कर लिया था जैसा वे चाहते थे, और उनका हौसला टूट गया; उन्होंने राजा से विनती करते हुए पुकारकर कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: नगर के लोग
  rationale: यह वाक्यांश प्रसंग में नगर के भीतर के निवासियों या पक्ष को सूचित करता है; शाब्दिक ‘नगर के नीचे’ अर्थ उपयुक्त नहीं है।
- source_word: κατεκράτησαν ... τῆς πόλεως
  choice: नगर पर अधिकार कर लिया है
  rationale: क्रिया और संबंधकारक का मेल नगर पर प्रभुत्व या नियंत्रण स्थापित करने का परिणाम व्यक्त करता है; यह अनुवाद अनावश्यक हिंसात्मक अर्थ जोड़े बिना उसे स्पष्ट करता है।
- source_word: ὡς ἠβούλοντο
  choice: अपनी इच्छा के अनुसार
  rationale: यह बताता है कि यहूदियों ने वैसा ही नियंत्रण प्राप्त किया जैसा वे चाहते थे।
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: उनका हौसला टूट गया
  rationale: शाब्दिक रूप से ‘वे अपने मनों में निर्बल हो गए’; यहाँ यह निराश होने और संकल्प टूटने का मुहावरा है।
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα
  choice: उन्होंने राजा से ... पुकारकर कहा
  rationale: κράζω ऊँचे या तीव्र स्वर में पुकारने को व्यक्त करता है; ‘पुकारकर कहा’ अगले पद में आने वाले प्रत्यक्ष कथन से स्वाभाविक संबंध रखता है।
- source_word: μετὰ δεήσεως
  choice: विनती करते हुए
  rationale: δέησις गंभीर और आग्रहपूर्ण निवेदन है; यह हिन्दी में सहज रहते हुए विनय और तात्कालिकता बनाए रखता है।
- source_word: λέγοντες
  choice: कहा
  rationale: कृदंत अगले पद के प्रत्यक्ष कथन का परिचय देता है; हिन्दी में ‘पुकारकर कहा’ स्वाभाविक संयोजन है।
