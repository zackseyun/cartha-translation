  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
translation:
  language: hi
  text: और उन्होंने राजा को बताया कि योनातान ने क्या-क्या किया था, ताकि उस पर दोष लगाएँ[a]; पर राजा चुप रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताकि उसे बदनाम करें’ या ‘ताकि उसकी निंदा करें।’ यूनानी क्रिया दोष देने और निंदा करने का अर्थ भी दे सकती है; यह आवश्यक नहीं कि यहाँ औपचारिक अभियोग ही अभिप्रेत हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: बताया
  rationale: क्रिया का अर्थ विस्तार से सुनाना या वर्णन करना है। राजदरबार के इस प्रसंग में ‘बताया’ स्वाभाविक है और विवरण की मात्रा को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ἃ ἐποίησεν
  choice: क्या-क्या किया था
  rationale: यह संबंधवाचक पदबंध योनातान के कार्यों की ओर संकेत करता है। ‘किया था’ कथा के पूर्वकालिक क्रम को व्यक्त करता है, और ‘क्या-क्या’ कार्यों की बहुलता का स्वाभाविक हिन्दी संकेत है।
- source_word: εἰς τὸ ψογίσαι
  choice: ताकि उस पर दोष लगाएँ
  rationale: ψογίζω में दोष देना, निंदा करना या बदनाम करना शामिल हो सकता है। ‘दोष लगाएँ’ राजदरबार में विरोधियों की शिकायत का भाव रखता है, पर इसे निश्चित रूप से औपचारिक कानूनी अभियोग नहीं बनाता।
- source_word: αὐτόν
  choice: उस पर
  rationale: सर्वनाम का स्वाभाविक संदर्भ निकटतम उल्लिखित व्यक्ति योनातान है। ‘दोष लगाना’ के साथ हिन्दी में ‘उस पर’ सहज प्रयोग है।
- source_word: ἐσίγησεν
  choice: चुप रहा
  rationale: अओरिस्ट क्रिया यहाँ राजा की प्रतिक्रिया—कुछ न कहना—बताती है। ‘चुप रहा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: ऐतिहासिक आख्यान में उपाधि का मानक हिन्दी रूप।
