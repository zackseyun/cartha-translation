  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: hi
  text: सिकन्दर ने सुना और वह उसके विरुद्ध युद्ध करने आया; और टॉलेमी अपनी सेना लेकर निकला और शक्तिशाली सैन्य बल के साथ[a] उसका सामना किया और उसे खदेड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बलवान हाथ से”; यह सामर्थ्य के साथ कार्य करने का एक सैन्य मुहावरा है।
    reason: मूल यूनानी मुहावरे के शाब्दिक बिंब और प्रसंगगत अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: मूल क्रिया का सीधा अर्थ ‘सुना’ है। सहज हिन्दी के लिए पहले के घटनाक्रम की ओर संकेत करते हुए ‘यह’ जोड़ा गया है, पर सूचना की विषयवस्तु को अधिक स्पष्ट नहीं किया गया।
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: वह उससे युद्ध करने आया
  rationale: यह अनुवाद विरोधी की ओर बढ़ने और युद्ध के उद्देश्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξήγαγεν
  choice: अपनी सेना लेकर निकला
  rationale: क्रिया का मूल भाव ‘बाहर ले जाना’ है; सैन्य प्रसंग में निहित सैनिक बल को हिन्दी में स्पष्ट करके स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: ἀπήντησεν αὐτῷ
  choice: उसका सामना करके
  rationale: यह युद्ध के प्रसंग में ‘उससे मिला/उसका सामना किया’ का उपयुक्त और संक्षिप्त हिन्दी रूप है।
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: एक शक्तिशाली सैन्य बल के साथ
  rationale: यूनानी का शाब्दिक रूप ‘बलवान हाथ से’ है, पर यहाँ ‘हाथ’ शक्ति या सैन्य सामर्थ्य का मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट रखा गया और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: ἐτροπώσατο αὐτόν
  choice: उसे खदेड़ दिया
  rationale: युद्ध-संदर्भ में क्रिया शत्रु को पलटने या भगा देने का भाव रखती है; ‘खदेड़ दिया’ सामान्य ‘हरा दिया’ से इस अर्थ को अधिक सटीकता से व्यक्त करता है।
