  text: उनमें से एक भी शेष न रहा, केवल अबशालोम का पुत्र मत्तथियास और खल्फी का पुत्र यहूदा रह गए, जो सेना की टुकड़ियों के सेनापति थे।[a]
  philosophy: optimal-equivalence
