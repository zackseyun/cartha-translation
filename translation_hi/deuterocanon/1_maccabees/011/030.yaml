  text: King Demetrius to Jonathan his brother[a], greetings, and to the nation of the Jews.
translation:
  language: hi
  text: राजा देमेत्रियुस की ओर से भाई योनातान और यहूदी राष्ट्र[a] को नमस्कार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-वासियों का राष्ट्र।” यूनानी शब्द Ἰουδαίων संदर्भ के अनुसार जातीय पहचान (“यहूदी”) या भौगोलिक पहचान (“यहूदिया-वासी”) पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεὺς
  choice: राजा
  rationale: पत्र के आरम्भ में यह प्रेषक देमेत्रियुस की राजकीय उपाधि है; हिन्दी में नाम से पहले ‘राजा’ स्वाभाविक और औपचारिक है।
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Ἰωνάθαν
  choice: योनातान
  rationale: इस बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: τῷ ἀδελφῷ
  choice: अपने भाई
  rationale: ἀδελφός को स्पष्ट रूप से बनाए रखा गया है। राजकीय पत्राचार में यह सगा भाई होने का दावा न होकर सम्मान और राजनीतिक निकटता का संबोधन भी हो सकता है; ‘अपने’ हिन्दी में संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह यूनानी पत्रों का रूढ़ अभिवादन-सूचक प्रयोग है; ‘नमस्कार’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक पत्रारम्भ है।
- source_word: ἔθνει
  choice: राष्ट्र
  rationale: ἔθνος यहाँ सामूहिक और राजनीतिक पहचान वाले जनसमुदाय को दर्शाता है; ‘राष्ट्र’ इस अर्थ को सुरक्षित रखता है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: यह सबसे प्रचलित और तुरंत समझ में आने वाला हिन्दी रूप है। यूनानी शब्द जातीय अथवा भौगोलिक बल के अनुसार ‘यहूदिया-वासियों’ को भी सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: राजकीय पत्राचार में ἀδελφός का आशय
  choice: मुख्य पाठ में ‘अपने भाई’ बनाए रखा गया
  alternative: ‘सहयोगी’ या अन्य राजनीतिक पदवी; अथवा केवल सगे भाई का अर्थ
  rationale: यूनानी पाठ स्पष्ट रूप से ‘भाई’ कहता है, पर संदर्भ इसे सम्मानसूचक या कूटनीतिक संबोधन मानने की संभावना रखता है। अनुवाद मूल संबंध-संज्ञा को बनाए रखता है और किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी पत्र-प्रारूप को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘की ओर से’ जोड़ा गया है और दोनों प्राप्तकर्ताओं को ‘नमस्कार’ से जोड़ा गया है।
