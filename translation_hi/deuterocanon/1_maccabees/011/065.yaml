translation:
  language: hi
  text: और शमौन ने बेत्सूर के पास छावनी डाली और बहुत दिनों तक उसके विरुद्ध युद्ध करता रहा; फिर उसने उसे चारों ओर से घेर लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे बंद कर दिया” अथवा “उसकी घेराबंदी कर दी।” यूनानी क्रिया का अर्थ बंद करना या चारों ओर से घेरना है; यहाँ संभवतः नगर को घेरकर उसकी आवाजाही रोकने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: छावनी डाली
  rationale: यह क्रिया सैन्य संदर्भ में पड़ाव या छावनी डालने को व्यक्त करती है। आगे युद्ध और घेराव का अलग उल्लेख होने के कारण इसे यहीं ‘घेरा डाला’ कहना घटनाक्रम को समय से पहले मिला देता।
- source_word: Βεθσούρᾳ
  choice: बेत्सूर
  rationale: यूनानी स्थान-नाम का स्वाभाविक हिन्दी लिप्यंतरण; ‘के पास’ हिन्दी में छावनी डालने के स्थान-संबंध को स्पष्ट और सहज बनाता है।
- source_word: ἐπολέμει
  choice: उसके विरुद्ध युद्ध करता रहा
  rationale: अपूर्ण भूतकाल जारी सैन्य कार्रवाई दर्शाता है; ‘करता रहा’ उसके निरंतर पक्ष को सुरक्षित रखता है।
- source_word: ἡμέρας πολλὰς
  choice: बहुत दिनों तक
  rationale: कालावधि बताने वाले कर्मकारक का स्वाभाविक हिन्दी रूप।
- source_word: συνέκλεισεν
  choice: उसे चारों ओर से घेर लिया
  rationale: क्रिया का मूल भाव भीतर बंद कर देने या घेर लेने का है। सैन्य प्रसंग में यह नगर की घेराबंदी को सूचित करता है, पर ‘नाकाबंदी’ जैसी अधिक विशिष्ट आधुनिक धारणा नहीं जोड़ता।
