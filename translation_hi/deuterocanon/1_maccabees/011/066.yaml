  yaml_path: translation/deuterocanon/1_maccabees/011/066.yaml
  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: hi
  text: और उन्होंने उससे आग्रह किया कि वह उनसे प्रतिज्ञाएँ स्वीकार करे[a], और उसने उन्हें प्रतिज्ञाएँ दीं; फिर उसने उन्हें वहाँ से निकाल दिया, नगर पर अधिकार कर लिया और उसमें एक सैनिक टुकड़ी तैनात कर दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दाहिने हाथ स्वीकार करे।” यह हाथ मिलाकर शांति, निष्ठा या समझौते का आश्वासन देने की प्रथा की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: उन्होंने उससे आग्रह किया
  rationale: पूरक infinitive के साथ यह क्रिया यहाँ विनती या अनुरोध का भाव देती है; ‘आग्रह किया’ कथानक में स्वाभाविक है और ‘माँग की’ जितना कठोर नहीं।
- source_word: δεξιὰς λαβεῖν
  choice: उनकी ओर से मैत्री की प्रतिज्ञाएँ स्वीकार करे
  rationale: शाब्दिक अर्थ ‘दाहिने हाथ ग्रहण करना’ है, पर यह हाथ मिलाकर शांति, निष्ठा या सद्भाव का आश्वासन देने-लेने का मुहावरा है। ‘मैत्री की प्रतिज्ञाएँ’ संदर्भगत अर्थ बताता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: ἔδωκεν αὐτοῖς
  choice: उसने उन्हें वे प्रतिज्ञाएँ दे दीं
  rationale: यूनानी में कर्म पूर्ववर्ती मुहावरे से समझा जाता है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए निहित कर्म को स्पष्ट किया गया है।
- source_word: ἐξέβαλεν
  choice: उसने उन्हें वहाँ से निकाल दिया
  rationale: यह बलपूर्वक हटाने का अर्थ व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: κατελάβετο τὴν πόλιν
  choice: नगर पर अधिकार कर लिया
  rationale: मध्यवाच्य रूप नगर को अपने कब्जे या नियंत्रण में लेने का भाव देता है; यह ‘नगर ले लिया’ की अपेक्षा स्वाभाविक हिन्दी है।
- source_word: φρουράν
  choice: एक सैनिक चौकी
  rationale: सैन्य संदर्भ में शब्द किसी स्थान की रक्षा और नियंत्रण के लिए तैनात सैनिक दल या गैरीसन को सूचित करता है; ‘सैनिक चौकी’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἔθετο ἐπʼ αὐτὴν
  choice: उसमें ... तैनात कर दी
  rationale: नगर पर नियंत्रण बनाए रखने के लिए सैनिक बल की नियुक्ति का भाव है; हिन्दी में ‘नगर में तैनात’ स्वाभाविक अभिव्यक्ति है।
