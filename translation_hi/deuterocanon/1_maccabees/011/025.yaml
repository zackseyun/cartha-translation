lexical_decisions:
- source_word: ἐνετύγχανον
  choice: आरोप लगा रहे थे
  rationale: κατʼ αὐτοῦ के विरोधात्मक संदर्भ में यह क्रिया किसी अधिकारी के सामने शिकायत या अभियोग प्रस्तुत करने का भाव देती है। अपूर्णकाल की जारी क्रिया को ‘लगा रहे थे’ से व्यक्त किया गया है।
- source_word: κατʼ αὐτοῦ
  choice: उसके विरुद्ध
  rationale: यहाँ κατά संबंधकारक के साथ उस व्यक्ति के प्रति विरोध सूचित करता है।
- source_word: τινες
  choice: कुछ
  rationale: यह किसी अनिश्चित छोटे समूह को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἄνομοι
  choice: व्यवस्था-विरोधी पुरुष
  rationale: शब्द उन पुरुषों को नैतिक और विधिक रूप से व्यवस्था की अवहेलना करनेवाला बताता है; ‘व्यवस्था-विरोधी’ इस मूल्यांकन को केवल सामान्य ‘दुष्ट’ कहकर कम नहीं करता।
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: उसी जाति के
  rationale: यह वाक्यांश उस जातीय-राजनीतिक समुदाय के भीतर से आए लोगों को दर्शाता है। ‘उसी’ संदर्भगत अपनेपन को स्पष्ट करता है और ‘अन्यजाति’ का भ्रामक अर्थ टालता है।
theological_decisions:
- issue: ἄνομοι का अनुवाद
  choice: व्यवस्था-विरोधी पुरुष
  alternative: दुष्ट पुरुष
  rationale: यह पद यहाँ केवल सामान्य दुष्टता नहीं, बल्कि व्यवस्था की अवहेलना का नैतिक-विधिक आरोप व्यक्त करता है; इसे किसी विशेष धार्मिक दल या तकनीकी धर्मवैज्ञानिक श्रेणी के रूप में नहीं लिया गया।
