  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: hi
  text: और राजा भागकर आँगन[a] में चला गया। नगर के लोगों ने नगर के आने-जाने के मार्गों[b] पर अधिकार कर लिया और लड़ना शुरू कर दिया।
  philosophy: optimal-equivalence
  footnotes:
