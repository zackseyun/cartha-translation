    text: या ‘प्रांगण’; यूनानी शब्द राजमहल के आँगन या प्रांगण के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगर के प्रवेश-मार्गों’ अथवा ‘नगर के रास्तों’; यूनानी शब्द रास्तों, निकासों या पहुँच-पथों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: भागकर … चला गया
  rationale: यह φεύγω के संकट से बचने के लिए तत्काल पलायन करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐλήν
  choice: आँगन
  rationale: αὐλή किसी भवन, विशेषकर इस प्रसंग में राजकीय भवन, के खुले प्रांगण या आँगन को सूचित कर सकता है। मूल यूनानी में ‘राजमहल’ स्पष्टतः नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: κατελάβοντο
  choice: अधिकार कर लिया
  rationale: मध्यवाच्य रूप यहाँ किसी स्थान को अपने नियंत्रण में लेने का भाव देता है; यह चयन सैन्य प्रसंग के अनुकूल है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोग
  rationale: शाब्दिक अर्थ ‘नगर से [आए/सम्बन्ध रखनेवाले] लोग’ है। यह लिंग के विषय में अनावश्यक विशिष्टता जोड़े बिना युद्ध में सक्रिय नगरवासियों को दर्शाता है।
- source_word: τὰς διόδους τῆς πόλεως
  choice: नगर के आने-जाने के मार्ग
  rationale: δίοδος मार्ग, रास्ता, निकास या पहुँच-पथ का अर्थ दे सकता है। ‘आने-जाने के मार्ग’ इस अर्थ-सीमा को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: लड़ना शुरू कर दिया
  rationale: यह युद्ध या सशस्त्र संघर्ष आरम्भ करने के यूनानी भाव का स्पष्ट और स्वाभाविक हिन्दी रूप है।
