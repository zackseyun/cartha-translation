  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: hi
  text: हमने यहूदी राष्ट्र—जो हमारे मित्र हैं और जो हमारे प्रति उचित है, उसका पालन करते हैं[a]—का भला करने का निर्णय लिया है, क्योंकि वे हमारे प्रति सद्भाव रखते हैं।
  philosophy: optimal-equivalence
