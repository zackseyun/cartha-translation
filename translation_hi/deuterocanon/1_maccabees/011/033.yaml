    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: यहूदियों की जाति
  rationale: ἔθνος का अर्थ यहाँ राजनीतिक-सामुदायिक अर्थ में ‘जाति’ या ‘राष्ट्र’ है। ‘यहूदियों की जाति’ यूनानी संबंधवाचक रचना को बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: φίλοις ἡμῶν
  choice: जो हमारे मित्र हैं
  rationale: यह यहूदियों की जाति का समानाधिकरणात्मक वर्णन है। उपवाक्य के रूप में अनुवाद हिन्दी वाक्य में स्पष्ट और स्वाभाविक है।
- source_word: συντηροῦσι τὰ πρὸς ἡμᾶς δίκαια
  choice: हमारे प्रति उचित बातों का पालन करते हैं
  rationale: συντηρέω निरंतर बनाए रखने या पालन करने का भाव देता है, जबकि τὰ ... δίκαια ‘उचित/न्यायसंगत बातें’ अथवा संदर्भानुसार दायित्व हो सकते हैं। मुख्य पाठ व्यापक नैतिक-कानूनी अर्थ को खुला रखता है।
- source_word: ἐκρίναμεν ἀγαθοποιῆσαι
  choice: भला करने का निर्णय लिया है
  rationale: राजकीय पत्र की शैली में ἐκρίναμεν औपचारिक निर्णय व्यक्त करता है और ἀγαθοποιῆσαι व्यापक रूप से लाभ या भलाई करने को सूचित करता है।
- source_word: χάριν τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: क्योंकि वे हमारे प्रति सद्भाव रखते हैं
  rationale: χάριν कारण बताता है और εὔνοια मैत्रीपूर्ण अथवा निष्ठापूर्ण अनुकूल भाव को व्यक्त करता है। संज्ञात्मक यूनानी पदबंध को हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है।
