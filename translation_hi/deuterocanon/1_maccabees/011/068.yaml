  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: hi
  text: और देखो, परदेशियों की एक सेना मैदान में उससे आ मिली। उन्होंने पहाड़ों में उसके विरुद्ध घात लगाई, जबकि वे स्वयं सामने से उससे आ मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ
  choice: सेना
  rationale: यह संज्ञा मूलतः सैन्य छावनी या पड़ाव को सूचित करती है, पर यहाँ चलकर सामना करने वाली संगठित सैन्य टुकड़ी अभिप्रेत है; हिन्दी में ‘सेना’ प्रसंग को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἀλλοφύλων
  choice: परदेशियों
  rationale: शब्द का अर्थ दूसरे कुल या जाति के लोग है। यहाँ इसे विशेष रूप से पलिश्तियों तक सीमित करना उचित नहीं; ‘परदेशी’ सामान्य गैर-यहूदी शत्रु-बल का भाव बनाए रखता है।
- source_word: ἀπήντα αὐτῷ
  choice: उसका सामना करने आई
  rationale: क्रिया मिलने या सामने आने का अर्थ देती है; सैन्य प्रसंग में ‘सामना करने आई’ स्पष्ट और स्वाभाविक है।
- source_word: ἐν τῷ πεδίῳ
  choice: मैदान में
  rationale: समतल खुले भूभाग को दर्शाता है और आगे आने वाले पहाड़ों से भौगोलिक विरोध बनाए रखता है।
- source_word: ἐξέβαλον ἔνεδρον
  choice: घात लगाई
  rationale: यह यूनानी मुहावरा घात तैनात करने का अर्थ देता है; ‘घात लगाना’ इसका प्रचलित और संक्षिप्त हिन्दी सैन्य प्रयोग है।
- source_word: ἐπʼ αὐτόν
  choice: उसके विरुद्ध
  rationale: घात के संदर्भ में पूर्वसर्ग शत्रुतापूर्ण लक्ष्य दर्शाता है; ‘उसके विरुद्ध’ इसे बिना अनावश्यक विस्तार के स्पष्ट करता है।
- source_word: ἐν τοῖς ὄρεσιν
  choice: पहाड़ों में
  rationale: बहुवचन स्थानवाचक अभिव्यक्ति का सीधा अनुवाद है और मैदान के साथ मूल भौगोलिक विरोध को सुरक्षित रखता है।
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: और वे स्वयं सामने से उसका सामना करने आए
  rationale: ‘वे स्वयं’ मुख्य बल और पहाड़ों में छिपे घातक दल के बीच बलाघातपूर्ण अंतर बनाए रखता है। ‘सामने से’ ἐξ ἐναντίας की दिशा को सहज हिन्दी में व्यक्त करता है, जबकि ἀπήντησαν के ‘सामना करने आए’ अर्थ को भी सुरक्षित रखता है।
