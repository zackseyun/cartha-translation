  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: hi
  text: और राजा दिमेत्रियुस अपने राज्य के सिंहासन पर बैठा, और उसके सामने देश शांत हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: बैठा
  rationale: यहाँ क्रिया राजसिंहासन ग्रहण करने के भाव में है; ‘बैठा’ मूल बिंब को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: अपने राज्य के सिंहासन
  rationale: यह अनुवाद यूनानी संबंधकारक रचना को स्वाभाविक हिन्दी में रखते हुए ‘राज्य’ और ‘सिंहासन’ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἡσύχασεν
  choice: शांत हो गया
  rationale: क्रिया अशांति के थमने या स्थिति के शांत होने को व्यक्त करती है; यह ‘शांति स्थापित हुई’ की अपेक्षा कम अर्थ जोड़ती है।
- source_word: ἡ γῆ
  choice: देश
  rationale: इस ऐतिहासिक प्रसंग में γῆ पूरी पृथ्वी नहीं, बल्कि शासित भूभाग या देश को सूचित करता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह मूल पदबंध का सीधा रूप है और उसके शासन या उपस्थिति के संबंध में देश के शांत होने की संभावित राजनीतिक छाया को खुला रखता है।
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: राजा दिमेत्रियुस
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है; नाम का लिप्यंतरण यूनानी Δημήτριος के निकट रखा गया है।
