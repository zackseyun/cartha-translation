base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: hi
  text: तब योनातान निकल पड़ा और नदी[a] के पार तथा नगरों में होकर आगे बढ़ता गया। उसके साथ गठबंधन करने के लिए सीरिया की सारी सेनाएँ उसके पास इकट्ठी हो गईं। वह अश्कलोन पहुँचा, और नगर के लोग बड़े सम्मान के साथ उससे मिलने आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नदी का नाम नहीं दिया गया है; इस ऐतिहासिक प्रसंग में सम्भवतः फरात नदी अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλεν Ἰωνάθᾳ
  choice: योनातान निकल पड़ा
  rationale: ἐξῆλεν कथा में प्रस्थान को सूचित करता है। ‘निकल पड़ा’ स्वाभाविक हिन्दी है और प्रसंग को अनावश्यक रूप से सैन्य कूच नहीं बनाता।
- source_word: διεπορεύετο
  choice: आगे बढ़ता गया
  rationale: अपूर्णकालीन रूप निरंतर यात्रा को दर्शाता है; यह चयन उस प्रगतिशील गति को स्वाभाविक हिन्दी में रखता है।
- source_word: πέραν τοῦ ποταμοῦ
  choice: नदी के पार
  rationale: यूनानी पाठ नदी का नाम नहीं देता, इसलिए सम्भावित फरात को मुख्य पाठ में स्पष्ट नहीं किया गया।
- source_word: ἐν ταῖς πόλεσιν
  choice: नगरों में से होकर
  rationale: ἐν का मूल अर्थ ‘में’ है, पर गति-सूचक क्रिया के साथ यहाँ नगरों से होकर यात्रा करने का भाव स्वाभाविक है।
- source_word: πᾶσαι αἱ δυνάμεις Συρίας
  choice: सीरिया की सारी सेनाएँ
  rationale: सैन्य प्रसंग में δυνάμεις सशस्त्र सैन्य दलों को सूचित करता है; बहुवचन ‘सेनाएँ’ उनकी सामूहिकता और बहुलता बनाए रखता है।
- source_word: ἠθροίσθησαν πρὸς αὐτόν
  choice: उसके पास इकट्ठी हो गईं
  rationale: यह निष्क्रिय क्रिया योनातान की ओर सैन्य दलों के एकत्र होने को व्यक्त करती है।
- source_word: εἰς συμμαχίαν
  choice: उसके साथ गठबंधन करने के लिए
  rationale: εἰς उद्देश्य अथवा परिणति दोनों का भाव दे सकता है। हिन्दी वाक्यांश समर्थन हेतु उनके एकत्र होने का मुख्य आशय स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: Ἀσκαλῶνα
  choice: अश्कलोन
  rationale: यह स्थान-नाम का प्रचलित आधुनिक हिन्दी लिप्यंतरण है।
- source_word: ἀπήντησαν αὐτῷ
  choice: उससे भेंट की
  rationale: क्रिया सामने जाकर मिलने या स्वागतार्थ मिलने को व्यक्त करती है; अगला क्रियाविशेषण सम्मानपूर्ण स्वागत का ढंग स्पष्ट करता है।
- source_word: ἐνδόξως
  choice: बड़े सम्मान के साथ
  rationale: यहाँ शब्द आदरपूर्ण और प्रतिष्ठापूर्ण रीति से मिलने का भाव देता है; यह हिन्दी में सहज और गरिमापूर्ण है।
