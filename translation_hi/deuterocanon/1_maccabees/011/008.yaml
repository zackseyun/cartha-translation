  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ऐतिहासिक-वर्णनात्मक स्तर रखा गया है। व्यक्तिनामों के लिए प्रचलित हिन्दी रूप ‘टॉलेमी’ और ‘सिकन्दर’ तथा स्थाननाम के लिए ‘सेल्यूसिया’ प्रयुक्त हुए हैं।
