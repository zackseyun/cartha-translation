base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: hi
  text: परन्तु राजा टॉलेमी ने समुद्रतट के नगरों को समुद्रतटीय सेल्यूसिया तक अपने अधिकार में कर लिया, और वह सिकन्दर के विरुद्ध बुरी योजनाएँ बना रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह सिकन्दर के विषय में बुरी योजनाओं पर विचार कर रहा था।” यूनानी में शाब्दिक अर्थ “सिकन्दर के विषय में” है, पर प्रसंग में भाव विरोधपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: अधिकार कर लिया
  rationale: यह क्रिया प्रभुत्व या नियंत्रण प्राप्त करने का भाव देती है। सैन्य-राजनीतिक प्रसंग में ‘अधिकार कर लिया’ स्वाभाविक है और स्थायी शासन का अनावश्यक दावा नहीं करता।
- source_word: πόλεων τῆς παραλίας
  choice: समुद्रतट के नगरों
  rationale: यह यूनानी संबंधवाचक पदबंध के भौगोलिक अर्थ को स्पष्ट और सहज आधुनिक हिन्दी में रखता है।
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: समुद्रतटीय सेल्यूसिया तक
  rationale: παραθαλασσίας उस सेल्यूसिया को समुद्र के निकट स्थित नगर के रूप में अलग पहचान देता है; ‘समुद्रतटीय सेल्यूसिया’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: διελογίζετο
  choice: बना रहा था
  rationale: अपूर्णकालिक रूप चल रहे विचार-विमर्श या योजना-निर्माण को दर्शाता है; ‘योजनाएँ बना रहा था’ हिन्दी में यही निरंतर भाव देता है।
- source_word: λογισμοὺς πονηρούς
  choice: बुरी योजनाएँ
  rationale: λογισμούς यहाँ विचारों, युक्तियों या योजनाओं को और πονηρούς उनकी दुष्ट अथवा हानिकारक प्रकृति को व्यक्त करता है। यह अनुवाद सीधा और पठनीय है।
- source_word: περὶ Ἀλεξάνδρου
  choice: सिकन्दर के विरुद्ध
  rationale: शाब्दिक अर्थ ‘सिकन्दर के विषय में’ है, पर ‘बुरी योजनाएँ’ के प्रसंग में उनका लक्ष्य सिकन्दर है और आशय विरोधी है। मुख्य पाठ में स्वाभाविक प्रसंगगत अर्थ रखा गया है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
