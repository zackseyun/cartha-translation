  yaml_path: translation/deuterocanon/1_maccabees/011/007.yaml
  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: hi
  text: और योनातान राजा के साथ उस नदी तक गया, जो एल्युथेरुस[a] कहलाती थी, फिर वह यरूशलेम लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एल्युथेरुस एक नदी का व्यक्तिवाचक नाम है, जो उत्तरी सीमा-क्षेत्र को चिह्नित करती थी; यूनानी पाठ में केवल ‘एल्युथेरुस कहलाने वाली नदी’ कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: गया
  rationale: यह πορεύομαι का सामान्य कथात्मक प्रयोग है; सरल भूतकालीन गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μετὰ τοῦ βασιλέως
  choice: राजा के साथ
  rationale: सम्बन्धकारक के साथ μετά संगति या साथ होने का अर्थ देता है।
- source_word: ἕως τοῦ ποταμοῦ
  choice: उस नदी तक
  rationale: ἕως यात्रा की सीमा या अंतिम बिंदु बताता है; ‘तक’ इसे संक्षेप और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: जो एल्युथेरुस कहलाती थी
  rationale: καλουμένου का अर्थ ‘कहलाने वाली’ है और नदी के यूनानी व्यक्तिवाचक नाम को अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: ἐπέστρεψεν
  choice: लौट आया
  rationale: ἐπιστρέφω यहाँ यात्रा से वापस आने का संकेत देता है; ‘लौट आया’ हिन्दी कथन में स्वाभाविक है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: लौटने की क्रिया के साथ गंतव्य को हिन्दी में बिना परसर्ग के स्वाभाविक रूप से व्यक्त किया जाता है।
