translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘योनातान’, ‘एल्युथेरुस’ और ‘यरूशलेम’ व्यक्तिवाचक नामों के प्रचलित या स्रोत-संगत देवनागरी रूप हैं; वाक्य की दो क्रमिक क्रियाएँ स्पष्ट रखने के लिए दूसरे खंड में ‘फिर’ जोड़ा गया है।
