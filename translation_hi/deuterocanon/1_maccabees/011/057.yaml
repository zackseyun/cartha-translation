base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: hi
  text: और कनिष्ठ अंतियोकस ने योनातान को लिखा, “मैं तुम्हें महायाजक के पद पर नियुक्त करता हूँ, और तुम्हें चार जिलों का प्रभारी नियुक्त करता हूँ, और तुम्हें राजा के मित्रों[a] में शामिल करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ संभवतः हेलेनिस्ती राजतंत्र में एक औपचारिक दरबारी पद या वर्ग है, न कि केवल राजा के निजी मित्र।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिखा
  rationale: यूनानी क्रिया सीधे लिखने के कार्य को व्यक्त करती है; आगे का कथन पत्र-संदर्भ स्पष्ट कर देता है।
- source_word: ὁ νεώτερος
  choice: छोटे
  rationale: यह अन्तियोकुस को उसी नाम के बड़े व्यक्ति से अलग करने वाला विशेषण है; आधुनिक हिन्दी में ‘छोटे अन्तियोकुस’ स्वाभाविक है।
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: मैं तुम्हें महायाजक के पद पर नियुक्त करता हूँ
  rationale: यहाँ क्रिया शारीरिक रूप से खड़ा करने की नहीं, औपचारिक रूप से पद प्रदान करने की सूचक है; ἀρχιερωσύνη पद या पदवी को दर्शाता है।
- source_word: καθίστημί σε ἐπὶ τῶν τεσσάρων νομῶν
  choice: तुम्हें उन चार जिलों का अधिकारी ठहराता हूँ
  rationale: शासन-संदर्भ में καθίστημι किसी को अधिकार सौंपने का भाव रखता है, और νομοί प्रशासनिक जिले हैं।
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: राजा के मित्रों
  rationale: शाब्दिक अर्थ सुरक्षित रखा गया है; यूनानी-हेलेनिस्ती राजदरबार में यह संभवतः औपचारिक दरबारी पद था, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: φίλων τοῦ βασιλέως का दरबारी आशय
  choice: राजा के मित्रों
  alternative: राजा के निजी मित्रों अथवा साथियों
  rationale: वाक्यांश का शाब्दिक रूप बनाए रखते हुए उसके संभावित तकनीकी, राजदरबारी अर्थ को पादटिप्पणी में बताया गया है; इससे ऐतिहासिक संकेत सुरक्षित रहता है और अनावश्यक निश्चितता नहीं थोपी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज प्रशासनिक लहजा रखा गया है। ‘महायाजक का पद’, ‘जिले’ और ‘अधिकारी ठहराता हूँ’ सामान्य पाठक के लिए स्पष्ट हैं; संभावित तकनीकी दरबारी उपाधि को मुख्य पाठ में शाब्दिक रूप से और पादटिप्पणी में ऐतिहासिक रूप से प्रस्तुत किया गया है।
