  yaml_path: translation/deuterocanon/1_maccabees/011/045.yaml
  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: hi
  text: और नगर के लोग नगर के बीच में इकट्ठे हो गए—उनकी संख्या एक लाख बीस हज़ार पुरुषों की थी[a]—और वे राजा को मार डालना चाहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “बारह दस-हज़ार पुरुष,” अर्थात 1,20,000 पुरुष।'
    reason: मूल यूनानी संख्या-प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: इकट्ठे हो गए
  rationale: क्रिया सामूहिक रूप से एक स्थान पर जमा होने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोग
  rationale: यूनानी पद का शाब्दिक अर्थ ‘नगर से [आए] लोग’ है; प्रसंग में यह नगर के निवासियों या नगर-पक्ष के लोगों को दर्शाता है, बिना अनावश्यक रूप से केवल पुरुष कहे।
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: नगर के बीच में
  rationale: यह नगर के मध्यवर्ती स्थान को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: उनकी संख्या एक लाख बीस हज़ार पुरुषों की थी
  rationale: εἰς यहाँ कुल संख्या बताता है और δώδεκα μυριάδας का अर्थ बारह दस-हज़ार, अर्थात 1,20,000 है। ἄνδρας के कारण ‘पुरुषों’ को स्पष्ट रखा गया है।
- source_word: ἠβούλοντο
  choice: चाहते थे
  rationale: अपूर्ण भूतकालीन रूप इच्छा या मंशा व्यक्त करता है; ‘चाहते थे’ इसे बिना अतिशयोक्ति के सीधे प्रकट करता है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: इस प्रसंग में क्रिया किसी का प्राण लेने के अर्थ में है; ‘मार डालना’ स्पष्ट, वर्तमान और स्वाभाविक हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘नगर’ बाइबलीय ऐतिहासिक गद्य के अनुकूल है। संख्या को भारतीय अंक-पद्धति के अनुसार ‘एक लाख बीस हज़ार’ लिखा गया है, जबकि पादटिप्पणी मूल यूनानी ‘बारह मिरियड’ की संरचना समझाती है।
