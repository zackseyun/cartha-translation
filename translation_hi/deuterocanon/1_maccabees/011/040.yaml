base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: hi
  text: और वह उसके पास ही बना रहा, ताकि वह उसे उसके हाथ सौंप दे, ताकि वह अपने पिता के स्थान पर राजा बने। और उन्होंने उसे वह सब बताया जो देमेत्रियुस ने किया था, और उस शत्रुता के बारे में भी बताया जो उसकी अपनी सेनाएँ उससे रखती थीं[a]; और वह वहाँ बहुत दिनों तक रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ एक ही मूल से बने शब्दों की पुनरुक्ति है; शब्दशः भाव है, “वह शत्रुता जिससे उसकी सेनाएँ उससे शत्रुता रखती थीं।” आशय यह है कि देमेत्रियुस की अपनी सेनाएँ उसके विरुद्ध थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήδρευσεν
  choice: उसके पास ही बना रहा
  rationale: यह क्रिया किसी के निकट रहने या उससे निकटता बनाए रखने का भाव देती है। राजनीतिक उद्देश्य का संकेत संदर्भ से मिलता है, इसलिए चापलूसी या मनुहार जैसा अधिक विशिष्ट आशय नहीं जोड़ा गया।
- source_word: παραδοῖ
  choice: उसके हाथ सौंप दे
  rationale: παραδίδωμι यहाँ किसी व्यक्ति को राजनीतिक नियंत्रण में सौंप देने के अर्थ में है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: अपने पिता के स्थान पर राजा बने
  rationale: यह अनुवाद ἀντί के प्रतिस्थापन या उत्तराधिकार के भाव को बनाए रखता है और यह निर्धारित नहीं करता कि पिता की मृत्यु के बाद ही ऐसा होना था।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: क्रिया औपचारिक सूचना या समाचार पहुँचाने को सूचित करती है; 'बताया' आधुनिक हिन्दी में स्पष्ट है और राजनीतिक संदर्भ में भी उपयुक्त है।
- source_word: συνετέλεσεν
  choice: सब कामों
  rationale: संदर्भ में देमेत्रियुस ने जो कुछ किया था, उसकी समग्रता अभिप्रेत है। 'कामों' उपलब्धि या सफलता का अतिरिक्त मूल्यांकन नहीं जोड़ता।
- source_word: ἔχθραν
  choice: शत्रुता
  rationale: यह सैन्य-राजनीतिक विरोध का सक्रिय भाव व्यक्त करता है और भावनात्मक 'घृणा' की अपेक्षा स्रोत के अधिक निकट है।
- source_word: ἣν ἐχθραίνονσιν αὐτῷ αἱ δυνάμεις αὐτοῦ
  choice: जो उसकी अपनी सेनाएँ उससे रखती थीं
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए यह स्पष्ट किया गया है कि देमेत्रियुस की अपनी सेनाएँ उसी के विरुद्ध थीं; यूनानी की संज्ञा-क्रिया पुनरुक्ति को पादटिप्पणी में बताया गया है।
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: उसकी अपनी सेनाएँ
  rationale: δυνάμεις सैन्य दलों या सशस्त्र सेनाओं को दर्शाता है। 'अपनी' इस आश्चर्यजनक तथ्य को स्पष्ट करता है कि वे उसी देमेत्रियुस की सेनाएँ थीं।
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: वह वहाँ बहुत दिनों तक रहा
  rationale: यह यूनानी काल-सूचना का सीधा, स्वाभाविक हिन्दी रूप है।
