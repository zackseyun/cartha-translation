  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
translation:
  language: hi
  text: इन बातों के बाद त्रूफ़ोन लौट आया। उसके साथ अन्तियोकुस भी था, जो और कम उम्र का बालक था[a]। वह राजा बना और उसने राजमुकुट[b] धारण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद का अनुवाद ‘और छोटा बालक’ या ‘बहुत कम उम्र का बालक’ भी हो सकता है; इसमें अन्तियोकुस की कम आयु पर बल है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘राजकीय सिरबंध’ या ‘डायडेम’; यह राजसत्ता का चिह्न था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन संकेतवाचक पदबंध और कथा के कालक्रम—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπέστρεψεν
  choice: लौट आया
  rationale: क्रिया के ‘वापस मुड़ने/लौटने’ के अर्थ को कथा-संदर्भ में सहज हिन्दी में व्यक्त करता है।
- source_word: παιδάριον νεώτερον
  choice: कम उम्र का बालक
  rationale: παιδάριον के बालक-संबंधी अर्थ और νεώτερον द्वारा दिए गए विशेष रूप से कम आयु के भाव को बिना निश्चित उम्र बताए व्यक्त करता है।
- source_word: ἐβασίλευσεν
  choice: राजा बना
  rationale: राजचिह्न धारण करने वाली अगली क्रिया के संदर्भ में यहाँ राजपद ग्रहण करने का आरंभिक भाव सबसे स्वाभाविक है; फिर भी यूनानी क्रिया का अर्थ ‘राज्य करने लगा/राज्य किया’ भी हो सकता है।
- source_word: ἐπέθετο διάδημα
  choice: राजमुकुट धारण किया
  rationale: मध्यवाच्य क्रिया स्वयं पहनने या धारण करने को सूचित करती है। ‘राजमुकुट’ आधुनिक पाठक को राजसत्ता का चिह्न स्पष्ट करता है, जबकि पादटिप्पणी διάδημα के अधिक विशिष्ट अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: ἐβασίλευσεν का प्रसंगगत बल
  choice: राजा बना
  alternative: राज्य करने लगा / राज्य किया
  rationale: राजकीय चिह्न धारण करने के साथ क्रियाओं का क्रम राजपद ग्रहण करने की घटना की ओर संकेत करता है, पर मूल क्रिया अपने आप में केवल राज्य करने का अर्थ भी दे सकती है।
- issue: διάδημα के लिए राजकीय शब्दावली
  choice: राजमुकुट
  alternative: राजकीय सिरबंध / डायडेम
  rationale: यह ऐतिहासिक राजचिह्न को साधारण आधुनिक हिन्दी में स्पष्ट करता है; अधिक शाब्दिक विशिष्टता पादटिप्पणी में दी गई है।
- issue: अन्तिम दो क्रियाओं का कर्ता
  choice: ‘वह’ से अन्तियोकुस की ओर संकेत
  alternative: नाम दोहराना
  rationale: यूनानी में कर्ता अंतर्निहित है और निकटतम उल्लिखित व्यक्ति अन्तियोकुस है। हिन्दी में ‘वह’ स्रोत की संक्षिप्तता रखते हुए संदर्भ को पर्याप्त स्पष्ट बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ऐतिहासिक कथन। यूनानी के लंबे समन्वित वाक्य को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है। व्यक्तिनामों के रूप ‘त्रूफ़ोन’ और ‘अन्तियोकुस’ रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पद के तुरंत बाद दिए गए हैं।
