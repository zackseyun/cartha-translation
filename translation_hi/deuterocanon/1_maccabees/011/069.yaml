translation:
  language: hi
  text: परन्तु घात लगाकर बैठे सैनिक अपने-अपने स्थानों से उठ खड़े हुए और युद्ध में भिड़ गए; तब योनातान के साथ के सभी लोग भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔνεδρα
  choice: घात लगाकर बैठे सैनिक
  rationale: नपुंसकलिंग बहुवचन पद शाब्दिक रूप से ‘घात’ कह सकता है, पर ἐξανέστησαν और युद्ध करने की क्रिया यहाँ छिपे हुए लड़ाकों को सूचित करती हैं। हिन्दी में व्यक्तियों को स्पष्ट करना स्वाभाविक है।
- source_word: ἐξανέστησαν ἐκ τῶν τόπων ἑαυτῶν
  choice: अपने-अपने स्थानों से उठ खड़े हुए
  rationale: यह छिपे सैनिकों के अपनी निर्धारित जगहों से अचानक सक्रिय होकर निकलने का निकट और स्वाभाविक चित्र प्रस्तुत करता है; ἑαυτῶν का वितरणात्मक भाव ‘अपने-अपने’ से व्यक्त होता है।
- source_word: συνῆψαν πόλεμον
  choice: युद्ध में भिड़ गए
  rationale: यह यूनानी सैन्य मुहावरे में लड़ाई आरम्भ करने या उसमें उलझने का भाव देता है; ‘युद्ध में भिड़ गए’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οἱ παρὰ Ἰωνάθαν πάντες
  choice: योनातान के साथ के सभी लोग
  rationale: παρά यहाँ योनातान के साथ उपस्थित अथवा उससे संबद्ध लोगों को बताता है। यह अनुवाद ‘योनातान के सैनिक’ जैसी अधिक विशिष्ट पहचान जोड़े बिना उस संबंध को बनाए रखता है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: साधारण भूतकालीन क्रिया युद्धस्थल से पलायन को सीधे व्यक्त करती है।
