base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: hi
  text: राजा ने उसके साथ वैसा ही किया जैसा अपने से पहले के राजाओं ने उसके साथ किया था, और उसने उसे अपने सभी मित्रों से ऊँचा स्थान दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे अपने सभी मित्रों के सामने ऊँचा किया।” यूनानी वाक्यांश का अर्थ सब मित्रों की उपस्थिति में सार्वजनिक रूप से ऊँचा करना भी हो सकता है, यद्यपि प्रसंग यह भी समर्थित करता है कि उसे पद या प्रतिष्ठा में उनसे ऊपर किया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: उसके साथ वैसा ही किया
  rationale: ποιέω के साथ संप्रदान कारक यहाँ राजा द्वारा योनातान के प्रति किए गए व्यवहार या कार्य को व्यक्त करता है। यह अनुवाद यूनानी की व्यापकता बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: जैसा उससे पहले के राजाओं ने उसके साथ किया था
  rationale: οἱ πρὸ αὐτοῦ से वर्तमान राजा के पूर्ववर्ती अभिप्रेत हैं। प्रसंग में वे राजा थे; इसलिए यह रूप सामान्य पाठक के लिए संबंध को स्पष्ट करता है।
- source_word: ὕψωσεν
  choice: ऊँचा स्थान दिया
  rationale: ὑψόω का मूल भाव ऊँचा करना है; राजदरबार के इस प्रसंग में यह पद या सम्मान में उन्नति को सूचित करता है। ‘ऊँचा स्थान दिया’ उस राजनीतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: अपने सभी मित्रों से ऊँचा
  rationale: ὕψωσεν के साथ यह पद और सम्मान में राजा के अन्य φίλοι से ऊपर उठाए जाने का अर्थ दे सकता है। φίλοι हेलेनवादी राजदरबार के निकटस्थ अधिकारियों या दरबारियों के लिए प्रयुक्त पद भी हो सकता है; फिर भी ‘मित्र’ मूल शब्द को खुला और पठनीय रखता है।
