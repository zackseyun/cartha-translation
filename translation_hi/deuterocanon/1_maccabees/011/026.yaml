  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘मित्र’ को जानबूझकर बनाए रखा गया है, ताकि राजदरबार के तकनीकी अर्थ को अनावश्यक व्याख्या से न बदला जाए; ἐναντίον की वास्तविक द्व्यर्थता पादटिप्पणी में सुरक्षित है।
