base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
translation:
  language: hi
  text: और वह शांति की बातें करते हुए सीरिया में गया। नगरों के लोगों ने उसके लिए अपने द्वार खोल दिए[a] और उससे मिलने आए, क्योंकि राजा सिकन्दर ने आज्ञा दी थी कि वे उससे मिलें[b], इसलिए कि वह उसका ससुर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके लिए खोला।” यूनानी पाठ में कर्म स्पष्ट नहीं है; संदर्भ में नगरों या उनके द्वारों को खोलने का अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, राजा सिकन्दर ने नगरों के लोगों को टॉलेमी का अनुकूलतापूर्वक स्वागत करने और उससे मिलने की आज्ञा दी थी, क्योंकि टॉलेमी सिकन्दर का ससुर था।
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐξῆλθεν εἰς Συρίαν
  choice: सीरिया की ओर निकल पड़ा
  rationale: यह अनुवाद यात्रा आरम्भ करने और सीरिया की दिशा में बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना यूनानी क्रिया में अतिरिक्त आशय जोड़े।
- source_word: λόγοις εἰρηνικοῖς
  choice: शान्ति की बातें करता हुआ
  rationale: λόγοις के ठोस अर्थ ‘बातें/वचन’ को बनाए रखते हुए यह राजनयिक और मैत्रीपूर्ण आश्वासनों का भाव सहज हिन्दी में देता है।
- source_word: ἤνοιγον αὐτῷ
  choice: उसके लिए खोल दिया
  rationale: यूनानी पाठ में क्या खोला गया, इसका कर्म नहीं दिया गया है। मुख्य पाठ में इस लोप को बनाए रखा गया है; सम्भावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: नगरों के लोग
  rationale: यह पद नगरों के निवासियों या प्रतिनिधियों को सूचित करता है। आधुनिक हिन्दी में ‘लोग’ स्वाभाविक है और यूनानी व्याकरणिक पुल्लिंग को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: συνήντων αὐτῷ
  choice: उससे मिलने आए
  rationale: यह अभिव्यक्ति सामने आकर मिलने की गति और कार्य दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: ἐντολὴ ἦν Ἀλεξάνδρου τοῦ βασιλέως
  choice: राजा सिकन्दर की आज्ञा थी
  rationale: ἐντολή यहाँ अधिकारपूर्ण राजकीय निर्देश है; ‘आज्ञा’ ऐतिहासिक वर्णन के अनुरूप और सामान्य हिन्दी में स्पष्ट है।
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: क्योंकि वह उसका ससुर था
  rationale: πενθερός का विशिष्ट अर्थ ‘ससुर’ है। सर्वनामों को मुख्य पाठ में उसी प्रकार खुला रखा गया है, जबकि प्रसंगगत पहचान पादटिप्पणी में दी गई है।
