  yaml_path: translation/deuterocanon/1_maccabees/011/031.yaml
  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: hi
  text: जिस पत्र को लास्थेनेस ने तुम्हारे विषय में हमारे संबंधी[a] को लिखा था, उसकी एक प्रति हमने तुम्हें भी लिख भेजी है, ताकि तुम उसे देख सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे स्वजन को।” यूनानी शब्द συγγενής का अर्थ रक्त-संबंधी या स्वजन हो सकता है; इस राजकीय संदर्भ में यह किसी सम्मानित सहयोगी अथवा हमवतन के लिए प्रयुक्त पद भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: पत्र ... की एक प्रति
  rationale: ἀντίγραφον किसी दस्तावेज़ की प्रति या नकल है और ἐπιστολή सामान्यतः पत्र है। आधुनिक हिन्दी में ‘पत्र की एक प्रति’ स्वाभाविक और औपचारिक है।
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: जिस पत्र को लास्थेनेस ने ... लिखा था
  rationale: सम्बन्धवाचक उपवाक्य पत्र को विशेषित करता है; ἔγραψεν का सीधा अर्थ ‘लिखा’ है। नाम Λασθένεις का हिन्दी लिप्यंतरण ‘लास्थेनेस’ किया गया है।
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: हमारे संबंधी[a] को
  rationale: συγγενής रक्त-संबंधी, व्यापक अर्थ में स्वजन, अथवा राजनयिक संदर्भ में सम्मानित सहयोगी को सूचित कर सकता है। ‘संबंधी’ मूल की अस्पष्टता को पर्याप्त रूप से बनाए रखता है, जबकि पादटिप्पणी दरबारी अर्थ बताती है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: περί के साथ संबंधकारक का सामान्य अर्थ ‘के विषय में’ है। यह ‘तुम्हारी ओर से’ जैसा पक्षसमर्थक अर्थ अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: हमने तुम्हें भी भेजी है
  rationale: शाब्दिक रूप से यह ‘हमने तुम्हें भी लिखी है’ है, पर पत्र की प्रति के संदर्भ में हिन्दी में ‘भेजी है’ आशय को स्वाभाविक रूप से व्यक्त करता है। पूर्णकाल वर्तमान प्रासंगिकता सहित पूरे किए गए कार्य को दर्शाता है।
- source_word: ὅπως ἰδῆτε
  choice: ताकि तुम उसे देख सको
  rationale: ὅπως और संभावनार्थक क्रिया उद्देश्य व्यक्त करते हैं। ‘उसे’ का संदर्भ पत्र की प्रति से है और हिन्दी में आवश्यक स्पष्टता देता है।
