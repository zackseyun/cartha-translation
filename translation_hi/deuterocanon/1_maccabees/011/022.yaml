base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: hi
  text: जब उसने यह सुना, तो वह क्रोधित हुआ। सुनते ही वह तुरंत छावनी उठाकर पतुलिमैस आया। फिर उसने योनातान को लिखा कि वह घेराबंदी जारी न रखे[a], बल्कि यथाशीघ्र पतुलिमैस आकर उससे मिले और उसके साथ विचार-विमर्श करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘चारों ओर बैठे न रहना’ या ‘चारों ओर टिके न रहना’ है; इस प्रसंग में आशय घेराबंदी जारी न रखने से है।
    reason: lexical_alternative
  - marker: b
    text: 'मिलने से संबंधित यूनानी वाक्यांश पाठगत और व्याकरणिक रूप से असहज है: लगभग ‘उससे मिलने, उसके साथ मिल जाने’ के अर्थ में। यहाँ संभावित आशय यह है कि योनातान पतुलिमैस जाकर उससे मिले और विचार-विमर्श करे।'
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: जब उसने यह सुना / सुनते ही
  rationale: यूनानी पाठ में सुनने की क्रिया दोहराई गई है। हिन्दी में भी पुनरावृत्ति रखी गई है, जबकि दूसरी अभिव्यक्ति तत्काल प्रतिक्रिया पर बल देती है।
- source_word: ὠργίσθη
  choice: वह क्रोधित हुआ
  rationale: यह यूनानी क्रिया के सामान्य अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है और रोष की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: εὐθέως
  choice: तुरंत
  rationale: स्पष्ट आधुनिक हिन्दी में तत्काल कार्रवाई का भाव देता है।
- source_word: ἀναζεύξας
  choice: छावनी उठाकर
  rationale: सैन्य संदर्भ में इसका ठोस अर्थ पड़ाव या छावनी समेटकर प्रस्थान करना है।
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: पतुलिमैस आया
  rationale: गति और गंतव्य का सीधा अनुवाद; स्थान-नाम का रूप हिन्दी बाइबलीय पठन के अनुकूल लिप्यंतरित है।
- source_word: ἔγραψεν Ἰωναθὰν
  choice: उसने योनातान को लिखा
  rationale: यूनानी में संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘को लिखा’ द्वारा व्यक्त किया गया है।
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: वह घेराबंदी जारी न रखे
  rationale: शाब्दिक अर्थ चारों ओर बैठे या टिके रहने का है, पर सैन्य प्रसंग में यह घेराबंदी बनाए रखने की ओर संकेत करता है।
- source_word: ἀπαντῆσαι
  choice: उससे मिले
  rationale: बुलावे के प्रसंग में मिलने या भेंट करने का सामान्य अर्थ।
- source_word: αὐτὸν αὐτῷ συνμίσγειν
  choice: उसके साथ विचार-विमर्श करे
  rationale: प्रेषित यूनानी वाक्यांश व्याकरण की दृष्टि से असहज है। यह चयन साथ आने और परामर्श करने के संभावित आशय को स्वाभाविक हिन्दी में रखता है, जबकि पाठगत कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: τὴν ταχίστην
  choice: यथाशीघ्र
  rationale: अधिकतम शीघ्रता व्यक्त करने वाला संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी प्रयोग।
