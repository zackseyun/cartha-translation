lexical_decisions:
- source_word: Ἀλέξανδρος ὁ βασιλεὺς
  choice: राजा सिकन्दर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप ‘सिकन्दर’ लिया गया है और उपाधि को स्वाभाविक हिन्दी क्रम में उसके पहले रखा गया है।
- source_word: ἦν ἐν Κιλικίᾳ
  choice: किलिकिया में था
  rationale: ἐν का सरल स्थानवाचक अर्थ रखा गया है और Κιλικία का देवनागरी लिप्यंतरण किया गया है।
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: उन दिनों
  rationale: यह बहुवचन कालवाचक पदबंध का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ संयोजक सिकन्दर के किलिकिया में होने का कारण प्रस्तुत करता है।
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: उस क्षेत्र के लोग
  rationale: ग्रीक का शाब्दिक अर्थ ‘उन स्थानों से [आने] वाले’ है; सन्दर्भ में स्थानीय निवासियों के लिए यह स्पष्ट, स्वाभाविक हिन्दी है और τόπων के बहुवचन को सामूहिक ‘क्षेत्र’ से व्यक्त करता है।
- source_word: ἀπεστάτουν
  choice: विद्रोह कर रहे थे
  rationale: अपूर्ण भूतकाल चल रहे विद्रोह को दर्शाता है; ‘विद्रोह कर रहे थे’ उसकी कालगत और राजनीतिक शक्ति को बनाए रखता है।
