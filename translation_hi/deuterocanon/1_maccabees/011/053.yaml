  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: hi
  text: और उसने जो कुछ कहा था, उस सब में वह झूठा निकला[a]; वह योनातान से विमुख हो गया और योनातान ने उस पर जो उपकार किए थे, उनका प्रत्युपकार उसने नहीं किया, और उसे बहुत सताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपनी कही हुई हर बात में झूठ बोला” अथवा “उसने अपनी हर बात में छल किया।” यूनानी क्रिया वाणी में झूठ बोलने या अधिक व्यापक रूप से कपटपूर्ण व्यवहार करने पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψεύσατο πάντα ὅσα εἶπεν
  choice: उसने जो कुछ कहा था, उस सब में वह झूठा निकला
  rationale: यह अनुवाद यूनानी क्रिया के वाणी-संबंधी झूठ और व्यापक कपट—दोनों संभावित अर्थों को समेटते हुए πάντα ὅσα की व्यापकता बनाए रखता है।
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: वह योनातान से विमुख हो गया
  rationale: ἠλλοτριώθη संबंध-विच्छेद या पराया हो जाने का भाव देता है; ‘विमुख हो गया’ स्वाभाविक हिन्दी में इसे व्यक्त करता है, बिना अनिवार्य रूप से खुली शत्रुता जोड़ने के।
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: कृपाओं का बदला उसने नहीं चुकाया
  rationale: ἀνταποδίδωμι के प्रत्युत्तर में लौटाने के भाव और εὐνοίαι के ठोस हितकारी कार्यों को सुरक्षित रखा गया है।
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: योनातान ने उस पर जो कृपाएँ की थीं
  rationale: संदर्भ से कर्ता योनातान स्पष्ट किया गया है। शाब्दिक पुनरावृत्ति हिन्दी में भ्रामक होती, इसलिए आशय को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: उसे बहुत सताया
  rationale: राजनीतिक संदर्भ में ἔθλιψεν दबाने, पीड़ित करने या सताने का अर्थ देता है; ‘बहुत सताया’ सरल, वर्तमान और तीव्रता-संगत हिन्दी है।
