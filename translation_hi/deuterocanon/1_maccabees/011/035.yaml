translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध प्रशासनिक हिन्दी। मूल में ἀνήκοντα की पुनरावृत्ति का भाव ‘हमारे अधिकार में’ और ‘हमें देय’ के द्वारा रखा गया है, पर शब्दशः दोहराव से उत्पन्न अस्वाभाविकता से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
