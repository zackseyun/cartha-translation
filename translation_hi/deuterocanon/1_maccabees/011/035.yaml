base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: hi
  text: और अब से जो अन्य वस्तुएँ हमारी हैं—हमारे दशमांश और कर, नमक की झीलें[a], और हमारे मुकुट[b]—ये सब हम उन्हें प्रदान करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नमक के ताल’ अथवा ‘नमक बनाने के स्थान’; यूनानी में शाब्दिक रूप से ‘नमक की झीलें’ है। संभवतः इसका आशय नमक पैदा करनेवाले स्रोतों या उनसे होनेवाली आय से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘मुकुट’। इस राजस्व-संबंधी प्रसंग में इसका आशय राजा को दी जानेवाली प्रथागत मुकुट-भेंट या सम्मानस्वरूप भुगतान भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα τὰ ἀνήκοντα ἡμῖν
  choice: हमारे अधिकार में आनेवाली दूसरी सब चीज़ें
  rationale: यह वाक्यांश पहले उल्लिखित मदों के अतिरिक्त राजा के अधिकार या उसे देय राजस्व की खुली श्रेणी बताता है। ‘अधिकार में आनेवाली’ कानूनी-राजस्व संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: राजकीय आदेश के तत्काल प्रभाव से आगे लागू होने का स्पष्ट और स्वाभाविक संकेत।
- source_word: δεκατῶν
  choice: दशमांश
  rationale: राजस्व के रूप में दिए जानेवाले दसवें भाग के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: τελῶν τῶν ἀνηκόντων ἡμῖν
  choice: हमें देय कर
  rationale: τέλη व्यापक रूप से कर, चुंगी या अन्य शुल्क को सूचित कर सकता है। ‘कर’ स्पष्ट व्यापक पद है और ‘हमें देय’ राजकीय दावे की शक्ति बनाए रखता है।
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: नमक की झीलें
  rationale: यूनानी का शाब्दिक अर्थ ‘नमक की झीलें’ है। संभवतः नमक पैदा करनेवाले स्रोत या उनसे मिलनेवाला राजस्व अभिप्रेत है; मुख्य पाठ में मूर्त रूप रखते हुए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: τοὺς ἀνήκοντας ἡμῖν στεφάνους
  choice: हमें देय मुकुट
  rationale: στέφανοι का शाब्दिक अर्थ ‘मुकुट’ है, पर हेलेनिस्ती राजकीय संदर्भ में यह राजा को मुकुट के रूप में दी जानेवाली सम्मान-भेंट या उससे जुड़े भुगतान को भी सूचित कर सकता है। शाब्दिक शब्द मुख्य पाठ में और राजस्व-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: ये सब हम उन्हें प्रदान करेंगे
  rationale: इस राजकीय रियायत के संदर्भ में क्रिया इन अधिकारों या राजस्वों को उनके लिए उपलब्ध कराने अथवा उन्हें सौंपने का भाव देती है। ‘प्रदान करेंगे’ मूल की कुछ व्यापकता बनाए रखता है।
