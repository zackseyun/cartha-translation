  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: hi
  text: और उसने उसके पास सोने के पात्र[a] और सेवा-सामग्री[b] भेजी, और उसे सोने के पात्रों से पीने, बैंगनी वस्त्र पहनने और सोने का वस्त्र-बन्ध[c] लगाने का अधिकार दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सोने की वस्तुएँ’ अथवा ‘सोने के बर्तन’; यूनानी शब्द χρυσώματα दोनों स्थानों पर आया है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ ‘सेवा की व्यवस्था’ या ‘सेवा करने वाले परिचारक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात वस्त्र को बाँधने वाला सोने का अलंकार; इसे ‘सोने की अलंकार-पिन’, ‘ब्रोच’ या ‘क्लैस्प’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: सोने के पात्र
  rationale: बहुवचन शब्द सोने से बनी वस्तुओं को दर्शाता है। पीने के प्रसंग में ‘पात्र’ उपयुक्त है, पर यह केवल प्यालों तक अर्थ को सीमित नहीं करता।
- source_word: διακονίαν
  choice: सेवा-सामग्री
  rationale: सोने के पात्रों के साथ इसका प्रयोग राजकीय भोजन-सेवा की सामग्री या व्यवस्था की ओर संकेत करता है। ‘सेवा-सामग्री’ उपकरणों के अर्थ को सामने रखता है और निजी सेवकों का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह राजा द्वारा दी गई औपचारिक अनुमति अथवा विशेषाधिकार को व्यक्त करता है। ‘अधिकार’ इस राजकीय स्वीकृति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: πίνειν ἐν χρυσώμασιν
  choice: सोने के पात्रों से पीने
  rationale: यूनानी मुहावरा सोने के पीने के पात्रों का उपयोग करने को दर्शाता है। यह अनुवाद ठोस चित्र बनाए रखता है और पात्रों को केवल प्याले नहीं मानता।
- source_word: εἶναι ἐν πορφύρᾳ
  choice: बैंगनी वस्त्र पहनने
  rationale: वाक्यांश उच्च पद या राजकीय सम्मान से जुड़े बैंगनी वस्त्र धारण करने का संकेत देता है। सरल हिन्दी में मुहावरे का आशय स्पष्ट किया गया है।
- source_word: πόρπην χρυσῆν
  choice: सोने का वस्त्र-बन्ध
  rationale: πόρπη वस्त्र को बाँधने वाला अलंकारिक क्लैस्प, ब्रोच या फिबुला था। ‘वस्त्र-बन्ध’ उसके कार्य को स्पष्ट करता है और आधुनिक बकसुए की किसी एक बनावट को आरोपित नहीं करता।
