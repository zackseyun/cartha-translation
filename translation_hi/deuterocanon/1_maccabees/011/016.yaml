  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: hi
  text: और सिकन्दर अरब प्रदेश में भाग गया, ताकि वहाँ उसे शरण मिले[a]; परन्तु राजा टॉलेमी ऊँचा उठाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताकि वहाँ उसे छिपा लिया जाए” अथवा “ताकि वहाँ उसकी रक्षा की जाए।” यूनानी अभिव्यक्ति आश्रय, छिपाव या सुरक्षा का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका उत्कर्ष हुआ” अथवा “वह शक्तिशाली हो गया।” यूनानी में अधिक शाब्दिक अर्थ “ऊँचा उठाया गया” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: φεύγω का अओरिस्ट रूप यहाँ सैन्य-राजनीतिक पराजय के बाद पलायन को दर्शाता है; ‘भाग गया’ सरल और सटीक है।
- source_word: Ἀραβίαν
  choice: अरब प्रदेश
  rationale: Ἀραβία स्थानवाचक नाम है। ‘अरब प्रदेश’ आधुनिक हिन्दी पाठक के लिए स्वाभाविक है और प्राचीन भौगोलिक क्षेत्र का बोध कराता है।
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: ताकि वहाँ उसे शरण मिले
  rationale: τοῦ के साथ निष्क्रिय अनंत क्रिया उद्देश्य व्यक्त करती है। σκεπάζω ढकने, छिपाने, आश्रय देने या रक्षा करने का अर्थ दे सकता है; ‘उसे शरण मिले’ निष्क्रिय भाव और संदर्भगत आश्रय को स्वाभाविक हिन्दी में रखता है।
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: परन्तु राजा टॉलेमी
  rationale: δέ यहाँ सिकन्दर के पलायन और टॉलेमी के उत्कर्ष के बीच विरोध दिखाता है; इसलिए ‘परन्तु’ उपयुक्त है।
- source_word: ὑψώθη
  choice: ऊँचा उठाया गया
  rationale: ὑψόω के निष्क्रिय रूप का शाब्दिक अर्थ ऊँचा उठाया जाना है। यह अनुवाद राजनीतिक शक्ति, प्रतिष्ठा अथवा सफलता—इनमें से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: राजकीय-राजनीतिक संदर्भ में ὑψώθη का अनुवाद
  choice: ऊँचा उठाया गया
  alternative: प्रतापी हो गया; शक्तिशाली हो गया; उसका उत्कर्ष हुआ
  rationale: मूल क्रिया का निष्क्रिय और ऊर्ध्वगामी रूपक बनाए रखने से राजनीतिक उन्नति, सम्मान और सफलता के बीच की अर्थगत व्यापकता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘टॉलेमी’ नाम का प्रचलित हिन्दी रूप है। मुख्य पाठ में मूल यूनानी की निष्क्रियता और अर्थगत तनाव यथासंभव सुरक्षित रखा गया है।
