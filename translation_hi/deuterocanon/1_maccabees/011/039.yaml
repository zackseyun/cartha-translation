  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: hi
  text: त्रूफ़ोन पहले सिकन्दर के साथियों में से था। जब उसने देखा कि सभी सैन्य दल देमेत्रियुस के विरुद्ध बड़बड़ा रहे थे, तो वह अरबवासी सिम्माकूएस के पास गया, जो सिकन्दर के छोटे बालक अन्तियोखुस[a] का पालन-पोषण कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
