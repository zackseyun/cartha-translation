- source_word: τῶν παρὰ Ἀλεξάνδρου τὸ πρότερον
  choice: पहले सिकन्दर के साथियों में से था
  rationale: παρά के इस प्रयोग में सिकन्दर के पक्ष अथवा मंडली से संबंध व्यक्त होता है; यह अनुवाद किसी विशिष्ट पद का अनुमान नहीं लगाता।
- source_word: πᾶσαι αἱ δυνάμεις
  choice: सारी सेना
  rationale: सैन्य प्रसंग में δυνάμεις सशस्त्र सैन्यबल को दर्शाता है; सहज हिन्दी में सामूहिक एकवचन स्रोत के व्यापक अर्थ को पर्याप्त रूप से व्यक्त करता है।
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: देमेत्रियुस के विरुद्ध कुड़कुड़ा रही है
  rationale: क्रिया दबे स्वर में असंतोष प्रकट करने को और κατά विरोध की दिशा को व्यक्त करता है।
- source_word: Σιμμάκουην τὸν Ἄραβα
  choice: अरबवासी सिम्माकूएस
  rationale: नाम का यूनानी रूपानुसार लिप्यंतरण और जातीय पहचान का स्वाभाविक हिन्दी रूप।
- source_word: ἔτρεφεν
  choice: पालन-पोषण कर रहा था
  rationale: τρέφω यहाँ बच्चे की देखभाल और परवरिश दोनों को समेटता है।
- source_word: τὸ παιδάριον τὸ τοῦ Ἀλεξάνδρου
  choice: सिकन्दर के छोटे बालक अन्तियोखुस
  rationale: παιδάριον की अल्पायु-सूचक छाया सुरक्षित रखी गई है और यूनानी की संबंधसूचक संक्षिप्तता को मुख्य पाठ में बनाए रखा गया है।
