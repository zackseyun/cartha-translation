translation:
  language: hi
  text: और अरब ज़ब्दीएल ने सिकन्दर का सिर काटकर टॉलेमी को भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεῖλεν
  choice: काटकर
  rationale: κεφαλή को कर्म के रूप में लेने पर क्रिया का अर्थ सिर को धड़ से अलग करना है। हिंदी में ‘सिर काटकर’ प्रसंग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ζαβδιὴλ
  choice: ज़ब्दीएल
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ὁ Ἀραβ
  choice: अरबी
  rationale: यह ज़ब्दीएल की जातीय पहचान बताने वाला विशेषणात्मक पद है; आधुनिक हिंदी में ‘अरबी ज़ब्दीएल’ संक्षिप्त और स्वाभाविक है।
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: सिकन्दर का सिर
  rationale: यूनानी संबंधकारक को हिंदी के संबंधबोधक ‘का’ से व्यक्त किया गया है। Ἀλέξανδρος के लिए हिंदी में प्रचलित नाम ‘सिकन्दर’ चुना गया है।
- source_word: ἀπέστειλεν
  choice: भेज दिया
  rationale: कथात्मक संदर्भ में यह साधारण भेजने की क्रिया है; ‘भेज दिया’ पूर्ण हुई क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῷ Πτολεμαίῳ
  choice: टॉलेमी के पास
  rationale: यूनानी सम्प्रदान का लक्ष्य हिंदी में व्यक्ति के साथ स्वाभाविक ‘के पास’ द्वारा व्यक्त किया गया है। मूल में ‘राजा’ उपाधि नहीं है, इसलिए उसे नहीं जोड़ा गया।
