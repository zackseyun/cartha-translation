  yaml_path: translation/deuterocanon/1_maccabees/011/029.yaml
  text: 'And the king approved[a], and wrote letters to Jonathan concerning all these things, having this form:'
translation:
  language: hi
  text: और राजा ने इसे स्वीकार कर लिया और इन सब बातों के संबंध में योनातान को पत्र लिखे, जिनका स्वरूप इस प्रकार था:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके शब्द इस प्रकार थे।” यूनानी में शाब्दिक अर्थ है, “जिनका स्वरूप इस प्रकार था।”
    reason: मूल वाक्यांश पत्रों के स्वरूप अथवा आगे दिए गए शब्दों—दोनों की ओर संकेत कर सकता है; वैकल्पिक अनुवाद इस सूक्ष्मता को दिखाता है।
lexical_decisions:
- source_word: εὐδόκησεν
  choice: इसे स्वीकार कर लिया
  rationale: यह क्रिया पिछले प्रस्ताव या निवेदन के प्रति राजा की अनुकूल स्वीकृति व्यक्त करती है। प्रशासनिक संदर्भ में यह स्वाभाविक है और केवल भावनात्मक प्रसन्नता का अर्थ नहीं देती।
- source_word: ἔγραψεν
  choice: पत्र लिखे
  rationale: क्रिया का सीधा अर्थ ‘लिखा’ है; बहुवचन कर्म ἐπιστολάς के साथ हिन्दी में ‘पत्र लिखे’ सहज और सटीक है।
- source_word: ἐπιστολάς
  choice: पत्र
  rationale: यूनानी में यह स्पष्ट रूप से बहुवचन है; हिन्दी में क्रिया ‘लिखे’ बहुवचन को प्रकट करती है और आधिकारिक लिखित संदेशों के लिए ‘पत्र’ उपयुक्त है।
- source_word: περὶ πάντων τούτων
  choice: इन सब बातों के संबंध में
  rationale: यह पिछले प्रसंग की माँगों या व्यवस्थाओं की ओर संकेत करता है। यह चयन मूल के व्यापक और औपचारिक आशय को बनाए रखता है।
- source_word: ἔχουσας τὸν τρόπον τοῦτον
  choice: जिनका स्वरूप इस प्रकार था
  rationale: यह यूनानी वाक्यांश के ‘यह रूप रखते हुए’ वाले अर्थ को निकटता से सुरक्षित रखता है और आगे आने वाले पत्र-पाठ की भूमिका भी स्वाभाविक ढंग से बाँधता है।
