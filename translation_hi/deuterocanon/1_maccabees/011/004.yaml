base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: hi
  text: पर जब वह अशदोद के निकट पहुँचा, तो उन्होंने उसे दागोन का जला हुआ मंदिर, अशदोद और उसके आसपास की ढहा दी गई बस्तियाँ[a], इधर-उधर पड़ी लाशें, और वे लोग जिन्हें उसने युद्ध में जला दिया था, दिखाए; क्योंकि उन्होंने उसके मार्ग के किनारे उनके ढेर[b] लगा दिए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके उपनगर” अथवा “उसके बाहरी इलाके।”
    reason: περιπόλια का अर्थ आसपास की बस्तियाँ, उपनगर या नगर से जुड़े बाहरी क्षेत्र हो सकता है।
  - marker: b
    text: दुर्लभ यूनानी शब्द βωμίας का ठीक आशय अनिश्चित है; इसका अर्थ “ढेर,” “टीले,” या सम्भवतः “चिताएँ” हो सकता है।
    reason: दुर्लभ शब्द के अर्थ और दृश्य की सटीक प्रकृति को लेकर मूल पाठ में अनिश्चितता है।
lexical_decisions:
- source_word: ἤγγισεν Ἄζωτον
  choice: अशदोद के निकट पहुँचा
  rationale: ἤγγισεν निकट आने को व्यक्त करता है, और अशदोद इस स्थान का आधुनिक हिन्दी में प्रचलित बाइबलीय नाम है।
- source_word: τὸ ἱερὸν Δαγὼν ἐνεπυρισμένον
  choice: दागोन का जला हुआ मंदिर
  rationale: ἱερόν यहाँ दागोन के उपासना-स्थल को सूचित करता है; कृदन्त उस मंदिर की जल चुकी दशा बताता है।
- source_word: τὰ περιπόλια αὐτῆς
  choice: उसके आसपास की बस्तियाँ
  rationale: περιπόλια नगर के चारों ओर की अधीनस्थ बस्तियों या बाहरी इलाकों को सूचित करता है; ‘बस्तियाँ’ प्राचीन संदर्भ में सहज और ठोस है।
- source_word: καθῃρημένα
  choice: ढहा दी गई
  rationale: यह बलपूर्वक गिराए या नष्ट किए जाने की परिणामी दशा व्यक्त करता है।
- source_word: τὰ σώματα ἐρριμμένα
  choice: इधर-उधर पड़ी लाशें
  rationale: युद्ध-विनाश के संदर्भ में σώματα मृत शरीर हैं, और ἐρριμμένα उनके अव्यवस्थित रूप से पड़े होने का चित्र देता है।
- source_word: τοὺς ἐμπεπυρισμένους οὓς ἐνεπύρισε ἐν τῷ πολέμῳ
  choice: उन लोगों के जले हुए शव ... जिन्हें उसने युद्ध में जला दिया था
  rationale: पूर्ण कृदन्त जला दिए गए व्यक्तियों की वर्तमान मृत दशा बताता है, जबकि संबंधवाचक उपवाक्य उनके जलाए जाने की घटना को स्पष्ट करता है।
- source_word: βωμίας
  choice: ढेर
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है; संदर्भ में शवों के ढेर सम्भावित हैं, पर ‘चिता’ जैसा अधिक विशिष्ट अर्थ मुख्य पाठ में थोपना उचित नहीं।
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: उसके मार्ग के किनारे
  rationale: वाक्यांश उस रास्ते को सूचित करता है जिससे वह जा रहा था और जहाँ ये ढेर उसे दिख सकते थे।
