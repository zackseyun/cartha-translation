base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: hi
  text: तब राजा ने यहूदियों को अपनी सहायता के लिए बुलाया, और वे सब एक साथ उसके पास इकट्ठे हो गए। वे नगर में फैल गए[a], और उस दिन उन्होंने नगर में दस हज़ार लोगों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘नगर में तितर-बितर हो गए’ है; यहाँ ‘फैल गए’ सम्भवतः युद्ध के लिए नगर में अलग-अलग फैल जाने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: καλέω के सामान्य कथात्मक अर्थ ‘बुलाना’ को सहज और सीधी हिन्दी में व्यक्त करता है।
- source_word: εἰς βοήθειαν
  choice: अपनी सहायता के लिए
  rationale: यह पदबंध बुलाने का उद्देश्य बताता है; सन्दर्भ से सहायता का लाभार्थी राजा है।
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठे हो गए
  rationale: क्रिया का निष्क्रिय/मध्यवाची भाव यहाँ उनके एक स्थान पर एकत्र होने को दर्शाता है।
- source_word: πάντες ἅμα
  choice: वे सब एक साथ
  rationale: πάντες और ἅμα, दोनों के बल को रखते हुए सम्पूर्णता और सामूहिकता व्यक्त करता है।
- source_word: διεσπάρησαν
  choice: फैल गए
  rationale: मूल क्रिया बिखरने या अलग-अलग दिशाओं में फैलने का बोध देती है; युद्ध के प्रसंग में ‘फैल गए’ स्वाभाविक है, जबकि शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: हत्या/वध की पूर्ण क्रिया को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: εἰς μυριάδας δέκα
  choice: दस हज़ार
  rationale: ग्रीक संख्या-वाक्यांश का सन्दर्भानुकूल स्वाभाविक संख्यात्मक रूप है।
