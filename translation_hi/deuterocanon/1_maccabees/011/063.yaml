    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: ने सुना
  rationale: यह प्रत्यक्ष और स्वाभाविक अनुवाद है तथा समाचार मिलने का भाव बनाए रखता है।
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: देमेत्रियुस के सेनापति
  rationale: सैन्य बल के साथ आने के संदर्भ में ἄρχοντες यहाँ नागरिक शासकों की अपेक्षा सैन्य अधिकारियों को सूचित करता है।
- source_word: παρῆσαν
  choice: आ पहुँचे थे
  rationale: क्रिया आगमन के परिणामस्वरूप वहाँ उपस्थित होने का भाव देती है; हिन्दी में यह पूर्वकालिक स्थिति को सहजता से व्यक्त करता है।
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: गलील के केदेश में
  rationale: यह स्थानवाचक पद केदेश को गलील में स्थित उसी नाम के नगर के रूप में पहचानता है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: एक बड़ी सेना के साथ
  rationale: सैन्य आख्यान में δύναμις सशस्त्र सैन्य बल को दर्शाता है; 'बड़ी सेना' सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: βουλόμενοι
  choice: चाहते थे
  rationale: वर्तमान कृदन्त सेनापतियों की मंशा व्यक्त करता है; यह हिन्दी में सहज रूप से मुख्य क्रिया से जुड़ता है।
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: उसे उसके पद से हटाना
  rationale: μεταστῆσαι हटाने या पदच्युत करने और χρεία सौंपे गए कार्य, सेवा या पद का बोध करा सकता है। मुख्य पाठ में 'पद से हटाना' राजनीतिक-सैन्य संदर्भ के अनुकूल है, जबकि पादटिप्पणी अर्थ-सीमा सुरक्षित रखती है।
