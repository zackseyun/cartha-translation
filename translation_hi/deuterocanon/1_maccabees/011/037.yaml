lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदबंध निष्कर्ष या पिछले कथन से संबंध रखते हुए नए निर्देश की ओर संक्रमण करता है। ‘इसलिए अब’ दोनों भावों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐπιμελεῖσθε
  choice: ध्यान रखो
  rationale: मध्यमवाच्य बहुवचन आज्ञार्थक रूप काम को सावधानी और जिम्मेदारी से पूरा कराने का निर्देश देता है।
- source_word: τοῦ ποιῆσαι τούτων ἀντίγραφον
  choice: कि इन बातों की एक प्रति तैयार की जाए
  rationale: ἀντίγραφον किसी लिखित दस्तावेज़ की प्रति है और τούτων बहुवचन में पूर्वोक्त विषय-वस्तु को सूचित करता है। निष्क्रिय हिन्दी रचना आगे आने वाले निष्क्रिय निर्देशों के औपचारिक स्वर से मेल खाती है।
- source_word: δοθήτω Ἰωνάθαν
  choice: वह योनातान को दी जाए
  rationale: अओरिस्ट निष्क्रिय आज्ञार्थक का औपचारिक निर्देशात्मक बल ‘दी जाए’ से सुरक्षित रहता है; Ἰωνάθαν का प्रचलित हिन्दी रूप ‘योनातान’ रखा गया है।
- source_word: τεθήτω
  choice: रखी जाए
  rationale: निष्क्रिय आज्ञार्थक किसी दस्तावेज़ को आधिकारिक रूप से निर्धारित स्थान पर रखने का निर्देश देता है।
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: पवित्र पर्वत पर
  rationale: स्थलवाचक प्रयोग में ἐν का स्वाभाविक हिन्दी रूप ‘पर’ है; ‘पवित्र पर्वत’ यूनानी पद की व्यापकता बनाए रखता है और स्थान की पहचान को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: किसी प्रमुख स्थान पर
  rationale: ἐπίσημος ऐसे स्थान का भाव देता है जो अलग से पहचाना जाता हो या लोगों की दृष्टि में आता हो। ‘प्रमुख’ मूल की अर्थ-व्याप्ति को संक्षेप में रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
