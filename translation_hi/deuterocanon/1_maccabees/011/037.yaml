    text: या, ‘ऐसे स्थान पर जो स्पष्ट रूप से दिखाई दे।’ यूनानी विशेषण ऐसे स्थान का संकेत भी दे सकता है जो लोगों की दृष्टि में आए या विशेष रूप से चिह्नित हो।
