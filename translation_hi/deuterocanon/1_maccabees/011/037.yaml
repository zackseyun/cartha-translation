  text: इसलिए अब इन बातों की एक प्रति तैयार करने का ध्यान रखो; वह योनातान को दी जाए और पवित्र पर्वत पर एक प्रमुख स्थान[a] पर रखी जाए।
  philosophy: optimal-equivalence
  footnotes:
