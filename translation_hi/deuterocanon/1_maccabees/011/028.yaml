base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: hi
  text: और योनातान ने राजा से अनुरोध किया कि वह यहूदिया, तीनों प्रशासनिक जिलों[a] और सामरिया को कर-मुक्त कर दे; और उसने राजा को तीन सौ तोड़े देने का वचन दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ‘तोपार्खिया’ किसी प्रशासनिक क्षेत्र या जिले के लिए प्रयुक्त एक विशेष शासकीय शब्द था।
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: अनुरोध किया
  rationale: राजा के सामने रखी गई औपचारिक माँग के लिए यह स्वाभाविक और संतुलित है; ‘माँग की’ अपेक्षाकृत कठोर हो सकता है।
- source_word: ποιῆσαι
  choice: कर दे
  rationale: यह राजा द्वारा इन क्षेत्रों की कर-संबंधी स्थिति बदलने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: ἀφορολόγητον
  choice: कर-मुक्त
  rationale: यह कर अथवा राजस्व से छूट का अर्थ संक्षेप और स्पष्ट रूप में देता है।
- source_word: τὰς τρεῖς τοπαρχίας
  choice: तीनों प्रशासनिक जिलों
  rationale: तकनीकी प्रादेशिक अर्थ को साधारण पाठकों के लिए समझने योग्य हिन्दी में रखा गया है।
- source_word: τὴν Σαμαρῖτιν
  choice: सामरिया
  rationale: यह क्षेत्र का प्रचलित हिन्दी भौगोलिक नाम है।
- source_word: ἐπηγγείλατο
  choice: वचन दिया
  rationale: मध्यवाच्य क्रिया के ‘प्रतिज्ञा/वचन देना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τάλαντα τριακόσια
  choice: तीन सौ तोड़े
  rationale: प्राचीन भार और मुद्रा-इकाई को अनुमानित आधुनिक मुद्रा में बदलने के बजाय हिन्दी बाइबलीय परंपरा का परिचित शब्द रखा गया है।
