  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। अस्पष्ट सर्वनाम से बचने के लिए दूसरे खंड में ‘राजा को’ स्पष्ट किया गया है; यूनानी प्रसंग में वचन देने वाला योनातान और प्राप्तकर्ता राजा है।
