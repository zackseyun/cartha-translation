lexical_decisions:
- source_word: ἐψόγισεν
  choice: दोषी ठहराया
  rationale: ψογίζω का अर्थ दोष लगाना, निंदा करना या भर्त्सना करना है। यहाँ ‘दोषी ठहराया’ व्यक्तिगत आरोप का भाव रखता है, पर इसे औपचारिक न्यायिक दंड या अत्यधिक कठोर फटकार नहीं बनाता।
- source_word: χάριν τοῦ
  choice: इस बात के लिए कि
  rationale: χάριν के साथ articular infinitive कारण व्यक्त करता है। ‘इस बात के लिए कि’ आधुनिक हिन्दी में उस कारण को स्पष्ट और स्वाभाविक ढंग से जोड़ता है।
- source_word: ἐπιθυμῆσαι
  choice: इच्छा रखता था
  rationale: ἐπιθυμέω सामान्य ‘इच्छा करना’ से लेकर नकारात्मक ‘लालच करना’ तक अर्थ दे सकता है। राजनीतिक संदर्भ नकारात्मक भाव देता है, फिर भी मुख्य पाठ में अपेक्षाकृत तटस्थ अर्थ रखकर अधिक प्रबल विकल्प को पादटिप्पणी में दिया गया है।
- source_word: τῆς βασιλείας
  choice: राज्य
  rationale: βασιλεία राज्य, राजसत्ता या शासन को सूचित कर सकता है। यहाँ किसी दूसरे शासक के राजकीय अधिकार-क्षेत्र के लिए ‘राज्य’ सबसे सीधा और सामान्य हिन्दी रूप है।
- source_word: αὐτὸν ... αὐτοῦ
  choice: उसे ... उसके
  rationale: यूनानी में सर्वनामों का संदर्भ संक्षिप्त और कुछ हद तक अस्पष्ट है। हिन्दी में ‘उसे ... उसके’ उसी संरचना और वास्तविक संदर्भगत अस्पष्टता को बनाए रखता है।
