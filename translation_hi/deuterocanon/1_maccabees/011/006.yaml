translation:
  language: hi
  text: और योनातान योप्पा में सम्मान के साथ राजा से मिला। उन्होंने एक-दूसरे का अभिवादन किया और वहीं रात बिताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήντησεν
  choice: मिला
  rationale: यह क्रिया यहाँ योनातान और राजा की भेंट को व्यक्त करती है। ‘मिला’ स्वाभाविक हिन्दी है और किसने भेंट की पहल की, इसे अनावश्यक रूप से निश्चित नहीं करती।
- source_word: εἰς Ἰόππην
  choice: योप्पा में
  rationale: भेंट की क्रिया के साथ εἰς और स्थान का नाम उस जगह को सूचित कर सकता है जहाँ भेंट हुई। आधुनिक हिन्दी में ‘योप्पा में’ सहज है।
- source_word: μετὰ δόξης
  choice: बड़े सम्मान के साथ
  rationale: राजनयिक प्रसंग में δόξα का भाव प्रतिष्ठा और सम्मान का है। ‘बड़े सम्मान के साथ’ औपचारिक स्वागत या सम्मानपूर्ण भेंट का भाव स्पष्ट करता है, बिना ‘महिमा’ जैसे धर्मवैज्ञानिक अर्थ को आरोपित किए।
- source_word: ἠσπάσαντο ἀλλήλους
  choice: उन्होंने एक-दूसरे का अभिवादन किया
  rationale: ἀσπάζομαι सामान्यतः अभिवादन या स्वागत करने को दर्शाता है। ‘अभिवादन किया’ सटीक है और आलिंगन जैसी किसी विशिष्ट शारीरिक क्रिया को नहीं जोड़ता।
- source_word: ἐκοιμήθησαν
  choice: रात बिताई
  rationale: यात्रा-वृत्तांत में यह क्रिया शाब्दिक ‘सोए’ से आगे बढ़कर किसी स्थान पर रात ठहरने का भाव देती है। ‘रात बिताई’ आधुनिक हिन्दी में वही कथात्मक अर्थ सहजता से व्यक्त करती है।
