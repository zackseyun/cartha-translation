lexical_decisions:
- source_word: ὡς δὲ
  choice: और जब
  rationale: यह कथा में अगले घटनाक्रम को जोड़ते हुए समय-संबंध व्यक्त करता है। आधुनिक हिन्दी में ‘और जब’ संयोजक और कालगत दोनों भाव स्वाभाविक रूप से देता है।
- source_word: εἰσεπορεύετο
  choice: प्रवेश करता गया
  rationale: अपूर्णकालिक क्रिया अनेक नगरों में क्रमिक या जारी प्रवेश का संकेत देती है; ‘प्रवेश करता गया’ इस पुनरावृत्तिशील गति को स्पष्ट करता है।
- source_word: εἰς τὰς πόλεις Πτολεμαΐς
  choice: टॉलेमी के अधीन नगरों में
  rationale: यूनानी पदबंध व्याकरण की दृष्टि से संक्षिप्त और असामान्य है। प्रसंग में इसे टॉलेमी के अधिकार या नियंत्रण वाले नगरों के अर्थ में लेना सर्वाधिक संगत है, पर मूल की कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀπετάσσε
  choice: तैनात कर दिया
  rationale: सैन्य प्रसंग में क्रिया का अर्थ सैनिकों को निश्चित स्थान और कार्य पर नियुक्त करना है; ‘तैनात कर दिया’ आधुनिक हिन्दी का स्वाभाविक सैन्य प्रयोग है।
- source_word: τὰς δυνάμεις
  choice: सैनिकों
  rationale: यहाँ शब्द संगठित सैन्य बल को दर्शाता है। हिन्दी में ‘सैनिकों’ से आशय साफ रहता है और अनेक पूर्ण सेनाओं का अनावश्यक संकेत नहीं मिलता।
- source_word: φρουράν
  choice: रक्षक-दल के रूप में
  rationale: यह आरोपित भूमिका बताता है जिसके लिए सैनिक रखे गए थे। ‘रक्षक-दल’ नगर में सुरक्षा हेतु नियुक्त सैन्य टुकड़ी का कार्य स्पष्ट करता है।
- source_word: ἐν ἑκάστῃ πόλει
  choice: हर नगर में
  rationale: यह वितरणात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और प्रत्येक नगर में अलग तैनाती का अर्थ बनाए रखता है।
