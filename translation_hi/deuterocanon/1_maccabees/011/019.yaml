- source_word: ἐβασίλευσεν
  choice: राजा बना
  rationale: यहाँ βασιλεύω का भूतकालीन रूप देमेत्रियुस के राजसिंहासन पर बैठने को सूचित करता है। काल-सूचना के साथ ‘राजा बना’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत आरंभ-बिंदु को स्पष्ट रखता है।
- source_word: Δημήτριος
