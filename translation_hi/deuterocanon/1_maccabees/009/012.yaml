  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: hi
  text: परन्तु बक्कीदीस दाहिने मोर्चे[a] पर था। युद्ध-पंक्ति दोनों ओर से निकट आ गई[b], और वे तुरहियाँ बजा रहे थे; यहूदा के साथ के लोगों ने भी तुरहियाँ बजाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘दाहिने सींग में’ है; यह सेना के दाहिने पक्ष या मोर्चे के लिए प्रयुक्त सैन्य अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘दोनों पक्षों से निकट आ गई।’
    reason: translation_alternative
lexical_decisions:
- source_word: Βακχίδης
  choice: बक्खिदेस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: दाहिने मोर्चे पर
  rationale: κέρας का शाब्दिक अर्थ ‘सींग’ है, पर सैन्य संदर्भ में यह सेना के दाहिने पक्ष या मोर्चे को दर्शाता है; ‘दाहिना मोर्चा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἤγγισεν
  choice: निकट आ गई
  rationale: ἐγγίζω के निकट आने के अर्थ को सरल और स्पष्ट हिन्दी में रखा गया है।
- source_word: ἡ φάλαγξ
  choice: युद्ध-पंक्ति
  rationale: φάλαγξ एक संगठित सैन्य संरचना है। ‘युद्ध-पंक्ति’ सामान्य पाठक के लिए बोधगम्य रहते हुए सैन्य अर्थ बनाए रखती है।
- source_word: ἐκ τῶν δύο μερῶν
  choice: दोनों ओर से
  rationale: यह पदबंध दो पक्षों या दिशाओं से आगे बढ़ने का भाव देता है; सम्भावित सामरिक अर्थ को बिना अनावश्यक रूप से घेराबंदी ठहराए सुरक्षित रखा गया है।
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: वे तुरहियाँ बजा रहे थे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को ‘बजा रहे थे’ से व्यक्त किया गया है; तुरहियाँ युद्ध-संकेत के साधन हैं।
- source_word: οἱ παρὰ Ἰούδαν
  choice: यहूदा के साथ के लोग
  rationale: यह अभिव्यक्ति यहूदा के साथ या उसकी ओर उपस्थित लोगों को बताती है और उन्हें उससे अधिक विशिष्ट रूप में परिभाषित नहीं करती।
- source_word: ἐσάλπισαν ... καὶ αὐτοὶ
  choice: उन्होंने भी—तुरहियाँ बजाईं
  rationale: साधारण भूतकाल से उत्तर में हुई क्रिया व्यक्त होती है, जबकि ‘उन्होंने भी’ αὐτοί के बलाघात को सुरक्षित रखता है।
