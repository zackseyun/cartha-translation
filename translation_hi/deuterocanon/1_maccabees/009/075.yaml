  yaml_path: translation/deuterocanon/1_maccabees/009/075.yaml
  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: hi
  text: तब उसने याफा के विरुद्ध छावनी डाली, पर नगर के लोगों ने उसे भीतर आने से रोक दिया, क्योंकि याफा में अपोल्लोनियुस की एक सैनिक चौकी थी; और उन्होंने याफा के विरुद्ध युद्ध किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में पहले एकवचन क्रियाओं के बाद यहाँ कर्ता अचानक बहुवचन हो जाता है: “उन्होंने याफा के विरुद्ध युद्ध किया।” सम्भवतः “उन्होंने” से योनातान और उसके सैनिक अभिप्रेत हैं और “याफा” नगर को सूचित करता है; इस असामान्य बदलाव को सरल बनाकर एकवचन नहीं किया गया है।'
    reason: मूल पाठ में कर्ता के एकवचन से बहुवचन में अचानक परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: के विरुद्ध छावनी डाली
  rationale: παρεμβάλλω सैन्य छावनी डालने को दर्शाता है, और ἐπί के साथ नगर की ओर शत्रुतापूर्ण बढ़त का भाव है; यह अनुवाद दोनों पहलुओं को बनाए रखता है।
- source_word: Ἰόππην / Ἰόππῃ
  choice: याफा
  rationale: इस प्राचीन नगर के लिए आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित नाम।
- source_word: ἀπέκλεισαν αὐτόν
  choice: उसे भीतर आने से रोक दिया
  rationale: क्रिया का अर्थ किसी को बाहर रखना या प्रवेश रोकना है; हिन्दी में यह वाक्यांश नगर में प्रवेश न देने का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोगों
  rationale: मूल यूनानी लिंग निर्दिष्ट नहीं करता; इसलिए ‘लोगों’ सहज और समावेशी है।
- source_word: φρουρὰ Ἀπολλωνίου
  choice: अपुल्लोनियुस की एक सैनिक चौकी
  rationale: φρουρά यहाँ नगर में तैनात रक्षक-दल अथवा उसकी चौकी को सूचित करता है; ‘सैनिक चौकी’ सामान्य हिन्दी में स्थान और तैनात बल, दोनों का उपयुक्त भाव देती है।
- source_word: ἐπολέμησαν αὐτήν
  choice: उन्होंने याफा के विरुद्ध युद्ध किया
  rationale: बहुवचन क्रिया को ज्यों का त्यों रखा गया है। स्त्रीलिंग सर्वनाम αὐτήν का स्वाभाविक पूर्वपद याफा है; हिन्दी में अस्पष्ट ‘उसके’ से बचने के लिए नगर का नाम दोहराया गया है, जबकि कर्ता ‘उन्होंने’ को मूल के अनुसार अनिर्दिष्ट छोड़ा गया है।
