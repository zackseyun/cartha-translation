translation:
  language: hi
  text: कैसे गिर पड़ा वह वीर[a], जो इस्राएल को बचा रहा था!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्दावली बाइबल के विलाप-सूत्र, ‘वीर कैसे गिर पड़े,’ की प्रतिध्वनि है (तुलना करें 2 शमूएल 1:19, 25, 27)।
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: कैसे
  rationale: यह सूचना माँगने वाला प्रश्न नहीं, बल्कि शोकपूर्ण विस्मय का उद्गार है। ‘कैसे’ मूल की संक्षिप्तता और विलाप के परिचित ढंग को बनाए रखता है।
- source_word: ἔπεσεν
  choice: गिर पड़ा
  rationale: अओरिस्ट क्रिया मृत्यु के लिए प्रयुक्त ‘गिरने’ की घटना बताती है। ‘गिर पड़ा’ हिन्दी में वीर की मृत्यु पर किए गए विलाप का स्वाभाविक और सजीव रूप है।
- source_word: δυνατός
  choice: वह वीर
  rationale: यह विशेषण यहाँ संज्ञा के रूप में और एकवचन में प्रयुक्त है। ‘वह वीर’ शक्ति और युद्ध-पराक्रम दोनों का भाव देता है, पर पाठ में यहूदा का नाम नहीं जोड़ता।
- source_word: σώζων
  choice: जो ... बचा रहा था
  rationale: वर्तमान कृदंत निरंतर या उस समय की विशिष्ट गतिविधि दर्शाता है। ‘जो ... बचा रहा था’ इस अपूर्ण, जारी पहलू को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल को
  rationale: यह क्रिया का सीधा कर्म है। व्यक्तिवाचक नाम के साथ यूनानी निश्चयवाचक उपपद का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
theological_decisions:
- issue: बाइबलीय विलाप-सूत्र की प्रतिध्वनि
  choice: ‘कैसे गिर पड़ा वह वीर’ को बनाए रखा गया है।
  alternative: ‘एक शक्तिशाली मनुष्य गिर गया’ अथवा ‘देखो, वह बलवान कैसे गिरा’
  rationale: यूनानी वाक्य पहले के पवित्रशास्त्रीय विलाप ‘वीर कैसे गिर पड़े’ की स्पष्ट प्रतिध्वनि देता है। चुना हुआ रूप उस साहित्यिक और धर्मवैचारिक संबंध को बनाए रखता है, बिना व्याख्या को मुख्य पाठ में जोड़ने के।
- issue: σώζων का कालगत और पक्षगत भाव
  choice: ‘जो इस्राएल को बचा रहा था’
  alternative: ‘जिसने इस्राएल को बचाया’ अथवा ‘इस्राएल का उद्धारकर्ता’
  rationale: मूल में वर्तमान कृदंत है, न कि पूर्ण हुई क्रिया या स्थायी उपाधि। इसलिए जारी कार्य का भाव रखा गया है और ‘उद्धारकर्ता’ जैसी अधिक धर्मवैचारिक संज्ञा नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। विस्मयादिबोधक चिह्न Πῶς के शोकपूर्ण उद्गार को स्पष्ट करता है। ‘वह वीर’ ऊँचे विलाप-स्वर को बनाए रखते हुए सामान्य पाठक के लिए सहज है।
