base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: hi
  text: तब योनातान, शमौन और उसके साथ के लोग हटकर वीराने में स्थित बेत-बासी में चले गए। उसने उसके ध्वस्त भागों को फिर से बनाया[a] और उसे मज़बूत किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ जो कुछ ढहा दिया गया था, उसे फिर बनाया।”
    reason: यूनानी पद τὰ καθηρημένα αὐτῆς का एक अधिक स्वाभाविक, किंतु कुछ कम संक्षिप्त, वैकल्पिक अनुवाद।
  - marker: b
    text: या, “उसकी किलेबंदी की।”
    reason: संघर्ष के इस प्रसंग में ἐστερέωσεν का आशय रक्षात्मक रूप से मजबूत करना, अर्थात किलेबंदी करना, हो सकता है।
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: चले गए
  rationale: यह क्रिया अलग हटने या किसी स्थान को चले जाने का भाव देती है। प्रसंग में यह खतरे से हटना हो सकता है, पर यूनानी शब्द अनिवार्य रूप से घबराकर भागने या सुनियोजित पीछे हटने का संकेत नहीं देता।
- source_word: οἱ μετʼ αὐτοῦ
  choice: उनके साथ के लोग
  rationale: यूनानी में सर्वनाम एकवचन है, पर वाक्य के संयुक्त कर्ता योनातान और शमौन हैं। हिन्दी में आदरसूचक/समूह-संदर्भ वाला ‘उनके’ इस अस्पष्टता को सहज रूप से बनाए रखता है और साथ आए दल को केवल एक भाई तक सीमित नहीं करता।
- source_word: Βεθβασί
  choice: बेत-बासी
  rationale: स्थान-नाम को यूनानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: वीराने में स्थित
  rationale: ἔρημος निर्जन अथवा उजाड़ प्रदेश को सूचित करता है। ‘वीराना’ प्राकृतिक हिन्दी है और इसे अनिवार्य रूप से रेतीला मरुस्थल नहीं बनाता।
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: वहाँ जो कुछ ढहा दिया गया था, उसे फिर बनाया
  rationale: यह रूप मूल क्रिया ‘बनाया’ और ढहाई जा चुकी वस्तुओं के कर्मवाचक कृदंत—दोनों को स्पष्ट रखता है; ‘खंडहरों को फिर बनाया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἐστερέωσεν αὐτήν
  choice: उस स्थान को दृढ़ किया
  rationale: क्रिया का मूल अर्थ मजबूत या दृढ़ करना है। सैन्य प्रसंग में इसका आशय किलेबंदी करना हो सकता है, किंतु अनिर्दिष्ट संरचनात्मक मजबूती को ‘दृढ़ किया’ सुरक्षित रखता है।
