translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। कथा-वर्णन में ‘तब’ प्रवाह देता है। बहुवचन कर्ता के अनुरूप हिन्दी क्रियाएँ बहुवचन में रखी गई हैं, जबकि यूनानी में इसके बाद एकवचन क्रियाएँ हैं; इससे अर्थ नहीं बदलता और हिन्दी की स्वाभाविक संगति बनी रहती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
