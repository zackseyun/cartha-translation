base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/009.yaml
  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: hi
  text: पर उन्होंने उसकी बात मानने से इनकार किया[a] और कहा, “हम यह किसी भी तरह नहीं कर सकते। अभी तो हम अपने प्राण[b] बचाएँ। अपने भाइयों के साथ लौटकर उनसे युद्ध करें; पर हम बहुत थोड़े हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का अर्थ “उसे लौटा दिया” भी हो सकता है; प्रसंग में यह उसकी सलाह या प्रस्ताव को अस्वीकार करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “अपने प्राण”; इस युद्ध-प्रसंग में इसका अर्थ “अपने जीवन” है।
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: उन्होंने उसे पीछे हटाने की कोशिश की
  rationale: क्रिया सकर्मक है और αὐτόν उसका कर्म है; प्रसंग में इसका अर्थ उसे उसके प्रस्ताव या युद्ध के निश्चय से फेरना है। ‘कोशिश की’ हिन्दी में इस प्रयास को स्वाभाविक ढंग से व्यक्त करता है, बिना यह मान लिए कि वे सफल हुए।
- source_word: Οὐ μὴ δυνώμεθα
  choice: हम यह किसी भी तरह नहीं कर सकते
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σώσωμεν τὰς ἑαυτῶν ψυχὰς
  choice: हम अपने प्राण बचाएँ
  rationale: युद्ध के प्रसंग में ψυχαί का अर्थ जीवन है, न कि मनुष्य के अभौतिक पक्ष के विषय में कोई धर्मवैज्ञानिक कथन। ‘प्राण बचाना’ प्रचलित और गरिमापूर्ण हिन्दी मुहावरा है।
- source_word: τὸ νῦν
  choice: अभी तो
  rationale: वर्तमान संकट के लिए अस्थायी निर्णय का भाव देता है और आगे लौटकर लड़ने के प्रस्ताव से स्वाभाविक संबंध बनाता है।
- source_word: ἐπιστρέψωμεν μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: फिर हम अपने भाइयों के साथ लौटकर
  rationale: μετά के ‘साथ’ वाले अर्थ और ἐπιστρέψωμεν के लौटने के भाव को सुरक्षित रखता है; ‘फिर’ हिन्दी में प्रस्तावित बाद की कार्रवाई स्पष्ट करता है।
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: उनसे युद्ध करें
  rationale: सशस्त्र संघर्ष का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: पर हम गिनती में थोड़े हैं
  rationale: δέ के विरोधसूचक भाव और यूनानी की संक्षिप्तता को बनाए रखते हुए हिन्दी में संख्या का आशय स्पष्ट करता है।
theological_decisions:
- issue: युद्ध के प्रसंग में ψυχὰς का अर्थ
  choice: प्राण
  alternative: आत्माएँ
  rationale: यहाँ सैनिक अपने जीवित बचने की बात कर रहे हैं। ‘आत्माएँ’ अनावश्यक रूप से धर्मवैज्ञानिक अर्थ ला सकता है।
- issue: ἀδελφῶν का संबोधन
  choice: भाइयों
  alternative: साथियों / स्वजातीय लोगों
  rationale: यूनानी शब्द के स्पष्ट संबंधात्मक और पुल्लिंग रूप को बनाए रखा गया है; प्रसंग में इसका दायरा सहयोद्धाओं या स्वजातीय लोगों तक हो सकता है।
- issue: ἀπέστρεψαν αὐτόν में क्रिया का आशय
  choice: उसे पीछे हटाने की कोशिश की
  alternative: उससे मुँह मोड़ लिया
  rationale: αὐτόν क्रिया का कर्म है, इसलिए मुख्य पाठ में उन्होंने उसे उसके निश्चय से फेरने का प्रयास किया—यह अर्थ अधिक निकट है; फिर भी अभिव्यक्ति में असहमति या परामर्श ठुकराने की छाया संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। संवाद में प्रबल निषेध और सैनिकों की तत्काल व्यावहारिक चिंता स्पष्ट रखी गई है। ‘भाइयों’ मूल के संबंधात्मक शब्द को बनाए रखता है, जबकि ‘गिनती में थोड़े’ अंतिम संक्षिप्त यूनानी कथन का आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
