    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “बंदी अवस्था”; यहाँ इसका अर्थ सामूहिक रूप से बंदी बनाए गए लोग हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: यह बात जानकर
  rationale: क्रिया का एओरिस्ट रूप यहाँ किसी घटनाक्रम का पता चलने को व्यक्त करता है। यूनानी में कर्म स्पष्ट नहीं है; हिन्दी में स्वाभाविकता के लिए ‘यह बात’ संदर्भ से लिया गया है।
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: ἀποστέλλω का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πρέσβεις
  choice: राजदूत
  rationale: यह शब्द औपचारिक कूटनीतिक प्रतिनिधियों को दर्शाता है; ‘राजदूत’ उस आधिकारिक भूमिका को स्पष्ट करता है।
- source_word: τοῦ συνθέσθαι ... εἰρήνην
  choice: ताकि उसके साथ शांति की जाए
  rationale: सप्रत्यय infinitive उद्देश्य व्यक्त करता है; यह रूप शांति स्थापित करने का अर्थ देता है, पर किसी विशिष्ट प्रकार की संधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀποδοῦναι
  choice: लौटा दिया जाए
  rationale: मूल अर्थ ‘वापस देना’ है। निष्क्रिय हिन्दी रचना प्रसंग में स्वाभाविक है और यूनानी infinitive के कर्ता को अनावश्यक रूप से निश्चित करने से बचती है।
- source_word: τὴν αἰχμαλωσίαν
  choice: बंदियों
  rationale: शाब्दिक रूप से यह ‘बंदी अवस्था’ अथवा सामूहिक रूप से ‘बंदी बनाए गए लोग’ कह सकता है; यहाँ ठोस संदर्भ बंदी लोगों का है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: बहुवचन सर्वनाम को बिना उसके समूह की पहचान अधिक स्पष्ट किए यथावत रखा गया है।
