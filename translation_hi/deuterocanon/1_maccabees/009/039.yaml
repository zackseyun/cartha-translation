translation:
  language: hi
  text: तब उन्होंने आँखें उठाकर देखा, और तो देखो, वहाँ शोरगुल और बहुत-सा साज-सामान था। दूल्हा अपने मित्रों और भाइयों के साथ, डफों, वादकों और बहुत-से हथियारों के साथ, उनसे मिलने के लिए बाहर आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: शोरगुल करती एक बड़ी बारात
  rationale: शब्द का मूल अर्थ शोर या कोलाहल है; विवाह-संदर्भ में स्वाभाविक हिन्दी के लिए उसे बारात के शोरगुल के रूप में व्यक्त किया गया है।
- source_word: ἀποσκευή πολλή
  choice: बहुत-सा सामान
  rationale: ἀποσκευή यात्रा या जुलूस के साथ ले जाए जाने वाले सामान/साज-सामान को दर्शाता है; सामान्य और व्यापक अर्थ बनाए रखा गया है।
- source_word: οἱ φίλοι αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: अपने मित्रों और भाइयों के साथ
  rationale: दोनों अलग समूहों को यूनानी पाठ के अनुसार स्पष्ट रूप से रखा गया है।
- source_word: τυμπάνων καὶ μουσικῶν
  choice: डफ और बाजे बजाने वालों
  rationale: τύμπανα हाथ से बजाए जाने वाले डफ जैसे वाद्य हैं; μουσικοί को अस्पष्ट 'संगीत' के बजाय वादक व्यक्तियों के रूप में प्रस्तुत किया गया है।
- source_word: ὅπλων πολλῶν
  choice: बहुत-से हथियारों के साथ
  rationale: ὅπλα का सीधा अर्थ हथियार है और जुलूस के सशस्त्र स्वरूप को यथावत रखा गया है।
