lexical_decisions:
- source_word: ὑστήκει
  choice: वह ... वहीं डटा रहा
  rationale: क्रिया किसी स्थिर स्थान या स्थिति में बने रहने का भाव देती है। यूनानी में कर्ता स्पष्ट नहीं है; ‘वह’ उसके संदर्भ को अनिर्धारित रखता है, यद्यपि हिन्दी क्रिया में व्याकरणिक लिंग व्यक्त करना अनिवार्य है।
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: योनातान की आज्ञा के अनुसार
  rationale: καθώς अनुरूपता और ἐπιτάσσω आदेश देने का भाव व्यक्त करते हैं। यह हिन्दी प्रयोग स्वाभाविक रूप से दोनों को समेटता है।
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: उनके घोड़े थक गए
  rationale: κοπιάω परिश्रम के कारण थकने को दर्शाता है; ‘थक गए’ पूर्णतः निढाल हो जाने का अनावश्यक अर्थ जोड़े बिना सहज हिन्दी देता है।
- source_word: ἐξέλυσεν ... τὴν δύναμιν αὐτοῦ
  choice: अपनी सेना को मोर्चे पर लगाया
  rationale: सैन्य प्रसंग में ἐκλύω/ἐξέλυσεν सैन्य बल को खोलने, आगे करने या तैनात करने और δύναμις सैनिक बल को सूचित करता है। ‘मोर्चे पर लगाया’ आधुनिक, स्पष्ट सैन्य हिन्दी है।
- source_word: συνῆψεν πρὸς
  choice: से युद्ध में भिड़ गया
  rationale: युद्ध-वर्णन में यह पदबंध किसी विरोधी से युद्ध में जा मिलने या भिड़ने का अर्थ देता है।
- source_word: τὴν
  choice: उस...
  rationale: दिया गया यूनानी पाठ स्त्रीलिंग कर्मकारक निश्चित उपपद पर अधूरा समाप्त होता है। हिन्दी में उपपद का स्वतंत्र समतुल्य नहीं है, इसलिए ‘उस...’ अधूरे संकेत को यथासंभव बनाए रखता है।
