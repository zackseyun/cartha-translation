  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: hi
  text: तब योनातान और शमौन अपने भाई यहूदा के शव को उठाकर ले गए और उसे मोदेईन में उसके पूर्वजों की कब्र में दफ़नाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν
  choice: के शव को उठाकर ले गए
  rationale: αἴρω यहाँ दफ़नाने के प्रसंग में मृत देह को उठाकर ले जाने का भाव देता है। हिन्दी में कर्म के रूप में केवल नाम रखने से अस्पष्टता हो सकती थी, इसलिए प्रसंग से निहित ‘शव’ स्पष्ट किया गया है।
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: योनातान और शमौन
  rationale: व्यक्तिनामों को हिन्दी बाइबलीय परंपरा में प्रचलित रूपों में लिप्यंतरित किया गया है।
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई यहूदा के शव को
  rationale: यूनानी αὐτοῦ एकवचन है, पर संयुक्त कर्ता योनातान और शमौन के कारण अर्थ दोनों के भाई का है। हिन्दी का ‘अपने भाई’ इस सामूहिक संबंध को सहज रूप से व्यक्त करता है।
- source_word: ἔθαψαν
  choice: दफ़नाया
  rationale: θάπτω के लिए दफ़नाने के प्रसंग में यह स्वाभाविक और सामान्य आधुनिक हिन्दी क्रिया है।
- source_word: ἐν τῷ τάφῳ
  choice: कब्र में
  rationale: τάφος किसी कब्र या समाधि-स्थान को दर्शाता है। ‘कब्र’ सामान्य पाठक के लिए स्पष्ट है और पारिवारिक दफ़न-स्थान के संदर्भ में उपयुक्त है।
- source_word: τῶν πατέρων αὐτοῦ
  choice: उसके पूर्वजों की
  rationale: बहुवचन πατέρων यहाँ पिछली पीढ़ियों अथवा पूर्वजों का बोध कराता है। ‘पूर्वजों’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है और केवल प्रत्यक्ष पिता समझे जाने से बचाता है।
- source_word: ἐν Μωδεείμ
  choice: मोदेईन में
  rationale: स्थाननाम को यूनानी रूप Μωδεείμ के निकट हिन्दी में लिप्यंतरित किया गया है; ἐν का सामान्य स्थानीय अर्थ ‘में’ है।
