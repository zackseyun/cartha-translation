translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘तब’ यूनानी καί की प्रसंगगत कथात्मक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है। ‘शव’ मूल में स्पष्ट संज्ञा के रूप में नहीं है, पर मृत्यु और दफ़न के संदर्भ में निहित कर्म को हिन्दी में स्पष्ट तथा स्वाभाविक बनाने के लिए जोड़ा गया है।
