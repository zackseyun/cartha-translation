translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। अंतिम वाक्यांश की यूनानी संक्षिप्तता मुख्य पाठ में यथासंभव सुरक्षित है और पादटिप्पणी में स्पष्ट की गई है।
