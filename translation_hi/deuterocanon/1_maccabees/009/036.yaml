base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/036.yaml
  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: hi
  text: और याम्ब्री के पुत्र मेदबा से निकले। उन्होंने योहन को पकड़ लिया और उसके पास जो कुछ था, वह सब ले लिया; फिर वे उन्हें लेकर चले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे योहन को और उसके पास की सारी वस्तुओं को अपने साथ ले गए। यूनानी में शाब्दिक रूप से ‘उन्हें लिए हुए चले गए’ है; यह योहन और उसके पास की वस्तुओं की ओर संकेत करता है।
    reason: मूल यूनानी के संक्षिप्त, संदर्भ-निर्भर अंतिम वाक्यांश का स्पष्टीकरण।
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: यम्ब्री के पुत्र
  rationale: υἱοὶ का सीधा अर्थ ‘पुत्र’ है; प्रसंग में यह वंश या कुल के पुरुषों को भी सूचित कर सकता है। Ἰαμβρεὶ को व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है।
- source_word: ἐκ Μηδαβά
  choice: मेदबा से निकले
  rationale: ἐκ स्थान के भीतर से बाहर आने की गति बताता है। ‘से निकले’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को स्पष्ट रखता है।
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: यह क्रिया बलपूर्वक अधिकार में लेने या पकड़ने का भाव देती है। ‘पकड़ लिया’ शत्रुतापूर्ण कार्रवाई व्यक्त करता है, पर औपचारिक कानूनी गिरफ्तारी का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: Ἰωάνην
  choice: योहन
  rationale: यूनानी नाम Ἰωάνης का हिन्दी बाइबलीय परंपरा में प्रचलित और सुबोध रूप ‘योहन’ है।
- source_word: πάντα ὅσα εἶχεν
  choice: जो कुछ उसके पास था, वह सब
  rationale: यह रूप πάντα की समग्रता और ὅσα εἶχεν की संबंधवाचक रचना दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπῆλθον ἔχοντες
  choice: उन्हें लिए हुए चले गए
  rationale: यूनानी में बहुवचन कृदंत ἔχοντες संक्षिप्त और कुछ हद तक संदर्भ-निर्भर है। यह अनुवाद उसके शाब्दिक ढाँचे तथा ‘उन्हें’ के संभावित व्यापक संकेत को बनाए रखता है।
