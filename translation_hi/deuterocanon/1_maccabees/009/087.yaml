translation:
  language: hi
  text: तब योनातान अपने साथियों के साथ बहुत-सी लूट लेकर लौट आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεψεν
  choice: लौट आया
  rationale: कथानक में στρέφω का अओरिस्ट पीछे लौटने का भाव देता है; ‘लौट आया’ आधुनिक हिन्दी में स्वाभाविक रूप से दिशा और पूर्ण हुई क्रिया दोनों व्यक्त करता है।
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: अपने साथियों के साथ
  rationale: यह वाक्यांश योनातान के साथ उपस्थित लोगों को बताता है। ‘साथियों’ से समूह का संबंध स्पष्ट होता है, पर उन्हें अनावश्यक रूप से सैनिक नहीं कहा गया।
- source_word: ἔχοντες
  choice: लेकर
  rationale: बहुवचन कृदन्त योनातान और उसके साथियों की मुख्य क्रिया के साथ-साथ लूट अपने पास रखने/लाने की परिस्थिति बताता है; हिन्दी में ‘लेकर’ इसका सहज रूप है।
- source_word: σκῦλα πολλά
  choice: बहुत-सी लूट
  rationale: σκῦλα युद्ध में प्राप्त लूटी हुई वस्तुओं को सूचित करता है। ‘बहुत-सी लूट’ आधुनिक, स्पष्ट हिन्दी है और πολλά की मात्रा को व्यक्त करता है।
