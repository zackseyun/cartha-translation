    text: शाब्दिक रूप से, “दायाँ सींग”; यह सेना के दाएँ भाग या पक्ष के लिए प्रयुक्त सैन्य रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, “अज़ोतुस के पहाड़ी क्षेत्र तक।” यूनानी पदबंध किसी विशिष्ट पर्वत या अज़ोतुस से जुड़े पहाड़ी क्षेत्र, दोनों में से किसी को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: कुचल दिया गया
  rationale: निष्क्रिय क्रिया युद्ध में बुरी तरह तोड़े या परास्त किए जाने का सजीव बिंब देती है; ‘कुचल दिया गया’ इस तीव्रता को बनाए रखता है।
- source_word: τὸ δεξιὸν κέρας
  choice: सेना का दायाँ भाग
  rationale: κέρας का शाब्दिक अर्थ ‘सींग’ है, पर यहाँ यह सैन्य पंक्ति के दाएँ भाग या पक्ष के लिए रूपक है। आधुनिक हिन्दी में ‘सेना का दायाँ भाग’ स्पष्ट और स्वाभाविक है।
- source_word: ἀπʼ αὐτῶν
  choice: उनके सामने
  rationale: युद्ध के प्रसंग में ἀπό विरोधी सेना के दबाव के कारण टूटने या पीछे हटने का भाव दे सकता है। ‘उनके सामने’ इस संबंध को व्यक्त करता है और अस्पष्ट ‘उनसे’ की अपेक्षा अधिक बोधगम्य है।
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: वह उनका पीछा करते हुए ... गया
  rationale: यूनानी मुहावरे का आशय भागती हुई सेना का पीछा करना है। एकवचन ‘वह’ मूल क्रिया के वचन को बनाए रखता है।
- source_word: ἕως Ἀζώτου ὄρους
  choice: अज़ोतुस के पहाड़ी क्षेत्र तक
  rationale: यूनानी पदबंध किसी विशिष्ट पर्वत अथवा अज़ोतुस से जुड़े पहाड़ी भूभाग, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘पहाड़ी क्षेत्र’ भौगोलिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और वैकल्पिक समझ पादटिप्पणी में रखी गई है।
