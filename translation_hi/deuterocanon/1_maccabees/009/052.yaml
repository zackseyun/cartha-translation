  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: hi
  text: और उन्होंने नगर, बेत-सूर, गाज़रा[a] और गढ़[b] की किलेबंदी की। उन्होंने उनमें सैन्य बल तैनात किए और भोजन के भंडार रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गाज़रा’ यूनानी नाम का रूप है; इस स्थान की पहचान प्रायः गेज़ेर से की जाती है।
    reason: cross_reference
  - marker: b
    text: या ‘अक्रा’; यह यरूशलेम के किलेबंद गढ़ का ऐतिहासिक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: किलेबंदी की
  rationale: यह क्रिया किसी स्थान को सुरक्षा-व्यवस्था और दुर्गीकरण द्वारा मजबूत करने का बोध कराती है; सैन्य प्रसंग में ‘किलेबंदी की’ स्वाभाविक और सटीक है।
- source_word: τὴν πόλιν
  choice: उस नगर
  rationale: πόλις का सामान्य अर्थ ‘नगर’ है और निश्चित उपपद पहले से संदर्भित विशिष्ट नगर की ओर संकेत करता है; इसलिए ‘उस नगर’ रखा गया है।
- source_word: Βεθοσούραν
  choice: बेत-सूर
  rationale: स्थान-नाम को अनूदित करने के बजाय आधुनिक हिन्दी में पहचाने जाने योग्य रूप में लिप्यंतरित किया गया है।
- source_word: Γάζαρα
  choice: गाज़रा
  rationale: यह रूप यूनानी Γάζαρα का सीधा लिप्यंतरण है; ‘गेज़ेर’ स्थल का अधिक परिचित इब्रानी-आधारित नाम है, जिसे पादटिप्पणी में दिया गया है।
- source_word: ἄκραν
  choice: गढ़
  rationale: ἄκρα किसी ऊँचे किलेबंद स्थान या दुर्ग को सूचित करता है। ‘गढ़’ साधारण पाठक के लिए स्पष्ट है, जबकि यरूशलेम के ऐतिहासिक ‘अक्रा’ नाम की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἔθεντο
  choice: तैनात कीं … रखे
  rationale: एक ही यूनानी क्रिया सैनिक बल और भोजन-सामग्री दोनों पर लागू होती है। हिन्दी में स्वाभाविक अभिव्यक्ति के लिए सैनिकों के साथ ‘तैनात कीं’ और भंडारों के साथ ‘रखे’ कहा गया है।
- source_word: δυνάμεις
  choice: सैनिक टुकड़ियाँ
  rationale: δυνάμεις यहाँ सैन्य बलों को दर्शाता है। ‘सैनिक टुकड़ियाँ’ उनके स्थानों में तैनात किए जाने का अर्थ स्पष्ट करती है, बिना उन्हें तकनीकी रूप से अनिवार्यतः ‘छावनी’ मानने के।
- source_word: παραθέσεις βρωμάτων
  choice: भोजन के भंडार
  rationale: παραθέσεις में जमा करके रखी गई सामग्री और βρωμάτων में भोजन का भाव है; ‘भोजन के भंडार’ दोनों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
