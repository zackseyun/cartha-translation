base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/037.yaml
  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: hi
  text: इन बातों के बाद योनातान और उसके भाई शमौन को यह समाचार मिला कि याम्ब्री के बेटे एक बड़ा विवाहोत्सव मना रहे हैं और नादाबात से दुल्हन को एक बड़े दल के साथ[a] ला रहे हैं। वह कनान के बड़े-बड़े सरदारों में से एक की बेटी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बड़ी शोभायात्रा के साथ।” यूनानी शब्द παραπομπή का अर्थ साथ चलने वाला दल अथवा उत्सवी जुलूस हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: इन बातों के बाद
  rationale: यह स्वाभाविक हिन्दी काल-संक्रमण है और λόγοι के ‘बातों/कथनों’ वाले अर्थ को बिना अनावश्यक रूप से केवल बोले गए शब्दों तक सीमित किए बनाए रखता है।
- source_word: ἀπηγγέλησαν
  choice: यह समाचार मिला
  rationale: यूनानी के कर्मवाच्य भाव को सहज हिन्दी में व्यक्त करता है और समाचार देने वाले किसी अज्ञात कर्ता को नहीं जोड़ता।
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: योनातान और उसके भाई शमौन को
  rationale: सम्प्रदान कारक और शमौन की योनातान के भाई के रूप में पहचान, दोनों स्पष्ट रहते हैं।
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: याम्ब्री के बेटे
  rationale: मूल का पारिवारिक अथवा कुल-सूचक मुहावरा सीधे और स्पष्ट रूप में सुरक्षित रहता है।
- source_word: ποιοῦσιν γάμον μέγαν
  choice: एक भव्य विवाहोत्सव मना रहे हैं
  rationale: ποιεῖν γάμον का आशय विवाह आयोजित या उत्सवपूर्वक मनाने से है; ‘विवाहोत्सव’ प्रसंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄγουσι τὴν νύμφην ἀπὸ Ναδαβάθ
  choice: नादाबात से दुल्हन को ... ला रहे हैं
  rationale: ἄγω के ‘लाना/ले चलना’ और ἀπό के उद्गम-सूचक अर्थ को सहज हिन्दी शब्दक्रम में रखा गया है।
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: वह कनान के बड़े-बड़े सरदारों में से एक की बेटी थी
  rationale: μεγιστάν उच्च पद वाले प्रमुख या सामन्त को दर्शाता है। ‘बड़े-बड़े सरदार’ मूल की बलाघाती प्रतिष्ठा-भाषा को सामान्य पाठकों के लिए स्पष्ट रखता है।
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: एक बड़े दल के साथ
  rationale: παραπομπή साथ चलने वाले अनुरक्षक दल या औपचारिक जुलूस, दोनों को सूचित कर सकता है। ‘दल’ मुख्य पाठ में इस व्यापकता को बनाए रखता है और विकल्प पाद-टिप्पणी में दिया गया है।
