  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: hi
  text: और योनातान और उसके साथ के लोग यरदन में कूद पड़े और तैरकर उस पार पहुँच गए; और उन्होंने उनके विरुद्ध[a] यरदन पार नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके पीछे।’ यूनानी वाक्यांश संक्षिप्त है और योनातान के दल की ओर शत्रुतापूर्ण ढंग से बढ़ने, उनके पीछे जाने, या उन पर आक्रमण करने के लिए पार करने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: कूद पड़े
  rationale: यूनानी क्रिया अचानक छलाँग लगाने या कूदने का बोध देती है। संयुक्त कर्ता के अनुरूप हिन्दी में बहुवचन प्रयोग स्वाभाविक है।
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: उसके साथ के लोग
  rationale: यह वाक्यांश साथियों को व्यापक रूप से दर्शाता है और मूल में निहित न होने वाला कोई अधिक विशिष्ट परिचय नहीं जोड़ता।
- source_word: διεκολύμβησαν
  choice: तैरकर ... पहुँच गए
  rationale: क्रिया तैरते हुए पार जाने को स्पष्ट करती है; यह हिन्दी में उस क्रिया और उसके परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: यह सामने वाले किनारे के लिए संक्षिप्त और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: शत्रुओं ने उनके पीछे यरदन पार नहीं किया
  rationale: पूर्ववर्ती प्रसंग से अव्यक्त कर्ता पीछा करने वाली शत्रु-सेना है। ἐπ᾿ αὐτούς यहाँ योनातान के दल की ओर शत्रुतापूर्ण पीछा सूचित करता है; ‘उनके पीछे’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: Ἰορδάνην
  choice: यरदन
  rationale: नदी का परंपरागत हिन्दी नाम पर्याप्त है; मूल में अलग से ‘नदी’ शब्द नहीं है।
