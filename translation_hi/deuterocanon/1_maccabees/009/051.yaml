    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: तैनात कर दिया
  rationale: τίθημι का यहाँ सैनिकों को किसी स्थान पर नियुक्त करने का अर्थ है; सैन्य प्रसंग में ‘तैनात कर दिया’ स्वाभाविक और सटीक है।
- source_word: φρουράν
  choice: एक सैनिक-दल
  rationale: यह शब्द किलेबंद स्थानों में नियुक्त सैन्य रक्षक-दल को सूचित करता है। ‘सैनिक-दल’ सामान्य पाठक के लिए स्पष्ट है और केवल स्थानवाचक ‘चौकी’ की अपेक्षा दल के अर्थ को बनाए रखता है।
- source_word: ἐν αὐτοῖς
  choice: उनमें
  rationale: बहुवचन सर्वनाम पिछले पद में बताए गए स्थानों की ओर संकेत करता है। ‘उनमें’ मूल की अनिर्दिष्टता को सुरक्षित रखता है।
- source_word: τοῦ ἐχθραίνειν
  choice: शत्रुतापूर्ण कार्रवाई करने के लिए
  rationale: τοῦ के साथ क्रियार्थक संज्ञा प्रयोजन व्यक्त करती है। यह अनुवाद सक्रिय और संभवतः निरंतर विरोधी व्यवहार का भाव देता है, पर उसे पूर्ण युद्ध या किसी खास प्रकार के उत्पीड़न तक सीमित नहीं करता।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के विरुद्ध
  rationale: ἐχθραίνειν के साथ संबंधवाचक चतुर्थी शत्रुता के लक्ष्य को बताती है; आधुनिक हिन्दी में ‘के विरुद्ध’ स्वाभाविक है।
