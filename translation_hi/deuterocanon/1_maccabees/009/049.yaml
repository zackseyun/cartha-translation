lexical_decisions:
- source_word: διέπεσαν
  choice: मारे गए
  rationale: युद्ध के प्रसंग में यह क्रिया शाब्दिक रूप से ‘गिर पड़े’ और मुहावरे के रूप में युद्ध में मारे जाने को दर्शाती है। आधुनिक हिन्दी में ‘मारे गए’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: παρὰ Βακχίδα
  choice: बक्खिदेस के साथ
  rationale: παρά यहाँ बक्खिदेस से संबंध या उसकी ओर होने का संकेत दे सकता है; ‘के साथ’ संबंध की व्यापकता बनाए रखता है और प्रत्यक्ष कर्तृत्व—‘बक्खिदेस के हाथों’—को अनावश्यक रूप से नहीं जोड़ता।
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: कालवाचक दत्तिव का सहज और संक्षिप्त हिन्दी रूप।
- source_word: εἰς χιλίους ἄνδρας
  choice: लगभग एक हज़ार पुरुष
  rationale: εἰς के साथ संख्या यहाँ कुल संख्या अथवा अनुमानित परिमाण बताती है; ‘लगभग’ इस प्रयोग का स्वाभाविक हिन्दी संकेत है।
