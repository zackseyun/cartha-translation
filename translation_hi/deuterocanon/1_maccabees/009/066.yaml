  yaml_path: translation/deuterocanon/1_maccabees/009/066.yaml
  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: hi
  text: और उसने ओदोमेरा, उसके भाइयों और फासिरोन के पुत्रों को उनके डेरे[a] में मारा, और वह सेनाओं के साथ प्रहार करने और आगे बढ़ने[b] लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘उनके तंबू/निवास में’ है; सैन्य प्रसंग में इससे उनका डेरा या पड़ाव अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘ऊपर चढ़ने/जाने’ का भाव है; यहाँ संभवतः सैन्य रूप से आगे बढ़ना अभिप्रेत है।
    reason: lexical_alternative
