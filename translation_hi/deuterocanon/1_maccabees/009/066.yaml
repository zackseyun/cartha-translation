- source_word: ἐπάτεξεν
  choice: प्रहार किया
  rationale: अओरिस्ट क्रिया का ठोस युद्ध-संबंधी अर्थ व्यक्त करता है; आधुनिक और गरिमापूर्ण हिन्दी में यह ‘मारा’ की अपेक्षा अधिक उपयुक्त है।
- source_word: Ὀδομηρὰ
  choice: ओदोमेरा
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: उसके भाइयों
  rationale: ἀδελφοί का सामान्य पारिवारिक अर्थ ‘भाई’ है; यहाँ संबंध को व्यापक ‘कुटुम्बी’ बनाना आवश्यक नहीं।
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: फासिरोन के पुत्रों
  rationale: υἱοί के प्रत्यक्ष अर्थ ‘पुत्र’ को बनाए रखा गया है, यद्यपि कुछ प्रसंगों में इसका अर्थ वंशज भी हो सकता है।
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: उनके डेरे में
  rationale: σκηνώμα का मूल अर्थ तंबू, डेरा या निवास है। ‘डेरा’ सैन्य पड़ाव का अर्थ भी दे सकता है और यूनानी की मूर्त भाषा को ‘छावनी’ की तुलना में अधिक निकटता से बचाता है।
- source_word: ἐξηρξατο
  choice: लगा
  rationale: ‘आगे बढ़ने लगा’ आरंभसूचक क्रिया का स्वाभाविक हिन्दी रूप है और ἐξηρξατο की आरंभिकता को बनाए रखता है।
- source_word: τύπτειν
  choice: प्रहार करते हुए
  rationale: τύπτω के ‘प्रहार करना’ अर्थ और पहले प्रयुक्त युद्ध-संबंधी क्रिया की पुनरावृत्ति को बनाए रखता है; हिन्दी वाक्य में समकालिक सैन्य कार्रवाई स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἀναβαίνειν
  choice: आगे बढ़ने
  rationale: शाब्दिक अर्थ ‘ऊपर चढ़ना/जाना’ है, पर युद्ध-वर्णन में सैन्य आगे बढ़ने का भाव संभावित है; पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
- source_word: ἐν ταῖς δυνάμεσιν
  choice: अपनी सेना के साथ
  rationale: बहुवचन δυνάμεις यहाँ सैन्य बलों को सूचित करता है। हिन्दी में ‘सेना के साथ’ स्वाभाविक है; ‘अपनी’ प्रसंगगत संबंध स्पष्ट करता है, यद्यपि यूनानी में अधिकारवाचक शब्द प्रत्यक्ष नहीं है।
