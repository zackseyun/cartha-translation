base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/034.yaml
  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: hi
  text: और बक्खीदेस को सब्त के दिन[a] इसका पता चला; तब वह स्वयं अपनी पूरी सेना के साथ यरदन के पार आया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘सब्तों के दिन’; यह ‘सब्त के दिन’ के अर्थ वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यरदन के दूसरी ओर’। यूनानी अभिव्यक्ति नदी के पार के क्षेत्र या दूसरी ओर जाने—दोनों को सूचित कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: इसका पता चला
  rationale: यहाँ क्रिया किसी बात की जानकारी मिलने का भाव देती है, न कि केवल पहले से जानने की स्थिति। यूनानी में कर्म निहित है, इसलिए संदर्भ के अनुसार ‘इसका’ जोड़ा गया है।
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: शाब्दिक बहुवचन ‘सब्तों का दिन’ यूनानी मुहावरा है, जिसका अर्थ एक सब्त का दिन है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: सर्वनाम पर दिए गए बल को बनाए रखता है और बताता है कि बक्खीदेस व्यक्तिगत रूप से सेना के साथ आया।
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: अपनी पूरी सेना
  rationale: στράτευμα उसके अधीन सैन्य बल को सूचित करता है; यह हिंदी में सीधा और स्वाभाविक रूप है।
- source_word: πέραν τοῦ Ἰορδάνη
  choice: यरदन के पार
  rationale: यह अभिव्यक्ति नदी के दूसरी ओर के क्षेत्र अथवा नदी पार करके वहाँ पहुँचने—दोनों भावों के लिए प्रयुक्त हो सकती है; ‘के पार’ इस स्थानगत लचीलेपन को बनाए रखता है।
