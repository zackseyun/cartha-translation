  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘तब’ वाक्य के घटनाक्रम को स्वाभाविक हिंदी में व्यक्त करता है; इससे कोई अतिरिक्त कारणात्मक दावा नहीं जुड़ता। नाम ‘बक्खीदेस’ यूनानी Βακχίδης का निकट देवनागरी लिप्यंतरण है।
