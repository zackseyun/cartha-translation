  text: उस समय योनातान ने नेतृत्व संभाला और अपने भाई यहूदा के स्थान पर उठ खड़ा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: संभाला
  rationale: मध्यवाच्य क्रिया यहाँ किसी पद या दायित्व को स्वीकार करके ग्रहण करने का भाव देती है; ‘नेतृत्व संभाला’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡγεσίαν
  choice: नेतृत्व
  rationale: यह शब्द नेतृत्व या कमान को सूचित करता है। ‘नेतृत्व’ उत्तराधिकार के प्रसंग के अनुकूल है और राजकीय शासन का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: उस समय
  rationale: यूनानी कालवाचक पदबंध का सहज और सटीक आधुनिक हिन्दी रूप।
- source_word: ἀνέστη
  choice: खड़ा हुआ
  rationale: क्रिया का मूल अर्थ उठना या खड़ा होना है; यहाँ यह अपने भाई के स्थान पर आगे आकर भूमिका ग्रहण करने का भाव भी बनाए रखती है।
- source_word: ἀντί
  choice: के स्थान पर
  rationale: यह प्रतिस्थापन या उत्तराधिकार व्यक्त करता है, विरोध का अर्थ जोड़े बिना।
- source_word: Ἰούδου
  choice: यहूदा
  rationale: हिन्दी बाइबलीय नाम-परंपरा में इस यहूदी व्यक्ति के लिए ‘यहूदा’ स्वाभाविक है और नाम के सेमिटिक आधार को स्पष्ट रखता है।
- source_word: Ἰωναθὰν
  choice: योनातान
  rationale: यह हिन्दी में प्रचलित बाइबलीय रूप है और मूल नाम के निकट है।
