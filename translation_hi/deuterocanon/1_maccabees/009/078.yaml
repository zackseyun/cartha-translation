  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: hi
  text: उसने उसका पीछा अज़ोतुस तक किया, और उसके पीछे सेनाएँ युद्ध में भिड़ गईं।[a] अपोल्लोनियुस एक हज़ार घुड़सवार पीछे छोड़ गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अनुवाद है, “और छावनियाँ उसके पीछे युद्ध में आ मिलीं।” संभवतः आशय यह है कि उसके पीछे स्थित सैन्य दल युद्ध में भिड़ गए।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध यूनानी पाठ यहाँ “अपोल्लोनियुस एक हज़ार घुड़सवार पीछे छोड़ गया” पर समाप्त होता है। यह कथन अधूरा-सा प्रतीत होता है और संभवतः अगले पद में आगे बढ़ता है।
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: उसने उसका पीछा किया
  rationale: सैन्य प्रसंग में διώκω और ὀπίσω αὐτοῦ का स्वाभाविक अर्थ शत्रुतापूर्वक पीछा करना है। हिन्दी में यह प्रयोग मूल का भाव स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: εἰς Ἄζωτον
  choice: अज़ोतुस तक
  rationale: εἰς यहाँ पीछा किए जाने की सीमा बताता है; ‘तक’ इस अर्थ को सहजता से व्यक्त करता है। स्थाननाम को यूनानी रूप के निकट लिप्यंतरित किया गया है।
- source_word: συνῆψαν ... εἰς πόλεμον
  choice: युद्ध में भिड़ गईं
  rationale: सैन्य प्रसंग में συνάπτω εἰς πόλεμον का अर्थ लड़ाई आरम्भ करना या युद्ध में भिड़ना है। यह अनुवाद हिन्दी में स्वाभाविक है और मूल की क्रियात्मक तीव्रता बनाए रखता है।
- source_word: αἱ παρεμβολαὶ
  choice: सेनाएँ
  rationale: παρεμβολή का शाब्दिक अर्थ छावनी है, पर बहुवचन में यह यहाँ छावनियों में स्थित सैन्य दलों अथवा सेनाओं को सूचित करता है। ‘सेनाएँ’ प्रसंग में स्पष्ट है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ὀπίσω αὐτοῦ
  choice: उसके पीछे
  rationale: दूसरी बार आया यह वाक्यांश स्थानगत अर्थ रखता है। सर्वनाम का संदर्भ मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: ἀπέλειπεν
  choice: पीछे छोड़ गया
  rationale: ἀπολείπω अलग या पीछे छोड़ने का अर्थ देता है। यह चयन उस अर्थ को बनाए रखता है और यह अतिरिक्त अनुमान नहीं लगाता कि घुड़सवारों को किस विशेष उद्देश्य से रखा गया था।
- source_word: χιλίαν ἵππον
  choice: एक हज़ार घुड़सवार
  rationale: सैन्य गणना में ἵππος घोड़ों के माध्यम से घुड़सवार सेना को सूचित कर सकता है। ‘घुड़सवार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
