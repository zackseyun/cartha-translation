  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: hi
  text: यहूदा के विषय में शेष वृत्तांत, उसके युद्ध, उसके किए हुए वीरतापूर्ण कार्य और उसकी महानता लिखे नहीं गए, क्योंकि वे बहुत-से थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων Ἰούδα
  choice: यहूदा के विषय में बाकी वृत्तांत
  rationale: यहाँ τὰ περισσὰ शेष या अतिरिक्त सामग्री को और λόγοι इतिहास-वर्णन के संदर्भ में वृत्तांतों को सूचित करता है। यह वाक्यांश यूनानी संबंधवाचक संरचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν πολέμων
  choice: उसके युद्ध
  rationale: πολέμων यहूदा के व्यापक सैन्य संघर्षों को सूचित करता है; ‘युद्ध’ सीधे अर्थ को बनाए रखता है और इसे केवल अलग-अलग लड़ाइयों तक सीमित नहीं करता।
- source_word: τῶν ἀνδραγαθιῶν ὧν ἐποίησεν
  choice: उसके किए हुए वीरतापूर्ण कार्य
  rationale: ἀνδραγαθίαι साहस और पराक्रम से किए गए कार्य हैं। ‘वीरतापूर्ण कार्य’ प्रशंसात्मक भाव बनाए रखता है और लैंगिक रूप से भ्रामक शाब्दिक अनुवाद से बचता है।
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: उसकी महानता
  rationale: μεγαλωσύνη यहाँ यहूदा के ऊँचे कद, प्रतिष्ठा और महान उपलब्धियों का व्यापक बोध देती है; ‘महानता’ मूल की अर्थगत व्यापकता सुरक्षित रखती है।
- source_word: οὐ κατεγράφη
  choice: लिखित रूप में दर्ज नहीं किए गए
  rationale: καταγράφω का निष्क्रिय रूप किसी बात को लिखित अभिलेख में दर्ज किए जाने को सूचित करता है। यह हिन्दी अभिव्यक्ति क्रिया के लेखन और अभिलेखन—दोनों पक्ष स्पष्ट करती है।
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: क्योंकि वे बहुत ही अधिक थे
  rationale: γάρ कारण बताता है और σφόδρα मात्रा पर विशेष बल देता है। ‘बहुत ही अधिक’ उस प्रबलता को सहज हिन्दी में बनाए रखता है।
