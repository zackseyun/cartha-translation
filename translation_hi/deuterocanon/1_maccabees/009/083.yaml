  yaml_path: translation/deuterocanon/1_maccabees/009/083.yaml
  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: hi
  text: अज़ोतुस[a] तक पहुँचकर, वे बचने के लिए बेत-दागोन, उनके मूर्ति-मंदिर[b] में प्रवेश किए। और योनातान ने अज़ोतुस और उसके आस-पास के नगरों को आग लगा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अज़ोतुस, अशदोद का यूनानी नाम है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “उनकी मूर्ति”; यहाँ यूनानी वाक्यांश संभवतः केवल मूर्ति नहीं, बल्कि बेत-दागोन के मूर्ति-स्थान या मंदिर की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: अज़ोतुस
  rationale: यूनानी स्थान-नाम का लिप्यंतरण रखा गया है; इसका इब्रानी समकक्ष अशदोद पादटिप्पणी में बताया गया है। आरंभिक कर्मकारक रूप पिछले प्रसंग से जुड़ा है, इसलिए ‘तक’ से दिशा व्यक्त की गई है।
- source_word: Βηθδαγὼν
  choice: बेत-दागोन
  rationale: स्थान अथवा भवन के नाम को लिप्यंतरित किया गया है; साथ का वाक्यांश उसके मूर्ति-मंदिर होने का संकेत देता है।
- source_word: τὸ εἴδωλον αὐτῶν
  choice: अपने मूर्ति-मंदिर
  rationale: शाब्दिक अर्थ ‘उनकी मूर्ति’ है, पर भीतर प्रवेश करने के संदर्भ में यह बेत-दागोन के मूर्ति-स्थान अथवा मंदिर को सूचित करता है। पादटिप्पणी शाब्दिक संभावना सुरक्षित रखती है।
- source_word: τοῦ σωθῆναι
  choice: बचने के लिए
  rationale: यह उद्देश्य बताने वाला पद है और सैनिक पलायन के संदर्भ में शारीरिक सुरक्षा पाने का अर्थ देता है।
- source_word: ἐνεπύρισεν
  choice: आग लगा दी
  rationale: क्रिया का अर्थ आग लगाना है; यह पूर्ण विनाश को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: उसके आस-पास के नगरों
  rationale: यह अज़ोतुस के चारों ओर स्थित निकटवर्ती नगरों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सैनिक पलायन के संदर्भ में σωθῆναι का अर्थ
  choice: शारीरिक संकट से बचना या सुरक्षा पाना
  alternative: धार्मिक अर्थ में उद्धार पाना
  rationale: लोग युद्ध से भागकर एक मंदिर में शरण ले रहे हैं; इसलिए यहाँ धार्मिक उद्धार नहीं, तत्काल सुरक्षा अभिप्रेत है।
- issue: τὸ εἴδωλον αὐτῶν का मूर्ति या मंदिर के रूप में बोध
  choice: मुख्य पाठ में मूर्ति-मंदिर
  alternative: शाब्दिक रूप से ‘उनकी मूर्ति’
  rationale: ‘बेत-दागोन में प्रवेश किया’ के साथ यह वाक्यांश मंदिर अथवा मूर्ति-स्थान का परिचय देता प्रतीत होता है, फिर भी यूनानी की शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जा घुसे’ पलायन करते लोगों के शरण लेने की तात्कालिकता व्यक्त करता है। स्थान-नाम यूनानी रूपों के अनुसार लिप्यंतरित हैं, जबकि परिचित इब्रानी नाम पादटिप्पणी में दिया गया है।
