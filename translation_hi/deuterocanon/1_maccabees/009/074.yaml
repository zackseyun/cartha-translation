base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: hi
  text: जब योनातान ने अपोल्लोनियुस की बातें सुनीं, तो उसका मन उद्वेलित हो उठा। उसने दस हज़ार पुरुषों को चुना और यरूशलेम से निकल पड़ा। उसका भाई शमौन उसकी सहायता करने के लिए उससे आ मिला[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में अधिक शाब्दिक रूप से, “उसकी सहायता के लिए उससे मिला।” यहाँ आशय संभवतः यह है कि शमौन योनातान का साथ देने आया।
    reason: ‘उससे आ मिला’ प्रसंगगत आशय व्यक्त करता है, जबकि टिप्पणी συνήντησεν के अधिक शाब्दिक अर्थ ‘मिला’ को सुरक्षित रखती है।
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: जब ... ने ... सुनीं
  rationale: ὡς के साथ भूतकालिक क्रिया एक समयवाचक उपवाक्य बनाती है; यह हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: अपल्लोनियुस की बातें
  rationale: λόγοι का मूल अर्थ ‘बातें/शब्द’ है। यहाँ ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल औपचारिक संदेश मानकर अर्थ को सीमित नहीं करता।
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: उसका मन उद्वेलित हो उठा
  rationale: यह पदबंध मन के भीतर हुई हलचल को बताता है, पर यह निश्चित नहीं करता कि उसका भाव क्रोध, भय या व्याकुलता था। ‘उद्वेलित’ इस अस्पष्टता को बनाए रखता है।
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: क्रिया के सीधे अर्थ को सरल और वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: δέκα χιλιάδας ἀνδρῶν
  choice: दस हज़ार पुरुषों
  rationale: ἀνδρῶν का स्पष्ट अर्थ ‘पुरुष’ है। सैन्य प्रसंग होने पर भी मूल पाठ यहाँ ‘सैनिक’ नहीं कहता।
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: यरूशलेम से निकल पड़ा
  rationale: यह यरूशलेम से प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है और मूल पाठ से अतिरिक्त सैन्य रंग नहीं जोड़ता।
- source_word: συνήντησεν αὐτῷ
  choice: उससे आ मिला
  rationale: συναντάω का सीधा अर्थ ‘मिलना/भेंट होना’ है। प्रसंग में शमौन सहायता देने आया, इसलिए ‘आ मिला’ भेंट और साथ देने—दोनों भावों को सहज रूप से समेटता है।
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: उसकी सहायता करने के लिए
  rationale: ἐπί के साथ βοήθεια यहाँ उद्देश्य व्यक्त करता है; यह हिन्दी रूप उस उद्देश्य को स्पष्ट और स्वाभाविक रखता है।
