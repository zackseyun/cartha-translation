  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। वाक्य-विन्यास को पठनीय बनाने के लिए यूनानी के लंबे समन्वित वाक्य को तीन वाक्यों में बाँटा गया है। आरम्भ का φυγεῖν पिछले पद का अंश प्रतीत होता है, इसलिए 9:74 के अनुवाद में सम्मिलित नहीं किया गया।
