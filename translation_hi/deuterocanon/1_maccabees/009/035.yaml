  yaml_path: translation/deuterocanon/1_maccabees/009/035.yaml
  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
translation:
  language: hi
  text: और उसने अपने भाई को लोगों के दल के अगुए के रूप में भेजा। फिर उसने अपने नबाती मित्रों से आग्रह किया कि वे उनका बहुत-सा सामान अपने पास सुरक्षित रख लें।[a]
  philosophy: optimal-equivalence
  footnotes:
