    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सामान्य कथात्मक अर्थ ‘भेजना’ है; हिन्दी में यही सीधा और स्वाभाविक है।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई को
  rationale: यूनानी संबंधवाचक वाक्यांश का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: लोगों के दल का अगुआ बनाकर
  rationale: कृदन्त भाई की नेतृत्वकारी भूमिका बताता है। ‘अगुआ बनाकर’ नियुक्त कार्य को व्यक्त करता है और ‘लोगों का दल’ ὄχλος के सामूहिक अर्थ को इस यात्रा-संदर्भ में स्वाभाविक रूप से रखता है।
- source_word: παρεκάλεσεν
  choice: आग्रह किया
  rationale: क्रिया निवेदन, प्रोत्साहन या आग्रह का भाव दे सकती है; यहाँ व्यावहारिक अनुरोध के लिए ‘आग्रह किया’ उपयुक्त है।
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: अपने नबाती मित्रों से
  rationale: जातीय पहचान और मैत्री-संबंध दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: παραθέσθαι αὐτοῖς
  choice: अपने पास सुरक्षित रख लें
  rationale: मध्यवाच्य रूप किसी की वस्तु ग्रहण करके उसकी देखरेख या सुरक्षा करने का भाव दे सकता है; यह हिन्दी में उस अभिरक्षात्मक अर्थ को स्पष्ट करता है।
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: उनका बहुत-सा सामान
  rationale: ἀποσκευή यात्रा में साथ ले जाए जाने वाले सामान या असबाब को दर्शाता है, और πολλήν उसकी बड़ी मात्रा पर बल देता है।
