- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: पहले महीने में
  rationale: संबंधकारक पदबंध यहाँ समय बताता है; ‘पहले महीने में’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ बावनवें वर्ष के
  rationale: यूनानी में संख्या जोड़ात्मक क्रम में है—दूसरा, पचासवाँ और सौवाँ—जिसका मानक हिन्दी क्रमसूचक रूप ‘एक सौ बावनवाँ वर्ष’ है।
- source_word: παρενέβαλον
  choice: उन्होंने … छावनी डाली
  rationale: यह क्रिया विशेष रूप से सैनिक दल के डेरा डालने या शिविर लगाने के लिए प्रयुक्त होती है; ‘छावनी डाली’ प्रसंग का सैन्य भाव और कथात्मक गरिमा बनाए रखता है।
- source_word: εἰς Ἱερουσαλήμ
  choice: यरूशलेम में
  rationale: εἰς सामान्यतः किसी स्थान की ओर गति या उसमें प्रवेश व्यक्त करता है, पर छावनी डालने की क्रिया के साथ हिन्दी में परिणामी स्थान को ‘यरूशलेम में’ कहना स्वाभाविक है।
