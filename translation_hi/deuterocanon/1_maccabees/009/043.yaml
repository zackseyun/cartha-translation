lexical_decisions:
- source_word: ἤκουσεν
  choice: यह समाचार सुना
  rationale: क्रिया का कर्म यूनानी में निहित है और पिछले प्रसंग से समझा जाता है। हिन्दी में केवल ‘सुना’ अस्वाभाविक रूप से अधूरा लगता, इसलिए ‘यह समाचार’ जोड़कर सूचना मिलने का प्रसंगगत अर्थ व्यक्त किया गया है, बिना समाचार की विषयवस्तु को अधिक विशिष्ट बनाए।
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: यह यहूदी यूनानी मुहावरा एकवचन सब्त-दिवस को सूचित करता है। ‘सब्त के दिन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: यरदन के किनारों तक
  rationale: κρηπίς का मूल अर्थ आधार, छोर या किनारा हो सकता है; नदी के भौगोलिक प्रसंग में ‘किनारों’ सबसे उपयुक्त है और यूनानी बहुवचन को भी बनाए रखता है।
- source_word: ἐν δυνάμει πολλῇ
  choice: एक बड़ी सेना के साथ
  rationale: सैन्य कथा में δύναμις यहाँ बड़ी सशस्त्र टुकड़ी या सैन्य बल को दर्शाता है। साधारण हिन्दी में ‘बड़ी सेना’ स्पष्ट है; यह शक्ति जैसे अमूर्त अर्थ से बचता है।
- source_word: Βακχίδης
  choice: बक्खीदेस
  rationale: यूनानी उच्चारण और देवनागरी लिप्यंतरण के अनुरूप व्यक्तिगत नाम को अनूदित न करके लिप्यंतरित किया गया है।
