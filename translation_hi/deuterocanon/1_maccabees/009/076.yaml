lexical_decisions:
- source_word: φοβηθέντες
  choice: डर गए
  rationale: अओरिस्ट कृदन्त नगर के लोगों की भयभीत अवस्था और उससे प्रेरित अगली कार्रवाई को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἤνοιξαν
  choice: उन्होंने खोल दिया
  rationale: यूनानी पाठ में क्रिया का कर्म नहीं दिया गया है। हिन्दी में भी उसे अनिर्दिष्ट रखकर मूल की अपूर्णता सुरक्षित रखी गई है; सम्भावित आशय पादटिप्पणी में बताया गया है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोग
  rationale: यह पद नगर से सम्बद्ध लोगों या निवासियों को सूचित करता है। 'नगर के लोग' सहज हिन्दी है और अनावश्यक रूप से उन्हें केवल पुरुष या सैनिक नहीं ठहराता।
- source_word: ἐκυρίευσεν
  choice: पर अधिकार कर लिया
  rationale: κυριεύω यहाँ किसी स्थान पर प्रभुत्व या नियंत्रण प्राप्त करने का बोध देता है; यह अनुवाद सैनिक-राजनीतिक प्रसंग के अनुकूल है और केवल 'कब्ज़ा किया' से कुछ अधिक व्यापक है।
- source_word: Ἰόππης
  choice: याफा
  rationale: प्राचीन याफा/जोप्पा के लिए हिन्दी में प्रचलित और पहचानने योग्य स्थान-नाम 'याफा' चुना गया है।
- source_word: ἤκουσεν
  choice: ने यह सुना
  rationale: ἀκούω का सीधा अर्थ सुरक्षित है। 'यह' पूर्ववर्ती घटना की ओर स्वाभाविक हिन्दी संकेत है, जबकि खण्डित वाक्य का आगे बढ़ता 'और' यथावत रखा गया है।
- source_word: Ἀπολλώνιος
  choice: अपुल्लोनियुस
  rationale: यूनानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण, जिससे नाम की प्राचीन ध्वनि और अन्य बाइबलीय नामों के अनुरूप गरिमा बनी रहती है।
