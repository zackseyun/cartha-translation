- source_word: κατέστησεν
  choice: अधिकारी ठहराया
  rationale: यह क्रिया किसी को अधिकार या पद पर स्थापित करने का अर्थ देती है; यह हिन्दी प्रयोग औपचारिक नियुक्ति और स्थापना दोनों का भाव रखता है।
- source_word: κυρίους
  choice: अधिकारी
  rationale: κυρίους का मूल अर्थ 'स्वामी/मालिक' है, पर यहाँ भूभाग पर राजनीतिक-प्रशासनिक अधिकार रखने वाले व्यक्तियों का संकेत है; 'अधिकारी' संदर्भगत अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: τῆς χώρας
  choice: उस देश का
  rationale: χώρα यहाँ नियंत्रित भूभाग या देश को दर्शाता है। निश्चित उपपद के संदर्भगत संकेत को हिन्दी में 'उस देश' से व्यक्त किया गया है।
