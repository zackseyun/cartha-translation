translation:
  language: hi
  text: और बक्खिदेस को इसका पता चल गया, और वह उसे मार डालने की कोशिश करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: पता चल गया
  rationale: यहाँ γινώσκω का एओरिस्ट केवल पहले से जानने के बजाय किसी बात की जानकारी मिलने को व्यक्त करता है। ‘पता चल गया’ आधुनिक हिन्दी में इस कथात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐζήτει
  choice: कोशिश करता रहा
  rationale: इम्परफेक्ट रूप चलती हुई अथवा बार-बार की गई कोशिश को दर्शाता है। ‘कोशिश करता रहा’ इस अपूर्ण और प्रयत्नात्मक पक्ष को स्पष्ट रखता है।
- source_word: ἀποκτεῖναι
  choice: मार डालने
  rationale: इस क्रिया का सीधा अर्थ जान से मारना है। ‘मार डालना’ स्वाभाविक हिन्दी है और औपचारिक मृत्युदंड का अनावश्यक संकेत नहीं देता।
- source_word: Βακχίδης
  choice: बक्खिदेस
  rationale: यूनानी नाम Βακχίδης का देवनागरी में स्रोत-निकट लिप्यंतरण।
- source_word: αὐτόν
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मकारक सर्वनाम को सन्दर्भानुसार स्वाभाविक हिन्दी ‘उसे’ से व्यक्त किया गया है।
