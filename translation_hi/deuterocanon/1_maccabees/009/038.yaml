lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: याद किया
  rationale: यह μιμνῄσκομαι के अओरिस्ट रूप का सीधा और स्वाभाविक हिन्दी रूप है; इससे केवल स्मरण करने का भाव व्यक्त होता है, कोई अतिरिक्त आशय नहीं जोड़ा जाता।
- source_word: Ἰωάνου
  choice: योहन
  rationale: यह यूनानी व्यक्तिगत नाम के निकट, आधुनिक हिन्दी में सुबोध रूप है और पाठ में उपस्थित यूनानी नाम को किसी अन्य रूप में पुनर्निर्मित नहीं करता।
- source_word: τοῦ ἀδελφοῦ αὐτῶν
  choice: अपने भाई
  rationale: कर्ता बहुवचन होने के कारण ‘अपने भाई’ स्वाभाविक हिन्दी में यूहन्ना/योहन का उनसे संबंध स्पष्ट करता है।
- source_word: ἀνέβησαν
  choice: ऊपर चढ़े
  rationale: यह स्थानगत आरोहण को बनाए रखता है और उस गंतव्य का अनावश्यक विवरण नहीं जोड़ता जिसे यूनानी पाठ स्पष्ट नहीं करता।
- source_word: ἐκρύβησαν
  choice: छिप गए
  rationale: संदर्भ में यह रूप उनके स्वयं को छिपा लेने का भाव देता है; ‘छिप गए’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ὑπὸ τὴν σκέπην τοῦ ὄρους
  choice: पहाड़ की आड़ में
  rationale: σκέπη में ढकाव, ओट, आश्रय या सुरक्षा का भाव हो सकता है। ‘आड़ में’ छिपने के प्रसंग में ठोस स्थानगत चित्र और शब्द की अर्थ-व्याप्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
