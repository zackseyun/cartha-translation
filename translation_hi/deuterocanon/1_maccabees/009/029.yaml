base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/029.yaml
  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: hi
  text: “जब से तुम्हारा भाई यहूदा मर गया है, तब से उसके समान कोई पुरुष नहीं है जो शत्रुओं और बक्खीदेस के विरुद्ध निकल सके, तथा हमारे राष्ट्र से बैर रखने वालों के विरुद्ध भी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी वाक्यांश असामान्य है; उसका शाब्दिक रूप है, “और हमारे राष्ट्र से बैर रखने वालों में।” मुख्य पाठ प्रसंग के संभावित आशय के अनुसार इसे एक और विरोधी समूह मानकर प्रस्तुत करता है।
    reason: मूल यूनानी की वाक्य-विन्यास संबंधी कठिनाई और वैकल्पिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: जब से ... तब से
  rationale: यह यूनानी पद समय के उस आरंभ-बिंदु को बताता है जिसके वर्तमान परिणाम बने हुए हैं। हिन्दी में सहसंबंधी रचना ‘जब से ... तब से’ इस संबंध को स्वाभाविक और स्पष्ट रखती है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यूनानी Ἰούδας का हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहूदा’ है।
- source_word: τετελεύτηκεν
  choice: मर गया है
  rationale: पूर्णकालिक क्रिया पूरी हो चुकी मृत्यु और उसके वर्तमान परिणाम को व्यक्त करती है; यह सीधा और सहज हिन्दी रूप है।
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: उसके समान कोई पुरुष
  rationale: यह ἀνήρ के पुरुषवाचक अर्थ और ὅμοιος की तुलना—दोनों को बनाए रखता है।
- source_word: ἐξελθεῖν πρὸς τοὺς ἐχθροὺς
  choice: शत्रुओं का सामना करने ... निकल सके
  rationale: सैन्य प्रसंग में ἐξέρχομαι और πρὸς का संयुक्त भाव विरोधियों के विरुद्ध निकलकर उनका सामना करना है। यह अनुवाद उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Βακχίδην
  choice: बक्खीदेस
  rationale: यह यूनानी व्यक्तिनाम Βακχίδης का निकट देवनागरी लिप्यंतरण है।
- source_word: τοῦ ἔθνους ἡμῶν
  choice: हमारे राष्ट्र
  rationale: यहाँ ἔθνος यहूदी समुदाय को सामूहिक राष्ट्रीय-राजनीतिक इकाई के रूप में दर्शाता है; ‘राष्ट्र’ उस अर्थ को ‘लोगों’ की अपेक्षा अधिक सटीकता से रखता है।
- source_word: καὶ ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  choice: तथा हमारे राष्ट्र से बैर रखनेवालों के विरुद्ध
  rationale: प्राप्त यूनानी में ἐν (‘में/बीच’) इस वाक्य-विन्यास में कठिन है। प्रसंग इन लोगों को एक और विरोधी समूह के रूप में प्रस्तुत करता है, इसलिए मुख्य पाठ में संभावित आशय दिया गया है और शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ἀνήρ का पुरुषवाचक रूप
  choice: पुरुष
  alternative: व्यक्ति / कोई
  rationale: मूल में सामान्य मानववाचक शब्द नहीं, बल्कि स्पष्ट रूप से पुरुषवाचक ἀνήρ है; इसलिए लिंग-संबंधी विशेषता बनाए रखी गई है।
- issue: ἔθνος ἡμῶν का सामूहिक अर्थ
  choice: हमारे राष्ट्र
  alternative: हमारे लोग / हमारी जाति
  rationale: 1 मक्काबियों के इस संदर्भ में यह पद यहूदी जनसमुदाय की राष्ट्रीय और सामुदायिक पहचान को व्यक्त करता है। ‘राष्ट्र’ किसी अतिरिक्त संप्रदायगत अर्थ को जोड़े बिना उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक-सैन्य शैली वाला रूप अपनाया गया है। ‘सामना करने ... निकल सके’ सैन्य प्रसंग स्पष्ट करता है, जबकि पादटिप्पणी मूल यूनानी की वास्तविक अस्पष्टता बनाए रखती है।
