  rationale: यह अभिव्यक्ति छिपे हुए स्थान से अचानक निकलकर शत्रुतापूर्वक आक्रमण करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἀπέκτειναν αὐτούς
  choice: उन्हें मार डाला
  rationale: यूनानी क्रिया के प्रत्यक्ष और प्रबल अर्थ को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: बहुत-से लोग घायल होकर गिर पड़े
  rationale: τραυματίαι के मुख्य अर्थ ‘घायल लोग’ को रखते हुए ἔπεσαν को भी स्पष्ट रूप से व्यक्त करता है; व्यापक अर्थ ‘हताहत’ को पाद-टिप्पणी में रखा गया है।
- source_word: οἱ ἐπίλοιποι
  choice: बाकी लोग
  rationale: बचे हुए अन्य लोगों के लिए सहज और स्पष्ट आधुनिक हिन्दी।
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: पहाड़ की ओर भाग गए
  rationale: यूनानी पाठ के एकवचन τὸ ὄρος को बनाए रखता है और गति की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ σκεύη αὐτῶν
  choice: उनका सारा साज-सामान
  rationale: सैन्य प्रसंग में σκεύη के व्यापक अर्थ—सामान, उपकरण या अभियान-सामग्री—के लिए ‘साज-सामान’ सहज है और अनावश्यक रूप से अर्थ सीमित नहीं करता।
