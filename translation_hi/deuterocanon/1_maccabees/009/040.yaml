  yaml_path: translation/deuterocanon/1_maccabees/009/040.yaml
  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: hi
  text: तब वे घात से निकलकर उन पर टूट पड़े और उन्हें मार डाला। बहुत-से लोग घायल होकर गिर पड़े[a], और बाकी लोग पहाड़ पर भाग गए। उन्होंने उनका सारा साज-सामान[b] ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से लोग हताहत होकर गिर पड़े।” यूनानी शब्द τραυματίαι घायल लोगों या अधिक व्यापक अर्थ में युद्ध के हताहतों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका सारा सामान” अथवा “उनके सारे उपकरण।” यूनानी शब्द σκεύη वस्तुओं या साज-सामान के लिए व्यापक शब्द है; यहाँ सैन्य प्रसंग व्यक्तिगत या अभियान-सामग्री की ओर संकेत करता है।
    reason: lexical_alternative
