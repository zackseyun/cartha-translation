  choice: यह बात स्वीकार कर ली
  rationale: मध्यवाच्य रूप पिछले प्रस्ताव या शर्तों को स्वीकार करने का भाव देता है; ‘यह बात’ हिन्दी में संदर्भ को स्वाभाविक बनाता है।
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: उसके कहे अनुसार किया
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और कथन के अनुसार कार्य करने का अर्थ बनाए रखता है।
- source_word: ὤμοσεν αὐτῷ
  choice: उसके सामने शपथ खाई
  rationale: क्रिया शपथ लेने की गंभीरता व्यक्त करती है; सम्प्रदान αὐτῷ को यहाँ उस व्यक्ति के सम्मुख या उससे की गई प्रतिज्ञा के रूप में व्यक्त किया गया है।
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: उसका अहित करने की कोशिश नहीं करेगा
  rationale: ἐκζητέω और κακόν का संयुक्त भाव किसी के विरुद्ध बुराई या हानि चाहने अथवा उसका उपाय करने का है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: जीवन भर
  rationale: यह पूरे जीवनकाल की अवधि को संक्षेप में और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; संदर्भ में जीवन शपथ खाने वाले का है।
