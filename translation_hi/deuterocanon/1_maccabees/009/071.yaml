  text: उसने स्वीकार किया और उसके कहे के अनुसार किया, और उससे यह शपथ खाई कि वह जीवन भर उसका अहित करने का प्रयत्न नहीं करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “उसके विरुद्ध बुराई नहीं खोजेगा।”'
    reason: κακὸν के लिए ‘बुराई’ अधिक शाब्दिक विकल्प है; मुख्य पाठ में ‘अहित करने का प्रयत्न’ सन्दर्भानुकूल अर्थ देता है।
