  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: hi
  text: और वह हिम्मत हार गया[a] और जो लोग रह गए थे, उनसे कहा, “हम उठें और अपने विरोधियों पर चढ़ाई करें—शायद हम उनसे लड़ सकें।”
  philosophy: optimal-equivalence
