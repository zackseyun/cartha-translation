    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: हिम्मत हार गया
  rationale: इस निष्क्रिय क्रिया का अर्थ शारीरिक रूप से निर्बल पड़ना या मन से टूट जाना हो सकता है। युद्ध के प्रसंग में ‘हिम्मत हार गया’ आंतरिक साहस टूटने का स्वाभाविक आधुनिक हिन्दी रूप है; पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: τοῖς καταλειφθεῖσιν
  choice: जो लोग बच गए थे
  rationale: कृदंत उन लोगों को दर्शाता है जो शेष रह गए थे। युद्ध के संदर्भ में ‘बच गए थे’ सहज है, पर इसे तकनीकी रूप से ‘जीवित बचे’ तक सीमित नहीं करता।
- source_word: Ἀναστῶμεν
  choice: आओ, हम उठें
  rationale: आग्रहसूचक सम्भावनार्थक रूप को सामूहिक सैन्य आह्वान के रूप में रखा गया है।
- source_word: ἀναβῶμεν
  choice: चढ़ाई करें
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाना’ है और यहाँ विरोधियों की ओर सैन्य बढ़त का संकेत है। ‘चढ़ाई करें’ हिन्दी में स्थलाकृतिक तथा सैन्य दोनों भावों को सम्भव रखता है।
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: अपने विरोधियों
  rationale: यह शब्द सामने खड़े या विरोध में स्थित लोगों को बताता है। ‘विरोधियों’ अर्थ को ‘शत्रुओं’ से अधिक निकटता से सुरक्षित रखता है।
- source_word: ἐὰν ἄρα
  choice: शायद
  rationale: यह संयोजन अनिश्चितता और संकोचपूर्ण आशा व्यक्त करता है। ‘शायद’ आधुनिक हिन्दी में इस भाव को स्वाभाविक ढंग से पहुँचाता है।
- source_word: δυνώμεθα
  choice: हम ... सकें
  rationale: शर्त के अधीन सामर्थ्य को हिन्दी के सम्भावनार्थक ‘सकें’ से व्यक्त किया गया है।
- source_word: πολεμῆσαι
  choice: लड़
  rationale: तत्काल युद्ध-प्रसंग में सामान्य और स्पष्ट हिन्दी क्रिया मूल के ‘युद्ध करना’ अर्थ को पर्याप्त रूप से व्यक्त करती है।
