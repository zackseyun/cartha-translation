lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदबंध वर्तमान क्षण की तात्कालिकता और पिछले कथन से निकलने वाले निष्कर्ष—दोनों को व्यक्त करता है।
- source_word: κεκράξατε
  choice: पुकारो
  rationale: आज्ञार्थक रूप यहाँ ऊँचे स्वर से की गई अत्यावश्यक विनती को दर्शाता है; आधुनिक हिन्दी में ‘पुकारो’ स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग की ओर
  rationale: यूनानी पाठ में सीधे ‘स्वर्ग’ है, जो संभवतः परमेश्वर के लिए श्रद्धापूर्ण लक्षणा है। अनुवाद मूल अभिव्यक्ति को बनाए रखता है और उसे स्पष्ट रूप से ‘परमेश्वर’ में नहीं बदलता।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को प्रस्तुत करता है।
- source_word: διασωθῆτε
  choice: तुम ... बचाए जाओ
  rationale: निष्क्रिय संभावनार्थक क्रिया सैन्य संकट से सुरक्षित छुड़ाए जाने को व्यक्त करती है; यह प्रयोग अनावश्यक रूप से व्यापक धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: ἐκ χειρὸς
  choice: के हाथ से
  rationale: यह सामर्थ्य या नियंत्रण का बाइबलीय मुहावरा है, जो हिन्दी में भी स्पष्ट और स्वाभाविक है।
- source_word: ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं
  rationale: यह यूनानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘स्वर्ग’ का शाब्दिक अनुवाद किया जाए या उसे स्पष्ट रूप से ‘परमेश्वर’ कहा जाए
  choice: स्वर्ग की ओर
  alternative: परमेश्वर को
  rationale: यूनानी में ‘स्वर्ग’ लिखा है और संभवतः यह परमेश्वर के लिए श्रद्धापूर्ण लक्षणा है, पर पाठ स्वयं परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। इसलिए मूल की अर्थगत गुंजाइश और धर्मवैज्ञानिक संयम बनाए रखा गया है।
