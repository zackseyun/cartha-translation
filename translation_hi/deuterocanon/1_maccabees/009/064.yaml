lexical_decisions:
- source_word: ἐλθὼν
  choice: तब उसने आकर
  rationale: ἔρχομαι का एओरिस्ट कृदन्त अगली घटना की क्रमिकता बताता है; हिन्दी कथा-शैली में ‘तब उसने आकर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρεβάλεν ἐπὶ
  choice: के विरुद्ध छावनी डाली
  rationale: सैन्य प्रसंग में παρεμβάλλω और ἐπί किसी स्थान के विरुद्ध पड़ाव डालने का अर्थ देते हैं; यह अनुवाद इसे समय से पहले केवल ‘घेरा डाला’ नहीं बनाता।
- source_word: Βεθβασί
  choice: बेतबासी
  rationale: स्थान-नाम का देवनागरी में लिप्यंतरण किया गया है।
- source_word: ἐπολέμησεν αὐτήν
  choice: वह ... उससे लड़ता रहा
  rationale: πολεμέω युद्ध करने या लड़ने को दर्शाता है; अपूर्णतासूचक हिन्दी अभिव्यक्ति ‘बहुत दिनों तक’ जारी रही सैन्य कार्रवाई को स्वाभाविक ढंग से बताती है।
- source_word: ἡμέρας πολλὰς
  choice: बहुत दिनों तक
  rationale: अवधि-सूचक कर्मकारक का सहज हिन्दी रूप।
- source_word: ἐποίησεν μηχανάς
  choice: उसने घेराबंदी के यंत्र बनाए
  rationale: इस सैन्य प्रसंग में μηχαναί घेराबंदी में प्रयुक्त युद्ध-यंत्रों को सूचित करता है; ‘यंत्र’ मूल शब्द की व्यापकता भी बनाए रखता है।
