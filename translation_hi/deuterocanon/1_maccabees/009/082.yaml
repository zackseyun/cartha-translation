lexical_decisions:
- source_word: φάλαγγα
  choice: युद्ध-पंक्ति को
  rationale: φάλαγξ सघन युद्ध-विन्यास या युद्ध-पंक्ति को सूचित करता है। पद आरम्भ से ही वाक्यांश-मात्र है, इसलिए कर्मकारक रूप और स्रोत की आकस्मिकता बनाए रखी गई है।
- source_word: ἵππος
  choice: घुड़सवार दल
  rationale: एकवचन ἡ ἵππος यहाँ सामूहिक अर्थ में घुड़सवार सेना के लिए प्रयुक्त है; ‘घुड़सवार दल’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐξελύθη
  choice: बिखर गया था
  rationale: क्रिया किसी सैन्य गठन के खुल जाने या टूटकर बिखरने का भाव देती है; यह अनुवाद आगामी तितर-बितर होने से स्वाभाविक रूप से जुड़ता है और ‘परास्त हुआ’ जैसी अधिक निश्चित व्याख्या नहीं जोड़ता।
- source_word: συνετρίβησαν
  choice: चूर कर दिया
  rationale: क्रिया का बल कुचलने या चकनाचूर कर देने जैसी घोर पराजय पर है; सक्रिय हिन्दी वाक्य में कर्ता ‘उसने’ ἀπʼ αὐτοῦ के अभिकर्तृ अर्थ को व्यक्त करता है।
- source_word: ἀπʼ αὐτοῦ
  choice: उसने
  rationale: युद्ध-वर्णन में ἀπό के साथ यह वाक्यांश ‘उसके द्वारा/उसके हाथों’ का अर्थ दे सकता है। स्वाभाविक हिन्दी के लिए कर्मवाच्य को कर्तृवाच्य किया गया है, यद्यपि यूनानी वाक्यांश संक्षिप्त और कुछ हद तक संदिग्ध है।
- source_word: ἐσκορπίσθη
  choice: तितर-बितर हो गया
  rationale: यह सैन्य दल के चारों ओर बिखर जाने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: πεδίῳ
  choice: मैदान
  rationale: πεδίον यहाँ खुले समतल भूभाग को दर्शाता है; ‘मैदान’ सामान्य आधुनिक हिन्दी में इस दृश्य के अनुकूल है।
