- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: उसे उसी पर भरोसा था
  rationale: पूर्ण infinitive स्थिर विश्वास दर्शाता है; ‘उसी’ यूनानी स्त्रीलिंग एकवचन सर्वनाम के संदर्भ को जानबूझकर खुला रखता है।
