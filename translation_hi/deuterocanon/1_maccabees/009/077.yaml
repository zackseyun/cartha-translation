  yaml_path: translation/deuterocanon/1_maccabees/009/077.yaml
  text: He encamped three thousand cavalry and a large force[a], and went to Azotus as though passing through; at the same time he was leading them into the plain[c][b], because he had a multitude of cavalry and trusted in it.
translation:
  language: hi
  text: उसने तीन हज़ार घुड़सवारों और एक बड़े सैन्य-बल को छावनी में ठहराया[a], और मानो वहाँ से होकर गुजर रहा हो, ऐसे अशदोद गया[b]। साथ ही वह उन्हें मैदान में ले गया, क्योंकि उसके पास बहुत-से घुड़सवार थे और उसे उसी पर भरोसा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी स्रोत-पंक्ति अगले शब्द के बीच में (‘καὶ κατε-’) समाप्त होती है, जिससे स्पष्ट है कि वाक्य अगली आयत में जारी है। यहाँ केवल इस आयत-इकाई में सुरक्षित पूर्ण अंश का अनुवाद किया गया है।
    reason: textual_variant
  - marker: b
    text: या, ‘मानो केवल वहाँ से होकर जा रहा हो।’ इससे वास्तविक उद्देश्य छिपाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘उसी’ के लिए यूनानी सर्वनाम स्त्रीलिंग एकवचन है। इसका संकेत उसकी सेना की ओर, अथवा विशेष रूप से उसके घुड़सवार सैन्य बल की ओर हो सकता है।
    reason: lexical_alternative
