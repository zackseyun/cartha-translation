  rationale: मूर्तिपूजक देवता के ἱερόν के लिए ‘मंदिर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὸ ἱερὸν αὐτῆς
  choice: उसका मंदिर
  rationale: यूनानी αὐτῆς स्त्रीलिंग है, पर हिन्दी संबंधवाचक रूप पूर्वपद का लिंग व्यक्त नहीं करता। उपलब्ध अंश में पूर्वपद न होने के कारण ‘उसका’ अस्पष्टता को यथावत रखता है।
- source_word: ἐνεπύρισεν ἐν πυρί
