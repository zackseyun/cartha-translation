  text: उसका,[a] और उसने उनकी युद्ध-लूट ले ली, और दागोन के मंदिर और उसके मंदिर[b] को आग से जला दिया। और जो तलवार से गिर पड़े थे—
  philosophy: optimal-equivalence
  footnotes:
