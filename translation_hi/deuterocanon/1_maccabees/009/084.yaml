  rationale: क्रिया के साथ आए ἐν πυρί के बल को रखते हुए हिन्दी में स्वाभाविक और जोरदार अभिव्यक्ति देता है।
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: जो तलवार से गिर पड़े थे
  rationale: पूर्ण कृदन्त की परिणामी अवस्था को ‘गिर पड़े थे’ से और μαχαίρᾳ को पारंपरिक युद्ध-संबंधी ‘तलवार से’ से व्यक्त किया गया है; वाक्यांश की अधूरता भी बनी रहती है।
