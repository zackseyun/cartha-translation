- source_word: αὐτῆς
  choice: उसका
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम का पूर्वपद उपलब्ध अंश में नहीं है। हिन्दी का ‘उसका’ लिंग का अनावश्यक निर्णय किए बिना इस अधूरे आरम्भ को सुरक्षित रखता है।
