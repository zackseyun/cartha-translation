    text: या, “अक्रा में,” अर्थात यरूशलेम का किलेबंद गढ़।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: बना लिया
  rationale: ὁμήρα के साथ मिलकर यह स्वाभाविक हिन्दी में ‘बंधक बना लिया’ होता है; इससे व्यक्तियों को अधिकार में लेने का भाव स्पष्ट रहता है।
- source_word: τοὺς υἱοὺς
  choice: पुत्रों
  rationale: यूनानी पाठ विशेष रूप से पुरुष संतानों का उल्लेख करता है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: τῶν ἡγουμένων
  choice: अगुओं के
  rationale: यह नेतृत्व करने वालों को दर्शाता है; ‘अगुए’ आधुनिक धार्मिक-ऐतिहासिक हिन्दी में सहज है और औपचारिक शासकीय पद का अनावश्यक संकेत नहीं देता।
- source_word: τῆς χώρας
  choice: देश के
  rationale: χώρα के व्यापक भौगोलिक अर्थ को ‘देश’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁμήρα
  choice: बंधक
  rationale: यह शब्द सुरक्षा की जमानत के रूप में रोके गए व्यक्तियों को दर्शाता है; ‘बंधक’ इसका प्रचलित हिन्दी समतुल्य है।
- source_word: ἔθεντο
  choice: रखा
  rationale: हिन्दी कथात्मक शैली में हिरासत या पहरे में रखने के लिए ‘रखा’ स्वाभाविक है।
- source_word: ἐν τῇ ἄκρᾳ
  choice: गढ़ में
  rationale: ἄκρα यहाँ यरूशलेम के किलेबंद दुर्ग को सूचित करता है। ‘गढ़’ संक्षिप्त और ऐतिहासिक प्रसंग के अनुकूल है; विशिष्ट नाम ‘अक्रा’ पादटिप्पणी में दिया गया है।
- source_word: ἐν φυλακῇ
  choice: पहरे में
  rationale: यह सुरक्षित निगरानी या अभिरक्षा का भाव देता है और किसी अलग कारागार-भवन का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
