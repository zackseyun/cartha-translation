  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: hi
  text: और उन्होंने देश के अगुओं के पुत्रों को बंधक बना लिया और उन्हें यरूशलेम के गढ़[a] में हिरासत में रखा।
  philosophy: optimal-equivalence
  footnotes:
