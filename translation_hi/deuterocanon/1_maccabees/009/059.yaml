- source_word: καὶ
  choice: और
  rationale: सरल संयोजक कथा के संक्षिप्त क्रम को स्वाभाविक रूप से बनाए रखता है।
- source_word: πορευθέντες
  choice: जाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की गति को दर्शाता है; हिंदी में ‘जाकर’ इस अधीनस्थ क्रम को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: συνεβουλεύσαντο
  choice: विचार-विमर्श करने लगे
  rationale: मध्यवाच्य रूप साथ मिलकर परामर्श या विचार-विमर्श करने का भाव देता है। प्रसंग में आरंभसूचक हिंदी प्रयोग स्वाभाविक है, यद्यपि यूनानी रूप स्वयं निरंतरता पर विशेष बल नहीं देता।
- source_word: αὐτῷ
  choice: उसके साथ
  rationale: यहाँ संप्रदान कारक उस व्यक्ति को सूचित करता है जिसके साथ विचार-विमर्श किया गया; ‘उसके साथ’ सबसे स्वाभाविक अर्थ है।
