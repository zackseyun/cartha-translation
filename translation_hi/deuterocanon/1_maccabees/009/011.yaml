  yaml_path: translation/deuterocanon/1_maccabees/009/011.yaml
  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: hi
  text: तब सेना छावनी से निकली, और वे उनका सामना करने के लिए डट गए। घुड़सवार सेना दो भागों में बाँट दी गई; गोफन चलानेवाले और धनुर्धर सेना के आगे-आगे चले, और सभी वीर योद्धा अग्रिम पंक्ति में थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश संक्षिप्त है; इसका अनुवाद यह भी हो सकता है: “और अग्रिम मोर्चे पर लड़नेवाले सभी वीर योद्धा थे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἡ δύναμις ἀπὸ τῆς παρεμβολῆς
  choice: सेना छावनी से निकली
  rationale: सैन्य प्रसंग में δύναμις सशस्त्र सेना या सैन्य दल को और παρεμβολή छावनी को दर्शाता है। ἀπῆρεν यहाँ युद्ध के लिए छावनी से बाहर निकलने का भाव देता है।
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: वे उनका सामना करने के लिए डट गए
  rationale: बहुवचन क्रिया सैनिकों के जानबूझकर युद्ध की स्थिति लेने को व्यक्त करती है। ‘डट गए’ आधुनिक हिन्दी में स्थिर होकर सामना करने का सैन्य भाव स्वाभाविक ढंग से देता है।
- source_word: ἡ ἵππος
  choice: घुड़सवार सेना
  rationale: शाब्दिक अर्थ ‘घोड़ा’ है, पर सैन्य प्रयोग में यह सामूहिक रूप से घुड़सवार सैनिकों को दर्शाता है।
- source_word: ἐμερίσθη ... εἰς δύο μέρη
  choice: दो भागों में बाँट दी गई
  rationale: यह युद्ध-विन्यास के लिए किए गए स्पष्ट द्विभाजन को दर्शाता है और यूनानी कर्मवाच्य को बनाए रखता है।
- source_word: οἱ σφενδονῆται καὶ οἱ τοξόται
  choice: गोफन चलानेवाले और धनुर्धर
  rationale: ये क्रमशः गोफन और धनुष से लड़नेवाले सैनिकों के प्रचलित, स्पष्ट हिन्दी नाम हैं।
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: सेना के आगे-आगे चले
  rationale: वाक्यांश मुख्य सैन्य दल से आगे उनकी स्थिति और गति बताता है; यह नेतृत्व या कमान का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί
  choice: सभी वीर योद्धा अग्रिम पंक्ति में थे
  rationale: πρωταγωνισταί यहाँ सबसे आगे लड़नेवालों या अग्रिम पंक्ति को दर्शाता है, जबकि δυνατοί शक्तिशाली अथवा वीर लड़ाकों को। हिन्दी वाक्य सैन्य अर्थ को स्पष्ट रखता है, और यूनानी की संक्षिप्त संरचना की वैकल्पिक समझ पादटिप्पणी में दी गई है।
