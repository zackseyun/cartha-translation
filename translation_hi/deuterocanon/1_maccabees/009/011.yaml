  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य शब्दावली स्पष्ट है, पर अत्यधिक तकनीकी नहीं। अंतिम यूनानी वाक्यांश की वास्तविक संरचनात्मक अस्पष्टता को मुख्य पाठ में जबरन तय करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
