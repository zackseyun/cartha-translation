  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: hi
  text: और उन्होंने उस देश के पुरुषों में से बुराई के अगुओं[a]—पचास पुरुषों—को पकड़ लिया, और उसने उन्हें मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी: ‘बुराई के अगुवे’; इसका अर्थ बुराई का नेतृत्व करनेवाले या प्रमुख दुष्कर्मी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: यह क्रिया व्यक्तियों को बलपूर्वक अपने अधिकार में लेने का बोध देती है। ‘पकड़ लिया’ स्वाभाविक है और ‘गिरफ़्तार किया’ जैसा औपचारिक कानूनी अर्थ नहीं जोड़ता।
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: उस देश के लोगों में से
  rationale: ἀπό बड़े समूह में से चुने जाने को दर्शाता है और χώρα देश, भूभाग या क्षेत्र हो सकता है। हिन्दी में ‘लोगों में से’ चयन का संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: τῶν ἀρχηγῶν τῆς κακίας
  choice: बुराई के अगुओं
  rationale: ἀρχηγός के नेतृत्वकारी अर्थ और τῆς κακίας की संबंधकारक रचना को निकटता से रखा गया है। यह वाक्यांश ‘बुराई के अगुवे’ अथवा ‘प्रमुख दुष्कर्मी’—दोनों अर्थों की संभावना बनाए रखता है।
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: पचास पुरुषों
  rationale: εἰς यहाँ कुल संख्या बताता है। हिन्दी में ठीक पचास की संख्या सीधे व्यक्त की गई है; ‘लगभग’ जोड़ने का स्रोत में आधार नहीं है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: एकवचन क्रिया का मूल अर्थ हत्या करना है। ‘मार डाला’ न्यायिक दंड की वह धारणा नहीं जोड़ता जो ‘मृत्युदंड दिया’ से आ सकती है।
theological_decisions:
- issue: अंतिम उपवाक्य में बहुवचन से एकवचन कर्ता का परिवर्तन
  choice: ‘और उसने उन्हें मार डाला’ द्वारा एकवचन बनाए रखा गया।
  alternative: ‘और उन्होंने उन्हें मार डाला’ करके बहुवचन के अनुरूप कर देना।
  rationale: यूनानी में συνέλαβον बहुवचन (‘उन्होंने पकड़ लिया’) है, जबकि ἀπέκτεινεν एकवचन (‘उसने मार डाला’) है। सम्भवतः एकवचन संदर्भ के किसी प्रधान व्यक्ति की ओर लौटता है, पर अनुवाद उस व्यक्ति को नामित करके अस्पष्टता का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथात्मक रूप अपनाया गया है। ‘अगुओं’ स्रोत की नेतृत्व-संबंधी संज्ञा को बनाए रखता है; डैश से स्पष्ट किया गया है कि पचास की संख्या इन्हीं पकड़े गए पुरुषों की है।
