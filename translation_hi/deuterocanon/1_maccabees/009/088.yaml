lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: और ऐसा हुआ कि जब
  rationale: यह कथात्मक सूत्र घटनाक्रम में नया मोड़ प्रस्तुत करता है। यह अनुवाद ἐγένετο और ὡς दोनों की शक्ति बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἤκουσεν
  choice: सुनीं
  rationale: सन्देश या कही गई बातें प्राप्त करने के प्रसंग में सामान्य श्रवणार्थक क्रिया उपयुक्त है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι का अर्थ ‘शब्द’, ‘सन्देश’ या ‘बातें’ हो सकता है। यहाँ ‘ये बातें’ मूल की बहुवचनता बनाए रखता है और स्वाभाविक हिन्दी है।
- source_word: προσέθετο δοξάσαι
  choice: और भी सम्मान दिया
  rationale: προστίθημι के साथ infinitive आगे बढ़कर या अतिरिक्त रूप से कुछ करने का भाव देता है। राजकीय-राजनीतिक प्रसंग में δοξάζω के लिए ‘सम्मान देना’ उपयुक्त है; ‘और भी’ अतिरिक्त सम्मान का संकेत सुरक्षित रखता है।
- source_word: πόρπην
  choice: एक बकसुआ
  rationale: πόρπη किसी वस्त्र को बाँधने वाले अलंकृत क्लैस्प, ब्रोच या बकसुए को सूचित कर सकता है। ‘बकसुआ’ संक्षिप्त और समझने योग्य है, जबकि पादटिप्पणी वस्तु के रूप की अनिश्चितता बताती है।
