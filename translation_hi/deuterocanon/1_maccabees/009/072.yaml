  yaml_path: translation/deuterocanon/1_maccabees/009/072.yaml
  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: hi
  text: और उसने उन बंदियों को उसे लौटा दिया, जिन्हें उसने पहले यहूदा की भूमि से बंदी बनाया था[a]। फिर वह लौटकर अपने देश चला गया और उनकी सीमाओं के भीतर फिर कभी नहीं आया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘बंदी अवस्था’ है, लेकिन यहाँ इसका प्रयोग बंदी बनाए गए लोगों के समूह के लिए हुआ है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी मुहावरे का शाब्दिक रूप ‘उसने फिर आने को और नहीं जोड़ा’ है; आशय है कि वह उनके क्षेत्र में दोबारा नहीं आया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: लौटा दिया
  rationale: क्रिया का अर्थ पहले ले ली गई वस्तु या व्यक्तियों को वापस देना है; ‘लौटा दिया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τὴν αἰχμαλωσίαν
  choice: उन बंदियों को
  rationale: यूनानी में शाब्दिक रूप से ‘बंदी अवस्था/बंदी जनसमूह’ है, पर प्रसंग में इसका संकेत बंदी बनाए गए लोगों की ओर है।
- source_word: ᾐχμαλώτευσεν
  choice: बंदी बनाया था
  rationale: यह सैन्य प्रसंग में लोगों को पकड़कर बंदी बनाने का अर्थ देता है और संज्ञा αἰχμαλωσίαν के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: τὸ πρότερον
  choice: पहले
  rationale: यह वर्तमान घटना से पूर्व की कार्रवाई को सूचित करता है; ‘पहले’ सरल और स्वाभाविक है।
- source_word: ἐκ γῆς Ἰούδα
  choice: यहूदा देश से
  rationale: γῆ के भौगोलिक अर्थ को ‘देश’ द्वारा स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἀποστρέψας
  choice: लौटकर
  rationale: कृदंत पीछे मुड़ने या वापस जाने के बाद अगली गति को व्यक्त करता है; ‘लौटकर’ हिन्दी में घटनाक्रम को सहज रखता है।
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: अपने देश चला गया
  rationale: यह प्रस्थान और अपने देश की ओर जाने—दोनों भावों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: इसके बाद फिर कभी ... नहीं आया
  rationale: προστίθημι और क्रियार्थक रूप का मुहावरा किसी काम को दोबारा करने या जारी रखने का निषेध बताता है; यह रूप हिन्दी में उसी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ὅρια αὐτῶν
  choice: उनके सीमाक्षेत्र में
  rationale: ὅρια केवल सीमा-रेखाओं के बजाय सीमाओं से निर्धारित भूभाग या सरहदी क्षेत्र भी दर्शाता है; सैन्य-भौगोलिक प्रसंग में ‘सीमाक्षेत्र’ उपयुक्त है।
