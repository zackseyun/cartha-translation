  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज सैन्य-वर्णन। यूनानी की क्रियाओं का क्रम बनाए रखते हुए अत्यधिक शाब्दिक ‘कुचल दिया’ के स्थान पर प्रसंगानुकूल ‘परास्त कर दिया’ चुना गया है।
