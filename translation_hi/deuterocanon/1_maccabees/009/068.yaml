review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the conflict, sustained pressure, plan, attack, and futility. However, συνετρίβη is passive and retains the vivid 'crushed/broken' image; 'उसे परास्त कर दिया' changes it to an active, more interpretive statement of defeat.
  naturalness: The Hindi is generally clear and suitably dignified. Keeping the verse as a single coordinated sequence better reflects the Greek. 'बहुत दबाव डाला' is natural in this military context.
  terminology: ‘योजना,’ ‘आक्रमण,’ and ‘निष्फल’ are accurate modern-standard Hindi choices. ‘बक्खिदेस’ is an acceptable Devanagari transliteration of Bacchides.
  issues:
  - severity: medium
    issue: ‘उसे परास्त कर दिया’ does not preserve the Greek passive συνετρίβη or its crushing imagery.
    rationale: The source says that Bacchides ‘was crushed by them,’ not merely that they defeated him. A passive Hindi rendering can preserve both the agent and the metaphor without becoming unnatural.
  revised_text: और उन्होंने बक्खिदेस से युद्ध किया, और वह उनके द्वारा कुचल दिया गया, और उन्होंने उस पर बहुत दबाव डाला, क्योंकि उसकी योजना और उसका आक्रमण निष्फल थे।
  revised_footnotes: []
