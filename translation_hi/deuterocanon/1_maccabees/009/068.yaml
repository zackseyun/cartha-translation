  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: hi
  text: और उन्होंने बक्खिदेस से युद्ध किया, और वह उनके द्वारा कुचल दिया गया, और उन्होंने उस पर बहुत दबाव डाला, क्योंकि उसकी योजना और उसका आक्रमण निष्फल थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: से युद्ध किया
  rationale: πολεμέω के साथ πρός यहाँ बक्खिदेस के विरुद्ध शत्रुतापूर्ण युद्ध को व्यक्त करता है; आधुनिक हिन्दी में ‘से युद्ध किया’ स्वाभाविक और स्पष्ट है।
- source_word: συνετρίβη
  choice: उसे परास्त कर दिया
  rationale: συντρίβω का मूल चित्र तोड़ने या कुचलने का है, पर इस युद्ध-संदर्भ में कर्मवाच्य रूप निर्णायक हार को दर्शाता है; ‘परास्त कर दिया’ अनावश्यक शारीरिक अर्थ से बचते हुए आशय देता है।
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: उन्होंने उस पर बहुत दबाव डाला
  rationale: θλίβω दबाने या संकट में डालने और σφόδρα तीव्रता का बोध कराता है; यह वाक्यांश निरंतर सैन्य दबाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βουλή
  choice: योजना
  rationale: यहाँ βουλή अभियान के लिए बक्खिदेस की सोची हुई कार्य-योजना को दर्शाता है।
- source_word: ἔφοδος
  choice: आक्रमण
  rationale: ἔφοδος इस प्रसंग में सैन्य चढ़ाई या हमले को सूचित करता है; ‘आक्रमण’ सटीक और गरिमापूर्ण है।
- source_word: κενή
  choice: निष्फल हो गए थे
  rationale: κενή का शाब्दिक अर्थ ‘खाली’ है, पर योजना और आक्रमण के लिए इसका भाव ‘व्यर्थ/निष्फल’ है। यूनानी में विशेषण स्त्रीलिंग एकवचन है, जो निकटतम संज्ञा ἔφοδος से व्याकरणिक सामंजस्य रखता है; अर्थ की दृष्टि से समन्वित पदबंध के परिणाम को हिन्दी बहुवचन में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: Βακχίδην
  choice: बक्खिदेस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
theological_decisions: []
