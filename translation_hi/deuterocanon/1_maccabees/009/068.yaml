- from: और उन्होंने बक्खिदेस से युद्ध किया और उसे परास्त कर दिया। उन्होंने उस पर बहुत दबाव डाला, क्योंकि उसकी योजना और उसका आक्रमण निष्फल हो गए थे।
  to: और उन्होंने बक्खिदेस से युद्ध किया, और वह उनके द्वारा कुचल दिया गया, और उन्होंने उस पर बहुत दबाव डाला, क्योंकि उसकी योजना और उसका आक्रमण निष्फल थे।
  rationale: The revision restores the passive voice and forceful metaphor of συνετρίβη (‘was crushed’) while retaining the draft’s sound renderings of the remaining clauses. The coordinated syntax is retained to mirror the Greek sequence, and ‘निष्फल थे’ expresses κενή for the combined ‘plan and attack’ without adding an implication that they subsequently became futile.
