- source_word: παρεμβολῶν
  choice: छावनियों
  rationale: बहुवचन और सैन्य संदर्भ को सीधे व्यक्त करता है; ἀπό को यहाँ कारणसूचक मानते हुए ‘के कारण’ रखा गया है।
- source_word: ὁ πόλεμος συνηγμένος
  choice: युद्ध घमासान होता रहा
