- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: भोर से साँझ तक
  rationale: समयावधि को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἐσείσθη ἡ γῆ
  choice: धरती काँप उठी
  rationale: यूनानी निष्क्रिय क्रिया के प्रभाव और घटना की अचानक तीव्रता को सहज हिन्दी में व्यक्त करता है।
