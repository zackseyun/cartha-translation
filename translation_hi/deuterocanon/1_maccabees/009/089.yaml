translation:
  language: hi
  text: सोने का बकसुआ[a], जैसा राजाओं के संबंधियों को देने की प्रथा है; और उसने उसे अक्कारोन[b] और उसका पूरा इलाका विरासत के रूप में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल ‘सुनहरी’ (स्त्रीलिंग) है; संज्ञा पिछले प्रसंग से समझी जाती है। वाक्य पूरा करने के लिए यहाँ ‘बकसुआ’ जोड़ा गया है। ‘ब्रोच’ या ‘अलंकार’ भी सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: अक्कारोन उसी स्थान-नाम का यूनानी रूप है जिसे सामान्यतः एक्रोन कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
  choice: सोने का
  rationale: यूनानी में स्त्रीलिंग विशेषण ‘सुनहरी/सोने की’ अकेला आया है और संज्ञा पिछले प्रसंग से समझी जाती है। हिन्दी में स्वाभाविक भौतिक अर्थ व्यक्त करने के लिए ‘सोने का’ रखा गया है।
- source_word: '[पूर्व प्रसंग से निहित संज्ञा]'
  choice: बकसुआ
  rationale: मूल पद में वस्तु की संज्ञा लुप्त है। राजकीय उपहार के प्रसंग में ‘बकसुआ’ उपयुक्त है, पर यह पूर्ति व्याख्यात्मक होने के कारण पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἔθος
  choice: प्रथा
  rationale: ὡς ἔθος ἐστὶν διδόσθαι का अर्थ स्वाभाविक हिन्दी में ‘जैसा ... देने की प्रथा है’ व्यक्त होता है।
- source_word: συγγενεῦσιν τῶν βασιλέων
  choice: राजाओं के संबंधियों
  rationale: यह अनुवाद पारिवारिक अथवा वंशगत निकटता का सामान्य अर्थ बनाए रखता है और किसी अधिक विशिष्ट राजकीय पद का अनुमान नहीं लगाता।
- source_word: Ἀκκαρὼν
  choice: अक्कारोन
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; अधिक परिचित ‘एक्रोन’ रूप पादटिप्पणी में दिया गया है।
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: उसका पूरा इलाका
  rationale: भूमि-अनुदान के संदर्भ में ὅρια केवल सीमा-रेखाओं के बजाय उनके भीतर आने वाले पूरे क्षेत्र को दर्शाता है।
- source_word: εἰς κληρονομίαν
  choice: विरासत के रूप में
  rationale: यह पद भूमि को वंशानुगत अधिकार के रूप में दिए जाने का कानूनी भाव बनाए रखता है।
