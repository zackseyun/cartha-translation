base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: hi
  text: तब वह बड़ी सेना के साथ आने से रुक गया और उसने यहूदिया में अपने सभी सहयोगियों को गुप्त रूप से पत्र भेजे, ताकि वे योनातान और उसके साथ के लोगों को पकड़ लें; पर वह ऐसा न कर सका[a], क्योंकि उनकी योजना योनातान और उसके साथ के लोगों को मालूम हो गई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर वे ऐसा न कर सके”—एकवचन यूनानी क्रिया को मुख्य षड्यंत्रकारी के लिए, अथवा षड्यंत्रकारियों के समूह के सामूहिक उल्लेख के रूप में समझा जा सकता है।
    reason: व्याकरणिक एकवचन और प्रसंगानुसार सामूहिक समझ, दोनों को सुरक्षित रखना।
  - marker: b
    text: मूल यूनानी में शाब्दिक रूप से, “क्योंकि उनकी योजना उन्हें मालूम हो गई थी।” सर्वनाम संक्षिप्त और संदर्भ-निर्भर हैं; प्रसंग में योजना योनातान और उसके साथ के लोगों पर प्रकट हुई थी।
    reason: मूल के सर्वनामगत संक्षिप्तता को बताना और लक्षित पक्ष की संदर्भगत पहचान स्पष्ट करना।
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: आने का विचार छोड़ दिया
  rationale: यह प्रयोग आने की कार्रवाई से पीछे हटने या उसे त्याग देने का भाव व्यक्त करता है। वर्तमान हिन्दी में यह सहज है और उसके उद्देश्य के विषय में अनावश्यक अनुमान नहीं जोड़ता।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: बड़ी सेना लेकर
  rationale: यहाँ δύναμις सैन्य बल या सैनिक दल को दर्शाता है। प्रसंग में ‘बड़ी सेना’ साधारण पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ἐπιστολὰς λάθρᾳ
  choice: चुपके से पत्र भेजे
  rationale: λάθρᾳ पत्र भेजने की गुप्त रीति बताता है; ‘चुपके से’ आधुनिक हिन्दी में स्वाभाविक रूप से इस गोपनीयता को व्यक्त करता है।
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में अपने सभी सहयोगियों को
  rationale: σύμμαχος राजनीतिक या सैनिक सहयोगी के अर्थ में है। वाक्यांश सहयोगियों का स्थान यहूदिया बताता है।
- source_word: ὅπως συλλάβωσι
  choice: कि वे ... पकड़ लें
  rationale: συλλαμβάνω यहाँ पकड़ने या बन्दी बनाने के अर्थ में है। ‘पकड़ लें’ किसी औपचारिक कानूनी प्रक्रिया का अतिरिक्त भाव नहीं जोड़ता।
- source_word: τοὺς σὺν αὐτῷ
  choice: उसके साथियों को
  rationale: शाब्दिक अर्थ ‘उसके साथ के लोगों’ है; ‘उसके साथी’ संक्षिप्त, स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: οὐκ ἠδύνατο
  choice: वह इसमें सफल न हो सका
  rationale: यूनानी क्रिया एकवचन है, इसलिए मुख्य पाठ में प्रधान षड्यंत्रकारी को कर्ता रखा गया है। ‘इसमें’ पकड़वाने की पूरी योजना की ओर संकेत करता है। सामूहिक बहुवचन अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: योनातान और उसके साथियों को उनकी योजना का पता चल गया था
  rationale: यूनानी में सर्वनाम संक्षिप्त और संदर्भ-निर्भर हैं। प्रसंग के अनुसार लक्षित पक्ष को षड्यंत्रकारियों की योजना का पता चलता है; हिन्दी में अस्पष्ट सर्वनामों से भ्रम से बचने के लिए लक्षित पक्ष को नाम से स्पष्ट किया गया है, जबकि मूल की रचना पादटिप्पणी में बताई गई है।
