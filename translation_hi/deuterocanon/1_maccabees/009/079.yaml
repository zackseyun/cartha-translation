  text: चुपके से उनके पीछे।[a] और योनातान जान गया कि वह एक घात थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी पाठ वाक्यांश के रूप में है: “चुपके से उनके पीछे। और योनातान जान गया कि वह एक घात थी।” यह अचानक आरम्भ संभवतः पिछले प्रसंग पर निर्भर है; इस पद में अपने आप में पूरा वाक्य सुरक्षित नहीं है।'
    reason: textual_variant
lexical_decisions:
- source_word: κρυπτῶς
  choice: चुपके से
  rationale: यह क्रियाविशेषण गुप्त या छिपे ढंग से किए गए कार्य को व्यक्त करता है; आधुनिक हिन्दी में “चुपके से” सहज और स्पष्ट है।
- source_word: κατόπισθεν
  choice: पीछे
  rationale: यह स्थान-संबंधी अर्थ में किसी के पीछे या पिछले भाग में होने को बताता है; सैन्य प्रसंग में “पीछे” सीधा समतुल्य है।
- source_word: αὐτῶν
  choice: उनके
  rationale: यूनानी सर्वनाम बहुवचन संबंधकारक है, इसलिए बहुवचन “उनके” आवश्यक है।
- source_word: ἔγνω
  choice: जान गया
  rationale: γινώσκω के अओरिस्ट रूप का यहाँ प्रसंगानुकूल अर्थ किसी बात का बोध हो जाना है; “जान गया” उस पूर्ण घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔνεδρον
  choice: एक घात
  rationale: यह सैन्य शब्द छिपकर किए जाने वाले आक्रमण या घात लगाए दल को सूचित कर सकता है। “एक घात” मूल की संक्षिप्तता और अर्थगत व्यापकता बनाए रखता है।
