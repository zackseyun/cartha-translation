base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: hi
  text: और वह उन अधर्मी पुरुषों पर क्रोधित हुआ जिन्होंने उसे उस देश में आने की सलाह दी थी। फिर उन्होंने उनमें से बहुतों को मार डाला,[a] और उसने अपने देश लौट जाने का निश्चय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रस्तुत यूनानी पाठ में शाब्दिक रूप से ‘उन्होंने उनमें से बहुतों को मार डाला’ है। आसपास की क्रियाएँ एकवचन में हैं, इसलिए कुछ अनुवाद अर्थ के अनुसार ‘उसने उनमें से बहुतों को मार डाला’ करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोधित हुआ
  rationale: यह ὀργίζομαι का अओरिस्ट रूप है और यहाँ क्रोध उत्पन्न होने को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: उन अधर्मी पुरुषों पर
  rationale: ἀνόμοις में व्यवस्था-विरोधी अथवा धर्म-विरुद्ध आचरण का भाव है; ‘अधर्मी’ सामान्य हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: जिन्होंने उसे ... सलाह दी थी
  rationale: पूर्वकालिक कृदन्त उन पुरुषों की पहचान उनके पहले दिए गए परामर्श से कराता है; ‘सलाह दी थी’ क्रम को स्पष्ट रखता है।
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: उस देश में आने
  rationale: χώρα यहाँ सैन्य-भौगोलिक क्षेत्र अथवा देश को सूचित करता है; ‘देश’ हिन्दी में प्रसंगानुकूल और सहज है।
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: उन्होंने उनमें से बहुतों को मार डाला
  rationale: प्रस्तुत यूनानी पाठ में क्रिया स्पष्ट रूप से तृतीय पुरुष बहुवचन है। यद्यपि आसपास की क्रियाएँ एकवचन हैं और एकवचन पाठ का अनुमान संभव है, मुख्य पाठ वास्तविक स्रोत-पाठ की व्याकरणिक अस्पष्टता/तनाव को नहीं मिटाता।
- source_word: ἐβουλεύσατο
  choice: निश्चय किया
  rationale: मध्यवाच्य अओरिस्ट यहाँ विचार करके ठहराए गए निर्णय को दर्शाता है; ‘निश्चय किया’ गरिमापूर्ण और स्पष्ट है।
- source_word: τοῦ ἀπελθεῖν
  choice: लौट जाने
  rationale: संदर्भ में अपने देश की ओर प्रस्थान निहित है; ‘लौट जाने’ हिन्दी में केवल ‘चले जाने’ से अधिक स्वाभाविक रूप से गंतव्य-संबंध व्यक्त करता है।
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: अपने देश
  rationale: γῆ αὐτοῦ यहाँ उसकी अपनी भूमि या स्वदेश है; ‘अपने देश’ स्वाभाविक हिन्दी में स्वामित्व और वापसी दोनों का भाव देता है।
