    reason: मूल यूनानी की संकेतवाचक और संतुलित अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐβαρύνθη
  choice: घमासान हो गई
  rationale: βαραίνω का मूल भाव ‘भारी होना’ है, पर युद्ध के प्रसंग में यह लड़ाई के तीव्र और विकट हो जाने का संकेत देता है। ‘घमासान हो गई’ इस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ πόλεμος
  choice: लड़ाई
  rationale: यद्यपि πόλεμος का अर्थ ‘युद्ध’ भी हो सकता है, यहाँ यह तत्काल चल रहे युद्ध-संघर्ष को सूचित करता है; इसलिए ‘लड़ाई’ प्रसंगानुकूल है।
- source_word: ἔπεσαν τραυματίαι
  choice: घायल होकर गिर पड़े
  rationale: τραυματίαι घायल लोगों को सूचित करता है और ἔπεσαν का अर्थ ‘गिर पड़े’ है। हिन्दी में ‘घायल होकर गिर पड़े’ स्वाभाविक है और मृत्यु का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह मूल के सामान्य बहुवचन परिमाण को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: दोनों ओर
  rationale: यूनानी में शाब्दिक रूप से ‘इनमें से और उनमें से’ है, जो दोनों विरोधी पक्षों के लोगों को सूचित करने वाला संतुलित मुहावरा है।
