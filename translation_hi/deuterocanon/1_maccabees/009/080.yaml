  rationale: यद्यपि संदर्भ में इससे योद्धा या सैनिक समूह अभिप्रेत हो सकता है, ‘लोग’ यूनानी शब्द के सामान्य अर्थ को बिना अनावश्यक सैन्य विशिष्टीकरण के बनाए रखता है।
