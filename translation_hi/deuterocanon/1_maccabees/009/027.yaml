  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: hi
  text: और इस्राएल में बड़ा संकट आया[a], जैसा उस दिन से नहीं आया था जब उनके बीच कोई भविष्यद्वक्ता दिखाई देना बंद हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस्राएल में बड़ा संकट आया, जैसा उस दिन से नहीं हुआ था जब कोई भविष्यद्वक्ता उन्हें दिखाई नहीं दिया था।” यूनानी कर्मवाच्य “दिखाई दिया” का अर्थ “प्रकट हुआ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: आया
  rationale: घटनात्मक आरम्भ को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘था’ की अपेक्षा यूनानी कथात्मक क्रिया का बल बनाए रखता है।
- source_word: θλίψις μεγάλη
  choice: बड़ा संकट
  rationale: गंभीर विपत्ति और दबाव का भाव देता है, पर किसी बाद की तकनीकी युगान्त-विषयक शब्दावली को आरोपित नहीं करता।
- source_word: ἐν τῷ Ἰσραήλ
  choice: इस्राएल में
  rationale: इस्राएल के लोगों या राष्ट्र को संकट के क्षेत्र के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἥτις οὐκ ἐγένετο
  choice: ऐसा ... जैसा ... नहीं आया था
  rationale: गुणवाचक सम्बन्धवाचक वाक्य और संकट की अभूतपूर्व तीव्रता, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀφʼ ἧς ἡμέρας
  choice: उस दिन से ... जब से
  rationale: यूनानी के कालगत आरम्भ-बिन्दु को स्पष्ट करता है; हिन्दी में दोहराव तुलनात्मक संरचना को समझने योग्य बनाता है।
- source_word: οὐκ ὤφθη
  choice: दिखाई नहीं दिया था
  rationale: यूनानी कर्मवाच्य ‘देखा नहीं गया’ और उसके सम्भव मध्यार्थ ‘प्रकट नहीं हुआ’ के बीच की वास्तविक अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: προφήτης
  choice: कोई भविष्यद्वक्ता
  rationale: एकवचन को सामान्य अर्थ में ग्रहण करता है—किसी विशेष एक व्यक्ति के बजाय भविष्यद्वक्ता की अनुपस्थिति—बिना सार्वकालिक सिद्धान्त बनाए।
- source_word: αὐτοῖς
  choice: उनके बीच
  rationale: दत्तिव का सामुदायिक आशय व्यक्त करता है कि इस्राएल के समुदाय में भविष्यद्वक्ता उपस्थित या प्रकट नहीं था।
theological_decisions:
- issue: भविष्यद्वक्ता की अनुपस्थिति वाले उपवाक्य का अर्थ
  choice: यह पद इस्राएल के बीच भविष्यद्वक्तायी उपस्थिति न रहने के एक ऐतिहासिक काल पर विलाप करता है।
  alternative: इसे किसी एक विशेष भविष्यद्वक्ता की अनुपस्थिति या केवल सार्वजनिक रूप से किसी भविष्यद्वक्ता के प्रकट न होने के अर्थ में पढ़ा जा सकता है।
  rationale: एकवचन προφήτης सामान्य अर्थ दे सकता है और सन्दर्भ भविष्यद्वक्तायी नेतृत्व के अभाव की ओर संकेत करता है; अनुवाद इससे आगे बढ़कर भविष्यद्वाणी के स्थायी अन्त का धर्मसिद्धान्त स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बड़ा संकट’ ऐतिहासिक पीड़ा को स्पष्ट करता है और ‘दिखाई नहीं दिया’ मूल की अर्थगत अस्पष्टता को सुरक्षित रखता है।
