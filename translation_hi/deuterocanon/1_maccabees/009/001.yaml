    text: शाब्दिक रूप से, “दायाँ सींग”; सैन्य प्रयोग में इसका अर्थ सेना का दायाँ पक्ष या दायाँ दल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: ने सुना
  rationale: सरल यूनानी कथात्मक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; इसमें सूचना पाने का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: ἐποίησεν ... πόλεμον
  choice: ने युद्ध किया था
  rationale: यूनानी मुहावरे ‘युद्ध करना’ को बनाए रखता है और ‘सुना कि’ के पूर्व घटित कार्य को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: उसकी सेनाओं
  rationale: बहुवचन δυνάμεις सैन्य बलों को दर्शाता है; ‘सेनाओं’ सरल है और किसी विशिष्ट सैन्य इकाई का अनावश्यक निर्धारण नहीं करता।
- source_word: προσέθετο ... ἀποστεῖλαι / ἐκ δευτέρου
  choice: दूसरी बार ... भेजा
  rationale: प्रेषण की पुनरावृत्ति को स्पष्ट रखता है; ‘दूसरी बार’ ἐκ δευτέρου की संख्यात्मक शक्ति को सुरक्षित रखता है।
- source_word: γῆν Ἰούδα
  choice: यहूदा देश
  rationale: ‘यहूदा की भूमि’ के अर्थ का सहज हिन्दी भौगोलिक रूप है और इसे बाद के प्रादेशिक नाम से नहीं बदलता।
- source_word: τὸ δεξιὸν κέρας
  choice: सेना का दायाँ मोर्चा
  rationale: κέρας का शाब्दिक अर्थ ‘सींग’ है, पर सैन्य प्रयोग में यह सेना के दाएँ पक्ष या विंग को दर्शाता है; ‘दायाँ मोर्चा’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
