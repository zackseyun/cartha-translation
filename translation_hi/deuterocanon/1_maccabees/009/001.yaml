  text: देमेत्रियुस ने सुना कि निकानोर और उसके सैन्य बलों ने युद्ध किया था, और उसने बक्खिदेस और अलकिमुस को दूसरी बार यहूदा देश भेजा, और उनके साथ दायाँ सैन्य दल[a] भी भेजा।
  philosophy: optimal-equivalence
