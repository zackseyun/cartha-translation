  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: hi
  text: वहाँ से योनातान आगे बढ़ा और अश्कलोन में पड़ाव डाला। तब नगर के लोग बड़े सम्मान के साथ उससे मिलने बाहर आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीट के यूनानी स्रोत में इसके बाद की पंक्ति καὶ ἐπέ- पर अधूरी कट जाती है; लेकिन ‘बड़े सम्मान के साथ’ तक का वाक्य पूरा है और इस पदांश का पाठ सुनिश्चित है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह स्थान से आगे की ओर कथा की गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἰωναθάν
  choice: योनातान
  rationale: यूनानी नाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: क्रिया के सैनिक शिविर लगाने के अर्थ को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εἰς Ἀσκάλωνα
  choice: अश्कलोन में
  rationale: εἰς का दिशात्मक भाव संदर्भ में पड़ाव के स्थान तक पहुँचने में परिणत होता है; हिन्दी में ‘अश्कलोन में पड़ाव डाला’ स्वाभाविक है।
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: नगर के लोग ... बाहर आए
  rationale: यूनानी की कुछ अनिश्चित अभिव्यक्ति ‘नगर से जो थे’ को बिना ‘निवासी’ जैसी अनावश्यक विशिष्टता जोड़े स्पष्ट हिन्दी में रखा गया है।
- source_word: εἰς συνάντησιν αὐτῷ
  choice: उससे मिलने
  rationale: कथात्मक संदर्भ में यह वाक्यांश स्वागतार्थ भेंट करने के सामान्य अर्थ में है।
- source_word: ἐν δόξῃ μεγάλῃ
  choice: बड़े सम्मान के साथ
  rationale: यहाँ δόξα सार्वजनिक आदर और प्रतिष्ठापूर्ण स्वागत को सूचित करता है, न कि केवल अमूर्त महिमा को।
