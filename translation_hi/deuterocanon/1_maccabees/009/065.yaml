  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
translation:
  language: hi
  text: और योनातान ने अपने भाई शमौन को नगर में छोड़ दिया। वह स्वयं देहात में निकल गया और लोगों के एक दल के साथ आया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “एक संख्या के साथ आया।” यह अभिव्यक्ति संक्षिप्त है और संभवतः लोगों की किसी संख्या या दल के साथ आने का अर्थ देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: छोड़ दिया
  rationale: यहाँ क्रिया का अर्थ है कि योनातान शमौन को नगर में छोड़कर स्वयं वहाँ से चला गया। ‘छोड़ दिया’ इस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई शमौन को
  rationale: यह पदबंध शमौन की पहचान योनातान के भाई के रूप में कराता है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: ἐν τῇ πόλει
  choice: नगर में
  rationale: πόλις नगर या शहर को सूचित करता है। ‘नगर’ गरिमापूर्ण, सामान्य और आगे आने वाले देहाती क्षेत्र के विपरीत उपयुक्त है।
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: देहात की ओर निकल गया
  rationale: χώρα यहाँ नगर से बाहर के खुले या ग्रामीण क्षेत्र को सूचित करता है। यह अनुवाद नगर और देहात के बीच का विरोध बनाए रखता है, जबकि क्षेत्र की ठीक सीमा निर्धारित नहीं करता।
- source_word: ἦλθεν ἀρίθμῳ
  choice: कुछ लोगों के साथ आया
  rationale: यूनानी पदबंध संक्षिप्त और अर्थ की दृष्टि से अधूरा है। सैनिक प्रसंग में ἀρίθμῳ संभवतः गिने हुए लोगों के किसी दल को सूचित करता है। ‘कुछ लोगों के साथ’ निहित साथियों को स्पष्ट करता है, पर उनकी संख्या या दल का आकार नहीं ठहराता।
