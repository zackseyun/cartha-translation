  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: hi
  text: तब यहूदा ने देखा कि उसका सैनिक दल हार रहा था[a], क्योंकि लड़ाई उस पर भारी पड़ रही थी; और उसका हृदय टूट गया, क्योंकि उसके पास उन्हें इकट्ठा करने का समय नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा ने देखा’ के बाद यूनानी शब्द-विन्यास संक्षिप्त और कुछ अधूरा है। यहाँ उसका आशय यह समझा गया है कि यहूदा ने अपने सैनिक दल को दबाव में हारते हुए देखा। यूनानी शब्द का अर्थ ‘छावनी’ या छावनी में स्थित सेना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: छावनी
  rationale: सैनिक प्रसंग में यह शब्द छावनी या छावनी में स्थित सेना को सूचित कर सकता है। ‘छावनी’ मूल के ठोस बिंब को बनाए रखते हुए यहाँ सैनिक दल का निहित अर्थ भी ग्रहण करने देता है।
- source_word: ὅτι ἡ παρεμβολὴ αὐτοῦ
  choice: कि उसकी छावनी हारती जा रही थी
  rationale: प्राप्त यूनानी पाठ में यह वाक्यांश संक्षिप्त और व्याकरण की दृष्टि से अधूरा है। अगले उपवाक्य और युद्ध-प्रसंग से यह अर्थ निकलता है कि यहूदा ने अपने सैनिक दल को दबाव में पीछे पड़ते या विफल होते देखा। ‘हारती जा रही थी’ इस निहित भाव को सहज हिन्दी में व्यक्त करता है, पर पूर्ण विनाश का अर्थ नहीं जोड़ता।
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: लड़ाई उस पर भारी पड़ रही थी
  rationale: ἔθλιβεν लगातार दबाने या पीड़ित करने का भाव रखता है। तत्काल युद्धभूमि के प्रसंग में ‘लड़ाई’ और ‘भारी पड़ रही थी’ उस जारी सैनिक दबाव को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: उसका हृदय टूट गया
  rationale: यह रूपक मूल के हृदय में चूर हो जाने के तीव्र भाव को बनाए रखता है और आधुनिक हिन्दी में भी स्वाभाविक तथा गरिमापूर्ण है।
- source_word: καιρὸν
  choice: समय
  rationale: καιρός उपयुक्त समय या अवसर दोनों का अर्थ दे सकता है। इस आकस्मिक सैनिक स्थिति में ‘समय’ सबसे सहज है और अवसर की कमी का भाव प्रसंग से स्पष्ट रहता है।
- source_word: συναγαγεῖν αὐτούς
  choice: उन्हें इकट्ठा करने
  rationale: यह क्रिया लोगों को एकत्र या संगठित करने को बताती है। ‘इकट्ठा करने’ मूल के निकट है और ‘फिर से मोर्चाबंद करने’ जैसा अतिरिक्त सैनिक अर्थ नहीं जोड़ता।
