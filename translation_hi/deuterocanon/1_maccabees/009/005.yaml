  text: और यहूदा अलासा में डेरा डाले हुए था, और उसके साथ तीन हज़ार चुने हुए पुरुष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: डेरा डाल रखा था
  rationale: παρεμβάλλω का पूर्ण कृदन्त यहाँ सैनिक शिविर की स्थापित अवस्था बताता है। यह हिन्दी प्रयोग उस स्थितिपरक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν Ἀλασά
  choice: अलासा में
  rationale: ἐν स्थान को सूचित करता है; स्थान-नाम का लिप्यंतरण करते हुए आधुनिक हिन्दी में ‘अलासा में’ स्वाभाविक और सटीक है।
- source_word: τρισχίλιοι
  choice: तीन हज़ार
  rationale: मूल यूनानी की संख्या का सीधा रूपांतरण।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: मूल पाठ स्पष्टतः पुरुषों का उल्लेख करता है। सैनिक संदर्भ होने पर भी ‘सैनिक’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ἐκλεκτοὶ
  choice: चुने हुए
  rationale: यह शब्द चयनित या विशिष्ट रूप से चुने गए पुरुषों को सूचित करता है; ‘चुने हुए’ अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ ... थे
  rationale: वाक्यांश यहूदा के साथ उनकी उपस्थिति को सीधे व्यक्त करता है; हिन्दी वाक्य-विन्यास में क्रिया को अंत में रखा गया है।
