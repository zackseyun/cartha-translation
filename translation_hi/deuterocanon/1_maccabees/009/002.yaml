  yaml_path: translation/deuterocanon/1_maccabees/009/002.yaml
  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: hi
  text: और वे गालगाला जानेवाले मार्ग से गए और उन्होंने अरबेला में स्थित मेस्सालोत के सामने छावनी डाली। उन्होंने उसे पहले ही अपने अधिकार में कर लिया[a], और उसने बहुत-से लोगों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ और अर्थ की दृष्टि से कठिन है; इसका अर्थ ‘पहले पकड़ लिया,’ ‘पहले कब्ज़े में ले लिया,’ या अधिक सामान्य रूप से ‘अपने अधिकार में कर लिया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: गए
  rationale: यह πορεύομαι का भूतकालीन रूप है और यात्रा या आगे बढ़ने को दर्शाता है; प्रसंग में सरल ‘गए’ स्वाभाविक है और अनावश्यक रूप से ‘कूच किया’ जैसा सैनिक अर्थ नहीं जोड़ता।
- source_word: ὁδὸν τὴν εἰς Γάλγαλα
  choice: गिलगाल जानेवाले मार्ग से
  rationale: ὁδόν वाला प्रयोग किसी मार्ग को अपनाने का संकेत देता है; यह अनुवाद दिशा के साथ मार्ग का ठोस भाव भी बनाए रखता है।
- source_word: παρενέβαλον ἐπὶ
  choice: के सामने छावनी डाली
  rationale: सैनिक प्रसंग में παρεμβάλλω का अर्थ छावनी डालना है, और ἐπί यहाँ लक्ष्य के विरुद्ध या उसके सामने मोर्चा लेने का भाव देता है।
- source_word: Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: अरबेला के मेस्सालोत
  rationale: यूनानी पदबंध उस मेस्सालोत की पहचान कराता है जो अरबेला में या उससे संबद्ध क्षेत्र में था; हिन्दी में यह संक्षिप्त स्थान-संबंध स्वाभाविक है।
- source_word: προκατελίβοντο
  choice: उस पर पहले ही अधिकार कर लिया
  rationale: दुर्लभ संयुक्त क्रिया में προ- पूर्वता या पहले कब्ज़ा कर लेने का भाव दे सकता है। ‘अधिकार कर लिया’ विजय या कब्ज़े का अर्थ देता है, जबकि ‘पहले ही’ वास्तविक शब्दगत कठिनाई को बनाए रखता है।
- source_word: ἀπώλεσεν ψυχὰς ἀνθρώπων πολλὰς
  choice: बहुत-से लोगों को मार डाला
  rationale: शाब्दिक अभिव्यक्ति ‘मनुष्यों के बहुत-से प्राण नष्ट किए’ है; यहाँ ψυχαί व्यक्तियों या जीवनों और ἀπόλλυμι प्राणघातक विनाश को सूचित करते हैं। हिन्दी में ‘लोगों को मार डाला’ इसका स्पष्ट और स्वाभाविक अर्थ है।
