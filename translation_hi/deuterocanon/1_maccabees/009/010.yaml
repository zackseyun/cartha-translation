base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: hi
  text: और यहूदा ने कहा, “मुझसे ऐसा काम कभी न हो कि मैं उनसे भागूँ! हमारा समय निकट आ गया है; और हम अपने भाइयों के लिए साहस के साथ मरें[a] और अपनी कीर्ति पर दोष लगने का कोई कारण न छोड़ें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का अर्थ “वीरतापूर्वक मरें” भी हो सकता है; अधिक शब्दशः इसमें पुरुषोचित वीरता से जुड़ा भाव है।
    reason: lexical_alternative
  - marker: b
    text: “कीर्ति” का अर्थ इस संदर्भ में “सम्मान” या “प्रतिष्ठा” भी हो सकता है; पूरे वाक्यांश का भाव यह है कि उनके आचरण से उनकी कीर्ति पर दोष लगाने का आधार न मिले।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: मुझसे ऐसा काम कभी न हो
  rationale: यह यूनानी में प्रबल व्यक्तिगत अस्वीकार व्यक्त करने वाला वाक्यांश है। यह हिन्दी रूप उसकी तीव्रता बनाए रखते हुए अगले क्रियार्थक वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο, φυγεῖν ἀπʼ αὐτῶν
  choice: ऐसा काम ... कि मैं उनसे भागूँ
  rationale: φυγεῖν बताता है कि अस्वीकार किया गया ‘काम’ शत्रुओं से भागना है; हिन्दी में ‘कि’ के द्वारा यह व्याख्यात्मक संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: हमारा समय निकट आ गया है
  rationale: καιρός निर्णायक या नियत अवसर का संकेत दे सकता है। ‘समय’ उस गंभीर अस्पष्टता को बनाए रखता है; इसे स्पष्टतः ‘मृत्यु का समय’ नहीं बनाया गया। यूनानी में कोई शर्तसूचक ‘यदि’ नहीं है।
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: हम ... साहस के साथ मरें
  rationale: ἀνδρίᾳ वीरता और साहस का भाव देता है। आधुनिक हिन्दी में ‘साहस के साथ’ स्वाभाविक है और पुराने या भ्रामक रूप से लिंग-बल देने वाले अनुवाद से बचता है।
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: अपने भाइयों के लिए
  rationale: χάριν सम्बन्धकारक के साथ ‘के लिए/की खातिर’ का अर्थ देता है। युद्ध-संदर्भ में ἀδελφῶν का स्पष्ट पुल्लिंग बहुवचन ‘भाइयों’ के रूप में रखा गया है।
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  choice: अपनी कीर्ति पर दोष लगने का कोई कारण न छोड़ें
  rationale: αἰτία कारण, आरोप या दोष का आधार हो सकता है, और δόξα यहाँ कीर्ति, सम्मान या प्रतिष्ठा की ओर संकेत करती है। चुना गया रूप सम्मान-अपमान के संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अर्थ-विस्तार सुरक्षित रखती है।
theological_decisions:
- issue: ἀδελφῶν के पुल्लिंग पारिवारिक संबोधन का अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों; स्वजनों
  rationale: यूनानी शब्द स्पष्टतः पुल्लिंग बहुवचन है और इस युद्ध-संदर्भ में संभवतः साथी यहूदी पुरुषों या हमवतनों को सूचित करता है; इसलिए इसे लिंग-निरपेक्ष नहीं बनाया गया।
- issue: δόξα का सम्मान-अपमान के संदर्भ में अर्थ
  choice: कीर्ति
  alternative: सम्मान; प्रतिष्ठा; महिमा
  rationale: यहाँ δόξα सार्वजनिक सम्मान या प्रतिष्ठा का अर्थ दे सकता है। ‘कीर्ति’ इस अर्थ-क्षेत्र को बनाए रखती है और ‘महिमा’ से उत्पन्न हो सकने वाले केवल धार्मिक अर्थ को अनावश्यक रूप से प्रमुख नहीं करती।
- issue: ἤγγικεν के कथन को शर्तसूचक मानना
  choice: हमारा समय निकट आ गया है
  alternative: यदि हमारा समय निकट आ गया है
  rationale: उपलब्ध यूनानी पाठ में ‘यदि’ के लिए कोई शर्तसूचक अव्यय नहीं है। इसलिए कथन को प्रत्यक्ष रखा गया है और मृत्यु की ओर उसके संभावित संकेत को स्पष्ट व्याख्या बनाकर नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यहूदा का प्रबल अस्वीकार विस्मयादिबोधक चिह्न से उभारा गया है। ‘इसलिए’ यूनानी के संयोजक καὶ के प्रसंगगत परिणाम-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; कोई शर्तसूचक ‘यदि’ नहीं जोड़ा गया।
