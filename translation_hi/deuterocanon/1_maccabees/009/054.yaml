base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/054.yaml
  text: And in the one hundred and fifty-third year[a], in the second month, Alcimus ordered the wall of the inner court of the sanctuary to be torn down, and he tore down the works of the prophets[b], and began to tear it down.
translation:
  language: hi
  text: और एक सौ तिरपनवें वर्ष में, दूसरे महीने में, अलकिमुस ने पवित्रस्थान के भीतरी आँगन की दीवार[a] गिरा देने की आज्ञा दी। उसने नबियों के कार्यों[b] को ढा दिया और ढाना शुरू किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “पवित्र स्थान के भीतरी आँगन की दीवार” भी अनुवादित किया जा सकता है; संदर्भ मंदिर के पवित्र परिसर का है।
    reason: lexical_alternative
  - marker: b
    text: “नबियों के कार्य” यूनानी का शाब्दिक रूप है। इससे नबियों से जुड़ी संरचनाएँ या मरम्मत के कार्य अभिप्रेत हो सकते हैं, पर मूल पाठ अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: एक सौ तिरपनवें वर्ष में
  rationale: यूनानी में संख्याएँ जोड़कर वर्ष 153 बताया गया है; आधुनिक हिन्दी में क्रमवाचक रूप स्वाभाविक और सटीक है।
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: दूसरे महीने में
  rationale: यह कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: क्रिया अधिकारपूर्वक आदेश देने का भाव रखती है; ‘आज्ञा दी’ गरिमापूर्ण और स्पष्ट है।
- source_word: καθελεῖν
  choice: गिरा देने
  rationale: दीवार को ध्वस्त करने की क्रिया व्यक्त होती है; आदेश के साथ यह हिन्दी प्रयोग स्वाभाविक है।
- source_word: τὸ τεῖχος
  choice: दीवार
  rationale: τεῖχος का सामान्य अर्थ एक ठोस घेरे या परिसर की दीवार है।
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: पवित्रस्थान के भीतरी आँगन की
  rationale: यह रूप पवित्र मंदिर-परिसर और उसके भीतरी आँगन, दोनों को स्पष्ट करता है, जबकि यूनानी संबंध-श्रृंखला की मूल संरचना को पर्याप्त रूप से बनाए रखता है।
- source_word: καθεῖλεν
  choice: ढा दिया
  rationale: यह उसी ध्वंस-क्रिया का भूतकालीन रूप है; हिन्दी में अनावश्यक पुनरुक्ति घटाते हुए अर्थ सुरक्षित रहता है।
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: नबियों के कामों
  rationale: यूनानी पद जानबूझकर अस्पष्ट है। ‘कामों’ से यह अस्पष्टता बनी रहती है और इसे अनुमानपूर्वक इमारतों या मरम्मतों तक सीमित नहीं किया जाता।
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: उसे गिराना आरम्भ कर दिया
  rationale: यह आरम्भ की गई ध्वंस-क्रिया को व्यक्त करता है। ‘उसे’ निकटवर्ती दीवार की ओर संकेत करता है और हिन्दी वाक्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας में मंदिर-स्थल का वर्णन
  choice: पवित्रस्थान के भीतरी आँगन की दीवार
  alternative: पवित्र वस्तुओं के भीतरी आँगन की दीवार
  rationale: ‘पवित्रस्थान’ मंदिर-परिसर के संदर्भ में स्वाभाविक है, पर यूनानी बहुवचन τῶν ἁγίων की शब्दगत संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τὰ ἔργα τῶν προφητῶν का अस्पष्ट ऐतिहासिक संकेत
  choice: नबियों के काम
  alternative: नबियों द्वारा बनवाई गई संरचनाएँ
  rationale: मूल पाठ यह नहीं बताता कि ये निर्माण, मरम्मत या किसी अन्य प्रकार के काम थे; इसलिए मुख्य पाठ में अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘आरम्भ’ औपचारिक किंतु प्रचलित शब्द है। अस्पष्ट ऐतिहासिक पद को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है।
