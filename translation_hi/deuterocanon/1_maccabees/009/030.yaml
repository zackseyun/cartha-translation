revisions:
- from: इसलिए आज हमने तुम्हें चुना है कि तुम उसकी जगह हमारे शासक और अगुआ बनो और हमारी ओर से युद्ध करो।
  to: इसलिए अब, आज हमने तुम्हें उसकी जगह हमारा शासक और अगुआ बनने और हमारा युद्ध लड़ने के लिए चुना है।
  rationale: The revision retains the source’s ‘now/therefore/today’ emphasis, keeps the succession phrase and two distinct leadership descriptions, and renders both Greek purpose infinitives with a coordinated Hindi purpose construction. ‘हमारा युद्ध’ preserves the explicit possessive without adding an unnecessary representative nuance.
  reviewer_model: gpt-5.6-terra
