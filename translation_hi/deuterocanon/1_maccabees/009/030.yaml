  yaml_path: translation/deuterocanon/1_maccabees/009/030.yaml
  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: hi
  text: इसलिए अब, आज हमने तुम्हें उसकी जगह हमारा शासक और अगुआ बनने और हमारा युद्ध लड़ने के लिए चुना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: हमने ... चुना है
  rationale: मध्यवाच्य एओरिस्ट यहाँ किसी व्यक्ति को भूमिका के लिए चुनने का भाव देता है। ‘चुना है’ स्वाभाविक हिन्दी है और औपचारिक नियुक्ति या निर्वाचन का अनावश्यक तकनीकी अर्थ नहीं जोड़ता।
- source_word: ἀντʼ αὐτοῦ
  choice: उसकी जगह
  rationale: यह पहले व्यक्ति के स्थान पर उत्तराधिकार को व्यक्त करता है; ‘उसकी जगह’ संक्षिप्त और स्वाभाविक है।
- source_word: ἄρχοντα
  choice: शासक
  rationale: ἄρχων अधिकार रखने और शासन करने वाले व्यक्ति का व्यापक शब्द है। ‘शासक’ इसके सामान्य शासकीय भाव को बनाए रखता है।
- source_word: ἡγούμενον
  choice: अगुआ
  rationale: यह नेतृत्व करने वाले व्यक्ति को दर्शाता है। ‘अगुआ’ ‘शासक’ से अलग नेतृत्व का भाव सुरक्षित रखता है और किसी विशिष्ट बाद के पदनाम को नहीं थोपता।
- source_word: τοῦ πολεμῆσαι
  choice: युद्ध करो
  rationale: सकार्थक संबंधकारक infinitive उद्देश्य बताता है। हिन्दी में ‘और ... युद्ध करो’ चयन के प्रयोजन और दायित्व को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν πόλεμον ἡμῶν
  choice: हमारी ओर से युद्ध
  rationale: शाब्दिक ‘हमारा युद्ध’ सम्भव है, पर आधुनिक हिन्दी में संदर्भगत आशय—समुदाय की ओर से उसका युद्ध लड़ना—‘हमारी ओर से युद्ध’ द्वारा अधिक स्पष्ट और स्वाभाविक होता है, जबकि πόλεμος का व्यापक ‘युद्ध’ अर्थ बना रहता है।
theological_decisions:
- issue: ἄρχοντα καὶ ἡγούμενον की युग्मित उपाधियाँ
  choice: शासक और अगुआ
  alternative: प्रधान और सेनापति
  rationale: चुना गया अनुवाद दोनों यूनानी पदों को अलग रखता है, पर उन्हें किसी विशिष्ट राजकीय या सैनिक पद में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘तुम’ सामूहिक वक्ताओं द्वारा योनातान को सीधे संबोधन के लिए स्वाभाविक है। वाक्य-विन्यास हिन्दी की सहजता के अनुसार रखा गया है।
