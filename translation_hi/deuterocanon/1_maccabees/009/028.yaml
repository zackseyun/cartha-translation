lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: इकट्ठे हुए
  rationale: ἀθροίζω के अओरिस्ट रूप को यहाँ अकर्मक/मध्यवाच्य भाव में समझना स्वाभाविक है; यह अनुवाद सामूहिक रूप से एकत्र होने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντες
  choice: सभी
  rationale: यह यूनानी शब्द की समावेशी सामूहिकता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ φίλοι
  choice: मित्र
  rationale: φίλοι का सीधा अर्थ ‘मित्र’ है। प्रसंग में समर्थकों या साथियों का भाव संभव है, पर मूल पाठ से अधिक विशिष्ट अर्थ जोड़ना उचित नहीं।
- source_word: Ἰούδου
  choice: यहूदा के
  rationale: सम्बन्धकारक रूप को हिन्दी में स्वाभाविक सम्बन्धसूचक ‘के’ द्वारा व्यक्त किया गया है।
- source_word: εἶπον
  choice: कहा
  rationale: कथात्मक प्रसंग में λέγω का सामान्य और स्वाभाविक हिन्दी रूप।
- source_word: τῷ Ἰωναθάν
  choice: योनातान से
  rationale: यूनानी सम्प्रदान कारक यहाँ कथन के सम्बोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक प्रयोग है।
