  yaml_path: translation/deuterocanon/1_maccabees/009/026.yaml
  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: hi
  text: वे यहूदा के मित्रों[a] को लगातार ढूँढ़ते रहते और उनकी खोजबीन करते थे। वे उन्हें बक्खीदेस के पास ले जाते थे; वह उनसे बदला लेता था[b], और वे लोग उनका उपहास करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के समर्थकों’ अथवा ‘यहूदा के सहयोगियों’। यूनानी में शाब्दिक रूप से ‘यहूदा के मित्रों’ है, पर इस प्रसंग में यह राजनीतिक या सैनिक अनुयायियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अर्थ ‘उन्हें दंड देता था’, ‘उनसे न्याय वसूल करता था’ या ‘उनसे बदला लेता था’ हो सकता है। यहाँ शत्रुतापूर्ण और प्रतिशोधात्मक प्रसंग को ध्यान में रखकर मुख्य पाठ का अनुवाद किया गया है।
    reason: lexical_alternative
