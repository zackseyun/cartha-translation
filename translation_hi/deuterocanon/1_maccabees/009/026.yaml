- source_word: ἐξεζήτουν
  choice: लगातार ढूँढ़ते
  rationale: अपूर्ण भूतकाल जारी या बार-बार की गई कार्रवाई दिखाता है; ‘लगातार’ उनकी निरंतर खोज को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξηραύνων
  choice: खोजते रहते थे
  rationale: यह पहले क्रियापद के साथ मिलकर गहन तलाश का भाव देता है। यूनानी पाठ में इसका रूप एकवचन दिखाई देता है, पर निकटवर्ती बहुवचन क्रियाओं और कर्म के आधार पर वाक्य को बहुवचन कर्ता के साथ रखा गया है।
- source_word: τοὺς φίλους Ἰούδου
  choice: यहूदा के मित्रों
  rationale: φίλοι का सीधा अर्थ ‘मित्र’ है; इस राजनीतिक-सैनिक प्रसंग में इसका आशय समर्थक या सहयोगी भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἦγον
  choice: ले जाते थे
  rationale: अपूर्ण भूतकाल बार-बार लोगों को पकड़कर बक्खीदेस के पास ले जाने की कार्रवाई का संकेत देता है।
- source_word: πρὸς Βακχίδην
  choice: बक्खीदेस के पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर या उसके सामने ले जाने को व्यक्त करता है; ‘के पास’ सहज और पर्याप्त है।
- source_word: ἐξεδίκα
  choice: वह उनसे बदला लेता था
  rationale: एकवचन क्रिया का कर्ता प्रसंगानुसार बक्खीदेस है। क्रिया न्याय चुकाने, दंड देने या प्रतिशोध लेने का अर्थ दे सकती है; शत्रुतापूर्ण प्रसंग में ‘बदला लेता था’ उसके प्रतिशोधात्मक बल को स्पष्ट करता है।
- source_word: ἐνέπαιζον αὐτοῖς
  choice: वे उनका उपहास करते थे
  rationale: क्रिया किसी को हँसी या अपमान का पात्र बनाने का भाव देती है। बहुवचन रूप के कारण कर्ता को ‘वे’ रखा गया है, जबकि इससे पहले की एकवचन क्रिया बक्खीदेस को कर्ता बनाती है।
