  text: 'And they returned to Jerusalem and built fortified cities in Judea: the stronghold in Jericho[a], and Emmaus, and Beth-horon, and Bethel, and Thamnatha-pharathon, and Tephon[b], with high walls and gates and bars.'
translation:
  language: hi
  text: 'और वे यरूशलेम लौट आए और उन्होंने यहूदिया में किलाबंद नगर बनाए: यरीहो का गढ़, इम्माऊस, बेत-होरोन, बेतेल, थेमनाथा-फराथोन[a] और तेफोन[b]—ऊँची दीवारों, फाटकों और अर्गलाओं सहित।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘थेमनाथा-फराथोन’ यूनानी पाठ का निकट लिप्यंतरण है। अन्य पाठ-परंपराओं में इसे ‘तिम्नात-फरातोन’ भी लिखा जाता है।
    reason: lexical_alternative
