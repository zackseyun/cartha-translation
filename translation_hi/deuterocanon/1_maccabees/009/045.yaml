  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: hi
  text: क्योंकि देखो, युद्ध हमारे सामने और हमारे पीछे है; और यरदन का जल इधर भी और उधर भी है, तथा दलदल और वन भी हैं; हटने के लिए कोई जगह नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देखो
  rationale: γάρ के कारणसूचक संबंध और ἰδού के ध्यान आकर्षित करने वाले जीवंत भाव—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὁ πόλεμος
  choice: युद्ध
  rationale: यहाँ तत्काल युद्ध-संघर्ष की स्थिति है; हिन्दी में ‘युद्ध’ इस सामरिक संकट को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: हमारे सामने और हमारे पीछे
  rationale: दोनों पद स्थान-सूचक हैं और सामने-पीछे से घिरने की स्थिति बताते हैं।
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: यरदन का पानी
  rationale: यूनानी पाठ नदी के बजाय विशेष रूप से उसके पानी को बाधा के रूप में सामने रखता है।
- source_word: ἔνθεν καὶ ἔνθεν
  choice: इधर भी और उधर भी
  rationale: यूनानी की वितरक स्थान-सूचक अभिव्यक्ति को निकटता से रखते हुए हिन्दी में सहज है।
- source_word: ἕλος καὶ δρυμός
  choice: दलदल और वन
  rationale: दोनों भू-आकृतिक बाधाओं को सीधे और सामान्य हिन्दी शब्दों में व्यक्त करता है; δρυμός के लिए ‘झाड़ीदार वन’ भी संभव है, पर ‘वन’ अधिक व्यापक और स्पष्ट है।
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: मुड़कर निकलने के लिए कोई जगह नहीं है
  rationale: ἐκκλῖναι का मूल भाव ‘एक ओर मुड़ना/हटना’ है; ‘मुड़कर निकलना’ मूल चित्र और प्रसंगगत बच निकलने की धारणा दोनों को बिना अतिव्याख्या के रखता है।
