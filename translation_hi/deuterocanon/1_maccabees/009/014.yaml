  yaml_path: translation/deuterocanon/1_maccabees/009/014.yaml
  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: hi
  text: और यहूदा ने देखा कि बक्खिदेस और छावनी का मुख्य बल[a] दाहिनी ओर थे, और हृदय से साहसी सभी पुरुष[b] उसके पास आ जुटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छावनी का सबसे मजबूत दल।’ यूनानी पद बक्खिदेस की सेना के सुदृढ़ या सबसे शक्तिशाली दल को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘हृदय से साहसी सभी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεν
  choice: देखा
  rationale: ὁράω के अओरिस्ट रूप का सीधा कथात्मक अर्थ है; युद्ध के दृश्य में यह बिना अनावश्यक व्याख्या जोड़े स्वाभाविक है।
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: छावनी का मुख्य बल
  rationale: στερέωμα दृढ़ता, शक्ति या सुदृढ़ आधार को दर्शाता है। यहाँ इसका आशय किलेबंदी से नहीं, बल्कि सेना के मजबूत या प्रधान दल से है; ‘मुख्य बल’ इस सैनिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς δεξιοῖς
  choice: दाहिनी ओर
  rationale: यह पद दाहिने भाग या दाहिने मोर्चे की स्थिति बताता है। ‘दाहिनी ओर’ संक्षिप्त और स्वाभाविक है तथा प्रसंग से सैनिक अर्थ स्पष्ट रहता है।
- source_word: συνῆλθον αὐτῷ
  choice: उसके पास आ जुटे
  rationale: συνέρχομαι का अर्थ एक साथ आना है और αὐτῷ यहाँ यहूदा की ओर एकत्र होने का भाव देता है। ‘उसके पास आ जुटे’ सामूहिक गति और उसके साथ होने, दोनों को व्यक्त करता है।
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: वे सभी पुरुष, जो हृदय से साहसी थे
  rationale: εὔψυχοι साहसी या दृढ़-मन लोगों को दर्शाता है और τῇ καρδίᾳ उनके भीतरी साहस पर बल देता है। सैनिक प्रसंग और यूनानी पुल्लिंग बहुवचन के कारण ‘पुरुष’ उचित है, जबकि ‘हृदय से साहसी’ मूल अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: सैनिक प्रसंग में पुल्लिंग समूह का उल्लेख
  choice: वे सभी पुरुष, जो हृदय से साहसी थे
  alternative: वे सभी साहसी लोग
  rationale: यूनानी का पुल्लिंग बहुवचन इस युद्ध-वर्णन में लड़ने वाले पुरुषों को सूचित करता है; इसलिए लिंग-तटस्थ रूप अपनाने के बजाय प्रसंगानुकूल स्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मुख्य बल’ सैनिक प्रसंग में सामान्य पाठक के लिए स्पष्ट है, और ‘हृदय से साहसी’ मूल की आंतरिक साहस वाली छवि को सुरक्षित रखता है।
