translation:
  language: hi
  text: जब बक्खिदेस ने देखा कि अल्किमुस मर चुका था, तो वह राजा के पास लौट गया, और यहूदा का देश दो वर्ष तक शांत रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: देखा
  rationale: ὁράω का मूल अर्थ ‘देखना’ है; ὅτι-वाक्य के साथ यहाँ इसका भाव किसी तथ्य को जान लेने का भी हो सकता है। हिंदी में ‘देखा कि’ मूल के निकट और स्वाभाविक है।
- source_word: ἀπέθανεν
  choice: मर चुका है
  rationale: यूनानी एओरिस्ट मृत्यु की घटना बताता है। मुख्य भूतकालीन कथन से पहले पूरी हो चुकी घटना को हिंदी में ‘मर चुका है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπέστρεψεν
  choice: लौट गया
  rationale: क्रिया का अर्थ वापस मुड़ना या लौटना है; गंतव्य राजा है, इसलिए ‘राजा के पास लौट गया’ सहज हिंदी है।
- source_word: πρὸς τὸν βασιλέα
  choice: राजा के पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर गति और गंतव्य दर्शाता है; हिंदी में ‘के पास’ उपयुक्त है।
- source_word: ἡσύχασεν
  choice: शांत रहा
  rationale: क्रिया शांत या विश्राम की अवस्था में रहने को दर्शाती है। ‘शांत रहा’ राजनीतिक उपद्रव के थमने का संयत भाव रखता है और ‘शांति मिली’ जैसा अतिरिक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἡ γῆ Ἰούδα
  choice: यहूदा देश
  rationale: γῆ को ‘देश’ से स्पष्ट किया गया है और Ἰούδα के बाइबलीय नाम को ‘यहूदा’ रखा गया है।
- source_word: ἔτη δύο
  choice: दो वर्ष तक
  rationale: यूनानी कर्मकारक कालावधि बताता है; हिंदी में ‘तक’ अवधि को स्वाभाविक रूप से व्यक्त करता है।
