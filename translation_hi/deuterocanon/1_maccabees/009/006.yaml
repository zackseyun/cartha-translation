  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
translation:
  language: hi
  text: और जब उन्होंने देखा कि सैन्य दलों की संख्या बहुत बड़ी थी, तो वे बहुत डर गए। बहुत-से लोग छावनी से खिसक निकले[a], और उनमें से केवल आठ सौ पुरुष रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाग निकले।’ यूनानी क्रिया समूह से खिसककर निकल जाने या भाग जाने—दोनों भाव सुझा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων, ὅτι πολλοί εἰσιν
  choice: सैन्य दल बहुत बड़ी संख्या में थे
  rationale: δυνάμεις को उसके सैनिक संदर्भ में ‘सैन्य दल’ और πλῆθος तथा πολλοί के संयुक्त बल को ‘बहुत बड़ी संख्या’ से व्यक्त किया गया है। इससे यूनानी का कारणसूचक भाव स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: ἐφοβήθησαν σφόδρα
  choice: वे बहुत डर गए
  rationale: ‘बहुत’ σφόδρα की तीव्रता को और ‘डर गए’ अओरिस्ट क्रिया के घटित भाव को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξερρύησαν
  choice: खिसक निकले
  rationale: क्रिया में समूह से बहकर या चुपचाप निकल जाने का बिंब हो सकता है। ‘खिसक निकले’ इस सूक्ष्मता को रखता है, जबकि ‘भाग निकले’ भी संदर्भानुकूल सम्भव अर्थ है।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: सैनिक संदर्भ में παρεμβολή का अर्थ शिविर या छावनी है; ‘छावनी’ यहाँ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: उनमें से केवल आठ सौ पुरुष रह गए
  rationale: यह यूनानी अपवादात्मक रचना का स्वाभाविक हिन्दी रूप है और प्रस्थान के बाद बची हुई संख्या को स्पष्ट करता है।
