lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: हम उठें
  rationale: यह अओरिस्ट संभावनार्थक क्रिया यहाँ मिलकर तत्काल कार्य करने के आह्वान के रूप में प्रयुक्त है। ‘हम उठें’ उसके सैन्य उत्साह और तात्कालिकता को बनाए रखता है।
- source_word: πολεμήσωμεν
  choice: लड़ें
  rationale: युद्ध में भिड़ने के अर्थ को आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: अपने प्राणों के लिए
  rationale: इस युद्ध-संदर्भ में ψυχή का आशय अमूर्त आत्मा नहीं, बल्कि जीवन और जीवित बचना है। ‘प्राणों’ से जीवन की रक्षा का अर्थ और कथन की गंभीरता दोनों व्यक्त होते हैं।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी में स्पष्ट पुल्लिंग पारिवारिक संबोधन है। ‘भाइयों’ स्रोत के रूप को सुरक्षित रखता है और युद्ध-साथियों के आत्मीय संबोधन के रूप में भी स्वाभाविक है।
- source_word: οὐ γάρ ἐστιν σήμερον ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: क्योंकि आज की स्थिति कल और परसों जैसी नहीं है
  rationale: शाब्दिक वाक्यांश ‘कल और तीसरे दिन’ एक सामी-प्रभावित कालसूचक मुहावरा है, जिसका आशय ‘कल और परसों’ है। केवल ‘आज वैसा नहीं है’ हिन्दी में अधूरा लगता, इसलिए निहित परिस्थिति को ‘आज की स्थिति’ से स्वाभाविक रूप दिया गया है।
