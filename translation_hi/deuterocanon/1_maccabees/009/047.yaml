  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: hi
  text: और युद्ध घमासान हो उठा[a]। योनातान ने बक्खिदेस पर वार करने के लिए अपना हाथ बढ़ाया, पर वह उससे मुड़कर पीछे की ओर चला गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और युद्ध की भिड़ंत और कड़ी हो गई।” यूनानी क्रिया संघर्ष के सिमटकर तीव्र हो जाने, अथवा भिड़ंत के निकट आ जाने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “पर वह उससे पीछे की ओर मुड़ गया।” यूनानी क्रिया मुड़ने या एक ओर हटने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν
  choice: घमासान हो गया
  rationale: युद्ध के संदर्भ में क्रिया संघर्ष के सिमटकर अधिक तीव्र हो जाने का भाव देती है। ‘घमासान हो गया’ स्वाभाविक आधुनिक हिन्दी में इस तीव्रता को व्यक्त करता है।
- source_word: ὁ πόλεμος
  choice: युद्ध
  rationale: यहाँ तत्काल चल रही मुठभेड़ अभिप्रेत है; ‘युद्ध’ सामान्य हिन्दी पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: अपना हाथ बढ़ाया
  rationale: मूल यूनानी की दृश्यात्मक अभिव्यक्ति को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πατάξαι
  choice: वार करने के लिए
  rationale: युद्ध के प्रसंग में ‘वार करना’ प्रहार के आशय को आधुनिक और सटीक हिन्दी में व्यक्त करता है।
- source_word: Ἰωναθὰν
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Βακχίδην
  choice: बक्खिदेस
  rationale: यूनानी Βακχίδης का निकट देवनागरी लिप्यंतरण।
- source_word: ἐξέκλινεν
  choice: बचकर ... हट गया
  rationale: क्रिया के मुड़कर अथवा किनारा करके निकल जाने के भाव को प्रसंगानुकूल ढंग से व्यक्त करता है, बिना यह निश्चित किए कि यह पूर्ण पलायन था।
- source_word: ἀπ᾿ αὐτοῦ
  choice: उससे बचकर
  rationale: सर्वनाम स्वाभाविक रूप से योनातान की ओर संकेत करता है, जिससे बक्खिदेस दूर हुआ।
- source_word: εἰς τὰ ὀπίσω
  choice: पीछे हट गया
  rationale: पीछे की दिशा में गति को सहज सैन्य हिन्दी में व्यक्त करता है।
