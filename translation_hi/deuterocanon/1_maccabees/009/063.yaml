lexical_decisions:
- source_word: ἔγνω
  choice: पता चला
  rationale: क्रिया का अओरिस्ट रूप यहाँ किसी घटना की सूचना मिलने या उसे जान लेने का भाव देता है; ‘पता चला’ आधुनिक हिन्दी में इस कथात्मक क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνήγαγεν
  choice: इकट्ठी की
  rationale: यह क्रिया लोगों को कार्रवाई के लिए एकत्र करने को दर्शाती है; ‘सेना’ के साथ ‘इकट्ठी की’ सहज और स्पष्ट है।
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: अपनी सारी सेना
  rationale: शाब्दिक अर्थ ‘उसकी सारी भीड़/जनसमूह’ है, पर सैन्य प्रसंग में इससे उसके अधीन सैनिकों या समर्थकों का पूरा दल अभिप्रेत है। ‘सारी सेना’ अर्थ को स्वाभाविक हिन्दी में संप्रेषित करती है।
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: यहूदिया से आए लोगों
  rationale: ἐκ का मूल भाव ‘से/में से’ है। यह अनुवाद यूनानी की स्रोत-संबंधी अभिव्यक्ति बनाए रखता है और केवल वर्तमान निवास का अर्थ नहीं थोपता।
- source_word: παρήγγειλεν
  choice: आदेश दिए
  rationale: यह क्रिया निर्देश या आदेश देने को व्यक्त करती है; सैन्य प्रसंग में ‘आदेश दिए’ वर्तमान हिन्दी में स्वाभाविक है।
