  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: hi
  text: बाएँ मोर्चे[a] के लोगों ने, जब देखा कि दायाँ मोर्चा कुचल दिया गया था, लौटकर पीछे से यहूदा और उसके साथियों का बहुत निकट से पीछा किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बायाँ सींग’ और ‘दायाँ सींग’; यह सेना के बाएँ और दाएँ भाग के लिए प्रयुक्त यूनानी सैन्य अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘यहूदा और उसके साथियों की एड़ियों पर, पीछे से’; यह बहुत निकट होकर पीछे से पीछा करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: बायाँ मोर्चा / दायाँ मोर्चा
  rationale: κέρας का शाब्दिक अर्थ ‘सींग’ है, पर यहाँ यह सेना के बाएँ और दाएँ भाग के लिए प्रयुक्त यूनानी सैन्य अभिव्यक्ति है। आधुनिक हिन्दी में ‘मोर्चा’ युद्ध-विन्यास का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνετρίβη
  choice: कुचल दिया गया है
  rationale: यह अनुवाद क्रिया के प्रबल अर्थ और कर्मवाच्य रूप को बनाए रखता है; ‘हरा दिया गया’ मूल से अधिक व्याख्यात्मक होता।
- source_word: ἐπέστρεψαν
  choice: वे मुड़े
  rationale: क्रिया दिशा बदलने या पलटने को दर्शाती है। ‘मुड़े’ युद्धभूमि में उनकी गति के उलटने को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: κατὰ πόδας ... ἐκ τῶν ὄπισθεν
  choice: पीछे से ... के ठीक पीछे लग गए
  rationale: κατὰ πόδας का मुहावरा किसी के पैरों या एड़ियों के निकट चलने, अर्थात निकट से पीछा करने, का बोध देता है; ἐκ τῶν ὄπισθεν स्पष्ट करता है कि यह पीछा पीछे की ओर से था।
- source_word: τῶν μετʼ αὐτοῦ
  choice: उसके साथियों
  rationale: यह यहूदा के साथ उपस्थित लोगों को व्यक्त करता है और उन्हें अनावश्यक रूप से केवल सैनिक कहकर सीमित नहीं करता।
