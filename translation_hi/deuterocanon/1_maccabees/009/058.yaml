  yaml_path: translation/deuterocanon/1_maccabees/009/058.yaml
  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: hi
  text: और सब व्यवस्था-विरोधी लोगों ने आपस में विचार करके कहा, “देखो, योनातान और उसके साथ के लोग निश्चिंत होकर शांति से रह रहे हैं।[a] इसलिए अब हम बक्खिदेस को ले आएँ; वह एक ही रात में उन सबको पकड़ लेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांतिपूर्वक रह रहे हैं और भरोसे में हैं।” यूनानी में शांत होकर रहने और भरोसे अथवा निश्चिंतता की अवस्था—दोनों भाव साथ आते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: आपस में विचार करके
  rationale: मध्यवाच्य क्रिया समूह के परस्पर विचार-विमर्श को व्यक्त करती है; यह शत्रुतापूर्ण संदर्भ बनाए रखती है, पर मूल से आगे बढ़कर इसे अनिवार्यतः गुप्त षड्यंत्र नहीं कहती।
- source_word: οἱ ἄνομοι
  choice: व्यवस्था-विरोधी लोग
  rationale: ἄνομος का अर्थ व्यवस्था या कानून के विरुद्ध होना है। इस पुस्तक के यहूदी धार्मिक-राजनीतिक संदर्भ में ‘व्यवस्था-विरोधी’ नैतिक और वाचा-संबंधी बल को ‘दुष्ट’ से अधिक स्पष्ट रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी उद्गार।
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: उसके साथ के लोग
  rationale: योनातान के साथियों को व्यापक रूप से व्यक्त करता है और उन्हें मूल से अधिक विशिष्ट रूप में सैनिक या मित्र नहीं ठहराता।
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν πεποιθότες
  choice: निश्चिंत होकर शांति से रह रहे हैं
  rationale: κατοικοῦσιν के निवास, ἐν ἡσυχίᾳ की शांत अवस्था और πεποιθότες के भरोसे/निश्चिंतता—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄξομεν
  choice: हम ... यहाँ ले आएँ
  rationale: प्रसंग में प्रस्तावात्मक या प्रेरणार्थक भाव है; ‘यहाँ’ ἄγω की वक्ताओं की ओर लाने की संदर्भगत दिशा स्पष्ट करता है।
- source_word: συλλήψεται
  choice: पकड़ लेगा
  rationale: सैन्य घात के संदर्भ में पकड़ने या बंदी बनाने का व्यापक अर्थ रखता है; ‘गिरफ़्तार’ अनावश्यक कानूनी रंग देता।
- source_word: ἐν νυκτὶ μιᾷ
  choice: एक ही रात में
  rationale: μία द्वारा समय की संक्षिप्तता और एकाग्रता पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
