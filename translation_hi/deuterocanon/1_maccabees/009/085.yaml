  text: जलाए गए लोगों समेत, कुल आठ हज़ार पुरुष। फिर वह चला गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का उपलब्ध यूनानी पाठ अर्थ की दृष्टि से खंडित है और केवल इतना वाक्यांश सुरक्षित रखता है: “जलाए गए लोगों समेत, कुल आठ हज़ार पुरुष। फिर वह चला गया।” यहाँ लुप्त प्रसंग का अनुमान लगाकर पुनर्निर्माण नहीं किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: σὺν
  choice: समेत
  rationale: यह पूर्वोक्त संख्या या समूह में जलाए गए लोगों को जोड़ता है; ‘समेत’ इस योगात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: जलाए गए लोगों
  rationale: ἐμπυρίζω के भूतकालिक कर्मवाच्य कृदन्त का सीधा अर्थ है वे लोग जिन्हें जलाया गया। ‘ज़िंदा जलाए गए’ सम्भव ऐतिहासिक आशय को पाठ से अधिक स्पष्ट कर देता, इसलिए उसे नहीं अपनाया गया।
- source_word: εἰς
  choice: तक पहुँची
  rationale: यहाँ εἰς परिणामी कुल संख्या बताता है। खंडित यूनानी वाक्यांश को हिन्दी में बोधगम्य बनाने के लिए ‘संख्या ... तक पहुँची’ कहा गया है।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: यूनानी में सामान्य ‘लोग’ के बजाय विशेष रूप से ἄνδρας है, इसलिए लिंगसूचक अर्थ सुरक्षित रखा गया है।
- source_word: ὀκτακισχιλίους
  choice: आठ हज़ार
  rationale: मूल संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀπῆρεν
  choice: वह वहाँ से चला गया
  rationale: क्रिया प्रस्थान को सूचित करती है। ‘वहाँ से चला गया’ आधुनिक हिन्दी में स्पष्ट और कथात्मक शैली के अनुकूल है।
