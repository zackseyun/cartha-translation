  verdict: revise
  source_fidelity: The draft correctly renders the burned persons, the total of eight thousand, and the masculine term ἄνδρας. However, “उनकी संख्या” supplies an unexpressed antecedent and finite predication to a source clause that is explicitly fragmentary, while “वहाँ से” adds a locative element not present in ἀπῆρεν.
  naturalness: The Hindi is otherwise clear and appropriately formal. A deliberately elliptical nominal clause is preferable here because the surviving Greek is itself an incomplete clause; the textual-variant note makes this acceptable and transparent to readers.
  terminology: “जलाए गए लोगों” is a suitably restrained rendering of τοῖς ἐμπυρισθεῖσιν and does not overstate “burned alive.” “पुरुष” appropriately retains the specificity of ἄνδρας. “चला गया” naturally conveys ἀπῆρεν without importing a location.
  issues:
  - severity: medium
    issue: The phrase “उनकी संख्या ... पहुँची” reconstructs an antecedent and verbal assertion absent from the surviving Greek.
    rationale: The Greek preserves only “with those burned, to eight thousand men,” so the Hindi should retain the acknowledged ellipsis rather than identify whose number it was.
  - severity: low
    issue: “वहाँ से” is not represented in the Greek.
    rationale: ἀπῆρεν means that he departed/went away, but does not specify “from there.”
  revised_text: जलाए गए लोगों समेत, कुल आठ हज़ार पुरुष। फिर वह चला गया।[a]
