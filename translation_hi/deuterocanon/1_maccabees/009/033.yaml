  yaml_path: translation/deuterocanon/1_maccabees/009/033.yaml
  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: hi
  text: जब योनातान, उसके भाई शमौन और उसके साथ के सभी लोगों को इस बात का पता चला[a], तो वे तकोआ के वीराने में भाग गए और अस्फार के कुंड[b] के पानी के पास डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘जान गए’; किस बात को जाना, यह प्रसंग से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कुंड’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘गड्ढा’ या ‘हौद’ भी हो सकता है; यहाँ ‘कुंड का पानी’ किसी जलस्रोत या जल-संग्रह को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: इस बात का पता चला
  rationale: यूनानी क्रिया यहाँ संदर्भ में निहित किसी घटना या खतरे की जानकारी मिलने को व्यक्त करती है; यह सहज हिन्दी में उस आरंभिक बोध को स्पष्ट रखती है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: क्रिया खतरे के कारण शीघ्र पलायन का भाव रखती है, जिसे ‘भाग गए’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔρημον Θεκώε
  choice: तकोआ के वीराने
  rationale: ἔρημος निर्जन या उजाड़ भूभाग को सूचित करता है; ‘वीराना’ आधुनिक हिन्दी में बिना अत्यधिक मरुस्थलीय अर्थ थोपे उस भूगोल को व्यक्त करता है।
- source_word: παρενέβαλον
  choice: डेरा डाला
  rationale: यह पड़ाव या शिविर स्थापित करने की कथात्मक क्रिया है; ‘डेरा डाला’ सामान्य पाठक के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπὶ τὸ ὕδωρ
  choice: पानी के पास
  rationale: डेरे के संदर्भ में यह वाक्यांश जलस्रोत के निकट स्थान को बताता है।
- source_word: λάκκου
  choice: कुंड
  rationale: λάκκος गड्ढा, जलकुंड या हौद हो सकता है; ‘पानी’ के साथ यहाँ पानी जमा रखने वाला कुंड अभिप्रेत जान पड़ता है, पर पादटिप्पणी में शब्द की व्यापकता सुरक्षित रखी गई है।
- source_word: Ἀσφάρ
  choice: अस्फार
  rationale: नाम को उपलब्ध यूनानी रूप के अनुसार देवनागरी में लिप्यंतरित किया गया है।
