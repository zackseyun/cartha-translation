lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: यह यूनानी काल-सूचक कथन का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: ἐγενήθη
  choice: पड़ा
  rationale: अकाल के साथ ‘पड़ना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है और घटना के घटित होने का भाव व्यक्त करता है।
- source_word: λιμὸς μεγάλη σφόδρα
  choice: बहुत भयंकर अकाल
  rationale: ‘बहुत’ σφόδρα की तीव्रता और ‘भयंकर’ μεγάλη द्वारा अकाल की गंभीरता को सहज हिन्दी में व्यक्त करते हैं।
- source_word: αὐτομόλησεν
  choice: जा मिला
  rationale: यह क्रिया अपना पक्ष छोड़कर दूसरे पक्ष में चले जाने या उससे जा मिलने को दर्शाती है; ‘जा मिला’ राजनीतिक-सामाजिक पक्ष-परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ χώρα
  choice: देश
  rationale: χώρα यहाँ भूभाग के साथ उसके निवासियों के लिए सामूहिक रूप से प्रयुक्त हो सकता है; ‘देश’ इस व्यापकता को बनाए रखता है।
- source_word: μετʼ αὐτῶν
  choice: उनके साथ
  rationale: μετά संबंध और सहभागिता सूचित करता है। ‘उनके साथ’ मूल की संरचना और इस अस्पष्टता को बनाए रखता है कि देश उनके साथ उसी पक्ष में जा मिला।
