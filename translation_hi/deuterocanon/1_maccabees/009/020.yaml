  text: And they mourned for him there[a], and all Israel mourned for him with great mourning, and they grieved for many days and said,
translation:
  language: hi
  text: उन्होंने वहाँ उसके लिए शोक मनाया[a], और समस्त इस्राएल ने उसके लिए बड़ा शोक मनाया, और वे बहुत दिनों तक दुःखी रहे और कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शोक से जुड़े शब्द क्रमशः दोहराए गए हैं: पहले शोक या विलाप करने की क्रिया, फिर ‘बड़ा शोक’ का सजातीय संज्ञा-प्रयोग, और उसके बाद दुःखी रहने की दूसरी क्रिया। हिन्दी में इस क्रमिक पुनरावृत्ति को बनाए रखा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόψαντο
  choice: शोक मनाया
  rationale: शोक के प्रसंग में κόπτω का मध्यवाच्य रूप विलाप अथवा शोक मनाने को व्यक्त करता है। ‘शोक मनाया’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी पुनरावृत्ति को भी बनाए रखता है; ‘छाती पीटी’ कहना सम्भव है, पर वह शारीरिक क्रिया को आवश्यकता से अधिक स्पष्ट कर देगा।
- source_word: αὐτόν
  choice: उसके लिए
  rationale: सर्वनाम पिछले प्रसंग के यहूदा की ओर संकेत करता है। शोक के साथ हिन्दी में ‘उसके लिए’ स्वाभाविक प्रयोग है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण है। ‘वहीं’ उस पहले उल्लिखित स्थान की ओर सहज संकेत करता है।
- source_word: πᾶς Ἰσραήλ
  choice: समस्त इस्राएल
  rationale: यह सामूहिक राष्ट्रीय अभिव्यक्ति है। ‘समस्त इस्राएल’ उसकी व्यापक सामूहिकता और गरिमामय बाइबलीय शैली को बनाए रखता है।
- source_word: κοπετὸν μέγαν
  choice: बड़ा शोक
  rationale: κοπετός पहले आए क्रियापद का सजातीय शोक-वाचक संज्ञा रूप है। ‘बड़ा शोक मनाया’ यूनानी के तीव्रतासूचक भाव और पुनरावृत्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἔπενθουν
  choice: वे दुःखी रहे
  rationale: πενθέω पहले प्रयुक्त ἐκόψαντο से भिन्न किंतु निकटार्थक शोक-वाचक क्रिया है। ‘दुःखी रहे’ उस शब्दगत बदलाव और जारी रहने वाले दुःख, दोनों को व्यक्त करता है।
- source_word: ἡμέρας πολλὰς
  choice: बहुत दिनों तक
  rationale: यह अवधि बताने वाला कर्मकारक प्रयोग है; ‘बहुत दिनों तक’ आधुनिक हिन्दी में सहज है।
- source_word: καὶ εἶπαν
  choice: फिर उन्होंने कहा,
  rationale: यह अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में ‘फिर’ कथानक का संबंध स्वाभाविक बनाता है और अंतिम अल्पविराम आगे जारी उद्धरण का संकेत देता है।
