base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: hi
  text: और ऐसा हुआ कि यहूदा की मृत्यु के बाद इस्राएल के सभी क्षेत्रों में व्यवस्था-विरोधी लोग[a] निकल आए, और अधर्म करनेवाले सभी लोग पनप उठे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था को न माननेवाले”; यूनानी शब्द उन लोगों को दर्शाता है जिनकी पहचान व्यवस्था-विरोध से होती है।
    reason: lexical_alternative
  - marker: b
    text: “अधर्म करनेवाले” का अनुवाद “अन्याय करनेवाले” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यह यूनानी कथा-संक्रमण का स्वाभाविक आधुनिक हिन्दी रूप है और अनावश्यक पुरातनता से बचता है।
- source_word: τελευτήν
  choice: मृत्यु
  rationale: इस प्रसंग में यहूदा के जीवन के अंत, अर्थात उसकी मृत्यु, का स्पष्ट उल्लेख है।
- source_word: ἐξέκυψαν
  choice: निकल आए
  rationale: क्रिया के अचानक प्रकट होने या बाहर आने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ἄνομοι
  choice: व्यवस्था-विरोधी लोग
  rationale: यह चयन νόμος से जुड़े व्यवस्था-विरोध के भाव को बनाए रखता है; केवल ‘दुष्ट’ कहना इस शब्द-संबंध को सपाट कर देता।
- source_word: ὁρίοις
  choice: क्षेत्रों
  rationale: यहाँ शब्द इस्राएल की केवल सीमा-रेखाओं के बजाय उसके समस्त भूभागों या इलाकों को सूचित करता है।
- source_word: ἀνέτειλαν
  choice: पनप उठे
  rationale: उगने या अंकुरित होने के सजीव रूपक को हिन्दी में सुरक्षित रखते हुए बुराई करनेवालों के तेजी से फैलने का भाव देता है।
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: अधर्म करनेवाले
  rationale: चलते रहनेवाले आचरण के सहभागी भाव और ἀδικία के व्यापक नैतिक भार, दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ἄνομοι में व्यवस्था-संबंधी नैतिक और वाचा-सापेक्ष भाव
  choice: व्यवस्था-विरोधी लोग
  alternative: दुष्ट लोग
  rationale: ‘व्यवस्था-विरोधी’ मूल के νόμος-संबंध को बनाए रखता है, जबकि ‘दुष्ट’ अधिक सामान्य और व्याख्यात्मक है।
- issue: ἀδικία का व्यापक नैतिक या सामाजिक-न्याय संबंधी अर्थ
  choice: अधर्म
  alternative: अन्याय
  rationale: इस वाक्य में शब्द सामान्य नैतिक बुराई को भी सूचित कर सकता है; ‘अधर्म’ उस व्यापकता को रखता है, और ‘अन्याय’ को पादटिप्पणी में वास्तविक विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘निकल आए’ और ‘पनप उठे’ से यूनानी की दो अलग सजीव क्रियाओं का अंतर रखा गया है।
