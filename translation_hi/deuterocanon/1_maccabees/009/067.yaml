lexical_decisions:
- source_word: οἱ μετʼ αὐτοῦ
  choice: उसके साथ के लोग
  rationale: यह पदबंध शमौन के साथियों को व्यापक रूप से व्यक्त करता है और उन्हें यूनानी पाठ से अधिक संकीर्ण अर्थ में सैनिक नहीं ठहराता।
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: नगर से बाहर निकले
  rationale: यह गति और नगर से प्रस्थान, दोनों को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἐνεπύρισαν
  choice: आग लगा दी
  rationale: क्रिया किसी वस्तु को जलाने के लिए उसमें आग लगाने की क्रिया बताती है; यह अनुवाद आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὰς μηχανάς
  choice: घेराबंदी के यंत्रों
  rationale: सैन्य प्रसंग में μηχαναί नगर पर आक्रमण में प्रयुक्त यंत्रों को सूचित करता है; यह चयन सामान्य 'मशीनों' की अपेक्षा प्रसंग का अर्थ अधिक स्पष्ट करता है।
