base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: hi
  text: उस समय अलकिमुस को आघात लगा और उसके कामों में बाधा पड़ गई। उसका मुँह बंद हो गया और उसे लकवा मार गया; वह फिर एक शब्द भी नहीं बोल सका, न अपने घर[a] के बारे में कोई आदेश दे सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने घर-परिवार’ अथवा ‘अपने घरेलू मामलों के बारे में’; यूनानी शब्द οἶκος का अर्थ केवल भवन नहीं, बल्कि परिवार, गृहस्थी या घरेलू प्रतिष्ठान भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: को आघात लगा
  rationale: यह अओरिस्ट कर्मवाच्य रूप अचानक लगे गंभीर आघात या विपत्ति को व्यक्त करता है। यह अनुवाद उसकी दशा की गंभीरता बनाए रखता है, पर इसे न तो स्पष्ट रूप से दैवी दंड बताता है, न किसी खास चिकित्सीय घटना के रूप में सीमित करता है।
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: उसके कामों में बाधा पड़ गई
  rationale: ἐνεποδίσθη रुकावट या अवरोध आने का भाव देता है, जबकि ἔργα यहाँ उसके चल रहे कामों या उपक्रमों के लिए व्यापक शब्द है।
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: उसका मुँह बंद हो गया
  rationale: यूनानी अभिव्यक्ति मुँह के रुक या बंद हो जाने का ठोस चित्र प्रस्तुत करती है। हिन्दी में यह स्वाभाविक रहते हुए उसकी बोलने की असमर्थता को स्पष्ट करती है।
- source_word: παρελύθη
  choice: उसे लकवा मार गया
  rationale: παραλύω सामान्यतः लकवे या गंभीर शारीरिक अशक्तता को दर्शाता है। यह हिन्दी अभिव्यक्ति प्रसंग में सहज और स्पष्ट है।
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: वह फिर एक शब्द भी नहीं बोल सका
  rationale: यह λαλῆσαι λόγον के मुहावरे और ἔτι के ‘फिर/अब और नहीं’ वाले कालगत भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐντείλασθαι
  choice: कोई आदेश दे सका
  rationale: मध्यवाच्य क्रिया यहाँ आदेश या निर्देश देने को सूचित करती है; घरेलू-प्रशासनिक प्रसंग में ‘आदेश देना’ उपयुक्त है।
- source_word: περὶ τοῦ οἴκου αὐτοῦ
  choice: अपने घराने के विषय में
  rationale: οἶκος केवल भवन नहीं, परिवार, गृहस्थी या घरेलू प्रतिष्ठान भी हो सकता है। आदेश देने के प्रसंग में ‘घराना’ इस व्यापक अर्थ को ‘घर’ से अधिक स्पष्ट करता है।
theological_decisions:
- issue: अलकिमुस के आघात का स्वरूप और कर्ता
  choice: गंभीर और अक्षम कर देने वाले आघात का वर्णन किया गया है, पर उसके कर्ता या ठीक चिकित्सीय स्वरूप को निर्दिष्ट नहीं किया गया।
  alternative: इसे स्पष्टतः दैवी दंड अथवा किसी विशिष्ट चिकित्सीय घटना—जैसे मस्तिष्काघात—के रूप में प्रस्तुत करना।
  rationale: इस पद में कर्मवाच्य क्रियाएँ घटना और उसके परिणाम बताती हैं, पर परमेश्वर को स्पष्ट कर्ता नहीं कहतीं और न कोई निश्चित रोग-निदान देती हैं। इसलिए अनुवाद मूल की धार्मिक और चिकित्सीय अनिर्धारितता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। छोटे वाक्यों से शारीरिक विघटन की क्रमिकता स्पष्ट होती है। ‘आघात लगा’ कारण को अनिर्दिष्ट रखता है, और ‘घराने’ के साथ पाद-टिप्पणी οἶκος की अर्थ-व्याप्ति सुरक्षित रखती है।
