  yaml_path: translation/deuterocanon/1_maccabees/002/049.yaml
  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: hi
  text: मत्तथियास की मृत्यु का समय निकट आ गया, तब उसने अपने पुत्रों से कहा, “अब अहंकार और अपमान प्रबल हो गए हैं[a]; यह विनाश और प्रचंड क्रोध[b] का समय है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दृढ़ता से स्थापित हो गए हैं” अथवा “जड़ जमा चुके हैं”; यूनानी क्रिया किसी बात के सुदृढ़ और स्थायी हो जाने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ क्रोध के लिए दो निकटार्थक शब्द एक साथ आए हैं, जिससे उसकी तीव्रता बढ़ती है। पाठ यह स्पष्ट नहीं करता कि यह क्रोध किसका है।
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι ... ἀποθανεῖν
  choice: मृत्यु का समय निकट आ गया
  rationale: यूनानी में दिन निकट आने का काल-संबंधी मुहावरा है। हिन्दी में यह स्वाभाविक अभिव्यक्ति आसन्न मृत्यु का वही अर्थ देती है।
- source_word: ἐστηρίχθη
  choice: प्रबल हो गए हैं
  rationale: यहाँ क्रिया स्थापित, सुदृढ़ या जड़ जमा लेने की परिणामी दशा व्यक्त कर सकती है। अमूर्त कर्ताओं के साथ ‘प्रबल हो गए हैं’ सहज हिन्दी है; दृढ़ता से स्थापित होने का विकल्प पादटिप्पणी में रखा गया है।
- source_word: ὑπερηφανία
  choice: अहंकार
  rationale: यह शब्द घमण्डी और दूसरों को तुच्छ समझने वाले भाव को नैतिक दुर्गुण के रूप में व्यक्त करता है।
- source_word: ἔλεγμος
  choice: अपमान
  rationale: सन्दर्भ में यह केवल मौखिक डाँट नहीं, बल्कि निन्दा, तिरस्कार या सार्वजनिक अपमान की दशा को सूचित करता है।
- source_word: καιρὸς καταστροφῆς
  choice: विनाश का समय
  rationale: καιρός किसी विशेष या निर्णायक समय को और καταστροφή विनाश, ध्वंस या बरबादी को व्यक्त करता है।
- source_word: ὀργὴ θυμοῦ
  choice: प्रचंड क्रोध
  rationale: यूनानी में क्रोध के दो निकटार्थक शब्द साथ रखे गए हैं। ‘प्रचंड क्रोध’ इस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्रोध किसका है
  choice: क्रोध के कर्ता या धारक को अनिर्दिष्ट रखा गया है
  alternative: इसे स्पष्ट रूप से परमेश्वर का क्रोध या सताने वालों का मानवीय क्रोध कहना
  rationale: यूनानी पाठ केवल क्रोध का उल्लेख करता है और यह नहीं बताता कि वह किसका है; इसलिए अनुवाद इस धर्मवैचारिक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। यूनानी काल-मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि अहंकार, अपमान, विनाश और क्रोध की गंभीरता तथा क्रोध के स्रोत की अस्पष्टता सुरक्षित रखी गई है।
