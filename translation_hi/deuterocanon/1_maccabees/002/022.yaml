translation:
  language: hi
  text: हम राजा के आदेश का पालन नहीं करेंगे और अपनी उपासना से दाएँ या बाएँ नहीं हटेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: पालन नहीं करेंगे
  rationale: क्रिया का मूल अर्थ ‘सुनना’ है, पर किसी आदेश या व्यवस्था के संदर्भ में इसका स्वाभाविक अर्थ ‘मानना/पालन करना’ होता है। यहाँ व्यावहारिक आज्ञापालन से इनकार व्यक्त किया गया है।
- source_word: νόμον
  choice: आदेश
  rationale: शाब्दिक अर्थ ‘व्यवस्था’ या ‘कानून’ है, किंतु प्रसंग में राजा द्वारा थोपा गया राजकीय निर्देश अभिप्रेत है; आधुनिक हिन्दी में ‘आदेश’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρελθεῖν
  choice: हटेंगे
  rationale: यहाँ शब्द स्थापित उपासना से आगे निकलने, उसका उल्लंघन करने या उससे भटकने का भाव देता है। ‘हटना’ अगले दिशासूचक मुहावरे के साथ मूल रूपक को बनाए रखता है।
- source_word: λατρίαν
  choice: उपासना
  rationale: यह शब्द परमेश्वर के प्रति धार्मिक सेवा और आचरण को सूचित करता है। ‘उपासना’ आधुनिक हिन्दी में सहज है और धार्मिक अर्थ को बिना अनावश्यक तकनीकी भाषा के व्यक्त करता है।
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: न दाएँ … न बाएँ
  rationale: यह किसी भी दिशा में सही मार्ग से न भटकने का मुहावरा है। हिन्दी की स्वाभाविक समानांतर रचना मूल दिशात्मक रूपक और बाइबलीय अनुगूँज दोनों को सुरक्षित रखती है।
theological_decisions:
- issue: ‘राजा की व्यवस्था’ का आशय और उसका ईश्वरीय उपासना से संबंध
  choice: ‘राजा के आदेश’ के रूप में अनुवाद, और उससे उपासना में किसी भी प्रकार के विचलन से स्पष्ट इनकार
  alternative: ‘राजा की व्यवस्था’ या ‘राजा का कानून’
  rationale: पद में राजकीय अधिकार और अपनी धार्मिक निष्ठा के बीच तनाव है। ‘आदेश’ तत्कालीन राजकीय निर्देश को स्पष्ट करता है, पर मूल शब्द के अधिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘न दाएँ … न बाएँ’ मूल के दिशात्मक मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है; वाक्य में ‘और’ दोनों निकट जुड़े इनकारों को सहज रूप से जोड़ता है।
