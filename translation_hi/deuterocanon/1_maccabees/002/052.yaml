lexical_decisions:
- source_word: Ἀβραάμ
  choice: अब्राहम
  rationale: कुलपिता के नाम का हिन्दी बाइबल परंपरा में प्रचलित और सहज रूप।
- source_word: ἐν πειρασμῷ
  choice: परीक्षा के समय
  rationale: πειρασμός परीक्षा, परख या प्रलोभन का अर्थ दे सकता है; यहाँ अब्राहम को पाप के लिए लुभाए जाने के बजाय उसकी परीक्षा लिए जाने का संदर्भ है।
- source_word: εὑρέθη πιστός
  choice: विश्वासयोग्य नहीं पाया गया
  rationale: यूनानी कर्मवाच्य रचना और मूल्यांकनात्मक अर्थ को निकटता से रखता है तथा बताता है कि परीक्षा में अब्राहम विश्वासयोग्य सिद्ध हुआ।
- source_word: ἐλογίσθη αὐτῷ
  choice: यह उसके लिए ... गिनी नहीं गई
  rationale: λογίζομαι के गणना या लेखे में मानने के बिंब को बनाए रखता है और उत्पत्ति 15:6 की भाषा की प्रतिध्वनि करता है, बिना बाद की धर्मसैद्धांतिक व्याख्या जोड़े।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: इस अब्राहमी संदर्भ में δικαιοσύνη के लिए प्रचलित, गरिमापूर्ण और अर्थानुकूल हिन्दी पद।
theological_decisions:
- issue: अब्राहम की परीक्षा और धार्मिकता गिने जाने का संबंध
  choice: दोनों उपवाक्यों को एक ही आलंकारिक प्रश्न में सीधे जोड़ा गया है, पर उनके कालक्रम या धर्मसैद्धांतिक संबंध की व्याख्या नहीं की गई।
  alternative: इसे उत्पत्ति 22 और उत्पत्ति 15:6 को मिलाने वाला स्पष्ट धर्मवैचारिक सारांश बनाना, या अब्राहम के विश्वास को दोनों का व्याख्यात्मक कर्ता बनाना।
  rationale: यूनानी पाठ परीक्षा में विश्वासयोग्य पाए जाने और धार्मिकता गिने जाने को साथ रखता है, पर यह स्पष्ट नहीं करता कि दोनों घटनाओं का कालक्रमिक या कारणात्मक संबंध क्या है; अनुवाद इसी तनाव को सुरक्षित रखता है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: यहाँ उत्पत्ति 15:6 की प्रतिध्वनि के कारण ‘धार्मिकता’ अधिक स्वाभाविक और पारंपरिक है; ‘न्यायपरायणता’ इस संदर्भ में अर्थ को अनावश्यक रूप से नैतिक आचरण तक सीमित कर सकती है।
