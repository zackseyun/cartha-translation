  text: Phinehas our father[a], because he was zealous with zeal, received a covenant of holy priesthood.
translation:
  language: hi
  text: हमारे पूर्वज पीनहास[a] जब पूरे उत्साह से भर उठा, तब उसे पवित्र याजकपद की वाचा मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक अर्थ है, “पीनहास, हमारे पिता।” यहाँ “पिता” का अर्थ पूर्वज है। “जब” का अनुवाद “क्योंकि” भी किया जा सकता है। यूनानी में ‘उत्साह/जोश’ के लिए बल देने वाली सजातीय अभिव्यक्ति है।
    reason: ‘पिता’ के पूर्वजवाची आशय, ἐν τῷ + infinitive के संभावित कारणगत अर्थ, और ζηλῶσαι ζῆλον के बलाघाती प्रयोग को सुरक्षित रखना।
lexical_decisions:
- source_word: Φινεὲς
  choice: पीनहास
  rationale: बाइबलीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ὁ πατὴρ ἡμῶν
  choice: हमारे पूर्वज
  rationale: शाब्दिक अर्थ ‘हमारे पिता’ है, पर इस पूर्वज-सम्मान के प्रसंग में आधुनिक हिन्दी में ‘हमारे पूर्वज’ आशय को अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: जब बड़े उत्साह से काम किया
  rationale: क्रिया और सजातीय संज्ञा से बनी यूनानी बलाघाती अभिव्यक्ति को स्वाभाविक हिन्दी में तीव्रता सहित व्यक्त किया गया; इसका संभावित कालगत रूप ‘जब’ बनाए रखा गया है।
- source_word: ἔλαβε
  choice: मिली
  rationale: यहाँ वाचा प्रदान किए जाने का भाव है; हिन्दी में ‘उसे ... मिली’ सहज रूप से ‘उसने प्राप्त की’ का अर्थ देता है।
- source_word: διαθήκην
  choice: वाचा
  rationale: बाइबलीय और धर्मवैचारिक संदर्भ में διαθήκη का मानक हिन्दी समतुल्य।
- source_word: ἱερωσύνης ἁγίας
  choice: पवित्र याजकपद
  rationale: ‘याजकपद’ पुरोहितीय पद या व्यवस्था को संक्षेप और स्पष्टता से व्यक्त करता है; ἁγίας का अर्थ ‘पवित्र’ रखा गया है।
theological_decisions:
- issue: पीनहास के उत्साह और वाचा मिलने के बीच संबंध
  choice: मुख्य पाठ में ‘जब ... तब’ द्वारा कालगत संबंध रखा गया
  alternative: ‘क्योंकि उसने बड़े उत्साह से काम किया’ द्वारा स्पष्ट कारणगत संबंध
  rationale: ἐν τῷ + infinitive मूलतः कालगत निर्माण है, यद्यपि प्रसंग में कारणगत अर्थ भी संभव है। मुख्य पाठ में अस्पष्टता को अनावश्यक रूप से कारण तक सीमित नहीं किया गया; वैकल्पिक कारणगत अर्थ पाद-टिप्पणी में दिया गया है।
- issue: ζηλῶσαι ζῆλον की सजातीय पुनरुक्ति
  choice: ‘बड़े उत्साह से काम किया’
  alternative: अधिक शाब्दिक ‘उत्साह के साथ उत्साही हुआ’
  rationale: यूनानी बलाघात को ‘बड़े’ से सुरक्षित रखते हुए हिन्दी की अस्वाभाविक सजातीय पुनरुक्ति से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज शैली। ‘वाचा’, ‘पवित्र’ और ‘याजकपद’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं।
