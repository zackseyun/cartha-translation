lexical_decisions:
- source_word: ἀνταποδίδοτε ἀνταπόδομα
  choice: उनके किए का प्रतिफल दो
  rationale: क्रिया और उसी मूल से बने कर्म का संयुक्त प्रयोग बदले में वैसा ही फल देने पर बल देता है। सहज हिन्दी के लिए शब्दशः दोहराव के स्थान पर ‘उनके किए का प्रतिफल दो’ रखा गया है; इससे पारस्परिक अथवा दंडात्मक भाव बना रहता है, पर यूनानी से अधिक कठोर अर्थ नहीं जोड़ा जाता।
- source_word: τοῖς ἔθνεσιν
  choice: जातियों को
  rationale: यह पद आसपास की गैर-यहूदी जातियों अथवा राष्ट्रों को सूचित कर सकता है। ‘जातियों’ से मूल की व्यापक जातीय-राजनीतिक अर्थ-सीमा बनी रहती है; ‘अन्यजातियों’ से अर्थ अनावश्यक रूप से केवल धार्मिक पहचान तक सीमित हो सकता था।
- source_word: προσέχετε
  choice: ध्यान दो
  rationale: बहुवचन आज्ञार्थक क्रिया सावधानी से ध्यान देने का निर्देश देती है। ‘ध्यान दो’ आधुनिक और स्वाभाविक है तथा इसे सीधे ‘पालन करो’ में नहीं बदलता।
- source_word: προστάγματα
  choice: आज्ञाओं
  rationale: यह संज्ञा दिए गए आदेशों या निर्देशों को दर्शाती है। ‘आज्ञाओं’ में अपेक्षित अधिकारपूर्ण भाव स्पष्ट और सामान्य पाठक के लिए सुबोध है।
- source_word: τοῦ νόμου
  choice: व्यवस्था की
  rationale: यहाँ νόμος इस्राएल की वाचा-संबंधी तोराह को सूचित करता है। हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ इस संदर्भ को स्पष्ट और संक्षिप्त रूप से व्यक्त करती है।
theological_decisions:
- issue: τοῖς ἔθνεσιν का अर्थ ‘जातियाँ’ रखा जाए या ‘अन्यजातियाँ’
  choice: जातियों
  alternative: अन्यजातियों
  rationale: संघर्ष के इस संदर्भ में शब्द गैर-यहूदी लोगों के साथ-साथ जातीय-राजनीतिक समूहों का भाव भी रखता है। ‘जातियों’ मूल की व्यापकता को सुरक्षित रखता है।
- issue: ἀνταπόδομα को दंडात्मक ‘प्रतिशोध’ माना जाए या अपेक्षाकृत व्यापक ‘प्रतिफल’
  choice: प्रतिफल
  alternative: प्रतिशोध
  rationale: संदर्भ में दंडात्मक बदले की छाया संभव है, पर संज्ञा मूलतः प्रत्युत्तर में दिए गए फल या बदले को व्यक्त करती है। ‘प्रतिफल’ उस अर्थ-सीमा को बनाए रखता है; पादटिप्पणी सजातीय प्रयोग का बल स्पष्ट करती है।
