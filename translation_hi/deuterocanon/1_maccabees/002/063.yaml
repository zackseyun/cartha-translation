  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: hi
  text: आज वह ऊँचा उठाया जाएगा[a], और वह निश्चय ही नहीं पाया जाएगा, क्योंकि वह अपनी धूल में लौट गया है और उसका विचार नष्ट हो गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऊँचा उठाया जाएगा’ का अर्थ पद या प्रतिष्ठा में बढ़ाया जाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विचार’ का अनुवाद ‘योजना’, ‘सोच-विचार’ या ‘मंशा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: आज
  rationale: यह समय-सूचक क्रिया-विशेषण तात्कालिकता व्यक्त करता है; ‘आज’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἐπαρθήσεται
  choice: ऊँचा उठाया जाएगा
  rationale: ἐπαίρω के भविष्यत् कर्मवाच्य रूप में ऊँचाई का बिंब है और प्रसंग में पद या प्रतिष्ठा में बढ़ाए जाने का भाव भी हो सकता है; इस अनुवाद में दोनों संभावनाएँ खुली रहती हैं।
- source_word: οὐ μὴ εὑρεθῇ
  choice: निश्चय ही नहीं पाया जाएगा
  rationale: οὐ μή के साथ संभावनार्थक रूप प्रबल निषेध व्यक्त करता है; ‘निश्चय ही नहीं’ उसी बल को बनाए रखता है।
- source_word: ἐπέστρεψεν
  choice: लौट गया है
  rationale: यह मृत्यु में पूर्ण हो चुके लौटने को बताता है, जिसका परिणाम वर्तमान कथन से जुड़ा है।
- source_word: εἰς τὸν χοῦν αὐτοῦ
  choice: अपनी धूल में
  rationale: χοῦς का मूल अर्थ धूल या भुरभुरी मिट्टी है; यह रूप मनुष्य की नश्वरता और धूल में लौटने के बिंब को सुरक्षित रखता है।
- source_word: ὁ διαλογισμὸς αὐτοῦ
  choice: उसका विचार
  rationale: एकवचन संज्ञा विचार, मनन, तर्क या योजना को सूचित कर सकती है; ‘विचार’ इसकी व्यापकता और एकवचन दोनों बनाए रखता है।
- source_word: ἀπώλετο
  choice: नष्ट हो गया है
  rationale: यह क्रिया समाप्त हो जाने या मिट जाने की कठोर अंतिमता व्यक्त करती है; हिन्दी में ‘नष्ट हो गया है’ इसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: मृत्यु के समय διαλογισμός का मानवशास्त्रीय अर्थ
  choice: इसे ‘विचार’ कहा गया है।
  alternative: योजना, सोच-विचार, तर्क या मंशा
  rationale: यूनानी पाठ व्यक्ति के विचार या मनन के समाप्त होने की बात करता है; वह यहाँ ‘आत्मा’ शब्द का प्रयोग नहीं करता। इसलिए अनुवाद मृत्यु के बाद व्यक्ति या आत्मा की दशा के बारे में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘ऊँचा उठाया जाएगा’ मूल के स्थानिक बिंब और प्रतिष्ठा-संबंधी अर्थ दोनों को सुरक्षित रखता है; ‘विचार’ जानबूझकर व्यापक और एकवचन रखा गया है।
