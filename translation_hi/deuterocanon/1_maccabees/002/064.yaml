  text: And you, children, be strong and act like men in your law, because in it you will be glorified.
translation:
  language: hi
  text: और तुम, बच्चो, अपनी व्यवस्था में बलवान बनो और पुरुषों जैसा साहस दिखाओ[a], क्योंकि उसी में तुम महिमान्वित किए जाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “साहसी बनो।” यूनानी में शाब्दिक रूप से पुरुषवाची छवि है: “पुरुषों जैसा आचरण करो” या “अपने को पुरुष सिद्ध करो।”'
    reason: lexical_alternative
  - marker: b
    text: या “तुम सम्मानित किए जाओगे” अथवा “तुम महिमा पाओगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  choice: बच्चो
  rationale: यह व्यापक संबोधन ‘बच्चे/संतान’ है, केवल पुत्रों के लिए प्रयुक्त कोई विशेष शब्द नहीं। संबोधन कारक को स्वाभाविक हिन्दी ‘बच्चो’ से व्यक्त किया गया है।
- source_word: ἰσχύετε
  choice: बलवान बनो
  rationale: वर्तमान आज्ञार्थक शक्ति और दृढ़ता बनाए रखने का आह्वान करता है; ‘बलवान बनो’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀνδρίζεσθε
  choice: पुरुषों जैसा साहस दिखाओ
  rationale: क्रिया में पुरुष होने अथवा अपने को पुरुष सिद्ध करने की स्पष्ट पुरुषवाची छवि है और साथ ही साहस का भाव है। यह अनुवाद दोनों पक्षों को बनाए रखता है; केवल ‘साहसी बनो’ कहने से मूल की छवि मिट जाती।
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: अपनी व्यवस्था में
  rationale: ἐν यहाँ उस क्षेत्र को बताता है जिसमें उन्हें बल और साहस दिखाना है। ὑμῶν को ‘अपनी’ से स्पष्ट रखा गया है; ‘व्यवस्था’ पैतृक यहूदी विधान के अर्थ में उपयुक्त है।
- source_word: δοξασθήσεσθε
  choice: तुम महिमान्वित किए जाओगे
  rationale: भविष्यत् कर्मवाच्य को बनाए रखने से यह खुला रहता है कि महिमा देने वाला कौन है और यह महिमा किस प्रकार की है।
theological_decisions:
- issue: ἀνδρίζεσθε की पुरुषवाची छवि
  choice: पुरुषों जैसा साहस दिखाओ
  alternative: साहसी बनो
  rationale: मूल यूनानी में साहस के साथ स्पष्ट पुरुषवाची रूपक है। मुख्य पाठ में उसे बनाए रखा गया है, जबकि अधिक सामान्य अर्थ पादटिप्पणी में दिया गया है।
- issue: δοξασθήσεσθε का आशय और कर्ता
  choice: तुम महिमान्वित किए जाओगे
  alternative: तुम सम्मानित किए जाओगे; तुम महिमा पाओगे
  rationale: मूल पाठ न महिमा देने वाले को बताता है, न यह निश्चित करता है कि आशय सामाजिक सम्मान, परमेश्वर से मिलने वाली महिमा अथवा अंतिम प्रतिष्ठा है। कर्मवाच्य अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज आज्ञार्थक रूप अपनाया गया है। ‘व्यवस्था’ बाइबलीय विधान के लिए परिचित शब्द है। वाक्य-विन्यास में ‘अपनी व्यवस्था में’ को दोनों आज्ञाओं से जोड़ा गया है, और मूल के कर्मवाच्य तथा अस्पष्ट कर्ता को सुरक्षित रखा गया है।
