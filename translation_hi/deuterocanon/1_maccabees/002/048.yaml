    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβοντο
  choice: छुड़ाया
  rationale: मध्यवाच्य क्रिया यहाँ सहायता करते हुए शत्रु के अधिकार से निकालने का भाव रखती है; इसलिए ‘छुड़ाया’ सक्रिय उद्धार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ νόμου
  choice: व्यवस्था
  rationale: मक्काबियों के प्रसंग में νόμος यहूदी तोराह/धार्मिक व्यवस्था को सूचित करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित है।
- source_word: ἐκ χειρὸς
  choice: के हाथ से
  rationale: यह अनुवाद अधिकार या नियंत्रण के यूनानी रूपक को बनाए रखता है और हिन्दी में भी सहज है।
- source_word: τῶν ἐθνῶν
  choice: जाति-जाति के लोगों
  rationale: यह गैर-यहूदी राष्ट्रों/लोगों के बहुवचन भाव को व्यक्त करता है, बिना ‘अन्यजाति’ जैसे अधिक पारिभाषिक विकल्प पर निर्भर हुए।
- source_word: τῶν βασιλέων
  choice: राजाओं
  rationale: βασιλεῖς का सीधा और प्रसंगानुकूल अर्थ ‘राजा’ है।
- source_word: οὐκ ἔδωκαν κέρας
  choice: सींग उठाने नहीं दिया
  rationale: मूल के ‘सींग’ रूपक को सुरक्षित रखते हुए हिन्दी का स्वाभाविक बाइबलीय मुहावरा अपनाया गया है। इसमें शक्ति पाने या ऊँचा होने का आशय है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: τῷ ἁμαρτωλῷ
  choice: पापी को
  rationale: यह एकवचन संज्ञात्मक विशेषण का सीधा अनुवाद है और ‘दुष्ट’ की अपेक्षा मूल के पाप-संबंधी अर्थ को बनाए रखता है।
theological_decisions:
- issue: अंतिम खंड में ‘सींग’ का रूपक
  choice: मुख्य पाठ में ‘पापी को सींग उठाने नहीं दिया’
  alternative: पापी को शक्ति नहीं पाने दी / पापी को प्रबल नहीं होने दिया
  rationale: κέρας का बाइबलीय रूपक शक्ति और उत्कर्ष दोनों को सूचित कर सकता है। ‘सींग उठाने’ से चित्र और उसकी अर्थगत व्यापकता बची रहती है; पादटिप्पणी पाठक को इसका कार्यात्मक अर्थ बताती है।
