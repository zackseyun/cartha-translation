  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘के हाथ से’ और ‘सींग उठाने’ जैसे बाइबलीय पद मूल के धार्मिक तथा रूपकात्मक स्वर को बनाए रखते हैं।
