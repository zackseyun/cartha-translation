  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: hi
  text: और उसने कहा, “हाय! मैं क्यों जन्मा कि अपने लोगों का विनाश और पवित्र नगर का विनाश देखूँ, और उस समय वहाँ बैठा रहूँ जब पवित्र नगर को शत्रुओं के हाथ में और पवित्रस्थान को विदेशियों के हाथ में सौंप दिया गया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἴμοι
  choice: हाय!
  rationale: यह शोक और असहाय पीड़ा की सहज हिन्दी अभिव्यक्ति है; मूल विस्मयादिबोधक का भाव बनाए रखती है।
- source_word: ἵνα τί τοῦτο ἐγενήθην
  choice: मैं क्यों जन्मा
  rationale: विलाप के संदर्भ में γίνομαι का अर्थ ‘जन्म लेना/अस्तित्व में आना’ है; हिन्दी में यह भावपूर्ण और स्वाभाविक है।
- source_word: τὰ συντρίμματα τοῦ λαοῦ μου
  choice: अपने लोगों की तबाही
  rationale: बहुवचन συντρίμματα व्यापक टूटन और विनाश को दर्शाता है। ‘तबाही’ साधारण पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी बहुवचन की बारीकी बताती है।
- source_word: τὸ σύντριμμα τῆς πόλεως τῆς ἁγίας
  choice: पवित्र नगर का विध्वंस
  rationale: संज्ञा नगर की नष्ट और टूटी हुई दशा बताती है। ‘विध्वंस’ गंभीरता बनाए रखता है और किसी ऐसे नगर का नाम नहीं जोड़ता जो यूनानी पाठ में स्पष्ट रूप से नहीं दिया गया।
- source_word: καθίσαι ἐκεῖ
  choice: वहाँ बैठा रहूँ
  rationale: ठोस बैठने की छवि तथा विवश होकर बने रहने का भाव दोनों सुरक्षित रहते हैं।
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: जब वह ... सौंप दिया गया
  rationale: ἐν के साथ articular infinitive समकालीन परिस्थिति दर्शाता है। स्त्रीलिंग αὐτήν का संदर्भ पवित्र नगर है; हिन्दी में ‘वह’ इसी को इंगित करता है।
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: शत्रुओं के हाथ में
  rationale: मूल बाइबलीय मुहावरे की दृश्यात्मकता और किसी के अधिकार में दिए जाने का अर्थ दोनों बने रहते हैं।
- source_word: τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह नगर से अलग पवित्र परिसर या उपासना-स्थान को सूचित करता है; ‘पवित्रस्थान’ स्पष्ट और परंपरागत हिन्दी पद है।
- source_word: ἐν χειρὶ ἀλλοτρίων
  choice: विदेशियों के हाथ में
  rationale: ἀλλότριος यहाँ अपने समुदाय से बाहर के लोगों को दर्शाता है; ‘विदेशियों’ से राजनीतिक और धार्मिक परायेपन का प्रसंग स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: वाचाई और राष्ट्रीय पहचान वाले पदों का अनुवाद
  choice: ‘अपने लोगों’ और ‘पवित्र नगर’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘अपने राष्ट्र’ कहना या ‘यरूशलेम’ नाम स्पष्ट रूप से जोड़ना
  rationale: यूनानी पाठ स्वयं ‘मेरे लोग’ और ‘पवित्र नगर’ कहता है। इन्हें ज्यों का त्यों अर्थपूर्ण रूप में रखने से वाचाई भाव सुरक्षित रहता है और पाठ में अनुपस्थित पहचान नहीं जोड़ी जाती।
- issue: नगर और पवित्रस्थान को शत्रु-शक्ति के अधीन सौंपा जाना
  choice: ‘हाथ में सौंप दिया गया’ मुहावरा बनाए रखा गया
  alternative: ‘अधिकार में कर दिया गया’
  rationale: मूल की ‘हाथ में’ भाषा दैवी अनुमति, मानवीय पराजय या उत्तरदायित्व के संबंध को स्वयं स्पष्ट नहीं करती। मुहावरा बनाए रखने से यह धार्मिक तनाव अनावश्यक रूप से हल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विलाप-शैली रखी गई है। ‘हाय’, ‘तबाही’ और ‘बैठा रहूँ’ सामान्य पाठक के लिए सहज हैं, जबकि ‘पवित्र नगर’, ‘पवित्रस्थान’ और ‘हाथ में सौंपना’ मूल की धार्मिक तथा बाइबलीय भाषा को सुरक्षित रखते हैं।
