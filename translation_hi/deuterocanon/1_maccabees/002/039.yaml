translation:
  language: hi
  text: जब मत्तथियास और उसके मित्रों को इस बात का पता चला, तो उन्होंने उनके लिए बहुत शोक मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: पता चला
  rationale: यहाँ क्रिया का अओरिस्ट रूप पिछली घटना का समाचार मिलने या उससे अवगत होने को व्यक्त करता है; ‘पता चला’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से बताता है।
- source_word: οἱ φίλοι αὐτοῦ
  choice: उसके मित्रों
  rationale: φίλοι का सीधा अर्थ ‘मित्र’ है और यहाँ मत्तथियास के निकट सहयोगियों के लिए उपयुक्त है।
- source_word: ἐπένθησαν
  choice: शोक मनाया
  rationale: यह क्रिया मृत्यु के कारण शोक करने को दर्शाती है; पिछले प्रसंग में मारे गए लोगों के संदर्भ में यह स्पष्ट और स्वाभाविक है।
- source_word: ἐπʼ αὐτούς
  choice: उनके लिए
  rationale: शोकसूचक क्रिया के साथ ἐπί और कर्मकारक उन व्यक्तियों को सूचित करते हैं जिनके लिए शोक किया गया।
- source_word: ἕως σφόδρα
  choice: बहुत
  rationale: यह पद शोक की तीव्रता पर बल देता है। ‘बहुत’ सहज आधुनिक हिन्दी में प्रबल तीव्रता व्यक्त करता है, बिना अस्वाभाविक पुनरुक्ति के।
