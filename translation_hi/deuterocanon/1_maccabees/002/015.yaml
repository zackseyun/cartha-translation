translation:
  language: hi
  text: और राजा की ओर से आए लोग, जो धर्मत्याग के लिए विवश कर रहे थे, मोदीन आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: राजा के भेजे हुए अधिकारी
  rationale: इसका शाब्दिक अर्थ ‘राजा की ओर से आए लोग’ है। प्रसंग में ये राजकीय अधिकार से भेजे गए प्रतिनिधि हैं; ‘अधिकारी’ उनकी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट पद का अनुमान लगाए।
- source_word: καταναγκάζοντες
  choice: विवश कर रहे थे
  rationale: यह कृदन्त बलपूर्वक बाध्य करने या दबाव डालने का भाव रखता है। ‘विवश कर रहे थे’ निरंतर राजकीय दबाव और जबरदस्ती, दोनों को स्पष्ट करता है।
- source_word: τὴν ἀποστασίαν
  choice: धर्मत्याग के लिए
  rationale: मक्काबियों के इस प्रसंग में शब्द का आशय पैतृक यहूदी विश्वास और आचरण को छोड़ने से है। ‘धर्मत्याग’ धार्मिक अर्थ और यूनानी शब्द की गंभीरता बनाए रखता है। हिन्दी वाक्य-रचना के कारण कर्मवाचक संज्ञा को प्रयोजनसूचक ‘के लिए’ के साथ रखा गया है।
- source_word: εἰς Μωδεείν
  choice: मोदीन आए
  rationale: गति-सूचक क्रिया के साथ εἰς गंतव्य बताता है। Μωδεείν का सहज देवनागरी लिप्यंतरण ‘मोदीन’ है।
- source_word: Καὶ ἦλθον
  choice: और ... आए
  rationale: ‘और’ यूनानी कथात्मक संयोजक को बनाए रखता है और ‘आए’ घटना की सरल क्रमिक गति व्यक्त करता है।
theological_decisions:
- issue: उत्पीड़न के प्रसंग में ἀποστασία का अर्थ
  choice: धार्मिक अर्थ में ‘धर्मत्याग’
  alternative: राजनीतिक अर्थ में ‘विद्रोह’, अथवा सामान्य अर्थ में ‘पक्षत्याग’
  rationale: निकटवर्ती प्रसंग में लोगों को वाचा-संबंधी आचरण छोड़ने और गैर-यहूदी धार्मिक रीति अपनाने के लिए बाध्य किया जा रहा है। इसलिए धार्मिक अर्थ प्रधान है; अनुवाद राजनीतिक विद्रोह का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली। ‘राजा के भेजे हुए अधिकारी’ मूल वाक्यांश की प्रतिनिधिक भूमिका को सहज रूप देता है; ‘लोगों को’ हिन्दी में καταναγκάζοντες के निहित लक्ष्य को स्पष्ट करता है, यद्यपि यूनानी में उसका पृथक कर्म व्यक्त नहीं है।
