  yaml_path: translation/deuterocanon/1_maccabees/002/051.yaml
  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: hi
  text: हमारे पुरखों के कार्यों को याद करो, जो उन्होंने अपने-अपने समय में किए थे,[a] और महान गौरव तथा चिरस्थायी गौरव पाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “अपनी-अपनी पीढ़ियों में।”
    reason: यूनानी ταῖς γενεαῖς αὐτῶν के अधिक शाब्दिक रूप को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: μνήσθητε
  choice: याद करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया सक्रिय रूप से स्मरण करने का आह्वान करती है; ‘याद करो’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: τῶν πατέρων ἡμῶν
  choice: हमारे पुरखों के
  rationale: πατέρων का संकेत इस्राएल के पूर्वकालीन पितृ-पुरुषों की ओर है। ‘पुरखे’ स्रोत के पुरुषवाची और पारिवारिक भाव को रखते हुए आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: ἔργα
  choice: कामों
  rationale: यहाँ ἔργα उन उल्लेखनीय कार्यों को दर्शाता है जो पुरखों ने किए थे; ‘काम’ साधारण आधुनिक हिन्दी में ठोस कृत्यों का अर्थ स्पष्ट करता है।
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: अपने-अपने समय में
  rationale: यूनानी दत्तिव पदबंध का आशय उन अलग-अलग युगों या पीढ़ियों से है जिनमें पुरखे जीवित रहे। यह हिन्दी अभिव्यक्ति उस अर्थ को स्वाभाविक ढंग से व्यक्त करती है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: δέξασθε
  choice: पाओ
  rationale: δέχομαι का आज्ञार्थक रूप यहाँ किसी वस्तु के प्राप्त होने या उसे पाने का भाव देता है। ‘पाओ’ exhortation की संक्षिप्तता और स्वाभाविकता बनाए रखता है।
- source_word: δόξαν μεγάλην
  choice: महान गौरव
  rationale: δόξα यहाँ सम्मान, यश या गौरव का बोध कराता है। ‘महान गौरव’ ऊँचे भाव और सार्वजनिक सम्मान, दोनों को व्यक्त करता है।
- source_word: δόξαν αἰώνιον
  choice: चिरस्थायी गौरव
  rationale: दूसरी बार भी δόξα को ‘गौरव’ कहने से यूनानी की जानबूझकर की गई पुनरावृत्ति सुरक्षित रहती है; αἰώνιον के लिए ‘चिरस्थायी’ स्थायी और न मिटने वाले गौरव का भाव देता है।
theological_decisions:
- issue: πατέρων में पुरुषवाची पैतृक अभिव्यक्ति
  choice: हमारे पुरखे
  alternative: हमारे पूर्वज
  rationale: ‘पुरखे’ यूनानी पुरुषवाची पारिवारिक पद का भाव अधिक स्पष्ट रूप से रखता है और इस्राएल के विश्वासयोग्य पितृ-पुरुषों की ओर संकेत करता है, बिना संदर्भ में कोई अतिरिक्त सिद्धान्त जोड़े।
- issue: δόξα की दोनों आवृत्तियों का अनुवाद
  choice: महान गौरव तथा चिरस्थायी गौरव
  alternative: महान महिमा तथा अनन्त महिमा
  rationale: संदर्भ में δόξα का अर्थ सम्मान या यश के निकट है। दोनों बार ‘गौरव’ रखने से मूल की पुनरावृत्ति और वक्तृत्वगत बल सुरक्षित रहता है; ‘चिरस्थायी’ αἰώνιον को समयगत स्थायित्व के अर्थ में रखता है, बिना उसे चुपचाप केवल परलोक-संबंधी अर्थ देने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरखे’ और ‘गौरव’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल यूनानी की पैतृक भाषा और δόξα की पुनरावृत्ति भी बनी रहती है।
