  rationale: संदर्भ में सामुदायिक और धार्मिक यहूदी पहचान प्रमुख जान पड़ती है, पर भौगोलिक ‘यहूदियाई’ अर्थ की वास्तविक lexical संभावना पादटिप्पणी में सुरक्षित रखी गई है।
