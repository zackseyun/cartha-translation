  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
translation:
  language: hi
  text: जैसे ही उसने ये बातें कहना समाप्त किया, एक यहूदी पुरुष[a] सबके सामने आगे आया, ताकि वह राजा की आज्ञा के अनुसार मोदीन में वेदी पर बलि चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहूदी पुरुष” का अनुवाद “एक यहूदी” या “यहूदिया का एक पुरुष” भी हो सकता है। यूनानी शब्द Ἰουδαῖος यहूदी पहचान या यहूदिया से संबंध—दोनों का बोध करा सकता है; यहाँ संदर्भ में व्यापक यहूदी पहचान अधिक संभावित है।
    reason: lexical_alternative
