- source_word: ἀνὴρ Ἰουδαῖος
  choice: एक यहूदी पुरुष
  rationale: यह रूप ἀνήρ के पुरुषवाचक एकवचन और Ἰουδαῖος की यहूदी पहचान—दोनों को बनाए रखता है।
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: सबके देखते-देखते
  rationale: यूनानी मुहावरे की सार्वजनिक दृश्यता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θυσιάσαι ἐπὶ τοῦ βωμοῦ
  choice: वेदी पर बलि चढ़ाए
  rationale: प्रयोजनसूचक infinitive और उपासना-संबंधी बलिदान का भाव स्पष्ट रहता है।
- source_word: ἐν Μωδεείμ
  choice: मोदीन में
  rationale: स्थाननाम Μωδεείμ का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: राजा की आज्ञा के अनुसार
  rationale: πρόσταγμα की आधिकारिक राजकीय आज्ञा का सीधा और गरिमापूर्ण अनुवाद है।
