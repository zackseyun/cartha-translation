  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सहज, पर गरिमापूर्ण। ‘प्रबल उत्साह दिखाते हुए’ मूल की तीव्रता और परिस्थितिजन्य संबंध को रखता है, जबकि ‘मानो’ यूनानी की जानबूझकर छोड़ी गई तुलनात्मक छाया को सुरक्षित करता है।
