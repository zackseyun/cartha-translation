lexical_decisions:
- source_word: Ἠλίας
  choice: एलियाह
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: प्रबल उत्साह दिखाते हुए
  rationale: ἐν के साथ क्रियार्थक संज्ञा परिस्थिति या अवसर व्यक्त करती है; हिन्दी कृदन्त इस संबंध को बिना निश्चित कारणात्मक अर्थ दिए स्वाभाविक ढंग से रखता है। सजातीय क्रिया और संज्ञा से आए बल को ‘प्रबल’ व्यक्त करता है।
- source_word: νόμου
  choice: व्यवस्था के लिए
  rationale: मक्काबियों के प्रसंग में νόμος यहूदी व्यवस्था अर्थात तोराह को सूचित करता है; ‘व्यवस्था’ प्रचलित और स्पष्ट हिन्दी बाइबलीय शब्द है।
- source_word: ἀνελήμφθη
  choice: उठा लिया गया
  rationale: अओरिस्ट कर्मवाच्य और ऊपर की ओर ले जाए जाने—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: मानो स्वर्ग में
  rationale: ὡς की तुलनात्मक अथवा वर्णनात्मक छाया को ‘मानो’ से स्पष्ट रखा गया है और εἰς की गंतव्य-दिशा ‘स्वर्ग में’ से व्यक्त हुई है।
theological_decisions:
- issue: एलियाह के उठाए जाने के वर्णन में ὡς को स्पष्ट रूप से रखना
  choice: ‘मानो स्वर्ग में’
  alternative: ‘स्वर्ग में’
  rationale: यूनानी पाठ में εἰς τὸν οὐρανόν से पहले ὡς है। ‘मानो’ उसे सुरक्षित रखता है और मूल कथन की वास्तविक अस्पष्टता को अधिक निश्चित धार्मिक दावे में नहीं बदलता।
