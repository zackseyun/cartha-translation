  yaml_path: translation/deuterocanon/1_maccabees/002/025.yaml
  text: And he killed the king’s man who was compelling them to sacrifice at that time[a], and he tore down the altar,
translation:
  language: hi
  text: और उसी समय उसने राजा के उस आदमी[a] को मार डाला, जो लोगों को बलि चढ़ाने के लिए मजबूर कर रहा था, और वेदी ढा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘राजा का आदमी’; इससे संभवतः राजा का कोई अधिकारी या प्रतिनिधि अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: राजा के उस आदमी
  rationale: ἄνδρα का सीधा अर्थ ‘आदमी’ है और τοῦ βασιλέως उसे राजा से संबद्ध बताता है। यह अभिव्यक्ति यूनानी की सीधी भाषा को बनाए रखती है और अधिकारी या प्रतिनिधि होने की संभावना को पाद-टिप्पणी में स्पष्ट करती है।
- source_word: τὸν ἀναγκάζοντα
  choice: जो लोगों को ... मजबूर कर रहा था
  rationale: ἀναγκάζω में बाध्य करने या विवश करने का प्रबल भाव है। यूनानी में कर्म व्यक्त नहीं है; कथा-संदर्भ के आधार पर हिन्दी में स्वाभाविकता के लिए ‘लोगों को’ जोड़ा गया है।
- source_word: θύειν
  choice: बलि चढ़ाने के लिए
  rationale: बलिदान-संबंधी संदर्भ में θύω का अर्थ बलि अर्पित करना है; ‘बलि चढ़ाना’ वर्तमान मानक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: ἀποκτείνω सीधे किसी की हत्या करने को दर्शाता है। ‘मार डाला’ स्पष्ट, आधुनिक और प्रसंगानुकूल है।
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: उसी समय
  rationale: यह काल-सूचक पद है और उसमें हल्का बल भी है; ‘उसी समय’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν βωμὸν
  choice: वेदी
  rationale: βωμός बलि चढ़ाने की वेदी के लिए सामान्य शब्द है; ‘वेदी’ इसका सटीक और प्रचलित हिन्दी समकक्ष है।
- source_word: καθεῖλεν
  choice: ढा दी
  rationale: καθαιρέω यहाँ किसी निर्मित वस्तु को नीचे गिराने या ध्वस्त करने का अर्थ देता है। ‘ढा दी’ क्रिया की तीव्रता को व्यक्त करती है, पर पूर्ण विनाश का अनावश्यक दावा नहीं करती।
theological_decisions:
- issue: ‘बलि चढ़ाने के लिए मजबूर कर रहा था’ में निहित कर्म
  choice: लोगों को
  alternative: उन्हें; किसी को; कर्म को अव्यक्त रखना
  rationale: यूनानी में ἀναγκάζοντα के साथ बाध्य किए जा रहे व्यक्तियों का स्पष्ट उल्लेख नहीं है। निकटवर्ती कथा-संदर्भ स्थानीय लोगों पर बलि चढ़ाने के लिए डाले गए दबाव की ओर संकेत करता है। ‘लोगों को’ हिन्दी में वाक्य को स्वाभाविक बनाता है और इसे किसी एक व्यक्ति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘राजा का आदमी’ मूल की ठोस किंतु पद की दृष्टि से अस्पष्ट अभिव्यक्ति को सुरक्षित रखता है; संभावित प्रशासनिक अर्थ पाद-टिप्पणी में दिया गया है।
