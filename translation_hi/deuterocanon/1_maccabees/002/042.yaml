  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: hi
  text: तब हसीदियों[a] का एक दल उनके पास आ जुटा, जो इस्राएल में से एक सामर्थी दल था; उसमें हर व्यक्ति व्यवस्था के प्रति स्वेच्छा से समर्पित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हसीदी’ के लिए ‘हसीदीम’ या ‘असीदी’ भी कहा जाता है। यह व्यवस्था के प्रति उत्साह से जुड़ा एक नामित यहूदी समूह था।
    reason: समूह के लिप्यंतरित ऐतिहासिक नाम के प्रचलित वैकल्पिक रूप और संक्षिप्त पहचान देना।
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: उनके पास आ जुटा
  rationale: यह पदबंध उस पहले से उपस्थित समूह की ओर आने और उससे जुड़ने का भाव रखता है। ‘आ जुटा’ सामूहिक गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे औपचारिक भर्ती मानने के।
- source_word: συναγωγὴ
  choice: एक दल
  rationale: यहाँ अर्थ एकत्र हुए लोगों के समूह का है। ‘दल’ सहज हिन्दी है और बाद के धार्मिक अर्थ में ‘आराधनालय’ या औपचारिक ‘मण्डली’ का अनावश्यक संकेत नहीं देता।
- source_word: Ἀσιδαίων
  choice: हसीदियों
  rationale: यह किसी विशिष्ट ऐतिहासिक यहूदी समूह का नाम है, इसलिए इसे ‘धर्मनिष्ठ लोग’ जैसे वर्णनात्मक अनुवाद से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: ἰσχυρὰ δυνάμει
  choice: एक शक्तिशाली समूह
  rationale: यूनानी में बल का जोरदार, कुछ हद तक पुनरुक्तिपूर्ण वर्णन है। ‘शक्तिशाली’ उसके मुख्य बलाघात को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἀπὸ Ἰσραήλ
  choice: इस्राएल में से आया
  rationale: ἀπό स्रोत या उद्गम दर्शाता है। यह अनुवाद उस मूल भाव को बनाए रखता है और वाक्य को केवल स्वामित्वसूचक ‘इस्राएल का’ नहीं बनाता।
- source_word: πᾶς ὁ ἑκουσιαζόμενος τῷ νόμῳ
  choice: जिसमें हर व्यक्ति व्यवस्था के प्रति स्वेच्छा से समर्पित था
  rationale: कृदन्त इच्छापूर्वक और स्वतंत्र रूप से प्रतिबद्ध होने का भाव देता है। ‘स्वेच्छा से समर्पित’ व्यक्तिगत तत्परता और व्यवस्था के प्रति निष्ठा दोनों व्यक्त करता है, पर सैनिक भाव नहीं जोड़ता।
theological_decisions:
- issue: Ἀσιδαίων को समूह के नाम या गुणसूचक वर्णन के रूप में प्रस्तुत करना
  choice: हसीदियों
  alternative: धर्मनिष्ठ लोगों
  rationale: पद में यह ऐतिहासिक समूह-संज्ञा के रूप में कार्य करता है। लिप्यंतरण उसकी विशिष्ट पहचान को सुरक्षित रखता है और नाम को केवल एक नैतिक गुण में नहीं बदलता।
- issue: ἑκουσιαζόμενος τῷ νόμῳ की प्रतिबद्धता का स्वरूप
  choice: व्यवस्था के प्रति स्वेच्छा से समर्पित
  alternative: व्यवस्था के लिए स्वयंसेवक बना
  rationale: मूल में स्वेच्छापूर्ण निष्ठा स्पष्ट है, लेकिन अनिवार्य रूप से औपचारिक या सैनिक स्वयंसेवा नहीं। चुना हुआ रूप इसी खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। सामूहिक कर्ता ‘दल’ के अनुसार एकवचन क्रिया का प्रयोग हुआ है। ‘व्यवस्था’ मूसा की व्यवस्था को सूचित करती है, पर मूल यूनानी में अक्षर-भेद न होने के कारण कोई अतिरिक्त मुद्रणगत विशिष्टता नहीं जोड़ी गई।
