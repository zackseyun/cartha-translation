translation:
  language: hi
  text: और तुम व्यवस्था का पालन करनेवाले सभी लोगों को अपने पास इकट्ठा कर लो[a], और अपने लोगों के लिए बदला लो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “व्यवस्था के सब कर्ताओं को।” यूनानी अभिव्यक्ति का अर्थ व्यवस्था को करने या उसका पालन करनेवाले लोग है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘बदला लेना’ के लिए एक ही मूल की क्रिया और संज्ञा साथ आई हैं; यह रचना अपने लोगों के लिए बदला लेने की आज्ञा पर विशेष बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: अपने पास इकट्ठा कर लो
  rationale: यह पदबंध लोगों को अपने साथ या अपने दल में लाने का भाव व्यक्त करता है। यह हिन्दी में स्वाभाविक है और समर्थकों को अपने पास जुटाने का अर्थ बनाए रखता है।
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: व्यवस्था का पालन करनेवाले सब लोग
  rationale: यहाँ ποιητάς का अर्थ व्यवस्था को बनानेवाले नहीं, बल्कि उसे करने या आचरण में लानेवाले हैं। ‘पालन करनेवाले’ सक्रिय आज्ञापालन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: बदला लो
  rationale: यूनानी में एक ही मूल के क्रिया और संज्ञा का प्रयोग आदेश को बल देता है। ‘बदला लो’ संक्षिप्त, स्वाभाविक और प्रभावशाली हिन्दी है; मूल की बलवत्ता पादटिप्पणी में स्पष्ट की गई है।
- source_word: τοῦ λαοῦ ὑμῶν
  choice: अपने लोगों का
  rationale: संज्ञा के साथ आया यूनानी संबंधकारक उन लोगों की ओर से या उनके साथ हुए अन्याय के कारण प्रतिशोध लेने का भाव देता है। ‘अपने लोगों का बदला लो’ हिन्दी में इसी अर्थ का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: मक्काबी यहूदी संदर्भ में νόμος का अनुवाद
  choice: व्यवस्था
  alternative: तोरा
  rationale: इस संदर्भ में νόμος से पैतृक यहूदी व्यवस्था का बोध होता है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है और स्रोत में निहित बात से अधिक विशिष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘पालन करनेवाले’ साधारण पाठक के लिए स्पष्ट है, जबकि पादटिप्पणियाँ यूनानी की अधिक शाब्दिक अभिव्यक्ति और प्रतिशोध वाले सजातीय पदबंध की तीव्रता सुरक्षित रखती हैं।
