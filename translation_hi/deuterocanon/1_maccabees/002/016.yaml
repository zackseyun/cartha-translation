  text: to the city[a], so that they might offer sacrifice. And many from Israel came over to them[b], and Mattathias and his sons were gathered together.
translation:
  language: hi
  text: नगर की ओर[a], ताकि वे बलि चढ़ाएँ। इस्राएल में से बहुत-से लोग उनके पास आ गए[b], और मत्तथियास और उसके पुत्र इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी पाठ यहाँ बीच वाक्य से आरम्भ होता है; ‘नगर की ओर’ पिछले उपवाक्य को आगे बढ़ाता है और अपने आप में पूरा वाक्य नहीं है।
    reason: textual_variant
  - marker: b
    text: या, “उनसे जा मिले” अथवा “उनकी ओर चले गए।” यूनानी में शाब्दिक अर्थ “उनके पास/उनकी ओर आए” है, जो इस प्रसंग में उनका पक्ष लेने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν πόλιν
  choice: नगर में
  rationale: यह कर्मकारक पद पिछले वाक्य से चली आ रही गति की क्रिया का गंतव्य है। हिन्दी में नगर की ओर आकर प्रवेश करने के भाव के साथ ‘नगर में’ स्वाभाविक है; उपलब्ध यूनानी अंश बीच वाक्य से आरम्भ होता है, इसलिए पहले की क्रिया को मन से नहीं जोड़ा गया।
- source_word: ἵνα θυσιάσωσιν
  choice: ताकि वे बलि चढ़ाएँ
  rationale: ἵνα के साथ विधिलिंग प्रयोजन व्यक्त करता है। ‘बलि चढ़ाएँ’ θυσιάζω के धार्मिक-कर्मकांड संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: इस्राएल में से बहुत-से लोग
  rationale: ἀπό उद्गम अथवा समुदाय से संबंध दिखाता है। यह रूप यूनानी संरचना के निकट रहते हुए स्पष्ट हिन्दी देता है।
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: उनके पास आ गए
  rationale: προσέρχομαι और πρός व्यक्तियों की ओर आने का भाव देते हैं। प्रसंग में उनके पक्ष में जाने का संकेत संभव है, पर मुख्य पाठ में ‘उनसे जा मिले’ कहने से अधिक स्पष्ट निष्ठा जोड़ दी जाती; इसलिए मूल की अर्थगत खुलावट रखी गई है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: इस निष्क्रिय/मध्य रूप में एकत्र होने या एकत्र किए जाने का भाव हो सकता है। ‘इकट्ठे हुए’ हिन्दी में स्वाभाविक है और कर्ता का अनुमान लगाए बिना सामूहिक एकत्रता व्यक्त करता है।
theological_decisions:
- issue: πρὸς αὐτοὺς προσῆλθαν में राजनीतिक-धार्मिक पक्ष ग्रहण करने का संकेत
  choice: ‘उनके पास आ गए’ रखा गया।
  alternative: ‘उनसे जा मिले’ या ‘उनके पक्ष में हो गए’
  rationale: बलि चढ़ाने के प्रसंग में राजा के अधिकारियों से जा मिलने का आशय संभव है, किन्तु यूनानी क्रिया सीधे तौर पर केवल उनकी ओर आने को कहती है। अनुवाद संभावित पक्ष-ग्रहण को निर्णायक न बनाकर कथानक का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बलि चढ़ाएँ’ प्रचलित धार्मिक पदावली है। आरम्भिक वाक्यांश को जानबूझकर खंडित ही रखा गया है, क्योंकि प्रदत्त यूनानी साक्ष्य बीच वाक्य से शुरू होता है।
