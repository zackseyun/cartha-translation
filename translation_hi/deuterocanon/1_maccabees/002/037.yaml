base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/037.yaml
  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: hi
  text: वे कह रहे थे, “हम सब अपनी निर्दोषता[a] में मर जाएँ। आकाश और पृथ्वी हमारे विषय में तुम्हारे विरुद्ध गवाही देते हैं कि तुम बिना न्याय किए[b] हमारा नाश कर रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी सरलता में,” “अपनी निष्कपटता में”; यूनानी शब्द सरलता या एकनिष्ठता भी व्यक्त कर सकता है, पर यहाँ संभवतः दोषरहित निर्दोषता का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “बिना निर्णय के” या “बिना जाँच के”; अर्थात उचित सुनवाई या न्याय के बिना।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान कृदन्त उद्धृत वचन का परिचय देता है; हिन्दी में प्रसंगानुकूल और स्वाभाविक निरंतर क्रिया से इसे व्यक्त किया गया है।
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: हम सब ... मर जाएँ
  rationale: प्रथम पुरुष बहुवचन अओरिस्ट सब्जंक्टिव का आग्रहसूचक भाव है; ‘मर जाएँ’ सामूहिक संकल्प को व्यक्त करता है और οἱ πάντες का बल ‘हम सब’ में बना रहता है।
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: अपनी निर्दोषता में
  rationale: ἁπλότης का मूल अर्थ सरलता, निष्कपटता या एकनिष्ठता हो सकता है; यहाँ अहिंसक और दोषरहित दशा में मृत्यु स्वीकार करने के प्रसंग में ‘निर्दोषता’ प्रमुख नैतिक आशय व्यक्त करती है।
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: हमारे विषय में तुम्हारे विरुद्ध गवाही देते हैं
  rationale: ἐπί के प्रयोग में संदर्भ या प्रतिकूल साक्ष्य—दोनों की छाया संभव है। आक्रमणकारियों को सीधे संबोधित करने के प्रसंग में हिन्दी वाक्य गवाही का उनके विरुद्ध होना और पीड़ितों से उसका संबंध दोनों स्पष्ट रखता है।
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: आकाश और पृथ्वी
  rationale: यह बाइबलीय साक्षी-सूत्र का स्वाभाविक हिन्दी रूप है। यूनानी में संयुक्त कर्ता के साथ क्रिया एकवचन है, पर हिन्दी में बहुवचन ‘गवाही देते हैं’ स्वाभाविक है।
- source_word: ἀκρίτως
  choice: बिना न्याय किए
  rationale: यह केवल सामान्य अन्याय नहीं, बल्कि निर्णय, जाँच या उचित न्याय के अभाव को भी सूचित करता है; यह रूप उस विधिक सूक्ष्मता को मुख्य पाठ में बनाए रखता है।
- source_word: ἀπόλλυτε
  choice: नाश कर रहे हो
  rationale: वर्तमानकालीन प्रत्यक्ष संबोधन सुरक्षित है। ‘नाश’ क्रिया के व्यापक अर्थ को रखता है, जबकि प्रसंग में इसका तात्पर्य जान से मारना है।
theological_decisions:
- issue: ἁπλότης का शहादत-संदर्भ में अर्थ
  choice: नैतिक निर्दोषता
  alternative: सरलता, निष्कपटता, एकनिष्ठता
  rationale: वक्ता केवल सरल स्वभाव का दावा नहीं कर रहे, बल्कि यह कह रहे हैं कि वे दोषरहित रहते हुए मारे जा रहे हैं। फिर भी मूल शब्द की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: μαρτυρεῖ ἐφʼ ἡμᾶς में गवाही की दिशा
  choice: हमारे विषय में तुम्हारे विरुद्ध गवाही
  alternative: हमारे पक्ष में गवाही; हमारे विषय में गवाही
  rationale: ἐφʼ ἡμᾶς व्याकरणतः संदर्भ या दिशा की कुछ अस्पष्टता रखता है। प्रत्यक्ष संबोधन और अन्यायपूर्ण विनाश के आरोप के कारण गवाही आक्रमणकारियों के विरुद्ध समझी गई है, जबकि ‘हमारे विषय में’ संबंध भी बनाए रखता है।
- issue: ἀκρίτως का बल
  choice: बिना न्याय किए
  alternative: अन्याय से; बिना मुकदमे के; बिना जाँच के
  rationale: 'इससे विधिक और नैतिक दोनों तनाव बने रहते हैं: उनका विनाश उचित निर्णय या परीक्षण के बिना हो रहा है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मर जाएँ’ सामूहिक दृढ़ संकल्प व्यक्त करता है; ‘बिना न्याय किए’ मूल यूनानी की न्यायिक सूक्ष्मता को सहज हिन्दी में सुरक्षित रखता है।
