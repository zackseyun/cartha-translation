base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: hi
  text: तब राजा के लोगों और उन सैन्य-दलों को, जो दाऊद के नगर, यरूशलेम में थे, यह सूचना दी गई कि जो पुरुष राजा की आज्ञा के कारण तितर-बितर हो गए थे,[a] वे उतरकर निर्जन प्रदेश के छिपे हुए स्थानों में चले गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पुरुष राजा की आज्ञा की अवहेलना करके निर्जन प्रदेश के छिपने के स्थानों में उतर गए थे।” यूनानी वाक्यांश संक्षिप्त और असामान्य है; इसका आशय आज्ञा के कारण तितर-बितर होना या आज्ञा की अवहेलना करना—दोनों में से कोई हो सकता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: यह सूचना दी गई
  rationale: यूनानी कर्मवाच्य सूचना दिए जाने का संकेत देता है; यह हिंदी में स्वाभाविक और मूल के अनिर्दिष्ट कर्ता के अनुरूप है।
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: राजा के लोगों को
  rationale: ἄνδρες का मूल अर्थ ‘लोग/पुरुष’ है। प्रसंग में ये राजकीय कर्मचारी या सैनिक हो सकते हैं, पर मूल किसी विशिष्ट पद को निश्चित नहीं करता।
- source_word: ταῖς δυνάμεσιν
  choice: सैन्य-दलों को
  rationale: सैन्य प्रसंग में δυνάμεις सशस्त्र बलों को दर्शाता है; बहुवचन को बनाए रखते हुए यह हिंदी में स्पष्ट है।
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: दाऊद के नगर यरूशलेम में
  rationale: यह यरूशलेम और ‘दाऊद का नगर’ के सामानाधिकरण संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κατέβησαν
  choice: उतरकर … चले गए थे
  rationale: καταβαίνω की नीचे जाने की स्थानिक धारणा को ‘उतरकर’ बनाए रखता है; भूतपूर्व रूप सूचना दिए जाने से पहले की घटना दिखाता है।
- source_word: διεσκέδασαν
  choice: तितर-बितर हो गए थे
  rationale: διασκεδάζω का सामान्य अर्थ बिखरना या तितर-बितर होना है। यूनानी में ‘राजा की आज्ञा’ कर्म के रूप में आने से वाक्य संक्षिप्त और कठिन है; मुख्य पाठ शाब्दिक अर्थ-केंद्र को सुरक्षित रखता है।
- source_word: τὴν ἐντολὴν τοῦ βασιλέως
  choice: राजा की आज्ञा
  rationale: ἐντολή का सीधा और प्रतिष्ठित हिंदी पर्याय ‘आज्ञा’ है।
- source_word: εἰς τοὺς κρυφοὺς
  choice: छिपे हुए स्थानों में
  rationale: विशेषण के संज्ञावत प्रयोग को स्थानों के अर्थ में स्पष्ट करता है, बिना उन्हें गुफाएँ या कोई अन्य विशिष्ट आश्रय मानने के।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश के
  rationale: ἔρημος केवल रेतीले मरुस्थल तक सीमित नहीं है; ‘निर्जन प्रदेश’ उसके व्यापक भू-दृश्य को व्यक्त करता है।
theological_decisions:
- issue: διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως की व्याख्या
  choice: पुरुष राजा की आज्ञा के कारण तितर-बितर हुए
  alternative: पुरुषों ने राजा की आज्ञा की अवहेलना की
  rationale: क्रिया सामान्यतः बिखरने या तितर-बितर करने का अर्थ देती है, किंतु ‘राजा की आज्ञा’ को उसका सीधा कर्म बनाने पर यूनानी वाक्यांश असामान्य है। मुख्य पाठ क्रिया के सामान्य अर्थ को रखता है और संबंध को कारण के रूप में व्यक्त करता है; अवज्ञा वाला संभावित अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘राजा के लोग’ मूल की व्यापकता रखता है, ‘सैन्य-दल’ सैन्य संदर्भ स्पष्ट करता है, और कठिन यूनानी वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
