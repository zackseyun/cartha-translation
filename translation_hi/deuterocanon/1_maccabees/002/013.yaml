lexical_decisions:
- source_word: ἵνα τί
  choice: क्यों
  rationale: कोइने यूनानी में ἵνα τί यहाँ उद्देश्य पूछने वाला शाब्दिक पदबंध नहीं, बल्कि विलापपूर्ण प्रश्नसूचक मुहावरा है; हिंदी में ‘क्यों’ इसका स्वाभाविक रूप है।
- source_word: ἡμῖν
  choice: हम
  rationale: दत्तिव ἡμῖν, ζῇν के साथ शाब्दिक रूप से ‘हमारे लिए जीना’ जैसा है; सहज आधुनिक हिंदी में कर्ता ‘हम’ द्वारा यही अर्थ व्यक्त होता है।
- source_word: ἔτι
  choice: अब भी
  rationale: ἔτι जीवन की निरंतरता को सूचित करता है। ‘अब भी’ वर्तमान परिस्थिति में आगे जीवित रहने की विलापपूर्ण भावना बनाए रखता है।
- source_word: ζῇν
  choice: जीवित रहें
  rationale: वर्तमान अनंत क्रिया ζῇν का अर्थ ‘जीना/जीवित रहना’ है। प्रश्न के विचारात्मक भाव के कारण हिंदी में ‘जीवित रहें’ स्वाभाविक और गरिमापूर्ण है।
