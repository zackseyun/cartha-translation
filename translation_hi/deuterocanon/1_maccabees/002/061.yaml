  yaml_path: translation/deuterocanon/1_maccabees/002/061.yaml
  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: hi
  text: और इस प्रकार पीढ़ी-दर-पीढ़ी विचार करो[a] कि जितने लोग उस पर आशा रखते हैं, वे निर्बल न होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समझ लो’ अथवा ‘मन में बसा लो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘कमज़ोर न पड़ेंगे’; यूनानी का व्यापक अर्थ ‘असफल न होंगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: विचार करो
  rationale: यह बहुवचन आज्ञार्थक रूप है और इस प्रसंग में इस्राएल के इतिहास पर मन लगाकर उससे निष्कर्ष ग्रहण करने का आह्वान करता है। ‘विचार करो’ exhortational force और चिंतन—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ γενεὰν
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह अभिव्यक्ति successive generations के व्यापक ऐतिहासिक अनुभव की ओर संकेत करती है। ‘पीढ़ी-दर-पीढ़ी’ संक्षिप्त, स्वाभाविक और मूल के वितरणात्मक भाव के निकट है।
- source_word: ἐλπίζοντες
  choice: आशा रखते हैं
  rationale: ἐλπίζω का सीधा अर्थ आशा करना है; यहाँ परमेश्वर पर भरोसे से भरी आशा अभिप्रेत है। ‘आशा रखते हैं’ धार्मिक संदर्भ में स्वाभाविक है और इसे केवल ‘भरोसा’ कहकर अर्थ-सरणि को संकुचित नहीं करता।
- source_word: ἐπʼ αὐτόν
  choice: उस पर
  rationale: ἐλπίζω के साथ ἐπί का भाव आशा का किसी पर टिकना है। हिन्दी में ‘उस पर आशा रखना’ मूल की संरचना और आश्रय के भाव को सुरक्षित रखता है; सर्वनाम को स्पष्टतः ‘परमेश्वर’ में बदलकर मूल की अंतर्निहितता नहीं मिटाई गई।
- source_word: ἀσθενήσουσιν
  choice: निर्बल न होंगे
  rationale: ἀσθενέω का मूल अर्थ निर्बल होना या पड़ना है। ‘निर्बल न होंगे’ भविष्यकाल को स्पष्ट रखता है और ‘असफल न होंगे’ जैसे अधिक व्यापक अर्थ को मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: αὐτόν (‘उस’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उस’ रखा गया है; प्रसंग में इसका निहित संदर्भ परमेश्वर है।
  alternative: सर्वनाम के स्थान पर सीधे ‘परमेश्वर’ कहना।
  rationale: आस-पास का प्रसंग पूर्वजों के प्रति परमेश्वर की विश्वासयोग्यता को स्मरण कराता है, इसलिए संदर्भ परमेश्वर है; फिर भी यूनानी पाठ सर्वनाम रखता है, अतः अनुवाद भी उसकी अंतर्निहितता सुरक्षित रखता है।
- issue: ἀσθενήσουσιν की अर्थ-व्याप्ति
  choice: ‘निर्बल न होंगे’
  alternative: ‘असफल न होंगे’ या ‘हार न मानेंगे।’
  rationale: मूल क्रिया पहले शारीरिक या सामर्थ्यगत निर्बलता व्यक्त करती है, यद्यपि प्रसंग में इसका व्यापक अर्थ विफल न होना भी हो सकता है। मुख्य पाठ निकट अर्थ रखता है और व्यापक संभावना पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘पीढ़ी-दर-पीढ़ी’ सामान्य पाठक के लिए सहज है। ‘निर्बल’ प्रसंग की गंभीरता के अनुकूल है, जबकि अधिक बोलचाल का विकल्प पादटिप्पणी में दिया गया है।
