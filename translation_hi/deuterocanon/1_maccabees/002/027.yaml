  yaml_path: translation/deuterocanon/1_maccabees/002/027.yaml
  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: hi
  text: और मत्तथियास ने नगर में ऊँचे स्वर से पुकारा, “जो कोई व्यवस्था के लिए उत्साही है और वाचा को निभाता है, वह मेरे पीछे बाहर निकल आए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: पुकारकर कहा
  rationale: यह क्रिया जोरदार सार्वजनिक पुकार को व्यक्त करती है; ‘पुकारकर कहा’ हिन्दी में कथन की भूमिका भी स्वाभाविक रूप से जोड़ता है।
- source_word: ἐν τῇ πόλει
  choice: नगर में
  rationale: यह सीधा स्थानवाचक अनुवाद है; ‘नगर’ dignified modern Hindi में πόλις का स्वाभाविक समतुल्य है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी पदबंध की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: जो कोई व्यवस्था के लिए उत्साही है
  rationale: ‘जो कोई’ सार्वभौमिक आह्वान को व्यक्त करता है, और ‘उत्साही’ ζηλῶν की प्रबल निष्ठा को बनाए रखता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: यहाँ इसका संकेत यहूदी तोराह/ईश्वरीय व्यवस्था की ओर है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट और परिचित है।
- source_word: ἱστῶν διαθήκην
  choice: वाचा पर दृढ़ रहता है
  rationale: संदर्भ में ἵστημι नई वाचा स्थापित करने के बजाय वाचा के प्रति कायम रहने और उसे थामे रखने का भाव देता है।
- source_word: διαθήκην
  choice: वाचा
  rationale: यह इस्राएल और परमेश्वर के वाचागत संबंध का धर्मवैज्ञानिक भार सुरक्षित रखता है।
- source_word: ἐξελθέτω ὀπίσω μου
  choice: वह मेरे पीछे बाहर निकल आए
  rationale: यह ἐξελθέτω के वास्तविक बाहर निकलने और ὀπίσω μου के ‘मेरे पीछे’—दोनों तत्वों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: διαθήκη का वाचागत यहूदी संदर्भ
  choice: वाचा
  alternative: करार
  rationale: ‘वाचा’ इस्राएल और परमेश्वर के संबंध से जुड़े धर्मवैज्ञानिक अर्थ को बनाए रखता है और हिन्दी बाइबलीय भाषा में स्थापित है।
- issue: ἱστῶν διαθήκην का अर्थ
  choice: वाचा पर दृढ़ रहता है
  alternative: वाचा को स्थापित करता है
  rationale: यहाँ आह्वान पहले से विद्यमान वाचा के प्रति निष्ठावान बने रहने का है, नई वाचा आरम्भ करने का नहीं; फिर भी अनुवाद सक्रिय दृढ़ता का भाव रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में सार्वजनिक उद्घोषणा की तीव्रता और नगर से सचमुच बाहर निकलने का कथात्मक संकेत दोनों सुरक्षित रखे गए हैं।
