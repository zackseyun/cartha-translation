  to: और मत्तथियास ने नगर में ऊँचे स्वर से पुकारा, “जो कोई व्यवस्था के लिए उत्साही है और वाचा को निभाता है, वह मेरे पीछे बाहर निकल आए।”
  rationale: The revision preserves the Greek wording and narrative movement while making the Hindi proclamation more direct and idiomatic. It retains the physical sense of ‘बाहर निकल आए,’ the relational direction ‘मेरे पीछे,’ and the established biblical terms ‘व्यवस्था’ and ‘वाचा.’
