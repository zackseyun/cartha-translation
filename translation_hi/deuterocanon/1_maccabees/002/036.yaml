  yaml_path: translation/deuterocanon/1_maccabees/002/036.yaml
  text: And they did not answer them[a], nor did they hurl a stone at them, nor did they block up the hiding places,
translation:
  language: hi
  text: और उन्होंने उन्हें कोई उत्तर नहीं दिया, न उन पर एक भी पत्थर फेंका, और न छिपने की जगहों[a] को बंद किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छिपे हुए स्थानों’ अथवा ‘गुप्त स्थानों।’ यूनानी अभिव्यक्ति संभवतः व्यक्तियों के बजाय उन स्थानों को सूचित करती है जहाँ लोग छिप सकते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: कोई उत्तर नहीं दिया
  rationale: यह यूनानी क्रिया के सामान्य अर्थ ‘उत्तर देना’ को स्वाभाविक हिन्दी में व्यक्त करता है; नकारात्मक वाक्य में ‘कोई’ सहज बल देता है।
- source_word: λίθον
  choice: एक भी पत्थर
  rationale: यूनानी में एकवचन संज्ञा है। हिन्दी के नकारात्मक वाक्य में ‘एक भी पत्थर’ मूल एकवचन को बनाए रखते हुए स्वाभाविक अभिव्यक्ति है।
- source_word: ἐνετίναξαν
  choice: फेंका
  rationale: क्रिया बलपूर्वक फेंकने की कार्रवाई बताती है। इस प्रसंग में ‘पत्थर फेंका’ स्पष्ट, वर्तमान और सहज हिन्दी है।
- source_word: ἐνέφραξαν
  choice: बंद किया
  rationale: इस क्रिया का अर्थ रोकना, बंद करना या अवरुद्ध करना है। छिपने की जगहों के संदर्भ में ‘बंद किया’ सामान्य पाठक के लिए स्पष्ट है और अर्थ को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: τοὺς κρυφούς
  choice: छिपने की जगहों
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और छिपे अथवा गुप्त स्थानों की ओर संकेत करता है। प्रसंगानुसार ‘छिपने की जगहें’ स्वाभाविक स्थानवाचक अर्थ देता है।
