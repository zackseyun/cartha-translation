  yaml_path: translation/deuterocanon/1_maccabees/002/017.yaml
  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: hi
  text: राजा की ओर से आए लोगों[a] ने मत्तथियाह को उत्तर दिया और कहा, “तुम इस नगर में शासक, सम्मानित और महान हो, और तुम्हें अपने पुत्रों और भाइयों का दृढ़ सहारा प्राप्त है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् राजा के प्रतिनिधि; शाब्दिक रूप से, “राजा की ओर से आए लोग।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम अपने पुत्रों और भाइयों के कारण दृढ़ता से प्रतिष्ठित हो।” यूनानी वाक्यांश पारिवारिक समर्थन अथवा परिवार के द्वारा दृढ़ हुई सामाजिक प्रतिष्ठा—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: राजा की ओर से आए लोग
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘राजा की ओर से लोग’ है और प्रसंग में ये राजा के प्रतिनिधि हैं। यह अनुवाद उनके राजकीय संबंध और आगमन, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: उत्तर दिया और कहा
  rationale: दोनों क्रियाओं को रखकर मूल की सामी-प्रभावित कथात्मक अभिव्यक्ति सुरक्षित रखी गई है, यद्यपि हिन्दी में कुछ पुनरुक्ति अनुभव होती है।
- source_word: Ἄρχων
  choice: शासक
  rationale: यह शब्द अधिकार और स्थानीय प्रतिष्ठा रखने वाले व्यक्ति को सूचित करता है। ‘शासक’ इसके प्रबल अर्थ को बनाए रखता है।
- source_word: ἔνδοξος
  choice: सम्मानित
  rationale: इस सामाजिक प्रसंग में शब्द सार्वजनिक प्रतिष्ठा और आदर का बोध कराता है; ‘महिमामय’ यहाँ अनावश्यक रूप से धार्मिक या अतिरंजित सुनाई देता।
- source_word: μέγας
  choice: महान
  rationale: यह मत्तथियाह के ऊँचे कद और महत्त्व को व्यक्त करता है तथा संबोधन की प्रशंसात्मक, ऊँची शैली बनाए रखता है।
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: इस नगर में
  rationale: πόλις का मानक अर्थ ‘नगर’ है; आधुनिक हिन्दी में यह ‘शहर’ की अपेक्षा अधिक गरिमापूर्ण और प्राचीन कथात्मक प्रसंग के अनुकूल है।
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: तुम्हें अपने पुत्रों और भाइयों का दृढ़ सहारा प्राप्त है
  rationale: कृदंत स्थिर किए जाने, समर्थित होने या दृढ़ प्रतिष्ठा पाने का अर्थ दे सकता है। पारिवारिक पदबंध के साथ ‘दृढ़ सहारा’ सम्भावित सामाजिक समर्थन को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
