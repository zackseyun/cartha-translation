  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: hi
  text: वे उनके साथ आ मिले और उनके लिए सहारा बने[a]। उन्होंने एक सैन्य दल संगठित किया और अपने क्रोध में पापियों को, और अपने प्रचण्ड रोष में व्यवस्था-विहीन पुरुषों को मार गिराया। शेष लोग बचने के लिए जातियों की ओर भाग गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उनके साथ जोड़ दिए गए और उनके लिए सहारा बने।” यूनानी क्रिया का अधिक शाब्दिक अर्थ है, “उनमें जोड़े गए”; प्रसंग में इसका अर्थ किसी समूह के साथ आ मिलना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जातियों की ओर।” यहाँ ‘जातियों’ का आशय संभवतः आसपास के गैर-यहूदी लोगों से, अथवा उनके प्रदेशों से, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: उनके साथ आ मिले
  rationale: निष्क्रिय क्रिया का भाव किसी समूह में सम्मिलित या उससे जुड़ जाने का है। यह हिन्दी में स्वाभाविक है और समूह में वृद्धि का संकेत बनाए रखता है।
- source_word: εἰς στήριγμα
  choice: उनका सहारा
  rationale: στήριγμα दृढ़ता देने वाले सहारे को दर्शाता है; ‘सहारा’ ठोस अर्थ रखता है, पर अनावश्यक रूप से इसे सैन्य दुर्ग नहीं बनाता।
- source_word: συνεστήσαντο δύναμιν
  choice: एक सैन्य दल संगठित किया
  rationale: संदर्भ में δύναμις संगठित लड़ाकू शक्ति है। ‘सैन्य दल’ प्रसंग स्पष्ट करता है, जबकि ‘सेना’ संभवतः आकार और औपचारिकता को अधिक बढ़ा देता।
- source_word: ἐπάταξαν
  choice: मार गिराया
  rationale: क्रिया प्रहार करके धराशायी करने का प्रबल, और युद्ध-संदर्भ में संभवतः घातक, अर्थ देती है। ‘मार गिराया’ उस हिंसक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἁμαρτωλούς
  choice: पापियों
  rationale: मूल का नैतिक-धार्मिक मूल्यांकन सीधे रखा गया है; इसे केवल राजनीतिक ‘अपराधियों’ में नहीं बदला गया।
- source_word: ἐν ὀργῇ αὐτῶν
  choice: अपने क्रोध में
  rationale: ὀργή के लिए ‘क्रोध’ रखा गया है, ताकि अगले समानांतर θυμός के अधिक तीव्र भाव से अंतर बना रहे।
- source_word: ἄνδρας ἀνόμους
  choice: व्यवस्था-विरोधी पुरुषों
  rationale: ἄνδρας स्पष्टतः पुरुषवाचक है और ἀνόμους ईश्वरीय/सामुदायिक व्यवस्था के उल्लंघन का भाव देता है। ‘व्यवस्था-विरोधी’ केवल आधुनिक राज्य-कानून तक अर्थ सीमित नहीं करता।
- source_word: ἐν θυμῷ αὐτῶν
  choice: अपने प्रचण्ड रोष में
  rationale: θυμός उग्र आवेश या रोष बताता है। ‘प्रचण्ड रोष’ पहले खंड के ‘क्रोध’ से समानांतरता और तीव्रता दोनों रखता है।
- source_word: οἱ λοιποί
  choice: शेष लोग
  rationale: यह मारे गए लोगों के विपरीत बचे हुए समूह को सरलता से दर्शाता है।
- source_word: εἰς τὰ ἔθνη
  choice: अन्यजातियों के क्षेत्रों में
  rationale: मक्काबी यहूदी संदर्भ में ἔθνη आसपास के गैर-यहूदी लोगों तथा उनके क्षेत्रों की ओर संकेत कर सकता है। यह चयन हिन्दी पाठक के लिए गंतव्य स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: σωθῆναι
  choice: अपनी जान बचाने के लिए
  rationale: गति-सूचक क्रिया के बाद यह उद्देश्य बताता है—बच निकलना या सुरक्षा पाना। प्रसंग में ‘अपनी जान बचाने के लिए’ स्वाभाविक हिन्दी है, बिना किसी विशेष धार्मिक उद्धार-अर्थ को आरोपित किए।
theological_decisions:
- issue: सैन्य संघर्ष में नैतिक विशेषण
  choice: ‘पापियों’ और ‘व्यवस्था-विरोधी पुरुषों’ को पाठ के अपने मूल्यांकन के रूप में बनाए रखा गया।
  alternative: ‘अपराधियों और विद्रोहियों’ अथवा ‘दुष्टों’ जैसे मुख्यतः राजनीतिक या सामान्य नैतिक शब्द
  rationale: यूनानी पाठ संघर्ष को स्पष्ट नैतिक-धार्मिक श्रेणियों में प्रस्तुत करता है। अनुवाद को इस दृष्टिकोण को नरम या तटस्थ नहीं करना चाहिए।
- issue: ἄνδρας का लिंग
  choice: ‘पुरुषों’
  alternative: ‘लोगों’
  rationale: मूल में स्पष्ट पुरुषवाचक संज्ञा है; इसलिए जहाँ आशय पुरुषों का है वहाँ लिंग को सामान्यीकृत नहीं किया गया।
- issue: σωθῆναι में बचाव का स्वरूप
  choice: 'संदर्भगत शारीरिक सुरक्षा: ‘अपनी जान बचाने के लिए’'
  alternative: धार्मिक अर्थ वाला ‘उद्धार पाने के लिए’ या अधिक औपचारिक ‘बचाए जाने के लिए’
  rationale: भागने की क्रिया और सैन्य प्रसंग तत्काल सुरक्षा/जीवन-रक्षा का संकेत देते हैं; यहाँ धार्मिक उद्धार का विशिष्ट अर्थ जोड़ना उचित नहीं।
