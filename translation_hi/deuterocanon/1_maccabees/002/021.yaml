translation:
  language: hi
  text: हमसे यह कदापि न हो कि हम व्यवस्था और विधियों को छोड़ दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: हमसे यह कदापि न हो
  rationale: यह यूनानी मुहावरा किसी कार्य का दृढ़तापूर्वक निषेध व्यक्त करता है। यह हिन्दी रूप उसके शाब्दिक दया-संबंधी अर्थ के बजाय प्रसंग में अभिप्रेत तीव्र अस्वीकृति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καταλεῖπειν
  choice: छोड़ दें
  rationale: यहाँ इसका अर्थ व्यवस्था के प्रति निष्ठा त्याग देना है। ‘छोड़ दें’ सरल, आधुनिक और प्रसंगानुकूल है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: यह इस्राएल की पहचानी हुई वाचा-संबंधी व्यवस्था की ओर संकेत करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ इस अर्थ को स्वाभाविक रूप से वहन करती है।
- source_word: δικαιώματα
  choice: विधियों
  rationale: बहुवचन शब्द निर्धारित नियमों अथवा विधानों को सूचित करता है। ‘विधियाँ’ कानूनी-वाचाई भाव बनाए रखता है और इसे केवल अनुष्ठानिक नियमों तक सीमित नहीं करता।
theological_decisions:
- issue: νόμον καὶ δικαιώματα का वाचाई आशय
  choice: व्यवस्था और विधियों
  alternative: व्यवस्था और नियमों
  rationale: यह युग्म पैतृक यहूदी व्यवस्था के प्रति निष्ठा को व्यक्त करता है। ‘विधियों’ मूल के निर्धारित विधानों के भाव को बनाए रखता है, बिना बाद की धार्मिक श्रेणियाँ आरोपित किए।
- issue: ἵλεως ἡμῖν में दया-संबंधी शाब्दिकता और मुहावरेदार निषेध
  choice: मुहावरेदार दृढ़ निषेध—‘हमसे यह कदापि न हो’
  alternative: ‘परमेश्वर हम पर दया करे कि हम...’ जैसा अधिक शाब्दिक रूप
  rationale: इस रचना में प्रमुख संप्रेषित बल किसी काम की तीव्र अस्वीकृति है। चुना हुआ रूप उसी बल को सुरक्षित रखता है और अस्पष्ट धार्मिक कर्ता को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘कदापि’ दृढ़ अस्वीकृति का भाव देता है; वाक्य सामान्य पाठक के लिए स्पष्ट रहते हुए बाइबलीय गंभीरता बनाए रखता है।
