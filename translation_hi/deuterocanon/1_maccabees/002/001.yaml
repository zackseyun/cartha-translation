  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: hi
  text: उन दिनों शिमोन के पोते और योहन के पुत्र मत्तथियास उठ खड़े हुए। वे योआरीब के वंश के एक याजक थे; वे यरूशलेम से उठ खड़े हुए और मोदीन में बस गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: उठ खड़े हुए
  rationale: क्रिया के मूल अर्थ और कथात्मक बल को बनाए रखता है; इसे केवल ‘आए’ बनाकर कमजोर नहीं करता।
- source_word: ἱερεὺς τῶν υἱῶν Ἰωαρίβ
  choice: योआरीब के वंश के एक याजक
  rationale: ‘पुत्रों’ का यहाँ वंश अथवा याजकीय कुल के अर्थ में स्वाभाविक हिन्दी रूप है।
- source_word: ἀπὸ Ἱερουσαλήμ
  choice: यरूशलेम के रहनेवाले
  rationale: ἀπό व्यक्ति की उत्पत्ति या संबद्धता बता सकता है; निकटवर्ती καὶ ἐκάθισεν के साथ इसे ‘यरूशलेम से उठकर’ कहना भी सम्भव है, पर यह रूप मत्तथियास की पहचान को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκάθισεν ἐν Μωδεείν
  choice: जाकर मोदीन में बस गए
  rationale: καθίζω यहाँ निवास स्थापित करने के अर्थ में है; ‘बैठ गए’ अपेक्षित आशय नहीं देगा।
