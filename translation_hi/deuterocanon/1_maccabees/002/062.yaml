    reason: lexical_alternative
lexical_decisions:
- source_word: λόγου
  choice: बात
  rationale: यहाँ λόγος उस पापी पुरुष के कथन या वचन को दर्शाता है। ‘बात’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के आशय को किसी विशेष प्रकार की ‘धमकी’ तक सीमित नहीं करती।
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: किसी पापी पुरुष की
  rationale: ἀνήρ पुल्लिंग एकवचन है; इसलिए ‘पुरुष’ स्रोत की लैंगिक विशिष्टता बनाए रखता है। ἁμαρτωλός के लिए ‘पापी’ संक्षिप्त और स्वाभाविक है।
- source_word: μὴ φοβηθῆτε
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: δόξα
  choice: महिमा
  rationale: δόξα सम्मान, यश या वैभव को दर्शा सकता है। ‘महिमा’ पद की ऊँची और यहाँ विडंबनापूर्ण ध्वनि को बनाए रखती है।
- source_word: εἰς κόπρια
  choice: खाद के लिए
  rationale: εἰς को ‘के लिए’ देकर यूनानी की असामान्य किंतु तीखी अभिव्यक्ति बनाए रखी गई है। κόπρια मल अथवा गोबर से बनी खाद को सूचित करता है; ‘खाद’ हिन्दी में स्पष्ट है, यद्यपि अपेक्षाकृत कम कठोर।
- source_word: καὶ εἰς σκώληκας
  choice: और कीड़ों के लिए
  rationale: σκώληκες सड़न से जुड़े कृमियों या कीड़ों को दर्शाता है। ‘कीड़े’ व्यापक अर्थ और मृत्यु-सड़न की छवि दोनों बनाए रखता है।
theological_decisions:
- issue: ἀνήρ को सामान्य व्यक्ति मानना या विशिष्ट पुल्लिंग रूप में रखना
  choice: 'विशिष्ट पुल्लिंग: ‘पुरुष’'
  alternative: व्यक्ति
  rationale: स्रोत में ἀνδρός है, ἄνθρωπος नहीं; अतः अनावश्यक रूप से लिंग-निरपेक्ष किए बिना पुल्लिंग एकवचन रखा गया है।
- issue: अंतिम उपवाक्य की अपमान और सड़न की ठोस छवि
  choice: ‘उसकी महिमा खाद और कीड़ों के लिए है’
  alternative: ‘उसकी महिमा खाद और कीड़ों में समाप्त होती है’
  rationale: चुना गया रूप εἰς ... καὶ εἰς ... को निकटता से रखता और स्रोत की कठोर छवि को नरम नहीं करता। वैकल्पिक रूप परिणाम का आशय अधिक स्वाभाविक हिन्दी में स्पष्ट करता है, पर ‘समाप्त होती है’ स्रोत में प्रत्यक्ष क्रिया नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सीधा रूप अपनाया गया है। ‘मत डरो’ सामान्य पाठक के लिए सहज है। अंतिम वाक्यांश की कुछ असामान्य बनावट यूनानी की तीखी और संक्षिप्त अभिव्यक्ति को सुरक्षित रखने के लिए जानबूझकर रखी गई है।
