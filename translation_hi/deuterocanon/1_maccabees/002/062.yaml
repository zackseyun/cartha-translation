  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: hi
  text: और किसी पापी पुरुष की बात से मत डरो[a], क्योंकि उसकी महिमा का अंत खाद और कीड़ों में होता है।
  philosophy: optimal-equivalence
  footnotes:
