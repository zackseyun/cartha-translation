  yaml_path: translation/deuterocanon/1_maccabees/002/045.yaml
  text: And Mattathias and his sons went around and tore down their altars,
translation:
  language: hi
  text: और मत्तथियास और उसके बेटे चारों ओर घूमे और उन्होंने उनकी वेदियाँ ढा दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: चारों ओर गए
  rationale: क्रिया का मूल भाव चारों ओर जाने या विभिन्न स्थानों में घूमने का है। प्रसंग में यह किसी सैन्य घेराबंदी के बजाय क्षेत्र में घूम-घूमकर कार्रवाई करने को व्यक्त करता है। यूनानी में क्रिया एकवचन है, पर संयुक्त कर्ता के कारण स्वाभाविक हिन्दी में बहुवचन रखा गया है।
- source_word: καθεῖλον
  choice: ढा दीं
  rationale: यह क्रिया किसी निर्मित वस्तु को गिरा देने या ध्वस्त करने को दर्शाती है। वेदियों के लिए ‘ढा दीं’ सटीक, सजीव और स्वाभाविक हिन्दी है।
- source_word: βωμοὺς
  choice: वेदियाँ
  rationale: βωμός का सीधा अर्थ बलि या उपासना की वेदी है। ‘ऊँचे स्थान’ कहना स्रोत में निहित न होने वाला अलग धार्मिक पद जोड़ देता।
- source_word: αὐτῶν
  choice: उनकी
  rationale: सर्वनाम का संभावित संकेत प्रसंग में पहले बताए गए विरोधियों या धर्मत्यागियों की ओर है। ‘उनकी’ उसके संबंध को बनाए रखता है, पर उसके संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: Ματταθίας
  choice: मत्तथियास
  rationale: यूनानी नाम का देवनागरी में निकट और हिन्दी-पाठक के लिए उच्चारणयोग्य लिप्यंतरण।
theological_decisions:
- issue: ढाई गई उपासना-संरचनाओं का धार्मिक संदर्भ
  choice: विरोधी या मूर्तिपूजक पक्ष से जुड़ी ‘उनकी वेदियाँ’
  alternative: सामान्य रूप से सभी वेदियाँ
  rationale: संबंधवाचक सर्वनाम और निकटवर्ती कथानक संकेत देते हैं कि बात समस्त वेदियों की नहीं, बल्कि पहले उल्लिखित पक्ष से संबंधित वेदियों की है। अनुवाद ‘उनकी वेदियाँ’ कहकर इस संकेत और उसकी कुछ संदर्भगत अस्पष्टता—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य के आरंभ में ‘और’ रखकर यूनानी καί की कथात्मक निरंतरता सुरक्षित की गई है। कोई पादटिप्पणी आवश्यक नहीं है।
