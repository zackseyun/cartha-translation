  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘निर्जन प्रदेश’ सामान्य पाठक के लिए स्पष्ट है और यूनानी ἔρημος की भौगोलिक व्यापकता बनाए रखता है।
