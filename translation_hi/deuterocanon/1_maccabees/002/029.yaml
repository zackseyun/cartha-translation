    text: या, “न्याय और निर्णय।” यूनानी में δικαιοσύνην और κρίμα साथ आए हैं; उनके अर्थ कुछ हद तक एक-दूसरे से मिलते हैं, फिर भी संभवतः वे दो संबंधित आदर्शों को व्यक्त करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथा के क्रम में अगले घटनाक्रम को चिह्नित करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: κατέβησαν
  choice: उतर गए
  rationale: यूनानी क्रिया में नीचे की ओर जाने का भाव स्पष्ट है; इसलिए केवल ‘गए’ कहकर उसे हटाया नहीं गया।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह बहुसंख्या को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ζητοῦντες
  choice: खोज करनेवाले
  rationale: वर्तमान कृदंत इन लोगों की निरंतर अभिलाषा या विशेषता को दर्शाता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक सच्चाई और परमेश्वर के प्रति निष्ठा का भाव रख सकता है; साथ आए κρίμα से इसका भेद बनाए रखने के लिए ‘धार्मिकता’ चुना गया।
- source_word: καὶ κρίμα
  choice: और न्याय
  rationale: κρίμα का अर्थ ‘निर्णय’ भी हो सकता है, पर इस युग्म में ‘न्याय’ नैतिक-न्यायिक आदर्श को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὴν ἔρημον
  choice: निर्जन प्रदेश में
  rationale: ἔρημος किसी उजाड़ या आबादी-रहित क्षेत्र को दर्शाता है; ‘निर्जन प्रदेश’ केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: καθίσαι ἐκεῖ
  choice: वहाँ बसने के लिए
  rationale: यहाँ क्रिया का अर्थ शाब्दिक रूप से बैठना नहीं, बल्कि निवास स्थापित करना है।
theological_decisions:
- issue: ऐतिहासिक-वाचा-संबंधी प्रसंग में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ‘धार्मिकता’ नैतिक और वाचा-संबंधी निष्ठा का व्यापक भाव सुरक्षित रखती है, जबकि अगले शब्द κρίμα को ‘न्याय’ कहना दोनों संबंधित आदर्शों को पूरी तरह एक नहीं होने देता।
- issue: δικαιοσύνην καὶ κρίμα की संभावित अर्थ-समानता
  choice: धार्मिकता और न्याय
  alternative: न्यायपरायणता और उचित निर्णय
  rationale: मुख्य पाठ में संक्षिप्त और गरिमापूर्ण युग्म रखा गया है; पादटिप्पणी κρίμα के वैकल्पिक ‘निर्णय’ अर्थ और दोनों शब्दों के अर्थगत आच्छादन को सुरक्षित रखती है।
