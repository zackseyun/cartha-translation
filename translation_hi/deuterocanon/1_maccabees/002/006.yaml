lexical_decisions:
- source_word: ἰδών
  choice: जब उसने ... देखा
  rationale: ὁράω का अओरिस्ट कृदन्त अगले पद में आने वाली प्रतिक्रिया से जुड़ा है। आधुनिक हिन्दी में कालगत सम्बन्ध को स्वाभाविक ढंग से व्यक्त करने के लिए ‘जब उसने ... देखा’ चुना गया है।
- source_word: βλασφημίας
  choice: परमेश्वर-विरोधी कामों
  rationale: यह बहुवचन संज्ञा यहाँ परमेश्वर और पवित्र वस्तुओं के विरुद्ध किए जा रहे निन्दात्मक तथा अपवित्र कृत्यों को सूचित करती है। केवल वाणी का आभास देने वाले ‘निन्दा के वचनों’ की अपेक्षा यह प्रसंगानुकूल और सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὰς γινομένας
  choice: हो रहे
  rationale: वर्तमान कृदन्त इन कृत्यों के जारी रहने या घटित होने को व्यक्त करता है। ‘हो रहे’ यूनानी की व्यापकता को बनाए रखता है और ‘किए जा रहे’ की तुलना में कर्तृवाच्य को कम निर्धारित करता है।
- source_word: ἐν Ἰούδᾳ
  choice: यहूदा में
  rationale: स्थान-नाम का पारम्परिक बाइबलीय रूप ‘यहूदा’ यूनानी Ἰούδα के निकट है और बाद के रोमी प्रशासनिक नाम का अनावश्यक संकेत नहीं देता।
- source_word: ἐν Ἱερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: βλασφημίας का धार्मिक आशय
  choice: परमेश्वर-विरोधी कामों
  alternative: ईशनिन्दाओं; पवित्रता-भंग के कामों
  rationale: मूल शब्द के धार्मिक अपराध का भार बनाए रखते हुए इसे केवल बोले गए अपशब्दों तक सीमित नहीं किया गया। प्रसंग में अपवित्रीकरण के कृत्य सम्मिलित हैं, पर ‘पवित्रता-भंग’ चुनना यूनानी शब्द को जरूरत से अधिक संकीर्ण कर देता।
translation_notes:
  register: वाक्य अगले कथन या क्रिया से जुड़ने वाला आश्रित उपवाक्य है, इसलिए अन्त में अल्पविराम रखा गया है। भाषा आधुनिक, सहज और गरिमापूर्ण है; ‘परमेश्वर-विरोधी’ धार्मिक अर्थ स्पष्ट करता है, जबकि ‘कामों’ कृत्यों की व्यापकता बनाए रखता है।
