  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: hi
  text: और वह एक सौ छियालीसवें वर्ष[a] में मर गया। उसके पुत्रों ने उसे मोदीन में उसके पूर्वजों की कब्रों में दफनाया, और सारे इस्राएल ने उसके लिए बहुत शोक मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सम्भवतः सेल्यूसिड युग का एक सौ छियालीसवाँ वर्ष।
    reason: सांस्कृतिक-ऐतिहासिक टिप्पणी
lexical_decisions:
- source_word: ἀπέθανεν
  choice: मर गया
  rationale: यूनानी क्रिया मृत्यु का सीधा कथन करती है; यह सहज और स्पष्ट हिन्दी है तथा अनावश्यक शिष्टोक्ति से बचती है।
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: एक सौ छियालीसवें वर्ष में
  rationale: यह यूनानी काल-निर्देश के क्रमसूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔθαψαν
  choice: दफनाया
  rationale: यह शव को कब्र में रखने के लिए सामान्य और सटीक आधुनिक हिन्दी क्रिया है।
- source_word: τάφοις πατέρων αὐτοῦ
  choice: उसके पुरखाओं की कब्रों में
  rationale: ‘पुरखाओं’ से पारिवारिक-वंशगत आशय सुरक्षित रहता है और ‘कब्रों’ से τάφοις का बहुवचन स्पष्ट होता है।
- source_word: Μωδεείν
  choice: मोदीन
  rationale: यूनानी स्थान-नाम का हिन्दी में प्रचलित और सुबोध लिप्यंतरण।
- source_word: ἐκόψαντο
  choice: शोक मनाया
  rationale: क्रिया विलाप अथवा शोक-संबंधी आचरण का संकेत दे सकती है; ‘शोक मनाया’ अर्थ को स्पष्ट रखता है, पर किसी खास शारीरिक क्रिया को अनावश्यक रूप से नहीं जोड़ता।
- source_word: κοπετὸν μέγαν
  choice: बहुत शोक
  rationale: सजातीय कर्म द्वारा व्यक्त तीव्रता को स्वाभाविक हिन्दी में ‘बहुत’ से व्यक्त किया गया है।
- source_word: πᾶς Ἰσραήλ
  choice: सारे इस्राएल
  rationale: यह लोगों के सामूहिक समुदाय को सूचित करने वाली अभिव्यक्ति का सीधा और सहज रूप है।
theological_decisions:
- issue: कालगणना-सूत्र का संदर्भ
  choice: मुख्य पाठ में केवल ‘एक सौ छियालीसवें वर्ष’ रखा गया है।
  alternative: ‘सेल्यूसिड युग के एक सौ छियालीसवें वर्ष’
  rationale: यूनानी मूल में युग का नाम नहीं दिया गया। ऐतिहासिक रूप से सेल्यूसिड युग सम्भावित है, इसलिए उसे मुख्य पाठ में जोड़ने के बजाय पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास को हिन्दी की स्वाभाविकता के अनुसार विभाजित किया गया है, जबकि घटनाक्रम, बहुवचन ‘कब्रों’ और शोक की तीव्रता सुरक्षित रखी गई है।
