lexical_decisions:
- source_word: ηὐλόγησεν
  choice: आशीर्वाद दिया
  rationale: यहाँ εὐλογέω का भूतकालीन रूप मत्तथियाह द्वारा उपस्थित लोगों को आशीर्वाद देने को व्यक्त करता है। ‘आशीर्वाद दिया’ स्वाभाविक और प्रसंगानुकूल हिन्दी है।
- source_word: προσετέθη
  choice: मिला दिया गया
  rationale: προστίθημι का निष्क्रिय रूप मूलतः ‘जोड़ दिया गया’ है। मृत्यु-सूचक पारंपरिक अभिव्यक्ति में ‘मिला दिया गया’ स्रोत की निष्क्रिय रचना और उसके भाव, दोनों को बनाए रखता है।
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: अपने पुरखाओं में
  rationale: यह पूर्वजों के साथ मृत्यु में सम्मिलित होने की पारंपरिक बाइबलीय अभिव्यक्ति है। ‘पुरखाओं’ से पारिवारिक पूर्वजों का भाव बना रहता है, जबकि ‘में’ के साथ हिन्दी में सम्मिलित होने का अर्थ स्वाभाविक बनता है।
theological_decisions:
