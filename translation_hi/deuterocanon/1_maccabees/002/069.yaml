  choice: वह अपने पुरखाओं में मिला दिया गया
  alternative: वह अपने पुरखाओं में जा मिला
  rationale: मुख्य पाठ यूनानी की निष्क्रिय रचना और विरासत में मिली बाइबलीय अभिव्यक्ति को निकटता से सुरक्षित रखता है। यह मृत्यु के बाद की अवस्था के बारे में उससे अधिक स्पष्ट दावा नहीं करता जितना स्रोत करता है; अधिक सहज हिन्दी रूप पादटिप्पणी में दिया गया है।
