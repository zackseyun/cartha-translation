base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: hi
  text: “तो अब सबसे पहले आगे आओ और राजा की आज्ञा पूरी करो, जैसा सब राष्ट्रों, यहूदा के शासकों और यरूशलेम में बचे हुए लोगों ने किया है। तब तुम और तुम्हारा घराना राजा के ‘मित्रों’[a] में गिने जाओगे, और तुम और तुम्हारे पुत्र चाँदी, सोने और बहुत-से उपहारों[b] से सम्मानित किए जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मित्र’ केवल निजी मित्रों के लिए नहीं, बल्कि राजा के कृपापात्र सलाहकारों और साथियों के एक मान्य राजदरबारी वर्ग के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उपहारों’ के लिए प्रयुक्त यूनानी शब्द राजकीय लाभ, अनुदान या वितरण भी दर्शा सकता है; यहाँ चाँदी और सोने के अतिरिक्त मिलने वाले पुरस्कार अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: तो अब
  rationale: यह वाक्य को पिछले आग्रह के निष्कर्ष से जोड़ते हुए वर्तमान अपील पर बल देता है; ‘तो अब’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πρόσελθε πρῶτος
  choice: सबसे पहले आगे आओ
  rationale: πρόσελθε सार्वजनिक रूप से आगे आने का आह्वान है और πρῶτος दूसरों से पहले उदाहरण प्रस्तुत करने का दबाव व्यक्त करता है।
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: राजा की आज्ञा पूरी करो
  rationale: πρόσταγμα अधिकारपूर्ण राजकीय आदेश है; ‘आज्ञा पूरी करो’ उसके अनुपालन का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्रों
  rationale: ἔθνη का जातीय-धार्मिक अर्थ हो सकता है, पर यहाँ व्यापक राजनीतिक तुलना है। ‘राष्ट्रों’ स्रोत की व्यापकता बनाए रखता है और अनावश्यक रूप से ‘गैर-यहूदी’ नहीं जोड़ता।
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: यहूदा के शासकों
  rationale: ἄρχοντες मान्य शासनाधिकार रखने वाले अगुओं या अधिकारियों को दर्शाता है; राजनीतिक प्रसंग में ‘शासकों’ उपयुक्त है।
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: यरूशलेम में बचे हुए लोगों
  rationale: यह अनुवाद उनके वहाँ रह जाने या शेष होने का भाव रखता है, पर उन्हें अनिवार्यतः युद्ध के ‘जीवित बचे लोग’ नहीं ठहराता।
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: राजा के ‘मित्रों’ में
  rationale: φίλοι सामान्य मित्रों के साथ-साथ हेलेनवादी राजदरबार के मान्य पद या विशेष कृपापात्र वर्ग को भी सूचित कर सकता है। उद्धरण-चिह्न और पादटिप्पणी इस संभावित पदनाम को स्पष्ट करते हैं।
- source_word: δοξασθήσεσθε
  choice: सम्मानित किए जाओगे
  rationale: इस राजकीय पुरस्कार के प्रसंग में क्रिया प्रतिष्ठा और सम्मान दिए जाने को दर्शाती है, न कि ईश्वरीय महिमा को।
- source_word: ἀποστολαῖς πολλαῖς
  choice: बहुत-से उपहारों
  rationale: चाँदी और सोने के साथ प्रयुक्त यह पद यहाँ राजकीय अनुदानों, लाभों या वितरणों की ओर संकेत करता है; ‘उपहारों’ मुख्य आशय को सामान्य पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: φίλοι में राजदरबारी पदनाम की सम्भावना
  choice: ‘राजा के “मित्रों”’ लिखकर पादटिप्पणी देना
  alternative: राजा के मित्रों
  rationale: यह रूप सामान्य मित्रता और राजकीय कृपापात्रों के औपचारिक वर्ग—दोनों सम्भावनाओं को खुला रखता है और किसी एक अर्थ को चुपचाप निश्चित नहीं करता।
- issue: ἔθνη का दायरा
  choice: सब राष्ट्रों
  alternative: सब गैर-यहूदियों
  rationale: प्रसंग में जातीय-धार्मिक भेद उपस्थित हो सकता है, लेकिन यूनानी शब्द का व्यापक राजनीतिक अर्थ भी बना रहता है; ‘राष्ट्रों’ इस अस्पष्टता को अधिक अच्छी तरह सुरक्षित रखता है।
- issue: ἀποστολαί का पुरस्कार-संबंधी अर्थ
  choice: उपहारों, पादटिप्पणी सहित
  alternative: राजकीय लाभों / अनुदानों
  rationale: मुख्य पाठ में सहज अर्थ दिया गया है, जबकि पादटिप्पणी शब्द के व्यापक राजकीय लाभ या वितरण के अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय दबाव और पुरस्कार के प्रलोभन को स्पष्ट रखा गया है। ‘घराना’ οἶκος के पारिवारिक-सामुदायिक विस्तार को ‘घर’ से अधिक स्वाभाविक ढंग से व्यक्त करता है। पादटिप्पणी-चिह्न उन्हीं शब्दों पर लगाए गए हैं जिनकी व्याख्या पादटिप्पणियों में है।
