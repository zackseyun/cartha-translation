translation:
  language: hi
  text: उसकी सारी शोभा छीन ली गई; स्वतंत्र स्त्री के स्थान पर वह दासी बन गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ κόσμος αὐτῆς
  choice: उसकी सारी शोभा
  rationale: यहाँ πᾶς एकवचन κόσμος की संपूर्णता बताता है, और κόσμος का अर्थ ‘संसार’ नहीं बल्कि सजावट, शोभा या वैभव है। ‘सारी शोभा’ स्वाभाविक हिन्दी में अर्थ की व्यापकता बनाए रखता है।
- source_word: ἀφηρέθη
  choice: छीन ली गई
  rationale: अओरिस्ट कर्मवाच्य बाहरी कर्ता द्वारा वंचित किए जाने का भाव देता है। ‘छीन ली गई’ हानि और अपमान की तीव्रता को स्पष्ट करता है, बिना कर्ता जोड़े।
- source_word: ἀντὶ ἐλευθέρας
  choice: स्वतंत्र स्त्री के स्थान पर
  rationale: ἀντί स्थिति के उलटाव अथवा प्रतिस्थापन को व्यक्त करता है। स्त्रीलिंग विशेषण ἐλευθέρας नगर के स्त्रीरूप व्यक्तिकरण से जुड़ा है, इसलिए ‘स्वतंत्र स्त्री’ इस रूपक को सुरक्षित रखता है।
- source_word: δούλην
  choice: दासी
  rationale: ἐλευθέρα के सीधे विरोध में δούλη बंधन और स्वतंत्रता खोने की स्थिति बताता है। आधुनिक हिन्दी में ‘दासी’ स्त्रीलिंग व्यक्तिकरण और दासत्व, दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ἐλευθέρα और δούλη के विरोध का अनुवाद
  choice: स्वतंत्र स्त्री … दासी
  alternative: स्वतंत्र … सेविका
  rationale: पद का केंद्र स्वतंत्रता से दासत्व में हुआ उलटाव है। ‘सेविका’ स्वैच्छिक सेवा का अर्थ दे सकती है, जबकि ‘दासी’ बंधन को अधिक स्पष्ट रखती है। ‘स्वतंत्र स्त्री’ नगर के स्त्रीरूप व्यक्तिकरण को भी प्रकट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप के अनुरूप संक्षिप्त रखी गई है। ‘शोभा’ κόσμος की संदर्भगत व्यापकता को ग्रहण करता है; ‘दासी’ स्वतंत्रता के विपरीत बंधी हुई स्त्री की स्थिति दर्शाता है।
