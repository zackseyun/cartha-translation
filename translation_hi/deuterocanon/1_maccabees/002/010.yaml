    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: ऐसा कौन-सा राष्ट्र
  rationale: यह अलंकारिक प्रश्न है। राजनीतिक-सामूहिक संदर्भ में ἔθνος के लिए ‘राष्ट्र’ उपयुक्त है।
- source_word: οὐκ ἐκληρονόμησεν βασιλείαν
  choice: जिसे कोई राज्य विरासत में नहीं मिला
  rationale: κληρονομέω के विरासत अथवा हिस्से के रूप में प्राप्त होने के रूपक को बनाए रखता है; βασιλεία का यहाँ ठोस राजनीतिक अर्थ ‘राज्य’ स्वाभाविक है। हिंदी में यह रचना ‘राज्य विरासत में पाया’ की अपेक्षा अधिक सहज है।
- source_word: οὐκ ἐκράτησεν
  choice: और जिसने ... पर अधिकार नहीं किया
  rationale: κρατέω के पकड़ लेने, अपने वश में करने या अधिकार जमाने के भाव को स्वाभाविक हिंदी में व्यक्त करता है, बिना क्रिया को अनावश्यक रूप से केवल हिंसक ‘छीन लिया’ तक सीमित किए।
- source_word: τῶν σκύλων αὐτῆς
  choice: उसकी युद्ध-लूट
  rationale: σκῦλα युद्ध या विजय में प्राप्त लूट को दर्शाता है। ‘युद्ध-लूट’ यह संदर्भ साफ करता है; ‘उसकी’ αὐτῆς के संभावित संदर्भ को मूल की तरह खुला रखता है।
