base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/050.yaml
  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: hi
  text: और अब, हे बच्चो[a], व्यवस्था के लिए उत्साही बनो, और हमारे पितरों की वाचा के लिए[b] अपने प्राण दे दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे पुत्रो।” यूनानी शब्द τέκνα संतान के लिए प्रयुक्त पारिवारिक सम्बोधन है; प्रसंग में मत्ततियाह अपने पुत्रों को सम्बोधित कर रहा है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारे पितरों की वाचा की खातिर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: बच्चो
  rationale: सम्बोधन के रूप में यह संतान के लिए प्रयुक्त पारिवारिक शब्द है। ‘बच्चो’ यूनानी शब्द की व्यापकता और पिता के आत्मीय सम्बोधन, दोनों को बनाए रखता है; प्रसंग में मत्ततियाह के पुत्र सामने हैं।
- source_word: ζηλώσατε τῷ νόμῳ
  choice: व्यवस्था के लिए उत्साही बनो
  rationale: आज्ञार्थक क्रिया व्यवस्था के प्रति प्रबल निष्ठा और सक्रिय उत्साह का आह्वान करती है। यह अनुवाद धार्मिक तीव्रता को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: τῷ νόμῳ
  choice: व्यवस्था
  rationale: मक्काबी प्रसंग में νόμος से पैतृक तोराह अभिप्रेत है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में इसका स्थापित और स्पष्ट रूप है।
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: अपने प्राण दे दो
  rationale: यहाँ ψυχή अमूर्त ‘आत्मा’ नहीं, बल्कि बलिदान किए जाने वाले जीवन को दर्शाता है। ‘अपने प्राण दे दो’ मूल अभिव्यक्ति की तीव्रता और आत्मबलिदान का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: बलिदान के प्रसंग में ὑπέρ किसी हेतु या पक्ष में प्राण देने का भाव रखता है। ‘के लिए’ संक्षिप्त है और ‘की खातिर’ वाला अर्थ भी समेटता है।
- source_word: διαθήκης
  choice: वाचा
  rationale: यह यहूदी शास्त्रीय प्रसंग में परमेश्वर और पितरों से सम्बद्ध बंधनकारी वाचा को दर्शाता है। ‘वाचा’ धार्मिक आशय को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: πατέρων ἡμῶν
  choice: हमारे पितरों की
  rationale: यूनानी पाठ में स्पष्ट रूप से पैतृक पूर्वजों का उल्लेख है। ‘पितरों’ से वह लिंग-विशिष्ट और वाचागत पैतृक भाषा बनी रहती है, जबकि ‘पूर्वजों’ से वह विशेषता मंद पड़ सकती थी।
theological_decisions:
- issue: πατέρων ἡμῶν में लिंग-विशिष्ट पैतृक भाषा
  choice: हमारे पितरों की
  alternative: हमारे पूर्वजों की
  rationale: मूल पाठ वाचा से जुड़े इस्राएल के ‘पितरों’ को स्पष्ट रूप से पुरुषवाची शब्द से बताता है। अनुवाद इस विशेषता को सामान्यीकृत नहीं करता।
- issue: आत्मबलिदान के प्रसंग में ψυχή का अर्थ
  choice: प्राण
  alternative: आत्माएँ
  rationale: यहाँ आह्वान वाचा के लिए जीवन देने का है, न कि मनुष्य की अभौतिक आत्मा के विषय में कोई पृथक दावा करने का। ‘प्राण’ इस प्रसंगगत अर्थ को ठीक व्यक्त करता है।
- issue: ὑπέρ द्वारा व्यक्त हेतु या पक्ष
  choice: वाचा के लिए
  alternative: वाचा की खातिर
  rationale: दोनों रूप आत्मबलिदान के हेतु को व्यक्त करते हैं। मुख्य पाठ में अधिक संक्षिप्त और स्वाभाविक ‘के लिए’ रखा गया है, जबकि विकल्प पद की हेतुवाचक शक्ति को अधिक स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘व्यवस्था’, ‘वाचा’, ‘पितरों’ और ‘प्राण’ जैसे स्थापित शास्त्रीय शब्द प्रसंग की गंभीरता बनाए रखते हैं; वाक्यरचना सामान्य हिन्दी पाठक के लिए सुबोध है।
