  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: hi
  text: और यहूदा मकाबी स्वयं, जो अपनी युवावस्था से ही पराक्रमी है,[a] तुम्हारी सेना का सेनापति होगा, और तुम राष्ट्रों के विरुद्ध युद्ध करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शब्दशः क्रम लगभग ‘उससे, अपनी युवावस्था से, सामर्थ्य में बलवान’ है। वाक्य-विन्यास असहज है; यहाँ उसका संभावित आशय दिया गया है कि यहूदा अपनी युवावस्था से ही पराक्रमी है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: यहूदा मकाबी
  rationale: Ἰούδας के लिए प्रचलित बाइबलीय हिन्दी नाम ‘यहूदा’ और Μακκαβαῖος के लिए स्थापित उपनाम ‘मकाबी’ रखा गया है।
- source_word: ἰσχυρὸς δυνάμει
  choice: पराक्रमी
  rationale: विशेषण और संज्ञा से बने बलवाचक यूनानी पदबंध को स्वाभाविक, गरिमापूर्ण हिन्दी में ‘पराक्रमी’ व्यक्त करता है।
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: अपनी युवावस्था से ही
  rationale: प्रेषित यूनानी पाठ में पहला ἐκ αὐτοῦ कठिन और असहज है; अनुवाद स्पष्ट अभिप्राय—युवावस्था से विद्यमान सामर्थ्य—देता है, जबकि पाठगत कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: ἄρχοντα στρατιᾶς
  choice: सेना का सेनापति
  rationale: सैन्य प्रसंग में ἄρχων नेतृत्व अथवा कमान करने वाले को और στρατιά सेना को दर्शाता है; ‘सेनापति’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πολεμήσετε πόλεμον
  choice: युद्ध करोगे
  rationale: यूनानी सजातीय क्रिया-संज्ञा रचना का अर्थ हिन्दी में स्वाभाविक रूप से ‘युद्ध करना’ है।
- source_word: λαῶν
  choice: अन्य जातियों
  rationale: यहाँ λαοί विदेशी सामूहिक विरोधियों को सूचित करता है। ‘अन्य जातियाँ’ इस प्रसंग में अर्थ स्पष्ट करता है और ‘गैर-यहूदी’ जैसा अतिरिक्त धर्मवैचारिक भार नहीं जोड़ता।
theological_decisions:
- issue: कठिन पदबंध ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ का निरूपण
  choice: मुख्य पाठ में स्पष्ट प्रतीत होने वाला अर्थ दिया गया है कि यहूदा अपनी युवावस्था से पराक्रमी रहा है।
  alternative: शब्दशः किंतु अस्पष्ट रूप, जैसे ‘उससे, अपनी युवावस्था से, सामर्थ्य में बलवान’।
  rationale: यूनानी पाठ की वास्तविक असहजता को चुपचाप मिटाने के बजाय पादटिप्पणी में बताया गया है; मुख्य पाठ साधारण पाठक के लिए संभावित आशय को स्वाभाविक हिन्दी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण सैन्य-वर्णनात्मक रजिस्टर अपनाया गया है। भविष्यसूचक कथन के लिए ‘होगा’ और ‘करोगे’ रखे गए हैं; कठिन यूनानी वाक्यांश की पारदर्शिता पादटिप्पणी द्वारा बनाए रखी गई है।
