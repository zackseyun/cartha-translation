lexical_decisions:
- source_word: Δανιὴλ
  choice: दानिय्येल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ἐν τῇ ἁπλότητι αὐτοῦ
  choice: अपनी निष्कपटता के कारण
  rationale: ἁπλότης यहाँ सरलता मात्र नहीं, बल्कि निष्कपट और अखंड निष्ठा का प्रशंसात्मक भाव रखता है। प्रसंग में ἐν को उस गुण के आधार या कारण के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐρύσθη
  choice: बचाया गया
  rationale: कर्मवाच्य भूतकाल संकट से छुड़ाए जाने को बताता है; यह सहज आधुनिक हिन्दी है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἐκ στόματος λεόντων
  choice: सिंहों के मुँह से
  rationale: यूनानी के सजीव मुहावरे और उसके एकवचन στόματος को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: दानिय्येल के प्रशंसात्मक वर्णन में ἁπλότης का अर्थ
  choice: निष्कपटता
  alternative: सरलता; एकनिष्ठता; खराई
  rationale: ‘निष्कपटता’ छलरहित और अखंड चरित्र का भाव देती है, जबकि ‘सरलता’ आधुनिक हिन्दी में भोलेपन का अनुचित संकेत दे सकती है। पादटिप्पणी मूल शब्द की वास्तविक अर्थ-सीमा को खुला रखती है।
translation_notes:
