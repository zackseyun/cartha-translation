base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: hi
  text: और एक आदमी ने अपने साथी से कहा, “यदि हम सब वैसा ही करें जैसा हमारे भाइयों ने किया, और अपने प्राणों और अपने अधिकारों[b] के लिए अन्यजातियों[a] से युद्ध न करें, तो अब वे हमें जल्दी ही इस देश से मिटा देंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों।” यूनानी शब्द का सामान्य अर्थ “राष्ट्र” है, पर यहाँ संभवतः यह यहूदियों के विरोधी गैर-यहूदी लोगों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “नियमों” अथवा “वैधानिक दावों।” यूनानी शब्द स्थापित अधिकारों, कानूनी नियमों या परंपरागत दावों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: एक पुरुष
  rationale: यह एक पुरुष वक्ता को सूचित करता है; ‘एक पुरुष’ यूनानी एकवचन को स्पष्ट रूप से बनाए रखता है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: शाब्दिक अर्थ ‘निकट का व्यक्ति’ है; यहाँ समूह के दूसरे सदस्य के लिए ‘पड़ोसी’ स्वाभाविक और सटीक है।
- source_word: ἀδελφοὶ
  choice: भाइयों
  rationale: पुल्लिंग बहुवचन है और संदर्भ में पहले उल्लिखित साथी यहूदियों की ओर संकेत करता है।
- source_word: πολεμήσωμεν
  choice: युद्ध करें
  rationale: यह सशस्त्र प्रतिरोध का सैन्य अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: τὰ ἔθνη
  choice: अन्यजातियों
  rationale: यहूदी साहित्य के इस संदर्भ में यह शब्द विरोधी गैर-यहूदी लोगों या शक्तियों को सूचित करता है; शाब्दिक विकल्प ‘राष्ट्रों’ को पादटिप्पणी में रखा गया है।
- source_word: ψυχῆς
  choice: प्राणों
  rationale: यहाँ अर्थ अमूर्त आत्मा नहीं, बल्कि जीवन की रक्षा है; ‘अपने प्राणों’ सामूहिक संदर्भ में स्वाभाविक है।
- source_word: δικαιωμάτων
  choice: अधिकारों
  rationale: यह समुदाय के स्थापित वैधानिक या परंपरागत दावों को दर्शाता है; व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- source_word: νῦν τάχιον
  choice: अब बहुत शीघ्र
  rationale: νῦν की वर्तमान तात्कालिकता और τάχιον के तुलनात्मक/तीव्र भाव, दोनों को बनाए रखता है।
- source_word: ὀλεθρεύσουσιν
  choice: मिटा देंगे
  rationale: यह पूर्ण विनाश की कठोरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς γῆς
  choice: इस देश से
  rationale: संदर्भ में γῆ समूची पृथ्वी के बजाय उनके भूभाग या देश को सूचित करता है।
theological_decisions:
- issue: यहूदी प्रतिरोध के संदर्भ में τὰ ἔθνη का अनुवाद
  choice: अन्यजातियों
  alternative: राष्ट्रों
  rationale: ‘अन्यजातियों’ यहाँ यहूदी समुदाय और विरोधी गैर-यहूदी लोगों के बीच संदर्भगत भेद को स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: δικαιωμάτων की अर्थ-सीमा
  choice: अधिकारों
  alternative: विधानों या वैधानिक दावों
  rationale: ‘अधिकारों’ आधुनिक पाठक के लिए सामुदायिक वैध दावों को स्पष्ट करता है; शब्द में निहित विधान और स्थापित कानूनी व्यवस्था का भाव पादटिप्पणी में दिया गया है।
- issue: νῦν τάχιον की तात्कालिकता
  choice: अब बहुत शीघ्र
  alternative: शीघ्र
  rationale: मूल पाठ में νῦν और τάχιον दोनों उपस्थित हैं; अनावश्यक रूप से किसी एक को हटाने के बजाय हिन्दी में उनके संयुक्त तात्कालिक भाव को रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘प्राणों’, ‘युद्ध’ और ‘बहुत शीघ्र’ जैसे शब्द मूल के गंभीर और तात्कालिक स्वर को रखते हैं; पादटिप्पणियाँ वास्तविक कोशगत विकल्पों को सुरक्षित रखती हैं।
