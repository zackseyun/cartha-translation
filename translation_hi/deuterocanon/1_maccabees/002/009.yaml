  register: भाषा आधुनिक, गम्भीर और विलाप के अनुरूप रखी गई है। समानान्तर वाक्य-रचना को स्वाभाविक हिन्दी के लिए अंतिम खंड में ‘मारे गए’ दोहराकर स्पष्ट किया गया है।
