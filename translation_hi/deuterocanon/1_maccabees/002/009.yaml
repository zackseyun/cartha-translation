- issue: बार-बार आए स्त्रीलिंग सम्बन्धसूचक सर्वनाम का संदर्भ
  choice: पद में नगर का नाम जोड़े बिना ‘उसकी’ को बनाए रखा गया।
  alternative: ‘यरूशलेम की’ या ‘सिय्योन की’ कहकर संदर्भ को स्पष्ट करना।
  rationale: यूनानी में स्त्रीलिंग αὐτῆς का पूर्वपद आसपास के प्रसंग से मिलता है। ‘उसकी’ विलाप की काव्यात्मक व्यक्ति-कल्पना को सुरक्षित रखता है और इस पद से अधिक स्पष्ट पहचान आरोपित नहीं करता।
