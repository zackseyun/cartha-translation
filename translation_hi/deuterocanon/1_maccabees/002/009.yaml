  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: hi
  text: उसकी महिमा के पात्र बंदी बनाकर ले जाए गए[a]; उसके नन्हे बच्चे उसकी सड़कों पर मार डाले गए[b], और उसके युवक शत्रु की तलवार से मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंदियों के समान ले जाए गए।” यूनानी में बलपूर्वक बंदी बनाकर ले जाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: बार-बार आया “उसकी” आसपास के प्रसंग में स्त्री के रूप में चित्रित नगर की ओर संकेत करता है—संभवतः यरूशलेम या सिय्योन।
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: पात्र
  rationale: यह शब्द पात्रों, बर्तनों या उपकरणों को सूचित कर सकता है। ‘पात्र’ बहुमूल्य या पवित्र वस्तुओं की सम्भावना बनाए रखता है, पर यूनानी से अधिक स्पष्ट रूप से उन्हें मन्दिर के पात्र नहीं ठहराता।
- source_word: δόξης
  choice: महिमा
  rationale: ‘महिमा’ ऊँची विलापमय शैली और सम्भावित धार्मिक अनुगूँज को बनाए रखती है; ‘शोभा’ भी सम्भव है, पर अपेक्षाकृत सीमित है।
- source_word: αἰχμάλωτα ἀπήχθη
  choice: बंदी बनाकर ले जाए गए
  rationale: यह वाक्यांश बलपूर्वक पकड़कर ले जाने और बंदी अवस्था में पहुँचाने का भाव व्यक्त करता है। वस्तुओं के लिए यह असामान्य रूपक यूनानी में भी उपस्थित है, इसलिए उसे समतल नहीं किया गया।
- source_word: νήπια
  choice: नन्हे बच्चे
  rationale: νήπια बहुत छोटे बच्चों को सूचित करता है। ‘नन्हे बच्चे’ आधुनिक हिन्दी में स्वाभाविक है और आयु तथा करुण स्वर दोनों को व्यक्त करता है।
- source_word: ἀπεκτάθη
  choice: मार डाले गए
  rationale: क्रिया हत्या किए जाने को व्यक्त करती है। ‘मार डाले गए’ स्पष्ट, गम्भीर और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πλατείαις
  choice: सड़कों
  rationale: यह शब्द चौड़ी सड़कों या खुले नगर-स्थानों के लिए प्रयुक्त हो सकता है। यहाँ ‘सड़कों’ सबसे स्वाभाविक है और ‘चौड़ी सड़कें’ या ‘चौक’ जैसी अनावश्यक विशिष्टता से बचता है।
- source_word: νεανίσκοι
  choice: जवान
  rationale: यह शब्द युवकों या जवान पुरुषों को सूचित करता है। ‘जवान’ नन्हे बच्चों से आयु का स्पष्ट अन्तर रखते हुए संक्षिप्त और स्वाभाविक है।
- source_word: ῥομφαίᾳ
  choice: तलवार
  rationale: ῥομφαία एक तलवार, कभी-कभी बड़ी तलवार, को सूचित करता है। इस प्रसंग में आकार पर बल नहीं है, इसलिए सामान्य ‘तलवार’ उपयुक्त है।
- source_word: ἐχθροῦ
  choice: शत्रु की
  rationale: एकवचन सम्बन्धकारक यहाँ शत्रु पक्ष का प्रतिनिधित्व करता है। ‘शत्रु की तलवार’ हिन्दी में स्वाभाविक रूप से विरोधी की हिंसक एजेंसी व्यक्त करता है।
