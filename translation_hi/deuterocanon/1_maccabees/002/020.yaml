  text: But I and my sons and my brothers will walk in the covenant of our fathers[a].
translation:
  language: hi
  text: परन्तु मैं, मेरे पुत्र और मेरे भाई हमारे पितरों की वाचा के अनुसार चलेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “हमारे पितरों की वाचा में चलेंगे।” यूनानी मुहावरे का आशय सम्भवतः वाचा के प्रति निष्ठा से जीवन बिताना है।'
    reason: शाब्दिक विकल्प और यूनानी मुहावरे का स्पष्टीकरण
lexical_decisions:
- source_word: κἀγώ
  choice: परन्तु मैं
  rationale: καί + ἐγώ का रूप यहाँ पिछले कथन के विपरीत मत्तथियास के दृढ़ निश्चय को सामने लाता है; इसलिए प्रसंग में ‘परन्तु मैं’ स्वाभाविक है।
- source_word: οἱ υἱοί μου
  choice: मेरे पुत्र
  rationale: υἱοί विशेष रूप से पुरुष संतानों को सूचित करता है; इसलिए ऐतिहासिक और लैंगिक विशिष्टता बनाए रखी गई है।
- source_word: οἱ ἀδελφοί μου
  choice: मेरे भाई
  rationale: ἀδελφοί का सीधा और प्रसंगानुकूल अर्थ ‘भाई’ है; व्यापक अर्थ ‘कुटुम्बी’ सम्भव है, पर यहाँ उसके लिए पर्याप्त दबाव नहीं है।
- source_word: πορευσόμεθα
  choice: चलेंगे
  rationale: शाब्दिक अर्थ ‘जाएँगे’ है, किन्तु वाचा के साथ प्रयुक्त होने पर यह जीवन-आचरण और निष्ठा का भाव देता है; ‘चलेंगे’ स्रोत की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: ἐν διαθήκῃ
  choice: वाचा के अनुसार
  rationale: διαθήκη यहाँ ‘वाचा’ है। हिन्दी में ‘वाचा में चलना’ की अपेक्षा ‘वाचा के अनुसार चलना’ अधिक स्वाभाविक है और यूनानी मुहावरे का आशय स्पष्ट करता है।
- source_word: πατέρων ἡμῶν
  choice: अपने पूर्वजों की
  rationale: πατέρων का शाब्दिक अर्थ ‘पिताओं’ है, पर इस वंशगत वाचा-सन्दर्भ में आधुनिक हिन्दी का ‘पूर्वजों’ अधिक स्वाभाविक और स्पष्ट है; ‘अपने’ संयुक्त कर्ता के साथ साझा वंश-सम्बन्ध प्रकट करता है।
theological_decisions:
- issue: πορευσόμεθα ἐν διαθήκῃ में वाचा-संबंधी मुहावरा
  choice: वाचा के अनुसार चलेंगे
  alternative: वाचा में जाएँगे / वाचा में चलेंगे
  rationale: यह वाक्य केवल गति या दिशा नहीं, बल्कि विरासत में मिली वाचा के प्रति निष्ठावान जीवन-आचरण व्यक्त करता है। ‘के अनुसार चलेंगे’ इस भाव को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित करती है।
- issue: πατέρων ἡμῶν का पारिवारिक और वंशगत अर्थ
  choice: अपने पूर्वजों की
  alternative: हमारे पिताओं की
  rationale: यूनानी में पुरुषवाचक ‘पिताओं’ है, किन्तु यहाँ उसका सन्दर्भ पिछली पीढ़ियों और पैतृक वाचा से है। ‘पूर्वजों’ कहना किसी विशिष्ट धार्मिक व्याख्या को जोड़े बिना वही वंशगत आशय स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ बाइबलीय संकल्पना की सटीकता बनाए रखता है, जबकि ‘के अनुसार चलेंगे’ यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
