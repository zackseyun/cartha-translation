  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: hi
  text: और उन्होंने इस्राएल की सीमाओं[a] के भीतर जितने भी खतनारहित लड़के पाए, उन सबका बलपूर्वक[b] खतना किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के क्षेत्र में” अथवा “इस्राएल के प्रदेशों में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “बल के साथ” या “सामर्थ्य के साथ”; यहाँ भाव बल प्रयोग करके है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: उन्होंने ... खतना किया
  rationale: यह περιτέμνω का अओरिस्ट सक्रिय रूप है और खतना करने के लिए प्रयुक्त मानक क्रिया है। हिंदी में ‘खतना किया’ स्वाभाविक और सटीक है।
- source_word: τὰ παιδάρια τὰ ἀπερίτμητα
  choice: खतनारहित लड़के
  rationale: παιδάρια का अर्थ बच्चे या कम उम्र के लड़के हो सकता है। खतने के संदर्भ में ‘लड़के’ उपयुक्त है, जबकि ‘खतनारहित’ उनकी स्थिति को सीधे व्यक्त करता है और आयु को अनावश्यक रूप से अधिक निश्चित नहीं बनाता।
- source_word: ὅσα εὗρεν
  choice: जितने भी ... पाए, उन सबका
  rationale: नपुंसकलिंग बहुवचन ὅσα का भाव समष्टिगत और व्यापक है—जितने ऐसे लड़के मिले, वे सभी। स्रोत में εὗρεν एकवचन है, पर प्रसंग के बहुवचन कर्ता को हिंदी में स्वाभाविक रूप से ‘पाए’ से व्यक्त किया गया है।
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: इस्राएल की सीमाओं में
  rationale: ὅρια सीमाओं, भूभाग या प्रदेशों का बोध करा सकता है। ‘सीमाओं में’ मूल के स्थानगत और राजनीतिक-भौगोलिक भाव को बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἐν ἰσχύϊ
  choice: बलपूर्वक
  rationale: शाब्दिक अर्थ ‘सामर्थ्य/बल के साथ’ है, किंतु इस प्रसंग में यह जबरदस्ती या बल प्रयोग का संकेत देता है। ‘बलपूर्वक’ इस कठोरता को बिना घटाए या उस पर अतिरिक्त नैतिक टिप्पणी किए व्यक्त करता है।
theological_decisions:
- issue: वर्णित कार्य का नैतिक और धर्मवैचारिक भाव
  choice: बलपूर्वक
  alternative: सामर्थ्य के साथ; बड़े जोश से
  rationale: अनुवाद कार्य का वर्णन जैसा है वैसा ही करता है और जबरदस्ती को नरम नहीं करता। साथ ही वह मूल पाठ से परे जाकर न तो इस कार्य का अनुमोदन करता है, न उसकी निंदा जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास हिंदी की स्वाभाविक प्रवाहशीलता के अनुसार है, जबकि मूल यूनानी की व्यापकता (‘जितने भी... उन सबका’) और बल प्रयोग का स्पष्ट भाव सुरक्षित रखा गया है।
