  yaml_path: translation/deuterocanon/1_maccabees/002/034.yaml
  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: hi
  text: और उन्होंने कहा, “हम बाहर नहीं आएँगे, और न ही हम राजा की आज्ञा मानकर सब्त के दिन को अपवित्र करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: हम बाहर नहीं आएँगे
  rationale: भविष्यत् रूप का मूल अर्थ ‘बाहर निकलना/आना’ है। प्रसंग में छिपे हुए लोगों को बाहर आने के लिए कहा जा रहा है, इसलिए ‘बाहर नहीं आएँगे’ स्वाभाविक और सटीक है।
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: न राजा की आज्ञा मानेंगे
  rationale: शाब्दिक रूप से यह ‘राजा के वचन को करना’ है। आधुनिक हिन्दी में राजकीय आदेश का पालन करने के अर्थ में ‘राजा की आज्ञा मानना’ अधिक स्वाभाविक है और यूनानी मुहावरे का आशय स्पष्ट रखता है।
- source_word: βεβηλῶσαι
  choice: अपवित्र होगा
  rationale: क्रिया का अर्थ किसी पवित्र वस्तु या समय को साधारण अथवा अपवित्र ठहराना है। हिन्दी में ‘अपवित्र’ धार्मिक आशय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἡμέραν τῶν σαββάτων
  choice: सब्त का दिन
  rationale: रूपतः ‘सब्तों का दिन’ होने पर भी यह एकवचन सब्त के लिए प्रचलित यूनानी प्रयोग है। ‘सब्त का दिन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων में पवित्र समय की भाषा
  choice: सब्त का दिन अपवित्र होगा
  alternative: सब्त के दिन की पवित्रता भंग होगी
  rationale: मूल पद सब्त को केवल नियम-पालन का विषय नहीं, बल्कि पवित्र समय के रूप में प्रस्तुत करता है। ‘अपवित्र’ इस धार्मिक तनाव को सीधे बनाए रखता है।
- issue: अंतिम infinitive βεβηλῶσαι का वाक्यगत संबंध
  choice: क्योंकि ऐसा करने से … अपवित्र होगा
  alternative: … आज्ञा मानकर सब्त के दिन को अपवित्र नहीं करेंगे
  rationale: यूनानी में infinitive राजा की बात मानने से जुड़े परिणाम अथवा उद्देश्य को व्यक्त कर सकता है। हिन्दी में कारण-परिणाम की यह रचना आशय स्पष्ट करती है, जबकि जानबूझकर अपवित्र करने का उद्देश्य अनावश्यक रूप से आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु धार्मिक प्रसंग के अनुरूप गरिमापूर्ण। ‘सब्त’ पारंपरिक बाइबलीय पद के रूप में रखा गया है और वाक्य को अत्यधिक शाब्दिक ‘राजा का वचन करना’ से बचाकर स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
