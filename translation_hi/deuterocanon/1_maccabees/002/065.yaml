  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: hi
  text: और देखो, तुम्हारा भाई शमौन—मैं जानता हूँ कि वह सूझ-बूझ वाला व्यक्ति है। जीवन भर उसकी बात मानते रहना; वह तुम्हारे लिए पिता होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी उद्गार का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: Συμεὼν
  choice: शमौन
  rationale: बाइबलीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἀνὴρ βουλῆς
  choice: बुद्धिमान सलाह देनेवाला व्यक्ति
  rationale: शाब्दिक अर्थ ‘सलाह का व्यक्ति’ है; हिन्दी में यह रूप उसकी विवेकपूर्ण परामर्श देने की योग्यता स्पष्ट करता है, बिना उसे कोई औपचारिक पद दिए।
- source_word: αὐτοῦ ἀκούετε
  choice: उसकी सुनना
  rationale: आज्ञार्थक भाव में केवल सुनना नहीं, उसकी बात मानना भी निहित है; हिन्दी मुहावरा दोनों अर्थ सँजोता है।
- source_word: πάσας τὰς ἡμέρας
  choice: जीवन भर
  rationale: शाब्दिक ‘सारे दिनों’ का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप।
- source_word: εἰς πατέρα
  choice: पिता के समान
  rationale: भूमिका और संबंध को व्यक्त करता है; जैविक पितृत्व का अर्थ उत्पन्न नहीं करता।
theological_decisions:
- issue: शमौन का पितृवत अधिकार
  choice: वह तुम्हारे लिए पिता के समान होगा
  alternative: वह तुम्हारा पिता होगा
  rationale: यूनानी εἰς πατέρα पितृवत भूमिका का संकेत देता है। ‘पिता के समान’ हिन्दी में इस कार्यात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है और वास्तविक पिता होने का भ्रम नहीं पैदा करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक ‘और देखो’ से καὶ ἰδοὺ का संयोजन तथा ध्यानाकर्षक बल बनाए रखा गया है।
