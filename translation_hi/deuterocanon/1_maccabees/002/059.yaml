  yaml_path: translation/deuterocanon/1_maccabees/002/059.yaml
  text: Hananiah[a], Azariah, and Mishael, having believed[b], were saved from the flame.
translation:
  language: hi
  text: हनन्याह[a], अजर्याह और मीशाएल ने विश्वास किया और वे ज्वाला से बचाए गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी नाम-रूप: ‘अननियास, अजरियास, मिसाएल।’ यहाँ दानिय्येल 3 के तीन युवकों के अधिक परिचित इब्रानी नाम-रूप दिए गए हैं।'
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: ‘विश्वास करके वे ज्वाला से बचाए गए’ या ‘विश्वास करने के कारण वे ज्वाला से छुड़ाए गए।’'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: हनन्याह, अजर्याह और मीशाएल
  rationale: यूनानी रूपों के सीधे लिप्यंतरण के बजाय दानिय्येल 3 के इन तीन युवकों के परिचित इब्रानी नाम-रूप अपनाए गए हैं; नामों का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: πιστεύσαντες
  choice: ने विश्वास किया और
  rationale: अओरिस्ट कृदंत का अर्थ विश्वास करना या भरोसा रखना है। हिन्दी में मुख्य क्रिया से पहले समापिका क्रिया और ‘और’ का प्रयोग स्वाभाविक है तथा कारण, साधन या केवल पूर्ववर्ती परिस्थिति में से किसी एक संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐσώθησαν
  choice: बचाए गए
  rationale: σῴζω के कर्मवाच्य का इस ठोस संकट-संदर्भ में अर्थ बचाया या छुड़ाया जाना है। ‘बचाए गए’ मूल के कर्मवाच्य और उद्धार के तथ्य—दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐκ φλογός
  choice: ज्वाला से
  rationale: φλόξ का एकवचन अर्थ ‘ज्वाला’ है और ἐκ यहाँ उससे बाहर निकालकर बचाए जाने का भाव देता है। ‘ज्वाला से’ संक्षिप्त, सजीव और मूल के निकट है।
theological_decisions:
- issue: πιστεύσαντες और ἐσώθησαν का संबंध
  choice: ‘ने विश्वास किया और वे ... बचाए गए’
  alternative: ‘विश्वास करने के कारण ... बचाए गए’ अथवा ‘विश्वास करके ... बचाए गए’
  rationale: यूनानी कृदंत विश्वास को बचाए जाने से जोड़ता है, पर उसका सटीक संबंध कालगत, परिस्थितिगत, साधनात्मक या कारणात्मक समझा जा सकता है। हिन्दी का समन्वयी रूप इस वास्तविक अस्पष्टता को बनाए रखता है और ‘विश्वास के द्वारा’ जैसी अधिक सिद्धान्तपरक संज्ञात्मक अभिव्यक्ति नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। नामों के परिचित बाइबिलीय रूप प्रयुक्त हैं। ‘बचाए गए’ कर्मवाच्य को सुरक्षित रखता है, जबकि ‘ने विश्वास किया और’ यूनानी कृदंत के संबंध को सिद्धान्तगत रूप से अत्यधिक निश्चित करने से बचता है।
