lexical_decisions:
- source_word: ἐτάχυναν
  choice: जल्दी की
  rationale: ταχύνω के अओरिस्ट रूप का अर्थ किसी काम को शीघ्र करना या उसमें तेजी दिखाना है। यहाँ स्वाभाविक हिन्दी में ‘युद्ध करने में जल्दी की’ उस क्रियात्मक बल को बनाए रखता है, बिना इसे किसी विशिष्ट सैनिक कार्रवाई के रूप में सीमित किए।
- source_word: ἐπʼ αὐτούς
  choice: उनके विरुद्ध
  rationale: शत्रुतापूर्ण सैनिक कार्रवाई के संदर्भ में ἐπί तथा कर्मकारक का स्वाभाविक अर्थ ‘उनके विरुद्ध’ है।
- source_word: πόλεμον
  choice: युद्ध
  rationale: πόλεμος का सीधा अर्थ ‘युद्ध’ है। ‘आक्रमण’ संदर्भानुकूल विकल्प है, पर मूल यूनानी की शब्दावली को दृश्यमान रखने के लिए ‘युद्ध’ चुना गया है।
