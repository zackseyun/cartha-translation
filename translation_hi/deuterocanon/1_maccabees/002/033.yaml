- source_word: Ἕως τοῦ νῦν
  choice: अब तक
  rationale: यह यूनानी वाक्यांश संक्षिप्त और कुछ आकस्मिक है। ‘अब तक’ उसकी कालगत सीमा तथा अनुपालन के अंतिम अवसर के संकेत को बिना अधिक स्पष्ट किए बनाए रखता है।
- source_word: ἐξέλθοντες
  choice: बाहर आओ
  rationale: यह आज्ञार्थक क्रिया के साथ जुड़ा कृदंत है। छिपे या घिरे हुए लोगों से सीधे संबोधन में ‘बाहर आओ’ स्वाभाविक हिन्दी है।
- source_word: ποιήσατε
  choice: करो
  rationale: यह सीधा आज्ञार्थक रूप है; ‘करो’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है और अगले पदबंध के साथ स्वाभाविक बैठता है।
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: राजा के वचन के अनुसार
  rationale: λόγος का अर्थ यहाँ ‘वचन’, ‘कथन’ या संदर्भतः ‘आज्ञा’ हो सकता है। ‘राजा के वचन’ मूल अभिव्यक्ति के निकट रहते हुए हिन्दी में स्पष्ट है।
- source_word: ζήσεσθε
  choice: तुम जीवित रहोगे
  rationale: यह ζάω का भविष्यकालीन रूप है। ‘जीवित रहोगे’ शाब्दिक अर्थ और प्राण बख्शे जाने के निहित आशय—दोनों को बिना विस्तार जोड़े सुरक्षित रखता है।
