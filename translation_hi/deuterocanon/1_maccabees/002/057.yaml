    reason: मूल यूनानी सर्वनाम के सम्भावित वैकल्पिक संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: Δαυεὶδ
  choice: दाऊद
  rationale: इस व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और सहज रूप।
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: अपनी दया के कारण
  rationale: ἐν के साधन अथवा कारण सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में αὐτοῦ को निकटतम व्यक्ति दाऊद से जोड़ा गया है, जबकि दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐκληρονόμησεν
  choice: विरासत में पाया
  rationale: क्रिया के उत्तराधिकार और वंशगत प्राप्ति के भाव को बनाए रखता है तथा राजवंशीय प्रसंग में स्वाभाविक है।
- source_word: θρόνον
  choice: सिंहासन
  rationale: राजकीय अधिकार और दाऊदी राजपद के ठोस प्रतीक को ठीक प्रकार व्यक्त करता है।
- source_word: βασιλείας αἰωνίας
  choice: सदा के राज्य का
  rationale: राज्य की निरन्तर और स्थायी अवधि को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है; इसे केवल अमूर्त राजत्व तक सीमित नहीं करता।
theological_decisions:
- issue: ἐν τῷ ἐλέει αὐτοῦ में αὐτοῦ का संकेत दाऊद की ओर है या परमेश्वर की ओर
  choice: 'मुख्य पाठ में इसे दाऊद की दया माना गया: “अपनी दया के कारण।”'
  alternative: “परमेश्वर की दया से उसने सदा के राज्य का सिंहासन विरासत में पाया।”
  rationale: निकटतम व्याकरणिक संदर्भ दाऊद है और आसपास का कथन आदर्श पूर्वजों के विशिष्ट गुणों की प्रशंसा करता है। फिर भी यूनानी सर्वनाम परमेश्वर की दया की ओर संकेत करने की सम्भावना को पूरी तरह समाप्त नहीं करता, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। “विरासत में पाया” राजवंशीय अर्थ को बनाए रखता है, और पादटिप्पणी मूल की वास्तविक सर्वनाम-संबंधी अस्पष्टता को स्पष्ट करती है।
