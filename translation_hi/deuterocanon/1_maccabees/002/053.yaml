lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: अपने संकट के समय
  rationale: यह स्वाभाविक हिन्दी में समय और यूसुफ के व्यक्तिगत कष्ट—दोनों को व्यक्त करता है; στενοχωρία की कठिन परिस्थिति का भाव बनाए रखता है।
- source_word: ἐφύλαξε
  choice: पालन किया
  rationale: आज्ञा के साथ हिन्दी में ‘पालन करना’ स्वाभाविक प्रयोग है और निष्ठापूर्ण आज्ञाकारिता का अर्थ देता है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: यूनानी में संज्ञा अनिश्चित/निर्दिष्ट उपपद के बिना है और किसी खास आज्ञा को स्पष्ट नहीं करती; मुख्य पाठ में संक्षिप्त धार्मिक-मौलिक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: κύριος Αἰγύπτου
  choice: मिस्र का स्वामी
  rationale: κύριος यहाँ परमेश्वर की उपाधि नहीं, बल्कि यूसुफ के ऊँचे अधिकार और पद को दर्शाता है; ‘स्वामी’ यूनानी की गरिमापूर्ण अभिव्यक्ति को निकटता से रखता है।
theological_decisions:
- issue: यूसुफ द्वारा मानी गई आज्ञा का संदर्भ
  choice: किसी विशिष्ट आज्ञा को निर्धारित किए बिना सामान्य रूप में ‘आज्ञा’
  alternative: पोतिफर की पत्नी को ठुकराने से संबंधित किसी विशेष आज्ञा का संकेत
  rationale: यूनानी पाठ यह नहीं बताता कि कौन-सी आज्ञा अभिप्रेत है। इसलिए अनुवाद उत्पत्ति 39 के संभावित संकेत को नकारता नहीं, पर उसे पाठ में स्पष्ट रूप से आरोपित भी नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण शैली। ‘मिस्र का स्वामी’ मूल की पद-संबंधी ऊँचाई बनाए रखता है, जबकि पादटिप्पणी ἐντολήν की वास्तविक अनिश्चितता सुरक्षित रखती है।
