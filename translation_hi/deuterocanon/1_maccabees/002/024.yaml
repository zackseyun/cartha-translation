  yaml_path: translation/deuterocanon/1_maccabees/002/024.yaml
  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: hi
  text: मत्तथियाह ने यह देखा तो वह जोश से भर उठा; उसका अंतर्मन काँप उठा,[a] और उसने न्याय के अनुसार[b] अपना क्रोध प्रकट किया। फिर दौड़कर उसने उसे वेदी पर वध कर डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके गुर्दे काँप उठे।” यह गहरे भीतरी उद्वेलन या भावना के लिए एक इब्रानी-शैली की अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: या, “न्याय के निर्णय के अनुसार” अथवा “विधान के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: जोश से भर उठा
  rationale: यहाँ क्रिया साधारण ईर्ष्या नहीं, बल्कि व्यवस्था के प्रति तीव्र और रोषपूर्ण उत्साह व्यक्त करती है। यह चयन प्रसंग के वाचा-संबंधी संकेत को बनाए रखता है।
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: उसकी अंतरात्मा काँप उठी
  rationale: यूनानी में शाब्दिक रूप से ‘उसके गुर्दे काँप उठे’ है; सामी प्रयोग में गुर्दे मनुष्य की गहरी आंतरिक भावनाओं का बिंब हैं। स्वाभाविक हिन्दी में ‘अंतरात्मा’ उस गहरे भीतरी उद्वेलन को व्यक्त करती है।
- source_word: ἀνήνεγκεν θυμόν
  choice: उसने अपना क्रोध प्रकट किया
  rationale: वाक्यांश क्रोध को भीतर से बाहर लाने या उसे कार्य में व्यक्त करने का भाव देता है। हिन्दी में यह रूप स्वाभाविक रहते हुए क्रिया की सक्रियता बचाता है।
- source_word: κατὰ τὸ κρίμα
  choice: न्याय के अनुसार
  rationale: κρίμα का अर्थ न्याय, निर्णय या दंडादेश हो सकता है। यह अनुवाद जानबूझकर खुला रखता है कि संकेत किसी विधि, न्यायिक निर्णय या दंड की ओर है।
- source_word: δραμὼν
  choice: दौड़कर आगे बढ़ा
  rationale: कृदंत तत्काल और तीव्र गति से लक्ष्य की ओर बढ़ने को दर्शाता है।
- source_word: ἔσφαξεν
  choice: घात कर दिया
  rationale: σφάζω हिंसक वध और कभी बलि-संबंधी काटे जाने का कठोर भाव रखता है। ‘घात कर दिया’ सामान्य ‘मार डाला’ से अधिक तीखा है और हिन्दी में गरिमापूर्ण भी है।
- source_word: ἐπὶ τὸν βωμόν
  choice: वेदी पर ही
  rationale: यह स्थान की चौंकाने वाली स्पष्टता बनाए रखता है; ‘ही’ हिन्दी में इसी वेदी पर किए गए वध पर बल देता है, बिना अर्थ बढ़ाए।
theological_decisions:
- issue: व्यवस्था के लिए उत्साह और न्यायिक वध के संकेत को कितना स्पष्ट किया जाए
  choice: जोश, न्याय और हिंसक घात की भाषा को बनाए रखना, पर कार्य को सीधे ‘व्यवस्था के अनुसार वैध दंड’ न कहना
  alternative: ‘वह क्रोधित हुआ और उसने व्यवस्था के अनुसार उसे दंड दिया’
  rationale: मूल पाठ इस कार्य को उत्साह और κρίμα की भाषा में प्रस्तुत करता है, किंतु κρίμα का निश्चित संदर्भ स्पष्ट नहीं करता। इसलिए अनुवाद नैतिक और धर्मवैधानिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गंभीर और कथात्मक शैली अपनाई गई है। ‘जोश से भर उठा’ धार्मिक उत्साह और रोष दोनों को वहन करता है; ‘न्याय के अनुसार’ जानबूझकर अस्पष्ट रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
