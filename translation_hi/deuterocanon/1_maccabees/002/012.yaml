translation:
  language: hi
  text: और देखो—हमारी पवित्र वस्तुएँ, हमारी शोभा और हमारी महिमा उजाड़ दी गई हैं, और अन्यजातियों ने उन्हें अपवित्र कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी उद्गार का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: τὰ ἅγια ἡμῶν
  choice: हमारी पवित्र वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन अभिव्यक्ति को किसी एक विशिष्ट अर्थ, जैसे केवल मंदिर या पवित्रस्थान, तक सीमित किए बिना प्रस्तुत करता है।
- source_word: ἡ καλλονὴ ἡμῶν
  choice: हमारी शोभा
  rationale: καλλονή की सुंदरता और गौरवपूर्ण भव्यता का संक्षिप्त, साहित्यिक रूप।
- source_word: ἡ δόξα ἡμῶν
  choice: हमारी महिमा
  rationale: δόξα का स्थापित और संदर्भानुकूल हिन्दी प्रतिशब्द।
- source_word: ἠρημώθη
  choice: उजाड़ दी गई हैं
  rationale: विध्वंस और निर्जन किए जाने के निष्क्रिय भाव को बनाए रखता है; संयुक्त कर्ता के अर्थगत बहुवचन के अनुसार हिन्दी क्रिया बहुवचन में है।
- source_word: ἔθνη
  choice: अन्यजातियों
  rationale: यहाँ इस्राएल से बाहर की जातियों/राष्ट्रों के सामूहिक धार्मिक-जातीय संदर्भ को व्यक्त करता है।
- source_word: ἐβεβήλωσαν
  choice: अपवित्र कर दिया है
  rationale: पवित्र वस्तुओं के दूषित या धर्मविरुद्ध उपयोग का भाव स्पष्ट करता है और यूनानी पूर्णकाल के परिणामी वर्तमान भाव को दर्शाता है।
theological_decisions:
- issue: τὰ ἅγια का आशय
  choice: हमारी पवित्र वस्तुएँ
  alternative: हमारा पवित्रस्थान
  rationale: मूल पाठ बहुवचन और अपेक्षाकृत व्यापक है; उसे केवल मंदिर या पवित्रस्थान मानना संभावित अर्थ को अनावश्यक रूप से सीमित करता।
- issue: ἔθνη की पहचान
  choice: अन्यजातियाँ
  alternative: राष्ट्र
  rationale: इस प्रसंग में बाहरी गैर-इस्राएली समुदायों का धार्मिक-जातीय विरोध प्रमुख है, जबकि यह रूप किसी खास जाति की पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, शोकपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की त्रिस्तरीय संरचना—पवित्र वस्तुएँ, शोभा, महिमा—और दो निष्क्रिय/परिणामी विनाशकारी क्रियाओं का तनाव सुरक्षित है।
