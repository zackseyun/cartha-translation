  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: hi
  text: और वह व्यवस्था के लिए जोश से भर उठा, ठीक वैसे ही जैसे पीनहास ने सालोम के पुत्र जाम्ब्री के विरुद्ध किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में नाम जाम्ब्री और सालोम हैं; गिनती 25 में जाम्ब्री अधिक प्रचलित रूप से सालू के पुत्र जिम्री के नाम से जाना जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: जोश से भर उठा
  rationale: यह भूतकालीन क्रिया यहाँ केवल मन की भावना नहीं, बल्कि निर्णायक कार्य में प्रकट हुए प्रबल उत्साह को बताती है। यह हिन्दी प्रयोग उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ νόμῳ
  choice: व्यवस्था के लिए
  rationale: सम्प्रदान कारक उत्साह के विषय या कारण को व्यक्त करता है। यहूदी तोराह के सन्दर्भ में ‘व्यवस्था’ स्पष्ट और प्रचलित बाइबलीय हिन्दी है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह पीनहास के ऐतिहासिक कार्य के साथ स्पष्ट और बलपूर्ण तुलना को बनाए रखता है।
- source_word: ἐποίησεν
  choice: किया था
  rationale: यूनानी क्रिया व्यापक अर्थ वाली है; ‘किया था’ उसे अनावश्यक व्याख्या के बिना रखता है और आगे का ‘के विरुद्ध’ उसके लक्ष्य को स्पष्ट करता है।
- source_word: Φινεὲς
  choice: पीनहास
  rationale: गिनती 25 के परिचित पात्र के लिए हिन्दी बाइबलों में प्रचलित नामरूप।
- source_word: τῷ Ζαμβρὶ
  choice: जाम्ब्री के विरुद्ध
  rationale: रूपतः यह सम्प्रदान कारक है, पर मुहावरे और गिनती 25 के संकेत में सम्बन्ध विरोधात्मक है। ‘के विरुद्ध’ प्रसंग को स्पष्ट करता है।
- source_word: υἱῷ Σαλώμ
  choice: जो सालोम का पुत्र था
  rationale: यह यूनानी पाठ के नामरूपों जाम्ब्री और सालोम को सुरक्षित रखते हुए सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: हिंसक उत्साह के प्रसंग में मत्तथियास और पीनहास की तुलना कितनी स्पष्ट रखी जाए
  choice: तुलना को बिना नरम किए या बढ़ाकर समझाए सीधे बनाए रखना
  alternative: संकेत की व्याख्या करते हुए भावानुवाद करना, अथवा हिंसा के अनुमोदन का आभास घटाने के लिए उत्साह की भाषा को नरम करना
  rationale: यूनानी पाठ मत्तथियास के उत्साह की तुलना गिनती 25 में पीनहास के कार्य से स्पष्ट रूप से करता है। अनुवाद को न तो पाठ में व्यक्त बात से अधिक अनुमोदन जोड़ना चाहिए, न इस कथात्मक और धर्मवैचारिक तनाव को कम करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पाठ। ‘जोश से भर उठा’ क्रिया की तीव्र और क्रियात्मक प्रकृति को व्यक्त करता है; नाम मुख्य पाठ में यूनानी साक्ष्य के अनुसार रखे गए हैं और परिचित इब्रानी रूप पाद-टिप्पणी में दिए गए हैं।
