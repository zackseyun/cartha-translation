  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: hi
  text: 'और उसी दिन उन्होंने यह निर्णय किया: “यदि कोई सब्त के दिन हमसे युद्ध करने आएगा, तो हम उसके विरुद्ध लड़ेंगे, और हम सब उस तरह नहीं मरेंगे, जैसे हमारे भाई छिपने के स्थानों में मरे थे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: उन्होंने यह निर्णय किया
  rationale: क्रिया का अर्थ विचार-विमर्श के बाद निश्चय करना है; यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: यदि कोई ... आएगा
  rationale: यह यूनानी रचना सार्वत्रिक शर्त व्यक्त करती है; हिन्दी में ‘यदि कोई’ उसी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: यह यहूदी विश्राम-दिन का मानक और संक्षिप्त हिन्दी रूप है।
- source_word: πολεμήσομεν κατέναντι αὐτοῦ
  choice: हम उसके विरुद्ध लड़ेंगे
  rationale: κατέναντι के विरोधात्मक भाव को स्पष्ट रखते हुए वाक्य को स्वाभाविक हिन्दी में रखा गया है।
- source_word: οὐ μὴ ἀποθάνωμεν πάντες
  choice: हम सब ... हरगिज़ नहीं मरेंगे
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘हरगिज़ नहीं’ से सुरक्षित रखा गया है।
- source_word: ἐν τοῖς κρυφοῖς
  choice: छिपने के स्थानों में
  rationale: बहुवचन विशेषण के संज्ञात्मक प्रयोग को जानबूझकर सामान्य रखा गया है; स्रोत केवल गुफाओं का स्पष्ट उल्लेख नहीं करता।
theological_decisions:
- issue: सब्त के दिन आत्मरक्षा का निर्णय
  choice: वर्णन को उनके ऐतिहासिक निर्णय के रूप में प्रस्तुत किया गया है
  alternative: इसे सार्वकालिक धार्मिक आदेश या सब्त-विधान की औपचारिक व्याख्या बनाना
  rationale: पद पात्रों के निर्णय का वृत्तांत देता है; अनुवाद को इससे आगे कोई सांप्रदायिक या विधिशास्त्रीय निष्कर्ष नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध है। प्रत्यक्ष कथन में स्रोत की शर्त, विरोध और प्रबल निषेध सुरक्षित रखे गए हैं।
