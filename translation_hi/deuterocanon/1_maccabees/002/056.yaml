lexical_decisions:
- source_word: Χαλὲβ
  choice: कालेब
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबलीय प्रयोग में प्रचलित रूप के अनुसार लिप्यंतरित किया गया है।
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: जब … गवाही दी
  rationale: ἐν के साथ प्रयुक्त सव्यय क्रियार्थक संज्ञा यहाँ समय अथवा परिस्थिति बताती है। ‘जब … गवाही दी’ आधुनिक हिन्दी में स्वाभाविक है और साक्ष्य देने का भाव बनाए रखता है।
- source_word: τῇ ἐκκλησίᾳ
  choice: सभा के सामने
  rationale: यहाँ ἐκκλησία इस्राएल की एकत्रित सभा को दर्शाता है, न कि बाद के अर्थ में मसीही कलीसिया को। ἐπιμαρτυρέω के साथ ‘सभा के सामने’ हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἔλαβε
  choice: पाया
  rationale: λαμβάνω यहाँ आवंटित विरासत को प्राप्त करने का अर्थ देता है। ‘पाया’ सहज हिन्दी है और बलपूर्वक लेने का भाव उत्पन्न नहीं करता।
- source_word: γῆν
  choice: भूमि
  rationale: γῆ उस भूमि को सूचित करता है जो कालेब को विरासत में मिली। ‘भूमि’ संदर्भ को स्पष्ट रखता है और यूनानी पाठ में निहित अर्थ से आगे नहीं जाता।
- source_word: κληρονομίαν
  choice: विरासत के रूप में
  rationale: κληρονομία उत्तराधिकार अथवा आवंटित संपत्ति को दर्शाता है। यह पदबंध परिणामसूचक अर्थ को स्पष्ट रखते हुए ‘उसकी’ जैसा अनुल्लिखित संबंधसूचक शब्द नहीं जोड़ता।
theological_decisions:
- issue: द्वितीय मंदिर काल के ऐतिहासिक संदर्भ में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मंडली; कलीसिया
  rationale: यह शब्द जंगल की यात्रा से जुड़ी स्मृति में इस्राएल के एकत्रित समुदाय को दर्शाता है। ‘सभा’ ऐतिहासिक अर्थ बनाए रखता है और ‘कलीसिया’ से उत्पन्न होने वाले कालभ्रम से बचाता है।
- issue: कालेब को भूमि मिलने में मानवीय प्राप्ति और विरासत का संबंध
  choice: भूमि को विरासत के रूप में पाया
  alternative: भूमि पर अधिकार कर लिया; अपनी विरासत के रूप में भूमि पाई
  rationale: यह अनुवाद ἔλαβε और κληρονομίαν दोनों को व्यक्त करता है, पर न तो बलपूर्वक अधिकार करने का भाव जोड़ता है और न यूनानी में अनुपस्थित ‘अपनी’ को सम्मिलित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में ‘जब … तब’ संरचना यूनानी कालवाचक संबंध को स्पष्ट करती है। ‘सभा’ ऐतिहासिक संदर्भ के अनुकूल है; ‘भूमि’ और ‘विरासत’ औपचारिकता तथा सुबोधता के बीच संतुलन रखते हैं।
