translation:
  language: hi
  text: कालेब ने जब सभा के सामने गवाही दी[a], तब उसे भूमि विरासत के रूप में मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने सभा में गवाही दी।”
