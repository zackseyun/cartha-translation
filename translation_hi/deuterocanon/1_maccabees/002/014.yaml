lexical_decisions:
- source_word: διέρρηξεν
  choice: फाड़ डाले
  rationale: यह क्रिया शोक या आक्रोश के संकेत के रूप में वस्त्र फाड़ने को व्यक्त करती है। ‘फाड़ डाले’ आधुनिक हिन्दी में इस तीव्र, जानबूझकर किए गए कार्य को स्वाभाविक ढंग से बताता है।
- source_word: τὰ ἱμάτια αὐτῶν
  choice: अपने कपड़े
  rationale: ἱμάτια सामान्यतः वस्त्रों को दर्शाता है। ‘अपने कपड़े’ सहज आधुनिक हिन्दी है और αὐτῶν के संबंध को स्पष्ट रखता है।
- source_word: περιεβάλοντο σάκκους
  choice: टाट ओढ़ लिया
  rationale: यह शोक के समय खुरदरे टाट के वस्त्र धारण करने की प्रथा का संकेत है। ‘टाट ओढ़ लिया’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा यूनानी बहुवचन का कृत्रिम शब्दशः अनुकरण नहीं करता।
- source_word: ἐπένθησαν
  choice: शोक मनाया
  rationale: क्रिया गहरे दुःख और शोक की अभिव्यक्ति बताती है। वस्त्र फाड़ने और टाट ओढ़ने के अनुष्ठानिक संदर्भ में ‘शोक मनाया’ उपयुक्त है।
- source_word: σφόδρα
  choice: बहुत
  rationale: यह क्रिया की तीव्रता बढ़ाता है। ‘बहुत’ स्पष्ट और स्वाभाविक है तथा मूल में निहित न होने वाला अतिरिक्त भाव नहीं जोड़ता।
- source_word: Ματταθίας
  choice: मत्तथियास
  rationale: यूनानी नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
