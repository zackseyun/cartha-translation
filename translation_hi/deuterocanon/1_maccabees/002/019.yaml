base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/019.yaml
  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
translation:
  language: hi
  text: तब मत्तथियाह ने उत्तर दिया और ऊँचे स्वर में कहा, “चाहे राजा के राज्य में[a] रहनेवाली सारी जातियाँ उसकी सुनें[b], और हर एक अपने पूर्वजों की उपासना से फिरकर उसकी आज्ञाओं को चुन ले,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद असामान्य है; उसका शब्दशः रूप है, “राजा के राज्य के घर में।” इसका अर्थ “राजा के राज्य-क्षेत्र में” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी आज्ञा मानें।” यूनानी में अधिक शब्दशः “उसकी सुनें” है, यद्यपि प्रसंग में आज्ञापालन का भाव निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में
  rationale: यह यूनानी पद का निकट और स्वाभाविक हिन्दी रूप है तथा कथन की सार्वजनिक दृढ़ता बनाए रखता है।
- source_word: ἔθνη
  choice: जातियाँ
  rationale: यहाँ आशय राजा के अधीन विभिन्न जनसमुदायों से है; ‘जातियाँ’ इस बहुवचन को बिना ‘गैर-यहूदी’ अर्थ थोपे व्यक्त करता है।
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: राजा के राज्य में
  rationale: यूनानी अभिव्यक्ति असामान्य और शब्दशः ‘राजा के राज्य के घर में’ है। मुख्य पाठ में अर्थगम्य हिन्दी रखी गई है और स्रोत की असामान्यता पादटिप्पणी में बताई गई है।
- source_word: ἀκούουσιν αὐτοῦ
  choice: उसकी सुनें
  rationale: ἀκούω का मूल अर्थ सुनना/किसी की सुनना है। प्रसंग में आज्ञापालन निहित है, पर उसे मुख्य पाठ में अधिक स्पष्ट बनाकर मूल की अर्थ-सीमा संकुचित नहीं की गई।
- source_word: ἀποστῆναι
  choice: से फिरकर
  rationale: यह अपनी पूर्व स्थिति या प्रथा से हटने का भाव देता है और बाद की पारिभाषिक धार्मिक शब्दावली आरोपित नहीं करता।
- source_word: λατρίας πατέρων αὐτοῦ
  choice: अपने पूर्वजों की उपासना
  rationale: λατρεία यहाँ धार्मिक आराधना/सेवा को सूचित करता है; ‘उपासना’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ᾑρετίσαντο
  choice: चुन ले
  rationale: क्रिया चुनने या वरीयता देने को व्यक्त करती है। शर्तसूचक वाक्य में हिन्दी की संगति के लिए बहुवचन कथन को वितरणात्मक ‘हर एक ... चुन ले’ के साथ रखा गया है।
- source_word: ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: उसकी आज्ञाओं को
  rationale: यूनानी में ἐν के साथ पद कुछ असामान्य है, पर क्रिया के संदर्भ में आशय राजा की आज्ञाओं को चुनने/अपनाने का है; ‘आज्ञाओं’ से उनका आधिकारिक स्वर बना रहता है।
theological_decisions:
- issue: राजकीय क्षेत्र के लिए असामान्य यूनानी पद को कितना शब्दशः रखा जाए
  choice: राजा के राज्य में
  alternative: राजा के राज्य के घर में; राजा के राज्य-क्षेत्र में
  rationale: शब्दशः रूप हिन्दी में भ्रामक और अप्राकृतिक होता। मुख्य पाठ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की असामान्य बनावट को सुरक्षित रखती है।
- issue: ἀκούουσιν को ‘सुनना’ या ‘आज्ञा मानना’ कहना
  choice: उसकी सुनें
  alternative: उसकी आज्ञा मानें
  rationale: प्रसंग अनुपालन का है, फिर भी यूनानी सामान्यतः सुनने वाली क्रिया प्रयोग करता है। ‘उसकी सुनें’ हिन्दी में सुनने और मानने दोनों की छाया रखता है और मूल की अर्थगत गुंजाइश बचाता है।
- issue: पैतृक धार्मिक आचरण से हटने की भाषा
  choice: अपने पूर्वजों की उपासना से फिरकर
  alternative: अपने पूर्वजों की उपासना का त्याग करके
  rationale: ‘से फिरकर’ विचलन को स्पष्ट करता है, पर मूल से अधिक निर्णायक या तकनीकी धर्मत्याग-संबंधी शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक घोषणा के अनुकूल रखी गई है। ‘मत्तथियाह’ नाम का निकट लिप्यंतरण है। पद अगले वाक्य/पद में जारी रहने वाला शर्तसूचक खंड है, इसलिए अंत में पूर्णविराम के बजाय अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद लगाए गए हैं।
