- source_word: ἔφυγον ... εἰς τὰ ὄρη
  choice: पहाड़ों में भाग गए
  rationale: ग्रीक क्रिया पलायन को और εἰς गंतव्य को व्यक्त करता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐγκατέλιπον
  choice: छोड़ गए
