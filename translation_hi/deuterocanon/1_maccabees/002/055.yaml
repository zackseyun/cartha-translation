lexical_decisions:
- source_word: Ἰησοῦς
  choice: यहोशू
  rationale: इस्राएल के विश्वासयोग्य पूर्वजों के इस ऐतिहासिक सार में संकेत नून के पुत्र यहोशू की ओर है; हिन्दी बाइबल परंपरा में यही स्थापित नाम है।
- source_word: ἐν τῷ πληρῶσαι
  choice: पूरा करते हुए
  rationale: ἐν के साथ आर्टिक्युलर इनफिनिटिव परिस्थिति, समय या साधन का भाव दे सकता है। ‘पूरा करते हुए’ स्वाभाविक हिन्दी में इस लचीलेपन को यथासंभव बनाए रखता है।
- source_word: λόγον
  choice: वचन
  rationale: λόγος यहाँ व्यापक और अनिर्दिष्ट है। ‘वचन’ इसकी संक्षिप्तता और संभावित दैवी संदर्भ को बचाता है, जबकि ‘आज्ञा’ या ‘प्रतिज्ञा’ किसी एक अर्थ को अनावश्यक रूप से निश्चित कर देंगे।
- source_word: ἐγένετο
  choice: पद पाया
  rationale: ἐγένετο का मूल भाव ‘हो गया/बना’ है। पदसूचक संज्ञा के साथ ‘पद पाया’ आधुनिक हिन्दी में स्वाभाविक है, पर बनने की मूल धारणा को बताने हेतु पादटिप्पणी दी गई है।
- source_word: κριτὴς
  choice: न्यायी
  rationale: κριτής का सीधा अर्थ न्याय करने वाला है। ‘न्यायी’ बाइबिल-ऐतिहासिक पद को सुरक्षित रखता है और केवल सामान्य ‘नेता’ कहने से अधिक सटीक है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: यह ἐν का सीधा अनुवाद है और ‘इस्राएल पर’ की अपेक्षा नेतृत्व के भाव को अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: यहोशू द्वारा पूरा किए गए λόγος का स्वरूप
  choice: ‘वचन’ कहकर अर्थ को व्यापक रखा गया।
  alternative: ‘आज्ञा,’ ‘प्रतिज्ञा,’ या ‘बात’
  rationale: यूनानी λόγος स्वयं इनमें से किसी एक अर्थ को निर्णायक नहीं बनाता; व्यापक अनुवाद मूल की धार्मिक और कथात्मक अस्पष्टता बनाए रखता है।
- issue: ἐν τῷ πληρῶσαι का समयसूचक या साधनसूचक भाव
  choice: ‘पूरा करते हुए’
  alternative: ‘जब उसने पूरा किया’ या ‘पूरा करने के द्वारा’
  rationale: यूनानी रचना दोनों प्रकार से समझी जा सकती है; मुख्य पाठ किसी एक संबंध को पूर्णतः निश्चित नहीं करता।
