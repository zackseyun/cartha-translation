  yaml_path: translation/deuterocanon/1_maccabees/002/038.yaml
  text: And they rose up against them in battle on the Sabbath[a], and they died—they and their wives and their children and their livestock—about a thousand persons.
translation:
  language: hi
  text: और वे सब्त के दिन युद्ध में उन पर चढ़ आए। तब वे, उनकी पत्नियाँ और उनके बच्चे—कुल मिलाकर लगभग एक हज़ार मनुष्य—और उनके मवेशी मर गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुल मिलाकर मनुष्यों की संख्या एक हज़ार तक थी”; यूनानी अभिव्यक्ति ठीक-ठीक गणना के बजाय अनुमानित ऊपरी सीमा बता सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτοὺς ἐν τῷ πολέμῳ
  choice: उन पर चढ़ाई करके युद्ध किया
  rationale: यह यूनानी पदबंध उनके विरुद्ध उठ खड़े होकर शत्रुतापूर्ण युद्ध करने को व्यक्त करता है। हिंदी में यह स्वाभाविक है और हमले के ढंग को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी रूप बहुवचन है, पर सब्त-संबंधी प्रयोग में किसी विशेष अवसर के सब्त के लिए ऐसा बहुवचन सामान्य है; प्रसंग एक निश्चित दिन हुए आक्रमण का है।
- source_word: ἀπέθανον
  choice: मर गए
  rationale: मूल क्रिया अकर्मक है—‘मर गए’। प्रसंग में शत्रु के हाथों मृत्यु निहित है, फिर भी ‘मार डाले गए’ कहने से अधिक स्पष्ट कर्मवाच्य अर्थ जोड़ जाता।
- source_word: τὰ κτήνη αὐτῶν
  choice: उनके मवेशी
  rationale: κτήνη पालतू अथवा संपत्ति के रूप में रखे जाने वाले पशुओं को दर्शाता है। ‘मवेशी’ आधुनिक हिंदी में उपयुक्त सामूहिक शब्द है।
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: मनुष्यों की संख्या लगभग एक हज़ार थी
  rationale: ψυχαί ἀνθρώπων यहाँ मनुष्यों की गिनती करता है और ἕως संख्या के साथ अनुमानित ऊपरी सीमा भी बता सकता है। मुख्य पाठ में स्वाभाविक अनुमान रखा गया है और वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई है।
