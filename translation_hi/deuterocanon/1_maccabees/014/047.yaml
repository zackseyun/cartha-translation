  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: hi
  text: और शमौन ने इसे स्वीकार किया और महायाजक के रूप में सेवा करने, यहूदियों और याजकों का सेनापति और एथनार्क[a] होने, और उन सबके ऊपर होने के लिए सहमत हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एथनार्क’ किसी जाति या जनसमुदाय के शासक अथवा प्रमुख के लिए प्रयुक्त एक ऐतिहासिक राजनीतिक उपाधि थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: इसे स्वीकार किया
  rationale: मध्यवाच्य क्रिया यहाँ पहले वर्णित पद अथवा व्यवस्था को स्वेच्छा से स्वीकार करने का बोध देती है; हिन्दी में निहित कर्म को ‘इसे’ से स्पष्ट किया गया है।
- source_word: εὐδόκησεν
  choice: सहमत हुआ
  rationale: संदर्भ में यह पदों को ग्रहण करने की स्वैच्छिक सहमति व्यक्त करता है; ‘प्रसन्न हुआ’ आशय को भटका सकता था।
- source_word: ἀρχιερατεύσαι
  choice: महायाजक के रूप में सेवा करने
  rationale: क्रियात्मक रूप केवल पदनाम नहीं, बल्कि महायाजक का कार्य करने को व्यक्त करता है।
- source_word: στρατηγός
  choice: सेनापति
  rationale: यह सैन्य नेतृत्व का पद है; ‘सेनापति’ स्वाभाविक और ऐतिहासिक रूप से उपयुक्त हिन्दी है।
- source_word: ἐθνάρχης
  choice: एथनार्क
  rationale: ऐतिहासिक राजनीतिक पद की विशिष्टता बनाए रखने के लिए लिप्यंतरण रखा गया है और पादटिप्पणी में अर्थ समझाया गया है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: यहाँ व्यापक जनसमुदाय का अर्थ संदर्भानुकूल है; ‘यहूदिया-निवासियों’ का भू-जातीय अर्थ भी संभव है।
- source_word: ἱερέων
  choice: याजकों
  rationale: बहुवचन संज्ञा का सीधा अनुवाद, जो यहूदियों के साथ एक अलग उल्लिखित समूह को दर्शाता है।
- source_word: προστῆσαι ἁπάντων
  choice: उन सबका नेतृत्व करने
  rationale: वाक्यांश का अर्थ सबके ऊपर नियुक्त होकर अगुवाई अथवा अध्यक्षता करना है; ‘नेतृत्व करना’ आधुनिक हिन्दी में स्वाभाविक है और अधिकार का भाव बनाए रखता है।
theological_decisions:
- issue: राजनीतिक पद ἐθνάρχης का अनुवाद
  choice: एथनार्क
  alternative: राष्ट्र-शासक / जाति का शासक
  rationale: तकनीकी ऐतिहासिक उपाधि को सामान्य ‘शासक’ में समतल करने के बजाय लिप्यंतरण से उसकी विशिष्टता सुरक्षित रहती है।
- issue: Ἰουδαίων का जातीय अथवा भू-जातीय अर्थ
  choice: यहूदियों
  alternative: यहूदिया-निवासियों
  rationale: राष्ट्रीय-राजनीतिक संदर्भ में जनसमुदाय का व्यापक अर्थ अधिक स्वाभाविक है, पर यूनानी शब्द की वास्तविक भू-जातीय संभावना को स्वीकार किया गया है।
- issue: προστῆσαι ἁπάντων में अधिकार का स्वरूप
  choice: उन सबका नेतृत्व करने
  alternative: उन सबके ऊपर होने / उन सबकी अध्यक्षता करने
  rationale: पाठ नेतृत्व और अधीनता का संबंध बताता है, पर उसके ठीक प्रशासनिक स्वरूप को निर्धारित नहीं करता; इसलिए किसी विशिष्ट शासन-व्यवस्था का आरोपण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल वाक्य-विन्यास रखा गया है। ‘महायाजक’, ‘सेनापति’ और ‘याजक’ प्रचलित धार्मिक-ऐतिहासिक पद हैं। तकनीकी पद ‘एथनार्क’ को समझाने के लिए पादटिप्पणी दी गई है।
