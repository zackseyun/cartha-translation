base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/018.yaml
  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
translation:
  language: hi
  text: और उन्होंने उसे काँसे की पट्टिकाओं पर लिख भेजा, ताकि वे उसके साथ उस मैत्री और संधि को नवीकृत करें जो उन्होंने उसके भाइयों यहूदा और योनातान के साथ स्थापित की थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काँसे के फलक।” यूनानी में काँसे की औपचारिक लेखन-पट्टिकाओं का उल्लेख है, जो सम्भवतः टिकाऊ सार्वजनिक या राजनयिक अभिलेख के लिए थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψαν
  choice: लिखवाया
  rationale: काँसे की पट्टिकाओं के संदर्भ में लेख उत्कीर्ण कराना स्वाभाविक है; यूनानी क्रिया मूलतः ‘लिखना’ कहती है, इसलिए अनुवाद अभिलेखन के भाव को संदर्भानुसार व्यक्त करता है।
- source_word: δέλτους χαλκᾶς
  choice: काँसे की पट्टिकाओं
  rationale: δέλτος लिखने की पट्टी या पट्टिका है और χαλκᾶς उसके काँसे से बने होने को बताता है; ‘पट्टिकाएँ’ औपचारिक और टिकाऊ राजनयिक अभिलेख के लिए सहज हिन्दी है।
- source_word: τοῦ ἀνανεώσασθαι
  choice: ताकि ... नया किया जाए
  rationale: सव्ययी क्रियारूप प्रयोजन व्यक्त करता है; यह हिन्दी में उद्देश्य को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: φιλίαν
  choice: मैत्री
  rationale: राजनयिक प्रसंग में यह औपचारिक मित्रतापूर्ण संबंध को सूचित करता है; ‘मैत्री’ गरिमापूर्ण और संक्षिप्त है।
- source_word: συμμαχίαν
  choice: संधि
  rationale: शब्द राजनीतिक-सैन्य गठबंधन को दर्शाता है; ‘संधि’ इस औपचारिक राजनयिक संबंध को सामान्य आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔστησαν
  choice: स्थापित की थी
  rationale: यहाँ क्रिया किसी संबंध या समझौते को कायम करने के अर्थ में है; ‘की थी’ उसके पहले स्थापित हो चुकने का काल-संबंध बनाए रखता है।
- source_word: πρὸς αὐτόν
  choice: उसके साथ
  rationale: संबंध और संधि के प्रसंग में πρὸς का स्वाभाविक हिन्दी रूप ‘के साथ’ है।
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: उसके भाइयों यहूदा और योनातान
  rationale: यह पदबंध यहूदा और योनातान की पहचान उसके भाइयों के रूप में करता है; हिन्दी में संबंध-सूचक पद को नामों से पहले रखना सहज है।
