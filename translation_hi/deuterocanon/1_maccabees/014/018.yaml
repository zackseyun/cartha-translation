  naturalness: The revised wording is idiomatic modern standard Hindi while retaining the formal diplomatic register. «नवीकृत करें» more naturally expresses the purposive infinitive than the passive construction «नया किया जाए».
  terminology: «काँसे की पट्टिकाएँ», «मैत्री», and «संधि» suitably preserve the formal documentary and diplomatic sense. The footnote’s alternative is corrected from the ungrammatical «काँसे की पट्टों पर» to «काँसे के फलक».
  issues:
