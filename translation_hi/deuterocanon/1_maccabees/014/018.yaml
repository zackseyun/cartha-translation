    issue: «उसके लिए» mistranslates πρὸς αὐτόν.
    rationale: In the immediate clause it means that the tablets were written/sent to him; in the treaty relation it is idiomatically 'with him,' not 'for him.'
  - severity: low
    issue: Footnote alternative has an incorrect Hindi construction.
    rationale: «काँसे की पट्टों पर» has mismatched gender and number; «काँसे के फलक» is a natural alternative for bronze plaques/tablets.
