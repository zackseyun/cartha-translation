- source_word: συγγραφαὶ
  choice: दस्तावेज़
  rationale: यह शब्द लिखित अभिलेखों या विधिक-प्रशासनिक लिखतों को सूचित कर सकता है; ‘दस्तावेज़’ बिना अनावश्यक संकीर्णता के उपयुक्त व्यापक शब्द है।
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: उसके नाम से
