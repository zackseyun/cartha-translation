  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: hi
  text: और यह कि वह पवित्र विषयों[a] की देखरेख करे, सब लोग उसकी बात मानें[b], देश के सभी दस्तावेज़ उसके नाम से लिखे जाएँ[c], और वह बैंगनी वस्त्र पहने और सोना धारण करे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान’ अथवा ‘पवित्र मामले।’ यूनानी में शाब्दिक रूप से ‘पवित्र चीज़ों’ है, जो पवित्र मामलों के लिए एक व्यापक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘सबके द्वारा सुना जाए’ है; यहाँ भाव है कि उसके अधिकार पर ध्यान दिया जाए या उसकी बात मानी जाए।
    reason: lexical_alternative
  - marker: c
    text: अर्थात देश के सभी आधिकारिक दस्तावेज़ उसके अधिकार के अधीन जारी किए जाएँ।
    reason: cultural_note
  - marker: d
    text: बैंगनी वस्त्र और सोना ऊँचे पद तथा आधिकारिक सम्मान के चिह्न थे।
    reason: cultural_note
