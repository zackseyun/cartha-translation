  choice: पवित्र वस्तुओं
  alternative: पवित्रस्थान; पवित्र विषयों
  rationale: संदर्भ मंदिर-संबंधी अधिकार की ओर संकेत कर सकता है, फिर भी यूनानी बहुवचन अभिव्यक्ति किसी एक भवन से अधिक व्यापक है। इसलिए अनुवाद उस व्यापकता और संभावित अस्पष्टता को बनाए रखता है।
