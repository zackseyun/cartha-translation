- source_word: πορφύραν
  choice: बैंजनी वस्त्र
  rationale: यूनानी में प्रतिष्ठित बैंजनी रंग या उससे बने परिधान का संकेत है। हिन्दी में ‘वस्त्र’ जोड़ने से पहनने का आशय स्पष्ट और स्वाभाविक होता है।
- source_word: χρυσοφορῇ
