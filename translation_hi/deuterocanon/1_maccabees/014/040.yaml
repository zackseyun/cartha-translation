  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन है और यहाँ औपचारिक राजनयिक संबंध-सूचक पद के रूप में प्रयुक्त हुआ है।
- source_word: ἀπήντησαν
  choice: स्वागत किया था
  rationale: शाब्दिक अर्थ ‘भेंट की’ है, पर राजदूतों के संदर्भ में आधिकारिक रूप से मिलने और ग्रहण करने का भाव है।
- source_word: πρεσβευταῖς
  choice: राजदूतों
  rationale: यह आधिकारिक प्रतिनिधियों के लिए स्वाभाविक और स्पष्ट आधुनिक हिन्दी शब्द है।
- source_word: ἐνδόξως
  choice: सम्मानपूर्वक
  rationale: यह प्रतिष्ठापूर्ण और आदरयुक्त व्यवहार को सहज हिन्दी में व्यक्त करता है।
