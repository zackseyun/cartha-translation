  choice: भाई
  alternative: बंधु या भाई-बहन
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है और औपचारिक संबंध की उपाधि है; इसलिए उसके लिंग और संभावित राजनयिक तनाव को विस्तृत या निष्प्रभावी नहीं किया गया।
