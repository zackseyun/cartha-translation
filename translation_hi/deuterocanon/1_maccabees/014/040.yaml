  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
translation:
  language: hi
  text: क्योंकि यह सुनने में आया था कि रोमी यहूदियों को मित्र, संधि-सहयोगी और भाई कहकर संबोधित करते हैं, और उन्होंने शमौन के दूतों का सम्मानपूर्वक स्वागत किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने शमौन के दूतों से सम्मानपूर्वक भेंट की थी।” यूनानी क्रिया का शाब्दिक अर्थ “भेंट की” है, पर इस प्रसंग में वह आधिकारिक राजनयिक स्वागत को दर्शाती है।
    reason: lexical_alternative
