  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: hi
  text: उसने बहुत-से बंदियों को इकट्ठा किया और गेज़ेर, बेत-सूर और दुर्ग[a] पर अधिकार कर लिया। उसने उसमें से अशुद्धताओं को दूर कर दिया, और उसका विरोध करने वाला कोई न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अक्रा,” अर्थात यरूशलेम का विशिष्ट किलाबंद गढ़।
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγεν αἰχμαλωσίαν πολλήν
  choice: बहुत-से बंदियों को इकट्ठा किया
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘बहुत बंदी अवस्था/बंदी-समूह’ हो सकता है, पर प्रसंग में युद्ध में पकड़े गए लोगों का संकेत है। यह हिन्दी रूप अर्थ को स्पष्ट रखते हुए क्रिया की ठोस छवि भी बनाए रखता है।
- source_word: ἐκυρίευσεν
  choice: पर अधिकार कर लिया
  rationale: क्रिया किसी स्थान पर प्रभुत्व या नियंत्रण प्राप्त करने को व्यक्त करती है; ‘अधिकार कर लिया’ सैन्य-राजनीतिक प्रसंग में स्वाभाविक है और दीर्घकालीन शासन का अनावश्यक संकेत नहीं देता।
- source_word: Γαζάρων
  choice: गेज़ेर
  rationale: यह स्थान प्रचलित सामी नाम गेज़ेर से पहचाना जाता है; हिन्दी में पहचान योग्य मानक लिप्यंतरण अपनाया गया है।
- source_word: Βαιθσούρων
  choice: बेत-सूर
  rationale: स्थान-नाम के सामी रूप को आधुनिक हिन्दी में स्पष्ट और प्रचलित ढंग से लिप्यंतरित किया गया है।
- source_word: τῆς ἄκρας
  choice: दुर्ग
  rationale: ἄκρα का सामान्य अर्थ किला या दुर्ग है। मक्काबी प्रसंग में यह यरूशलेम के विशिष्ट ‘अक्रा’ दुर्ग का नाम भी हो सकता है; उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς
  choice: उसमें से सारी अशुद्धता दूर कर दी
  rationale: बहुवचन ἀκαθαρσίας अशुद्ध करने वाली वस्तुओं या अशुद्धता के विविध रूपों का सामूहिक संकेत दे सकता है। ‘सारी अशुद्धता’ स्वाभाविक हिन्दी में उसके धार्मिक-सांस्कारिक आशय को सुरक्षित रखता है। स्त्रीलिंगी सर्वनाम αὐτῆς का निकटतम संदर्भ दुर्ग है।
- source_word: οὐκ ἦν ὁ ἀντικείμενος αὐτῷ
  choice: उसका विरोध करने वाला कोई न था
  rationale: यह रूप विरोध में खड़े होने वाले किसी व्यक्ति की अनुपस्थिति को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀκαθαρσίαι का धार्मिक-सांस्कारिक अर्थ
  choice: सारी अशुद्धता
  alternative: अपवित्र वस्तुएँ / अशुद्धताएँ
  rationale: दुर्ग की सफाई में धार्मिक अपवित्रीकरण का भाव संभव है। ‘अशुद्धता’ उस आयाम को बनाए रखता है, पर यूनानी से अधिक विशिष्ट विवरण नहीं जोड़ता।
- issue: ἄκρα सामान्य संज्ञा है या विशिष्ट स्थान-नाम
  choice: मुख्य पाठ में ‘दुर्ग’
  alternative: ‘अक्रा’
  rationale: यूनानी शब्द सामान्य संज्ञा के रूप में ‘दुर्ग’ हो सकता है, जबकि ऐतिहासिक संदर्भ में यरूशलेम का विशिष्ट अक्रा दुर्ग भी अभिप्रेत हो सकता है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी वास्तविक वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। स्थान-नामों में पहचान योग्य हिन्दी लिप्यंतरण और सैन्य प्रसंग में संक्षिप्त, स्वाभाविक वाक्य-विन्यास अपनाया गया है। पादटिप्पणी-चिह्न को ‘दुर्ग’ के साथ रखा गया है, क्योंकि वैकल्पिक पाठ उसी यूनानी शब्द ἄκρα से संबंधित है।
