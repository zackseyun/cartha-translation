translation:
  language: hi
  text: 'और यह लेख की प्रतिलिपि है: एलूल की अठारहवीं तारीख को, एक सौ बहत्तरवें वर्ष में—यह महायाजक शमौन के कार्यकाल का तीसरा वर्ष था—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह शब्द किसी लिखित पाठ की नकल या दूसरी प्रति को दर्शाता है; औपचारिक दस्तावेज़ के संदर्भ में ‘प्रतिलिपि’ स्वाभाविक और सटीक है।
- source_word: γραφῆς
  choice: लेख
  rationale: यहाँ अर्थ पवित्रशास्त्र नहीं, बल्कि एक आधिकारिक लिखित अभिलेख है। ‘लेख’ मूल के व्यापक अर्थ को बनाए रखता है और हिंदी में सुबोध है।
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  choice: एलूल महीने की अठारहवीं तारीख को
  rationale: क्रमवाचक संख्या और महीने के नाम से बनी तारीख को स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है; एलूल का लिप्यंतरण सुरक्षित रखा गया है।
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ बहत्तरवें वर्ष में
  rationale: यूनानी काल-निर्धारण सूत्र का सीधा और स्वाभाविक हिंदी रूप।
- source_word: τοῦτο τρίτον ἔτος
  choice: यह ... तीसरा वर्ष था
  rationale: मूल की व्याख्यात्मक उपवाक्य-संरचना को स्पष्ट हिंदी क्रिया के साथ रखा गया है।
- source_word: ἐπὶ Σίμωνος
  choice: शमौन के अधीन
  rationale: ἐπί के साथ संबंधकारक यहाँ किसी पदाधिकारी के कार्यकाल में होने का बोध देता है; ‘के अधीन’ उस काल-निर्धारण को संक्षेप में व्यक्त करता है।
- source_word: τοῦ ἀρχιερέως
  choice: महायाजक
  rationale: यह यहूदी प्रधान याजकीय पद के लिए प्रचलित और सटीक हिंदी पद है।
theological_decisions:
- issue: इस प्रसंग में γραφή का स्वरूप
  choice: लेख
  alternative: दस्तावेज़
  rationale: कानूनी-ऐतिहासिक संदर्भ में यह किसी आधिकारिक लिखित अभिलेख को बताता है, न कि ‘पवित्रशास्त्र’ को। ‘लेख’ मूल की शब्दगत व्यापकता बनाए रखता है, जबकि संदर्भ उसके आधिकारिक स्वरूप को स्पष्ट करता है।
