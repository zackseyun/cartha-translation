lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν αὐτούς
  choice: उनसे लड़नेवाला कोई न रहा
  rationale: 'ἐξέλιπεν के साथ पुरुषवाचक एकवचन कृदंत πολεμῶν को कर्ता के रूप में समझना स्वाभाविक है: उनसे लड़ने वाला व्यक्ति समाप्त हो गया, अर्थात कोई ऐसा व्यक्ति न रहा। यह ऐतिहासिक संदर्भ में सहज हिन्दी भी है।'
- source_word: ἐπὶ τῆς γῆς
  choice: देश में
  rationale: यहाँ γῆ का आशय राजनीतिक-भौगोलिक क्षेत्र या देश है; ‘धरती पर’ सम्भव है, पर संदर्भ में अनावश्यक रूप से विश्वव्यापी अर्थ दे सकता है।
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: उनके राजा
  rationale: सम्बन्धकारक αὐτῶν को यथासम्भव सीधे रूप में रखा गया है और यह पूर्वोक्त विरोधियों से जुड़े राजाओं की ओर संकेत करता है।
- source_word: συνετρίβησαν
  choice: कुचल दिए गए
  rationale: निष्क्रिय क्रिया निर्णायक टूटने या पराजित किए जाने का सशक्त बिम्ब रखती है; ‘कुचल दिए गए’ उस तीव्रता को बनाए रखता है।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: यह सामान्य कालवाचक अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
