  text: और राजा देमेत्रियुस ने इन बातों के अनुसार उसके महायाजक-पद की पुष्टि की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησεν
  choice: पुष्टि की
  rationale: संदर्भ में क्रिया किसी पद पर शिमोन की स्थिति को राजकीय रूप से मान्य और स्थिर करने का भाव देती है। ‘पुष्टि की’ यह अर्थ व्यक्त करती है और यह संकेत नहीं देती कि महायाजक का पद पहली बार बनाया गया था।
- source_word: ἀρχιερωσύνην
  choice: महायाजक-पद
  rationale: यह संज्ञा महायाजक के पद या गरिमा को दर्शाती है, केवल याजकीय कार्य को नहीं। ‘महायाजक-पद’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κατὰ ταῦτα
  choice: इसी के अनुसार
  rationale: यह पदबंध पिछली बातों, व्यवस्थाओं या शर्तों की ओर संकेत करता है। ‘इसी के अनुसार’ उसके पश्चदर्शी संबंध को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: βασιλεὺς Δημήτριος
  choice: राजा दिमेत्रियुस
  rationale: उपाधि के बाद नाम रखना मानक और स्वाभाविक हिन्दी क्रम है; यूनानी नाम का रूप भी पहचाने जाने योग्य ढंग से सुरक्षित रहता है।
- source_word: αὐτῷ
  choice: उसके
  rationale: हिन्दी वाक्य-विन्यास में ‘उसके महायाजक-पद की पुष्टि की’ यूनानी संप्रदान कारक का स्वाभाविक रूपांतरण है और उसी व्यक्ति के पद की पुष्टि का अर्थ स्पष्ट करता है।
