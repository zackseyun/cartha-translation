  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
translation:
  language: hi
  text: रोम में[a] और स्पार्टा तक भी लोगों ने सुना कि योनातान मर गया था, और वे बहुत शोकित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में ‘सुना’ की क्रिया एकवचन में है, जबकि इसके बाद ‘वे शोकित हुए’ बहुवचन में है। अनुवाद सामूहिक अर्थ व्यक्त करता है: रोम में और स्पार्टा तक के लोगों ने यह समाचार सुना।'
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: लोगों ने सुना
  rationale: प्राप्त यूनानी पाठ में क्रिया एकवचन है, पर आगे बहुवचन ἐλυπήθησαν आता है और प्रसंग रोम तथा स्पार्टा के लोगों की सामूहिक प्रतिक्रिया बताता है। इसलिए हिन्दी में निहित सामूहिक कर्ता स्पष्ट किया गया है।
- source_word: ἐν Ῥώμῃ
  choice: रोम में
  rationale: ἐν के साथ नगर का नाम सीधा स्थानवाचक अर्थ देता है।
- source_word: καὶ ἕως Σπάρτης
  choice: और यहाँ तक कि स्पार्टा तक
  rationale: ἕως के साथ संबंधकारक भौगोलिक विस्तार, अर्थात समाचार के स्पार्टा तक पहुँचने, को व्यक्त करता है; 'यहाँ तक कि' इस दूरगामी विस्तार पर बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀπέθανεν
  choice: मर गया था
  rationale: समाचार सुनने से पहले योनातान की मृत्यु हो चुकी थी, इसलिए हिन्दी का पूर्ण भूतकाल प्रसंगानुकूल है।
- source_word: ἐλυπήθησαν σφόδρα
  choice: वे बहुत शोकित हुए
  rationale: ἐλυπήθησαν गहरे दुःख की प्रतिक्रिया और σφόδρα उसकी तीव्रता व्यक्त करता है; यह वाक्यांश आधुनिक, गरिमापूर्ण हिन्दी में दोनों को सुरक्षित रखता है।
