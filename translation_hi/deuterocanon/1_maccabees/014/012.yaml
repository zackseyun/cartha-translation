  yaml_path: translation/deuterocanon/1_maccabees/014/012.yaml
  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: hi
  text: और हर कोई अपनी अंगूर की बेल और अपने अंजीर के पेड़ के नीचे बैठा था[a], और उन्हें डराने वाला कोई नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्दावली शांति और सुरक्षा के एक बाइबलीय मुहावरे की प्रतिध्वनि है; तुलना करें 1 राजा 4:25 और मीका 4:4।
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: बैठा था
  rationale: यह ठोस रूप से निश्चिंत होकर बैठे होने का चित्र बनाए रखता है और शांति के बाइबलीय मुहावरे को अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: ἕκαστος
  choice: हर कोई
  rationale: यह मूल के वितरणात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ऐसा पुल्लिंग शब्द नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: ὑπὸ
  choice: के नीचे
  rationale: स्थान-सूचक अर्थ तथा इस परिचित बाइबलीय अभिव्यक्ति, दोनों के लिए यही स्वाभाविक हिन्दी है।
- source_word: ἄμπελον
  choice: अंगूर की बेल
  rationale: आधुनिक हिन्दी में यह अर्थ को स्पष्ट रखते हुए मूल कृषि-चित्र को सुरक्षित रखता है।
- source_word: συκῆν
  choice: अंजीर का पेड़
  rationale: यह वृक्ष के लिए सटीक और सहज हिन्दी पद है।
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: डराने वाला कोई नहीं था
  rationale: संज्ञा की तरह प्रयुक्त कृदंत का स्वाभाविक हिन्दी रूप है और भय उत्पन्न करने के कारणात्मक अर्थ को बनाए रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह उस समुदाय की ओर लौटता है जिसके प्रत्येक सदस्य की सुरक्षा का वर्णन किया गया है।
theological_decisions:
- issue: ‘अपनी अंगूर की बेल और अपने अंजीर के पेड़ के नीचे’ वाला अंतर्पाठीय शांति-सूत्र
  choice: मुख्य पाठ में कृषि-संबंधी चित्र को शब्दशः बनाए रखा गया है।
  alternative: इसे सामान्य रूप से शांति, समृद्धि और सुरक्षा का कथन बनाकर प्रस्तुत करना।
  rationale: यह वाक्यांश शांति और सुरक्षा का पहचाना हुआ बाइबलीय मुहावरा है। मूल चित्र को बनाए रखने से अन्य धर्मग्रंथीय स्थलों की प्रतिध्वनि सुरक्षित रहती है और पाठ में व्याख्या नहीं मिलाई जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘हर कोई’ वितरणात्मक अर्थ देता है; ‘बैठा था’ मूल के ठोस चित्र और शांत सुरक्षा के भाव को बनाए रखता है।
