  text: Then Simon rose up and fought for his nation[a], and spent much of his own money, and armed the men of his nation's forces[b], and gave them wages.
translation:
  language: hi
  text: तब शमौन उठ खड़ा हुआ[b] और अपने राष्ट्र[a] के लिए लड़ा। उसने अपना बहुत-सा धन खर्च किया, अपने राष्ट्र के सैन्य बल के पुरुषों को हथियारों से सुसज्जित किया और उन्हें वेतन दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ἔθνος का अनुवाद यहाँ “प्रजा” या “लोग” भी किया जा सकता है; “राष्ट्र” संदर्भ के सामूहिक राजनीतिक भाव को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: स्रोत के मुद्रित पाठ में ἀνέστησενσεν है, जिसमें संभवतः एक अक्षरांश भूल से दोहराया गया है; आशय है कि शमौन “उठ खड़ा हुआ” या “उठा।”
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा के क्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀνέστησενσεν
  choice: उठ खड़ा हुआ
  rationale: मुद्रित रूप में अक्षरांश की पुनरावृत्ति प्रतीत होती है; आशय ἀνέστησεν, अर्थात उठने और सक्रिय होने से है।
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: अपने राष्ट्र के लिए लड़ा
  rationale: περὶ यहाँ किसी की ओर से या उसकी रक्षा के लिए लड़ने का भाव देता है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: संदर्भ में यह यहूदी लोगों को सामूहिक राजनीतिक-राष्ट्रीय निकाय के रूप में दर्शाता है; ‘प्रजा’ या ‘लोग’ भी संभव है।
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: अपना बहुत-सा धन खर्च किया
  rationale: यह निजी साधनों में से बड़ी मात्रा खर्च करने का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ὡπλοδότησεν
  choice: हथियार दिए
  rationale: क्रिया का अर्थ हथियारों से सुसज्जित करना या हथियार उपलब्ध कराना है।
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: अपने राष्ट्र की सेना के पुरुषों
  rationale: δύναμις का यहाँ सैन्य बल अर्थ है और ἄνδρας के स्पष्ट पुरुषवाची संदर्भ को बनाए रखा गया है।
- source_word: ὀψώνια
  choice: वेतन
  rationale: सैन्य संदर्भ में यह सैनिकों के नियमित पारिश्रमिक या रसद को सूचित कर सकता है; यहाँ ‘वेतन’ सबसे स्वाभाविक है।
theological_decisions:
- issue: यहूदी राष्ट्रीय संदर्भ में ἔθνος का अनुवाद
  choice: राष्ट्र
  alternative: प्रजा / लोग
  rationale: पद में यहूदी समुदाय की सामूहिक राजनीतिक पहचान और उसकी रक्षा पर बल है; ‘राष्ट्र’ उस अर्थ को बनाए रखता है, बिना आधुनिक राष्ट्रवाद आरोपित किए।
- issue: τοὺς ἄνδρας में पुरुषवाची उल्लेख
  choice: सेना के पुरुषों
  alternative: सैनिकों / योद्धाओं
  rationale: यूनानी पाठ स्पष्ट रूप से पुरुषों का उल्लेख करता है, इसलिए इसे लिंग-तटस्थ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। छोटे वाक्यों से सैन्य और आर्थिक कार्रवाइयों का क्रम स्पष्ट किया गया है; ‘शमौन’ नाम का प्रचलित हिन्दी बाइबलीय रूप है।
