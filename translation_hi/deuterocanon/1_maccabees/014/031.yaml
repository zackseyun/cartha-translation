  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: hi
  text: और उनके शत्रुओं ने उनके देश पर चढ़ाई करने की योजना बनाई, ताकि उनके देश को नष्ट कर दें और उनके पवित्र स्थानों[a] पर हाथ बढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके पवित्रस्थान” अथवा “उनकी पवित्र वस्तुओं”; यूनानी में बहुवचन है।
    reason: τὰ ἅγια पवित्र स्थानों, पवित्रस्थान या पवित्र वस्तुओं की ओर संकेत कर सकता है।
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: योजना बनाई
  rationale: यह क्रिया सोच-विचारकर कोई इरादा या योजना बनाने को व्यक्त करती है; प्रसंग में शत्रुओं की आक्रमणकारी योजना अभिप्रेत है।
- source_word: ἐμβατεῦσαι εἰς τὴν χώραν
  choice: उनके देश पर चढ़ाई करने
  rationale: ἐμβατεύω का मूल अर्थ भीतर प्रवेश करना है, पर सैन्य और शत्रुतापूर्ण प्रसंग में ‘चढ़ाई करना’ स्वाभाविक हिन्दी है और आक्रमण का भाव स्पष्ट करता है।
- source_word: χώραν
  choice: देश
  rationale: ‘देश’ दोनों occurrences में स्वाभाविक है और यूनानी पाठ की पुनरावृत्ति को बनाए रखता है।
- source_word: τοῦ ἐκτρῖψαι
  choice: ताकि ... नष्ट कर दें
  rationale: यह उद्देश्य सूचक रचना है; ἐκτρίβω पूर्ण विनाश या उजाड़ देने का प्रबल भाव रखता है, जिसे यहाँ गरिमापूर्ण और स्पष्ट रूप में ‘नष्ट कर दें’ कहा गया है।
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπὶ
  choice: पर हाथ बढ़ाएँ
  rationale: शाब्दिक बिंब को सुरक्षित रखते हुए यह वाक्यांश शत्रुतापूर्ण हस्तक्षेप या आक्रमण का संकेत देता है, पर उसकी ठीक विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὰ ἅγια αὐτῶν
  choice: उनके पवित्र स्थानों
  rationale: नपुंसकलिंग बहुवचन τὰ ἅγια को बहुवचन ‘पवित्र स्थानों’ से व्यक्त किया गया है; इससे उसे बिना आवश्यकता एकवचन ‘पवित्रस्थान’ नहीं बनाया जाता।
theological_decisions:
- issue: उपासना-संबंधी प्रसंग में τὰ ἅγια का अर्थ
  choice: उनके पवित्र स्थानों
  alternative: उनका पवित्रस्थान; उनकी पवित्र वस्तुएँ
  rationale: यूनानी रूप बहुवचन है और पवित्र परिसरों, स्थानों या वस्तुओं को सूचित कर सकता है। मुख्य पाठ बहुवचन को सुरक्षित रखता है और वास्तविक शाब्दिक अस्पष्टता को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ऐतिहासिक शैली रखी गई है। ‘चढ़ाई करना’ सैन्य प्रसंग को स्वाभाविक बनाता है, जबकि ‘हाथ बढ़ाना’ मूल यूनानी बिंब और उसके खुले अर्थ को सुरक्षित रखता है।
