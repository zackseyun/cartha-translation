translation:
  language: hi
  text: और उसने अपने राष्ट्र की सीमाएँ बढ़ाईं और देश पर अधिकार कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: बढ़ाईं
  rationale: πλατύνω का मूल अर्थ चौड़ा या विस्तृत करना है; सीमाओं के संदर्भ में ‘सीमाएँ बढ़ाईं’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: τὰ ὅρια
  choice: सीमाएँ
  rationale: ὅρια भौगोलिक सीमा-रेखाओं या सरहदों को दर्शाता है; आधुनिक मानक हिन्दी में ‘सीमाएँ’ गरिमापूर्ण और स्पष्ट है।
- source_word: τῷ ἔθνει αὐτοῦ
  choice: अपने राष्ट्र की
  rationale: ἔθνος यहाँ राजनीतिक-सामुदायिक इकाई को सूचित करता है। यूनानी में हित/संबंध का दत्तिव है; हिन्दी में ‘अपने राष्ट्र की सीमाएँ’ उसी आशय को सहज रूप से व्यक्त करता है।
- source_word: ἐκράτησεν
  choice: अधिकार कर लिया
  rationale: κρατέω के साथ संबंधकारक यहाँ किसी क्षेत्र को अपने नियंत्रण में लेने या उस पर प्रभुत्व स्थापित करने का भाव देता है; ‘अधिकार कर लिया’ इस सक्रिय और परिणामी अर्थ को संक्षेप में रखता है।
- source_word: τῆς χώρας
  choice: देश पर
  rationale: χώρα का अर्थ भूमि, प्रदेश या देश हो सकता है। यहाँ व्यापक भूभाग के लिए ‘देश’ उपयुक्त है और ‘सीमाएँ’ के साथ अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
