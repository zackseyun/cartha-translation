base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/021.yaml
  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: hi
  text: हमारी प्रजा के पास भेजे गए दूतों[a] ने हमें आपके गौरव और सम्मान के विषय में बताया, और उनके आने पर हम आनन्दित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी प्रजा के पास भेजे गए दूतमंडल ने हमें बताया ...।” यूनानी पद का अर्थ राजनयिक मिशन अथवा स्वयं दूत, दोनों हो सकता है; मुख्य पाठ में “दूतों” रखा गया है, क्योंकि आगे “उनके आने” का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι
  choice: दूतों
  rationale: यूनानी पद का रूप राजनयिक मिशन अथवा उसके प्रतिनिधियों की ओर संकेत कर सकता है। आगे आए बहुवचन ‘उनके’ और आगमन के उल्लेख के कारण मुख्य पाठ में व्यक्तिवाचक बहुवचन ‘दूतों’ स्वाभाविक है।
- source_word: οἱ ἀποσταλέντες
  choice: भेजे गए
  rationale: कृदन्त दूतों के पहले भेजे जाने को व्यक्त करता है; हिन्दी में ‘भेजे गए’ संक्षिप्त और स्वाभाविक है।
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: हमारी प्रजा के पास
  rationale: δῆμος नागरिक-राजनीतिक समुदाय को सूचित करता है। ‘प्रजा’ इस औपचारिक पत्र के संदर्भ में उस सामूहिक अर्थ को सहज रूप से व्यक्त करती है।
- source_word: ἀπήγγειλαν ἡμῖν
  choice: हमें ... बताया
  rationale: क्रिया औपचारिक रूप से समाचार देने या प्रतिवेदन करने का भाव रखती है। ‘बताया’ सामान्य पाठक के लिए सहज है और संदर्भ में पर्याप्त औपचारिक बना रहता है।
- source_word: περὶ τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: आपके गौरव और सम्मान के विषय में
  rationale: δόξα और τιμή यहाँ सार्वजनिक प्रतिष्ठा और आदर के युग्म हैं। ‘गौरव और सम्मान’ सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: ηὐφράνθημεν
  choice: हम आनन्दित हुए
  rationale: यह क्रिया प्रबल प्रसन्नता प्रकट करती है; ‘आनन्दित हुए’ औपचारिक पत्र की गरिमा बनाए रखता है।
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: उनके आने पर
  rationale: ἐφόδος का अर्थ यहाँ आगमन या आना है। ‘उनके आने पर’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि यह वापसी थी या पहली भेंट।
