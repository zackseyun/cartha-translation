  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: hi
  text: उसने यहूदिया के नगरों को और यहूदिया की सीमा पर स्थित बेत-सूर को भी किलेबंद किया, जहाँ पहले शत्रुओं के हथियार थे; और उसने वहाँ यहूदी पुरुषों[a] का एक रक्षक दल तैनात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के पुरुषों।” यूनानी शब्द Ἰουδαίους यहाँ जातीय-धार्मिक पहचान (“यहूदी”) या प्रादेशिक पहचान (“यहूदिया के”)—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: किलेबंद किया
  rationale: यह क्रिया नगरों और सीमावर्ती गढ़ को रक्षात्मक रूप से सुदृढ़ करने का सैन्य भाव व्यक्त करती है।
- source_word: πόλεις
  choice: नगरों
  rationale: यह सामान्य अर्थ ‘नगर’ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Βαιθσουρὰμ
  choice: बेत-सूर
  rationale: यह स्थान-नाम मूल सेमिटिक रूप के निकट और हिन्दी बाइबलीय नाम-परंपरा के अनुरूप है।
- source_word: ἐπὶ τῶν ὁρίων
  choice: सीमा पर स्थित
  rationale: यूनानी बहुवचन सीमा-प्रदेश का संकेत देता है; हिन्दी में एकवचन ‘सीमा’ अधिक स्वाभाविक है और स्थानगत अर्थ सुरक्षित रखता है।
- source_word: ὅπλα
  choice: हथियार
  rationale: यह सुलभ आधुनिक हिन्दी में सैन्य अस्त्र-शस्त्र का सीधा अर्थ देता है।
- source_word: πολεμίων
  choice: शत्रुओं
  rationale: संबंधकारक रूप बताता है कि हथियार विरोधी पक्ष के थे।
- source_word: τὸ πρότερον
  choice: पहले
  rationale: पूर्व स्थिति का संक्षिप्त और स्वाभाविक कथात्मक संकेत है।
- source_word: ἔθετο
  choice: तैनात कर दी
  rationale: φρουράν के साथ इसका अर्थ किसी सैन्य दल को नियत स्थान पर स्थापित करना है।
- source_word: φρουρὰν
  choice: एक सैनिक चौकी
  rationale: संदर्भ में यह स्थान की अपेक्षा वहाँ नियुक्त रक्षक सैन्य दल का बोध कराता है; ‘सैनिक चौकी’ हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἄνδρας Ἰουδαίους
  choice: यहूदी पुरुषों
  rationale: ἄνδρας का पुरुषवाचक अर्थ स्पष्ट रखा गया है। Ἰουδαίους यहाँ जातीय-धार्मिक या प्रादेशिक पहचान, दोनों का सूचक हो सकता है।
theological_decisions:
- issue: Ἰουδαίας और Ἰουδαίους का भेद
  choice: यहूदिया / यहूदी पुरुष
  alternative: यहूदिया / यहूदिया के पुरुष
  rationale: स्थानवाचक Ἰουδαίας को ‘यहूदिया’ कहना स्पष्ट है। Ἰουδαίους की जातीय-धार्मिक और प्रादेशिक दोनों संभावनाएँ हैं; मुख्य पाठ में स्वाभाविक ‘यहूदी पुरुष’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण ऐतिहासिक-सैन्य शैली अपनाई गई है। वाक्य की यूनानी समन्वयी संरचना बनाए रखते हुए हिन्दी में पठनीयता के लिए अर्धविराम लगाया गया है।
