lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: यह सूचना मिलने को सीधे और स्वाभाविक ढंग से व्यक्त करता है तथा सूचना के माध्यम के बारे में मूल से अधिक कुछ नहीं कहता।
- source_word: Ἀρσάκης
  choice: अरसाकेस
  rationale: यूनानी राजकीय नाम का देवनागरी में निकट और पठनीय लिप्यंतरण।
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: फ़ारस और मादी का राजा
  rationale: फ़ारस आधुनिक हिन्दी में परिचित भौगोलिक नाम है; मादी प्राचीन क्षेत्र के नाम Media का प्रचलित बाइबिलीय रूप है। वाक्य में संबंध के अनुसार इसे 'के राजा' किया गया है।
- source_word: ἦλθεν
  choice: आ गया है
  rationale: अप्रत्यक्ष कथन में दिमेत्रियुस का आगमन सुनने और भेजने की कार्रवाई से पहले घटित है; हिन्दी में यह रूप उस पूर्वता को स्वाभाविक ढंग से दिखाता है।
- source_word: τὰ ὅρια αὐτοῦ
  choice: उसके राज्य-क्षेत्र में
  rationale: बहुवचन ὅρια का शाब्दिक अर्थ सीमाएँ है, पर यहाँ आशय राजा के अधिकाराधीन भूभाग से है। 'राज्य-क्षेत्र' राजनीतिक-भौगोलिक अर्थ को स्पष्ट रखता है।
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: अपने अधिकारियों में से एक
  rationale: ἄρχων शासक, प्रधान या अधिकारी के व्यापक अर्थ में आ सकता है। 'अधिकारी' सैन्य पद को अनावश्यक रूप से निश्चित किए बिना इस राजकीय दूत की भूमिका व्यक्त करता है।
- source_word: συλλαβεῖν αὐτὸν ζῶντα
  choice: उसे जीवित पकड़ने
  rationale: यह दिमेत्रियुस को मारने के बजाय जीवित बंदी बनाने के स्पष्ट उद्देश्य को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
