  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: hi
  text: और फ़ारस और मादी के राजा अरसाकेस ने सुना कि दिमेत्रियुस उसके राज्य-क्षेत्र में आ गया था, और उसने अपने अधिकारियों में से एक को उसे जीवित पकड़ने के लिए भेजा।
