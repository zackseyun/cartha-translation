base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: hi
  text: क्योंकि देश में बार-बार युद्ध होते रहे थे, इसलिए मत्तथियाह का पुत्र शमौन, जो योआरिब के वंशजों में से एक था, और उसके भाइयों ने अपने आपको खतरे में डाल दिया[a] और अपने राष्ट्र के विरोधियों का सामना किया, ताकि उनका पवित्रस्थान[b] और व्यवस्था कायम रहें; और उन्होंने अपने राष्ट्र को बड़ा गौरव दिलाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः भाव: “अपने आपको खतरे के हवाले कर दिया।” यूनानी मुहावरा स्वेच्छा से संकट मोल लेने पर बल देता है।'
    reason: lexical_alternative
  - marker: b
    text: या “उनके पवित्र स्थान” अथवा “उनकी पवित्र वस्तुएँ।” यूनानी में बहुवचन है, जो पवित्र वस्तुओं या पूरे पवित्र परिसर को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक शब्दशः: “उन्होंने अपने राष्ट्र को बड़े गौरव से गौरवान्वित किया।” यूनानी में ‘गौरव’ से बने संज्ञा और क्रिया का बलाघाती प्रयोग है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: क्योंकि देश में बार-बार युद्ध होते रहे थे
  rationale: यह कारणसूचक आरंभ, युद्धों की पुनरावृत्ति और χώρα के भू-क्षेत्रीय अर्थ—तीनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Σίμων ... ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: शमौन ... जो योआरिब के वंशजों में से एक था
  rationale: असहज शब्दशः रूप ‘पुत्रों का पुत्र’ के बजाय वंशगत संबद्धता को स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: अपने आपको खतरे में डाल दिया
  rationale: यूनानी मुहावरे में स्वेच्छा से संकट मोल लेने का भाव है; यह हिन्दी रूप उस सक्रिय आत्म-समर्पण को सहजता से रखता है।
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις
  choice: विरोधियों का सामना किया
  rationale: यह सक्रिय प्रतिरोध और आमने-सामने डटे रहने का भाव देता है, बिना ‘शत्रु’ कहकर अर्थ को अनावश्यक रूप से तीखा किए।
- source_word: τοῦ ἔθνους αὐτῶν
  choice: अपने राष्ट्र के
  rationale: सार्वजनिक और राजनीतिक-सामुदायिक प्रसंग में ἔθνος का राष्ट्रीय सामूहिक अर्थ बनाए रखता है।
- source_word: ὅπως σταθῇ
  choice: ताकि ... कायम रहें
  rationale: ἵστημι के टिके रहने, सुरक्षित बने रहने या स्थापित रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἅγια αὐτῶν
  choice: उनका पवित्रस्थान
  rationale: संदर्भ में यह मंदिर या पवित्र परिसर की सामूहिक संज्ञा जान पड़ती है; यूनानी बहुवचन की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यहाँ यह यहूदी धार्मिक व्यवस्था/तोरा का सूचक है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में गरिमापूर्ण है और केवल आधुनिक नागरिक कानून तक अर्थ को सीमित नहीं करती।
- source_word: δόξῃ μεγάλῃ ἐδόξασαν
  choice: बड़ा गौरव दिलाया
  rationale: यूनानी की बलाघाती सजातीय रचना का अर्थ स्वाभाविक हिन्दी में देता है; अधिक शब्दशः रूप पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: यहूदी सामुदायिक प्रसंग में ἔθνος का अनुवाद
  choice: राष्ट्र
  alternative: जाति / लोग
  rationale: यह स्मारकीय-राजनीतिक प्रसंग सामूहिक राष्ट्रीय पहचान पर बल देता है; ‘राष्ट्र’ उस आयाम को रखता है, पर बाद के किसी राष्ट्रवादी सिद्धांत को आरोपित नहीं करता।
- issue: τὰ ἅγια के बहुवचन का संदर्भ
  choice: पवित्रस्थान
  alternative: पवित्र वस्तुएँ / पवित्र स्थान
  rationale: व्यवस्था के साथ इसकी जोड़ी और मंदिर-रक्षा का संदर्भ सामूहिक रूप से पवित्रस्थान की ओर संकेत करता है, किन्तु मूल बहुवचन की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: ὁ νόμος का धार्मिक आशय
  choice: व्यवस्था
  alternative: कानून / तोरा
  rationale: यह यहूदी व्यवस्था की ओर संकेत करता है। ‘व्यवस्था’ मूल के सामान्य संज्ञा-रूप को बनाए रखते हुए धार्मिक-सामुदायिक आशय व्यक्त करती है और ‘तोरा’ जैसी अधिक विशिष्ट व्याख्या को मुख्य पाठ में नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-स्मारकीय स्वर रखा गया है। वाक्य की मूल कारणसूचक और उद्देश्यसूचक संरचना सुरक्षित है, पर अत्यधिक शब्दशः और अस्वाभाविक पदबंधों को सहज हिन्दी में रूपांतरित किया गया है। सभी वास्तविक शाब्दिक अस्पष्टताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
