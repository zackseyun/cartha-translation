  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: hi
  text: और उसने समुद्र के किनारे स्थित योप्पा तथा अज़ोतुस के सीमाक्षेत्र में स्थित गाज़ारा[a] को किलाबंद किया, जहाँ पहले शत्रु रहते थे। उसने वहाँ यहूदियों को बसाया और उनके पुनर्स्थापन[b] के लिए जो कुछ आवश्यक था, वह वहाँ रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गाज़ारा’ के लिए ‘गेज़ेर’ भी कहा जा सकता है, जो अधिक परिचित इब्रानी-संबद्ध नाम है; यहाँ यूनानी मूलपाठ में ‘गाज़ारा’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके पुनर्स्थापन’ का संबंध इन स्थानों को फिर से व्यवस्थित करने से या वहाँ बसाए गए यहूदी समुदायों को पुनः स्थापित करने से हो सकता है; यूनानी वाक्य संक्षिप्त है और दोनों अर्थों की संभावना रहने देता है।
    reason: alternative_reading
