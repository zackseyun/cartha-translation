  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
translation:
  language: hi
  text: और अपने पूरे वैभव के साथ उसने याफा को बन्दरगाह के रूप में ले लिया[a], और उसे समुद्र के द्वीपों तक पहुँच का स्थान बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याफा को बन्दरगाह के लिए ले लिया।” अधिक शाब्दिक रूप में, “समुद्र के द्वीपों के लिए प्रवेश बनाया।” यूनानी अभिव्यक्ति सम्भवतः यह बताती है कि याफा समुद्र के द्वीपों तक पहुँच का स्थान बन गया।
    reason: εἰς λιμένα के उद्देश्य/परिणाम संबंधी अर्थ और ἐποίησεν εἴσοδον के अधिक शाब्दिक विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  choice: अपने पूरे वैभव के साथ
  rationale: δόξα यहाँ गौरव, प्रतिष्ठा या वैभव का बोध करा सकता है। स्तुतिपरक ऐतिहासिक संदर्भ में ‘वैभव’ ऊँची शैली बनाए रखता है और अर्थ को केवल सम्मान या बाहरी शोभा तक सीमित नहीं करता।
- source_word: ἔλαβεν
  choice: ले लिया
  rationale: λαμβάνω का सामान्य अर्थ ‘लेना’ है। ‘ले लिया’ अधिग्रहण का भाव देता है, पर यूनानी से अधिक स्पष्ट रूप से सैन्य विजय या बलपूर्वक कब्ज़ा नहीं जोड़ता।
- source_word: τὴν Ἰόππην
  choice: याफा
  rationale: Ἰόππη के लिए आधुनिक हिन्दी में प्रचलित और पहचाना जाने वाला स्थान-नाम ‘याफा’ है।
- source_word: εἰς λιμένα
  choice: बन्दरगाह के रूप में
  rationale: εἰς यहाँ उद्देश्य या परिणति व्यक्त करता है—याफा को इस तरह लिया गया कि वह बन्दरगाह का काम करे। यह हिन्दी में स्वाभाविक है और λιμήν का सीधा अर्थ बनाए रखता है।
- source_word: ἐποίησεν εἴσοδον
  choice: पहुँचने का मार्ग खोल दिया
  rationale: ποιέω और εἴσοδος का मेल प्रवेश या पहुँच उपलब्ध कराने का अर्थ देता है। हिन्दी वाक्यांश व्यावहारिक समुद्री संपर्क का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ταῖς νήσοις τῆς θαλάσσης
  choice: समुद्र के द्वीपों तक
  rationale: सम्बन्धवाचक सम्प्रदान कारक को यहाँ पहुँच की दिशा के रूप में समझना सन्दर्भानुकूल है। ‘समुद्र के द्वीपों’ से यूनानी की ऊँची और कुछ हद तक शाब्दिक अभिव्यक्ति सुरक्षित रहती है।
