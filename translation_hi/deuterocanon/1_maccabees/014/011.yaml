translation:
  language: hi
  text: उसने देश में[a] शांति स्थापित की, और इस्राएल बहुत आनन्दित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भूमि पर।”
    reason: यूनानी ἐπὶ τῆς γῆς के स्थानवाचक रूप को दर्शाने और ‘देश में’ के स्वाभाविक हिन्दी अनुवाद के पीछे की वास्तविक भाषिक अस्पष्टता बनाए रखने के लिए।
lexical_decisions:
- source_word: ἐποίησεν τὴν εἰρήνην
  choice: शांति स्थापित की
  rationale: हिन्दी में ‘शांति की’ अस्वाभाविक है; ‘शांति स्थापित की’ ποιέω और उसके कर्म εἰρήνην का प्रसंगानुकूल तथा स्वाभाविक अर्थ व्यक्त करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: देश में
  rationale: यहाँ γῆ का संकेत समूची पृथ्वी के बजाय देश या भूभाग की ओर है। ἐπί का अधिक शाब्दिक रूप ‘देश पर’ हो सकता है, पर हिन्दी में सार्वजनिक शांति के लिए ‘देश में’ स्वाभाविक है।
- source_word: ηὐφράνθη Ἰσραήλ εὐφροσύνην μεγάλην
  choice: इस्राएल ने बड़ा आनन्द मनाया
  rationale: यह स्वाभाविक हिन्दी में इस्राएल को सामूहिक प्रजा के रूप में रखता है और ηὐφράνθη तथा εὐφροσύνην μεγάλην के प्रबल आनन्द को संक्षेप में व्यक्त करता है।
