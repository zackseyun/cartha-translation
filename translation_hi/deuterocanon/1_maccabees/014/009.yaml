  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
translation:
  language: hi
  text: बुज़ुर्ग सार्वजनिक चौकों में बैठे थे; वे सभी अच्छी बातों के बारे में आपस में बातचीत कर रहे थे, और युवा पुरुषों ने शोभायमान सज्जा[a] और युद्ध के वस्त्र पहने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “महिमाएँ और युद्ध के वस्त्र” है। पहला शब्द इस संदर्भ में संभवतः शोभायमान सज्जा, अलंकरण, या सम्मानसूचक पोशाक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: बुज़ुर्ग
  rationale: नागरिक-सामुदायिक संदर्भ में यह समुदाय के वरिष्ठ पुरुषों को सूचित करता है; ‘बुज़ुर्ग’ किसी औपचारिक पद को अनावश्यक रूप से निश्चित किए बिना सामाजिक सम्मान का भाव रखता है।
- source_word: ἐν ταῖς πλατείαις
  choice: सार्वजनिक चौकों में
  rationale: πλατεῖαι नगर के चौड़े सार्वजनिक स्थानों या चौकों को सूचित कर सकता है; यह चयन सामुदायिक नगर-दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκάθηντο
  choice: बैठे रहते थे
  rationale: अपूर्ण भूतकाल दृश्य की निरंतर या सामान्य अवस्था दिखाता है; ‘बैठे रहते थे’ इस पहलू को स्पष्ट रखता है।
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: वे सभी अच्छी बातों के विषय में आपस में बातचीत करते थे
  rationale: περὶ ἀγαθῶν व्यापक और कुछ हद तक अस्पष्ट है, इसलिए उसे ‘समृद्धि’ या ‘आशीषों’ तक सीमित नहीं किया गया; ἐκοινολόγουν का सामूहिक भाव ‘आपस में बातचीत’ से व्यक्त होता है।
- source_word: οἱ νεανίσκοι
  choice: जवानों
  rationale: यह समुदाय के युवा पुरुषों को सूचित करता है; ‘जवान’ स्वाभाविक, स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐνεδύσαντο
  choice: पहन रखे थे
  rationale: मध्यवाच्य क्रिया अपने को वस्त्र पहनाने या वस्त्र धारण करने का बोध देती है; दृश्य-वर्णन में ‘पहन रखे थे’ स्वाभाविक है।
- source_word: δόξας
  choice: वैभव
  rationale: शाब्दिक अर्थ ‘महिमाएँ’ है। बहुवचन और वस्त्र-संदर्भ असामान्य हैं, इसलिए ‘वैभव’ दृश्यमान शोभा या सम्मान का भाव देता है और इसे निश्चित रूप से ‘वस्त्र’ नहीं बनाता।
- source_word: στολὰς πολέμου
  choice: युद्ध के वस्त्र
  rationale: यह वाक्यांश शाब्दिक रूप से युद्ध-संबंधी वस्त्र या पोशाक कहता है। ‘कवच’ संभव अर्थ है, पर यूनानी में वस्त्र का चित्र अधिक प्रत्यक्ष है; इसलिए मुख्य पाठ में उसे बनाए रखा गया है।
