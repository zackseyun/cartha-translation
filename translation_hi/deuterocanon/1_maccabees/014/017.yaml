  text: But when they heard that Simon his brother had become high priest in his place and was ruling over the country and the cities in it,
translation:
  language: hi
  text: पर जब उन्होंने सुना कि शमौन, उसका भाई, उसके स्थान पर महायाजक बन गया है और उस देश तथा उसमें स्थित नगरों पर शासन कर रहा है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: पर जब उन्होंने सुना
  rationale: ὡς अओरिस्ट क्रिया के साथ समयसूचक उपवाक्य आरम्भ करता है, और δέ कथा को हल्के मोड़ के साथ आगे बढ़ाता है। ‘पर जब’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: उसका भाई शमौन
  rationale: यह पदबंध शमौन की पहचान पहले उल्लिखित व्यक्ति के भाई के रूप में कराता है; हिन्दी में यह शब्दक्रम स्पष्ट और स्वाभाविक है।
- source_word: γέγονεν
  choice: बन गया है
  rationale: 'पूर्णकालीन रूप किसी घटित घटना से बनी वर्तमान अवस्था को दिखाता है: शमौन महायाजक बना और उस पद पर बना हुआ है।'
- source_word: ἀντ' αὐτοῦ
  choice: उसके स्थान पर
  rationale: ἀντί यहाँ पद पर उत्तराधिकार या प्रतिस्थापन का अर्थ देता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी धार्मिक पद का मानक और प्रचलित हिन्दी नाम है।
- source_word: ἐπικρατεῖ
  choice: शासन कर रहा है
  rationale: राजनीतिक और प्रादेशिक संदर्भ में क्रिया का अर्थ अधिकार रखना या शासन करना है; वर्तमान जारी अवस्था हिन्दी में ‘कर रहा है’ से स्पष्ट होती है।
- source_word: τῆς χώρας
  choice: उस देश
  rationale: χώρα यहाँ नगरों सहित विस्तृत भूभाग या राजनीतिक क्षेत्र को दर्शाता है; ‘देश’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: τῶν πόλεων τῶν ἐν αὐτῇ
  choice: उसमें बसे नगरों
  rationale: यह अनुवाद χώρα के भीतर स्थित नगरों का स्पष्ट स्थानिक संबंध बनाए रखता है; ‘बसे’ हिन्दी में इस संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: ऐतिहासिक वृत्तांत में ἐπικρατεῖ की राजनीतिक शक्ति
  choice: शासन कर रहा है
  alternative: उस पर अधिकार रखता है
  rationale: संदर्भ नागरिक और प्रादेशिक प्रशासन का है। ‘शासन कर रहा है’ शमौन के राजनीतिक अधिकार को व्यक्त करता है, पर उसमें कोई बाद की धर्मवैचारिक धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। यूनानी वाक्य अगले पद में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
