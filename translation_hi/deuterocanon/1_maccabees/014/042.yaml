  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
translation:
  language: hi
  text: और यह कि वह उनका सेनापति हो, पवित्र वस्तुओं[a] की देखभाल करे, और उनके कार्यों, प्रदेश, हथियारों और किलेबंद स्थानों के लिए अधिकारियों को नियुक्त करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान’ अथवा ‘पवित्र स्थान’; यहाँ प्रेषित यूनानी पाठ का शब्द-विन्यास कठिन है।
    reason: alternative_reading
lexical_decisions:
- source_word: στρατηγόν
  choice: सेनापति
  rationale: यह शब्द सैन्य नेतृत्व का पद बताता है; ‘सेनापति’ आधुनिक हिन्दी में स्पष्ट है और किसी अत्यधिक विशिष्ट आधुनिक सैन्य रैंक को आरोपित नहीं करता।
- source_word: μέλῃ
  choice: देखभाल करे
  rationale: μέλω यहाँ चिंता रखने और उत्तरदायित्वपूर्वक ध्यान देने का भाव व्यक्त करता है; ‘देखभाल करे’ स्वाभाविक और प्रशासनिक संदर्भ के अनुकूल है।
- source_word: τῶν Α ἅγιον
  choice: पवित्र वस्तुओं
  rationale: प्रेषित यूनानी पाठ कठिन और व्याकरण की दृष्टि से असामान्य है। ‘पवित्र वस्तुओं’ से पवित्र विषय-वस्तु का व्यापक संकेत बना रहता है और ठीक-ठीक संदर्भ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: καθιστάναι
  choice: अधिकारियों को नियुक्त करे
  rationale: इस प्रशासनिक संदर्भ में क्रिया का अर्थ लोगों को विभिन्न क्षेत्रों का प्रभारी ठहराना है। यूनानी में कर्म निहित है; हिन्दी में स्पष्टता के लिए ‘अधिकारियों को’ जोड़ा गया है।
- source_word: τῶν ἔργων
  choice: उनके कार्यों
  rationale: ἔργα का मूल अर्थ कार्य या उपक्रम है; ‘कार्यों’ औपचारिक प्रशासनिक प्रसंग में निकट और सहज है।
- source_word: χώρας
  choice: देश
  rationale: χώρα भूमि, प्रदेश या देश को सूचित कर सकता है; यहाँ व्यापक नागरिक-प्रशासनिक क्षेत्र के लिए ‘देश’ उपयुक्त है।
- source_word: ὅπλων
  choice: हथियारों
  rationale: ὅπλα के सैन्य अर्थ को आधुनिक हिन्दी में ‘हथियार’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ὀχυρωμάτων
  choice: किलेबंद स्थानों
  rationale: यह बहुवचन शब्द सुरक्षित किए गए दुर्गस्थलों को बताता है; ‘किलेबंद स्थान’ अर्थ को पूर्ण रूप से बनाए रखता है।
theological_decisions:
- issue: कठिन पदबंध τῶν Α ἅγιον का संदर्भ
  choice: मुख्य पाठ में ‘पवित्र वस्तुओं’
  alternative: ‘पवित्रस्थान’ या ‘पवित्र स्थान’
  rationale: प्रेषित यूनानी शब्दावली स्पष्ट नहीं है। व्यापक अनुवाद मूल की अनिश्चितता को बनाए रखता है, जबकि पवित्रस्थान-संबंधी संभावित अर्थ पादटिप्पणी में दिया गया है; यह मूलतः पाठगत-शाब्दिक प्रश्न है, न कि किसी सिद्धान्त का निर्णय।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक आदेश के अनुरूप रखी गई है। पद की खंडात्मक ‘और यह कि’ संरचना निकटवर्ती विधिक/आदेशात्मक संदर्भ से इसके संबंध को सुरक्षित रखती है।
