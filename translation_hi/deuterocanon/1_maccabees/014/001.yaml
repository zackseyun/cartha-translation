  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: hi
  text: और एक सौ बहत्तरवें वर्ष[a] में राजा देमेत्रियुस ने अपनी सेनाएँ इकट्ठी कीं और अपने लिए सहायता जुटाने के उद्देश्य से मादै देश में गया, ताकि वह त्रूफ़ोन से युद्ध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह तिथि सामान्यतः सेल्यूकिड संवत् के अनुसार समझी जाती है। इसका शाब्दिक रूप है, “दूसरे और सत्तरवें और सौवें वर्ष में।”
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: एक सौ बहत्तरवें वर्ष में
  rationale: यूनानी में संख्या जोड़कर कही गई है—‘दूसरे और सत्तरवें और सौवें वर्ष में।’ आधुनिक हिन्दी में इसका स्वाभाविक रूप ‘एक सौ बहत्तरवें वर्ष में’ है; ऐतिहासिक कालगणना की जानकारी पाद-टिप्पणी में दी गई है।
- source_word: συνήγαγεν ... τὰς δυνάμεις αὐτοῦ
  choice: अपनी सेनाएँ इकट्ठी कीं
  rationale: सैन्य प्रसंग में δυνάμεις सशस्त्र बलों को सूचित करता है। बहुवचन ‘सेनाएँ’ मूल के व्याकरणिक रूप को बनाए रखता है और ‘इकट्ठी कीं’ συνήγαγεν का स्पष्ट, सामान्य हिन्दी रूप है।
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: मादै देश को गया
  rationale: ἐπορεύθη सामान्यतः जाने या यात्रा करने को व्यक्त करता है; इसलिए मूल में स्पष्ट न किए गए ‘कूच किया’ जैसे अधिक प्रबल सैन्य भाव को नहीं जोड़ा गया। Μηδία ऐतिहासिक क्षेत्र मादै है।
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: अपने लिए सहायता जुटाने के उद्देश्य से
  rationale: τοῦ के साथ क्रियार्थक संज्ञा उद्देश्य बताती है। ἐπισπάσθαι में अपनी ओर खींचने या प्राप्त करने का भाव है; ‘सहायता जुटाने’ से यह भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ὅπως πολεμήσῃ τὸν Τρύφωνα
  choice: ताकि वह त्रूफ़ोन से युद्ध करे
  rationale: ὅπως के साथ विधिलिंग उद्देश्य दर्शाता है, और πολεμέω केवल एक मुठभेड़ नहीं बल्कि युद्ध करने का व्यापक भाव रखता है।
