  yaml_path: translation/deuterocanon/1_maccabees/014/010.yaml
  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
translation:
  language: hi
  text: उसने नगरों को खाद्य-सामग्री दी और उन्हें किलेबंदी के साधनों से सुसज्जित किया,[a] यहाँ तक कि उसका महिमामय नाम पृथ्वी के छोर तक प्रसिद्ध हो गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किलेबंदी के साधन’ से नगरों को मजबूत और सुरक्षित करने के उपकरण, सामग्री और अन्य रक्षात्मक संसाधन अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘उसकी महिमा का नाम पृथ्वी के छोर तक नामित किया गया।’ यूनानी की यह असामान्य कर्मवाच्य अभिव्यक्ति यहाँ उसके नाम के दूर-दूर तक प्रसिद्ध होने का अर्थ देती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχορήγησεν
  choice: दी
  rationale: यह क्रिया आवश्यक वस्तुएँ उपलब्ध कराने या अपने व्यय पर देने का भाव रखती है। ‘दी’ सहज हिन्दी है और βρώματα के साथ आपूर्ति का अर्थ स्पष्ट करती है।
- source_word: βρώματα
  choice: खाद्य-सामग्री
  rationale: शाब्दिक अर्थ ‘खाने की वस्तुएँ’ है; नगरों की सुरक्षा की पृष्ठभूमि में यह संचित भोजन या रसद को सूचित करता है।
- source_word: ἔταξεν αὐτὰς ἐν σκεύεσιν ὀχυρώσεως
  choice: उन्हें किलेबंदी के साधनों से सुसज्जित किया
  rationale: वाक्यांश का शाब्दिक रूप कुछ असहज है—‘उन्हें किलेबंदी के उपकरणों में व्यवस्थित किया।’ चुना हुआ अनुवाद नगरों को रक्षात्मक साधनों से तैयार करने का प्रसंगगत अर्थ देता है, पर साधनों को केवल हथियार नहीं मानता।
- source_word: σκεύεσιν
  choice: साधनों
  rationale: σκεῦος उपकरण, साज-सामान या सामग्री का व्यापक अर्थ दे सकता है। ‘साधनों’ से अनावश्यक रूप से हथियारों तक अर्थ सीमित नहीं होता।
- source_word: ὀχυρώσεως
  choice: किलेबंदी
  rationale: यह दुर्गीकरण अथवा रक्षात्मक सुदृढ़ीकरण का सैन्य भाव बनाए रखता है।
- source_word: ἕως ὅτου
  choice: यहाँ तक कि
  rationale: यहाँ यह क्रियाओं के उस व्यापक परिणाम या सीमा का परिचय देता है जहाँ उसकी ख्याति दूर तक पहुँचती है।
- source_word: ὠνομάσθη
  choice: लिया गया
  rationale: ὀνομάζω के कर्मवाच्य ‘नाम लिया गया’ को निकटता से व्यक्त करता है; ख्यात होने का मुहावरेदार आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: उसकी महिमा का नाम
  rationale: यूनानी की असामान्य संबंधकारक संरचना और उसकी अलंकारिक गंभीरता को बनाए रखा गया है; अधिक सहज विकल्प ‘उसका महिमामय नाम’ है।
- source_word: ἕως ἄκρου γῆς
  choice: पृथ्वी के छोर तक
  rationale: मूल में ἄκρου एकवचन है; ‘छोर तक’ उसी रूप और अत्यंत दूर तक पहुँचने के भाव को सुरक्षित रखता है।
