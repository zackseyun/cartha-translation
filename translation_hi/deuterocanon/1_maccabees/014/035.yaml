base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: hi
  text: और लोगों ने शमौन की विश्वसनीयता और उस गौरव को देखा जिसे उसने अपने राष्ट्र के लिए लाने का निश्चय किया था। तब उन्होंने उसे अपना अगुवा और महायाजक नियुक्त किया, क्योंकि उसने ये सब कुछ किया था, और क्योंकि उसने अपने राष्ट्र के लिए धार्मिकता[a] और विश्वसनीयता कायम रखी थी, और क्योंकि उसने हर प्रकार से अपने लोगों को ऊँचा उठाने का प्रयत्न किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय”; यूनानी शब्द यहाँ नैतिक खराई के साथ-साथ न्यायपूर्ण सार्वजनिक व्यवहार का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: विश्वसनीयता
  rationale: इस ऐतिहासिक-राजनीतिक प्रसंग में शब्द शमौन की प्रमाणित निष्ठा, भरोसेमंदी और अपने राष्ट्र के प्रति विश्वसनीय आचरण को दर्शाता है; हिन्दी में ‘विश्वास’ यहाँ भ्रामक रूप से केवल आस्था का अर्थ दे सकता है।
- source_word: δόξαν
  choice: गौरव
  rationale: यह सम्मान, प्रतिष्ठा और उन्नत सार्वजनिक स्थिति की व्यापक अर्थ-छाया को बनाए रखता है।
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: लाने का निश्चय किया था
  rationale: यह विचारपूर्वक किए गए संकल्प को स्वाभाविक हिन्दी में व्यक्त करता है और गौरव को राष्ट्र के लिए साकार करने का भाव रखता है।
- source_word: ἔθνει
  choice: राष्ट्र
  rationale: यहाँ शब्द शमौन के अपने राष्ट्रीय-राजनीतिक समुदाय को सूचित करता है।
- source_word: ἔθεντο
  choice: नियुक्त किया
  rationale: क्रिया औपचारिक रूप से पद पर स्थापित करने का भाव रखती है।
- source_word: ἡγούμενον
  choice: अगुवा
  rationale: यह शासन या पद की प्रकृति को अनावश्यक रूप से सीमित किए बिना नेतृत्व का सामान्य अर्थ देता है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह यहूदी उपासना-संबंधी पद का मानक हिन्दी रूप है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह नैतिक खराई और उचित आचरण को समेटता है; इस सार्वजनिक प्रसंग में ‘न्याय’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: συνετήρησεν
  choice: बनाए रखी थी
  rationale: यह निरंतर सुरक्षित रखने और निभाते रहने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐζήτησεν παντὶ τρόπῳ
  choice: हर प्रकार से ... प्रयत्न किया था
  rationale: यह उपलब्ध प्रत्येक उपाय से किए गए व्यापक प्रयास का अर्थ स्पष्ट करता है।
- source_word: ὑψῶσαι
  choice: ऊँचा उठाने
  rationale: यह लोगों की प्रतिष्ठा, स्थिति और सामर्थ्य बढ़ाने के सार्वजनिक अर्थ को बनाए रखता है।
- source_word: λαὸν
  choice: लोगों
  rationale: यह सामूहिक जनसमुदाय का स्वाभाविक हिन्दी रूप है और पहले आए ἔθνος ‘राष्ट्र’ से भेद बनाए रखता है।
theological_decisions:
- issue: शमौन के चरित्र और आचरण के लिए πίστις का अनुवाद
  choice: विश्वसनीयता
  alternative: विश्वास / निष्ठा
  rationale: दोनों प्रयोग उसके राष्ट्र के प्रति सिद्ध भरोसेमंदी और निष्ठापूर्ण आचरण की प्रशंसा करते हैं। ‘विश्वसनीयता’ इस संदर्भगत अर्थ को हिन्दी में अधिक स्पष्ट रखता है, बिना इसे केवल धार्मिक आस्था तक सीमित किए।
- issue: राजनीतिक-ऐतिहासिक प्रसंग में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द नैतिक खराई या न्यायपूर्ण सार्वजनिक व्यवहार दोनों को सूचित कर सकता है। मुख्य पाठ में व्यापक पारंपरिक अर्थ रखा गया है और नागरिक-न्याय संबंधी संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज ऐतिहासिक-वर्णन शैली अपनाई गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘विश्वसनीयता’ दोनों बार एक ही स्रोत शब्द की पुनरावृत्ति को बनाए रखता है।
