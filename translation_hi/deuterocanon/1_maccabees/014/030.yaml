lexical_decisions:
- source_word: ἠθροισεν
  choice: इकट्ठा किया
  rationale: ἀθροίζω के अओरिस्ट रूप का सीधा अर्थ इकट्ठा या एकत्र करना है। यह चुनाव क्रिया को स्वाभाविक आधुनिक हिन्दी में रखता है और उसके ढंग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: τὸ ἔθνος αὐτῶν
  choice: उनके राष्ट्र को
  rationale: ἔθνος यहाँ सामूहिक और राजनीतिक समुदाय का बोध कराता है। “राष्ट्र” इस अर्थ को “लोगों” की अपेक्षा अधिक स्पष्ट रखता है और आगे आने वाले λαός से भेद भी बनाए रखता है।
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: वह उनका महायाजक बना
  rationale: ἐγενήθη के साथ विधेय संज्ञा का स्वाभाविक अर्थ “बना” है; ἀρχιερεύς के लिए प्रचलित और गरिमापूर्ण शब्द “महायाजक” है।
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: अपने लोगों में मिला लिया गया
  rationale: यह अनुवाद यूनानी के निष्क्रिय भाव और किसी समुदाय में जोड़े जाने की छवि को बनाए रखते हुए हिन्दी में सहज है। यह वाक्यांश मृत्यु का बाइबलीय मुहावरा भी है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: λαός
  choice: लोग
  rationale: λαός के सामूहिक अर्थ के लिए “लोग” आधुनिक हिन्दी का स्वाभाविक और गरिमापूर्ण शब्द है।
theological_decisions:
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ में मृत्यु का मुहावरा
  choice: अपने लोगों में मिला लिया गया
  alternative: अपने लोगों के साथ जा मिला
  rationale: मुख्य पाठ यूनानी की निष्क्रिय रचना और “मिलाए/जोड़े जाने” की छवि को निकटता से सुरक्षित रखता है। पादटिप्पणी अधिक परिचित हिन्दी मुहावरे और मृत्यु-संबंधी आशय को देती है, बिना इस अभिव्यक्ति में निहित पूर्वजों अथवा मृत्यु-पश्चात अवस्था के बारे में अतिरिक्त धर्मशास्त्रीय निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। “महायाजक” स्थापित बाइबलीय पद है। ἔθνος और λαός के भेद को क्रमशः “राष्ट्र” और “लोग” से सुरक्षित रखा गया है।
