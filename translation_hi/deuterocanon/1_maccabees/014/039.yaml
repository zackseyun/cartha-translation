translation:
  language: hi
  text: और उसने उसे अपने मित्रों में से एक[a] बनाया और उसे बहुत सम्मान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मित्र’ का अर्थ व्यक्तिगत मित्र भी हो सकता है। पर यहाँ अधिक संभव है कि यह राजा के दरबार में मान्य पद या विशिष्ट वर्ग का नाम हो।
    reason: व्यक्तिगत संबंध और राजदरबारी पद—दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐποίησεν
  choice: बनाया
  rationale: पूरक के साथ प्रयुक्त ποιέω यहाँ किसी व्यक्ति को एक वर्ग या पद में सम्मिलित करने का भाव देता है। ‘बनाया’ यूनानी अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: τῶν φίλων αὐτοῦ
  choice: अपने मित्रों में से एक
  rationale: संबंधकारक बहुवचन किसी समूह में सम्मिलित किए जाने को व्यक्त करता है। हेलेनिस्तीनी राजदरबारी संदर्भ में φίλοι संभवतः मान्य पद या विशिष्ट दरबारी वर्ग था; हिंदी में ‘मित्रों’ स्वाभाविक है और पादटिप्पणी इस संभावित पारिभाषिक अर्थ को सुरक्षित रखती है।
- source_word: ἐδόξασεν
  choice: सम्मान दिया
  rationale: राजनीतिक-सामाजिक संदर्भ में δοξάζω का अर्थ यहाँ महिमा करना नहीं, बल्कि सम्मान या प्रतिष्ठा प्रदान करना है।
- source_word: δόξῃ μεγάλῃ
  choice: बड़ा सम्मान
  rationale: करणवाचक चतुर्थी सम्मान देने की रीति या मात्रा बताती है। ‘बड़ा सम्मान’ इस प्रसंग में δόξα के सामाजिक-राजकीय अर्थ को स्पष्ट और सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: क्या φίλοι केवल व्यक्तिगत मित्रता बताता है या राजदरबार का मान्य पद
  choice: मुख्य पाठ में ‘मित्रों’ रखा गया और संभावित राजदरबारी पद का अर्थ पादटिप्पणी में बताया गया।
  alternative: ‘राजमित्रों’ या ‘दरबारी मित्रों’ जैसे स्पष्ट पदनाम का प्रयोग।
  rationale: हेलेनिस्तीनी राजदरबारी भाषा में ‘मित्र’ एक मान्य पद या राजा के विशिष्ट सहयोगियों का वर्ग हो सकता है, पर केवल इस पद से संस्थागत अर्थ पूर्णतः निश्चित नहीं। इसलिए मुख्य पाठ वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मूल यूनानी के निकट। ‘सम्मान दिया’ ने अनावश्यक धर्मवैज्ञानिक अर्थछाया से बचते हुए राजकीय संदर्भ स्पष्ट किया है।
