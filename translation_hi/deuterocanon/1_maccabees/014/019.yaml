  text: और वे यरूशलेम में सभा के सामने पढ़े गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: पढ़े गए
  rationale: यह ἀναγινώσκω का एओरिस्ट कर्मवाच्य रूप है और यहाँ लिखित दस्तावेज़ों को सभा में पढ़े जाने का संकेत देता है। ‘पढ़े गए’ सीधा और स्वाभाविक अनुवाद है; सार्वजनिक रूप से या ऊँचे स्वर में पढ़ना प्रसंग से स्पष्ट है, क्रिया में अलग से व्यक्त नहीं।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह पद सभा की उपस्थिति में किए गए कार्य को दर्शाता है। ‘के सामने’ आधुनिक हिन्दी में स्वाभाविक और अर्थ के निकट है।
- source_word: ἐκκλησίας
  choice: सभा
  rationale: दूसरे मंदिर-काल के इस नागरिक-धार्मिक प्रसंग में ἐκκλησία एकत्र हुए समुदाय को दर्शाता है, बाद के मसीही अर्थ में ‘कलीसिया’ को नहीं। ‘सभा’ अनैतिहासिक धार्मिक अर्थ जोड़े बिना सामूहिक और सार्वजनिक भाव सुरक्षित रखता है।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह सामान्य स्थानवाचक पदबंध है और इसका सीधा हिन्दी अनुवाद है।
