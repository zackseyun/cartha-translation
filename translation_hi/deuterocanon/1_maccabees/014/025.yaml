  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: hi
  text: जब लोगों ने ये बातें सुनीं, तो उन्होंने कहा, “हम शमौन और उसके पुत्रों का एहसान कैसे चुकाएँ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम शमौन और उसके पुत्रों के प्रति क्या कृतज्ञता प्रकट करें?” यूनानी χάρις का अर्थ ‘कृपा’, ‘धन्यवाद’ या ‘कृतज्ञता’ हो सकता है; ‘चुकाने’ के साथ इसमें प्रत्युपकार का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब … तो
  rationale: यह रचना समय-संबंधी परिस्थिति और उसके बाद हुई प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है; δέ का अलग से अनावश्यक अनुवाद नहीं किया गया।
- source_word: ἤκουσεν
  choice: सुनीं
  rationale: ἀκούω के अओरिस्ट का सीधा अर्थ ‘सुना’ है; ‘बातें’ के साथ स्त्रीलिंग बहुवचन क्रिया स्वाभाविक है।
- source_word: ὁ δῆμος
  choice: लोगों
  rationale: यहाँ δῆμος सामूहिक जनसमुदाय को दर्शाता है। ‘लोग’ सहज और पर्याप्त व्यापक है; ‘सभा’ औपचारिक संस्था का अनावश्यक संकेत दे सकती है।
- source_word: τῶν λόγων τούτων
  choice: ये बातें
  rationale: λόγοι का अर्थ ‘शब्द’ या ‘बातें’ हो सकता है। इस कथात्मक संदर्भ में ‘ये बातें’ पूर्व कथन की ओर स्वाभाविक ढंग से संकेत करता है।
- source_word: Τίνα χάριν ἀποδώσομεν
  choice: एहसान कैसे चुकाएँ
  rationale: χάρις और ἀποδίδωμι का मेल प्रत्युपकार, धन्यवाद या कृतज्ञता लौटाने का भाव रखता है। हिन्दी मुहावरा ‘एहसान चुकाना’ इस पारस्परिक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; प्रश्नवाचक τίνα का आशय यहाँ प्रत्युपकार के स्वरूप से है, जिसे हिन्दी में ‘कैसे’ सहजता से प्रकट करता है।
- source_word: Σίμωνι
  choice: शमौन
  rationale: Σίμων के लिए हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘शमौन’ रखा गया है।
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: उसके पुत्रों
  rationale: υἱοί विशेष रूप से ‘पुत्रों’ को दर्शाता है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
