  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: hi
  text: और प्रजा या याजकों में से किसी को भी अनुमति नहीं है कि वह इनमें से किसी बात को रद्द करे, या उसके द्वारा कही जाने वाली बातों का विरोध करे, या उसके बिना देश में कोई सभा बुलाए[a], या बैंजनी वस्त्र पहने और सोने की अलंकरण-पिन लगाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उसके बिना देश में कोई गुट संगठित करे।” यहाँ प्रयुक्त यूनानी शब्द किसी जमावड़े, गठबंधन या गुटबंद सभा का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: बैंजनी वस्त्र और सोने की अलंकरण-पिन पद या आधिकारिक सम्मान के चिह्न थे। यूनानी शब्द वस्त्र पर लगाए जाने वाले स्वर्ण क्लैस्प या ब्रोच का भी संकेत कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: अनुमति नहीं होगी
  rationale: यह औपचारिक निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी वर्तमान विधान के स्थायी/भावी प्रभाव को संदर्भानुकूल रखता है।
- source_word: ἀθετῆσαί τι τούτων
  choice: इनमें से किसी बात को रद्द करे
  rationale: ἀθετέω यहाँ पूर्ववर्ती निर्णयों या प्रावधानों को अमान्य ठहराने अथवा निष्प्रभावी करने का भाव रखता है; ‘रद्द करे’ प्रशासनिक संदर्भ में स्पष्ट है।
- source_word: ἀντειπεῖν
  choice: विरोध करे
  rationale: क्रिया का अर्थ किसी कथन के विरुद्ध बोलना या आपत्ति करना है; ‘विरोध करे’ केवल तार्किक खंडन तक अर्थ को सीमित नहीं करता।
- source_word: τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: शमौन के कहे जानेवाले आदेशों
  rationale: भावी कर्मवाचक कृदन्त को ‘कहे जानेवाले’ से सुरक्षित रखा गया है। संदर्भ से αὐτοῦ शमौन को सूचित करता है और ये उसके आधिकारिक कथन हैं, इसलिए ‘आदेशों’ से प्रशासनिक आशय स्पष्ट होता है।
- source_word: ἐπιστρέψαι συστροφὴν
  choice: कोई सभा बुलाए
  rationale: कठिन पदबंध किसी संगठित जमावड़े, गठबंधन या गुट को एकत्र करने का संकेत दे सकता है। मुख्य पाठ में तटस्थ नागरिक अर्थ रखा गया है और अधिक नकारात्मक संभावना पादटिप्पणी में दी गई है।
- source_word: ἐν τῇ χώρᾳ
  choice: देश में
  rationale: यह शासनाधीन भूभाग को दर्शाता है; ‘देश’ स्वाभाविक और व्यापक हिन्दी विकल्प है।
- source_word: περιβαλέσθαι πορφύραν
  choice: बैंजनी वस्त्र पहने
  rationale: केवल रंग नहीं, उस रंग का प्रतिष्ठासूचक परिधान अभिप्रेत है; ‘बैंजनी वस्त्र’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: सोने की जड़ाऊ पिन लगाए
  rationale: क्रिया और संज्ञा मिलकर वस्त्र पर लगाई जानेवाली स्वर्ण अलंकरण-पिन या क्लैस्प का संकेत देते हैं; ‘जड़ाऊ पिन’ पहनने की वस्तु को स्पष्ट करता है, यद्यपि उसका ठीक आकार अनिश्चित है।
theological_decisions:
- issue: निषेध का स्वरूप
  choice: इसे शमौन के विशिष्ट नागरिक-राजनीतिक अधिकार को स्थापित करनेवाला विधिक निषेध माना गया है।
  alternative: सभा वाले खंड को स्पष्ट रूप से विद्रोह या राजद्रोह का निषेध कहा जा सकता था।
  rationale: अध्याय का प्रसंग शमौन को अधिकार देनेवाला सार्वजनिक निर्णय है। συστροφή में नकारात्मक अर्थ संभव है, पर यूनानी पाठ अनिवार्य रूप से ‘विद्रोह’ नहीं कहता; इसलिए मुख्य पाठ में अस्पष्टता को अधिक नहीं सुलझाया गया।
- issue: τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις का काल और अधिकार
  choice: भावी अभिव्यक्ति ‘कहे जानेवाले’ को बनाए रखते हुए कथनों को संदर्भानुसार ‘आदेश’ कहा गया है।
  alternative: ‘जो कुछ वह कहे’ अधिक सहज, पर कालगत विशेषता में कम स्पष्ट होता।
  rationale: यूनानी भावी कर्मवाचक कृदन्त आगे शमौन द्वारा कहे जानेवाले विषयों की ओर संकेत करता है; प्रशासनिक प्रसंग उन्हें आधिकारिक आदेशों के रूप में समझने का आधार देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक सूची की पुनरावृत्त संरचना को ‘या’ के क्रम से बनाए रखा गया है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] उपस्थित हैं।
