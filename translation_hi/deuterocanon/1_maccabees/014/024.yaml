  yaml_path: translation/deuterocanon/1_maccabees/014/024.yaml
  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: hi
  text: इसके बाद शमौन ने नूमेनियुस को रोम भेजा। वह एक हज़ार मीना[a] भार की सोने की बड़ी ढाल ले गया, ताकि रोमियों के साथ गठबंधन स्थापित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मीना प्राचीन काल में भार की एक इकाई थी; यहाँ यह वाक्यांश एक असाधारण रूप से भारी और मूल्यवान राजनयिक भेंट का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह बहुवचन संकेतवाचक पद का स्वाभाविक हिन्दी कथात्मक रूप है और पिछले घटनाक्रम से संबंध बनाए रखता है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: क्रिया का सीधा और सामान्य अर्थ है; अधिक औपचारिक विकल्प की आवश्यकता नहीं।
- source_word: Σίμων
  choice: शमौन
  rationale: इस बाइबिलीय व्यक्ति के नाम का प्रचलित हिन्दी रूप अपनाया गया है।
- source_word: Νουμήνιον
  choice: नूमेनियुस
  rationale: यूनानी नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: εἰς Ῥώμην
  choice: रोम
  rationale: गंतव्य सूचक εἰς को हिन्दी क्रिया ‘भेजा’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἔχοντα
  choice: ले गया
  rationale: कृदंत नूमेनियुस द्वारा राजनयिक भेंट साथ ले जाने को दर्शाता है; वाक्य विभाजन के बाद यह रूप सहज है।
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: एक बड़ी सोने की ढाल
  rationale: ἀσπίς का अर्थ ‘ढाल’, χρυσῆν उसकी स्वर्ण-सामग्री और μεγάλην उसका बड़ा आकार बताता है।
- source_word: ὁλκὴν μνῶν χιλίων
  choice: जिसका भार एक हज़ार मीना था
  rationale: ὁλκή भार को निर्दिष्ट करता है; ‘मीना’ प्राचीन भार-इकाई के नाम को सुरक्षित रखता है।
- source_word: εἰς τὸ στῆσαι
  choice: ताकि ... दृढ़ करे
  rationale: रचना उद्देश्य व्यक्त करती है। राजनयिक संदर्भ में στῆσαι गठबंधन को स्थापित करने या औपचारिक रूप से पक्का करने का भाव रख सकता है; ‘दृढ़ करे’ पूर्ववर्ती गठबंधन की पुष्टि की संभावना को खुला रखता है।
- source_word: πρὸς αὐτοὺς
  choice: उनके साथ
  rationale: संबंधपरक प्रयोग में यह रोमियों के साथ गठबंधन को सूचित करता है।
- source_word: τὴν συμμαχίαν
  choice: गठबंधन
  rationale: यह राजनीतिक अथवा सैन्य संधि-संबंध के लिए आधुनिक हिन्दी का स्पष्ट और सीधा शब्द है।
