base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
translation:
  language: hi
  text: 'और उन्होंने उनकी कही हुई बातें जनसभा के आधिकारिक अभिलेखों[b] में इस प्रकार दर्ज कीं: “अन्तियोकस का पुत्र नूमेनियुस और यासोन का पुत्र अन्तिपातर, यहूदियों के राजदूत[a], हमारे पास आए और हमारे साथ मैत्री[c] का नवीकरण किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रेषित यूनानी पाठ में ‘यहूदियों’ से पहले अकेला अक्षर अल्फा (Α Ἰουδαίων) है। संभवतः यह नकल या संपादन से उत्पन्न चिह्न है, कोई सार्थक शब्द नहीं; अनुवाद स्पष्ट अर्थ, ‘यहूदियों के राजदूत’, का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: या ‘जनता की परिषदों/निर्णयों में’। यूनानी पदबंध संभवतः केवल मौखिक विचार-विमर्श नहीं, बल्कि जनसभा के आधिकारिक नागरिक दस्तावेज़ों या निर्णयों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘मैत्री’ का राजनयिक अर्थ है और इससे औपचारिक मैत्रीपूर्ण संबंध या गठबंधन भी अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγραψάμενοι
  choice: दर्ज कीं
  rationale: यह क्रिया किसी बात को लिखित रूप में आधिकारिक तौर पर अंकित या पंजीकृत करने का भाव देती है; ‘दर्ज कीं’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: उनकी कही हुई बातें
  rationale: यह दूतों द्वारा पहले कही गई बातों की विषय-वस्तु को दर्शाता है और यूनानी के कर्मवाच्य भाव को सहज हिन्दी में रखता है।
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: जनसभा के आधिकारिक अभिलेखों में
  rationale: शाब्दिक रूप से पदबंध जनता की परिषदों, निर्णयों या प्रस्तावों का संकेत दे सकता है; इस दस्तावेज़ी प्रसंग में आधिकारिक नागरिक अभिलेख अभिप्रेत हैं। पादटिप्पणी मूल की संभावित व्यापकता सुरक्षित रखती है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह आगे दिए गए आधिकारिक कथन के शब्दों का परिचय कराता है।
- source_word: πρεσβευταὶ
  choice: राजदूत
  rationale: यह शब्द राजनयिक कार्य के लिए भेजे गए आधिकारिक प्रतिनिधियों को दर्शाता है।
- source_word: Α Ἰουδαίων
  choice: यहूदियों के
  rationale: प्रेषित यूनानी पाठ में Ἰουδαίων से पहले अकेला अल्फा संभवतः नकल या संपादन की त्रुटि है; स्पष्ट अर्थ यहूदियों की ओर से आए राजदूत है।
- source_word: ἀνανεούμενοι
  choice: नवीकरण किया
  rationale: इसका अर्थ पहले से विद्यमान संबंध को फिर से नया या पुष्ट करना है। हिन्दी में संयुक्त क्रिया वाक्य को स्वाभाविक बनाती है, यद्यपि यूनानी में कृदन्त है।
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: हमारे साथ मैत्री
  rationale: φιλία सामान्य मित्रता के साथ राजनयिक मैत्री-संबंध या संधि का भाव भी रख सकता है; ‘मैत्री’ औपचारिक संदर्भ को व्यक्त करते हुए ‘संधि’ की अपेक्षा मूल की अस्पष्टता अधिक सुरक्षित रखती है।
