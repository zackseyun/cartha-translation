translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में औपचारिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों का लिप्यंतरण यूनानी रूपों के निकट है। राजनयिक और अभिलेखीय प्रसंग को स्पष्ट किया गया है, जबकि βουλαῖς और φιλία की अर्थगत व्यापकता पादटिप्पणियों में सुरक्षित रखी गई है।
