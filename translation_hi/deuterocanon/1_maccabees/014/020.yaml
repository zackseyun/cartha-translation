base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/020.yaml
  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: hi
  text: 'और यह उन पत्रों की प्रतिलिपि है जिन्हें स्पार्टावासियों ने भेजा था:


    “स्पार्टावासियों के शासकों और नगर[a] की ओर से प्रधान याजक शमौन, बुज़ुर्गों, याजकों और अपने भाइयों, यहूदी लोगों की शेष प्रजा को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नगर” स्पार्टा के नागरिक समुदाय अथवा आधिकारिक नगर-निकाय को दर्शाता है।
    reason: historical_context
lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह शब्द किसी लिखित दस्तावेज़ की नकल या प्रति को दर्शाता है; औपचारिक पत्राचार में ‘प्रतिलिपि’ स्वाभाविक और सटीक है।
- source_word: ἐπιστολῶν
  choice: पत्र
  rationale: यूनानी में यह बहुवचन है, इसलिए हिन्दी में ‘पत्र’ को बहुवचन क्रिया ‘भेजे थे’ और सर्वनाम ‘उनकी’ के साथ रखा गया है; इससे स्रोत का व्याकरणिक बहुवचन सुरक्षित रहता है, भले आगे एक ही पत्र का पाठ दिया जाता हो।
- source_word: Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: स्पार्टावासियों के शासकों और नगर
  rationale: यह प्रेषकों की आधिकारिक पहचान है। ‘शासक’ राजनीतिक पद को और ‘नगर’ पूरे नागरिक निकाय को व्यक्त करता है।
- source_word: ἱερεῖ μεγάλῳ
  choice: प्रधान याजक
  rationale: यह यहूदी धार्मिक पद का प्रचलित और स्पष्ट हिन्दी नाम है; शाब्दिक ‘महान याजक’ आधुनिक हिन्दी में पदनाम को ठीक से व्यक्त नहीं करता।
- source_word: πρεσβυτέροις
  choice: पुरनियों
  rationale: यहाँ आयु मात्र नहीं, समुदाय के मान्य अगुओं का पद अभिप्रेत है; बाइबलीय हिन्दी में ‘पुरनिये’ इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: यहूदियों की शेष प्रजा
  rationale: δῆμος नागरिक समुदाय अथवा जनसमुदाय को दर्शाता है और λοιπῷ बाकी लोगों को; यह रूप दोनों तत्वों को बनाए रखता है।
- source_word: ἀδελφοῖς
  choice: अपने भाइयों
  rationale: यह संबोधन स्पार्टावासियों और यहूदियों के बीच घोषित भ्रातृ-संबंध को व्यक्त करता है; ‘अपने’ से हिन्दी में यह संबंध स्पष्ट होता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्र के आरम्भ में यह रूढ़ अभिवादन है; आधुनिक हिन्दी में ‘नमस्कार’ इसका स्वाभाविक औपचारिक समतुल्य है।
theological_decisions:
- issue: ἱερεῖ μεγάλῳ का आधिकारिक यहूदी पदनाम
  choice: प्रधान याजक
  alternative: महान याजक
  rationale: ‘प्रधान याजक’ पद की संस्थागत पहचान को स्पष्ट और सम्प्रदाय-निरपेक्ष ढंग से व्यक्त करता है।
- issue: ἀδελφοῖς में स्पार्टावासियों और यहूदियों का संबंध
  choice: अपने भाइयों
  alternative: भाइयों
  rationale: संबंधगत दावे को न तो केवल जैविक रिश्तेदारी बनाया गया है, न हटाया गया है; ‘अपने भाइयों’ राजनयिक भ्रातृत्व की भाषा को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और औपचारिक पत्राचार के अनुकूल रखी गई है। स्रोत के ‘पत्रों’ वाले बहुवचन को हिन्दी व्याकरण के माध्यम से सुरक्षित रखा गया है। उद्धरण-रचना से परिचयात्मक वाक्य और पत्र के अभिवादन के बीच का संबंध स्पष्ट किया गया है।
