lexical_decisions:
- source_word: εὐδόκησεν
  choice: मंज़ूर किया
  rationale: यहाँ क्रिया जनता की सामूहिक और औपचारिक सहमति या स्वीकृति व्यक्त करती है; ‘मंज़ूर किया’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: πᾶς ὁ λαός
  choice: सारी जनता
  rationale: यह प्रयोग πᾶς की समग्रता और λαός के सामुदायिक अर्थ—दोनों को सुरक्षित रखता है, बिना इसे अधिक व्याख्यात्मक ‘राष्ट्र’ बनाने के।
- source_word: θέσθαι Σίμωνι ποιῆσαι
  choice: कि शमौन ... कार्य करे
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त है और शमौन के विषय में जनता के निर्णय को बताता है। हिन्दी में यह आशय ‘कि शमौन ... कार्य करे’ से स्पष्ट और सहज बनता है।
- source_word: ποιῆσαι
  choice: कार्य करे
  rationale: राजनीतिक-प्रशासनिक संदर्भ में यह केवल सामान्य ‘करे’ की अपेक्षा निर्धारित बातों को अमल में लाने का भाव बेहतर व्यक्त करता है।
- source_word: κατὰ τοὺς λόγους τούτους
  choice: इन बातों के अनुसार
  rationale: शाब्दिक अर्थ ‘इन शब्दों के अनुसार’ है, पर यहाँ λόγοι संभवतः पहले कही या लिखी गई व्यवस्थाओं को सूचित करता है। ‘इन बातों के अनुसार’ मूल की व्यापकता को रखते हुए हिन्दी में स्वाभाविक है।
