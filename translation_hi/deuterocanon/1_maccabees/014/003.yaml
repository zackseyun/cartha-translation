lexical_decisions:
- source_word: ἐπορεύθη
  choice: गया
  rationale: यह सामान्य आख्यानात्मक गमन-क्रिया है; सैन्य अभियान का अतिरिक्त भाव जोड़ना आवश्यक नहीं, क्योंकि अगली क्रिया प्रसंग स्पष्ट करती है।
- source_word: ἐπάταξεν
  choice: प्रहार किया
  rationale: πάτασσω के सीधे अर्थ ‘मारना/प्रहार करना’ को बनाए रखता है और ‘हरा दिया’ जैसा अनकहा परिणाम नहीं जोड़ता।
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: सैन्य प्रसंग में παρεμβολή सेना के पड़ाव या छावनी को दर्शाता है; ‘छावनी’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: συνέλαβεν
  choice: पकड़ लिया
  rationale: सैन्य प्रसंग में व्यक्ति को धर लेने का अर्थ देता है और आधुनिक कानूनी ‘गिरफ़्तार’ से बचता है।
- source_word: ἤγαγεν
  choice: ले गया
  rationale: ἄγω यहाँ किसी व्यक्ति को दूसरे व्यक्ति के पास पहुँचाने का भाव रखता है; हिन्दी में गन्तव्य के साथ ‘ले गया’ स्वाभाविक है।
- source_word: Ἀρσάκην
  choice: अरसकेस
  rationale: यूनानी Ἀρσάκης का देवनागरी लिप्यन्तरण है, जिसमें नाम की यूनानी ध्वनि-संरचना यथासम्भव बनी रहती है।
- source_word: ἔθετο
  choice: डाल दिया
  rationale: τίθημι का मूल भाव ‘रखना’ है; ‘बन्दीगृह में डाल दिया’ हिन्दी में स्वाभाविक रूप से उसी ठोस क्रिया को व्यक्त करता है।
- source_word: ἐν φυλακῇ
  choice: बन्दीगृह में
  rationale: φυλακή का अर्थ पहरा, हिरासत या कारागार हो सकता है; ἔθετο के साथ यहाँ बन्दी बनाकर रखने का स्थान अभिप्रेत है।
