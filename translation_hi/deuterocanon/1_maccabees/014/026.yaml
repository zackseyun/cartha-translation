base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: hi
  text: क्योंकि वह, उसके भाई और उसके पिता का घराना दृढ़ रहे; उन्होंने इस्राएल के शत्रुओं से युद्ध किया और उन्हें इस्राएल से दूर किया, और उसके लिए स्वतंत्रता स्थापित की।[a] उन्होंने इसे काँसे की पट्टिकाओं पर लिख दिया और उन्हें सिय्योन पर्वत पर एक स्तंभ पर लगा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके लिए” का संकेत संभवतः व्यक्ति के रूप में प्रस्तुत इस्राएल, अर्थात इस्राएल राष्ट्र, की ओर है; इसे शमौन के व्यक्तिगत संदर्भ में भी समझा जा सकता है। यूनानी में सर्वनाम पुल्लिंग एकवचन है।
    reason: मूल यूनानी सर्वनाम αὐτῷ के संदर्भ की वास्तविक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: ἐστήρισεν
  choice: दृढ़ता दिखाई
  rationale: यूनानी क्रिया यहाँ अकर्मक भाव में शमौन और उसके परिवार की स्थिरता या दृढ़ता व्यक्त करती प्रतीत होती है। एकवचन क्रिया के बाद जुड़े बहुवचन कर्ताओं को स्वाभाविक हिन्दी में संयुक्त कर्ता के रूप में रखा गया है।
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: उसके पिता का घराना
  rationale: यह सामी शैली का पारिवारिक पद है, जिसका आशय विस्तृत पैतृक परिवार या वंश से है; ‘घराना’ स्रोत की छवि और हिन्दी की स्वाभाविकता दोनों रखता है।
- source_word: ἐπολέμησαν ... ἀπʼ αὐτῶν
  choice: युद्ध करके उन्हें अपने से दूर किया
  rationale: ἐπολέμησαν का सैनिक अर्थ और ἀπʼ αὐτῶν का अलगावसूचक बल दोनों व्यक्त किए गए हैं। ‘अपने’ का संदर्भ इस्राएल/उसके लोगों से है।
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: उसके लिए स्वतंत्रता स्थापित की
  rationale: ἐλευθερία का सामान्य अर्थ ‘स्वतंत्रता’ है। αὐτῷ के पुल्लिंग एकवचन को हिन्दी में ‘उसके लिए’ रखकर उसके संदर्भ की मूल अस्पष्टता सुरक्षित रखी गई है।
- source_word: ἐν δέλτοις χαλκαῖς
  choice: काँसे की पट्टिकाओं पर
  rationale: δέλτοι लिखने की पट्टिकाएँ हैं और χαλκαῖς उनकी धातु बताता है; हिन्दी में ‘पर’ लेख अंकित करने का स्वाभाविक संबंधसूचक है।
- source_word: ἔθεντο ἐν στήλῃ
  choice: एक स्तंभ पर लगा दिया
  rationale: στήλη स्मारकीय स्तंभ या शिला हो सकती है। ‘स्तंभ’ सामान्य पाठक के लिए स्पष्ट है और पट्टिकाओं को उस पर स्थापित करने का भाव ‘लगा दिया’ से स्वाभाविक बनता है।
- source_word: ἐν ὄρει Σιών
  choice: सिय्योन पर्वत पर
  rationale: नामित पर्वत के लिए आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘पर’ है; ‘सिय्योन’ प्रचलित बाइबलीय रूप है।
theological_decisions:
- issue: ἔστησαν αὐτῷ ἐλευθερίαν में αὐτῷ का संदर्भ
  choice: मुख्य पाठ में ‘उसके लिए’, जो यूनानी के पुल्लिंग एकवचन को सुरक्षित रखता है
  alternative: ‘इस्राएल के लिए’ अथवा ‘उस राष्ट्र के लिए’; दूसरा संभव संदर्भ शमौन व्यक्तिगत रूप से है
  rationale: निकटवर्ती संदर्भ में इस्राएल और उसके शत्रुओं की बात होने से राष्ट्रीय स्वतंत्रता सबसे संभावित है, पर αὐτῷ व्याकरणतः पुल्लिंग एकवचन है और शमौन का व्यक्तिगत संदर्भ पूर्णतः असंभव नहीं। इसलिए मुख्य पाठ अस्पष्टता रखता है और पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘पिता का घराना’, ‘स्वतंत्रता’, ‘काँसे की पट्टिकाएँ’ और ‘स्तंभ’ स्रोत की ऐतिहासिक-स्मारकीय शैली बनाए रखते हैं। पादटिप्पणी चिह्न मुख्य पाठ में संबंधित कथन के बाद रखा गया है।
