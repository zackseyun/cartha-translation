  yaml_path: translation/deuterocanon/1_maccabees/014/023.yaml
  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: hi
  text: और जनता को यह अच्छा लगा कि वे उन पुरुषों का सम्मान के साथ स्वागत करें और उनकी बातों की एक प्रति जनता के लिए निर्धारित अभिलेख-पुस्तकों में रख दें,[a] ताकि स्पार्टा की जनता के पास एक स्मारक रहे; और उन्होंने इन बातों की एक प्रति महायाजक शमौन के लिए लिखी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जनता के लिए निर्धारित पुस्तकों में”; आशय आधिकारिक नागरिक अभिलेखों या पंजियों से है।
    reason: cultural_note
lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: जनता को यह अच्छा लगा
  rationale: यह यूनानी के निर्वैयक्तिक प्रयोग और सार्वजनिक स्वीकृति के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: उन पुरुषों का सम्मान के साथ स्वागत करें
  rationale: ἐπιδέξασθαι यहाँ अनुकूल ढंग से ग्रहण करने का भाव रखता है; ‘स्वागत’ हिन्दी में प्रसंगानुकूल है, जबकि ‘पुरुषों’ से स्रोत के स्पष्ट ἄνδρας को सुरक्षित रखा गया है।
- source_word: τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: उनकी बातों की एक प्रति
  rationale: ἀντίγραφον को ‘प्रति’ और λόγων को व्यापक तथा सहज ‘बातों’ के रूप में रखा गया है, बिना इसे केवल संदेश या औपचारिक वक्तव्य तक सीमित किए।
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: जनता के लिए निर्धारित अभिलेख-पुस्तकों में
  rationale: यह पुस्तकों के आधिकारिक रूप से निर्धारित होने और उनके नागरिक अभिलेख होने—दोनों भावों को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῦ μνημόσυνον ἔχειν
  choice: ताकि ... के पास एक स्मारक रहे
  rationale: आर्टिक्युलर इनफिनिटिव के प्रयोजनार्थक भाव और μνημόσυνον के स्मरण-संरक्षक अर्थ को रखा गया है; इसे केवल ‘रिकॉर्ड’ कहकर संकुचित नहीं किया गया।
- source_word: τὸν δῆμον τῶν Σπαρτιατῶν
  choice: स्पार्टा की जनता
  rationale: यह शाब्दिक ‘स्पार्टनों की जनता’ की अपेक्षा सहज हिन्दी है और δῆμος के नागरिक-समुदाय संबंधी बल को बनाए रखता है।
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ
  choice: उन्होंने इन बातों की एक प्रति महायाजक शमौन को लिखी
  rationale: यह ἔγραψαν और दत्तिव Σίμωνι को निकटता से दर्शाता है तथा यूनानी में स्पष्ट न होने के कारण ‘भेजी’ को मुख्य पाठ में नहीं जोड़ता।
