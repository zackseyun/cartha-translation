  yaml_path: translation/deuterocanon/1_maccabees/014/041.yaml
  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: hi
  text: और यह कि यहूदियों और याजकों ने यह उचित समझा कि शमौन सदा के लिए[a] उनका अगुआ और महायाजक रहे, जब तक कोई विश्वसनीय भविष्यद्वक्ता प्रकट न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘सदा के लिए’ के साथ आगे ‘जब तक कोई विश्वसनीय भविष्यद्वक्ता प्रकट न हो’ भी कहा गया है; दोनों अभिव्यक्तियाँ साथ-साथ रखी गई हैं।
    reason: ‘सदा के लिए’ और उसके बाद आने वाली ‘जब तक’ की धारा के बीच मौजूद अर्थगत तनाव को बिना उसका समाधान किए स्पष्ट करना।
lexical_decisions:
- source_word: εὐδόκησαν
  choice: यह उचित समझा
  rationale: यह अभिव्यक्ति अनुकूल स्वीकृति और औपचारिक सहमति—दोनों का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἡγούμενον
  choice: अगुआ
  rationale: यह शमौन की नेतृत्वकारी भूमिका को व्यक्त करता है, पर यूनानी पाठ से अधिक विशिष्ट राजनीतिक पद नहीं जोड़ता।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: मान्य याजकीय पद के लिए प्रचलित और स्पष्ट हिन्दी बाइबलीय शब्द।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और स्थायी अथवा अनिश्चितकालीन नियुक्ति का भाव बनाए रखता है।
- source_word: ἕως τοῦ ἀναστῆναι
  choice: जब तक ... प्रकट न हो
  rationale: यह भावी सीमा को सहज हिन्दी में व्यक्त करता है; भविष्यद्वक्ता के संदर्भ में ἀναστῆναι का आशय उसके सामने आने या उदित होने से है।
- source_word: προφήτην πιστόν
  choice: कोई विश्वसनीय भविष्यद्वक्ता
  rationale: πιστός यहाँ ऐसे भविष्यद्वक्ता का संकेत दे सकता है जिसकी प्रामाणिकता पर भरोसा किया जा सके; शब्द में ‘विश्वासयोग्य’ या ‘सच्चा’ का अर्थ भी संभव है।
theological_decisions:
- issue: εἰς τὸν αἰῶνα के बाद ἕως वाली सीमा के कारण शमौन के पद की अवधि
  choice: ‘सदा के लिए’ और ‘जब तक ...’ दोनों को बनाए रखा गया है।
  alternative: ‘सदा’ को पूर्णतः निरपेक्ष मानना, या उसे कमजोर करके केवल ‘अनिश्चित काल तक’ कहना।
  rationale: यूनानी पाठ स्थायित्व की घोषणा और भविष्यद्वक्ता के प्रकट होने तक की सीमा—दोनों को साथ रखता है; अनुवाद इस वास्तविक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक घोषणा के अनुकूल रूप। ‘शमौन’, ‘अगुआ’, ‘महायाजक’ और ‘भविष्यद्वक्ता’ सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
