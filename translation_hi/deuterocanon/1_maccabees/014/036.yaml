  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: hi
  text: और उसके दिनों में उसके हाथों यह सफलता मिली कि उनके देश से अन्यजातियों को, और यरूशलेम के दाऊद-नगर के उन लोगों को हटाया जाए जिन्होंने अपने लिए एक गढ़[a] बना लिया था। वहाँ से वे निकलकर पवित्रस्थान के आसपास के क्षेत्र को अशुद्ध करते थे और उसकी शुद्धता को भारी हानि पहुँचाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अक्रा’, यरूशलेम का किलाबंद दुर्ग।
    reason: ἄκρα सामान्य रूप से ‘गढ़’ या ‘दुर्ग’ है, पर मक्काबी प्रसंग में यह यरूशलेम के प्रसिद्ध अक्रा दुर्ग को सूचित कर सकता है।
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: उसके हाथों यह कार्य सफल हुआ
  rationale: यूनानी निष्क्रिय क्रिया यहाँ लगभग निर्वैयक्तिक है और सफलता का भाव देती है। यह अनुवाद ‘हाथों’ की मूल बिंबात्मकता को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τοῦ ἐξαρθῆναι
  choice: निकाल दी गईं / निकाल दिए गए
  rationale: यह सफल परिणाम बताने वाला निष्क्रिय अनंत रूप है। ‘निकाल देना’ निष्कासन का भाव रखता है, पर विनाश का अनावश्यक रूप से प्रबल अर्थ नहीं जोड़ता।
- source_word: τὰ ἔθνη
  choice: अन्यजातियाँ
  rationale: मक्काबियों के प्रसंग में यह यहूदी प्रजा से बाहर के राष्ट्रों या लोगों को सूचित करता है। ‘अन्यजातियाँ’ उस संदर्भ को संक्षेप में व्यक्त करता है, जबकि ‘राष्ट्र’ यहाँ कम स्वाभाविक होता।
- source_word: χώρα
  choice: देश
  rationale: यहाँ χώρα भूभाग या देश को सूचित करता है। ‘उनके देश’ मूल के αὐτῶν की संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: ἄκραν
  choice: एक गढ़
  rationale: ἄκρα किलाबंद दुर्ग या गढ़ है। मुख्य पाठ में सामान्य संज्ञा का अनुवाद किया गया है और ऐतिहासिक नाम ‘अक्रा’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ἐμίανον
  choice: अशुद्ध करते
  rationale: क्रिया धार्मिक और अनुष्ठानिक अपवित्रता का भाव रखती है। ‘अशुद्ध करना’ आधुनिक हिन्दी में स्पष्ट है और मंदिर-संबंधी संदर्भ को बनाए रखता है।
- source_word: κύκλῳ τῶν ἁγίων
  choice: पवित्रस्थान के आसपास के क्षेत्र
  rationale: यूनानी पदबंध संक्षिप्त है और शाब्दिक रूप से ‘पवित्र वस्तुओं/स्थानों के चारों ओर’ हो सकता है। मंदिर के प्रसंग में यह अनुवाद संभावित स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πληγὴν μεγάλην
  choice: भारी हानि
  rationale: शाब्दिक बिंब ‘बड़ा आघात’ है, पर यहाँ पवित्रता को गंभीर नुकसान पहुँचाने का लाक्षणिक अर्थ अधिक स्वाभाविक है।
- source_word: ἁγνείᾳ
  choice: शुद्धता
  rationale: ἁγνεία अमूर्त पवित्रता से अधिक शुद्ध या निर्मल अवस्था पर बल देता है। ‘उसकी’ का संदर्भ निकटवर्ती पवित्रस्थान और उसके क्षेत्र से है।
theological_decisions:
- issue: मंदिर से संबंधित अनुष्ठानिक शब्दावली
  choice: ‘अशुद्ध’, ‘पवित्रस्थान’ और ‘शुद्धता’ जैसे उपासना-संबंधी शब्द बनाए रखना
  alternative: सामान्य शब्दों में ‘बिगाड़ना’, ‘पवित्र जगह’ और ‘व्यवस्था’ कहना
  rationale: यूनानी पाठ मंदिर-क्षेत्र की धार्मिक शुद्धता के उल्लंघन पर बल देता है। उपासना-संबंधी शब्दावली इस तनाव को बिना किसी सांप्रदायिक व्याख्या के सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है। पहले वाक्य में ‘और’ को रखा गया है, पर मूल में न होने के कारण ‘भी’ नहीं जोड़ा गया।
