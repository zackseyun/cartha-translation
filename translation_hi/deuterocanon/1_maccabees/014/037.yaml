translation_notes:
  register: आधुनिक मानक हिन्दी में ऐतिहासिक-सैन्य प्रसंग के अनुरूप गरिमापूर्ण लेकिन सरल भाषा रखी गई है। यूनानी के तीन समन्वित क्रियाखंडों को ‘और’ द्वारा बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं है।
