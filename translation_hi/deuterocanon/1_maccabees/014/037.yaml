  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: hi
  text: और उसने उसमें यहूदी पुरुषों को बसाया, और उस स्थान को प्रदेश और नगर की सुरक्षा के लिए किलेबंद किया, और यरूशलेम की दीवारें ऊँची कीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: बसाया
  rationale: यह क्रिया लोगों को किसी स्थान में निवासी के रूप में स्थापित करने का कारक भाव व्यक्त करती है; ‘बसाया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἄνδρας Ἰουδαίους
  choice: यहूदी पुरुषों
  rationale: ἄνδρας के स्पष्ट पुल्लिंग बहुवचन को ‘पुरुषों’ से और Ἰουδαίους के जातीय-धार्मिक अर्थ को ‘यहूदी’ से सुरक्षित रखा गया है।
- source_word: ὠχύρωσεν αὐτήν
  choice: उस स्थान को ... किलेबंद किया
  rationale: क्रिया का सामान्य सैन्य अर्थ किसी जगह को रक्षात्मक रूप से सुदृढ़ करना है। हिन्दी में स्त्रीलिंग पूर्वपद स्पष्ट न होने से सर्वनाम की अस्पष्टता घटाने हेतु ‘उस स्थान को’ स्वाभाविक है।
- source_word: πρὸς ἀσφάλειαν
  choice: सुरक्षा के लिए
  rationale: यह उद्देश्यसूचक पदबंध है; ‘सुरक्षा के लिए’ प्रशासनिक-सैन्य संदर्भ में सहज और अर्थसंगत है।
- source_word: τῆς χώρας
  choice: प्रदेश
  rationale: χώρα यहाँ नगर से व्यापक भूभाग को सूचित करता है; ‘प्रदेश’ आधुनिक हिन्दी में ‘नगर’ के साथ उपयुक्त विरोध प्रस्तुत करता है और ‘देश’ की आधुनिक राष्ट्र-राज्य संबंधी ध्वनि से बचता है।
- source_word: τῆς πόλεως
  choice: नगर
  rationale: πόλις के लिए ‘नगर’ dignified और सामान्य हिन्दी है; प्रसंग में इसका संकेत संभवतः यरूशलेम की ओर है, पर मूल की अप्रत्यक्षता बनाए रखी गई है।
- source_word: ὕψωσεν
  choice: ऊँची कीं
  rationale: क्रिया दीवारों की ऊँचाई बढ़ाने का अर्थ देती है। ‘ऊँची कीं’ पुनर्निर्माण का अतिरिक्त अर्थ जोड़े बिना सहज हिन्दी देता है।
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: यरूशलेम की दीवारें
  rationale: यह यूनानी संबंधसूचक संरचना का स्वाभाविक हिन्दी रूप है और बहुवचन को सुरक्षित रखता है।
