  yaml_path: translation/deuterocanon/1_maccabees/014/014.yaml
  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: hi
  text: और उसने अपनी प्रजा के सब दीन लोगों को मज़बूत किया[a]; उसने व्यवस्था की लगन से खोज की[b], और हर व्यवस्था-विरोधी और बुरी बात को दूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रजा के सब निम्न स्थिति के लोगों को।” यूनानी शब्द सामाजिक रूप से दीन या निम्न स्थिति के लोगों के साथ-साथ स्वभाव से नम्र लोगों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “व्यवस्था” से सम्भवतः यहूदियों की पैतृक व्यवस्था, अर्थात तोराह, अभिप्रेत है। यूनानी क्रिया का अर्थ व्यवस्था की लगन से खोज करना या उसकी जाँच करना है।
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: दृढ़ किया
  rationale: क्रिया का मूल भाव किसी को स्थिर, समर्थ या मजबूत करना है। ‘दृढ़ किया’ इस अर्थ को निकटता से रखता है और शासन के प्रसंग में स्वाभाविक है।
- source_word: πάντας τοὺς ταπεινοὺς
  choice: सब दीन लोगों
  rationale: ταπεινός सामाजिक रूप से निम्न या दबे हुए लोगों के साथ-साथ स्वभाव से नम्र लोगों को भी सूचित कर सकता है। ‘दीन’ हिन्दी में इस दोहरे संकेत को काफी हद तक बनाए रखता है।
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: अपनी प्रजा के
  rationale: यह सम्बन्धसूचक पद है। शासक के प्रसंग में ‘अपनी प्रजा’ आधुनिक हिन्दी में ‘अपने लोगों’ से अधिक स्वाभाविक और स्पष्ट है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यहाँ νόμος से यहूदी पूर्वजों की धार्मिक व्यवस्था, अर्थात तोराह, अभिप्रेत होने की प्रबल सम्भावना है। ‘व्यवस्था’ बाइबलीय हिन्दी में इस अर्थ को व्यक्त करती है, पर मुख्य पाठ में ‘तोराह’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: ἐξεζήτησεν
  choice: यत्नपूर्वक पालन किया
  rationale: क्रिया गहन खोज, जाँच या लगन से ध्यान देने का भाव रखती है। νόμος के साथ यहाँ केवल जानकारी खोजने की अपेक्षा उसके प्रति सक्रिय निष्ठा अधिक स्वाभाविक है; ‘यत्नपूर्वक पालन किया’ इसे सुबोध हिन्दी में व्यक्त करता है, जबकि टिप्पणी शाब्दिक सम्भावना बताती है।
- source_word: ἐξῆρεν
  choice: दूर कर दिया
  rationale: इसका अर्थ उठा देना या हटा देना है। ‘दूर कर दिया’ व्यक्तियों, आचरणों या परिस्थितियों—सभी के लिए पर्याप्त व्यापक है।
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: हर व्यवस्था-विरोधी और बुरी बात
  rationale: नपुंसकलिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं और किसी भी व्यक्ति, काम या वस्तु को समेट सकते हैं। ‘बात’ हिन्दी में इस व्यापकता को सहज रूप से रखती है; ‘व्यवस्था-विरोधी’ νόμος के साथ शब्दगत सम्बन्ध भी बनाए रखता है।
theological_decisions:
- issue: क्या νόμος को स्पष्ट रूप से ‘तोराह’ कहा जाए
  choice: मुख्य पाठ में ‘व्यवस्था’, टिप्पणी में तोराह की पहचान
  alternative: मुख्य पाठ में ‘तोराह’ या ‘मूसा की व्यवस्था’
  rationale: प्रसंग यहूदी पैतृक व्यवस्था की ओर प्रबल संकेत करता है, पर यूनानी पाठ स्वयं स्पष्टीकरण नहीं जोड़ता। अतः मुख्य पाठ स्रोत की संक्षिप्तता रखता है और टिप्पणी सांस्कृतिक पहचान स्पष्ट करती है।
- issue: ταπεινοὺς का प्रमुख अर्थ सामाजिक दीनता है या नैतिक नम्रता
  choice: दीन लोगों
  alternative: नम्र लोगों; समाज के छोटे लोगों; गरीबों
  rationale: यूनानी शब्द में सामाजिक निम्नता और मनोभाव की नम्रता दोनों सम्भव हैं। ‘दीन’ दोनों की कुछ गुंजाइश रखता है; टिप्पणी अस्पष्टता को स्पष्ट करती है।
- issue: ἐξεζήτησεν का अर्थ व्यवस्था को खोजना है या उसके प्रति यत्नशील होना
  choice: यत्नपूर्वक पालन किया
  alternative: व्यवस्था को खोजा; व्यवस्था की छानबीन की
  rationale: क्रिया शाब्दिक रूप से लगन से खोजने या जाँचने का अर्थ दे सकती है, पर शासन और धार्मिक सुधार के इस प्रसंग में व्यवस्था के प्रति सक्रिय निष्ठा अधिक स्वाभाविक है। टिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली अपनाई गई है। ‘प्रजा’, ‘दीन’ और ‘व्यवस्था’ प्रसंगानुकूल बाइबलीय शब्द हैं, पर वाक्यरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
