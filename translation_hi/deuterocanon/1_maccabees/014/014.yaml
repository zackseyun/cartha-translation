  naturalness: The revision retains a dignified, modern Hindi biblical register. “व्यवस्था की लगन से खोज की” is more idiomatic than a literal object construction while retaining the intensive sense of ἐξεζήτησεν. “मज़बूत किया” is clearer in contemporary Hindi than “दृढ़ किया” for strengthening people.
  terminology: “व्यवस्था” appropriately renders νόμος without over-specifying Torah in the main text; the cultural note identifies the likely reference. “दीन लोगों” can retain the social and dispositional range of ταπεινούς when accompanied by a footnote. “व्यवस्था-विरोधी” appropriately echoes the νόμος/ἄνομος wordplay.
