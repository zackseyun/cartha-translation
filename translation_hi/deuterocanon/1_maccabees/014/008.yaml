  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: hi
  text: और वे शान्ति से अपनी भूमि पर खेती करते थे। भूमि अपनी उपज देती थी, और मैदानी इलाकों के पेड़[a] अपने फल देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खुले खेतों के पेड़” अथवा “देहात के पेड़।” यूनानी शब्द का अर्थ ‘मैदानी इलाके’ या अधिक सामान्य रूप से ‘खुले खेत/देहात’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  choice: खेती करते थे
  rationale: यह चल रहे या नियमित कृषि-कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है; केवल हल चलाने तक अर्थ को सीमित नहीं करता।
- source_word: γῆν
  choice: भूमि
  rationale: यहाँ आशय उनकी खेती की भूमि से है, पूरी पृथ्वी से नहीं।
- source_word: μετʼ εἰρήνης
  choice: शान्ति से
  rationale: यह खेती किए जाने की शांत और सुरक्षित परिस्थिति को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐδίδου
  choice: देती थी
  rationale: अपूर्ण भूतकाल निरन्तर या नियमित उपज को दर्शाता है; हिन्दी का यह रूप उसी पहलू को बनाए रखता है।
- source_word: γενήματα
  choice: उपज
  rationale: यह भूमि से मिलने वाली पैदावार के लिए व्यापक और स्वाभाविक शब्द है तथा आगे पेड़ों के ‘फल’ से भेद बनाए रखता है।
- source_word: ξύλα
  choice: पेड़
  rationale: उनके फल देने के उल्लेख से स्पष्ट है कि यहाँ लकड़ी नहीं, जीवित फलदार पेड़ अभिप्रेत हैं।
- source_word: πεδίων
  choice: मैदानी इलाकों के
  rationale: यह πέδιον के समतल, खुले भूभाग के भौगोलिक भाव को रखता है; ‘खेतों’ की अपेक्षा भूमि के प्रकार को अधिक स्पष्ट करता है।
- source_word: καρπὸν
  choice: फल
  rationale: पेड़ों के संदर्भ में यह सबसे सीधा और स्वाभाविक समानार्थी है।
