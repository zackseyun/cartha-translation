translation:
  language: hi
  text: और उनकी प्रतिलिपियाँ भंडार-गृह में रखी जाएँ, ताकि वे शमौन और उसके पुत्रों के पास हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφα
  choice: प्रतिलिपियाँ
  rationale: यह शब्द दस्तावेज़ों की बनाई गई नकलों को दर्शाता है। ‘प्रतिलिपियाँ’ आधुनिक हिन्दी में दस्तावेज़ी संदर्भ के लिए स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: θέσθαι
  choice: रखी जाएँ
  rationale: संदर्भ में यह infinitive पहले कही गई आज्ञा या व्यवस्था की विषयवस्तु बताता है; हिन्दी का विध्यर्थक कर्मवाच्य उस निर्देशात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γαζοφυλακίῳ
  choice: भंडार-गृह
  rationale: यह खजाने अथवा मूल्यवान वस्तुओं और अभिलेखों को सुरक्षित रखने के कक्ष को सूचित कर सकता है। यहाँ दस्तावेज़ सुरक्षित रखने का संदर्भ होने से ‘भंडार-गृह’ उपयुक्त है और केवल धन रखने का अर्थ आरोपित नहीं करता।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्यसूचक संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔχῃ
  choice: के पास वे रहें
  rationale: यूनानी subjunctive उद्देश्य का भाव रखता है और उसका कर्म पहले उल्लिखित प्रतिलिपियाँ हैं। ‘के पास वे रहें’ उपलब्धता या अभिरक्षा का अर्थ देता है, बिना पूर्ण स्वामित्व को अनावश्यक रूप से निश्चित किए।
