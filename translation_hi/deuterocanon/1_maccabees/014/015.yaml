  - marker: b
    text: अर्थात पवित्रस्थान की सेवा में प्रयुक्त पवित्र पात्र या उपकरण।
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: पवित्र वस्तुओं
  rationale: यूनानी नपुंसकलिंग बहुवचन का अर्थ ‘पवित्र वस्तुएँ’ या विस्तार से ‘पवित्रस्थान’ हो सकता है। मुख्य पाठ में व्यापक और औपचारिक अर्थ रखा गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐδόξασεν
  choice: आदर बढ़ाया
  rationale: क्रिया का मूल भाव महिमा या सम्मान देना है। इस ऐतिहासिक और उपासना-संबंधी प्रसंग में ‘आदर बढ़ाया’ स्वाभाविक हिन्दी है और उसके द्वारा पवित्र वस्तुओं की प्रतिष्ठा बढ़ाने का भाव व्यक्त करता है।
- source_word: ἐπλήθυνεν
  choice: संख्या बढ़ाई
  rationale: क्रिया का अर्थ किसी वस्तु को अधिक या बहुसंख्यक करना है। पात्रों के प्रसंग में ‘संख्या बढ़ाई’ स्पष्ट और स्वाभाविक है।
- source_word: τὰ σκεύη
  choice: पात्रों
  rationale: उपासना के प्रसंग में σκεύη पवित्र सेवा में प्रयुक्त पात्रों या उपकरणों को सूचित करता है। ‘पात्र’ हिन्दी बाइबलीय शैली में परिचित और यहाँ उपयुक्त है।
- source_word: τῶν ἁγίων
  choice: पवित्रस्थान के
  rationale: सम्बन्धकारक पद उन पात्रों को पवित्र क्षेत्र या पवित्रस्थान से जोड़ता है। ‘पवित्रस्थान के’ प्रसंग को स्पष्ट करता है और पहले पद के साथ अनावश्यक पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: τὰ ἅγια का संदर्भ—पवित्र वस्तुएँ या पवित्रस्थान
  choice: मुख्य पाठ में ‘पवित्र वस्तुओं’
  alternative: ‘पवित्रस्थान की महिमा बढ़ाई’ या ‘पवित्र वस्तुओं को महिमा दी’
  rationale: यूनानी में वास्तविक अर्थगत अस्पष्टता है। अगले खंड में पवित्रस्थान के पात्रों का अलग उल्लेख होने के कारण मुख्य पाठ व्यापक अर्थ रखता है और स्थानवाचक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘पवित्रस्थान’ को संयुक्त रूप में रखा गया है और उपासना-संबंधी σκεύη के लिए परिचित शब्द ‘पात्र’ चुना गया है।
