translation:
  language: hi
  text: और उन्होंने कहा कि इस लेख को काँसे की पट्टिकाओं पर रखा जाए और उन पट्टिकाओं को पवित्रस्थान के अहाते में किसी सुरक्षित स्थान पर स्थापित किया जाए।
