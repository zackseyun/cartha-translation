lexical_decisions:
- source_word: τὴν γραφὴν ταύτην
  choice: इस लेख
  rationale: यहाँ γραφή किसी लिखित अभिलेख या दस्तावेज़ को सूचित करता है; संक्षिप्त और स्वाभाविक हिन्दी में ‘इस लेख’ उपयुक्त है।
- source_word: θέσθαι ἐν δέλτοις χαλκαῖς
  choice: काँसे की पट्टिकाओं पर रखा जाए
  rationale: θέσθαι का मूल अर्थ ‘रखना’ है; यूनानी पाठ स्पष्ट रूप से ‘खुदवाना’ नहीं कहता, इसलिए स्रोत की व्यापकता सुरक्षित रखी गई है।
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  choice: पवित्रस्थान के अहाते में
  rationale: περίβολος घिरे हुए प्रांगण या अहाते को दर्शाता है, और τὰ ἅγια यहाँ मंदिर-पवित्रस्थान के लिए प्रयुक्त है।
- source_word: ἐν τόπῳ πιστῷ
  choice: किसी सुरक्षित स्थान पर
  rationale: πιστός का यहाँ प्रसंगानुकूल अर्थ भरोसेमंद अथवा सुरक्षित स्थान है, जहाँ अभिलेख सुरक्षित रहे।
