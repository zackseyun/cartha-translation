base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: hi
  text: जब यहूदा और लोगों ने ये बातें[a] सुनीं, तब एक बड़ी सभा इस बात पर विचार करने के लिए इकट्ठी हुई कि वे अपने उन भाइयों[b] के लिए क्या करें, जो संकट में थे और जिनके विरुद्ध वे लोग[c] युद्ध कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये समाचार”; यूनानी में शाब्दिक रूप से “ये बातें/शब्द।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से अभिप्राय उनके अपने यहूदी समुदाय के लोगों से है।
    reason: cultural_note
  - marker: c
    text: “वे लोग” से संभवतः प्रसंग में उल्लिखित शत्रु जातियाँ अभिप्रेत हैं; यूनानी वाक्य में उनका नाम यहाँ स्पष्ट रूप से नहीं दिया गया है।
    reason: ambiguity_note
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: जब ... ने ... सुनीं, तब
  rationale: Ὡς के साथ अओरिस्ट यहाँ कालसूचक उपवाक्य बनाता है। ‘जब ... तब’ कथा-क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना तत्कालता को अनावश्यक रूप से बढ़ाए।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यूनानी Ἰούδας के लिए हिन्दी बाइबलीय नाम-रूप ‘यहूदा’ स्वाभाविक और पहचाना हुआ है।
- source_word: ὁ λαός
  choice: लोगों
  rationale: यह शब्द यहूदा के साथ जुड़े यहूदी जनसमुदाय को व्यापक रूप से दर्शाता है; इसे केवल सेना मानना आवश्यक नहीं है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγους का मूल अर्थ ‘शब्द/बातें’ है, जबकि प्रसंग में यह सुनाई गई सूचना को भी सूचित कर सकता है। ‘ये बातें’ हिन्दी में सहज है और दोनों अर्थों के लिए पर्याप्त खुलापन रखता है।
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: एक बड़ी सभा ... इकट्ठी हुई
  rationale: ἐκκλησία यहाँ पूर्व-ईसाई यहूदी सार्वजनिक सभा है, इसलिए ‘कलीसिया’ के बजाय ‘सभा’ उपयुक्त है। क्रिया का रूप सभा के एकत्र होने को व्यक्त करता है।
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: इस बात पर विचार करने के लिए ... कि वे ... क्या करें
  rationale: यह सभा के उद्देश्य और व्यावहारिक विचार-विमर्श, दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: अपने उन भाइयों
  rationale: ἀδελφοῖς का प्रत्यक्ष संबंधसूचक रूप ‘भाइयों’ रखा गया है; प्रसंग में इससे उनके अपने यहूदी समुदाय के सदस्य अभिप्रेत हैं।
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: जो संकट में थे
  rationale: θλίψις दबाव, क्लेश या घोर कठिनाई की दशा बताता है। ‘संकट’ गंभीरता बनाए रखते हुए आधुनिक पाठक के लिए स्पष्ट है।
- source_word: πολεμουμένοις ὑπʼ αὐτῶν
  choice: जिनके विरुद्ध वे लोग युद्ध कर रहे थे
  rationale: यह निष्क्रिय कृदंत को स्वाभाविक हिन्दी में सक्रिय रचना से व्यक्त करता है और सैन्य शत्रुता का अर्थ बनाए रखता है। ‘वे लोग’ का संदर्भ मूल की तरह तत्काल वाक्य में निर्दिष्ट नहीं किया गया।
theological_decisions:
- issue: पूर्व-ईसाई यहूदी ऐतिहासिक प्रसंग में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मंडली / कलीसिया / जनसभा
  rationale: यहाँ शब्द एक विचार-विमर्श के लिए एकत्र सार्वजनिक समुदाय को दर्शाता है। ‘कलीसिया’ बाद की ईसाई संस्थागत धारणा आयात कर सकती है।
- issue: ἀδελφοῖς के सामुदायिक अर्थ को व्यक्त करना
  choice: भाइयों
  alternative: बंधुओं / साथी यहूदियों / भाई-बहनों
  rationale: मूल यूनानी के पुरुषवाची संबंधसूचक शब्द को बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ अपने ही यहूदी समुदाय के लोग अभिप्रेत हैं।
- issue: ὑπʼ αὐτῶν में सर्वनाम के पूर्वपद की अस्पष्टता
  choice: मुख्य पाठ में ‘वे लोग’ रखकर अस्पष्टता बनाए रखना
  alternative: आस-पास की जातियाँ / शत्रु
  rationale: प्रसंग शत्रु जातियों की ओर संकेत करता है, पर इस वाक्य में सर्वनाम स्वयं उनका नाम नहीं लेता। इसलिए स्पष्ट पहचान को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में संभावित संदर्भ बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सहज रखी गई है। ‘सभा’ और ‘युद्ध कर रहे थे’ जैसे सामान्य शब्द ऐतिहासिक प्रसंग को स्पष्ट रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में दिए गए हैं।
