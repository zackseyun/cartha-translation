  yaml_path: translation/deuterocanon/1_maccabees/005/045.yaml
  text: And Judas gathered all Israel who were in Gilead[a], from the least to the greatest, along with their wives and their children and their baggage, a very great company, to come into the land of Judah.
translation:
  language: hi
  text: तब यहूदा ने गिलाद में रहनेवाले सभी इस्राएलियों को—छोटे से लेकर बड़े तक—उनकी पत्नियों, बच्चों और सामान समेत, एक बहुत बड़े जनसमूह को, यहूदा देश में आने के लिए इकट्ठा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बहुत बड़ी छावनी।” यूनानी शब्द का अर्थ विशेषकर सैनिक प्रसंगों में “छावनी” हो सकता है, पर यहाँ यह परिवारों और सामान सहित एकत्र हुए पूरे जनसमूह को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: यह क्रिया लोगों को एक साथ एकत्र करने की ठोस कार्रवाई बताती है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: गिलाद में रहनेवाले सभी इस्राएलियों को
  rationale: यहाँ आशय गिलाद में उपस्थित समस्त इस्राएली जन से है। हिन्दी में बहुवचन जातिवाचक रूप मूल अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: छोटे से लेकर बड़े तक
  rationale: यह व्यापक समावेश का पारंपरिक मुहावरा है। इसे केवल आयु के अर्थ में ‘बच्चों से बूढ़ों तक’ कहना मूल की सामाजिक अथवा आयु-संबंधी व्यापकता को अनावश्यक रूप से सीमित करता।
- source_word: ἀποσκευήν
  choice: सामान
  rationale: यह यात्रा में साथ ले जाए जानेवाले सामान या चल संपत्ति को सूचित करता है। ‘सामान’ सरल हिन्दी में इसकी पर्याप्त व्यापकता बनाए रखता है।
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: एक बहुत बड़ा जनसमूह
  rationale: παρεμβολή का अर्थ सैनिक संदर्भ में ‘छावनी’ हो सकता है, पर यहाँ परिवारों और सामान सहित एकत्र लोगों का सारवाचक वर्णन है। ‘जनसमूह’ इस प्रसंग में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: ताकि वे ... यहूदा देश में आएँ
  rationale: अनन्त क्रिया एकत्र किए जाने के उद्देश्य या अपेक्षित परिणाम को व्यक्त करती है। ‘ताकि’ हिन्दी में इस संबंध को स्पष्ट करता है और ‘आएँ’ ἐλθεῖν के निकट है।
