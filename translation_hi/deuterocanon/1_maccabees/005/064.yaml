- source_word: ἐπισυνήγοντο
  choice: इकट्ठे होते गए
  rationale: अपूर्णकालीन रूप निरंतर या क्रमशः लोगों के उनके पास जुटते जाने का भाव देता है; यह अनुवाद उस प्रगतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς αὐτούς
  choice: उनके पास
  rationale: πρός के साथ कर्मकारक यहाँ व्यक्तियों की ओर गति दर्शाता है; ‘उनके पास’ इस दिशात्मक अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: εὐφημοῦντες
  choice: उनकी प्रशंसा करते रहे
  rationale: εὐφημέω यहाँ अनुकूल और अनुमोदनपूर्ण वचन बोलने का भाव रखता है। ‘प्रशंसा करते रहे’ प्रसंगानुकूल है, जबकि वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिया गया है।
