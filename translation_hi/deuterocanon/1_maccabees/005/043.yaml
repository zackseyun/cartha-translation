  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
translation:
  language: hi
  text: वह सबसे पहले उनकी ओर[a] पार गया, और उसके सभी लोग उसके आगे थे। उसके सामने सभी जातियाँ चूर हो गईं; उन्होंने अपने सारे हथियार फेंक दिए और करनाइन के पवित्र-स्थान[b] में भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके विरुद्ध”; यूनानी पद का अर्थ “उनकी ओर” हो सकता है, और इस युद्ध-संदर्भ में “उनके विरुद्ध” भी।
    reason: lexical_alternative
  - marker: b
    text: या “पवित्र घेरा” अथवा “मन्दिर-परिसर”; यूनानी शब्द किसी देवता को समर्पित पवित्र स्थान या घेरे को दर्शाता है।
    reason: lexical_alternative
