  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
translation:
  language: hi
  text: सैन्य-दलों के सेनापति, जकर्याह के पुत्र यूसुफ और अजर्याह[a], ने वीरता के कार्यों और उस युद्ध के बारे में सुना जो उन्होंने लड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वेटे में लिप्यंतरित यूनानी पाठ में दूसरे नाम के स्थान पर ‘जकर्याह’ लिखा हुआ प्रतीत होता है; किंतु कथा-संदर्भ और मानक पाठ-परंपरा यहाँ ‘अजर्याह’ का समर्थन करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: के बारे में सुना
  rationale: क्रिया का अर्थ सुनना अथवा सुनकर जानना है; आगे बताए गए कार्यों के साथ यह हिंदी में स्वाभाविक है।
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: जकर्याह के पुत्र यूसुफ
  rationale: लेख सहित संबंधकारक पदबंध पुत्र-संबंध बताता है; हिंदी में ‘के पुत्र’ स्पष्ट और स्वाभाविक है।
- source_word: Ζαχαρίας
  choice: अजर्याह[a]
  rationale: प्रस्तुत स्वेटे पाठ में दूसरा नाम जकर्याह दिखाई देता है, पर निकटवर्ती कथा-संदर्भ और मानक पाठ-परंपरा इस स्थान पर अजर्याह का समर्थन करते हैं; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: सैन्य-दलों के सेनापति
  rationale: यह पद सैन्य शक्तियों अथवा टुकड़ियों के अगुओं को दर्शाता है; ‘सेनापति’ आधुनिक पदक्रम को अत्यधिक विशिष्ट किए बिना सैन्य नेतृत्व व्यक्त करता है।
- source_word: ἀνδραγαθήσεων
  choice: वीरतापूर्ण कामों
  rationale: संज्ञा साहस और वीरता प्रदर्शित करने वाले कार्यों को सूचित करती है; यह चयन आधुनिक हिंदी में सहज है और अनावश्यक रूप से लिंग-विशिष्ट नहीं है।
- source_word: τοῦ πολέμου
  choice: युद्ध में किए गए पराक्रमों
  rationale: वीरतापूर्ण कार्यों के समानांतर इस पद को ठोस युद्ध-संबंधी उपलब्धियों के रूप में व्यक्त किया गया है, जिससे अमूर्त ‘युद्ध’ की अपेक्षा संदर्भित कारनामों का भाव स्पष्ट होता है।
- source_word: οἷα ἐποίησαν
  choice: जो उन्होंने किए थे
  rationale: संबंधवाचक अभिव्यक्ति पहले उल्लिखित कामों और पराक्रमों को समेटती है; पूर्ण भूतकाल पहले संपन्न कार्यों की खबर मिलने का भाव देता है।
