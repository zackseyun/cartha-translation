lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: सेना के पुरुषों से
  rationale: यह पदबंध युद्ध करने वाले पुरुष सदस्यों को सूचित करता है। ‘सेना’ सैन्य संदर्भ में δύναμις का स्वाभाविक हिन्दी रूप है, और ‘पुरुषों’ से यूनानी के लिंग-सूचक शब्द ἀνδράσιν को बनाए रखा गया है।
- source_word: Πολεμήσατε
  choice: लड़ो
  rationale: एओरिस्ट आज्ञार्थक तत्काल युद्धात्मक कार्रवाई का आह्वान करता है; ‘लड़ो’ सीधा और स्वाभाविक है।
- source_word: σήμερον
  choice: आज
  rationale: यह वर्तमान दिन और कार्रवाई की तात्कालिकता को व्यक्त करता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ ὑπέρ दूसरों की ओर से अथवा उनकी रक्षा में लड़ने का भाव रखता है; ‘के लिए’ अर्थ को अनावश्यक रूप से सीमित किए बिना दोनों संभावनाएँ रहने देता है।
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: हमारे भाइयों
  rationale: यह यूनानी के पुल्लिंग बहुवचन को सुरक्षित रखता है और सामुदायिक आत्मीयता व्यक्त करता है; प्रसंग में इसका संकेत केवल सगे भाइयों तक सीमित न होकर साथी इस्राएलियों की ओर हो सकता है।
theological_decisions:
- issue: लिंग-सूचक संबंधवाचक भाषा
  choice: हमारे भाइयों
  alternative: हमारे भाई-बहनों / हमारे स्वजनों
  rationale: यूनानी में पुल्लिंग बहुवचन ἀδελφῶν है। इसलिए मुख्य पाठ में ‘भाइयों’ रखा गया है, जबकि टिप्पणी स्पष्ट करती है कि आशय व्यापक रूप से साथी इस्राएलियों से भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘सेना के पुरुषों’ में यूनानी पदबंध का लिंग-सूचक स्वरूप और सैन्य अर्थ दोनों सुरक्षित हैं; अधिक मुहावरेदार विकल्प ‘सैनिकों’ होता, पर उससे ἀνδράσιν का स्पष्ट पुरुष-संदर्भ ओझल हो जाता।
