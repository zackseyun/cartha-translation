  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: hi
  text: वह माअफ़ा की ओर मुड़ा और उसके विरुद्ध लड़ा। उसने उस पर अधिकार कर लिया, वहाँ के हर पुरुष को मार डाला, उसकी लूट ले ली और उसे आग से जला दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν
  choice: रास्ते से मुड़कर ... गया
  rationale: क्रिया में मार्ग से मुड़ने का भाव है; यह अभिव्यक्ति उस गति-सूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: Μααφὰ
  choice: माअफ़ा
  rationale: यूनानी स्थान-नाम Μααφά का देवनागरी लिप्यंतरण, जिसमें अलग-अलग स्वरों और φ की ध्वनि को यथासंभव दर्शाया गया है।
- source_word: ἐπολέμησεν αὐτήν
  choice: उसके विरुद्ध लड़ा
  rationale: यह सामान्य युद्ध-संबंधी अभिव्यक्ति है और मूल पाठ से अधिक तीव्र अर्थ जोड़े बिना संघर्ष को व्यक्त करती है।
- source_word: κατελάβετο
  choice: उस नगर पर अधिकार कर लिया
  rationale: सैनिक प्रसंग में इसका अर्थ नगर को जीतकर अपने अधिकार में लेना है; स्त्रीलिंग सर्वनाम के संकेतित नगर को हिन्दी में स्पष्ट किया गया है।
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: वहाँ के हर पुरुष को
  rationale: यह मूल वाक्यांश की व्यापकता को बनाए रखता है; इस मानवीय नगर-संदर्भ में 'पुरुष' स्वाभाविक आधुनिक हिन्दी है।
- source_word: τὰ σκῦλα
  choice: उसकी लूट
  rationale: युद्ध में प्राप्त माल के लिए 'लूट' स्पष्ट और सामान्य हिन्दी शब्द है।
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: उसे आग में जला दिया
  rationale: मूल में आग का स्पष्ट उल्लेख है; हिन्दी अभिव्यक्ति विनाश के परिणाम को बिना अनावश्यक विस्तार के सुरक्षित रखती है।
