  yaml_path: translation/deuterocanon/1_maccabees/005/060.yaml
  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
translation:
  language: hi
  text: और योसेफ और अजर्याह हारकर भागे, और उनका पीछा यहूदिया की सीमाओं तक किया गया। उस दिन इस्राएल की प्रजा में से लगभग दो हजार पुरुष मारे गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में संख्या वाला वाक्यांश शाब्दिक रूप से ‘दो हजार पुरुषों तक’ है; संभवतः इसका अर्थ अनुमानित कुल संख्या है, इसलिए ‘लगभग दो हजार पुरुष’ अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  choice: हारकर भागे
  rationale: सैन्य प्रसंग में यह क्रिया पराजित होकर भागने पर विवश होने का भाव देती है; यह आधुनिक हिन्दी में सहज है और केवल सामान्य ‘हार गए’ से अधिक स्पष्ट है।
- source_word: ἐδιώχθησαν
  choice: उनका पीछा ... किया गया
  rationale: पराजय के बाद शत्रु द्वारा किए गए पीछा करने की निष्क्रिय क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: यहूदिया की सीमाओं तक
  rationale: ἕως की अंतिम सीमा और ὅρια के बहुवचन ‘सीमाओं’—दोनों को सीधे बनाए रखता है।
- source_word: ἔπεσον
  choice: मारे गए
  rationale: युद्ध-वृत्तांत में ‘गिरे’ का आशय मृत्यु है; आधुनिक हिन्दी में ‘मारे गए’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यूनानी कालवाचक पद का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: इस्राएल की प्रजा में से
  rationale: ἐκ के ‘में से’ वाले भाव तथा इस्राएली समुदाय से संबंधित होने को सुरक्षित रखता है।
- source_word: εἰς δισχιλίους ἄνδρας
  choice: लगभग दो हजार पुरुष
  rationale: संख्या के साथ εἰς यहाँ अनुमानित कुल संख्या का संकेत दे सकता है; ‘लगभग’ इस संभावित अर्थ को व्यक्त करता है।
