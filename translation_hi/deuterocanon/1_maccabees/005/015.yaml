  yaml_path: translation/deuterocanon/1_maccabees/005/015.yaml
  text: saying[a], “A gathering has been assembled against them from Ptolemais and Tyre and Sidon and all Galilee of the foreigners, to wipe us out.”
translation:
  language: hi
  text: यह कहते हुए, “टॉलेमाइस, सोर, सीदोन और विदेशियों की सारी गलील[a] से उनके विरुद्ध एक दल इकट्ठा किया गया है, हमें पूरी तरह नष्ट करने के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्यजातियों की सारी गलील।” यूनानी में शाब्दिक रूप से “विदेशियों की सारी गलील” है; प्रयुक्त शब्द दूसरे राष्ट्र या समुदाय के लोगों को दर्शाता है।
    reason: ἀλλοφύλων के पारंपरिक वैकल्पिक अनुवाद और उसके शाब्दिक जातीय अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: यह वर्तमान कृदंत का स्वाभाविक हिन्दी रूप है और पिछले प्रसंग से वाक्य का संबंध बनाए रखता है।
- source_word: Ἐπισυνήχθη
  choice: एक दल इकट्ठा किया गया है
  rationale: यूनानी अओरिस्ट कर्मवाच्य को कर्मवाच्य में रखा गया है। निहित सामूहिक कर्ता के लिए ‘एक दल’ स्पष्ट और स्वाभाविक है, जबकि ‘सेना’ मूल से अधिक विशिष्ट होता।
- source_word: ἐπʼ αὐτούς
  choice: उनके विरुद्ध
  rationale: सैनिक प्रसंग में ἐπί के शत्रुतापूर्ण दिशाबोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना आक्रमण की अतिरिक्त क्रिया जोड़े।
- source_word: ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος καὶ πάσης Γαλιλαίας ἀλλοφύλων
  choice: टॉलेमाइस, सोर, सीदोन और विदेशियों की सारी गलील से
  rationale: स्थान-नामों को हिन्दी में प्रचलित अथवा स्रोत-सन्निकट रूप दिया गया है। संबंधकारक ἀλλοφύλων को ‘विदेशियों की’ के रूप में गलील से संबद्ध रखा गया है।
- source_word: ἀλλοφύλων
  choice: विदेशियों
  rationale: शब्द का मूल भाव दूसरे लोगों या राष्ट्र के व्यक्तियों का है। इस ऐतिहासिक-सैनिक प्रसंग में ‘विदेशियों’ जातीय-राजनीतिक अर्थ को स्पष्ट रखता है; पारंपरिक ‘अन्यजातियों’ को पादटिप्पणी में दिया गया है।
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  choice: ताकि हमें पूरी तरह मिटा डाला जाए
  rationale: सप्रत्यय अनंत क्रिया का प्रयोजन और पूर्ण विनाश का बल दोनों व्यक्त होते हैं। ‘हमें’ मूल के प्रथम पुरुष बहुवचन को सुरक्षित रखता है।
theological_decisions:
- issue: ἀλλόφυλοι का ऐतिहासिक-सैनिक प्रसंग में अनुवाद
  choice: विदेशियों
  alternative: अन्यजातियों
  rationale: यहाँ शब्द मुख्यतः जातीय और राजनीतिक विरोधियों को दर्शाता है, न कि आवश्यक रूप से किसी विकसित धर्मवैज्ञानिक श्रेणी को। फिर भी पारंपरिक और सम्भव अनुवाद ‘अन्यजातियों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘उनके विरुद्ध’ से ‘हमें’ की ओर पुरुष-वचन का परिवर्तन
  choice: मूल के परिवर्तन को यथावत रखा गया
  alternative: दोनों को ‘हमारे विरुद्ध/हमें’ करके समरूप करना
  rationale: यूनानी पाठ में αὐτούς से ἡμᾶς का वास्तविक परिवर्तन है। उसे समरूप करना मूल की कथन-रचना को अनावश्यक रूप से बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एक दल’ सैनिक परिस्थिति का संकेत देता है, पर मूल से आगे बढ़कर उसे स्पष्ट रूप से ‘सेना’ नहीं कहता। स्थान-नामों में ‘सोर’ और ‘सीदोन’ जैसे प्रचलित हिन्दी बाइबलीय रूप तथा ‘टॉलेमाइस’ का स्रोत-सन्निकट रूप अपनाया गया है।
