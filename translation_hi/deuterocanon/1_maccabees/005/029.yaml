  text: And he set out from there by night[a], and he kept going until he reached the stronghold.
translation:
  language: hi
  text: और वह रात में वहाँ से चल पड़ा और दुर्ग[a] तक आगे बढ़ता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘किलेबंद स्थान।’
    reason: यूनानी ὀχύρωμα किसी दुर्ग के साथ-साथ अधिक सामान्य अर्थ में किसी किलेबंद स्थान को भी दर्शा सकता है।
lexical_decisions:
- source_word: ἀπῆρεν
  choice: चल पड़ा
  rationale: यह क्रिया किसी स्थान से यात्रा आरम्भ करने या प्रस्थान करने को व्यक्त करती है; ‘चल पड़ा’ आधुनिक हिन्दी में स्वाभाविक है और सैनिक यात्रा के प्रसंग के अनुकूल है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह प्रस्थान के स्थान को बताने वाला सीधा स्थानवाचक क्रियाविशेषण है।
- source_word: νυκτός
  choice: रात में
  rationale: यह क्रियाविशेषणात्मक संबंधकारक है और रात के समय की यात्रा को संक्षेप तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπορεύετο
  choice: आगे बढ़ता गया
  rationale: अपूर्ण भूतकाल की यह क्रिया जारी गति को दर्शाती है; ‘आगे बढ़ता गया’ उसके कालगत पक्ष को बनाए रखता है।
- source_word: ἕως ἐπὶ
  choice: तक
  rationale: यह यात्रा की सीमा या गंतव्य को व्यक्त करता है; ‘तक’ यूनानी अभिव्यक्ति के निकट रहते हुए किसी अतिरिक्त आगमन-क्रिया को नहीं जोड़ता।
- source_word: ὀχύρωμα
  choice: दुर्ग
  rationale: यह शब्द किसी सुरक्षित, किलेबंद स्थान या गढ़ को दर्शाता है; ‘दुर्ग’ संक्षिप्त, गरिमापूर्ण और सैनिक प्रसंग में उपयुक्त है।
