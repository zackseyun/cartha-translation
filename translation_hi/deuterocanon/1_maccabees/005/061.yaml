base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/061.yaml
  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
translation:
  language: hi
  text: और लोगों में बड़ी भगदड़ मच गई[a], क्योंकि उन्होंने यहूदा और उसके भाइयों की बात नहीं मानी थी; वे सोचते थे कि वे स्वयं वीरता दिखाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोगों की भारी हार हुई’ अथवा ‘लोगों में बड़ी घबराहट फैल गई’; यूनानी शब्द का मूल भाव पलटकर भागने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे स्वयं को वीर सिद्ध करेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή
  choice: भगदड़
  rationale: सैनिक प्रसंग में यह शब्द पलटकर भागने और सेना के तितर-बितर होने को दर्शाता है। ‘भगदड़’ इस अचानक पराजयपूर्ण पलायन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαός
  choice: लोगों
  rationale: यूनानी पाठ का सामान्य शब्द ‘लोग’ है। प्रसंग में इससे युद्ध में सम्मिलित समुदाय अभिप्रेत है, पर ‘सेना’ कहना मूल से अधिक विशिष्ट होता।
- source_word: οὐκ ἤκουσαν
  choice: बात नहीं मानी थी
  rationale: यहाँ ἀκούω केवल सुनने नहीं, किसी की बात पर ध्यान देकर उसके अनुसार चलने का भाव रखता है। ‘बात नहीं मानी थी’ कारणात्मक प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: Ἰούδας नाम का प्रचलित हिन्दी बाइबलीय रूप ‘यहूदा’ है।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: इस प्रसंग में यह शब्द यहूदा के पुरुष सहोदरों को सूचित करता है; ‘भाइयों’ सीधा और स्वाभाविक अनुवाद है।
- source_word: οἰόμενοι
  choice: वे सोचते थे
  rationale: कृदन्त उनके कार्य के पीछे की धारणा बताता है। हिन्दी में अलग उपवाक्य इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἀνδραγαθῆσαι
  choice: वीरता दिखाएँगे
  rationale: क्रिया साहसपूर्ण कार्य करने या युद्ध में अपने शौर्य का प्रमाण देने को व्यक्त करती है। ‘वीरता दिखाएँगे’ आधुनिक, गरिमापूर्ण और अर्थ-संगत है।
- source_word: αὐτοί
  choice: वे स्वयं
  rationale: बलाघाती सर्वनाम को ‘स्वयं’ द्वारा सुरक्षित रखा गया है; इससे उनका यह आत्मविश्वास उभरता है कि वे अपने ही बल पर वीरता दिखा सकेंगे।
theological_decisions:
- issue: भगदड़ के कारण के रूप में यहूदा और उसके भाइयों की बात न मानना
  choice: ‘क्योंकि’ द्वारा स्पष्ट कारणात्मक संबंध
  alternative: इसे केवल ढीली कथात्मक व्याख्या के रूप में प्रस्तुत करना
  rationale: ὅτι स्वाभाविक रूप से भगदड़ का कारण प्रस्तुत करता है। अनुवाद इसी कथात्मक निर्णय को रखता है, पर उससे आगे कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भगदड़’ सैन्य पराजय और पलायन दोनों का बोध कराता है, जबकि पादटिप्पणी मूल शब्द की अर्थ-सीमा सुरक्षित रखती है।
