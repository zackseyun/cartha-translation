  text: And they said[a], “Let us also make a name for ourselves[b], and let us go to fight against the nations around us.”
translation:
  language: hi
  text: और उन्होंने कहा, “हम भी अपने लिए नाम बनाएँ[a] और अपने चारों ओर की जातियों[b] से युद्ध करने चलें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, अपने लिए यश कमाएँ। यूनानी में शाब्दिक रूप से “अपने लिए नाम बनाएँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने चारों ओर की अन्यजातियों।” यहाँ यूनानी शब्द आस-पास के गैर-यहूदी जनसमूहों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  choice: हम ... अपने लिए नाम बनाएँ
  rationale: यह अनुवाद यूनानी मुहावरे ‘अपने लिए नाम बनाना’ को बनाए रखता है; इसका भाव यश या प्रसिद्धि प्राप्त करना है।
- source_word: καὶ αὐτοὶ
  choice: हम भी
  rationale: καί के योगात्मक भाव और αὐτοί के बलाघात—‘हम स्वयं भी’—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορευθῶμεν πολεμῆσαι
  choice: युद्ध करने चलें
  rationale: πορευθῶμεν की गति और πολεμῆσαι के युद्ध-संबंधी अर्थ दोनों को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: τὰ ἔθνη
  choice: जातियों
  rationale: ἔθνη के व्यापक अर्थ को सुरक्षित रखता है; प्रसंग से ये आस-पास के गैर-यहूदी जनसमूह हैं, पर मुख्य पाठ में उस व्याख्या को अनिवार्य नहीं बनाया गया।
- source_word: τὰ κύκλῳ ἡμῶν
  choice: अपने चारों ओर की
  rationale: वक्ताओं के दृष्टिकोण से ‘हमारे चारों ओर स्थित’ होने का स्थानीय अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ‘अपने लिए नाम बनाना’ मुहावरे का अर्थ
  choice: स्रोत का मुहावरा मुख्य पाठ में सुरक्षित रखा गया
  alternative: अपने लिए यश कमाएँ
  rationale: शाब्दिक बिंब हिन्दी में समझने योग्य है और बाइबलीय साहित्यिक प्रतिध्वनि को बनाए रखता है; पादटिप्पणी उसका आशय स्पष्ट करती है।
- issue: ἔθνη का अनुवाद
  choice: जातियों
  alternative: अन्यजातियों
  rationale: यह ऐतिहासिक-सैन्य प्रसंग में यूनानी शब्द की व्यापकता और संभावित गैर-यहूदी संदर्भ दोनों के बीच का तनाव बनाए रखता है; ‘अन्यजातियों’ को पादटिप्पणी में विकल्प दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। वाक्य में सामूहिक आत्म-प्रेरणा का स्वर रखा गया है और सैन्य क्रिया को अनावश्यक रूप से तीव्र या नरम नहीं किया गया।
