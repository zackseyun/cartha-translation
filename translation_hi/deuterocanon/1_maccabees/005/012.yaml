lexical_decisions:
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: यह पदबंध वर्तमान तात्कालिकता और पिछले कथन से निकलने वाले निष्कर्ष—दोनों को व्यक्त करता है।
- source_word: ἐλθὼν
  choice: आकर
  rationale: यद्यपि यह व्याकरणतः एओरिस्ट कृदन्त है, अगले आज्ञार्थक क्रिया-पद के साथ मिलकर तत्काल आने और बचाने की विनती व्यक्त करता है। हिन्दी में ‘आकर ... छुड़ा’ स्वाभाविक और स्रोत के निकट है।
- source_word: ἔξελου
  choice: छुड़ा
  rationale: ἐξαιρέω यहाँ संकट या शत्रु के वश से निकालने का अर्थ देता है। ‘छुड़ा’ आधुनिक हिन्दी में सीधा, स्वाभाविक और तात्कालिक है।
- source_word: ἐκ χειρὸς αὐτῶν
  choice: उनके हाथ से
  rationale: मूल रूपक को बनाए रखा गया है; इस प्रसंग में ‘हाथ’ शत्रुतापूर्ण अधिकार या वश का प्रचलित बिंब है।
- source_word: πέπτωκεν
  choice: गिर चुके हैं
  rationale: πίπτω के पूर्णकाल का मूल अर्थ ‘गिरना’ है। सैनिक प्रसंग में इसका संकेत मारे जाने, पराजित होने, या दोनों की ओर हो सकता है; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- source_word: ἐξ ἡμῶν
  choice: हममें से
  rationale: यह यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है तथा समुदाय के भीतर से हुई हानि को स्पष्ट करता है।
- source_word: πλῆθος
  choice: बहुत-से लोग
  rationale: πλῆθος बड़ी संख्या को दर्शाता है। हिन्दी में ‘हममें से बहुत-से लोग’ मूल के परिमाणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
