  yaml_path: translation/deuterocanon/1_maccabees/005/054.yaml
  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
translation:
  language: hi
  text: और वे हर्ष और आनन्द के साथ सिय्योन पर्वत पर चढ़े, और उन्होंने सम्पूर्ण होमबलियाँ[a] चढ़ाईं, क्योंकि शान्ति से लौटने तक उनमें से एक भी नहीं मारा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “होमबलियाँ।” यूनानी शब्द उन बलियों के लिए है जो वेदी पर पूरी तरह जला दी जाती थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: चढ़े
  rationale: यह क्रिया ऊपर जाने या चढ़ने को व्यक्त करती है। ‘चढ़े’ सिय्योन पर्वत की ओर आरोहण के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ ὄρος Σιὼν
  choice: सिय्योन पर्वत
  rationale: यह स्थान-नाम का मानक और सहज हिन्दी रूप है तथा उसके भौगोलिक और धार्मिक संकेत को सुरक्षित रखता है।
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: हर्ष और आनन्द के साथ
  rationale: दोनों संज्ञाओं को अलग-अलग रखते हुए उत्सवपूर्ण प्रसन्नता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
- source_word: προσήγαγον
  choice: चढ़ाईं
  rationale: बलिदान-संबंधी प्रसंग में इसका अर्थ भेंट के रूप में प्रस्तुत करना है; ‘चढ़ाईं’ हिन्दी के धार्मिक संदर्भ में इस क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁλοκαυτώματα
  choice: सम्पूर्ण होमबलियाँ
  rationale: यूनानी शब्द ऐसी बलियों को सूचित करता है जो वेदी पर पूरी तरह जला दी जाती थीं। ‘सम्पूर्ण’ इस विशेषता को बनाए रखता है।
- source_word: οὐκ ἔπεσεν
  choice: नहीं मारा गया था
  rationale: सैनिक प्रसंग में ‘गिरना’ मृत्यु का मुहावरा है। हिन्दी में ‘मारा गया’ उसी आशय को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξ αὐτῶν οὐθεὶς
  choice: उनमें से एक भी नहीं
  rationale: यह यूनानी के बलयुक्त निषेध और समूह में से किसी एक के भी न होने के भाव को सुरक्षित रखता है।
- source_word: ἕως τοῦ ἐπιστρέψαι
  choice: लौट आने तक
  rationale: यह समय-सीमा बताने वाले यूनानी infinitive पदबंध का स्पष्ट और सहज हिन्दी रूप है।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति से
  rationale: यह मूल के ‘शान्ति में’ वाले भाव को बनाए रखता है और साथ ही सुरक्षित वापसी का प्रसंगगत संकेत देता है।
theological_decisions:
- issue: ὁλοκαυτώματα के लिए बलिदान-संबंधी शब्दावली
  choice: सम्पूर्ण होमबलियाँ
  alternative: होमबलियाँ
  rationale: यह पद मन्दिर में उद्धार के बाद किए गए बलिदान का वर्णन करता है। ‘सम्पूर्ण’ इस बात को स्पष्ट करता है कि बलि पूरी तरह जलाई जाती थी, बिना किसी बाद की धार्मिक व्याख्या को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘हर्ष और आनन्द’ मूल के समानार्थी युग्म को बनाए रखता है; बलिदान-संबंधी शब्द के साथ संक्षिप्त व्याख्यात्मक पाद-टिप्पणी दी गई है।
