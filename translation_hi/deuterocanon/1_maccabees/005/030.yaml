base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/030.yaml
  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
translation:
  language: hi
  text: जब भोर हुई, तब उन्होंने आँखें उठाकर देखा कि एक बड़ी भीड़ थी, जिसकी कोई गिनती न थी[a]। वे गढ़ पर अधिकार करने के लिए सीढ़ियाँ और घेराबंदी के यंत्र[b] लिए हुए थे और उनसे युद्ध कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो गिनती से परे थी” अथवा “जिसे गिना नहीं जा सकता था।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ किलेबंद स्थान पर आक्रमण करते समय काम आने वाले घेराबंदी के उपकरण या युद्ध-यंत्र हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: जब भोर हुई
  rationale: यूनानी काल-सूचक मुहावरे को स्वाभाविक हिन्दी में प्रस्तुत करता है और कथा के नए दृश्य का आरम्भ बनाए रखता है।
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν καὶ ἰδοὺ
  choice: उन्होंने आँखें उठाकर देखा कि
  rationale: ‘आँखें उठाना’ स्रोत की बाइबलीय अभिव्यक्ति को बनाए रखता है, जबकि ‘देखा कि’ ἰδού की ध्यान खींचने वाली शक्ति को आधुनिक हिन्दी में सहज रूप देता है।
- source_word: λαὸς πολὺς
  choice: एक बड़ी भीड़
  rationale: यहाँ λαός लोगों के विशाल समूह, सम्भवतः सैनिक दल, को सूचित करता है; ‘बड़ी भीड़’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: οὗ οὐκ ἦν ἀριθμός
  choice: जिसकी कोई गिनती न थी
  rationale: मूल की शाब्दिक छवि और असंख्यता के बल को बनाए रखता है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: αἴροντες κλίμακας
  choice: सीढ़ियाँ ... लिए हुए थे
  rationale: वर्तमान कृदन्त को ऐसी जारी अवस्था के रूप में व्यक्त करता है जिसमें आक्रमणकारी सीढ़ियाँ साथ लिए हुए हैं।
- source_word: μηχανὰς
  choice: घेराबंदी के यंत्र
  rationale: सैन्य प्रसंग में μηχαναί किलेबंद स्थान पर आक्रमण के लिए प्रयुक्त उपकरण हैं; सामान्य ‘मशीनें’ की अपेक्षा यह अर्थ अधिक स्पष्ट है।
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: गढ़ पर अधिकार करने के लिए
  rationale: उद्देश्यवाचक infinitive और किलेबंद स्थान को लेने के सैन्य अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπολέμουν αὐτούς
  choice: उनसे युद्ध कर रहे थे
  rationale: अपूर्ण काल की जारी क्रिया को ‘कर रहे थे’ से बनाए रखा गया है। सर्वनाम का संदर्भ मूल की तरह प्रसंगाधीन रहने दिया गया है।
theological_decisions:
- issue: ἐπολέμουν αὐτούς में कर्ता और αὐτούς के संदर्भ
  choice: वे ... उनसे युद्ध कर रहे थे
  alternative: वे उन पर आक्रमण कर रहे थे
  rationale: यूनानी में निकटतम बहुवचन कर्ता बड़ी भीड़ है, पर सर्वनाम का स्पष्ट नाम नहीं दिया गया। हिन्दी अनुवाद उसी संदर्भात्मक निर्भरता को रखता है और अनावश्यक पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भोर’, ‘गढ़’ और ‘युद्ध’ ऐतिहासिक सैन्य प्रसंग के अनुरूप हैं; वाक्य-विन्यास को हिन्दी में पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है।
