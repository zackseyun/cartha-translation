  yaml_path: translation/deuterocanon/1_maccabees/005/028.yaml
  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
translation:
  language: hi
  text: तब यहूदा और उसकी छावनी अचानक बोसोर की ओर, वीराने के मार्ग पर मुड़ गए। उसने नगर पर अधिकार कर लिया, तलवार की धार से हर पुरुष को मार डाला[a], उनकी सारी लूट ले ली और नगर को आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, ‘तलवार के मुँह से’; यह तलवार से मार डालने का प्रचलित मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: रुख किया
  rationale: यह क्रिया दिशा बदलने या मुड़ने को बताती है; यहाँ पीछे हटने का भाव डाले बिना सैन्य दल के अचानक दिशा बदलने को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: उसकी छावनी
  rationale: παρεμβολή का मूल अर्थ छावनी है और प्रसंग में उससे छावनी में स्थित सैन्य दल भी अभिप्रेत हो सकता है; ‘छावनी’ इस ठोस सैन्य बिंब को बनाए रखती है।
- source_word: ὁδὸν εἰς τὴν ἔρημον
  choice: वीराने के रास्ते से
  rationale: संक्षिप्त यूनानी पदबंध में मार्ग और निर्जन प्रदेश दोनों का उल्लेख है। यह हिन्दी रूप दोनों तत्वों को स्वाभाविक रूप से रखता है।
- source_word: εἰς Βοσὸρ
  choice: बोसोर की ओर
  rationale: εἰς यहाँ गमन की दिशा बताता है; स्थान-नाम का लिप्यंतरण ‘बोसोर’ किया गया है।
- source_word: ἄφνω
  choice: अचानक
  rationale: यह क्रियाविशेषण सैन्य चाल की आकस्मिकता व्यक्त करता है।
- source_word: κατελάβετο
  choice: अधिकार कर लिया
  rationale: नगर के सैन्य अधिग्रहण के प्रसंग में क्रिया का अर्थ पकड़ लेना या अपने अधिकार में कर लेना है।
- source_word: πᾶν ἀρσενικόν
  choice: हर नर
  rationale: मूल पाठ केवल वयस्क पुरुषों तक सीमित शब्द नहीं, बल्कि व्यापक रूप से प्रत्येक नर के लिए ἀρσενικόν प्रयोग करता है; कठोरता को नरम किए बिना ‘हर नर’ उस विस्तार को बचाता है।
- source_word: ἐν στόματι ῥομφαίας
  choice: तलवार की धार से
  rationale: शाब्दिक अर्थ ‘तलवार के मुँह से’ है, जो सेप्टुआजिन्ट का प्रचलित मुहावरा है। ‘तलवार की धार से’ हिन्दी में अर्थपूर्ण और गरिमापूर्ण समानार्थी मुहावरा है।
- source_word: τὰ σκῦλα
  choice: सारी लूट
  rationale: शब्द युद्ध में छीनी गई संपत्ति को दर्शाता है; ‘लूट’ आधुनिक सामान्य हिन्दी में स्पष्ट है।
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: नगर को आग से जला दिया
  rationale: मूल में सर्वनाम का निकटतम संदर्भ नगर है और ‘आग से’ स्पष्ट रूप से उपस्थित है; हिन्दी में संदर्भ की स्पष्टता के लिए ‘नगर’ दोहराया गया है।
