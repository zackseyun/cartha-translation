  terminology: “छावनी,” “नगर पर अधिकार कर लिया,” “तलवार की धार से,” “लूट,” and “आग से जला दिया” are suitable in register and accurately convey the military vocabulary. The footnote accurately explains the Greek sword idiom and is correctly anchored.
  issues:
  - severity: medium
    issue: The phrase “वीराने के रास्ते से” is directionally ambiguous.
    rationale: The Greek retains both the road/way and movement into or through the wilderness. In Hindi, “...से” may be read as ‘from the wilderness’; “वीराने के मार्ग पर” avoids that unintended directional implication while retaining the compressed geographical phrasing.
  - severity: medium
    issue: “हर नर” is unnatural modern Hindi for human beings.
    rationale: Although it follows the broad wording of ἀρσενικόν, it is not idiomatic in this register. “हर पुरुष” is the normal Hindi expression and still does not erase the text’s male-specific reference.
