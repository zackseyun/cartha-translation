  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: hi
  text: और उसने हर पुरुष को तलवार की धार से मार डाला[a]। उसने उस नगर को जड़ से उखाड़ दिया[b], नगर की लूट ले ली, और नगर में से होकर मारे गए लोगों के ऊपर से गुजरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘तलवार के मुँह से’ है; यह एक मुहावरा है, जिसका अर्थ ‘तलवार की धार से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका समूल नाश कर दिया।’ मूल क्रिया में किसी वस्तु को जड़ से उखाड़ने का चित्र बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: संहार कर दिया
  rationale: सैनिक प्रसंग में यह क्रिया मृत्यु और विनाश कराने का बोध देती है। ‘संहार कर दिया’ यूनानी की कठोरता और व्यापक विनाश दोनों को बनाए रखता है।
- source_word: πᾶν ἀρσενικόν
  choice: हर पुरुष
  rationale: यह पद व्यापक और पुरुष-विशिष्ट है। ‘हर पुरुष’ इसकी स्पष्टता और कठोरता को बिना नरम किए व्यक्त करता है।
- source_word: ἐν στόματι ῥομφαίας
  choice: तलवार की धार से
  rationale: शाब्दिक अर्थ ‘तलवार के मुँह से’ है; आधुनिक हिन्दी में ‘तलवार की धार से’ उसी सामी मुहावरे का स्वाभाविक और चित्रात्मक अर्थ देता है।
- source_word: ἐξερρίζωσεν
  choice: जड़ से उखाड़ दिया
  rationale: क्रिया में जड़ों समेत उखाड़ने का स्पष्ट रूपक है। यह नगर के पूर्ण विनाश को दर्शाता है और मूल चित्र को सुरक्षित रखता है।
- source_word: αὐτήν
  choice: उस नगर को
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद πόλις (‘नगर’) है। हिन्दी में संज्ञा को दोहराने से संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: τὰ σκῦλα
  choice: नगर की लूट
  rationale: यह युद्ध में छीनी गई संपत्ति को सूचित करता है। ‘लूट’ आधुनिक हिन्दी में स्पष्ट, गंभीर और सहज है।
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: नगर के बीच से निकल गया
  rationale: क्रिया नगर में से होकर गुजरने को व्यक्त करती है। यह अनुवाद बिना अनावश्यक सैन्य अर्थ जोड़े उस गति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: मारे हुओं के ऊपर से
  rationale: कृदंत उन लोगों को दर्शाता है जिन्हें मार डाला गया था। यह चयन मूल के वीभत्स और सजीव दृश्य को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: हिंसा और विनाश की सीमा
  choice: ‘हर पुरुष का संहार,’ ‘तलवार की धार से’ और ‘जड़ से उखाड़ दिया’ के द्वारा मूल पाठ की हिंसा को पूरी स्पष्टता से बनाए रखा गया है।
  alternative: इसे ‘पराजित किया’ या ‘अधिकार कर लिया’ जैसे नरम शब्दों में व्यक्त करना।
  rationale: यूनानी पाठ स्पष्ट रूप से मृत्यु और व्यापक विनाश बताता है। अनुवाद को इसकी क्रूरता कम नहीं करनी चाहिए और न ही इसके दायरे को मूल से अधिक सीमित करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और कथात्मक रखी गई है। हिंसा की कठोरता को न तो नरम किया गया है, न अधिक बढ़ाया गया है। लंबे यूनानी समन्वित वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
