  text: तब यहूदा ने अपने भाई शमौन से कहा, “अपने लिए कुछ आदमी चुन और जाकर गलील में अपने भाइयों को बचाकर निकाल। पर मैं और मेरा भाई योनातान गिलाद के प्रदेश में जाएँगे।”
