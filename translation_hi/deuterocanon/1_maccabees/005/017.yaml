lexical_decisions:
- source_word: Ἐπίλεξον σεαυτῷ ἄνδρας
  choice: अपने लिए पुरुष चुन
  rationale: यह अनुवाद आज्ञार्थक बल, आत्मवाचक दत्तिवाचक ‘अपने लिए,’ और सामान्य संज्ञा ‘पुरुष’—तीनों को बनाए रखता है; संदर्भ में ये योद्धा हो सकते हैं, पर यूनानी पाठ स्पष्ट रूप से ‘सैनिक’ नहीं कहता।
- source_word: ῥῦσαι
  choice: बचा
  rationale: सैन्य संकट के संदर्भ में यह सक्रिय रूप से खतरे से बचाने का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: τοὺς ἀδελφούς σου
  choice: अपने भाइयों को
  rationale: मूल पाठ का संबंध-सूचक रूप सीधे रखा गया है। यहाँ आशय संगी इस्राएलियों से हो सकता है, पर अनुवाद में उस निहितार्थ को स्पष्ट करके मूल की व्यापकता सीमित नहीं की गई।
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: गलील में
  rationale: यह संकट में पड़े भाइयों के स्थान को बताने वाला सीधा स्थानवाचक अनुवाद है।
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: पर मैं और मेरा भाई योनातान
  rationale: ‘पर’ कार्य-विभाजन में δέ का विरोधात्मक बल व्यक्त करता है, और वाक्य मूल की क्रम-रचना के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: गिलाद प्रदेश में
  rationale: Γαλααδῖτις गिलाद से बना विशिष्ट प्रादेशिक नाम है। ‘गिलाद प्रदेश’ हिन्दी में स्वाभाविक रहते हुए उसके प्रादेशिक अर्थ को सुरक्षित रखता है।
