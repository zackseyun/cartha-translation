  yaml_path: translation/deuterocanon/1_maccabees/005/027.yaml
  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: hi
  text: और गिलाद के बाकी नगरों में भी लोग घिरे हुए हैं[a]। कल वे गढ़ों के विरुद्ध छावनी डालने, उन पर अधिकार करने और वहाँ के उन सभी लोगों को एक ही दिन में नष्ट कर देने वाले हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घिरकर फँसे हुए हैं” या “चारों ओर से घिरे हुए हैं।” यूनानी शब्द दबाव में घिरे होने की दशा बताता है; यह आवश्यक नहीं कि यहाँ तकनीकी अर्थ में औपचारिक घेराबंदी ही अभिप्रेत हो।
    reason: lexical_alternative
  - marker: b
    text: या “कल वे ... करेंगे।” यूनानी क्रिया आसन्न और नियोजित कार्रवाई का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: “नष्ट कर देने” का अनुवाद “उन सभी का सफाया कर देने” भी हो सकता है। यूनानी अभिव्यक्ति यहाँ बहुत प्रबल है और संभवतः संपूर्ण विनाश का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν τῆς Γαλααδίτιδος
  choice: गिलाद के दूसरे नगरों में
  rationale: λοιπαῖς का अर्थ संदर्भ में पहले बताए गए स्थानों के अतिरिक्त ‘दूसरे’ नगर है; τῆς Γαλααδίτιδος क्षेत्रसूचक है, इसलिए प्रचलित भौगोलिक नाम ‘गिलाद’ रखा गया।
- source_word: συνειλημμένοι
  choice: घिरकर फँसे हुए हैं
  rationale: पूर्ण निष्क्रिय कृदंत घेर दिए जाने से उत्पन्न वर्तमान दशा बताता है। यह अनुवाद शत्रुतापूर्ण घेराबंदी का भाव रखता है, पर अनिवार्य रूप से किसी तकनीकी सैन्य ‘घेराबंदी’ तक अर्थ सीमित नहीं करता।
- source_word: εἰς αὔριον
  choice: कल
  rationale: यहाँ सीधा निकट भविष्य का काल-संकेत है।
- source_word: πάσονται
  choice: करने वाले हैं
  rationale: प्रदत्त पाठ और संदर्भ में यह निकट एवं नियोजित कार्रवाई का भाव देता है; हिंदी में ‘वाले हैं’ आसन्न अभिप्राय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρεμβαλεῖν ἐπὶ τὰ ὀχυρώματα
  choice: गढ़ों के विरुद्ध छावनी डालने
  rationale: παρεμβαλεῖν सैन्य छावनी लगाने की ठोस छवि रखता है और ἐπί यहाँ विरोधी दिशा का भाव देता है। ὀχυρώματα के लिए सुबोध और संक्षिप्त ‘गढ़’ चुना गया।
- source_word: καταλαβέσθαι
  choice: उन पर अधिकार करने
  rationale: मध्य रूप यहाँ किलेबंद स्थानों को अपने कब्जे में लेने का अर्थ देता है; ‘अधिकार करना’ लक्ष्य को स्पष्ट रखता है।
- source_word: ἐξᾶραι ἅπαντας αὐτοὺς
  choice: उन सबको नष्ट कर देने
  rationale: सैन्य संदर्भ और व्यक्तियों के लिए प्रयुक्त ἅπαντας αὐτούς पूर्ण विनाश का कठोर भाव देते हैं; ‘नष्ट कर देना’ बल को बनाए रखते हुए अनावश्यक मुहावरेदारी से बचता है।
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: एक ही दिन में
  rationale: यह क्रिया की तीव्रता और पूर्णता पर दिए गए जोर को स्वाभाविक हिंदी में व्यक्त करता है।
