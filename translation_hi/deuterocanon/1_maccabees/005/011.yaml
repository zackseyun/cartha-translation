  yaml_path: translation/deuterocanon/1_maccabees/005/011.yaml
  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
translation:
  language: hi
  text: और वे आने और उस गढ़ पर पहले से अधिकार कर लेने[a] की तैयारी कर रहे हैं, जिसमें हमने शरण ली है; और तिमोथियुस उनकी सेना[b] का नेतृत्व कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गढ़ को पहले से अपने अधिकार में कर लेने।” यूनानी क्रिया में पहले से या अग्रिम रूप से अधिकार कर लेने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “छावनी” है; यह छावनी में स्थित सैन्य दल, अर्थात सेना, को भी सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: तैयारी कर रहे हैं
  rationale: परिभाषात्मक वर्तमान रचना जारी तैयारी को व्यक्त करती है; हिन्दी में यह स्वाभाविक और कालगत रूप से सटीक है।
- source_word: προκαταλαβέσθαι
  choice: पहले ही अधिकार कर लेने
  rationale: क्रिया में किसी स्थान को पहले से या अग्रिम रूप से अपने अधिकार में लेने का भाव है। यह चयन उस पूर्वक्रियात्मक बल को बनाए रखता है, बिना यह तय किए कि वे ठीक किससे पहले ऐसा करना चाहते हैं।
- source_word: τὸ ὀχύρωμα
  choice: गढ़
  rationale: यह शब्द सुरक्षित किलेबंद स्थान को सूचित करता है। ‘गढ़’ संक्षिप्त, सहज और प्रसंगानुकूल सैन्य शब्द है।
- source_word: εἰς ὃ κατεφύγομεν
  choice: जिसमें हमने शरण ली है
  rationale: καταφεύγω केवल भागने के बजाय सुरक्षा के लिए किसी स्थान में जा पहुँचने को व्यक्त करता है; हिन्दी में ‘शरण ली है’ पूर्ण हुई और अब भी प्रासंगिक क्रिया को दर्शाता है।
- source_word: ἡγεῖται
  choice: नेतृत्व कर रहा है
  rationale: यह नेतृत्व या सेनापतित्व का अर्थ देता है। चयन मूल की व्यापकता बनाए रखता है और सैन्य प्रसंग में स्वाभाविक है।
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: उनकी सेना
  rationale: παρεμβολή का मूल अर्थ सैन्य छावनी है और प्रसंगानुसार छावनी में स्थित सैन्य दल भी हो सकता है। किसी व्यक्ति द्वारा उसका नेतृत्व किए जाने के प्रसंग में ‘सेना’ स्वाभाविक हिन्दी है।
