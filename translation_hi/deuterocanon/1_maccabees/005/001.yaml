lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: और ऐसा हुआ कि जब
  rationale: यह सामी प्रभाव वाली यूनानी कथात्मक अभिव्यक्ति है। हिन्दी में यह रूप उसके औपचारिक कथांतरण और कालगत भूमिका को स्पष्ट तथा स्वाभाविक ढंग से बनाए रखता है।
- source_word: τὰ ἔθνη κυκλόθεν
  choice: चारों ओर के राष्ट्रों
  rationale: यहूदिया के आसपास स्थित गैर-यहूदी समुदायों का भौगोलिक संकेत है। ‘राष्ट्रों’ मूल शब्द को बनाए रखता है और ‘अन्यजातियों’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: ᾠκοδομήθη τὸ θυσιαστήριον
  choice: वेदी फिर से बनाई गई है
  rationale: क्रिया का मूल अर्थ ‘बनाई गई’ है, पर प्रसंग अपवित्र किए जाने के बाद पुनर्स्थापन का है; इसलिए ‘फिर से बनाई गई’ आशय को स्पष्ट करता है। सुनाई गई बात की विषयवस्तु हिन्दी में पूर्ण वर्तमान के साथ स्वाभाविक है।
- source_word: ἐνεκαινίσθη τὸ ἁγίασμα
  choice: पवित्रस्थान को … फिर से समर्पित किया गया है
  rationale: मन्दिर-संदर्भ में क्रिया नवीनीकरण और नए सिरे से समर्पण का बोध देती है। ‘पवित्रस्थान’ ἁγίασμα के ठोस पवित्र स्थल-संबंधी अर्थ को व्यक्त करता है।
- source_word: ὡς τὸ πρότερον
  choice: पहले की तरह
  rationale: यह वाक्यांश पूर्व दशा और उपासना-व्यवस्था की बहाली को संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: ὠργίσθη σφόδρα
  choice: वे बहुत क्रोधित हुए
  rationale: यह तीव्र क्रोध को व्यक्त करता है। ‘बहुत क्रोधित हुए’ आधुनिक, गरिमापूर्ण और मूल की प्रबलता के अनुरूप है।
theological_decisions:
- issue: द्वितीयकानूनी यहूदी ऐतिहासिक प्रसंग में τὰ ἔθνη का संकेत
  choice: चारों ओर के राष्ट्रों
  alternative: आसपास की अन्यजातियों
  rationale: मूल यूनानी का शाब्दिक संकेत ‘चारों ओर के राष्ट्र’ है। प्रसंग में ये यहूदिया के पड़ोसी गैर-यहूदी समुदाय हैं; ‘राष्ट्रों’ से यह संकेत बना रहता है और बाद की धार्मिक शब्दावली की विशिष्ट छाया अनावश्यक रूप से नहीं आती।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक आरम्भ की मूल औपचारिकता को बनाए रखते हुए वाक्य सहज रखा गया है। ‘वेदी’, ‘पवित्रस्थान’ और ‘समर्पित’ जैसे परिचित, गरिमापूर्ण उपासना-संबंधी शब्द चुने गए हैं।
