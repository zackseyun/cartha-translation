translation:
  language: hi
  text: और ऐसा हुआ कि जब चारों ओर के राष्ट्रों ने सुना कि वेदी फिर से बनाई गई थी और पवित्रस्थान को पहले की तरह समर्पित किया गया था, तो वे बहुत क्रोधित हुए।
