  yaml_path: translation/deuterocanon/1_maccabees/005/005.yaml
  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: hi
  text: उसने उन्हें मीनारों में बंद कर दिया और उनके विरुद्ध छावनी डाली। फिर उसने उन्हें विनाश के लिए समर्पित कर दिया[a] और उसकी मीनारों[b] को उन सब लोगों समेत, जो उनके भीतर थे, आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें विनाश के प्रतिबंध में डाल दिया।” यूनानी क्रिया का अर्थ केवल शाप देना नहीं, बल्कि व्यक्तियों या वस्तुओं को विनाश के लिए समर्पित करना भी है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में सर्वनाम स्त्रीलिंग एकवचन है—शाब्दिक रूप से “उसकी मीनारों”; संदर्भ में यह संभवतः नगर की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκλείσθησαν ὑπʼ αὐτοῦ
  choice: उसने उन्हें मीनारों में बंद कर दिया
  rationale: यूनानी कर्मवाच्य का अर्थ है कि उसके द्वारा वे भीतर रोक दिए गए। हिन्दी में कर्तृवाच्य अधिक स्वाभाविक है और यहूदा की भूमिका स्पष्ट रखता है।
- source_word: πύργους
  choice: मीनारों
  rationale: πύργος का सीधा अर्थ ‘मीनार’ है; सैन्य प्रसंग में ये रक्षात्मक मीनारें हैं, पर मूल पाठ से अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: उनके विरुद्ध छावनी डाली
  rationale: क्रिया का ठोस अर्थ छावनी डालना है। ‘घेरा डाला’ प्रसंगानुकूल होता, पर वह मूल क्रिया के चित्र को अधिक व्याख्यायित कर देता।
- source_word: ἀνεθεμάτισεν
  choice: उन्हें विनाश के लिए अर्पित कर दिया
  rationale: यह केवल शाप देने या सामान्य रूप से नष्ट करने का शब्द नहीं, बल्कि किसी को पवित्र प्रतिबंध के अधीन विनाश के लिए ठहराने का भाव रखता है।
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: आग से जला दिया
  rationale: क्रिया आग लगाने या जला देने को व्यक्त करती है और ἐν πυρί की स्पष्ट पुनरुक्ति को ‘आग से’ द्वारा बनाए रखा गया है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: यूनानी सर्वनाम स्त्रीलिंग एकवचन है। ‘उसकी’ उस व्याकरणिक एकवचन को सुरक्षित रखता है; संदर्भ में संकेत संभवतः नगर की ओर है।
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: उन सब लोगों समेत ... जो उनके भीतर थे
  rationale: यह मीनारों के भीतर उपस्थित सभी लोगों की समग्रता व्यक्त करता है। हिन्दी में ‘उनके भीतर’ का बहुवचन निकटवर्ती ‘मीनारों’ से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: पवित्र युद्ध के प्रसंग में ἀνεθεμάτισεν का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: विनाश के प्रतिबंध में डाल दिया; पूरी तरह नष्ट कर दिया
  rationale: चुना हुआ अनुवाद समर्पण और विनाश दोनों का धार्मिक-वैचारिक भार बनाए रखता है। केवल ‘नष्ट कर दिया’ से यह भाव खो जाता, जबकि ‘प्रतिबंध’ सामान्य पाठक के लिए अस्पष्ट हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज सैन्य-वर्णन रखा गया है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। मूल स्रोत में मौजूद स्त्रीलिंग एकवचन सर्वनाम को मुख्य पाठ और टिप्पणी दोनों में सुरक्षित रखा गया है; अंग्रेज़ी परामर्श-पाठ में पहले पादटिप्पणी-चिह्न का स्थान विषयवस्तु से मेल नहीं खाता था, इसलिए [a] को ἀνεθεμάτισεν के अनुवाद के बाद रखा गया है।
