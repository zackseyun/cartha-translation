  rationale: यह सम्बन्धकारक यहाँ उनकी मृत्यु की परिस्थिति अथवा क्षेत्र बताता है; “युद्ध में” स्वाभाविक हिन्दी है।
- source_word: βουλομένου αὐτοῦ
  choice: क्योंकि वह चाहता था
  rationale: सम्बन्धकारक निरपेक्ष रचना का कर्ता मूल पाठ में एकवचन है। कारणसूचक अर्थ प्रसंग के अनुकूल है, इसलिए एकवचन “वह” को सुरक्षित रखा गया है।
- source_word: ἀνδραγαθῆσαι
  choice: वीरता दिखाना
  rationale: क्रिया साहस या पराक्रम प्रदर्शित करने को व्यक्त करती है। “वीरता दिखाना” आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से लिंग-विशिष्ट मुहावरा नहीं लाती।
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν
  choice: वे … निकल पड़े
  rationale: सप्रत्यय क्रियार्थक संज्ञा और उसके बहुवचन कर्ता को हिन्दी में कालगत-परिस्थितिजन्य उपवाक्य के रूप में सहजता से व्यक्त किया गया है।
- source_word: εἰς τὸν πόλεμον
  choice: युद्ध में निकल पड़े
  rationale: वाक्यांश किसी वास्तविक सैन्य संघर्ष की ओर जाने को बताता है; हिन्दी में “युद्ध में निकल पड़े” इस गति और प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀβουλεύτως
  choice: बिना सलाह-मशविरा किए
  rationale: शब्द का मूल भाव परामर्श या सोच-विचार के बिना कार्य करना है। चुना गया रूप परामर्श के अभाव को बनाए रखता है और केवल “उतावलेपन” तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: βουλομένου αὐτοῦ में αὐτοῦ का सन्दर्भ
  choice: मूल के एकवचन को “वह” के रूप में रखा और उसका पूर्वपद अनिर्दिष्ट छोड़ा गया।
  alternative: प्रसंग के आधार पर इसे बहुवचन मानकर “वे वीरता दिखाना चाहते थे” कहना।
  rationale: दिए गए यूनानी पाठ में सर्वनाम और कृदन्त दोनों एकवचन हैं, जबकि आगे याजकों के लिए बहुवचन आता है। किसी व्यक्ति का नाम जोड़ना या एकवचन को बहुवचन बनाना वास्तविक व्याकरणिक तनाव को मिटा देता; इसलिए अस्पष्टता को पाद-टिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “याजक” बाइबलीय-साहित्यिक पद के रूप में उपयुक्त है। वाक्य मूल यूनानी के कारणसूचक सम्बन्ध तथा एकवचन “वह” और बहुवचन “वे” के बीच मौजूद तनाव को जानबूझकर सुरक्षित रखता है।
