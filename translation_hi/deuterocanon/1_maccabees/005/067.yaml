  yaml_path: translation/deuterocanon/1_maccabees/005/067.yaml
  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: hi
  text: उस दिन याजक युद्ध में मारे गए, जब वे बिना सलाह-मशविरा किए उसमें निकल पड़े[c], क्योंकि वह[a] वीरता दिखाना चाहता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ “वह” एकवचन है, पर इस वाक्य में यह स्पष्ट नहीं किया गया कि उसका संकेत किस व्यक्ति की ओर है। कुछ अनुवाद प्रसंग के आधार पर इसे याजकों से जोड़कर “वे” करते हैं।
    reason: textual_or_referential_ambiguity
  - marker: b
    text: या “अपना पराक्रम दिखाना” अथवा “कोई वीरतापूर्ण काम करना।” यूनानी क्रिया वीरता प्रदर्शित करने का भाव रखती है।
    reason: lexical_alternative
  - marker: c
    text: या “बिना सोच-विचार किए” अथवा “उतावलेपन से।” यूनानी शब्द का शाब्दिक भाव “बिना परामर्श के” है।
    reason: lexical_alternative
