- source_word: ἔπεσαν
  choice: मारे गए
  rationale: युद्ध के प्रसंग में यूनानी क्रिया मृत्यु का संकेत देने वाला प्रचलित मुहावरा है। हिन्दी में केवल “गिर पड़े” शारीरिक रूप से गिरने का अर्थ दे सकता है, इसलिए “मारे गए” आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
