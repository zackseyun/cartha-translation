  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: hi
  text: जब यहूदा बरसाती जलधारा[a] के पास पहुँचा, तब उसने लोगों के लिपिकों[b] को उस जलधारा के पास तैनात किया और उन्हें आज्ञा दी, “किसी को पड़ाव डालने न देना, बल्कि सब लोग युद्ध में आएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरसाती नाला,” “वेगवती धारा,” अथवा “सूखा जलमार्ग।” यूनानी शब्द ऐसी जलधारा या जलमार्ग को दर्शाता है जिसमें प्रायः वर्षा के मौसम में पानी बहता है।
    reason: lexical_alternative
  - marker: b
    text: “लोगों के लिपिक” सेना की सेवा करने वाले प्रशासनिक अधिकारियों या अभिलेख रखने वालों को भी सूचित कर सकता है; अनुवाद में यूनानी पद का मूल लिपिक-संबंधी अर्थ रखा गया है।
    reason: lexical_alternative
