- source_word: χειμάρρουν τοῦ ὕδατος
  choice: पानी की बरसाती धारा
  rationale: χειμάρρους वर्षा ऋतु में बहने वाली धारा, नाला या उसके जलमार्ग को सूचित करता है। ‘पानी की’ मूल यूनानी के τοῦ ὕδατος को स्पष्ट रखता है, जबकि ‘बरसाती धारा’ भू-आकृतिक अर्थ बताती है।
- source_word: ἔστησεν
  choice: तैनात किया
  rationale: सैन्य प्रसंग में यह किसी कार्य के लिए लोगों को एक स्थान पर नियुक्त करके खड़ा करने का स्वाभाविक हिन्दी रूप है।
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: लोगों के शास्त्री
  rationale: शाब्दिक पद ‘शास्त्री’ सुरक्षित रखा गया है; प्रसंग में ये प्रशासनिक अधिकारी या लेखा रखने वाले भी हो सकते हैं, इसलिए टिप्पणी में कार्यगत संभावना बताई गई है।
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: उस धारा के पास
  rationale: ἐπί के साथ संबंधकारक यहाँ किसी स्थान पर या उसके निकट स्थिति दर्शाता है।
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: किसी को पड़ाव डालने न देना
  rationale: ἀφῆτε और क्रियार्थक रूप अनुमति न देने की आज्ञा बनाते हैं; सैन्य प्रयोग में παρεμβαλεῖν का अर्थ शिविर या पड़ाव डालना है।
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: सब लोग युद्ध में आएँ
  rationale: यह सबकी अनिवार्य भागीदारी की आज्ञा है और गति तथा तत्काल युद्ध में प्रवेश—दोनों को बनाए रखती है।
