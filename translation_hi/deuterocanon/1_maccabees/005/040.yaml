base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: hi
  text: और जब यहूदा और उसकी छावनी बरसाती जलधारा के पास आ रहे थे, तब तीमुथियुस ने अपनी सेना के सेनापतियों से कहा, “यदि वह हमसे पहले पार होकर हमारी ओर आ जाए, तो हम उसके सामने टिक नहीं सकेंगे, क्योंकि वह हम पर भारी पड़ेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τιμόθεος
  choice: तीमुथियुस
  rationale: यूनानी व्यक्तिगत नाम के रूप को हिंदी में स्पष्ट और पारंपरिक ढंग से लिप्यंतरित किया गया है।
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: अपनी सेना के सेनापतियों
  rationale: सैन्य प्रसंग में ἄρχοντες अधिकारी या कमांडर हैं और δύναμις यहाँ सशस्त्र सेना को सूचित करता है।
- source_word: ἐν τῷ ἐγγίζειν
  choice: जब ... पास आ रहे थे
  rationale: सव्ययी भाववाचक क्रिया समकालीन समय व्यक्त करती है; यह हिंदी में स्वाभाविक कालवाचक रचना है।
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: शब्द पड़ाव, सैन्य छावनी अथवा छावनी में स्थित दल को सूचित कर सकता है; ‘छावनी’ मूल की अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: पानी वाले बरसाती नाले
  rationale: χειμάρρους प्रायः वर्षा में बहने वाली जलधारा या उसकी घाटी को सूचित करता है। ‘बरसाती नाला’ आधुनिक हिंदी में भू-आकृति को स्वाभाविक रूप से व्यक्त करता है, और ‘पानी वाले’ τοῦ ὕδατος को भी बनाए रखता है।
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: हमसे पहले पार होकर हमारी ओर आ गया
  rationale: πρότερος की प्राथमिकता और πρὸς ἡμᾶς की उनकी दिशा दोनों स्पष्ट रखी गई हैं।
- source_word: ὑποστῆναι αὐτόν
  choice: उसके सामने टिक
  rationale: युद्ध के प्रसंग में इसका अर्थ विरोधी के विरुद्ध डटे रहना या उसका सामना कर पाना है।
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: वह हम पर भारी पड़ेगा
  rationale: मूल यूनानी संक्षिप्त और कुछ हद तक मुहावरेदार है—शाब्दिक रूप से ‘वह हमारे विरुद्ध समर्थ होगा।’ हिंदी मुहावरा सैन्य आशय देता है, बिना विजय की सीमा को अनावश्यक रूप से बढ़ाए।
