translation:
  language: hi
  text: पर वे उन पुरुषों के वंशज नहीं थे, जिनके हाथों इस्राएल को छुटकारा दिया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρματος
  choice: वंश
  rationale: ἐκ τοῦ σπέρματος यहाँ शारीरिक वंश या कुलगत उतराधिकार व्यक्त करता है। ‘वंश में से’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी रूपक ‘बीज’ की अनावश्यक कठोरता से बचता है।
- source_word: ἀνδρῶν
  choice: पुरुषों
  rationale: यह शब्द विशेष पुरुष व्यक्तियों की ओर संकेत करता है; इसलिए सामान्य ‘लोगों’ के बजाय ‘पुरुषों’ रखा गया है।
- source_word: ἐδόθη
  choice: दिया गया था
  rationale: δίδωμι का कर्मवाच्य रूप है। ‘दिया गया था’ पूर्व में घटित छुटकारे को दर्शाता है और देने वाले को, जैसा मूल में है, अनिर्दिष्ट रखता है।
- source_word: σωτηρία
  choice: छुटकारा
  rationale: इस ऐतिहासिक-सैनिक प्रसंग में यह इस्राएल के ठोस बचाव या उद्धार को सूचित करता है। ‘छुटकारा’ धार्मिक अर्थ को नकारे बिना प्रसंगगत राष्ट्रीय मुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ χειρὸς αὐτῶν
  choice: जिनके हाथों
  rationale: यह माध्यम या कर्तृत्व का सामी-यूनानी मुहावरा है। ‘जिनके हाथों’ हिन्दी में स्वाभाविक रूप से ‘जिनके माध्यम से’ का अर्थ देता है और हाथ की मूल छवि भी बचाता है।
- source_word: αὐτοὶ δὲ
  choice: पर वे
  rationale: δέ पिछले प्रसंग से विरोध प्रकट करता है। ‘पर वे’ संक्षिप्त और स्पष्ट आधुनिक हिन्दी है।
theological_decisions:
- issue: ऐतिहासिक-सैनिक प्रसंग में σωτηρία का अनुवाद
  choice: छुटकारा
  alternative: उद्धार; विजय
  rationale: ‘छुटकारा’ इस्राएल के वास्तविक ऐतिहासिक बचाव को व्यक्त करता है, पर अर्थ को केवल सैन्य ‘विजय’ तक सीमित नहीं करता और बाद की धर्मवैज्ञानिक शब्दावली भी अनावश्यक रूप से आरोपित नहीं करता।
- issue: διὰ χειρὸς αὐτῶν में माध्यम और दैवी कर्तृत्व का संबंध
  choice: जिनके हाथों
  alternative: जिनके द्वारा; उनके माध्यम से
  rationale: मूल पाठ छुटकारा देने वाले अंतिम कर्ता को स्पष्ट नहीं करता, पर उन पुरुषों को माध्यम बताता है। कर्मवाच्य और ‘जिनके हाथों’ दोनों को रखकर यही तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वंश में से’ वंशगत संबंध को, और ‘जिनके हाथों’ मूल की एजेंसी-संबंधी बाइबिलीय छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
