  yaml_path: translation/deuterocanon/1_maccabees/005/004.yaml
  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
translation:
  language: hi
  text: और उसने बायान के पुत्रों[a] की दुष्टता को स्मरण किया। वे लोगों के लिए फंदा और ठोकर का कारण थे, मार्गों पर उनकी घात लगाकर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाएन के पुत्रों’; यूनानी व्यक्तिनाम Βαιάν को एक से अधिक ढंग से लिप्यंतरित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: स्मरण किया
  rationale: क्रिया यह बताती है कि उसने पहले की शत्रुतापूर्ण करतूत को याद किया; ‘स्मरण किया’ गरिमापूर्ण और स्वाभाविक है।
- source_word: κακίας
  choice: दुष्टता
  rationale: यह शब्द नैतिक बुराई और शत्रुतापूर्ण गलत काम, दोनों को समेटता है; ‘दुष्टता’ बिना उद्देश्य को अनावश्यक रूप से सीमित किए यह व्यापक अर्थ रखता है।
- source_word: υἱῶν Βαιάν
  choice: बायान के पुत्रों
  rationale: υἱοί किसी पूर्वज से पहचाने जाने वाले वंश या समुदाय को भी सूचित कर सकता है। ‘पुत्रों’ स्रोत की अभिव्यक्ति को बनाए रखता है, और Βαιάν को नाम के रूप में लिप्यंतरित किया गया है।
- source_word: παγίδα
  choice: फंदा
  rationale: यह दूसरों को पकड़ने वाले जाल का रूपक है; ‘फंदा’ इसके चित्रात्मक और साहित्यिक बल को बनाए रखता है।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: σκάνδαλον ऐसी वस्तु या परिस्थिति का बोध कराता है जो किसी को ठोकर खिलाए या पतन की ओर ले जाए; यह हिन्दी में स्पष्ट रूपक है।
- source_word: ἐν τῷ ἐνεδρεύειν
  choice: क्योंकि वे ... घात में बैठे रहते थे
  rationale: यह क्रिया-रचना परिस्थिति अथवा माध्यम बता सकती है और यहाँ स्पष्ट करती है कि वे लोगों के लिए फंदा और ठोकर का कारण कैसे थे। ‘बैठे रहते थे’ जारी या बार-बार होने वाली घात का भाव व्यक्त करता है।
- source_word: αὐτοὺς
  choice: उनकी
  rationale: सर्वनाम का संकेत ‘लोगों’ की ओर है; ‘उनकी घात में’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: ἐν ταῖς ὁδοῖς
  choice: मार्गों पर
  rationale: ὁδοί यात्रा के रास्तों को सूचित करता है; ‘मार्गों पर’ बहुवचन और स्थान-बोध दोनों को बनाए रखता है।
