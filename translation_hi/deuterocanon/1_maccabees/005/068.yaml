  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: hi
  text: और यहूदा मुड़कर परदेशियों के देश अज़ोतुस में गया। उसने उनकी वेदियाँ ढा दीं; उन्होंने उनके देवताओं की तराशी हुई मूर्तियों को आग में जला दिया[b]; उसने नगरों की लूट ले ली और यहूदिया लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यहाँ यूनानी क्रिया बहुवचन (“उन्होंने जलाया”) में है, जबकि आसपास की क्रियाएँ एकवचन में हैं। संभवतः आशय यहूदा के सैनिकों से है।
    reason: source_number_shift
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: मार्ग से मुड़कर ... गया
  rationale: क्रिया दिशा बदलकर मुख्य मार्ग से हटने का भाव देती है; यह सहज हिन्दी में उस अर्थ को बनाए रखता है।
- source_word: Ἄζωτον
  choice: अज़ोतुस
  rationale: यूनानी स्थान-नाम Ἄζωτος का देवनागरी लिप्यंतरण रखा गया है; ऐतिहासिक समतुल्य अशदोद को मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: γῆν ἀλλοφύλων
  choice: परदेशियों का देश
  rationale: ἀλλόφυλοι का शाब्दिक भाव दूसरे समुदाय अथवा जाति के लोग है। 'परदेशी' स्रोत की व्यापकता बचाता है; ऐतिहासिक रूप से अधिक विशिष्ट 'पलिश्तियों' को पादटिप्पणी में रखा गया है।
- source_word: καθεῖλεν
  choice: ढा दीं
  rationale: वेदियों जैसी संरचनाओं को गिरा देने के ठोस अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βωμοὺς
  choice: वेदियाँ
  rationale: βωμός का सामान्य और सटीक हिन्दी धार्मिक स्थापत्य-शब्द 'वेदी' है।
- source_word: γλυπτὰ
  choice: खुदी हुई मूर्तियाँ
  rationale: यह शब्द तराशी या खोदकर बनाई गई प्रतिमाओं को सूचित करता है; केवल 'मूरतें' या 'मूर्तियाँ' कहने से निर्माण-विधि का संकेत खो जाता।
- source_word: κατέκαυσαν
  choice: उन्होंने ... जला दीं
  rationale: प्राप्त यूनानी रूप बहुवचन है। आसपास की एकवचन क्रियाओं से इसे मिलाकर बदलने के बजाय संख्या-परिवर्तन सुरक्षित रखा गया है।
- source_word: ἐσκύλευσεν τὰ σκῦλα
  choice: लूट लूट ली
  rationale: क्रिया और सजातीय संज्ञा के युद्धकालीन लूट के भाव को हिन्दी में स्वाभाविक संक्षिप्त अभिव्यक्ति मिलती है।
- source_word: ἐπέστρεψεν
  choice: लौट आया
  rationale: वर्णन के प्रसंग में वापसी का सबसे सहज आधुनिक हिन्दी रूप।
- source_word: Ἰουδαίαν
  choice: यहूदिया
  rationale: इस काल के क्षेत्र Ἰουδαία के लिए मानक हिन्दी भौगोलिक नाम।
