lexical_decisions:
- source_word: ἦρκται
  choice: शुरू हो चुकी थी
  rationale: पूर्णकालिक रूप बताता है कि यहूदा के देखने तक लड़ाई आरम्भ होकर चल रही थी; हिन्दी में यह पदबंध उस पूर्ववर्ती आरम्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ πόλεμος
  choice: लड़ाई
  rationale: यहाँ शब्द पूरे युद्ध-अभियान के बजाय तत्काल चल रहे संघर्ष को सूचित करता है।
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: नगर का कोलाहल
  rationale: κραυγή ऊँची सामूहिक पुकार या शोर को व्यक्त करता है; संबंधकारक नगर से उठने वाले कोलाहल को सूचित करता है।
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: आकाश तक उठ रहा था
  rationale: यह ऊर्ध्व दिशा के मूल बिंब को बनाए रखता है और हिन्दी वर्णन में स्वाभाविक है।
- source_word: σάλπιγξιν
  choice: तुरहियों की ध्वनि
  rationale: बहुवचन करण/सहवर्ती कारक यहाँ बजती तुरहियों की आवाज़ को सूचित करता है; केवल वाद्य का नाम रखने की अपेक्षा यह हिन्दी में आशय स्पष्ट करता है।
- source_word: κραυγῇ μεγάλῃ
  choice: ऊँची पुकार
  rationale: महान/बड़ी का शाब्दिक रूप यहाँ ध्वनि की तीव्रता बताता है, जिसे स्वाभाविक हिन्दी में 'ऊँची' कहा गया है।
