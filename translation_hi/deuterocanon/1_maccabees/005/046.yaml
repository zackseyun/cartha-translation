  yaml_path: translation/deuterocanon/1_maccabees/005/046.yaml
  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: hi
  text: और वे एफ्रोन तक पहुँचे। यह प्रवेश-मार्ग पर स्थित एक बड़ा और अत्यन्त सुदृढ़ नगर था।[a] इसके दाईं या बाईं ओर से होकर निकलना सम्भव नहीं था; केवल इसके बीच से होकर जाना पड़ता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दर्रे पर” अथवा “पहुँच-मार्ग पर।” यूनानी पद एफ्रोन को प्रवेश के मार्ग से संबद्ध एक नगर के रूप में बताता है; इसी कारण उसके चारों ओर से निकलना सम्भव नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: वे एप्रोन तक पहुँचे
  rationale: ἕως स्थान की सीमा व्यक्त करता है; ‘तक पहुँचे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को सुरक्षित रखता है। Ἐφρών को स्थाननाम के रूप में ‘एप्रोन’ लिप्यंतरित किया गया है।
- source_word: αὕτη ἡ πόλις μεγάλη
  choice: यह ... एक बड़ा ... नगर था
  rationale: αὕτη को ‘यह’ के रूप में स्पष्ट रखा गया है और πόλις μεγάλη का स्वाभाविक हिन्दी क्रम ‘एक बड़ा नगर’ अपनाया गया है।
- source_word: ἡ τῆς εἰσόδου
  choice: प्रवेश-मार्ग पर बसा
  rationale: यह संबंधकारक पद नगर की रणनीतिक स्थिति को प्रवेश, दर्रे या पहुँच-मार्ग से जोड़ता है। ‘प्रवेश-मार्ग पर बसा’ संदर्भ में स्पष्ट है, जबकि मूल की संभावित भौगोलिक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ἰσχυρὰ σφόδρα
  choice: अत्यन्त सुदृढ़
  rationale: नगर के संदर्भ में ἰσχυρά उसकी मजबूत सुरक्षा या दुर्गबंदी का संकेत देता है; ‘सुदृढ़’ इस सैनिक भाव को बिना अनावश्यक विस्तार के व्यक्त करता है और σφόδρα के लिए ‘अत्यन्त’ रखा गया है।
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: उससे बचकर न दाईं ओर मुड़ना सम्भव था, न बाईं ओर
  rationale: ἐκκλῖναι यहाँ मार्ग बदलकर नगर को पार्श्व से टालने की असम्भवता बताता है। ‘उससे बचकर’ ἀπ’ αὐτῆς का संदर्भ स्पष्ट करता है और दाएँ-बाएँ की समानांतर रचना बनाए रखता है।
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: उसके बीच से होकर जाना ही पड़ता था
  rationale: ἀλλ’ ἢ केवल उपलब्ध विकल्प को दर्शाता है; ‘ही पड़ता था’ उस बाध्यता को स्वाभाविक हिन्दी में व्यक्त करता है। ‘बीच से होकर’ διὰ μέσου को स्पष्टतः सुरक्षित रखता है।
