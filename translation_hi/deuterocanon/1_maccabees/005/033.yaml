- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: उसने तुरहियाँ बजाईं
  rationale: Swete के यूनानी पाठ में क्रिया एकवचन है, इसलिए मूल संख्या-भेद को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ἐβόησαν
  choice: उन्होंने ... पुकार लगाई
  rationale: क्रिया ऊँची और तीव्र पुकार व्यक्त करती है; ‘पुकार लगाई’ युद्ध और प्रार्थना दोनों संदर्भों में स्वाभाविक है।
- source_word: ἐν προσευχῇ
  choice: प्रार्थना करते हुए
  rationale: यह वाक्यांश पुकार के ढंग या परिस्थिति को बताता है। यह सहज हिंदी में ‘प्रार्थना में’ के आशय को व्यक्त करता है।
