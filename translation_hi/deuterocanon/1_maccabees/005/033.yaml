  choice: उनके विरुद्ध ... बाहर निकला
  alternative: बाहर निकला
  rationale: युद्ध-संदर्भ विरोधी दिशा स्पष्ट करता है; फिर भी मूल क्रिया का ‘निकलना’ अर्थ बनाए रखा गया है।
- issue: ἐσάλπισεν के एकवचन और ἐβόησαν के बहुवचन के बीच संख्या-परिवर्तन
