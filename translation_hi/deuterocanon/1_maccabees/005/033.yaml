  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट युद्ध-वृत्तांत शैली रखी गई है। ‘तुरही’, ‘दल’ और ‘प्रार्थना करते हुए पुकार लगाई’ सामान्य पाठक के लिए सहज हैं। यूनानी पाठ का असामान्य एकवचन-से-बहुवचन परिवर्तन जानबूझकर सुरक्षित रखा गया है।
