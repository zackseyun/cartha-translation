  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: hi
  text: और वह परदेशियों के देश[a] में जाने के लिए निकल पड़ा और सामरिया से होकर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, ‘पलिश्तियों के देश’; क्योंकि बाइबलीय प्रयोग में यूनानी शब्द ἀλλόφυλοι पलिश्तियों के लिए एक पारंपरिक नाम हो सकता है। यहाँ ‘परदेशियों’ का व्यापक अनुवाद रखा गया है, क्योंकि यह पद स्वयं इससे अधिक निश्चित पहचान नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: निकल पड़ा
  rationale: यह क्रिया यहाँ यात्रा आरम्भ करने का भाव देती है; ‘निकल पड़ा’ आधुनिक हिन्दी में उस आरम्भिक गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ πορευθῆναι
  choice: जाने के लिए
  rationale: संज्ञीकृत अनन्त क्रिया यहाँ प्रयोजन या अभिप्रेत कार्य बताती है; ‘जाने के लिए’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: γῆν ἀλλοφύλων
  choice: परदेशियों के देश
  rationale: ἀλλόφυλοι का मूल भाव दूसरे जातीय समुदाय के लोगों का है। बाइबलीय यूनानी में यह पलिश्तियों के लिए पारंपरिक पद भी हो सकता है, पर इस पद में संकीर्ण पहचान स्पष्ट नहीं है; इसलिए व्यापक अर्थ रखा गया है।
- source_word: διεπορεύετο
  choice: से होकर गया
  rationale: अपूर्ण भूतकाल किसी क्षेत्र में से जारी यात्रा को दर्शाता है; ‘से होकर गया’ हिन्दी में इसे स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: τὴν Σαμάριαν
  choice: सामरिया
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
