review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the conditional structure, military encampment, and location beyond the river. However, “बढ़ जाएँगे” omits the explicit future crossing verb διαπεράσομεν. The Greek deliberately retains a second crossing/traversal verb, so the Hindi should retain it rather than reduce it to general advance. πρὸς αὐτόν is best kept neutral as “उसकी ओर”; the hostile implication is contextual but not lexically required.
  naturalness: The present Hindi is fluent and appropriately concise. The revision remains natural while making the second movement explicit.
  terminology: “पड़ाव डालें” is an apt modern Hindi military rendering of παρεμβάλῃ. “नदी के उस पार” accurately represents πέραν τοῦ ποταμοῦ. “उसकी ओर” preserves the lexical openness of πρὸς αὐτόν without imposing “विरुद्ध.”
  issues:
  - severity: medium
    issue: The explicit crossing sense of διαπεράσομεν is not represented.
    rationale: “बढ़ जाएँगे” conveys advance but not crossing/traversing. This removes a stated element of the Greek and its repetition of movement across.
  - severity: low
    issue: “उसके विरुद्ध” over-specifies πρὸς αὐτόν.
    rationale: A hostile advance is plausible in context, but πρός with an accusative is more directly “to/toward.” A neutral Hindi rendering preserves the source’s lexical ambiguity.
  revised_text: परन्तु यदि हम पार जाएँ और नदी के उस पार पड़ाव डालें, तो हम पार होकर उसकी ओर बढ़ेंगे।
  revised_footnotes:
  - marker: a
    text: या, “उसके पास।” यूनानी वाक्यांश का अर्थ अधिक तटस्थ रूप से “उसकी ओर” भी हो सकता है; युद्ध के प्रसंग में इससे उसके विरुद्ध बढ़ने का भाव निकल सकता है।
    reason: πρὸς αὐτόν (“उसकी ओर/उसके पास”) का प्रसंगानुसार विरोधी की ओर बढ़ने का अर्थ हो सकता है, पर उसे मूल पाठ में अनिवार्य नहीं किया गया है।
  revision_rationale: “पार होकर” से διαπεράσομεν का स्पष्ट पार करने का अर्थ बना रहता है, जबकि “उसकी ओर” πρὸς αὐτόν की तटस्थता सुरक्षित रखता है। पद्य की शर्त, पड़ाव, नदी के पार का स्थान, और सैन्य गमन का क्रम यथावत है।
