  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: hi
  text: परन्तु यदि हम पार जाएँ और नदी के उस पार पड़ाव डालें, तो हम पार होकर उसकी ओर बढ़ेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν
  choice: हम पार जाकर
  rationale: ἐὰν के साथ एओरिस्ट सब्जंक्टिव भविष्य की सम्भावित शर्त व्यक्त करता है। ‘पार जाकर’ सैन्य गतिविधि के क्रम को स्वाभाविक हिन्दी में रखता है।
- source_word: παρεμβάλῃ
  choice: पड़ाव डालें
  rationale: सैन्य प्रसंग में क्रिया का अर्थ छावनी या पड़ाव डालना है; यह वर्तमान मानक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: πέραν τοῦ ποταμοῦ
  choice: नदी के उस पार
  rationale: πέραν नदी की दूसरी ओर का स्थान बताता है। ‘उस पार’ स्थानिक दृष्टिकोण को बिना अनावश्यक विस्तार के स्पष्ट करता है।
- source_word: διαπεράσομεν
  choice: बढ़ जाएँगे
  rationale: मूलतः यह पार जाने की क्रिया है, पर पहले ही नदी पार करने का उल्लेख हो चुका है; यहाँ प्रसंगगत लक्ष्य की ओर आगे बढ़ना अभिप्रेत है। हिन्दी में शब्दशः पुनरावृत्ति से उत्पन्न भ्रम से बचते हुए सैन्य क्रम सुरक्षित रखा गया है।
- source_word: πρὸς αὐτόν
  choice: उसके विरुद्ध
  rationale: πρός का शाब्दिक अर्थ ‘उसकी ओर’ हो सकता है, किन्तु युद्ध के प्रसंग में यह विरोधी से भिड़ने के लिए उसकी ओर बढ़ने का संकेत देता है। ‘उसके विरुद्ध’ उस प्रसंगगत बल को व्यक्त करता है।
