  yaml_path: translation/deuterocanon/1_maccabees/005/023.yaml
  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: hi
  text: और वह उन्हें गलील से और अर्बाक्तिस से[a], स्त्रियों और बच्चों समेत और उनकी सारी वस्तुओं के साथ ले गया; और वे उन्हें बड़े आनंद के साथ यहूदिया में ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ पहले एकवचन (‘वह ... ले गया’) और फिर बहुवचन (‘वे ... ले आए’) का प्रयोग करता है; अनुवाद इस बदलाव को बनाए रखता है। अर्बाक्तिस के साथ यूनानी में शाब्दिक रूप से ‘में’ है; प्रसंग में इसे ‘अर्बाक्तिस से’ अनूदित किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: लेकर चला
  rationale: यह क्रिया यहाँ लोगों को अपने साथ लेकर सुरक्षित स्थान की ओर चलने का भाव देती है; केवल ‘लिया’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है।
- source_word: ἐκ τῆς Γαλιλαίας
  choice: गलील से
  rationale: यह उद्गम-सूचक भौगोलिक पदबंध है; ‘गलील’ हिन्दी में प्रचलित नाम है।
- source_word: ἐν Ἀρβάκτοις
  choice: अर्बाक्तिस में से
  rationale: यूनानी में स्थान-नाम के साथ ἐν (‘में’) है, पर गलील से लोगों को निकालकर ले जाने के प्रसंग और समानान्तर रचना के कारण हिन्दी में ‘में से’ स्रोत-स्थान और मूल पूर्वसर्ग दोनों की छाया बनाए रखता है।
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: स्त्रियों और बच्चों समेत
  rationale: मूल पाठ ‘स्त्रियाँ’ और ‘बच्चे’ कहता है; ‘पत्नियाँ’ कहना अनावश्यक रूप से संबंध को संकीर्ण कर देता।
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: जो कुछ उनका था वह सब
  rationale: यह व्यापक रूप से उनकी सारी वस्तुओं या संपत्ति को सूचित करता है और हिन्दी में सहज है।
- source_word: ἤγαγον
  choice: वे उन्हें ... ले आए
  rationale: प्रेषित यूनानी पाठ में यहाँ बहुवचन क्रिया है। हिन्दी अनुवाद इसे एकवचन बनाकर समरूप नहीं करता। संदर्भ से कर्म ‘उन्हें’ स्पष्ट करके वाक्य स्वाभाविक बनाया गया है।
- source_word: εἰς τὴν Ἰουδαίαν
  choice: यहूदिया में
  rationale: εἰς किसी क्षेत्र के भीतर की ओर गति बताता है; ‘यहूदिया में ले आए’ हिन्दी में इस दिशा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: बड़े आनन्द के साथ
  rationale: यह पदबंध सामूहिक हर्ष और उत्सवपूर्ण प्रसन्नता व्यक्त करता है।
