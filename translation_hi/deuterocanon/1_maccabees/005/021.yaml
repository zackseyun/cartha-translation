review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Simon's going into Galilee, his engagement in many conflicts against the nations, and their being crushed before him. The passive force of συνετρίβη is best expressed explicitly in Hindi.
  naturalness: ‘जातियाँ उसके सामने चूर हो गईं’ is understandable but somewhat less idiomatic and can suggest that they simply fell apart rather than were crushed. ‘जातियाँ उसके सामने कुचल दी गईं’ is more natural in elevated historical Hindi and preserves the Greek passive.
  terminology: ‘शमौन,’ ‘गलील,’ and ‘जातियाँ’ are appropriate, neutral historical renderings. ‘युद्ध लड़े’ is a more idiomatic Hindi collocation than ‘युद्ध किए’ while retaining the plural πόλεμους.
  issues:
  - severity: low
    issue: The expression ‘चूर हो गईं’ does not clearly retain the passive sense of συνετρίβη.
    rationale: The Greek states that the nations were crushed; ‘कुचल दी गईं’ conveys both the force and passive construction more directly.
  - severity: low
    issue: ‘युद्ध किए’ is less idiomatic than ‘युद्ध लड़े’ in this narrative context.
    rationale: Both can be understood, but ‘बहुत-से युद्ध लड़े’ is standard modern Hindi phrasing for engaging in multiple wars or battles.
  revised_text: और शमौन गलील में गया और उसने जातियों के विरुद्ध बहुत-से युद्ध लड़े; और जातियाँ उसके सामने कुचल दी गईं।
  revised_footnotes: []
