  text: And Simon went into Galilee, and fought many battles against the nations; and the nations were crushed before him.
translation:
  language: hi
  text: और शमौन गलील में गया और उसने जातियों के विरुद्ध बहुत-से युद्ध लड़े; और जातियाँ उसके सामने कुचल दी गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: गया
  rationale: πορεύομαι के सामान्य गत्यर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; सैन्य संदर्भ के बावजूद ‘कूच किया’ मूल क्रिया से अधिक विशिष्ट होता।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील में
  rationale: εἰς किसी क्षेत्र के भीतर जाने की दिशा बताता है; हिन्दी में ‘गलील में गया’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: बहुत-से युद्ध किए
  rationale: συνάπτω के साथ πόλεμος युद्ध में भिड़ने या युद्ध करने का मुहावरा है; यह अनुवाद बहुवचन को बनाए रखते हुए सहज है।
- source_word: πρὸς τὰ ἔθνη
  choice: जातियों के विरुद्ध
  rationale: सैन्य संदर्भ में πρὸς विरोध का संकेत देता है और ἔθνη आसपास के गैर-यहूदी जनसमूहों को दर्शाता है; ‘जातियाँ’ अपेक्षाकृत तटस्थ और परंपरागत बाइबलीय पद है।
- source_word: συνετρίβη
  choice: चूर हो गईं
  rationale: συντρίβω के निष्क्रिय रूप में कुचले या तोड़े जाने का प्रबल बिंब है; ‘पराजित हुईं’ की तुलना में ‘चूर हो गईं’ मूल की तीव्रता बचाता है।
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: उसके सामने
  rationale: यह सामी प्रभाव वाला यूनानी मुहावरा किसी की उपस्थिति या बढ़ते आक्रमण के सामने होने को व्यक्त करता है; हिन्दी में ‘उसके सामने’ संक्षिप्त और स्वाभाविक है।
