- from: और शमौन गलील में गया और उसने जातियों के विरुद्ध बहुत-से युद्ध किए; और जातियाँ उसके सामने चूर हो गईं।
  to: और शमौन गलील में गया और उसने जातियों के विरुद्ध बहुत-से युद्ध लड़े; और जातियाँ उसके सामने कुचल दी गईं।
