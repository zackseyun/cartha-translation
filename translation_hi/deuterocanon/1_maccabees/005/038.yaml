  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: hi
  text: और यहूदा ने छावनी की टोह लेने के लिए लोगों को भेजा। उन्होंने उसे बताया, “तुम्हारे चारों ओर के सभी राष्ट्र उनके विरुद्ध इकट्ठे हो गए हैं—एक बहुत बड़ी सेना।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में असामान्य रूप से “तुम्हारे चारों ओर ... उनके विरुद्ध” है। इसे प्रसंग के अनुसार बदलकर “तुम्हारे विरुद्ध” या “हमारे चारों ओर” नहीं किया गया है।
    reason: मूल पाठ के सर्वनामों की अप्रत्याशितता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सामान्य कथात्मक क्रिया; आधुनिक हिन्दी में स्वाभाविक और मूल के अनुरूप।
- source_word: κατασκοπῆσαι
  choice: टोह लेने के लिए
  rationale: शत्रु की सैन्य स्थिति की गुप्त जाँच का भाव स्पष्ट करता है और अत्यधिक तकनीकी भाषा से बचता है।
- source_word: παρεμβολήν
  choice: छावनी
  rationale: सैन्य प्रसंग में παρεμβολή का स्वाभाविक हिन्दी समतुल्य।
- source_word: ἀπήγγειλαν
  choice: लौटकर उसे बताया
  rationale: टोही दल द्वारा सूचना वापस लाकर देने का प्रसंगगत भाव स्वाभाविक हिन्दी में व्यक्त होता है; 'लौटकर' संदर्भ से निहित है।
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: इकट्ठे हो गए हैं
  rationale: परिप्रयुक्त पूर्णकाल से व्यक्त हुई पूर्ण क्रिया और उसकी वर्तमान परिणामी अवस्था, दोनों को रखता है।
- source_word: πρὸς αὐτοὺς
  choice: उनके विरुद्ध
  rationale: सैन्य संदर्भ में πρὸς का शत्रुतापूर्ण अर्थ उचित है; αὐτούς को प्रसंगानुसार बदलकर 'तुम्हारे' या 'हमारे' नहीं किया गया।
- source_word: πάντα τὰ ἔθνη
  choice: सभी राष्ट्र
  rationale: आस-पास के जातीय-राजनीतिक समूहों के लिए व्यापक और अपेक्षाकृत तटस्थ अनुवाद।
- source_word: τὰ κύκλῳ ὑμῶν
  choice: तुम्हारे चारों ओर के
  rationale: मूल के द्वितीय पुरुष बहुवचन ὑμῶν को सुरक्षित रखता है।
- source_word: δύναμις πολλὴ σφόδρα
  choice: एक बहुत बड़ी सेना
  rationale: इस सैन्य आख्यान में δύναμις सशस्त्र बल को सूचित करता है; 'बहुत बड़ी' πολλὴ σφόδρα की तीव्रता व्यक्त करता है।
