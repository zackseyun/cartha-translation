- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: हमारे सभी भाई
  rationale: ἀδελφοί का सीधा संबंधसूचक अर्थ ‘भाई’ है; यहाँ इससे संभवतः साथी यहूदी या स्वजातीय लोग अभिप्रेत हैं, पर मूल का पारिवारिक शब्द बनाए रखा गया है।
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: तूब के इलाके में रहनेवाले
  rationale: वाक्यांश स्थान या क्षेत्र का बोध कराता है, यद्यपि Τουβίου का सटीक नामरूप कठिन है। ‘तूब का इलाका’ संभावित भौगोलिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τεθανάτωνται
  choice: मार डाले गए हैं
  rationale: θανατόω का पूर्णकालिक कर्मवाच्य रूप हिंसक मृत्यु और उसकी वर्तमान परिणति को व्यक्त करता है; इसलिए केवल ‘मर गए हैं’ की अपेक्षा ‘मार डाले गए हैं’ अधिक सटीक है।
- source_word: αἰχμαλωτίκασι
  choice: बंदी बना लिया गया है … उठा ले जाया गया है
  rationale: क्रिया युद्ध में पकड़कर ले जाने का अर्थ देती है। व्यक्तियों के लिए ‘बंदी बना लिया’ और सामान के लिए ‘उठा ले जाया गया’ कहना हिन्दी में स्वाभाविक है, जबकि यूनानी में एक ही क्रिया दोनों पर लागू है।
- source_word: τὴν ὑποσκευήν
  choice: उनका सामान
  rationale: ὑποσκευή चल संपत्ति, सामान या साज-सामान का सूचक हो सकता है। ‘सामान’ व्यापक, सहज और प्रसंगानुकूल है।
- source_word: ἀπώλεσαν
  choice: नष्ट कर दिया गया है
  rationale: ἀπόλλυμι का मूल अर्थ नष्ट करना है। पुरुषों के संदर्भ में इसका आशय मार डालना है, फिर भी मुख्य पाठ में मूल की व्यापक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: लगभग एक हज़ार पुरुषों
  rationale: संख्या के साथ ὡς अनुमान व्यक्त करता है; ‘लगभग’ इसे स्पष्ट और स्वाभाविक रूप से दर्शाता है।
