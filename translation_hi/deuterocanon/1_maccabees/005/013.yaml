  yaml_path: translation/deuterocanon/1_maccabees/005/013.yaml
  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
translation:
  language: hi
  text: और तूब के इलाके में रहने वाले हमारे सभी भाई मार डाले गए हैं।[a] उन्होंने उनकी पत्नियों और बच्चों को बंदी बना लिया है और उनका सामान भी ले गए हैं;[b] और वहाँ लगभग एक हज़ार पुरुषों को मार डाला।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में स्थानसूचक पद का शाब्दिक रूप लगभग ‘तूबियू के [स्थानों/लोगों] में’ है; नाम का सटीक रूप अनिश्चित है। ‘तूब का इलाका’ संभावित भौगोलिक अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: ‘सामान’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘चल संपत्ति’, ‘बोझा’ या ‘साज-सामान’ भी हो सकता है। यूनानी में पत्नियों, बच्चों और सामान—तीनों के लिए एक ही क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘लगभग एक हज़ार पुरुषों को नष्ट कर दिया’ है; पुरुषों के संदर्भ में इसका अर्थ ‘मार डाला’ है।
    reason: lexical_alternative
