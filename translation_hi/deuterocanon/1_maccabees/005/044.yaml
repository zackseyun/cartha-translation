  yaml_path: translation/deuterocanon/1_maccabees/005/044.yaml
  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: hi
  text: और उन्होंने नगर पर अधिकार कर लिया और पवित्र परिसर को उसमें मौजूद सभी लोगों समेत आग से जला दिया[a]। इस प्रकार करनैन पराजित हुआ और फिर यहूदा के सामने टिक न सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें मौजूद हर वस्तु समेत।” यूनानी पद का अर्थ अधिक व्यापक भी हो सकता है, यद्यपि इस प्रसंग में संभवतः पवित्र परिसर के भीतर मौजूद लोग अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  choice: अधिकार कर लिया
  rationale: युद्ध के प्रसंग में यह नगर को शीघ्र या विरोधी से पहले अपने अधिकार में लेने का भाव देता है। हिन्दी में उपसर्ग के पूर्वकालिक भाव को अलग से जोड़ना अस्वाभाविक और संदर्भ से अधिक निश्चित होता, इसलिए स्वाभाविक सैन्य अभिव्यक्ति चुनी गई।
- source_word: τὴν πόλιν
  choice: नगर
  rationale: πόλις के लिए आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण सामान्य शब्द।
- source_word: τὸ τέμενος
  choice: पवित्र परिसर
  rationale: τέμενος केवल मंदिर-भवन नहीं, बल्कि अलग किया हुआ पवित्र घेरा या परिसर दर्शाता है; यह अनुवाद उस व्यापक स्थानगत अर्थ को बनाए रखता है।
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: आग से जला दिया
  rationale: यूनानी की बलाघातपूर्ण रचना में क्रिया और साधन दोनों व्यक्त हैं; हिन्दी में यह वाक्यांश स्पष्ट और स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: उसमें मौजूद सभी लोगों समेत
  rationale: व्याकरणतः यह पद लोगों या अधिक व्यापक रूप से भीतर मौजूद सब कुछ को सूचित कर सकता है। सैन्य प्रसंग में लोगों का अर्थ अधिक संभावित है; व्यापक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐτροπώθη
  choice: पराजित हुआ
  rationale: निष्क्रिय सैन्य प्रयोग में मूल अर्थ पीछे मोड़े जाने या भगाए जाने का है। नगर के नाम को व्याकरणिक कर्ता बनाते हुए ‘पराजित हुआ’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἡ Καρναῒν
  choice: करनैन
  rationale: यूनानी स्थाननाम Καρναῒν का देवनागरी में निकट लिप्यंतरण।
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι
  choice: फिर ... टिक न सका
  rationale: यह युद्ध में सामने खड़े रहने या प्रतिरोध करने में असमर्थता बताता है; ‘टिक न सका’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: κατὰ πρόσωπον Ἰούδα
  choice: यहूदा के सामने
  rationale: यह मुहावरा प्रत्यक्ष सामना व्यक्त करता है। ‘के सामने’ हिन्दी में उस विरोधात्मक भाव को स्वाभाविक रूप से व्यक्त करता है, बिना ‘आमने-सामने’ की अनावश्यक पुनरुक्ति के।
