  text: और गिलाद में रहनेवाली जातियाँ उन इस्राएलियों के विरुद्ध इकट्ठी हुईं, जो उनके सीमावर्ती क्षेत्रों में रहते थे, ताकि उन्हें मिटा दें[a]; और इस्राएली भागकर दातेमा के गढ़ में चले गए।
  philosophy: optimal-equivalence
  footnotes:
