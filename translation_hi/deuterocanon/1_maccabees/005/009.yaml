lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठी हुईं
  rationale: संयुक्त क्रिया का सामूहिक रूप से एकत्र होने का भाव सहज हिन्दी में व्यक्त होता है; प्रसंग से शत्रुतापूर्ण लामबंदी स्पष्ट है।
- source_word: τὰ ἔθνη
  choice: जातियाँ
  rationale: यहाँ आसपास की गैर-इस्राएली जनजातियों अथवा लोगों का संकेत है। ‘जातियाँ’ मूल के बहुवचन और व्यापक अर्थ को बनाए रखता है।
- source_word: τὰ ἐν τῇ Γαλααδίτιδι
  choice: गिलाद में रहनेवाली
  rationale: Γαλααδῖτις गिलाद के क्षेत्र को सूचित करता है; यह रूप साधारण हिन्दी में भौगोलिक संबंध स्पष्ट करता है।
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: इस्राएलियों के विरुद्ध
  rationale: मूल में ‘इस्राएल’ एकवचन सामूहिक संज्ञा है, जबकि आगे का बहुवचन विशेषण उन लोगों को इंगित करता है; हिन्दी में ‘इस्राएलियों’ से आशय स्वाभाविक रूप से स्पष्ट होता है।
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: अपनी सीमाओं के भीतर बसे
  rationale: ἐπὶ τοῖς ὁρίοις का अर्थ सीमाओं पर अथवा सीमाक्षेत्र में हो सकता है। प्रसंग में ‘अपनी’ का संबंध जातियों से है; ‘सीमाओं के भीतर बसे’ स्थान-संबंध को सहज बनाता है, यद्यपि ‘सीमाओं पर बसे’ भी संभव है।
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: उन्हें पूरी तरह मिटा देने के लिए
  rationale: ἐξαίρω यहाँ पूर्ण निष्कासन अथवा उन्मूलन की शत्रुतापूर्ण मंशा व्यक्त करता है। ‘पूरी तरह मिटा देना’ उसकी तीव्रता को आधुनिक और स्पष्ट हिन्दी में रखता है।
- source_word: ἔφυγον
  choice: वे भागकर ... चले गए
  rationale: सरल आख्यान में पलायन का अर्थ स्पष्ट करता है और गंतव्य के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: Δάθεμα
  choice: दातेमा
  rationale: यूनानी स्थाननाम का देवनागरी लिप्यंतरण है।
- source_word: τὸ ὀχύρωμα
  choice: गढ़
  rationale: यह किसी सुदृढ़ किलेबंद स्थान को दर्शाता है; ‘गढ़’ संक्षिप्त, स्वाभाविक और सैन्य आशय वाला हिन्दी शब्द है।
