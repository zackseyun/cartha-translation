base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: hi
  text: और यहूदा ने यहूदिया के अक्रबत्तीन प्रदेश में एसाव के पुत्रों[a] से युद्ध किया, क्योंकि वे इस्राएल को चारों ओर से घेर रहे थे। उसने उन पर भारी प्रहार किया, उन्हें दबा दिया, और उनकी लूट ले ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् एसाव के वंशज; सम्भवतः एदोमी। यूनानी पाठ में शाब्दिक रूप से “एसाव के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμει
  choice: युद्ध किया
  rationale: अपूर्ण भूतकाल चल रही सैन्य कार्रवाई का संकेत देता है; हिन्दी में प्रसंगानुकूल सरल भूतकाल स्वाभाविक है, जबकि ‘से’ विरोध का भाव सुरक्षित रखता है।
- source_word: υἱοὺς Ἠσαῦ
  choice: एसाव के पुत्रों
  rationale: यूनानी की वंशावली-सूचक अभिव्यक्ति को यथावत रखा गया है; ‘एदोमियों’ कहना ऐतिहासिक रूप से सम्भावित, पर अधिक व्याख्यात्मक होता।
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: यहूदिया के अक्रबत्तीन प्रदेश में
  rationale: संक्षिप्त और कुछ असामान्य यूनानी रचना में अक्रबत्तीन को यहूदिया के भीतर के क्षेत्र के रूप में समझा गया है; ‘प्रदेश’ जोड़ने से स्थाननाम आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: περικάθηντο
  choice: चारों ओर से घेर रहे थे
  rationale: क्रिया लगातार घेरकर दबाव डालने का भाव देती है। यह अनुवाद औपचारिक नगर-घेराबंदी को अनिवार्य नहीं मानता।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल
  rationale: मूल का सामूहिक एकवचन और बाइबलीय राष्ट्रीय नाम सुरक्षित रखा गया है।
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην
  choice: उन पर भारी प्रहार किया
  rationale: सैन्य पराजय के यूनानी मुहावरे को निकट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνέστειλεν αὐτούς
  choice: उन्हें दबा दिया
  rationale: क्रिया घटाने, रोकने या वश में करने का भाव रखती है। ‘दबा दिया’ सैन्य दमन व्यक्त करता है, पर पूर्ण विनाश का दावा नहीं करता।
- source_word: τὰ σκῦλα αὐτῶν
  choice: उनकी लूट
  rationale: युद्ध में विजय के बाद लिए गए माल के लिए ‘लूट’ सामान्य और स्पष्ट आधुनिक हिन्दी है।
