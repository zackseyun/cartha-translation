translation:
  language: hi
  text: तब नगर के लोगों ने उन्हें घेरकर रोक लिया[a] और फाटकों को पत्थरों से अवरुद्ध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: उन्हें बंद कर दिया। यूनानी क्रिया से यह स्पष्ट नहीं होता कि उन्हें नगर के बाहर रोका गया था या किसी स्थान में बंद किया गया था।'
    reason: ἀπέκλεισαν के ‘शट आउट’ और ‘शट इन/घेरकर बंद करने’ के संभावित अर्थों को बिना प्रसंगगत दिशा थोपे सुरक्षित रखता है।
lexical_decisions:
- source_word: ἀπέκλεισαν
  choice: भीतर आने से रोक दिया
  rationale: क्रिया का अर्थ किसी को बंद करना, बाहर रखना या प्रवेश रोकना हो सकता है। प्रसंग में नगर के लोग फाटकों को पत्थरों से बंद कर रहे हैं, इसलिए यहाँ सेना को नगर में प्रवेश करने से रोकना अभिप्रेत है।
- source_word: οἱ ἐκ τῆς πόλεως
  choice: नगर के लोगों ने
  rationale: यूनानी पद का शाब्दिक अर्थ ‘नगर से जो थे’ है। ‘नगर के लोग’ स्वाभाविक हिन्दी है और मूल की तरह उनके लिंग या विशेष सैनिक भूमिका को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐνέφραξαν
  choice: बंद कर दिया
  rationale: इस क्रिया में रोकने, पाटने या अवरुद्ध करने का भाव है। पत्थरों और फाटकों के प्रसंग में ‘बंद कर दिया’ स्पष्ट और स्वाभाविक है।
- source_word: τὰς πύλας
  choice: फाटकों को
  rationale: बहुवचन को बनाए रखते हुए नगर के बड़े प्रवेश-द्वारों के लिए ‘फाटक’ उपयुक्त शब्द है।
- source_word: λίθοις
  choice: पत्थरों से
  rationale: यह करण कारक है और उन पत्थरों को बताता है जिनसे फाटक बंद किए गए।
