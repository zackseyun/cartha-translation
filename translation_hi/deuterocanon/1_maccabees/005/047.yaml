  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर के लोग’ मूल के अनिर्दिष्ट सामूहिक पद को सुरक्षित रखता है; ‘भीतर आने से रोक दिया’ प्रसंगानुकूल अर्थ स्पष्ट करता है, जबकि पादटिप्पणी यूनानी क्रिया की अर्थ-सीमा को बनाए रखती है।
