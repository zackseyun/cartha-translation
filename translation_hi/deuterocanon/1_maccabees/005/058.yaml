lexical_decisions:
- source_word: παρήγγειλαν
  choice: आदेश दिया
  rationale: यह क्रिया निर्देश या आदेश देने को व्यक्त करती है; सैनिक प्रसंग में ‘आदेश दिया’ स्वाभाविक और सटीक है।
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: अपने साथ की सेना के लोगों को
  rationale: δύναμις यहाँ सैनिक बल या सेना को सूचित करता है। ‘सेना के लोगों’ से ἀπό का अंशसूचक भाव बना रहता है और हिन्दी सहज रहती है।
- source_word: ἐπορεύθησαν
  choice: चल पड़े
  rationale: क्रिया मूलतः जाने या आगे बढ़ने को व्यक्त करती है। सैनिक दिशा अगले पदबंध से स्पष्ट है, इसलिए ‘चल पड़े’ स्वाभाविक कथात्मक हिन्दी है।
- source_word: ἐπὶ Ἰαμνίαν
  choice: यामनिया पर चढ़ाई करने
  rationale: सैनिक गतिविधि के प्रसंग में ἐπί और कर्मकारक किसी स्थान की ओर शत्रुतापूर्ण बढ़त का संकेत दे सकते हैं। ‘चढ़ाई करने’ इस संभावित भाव को व्यक्त करता है, जबकि अधिक सामान्य दिशात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: Ἰαμνίαν
  choice: यामनिया
  rationale: यूनानी स्थान-नाम का हिन्दी में सुबोध लिप्यंतरण।
