  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य रखा गया है। दूसरे उपवाक्य में यूनानी की क्रिया-लोप संरचना को हिन्दी में भी स्वाभाविक रूप से बनाए रखा गया है; पहले उपवाक्य का ‘सौंपे गए’ वहाँ स्वतः लागू होता है। ‘जबकि’ δέ के विरोध/भेदसूचक संबंध को स्पष्ट करता है।
