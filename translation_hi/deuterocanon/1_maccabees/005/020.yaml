translation:
  language: hi
  text: और गलील जाने के लिए शमौन को तीन हज़ार पुरुष, और यहूदा को गिलाद के लिए आठ हज़ार पुरुष सौंपे गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: सौंपे गए
  rationale: यहाँ क्रिया का कर्मवाच्य रूप सेनाओं को अलग-अलग सेनापतियों के अधीन नियुक्त किए जाने का भाव देता है। ‘सौंपे गए’ इस सैनिक-प्रशासनिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी पाठ स्पष्ट रूप से ‘पुरुष’ कहता है। प्रसंग में वे युद्ध करने वाले पुरुष हैं, पर ‘सैनिक’ कहना स्रोत से अधिक स्पष्ट व्याख्या जोड़ देता।
- source_word: τρισχίλιοι
  choice: तीन हज़ार
  rationale: संख्या का सीधा और स्वाभाविक अनुवाद।
- source_word: τοῦ πορευθῆναι
  choice: जाने के लिए
  rationale: सविभक्ति क्रियार्थक संज्ञा यहाँ उद्देश्य व्यक्त करती है। ‘जाने के लिए’ अर्थ को सहज रूप में रखता है; ‘कूच करने’ से ऐसा सैनिक रंग जुड़ता जो πορεύομαι में अनिवार्य नहीं है।
- source_word: Γαλιλαίαν
  choice: गलील
  rationale: इस स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Σίμωνι
  choice: शमौन
  rationale: व्यक्तिगत नाम Σίμων का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: यहाँ यह व्यक्तिगत नाम है। हिन्दी बाइबलीय परंपरा में इस यहूदी सेनापति के लिए ‘यहूदा’ स्वाभाविक है और यूनानी नाम का उचित प्रतिनिधित्व करता है।
- source_word: ὀκτακισχίλιοι
  choice: आठ हज़ार
  rationale: संख्या का सीधा और स्वाभाविक अनुवाद।
- source_word: Γαλααδῖτιν
  choice: गिलाद
  rationale: यह शब्द गिलाद प्रदेश को सूचित करता है। हिन्दी में संक्षिप्त स्थान-नाम ‘गिलाद’ पर्याप्त और स्वाभाविक है।
