- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: पूरे मार्ग में
  rationale: यह सारे रास्ते भर जारी रहनेवाली क्रिया को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: γῆν Ἰούδα
