  yaml_path: translation/deuterocanon/1_maccabees/005/025.yaml
  text: And they met the Nabateans[a], and they greeted them peaceably, and they told them everything that had happened to their brothers in Gilead,
translation:
  language: hi
  text: और वे नबातियों से मिले। नबातियों ने शांतिपूर्वक उनका स्वागत किया[a] और उन्हें वह सब बताया जो गिलाद में उनके भाइयों के साथ हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे शांति से मिलने आए।” यूनानी क्रिया किसी से मिलने के लिए आगे आने या उसका स्वागत करने—दोनों अर्थ दे सकती है; क्रिया-विशेषण शांतिपूर्ण मंशा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησαν
  choice: मिले
  rationale: साधारण कथात्मक क्रिया का सीधा और स्वाभाविक अनुवाद; इसमें न तो संयोगवश सामना होने का और न ही शत्रुता का अतिरिक्त भाव जोड़ा गया है।
- source_word: Ναβαταίοις
  choice: नबातियों
  rationale: इस प्राचीन जाति के नाम का आधुनिक हिन्दी में प्रचलित लिप्यंतरण।
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  choice: नबातियों ने शांतिपूर्वक उनका स्वागत किया
  rationale: क्रिया मिलने के लिए आगे आने या स्वागत करने का अर्थ दे सकती है; εἰρηνικῶς स्पष्ट करता है कि उनका व्यवहार मैत्रीपूर्ण और अहिंसक था। स्पष्ट कर्ता देकर यूनानी वाक्य के कर्ता-परिवर्तन को हिन्दी में सहज बनाया गया है।
- source_word: διηγήσαντο
  choice: बताया
  rationale: घटनाओं को विस्तार से सुनाने या बयान करने का अर्थ यहाँ सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἅπαντα τὰ συμβεβηκότα
  choice: वह सब ... जो ... हुआ था
  rationale: ἅπαντα की समग्रता और पूर्णभूत घटनाओं का भाव दोनों सुरक्षित रहते हैं।
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: उनके भाइयों के साथ
  rationale: मूल का संबंधसूचक पारिवारिक शब्द बनाए रखा गया है; उसे व्याख्यात्मक रूप से ‘साथी यहूदियों’ में नहीं बदला गया।
- source_word: ἐν τῇ Γαλααδίτιδι
  choice: गिलाद में
  rationale: क्षेत्र के नाम का संक्षिप्त और स्वाभाविक हिन्दी रूप।
