  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
translation:
  language: hi
  text: और उसने उनका पीछा टॉलमाइस के नगरों तक किया। अन्यजातियों में से लगभग तीन हज़ार पुरुष[a] मारे गए,[b] और उसने उनकी लूट का माल ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल ‘तीन हज़ार पुरुष’; यूनानी पदबंध का अर्थ अनुमानित संख्या अथवा ठीक तीन हज़ार की सामान्य गणना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अन्यजातियों’ से विरोधी पक्ष में शामिल गैर-यहूदी लोगों का संकेत है; कुछ अनुवादों में ‘गैर-यहूदी’ लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: पीछा किया
  rationale: युद्ध के प्रसंग में यह पराजित सेना का लगातार पीछा करने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: टॉलमाइस के नगरों तक
  rationale: ἕως सीमा या पहुँच को व्यक्त करता है और यूनानी में πόλεων बहुवचन है; इसलिए ‘नगरों’ को बनाए रखा गया है।
- source_word: ἔπεσον
  choice: मारे गए
  rationale: युद्ध-वर्णन में ‘गिरे’ का आशय युद्ध में मारे जाने से है; आधुनिक हिन्दी में ‘मारे गए’ अर्थ को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τῶν ἐθνῶν
  choice: अन्यजातियों में से
  rationale: यह विरोधी सेनाओं में सम्मिलित गैर-इस्राएली लोगों को सूचित करता है; ‘अन्यजातियों’ धार्मिक-ऐतिहासिक संदर्भ में संक्षिप्त और परिचित है।
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: लगभग तीन हज़ार पुरुष
  rationale: संख्या के साथ εἰς कुल संख्या अथवा अनुमानित मात्रा बता सकता है; ‘लगभग’ सम्भावित अनुमानात्मक भाव को सुरक्षित रखता है।
- source_word: τὰ σκῦλα αὐτῶν
  choice: उनकी लूट का माल
  rationale: σκῦλα युद्ध में पराजितों से प्राप्त माल को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट है और αὐτῶν का संबंध भी बनाए रखता है।
