theological_decisions:
- issue: ऐतिहासिक संदर्भ में ἔθνη का अर्थ
  choice: जातियाँ
  alternative: अन्यजातियाँ; राष्ट्र
  rationale: यहाँ पद जातीय-राजनीतिक पड़ोसी जनसमूहों को दर्शाता है, न कि किसी विकसित बाद की धर्मवैज्ञानिक श्रेणी को। ‘जातियाँ’ मूल की व्यापकता बनाए रखता है।
- issue: ἀδελφοί का लिंग-सटीक अनुवाद
