lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: इन बातों के बाद
  rationale: यह स्वाभाविक काल-संक्रमण है। ῥήματα का अर्थ ‘बातें’ या ‘कहे गए शब्द’ हो सकता है; ‘बातों’ से हिन्दी में यह अर्थ-विस्तार बना रहता है।
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: क्रिया का मूल अर्थ एकत्र करना है और यहाँ सैन्य दल को जुटाने के संदर्भ में यह सहज है।
- source_word: παρεμβολὴν ἄλλην
  choice: एक और सैन्य दल
  rationale: παρεμβολή का अर्थ छावनी और, लक्षणा से, छावनी में स्थित सेना भी हो सकता है। हिन्दी में ‘छावनी इकट्ठी की’ अस्वाभाविक होता; ‘सैन्य दल’ प्रसंगगत अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: παρενέβαλεν
  choice: डेरा डाला
  rationale: सैन्य संदर्भ में यह शिविर लगाने का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: κατὰ πρόσωπον
  choice: के सामने
  rationale: यह किसी स्थान के सम्मुख या आमने-सामने की भौगोलिक स्थिति व्यक्त करता है।
- source_word: Ῥαφὼν
  choice: राफोन
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: नाले के उस पार
  rationale: यह जलधारा के दूसरी ओर की स्थिति बताता है। χειμάρρου मौसमी जलधारा, बरसाती नाले या तेज बहने वाली धारा को सूचित कर सकता है; ‘नाला’ आधुनिक हिन्दी में प्रसंग के अनुकूल और सुबोध है।
