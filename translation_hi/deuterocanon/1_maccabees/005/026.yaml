  yaml_path: translation/deuterocanon/1_maccabees/005/026.yaml
  text: and that many of them are shut up in Bosora and Bosor[a], in Alamis, Casphor, Maked, and Carnaim; all these cities are fortified and large.
translation:
  language: hi
  text: और यह भी कि उनमें से बहुत-से लोग बोस्सोरा और बोसोर, अलामोइस, कास्फोर, माकेद और करनाइन[a] में बंद हैं; ये सभी नगर किलेबंद और बड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी स्थान-नामों की पहचान और उनके रूप कठिन हैं तथा अलग-अलग अनुवाद-परम्पराओं में भिन्न मिलते हैं। यहाँ अधिक परिचित रूपों से सामंजस्य करने के बजाय स्वेटे के यूनानी पाठ के निकट लिप्यन्तरण रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: συνειλημμένοι
  choice: बंद हैं
  rationale: यह पूर्ण निष्क्रिय कृदन्त लोगों के इन नगरों के भीतर घिरे या रोके होने की अवस्था बताता है। ‘बंद हैं’ उस अर्थ को सहज हिन्दी में व्यक्त करता है और बिना पर्याप्त आधार के इसे तकनीकी रूप से ‘घेराबंदी में हैं’ नहीं बनाता।
- source_word: εἰς … ἐν
  choice: … में
  rationale: निष्क्रिय कृदन्त और स्थान-नामों के साथ ये पूर्वसर्ग यहाँ गति के बजाय परिणामी स्थान की अवस्था बताते हैं; हिन्दी में पूरी सूची के लिए ‘में’ स्वाभाविक है।
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: बोस्सोरा और बोसोर, अलामोइस, कास्फोर, माकेद और करनाइन
  rationale: स्थान-नामों को स्वेटे के यूनानी पाठ के निकट देवनागरी लिप्यन्तरण में रखा गया है और दूसरी पाठ-परम्पराओं के अधिक परिचित रूपों से उनका सामंजस्य नहीं किया गया। बोस्सोरा और बोसोर को अलग रूपों में सुरक्षित रखा गया है।
- source_word: ὀχυραὶ
  choice: किलेबंद
  rationale: नगरों के संदर्भ में यह विशेषण उनकी रक्षात्मक दृढ़ता और दुर्गीकरण को ठोस रूप से व्यक्त करता है।
- source_word: μεγάλαι
  choice: बड़े
  rationale: नगरों के सीधे वर्णन में यह आकार का स्वाभाविक अर्थ देता है और ‘महान’ जैसे मूल्यांकनात्मक भाव से बचता है।
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: ये सभी नगर
  rationale: यह सूची में आए स्थानों का समाहार करता है; ‘नगर’ आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी है।
