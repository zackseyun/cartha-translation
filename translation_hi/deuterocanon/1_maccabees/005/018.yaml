lexical_decisions:
- source_word: κατέλιπεν
  choice: वहीं छोड़ दिया
  rationale: क्रिया का मूल अर्थ ‘पीछे छोड़ना’ है। ‘वहीं’ हिन्दी में इस आशय को स्वाभाविक बनाता है, जबकि ‘नियुक्त किया’ संदर्भ से अधिक अर्थ जोड़ देता।
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: जकर्याह के पुत्र योसेफ
  rationale: τὸν τοῦ + संबंधकारक यहाँ पितृवंश बताता है; हिन्दी में ‘जकर्याह के पुत्र योसेफ’ स्वाभाविक और स्पष्ट है।
- source_word: Ἀζαρίαν
  choice: अजर्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: लोगों के अगुवे
  rationale: ἡγούμενον एकवचन में है और निकटवर्ती अजर्याह का वर्णन करता है। ‘अगुवा’ नेतृत्व बताता है, पर किसी निश्चित शासकीय या सैनिक पद का अनावश्यक दावा नहीं करता।
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: शेष सेना के साथ
  rationale: सैनिक प्रसंग में δύναμις सैन्य बल/सेना को और ἐπίλοιπος बचे हुए भाग को सूचित करता है।
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया
  rationale: भौगोलिक नाम का मानक हिन्दी रूप; ‘वहीं’ के साथ स्थान में बने रहने का भाव व्यक्त होता है।
- source_word: εἰς τήρησιν
  choice: रक्षा के लिए
  rationale: τήρησις का अर्थ निगरानी, पहरा या सुरक्षा है; सैनिक प्रसंग में ‘रक्षा के लिए’ सहज है, जबकि पादटिप्पणी मूल शब्द के पहरा देने वाले पक्ष को सुरक्षित रखती है।
