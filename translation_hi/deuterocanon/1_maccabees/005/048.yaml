  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
translation:
  language: hi
  text: तब यहूदा ने उनके पास शांति के संदेश भेजे और कहा, “हम अपनी भूमि में जाने के लिए तुम्हारी भूमि से होकर गुजरेंगे। कोई तुम्हें हानि नहीं पहुँचाएगा; हम केवल पैदल गुजरेंगे।” पर वे उसके लिए खोलने को राजी नहीं हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, उन्होंने न तो उसे प्रवेश दिया, न वहाँ से होकर जाने का मार्ग; यूनानी मूल में ‘खोलने’ का कर्म बताया नहीं गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: शान्ति का सन्देश
  rationale: यह यूनानी पद के मैत्रीपूर्ण और कूटनीतिक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक ‘शान्ति की बातें’ यहाँ कम सहज है।
- source_word: Διελευσόμεθα
  choice: से होकर निकलेंगे
  rationale: भविष्यकालीन क्रिया यहाँ किसी क्षेत्र के आर-पार शान्तिपूर्वक जाने का अभिप्राय देती है।
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: अपनी भूमि में जाने के लिए
  rationale: सप्रयोजन infinitive को स्पष्ट रूप से व्यक्त करता है और ‘लौटने’ का वह अर्थ नहीं जोड़ता जो यूनानी में प्रत्यक्ष नहीं है।
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: कोई तुम्हें हानि नहीं पहुँचाएगा
  rationale: सैन्य और कूटनीतिक प्रसंग में κακοποιέω का स्वाभाविक अर्थ किसी को नुकसान पहुँचाना है।
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: हम केवल पैदल ही होकर निकलेंगे
  rationale: τοῖς ποσίν की ‘पैरों से’ वाली छवि बनाए रखते हुए यह मात्र अहानिकर मार्ग-गमन पर बल देता है; इसे घुड़सवारों के साथ तकनीकी विरोध मानना आवश्यक नहीं।
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: वे उसके लिए खोलने को तैयार नहीं हुए
  rationale: मूल में ‘खोलना’ का कर्म अनकहा है। हिन्दी में भी उसे अनकहा रखकर सम्भावित फाटक, नगर-प्रवेश या मार्ग देने के बीच की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
