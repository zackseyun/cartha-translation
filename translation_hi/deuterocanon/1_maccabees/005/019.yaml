lexical_decisions:
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने का भाव रखती है; ‘आज्ञा दी’ उस बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Πρόσεχετε
  choice: देखभाल करना
  rationale: सम्बन्धकारक τοῦ λαοῦ τούτου के साथ यहाँ केवल सावधान रहने का नहीं, बल्कि प्रजा पर ध्यान देने और उसकी रक्षा करने का भाव है।
- source_word: τοῦ λαοῦ τούτου
  choice: इस प्रजा की
  rationale: λαός सामूहिक जनसमुदाय को सूचित करता है; ‘प्रजा’ प्रसंग में उन लोगों को व्यक्त करता है जिन्हें उनकी देखरेख में छोड़ा गया था।
- source_word: μὴ συνάψητε πόλεμον
  choice: युद्ध न छेड़ना
  rationale: यह यूनानी मुहावरा युद्ध में भिड़ने या संघर्ष आरम्भ करने को व्यक्त करता है; निषेधात्मक आदेश में ‘युद्ध न छेड़ना’ सहज और स्पष्ट है।
- source_word: τὰ ἔθνη
  choice: अन्यजातियों
  rationale: 1 मक्काबियों के इस प्रसंग में यह आसपास के गैर-यहूदी जनसमूहों को सूचित करता है। ‘अन्यजातियाँ’ इस ऐतिहासिक भेद को बनाए रखता है, जबकि किसी एक आधुनिक राष्ट्र का अर्थ नहीं देता।
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: जब तक हम लौट न आएँ
  rationale: ἕως के साथ क्रियार्थक संज्ञा समय-सीमा बताती है; यह हिन्दी प्रयोग उस सीमा को स्वाभाविक ढंग से व्यक्त करता है।
