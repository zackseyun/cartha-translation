- source_word: ἀπέστρεψεν
  choice: लौट गया
  rationale: क्रिया का अर्थ वापस मुड़ना या लौटना है; प्रसंग में ‘लौट गया’ सहज और संक्षिप्त है।
- source_word: Ἰουδαίαν
  choice: यहूदिया
  rationale: यह यूनानी Ἰουδαία द्वारा सूचित क्षेत्र का प्रचलित हिन्दी नाम है और इसे प्राचीन गोत्रीय ‘यहूदा’ से अलग रखता है।
