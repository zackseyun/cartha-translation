- source_word: προκατελάβε
  choice: अधिकार कर लिया
  rationale: सैनिक प्रसंग में यह क्रिया किसी स्थान को अपने कब्ज़े में लेने का भाव देती है। ‘अधिकार कर लिया’ स्वाभाविक हिन्दी है और उपसर्ग के सम्भावित ‘पहले से’ भाव को अनावश्यक रूप से प्रबल नहीं करती।
