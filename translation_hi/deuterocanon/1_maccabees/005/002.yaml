  yaml_path: translation/deuterocanon/1_maccabees/005/002.yaml
  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: hi
  text: और वे अपने बीच रहने वाले याकूब के वंश[a] को हटा देने की योजना बना रहे थे, और वे उस प्रजा के लोगों को मारने और मिटा डालने लगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब का कुल” अथवा “याकूब के लोग।” यूनानी शब्द γένος वंश या समान उत्पत्ति से जुड़े समुदाय पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे लोगों के बीच मारने और मिटा डालने लगे।” यूनानी वाक्यांश का संबंध स्थान से या उस प्रजा के सदस्यों से माना जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: योजना बना रहे थे
  rationale: अपूर्णकालिक मध्यम रूप चल रही मंत्रणा या षड्यंत्र को दर्शाता है। प्रसंग में शत्रुतापूर्ण आशय स्पष्ट है, जबकि यह अभिव्यक्ति सहज आधुनिक हिन्दी है।
- source_word: ἆραι
  choice: हटा देने
  rationale: αἴρω का मूल भाव ‘उठा लेना/हटा देना’ है। यहाँ ‘हटा देने’ से उद्देश्य व्यक्त होता है, पर अगले खंड में स्पष्ट की गई हत्या को समय से पहले इस क्रिया में नहीं मिला दिया जाता।
- source_word: τὸ γένος Ἰακώβ
  choice: याकूब का वंश
  rationale: γένος वंश, कुल या समान उत्पत्ति से जुड़े समुदाय को सूचित करता है। ‘वंश’ वंशगत और वाचा-ऐतिहासिक पहचान को बनाए रखता है और आधुनिक नस्लीय अर्थ से बचता है।
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: अपने बीच रहनेवाले
  rationale: यह कृदन्तीय पद उन लोगों को निर्दिष्ट करता है जो शत्रु समुदायों के बीच रहते थे। ‘रहनेवाले’ निवास का प्रसंग स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: मारने ... लगे
  rationale: ἄρχομαι के साथ क्रियार्थक रूप कार्य के आरम्भ को बताता है और θανατόω का अर्थ मार डालना है।
- source_word: ἐν τῷ λαῷ
  choice: उस प्रजा में से लोगों को
  rationale: यूनानी पद संक्षिप्त है और इसे अंशवाचक रूप में समझने पर लक्ष्य उसी प्रजा के सदस्य हैं। हिन्दी में आवश्यक कर्म जोड़कर यह अर्थ स्वाभाविक बनाया गया है; स्थानवाचक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐξαίρειν
  choice: मिटा डालने
  rationale: हिंसक संदर्भ में ἐξαιρέω केवल हटाने से आगे उन्मूलन का भाव रखता है। ‘मिटा डालने’ से ‘मारने’ के बाद आने वाली तीव्रता बनी रहती है।
theological_decisions:
- issue: τὸ γένος Ἰακώβ में जातीय-वाचागत पहचान
  choice: याकूब का वंश
  alternative: याकूब का कुल / याकूब के लोग
  rationale: यह पद यहूदी लोगों को याकूब से उनके वंशगत संबंध द्वारा पहचानता है। ‘वंश’ उस ऐतिहासिक और सामुदायिक पहचान को सुरक्षित रखता है, बिना आधुनिक ‘नस्ल’ की अवधारणा थोपे।
- issue: ἆραι ... θανατοῦν ... ἐξαίρειν में उन्मूलन की बढ़ती तीव्रता
  choice: हटा देने ... मारने ... मिटा डालने
  alternative: नष्ट करने ... प्राण लेने ... जड़ से उखाड़ने
  rationale: मूल पाठ योजना के उद्देश्य से वास्तविक हत्या और फिर उन्मूलन तक बढ़ता है। अलग-अलग हिन्दी क्रियाएँ इस प्रगति को बनाए रखती हैं।
- issue: ἐν τῷ λαῷ का संक्षिप्त और अस्पष्ट संबंध
  choice: उस प्रजा में से लोगों को
  alternative: लोगों के बीच
  rationale: अंशवाचक अर्थ प्रसंग में लक्ष्य बने समुदाय के सदस्यों को दर्शाता है, पर मूल यूनानी स्थानवाचक भी समझा जा सकता है; इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘वंश’ सामान्य पाठक के लिए स्पष्ट है और ‘प्रजा’ सामूहिक पहचान को व्यक्त करती है। अर्धविराम मूल के दो निकट जुड़े किंतु क्रमशः बढ़ते कार्यों को अलग करता है।
