translation:
  language: hi
  text: और नगर के पुरुषों ने पड़ाव डाला, और उस पूरे दिन और पूरी रात नगर से युद्ध किया; और नगर उसके हाथों में सौंप दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उसके हाथों में’ है—सर्वनाम एकवचन है। पहले बहुवचन कर्ता आए हैं, इसलिए कुछ अनुवाद इसे सहज बनाकर ‘उनके हाथों में’ करते हैं।
    reason: मूल पाठ में संख्या-परिवर्तन और वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: παρενέβαλον
  choice: पड़ाव डाला
  rationale: यह सैन्य संदर्भ में डेरा डालने या मोर्चा लेने के ठोस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्रिया को केवल आक्रमण के अर्थ में सीमित किए।
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: नगर के पुरुषों
  rationale: ἄνδρες का विशिष्ट अर्थ ‘पुरुष’ है; इसे सामान्य ‘निवासी’ करने के बजाय यूनानी पाठ की लैंगिक और सैनिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: नगर से युद्ध किया
  rationale: यूनानी में πολεμέω का सीधा कर्म ‘नगर’ है। हिन्दी में ‘से युद्ध किया’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि पहले आए ‘नगर के पुरुषों’ के कारण उत्पन्न पाठगत तनाव को मिटाता नहीं।
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: उस पूरे दिन और पूरी रात
  rationale: दोनों खंडों में ὅλην की पुनरावृत्ति और दीर्घ अवधि के बल को ‘पूरे’ तथा ‘पूरी’ से बनाए रखा गया है।
- source_word: παρεδόθη
  choice: सौंप दिया गया
  rationale: यह क्रिया के कर्मवाच्य अर्थ को बनाए रखता है और सौंपने वाले कर्ता को यूनानी की तरह अनकहा छोड़ता है।
- source_word: ἐν χερσὶν αὐτοῦ
  choice: उसके हाथों में
  rationale: αὐτοῦ एकवचन है, इसलिए पहले के बहुवचन कर्ताओं के बावजूद ‘उसके’ रखा गया है; χερσίν के बहुवचन को ‘हाथों’ से व्यक्त किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में बहुवचन कर्ताओं के बाद एकवचन सर्वनाम
  choice: ‘उसके हाथों में’ रखकर αὐτοῦ का एकवचन सुरक्षित रखा गया
  alternative: संदर्भ के अनुसार सहज बनाने के लिए ‘उनके हाथों में’
  rationale: यूनानी साक्ष्य स्पष्ट रूप से एकवचन सर्वनाम रखता है। संभव है कि यह किसी अगुवे की ओर संकेत करता हो, पर पाठ स्वयं उसे स्पष्ट नहीं करता; इसलिए अस्पष्टता को अनुवाद में हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नगर’ और ‘युद्ध किया’ बाइबलीय ऐतिहासिक वर्णन के अनुकूल हैं। मूल में ‘नगर के पुरुषों’ द्वारा ‘नगर से युद्ध’ करने की कठिन अभिव्यक्ति को अनुमान लगाकर नहीं बदला गया।
