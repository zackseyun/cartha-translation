    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: वह पुरुष यहूदा
  rationale: यूनानी में व्यक्तिवाचक नाम से पहले ὁ ἀνήρ स्पष्ट रूप से उपस्थित है। कुछ असामान्य लगने पर भी इसे मुख्य पाठ में रखा गया है, ताकि स्रोत की विशेष बलयुक्त, समानाधिकरणीय अभिव्यक्ति मिट न जाए।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाई
  rationale: यह निकट और स्वाभाविक हिन्दी में पुरुष बहुवचन पारिवारिक संबंध को व्यक्त करता है।
- source_word: ἐδοξάζοντο σφόδρα
  choice: अत्यन्त सम्मानित हुए
  rationale: संदर्भ में δοξάζω का भाव सार्वजनिक प्रतिष्ठा और आदर पाना है। 'महिमान्वित हुए' अधिक शाब्दिक होता, पर ऐतिहासिक मानवीय संदर्भ में 'अत्यन्त सम्मानित हुए' अधिक स्वाभाविक है और कर्मवाच्य अर्थ बनाए रखता है।
- source_word: ἐναντίον παντὸς Ἰσραὴλ καὶ τῶν ἐθνῶν πάντων
  choice: सारे इस्राएल और उन सभी राष्ट्रों की दृष्टि में
  rationale: ἐναντίον यहाँ लोगों के सामने अथवा उनके आकलन में होने का भाव देता है। 'की दृष्टि में' आधुनिक हिन्दी में यह अर्थ स्पष्ट करता है; ἔθνη को अनावश्यक धार्मिक विशिष्टीकरण के बिना 'राष्ट्रों' कहा गया है।
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: जहाँ कहीं उनका नाम सुना जाता था
  rationale: यह अनिश्चित स्थानवाचक अर्थ और अपूर्णकालीन कर्मवाच्य दोनों को बनाए रखता है तथा 'यश' या 'समाचार' जैसी निहित धारणाओं को पाठ में नहीं जोड़ता।
