translation:
  language: hi
  text: और वह पुरुष यहूदा[a] और उसके भाई सारे इस्राएल और सभी राष्ट्रों की दृष्टि में अत्यन्त सम्मानित होते थे, जहाँ कहीं उनका नाम सुना जाता था।
  philosophy: optimal-equivalence
  footnotes:
