translation:
  language: hi
  text: तब गोरगियास नगर से निकला, और उसके आदमी युद्ध में उनका सामना करने के लिए निकले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकलकर … आए
  rationale: क्रिया का अर्थ किसी स्थान के भीतर से बाहर आना है। हिन्दी में संयुक्त रचना ‘निकलकर … आए’ युद्धस्थल की ओर गति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: πόλεως
  choice: नगर
  rationale: πόλις के लिए ‘नगर’ आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण है तथा सैन्य प्रसंग में किलेबंद शहरी स्थान का उपयुक्त बोध देता है।
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: उसके आदमी
  rationale: यूनानी पाठ शाब्दिक रूप से ‘उसके पुरुष/आदमी’ कहता है। प्रसंग में वे लड़ाके हैं, पर ‘सैनिक’ कहने से मूल से अधिक विशिष्टता जुड़ती; इसलिए ‘उसके आदमी’ रखा गया है।
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: उनका सामना करने
  rationale: यह पदबंध सामने जाकर मिलने का अर्थ देता है और युद्ध के प्रसंग में विरोधपूर्ण मुठभेड़ सूचित करता है; ‘सामना करने’ हिन्दी में उसी भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: εἰς πόλεμον
  choice: युद्ध में
  rationale: शाब्दिक भाव ‘युद्ध के लिए/युद्ध में’ है। ‘युद्ध में उनका सामना करने’ उद्देश्य और सैन्य मुठभेड़ दोनों को स्पष्ट तथा सहज रखता है।
