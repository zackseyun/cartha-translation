  yaml_path: translation/deuterocanon/1_maccabees/005/039.yaml
  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
translation:
  language: hi
  text: और अरबों को उनकी सहायता के लिए भाड़े पर रखा गया है, और वे बरसाती नाले के उस पार छावनी डाले हुए हैं, और युद्ध करने के लिए तेरे[a] विरुद्ध आने को तैयार हैं। तब यहूदा उनका सामना करने के लिए निकल पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “तेरे विरुद्ध” एकवचन है, क्योंकि यह समाचार सीधे यहूदा को सुनाया जा रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄραβες
  choice: अरबों
  rationale: यह सीधा जातीय नाम है और आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: μεμίσθωνται
  choice: भाड़े पर रखा गया है
  rationale: यूनानी पूर्णकालीन मध्य/कर्मवाच्य रूप भुगतान पर नियुक्त किए जाने से उत्पन्न वर्तमान स्थिति बताता है; हिन्दी में यह रूप उस पूर्ण और विद्यमान अवस्था को व्यक्त करता है।
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: उनकी सहायता के लिए
  rationale: यह नियुक्ति का उद्देश्य स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεμβάλλουσιν
  choice: छावनी डाले हुए हैं
  rationale: वर्तमानकालीन क्रिया यहाँ उस समय विद्यमान सैनिक स्थिति बताती है; यह पद सैन्य शिविर का भाव बनाए रखता है।
- source_word: πέραν τοῦ χειμάρρου
  choice: बरसाती नाले के उस पार
  rationale: χείμαρρος वर्षा ऋतु में बहने वाली धारा या उसके पाट को सूचित कर सकता है; 'बरसाती नाला' सम्भावित भू-आकृति को आम हिन्दी में स्पष्ट करता है।
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: युद्ध करने के लिए तेरे विरुद्ध आने को तैयार हैं
  rationale: इससे गति, शत्रुतापूर्ण दिशा और युद्ध का उद्देश्य—तीनों बने रहते हैं; एकवचन σὲ को 'तेरे' से सुरक्षित रखा गया है।
- source_word: εἰς συνάντησιν αὐτῶν
  choice: उनका सामना करने के लिए
  rationale: सैनिक प्रसंग में συνάντησις केवल सामान्य भेंट नहीं, आमने-सामने जाने का भाव रखता है; 'सामना करना' इसे बिना अनावश्यक विस्तार के व्यक्त करता है।
