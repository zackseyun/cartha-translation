base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/034.yaml
  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
translation:
  language: hi
  text: तीमुथियुस की छावनी ने पहचान लिया कि वह मक्काबी है। तब वे उसके सामने से भाग गए। उसने उन पर भारी प्रहार किया, और उस दिन उनमें से लगभग आठ हज़ार पुरुष[a] मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आठ हज़ार पुरुष”; यूनानी अभिव्यक्ति को अनुमानित अथवा पूर्णांकित संख्या के रूप में भी समझा जा सकता है।
    reason: संख्या-संबंधी यूनानी रचना में सटीक और अनुमानित कुल—दोनों पाठ-संभावनाएँ हैं।
lexical_decisions:
- source_word: ἐπέγνω
  choice: पहचान लिया
  rationale: यह क्रिया किसी की पहचान जान लेने या पहचान लेने को व्यक्त करती है; युद्ध के प्रसंग में यह स्वाभाविक और स्रोत के निकट है।
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: तीमुथियुस की छावनी
  rationale: παρεμβολή यहाँ सैनिक छावनी और सामूहिक रूप से उसमें उपस्थित सेना को सूचित करती है। आगे बहुवचन क्रिया के कारण छावनी के लोगों का अर्थ स्पष्ट रहता है।
- source_word: ὁ Μακκαβαῖός
  choice: मक्काबी
  rationale: यह यहूदा की प्रचलित उपाधि/नाम का देवनागरी रूप है; यूनानी निश्चित उपपद को हिंदी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: वे उसके सामने से भाग गए
  rationale: यह स्रोत की सामी शैली को बनाए रखते हुए आधुनिक हिंदी में स्पष्ट रूप से पलायन व्यक्त करता है।
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: उसने उन पर भारी प्रहार किया
  rationale: यह यूनानी प्रहार-वाचक मुहावरे को सुरक्षित रखता है और निर्णायक सैनिक आघात का भाव देता है, बिना उसे केवल ‘पराजय’ बनाकर व्याख्यायित किए।
- source_word: ἔπεσον
  choice: मारे गए
  rationale: युद्ध के प्रसंग में ‘गिरे’ का आशय मृत्यु है; ‘मारे गए’ साधारण आधुनिक हिंदी में उस अर्थ को स्पष्ट करता है।
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: लगभग आठ हज़ार पुरुष
  rationale: εἰς के साथ संख्या यहाँ उस संख्या तक पहुँचने वाला, संभवतः अनुमानित या पूर्णांकित कुल सूचित कर सकती है; मुख्य पाठ में ‘लगभग’ इस संभावना को दर्शाता है।
