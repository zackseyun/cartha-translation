  yaml_path: translation/deuterocanon/1_maccabees/005/014.yaml
  text: 'While the letters were still being read[a], behold, other messengers arrived from Galilee with their garments torn, reporting these words:'
translation:
  language: hi
  text: 'जब पत्र अभी पढ़े ही जा रहे थे, तभी देखो, गलील से और संदेशवाहक आए। वे अपने वस्त्र फाड़े हुए थे[a] और इन शब्दों में समाचार दे रहे थे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इसका अधिक शाब्दिक अनुवाद हो सकता है, “अपने वस्त्र फाड़कर।” यहाँ “संदेशवाहक” के लिए प्रयुक्त यूनानी शब्द मनुष्य दूतों को सूचित करता है, स्वर्गदूतों को नहीं; वस्त्र फाड़ना शोक या गहरे संकट का चिह्न था।
    reason: शाब्दिक विकल्प और सांस्कृतिक-शाब्दिक स्पष्टीकरण
lexical_decisions:
- source_word: Ἔτι … ἀνεγινώσκοντο
  choice: जब पत्र अभी पढ़े ही जा रहे थे
  rationale: ἔτι और अपूर्णकालीन कर्मवाच्य क्रिया जारी प्रक्रिया दिखाते हैं; यह हिंदी रचना उस समय नए संदेशवाहकों के पहुँचने तक पत्रों के पढ़े जाते रहने को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἰδοὺ
  choice: तभी देखो
  rationale: ‘देखो’ यूनानी पद की आकस्मिकता और कथात्मक ध्यानाकर्षण को बनाए रखता है; ‘तभी’ घटनाओं का समय-संबंध स्पष्ट करता है।
- source_word: ἄγγελοι ἕτεροι
  choice: कुछ और संदेशवाहक
  rationale: इस ऐतिहासिक प्रसंग में ἄγγελοι स्वर्गदूतों के बजाय समाचार लाने वाले मनुष्यों को सूचित करता है। ‘और’ उन्हें पहले आए संदेशवाहकों से अलग करता है। हिंदी में बहुवचन को सहज बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: गलील से … आए
  rationale: यह आगमन और उद्गम-स्थान दोनों को संक्षिप्त, स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: διερρηχότες τὰ ἱμάτια
  choice: वे अपने वस्त्र फाड़े हुए थे
  rationale: पूर्ण कृदंत आगमन के समय उनकी परिणामी अवस्था दिखाता है और साथ ही यह अर्थ खुला रखता है कि उन्होंने स्वयं वस्त्र फाड़े थे। ‘वस्त्र’ शोक अथवा संकट के औपचारिक सांस्कृतिक संकेत के अनुकूल है।
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: इन शब्दों में समाचार दे रहे थे
  rationale: यह कृदंत के जारी संप्रेषण और आगे आने वाले कथन की शब्दावली अथवा आशय—दोनों को स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ἄγγελοι का मानवीय या स्वर्गीय अर्थ
  choice: संदेशवाहक
  alternative: स्वर्गदूत
  rationale: गलील से आकर संकट का समाचार देने और वस्त्र फाड़ने का ऐतिहासिक संदर्भ स्पष्टतः मानवीय दूतों की ओर संकेत करता है; इसलिए स्वर्गीय अर्थ थोपना अनुचित होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक प्रभाव को सुरक्षित रखता है, जबकि ‘पत्र अभी पढ़े ही जा रहे थे’ जारी क्रिया को सामान्य पाठक के लिए स्पष्ट करता है।
