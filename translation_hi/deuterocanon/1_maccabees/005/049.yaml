lexical_decisions:
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने को व्यक्त करती है; ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
