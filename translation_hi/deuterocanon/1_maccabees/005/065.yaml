base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: hi
  text: तब यहूदा और उसके भाई निकल पड़े। उन्होंने दक्षिण की ओर के प्रदेश में एसाव के पुत्रों[a] से युद्ध किया। यहूदा ने हेब्रोन और उसके अधीन नगरों[b] पर आक्रमण किया; उसने उसके गढ़ को ढा दिया और चारों ओर स्थित उसके बुर्जों को जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् एदोमी; मूल में ‘एसाव के पुत्र’।
    reason: जातीय पहचान स्पष्ट करते हुए मूल अभिव्यक्ति को सुरक्षित रखना।
  - marker: b
    text: मूल में ‘उसकी पुत्रियाँ’; इसका अर्थ मुख्य नगर पर निर्भर छोटे नगर या बस्तियाँ हैं।
    reason: प्राचीन भौगोलिक मुहावरे की व्याख्या।
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकल पड़े
  rationale: यह सामान्य कथात्मक क्रिया है। ‘निकल पड़े’ प्रसंग में स्वाभाविक है और यूनानी पाठ से अधिक सैन्य अर्थ नहीं जोड़ता।
- source_word: ἐπολέμουν
  choice: युद्ध किया
  rationale: अपूर्ण भूतकाल चलती हुई कार्रवाई का संकेत दे सकता है, पर हिन्दी कथन में ‘युद्ध किया’ स्वाभाविक और पर्याप्त है।
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: एसाव के पुत्रों
  rationale: मूल यूनानी की रिश्तेदारी-सूचक अभिव्यक्ति और उसकी बाइबिलीय प्रतिध्वनि सुरक्षित रखी गई है; आशय एदोमियों से है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: दक्षिण की ओर के प्रदेश में
  rationale: यह यूनानी वाक्यांश ‘दक्षिण की ओर के देश/प्रदेश में’ का निकट और स्वाभाविक अनुवाद है; इसे अनावश्यक रूप से किसी विशिष्ट स्थान-नाम में नहीं बदला गया।
- source_word: ἐπάταξεν
  choice: आक्रमण किया
  rationale: सैन्य प्रसंग में πατάσσω की व्यापक अर्थ-सीमा को व्यक्त करता है और ‘पराजित किया’ जैसी परिणाम-सूचक बात नहीं जोड़ता। एकवचन क्रिया के अनुसार यहूदा को स्पष्ट कर्ता बनाया गया है।
- source_word: τὰς θυγατέρας αὐτῆς
  choice: उसके अधीन नगरों
  rationale: ‘उसकी बेटियाँ’ मुख्य नगर पर निर्भर छोटी बस्तियों का भौगोलिक मुहावरा है। ‘अधीन नगर’ आधुनिक हिन्दी में उसका अर्थ स्पष्ट करता है।
- source_word: τὸ ὀχύρωμα αὐτῆς
  choice: उसके गढ़
  rationale: ὀχύρωμα किसी दृढ़ रक्षात्मक संरचना या किलेबंदी को दर्शाता है; ‘गढ़’ संक्षिप्त, सहज और प्रसंगानुकूल है।
- source_word: καθεῖλεν
  choice: ढा दिया
  rationale: सैन्य प्रसंग में रक्षात्मक संरचना गिरा देने के लिए καθαιρέω का सजीव और स्वाभाविक अनुवाद।
- source_word: τοὺς πύργους αὐτῆς ἐνεπύρισεν κυκλόθεν
  choice: चारों ओर स्थित उसके बुर्जों को जला दिया
  rationale: यह बुर्जों को जलाने और κυκλόθεν के ‘चारों ओर’ भाव, दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: τοὺς υἱοὺς Ἠσαῦ में जातिनाम बनाम शाब्दिक वंश-सूचक अभिव्यक्ति
  choice: एसाव के पुत्रों
  alternative: एदोमियों / एसाव के वंशजों
  rationale: शाब्दिक अभिव्यक्ति यूनानी पाठ और इस्राएल-एदोम संबंध की बाइबिलीय प्रतिध्वनि को सुरक्षित रखती है। जातीय पहचान को पादटिप्पणी में दिया गया है, ताकि पाठ को चुपचाप अधिक व्याख्यात्मक न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए छोटे वाक्यों में बाँटा गया है। एकवचन सैन्य क्रियाओं में यहूदा को स्पष्ट कर्ता बनाया गया है, जबकि आरंभिक बहुवचन क्रिया यहूदा और उसके भाइयों के लिए रखी गई है।
