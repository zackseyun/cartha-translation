lexical_decisions:
- source_word: ὥστε
  choice: ताकि
  rationale: यहाँ यह शब्द पिछले पद में वर्णित सेना की चाल का उद्देश्य या अपेक्षित परिणाम बताता है; ‘ताकि’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: पर टूट पड़े
  rationale: इस पदबंध में किसी लक्ष्य के विरुद्ध बलपूर्वक चढ़ आने का सजीव सैन्य भाव है; ‘पर टूट पड़े’ साधारण ‘आक्रमण करे’ की अपेक्षा उस तीव्रता को बेहतर बनाए रखता है।
- source_word: παρεμβολή
  choice: छावनी
  rationale: सैन्य प्रसंग में यह सेना के पड़ाव या शिविर को दर्शाता है; ‘छावनी’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: πατάξαι
  choice: प्रहार करे
  rationale: क्रिया का मूल अर्थ मारना या प्रहार करना है, पर यह अपने आप में हत्या का परिणाम अनिवार्य नहीं करती; इसलिए ‘प्रहार करे’ उस अर्थ-सीमा को बनाए रखता है।
- source_word: ἄφνω
  choice: अचानक
  rationale: यह क्रिया-विशेषण सीधे तौर पर आकस्मिकता दर्शाता है; घात या आश्चर्य का अतिरिक्त भाव संदर्भ से समझ में आता है।
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: गढ़ के लोग
  rationale: शाब्दिक रूप ‘गढ़ के पुत्र’ है, पर यहाँ जैविक पुत्र नहीं बल्कि गढ़ से जुड़े लोगों का संकेत है। ‘गढ़ के लोग’ आधुनिक हिन्दी में स्वाभाविक है, जबकि शाब्दिक रूप और ‘अक्रा’ नाम को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἄκρα
  choice: गढ़
  rationale: यह यरूशलेम के किलेबंद दुर्ग को सूचित करता है। ‘गढ़’ सामान्य पाठक के लिए सहज है; यूनानी नाम ‘अक्रा’ पादटिप्पणी में दिया गया है।
- source_word: ὁδηγοί
  choice: मार्गदर्शक
  rationale: शब्द उन लोगों को दर्शाता है जो रास्ता दिखाकर आगे ले जाते हैं; आक्रमण के सैन्य प्रसंग में ‘मार्गदर्शक’ उपयुक्त है।
