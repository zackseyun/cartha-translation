  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: hi
  text: और उन्होंने वेदी पर धूप जलाई, दीपाधार पर रखे दीपकों को जलाया, और वे मंदिर[a] में चमक रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मंदिर’ से अधिक विशेष रूप से मंदिर का पवित्रस्थान अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: धूप जलाई
  rationale: θυμιάω विशेष रूप से धूप जलाने की क्रिया बताता है; यह सहज हिन्दी में अनुष्ठान की ठोस क्रिया बनाए रखता है।
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: वेदी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ वेदी की सतह पर की गई क्रिया दर्शाता है; ‘वेदी पर’ स्वाभाविक और सटीक है।
- source_word: ἐξῆψαν
  choice: जलाया
  rationale: यह क्रिया दीपकों को प्रज्वलित करने को व्यक्त करती है; आधुनिक हिन्दी में ‘जलाया’ सबसे सहज है।
- source_word: τοὺς λύχνους
  choice: दीपकों
  rationale: λύχνος ठोस रूप से दीपक को सूचित करता है, केवल अमूर्त प्रकाश को नहीं।
- source_word: τῆς λυχνίας
  choice: दीपाधार
  rationale: λυχνία दीपकों को थामने वाला आधार है; ‘दीपाधार’ अर्थ को पारदर्शी ढंग से व्यक्त करता है और अनावश्यक लिप्यंतरण से बचता है।
- source_word: ἐφαίνοντο
  choice: वे … प्रकाश देने लगे
  rationale: यह रूप दीपकों के मन्दिर में चमकने या प्रकाश देने की जारी अवस्था बताता है। हिन्दी में ‘प्रकाश देने लगे’ कर्ता को स्पष्ट रखते हुए प्रसंगानुकूल है।
- source_word: ἐν τῷ ναῷ
  choice: मन्दिर में
  rationale: ναός यहाँ मन्दिर, और अधिक विशिष्ट रूप से उसके पवित्रस्थान, को सूचित कर सकता है। मुख्य पाठ में ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है; विशिष्ट अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: मन्दिर के पुनःसमर्पण से जुड़ी उपासना-विधि की शब्दावली
  choice: धूप, वेदी, दीपाधार और मन्दिर जैसे ठोस अनुष्ठानिक शब्द बनाए रखे गए।
  alternative: इन्हें सामान्यीकृत उपासना-संबंधी भाषा में व्यक्त करना।
  rationale: पद विशिष्ट मन्दिर-क्रियाओं का वर्णन करता है; सामान्यीकृत भाषा ऐतिहासिक और अनुष्ठानिक ठोसपन को घटा देती।
- issue: ἐφαίνοντο का कर्ता और अर्थ
  choice: दीपकों को कर्ता मानकर ‘वे … प्रकाश देने लगे’।
  alternative: ‘वे चमकने लगे’ या रूप को ‘दिखाई देने लगे’ समझना।
  rationale: निकटतम बहुवचन संज्ञा ‘दीपक’ है और मन्दिर-प्रकाश के प्रसंग में प्रकाश देना स्वाभाविक अर्थ है; फिर भी मूल की अवस्थात्मकता को ‘लगे’ से बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल शैली। ‘दीपाधार’ मन्दिर-साजसज्जा की ठोस वस्तु को स्पष्ट करता है; ‘मन्दिर’ की संभावित अधिक विशिष्ट सीमा पाद-टिप्पणी में दी गई है।
