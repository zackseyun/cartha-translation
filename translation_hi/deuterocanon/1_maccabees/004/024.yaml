  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: hi
  text: और लौटकर उन्होंने भजन गाए और स्वर्ग की ओर स्तुति की:[a] “क्योंकि वह भला है; उसकी दया सदा बनी रहती है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ “स्वर्ग की ओर” है; यह परमेश्वर की ओर स्तुति करने का आदरपूर्ण ढंग है।
    reason: cultural_note
  - marker: b
    text: या, अधिक शाब्दिक रूप में, “क्योंकि यह अच्छा है; उसकी दया सदा बनी रहती है।” मुख्य पाठ स्तुति-सूत्र के सम्भावित व्यक्तिगत अर्थ को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: लौटकर
  rationale: 'अओरिस्ट कृदंत को प्रसंगानुसार पूर्वकालिक क्रिया के रूप में रखा गया है: वे लौटे और फिर स्तुति करने लगे। यह गंतव्य को अनावश्यक रूप से स्पष्ट नहीं करता।'
- source_word: ὕμνουν
  choice: भजन गाने
  rationale: ὑμνέω में संगीतमय और उपासना-संबंधी स्तुति का भाव है; ‘भजन गाने’ इसे सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ᾐνοῦν
  choice: स्तुति करने
  rationale: αἰνέω का सीधा अर्थ स्तुति करना है। इसे ὕμνουν से अलग रखकर यूनानी के दोनों समांतर क्रियापद सुरक्षित किए गए हैं।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग की ओर
  rationale: वाक्यांश का शाब्दिक दिशात्मक भाव ‘स्वर्ग की ओर’ है; यहाँ ‘स्वर्ग’ परमेश्वर के लिए आदरपूर्ण परोक्ष संकेत है।
- source_word: Ὅτι καλὸν
  choice: क्योंकि वह भला है
  rationale: καλόν व्याकरणतः निर्वैयक्तिक भी समझा जा सकता है, पर आगे ‘उसकी दया’ और स्तुति-सूत्र का संदर्भ व्यक्तिगत अर्थ, अर्थात परमेश्वर, को स्वाभाविक बनाता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा बनी रहती है
  rationale: स्तुति-सूत्र में यह दया की स्थायी निरंतरता व्यक्त करता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ रूप है।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: उसकी दया
  rationale: ἔλεος का सीधा और सामान्य हिन्दी समतुल्य ‘दया’ है; इसमें अनावश्यक रूप से कोई विशिष्ट वाचा-संबंधी अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: स्तुति-सूत्र में καλόν का निहित कर्ता
  choice: ‘वह भला है’—इसे परमेश्वर के व्यक्तिगत संदर्भ में प्रस्तुत किया गया है।
  alternative: ‘यह भला है’ या अधिक शाब्दिक रूप से ‘क्योंकि भला है।’
  rationale: यह कथन बाइबिल के परिचित धन्यवाद-सूत्र की प्रतिध्वनि है और ‘उसकी दया’ व्यक्तिगत संदर्भ का समर्थन करता है। फिर भी यूनानी की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ‘स्वर्ग’ को संबोधित स्तुति
  choice: मुख्य पाठ में ‘स्वर्ग की ओर’ रखा गया है।
  alternative: अर्थ स्पष्ट करने के लिए सीधे ‘परमेश्वर की स्तुति’ कहना।
  rationale: यूनानी में θεός नहीं बल्कि οὐρανός है। मूल की आदरपूर्ण परोक्ष अभिव्यक्ति को बनाए रखना, परमेश्वर को स्पष्ट रूप से जोड़ देने से अधिक स्रोत-निष्ठ है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भजन गाने’ और ‘स्तुति करने’ से यूनानी के दो अलग क्रियापदों का भेद बना रहता है। मुख्य पाठ में स्पष्टता के साथ लिटर्जिकल लय रखी गई है, जबकि वास्तविक स्रोतगत अस्पष्टता पादटिप्पणी में दी गई है।
