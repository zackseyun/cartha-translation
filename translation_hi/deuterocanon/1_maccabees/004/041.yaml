  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: hi
  text: तब यहूदा ने पुरुषों को गढ़[a] में रहने वालों से तब तक लड़ने की आज्ञा दी, जब तक वह पवित्र स्थान को शुद्ध न कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अक्रा में रहने वालों”; अक्रा यरूशलेम का किलाबंद गढ़ था।
    reason: ‘गढ़’ के पीछे संभवतः यरूशलेम के विशिष्ट दुर्ग अक्रा का अभिप्राय है; वैकल्पिक ऐतिहासिक-भौगोलिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने को व्यक्त करती है; ‘आज्ञा दी’ आधुनिक और गरिमापूर्ण हिन्दी में उसका बल बनाए रखती है।
- source_word: ἀνδράσιν
  choice: कुछ पुरुषों को
  rationale: यूनानी में शाब्दिक अर्थ ‘पुरुषों को’ है। प्रसंग सैनिकों का संकेत देता है, पर मूल में ‘सैनिक’ स्पष्ट नहीं है; हिन्दी में अनिश्चित समूह का स्वाभाविक बोध देने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: πολεμεῖν
  choice: लड़ने
  rationale: यह आज्ञा के अंतर्गत किए जानेवाले सैन्य संघर्ष को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: गढ़ में रहनेवालों से
  rationale: ἄκρα का अर्थ दुर्ग या गढ़ हो सकता है और यहाँ संभवतः यरूशलेम का विशिष्ट किलाबंद गढ़ ‘अक्रा’ अभिप्रेत है। मुख्य पाठ में ‘गढ़’ पठनीय है और तकनीकी नाम पादटिप्पणी में सुरक्षित है।
- source_word: ἕως
  choice: जब तक
  rationale: यह लड़ाई की समय-सीमा अथवा लक्ष्य-बिंदु बताता है।
- source_word: καθαρίσῃ
  choice: वह ... शुद्ध न कर ले
  rationale: ἕως के बाद एकवचन एओरिस्ट सब्जंक्टिव उस अपेक्षित पूर्णता को दर्शाता है जिस तक लड़ाई जारी रहनी थी। स्वाभाविक निकटतम कर्ता यहूदा है; हिन्दी की ‘जब तक ... न कर ले’ संरचना अपेक्षित समापन को ठीक व्यक्त करती है।
- source_word: τὰ ἅγια
  choice: पवित्रस्थान
  rationale: मंदिर के इस प्रसंग में बहुवचन रूप पवित्र मंदिर-क्षेत्र अथवा पवित्रस्थान को सूचित करता है, न कि केवल अमूर्त ‘पवित्र वस्तुओं’ को।
theological_decisions:
- issue: ἄκρα का अभिप्राय
  choice: मुख्य पाठ में वर्णनात्मक रूप से ‘गढ़’, और पादटिप्पणी में ‘अक्रा’
  alternative: ‘अक्रा’ अथवा ‘दुर्ग’
  rationale: यह मुख्यतः ऐतिहासिक-भौगोलिक प्रश्न है। यूनानी में निश्चित उपपद के साथ सामान्य संज्ञा है, पर मक्काबियों के प्रसंग में इससे संभवतः यरूशलेम का वह विशिष्ट किलाबंद गढ़ अभिप्रेत है जिसे अक्रा कहा जाता था।
- issue: καθαρίσῃ का कर्ता
  choice: यहूदा—‘जब तक वह ... शुद्ध न कर ले’
  alternative: अनिर्दिष्ट कर्ता अथवा कर्मवाच्य—‘जब तक पवित्रस्थान शुद्ध न हो जाए’
  rationale: क्रिया एकवचन कर्तृवाच्य है और निकटतम स्वाभाविक कर्ता यहूदा है। अनिर्दिष्ट या कर्मवाच्य अनुवाद मूल की व्याकरणिक दिशा को धुंधला कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘रहनेवालों’ को प्रचलित संयुक्त वर्तनी में रखा गया है। मूल की सैन्य पृष्ठभूमि को बनाए रखते हुए ‘सैनिक’ जैसा अधिक स्पष्ट शब्द नहीं जोड़ा गया।
