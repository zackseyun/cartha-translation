lexical_decisions:
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: सैन्य संदर्भ में यूनानी शब्द का स्वाभाविक और सटीक हिन्दी अर्थ।
- source_word: νυκτός
  choice: रात को
  rationale: समयसूचक संबंध को सरल, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐζήτει
  choice: खोज करने लगा
  rationale: अपूर्ण भूतकाल में चल रही खोज को प्रसंगानुकूल हिन्दी में दर्शाता है।
- source_word: ἐν τοῖς ὄρεσιν
  choice: पहाड़ों में
  rationale: बहुवचन और स्थानसूचक अर्थ दोनों सुरक्षित रखे गए हैं।
- source_word: Φεύγουσιν
  choice: भाग रहे हैं
  rationale: वर्तमानकालीन क्रिया की गतिशीलता और गोरगियास की तत्काल धारणा को बनाए रखता है।
