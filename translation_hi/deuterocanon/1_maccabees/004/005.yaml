  text: और रात को गोरगियास यहूदा की छावनी में आया, और उसे कोई नहीं मिला। वह पहाड़ों में उन्हें खोज रहा था, क्योंकि उसने कहा, “ये लोग हमसे भाग रहे हैं।”
