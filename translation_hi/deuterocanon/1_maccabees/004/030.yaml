base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your servant David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: hi
  text: जब उसने छावनी को शक्तिशाली देखा, तो उसने प्रार्थना की और कहा, “इस्राएल के उद्धारकर्ता, आप धन्य हैं! आपने अपने दास दाऊद[a] के हाथ से उस बलवान के आक्रमण को चूर कर दिया और परदेशियों की छावनी को शाऊल के पुत्र योनातान और योनातान के शस्त्र उठानेवाले के हाथों में सौंप दिया।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सेवक दाऊद’। यूनानी शब्द δοῦλος संदर्भ के अनुसार ‘दास’ या ‘सेवक’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह प्रार्थना दाऊद और गोलियत की कथा तथा योनातान और उसके शस्त्र उठानेवाले के युद्ध की ओर संकेत करती है; पर यूनानी पाठ यहाँ नाम लेने के बजाय ‘उस बलवान’ और ‘परदेशियों’ कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: छावनी
  rationale: सैनिक संदर्भ में यह शब्द शिविर अथवा वहाँ डेरा डाले सैन्यदल को सूचित करता है; ‘छावनी’ दोनों अर्थों के लिए स्वाभाविक है।
- source_word: ἰσχυράν
  choice: शक्तिशाली
  rationale: यह शत्रु की छावनी की सैन्य शक्ति बताता है; ‘शक्तिशाली’ मूल के सीधे अर्थ को बनाए रखता है।
- source_word: σωτήρ
  choice: उद्धारकर्ता
  rationale: परमेश्वर को संबोधित इस उपाधि का धार्मिक भार और बचानेवाले का भाव स्पष्ट रूप से व्यक्त होता है।
- source_word: συντρίψας
  choice: चूर कर दिया
  rationale: क्रिया निर्णायक और प्रबल पराजय का चित्र देती है; यह हिंदी प्रयोग उस तीव्रता को बनाए रखता है।
- source_word: ὅρμημα
  choice: धावा
  rationale: यह हिंसक झपट्टे या सैन्य आक्रमण को सूचित करता है; ‘धावा’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: τοῦ δυνατοῦ
  choice: उस बलवान
  rationale: संज्ञा के रूप में प्रयुक्त एकवचन विशेषण किसी विशिष्ट शक्तिशाली व्यक्ति की ओर संकेत करता है, पर मूल उसे नाम से नहीं पहचानता।
- source_word: ἐν χειρὶ
  choice: के हाथ से
  rationale: यह साधन अथवा कर्तृत्व बतानेवाला बाइबिलीय मुहावरा है और हिंदी में भी स्वाभाविक है।
- source_word: δούλου
  choice: दास
  rationale: यह शब्द अधीनता और स्वामित्व का प्रबल भाव रखता है; परमेश्वर से दाऊद के संबंध में ‘दास’ गरिमापूर्ण तथा पारंपरिक हिंदी है, जबकि ‘सेवक’ संभावित अर्थ के रूप में टिप्पणी में दिया गया है।
- source_word: ἀλλοφύλων
  choice: परदेशियों
  rationale: मूल शब्द दूसरे लोगों अथवा विदेशियों को कहता है। प्रसंग पलिश्तियों की ओर संकेत करता है, पर उन्हें नाम से जोड़ना मूल से अधिक स्पष्ट करना होगा।
- source_word: αἰρόντος τὰ σκεύη αὐτοῦ
  choice: उसके शस्त्र उठानेवाले
  rationale: वाक्यांश का शाब्दिक भाव उसके साज-सामान अथवा हथियार उठानेवाले व्यक्ति का है; यह रूप सहभागी संरचना और सैनिक अर्थ दोनों रखता है।
theological_decisions:
- issue: दाऊद के लिए δοῦλος का अनुवाद
  choice: अपने दास दाऊद
  alternative: अपने सेवक दाऊद
  rationale: ‘दास’ परमेश्वर के प्रति पूर्ण अधीनता और उससे संबंध का भाव बनाए रखता है; ‘सेवक’ अधिक सामान्य और सहज विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: संकेतित व्यक्तियों और जाति को नाम से स्पष्ट करना
  choice: ‘उस बलवान’ और ‘परदेशियों’ जैसे मूल के सामान्य पद बनाए रखना
  alternative: ‘गोलियत’ और ‘पलिश्तियों’ को मुख्य पाठ में नाम देना
  rationale: प्रार्थना दाऊद-गोलियत तथा योनातान के युद्ध-वृत्तांतों की ओर संकेत करती है, किंतु यूनानी पाठ गोलियत या पलिश्तियों का नाम नहीं लेता; अस्पष्टता को बनाए रखना स्रोत के प्रति अधिक निष्ठावान है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थना के अनुरूप गरिमापूर्ण किंतु सहज रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। ‘धावा’, ‘छावनी’ और ‘शस्त्र उठानेवाला’ सैनिक संदर्भ को स्पष्ट रखते हैं, जबकि स्रोत में न दिए गए नाम मुख्य पाठ में नहीं जोड़े गए।
