  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘दीवट’, ‘होमबलि’, ‘वेदी’ और ‘पवित्रस्थान’ जैसे परिचित बाइबलीय शब्द उपासना-संदर्भ की सटीकता बनाए रखते हैं।
