  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: hi
  text: और उन्होंने नए पवित्र पात्र बनाए और दीवट, होमबलियों और धूप की वेदी[a], तथा मेज़ को पवित्रस्थान[b] के भीतर ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होमबलि की वेदी और धूप की वेदी।” यूनानी में “होमबलियों” और “धूप” दोनों एकवचन “वेदी” से जुड़े हैं, यद्यपि संदर्भ मंदिर की परिचित दो वेदियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पवित्रस्थान” से आशय मंदिर का पवित्र भवन है, पूरा मंदिर-परिसर नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: बनाए
  rationale: ποιέω यहाँ अपवित्र या नष्ट हो चुकी उपासना-सामग्री के स्थान पर नई वस्तुएँ बनाने के काम को बताता है; ‘बनाए’ सहज और सटीक है।
- source_word: τὰ σκεύη τὰ ἅγια καινά
  choice: पवित्र पात्र नए
  rationale: σκεύη मंदिर की पवित्र उपासना-सामग्री के लिए प्रयुक्त है। ‘पात्र’ इस संदर्भ में प्रचलित और समझने योग्य है, जबकि ‘नए’ καινά को सीधे व्यक्त करता है।
- source_word: τὴν λυχνίαν
  choice: दीवट
  rationale: λυχνία यहाँ साधारण दीपक नहीं, दीपों को धारण करने वाला मंदिर का दीवट है।
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: होमबलियों और धूप की वेदी
  rationale: यूनानी में ‘होमबलियों’ और ‘धूप’ दोनों संबंधकारक रूप में एकवचन ‘वेदी’ से जुड़े हैं। मुख्य पाठ उसी व्याकरणिक संक्षिप्तता को बनाए रखता है, जबकि संदर्भ में मंदिर की परिचित दो वेदियाँ अभिप्रेत हो सकती हैं।
- source_word: τὴν τράπεζαν
  choice: मेज़
  rationale: यूनानी केवल ‘मेज़’ कहता है; भेंट की रोटी का उल्लेख जोड़ना इस पद की स्पष्ट शब्दावली से आगे जाता।
- source_word: εἰς τὸν ναόν
  choice: पवित्रस्थान के भीतर
  rationale: ναός यहाँ पूरे मंदिर-परिसर के बजाय मंदिर के पवित्र भवन को सूचित करता है। ‘पवित्रस्थान’ इस भेद को स्वाभाविक हिन्दी में स्पष्ट करता है और ‘के भीतर’ εἰς की अंदर की ओर गति को व्यक्त करता है।
theological_decisions:
- issue: ‘वेदी’ के साथ होमबलियों और धूप का संबंध
  choice: यूनानी की एकवचन और समन्वित रचना को ‘होमबलियों और धूप की वेदी’ के रूप में बनाए रखा गया।
  alternative: ‘होमबलि की वेदी और धूप की वेदी’ लिखकर दो अलग वेदियों को स्पष्ट करना।
  rationale: ऐतिहासिक मंदिर-संदर्भ में दो वेदियाँ परिचित हैं, पर उपलब्ध यूनानी पाठ में ‘वेदी’ एक बार ही है और दोनों संज्ञाएँ उससे जुड़ी हैं। इसलिए अस्पष्टता को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में संभावित अर्थ बताया गया है।
- issue: मंदिर की मेज़ के निहित उपयोग को स्पष्ट करना
  choice: केवल ‘मेज़’ रखा गया।
  alternative: ‘भेंट की रोटी की मेज़’ कहना।
  rationale: पद में मेज़ का उपयोग स्पष्ट नहीं किया गया; विस्तार जोड़ने से मूल की संक्षिप्त सूची अनावश्यक रूप से व्याख्यात्मक हो जाती।
- issue: ναός का क्षेत्र
  choice: ‘पवित्रस्थान’ द्वारा मंदिर के पवित्र भवन का संकेत।
  alternative: ‘मंदिर’ कहना, जिसे पूरा मंदिर-परिसर भी समझा जा सकता है।
  rationale: सूचीबद्ध पवित्र साज-सामान और ναός की शब्दार्थ-सीमा यहाँ भीतरी मंदिर-भवन की ओर संकेत करते हैं।
