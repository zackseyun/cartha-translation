lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: मत डरो
  rationale: यह निषेधात्मक आज्ञा भय न करने का सीधा आदेश देती है; ‘मत डरो’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: τὸ πλῆθος αὐτῶν
  choice: उनकी बड़ी संख्या
  rationale: πλῆθος यहाँ शत्रु की संख्यात्मक अधिकता को दर्शाता है। ‘बड़ी संख्या’ आधुनिक हिन्दी में ‘बहुतायत’ की अपेक्षा अधिक सहज है।
- source_word: τὸ ὅρμημα αὐτῶν
  choice: उनके आक्रमण
  rationale: ὅρμημα हिंसक धावे, चढ़ाई या आक्रमण को सूचित कर सकता है। सैनिक प्रसंग में ‘आक्रमण’ स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: μὴ δειλωθῆτε
  choice: हिम्मत मत हारो
  rationale: यह रूप भयभीत हो जाने या साहस खो देने की ओर संकेत करता है। ‘हिम्मत मत हारो’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है और ‘कायर मत बनो’ जैसी नैतिक निंदा जोड़ने से बचता है।
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: अपने साथ के पुरुषों से
  rationale: ἀνδράσιν पुरुषों को निर्दिष्ट करता है और यहाँ सैनिक दल का प्रसंग है; यह पदबंध यूनानी की संरचना और आशय दोनों को बनाए रखता है।
