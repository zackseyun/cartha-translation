base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: hi
  text: और यहूदा, उसके भाइयों और इस्राएल की सारी सभा ने यह ठहराया कि वेदी के समर्पण के दिन हर वर्ष अपने नियत समयों पर, किसलेव महीने के पच्चीसवें दिन से आठ दिनों तक, हर्ष और आनन्द के साथ मनाए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησεν
  choice: यह ठहराया
  rationale: ἵνα-वाक्य के साथ यह क्रिया किसी सामुदायिक प्रथा को स्थापित करने या औपचारिक रूप से निर्धारित करने का भाव देती है। ‘यह ठहराया’ आधुनिक और गरिमापूर्ण हिन्दी में उस निर्णय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκκλησία
  choice: सभा
  rationale: यहाँ शब्द इस्राएल के एकत्र समुदाय के लिए है। ‘सभा’ मूल के सामुदायिक अर्थ को रखता है और बाद की कलीसियाई शब्दावली को अनावश्यक रूप से नहीं लाता।
- source_word: ἵνα ἄγωνται
  choice: मनाए जाएँ
  rationale: यह प्रयोग पर्व-दिवसों के नियमित पालन और उत्सव दोनों को सूचित करता है। प्रसंग में ‘मनाए जाएँ’ हिन्दी में स्वाभाविक है और आगे आए हर्ष तथा आनन्द के साथ संगत है।
- source_word: ἐγκαινισμοῦ
  choice: समर्पण
  rationale: वेदी को उपासना के लिए पुनः अर्पित किए जाने के प्रसंग में ‘समर्पण’ स्पष्ट और प्रचलित हिन्दी है; यह मूल संज्ञा के dedication भाव को व्यक्त करता है।
- source_word: τοῦ θυσιαστηρίου
  choice: वेदी के
  rationale: ‘वेदी’ θυσιαστήριον का स्वाभाविक हिन्दी समतुल्य है; ‘बलि की’ जोड़ना मूल से अधिक स्पष्टता देना होता।
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: अपने नियत समय पर
  rationale: यह पद त्योहार के निर्धारित कैलेंडरी समय की ओर संकेत करता है। ‘अपने नियत समय पर’ बहुवचन सर्वनाम का संबंध समर्पण के दिनों से बनाए रखता है।
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: हर वर्ष
  rationale: यूनानी मुहावरा वार्षिक पुनरावृत्ति बताता है। ‘हर वर्ष’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: ἡμέρας ὀκτώ
  choice: आठ दिन तक
  rationale: यह उत्सव की अवधि बताता है; हिन्दी में ‘आठ दिन तक’ उस कालावधि को सहज रूप से व्यक्त करता है।
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: पच्चीसवें दिन से आरम्भ करके
  rationale: ἀπό आरम्भ-बिंदु बताता है। ‘से आरम्भ करके’ आठ दिनों की गणना का शुरुआती दिन स्पष्ट करता है, बिना अर्थ बदले।
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: किसलेव महीने के
  rationale: Χασελεύ यहूदी महीने के नाम का यूनानी रूप है। आधुनिक हिन्दी में प्रचलित लिप्यंतरण ‘किसलेव’ पहचानने योग्य और स्रोत-संगत है।
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: हर्ष और आनन्द के साथ
  rationale: दोनों संज्ञाओं को अलग रखकर मूल की उत्सवी अभिव्यक्ति और आलंकारिक पूर्णता सुरक्षित रहती है।
theological_decisions:
- issue: पूर्व-ईसाई यहूदी संदर्भ में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मण्डली
  rationale: यह शब्द यहाँ एकत्र इस्राएली समुदाय को दर्शाता है, बाद की ईसाई संस्था को नहीं। ‘सभा’ अनैतिहासिक कलीसियाई अर्थ आरोपित किए बिना सामुदायिक भाव सुरक्षित रखता है।
- issue: ἐγκαινισμός का धार्मिक अर्थ
  choice: समर्पण
  alternative: पुनःसमर्पण
  rationale: ऐतिहासिक प्रसंग वेदी की पुनःस्थापना का है, पर यूनानी पद स्वयं सामान्यतः समर्पण कहता है। इसलिए मुख्य पाठ में ‘पुनः’ जोड़कर अर्थ को मूल से अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य में निर्णय, वार्षिक आवृत्ति, आठ दिनों की अवधि, आरम्भ-तिथि और उत्सवी भाव का क्रम मूल यूनानी के निकट रखा गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि ‘किसलेव’ हिन्दी में महीने के नाम का पर्याप्त स्पष्ट लिप्यंतरण है।
