base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: hi
  text: उस समय, अर्थात् उसी दिन जब अन्यजातियों ने उसे अपवित्र किया था, उसी दिन गीतों, वीणाओं, किन्नोरों[a] और झाँझों के साथ उसका पुनः समर्पण किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किन्नोरों’ से अनूदित यूनानी शब्द एक प्रकार के प्राचीन तारवाद्य को सूचित करता है; उसकी सटीक पहचान अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: जिस समय, ठीक उसी दिन
  rationale: दोहराए गए यूनानी काल-सूचकों को स्वाभाविक हिन्दी में रखते हुए निश्चित दिन के साथ सटीक मेल का बल सुरक्षित किया गया है।
- source_word: ἐβεβήλωσαν
  choice: अपवित्र किया था
  rationale: पवित्र वस्तु को लौकिक अथवा अशुद्ध ठहराने के भाव को आधुनिक धार्मिक हिन्दी में स्पष्ट रूप से व्यक्त करता है; पूर्वकालिक संबंध के लिए ‘था’ रखा गया है।
- source_word: αὐτό
  choice: उसे
  rationale: यूनानी पद सर्वनाम है; संदर्भ से अधिक विशिष्ट संज्ञा जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: τὰ ἔθνη
  choice: अन्यजातियों
  rationale: इस यहूदी आख्यान में यह पद गैर-यहूदी लोगों को सूचित करता है; ‘अन्यजातियाँ’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐνεκαινίσθη
  choice: उसका फिर से समर्पण किया गया
  rationale: मन्दिर-संबंधी संदर्भ में नवीकरण और पुनः समर्पण दोनों का भाव है; यह हिन्दी वाक्यांश उपासना की पुनर्स्थापना को स्पष्ट करता है।
- source_word: ᾠδαῖς
  choice: गीतों
  rationale: यूनानी शब्द सामान्यतः गीतों को सूचित करता है; ‘भजनों’ कहना मूल से अधिक विशिष्ट होता।
- source_word: κιθάραις
  choice: वीणाओं
  rationale: κιθάρα एक तारवाद्य है; हिन्दी में ‘वीणा’ सुबोध निकटतम सांस्कृतिक समतुल्य है और अगले वाद्य से भेद रखता है।
- source_word: κινύραις
  choice: सारंगियों
  rationale: यह एक प्राचीन तारवाद्य था जिसकी सटीक आधुनिक पहचान अनिश्चित है; ‘सारंगी’ पठनीय समतुल्य है, और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: κυμβάλοις
  choice: झाँझों
  rationale: धातु के टकराकर बजाए जाने वाले वाद्य के लिए स्वाभाविक और प्रचलित हिन्दी शब्द है।
theological_decisions:
- issue: अपवित्र किए गए पवित्र स्थान की उपासना-संबंधी पुनर्स्थापना
  choice: उसका फिर से समर्पण किया गया
  alternative: उसका नवीकरण किया गया
  rationale: ἐνεκαινίσθη इस संदर्भ में केवल मरम्मत या सामान्य नवीकरण नहीं, बल्कि पवित्र उपयोग के लिए पुनः समर्पण को सूचित करता है; फिर भी सर्वनाम ‘उसका’ रखकर पद में निहित संदर्भगत अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। कालगत पुनरुक्ति को बल सहित रखा गया है। ‘अन्यजातियों’ का प्रयोग संदर्भगत जातीय अर्थ के लिए किया गया है, न कि निंदात्मक अर्थ में। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
