  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: hi
  text: उन्हें कायरता दे, उनकी शक्ति से उपजा दुस्साहस गला दे, और उनके चकनाचूर होने पर वे डगमगा उठें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विनाश पर वे डगमगा उठें।” यूनानी शब्द का अर्थ ठोस रूप से चकनाचूर होना और अधिक सामान्य रूप से विनाश या बरबादी—दोनों हो सकता है।
    reason: संτριβή की ठोस और सामान्य अर्थ-छायाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: δὸς
  choice: दे
  rationale: δίδωμι के प्रत्यक्ष आज्ञार्थक रूप को प्रार्थना की संक्षिप्तता और प्रबलता सहित व्यक्त करता है।
- source_word: δειλίαν
  choice: कायरता
  rationale: यह सामान्य भय से अधिक बुज़दिली या हिम्मत टूटने का भाव रखता है; युद्ध-संदर्भ में ‘कायरता’ सटीक और सहज है।
- source_word: τῆξον
  choice: गला दे
  rationale: मूल क्रिया के ‘पिघला देना’ या ‘गलाकर क्षीण कर देना’ वाले सजीव रूपक को बनाए रखता है।
- source_word: θράσος ἰσχύος αὐτῶν
  choice: उनके बल का दुस्साहस
  rationale: जननवाची संबंध को बनाए रखते हुए शत्रु की आक्रामक निर्भीकता को व्यक्त करता है। ‘दुस्साहस’ संदर्भगत नकारात्मक छाया देता है, पर इसे केवल नैतिक दुष्टता तक सीमित नहीं करता।
- source_word: σαλευθήτωσαν
  choice: वे डगमगा उठें
  rationale: निष्क्रिय आज्ञार्थक का हिल जाने, अस्थिर होने या लड़खड़ाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ συντριβῇ αὐτῶν
  choice: अपने ही चकनाचूर होने से
  rationale: συντριβή के ठोस ‘टूटने/चूर होने’ के बिंब और αὐτῶν के आत्म-संबंधी आशय को बनाए रखता है; दत्तिव को कारण अथवा अवसर के रूप में ‘से’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: शत्रुओं के विरुद्ध प्रार्थना की कठोर भाषा
  choice: कायरता, साहस के गलने और चकनाचूर होकर डगमगाने की प्रत्यक्ष याचनाएँ यथावत रखी गई हैं।
  alternative: इसे केवल सामान्य पराजय या दुर्बलता की नरम भाषा में व्यक्त करना।
  rationale: यूनानी पाठ परमेश्वर से शत्रु सेना के विरुद्ध सीधे हस्तक्षेप की प्रार्थना करता है; आधुनिक संवेदनशीलता के लिए उसके धार्मिक और आलंकारिक तनाव को नरम करना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनात्मक स्वर रखा गया है। ‘गला दे’ तथा ‘चकनाचूर’ मूल के सजीव हिंसात्मक बिंबों को बनाए रखते हैं; वाक्य की तीन समानांतर याचनाएँ भी सुरक्षित हैं।
