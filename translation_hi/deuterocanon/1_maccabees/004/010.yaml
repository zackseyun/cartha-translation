  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: hi
  text: और अब हम स्वर्ग की ओर पुकारें; यदि वह हमसे प्रसन्न हो[a], तो वह हमारे पूर्वजों की वाचा को स्मरण करेगा और आज हमारे सामने इस छावनी को चकनाचूर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि वह हम पर कृपा करे” अथवा “यदि वह हमारे अनुकूल हो।” यूनानी में शाब्दिक रूप से “यदि वह हमें चाहे” है, जो अपने लोगों के प्रति उसकी अनुकूल इच्छा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βοήσωμεν
  choice: हम ... पुकारें
  rationale: यह प्रथम पुरुष बहुवचन का प्रोत्साहनसूचक रूप है। ‘पुकारें’ युद्ध-संकट में सहायता के लिए की गई व्याकुल विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग की ओर
  rationale: यूनानी अभिव्यक्ति को बनाए रखता है और उसे स्पष्ट रूप से ‘परमेश्वर से’ कहकर उसकी संकेतात्मकता को समाप्त नहीं करता।
- source_word: εἰ θελήσει ἡμᾶς
  choice: यदि वह हमसे प्रसन्न हो
  rationale: θέλω के साथ व्यक्ति कर्म के असामान्य प्रयोग का आशय यहाँ लोगों के प्रति अनुकूल इच्छा या प्रसन्नता है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है, जबकि शाब्दिक तनाव और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: μνησθήσεται
  choice: स्मरण करेगा
  rationale: यह वाचा-संबंधी भाषा को बनाए रखता है, जिसमें स्मरण करना आगे की क्रिया से जुड़ा है।
- source_word: διαθήκης πατέρων
  choice: हमारे पूर्वजों की वाचा
  rationale: πατέρων को समावेशी और वर्तमान मानक हिन्दी में ‘पूर्वजों’ से व्यक्त किया गया है; संबंधवाचक यूनानी रचना की संभावित अस्पष्टता बनी रहती है।
- source_word: συντρίψει
  choice: चकनाचूर कर देगा
  rationale: यह क्रिया के प्रबल, विनाशकारी सैन्य अर्थ को ‘तोड़ देगा’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: τὴν παρεμβολὴν ταύτην
  choice: इस छावनी
  rationale: παρεμβολή ‘छावनी’ या ‘सेना’ हो सकता है। ‘छावनी’ मूल के ठोस चित्र को सुरक्षित रखता है और प्रसंग में शत्रु-बल का संकेत देता है।
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: हमारे सामने
  rationale: यह यूनानी मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: शर्तवाचक वाक्य के बाद आने वाली एकवचन क्रियाओं का अंतर्निहित कर्ता
  choice: हिन्दी में ‘वह’ रखा गया, जिसका संकेत परमेश्वर की ओर है
  alternative: कर्ता को जहाँ सम्भव हो पूरी तरह अप्रकट छोड़ना
  rationale: पुकार ‘स्वर्ग की ओर’ है और आगे की एकवचन क्रियाएँ स्वाभाविक रूप से परमेश्वर को सूचित करती हैं। ‘वह’ स्पष्टता देता है, पर ‘स्वर्ग’ को सीधे ‘परमेश्वर’ में नहीं बदलता।
- issue: εἰ θελήσει ἡμᾶς का अर्थ
  choice: मुख्य पाठ में ‘यदि वह हमसे प्रसन्न हो’
  alternative: ‘यदि वह हमारे प्रति अनुकूल इच्छा रखे’ या अधिक शाब्दिक ‘यदि वह हमें चाहे’
  rationale: यूनानी में θέλω के साथ व्यक्ति सीधा कर्म है। शाब्दिक ‘हमें चाहे’ आधुनिक हिन्दी में भ्रामक हो सकता है; ‘हमसे प्रसन्न हो’ अनुकूल दिव्य मनोभाव व्यक्त करता है, और मूल की असामान्य बनावट पादटिप्पणी में दर्ज है।
- issue: διαθήκης πατέρων में संबंध
  choice: ‘हमारे पूर्वजों की वाचा’
  alternative: ‘हमारे पूर्वजों के साथ की गई वाचा’
  rationale: मूल संबंधवाचक पद स्पष्ट रूप से यह नहीं बताता कि वाचा पूर्वजों की है या उनके साथ की गई है। मुख्य पाठ अधिक औपचारिक रूप को रखता है और व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्ग की ओर’, ‘वाचा’ और ‘स्मरण करेगा’ मूल की बाइबिलीय तथा वाचा-संबंधी प्रतिध्वनि बनाए रखते हैं; ‘छावनी’ सैन्य दृश्य को ठोस बनाती है।
