  yaml_path: translation/deuterocanon/1_maccabees/004/009.yaml
  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
translation:
  language: hi
  text: याद करो कि हमारे पूर्वज लाल सागर में कैसे बचाए गए थे, जब फ़िरौन ने बल के साथ उनका पीछा किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνήσθητε
  choice: याद करो
  rationale: अओरिस्ट आज्ञार्थक सक्रिय रूप से स्मरण करने का आह्वान करता है; आधुनिक हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: ἐσώθησαν
  choice: बचाए गए थे
  rationale: σῴζω के कर्मवाच्य को बनाए रखता है और समुद्र पर हुए ऐतिहासिक उद्धार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पूर्वज
  rationale: यहाँ पदबंध इस्राएल की पिछली पीढ़ियों को सामूहिक रूप से दर्शाता है; 'पूर्वज' आधुनिक हिन्दी में सटीक और स्वाभाविक है, जबकि 'पिता' अनावश्यक रूप से प्रत्यक्ष जनकों का बोध करा सकता है।
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: लाल सागर में
  rationale: यूनानी बाइबिलीय प्रयोग में इस पदबंध का सामान्य अर्थ 'लाल सागर' है; ἐν को 'में' से निकटता से व्यक्त किया गया है।
- source_word: ἐδίωξεν
  choice: पीछा किया था
  rationale: सैनिक कथानक में διώκω का सामान्य अर्थ पीछा करना है; हिन्दी में यह सहज और स्पष्ट है।
- source_word: ἐν δυνάμει
  choice: अपनी सेना के साथ
  rationale: इस सैनिक प्रसंग में δύναμις संगठित सैन्य बल का संकेत दे सकता है। 'सेना के साथ' स्वाभाविक हिन्दी है और फ़िरौन के बलपूर्वक पीछा करने का आशय स्पष्ट करता है।
theological_decisions:
- issue: ऐतिहासिक छुटकारे के प्रसंग में उद्धार-संबंधी भाषा
  choice: बचाए गए थे
  alternative: छुड़ाए गए थे
  rationale: यह ऐतिहासिक बचाव को स्पष्ट रखता है और कर्मवाच्य को सुरक्षित रखता है, बिना बाद की किसी विशिष्ट उद्धारशास्त्रीय धारणा को आरोपित किए।
- issue: οἱ πατέρες ἡμῶν में पूर्वज-संबंधी भाषा
  choice: हमारे पूर्वज
  alternative: हमारे पुरखे
  rationale: यूनानी अभिव्यक्ति पूर्ववर्ती इस्राएली पीढ़ियों के लिए प्रचलित सामूहिक पद है। 'पूर्वज' उसके आशय को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है; 'पुरखे' अधिक बोलचाल का है।
- issue: ἐν δυνάμει में सैन्य बल का अर्थ
  choice: अपनी सेना के साथ
  alternative: बल के साथ
  rationale: प्रसंग फ़िरौन के सशस्त्र पीछा करने का है। 'सेना' संभावित सैन्य अर्थ को सामने रखती है, यद्यपि यूनानी पद सामान्यतः 'शक्ति/बल' भी दर्शा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी आज्ञा, गरिमापूर्ण कथात्मक शैली और सामान्य पाठक के लिए सहज शब्दावली।
