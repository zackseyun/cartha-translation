translation:
  language: hi
  text: और सारी छावनी इकट्ठी हुई, और वे सिय्योन पर्वत पर चढ़ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθη
  choice: इकट्ठी हुई
  rationale: यह συνάγω का एओरिस्ट कर्मवाच्य रूप है, जो यहाँ पूरे समूह के एकत्र होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: सारी छावनी
  rationale: सैन्य प्रसंग में παρεμβολή का अर्थ छावनी है; πᾶσα उसकी समग्रता पर बल देता है। हिंदी में स्त्रीलिंग 'सारी' और 'इकट्ठी हुई' इसी संज्ञा के अनुरूप हैं।
- source_word: ἀνέβησαν
  choice: चढ़ गए
  rationale: क्रिया ऊँचे स्थान की ओर जाने को बताती है। 'चढ़ गए' प्राकृतिक हिंदी है और इसमें अनावश्यक रूप से सैन्य कूच का भाव नहीं जोड़ा गया।
- source_word: εἰς ὄρος Σιών
  choice: सिय्योन पर्वत पर
  rationale: εἰς यहाँ गंतव्य की ओर गति दर्शाता है। 'सिय्योन पर्वत पर चढ़ गए' आधुनिक हिंदी में स्वाभाविक है और ὄρος को स्पष्ट रूप से बनाए रखता है।
