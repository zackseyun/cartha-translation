    text: मूल यूनानी में केवल “एक सौ अड़तालीसवाँ वर्ष” है; ऐतिहासिक रूप से यह सेल्यूसिड युग का वर्ष है।
    reason: cultural_note
lexical_decisions:
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: भोर को जल्दी उठे
  rationale: क्रिया ὤρθρισαν जल्दी उठने या तड़के सक्रिय होने का बोध कराती है, और τὸ πρωὶ सुबह का समय स्पष्ट करता है। यह अनुवाद यूनानी की समय-संबंधी पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: पच्चीसवें दिन
  rationale: यह महीने की पच्चीसवीं तारीख बताने की सामान्य यूनानी अभिव्यक्ति है।
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: नौवें महीने
  rationale: मूल के क्रमसूचक तारीख-सूत्र का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Χασελεὺ
  choice: किसलेव
  rationale: यह यहूदी महीने के नाम का प्रचलित आधुनिक हिन्दी लिप्यंतरण है; यूनानी रूप Χασελεὺ उसी महीने को सूचित करता है।
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: एक सौ अड़तालीसवाँ वर्ष
  rationale: मूल में युग का नाम दिए बिना केवल वर्ष-संख्या कही गई है; हिन्दी में इसे स्पष्ट ऐतिहासिक तारीख-सूत्र के रूप में रखा गया है।
theological_decisions:
- issue: वर्ष-गणना का युग
  choice: मुख्य पाठ में केवल ‘एक सौ अड़तालीसवाँ वर्ष’
  alternative: ‘सेल्यूकसी युग का एक सौ अड़तालीसवाँ वर्ष’
  rationale: यूनानी पाठ युग का नाम स्पष्ट रूप से नहीं देता। ऐतिहासिक पहचान उपयोगी है, पर उसे मुख्य पाठ में जोड़ने के बजाय टिप्पणी में रखा गया है, ताकि मूल की अभिव्यक्ति सुरक्षित रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ऐतिहासिक वर्णन। ‘किसलेव’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला महीना-नाम है। वाक्य-विन्यास को स्वाभाविक रखने के लिए तारीख पहले और वर्ष अलग वाक्य में दिया गया है।
