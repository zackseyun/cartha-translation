  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
translation:
  language: hi
  text: वे एक सौ अड़तालीसवें वर्ष में, नौवें महीने, अर्थात किसलेव, के पच्चीसवें दिन भोर में जल्दी उठे।[a]
  philosophy: optimal-equivalence
  footnotes:
