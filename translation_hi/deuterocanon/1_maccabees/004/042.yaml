  yaml_path: translation/deuterocanon/1_maccabees/004/042.yaml
  text: And he chose blameless priests[a], devoted to the law.
translation:
  language: hi
  text: और उसने ऐसे याजकों को चुना जो निर्दोष और व्यवस्था के प्रति समर्पित थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसे याजकों को चुना जो बिना किसी दोष के और व्यवस्था के लिए उत्सुक थे।” यूनानी शब्द दोष से रहित होने और उत्सुकतापूर्वक प्रतिबद्ध रहने—दोनों भावों पर बल दे सकते हैं।
    reason: ἀμώμους और θελητὰς की वास्तविक अर्थ-सीमा तथा याजकीय प्रसंग में नैतिक और अनुष्ठानिक दोनों सम्भावनाएँ सुरक्षित रखना।
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: ἐπιλέγω का यह रूप सोच-समझकर चयन करने की क्रिया बताता है; ‘चुना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: ἱερεῖς
  choice: याजकों
  rationale: मन्दिर और यहूदी उपासना के प्रसंग में ἱερεύς के लिए ‘याजक’ मानक और स्पष्ट शब्द है।
- source_word: ἀμώμους
  choice: निर्दोष
  rationale: ἀμώμος दोष या कलंक से रहित होने को दर्शा सकता है। ‘निर्दोष’ नैतिक निष्कलंकता और सेवा के योग्य होने—दोनों भावों के लिए जगह रखता है।
- source_word: θελητὰς
  choice: के प्रति समर्पित
  rationale: θελητής इच्छा रखने या तत्पर होने वाले व्यक्ति को दर्शाता है। νόμου के साथ ‘के प्रति समर्पित’ सक्रिय निष्ठा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: इस साहित्यिक और ऐतिहासिक प्रसंग में νόμος सामान्य कानून नहीं, यहूदी पैतृक व्यवस्था अर्थात तोराह को सूचित करता है; ‘व्यवस्था’ उस विशिष्ट अर्थ को बनाए रखती है।
theological_decisions:
- issue: νόμου को सामान्य ‘कानून’ समझा जाए या इस्राएल की विशिष्ट ‘व्यवस्था’
  choice: व्यवस्था
  alternative: कानून
  rationale: 1 मक्काबियों में νόμος सामान्यतः पैतृक यहूदी व्यवस्था को सूचित करता है। ‘व्यवस्था’ इस वाचाई और धार्मिक संदर्भ को व्यक्त करती है, बिना अतिरिक्त व्याख्या जोड़े।
- issue: ἀμώμους का नैतिक अर्थ प्रमुख माना जाए या शारीरिक/अनुष्ठानिक निष्कलंकता
  choice: निर्दोष
  alternative: बिना किसी दोष के
  rationale: याजकों के प्रसंग में यूनानी शब्द दोनों अर्थछायाएँ रख सकता है। मुख्य पाठ में ‘निर्दोष’ स्वाभाविक है, जबकि पादटिप्पणी अनुष्ठानिक या शारीरिक दोषरहितता की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज पर गरिमापूर्ण रखी गई है। वाक्य में ‘ऐसे...जो’ संरचना हिन्दी में विशेषणों का सम्बन्ध याजकों से स्पष्ट करती है।
