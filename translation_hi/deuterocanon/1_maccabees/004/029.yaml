    text: यूनानी Βηθορούς; इस रूप को परंपरागत रूप से ‘बेत-होरोन’ भी समझा और अनूदित किया गया है।
    reason: भौगोलिक नाम की पाठगत/पहचान-संबंधी अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἦλθον εἰς
  choice: में आए
  rationale: यह सरल आख्यानात्मक गति और किसी क्षेत्र में प्रवेश—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना दिशा को अनावश्यक रूप से अधिक निश्चित किए।
- source_word: τὴν Ἰδουμαίαν
  choice: इदूमिया
  rationale: यह यूनानी युग के क्षेत्रीय नाम Ἰδουμαία का लिप्यंतरण है; इसे पुराने जातीय-भौगोलिक नाम ‘एदोम’ में बदलना उचित नहीं।
- source_word: παρεμβάλον
  choice: पड़ाव डाला
  rationale: सैन्य संदर्भ में क्रिया शिविर स्थापित करने को सूचित करती है; ‘पड़ाव डाला’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: ἐν Βηθορούς
  choice: बेत-सूर
  rationale: इस पद के भौगोलिक संदर्भ और पांडुलिपीय यूनानी रूप Βηθορούς के सम्भावित प्रतिनिधित्व को देखते हुए मुख्य पाठ में बेत-सूर रखा गया है; वैकल्पिक पारंपरिक पहचान पादटिप्पणी में दी गई है।
- source_word: συνήντησεν αὐτοῖς
  choice: उनका सामना करने आया
  rationale: सैन्य प्रसंग में यह केवल आकस्मिक भेंट नहीं, विरोधी सेना से आमना-सामना करने की गति व्यक्त करता है; फिर भी युद्ध आरम्भ होने की बात नहीं जोड़ी गई।
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: दस हज़ार पुरुषों के साथ
  rationale: ἐν यहाँ साथ आई सैन्य शक्ति को दर्शाता है और ἀνδρῶν का सीधा अर्थ ‘पुरुषों’ है; ‘सैनिकों’ कहने से निहितार्थ को पाठ में स्पष्ट रूप से जोड़ दिया जाता।
