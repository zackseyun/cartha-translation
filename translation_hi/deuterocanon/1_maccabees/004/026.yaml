lexical_decisions:
- source_word: ἀλλοφύλων
  choice: परदेशियों
  rationale: इस प्रसंग में यह शब्द यहूदी पक्ष से विरोधी गैर-यहूदी सेनाओं के लोगों को सूचित करता है; ‘परदेशी’ मूल के बाहरी-समुदाय संबंधी भाव को सहज हिन्दी में बनाए रखता है।
- source_word: διεσώθησαν
  choice: बच निकले थे
  rationale: क्रिया का अर्थ संकट या पराजय से सुरक्षित निकल आने वालों से है; ‘बच निकले’ युद्ध के संदर्भ में स्वाभाविक है।
- source_word: παραγενηθέντες
  choice: वहाँ पहुँचकर
  rationale: पूर्वकालिक कृदन्त मुख्य क्रिया से पहले पहुँचने को दर्शाता है; गंतव्य संदर्भ से लूसियास का स्थान है, इसलिए ‘वहाँ’ जोड़ा गया है।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: समाचार या घटना का विवरण देने के अर्थ को सामान्य, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ συμβεβηκότα
  choice: वह सब ... जो हुआ था
  rationale: घट चुकी समस्त घटनाओं का व्यापक अर्थ और पूर्णकालिक पक्ष सुरक्षित रहता है।
