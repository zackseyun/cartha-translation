translation:
  language: hi
  text: तब उन्होंने व्यवस्था के अनुसार साबुत पत्थर लिए[a] और पहले के समान एक नई वेदी बनाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनगढ़े पत्थर’; यूनानी में शाब्दिक अर्थ ‘साबुत/अखंड पत्थर’ है, जबकि ‘व्यवस्था के अनुसार’ वेदी के पत्थरों से संबंधित तोराह के निर्देशों की ओर संकेत करता जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जैसे पहले थी’; सम्भव अर्थ ‘पहले के नमूने के अनुसार’ भी है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: लिए
  rationale: यहाँ λαμβάνω की भूतकालिक क्रिया निर्माण-सामग्री के रूप में पत्थर लेने का ठोस कार्य बताती है; ‘लिए’ सीधा और स्वाभाविक है।
- source_word: λίθους ὁλοκλήρους
  choice: साबुत पत्थर
  rationale: ὁλόκληρος का मूल अर्थ ‘पूरा, अखंड, साबुत’ है। ‘साबुत पत्थर’ यूनानी शब्दावली के निकट रहता है और ‘अनगढ़े पत्थर’ की सम्भावित कानूनी व्याख्या को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: यह पदबंध विधि के अनुरूप होने को व्यक्त करता है। बाइबिलीय प्रसंग में ‘व्यवस्था’ तोराह के निर्देशों की ओर संकेत करती है।
- source_word: ᾠκοδόμησαν
  choice: बनाई
  rationale: οἰκοδομέω का अर्थ बनाना या निर्माण करना है। यूनानी पाठ केवल नई वेदी बनाने की बात कहता है, इसलिए ‘फिर से बनाई’ जैसी अतिरिक्त धारणा नहीं जोड़ी गई।
- source_word: θυσιαστήριον καινὸν
  choice: एक नई वेदी
  rationale: θυσιαστήριον के लिए प्रचलित हिन्दी शब्द ‘वेदी’ और καινός के लिए ‘नई’ स्पष्ट तथा स्वाभाविक हैं।
- source_word: κατὰ τὸ πρότερον
  choice: पहले के समान
  rationale: यह अभिव्यक्ति पहले की वस्तु या पूर्व रूप से समानता दिखा सकती है। ‘पहले के समान’ इस तुलनात्मक अर्थ को बनाए रखता है, बिना यह निश्चित किए कि संकेत केवल समय, रीति या पूर्व वेदी के नमूने की ओर है।
theological_decisions:
- issue: पत्थरों के वर्णन में तोराह की पृष्ठभूमि को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘साबुत पत्थर’ रखा गया और कानूनी संबंध ‘व्यवस्था के अनुसार’ से व्यक्त किया गया।
  alternative: मुख्य पाठ में ‘अनगढ़े पत्थर’ कहना।
  rationale: यूनानी विशेषण स्पष्टतः ‘साबुत/अखंड’ कहता है, जबकि अनगढ़े होने का भाव वेदी के पत्थरों से संबंधित तोराह के निर्देशों से निकाला जाता है। मुख्य पाठ स्रोत की शब्दगत अस्पष्टता बनाए रखता है और वैकल्पिक अर्थ पाद-टिप्पणी में देता है।
- issue: κατὰ τὸ πρότερον का संबंध पूर्व वेदी, पूर्व नमूने या पूर्व रीति से है
  choice: ‘पहले के समान’ रखा गया।
  alternative: ‘जैसे पहले थी’ या ‘पहले के नमूने के अनुसार’।
  rationale: यूनानी वाक्यांश संक्षिप्त है और संदर्भित पूर्व वस्तु या ढंग को पूरी तरह स्पष्ट नहीं करता। चुना हुआ अनुवाद उस खुलेपन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘व्यवस्था’ बाइबिलीय कानूनी संदर्भ को स्वाभाविक रूप से व्यक्त करती है; ‘साबुत’ सामान्य पाठक के लिए बोधगम्य रहते हुए यूनानी के मूल अर्थ के निकट है।
