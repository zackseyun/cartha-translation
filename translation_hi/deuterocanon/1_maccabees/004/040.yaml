    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: मुँह के बल भूमि पर गिर पड़े
  rationale: यह यूनानी मुहावरे की शारीरिक मुद्रा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘दण्डवत किया’ जैसी व्याख्यात्मक धार्मिक शब्दावली नहीं जोड़ी गई।
- source_word: ἐσάλπισαν
  choice: तुरहियाँ फूँकीं
  rationale: क्रिया का सीधा अर्थ तुरही फूँकना या बजाना है। हिन्दी में ‘तुरही फूँकना’ स्वाभाविक है और मूल क्रिया की ठोस क्रिया को बनाए रखता है।
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: संकेत देने वाली तुरहियाँ
  rationale: सम्बन्धकारक पद को तुरहियों के प्रयोजन के रूप में लेना प्रसंग में सबसे स्वाभाविक है। यूनानी पद की अधिक शाब्दिक और ध्वजों से जुड़ी सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: स्वर्ग की ओर पुकार उठे
  rationale: ‘पुकार उठे’ ऊँची और तीव्र पुकार को व्यक्त करता है, जबकि ‘स्वर्ग की ओर’ εἰς की दिशात्मकता और मूल की अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ‘स्वर्ग की ओर पुकारना’ को सीधे परमेश्वर को पुकारना बनाना
  choice: स्वर्ग की ओर पुकार उठे
  alternative: परमेश्वर को पुकार उठे
  rationale: मूल पाठ ‘स्वर्ग’ कहता है, ‘परमेश्वर’ नहीं। सम्भावित आशय स्पष्ट हो सकता है, फिर भी अनुवाद में मूल की परोक्ष अभिव्यक्ति और धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘भूमि’, ‘तुरही’ और ‘स्वर्ग’ जैसे प्रचलित बाइबिलीय शब्दों का प्रयोग किया गया है, पर वाक्य-विन्यास स्वाभाविक आधुनिक हिन्दी का है।
