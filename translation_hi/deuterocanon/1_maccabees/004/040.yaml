  text: और वे मुँह के बल भूमि पर गिर पड़े, उन्होंने संकेत देने वाली तुरहियाँ[a] फूँकीं और स्वर्ग की ओर पुकार उठे।
  philosophy: optimal-equivalence
  footnotes:
