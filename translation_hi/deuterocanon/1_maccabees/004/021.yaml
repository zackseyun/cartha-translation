- source_word: σφόδρα
  choice: बहुत
  rationale: यह तीव्रता-सूचक क्रियाविशेषण है; ‘बहुत’ सहज और स्पष्ट हिन्दी है।
- source_word: παρεμβολή
  choice: छावनी
  rationale: सैन्य प्रसंग में यह सेना की छावनी अथवा पड़ाव को सूचित करता है; ‘छावनी’ आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है।
- source_word: ἐν τῷ πεδίῳ
  choice: मैदान में
  rationale: πεδίον समतल खुले भूभाग को दर्शाता है; ‘मैदान में’ स्वाभाविक हिन्दी है और स्थान-सूचक अर्थ बनाए रखता है।
- source_word: ἑτοίμην
  choice: तैयार
  rationale: मूल विशेषण की तैयारी की अवस्था को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: εἰς παράταξιν
  choice: युद्ध के लिए पाँत बाँधे
  rationale: παράταξις केवल सामान्य युद्ध-तत्परता नहीं, बल्कि युद्ध-विन्यास में खड़े होने का सैन्य भाव रखता है। ‘पाँत बाँधे’ इस विशिष्टता को पठनीय हिन्दी में व्यक्त करता है।
