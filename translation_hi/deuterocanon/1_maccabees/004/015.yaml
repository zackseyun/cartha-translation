base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: hi
  text: परन्तु सबसे पीछे के सभी लोग तलवार से मारे गए। तब उन्होंने उनका पीछा गजारा[a] तक और यहूदिया, अज़ोतुस और याम्निया के मैदानों[b] तक किया; और उनमें से लगभग तीन हज़ार पुरुष[c] मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गजारा यूनानी स्थान-नाम है, जिसकी पहचान सामान्यतः गेजेर से की जाती है।
    reason: cross_reference
  - marker: b
    text: अज़ोतुस अशदोद का यूनानी नाम है; याम्निया की पहचान सामान्यतः यब्नेह या याव्ने से की जाती है।
    reason: cross_reference
  - marker: c
    text: या, “उनमें से कोई तीन हज़ार पुरुष मारे गए।” यूनानी वाक्य-रचना मारे गए लोगों की लगभग संख्या बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: परन्तु सबसे पीछे के सभी लोग
  rationale: ἔσχατοι का मूल अर्थ ‘सबसे पीछे के’ है। सैन्य प्रसंग में यह सेना के पिछले भाग के लोगों को सूचित करता है, पर ‘पिछला रक्षक-दल’ कहना यूनानी पाठ से अधिक विशिष्ट होता।
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: तलवार से मारे गए
  rationale: यह युद्ध में तलवार से मारे जाने का प्रचलित यूनानी मुहावरा है। हिन्दी में यह स्वाभाविक है और तलवार की मूल छवि बनाए रखता है।
- source_word: ἐδίωξαν αὐτούς
  choice: उन्होंने उनका पीछा ... किया
  rationale: ἐδίωξαν का यहाँ सीधा सैन्य अर्थ शत्रु का पीछा करना है।
- source_word: ἕως Γαζήρων
  choice: गजारा तक
  rationale: नाम को यूनानी रूप के निकट लिप्यंतरित किया गया है; इसकी प्रचलित पहचान गेजेर से पाद-टिप्पणी में बताई गई है।
- source_word: ἕως τῶν πεδίων τῆς Ἰουδαίας καὶ Ἀζώτου καὶ Ἰαννείας
  choice: यहूदिया, अज़ोतुस और याम्निया के मैदानों तक
  rationale: πεδίων को ‘मैदानों’ और उसके बाद आए संबंधकारक स्थान-नामों को उन मैदानों से जोड़कर प्रस्तुत किया गया है। इससे यूनानी वाक्य-संरचना और भौगोलिक विस्तार दोनों सुरक्षित रहते हैं।
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: उनमें से लगभग तीन हज़ार पुरुष मारे गए
  rationale: εἰς ἄνδρας के साथ संख्या यहाँ मारे गए लोगों की लगभग गिनती व्यक्त करती है। ‘पुरुष’ ἄνδρας को स्पष्ट रखता है, जबकि ‘लगभग’ इस यूनानी संख्यात्मक प्रयोग का भाव देता है।
