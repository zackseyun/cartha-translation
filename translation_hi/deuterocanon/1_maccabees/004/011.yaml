  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: hi
  text: और सब राष्ट्र जान लेंगे कि इस्राएल को छुड़ाने और बचानेवाला कोई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वही इस्राएल को छुड़ाने और बचानेवाला है।” यूनानी में कर्ता स्पष्ट रूप से नहीं दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσονται
  choice: जान लेंगे
  rationale: भविष्यकालीन रूप यहाँ किसी तथ्य को जान लेने या पहचान लेने का भाव देता है; ‘जान लेंगे’ स्वाभाविक हिन्दी में भविष्यसूचक बल बनाए रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्र
  rationale: यह पद सभी जातीय-राजनीतिक समुदायों की व्यापकता व्यक्त करता है; ‘राष्ट्र’ अनावश्यक रूप से इसे केवल ‘गैर-यहूदियों’ तक सीमित नहीं करता।
- source_word: ὅτι ἔστιν
  choice: कि ... कोई है
  rationale: यूनानी में स्पष्ट कर्ता नहीं है और रचना अस्तित्वसूचक समझी जा सकती है; हिन्दी में ‘कोई है’ इस अनिश्चितता को यथासंभव सुरक्षित रखता है।
- source_word: ὁ λυτρούμενος
  choice: छुड़ानेवाला
  rationale: संज्ञा के समान प्रयुक्त वर्तमान कृदन्त किसी की निरंतर या विशिष्ट भूमिका बताता है। ‘छुड़ानेवाला’ विमोचन का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σώζων
  choice: बचानेवाला
  rationale: यहाँ शब्द बचाने या उद्धार करने का अर्थ दे सकता है; ‘बचानेवाला’ सामान्य पाठक के लिए स्पष्ट है और ‘छुड़ानेवाला’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का सीधा रूप मूल की संक्षिप्तता और सामूहिक संदर्भ बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल को छुड़ाने और बचानेवाला’ कृदन्तीय पदबंध का निहित कर्ता
  choice: 'मुख्य पाठ में अस्तित्वसूचक रूप: ‘... कोई है’'
  alternative: ‘वही इस्राएल को छुड़ाने और बचानेवाला है’
  rationale: संदर्भ में संकेत परमेश्वर की ओर हो सकता है, पर यूनानी वाक्य में कर्ता स्पष्ट रूप से व्यक्त नहीं है। मुख्य पाठ उसे नामित या निश्चित किए बिना मूल की संयत अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘छुड़ानेवाला’ और ‘बचानेवाला’ को संयुक्त क्रियात्मक विशेषणों के रूप में रखा गया है; मुख्य पाठ में मूल यूनानी की कर्ता-संबंधी अस्पष्टता सुरक्षित है।
