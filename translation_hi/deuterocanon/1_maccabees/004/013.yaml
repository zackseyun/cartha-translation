lexical_decisions:
- source_word: ἐξῆλθαν
  choice: निकले
  rationale: यह क्रिया किसी स्थान के भीतर से बाहर जाने को सीधे व्यक्त करती है; सैन्य ढंग से ‘कूच किया’ कहना मूल से अधिक अर्थ जोड़ता।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: सैन्य प्रसंग में यह शब्द सेना के पड़ाव या कैंप का द्योतक है; ‘छावनी’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: εἰς πόλεμον
  choice: युद्ध करने
  rationale: यहाँ वाक्यांश तत्काल युद्ध में जाने का उद्देश्य व्यक्त करता है; ‘युद्ध करने’ आधुनिक हिन्दी में सहज है और व्यापक अर्थ वाले ‘युद्ध के लिए’ की अपेक्षा प्रसंग को स्पष्ट रखता है।
- source_word: ἐσάλπισαν
  choice: तुरहियाँ फूँकीं
  rationale: क्रिया का अर्थ तुरही बजाकर संकेत देना है। हिन्दी में वाद्य का उल्लेख आवश्यक है; बहुवचन कर्ता और सैन्य संकेत के प्रसंग में ‘तुरहियाँ’ उपयुक्त है।
- source_word: οἱ παρὰ Ἰούδου
  choice: यहूदा के साथ वालों
  rationale: यह पदबंध यहूदा के साथ उपस्थित समूह को बताता है। यह अनुवाद ‘यहूदा के सैनिकों’ जैसी औपचारिक अधीनता जोड़े बिना मूल की व्यापकता बनाए रखता है।
- source_word: Ἰούδου
  choice: यहूदा
  rationale: हिन्दी बाइबलीय परंपरा में इस नाम का स्वाभाविक रूप ‘यहूदा’ है; प्रसंग में यह यहूदा मकाबी है।
