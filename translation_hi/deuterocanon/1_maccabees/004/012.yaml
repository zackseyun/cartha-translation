- source_word: ἀλλόφυλοι
  choice: परदेशी
  rationale: यह शब्द दूसरे जातीय समुदाय के लोगों को दर्शाता है। यहाँ शत्रु सेना गैर-यहूदी है, पर विशेष रूप से पलिश्तियों का संकेत नहीं है; इसलिए “परदेशी” अर्थ को बिना अनावश्यक विशिष्टीकरण के बनाए रखता है।
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: आँखें उठाकर देखा
  rationale: यूनानी मुहावरे का आशय ऊपर या सामने दृष्टि करके देखने से है। यह हिन्दी में स्वाभाविक है और मूल की सजीव अभिव्यक्ति भी बनाए रखता है।
- source_word: ἶδαν
  choice: देखा
  rationale: सरल भूतकालीन क्रिया मूल यूनानी एओरिस्ट की सीधी कथात्मक शैली के अनुरूप है।
- source_word: ἐχομένους
  choice: मोर्चा बाँधे खड़े हैं
  rationale: सैन्य प्रसंग में यह कृदन्त किसी स्थान पर स्थित या युद्ध के लिए पंक्तिबद्ध होने को व्यक्त कर सकता है। “मोर्चा बाँधे खड़े” शिविर लगाने की अपेक्षा मूल की व्यापक स्थितिगत और सैन्य संभावना को बेहतर सुरक्षित रखता है।
- source_word: ἐξ ἐναντίας
  choice: उनके सामने
  rationale: यह वाक्यांश ठीक सामने या आमने-सामने स्थित होने का बोध देता है। “उनके सामने” आधुनिक हिन्दी में स्वाभाविक और स्थानगत रूप से स्पष्ट है।
