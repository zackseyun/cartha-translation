  text: And Judas and the force turned back from pursuing after them,
translation:
  language: hi
  text: तब यहूदा और उसकी सेना उनका पीछा करना छोड़कर लौट आए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौट आए
  rationale: यह क्रिया यहाँ युद्ध के दौरान दिशा बदलकर वापस लौटने को व्यक्त करती है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन आदरसूचक क्रिया स्वाभाविक है।
- source_word: ἡ δύναμις
  choice: उसकी सेना
  rationale: सैन्य आख्यान में δύναμις लड़ाकों के संगठित दल को सूचित करता है। हिन्दी में केवल ‘शक्ति’ अस्पष्ट होगी; ‘सेना’ प्रसंगानुकूल और सहज है। सम्बन्धसूचक ‘उसकी’ यह स्पष्ट करता है कि यह यहूदा के साथ की सेना है, बिना किसी अतिरिक्त सैन्य संस्थागत अर्थ पर बल दिए।
- source_word: ἀπὸ τοῦ διώκειν
  choice: पीछा करना छोड़कर
  rationale: ἀπό के साथ articular infinitive किसी जारी गतिविधि से हटने या उसे रोकने का भाव देता है। ‘पीछा करना छोड़कर’ इस अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ὀπίσθεν αὐτῶν
  choice: उनका पीछा
  rationale: पीछा किए जाने के प्रसंग में ὀπίσθεν αὐτῶν भागते हुए लोगों के पीछे लगे रहने को दर्शाता है। हिन्दी की क्रिया ‘पीछा करना’ में ‘पीछे’ का भाव पहले से निहित है, इसलिए अलग से ‘उनके पीछे’ जोड़ना अनावश्यक होगा।
