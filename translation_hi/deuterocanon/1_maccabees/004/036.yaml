  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: hi
  text: तब यहूदा और उसके भाइयों ने कहा, “देखो, हमारे शत्रु कुचल दिए गए हैं। आओ, हम ऊपर चलें और पवित्रस्थान को शुद्ध करके उसका समर्पण करें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: ने कहा
  rationale: कथात्मक यूनानी भूतकाल का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: इस यहूदी नाम का प्रचलित हिन्दी बाइबलीय रूप, जो मूल नाम के निकट है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाइयों
  rationale: प्रत्यक्ष पारिवारिक अर्थ को सहज और अनार्काइक हिन्दी में रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का स्वाभाविक आधुनिक हिन्दी समकक्ष।
- source_word: συνετρίβησαν
  choice: कुचल दिए गए हैं
  rationale: निर्णायक सैन्य पराजय और उसके वर्तमान परिणाम को व्यक्त करता है।
- source_word: ἀναβῶμεν
  choice: आओ, हम ऊपर चलकर
  rationale: प्रेरणार्थक संभावनार्थ को व्यक्त करते हुए यरूशलेम और मंदिर की ओर चढ़ने की दिशात्मकता बनाए रखता है।
- source_word: καθαρίσαι
  choice: शुद्ध करें
  rationale: केवल भौतिक सफाई नहीं, बल्कि धार्मिक और विधिपूर्वक शुद्धिकरण का भाव देता है।
- source_word: τὰ ἅγια
  choice: पवित्रस्थान
  rationale: इस मंदिर-संदर्भ में बहुवचन नपुंसकलिंग पद पवित्र मंदिर-क्षेत्र को सूचित करता है; हिन्दी में ‘पवित्रस्थान’ स्पष्ट और संक्षिप्त है।
- source_word: ἐγκαινίσαι
  choice: फिर से समर्पण करें
  rationale: क्रिया समर्पित या उद्घाटित करने का अर्थ रख सकती है; अपवित्र किए गए पहले से विद्यमान मंदिर के प्रसंग में नवीकृत समर्पण अभिप्रेत है।
theological_decisions:
- issue: τὰ ἅγια और καθαρίσαι का मंदिर-संबंधी अर्थ
  choice: पवित्रस्थान को शुद्ध करें
  alternative: पवित्र वस्तुओं को शुद्ध करें; पवित्रस्थान को साफ करें
  rationale: कथा का प्रसंग यरूशलेम के मंदिर को अपवित्रता से मुक्त करने का है। यह अनुवाद स्थानगत और धार्मिक दोनों अर्थों को स्पष्ट रखता है।
- issue: ἐγκαινίσαι में प्रथम समर्पण या नवीकृत समर्पण
  choice: उसका फिर से समर्पण करें
  alternative: उसका समर्पण करें; उसका उद्घाटन करें
  rationale: मूल क्रिया स्वयं ‘फिर से’ को अनिवार्यतः व्यक्त नहीं करती, पर पहले से समर्पित और बाद में अपवित्र किए गए मंदिर की पुनर्स्थापना का प्रसंग नवीकृत समर्पण को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘ऊपर चलकर’ ने मूल की आरोहण-संबंधी भाषा को बनाए रखा है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि संदर्भगत अर्थ मुख्य पाठ में स्वाभाविक रूप से व्यक्त है।
