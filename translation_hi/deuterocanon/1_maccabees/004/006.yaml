translation:
  language: hi
  text: पौ फटते ही यहूदा तीन हज़ार पुरुषों के साथ मैदान में दिखाई दिया; पर उनके पास मनचाहे कवच और तलवार नहीं थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅμα ἡμέρᾳ
  choice: पौ फटते ही
  rationale: यह पदबंध दिन निकलने या भोर होने का समय बताता है; यह हिन्दी में स्वाभाविक और सटीक अभिव्यक्ति है।
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: यूनानी निष्क्रिय रूप का सीधा अर्थ ‘दिखाई दिया/प्रकट हुआ’ है; इससे मैदान में उसके सामने आने का वर्णन बना रहता है।
- source_word: καλύμματα
  choice: कवच
  rationale: बहुवचन संज्ञा यहाँ युद्ध में शरीर की रक्षा करने वाले साज-सामान को सूचित करती है; ‘कवच’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: μάχαιραν
  choice: तलवारें
  rationale: यूनानी में एकवचन सामूहिक अर्थ में प्रयुक्त है और कर्ता बहुवचन है; हिन्दी में प्रत्येक सैनिक के हथियारों की कमी व्यक्त करने के लिए बहुवचन अधिक स्वाभाविक है।
- source_word: καθὼς ἠβούλοντο
  choice: मनचाहे
  rationale: इसमें ‘जैसा/जितना वे चाहते थे’ का भाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त होता है, बिना यह तय किए कि कमी प्रकार, गुणवत्ता या संख्या में थी।
