  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: hi
  text: और अगले वर्ष उसने साठ हज़ार चुने हुए पुरुषों और पाँच हज़ार घुड़सवारों को इकट्ठा किया, ताकि वह उनके विरुद्ध युद्ध करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: अगले वर्ष
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘आने वाले वर्ष में’ है; कथा-क्रम में ‘अगले वर्ष’ इसी कालगत संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: συνελόχησεν
  choice: इकट्ठा किया
  rationale: क्रिया यहाँ सैनिकों को एकत्र अथवा संगठित करने का बोध देती है। ‘इकट्ठा किया’ साधारण आधुनिक हिन्दी में स्पष्ट है और मूल से अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: चुने हुए पुरुषों
  rationale: ἐπίλεκτος विशेष रूप से चुने या चयनित लोगों को सूचित करता है। ‘चुने हुए पुरुषों’ मूल की अभिव्यक्ति और सैनिक संदर्भ दोनों को बनाए रखता है।
- source_word: ἑξήκοντα χιλιάδας
  choice: साठ हज़ार
  rationale: मूल संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πεντακισχιλίαν ἵππον
  choice: पाँच हज़ार घुड़सवारों
  rationale: ἵππος यहाँ सैन्य सामूहिक अर्थ में अश्वारोही सैनिकों के लिए प्रयुक्त है। हिन्दी में गिनती के साथ ‘घुड़सवारों’ कहना स्पष्ट और स्वाभाविक है।
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: ताकि वह उनके विरुद्ध युद्ध करे
  rationale: ὥστε के साथ infinitive यहाँ उद्देश्य अथवा अभिप्रेत परिणाम व्यक्त करता है, और ἐκπολεμέω किसी के विरुद्ध युद्ध छेड़ने या करने का अर्थ देता है। यह रूप उस सैन्य बल को सुरक्षित रखता है।
