base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: hi
  text: तब उन्हें यह अच्छा विचार सूझा कि वे उसे गिरा दें, कहीं ऐसा न हो कि वह उनके लिए कलंक का कारण बने, क्योंकि अन्य जातियों[a] ने उसे अशुद्ध कर दिया था। इसलिए उन्होंने वेदी को गिरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गैर-यहूदियों ने।” यूनानी पद τὰ ἔθνη का अर्थ “जातियाँ/राष्ट्र” भी हो सकता है और इस यहूदी सन्दर्भ में “गैर-यहूदी” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: उन्हें यह अच्छा विचार सूझा
  rationale: यूनानी मुहावरे का शाब्दिक रूप ‘उन पर एक अच्छी सम्मति पड़ी’ है। ‘अच्छा विचार सूझा’ विचार-विमर्श के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καθελεῖν / καθεῖλον
  choice: गिरा दें / गिरा दिया
  rationale: क्रिया वेदी को भौतिक रूप से ढहा देने को सूचित करती है। दोनों स्थानों पर ‘गिराना’ रखकर मूल की शब्दगत पुनरावृत्ति बनाए रखी गई है।
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: कहीं ऐसा न हो कि वह उनके लिए कलंक का कारण बने
  rationale: ‘कहीं ऐसा न हो’ μή ποτε की आशंका को और ‘कलंक’ ὄνειδος के सार्वजनिक लज्जा तथा निन्दा के भाव को व्यक्त करता है।
- source_word: ἐμίαναν
  choice: अशुद्ध कर दिया था
  rationale: वेदी के सन्दर्भ में μιαίνω धार्मिक या अनुष्ठानिक अशुद्धता बताता है; ‘अशुद्ध’ इसे केवल नुकसान या भावनात्मक अपमान तक सीमित नहीं करता।
- source_word: τὰ ἔθνη
  choice: अन्य जातियों
  rationale: यहूदियों के सन्दर्भ में यह पद दूसरे राष्ट्रों अथवा गैर-यहूदी लोगों को दर्शाता है। ‘अन्य जातियाँ’ मूल की व्यापकता को रखते हुए हिन्दी में स्वाभाविक है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὸ θυσιαστήριον
  choice: वेदी
  rationale: ‘वेदी’ बलिदान चढ़ाने के स्थान के लिए प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी शब्द है।
theological_decisions:
- issue: वेदी के लिए धार्मिक अशुद्धता की भाषा
  choice: अशुद्ध कर दिया था
  alternative: अपवित्र कर दिया था
  rationale: मूल क्रिया अनुष्ठानिक दूषण या अशुद्धता पर बल देती है। ‘अशुद्ध’ उस तनाव को बनाए रखता है, जबकि ‘अपवित्र’ अर्थ को मुख्यतः पवित्रता के उल्लंघन की दिशा में ले जा सकता है।
- issue: τὰ ἔθνη की पहचान
  choice: अन्य जातियाँ
  alternative: गैर-यहूदी
  rationale: मूल पद का सामान्य अर्थ ‘जातियाँ/राष्ट्र’ है, पर यह यहूदी सन्दर्भ में गैर-यहूदियों के लिए प्रयुक्त हो सकता है। मुख्य पाठ व्यापक पद रखता है और पादटिप्पणी सन्दर्भगत विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेदी’, ‘कलंक’ और ‘अशुद्ध’ बाइबलीय प्रसंग की गंभीरता रखते हैं, पर वाक्यरचना सामान्य आधुनिक हिन्दी की है।
