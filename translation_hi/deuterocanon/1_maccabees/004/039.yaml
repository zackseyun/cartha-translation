lexical_decisions:
- source_word: διέρρηξαν
  choice: फाड़े
  rationale: क्रिया का अर्थ चीरना या फाड़ना है; यहाँ यह शोक की प्रचलित क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: τὰ ἱμάτια
  choice: अपने वस्त्र
  rationale: ἱμάτια सामान्य रूप से पहने जाने वाले कपड़ों को सूचित करता है। ‘वस्त्र’ प्रसंग के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: बहुत विलाप किया
  rationale: सजातीय क्रिया और संज्ञा का यह यूनानी प्रयोग गहरे, प्रकट शोक को व्यक्त करता है। हिन्दी में ‘बहुत विलाप किया’ अर्थ को स्पष्ट रखता है और किसी अनुल्लिखित शारीरिक क्रिया को नहीं जोड़ता।
- source_word: σποδὸν
  choice: राख
  rationale: एकवचन सामूहिक संज्ञा यहाँ शोक के चिह्न के रूप में प्रयुक्त राख को दर्शाती है।
- source_word: ἐπέθεντο
  choice: डाली
  rationale: मूल क्रिया का अर्थ रखना या डालना है; सिर पर राख के साथ हिन्दी में ‘राख डाली’ सर्वाधिक स्वाभाविक है।
- source_word: ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: अपने सिरों पर
  rationale: यूनानी में ‘सिर’ एकवचन रूप में है, पर बहुवचन कर्ता के प्रत्येक व्यक्ति का सिर अभिप्रेत है; हिन्दी में वितरणात्मक अर्थ के लिए ‘सिरों’ स्वाभाविक है।
