translation:
  language: hi
  text: और उन्होंने पवित्रस्थान को शुद्ध किया और अशुद्धि के पत्थरों को उठाकर एक अशुद्ध स्थान पर ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: शुद्ध किया
  rationale: यह क्रिया यहाँ केवल भौतिक सफ़ाई नहीं, बल्कि उपासना-संबंधी शुद्धीकरण भी व्यक्त करती है; ‘शुद्ध किया’ दोनों आयामों को बनाए रखता है।
- source_word: τὰ ἅγια
  choice: पवित्रस्थान
  rationale: मंदिर के पुनःसमर्पण के इस संदर्भ में नपुंसकलिंग बहुवचन पवित्र परिसर अथवा पवित्रस्थान को सूचित करता है; ‘पवित्रस्थान’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἦραν
  choice: उठाकर ... ले गए
  rationale: ग्रीक क्रिया का मूल भाव उठाने या उठा लेने का है, और प्रसंग में पत्थरों को दूसरी जगह पहुँचाना शामिल है; संयुक्त हिंदी अभिव्यक्ति दोनों अर्थों को स्पष्ट रखती है।
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: अशुद्धि के पत्थरों
  rationale: संबंधकारक रचना को निकटता से रखते हुए यह उन पत्थरों को दर्शाता है जो वेदी के अपवित्रीकरण से जुड़े थे; अमूर्त संज्ञा उपासना-संबंधी अशुद्धि को बनाए रखती है।
- source_word: εἰς τόπον ἀκάθαρτον
  choice: एक अशुद्ध स्थान पर
  rationale: ‘अशुद्ध’ बाइबलीय शुद्धता-अशुद्धता की शब्दावली को बनाए रखता है और इसे केवल गंदे स्थान का भौतिक वर्णन नहीं बनने देता।
theological_decisions:
- issue: मंदिर की पुनर्स्थापना में उपासना-संबंधी शुद्धता की शब्दावली
  choice: ‘शुद्ध किया’, ‘अशुद्धि’ और ‘अशुद्ध स्थान’ द्वारा धार्मिक शुद्धता की भाषा को स्पष्ट रखा गया।
  alternative: ‘साफ़ किया’, ‘गंदे पत्थर’ और ‘गंदी जगह’ जैसी सामान्य भौतिक सफ़ाई की भाषा।
  rationale: मूल यूनानी पद मंदिर के अपवित्रीकरण और उसके धार्मिक शुद्धीकरण को व्यक्त करते हैं; सामान्य सफ़ाई की भाषा इस अर्थ-भार को कम कर देती।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और कथात्मक शैली। ‘पवित्रस्थान’ तथा ‘अशुद्ध’ बाइबलीय उपासना-संबंधी अर्थ को सहज रूप से बनाए रखते हैं।
