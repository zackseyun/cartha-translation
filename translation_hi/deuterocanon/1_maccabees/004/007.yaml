translation:
  language: hi
  text: और उन्होंने अन्यजातियों का एक शक्तिशाली, कवच से सुसज्जित पड़ाव देखा; घुड़सवार उसे चारों ओर से घेरे हुए थे, और वे युद्ध में प्रशिक्षित थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  choice: पड़ाव
  rationale: यह शब्द यहाँ सैनिक छावनी या सैन्य पड़ाव को दर्शाता है। ‘पड़ाव’ सामान्य आधुनिक हिन्दी में सहज है और सैन्य प्रसंग भी बनाए रखता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों का
  rationale: 1 मक्काबियों के प्रसंग में यह गैर-यहूदी लोगों को सूचित करता है। ‘अन्यजातियों’ इस ऐतिहासिक भेद को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἰσχυρὰν
  choice: शक्तिशाली
  rationale: यह पड़ाव में उपस्थित सैन्य शक्ति और उसके दुर्जेय स्वरूप को व्यक्त करता है, बिना अर्थ को ‘किलेबंद’ तक सीमित किए।
- source_word: τεθωρακισμένην
  choice: कवच से सुसज्जित
  rationale: पूर्ण कृदन्त का भाव कवच धारण किए या कवच से लैस होने का है। हिन्दी में यह वाक्यांश ‘कवचयुक्त’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἵππον
  choice: घुड़सवार
  rationale: एकवचन रूप यहाँ सामूहिक सैन्य अर्थ में प्रयुक्त है और अश्वारोही दल को सूचित करता है; ‘घुड़सवार’ आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: κυκλοῦσαν
  choice: चारों ओर से घेरे हुए थे
  rationale: यह पड़ाव के आसपास घुड़सवारों की स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διδακτοὶ πολέμου
  choice: युद्ध में प्रशिक्षित थे
  rationale: मूल वाक्यांश युद्ध-कला में शिक्षा या प्रशिक्षण पाए होने पर बल देता है; यह अनुवाद अनुभव की अपेक्षा प्रशिक्षण का भाव सुरक्षित रखता है।
