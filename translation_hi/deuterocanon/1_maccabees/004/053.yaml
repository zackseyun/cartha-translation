  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: hi
  text: और उन्होंने व्यवस्था के अनुसार होमबलियों की उस नई वेदी पर बलिदान चढ़ाया, जिसे उन्होंने बनाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘होमबलियों के लिए उस नई वेदी पर, जिसे उन्होंने बनाया था।’
    reason: τῶν ὁλοκαυτωμάτων का संबंधकारक वेदी की पहचान (‘होमबलियों की वेदी’) अथवा उसका प्रयोजन (‘होमबलियों के लिए वेदी’) व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: चढ़ाया
  rationale: बलिदान-संबंधी प्रसंग में ἀναφέρω का अर्थ वेदी पर बलिदान अर्पित करना है। ‘चढ़ाया’ आधुनिक हिन्दी में स्वाभाविक है और उपासना-संबंधी भाव बनाए रखता है।
- source_word: θυσίαν
  choice: बलिदान
  rationale: θυσία बलिदान अथवा बलि को सूचित करता है। यहाँ क्रिया के साथ ‘बलिदान चढ़ाया’ स्पष्ट और स्वाभाविक प्रयोग है।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: यह पदबंध विधि के अनुरूप कार्य किए जाने को व्यक्त करता है। ‘व्यवस्था’ यहाँ धार्मिक विधान के स्पष्ट संदर्भ को बनाए रखती है।
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: होमबलियों की वेदी
  rationale: ὁλοκαύτωμα उस बलि को दर्शाता है जो पूरी तरह जलाई जाती थी। ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में इस विशिष्ट बलिदान को संक्षेप और स्पष्टता से व्यक्त करता है; बहुवचन यूनानी रूप के अनुरूप है।
- source_word: τὸ καινόν
  choice: नई
  rationale: विशेषण वेदी को पुरानी और अशुद्ध की गई वेदी से अलग नई वेदी के रूप में चिह्नित करता है।
- source_word: ὃ ἐποίησαν
  choice: जिसे उन्होंने बनाया था
  rationale: ἐποίησαν यहाँ वेदी बनाने या निर्मित करने का संकेत देता है। ‘बनाया था’ बलिदान चढ़ाने से पहले पूर्ण हुए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन्दिर की बलिदान-संबंधी शब्दावली
  choice: ‘बलिदान चढ़ाया’ और ‘होमबलियों की वेदी’ जैसी स्पष्ट उपासना-संबंधी शब्दावली बनाए रखी गई।
  alternative: इसे सामान्य बनाकर ‘भेंट चढ़ाई’ या केवल ‘वेदी’ कहा जा सकता था।
  rationale: पद का विषय व्यवस्था के अनुसार मन्दिर के बलिदान की पुनर्स्थापना है; सामान्यीकृत भाषा इसके विधिक और याजकीय बल को कम कर देती।
- issue: τῶν ὁλοκαυτωμάτων संबंधकारक का अर्थ
  choice: ‘होमबलियों की वेदी’
  alternative: ‘होमबलियों के लिए वेदी’
  rationale: यूनानी संबंधकारक वेदी की प्रचलित पहचान भी बता सकता है और उसका प्रयोजन भी। मुख्य पाठ में औपचारिक पदबंध रखा गया है और प्रयोजनात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘व्यवस्था’, ‘होमबलि’ और ‘वेदी’ जैसे स्थापित बाइबलीय शब्द मूल के विधिक और उपासना-संबंधी स्वर को सुरक्षित रखते हैं।
