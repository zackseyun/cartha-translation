  yaml_path: translation/deuterocanon/1_maccabees/004/057.yaml
  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
translation:
  language: hi
  text: और उन्होंने मन्दिर के सामने के भाग को सोने के मुकुटों[a] और छोटी ढालों से सजाया। उन्होंने फाटकों और बगल की कोठरियों का जीर्णोद्धार किया और उनमें किवाड़ लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सोने के पुष्पहार’ अथवा ‘सोने की मालाएँ’; यूनानी शब्द στεφάνοις सजावटी पुष्पहारों या मालाओं के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: सजाया
  rationale: यह क्रिया अलंकरण द्वारा सुशोभित करने का भाव देती है; ‘सजाया’ सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: मन्दिर के सामने के भाग
  rationale: यूनानी पद मन्दिर के सामने या उसके मुखभाग को सूचित करता है; यह अनुवाद अर्थ को स्पष्ट रखता है और अनावश्यक तकनीकी वास्तुशब्द से बचता है।
- source_word: στεφάνοις χρυσοῖς
  choice: सोने के मुकुटों
  rationale: στέφανος का सीधा अर्थ मुकुट है, पर सजावटी सन्दर्भ में पुष्पहार या मालाएँ भी अभिप्रेत हो सकती हैं; उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ἀσπιδίσκαις
  choice: छोटी ढालों
  rationale: यह ἀσπίς का लघुतासूचक रूप है और सम्भवतः सजावटी या मन्नत की छोटी ढालों को दर्शाता है।
- source_word: ἐνεκαίνισαν
  choice: जीर्णोद्धार किया
  rationale: फाटकों और कोठरियों के सन्दर्भ में क्रिया का आशय उन्हें फिर से नया या दुरुस्त करना है, न कि अनिवार्यतः उनका धार्मिक पुनःसमर्पण करना।
- source_word: πύλας
  choice: फाटकों
  rationale: πύλαι बड़े प्रवेश-द्वारों या फाटकों को दर्शाता है; आगे किवाड़ लगाने का अलग उल्लेख होने के कारण यह भेद बनाए रखा गया है।
- source_word: παστοφόρια
  choice: बगल की कोठरियों
  rationale: यह पवित्रस्थान से लगी कोठरियों के लिए प्रयुक्त वास्तुशब्द है; उनके किसी विशिष्ट उपयोग को बिना प्रमाण निर्धारित नहीं किया गया।
- source_word: ἐθύρωσαν
  choice: किवाड़ लगाए
  rationale: क्रिया का अर्थ किसी संरचना को दरवाज़ों या किवाड़ों से युक्त करना है; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: αὐτά
  choice: उनमें
  rationale: नपुंसकलिंग बहुवचन सर्वनाम पूर्वोक्त फाटकों और कोठरियों को सामूहिक रूप से संदर्भित करता है; हिन्दी में ‘उनमें’ किवाड़ लगाए जाने का स्थान स्वाभाविक रूप से बताता है।
