lexical_decisions:
- source_word: ἔτι ... ὑποφθεγγομένου Ἰούδου
  choice: जब यहूदा अभी ... कह ही रहा था
  rationale: यह रचना चल रही क्रिया और उसी दौरान घटी अगली घटना का समय-संबंध व्यक्त करती है; ‘अभी ... कह ही रहा था’ आधुनिक हिन्दी में इस समकालिकता को स्वाभाविक रूप से रखता है।
- source_word: ὑποφθεγγομένου
  choice: धीमे स्वर में कह रहा था
  rationale: क्रिया दबे या धीमे स्वर में बोलने का भाव देती है। ‘बड़बड़ा रहा था’ शिकायत या अस्पष्ट वाणी का अनावश्यक भाव ला सकता है।
- source_word: Ἰούδου
  choice: यहूदा
  rationale: प्राचीन यहूदी नाम Ἰούδας का हिन्दी बाइबलीय रूप ‘यहूदा’ है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: यह संकेतवाचक पद यहूदा की पिछली बातों की ओर लौटता है; ‘ये बातें’ सहज और अर्थनिष्ठ है।
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: निष्क्रिय रूप यहाँ किसी वस्तु या समूह के दृष्टिगोचर होने का भाव देता है।
- source_word: μέρος τι
  choice: एक हिस्सा
  rationale: यूनानी का शाब्दिक और जानबूझकर अनिश्चित अर्थ सुरक्षित रखा गया है। युद्ध-संदर्भ में यह शत्रु-सेना का एक भाग हो सकता है, पर मूल पाठ उस संदर्भ को स्पष्ट नहीं करता।
- source_word: ἐκκύπτον
  choice: निकलता हुआ
  rationale: संदर्भ में यह पहाड़ की ओट से सामने आने या दृष्टिगोचर होने का संकेत देता है; ‘निकलता हुआ’ गति और प्रकट होने, दोनों को सहज रूप में व्यक्त करता है।
- source_word: ἐκ τοῦ ὄρους
  choice: पहाड़ से
  rationale: एकवचन ὄρος का सीधा और स्वाभाविक हिन्दी रूप ‘पहाड़’ है।
