  yaml_path: translation/deuterocanon/1_maccabees/004/048.yaml
  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: hi
  text: और उन्होंने पवित्रस्थान[a] और भवन के भीतरी भाग[b] को फिर से बनाया, और आँगनों को पवित्र किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र स्थान’; यूनानी τὰ ἅγια मंदिर के पवित्र क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भवन’ से अभिप्राय मंदिर की इमारत है।
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: फिर से बनाया
  rationale: οἰκοδομέω का मूल अर्थ ‘बनाना’ है; अपवित्र किए गए मंदिर की मरम्मत और पुनर्स्थापना के प्रसंग में ‘फिर से बनाया’ निर्माण-संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ ἅγια
  choice: पवित्रस्थान
  rationale: मंदिर-संदर्भ में यह बहुवचन रूप पवित्र क्षेत्र अथवा गर्भस्थान को सूचित कर सकता है। ‘पवित्रस्थान’ स्थानवाचक अर्थ बनाए रखता है और इसे पवित्र वस्तुओं के अर्थ में सीमित नहीं करता।
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: भवन के भीतरी भाग
  rationale: यह पदबंध भवन के भीतर के हिस्से या क्षेत्र को ठोस, स्थानवाचक रूप में बताता है। हिन्दी में ‘भीतरी भाग’ स्वाभाविक है।
- source_word: οἴκου
  choice: भवन
  rationale: οἶκος का शाब्दिक अर्थ ‘घर’ है, पर यहाँ संकेत मंदिर की इमारत से है। ‘भवन’ मूल रूपक को अत्यधिक अस्पष्ट बनाए बिना मंदिर की इमारत का भाव देता है।
- source_word: τὰς αὐλάς
  choice: आँगनों
  rationale: मंदिर की वास्तुकला में αὐλαί खुले प्रांगणों को दर्शाता है। साधारण आधुनिक हिन्दी में ‘आँगन’ स्पष्ट और स्वाभाविक है।
- source_word: ἡγίασαν
  choice: पवित्र किया
  rationale: ἁγιάζω यहाँ विधिपूर्वक पवित्र ठहराने या समर्पित करने का भाव रखता है। ‘पवित्र किया’ सहज हिन्दी है और धार्मिक क्रिया का अर्थ बनाए रखता है।
theological_decisions:
- issue: मंदिर के पवित्र क्षेत्रों के लिए शब्दावली
  choice: τὰ ἅγια को ‘पवित्रस्थान’ और τὰ ἐντὸς τοῦ οἴκου को ‘भवन के भीतरी भाग’ के रूप में अलग-अलग प्रस्तुत किया गया।
  alternative: τὰ ἅγια के लिए ‘पवित्र स्थान’ या ‘पवित्र वस्तुएँ’, और οἶκος के लिए सीधे ‘मंदिर’ कहा जा सकता है।
  rationale: वाक्य में मंदिर के अनेक स्थानों का क्रमिक उल्लेख है, इसलिए τὰ ἅγια का स्थानवाचक अर्थ अधिक उपयुक्त है। दोनों पदबंधों को अलग रखने से यूनानी पाठ का संभावित वास्तुगत भेद मिटता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’ बाइबलीय मंदिर-शब्दावली को बनाए रखता है, जबकि ‘भवन के भीतरी भाग’ और ‘आँगन’ वास्तुगत अर्थ को सहज हिन्दी में स्पष्ट करते हैं।
