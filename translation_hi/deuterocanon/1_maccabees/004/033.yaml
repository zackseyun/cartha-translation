translation:
  language: hi
  text: जो तुझसे प्रेम करते हैं, उनकी तलवार से उन्हें मार गिरा; और जो सब तेरा नाम जानते हैं, वे भजनों के साथ तेरी स्तुति करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: मार गिरा
  rationale: आज्ञार्थक क्रिया का प्रबल और स्वाभाविक हिन्दी रूप; युद्ध के संदर्भ में पराजित करके गिरा देने का भाव रखता है।
- source_word: ῥομφαίᾳ ἀγαπώντων σε
  choice: जो तुझसे प्रेम करते हैं, उनकी तलवार से
  rationale: यूनानी संबंधवाचक वाक्यांश और करण कारक को निकटता से सुरक्षित रखता है; 'से' साधन को व्यक्त करता है।
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: जितने तेरे नाम को जानते हैं
  rationale: नाम जानने की मूल अभिव्यक्ति को बिना अतिरिक्त धार्मिक व्याख्या के बनाए रखता है।
- source_word: ἐν ὕμνοις
  choice: भजनों के द्वारा
  rationale: स्तुतिगीतों के माध्यम से प्रशंसा करने का भाव स्पष्ट करता है और ἐν के साधनात्मक अर्थ को स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: परमेश्वर के लिए संबोधन का वचन और स्तर
  choice: तू/तेरा
  alternative: आप/आपका
  rationale: प्रार्थना और काव्यात्मक बाइबलीय शैली में निकट, प्रत्यक्ष संबोधन को बनाए रखता है; इसे अनादर के रूप में नहीं, पारंपरिक भक्तिपरक एकवचन के रूप में लिया गया है।
- issue: प्रेम करने वालों की तलवार को परमेश्वर की कार्रवाई का साधन बताना
  choice: उनकी तलवार से उन्हें मार गिरा
  alternative: उनकी तलवार के द्वारा उन्हें पराजित कर
  rationale: मूल पाठ की कठोर युद्ध-संबंधी भाषा और साधनात्मक तनाव को नरम या व्याख्यायित किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थनात्मक शैली। मूल यूनानी की दो समांतर आज्ञार्थक धाराओं और युद्ध-संबंधी स्पष्टता को बनाए रखा गया है।
