  yaml_path: translation/deuterocanon/1_maccabees/004/058.yaml
  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: hi
  text: और लोगों में बहुत ही बड़ा आनन्द हुआ, और राष्ट्रों की निन्दा दूर हो गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों का अपमान दूर हो गया।”
    reason: ὀνειδὸς के लिए ‘निन्दा’ के स्थान पर ‘अपमान’ सम्भव है; ‘राष्ट्रों का/की’ यूनानी संबंधकारक की अस्पष्टता को बनाए रखता है।
lexical_decisions:
- source_word: ἐγενήθη
  choice: हुआ
  rationale: यूनानी कथात्मक सूत्र का सहज हिन्दी रूप; इससे किसी अतिरिक्त कर्ता या कारण को नहीं जोड़ा जाता।
- source_word: εὐφροσύνη μεγάλη ... σφόδρα
  choice: बहुत ही बड़ा आनन्द
  rationale: εὐφροσύνη के सामूहिक हर्ष और μεγάλη तथा σφόδρα के संयुक्त प्रबल बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῷ λαῷ
  choice: लोगों में
  rationale: सामूहिक संज्ञा के साथ ἐν का स्वाभाविक हिन्दी रूप, जो पूरे समुदाय में फैले आनन्द को व्यक्त करता है।
- source_word: ἀπεστράφη
  choice: दूर हो गया
  rationale: यूनानी निष्क्रिय क्रिया में निहित हटाए या फेर दिए जाने के भाव को सहज हिन्दी में रखता है और अनुल्लिखित कर्ता नहीं जोड़ता।
- source_word: ὀνειδὸς
  choice: अपमान
  rationale: सार्वजनिक तिरस्कार और बदनामी के संबंधपरक अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों
  rationale: संदर्भ में इस्राएल से बाहर के लोगों को दर्शाता है; ‘राष्ट्रों’ की अपेक्षा हिन्दी बाइबलीय प्रयोग में यह विरोध अधिक स्पष्ट है, जबकि फुटनोट वैकल्पिक रूप देता है।
theological_decisions:
- issue: ‘लोगों’ और ‘अन्यजातियों’ का संदर्भ
  choice: ‘लोग’ यहूदी/इस्राएली समुदाय और ‘अन्यजातियाँ’ आसपास के गैर-इस्राएली लोगों को सूचित करते हैं
  alternative: दोनों शब्दों को बिना वाचा-संबंधी संकेत के सामान्य ‘लोग’ और ‘राष्ट्र’ माना जाए
  rationale: मन्दिर-उपासना की पुनर्स्थापना का ऐतिहासिक संदर्भ यह विरोध स्पष्ट करता है, पर मुख्य पाठ में ‘इस्राएल’ जैसे व्याख्यात्मक शब्द जोड़कर अर्थ को सीमित नहीं किया गया।
- issue: अपमान का संबंध
  choice: ‘अन्यजातियों की ओर से आया अपमान’—अर्थात उनके द्वारा दिया गया तिरस्कार
  alternative: ‘अन्यजातियों का अपमान’—जो उनका अपना अपमान भी समझा जा सकता है
  rationale: यूनानी संबंधकारक में वास्तविक संरचनात्मक अस्पष्टता है, पर प्रसंग में अपमान का स्रोत अन्यजातियाँ हैं; हिन्दी में गलत स्वामित्व-बोध से बचने के लिए संबंध स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज कथात्मक शैली। ‘बहुत ही बड़ा’ मूल के दोहरे जोर को बनाए रखता है। फुटनोट-चिह्न उसी वाक्य के अंत में दिया गया है जिससे वह संबंधित है।
