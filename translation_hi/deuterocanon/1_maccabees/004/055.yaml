  yaml_path: translation/deuterocanon/1_maccabees/004/055.yaml
  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: hi
  text: और सब लोग मुँह के बल गिर पड़े। उन्होंने दण्डवत् होकर आराधना की और स्वर्ग की ओर[a] उसको धन्य कहा, जिसने उन्हें सफलता दी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग को।” यूनानी पद दिशा (“स्वर्ग की ओर”) बता सकता है, अथवा “स्वर्ग” स्वर्ग में विराजमान परमेश्वर के लिए आदरपूर्ण परोक्ष संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसने उनका मार्ग सफल किया था।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσον ... ἐπὶ πρόσωπον
  choice: मुँह के बल गिर पड़े
  rationale: यह यूनानी मुहावरा भूमि पर औंधे होकर दण्डवत् होने को व्यक्त करता है। सामूहिक कर्ता के साथ हिन्दी में बहुवचन स्वाभाविक है।
- source_word: πᾶς ὁ λαός
  choice: सब लोग
  rationale: यह पूरे उपस्थित जनसमुदाय के लिए सहज आधुनिक हिन्दी है; ‘राष्ट्र’ कहना अनावश्यक राजनीतिक अर्थ जोड़ देता।
- source_word: προσεκύνησαν
  choice: दण्डवत् होकर आराधना की
  rationale: वेदी के पुनःसमर्पण के उपासना-संदर्भ में यह क्रिया केवल शारीरिक रूप से झुकने के बजाय श्रद्धापूर्ण आराधना को सूचित करती है; ‘दण्डवत् होकर’ उसकी देहगत मुद्रा भी बनाए रखता है।
- source_word: ηὐλόγησαν
  choice: धन्य कहा
  rationale: क्रिया का मूल अर्थ किसी को धन्य कहना या उसका गुणगान करना है। परमेश्वर के संदर्भ में ‘धन्य कहा’ स्रोत की अभिव्यक्ति को ‘स्तुति की’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग की ओर
  rationale: εἰς यहाँ आराधना और धन्य कहने की दिशा बता सकता है, जबकि ‘स्वर्ग’ स्वर्ग में विराजमान परमेश्वर के लिए आदरपूर्ण परोक्ष संकेत भी हो सकता है।
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: उस एक को ... जिसने उन्हें सफलता दी थी
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त परमेश्वर का नाम लिए बिना आदरपूर्वक उनकी ओर संकेत करता है। εὐοδόω सफलता या अनुकूल परिणाम प्रदान करने का भाव रखता है।
theological_decisions:
- issue: ‘जिसने उन्हें सफलता दी थी’ का अभिप्रेत व्यक्ति
  choice: परमेश्वर का नाम स्पष्ट रूप से जोड़े बिना ‘उस एक’ द्वारा परोक्ष संदर्भ बनाए रखा गया।
  alternative: ‘परमेश्वर को, जिन्होंने उन्हें सफलता दी थी’
  rationale: यूनानी पाठ परमेश्वर का नाम नहीं लेता, बल्कि ‘स्वर्ग की ओर’ के बाद संज्ञात्मक कृदन्त से आदरपूर्ण परोक्ष संकेत करता है। मुख्य पाठ में परमेश्वर जोड़ना वास्तविक साहित्यिक और धर्मवैचारिक सूक्ष्मता को अनावश्यक रूप से स्पष्ट कर देता।
- issue: εἰς οὐρανόν का कार्य
  choice: आराधना और आशीर्वचन की दिशा के रूप में ‘स्वर्ग की ओर’ रखा गया।
  alternative: ‘स्वर्ग को’, जहाँ ‘स्वर्ग’ परमेश्वर के लिए परोक्ष नाम समझा जाए।
  rationale: यूनानी वाक्यांश दिशा और परमेश्वर के लिए आदरपूर्ण परोक्ष संकेत—दोनों अर्थों की संभावना रखता है; मुख्य पाठ दिशा को रखता और पादटिप्पणी दूसरी संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्डवत् होकर आराधना की’ उपासना-संदर्भ और शारीरिक मुद्रा दोनों व्यक्त करता है। ‘उस एक’ परमेश्वर के निहित किंतु अनाम संदर्भ को सुरक्षित रखता है।
