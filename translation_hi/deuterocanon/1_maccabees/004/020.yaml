  text: 'और उसने देखा कि वे खदेड़ दिए गए थे[a] और छावनी को आग लगा रहे थे; क्योंकि जो धुआँ दिखाई दे रहा था, वह स्पष्ट कर रहा था कि क्या हुआ था।


