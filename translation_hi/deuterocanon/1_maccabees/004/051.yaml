translation:
  language: hi
  text: और उन्होंने मेज़ पर रोटियाँ रखीं[a], और परदे फैला दिए[b]; और उन्होंने वे सारे काम पूरे किए जो उन्होंने किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘रोटियाँ’ बहुवचन में है; इसे ‘रोटी’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आवरण’; यह शब्द पवित्रस्थान में लगाए जाने वाले परदों या लटकते आवरणों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: रखीं
  rationale: ἐπιτίθημι का यहाँ अर्थ किसी वस्तु को दूसरी वस्तु पर रखना है; स्त्रीलिंग बहुवचन ‘रोटियाँ’ के साथ ‘रखीं’ स्वाभाविक है।
- source_word: τὴν τράπεζαν
  choice: मेज़
  rationale: यूनानी में सामान्य शब्द ‘मेज़’ है और कोई अतिरिक्त अनुष्ठानिक विशेषण नहीं दिया गया; इसलिए अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: यूनानी शब्द बहुवचन है; ‘रोटियाँ’ उसकी संख्या को बनाए रखता है और सामान्य हिन्दी में स्पष्ट है।
- source_word: ἐξεπέτασαν
  choice: फैला दिए
  rationale: क्रिया खोलकर फैलाने या विस्तृत करने का भाव देती है; पवित्रस्थान के परदों के संदर्भ में यह सहज हिन्दी है।
- source_word: τὰ καταπετάσματα
  choice: परदे
  rationale: καταπέτασμα पवित्रस्थान के परदे या आवरण के लिए प्रयुक्त हो सकता है; ‘परदे’ स्पष्ट और असांप्रदायिक है।
- source_word: ἐτέλεσαν
  choice: पूरे किए
  rationale: क्रिया का अर्थ समाप्त या पूर्ण करना है; ‘पूरे किए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πάντα τὰ ἔργα
  choice: वे सारे काम
  rationale: यह यूनानी के बहुवचन को सहज हिन्दी में व्यक्त करता है।
- source_word: ἃ ἐποίησαν
  choice: जो उन्होंने किए थे
  rationale: यह ἐποίησαν के सामान्य अर्थ ‘किए’ को सीधे बनाए रखता है और ‘आरम्भ किए/हाथ में लिए’ जैसी संदर्भगत व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: पवित्रस्थान की सामग्री के लिए अनुष्ठानिक शब्दावली
  choice: मुख्य पाठ में सामान्य शब्द ‘मेज़’, ‘रोटियाँ’ और ‘परदे’
  alternative: ‘भेंट की रोटियों की मेज़’ अथवा ‘पवित्रस्थान के आवरण’ जैसे विस्तृत तकनीकी पद
  rationale: यूनानी पाठ इस पद में वस्तुओं के साथ तकनीकी विशेषण नहीं जोड़ता; सामान्य शब्द मूल की संयमित अभिव्यक्ति और संदर्भगत तनाव दोनों बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अंतिम उपवाक्य की शाब्दिक पुनरुक्ति मूल यूनानी में उपस्थित है, इसलिए उसे व्याख्यात्मक रूप से सुगम बनाने के बजाय सुरक्षित रखा गया है।
