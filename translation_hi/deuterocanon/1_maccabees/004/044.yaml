translation:
  language: hi
  text: और उन्होंने होमबलि की उस वेदी के विषय में, जो अपवित्र की गई थी, विचार-विमर्श किया कि उसके साथ क्या करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: विचार-विमर्श किया
  rationale: मध्यवाच्य रूप सामूहिक परामर्श और सोच-विचार को व्यक्त करता है, केवल अंतिम निर्णय को नहीं।
- source_word: θυσιαστηρίου
  choice: वेदी
  rationale: यह बलिदान चढ़ाने के स्थान के लिए मानक हिन्दी शब्द है; अगले संबंधकारक पद से उसका विशेष प्रयोजन स्पष्ट होता है।
- source_word: ὁλοκαυτώσεως
  choice: होमबलि की
  rationale: यह संबंधकारक वेदी का प्रयोजन बताता है। 'होमबलि' उस बलि को संक्षेप और परिचित ढंग से व्यक्त करता है जो पूरी तरह जलाई जाती थी।
- source_word: βεβηλωμένου
  choice: अपवित्र किए गए
  rationale: पूर्ण कृदंत वेदी की उस परिणामी दशा को दर्शाता है जो पहले हुए अपमान या धार्मिक उल्लंघन से उत्पन्न हुई थी। यह चुनाव धार्मिक संदर्भ को बनाए रखता है।
- source_word: τί αὐτῷ ποιήσωσιν
  choice: उसके साथ क्या किया जाए
  rationale: यह वाक्यांश वेदी के संबंध में उचित कार्यवाही पर विचार को स्वाभाविक हिन्दी में व्यक्त करता है और किसी खास कार्यवाही को समय से पहले निश्चित नहीं करता।
theological_decisions:
- issue: वेदी की धार्मिक दशा का वर्णन
  choice: अपवित्र किए गए होमबलि की वेदी
  alternative: भ्रष्ट की गई / अपमानित की गई होमबलि की वेदी
  rationale: βεβηλωμένου धार्मिक उपयोग के लिए अलग की गई वेदी के उल्लंघन और उसके फलस्वरूप अपवित्र दशा को बताता है। 'अपवित्र किए गए' इस धार्मिक आयाम को स्पष्ट रखता है, जबकि वैकल्पिक शब्द या तो कम स्वाभाविक हैं या अनुष्ठानिक अर्थ को कम स्पष्ट करते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। सामूहिक विचार-विमर्श तथा वेदी की धार्मिक रूप से अपवित्र की गई दशा—दोनों को स्पष्ट रखा गया है।
