base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: hi
  text: और उन्होंने देखा कि हमारा पवित्रस्थान उजाड़ पड़ा था, वेदी अपवित्र कर दी गई थी[a], फाटक जलाकर नष्ट कर दिए गए थे, आँगनों में पेड़-पौधे ऐसे उग आए थे जैसे किसी घने जंगल में या किसी पहाड़ पर, और कक्ष ढहा दिए गए थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वेदी का अनादर किया गया था।’ यूनानी शब्द पवित्र वस्तु को अपवित्र किए जाने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द मंदिर-परिसर से जुड़े कमरों को दर्शाता है; इन कक्षों का सटीक स्थान और उपयोग निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: पवित्रस्थान
  rationale: मंदिर के पवित्र परिसर अथवा धाम के लिए स्वाभाविक और उपासना-संबंधी अर्थ को बनाए रखने वाला शब्द।
- source_word: ἠρημωμένον
  choice: उजाड़ पड़ा था
  rationale: यह पूर्ण हो चुकी बरबादी के साथ निर्जन और उपेक्षित अवस्था को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान चढ़ाने की वेदी के लिए मानक और स्पष्ट धार्मिक शब्द।
- source_word: βεβηλωμένον
  choice: अपवित्र कर दी गई थी
  rationale: पवित्र वस्तु के जानबूझकर किए गए अनादर और धार्मिक अशुद्धि, दोनों को सुलभ हिन्दी में व्यक्त करता है।
- source_word: πύλας κατακεκαυμένας
  choice: फाटक जलाकर नष्ट कर दिए गए थे
  rationale: पूर्ण क्रिया-परिणाम और आग से हुए विनाश को स्पष्ट करता है; केवल 'जला दिए गए' से अधिक सटीक है।
- source_word: αὐλαῖς
  choice: आँगनों
  rationale: मंदिर-परिसर के खुले प्रांगणों के लिए साधारण पाठक को सहज समझ आने वाला शब्द।
- source_word: φυτὰ πεφυκότα
  choice: पेड़-पौधे ऐसे उग आए थे
  rationale: अनियंत्रित प्राकृतिक वनस्पति उग आने का भाव रखता है और किसी विशिष्ट प्रजाति का अनावश्यक अनुमान नहीं लगाता।
- source_word: δρυμῷ
  choice: घने वन
  rationale: जंगली, सघन वनस्पति की तुलना को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἑνὶ τῶν ὀρέων
  choice: किसी पहाड़ पर
  rationale: शाब्दिक अर्थ 'पहाड़ों में से किसी एक पर' को बोझिल बनाए बिना मूल की अनिश्चित तुलना सुरक्षित रखता है।
- source_word: παστοφόρια
  choice: कक्ष
  rationale: मंदिर-परिसर से जुड़े कमरों के लिए सावधान सामान्य अनुवाद; उनके स्थान या विशेष उपयोग को निश्चित नहीं करता।
- source_word: καθῃρημένα
  choice: ढहा दिए गए थे
  rationale: संरचनाओं को गिरा या नष्ट कर दिए जाने की पूर्ण अवस्था को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: βεβηλωμένον में धार्मिक अपवित्रीकरण का भाव
  choice: अपवित्र कर दी गई थी
  alternative: भ्रष्ट कर दी गई थी / उसका अनादर किया गया था
  rationale: '''अपवित्र'' पवित्र वेदी के विरुद्ध हुए धार्मिक उल्लंघन को व्यक्त करता है, पर यह नहीं बताता कि अपवित्रीकरण की विधि क्या थी।'
- issue: παστοφόρια की वास्तु-संबंधी पहचान
  choice: कक्ष
  alternative: बगल के कक्ष / भंडार-कक्ष / याजकीय कक्ष
  rationale: मूल शब्द मंदिर से संबद्ध कमरों का संकेत देता है, लेकिन उनका सटीक स्थान और कार्य निश्चित नहीं; इसलिए अधिक विशिष्ट धार्मिक या वास्तु अर्थ नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। दोहराए गए यूनानी संयोजक καί का प्रवाह हिन्दी में अल्पविरामों और अंतिम ‘और’ से सुरक्षित रखा गया है। दृश्यात्मक विनाश को स्पष्ट किया गया है, पर मंदिर की वास्तु-रचना या कक्षों के कार्य के विषय में मूल से अधिक विशिष्टता नहीं जोड़ी गई।
