  yaml_path: translation/deuterocanon/1_maccabees/004/001.yaml
  text: And Gorgias took five thousand men and one thousand chosen horsemen[a], and the camp set out by night,
translation:
  language: hi
  text: और गोरगियास ने पाँच हज़ार पुरुषों और एक हज़ार चुने हुए घुड़सवारों को साथ लिया, और छावनी[a] रात में निकल पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेना रात में निकल पड़ी।” यूनानी में ‘छावनी’ के लिए प्रयुक्त शब्द वहाँ डेरा डाले सैनिक दल को सामूहिक रूप से भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: साथ लिया
  rationale: सैनिक प्रसंग में यह क्रिया लोगों को अपने साथ लेने या अपने अधीन लेकर चलने का भाव देती है। ‘साथ लिया’ स्वाभाविक है और ‘कमान संभाली’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: πεντακισχιλίους ἄνδρας
  choice: पाँच हज़ार पुरुषों
  rationale: ἄνδρας का मूल अर्थ ‘पुरुष’ है। प्रसंग से स्पष्ट है कि वे लड़ने वाले पुरुष थे, पर ‘सैनिक’ कहना मूल शब्द से कुछ अधिक व्याख्यात्मक होता।
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: एक हज़ार चुने हुए घुड़सवारों
  rationale: ἵππον यहाँ सामूहिक एकवचन में घुड़सवार सेना को दर्शाता है और ἐκλεκτήν उनके चुने हुए होने को। हिन्दी में ‘चुने हुए घुड़सवार’ इस सामूहिक सैन्य अर्थ को सहज और सटीक रूप से व्यक्त करता है।
- source_word: ἀπῆρεν
  choice: निकल पड़ी
  rationale: क्रिया का अर्थ किसी स्थान से प्रस्थान करना है। ‘निकल पड़ी’ रात में सेना की गतिविधि के लिए स्वाभाविक है और मूल से अधिक विशिष्ट ‘कूच किया’ नहीं जोड़ता।
- source_word: ἡ παρεμβολή
  choice: छावनी
  rationale: παρεμβολή का सामान्य अर्थ ‘छावनी’ है और विस्तार से यह उसमें ठहरी सेना को भी सामूहिक रूप से दर्शा सकता है। मुख्य पाठ में यूनानी बिंब सुरक्षित रखा गया है और वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: νυκτός
  choice: रात में
  rationale: यह संबंधकारक रूप क्रियाविशेषण की तरह समय बताता है। ‘रात में’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
