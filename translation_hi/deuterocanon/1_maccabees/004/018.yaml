base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: hi
  text: और गोरगियास और सेना हमारे निकट पहाड़ी प्रदेश में हैं।[a] पर अब हमारे शत्रुओं के सामने डटे रहो और उनसे युद्ध करो; इसके बाद निडर होकर लूट का माल ले लेना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे निकट पहाड़ पर हैं।” यूनानी पद किसी विशेष पहाड़ या व्यापक पहाड़ी प्रदेश—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “साहस से लूट का माल ले लेना” अथवा “विश्वास के साथ लूट का माल ले लेना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμις
  choice: सेना
  rationale: सैनिक प्रसंग में यह शब्द सशस्त्र सैन्य दल को दर्शाता है। ‘सेना’ आधुनिक हिन्दी में स्वाभाविक है और दल के आकार या संगठन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν τῷ ὄρει
  choice: पहाड़ी प्रदेश में
  rationale: यूनानी एकवचन पद किसी एक पर्वत के साथ-साथ व्यापक पहाड़ी या ऊँचे भूभाग का भी बोध करा सकता है; मुख्य पाठ में भौगोलिक अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐγγὺς ἡμῶν
  choice: हमारे निकट
  rationale: यह निकटता और आसन्न सैन्य खतरे को सीधे व्यक्त करता है।
- source_word: στῆτε ἐναντίον
  choice: सामने डटे रहो
  rationale: आज्ञार्थक रूप युद्ध में दृढ़तापूर्वक सामना करने का भाव रखता है; ‘डटे रहो’ उसकी दृढ़ता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πολεμήσατε
  choice: युद्ध करो
  rationale: यह तत्काल युद्ध करने की आज्ञा का स्पष्ट और गरिमापूर्ण अनुवाद है।
- source_word: σκῦλα
  choice: लूट का माल
  rationale: यह विजय के बाद शत्रु से प्राप्त वस्तुओं को दर्शाता है। ‘लूट का माल’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: μετὰ παρρησίας
  choice: निडर होकर
  rationale: इस प्रसंग में पद निर्भयता और आत्मविश्वास के साथ कार्य करने का भाव देता है; क्रियाविशेषणीय हिन्दी वाक्य को स्वाभाविक बनाती है।
- source_word: Γοργίας
  choice: गोरगियास
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
