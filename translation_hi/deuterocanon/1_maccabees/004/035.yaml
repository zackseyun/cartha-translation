base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: hi
  text: पर जब लूसियास ने अपनी सेना की पराजय और यहूदा के लोगों में उत्पन्न साहस[a] को देखा, और यह भी देखा कि वे या तो जीने या वीरता से मरने के लिए तैयार थे, तो वह अंताकिया चला गया। वहाँ उसने विदेशी सैनिक भर्ती किए[b], ताकि अपनी सेना की संख्या फिर बढ़ाकर वह यहूदिया में दोबारा आ सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘यहूदा का साहस’। अगले वाक्यांश में बहुवचन ‘वे तैयार थे’ आने के कारण प्रसंग में यह यहूदा के पक्ष के लोगों का साहस जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भाड़े के सैनिक भर्ती किए’। यूनानी क्रिया विदेशियों को भर्ती करने पर बल देती है; वे विशेष रूप से वेतनभोगी सैनिक थे या नहीं, यह व्याख्या का विषय है।
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: पराजय
  rationale: सैन्य प्रसंग में यह शब्द युद्ध में पलटकर भागने या पूरी तरह परास्त होने का भाव देता है। ‘पराजय’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का मुख्य अर्थ स्पष्ट रखता है।
- source_word: σύνταξις
  choice: सेना
  rationale: मूल शब्द सैनिकों की व्यवस्थित पंक्ति या सैन्य-विन्यास को सूचित करता है; यहाँ ‘अपनी सेना’ सहज हिन्दी में उसी सैन्य दल को दर्शाता है।
- source_word: θάρσος
  choice: साहस
  rationale: यह शब्द साहस, निर्भीकता या हिम्मत का अर्थ देता है। विजय के बाद उत्पन्न दृढ़ता के लिए ‘साहस’ उपयुक्त और गरिमापूर्ण है।
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  choice: यहूदा के लोगों में जागे साहस
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘यहूदा का साहस’ है, पर अगले बहुवचन ‘वे तैयार थे’ से यहूदा के पक्ष के लोगों का सामूहिक साहस अभिप्रेत जान पड़ता है। फुटनोट में शाब्दिक रूप सुरक्षित रखा गया है।
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: वे या तो जीने या वीरता से मरने के लिए तैयार थे
  rationale: मूल की संतुलित ‘या...या’ रचना को रखा गया है; γενναίως के सम्मान और वीरता-सूचक भाव को ‘वीरता से’ व्यक्त किया गया है।
- source_word: ἐξενολόγει
  choice: विदेशी सैनिक भर्ती किए
  rationale: क्रिया का प्रत्यक्ष बल विदेशियों को सैन्य सेवा के लिए इकट्ठा या भर्ती करने पर है। उन्हें निश्चित रूप से वेतनभोगी कहना सम्भव है, पर मूल में यह स्पष्ट नहीं है।
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: संख्या में फिर बढ़कर
  rationale: यह वाक्यांश लौटने से पहले संख्यात्मक रूप से अधिक शक्तिशाली होने की योजना बताता है और मूल की तुलनात्मक अनिश्चितता को बनाए रखता है।
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: यहूदिया में दोबारा आए
  rationale: यह अनन्त क्रिया नियोजित भावी आगमन और पुनः अभियान का संकेत देती है; ‘दोबारा आए’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
