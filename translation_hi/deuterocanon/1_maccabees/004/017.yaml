translation:
  language: hi
  text: और उसने लोगों से कहा, “लूट के माल की लालसा मत करो, क्योंकि युद्ध हमारे सामने है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμήσητε
  choice: लालसा मत करो
  rationale: यह क्रिया प्रबल इच्छा व्यक्त करती है। निषेधात्मक संदर्भ में ‘लालसा मत करो’ स्वाभाविक है और इसमें अनावश्यक रूप से दस आज्ञाओं की विशिष्ट शब्दावली आरोपित नहीं होती।
- source_word: σκύλων
  choice: लूट के माल
  rationale: यहाँ युद्ध में प्राप्त की जाने वाली वस्तुएँ अभिप्रेत हैं। ‘लूट के माल’ आधुनिक हिन्दी में स्पष्ट है और वस्तुओं को दर्शाता है, केवल लूटने की क्रिया को नहीं।
- source_word: πόλεμος
  choice: युद्ध
  rationale: ग्रीक संज्ञा का सामान्य अर्थ ‘युद्ध’ है; इस प्रसंग में तत्काल सामने उपस्थित लड़ाई अभिप्रेत है, जिसे हिन्दी में ‘युद्ध’ स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: हमारे सामने है
  rationale: यह वाक्यांश सामने या विपरीत दिशा में स्थित होने का स्थानिक भाव रखता है। ‘हमारे सामने है’ आसन्न मुठभेड़ को व्यक्त करते हुए उस भाव को बनाए रखता है।
- source_word: λαόν
  choice: लोगों
  rationale: मूल पाठ में व्यापक शब्द ‘लोग’ है। यद्यपि संबोधन युद्धरत दल से है, अनुवाद इसे व्याख्यात्मक रूप से ‘सैनिकों’ या ‘सेना’ तक सीमित नहीं करता।
