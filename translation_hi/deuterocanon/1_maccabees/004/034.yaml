    reason: lexical_alternative
  - marker: b
    text: या, “उनके आमने-सामने” अथवा “उनके सम्मुख।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: वे एक-दूसरे से युद्ध में भिड़ गए
  rationale: सैन्य प्रसंग में यह पदबंध परस्पर युद्ध में भिड़ने का अर्थ देता है। यह अनुवाद पारस्परिकता और युद्ध-संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔπεσον
  choice: गिर पड़े
  rationale: युद्ध-वर्णन में इसका आशय मारे जाने से है, पर ‘गिर पड़े’ यूनानी की प्रत्यक्ष अभिव्यक्ति और उसके संयम को सुरक्षित रखता है।
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: लूसियास की छावनी के
  rationale: παρεμβολή यहाँ सैन्य छावनी को सूचित करता है; सम्बन्धकारक रचना को सहज हिन्दी में रखा गया है।
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: लगभग पाँच हज़ार सैनिक
  rationale: εἰς यहाँ संख्या की अनुमानित सीमा अथवा कुल संख्या दर्शा सकता है। युद्ध-संदर्भ में ἄνδρας के लिए ‘सैनिक’ स्वाभाविक है, यद्यपि उसका शाब्दिक अर्थ ‘पुरुष’ है।
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: उनके सामने ही
  rationale: यह पदबंध विरोधी सेना के सामने अथवा उसके आमने-सामने की स्थिति बताता है। ‘उनके सामने ही’ दिशा-सूचक भाव और युद्ध में पराजय का दृश्य दोनों बनाए रखता है।
