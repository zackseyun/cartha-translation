  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: hi
  text: और उन्होंने उसकी रखवाली के लिए वहाँ एक सैन्य दल तैनात किया[a], और बेत्सूरा की रखवाली के लिए उसे किलेबंद किया, ताकि लोगों के पास इदूमिया के सामने एक गढ़ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उसकी रखवाली के लिए वहाँ एक सैन्य दल नियुक्त करने का आदेश दिया।” यूनानी क्रिया का अर्थ “आदेश देना” या “नियुक्त करना” हो सकता है; इस प्रसंग में सैनिकों को वहाँ तैनात करने का भाव सम्भवतः निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξαν
  choice: तैनात किया
  rationale: क्रिया का मूल अर्थ ‘आदेश दिया/नियुक्त किया’ हो सकता है, पर δύναμιν और रखवाली के उद्देश्य के साथ यह किसी सैन्य दल को चौकी पर लगाने का भाव देती है।
- source_word: δύναμιν
  choice: एक सैन्य दल
  rationale: यहाँ शब्द सैन्य शक्ति अथवा सैनिकों के एक संगठित दल को दर्शाता है; ‘सैन्य दल’ आकार को अनावश्यक रूप से निश्चित किए बिना प्रसंग स्पष्ट करता है।
- source_word: τηρεῖν
  choice: रखवाली के लिए
  rationale: सैन्य प्रसंग में इसका अर्थ किसी स्थान की निगरानी और रक्षा करना है।
- source_word: ὠχύρωσαν
  choice: किलेबन्द किया
  rationale: क्रिया किसी स्थान को रक्षात्मक रूप से मजबूत बनाने का संकेत देती है।
- source_word: τὴν Βαιθσουρά
  choice: बेत्सूरा
  rationale: यह स्थान-नाम यूनानी रूप Βαιθσουρά का देवनागरी लिप्यंतरण है।
- source_word: τοῦ ἔχειν
  choice: ताकि ... के पास ... हो
  rationale: τοῦ के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य प्रकट करती है, जिसे स्वाभाविक हिन्दी उद्देश्य-वाक्य से व्यक्त किया गया है।
- source_word: ὀχύρωμα
  choice: गढ़
  rationale: यह किसी रक्षात्मक दुर्ग या सुरक्षित मजबूत स्थान को दर्शाता है; ‘गढ़’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: इदूमिया के सामने
  rationale: वाक्यांश की स्थानगत छवि ‘इदूमिया के सम्मुख/सामने’ है; हिन्दी में ‘के सामने’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
