  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: hi
  text: पर जब उसने यह सब सुना, तो वह उलझन में पड़ गया और निरुत्साहित हो गया, क्योंकि इस्राएल के साथ वैसा नहीं हुआ था जैसा वह चाहता था, और जैसा राजा ने उसे आदेश दिया था, वैसा भी नहीं हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχύθη
  choice: घबरा गया
  rationale: निष्क्रिय क्रिया मानसिक उलझन और भीतर की तीव्र व्याकुलता व्यक्त करती है; ‘घबरा गया’ आधुनिक हिन्दी में स्वाभाविक है और भाव को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ἤθυμει
  choice: उसका हौसला टूट गया
  rationale: यह जारी निराश और हतोत्साहित अवस्था को व्यक्त करता है; यह हिन्दी मुहावरा उस मनोबल-भंग को स्पष्ट रूप से सामने लाता है।
- source_word: οὐχ οἷα ἤθελεν
  choice: वैसा नहीं हुआ था जैसा वह चाहता था
  rationale: यह उसकी इच्छा या अपेक्षा और वास्तविक घटना के बीच विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: इस्राएल के साथ ... हुआ था
  rationale: पूर्ण काल के परिणामकारी भाव और इस्राएल को प्रभावित करने वाली घटना—दोनों को सहज रूप में व्यक्त करता है।
- source_word: ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  choice: राजा ने उसे जो आज्ञा दी थी
  rationale: ἐντέλλομαι राजकीय अधिकार से दिए गए आदेश को दर्शाता है; ‘आज्ञा’ उस अधिकारपूर्ण स्वर को बनाए रखती है।
- source_word: ἐξέβη
  choice: उसका वैसा परिणाम नहीं निकला था
  rationale: यहाँ क्रिया किसी आदेश के पूरा होने मात्र से अधिक, घटनाओं के अपेक्षित ढंग से परिणत होने को बताती है; यह चयन परिणाम के अर्थ को स्पष्ट रखता है।
