  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: hi
  text: इस छावनी को अपनी प्रजा इस्राएल के हाथों में सौंप दे[a], और वे अपनी शक्ति और अपनी घुड़सवार सेना के कारण लज्जित हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस छावनी को अपनी प्रजा इस्राएल के वश में कर दे।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “बंद कर दे” या “घेर ले” हो सकता है; यहाँ आशय शत्रु-दल को इस्राएल के अधिकार में सौंप देने का है।
    reason: lexical_alternative
  - marker: b
    text: “अपनी शक्ति” का अर्थ यहाँ “अपने सैन्य-बल” भी हो सकता है। यूनानी वाक्यांश को “अपनी शक्ति और अपनी घुड़सवार सेना में लज्जित हों” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: हाथों में कर दे
  rationale: क्रिया का मूल अर्थ ‘बंद कर देना/घेर देना’ है, पर इस सैन्य प्रार्थना में आशय शत्रु-छावनी को इस्राएल के वश में सौंप देने का है। ‘हाथों में कर दे’ अगले यूनानी मुहावरे के साथ स्वाभाविक हिन्दी बनाता है और परमेश्वर की सक्रिय भूमिका बनाए रखता है।
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: शब्द छावनी अथवा वहाँ एकत्र सैन्य-दल को सूचित कर सकता है। ‘इस छावनी’ ठोस सैन्य बिंब और संकेतवाचकता दोनों को सुरक्षित रखता है।
- source_word: εἰς χεῖρας
  choice: के हाथों में
  rationale: यह किसी के अधिकार या वश में दिए जाने का बाइबलीय मुहावरा है; हिन्दी में भी ‘हाथों में’ सहज और अर्थपूर्ण है।
- source_word: λαοῦ σου Ἰσραήλ
  choice: अपनी प्रजा इस्राएल
  rationale: यह इस्राएल की पहचान परमेश्वर की प्रजा के रूप में करता है। ‘अपनी प्रजा इस्राएल’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: αἰσχυνθήτωσαν
  choice: वे ... लज्जित हों
  rationale: आज्ञार्थक/कामनार्थक भाव को ‘हों’ से व्यक्त किया गया है। संदर्भ में यह पराजय से होने वाली लज्जा है, केवल भीतरी संकोच नहीं।
- source_word: ἐπὶ τῇ δυνάμει
  choice: अपनी शक्ति ... के कारण
  rationale: δύναμις का अर्थ शक्ति, सामर्थ्य या सैन्य-बल हो सकता है। ‘शक्ति’ यूनानी की व्यापकता बनाए रखती है और इसे अनावश्यक रूप से केवल ‘सेना’ तक सीमित नहीं करती।
- source_word: τῇ ἵππῳ αὐτῶν
  choice: अपने घुड़सवारों
  rationale: एकवचन ἵππος यहाँ सामूहिक सैन्य अर्थ में घोड़े/अश्वारोही दल को सूचित करता है। युद्ध-संदर्भ में ‘घुड़सवारों’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: परमेश्वर से शत्रु-छावनी को इस्राएल के अधिकार में देने की सैन्य प्रार्थना
  choice: इस छावनी को अपनी प्रजा इस्राएल के हाथों में कर दे
  alternative: इस छावनी को अपनी प्रजा इस्राएल के हाथों में बंद कर दे
  rationale: चुना हुआ पाठ विजय के लिए की गई प्रार्थना और परमेश्वर की कर्तृत्व-भूमिका को स्पष्ट रखता है, जबकि यूनानी क्रिया के अत्यधिक शाब्दिक अनुवाद से उत्पन्न अस्वाभाविक हिन्दी से बचता है।
- issue: शत्रु की δύναμις पर लज्जित होने का आधार
  choice: अपनी शक्ति और अपने घुड़सवारों के कारण लज्जित हों
  alternative: अपने सैन्य-बल और अपने घुड़सवारों के कारण लज्जित हों
  rationale: ‘शक्ति’ स्रोत शब्द की वास्तविक अर्थ-व्याप्ति और इस विडंबना को बचाती है कि जिस सामर्थ्य पर शत्रु निर्भर है, उसी के बावजूद अथवा उसी के संबंध में वह लज्जित होगा। पादटिप्पणी सैन्य अर्थ भी बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थना का एकवचन निकट संबोधन रखा गया है। भाषा गरिमापूर्ण किंतु सहज है। ‘छावनी’, ‘हाथों में’, ‘शक्ति’ और ‘घुड़सवार’ मूल सैन्य बिंबों को सुरक्षित रखते हैं; जहाँ यूनानी बहुअर्थी है, वहाँ पादटिप्पणियों में विकल्प दिए गए हैं।
