  - marker: a
    text: या ‘गैर-यहूदी लोग’; इस प्रसंग में ‘जातियाँ’ विशेष रूप से गैर-यहूदी लोगों को सूचित कर सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν
  choice: वे युद्ध में भिड़ गए
  rationale: सैन्य प्रसंग में συνάπτω का अर्थ युद्ध आरम्भ करना या युद्ध में भिड़ना है। यह अनुवाद केवल ‘जुड़ने’ के बजाय क्रिया का युद्ध-संबंधी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνετρίβησαν
  choice: कुचल दी गईं
  rationale: συντρίβω का कर्मवाच्य रूप टूट या कुचल जाने की प्रबल छवि रखता है; इसलिए सामान्य ‘हार गईं’ की अपेक्षा मूल की तीव्रता सुरक्षित रखी गई है।
- source_word: τὰ ἔθνη
  choice: जातियाँ
  rationale: यूनानी पद का मूल अर्थ ‘जातियाँ’ है। प्रसंग में यह गैर-यहूदी लोगों या उनकी सेनाओं को सूचित कर सकता है, पर मुख्य पाठ में व्यापक पद रखकर मूल की अर्थगत गुंजाइश सुरक्षित रखी गई है।
- source_word: τὸ πεδίον
  choice: मैदान
  rationale: πεδίον समतल खुले भूभाग को दर्शाता है। ‘मैदान’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सैन्य प्रसंग के अनुकूल है।
