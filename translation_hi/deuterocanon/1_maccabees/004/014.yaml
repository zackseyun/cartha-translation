  text: And they joined battle[a], and the nations were crushed, and they fled into the plain.
translation:
  language: hi
  text: और वे युद्ध में भिड़ गए, और जातियाँ[a] कुचल दी गईं, और वे भागकर मैदान में चली गईं।
  philosophy: optimal-equivalence
