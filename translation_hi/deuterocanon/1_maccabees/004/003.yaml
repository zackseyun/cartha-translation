lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: यह सामान्य और स्वाभाविक अर्थ है तथा यूनानी की तरह सुनी गई बात को अव्यक्त रहने देता है; “समाचार मिला” अर्थ को अधिक स्पष्ट कर देता।
- source_word: ἀπῆρεν
  choice: निकल पड़े
  rationale: यह उद्देश्यपूर्ण प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है, बिना मार्ग, दिशा या सैन्य गठन का अतिरिक्त संकेत दिए।
- source_word: οἱ δυνατοὶ
  choice: वीर पुरुष
  rationale: यह ‘सामर्थी/पराक्रमी जन’ के शाब्दिक बल और प्रसंग के सैनिक भाव, दोनों को गरिमापूर्ण और सहज हिन्दी में रखता है; यूनानी में न होने के कारण “उसके” नहीं जोड़ा गया।
- source_word: πατάξαι
  choice: प्रहार करने के लिए
  rationale: यह इच्छित आक्रामक कार्रवाई की शब्द-छवि बनाए रखता है और परिणाम को पहले से ‘पराजित करना’ नहीं मानता।
- source_word: τὴν δύναμιν
  choice: सेना
  rationale: इस सैन्य प्रसंग में δύναμις राजा की युद्धरत सैन्य टुकड़ी या बल को दर्शाता है; सामान्य हिन्दी में “सेना” सबसे स्पष्ट और स्वाभाविक है।
- source_word: τοῦ βασιλέως
  choice: राजा की
  rationale: यह संबंधवाचक यूनानी पदबंध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τὴν ἐν Ἐμμαούμ
  choice: एम्माऊस में मौजूद
  rationale: यह सेना की पहचान उसके स्थान से करता है और ‘तैनात’ जैसा ऐसा अर्थ नहीं जोड़ता जो यूनानी में स्पष्ट रूप से नहीं कहा गया।
