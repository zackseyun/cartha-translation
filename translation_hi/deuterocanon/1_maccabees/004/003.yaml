review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Judas hearing, the departure with the mighty men, the intended attack, the king’s military force, and its location at Emmaus. However, “तब” (‘then’) adds a sequential nuance not expressed by the Greek καί (‘and’).
  naturalness: The sentence is generally clear and appropriately elevated for narrative prose. “पराक्रमी जन” is more natural modern-standard Hindi than “वीर पुरुष” while retaining the Greek’s broad designation of the mighty/strong ones.
  terminology: “राजा की सेना,” “प्रहार करने के लिए,” and “एम्माऊस में स्थित” faithfully and naturally render the military force, the intended hostile action, and the locative identification. “पराक्रमी जन” preserves δυνατοί without adding a possessive or defining them more narrowly as formal soldiers.
  issues:
  - severity: low
    issue: “तब” is added at the opening.
    rationale: The Greek begins with καί, ‘and’; it does not explicitly mark the action as ‘then.’ Removing it better preserves the source’s connective force without adding temporal sequencing.
  - severity: low
    issue: “वीर पुरुष” is somewhat stilted and narrower in modern Hindi.
    rationale: The Greek οἱ δυνατοὶ means ‘the mighty/strong ones’ and need not be rendered with the gender-marked, somewhat archaic “पुरुष.” “पराक्रमी जन” is idiomatic and retains the broad descriptive sense.
  revised_text: और यहूदा ने सुना, और वह और पराक्रमी जन एम्माऊस में स्थित राजा की सेना पर प्रहार करने के लिए निकल पड़े,
