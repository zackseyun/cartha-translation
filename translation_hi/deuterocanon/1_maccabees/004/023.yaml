  yaml_path: translation/deuterocanon/1_maccabees/004/023.yaml
  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: hi
  text: और यहूदा छावनी से लूटी हुई वस्तुओं के पास लौट आया और उसने बहुत-सा सोना और चाँदी, नीला कपड़ा, बैंगनी कपड़ा, समुद्री वस्तुएँ[a] और बड़ी संपत्ति ले ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “समुद्री-नीला कपड़ा” अथवा “समुद्री बैंगनी कपड़ा”; यूनानी शब्द का शाब्दिक अर्थ “समुद्र से संबंध रखने वाली” है, और मूल्यवान वस्तुओं की इस सूची में उसका ठीक अभिप्राय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: लौट आया
  rationale: सैन्य प्रसंग में यह क्रिया वापस लौटने का बोध कराती है; आधुनिक हिन्दी में ‘लौट आया’ स्वाभाविक है।
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: छावनी की लूट
  rationale: σκυλίαν लूटी हुई वस्तुओं और παρεμβολῆς सैन्य छावनी को दर्शाता है; यह अभिव्यक्ति मूल संबंध को संक्षेप में बनाए रखती है।
- source_word: ἔλαβε
  choice: उसने ... ले लिया
  rationale: यूनानी क्रिया एकवचन है और इसका कर्ता यहूदा है; इसलिए हिन्दी में भी एकवचन रखा गया है, भले ही वह दल के प्रतिनिधि के रूप में कार्य कर रहा हो।
- source_word: χρυσίον καὶ ἀργύριον πολὺ
  choice: बहुत-सा सोना-चाँदी
  rationale: मूल में सोने और चाँदी की प्रचुर मात्रा का उल्लेख है; संयुक्त हिन्दी पद सहज और स्पष्ट है।
- source_word: ὑάκινθον
  choice: नीला कपड़ा
  rationale: यह शब्द नीले अथवा नील-बैंगनी रंग की मूल्यवान रंगी हुई सामग्री को सूचित कर सकता है; वस्तुओं की सूची में ‘कपड़ा’ निहित अर्थ को स्वाभाविक बनाता है।
- source_word: πορφύραν
  choice: बैंगनी कपड़ा
  rationale: यह शब्द बैंगनी रंग, रंजक अथवा विलासितापूर्ण बैंगनी वस्त्र का द्योतक हो सकता है; सूची के संदर्भ में ‘बैंगनी कपड़ा’ उपयुक्त है।
- source_word: θαλασσίαν
  choice: समुद्री वस्तुएँ
  rationale: शब्द का शाब्दिक अर्थ ‘समुद्र की/समुद्री’ है, पर यहाँ इसका ठीक अभिप्राय अनिश्चित है; व्यापक अनुवाद के साथ पादटिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
- source_word: πλοῦτον μέγαν
  choice: अपार धन
  rationale: यह बड़ी संपदा का सारगर्भित उल्लेख है; ‘अपार धन’ आधुनिक और गरिमापूर्ण हिन्दी है।
