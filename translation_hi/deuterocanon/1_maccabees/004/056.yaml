base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: hi
  text: उन्होंने वेदी की प्रतिष्ठा का उत्सव आठ दिन तक मनाया। उन्होंने आनंद के साथ पूर्ण होमबलियाँ चढ़ाईं और उद्धार तथा स्तुति का बलिदान[a] चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेलबलि और स्तुति का बलिदान”; यूनानी में शाब्दिक रूप से “उद्धार/कल्याण और स्तुति का बलिदान” है।
    reason: σωτηρίου का सामान्य अर्थ ‘उद्धार/कल्याण’ है, पर बलिदानी संदर्भ में इसे तकनीकी रूप से ‘मेलबलि’ भी समझा जा सकता है।
lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  choice: समर्पण का उत्सव ... मनाया
  rationale: शाब्दिक अर्थ ‘समर्पण किया’ हो सकता है, पर इस संज्ञा के साथ क्रिया पूरे समर्पण-समारोह को सम्पन्न करने का भाव देती है; यह चयन स्वाभाविक हिन्दी में वही अर्थ व्यक्त करता है।
- source_word: τοῦ θυσιαστηρίου
  choice: वेदी के
  rationale: θυσιαστήριον के लिए प्रचलित और स्पष्ट धार्मिक शब्द ‘वेदी’ है।
- source_word: ἡμέρας ὀκτώ
  choice: आठ दिन तक
  rationale: द्वितीया कारक यहाँ अवधि बताता है; ‘तक’ आधुनिक हिन्दी में अवधि को स्पष्ट करता है।
- source_word: προσήνεγκαν
  choice: चढ़ाईं
  rationale: बलिदान-सन्दर्भ में क्रिया का अर्थ अर्पित करना है; ‘चढ़ाना’ हिन्दी बाइबलीय और सामान्य धार्मिक प्रयोग दोनों में सहज है।
- source_word: ὁλοκαυτώματα
  choice: पूर्ण होमबलियाँ
  rationale: यह उन बलियों को सूचित करता है जो आग में पूरी तरह जला दी जाती थीं; ‘पूर्ण’ इस विशिष्टता को सुरक्षित रखता है।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द के साथ
  rationale: यह उत्सवपूर्ण प्रसन्नता को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἔθυσαν
  choice: बलिदान ... चढ़ाया
  rationale: हिन्दी में स्वाभाविक अभिव्यक्ति रखते हुए पिछले προσήνεγκαν के समान बलिदानी कार्य को स्पष्ट किया गया है।
- source_word: θυσίαν σωτηρίου
  choice: उद्धार ... का बलिदान
  rationale: σωτηρίου का प्रत्यक्ष यूनानी अर्थ उद्धार, बचाव या कल्याण है। मुख्य पाठ में ‘उद्धार’ रखने से यूनानी शब्दावली और ऐतिहासिक प्रसंग में मिली मुक्ति का भाव सुरक्षित रहता है।
- source_word: αἰνέσεως
  choice: स्तुति
  rationale: αἴνεσις का सीधा अर्थ ‘स्तुति’ है; इसे उसी एक बलिदान की दूसरी विशेषता के रूप में रखा गया है।
theological_decisions:
- issue: θυσίαν σωτηρίου का बलिदानी अर्थ
  choice: उद्धार का बलिदान
  alternative: मेलबलि / शान्ति-बलि
  rationale: यूनानी σωτηρίου उद्धार, बचाव या कल्याण को व्यक्त करता है, जबकि सामी बलिदानी पृष्ठभूमि में इसे तकनीकी रूप से मेलबलि भी समझा जा सकता है। मुख्य पाठ मूल यूनानी की खुली अर्थ-सीमा को प्राथमिकता देता है और पादटिप्पणी प्रचलित वैकल्पिक पहचान बताती है।
- issue: θυσίαν ... καὶ αἰνέσεως की रचना
  choice: उद्धार तथा स्तुति का बलिदान
  alternative: उद्धार का बलिदान और स्तुति का बलिदान
  rationale: यूनानी में θυσίαν एकवचन है और दोनों संबंधकारक उससे जुड़े हैं; इसलिए हिन्दी में भी एक ही बलिदान को दोनों विशेषताओं के साथ प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण धार्मिक शैली रखी गई है। ‘पूर्ण होमबलियाँ’ जैसे आवश्यक बलिदानी पद सुरक्षित हैं; अनावश्यक संस्कृतनिष्ठता और किसी विशेष सम्प्रदाय की शब्दावली से बचा गया है।
