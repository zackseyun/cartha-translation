  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: hi
  text: और उन्होंने उन पत्थरों को मन्दिर की पहाड़ी पर[a] एक उपयुक्त स्थान पर अलग रख दिया, जब तक कोई भविष्यद्वक्ता आकर उनके विषय में उत्तर न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भवन के पर्वत पर,” अर्थात् मन्दिर-पर्वत या मन्दिर की पहाड़ी पर।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  choice: अलग रख दिया
  rationale: मध्यवाच्य क्रिया किसी वस्तु को बाद में निर्णय या उपयोग के लिए एक ओर सुरक्षित रख देने का भाव देती है।
- source_word: τοὺς λίθους
  choice: उन पत्थरों को
  rationale: यूनानी में केवल ‘पत्थरों’ का उल्लेख है; ‘उन’ पूर्वप्रसंग में हटाए गए पत्थरों की ओर संकेत करता है, बिना यहाँ ‘वेदी के’ जोड़ने के।
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: मन्दिर की पहाड़ी पर
  rationale: शाब्दिक अर्थ ‘भवन/घर के पर्वत पर’ है, जो यहाँ मन्दिर-पर्वत अथवा मन्दिर की पहाड़ी के लिए प्रयुक्त अभिव्यक्ति है।
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: एक उपयुक्त स्थान में
  rationale: ἐπιτήδειος स्थान की उपयुक्तता या अनुकूलता व्यक्त करता है।
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: जब तक ... आकर
  rationale: यह रचना कथा के समय से प्रतीक्षित भावी आगमन की सीमा व्यक्त करती है।
- source_word: προφήτην
  choice: कोई भविष्यद्वक्ता
  rationale: संज्ञा अनिश्चित है और किसी पहचाने हुए विशिष्ट भविष्यद्वक्ता का उल्लेख नहीं करती। ‘कोई’ हिन्दी में इस अनिश्चितता और प्रतीक्षा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: उनके विषय में उत्तर न दे
  rationale: यह ‘उनके विषय में उत्तर देना’ का औपचारिक परन्तु अनिर्धारित भाव बनाए रखता है और इसे चुपचाप कानूनी निर्णय में नहीं बदलता।
theological_decisions:
- issue: प्रतीक्षित भविष्यद्वक्ता की भूमिका
  choice: भविष्य में आने वाला कोई भविष्यद्वक्ता पत्थरों के विषय में प्रामाणिक उत्तर देगा
  alternative: भविष्यद्वक्ता औपचारिक कानूनी निर्णय सुनाएगा; अथवा यह केवल निर्णय टालने की रूढ़ अभिव्यक्ति है
  rationale: यूनानी पाठ केवल इतना कहता है कि पत्थर तब तक रखे गए जब तक कोई भविष्यद्वक्ता आकर उनके विषय में उत्तर दे। अनुवाद उस भविष्यसूचक मार्गदर्शन की अपेक्षा को सुरक्षित रखता है, पर उसकी विधिक प्रकृति, समय या पद के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘मन्दिर की पहाड़ी’ सामान्य पाठक के लिए स्थान स्पष्ट करती है; पादटिप्पणी मूल यूनानी की शाब्दिक अभिव्यक्ति सुरक्षित रखती है।
