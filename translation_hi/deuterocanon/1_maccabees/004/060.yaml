base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: hi
  text: और उस समय उन्होंने सिय्योन पर्वत के चारों ओर ऊँची दीवारें और मज़बूत मीनारें बनाईं, ताकि जातियाँ[a] आकर उसे रौंद न डालें, जैसा उन्होंने पहले किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गैर-यहूदी लोग।” यूनानी τὰ ἔθνη का अर्थ “जातियाँ” अथवा “गैर-यहूदी लोग” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: बनाईं
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है। ऊँची दीवारों और मीनारों का उल्लेख रक्षात्मक निर्माण का भाव स्वतः स्पष्ट करता है, इसलिए ‘किलेबंदी की’ जैसी अतिरिक्त व्याख्या आवश्यक नहीं।
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: उस समय
  rationale: यह कालसूचक पदबंध का स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: τὸ ὄρος Σιὼν
  choice: सिय्योन पर्वत
  rationale: स्थान-नाम का प्रचलित बाइबलीय हिन्दी रूप रखते हुए ὄρος का सीधा अनुवाद किया गया है।
- source_word: κυκλόθεν
  choice: चारों ओर
  rationale: यह किलेबंदी के चारों तरफ़ फैले होने का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τείχη ὑψηλὰ
  choice: ऊँची दीवारें
  rationale: संज्ञा और विशेषण का सीधा, स्पष्ट तथा प्रसंगानुकूल अनुवाद।
- source_word: πύργους ἰσχυρούς
  choice: मज़बूत मीनारें
  rationale: ἰσχυρούς यहाँ आकार से अधिक सामर्थ्य और दृढ़ता बताता है; ‘मज़बूत’ उसी बल को रखता है।
- source_word: μή ποτε
  choice: ताकि … न
  rationale: यह सावधानी अथवा आशंकित परिणाम को रोकने वाला भाव प्रस्तुत करता है; आधुनिक हिन्दी में यह संरचना स्वाभाविक है।
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: जातियाँ फिर आकर
  rationale: τὰ ἔθνη का मूल अर्थ ‘जातियाँ/राष्ट्र’ है और प्रसंग में गैर-यहूदी शत्रु-समुदाय अभिप्रेत हैं। ‘फिर’ पूर्व घटना की पुनरावृत्ति की आशंका को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: καταπατήσωσιν αὐτά
  choice: उसे रौंद न डालें
  rationale: καταπατέω का सजीव अर्थ ‘रौंदना’ रखा गया है। यूनानी αὐτά बहुवचन है और संभवतः अभी वर्णित निर्माणों या पूरे किलेबंद स्थल को सामूहिक रूप से सूचित करता है; हिन्दी में ‘उसे’ सिय्योन पर्वत/स्थल के लिए सहज है।
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: जैसा उन्होंने पहले किया था
  rationale: यह पूर्व में हुई वैसी ही कार्रवाई की ओर संकेत करने वाला स्वाभाविक भूतपूर्व हिन्दी रूप है।
theological_decisions:
- issue: τὰ ἔθνη का ऐतिहासिक-धार्मिक अर्थ
  choice: जातियाँ
  alternative: गैर-यहूदी लोग
  rationale: ‘जातियाँ’ यूनानी शब्द के मूल बहुवचन अर्थ को बनाए रखता है और बाद की किसी तकनीकी धार्मिक धारणा को मुख्य पाठ में आरोपित नहीं करता। प्रसंगगत वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: αὐτά के वचन और संकेत का निर्वाह
  choice: उसे
  alternative: उन्हें
  rationale: यूनानी सर्वनाम बहुवचन है, पर उसका संकेत दीवारों-मीनारों अथवा किलेबंद परिसर की ओर सामूहिक रूप से हो सकता है। हिन्दी में ‘उसे’ पूरे सिय्योन स्थल को संदर्भित करते हुए अधिक स्वाभाविक है; इस व्याकरणिक अस्पष्टता से कोई सिद्धान्तगत निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रौंद न डालें’ मूल की प्रबल क्रिया को सुरक्षित रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित शब्द के तुरंत बाद दिया गया है।
