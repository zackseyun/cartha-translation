base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: hi
  text: परन्तु पवित्रस्थान में खाने को कुछ नहीं था, क्योंकि वह सातवाँ वर्ष था[a]; और राष्ट्रों[b] से बचकर यहूदिया आए हुए लोग संचित रसद का जो कुछ बचा था, उसे खा चुके थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सातवें वर्ष का विश्राम-वर्ष, जब कृषि-उत्पादन सीमित रहता था; इसी से भोजन की कमी समझ में आती है।
    reason: cultural_note
  - marker: b
    text: या, “अन्यजातियों।” यूनानी में “राष्ट्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: खाने को कुछ
  rationale: यह खाद्य सामग्री के व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है और घेराबंदी की परिस्थिति में किसी विशेष प्रकार के भोजन का संकेत नहीं देता।
- source_word: ἐν τοῖς ἁγίοις
  choice: पवित्रस्थान में
  rationale: यूनानी बहुवचन का शाब्दिक अर्थ ‘पवित्र स्थानों में’ हो सकता है, पर प्रसंग में मंदिर-परिसर अभिप्रेत है; ‘पवित्रस्थान’ sacred location को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: क्योंकि वह सातवाँ वर्ष था
  rationale: यह यूनानी वाक्य के स्पष्ट शब्दों को बनाए रखता है; विश्राम-वर्ष होने का आशय मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में समझाया गया है।
- source_word: οἱ ἀνασωζόμενοι
  choice: बच निकलकर ... आए लोगों
  rationale: प्रसंग में वे लोग अभिप्रेत हैं जो अन्य लोगों या उनके क्षेत्रों से सुरक्षित निकलकर यहूदिया पहुँचे थे।
- source_word: ἀπὸ τῶν ἐθνῶν
  choice: राष्ट्रों के बीच से
  rationale: यह ‘राष्ट्रों’ के मूल यहूदी-यूनानी मुहावरे को सुरक्षित रखता है और ‘अन्यजातियों’ की संभावित धार्मिक अर्थच्छाया को मुख्य पाठ पर आरोपित नहीं करता।
- source_word: κατέφαγον
  choice: खा लिया था
  rationale: क्रिया उपलब्ध सामग्री के पूरी तरह उपभोग को दर्शाती है; ‘भी’ से यह स्पष्ट होता है कि बचा हुआ भाग तक समाप्त हो गया था।
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: संचित रसद का बचा हुआ भाग
  rationale: ὑπόλιμμα शेष भाग और παραθέσεως इस खाद्य-संकट के प्रसंग में रखी या संचित सामग्री को सूचित करता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘सातवाँ वर्ष’ को मुख्य पाठ में विश्राम-वर्ष के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘सातवाँ वर्ष’ रखा गया
  alternative: ‘विश्राम-वर्ष’ या ‘सब्त-वर्ष’
  rationale: यूनानी पाठ स्वयं ‘सातवाँ वर्ष’ कहता है। ऐतिहासिक संकेत संभवतः कृषि-कार्य सीमित रहने वाले विश्राम-वर्ष की ओर है, पर उसे अनुवाद में प्रतिस्थापित करने के बजाय पादटिप्पणी में बताया गया है।
- issue: ἐθνῶν का अनुवाद
  choice: राष्ट्रों
  alternative: अन्यजातियों; विदेशी जातियों
  rationale: ‘राष्ट्रों’ मूल अभिव्यक्ति की वास्तविक व्यापकता और यहूदी-यूनानी मुहावरे को बनाए रखता है; ‘अन्यजातियों’ को वैकल्पिक अर्थ के रूप में पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ऐतिहासिक गद्य रखा गया है। ‘पवित्रस्थान’, ‘संचित रसद’ और ‘बचा हुआ भाग’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की सांस्कृतिक और शब्दार्थगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
