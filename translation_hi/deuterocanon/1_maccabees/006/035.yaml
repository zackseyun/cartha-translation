  yaml_path: translation/deuterocanon/1_maccabees/006/035.yaml
  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: hi
  text: उन्होंने उन पशुओं[b] को सैन्य दलों में बाँट दिया[a]। हर हाथी के पास[c] उन्होंने जंजीरी कवच पहने हुए एक हजार सैनिक तैनात किए, जिनके सिरों पर काँसे के टोप थे; और हर पशु के लिए पाँच सौ चुने हुए घोड़े भी तैनात किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैन्य पांतों में” अथवा “व्यूहों में।” यूनानी वाक्यांश का यहाँ ठीक अर्थ निश्चित नहीं है, पर सैन्य अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “पशु”; प्रसंग से अभिप्राय हाथियों से है।
    reason: lexical_alternative
  - marker: c
    text: या “हर हाथी पर” अथवा “हर हाथी के लिए।” यूनानी संबंधबोधक शब्द के एक से अधिक अर्थ संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: बाँट दिया
  rationale: क्रिया का अर्थ बाँटना या वितरित करना है; यहाँ यह सैन्य व्यवस्था को दर्शाती है।
- source_word: τὰ θηρία
  choice: उन पशुओं
  rationale: यूनानी पाठ में शाब्दिक रूप से ‘पशु’ है। प्रसंग से वे हाथी हैं, पर स्रोत की शब्दावली बनाए रखी गई है।
- source_word: εἰς τὰς φάραγγας
  choice: सैन्य दलों में
  rationale: यह वाक्यांश प्रसंग में कठिन है। यहाँ स्थलाकृतिक अर्थ के बजाय सैन्य पांतों, व्यूहों या दलों का अर्थ अधिक संभावित है; ‘सैन्य दलों में’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: παρέστησαν
  choice: तैनात किए
  rationale: सैन्य प्रसंग में पास खड़ा करने या नियत स्थान पर लगाने का भाव है।
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: हर हाथी के पास
  rationale: ἐπί के साथ चतुर्थी यहाँ ‘पास’, ‘पर’ या ‘के लिए’ हो सकता है। एक हजार सैनिकों के हाथी पर सवार होने का अनुचित संकेत टालते हुए ‘पास’ चुना गया है, और अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: जंजीरी कवच पहने हुए एक हजार सैनिक
  rationale: ἁλυσιδωτοῖς जंजीरनुमा कवच का संकेत देता है। ‘सैनिक’ सैन्य प्रसंग में ἄνδρας के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περικεφαλαῖαι χαλκαῖ
  choice: कांसे के टोप
  rationale: यह सिर की कांस्य रक्षा-वस्तु का सीधा और सुबोध अनुवाद है।
- source_word: πεντακόσιοι ἵπποι
  choice: पाँच सौ ... घोड़े
  rationale: यूनानी पाठ में ἵπποι का सीधा अर्थ ‘घोड़े’ है, न कि ‘घुड़सवार’; इसलिए अंग्रेज़ी परामर्श-पाठ से अलग होकर मूल पाठ का रूप रखा गया है।
- source_word: διατεταγμένοι ... ἐκλελεγμένοι
  choice: चुने हुए ... तैनात किए गए थे
  rationale: दोनों कृदंत क्रमशः सुव्यवस्थित/नियुक्त किए जाने और चुन लिए जाने का भाव व्यक्त करते हैं।
