base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/007.yaml
  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
translation:
  language: hi
  text: और उन्होंने उस घृणित वस्तु को ढा दिया, जिसे उसने यरूशलेम की वेदी पर बनाया था[a]। उन्होंने पवित्रस्थान को पहले की तरह ऊँची दीवारों से घेर दिया, और उसके नगर बेत्सूरा को भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “घृणास्पद वस्तु” भी हो सकता है। यूनानी शब्द उपासना के संदर्भ में अत्यंत घृणित और अपवित्र करने वाली वस्तु के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उसके नगर बेत्सूरा” वाक्यांश संक्षिप्त है। “उसके” का संकेत संभवतः यहूदा की ओर है; इसे उसके अधिकार में आए नगर के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: ढा दिया
  rationale: यह καθαιρέω के बलपूर्वक किसी निर्माण को गिराने या नष्ट करने के भाव को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: τὸ βδέλυγμα
  choice: घृणित वस्तु
  rationale: βδέλυγμα किसी अत्यंत घृणास्पद वस्तु को दर्शाता है और यहाँ उपासना-संबंधी दूषण का विशेष भाव रखता है। यह अनुवाद उस अर्थ को बनाए रखता है, पर मूल में अनुपस्थित किसी विस्तृत पारंपरिक पदबंध को नहीं जोड़ता।
- source_word: ᾠκοδόμησεν
  choice: बनाया था
  rationale: क्रिया का मूल अर्थ ‘बनाना/निर्माण करना’ है। हिन्दी में पूर्ण भूतकाल उस पहले हो चुके कार्य को स्पष्ट करता है जिसका बाद में ध्वंस किया गया।
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: वेदी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ वेदी के ऊपर स्थित या निर्मित होने का भाव देता है; ‘वेदी पर’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: मन्दिर-संदर्भ में ἁγίασμα पवित्र स्थल या पवित्र परिसर को सूचित करता है। ‘पवित्रस्थान’ धार्मिक गरिमा और पर्याप्त अर्थ-विस्तार दोनों को सुरक्षित रखता है।
- source_word: καθὼς τὸ πρότερον
  choice: पहले की तरह
  rationale: यह पदबंध पूर्व अवस्था की पुनर्स्थापना व्यक्त करता है; चुना हुआ रूप सरल, स्पष्ट और मूल के निकट है।
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: ऊँची दीवारों से घेर दिया
  rationale: ἐκύκλωσαν का मूल भाव चारों ओर घेरना है और तृतीया τείχεσιν ὑψηλοῖς उस साधन को बताती है। यह अनुवाद ‘किलेबंदी की’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: उसके नगर बेत्सूरा को भी
  rationale: यह संक्षिप्त यूनानी वाक्यांश बेत्सूरा को भी उसी क्रिया का अतिरिक्त कर्म बनाता है। αὐτοῦ को ‘उसके’ के रूप में सुरक्षित रखा गया है, ताकि उसके संदर्भ को अनुवाद में अनावश्यक रूप से निश्चित न किया जाए।
theological_decisions:
- issue: उपासना-संबंधी संदर्भ में βδέλυγμα का अनुवाद
  choice: घृणित वस्तु
  alternative: घृणास्पद वस्तु
  rationale: यह शब्द उपासना को दूषित करने वाली अत्यंत आपत्तिजनक वस्तु का भार रखता है। ‘घृणित वस्तु’ उस धार्मिक-सांस्कृतिक तीव्रता को बनाए रखता है, पर मूल यूनानी में न पाए जाने वाले ‘उजाड़ने वाली’ जैसे शब्द नहीं जोड़ता।
- issue: αὐτοῦ के संकेत का संदर्भ
  choice: उसके नगर बेत्सूरा
  alternative: उसके अधिकार में नगर बेत्सूरा
  rationale: निकट कथानक में ‘उसके’ का संकेत संभवतः यहूदा की ओर है, पर यूनानी सर्वनाम स्वयं इसे विस्तार से नहीं बताता। इसलिए मूल की संक्षिप्तता और संभावित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘पवित्रस्थान’, ‘वेदी’ और ‘घृणित वस्तु’ जैसे पद धार्मिक संदर्भ को बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण पाठक के लिए सहज है।
