- from: और मैंने अपने मन में कहा, “मैं कैसी विपत्ति और कितने बड़े तूफ़ान में आ पड़ा हूँ, जिसमें मैं अब हूँ! क्योंकि मैं दयालु और प्रिय था।”
  to: और मैंने अपने मन में कहा, “मैं कितनी विपत्ति और कितने बड़े तूफ़ान में आ पड़ा हूँ, जिसमें मैं अब हूँ! क्योंकि मैं भला और प्रिय था।”
  rationale: The revision restores a parallel Hindi interrogative construction corresponding to the Greek Ἕως τίνος ... καὶ ... and uses “भला” for the broader sense of χρηστός. It retains the present-state clause and the explicit causal force of ὅτι without resolving its contextual tension by importing a concessive meaning.
