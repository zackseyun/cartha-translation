  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: hi
  text: और मैंने अपने मन में कहा, “मैं कितनी विपत्ति और कितने बड़े तूफ़ान में आ पड़ा हूँ, जिसमें मैं अब हूँ! क्योंकि मैं भला और प्रिय था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ καρδίᾳ
  choice: अपने मन में
  rationale: हिन्दी में आंतरिक विचार व्यक्त करने का स्वाभाविक मुहावरा; यूनानी ‘हृदय’ के विचार-केंद्र संबंधी अर्थ को संप्रेषित करता है।
- source_word: θλίψεως
  choice: विपत्ति
  rationale: संकट, क्लेश और दबाव से घिरी दशा को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: κλύδωνος μεγάλου
  choice: कितने बड़े तूफ़ान
  rationale: κλύδων उफनती लहर या प्रचंड समुद्री हलचल का बिंब है; ‘तूफ़ान’ आधुनिक हिन्दी में उस रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: χρηστὸς
  choice: दयालु
  rationale: यहाँ व्यक्ति के सौम्य, कृपालु या भले व्यवहार का संकेत है; ‘दयालु’ संदर्भ में सहज है, यद्यपि ‘भला’ भी संभव है।
- source_word: ἀγαπώμενος
  choice: प्रिय
  rationale: कर्मवाच्य कृदंत का अर्थ ‘जिससे प्रेम किया जाता था’; ‘प्रिय था’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὅτι का संबंध और भाव
  choice: क्योंकि मैं दयालु और प्रिय था
  alternative: यद्यपि मैं दयालु और प्रिय था
  rationale: ὅτι का सामान्य अर्थ ‘क्योंकि’ है और उपलब्ध यूनानी पाठ स्पष्ट concessive संयोजक नहीं देता। संदर्भ में तर्क तनावपूर्ण लग सकता है, पर उसे ‘यद्यपि’ करके चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मालाप का गरिमापूर्ण और सहज स्वर। विस्मयादिबोधक वाक्य संकट की तीव्रता दिखाता है; समुद्री रूपक को ‘तूफ़ान’ से सुरक्षित रखा गया है।
