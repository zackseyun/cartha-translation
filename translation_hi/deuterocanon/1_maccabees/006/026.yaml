  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: hi
  text: और देखो, आज उन्होंने यरूशलेम के गढ़[a] के विरुद्ध छावनी डाल रखी है, ताकि उसे और पवित्रस्थान को अपने अधिकार में ले लें; और उन्होंने बेत-सूर को किलेबंद कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अक्रा’, यरूशलेम का किलेबंद गढ़।
    reason: मूल शब्द सामान्य रूप से ‘गढ़’ बता सकता है, पर इस प्रसंग में वह विशिष्ट ऐतिहासिक अक्रा का नाम भी हो सकता है।
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: और देखिए
  rationale: यह ध्यान आकर्षित करने वाला वाक्य-सूचक है। ‘और देखिए’ इसकी तात्कालिकता को आधुनिक, सम्मानपूर्ण हिन्दी में व्यक्त करता है।
- source_word: παρεμβεβλήκασιν
  choice: उन्होंने ... पड़ाव डाल दिया है
  rationale: सैन्य प्रसंग में क्रिया किसी स्थान के विरुद्ध सेना का शिविर लगाने को बताती है; यह अनुवाद बिना अनावश्यक रूप से पूर्ण घेराबंदी मान लिए उस भाव को रखता है।
- source_word: ἐπὶ τὴν ἄκραν
  choice: गढ़ के विरुद्ध
  rationale: ἄκρα का अर्थ दुर्ग या गढ़ हो सकता है और यहाँ सम्भवतः यरूशलेम का विशिष्ट ‘अक्रा’ गढ़ अभिप्रेत है। मुख्य पाठ में सामान्य अर्थ रखा गया है और ऐतिहासिक नाम की सम्भावना पादटिप्पणी में दी गई है।
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: ताकि उस पर ... अधिकार कर लें
  rationale: τοῦ के साथ क्रियारूप उद्देश्य व्यक्त करता है, और καταλαμβάνω यहाँ सैन्य रूप से किसी स्थान को अपने अधिकार में लेने के अर्थ में है।
- source_word: τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह पवित्र धार्मिक परिसर या धाम को सूचित करता है; ‘पवित्रस्थान’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: τὴν Βεθσούραν
  choice: बेत-सूर
  rationale: स्थान-नाम का रूप मूल से निकट और हिन्दी पाठक के लिए उच्चारणयोग्य रखा गया है।
- source_word: ὠχύρωσαν
  choice: किलेबंद कर दिया है
  rationale: यह क्रिया किसी स्थान को रक्षा-साधनों से दृढ़ करने का सैन्य भाव व्यक्त करती है।
