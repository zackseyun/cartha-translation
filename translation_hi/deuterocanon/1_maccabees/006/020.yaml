  text: एक सौ पचासवें वर्ष में; और उसने उनके विरुद्ध प्रक्षेप्य फेंकने वाले यंत्र[a] और घेराबंदी के यंत्र बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अस्त्र चलाने वाले यंत्र”; यूनानी शब्द प्रक्षेप्य चलाने वाले उपकरणों को दर्शाता है और आवश्यक नहीं कि उसका अर्थ किसी एक विशेष प्रकार का युद्ध-यंत्र हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ पचासवें वर्ष में
  rationale: यूनानी संबंधकारक काल-सूचक पदबंध का यह स्वाभाविक हिन्दी रूप है और वर्ष 150 को ठीक व्यक्त करता है।
- source_word: ἐποίησεν
  choice: बनाए
  rationale: ποιέω के सामान्य अर्थ ‘बनाना’ को बनाए रखते हुए यहाँ सैनिक यंत्र तैयार करने का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐπʼ αὐτούς
  choice: उनके विरुद्ध
  rationale: युद्ध और घेराबंदी के प्रसंग में ἐπί का आशय विरोधी पक्ष के विरुद्ध इन यंत्रों के उपयोग से है।
- source_word: βελοστασίεις
  choice: प्रक्षेप्य फेंकने वाले यंत्र
  rationale: यह शब्द तीर या अन्य प्रक्षेप्य चलाने वाले उपकरणों का संकेत देता है; यह अनुवाद किसी एक विशेष प्रकार, जैसे गुलेल या कैटापल्ट, तक अर्थ को सीमित नहीं करता।
- source_word: μηχανάς
  choice: घेराबंदी के यंत्र
  rationale: सैनिक प्रसंग में μηχαναί सामान्य मशीनें नहीं, बल्कि घेराबंदी में काम आने वाले युद्ध-यंत्र हैं।
