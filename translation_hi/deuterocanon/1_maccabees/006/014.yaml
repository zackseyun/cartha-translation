    rationale: Although it can convey disappearance or destruction, this Hindi expression is less idiomatic for a dying speaker and may overemphasize eradication. “नाश हो रहा हूँ” more directly retains the Greek verb’s broad perishing/ruin sense, with ‘मर रहा हूँ’ retained as the lexical alternative.
  - severity: low
    issue: “बड़े शोक से” for λύπῃ μεγάλῃ
    rationale: The instrumental “से” can read chiefly as causative (‘because of grief’). “बड़े दुःख में” more closely conveys the speaker’s condition while remaining natural Hindi and leaving the precise relation appropriately broad.
