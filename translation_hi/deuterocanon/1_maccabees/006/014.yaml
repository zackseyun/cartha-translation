base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: hi
  text: “देखो[a], मैं पराए देश में बड़े दुःख में नाश हो रहा हूँ।” तब उसने फ़िलिप्पुस को, जो उसके मित्रों[b] में से एक था, बुलाया और उसे अपने पूरे राज्य पर नियुक्त कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “देखो, मैं पराए देश में बड़े दुःख में मर रहा हूँ।” यूनानी शब्द ἀπόλλυμαι का अर्थ ‘नाश होना’ या ‘मरना’ हो सकता है, और λύπη का अर्थ ‘शोक,’ ‘दुःख’ या ‘संताप’ हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “मित्रों” से केवल निजी मित्र ही नहीं, बल्कि राजा के किसी निकट सहयोगी या दरबारी पदाधिकारी का संकेत भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और सजीव ध्यानाकर्षक शब्द है तथा वक्ता की बात की तात्कालिकता बनाए रखता है।
- source_word: ἀπόλλυμαι
  choice: मैं ... मिटा जा रहा हूँ
  rationale: यह पद विनाश, नाश होने या मरने की ओर संकेत कर सकता है। प्रसंग में मृत्यु निकट है, फिर भी ‘मिटा जा रहा हूँ’ यूनानी शब्द की अपेक्षाकृत व्यापक अर्थ-छाया को बनाए रखता है।
- source_word: λύπῃ μεγάλῃ
  choice: बड़े शोक से
  rationale: यह λύπη के शोक, दुःख और संताप के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘से’ यहाँ उसकी दशा और संभावित कारण, दोनों की कुछ खुली अर्थवत्ता रहने देता है।
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: पराए देश में
  rationale: यह अपने देश से दूर, दूसरे लोगों की भूमि में होने के भाव को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: यह मूल क्रिया का सीधा अर्थ देता है और औपचारिक रूप से तलब किए जाने का अनावश्यक अतिरिक्त भाव नहीं जोड़ता।
- source_word: Φίλιππον
  choice: फ़िलिप्पुस
  rationale: यूनानी नाम Φίλιππος का देवनागरी लिप्यंतरण।
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: उसके मित्रों में से एक
  rationale: यह पद का सीधा अर्थ रखता है; राजदरबार में ‘मित्र’ एक पदवी भी हो सकती थी, जिसकी सूचना पादटिप्पणी में दी गई है।
- source_word: κατέστησεν
  choice: नियुक्त कर दिया
  rationale: इस प्रसंग में क्रिया किसी व्यक्ति को औपचारिक रूप से अधिकार के पद पर ठहराने को व्यक्त करती है।
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: अपने पूरे राज्य पर
  rationale: यह समस्त राज्य पर अधिकार सौंपे जाने का स्पष्ट और स्वाभाविक हिन्दी रूप है।
