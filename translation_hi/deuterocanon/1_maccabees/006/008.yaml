base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: hi
  text: और ऐसा हुआ कि जब राजा ने ये बातें सुनीं, तो वह स्तब्ध रह गया और बहुत विचलित हो उठा। वह अपने बिछौने पर गिर पड़ा और दुःख के कारण बीमार हो गया, क्योंकि जैसा उसने सोचा था, वैसा उसके लिए नहीं हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए वैसा नहीं हुआ जैसा उसने इरादा किया था।”
    reason: ἐνεθυμεῖτο का अर्थ ‘सोचना’ के साथ-साथ ‘इरादा करना’ भी हो सकता है; यह वैकल्पिक अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: और ऐसा हुआ कि जब ... सुनीं
  rationale: यह यूनानी कथात्मक संक्रमण की सामी शैली को बनाए रखता है और आधुनिक हिन्दी में भी स्वाभाविक तथा स्पष्ट है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: संदर्भ में λόγοι सुने गए समाचार या कथन को दर्शाता है; ‘ये बातें’ सहज हिन्दी है और अर्थ को अनावश्यक रूप से ‘समाचार’ तक सीमित नहीं करता।
- source_word: ἐθαμβήθη
  choice: वह स्तब्ध रह गया
  rationale: क्रिया अचानक आश्चर्य या सदमे से अभिभूत होने का भाव देती है; प्रतिकूल समाचार के संदर्भ में ‘स्तब्ध’ उपयुक्त है, पर ‘भयभीत’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐσαλεύθη σφόδρα
  choice: बहुत विचलित हो उठा
  rationale: σαλεύω का रूपकात्मक अर्थ भीतरी उथल-पुथल है और σφόδρα की तीव्रता ‘बहुत’ से सुरक्षित रहती है।
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: अपने बिछौने पर गिर पड़ा
  rationale: यह मूल की शारीरिक क्रिया को सीधे रखता है। ‘बिस्तर पकड़ लिया’ बीमारी का मुहावरा होता और क्रम को कुछ अधिक व्याख्यायित करता।
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: बीमार हो गया
  rationale: रोग की अवस्था में पड़ने के यूनानी भाव का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἀπὸ τῆς λύπης
  choice: शोक के कारण
  rationale: ἀπό यहाँ कारण बताता है और λύπη गहरे दुःख या शोक को व्यक्त करता है।
- source_word: οὐκ ἐγένετο αὐτῷ καθὼς ἐνεθυμεῖτο
  choice: जैसा उसने सोचा था, वैसा उसके लिए नहीं हुआ
  rationale: यह मूल के कुछ असामान्य, अवैयक्तिक वाक्य-विन्यास और ἐνθυμέομαι के ‘मन में सोचना/इरादा करना’ वाले अर्थ को सुरक्षित रखता है, बिना उसे निश्चित रूप से ‘योजना’ तक सीमित किए।
