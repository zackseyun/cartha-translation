translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। ‘बिछौना’ सामान्य ‘बिस्तर’ से थोड़ा अधिक साहित्यिक है, पर प्राचीन कथानक के लिए सहज है। अंतिम उपवाक्य में मूल यूनानी की अस्पष्टता—राजा की सोच, मंशा या योजना—को ‘सोचा था’ द्वारा खुला रखा गया है।
