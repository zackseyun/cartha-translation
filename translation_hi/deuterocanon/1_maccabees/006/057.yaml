  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: hi
  text: और वे वहाँ से चले जाने की जल्दी कर रहे थे और आग्रह कर रहे थे। तब उसने राजा, सेना के अगुओं और लोगों से कहा, “हम दिन-ब-दिन क्षीण होते जा रहे हैं[a], हमारे पास भोजन बहुत कम है, जिस स्थान पर हमने छावनी डाली है वह सुदृढ़ है[b], और राज्य के कामों का भार हम पर आ पड़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम दिन-ब-दिन चुकते जा रहे हैं”; यूनानी क्रिया का अर्थ घटते जाना, जवाब देना या चुक जाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “किलेबंद है।” यूनानी शब्द किसी स्थान की मजबूती या उसकी किलेबंदी, दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: जल्दी मचा रहे थे और इसके लिए दबाव डाल रहे थे
  rationale: 'दोनों अपूर्णकालीन क्रियाओं की निरंतरता और संयुक्त बल को रखा गया है: पहली शीघ्रता और दूसरी प्रबल आग्रह या दबाव का भाव देती है।'
- source_word: τοῦ ἀπελθεῖν
  choice: वहाँ से चले जाने
  rationale: सैन्य प्रसंग में स्थान छोड़कर जाने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: Ἐκλείπομεν
  choice: हम दिन-ब-दिन चुकते जा रहे हैं
  rationale: ἐκλείπω में घटने, जवाब देने या समाप्त होते जाने की व्यापकता है। ‘चुकते जा रहे हैं’ इसे केवल सैनिक संख्या या शारीरिक दुर्बलता तक सीमित नहीं करता।
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: हमारे पास भोजन बहुत कम है
  rationale: τροφὴ को सामान्य ‘भोजन’ और ὀλίγη को अभाव सूचक स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: οὗ παρεμβάλλομεν
  choice: जिस स्थान पर हमने छावनी डाली है
  rationale: सैन्य पड़ाव के वर्तमान संदर्भ को हिन्दी में स्वाभाविक पूर्णावस्थात्मक रूप से व्यक्त करता है।
- source_word: ὀχυρός
  choice: सुदृढ़
  rationale: यह शब्द स्थान की सामरिक मजबूती या किलेबंदी दर्शाता है; ‘सुदृढ़’ दोनों संभावनाओं को खुला रखता है।
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: राज्य के कामों का भार हम पर आ पड़ा है
  rationale: मुहावरा राज्य-संबंधी मामलों के तत्काल दबाव या दायित्व को दर्शाता है; ‘भार ... आ पड़ा है’ इस दबाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: τοὺς ἄνδρας
  choice: सैनिकों
  rationale: शाब्दिक अर्थ ‘पुरुषों’ है, पर सेना के अगुओं के साथ आए इस सैन्य प्रसंग में यह सामान्य सैनिकों को सूचित करता है।
