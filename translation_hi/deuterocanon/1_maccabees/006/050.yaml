  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: hi
  text: और राजा ने बेतसूरा पर अधिकार कर लिया,[a] और उसकी रक्षा करने के लिए वहाँ एक सैनिक टुकड़ी तैनात कर दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेतसूरा को ले लिया” अथवा “बेतसूरा पर कब्ज़ा कर लिया।” यूनानी क्रिया सामान्य रूप से किसी स्थान को अपने अधिकार में लेने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “वहाँ एक पहरेदार सैन्य दल नियुक्त कर दिया।” यूनानी में उस स्थान को अपने नियंत्रण में बनाए रखने के लिए एक सैन्य दल नियुक्त करने पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: अधिकार कर लिया
  rationale: सैन्य प्रसंग में यह क्रिया किसी स्थान को अपने अधिकार में लेने का भाव देती है। यह हिन्दी में स्वाभाविक है और मूल की अपेक्षाकृत व्यापक अर्थ-सीमा को बनाए रखती है।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: पदवी का सीधा अनुवाद; यहाँ नाम जोड़ने का कोई पाठगत कारण नहीं है।
- source_word: τὴν Βεθσούραν
  choice: बेतसूरा
  rationale: यूनानी रूप Βεθσούρα का देवनागरी लिप्यंतरण किया गया है; इसे इब्रानी रूप से सामंजस्य नहीं दिया गया।
- source_word: ἐπέταξεν
  choice: तैनात कर दी
  rationale: φρουράν और उद्देश्यसूचक τηρεῖν के साथ यह किसी सैन्य दल को उस स्थान पर नियुक्त करने का भाव व्यक्त करता है।
- source_word: φρουράν
  choice: एक सैनिक टुकड़ी
  rationale: यहाँ आशय कब्ज़े में लिए नगर की रक्षा और नियंत्रण के लिए वहाँ रखे गए सैन्य दल से है। साधारण पाठक के लिए यह 'छावनी' की तुलना में अधिक स्पष्ट है।
- source_word: τηρεῖν αὐτήν
  choice: उसकी रक्षा करने के लिए
  rationale: यह वाक्यांश नगर की निगरानी, सुरक्षा और उसे अधिकार में बनाए रखने के उद्देश्य को व्यक्त करता है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए 'रक्षा करने' को चुना गया।
