- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: अंगूरों और शहतूतों का लहू
  rationale: ‘लहू’ मूल के सजीव रूपक को बनाए रखता है, जहाँ लाल रस को रक्त कहा गया है। σταφυλῆς का एकवचन सामूहिक अर्थ हिन्दी में स्वाभाविक बहुवचन ‘अंगूरों’ से व्यक्त हुआ है; μόρων का अर्थ ‘शहतूतों’ है।
- source_word: τοῦ παραστῆσαι
  choice: ताकि उन्हें ... उकसाएँ
  rationale: τοῦ के साथ अनंत क्रिया यहाँ प्रयोजन बताती है। युद्ध-संदर्भ में हाथियों को सक्रिय या उत्तेजित करने का भाव ‘उकसाएँ’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: εἰς τὸν πόλεμον
  choice: युद्ध के लिए
  rationale: यह युद्ध में लगाने या तैयार करने का प्रयोजन व्यक्त करने वाला स्वाभाविक हिन्दी सैन्य प्रयोग है।
