lexical_decisions:
- source_word: προκαταλάβῃ
  choice: उनसे पहले कार्रवाई करेगा
  rationale: क्रिया में दूसरों से पहले कदम उठाने या उनकी कार्रवाई को पहले ही विफल करने का भाव है। यह अनुवाद केवल पीछा करके पकड़ लेने का अर्थ थोपे बिना उस पूर्व-सक्रियता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τάχους
  choice: शीघ्र ही
  rationale: यह पदबंध तत्परता और गति दर्शाता है; ‘शीघ्र ही’ आधुनिक, गरिमापूर्ण हिन्दी में उसकी तात्कालिकता बनाए रखता है।
- source_word: μείζονα τούτων
  choice: इनसे भी बड़े काम
  rationale: यह यूनानी तुलनात्मक अभिव्यक्ति का निकट अनुवाद है। प्रसंग में ‘बड़े’ का आशय अधिक गंभीर या व्यापक काम हो सकता है, पर मुख्य पाठ उस अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: κατασχεῖν
  choice: रोक
  rationale: यहाँ क्रिया का भाव काबू में रखने, थामने या आगे बढ़ने से रोकने का है। ‘रोकना’ सामान्य पाठक के लिए सहज है और राजनीतिक-सैन्य प्रसंग के अनुकूल है।
- source_word: αὐτῶν
  choice: उन्हें
  rationale: यूनानी में संबंधकारक रूप infinitive के साथ है, पर हिन्दी में इसे ‘उन्हें रोकना’ के रूप में कर्म बनाकर कहना स्वाभाविक है।
- source_word: οὐ δυνήσεται
  choice: नहीं सकेगा
  rationale: यह भविष्य की असमर्थता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
