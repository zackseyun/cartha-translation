  yaml_path: translation/deuterocanon/1_maccabees/006/024.yaml
  text: and to follow his commands[a], because those of our people were becoming alienated from us on account of this, except those who were found among us.
translation:
  language: hi
  text: और उसकी आज्ञाओं का पालन करने के लिए, क्योंकि हमारे लोगों में से कुछ लोग इसी कारण हमसे अलग होते जा रहे थे, सिवाय उनके जो हमारे साथ पाए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम यूनानी उपवाक्य की रचना संक्षिप्त और कुछ असामान्य है। इसका अधिक शाब्दिक अनुवाद ‘सिवाय उनके, जो हमसे पाए गए’ होगा; संदर्भ के अनुसार इसका अर्थ ‘जो हमारे बीच/साथ पाए गए’ या ‘जो हमारे पक्ष के पाए गए’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθεῖν
  choice: पालन करने
  rationale: आज्ञाओं के साथ यह क्रिया पीछे चलने से बढ़कर उनके अनुसार चलने या उनका अनुपालन करने का भाव देती है; आधुनिक हिन्दी में ‘पालन करना’ स्वाभाविक है।
- source_word: προστάγμασιν
  choice: आज्ञाओं
  rationale: यह अधिकारपूर्वक दिए गए निर्देशों को सूचित करता है। αὐτοῦ के व्यक्तिगत संबंध के साथ ‘उसकी आज्ञाओं’ सहज और उपयुक्त है।
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: हमारे लोगों में से लोग
  rationale: यूनानी पदबंध का अर्थ शाब्दिक रूप से ‘हमारे लोगों में से वे’ है। यह अनावश्यक रूप से केवल पुरुषों का संकेत जोड़े बिना उसकी संक्षिप्तता को बनाए रखता है।
- source_word: χάριν τούτου
  choice: इसी कारण
  rationale: यह कारण बताने वाला पदबंध है; ‘इसी कारण’ स्पष्ट, स्वाभाविक और τούτου के संकेतात्मक बल के अनुरूप है।
- source_word: ἠλλοτριοῦντο
  choice: अलग होते जा रहे थे
  rationale: अपूर्णकालीन रूप निरंतर चल रही दूरी या विरक्ति की प्रक्रिया दिखाता है। यह हिन्दी सामाजिक और राजनीतिक अलगाव का भाव स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀφʼ ἡμῶν
  choice: हमसे
  rationale: पहली occurrence में ἀπό अलगाव का स्रोत बताता है; ‘हमसे अलग’ इसका सीधा और मुहावरेदार अनुवाद है।
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: सिवाय उनके, जो हमारी ओर के पाए गए
  rationale: πλήν अपवाद प्रस्तुत करता है और εὑρίσκοντο का ‘पाए गए’ रूप सुरक्षित रखा गया है। अंतिम ἀφʼ ἡμῶν संबद्धता या पक्ष का संकेत दे सकता है; ‘हमारी ओर के’ इस अर्थ को व्यक्त करते हुए मूल की असामान्य संक्षिप्तता भी कुछ हद तक बनाए रखता है।
theological_decisions:
- issue: अंतिम ἀφʼ ἡμῶν में स्थान, उद्गम या पक्ष-संबंध का भाव
  choice: हमारी ओर के
  alternative: हममें से / हमारे पक्ष में
  rationale: संदर्भ में यह वक्ताओं से जुड़े या उनके पक्ष के लोगों को सूचित करता प्रतीत होता है, पर यूनानी रचना संक्षिप्त और असामान्य है। इसलिए मुख्य पाठ में संबद्धता का स्वाभाविक संकेत दिया गया है और पादटिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यह पद पिछले वाक्य से जुड़ा हुआ अंश है, इसलिए आरंभ में ‘और’ तथा उद्देश्यसूचक ‘के लिए’ बनाए रखे गए हैं। अंतिम उपवाक्य की स्रोतगत अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
