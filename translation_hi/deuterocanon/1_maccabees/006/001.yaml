- source_word: διεπορεύετο
  choice: से होकर जा रहा था
  rationale: अपूर्ण भूतकाल की जारी गति और किसी क्षेत्र से होकर गुजरने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς ἐπάνω χώρας
  choice: ऊपरी प्रदेशों
  rationale: स्थान-सूचक ‘ऊपरी’ को बनाए रखता है और ‘देशों’ की अपेक्षा χώρας के व्यापक भौगोलिक अर्थ के लिए ‘प्रदेशों’ अधिक स्वाभाविक है।
- source_word: Ἐλυμαΐς
  choice: एलूमाइस
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण है।
- source_word: ἐν τῇ Περσίδι
  choice: फारस के
  rationale: Περσίς के क्षेत्रीय अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है; इसे व्यापक आधुनिक राष्ट्र-राज्य के अर्थ में नहीं लिया जाना चाहिए।
- source_word: πόλις ἔνδοξος
  choice: एक नगर ... प्रसिद्ध है
  rationale: ἔνδοξος का सार्वजनिक ख्याति का भाव रखता है, बिना नैतिक या धार्मिक महिमा का अर्थ जोड़े।
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: धन-दौलत, चाँदी और सोने के लिए
  rationale: सम्बन्धसूचक दत्तिव का स्वाभाविक हिन्दी रूप है और सामान्य सम्पदा के बाद चाँदी तथा सोने की संचयी सूची बनाए रखता है।
