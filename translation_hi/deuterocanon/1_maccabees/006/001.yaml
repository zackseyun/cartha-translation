  text: और राजा अन्तियोखुस ऊपरी प्रदेशों से होकर जा रहा था। उसने सुना कि एलुमाइस में, जो फारस में है,[a] एक नगर है जो धन-दौलत, चाँदी और सोने के लिए प्रसिद्ध है।
