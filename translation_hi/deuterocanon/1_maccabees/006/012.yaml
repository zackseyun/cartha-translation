base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: hi
  text: पर अब मुझे वे बुरे काम याद आ रहे हैं जो मैंने यरूशलेम में किए थे। मैंने वहाँ के चाँदी और सोने के सभी पात्र ले लिए थे और यहूदा के निवासियों को अकारण[a] मिटा देने का आदेश भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना किसी कारण के”; यूनानी मुहावरे का शाब्दिक भाव “व्यर्थ ही” भी हो सकता है।
    reason: मुहावरे διὰ κενῆς की कारणहीनता और व्यर्थता से जुड़ी अर्थ-छायाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: मुझे … याद आ रहे हैं
  rationale: वर्तमानकालीन आत्मस्मरण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν κακῶν
  choice: वे बुरे काम
  rationale: यहाँ κακά वक्ता के अपने नैतिक रूप से बुरे कर्मों को सूचित करता है; ‘बुरे काम’ सामान्य पाठक के लिए ‘बुराइयों’ से अधिक स्वाभाविक है।
- source_word: πάντα τὰ σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: चाँदी और सोने के सभी पात्र
  rationale: मन्दिर से लूटी गई पवित्र वस्तुओं के प्रसंग में σκεύη के लिए ‘पात्र’ ठोस और परंपरागत अर्थ सुरक्षित रखता है।
- source_word: ἐξαπέστειλα τοῦ ἐξᾶραι
  choice: मिटा देने का आदेश भेजा
  rationale: भेजने की क्रिया और उद्देश्यसूचक infinitive को हिन्दी में आदेश भेजने के रूप में स्वाभाविक बनाया गया है; ‘मिटा देना’ ἐξαίρω की पूर्ण निष्कासन या विनाश की तीव्रता रखता है।
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: यहूदा के निवासियों
  rationale: यहूदा प्रदेश में रहने वाले लोगों का संक्षिप्त और स्पष्ट अनुवाद है।
- source_word: διὰ κενῆς
  choice: अकारण
  rationale: यह यूनानी मुहावरा कारण या औचित्य के अभाव को व्यक्त करता है; ‘अकारण’ हिन्दी में संक्षिप्त और सटीक है, जबकि उसकी शाब्दिक छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: अन्तियोकुस द्वारा अपने कर्मों का नैतिक मूल्यांकन
  choice: ‘बुरे काम’ के रूप में स्पष्ट नैतिक स्वीकारोक्ति
  alternative: ‘गलतियाँ’ या ‘हानिकारक काम’
  rationale: κακά केवल दुर्भाग्यपूर्ण परिणाम या राजनीतिक भूल नहीं, बल्कि नैतिक बुराई का बोध कराता है; अनुवाद इस भार को बनाए रखता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: यहूदा के निवासियों के विरुद्ध कार्रवाई का औचित्य
  choice: ‘अकारण’
  alternative: ‘व्यर्थ ही’
  rationale: διὰ κενῆς में कारणहीनता और व्यर्थता की अर्थ-छायाएँ संभव हैं; मुख्य पाठ प्रसंगानुकूल कारणहीनता रखता है और वैकल्पिक शाब्दिक छाया पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘मिटा देना’ विनाश की तीव्रता व्यक्त करता है, जबकि ‘अकारण’ अनावश्यक बोलचाल के बिना मूल मुहावरे का मुख्य आशय देता है।
