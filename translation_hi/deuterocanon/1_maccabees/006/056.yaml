  yaml_path: translation/deuterocanon/1_maccabees/006/056.yaml
  text: he turned back from Persia and Media[a], and the forces that had gone with the king are with him, and that he is seeking to take over the conduct of affairs;
translation:
  language: hi
  text: वह फारस और मादै से लौट आया है[a], और जो सेनाएँ राजा के साथ गई थीं वे उसके साथ हैं, और वह राजकाज का संचालन अपने हाथ में लेने का प्रयत्न कर रहा है;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस उपवाक्य का यूनानी वाक्य-विन्यास कठिन है, विशेषकर उस वाक्यांश में जिसका शाब्दिक रूप लगभग ‘राजा के साथ गई सेनाएँ उसके साथ’ है। अनुवाद कठिनाई को अनुमान से पूरी तरह सुलझाने के बजाय स्वेटे/वेटिकेनस के पाठ के निकट रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: लौट आया है
  rationale: यहाँ क्रिया किसी क्षेत्र से वापस आने को व्यक्त करती है। हिन्दी में समाचार-सूचना के इस प्रसंग में पूर्ण वर्तमान स्वाभाविक है और यूनानी एओरिस्ट की पूर्ण घटना को स्पष्ट करता है।
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: फारस और मादै से
  rationale: यह दोनों भौगोलिक क्षेत्रों का सीधा और प्रचलित हिन्दी रूप है; ἀπό का अर्थ ‘से’ द्वारा व्यक्त किया गया है।
- source_word: αἱ δυνάμεις
  choice: सेनाएँ
  rationale: सैन्य आख्यान में δυνάμεις सशस्त्र सैन्य दलों को सूचित करता है। ‘सेनाएँ’ सामान्य पाठक के लिए स्वाभाविक है और उनकी संख्या या संरचना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: जो सेनाएँ राजा के साथ गई थीं वे उसके साथ हैं
  rationale: पाठ में τῷ βασιλεῖ और μετʼ αὐτοῦ दोनों होने के कारण वाक्य-विन्यास कठिन है। अनुवाद दोनों संबंधों को बनाए रखता है और किसी एक को पाठ से हटाता नहीं; कठिनाई पाद-टिप्पणी में बताई गई है।
- source_word: ζητεῖ
  choice: प्रयत्न कर रहा है
  rationale: वर्तमान काल चल रहे उद्देश्य या प्रयास को दर्शाता है। यह हिन्दी अभिव्यक्ति उस निरंतरता को स्वाभाविक रूप से रखती है।
- source_word: παραλαβεῖν
  choice: अपने हाथ में लेने
  rationale: राजनीतिक-सैन्य प्रसंग में इसका आशय केवल प्राप्त करना नहीं, बल्कि अधिकार या दायित्व संभालना है।
- source_word: τὰ τῶν πραγμάτων
  choice: राजकाज का संचालन
  rationale: यह यूनानी मुहावरा सार्वजनिक मामलों के प्रबंध या संचालन को सूचित करता है। ‘राजकाज का संचालन’ प्रसंगानुकूल, संक्षिप्त और आधुनिक हिन्दी में स्पष्ट है।
