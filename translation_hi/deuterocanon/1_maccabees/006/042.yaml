  text: And Judas and his camp advanced into battle formation, and six thousand men from the king’s camp fell.
translation:
  language: hi
  text: और यहूदा और उसकी छावनी युद्ध के लिए पंक्ति बाँधकर आगे बढ़े, और राजा की छावनी के छह हज़ार आदमी गिर पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισεν
  choice: आगे बढ़े
  rationale: क्रिया का मूल अर्थ ‘निकट आया’ है; εἰς παράταξιν के सैनिक प्रसंग में ‘आगे बढ़े’ युद्ध के लिए निकट आने की गति को स्वाभाविक हिन्दी में व्यक्त करता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: παρεμβολὴ
  choice: छावनी
  rationale: यह सैनिक शिविर या उसमें स्थित सैन्य दल को सूचित कर सकता है। ‘छावनी’ दोनों प्रयोगों में संक्षिप्त और प्रसंगानुकूल है तथा स्रोत की संभावित सामूहिक अर्थच्छाया बनाए रखता है।
- source_word: εἰς παράταξιν
  choice: युद्ध-पंक्ति में
  rationale: παράταξις युद्ध के लिए सजी हुई पंक्ति या गठन को दर्शाता है। ‘युद्ध-पंक्ति में’ केवल ‘युद्ध के लिए’ की अपेक्षा इस सैनिक विन्यास को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ἔπεσαν
  choice: मारे गए
  rationale: युद्ध के प्रसंग में यूनानी ‘गिरे’ मृत्यु का प्रचलित संकेत है। हिन्दी में ‘मारे गए’ आशय को स्वाभाविक और स्पष्ट बनाता है, जबकि मात्र ‘गिर पड़े’ शारीरिक रूप से गिरने का भ्रामक अर्थ दे सकता है।
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: छः हज़ार पुरुष
  rationale: ἄνδρες का सीधा अर्थ ‘पुरुष’ है। यद्यपि प्रसंग में वे योद्धा हैं, ‘सैनिक’ जोड़ने के बजाय स्रोत की शब्दावली को बनाए रखा गया है।
