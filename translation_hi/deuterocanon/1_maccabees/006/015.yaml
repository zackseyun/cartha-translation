lexical_decisions:
- source_word: διάδημα
  choice: राजमुकुट
  rationale: यह राजसत्ता के चिह्न के रूप में पहने जाने वाले मुकुट को दर्शाता है; ‘राजमुकुट’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: στολή
  choice: राजकीय वस्त्र
  rationale: राजकीय प्रसंग में यह विशिष्ट औपचारिक परिधान है; ‘राजकीय वस्त्र’ गरिमा और संदर्भ दोनों व्यक्त करता है, बिना किसी खास प्रकार का वस्त्र मान लेने के।
- source_word: δακτύλιος
  choice: अंगूठी
  rationale: यूनानी शब्द सामान्यतः ‘अंगूठी’ है। प्रसंग में यह अधिकार की मुहर वाली अंगूठी हो सकती है, पर मूल पाठ ‘मुहर’ स्पष्ट नहीं करता।
- source_word: ἀγαγεῖν
  choice: ले आए
  rationale: यह उद्देश्यसूचक अनन्त क्रिया है। यहाँ किसी व्यक्ति को साथ लाने के अर्थ में ‘ले आए’ स्वाभाविक हिन्दी है।
- source_word: διάδημα καὶ τὴν στολὴν αὐτοῦ καὶ τὸν δακτύλιον
  choice: राजमुकुट, अपना राजकीय वस्त्र और अंगूठी
  rationale: सूची में राजकीय अधिकार से जुड़ी तीन अलग वस्तुएँ बनी रहती हैं। αὐτοῦ को निकटतम संज्ञा στολή के साथ जोड़ते हुए ‘अपना राजकीय वस्त्र’ किया गया है।
theological_decisions:
- issue: अधूरे यूनानी पाठ का अनुवाद
  choice: वाक्य को ‘और’ पर अधूरा छोड़ा गया है
  alternative: अगले संदर्भ से छूटा हुआ कथन पूरा करना
  rationale: प्रदान किया गया यूनानी स्रोत καὶ (‘और’) पर समाप्त होता है। स्रोत से बाहर की सामग्री जोड़ना उचित नहीं; पाठगत असंगति पादटिप्पणी में बताई गई है।
