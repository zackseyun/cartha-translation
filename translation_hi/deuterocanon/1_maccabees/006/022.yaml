lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: गए
  rationale: πορεύομαι का अओरिस्ट रूप यहाँ किसी व्यक्ति के पास जाने को व्यक्त करता है; कथात्मक हिन्दी में ‘गए’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: πρὸς τὸν βασιλέα
  choice: राजा के पास
  rationale: πρός के साथ कर्मकारक यहाँ राजा की ओर जाकर उससे मिलने या निवेदन करने का भाव देता है; ‘राजा के पास’ आधुनिक हिन्दी में सहज है।
- source_word: Ἕως πότε
  choice: कब तक
  rationale: यह यूनानी मुहावरा विलंब पर शिकायत या आग्रह से भरा प्रश्न प्रस्तुत करता है; हिन्दी में इसका स्वाभाविक समतुल्य ‘कब तक’ है।
- source_word: οὐ ποιήσεις
  choice: तू ... कुछ नहीं करेगा
  rationale: ποιέω का अर्थ व्यापक रूप से ‘करना’ है। उपलब्ध यूनानी पाठ में कर्म नहीं है और वाक्य अधूरा रह जाता है; ‘कुछ नहीं करेगा’ हिन्दी में प्रश्न को स्वाभाविक रखता है, पर अपेक्षित कार्य को अनावश्यक रूप से निश्चित नहीं करता।
