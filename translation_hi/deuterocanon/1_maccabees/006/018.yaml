base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: hi
  text: उसने उसका नाम यूपातोर रखा। गढ़ के लोग पवित्रस्थान[a] के चारों ओर इस्राएल को घेरे रहते थे, लगातार हानि पहुँचाने की कोशिश करते रहते थे और राष्ट्रों[b] के लिए सहारा बने हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र परिसर”; यूनानी में शब्दशः “पवित्र वस्तुओं/स्थानों” का बहुवचन है, जो संभवतः मंदिर के पवित्र क्षेत्र को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “अन्यजातियों”; यहाँ आशय संदर्भानुसार इस्राएल से बाहर की जातियों या शक्तियों से हो सकता है।
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: उसने उसका नाम ... रखा
  rationale: यह नाम देने के यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और कर्ता तथा कर्म के संबंध को बनाए रखता है।
- source_word: Εὐπάτωρ
  choice: यूपातोर
  rationale: व्यक्तिगत नाम/उपाधि का अर्थानुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: गढ़ के लोग
  rationale: ἄκρα यरूशलेम के किलेबंद गढ़ को सूचित करता है; यह रूप समूह को व्यक्त करता है और अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: συγκλείοντες ... κύκλῳ
  choice: चारों ओर ... घेरे रहते थे
  rationale: सहभागी क्रिया घेरकर रोकने की निरंतर कार्रवाई बताती है, और κύκλῳ से व्यक्त चारों ओर के भाव को स्पष्ट रखती है।
- source_word: τὸν Ἰσραὴλ
  choice: इस्राएल
  rationale: यूनानी पाठ के एकवचन सामूहिक नाम को बनाए रखा गया है।
- source_word: τῶν ἁγίων
  choice: पवित्रस्थान
  rationale: नपुंसकलिंग बहुवचन शब्दशः ‘पवित्र वस्तुएँ/स्थान’ हो सकता है, पर इस प्रसंग में मंदिर अथवा उसके पवित्र परिसर का संकेत है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ζητοῦντες κακὰ
  choice: बुराई करने की ताक में रहते थे
  rationale: यह शत्रुतापूर्ण इरादे और अवसर खोजते रहने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διʼ ὅλου
  choice: लगातार
  rationale: यह मुहावरा निरंतर और बार-बार जारी रहने वाली कार्रवाई व्यक्त करता है।
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: अन्यजातियों का सहारा
  rationale: στήριγμα का मूल भाव सहारा या आधार है; दत्तिव τοῖς ἔθνεσιν बताता है कि गढ़ के लोग उन जातियों के लिए समर्थन का काम करते थे।
theological_decisions:
- issue: ἔθνεσιν का अनुवाद
  choice: अन्यजातियों
  alternative: राष्ट्रों / गैर-यहूदियों
  rationale: प्रसंग में यह इस्राएल से बाहर की शत्रु जातियों या शक्तियों को सूचित करता है। ‘अन्यजातियाँ’ भेद को स्पष्ट करता है, जबकि पादटिप्पणी व्यापक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: τῶν ἁγίων का संदर्भ
  choice: पवित्रस्थान
  alternative: पवित्र परिसर / पवित्र वस्तुएँ या स्थान
  rationale: प्रसंग मंदिर क्षेत्र की ओर संकेत करता है, किंतु यूनानी बहुवचन का दायरा निश्चित रूप से केवल भवन तक सीमित नहीं है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘गढ़’, ‘पवित्रस्थान’ और ‘अन्यजातियाँ’ ऐतिहासिक-धार्मिक प्रसंग को संक्षेप में स्पष्ट करते हैं; यूनानी पाठ की वास्तविक शब्दगत व्यापकता पादटिप्पणियों में सुरक्षित है।
