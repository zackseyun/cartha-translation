  text: And he charged boldly into the middle of the phalanx[a], and kept killing right and left, and they were split apart before him on both sides.
translation:
  language: hi
  text: और वह साहसपूर्वक सेना की पाँत के बीचोंबीच टूट पड़ा, और दाएँ-बाएँ मारता गया; उसके आगे से वे इधर-उधर अलग होते गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके आगे से वे दोनों ओर फटते गए।” यूनानी ἔνθα καὶ ἔνθα का अधिक शाब्दिक अर्थ ‘इधर और उधर’ है और यह दोनों दिशाओं में अलग होने या हटने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέδραμεν
  choice: टूट पड़ा
  rationale: क्रिया केवल दौड़ने नहीं, बल्कि वेग से आक्रमण करने का भाव देती है; ‘टूट पड़ा’ सैन्य आक्रामकता और गति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θράσει
  choice: साहस के साथ
  rationale: दत्तिव यहाँ क्रिया की रीति बताता है; यह अभिव्यक्ति साहसपूर्ण और निर्भीक कार्रवाई का भाव सुरक्षित रखती है।
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: सेना की पाँत के बीचोंबीच
  rationale: φάλαγξ व्यवस्थित सैन्य पाँत अथवा सघन युद्ध-विन्यास को दर्शाता है। ‘सेना की पाँत’ सामान्य पाठक के लिए स्पष्ट है और विशिष्ट सैन्य चित्र बनाए रखता है।
- source_word: ἐθανάτου
  choice: मारता गया
  rationale: अपूर्ण भूतकाल निरंतर अथवा बार-बार की जा रही कार्रवाई दर्शाता है; ‘मारता गया’ आगे बढ़ते हुए लगातार वध करने का भाव देता है।
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: दाएँ-बाएँ
  rationale: यह दोनों ओर का संक्षिप्त और स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐσχίζοντο
  choice: हटते गए
  rationale: मध्य/कर्मवाच्य अपूर्ण रूप पाँतों के उसके आगे दोनों ओर खुलते या अलग होते जाने का चित्र देता है। मुख्य पाठ में ‘हटते गए’ स्वाभाविक है, जबकि अधिक शाब्दिक ‘फटते गए’ को पादटिप्पणी में रखा गया है।
- source_word: ἀπʼ αὐτοῦ
  choice: उसके सामने से
  rationale: संदर्भ में सैनिक उसके आगे बढ़ने पर उससे दूर, दोनों ओर हो रहे हैं; ‘उसके सामने से’ स्थानिक संबंध स्पष्ट करता है।
- source_word: ἔνθα καὶ ἔνθα
  choice: दोनों ओर
  rationale: इस सैन्य संदर्भ और पहले आए ‘दाएँ-बाएँ’ के आधार पर वाक्यांश पाँत के इधर-उधर खुलने को दर्शाता है, यद्यपि अधिक शाब्दिक अर्थ ‘इधर और उधर’ भी संभव है।
