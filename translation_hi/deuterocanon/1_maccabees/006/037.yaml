base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/037.yaml
  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
translation:
  language: hi
  text: और उन पर मज़बूत लकड़ी की मीनारें थीं, जो ऊपर से ढकी हुई थीं—हर पशु[a] पर एक। उन पर युद्ध-यंत्र लगे हुए थे। हर पशु पर बत्तीस योद्धा और उसका भारतीय चालक[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘पशु’ है; प्रसंग से स्पष्ट है कि ये हाथी थे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसका भारतीय।’ इससे सम्भवतः हर हाथी के भारतीय चालक या सँभालने वाले का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι
  choice: लकड़ी की ... मीनारें
  rationale: πύργοι का सामान्य अर्थ ‘मीनारें’ है; यहाँ हाथियों पर बने युद्ध-मंचनुमा ढाँचों के लिए यह सीधा और समझने योग्य रूप है।
- source_word: ὀχυροὶ σκεπαζόμενοι
  choice: मजबूत, ऊपर से ढकी हुई
  rationale: ὀχυροί ढाँचे की दृढ़ता और σκεπαζόμενοι उसके ढके या छाए होने को व्यक्त करता है; अनिश्चित वास्तु-रूप को अधिक स्पष्ट नहीं किया गया।
- source_word: ἐφʼ ἑκάστου θηρίου
  choice: हर पशु पर एक
  rationale: θηρίον का शाब्दिक अर्थ ‘पशु’ है। बहुवचन ‘मीनारें’ और ‘हर पशु’ की वितरणात्मक रचना को स्वाभाविक हिन्दी में ‘हर पशु पर एक’ से स्पष्ट किया गया है।
- source_word: ἐζωσμένοι ἐπʼ αὐτοῖς μηχαναῖς
  choice: जिन पर युद्ध-यंत्र लगाए गए थे
  rationale: ἐζωσμένοι सुसज्जित या कसकर लगाए जाने और μηχαναῖς यंत्रों/उपकरणों को सूचित करता है। प्रसंग सैनिक है, इसलिए ‘युद्ध-यंत्र’ उपयुक्त है।
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  choice: बत्तीस योद्धा
  rationale: यूनानी पदबंध उन बत्तीस पुरुषों को उनके युद्ध करने वाले कार्य से पहचानता है; ‘योद्धा’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: उसका भारतीय चालक
  rationale: शाब्दिक रूप ‘उसका भारतीय’ है। प्रसंग में हाथी को सँभालने वाला व्यक्ति अभिप्रेत है; ‘चालक’ भूमिका स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता सुरक्षित रखती है।
