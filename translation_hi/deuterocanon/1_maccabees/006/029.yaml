lexical_decisions:
- source_word: βασιλέων ἑτέρων
  choice: दूसरे राजाओं
  rationale: ἑτέρων का सीधा और स्वाभाविक अर्थ ‘दूसरे’ है; संबंधसूचक ἀπό को ‘से’ के साथ व्यक्त किया गया है।
- source_word: νήσων θαλασσῶν
  choice: समुद्र के द्वीपों
  rationale: यूनानी बहुवचन का औपचारिक अर्थ सुरक्षित रखा गया है; हिन्दी में ‘समुद्र के द्वीपों’ स्वाभाविक और स्पष्ट है।
- source_word: δυνάμεις μισθωταί
  choice: भाड़े के सैनिक-दल
  rationale: δυνάμεις यहाँ सैन्य टुकड़ियों/दलों को और μισθωταί वेतन पर नियुक्त होने को दर्शाता है; यह पदबंध ‘भाड़े के सैनिक’ की धारणा तथा सामूहिक सैन्य बल—दोनों को व्यक्त करता है।
- source_word: ἦλθον πρὸς αὐτόν
  choice: उसके पास आए
  rationale: गति और गंतव्य को सरल, निकट-औपचारिक हिन्दी में व्यक्त करता है।
