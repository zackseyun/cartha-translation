base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/051.yaml
  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: hi
  text: उसने पवित्रस्थान के विरुद्ध बहुत दिनों तक छावनी डाली। वहाँ उसने प्रक्षेप्य फेंकने वाले यंत्र, युद्ध-यंत्र, आग फेंकने वाले यंत्र, पत्थर फेंकने वाले यंत्र और ‘बिच्छू’[a] स्थापित किए, ताकि तीर चलाए और गोफन के पत्थर फेंके जा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्कॉर्पियन-यंत्र’; यह छोटे आकार का एक सैन्य प्रक्षेपक था।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: छावनी डाली
  rationale: यह क्रिया मूलतः छावनी डालने को व्यक्त करती है। सैन्य प्रसंग में इससे घेराबंदी का भाव मिलता है, पर अनुवाद ने मूल क्रिया से अधिक स्पष्ट घेराबंदी-शब्द नहीं जोड़ा।
- source_word: ἐπὶ τὸ ἁγίασμα
  choice: पवित्रस्थान के विरुद्ध
  rationale: सैन्य क्रिया के साथ ἐπί और कर्मकारक लक्ष्य की ओर शत्रुतापूर्ण स्थिति दिखाते हैं; ἁγίασμα मंदिर के पवित्र परिसर को सूचित करता है।
- source_word: ἡμέρας πολλάς
  choice: बहुत दिनों तक
  rationale: यह अवधि बताने वाला कर्मकारक है; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: ἔστησεν
  choice: खड़े किए
  rationale: यह सैन्य उपकरणों को किसी स्थान पर स्थापित करने का सामान्य अर्थ बनाए रखता है।
- source_word: βελοστασίσεις
  choice: प्रक्षेपास्त्र चलाने वाले यंत्र
  rationale: शब्द βέλη चलाने से जुड़े उपकरणों को दर्शाता है। व्यापक अनुवाद इसे केवल तीर चलाने वाले किसी एक निश्चित प्रकार के यंत्र तक सीमित नहीं करता।
- source_word: μηχανὰς
  choice: युद्ध-यंत्र
  rationale: यह सैन्य प्रसंग में मशीनों या यंत्रों के लिए सामान्य शब्द है; ‘युद्ध-’ प्रसंग को स्पष्ट करता है, पर किसी खास बनावट का अनुमान नहीं लगाता।
- source_word: πυροβόλα
  choice: आग फेंकने वाले यंत्र
  rationale: यौगिक शब्द का सीधा अर्थ आग फेंकने वाली वस्तुएँ है; यह बाद के किसी विशेष तकनीकी हथियार का अनावश्यक संकेत नहीं देता।
- source_word: λιθοβόλα
  choice: पत्थर फेंकने वाले यंत्र
  rationale: यह मूल यौगिक का सीधा अर्थ है और उपकरण को किसी एक निश्चित प्रकार की गुलेल या कैटापल्ट के रूप में अतिनिर्धारित नहीं करता।
- source_word: σκορπίδια
  choice: ‘बिच्छू’
  rationale: यह छोटे सैन्य प्रक्षेपक का ऐतिहासिक नाम है। नाम को पाठ में रखा गया है और आधुनिक पाठक के लिए पादटिप्पणी में समझाया गया है।
- source_word: εἰς τὸ βάλλεσθαι
  choice: ताकि ... चलाए ... फेंके जा सकें
  rationale: सव्यय भाववाचक क्रिया यहाँ उद्देश्य व्यक्त करती है; हिन्दी में निष्प्रयोजक रूप उपकरणों के प्रयोजन को स्वाभाविक ढंग से बताता है।
- source_word: βέλη
  choice: तीर
  rationale: βέλος व्यापक रूप से प्रक्षेपास्त्र हो सकता है, पर साथ में गोफन के प्रक्षेप्यों का उल्लेख होने से यहाँ ‘तीर’ सुगम और प्रसंगानुकूल है।
- source_word: σφενδόνας
  choice: गोफन के पत्थर
  rationale: यहाँ क्रिया जिन वस्तुओं को फेंकने की बात करती है, उस वाक्य-विन्यास में शब्द का अर्थ गोफन से फेंके जाने वाले प्रक्षेप्य लेना सबसे उपयुक्त है।
