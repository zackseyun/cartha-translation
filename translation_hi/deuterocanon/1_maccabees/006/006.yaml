  yaml_path: translation/deuterocanon/1_maccabees/006/006.yaml
  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: hi
  text: और लूसियास आरम्भ में एक बड़ी सेना के साथ आगे बढ़ा, परन्तु उनके सामने से खदेड़ दिया गया; और वे उन हथियारों के द्वारा बलवान हो गए, जिन्हें उन्होंने उन छावनियों से लिया था जिन्हें उन्होंने तहस-नहस कर दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उन हथियारों से प्रबल हुए जिन्हें उन्होंने उन छावनियों से लिया था जिन्हें उन्होंने नष्ट कर दिया था।” यूनानी क्रिया का अर्थ “बलवान हो गए” या “प्रबल हुए” हो सकता है। अंतिम संबंधवाचक वाक्यांश संक्षिप्त सैन्य भाषा में है; उसका सीधा संबंध छावनियों के विनाश से है, यद्यपि वह उनमें स्थित शत्रु-बलों को परास्त करने का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: चढ़ आया
  rationale: सैन्य प्रसंग में यह केवल जाने नहीं, सेना लेकर अभियान पर आगे बढ़ने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: δυνάμει ἰσχυρᾷ
  choice: एक शक्तिशाली सेना लेकर
  rationale: यहाँ δύναμις अमूर्त सामर्थ्य के बजाय सैन्य बल को सूचित करता है; हिन्दी में 'सेना' प्रसंग को स्पष्ट और सहज बनाता है।
- source_word: ἐν πρώτοις
  choice: पहले
  rationale: यह अभियान के आरम्भिक चरण को चिह्नित करता है और बाद के उलटाव से विरोध स्थापित करता है।
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: उनके सामने से खदेड़ दिया गया
  rationale: युद्ध के प्रसंग में निष्क्रिय क्रिया पीछे हटाए या परास्त किए जाने का भाव देती है; 'उनके सामने से' यूनानी मुहावरे की दृश्यात्मकता बनाए रखता है।
- source_word: ἴσχυσαν
  choice: बलवान हो गए
  rationale: क्रिया 'बलवान होना' और 'प्रबल होना' दोनों अर्थ दे सकती है; पकड़े गए हथियारों के साधन से शक्ति बढ़ने का विकासात्मक भाव यहाँ सुरक्षित रखा गया है।
- source_word: ὅπλοις
  choice: उन हथियारों के द्वारा
  rationale: साधनवाचक चतुर्थी को स्पष्ट रखते हुए ὅπλα का सामान्य सैन्य अर्थ दिया गया है।
- source_word: παρεμβολῶν
  choice: छावनियों
  rationale: सैन्य संदर्भ में παρεμβολή का स्वाभाविक अर्थ शिविर या छावनी है।
- source_word: ἐξέκοψαν
  choice: सफाया कर दिया था
  rationale: शाब्दिक 'काट डाला' हिन्दी में छावनियों के साथ अस्वाभाविक है। 'सफाया' विनाशकारी सैन्य कार्रवाई के ठोस भाव को रखता है, जबकि संक्षिप्त यूनानी वाक्यांश की अस्पष्टता पादटिप्पणी में बताई गई है।
