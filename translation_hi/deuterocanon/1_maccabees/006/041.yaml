translation:
  language: hi
  text: उनकी भीड़ की आवाज़, उस भीड़ के कूच की आवाज़ और हथियारों की टकराहट सुनकर सभी लोग विचलित हो उठे; क्योंकि वह छावनी अत्यन्त विशाल और शक्तिशाली थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: काँप उठे
  rationale: यह अपूर्णकालीन कर्मवाच्य रूप सुनने वालों के भीतर उत्पन्न गहरे शारीरिक-भावनात्मक विचलन को व्यक्त करता है। ‘काँप उठे’ इसका सजीव प्रभाव रखता है, पर सीधे ‘भयभीत हो गए’ कहकर कारण को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: φωνῆς πλήθους αὐτῶν
  choice: उनकी विशाल सेना का कोलाहल
  rationale: φωνή यहाँ बड़ी सैन्य भीड़ से उठने वाली सम्मिलित ध्वनि है। πλήθος को प्रसंगानुसार ‘विशाल सेना’ कहना स्वाभाविक है; ‘कोलाहल’ उस सामूहिक ध्वनि को स्पष्ट करता है।
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: उसके आगे बढ़ने की धमक
  rationale: ὁδοιπορία मूलतः यात्रा या चलते जाने को दर्शाता है, किंतु सैन्य प्रसंग में सेना की बढ़ती हुई चाल अभिप्रेत है। ‘धमक’ श्रव्य प्रभाव को सामने लाती है, जिसे सुनने का उल्लेख वाक्य को बाँधता है।
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: हथियारों की टकराहट
  rationale: συγκρουσμός वस्तुओं के आपस में टकराने को और ὅπλα सैन्य उपकरण अथवा हथियारों को दर्शाता है। यह हिन्दी प्रयोग ध्वनि-चित्र को सहज और स्पष्ट रखता है।
- source_word: παρεμβολὴ
  choice: छावनी
  rationale: παρεμβολή का सामान्य अर्थ सैन्य छावनी है। ‘छावनी’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और प्रसंगोचित है।
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: बहुत ही विशाल और शक्तिशाली
  rationale: σφόδρα तीव्रता बढ़ाता है, जबकि μεγάλη आकार और ἰσχυρά सामर्थ्य बताते हैं। यह चयन दोनों भिन्न गुणों तथा बलाघात को बनाए रखता है।
