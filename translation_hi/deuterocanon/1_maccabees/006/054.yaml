  yaml_path: translation/deuterocanon/1_maccabees/006/054.yaml
  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: hi
  text: पवित्र स्थान में केवल थोड़े-से पुरुष रह गए[a], क्योंकि अकाल ने उन पर काबू पा लिया था; और वे बिखर गए, हर एक अपने स्थान को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पवित्र परिसर में।’ यूनानी में शाब्दिक रूप से ‘पवित्र [स्थानों/वस्तुओं] में’ है; यह मंदिर के पवित्र क्षेत्र के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: रह गए
  rationale: यह ὑπολείπω का कर्मवाच्य रूप है और दूसरों के चले जाने के बाद थोड़े लोगों के शेष रह जाने को व्यक्त करता है। हिन्दी में ‘रह गए’ स्वाभाविक रूप से यही परिणाम बताता है।
- source_word: ἐν τοῖς ἁγίοις
  choice: पवित्रस्थान में
  rationale: संदर्भ में यह बहुवचन रूप मंदिर के पवित्र क्षेत्र के लिए प्रयुक्त हुआ है। ‘पवित्रस्थान’ स्थानगत और उपासना-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: ἄνδρες ὀλίγοι
  choice: केवल थोड़े-से पुरुष
  rationale: ἄνδρες विशेष रूप से पुरुषों का उल्लेख करता है और ὀλίγοι उनकी कम संख्या को; ‘केवल थोड़े-से पुरुष’ दोनों बातों को सहज हिन्दी में रखता है।
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: अकाल उन पर प्रबल हो गया था
  rationale: κατακρατέω काबू पा लेने या प्रबल हो जाने का भाव देता है। यह अनुवाद अकाल की दबा देने वाली शक्ति को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: ἐσκορπίσθησαν
  choice: तितर-बितर होकर ... चले गए
  rationale: ग्रीक कर्मवाच्य उनके बिखर जाने का परिणामी भाव देता है। हिन्दी में यह संयुक्त अभिव्यक्ति उनके अलग-अलग दिशाओं में चले जाने को स्वाभाविक ढंग से बताती है।
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: अपने-अपने स्थान को
  rationale: τόπος का सामान्य अर्थ ‘स्थान’ है। ‘घर’ कहना मूल से अधिक निश्चित होता; ‘अपने-अपने स्थान’ मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: मंदिर-संबंधी पद ἐν τοῖς ἁγίοις का अनुवाद
  choice: पवित्रस्थान में
  alternative: पवित्र स्थान में; पवित्र परिसर में
  rationale: यह पद संदर्भ में स्थानगत और मंदिर-संबंधी है। ‘पवित्रस्थान’ स्पष्ट तथा प्रचलित है, जबकि पाद-टिप्पणी यूनानी बहुवचन अभिव्यक्ति की वास्तविक व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य ने यूनानी के दो परिणामों—थोड़े पुरुषों का शेष रहना और सबका अपने-अपने स्थान की ओर बिखर जाना—को स्पष्ट रखा है।
