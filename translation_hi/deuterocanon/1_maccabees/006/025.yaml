  text: वे मार डाले जा रहे थे, और हमारी पैतृक संपत्तियाँ लूटी जा रही थीं। उन्होंने न केवल हम पर, बल्कि उनके सारे क्षेत्रों पर भी हाथ बढ़ाया।[a]
