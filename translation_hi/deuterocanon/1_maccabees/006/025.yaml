- source_word: ἐθανατοῦντο
  choice: वे मारे जा रहे थे
  rationale: अपूर्ण भूतकालीन कर्मवाच्य को जारी या बार-बार होने वाली पिछली कार्रवाई के रूप में व्यक्त करता है; यह अनुवाद कर्मवाच्य और मृत्यु दिए जाने के भाव, दोनों को सहज हिन्दी में रखता है।
