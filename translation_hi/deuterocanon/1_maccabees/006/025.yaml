- source_word: διηρπάζοντο
  choice: लूटी जा रही थीं
  rationale: क्रिया बलपूर्वक छीनने या लूटने का अर्थ देती है; अपूर्ण कर्मवाच्य को भी हिन्दी में सुरक्षित रखा गया है।
- source_word: ἐξέτειναν χεῖρα
  choice: हाथ बढ़ाया
  rationale: शत्रुतापूर्ण कार्रवाई के इस रूपक को शाब्दिक चित्र सहित रखा गया है; ‘के विरुद्ध’ उसका आशय स्पष्ट करता है।
- source_word: ὅρια
  choice: क्षेत्रों
  rationale: ὅρια सीमा-रेखाओं के साथ-साथ उनसे निर्धारित भूभागों को भी सूचित कर सकता है। प्रसंग में ‘क्षेत्रों’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: αὐτῶν
  choice: उनके
  rationale: यूनानी सर्वनाम को बिना उसके संदर्भ को अनावश्यक रूप से स्पष्ट किए रखा गया है, जिससे मूल की संभावित संदर्भगत अस्पष्टता बनी रहती है।
