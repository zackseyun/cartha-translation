translation:
  language: hi
  text: वह शीघ्रता से वहाँ से चला और अन्ताकिया लौट गया। वहाँ उसने फिलिप्पुस को नगर पर अधिकार किए हुए पाया। उसने उसके विरुद्ध युद्ध किया और बलपूर्वक नगर पर कब्ज़ा कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν κατὰ σπουδήν
  choice: जल्दी से वहाँ से चला
  rationale: ἀπῆρεν स्थान से प्रस्थान को और κατὰ σπουδήν शीघ्रता तथा तत्परता को व्यक्त करता है। यह हिन्दी रूप दोनों भाव स्वाभाविक ढंग से रखता है।
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: अन्ताकिया लौट गया
  rationale: यह पद पहले के स्थान अन्ताकिया की ओर वापस जाने को दर्शाता है; ‘लौट गया’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: उसने देखा कि फिलिप्पुस नगर पर अधिकार किए हुए है
  rationale: εὗρεν यहाँ पहुँचकर किसी स्थिति को विद्यमान पाने के अर्थ में है, और κυριεύοντα नगर पर प्रभुत्व या नियंत्रण बताता है। ‘अधिकार किए हुए’ राजकीय उपाधि जोड़े बिना यही भाव देता है।
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: उसने उसके विरुद्ध युद्ध किया
  rationale: πολεμέω सैनिक संघर्ष को सूचित करता है; ‘युद्ध किया’ प्रसंग के अनुरूप और स्रोत के निकट है।
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: बलपूर्वक नगर पर कब्ज़ा कर लिया
  rationale: κατελάβετο यहाँ नगर को अपने नियंत्रण में लेने और βίᾳ बल के प्रयोग को दर्शाता है। ‘बलपूर्वक ... कब्ज़ा कर लिया’ परिणाम और साधन दोनों स्पष्ट करता है।
