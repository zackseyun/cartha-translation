  text: judgment[a], and avenge our brothers? We are pleased to serve your father and to walk according to what is said by him[c][b],
translation:
  language: hi
  text: न्याय[a], और हमारे भाइयों के लिए न्याय दिलाओगे?[b] हम तुम्हारे पिता की सेवा करने और उनकी कही बातों के अनुसार चलने को तैयार हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त यूनानी पाठ में यह पद वाक्य के बीच से आरम्भ होता है; ‘न्याय’ सम्भवतः पिछली उपवाक्य की बात को आगे बढ़ाता है।
    reason: textual_variant
  - marker: b
    text: या, “हमारे भाइयों का बदला लोगे?” यूनानी क्रिया का अर्थ किसी का बदला लेना या उसके लिए न्याय प्राप्त करना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात्, “उनकी कही बातों के अनुरूप आचरण करना।” यूनानी में शाब्दिक रूप से “उनके द्वारा कही गई बातों के अनुसार चलना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσιν
  choice: न्याय
  rationale: प्राप्त यूनानी पाठ यहाँ वाक्य के बीच से आरम्भ होता है। ‘न्याय’ κρίσιν के न्यायिक अर्थ को बनाए रखता है और खंडित संदर्भ में अनावश्यक रूप से कोई अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: ἐκδικήσεις
  choice: न्याय दिलाओगे
  rationale: यह क्रिया किसी के पक्ष में न्याय कराने या उसका बदला लेने—दोनों अर्थ दे सकती है। मुख्य पाठ में ‘न्याय दिलाओगे’ स्वाभाविक है और प्रतिशोध को अनिवार्य किए बिना मूल की न्याय-संबंधी शक्ति बनाए रखता है।
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: हमारे भाइयों
  rationale: शाब्दिक पारिवारिक शब्द को सुरक्षित रखा गया है; संदर्भ में यह साथी यहूदियों या सहयोद्धाओं को भी सूचित कर सकता है।
- source_word: εὐδοκοῦμεν
  choice: हम ... को तैयार हैं
  rationale: यहाँ क्रिया अनुकूल इच्छा या तत्परता व्यक्त करती है। आधुनिक हिन्दी में ‘तैयार हैं’ ‘प्रसन्न हैं’ की अपेक्षा अधिक स्वाभाविक रूप से राजनीतिक अधीनता स्वीकार करने की इच्छा बताता है।
- source_word: δουλεύειν
  choice: सेवा करने
  rationale: राजकीय-राजनीतिक संदर्भ में यह अधीन होकर सेवा करने को दर्शाता है; ‘दास होने’ से बंधुआपन पर आवश्यकता से अधिक बल पड़ता।
- source_word: τῷ πατρί σου
  choice: तुम्हारे पिता की
  rationale: δουλεύειν के दत्तिव कर्म का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πορεύεσθαι
  choice: चलने
  rationale: कही गई बातों के अनुसार जीवन या आचरण करने का रूपक बनाए रखा गया है और हिन्दी बाइबलीय शैली में यह समझने योग्य है।
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: उनकी कही बातों के अनुसार
  rationale: यूनानी का अर्थ ‘उनके द्वारा कही गई बातों के अनुसार’ है। यह हिन्दी में स्वाभाविक है और इसे विशेष रूप से ‘आज्ञाएँ’ कहकर मूल से अधिक निश्चित नहीं बनाता।
theological_decisions:
- issue: ἐκδικήσεις में प्रतिशोध और न्याय-स्थापन के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘न्याय दिलाओगे’
  alternative: ‘हमारे भाइयों का बदला लोगे’
  rationale: मूल क्रिया दोनों भावों को समेट सकती है। मुख्य पाठ न्याय-स्थापन का व्यापक अर्थ रखता है, जबकि पादटिप्पणी प्रतिशोध वाले वैकल्पिक अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। ‘चलने’ का मूल रूपक सुरक्षित है, पर निष्क्रिय और भारी ‘उनके द्वारा कही गई’ के स्थान पर स्वाभाविक ‘उनकी कही’ रखा गया है। खंडित आरम्भ को बिना पूरा किए उसी रूप में संरक्षित किया गया है।
