base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/062.yaml
  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: hi
  text: और राजा सिय्योन पर्वत में प्रवेश किया। उस स्थान की किलेबंदी[a] को देखकर उसने उस शपथ को, जो उसने खाई थी, तोड़ दिया[b] और चारों ओर की दीवार को ढहा देने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस स्थान का गढ़’ अथवा ‘उस स्थान का दुर्ग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस शपथ को रद्द कर दिया’ अथवा ‘उसका उल्लंघन किया’; यूनानी क्रिया किसी बंधनकारी शपथ को अमान्य ठहराने या उसकी उपेक्षा करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: पर गया
  rationale: सिय्योन पर्वत के साथ आधुनिक हिन्दी में ‘पर गया’ स्वाभाविक है और स्थान में पहुँचने की गति व्यक्त करता है; शाब्दिक ‘में प्रवेश किया’ इस भौगोलिक संदर्भ में असहज होता।
- source_word: τὸ ὄρος Σιών
  choice: सिय्योन पर्वत
  rationale: यह स्थापित भौगोलिक नाम है और ὄρος का सीधा अर्थ ‘पर्वत’ सुरक्षित रखता है।
- source_word: τὸ ὀχύρωμα τοῦ τόπου
  choice: उस स्थान की किलेबंदी
  rationale: ὀχύρωμα किसी सुदृढ़ रक्षात्मक निर्माण या दुर्ग को सूचित करता है। ‘किलेबंदी’ संरचना को अनावश्यक रूप से केवल किला या गढ़ ठहराए बिना सैन्य अर्थ बनाए रखती है।
- source_word: ἠθέτησεν
  choice: तोड़ दी
  rationale: शपथ के संदर्भ में यह बंधनकारी प्रतिज्ञा को अमान्य मानने या उसका उल्लंघन करने की नैतिक गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: अपनी खाई हुई शपथ
  rationale: यह संज्ञा और उसके साथ आए ‘जिसे उसने खाया था’ के भाव को संक्षिप्त, प्रचलित हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: ἐνετείλατο καὶ καθεῖλεν
  choice: ढहाने की आज्ञा दी
  rationale: यूनानी में आज्ञा देने और दीवार गिराए जाने की संयुक्त घटना है। हिन्दी में यह वाक्यांश सैन्य आदेश और उसके अभिप्रेत कार्य को स्वाभाविक रूप से व्यक्त करता है, बिना यह संकेत दिए कि राजा ने अपने हाथों से दीवार ढहाई।
- source_word: τὸ τεῖχος κυκλόθεν
  choice: चारों ओर की दीवार
  rationale: τεῖχος की रक्षात्मक दीवार और κυκλόθεν के चारों तरफ फैले होने—दोनों भावों को स्पष्ट आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: शपथ के संबंध में ἠθέτησεν की नैतिक शक्ति
  choice: उसने अपनी खाई हुई शपथ तोड़ दी
  alternative: उसने अपनी खाई हुई शपथ रद्द कर दी / उसका उल्लंघन किया
  rationale: ‘शपथ तोड़ दी’ राजा द्वारा अपनी बंधनकारी प्रतिज्ञा से फिरने का नैतिक भार स्पष्ट रखता है, पर घटना पर कोई अतिरिक्त धर्मवैज्ञानिक निर्णय नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से ऐतिहासिक वर्णन स्पष्ट होता है; ‘किलेबंदी’, ‘शपथ’ और ‘आज्ञा’ सैन्य तथा औपचारिक प्रसंग के अनुकूल हैं।
