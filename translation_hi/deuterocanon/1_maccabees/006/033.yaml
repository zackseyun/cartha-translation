  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: hi
  text: राजा सुबह तड़के उठा और उसने छावनी को पूरे वेग के साथ[b] बेत-ज़कर्याह के मार्ग से[a] कूच कराया। सेनाओं ने युद्ध के लिए मोर्चा बाँधा और तुरहियाँ फूँकीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेत-ज़कर्याह की ओर जाने वाले मार्ग पर।” यूनानी अभिव्यक्ति उस स्थान की ओर जाने वाले मार्ग के साथ आगे बढ़ने का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके पूरे आवेग के साथ” या “उसके धावे के वेग के साथ।” यूनानी शब्द सैन्य अग्रगमन के धावे, आवेग या तीव्र गति को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν ... τὸ πρωί
  choice: सुबह तड़के उठा
  rationale: यह अभिव्यक्ति बहुत सवेरे उठने या सक्रिय होने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है और प्रस्थान को क्रिया में अनावश्यक रूप से नहीं जोड़ती।
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: छावनी को ... कूच कराया
  rationale: सैन्य प्रसंग में यह छावनी उठाकर संगठित रूप से आगे बढ़ने को दर्शाता है। राजा कर्ता है, इसलिए हिन्दी की प्रेरणार्थक रचना स्वाभाविक है।
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: पूरे वेग से
  rationale: ὁρμήμα सैन्य गति के वेग, धावे या प्रबल अग्रगमन को व्यक्त कर सकता है। चुना हुआ रूप संक्षिप्त और स्वाभाविक है, जबकि पादटिप्पणी मूल की अधिक मूर्त सैन्य छवि बताती है।
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: बेत-जकर्याह की ओर जानेवाले मार्ग पर
  rationale: κατά के साथ ὁδός किसी मार्ग के साथ-साथ या उसके रास्ते आगे बढ़ने का भाव देता है; हिन्दी रूप दिशा और मार्ग दोनों को स्पष्ट रखता है।
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: सेनाओं ने युद्ध के लिए मोर्चा बाँधा
  rationale: मध्यवाच्य क्रिया यहाँ सैनिक दलों के अपने को युद्ध-क्रम में लगाने को दर्शाती है। ‘मोर्चा बाँधा’ आधुनिक हिन्दी में इस सामरिक व्यवस्था को सहज रूप से व्यक्त करता है।
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: तुरहियाँ फूँकीं
  rationale: यह सजातीय क्रिया-संज्ञा रचना अनेक तुरहियों द्वारा दिए गए सैन्य संकेत को व्यक्त करती है; हिन्दी में ‘तुरहियाँ फूँकीं’ सीधा और स्वाभाविक है।
- source_word: Βεθζαχαριά
  choice: बेत-जकर्याह
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है; उसे अर्थानुवादित नहीं किया गया।
