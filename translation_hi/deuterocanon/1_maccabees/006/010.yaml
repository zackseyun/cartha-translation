lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: καλέω यहाँ किसी को अपने पास बुलाने का सामान्य अर्थ देता है; ‘बुलाया’ स्वाभाविक है और ‘तलब किया’ की अनावश्यक राजकीय कठोरता नहीं जोड़ता।
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: अपने सभी मित्रों
  rationale: φίλοι का सीधा अर्थ ‘मित्र’ है। राजदरबार के संदर्भ में यह निकट सहयोगियों या सलाहकारों को भी सूचित कर सकता है, इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: मेरी आँखों से नींद दूर हो गई है
  rationale: यह अनुवाद ἀφίσταται की ‘दूर होना/हट जाना’ वाली गति और ‘आँखों से नींद’ के मूल बिंब को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: मेरा हृदय बैठा जा रहा है
  rationale: क्रिया हृदय में गिरने, ढहने या शिथिल पड़ने की अवस्था व्यक्त करती है। हिन्दी मुहावरा ‘हृदय बैठना’ निराशा और आंतरिक निर्बलता दोनों को व्यक्त करता है, बिना अर्थ को केवल भय तक सीमित किए।
- source_word: ἀπὸ τῆς μερίμνης
  choice: चिंता के मारे
  rationale: μέριμνα यहाँ गंभीर चिंता या व्याकुलता है। ‘चिंता के मारे’ कारणसूचक ἀπό को स्वाभाविक हिन्दी में स्पष्ट करता है।
