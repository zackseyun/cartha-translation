translation:
  language: hi
  text: तब वे उसके विरुद्ध युद्ध करने उठ खड़े हुए। वह भाग गया और बड़े दुःख के साथ वहाँ से बाबुल लौटने के लिए चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: वे उसके विरुद्ध युद्ध करने उठ खड़े हुए
  rationale: यह रूप ἀνίστημι की उठ खड़े होने की छवि और εἰς πόλεμον के युद्ध हेतु विरोध—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔφυγεν
  choice: वह भाग गया
  rationale: क्रिया का सीधा अर्थ भागना है; यह ‘बच निकला’ की अपेक्षा मूल कथन के अधिक निकट है।
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: वहाँ से ... चला गया
  rationale: यह उस स्थान से वास्तविक प्रस्थान और ἐκεῖθεν के स्थान-सूचक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: μετὰ λύπης μεγάλης
  choice: बड़े दुःख के साथ
  rationale: λύπη के दुःख, शोक या व्यथा के अर्थों में से यह सीधा और प्रसंगानुकूल रूप है, जो भाव को अनावश्यक रूप से तीव्र या विशिष्ट नहीं बनाता।
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: बाबुल लौटने के लिए
  rationale: यहाँ अनंत क्रिया उसके चले जाने का उद्देश्य बताती है; ‘लौटने के लिए’ दिशा और वापसी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
