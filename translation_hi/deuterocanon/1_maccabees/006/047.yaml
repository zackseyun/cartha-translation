  text: And they saw the strength of the kingdom and the fierce rush of the forces, and they turned away from them.
translation:
  language: hi
  text: और उन्होंने राज्य की शक्ति और सेनाओं का प्रचंड धावा[a] देखा, और वे उनसे[b] हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेनाओं का टूट पड़ना’ अथवा ‘सेनाओं का आक्रमण।’ यूनानी शब्द युद्ध में बलपूर्वक आगे बढ़ने की गति को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘उनसे’ बहुवचन है। इसका संकेत संभवतः विरोधी सेनाओं की ओर है, हालाँकि यह अभी-अभी वर्णित राजकीय शक्ति को भी समग्र रूप से समेट सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: शक्ति
  rationale: यह शब्द सामर्थ्य या बल को व्यक्त करता है। यहाँ ‘शक्ति’ राज्य की राजनीतिक और सैनिक सामर्थ्य—दोनों के लिए स्वाभाविक और पर्याप्त व्यापक है।
- source_word: βασιλείας
  choice: राज्य
  rationale: βασιλεία का अर्थ राजत्व, राजसत्ता या राज्य हो सकता है। सैनिक प्रसंग में ‘राज्य’ सहज हिन्दी है और शासन की संगठित शक्ति को समेटता है।
- source_word: ὁρμήμα
  choice: प्रचंड धावा
  rationale: यह युद्ध में बलपूर्वक आगे बढ़ने, टूट पड़ने या आक्रमण की गति को दर्शाता है। ‘प्रचंड धावा’ मूल की सजीवता और तीव्रता बनाए रखता है।
- source_word: δυνάμεων
  choice: सेनाओं
  rationale: सैनिक प्रसंग में δυνάμεις का अर्थ सैन्यबल या सेनाएँ है। ‘सेनाओं’ स्पष्ट, सामान्य और मूल के बहुवचन के अनुरूप है।
- source_word: ἐξέκλιναν
  choice: हट गए
  rationale: ἐκκλίνω का मूल अर्थ रास्ते से हटना या मुड़ जाना है। युद्ध के प्रसंग में ‘हट गए’ पीछे हटने का संकेत देता है, पर स्पष्ट पराजय या पलायन जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἀπʼ αὐτῶν
  choice: उनसे
  rationale: यूनानी सर्वनाम बहुवचन है और सबसे निकटवर्ती बहुवचन ‘सेनाओं’ की ओर संकेत कर सकता है। ‘उनसे’ उसका वचन और संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: ἀπʼ αὐτῶν में बहुवचन सर्वनाम का संदर्भ
  choice: ‘उनसे’ रखकर संदर्भ खुला रखा गया है
  alternative: ‘उससे’, अर्थात राज्य की शक्ति या पूरे आक्रमण से
  rationale: यूनानी पाठ स्पष्ट रूप से बहुवचन प्रयोग करता है। इसका सबसे स्वाभाविक पूर्वपद सेनाएँ हैं, फिर भी यह पहले वर्णित शाही शक्ति को सामूहिक रूप से भी समेट सकता है; अनुवाद में इस तनाव को नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण सैनिक वर्णन। ‘प्रचंड धावा’ मूल के गतिशील युद्ध-बिंब को बनाए रखता है; ‘हट गए’ मूल क्रिया के निकट रहते हुए अनावश्यक रूप से ‘भाग गए’ या निर्णायक पराजय का अर्थ नहीं जोड़ता।
