  yaml_path: translation/deuterocanon/1_maccabees/006/055.yaml
  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: hi
  text: और लूसियास ने सुना कि फिलिप्पुस, जिसे राजा अन्तियोकुस ने अपने जीवित रहते अपने पुत्र अन्तियोकुस का पालन-पोषण करने के लिए नियुक्त किया था, ताकि वह राज्य करे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वह राजा बने।” यूनानी क्रिया का अर्थ “राज्य करना” या इस प्रसंग में अधिक स्पष्ट रूप से “राजा बनना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: यहाँ क्रिया प्राप्त समाचार का परिचय देती है। ‘सुना’ सीधा और स्वाभाविक है तथा सूचना मिलने का भाव भी रखता है।
- source_word: κατέστησεν
  choice: नियुक्त किया था
  rationale: क्रिया किसी दायित्व के लिए औपचारिक रूप से ठहराए जाने को व्यक्त करती है। ‘किया था’ से स्पष्ट होता है कि नियुक्ति लूसियास के सुनने से पहले हुई थी।
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: अपने जीवित रहते
  rationale: यह संबंधवाचक पदबंध राजा अन्तियोकुस के जीवनकाल में हुई नियुक्ति को बताता है। यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐκθρέψαι
  choice: पालन-पोषण करने
  rationale: यह बालक को बड़ा करने, उसकी देखरेख और परवरिश करने का व्यापक भाव देता है, बिना किसी अधिक विशिष्ट शैक्षिक भूमिका को जोड़ने के।
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: ताकि वह राज्य करे
  rationale: यह उद्देश्य को व्यक्त करता है और यूनानी क्रिया βασιλεύω के ‘राज्य करना’ वाले सीधे अर्थ को बनाए रखता है। राजा बनने का आशय संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: राजा अन्तियोकुस
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है।
