review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the attempted capture, plundering, failure, and disclosure of the plan/matter to the city's people. However, “नगर पर अधिकार करके” can naturally imply that he first succeeded in taking the city and then tried to plunder it. The Greek infinitives καταλαβεῖν and προνομεῦσαι are coordinated objects of ἐζήτει (“he sought/was trying to capture ... and plunder it”), so both must remain intended, not accomplished, actions.
  naturalness: The Hindi is clear, modern, and appropriately narrative. Replacing “अधिकार करके” with “अधिकार करने” removes the unintended sequential implication while retaining fluent standard Hindi.
  terminology: “नगर,” “लूटने,” and “नगर के लोगों” are suitable. “योजना” is a contextually reasonable rendering of λόγος, and the footnote appropriately retains broader alternatives. “चाल” is somewhat more negatively colored than the Greek requires, but it is explicitly presented only as an alternative; “बात” preserves the needed neutral alternative.
  issues:
  - severity: medium
    issue: “नगर पर अधिकार करके” presents capture as completed before the plundering attempt.
    rationale: The Greek says that he sought/attempted both to capture the city and to plunder it; it does not say that he captured it. “नगर पर अधिकार करने और उसे लूटने का प्रयत्न किया” correctly coordinates the two intended actions.
  revised_text: और वह आया और नगर पर अधिकार करने और उसे लूटने का प्रयत्न किया, पर वह ऐसा न कर सका, क्योंकि उसकी योजना नगर के लोगों को पता चल गई थी।[a]
  revised_footnotes:
