  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: hi
  text: और वह आया और नगर पर अधिकार करने और उसे लूटने का प्रयत्न किया, पर वह ऐसा न कर सका, क्योंकि उसकी योजना नगर के लोगों को पता चल गई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बात नगर के लोगों को पता चल गई थी” या “उसकी चाल नगर के लोगों को पता चल गई थी।” यूनानी शब्द λόγος का अर्थ व्यापक रूप से ‘वचन,’ ‘समाचार,’ ‘बात,’ ‘मामला’ या ‘योजना’ हो सकता है; यहाँ प्रसंग से संकेत मिलता है कि नगर के लोगों को उसके इरादे का पता चल गया था।
