lexical_decisions:
- source_word: καταλαβεῖν
  choice: नगर पर अधिकार करके
  rationale: सैन्य प्रसंग में क्रिया का अर्थ नगर को अपने नियंत्रण में लेना है। ‘नगर पर अधिकार करना’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी अर्थ को स्पष्ट रखता है।
- source_word: προνομεῦσαι
  choice: उसे लूटने
  rationale: यह क्रिया धावा बोलकर माल लूट लेने को व्यक्त करती है। ‘लूटना’ सरल, सीधा और अनावश्यक विस्तार से रहित है।
- source_word: οὐκ ἠδυνάσθη
  choice: वह ऐसा न कर सका
  rationale: यह यूनानी में व्यक्त असमर्थता को सहज हिन्दी में बताता है और दोनों इच्छित कार्यों की ओर संकेत करता है।
- source_word: ἐγνώσθη
  choice: पता चल गई थी
  rationale: यूनानी कर्मवाच्य का आशय यह है कि बात संबंधित लोगों को ज्ञात हो गई। यह हिन्दी में स्वाभाविक रूप से उस अर्थ को बनाए रखता है और जानकारी मिलने का माध्यम निर्दिष्ट नहीं करता।
- source_word: ὁ λόγος
  choice: उसकी योजना
  rationale: इस प्रसंग में λόγος व्यापक रूप से बात, मामला या योजना हो सकता है। विफल प्रयास के कारण के रूप में ‘उसकी योजना’ कथानक से अच्छी तरह मेल खाती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: नगर के लोगों को
  rationale: शाब्दिक अर्थ ‘नगर से होनेवालों को’ है, जिसका प्रसंगगत संकेत नगर के निवासियों या रक्षकों की ओर है। ‘नगर के लोगों को’ स्पष्ट और स्वाभाविक हिन्दी है।
