  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: hi
  text: और वे उसमें से—उस घेरे में बंद होने की दशा से—निकल आए, और इस्राएल के कुछ भक्तिहीन लोग उनसे जा मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: निकल आए
  rationale: यह ἐξέρχομαι के भूतकालीन रूप का सहज हिन्दी अनुवाद है और किसी स्थान या दशा से बाहर आने की गति को स्पष्ट रखता है।
- source_word: ἐξ αὐτοῦ
  choice: उसमें से
  rationale: यूनानी सर्वनाम के संकेत को बनाए रखा गया है; उसके पूर्वपद को पद में स्पष्ट नाम देकर सीमित नहीं किया गया।
- source_word: συγκλεισμοῦ
  choice: घेराबंदी
  rationale: यहाँ प्रसंग सैन्य है और शब्द बंद कर दिए जाने या चारों ओर से घिरे होने की दशा बताता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘घेराबंदी’ चुना गया, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐκολλήθησαν
  choice: साथ हो गए
  rationale: क्रिया किसी दल से जुड़ने या उसके साथ संबद्ध होने को व्यक्त करती है; ‘साथ हो गए’ आधुनिक हिन्दी में सहज है और औपचारिक गठबंधन का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τινες
  choice: कुछ
  rationale: अनिश्चित बहुवचन को सीधे ‘कुछ’ से व्यक्त किया गया है; मूल में निहित न होने के कारण संख्या या पहचान अधिक स्पष्ट नहीं की गई।
- source_word: ἀσεβῶν
  choice: भक्तिहीन लोग
  rationale: यह चयन केवल सामान्य दुष्टता नहीं, बल्कि परमेश्वर के प्रति श्रद्धा या भक्ति के अभाव का धार्मिक-नैतिक भाव बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: ἐξ Ἰσραήλ
  choice: इस्राएल के
  rationale: यह उन लोगों को इस्राएल समुदाय में से आया हुआ बताता है; हिन्दी में संबंधसूचक रूप सबसे सहज है।
theological_decisions:
- issue: ἀσεβῶν का धार्मिक-नैतिक चरित्र
  choice: भक्तिहीन लोग
  alternative: दुष्ट लोग; अधर्मी लोग; नास्तिक लोग
  rationale: ‘भक्तिहीन’ श्रद्धाहीनता और अपवित्र आचरण के भाव को बनाए रखता है। ‘दुष्ट’ अत्यधिक सामान्य है, ‘अधर्मी’ का अर्थ कुछ व्यापक हो सकता है, और ‘नास्तिक’ बौद्धिक ईश्वर-अस्वीकार का ऐसा विशिष्ट अर्थ जोड़ सकता है जो यूनानी शब्द अनिवार्यतः नहीं कहता।
- issue: συγκλεισμοῦ में सैन्य घेराबंदी अथवा सामान्य बंदीकरण
  choice: मुख्य पाठ में ‘घेराबंदी’, पादटिप्पणी में ‘बंद कर रखे जाने की दशा’
  alternative: कैद; बंदीकरण; घेरे में बंद होना
  rationale: निकटवर्ती ऐतिहासिक-सैन्य संदर्भ में ‘घेराबंदी’ स्वाभाविक है, पर शब्द का मूल बल घिरे या बंद किए जाने पर है; इसलिए अधिक व्यापक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी के दोहरे ἐξ को ‘उसमें से—अर्थात् ... से—’ द्वारा अर्थपूर्ण ढंग से बनाए रखा गया है; डैश व्याख्यात्मक पुनर्निर्देशन को दर्शाते हैं।
