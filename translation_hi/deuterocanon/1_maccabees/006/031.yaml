base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: hi
  text: वे इदूमिया से होकर आए और बेत्सूर के विरुद्ध छावनी डाली। वे बहुत दिनों तक लड़ते रहे और उन्होंने घेराबंदी के यंत्र बनाए; लेकिन बेत्सूर के रक्षक बाहर निकले[a], उन यंत्रों को आग लगा दी और वीरता से लड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘बाहर निकला’ क्रिया एकवचन में है, जबकि आस-पास की क्रियाएँ बहुवचन में हैं। सम्भवतः आशय सामूहिक है और बेत्सूर के रक्षकों के धावा बोलकर बाहर निकलने की बात है।
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद ‘पराक्रम से लड़े’ भी हो सकता है; यूनानी क्रिया-विशेषण का शाब्दिक अर्थ ‘पुरुषोचित ढंग से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: इदूमिया से होकर
  rationale: διά के साथ संबंधकारक किसी क्षेत्र के भीतर से होकर जाने का भाव देता है; ‘इदूमिया’ स्थान-नाम का प्रचलित रूप है।
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: बेत्सूर के विरुद्ध छावनी डाली
  rationale: सैन्य प्रसंग में παρεμβάλλω का अर्थ छावनी डालना है और ἐπί के साथ यहाँ किसी स्थान की घेराबंदी के लिए उसके विरुद्ध मोर्चा लगाने का भाव है।
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: वे बहुत दिनों तक लड़ते रहे
  rationale: ἐπʼ ἡμέρας πολλάς अवधि बताता है; अपूर्णतासूचक ‘लड़ते रहे’ लंबे समय तक जारी युद्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μηχανὰς
  choice: घेराबंदी के यंत्र
  rationale: इस सैन्य संदर्भ में μηχαναί सामान्य मशीनें नहीं, बल्कि दुर्ग पर आक्रमण के लिए बनाए गए उपकरण हैं।
- source_word: ἔξηλθεν
  choice: नगर के रक्षक बाहर निकले
  rationale: यूनानी पाठ में क्रिया एकवचन है, पर पहले और बाद की बहुवचन क्रियाएँ तथा घेराबंदी का संदर्भ बेत्सूर के रक्षकों के सामूहिक रूप से बाहर निकलने की ओर संकेत करते हैं। स्पष्टता के लिए निहित कर्ता दिया गया है और पाठगत असंगति पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: उन्होंने उन यंत्रों को आग लगा दी
  rationale: सर्वनाम का निकटतम और प्रसंगानुकूल पूर्वपद घेराबंदी के यंत्र हैं। ‘आग लगा दी’ हिन्दी में जलाने की क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνδρωδῶς
  choice: वीरता से
  rationale: शब्द का शाब्दिक भाव ‘पुरुषोचित ढंग से’ है, पर आधुनिक हिन्दी में ‘वीरता से’ उसके साहसपूर्ण और प्रशंसात्मक आशय को बिना अनावश्यक लैंगिक बल के व्यक्त करता है।
