lexical_decisions:
- source_word: ἀπαγγέλλων
  choice: यह समाचार दिया
  rationale: यह कृदंत किसी बात की सूचना देने या समाचार पहुँचाने का भाव रखता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: Περσίδα
  choice: फ़ारस में
  rationale: यूनानी पद यहाँ उस स्थान को बताता है जहाँ वह था; प्रचलित हिन्दी भौगोलिक नाम 'फ़ारस' रखा गया है।
- source_word: παρεμβολαὶ
  choice: छावनियाँ
  rationale: शब्द का मूल अर्थ सैन्य शिविर या छावनी है; बहुवचन को बनाए रखते हुए अंग्रेज़ी परामर्श-पाठ के 'camps' से भी संगति रखी गई है।
- source_word: γῆν Ἰούδα
  choice: यहूदा देश
  rationale: शाब्दिक अर्थ 'यहूदा की भूमि' है; 'यहूदा देश' आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक भौगोलिक अभिव्यक्ति है।
- source_word: τετρόπωνται
  choice: परास्त हो गई हैं
  rationale: पूर्णकालिक कर्मवाच्य रूप युद्ध में हरा दिए जाने या तितर-बितर किए जाने का परिणाम व्यक्त करता है; 'परास्त' उस सैन्य आशय को स्पष्ट रखता है।
