  choice: फिलिप्पुस के पुत्र सिकंदर
  rationale: यूनानी संरचना में दिए गए पितृनाम को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ὁ βασιλεὺς ὁ Μακεδών
