  rationale: यह पद सिकंदर की क्षेत्रीय पहचान और राजकीय पदवी दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: जिसने सबसे पहले यूनानियों पर राज किया था
  rationale: ‘पर राज किया’ दत्तिव के आशय को स्वाभाविक हिन्दी में व्यक्त करता है और πρῶτος के ऐतिहासिक दावे को बिना व्याख्या जोड़े बनाए रखता है।
