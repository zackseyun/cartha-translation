lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: वह वहाँ ... रहा
  rationale: स्थानसूचक क्रियाविशेषण के साथ εἰμί यहाँ कुछ समय तक वहाँ बने रहने का भाव देता है; यह हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: ἡμέρας πλείους
  choice: बहुत दिनों तक
  rationale: यह पद दिनों की एक लम्बी अवधि बताता है; ‘बहुत दिनों तक’ स्वाभाविक हिन्दी है और अवधि का भाव स्पष्ट रखता है।
- source_word: ἀνεκαινίσθη
  choice: फिर से ... छा गया था
  rationale: ἀνακαινίζω का कर्मवाच्य रूप शोक के नए सिरे से उठने या लौट आने का भाव रखता है। ‘फिर से ... छा गया’ इस पुनरावृत्ति और भावनात्मक बोझ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπ᾽ αὐτόν
  choice: उस पर
  rationale: यह मूल यूनानी के स्थानिक रूपक को बनाए रखता है और ‘शोक छा जाने’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: λύπη μεγάλη
  choice: बड़ा शोक
  rationale: λύπη दुःख या शोक को और μεγάλη उसकी तीव्रता को व्यक्त करता है; ‘बड़ा शोक’ मूल संरचना के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐλογίσατο
  choice: उसने सोचा
  rationale: प्रसंग में क्रिया का अर्थ मन में विचार करना या मान लेना है; ‘सोचा’ सरल है और ‘निष्कर्ष निकाला’ जैसी अधिक प्रबल व्याख्या नहीं जोड़ता।
- source_word: ὅτι ἀποθνήσκει
  choice: कि वह मर रहा है
  rationale: वर्तमानकालीन ἀποθνήσκει मृत्यु की चल रही दशा का तत्काल बोध देता है; हिन्दी अप्रत्यक्ष कथन में ‘मर रहा है’ इस पहलू को बनाए रखता है।
