translation:
  language: hi
  text: जब राजा ने यह सुना, तो वह क्रोधित हो उठा। उसने अपने सभी मित्रों को, अपनी सेना के अधिकारियों को और लगामों के प्रभारी लोगों को इकट्ठा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोधित हो उठा
  rationale: यूनानी क्रिया तीव्र क्रोध की अवस्था में आने को व्यक्त करती है; यह स्वाभाविक हिन्दी में उसका बल बनाए रखती है।
- source_word: τοὺς φίλους αὐτοῦ
  choice: अपने सभी मित्रों
  rationale: ‘मित्र’ यहाँ संभवतः राजदरबार की एक विशिष्ट उपाधि है, पर मूल पाठ केवल संदर्भ से यह संकेत देता है; इसलिए शाब्दिक रूप रखा गया है।
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: अपनी सेना के अधिकारियों
  rationale: ἄρχοντας नेतृत्व/अधिकार रखने वालों और δύναμις यहाँ सैन्य बल को दर्शाता है; ‘सेना के अधिकारी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: लगामों पर नियुक्त लोगों
  rationale: मूल का शब्दशः और कुछ अस्पष्ट रूप सुरक्षित रखा गया है; यह रथों या घुड़सवार व्यवस्था से जुड़े अधिकारियों का संकेत हो सकता है, पर पाठ स्वयं उसे स्पष्ट नहीं करता।
