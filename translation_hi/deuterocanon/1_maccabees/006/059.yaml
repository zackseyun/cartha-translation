  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: hi
  text: और हम उनके लिए यह ठहरा दें कि वे पहले की तरह अपनी विधियों के अनुसार चलें[a]; क्योंकि उनकी उन विधियों के कारण, जिन्हें हमने बाधित कर दिया था[b], वे क्रोधित हुए और उन्होंने ये सब काम किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी विधियों के अनुसार चलें।” यहाँ “चलना” उन विधियों के अनुसार अपना जीवन और आचरण चलाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “बाधित कर दिया” के लिए प्रयुक्त यूनानी क्रिया का मूल अर्थ “तितर-बितर कर देना” है; यहाँ आशय उनकी विधियों और प्रथाओं को बाधित या छिन्न-भिन्न करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: हम ... यह ठहरा दें
  rationale: यह प्रथम पुरुष बहुवचन का आग्रहसूचक रूप है—एक प्रस्ताव, ‘आओ हम ठहरा दें।’ हिंदी में ‘हम ... ठहरा दें’ नीति या व्यवस्था निर्धारित करने का भाव स्वाभाविक रूप से देता है।
- source_word: τοῦ πορεύεσθαι
  choice: कि वे ... जीवन बिताएँ
  rationale: मूल अर्थ ‘चलना/जाना’ है, पर विधियों के साथ यह उनके अनुसार आचरण और जीवन-व्यवस्था चलाने का मुहावरा है। ‘जीवन बिताएँ’ आधुनिक हिंदी में इस आशय को स्पष्ट रखता है।
- source_word: τοῖς νομίμοις αὐτῶν
  choice: अपनी ही विधियों के अनुसार
  rationale: νομίμοις स्थापित विधियों, रीति-विधानों या प्रथाओं को सूचित कर सकता है। यहाँ यहूदी धार्मिक-कानूनी जीवन के संदर्भ में ‘विधियों’ उपयुक्त है; ‘ही’ αὐτῶν के अपनेपन पर बल बनाए रखता है।
- source_word: ὡς τὸ πρότερον
  choice: पहले की तरह
  rationale: पूर्व स्थिति की पुनर्स्थापना बताने वाला सीधा और स्वाभाविक काल-सूचक अनुवाद।
- source_word: χάριν
  choice: के कारण
  rationale: यहाँ χάριν लाभ नहीं, कारण प्रकट करता है।
- source_word: διεσκεδάσαμεν
  choice: हमने भंग कर दिया था
  rationale: क्रिया का मूल बिंब ‘तितर-बितर करना’ है; इस संदर्भ में विधि-व्यवस्था को बाधित, छिन्न-भिन्न या निष्प्रभावी करने का भाव है। ‘भंग कर दिया’ इस बल को रखता है, पर पूर्ण कानूनी उन्मूलन को अनिवार्य नहीं बनाता।
- source_word: ὠργίσθησαν
  choice: वे क्रोधित हुए
  rationale: क्रोधित हो जाने का सीधा, गरिमापूर्ण और तीव्रता को अनावश्यक रूप से न बढ़ाने वाला अनुवाद।
- source_word: ἐποίησαν ταῦτα πάντα
  choice: उन्होंने ये सब काम किए
  rationale: πάντα की समावेशी व्यापकता और पिछले कार्यों की ओर संकेत दोनों सुरक्षित रहते हैं।
