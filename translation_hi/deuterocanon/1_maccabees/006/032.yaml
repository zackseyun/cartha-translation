lexical_decisions:
- source_word: ἀπῆρεν
  choice: चल पड़ा
  rationale: यह क्रिया किसी स्थान से प्रस्थान करने को दर्शाती है। ‘चल पड़ा’ स्वाभाविक हिन्दी है और इसे सैन्य पराजय या पीछे हटने के अर्थ में सीमित नहीं करती।
- source_word: ἄκρας
  choice: गढ़ी
  rationale: ἄκρα यहाँ किलेबंद दुर्ग या यरूशलेम की ‘अक्रा’ नामक गढ़ी को सूचित कर सकता है। मुख्य पाठ में ‘गढ़ी’ साधारण पाठक के लिए स्पष्ट है; स्थान-नाम की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: παρενέβαλεν
  choice: पड़ाव डाला
  rationale: सैन्य सन्दर्भ में क्रिया का अर्थ छावनी लगाना या पड़ाव डालना है। ‘पड़ाव डाला’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: εἰς Βεθζαχαριά
  choice: बेत-जकर्याह में
  rationale: εἰς में दिशा या प्रवेश का भाव है, पर पड़ाव डालने की क्रिया के साथ हिन्दी में प्राप्त स्थान को ‘में’ कहना स्वाभाविक है।
- source_word: ἀπέναντι
  choice: सामने
  rationale: यह शब्द आमने-सामने या विपरीत स्थिति को व्यक्त करता है; ‘सामने’ स्थानिक सम्बन्ध को सहज रूप से बताता है।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: यह संज्ञा सैन्य पड़ाव या सेना की छावनी को दर्शाती है। ‘छावनी’ राजा की सेना के संगठित शिविर के लिए उपयुक्त है।
- source_word: τοῦ βασιλέως
  choice: राजा की
  rationale: सम्बन्धकारक पद का स्वाभाविक हिन्दी रूप ‘राजा की’ है।
