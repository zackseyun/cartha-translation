base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: hi
  text: तब अवारान एलीआज़र ने पशुओं में से एक को राजकीय कवचों से सुसज्जित देखा[a]; वह सब दूसरे पशुओं से ऊँचा था, और ऐसा दिखाई दिया कि राजा उस पर था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘पशु’ कहा गया है; इस प्रसंग में ये युद्ध-हाथी हैं।
    reason: cultural_note
  - marker: b
    text: या, ‘ऐसा लगता था कि राजा उस पर था।’ यूनानी कथन दिखाई देने या प्रतीत होने का भाव व्यक्त करता है, निश्चितता का नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: अवारान कहलाने वाला एलीआज़र
  rationale: Σαυαρὰν व्यक्ति के साथ जुड़ी नाम-जैसी उपाधि है। प्रचलित पहचान ‘अवारान’ को देवनागरी में रखते हुए ‘कहलाने वाला’ हिन्दी में उसकी उपाधिगत भूमिका स्पष्ट करता है।
- source_word: ἐν τῶν θηρίων
  choice: पशुओं में से एक
  rationale: θηρίον का मूल अर्थ ‘पशु’ है। प्रसंग में ये युद्ध-हाथी हैं, पर मूल पद की व्यापकता मुख्य पाठ में सुरक्षित रखी गई है।
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: राजसी कवचों से सुसज्जित
  rationale: θωρακίζω और θώραξ के कवच-संबंधी भाव तथा बहुवचन रूप को स्वाभाविक हिन्दी में व्यक्त करता है; ‘राजसी’ βασιλικοῖς को दर्शाता है।
- source_word: ὑπεράγον πάντα τὰ θηρία
  choice: दूसरे सब पशुओं से ऊँचा था
  rationale: ὑπεράγον यहाँ अन्य पशुओं से दृश्य रूप में ऊपर या अधिक विशाल होने का बोध देता है। ‘ऊँचा था’ अनावश्यक अलंकरण के बिना उस तुलना को व्यक्त करता है।
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: ऐसा दिखाई देता था कि राजा उसी पर है
  rationale: ὤφθη कथन को निश्चित तथ्य नहीं, दिखाई देने वाली बात के रूप में रखता है। हाथी के संदर्भ में ἐν αὐτῷ का स्वाभाविक हिन्दी रूप ‘उसी पर’ है।
