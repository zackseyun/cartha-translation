  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: hi
  text: ये लोग पहले से ही वहाँ मौजूद होते थे, जहाँ कहीं वह पशु[a] होता; और वह जहाँ कहीं जाता, वे उसके साथ जाते और उससे अलग नहीं होते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जानवर’; इस प्रसंग में इसका संकेत हाथी की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ये लोग
  rationale: संकेतवाचक सर्वनाम पिछले प्रसंग में हाथियों के साथ नियुक्त पुरुषों की ओर संकेत करता है। हिन्दी में संदर्भ को स्वाभाविक और स्पष्ट रखने के लिए ‘लोग’ जोड़ा गया है।
- source_word: πρὸ καιροῦ
  choice: पहले से ही
  rationale: यह पद पहले से उपस्थित या तैयार रहने का कालगत भाव देता है; ‘पहले से ही’ सहज हिन्दी में उसी भाव को व्यक्त करता है।
- source_word: οὗ ἂν ᾖ
  choice: जहाँ कहीं ... होता
  rationale: ἄν के साथ यह अनिश्चित स्थानवाचक उपवाक्य है। ‘जहाँ कहीं ... होता’ उसके खुले और बार-बार लागू होने वाले भाव को बनाए रखता है।
- source_word: τὸ θηρίον
  choice: वह पशु
  rationale: यूनानी में सामान्य शब्द ‘पशु/जानवर’ है, यद्यपि प्रसंग में वह हाथी है। मुख्य पाठ में स्रोत की सामान्य संज्ञा रखी गई और संदर्भ फुटनोट में स्पष्ट किया गया है।
- source_word: ἐπορεύετο
  choice: जाता
  rationale: यह गति के लिए सामान्य क्रिया है। ‘जाता’ बिना अतिरिक्त सैन्य अर्थ जोड़े उसके पुनरावृत्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἅμα
  choice: उसके साथ
  rationale: यह साथ-साथ चलने का भाव देता है; हिन्दी में ‘उसके साथ जाते’ इसका स्वाभाविक रूप है।
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: उससे अलग नहीं होते थे
  rationale: इस वाक्यांश में पशु से दूर न हटने और उसके पास बने रहने का भाव है। यह अनुवाद उस निकटता को स्पष्ट रखते हुए यूनानी वाक्यांश के अनुरूप है।
