- source_word: ἔγνων
  choice: मैं जान गया हूँ
  rationale: अओरिस्ट क्रिया यहाँ पहले घटित पहचान के वर्तमान परिणाम को व्यक्त करती है; यह हिंदी में स्वाभाविक है और ‘अब मुझे बोध है’ का भाव रखती है।
