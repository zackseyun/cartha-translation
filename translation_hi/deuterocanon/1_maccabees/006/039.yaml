translation:
  language: hi
  text: जब सूर्य सोने की ढालों पर चमका, तो उनसे पहाड़ भी चमक उठे और आग की मशालों के समान दमकने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: चमका / चमक उठे
  rationale: क्रिया तेज चमक या कौंध को व्यक्त करती है। पहली बार सूर्य के ढालों पर चमकने और दूसरी बार उनसे पहाड़ों के प्रकाशित होने के लिए स्वाभाविक हिन्दी रूप चुने गए हैं।
- source_word: χρυσᾶς ἀσπίδας
  choice: सोने की ढालों
  rationale: यह यूनानी विशेषण का सीधा और स्वाभाविक अनुवाद है; इससे यह अतिरिक्त दावा नहीं किया जाता कि ढालें अनिवार्य रूप से ठोस सोने की थीं।
- source_word: τὰ ὄρη
  choice: पहाड़
  rationale: ὄρη का सामान्य अर्थ पहाड़ या पर्वतीय प्रदेश है; दृश्य की भव्यता बनाए रखने के लिए 'पहाड़' उपयुक्त है।
- source_word: ἀπʼ αὐτῶν
  choice: उनसे
  rationale: यह ढालों से आने वाले परावर्तित प्रकाश को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, बिना मूल से अधिक व्याख्या जोड़े।
- source_word: κατήγαζεν
  choice: दमकने लगे
  rationale: क्रिया प्रकाश फैलाने या उज्ज्वल चमकने का भाव देती है। 'दमकने लगे' मशालों की उपमा के साथ प्रवाहपूर्ण है।
- source_word: ὡς λαμπάδες πυρός
  choice: आग की मशालों के समान
  rationale: यह मूल की सजीव उपमा को निकटता से सुरक्षित रखता है और आधुनिक हिन्दी में स्पष्ट तथा गरिमापूर्ण है।
