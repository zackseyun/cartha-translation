    text: यूनानी क्रिया का अर्थ ‘लहराना’ या ‘धमकी देते हुए हिलाना’ हो सकता है। मूल पाठ में कर्म नहीं कहा गया है; ‘हथियार’ सैन्य संदर्भ के आधार पर जोड़ा गया है।
    reason: lexical_alternative
