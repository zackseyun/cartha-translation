  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: hi
  text: और उसने शेष घुड़सवार सेना को दोनों ओर, छावनी के दोनों पार्श्वों पर तैनात किया; घुड़सवार हथियार लहरा रहे थे[a] और युद्ध-पंक्तियों में सटकर खड़े हो रहे थे[b]।
  philosophy: optimal-equivalence
