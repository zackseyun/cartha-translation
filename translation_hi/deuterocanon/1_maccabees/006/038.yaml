    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: शेष घुड़सवार सेना
  rationale: सैन्य प्रसंग में ἵππος सामूहिक रूप से घुड़सवार सेना को सूचित कर सकता है। यह हिन्दी में स्वाभाविक है और सेना को एक इकाई के रूप में प्रस्तुत करता है।
- source_word: ἔνθεν καὶ ἔνθεν
  choice: दोनों ओर
  rationale: यह मुहावरा यहाँ बिखरे हुए स्थानों के बजाय दो विपरीत ओर तैनाती को दर्शाता है।
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: छावनी के दोनों पार्श्वों पर
  rationale: παρεμβολή का सैन्य अर्थ ‘छावनी’ है और τὰ δύο μέρη उसके दो किनारों या पार्श्वों को सूचित करता है। ‘पार्श्व’ सामरिक भाव बनाए रखता है।
- source_word: κατασείοντες
  choice: अपने हथियार लहरा रहे थे
  rationale: क्रिया धमकी भरे ढंग से किसी वस्तु को हिलाने या लहराने का भाव देती है। यूनानी में कर्म अनकहा है; युद्ध के प्रसंग के आधार पर हिन्दी में ‘हथियार’ स्पष्ट किया गया है और अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: καταφρασσόμενοι
  choice: सटकर खड़े हो रहे थे
  rationale: इस कठिन सैन्य प्रयोग को पंक्तियाँ कसने या गठन को सघन करने की क्रिया के रूप में लिया गया है, न कि निश्चित रूप से ‘पूरी तरह हथियारबंद’ होने के अर्थ में।
- source_word: ἐν ταῖς φάλαγξιν
  choice: युद्ध-पंक्तियों में
  rationale: φάλαγξ विशिष्ट सघन सैन्य गठन है। ‘युद्ध-पंक्तियाँ’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और सैन्य अर्थ भी बनाए रखता है।
