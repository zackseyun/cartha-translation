- source_word: παρεμβολῆς / παρενέβαλεν
  choice: छावनी / छावनी डाली
  rationale: सैन्य प्रसंग में संज्ञा और क्रिया का स्वाभाविक तथा परस्पर संबद्ध हिन्दी रूप; इससे सेना के पड़ाव का भाव स्पष्ट रहता है।
- source_word: ἀνέβησαν
