  rationale: मूल क्रिया के ऊपर जाने के भौगोलिक भाव को बनाए रखता है, जो यरूशलेम की यात्रा के लिए भी स्वाभाविक है।
- source_word: εἰς συνάντησιν αὐτῶν
  choice: उनसे मिलने
