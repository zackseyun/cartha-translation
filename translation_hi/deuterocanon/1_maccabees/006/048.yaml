- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम की ओर
  rationale: εἰς की दिशासूचक शक्ति को सुरक्षित रखता है और यह अनावश्यक रूप से निश्चित नहीं करता कि भेंट नगर के भीतर ही हुई।
- source_word: Ἰουδαίαν
  choice: यहूदिया
  rationale: यहाँ भौगोलिक-राजनीतिक प्रदेश का प्रचलित नाम अभिप्रेत है।
- source_word: ὄρος Σιών
  choice: सिय्योन पर्वत
  rationale: स्थान-नाम का परिचित और पारदर्शी हिन्दी रूप।
