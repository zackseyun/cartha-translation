base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: hi
  text: उसने बेतसूरा के लोगों के साथ समझौता किया और वह नगर से निकल गया, क्योंकि वहाँ उनके पास इतने रसद-सामान नहीं थे कि वे उसमें घिरे रह सकें; क्योंकि वह भूमि के विश्राम का वर्ष था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “भूमि के लिए सब्त था,” अर्थात वह सातवाँ वर्ष जिसमें भूमि को बिना जोते-बोए छोड़ दिया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: उसने बेतसूरा के लोगों के साथ समझौता किया
  rationale: सैन्य घेराबंदी के प्रसंग में यह यूनानी मुहावरा किसी पक्ष के साथ शर्तें तय करने या समझौता करने का भाव देता है।
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: वे नगर से बाहर निकल आए
  rationale: यूनानी क्रिया एकवचन है, पर निकटवर्ती सामूहिक पद ‘बेतसूरा के लोग’ उसके निहित कर्ता हैं; स्वाभाविक हिन्दी में बहुवचन रखा गया है। इससे समर्पण या निष्कासन जैसी अतिरिक्त धारणा नहीं जोड़ी गई।
- source_word: διατροφή
  choice: रसद-सामान
  rationale: घेराबंदी के संदर्भ में यह निर्वाह के लिए आवश्यक भोजन और दूसरी सामग्री को सूचित करता है; ‘रसद-सामान’ केवल भोजन तक अर्थ को सीमित नहीं करता।
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: कि वे उसमें घिरे रह सकें
  rationale: यह नगर के भीतर घेराबंदी की अवस्था में बने रहने का भाव व्यक्त करता है।
- source_word: σάββατον ἦν τῇ γῇ
  choice: उस वर्ष भूमि का विश्राम-वर्ष था
  rationale: शाब्दिक अभिव्यक्ति ‘भूमि के लिए सब्त था’ है। प्रसंग भूमि के सातवें वर्ष के विश्राम की ओर संकेत करता है; आधुनिक हिन्दी में ‘विश्राम-वर्ष’ अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: σάββατον ἦν τῇ γῇ का अभिप्राय
  choice: भूमि का विश्राम-वर्ष
  alternative: भूमि के लिए सब्त था
  rationale: ऐतिहासिक प्रसंग में कृषि भूमि के सातवें वर्ष के विश्राम के कारण उपज और रसद की कमी अभिप्रेत है। मुख्य पाठ स्पष्ट अर्थ देता है, जबकि पादटिप्पणी मूल की संक्षिप्त और कुछ हद तक सांस्कृतिक अभिव्यक्ति को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रसद-सामान’ घेराबंदी के सैन्य प्रसंग के अनुकूल है। ‘विश्राम-वर्ष’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है, और [a] में मूल यूनानी का शाब्दिक रूप दिया गया है।
