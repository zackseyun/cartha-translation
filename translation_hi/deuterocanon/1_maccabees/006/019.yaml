translation:
  language: hi
  text: तब यहूदा ने उन्हें उखाड़ फेंकने का निश्चय किया और उनकी घेराबंदी करने[a] के लिए सारी प्रजा को इकट्ठा किया।
  philosophy: optimal-equivalence
