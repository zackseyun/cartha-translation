    reason: शाब्दिक वैकल्पिक अर्थ और सैनिक मुहावरे की व्याख्या
lexical_decisions:
- source_word: ἐλογίσατο
  choice: निश्चय किया
  rationale: मध्यवाच्य रूप यहाँ केवल विचार करने के बजाय सोच-विचार के बाद किए गए दृढ़ निर्णय को व्यक्त करता है।
- source_word: ἐξᾶραι
  choice: उन्हें वहाँ से उखाड़ फेंकने
  rationale: यह बलपूर्वक हटा देने का भाव रखता है। ‘उखाड़ फेंकना’ उसके विरोधपूर्ण और निर्णायक स्वर को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वहाँ से’ स्थान से हटाने का प्रसंग स्पष्ट करता है।
- source_word: ἐξεκκλησίασεν
  choice: इकट्ठा किया
  rationale: क्रिया का अर्थ लोगों को सभा या सामूहिक कार्य के लिए बुलाकर एकत्र करना है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: πάντα τὸν λαόν
  choice: सारी प्रजा
  rationale: यूनानी पद का सीधा अर्थ ‘समूची प्रजा’ है। प्रसंग में युद्ध के लिए सक्षम समुदाय अभिप्रेत हो सकता है, पर इसे ‘सेना’ बनाना मूल से अधिक विशिष्ट होता।
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: उनकी घेराबंदी करने के लिए
  rationale: सप्रयोजन संबंधवाचक क्रियारूप बताता है कि लोगों को क्यों इकट्ठा किया गया। शाब्दिक अर्थ ‘उनके चारों ओर बैठना’ है, जो सैनिक प्रसंग में घेरा डालने या घेराबंदी करने का मुहावरा है।
