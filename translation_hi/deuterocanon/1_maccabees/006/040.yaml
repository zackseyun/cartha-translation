translation:
  language: hi
  text: राजा की छावनी का एक भाग ऊँचे पहाड़ों पर फैल गया, और कुछ सैनिक नीचे की भूमि पर फैल गए; वे सुरक्षित रूप से और व्यवस्थित गठन में आगे बढ़ते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξετάθη
  choice: फैल गया
  rationale: यह कर्मवाच्य क्रिया भूभाग पर सेना के फैलने या तैनात होने का भाव देती है; ‘फैल गया’ स्वाभाविक हिन्दी में इस विस्तार को व्यक्त करता है।
- source_word: μέρος τι
  choice: एक भाग
  rationale: यह पद सेना के किसी अनिश्चित हिस्से को दर्शाता है; ‘एक भाग’ उस अनिश्चितता को सहज रूप में बनाए रखता है।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: सैन्य प्रसंग में यह शब्द शिविर में ठहरी सेना अथवा उसकी छावनी को सूचित करता है; ‘राजा की छावनी’ मूल अभिव्यक्ति के निकट है।
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: ऊँचे पहाड़ों पर
  rationale: यह भूभाग पर विस्तार को दर्शाता है और ὑψηλά तथा ὄρη दोनों का सीधा अर्थ सुरक्षित रखता है।
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: कुछ सैनिक नीचे के भूभाग में
  rationale: τινες व्यक्तियों के एक अनिश्चित समूह को दर्शाता है, इसलिए हिन्दी में ‘सैनिक’ स्पष्ट किया गया है; substantival τὰ ταπεινά ऊँची पहाड़ियों के विपरीत निचली भूमि को सूचित करता है।
- source_word: ἤρχοντο
  choice: आगे बढ़ते रहे
  rationale: सैन्य प्रसंग और यूनानी अपूर्णकाल निरंतर आगे बढ़ने का भाव देते हैं।
- source_word: ἀσφαλῶς
  choice: सुरक्षित ढंग से
  rationale: यह बिना बाधा या खतरे के सुरक्षित रूप से बढ़ने का भाव बनाए रखता है।
- source_word: τεταγμένως
  choice: क्रमबद्ध पंक्तियों में
  rationale: यह सैन्य व्यवस्था और अनुशासित गठन में आगे बढ़ने को व्यक्त करता है; केवल ‘व्यवस्थित ढंग से’ की अपेक्षा सैन्य भाव अधिक स्पष्ट है।
