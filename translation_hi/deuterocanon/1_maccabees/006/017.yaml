- source_word: κατέστησεν βασιλεύειν
  choice: शासन करने के लिए राजा नियुक्त किया
  rationale: यह पदबंध अन्तियोखुस को राजकीय पद और कार्य सौंपे जाने का भाव रखता है; यह अनुवाद केवल “राजा बनाया” की अपेक्षा βασιλεύειν को भी स्पष्ट करता है।
- source_word: ἀντʼ αὐτοῦ
  choice: उसके स्थान पर
  rationale: यह मृत राजा के उत्तराधिकारी के रूप में अन्तियोखुस की स्थापना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξέθρεψεν
  choice: पालन-पोषण किया था
  rationale: क्रिया किसी बालक को पालने और बड़ा करने का बोध देती है; हिन्दी में यह सम्मानजनक और सामान्य अभिव्यक्ति है।
- source_word: νεώτερον
  choice: छोटी उम्र से
  rationale: यह अन्तियोखुस की कम आयु में हुए पालन-पोषण की ओर संकेत करता है, बिना उसकी ठीक आयु निर्धारित किए।
