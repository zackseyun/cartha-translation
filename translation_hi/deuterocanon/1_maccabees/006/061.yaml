  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
translation:
  language: hi
  text: और राजा और शासकों ने इन शर्तों पर उनसे शपथ खाई[a]; तब वह गढ़ से बाहर निकला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों के विषय में”; शपथ का संबंध पहले बताई गई शर्तों से था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया एकवचन है—“वह बाहर निकला”; निकटवर्ती प्रसंग के आधार पर कुछ लोग इसे सामूहिक अर्थ में “वे बाहर निकले” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: शपथ खाई
  rationale: यह ὄμνυμι के विधिक और औपचारिक भाव को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: ऐतिहासिक आख्यान में βασιλεύς का मानक और स्वाभाविक हिन्दी रूप।
- source_word: οἱ ἄρχοντες
  choice: शासकों
  rationale: यहाँ ἄρχοντες राजनीतिक अधिकार रखने वाले प्रमुख व्यक्तियों को दर्शाता है; ‘शासक’ उसके व्यापक अर्थ को बनाए रखता है।
- source_word: ἐπὶ τούτοις
  choice: इन शर्तों पर
  rationale: यह पद पिछले प्रसंग में रखी गई और स्वीकार की गई शर्तों की ओर संकेत करता है। हिन्दी में यह रूप उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: वह ... बाहर निकला
  rationale: यूनानी क्रिया एकवचन है और उसका कर्ता व्यक्त नहीं किया गया; इसलिए अनिश्चितता को बनाए रखते हुए एकवचन ‘वह’ रखा गया है।
- source_word: τοῦ ὀχυρώματος
  choice: गढ़
  rationale: ὀχύρωμα किसी दृढ़ और सुरक्षित किलेबंद स्थान को दर्शाता है; ‘गढ़’ संक्षिप्त, स्वाभाविक और सैनिक संदर्भ के अनुकूल है।
