  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
translation:
  language: hi
  text: और वह हाथी के नीचे घुस गया और उसने नीचे से उस पर वार किया[a] और उसे मार डाला। हाथी भूमि पर उसके ऊपर गिर पड़ा, और वह वहीं मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे नीचे से घोंप दिया।” इस प्रसंग में यूनानी पदबंध ὑπέθηκεν αὐτῷ कुछ मुहावरेदार है। मुख्य पाठ नीचे से किए गए आक्रमण का भाव रखता है, पर मूल शब्दों से अधिक स्पष्ट रूप से हथियार या प्रहार का ढंग निर्धारित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: घुस गया
  rationale: यह क्रिया किसी तंग स्थान में भीतर सरककर जाने का भाव देती है; प्रसंग में हाथी के नीचे साहसपूर्वक पहुँचने की गति को ‘घुस गया’ स्वाभाविक और सजीव रूप से व्यक्त करता है।
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: हाथी के नीचे
  rationale: यह सीधा स्थानवाचक पदबंध है, जिसे आधुनिक हिन्दी में सहज रूप से इसी तरह कहा जाता है।
- source_word: ὑπέθηκεν αὐτῷ
  choice: नीचे से उस पर वार किया
  rationale: यूनानी पदबंध इस प्रसंग में कुछ मुहावरेदार और कठिन है। यह हाथी के नीचे से किए गए प्रहार को बताता है, पर इस वाक्य में हथियार या घोंपने की क्रिया को स्पष्ट रूप से निर्दिष्ट नहीं करता।
- source_word: ἀνεῖλεν αὐτόν
  choice: उसे मार डाला
  rationale: यह सामान्यतः प्राण ले लेने की क्रिया व्यक्त करता है। ‘मार डाला’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: हाथी उसके ऊपर भूमि पर गिर पड़ा
  rationale: इससे हाथी का भूमि पर गिरना और उसी व्यक्ति के ऊपर आ पड़ना—दोनों स्थानगत तत्व बने रहते हैं। संज्ञा ‘हाथी’ को दोहराने से हिन्दी में सर्वनाम का संदर्भ स्पष्ट रहता है।
- source_word: ἀπέθανεν ἐκεῖ
  choice: वह वहीं मर गया
  rationale: यह यूनानी के सरल निष्कर्ष को बिना अतिरिक्त बल जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
