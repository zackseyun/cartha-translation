    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  choice: युद्ध-मशीनें
  rationale: घेराबंदी के सैन्य प्रसंग में यह शब्द युद्ध में प्रयुक्त यांत्रिक उपकरणों को दर्शाता है। ‘युद्ध-मशीनें’ आधुनिक हिन्दी में स्पष्ट है और मूल के व्यापक अर्थ को ‘घेराबंदी के यंत्र’ की अपेक्षा कम सीमित करता है।
- source_word: πρὸς
  choice: का सामना करने के लिए
  rationale: कर्मकारक के साथ यह पूर्वसर्ग यहाँ विरोधी सैन्य प्रयोजन बताता है। हिन्दी में ‘का सामना करने के लिए’ प्रत्युत्तर में बनाए गए उपकरणों का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπολέμησαν
  choice: वे ... लड़ते रहे
  rationale: क्रिया युद्ध करने को दर्शाती है। ‘बहुत दिनों तक’ के साथ ‘लड़ते रहे’ हिन्दी में दीर्घ अवधि तक जारी युद्ध को सहजता से व्यक्त करता है।
- source_word: ἡμέρας πολλάς
  choice: बहुत दिनों तक
  rationale: यह अवधि बताने वाला कर्मकारक पद है; आधुनिक हिन्दी में ‘बहुत दिनों तक’ इसका स्वाभाविक अनुवाद है।
- source_word: καὶ αὐτοὶ
  choice: उन्होंने भी
  rationale: यह पद बताता है कि इस पक्ष ने भी दूसरे पक्ष के उत्तर में वैसे उपकरण बनाए। ‘उन्होंने भी’ इसके योगात्मक और हल्के बलात्मक अर्थ को संक्षेप में रखता है।
