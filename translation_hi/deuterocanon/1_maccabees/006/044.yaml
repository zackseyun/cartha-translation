- source_word: ἔδωκεν ἑαυτόν
  choice: अपने प्राण दे दिए
  rationale: संदर्भ में व्यक्ति स्वेच्छा से मृत्यु के जोखिम में स्वयं को अर्पित करता है; हिन्दी मुहावरे में यह भाव स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: τοῦ σῶσαι
  choice: बचाने
  rationale: उद्देश्यसूचक infinitive को सहज हिन्दी में उद्देश्य के रूप में प्रस्तुत किया गया है।
- source_word: τὸν λαὸν αὐτοῦ
  choice: अपने लोगों को
  rationale: λαός के सामूहिक अर्थ और αὐτοῦ के संबंध को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: περιποιῆσαι αὐτῷ ὄνομα αἰώνιον
  choice: अपने लिए सदा का नाम कमाने
  rationale: περιποιέω यहाँ अपने लिए प्रतिष्ठा/नाम प्राप्त करने का भाव देता है; 'नाम कमाना' हिन्दी का स्वाभाविक मुहावरा है, और αἰώνιον को 'सदा का' व्यक्त करता है।
