  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: hi
  text: उसके सैन्य बल में कुल एक लाख पैदल सैनिक, बीस हज़ार घुड़सवार[a] और युद्ध के लिए प्रशिक्षित बत्तीस हाथी[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बीस हज़ार घोड़े’; यहाँ ‘घोड़े’ से आशय संभवतः घुड़सवार सैनिकों से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘युद्ध को जानने वाले हाथी’, अर्थात युद्ध के लिए प्रशिक्षित या युद्ध का अनुभव रखने वाले हाथी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς τῶν δυνάμεων
  choice: सैन्य बल में कुल
  rationale: यह प्रयोग सैन्य बल की संख्यात्मक गणना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘कुल’ ἀριθμός के गणनात्मक भाव को सामने लाता है।
- source_word: πεζῶν
  choice: पैदल सैनिक
  rationale: यह घुड़सवार सेना के विपरीत पैदल लड़ने वाले सैनिकों का स्पष्ट और सामान्य हिन्दी पद है।
- source_word: ἵππων
  choice: घुड़सवार
  rationale: यूनानी में शाब्दिक अर्थ ‘घोड़े’ है, पर सैन्य-सूची में यह घोड़ों पर सवार सैनिकों के लिए लक्षणात्मक प्रयोग प्रतीत होता है। मुख्य पाठ में अभिप्रेत अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἐλέφαντες
  choice: हाथी
  rationale: यह सीधा और संदर्भानुकूल हिन्दी समतुल्य है।
- source_word: εἰδότες πόλεμον
  choice: युद्ध के लिए प्रशिक्षित
  rationale: शाब्दिक अर्थ ‘युद्ध को जानने वाले’ है। हाथियों के संदर्भ में यह युद्ध-प्रशिक्षण या युद्ध-अनुभव को सूचित करता है; चुना गया रूप स्वाभाविक है और मुहावरे का आशय स्पष्ट करता है।
