  - marker: b
    text: जिस यूनानी शब्द का अनुवाद ‘भू-भाग का एक हिस्सा’ किया गया है, उसका अर्थ निश्चित नहीं है। वह भू-भाग के विभाजन या सीमांकन, अथवा समझौते के अंतर्गत भूमि सौंपने का संकेत दे सकता है।
