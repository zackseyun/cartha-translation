review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that he was captured alive, that an obligatory settlement was imposed, and that the obligation extended both to him and to subsequent rulers. However, “कुछ भू-भाग” adds the unsupported quantifier “some,” and the difficult διαστολήν should not be made more specific than the source permits in the main text.
  naturalness: “वह और उसके बाद राज करनेवाले, दोनों उन्हें भारी कर दें” is syntactically awkward in modern Hindi; “कर दें” can also be misread as ‘impose a tax on them.’ A plural, explicit construction with “कर अदा करें” is clearer and idiomatic.
  terminology: “जीवित पकड़ लिया,” “भारी कर,” and “बंधक” are suitable. Rendering the hostages as persons given in pledge is slightly clearer in Hindi. “भू-भाग का एक हिस्सा” represents the likely territorial sense without adding the unsupported “कुछ”; the footnote retains the lexical uncertainty.
  issues:
  - severity: medium
    issue: The phrase “कुछ भू-भाग छोड़ दें” adds “कुछ” (‘some’), which is not present in διαστολήν.
    rationale: The Greek noun is difficult and may refer to a division, demarcation, or territorial concession, but it does not specify an indefinite quantity. The translation should avoid introducing that detail.
  - severity: medium
    issue: “...दोनों उन्हें भारी कर दें” is awkward and potentially ambiguous.
    rationale: The Greek requires that he and his successors pay tribute to the conquering party. “भारी कर अदा करें” clearly expresses payment rather than imposing a tax.
  revised_text: और उन्होंने उसे जीवित पकड़ लिया[a]। फिर उन्होंने उन पर यह शर्त लगा दी कि वह स्वयं और उसके बाद राज्य करनेवाले राजा उन्हें भारी कर अदा करें, बंधक के रूप में लोग सौंपें, और भू-भाग का एक हिस्सा दें[b]।
