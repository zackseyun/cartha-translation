  to: और उन्होंने उसे जीवित पकड़ लिया[a]। फिर उन्होंने उन पर यह शर्त लगा दी कि वह स्वयं और उसके बाद राज्य करनेवाले राजा उन्हें भारी कर अदा करें, बंधक के रूप में लोग सौंपें, और भू-भाग का एक हिस्सा दें[b]।
