lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: उसे जीवित पकड़ लिया
  rationale: यह ζῶντα के इस बल को स्पष्ट रखता है कि उसे मारा नहीं गया, बल्कि जीवित अवस्था में बंदी बनाया गया।
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: उन पर यह शर्त लगाई कि ... दें / सौंपें / छोड़ दें
  rationale: यह रचना स्थापित की गई बाध्यकारी राजनीतिक शर्त का भाव देती है; साधारण अनुरोध का नहीं।
- source_word: φόρον μέγαν
  choice: भारी कर
  rationale: φόρος यहाँ अधीन शासक द्वारा विजेता सत्ता को दिया जानेवाला कर है। ‘भारी’ बड़ी मात्रा अथवा कठोर आर्थिक बोझ, दोनों के स्वाभाविक भाव को व्यक्त करता है।
- source_word: ὅμηρα
  choice: बंधक
  rationale: राजनीतिक समझौते की जमानत के रूप में सौंपे गए व्यक्तियों के लिए ‘बंधक’ स्पष्ट और प्रचलित शब्द है।
- source_word: διαστολήν
  choice: कुछ भू-भाग छोड़ दें
  rationale: संधि-संदर्भ में यह कठिन शब्द संभवतः भू-भाग के विभाजन, सीमांकन या हस्तांतरण को सूचित करता है। मुख्य पाठ में स्वाभाविक संभावित अर्थ दिया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: αὐτόν τε καὶ τοὺς βασιλεύοντας μετʼ αὐτόν
  choice: वह और उसके बाद राज करनेवाले, दोनों
  rationale: यह τε καὶ के संयुक्त बल और μετʼ αὐτόν से व्यक्त राजकीय उत्तराधिकार—दोनों को बनाए रखता है।
