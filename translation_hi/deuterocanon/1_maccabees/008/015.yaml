lexical_decisions:
- source_word: βουλευτήριον
  choice: परिषद
  rationale: यह शब्द विचार-विमर्श करने वाली शासकीय संस्था को सूचित करता है। ‘परिषद’ आधुनिक हिन्दी में स्वाभाविक है और ‘सीनेट’ जैसी अधिक विशिष्ट रोमी संस्था का अनावश्यक संकेत नहीं देता।
- source_word: ἐποίησαν ἑαυτοῖς
  choice: अपने लिए ... स्थापित की
  rationale: शाब्दिक अर्थ ‘अपने लिए बनाई’ है, पर संस्थागत सन्दर्भ में ‘स्थापित की’ अधिक स्वाभाविक और सटीक है।
- source_word: καθ' ἡμέραν
  choice: प्रतिदिन
  rationale: यह अभिव्यक्ति नियमित रूप से हर दिन होने वाली क्रिया को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐβουλεύοντο
  choice: विचार-विमर्श करते थे
  rationale: अपूर्ण भूतकाल नियमित या बार-बार होने वाली गतिविधि दिखाता है; हिन्दी का ‘करते थे’ इस अभ्यस्त पक्ष को सुरक्षित रखता है।
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: तीन सौ बीस सदस्य
  rationale: संख्या का सीधा अनुवाद है; हिन्दी में यह स्पष्ट करने के लिए ‘सदस्य’ जोड़ा गया है कि संख्या परिषद में विचार-विमर्श करने वाले व्यक्तियों की है।
- source_word: βουλευόμενοι διὰ παντός
  choice: निरन्तर परामर्श करते थे
  rationale: कृदन्त और διὰ παντός मिलकर लगातार जारी विचार-विमर्श पर बल देते हैं।
- source_word: περὶ τοῦ πλήθους
  choice: जनता के विषय में
  rationale: πλῆθος यहाँ लोगों के सामूहिक निकाय को दर्शाता है। ‘जनता’ हिन्दी में ‘भीड़’ की तुलना में नागरिक सन्दर्भ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: ताकि अपने यहाँ अच्छी व्यवस्था बनाए रखें
  rationale: εὐκοσμεῖν का मूल भाव सुव्यवस्थित रखने का है। ‘अपने यहाँ’ आत्मवाचक ἑαυτούς के सामुदायिक-राजनीतिक आशय को व्यक्त करता है और ‘शासन करना’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
