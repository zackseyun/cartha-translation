translation:
  language: hi
  text: और उन्होंने अपने लिए एक परिषद स्थापित की, और प्रतिदिन तीन सौ बीस विचार-विमर्श करते थे; वे जनता के विषय में निरन्तर परामर्श करते थे, ताकि अपने यहाँ अच्छी व्यवस्था बनाए रखें।
