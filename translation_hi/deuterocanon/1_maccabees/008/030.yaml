  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: hi
  text: पर यदि इन शर्तों के बाद ये और वे[a] कुछ जोड़ने या हटाने का निर्णय करें, तो वे अपनी इच्छा से ऐसा करेंगे; और जो कुछ वे जोड़ें या हटाएँ, वह मान्य[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “दोनों पक्ष”; यूनानी में संकेतवाचक शब्द दोहराए गए हैं, जो समझौते के दोनों पक्षों की ओर संकेत करते हैं।
    reason: lexical_alternative
  - marker: b
    text: “मान्य” का अनुवाद इस कानूनी संदर्भ में “बाध्यकारी” या “प्रभावी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: शर्तों
  rationale: संधि के कानूनी संदर्भ में λόγους केवल ‘बातों’ या ‘शब्दों’ के बजाय निर्धारित शर्तों या उपबंधों को सूचित करता है।
- source_word: βουλεύσωνται
  choice: निर्णय करें
  rationale: यह क्रिया विचार-विमर्श करके निश्चय करने का भाव रखती है; इस शर्तात्मक कानूनी वाक्य में ‘निर्णय करें’ स्वाभाविक और सटीक है।
- source_word: οὗτοι καὶ οὗτοι
  choice: ये और वे
  rationale: दोहराए गए संकेतवाचक दोनों संधि-पक्षों की ओर संकेत करते हैं। ‘ये और वे’ मूल की असामान्य किंतु अर्थपूर्ण द्विपक्षीय अभिव्यक्ति को बनाए रखता है।
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: जोड़ने या हटाने
  rationale: यह युग्म कानूनी शर्तों में संशोधन—कुछ जोड़ने या निकालने—को सीधे व्यक्त करता है।
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: अपनी इच्छा से
  rationale: αἵρεσις यहाँ पंथ नहीं, बल्कि चुनाव या स्वनिर्णय का अर्थ देता है। हिंदी में ‘अपनी इच्छा से’ इस भाव को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: κύρια
  choice: मान्य
  rationale: कानूनी संदर्भ में κύρια का अर्थ वैध, प्रभावी या बाध्यकारी होना है; ‘मान्य’ संक्षिप्त और स्वाभाविक है।
