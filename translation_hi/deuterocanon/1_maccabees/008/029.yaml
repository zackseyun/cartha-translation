    text: या, “इन बातों के अनुसार।” यहाँ यूनानी शब्द संधि में कही गई शर्तों या प्रावधानों को सूचित कर सकता है। साथ ही “यहूदी” का अनुवाद “यहूदिया के निवासी” भी किया जा सकता है।
    reason: ‘शर्तों’ के विधिक अर्थ तथा Ἰουδαίων की जातीय-भौगोलिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: इन शर्तों के अनुसार
  rationale: संधि के कानूनी संदर्भ में λόγοι केवल ‘बातें’ नहीं, बल्कि पहले कही गई शर्तें हैं; यह हिन्दी में स्वाभाविक और विधिक भाव वाला अनुवाद है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पहले वर्णित रीति और प्रावधानों की ओर संकेत करता है तथा यूनानी वाक्य का औपचारिक स्वर बनाए रखता है।
- source_word: ἔστησαν
  choice: समझौता किया
  rationale: ἵστημι का यह रूप राजनयिक संदर्भ में किसी व्यवस्था को स्थापित करने का भाव देता है। यूनानी में ‘संधि’ संज्ञा दोहराई नहीं गई है, इसलिए ‘समझौता किया’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यह निहित वस्तु को स्पष्ट करता है।
- source_word: Ῥωμαῖοι
  choice: रोमियों ने
  rationale: यह जाति-समूह को कर्ता के रूप में दर्शाता है; आधुनिक हिन्दी में ‘रोमियों’ स्वाभाविक रूप है।
- source_word: τῷ δήμῳ
  choice: जनता के साथ
  rationale: δῆμος यहाँ सामूहिक जनता या नागरिक निकाय को सूचित करता है, और सम्प्रदान कारक समझौते के दूसरे पक्ष का बोध कराता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों की
  rationale: Ἰουδαῖοι का अर्थ ‘यहूदी’ या ‘यहूदिया के लोग’ दोनों हो सकता है। इस राजनयिक संदर्भ में सामूहिक यहूदी जनता सम्भावित है; भौगोलिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: Ἰουδαίων का अर्थ-क्षेत्र
  choice: यहूदियों की
  alternative: यहूदिया के लोगों की
  rationale: यह कोई प्रमुख सिद्धान्तगत प्रश्न नहीं, पर ऐतिहासिक पहचान को प्रभावित करता है। यहाँ संबोधन व्यापक सामूहिक जनता का है; फिर भी यूनानी शब्द की भौगोलिक सम्भावना को पादटिप्पणी में बनाए रखा गया है।
- issue: ἔστησαν में निहित व्यवस्था
  choice: समझौता किया
  alternative: व्यवस्था स्थापित की
  rationale: संधि-संदर्भ ‘समझौता’ का समर्थन करता है, पर मूल में समझौते के लिए पृथक संज्ञा नहीं है। चुना हुआ रूप स्पष्ट और स्वाभाविक है, जबकि विकल्प यूनानी की अधिक शब्दशः अनिश्चितता रखता है।
