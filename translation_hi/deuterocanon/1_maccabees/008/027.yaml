  yaml_path: translation/deuterocanon/1_maccabees/008/027.yaml
  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: hi
  text: इसी प्रकार, यदि पहले यहूदी राष्ट्र पर युद्ध आ पड़े, तो रोमी पूरे मन से[a] उनके सहयोगी होकर युद्ध करेंगे, जैसा अवसर उन्हें निर्देशित करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तत्परता से।”
    reason: ἐκ ψυχῆς हार्दिकता के साथ-साथ पूर्ण प्रतिबद्धता या तत्परता का भाव भी व्यक्त कर सकता है।
  - marker: b
    text: या, “जैसी परिस्थितियाँ उन्हें सुझाएँ,” अथवा “जैसा समय उनके लिए निर्धारित करे।”
    reason: अंतिम यूनानी उपवाक्य में और ὑπογράφῃ का मेल अवसर, परिस्थितियों या समय द्वारा संकेत अथवा निर्देश दिए जाने के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: इसी प्रकार
  rationale: यह वाक्यांश पिछली पारस्परिक संधि-शर्तों की ओर संकेत करता है; ‘इसी प्रकार’ उसके तुलनात्मक और संक्रमणकारी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔθνει Ἰουδαίων
  choice: यहूदियों के राष्ट्र
  rationale: ἔθνος यहाँ एक जातीय-राजनीतिक जनसमुदाय अथवा राष्ट्र को दर्शाता है; यह चयन यूनानी संबंधवाचक रचना के निकट रहता है।
- source_word: συμβῇ προτέρῳ πόλεμος
  choice: यदि पहले ... युद्ध आ पड़े
  rationale: ἐάν के साथ संभावनार्थक क्रिया अनिश्चित भावी स्थिति व्यक्त करती है, और προτέρῳ समय की प्राथमिकता बताता है—अर्थात युद्ध पहले यहूदियों पर आए।
- source_word: συμμαχήσουσιν
  choice: उनके सहयोगी होकर युद्ध करेंगे
  rationale: यह क्रिया केवल औपचारिक संधि करने के बजाय सैन्य सहयोग देने का अर्थ रखती है; प्रसंगानुसार ‘युद्ध करेंगे’ इसे स्पष्ट करता है।
- source_word: ἐκ ψυχῆς
  choice: पूरे मन से
  rationale: मुहावरे का अर्थ हार्दिकता और पूर्ण तत्परता से है; ‘पूरे मन से’ वर्तमान हिन्दी में स्वाभाविक है और शाब्दिक ‘आत्मा से’ की असहजता से बचता है।
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: जैसा अवसर उन्हें निर्देश दे
  rationale: καιρός उपयुक्त अवसर अथवा परिस्थिति को और ὑπογράφῃ संकेत, निर्धारण या निर्देश देने को व्यक्त करता है। यह अनुवाद सहायता की परिस्थिति-निर्भर सीमा को खुला रखता है।
