  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: hi
  text: और यह उस दस्तावेज़ की प्रतिलिपि है, जिसे उन्होंने काँसे की पट्टिकाओं पर उतारा और यरूशलेम भेज दिया, ताकि वह वहाँ उनके पास शांति और गठबंधन के स्मारक के रूप में रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: प्रतिलिपि
  rationale: यह किसी लिखित दस्तावेज़ की बनाई गई प्रति को दर्शाता है; औपचारिक प्रशासनिक संदर्भ में ‘प्रतिलिपि’ स्वाभाविक और सटीक है।
- source_word: γραφῆς
  choice: दस्तावेज़
  rationale: यहाँ शब्द किसी आधिकारिक लिखित अभिलेख के लिए है, पवित्रशास्त्र के अर्थ में नहीं; इसलिए ‘दस्तावेज़’ उपयुक्त है।
- source_word: ἀντέγραψαν
  choice: उतारा
  rationale: क्रिया का अर्थ प्रतिलिपि बनाना है। ‘पट्टिकाओं पर उतारा’ आधुनिक हिन्दी में स्वाभाविक है और लिखित सामग्री को दूसरे माध्यम पर अंकित करने का भाव देता है।
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: काँसे की पट्टिकाओं पर
  rationale: δέλτοι लिखने की पट्टिकाएँ और χαλκαῖς काँसे की सामग्री को सूचित करता है; यह पदबंध औपचारिक अभिलेखन के संदर्भ को स्पष्ट रखता है।
- source_word: μνημόσυνον
  choice: स्मरण
  rationale: शब्द ऐसी वस्तु या अभिलेख को सूचित करता है जो याद बनाए रखने के लिए रखा जाए। ‘स्मरण के रूप में’ हिन्दी में औपचारिक और सुबोध है।
- source_word: εἰρήνης
  choice: शांति
  rationale: यूनानी पाठ में साधारण संज्ञा ‘शांति’ है; ‘शांति-संधि’ कहने से पाठ से अधिक विशिष्टता जुड़ती।
- source_word: συμμαχίας
  choice: मैत्री-संधि
  rationale: यह राजनीतिक अथवा सैन्य गठबंधन को सूचित करता है। ऐतिहासिक राजनयिक संदर्भ में ‘मैत्री-संधि’ सामान्य पाठक के लिए स्पष्ट है और केवल व्यक्तिगत मित्रता का अर्थ नहीं देता।
- source_word: παρ' αὐτοῖς
  choice: उनके पास
  rationale: यह प्रतिलिपि के उस समुदाय के अधिकार या संरक्षण में रहने का भाव देता है; ‘उनके पास’ संक्षिप्त और स्वाभाविक हिन्दी है।
