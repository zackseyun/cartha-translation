  to: और यह उस दस्तावेज़ की प्रतिलिपि है, जिसे उन्होंने काँसे की पट्टिकाओं पर उतारा और यरूशलेम भेज दिया, ताकि वह वहाँ उनके पास शांति और गठबंधन के स्मारक के रूप में रहे।
