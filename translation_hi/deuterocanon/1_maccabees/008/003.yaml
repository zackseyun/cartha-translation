- source_word: χώρα Σπανίας
  choice: स्पेन का प्रदेश
  rationale: χώρα किसी भूभाग, क्षेत्र या प्रदेश को सूचित करता है। ‘स्पेन का प्रदेश’ आधुनिक राष्ट्र-राज्य का अनावश्यक संकेत दिए बिना स्वाभाविक भौगोलिक अर्थ देता है।
- source_word: κατακρατῆσαι
  choice: अधिकार कर लें
  rationale: यह उद्देश्यसूचक अनंत क्रिया प्रभुत्व या नियंत्रण प्राप्त करने का भाव रखती है; ‘अधिकार कर लें’ हिन्दी में इस बल को सहज ढंग से व्यक्त करता है।
- source_word: μέταλλα
  choice: खानों
  rationale: μέταλλα का अर्थ धातुएँ या खानें दोनों हो सकता है। यहाँ चाँदी और सोने के आर्थिक स्रोतों पर नियंत्रण के प्रसंग में ‘खानों’ सबसे स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀργυρίου καὶ χρυσίου
  choice: चाँदी और सोने
  rationale: दोनों बहुमूल्य धातुओं के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: τοῦ ἐκεῖ
  choice: वहाँ की
  rationale: यह उस प्रदेश में स्थित खानों या संसाधनों को निर्दिष्ट करता है; ‘वहाँ की’ संक्षिप्त और स्वाभाविक है।
