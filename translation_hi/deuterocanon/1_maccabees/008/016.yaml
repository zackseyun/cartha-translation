base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: hi
  text: और वे हर वर्ष एक आदमी को उन पर शासन करने और उनकी सारी भूमि पर प्रभुत्व करने का अधिकार सौंपते हैं; और सब उस एक की सुनते हैं,[a] और उनमें न तो ईर्ष्या है, न जलन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस एक पुरुष की आज्ञा मानते हैं।” यूनानी में शाब्दिक रूप से “उस एक की सुनते हैं” है, जिसका इस शासकीय संदर्भ में अर्थ आज्ञा मानना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύουσιν
  choice: दायित्व सौंपते हैं
  rationale: शासन से जुड़े infinitive के साथ यह क्रिया किसी के हाथ में अधिकार और दायित्व सौंपने का भाव देती है; केवल ‘विश्वास करते हैं’ कहना राजनीतिक संदर्भ में अपर्याप्त होगा।
- source_word: ἑνὶ ἀνθρώπῳ
  choice: एक पुरुष को
  rationale: यूनानी पद स्पष्ट रूप से पुल्लिंग एकवचन है; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: ἄρχειν αὐτῶν
  choice: अपने ऊपर शासन करने
  rationale: यह पद शासकीय अधिकार के प्रयोग को व्यक्त करता है; ‘शासन करना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κατ' ἐνιαυτόν
  choice: हर वर्ष
  rationale: यह वार्षिक अथवा वर्ष-दर-वर्ष पदावधि का भाव सुरक्षित रखता है।
- source_word: κυριεύειν
  choice: अधिकार रखने
  rationale: यह ἄρχειν की पुनरावृत्ति से बचते हुए प्रभुत्वपूर्ण अधिकार का अपेक्षाकृत प्रबल भाव व्यक्त करता है।
- source_word: πάσης τῆς γῆς αὐτῶν
  choice: अपने पूरे देश पर
  rationale: नागरिक-राजनीतिक संदर्भ में γῆ यहाँ भूमि अथवा राज्य-क्षेत्र को दर्शाता है; ‘देश’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: उस एक की सुनते हैं
  rationale: 'यह यूनानी की शाब्दिक अस्पष्टता बनाए रखता है: सुनना यहाँ आज्ञापालन का संकेत दे सकता है, पर उसे मुख्य पाठ में अनिवार्य रूप से स्पष्ट नहीं किया गया।'
- source_word: φθόνος
  choice: ईर्ष्या
  rationale: यह दूसरे की भलाई या स्थान के प्रति द्वेषपूर्ण ईर्ष्या का मानक हिन्दी रूप है।
- source_word: ζῆλος
  choice: जलन
  rationale: φθόνος के साथ इस नकारात्मक सामाजिक संदर्भ में यह ईर्ष्यालु प्रतिद्वंद्विता का भाव देता है और दोनों शब्दों का कुछ lexical भेद बनाए रखता है।
