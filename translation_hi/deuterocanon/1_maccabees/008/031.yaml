  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: hi
  text: 'और राजा देमेत्रियुस उनके विरुद्ध जो अत्याचार कर रहा है[a], उसके विषय में हमने उसे यह लिखा: “तुमने हमारे मित्रों और सहयोगियों, अर्थात् यहूदियों, पर अपना जूआ भारी क्यों कर दिया है?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो बुराइयाँ” अथवा “जो हानियाँ” राजा देमेत्रियुस उनके विरुद्ध कर रहा है। यूनानी अभिव्यक्ति केवल अमूर्त नैतिक बुराई ही नहीं, बल्कि हानि पहुँचाने वाले कामों या दमनकारी उपायों को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: जो अत्याचार
  rationale: यहाँ κακά अमूर्त नैतिक बुराई नहीं, बल्कि यहूदियों के विरुद्ध किए जा रहे हानिकारक और अन्यायपूर्ण कामों को सूचित करता है। ‘अत्याचार’ प्रसंग में ठोस उत्पीड़न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συντελεῖται εἰς αὐτούς
  choice: उनके साथ ... कर रहा है
  rationale: यह पद उन पर किए जा रहे वर्तमान शत्रुतापूर्ण कार्यों का भाव देता है। ‘उनके साथ ... कर रहा है’ हिन्दी में सहज है और चल रही कार्रवाई का पक्ष बनाए रखता है।
- source_word: ἐγράψαμεν αὐτῷ
  choice: हमने उसे ... लिख भेजा है
  rationale: यूनानी एओरिस्ट पत्र में किए गए पूर्व कार्य को बताता है। ‘लिख भेजा है’ वर्तमान उद्धृत पत्र-संदर्भ में स्वाभाविक हिन्दी है।
- source_word: Διὰ τί ἐβάρυνας
  choice: भारी क्यों कर दिया है
  rationale: क्रिया का मूल अर्थ भारी करना है; यह अनुवाद जूए के रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: τὸν ζυγόν σου
  choice: अपना जूआ
  rationale: ζυγός का शाब्दिक अर्थ जूआ है और यहाँ दमनकारी शासन या लादे गए बोझ का रूपक है; रूपक को संरक्षित रखा गया है।
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: हमारे मित्रों और सहयोगियों—यहूदियों—पर
  rationale: यूनानी समानाधिकरण यहूदियों की पहचान मित्रों और सहयोगियों, दोनों के रूप में करता है। विराम-चिह्न हिन्दी में इस संबंध को स्पष्ट रखते हैं।
