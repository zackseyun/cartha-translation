  yaml_path: translation/deuterocanon/1_maccabees/008/006.yaml
  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: hi
  text: और एशिया का महान राजा अन्तियोकस, जो एक सौ बीस हाथियों, घुड़सवार सेना[a], रथों और अत्यन्त विशाल सैन्यबल के साथ उनसे युद्ध करने आया था, उनके हाथों कुचल दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से एकवचन ‘घोड़ा’ है, पर इस सैन्य सूची में इसका सामूहिक अर्थ घुड़सवार सेना या अश्वारोही सैनिक समझना सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχον
  choice: अन्तियोकुस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित और स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: एशिया का महान राजा
  rationale: सम्बन्धसूचक संरचना और μέγαν के सीधे अर्थ ‘महान’ को बनाए रखता है तथा हिन्दी में स्वाभाविक उपाधि बनाता है।
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: जो ... उनसे युद्ध करने आया था
  rationale: सैन्य उद्देश्य और विरोधी दिशा दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔχοντα
  choice: के साथ
  rationale: सैन्य साधनों की सूची आरम्भ करने के लिए हिन्दी में स्वाभाविक है और ‘अपने पास लिए हुए’ जैसी बोझिल अभिव्यक्ति से बचता है।
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: एक सौ बीस हाथियों
  rationale: संख्या और सैन्य हाथियों का सीधा अनुवाद।
- source_word: ἵππον
  choice: घुड़सवार सेना
  rationale: यूनानी में शब्द एकवचन ‘घोड़ा’ है, पर सैन्य सूची में यह सामूहिक रूप से अश्वारोही दल का बोध कराता है; इस व्याख्यात्मक चयन को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἅρματα
  choice: रथों
  rationale: प्राचीन सैन्य सन्दर्भ में मानक और सीधा समतुल्य।
- source_word: δύναμιν πολλὴν σφόδρα
  choice: अत्यन्त विशाल सैन्यबल
  rationale: δύναμις का प्रसंगगत सैन्य अर्थ और πολλὴν σφόδρα की तीव्रता दोनों व्यक्त होते हैं।
- source_word: συνετρίβη ἀπʼ αὐτῶν
  choice: उनके हाथों कुचल दिया गया
  rationale: निष्क्रिय क्रिया की प्रबलता और ἀπʼ αὐτῶν द्वारा व्यक्त कर्तृता दोनों को सुरक्षित रखता है; केवल ‘हरा दिया गया’ मूल की तीव्रता घटा देता।
