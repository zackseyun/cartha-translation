translation:
  language: hi
  text: और यहूदा ने योहन के पुत्र यूपोलेमुस को, और यासोन को, जो एलिआज़र का पुत्र था, चुना; योहन अक्कोस का पुत्र था। उसने उन्हें रोम भेजा, ताकि वे रोमियों के साथ मित्रता और गठबंधन स्थापित करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: चुना
  rationale: क्रिया का सीधा अर्थ चुनना है; प्रसंग में औपचारिक नियुक्ति का अतिरिक्त भाव जोड़ना आवश्यक नहीं।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह भेजने के लिए प्रयुक्त सामान्य कथात्मक क्रिया है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: στῆσαι
  choice: स्थापित करें
  rationale: यहाँ अनंत क्रिया उद्देश्य व्यक्त करती है और राजनयिक संबंध कायम करने का भाव देती है।
- source_word: φιλίαν
  choice: मित्रता
  rationale: शब्द का मूल अर्थ सुरक्षित रहता है; संधि के साथ आने के कारण इसकी औपचारिक राजनयिक छाया भी स्पष्ट है।
- source_word: συμμαχίαν
  choice: संधि
  rationale: राजनीतिक या सैनिक गठबंधन का भाव है; हिन्दी में 'संधि' इस राजनयिक प्रसंग में सहज है और अनावश्यक रूप से इसे केवल सैनिक नहीं बनाती।
- source_word: τοῦ Ἀκχώς
  choice: जो अक्कोस का पुत्र था
  rationale: इसे वंशावली की अगली कड़ी मानते हुए योहन को अक्कोस का पुत्र बताया गया है; हिन्दी में संबंध स्पष्ट करने के लिए उपवाक्य स्वाभाविक है।
- source_word: αὐτοῖς
  choice: रोमियों के साथ
  rationale: सर्वनाम का आशय रोम के लोगों से है; हिन्दी में स्पष्ट संज्ञा प्रयोग करने से संबंध स्वाभाविक और असंदिग्ध रहता है।
