  yaml_path: translation/deuterocanon/1_maccabees/008/010.yaml
  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: hi
  text: और जब उन्हें यह समाचार मिला, तब उन्होंने उनके विरुद्ध एक सेनापति भेजा। उन्होंने उनसे युद्ध किया, और उनमें से बहुत-से लोग घायल होकर गिर पड़े। उन्होंने उनकी स्त्रियों और बच्चों को बंदी बना लिया, उन पर लूटपाट की, उनके देश पर अधिकार कर लिया, उनके गढ़ ढा दिए, और उन पर लूटपाट की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में इस पद के अंत में “उन पर लूटपाट की” दोबारा आता है। इसे मुख्य पाठ में बनाए रखा गया है; यह या तो जानबूझकर दिया गया बल हो सकता है या पाठ-परंपरा में हुई पुनरावृत्ति।
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος
  choice: उन्हें यह समाचार मिला
  rationale: λόγος यहाँ किसी घटना के समाचार या सूचना को सूचित करता है; ἐγνώσθη के निष्क्रिय भाव को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: उन्होंने उनके विरुद्ध एक सेनापति भेजा
  rationale: στρατηγός का सैन्य प्रसंग में स्वाभाविक अर्थ ‘सेनापति’ है; ἕνα को ‘एक’ के रूप में बनाए रखा गया है।
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: उन्होंने उनसे युद्ध किया
  rationale: यह युद्ध करने की सीधी सैन्य अभिव्यक्ति है और πρὸς की विरोधात्मक दिशा को सुरक्षित रखती है।
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: उनमें से बहुत-से लोग घायल होकर गिर पड़े
  rationale: τραυματίαι घायल योद्धाओं अथवा हताहतों को दर्शाता है; अनुवाद मृत्यु को अनावश्यक रूप से निश्चित किए बिना चोट और गिरने, दोनों को व्यक्त करता है।
- source_word: ᾐχμαλώτισαν
  choice: बंदी बना लिया
  rationale: क्रिया युद्ध में लोगों को बंदी बनाने का विशिष्ट अर्थ रखती है।
- source_word: ἐπρονόμευσαν αὐτούς
  choice: उन्हें लूटा
  rationale: क्रिया विजय के बाद लूटने या उजाड़ने को दर्शाती है। यूनानी पाठ में इसकी पुनरावृत्ति है, इसलिए हिन्दी मुख्य पाठ में भी दोनों बार रखा गया है।
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: उनके देश पर अधिकार कर लिया
  rationale: जननकारक के साथ κατακρατέω प्रभुत्व या नियंत्रण प्राप्त करने का भाव देता है; ‘अधिकार कर लिया’ इस सैन्य नियंत्रण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: उनके गढ़ ढा दिए
  rationale: ὀχυρώματα किलेबंद स्थान या गढ़ हैं और καθεῖλον उन्हें गिराने या ध्वस्त करने को दर्शाता है।
