  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: hi
  text: और इन सब बातों में उनमें से किसी ने भी राजमुकुट[a] नहीं पहना, न ही उन्होंने अपने को ऊँचा दिखाने के लिए बैंजनी वस्त्र[b] पहने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजकीय सिर-पट्टी’; यूनानी शब्द ऐसे राजचिह्न को दर्शाता है जो विशेष रूप से राजाओं से जुड़ा था।
    reason: lexical_alternative
  - marker: b
    text: बैंजनी वस्त्र राजकीय पद या बहुत ऊँची प्रतिष्ठा का चिह्न माने जाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: इन सब बातों में
  rationale: यह पदबंध पिछली आयतों में वर्णित रोमी शासन और उपलब्धियों की ओर संकेत करता है। यह अनुवाद उसके व्यापक संदर्भात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπέθετο ... διάδημα
  choice: राजमुकुट नहीं पहना
  rationale: διάδημα विशेष रूप से राजसत्ता से जुड़ा सिर पर बाँधा जाने वाला राजकीय पट्टा था। ‘राजमुकुट’ सामान्य पाठक के लिए स्पष्ट है, और पादटिप्पणी अधिक सटीक सांस्कृतिक अर्थ बताती है।
- source_word: πορφύραν
  choice: बैंजनी वस्त्र
  rationale: यूनानी में रंग अथवा रंगी हुई सामग्री का नाम लाक्षणिक रूप से परिधान के लिए आया है। हिन्दी में ‘वस्त्र’ जोड़ने से पहनने की क्रिया स्वाभाविक और अर्थ स्पष्ट होता है।
- source_word: ἁδρυνθῆναι
  choice: अपने को ऊँचा दिखाने के लिए
  rationale: यहाँ क्रिया बैंजनी वस्त्र के द्वारा स्वयं को बड़ा, प्रतिष्ठित या वैभवशाली प्रदर्शित करने का भाव देती है। चुनी हुई अभिव्यक्ति आत्म-प्रतिष्ठा का आशय रखती है, पर अनावश्यक रूप से किसी खास नैतिक दोष को नहीं जोड़ती।
- source_word: ἐν αὐτῇ
  choice: बैंजनी वस्त्र पहनकर (वाक्य में अंतर्निहित)
  rationale: स्त्रीलिंग सर्वनाम का स्वाभाविक पूर्वपद πορφύραν है। हिन्दी वाक्य में साधन का संबंध ‘बैंजनी वस्त्र ... अपने को ऊँचा दिखाने’ की रचना से स्पष्ट है, इसलिए अलग सर्वनाम दोहराना अस्वाभाविक होता।
