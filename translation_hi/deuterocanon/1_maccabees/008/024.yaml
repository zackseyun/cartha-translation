lexical_decisions:
- source_word: ἐνστῇ πόλεμος
  choice: युद्ध ... आ पड़े
  rationale: ἐνίστημι यहाँ युद्ध के उपस्थित होने या आ पड़ने का भाव देता है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: Ῥώμῃ
  choice: रोम पर
  rationale: यूनानी दत्तिवाचक रूप को युद्ध के लक्ष्य के अर्थ में लिया गया है।
- source_word: τοῖς συμμάχοις αὐτῶν
  choice: उसके किसी भी मित्र-राष्ट्र पर
  rationale: σύμμαχος राजनीतिक-सैन्य सहयोगी को सूचित करता है; इस संधि-संदर्भ में ‘मित्र-राष्ट्र’ स्पष्ट है। बहुवचन πᾶσι को विकल्पात्मक हिंदी संरचना ‘किसी भी’ से व्यक्त किया गया है।
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: उनके पूरे अधिकार-क्षेत्र में कहीं भी
  rationale: κυρία यहाँ प्रभुत्व या अधिकार के अधीन क्षेत्र का संकेत देती है; ‘अधिकार-क्षेत्र’ मूल की व्यापकता बनाए रखता है।
- source_word: προτέρα
  choice: पहले
  rationale: स्त्रीलिंग विशेषण क्रियाविशेषणवत प्रयुक्त है और युद्ध के पहले रोम अथवा उसके सहयोगियों तक पहुँचने को दर्शाता है; तुलना का दूसरा पक्ष आगे के प्रसंग से समझा जाता है।
