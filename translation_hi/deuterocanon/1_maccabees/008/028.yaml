lexical_decisions:
- source_word: συμμάχοις
  choice: सहयोगी राज्यों को
  rationale: राजनीतिक-सैन्य संधि के संदर्भ में यह संबद्ध पक्षों को दर्शाता है; ‘सहयोगी राज्य’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: δοθήσεται
  choice: नहीं दी जाएगी
  rationale: भविष्यत् कर्मवाच्य को बिना कोई कर्ता जोड़े स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σῖτος
  choice: अनाज
  rationale: यहाँ शब्द सामान्य रूप से धान्य का बोध कराता है, केवल गेहूँ का नहीं।
- source_word: ὅπλα
  choice: हथियार
  rationale: सैन्य संधि के संदर्भ में स्पष्ट और प्रचलित आधुनिक हिन्दी समतुल्य।
- source_word: ἀργύριον
  choice: चाँदी
  rationale: यद्यपि इसका प्रयोग धन के अर्थ में हो सकता है, यूनानी पाठ के ठोस शब्द ‘चाँदी’ को सुरक्षित रखा गया है।
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: जैसा रोम ने निर्णय किया है
  rationale: यह औपचारिक राजकीय निर्णय का मुहावरा है; शाब्दिक ‘जैसा रोम को अच्छा लगा’ की अपेक्षा यह हिन्दी में उसी राजनयिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φυλάξονται
  choice: पालन करेंगे
  rationale: कानूनी और संधिगत संदर्भ में φυλάσσω का अर्थ शर्तों को मानना अथवा उनका पालन करना है।
- source_word: τὰ φυλάγματα ταῦτα
  choice: इन शर्तों
  rationale: संधि के संदर्भ में यह पालन की जाने वाली बाध्यकारी व्यवस्थाओं को दर्शाता है; ‘शर्तें’ सामान्य पाठक के लिए सहज और सटीक है।
- source_word: οὐ μετὰ δόλου
  choice: बिना किसी छल के
  rationale: वाक्यांश संधि-पालन में कपट का निषेध करता है; यह अर्थ और औपचारिक गंभीरता दोनों बनाए रखता है।
