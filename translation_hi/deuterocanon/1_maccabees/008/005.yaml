  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: hi
  text: और फिलिप, कित्तियों के राजा पर्सियस[a], तथा[b] उन लोगों को भी जो रोमियों के विरुद्ध उठ खड़े हुए थे—उन्होंने युद्ध में कुचल दिया और उन पर विजय पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘कित्तियों का राजा’। ऐतिहासिक संदर्भ में यह पद मकिदूनी राज्य की ओर संकेत कर सकता है; कुछ अनुवाद जातिनाम के स्थान पर यही अर्थ देते हैं।
    reason: alternative_reading
  - marker: b
    text: यहाँ उपलब्ध यूनानी पाठ में καὶ (‘और’) शब्द कई बार दोहराया गया है। यह संभवतः पाठ की अनियमितता है, पर इससे वाक्य के मूल अर्थ में कोई महत्वपूर्ण परिवर्तन नहीं होता।
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: फिलिप्पुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: Περσέα
  choice: पर्सियस
  rationale: यूनानी व्यक्तिगत नाम का स्पष्ट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: Κιτιέων
  choice: कित्तियों के
  rationale: बहुवचन जातिनाम को उसके शाब्दिक रूप में सुरक्षित रखा गया है; ऐतिहासिक पहचान के आधार पर इसे मुख्य पाठ में ‘मकिदूनियों’ से नहीं बदला गया।
- source_word: βασιλέα
  choice: राजा
  rationale: राजकीय उपाधि का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  choice: उन लोगों को भी जो उनके विरुद्ध उठ खड़े हुए थे
  rationale: ἐπαίρω के विरोधपूर्ण अर्थ और ‘उठ खड़े होने’ के रूपक, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συνέτριψαν
  choice: कुचल दिया
  rationale: युद्ध में निर्णायक पराजय के प्रबल भाव को व्यक्त करता है।
- source_word: πολέμῳ
  choice: युद्ध में
  rationale: सैन्य प्रसंग में दत्तिव कारक का सहज हिन्दी रूप।
- source_word: κατεκράτησαν αὐτῶν
  choice: उन पर विजय पाई
  rationale: नियंत्रण या प्रभुत्व प्राप्त करने का भाव स्पष्ट करता है, पर स्थायी राजनीतिक अधीनता का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ऐतिहासिक रूप से अर्थपूर्ण जातिनाम Κιτιέων
  choice: कित्तियों के
  alternative: मकिदूनियों के; कित्तियम के
  rationale: मूल यूनानी जातिनाम को मुख्य पाठ में सुरक्षित रखा गया है। ऐतिहासिक संदर्भ संभवतः मकिदूनी राज्य की ओर संकेत करता है, पर उस पहचान को अनुवाद में निश्चित मानकर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तथा’ और ‘को भी’ से सूची की संरचना स्पष्ट होती है; दीर्घ विराम Romans के लिए प्रयुक्त अंतर्निहित कर्ता और पराजित व्यक्तियों की सूची के बीच अंतर दिखाता है।
