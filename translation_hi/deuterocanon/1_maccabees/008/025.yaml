lexical_decisions:
- source_word: συμμαχήσει
  choice: सहयोगी बनेगा
  rationale: यह भविष्यत्कालीन क्रिया किसी के साथ संधिबद्ध होकर सहयोग करने को व्यक्त करती है। ‘सहयोगी बनेगा’ संधि के संदर्भ को बनाए रखता है और इसे केवल युद्ध में साथ लड़ने तक सीमित नहीं करता।
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: यहूदी राष्ट्र
