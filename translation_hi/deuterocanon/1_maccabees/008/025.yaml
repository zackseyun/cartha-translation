- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: जैसा अवसर उन्हें संकेत दे
  rationale: ὡς ἂν के साथ संभावनार्थक क्रिया परिस्थितिनिर्भर भाव देती है। καιρός उपयुक्त अवसर या परिस्थिति है, और ὑπογράφῃ के ‘रेखांकित करना, संकेत देना, निर्देशित करना’ अर्थों में से ‘संकेत दे’ मूल की जानबूझकर रखी गई अल्प अस्पष्टता को सुरक्षित रखता है।
- source_word: καρδίᾳ πλήρει
  choice: पूरे मन से
  rationale: यह हिन्दी में समर्पण और निष्कपट तत्परता का स्वाभाविक मुहावरा है तथा यूनानी ‘पूर्ण हृदय से’ के अर्थ को निकटता से व्यक्त करता है।
