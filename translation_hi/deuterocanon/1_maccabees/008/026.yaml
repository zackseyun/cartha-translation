base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: hi
  text: जो लोग उनके विरुद्ध युद्ध करते हैं, उन्हें वे न तो अनाज, हथियार, चाँदी या जहाज़ देंगे, न ही इनकी आपूर्ति करेंगे, जैसा रोम ने निर्णय किया है; और वे बिना कुछ लिए अपने दायित्वों[a] का पालन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी शर्तों को मानेंगे’ अथवा ‘अपनी संधि की धाराओं का पालन करेंगे।’ यूनानी में सजातीय शब्दों का प्रयोग है, जिसका शाब्दिक अर्थ है, ‘वे अपनी पालन करने योग्य बातों का पालन करेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: जो लोग उनके विरुद्ध युद्ध करते हैं, उन्हें
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत शत्रुतापूर्ण पक्षों को सूचित करता है। ‘उनके विरुद्ध’ संधि के प्रसंग में निहित कर्म को स्पष्ट करता है, पर किसी विशेष प्रकार के आक्रमण का अर्थ नहीं जोड़ता।
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: न तो ... देंगे, न ही इनकी आपूर्ति करेंगे
  rationale: दोनों भविष्यत्कालीन क्रियाएँ प्रत्यक्ष रूप से देने और आवश्यक सामग्री उपलब्ध कराने—इन दो संबद्ध निषेधों को बनाए रखती हैं।
- source_word: σῖτον
  choice: अनाज
  rationale: σίτος सामान्यतः अनाज अथवा अनाज की रसद को दर्शाता है; ‘भोजन’ से अधिक सटीक और ‘गेहूँ’ से कम संकीर्ण है।
- source_word: ὅπλα
  choice: हथियार
  rationale: सैन्य-संधि के प्रसंग में यह स्पष्ट और स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: ἀργύριον
  choice: चाँदी
  rationale: मूल यूनानी का प्रत्यक्ष अर्थ सुरक्षित रखा गया है; यद्यपि यह धन के अर्थ में भी प्रयुक्त हो सकता है, यहाँ ‘चाँदी’ प्राचीन आर्थिक परिवेश को बनाए रखती है।
- source_word: πλοῖα
  choice: जहाज़
  rationale: सैन्य और राजनयिक प्रसंग में बहुवचन πλοῖα का स्वाभाविक हिन्दी रूप।
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: जैसा रोम ने निर्णय किया है
  rationale: ἔδοξεν के साथ संप्रदान कारक औपचारिक निर्णय या प्रस्ताव को सूचित करता है; यह हिन्दी में विधिक भाव को सहज रूप से व्यक्त करता है।
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: अपने दायित्वों का पालन करेंगे
  rationale: मूल में सजातीय क्रिया-संज्ञा प्रयोग है, जिसका शाब्दिक भाव ‘रखने योग्य बातों को रखेंगे’ है। संधि के प्रसंग में ‘दायित्वों का पालन’ उसके विधिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐθὲν λαβόντες
  choice: बिना कुछ लिए
  rationale: कृदंतीय पदबंध का संक्षिप्त और निकट अनुवाद है; यह किसी प्रतिफल या वस्तु को ग्रहण न करने का भाव बनाए रखता है।
