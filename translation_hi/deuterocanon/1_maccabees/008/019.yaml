lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: गए
  rationale: यहाँ πορεύομαι का अओरिस्ट रूप सामान्य गति का वर्णन करता है; आधुनिक हिन्दी में “गए” सबसे स्वाभाविक और सीधा है।
- source_word: εἰς Ῥώμην
  choice: रोम गए
  rationale: स्थान-नाम के साथ दिशासूचक εἰς यात्रा के प्रसंग में हिन्दी के “रोम गए” से स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: यात्रा बहुत ही लंबी थी
  rationale: ὁδός का मूल अर्थ “मार्ग” है, पर इस प्रसंग में वाक्यांश यात्रा की अत्यधिक लंबाई बताता है। “बहुत ही” πολλὴ σφόδρα के प्रबल बलाघात को बनाए रखता है।
- source_word: εἰσῆλθον
  choice: प्रवेश करके
  rationale: εἰσέρχομαι के अओरिस्ट का अर्थ “प्रवेश किया” है; अगले समन्वित कार्य से सहज हिन्दी में जोड़ने के लिए “प्रवेश करके” चुना गया है।
- source_word: τὸ βουλευτήριον
  choice: सभा-भवन
  rationale: βουλευτήριον उस भवन या कक्ष को बताता है जहाँ परिषद विचार-विमर्श करती थी। “सभा-भवन” अर्थ को स्पष्ट रखता है और यूनानी से अधिक विशिष्ट ऐतिहासिक पहचान नहीं थोपता।
- source_word: ἀπεκρίθησαν
  choice: उन्होंने उत्तर दिया
  rationale: क्रिया का सामान्य अर्थ “उत्तर दिया” है। उत्तर की विषयवस्तु अगले पद में आने पर भी यूनानी की कथात्मक क्रमबद्धता सुरक्षित रखी गई है।
