    reason: lexical_alternative
lexical_decisions:
- source_word: ἆραι
  choice: उतार देने
  rationale: αἴρω का यह अनंत रूप ζυγός के साथ जुए को हटा देने या उतार देने का अर्थ देता है; हिन्दी में यह स्वाभाविक रूप से रूपक को बनाए रखता है।
- source_word: ζυγὸν
  choice: जुआ
  rationale: मूल शब्द का शाब्दिक अर्थ जुआ है और यहाँ यह दमनकारी अधीनता का रूपक है; इसे सामान्य ‘बोझ’ कहकर रूपक को हल्का नहीं किया गया।
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: यूनानियों का राज्य
  rationale: यह मूल पदबंध का सीधा और स्पष्ट रूप है तथा जातीय-राजनीतिक संकेत को बनाए रखता है।
- source_word: καταδουλουμένους ... δουλίαν
  choice: दास बनाकर दासता में डाल रहा था
  rationale: यूनानी पाठ क्रिया और संज्ञा, दोनों के द्वारा दासता पर बल देता है। हिन्दी में यह संरचना कुछ प्रबल होते हुए भी बोधगम्य है और मूल की पुनरुक्ति को सुरक्षित रखती है।
- source_word: Ἰσραὴλ
  choice: इस्राएल
  rationale: प्रचलित हिन्दी बाइबलीय नाम-रूप अपनाया गया है।
theological_decisions:
- issue: ऐतिहासिक राजनीतिक संदर्भ में दासता की दोहरी अभिव्यक्ति
  choice: दास बनाकर दासता में डाल रहा था
  alternative: इस्राएल को अधीन कर रहा था
  rationale: मूल में καταδουλόω और δουλία दोनों आए हैं, जो पूर्ण दासता पर जानबूझकर बल देते हैं। इसे केवल ‘अधीन करना’ कहना उस तीव्रता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘जुआ’ के ऐतिहासिक रूपक और मूल यूनानी की बलपूर्ण दासता-भाषा दोनों को सुरक्षित रखा गया है।
