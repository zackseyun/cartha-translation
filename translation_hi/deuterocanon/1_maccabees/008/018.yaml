  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: hi
  text: और उनका जुआ उतारने के लिए, क्योंकि उन्होंने देखा कि यूनानियों का राज्य इस्राएल को दासता में जकड़ रहा था।[a]
