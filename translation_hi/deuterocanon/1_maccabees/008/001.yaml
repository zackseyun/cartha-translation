  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
translation:
  language: hi
  text: और यहूदा ने रोमियों की ख्याति सुनी[a], कि वे बहुत शक्तिशाली हैं, कि वे उन सभी के प्रति अनुकूल हैं जो उनके साथ जुड़ जाते हैं, और जितने लोग उनके पास आते हैं, रोमी उनसे मित्रता कर लेते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोमियों का नाम सुना”; यहाँ “नाम” का अर्थ उनकी ख्याति या उनके विषय में फैली चर्चा है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मित्रता” से औपचारिक राजनीतिक मैत्री या संधि-संबंध भी अभिप्रेत हो सकता है, केवल व्यक्तिगत स्नेह नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: यूनानी क्रिया का सीधा अर्थ ‘सुना’ है; आगे आने वाली बातों से स्पष्ट है कि यहूदा ने रोमियों के विषय में समाचार सुना था।
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  choice: रोमियों की ख्याति के बारे में
  rationale: शाब्दिक रूप ‘रोमियों का नाम’ है, पर यहाँ ὄνομα उनके यश, प्रतिष्ठा या उनके विषय में फैली चर्चा को दर्शाता है। स्वाभाविक हिन्दी के लिए ‘ख्याति के बारे में’ चुना गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया।
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: बहुत शक्तिशाली
  rationale: यूनानी में शक्ति पर बल देने वाला कुछ पुनरुक्तिपूर्ण पदबंध है। ‘बहुत शक्तिशाली’ आधुनिक हिन्दी में उस तीव्रता को सहज रूप से व्यक्त करता है।
- source_word: εὐδοκοῦσιν
  choice: अनुकूल रहते हैं
  rationale: इस राजनीतिक-संबंधपरक प्रसंग में क्रिया अनुकूल रुख और सद्भावपूर्ण व्यवहार को व्यक्त करती है, केवल आंतरिक प्रसन्नता को नहीं।
- source_word: τοῖς προστεθειμένοις αὐτοῖς
  choice: जो उनके साथ जुड़ जाते हैं
  rationale: कृदंत उन लोगों को सूचित करता है जो रोमियों के साथ जुड़ते या अपना संबंध स्थापित करते हैं। ‘संधि करते हैं’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: जितने लोग उनके पास आते हैं
  rationale: यह अनिश्चित और सामान्य कथन है तथा मूल की निकट आने की गति-छवि को बनाए रखता है।
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: उनसे वे मित्रता कर लेते हैं
  rationale: φιλία का मूल अर्थ ‘मित्रता’ है, किंतु इस ऐतिहासिक संदर्भ में औपचारिक राजनीतिक मैत्री या संधि भी निहित हो सकती है। हिन्दी वाक्य में संबंध का कर्ता स्पष्ट करते हुए मूल अर्थ रखा गया और राजनीतिक अर्थ पादटिप्पणी में बताया गया।
