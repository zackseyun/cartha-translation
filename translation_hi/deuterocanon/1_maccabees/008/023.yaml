base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: hi
  text: रोमियों और यहूदी राष्ट्र का समुद्र और स्थल पर सदा कल्याण हो; और तलवार[a] तथा शत्रु उनसे दूर रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तलवार’ यहाँ युद्ध का लाक्षणिक संकेत हो सकती है, पर मुख्य पाठ में यूनानी का ठोस शब्द रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: कल्याण हो
  rationale: यह विधिलिंग-सदृश आशीर्वचन या शुभकामना है। ‘कल्याण हो’ उसकी कामनात्मक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Ῥωμαίοις
  choice: रोमियों
  rationale: यह दत्तिव बहुवचन रोमी लोगों को सूचित करता है; हिन्दी में ‘रोमियों का ... कल्याण हो’ स्वाभाविक संरचना है।
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: यहूदी राष्ट्र
  rationale: ἔθνος यहाँ राजनीतिक-जातीय समुदाय को दर्शाता है। ‘यहूदी राष्ट्र’ मूल अर्थ को संक्षिप्त और स्पष्ट रूप में रखता है।
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: समुद्र और स्थल पर
  rationale: यह युग्म गतिविधि के सभी क्षेत्रों का संकेत देता है। अनुवाद दोनों ठोस क्षेत्रों को बनाए रखते हुए हिन्दी में सहज है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: संधि के इस आशीर्वचन में यह स्थायी अवधि को व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: ῥομφαία
  choice: तलवार
  rationale: मूल का ठोस शस्त्र-चित्र सुरक्षित रखा गया है, यद्यपि प्रसंग में यह युद्ध का लाक्षणिक संकेत भी हो सकता है।
- source_word: ἐχθρός
  choice: शत्रु
  rationale: एकवचन संज्ञा सामूहिक या प्रतिनिधिक अर्थ में प्रयुक्त है; ‘शत्रु’ उसी रूप और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: μακρυνθείη ἀπ' αὐτῶν
  choice: उनसे दूर रहें
  rationale: यह निष्क्रिय कामनात्मक रूप दूरी बनाए जाने की इच्छा व्यक्त करता है। संयुक्त कर्ता ‘तलवार तथा शत्रु’ के कारण हिन्दी में बहुवचन ‘रहें’ स्वाभाविक है।
