- source_word: δυνατοὶ ἰσχύϊ
  choice: शक्ति में सामर्थी
  rationale: यूनानी पद की बलवाचक पुनरुक्ति को बनाए रखता है और रोमियों की सैन्य शक्ति पर जोर देता है।
- source_word: διηγήσαντο
  choice: लोगों ने उसे ... बताया
  rationale: क्रिया का अर्थ विस्तार से वृत्तांत देना है; आधुनिक हिन्दी में 'बताया' स्वाभाविक है। कर्ता मूल में अनिर्दिष्ट बहुवचन है, इसलिए 'लोगों ने' रखा गया है।
- source_word: πολέμους
  choice: युद्धों
  rationale: बहुवचन और व्यापक सैन्य संघर्षों का सीधा समतुल्य है।
- source_word: ἀνδραγαθίας
  choice: वीरतापूर्ण कामों
  rationale: सैन्य साहस के कार्यों को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से लिंगसूचक या पुरातन भाषा अपनाए।
- source_word: ἐν τοῖς Γαλάταις
  choice: गलातियों के बीच
  rationale: यूनानी पूर्वसर्ग ἐν की वास्तविक अस्पष्टता बनाए रखता है; इसे व्याख्यात्मक रूप से 'गलातियों के विरुद्ध' नहीं बनाया गया।
- source_word: κατεκράτησαν αὐτῶν
  choice: उन्होंने उन पर अधिकार कर लिया
  rationale: बलपूर्वक प्रभुत्व स्थापित करने के सैनिक-राजनीतिक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: उनसे कर वसूलने लगे
  rationale: कराधीन बनाने के परिणाम को सरल हिन्दी में बताता है; आशय यह है कि वे नियमित कर देने के अधीन हो गए।
