  text: और यह कि वे बहुत सामर्थी हैं। लोगों ने उसे उनके युद्धों और उन वीरतापूर्ण कार्यों के बारे में बताया, जो वे गलातियों के बीच[a] करते हैं; और यह भी कि उन्होंने उन पर प्रभुत्व पा लिया और उन्हें कर देने के अधीन कर दिया।
