  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: hi
  text: यदि वे अब भी तुम्हारे विरुद्ध फरियाद करें, तो हम उनका न्याय करेंगे और समुद्र तथा स्थल—दोनों मार्गों से तुमसे युद्ध करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “हम समुद्र और स्थल—दोनों मार्गों से तुमसे युद्ध करेंगे।” प्रसंग में संभवतः आशय “हम तुम्हारे लिए युद्ध करेंगे” या “हम उनसे युद्ध करेंगे” है; अथवा उपलब्ध पाठ में कोई पाठगत कठिनाई है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: यदि वे अब भी
  rationale: शर्त और जारी या दोहराई जा रही कार्रवाई—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। οὖν का अलग शब्दशः अनुवाद यहाँ वाक्य को असहज बनाता; प्रसंगगत संबंध ‘तो’ से मुख्य उपवाक्य में स्पष्ट है।
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: तुम्हारे विरुद्ध फरियाद करें
  rationale: ἐντυγχάνω यहाँ किसी अधिकारी के सामने विरोधी निवेदन या शिकायत करने का भाव रखता है। ‘फरियाद करें’ कानूनी-राजनयिक संदर्भ को बनाए रखता है और इसे शारीरिक आक्रमण नहीं बनाता।
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: हम उनका न्याय करेंगे
  rationale: यह प्रयोग उनके विषय में न्यायिक निर्णय या दंडात्मक न्याय किए जाने को व्यक्त करता है। ‘उनका न्याय करेंगे’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: πολεμήσομέν σε
  choice: तुमसे युद्ध करेंगे
  rationale: प्राप्त यूनानी पाठ में कर्म σε, अर्थात ‘तुम्हें/तुमसे’, है; इसलिए प्रसंगगत कठिनाई के बावजूद इसे मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: समुद्र तथा स्थल—दोनों मार्गों से
  rationale: यह समुद्री और थल-मार्ग से युद्ध करने का युग्म है। ‘दोनों मार्गों से’ हिन्दी में इसके व्यापक सैन्य भाव को स्पष्ट करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में युद्ध का कर्म प्रसंग से असंगत प्रतीत होता है
  choice: प्राप्त यूनानी के अनुसार ‘तुमसे युद्ध करेंगे’ रखा गया
  alternative: ‘तुम्हारे लिए युद्ध करेंगे’ या ‘उनसे युद्ध करेंगे’
  rationale: यूनानी में स्पष्ट रूप से πολεμήσομέν σε, ‘हम तुमसे युद्ध करेंगे’, है। पिछले संदर्भ में रोमियों द्वारा सहायता का आश्वासन होने के कारण यह कथन कठिन है, पर पाठ को बिना पांडुलिपीय आधार के बदलना वास्तविक पाठगत और व्याख्यात्मक तनाव को मिटा देता। संभावित प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का औपचारिक किंतु सुबोध राजनयिक-सैन्य स्वर रखा गया है। ‘तुम्हारे/तुमसे’ एकवचन संबोधन को सुरक्षित रखते हैं।
