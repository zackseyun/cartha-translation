  yaml_path: translation/deuterocanon/1_maccabees/008/011.yaml
  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: hi
  text: और उन्होंने उन्हें आज तक दास बनाए रखा[a]। शेष राज्यों और द्वीपों के उन सभी लोगों को, जिन्होंने कभी उनका विरोध किया, उन्होंने तबाह कर दिया[b] और अपने अधीन दास बना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज के दिन तक।”
    reason: यूनानी वाक्यांश का अधिक शब्दशः विकल्प।
  - marker: b
    text: या “नष्ट कर दिया” अथवा “उजाड़ दिया”; यूनानी क्रिया भारी विनाश या बरबादी का बोध दे सकती है।
    reason: मूल क्रिया के अर्थ-क्षेत्र और विनाश की सीमा संबंधी अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: दास बनाए रखा
  rationale: καταδουλόω पूर्ण दासता या कठोर अधीनता में लाने का बोध देता है। ‘दास’ मूल की तीव्रता बनाए रखता है, और ‘बनाए रखा’ अगले काल-वाक्यांश के साथ उस दशा के जारी रहने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज तक
  rationale: यह यूनानी मुहावरा लेखक के वर्तमान समय तक स्थिति जारी रहने का संकेत देता है; ‘आज तक’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: बचे हुए राज्यों
  rationale: ἐπίλοιπος का अर्थ शेष या बचे हुए है; यह पहले वर्णित राज्यों के बाद बाकी राज्यों की ओर संकेत करता है।
- source_word: τὰς νήσους
  choice: द्वीपों
  rationale: νήσους का सीधा अर्थ ‘द्वीप’ है; संदर्भ में अनावश्यक विस्तार नहीं किया गया।
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: जितनों ने भी कभी उनका विरोध किया
  rationale: ὅσοι की व्यापक अनिश्चितता और ποτέ के ‘कभी भी’ वाले बल, दोनों को यह वाक्यांश सुरक्षित रखता है।
- source_word: κατέφθειραν
  choice: तबाह कर दिया
  rationale: καταφθείρω यहाँ भारी विनाश या बरबादी का अर्थ देता है। ‘तबाह कर दिया’ तीव्रता बनाए रखता है, पर ऐसा पूर्ण संहार अनिवार्य नहीं करता जो आगे दास बनाए जाने से असंगत लगे।
- source_word: ἐδούλωσαν αὐτοῖς
  choice: अपने अधीन दास बना लिया
  rationale: δουλόω की दासता-संबंधी तीव्रता और αὐτοῖς द्वारा व्यक्त ‘उन्हीं के अधीन’ संबंध, दोनों को स्वाभाविक हिन्दी में दर्शाया गया है।
theological_decisions:
- issue: सैनिक-राजनीतिक संदर्भ में दासता की भाषा
  choice: ‘दास बनाए रखा’ और ‘अपने अधीन दास बना लिया’
  alternative: ‘अधीन कर लिया’ या ‘परास्त कर दिया’
  rationale: δουλόω-परिवार की शब्दावली यहाँ केवल सामान्य राजनीतिक अधीनता से अधिक कठोर बंधन व्यक्त करती है। इसलिए नरम विकल्प के बजाय ‘दास’ रखा गया है, बिना किसी अतिरिक्त धार्मिक अर्थ को जोड़े।
- issue: κατέφθειραν में विनाश की सीमा
  choice: ‘तबाह कर दिया’
  alternative: ‘नष्ट कर दिया’
  rationale: मूल क्रिया गंभीर विनाश व्यक्त कर सकती है, किंतु उसके बाद लोगों को दास बनाने का उल्लेख पूर्ण उन्मूलन को आवश्यक नहीं बनाता। मुख्य पाठ इस तनाव को खुला रखता है और अधिक कठोर विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य-क्रम को हिन्दी की स्वाभाविकता के लिए हल्का बदला गया है, जबकि राज्यों, द्वीपों, विरोध, विनाश और दासता के सभी मूल तत्व सुरक्षित हैं।
