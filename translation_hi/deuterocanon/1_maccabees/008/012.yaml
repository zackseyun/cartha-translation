  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: hi
  text: परन्तु उन्होंने अपने सहयोगियों[a] और उन लोगों के साथ, जो उन पर भरोसा रखते थे, मैत्री बनाए रखी; और निकट और दूर के राज्यों पर अधिकार कर लिया। और जिन-जिन ने उनका नाम सुना[b], वे उनसे डरते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मित्रों”; यूनानी शब्द φίλοι का अर्थ व्यक्तिगत मित्र या राजनीतिक सहयोगी, दोनों हो सकता है; यहाँ राजनयिक प्रसंग में “सहयोगियों” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “उनका नाम सुना” से आशय उनकी ख्याति या प्रतिष्ठा के बारे में सुनना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: परन्तु ... के साथ
  rationale: δέ क्रम को आगे बढ़ाते हुए हल्का विरोध भी दिखा सकता है; प्रसंग में ‘परन्तु’ पूर्ववर्ती कथन से स्वाभाविक संबंध रखता है।
- source_word: τῶν φίλων αὐτῶν
  choice: अपने मित्रों
  rationale: φίλοι का मूल अर्थ ‘मित्र’ है और राजनीतिक संदर्भ में इसमें सहयोगी भी शामिल हो सकते हैं; मुख्य पाठ में व्यापक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: उन पर भरोसा रखनेवालों
  rationale: ἐπαναπαύομαι यहाँ किसी पर निर्भरता या विश्वास रखने का भाव देता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: उनके साथ मित्रता बनाए रखी
  rationale: συντηρέω निरंतर बनाए रखने या सुरक्षित रखने को व्यक्त करता है; φιλία व्यक्तिगत अथवा राजनयिक मित्रता हो सकती है।
- source_word: κατεκράτησαν
  choice: अधिकार कर लिया
  rationale: κατακρατέω प्रभुत्व प्राप्त करने या वश में करने का बोध देता है; यह चयन औपचारिक राजपद का अनावश्यक संकेत दिए बिना राजनीतिक नियंत्रण व्यक्त करता है।
- source_word: τῶν βασιλειῶν τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: निकट और दूर के राज्यों
  rationale: यह भौगोलिक विस्तार बताने वाला युग्म है; ‘निकट और दूर’ स्रोत की संक्षिप्तता और व्यापकता दोनों रखता है।
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: जितनों ने उनका नाम सुना
  rationale: शाब्दिक अभिव्यक्ति ‘उनका नाम सुना’ ख्याति या प्रतिष्ठा सुनने का अर्थ भी दे सकती है; मुख्य पाठ स्रोत की छवि बनाए रखता है।
- source_word: ἐφοβοῦντο αὐτούς
  choice: वे उनसे डरते थे
  rationale: φοβέομαι यहाँ रोमी शक्ति के प्रति वास्तविक भय व्यक्त करता है; सरल आधुनिक हिन्दी में यही सीधा अर्थ है।
