- source_word: οἷς δʼ ἂν βούλωνται
  choice: जिन्हें वे ... चाहते हैं
  rationale: ἄν के साथ संबंधवाचक रचना अनिश्चित और खुले अर्थ वाली है; हिन्दी में ‘जिन्हें वे ... चाहते हैं’ उसका स्वाभाविक रूप है।
- source_word: βοηθεῖν
  choice: सहायता देकर
  rationale: क्रिया का मूल अर्थ सहायता करना है। यहाँ राजकीय संदर्भ में अगले पद के साथ संबंध स्पष्ट करने के लिए ‘सहायता देकर’ स्वाभाविक है, पर सैन्य सहायता तक अर्थ को सीमित नहीं करता।
- source_word: καὶ βασιλεύειν, βασιλεύουσιν
  choice: राजा बनाना चाहते हैं, उन्हें राजा बना देते हैं
  rationale: βασιλεύειν सामान्यतः ‘राजा होना/राज करना’ है, पर इस वाक्य में रोमियों द्वारा शासक स्थापित करने का आशय है। हिन्दी में ‘राजा बना देते हैं’ राजनीतिक कारकता को स्पष्ट और सहज ढंग से व्यक्त करता है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: μεθιστῶσιν
  choice: पद से हटा देते हैं
  rationale: μεθίστημι का व्यापक अर्थ हटाना या स्थान बदलना है; शासकों के राजनीतिक संदर्भ में ‘पद से हटाना’ आशय को स्पष्ट करता है, जबकि ‘अपदस्थ करना’ की तुलना में अधिक सर्वसुलभ है।
- source_word: ὑψώθησαν σφόδρα
  choice: बहुत शक्तिशाली हो गए हैं
  rationale: शाब्दिक अर्थ ‘बहुत ऊँचे उठाए गए/बहुत ऊँचे हो गए’ है। प्रसंग रोम की शक्ति और प्रतिष्ठा के उत्कर्ष का है, इसलिए यह स्वाभाविक हिन्दी परिणामसूचक अनुवाद है; रूपक पादटिप्पणी में सुरक्षित है।
