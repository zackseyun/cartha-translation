  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: hi
  text: जिन्हें वे सहायता देना और राजा बनाना चाहते हैं, उन्हें राजा बनाते हैं[a]; और जिन्हें चाहें, उन्हें पद से हटा देते हैं[b]। वे बहुत शक्तिशाली हो गए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सहायता देना’ और ‘राजा बनाना’ के साथ एक ही संबंधवाचक पद जुड़ा है। ‘राजा बनाना’ वाली क्रिया का सामान्य अर्थ ‘राज करना’ भी हो सकता है, पर यहाँ प्रसंग में आशय उन लोगों को राजसत्ता दिलाने का है।
    reason: source_ambiguity
  - marker: b
    text: या “अपदस्थ कर देते हैं”; यूनानी क्रिया का अर्थ हटाना या स्थान बदलना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वे बहुत ऊँचे उठाए गए।” यहाँ यह उनकी शक्ति और प्रतिष्ठा के उत्कर्ष को बताता है।
    reason: lexical_alternative
