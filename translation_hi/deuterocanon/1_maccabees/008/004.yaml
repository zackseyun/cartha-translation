base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: hi
  text: और उन्होंने अपनी मंत्रणा और तलवार के बल पर उस पूरे प्रदेश को अपने अधिकार में कर लिया—यद्यपि वह प्रदेश उनसे बहुत दूर था—और पृथ्वी के छोर से उन पर चढ़ाई करनेवाले राजाओं को भी[a], यहाँ तक कि उन्होंने उन्हें चूर कर दिया और उन पर भारी प्रहार किया; और शेष लोग उन्हें साल-दर-साल कर चुकाते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “पृथ्वी के छोर से”; यह बहुत दूर स्थान से आने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “शेष लोग” से आशय बचे हुए राजा या जनसमूह हो सकते हैं, जो उन्हें हर साल कर चुकाते हैं।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: κατεκράτησαν
  choice: अपने अधिकार में कर लिया
  rationale: यह राजनीतिक और सैनिक संदर्भ में बलपूर्वक प्रभुत्व स्थापित करने का स्वाभाविक हिन्दी रूप है।
- source_word: τοῦ τόπου παντός
  choice: उस पूरे प्रदेश को
  rationale: τόπος यहाँ सामान्य ‘स्थान’ नहीं, बल्कि भौगोलिक-राजनीतिक क्षेत्र को सूचित करता है।
- source_word: τῇ βουλῇ αὐτῶν
  choice: अपनी मंत्रणा ... के बल पर
  rationale: βουλή में सोच-विचार, नीति और रणनीतिक परामर्श का भाव है; ‘मंत्रणा’ इस अर्थ को संक्षेप में बनाए रखती है।
- source_word: τῇ ῥομφαίᾳ
  choice: तलवार के बल पर
  rationale: तलवार सैन्य शक्ति का लक्षणार्थक चित्र है; हिन्दी पदबंध रूपक और आशय दोनों सुरक्षित रखता है।
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: उनसे बहुत दूर था
  rationale: σφόδρα की तीव्रता को ‘बहुत’ से स्पष्ट रखा गया है।
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: उन पर चढ़ाई करनेवाले राजाओं को भी
  rationale: संबंधकारक पद को κατεκράτησαν के दूसरे कर्म के रूप में लिया गया है; ἐπέρχομαι का विरोधी सैनिक भाव ‘चढ़ाई करनेवाले’ से व्यक्त होता है।
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: पृथ्वी के छोर से
  rationale: यूनानी के एकवचन और अत्यन्त दूरी के चित्रात्मक मुहावरे को निकटता से सुरक्षित रखा गया है।
- source_word: συνέτριψαν
  choice: चूर कर दिया
  rationale: यह निर्णायक पराजय का प्रबल चित्र बनाए रखता है।
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: उन पर भारी प्रहार किया
  rationale: शाब्दिक प्रहार-रूपक को स्वाभाविक हिन्दी में रखा गया है, उसे केवल ‘पराजित किया’ में समतल नहीं किया गया।
- source_word: οἱ ἐπίλοιποι
  choice: शेष लोग
  rationale: यूनानी में यह स्पष्ट नहीं कि शेष राजा, जनसमूह या दोनों अभिप्रेत हैं; ‘लोग’ संदर्भ को समझने योग्य रखते हुए इस अस्पष्टता को पर्याप्त रूप से खुला छोड़ता है।
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: उन्हें ... कर देते हैं
  rationale: पाठ का आशय नियमित रूप से अधीनता-कर अदा करना है; वर्तमानकाल को सुरक्षित रखा गया है।
- source_word: κατʼ ἐνιαυτόν
  choice: साल-दर-साल
  rationale: यह आवर्ती वार्षिक भुगतान को सहज आधुनिक हिन्दी में व्यक्त करता है।
