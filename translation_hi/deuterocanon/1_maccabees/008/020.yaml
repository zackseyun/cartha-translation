base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: hi
  text: “यहूदा, जो मकाबी भी कहलाता है, उसके भाइयों और यहूदियों के जनसमूह ने हमें आपके पास भेजा, ताकि हम आपके साथ गठबंधन और शांति स्थापित करें, और आपके सहयोगी तथा मित्र के रूप में दर्ज किए जाएँ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम आपके सहयोगी तथा मित्र के रूप में लिखे जाएँ।” यूनानी वाक्यांश संभवतः किसी औपचारिक राजनयिक सूची या अभिलेख में नाम दर्ज किए जाने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यूनानी Ἰούδας के लिए प्रचलित हिन्दी बाइबलीय नाम; ‘जूडस’ की अपेक्षा हिन्दी पाठकों के लिए अधिक स्वाभाविक।
- source_word: ὁ καὶ Μακκαβαῖος
  choice: जो मकाबी भी कहलाता है
  rationale: ὁ καὶ + नाम यहाँ वैकल्पिक नाम अथवा उपाधि का संकेत देता है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाइयों
  rationale: संदर्भ में यहूदा के पुरुष सहोदर अभिप्रेत हैं; सामान्यीकृत ‘भाई-बंधु’ आवश्यक नहीं।
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: यहूदियों के जनसमूह
  rationale: πλῆθος एक बड़े सामूहिक निकाय को दर्शाता है, पर किसी औपचारिक सभा को अनिवार्यतः निर्दिष्ट नहीं करता।
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: हमें आपके पास भेजा है
  rationale: प्रत्यक्ष, स्वाभाविक और औपचारिक हिन्दी; पत्र के उद्धृत भाषण में पूर्ण क्रिया का वर्तमान-सापेक्ष प्रभाव ठीक बैठता है।
- source_word: στῆσαι
  choice: स्थापित करें
  rationale: राजनयिक व्यवस्था को विधिवत कायम करने का भाव व्यक्त करता है।
- source_word: συμμαχίαν
  choice: मैत्री-संधि
  rationale: राजनीतिक अथवा सैन्य सहयोग की औपचारिक संधि का भाव देता है; केवल ‘मित्रता’ से अधिक सटीक।
- source_word: εἰρήνην
  choice: शांति
  rationale: मूल में केवल εἰρήνην है; ‘शांति-संधि’ जोड़ने से अनावश्यक विशिष्टता आती।
- source_word: γραφῆναι ἡμᾶς
  choice: हम आपके अभिलेख में दर्ज किए जाएँ
  rationale: निष्क्रिय infinitive औपचारिक लेखांकन, पंजीकरण या अभिलेखन की ओर संकेत करता है; ‘अभिलेख में’ निहित प्रशासनिक भाव को सहज हिन्दी में स्पष्ट करता है।
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: मित्र-सहयोगियों के रूप में
  rationale: दो राजनयिक श्रेणियों ‘सहयोगी और मित्र’ को प्रवाहपूर्ण हिन्दी में संयुक्त रूप से रखता है, यद्यपि पदानुक्रम को पूरी तरह मिटाता नहीं।
