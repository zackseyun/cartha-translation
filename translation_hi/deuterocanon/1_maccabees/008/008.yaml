  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। डैश मूल वाक्य में भूभागों के वर्णन को स्पष्ट करता है, जबकि ‘उससे’ मूल यूनानी के सर्वनामगत संदर्भ को बिना किसी नाम की अनावश्यक पूर्ति के सुरक्षित रखता है।
