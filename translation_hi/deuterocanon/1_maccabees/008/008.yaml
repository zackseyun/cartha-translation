base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
translation:
  language: hi
  text: और भारत, मादै और लूदिया के प्रदेश—उनके सबसे उत्तम भूभागों में से कुछ[a]—उन्होंने उससे ले लिए और राजा यूमेनेस को दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके सबसे मनोहर प्रदेशों में से।’ यूनानी में शाब्दिक अर्थ ‘उनके सबसे सुंदर प्रदेशों में से’ है; यहाँ यह विशेष रूप से अच्छे या वांछनीय भूभागों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  choice: भारत, मादै और लूदिया के प्रदेश
  rationale: χώρα यहाँ नामित भौगोलिक क्षेत्रों के लिए प्रयुक्त है। हिन्दी में बहुवचन ‘प्रदेश’ तीनों नामों को स्वाभाविक रूप से समेटता है; नामों के मानक बाइबलीय रूप रखे गए हैं।
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: उनके सबसे उत्तम भूभागों में से कुछ
  rationale: ἀπό के साथ बहुवचन पदबंध का अंशवाचक भाव है। καλλίστων का राजनीतिक-भौगोलिक संदर्भ में स्वाभाविक अर्थ ‘सबसे उत्तम’ है; ‘कुछ’ हिन्दी में अंशवाचकता स्पष्ट करता है।
- source_word: λαβόντες αὐτὰς παρ' αὐτοῦ
  choice: उन्होंने उससे ले लिए
  rationale: अओरिस्ट कृदन्त को कथात्मक हिन्दी में मुख्य क्रिया के रूप में रखा गया है। παρ’ αὐτοῦ का सर्वनाम अस्पष्ट antecedent को मूल की तरह बनाए रखता है; ‘छीन लिए’ की अपेक्षा ‘ले लिए’ λαμβάνω के प्रति अधिक तटस्थ है।
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: राजा यूमेनेस को दे दिए
  rationale: ἔδωκαν का सीधा अर्थ ‘दे दिए’ है और हिन्दी में राजकीय उपाधि नाम से पहले रखना स्वाभाविक है।
