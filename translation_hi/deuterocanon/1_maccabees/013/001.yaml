  text: And Simon heard that Tryphon was gathering a large force to come into the land of Judah and destroy it[a].
translation:
  language: hi
  text: और शमौन ने सुना कि त्रिफोन यहूदा की भूमि[a] में आने और उसे नष्ट करने के लिए एक बड़ी सेना इकट्ठी कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया की भूमि।” यूनानी पाठ में “यहूदा की भूमि” है, जिसका अर्थ बाद की प्रशासनिक संज्ञा के बजाय यहूदा से ऐतिहासिक रूप से जुड़ा हुआ क्षेत्र भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: ने सुना
  rationale: साधारण भूतकाल में यह अभिव्यक्ति प्राप्त सूचना का सीधा बोध कराती है और यूनानी क्रिया में कोई अतिरिक्त व्याख्यात्मक अर्थ नहीं जोड़ती।
- source_word: συνῆγεν
  choice: इकट्ठी कर रहा था
  rationale: यूनानी अपूर्ण भूतकाल चल रही कार्रवाई को दर्शाता है; हिन्दी की यह रचना उसी जारी प्रक्रिया को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δύναμιν πολλὴν
  choice: एक बड़ी सेना
  rationale: सैन्य प्रसंग में δύναμις सशस्त्र बल या सैनिक दल को दर्शाता है। 'बड़ी सेना' सामान्य हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है, यद्यपि यूनानी किसी औपचारिक सैन्य संगठन को अनिवार्य नहीं करता।
- source_word: τοῦ ἐλθεῖν
  choice: में आने के लिए
  rationale: सव्यय अनंत क्रिया यहाँ उद्देश्य व्यक्त करती है। 'आने' से यहूदा की भूमि की ओर गति बनी रहती है।
- source_word: γῆν Ἰούδα
  choice: यहूदा की भूमि
  rationale: यह चयन यूनानी शब्दावली के निकट रहते हुए ऐतिहासिक-भौगोलिक क्षेत्र का संकेत देता है और बाद की प्रशासनिक संज्ञा को मुख्य पाठ में नहीं लाता।
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: और उसे नष्ट करने के लिए
  rationale: दूसरी सव्यय अनंत क्रिया भी उद्देश्य बताती है। 'नष्ट करने' में ἐκτρίβω की प्रबल शत्रुतापूर्ण मंशा स्पष्ट रहती है, और 'उसे' का संदर्भ यहूदा की भूमि से है।
