  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: लौटकर
  rationale: यह क्रिया यहाँ पीछे मुड़ने या लौटने का भाव देती है। ‘लौटकर’ अगली क्रिया के साथ स्वाभाविक हिन्दी वाक्य बनाती है और घटनाक्रम की दिशा बनाए रखती है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह रूप उस स्थान से प्रस्थान को व्यक्त करता है। ‘चला गया’ आधुनिक हिन्दी में स्वाभाविक है और केवल ‘गया’ की अपेक्षा वहाँ से चले जाने का भाव अधिक स्पष्ट करता है।
- source_word: γῆν
  choice: देश
  rationale: γῆ का अर्थ भूमि, देश या क्षेत्र हो सकता है। अपने मूल स्थान की ओर लौटने के इस प्रसंग में ‘देश’ सहज है, बिना किसी अधिक विशिष्ट राजनीतिक अर्थ को आरोपित किए।
- source_word: αὐτοῦ
  choice: अपने
  rationale: कर्ता त्रूफ़ोन की ओर लौटने वाला निजवाचक ‘अपने’ हिन्दी में यूनानी संबंधवाचक भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Τρύφων
  choice: त्रूफ़ोन
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
