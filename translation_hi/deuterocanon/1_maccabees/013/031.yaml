  rationale: The revision removes the misleading ‘छोटे राजा,’ makes the deceitful conduct clause natural in modern standard Hindi, and retains the Greek ambiguity noted in the footnote. It does not make Antiochus the grammatical target of Tryphon’s deceit before the killing clause, nor does it add a moral or legal characterization to the killing.
