    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: चल रहा था
  rationale: अपूर्ण भूतकाल की चलती हुई क्रिया को बनाए रखता है। प्रसंग में यह केवल यात्रा नहीं, त्रूफ़ोन के व्यवहार और गतिविधि को भी सूचित कर सकता है; इसलिए स्वाभाविक हिन्दी में व्यापक अर्थ वाला ‘चल रहा था’ रखा गया है।
- source_word: δόλῳ
  choice: छल से
  rationale: करण/रीति के दत्तिव रूप को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है तथा छलपूर्ण रीति और छल को साधन बनाने—दोनों संभावनाएँ खुली रखता है।
- source_word: μετὰ Ἀντιόχου
  choice: अन्तियोकुस के साथ
  rationale: μετά के साथ संबंधकारक का सामान्य अर्थ ‘के साथ’ है। आगे की हत्या के कारण निहित शत्रुता होने पर भी मूल वाक्य यहाँ ‘विरुद्ध’ नहीं कहता।
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: छोटे राजा
  rationale: νεωτέρου तुलनात्मक रूप है और दूसरे, बड़े व्यक्ति से भेद सूचित करता है। ‘छोटे राजा अन्तियोकुस’ आधुनिक हिन्दी में स्वाभाविक है और ‘युवा’ कहकर केवल आयु-अवस्था निर्धारित नहीं करता।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: क्रिया के सीधे अर्थ ‘kill’ को स्वाभाविक हिन्दी में देता है; ‘हत्या की’ की अपेक्षा कानूनी या नैतिक वर्गीकरण कम जोड़ता है।
