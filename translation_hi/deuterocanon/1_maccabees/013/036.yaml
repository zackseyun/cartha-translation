  rationale: पत्र के आरंभिक संबोधन में उपाधि और व्यक्तिगत नाम को स्वाभाविक हिन्दी क्रम में रखा गया है। यूनानी में निश्चित उपपद न होने पर भी यहाँ ‘राजा’ राजकीय उपाधि है।
- source_word: Σίμωνι
