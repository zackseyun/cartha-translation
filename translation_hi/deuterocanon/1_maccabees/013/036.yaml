- source_word: καὶ
  choice: और
  rationale: शमौन की दोनों पदवियों को जोड़ने वाला साधारण समुच्चयबोधक।
- source_word: φίλῳ βασιλέων
  choice: राजाओं के मित्र
  rationale: बहुवचन βασιλέων को सुरक्षित रखते हुए दरबारी सम्मानसूचक पदवी का औपचारिक स्वर बनाए रखा गया है; इसे अधिक व्याख्यात्मक ‘राजमित्र’ नहीं बनाया गया।
- source_word: implicit epistolary relation
  choice: की ओर से … को
  rationale: यूनानी शीर्षकीय सूत्र में प्रेषक और प्राप्तकर्ता बिना क्रिया के रखे गए हैं। हिन्दी में उसका संबंध स्पष्ट और स्वाभाविक करने के लिए ‘की ओर से … को’ प्रयुक्त हुआ, जबकि वाक्य का शीर्षकीय, अधूरा स्वर सुरक्षित है।
