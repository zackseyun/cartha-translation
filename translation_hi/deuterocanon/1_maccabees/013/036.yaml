  rationale: सम्प्रदान कारक को ‘को’ से व्यक्त किया गया है। इस यहूदी ऐतिहासिक संदर्भ में प्रचलित हिन्दी बाइबलीय नाम ‘शमौन’ अपनाया गया है।
- source_word: ἀρχιερεῖ
