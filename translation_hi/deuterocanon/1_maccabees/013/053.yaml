  yaml_path: translation/deuterocanon/1_maccabees/013/053.yaml
  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: hi
  text: और शमौन ने देखा कि उसका पुत्र यूहन्ना पुरुष हो चुका है। उसने उसे सारी सेनाओं का सेनापति नियुक्त किया; और वह गजारा[a] में रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गजारा उस स्थान के नाम का यूनानी रूप है, जिसे सामान्यतः गेजेर के नाम से जाना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: पुरुष हो चुका है
  rationale: यह पदबंध यूनानी के ‘पुरुष है’ को स्वाभाविक हिन्दी में व्यक्त करते हुए यूहन्ना के पुरुषत्व की अवस्था तक पहुँचने और उत्तरदायित्व के योग्य होने का संकेत देता है; उसकी योग्यता का विस्तृत अर्थ अगले वाक्य में नियुक्ति से स्पष्ट होता है।
- source_word: ἔθετο
  choice: नियुक्त किया
  rationale: सैन्य पद सौंपने के संदर्भ में ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἡγούμενον
  choice: सेनापति
  rationale: ‘सारी सेनाओं’ के साथ यह शब्द सैन्य नेतृत्व को दर्शाता है; ‘सेनापति’ इसी भूमिका को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: τῶν δυνάμεων πάσων
  choice: सारी सेनाओं का
  rationale: यहाँ δυνάμεις सैन्य दलों या सेनाओं के अर्थ में है; सम्बन्धकारक रचना को हिन्दी में ‘सेनापति’ के साथ स्वाभाविक ढंग से जोड़ा गया है।
- source_word: ᾤκει
  choice: रहता था
  rationale: अपूर्ण भूतकाल वहाँ लगातार निवास करने का भाव देता है, जिसे ‘रहता था’ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν Γαζάροις
  choice: गजारा में
  rationale: मुख्य पाठ में यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण रखा गया है; अधिक परिचित नाम गेजेर को पादटिप्पणी में दिया गया है।
