  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: hi
  text: और त्रूफ़ोन ने अपनी सारी घुड़सवार सेना को आने के लिए तैयार किया; पर उस रात बहुत ही भारी बर्फ़ पड़ी, और बर्फ़ के कारण वह नहीं आया। तब वह कूच करके गिलाद के प्रदेश में चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡτοίμασεν
  choice: तैयार की
  rationale: सैन्य तैयारी के संदर्भ में यह सरल और स्वाभाविक भूतकालीन अभिव्यक्ति है।
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: अपनी सारी घुड़सवार सेना
  rationale: ἵππος का मूल अर्थ ‘घोड़ा’ है, पर यहाँ सामूहिक सैन्य प्रयोग में इससे घुड़सवार सैनिक अभिप्रेत हैं।
- source_word: ἐλθεῖν
  choice: आने के लिए
  rationale: यूनानी क्रिया के सामान्य दिशात्मक अर्थ ‘आना’ को बनाए रखा गया है; ‘आगे बढ़ना’ जैसी व्याख्यात्मक सैन्य छाया नहीं जोड़ी गई।
- source_word: χιών πολλὴ σφόδρα
  choice: बहुत ही भारी बर्फ़ पड़ी
  rationale: यह मुहावरेदार आधुनिक हिन्दी में हिमपात की अत्यधिक मात्रा को स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: बर्फ़ के कारण वह नहीं आया
  rationale: διά के कारणवाचक अर्थ और मूल कथन को सुरक्षित रखा गया है; ‘नहीं आ सका’ कहकर असमर्थता का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: ἀπῆρεν
  choice: वहाँ से कूच करके
  rationale: सैन्य प्रसंग में यह प्रस्थान का स्वाभाविक अनुवाद है। ‘वहाँ से’ हिन्दी में गति के आरंभ को स्पष्ट करता है, जबकि ‘कूच’ सैन्य परिस्थिति के अनुकूल है।
- source_word: Γαλααδῖτιν
  choice: गिलाद के प्रदेश
  rationale: यूनानी क्षेत्रवाचक नाम को आधुनिक पाठक के लिए परिचित बाइबलीय स्थान-नाम ‘गिलाद’ और स्पष्ट संज्ञा ‘प्रदेश’ के साथ प्रस्तुत किया गया है।
