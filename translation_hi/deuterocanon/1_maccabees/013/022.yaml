  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल यूनानी में किसी आवश्यक पाठांतर या ऐसी अस्पष्टता का संकेत नहीं है जिसके लिए पादटिप्पणी चाहिए। दिए गए अंग्रेज़ी मसौदे में हिमपात के बाद लगा [a] चिह्न गिलाद संबंधी पादटिप्पणी से मेल नहीं खाता; इसलिए उस असंगत चिह्न और अनावश्यक पादटिप्पणी को हिन्दी पाठ में नहीं लिया गया।
