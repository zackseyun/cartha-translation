  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: hi
  text: और उन्होंने कहा, “हमारे बुरे कामों के अनुसार हमारे साथ व्यवहार न कर, बल्कि अपनी दया के अनुसार कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρήσῃ
  choice: व्यवहार कर
  rationale: χράομαι का यह प्रयोग किसी के साथ किसी रीति से पेश आने या व्यवहार करने का भाव देता है। हिंदी में ‘हमारे साथ व्यवहार कर’ स्वाभाविक है और संबंधपरक अर्थ बनाए रखता है।
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: हमारे बुरे कामों के अनुसार
  rationale: πονηρίας बहुवचन में है और यहाँ बुराई की ठोस अभिव्यक्तियों या दुष्कर्मों की ओर संकेत करता है। ‘बुरे कामों’ से बहुवचन और नैतिक अर्थ दोनों स्पष्ट रहते हैं।
- source_word: ἔλεός
  choice: दया
  rationale: ἔλεος का सीधा अर्थ दया या करुणा है। दंड के योग्य बुरे कामों के विपरीत इस विनती में ‘दया’ सबसे स्वाभाविक और बाइबिलीय हिंदी है।
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: हमारे साथ व्यवहार न कर
  rationale: μή के साथ क्रियारूप यहाँ निषेधात्मक विनती व्यक्त करता है। एक व्यक्ति को संबोधित करने के कारण ‘न कर’ मूल के एकवचन संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: दुष्कर्मों के योग्य प्रतिफल और संबोधित व्यक्ति की दया के बीच प्रार्थनापूर्ण विरोध
  choice: उनके बुरे कामों के अनुसार व्यवहार न करने, बल्कि अपनी दया के अनुसार करने की सीधी विनती
  alternative: ‘हमें हमारे पापों का दंड न दे’ जैसे व्याख्यात्मक रूप में कहना
  rationale: मूल यूनानी ‘दंड’ या ‘पाप’ शब्द नहीं जोड़ता, बल्कि व्यवहार के दो मानदंडों—उनके बुरे काम और उसकी दया—को आमने-सामने रखता है। अनुवाद उसी तनाव को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और विनती के स्वर के अनुरूप। ‘तू’ सर्वनाम को प्रकट किए बिना एकवचन क्रिया ‘कर’ से मूल संबोधन सुरक्षित रखा गया है।
