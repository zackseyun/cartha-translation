  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: hi
  text: तब उसने उनका उत्साह बढ़ाया और उनसे कहा, “तुम स्वयं जानते हो कि मैंने, मेरे भाइयों ने और मेरे पिता के घराने ने नियमों और पवित्र वस्तुओं[a] के लिए कितना कुछ किया है, और तुम उन युद्धों और संकटों को भी जानते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान।” यूनानी में शाब्दिक रूप से “पवित्र वस्तुएँ” है, जिसका संकेत अधिक व्यापक रूप से पवित्रस्थान और अन्य पवित्र विषयों की ओर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: उनका उत्साह बढ़ाते हुए
  rationale: इस प्रसंग में क्रिया लोगों को ढाढ़स देने और आगे के लिए प्रेरित करने का भाव रखती है। यह अनुवाद ‘समझाया’ या औपचारिक ‘उपदेश दिया’ की अपेक्षा उस प्रोत्साहन को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: Αὐτοὶ οἴδατε
  choice: तुम स्वयं जानते हो
  rationale: स्पष्ट सर्वनाम αὐτοὶ के बलाघात को ‘स्वयं’ द्वारा सुरक्षित रखा गया है।
- source_word: οἶκος τοῦ πατρός μου
  choice: मेरे पिता का घराना
  rationale: ‘घराना’ पारिवारिक वंश और परिवार-समुदाय दोनों को व्यक्त करता है तथा यूनानी पारिवारिक मुहावरे के निकट है।
- source_word: περὶ τῶν νόμων
  choice: नियमों के लिए
  rationale: περί यहाँ हित, सरोकार या रक्षा के लिए किए गए कार्यों को दर्शाता है। νόμων का बहुवचन ‘नियमों’ में बनाए रखा गया है।
- source_word: τῶν ἁγίων
  choice: पवित्र वस्तुओं
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण का शाब्दिक और व्यापक अर्थ रखा गया है; इसे केवल ‘पवित्रस्थान’ तक सीमित नहीं किया गया।
- source_word: τοὺς πολέμους καὶ τὰς στενοχωρίας
  choice: उन युद्धों और संकटों
  rationale: दोनों बहुवचनों को बनाए रखा गया है। हिंदी में ‘तुम ... जानते हो’ को दोहराकर इन्हें οἴδατε के समन्वित कर्मों के रूप में स्पष्ट किया गया है, बिना ‘हमने सहा’ जैसा अनुपस्थित क्रियापद जोड़ने के।
- source_word: ὅσα ... ἐποιήσαμεν
  choice: कितना कुछ किया है
  rationale: ὅσα की परिमाणात्मक व्यापकता और ποιέω के सामान्य अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: τῶν ἁγίων का दायरा
  choice: पवित्र वस्तुओं
  alternative: पवित्रस्थान
  rationale: यूनानी बहुवचन का संकेत पवित्रस्थान सहित पवित्र वस्तुओं या अन्य पवित्र विषयों की ओर हो सकता है। मुख्य पाठ व्यापकता बनाए रखता है और पाद-टिप्पणी संकीर्ण संभावित अर्थ बताती है।
- issue: अंतिम पदबंध का वाक्यगत संबंध
  choice: ‘जानते हो’ को दोहराकर युद्धों और संकटों को οἴδατε से जोड़ा गया
  alternative: ‘जिनका हमने सामना किया’ अथवा ‘जिन्हें हमने सहा’ जोड़ना
  rationale: यूनानी में अंतिम संज्ञाओं के साथ अलग क्रिया नहीं है। हिंदी में मुख्य क्रिया दोहराने से अर्थ स्पष्ट रहता है और अनुभव करने या सहने की अतिरिक्त व्याख्या पाठ में नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’ पारिवारिक-वंशगत मुहावरे को स्वाभाविक हिंदी में बनाए रखता है। अंतिम खंड में अटपटे समन्वय को दूर करने के लिए पहले से उपस्थित ‘जानते हो’ को दोहराया गया है, कोई नई घटना या क्रिया नहीं जोड़ी गई।
