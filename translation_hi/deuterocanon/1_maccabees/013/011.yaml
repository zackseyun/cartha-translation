  yaml_path: translation/deuterocanon/1_maccabees/013/011.yaml
  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: hi
  text: और उसने अबशालोम के पुत्र योनातान को एक पर्याप्त बड़े सैन्य दल के साथ याफा भेजा। योनातान ने वहाँ मौजूद लोगों को निकाल दिया और वहीं, उसी नगर में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: कथात्मक प्रसंग में यह सामान्य और स्वाभाविक हिन्दी क्रिया है।
- source_word: Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: अबशालोम के पुत्र योनातान को
  rationale: यूनानी पदबंध योनातान की पहचान उसके पिता/वंश के द्वारा करता है; हिन्दी में यह कर्मकारक सहित स्वाभाविक क्रम है।
- source_word: δύναμιν ἱκανὴν
  choice: एक पर्याप्त बड़ी सेना
  rationale: δύναμις यहाँ सैन्य दल का सूचक है और ἱκανήν उसकी पर्याप्त तथा उल्लेखनीय संख्या बताता है। 'पर्याप्त बड़ी सेना' दोनों पहलुओं को व्यक्त करती है।
- source_word: εἰς Ἰόππην
  choice: याफा
  rationale: εἰς गंतव्य को सूचित करता है; 'भेजा' के साथ हिन्दी में नगर का नाम सीधे गंतव्य के रूप में स्वाभाविक है। Ἰόππη के लिए प्रचलित हिन्दी नाम 'याफा' चुना गया है।
- source_word: ἐξέβαλεν
  choice: निकाल दिया
  rationale: सैन्य-राजनीतिक प्रसंग में यह जबरन बाहर करने का स्पष्ट, सहज और गैर-तकनीकी हिन्दी रूप है।
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: वहाँ मौजूद लोगों को
  rationale: मूल यूनानी उन लोगों की पहचान केवल नगर में उनकी उपस्थिति से करता है; 'निवासियों' कहने से स्थायी निवास का अनावश्यक अर्थ जुड़ जाता।
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: उसी नगर में ठहरा रहा
  rationale: ἐκεῖ और ἐν αὐτῇ की दोहरी स्थान-सूचना को अस्वाभाविक पुनरुक्ति के बिना 'उसी नगर में' द्वारा दर्शाया गया है।
