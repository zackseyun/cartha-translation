    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψαντο ... κοπετὸν μέγαν
  choice: बड़ा विलाप किया
  rationale: यह यूनानी पदबंध सार्वजनिक और तीव्र शोक-विलाप का मुहावरा है। ‘बड़ा विलाप किया’ उसकी तीव्रता और औपचारिक शोक का भाव रखता है, पर छाती पीटने जैसी किसी विशिष्ट शारीरिक क्रिया को अनावश्यक रूप से नहीं जोड़ता।
- source_word: πᾶς Ἰσραήλ
  choice: समस्त इस्राएल
  rationale: यह लोगों को एक सामूहिक इकाई के रूप में व्यक्त करता है और मूल के व्यापक बल को बनाए रखता है।
- source_word: ἐπένθησαν
  choice: शोक मनाते रहे
  rationale: यह मृत व्यक्ति के लिए लगातार शोक करने का स्वाभाविक हिन्दी प्रयोग है और पहले आए ‘विलाप’ से अर्थगत हल्का भेद भी बनाए रखता है।
- source_word: ἡμέρας πολλὰς
  choice: बहुत दिनों तक
  rationale: अवधि सूचक कर्मकारक को हिन्दी में स्वाभाविक रूप से ‘बहुत दिनों तक’ कहा गया है।
