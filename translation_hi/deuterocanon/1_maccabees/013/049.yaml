base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: hi
  text: लेकिन यरूशलेम के गढ़[a] में रहने वालों को बाहर, देहात में जाने और खरीदने और बेचने नहीं दिया जाता था।[b] वे बहुत भूखे हो गए, और उनमें से बहुत-से अकाल के कारण मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के अक्रा में।” यूनानी शब्द ἄκρα का सामान्य अर्थ “गढ़” हो सकता है; यह यरूशलेम के सेल्यूसिड दुर्ग के नाम के रूप में भी प्रयुक्त होता था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “और और खरीदने और बेचने” है; दो बार आया “और” संभवतः नकल करते समय हुई पुनरावृत्ति है और वाक्य के अर्थ को नहीं बदलता।
    reason: textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: गढ़
  rationale: यह यूनानी शब्द किसी ऊँचे दुर्ग या गढ़ को सूचित कर सकता है और यहाँ यरूशलेम के प्रसिद्ध सेल्यूसिड गढ़ का पदनाम भी हो सकता है। ‘गढ़’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पदनाम की संभावना पादटिप्पणी में रखी गई है।
- source_word: ἐκωλύοντο
  choice: रोका गया था
  rationale: अपूर्णकालिक कर्मवाच्य रूप लगातार जारी बाहरी रोक को व्यक्त करता है।
- source_word: ἐκπορεύεσθαι εἰς τὴν χώραν
  choice: देहात में बाहर जाने
  rationale: χώρα यहाँ नगर के बाहर के ग्रामीण क्षेत्र को सूचित करता है; ‘देहात’ इस संदर्भ में सहज और स्पष्ट है।
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: खरीदने-बेचने
  rationale: दोनों क्रियाओं को बनाए रखने से बाजार की सामान्य गतिविधियों पर लगी रोक स्पष्ट होती है।
- source_word: ἐπείνασαν σφόδρα
  choice: बहुत भूखे हो गए
  rationale: यह गंभीर भूख की परिणति को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱκανοὶ
  choice: बहुत-से
  rationale: यह एक पर्याप्त बड़ी किंतु अनिर्दिष्ट संख्या को दर्शाता है।
- source_word: ἀπώλοντο τῷ λιμῷ
  choice: अकाल के कारण मर गए
  rationale: इस प्रसंग में ἀπόλλυμι मृत्यु और λιμός घेराबंदी से उत्पन्न अकाल को सूचित करता है; सरल हिंदी में अर्थ स्पष्ट रखा गया है।
