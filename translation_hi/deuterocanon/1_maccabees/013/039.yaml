base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: hi
  text: परन्तु हम आज के दिन तक की तुम्हारी अनजाने में हुई भूलों[a] और पापों को क्षमा करते हैं, और उस मुकुट-कर[b] को भी जो तुम पर बकाया था; और यदि यरूशलेम में कोई और कर वसूला जाता था, तो अब से वह न वसूला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अनजाने में हुई भूलों’ का अनुवाद ‘अज्ञान में हुई चूकों’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मुकुट-कर’ का शाब्दिक अर्थ ‘मुकुट’ है; यहाँ सम्भवतः राजमुकुट को दिया जाने वाला कर या राजकीय देय राशि अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: हम क्षमा करते हैं
  rationale: यह क्रिया क्षमा करने, छोड़ देने या देयता माफ़ करने का अर्थ रखती है। यहाँ यह अपराधों और पापों के साथ-साथ कर-संबंधी देयता पर भी लागू होती है; इसलिए ‘क्षमा करते हैं’ इसके नैतिक-कानूनी विस्तार को बनाए रखता है।
- source_word: ἀγνοήματα
  choice: अनजाने में हुए अपराध
  rationale: यह संज्ञा अज्ञान या अनवधानता से हुई चूकों अथवा अपराधों को सूचित करती है। यह अभिव्यक्ति ἁμαρτήματα से भेद रखते हुए आशय को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: ἁμαρτήματα
  choice: पापों
  rationale: यूनानी शब्द का सामान्य नैतिक अर्थ ‘पाप’ है। राजकीय संदर्भ होने पर भी इसे केवल प्रशासनिक ‘अपराध’ तक सीमित न करके मूल के नैतिक बल को सुरक्षित रखा गया है।
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: आज के दिन तक
  rationale: यह क्षमा की समय-सीमा बताने वाली औपचारिक अभिव्यक्ति है और राजकीय घोषणा के स्वर के अनुकूल है।
- source_word: στέφανον
  choice: मुकुट-कर
  rationale: शाब्दिक अर्थ ‘मुकुट’ है, पर इस हेलेनिस्टिक प्रशासनिक संदर्भ में यह राजमुकुट से संबद्ध कर या देय राशि को सूचित करता है। ‘मुकुट-कर’ मूल बिंब और वित्तीय आशय दोनों रखता है।
- source_word: ὠφείλετε
  choice: जिसके तुम ऋणी थे
  rationale: अपूर्ण भूतकाल एक चली आ रही बकाया देयता को दर्शाता है। यह हिन्दी प्रयोग उस दायित्व को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐτελωνεῖτο
  choice: कर वसूला जाता था
  rationale: क्रिया कर या चुंगी लगाने और वसूलने से संबंधित है। यहाँ कर का प्रकार अनिर्दिष्ट है, इसलिए सामान्य प्रशासनिक अभिव्यक्ति चुनी गई है।
- source_word: μηκέτι τελωνιζέσθω
  choice: अब से वह न वसूला जाए
  rationale: यह निषेधात्मक आज्ञा पहले के कर-संग्रह को समाप्त करती है। कर्मवाच्य और राजकीय आदेश का स्वर सुरक्षित रखा गया है।
theological_decisions:
- issue: राजकीय घोषणा में ἁμαρτήματα को स्पष्ट नैतिक-धार्मिक शब्द से व्यक्त करना
  choice: पापों
  alternative: अपराधों; गलत कामों
  rationale: यद्यपि प्रसंग राजनीतिक और वित्तीय है, मूल पाठ ἀγνοήματα के साथ सामान्य नैतिक शब्द ἁμαρτήματα रखता है। ‘पापों’ से इस जानबूझकर रखे गए भेद और नैतिक-कानूनी तनाव को सुरक्षित रखा गया है।
- issue: στέφανον का शाब्दिक अथवा प्रशासनिक अर्थ
  choice: मुकुट-कर
  alternative: मुकुट; राजकीय कर; कर
  rationale: केवल ‘मुकुट’ इस संदर्भ में भ्रमित कर सकता है, जबकि केवल ‘कर’ मूल शब्द के बिंब को मिटा देता है। ‘मुकुट-कर’ दोनों पक्षों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण राजकीय घोषणा के स्वर के साथ रखी गई है। ‘परन्तु’, ‘ऋणी’ और निषेधात्मक कर्मवाच्य औपचारिकता देते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज बनी रहती है।
