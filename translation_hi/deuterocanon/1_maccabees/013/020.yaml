  yaml_path: translation/deuterocanon/1_maccabees/013/020.yaml
  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: hi
  text: इन बातों के बाद त्रूफ़ोन नगर में प्रवेश करने और उसे मिटा देने के लिए आया। उसने अदोरा जानेवाले मार्ग को चारों ओर से घेर लिया[a]; और शमौन तथा उसकी सेना, वह जहाँ कहीं जाता था, उसके सामने-सामने बढ़ते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अदोरा जानेवाले मार्ग को रोक लिया।” यूनानी में शाब्दिक रूप से मार्ग को “चारों ओर से घेरने” की बात है; यह पहुँच काट देने के लिए की गई सैन्य चाल हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके समानांतर चलते रहे” अथवा “उसके विरुद्ध आगे बढ़ते रहे।” यूनानी क्रिया से सूचित होता है कि शमौन की सेना हर स्थान पर त्रूफ़ोन की गतिविधि के अनुरूप अपनी चाल चलती रही।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह यूनानी पद के कालक्रम को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: नगर में घुसकर
  rationale: उद्देश्यसूचक रचना को हिन्दी में स्वाभाविक रूप दिया गया है। ‘घुसना’ सैन्य प्रसंग के प्रतिकूल प्रवेश का संकेत देता है, पर ‘आक्रमण करना’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐκτρῖψαι αὐτήν
  choice: उसे मिटा देने
  rationale: यह सैन्य प्रसंग में पूर्ण विनाश के प्रबल भाव को आधुनिक और सहज हिन्दी में बनाए रखता है।
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: अदोरा जानेवाले मार्ग को चारों ओर से घेर लिया
  rationale: ‘घेर लिया’ यूनानी क्रिया की मूल छवि को बनाए रखता है; मार्ग रोक देना इसका सम्भावित सैन्य परिणाम है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: Ἄδωρά
  choice: अदोरा
  rationale: स्थान-नाम के यूनानी रूप का सरल देवनागरी लिप्यंतरण।
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: उसकी सेना
  rationale: παρεμβολή का शाब्दिक अर्थ ‘छावनी’ हो सकता है, पर यहाँ चलने-फिरनेवाले सैन्य बल का बोध है; इसलिए ‘सेना’ हिन्दी में अधिक स्वाभाविक है।
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: उसके सामने-सामने बढ़ते रहे
  rationale: यह त्रूफ़ोन की गतिविधियों के अनुरूप विरोधी दिशा में साथ-साथ सैन्य बढ़त का भाव रखता है, बिना सीधे युद्ध या आक्रमण का अर्थ जोड़ने के।
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: वह जहाँ कहीं जाता था
  rationale: यह बार-बार प्रत्येक स्थान पर उसकी चाल से मेल रखने का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
