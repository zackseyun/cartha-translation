lexical_decisions:
- source_word: ἀπέστειλε
  choice: भेज दिया
  rationale: कथात्मक एओरिस्ट के लिए यह स्वाभाविक आधुनिक हिन्दी है और कार्य के पूरा होने को व्यक्त करता है।
- source_word: τὰ παιδάρια
  choice: उन लड़कों
  rationale: παιδάριον आयु-सूचक रूप से लड़कों या किशोर सेवकों को दर्शा सकता है। प्रसंग में पहले माँगे गए बंधक अभिप्रेत हैं; ‘लड़कों’ से मूल का आयु-संकेत सुरक्षित रहता है।
- source_word: τὰ ἑκατὸν τάλαντα
  choice: सौ तोड़े
  rationale: यह निश्चित संख्या वाली प्राचीन भार-मुद्रा की अभिव्यक्ति है। हिन्दी बाइबलीय प्रयोग में ‘तोड़ा’ प्रचलित और समझने योग्य समतुल्य है।
- source_word: διεψεύσατο
  choice: अपना वचन तोड़ दिया
  rationale: इस प्रसंग में मध्यवाच्य क्रिया वचन या तय शर्तों को झुठलाने और छलपूर्ण ढंग से मुकरने का भाव रखती है; भुगतान और बंधक पाने के बाद वादा पूरा न करना संदर्भगत अर्थ है।
- source_word: οὐκ ἀφῆκεν
  choice: रिहा नहीं किया
  rationale: योनातान बंदी था, इसलिए सामान्य ‘जाने नहीं दिया’ की अपेक्षा ‘रिहा नहीं किया’ प्रसंग को स्पष्ट और ठीक व्यक्त करता है।
- source_word: τὸν Ἰωναθάν
  choice: योनातान
  rationale: Ἰωναθάν का मानक हिन्दी बाइबलीय नाम-रूप।
