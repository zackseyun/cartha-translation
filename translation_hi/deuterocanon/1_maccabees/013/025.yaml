  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। आरंभिक Καὶ को प्रसंगगत क्रम दिखाने के लिए ‘तब’ कहा गया है। ‘दफ़नाया’ सामान्य आधुनिक हिन्दी है; वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है।
