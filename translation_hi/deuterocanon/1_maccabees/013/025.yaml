    rationale: ἀπέστειλεν is absolute here. Although the implied action may concern messengers, the text does not state that Simon sent people.
  - severity: medium
    issue: ‘हड्डियाँ मँगवा लीं’ changes ‘took’ into a causative retrieval.
    rationale: ἔλαβεν means ‘took’; ‘मँगवा लीं’ specifies that Simon caused the bones to be brought to him, a detail not explicitly supplied by the Greek.
  - severity: low
