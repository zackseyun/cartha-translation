  yaml_path: translation/deuterocanon/1_maccabees/013/025.yaml
  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
translation:
  language: hi
  text: और शमौन ने भेजा और अपने भाई योनातान की हड्डियाँ ले लीं, और उसे मोदीन में, जो उसके पुरखों का नगर था, दफनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: लोगों को भेजा
  rationale: यूनानी क्रिया का कर्म व्यक्त नहीं है, पर हिन्दी में केवल ‘भेजा’ अधूरा और अस्वाभाविक लगता है। ‘लोगों को’ प्रसंग से स्वाभाविक रूप से समझा जाता है, यद्यपि मूल में स्पष्ट नहीं है।
- source_word: ἔλαβεν
  choice: मँगवा लीं
  rationale: शमौन ने पहले भेजा और फिर हड्डियाँ प्राप्त कीं; हिन्दी में ‘मँगवा लीं’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है। ‘ले लीं’ अधिक शब्दशः होता, पर इससे शमौन के स्वयं जाकर लेने का भ्रामक संकेत मिल सकता है।
- source_word: τὰ ὀστᾶ
  choice: हड्डियाँ
  rationale: यह यूनानी के ठोस और प्रत्यक्ष शब्द का निकट अनुवाद है; ‘पार्थिव अवशेष’ अधिक व्याख्यात्मक और औपचारिक होता।
- source_word: Ἰωναθὰν
  choice: योनातान
  rationale: बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई
  rationale: हिन्दी में कर्ता शमौन की ओर स्पष्ट संकेत के लिए ‘अपने’ स्वाभाविक है और मूल का पारिवारिक संबंध सुरक्षित रखता है।
- source_word: ἔθαψεν αὐτὸν
  choice: उसने उसे ... दफ़नाया
  rationale: मूल में एकवचन सर्वनाम योनातान को संदर्भित करता है, जबकि पहले ‘हड्डियाँ’ बहुवचन है। हिन्दी में सर्वनाम को बनाए रखने से यह अर्थगत बदलाव और मूल की अभिव्यक्ति सुरक्षित रहती है।
- source_word: ἐν Μωδεεὶμ
  choice: मोदीन में
  rationale: स्थाननाम के यूनानी रूप Μωδεεὶμ का सुबोध हिन्दी लिप्यंतरण।
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: जो उसके पुरखों का नगर था
  rationale: ‘पुरखों’ से πατέρων का वंशगत अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है। ‘पितरों’ से धार्मिक-कर्मकांड संबंधी अर्थछाया आ सकती है, और ‘पिताओं’ यहाँ अस्वाभाविक है।
