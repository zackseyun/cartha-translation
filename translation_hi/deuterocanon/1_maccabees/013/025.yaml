  naturalness: The draft is fluent modern Hindi, but the added agents and causative wording go beyond the source. A direct coordinated rendering remains understandable and better preserves the Greek's restraint.
  terminology: ‘शमौन,’ ‘योनातान,’ ‘हड्डियाँ,’ and ‘मोदीन’ are suitable. ‘पुरखों का नगर’ naturally conveys the ancestral force of ‘the city of his fathers’; a footnote preserves the literal familial wording.
