  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: hi
  text: और शमौन ने यहूदिया का गढ़ बनाया। उसने उसके चारों ओर ऊँची मीनारों, बड़ी दीवारों, मीनारों, फाटकों और आड़ी सलाख़ों का घेरा बनाया[a] और गढ़ों में खाद्य-सामग्री रखी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में इस सूची में ‘मीनारों’ का उल्लेख दो बार आया है; अनुवाद में यह पुनरावृत्ति बनाए रखी गई है।
    reason: textual_detail
  - marker: b
    text: या, “गढ़ों में खाने की रसद जमा की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: निर्माण किया
  rationale: οἰκοδομέω का मूल अर्थ ‘बनाना/निर्माण करना’ है। इससे सैन्य संदर्भ बना रहता है, पर क्रिया को केवल ‘किलेबंद किया’ मानकर उसका अर्थ अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: यहूदिया के गढ़
  rationale: ὀχύρωμα किसी सुरक्षित, किलेबंद स्थान को दर्शाता है। ‘गढ़’ स्वाभाविक और संक्षिप्त है; आरंभिक एकवचन को भी बनाए रखता है।
- source_word: περιετείχισεν
  choice: उसके चारों ओर … से घेराबंदी की
  rationale: क्रिया का अर्थ चारों ओर दीवार या अन्य सुरक्षा-निर्माण खड़े करके घेरना है। यह प्रयोग आगे दी गई स्थापत्य-सामग्री की सूची के साथ स्वाभाविक बैठता है।
- source_word: πύργοις ὑψηλοῖς
  choice: ऊँची मीनारों
  rationale: सैन्य स्थापत्य की छवि और विशेषण दोनों का सीधा तथा सहज अनुवाद।
- source_word: τείχεσιν μεγάλοις
  choice: विशाल दीवारों
  rationale: τεῖχος रक्षात्मक दीवार है और μεγάλοις उसके बड़े आकार को बताता है; ‘विशाल दीवारें’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: मीनारों, फाटकों और बेड़ों
  rationale: यूनानी पाठ में πύργοις दोबारा आया है, इसलिए ‘मीनारों’ की पुनरावृत्ति सुरक्षित रखी गई है। μοχλοί फाटकों को बंद रखने वाले भारी आड़े बेड़ों को दर्शाता है।
- source_word: ἔθετο βρώματα
  choice: खाद्य-सामग्री रखी
  rationale: βρώματα मूलतः खाने की वस्तुएँ हैं। सैन्य संदर्भ में यह संग्रहित खाद्य-सामग्री को दर्शाता है; ‘रसद’ की अपेक्षा यह मूल शब्द की खाद्य-संबंधी विशिष्टता अधिक स्पष्ट रखता है।
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: गढ़ों में
  rationale: यूनानी में यहाँ बहुवचन है। आरंभ के एकवचन से संख्या में आए परिवर्तन को समतल किए बिना सुरक्षित रखा गया है।
