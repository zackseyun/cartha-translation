  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: hi
  text: और शमौन ने पुरुषों को चुना और उन्हें राजा देमेत्रियुस के पास भेजा, ताकि वह देश को छूट दे[a], क्योंकि त्रूफ़ोन के सभी काम लूटपाट थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश को रियायत दे” या “देश को माफी दे।” यूनानी शब्द का अर्थ मुक्ति, छूट या माफी हो सकता है; यहाँ सम्भवतः इसका प्रशासनिक या राजकोषीय अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: चुना
  rationale: मध्यवाची क्रिया का यहाँ सीधा अर्थ चुनना है; हिन्दी में यह स्वाभाविक और संक्षिप्त है।
- source_word: ἄνδρας
  choice: कुछ पुरुषों को
  rationale: यूनानी बहुवचन वयस्क पुरुषों को सूचित करता है। हिन्दी में अनिश्चित कर्म को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है, बिना उनकी प्रतिनिधिक भूमिका को पाठ में स्पष्ट किए।
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: उन्हें राजा देमेत्रियुस के पास भेजा
  rationale: ‘उन्हें’ पहले चुने गए पुरुषों से स्वाभाविक रूप से ग्रहण होता है; राजकीय उपाधि और नाम स्पष्ट, वर्तमान हिन्दी क्रम में रखे गए हैं।
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: ताकि वह देश को राहत दे
  rationale: ἄφεσις का अर्थ मुक्ति, छूट या देयताओं की माफी हो सकता है। राजनीतिक-प्रशासनिक प्रसंग में ‘राहत’ व्यावहारिक अर्थ देता है, पर कर-माफी जैसी अनुल्लिखित विशिष्टता आरोपित नहीं करता। कर्ता की सम्भावित अस्पष्टता हिन्दी में ‘वह’ से सन्दर्भानुसार राजा देमेत्रियुस की ओर संकेत करती है।
- source_word: χώρᾳ
  choice: देश
  rationale: χώρα यहाँ भूमि, देश या क्षेत्र को सूचित करता है; ‘देश’ राष्ट्रीय-राजनीतिक प्रसंग में स्वाभाविक है।
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: त्रूफ़ोन के सभी काम
  rationale: πράξεις के लिए ‘काम’ साधारण आधुनिक हिन्दी में स्वाभाविक है और उसके समस्त कार्यों को समेटता है।
- source_word: ἦσαν ἁρπασίαι
  choice: लूटपाट ही थे
  rationale: ἁρπασίαι हिंसक हरण, लूट या डकैती को व्यक्त करता है। ‘लूटपाट ही थे’ बहुवचन कृत्यों का गुणात्मक मूल्यांकन और वाक्य का जोर बनाए रखता है।
