lexical_decisions:
- source_word: ἔστησεν
  choice: खड़े किए
  rationale: स्मारकीय संरचनाओं को निर्मित या स्थापित करने के ठोस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἑπτὰ πυραμίδας
  choice: सात पिरामिड
  rationale: πυραμίς का सीधा अर्थ पिरामिड है; संरचनाओं के सटीक वास्तु-रूप के विषय में अनावश्यक व्याख्या जोड़े बिना मूल शब्द बनाए रखा गया है।
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: एक-दूसरे के आमने-सामने
  rationale: यह पारस्परिक रूप से सामने स्थित होने की व्यवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: अपने पिता, अपनी माता ... के लिए
  rationale: सम्प्रदान कारक को समर्पण अथवा स्मरण के उद्देश्य के रूप में लिया गया है; प्रसंग से सम्बन्धसूचक ‘अपने’ स्पष्ट होता है।
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: अपने चार भाइयों
  rationale: ἀδελφοῖς यहाँ पुरुष सहोदरों को सूचित करता है; संख्या और लिंग दोनों स्पष्ट रखे गए हैं।
