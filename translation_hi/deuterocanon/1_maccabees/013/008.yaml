translation:
  language: hi
  text: और उन्होंने ऊँचे स्वर में उत्तर दिया, “यहूदा और तुम्हारे भाई योनातान के स्थान पर तुम हमारे अगुआ हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: उत्तर दिया
  rationale: यूनानी कथात्मक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; बहुवचन कर्ता के साथ सामान्य हिन्दी प्रयोग में यह रूप सहज है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में
  rationale: रीति बताने वाले दत्तिव पदबंध की ठोस अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἡγούμενος
  choice: अगुआ
  rationale: यह नेतृत्व करने वाले व्यक्ति को दर्शाता है, पर किसी निश्चित राजकीय, प्रशासकीय या केवल सैनिक पद का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἀντί
  choice: के स्थान पर
  rationale: प्रतिस्थापन अथवा उत्तराधिकार का अर्थ स्पष्ट करता है, बिना 'उत्तराधिकारी' जैसा ऐसा औपचारिक पद जोड़ने के जो यूनानी में स्पष्ट नहीं है।
- source_word: Ἰούδου
  choice: यहूदा
  rationale: Ἰούδας का प्रचलित हिन्दी बाइबलीय नामरूप; प्रसंग से व्यक्ति यहूदा मकाबी स्पष्ट है।
- source_word: Ἰωνάθου
  choice: योनातान
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: τοῦ ἀδελφοῦ σου
  choice: तुम्हारे भाई
  rationale: योनातान की शमौन से पारिवारिक पहचान को मूल के अनुसार स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ἡγούμενος द्वारा व्यक्त शमौन की भूमिका का स्वरूप
  choice: अगुआ
  alternative: शासक, राज्यपाल, सेनापति
  rationale: यह पद शमौन को यहूदा और योनातान के बाद मान्य नेतृत्व देता है, पर यूनानी शब्द किसी संकीर्ण राजकीय या केवल सैनिक पद को अनिवार्य नहीं करता। 'अगुआ' इसी व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में 'तुम' मूल के एकवचन संबोधन को स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं है।
