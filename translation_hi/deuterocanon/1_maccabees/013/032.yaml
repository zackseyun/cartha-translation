base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/032.yaml
  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: hi
  text: और उसने उसके स्थान पर राज्य किया, एशिया का राजमुकुट[a] धारण किया, और देश पर भारी प्रहार किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एशिया का राजकीय सिरबंद’; यूनानी शब्द विशेष रूप से राजा द्वारा पहने जाने वाले सिरबंद या राजसत्ता के चिह्न को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘देश में भारी तबाही मचाई।’ यूनानी में शाब्दिक रूप से ‘देश पर बड़ा प्रहार किया’ है—यह गंभीर हानि या विपत्ति का मुहावरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: राज्य किया
  rationale: यह क्रिया राजसत्ता का प्रयोग करने को व्यक्त करती है। ‘राज्य किया’ संक्षिप्त है और यूनानी में अनिवार्य रूप से निहित न होने वाले ‘राजा बन गया’ के आरंभिक भाव को नहीं जोड़ती।
- source_word: ἀντʼ αὐτοῦ
  choice: उसके स्थान पर
  rationale: ἀντί यहाँ प्रतिस्थापन और उत्तराधिकार का भाव देता है; ‘उसके स्थान पर’ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: περιέθετο
  choice: धारण किया
  rationale: मध्यवाच्य रूप अपने ऊपर राजचिह्न रखने या पहनने का भाव देता है। ‘धारण किया’ इस ठोस क्रिया को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ διάδημα
  choice: राजमुकुट
  rationale: διάδημα विशेष रूप से राजसत्ता के सिरबंद या चिह्न को दर्शाता है। ‘राजमुकुट’ सामान्य पाठक के लिए स्पष्ट है, जबकि अधिक विशिष्ट अर्थ को पादटिप्पणी में रखा गया है।
- source_word: τῆς Ἀσίας
  choice: एशिया का
  rationale: अनुवाद यूनानी के भौगोलिक नाम को ज्यों का त्यों रखता है और उसे व्याख्यात्मक रूप से ‘एशिया माइनर’ या ‘एशियाई राज्य’ नहीं बनाता।
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: भारी प्रहार किया
  rationale: मूल पद का शाब्दिक चित्र ‘बड़ा प्रहार करना’ है और राजनीतिक-सैन्य संदर्भ में गंभीर हानि या विपत्ति सूचित कर सकता है। ‘भारी प्रहार’ इस रूपक को बनाए रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: देश पर
  rationale: γῆ का अर्थ ‘भूमि’, ‘देश’ या ‘पृथ्वी’ हो सकता है। यहाँ राजनीतिक-क्षेत्रीय संदर्भ में ‘देश’ स्वाभाविक है, और ἐπί के साथ ‘पर’ मूल रचना के निकट रहता है।
