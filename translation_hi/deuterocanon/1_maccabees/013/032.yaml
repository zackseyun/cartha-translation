  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। वाक्य की तीन समन्वित क्रियाएँ यूनानी संरचना के अनुरूप बनी हुई हैं। ‘राजमुकुट’ सामान्य पाठक के लिए सुलभ है, जबकि उसके अधिक विशिष्ट ऐतिहासिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
