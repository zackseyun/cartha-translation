translation:
  language: hi
  text: यह वह कब्र है जिसे उसने मोदीन में बनाया था, और वह आज के दिन तक बनी हुई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάφος
  choice: कब्र
  rationale: यह शब्द दफ़नाने की जगह या समाधि-स्मारक को दर्शाता है। प्रसंग में परिवार के लिए बनाया गया भव्य दफ़न-स्मारक है; सामान्य पाठक के लिए ‘कब्र’ स्वाभाविक और स्पष्ट है।
- source_word: ἐποίησεν
  choice: बनवाया था
  rationale: ποιέω का मूल अर्थ ‘बनाना’ है। पिछले पदों के निर्माण-वर्णन और किसी स्मारक के निर्माण में कारीगरों की संभावित भूमिका को देखते हुए हिंदी में ‘बनवाया’ स्वाभाविक है, यद्यपि यूनानी व्याकरण केवल उसके उत्तरदायित्व को स्पष्ट करता है।
- source_word: ἐν Μωδεεὶμ
  choice: मोदीन में
  rationale: ἐν का सीधा स्थानवाचक अर्थ ‘में’ है। Μωδεείμ को यूनानी रूप के निकट ‘मोदीन’ लिप्यंतरित किया गया है।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज तक बनी हुई है
  rationale: यह मुहावरा लेखक के समय तक स्मारक के विद्यमान रहने का भाव देता है। हिंदी में केवल ‘आज तक’ अपूर्ण लगेगा, इसलिए निहित स्थायित्व को ‘बनी हुई है’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: οὗτος
  choice: यह वही
  rationale: निर्देशक सर्वनाम यहाँ पहले वर्णित स्मारक की पहचान कराता है। ‘यह वही’ हिंदी में इस पहचान-सूचक बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
