lexical_decisions:
- source_word: ἔντρομος
  choice: थरथरा रहे थे
  rationale: यह शब्द भय से काँपने या थरथराने की दशा व्यक्त करता है; हिन्दी में यह स्वाभाविक और चित्रात्मक है।
- source_word: ἔκφοβος
  choice: बहुत डरे हुए थे
  rationale: उपसर्ग ἐκ- भय की तीव्रता को बल देता है; ‘बहुत डरे हुए’ अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνέβη εἰς Ἰερουσαλήμ
  choice: यरूशलेम गया
  rationale: ἀναβαίνω का शाब्दिक अर्थ ‘ऊपर जाना/चढ़ना’ है, पर नगर की ओर यात्रा के लिए हिन्दी में ‘गया’ अधिक स्वाभाविक है और प्रसंग का आशय सुरक्षित रखता है।
- source_word: ἤθροισεν τὸν λαόν
  choice: लोगों को इकट्ठा किया
  rationale: क्रिया का सीधा अर्थ लोगों को एकत्र करना है; यह सरल और स्वाभाविक हिन्दी है।
