  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: hi
  text: उसने इनके चारों ओर बड़े स्तंभ खड़े करके ये निर्माण करवाए। उन स्तंभों पर उसने चिरस्थायी स्मृति के लिए पूरे युद्ध-कवच बनवाए, और कवचों के पास जहाज़ों की आकृतियाँ खुदवाईं, ताकि समुद्र में चलने वाले सभी लोग उन्हें देख सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηχανήματα
  choice: भव्य संरचनाओं
  rationale: यहाँ शब्द निर्मित स्थापत्य-कृतियों या प्रभावशाली निर्माणों को सूचित करता है। हिंदी में केवल ‘यंत्र’ कहना समाधि-स्मारक के संदर्भ में भ्रामक होता; ‘संरचनाएँ’ संदर्भानुकूल है, और विशाल स्तंभों के वर्णन से उनकी भव्यता स्पष्ट होती है।
- source_word: περιθεὶς
  choice: उनके चारों ओर ... खड़े किए
  rationale: कृदंत का मूल भाव चारों ओर रखना/लगाना है; हिंदी में स्तंभों के लिए ‘खड़े किए’ स्वाभाविक है।
- source_word: πανοπλίας
  choice: पूरे युद्ध-कवच
  rationale: πανοπλία सैनिक के संपूर्ण कवच-साज को दर्शाता है, केवल सामान्य ‘हथियार’ को नहीं।
- source_word: εἰς ὄνομα αἰώνιον
  choice: ताकि उनका स्मरण सदा बना रहे
  rationale: शाब्दिक ‘अनंत नाम के लिए’ आधुनिक हिंदी में अस्पष्ट और अस्वाभाविक है। प्रसंग स्मारकीय उद्देश्य का है; यह रूप नाम/यश के स्थायी बने रहने का भाव संप्रेषित करता है।
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: जहाज़ों की आकृतियाँ खुदवाईं
  rationale: ἐγγλύφω उकेरने या खुदाई करने को दर्शाता है; यहाँ वास्तविक जहाज़ नहीं, उनकी उत्कीर्ण आकृतियाँ अभिप्रेत हैं।
- source_word: θεωρεῖσθαι
  choice: देख सकें
  rationale: उद्देश्यवाचक निष्क्रिय रूप का स्वाभाविक हिंदी रूप, जिसमें समुद्री यात्रियों को आकृतियों का दिखाई देना व्यक्त होता है।
