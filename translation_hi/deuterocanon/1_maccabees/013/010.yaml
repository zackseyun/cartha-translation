  text: और उसने सभी लड़ाकू पुरुषों को इकट्ठा किया, और यरूशलेम की दीवारों को पूरा करने में शीघ्रता की, और उसे चारों ओर से किलाबंद किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: इकट्ठा किया
  rationale: सैन्य उद्देश्य से लोगों को एक स्थान पर एकत्र करने का स्वाभाविक और स्रोत-संगत हिन्दी रूप।
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: सभी योद्धाओं
  rationale: पदबंध युद्ध करने वाले पुरुषों को सूचित करता है। ‘योद्धाओं’ से सैन्य अर्थ स्पष्ट रहता है और प्रसंग में पुरुषवाचक बहुवचन भी स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐτάχυνεν τοῦ τελέσαι
  choice: पूरा करने में जल्दी की
  rationale: कार्य को शीघ्र पूर्ण करने की तत्परता व्यक्त करता है और यूनानी infinitive-विन्यास का स्वाभाविक हिन्दी रूप है।
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: यरूशलेम की शहरपनाह का काम
  rationale: τείχη नगर को घेरने वाली रक्षात्मक दीवारों को दर्शाता है। हिन्दी में ‘शहरपनाह’ इस सैन्य-नागरिक अर्थ को सटीक ढंग से व्यक्त करता है; ‘का काम’ जोड़ने से पहले से चल रहे निर्माण को पूरा करने का आशय स्वाभाविक बनता है।
- source_word: ὠχύρωσεν
  choice: दृढ़ किया
  rationale: नगर को रक्षात्मक रूप से मजबूत और सुरक्षित करने का अर्थ देता है; हिन्दी में सहज रहते हुए सैन्य संदर्भ बनाए रखता है।
- source_word: αὐτὴν κυκλόθεν
  choice: उसे चारों ओर से
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद यरूशलेम है; ‘चारों ओर से’ κυκλόθεν के घेरे हुए विस्तार को स्पष्ट करता है।
theological_decisions:
- issue: लिंग-विशिष्ट सैन्य पदबंध
  choice: सभी योद्धाओं
  alternative: सभी सैनिक पुरुषों को
  rationale: यूनानी में ἄνδρας स्पष्टतः पुरुषवाचक है, पर आधुनिक हिन्दी में ‘योद्धाओं’ का पुल्लिंग रूप इसी समूह को बिना अनावश्यक भारीपन के व्यक्त करता है; इसे लिंग-निरपेक्ष ‘लड़ने वालों’ में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘शहरपनाह’ रक्षात्मक नगर-दीवार के लिए प्रचलित सटीक शब्द है; वाक्य की क्रमिक ‘और’ संरचना यूनानी कथन-शैली को बनाए रखती है।
