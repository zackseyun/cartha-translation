  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
translation:
  language: hi
  text: और उन्होंने शमौन को पुकारकर विनती की कि वह सद्भावना की प्रतिज्ञाएँ स्वीकार करे[a]। उसने उन्हें वे प्रतिज्ञाएँ दे दीं, उन्हें वहाँ से निकाल दिया, और गढ़[b] को उसकी अशुद्धताओं से शुद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “दाहिने हाथ स्वीकार करे।” यह भरोसे या सद्भावना की औपचारिक प्रतिज्ञाएँ स्वीकार करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “अक्रा”; यरूशलेम का किलेबंद गढ़।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: उन्होंने शमौन को पुकारकर कहा
  rationale: βοάω ऊँची या आग्रहपूर्ण पुकार को व्यक्त करता है। यह हिंदी प्रयोग उसकी मुखरता बनाए रखते हुए अगले उद्देश्यवाचक कथन से स्वाभाविक रूप से जुड़ता है।
- source_word: δεξιὰς λαβεῖν
  choice: सद्भावना की प्रतिज्ञाएँ स्वीकार करे
  rationale: शाब्दिक अर्थ ‘दाहिने हाथ स्वीकार करना’ है, पर यह औपचारिक भरोसे या सद्भावना की प्रतिज्ञा स्वीकार करने का मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἔδωκεν αὐτοῖς
  choice: उसने उन्हें वे प्रतिज्ञाएँ दे दीं
  rationale: यूनानी में कर्म पूर्ववर्ती मुहावरे से निहित है। हिंदी में ‘वे प्रतिज्ञाएँ’ जोड़ने से संदर्भ स्पष्ट होता है, जबकि ‘स्वीकार करने’ और ‘देने’ के बीच मूल पाठ का तनाव बना रहता है।
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: उन्हें वहाँ से निकाल दिया
  rationale: ἐκβάλλω यहाँ बलपूर्वक हटाने या निष्कासित करने का भाव रखता है। ‘निकाल दिया’ आधुनिक हिंदी में स्वाभाविक है और संदर्भ में पर्याप्त रूप से प्रबल है।
- source_word: τὴν ἄκραν
  choice: गढ़
  rationale: ἄκρα दुर्ग या गढ़ को दर्शाता है और यहाँ यरूशलेम के विशिष्ट ‘अक्रा’ गढ़ का संकेत भी हो सकता है। सरल मुख्य-पाठ रूप ‘गढ़’ है; ऐतिहासिक नाम पादटिप्पणी में दिया गया है।
- source_word: ἀπὸ τῶν μιασμάτων
  choice: उसकी अपवित्रताओं से
  rationale: μίασμα धार्मिक और नैतिक अपवित्रता का भाव रखता है। बहुवचन ‘अपवित्रताओं’ मूल रूप को सुरक्षित रखता है; ‘उसकी’ हिंदी में संबंध स्पष्ट करता है।
theological_decisions:
- issue: δεξιὰς λαβεῖν को शाब्दिक रूप में रखा जाए या मुहावरे के अर्थ में
  choice: मुख्य पाठ में ‘सद्भावना की प्रतिज्ञाएँ स्वीकार करे’
  alternative: ‘दाहिने हाथ स्वीकार करे’ अथवा ‘सुरक्षा के आश्वासन स्वीकार करे’
  rationale: शाब्दिक रूप आधुनिक हिंदी पाठक के लिए अस्पष्ट होगा। चुना हुआ रूप औपचारिक भरोसे का भाव बताता है, पर प्रतिज्ञा की विषयवस्तु को ‘सुरक्षा’ मानकर अनावश्यक रूप से निश्चित नहीं करता।
- issue: τὴν ἄκραν को सामान्य संज्ञा माना जाए या स्थान-नाम
  choice: मुख्य पाठ में ‘गढ़’
  alternative: ‘अक्रा’
  rationale: यूनानी शब्द का सामान्य अर्थ गढ़ है, जबकि इस प्रसंग में वह यरूशलेम के ‘अक्रा’ नामक विशिष्ट गढ़ को भी सूचित कर सकता है। मुख्य पाठ पठनीय अर्थ देता है और पादटिप्पणी दूसरी संभावना सुरक्षित रखती है।
- issue: ἔδωκεν αὐτοῖς में निहित कर्म की पहचान
  choice: ‘उसने उन्हें वे प्रतिज्ञाएँ दे दीं’
  alternative: ‘उसने उनकी बात मान ली’ अथवा ‘उसने उन्हें आश्वासन दिए’
  rationale: मूल पाठ पूर्ववर्ती ‘दाहिने हाथों’ को निहित कर्म के रूप में दोहराता है। ‘वे प्रतिज्ञाएँ’ इस संबंध को स्पष्ट करता है, बिना इसे केवल अनुमति या सुरक्षा के आश्वासन के रूप में सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य में मूल यूनानी की क्रमिक क्रियाएँ रखी गई हैं। ‘शमौन’ बाइबिलीय नाम का प्रचलित हिंदी रूप है; ‘गढ़’ सामान्य पाठक के लिए ‘दुर्ग’ से अधिक सहज है, जबकि पादटिप्पणी ऐतिहासिक नाम को सुरक्षित रखती है।
