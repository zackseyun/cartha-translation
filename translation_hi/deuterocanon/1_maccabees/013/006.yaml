  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: hi
  text: फिर भी मैं अपने राष्ट्र, पवित्रस्थान[a] और हमारी स्त्रियों और बच्चों[b] का बदला लूँगा, क्योंकि सारे राष्ट्र वैर के कारण[c] हमें मिटा डालने के लिए इकट्ठे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र वस्तुओं” अथवा “पवित्र स्थानों”; यूनानी में शाब्दिक रूप से “पवित्र [वस्तुओं/स्थानों]” है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारी पत्नियों और बच्चों।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “शत्रुता के कारण” या “वैर की खातिर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले प्रसंग के साथ प्रबल विरोध दर्शाता है; ‘फिर भी’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἐκδικήσω
  choice: बदला लूँगा
  rationale: भविष्यकालीन क्रिया प्रतिशोध लेकर न्याय करने का प्रबल भाव रखती है; सैन्य प्रसंग में यह उसका सीधा और स्वाभाविक रूप है।
- source_word: τοῦ ἔθνους μου
  choice: अपने राष्ट्र
  rationale: यहूदी राष्ट्रीय समुदाय के सामूहिक और राजनीतिक अर्थ को बनाए रखता है।
- source_word: τῶν ἁγίων
  choice: पवित्रस्थान
  rationale: 1 मक्काबियों के मन्दिर-केंद्रित प्रसंग में नपुंसकलिंग बहुवचन का सम्भावित संकेत पवित्र मन्दिर अथवा उसके परिसर की ओर है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: हमारी स्त्रियों और बच्चों
  rationale: γυναῖκες का अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है; यहाँ पूरे समुदाय का व्यापक उल्लेख अधिक सम्भावित है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए हैं
  rationale: ग्रीक एओरिस्ट से हुई सभा और उसके वर्तमान परिणाम—मौजूदा खतरे—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ ἔθνη
  choice: सारे राष्ट्र
  rationale: आसपास के राष्ट्रों/जातीय समुदायों का सीधा अर्थ देता है और बाद की पारिभाषिक धारणा आरोपित नहीं करता।
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: हमें मिटा डालने
  rationale: पूर्ण विनाश या उन्मूलन के तीव्र भाव को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔχθρας χάριν
  choice: हमसे शत्रुता के कारण
  rationale: वाक्यांश को उद्देश्य के बजाय प्रेरक कारण के रूप में रखता है और मूल की ‘शत्रुता/वैर’ वाली अर्थछटा बचाता है।
theological_decisions:
- issue: τῶν ἁγίων का संकेत
  choice: पवित्रस्थान
  alternative: पवित्र वस्तुएँ; पवित्र स्थान; पवित्र जन
  rationale: मन्दिर-केंद्रित ऐतिहासिक प्रसंग में पवित्रस्थान सबसे सम्भावित संकेत है, पर मूल बहुवचन की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है; यह प्रसंगगत, न कि सम्प्रदायगत, निर्णय है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण, सार्वजनिक भाषण के अनुकूल और सामान्य पाठक के लिए सुबोध है। मूल की तीव्र सैन्य भाषा तथा τῶν ἁγίων और γυναικῶν की अर्थगत अस्पष्टता सुरक्षित रखी गई है।
