  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: hi
  text: और यहूदी बुज़ुर्गों तथा यहूदी लोगों को नमस्कार। जो सोने का मुकुट और खजूर की डाली[a] आपने भेजी थी, वे हमें मिल गए हैं। हम आपके साथ व्यापक शांति स्थापित करने और कामकाज के प्रभारी अधिकारियों को लिखने के लिए तैयार हैं कि वे आपको छूटें[b] दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात खजूर का पत्ता या शाखा, जिसका उपयोग औपचारिक अथवा सम्मानसूचक रूप से होता था।
    reason: lexical_alternative
  - marker: b
    text: इन ‘छूटों’ से संभवतः करों या अन्य प्रशासनिक देयों से छूट का आशय है, पर यूनानी पाठ यहाँ उनका ठीक प्रकार नहीं बताता।
    reason: cultural_note
