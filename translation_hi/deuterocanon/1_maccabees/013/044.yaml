  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
translation:
  language: hi
  text: और घेराबंदी की मीनार में जो लोग थे, वे निकलकर नगर में आ गए, और नगर में बड़ी हलचल मच गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήλοντο
  choice: निकलकर ... आ गए
  rationale: यह रूप घेराबंदी की मीनार के भीतर से नगर में बाहर आने की दिशा बताता है। हिन्दी में ‘निकलकर नगर में आ गए’ इस गति को स्वाभाविक रूप से व्यक्त करता है, बिना उनके उद्देश्य के बारे में कुछ जोड़े।
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: घेराबंदी की मीनार में जो लोग थे
  rationale: ἑλέπολις विशेष रूप से नगर पर चढ़ाई में प्रयुक्त घेराबंदी की मीनार को दर्शाता है। यह आधुनिक हिन्दी पाठक के लिए केवल लिप्यंतरण या सामान्य ‘युद्ध-यंत्र’ से अधिक स्पष्ट है।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις के लिए ‘नगर’ एक मानक, गरिमापूर्ण और सन्दर्भानुकूल हिन्दी शब्द है; यहाँ यह उस नगर-क्षेत्र को दर्शाता है जिसमें वे आए।
- source_word: κίνημα μέγα
  choice: बड़ी हलचल
  rationale: κίνημα गति, विक्षोभ या अशांति का व्यापक भाव रख सकता है। ‘बड़ी हलचल’ प्रसंग की सार्वजनिक उथल-पुथल को व्यक्त करती है, पर दंगा या विद्रोह जैसा अधिक निश्चित अर्थ नहीं थोपती।
- source_word: ἐγένετο
  choice: मच गई
  rationale: κίνημα के साथ हिन्दी में ‘हलचल मच गई’ स्वाभाविक कथात्मक प्रयोग है और यूनानी के ‘हो गई/उत्पन्न हुई’ भाव को सहज ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘घेराबंदी की मीनार’ सैन्य वस्तु को स्पष्ट करती है, और ‘बड़ी हलचल’ यूनानी κίνημα की व्यापकता तथा अस्पष्टता बनाए रखती है। अंग्रेज़ी परत में दिया गया [a] चिह्न व्याकरणतः ‘city’ के बाद दिखता है, जबकि उसकी टिप्पणी κίνημα से संबंधित है; हिन्दी मुख्य पाठ स्वयं इस अर्थ को पर्याप्त रूप से सुरक्षित रखता है, इसलिए भ्रामक चिह्न नहीं रखा गया।
