  yaml_path: translation/deuterocanon/1_maccabees/013/042.yaml
  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
translation:
  language: hi
  text: 'और इस्राएल के लोग दस्तावेज़ों और अनुबंधों में यह लिखने लगे: “महान महायाजक, सेनापति और यहूदियों[a] के अगुआ शमौन का पहला वर्ष।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोगों।” यूनानी जातिवाचक शब्द व्यापक रूप से यहूदी लोगों अथवा अधिक विशेष रूप से यहूदिया के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: लिखने लगे
  rationale: यहाँ क्रिया किसी नई प्रथा के आरंभ को व्यक्त करती है; बहुवचन कर्ता ‘लोग’ के साथ ‘लगे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὁ λαὸς Ἰσραήλ
  choice: इस्राएल के लोग
  rationale: यह रूप λαός और उसके सामूहिक अर्थ को स्पष्ट रखते हुए सहज हिन्दी देता है।
- source_word: γράφειν
  choice: लिखने
  rationale: मूल क्रिया का सीधा अर्थ सुरक्षित है; दस्तावेज़ी संदर्भ अगले पदों से स्पष्ट हो जाता है।
- source_word: ἐν ταῖς συγγραφαῖς
  choice: दस्तावेज़ों में
  rationale: συγγραφή यहाँ लिखित प्रशासनिक अभिलेख या दस्तावेज़ को सूचित करता है; ‘दस्तावेज़’ वर्तमान हिन्दी में स्पष्ट और व्यापक है।
- source_word: καὶ συναλλάγμασιν
  choice: और अनुबंधों में
  rationale: συνάλλαγμα औपचारिक लेन-देन या संविदात्मक व्यवस्था का लिखित साधन हो सकता है; ‘अनुबंध’ इस प्रशासनिक संदर्भ में सटीक है।
- source_word: Ἔτους πρώτου
  choice: पहला वर्ष
  rationale: यह युग-निर्धारण की संक्षिप्त दस्तावेज़ी तिथि-पद्धति है; हिन्दी में ‘पहला वर्ष’ स्वाभाविक है।
- source_word: ἐπὶ Σίμωνος
  choice: शमौन का
  rationale: ἐπί के साथ संबंधकारक यहाँ शमौन के शासन या पदकाल से गिने जाने वाले वर्ष को दर्शाता है; तिथि-सूत्र में ‘शमौन का पहला वर्ष’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀρχιερέως μεγάλου
  choice: महान महायाजक
  rationale: ἀρχιερεύς और विशेषण μέγας दोनों को व्यक्त किया गया है; यह शमौन की औपचारिक, उन्नत उपाधि को बनाए रखता है।
- source_word: στρατηγοῦ
  choice: सेनापति
  rationale: यह सैन्य नेतृत्व की उपाधि है; ‘सेनापति’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: ἡγουμένου
  choice: अगुआ
  rationale: शब्द नेतृत्व या शासन करने वाले व्यक्ति को दर्शाता है; ‘अगुआ’ किसी अधिक विशिष्ट संवैधानिक पद को आरोपित किए बिना व्यापक अर्थ सुरक्षित रखता है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: यह जातिवाचक शब्द यहाँ सामूहिक जातीय-राजनीतिक पहचान व्यक्त करता है; ‘यहूदियों’ हिन्दी में अधिक स्वाभाविक है, जबकि भौगोलिक अर्थ ‘यहूदिया के लोगों’ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: शमौन की उपाधि में Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया के लोगों
  rationale: यह पद मुख्यतः प्रशासनिक और राजनीतिक है, फिर भी जातिवाचक शब्द जातीय समुदाय और भौगोलिक जनसमूह दोनों का संकेत दे सकता है। मुख्य पाठ में व्यापक और स्वाभाविक ‘यहूदियों’ रखा गया है तथा वास्तविक भौगोलिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और दस्तावेज़ी शैली के अनुकूल रूप। उद्धरण को औपचारिक तिथि-सूत्र की तरह संक्षिप्त रखा गया है; किसी विशिष्ट संप्रदायगत अर्थ को नहीं जोड़ा गया।
