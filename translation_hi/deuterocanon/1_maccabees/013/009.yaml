lexical_decisions:
- source_word: πολέμησον τὸν πόλεμον ἡμῶν
  choice: हमारी ओर से यह युद्ध लड़ो
  rationale: यूनानी में πολεμέω और πόλεμος का सजातीय प्रयोग है, जिसका शब्दशः दोहराव हिन्दी में अस्वाभाविक होगा। ‘युद्ध लड़ो’ सैन्य आग्रह को स्वाभाविक रूप से व्यक्त करता है; ‘हमारी ओर से’ ἡμῶν को इस अर्थ में स्पष्ट करता है कि संबोधित व्यक्ति उनके पक्ष में युद्ध करे।
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: जो कुछ तुम हमसे कहोगे, वह सब
  rationale: यह भविष्य में दिए जाने वाले किसी भी निर्देश का पूर्णतः पालन करने की तत्परता व्यक्त करता है। ‘जो कुछ…वह सब’ πάντα ὅσα की व्यापकता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ποιήσομεν
  choice: हम करेंगे
  rationale: ποιέω का भविष्यकाल यहाँ निर्देशों के पालन की दृढ़ प्रतिज्ञा व्यक्त करता है। ‘हम करेंगे’ सीधा है और मूल से अधिक व्याख्या नहीं जोड़ता।
