    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: जो कुछ
  rationale: यूनानी नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम का आशय ‘जो कुछ’ है। मूल में कोई संज्ञा, जैसे ‘समझौते’ या ‘शर्तें’, स्पष्ट नहीं है; इसलिए निहित कर्म को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ἐστήσαμεν πρὸς ὑμᾶς
  choice: हमने तुम्हारे साथ ठहराया है
  rationale: राजनयिक प्रसंग में ἵστημι किसी व्यवस्था या शर्त को निश्चित करने का भाव देता है, और πρὸς ὑμᾶς दोनों पक्षों के बीच सम्बन्ध को व्यक्त करता है। ‘साथ ठहराया’ औपचारिक होते हुए भी स्वाभाविक हिन्दी है।
- source_word: ἔστηκεν
  choice: कायम है
  rationale: ἵστημι का पूर्णकालिक रूप पहले निश्चित की गई बात की वर्तमान और निरन्तर वैधता बताता है। ‘कायम है’ इस स्थायित्व को संक्षेप में व्यक्त करता है।
- source_word: ὀχυρώματα
  choice: गढ़
  rationale: यह शब्द किलेबन्द स्थानों या रक्षात्मक दुर्गों को सूचित करता है। ‘गढ़’ सामान्य पाठक के लिए सहज और पर्याप्त रूप से व्यापक है।
- source_word: ᾠκοδομήσατε
  choice: तुमने बनाए हैं
  rationale: οἰκοδομέω का मूल अर्थ ‘बनाना/निर्माण करना’ है। वस्तुएँ गढ़ हैं, फिर भी क्रिया में स्वयं ‘किलेबन्द करना’ नहीं कहा गया है।
- source_word: ὑπαρχέτω ὑμῖν
  choice: वे तुम्हारे ही रहें
  rationale: इस प्रशासनिक कथन में यह रूप अधिकार और निरन्तर स्वामित्व की पुष्टि करता है। ‘तुम्हारे ही रहें’ आज्ञार्थक स्वर और बने रहने—दोनों भावों को रखता है।
