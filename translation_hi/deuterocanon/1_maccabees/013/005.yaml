    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: मुझसे यह कभी न हो
  rationale: यह यूनानी प्रयोग किसी विचार का दृढ़तापूर्वक निषेध करता है। यह हिन्दी में प्रार्थनात्मक भाव और तीव्र अस्वीकृति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: मैं अपने प्राण की चिन्ता करूँ
  rationale: यहाँ ψυχή का अर्थ अमूर्त आत्मा नहीं, बल्कि व्यक्ति का जीवन है। φείδομαι के साथ वाक्यांश अपने जीवन को बचाने या उसकी सुरक्षा की चिन्ता करने का भाव देता है।
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: संकट के किसी भी समय
  rationale: παντί का प्रसंगगत वितरणात्मक बल ‘किसी भी’ से और θλῖψις का दबाव, क्लेश या संकट का अर्थ ‘संकट’ से सहज हिन्दी में व्यक्त होता है।
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: क्योंकि मैं ... से बढ़कर नहीं हूँ
  rationale: κρείσσων में ‘बेहतर’, ‘अधिक शक्तिशाली’ या ‘श्रेष्ठ’ होने की सम्भावना है। यहाँ वक्ता अपने भाइयों की तुलना में अपने लिए विशेष सुरक्षा का दावा नकारता है; ‘बढ़कर नहीं’ उस तुलना को स्वाभाविक रूप से खुला रखता है।
- source_word: τῶν ἀδελφῶν μου
  choice: अपने भाइयों से
  rationale: कथा में ἀδελφοί शमौन के वास्तविक भाइयों को सूचित करता है, इसलिए स्पष्ट पारिवारिक शब्द ‘भाइयों’ उपयुक्त है।
