lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: एक सौ इकहत्तरवें वर्ष में
  rationale: यह वर्ष बताने का सूत्र है। हिन्दी में क्रमवाचक रूप के साथ यह स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: ὁ ζυγὸς
  choice: जुआ
  rationale: ζυγός का शाब्दिक अर्थ पशुओं पर रखा जाने वाला 'जुआ' है और यहाँ यह पराधीनता या दमनकारी शासन का रूपक है। 'जुआ' मूल बिंब को बनाए रखता है।
- source_word: τῶν ἐθνῶν
  choice: राष्ट्रों का
  rationale: ἐθνῶν सामान्यतः 'राष्ट्रों' को और यहूदी प्रयोग में 'गैर-यहूदियों' को भी सूचित कर सकता है। मुख्य पाठ में 'राष्ट्रों' रखने से यूनानी शब्द की व्यापकता बनी रहती है; दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: इस्राएल पर से
  rationale: ἀπό अलग किए जाने या हटाए जाने का भाव देता है। जुए के रूपक के साथ हिन्दी में 'इस्राएल पर से' स्वाभाविक रूप से बताता है कि वह बोझ या अधीनता हटा दी गई।
theological_decisions:
- issue: τῶν ἐθνῶν का अनुवाद 'राष्ट्रों' किया जाए या 'गैर-यहूदियों'
  choice: राष्ट्रों का
  alternative: गैर-यहूदियों का
  rationale: यह पद इस्राएल पर विदेशी प्रभुत्व के अंत का वर्णन करता है। यूनानी शब्द सामान्य अर्थ में 'राष्ट्र' और यहूदी संदर्भ में 'गैर-यहूदी'—दोनों अर्थ रख सकता है। मुख्य पाठ में अधिक व्यापक और शाब्दिक विकल्प रखकर संदर्भगत विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'जुआ' मूल यूनानी रूपक को सुरक्षित रखता है, जबकि कर्मवाच्य वाक्य मूल की संक्षिप्त ऐतिहासिक घोषणा के अनुरूप है।
