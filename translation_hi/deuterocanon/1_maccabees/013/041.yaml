  text: In the one hundred seventy-first year[a], the yoke of the nations was removed from Israel.
translation:
  language: hi
  text: एक सौ इकहत्तरवें वर्ष में[a], राष्ट्रों का जुआ इस्राएल पर से हटा दिया गया।
