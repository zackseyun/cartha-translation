  text: And Simon recognized that they were speaking deceitfully to him[a], yet he sent the money and the boys[b], lest he stir up great hostility against the people.
translation:
  language: hi
  text: और शमौन समझ गया कि वे उससे छल से बातें कर रहे हैं; फिर भी उसने रकम[a] और लड़कों को भेज दिया, कहीं ऐसा न हो कि वह लोगों के विरुद्ध[b] भारी वैर भड़का दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी’। यूनानी ἀργύριον का अर्थ धातु के रूप में चाँदी अथवा धन/भुगतान की रकम हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लोगों में’ अथवा ‘लोगों के साथ’। यूनानी पदबंध πρὸς τὸν λαόν संबंध की दिशा के विषय में एक से अधिक अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: समझ गया
  rationale: यहाँ क्रिया केवल जानकारी रखने के बजाय परिस्थिति और छलपूर्ण मंशा को पहचान लेने का भाव देती है।
- source_word: δόλῳ
  choice: छल से
  rationale: करण/रीति-सूचक चतुर्थी जानबूझकर किए गए धोखे के साथ बोलने को व्यक्त करती है; ‘छल से’ स्वाभाविक और सटीक है।
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: वे उससे ... बातें कर रहे हैं
  rationale: वर्तमान काल चल रही बातचीत को दिखाता है और πρός वाणी के शमौन की ओर निर्देशित होने को व्यक्त करता है।
- source_word: πέμπει
  choice: उसने ... भेज दिया
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में पूर्ण भूतकाल से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: τὸ ἀργύριον
  choice: धन
  rationale: संदर्भ में ἀργύριον भुगतान के रूप में दी जाने वाली चाँदी अथवा रकम है; ‘धन’ अर्थ स्पष्ट रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὰ παιδάρια
  choice: लड़कों
  rationale: παιδάριον लड़कों या कम आयु के बालकों के लिए प्रयुक्त होता है; ‘लड़कों’ से अनावश्यक रूप से बहुत छोटे बच्चों का संकेत नहीं मिलता।
- source_word: μή ποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह पदबंध आशंकित परिणाम अथवा उसे रोकने की मंशा व्यक्त करता है; हिन्दी में यह उसका स्वाभाविक समतुल्य है।
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: भारी वैर भड़का दे
  rationale: शाब्दिक ‘बड़ा वैर उठा दे’ के कारणात्मक भाव को वर्तमान हिन्दी में ‘भारी वैर भड़का दे’ स्पष्ट रूप से व्यक्त करता है।
- source_word: πρὸς τὸν λαόν
  choice: लोगों के विरुद्ध
  rationale: ἔχθρα के साथ πρός वैर की संबंधात्मक दिशा दिखा सकता है; मुख्य पाठ में दिशात्मक अर्थ रखा गया है और व्यापक संबंधात्मक अस्पष्टता पादटिप्पणी में सुरक्षित है।
