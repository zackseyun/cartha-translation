translation:
  language: hi
  text: पर जब वह बस्कामा के पास पहुँचा, तो उसने योनातान को मार डाला, और उसे वहीं दफनाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: पर जब
  rationale: यह पद अगले घटनाक्रम को हल्के विरोध अथवा कथा की आगे बढ़ती कड़ी के रूप में प्रस्तुत करता है; ‘पर जब’ स्वाभाविक हिन्दी कथात्मक प्रवाह देता है।
- source_word: ἤγγισεν
  choice: के पास पहुँचा
  rationale: ἐγγίζω का अओरिस्ट रूप किसी स्थान के निकट आने को दर्शाता है; यह चयन गति और निकटता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: τῆς Βασκαμά
  choice: बासकामा
  rationale: स्थान-नाम का अनुवाद नहीं, बल्कि यूनानी रूप Βασκαμά के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: क्रिया का सीधा अर्थ ‘हत्या करना/मार डालना’ है; यह न तो पुरातन है, न ही औपचारिक मृत्युदंड का अनावश्यक संकेत देती है।
- source_word: τὸν Ἰωναθάν
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ἐτάφη
  choice: उसे ... दफनाया गया
  rationale: θάπτω के अओरिस्ट कर्मवाच्य का सरल और सटीक हिन्दी रूप; सर्वनाम स्पष्ट करता है कि दफनाया गया व्यक्ति योनातान था।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह स्थानसूचक क्रियाविशेषण पहले उल्लिखित स्थान पर जोर देता है; ‘वहीं’ हिन्दी में उसका स्वाभाविक रूप है।
