  text: उस चाँदी के विषय में, जो तुम्हारा भाई योनातान अपनी आवश्यकताओं के कारण राजकोष का देनदार था[a], हम उसे हिरासत में रखे हुए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “आवश्यकताओं,” “कामों,” “दायित्वों” या “पदगत कार्यों” से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हम उसे रोके हुए हैं” या “हम उसे पकड़े हुए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: उस चाँदी के विषय में
  rationale: Περὶ यहाँ विषय प्रस्तुत करता है और ἀργύριον वित्तीय संदर्भ में चाँदी अथवा धन को सूचित करता है। ‘चाँदी’ मूल बिंब को बनाए रखता है।
- source_word: ὤφειλεν ... εἰς τὸ βασιλικόν
  choice: राजकोष का देनदार था
  rationale: ὀφείλω आर्थिक देनदारी व्यक्त करता है और τὸ βασιλικόν यहाँ राजा से संबंधित कोष अथवा राजकीय खजाने को सूचित करता है।
- source_word: διʼ ἃς εἶχεν χρείας
  choice: अपने दायित्वों के कारण
  rationale: χρεία का अर्थ आवश्यकता, कामकाज, दायित्व या पदगत कार्य हो सकता है। राजकोषीय संदर्भ में ‘दायित्वों’ स्वाभाविक है और केवल निजी आवश्यकताओं या निश्चित पदों तक अर्थ को सीमित नहीं करता।
- source_word: συνέχομεν αὐτόν
  choice: हमने उसे हिरासत में रखा है
  rationale: συνέχω का सामान्य अर्थ थामे रखना, रोकना या नियंत्रित रखना है। व्यक्ति को कर्म बनाकर प्रयुक्त होने और निकटवर्ती कथानक में योनातान की कैद के संदर्भ के कारण ‘हिरासत में रखा है’ उपयुक्त है; इसे ऋण-मुक्ति मानने का स्पष्ट भाषिक आधार नहीं है।
