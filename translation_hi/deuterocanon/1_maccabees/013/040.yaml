review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys eligibility, formal enrollment, incorporation among the speaker's group, and the reciprocal peace formula. However, “बनी रहे” can imply that peace already exists and is to continue, whereas γενέσθω more directly asks that peace come to be; “शांति हो” preserves the Greek without adding that implication.
  naturalness: The wording is clear and appropriately formal for an administrative-political declaration. “नाम दर्ज किए जाएँ” is natural modern Hindi and communicates formal enrollment consistently.
  terminology: “योग्य,” “नाम दर्ज किए जाएँ,” and “हमारे लोगों में” appropriately render the administrative and communal-political sense. The footnote retains the literal wording and signals the interpretive uncertainty of τοὺς περὶ ἡμᾶς.
  issues:
  - severity: low
    issue: “शान्ति बनी रहे” adds a continuative nuance.
    rationale: γενέσθω means ‘let there be’ or ‘let peace come to be’; the source does not explicitly state that peace is already in force. “शांति हो” is more source-neutral.
  - severity: low
    issue: Orthography is somewhat archaic/inconsistent with usual modern standard Hindi conventions.
    rationale: Using “शांति,” “संभवतः,” and “वाले” supports current standard Hindi presentation without affecting meaning.
  revised_text: और यदि तुम में से कुछ लोग हमारे लोगों में नाम दर्ज किए जाने के योग्य हों,[a] तो उनके नाम दर्ज किए जाएँ, और हमारे बीच शांति हो।
  revised_footnotes:
