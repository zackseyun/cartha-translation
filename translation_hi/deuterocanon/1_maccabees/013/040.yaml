    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: योग्य
  rationale: यह विशेषण किसी भूमिका या सम्बन्ध के लिए उपयुक्त अथवा पात्र होने का भाव देता है। प्रशासनिक नामांकन के इस सन्दर्भ में ‘योग्य’ स्वाभाविक है और किसी निश्चित कानूनी दर्जे को अनावश्यक रूप से नहीं जोड़ता।
- source_word: γράφηναι
  choice: नाम लिखे जाने
  rationale: यहाँ अर्थ औपचारिक रूप से सूची या अभिलेख में दर्ज किए जाने का है; अगले क्रियारूप ἐγγραφέσθωσαν से इसकी पुष्टि होती है। ‘नाम लिखे जाने’ से प्रशासनिक भाव साधारण आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: τοὺς περὶ ἡμᾶς
  choice: हमारे पक्ष के लोगों में
  rationale: शाब्दिक अर्थ ‘हमारे आस-पास के लोग’ है, पर राजनीतिक-सामुदायिक सन्दर्भ में यह वक्ता के समुदाय या दल से सम्बन्ध रखनेवालों को सूचित करता है। ‘हमारे पक्ष के लोगों में’ उस सम्बन्ध को व्यक्त करते हुए मूल वाक्यांश की कुछ व्यापकता बनाए रखता है।
- source_word: ἐγγραφέσθωσαν
  choice: उनके नाम लिखे जाएँ
  rationale: आज्ञार्थक क्रिया औपचारिक पंजीकरण या अभिलेख में प्रविष्टि को आगे बढ़ाती है। यह अनुवाद पहले प्रयुक्त ‘नाम लिखे जाने’ के साथ शब्दगत संगति रखता है।
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: हमारे बीच शान्ति बनी रहे
  rationale: यह पारस्परिक राजनीतिक शान्ति का सूत्र है। ‘हमारे बीच’ सम्बन्ध की पारस्परिकता और ‘बनी रहे’ अपेक्षित स्थायी शान्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
