    text: शाब्दिक अर्थ, ‘हमारे आस-पास के लोगों में’; संभवतः यह वाक्यांश वक्ता के अपने लोगों या पक्ष में सम्मिलित किए जाने की ओर संकेत करता है।
    reason: lexical_alternative
