  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: hi
  text: उसने वहाँ से हर प्रकार की अशुद्धता[a] निकाल दी और वहाँ व्यवस्था का पालन करने वाले पुरुषों को बसाया। उसने उसकी किलेबंदी और मज़बूत की[b] और वहाँ अपने लिए एक निवास बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर प्रकार की अपवित्रता।” यूनानी शब्द धार्मिक, नैतिक या अन्य प्रकार की अशुद्धता के लिए व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी किलेबंदी की।” यूनानी यौगिक क्रिया अतिरिक्त रूप से मज़बूत करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: निकाल दी
  rationale: यह क्रिया बलपूर्वक हटाने या बाहर कर देने का भाव रखती है। संदर्भ में “निकाल दी” स्वाभाविक हिन्दी है और निर्णायक शुद्धीकरण का भाव बनाए रखती है।
- source_word: ἀκαθαρσίαν
  choice: हर प्रकार की अशुद्धता
  rationale: यह शब्द धार्मिक, नैतिक या व्यापक अपवित्रता का संकेत दे सकता है। “अशुद्धता” किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: κατῴκισεν
  choice: बसाया
  rationale: यूनानी क्रिया का कारक अर्थ है कि उसने लोगों को वहाँ रहने के लिए स्थापित किया; “बसाया” इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: मूल शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है, इसलिए ऐतिहासिक संदर्भ में लिंग-सटीक अनुवाद रखा गया है।
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: जो व्यवस्था का पालन करते थे
  rationale: ποιεῖν के साथ νόμος का अर्थ व्यवस्था को आचरण में लाना या मानना है। ऐतिहासिक हिन्दी वर्णन में “पालन करते थे” निरंतर आचरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσοχύρωσεν
  choice: उसकी किलेबंदी और मज़बूत की
  rationale: यौगिक क्रिया पहले से मौजूद दुर्गीकरण को अतिरिक्त रूप से सुदृढ़ करने का भाव दे सकती है; हिन्दी में यह अभिव्यक्ति उस संभावित वृद्धिशील अर्थ को सुरक्षित रखती है।
- source_word: ᾠκοδόμησεν ἑαυτῷ ... οἴκησιν
  choice: वहाँ अपने लिए एक निवास बनाया
  rationale: वाक्यांश अपने रहने के लिए स्थान बनाने को बताता है। “निवास” गरिमापूर्ण और सहज है तथा अनावश्यक शब्द-पुनरावृत्ति से बचता है।
theological_decisions:
- issue: शुद्धीकरण के संदर्भ में ἀκαθαρσία का दायरा
  choice: हर प्रकार की अशुद्धता
  alternative: हर प्रकार की अपवित्रता
  rationale: मूल पाठ यह तय नहीं करता कि अशुद्धता मुख्यतः अनुष्ठानिक, नैतिक या उपासना-संबंधी है। व्यापक शब्द इस अस्पष्टता और धार्मिक तनाव को बनाए रखता है।
- issue: ἄνδρας का लिंग-सटीक अनुवाद
  choice: पुरुषों
  alternative: लोगों
  rationale: मूल में पुल्लिंग संज्ञा है और संदर्भ उसे लिंग-निरपेक्ष बनाने की माँग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ऐतिहासिक गद्य रखा गया है। “व्यवस्था” धार्मिक νόμος के लिए परिचित बाइबलीय शब्द है; वाक्य-विन्यास सामान्य पाठकों के लिए सहज बनाया गया है।
