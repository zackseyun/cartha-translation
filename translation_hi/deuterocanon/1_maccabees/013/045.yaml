  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
translation:
  language: hi
  text: और नगर के लोग अपनी स्त्रियों और बच्चों के साथ नगर की दीवार पर चढ़ गए, अपने वस्त्र फाड़े हुए[b]। और उन्होंने ऊँचे स्वर में पुकारकर शमौन से विनती की कि वह उन्हें अपने दाहिने हाथ दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘उन्हें दाहिने हाथ दे।’ यह सद्भावना की प्रतिज्ञा करने, सुरक्षा का आश्वासन देने, या शांति की शर्तें देने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: वस्त्र फाड़ना शोक, संकट, या अत्यंत आग्रहपूर्ण विनती का प्रचलित चिह्न था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: चढ़ गए
  rationale: क्रिया ऊपर की ओर जाने का स्पष्ट स्थानिक भाव रखती है; शहरपनाह के संदर्भ में ‘चढ़ गए’ स्वाभाविक और सटीक है।
- source_word: οἱ ἐν τῇ πόλει
  choice: नगर के लोग
  rationale: यूनानी पद सामूहिक रूप से नगर के भीतर के लोगों को सूचित करता है। हिंदी में ‘नगर के लोग’ सहज है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: अपनी स्त्रियों और बच्चों के साथ
  rationale: ‘अपनी’ संबंधसूचक भाव को व्यक्त करता है। ‘स्त्रियाँ’ यूनानी γυναιξίν की वास्तविक अस्पष्टता बनाए रखता है; इसे केवल ‘पत्नियाँ’ मानकर सीमित नहीं किया गया।
- source_word: ἐπὶ τὸ τεῖχος
  choice: शहरपनाह पर
  rationale: ἀναβαίνω के साथ यह नगर की रक्षात्मक दीवार के ऊपर चढ़ने को दर्शाता है। ‘शहरपनाह’ आधुनिक पाठकों के लिए नगर की किलेबंदी का अर्थ स्पष्ट करता है।
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: उन्होंने अपने वस्त्र फाड़ रखे थे
  rationale: पूर्ण कृदंत पूर्व क्रिया से उत्पन्न वर्तमान दशा को दर्शाता है। यह हिंदी रचना उस परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकारकर
  rationale: यह जोरदार पुकार का भाव बनाए रखता है और हिंदी में अनावश्यक पुनरुक्ति से बचता है।
- source_word: ἀξιοῦντες
  choice: विनती करने लगे
  rationale: सैन्य संकट और वस्त्र फाड़ने के प्रसंग में यह आग्रहपूर्ण अनुरोध है। ‘विनती’ संदर्भगत तीव्रता व्यक्त करती है, जबकि ‘माँग’ जैसा अधिकारपूर्ण भाव नहीं जोड़ती।
- source_word: δεξιὰς ... δοῦναι
  choice: उन्हें अपना दाहिना हाथ दे
  rationale: यूनानी में बहुवचन ‘दाहिने हाथ देना’ सद्भावना, सुरक्षा या शांति की प्रतिज्ञा का मुहावरा है। मुख्य पाठ ठोस मूल बिंब को बनाए रखता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: सैन्य आत्मसमर्पण के प्रसंग में δεξιὰς ... δοῦναι का मुहावरेदार अर्थ
  choice: मुख्य पाठ में ‘उन्हें अपना दाहिना हाथ दे’ का मूल बिंब बनाए रखना
  alternative: ‘उन्हें शांति का वचन दे’ अथवा ‘उनकी सुरक्षा की प्रतिज्ञा करे’
  rationale: मूल यूनानी का बहुवचन मुहावरेदार है और उसके आशय में सद्भावना की प्रतिज्ञा, सुरक्षित व्यवहार तथा शांति की शर्तें सम्मिलित हो सकती हैं। किसी एक अर्थ को चुपचाप निश्चित करने के बजाय मुख्य पाठ बिंब रखता है और पादटिप्पणी संभावित आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘शहरपनाह’ ऐतिहासिक नगर-दीवार के लिए सटीक है। यूनानी γυναιξίν को ‘स्त्रियों’ के रूप में रखा गया है ताकि ‘पत्नियों’ की संभव किंतु अनिवार्य नहीं व्याख्या आरोपित न हो। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
