  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: hi
  text: और वह दूसरे महीने के तेईसवें दिन, एक सौ इकहत्तरवें वर्ष में, स्तुति और खजूर की डालियों के साथ, वीणाओं[a], झाँझों और तार वाले वाद्यों[b] के साथ, तथा स्तुतिगानों और गीतों के साथ उसमें प्रवेश किया, क्योंकि इस्राएल से एक बड़ा शत्रु कुचल दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वीणाओं’ के स्थान पर ‘तार वाले वाद्यों’ का अर्थ भी सम्भव है; प्राचीन वाद्य κινύρα की ठीक आधुनिक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी νάβλα एक विशिष्ट प्राचीन तार-वाद्य का नाम है; इसे ‘वीणा’ या ‘तार वाला वाद्य’ भी समझा जा सकता है, पर इसकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: उसमें प्रवेश किया
  rationale: क्रिया के सामान्य भूतकालीन अर्थ और पूर्वसंदर्भ में उल्लिखित स्थान के स्त्रीलिंग यूनानी सर्वनाम को स्वाभाविक हिन्दी में व्यक्त करता है; स्थान का नाम इस पद में अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός
  choice: दूसरे महीने के तेईसवें दिन
  rationale: यूनानी की शाब्दिक ‘तीसरे और बीसवें’ तिथि को आधुनिक हिन्दी की स्पष्ट तिथि-शैली में प्रस्तुत करता है।
- source_word: ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: एक सौ इकहत्तरवें वर्ष में
  rationale: मूल में दी गई वर्ष-संख्या को ठीक रखते हुए स्वाभाविक हिन्दी क्रमसूचक रूप अपनाया गया है।
- source_word: μετὰ αἰνέσεως
  choice: स्तुति ... के साथ
  rationale: αἴνεσις के व्यापक प्रशंसात्मक और उत्सवी भाव को रखता है, उसे केवल धन्यवाद तक सीमित नहीं करता।
- source_word: βαΐων
  choice: खजूर की डालियों
  rationale: उत्सवी जुलूस में प्रयुक्त पाम की शाखाओं का आधुनिक हिन्दी में स्पष्ट और सहज नाम।
- source_word: κινύραις
  choice: वीणाओं
  rationale: यह प्राचीन तार वाला वाद्य था; ‘वीणा’ हिन्दी पाठक के लिए पारंपरिक और समझने योग्य निकट समतुल्य है, जबकि सटीक वाद्य-पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: κυμβάλοις
  choice: झाँझों
  rationale: धातु के टकराकर बजाए जाने वाले वाद्य का सीधा, प्रचलित हिन्दी समतुल्य।
- source_word: νάβλαις
  choice: तार वाले वाद्यों
  rationale: νάβλα एक विशिष्ट प्राचीन तार-वाद्य है जिसकी आधुनिक पहचान अनिश्चित है; व्यापक श्रेणीगत अनुवाद बिना झूठी विशिष्टता के अर्थ सुरक्षित रखता है।
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: स्तुतिगानों और गीतों
  rationale: दोनों अलग यूनानी संज्ञाओं का भेद बनाए रखते हुए पहला प्रशंसात्मक गान और दूसरा सामान्य गीत के रूप में स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: इस्राएल में से एक बड़े शत्रु का नाश कर दिया गया था
  rationale: निष्क्रिय क्रिया और ἐξ Ἰσραήλ के निष्कासन/मुक्ति-सूचक भाव को सुरक्षित रखता है; कर्ता को मूल से आगे बढ़कर निर्दिष्ट नहीं करता।
theological_decisions:
- issue: उत्सव की धार्मिक प्रकृति
  choice: स्तुति, स्तुतिगान, संगीत और गीत की सीधी उत्सवी भाषा
  alternative: इसे अधिक तकनीकी उपासना-पद्धति या मसीही प्रतीकवाद की भाषा में प्रस्तुत करना
  rationale: पद सार्वजनिक विजय-उत्सव और मुक्ति का वर्णन करता है। यूनानी धार्मिक प्रशंसा का भाव देता है, पर बाद की किसी विशिष्ट आराधना-पद्धति या प्रतीकात्मक व्याख्या की माँग नहीं करता।
- issue: शत्रु के नाश का कर्ता
  choice: निष्क्रिय रूप ‘नाश कर दिया गया था’ बनाए रखना
  alternative: ‘परमेश्वर ने नाश किया था’ या ‘उन्होंने नाश किया था’
  rationale: मूल यूनानी में कर्ता व्यक्त नहीं है। धार्मिक कारण से परमेश्वर या किसी मानवीय दल को स्पष्ट कर्ता बनाना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: प्राचीन वाद्यों की पहचान
  choice: समझने योग्य हिन्दी समतुल्य, साथ में अनिश्चितता की पादटिप्पणियाँ
  alternative: हर यूनानी वाद्य के लिए अत्यधिक विशिष्ट या अप्रचलित नाम
  rationale: किनूरा और नाबला के ठीक आधुनिक समकक्ष निश्चित नहीं हैं। पाठ को पठनीय रखते हुए पादटिप्पणियाँ ऐतिहासिक-शाब्दिक अनिश्चितता सुरक्षित रखती हैं।
