  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: hi
  text: तब शमौन ने उनके साथ समझौता कर लिया और उनसे युद्ध नहीं किया।[a] उसने उन्हें नगर से निकाल दिया और उन घरों को शुद्ध किया जिनमें मूर्तियाँ थीं।[b] फिर वह स्तुतिगान गाते और आशीष देते हुए नगर में प्रवेश कर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके साथ सहमति कर ली।” यूनानी कृदन्त युद्ध करने के बजाय किसी समझौते पर पहुँचने का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् वे घर जिनमें मूर्तियाँ रखी हुई थीं; यहाँ ‘शुद्ध किया’ संभवतः भौतिक सफाई के साथ धार्मिक अशुद्धि दूर करने का भाव भी रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  choice: समझौता कर लिया
  rationale: संदर्भ में यह कृदन्त विरोधियों के साथ व्यावहारिक सहमति या समझौते पर पहुँचने का संकेत देता है; यह केवल प्रसन्न होने का भाव नहीं है।
- source_word: ἐπολέμησεν
  choice: युद्ध नहीं किया
  rationale: क्रिया सशस्त्र संघर्ष को व्यक्त करती है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: ἐξέβαλεν
  choice: नगर से निकाल दिया
  rationale: यह मूल क्रिया की बलपूर्वक बाहर करने की धारणा बनाए रखता है, पर भूत-प्रेत निकालने जैसा अनचाहा अर्थ नहीं लाता।
- source_word: ἐκαθάρισεν
  choice: शुद्ध किया
  rationale: मूर्तियों के उल्लेख के कारण यहाँ केवल भौतिक सफाई नहीं, धार्मिक अशुद्धि दूर करने का भाव भी है।
- source_word: τὰ εἴδωλα
  choice: मूर्तियाँ
  rationale: इस प्रसंग में ये उपासना में प्रयुक्त प्रतिमाएँ हैं; आधुनिक हिन्दी में 'मूर्तियाँ' स्वाभाविक है और प्रसंग इनके मूर्तिपूजक स्वरूप को स्पष्ट करता है।
- source_word: ὑμνῶν
  choice: स्तुतिगान गाता हुआ
  rationale: वर्तमान कृदन्त प्रवेश करने की रीति बताता है; यह गायन और स्तुति दोनों का भाव सुरक्षित रखता है।
- source_word: εὐλογῶν
  choice: आशीष देता हुआ
  rationale: यह εὐλογέω के मूल 'आशीष देना/धन्य कहना' भाव को बनाए रखता है और इसे केवल स्तुति में विलीन नहीं करता।
theological_decisions:
- issue: मूर्तियों वाले घरों के शुद्धीकरण का धार्मिक महत्व
  choice: ἐκαθάρισεν का अनुवाद 'शुद्ध किया' किया गया है।
  alternative: '''साफ किया'' या ''पवित्र किया'''
  rationale: '''शुद्ध किया'' मूर्तिपूजक अशुद्धि हटाने के धार्मिक आयाम को सुरक्षित रखता है, जबकि पाठ से परे किसी विशिष्ट बाद की रीति को नहीं जोड़ता।'
- issue: εὐλογῶν का आशय
  choice: अस्पष्ट कर्म को जोड़े बिना 'आशीष देता हुआ' रखा गया है।
  alternative: '''परमेश्वर की स्तुति करता हुआ'' या ''धन्यवाद देता हुआ'''
  rationale: यूनानी पाठ आशीष का कर्म स्पष्ट नहीं करता। सामान्यतः आशय परमेश्वर को धन्य कहना हो सकता है, पर अनुवाद उस निहित कर्म को निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'शुद्ध किया' धार्मिक आयाम बनाए रखता है; 'स्तुतिगान गाता और आशीष देता हुआ' दोनों यूनानी कृदन्तों को अलग-अलग व्यक्त करता है।
