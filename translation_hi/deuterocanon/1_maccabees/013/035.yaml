lexical_decisions:
- source_word: ἀπέστειλεν αὐτῷ
  choice: उसके पास संदेश भेजा
  rationale: यूनानी में भेजी गई वस्तु स्पष्ट नहीं है। स्वाभाविक हिन्दी के लिए ‘संदेश’ जोड़ा गया है, जबकि ‘उसके पास’ αὐτῷ को व्यक्त करता है।
- source_word: Δημήτριος ὁ βασιλεύς
  choice: राजा देमेत्रियुस
  rationale: आधुनिक हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है; नाम का रूप यूनानी Δημήτριος के निकट रखा गया है।
- source_word: κατὰ τοὺς λόγους τούτους
  choice: इन्हीं बातों के अनुसार
  rationale: यह पदबंध पहले कही गई बातों के अनुरूप उत्तर या संदेश देने का भाव रखता है; ‘इन्हीं’ संकेतवाचक बल को स्पष्ट करता है।
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसे उत्तर दिया
  rationale: क्रिया का सीधा अर्थ सुरक्षित रखा गया है; पत्राचार का माध्यम अगली उपवाक्य-श्रृंखला से स्पष्ट हो जाता है।
- source_word: ἔγραψεν αὐτῷ ἐπιστολήν
  choice: उसे ... पत्र लिखा
  rationale: यूनानी वाक्य-विन्यास का अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοιαύτην
  choice: ऐसा
  rationale: यह आगे दिए जाने वाले पत्र के पाठ की ओर संकेत करता है; ‘ऐसा पत्र’ संक्षिप्त और सहज हिन्दी है।
