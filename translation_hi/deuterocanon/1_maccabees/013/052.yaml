  yaml_path: translation/deuterocanon/1_maccabees/013/052.yaml
  text: And he established it as a yearly observance to celebrate this day. And he fortified the hill of the sanctuary beside the citadel[a], and he lived there, he and those with him.
translation:
  language: hi
  text: उसने यह व्यवस्था की कि हर वर्ष इस दिन को मनाया जाए। फिर उसने गढ़[a] के पास स्थित पवित्रस्थान की पहाड़ी को और अधिक सुदृढ़ किया, और वह स्वयं और जो उसके साथ थे, वहीं रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अक्रा के पास स्थित पवित्रस्थान की पहाड़ी को”; यूनानी ἄκρα का अर्थ सामान्य रूप से “गढ़” हो सकता है, या यह यरूशलेम के सेल्युकी किले “अक्रा” का विशिष्ट नाम हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: ठहराया
  rationale: यहाँ क्रिया भविष्य में नियमित रूप से पालन की जाने वाली स्थायी व्यवस्था स्थापित करने का भाव देती है; ‘ठहराया’ आधुनिक हिन्दी में औपचारिक किंतु सहज है।
- source_word: κατʼ ἐνιαυτὸν τοῦ ἄγειν τὴν ἡμέραν ταύτην
  choice: कि हर वर्ष इस दिन को मनाया जाए
  rationale: यह वार्षिक पुनरावृत्ति और स्मरण-दिवस मनाने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσωχύρωσεν
  choice: और भी दृढ़ किया
  rationale: उपसर्ग सहित क्रिया पहले से मौजूद सुरक्षा को अतिरिक्त रूप से मजबूत करने का संकेत देती है; ‘और भी दृढ़ किया’ उस वृद्धिमूलक भाव को सुरक्षित रखता है।
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: पवित्रस्थान का पहाड़
  rationale: ὄρος और ἱερόν का निकट, पारदर्शी अनुवाद है और बाद का तकनीकी पद ‘मन्दिर पर्वत’ मुख्य पाठ में आरोपित नहीं करता।
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: गढ़ के पास वाला
  rationale: παρά की स्थान-संबंधी निकटता और ἄκρα के सामान्य अर्थ ‘गढ़’ को स्पष्ट हिन्दी में व्यक्त करता है; विशिष्ट ‘अक्रा’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ᾤκει
  choice: रहने लगा
  rationale: ग्रीक अपूर्णकाल जारी निवास का वर्णन करता है; कथात्मक हिन्दी में ‘रहने लगा’ उस आरंभ और आगे चलने वाली स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ παρʼ αὐτοῦ
  choice: अपने साथियों के साथ
  rationale: यह उसके निकटवर्ती लोगों या दल को दर्शाता है; ‘साथियों’ से समूह स्पष्ट होता है, पर उसे घराने, सैनिकों या अधिकारियों तक सीमित नहीं किया जाता।
