  text: और ये बातें सुनकर उसके लोगों का मनोबल फिर से जाग उठा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: फिर से उत्साह से भर उठा
  rationale: क्रिया में बुझी आग के दोबारा भड़कने अथवा जीवन-शक्ति के फिर जागने का भाव है। हिन्दी में यह अभिव्यक्ति रूपक के आशय—नए उत्साह और साहस—को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τὸ πνεῦμα
  choice: मन
  rationale: यहाँ πνεῦμα लोगों की भीतरी चेतना, हिम्मत और सामूहिक मनोबल को दर्शाता है। ‘मन’ आधुनिक हिन्दी में सहज है और वाक्य को किसी तकनीकी धार्मिक अर्थ तक सीमित नहीं करता।
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: उसके लोगों का
  rationale: सम्बन्धकारक αὐτοῦ के व्यक्तिगत अधिकार अथवा सम्बन्ध को बनाए रखते हुए यह सीधा और स्वाभाविक अनुवाद है।
- source_word: ἀκοῦσαι
  choice: सुनकर
  rationale: अनन्तरूप यहाँ मुख्य घटना के अवसर या परिस्थिति को बताता है; हिन्दी का पूर्वकालिक कृदन्त ‘सुनकर’ इस सम्बन्ध को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: τῶν λόγων τούτων
  choice: ये बातें
  rationale: λόγοι यहाँ पहले कहे गए कथन को सूचित करता है। ‘ये बातें’ बोलचाल और साहित्यिक हिन्दी दोनों में स्वाभाविक है।
