lexical_decisions:
- source_word: ἀπῆρεν
  choice: चला
  rationale: यहाँ क्रिया किसी स्थान से यात्रा पर निकलने को व्यक्त करती है। ‘चला’ सहज आधुनिक हिन्दी है और सैन्य चढ़ाई का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: एक बड़ी सेना लेकर
  rationale: सैन्य कथा में δύναμις का अर्थ सशस्त्र बल या सेना है; यह रूप हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: यहूदा देश में प्रवेश करने के लिए
  rationale: अनन्त क्रिया गमन का उद्देश्य बताती है। ‘प्रवेश करने’ से मूल अर्थ सुरक्षित रहता है और ‘आक्रमण करने’ जैसा अतिरिक्त शत्रुतापूर्ण भाव नहीं जुड़ता।
- source_word: γῆν Ἰούδα
  choice: यहूदा देश
  rationale: यह यूनानी भौगोलिक अभिव्यक्ति के निकट है और बाद के प्रचलित नाम को अनावश्यक रूप से नहीं लाता।
- source_word: ἐν φυλακῇ
  choice: उसकी हिरासत में
  rationale: वाक्यांश निगरानी में बंदी होने या कारावास में होने को सूचित कर सकता है। यहाँ ‘हिरासत में’ किसी निश्चित कारागार का अर्थ जोड़े बिना योनातान की बंदी अवस्था स्पष्ट करता है।
