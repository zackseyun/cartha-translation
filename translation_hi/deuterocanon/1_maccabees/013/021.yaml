  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
translation:
  language: hi
  text: परन्तु गढ़ में रहनेवाले लोग दूतों को बार-बार भेजकर उससे बहुत आग्रह कर रहे थे कि वह निर्जन प्रदेश से होकर उनके पास आए[a] और उन्हें रसद भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उसके पास आए’ है; प्रसंग में इसका सामूहिक आशय ‘उनके पास’ अर्थात गढ़ में रहनेवालों के पास जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: परन्तु गढ़ में रहनेवाले लोग
  rationale: ἄκρα यहाँ यरूशलेम के किलेबंद गढ़ को सूचित करता है। ἐκ स्थान से जुड़े लोगों को दर्शा सकता है; इसलिए यह सहज हिन्दी अनुवाद प्रसंग के अनुकूल है।
- source_word: ἀπέστελλον πρεσβεύτας
  choice: दूतों को बार-बार भेजकर
  rationale: ἀπέστελλον का अपूर्ण भूतकाल बार-बार या लगातार की गई कार्रवाई दर्शाता है। πρεσβεύτας औपचारिक प्रतिनिधियों के अर्थ में है, जिसके लिए ‘दूत’ स्वाभाविक है।
- source_word: κατεσπούδαζον
  choice: बहुत आग्रह कर रहे थे
  rationale: यह क्रिया गंभीर और तत्पर दबाव या आग्रह व्यक्त करती है; अपूर्ण भूतकाल की निरंतरता भी ‘कर रहे थे’ में बनी रहती है।
- source_word: αὐτὸν τοῦ ἐλθεῖν ... πρὸς αὐτόν
  choice: उससे ... कि वह ... उनके पास आए
  rationale: मुद्रित यूनानी पाठ में अंतिम सर्वनाम एकवचन ‘उसके पास’ है, पर प्रसंग में गढ़ के लोग सामूहिक गंतव्य हैं। मुख्य पाठ में संदर्भगत अर्थ रखा गया और वास्तविक रूप को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: διὰ τῆς ἐρήμου
  choice: निर्जन प्रदेश से होकर
  rationale: ἐρῆμος निर्जन या उजाड़ भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ किसी खास प्रकार के रेगिस्तान को अनावश्यक रूप से निश्चित किए बिना मार्ग का भाव देता है।
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: उन्हें रसद भेजे
  rationale: τροφάς इस सैन्य प्रसंग में भोजन-सामग्री अथवा जीवन-निर्वाह की आपूर्ति है; ‘रसद’ संक्षिप्त, वर्तमान और प्रसंगानुकूल है।
theological_decisions: []
