  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथात्मक रूप अपनाया गया है। ‘गढ़’, ‘दूत’, ‘निर्जन प्रदेश’ और ‘रसद’ सैन्य प्रसंग को स्पष्ट रखते हैं; अपूर्ण भूतकाल की पुनरावृत्ति और निरंतरता भी व्यक्त की गई है।
