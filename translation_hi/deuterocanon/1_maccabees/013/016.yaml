  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: hi
  text: और अब चाँदी के सौ तोड़े और उसके दो पुत्रों को बंधक के रूप में भेज दो, ताकि रिहा होने पर वह हमसे विद्रोह न कर दे; तब हम उसे रिहा कर देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: चाँदी के सौ तोड़े
  rationale: ‘τάλαντα’ प्राचीन भार और धन-मूल्य की इकाई है; हिन्दी बाइबलीय प्रयोग में ‘तोड़ा’ इसका संक्षिप्त और परिचित समतुल्य है।
- source_word: ὅμηρα
  choice: बंधक के रूप में
  rationale: बहुवचन संज्ञा उन व्यक्तियों को सूचित करती है जिन्हें किसी प्रतिज्ञा के पालन की जमानत के तौर पर रोका जाए।
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: हमसे विद्रोह न कर दे
  rationale: क्रिया राजनीतिक निष्ठा त्यागने अथवा सत्ता के विरुद्ध उठ खड़े होने का भाव रखती है; प्रसंग में ‘विद्रोह’ स्वाभाविक है।
- source_word: ἀφεθεὶς / ἀφήσομεν
  choice: रिहा होने पर / रिहा कर देंगे
  rationale: दोनों रूप एक ही क्रिया के हैं और कैद से छोड़ने को बताते हैं; हिन्दी में पुनरावृत्ति मूल पाठ की शर्त और प्रतिज्ञा का संबंध बनाए रखती है।
