  - marker: a
    text: या “युवा सेवकों” अथवा “परिचारकों।” यूनानी शब्द τὰ παιδάρια बच्चों या युवकों के साथ-साथ युवा सेवकों के लिए भी प्रयुक्त हो सकता है; निकटवर्ती प्रसंग किसी एक अर्थ को निश्चित नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: या “मर गया” अथवा “मारा गया।” यूनानी ἀπώλετο विनाश या नाश हो जाने के कई अर्थ व्यक्त कर सकता है; केवल इस वाक्यांश से इसकी ठीक छटा स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: बहुवचन वर्तमान कृदंत की उद्धरण-प्रस्तावक भूमिका को बनाए रखता है और इस अंश से बाहर के कर्ता या ढंग को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: Ὅτι
  choice: चूँकि
  rationale: यहाँ ὅτι कथन के भीतर कारण प्रस्तुत करता है; ‘चूँकि… इसलिए’ आधुनिक हिन्दी में उस कारण-परिणाम संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἀπέστειλα
  choice: मैंने… नहीं भेजा
  rationale: यूनानी अओरिस्ट और उद्धरण के प्रथम पुरुष को सरल भूतकाल में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ ἀργύριον
  choice: चाँदी
  rationale: शब्द के ठोस, शाब्दिक अर्थ को बनाए रखता है, यद्यपि प्रसंग में इसका उपयोग धन के रूप में हो सकता है।
- source_word: τὰ παιδάρια
  choice: लड़कों
  rationale: παιδάριον के आयु-संबंधी मूल अर्थ के निकट रहता है और पाठ से अधिक निश्चित सामाजिक भूमिका आरोपित नहीं करता; युवा सेवक या परिचारक का अर्थ भी संभव है।
- source_word: ἀπώλετο
  choice: नष्ट हो गया
  rationale: क्रिया के व्यापक विनाश-संबंधी अर्थ को सुरक्षित रखता है; यह मृत्यु, विनाश या बरबादी की संभावित छटाओं में से किसी एक को अनावश्यक रूप से संकीर्ण नहीं करता।
