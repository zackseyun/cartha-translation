    issue: The opening “जब ... तो” presents Tryphon's learning as a temporal condition rather than simply the next narrative event.
    rationale: Greek καὶ ἔγνω is coordinate narration (“And Tryphon learned/came to know”), not a temporal subordinate clause. A direct opening is closer and smoother.
  - severity: low
    issue: “उठ खड़ा हुआ है ... करने वाला है” is less well aligned with the past narrative frame established by “पता चला” and “उसने ... भेजे.”
    rationale: Past-relative forms naturally convey that, when Tryphon learned it, Simon had emerged and was about to undertake military action.
