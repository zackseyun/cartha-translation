  yaml_path: translation/deuterocanon/1_maccabees/013/014.yaml
  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: hi
  text: त्रूफ़ोन को पता चला कि शमौन अपने भाई योनातान के स्थान पर उठ खड़ा हुआ था[a] और उससे युद्ध करने वाला था[b]; इसलिए उसने उसके पास दूत भेजकर कहलवाया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाई योनातान का स्थान ले लिया था।” यूनानी पद नेतृत्व में उसके उत्तराधिकारी के रूप में उभरने का भाव भी दे सकता है, केवल शारीरिक रूप से उठने का नहीं।
    reason: lexical_alternative
  - marker: b
    text: या “उसके विरुद्ध युद्ध में उतरने वाला था” अथवा “उससे लड़ाई छेड़ने वाला था।” यूनानी अभिव्यक्ति सशस्त्र संघर्ष में उतरने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: पता चला
  rationale: यहाँ क्रिया किसी परिस्थिति की जानकारी मिलने को दर्शाती है, केवल पहले से जानने की स्थिति को नहीं।
- source_word: ἀνέστη
  choice: उठ खड़ा हुआ है
  rationale: यह स्रोत का बिंब बनाए रखता है और नेतृत्व में उभरने का भाव देता है; ἀντὶ Ἰωνάθου अगुवाई में स्थान लेने का संदर्भ स्पष्ट करता है।
- source_word: ἀντὶ Ἰωνάθου τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई योनातान के स्थान पर
  rationale: ἀντί प्रतिस्थापन या उत्तराधिकार का भाव देता है; यह अनुवाद अनावश्यक व्याख्यात्मक विशिष्टता जोड़े बिना स्वाभाविक है।
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: उससे युद्ध करने
  rationale: यह यूनानी मुहावरा किसी के साथ सशस्त्र संघर्ष में उतरने को व्यक्त करता है; हिन्दी में यह संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: μέλλει
  choice: करने वाला है
  rationale: μέλλω निकट भविष्य या अभिप्रेत कार्य का संकेत देता है; संदर्भ में यह भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἀπέστειλεν ... πρέσβεις
  choice: दूत भेजकर
  rationale: πρέσβεις प्रतिनिधि दूत हैं; हिन्दी में ‘दूत’ राजनीतिक संदेशवाहक का भाव पर्याप्त रूप से देता है।
- source_word: λέγων
  choice: कहलवाया
  rationale: कृदंत अगले पद में आने वाले संदेश का परिचय देता है। भेजे गए दूतों के माध्यम से बोलने के कारण ‘भेजकर कहलवाया’ हिन्दी में स्वाभाविक है और वाक्य को आगे खुला रखता है।
