translation:
  language: hi
  text: परन्तु शमौन ने मैदान के सामने अदीदा में छावनी डाली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν
  choice: छावनी डाली
  rationale: सैन्य प्रसंग में यह क्रिया पड़ाव डालने या शिविर स्थापित करने को व्यक्त करती है; ‘छावनी डाली’ संक्षिप्त, स्वाभाविक और सैन्य भाव को स्पष्ट रखने वाला हिन्दी प्रयोग है।
- source_word: ἐν Ἀδείδοις
  choice: अदीदा में
  rationale: ἐν स्थानसूचक है। नगर अथवा स्थल के भीतर/उस स्थान पर सैन्य पड़ाव का स्वाभाविक हिन्दी रूप ‘अदीदा में’ है। यूनानी रूप Ἀδείδοις का नामरूप ‘अदीदा’ रखा गया है।
- source_word: κατὰ πρόσωπον
  choice: के सामने
  rationale: यह स्थानिक वाक्यांश आमने-सामने अथवा सम्मुख स्थिति दर्शाता है। ‘के सामने’ मूल की दिशा-संबंधी भाषा को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: τοῦ πεδίου
  choice: मैदान
  rationale: πεδίον समतल खुले भूभाग को दर्शाता है। इस भौगोलिक-सैन्य प्रसंग में ‘मैदान’ सामान्य आधुनिक हिन्दी में सहज और पर्याप्त रूप से विशिष्ट है।
- source_word: δὲ
  choice: परन्तु
  rationale: δὲ हल्का संक्रमण या विरोध सूचित करता है। ‘परन्तु’ कथानक में इस बदलाव को बनाए रखता है, यद्यपि यहाँ विरोध प्रबल नहीं है।
