  yaml_path: translation/deuterocanon/1_maccabees/013/027.yaml
  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: hi
  text: और शमौन ने अपने पिता और अपने भाइयों की कब्र के ऊपर एक स्मारक बनाया। उसने उसे इतना ऊँचा उठाया कि वह स्पष्ट दिखाई दे[a], और उसके आगे और पीछे तराशे हुए पत्थर[b] लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वह देखने में भव्य लगे।” यूनानी पद स्मारक के स्पष्ट दिखाई देने या दृष्टि में प्रभावशाली होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “चिकने किए हुए पत्थर।” यूनानी शब्द ऐसे पत्थर को दर्शा सकता है जिसे घिसकर चिकना या बारीकी से तैयार किया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: बनवाया
  rationale: यह οἰκοδομέω के सामान्य निर्माण-अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; शमौन द्वारा कार्य कराए जाने के ऐतिहासिक संदर्भ में प्रेरणार्थक रूप सहज है।
- source_word: ἐπὶ τὸν τάφον
  choice: कब्र के ऊपर
  rationale: ἐπί के साथ कर्मकारक यहाँ कब्र के ऊपर अथवा उससे संबद्ध ऊपरी निर्माण का संकेत देता है; ‘के ऊपर’ इस स्थानिक अर्थ को बनाए रखता है।
- source_word: ὕψωσεν αὐτόν
  choice: उसे इतना ऊँचा उठाया
  rationale: ὑψόω के भौतिक रूप से ऊँचा करने के अर्थ को सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῇ ὁράσει
  choice: कि वह साफ दिखाई दे
  rationale: यह पद स्मारक के दृष्टिगोचर या देखने में प्रभावशाली होने का भाव दे सकता है। मुख्य पाठ में दृश्यता का अर्थ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: λίθῳ ξυστῷ
  choice: तराशे हुए पत्थर
  rationale: ξυστός घिसकर चिकना किए या बारीकी से तैयार किए हुए पत्थर को दर्शाता है। स्थापत्य-संदर्भ में ‘तराशे हुए पत्थर’ स्पष्ट और सहज है, जबकि चमकदार पालिश का अनावश्यक दावा नहीं करता।
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: उसके आगे और पीछे
  rationale: यह युग्म स्मारक के सामने और पीछे दोनों ओर किए गए पत्थर के काम को स्पष्ट रूप से व्यक्त करता है।
