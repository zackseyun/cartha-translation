  text: उन दिनों उसने गाज़ा के विरुद्ध छावनी डाली और सैनिक छावनियों से उसे घेर लिया। फिर उसने एक घेराबंदी-यंत्र बनाया और उसे नगर तक ले आया। उसने एक मीनार पर प्रहार किया और उस पर अधिकार कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Γάζαν
  choice: उसने गाज़ा के सामने छावनी डाली
  rationale: सैन्य संदर्भ में παρεμβάλλω का मूल भाव छावनी डालना है, और ἐπί यहाँ विरोधी लक्ष्य को सूचित करता है। ‘के सामने’ स्वाभाविक हिन्दी में इस सैन्य स्थिति को व्यक्त करता है।
- source_word: ἐκύκλωσεν αὐτὴν παρεμβολαῖς
  choice: चारों ओर सैनिक छावनियाँ लगाकर उसे घेर लिया
  rationale: ἐκύκλωσεν का सीधा अर्थ ‘चारों ओर घेरना’ है और बहुवचन παρεμβολαῖς सैन्य छावनियों को दर्शाता है। यह अनुवाद दोनों यूनानी तत्वों को अलग-अलग बनाए रखता है।
- source_word: ἑλέπολιν
  choice: नगर को जीतने का एक घेराबंदी-यंत्र
  rationale: ἑλέπολις नगर पर आक्रमण के लिए प्रयुक्त विशेष घेराबंदी मशीन का नाम है। अर्थ को सामान्य पाठक के लिए स्पष्ट रखते हुए ‘नगर को जीतने का’ मूल शब्द की व्युत्पत्तिगत विशिष्टता भी संकेत करता है।
- source_word: προσήγαγεν τῇ πόλει
  choice: उसे नगर के पास ले आया
  rationale: क्रिया किसी वस्तु को लक्ष्य के निकट लाने का भाव देती है; यहाँ सर्वनाम का संदर्भ अभी बताए गए घेराबंदी-यंत्र से है।
- source_word: ἐπάταξεν πύργον ἕνα
  choice: उसने एक मीनार पर प्रहार किया
  rationale: ἐπάταξεν के प्रहार के भाव और πύργον ἕνα के शाब्दिक ‘एक मीनार’ को बिना अतिरिक्त अर्थ जोड़े रखा गया है।
- source_word: κατελάβετο
  choice: उस पर अधिकार कर लिया
  rationale: सैन्य संदर्भ में क्रिया कब्ज़ा करने या अधिकार में लेने को व्यक्त करती है। निकटतम पूर्वपद ‘एक मीनार’ होने के कारण ‘उस पर’ उसी का स्वाभाविक संदर्भ है।
