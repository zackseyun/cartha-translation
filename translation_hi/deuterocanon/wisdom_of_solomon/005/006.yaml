    text: या, “न्याय का प्रकाश हम पर नहीं चमका।” यूनानी शब्द δικαιοσύνη में नैतिक धार्मिकता और न्याय—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
