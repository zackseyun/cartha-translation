  rationale: यह शब्द दुष्टों की पिछली बातों से निकले आत्मस्वीकृत निष्कर्ष को व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
