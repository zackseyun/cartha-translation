- source_word: ἀπὸ ὁδοῦ ἀληθείας
  choice: सत्य के मार्ग से
  rationale: मूल यूनानी के मार्ग-रूपक और संबंधसूचक रचना को निकटता से सुरक्षित रखता है।
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: धार्मिकता का प्रकाश
  rationale: यह नैतिक सहीपन के प्रमुख अर्थ को व्यक्त करता है, जबकि न्याय का संभव भाव पादटिप्पणी में सुरक्षित है।
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: हम पर नहीं चमका
  rationale: प्रकाश के व्यक्तियों पर चमकने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ ἥλιος
