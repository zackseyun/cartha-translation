  rationale: मूल संज्ञा का सीधा, गरिमापूर्ण हिन्दी अनुवाद।
- source_word: οὐκ ἀνέτειλεν ἡμῖν
  choice: हमारे लिए उदय नहीं हुआ
  rationale: ἡμῖν के संबंध अथवा हितसूचक भाव को ‘हमारे लिए’ से और सूर्य के उगने की छवि को ‘उदय’ से सुरक्षित रखा गया है।
