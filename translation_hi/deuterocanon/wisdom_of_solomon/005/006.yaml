  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: hi
  text: इसलिए हम सत्य के मार्ग से भटक गए, धार्मिकता का प्रकाश हम पर नहीं चमका,[a] और सूर्य हमारे लिए उदय नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
