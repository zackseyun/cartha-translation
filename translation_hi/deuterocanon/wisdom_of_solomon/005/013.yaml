- from: इसी प्रकार हम भी जन्म लेने के बाद मिट गए[a]; हमारे पास सद्गुण का कोई चिह्न दिखाने को नहीं था[b], बल्कि हम अपनी दुष्टता में ही चुक गए।
  to: इसी प्रकार हम भी जन्म लेकर लुप्त हो गए[a]; हमारे पास सद्गुण का कोई चिह्न दिखाने को नहीं था[b], पर हम अपनी दुष्टता में ही खप गए।
