review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comparison (οὕτως καὶ ἡμεῖς), birth/coming into being, the absence of demonstrable virtue, and the ethical force of κακία. However, “चुक गए” is too idiomatic and can mean merely ‘were finished/ceased’; it does not adequately retain the passive, consumptive force of κατεδαπανήθημεν (‘were used up/consumed’).
  naturalness: “जन्म लेकर” is more idiomatic and rhythmically direct than “जन्म लेने के बाद.” “अपनी दुष्टता में ही खप गए” is natural modern Hindi and clearly conveys lives being expended in wickedness.
  terminology: “सद्गुण” is an appropriate, dignified rendering of ἀρετή in this moral context. “चिह्न” preserves the image of σημεῖον and is supported by “दिखाने को.” “दुष्टता” suitably renders the moral sense of κακία.
  issues:
  - severity: medium
    issue: The rendering “हम अपनी दुष्टता में ही चुक गए” weakens κατεδαπανήθημεν.
    rationale: The Greek passive verb denotes being spent up, exhausted, or consumed. “चुक गए” can express simple completion or cessation and does not clearly communicate the destructive expenditure expressed by the source.
  revised_text: इसी प्रकार हम भी जन्म लेकर लुप्त हो गए[a]; हमारे पास सद्गुण का कोई चिह्न दिखाने को नहीं था[b], पर हम अपनी दुष्टता में ही खप गए।
