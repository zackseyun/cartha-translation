  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
translation:
  language: hi
  text: इसी प्रकार हम भी जन्म लेकर लुप्त हो गए[a]; हमारे पास सद्गुण का कोई चिह्न दिखाने को नहीं था[b], पर हम अपनी दुष्टता में ही खप गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समाप्त हो गए,” “बीत गए,” अथवा “मिट गए।” यूनानी क्रिया समाप्त होने या लुप्त हो जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “सद्गुण” का अनुवाद “नैतिक श्रेष्ठता” भी हो सकता है। यूनानी शब्द व्यापक रूप से उत्कृष्टता को सूचित कर सकता है।
    reason: lexical_alternative
