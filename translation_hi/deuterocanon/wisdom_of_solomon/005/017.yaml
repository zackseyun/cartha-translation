    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘वह सृष्टि को हथियार बनाएगा’ या ‘सृष्टि को युद्ध-साधन के रूप में तैयार करेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: धारण करेगा
  rationale: यह λαμβάνω का भविष्यत् मध्यम रूप है। युद्ध-कवच के प्रसंग में शाब्दिक ‘लेगा’ की अपेक्षा ‘धारण करेगा’ स्वाभाविक हिन्दी है और क्रिया का आशय स्पष्ट करता है।
- source_word: πανοπλίαν
  choice: सम्पूर्ण युद्ध-कवच
  rationale: यह किसी भारी हथियारबंद योद्धा के पूरे साज-सामान को दर्शाता है। ‘सम्पूर्ण युद्ध-कवच’ इसके पूर्णताबोध और सैनिक बिम्ब दोनों को बनाए रखता है।
- source_word: τὸν ζῆλον αὐτοῦ
  choice: अपने उत्साह को
  rationale: ζῆλος में प्रबल उत्साह या ईर्ष्या—दोनों अर्थ सम्भव हैं। इस युद्ध और न्याय के प्रसंग में ‘उत्साह’ सहज है, जबकि दूसरे सम्भव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὁπλοποιήσει
  choice: शस्त्र बनाएगा
  rationale: क्रिया का मूल भाव किसी वस्तु को हथियार बनाना या युद्ध के लिए साधन बनाना है। यह अनुवाद सृष्टि के स्वयं ईश्वरीय प्रतिरक्षा का साधन बनने वाले सशक्त बिम्ब को बनाए रखता है।
- source_word: τὴν κτίσιν
  choice: सृष्टि को
  rationale: κτίσις यहाँ व्यापक रूप से रचे हुए जगत को सूचित करता है; ‘सृष्टि’ संक्षिप्त, स्वाभाविक और ब्रह्माण्डीय विस्तार के अनुकूल है।
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: शत्रुओं से बचाव के लिए
  rationale: ἄμυνα का मूल भाव रक्षा, प्रतिरोध या दूर हटाना है। यूनानी में ‘शत्रुओं’ के साथ कोई स्पष्ट सम्बन्धसूचक सर्वनाम नहीं है, इसलिए हिन्दी में भी ‘उसके शत्रुओं’ नहीं जोड़ा गया।
theological_decisions:
- issue: निहित कर्ता की पहचान
  choice: कर्ता को ‘वह’ रखा गया है; प्रसंग में यह प्रभु परमेश्वर है।
  alternative: ईश्वरीय न्याय का मानवीकरण
  rationale: यूनानी क्रियाएँ तीसरे पुरुष एकवचन में हैं और आसपास का प्रसंग प्रभु को योद्धा के रूप में चित्रित करता है। ‘वह’ मूल की निहितता को बनाए रखता है और पद के भीतर अनावश्यक रूप से नाम नहीं जोड़ता।
- issue: ईश्वरीय युद्ध-बिम्ब में ζῆλος का अर्थ
  choice: उत्साह
  alternative: ईर्ष्या या ईर्ष्यापूर्ण आवेश
  rationale: यहाँ गुण को युद्ध-कवच के रूप में रूपकात्मक ढंग से प्रस्तुत किया गया है। ‘उत्साह’ प्रबल ईश्वरीय तत्परता को व्यक्त करता है, जबकि वास्तविक शब्दार्थगत द्व्यर्थता पादटिप्पणी में बनी रहती है।
- issue: सृष्टि को युद्ध-साधन बनाने का बिम्ब
  choice: सृष्टि को शस्त्र बनाएगा
  alternative: सृष्टि को हथियारों से लैस करेगा
  rationale: ὁπλοποιήσει केवल बाहरी हथियार पहनाने की अपेक्षा सृष्टि को ही युद्ध का साधन बनाने का अर्थ भी दे सकता है। चुना हुआ पाठ इस प्रबल रूपdf के निकट रहता है।
