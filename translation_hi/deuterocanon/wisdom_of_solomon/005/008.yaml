lexical_decisions:
- source_word: ὑπερηφανία
  choice: घमंड
  rationale: यह शब्द अहंकारी गर्व को व्यक्त करता है; ‘घमंड’ आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: πλοῦτος
  choice: धन-दौलत
  rationale: यहाँ भौतिक संपत्ति और वैभव का अर्थ है; ‘धन-दौलत’ साधारण पाठकों के लिए सहज है।
- source_word: μετὰ ἀλαζονίας
  choice: शेखी से जुड़ी
  rationale: ἀλαζονία डींग, आत्मप्रदर्शन या शेखी का भाव रखता है; μετὰ के संबंधसूचक भाव को ‘से जुड़ी’ द्वारा रखा गया है।
- source_word: συμβέβληται ἡμῖν
  choice: हमें क्या फ़ायदा पहुँचाया
  rationale: क्रिया का भाव किसी योगदान या प्राप्त लाभ का है; हिन्दी में यह प्रश्न स्वाभाविक ढंग से उसी निष्फलता को व्यक्त करता है।
theological_decisions:
- issue: धन और शेखी के संबंध का स्वरूप
  choice: ‘शेखी से जुड़ी धन-दौलत’
  alternative: ‘शेखी के साथ धन-दौलत’
  rationale: यूनानी वाक्य धन को अपने-आप दोषी घोषित करने के बजाय उसे शेखी के साथ रखता है; चुना हुआ रूप इसी संबंध को बनाए रखता है और अनावश्यक धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
