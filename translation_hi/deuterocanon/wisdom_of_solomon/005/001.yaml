translation:
  language: hi
  text: तब धर्मी जन बड़े साहस के साथ उन लोगों के सामने खड़ा होगा जिन्होंने उसे सताया था और जो उसके परिश्रमों को तुच्छ ठहराते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बड़े आत्मविश्वास के साथ” या “बड़ी निर्भीकता से” भी अनुवाद सम्भव है; यूनानी शब्द में साहस, आत्मविश्वास और खुलकर सामने आने के भाव हैं।
    reason: lexical_alternative
  - marker: b
    text: “परिश्रमों” के लिए प्रयुक्त यूनानी शब्द का अर्थ “कठिन श्रम,” “कष्ट” या “पीड़ाएँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण आगे घटने वाले दृश्य को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: στήσεται
  choice: खड़ा होगा
  rationale: भविष्यत् रूप यहाँ धर्मी जन के न्यायोचित ठहराए जाने की स्थिति में खड़े होने का चित्र बनाए रखता है, बिना कर्मवाच्य अर्थ थोपे।
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: बड़े साहस के साथ
  rationale: παρρησία में निर्भीकता, खुलापन और आत्मविश्वास के भाव हैं; न्याय और प्रत्यक्ष सामना करने के प्रसंग में ‘बड़े साहस के साथ’ सहज है।
- source_word: ὁ δίκαιος
  choice: धर्मी जन
  rationale: मूल यूनानी के एकवचन प्रतिनिधि व्यक्ति को बनाए रखता है; ‘जन’ आधुनिक हिन्दी में गरिमापूर्ण है और अनावश्यक रूप से केवल जैविक लिंग पर बल नहीं देता।
- source_word: κατὰ πρόσωπον
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘मुख के सामने’ है, पर हिन्दी में ‘के सामने’ प्रत्यक्ष उपस्थिति और सामना—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν θλιψάντων αὐτὸν
  choice: जिन्होंने उसे सताया था
  rationale: θλίβω दबाने, पीड़ित करने या सताने को व्यक्त करता है; ‘सताया’ आरोपित कष्ट को स्पष्ट और सामान्य हिन्दी में बताता है।
- source_word: τῶν ἀθετούντων
  choice: तुच्छ समझा था
  rationale: ἀθετέω का आशय अस्वीकार करना, दरकिनार करना या महत्वहीन मानना हो सकता है; πόνους के साथ ‘तुच्छ समझना’ उनके मूल्य और महत्व की अवहेलना को व्यक्त करता है।
- source_word: τοὺς πόνους αὐτοῦ
  choice: उसके परिश्रमों को
  rationale: πόνος श्रम, कठिन परिश्रम, कष्ट या पीड़ा का बोध करा सकता है; ‘परिश्रमों’ बहुवचन को बनाए रखते हुए प्रयत्न और उसकी कीमत दोनों की ओर संकेत करता है।
theological_decisions:
- issue: ὁ δίκαιος का प्रतिनिधि एकवचन
  choice: धर्मी जन
  alternative: धर्मी पुरुष / धर्मी व्यक्ति
  rationale: यूनानी का एकवचन सुरक्षित रखा गया है। ‘धर्मी जन’ व्यक्ति की प्रतिनिधिक भूमिका को व्यक्त करता है और बहुवचन या सामूहिक अर्थ नहीं थोपता।
- issue: न्याय और प्रतिपादन के दृश्य में παρρησία का भाव
  choice: बड़े साहस के साथ
  alternative: बड़े आत्मविश्वास के साथ / बड़ी निर्भीकता से
  rationale: ‘साहस’ सार्वजनिक रूप से सामने खड़े होने की निर्भीकता को बनाए रखता है; यह केवल आन्तरिक आत्मविश्वास तक अर्थ को सीमित नहीं करता।
- issue: ἀθετέω और πόνος के संबंध का अर्थ
  choice: उसके परिश्रमों को तुच्छ समझा था
  alternative: उसके कष्टों की उपेक्षा की थी
  rationale: मुख्य पाठ उनके श्रम और कठिन साधना को मूल्यहीन मानने का भाव देता है, जबकि पादटिप्पणी πόνος में निहित कष्ट और पीड़ा की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज रखी गई है। ‘के सामने’ स्वाभाविक हिन्दी में यूनानी के प्रत्यक्ष आमने-सामने होने के भाव को संजोता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
