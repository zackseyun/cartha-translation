base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: hi
  text: हम अधर्म और विनाश के मार्गों से भर गए थे[a], और राहहीन वीरानों से होकर गुज़रे[b]; पर प्रभु का मार्ग हमने नहीं जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का अधिक शाब्दिक रूप: “हम अधर्म और विनाश की पगडंडियों से भर गए थे।”'
    reason: मूल में ‘भर गए’ का असामान्य रूपक और अमूर्त संज्ञाओं के साथ ‘पगडंडियों/मार्गों’ की रचना बनी हुई है।
  - marker: b
    text: या, “दुर्गम निर्जन प्रदेशों से होकर गुज़रे।”
    reason: ἀβάτους का अर्थ ‘राहहीन’ के साथ-साथ ‘दुर्गम’ या ‘जिसमें चला न जा सके’ भी हो सकता है।
lexical_decisions:
- source_word: ἀνομίας
  choice: अधर्म
  rationale: यह शब्द व्यवस्था-विरोधी और नैतिक रूप से अनुचित आचरण को व्यक्त करता है। ‘अधर्म’ आधुनिक हिन्दी में संक्षिप्त है और पद के नैतिक आशय को बनाए रखता है।
- source_word: ἐνεπλήσθημεν
  choice: हम ... से भर गए थे
  rationale: यूनानी क्रिया का कर्मवाच्य रूप और ‘भर जाने’ का रूपक दोनों सुरक्षित रखे गए हैं; इसे केवल ‘हम चले’ कहना मूल की असामान्य किंतु सार्थक छवि खो देता।
- source_word: τρίβοις
  choice: मार्गों
  rationale: शब्द का अर्थ पगडंडी, राह या चलने का मार्ग हो सकता है। यहाँ आगे आने वाले ‘प्रभु के मार्ग’ के साथ जानबूझकर बना विरोध स्पष्ट रखने के लिए ‘मार्गों’ चुना गया।
- source_word: ἀπωλείας
  choice: विनाश
  rationale: यह नाश, बरबादी या विनाश को सूचित करता है। ‘विनाश’ पद की गंभीर नैतिक परिणति को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: διωδεύσαμεν
  choice: से होकर गुज़रे
  rationale: क्रिया किसी भूभाग को पार करने या उसमें से होकर जाने का भाव देती है; यह हिन्दी प्रयोग उसी गति और यात्रा-बिंब को स्वाभाविक रूप से रखता है।
- source_word: ἐρήμους ἀβάτους
  choice: राहहीन वीरानों
  rationale: ἐρήμους निर्जन प्रदेशों या वीरानों को और ἀβάτους ऐसे स्थानों को दर्शाता है जिनमें चला न जा सके या जिनकी राह न हो। ‘राहहीन वीराने’ दोनों भावों को संक्षेप में जोड़ता है।
- source_word: ὁδὸν Κυρίου
  choice: प्रभु का मार्ग
  rationale: यह शाब्दिक मार्ग और प्रभु के अनुरूप जीवन-पथ, दोनों अर्थों की संभावना बनाए रखता है। κύριος के लिए परियोजना-संगत उपाधि ‘प्रभु’ रखी गई है।
- source_word: ἔγνωμεν
  choice: हमने नहीं जाना
  rationale: यह γινώσκω के ज्ञान या पहचान के सामान्य अर्थ को सुरक्षित रखता है और स्वीकारोक्ति के गंभीर स्वर के अनुकूल है।
theological_decisions:
- issue: ‘प्रभु का मार्ग’ का आशय
  choice: मुहावरे को बिना व्याख्यात्मक विस्तार के ‘प्रभु का मार्ग’ रखा गया, जिससे प्रभु के अनुरूप नैतिक-आध्यात्मिक जीवन-पथ का प्रमुख आशय बना रहता है।
  alternative: इसे प्रभु द्वारा ठहराया गया कोई अधिक शाब्दिक रास्ता भी समझा जा सकता है।
  rationale: पद में अधर्म और विनाश के मार्गों का विरोध प्रभु के मार्ग से है, इसलिए नैतिक रूपक प्रमुख है; फिर भी अनुवाद मूल मुहावरे को बनाए रखकर शाब्दिक और रूपकात्मक अर्थ के तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी के मार्ग-रूपक और स्वीकारोक्तिपूर्ण शब्दक्रम को यथासंभव बनाए रखा गया है।
