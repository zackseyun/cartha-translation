- source_word: ὁσιότητα
  choice: पवित्रता
  rationale: यह परमेश्वर के सम्मुख उचित, श्रद्धापूर्ण और नैतिक शुद्धता के व्यापक गुण को व्यक्त करता है; ‘भक्ति’ और ‘ईश्वर-परायणता’ भी संभव अर्थ हैं।
theological_decisions:
- issue: ὁσιότητα को व्यापक नैतिक-धार्मिक गुण के रूप में प्रस्तुत किया जाए या मुख्यतः भक्तिपरक गुण के रूप में।
  choice: पवित्रता
  alternative: भक्ति; ईश्वर-परायणता
  rationale: कवच के रूपक में सद्गुण का मानवीकरण हुआ है। ‘पवित्रता’ मूल शब्द की व्यापक नैतिक और परमेश्वर-संबंधी शक्ति को बनाए रखती है, जबकि वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज है। ‘उठा लेगा’ युद्ध-सज्जा की क्रिया को स्वाभाविक बनाता है, और ‘अजेय ढाल’ मूल का संक्षिप्त तथा प्रभावशाली रूपक बनाए रखता है।
