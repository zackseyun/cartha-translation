lexical_decisions:
- source_word: λήμψεται
  choice: उठा लेगा
  rationale: λαμβάνω के भविष्यत् मध्यम रूप को युद्ध-सज्जा के प्रसंग में ‘उठा लेगा’ कहना स्वाभाविक है और ढाल हाथ में लेने की क्रिया को स्पष्ट रखता है।
- source_word: ἀσπίδα
  choice: ढाल
  rationale: यह सामान्य और आधुनिक हिन्दी में समझा जाने वाला शब्द है तथा यूनानी युद्ध-चित्र को ठीक बनाए रखता है।
- source_word: ἀκαταμάχητον
  choice: अजेय
