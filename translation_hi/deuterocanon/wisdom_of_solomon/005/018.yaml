    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσεται
  choice: पहनेगा
  rationale: भविष्यत् मध्यम रूप कवच धारण करने की सोची-समझी क्रिया व्यक्त करता है; ‘पहनेगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: θώρακα
  choice: कवच
  rationale: यह छाती और धड़ की रक्षा करने वाले सैनिक अंगरक्षक का सामान्य और सुबोध हिन्दी नाम है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: δικαιοσύνη नैतिक खराई और न्याय—दोनों अर्थ धारण कर सकता है। मुख्य पाठ में ‘धार्मिकता’ उसके नैतिक गुण को सुरक्षित रखता है, जबकि ‘न्यायपरायणता’ पादटिप्पणी में दिया गया है।
- source_word: περιθήσεται
  choice: धारण करेगा
  rationale: περιτίθημι का अर्थ अपने चारों ओर या अपने ऊपर रखना है; टोप के प्रसंग में ‘धारण करेगा’ स्वाभाविक है और पहले क्रियापद से शैलीगत भेद भी बनाए रखता है।
- source_word: κόρυθα
  choice: टोप
  rationale: κόρυς सैनिक सिर-कवच है; ‘टोप’ बाइबलीय युद्ध-साज के प्रसंग में स्पष्ट और प्रचलित हिन्दी पद है।
- source_word: κρίσιν
  choice: न्याय
  rationale: यहाँ κρίσις न्याय करने अथवा न्यायिक निर्णय का भाव रखता है; ‘न्याय’ हिन्दी में इस सक्रिय और न्यायिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἀνυπόκριτον
  choice: निष्कपट
  rationale: शाब्दिक अर्थ ‘कपट-रहित’ है। ‘निष्कपट न्याय’ निर्णय की वास्तविकता और पक्षपातरहितता को बिना अर्थ सीमित किए व्यक्त करता है।
theological_decisions:
- issue: δικαιοσύνη को युद्ध-कवच के रूपक में कैसे व्यक्त किया जाए
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ‘धार्मिकता’ परमेश्वर की नैतिक खराई को कवच के रूप में सामने रखता है, जबकि स्रोत शब्द में उपस्थित न्याय का आयाम पादटिप्पणी में सुरक्षित है।
- issue: ἀνυπόκριτον κρίσιν का अर्थ
  choice: निष्कपट न्याय
  alternative: पक्षपातरहित न्याय
  rationale: यूनानी वाक्यांश का सीधा अर्थ ‘कपट-रहित न्याय’ है। ‘निष्कपट’ वास्तविकता और निष्पक्षता दोनों की संभावना खुली रखता है; केवल ‘पक्षपातरहित’ कहना अर्थ को एक पहलू तक सीमित कर सकता है।
