  choice: ‘समुद्र का जल उनके विरुद्ध उग्र हो उठेगा’
  alternative: ‘समुद्र का जल उन पर प्रचंडता से टूट पड़ेगा’
  rationale: मूल ἀγανακτήσει में भावात्मक रोष का तत्व है; उसे केवल भौतिक प्रचंडता में बदलने के बजाय मानवीकरण और न्यायगत तनाव सुरक्षित रखा गया।
- issue: θυμός का कर्ता या संबंध
  choice: ओलों को ‘क्रोध से भरे’ कहा गया
  alternative: ‘प्रचंड वेग से भरे’
  rationale: θυμός का सामान्य अर्थ क्रोध/रोष है। संदर्भ युद्धात्मक बल की अनुमति देता है, पर उसे मात्र वेग मानना मूल की धार्मिक-न्यायिक छवि को कम कर देता।
