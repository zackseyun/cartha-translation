- source_word: ῥιφήσονται χάλαζαι
  choice: ओले बरसाए जाएँगे
  rationale: मूल अर्थ ‘ओले फेंके जाएँगे’ है; हिन्दी में ‘बरसाए जाएँगे’ ओलों के लिए स्वाभाविक है और साथ के प्रक्षेपास्त्र-बिंब को पूर्ववर्ती पदबंध बनाए रखता है।
- source_word: ἀγανακτήσει
  choice: उग्र हो उठेगा
  rationale: क्रोध, रोष या आक्रोश से सक्रिय विरोध करने का अर्थ व्यक्त करता है और समुद्र के जल के मानवीकरण को बनाए रखता है।
- source_word: συγκλύσουσιν ἀποτόμως
  choice: अचानक उन्हें डुबो देंगी
  rationale: συγκλύζω के बहाकर ढक देने/जलमग्न करने के अर्थ तथा ἀποτόμως की आकस्मिक और तीव्र क्रिया को सहज हिन्दी में व्यक्त किया गया।
