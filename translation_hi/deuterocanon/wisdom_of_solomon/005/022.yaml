  text: और पत्थर फेंकने वाले यंत्र से क्रोध से भरे ओले प्रक्षेपित किए जाएँगे; समुद्र का जल उनके विरुद्ध उग्र हो उठेगा, और नदियाँ अचानक उन्हें डुबो देंगी।
