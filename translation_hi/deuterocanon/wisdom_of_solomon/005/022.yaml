lexical_decisions:
- source_word: ἐκ πετροβόλου
  choice: पत्थर फेंकने वाले यंत्र से
  rationale: πετροβόλος यहाँ पत्थर फेंकने के युद्ध-यंत्र या गोफन-सदृश साधन का संकेत देता है; स्रोत के युद्धात्मक बिंब को स्पष्ट रखते हुए किसी एक तकनीकी प्रकार को अनावश्यक रूप से निश्चित नहीं किया गया।
