base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: hi
  text: इसलिए वे प्रभु के हाथ से वैभव का राज्य[a] और सौंदर्य का राजमुकुट[b] पाएँगे, क्योंकि वह अपने दाहिने हाथ से उन्हें ढाँप लेगा और अपनी भुजा से उनकी रक्षा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वैभव का राजचिह्न।’ यूनानी शब्द का अर्थ ‘राज्य’ हो सकता है, पर इस प्रसंग में राजकीय अलंकरण भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘राजमुकुट’ के लिए प्रयुक्त यूनानी शब्द विशेष रूप से राजा द्वारा पहने जाने वाले मुकुट को दर्शाता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद पिछले प्रसंग में धर्मियों के प्रतिफल और प्रतिष्ठा से निष्कर्ष जोड़ता है; ‘इसलिए’ स्वाभाविक और संक्षिप्त है।
- source_word: λήμψονται
  choice: पाएँगे
  rationale: भविष्यकालीन रूप यहाँ प्रभु के हाथ से दिए जाने वाले वरदान को ग्रहण करने का भाव रखता है, न कि बलपूर्वक लेने का।
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  choice: वैभव का राज्य
  rationale: βασίλειον को संज्ञा रूप में ‘राज्य’ समझना संभव और प्रसंगानुकूल है; εὐπρέπεια राजसी शोभा और वैभव व्यक्त करता है। मूर्त राजचिह्न वाला अर्थ संभव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸ διάδημα τοῦ κάλλους
  choice: सौंदर्य का राजमुकुट
  rationale: διάδημα सामान्य मुकुट नहीं, विशेष रूप से राजकीय शिरोभूषण है; ‘राजमुकुट’ आधुनिक पाठक के लिए स्पष्ट है और κάλλος के सीधे अर्थ ‘सौंदर्य’ को बनाए रखता है।
- source_word: ἐκ χειρὸς Κυρίου
  choice: प्रभु के हाथ से
  rationale: यह पदबंध प्रतिफल देने वाले प्रभु की व्यक्तिगत क्रिया को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: τῇ δεξιᾷ σκεπάσει αὐτούς
  choice: अपने दाहिने हाथ से उन्हें आड़ देगा
  rationale: करणवाचक चतुर्थी को ‘से’ द्वारा व्यक्त किया गया है। ‘आड़ देगा’ ढककर सुरक्षित रखने की छवि को बनाए रखता है और अगले रक्षा-सूचक क्रिया-पद से भेद भी रखता है।
- source_word: τῷ βραχίονι ὑπερασπιεῖ αὐτῶν
  choice: अपनी भुजा से उनकी रक्षा करेगा
  rationale: ‘भुजा’ ईश्वरीय सामर्थ्य की बाइबिलीय छवि बनाए रखती है। ὑπερασπίζω में किसी के पक्ष में खड़े होकर रक्षा करने का भाव है, जिसे सहज हिन्दी में ‘उनकी रक्षा करेगा’ कहा गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर को सार्वभौम दाता और रक्षक के रूप में दर्शाता है; ‘प्रभु’ प्रतिष्ठित बाइबिलीय संबोधन है।
- issue: धर्मियों के प्रतिफल की राजकीय छवि
  choice: ‘राज्य’ और ‘राजमुकुट’ की ठोस राजकीय छवि बनाए रखना
  alternative: इसे केवल ‘राजकीय सम्मान’ या ‘महिमामय शासन’ के रूप में व्याख्यायित करना
  rationale: यूनानी पाठ राजकीय सत्ता और राजचिह्न की भाषा रखता है। अनुवाद यह तय नहीं करता कि यह केवल रूपकात्मक प्रतिष्ठा है या शासन में वास्तविक सहभागिता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली रखी गई है। ‘वैभव,’ ‘राजमुकुट,’ ‘प्रभु’ और ‘भुजा’ पद की काव्यात्मक तथा बाइबिलीय ऊँचाई बनाए रखते हैं; वाक्य-विन्यास फिर भी स्वाभाविक हिन्दी का है।
