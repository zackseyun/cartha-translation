lexical_decisions:
- source_word: ἰδόντες
  choice: उसे देखकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में कालसूचक रचना से व्यक्त किया गया है। कर्म ‘उसे’ यूनानी में स्पष्ट नहीं है, पर पिछले पद के धर्मी व्यक्ति से संदर्भानुसार ग्रहण किया गया है।
- source_word: ταραχθήσονται
  choice: वे ... व्याकुल हो उठेंगे
  rationale: भविष्यत् कर्मवाच्य का आशय भीतर तक विचलित हो जाने का है; ‘व्याकुल हो उठेंगे’ आधुनिक हिन्दी में इसकी तीव्रता और भावी अर्थ दोनों रखता है।
- source_word: φόβῳ δεινῷ
  choice: भयंकर भय से
  rationale: करण/कारण सूचक चतुर्थी को ‘से’ द्वारा व्यक्त किया गया है; ‘भयंकर’ δεινός की प्रबलता को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἐκστήσονται
  choice: चकित रह जाएँगे
  rationale: यहाँ ἐξίστημι अत्यधिक विस्मय को दर्शाता है, न कि शाब्दिक मानसिक विस्थापन को।
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: अनहोनी बात पर
  rationale: संज्ञा के रूप में प्रयुक्त παράδοξος ऐसी बात को सूचित करता है जो अपेक्षा के विपरीत और आश्चर्यजनक हो। ‘अनहोनी बात’ इस अकस्मात और अविश्वसनीय प्रतीत होने वाले पहलू को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: τῆς σωτηρίας
  choice: उसके उद्धार की
  rationale: σωτηρία के लिए ‘उद्धार’ धार्मिक तथा विपत्ति से छुड़ाए जाने—दोनों आयामों को रखता है। ‘उसके’ पिछले पद के धर्मी व्यक्ति से संदर्भानुसार जोड़ा गया है।
