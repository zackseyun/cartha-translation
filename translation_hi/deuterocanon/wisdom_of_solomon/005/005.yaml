- source_word: κλῆρος
  choice: भाग
  rationale: κλῆρος चिट्ठी द्वारा मिले नियत हिस्से, और विस्तार से किसी के ठहराए हुए भाग या स्थान को दर्शाता है। ‘भाग’ हिन्दी में इस रूपक और आशय दोनों को संक्षेप में रखता है।
- source_word: αὐτοῦ ἐστιν
  choice: उसका भाग ... है
