base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: hi
  text: वे आपस में कहेंगे[a], पश्चाताप करते हुए और मन की व्यथा के कारण कराहते हुए, “यह वही है जिसे हमने कभी उपहास का पात्र समझा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मन में कहेंगे।”
    reason: ἐν ἑαυτοῖς सामूहिक परस्पर कथन अथवा आंतरिक आत्म-संवाद, दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: ἐροῦσιν
  choice: कहेंगे
  rationale: λέγω का भविष्यत् सक्रिय रूप है; हिन्दी में ‘कहेंगे’ भविष्यकालीन कथन को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: वाक्यांश सामूहिक रूप से परस्पर कहने या अपने भीतर विचारने—दोनों की छाया रख सकता है। प्रत्यक्ष कथन के बहुवचन संदर्भ में ‘आपस में’ सामूहिक पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετανοοῦντες
  choice: मन फिराकर
  rationale: वर्तमान कृदन्त वक्ताओं की बोलते समय की अवस्था बताता है। ‘मन फिराकर’ नैतिक विचार-परिवर्तन का बल बनाए रखता है, पर उद्धारकारी पश्चात्ताप का परिणाम आरोपित नहीं करता।
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: मन की व्यथा के कारण
  rationale: στενοχωρία गहरी तंगी, संकट या व्यथा को और πνεῦμα यहाँ आंतरिक मनोदशा को सूचित करता है। यह चयन आधुनिक हिन्दी में सहज रहते हुए भी आंतरिक पीड़ा की तीव्रता बनाए रखता है।
- source_word: στενάξονται
  choice: कराहेंगे
  rationale: στενάζω श्रव्य और तीव्र पीड़ा की अभिव्यक्ति है; ‘कराहेंगे’ साधारण ‘आह भरेंगे’ की अपेक्षा इस तीव्रता को बेहतर व्यक्त करता है।
- source_word: Οὗτος ἦν
  choice: यह वही है
  rationale: पूर्व में तिरस्कृत व्यक्ति की अब पहचान कराते हुए हिन्दी का स्वाभाविक परिचयात्मक रूप है; आगे का भूतकालीन संबंध पूर्व व्यवहार को स्पष्ट करता है।
- source_word: ὃν ἔσχομέν ποτε εἰς γέλωτα
  choice: जिसे हमने कभी उपहास का पात्र समझा था
  rationale: ἔχω εἰς γέλωτα किसी को हँसी या उपहास की वस्तु मानने का अर्थ देता है। ‘उपहास का पात्र समझा था’ मूल्यांकन और तिरस्कार दोनों को स्पष्ट, गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: दुष्टों के कथन में μετανοοῦντες का बल
  choice: मन फिराकर
  alternative: पछताते हुए / खेद करते हुए
  rationale: यूनानी पद नैतिक दृष्टिकोण के परिवर्तन को व्यक्त करता है, जबकि प्रसंग अंतिम पहचान का है और इस मन-परिवर्तन के उद्धारकारी परिणाम को नहीं बताता। ‘मन फिराकर’ इसी धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘मन फिराकर’ और ‘मन की व्यथा’ धार्मिक तथा आंतरिक अर्थ बनाए रखते हैं, जबकि ‘उपहास का पात्र’ तिरस्कार को स्पष्ट करता है।
