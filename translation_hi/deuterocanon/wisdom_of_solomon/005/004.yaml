translation:
  language: hi
  text: और निन्दा की कहावत[a] के रूप में। हम मूर्खों ने उसके जीवन को पागलपन और उसके अन्त को सम्मानहीन[b] समझा था;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निन्दा का विषय बनने वाली कहावत।” यूनानी शब्द किसी प्रचलित कहावत या तिरस्कार के सार्वजनिक विषय का भाव दे सकता है; यहाँ इसका अर्थ केवल ‘दृष्टान्त’ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी मृत्यु को सम्मानहीन।” ‘अन्त’ के लिए प्रयुक्त यूनानी शब्द यहाँ विशेष रूप से उसकी मृत्यु और उसके ढंग की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραβολήν
  choice: कहावत
  rationale: यहाँ शब्द का अर्थ संकीर्ण अर्थ में ‘दृष्टान्त’ नहीं, बल्कि किसी व्यक्ति को तिरस्कार से याद करने वाली प्रचलित उक्ति या उपनाम-जैसी कहावत है। ‘कहावत’ इस सार्वजनिक, कहावत-सदृश भाव को सहज हिन्दी में रखता है।
- source_word: ὀνειδισμοῦ
  choice: निन्दा की
  rationale: यह संबंधकारक रूप ऐसी कहावत को बताता है जिसमें तिरस्कार, लांछन और अपमान का भाव है। ‘निन्दा की’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: οἱ ἄφρονες
  choice: हम मूर्खों ने
  rationale: यह पद प्रथम पुरुष बहुवचन बोलने वालों की पहचान कराता है। ‘हम मूर्खों ने’ इसे दुष्टों की अपनी पिछली भूल स्वीकार करने वाली वाणी के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλογισάμεθα
  choice: समझा था
  rationale: क्रिया सोच-विचार से किए गए मूल्यांकन या निर्णय को दर्शाती है। ‘समझा था’ हिन्दी में स्वाभाविक है और पीछे मुड़कर किए जा रहे स्वीकारोक्ति-सदृश कथन को स्पष्ट करता है।
- source_word: βίον
  choice: जीवन
  rationale: यहाँ शब्द उस धर्मी व्यक्ति के जिए हुए जीवन या जीवन-क्रम को सूचित करता है। संक्षिप्त ‘जीवन’ मूल की व्यापकता बनाए रखता है।
- source_word: μανίαν
  choice: पागलपन
  rationale: यूनानी शब्द उन्माद या पागलपन का प्रबल भाव रखता है। ‘पागलपन’ बोलने वालों के पूर्व तिरस्कारपूर्ण निर्णय की तीव्रता सुरक्षित रखता है।
- source_word: τελευτήν
  choice: अन्त
  rationale: शब्द सामान्यतः अन्त और विशेषतः मृत्यु, दोनों का संकेत दे सकता है। ‘अन्त’ मूल की अर्थगत व्यापकता को बनाए रखता है, जबकि प्रसंग में मृत्यु का संकेत भी स्वाभाविक रूप से उपस्थित है।
- source_word: ἄτιμον
  choice: अपमानजनक
  rationale: यह विशेषण सम्मान से रहित या अनादृत माने गए अन्त को व्यक्त करता है। ‘अपमानजनक’ आधुनिक हिन्दी में स्पष्ट है और बोलने वालों के मूल्यांकन को सामने रखता है।
theological_decisions:
- issue: स्वीकारोक्ति खंड में वक्ताओं की पहचान
  choice: पद को अधर्मियों/मूर्खों की अपनी पिछली धारणा स्वीकार करने वाली वाणी के रूप में प्रस्तुत किया गया है।
  alternative: इसे मूर्खों के विषय में कथावाचक का अलग, तटस्थ कथन माना जा सकता था।
  rationale: प्रथम पुरुष बहुवचन ἐλογισάμεθα और अध्याय का व्यापक प्रसंग पीछे मुड़कर बोलते दुष्टों की स्वीकारोक्ति दिखाते हैं। इसलिए οἱ ἄφρονες को ‘हम मूर्खों ने’ किया गया है।
- issue: τελευτήν में अन्त और मृत्यु का संबंध
  choice: मुख्य पाठ में ‘अन्त’ रखा गया है।
  alternative: ‘मृत्यु’ अनुवाद किया जा सकता है।
  rationale: मूल शब्द दोनों अर्थों की संभावना रखता है। मुख्य पाठ व्यापक शब्द रखता है और पादटिप्पणी मृत्यु-संबंधी विशिष्ट अर्थ बताती है, जिससे मूल की अर्थगत तनाव और अस्पष्टता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद यूनानी पाठ में पिछले वाक्य से जुड़ा हुआ आरम्भ होता है; इसलिए शुरुआती खंड की अपूर्णता को अनावश्यक शब्द जोड़कर पूरी तरह नहीं मिटाया गया। ‘हम मूर्खों ने’ वक्ताओं की आत्मपहचान को स्वाभाविक हिन्दी में स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
