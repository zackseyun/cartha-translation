  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: hi
  text: या उस पक्षी के समान जो हवा में से उड़ता चला जाता है—उसके मार्ग का कोई प्रमाण नहीं मिलता[a]। उसके पंखों के प्रहार से मानो कोड़े खाती और फड़फड़ाते पंखों की तीव्र सनसनाहट से बलपूर्वक चिरी हुई हल्की हवा[b] को वह पार कर जाता है, और उसके बाद उसमें उसके गुज़रने का कोई चिह्न नहीं मिलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके मार्ग का कोई निशान’ भी सम्भव है; यूनानी पद मार्ग के बचे हुए प्रत्यक्ष प्रमाण या पहचान पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हल्की हवा’ के लिए प्रयुक्त यूनानी पद का अर्थ ‘हल्का वायु-प्रवाह’ या ‘मंद समीर’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  choice: उस पक्षी के समान जो हवा में उड़ता चला जाता है
  rationale: यह पदबंध हवा के आर-पार उड़ते एक सामान्य पक्षी का चित्र देता है। ‘उड़ता चला जाता है’ गति और मार्ग दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τεκμήριον πορείας
  choice: उसके मार्ग का कोई प्रमाण
  rationale: τεκμήριον केवल सामान्य चिह्न नहीं, बल्कि किसी बात को प्रमाणित करने वाला संकेत है; πορεία यहाँ तय किए गए मार्ग को दर्शाता है।
- source_word: πληγῇ ... ταρσῶν
  choice: उसके पंखों के प्रहार से
  rationale: πληγή का प्रहारात्मक बल सुरक्षित रहता है। ταρσοί पंखों के उड़ान में प्रयुक्त सपाट भाग को सूचित कर सकता है, पर सामान्य हिन्दी में ‘पंख’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: μαστιζόμενον ... πνεῦμα κοῦφον
  choice: हल्की हवा कोड़े-सी पड़ती है
  rationale: मूल का सजीव रूपक बनाए रखा गया है, जिसमें हल्की हवा को पंखों के प्रहार से मानो कोड़े पड़ते हैं। πνεῦμα को इस भौतिक प्रसंग में ‘हवा’ किया गया है।
- source_word: σχιζόμενον βίᾳ ῥοιζῷ, κινουμένων πτερύγων
  choice: फड़फड़ाते पंखों की सनसनाहट के वेग से चीर दी जाती है
  rationale: σχίζω का ‘चीरना’, βίᾳ का बल/वेग और ῥοιζός की तेज़ सरसराती या सनसनाती ध्वनि इस अभिव्यक्ति में साथ रखी गई है।
- source_word: διωδεύθη
  choice: पक्षी उसमें से निकल जाता है
  rationale: यूनानी निष्क्रिय रचना का आशय हवा के पार किए जाने से है। हिन्दी में कर्ता स्पष्ट करके कहना अधिक स्वाभाविक है और अर्थ नहीं बदलता।
- source_word: σημεῖον ἐπιβάσεως
  choice: उसके गुज़रने का कोई चिह्न
  rationale: σημεῖον को ‘चिह्न’ और ἐπίβασις को प्रसंगानुसार ‘गुज़रना’ किया गया है, जिससे पहले खंड की समानांतरता भी बनी रहती है।
