lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में उन लोगों को दर्शाता है जिनका चरित्र धार्मिकता से पहचाना जाता है; ‘धर्मी’ स्वाभाविक और प्रतिष्ठित हिन्दी है।
- source_word: εἰς τὸν αἰῶνα ζῶσιν
  choice: सदा जीवित रहते हैं
  rationale: यह पदबंध निरन्तर और अनन्त जीवन व्यक्त करता है; हिन्दी में ‘सदा जीवित रहते हैं’ मूल के वर्तमानकालीन कथन और कालावधि दोनों को स्पष्ट रखता है।
- source_word: ἐν Κυρίῳ ὁ μισθὸς αὐτῶν
  choice: उनका प्रतिफल प्रभु के पास है
  rationale: μισθός के लिए ‘प्रतिफल’ इस ज्ञान-साहित्यिक प्रसंग में उचित है। ἐν का मूल अर्थ ‘में’ है, पर यहाँ समानान्तर παρὰ Ὑψίστῳ के कारण प्रभु की उपस्थिति अथवा संरक्षण का भाव ‘प्रभु के पास’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἡ φροντὶς αὐτῶν
  choice: उनकी सुधि
  rationale: φροντίς में चिंता, देखभाल और हित का अर्थ-क्षेत्र है। ‘उनकी सुधि’ संक्षिप्त रहते हुए यह भाव रखता है कि परमप्रधान उनका ध्यान और देखभाल करता है, बिना मूल की संक्षिप्तता को अनावश्यक विस्तार दिए।
- source_word: παρὰ Ὑψίστῳ
  choice: परमप्रधान के पास
  rationale: παρά के साथ सम्प्रदान कारक निकटता या उपस्थिति बताता है; ‘के पास’ पूर्ववर्ती खंड के साथ समानान्तरता बनाए रखता है।
theological_decisions:
- issue: ἡ φροντὶς αὐτῶν का अभिप्राय
  choice: उनकी सुधि परमप्रधान के पास है
  alternative: परमप्रधान उनकी सुधि लेता है; उनका कल्याण परमप्रधान के हाथ में है
  rationale: यूनानी पद संक्षिप्त और अर्थ-विस्तार वाला है। मुख्य पाठ में ‘उनकी सुधि’ परमप्रधान की देखभाल का स्वाभाविक संकेत देता है, जबकि पादटिप्पणी निकटवर्ती वैकल्पिक अर्थों को सुरक्षित रखती है।
- issue: ἐν Κυρίῳ का अनुवाद
  choice: प्रभु के पास
  alternative: प्रभु में
  rationale: शाब्दिक ‘प्रभु में’ सम्भव है, किन्तु इस वाक्य में वह अनपेक्षित रहस्यवादी अर्थ दे सकता है। ‘प्रभु के पास’ प्रतिफल के उसकी उपस्थिति या संरक्षण में होने का भाव तथा अगले खंड की समानान्तरता रखता है।
