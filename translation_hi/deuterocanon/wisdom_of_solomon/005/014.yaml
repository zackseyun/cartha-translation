base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: hi
  text: क्योंकि भक्तिहीन की आशा हवा से उड़ते महीन रोएँ के समान है, आँधी से उड़ा दिए गए पतले पाले के समान, और हवा से बिखर गए धुएँ के समान; वह एक ही दिन ठहरने वाले यात्री की याद[a] की तरह गुज़र जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही दिन ठहरने वाले मुसाफिर का उल्लेख।” यूनानी शब्द καταλύτης अस्थायी रूप से ठहरने वाले व्यक्ति को दर्शाता है, और μνεία का अर्थ “याद” या “उल्लेख” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπὶς
  choice: आशा
  rationale: यह सामान्य और प्रसंगानुकूल हिन्दी शब्द है, जो आशा तथा भविष्य की अपेक्षा—दोनों की छाया रख सकता है।
- source_word: ἀσεβοῦς
  choice: भक्तिहीन की
  rationale: यह केवल सामान्य दुष्टता के बजाय परमेश्वर के प्रति श्रद्धा के अभाव को व्यक्त करता है, जो यूनानी शब्द की ईश्वर-संबंधी नैतिक दिशा को सुरक्षित रखता है।
- source_word: χνοῦς
  choice: महीन रोआँ
  rationale: शब्द भूसी के सामान्य अर्थ के बजाय बहुत हलके रोएँ या फुज्जी का बोध कराता है; यह हवा में आसानी से उड़ जाने वाली वस्तु का चित्र बनाए रखता है।
- source_word: πάχνη … λεπτὴ
  choice: पतला पाला
  rationale: πάχνη पाले को और λεπτὴ उसकी महीनता या पतलेपन को व्यक्त करता है।
- source_word: λαίλαπος
  choice: आँधी
  rationale: यह प्रचंड तूफ़ानी हवा या झंझा का बोध कराता है; ‘आँधी’ आधुनिक हिन्दी में इस बलपूर्ण चित्र को सहजता से व्यक्त करती है।
- source_word: διεχύθη
  choice: बिखर गए
  rationale: धुएँ के प्रसंग में क्रिया का भाव फैलकर तितर-बितर हो जाने का है, न कि शाब्दिक रूप से उँडेल दिए जाने का।
- source_word: μνεία
  choice: याद
  rationale: μνεία का अर्थ ‘स्मरण’ या ‘उल्लेख’ हो सकता है; यहाँ क्षणभंगुर स्मृति का उपमान अधिक स्वाभाविक है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: καταλύτου μονοημέρου
  choice: एक ही दिन ठहरने वाले यात्री
  rationale: καταλύτης अस्थायी रूप से ठहरने वाले व्यक्ति को और μονοήμερος केवल एक दिन की अवधि को दर्शाता है; यह अनुवाद दोनों तत्वों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: παρῴδευσεν
  choice: गुज़र जाती है
  rationale: क्रिया का मूल चित्र पास होकर निकल जाने का है; हिन्दी में यह स्मृति की क्षणभंगुरता भी स्वाभाविक रूप से व्यक्त करता है।
