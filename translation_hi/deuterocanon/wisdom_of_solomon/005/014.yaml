- issue: ἀσεβοῦς का अनुवाद
  choice: भक्तिहीन
  alternative: दुष्ट; अधर्मी
  rationale: ‘भक्तिहीन’ परमेश्वर के प्रति श्रद्धा के अभाव को सामने रखता है, जबकि ‘दुष्ट’ अर्थ को सामान्य नैतिक बुराई तक सीमित कर सकता है। फिर भी इससे कोई विशिष्ट सांप्रदायिक अर्थ नहीं जोड़ा गया है।
