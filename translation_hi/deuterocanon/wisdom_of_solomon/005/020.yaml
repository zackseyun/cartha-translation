base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: hi
  text: वह प्रचण्ड क्रोध को तलवार के रूप में धार देगा, और जगत उसके साथ मिलकर विवेकहीनों[a] के विरुद्ध युद्ध करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विवेकहीनों’ का अनुवाद ‘बुद्धिहीनों’ या ‘मूर्खों’ के रूप में भी हो सकता है। यूनानी शब्द यहाँ परमेश्वर का विरोध करनेवालों की तर्कहीन या नैतिक रूप से विकृत दशा बताता है; यह आवश्यक रूप से किसी चिकित्सकीय मानसिक रोग का उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: धार देगा
  rationale: भविष्यत् सक्रिय क्रिया का मूल अर्थ ‘तेज़ करना/धार देना’ है; यह शस्त्र-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπότομον ὀργὴν
  choice: प्रचण्ड क्रोध
  rationale: ἀπότομον यहाँ क्रोध की कठोर और उग्र तीव्रता बताता है। ‘प्रचण्ड’ गरिमापूर्ण और सहज है, जबकि अस्वाभाविक ‘तीखा क्रोध’ से बचाता है।
- source_word: εἰς ῥομφαίαν
  choice: तलवार के समान
  rationale: εἰς यहाँ परिणति अथवा प्रयोजन का भाव दे सकता है। हिन्दी में ‘तलवार के समान धार देगा’ रूपक को स्पष्ट रखता है, यद्यपि शाब्दिक विकल्प ‘तलवार बना देगा’ है।
- source_word: συνεκπολεμήσει
  choice: साथ मिलकर ... युद्ध करेगा
  rationale: संयुक्त क्रिया किसी के साथ युद्ध में सम्मिलित होने का अर्थ देती है; यह सहयोगी युद्ध का भाव सुरक्षित रखती है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: κόσμος यहाँ व्यवस्थित जगत अथवा सृष्टि को सूचित करता है। ‘संसार’ सीधा और पठनीय है तथा व्यापक सृष्टिगत संकेत को खुला रखता है।
- source_word: ἐπὶ τοὺς παράφρονας
  choice: विवेकहीनों के विरुद्ध
  rationale: παράφρονας तर्कहीन या नैतिक रूप से बुद्धिभ्रष्ट विरोधियों को सूचित करता है। ‘विवेकहीन’ नैतिक-अविवेकी अर्थ को व्यक्त करता है और चिकित्सकीय मानसिक रोग का अनचाहा संकेत नहीं देता।
theological_decisions:
- issue: αὐτῷ (‘उसके साथ’) का संदर्भ
  choice: सर्वनाम ‘उसके’ को बनाए रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर के साथ’ कहना
  rationale: प्रसंग में संकेत परमेश्वर की ओर है, जिसके न्याय में सृष्टि युद्ध करती है; पर यूनानी पद में नाम स्पष्ट नहीं है। इसलिए सर्वनाम रखकर मूल की संदर्भगत अस्पष्टता सुरक्षित की गई।
- issue: क्रोध का तलवार में रूपांतरण
  choice: ‘तलवार के समान धार देगा’
  alternative: ‘तलवार बना देगा’
  rationale: मूल में εἰς परिणति का प्रबल चित्र दे सकता है। चुना हुआ हिन्दी रूप धार देने की क्रिया और युद्ध-रूपक दोनों को स्वाभाविक ढंग से रखता है, बिना यह तय किए कि क्रोध स्वयं अक्षरशः तलवार बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण युद्ध और न्याय संबंधी शैली रखी गई है। ‘प्रचण्ड क्रोध’, ‘धार देगा’ और ‘युद्ध करेगा’ साधारण पाठक के लिए स्पष्ट हैं; सर्वनाम की मूल अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
