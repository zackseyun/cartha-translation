  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/012.yaml
  text: 'or like an arrow shot at a target: the air[a], once cut through, immediately closed up on itself, so that its path could not be known.'
translation:
  language: hi
  text: या जैसे निशाने पर चलाए गए तीर से हवा चिर जाती है, पर तुरंत फिर एक हो जाती है, इसलिए तीर के मार्ग[a] का पता नहीं चलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तीर के गुजरने की राह’।
    reason: δίοδος मार्ग, राह या किसी वस्तु के गुजरने के रास्ते को दर्शा सकता है।
lexical_decisions:
- source_word: βέλους βληθέντος
  choice: चलाए गए तीर
  rationale: βέλος यहाँ धनुष से छोड़े जाने वाले तीर को दर्शाता है और βάλλω का कृदन्त उसके निशाने की ओर चलाए जाने का भाव देता है।
- source_word: ἐπὶ σκοπόν
  choice: निशाने पर
  rationale: σκοπός इस धनुर्विद्या-संबंधी उपमा में उस वस्तु को दर्शाता है जिस पर तीर साधा और चलाया जाता है।
- source_word: τμηθεὶς ὁ ἀήρ
  choice: हवा चिर जाती है
  rationale: यूनानी पदबंध तीर के गुजरने पर हवा के विभाजित होने का सजीव चित्र प्रस्तुत करता है; ‘चिर जाती है’ आधुनिक हिन्दी में इस चित्र को स्वाभाविक रूप से बनाए रखता है।
- source_word: εὐθέως εἰς ἑαυτὸν ἀνελύθη
  choice: तुरंत फिर एक हो जाती है
  rationale: शाब्दिक रूप से हवा के ‘अपने में वापस’ मिल जाने का भाव है। सन्दर्भ में विभाजित हवा का तत्काल पुनः मिलना अभिप्रेत है।
- source_word: ὡς ἀγνοῆσαι τὴν δίοδον αὐτοῦ
  choice: इसलिए तीर के मार्ग का पता नहीं चलता
  rationale: ὡς के साथ infinitive परिणाम प्रकट करता है। αὐτοῦ का स्वाभाविक पूर्वपद तीर है, और δίοδος उसके गुजरने के मार्ग या राह को दर्शाता है।
