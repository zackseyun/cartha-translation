  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
translation:
  language: hi
  text: फिर, समय बीतने के साथ[a] वह अधर्मी प्रथा दृढ़ हो गई और उसका कानून की तरह पालन किया गया; और निरंकुश शासकों के आदेशों से तराशी हुई प्रतिमाओं[b] की उपासना की जाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समय के साथ’। यूनानी पदबंध धीरे-धीरे हुए विकास को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तराशी हुई वस्तुएँ’; अर्थात तराशी या उत्कीर्ण की गई प्रतिमाएँ।
    reason: lexical_clarification
lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: फिर समय बीतने के साथ
  rationale: यह पदबंध पिछले विचार से क्रम जोड़ते हुए धीरे-धीरे हुए विकास को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: κρατυνθὲν
  choice: दृढ़ होती गई
  rationale: κρατύνω के निष्क्रिय कृदन्त में समय के साथ प्रथा के मजबूत या स्थापित हो जाने का भाव है; यह चयन उस क्रमिक विकास को बनाए रखता है।
- source_word: τὸ ἀσεβὲς ἔθος
  choice: वह अधर्मी प्रथा
  rationale: ἀσεβής का धार्मिक और नैतिक नकारात्मक भाव ‘अधर्मी’ में बना रहता है, और ἔθος के लिए ‘प्रथा’ सहज तथा सटीक है।
- source_word: ὡς νόμος ἐφυλάχθη
  choice: कानून की तरह उसका पालन किया जाने लगा
  rationale: φυλάσσω यहाँ पालन या अनुपालन करने के अर्थ में है, जबकि ὡς νόμος बताता है कि प्रथा को कानून जैसा बल दिया गया था।
- source_word: τυράννων ἐπιταγαῖς
  choice: निरंकुश शासकों के आदेशों से
  rationale: τύραννος को केवल तटस्थ ‘शासक’ कहने के बजाय ‘निरंकुश शासक’ मूल के आलोचनात्मक भाव को स्पष्ट और आधुनिक हिन्दी में रखता है; ἐπιταγαί आदेश हैं।
- source_word: ἐθρησκεύετο
  choice: उपासना की जाने लगी
  rationale: क्रिया धार्मिक आराधना या उपासना को सूचित करती है; मूर्तिपूजा के संदर्भ में ‘उपासना’ सीधा और गरिमापूर्ण चयन है।
- source_word: τὰ γλυπτά
  choice: खुदी हुई प्रतिमाएँ
  rationale: मूल शब्द तराशी या खोदी गई वस्तुओं पर बल देता है। ‘खुदी हुई प्रतिमाएँ’ इस भौतिक विशेषता को बचाता है और ‘मूर्तियाँ’ जैसे अधिक व्याख्यात्मक संक्षेप से बचता है।
theological_decisions:
- issue: τυράννων को तटस्थ ‘शासकों’ के रूप में दिया जाए या उसके नकारात्मक मूल्यांकन को बनाए रखा जाए
  choice: निरंकुश शासकों
  alternative: शासकों; अत्याचारी शासकों
  rationale: संदर्भ में राजनीतिक शक्ति द्वारा उपासना थोपे जाने की आलोचना है। ‘निरंकुश शासक’ मूल की मूल्यांकनात्मक धार बनाए रखता है, पर ऐसा अत्याचार नहीं जोड़ता जिसे पद सीधे नहीं कहता।
- issue: τὰ γλυπτά का अर्थ सीधे ‘मूर्तियाँ’ लगाया जाए या उसके खुदे/तराशे होने को व्यक्त किया जाए
  choice: खुदी हुई प्रतिमाएँ
  alternative: मूर्तियाँ; गढ़ी हुई प्रतिमाएँ
  rationale: मूल यूनानी निर्मित और खुदी हुई वस्तुओं पर बल देता है। उपासना की क्रिया से उनका मूर्तिपूजक उपयोग स्पष्ट हो जाता है, इसलिए संज्ञा में अतिरिक्त धार्मिक व्याख्या आवश्यक नहीं है।
- issue: ὡς νόμος को वास्तविक विधि या कानून-जैसी मान्यता के रूप में व्यक्त किया जाए
  choice: कानून की तरह
  alternative: कानून मानकर; कानून के रूप में
  rationale: ὡς तुलना या माने-जाने का भाव रख सकता है। ‘कानून की तरह’ इस संभावना को खुला रखता है कि प्रथा को औपचारिक कानून बनाए बिना कानून जैसा अधिकार मिला था।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। निष्क्रिय वाक्य-विन्यास मूल यूनानी में प्रथा के स्थापित किए जाने और प्रतिमाओं की उपासना कराए जाने के भाव को बनाए रखता है।
