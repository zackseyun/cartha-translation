translation:
  language: hi
  text: फिर, समुद्री यात्रा पर निकलने की तैयारी करता हुआ और प्रचंड लहरों को पार करने के लिए तैयार कोई मनुष्य, उस जहाज़ से भी अधिक कमज़ोर लकड़ी के एक टुकड़े पर चढ़ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस जहाज़ से भी अधिक सड़ी हुई लकड़ी के एक टुकड़े पर।” यूनानी तुलनात्मक शब्द सामान्य भौतिक असुदृढ़ता या भंगुरता के साथ-साथ सड़न का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενος
  choice: समुद्री यात्रा पर निकलने की तैयारी करते हुए
  rationale: समुद्री प्रसंग में यह मध्यम कृदंत स्वयं को यात्रा के लिए तैयार करने या निकल पड़ने का भाव देता है; हिन्दी में समुद्री आशय स्पष्ट करना स्वाभाविक है।
