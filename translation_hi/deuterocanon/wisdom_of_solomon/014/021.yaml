  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: hi
  text: और यह जीवन के विरुद्ध घात बन गया, क्योंकि विपत्ति या निरंकुश शासन के दास बनकर लोगों ने वह नाम, जो साझा नहीं किया जा सकता,[a] पत्थरों और लकड़ी को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह असाझा नाम।” इसका संकेत उस दिव्य नाम या सम्मान की ओर हो सकता है जो मूर्तियों को नहीं दिया जाना चाहिए।
    reason: ‘साझा नहीं किया जा सकता’ ἀκοινώνητον का निकट अर्थ है; वैकल्पिक पदबंध उसकी संक्षिप्त शब्दार्थ-छटा दिखाता है और संदर्भगत संकेत को अनिश्चित ही रखता है।
lexical_decisions:
- source_word: ἔνεδρον
  choice: घात
  rationale: यह शब्द छिपकर आक्रमण करने या घात लगाने का सजीव रूपक रखता है; ‘घात’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा जीवन के विरुद्ध बने खतरे को व्यक्त करता है।
- source_word: τῷ βίῳ
  choice: जीवन के लिए
  rationale: εἰς ἔνεδρον के साथ यह जीवन को लक्ष्य बनाने वाले घात का भाव देता है। हिन्दी में ‘जीवन के लिए घात’ इस शत्रुतापूर्ण संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συμφορᾷ
  choice: विपत्ति
  rationale: यह प्रतिकूल परिस्थिति, दुर्भाग्य या आपदा को सूचित करता है; ‘विपत्ति’ गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: τυραννίδι
  choice: निरंकुश शासन
  rationale: यह अत्याचारी और मनमाने प्रभुत्व का बोध कराता है। ‘निरंकुश शासन’ केवल किसी शासक की उपाधि के बजाय शासन-व्यवस्था की दमनकारी शक्ति स्पष्ट करता है।
- source_word: δουλεύσαντες
  choice: दासता में पड़कर
  rationale: कृदंत बाध्य अधीनता या गुलामी का भाव रखता है। यह अनुवाद ‘सेवा करने’ से अधिक प्रबल मूल अर्थ को बनाए रखता है।
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: वह नाम, जो किसी और को नहीं दिया जा सकता
  rationale: ἀκοινώνητον का मूल भाव ‘साझा न किया जाने वाला’ है। चुनी हुई अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए नाम की अनन्य विशिष्टता बनाए रखती है और उसे स्पष्ट रूप से किसी निजी doctrinal व्याख्या से नहीं बाँधती।
- source_word: λίθοις καὶ ξύλοις
  choice: पत्थरों और लकड़ी को
  rationale: दत्तिव के साथ यह उन पदार्थों को सूचित करता है जिन पर नाम आरोपित या प्रदान किया गया। अनुवाद मूर्तियों को स्पष्ट रूप से जोड़कर मूल से आगे नहीं जाता।
- source_word: περιέθεσαν
  choice: दे दिया
  rationale: संदर्भ में क्रिया किसी नाम या सम्मान को किसी पर रखने अथवा प्रदान करने का अर्थ देती है। ‘दे दिया’ हिन्दी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी संदर्भ में τὸ ἀκοινώνητον ὄνομα का अर्थ
  choice: वह नाम, जो किसी और को नहीं दिया जा सकता
  alternative: वह असाझा नाम / वह नाम जिसे साझा नहीं किया जा सकता
  rationale: वाक्यांश संभवतः परमेश्वर के अनन्य नाम या सम्मान की ओर संकेत करता है, पर मूल पाठ इसे सीधे नहीं खोलता। मुख्य पाठ विशिष्टता को सुरक्षित रखता है और पादटिप्पणी संभावित आशय बताती है, बिना अस्पष्टता को सिद्धांतात्मक विस्तार से समाप्त किए।
