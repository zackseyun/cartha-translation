lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: समान रूप से
  rationale: यह यूनानी मुहावरा समान स्तर या समान मात्रा का भाव देता है; ‘समान रूप से’ सहज और सटीक है।
- source_word: μισητά
  choice: घृणित
  rationale: यह कर्तृवाच्य क्रिया नहीं, बल्कि विधेय विशेषण है। ‘घृणित’ दोनों को परमेश्वर की घृणा के पात्र बताता है और मूल की विशेषणात्मक संरचना बनाए रखता है।
- source_word: θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: सम्बन्धवाचक चतुर्थी को स्वाभाविक हिन्दी में व्यक्त करता है। शाब्दिक ‘परमेश्वर के लिए’ की अपेक्षा यह अधिक सहज है, बिना अर्थ को ‘उसके द्वारा घृणा किए गए’ के कर्मवाच्य में बदलने के।
- source_word: ὁ ἀσεβῶν
  choice: भक्तिहीन मनुष्य
  rationale: संज्ञीकृत पुल्लिंग एकवचन कृदन्त ऐसे मनुष्य को सूचित करता है जिसका आचरण भक्ति-विरुद्ध है। यह रूप स्रोत के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: उसकी भक्तिहीनता
  rationale: ‘भक्तिहीनता’ पूर्ववर्ती ‘भक्तिहीन’ से शब्दगत सम्बन्ध बनाए रखती है, और ‘उसकी’ αὐτοῦ का स्पष्ट सम्बन्ध उसी मनुष्य से जोड़ता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: मूल के व्याख्यात्मक अथवा कारणसूचक संयोजक को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की घृणा भक्तिहीन मनुष्य और उसकी भक्तिहीनता—दोनों की ओर निर्देशित है
  choice: दोनों को समान रूप से परमेश्वर की दृष्टि में घृणित कहा गया है।
  alternative: केवल भक्तिहीनता को घृणित बताना, या कथन को केवल नैतिक समानता तक सीमित करना।
  rationale: यूनानी पाठ ὁ ἀσεβῶν और ἡ ἀσέβεια αὐτοῦ दोनों को एक ही विधेय μισητά θεῷ के अधीन रखता है। अनुवाद इस तनाव को न तो नरम करता है, न इसे पद से परे विस्तृत सिद्धान्त में बदलता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘भक्तिहीन/भक्तिहीनता’ द्वारा यूनानी मूल के सजातीय शब्दों का सम्बन्ध सुरक्षित रखा गया है। दीर्घ विराम-चिह्न दोनों समान पदों पर बल देता है।
