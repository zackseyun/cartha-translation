translation:
  language: hi
  text: परन्तु इन दोनों बातों के लिए उन्हें न्यायोचित दंड मिलेगा, क्योंकि उन्होंने मूर्तियों पर ध्यान लगाकर ईश्वर के विषय में गलत विचार किया, और पवित्रता का तिरस्कार करके छल से अन्यायपूर्ण शपथ खाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφότερα
  choice: दोनों ही बातों में
  rationale: नपुंसकलिंग बहुवचन यहाँ निकट संदर्भ में बताए गए दो अपराधों—ईश्वर के विषय में गलत विचार और अन्यायपूर्ण शपथ—की ओर संकेत करता है। यह हिंदी में द्विविध आधार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετελεύσεται τὰ δίκαια
  choice: न्याय ... उनका पीछा करेगा
  rationale: क्रिया में दंडात्मक रूप से पीछे आने या आ घेरने का भाव है, जबकि τὰ δίκαια न्याय की माँगों अथवा न्यायोचित परिणामों को सामूहिक रूप से व्यक्त कर सकता है। 'न्याय' इस व्यापकता को बनाए रखता है।
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: ईश्वर के विषय में गलत विचार किया
  rationale: वाक्यांश ईश्वर के बारे में गलत समझ या निर्णय को व्यक्त करता है; केवल दुष्ट भावना को नहीं।
- source_word: προσχόντες εἰδώλοις
  choice: मूर्तियों की ओर मन लगाकर
  rationale: सहभागी क्रिया ध्यान देने, झुकने या लगाव रखने का भाव देती है। यह अनुवाद मूर्तियों की ओर मानसिक और धार्मिक उन्मुखता को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἀδίκως ὤμοσαν ἐν δόλῳ
  choice: छलपूर्वक अन्यायपूर्ण शपथ खाई
  rationale: ἀδίκως शपथ की नैतिक अन्यायपूर्णता और ἐν δόλῳ उसके छलपूर्ण ढंग को व्यक्त करता है; दोनों पहलुओं को अलग-अलग बनाए रखा गया है।
- source_word: καταφρονήσαντες ὁσιότητος
  choice: पवित्रता का तिरस्कार करके
  rationale: ὁσιότης पवित्रता, धर्मनिष्ठा या पवित्र बातों के प्रति श्रद्धा का अर्थ दे सकता है। 'पवित्रता' संक्षिप्त, गरिमापूर्ण और व्यापक है।
theological_decisions:
- issue: ἀμφότερα का संदर्भ और τὰ δίκαια का बल
  choice: '''दोनों ही बातों में'' को दो अपराधों का संकेत माना गया है, और ''न्याय'' को उनके न्यायोचित परिणामों की सक्रिय माँग के रूप में रखा गया है।'
  alternative: '''दोनों'' से पहले के प्रसंग में उल्लिखित दो वर्ग अभिप्रेत हो सकते हैं; τὰ δίκαια का अधिक स्पष्ट अनुवाद ''न्यायोचित दंड'' भी हो सकता है।'
  rationale: तत्काल वाक्य दो कारण बताता है, इसलिए दो अपराधों का संदर्भ अधिक संभावित है। फिर भी 'न्यायोचित दंड' कहने से यूनानी के व्यापक नैतिक-न्यायिक भाव को समय से पहले केवल दंड तक सीमित किया जा सकता है।
- issue: ὁσιότης का अर्थक्षेत्र
  choice: पवित्रता
  alternative: धर्मनिष्ठा; पवित्र बातों के प्रति श्रद्धा
  rationale: मूल शब्द पवित्र आचरण और पवित्र वस्तुओं के प्रति उचित श्रद्धा दोनों को समेट सकता है। मुख्य पाठ में व्यापक शब्द रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'ईश्वर', 'मूर्ति', 'शपथ' और 'पवित्रता' सामान्य धार्मिक शब्दावली हैं। वाक्य की न्यायिक गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ अभिव्यक्ति से बचा गया है।
