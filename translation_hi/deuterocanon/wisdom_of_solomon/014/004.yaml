  footnotes:
  - marker: a
    text: या, “हर चीज़ से।” यूनानी अभिव्यक्ति निकटवर्ती समुद्री प्रसंग से अधिक व्यापक है; “हर संकट से” यहाँ समुद्र में आने वाले खतरे का प्रसंगगत भाव सामने लाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “किसी व्यावहारिक अथवा तकनीकी कौशल के बिना भी।” प्रसंग के अनुसार यहाँ विशेष रूप से नौकायन-कौशल अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεικνὺς
