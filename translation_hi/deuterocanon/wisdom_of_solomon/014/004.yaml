- source_word: δύνασαι
  choice: आप ... सकते हैं
  rationale: यह परमेश्वर की सामर्थ्य को सीधे व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐκ παντὸς
  choice: हर संकट से
  rationale: शाब्दिक अर्थ ‘हर वस्तु/हर बात से’ व्यापक है; समुद्री यात्रा के प्रसंग में ‘हर संकट से’ तत्काल आशय को स्पष्ट करता है, जबकि पादटिप्पणी व्यापकता सुरक्षित रखती है।
- source_word: σώζειν
  choice: बचा सकते हैं
  rationale: ‘बचाना’ शारीरिक उद्धार के समुद्री प्रसंग में स्वाभाविक है और मूल क्रिया के उद्धार-संबंधी अर्थ को भी बनाए रखता है।
- source_word: ἵνα κἂν
  choice: ताकि ... न होने पर भी
  rationale: यह ἵνα के प्रयोजन और κἂν के बलयुक्त रियायती भाव—‘भले ही’—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἄνευ τέχνης
  choice: नौकायन में कुशल न होने पर भी
  rationale: τέχνη व्यावहारिक कला या कौशल है; समुद्री प्रसंग में यह नौकायन-कौशल को इंगित करता है, पर व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τις
  choice: कोई व्यक्ति
  rationale: यह अनिश्चित एकवचन का स्वाभाविक और समावेशी हिन्दी रूप है।
- source_word: ἐπιβῇ
  choice: जहाज़ पर चढ़ सके
  rationale: समुद्री प्रसंग में क्रिया का अर्थ किसी जलयान पर सवार होना है; यह रूप ‘प्रस्थान करे’ की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: ἐκ παντὸς σώζειν में परमेश्वर की बचाने की सामर्थ्य का दायरा
  choice: हर संकट से बचा सकते हैं
  alternative: हर चीज़ से बचा सकते हैं
  rationale: मूल यूनानी अभिव्यक्ति व्यापक है, जबकि निकट प्रसंग समुद्री संकट का है। मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी मूल की व्यापकता को खुला रखती है; इस प्रकार कथन को केवल समुद्री खतरे तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संबोधन रखा गया है। वाक्य को पिछले पद से जुड़े यूनानी कृदन्त की नकल में खंडित रखने के बजाय ‘इस प्रकार आप दिखाते हैं’ से स्वाभाविक बनाया गया है। सभी व्याख्यात्मक विस्तार सीमित हैं और मूल की व्यापकता पादटिप्पणियों में सुरक्षित है।
