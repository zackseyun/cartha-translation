  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: hi
  text: वे अब न तो जीवन को शुद्ध रखते हैं, न विवाह को; बल्कि कोई घात लगाकर दूसरे को मार डालता है[a], या वैवाहिक संबंध को दूषित करके दूसरे को पीड़ा पहुँचाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छिपकर वार करके दूसरे को मार डालता है’—यूनानी शब्द घात में बैठने या छिपकर आक्रमण करने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘व्यभिचार करके दूसरे को दुःख पहुँचाता है’—यूनानी क्रिया किसी वस्तु को दूषित करने और इस प्रसंग में वैवाहिक निष्ठा तोड़ने का बोध दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: जीवन
  rationale: βίος जीवन, जीवन-ढंग या जीविका का अर्थ दे सकता है। यहाँ मूर्तिपूजा से उपजी नैतिक अव्यवस्था के संदर्भ में ‘जीवन’ व्यापक व्यक्तिगत और सामाजिक आचरण को समेटता है और अर्थ को अनावश्यक रूप से केवल जीविका तक सीमित नहीं करता।
- source_word: γάμους
  choice: विवाह
  rationale: γάμος विवाह, विवाह-संस्कार या विवाह-शय्या का बोध करा सकता है। φυλάσσουσιν और καθαρούς के साथ यहाँ वैवाहिक संबंधों को शुद्ध बनाए रखने की बात है; इसलिए ‘विवाह’ सहज और स्पष्ट है।
- source_word: καθαρούς
  choice: शुद्ध
  rationale: यह विशेषण नैतिक शुद्धता या निर्मलता व्यक्त करता है। ‘शुद्ध’ जीवन और विवाह दोनों के साथ स्वाभाविक है और प्रसंग के नैतिक अर्थ को बनाए रखता है।
- source_word: φυλάσσουσιν
  choice: रखते हैं
  rationale: φυλάσσω का अर्थ रक्षा करना, संभालना या बनाए रखना है। ‘शुद्ध रखते हैं’ आधुनिक हिन्दी में स्वाभाविक रूप से नैतिक अखंडता बनाए रखने का भाव देता है।
- source_word: λοχῶν
  choice: घात लगाकर
  rationale: यह कृदंत छिपकर प्रतीक्षा करने या घात लगाने का बोध देता है। ‘घात लगाकर’ गुप्त और योजनाबद्ध हमले की ठोस छवि को सीधे सुरक्षित रखता है।
- source_word: ἀναιρεῖ
  choice: मार डालता है
  rationale: ἀναιρέω यहाँ किसी का जीवन लेने या उसे समाप्त कर देने के अर्थ में है। ‘मार डालता है’ सीधा है और अनावश्यक कानूनी अर्थ नहीं जोड़ता।
- source_word: νοθεύων
  choice: वैवाहिक निष्ठा भंग करके
  rationale: νοθεύω मिलावट या भ्रष्ट करने और इस संदर्भ में विवाह की निष्ठा तोड़ने का अर्थ दे सकता है। यह चयन निकटवर्ती γάμους से संबंध स्पष्ट करता है, जबकि पाद-टिप्पणी में अधिक स्पष्ट ‘व्यभिचार’ विकल्प दिया गया है।
- source_word: ὀδυνᾷ
  choice: दुःख पहुँचाता है
  rationale: ὀδυνάω पीड़ा, वेदना या संताप पहुँचाने का अर्थ देता है। ‘दुःख पहुँचाता है’ संबंधपरक हानि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: βίους ... γάμους καθαρούς में शुद्धता का क्षेत्र
  choice: व्यक्तिगत-सामाजिक जीवन और वैवाहिक संबंध, दोनों को नैतिक रूप से शुद्ध बनाए रखना
  alternative: केवल शुद्ध जीविका और विधिसम्मत विवाह, अथवा जीवन और विवाह-संस्कार की अनुष्ठानिक शुद्धता
  rationale: आसपास का प्रसंग मूर्तिपूजा से उत्पन्न नैतिक अव्यवस्था की सूची देता है। इसलिए नैतिक अर्थ प्रमुख है; फिर भी ‘जीवन’ βίος के व्यापक अर्थ को खुला रखता है।
- issue: νοθεύων का वैवाहिक अर्थ
  choice: वैवाहिक निष्ठा भंग करना
  alternative: व्यभिचार करना, अथवा विवाह को भ्रष्ट करना
  rationale: γάμους के निकट होने से वैवाहिक विश्वासघात का अर्थ प्रबल है। मुख्य पाठ क्रिया के व्यापक ‘निष्ठा भंग’ भाव को रखता है और पाद-टिप्पणी अधिक स्पष्ट विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समांतर संरचना ‘न तो… न…’ मूल यूनानी के संतुलन को व्यक्त करती है। ‘घात लगाकर’ स्रोत की ठोस छवि बचाता है, जबकि ‘वैवाहिक निष्ठा भंग’ विवाह-संबंधी अर्थ को बिना संप्रदायगत विस्तार के स्पष्ट करता है।
