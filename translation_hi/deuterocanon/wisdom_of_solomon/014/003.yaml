  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/003.yaml
  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: hi
  text: परन्तु, हे पिता, आपकी दूरदर्शी देखभाल उसका संचालन करती है[a], क्योंकि आपने समुद्र में भी मार्ग और लहरों के बीच सुरक्षित पथ दिया।
  philosophy: optimal-equivalence
  footnotes:
