    text: या ‘उसकी पतवार सँभालती है’, ‘उसे दिशा देती है’ अथवा ‘उसका मार्गदर्शन करती है’; यूनानी क्रिया में जहाज़ को चलाने का समुद्री भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διακυβερνᾷ
  choice: उसका संचालन करती है
  rationale: यह क्रिया जहाज़ को खेने या उसका संचालन करने का समुद्री बिंब रखती है। हिन्दी में ‘संचालन करती है’ जहाज़ के संदर्भ में स्वाभाविक है और साथ ही मार्गदर्शन तथा शासन की व्यापक अर्थ-छाया भी बचाए रखती है।
- source_word: πρόνοια
  choice: दूरदर्शी देखभाल
  rationale: ग्रीक शब्द में पहले से विचार करने और सक्रिय रूप से देखभाल करने, दोनों का भाव है। ‘दूरदर्शी देखभाल’ सामान्य पाठक के लिए स्पष्ट है और केवल अमूर्त योजना या भाग्यवाद का संकेत नहीं देती।
- source_word: πάτερ
  choice: हे पिता
  rationale: यह परमेश्वर को किया गया सीधा संबोधन है। ‘हे पिता’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट संबोधन है।
- source_word: ἔδωκας
  choice: आपने ... दिया है
  rationale: मूल क्रिया का सीधा अर्थ ‘दिया’ है। हिन्दी का पूर्ण वर्तमान यहाँ परमेश्वर के किए कार्य और उसके बने हुए परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁδὸν
  choice: मार्ग
  rationale: समुद्र में दिए गए रास्ते के लिए ‘मार्ग’ स्वाभाविक है और बाइबलीय जल-मार्ग के बिंब को बनाए रखता है।
- source_word: τρίβον
  choice: पथ
  rationale: ‘पथ’ पहले आए ‘मार्ग’ से शब्दगत भेद रखते हुए यूनानी समानांतरता को सुरक्षित रखता है।
- source_word: ἀσφαλῆ
  choice: सुरक्षित
  rationale: यह संकट से मुक्त और भरोसेमंद पथ का सीधा, आधुनिक हिन्दी रूप है।
- source_word: ἐν θαλάσσῃ
  choice: समुद्र में
  rationale: ‘में’ यूनानी पूर्वसर्ग के निकट है और समुद्र के भीतर मार्ग होने की प्रभावशाली काव्यात्मक अभिव्यक्ति बनाए रखता है।
- source_word: ἐν κύμασι
  choice: लहरों के बीच
  rationale: शाब्दिक ‘लहरों में’ सम्भव है, पर ‘लहरों के बीच’ आधुनिक हिन्दी में अधिक स्वाभाविक रहते हुए उसी स्थानिक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए प्रयुक्त πρόνοια का अनुवाद
  choice: दूरदर्शी देखभाल
  alternative: प्रबंध; विधान; देखभाल
  rationale: यह चयन परमेश्वर की पूर्वदृष्टि और सक्रिय संरक्षण दोनों को व्यक्त करता है, पर ऐसा कोई निश्चित दार्शनिक या सम्प्रदायगत अर्थ नहीं जोड़ता जो मूल में अनिवार्य न हो।
- issue: διακυβερνᾷ में शासन और समुद्री संचालन की अर्थ-छाया
  choice: उसका संचालन करती है
  alternative: उसे खेकर ले जाती है; उसका मार्गदर्शन करती है; उस पर शासन करती है
  rationale: पिछले प्रसंग का जहाज़ इस क्रिया के समुद्री अर्थ को प्रमुख बनाता है। फिर भी ‘संचालन’ केवल पतवार चलाने तक अर्थ को सीमित नहीं करता और ईश्वरीय देखरेख की व्यापकता बनाए रखता है।
