  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: hi
  text: क्योंकि वे निर्जीव मूर्तियों[a] पर भरोसा रखते थे, दुष्टता से शपथ खाने के बाद वे यह अपेक्षा नहीं करते कि उन्हें कोई हानि होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यर्थ मूर्तियों’ अथवा ‘खोखली मूर्तियों’। यूनानी विशेषण उनकी रिक्तता या अवास्तविकता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके साथ अन्याय होगा’ अथवा ‘उन्हें दंड मिलेगा’। यूनानी शब्द सामान्य रूप से हानि सहने का अर्थ दे सकता है; इस प्रसंग में सम्भवतः दुष्टतापूर्वक शपथ खाने के प्रतिकार का संकेत है।
    reason: alternative_reading
