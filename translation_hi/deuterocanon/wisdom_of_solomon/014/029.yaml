- source_word: κακῶς
  choice: दुष्टता से
  rationale: क्रियाविशेषण शपथ खाने के नैतिक रूप से बुरे ढंग को बताता है। यह केवल ‘झूठी शपथ’ जैसा संकुचित अर्थ आरोपित नहीं करता।
- source_word: ὀμόσαντες
  choice: शपथ खाने के बाद
  rationale: भूतकालिक कृदन्त की पूर्वकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है और मूल में निहित शपथ की क्रिया को सीधे रखता है।
- source_word: ἀδικηθῆναι
  choice: उन्हें कोई हानि होगी
  rationale: यूनानी निष्क्रिय रूप का अर्थ व्यापक है—हानि उठाना, अन्याय सहना, या प्रसंग में दण्ड पाना। ‘हानि’ इस अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: οὐ προσδέχονται
  choice: वे यह अपेक्षा नहीं करते
  rationale: यह प्रत्याशा या आशंका न होने का अर्थ स्पष्ट रूप से देता है। ‘अपेक्षा’ यहाँ किसी परिणाम के अनुमान के अर्थ में प्रयुक्त है।
theological_decisions:
- issue: परिणामसूचक उपवाक्य का अर्थ
  choice: वे दुष्टता से शपथ खाने के बाद भी किसी हानि की अपेक्षा नहीं करते।
  alternative: वे मूर्तियों द्वारा अपने साथ अन्याय किए जाने या अपनी झूठी शपथ के लिए दण्डित होने की अपेक्षा नहीं करते।
  rationale: ἀδικηθῆναι का अर्थ व्यापक है। मूर्तिपूजा-विरोधी प्रसंग दण्ड या प्रतिकार की ओर संकेत करता है, पर मूल पाठ इसे स्पष्ट रूप से सीमित नहीं करता; इसलिए ‘हानि’ उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में कारण, पूर्वकालिक क्रिया और परिणाम की मूल संरचना सुरक्षित है; दण्ड के अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
