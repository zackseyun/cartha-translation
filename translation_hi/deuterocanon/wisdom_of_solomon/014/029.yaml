  rationale: यह विशेषण मूर्तियों की शक्ति और वास्तविक जीवन के अभाव पर बल देता है। ‘निर्जीव’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; ‘व्यर्थ’ या ‘खोखली’ भी सम्भव हैं।
