  choice: भरोसा रखने के कारण
  rationale: पूर्णकालिक कृदन्त स्थिर और जारी भरोसे का भाव देता है; कारणसूचक रचना γὰρ और वाक्य के तर्क को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: εἰδώλοις
  choice: मूर्तियों
