  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबिलीय गद्य। ‘परमेश्वर’, ‘अज्ञान’, ‘युद्ध’ और ‘शान्ति’ जैसे सीधे पद मूल की धार्मिक तथा अलंकारिक तीव्रता बनाए रखते हैं। मुख्य वाक्य में दोनों पादटिप्पणी-चिह्न [a] और [b] सम्मिलित हैं।
