  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: hi
  text: फिर, परमेश्वर के ज्ञान के संबंध में भटकना ही उनके लिए पर्याप्त नहीं था[a]; बल्कि अज्ञान के एक बड़े युद्ध में जीवन बिताते हुए, वे इतनी बड़ी बुराइयों को शान्ति कहते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के ज्ञान के संबंध में भटकाया जाना।” यूनानी क्रिया-रूप का अधिक कर्मवाच्य अर्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अज्ञान का एक बड़ा युद्ध” यूनानी का रूपक है। इसमें अज्ञान के वश में जीवन को मानो युद्ध या गहरे संघर्ष की दशा बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
