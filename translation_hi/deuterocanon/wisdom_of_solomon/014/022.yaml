- source_word: οὐκ ἤρκεσεν
  choice: पर्याप्त नहीं था
  rationale: यूनानी की निर्वैयक्तिक रचना को निकटता से रखते हुए आधुनिक हिन्दी में स्पष्ट अर्थ देता है।
- source_word: τὸ πλανᾶσθαι
  choice: भटकना
  rationale: यह बौद्धिक और नैतिक पथभ्रष्टता दोनों व्यक्त करता है, पर बाहरी कर्ता द्वारा बहकाए जाने का दावा नहीं जोड़ता।
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: परमेश्वर के ज्ञान के विषय में
  rationale: γνῶσις का धार्मिक भार और परमेश्वर के सच्चे ज्ञान/पहचान का भाव सुरक्षित रहता है।
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: अज्ञान के एक बड़े युद्ध में
  rationale: πόλεμος के सशक्त रूपक को ‘भ्रम’ या ‘अशान्ति’ बनाकर सपाट नहीं किया गया; सम्बन्धकारक ἀγνοίας की अस्पष्टता भी बनी रहती है।
- source_word: ζῶντες
  choice: जीते हुए
  rationale: कृदन्त का परिस्थितिजन्य भाव मुख्य क्रिया ‘कहते हैं’ से जुड़ा रहता है।
- source_word: τὰ τοσαῦτα κακὰ
  choice: इतने बड़े अनर्थों को
  rationale: τοσαῦτα में निहित परिमाण और गंभीरता दोनों को व्यक्त करता है; ‘अनर्थ’ यहाँ अनेक दुष्कर्मों और उनके विनाशकारी परिणामों को समेटता है।
- source_word: εἰρήνην
  choice: शान्ति
  rationale: मूल का सीधा शब्द रखकर युद्ध और शान्ति के व्यंग्यपूर्ण विरोध को सुरक्षित रखा गया है।
- source_word: προσαγορεύουσιν
  choice: कहते हैं
  rationale: गलत नाम देने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πλανᾶσθαι को आत्मवाचक ढंग से ‘भटकना’ या अधिक कर्मवाच्य ढंग से ‘भटकाया जाना’ कहना
  choice: भटकना
  alternative: भटकाया जाना / बहकाया जाना
  rationale: मध्य/कर्मवाच्य रूप दोनों सूक्ष्मताओं की अनुमति देता है, लेकिन पद का जोर पथभ्रष्टता पर है, उसके बाहरी कर्ता पर नहीं; विकल्प पादटिप्पणी में रखा गया है।
- issue: εἰρήνην का अर्थ बढ़ाकर ‘शान्ति और सुरक्षा’ करना
  choice: शान्ति
  alternative: सुरक्षा / व्यवस्था
  rationale: मूल में केवल εἰρήνην है; सीधा अनुवाद अज्ञान के ‘युद्ध’ के साथ जानबूझकर रखे गए विरोध और व्यंग्य को बचाता है।
- issue: ἀγνοίας πολέμῳ के युद्ध-रूपक को बनाए रखना
  choice: अज्ञान के एक बड़े युद्ध में
  alternative: गहरे अज्ञान और संघर्ष में
  rationale: रूपक लेखक की नैतिक विडम्बना का अंग है; उसे अमूर्त ‘उलझन’ में बदलना पाठ के तनाव को घटा देता।
