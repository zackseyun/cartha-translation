- source_word: σχεδίᾳ
  choice: बेड़े पर
  rationale: σχεδία अस्थायी या साधारण बेड़े को सूचित करता है; ‘बेड़ा’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: διεσώθησαν
  choice: सुरक्षित बच निकलते हैं
  rationale: संयुक्त क्रिया संकट के आर-पार सुरक्षित पहुँचने का भाव रखती है; हिन्दी में यह उस परिणाम को स्पष्ट करती है।
