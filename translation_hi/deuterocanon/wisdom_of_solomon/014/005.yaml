- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: आपकी बुद्धि के कार्य
  rationale: सम्बन्धवाचक यूनानी रचना और परमेश्वर की बुद्धि के धर्मवैचारिक भार दोनों को सीधे रूप में सुरक्षित रखता है।
