  rationale: यूनानी पाठ ‘आपकी बुद्धि के कार्य’ कहता है, पर बुद्धि की सत्ता-सम्बन्धी प्रकृति को परिभाषित नहीं करता; इसलिए अनुवाद मूल धर्मवैचारिक तनाव को खुला रखता है।
