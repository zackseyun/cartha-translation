  text: परन्तु आप चाहते हैं कि आपकी बुद्धि के कार्य निष्क्रिय न रहें; इसलिए मनुष्य लकड़ी के एक अत्यन्त छोटे टुकड़े के सहारे भी अपने प्राण[a] सौंपते हैं और बेड़े पर लहरों को पार करके सुरक्षित बचाए जाते हैं।
  philosophy: optimal-equivalence
