  language: hi
  text: क्योंकि वह लकड़ी धन्य है, जिसके द्वारा धार्मिकता आती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय आता है।” यूनानी शब्द δικαιοσύνη का अर्थ “धार्मिकता” या “न्याय” हो सकता है।
