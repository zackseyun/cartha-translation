lexical_decisions:
- source_word: εὐλόγηται
  choice: धन्य है
  rationale: 'पूर्णकालिक कर्मवाच्य रूप यहाँ परिणामी अवस्था बताता है: वह लकड़ी धन्य ठहरती है। ‘धन्य है’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।'
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन से व्याख्यात्मक संबंध जोड़ता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और सहज रखता है।
- source_word: ξύλον
  choice: लकड़ी
  rationale: ξύλον का अर्थ लकड़ी, पेड़ या लकड़ी से बनी वस्तु हो सकता है। प्रसंग में सामग्री पर बल है, इसलिए ‘लकड़ी’ बिना अनावश्यक विशिष्टता के मूल अर्थ सुरक्षित रखती है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम ξύλον की ओर संकेत करता है और साधन का भाव देता है; ‘जिसके द्वारा’ इस अर्थ को ठीक व्यक्त करता है।
- source_word: γίνεται
  choice: आती है
  rationale: γίνομαι यहाँ अस्तित्व में आने या घटित होने का भाव देता है। ‘आती है’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा मूल की खुली अभिव्यक्ति बनाए रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: δικαιοσύνη नैतिक धार्मिकता और न्याय—दोनों अर्थ धारण कर सकता है। मुख्य पाठ में व्यापक धर्मवैचारिक-नैतिक अर्थ के लिए ‘धार्मिकता’ रखा गया है और ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस पद में शब्द नैतिक सहीपन और न्यायपूर्ण परिणाम दोनों की ओर संकेत कर सकता है। ‘धार्मिकता’ व्यापक अर्थ को मुख्य पाठ में रखती है, जबकि वास्तविक वैकल्पिक अर्थ ‘न्याय’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वह लकड़ी’ मूल के निश्चित संज्ञापद को दर्शाता है; वाक्य की साधनात्मक और व्याख्यात्मक संरचना सुरक्षित रखी गई है।
