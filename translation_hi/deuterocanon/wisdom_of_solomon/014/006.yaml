  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: hi
  text: क्योंकि जब आरम्भ में घमण्डी दैत्य नष्ट किए जा रहे थे, तब संसार की आशा ने आपके हाथ द्वारा चलाए गए एक बेड़े[a] पर शरण लेकर भावी युग[b] के लिए वंश का बीज छोड़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेड़ा’ के स्थान पर ‘जलयान’ या ‘छोटी नाव’ भी सम्भव है। यूनानी में सामान्य ‘जहाज़’ या ‘सन्दूक’ का शब्द नहीं, बल्कि विशेष रूप से ‘बेड़ा’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘भावी युग के लिए’ का अनुवाद ‘युग के लिए’ या ‘भावी पीढ़ियों के लिए’ भी हो सकता है। यहाँ प्रयुक्त यूनानी शब्द ‘युग’ है, जो इसी पद में पहले आए ‘संसार’ के यूनानी शब्द से भिन्न है।
    reason: lexical_alternative
