lexical_decisions:
- source_word: ἐπίτασιν
  choice: और बढ़ाने
  rationale: यह संज्ञा वृद्धि, प्रबलता या तीव्रता को व्यक्त करती है। हिन्दी में क्रियात्मक रूप वाक्य को स्वाभाविक रखते हुए उपासना के विस्तार अथवा अधिक प्रबल होने का भाव देता है।
- source_word: θρησκείας
  choice: उपासना
  rationale: मूर्तिपूजा के प्रसंग में यह शब्द अमूर्त ‘धर्म’ की अपेक्षा धार्मिक या पंथगत आचरण को सूचित करता है; ‘उपासना’ उसी व्यावहारिक भाव को स्पष्ट रखता है।
- source_word: ἀγνοοῦντας
  choice: जो अनजान थे
  rationale: कृदन्त ज्ञान या समझ के अभाव वाले व्यक्तियों को दर्शाता है। यह अनुवाद इस बात को अनिर्धारित रखता है कि वे ठीक किस विषय से अनजान थे।
- source_word: τεχνίτου
  choice: कारीगर
  rationale: यह मूर्ति बनाने वाले कुशल शिल्पी के लिए सहज और वर्तमान हिन्दी शब्द है।
- source_word: προετρέψατο
  choice: उकसाया
  rationale: क्रिया किसी को आगे बढ़ाने या प्रेरित करने का भाव देती है। यहाँ ‘उकसाया’ प्रसंग की आलोचनात्मक ध्वनि को रखता है, पर हिंसक बाध्यता का अर्थ नहीं जोड़ता।
- source_word: φιλοτιμία
  choice: महत्त्वाकांक्षा
  rationale: शब्द मूलतः सम्मान या प्रतिष्ठा पाने की चाह और उससे उत्पन्न अभिलाषा को दर्शाता है। प्रसंग में कारीगर की पहचान पाने की आकांक्षा के लिए ‘महत्त्वाकांक्षा’ उपयुक्त है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में θρησκεία का अनुवाद
  choice: उपासना
  alternative: धर्म; धार्मिक आचरण
  rationale: यहाँ जोर किसी अमूर्त धार्मिक व्यवस्था पर नहीं, बल्कि मूर्ति से जुड़े उपासना-व्यवहार की वृद्धि पर है। ‘उपासना’ यही अर्थ सामने लाता है, बिना बाद की किसी विशिष्ट धर्मवैज्ञानिक परिभाषा को आरोपित किए।
