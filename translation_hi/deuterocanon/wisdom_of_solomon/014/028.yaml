  choice: अन्याय से
  alternative: अधर्म से / दुष्टता से
  rationale: मूल शब्द नैतिक बुराई और अन्याय दोनों को समेट सकता है। ‘अन्याय से’ सामाजिक-नैतिक आयाम को स्पष्ट रखता है और बाद की विशिष्ट धर्मशास्त्रीय शब्दावली आरोपित नहीं करता।
