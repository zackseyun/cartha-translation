  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
translation:
  language: hi
  text: क्योंकि वे या तो मौज-मस्ती करते हुए उन्मत्त हो जाते हैं[a], या झूठी भविष्यवाणियाँ करते हैं, या अन्यायपूर्ण जीवन जीते हैं, या बिना देर किए झूठी शपथ खाते हैं[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मौज-मस्ती में वे उन्मत्त हो जाते हैं।” यूनानी कृदन्त और पूर्णकालीन क्रिया में अवस्था तथा उसके परिणामी भाव—दोनों का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे तत्परता से झूठी शपथ खाते हैं।” यूनानी क्रिया का अर्थ झूठी शपथ लेना अथवा मिथ्या शपथ का दोषी होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: मौज-मस्ती करते हुए
  rationale: यह कृदन्त उत्सव, आनंद या रंग-रलियों में लगे होने का भाव देता है। प्रसंग में ‘मौज-मस्ती’ अनियंत्रित उत्सवी व्यवहार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μεμήνασιν
  choice: पागल हो जाते हैं
  rationale: μαίνομαι उन्मत्त या विक्षिप्त होने का संकेत देता है। यह अनुवाद क्रिया की तीव्रता और वर्तमान परिणामी दशा, दोनों को सहज हिन्दी में रखता है।
- source_word: προφητεύουσιν ψευδῆ
  choice: झूठी भविष्यवाणियाँ करते हैं
  rationale: यह पद भविष्यवाणी करने और उसकी असत्यता—दोनों को स्पष्ट रखता है तथा आरोप को केवल सामान्य झूठ बोलने तक सीमित नहीं करता।
- source_word: ζῶσιν ἀδίκως
  choice: अन्याय से जीवन बिताते हैं
  rationale: ἀδίκως में अन्याय और अधर्म दोनों का अर्थक्षेत्र है। ‘अन्याय से’ इसके नैतिक-सामाजिक पहलू को बनाए रखता है, बिना किसी संप्रदायगत अर्थ को थोपे।
- source_word: ἐπιορκοῦσιν
  choice: झूठी शपथ खाते हैं
  rationale: यह क्रिया झूठी शपथ लेने या शपथभंगजन्य मिथ्या साक्ष्य का बोध कराती है। चुना हुआ वाक्यांश सामान्य पाठक के लिए ‘मिथ्या शपथ’ या कानूनी ‘परजरी’ से अधिक पारदर्शी है।
- source_word: ταχέως
  choice: देर नहीं लगाते
  rationale: शाब्दिक अर्थ ‘शीघ्र’ है, पर यहाँ तत्परता या बेझिझक ऐसा करने का भाव भी है। हिन्दी मुहावरा उस तत्परता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
