  rationale: κρύφια की गोपनीयता और μυστήρια के धार्मिक अनुष्ठानात्मक आशय—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐμμανεῖς ... κώμους
  choice: उन्मत्त उत्सव
  rationale: κῶμος के मदोन्मत्त, धूमधाम भरे सामूहिक उत्सव और ἐμμανής की उन्मत्तता को संक्षेप में व्यक्त करता है।
- source_word: ἐξάλλων θεσμῶν
  choice: विचित्र रीति-विधानों के साथ
  rationale: ἐξάλλων को सामान्य से हटे हुए/विचित्र और θεσμῶν को स्थापित रीति-विधान मानता है; संबंध को साथ/संबद्धता के रूप में रखता है, जैसा परामर्श-पाठ में है।
- source_word: ἄγοντες
  choice: करते थे ... मनाते थे
  rationale: ग्रीक में एक ही participle तीनों विकल्पों पर लागू है; हिन्दी में प्रत्येक संज्ञा के अनुरूप स्वाभाविक क्रिया देकर समानांतर अर्थ सुरक्षित रखा गया है।
