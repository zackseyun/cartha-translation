  rationale: τεκνοφόνος का बाल-हत्या संबंधी कठोर अर्थ बनाए रखता है और τελετή को सामान्य कर्मकांड मात्र नहीं, धार्मिक दीक्षा/अनुष्ठान के रूप में व्यक्त करता है।
