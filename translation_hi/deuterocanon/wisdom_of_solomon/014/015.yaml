base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: hi
  text: क्योंकि एक पिता ने, अपने उस बच्चे के लिए जो शीघ्र ही उससे छीन लिया गया था, असमय के शोक से घुलते हुए, उस मनुष्य की प्रतिमा बनाई जो तब मृत था; और अब उसे एक देवता के रूप में सम्मान दिया, तथा अपने अधीन लोगों को रहस्य-विधियाँ और धार्मिक अनुष्ठान[a] सौंपे;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रहस्य-विधियाँ और धार्मिक अनुष्ठान’ से आशय किसी पंथ से जुड़े गुप्त या दीक्षा-संबंधी धार्मिक पालन और अनुष्ठानों से है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: असमय आए शोक
  rationale: ἀώρῳ उचित या अपेक्षित समय से पहले घटित होने का भाव देता है। हिंदी में यह पदबंध उस शोक को स्वाभाविक ढंग से बच्चे की असमय मृत्यु से जोड़ता है।
- source_word: τρυχόμενος
  choice: से घुलता हुआ
  rationale: यह कृदंत शोक से लगातार क्षीण और टूटते जाने का भाव देता है; ‘घुलता हुआ’ आधुनिक हिंदी में इस आंतरिक क्षय को सहजता से व्यक्त करता है।
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: शीघ्र ही उससे छीन लिए गए बच्चे के लिए
  rationale: ταχέως की शीघ्रता और ἀφαιρεθέντος के ले लिए जाने/छीन लिए जाने, दोनों भाव सुरक्षित हैं। τέκνου लिंग-निरपेक्ष है, इसलिए ‘बच्चे’ चुना गया है। ‘उससे’ संबंध को स्पष्ट करता है, पर मृत्यु का कारण नहीं जोड़ता।
- source_word: εἰκόνα
  choice: प्रतिमा
  rationale: संदर्भ में बनाई हुई दृश्य आकृति है। ‘मूर्ति’ पहले ही उसे पूजावस्तु ठहरा सकती थी, जबकि ‘प्रतिमा’ मूल के अपेक्षाकृत तटस्थ अर्थ को रखती है।
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: जो तब एक मृत मनुष्य था
  rationale: 'यह τότε और νῦν के जानबूझकर किए गए विरोध को सुरक्षित रखता है: वह तब केवल मृत मनुष्य था, पर अब देवता के समान सम्मानित किया गया।'
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: अब वह उसे एक देवता के रूप में सम्मान देता है
  rationale: ὡς θεόν उस व्यक्ति को देवता की हैसियत से सम्मान देने का कथन करता है। ‘एक देवता’ झूठे देवत्व के संदर्भ को व्यक्त करता है, बिना उसे सच्चा ईश्वर कहे।
- source_word: παρέδωκεν
  choice: सौंप देता है
  rationale: क्रिया किसी प्रथा या विधि को अपने अधीन लोगों तक पहुँचाने या उनके पालन के लिए देने का अर्थ रखती है।
- source_word: τοῖς ὑποχειρίοις
  choice: अपने अधीन लोगों को
  rationale: यह उन लोगों को सूचित करता है जो उसके नियंत्रण या अधिकार के नीचे थे; पदबंध घरेलू और राजनीतिक, दोनों संभावनाएँ खुली रखता है।
- source_word: μυστήρια καὶ τελετάς
  choice: रहस्य-अनुष्ठान और धार्मिक विधियाँ
  rationale: दोनों यूनानी पदों के पंथ-संबंधी और अनुष्ठानिक स्वरूप को अलग-अलग बनाए रखते हुए हिंदी पाठक के लिए उनका धार्मिक अर्थ स्पष्ट किया गया है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी संदर्भ में θεός का अनुवाद
  choice: एक देवता
  alternative: ईश्वर-समान / दिव्य
  rationale: मूल पाठ मृत मनुष्य को देवता की हैसियत से सम्मान दिए जाने का वर्णन करता है। ‘एक देवता’ देवत्व प्रदान करने के दावे को सुरक्षित रखता है, पर सच्चे परमेश्वर से उसकी समानता नहीं करता।
- issue: तब मृत मनुष्य और अब देवता के रूप में सम्मानित व्यक्ति का विरोध
  choice: जो तब एक मृत मनुष्य था; फिर अब... एक देवता के रूप में
  alternative: मृत बच्चे की प्रतिमा बनाकर उसकी पूजा की
  rationale: चुना हुआ रूप τότε/νῦν के मूल विरोध और ‘सम्मान देने’ की क्रिया को बनाए रखता है। विकल्प ‘पूजा’ कहकर अर्थ को अधिक निश्चित कर देता और ‘मनुष्य’ की स्पष्ट अभिव्यक्ति खो देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। लंबे यूनानी वाक्य की तर्क-श्रृंखला बनाए रखते हुए अर्धविराम से ‘तब मृत मनुष्य’ और ‘अब देवता’ का विरोध स्पष्ट किया गया है। पद्य के अंत का अर्धविराम अगले पद से उसके वाक्यगत संबंध का संकेत देता है।
