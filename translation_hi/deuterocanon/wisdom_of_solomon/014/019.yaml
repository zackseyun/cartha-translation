  to: क्योंकि वह शिल्पी शायद शासक को प्रसन्न करना चाहता था, इसलिए उसने अपनी कला का जोर लगाकर उस प्रतिरूप को और अधिक सुंदर रूप में ढाल दिया।
  rationale: The revision replaces the weakened ‘प्रयास किया’ with ‘अपनी कला का जोर लगाकर ... ढाल दिया,’ which expresses both the means (τῇ τέχνῃ) and the unusual force or pressure of ἐξεβιάσατο, while preserving the descriptive rather than overtly condemnatory tone. ‘और अधिक सुंदर रूप में’ renders ἐπὶ τὸ κάλλιον without adding interpretive theological language.
