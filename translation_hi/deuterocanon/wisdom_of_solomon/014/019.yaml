translation:
  language: hi
  text: क्योंकि वह शिल्पी शायद शासक को प्रसन्न करना चाहता था, इसलिए उसने अपनी कला का जोर लगाकर उस प्रतिरूप को और अधिक सुंदर रूप में ढाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάχα
  choice: शायद
  rationale: यहाँ यह शब्द शिल्पी की मंशा के विषय में अनुमान व्यक्त करता है, न कि शीघ्रता।
- source_word: κρατοῦντι
  choice: शासक
  rationale: यह कृदन्त उस व्यक्ति को दर्शाता है जो सत्ता या शासन करता है; प्रसंग में ‘शासक’ स्वाभाविक और स्पष्ट है।
- source_word: βουλόμενος ἀρέσαι
  choice: प्रसन्न करना चाहता था
  rationale: यह अभिव्यक्ति इच्छा और उद्देश्य दोनों को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἐξεβιάσατο
  choice: बनाने का प्रयास किया
  rationale: यूनानी क्रिया सामान्य सीमा से आगे जोर लगाने का भाव रखती है। हिन्दी में यह चयन उस कलात्मक प्रयत्न को व्यक्त करता है, जबकि ‘विकृत किया’ जैसी अतिरिक्त निंदा नहीं जोड़ता।
- source_word: τῇ τέχνῃ
  choice: अपनी कला से
  rationale: τέχνη यहाँ कलाकार की कला, कारीगरी या तकनीकी कौशल का साधनगत अर्थ रखता है।
- source_word: τὴν ὁμοιότητα
  choice: उसकी समानता
  rationale: यह मूल के ‘सादृश्य/समानता’ को सीधे रखता है और उसे अनावश्यक रूप से ‘मूर्ति’ कहकर अधिक विशिष्ट नहीं बनाता।
- source_word: ἐπὶ τὸ κάλλιον
  choice: और अधिक सुंदर
  rationale: यह तुलनात्मक वाक्यांश अधिक सौंदर्य की दिशा में ले जाने या आदर्शीकृत करने का भाव व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में शिल्पी के कार्य का चित्रण
  choice: शासक को प्रसन्न करने के लिए समानता को अधिक सुंदर बनाने की क्रिया का वर्णन किया गया है, बिना स्पष्ट नैतिक निंदा जोड़े।
  alternative: ἐξεβιάσατο का अनुवाद ‘समानता को विकृत कर दिया’ करना।
  rationale: व्यापक प्रसंग मूर्तिपूजा की आलोचना करता है, पर यह पद स्वयं राजनीतिक चाटुकारिता से प्रेरित कलात्मक आदर्शीकरण की प्रक्रिया बताता है। इसलिए निंदा को क्रिया में अतिरिक्त रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘वह शिल्पी’ पिछले प्रसंग के कर्ता को स्पष्ट करता है।
