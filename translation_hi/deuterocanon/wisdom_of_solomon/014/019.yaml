  source_fidelity: 'The draft correctly conveys τάχα as tentative (''शायद''), κρατοῦντι as ''शासक,'' and the purposive sense of βουλόμενος ἀρέσαι. However, ''बनाने का प्रयास किया'' substantially weakens ἐξεβιάσατο: the Greek denotes exerting/pressing force upon the likeness, not merely attempting an enhancement.'
  naturalness: The draft is generally clear modern Hindi. The revision retains its accessible register while making the artisan's forceful artistic intervention explicit and using 'प्रतिरूप' for the represented likeness.
  terminology: ‘शासक’ and ‘कला’ are suitable. ‘प्रतिरूप’ is a natural, non-overly-specific rendering of ὁμοιότητα in this context; it does not prematurely label the object an idol.
