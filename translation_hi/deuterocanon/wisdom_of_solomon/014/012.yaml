lexical_decisions:
- source_word: Ἀρχὴ
  choice: आरंभ
  rationale: यह शब्द आरंभ, उद्गम या मूल कारण का बोध करा सकता है। ‘आरंभ’ यूनानी वाक्य की संक्षिप्तता और संभावित कारणात्मक अर्थ—दोनों को बनाए रखता है।
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: πορνεία अवैध या अनैतिक यौन आचरण के लिए व्यापक शब्द है। यह अनुवाद उसके प्रत्यक्ष अर्थ को रखता है और मूर्तिपूजा से जुड़ी रूपकात्मक प्रतिध्वनि को संदर्भ पर छोड़ता है।
- source_word: ἐπίνοια
  choice: परिकल्पना
  rationale: यह विचार करके गढ़ी गई धारणा, योजना या युक्ति को सूचित करता है। ‘परिकल्पना’ मूर्तियों के मानव-निर्मित विचार की ओर संकेत करती है और εὕρεσις के साथ समानांतरता बनाए रखती है।
- source_word: εἰδώλων
  choice: मूर्तियों
  rationale: यहूदी-यूनानी संदर्भ में εἴδωλον तटस्थ चित्र के बजाय पूजा की मूर्ति को दर्शाता है।
- source_word: εὕρεσις
  choice: आविष्कार
  rationale: यद्यपि इसका अर्थ ‘खोज’ भी हो सकता है, यहाँ मूर्तियों के मानवीय रूप से गढ़े जाने और ἐπίνοια के साथ समानांतर प्रयोग के कारण ‘आविष्कार’ उपयुक्त है।
- source_word: αὐτῶν
  choice: उनका
  rationale: यह सर्वनाम पहले उल्लिखित मूर्तियों की ओर लौटता है और यूनानी संबंधकारक को सहज हिन्दी में व्यक्त करता है।
- source_word: φθορὰ
  choice: भ्रष्ट होना
  rationale: φθορά में भ्रष्टता, क्षय, बरबादी और विनाश तक का अर्थ हो सकता है। ‘भ्रष्ट होना’ नैतिक और अस्तित्वगत दोनों आयामों को खुला रखता है।
- source_word: ζωῆς
  choice: जीवन का
  rationale: संबंधकारक रूप को सीधे रखते हुए यह यूनानी के संक्षिप्त और व्यापक कथन को सुरक्षित रखता है।
theological_decisions:
- issue: क्या πορνεία का अनुवाद प्रत्यक्ष यौन अर्थ में हो या उसे मूर्तिपूजा/आत्मिक विश्वासघात के रूप में समझाया जाए
  choice: ‘यौन अनैतिकता’ के रूप में प्रत्यक्ष अर्थ रखा गया है।
  alternative: मूर्तिपूजा; विश्वासघात
  rationale: वचन मूर्तियों की परिकल्पना को πορνεία का आरंभ बताकर दोनों को व्याकरणतः अलग रखता है। इसे ‘मूर्तिपूजा’ कहना लेखक के कारणात्मक कथन को धुंधला कर देगा।
- issue: क्या φθορὰ ζωῆς को किसी एक संकीर्ण अर्थ में स्पष्ट किया जाए
  choice: ‘जीवन का भ्रष्ट होना’ रखकर नैतिक पतन, क्षय और विनाश की अर्थ-सीमा खुली रखी गई है।
  alternative: जीवन का विनाश; जीवन की बरबादी
  rationale: यूनानी पद संक्षिप्त और बहुअर्थी है। मुख्य पाठ में व्यापक अर्थ बनाए रखना किसी एक परिणाम को अनावश्यक रूप से निर्णायक बनाने से बचाता है।
