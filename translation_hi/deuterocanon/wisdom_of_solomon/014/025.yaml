base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/025.yaml
  text: 'and everything is mixed together: blood and murder, theft and deceit, corruption, faithlessness, turmoil, perjury, and confusion over what is good,'
translation:
  language: hi
  text: 'और सब कुछ आपस में घुलमिल गया है: खून और हत्या[a], चोरी और छल, भ्रष्टता, विश्वासघात, अशांति, झूठी शपथ, और भली बातों को लेकर कोलाहल[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रक्तपात और हत्या”; यूनानी में शाब्दिक रूप से “खून और हत्या” है।
    reason: lexical_alternative
  - marker: b
    text: यह यूनानी पदबंध कठिन है। इसके अर्थ “भली वस्तुओं में अव्यवस्था” या “आशीषों को लेकर कोलाहल” भी हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ समग्र अर्थ देता है; ‘सब कुछ’ उसके व्यापक आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιμὶξ ἔχει
  choice: आपस में घुलमिल गया है
  rationale: यह पदबंध भेद मिटाकर मिश्रित हो जाने की स्थिति दर्शाता है; यह अनुवाद मूल बिंब को बनाए रखते हुए हिन्दी में सहज है।
- source_word: αἷμα
  choice: खून
  rationale: यूनानी शब्द का सीधा अर्थ ‘खून’ है। प्रसंग में यह रक्तपात का संकेत दे सकता है, पर मुख्य पाठ में शाब्दिक रूप रखकर उस तीव्र युग्म को सुरक्षित रखा गया है।
- source_word: φόνος
  choice: हत्या
  rationale: दुष्कर्मों की सूची में यह अन्यायपूर्ण मनुष्य-वध का स्पष्ट और सामान्य हिन्दी रूप है।
- source_word: κλοπή
  choice: चोरी
  rationale: यह संज्ञा यूनानी सूची की संज्ञात्मक शैली और नैतिक आशय दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: δόλος
  choice: छल
  rationale: ‘छल’ कपट, धोखे और धूर्तता की अर्थ-सीमा को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: φθορά
  choice: भ्रष्टता
  rationale: नैतिक सूची में यह शब्द पतन और बिगाड़ का संकेत देता है; ‘भ्रष्टता’ नैतिक-सामाजिक क्षय को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἀπιστία
  choice: विश्वासघात
  rationale: यहाँ सामाजिक और नैतिक बुराइयों का प्रसंग है, इसलिए भरोसा तोड़ने और निष्ठाहीनता का अर्थ प्रमुख है; ‘अविश्वास’ वाला संभावित धार्मिक अर्थ मुख्य पाठ पर नहीं थोपा गया।
- source_word: τάραχος
  choice: अशांति
  rationale: यह उपद्रव, व्याकुलता और अव्यवस्था को दर्शाता है; ‘अशांति’ आधुनिक हिन्दी में व्यापक और सुबोध है।
- source_word: ἐπιορκία
  choice: झूठी शपथ
  rationale: यह झूठी सौगंध खाने या शपथ का उल्लंघन करने से संबंधित है; ‘झूठी शपथ’ सामान्य पाठक के लिए ‘मिथ्या-साक्ष्य’ जैसे कानूनी शब्द से अधिक स्पष्ट है।
- source_word: θόρυβος ἀγαθῶν
  choice: भली बातों को लेकर कोलाहल
  rationale: कठिन यूनानी पदबंध में θόρυβος का अर्थ कोलाहल, उपद्रव या अव्यवस्था और ἀγαθῶν का अर्थ भली बातें या अच्छी वस्तुएँ हो सकता है। चुना हुआ रूप संबंध की अस्पष्टता को पूरी तरह हल किए बिना पठनीय रहता है।
theological_decisions:
- issue: दुष्कर्मों की सूची में ἀπιστία का अर्थ
  choice: विश्वासघात
  alternative: अविश्वास; निष्ठाहीनता
  rationale: निकटवर्ती संदर्भ मूर्तिपूजा से उत्पन्न सामाजिक और नैतिक विघटन गिनाता है। इसलिए भरोसा या निष्ठा तोड़ने का अर्थ अधिक संभावित है, यद्यपि शब्द की व्यापक अर्थ-सीमा को स्वीकार किया गया है।
- issue: θόρυβος ἀγαθῶν में ‘भली बातों’ और ‘कोलाहल’ का संबंध
  choice: भली बातों को लेकर कोलाहल
  alternative: भली वस्तुओं में अव्यवस्था; आशीषों पर कोलाहल; भले-बुरे की पहचान में भ्रम
  rationale: यूनानी संबंध अस्पष्ट है। मुख्य पाठ ऐसा रूप रखता है जो नैतिक अव्यवस्था की संभावना व्यक्त करे, पर उसे केवल ‘भले-बुरे का भ्रम’ मानकर निर्णायक व्याख्या न करे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दुष्कर्मों की संज्ञात्मक सूची और उसकी तीव्र लय सुरक्षित है। ‘झूठी शपथ’ जैसे सहज रूप को तकनीकी कानूनी शब्दावली पर प्राथमिकता दी गई है, जबकि कठिन अंतिम पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
