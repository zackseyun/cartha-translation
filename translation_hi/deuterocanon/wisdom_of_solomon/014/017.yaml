base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: hi
  text: लोग, जो बहुत दूर रहते थे, उन्हें आमने-सामने सम्मान नहीं दे सकते थे; इसलिए उन्होंने दूर से दिखाई देने वाले रूप[a] की नकल बनाकर सम्मानित राजा की एक स्पष्ट प्रतिमा बनाई, ताकि अपने उत्साह से वे उस अनुपस्थित राजा की चापलूसी कर सकें, मानो वह उपस्थित हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूरवर्ती रूप।”
    reason: πόρρωθεν ὄψιν का अर्थ दूर से दिखाई देनेवाला रूप अथवा दूरी से संबद्ध रूप समझा जा सकता है।
  - marker: b
    text: या, “ताकि वे अनुपस्थित राजा की कृपा पाने का ऐसा प्रयत्न करें, मानो वह उपस्थित हो।”
    reason: κολακεύωσιν चापलूसी करने के साथ किसी की कृपा पाने के लिए उसे प्रसन्न करने का भाव भी दे सकता है।
lexical_decisions:
- source_word: ἐν ὄψει
  choice: प्रत्यक्ष रूप से
  rationale: यह पद दृष्टि के सामने होने और व्यक्तिगत उपस्थिति का बोध कराता है; दूरी और अनुपस्थिति के विपरीत होने के कारण ‘प्रत्यक्ष रूप से’ स्वाभाविक और सटीक है।
- source_word: τιμᾶν
  choice: सम्मान करना
  rationale: यहाँ शब्द का सामाजिक-राजकीय अर्थ प्रमुख है। ‘पूजा करना’ कहने से इस चरण में मूल से अधिक स्पष्ट धार्मिक अर्थ जुड़ जाता।
- source_word: τὴν πόρρωθεν ὄψιν
  choice: दूर से दिखाई देनेवाला रूप
  rationale: ὄψις दृश्य रूप या स्वरूप को और πόρρωθεν दूरी को व्यक्त करता है। यह अनुवाद चित्र-निर्माण की दृश्य धारणा को बनाए रखता है।
- source_word: ἀνατυπωσάμενοι
  choice: रूप उतारकर
  rationale: क्रिया किसी नमूने के अनुसार प्रतिरूप बनाने का भाव देती है। हिन्दी में ‘रूप उतारना’ इस चित्रात्मक प्रक्रिया को सहज ढंग से व्यक्त करता है।
- source_word: ἐμφανῆ εἰκόνα
  choice: एक दृश्य प्रतिमा
  rationale: ἐμφανής प्रतिमा के सामने प्रत्यक्ष और दिखाई देने योग्य होने पर बल देता है, जो अनुपस्थित राजा के साथ अभिप्रेत विरोध को सुरक्षित रखता है।
- source_word: τοῦ τιμωμένου βασιλέως
  choice: सम्मानित राजा की
  rationale: कृदंत राजा को सम्मान के पात्र के रूप में प्रस्तुत करता है। यह संक्षिप्त हिन्दी मूल के निष्क्रिय भाव को बनाए रखती है।
- source_word: κολακεύωσιν
  choice: चापलूसी कर सकें
  rationale: क्रिया में केवल सम्मान नहीं, बल्कि प्रसन्न करने या कृपा पाने के लिए खुशामद करने का आलोचनात्मक भाव है।
- source_word: διὰ τῆς σπουδῆς
  choice: अपने उत्साह के द्वारा
  rationale: σπουδή उत्साह, तत्परता और प्रयत्न का संकेत देती है; यहाँ प्रतिमा बनाकर राजा को प्रसन्न करने की सक्रिय लगन अभिप्रेत है।
theological_decisions:
- issue: क्या τιμᾶν का अनुवाद स्पष्ट रूप से उपासना-संबंधी शब्द से किया जाए
  choice: सम्मान करना
  alternative: पूजा करना; श्रद्धा करना
  rationale: तात्कालिक प्रसंग दूर रहनेवाले राजाओं के प्रति राजकीय-सामाजिक सम्मान से प्रतिमा-निर्माण की उत्पत्ति बताता है। व्यापक प्रसंग मूर्तिपूजा की आलोचना करता है, पर इस खंड में ‘पूजा’ कहने से उस विकास को समय से पहले निश्चित कर दिया जाता।
- issue: κολακεύωσιν में निहित आलोचनात्मक भाव
  choice: चापलूसी कर सकें
  alternative: कृपा पाने का प्रयत्न कर सकें
  rationale: ‘चापलूसी’ लेखक की आलोचनात्मक धार को सीधे बनाए रखती है, जबकि वैकल्पिक अर्थ उस कार्य के लक्ष्य—राजा की कृपा पाना—पर अधिक बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रत्यक्ष रूप से’ और ‘अनुपस्थित…उपस्थित’ मूल के उपस्थिति-दूरी वाले विरोध को बनाए रखते हैं। ‘प्रतिमा’ दृश्य प्रतिनिधित्व को व्यक्त करती है, जबकि ‘सम्मान’ प्रसंग में उपासना का अर्थ समय से पहले आरोपित नहीं करता।
