  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: hi
  text: क्योंकि जिनका नाम लेकर शपथ खाई जाती है, उनकी सामर्थ्य नहीं[a], बल्कि पाप करने वालों का दण्ड अधर्मियों के अपराध का सदा पीछा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शपथों की शक्ति” अथवा “जिनका नाम लेकर शपथ खाई जाती है, उनकी शक्ति।” यूनानी पदबंध संक्षिप्त है और शपथ स्वयं या शपथ में जिनका नाम लिया जाता है, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ यूनानी γὰρ के व्याख्यात्मक-कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: जिनकी शपथ खाई जाती है, उनकी सामर्थ्य
  rationale: संक्षिप्त यूनानी पदबंध का संकेत उन वस्तुओं या सत्ताओं की ओर हो सकता है जिनका नाम लेकर शपथ खाई जाती है। यह अनुवाद उस अर्थ को स्पष्ट रखते हुए ‘शपथों की शक्ति’ की सम्भावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ἀλλ᾽ ἡ τῶν ἁμαρτανόντων δίκη
  choice: बल्कि पाप करने वालों का दण्ड
  rationale: यहाँ δίκη न्यायिक प्रतिफल अथवा दण्ड को सूचित करता है। ‘दण्ड’ वाक्य के प्रतिशोधात्मक सन्दर्भ में स्वाभाविक है, जबकि उसकी न्यायिक पृष्ठभूमि बनी रहती है।
- source_word: ἐπεξέρχεται ἀεὶ
  choice: सदा पीछा करता है
  rationale: क्रिया में पीछे लगने या पीछा करने की सक्रिय छवि है; ‘सदा’ ἀεὶ का सीधा और सहज समतुल्य है।
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: अधर्मियों के अपराध
  rationale: παράβασις नैतिक या विधिक उल्लंघन है और ἄδικος अन्यायी अथवा अधर्मी व्यक्ति को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में इस नैतिक-न्यायिक भाव को सहज रूप से पहुँचाता है।
theological_decisions:
- issue: δίκη का न्यायिक और दण्डात्मक अर्थ
  choice: दण्ड
  alternative: पाप करने वालों को मिलने वाला न्याय
  rationale: सन्दर्भ में मूर्तियों अथवा शपथ में पुकारी गई सत्ताओं की कथित शक्ति के विपरीत पाप के निश्चित दण्ड को रखा गया है। ‘दण्ड’ इस प्रभावी प्रतिफल को स्पष्ट करता है, पर किसी विशेष दण्ड-सिद्धान्त को नहीं जोड़ता।
- issue: शपथ में पुकारी गई वस्तुओं की शक्ति और शपथ की अपनी शक्ति के बीच अस्पष्टता
  choice: जिनकी शपथ खाई जाती है, उनकी सामर्थ्य
  alternative: शपथों की शक्ति
  rationale: यूनानी τῶν ὀμνυμένων व्याकरणतः संक्षिप्त है और शपथ में पुकारी गई सत्ताओं या शपथों की ओर संकेत कर सकता है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
