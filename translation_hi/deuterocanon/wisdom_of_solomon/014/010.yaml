  choice: सामान्य अभिव्यक्ति ‘बनाई गई वस्तु’ रखी गई।
  alternative: मूर्ति; जो किया गया
  rationale: निकटवर्ती प्रसंग मूर्ति की ओर संकेत करता है, पर इस उपवाक्य में यूनानी पाठ ‘मूर्ति’ शब्द नहीं कहता। सामान्य अभिव्यक्ति मूल की व्यापकता और प्रसंगगत संकेत—दोनों को बनाए रखती है।
