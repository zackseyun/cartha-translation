lexical_decisions:
- source_word: τὸ πραχθέν
  choice: बनाई गई वस्तु
  rationale: यह πράσσω का संज्ञा के रूप में प्रयुक्त भूतकालिक कर्मवाच्य कृदन्त है और सामान्यतः ‘जो किया गया’ भी हो सकता है। मूर्तियों को गढ़ने के प्रसंग में यह बनाई हुई वस्तु की ओर संकेत करता है; फिर भी मुख्य पाठ में ‘मूर्ति’ जोड़कर यूनानी से अधिक स्पष्ट नहीं किया गया।
- source_word: σὺν
  choice: के साथ
  rationale: यह बनाई गई वस्तु और बनानेवाले—दोनों के संयुक्त दण्ड को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ δράσαντι
  choice: उसे बनानेवाले
  rationale: δράω का मूल अर्थ ‘करना’ है, पर यहाँ τὸ πραχθέν के साथ इसकी जोड़ी और मूर्ति-निर्माण का प्रसंग ‘बनानेवाले’ का भाव समर्थित करते हैं।
- source_word: κολασθήσεται
  choice: दण्ड पाएगी
  rationale: κολάζω का भविष्यत् कर्मवाच्य रूप दण्डात्मक न्याय बताता है। ‘दण्ड पाएगी’ स्पष्ट, dignified और आधुनिक हिन्दी है।
- source_word: καὶ γάρ
  choice: क्योंकि … भी
  rationale: γάρ पिछले कथन का कारण बताता है और καί के समावेशी बल को ‘भी’ व्यक्त करता है।
