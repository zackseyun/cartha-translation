  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/013.yaml
  text: For it was not from the beginning[a], nor will it be forever.
translation:
  language: hi
  text: क्योंकि वह न तो आरम्भ से था[a], और न सदा तक रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में कर्ता प्रसंग से समझा जाता है; इसका संकेत मूर्तियों या मूर्तिपूजा की ओर हो सकता है।
    reason: मूल पाठ में निहित विषय की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: क्योंकि ... न तो ... और न
  rationale: γάρ का व्याख्यात्मक कारणसूचक बल ‘क्योंकि’ से व्यक्त होता है; οὔτε ... οὔτε की परस्पर संबद्ध नकारात्मक रचना स्वाभाविक हिन्दी में ‘न तो ... और न’ से रखी गई है।
- source_word: ἦν
  choice: वह ... था
  rationale: εἰμί के अपूर्णकाल को सरल रूप में रखा गया है। ‘वह’ प्रसंग से निहित विषय की ओर संकेत करता है, बिना उसे मूर्ति या मूर्तिपूजा के रूप में निश्चित किए।
- source_word: ἀπ' ἀρχῆς
  choice: आरम्भ से
  rationale: यह यूनानी पदबंध उत्पत्ति के आरम्भिक बिंदु को दर्शाता है; ‘आरम्भ से’ उसका संक्षिप्त, स्पष्ट और प्रतिष्ठित हिन्दी रूप है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा तक
  rationale: यहाँ पदबंध भविष्य में स्थायी बने रहने का अर्थ देता है और ‘आरम्भ से’ के साथ कालगत विरोध बनाता है। ‘सदा तक’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔσται
  choice: रहेगा
  rationale: εἰμί के भविष्यकाल का यहाँ ‘रहेगा’ सहज हिन्दी रूप है, जो निरंतर अस्तित्व के भाव को व्यक्त करता है और अनावश्यक दार्शनिक शब्दावली से बचता है।
theological_decisions:
- issue: यूनानी में विषय का निहित रहना
  choice: मुख्य पाठ में ‘वह’ सर्वनाम रखा गया है; ‘मूर्ति’ या ‘मूर्तिपूजा’ स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘मूर्तियाँ आरम्भ से नहीं थीं...’ अथवा ‘मूर्तिपूजा आरम्भ से नहीं थी...’
  rationale: यूनानी वाक्य में कर्ता व्यक्त नहीं है और वह पिछले प्रसंग से समझा जाता है। किसी संज्ञा को जोड़ने से मूल की वास्तविक अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पाठयोग्य रूप। ‘आरम्भ’ और ‘सदा तक’ मूल के कालगत विरोध को बनाए रखते हैं; सर्वनाम मूल यूनानी की विषयगत अस्पष्टता को सुरक्षित रखता है।
