  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। 'राष्ट्रों', 'घृणित वस्तु', 'ठोकर के कारण' और 'फंदा' मूल के ठोस नैतिक रूपकों को बनाए रखते हैं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
