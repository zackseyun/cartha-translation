  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
translation:
  language: hi
  text: इसलिए राष्ट्रों की मूर्तियों पर भी दण्डात्मक जाँच होगी[a], क्योंकि परमेश्वर की सृष्टि में वे घृणित वस्तु, मनुष्यों के प्राणों के लिए ठोकर का कारण, और मूर्खों के पैरों के लिए फंदा बन गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दण्डात्मक जाँच” का अधिक शाब्दिक अनुवाद “जाँच-परख” या “निरीक्षण” हो सकता है; प्रसंग इसका दण्डात्मक परिणाम सूचित करता है।
    reason: ἐπισκοπή की शाब्दिक अर्थ-छाया और प्रसंगगत न्यायकारी बल को सुरक्षित रखना।
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद को पिछले तर्क के निष्कर्ष से जोड़ने वाला स्वाभाविक और संक्षिप्त कारणसूचक पद है।
- source_word: ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται
  choice: राष्ट्रों की मूर्तियों पर भी दण्ड के लिए जाँच होगी
  rationale: ἐπισκοπή का मूल भाव निरीक्षण या जाँच है, जबकि प्रसंग उसका दण्डात्मक परिणाम सूचित करता है। यह अनुवाद दोनों पहलुओं को बनाए रखता है; ἐν को यहाँ लक्ष्यसूचक अर्थ में 'पर' कहा गया है।
- source_word: ἐν κτίσματι θεοῦ
  choice: परमेश्वर की सृष्टि के बीच
  rationale: κτίσμα किसी सृजी हुई वस्तु या समग्र सृष्टि को सूचित कर सकता है। 'सृष्टि के बीच' इस वास्तविक अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: वे घृणित वस्तु ... बन गईं
  rationale: βδέλυγμα धार्मिक और नैतिक रूप से अत्यंत घृणित वस्तु का प्रबल भाव रखता है।
- source_word: σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: मनुष्यों के प्राणों के लिए ठोकर के कारण
  rationale: बहुवचन σκάνδαλα का कारणात्मक रूप स्पष्ट किया गया है और ψυχή के जीवन तथा आंतरिक व्यक्ति से जुड़े व्यापक भाव को 'प्राण' द्वारा सुरक्षित रखा गया है।
- source_word: παγίδα ποσὶν ἀφρόνων
  choice: मूर्खों के पैरों के लिए फंदा
  rationale: यह अनुवाद जाल में फँसते पैरों के ठोस रूपक को बनाए रखता है; ज्ञान-साहित्य में ἄφρων नैतिक और बौद्धिक मूर्खता दोनों दर्शाता है।
theological_decisions:
- issue: न्याय-संदर्भ में ἐπισκοπή का अर्थ
  choice: दण्ड के लिए जाँच होगी
  alternative: उनका दण्ड होगा; उन पर निरीक्षण होगा
  rationale: शब्द अपने आप में निरीक्षण या भेंट/जाँच का अर्थ रख सकता है, पर इस प्रसंग में जाँच दण्डात्मक है। मुख्य पाठ मूल शब्द की प्रक्रिया और प्रसंगगत न्याय—दोनों को व्यक्त करता है।
- issue: ψυχαῖς का अर्थ-क्षेत्र
  choice: प्राणों
  alternative: आत्माओं; जीवनों
  rationale: यहाँ ψυχή मनुष्य के जीवन या आंतरिक व्यक्ति को सूचित कर सकता है। 'प्राण' जानबूझकर इस विस्तार को पूरी तरह किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
- issue: मूर्तियों का परमेश्वर की सृष्टि में होना
  choice: परमेश्वर की सृष्टि के बीच वे घृणित वस्तु ... बन गईं
  alternative: परमेश्वर की सृजी हुई वस्तुओं में वे घृणित बन गईं
  rationale: पाठ मूर्तियों को ईश्वरकृत घोषित नहीं करता, बल्कि सृष्टि के क्षेत्र में उनके विकृत और घृणित रूप ग्रहण करने की बात कहता है; अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के रखता है।
