  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: hi
  text: क्योंकि मनुष्यों के खोखले आत्मगौरव[b] के कारण संसार में उसका[a] प्रवेश हुआ, और इसी कारण उनका अंत संक्षिप्त हो, ऐसी योजना बनाई गई।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसका’ किसकी ओर संकेत करता है, यह यूनानी में स्पष्ट रूप से नहीं कहा गया; आसपास के प्रसंग में इसका संबंध मूर्तियों के उदय या मूर्तिपूजा से है।
    reason: alternative_reading
  - marker: b
    text: ‘खोखले आत्मगौरव’ का अनुवाद ‘व्यर्थ घमंड’ भी किया जा सकता है। यूनानी शब्द खोखली आत्म-प्रतिष्ठा या मिथ्या गौरव को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: ‘योजना बनाई गई’ निष्क्रिय रूप में है; यूनानी पाठ यह स्पष्ट नहीं करता कि योजना किसने बनाई।
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ
  choice: खोखले आत्मगौरव के कारण
  rationale: यह यूनानी शब्द निरर्थक या खोखली आत्म-प्रतिष्ठा का भाव रखता है। कारणसूचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘अहंकार’ से अधिक विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: ἀνθρώπων
  choice: मनुष्यों के
  rationale: यह सभी मनुष्यों के लिए प्रयुक्त सामान्य बहुवचन है; इसे लिंग-विशेष तक सीमित नहीं किया गया।
- source_word: εἰσῆλθεν
  choice: संसार में उसका प्रवेश हुआ
  rationale: यूनानी क्रिया का कर्ता स्पष्ट रूप से नहीं कहा गया है। हिन्दी में लिंगसूचक क्रिया से बचते हुए संज्ञात्मक रचना द्वारा इस अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
- source_word: κόσμον
  choice: संसार
  rationale: यहाँ κόσμος उस मानव-जगत को दर्शाता है जिसमें प्रसंगगत वस्तु का प्रवेश हुआ; ‘संसार’ इसका प्रचलित और स्वाभाविक हिन्दी रूप है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह वाक्य के दूसरे भाग को पहले भाग के परिणाम से स्पष्ट रूप से जोड़ता है।
- source_word: σύντομον
  choice: शीघ्र
  rationale: τέλος के साथ यह अंत के जल्द आने या अल्प समय में घटित होने का भाव देता है; ‘शीघ्र अंत’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: αὐτῶν
  choice: उनके
  rationale: यूनानी सर्वनाम बहुवचन है और निकटवर्ती प्रसंग में वर्णित मूर्तियों या प्रतिमाओं की ओर संकेत करता है; बहुवचन को सुरक्षित रखा गया है।
- source_word: τέλος
  choice: अंत
  rationale: ‘अंत’ यूनानी शब्द की व्यापकता को बनाए रखता है और अनावश्यक रूप से ‘विनाश’ या ‘दण्ड’ नहीं जोड़ता।
- source_word: ἐπενόηθη
  choice: योजना बनाई गई
  rationale: निष्क्रिय क्रिया किसी सोची या ठहराई गई योजना का भाव देती है। अनिर्दिष्ट कर्ता को स्पष्ट किए बिना निष्क्रिय वाच्य सुरक्षित रखा गया है।
theological_decisions:
- issue: εἰσῆλθεν का निहित कर्ता
  choice: मुख्य पाठ में ‘उसका’ रखा गया और उसका स्पष्ट संदर्भ नहीं जोड़ा गया।
  alternative: ‘मूर्तिपूजा संसार में आई’ या ‘मूर्तियाँ संसार में आईं।’
  rationale: यूनानी पाठ कर्ता को प्रसंग पर छोड़ता है। उसे सीधे ‘मूर्तिपूजा’ या ‘मूर्तियाँ’ कहना वास्तविक अस्पष्टता को हल कर देता; इसलिए न्यूनतम पूर्ति की गई और टिप्पणी में प्रसंग बताया गया।
- issue: ἐπενόηθη का कर्ता
  choice: ‘योजना बनाई गई’ के रूप में अनिर्दिष्ट निष्क्रिय वाच्य।
  alternative: ‘परमेश्वर ने उनके शीघ्र अंत की योजना बनाई’ या ‘उनका शीघ्र अंत ठहराया गया।’
  rationale: यूनानी पाठ योजना बनाने वाले का नाम नहीं बताता। मुख्य पाठ में परमेश्वर को कर्ता बनाना मूल से अधिक स्पष्ट धार्मिक निष्कर्ष जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। ‘खोखला आत्मगौरव’ मूल की विशिष्ट धारणा को सामने लाता है, जबकि ‘संसार में उसका प्रवेश हुआ’ यूनानी के अनकहे कर्ता के कारण उत्पन्न अस्पष्टता और हिन्दी की लिंग-संबंधी बाधा—दोनों को संतुलित करता है।
