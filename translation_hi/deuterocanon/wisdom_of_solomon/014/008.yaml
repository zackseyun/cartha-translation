  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: hi
  text: परन्तु हाथों से बनाई हुई वस्तु अभिशप्त है[a]—वह भी और उसे बनाने वाला भी; क्योंकि एक ओर उसने उसे बनाया, पर दूसरी ओर नाशवान वस्तु को ईश्वर कहा गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, संदर्भ में हाथों से बनाई हुई मूर्ति; यूनानी में शाब्दिक रूप से ‘हाथों से बनाई हुई वस्तु’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक देवता” कहा गया।
    reason: alternative_reading
lexical_decisions:
- source_word: χειρόποιητον
  choice: हाथों से बनाई हुई वस्तु
  rationale: यह यूनानी विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और उसका शाब्दिक अर्थ ‘हाथों से बनाया हुआ’ है। संदर्भ मूर्ति का है, फिर भी मूल पाठ में ‘मूर्ति’ संज्ञा स्पष्ट रूप से नहीं है, इसलिए व्यापक अभिव्यक्ति रखी गई है।
- source_word: ἐπικατάρατον
  choice: अभिशप्त
  rationale: यह शब्द किसी के शाप के अधीन होने का प्रबल धार्मिक-न्यायिक भाव व्यक्त करता है; ‘अभिशप्त’ हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ὁ ποιήσας αὐτό
  choice: उसे बनाने वाला
  rationale: कृदन्तीय पद का व्यक्तिगत अर्थ स्पष्ट रखते हुए अनावश्यक रूप से लिंग को प्रमुख नहीं बनाया गया है।
- source_word: ἠργάζετο
  choice: उसे गढ़ा
  rationale: क्रिया किसी वस्तु पर काम करने या उसे तैयार करने का संकेत देती है। मूर्ति-निर्माण के संदर्भ में ‘गढ़ा’ स्वाभाविक है और कारीगरी का भाव बनाए रखता है।
- source_word: φθαρτὸν
  choice: नाशवान वस्तु
  rationale: यह वस्तु की विनाशी और क्षयशील प्रकृति को उस पर लगाए गए दैवी नाम के विपरीत रखता है।
- source_word: θεὸς ὠνομάσθη
  choice: “ईश्वर” कहा गया
  rationale: यह अनुवाद उस विवादात्मक विडंबना को बनाए रखता है कि एक नाशवान वस्तु को दैवी पदनाम दिया गया। उद्धरण-चिह्न पदनाम के रूप में प्रयुक्त शब्द को स्पष्ट करते हैं, बिना मूल के दावे को स्वीकार किए।
theological_decisions:
- issue: क्या मुख्य पाठ में हस्तनिर्मित वस्तु को सीधे ‘मूर्ति’ कहा जाए
  choice: मूल की व्यापक अभिव्यक्ति ‘हाथों से बनाई हुई वस्तु’ रखी गई
  alternative: हाथों से बनाई हुई मूर्ति
  rationale: संदर्भ निस्संदेह मूर्तियों का है, पर χειρόποιητον में ‘मूर्ति’ संज्ञा प्रत्यक्ष नहीं है। मूल की अलंकारिक व्यापकता को बनाए रखना उचित है।
- issue: θεός को ‘ईश्वर’ या ‘एक देवता’ के रूप में प्रस्तुत करना
  choice: “ईश्वर” कहा गया
  alternative: ‘एक देवता’ कहा गया
  rationale: यूनानी में संज्ञा के साथ उपपद नहीं है। यहाँ बल एक नाशवान वस्तु को दैवी नाम दिए जाने पर है; ‘ईश्वर कहा गया’ इस तीखे विरोध को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
