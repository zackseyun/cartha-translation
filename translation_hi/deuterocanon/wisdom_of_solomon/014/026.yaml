  footnotes:
  - marker: a
    text: या ‘अनुग्रह को भुला देना।’ यूनानी χάρις का अर्थ प्रसंग के अनुसार उपकार, अनुग्रह या कृतज्ञता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘जन्म/उत्पत्ति का परिवर्तन या अदला-बदली।’ यूनानी पदबंध का ठीक आशय अनिश्चित है; इस प्रसंग में यह जन्म अथवा वंश-वृद्धि की व्यवस्था के भ्रष्ट या उलट जाने की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: उपकारों को भुला देना
  rationale: χάρις का अर्थ उपकार, कृपा या कृतज्ञता हो सकता है और ἀμνησία भूल जाने को दर्शाता है। इस दुर्गुण-सूची में यह अभिव्यक्ति प्राप्त उपकारों को याद न रखने और उससे निहित कृतघ्नता—दोनों का स्वाभाविक संकेत देती है।
- source_word: ψυχῶν μιασμός
  choice: आत्माओं का दूषित होना
  rationale: ψυχή के नैतिक-आत्मिक आयाम और μιασμός में निहित नैतिक अथवा धार्मिक अशुद्धि, दोनों को सुरक्षित रखता है।
- source_word: γενέσεως ἐναλλαγή
  choice: जन्म-क्रम में उलटफेर
  rationale: γένεσις जन्म, उत्पत्ति या वंश-वृद्धि को और ἐναλλαγή परिवर्तन, अदला-बदली या उलटफेर को व्यक्त कर सकता है। यूनानी पदबंध संक्षिप्त और संदिग्ध है; यह अनुवाद उसके नकारात्मक संदर्भ को व्यक्त करते हुए किसी एक विशिष्ट अर्थ को निर्णायक नहीं बनाता।
- source_word: γάμων ἀταξία
  choice: विवाहों में अव्यवस्था
  rationale: γάμος विवाह अथवा वैवाहिक बंधन और ἀταξία उचित व्यवस्था के अभाव को दर्शाता है। यह अनुवाद कदाचार का स्वरूप अनावश्यक रूप से सीमित नहीं करता।
- source_word: μοιχεία
  choice: व्यभिचार
  rationale: विवाह-बंधन के उल्लंघन के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: ἀσέλγεια
  choice: निर्लज्ज कामुकता
  rationale: ἀσέλγεια निर्लज्ज, असंयमित कामुक आचरण को दर्शाता है। यह पद उसकी तीव्रता और नैतिक स्वर को स्पष्ट तथा वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: χάριτος ἀμνησία में χάρις को स्पष्ट धार्मिक अर्थ वाले ‘अनुग्रह’ से अनूदित करना या सामान्य उपकार के अर्थ में
  choice: उपकारों को भुला देना
  alternative: अनुग्रह को भुला देना; कृतज्ञता का अभाव
  rationale: प्रसंग मूर्तिपूजा से उत्पन्न सामाजिक और नैतिक बुराइयों की सूची है, उद्धार-संबंधी अनुग्रह की सैद्धांतिक चर्चा नहीं। ‘उपकारों’ से व्यापक अर्थ बना रहता है, जबकि पाद-टिप्पणी वैध विकल्प बताती है।
- issue: ψυχῶν को ‘व्यक्तियों/जीवनों’ के बजाय ‘आत्माओं’ के रूप में रखना
  choice: आत्माओं का दूषित होना
  alternative: व्यक्तियों का दूषित होना; जीवनों का दूषित होना
  rationale: यह चयन बुद्धि-साहित्य की नैतिक-आत्मिक गंभीरता को बनाए रखता है, पर आत्मा के स्वरूप पर कोई बाद की व्यवस्थित धर्मशास्त्रीय धारणा नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त दुर्गुण-सूची का रूप रखा गया है। भाषा गरिमापूर्ण लेकिन सामान्य पाठक के लिए स्पष्ट है। समानांतर संज्ञात्मक पदों की लय बनाए रखते हुए आरंभ के पद को स्वाभाविक हिन्दी के लिए क्रियामूलक संज्ञा-वाक्यांश बनाया गया है।
