  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/027.yaml
  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: hi
  text: क्योंकि अनाम मूर्तियों की उपासना हर बुराई का आरम्भ, कारण और अंत है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नामरहित मूर्तियों’। यूनानी विशेषण इस बात पर बल दे सकता है कि इन मूर्तियों का कोई सच्चा या सम्मान के योग्य नाम नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘आरम्भ, कारण और अंत’ को ‘उद्गम, कारण और चरम परिणति’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  choice: उपासना
  rationale: यहाँ शब्द का आशय मूर्तियों के प्रति किए जाने वाले धार्मिक आचरण और भक्ति से है। ‘उपासना’ आधुनिक हिन्दी में स्वाभाविक है और व्यापक अर्थ वाले ‘धर्म’ की अपेक्षा प्रसंग को अधिक ठीक व्यक्त करता है।
- source_word: ἀνωνύμων
  choice: अनाम
  rationale: इस विशेषण का शाब्दिक अर्थ ‘नामरहित’ या ‘जिसका नाम न हो’ है। ‘अनाम’ इसकी संक्षिप्तता और अलंकारिक तीव्रता बनाए रखता है, पर यह तय नहीं करता कि मूर्तियाँ वास्तविक पहचान से रहित हैं या नाम लेने योग्य नहीं हैं।
- source_word: εἰδώλων
  choice: मूर्तियों
  rationale: इस प्रसंग में यह शब्द उपासना की वस्तु बने झूठे देव-प्रतिरूपों को सूचित करता है। ‘मूर्तियों’ हिन्दी में प्रचलित और प्रसंगानुकूल है; अनुवाद में अलग से ‘झूठे देवता’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: παντὸς ... κακοῦ
  choice: हर बुराई
  rationale: यह व्यापक संबंधकारक पदबंध है। ‘हर बुराई’ इसके सर्वसमावेशी दावे को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀρχὴ
  choice: आरम्भ
  rationale: ‘आरम्भ’ मूल की त्रिपदी—आरम्भ, कारण और अंत—की रचना को सीधे सुरक्षित रखता है और ‘उद्गम’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: αἰτία
  choice: कारण
  rationale: यहाँ संज्ञा कारणता व्यक्त करती है। ‘कारण’ मूल की संक्षिप्त त्रिपदी शैली बनाए रखता है।
- source_word: πέρας
  choice: अंत
  rationale: इस शब्द के अर्थ-क्षेत्र में अंत, सीमा और चरम परिणति शामिल हैं। ‘अंत’ मूल की तीखी त्रिपदी को सुरक्षित रखते हुए परिणति या पराकाष्ठा की सम्भावना खुली रखता है।
theological_decisions:
- issue: ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας की त्रिपदी को कैसे व्यक्त किया जाए
  choice: हर बुराई का आरम्भ, कारण और अंत
  alternative: हर बुराई का उद्गम, कारण और चरम परिणति
  rationale: मूल यूनानी वाक्य संक्षिप्त और बलपूर्ण है। चुना हुआ रूप उसकी शब्दरचना और व्यापक धार्मिक निन्दा को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ की सूचना पादटिप्पणी में दी जाती है।
- issue: मूर्तियों के विषय में ἀνωνύμων (‘अनाम’) का निहितार्थ
  choice: अनाम मूर्तियाँ
  alternative: नामरहित मूर्तियाँ
  rationale: मूल यह स्पष्ट नहीं करता कि ‘अनाम’ का अर्थ सच्ची पहचान का अभाव, स्थिर नाम का अभाव, या नाम लिए जाने के अयोग्य होना है। इसलिए अनुवाद उस तनाव को व्याख्या द्वारा हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आरम्भ, कारण और अंत’ की त्रिपदी मूल की अलंकारिक लय और अर्थगत तनाव को बनाए रखती है।
