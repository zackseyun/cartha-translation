    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: क्योंकि चाहे ... कोई ... हो
  rationale: κἄν (καί + ἐάν) रियायती अर्थ ‘चाहे’ देता है, जबकि γάρ पिछले कथन से व्याख्यात्मक संबंध ‘क्योंकि’ द्वारा बनाए रखता है।
- source_word: τέλειος
  choice: सिद्ध
  rationale: τέλειος के ‘पूर्ण, परिपक्व, सिद्ध’ अर्थों में ‘सिद्ध’ यहाँ व्यक्ति के उच्चतम मानवीय गुण या उपलब्धि का गरिमापूर्ण और संक्षिप्त बोध देता है।
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: मनुष्यों के पुत्रों में
  rationale: यह यूनानी में मानवजाति के लिए प्रयुक्त सामी शैली की पारंपरिक अभिव्यक्ति है। मुख्य पाठ स्रोत की पुरुषवाची संरचना रखता है; व्यापक मानवीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τῆς ἀπὸ σοῦ σοφίας
  choice: वह बुद्धि, जो तुझसे आती है
  rationale: ἀπό स्रोत या उद्गम बताता है; यह रूप स्पष्ट करता है कि बुद्धि का उद्गम परमेश्वर है और केवल स्वामित्व का भाव नहीं देता।
- source_word: ἀπούσης
  choice: अनुपस्थित हो
  rationale: संबंधवाचक कृदंत बुद्धि की अनुपस्थिति को परिणाम की परिस्थिति बनाता है। ‘अनुपस्थित’ अभाव को सीधे व्यक्त करता है, बिना उसे केवल अपर्याप्तता में बदलने के।
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: कुछ भी नहीं समझा जाएगा
  rationale: निष्क्रिय λογισθήσεται का अर्थ गिना, माना या समझा जाना है। यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए बाहरी मूल्यांकन का भाव सुरक्षित रखता है।
theological_decisions:
- issue: मानवजाति के लिए पुरुषवाची पारंपरिक अभिव्यक्ति
  choice: मुख्य पाठ में ‘मनुष्यों के पुत्रों में’ रखा गया
  alternative: मनुष्यों में / मानवजाति में
  rationale: ἐν υἱοῖς ἀνθρώπων की वास्तविक शब्द-रचना और सामी शैली को सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि अभिव्यक्ति का संदर्भ व्यापक रूप से मनुष्य मात्र से है।
- issue: मानवीय सिद्धता और ईश्वर-प्रदत्त बुद्धि के बीच तनाव
  choice: ‘सिद्ध’ और फिर भी ‘कुछ भी नहीं समझा जाएगा’ दोनों तीखे कथनों को यथावत रखा गया
  alternative: ‘बहुत परिपक्व’ अथवा ‘कम महत्त्वपूर्ण माना जाएगा’ जैसी नरम अभिव्यक्ति
  rationale: पद जानबूझकर सर्वोच्च मानवीय उपलब्धि को परमेश्वर से आने वाली बुद्धि के बिना शून्य ठहराता है; इसे नरम करना मूल का धार्मिक तनाव घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय लेकिन बोधगम्य शैली रखी गई है। प्रार्थना के प्रत्यक्ष संबोधन के अनुरूप ‘तुझसे’ चुना गया है। ‘सिद्ध’ और ‘अनुपस्थित’ मूल की औपचारिकता तथा तीखे मूल्यांकन को बनाए रखते हैं।
