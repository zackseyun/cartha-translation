base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: hi
  text: उसे पवित्र स्वर्गों से भेज दे, और अपनी महिमा के सिंहासन से उसे भेज; ताकि वह मेरे साथ रहकर परिश्रम करे[a], और मैं जान सकूँ कि तुझे क्या भाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, बुद्धि मेरे साथ उपस्थित रहकर परिश्रम करे। यूनानी पाठ में बुद्धि को स्त्रीलिंग व्यक्तिरूप में दिखाया गया है।
    reason: literary_personification
  - marker: b
    text: या, “तेरी दृष्टि में क्या स्वीकार्य है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν ἐξ ἁγίων οὐρανῶν
  choice: उसे पवित्र स्वर्गों से भेज दे
  rationale: ἐξαπόστειλον के बाहर/वहाँ से भेजने के दिशात्मक भाव और οὐρανῶν के बहुवचन को बनाए रखा गया है। पिछले संदर्भ की व्यक्तिरूप बुद्धि के लिए αὐτήν का स्वाभाविक हिन्दी रूप ‘उसे’ है।
- source_word: ἀπὸ θρόνου δόξης σου πέμψον αὐτήν
  choice: अपनी महिमा के सिंहासन से उसे भेज
  rationale: ‘महिमा के सिंहासन’ से यूनानी संबंधकारक रचना सुरक्षित रहती है; ‘अपना महिमामय सिंहासन’ अधिक व्याख्यात्मक होता। πέμψον को पहले क्रियापद के समानांतर सरल ‘भेज’ किया गया है।
- source_word: συνπαροῦσά μοι κοπιάσῃ
  choice: वह मेरे साथ रहकर परिश्रम करे
  rationale: συνπαροῦσα में वक्ता के साथ उपस्थित रहने और κοπιάσῃ में श्रम/परिश्रम का भाव है। यह रूप बुद्धि की सहभागिता को व्यक्त करता है, पर उसे मार्गदर्शन जैसी अतिरिक्त भूमिका नहीं देता।
- source_word: γνῶ τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: मैं जान सकूँ कि तुझे क्या भाता है
  rationale: γνῶ को प्रयोजनवाचक संदर्भ में ‘जान सकूँ’ और εὐάρεστον παρὰ σοί को सहज आधुनिक हिन्दी में ‘तुझे क्या भाता है’ किया गया है; इससे परमेश्वर की स्वीकृति/प्रसन्नता का संबंधपरक भाव बना रहता है।
theological_decisions:
- issue: बुद्धि का स्त्रीलिंग व्यक्तिरूप, जिसे स्वर्ग से भेजने की प्रार्थना की गई है
  choice: सर्वनाम ‘उसे/वह’ रखते हुए व्यक्तिरूप को सुरक्षित रखा गया
  alternative: बुद्धि को केवल निराकार गुण मानकर ‘यह/इसे’ कहना, या उसे किसी बाद की विशिष्ट धार्मिक पहचान से जोड़ना
  rationale: यूनानी αὐτήν और स्त्रीलिंग συνπαροῦσα बुद्धि को स्त्रीलिंग व्यक्तिरूप में प्रस्तुत करते हैं। हिन्दी में ‘बुद्धि’ भी स्त्रीलिंग है; पाठ इस चित्रण को बनाए रखता है, पर उससे आगे कोई सिद्धान्तगत पहचान नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमामय रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तुझे’ अपनाया गया है। ‘स्वर्गों’ का बहुवचन मूल यूनानी के बहुवचन को सुरक्षित रखता है।
