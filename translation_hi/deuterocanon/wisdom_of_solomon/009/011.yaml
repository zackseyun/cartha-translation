- source_word: ἐν ταῖς πράξεσί μου
  choice: मेरे कामों में
  rationale: πράξεις व्यावहारिक कार्यों, कर्मों या आचरण को सूचित करता है; ‘कामों’ से साधारण आधुनिक हिन्दी में इसका विस्तृत व्यावहारिक अर्थ मिलता है।
- source_word: σωφρόνως
  choice: विवेक से
