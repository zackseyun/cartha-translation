- source_word: φυλάξει
  choice: रक्षा करेगी
  rationale: क्रिया सावधानी से सुरक्षित रखने का अर्थ देती है; ‘रक्षा करेगी’ इसका संरक्षणात्मक बल स्पष्ट करती है।
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: अपनी महिमा से
  rationale: ἐν यहाँ साधन अथवा क्षेत्र, दोनों का संकेत दे सकता है। मुख्य पाठ में साधनार्थक अनुवाद स्वाभाविक है, जबकि स्थानार्थक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἐν τῇ δόξῃ αὐτῆς का अर्थ
  choice: 'साधनार्थक: ‘अपनी महिमा से’'
  alternative: 'स्थानार्थक: ‘अपनी महिमा में’; माध्यम का अधिक स्पष्ट रूप: ‘अपनी महिमा के द्वारा’'
  rationale: सन्दर्भ में बुद्धि सक्रिय रूप से मार्गदर्शन और संरक्षण करती है, इसलिए साधनार्थक अर्थ सहज है। फिर भी यूनानी ἐν स्थान अथवा साधन, दोनों व्यक्त कर सकता है; अतः दूसरी संभावना को पादटिप्पणी में रखा गया है।
