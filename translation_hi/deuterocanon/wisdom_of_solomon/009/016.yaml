base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: hi
  text: और पृथ्वी की बातों का हम कठिनाई से ही अनुमान लगा पाते हैं, और जो हमारे हाथ में है उसे भी परिश्रम से खोज पाते हैं; पर स्वर्गों की बातों की थाह किसने पाई है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह खोज निकाला है।” यूनानी क्रिया में किसी बात का पीछा करते हुए उसकी पूरी छानबीन करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: कठिनाई से ही
  rationale: यह मनुष्य की लगभग-असमर्थता और प्रयास—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰκάζομεν
  choice: अनुमान लगा पाते हैं
  rationale: क्रिया निश्चित ज्ञान नहीं, बल्कि अनुमान या संभावित निष्कर्ष का बोध कराती है; ‘अनुमान’ इस ज्ञानात्मक विनम्रता को बनाए रखता है।
- source_word: τὰ ἐπὶ γῆς
  choice: पृथ्वी की बातें
  rationale: यह पृथ्वी से संबंधित वस्तुओं और विषयों को व्यापक रूप से समेटता है तथा स्वर्गों की बातों के साथ समानांतरता रखता है।
- source_word: τὰ ἐν χερσὶν
  choice: जो हमारे हाथ में है
  rationale: यूनानी बिंब को सुरक्षित रखते हुए यह निकट, सामने या सुलभ बातों का मुहावरेदार संकेत देता है।
- source_word: εὑρίσκομεν
  choice: खोज पाते हैं
  rationale: साधारण ‘पाना’ से अधिक स्पष्ट रूप से प्रयास द्वारा जान लेने का भाव देता है, पर इसे तकनीकी अन्वेषण नहीं बनाता।
- source_word: μετὰ πόνου
  choice: परिश्रम से
  rationale: πόνος में श्रम, प्रयास और कठिनाई का भाव है; ‘परिश्रम’ dignified और सहज हिन्दी है।
- source_word: τὰ δὲ ἐν οὐρανοῖς
  choice: स्वर्गों की बातें
  rationale: बहुवचन οὐρανοῖς को ‘स्वर्गों’ के रूप में बनाए रखा गया है और पृथ्वी के साथ ब्रह्मांडीय विरोध स्पष्ट रहता है।
- source_word: τίς ἐξιχνίασεν
  choice: थाह किसने पाई है
  rationale: ἐξιχνιάζω के गहराई तक खोज निकालने या पदचिह्नों का अनुसरण कर पूरा पता लगाने के भाव को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
theological_decisions:
- issue: स्वर्गीय वास्तविकताओं के सामने मानवीय ज्ञान की सीमा
  choice: पृथ्वी की बातों को समझने की कठिनाई और स्वर्गों की बातों की थाह पाने में मानवीय असमर्थता के बीच आलंकारिक विरोध रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर की योजना’ या ‘स्वर्गीय रहस्यों’ के विषय में कहा जा सकता था।
  rationale: इस पद का यूनानी पाठ स्वयं परमेश्वर की योजना का स्पष्ट उल्लेख नहीं करता; इसलिए अगले संदर्भ की व्याख्या को यहाँ जोड़ने के बजाय मूल धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, चिंतनशील और गरिमापूर्ण रखी गई है। वाक्य की त्रिखंडीय समानांतर संरचना तथा पृथ्वी और स्वर्गों का विरोध सुरक्षित है; ‘हमारे हाथ में’ मूल यूनानी बिंब और निकट-सुलभ बातों की मुहावरेदार अर्थछाया दोनों को बनाए रखता है।
