- source_word: πολυφρόντιδα
  choice: बहुत-सी चिंताओं में डूबे
  rationale: अनेक चिंताओं या विचारों में व्यस्त होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ψυχή और νοῦς के बीच मानवशास्त्रीय भेद
  choice: ψυχή का ‘आत्मा’ और νοῦς का ‘मन’ अनुवाद किया गया है।
  alternative: ψυχή को ‘जीवन’ या ‘स्व’ और νοῦς को ‘बुद्धि’ कहा जा सकता है।
  rationale: मूल पद शरीर द्वारा आंतरिक जीवन और विचारशील क्षमता पर पड़ने वाले भार को समानांतर किंतु अलग शब्दों में व्यक्त करता है। दोनों को एक ही हिन्दी शब्द में मिला देने के बजाय यह भेद सुरक्षित रखा गया है।
- issue: शरीर के लिए तंबू का रूपक
  choice: σκῆνος को ‘तंबू’ के रूप में प्रत्यक्ष रखा गया है।
  alternative: इसे अर्थ खोलकर ‘देह’ या ‘निवास’ कहा जा सकता है।
  rationale: मूल का अस्थायी पार्थिव निवास वाला काव्यात्मक तनाव बनाए रखना उचित है; इसे सीधे शरीर कहना उस रूपक को चुपचाप सुलझा देता।
