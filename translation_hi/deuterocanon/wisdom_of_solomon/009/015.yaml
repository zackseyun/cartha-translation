  rationale: शब्द का अर्थ ‘पार्थिव’ या ‘धरती से बना’ है; यह चयन साधारण पाठक के लिए स्पष्ट है और मिट्टी/धरती से संबद्धता को सुरक्षित रखता है।
- source_word: σκῆνος
