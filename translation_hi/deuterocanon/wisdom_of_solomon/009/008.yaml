  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: hi
  text: तूने कहा कि तेरे पवित्र पर्वत पर एक मन्दिर बनाया जाए, और उस नगर में जहाँ तू निवास करता है, एक वेदी—उस पवित्र तम्बू[a] की प्रतिकृति, जिसे तूने आरम्भ से तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र मिलाप का तम्बू’; यूनानी शब्द का अर्थ सामान्य ‘तम्बू’ हो सकता है और बाइबलीय प्रयोग में पवित्र तम्बू भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας
  choice: तूने कहा
  rationale: λέγω के अओरिस्ट का सीधा अर्थ रखा गया है। सन्दर्भ में आज्ञा का भाव सम्भव है, पर क्रिया स्वयं ‘आज्ञा देना’ नहीं कहती।
- source_word: οἰκοδομῆσαι
  choice: बनाया जाए
  rationale: εἶπας के बाद आए infinitive को स्वाभाविक हिन्दी में अप्रत्यक्ष निर्देश के रूप में व्यक्त किया गया है।
- source_word: ναὸν
  choice: एक मन्दिर
  rationale: ναός मन्दिर अथवा पवित्रस्थान को सूचित करता है; यहाँ यरूशलेम का मन्दिर अभिप्रेत है, पर यूनानी में पद निश्चित उपपद के बिना है।
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: तेरे पवित्र पर्वत पर
  rationale: पर्वत जैसे स्थान के साथ हिन्दी में ‘पर’ स्वाभाविक है; ὄρος का सामान्य अर्थ ‘पर्वत’ है।
- source_word: πόλει κατασκηνώσεώς σου
  choice: तेरे निवास के नगर में
  rationale: κατασκήνωσις में बसने अथवा डेरा डालकर रहने का भाव है; ‘निवास’ ईश्वर की उपस्थितिमय बसाहट को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: θυσιαστήριον
  choice: एक वेदी
  rationale: बलिदान चढ़ाने की वेदी के लिए मानक हिन्दी बाइबलीय शब्द।
- source_word: μίμημα
  choice: प्रतिकृति
  rationale: यह किसी पूर्ववर्ती नमूने के अनुरूप बनी वस्तु को दर्शाता है। ‘प्रतिकृति’ निर्भर समानता को बनाए रखता है और अनावश्यक दार्शनिक व्याख्या नहीं जोड़ता।
- source_word: σκηνῆς ἁγίας
  choice: पवित्र तम्बू
  rationale: σκηνή का मूल अर्थ ‘तम्बू’ है और बाइबलीय सन्दर्भ में यह पवित्र मिलापवाले तम्बू को भी सूचित कर सकता है।
- source_word: ἣν προητοίμασας
  choice: जिसे तूने ... तैयार किया था
  rationale: προετοιμάζω में पहले से तैयार करने का भाव है; अगला कालवाचक पद इस पूर्वता को स्पष्ट करता है।
- source_word: ἀπʼ ἀρχῆς
  choice: आरम्भ से
  rationale: कालगत गहराई को बिना किसी अतिरिक्त दार्शनिक अर्थ के सुरक्षित रखने वाला सीधा अनुवाद।
