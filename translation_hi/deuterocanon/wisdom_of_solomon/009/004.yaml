translation:
  language: hi
  text: मुझे वह बुद्धि दे जो तेरे सिंहासनों के पास विराजमान है,[a] और मुझे अपनी सन्तानों में से अस्वीकार न कर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बुद्धि जो तेरे सिंहासन के पास विराजमान है।” यूनानी पाठ में “सिंहासन” बहुवचन में है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे अपने सेवकों में से अस्वीकार न कर,” क्योंकि यूनानी शब्द का अर्थ सन्दर्भ के अनुसार “सन्तानें” या “सेवक” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δός
  choice: दे
  rationale: δίδωμι के आज्ञार्थक रूप का यह सीधा, स्वाभाविक और प्रार्थना के अनुरूप हिन्दी रूप है।
- source_word: πάρεδρον
  choice: पास विराजमान है
  rationale: πάρεδρος किसी के पास आसन ग्रहण करने वाले को दर्शाता है। ‘पास विराजमान’ स्थानगत सिंहासन-बिम्ब और व्यक्तिरूप में प्रस्तुत बुद्धि—दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यह सामान्य अर्थ में भी सटीक है और इस ग्रन्थ में व्यक्तिरूप में प्रस्तुत बुद्धि के प्रमुख विषय को भी सुरक्षित रखता है।
- source_word: τῶν σῶν θρόνων
  choice: तेरे सिंहासनों
  rationale: यूनानी पाठ में θρόνων बहुवचन है; इसलिए असामान्य होने पर भी उसे मुख्य पाठ में सुरक्षित रखा गया है, न कि सन्दर्भ के आधार पर चुपचाप एकवचन किया गया।
- source_word: ἀποδοκιμάσῃς
  choice: अस्वीकार न कर
  rationale: यह क्रिया जाँच या परख के बाद ठुकराने का भाव रख सकती है। ‘अस्वीकार न कर’ स्पष्ट, स्वाभाविक और अनावश्यक रूप से तकनीकी नहीं है।
- source_word: ἐκ παίδων σου
  choice: अपनी सन्तानों में से
  rationale: παῖδες का अर्थ सन्तान या सेवक दोनों हो सकता है। यहाँ ईश्वर से सम्बन्ध की सन्तानगत छवि के कारण ‘सन्तानों’ को मुख्य पाठ में रखा गया है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वर के सम्बन्ध में παῖδες का अर्थ
  choice: सन्तानें
  alternative: सेवक
  rationale: शब्द दोनों अर्थों की अनुमति देता है। प्रार्थना के निकटवर्ती सन्दर्भ में सन्तानगत सम्बन्ध उपयुक्त जान पड़ता है, पर ‘सेवक’ को पादटिप्पणी में रखा गया है ताकि मूल की अर्थगत सम्भावना समाप्त न हो।
- issue: ईश्वर के सिंहासन का वचन
  choice: बहुवचन ‘सिंहासन’
  alternative: एकवचन ‘सिंहासन’
  rationale: यूनानी θρόνων स्पष्ट रूप से बहुवचन है। सम्भावित राजकीय या स्वर्गीय-दरबार की छवि का निर्णय किए बिना मूल रूप को बनाए रखा गया है; अधिक स्वाभाविक एकवचन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ईश्वर के लिए निकटतापूर्ण एकवचन ‘तू/तेरा’ शैली के अनुरूप ‘तेरे’ और ‘कर’ प्रयुक्त हुए हैं। ‘विराजमान’ सिंहासन-बिम्ब के अनुकूल है, किन्तु भाषा को अत्यधिक संस्कृतनिष्ठ नहीं बनाता।
