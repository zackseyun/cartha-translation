translation:
  language: hi
  text: और पवित्रता और न्यायपरायणता से संसार पर शासन करे, और सत्यनिष्ठ मन से न्याय करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέπῃ
  choice: शासन करे
  rationale: यह क्रिया संसार का संचालन, प्रबंध और शासन करने का भाव रखती है; संदर्भ में सहज और गरिमापूर्ण हिंदी के लिए ‘शासन करे’ चुना गया।
- source_word: ὁσιότητι
  choice: पवित्रता
  rationale: ईश्वर के प्रति उचित भक्ति और पवित्र आचरण का भाव; ‘पवित्रता’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: नैतिक न्यायशीलता और सही आचरण के व्यापक भाव को बनाए रखता है।
- source_word: εὐθύτητι ψυχῆς
  choice: मन की सच्चाई
  rationale: शाब्दिक रूप से ‘प्राण/मन की सीधाई’; आधुनिक हिंदी में आंतरिक निष्कपटता और खरापन व्यक्त करने के लिए यह स्वाभाविक रूप है।
- source_word: κρίσιν κρίνῃ
  choice: न्याय करे
  rationale: यूनानी समजातीय पदबंध का आशय न्याय करना या निर्णय सुनाना है; हिंदी में अनावश्यक पुनरुक्ति से बचते हुए सीधा अर्थ दिया गया।
theological_decisions:
- issue: ὁσιότης और δικαιοσύνη के दो पृथक नैतिक पद
  choice: ‘पवित्रता और धार्मिकता’ के रूप में दोनों को अलग रखा
  alternative: ‘भक्ति और न्याय’ अथवा दोनों को मिलाकर एक नैतिक पद
  rationale: मूल में दोनों गुण स्पष्ट रूप से समन्वित हैं; उन्हें मिलाने से अर्थ-सूक्ष्मता घटती।
- issue: ψυχή का अर्थक्षेत्र
  choice: ‘मन’
  alternative: ‘आत्मा’ या ‘प्राण’
  rationale: यहाँ न्याय करने वाले व्यक्ति की आंतरिक वृत्ति और निष्कपटता केंद्र में है; ‘मन’ आधुनिक हिंदी में इसे सबसे स्वाभाविक ढंग से व्यक्त करता है, बिना किसी विशिष्ट आत्मा-सिद्धांत को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनात्मक संदर्भ के अनुरूप गरिमापूर्ण, स्पष्ट और सहज शैली। वाक्य की आश्रित क्रिया-रचना बनाए रखने के लिए ‘करे’ का प्रयोग किया गया है।
