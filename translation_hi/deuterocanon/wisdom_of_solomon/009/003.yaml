  naturalness: The sentence is grammatical and appropriately elevated. ‘सत्यनिष्ठ मन से’ is a more idiomatic and precise modern-Hindi expression for judging with inward uprightness.
  terminology: Use ‘न्यायपरायणता’ for δικαιοσύνη here, preserving its ethical/judicial sense without conflating it with religious devotion. Retain ‘पवित्रता’ for ὁσιότης.
