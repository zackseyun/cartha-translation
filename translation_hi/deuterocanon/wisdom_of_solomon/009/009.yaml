base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: hi
  text: और आपके साथ वह बुद्धि है, जो आपके कार्यों को जानती है और उस समय उपस्थित थी जब आप संसार[a] की रचना कर रहे थे; वह समझती है कि आपकी दृष्टि में क्या मनभावन है और आपकी आज्ञाओं के अनुसार क्या सही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुव्यवस्थित जगत।” यूनानी शब्द κόσμος संसार की सुव्यवस्था पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: आपके साथ
  rationale: यह निकट संगति और साथ होने का भाव रखता है; ‘आपके साथ’ आधुनिक हिन्दी में स्वाभाविक और सम्मानसूचक है।
- source_word: ἡ σοφία ἡ εἰδυῖα
  choice: वह बुद्धि, जो ... जानती है
  rationale: ‘बुद्धि’ σοφία का मानक रूप है। स्त्रीलिंग कृदन्त द्वारा हुए व्यक्तिकरण को ‘जो ... जानती है’ से सुरक्षित रखा गया है।
- source_word: τὰ ἔργα σου
  choice: आपके कार्यों
  rationale: ‘कार्य’ परमेश्वर के कामों और कृत्यों की व्यापकता को बिना नैतिक अर्थ तक सीमित किए व्यक्त करता है।
- source_word: παροῦσα
  choice: उपस्थित थी
  rationale: यह सृष्टि के समय बुद्धि की उपस्थिति को सीधे व्यक्त करता है और मूल में निहित न होने वाली अतिरिक्त स्थानिक छवि नहीं जोड़ता।
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: जब आप संसार की रचना कर रहे थे
  rationale: अपूर्ण भूतकाल ἐποίεις की जारी क्रिया को ‘कर रहे थे’ व्यक्त करता है। κόσμος के लिए सुलभ ‘संसार’ चुना गया है, जबकि ‘रचना’ बनाने के सृजनात्मक संदर्भ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπισταμένη
  choice: समझती है
  rationale: यह सूचित ज्ञान और विवेकपूर्ण समझ का भाव देता है तथा पहले आए ‘जानती है’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: आपकी दृष्टि में क्या मनभावन है
  rationale: ‘दृष्टि में’ मूल की दृष्टि-संबंधी अभिव्यक्ति को बनाए रखता है; ‘मनभावन’ स्वीकार्य और प्रसन्न करने वाले अर्थ को व्यक्त करता है।
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: आपकी आज्ञाओं के अनुसार क्या सही है
  rationale: नैतिक संदर्भ में εὐθές के सीधेपन/खरेपन का स्वाभाविक हिन्दी अर्थ ‘सही’ है; ‘के अनुसार’ आज्ञाओं को मानक के रूप में व्यक्त करता है।
theological_decisions:
- issue: बुद्धि का व्यक्तिकरण
  choice: ‘वह बुद्धि, जो ... जानती है ... उपस्थित थी; वह समझती है’
  alternative: इसे केवल अमूर्त गुण की तरह कहना, या ‘बुद्धि’ को किसी बाद की विशिष्ट धर्मवैज्ञानिक पहचान से जोड़ना
  rationale: यूनानी स्त्रीलिंग कृदन्त बुद्धि को स्पष्ट रूप से व्यक्तिकृत करते हैं। हिन्दी में स्त्रीलिंग क्रियाओं और सर्वनाम से यह तनाव सुरक्षित रहता है, पर पद से आगे बढ़कर कोई सिद्धान्तगत पहचान आरोपित नहीं होती।
- issue: κόσμος का अर्थ
  choice: संसार
  alternative: ब्रह्माण्ड; सुव्यवस्थित जगत
  rationale: यहाँ शब्द परमेश्वर की बनाई हुई व्यवस्थित सृष्टि को दर्शाता है। ‘संसार’ सामान्य पाठक के लिए स्वाभाविक है; वैकल्पिक सूक्ष्म अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानसूचक ‘आप’ अपनाया गया है। शैली प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है; व्यक्तिकृत बुद्धि को स्त्रीलिंग रूपों द्वारा स्पष्ट किया गया है।
