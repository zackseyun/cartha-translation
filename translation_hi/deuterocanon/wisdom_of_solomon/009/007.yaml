  rationale: वाक्य के आरम्भ में आए स्पष्ट सर्वनाम का बल बनाए रखा गया है; प्रार्थना में परमेश्वर को सीधे संबोधित करने के लिए ‘तू’ स्वाभाविक और गरिमापूर्ण है।
- source_word: προείλω
  choice: मुझे पहले से चुनकर ... ठहराया है
  rationale: यह रूप पूर्व-चयन का भाव व्यक्त करता है। हिन्दी में ‘पहले से चुनकर ... ठहराया’ व्यक्तिगत चुनाव और पद-नियुक्ति, दोनों को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: βασιλέα λαοῦ σου
  choice: अपनी प्रजा का राजा
  rationale: βασιλέα का सीधा अर्थ ‘राजा’ है और सम्बन्धवाचक λαοῦ σου को स्वाभाविक हिन्दी में ‘अपनी प्रजा का’ कहा गया है।
- source_word: δικαστὴν
  choice: न्यायी
  rationale: यह शब्द न्यायिक निर्णय देने वाले व्यक्ति को दर्शाता है। ‘न्यायी’ इस पदगत अर्थ को रखता है और ‘न्याय करने वाला’ की अपेक्षा अधिक संक्षिप्त है।
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: अपने पुत्रों और पुत्रियों का
  rationale: यूनानी पाठ में दोनों लिंग स्पष्ट रूप से अलग-अलग कहे गए हैं; इसलिए उन्हें सामान्य ‘सन्तानों’ में नहीं समेटा गया।
