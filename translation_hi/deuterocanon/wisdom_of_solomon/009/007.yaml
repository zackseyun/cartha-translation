  verdict: revise
  source_fidelity: The draft correctly retains the explicit divine subject, prior-choice nuance of προείλω, the two offices, and the explicit pairing of sons and daughters. However, ‘चुनकर ... ठहराया है’ makes the Greek’s single verb do double duty and introduces an appointing action into the main text. The aorist is more directly represented by ‘चुना है.’
  naturalness: ‘न्यायी’ ordinarily means ‘just/righteous’ in modern Hindi, rather than a judicial officeholder. ‘न्यायाधीश’ is the standard, clear term for δικαστής. The revised parallel construction is also smoother.
  terminology: ‘राजा,’ ‘प्रजा,’ and ‘न्यायाधीश’ accurately convey the royal and judicial terminology. ‘पुत्रों और पुत्रियों’ preserves the source’s explicit gendered pair. The retained ‘तूने’ fits a prayerful, elevated biblical register.
  issues:
  - severity: medium
    issue: ‘न्यायी’ is used for δικαστής.
    rationale: In contemporary standard Hindi, ‘न्यायी’ primarily denotes someone who is just or righteous; it does not clearly identify the legal role of a judge. ‘न्यायाधीश’ preserves the source’s judicial sense.
  - severity: low
    issue: The main clause renders one Greek verb as ‘चुनकर ... ठहराया है.’
    rationale: The Greek states that God chose the speaker beforehand as king and judge. Adding ‘ठहराया’ to the main rendering can blur the lexical focus on prior choice; appointment may remain a footnoted alternative.
