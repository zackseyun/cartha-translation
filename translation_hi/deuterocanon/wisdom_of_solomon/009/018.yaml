translation:
  language: hi
  text: और इस प्रकार पृथ्वी पर रहनेवालों के मार्ग सीधे किए गए, और मनुष्यों को वे बातें सिखाई गईं जो तुझे भाती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωρθώθησαν
  choice: सीधे किए गए
  rationale: कर्मवाच्य क्रिया सुधारने अथवा सीधा करने का भाव रखती है। τρίβοι के साथ यह चयन मार्ग के रूपक को बनाए रखता है।
- source_word: τρίβοι
  choice: मार्ग
  rationale: यह शब्द पगडंडी, बाट या मार्ग को दर्शाता है। ‘मार्ग’ हिन्दी में ठोस चित्र और नैतिक जीवन-पथ, दोनों अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν ἐπὶ γῆς
  choice: पृथ्वी पर रहनेवालों के
  rationale: मूल पद पृथ्वी पर विद्यमान लोगों के लिए व्यापक रूप से प्रयुक्त है; ‘रहनेवालों’ से हिन्दी में संबंध स्पष्ट और सहज होता है।
- source_word: ἀρεστά
  choice: वे बातें ... जो तुझे भाती हैं
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘वे बातें’ बहुवचन को बनाए रखता है और ‘जो तुझे भाती हैं’ स्वीकार्यता/प्रसन्नता का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἐδιδάχθησαν
  choice: सिखाई गईं
  rationale: यूनानी कर्मवाच्य को हिन्दी में कर्मवाच्य रूप से रखा गया है, जिससे शिक्षा दिए जाने का भाव सुरक्षित रहता है।
- source_word: ἄνθρωποι
  choice: मनुष्यों
  rationale: यहाँ शब्द समस्त मानवजाति के लोगों के लिए सामान्य अर्थ में है। ‘मनुष्य’ आधुनिक हिन्दी में स्त्री-पुरुष दोनों को समेटता है और मूल के मानवीय व्यापक संदर्भ को ठीक व्यक्त करता है।
theological_decisions:
- issue: ἄνθρωποι का सामान्य मानवीय अर्थ
  choice: मनुष्यों
  alternative: पुरुषों
  rationale: यद्यपि यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, संदर्भ में इसका आशय केवल पुरुषों से नहीं बल्कि मानवजाति से है। हिन्दी ‘मनुष्य’ इसी व्यापक अर्थ को बिना अतिरिक्त व्याख्या के सटीक रूप से व्यक्त करता है।
- issue: ईश्वर को संबोधन में σου
  choice: तुझे
  alternative: आपको
  rationale: एकवचन दूसरे पुरुष के मूल रूप को बनाए रखने और बाइबिलीय प्रार्थना की प्रचलित गरिमामय शैली के अनुरूप ‘तुझे’ चुना गया है; इससे अनौपचारिकता नहीं, सीधा दैवी संबोधन व्यक्त होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सहज प्रार्थनात्मक शैली। वाक्य की समानांतर संरचना तथा मार्ग का रूपक सुरक्षित रखा गया है; अनावश्यक रूप से संस्कृतनिष्ठ शब्दावली से बचा गया है।
