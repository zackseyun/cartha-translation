    reason: alternative_reading
lexical_decisions:
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: यहाँ संबंधवाचक सर्वनाम के साथ करण कारक का भाव है—परमेश्वर ने अपनी बुद्धि से रचना की। ‘बुद्धि’ इस पुस्तक में इस शब्द के साहित्यिक और धर्मवैचारिक महत्त्व को बनाए रखता है।
- source_word: κατεσκεύασας
  choice: रचना की
  rationale: क्रिया का अर्थ बनाना, तैयार करना या गढ़ना हो सकता है। सृष्टि के प्रसंग में ‘रचना की’ स्वाभाविक और गरिमापूर्ण है तथा यांत्रिक अर्थ से बचता है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यूनानी में एकवचन है और सृष्टि-वर्णन की प्रतिनिधिक भाषा में पूरी मानवजाति का बोध करा सकता है। हिंदी ‘मनुष्य’ एकवचन रूप और व्यापक मानवीय अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἵνα δεσπόζῃ
  choice: ताकि वह ... पर शासन करे
  rationale: ἵνα उद्देश्य व्यक्त करता है और δεσπόζῃ अधिकारपूर्वक शासन करने का भाव रखता है। यह अनुवाद अधिकार के अर्थ को स्पष्ट रखता है, बिना उससे अधिक अर्थ जोड़े।
- source_word: τῶν ... κτισμάτων
  choice: रचे हुए प्राणियों
  rationale: κτίσματα रची हुई सत्ताओं या वस्तुओं को सूचित कर सकता है। ‘प्राणियों’ हिंदी में स्वाभाविक है; व्यापक ‘सृष्ट वस्तुओं’ का अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ὑπὸ σοῦ γενομένων
  choice: आपके रचे हुए
  rationale: यह कृदंत-वाक्यांश सृष्ट प्राणियों के परमेश्वर से अस्तित्व पाने को बताता है। ‘आपके रचे हुए’ हिंदी में संक्षिप्त और स्वाभाविक ढंग से उसी कर्तृत्व को व्यक्त करता है।
theological_decisions:
- issue: सृष्टि-वर्णन में ἄνθρωπον का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति; एक मनुष्य
  rationale: एकवचन को बनाए रखते हुए ‘मनुष्य’ उस प्रतिनिधिक अर्थ को भी व्यक्त कर सकता है जिसमें आदिम मनुष्य के द्वारा समस्त मानवता का संकेत है; पाठ किसी एक लिंग तक अर्थ को सीमित नहीं करता।
- issue: सृष्टि पर δεσπόζῃ के अधिकार की तीव्रता
  choice: शासन करे
  alternative: प्रभुता रखे; अधिकार चलाए
  rationale: ‘शासन करे’ वास्तविक अधिकार को सुरक्षित रखता है और उत्पत्ति के सृष्टि-आदेश की प्रतिध्वनि से मेल खाता है, पर पाठ से बाहर की किसी विशेष व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली प्रार्थनापरक, सरल और गरिमापूर्ण रखी गई है। ‘मनुष्य’ प्रतिनिधिक एकवचन को और ‘शासन करे’ अधिकार के स्पष्ट भाव को बनाए रखता है।
