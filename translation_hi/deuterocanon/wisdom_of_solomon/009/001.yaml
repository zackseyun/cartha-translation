- source_word: θεὲ πατέρων
  choice: हे पूर्वजों के परमेश्वर
  rationale: θεέ संबोधन कारक में है, इसलिए हिन्दी में प्रत्यक्ष संबोधन के लिए ‘हे’ स्वाभाविक है। πατέρων में कोई स्पष्ट स्वत्ववाचक सर्वनाम नहीं है; ‘पूर्वजों के’ उस अनिर्दिष्ट पैतृक अर्थ को बनाए रखता है।
- source_word: Κύριε τοῦ ἐλέους σου
  choice: अपनी दया के प्रभु
  rationale: मूल यूनानी में ‘तेरी/अपनी दया’ का स्पष्ट σου है। हिन्दी में उसी संबोधित प्रभु की दया बताने के लिए ‘अपनी’ स्वाभाविक है और संबंधवाचक रचना को सुरक्षित रखता है।
- source_word: ὁ ποιήσας
  choice: जिन्होंने ... बनाया
  rationale: कर्ता की पहचान कराने वाले अओरिस्ट कृदंत को आदरसूचक हिन्दी संबंधवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह व्यापक और सहज आधुनिक हिन्दी है तथा सृष्टि की समग्रता को बिना विस्तार किए व्यक्त करता है।
- source_word: ἐν λόγῳ σου
  choice: अपने वचन के द्वारा
  rationale: ἐν यहाँ साधन का अर्थ देता है। ‘वचन’ λόγος की मूल अभिव्यक्ति और उसके संभावित धर्मवैचारिक तथा अंतर्पाठीय संकेतों को सुरक्षित रखता है।
