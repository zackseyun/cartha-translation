  text: For what man can know the counsel of God? Or who can discern what the Lord wills?[a]
translation:
  language: hi
  text: क्योंकि कौन मनुष्य परमेश्वर की योजना जान सकता है? या कौन समझ सकता है कि प्रभु क्या चाहता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि कौन मनुष्य परमेश्वर का अभिप्राय जान सकता है? या कौन मन में विचार कर सकता है कि प्रभु क्या चाहता है?”
    reason: βουλή के लिए ‘अभिप्राय’ और ἐνθυμηθήσεται के अधिक शाब्दिक ‘मन में विचार कर सकता है’ विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: क्योंकि कौन मनुष्य
  rationale: ἄνθρωπος यहाँ एकवचन में समस्त मानवजाति का प्रतिनिधित्व करता है। ‘कौन मनुष्य’ यूनानी रूप और आलंकारिक प्रश्न की शक्ति को बनाए रखता है।
- source_word: γνώσεται
  choice: जान सकता है
  rationale: भविष्यत्कालीन रूप इस आलंकारिक प्रश्न में मानवीय सामर्थ्य की सीमा प्रकट करता है; इसलिए हिन्दी में ‘जान सकता है’ स्वाभाविक और अर्थानुकूल है।
- source_word: βουλὴν θεοῦ
  choice: परमेश्वर की योजना
  rationale: βουλή में परामर्श, अभिप्राय, प्रयोजन या योजना का भाव हो सकता है। ‘योजना’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ परमेश्वर के ठहराए हुए अभिप्राय को बिना अनावश्यक सिद्धान्तीकरण के व्यक्त करती है।
- source_word: ἐνθυμηθήσεται
  choice: समझ सकता है
  rationale: क्रिया मन में विचार करने, सोच-विचारकर ग्रहण करने का भाव रखती है। समानान्तर आलंकारिक प्रश्न में ‘समझ सकता है’ प्रभु की इच्छा को मानसिक रूप से ग्रहण कर पाने की बात स्पष्ट करता है।
- source_word: τί θέλει
  choice: क्या चाहता है
  rationale: θέλει इच्छा या चाह को व्यक्त करता है। ‘क्या चाहता है’ आधुनिक मानक हिन्दी में सहज है और ईश्वरीय इच्छा का मूल भाव सुरक्षित रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: इस ईश्वरीय संदर्भ में κύριος के लिए प्रतिष्ठित और स्वाभाविक हिन्दी पद ‘प्रभु’ है।
theological_decisions:
- issue: एकवचन सामान्यवाची ἄνθρωπος
  choice: मनुष्य
  alternative: इंसान; व्यक्ति
  rationale: ‘मनुष्य’ एकवचन और सामान्य मानव-संदर्भ दोनों को बनाए रखता है तथा गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- issue: βουλή और θέλει में ईश्वरीय अभिप्राय
  choice: योजना ... चाहता है
  alternative: मंत्रणा ... इच्छा करता है; अभिप्राय ... चाहता है
  rationale: यह शब्दावली परमेश्वर के अभिप्राय और इच्छा तक मानवीय पहुँच की सीमा को स्पष्ट करती है, पर βουλή और θέλει को किसी विशेष धर्मवैज्ञानिक प्रणाली में नहीं बाँधती।
- issue: ἐνθυμηθήσεται की मानसिक क्रिया
  choice: समझ सकता है
  alternative: मन में विचार कर सकता है; पूरी तरह सोच सकता है
  rationale: मूल शब्द विचार करने की प्रक्रिया और उसके द्वारा ग्रहण करने—दोनों की गुंजाइश रखता है। मुख्य पाठ में सहज हिन्दी चुनी गई है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आलंकारिक है। दोनों प्रश्नों की समानान्तर संरचना तथा मानवीय ज्ञान की सीमा पर मूल यूनानी का बल बनाए रखा गया है।
