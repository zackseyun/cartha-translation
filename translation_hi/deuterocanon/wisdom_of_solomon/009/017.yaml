  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: hi
  text: और तेरी योजना को कौन जान सकता था, यदि तूने बुद्धि न दी होती और ऊपर से अपनी पवित्र आत्मा[a] न भेजी होती?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “आत्मा” या “श्वास” भी हो सकता है; यहाँ “आत्मा” संदर्भ के अनुकूल है। मूल पदबंध अपने आप यह निश्चित नहीं करता कि इसे एक विशिष्ट व्यक्तिगत उपाधि के रूप में समझा जाए।
    reason: मूल शब्द की अर्थ-व्याप्ति और धर्मवैचारिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: βουλήν
  choice: योजना
  rationale: यह शब्द परामर्श, उद्देश्य या योजना का अर्थ दे सकता है। यहाँ “योजना” सहज आधुनिक हिन्दी में परमेश्वर के विचार और उद्देश्य को व्यक्त करती है, बिना इसे केवल इच्छा या अपरिवर्तनीय आदेश तक सीमित किए।
- source_word: ἔγνω
  choice: जान पाया होता
  rationale: 'अओरिस्ट क्रिया को εἰ μή वाले वाक्य के साथ हिन्दी में संभाव्य-विपरीत परिस्थिति के रूप में व्यक्त करना स्वाभाविक है: बुद्धि और आत्मा दिए बिना कोई परमेश्वर की योजना नहीं जान सकता था।'
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में σοφία का स्थापित और व्यापक हिन्दी पर्याय “बुद्धि” है; इसमें समझ के साथ नैतिक और आध्यात्मिक विवेक भी निहित है।
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: अपनी पवित्र आत्मा
  rationale: πνεῦμα के लिए “आत्मा” इस ज्ञानपरक और ईश्वरीय संदर्भ में स्वाभाविक है। देवनागरी में बड़े-छोटे अक्षरों का भेद न होने से हिन्दी पाठ यूनानी के द्वारा खुला छोड़ा गया व्यक्तिगत अथवा सामान्य अर्थ स्वयं निर्धारित नहीं करता।
- source_word: ἀπὸ ὑψίστων
  choice: ऊँचाइयों से
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग स्वर्गीय ऊँचाइयों की ओर संकेत करता है। “ऊँचाइयों से” बहुवचन और ऊर्ध्व, स्वर्गीय स्रोत—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या “पवित्र आत्मा” को स्पष्ट रूप से एक विशिष्ट दिव्य व्यक्तित्व की उपाधि माना जाए
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मिक शक्ति / पवित्र श्वास
  rationale: यूनानी पदबंध का शाब्दिक अर्थ “तेरी पवित्र आत्मा/वायु/श्वास” हो सकता है, पर इस संदर्भ में “आत्मा” सबसे स्वाभाविक है। हिन्दी लिपि में capitalization का भेद नहीं है, इसलिए अनुवाद बाद की धर्मसैद्धांतिक पहचान को न तो थोपता है, न नकारता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “जान पाया होता… यदि… न दी होती… न भेजी होती” हिन्दी में यूनानी आलंकारिक प्रश्न और उसकी शर्त को स्वाभाविक ढंग से व्यक्त करता है।
