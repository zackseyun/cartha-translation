- source_word: δικαίως
  choice: न्यायपूर्वक
  rationale: यूनानी क्रियाविशेषण के ‘न्यायसंगत ढंग से’ अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θρόνων
  choice: सिंहासनों
  rationale: स्रोत-पाठ में बहुवचन है; असामान्य होने पर भी उसे एकवचन में बदलकर अर्थ को चुपचाप सरल नहीं किया गया।
