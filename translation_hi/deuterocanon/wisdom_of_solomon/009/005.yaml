lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: ‘दास’ अधीन और बँधी हुई स्थिति का भाव सुरक्षित रखता है, फिर भी आधुनिक हिन्दी के प्रार्थनात्मक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: तेरी दासी का पुत्र
  rationale: ‘दासी’ स्त्रीलिंग सेवक-दासता की सामाजिक स्थिति को व्यक्त करती है और δοῦλος के साथ जानबूझकर रखी गई समानता बनाए रखती है।
- source_word: ἄνθρωπος ἀσθενὴς
  choice: एक निर्बल ... मनुष्य
  rationale: वक्ता अपने मानवीय सामर्थ्य की कमी स्वीकार करता है; ‘निर्बल मनुष्य’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ὀλιγόχρονιος
  choice: अल्पायु
  rationale: यह कम समय या थोड़े वर्षों के जीवन को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἐλάσσων ἐν συνέσει
  choice: समझने में अपर्याप्त
  rationale: तुलनात्मक ἐλάσσων यहाँ अपेक्षित समझ की कमी या अपर्याप्तता बताता है; हिन्दी में शाब्दिक ‘छोटा’ की अपेक्षा यह अर्थ अधिक स्पष्ट है।
- source_word: κρίσεως καὶ νόμων
  choice: न्याय तथा नियमों
  rationale: ‘न्याय’ κρίσις के न्यायिक निर्णय वाले अर्थ को खुला रखता है और बहुवचन ‘नियमों’ νόμων की संख्या सुरक्षित रखता है।
theological_decisions:
- issue: प्रार्थना में दासता-सूचक भाषा
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: मूल यूनानी वक्ता की परमेश्वर के सामने अधीन और निम्न स्थिति पर बल देता है। ‘दास/दासी’ उस तीव्रता को बिना सांप्रदायिक अर्थ जोड़े सुरक्षित रखता है।
- issue: κρίσις का आशय
  choice: न्याय
  alternative: निर्णय / न्याय करने की क्षमता
  rationale: ‘न्याय’ न्यायिक और शासकीय दोनों संदर्भों के लिए पर्याप्त व्यापक है; अधिक व्याख्यात्मक अनुवाद मूल की अर्थ-सीमा को अनावश्यक रूप से संकुचित करता।
