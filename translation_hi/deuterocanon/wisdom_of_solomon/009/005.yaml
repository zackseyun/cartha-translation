  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली। ‘तेरा/तेरी’ का प्रयोग परमेश्वर को सीधे संबोधन और एकवचन यूनानी σός/σου के अनुरूप है। वाक्य को सहज बनाने के लिए डैश लगाया गया है; कोई अतिरिक्त व्याख्यात्मक सामग्री नहीं जोड़ी गई।
