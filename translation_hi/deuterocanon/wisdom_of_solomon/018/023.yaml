translation:
  language: hi
  text: क्योंकि मृत लोग पहले ही ढेरों में एक-दूसरे पर गिर पड़े थे; तब उसने उनके बीच खड़े होकर क्रोध को रोक दिया और जीवितों की ओर जाने वाले मार्ग को काट दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: ढेरों में
  rationale: यह क्रियाविशेषण शवों के ढेर लगने का चित्र देता है; ‘ढेरों में’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: πεπτωκότων
  choice: गिर पड़े थे
  rationale: पूर्ण कृदन्त पहले घट चुकी क्रिया और उससे बनी अवस्था दोनों प्रकट करता है; ‘गिर पड़े थे’ इस पूर्वपूर्णता को रखता है।
- source_word: ἐπʼ ἀλλήλων
  choice: एक-दूसरे पर
  rationale: यह शवों के एक के ऊपर एक पड़े होने का सजीव भौतिक चित्र सुरक्षित रखता है।
- source_word: μεταξὺ στὰς
  choice: उनके बीच खड़े होकर
  rationale: वाक्यांश दो ओर के बीच मध्यस्थ स्थान लेने को दर्शाता है; सन्दर्भ में मृतकों और जीवितों के बीच खड़ा होना अभिप्रेत है, पर दोनों समूहों को स्पष्ट रूप से जोड़कर नहीं दिया गया।
- source_word: ἀνέκοψεν
  choice: रोक दिया
  rationale: क्रिया का अर्थ आगे बढ़ती हुई किसी वस्तु को रोकना या थामना है; ‘रोक दिया’ स्पष्ट और स्वाभाविक है।
- source_word: τὴν ὀργήν
  choice: प्रकोप
  rationale: यहाँ शब्द दैवी दण्ड के सक्रिय प्रकटाव को सूचित करता है। ‘प्रकोप’ साधारण क्रोध से अधिक गंभीर है और आगे बढ़ते विनाश के प्रसंग से मेल खाता है।
- source_word: διέσχισεν
  choice: काट दिया
  rationale: मूल क्रिया चीरने या अलग कर देने का प्रबल बिंब रखती है; मार्ग के साथ ‘काट दिया’ उस बिंब और परिणाम दोनों को बनाए रखता है।
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: जीवितों की ओर जाने वाला मार्ग
  rationale: यह प्रकोप के जीवित लोगों तक पहुँचने के मार्ग का रूपक है; हिन्दी रूप उस दिशा और रूपक दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: निहित कर्ता का परिचय
  choice: मूल की तरह केवल ‘उसने’ रखा गया
  alternative: स्पष्टता के लिए ‘हारून ने’ जोड़ना
  rationale: यूनानी में कर्ता निहित है और निकटवर्ती प्रसंग से पहचाना जाता है। नाम जोड़ना व्याख्यात्मक विस्तार होता।
- issue: ὀργή का स्वरूप
  choice: ‘प्रकोप’
  alternative: ‘क्रोध’
  rationale: प्रसंग में यह केवल भावना नहीं, दैवी दण्ड की विनाशकारी अभिव्यक्ति है। ‘प्रकोप’ इस भार को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- issue: μεταξύ से सूचित मध्यस्थ स्थिति
  choice: ‘उनके बीच’ की स्वाभाविक अस्पष्टता बनाए रखी गई
  alternative: ‘मृतकों और जीवितों के बीच’ स्पष्ट करना
  rationale: सन्दर्भ मृतकों और जीवितों की सीमा की ओर संकेत करता है, पर यूनानी वाक्यांश स्वयं दोनों पक्षों को नाम से नहीं दोहराता; इसलिए अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
