translation:
  language: hi
  text: आपकी निष्कपट आज्ञा-रूपी तीखी तलवार धारण किए हुए, वह खड़ा होकर सब कुछ मृत्यु से भर दिया; वह स्वर्ग को छूता था[b], पर पृथ्वी पर पाँव रख चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यूनानी पाठ इस अभिकर्ता को ब्रह्मांडीय आकार में चित्रित करता है—वह स्वर्ग को छूता हुआ पृथ्वी पर पाँव रखे हुए है; इससे न्याय की सर्वव्यापी पहुँच पर बल पड़ता है।
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ
  choice: तीखी तलवार
  rationale: यह पद युद्ध-संबंधी सजीव रूपक प्रस्तुत करता है; ‘तीखी तलवार’ संज्ञा और विशेषण दोनों का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: τὴν ἀνυπόκριτον ἐπιταγήν σου
  choice: आपकी निष्कपट आज्ञा
  rationale: ἐπιταγή अधिकारपूर्ण आज्ञा है और ἀνυπόκριτος में कपट या दिखावे से रहित होने का भाव है। ‘निष्कपट आज्ञा’ मूल की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को बनाए रखती है।
- source_word: φέρων
  choice: धारण किए हुए
  rationale: यह समकालिक कृदन्त है और योद्धा द्वारा तलवार धारण करने की गरिमापूर्ण छवि बनाए रखता है।
- source_word: στὰς
  choice: उसने अपना स्थान लिया
  rationale: ἵστημι के अओरिस्ट कृदन्त में खड़े होने या स्थान ग्रहण करने का भाव है; यह निर्णयात्मक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: सब कुछ मृत्यु से भर दिया
  rationale: यह मूल कथन की व्यापकता और कठोरता को बिना ‘संसार’ या ‘ब्रह्मांड’ जैसी अतिरिक्त सीमा जोड़े सुरक्षित रखता है।
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: वह स्वर्ग को छू रहा था
  rationale: ἅπτομαι का मूल स्पर्श-अर्थ और आकृति का ब्रह्मांडीय विस्तार दोनों बने रहते हैं।
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: पृथ्वी पर पाँव रख चुका था
  rationale: βαίνω के इस पूर्णतासूचक रूप में पाँव रखने और वहाँ स्थापित होने का भाव है; ‘रख चुका था’ उस परिणामी अवस्था को व्यक्त करता है।
theological_decisions:
- issue: न्याय लाने वाले ईश्वरीय अभिकर्ता का मानवीकरण
  choice: पद में आए पुल्लिंग अभिकर्ता को ‘उसने/वह’ से बनाए रखा गया है, पर उसकी पहचान किसी विशिष्ट स्वतंत्र सत्ता के रूप में नहीं की गई।
  alternative: उसे स्पष्ट रूप से विनाशक स्वर्गदूत या किसी बाद की धर्मवैज्ञानिक धारणा में पहचाना जा सकता था।
  rationale: निकटवर्ती प्रसंग ईश्वर की आज्ञा या वचन को योद्धा-सदृश रूप में चित्रित करता है। अनुवाद इस मानवीकरण और उसके स्वर्ग-पृथ्वी व्यापी स्वरूप को सुरक्षित रखता है, पर पाठ से परे कोई सत्तात्मक निष्कर्ष नहीं जोड़ता।
- issue: आज्ञा और तलवार के बीच संबंध
  choice: आज्ञा को ‘तीखी तलवार के रूप में’ धारण किया हुआ बताया गया है।
  alternative: ‘आपकी तीखी तलवार—आपकी निष्कपट आज्ञा’ कहकर दोनों को समानाधिकरण में रखा जा सकता है।
  rationale: यूनानी पदक्रम में ‘तीखी तलवार’ और ‘आपकी निष्कपट आज्ञा’ घनिष्ठ रूपकीय संबंध में हैं। हिन्दी में ‘के रूप में’ उस संबंध को स्पष्ट और स्वाभाविक बनाता है, बिना आज्ञा को कोई भिन्न हथियार मानने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ईश्वर के लिए आदरसूचक ‘आपकी’ रखा गया है। युद्ध-रूपक, मृत्यु की व्यापकता और स्वर्ग-पृथ्वी के बीच फैली आकृति को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
