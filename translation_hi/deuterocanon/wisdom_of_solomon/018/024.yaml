base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: hi
  text: क्योंकि उसके पैरों तक पहुँचने वाले वस्त्र पर समस्त संसार था[a], चार पंक्तियों वाले रत्नों की नक्काशी पर पूर्वजों की महिमा थी[b], और उसके सिर के राजमुकुट पर आपकी महानता थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पैरों तक पहुँचने वाला वस्त्र।’
    reason: ποδήρης के लिए संक्षिप्त शाब्दिक विकल्प।
  - marker: b
    text: यह संक्षिप्त और कठिन यूनानी पदबंध संभवतः महायाजक के वक्षपट के चार पंक्तियों में व्यवस्थित रत्नों की ओर संकेत करता है।
    reason: सांस्कृतिक संकेत देता है, पर मूल में निहित से अधिक विवरण नहीं जोड़ता।
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: पैरों तक पहुँचने वाले वस्त्र
  rationale: ποδήρης का मूल अर्थ पैरों तक लंबा वस्त्र है। यह चयन महायाजकीय परिधान की औपचारिक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὅλος ὁ κόσμος
  choice: समस्त संसार
  rationale: κόσμος यहाँ संसार अथवा विश्व-व्यवस्था को सूचित करता है; ‘समस्त संसार’ व्यापक ब्रह्मांडीय आशय को बिना ‘सृष्टि’ की व्याख्यात्मक सीमा लगाए सुरक्षित रखता है।
- source_word: πατέρων δόξα
  choice: पूर्वजों की महिमा
  rationale: πατέρων का शाब्दिक आशय पितरों/पूर्वजों से है और δόξα महिमा, गौरव या सम्मान हो सकता है। ‘पूर्वजों की महिमा’ गरिमापूर्ण भी है और ‘कुलपिताओं’ जैसी अतिरिक्त व्याख्या से बचती है।
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: चार पंक्तियों में जड़े रत्नों की खुदाई पर
  rationale: यूनानी पदबंध संक्षिप्त और कुछ कठिन है तथा चार पंक्तियों वाले वक्षपट के उत्कीर्ण रत्नों की ओर संकेत करता है। हिन्दी में यह रूप दृश्य को स्पष्ट करता है, पर संकेतित वस्तु का नाम जोड़कर पाठ को अधिक नहीं खोलता।
- source_word: μεγαλοσύνη σου
  choice: आपकी महानता
  rationale: μεγαλοσύνη महानता या महिमा सूचित करता है। ‘आपकी महानता’ सीधे अर्थ को रखता है और परमेश्वर को संबोधन के लिए आदरपूर्ण है।
- source_word: διάδημα
  choice: राजमुकुट
  rationale: διάδημα सामान्य मुकुट से अधिक विशिष्ट राजकीय शिरोबन्ध है। ‘राजमुकुट’ आधुनिक पाठक को उसका राजकीय भाव देता है, यद्यपि यह ठोस रूप से मुकुटनुमा वस्तु समझा जा सकता है।
theological_decisions:
- issue: महायाजक के वस्त्रों का प्रतीकात्मक वर्णन
  choice: संसार, पूर्वजों की महिमा और परमेश्वर की महानता को वस्त्र, रत्नों और राजमुकुट पर उपस्थित/अंकित रूप में रखा गया है।
  alternative: निर्गमन 28 के वक्षपट और पगड़ी का नाम लेकर संकेत को स्पष्ट करना, अथवा κόσμος को ‘ब्रह्मांड’ कहना।
  rationale: यूनानी पाठ प्रतीकात्मक संबंध बताता है, पर इस पद में पंचग्रन्थीय पृष्ठभूमि को स्पष्ट रूप से नहीं खोलता। अनुवाद संकेत को सुरक्षित रखता है और व्याख्या को पादटिप्पणी तक सीमित करता है।
- issue: ἐπί के साथ प्रतीक की उपस्थिति
  choice: पहले खंड में ‘अंकित था’ और अन्य खंडों में ‘पर ... थी’ कहा गया है।
  alternative: हर खंड में केवल ‘पर था/थी’ रखना।
  rationale: मूल में ‘अंकित’ के समतुल्य अलग क्रिया नहीं है, पर हिन्दी में संसार के वस्त्र पर होने की प्रतीकात्मक प्रकृति समझाने के लिए यह न्यूनतम प्रसंगगत स्पष्टता है; अगले खंडों की समानांतर संरचना मूल की संक्षिप्तता बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पूर्वजों’ ने अनावश्यक रूप से विशिष्ट ‘कुलपिताओं’ से बचाया है। ‘राजमुकुट’ राजकीय भाव स्पष्ट करता है; संपूर्ण वाक्य की त्रिखंडीय समानांतरता यथासंभव बनाए रखी गई है।
