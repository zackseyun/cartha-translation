    issue: ‘निश्चयपूर्वक जानें ... और हिम्मत बाँधें’ obscures the participial relationship.
    rationale: ἀσφαλῶς εἰδότες is ‘knowing with certainty’; ‘... जानकर’ makes that relation explicit and natural in Hindi.
