base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: hi
  text: उस रात की सूचना हमारे पितरों को पहले ही दे दी गई थी[a], ताकि जिन शपथों पर उन्होंने भरोसा किया था, उन्हें निश्चयपूर्वक जानकर वे हिम्मत बाँधें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस रात का पूर्वज्ञान हमारे पितरों को था।” यूनानी क्रिया का अधिक शाब्दिक अर्थ ऐसा हो सकता है; पर प्रसंग में इसका अर्थ संभवतः यह है कि उस रात की सूचना उन्हें पहले ही दे दी गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη ἡ νὺξ
  choice: उस रात
  rationale: संकेतवाचक बल को सहज और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προεγνώσθη
  choice: के विषय में ... पहले ही बता दिया गया था
  rationale: क्रिया का शाब्दिक अर्थ ‘पहले से जाना गया’ हो सकता है, पर प्रसंग पूर्वजों को उस रात की पूर्व-सूचना दिए जाने का समर्थन करता है; टिप्पणी में वास्तविक वैकल्पिक अर्थ सुरक्षित है।
- source_word: πατράσιν ἡμῶν
  choice: हमारे पूर्वजों को
  rationale: यहाँ इस्राएल की पिछली पीढ़ियों का सामूहिक उल्लेख है; आधुनिक हिन्दी में ‘पूर्वज’ स्वाभाविक है और आशय को ठीक व्यक्त करता है।
- source_word: ἀσφαλῶς εἰδότες
  choice: निश्चयपूर्वक जानें
  rationale: ज्ञान और दृढ़ आश्वासन, दोनों को व्यक्त करता है।
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: उन्होंने किन शपथों पर भरोसा किया था
  rationale: दत्तिव संबंध को ‘पर भरोसा’ से व्यक्त करते हुए ‘शपथों’ की मूल रूपक और अनिर्दिष्टता सुरक्षित रखी गई है।
- source_word: ἐπευθυμήσωσιν
  choice: हिम्मत बाँधें
  rationale: प्रोत्साहित होने अथवा साहस ग्रहण करने का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
