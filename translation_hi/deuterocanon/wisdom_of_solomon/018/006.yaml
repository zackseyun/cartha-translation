- issue: ‘शपथों’ का कर्ता और संदर्भ
  choice: पाठ में केवल ‘शपथों’ कहा गया है
  alternative: इसे स्पष्ट रूप से परमेश्वर की शपथबद्ध प्रतिज्ञाएँ कहना
  rationale: निकटवर्ती प्रसंग परमेश्वर की प्रतिज्ञाओं की ओर संकेत करता है, पर पद स्वयं कर्ता को स्पष्ट नहीं करता; इसलिए अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
