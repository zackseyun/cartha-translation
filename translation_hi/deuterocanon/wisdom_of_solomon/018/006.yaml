    rationale: The Greek explicitly says ‘our fathers.’ In this scriptural context, ‘हमारे पितरों’ preserves that wording in established Hindi biblical register without adding interpretation.
  - severity: low
    issue: The footnote’s proposed literal alternative changes the Greek passive into an active construction.
    rationale: ‘हमारे पूर्वजों ने पहले से जान लिया था’ does not reflect προεγνώσθη (‘was foreknown/made known beforehand’).
