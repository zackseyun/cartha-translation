  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जादू-टोना’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी उसके प्रसंगगत अर्थ को स्पष्ट करती है। ‘प्रजा’ और एकवचन ‘पुत्र’ मूल यूनानी की सामूहिक संरचना को सुरक्षित रखते हैं।
