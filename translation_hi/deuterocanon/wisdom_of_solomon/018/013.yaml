  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: hi
  text: यद्यपि वे जादू-टोने[a] के कारण सब बातों पर अविश्वास करते रहे थे, फिर भी पहलौठों के विनाश के समय उन्होंने स्वीकार किया कि यह प्रजा परमेश्वर का पुत्र[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जादुई कलाएँ।’ यहाँ यूनानी शब्द मिस्र से जुड़ी गुप्त जादुई क्रियाओं की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ पूरी इस्राएली प्रजा को सामूहिक रूप से परमेश्वर का पुत्र कहा गया है; यह किसी एक व्यक्ति की उपाधि नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: विश्वास नहीं करते थे
  rationale: यह प्रयोग केवल संदेह नहीं, बल्कि दिखाई गई बातों को न मानने का भाव व्यक्त करता है; हिन्दी में यह सहज रहते हुए उसी सक्रिय अविश्वास को बनाए रखता है।
- source_word: φαρμακείας
  choice: जादू-टोने
  rationale: यहाँ शब्द औषधि के अर्थ में नहीं, बल्कि मिस्र से जुड़ी गुप्त जादुई क्रियाओं के लिए प्रयुक्त है। ‘जादू-टोना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὀλέθρῳ
  choice: विनाश
  rationale: यह व्यापक संज्ञा उस घातक विपत्ति को व्यक्त करती है, पर मूल में निहित न होने वाली अतिरिक्त हिंसक छवि नहीं जोड़ती।
- source_word: πρωτοτόκων
  choice: पहिलौठों
  rationale: यूनानी में निश्चित पद है, पर कोई स्वत्ववाचक सर्वनाम नहीं; इसलिए ‘उनके पहिलौठों’ जोड़ने के बजाय मूल की संरचना सुरक्षित रखी गई है।
- source_word: ὡμολόγησαν
  choice: स्वीकार किया
  rationale: यह घटनाओं के कारण खुलकर मान लेने का भाव देता है और इस प्रसंग में धार्मिक ‘अंगीकार’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: θεοῦ υἱὸν
  choice: परमेश्वर का पुत्र
  rationale: एकवचन ‘पुत्र’ को बनाए रखा गया है, क्योंकि यह पूरी प्रजा के सामूहिक पुत्रत्व को व्यक्त करता है; इसे ‘सन्तान’ या ‘बच्चे’ बनाना विशिष्ट रूपक को धुंधला कर देता।
- source_word: λαὸν
  choice: यह प्रजा
  rationale: ‘प्रजा’ सामूहिक एकवचन के रूप में λαός के अनुकूल है। प्रसंगगत संकेत को स्पष्ट करने के लिए ‘यह’ स्वाभाविक हिन्दी में प्रयुक्त हुआ है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक पुत्रत्व की भाषा
  choice: यह प्रजा परमेश्वर का पुत्र है
  alternative: यह प्रजा परमेश्वर की सन्तान है
  rationale: यूनानी पाठ में λαόν और υἱόν दोनों एकवचन हैं और पूरी प्रजा को सामूहिक रूप से परमेश्वर का पुत्र कहा गया है। अनुवाद ने इस वाचा-संबंधी रूपक को बहुवचन या लिंग-निरपेक्ष सामान्यीकरण में नहीं बदला।
- issue: स्वीकृत कथन का काल
  choice: परमेश्वर का पुत्र है
  alternative: परमेश्वर का पुत्र था
  rationale: यूनानी εἶναι काल की दृष्टि से अनिर्दिष्ट infinitive है। हिन्दी में ‘उन्होंने स्वीकार किया कि … है’ उस स्वीकृत पहचान को स्वाभाविक ढंग से व्यक्त करता है और उसे केवल बीती हुई स्थिति नहीं बनाता।
