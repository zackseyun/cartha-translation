lexical_decisions:
- source_word: Ἥψατο
  choice: छुआ
  rationale: ἅπτομαι के रूपक को बनाए रखता है और यह बताता है कि यह अनुभव धर्मियों तक भी पहुँचा, बिना उनके पूर्ण विनाश का अर्थ थोपे।
- source_word: δικαίων
