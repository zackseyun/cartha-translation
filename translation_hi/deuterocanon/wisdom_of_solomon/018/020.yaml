- source_word: πεῖρα θανάτου
  choice: मृत्यु की परीक्षा
  rationale: πεῖρα में निहित परीक्षा, कसौटी या अनुभव की अर्थ-सीमा को सुरक्षित रखता है; सम्बन्धवाचक यूनानी पदबंध की वास्तविक अस्पष्टता भी बनी रहती है।
- source_word: θραῦσις
  choice: विनाश
  rationale: मूल अर्थ टूटना या चूर होना है, पर घातक विपत्ति के प्रसंग में 'विनाश' स्वाभाविक हिन्दी है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: πλήθους
  choice: जनसमूह का
  rationale: बहुसंख्यक सामूहिक समुदाय का भाव व्यक्त करता है और केवल अनिश्चित 'बहुतों' तक अर्थ को सीमित नहीं करता।
- source_word: ἐν ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος का मूल अर्थ निर्जन या उजाड़ स्थान है; निर्गमन-प्रसंग के wilderness को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ὀργή
  choice: प्रकोप
  rationale: न्यायसूचक तीव्र क्रोध का भाव देता है, जबकि यूनानी की तरह उसके कर्ता को अनकहा छोड़ता है।
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: अधिक समय तक नहीं रहा
  rationale: कालगत वाक्यांश का सहज हिन्दी रूप है और विपत्ति की सीमित अवधि को बनाए रखता है।
theological_decisions:
- issue: क्या ὀργή को स्पष्ट रूप से परमेश्वर का प्रकोप कहा जाए
  choice: प्रकोप
  alternative: परमेश्वर का प्रकोप / उसका प्रकोप
