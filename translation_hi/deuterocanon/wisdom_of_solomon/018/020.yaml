- issue: धर्मियों पर πεῖρα θανάτου के प्रभाव की तीव्रता
  choice: मृत्यु की परीक्षा ने धर्मियों को भी छुआ
  alternative: धर्मियों ने भी मृत्यु का अनुभव किया / मृत्यु का संकट धर्मियों पर भी आया
  rationale: '''छुआ'' मूल रूपक को सुरक्षित रखता है और यह नहीं ठहराता कि धर्मी भी उसी अर्थ में नष्ट हुए जिस अर्थ में जनसमूह पर विपत्ति आई।'
