translation:
  language: hi
  text: क्योंकि जिन पर पहले आक्रमण हुआ था, वे इस बात के लिए धन्यवाद देते थे कि उन्हें हानि नहीं पहुँचाई जा रही थी[a], और उन्होंने अपने आपसी वैर के लिए क्षमा माँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी पाठ में, विशेषकर ‘हानि नहीं पहुँचाई जा रही थी’ से संबंधित पदबंध, व्याकरण की दृष्टि से कठिन है। यहाँ प्रसंग के अनुसार सबसे संभावित अर्थ दिया गया है।
    reason: textual_variant
  - marker: b
    text: या, “उन्होंने अपने आपसी अलगाव/संघर्ष के विषय में कृपा माँगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: उन्हें हानि नहीं पहुँचाई जा रही थी
  rationale: पाठ में यह पदबंध व्याकरण की दृष्टि से कठिन है। βλάπτω का सामान्य अर्थ ‘हानि पहुँचाना’ है; प्रसंग में निष्क्रिय भाव सबसे संगत प्रतीत होता है, पर अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: προπολεμημένοι
  choice: जिन पर पहले आक्रमण हुआ था
  rationale: कृदन्त पहले हुए विरोध या युद्ध का संकेत देता है। यह अनुवाद कालगत προ- और शत्रुतापूर्ण कार्रवाई—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐχαριστοῦσιν
  choice: धन्यवाद देते थे
  rationale: यह εὐχαριστέω के कृतज्ञता व्यक्त करने वाले सामान्य अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: τὸ διενεχθῆναι
  choice: अपने आपसी वैर
  rationale: यहाँ διαφέρω का भाव केवल मतभेद नहीं, बल्कि अलगाव या संघर्ष में होना है। ‘आपसी वैर’ संबंधगत शत्रुता को व्यक्त करता है।
- source_word: χάριν ἐδέοντο
  choice: क्षमा माँगी
  rationale: शाब्दिक रूप से यह कृपा या अनुग्रह माँगने का भाव रखता है। पिछले वैर के प्रसंग में ‘क्षमा माँगी’ स्वाभाविक है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: कठिन और संभवतः विकृत यूनानी वाक्य-विन्यास का निरूपण
  choice: पहले आक्रमण सह चुके लोगों की अहानि पर कृतज्ञता और पुराने वैर के लिए क्षमा-याचना के रूप में अनुवाद
  alternative: ‘क्योंकि पहले युद्ध किए गए वे लोग, हानि न पहुँचाते हुए, धन्यवाद देते हैं, और उन्होंने अलग होने के विषय में कृपा माँगी’ जैसा अधिक शब्दशः पर अस्पष्ट अनुवाद
  rationale: प्रेषित यूनानी, विशेषकर οἱ οὐ βλάπτοντιν, कठिन है। मुख्य पाठ प्रसंग में सबसे संभावित अर्थ देता है, पर पाठगत अनिश्चितता और χάριν के वैकल्पिक अर्थ को पादटिप्पणियों में सुरक्षित रखता है; किसी विशिष्ट धर्मसिद्धान्त को आरोपित नहीं करता।
