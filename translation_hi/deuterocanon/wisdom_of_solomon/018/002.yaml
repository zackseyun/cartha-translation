  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। ‘आक्रमण’, ‘हानि’, ‘धन्यवाद’ और ‘क्षमा’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ अर्थपूर्ण रखा गया है और वास्तविक यूनानी अस्पष्टता को पादटिप्पणियों में ईमानदारी से दर्शाया गया है।
