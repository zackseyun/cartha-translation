  choice: एक निर्दोष मनुष्य
  rationale: ἄμεμπτος ऐसे व्यक्ति को दर्शाता है जिस पर दोष नहीं लगाया जा सकता; ‘निर्दोष’ सरल, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: προεμάχησεν
  choice: अग्रिम पंक्ति में लड़ा
  rationale: क्रिया में दूसरों के आगे या सबसे सामने लड़ने का सैनिक रूपक है; यह अनुवाद उस रूपक को बनाए रखता है।
- source_word: λειτουργίας
  choice: सेवा
  rationale: प्रसंग में हारून की उपासना-संबंधी सेवा निहित है, पर यूनानी शब्द में ‘याजकीय’ विशेषण स्पष्ट रूप से नहीं है; इसलिए व्यापक ‘सेवा’ रखा गया है।
- source_word: ὅπλον
  choice: हथियार
  rationale: यह शब्द सैनिक बिंब को जारी रखता है और प्रार्थना तथा धूप को उसके संघर्ष के साधन के रूप में प्रस्तुत करता है।
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: प्रार्थना और धूप के द्वारा प्रायश्चित्त
  rationale: यह वाक्यांश ‘हथियार’ की विषयवस्तु बताता है। ‘प्रायश्चित्त’ उपासना-संबंधी अर्थ को सुलभ हिन्दी में व्यक्त करता है, जबकि साधन के रूप में धूप का संबंध स्पष्ट रहता है।
- source_word: ἀντέστη τῷ θυμῷ
  choice: उसने क्रोध का सामना किया
  rationale: ἀντέστη दृढ़ विरोध या सामने खड़े होने का भाव देता है। ‘क्रोध’ का स्वामी मूल में स्पष्ट नहीं किया गया है, इसलिए अनुवाद भी उसे नहीं जोड़ता।
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: विपत्ति का अंत कर दिया
  rationale: यह हिन्दी में स्वाभाविक रूप से विपत्ति पर सीमा लगाने और उसे समाप्त करने का अर्थ व्यक्त करता है।
- source_word: θεράπων
  choice: सेवक
  rationale: θεράπων आदरयुक्त व्यक्तिगत सेवा करने वाले व्यक्ति को सूचित कर सकता है; ‘सेवक’ सामान्य पाठक के लिए स्वाभाविक और गरिमापूर्ण है, जबकि निकटवर्ती विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: उपासना-संबंधी प्रसंग में ἐξιλασμός का अर्थ
  choice: प्रायश्चित्त
  alternative: पाप-निवारण; शमन
  rationale: शब्द न्याय को टालने वाली उपासना-संबंधी क्रिया को दर्शाता है। ‘प्रायश्चित्त’ धार्मिक वजन बनाए रखता है, पर क्रिया की यांत्रिकी को ‘कोप-शमन’ जैसे अधिक विशिष्ट पद से निर्धारित नहीं करता।
- issue: θυμός का संदर्भ
  choice: क्रोध
  alternative: रोष; प्रकोप
  rationale: प्रसंग में यह परमेश्वर के न्यायकारी क्रोध की ओर संकेत करता है, किंतु यूनानी पाठ यहाँ ‘परमेश्वर का’ नहीं जोड़ता; अनुवाद उसी अंतर्निहित संदर्भ को खुला रखता है।
- issue: λειτουργία की सेवा का प्रकार
  choice: सेवा
  alternative: याजकीय सेवा; उपासना-सेवा
  rationale: हारून का याजकीय कार्य प्रसंग से स्पष्ट है, पर मूल शब्द के साथ यहाँ कोई स्पष्ट विशेषण नहीं है; इसलिए संप्रदायगत या व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘अग्रिम पंक्ति’, ‘हथियार’ और ‘सामना किया’ मूल के सैनिक बिंब को बनाए रखते हैं। परमेश्वर के लिए प्रत्यक्ष संबोधन में सम्मानसूचक ‘आपका’ प्रयोग किया गया है। पादटिप्पणी-चिह्न उन्हीं शब्दों के साथ रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
