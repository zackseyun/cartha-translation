  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: hi
  text: क्योंकि एक निर्दोष मनुष्य शीघ्रता से आगे बढ़ा और अपनी सेवा का हथियार—प्रार्थना और धूप से प्रायश्चित्त[a]—लेकर अग्रिम पंक्ति में लड़ा। उसने क्रोध का सामना किया और विपत्ति का अंत कर दिया, यह दिखाते हुए कि वह आपका सेवक[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रार्थना और धूप के द्वारा पाप-निवारण।” यूनानी ἐξιλασμός को उपासना-संबंधी प्रसंगों में कई निकट अर्थों में अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परिचर।” यूनानी θεράπων आदर के साथ सेवा करने वाले सहायक या सेवक को दर्शाता है।
    reason: lexical_alternative
