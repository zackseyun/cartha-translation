translation:
  language: hi
  text: लेकिन शत्रुओं की बेसुरी चीख प्रतिध्वनित हो रही थी, और जिन बच्चों के लिए विलाप किया जा रहा था, उस करुण विलाप की आवाज़ दूर-दूर तक फैल रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντήχει
  choice: प्रतिध्वनित हो रही थी
  rationale: यह क्रिया केवल आवाज़ उठने के बजाय उसके लौटकर गूँजने या चारों ओर प्रतिध्वनित होने का बोध देती है। अपूर्ण भूतकाल को ‘हो रही थी’ से व्यक्त किया गया है।
- source_word: ἀσύμφωνος
  choice: बेसुरी
  rationale: शब्द का मूल भाव असामंजस्य या स्वर-मेल के अभाव का है। ‘बेसुरी’ ध्वनि-संबंधी अर्थ और उस विलाप की व्याकुल अव्यवस्था—दोनों को सहज हिन्दी में रखता है।
- source_word: ἐχθρῶν ἡ βοή
  choice: शत्रुओं की ... चीख
  rationale: सम्बन्धकारक ἐχθρῶν बताता है कि चीख किसकी थी। βοή के लिए ‘चीख’ युद्धघोष के बजाय संकट और शोक से उपजी ऊँची आवाज़ को व्यक्त करता है।
- source_word: οἰκτρά
  choice: करुण विलाप
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञात्मक रूप में किसी दयनीय या करुण सुनाई देने वाली बात को सूचित करता है। आगे के θρηνουμένων के कारण ‘करुण विलाप’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: διεφέρετο
  choice: दूर-दूर तक फैल रहा था
  rationale: अपूर्ण भूतकाल और कर्मवाच्य रूप किसी ध्वनि के लगातार इधर-उधर पहुँचने या फैलने का चित्र देता है।
- source_word: θρηνουμένων παίδων
  choice: जिन बच्चों के लिए शोक मनाया जा रहा था
  rationale: सम्बन्धकारक पदबंध को बच्चों के शोक का विषय होने के रूप में लिया गया है। इससे यह गलत अर्थ नहीं निकलता कि बच्चे स्वयं विलाप कर रहे थे।
- source_word: παίδων
  choice: बच्चों
  rationale: यद्यपि व्यापक प्रसंग मिस्र के पहलौठों का है, यहाँ यूनानी शब्द सामान्य रूप से ‘बच्चों’ का अर्थ देता है; इसलिए अनुवाद ने इसे ‘पहलौठे पुत्रों’ तक सीमित नहीं किया।
theological_decisions:
- issue: क्या प्रसंग के आधार पर παίδων को ‘पहलौठे पुत्र’ कहा जाए
  choice: बच्चों
  alternative: पहलौठे बच्चों / पहलौठे पुत्रों
  rationale: इस पद का अपना शब्द व्यापक है। निकटवर्ती कथा-संदर्भ को मानते हुए भी मुख्य पाठ में स्रोत से अधिक विशिष्टता नहीं जोड़ी गई।
- issue: θρηνουμένων παίδων में शोक करने वाला कौन है
  choice: बच्चे शोक का विषय हैं—‘जिन बच्चों के लिए शोक मनाया जा रहा था’
  alternative: ‘शोक मनाते बच्चों की करुण पुकार’
  rationale: मध्य/कर्मवाच्य कृदन्त को बच्चों के लिए किए जा रहे विलाप के रूप में समझना प्रसंग और अंग्रेज़ी परामर्श-पाठ से मेल खाता है; फिर भी यूनानी संरचना को कुछ पाठक बच्चों के विलाप से जोड़ सकते हैं, इसलिए विकल्प पाद-टिप्पणी में रखा गया है।
