translation:
  language: hi
  text: आपका सर्वशक्तिमान वचन[a] स्वर्गों से, राजकीय सिंहासनों[b] से, एक कठोर योद्धा के रूप में, विनाश के लिए नियत भूमि के बीचोंबीच कूद पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वचन’ को यहाँ परमेश्वर की प्रभावकारी आज्ञा के रूप में समझा जा सकता है; कुछ पाठक इस व्यक्तिकृत ‘वचन’ में परमेश्वर के दिव्य प्रतिनिधि की ओर पूर्वसंकेत भी देखते हैं, पर मूल यूनानी स्वयं उस पहचान को स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: मूल यूनानी में ‘राजकीय सिंहासनों’ बहुवचन है।
    reason: source_number
lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: आपका सर्वशक्तिमान वचन
  rationale: παντοδύναμος का अर्थ ‘सर्वशक्तिमान’ है; λόγος को ‘वचन’ कहना हिन्दी बाइबलीय शैली में स्वाभाविक है और मूल की व्यापकता बनाए रखता है, बिना मुख्य पाठ में किसी बाद की विशिष्ट मसीही पहचान को अनिवार्य किए।
- source_word: ἀπʼ οὐρανῶν
  choice: स्वर्गों से
  rationale: मूल यूनानी में बहुवचन है। हिन्दी में ‘स्वर्गों से’ अर्थपूर्ण और स्वाभाविक है तथा स्रोत की संख्या को सुरक्षित रखता है।
- source_word: ἐκ θρόνων βασιλείων
  choice: राजसी सिंहासनों से
  rationale: θρόνων बहुवचन है और βασιλείων राजकीय वैभव का बोध देता है; यह अनुवाद उस बहुवचन और राजसी परिवेश दोनों को बनाए रखता है।
- source_word: ἀπότομος
  choice: कठोर
  rationale: यह शब्द तीक्ष्णता, कठोरता अथवा निर्मम दृढ़ता का संकेत दे सकता है। ‘कठोर’ न्याय के प्रसंग की प्रबलता बचाता है, पर ‘निर्दयी’ जैसा अर्थ मूल पर नहीं थोपता।
- source_word: πολεμιστής
  choice: योद्धा
  rationale: ‘योद्धा’ आधुनिक हिन्दी में स्वाभाविक है और युद्ध-संबंधी बिंब को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: εἰς μέσον
  choice: के बीचोंबीच
  rationale: यह किसी स्थान के ठीक मध्य में प्रवेश का भाव व्यक्त करता है; ‘बीचोंबीच’ हिन्दी में सजीव और गरिमापूर्ण है।
- source_word: τῆς ὀλεθρίας γῆς
  choice: विनाश के लिए ठहराई गई भूमि
  rationale: ὀλεθρίας यहाँ विनाशकारी अथवा विनाश के अधीन भूमि का संकेत दे सकता है। प्रसंग में यह भूमि पर आए न्याय को व्यक्त करता है, जबकि अभिव्यक्ति विशेषण की वास्तविक अर्थ-सीमा को पूरी तरह संकुचित नहीं करती।
- source_word: ἥλατο
  choice: कूद पड़ा
  rationale: क्रिया अचानक और प्रबल छलाँग का चित्र प्रस्तुत करती है; ‘कूद पड़ा’ उस गति और सजीवता को बनाए रखता है।
theological_decisions:
- issue: क्या λόγος का अनुवाद ऐसी रीति से किया जाए जो बाद की मसीही व्याख्या को मुख्य पाठ में प्रमुख बना दे
  choice: वचन
  alternative: ‘वचन’ को स्पष्ट व्यक्तिवाचक उपाधि मानना
  rationale: तात्कालिक प्रसंग परमेश्वर के प्रभावकारी वचन को योद्धा के रूप में व्यक्तित्व देता है। मुख्य पाठ उस व्यक्तिकरण को बनाए रखता है, पर किसी विशिष्ट बाद की धर्मवैज्ञानिक पहचान को निर्णायक नहीं बनाता; टिप्पणी व्याख्यात्मक संभावना बताती है।
- issue: युद्ध और न्याय की कठोर छवि को कैसे सुरक्षित रखा जाए
  choice: एक कठोर योद्धा
  alternative: एक निर्दयी योद्धा
  rationale: ‘कठोर’ ἀπότομος की तीव्रता और न्याय की छवि को व्यक्त करता है, जबकि ‘निर्दयी’ मूल से अधिक नैतिक निष्कर्ष जोड़ सकता है।
- issue: ἀπότομος πολεμιστής की व्याकरणिक भूमिका
  choice: एक कठोर योद्धा बनकर
  alternative: एक कठोर योद्धा के समान
  rationale: मूल में पदबंध समानाधिकरण में है, केवल तुलना नहीं। हिन्दी में ‘बनकर’ उस प्रत्यक्ष रूपक को स्वाभाविक रूप से व्यक्त करता है, यद्यपि इसे किसी तत्त्वमीमांसात्मक परिवर्तन का कथन नहीं समझना चाहिए।
