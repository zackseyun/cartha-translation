base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: hi
  text: क्योंकि जिन स्वप्नों ने उन्हें व्याकुल कर दिया था, उन्होंने इस बात की पहले ही चेतावनी दे दी थी[a], ताकि वे यह जाने बिना नष्ट न हों कि वे किस कारण इतनी बुरी तरह पीड़ित थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने इस बात का पहले ही संकेत दे दिया था।” यूनानी क्रिया का अर्थ किसी बात को पहले से बताना या उसकी अग्रिम चेतावनी देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिस कारण वे बुरी तरह पीड़ित हैं,” अर्थात् “किस कारण वे इतनी बुरी तरह पीड़ित थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: क्योंकि जिन स्वप्नों ने
  rationale: γάρ को कारणसूचक ‘क्योंकि’ और निश्चित बहुवचन ὄνειροι को प्रसंगानुसार ‘स्वप्नों’ से व्यक्त किया गया है। संबंधवाचक रचना हिंदी में अगले कृदंत को स्वाभाविक ढंग से जोड़ती है।
- source_word: θορυβήσαντες αὐτοὺς
  choice: उन्हें व्याकुल कर दिया था
  rationale: θορυβέω मानसिक हलचल, घबराहट या व्याकुलता उत्पन्न करने का भाव रखता है। ‘व्याकुल कर दिया था’ उस बल को स्वाभाविक और गरिमापूर्ण हिंदी में बनाए रखता है।
- source_word: τοῦτο προεμήνυσαν
  choice: उन्होंने इस बात की पहले ही चेतावनी दे दी थी
  rationale: προμηνύω किसी बात को पहले से प्रकट करने या उसकी अग्रिम चेतावनी देने का अर्थ रखता है। अशुभ स्वप्नों के प्रसंग में ‘चेतावनी’ उपयुक्त है, जबकि पादटिप्पणी में व्यापक विकल्प सुरक्षित रखा गया है।
- source_word: ἵνα μὴ ... ἀπόλωνται
  choice: ताकि वे ... नष्ट न हों
  rationale: ἵνα μή के उद्देश्यसूचक भाव को ‘ताकि ... न’ से और ἀπόλωνται के गंभीर अर्थ को ‘नष्ट न हों’ से व्यक्त किया गया है।
- source_word: ἀγνοοῦντες
  choice: यह जाने बिना
  rationale: कृदंत का आशय अज्ञान की अवस्था में नष्ट होने से है; ‘यह जाने बिना’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: διʼ ὃ κακῶς πάσχουσιν
  choice: कि वे किस कारण कष्ट भोग रहे थे
  rationale: διʼ ὃ कारण पूछता है और κακῶς πάσχειν विपत्ति या कष्ट सहने का मुहावरा है। हिंदी कथात्मक प्रसंग के अनुरूप ‘कष्ट भोग रहे थे’ स्वाभाविक है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
theological_decisions:
- issue: अशुभ स्वप्नों का उद्देश्य
  choice: स्वप्नों ने अग्रिम चेतावनी दी, ताकि पीड़ित लोग अपने कष्ट का कारण जाने बिना नष्ट न हों।
  alternative: ἵνα-वाक्य को उद्देश्य के बजाय परिणाम के कुछ ढीले भाव में समझा जा सकता है।
  rationale: 'कोइने और सप्तति में ἵνα यहाँ सबसे स्वाभाविक रूप से उद्देश्य बताता है। यह पाठ के तनाव को बनाए रखता है: दंड कठोर है, फिर भी उसके कारण के विषय में चेतावनी दी जाती है।'
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘व्याकुल’, ‘चेतावनी’ और ‘कष्ट भोगना’ सामान्य पाठक के लिए स्पष्ट हैं और मूल यूनानी की गंभीरता को बनाए रखते हैं।
