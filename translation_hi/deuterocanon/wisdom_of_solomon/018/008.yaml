lexical_decisions:
- source_word: ἐτιμώρησας
  choice: तूने दण्ड दिया
  rationale: τιμωρέω यहाँ विरोधियों पर दण्डात्मक न्याय करने को दर्शाता है। ‘दण्ड दिया’ स्वाभाविक और स्पष्ट है तथा प्रतिशोध की प्रेरणा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τοὺς ὑπεναντίους
  choice: विरोधियों को
  rationale: ὑπεναντίος विरोध या शत्रुता में खड़े लोगों को सूचित करता है। ‘विरोधी’ अर्थ की व्यापकता बनाए रखता है और इसे केवल युद्ध-संबंधी शत्रुओं तक सीमित नहीं करता।
- source_word: τούτῳ
  choice: उसी के द्वारा
  rationale: एकवचन निर्देशवाचक के करणार्थक दत्तिव को स्पष्ट करता है और पहले बताए गए दण्ड के उसी कार्य की ओर लौटता है।
- source_word: προκαλεσάμενος
  choice: हमें अपने पास बुलाकर
  rationale: προκαλέω के मध्यम वाच्य कृदन्त में बुलाने या आमंत्रित करने का अर्थ है और संभवतः अपने पास बुलाने की छाया भी है। मुख्य पाठ में यह संबंधपरक भाव रखा गया है, जबकि पादटिप्पणी कम स्पष्ट विकल्प बताती है।
- source_word: ἐδόξασας
  choice: महिमा दी
  rationale: δοξάζω सम्मानित करने अथवा महिमा देने को व्यक्त करता है। ‘महिमा दी’ दण्ड और परमेश्वर की प्रजा को मिले गौरव के बीच विरोध बनाए रखता है और हिन्दी में ‘महिमान्वित किया’ से अधिक सहज है।
theological_decisions:
- issue: विरोधियों पर दण्ड और ‘हम’ को मिली महिमा के बीच संबंध
  choice: उसी ईश्वरीय कार्य के द्वारा विरोधियों को दण्ड और ‘हम’ को महिमा मिलती है; बुलाना इस महिमा से जुड़ा है।
  alternative: कृदन्त को केवल ‘हमें बुलाकर’ कहा जा सकता है, बिना ‘अपने पास’ के संबंधपरक भाव के।
  rationale: यूनानी पाठ न्याय और महिमा को निकटता से जोड़ता है, पर यह विस्तार से नहीं बताता कि बुलाना किस प्रकार हुआ। इसलिए मुख्य पाठ मध्यम वाच्य की संभावित संबंधपरक छाया रखता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित करती है।
translation_notes:
