  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: hi
  text: विनाशक उसके सामने पीछे हट गया[a] और इन बातों से डर गया[b]; क्योंकि क्रोध का केवल अनुभव ही पर्याप्त था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विनाश करनेवाला उसके आगे झुक गया।” इसे “विनाश करनेवाला स्वर्गदूत” भी समझा गया है, पर यूनानी में “स्वर्गदूत” नहीं है।
    reason: alternative_reading
  - marker: b
    text: “इन बातों” से संभवतः पिछले पद में बताए गए याजकीय चिह्न या स्मृति-चिह्न अभिप्रेत हैं, पर यूनानी में संदर्भ अनकहा है। दिए गए यूनानी पाठ में “डर गए” बहुवचन रूप है, यद्यपि प्रसंग विनाशक को कर्ता समझने का समर्थन करता है।
    reason: textual_and_grammatical_ambiguity
  - marker: c
    text: “अनुभव” के लिए प्रयुक्त यूनानी शब्द का अनुवाद “परीक्षा,” “परख” या “प्रमाण” भी हो सकता है। भाव यह भी हो सकता है कि क्रोध का थोड़ा-सा प्रत्यक्ष अनुभव ही पर्याप्त था।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: उसके सामने
  rationale: यह संकेतवाचक सर्वनाम पिछले पद में वर्णित याजकीय व्यक्ति की ओर लौटता है। हिंदी में ‘उसके सामने’ εἴκω के साथ स्वाभाविक है और अनावश्यक रूप से उसकी पहचान नहीं बढ़ाता।
- source_word: εἶξεν
  choice: पीछे हट गया
  rationale: क्रिया का अर्थ दबाव के आगे झुकना या मार्ग छोड़ना है। ‘पीछे हट गया’ विनाशक के रोके जाने का चित्र सहज हिंदी में बनाए रखता है।
- source_word: ὀλοθρεύων
  choice: विनाशक
  rationale: यह संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत है, शाब्दिक अर्थ ‘विनाश करनेवाला’। ‘विनाशक’ संक्षिप्त और स्वाभाविक है; ‘विनाश करनेवाला स्वर्गदूत’ कहना यूनानी पाठ से अधिक विशिष्ट होगा।
- source_word: ταῦτα
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का संदर्भ पाठ में स्पष्ट नहीं किया गया। ‘इन बातों’ पिछले पद के याजकीय चिह्नों या अभी वर्णित बातों—दोनों की संभावना खुली रखता है।
- source_word: ἐφοβήθησαν
  choice: डर गया
  rationale: दिए गए यूनानी रूप में बहुवचन है, जबकि प्रसंग और समानांतर वाक्य विनाशक को प्रतिक्रिया करनेवाला बताते हैं। मुख्य पाठ में अर्थ-संबंध को स्वाभाविक हिंदी में व्यक्त किया गया है और वचन-संबंधी कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: πεῖρα
  choice: अनुभव
  rationale: πεῖρα का अर्थ परीक्षा, परख, प्रमाण या अनुभव हो सकता है। यहाँ क्रोध के प्रकट प्रभाव को चखने/अनुभव करने की संक्षिप्त धारणा है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ὀργῆς
  choice: क्रोध
  rationale: दिव्य न्याय के प्रसंग में ‘क्रोध’ गंभीरता बनाए रखता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: μόνη ... ἱκανή
  choice: केवल ... ही पर्याप्त
  rationale: यह संरचना बताती है कि क्रोध का इतना अनुभव ही काफी था और आगे की अभिव्यक्ति आवश्यक नहीं थी।
theological_decisions:
- issue: ὀλοθρεύων की पहचान
  choice: विनाशक
  alternative: विनाश करनेवाला स्वर्गदूत
  rationale: प्रसंग न्याय या महामारी के दूत की ओर संकेत कर सकता है, पर यूनानी पाठ केवल ‘विनाश करनेवाला’ कहता है। इसलिए मुख्य पाठ अधिक विशिष्ट पहचान नहीं जोड़ता।
- issue: ταῦτα का संदर्भ
  choice: इन बातों
  alternative: पिछले पद के याजकीय वस्त्र और स्मृति-चिह्न
  rationale: संकेतवाचक का संदर्भ प्रसंग से ग्रहण किया जाता है, पर यूनानी उसे स्पष्ट रूप से दोहराता नहीं। अनुवाद इस अस्पष्टता को बनाए रखता है।
- issue: क्रोध की πεῖρα का अर्थ
  choice: क्रोध का अनुभव
  alternative: क्रोध की परीक्षा या प्रमाण
  rationale: संक्षिप्त यूनानी वाक्यांश क्रोध के अनुभव, परीक्षण अथवा प्रत्यक्ष प्रमाण की धारणा दे सकता है। मुख्य पाठ एक सहज अर्थ देता है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
