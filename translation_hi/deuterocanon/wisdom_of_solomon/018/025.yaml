  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की संक्षिप्तता और न्याय-संबंधी गंभीरता बनी रहती है। मुख्य पाठ में यूनानी के निहित संबंध को स्वाभाविक हिंदी में व्यक्त किया गया है, जबकि विनाशक की पहचान, संकेतवाचक के संदर्भ और बहुवचन क्रियारूप की कठिनाई पादटिप्पणियों में स्पष्ट की गई है।
