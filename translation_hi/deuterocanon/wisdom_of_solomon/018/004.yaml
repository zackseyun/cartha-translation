  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: hi
  text: क्योंकि वे लोग प्रकाश से वंचित किए जाने और अंधकार में बंदी बनाए जाने के योग्य थे, जिन्होंने तुम्हारे पुत्रों को बंद करके रखा था; उन्हीं के द्वारा व्यवस्था का अविनाशी प्रकाश युग को[a] दिया जाने वाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संसार को’ अथवा ‘सदा के लिए’। यूनानी में एकवचन ‘युग को’ है, जिसका भाव विश्वगत या कालगत हो सकता है।
    reason: αἰών की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἄξιοι
  choice: के योग्य थे
  rationale: यह यूनानी विशेषण दण्ड के नैतिक औचित्य को व्यक्त करता है। ‘के योग्य थे’ मूल संरचना के निकट रहते हुए न्याय-संबंधी भाव बनाए रखता है।
- source_word: στερηθῆναι φωτός
  choice: उजियाले से वंचित किए जाने
  rationale: निष्क्रिय क्रिया दण्डस्वरूप किसी वस्तु से वंचित किए जाने का भाव रखती है; यह अन्धकार की विपत्ति के प्रसंग को भी बनाए रखती है।
- source_word: φυλακισθῆναι σκότει
  choice: अन्धकार में बन्दी बनाए जाने
  rationale: φυλακίζω में कारावास या बन्दीकरण का स्पष्ट बिम्ब है, जिसे इस पद में प्रतिफलात्मक उलटाव के रूप में सुरक्षित रखा गया है।
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: जिन्होंने ... बन्दी बनाकर रखा था
  rationale: यह संयोजन किसी को घेरकर या बन्द करके निगरानी में रखने का अर्थ देता है। हिन्दी में यह वाक्यांश स्वाभाविक रूप से उस निरन्तर बन्धन को व्यक्त करता है।
- source_word: τοὺς υἱούς σου
  choice: तुम्हारे पुत्रों
  rationale: υἱούς स्पष्ट रूप से पुल्लिंग बहुवचन है। ‘पुत्रों’ मूल रूपक और परमेश्वर के लोगों के साथ उसके सम्बन्ध को बनाए रखता है।
- source_word: διʼ ὧν
  choice: उन्हीं के द्वारा
  rationale: सम्बन्धवाचक सर्वनाम का निकटतम पूर्वपद ‘तुम्हारे पुत्र’ है। ‘उन्हीं’ व्यक्तिगत सन्दर्भ और साधनात्मक बल दोनों को स्पष्ट रखता है।
- source_word: ἤμελλεν ... δίδοσθαι
  choice: दिया जानेवाला था
  rationale: μέλλω और infinitive अपेक्षित या नियत भावी घटना बताते हैं। यह हिन्दी प्रयोग भविष्यता को सुरक्षित रखता है, पर अनावश्यक तात्कालिकता नहीं जोड़ता।
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: व्यवस्था का अविनाशी उजियाला
  rationale: νόμου को ‘उजियाला’ का सम्बन्धकारक मानना सबसे सीधा है। ‘अविनाशी’ ἄφθαρτον के नष्ट न होनेवाले गुण को व्यक्त करता है।
- source_word: τῷ αἰῶνι
  choice: युग को
  rationale: αἰών एकवचन है और उसमें कालगत तथा विश्वगत दोनों सम्भावनाएँ हैं। ‘युग को’ मूल की एकवचन व्यापकता को सुरक्षित रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘तुम्हारे पुत्रों’ का सन्दर्भ और व्यवस्था के उजियाले के दिए जाने में उनकी भूमिका
  choice: ‘तुम्हारे पुत्र’ इस्राएल को सूचित करते हैं, और ‘उन्हीं के द्वारा’ उन्हें व्यवस्था के उजियाले के संप्रेषण का माध्यम बताता है।
  alternative: ‘जिनके द्वारा’ को अधिक ढीले अर्थ में उन घटनाओं के द्वारा समझा जा सकता है।
  rationale: διʼ ὧν का निकटतम व्याकरणिक पूर्वपद τοὺς υἱούς σου है। अनुवाद व्यक्तिगत पूर्वपद को बनाए रखता है, पर इससे आगे कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: αἰών का अर्थ
  choice: मुख्य पाठ में ‘युग’ रखा गया है।
  alternative: ‘संसार’ अथवा ‘सदा के लिए’।
  rationale: यूनानी शब्द में काल, युग और विश्व-व्यवस्था की अर्थ-छायाएँ हो सकती हैं। मुख्य पाठ मूल के एकवचन को बनाए रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
