  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। ‘उजियाला’, ‘व्यवस्था’, ‘अविनाशी’ और ‘बन्दी’ मूल बिम्बों तथा धार्मिक साहित्यिक स्वर को बनाए रखते हैं। पादटिप्पणी-चिह्न सम्बन्धित विवादित वाक्यांश के तुरन्त बाद रखा गया है।
