  text: दास और स्वामी दोनों को समान दंड[a] दिया गया, और साधारण जन ने भी राजा के समान ही कष्ट सहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समान दंडादेश”; यूनानी शब्द का अर्थ प्रसंग के अनुसार दंड, दंडादेश या न्याय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: समान
  rationale: यह शब्द तुल्य या समान होने का भाव देता है; अगले खंड के τὰ αὐτά के साथ मिलकर यह सामाजिक पद की भिन्नता के बावजूद दंड की समानता पर बल देता है।
- source_word: δίκη
  choice: दंड
  rationale: इस प्रसंग में यह अमूर्त न्याय की अपेक्षा दिए गए दंड या दंडात्मक परिणाम को सूचित करता है। इसकी अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δοῦλος
  choice: दास
  rationale: δεσπότης के साथ स्पष्ट सामाजिक विरोध होने के कारण ‘दास’ बंधुआ अधीनता को ‘सेवक’ से अधिक ठीक व्यक्त करता है।
- source_word: δεσπότῃ
  choice: स्वामी
  rationale: दास के संबंध में यह सामाजिक अधिकार रखने वाले स्वामी को दर्शाता है; ‘प्रभु’ यहाँ अनावश्यक धार्मिक अर्थ जगा सकता है।
- source_word: κολασθείς
  choice: दिया गया
  rationale: δίκη के साथ मिलाकर ‘दंड दिया गया’ स्वाभाविक हिन्दी में यूनानी के दंडित किए जाने के निष्क्रिय भाव को व्यक्त करता है।
- source_word: δημότης
  choice: साधारण जन
  rationale: राजा के विपरीत सामान्य सामाजिक स्तर के व्यक्ति का आशय स्पष्ट करता है, बिना आधुनिक नागरिकता का संकीर्ण अर्थ आरोपित किए।
- source_word: βασιλεῖ
  choice: राजा
  rationale: शब्द का सीधा और प्रसंगानुकूल अर्थ है तथा सामाजिक पदों का विरोध बनाए रखता है।
- source_word: τὰ αὐτὰ πάσχων
  choice: समान ही कष्ट सहे
  rationale: एक ही प्रकार की पीड़ा झेलने के भाव को स्वाभाविक हिन्दी में रखता है और ‘भाग्य’ जैसी अतिरिक्त व्याख्या से बचता है।
theological_decisions:
- issue: न्याय के समय सामाजिक पदों की समानता
  choice: ‘दास और स्वामी’ तथा ‘साधारण जन’ और ‘राजा’ के सामाजिक विरोधों को स्पष्ट रूप से बनाए रखा गया।
  alternative: ‘सेवक और मालिक’ अथवा सामाजिक पदों को सामान्यीकृत करना
  rationale: पद यह दिखाता है कि दंड सामाजिक श्रेणी देखकर नहीं टला; मूल यूनानी के तीखे सामाजिक विरोध को नरम करना इस बल को घटा देता।
- issue: δίκη का दंडात्मक या न्यायिक अर्थ
  choice: मुख्य पाठ में ‘दंड’
  alternative: ‘न्याय’ या ‘दंडादेश’
  rationale: तात्कालिक प्रसंग दंड भोगने का है, फिर भी यूनानी शब्द की न्यायिक अर्थ-छाया को पादटिप्पणी में स्वीकार किया गया है।
