base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/022.yaml
  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: hi
  text: उसने जनसमूह पर न तो शारीरिक बल से, न हथियारों की शक्ति से विजय पाई; बल्कि वचन के द्वारा दण्ड देनेवाले[a] को वश में किया और उसे पूर्वजों की शपथों[b] और वाचाओं का स्मरण दिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दण्ड दे रहा था।” यूनानी पाठ यह स्पष्ट नहीं करता कि इससे परमेश्वर, कोई विनाशक स्वर्गदूत, या व्यक्तीकृत न्याय अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या, “पूर्वजों से की गई शपथों” या “पूर्वजों से संबंधित शपथों।” यूनानी पदबंध संबंध की दिशा को स्पष्ट नहीं करता; प्रसंग में यह पितृपुरुषों के संबंध में की गई वाचाई प्रतिज्ञाओं को स्मरण कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησεν τὸν ὄχλον
  choice: जनसमूह पर ... विजय पाई
  rationale: νικάω विजय पाने या प्रबल होने को व्यक्त करता है, जबकि ὄχλος सामूहिक जनसमूह को। यह रूप सैन्य संहार का अनावश्यक भाव जोड़े बिना यूनानी वाक्य का विजय-संबंधी चित्र बनाए रखता है।
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: न तो शारीरिक बल से
  rationale: करणवाचक दत्तिव को स्वाभाविक हिन्दी में ‘से’ द्वारा व्यक्त किया गया है और शरीर की शक्ति का अर्थ सुरक्षित रखा गया है।
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: न हथियारों की शक्ति से
  rationale: ἐνέργεια यहाँ हथियारों की सक्रिय सामर्थ्य या प्रभाव को दर्शाता है; ‘शक्ति’ सरल और प्रसंगानुकूल है।
- source_word: ἀλλὰ λόγῳ
  choice: बल्कि वचन के द्वारा
  rationale: λόγος का संक्षिप्त अर्थ ‘वचन’ रखा गया है। इससे शारीरिक बल और हथियारों के विपरीत बोले गए निवेदन का संकेत मिलता है, पर ‘मध्यस्थता’ जैसी व्याख्या मूल पाठ में नहीं जोड़ी जाती।
- source_word: τὸν κολάζοντα
  choice: दण्ड देनेवाले
  rationale: वर्तमान कृदन्त को कर्ता-संज्ञा के रूप में अनूदित किया गया है। हिन्दी पद उस कर्ता की पहचान परमेश्वर, स्वर्गदूत या व्यक्तीकृत न्याय के रूप में निश्चित नहीं करता।
- source_word: ὑπέταξεν
  choice: वश में किया
  rationale: ὑποτάσσω अधीन करने या नियंत्रण में लाने का अर्थ देता है। ‘वश में किया’ चित्र की शक्ति बनाए रखता है, बिना अनावश्यक रूप से पूर्ण प्रभुत्व का सिद्धान्त गढ़े।
- source_word: ὅρκους πατέρων
  choice: पूर्वजों से की गई शपथों
  rationale: πατέρων का जननकारक व्याकरणतः ‘पूर्वजों की’ भी हो सकता है, पर पितृपुरुषों से संबंधित वाचाई प्रसंग में ‘पूर्वजों से की गई’ शपथों की दिशा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: καὶ διαθήκας
  choice: और वाचाओं
  rationale: बाइबलीय यूनानी में διαθήκη का मानक अर्थ ‘वाचा’ है। मूल का बहुवचन सुरक्षित रखा गया है।
- source_word: ὑπομνήσας
  choice: स्मरण दिलाया
  rationale: अओरिस्ट कृदन्त साधन अथवा सहगामी क्रिया बताता है। यूनानी में कर्म निहित है; हिन्दी में पठनीयता के लिए ‘उसे’ जोड़ा गया, जिसका संभावित संदर्भ वही दण्ड देनेवाला है।
theological_decisions:
- issue: ‘दण्ड देनेवाले’ की पहचान और ‘स्मरण दिलाया’ का निहित कर्म
  choice: मुख्य पाठ में ‘दण्ड देनेवाले’ और ‘उसे’ रखा गया, पर उसकी पहचान निर्दिष्ट नहीं की गई।
  alternative: ‘दण्ड दे रहे जन’, ‘विनाशक स्वर्गदूत’, अथवा स्वयं परमेश्वर
  rationale: यूनानी पाठ केवल संज्ञीकृत कृदन्त देता है और कर्ता की स्पष्ट पहचान नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: λόγῳ का अर्थ
  choice: ‘वचन के द्वारा’
  alternative: ‘कथन से’, ‘प्रार्थना द्वारा’, अथवा ‘तर्क से’
  rationale: मूल का संक्षिप्त साधनवाचक रूप सुरक्षित रखा गया है; ‘प्रार्थना’ या ‘मध्यस्थता’ प्रसंगगत व्याख्या होती, प्रत्यक्ष अनुवाद नहीं।
- issue: ὅρκους πατέρων में संबंध
  choice: ‘पूर्वजों से की गई शपथों’
  alternative: ‘पूर्वजों की शपथों’
  rationale: जननकारक स्वयं संबंध की दिशा को पूरी तरह स्पष्ट नहीं करता। मुख्य पाठ वाचाई संदर्भ में पूर्वजों को दी गई शपथों का अर्थ देता है और वैकल्पिक व्याकरणिक पठन पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रजिस्टर अपनाया गया है। ‘वाचा’, ‘वचन’ और ‘दण्ड’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य में मूल यूनानी का बल/हथियार बनाम वचन का विरोध और दोनों बहुवचन—शपथें तथा वाचाएँ—सुरक्षित हैं।
