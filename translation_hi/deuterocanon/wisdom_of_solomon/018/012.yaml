  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: hi
  text: और सबके सब मृत्यु के एक ही दण्डादेश के अधीन थे, और उनके यहाँ असंख्य मृतक थे; क्योंकि उन्हें दफनाने के लिए जीवित लोग भी पर्याप्त नहीं थे, चूँकि एक ही क्षण में उनकी सबसे अधिक सम्मानित संतान[a] नष्ट हो गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके पहलौठे।” प्रसंग मिस्र के पहलौठों पर आई विपत्ति की ओर संकेत करता है, यद्यपि यूनानी का अधिक शाब्दिक अर्थ “उनकी सबसे अधिक सम्मानित संतान/वंश” है।
    reason: प्रसंगगत वैकल्पिक अर्थ को सुरक्षित रखना, बिना उसे मुख्य पाठ में यूनानी से अधिक स्पष्ट बनाए।
lexical_decisions:
- source_word: ὁμοθυμαδὸν δὲ πάντες
  choice: और सबके सब एक साथ
  rationale: यह सामूहिकता और एक ही समय में सब पर आई दशा को व्यक्त करता है; ‘एकमत होकर’ यहाँ जान-बूझकर किए गए निर्णय का भ्रामक भाव देता।
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: मृत्यु के एक ही दण्डादेश के अधीन
  rationale: यूनानी में शाब्दिक रूप से मृत्यु के ‘एक नाम/अभिधान’ की असामान्य अभिव्यक्ति है। प्रसंग में यह सब पर लागू मृत्यु की एक समान घोषणा या दण्ड को सूचित करती है; हिन्दी में यह चयन उस न्यायिक-विपत्तिपरक भाव को सुबोध रखता है।
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: उनके यहाँ असंख्य लोग मरे पड़े थे
  rationale: यह मूल के अधिकारसूचक विन्यास और मृतकों की गिनती से परे संख्या, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδὲ γὰρ πρὸς τὸ θάψαι οἱ ζῶντες ἦσαν ἱκανοί
  choice: क्योंकि जीवित लोग उन्हें गाड़ने के लिए भी पर्याप्त नहीं थे
  rationale: ‘जीवित लोग’ मृतकों के साथ मूल विरोध को बनाए रखता है, और ‘भी पर्याप्त नहीं थे’ दफ़नाने की असमर्थता को निकटता से व्यक्त करता है।
- source_word: πρὸς μίαν ῥοπὴν
  choice: एक ही क्षण में
  rationale: यह घटना की अत्यधिक आकस्मिकता को स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी में प्रकट करता है।
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: उनकी सबसे अधिक सम्मानित सन्तान
  rationale: γένεσις यहाँ जन्म की अमूर्त क्रिया के बजाय सन्तान या वंश को सूचित करता है। ἐντιμοτέρα उनके विशेष मूल्य और प्रतिष्ठा को व्यक्त करता है; मुख्य पाठ में ‘पहलौठे’ रख देने से यूनानी से अधिक स्पष्टता आ जाती।
- source_word: διεφθάρη
  choice: नष्ट हो गई थी
  rationale: यह विनाशकारी हानि और यूनानी के कर्मवाच्य रूप, दोनों को बनाए रखता है।
theological_decisions:
- issue: क्या मिस्र के पहलौठों की ओर संकेत को मुख्य पाठ में स्पष्ट कर दिया जाए
  choice: उनकी सबसे अधिक सम्मानित सन्तान
  alternative: उनके पहलौठे
  rationale: व्यापक प्रसंग मिस्र के पहलौठों की मृत्यु की ओर संकेत करता है, पर इस पद में πρωτότοκος जैसा स्पष्ट शब्द नहीं, बल्कि ἡ ἐντιμοτέρα γένεσις है। इसलिए मुख्य पाठ यूनानी की वर्णनात्मक और कुछ हद तक खुली अभिव्यक्ति बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और शोकपूर्ण गद्य रखा गया है। ‘सबके सब एक साथ’ सामूहिक आकस्मिकता को, और ‘दण्डादेश के अधीन’ मृत्यु की साझा घोषणा के कठिन यूनानी मुहावरे को सामान्य पाठक के लिए सुबोध बनाता है। ‘सन्तान’ को एकवचन सामूहिक संज्ञा के रूप में रखा गया है।
