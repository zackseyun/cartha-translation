- issue: ὅσιοι और ἅγιοι के बीच संबंध
  choice: क्रमशः ‘भक्त’ और ‘पवित्र’ द्वारा दोनों शब्दों का सूक्ष्म भेद बनाए रखा गया है।
  alternative: दोनों को ‘पवित्र’ कहना।
  rationale: दोनों पद धार्मिक निष्ठा के निकट अर्थ रखते हैं, पर वे एक ही यूनानी शब्द नहीं हैं। भेद रखने से अर्थ स्पष्ट होता है और बाद की किसी तकनीकी धार्मिक श्रेणी को नहीं थोपा जाता।
- issue: τῆς θειότητος की असामान्य अभिव्यक्ति
  choice: मुख्य पाठ में ‘ईश्वरीय व्यवस्था’, और पाद-टिप्पणी में अधिक शाब्दिक रूप।
  alternative: ‘दिव्यता की व्यवस्था’।
  rationale: मुख्य रूप स्वाभाविक हिन्दी देता है, जबकि टिप्पणी मूल पदबंध की वास्तविक असामान्यता और संभावित अर्थ-तनाव को सुरक्षित रखती है।
