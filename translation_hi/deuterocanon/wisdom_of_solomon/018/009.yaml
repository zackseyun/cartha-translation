  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: hi
  text: क्योंकि भले लोगों की धर्मनिष्ठ संतानें गुप्त रूप से[a] बलिदान चढ़ाती थीं और एकमत होकर ईश्वरीय व्यवस्था[b] ठहराती थीं कि पवित्र जन[c] उन्हीं अच्छी वस्तुओं और खतरों में समान रूप से सहभागी हों, जबकि उनके पिता पहले ही स्तुतिगान कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छिपकर।’ यूनानी शब्द इस बात पर बल देता है कि बलिदान छिपे हुए ढंग से चढ़ाए जा रहे थे।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘दिव्यता की व्यवस्था।’ यूनानी पदबंध असामान्य है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘संत।’ यूनानी में अधिक शाब्दिक अर्थ ‘पवित्र जन’ है; यहाँ इसे बाद की किसी तकनीकी धार्मिक उपाधि के रूप में नहीं समझना चाहिए।
    reason: alternative_reading
