base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: hi
  text: जब उन्होंने पवित्र जनों के शिशुओं को मार डालने का निश्चय किया था, और एक बालक को बाहर छोड़ दिया गया और बचा लिया गया था[a], तब उन्हें फटकारने के लिए तूने उनके बहुत-से बच्चों को छीन लिया और उन सबको एक साथ प्रचंड जल में नष्ट कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक बालक’ से सम्भवतः मूसा की ओर संकेत है, जिसे बाहर छोड़ दिया गया था, पर वह जीवित बचा लिया गया (निर्गमन 2:3–10)।
    reason: cross_reference
  - marker: b
    text: इसका अनुवाद ‘उग्र जल में’ या ‘अत्यन्त वेगवान जल में’ भी हो सकता है। यूनानी में शाब्दिक रूप से ‘प्रचंड जल में’ है; यहाँ समुद्र विनाश का साधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  choice: निश्चय किया
  rationale: यह कृदंत सोच-विचारकर बनाई गई योजना या दृढ़ निर्णय को व्यक्त करता है; ‘निश्चय किया’ आधुनिक हिन्दी में उसकी जानबूझकर की गई मंशा स्पष्ट करता है।
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: पवित्र जनों के शिशुओं
  rationale: ὅσιοι परमेश्वर के पवित्र लोगों को सूचित करता है और νήπια बहुत छोटे बच्चों को; यह रूप स्रोत के निकट रहते हुए बाद की पारिभाषिक धारणाएँ नहीं जोड़ता।
- source_word: ἑνὸς ... τέκνου
  choice: एक बालक
  rationale: τέκνον का मूल अर्थ ‘संतान/बच्चा’ है; प्रसंग मूसा की ओर संकेत करता है। हिन्दी में ‘बालक’ स्वाभाविक है, यद्यपि यूनानी संज्ञा स्वयं लिंग को व्याकरणिक रूप से निर्दिष्ट नहीं करती।
- source_word: ἐκτεθέντος
  choice: त्याग दिए जाने
  rationale: क्रिया किसी शिशु को बाहर छोड़ देने या परित्यक्त कर देने को दर्शाती है; ‘त्याग दिए जाने’ घटना का आशय सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: σωθέντος
  choice: बचा लिया गया
  rationale: यहाँ संकट से जीवित बचाए जाने का कथात्मक अर्थ प्रमुख है; यह अनावश्यक रूप से तकनीकी धर्मवैज्ञानिक रंग नहीं देता।
- source_word: εἰς ἔλεγχον
  choice: उन्हें दोषी ठहराने के लिए
  rationale: ἔλεγχος में अपराध को उजागर करने, दोष सिद्ध करने और ताड़ना का न्यायिक भाव है; यह अनुवाद उस बल को ‘फटकार’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: ἀφεῖλον
  choice: तूने ... छीन लिया
  rationale: क्रिया का अर्थ दूर करना या ले लेना है; मृत्यु के इस प्रसंग में ‘छीन लिया’ स्वाभाविक और प्रभावशाली है।
- source_word: πλῆθος τέκνων
  choice: उनके बहुत-से बच्चों
  rationale: πλῆθος बड़ी संख्या पर बल देता है और पहले आए ‘एक बालक’ के साथ जानबूझकर किया गया विरोध बनाए रखता है।
- source_word: ὁμοθυμαδόν
  choice: उन सबको एक साथ
  rationale: इस प्रसंग में क्रियाविशेषण सामूहिक विनाश को दर्शाता है; ‘एक साथ’ सहज आधुनिक हिन्दी है।
- source_word: ἐν ὕδατι σφοδρῷ
  choice: प्रचंड जल में
  rationale: σφοδρός जल की तीव्र, हिंसक और प्रबल शक्ति बताता है; ‘प्रचंड जल’ यूनानी एकवचन सामूहिक रूप और समुद्र की विनाशकारी शक्ति दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘एक बालक’ का संदर्भ
  choice: शब्दों को सामान्य रखते हुए मूसा के परित्याग और बचाए जाने की ओर संकेत
  alternative: परमेश्वर द्वारा बचाए गए किसी अनिर्दिष्ट इस्राएली बच्चे का सामान्य उल्लेख
  rationale: भाषा निर्गमन 2:3–10 में मूसा के वृत्तांत की प्रबल प्रतिध्वनि करती है और मिस्र द्वारा शिशुओं के वध तथा मिस्र की संतानों पर न्याय के बीच विरोध रचती है; मुख्य पाठ नाम जोड़कर संकेत को निश्चित कथन नहीं बनाता।
- issue: ὅσιοι का अर्थ
  choice: पवित्र जन
  alternative: भक्त जन; विश्वासयोग्य जन; संत
  rationale: यह पद परमेश्वर के पवित्र लोगों को सूचित करता है। ‘पवित्र जन’ स्रोत के निकट है और ‘संत’ से जुड़ी बाद की पारिभाषिक या सम्प्रदायगत धारणाओं से बचता है।
- issue: दूसरे पुरुष एकवचन संबोधन
  choice: परमेश्वर के लिए ‘तूने’
  alternative: ‘आपने’
  rationale: यूनानी क्रियाएँ दूसरे पुरुष एकवचन में हैं। हिन्दी बाइबलीय काव्य और प्रार्थना की गरिमामय परंपरा में ‘तू’ निकट और प्रत्यक्ष संबोधन को सुरक्षित रखता है, अनादर का संकेत नहीं देता।
translation_notes:
  register: आधुनिक, सहज और गरिमामय मानक हिन्दी। वाक्य में ‘एक बालक’ और ‘बहुत-से बच्चों’ का अलंकारिक विरोध सुरक्षित रखा गया है। परमेश्वर को प्रत्यक्ष दूसरे पुरुष एकवचन ‘तूने’ से संबोधित किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
