  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: hi
  text: परन्तु तेरे पवित्र जनों के लिए अत्यन्त तेज प्रकाश था; उनकी आवाज़ सुनते हुए, पर उनका रूप न देखते हुए, क्योंकि वे भी लालायित थे,[a] वे उन्हें धन्य मानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया ἐπεπώθεισαν का सामान्य अर्थ है, “वे लालायित थे” या “वे तरसते थे”; इसका कर्म पाठ में व्यक्त नहीं है। संदर्भ के आधार पर कुछ व्याख्याएँ इसे इस भाव से समझती हैं कि वे उन्हीं कष्टों से नहीं गुज़रे थे, पर यह अर्थ यूनानी शब्दों में सीधे नहीं कहा गया है।
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: तेरे पवित्र जनों के लिए
  rationale: ὅσιος परमेश्वर के प्रति पवित्र और भक्त लोगों को सूचित करता है। ‘पवित्र जन’ धार्मिक अर्थ को बनाए रखता है और किसी बाद की औपचारिक उपाधि को नहीं थोपता।
- source_word: μέγιστον ... φῶς
  choice: अत्यन्त तेज प्रकाश
  rationale: μέγιστον यहाँ प्रकाश की असाधारण तीव्रता बताता है; यह हिन्दी में स्वाभाविक ढंग से सुपरलेटिव बल व्यक्त करता है।
- source_word: φωνὴν
  choice: आवाज़
  rationale: φωνή का अर्थ ध्वनि या आवाज़ हो सकता है; व्यक्तियों के संदर्भ और दृश्य रूप के साथ विरोध के कारण ‘आवाज़’ उपयुक्त है।
- source_word: μορφὴν
  choice: रूप
  rationale: μορφή दृश्य रूप या आकृति को बताता है। ‘रूप’ सुनने और न देखने के विरोध को संक्षिप्त रूप से सुरक्षित रखता है।
- source_word: ἐπεπώθεισαν
  choice: वे भी उनके लिए तरसते रहे थे
  rationale: दिए गए यूनानी पाठ का यह क्रियारूप ποθέω, ‘तरसना/लालसा रखना,’ से है। कर्म स्पष्ट रूप से व्यक्त नहीं है, इसलिए हिन्दी में निकटतम सम्भावित सर्वनाम दिया गया है और पाठगत-संदर्भगत कठिनाई को टिप्पणी में स्पष्ट किया गया है; ‘कष्ट नहीं सहा था’ को मुख्य पाठ में रखना इस उपलब्ध यूनानी रूप से सीधे सिद्ध नहीं होता।
- source_word: ἐμακάριζον
  choice: वे उन्हें धन्य मानते थे
  rationale: μακαρίζω का अर्थ किसी को धन्य या सौभाग्यशाली मानना/कहना है। ‘धन्य मानते थे’ मूल्यांकन का धार्मिक और सामान्य दोनों बल बनाए रखता है।
theological_decisions:
- issue: सुनने, न देखने और धन्य मानने वाली क्रियाओं का निहित कर्ता
  choice: मिस्री अथवा बाहर के सुनने वाले लोग इस्राएलियों की आवाज़ सुनते, उनका रूप नहीं देखते और उन्हें धन्य मानते हैं।
  alternative: वाक्य की संक्षिप्त यूनानी रचना के कारण पवित्र जनों को किसी दूसरे समूह की आवाज़ सुनने वाला समझा जा सकता है।
  rationale: आसपास का प्रसंग मिस्रियों के अन्धकार और परमेश्वर की प्रजा के प्रकाश का विरोध करता है; इसलिए निहित कर्ता के रूप में मिस्रियों को समझना सर्वाधिक स्वाभाविक है, यद्यपि अनुवाद में उन्हें नाम देकर अस्पष्टता पूरी तरह समाप्त नहीं की गई।
- issue: ἐπεπώθεισαν का अर्थ और उसका प्रसंग से सम्बन्ध
  choice: दिए गए यूनानी रूप का प्रत्यक्ष अर्थ ‘वे तरसते रहे थे’ रखा गया है।
  alternative: कुछ प्राचीन या संदर्भाधारित परम्पराएँ इसे ‘उन्होंने वही कष्ट नहीं सहे थे’ जैसे अर्थ में समझती हैं।
  rationale: प्रस्तुत यूनानी पाठ में न तो स्पष्ट निषेध है, न ‘वही बातें,’ और क्रिया पोथेओ से है। संदर्भगत वैकल्पिक अर्थ महत्त्वपूर्ण है, पर उसे मुख्य पाठ में रख देने से स्रोत की वास्तविक कठिनाई और सम्भावित पाठगत समस्या छिप जाएगी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। परमेश्वर को एकवचन सम्बोधन के कारण ‘तेरे’ रखा गया है। वाक्य की निहित कर्ता-संबंधी अस्पष्टता को अनावश्यक नाम जोड़कर समाप्त नहीं किया गया, और कठिन यूनानी क्रिया के लिए मुख्य पाठ को स्रोत-निकट रखते हुए वैकल्पिक संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
