  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: hi
  text: परन्तु धर्मी जन, मर जाने पर भी,[a] जीवित अधर्मियों को दोषी ठहराएगा; और शीघ्र पूर्ण हुआ यौवन अधर्मी की दीर्घ वृद्धावस्था को दोषी ठहराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरकर” अथवा “मृत्यु के बाद।” यूनानी कृदन्त को अधिक शाब्दिक रूप में ऐसे भी अनूदित किया जा सकता है; मुख्य पाठ प्रसंग में निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινεῖ
  choice: दोषी ठहराएगा
  rationale: यह क्रिया किसी के विरुद्ध न्यायिक निर्णय या दण्डादेश का भाव रखती है। ‘दोषी ठहराएगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है। दूसरे उपवाक्य में यही क्रिया अर्थ की दृष्टि से निहित है, इसलिए उसे स्पष्टता के लिए दोहराया गया है।
- source_word: δίκαιος
  choice: धर्मी जन
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी जन’ व्यक्तिगत संदर्भ और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: καμών
  choice: मर जाने पर भी
  rationale: आस-पास के प्रसंग में यह धर्मी की असमय मृत्यु की ओर संकेत करता है। ‘पर भी’ मृत धर्मी और जीवित भक्तिहीनों के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: जीवित भक्तिहीनों
  rationale: यह उन भक्तिहीन लोगों को दर्शाता है जो मृत धर्मी के विपरीत अब भी जीवित हैं। ‘भक्तिहीन’ ἀσεβής के ईश्वर-विमुख या अधार्मिक भाव को व्यक्त करता है।
- source_word: νεότης
  choice: यौवन
  rationale: यह युवा अवस्था या कम आयु को दर्शाता है। ‘यौवन’ वृद्धावस्था के साथ मूल पाठ के विरोध को बनाए रखता है।
- source_word: τελεσθεῖσα
  choice: पूर्णता को पहुँचा हुआ
  rationale: यह पूर्ण किए जाने या अपने लक्ष्य तक पहुँचने का भाव रखता है। यह अनुवाद नैतिक निष्पापता का अनावश्यक अर्थ जोड़े बिना पूर्णता की धारणा को सुरक्षित रखता है।
- source_word: ταχέως
  choice: शीघ्र ही
  rationale: यह कम समय में घटित होने का सीधा और स्वाभाविक हिन्दी संकेत है।
- source_word: πολυετὲς γῆρας
  choice: वर्षों लंबी वृद्धावस्था
  rationale: यह बहुत वर्षों वाली वृद्धावस्था को दर्शाता है। यह वाक्यांश संक्षिप्त यौवन और दीर्घ जीवन के बीच विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀδίκου
  choice: अधर्मी की
  rationale: संबंधकारक रूप बताता है कि वृद्धावस्था एक अधर्मी व्यक्ति की है। ‘अधर्मी’ पहले आए ‘धर्मी’ के साथ मूल पाठ का स्पष्ट नैतिक विरोध बनाए रखता है।
theological_decisions:
- issue: संदर्भ में καμών का अर्थ
  choice: मर जाने पर भी
  alternative: मरकर; मृत्यु के बाद
  rationale: अध्याय का प्रसंग कम आयु में मरने वाले धर्मी व्यक्ति का है। मुख्य पाठ संदर्भगत मृत्यु और निहित विरोध को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: τελεσθεῖσα में पूर्णता की भाषा
  choice: पूर्णता को पहुँचा हुआ
  alternative: सिद्ध किया गया; पूर्ण किया गया
  rationale: ‘सिद्ध’ आधुनिक धार्मिक हिन्दी में नैतिक या आध्यात्मिक निष्पापता का अधिक विशिष्ट अर्थ ग्रहण कर सकता है। चुना हुआ रूप लक्ष्य या समापन तक पहुँचने का व्यापक यूनानी भाव सुरक्षित रखता है।
- issue: दूसरे उपवाक्य में κατακρινεῖ की पुनरावृत्ति
  choice: दोषी ठहराएगा को स्पष्ट रूप से दोहराना
  alternative: क्रिया को लुप्त रखकर केवल समानांतर वाक्य बनाना
  rationale: यूनानी में पहली क्रिया दूसरे समानांतर उपवाक्य पर भी लागू होती है। हिन्दी में उसे दोहराने से अर्थ स्पष्ट होता है और कोई नया धर्मवैचारिक दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की समानांतर न्याय-विषयक संरचना तथा धर्मी के अल्प जीवन और अधर्मी की दीर्घ वृद्धावस्था के बीच तनाव को सुरक्षित रखा गया है।
