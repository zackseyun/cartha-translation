  text: क्योंकि उसकी आत्मा प्रभु को प्रिय थी; इसलिए उसने उसे दुष्टता के बीच से शीघ्र निकाल लिया।[a] पर लोगों ने यह देखकर भी नहीं समझा और न ऐसी बात पर ध्यान दिया,
  philosophy: optimal-equivalence
