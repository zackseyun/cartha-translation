    text: या, “उसने उसे बुराई के बीच से जल्दी हटा लिया।” यूनानी क्रिया जल्दी या तत्परता पर बल देती है, और यहाँ πονηρία का अनुवाद “दुष्टता” या “बुराई” दोनों हो सकता है।
    reason: शब्दार्थ के वैकल्पिक अनुवाद और क्रिया में निहित शीघ्रता को दिखाना।
lexical_decisions:
- source_word: ἀρεστὴ
  choice: प्रिय
  rationale: यह विशेषण प्रभु को स्वीकार्य और प्रसन्न करनेवाला होने का संबंधपरक भाव व्यक्त करता है; आधुनिक हिन्दी में ‘प्रिय’ स्वाभाविक और गरिमापूर्ण है।
- source_word: Κυρίῳ
  choice: प्रभु को
  rationale: दत्तिव कारक उस व्यक्ति को सूचित करता है जिसे आत्मा प्रिय थी; ‘प्रभु’ परमेश्वर के लिए प्रचलित और उपयुक्त पद है।
- source_word: ψυχὴ
  choice: आत्मा
  rationale: यहाँ शब्द व्यक्ति के भीतरी जीवन और उसके वास्तविक स्वरूप का बोध कराता है; ‘आत्मा’ इस धार्मिक और मानवशास्त्रीय भार को बनाए रखता है।
- source_word: ἔσπευσεν
  choice: शीघ्र निकाल लिया
  rationale: क्रिया में तत्परता अथवा जल्दी करने का भाव है। हिन्दी में यह प्रयोग उस भाव को रखते हुए यह भी स्पष्ट करता है कि प्रभु ने उसे दुष्टता के बीच से बाहर किया।
- source_word: ἐκ μέσου πονηρίας
  choice: दुष्टता के बीच से
  rationale: यह पद नैतिक बुराई के क्षेत्र के भीतर से निकाले जाने का स्थानात्मक रूपक बनाए रखता है।
- source_word: λαοὶ
  choice: लोगों
  rationale: यूनानी रूप व्याकरणतः बहुवचन है। ‘लोगों’ हिन्दी में अनेक मानवीय दर्शकों को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘जनसमूहों’ इस संदर्भ में अनावश्यक रूप से भारी होता।
- source_word: ἰδόντες καὶ μὴ νοήσαντες
  choice: यह देखकर भी नहीं समझा
  rationale: ‘भी’ देखने और फिर भी न समझने के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है। सामूहिक कर्ता ‘लोगों’ के साथ एकवचन क्रिया हिन्दी व्याकरण के अनुसार है।
- source_word: μηδὲ θέντες ἐπὶ διανοίᾳ
  choice: न ऐसी बात पर मन लगाया
  rationale: शाब्दिक अर्थ ‘मन पर रखना’ है, अर्थात गंभीरता से विचार करना। ‘मन लगाना’ उस मुहावरे का अर्थ सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸ τοιοῦτο
  choice: ऐसी बात
  rationale: यह पिछले वर्णित ईश्वरीय कार्य की ओर व्यापक रूप से संकेत करता है और यूनानी अभिव्यक्ति की अनिश्चितता बनाए रखता है।
theological_decisions:
- issue: ἔσπευσεν का निहित कर्ता
  choice: निकटतम पूर्ववर्ती ‘प्रभु’ को कर्ता मानकर ‘उसने’ कहा गया है।
  alternative: अव्यक्त रूप में ‘उसे शीघ्र निकाल लिया गया’ कहा जा सकता था।
  rationale: पिछले उपवाक्य में प्रभु का स्पष्ट उल्लेख और प्रसंग धर्मी व्यक्ति को दुष्टता से हटाए जाने को प्रभु का कार्य बताते हैं; सर्वनाम मूल में निहित संबंध को स्पष्ट करता है, कोई नया धर्मसिद्धान्त नहीं जोड़ता।
- issue: ψυχὴ का अर्थक्षेत्र
  choice: ‘आत्मा’
  alternative: ‘जीवन’ या ‘व्यक्ति’
  rationale: ‘आत्मा’ मूल के धार्मिक और आंतरिक-व्यक्तित्व संबंधी अर्थ को खुला रखता है; इसे केवल जैविक जीवन या सम्पूर्ण व्यक्ति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम सुरक्षित रखा गया है। ‘लोगों’ से यूनानी बहुवचन का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
