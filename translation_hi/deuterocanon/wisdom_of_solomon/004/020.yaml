  choice: आएँगे
  rationale: ἔρχομαι के भविष्यत् रूप का सरल और प्रसंगानुकूल अर्थ; यह न्याय या उजागर किए जाने के लिए उनके उपस्थित होने को व्यक्त करता है।
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: अपने पापों पर विचार करते हुए
  rationale: συλλογισμός तर्क, विचार या मन के भीतर हिसाब लगाने की प्रक्रिया को दर्शाता है। यह अनुवाद पश्चात्ताप का भाव जोड़े बिना मानसिक आत्म-समीक्षा को स्वाभाविक हिन्दी में रखता है।
- source_word: δειλοί
  choice: भयभीत होकर
  rationale: δειλός का अर्थ भयभीत, डरपोक या कायर हो सकता है। यहाँ यह उनके आने की दशा या ढंग बताता है; ‘भयभीत होकर’ आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक कायरता का भाव पादटिप्पणी में रखा गया है।
- source_word: ἐλέγξει
  choice: दोष सिद्ध करेंगे
  rationale: ἐλέγχω यहाँ उजागर करने, दोष प्रमाणित करने या दोषी ठहराने का न्यायिक-नैतिक भाव रखता है। हिन्दी में ‘दोष सिद्ध करेंगे’ इस निर्णायक प्रमाण को स्पष्ट करता है।
- source_word: ἐξ ἐναντίας
  choice: आमने-सामने
  rationale: यह पदबंध सामने से विरोध या प्रत्यक्ष सामना करने का चित्र प्रस्तुत करता है। ‘आमने-सामने’ उसकी जीवंतता और विरोधात्मक बल दोनों बनाए रखता है।
- source_word: τὰ ἀνομήματα αὐτῶν
  choice: उनके अधर्म के काम
  rationale: ἀνόμημα व्यवस्था या नियम के उल्लंघन वाले कर्म को सूचित करता है। ‘अधर्म के काम’ इसे पहले आए ‘पापों’ से अलग रखते हुए सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ‘पापों’ और ‘अधर्म के कामों’ के बीच संबंध
  choice: दोनों यूनानी नैतिक पदों को अलग-अलग हिन्दी अभिव्यक्तियों में रखा गया है।
  alternative: दोनों को केवल ‘पाप’ कहना।
  rationale: ἁμαρτήματα और ἀνομήματα निकट संबंध रखते हैं, पर एक ही शब्द नहीं हैं। भेद रखने से पहले पापों पर भीतरी विचार और फिर उन्हीं के अधर्मपूर्ण कामों द्वारा बाहरी दोष-सिद्धि की काव्यात्मक तीव्रता बनी रहती है।
- issue: दोष सिद्ध करने वाले का कर्ता
  choice: उनके अपने अधर्म के काम ही उनका दोष सिद्ध करते हैं।
  alternative: परमेश्वर या किसी न्यायाधीश को निहित कर्ता मानकर स्पष्ट करना।
  rationale: यूनानी पाठ में τὰ ἀνομήματα αὐτῶν व्याकरणिक कर्ता है। अनुवाद इस सशक्त मानवीकरण को बनाए रखता है और किसी अनुल्लिखित न्यायाधीश को नहीं जोड़ता।
