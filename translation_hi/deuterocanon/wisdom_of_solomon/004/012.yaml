  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/012.yaml
  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
translation:
  language: hi
  text: क्योंकि दुष्टता का जादू[a] जो भला है[b] उसे धुँधला कर देता है, और अभिलाषा की भटकन निष्कपट मन को भ्रष्ट कर देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्टता का ईर्ष्याजनित कुप्रभाव” अथवा “दुष्टता की बुरी नज़र”; यूनानी शब्द हानिकारक ईर्ष्या या अनिष्टकारी प्रभाव का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो सुंदर है” अथवा “श्रेष्ठ बातें”; यूनानी अभिव्यक्ति नैतिक भलाई और सौंदर्य, दोनों का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασκανία
  choice: सम्मोहन
  rationale: यह शब्द ईर्ष्या से उपजे कुप्रभाव, बुरी नज़र या मोहकारी प्रभाव का बोध करा सकता है। “सम्मोहन” यहाँ दुष्टता के ऐसे हानिकारक आकर्षण को व्यक्त करता है जो भलाई को देखने की क्षमता धुँधली कर देता है; अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: φαυλότητος
  choice: दुष्टता का
  rationale: संबंधकारक रूप βασκανία को विशेषित करता है और नैतिक निकृष्टता अथवा बुराई का भाव देता है। आधुनिक हिन्दी में “दुष्टता” इस नैतिक अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀμαυροῖ
  choice: धुँधला कर देता है
  rationale: क्रिया का मूल भाव चमक घटाना, मंद करना या अस्पष्ट कर देना है। यह अनुवाद नैतिक बोध पर पड़े प्रभाव की चित्रात्मकता बनाए रखता है।
- source_word: τὰ καλά
  choice: जो भला है
  rationale: καλά में नैतिक भलाई के साथ सुंदरता और श्रेष्ठता का भाव भी हो सकता है। प्रसंग में नैतिक अर्थ प्रमुख है, पर वैकल्पिक विस्तार पादटिप्पणी में सुरक्षित है।
- source_word: ῥεμβασμός
  choice: भटकन
  rationale: यह लक्ष्यहीन घूमने, चंचलता या मानसिक विचलन का संकेत देता है। “भटकन” अभिलाषा की अस्थिर और दिशाहीन गति को संक्षेप में व्यक्त करता है।
- source_word: ἐπιθυμίας
  choice: अभिलाषा की
  rationale: यह शब्द इच्छा या लालसा के लिए व्यापक है और अनिवार्य रूप से केवल कामवासना नहीं दर्शाता। “अभिलाषा” मूल की व्यापकता रखते हुए इस प्रसंग में हानिकारक चाह का भाव ग्रहण करती है।
- source_word: μεταλλεύει
  choice: भ्रष्ट कर देती है
  rationale: यहाँ क्रिया केवल तटस्थ परिवर्तन नहीं, बल्कि मन को बिगाड़ देने वाले परिवर्तन का संकेत देती है। “भ्रष्ट कर देती है” प्रसंगगत नैतिक हानि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νοῦν
  choice: मन
  rationale: νοῦς समझ, विचार और नैतिक बोध की क्षमता को दर्शाता है। “मन” सामान्य हिन्दी में इन पहलुओं को समेटने वाला सहज शब्द है।
- source_word: ἄκακον
  choice: निष्कपट
  rationale: विशेषण का अर्थ बुराई, छल या दुर्भावना से रहित होना है। “निष्कपट” इस नैतिक निर्दोषता को “हानिरहित” की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: τὰ καλά का नैतिक और सौंदर्यात्मक विस्तार
  choice: मुख्य पाठ में “जो भला है” रखा गया।
  alternative: “जो सुंदर है” या “श्रेष्ठ बातें”
  rationale: दुष्टता और मन के भ्रष्ट होने का प्रसंग नैतिक भलाई को प्रमुख बनाता है, किंतु यूनानी शब्द की सौंदर्यात्मक और उदात्त अर्थच्छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: βασκανία का अर्थ-बल
  choice: मुख्य पाठ में “सम्मोहन” रखा गया।
  alternative: “ईर्ष्याजनित कुप्रभाव” या “बुरी नज़र”
  rationale: शब्द में ईर्ष्या, बुरी नज़र और हानिकारक मोहकारी प्रभाव की परस्पर जुड़ी अर्थच्छायाएँ हैं। मुख्य पाठ दुष्टता की भ्रष्टकारी आकर्षण-शक्ति को सामने रखता है, जबकि किसी एक सांस्कृतिक धारणा को निर्णायक बनाने से बचने के लिए अन्य अर्थ पादटिप्पणी में दिए गए हैं।
