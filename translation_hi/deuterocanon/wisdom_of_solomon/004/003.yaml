- issue: वचन-सामंजस्य और रूपक का कर्ता
  choice: अंकुर ... जमाएँगे ... स्थापित करेंगे
  alternative: संतान ... आएगी ... जड़ न जमाएगी
  rationale: ग्रीक में आगे की क्रियाएँ एकवचन हैं, पर μοσχευμάτων बहुवचन और रूपकगत विस्तार के कारण हिंदी में निकटस्थ 'अंकुर' को बहुवचन कर्ता बनाना स्वाभाविक है; अर्थगत संबंध संतान से बना रहता है।
