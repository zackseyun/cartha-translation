  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: hi
  text: पर अधर्मियों की बहुत-सी संतान किसी काम न आएगी; नाजायज़ कलमों[a] से वह गहराई तक जड़ न जमाएगी[b], और न दृढ़ आधार स्थापित करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अवैध अंकुर” अथवा “खोटी कलमें।” यूनानी में पौधों के रूपक के भीतर एक कठोर शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गहराई में जड़ नहीं देगी”; अर्थात वह गहरी जड़ नहीं पकड़ेगी।
    reason: lexical_alternative
