  rationale: ἀσφαλής, βάσις और ἐδράζω के स्थिरता-संबंधी भाव को स्पष्ट तथा गरिमापूर्ण हिंदी में रखता है।
theological_decisions:
- issue: ἀσεβῶν का धार्मिक-नैतिक अर्थ
  choice: भक्तिहीनों
  alternative: दुष्टों; अधर्मियों
  rationale: '''भक्तिहीन'' परमेश्वर की ओर उन्मुख श्रद्धा के अभाव को बनाए रखता है, जबकि ''दुष्ट'' अधिक व्यापक है और ''अधर्मी'' न्याय या धर्म-व्यवस्था की ओर अधिक झुक सकता है।'
- issue: νόθων की कठोरता और पौधों का रूपक
  choice: अवैध कलमों से निकले अंकुर
  alternative: जारज अंकुर; नकली कलमें
