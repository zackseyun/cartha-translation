- source_word: ἐκ νόθων μοσχευμάτων
  choice: अवैध कलमों से निकले अंकुर
  rationale: νόθος की कठोर वैधता-विरोधी धार और μοσχεύματα की उद्यान-विज्ञान संबंधी छवि दोनों को रखता है। 'कलमों से निकले अंकुर' पौधों के रूपक को हिंदी में स्पष्ट करता है।
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: गहराई तक जड़ न जमाएँगे
  rationale: शाब्दिक छवि को स्वाभाविक हिंदी मुहावरे में प्रस्तुत करता है और गहरी जड़ न पकड़ने का भाव सुरक्षित रखता है।
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
