theological_decisions:
- issue: कृषि-रूपक का संदर्भगत आशय
  choice: शाखाओं और फल की शाब्दिक छवि को बनाए रखा गया है; उसके नैतिक संकेत को पद में स्पष्ट करके नहीं जोड़ा गया।
  alternative: रूपक खोलकर इसे सीधे दुष्टों की संतान या वंश के विषय में कहना।
  rationale: आसपास का संदर्भ इस छवि को दुष्टों की संतान पर लागू करता है, पर यह पद स्वयं कृषि-रूपक में बोलता है। इसलिए अनुवाद रूपक को सुरक्षित रखता है और उसका आशय संदर्भ से समझने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। कृषि-छवि को अक्षुण्ण रखा गया है और वाक्य के दो निकटार्थी निषेधों—‘बेकार’ तथा ‘किसी भी काम के योग्य नहीं’—को मूल की जोरदार पुनरुक्ति के अनुरूप बनाए रखा गया है।
