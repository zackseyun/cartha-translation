base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: hi
  text: सद्गुण के साथ निःसंतान होना उत्तम है, क्योंकि उसकी[a] स्मृति में अमरता है; वह परमेश्वर और मनुष्यों—दोनों के द्वारा पहचानी जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ का सबसे स्वाभाविक संकेत ‘सद्गुण’ की ओर है। कुछ लोग इसे निःसंतानता का मानवीकरण या निःसंतान स्त्री की ओर संकेत मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: κρείσσων
  choice: उत्तम है
  rationale: तुलनात्मक मूल्यांकन और सूक्तिपरक बल को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀτεκνία
  choice: निःसंतान होना
  rationale: संतान न होने की अवस्था को व्यक्त करता है और ‘बाँझपन’ की अपेक्षा कम जैविक तथा कम संकीर्ण है।
- source_word: μετὰ ἀρετῆς
  choice: सद्गुण के साथ
  rationale: ἀρετή के नैतिक उत्कृष्टता वाले अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἀθανασία
  choice: अमरता
  rationale: इस संज्ञा का मानक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: ἐν μνήμῃ αὐτῆς
  choice: उसकी स्मृति में
  rationale: यूनानी स्त्रीलिंग सर्वनाम की संदर्भगत अस्पष्टता को हिन्दी में बनाए रखता है; निकटतम और सर्वाधिक संगत संदर्भ ‘सद्गुण’ है।
- source_word: γινώσκεται
  choice: पहचानी जाती है
  rationale: यहाँ केवल जानकारी होने से बढ़कर मान्यता और स्वीकार्यता का भाव संभव है; निष्क्रिय वर्तमान रूप भी सुरक्षित रहता है।
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: परमेश्वर और मनुष्यों—दोनों के द्वारा
  rationale: दैवी और मानवीय दोनों क्षेत्रों में पहचाने जाने का समानांतर भाव रखता है; ἀνθρώποις यहाँ समस्त मनुष्यों के लिए सामान्य शब्द है।
theological_decisions:
- issue: ἐν μνήμῃ αὐτῆς तथा γινώσκεται के स्त्रीलिंग संकेत का संदर्भ
  choice: मुख्य अर्थ में इसे ‘सद्गुण’ से संबंधित समझा गया, पर ‘उसकी’ द्वारा व्याकरणिक अस्पष्टता बनाए रखी गई।
  alternative: इसे निःसंतानता का मानवीकरण, अथवा निःसंतान स्त्री की ओर संकेत माना जा सकता है।
  rationale: 'ἀρετή निकटतम और विचारक्रम में सबसे संगत पूर्वपद है: स्थायी स्मृति और परमेश्वर तथा मनुष्यों की मान्यता सद्गुण से संबद्ध होती है। फिर भी यूनानी रूप दूसरे संदर्भ को पूर्णतः असंभव नहीं बनाता।'
- issue: παρὰ θεῷ का संबंधगत अर्थ
  choice: ‘परमेश्वर ... के द्वारा पहचानी जाती है’
  alternative: ‘परमेश्वर के सामने मान्यता पाती है’ या ‘परमेश्वर की दृष्टि में जानी जाती है’
  rationale: παρά + दत्तिव संबंध या आकलन के क्षेत्र को सूचित कर सकता है। चुना गया रूप γινώσκεται की निष्क्रिय संरचना और परमेश्वर तथा मनुष्यों के समानांतर को सहज हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सूक्तिपरक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘निःसंतान होना’ कलंकसूचक ‘बाँझपन’ से बचता है। ‘मनुष्यों’ यूनानी के सामान्य, समावेशी मानवीय अर्थ को ठीक प्रकार व्यक्त करता है।
