- source_word: ἀπελθοῦσαν
  choice: जब वह चली जाती है
  rationale: एओरिस्ट पार्टिसिपल उसके चले जाने को पूर्ण घटना के रूप में दिखाता है और उपस्थिति से कालगत विरोध बनाए रखता है।
- source_word: ἐν τῷ αἰῶνι
  choice: युग भर
  rationale: यह αἰών के दीर्घकालिक अर्थ और स्थायी यश के भाव को सुरक्षित रखता है, पर इसे अनिवार्य रूप से पारलौकिक अनंतता नहीं बनाता। ‘सदा के लिए’ को पादटिप्पणी में रखा गया है।
- source_word: στεφανηφοροῦσα
