- issue: ἐν τῷ αἰῶνι का कालगत बल
  choice: ‘युग भर’—दीर्घकालिक, युग-व्यापी विजय और सम्मान।
  alternative: ‘सदा के लिए’ या ‘अनंतकाल में।’
  rationale: मुख्य पाठ यूनानी के αἰών को अधिक स्पष्ट किए बिना दीर्घकालिक अर्थ देता है; अधिक व्याख्यात्मक शाश्वत अर्थ पादटिप्पणी में सुरक्षित है।
