  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: hi
  text: जब वह उपस्थित रहती है, तो लोग उसका अनुकरण करते हैं, और जब वह चली जाती है, तो उसके लिए तरसते हैं। युग भर[a] वह विजय-माला पहने विजयोत्सव की शोभायात्रा में चलती है, निष्कलंक पुरस्कारों वाली प्रतियोगिता में विजय पाकर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा के लिए।” यूनानी पद का शाब्दिक अर्थ “युग में” है और यह चिरस्थायी या निरंतर यश का भाव भी दे सकता है।
    reason: lexical_alternative
