lexical_decisions:
- source_word: πολιὰ
  choice: पके बाल
  rationale: यह शब्द वृद्धावस्था के चिह्न के रूप में सफेद या पके बालों को दर्शाता है; आधुनिक हिन्दी में ‘पके बाल’ स्वाभाविक और अर्थपूर्ण है।
- source_word: φρόνησις
  choice: विवेक
  rationale: यह व्यावहारिक समझ, सूझ-बूझ और बुद्धिमत्ता का बोध कराता है; ‘विवेक’ संक्षिप्त और गरिमापूर्ण समतुल्य है।
- source_word: ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: यूनानी बहुवचन यहाँ मानवजाति के लिए सामान्य रूप से प्रयुक्त है, केवल पुरुषों के लिए नहीं।
- source_word: ἡλικία γήρως
  choice: वृद्धावस्था की परिपक्व आयु
  rationale: शाब्दिक संरचना ‘वृद्धावस्था की आयु’ हिन्दी में असहज है; ‘परिपक्व आयु’ आयु की पूर्णता का भाव रखते हुए वाक्य को स्वाभाविक बनाती है।
- source_word: βίος ἀκηλίδωτος
  choice: निष्कलंक जीवन
  rationale: ἀκηλίδωτος का अर्थ दागरहित या निष्कलंक है; यह नैतिक अखंडता का स्पष्ट और पारंपरिक हिन्दी बोध देता है।
