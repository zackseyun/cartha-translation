lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले न्याय-दृश्य के बाद की घटना बताता है; ‘तब’ स्वाभाविक और सटीक है।
- source_word: στήσεται
  choice: खड़ा होगा
  rationale: यहाँ ἵστημι का भविष्यत् मध्यम रूप अकर्मक अर्थ में है—धर्मी जन निर्भय होकर खड़ा होगा; इसे कर्मवाच्य बनाना अनावश्यक होगा।
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: बड़े साहस के साथ
  rationale: παρρησία में निर्भीकता, आत्मविश्वास और खुलकर सामने आने का भाव है। न्याय और प्रतिपादन के इस प्रसंग में ‘बड़े साहस के साथ’ सहज रूप से यह भाव व्यक्त करता है।
- source_word: ὁ δίκαιος
  choice: धर्मी जन
  rationale: ग्रीक पद पुल्लिंग एकवचन में एक आदर्श अथवा प्रतिनिधि धर्मी व्यक्ति को दर्शाता है। ‘धर्मी जन’ एकवचन और प्रतिनिधिक अर्थ दोनों बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κατὰ πρόσωπον
  choice: आमने-सामने
  rationale: शाब्दिक रूप से ‘मुख के सामने’ यह पद प्रत्यक्ष उपस्थिति और सामना करने का भाव देता है। ‘आमने-सामने’ हिन्दी में उसकी सजीवता और टकराव का आशय बचाता है।
- source_word: τῶν θλιψάντων αὐτὸν
  choice: उन लोगों के ... जिन्होंने उसे सताया था
  rationale: θλίβω कष्ट देने, दबाने या सताने को व्यक्त कर सकता है। ‘सताया था’ hostile mistreatment का व्यापक और स्वाभाविक हिन्दी रूप है; पूर्ण भूतकाल पूर्ववर्ती कृत्य को स्पष्ट करता है।
theological_decisions:
- issue: ὁ δίκαιος का प्रतिनिधिक पुल्लिंग एकवचन
  choice: धर्मी जन
  alternative: धर्मी पुरुष
  rationale: मूल का एकवचन प्रतिनिधिक व्यक्ति बनाए रखा गया है। ‘जन’ व्याकरणिक रूप से एकवचन और गरिमापूर्ण है, जबकि ‘पुरुष’ यहाँ अनावश्यक रूप से जैविक लिंग पर बल दे सकता है; पाठ किसी सामूहिक बहुवचन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आमने-सामने’ द्वारा κατὰ πρόσωπον की प्रत्यक्ष मुठभेड़ की सजीवता बचाई गई है; इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
