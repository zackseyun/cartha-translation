  rationale: मूल यूनानी कर्मवाच्य है और निकटवर्ती प्रसंग अल्पायु के बावजूद पूर्णता तथा परमेश्वर की स्वीकृति पर बल देता है। अनुवाद इस धार्मिक तनाव को समझाए बिना मूल रूप में रहने देता है।
