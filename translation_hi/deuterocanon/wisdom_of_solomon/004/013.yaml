lexical_decisions:
- source_word: τελειωθεὶς
  choice: पूर्ण कर दिया गया
  rationale: यह τελειόω का भूतकालिक कर्मवाच्य कृदन्त है। यह चुनाव कर्मवाच्य और पूर्णता तक पहुँचाए जाने के भाव को बनाए रखता है, पर निरपेक्ष निष्पापता का अर्थ नहीं थोपता।
- source_word: ἐν ὀλίγῳ
  choice: थोड़े ही समय में
  rationale: यह पद यहाँ अल्प समयावधि को व्यक्त करता है और आगे आने वाले ‘लंबे वर्ष’ के साथ स्पष्ट विरोध बनाता है। ‘ही’ इस विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: ἐπλήρωσεν
  choice: पूरे कर लिए
  rationale: πληρόω का यहाँ आशय पूरा करने या पूर्णता तक लाने से है। ‘पूरे कर लिए’ हिन्दी में स्वाभाविक रहते हुए इस पूर्णता-बोध को सुरक्षित रखता है।
- source_word: χρόνους μακρούς
  choice: लंबे वर्ष
  rationale: शाब्दिक अर्थ ‘लंबे समय’ हो सकता है, पर प्रसंग में दीर्घ जीवनावधि अभिप्रेत है। ‘लंबे वर्ष’ मूल के बहुवचन और अल्प समय के साथ उसके विरोध—दोनों को बनाए रखता है।
theological_decisions:
- issue: धर्मी व्यक्ति की अल्पायु के संबंध में पूर्ण किए जाने की भाषा
  choice: पद को इस अर्थ में रखा गया है कि थोड़े जीवनकाल में ही व्यक्ति पूर्णता तक पहुँचा दिया गया, बिना इसे अनिवार्य रूप से निरपेक्ष नैतिक निष्पापता घोषित किए।
