lexical_decisions:
- source_word: ὄψονται
  choice: वे देखेंगे
  rationale: ὁράω के भविष्यत् रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; यूनानी में कर्म व्यक्त नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: ἐξουδενήσουσιν
