- source_word: ἐκγελάσεται
  choice: उनका उपहास करेगा
  rationale: ἐκγελάω में केवल हँसने से अधिक, तिरस्कारपूर्ण हँसी या उपहास का भाव है। ‘उपहास करेगा’ इस बल को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-साहित्य के इस प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ पद परमेश्वर को न्यायकारी सत्ता के रूप में सूचित करता है; ‘स्वामी’ अनावश्यक रूप से मानवीय स्वामित्व का अर्थ दे सकता है।
- issue: प्रभु की प्रतिक्रिया में निहित मानवीकरण और न्यायिक उलटाव
  choice: उनका उपहास करेगा
  alternative: उन पर हँसेगा
  rationale: यूनानी की तिरस्कारपूर्ण धार को बनाए रखा गया है और कथन के मानवीकरण को नरम करके नहीं हटाया गया। वैकल्पिक शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
