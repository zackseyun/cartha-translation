  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: hi
  text: क्योंकि वे बुद्धिमान मनुष्य का अंत देखेंगे[a], और नहीं समझेंगे कि प्रभु ने उसके विषय में क्या योजना बनाई थी और किस उद्देश्य से उसे सुरक्षित रखा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान मनुष्य की मृत्यु।” यूनानी शब्द का अर्थ “अंत” या “मृत्यु” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और किस लक्ष्य तक प्रभु ने उसे सुरक्षित रखा था।” यूनानी पाठ यह स्पष्ट नहीं करता कि यह सुरक्षा किस प्रकार की है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: वे...देखेंगे
  rationale: भविष्यकाल की प्रत्यक्ष अनुभूति को सहज और सीधे रूप में व्यक्त करता है।
- source_word: τελευτὴν
  choice: अंत
  rationale: यह यूनानी शब्द ‘अंत’ या ‘मृत्यु’ दोनों का बोध करा सकता है। ‘अंत’ दृश्य मृत्यु के साथ-साथ व्यापक परिणाम की संभावना भी खुली रखता है।
- source_word: σοφοῦ
  choice: बुद्धिमान मनुष्य का
  rationale: पुल्लिंग एकवचन यूनानी रूप को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐ νοήσουσιν
  choice: यह नहीं समझेंगे
  rationale: जो वे देखते हैं उसका अर्थ या आशय ग्रहण न कर पाने की बात को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐβουλεύσατο
  choice: क्या योजना बनाई थी
  rationale: प्रभु के सोच-विचारकर किए गए संकल्प या अभिप्राय को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े व्यक्त करता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: सम्बन्धवाचक अर्थ ‘उसके बारे में/उसके विषय में’ को औपचारिक किंतु सहज हिन्दी में सुरक्षित रखता है।
- source_word: εἰς τί
  choice: किस उद्देश्य से
  rationale: कार्य के लक्ष्य या प्रयोजन की ओर संकेत करने वाले यूनानी वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠσφαλίσατο
  choice: उसे सुरक्षित किया था
  rationale: सुरक्षित या दृढ़ करने का कारणवाचक भाव बनाए रखता है और सुरक्षा के भौतिक, नैतिक अथवा परलोक-संबंधी स्वरूप को अनिर्धारित छोड़ता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए κύριος का प्रचलित, गरिमापूर्ण और सहज हिन्दी रूप है।
theological_decisions:
- issue: τελευτή का दायरा और बुद्धिमान मनुष्य की मृत्यु
  choice: मुख्य पाठ में ‘अंत’
  alternative: ‘मृत्यु’ या ‘परिणाम’
  rationale: तात्कालिक सन्दर्भ धर्मी की दिखाई देने वाली मृत्यु से जुड़ा है, पर कथन उसके व्यापक ईश्वरीय परिणाम की ओर भी संकेत कर सकता है। ‘अंत’ इस तनाव और अर्थ-विस्तार को बनाए रखता है।
- issue: ἠσφαλίσατο αὐτὸν में सुरक्षा का स्वरूप
  choice: ‘उसे सुरक्षित किया था’
  alternative: ‘उसकी रक्षा की थी’ या ‘उसे सुरक्षित रखा था’
  rationale: यूनानी पाठ यह नहीं बताता कि सुरक्षा किस प्रकार की है। व्यापक अनुवाद प्रत्यक्ष मृत्यु और प्रभु में वास्तविक सुरक्षा के बीच के धर्मवैज्ञानिक तनाव को बिना समयपूर्व समाधान के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली अपनाई गई है। ‘अंत’ और ‘सुरक्षित’ जैसे व्यापक शब्द मूल यूनानी की वास्तविक अर्थगत खुलावट को बनाए रखते हैं।
