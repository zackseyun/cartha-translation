base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: hi
  text: इसके बाद वे एक अपमानित शव बन जाएँगे और सदा के लिए मृतकों के बीच तिरस्कार का पात्र होंगे[a]। क्योंकि वह[b] उन्हें निःशब्द और मुँह के बल पटक देगा और उन्हें उनकी नींवों से हिला देगा। वे पूरी तरह उजाड़ दिए जाएँगे और पीड़ा में रहेंगे, और उनकी स्मृति मिट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक अपमानित गिरा हुआ शरीर’; यूनानी πτῶμα का अर्थ ‘पतन’ भी हो सकता है, पर यहाँ यह गिरे हुए शरीर या शव और उसके लज्जाजनक अंत पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘पटक देगा’ और ‘हिला देगा’ का कर्ता नाम से नहीं बताया गया है। प्रसंग में संकेत परमेश्वर के न्याय की ओर है।
    reason: implicit_subject
lexical_decisions:
- source_word: πτῶμα ἄτιμον
  choice: एक अपमानित शव
  rationale: πτῶμα इस न्याय-संदर्भ में केवल ‘गिरना’ नहीं, बल्कि गिरे हुए शरीर या शव को सूचित करता है; ἄτιμον उसके अपमानजनक और सम्मानरहित अंत पर बल देता है।
- source_word: ὕβριν ἐν νεκροῖς
  choice: मृतकों के बीच तिरस्कार का पात्र
  rationale: यहाँ ὕβρις सक्रिय हिंसा से अधिक अपमान और घृणा की अवस्था व्यक्त करता है; ‘तिरस्कार का पात्र’ आधुनिक हिन्दी में इस सार्वजनिक लज्जा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διʼ αἰῶνος
  choice: सदा के लिए
  rationale: इस न्याय और स्मृति के मिट जाने के प्रसंग में यह कालगत स्थायित्व को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ῥήξει ... ἀφώνους πρηνεῖς
  choice: निःशब्द और मुँह के बल पटक देगा
  rationale: ῥήξει की हिंसक क्रिया तथा πρηνεῖς की अधोमुख अवस्था को ‘पटक देगा’ और ‘मुँह के बल’ व्यक्त करते हैं; ἀφώνους को ‘निःशब्द’ रखने से उनके चुप करा दिए जाने अथवा वाणीहीन होने की छाया बनी रहती है।
- source_word: σαλεύσει ... ἐκ θεμελίων
  choice: उनकी नींव से उन्हें हिला देगा
  rationale: यह अनुवाद मूल के हिलाने और आधार से उखाड़ने की रूपकात्मक छवि को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ἕως ἐσχάτου χερσωθήσονται
  choice: पूरी तरह उजाड़ दिए जाएँगे
  rationale: χερσόω उजाड़ या निर्जन कर दिए जाने का भाव रखता है और ἕως ἐσχάτου उसकी पूर्णता को तीव्र करता है।
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: उनकी स्मृति मिट जाएगी
  rationale: यह वाक्य उनके स्मरण के नष्ट हो जाने को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय करने वाले का अप्रकट कर्ता
  choice: ‘वह’ रखा गया, पर उसका नाम नहीं जोड़ा गया
  alternative: ‘परमेश्वर’ को स्पष्ट कर्ता बनाना, अथवा भाववाच्य में न्याय का वर्णन करना
  rationale: ῥήξει और σαλεύσει में पुल्लिंग एकवचन कर्ता क्रियारूप में निहित है, किंतु इस पद में उसका नाम नहीं आता। प्रसंग उसे परमेश्वर के न्याय से जोड़ता है, फिर भी ‘वह’ मूल की अभिव्यक्ति और उसके अंतर्निहित तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘शव’, ‘तिरस्कार’, ‘नींव’ और ‘उजाड़’ मूल की न्यायात्मक तथा काव्यात्मक तीव्रता बनाए रखते हैं; अप्रकट कर्ता को स्पष्ट ईश्वरीय नाम देकर व्याख्यायित नहीं किया गया।
