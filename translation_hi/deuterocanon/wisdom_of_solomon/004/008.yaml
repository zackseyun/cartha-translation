review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies γῆρας as old age itself and retains the twofold denial: honor is not grounded in mere longevity, nor determined by years counted. However, “दीर्घायु होने में नहीं है” can imply that old age does not consist in being long-lived, rather than that it is not honorable on that account. The revision makes the Greek predicate relationship explicit without adding interpretation.'
  naturalness: “आदरणीय बुढ़ापा दीर्घायु होने में नहीं है” is syntactically and idiomatically strained in modern Hindi. “वृद्धावस्था केवल दीर्घायु होने से आदरणीय नहीं होती” is clear, dignified, and natural for this sapiential register.
  terminology: “वृद्धावस्था” appropriately renders γῆρας as a state rather than an elderly person and has a more suitable formal-register tone than “बुढ़ापा” here. “आदरणीय” suitably conveys τίμιον. “वर्षों की संख्या” and “मापा जाता है” accurately retain the measurement metaphor.
  issues:
  - severity: medium
    issue: The phrase “दीर्घायु होने में नहीं है” ambiguously construes the first Greek negation.
    rationale: οὐ τὸ πολύχρονον denies that old age is honorable by virtue of length of life; it does not deny that old age consists in or accompanies long life. Recasting with “दीर्घायु होने से आदरणीय नहीं होती” preserves the intended relation.
  - severity: low
    issue: “बुढ़ापा” is less fitting for the elevated wisdom-literature register.
    rationale: Though not inaccurate, “वृद्धावस्था” is more dignified and unambiguously denotes the state of old age.
  revised_text: क्योंकि वृद्धावस्था केवल दीर्घायु होने से आदरणीय नहीं होती, और न ही वह वर्षों की संख्या से मापी जाती है;
  revised_footnotes: []
