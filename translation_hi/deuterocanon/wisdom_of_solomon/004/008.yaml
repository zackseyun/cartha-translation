lexical_decisions:
- source_word: γῆρας
  choice: बुढ़ापा
  rationale: यह शब्द वृद्ध व्यक्ति नहीं, वृद्धावस्था को सूचित करता है। ‘बुढ़ापा’ सामान्य आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τίμιον
  choice: आदरणीय
  rationale: यहाँ अर्थ भौतिक रूप से ‘बहुमूल्य’ नहीं, बल्कि नैतिक-सामाजिक सम्मान के योग्य होने का है।
- source_word: οὐ τὸ πολύχρονον
  choice: दीर्घायु होने में नहीं है
  rationale: यह पद केवल बहुत वर्षों तक जीवित रहने को सम्माननीय बुढ़ापे का आधार मानने से इनकार करता है; यह रूप हिन्दी में संबंध को स्पष्ट रखते हुए मूल भाव सुरक्षित रखता है।
- source_word: οὐδὲ
  choice: और न
  rationale: यह दूसरे निषेध को पहले निषेध से निकटता से जोड़ता है और हिन्दी में सहज है।
- source_word: ἀριθμῷ ἐτῶν
  choice: वर्षों की संख्या से
  rationale: करण कारक माप के मानदंड को व्यक्त करता है; यह अनुवाद उसी को सीधे और स्पष्ट रूप में रखता है।
- source_word: μεμέτρηται
  choice: मापा जाता है
  rationale: यूनानी पूर्ण निष्क्रिय रूप यहाँ सामान्य, स्थायी कथन देता है; हिन्दी का वर्तमान निष्क्रिय रूप इस नीतिपरक बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आदरणीय बुढ़ापे का आधार
  choice: बुढ़ापे का आदर केवल दीर्घ जीवन या वर्षों की गिनती पर निर्भर नहीं है।
  alternative: बहुत अधिक आयु अपने-आप में आदरणीय बुढ़ापा है।
  rationale: मूल यूनानी स्पष्टतः मात्र दीर्घायु और कालानुक्रमिक वर्षों को सम्मान का निर्णायक मानदंड नहीं मानता, पर बुढ़ापे की संभावित गरिमा को नकारता भी नहीं।
