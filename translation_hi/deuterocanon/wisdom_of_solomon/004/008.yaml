- from: क्योंकि आदरणीय बुढ़ापा दीर्घायु होने में नहीं है, और न वह वर्षों की संख्या से मापा जाता है;
  to: क्योंकि वृद्धावस्था केवल दीर्घायु होने से आदरणीय नहीं होती, और न ही वह वर्षों की संख्या से मापी जाती है;
