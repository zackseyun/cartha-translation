  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: hi
  text: क्योंकि अधर्मपूर्ण संबंधों से जन्मे बच्चे उनकी जाँच में अपने माता-पिता की दुष्टता के गवाह होते हैं।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अधर्मपूर्ण शय्याओं से”; यूनानी में यह अनुचित यौन संबंधों के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “माता-पिता के विरुद्ध उनकी दुष्टता के गवाह होते हैं।”
    reason: alternative_reading
  - marker: c
    text: “उनकी जाँच में” का अर्थ अधिक सामान्य रूप से “जाँच-पड़ताल में” भी हो सकता है। यूनानी सर्वनाम का निकटतम संदर्भ बच्चे हैं, किंतु इसे माता-पिता से संबंधित भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων
  choice: अधर्मपूर्ण
  rationale: यह शब्द व्यवस्था और नैतिक मर्यादा के विरुद्ध होने का भाव रखता है। ‘अधर्मपूर्ण’ आधुनिक हिन्दी में नैतिक दोष को स्पष्ट करता है, बिना इसे केवल नागरिक कानून तक सीमित किए।
- source_word: ὕπνων
  choice: संबंधों
  rationale: शाब्दिक अर्थ ‘शय्याओं’ या ‘सोने’ का है, पर यहाँ यह यौन संबंधों के लिए प्रयुक्त शिष्टोक्ति है। ‘संबंधों’ से आशय स्वाभाविक हिन्दी में प्रकट होता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τέκνα γεννώμενα
  choice: जन्मे बच्चे
  rationale: यह कृदन्त पद ऐसे संबंधों से उत्पन्न संतान को सूचित करता है। ‘जन्मे बच्चे’ सरल, स्वाभाविक और परिणामसूचक है।
- source_word: μάρτυρές εἰσιν
  choice: गवाह होते हैं
  rationale: यह विधिक-साक्ष्य संबंधी स्वर को बनाए रखता है और आगे आने वाले ‘जाँच’ के भाव के साथ मेल खाता है।
- source_word: πονηρίας
  choice: दुष्टता
  rationale: यह माता-पिता के नैतिक बुरे आचरण को व्यक्त करता है। ‘दुष्टता’ गंभीर किंतु सामान्य पाठकों के लिए स्पष्ट शब्द है।
- source_word: κατὰ γονέων
  choice: अपने माता-पिता की दुष्टता के
  rationale: κατά के साथ संबंधकारक यहाँ विरोधी अथवा अभियोगात्मक दिशा रखता है। मुख्य पाठ में स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है, जबकि ‘माता-पिता के विरुद्ध’ वाला अधिक स्पष्ट विधिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: जाँच के समय
  rationale: ἐξετασμός का अर्थ जाँच, परख या छानबीन है। ‘जाँच के समय’ मूल की संज्ञात्मक रचना को बनाए रखते हुए αὐτῶν के संदर्भ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
