  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘अधर्मपूर्ण संबंध’ मूल की नैतिक गंभीरता को बनाए रखता है, और ‘गवाह’ तथा ‘जाँच’ उसके विधिक-साक्ष्यात्मक स्वर को सुरक्षित रखते हैं।
