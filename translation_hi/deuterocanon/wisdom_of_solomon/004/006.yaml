  rationale: सर्वनाम व्याकरणतः बहुवचन है और निकटतम पूर्वपद बच्चे हैं, किंतु माता-पिता की ओर संकेत या अधिक सामान्य ‘जाँच-पड़ताल’ का भाव भी संभव है। इसलिए अस्पष्टता को मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
