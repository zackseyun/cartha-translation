  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: hi
  text: क्योंकि यदि वह अपनी डालियों में कुछ समय के लिए नई कोंपलें निकाल भी ले[a], तब भी अस्थिर खड़ा होने पर वह हवा से हिलाया जाएगा[b], और प्रचंड हवाओं के बल से जड़ समेत उखाड़ दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ समय के लिए फिर से अंकुरित भी हो जाए”; यूनानी अस्थायी नई वनस्पति-वृद्धि का चित्र बनाए रखती है।
    reason: lexical_alternative
  - marker: b
    text: “वह” पिछले पद से चली आ रही पौधे की उपमा को आगे बढ़ाता है; इस पद में उसका आशय किसी संज्ञा से स्पष्ट नहीं किया गया है।
    reason: cross_reference
