lexical_decisions:
- source_word: εἰσῆλθεν
  choice: प्रवेश कर गई
  rationale: यह εἰσέρχομαι का भूतकालीन रूप है और किसी के भीतर प्रवेश करने के सजीव रूपक को बनाए रखता है।
- source_word: ψυχὴν
  choice: आत्मा
  rationale: ψυχή यहाँ व्यक्ति के भीतरी अस्तित्व को दर्शाता है; ‘आत्मा’ मूल की मानव-स्वरूप संबंधी और धर्मवैचारिक गहराई को ‘मन’ की तुलना में अधिक सुरक्षित रखता है।
- source_word: θεράποντος
  choice: सेवक
  rationale: θεράπων आदरयुक्त निजी सेवक या परिचर को सूचित कर सकता है। ‘सेवक’ स्वाभाविक है और पद या पहचान को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ प्रतिष्ठित, स्पष्ट और इस आदरपूर्ण संबंध में स्वाभाविक हिन्दी रूप है।
- source_word: ἀντέστη
  choice: विरुद्ध खड़ी हुई
  rationale: ἀνθίστημι का अर्थ सामना करना या अपने को विरोध में खड़ा करना है; यह चयन यूनानी की सजीव छवि और स्त्रीलिंग कर्ता दोनों को बनाए रखता है।
- source_word: βασιλεῦσι φοβεροῖς
  choice: भयंकर राजाओं
  rationale: βασιλεῦσι स्पष्टतः ‘राजाओं’ को और φοβεροῖς भय उत्पन्न करने वाले उनके स्वरूप को व्यक्त करता है; ‘भयंकर’ यह नहीं सुझाता कि वे स्वयं भयभीत थे।
- source_word: τέρασι καὶ σημείοις
  choice: अद्भुत कामों और चिन्हों
  rationale: यह बाइबिलीय चमत्कार-भाषा की युग्म अभिव्यक्ति है। ‘अद्भुत काम’ सामान्य पाठक के लिए ‘अपूर्व लक्षण’ जैसे अधिक तकनीकी विकल्पों से अधिक स्पष्ट है।
- source_word: ἐν
  choice: के साथ
  rationale: यहाँ ἐν साधन अथवा साथ होने की परिस्थिति व्यक्त कर सकता है। ‘के साथ’ मुख्य पाठ में दोनों संभावनाओं को पर्याप्त रूप से खुला रखता है।
theological_decisions:
- issue: संदर्भ से निहित कर्ता का लिंग और व्यक्तिकरण
  choice: ‘वह’ तथा स्त्रीलिंग क्रियाएँ
  alternative: मुख्य पाठ में ‘बुद्धि’ दोहराना या नपुंसक रूप लेना
  rationale: इस पद में कर्ता संज्ञा स्पष्ट रूप से नहीं है, पर पूरे प्रसंग में व्यक्तिरूप में प्रस्तुत ‘बुद्धि’ स्त्रीलिंग कर्ता है। स्त्रीलिंग क्रियाएँ साहित्यिक निरंतरता बनाए रखती हैं, जबकि अनुपस्थित संज्ञा को नहीं जोड़तीं।
- issue: ‘प्रभु के सेवक’ की पहचान
  choice: मुख्य पाठ में सामान्य पद ‘प्रभु का एक सेवक’ बनाए रखना
  alternative: मुख्य पाठ में ‘मूसा’ कहना
  rationale: प्रसंग मूसा की ओर संकेत करता है, पर यूनानी पाठ स्वयं यहाँ उनका नाम नहीं लेता। पहचान को पादटिप्पणी में बताना मूल की शब्दावली और उसकी अप्रत्यक्षता दोनों का सम्मान करता है।
- issue: ἐν τέρασι καὶ σημείοις का संबंध
  choice: ‘अद्भुत कामों और चिन्हों के साथ’
  alternative: ‘अद्भुत कामों और चिन्हों के द्वारा’
  rationale: यूनानी पूर्वसर्ग साधन या साथ की परिस्थिति, दोनों व्यक्त कर सकता है। मुख्य पाठ में ‘के साथ’ और पादटिप्पणी में साधनार्थक विकल्प देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
