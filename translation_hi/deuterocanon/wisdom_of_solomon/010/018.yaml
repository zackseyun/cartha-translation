  text: He brought them across the Red Sea, and led them through abundant water;
translation:
  language: hi
  text: उसने उन्हें लाल सागर पार कराया और प्रचुर जल[a] के बीच से उनकी अगुवाई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत जल।”
    reason: यूनानी वाक्यांश ὕδατος πολλοῦ के अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: διεβίβασεν
  choice: पार कराया
  rationale: यह क्रिया किसी को पार पहुँचाने या पार कराने का कारक भाव व्यक्त करती है; ‘पार कराया’ इसे संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: θάλασσαν ἐρυθράν
  choice: लाल सागर
  rationale: यह निर्गमन-वृत्तांत में उल्लिखित समुद्र का प्रचलित हिन्दी नाम है।
- source_word: διήγαγεν
  choice: के बीच से उनकी अगुवाई की
  rationale: क्रिया का अर्थ किसी को मार्ग दिखाते हुए आर-पार ले जाना है। यह अनुवाद पहली क्रिया से इसका अंतर बनाए रखते हुए निर्देशित यात्रा का भाव व्यक्त करता है।
- source_word: διʼ ὕδατος πολλοῦ
  choice: प्रचुर जल के बीच से
  rationale: एकवचन ὕδατος और πολλοῦ का मूल भाव ‘बहुत जल’ है। ‘प्रचुर जल’ गरिमापूर्ण और स्वाभाविक हिन्दी में जल की विशाल मात्रा व्यक्त करता है, बिना यूनानी एकवचन को बहुवचन बनाए।
theological_decisions:
- issue: निर्गमन की ओर संकेत और समुद्र का नाम
  choice: लाल सागर
  alternative: लाल समुद्र
  rationale: यह पद स्पष्ट रूप से निर्गमन की घटना की ओर संकेत करता है। ‘लाल सागर’ हिन्दी में स्थापित भौगोलिक और बाइबिलीय नाम है तथा यूनानी वाक्यांश के अनुरूप है।
- issue: कर्ता का लिंग
  choice: उसने
  alternative: बुद्धि ने
  rationale: यूनानी क्रियारूप स्वयं कर्ता का लिंग प्रकट नहीं करता, यद्यपि व्यापक प्रसंग में कर्ता ‘बुद्धि’ है। ‘उसने’ प्रसंगगत संबंध बनाए रखता है और इस पद में नाम को अनावश्यक रूप से दोहराता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। समानार्थी यूनानी क्रियाओं का अंतर ‘पार कराया’ और ‘अगुवाई की’ द्वारा बनाए रखा गया है।
