lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: यहाँ सामान्य संज्ञा के रूप में ‘बुद्धि’ स्वाभाविक है। यूनानी में इसका स्त्रीलिंग और सजीव चित्रण है, जिसे हिन्दी में ‘अपनी’ और सक्रिय क्रिया के द्वारा बनाए रखा गया है।
- source_word: θεραπεύσαντας
  choice: सेवा करने वालों
  rationale: θεραπεύω यहाँ निष्ठापूर्वक सेवा, देखभाल या समर्पित उपासना-सदृश आदर का भाव दे सकता है। ‘सेवा करने वालों’ अर्थ को स्पष्ट और तटस्थ रखता है।
- source_word: αὐτὴν
  choice: अपनी
  rationale: हिन्दी वाक्य-विन्यास में ‘अपनी सेवा करने वालों’ यूनानी स्त्रीलिंग सर्वनाम का स्वाभाविक समतुल्य है और बुद्धि के मानवीकरण को बनाए रखता है।
- source_word: ἐκ πόνων
  choice: कठिनाइयों से
  rationale: πόνος परिश्रम, कष्ट, पीड़ा या संकट का व्यापक अर्थ रख सकता है। ‘कठिनाइयों’ इस व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: क्रिया संकट या दुःख से बचाने अथवा निकालने का बोध देती है। ‘छुड़ाया’ प्रसंगानुकूल है और अनावश्यक रूप से विशिष्ट धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘बुद्धि’ को सामान्य संज्ञा रखते हुए उसे सक्रिय, व्यक्तिगत कर्ता के रूप में प्रस्तुत किया गया है।
  alternative: ‘प्रज्ञा’ को व्यक्तिवाचक नाम की तरह लिखना, या मानवीकरण को कम करके इसे केवल अमूर्त गुण के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ बुद्धि का मानवीकरण करता है, पर उसे स्पष्ट रूप से व्यक्तिवाचक नाम घोषित नहीं करता। हिन्दी में ‘बुद्धि ने अपनी सेवा करने वालों’ से यह साहित्यिक और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘परन्तु’ δέ के विरोध या परिवर्तनसूचक भाव को व्यक्त करता है।
