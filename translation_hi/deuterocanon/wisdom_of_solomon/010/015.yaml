  rationale: यह परमेश्वर से संबंध में समर्पित और धर्मनिष्ठ होने का भाव रखता है; 'पवित्र प्रजा' स्वाभाविक और गरिमापूर्ण है।
- source_word: σπέρμα
  choice: वंश
