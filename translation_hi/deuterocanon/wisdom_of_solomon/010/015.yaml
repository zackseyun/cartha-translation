- source_word: ἄμεμπτον
  choice: निर्दोष
  rationale: यह दोषारोपण से परे या निष्कलंक होने का नैतिक भाव संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: क्रिया संकट और उत्पीड़न से निकालने का अर्थ देती है। 'छुड़ाया' इस उद्धारकारी कार्य को स्पष्ट रखता है, बिना अनावश्यक doctrinal विस्तार के।
- source_word: ἔθνους
