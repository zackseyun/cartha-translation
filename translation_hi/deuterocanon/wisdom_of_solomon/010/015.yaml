  rationale: यह λαός से भिन्न सामूहिक राजनीतिक-जातीय इकाई को दर्शाता है; 'राष्ट्र' उस भेद को बनाए रखता है।
- source_word: θλιβόντων
  choice: सतानेवाले
  rationale: वर्तमान कृदंत दबाने, क्लेश देने या उत्पीड़ित करने का भाव देता है। जननकारक के साथ इसे ἔθνους का विशेषण मानकर 'सतानेवाले राष्ट्र' कहना यूनानी संरचना और उसकी वास्तविक अस्पष्टता के निकट है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὕτη का संदर्भ
  choice: '''उसने'' द्वारा मानवीकृत बुद्धि की ओर पूर्वसंदर्भ'
  alternative: स्पष्टता के लिए 'बुद्धि ने' या अधिक अक्षरशः 'इसने'
  rationale: प्रसंग में बुद्धि स्त्रीलिंग कर्ता के रूप में कार्य करती है। संज्ञा को अनावश्यक रूप से दोहराए बिना हिन्दी सर्वनाम साहित्यिक मानवीकरण को बनाए रखता है।
- issue: ὅσιον और ἄμεμπτον द्वारा प्रजा/वंश का वर्णन
  choice: '''पवित्र'' और ''निर्दोष'' को बिना नरम किए रखा गया'
  alternative: '''भक्त'' और ''निष्कलंक'''
  rationale: पद की वाचा-संबंधी और नैतिक प्रशंसा को सीधे सुरक्षित रखा गया है, बिना बाद की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को जोड़ने के।
- issue: θλιβόντων का व्याकरणिक संबंध
  choice: 'ἔθνους को विशेषित करने वाला कृदंत: ''सतानेवाले राष्ट्र से'''
  alternative: 'संज्ञात्मक अर्थ: ''अत्याचारियों के राष्ट्र से'' अथवा अंतर्निहित कर्म जोड़कर ''उस राष्ट्र से जो उन्हें सताता था'''
  rationale: यूनानी रूप संदर्भगत रूप से उत्पीड़न का अर्थ स्पष्ट करता है, पर कृदंत को विशेषण या संज्ञात्मक प्रयोग के रूप में समझने की कुछ गुंजाइश है। मुख्य पाठ अपेक्षाकृत निकट विशेषणात्मक रूप रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
