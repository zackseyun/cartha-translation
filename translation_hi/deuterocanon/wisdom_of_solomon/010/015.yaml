  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संबंध पिछले प्रसंग में मानवीकृत बुद्धि से है। हिन्दी में क्रिया के साथ 'उसने' इस पूर्वसंदर्भ को स्वाभाविक रूप से बनाए रखता है।
