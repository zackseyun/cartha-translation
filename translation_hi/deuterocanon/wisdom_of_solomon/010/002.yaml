  text: और उसे सब पर अधिकार रखने की सामर्थ्य दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέν
  choice: दी
  rationale: δίδωμι के भूतकालीन अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τε
  choice: और
  rationale: यह अव्यय इस उपवाक्य को पिछले कथन से जोड़ता है; हिन्दी में ‘और’ इसका सहज समतुल्य है।
- source_word: αὐτῷ
  choice: उसे
  rationale: पुल्लिंग एकवचन संदर्भ को स्वाभाविक हिन्दी सर्वनाम से व्यक्त करता है।
- source_word: ἰσχὺν
  choice: सामर्थ्य
  rationale: ἰσχύς की शक्ति अथवा क्षमता की धारणा को गरिमापूर्ण और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: κρατῆσαι
  choice: अधिकार रखने
  rationale: यहाँ κρατέω किसी पर प्रभावी अधिकार या प्रभुत्व रखने का बोध देता है; यह अनुवाद क्रिया में निहित नियंत्रण को स्पष्ट करता है, पर ‘जीतने’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἁπάντων
  choice: सब पर
  rationale: समग्रता को बनाए रखता है। हिन्दी में ‘अधिकार रखना’ के साथ ‘सब पर’ स्वाभाविक है और यूनानी के व्यापक, अनिर्दिष्ट दायरे को सुरक्षित रखता है।
theological_decisions:
- issue: आदम को दिए गए अधिकार का दायरा
  choice: ‘सब पर’ कहकर दायरे को व्यापक और अनिर्दिष्ट रखा गया है।
  alternative: ‘सारी सृष्टि पर’ या ‘सब वस्तुओं पर’
  rationale: यूनानी पाठ सृष्टि या प्राणियों को स्पष्ट रूप से नहीं जोड़ता। इसलिए ऐसी संज्ञा जोड़ना उचित नहीं, यद्यपि प्रसंग में मानव-अधिकार की ओर संकेत हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘अधिकार रखने की सामर्थ्य’ मूल के शक्ति और प्रभुत्व—दोनों तत्वों को बनाए रखता है।
