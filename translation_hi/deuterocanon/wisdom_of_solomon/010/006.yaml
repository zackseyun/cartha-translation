base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: hi
  text: जब अधर्मी नष्ट हो रहे थे, तब उसने एक धर्मी मनुष्य को बचाया, जो पाँच नगरों[a] पर उतरती हुई आग[b] से भाग रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सदोम से जुड़े पाँच नगरों का समूह; यह पद लूत के बच निकलने की घटना की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: यूनानी में आग के ‘उतरने’ का वर्णन है, पर यह स्पष्ट रूप से नहीं कहा गया कि वह ‘स्वर्ग से’ उतरी।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: उसने
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम निकटवर्ती प्रसंग की मानवीकृत ‘बुद्धि’ की ओर संकेत करता है। हिन्दी में ‘उसने’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: δίκαιον
  choice: एक धर्मी मनुष्य
  rationale: यह कर्मकारक एकवचन उस व्यक्ति को दर्शाता है जिसे बचाया गया; यूनानी पाठ उसका नाम नहीं बताता। ‘धर्मी’ δίκαιος के नैतिक अर्थ को व्यक्त करता है।
- source_word: ἐξαπολλυμένων ἀσεβῶν
  choice: जब अधर्मी नष्ट हो रहे थे
  rationale: वर्तमान कृदन्त विनाश की जारी प्रक्रिया दिखाता है। ‘नष्ट हो रहे थे’ कर्ता को अनावश्यक रूप से निश्चित किए बिना यह भाव सुरक्षित रखता है; ‘अधर्मी’ ἀσεβής के धार्मिक-नैतिक आशय के लिए प्रचलित और सहज है।
- source_word: ἐρρύσατο
  choice: बचाया
  rationale: क्रिया संकट से छुड़ाने या रक्षा करने को दर्शाती है; ‘बचाया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: φυγόντα
  choice: जो ... से भाग रहा था
  rationale: पुल्लिंग कर्मकारक कृदन्त ‘धर्मी मनुष्य’ से संबंधित है। यह रूप उसके भागने और बचाए जाने को निकटता से जोड़ता है, बिना कथा में अतिरिक्त विवरण जोड़े।
- source_word: πῦρ καταβάσιον
  choice: उतरती हुई आग
  rationale: καταβάσιον नीचे आने या उतरने का भाव देता है। हिन्दी अनुवाद दिशा को बनाए रखता है, पर यूनानी में स्पष्ट न किए गए ‘स्वर्ग से’ शब्द नहीं जोड़ता।
- source_word: Πενταπόλεως
  choice: पाँच नगरों
  rationale: यह ‘पेन्टापोलिस’, अर्थात पाँच नगरों के समूह, को दर्शाता है। अर्थानुवाद सामान्य पाठक के लिए लिप्यंतरण से अधिक स्पष्ट है।
theological_decisions:
- issue: स्त्रीलिंग कर्ता αὕτη का संकेत
  choice: इसे पिछले प्रसंग की मानवीकृत बुद्धि की ओर संकेत मानकर ‘उसने’ रखा गया है।
  alternative: ‘इस बुद्धि ने’ या ‘इसने’
  rationale: अध्याय 10 में उद्धार के कार्य मानवीकृत बुद्धि को दिए गए हैं। सर्वनाम उस साहित्यिक व्यक्तिकरण को बनाए रखता है और कोई बाद की धर्मसैद्धांतिक पहचान नहीं जोड़ता।
- issue: धर्मी मनुष्य और पाँच नगरों की पहचान
  choice: मुख्य पाठ में नाम बताए बिना संकेत को निहित रखा गया है।
  alternative: लूत और सदोम को मुख्य पाठ में स्पष्ट रूप से नाम देना
  rationale: पद स्वयं लूत या सदोम का नाम नहीं लेता, यद्यपि संकेत उसी कथा की ओर है। नामों को केवल टिप्पणी में स्पष्ट करना मूल पाठ की संयमित अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की समय-संबंधी संरचना यूनानी कृदन्तों के भाव को स्वाभाविक हिन्दी में व्यक्त करती है; मूल में न दिए गए व्यक्तिनाम और आग के स्रोत को मुख्य पाठ में नहीं जोड़ा गया।
