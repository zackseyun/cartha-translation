  choice: लोभी
  rationale: πλεονεξία लोभ या अधिक पाने की लालसा को दर्शाता है। हिन्दी में क्रियाशील विरोधियों के साथ ‘लोभी लोग’ कहना स्वाभाविक है और मूल के नैतिक भाव को बनाए रखता है।
- source_word: κατισχυόντων αὐτὸν
  choice: लोग उस पर प्रबल हो रहे थे
  rationale: κατισχύω का अर्थ किसी के विरुद्ध प्रबल होना या उस पर हावी होना है। यह अनुवाद मूल की अपेक्षाकृत व्यापक अभिव्यक्ति को बनाए रखता है और ‘सताया’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: παρέστη
  choice: उसके साथ खड़ी रही
  rationale: παρίστημι यहाँ पास खड़े होकर सहायता और समर्थन देने का बोध कराता है। स्त्रीलिंग रूप संदर्भ में व्यक्तिरूप दी गई बुद्धि से मेल खाता है।
- source_word: ἐπλούτισεν αὐτόν
  choice: उसने उसे धनवान बना दिया
  rationale: πλουτίζω का सीधा अर्थ धनवान बनाना है। यह मूर्त आर्थिक समृद्धि के भाव को ‘समृद्ध किया’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
