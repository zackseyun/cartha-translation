  alternative: यूनानी की तरह कर्ता को निहित छोड़ना
  rationale: अध्याय 10 के प्रवाह में व्यक्तिरूप दी गई बुद्धि ही लगातार कार्य करने वाली स्त्रीलिंग कर्ता है। हिन्दी में कर्ता स्पष्ट करना स्वाभाविक है; स्त्रीलिंग सर्वनाम इसी संदर्भ को व्यक्त करता है, बिना कोई नई धर्मवैज्ञानिक पहचान जोड़े।
- issue: लोभ और प्रबल होने के बीच संबंध
  choice: ‘लोभी लोग उस पर प्रबल हो रहे थे’
  alternative: ‘जब वे लोभ के कारण उस पर प्रबल हुए’
  rationale: ἐν πλεονεξίᾳ रीति, परिस्थिति या साधन बता सकता है। मुख्य पाठ स्वाभाविक हिन्दी में लोभ को विरोधियों की विशेषता के रूप में व्यक्त करता है, जबकि पादटिप्पणी अधिक औपचारिक संरचना सुरक्षित रखती है।
