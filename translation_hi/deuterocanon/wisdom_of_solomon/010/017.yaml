  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: hi
  text: उसने पवित्र जनों[a] को उनके परिश्रम का प्रतिफल दिया, एक अद्भुत मार्ग पर उनकी अगुवाई की, और वह दिन में उनके लिए आश्रय तथा रात में तारों की ज्वाला[b] बनी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जनों’ का अनुवाद ‘धर्मपरायण लोगों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पदबंध का शाब्दिक अर्थ ‘तारों की ज्वाला’ है; इसे ‘तारों-सी ज्वाला’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह चित्र निर्गमन के समय दिन में परमेश्वर की छाया-सुरक्षा और रात में अग्निमय मार्गदर्शन की याद दिलाता है; किन्तु यूनानी पाठ यहाँ ‘बादल का खम्भा’ और ‘आग का खम्भा’ वाला पूरा पारंपरिक सूत्र नहीं कहता।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: दिया
  rationale: क्रिया का अर्थ लौटाना, प्रदान करना या प्रतिफल देना हो सकता है। μισθὸν के साथ ‘प्रतिफल दिया’ सहज है और अनावश्यक रूप से आर्थिक लेन-देन का भाव नहीं थोपता।
- source_word: ὁσίοις
  choice: पवित्र जनों
  rationale: ὅσιος ईश्वर के प्रति समर्पित, धर्मपरायण या पवित्र लोगों को सूचित करता है। ‘पवित्र जन’ मूल के विशेषणात्मक और गरिमापूर्ण भाव को बनाए रखता है।
- source_word: μισθὸν κόπων αὐτῶν
  choice: उनके परिश्रम का प्रतिफल
  rationale: μισθός यहाँ मजदूरी या प्रतिफल है और κόπος श्रमसाध्य परिश्रम। यह प्रयोग प्रयास और उसके उचित फल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: एक अद्भुत मार्ग पर उनकी अगुवाई की
  rationale: ὁδηγέω मार्ग दिखाने या अगुवाई करने का बोध देता है। ‘अद्भुत मार्ग’ θαυμαστῇ की विस्मयकारी विशेषता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἐγένετο αὐτοῖς εἰς σκέπην ἡμέρας
  choice: वह दिन में उनके लिए आश्रय बनी
  rationale: σκέπη आवरण, शरण या सुरक्षा है। ‘आश्रय’ रक्षात्मक भाव स्पष्ट करता है और ἡμέρας को समयसूचक ‘दिन में’ के रूप में व्यक्त किया गया है।
- source_word: εἰς φλόγα ἄστρων τὴν νύκτα
  choice: रात में तारों की ज्वाला
  rationale: यह संक्षिप्त यूनानी पदबंध शाब्दिक रूप से ‘तारों की ज्वाला’ कहता है। हिन्दी में उसी असामान्य काव्यात्मक चित्र को रखा गया है, उसे सीधे ‘आग का खम्भा’ बनाकर स्पष्ट नहीं किया गया।
theological_decisions:
- issue: पूरे पद में निहित कर्ता की पहचान
  choice: मुख्य पाठ में ‘उसने/वह’ रखा गया है; पूर्व प्रसंग में व्यक्तिरूप ज्ञान इसका संकेतित कर्ता है।
  alternative: कर्तृपद को स्पष्ट करके हर जगह ‘ज्ञान’ कहना।
  rationale: यूनानी पद में Σοφία दोहराया नहीं गया है, यद्यपि साहित्यिक प्रसंग उसे कर्ता बताता है। सर्वनाम मूल की शैली और निहित संबंध दोनों को बनाए रखता है।
- issue: निर्गमनकालीन बादल और आग के स्तम्भ की ओर संकेत
  choice: मुख्य पाठ में मूल बिंबों का सीधा अनुवाद किया गया है।
  alternative: ‘दिन में बादल का खम्भा और रात में आग का खम्भा’ लिखना।
  rationale: यहाँ निर्गमन की परंपरा की स्पष्ट अनुगूँज है, पर यूनानी पाठ पूर्ण पारंपरिक सूत्र का प्रयोग नहीं करता। इसलिए विस्तार को मुख्य पाठ में जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘प्रतिफल’, ‘अगुवाई’ और ‘आश्रय’ सामान्य बाइबिलीय-साहित्यिक प्रयोग हैं। असामान्य काव्यात्मक पदबंध ‘तारों की ज्वाला’ को जानबूझकर सुरक्षित रखा गया है ताकि मूल की संभावित अस्पष्टता न मिटे।
