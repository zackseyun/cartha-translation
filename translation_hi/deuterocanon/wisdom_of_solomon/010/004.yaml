  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/004.yaml
  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: hi
  text: उसी के कारण[a], जब पृथ्वी जलप्रलय में डूब रही थी, बुद्धि ने फिर उसे बचाया और साधारण-सी लकड़ी के द्वारा धर्मी मनुष्य को दिशा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसी के कारण’ पिछले पद में वर्णित अधर्मी व्यक्ति की ओर संकेत करता है। यूनानी पद का अनुवाद ‘जिसके कारण’ भी हो सकता है।
    reason: सर्वनाम का संदर्भ और कारणार्थ स्पष्ट करना।
lexical_decisions:
- source_word: δι' ὃν
  choice: उसी के कारण
  rationale: सम्बन्धवाचक पद पूर्ववर्ती दुष्ट व्यक्ति की ओर संकेत करते हुए जलप्रलय का कारण बताता है; ‘उसी के कारण’ इस कारणार्थ और संदर्भ-संबंध को सहज हिन्दी में रखता है।
- source_word: κατακλυζομένην γῆν
  choice: जब पृथ्वी जलप्रलय में डूब रही थी
  rationale: वर्तमान कर्मवाच्य कृदन्त पृथ्वी पर जारी जलप्लावन को दर्शाता है; यह अनुवाद उसकी अपूर्ण/चल रही क्रिया और प्रलय-संदर्भ दोनों को सुरक्षित रखता है।
- source_word: πάλιν διέσωσεν
  choice: फिर उसे बचाया
  rationale: πάλιν का सीधा अर्थ ‘फिर’ है और διασῴζω संकट में से सुरक्षित बचाने का भाव देता है। स्त्रीलिंग ‘उसे’ का व्याकरणिक संदर्भ ‘पृथ्वी’ है, यद्यपि आशय जलप्रलय के बीच जीवन/संसार के संरक्षण का है।
- source_word: σοφία
  choice: बुद्धि
  rationale: पुस्तक में यह मानवीकृत सक्रिय कर्ता है। सामान्य संज्ञा के रूप में ‘बुद्धि’ मूल शब्द को रखती है और उसे अनावश्यक रूप से व्यक्तिनाम या विशिष्ट तात्त्विक सत्ता नहीं बनाती।
- source_word: δι' εὐτελοῦς ξύλου
  choice: साधारण-से काठ के सहारे
  rationale: εὐτελής निम्न मूल्य, सादगी या नगण्यता का भाव देता है; ‘साधारण-से’ आधुनिक हिन्दी में तुच्छ साधन का विरोधाभासी बल रखता है, बिना घटिया गुणवत्ता का भ्रामक संकेत दिए। ξύλον के लिए ‘काठ’ जहाज़/पोत बनाने की सामग्री को संक्षेप में व्यक्त करता है।
- source_word: τὸν δίκαιον
  choice: धर्मी जन
  rationale: पुल्लिंग एकवचन पद नूह की ओर संकेत करता है। ‘धर्मी जन’ गरिमापूर्ण, सहज और संदर्भानुकूल है।
- source_word: κυβερνήσασα
  choice: कर्णधार बनी
  rationale: यह नौपरिवहन-संबंधी कृदन्त है—पोत को चलाने या दिशा देने का अर्थ रखता है। ‘कर्णधार बनी’ नौकायन की सजीव छवि और स्त्रीलिंग कर्ता ‘बुद्धि’ से सामंजस्य दोनों सुरक्षित रखता है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘बुद्धि’ को सक्रिय, मानवीकृत कर्ता के रूप में रखा गया है, पर व्यक्तिनाम नहीं बनाया गया।
  alternative: ‘बुद्धि’ को किसी स्वतंत्र दैवी व्यक्तित्व या औपचारिक उपाधि के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ बुद्धि को व्यक्तिगत ढंग से कार्य करते दिखाता है, लेकिन यह पद अकेले उसके तत्त्वमीमांसक स्वरूप को निश्चित नहीं करता।
- issue: ‘उसी’ और ‘धर्मी जन’ के संदर्भ
  choice: ‘उसी’ पिछले पद के अधर्मी व्यक्ति की ओर और ‘धर्मी जन’ नूह की ओर संकेत करता है।
  alternative: ‘जिसके द्वारा’ को साधनार्थ मानना या सर्वनाम के संदर्भ को अनिर्धारित छोड़ना।
  rationale: निकटवर्ती साहित्यिक संदर्भ दुष्ट के कारण आए न्याय और नूह के संरक्षण का विरोध प्रस्तुत करता है; मुख्य पाठ संदर्भ को संकेतित करता है और पादटिप्पणी कारणार्थ स्पष्ट करती है।
- issue: पृथ्वी को बचाने का अर्थ
  choice: व्याकरणिक कर्म ‘पृथ्वी’ को बनाए रखा गया है।
  alternative: सीधे ‘मानवजाति’, ‘संसार’ या ‘नूह’ को कर्म बनाना।
  rationale: यूनानी γῆν ही διέσωσεν का प्रत्यक्ष कर्म है। जीवन के संरक्षण का निहितार्थ मौजूद है, पर उसे मुख्य पाठ में प्रतिस्थापित करना मूल की अभिव्यक्ति को संकरा कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘जलप्रलय’ व्यापक बाढ़-संदर्भ को, ‘साधारण-से काठ’ εὐτελής की निम्नता/नगण्यता को, और ‘कर्णधार बनी’ κυβερνήσασα की नौकायन-छवि को व्यक्त करता है।
