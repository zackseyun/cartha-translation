lexical_decisions:
- source_word: αὕτη
  choice: उसने
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संदर्भ पिछले प्रसंग की ‘बुद्धि’ है; हिन्दी में स्वाभाविक सर्वनाम से उसका निरंतर संदर्भ रखा गया है।
- source_word: πραθέντα δίκαιον
  choice: जब उस धर्मी को बेच दिया गया
  rationale: कर्मवाच्य कृदंत और विशेषण के संज्ञात्मक प्रयोग को स्पष्ट, स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: οὐκ ἐγκατέλιπεν
  choice: नहीं छोड़ा
  rationale: क्रिया का अर्थ संकट में त्याग देने का है; ‘नहीं छोड़ा’ सहज और अर्थसंगत है।
- source_word: ἐξ ἁμαρτίας ἐρρύσατο αὐτόν
  choice: उसे पाप से बचाया
  rationale: ἐρρύσατο संकट से छुड़ाने या बचाने को दर्शाता है। ἁμαρτία को बिना व्याख्यात्मक विस्तार के ‘पाप’ रखा गया है, जिससे मूल की संभावित अर्थगत तनाव सुरक्षित रहती है।
theological_decisions:
- issue: ‘पाप से बचाया’ का आशय
  choice: मूल के अनुसार ‘पाप से’ को यथावत रखा गया
  alternative: ‘पाप करने से बचाया’ या ‘पापियों के हाथ से बचाया’
  rationale: यूनानी ἐξ ἁμαρτίας संक्षिप्त और कुछ हद तक अस्पष्ट है। अनुवाद में यह तय नहीं किया गया कि आशय पाप करने से रक्षा, पाप की दशा से मुक्ति, या किसी विशिष्ट पापपूर्ण संकट से छुटकारा है।
