base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: hi
  text: क्योंकि बुद्धि की उपेक्षा करके उन्होंने न केवल भली बातों को न जानने की हानि उठाई, बल्कि मानव-जगत[a] के लिए अपनी मूर्खता का एक स्मारक भी छोड़ गए, ताकि जिन बातों में वे भटके थे, उनमें वे किसी की नज़र से भी न बच सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मानव जीवन के लिए।’ यूनानी βίος यहाँ किसी व्यक्ति-विशेष के जीवन के बजाय व्यापक मानव जीवन या जीवित लोगों के संसार को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παροδεύσαντες
  choice: उपेक्षा करके
  rationale: क्रिया का मूल चित्र किसी के पास से निकल जाने का है, पर यहाँ उसका आशय बुद्धि को अनदेखा करने या उसका निरादर करने से है। ‘उपेक्षा करके’ इस संदर्भगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐβλάβησαν
  choice: हानि उठाई
  rationale: यूनानी कर्मवाच्य रूप उनके हानिग्रस्त होने को बताता है। ‘हानि उठाई’ नैतिक और व्यावहारिक, दोनों प्रकार की क्षति को समेटता है।
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: भली बातों को न जानने
  rationale: τὰ καλά नैतिक रूप से अच्छी, उचित या उत्तम बातों का संकेत दे सकता है। ‘भली बातें’ इस व्यापक नैतिक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: τῆς ἀφροσύνης
  choice: अपनी मूर्खता
  rationale: ἀφροσύνη विवेकहीनता या मूर्खता को दर्शाता है। ‘अपनी’ जोड़ने से स्पष्ट होता है कि छोड़ा गया स्मारक उन्हीं के आचरण का था।
- source_word: ἀπέλιπον
  choice: छोड़ गए
  rationale: यह क्रिया पीछे कुछ स्थायी रूप से छोड़ जाने का भाव रखती है; ‘छोड़ गए’ हिन्दी में उसी परिणामकारी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ βίῳ
  choice: मानव जीवन के लिए
  rationale: βίος यहाँ किसी एक व्यक्ति की आयु के बजाय व्यापक मानव जीवन या जीवित लोगों के संसार का द्योतक हो सकता है। मुख्य पाठ में ‘मानव जीवन’ पठनीय है और व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: μνημόσυνον
  choice: एक स्मारक
  rationale: शब्द किसी ऐसी स्थायी वस्तु या निशानी को दर्शाता है जो स्मरण कराती रहे। ‘स्मारक’ उनकी मूर्खता के सार्वजनिक और टिकाऊ प्रमाण का भाव बनाए रखता है।
- source_word: ἔσφαλησαν
  choice: भटके थे
  rationale: क्रिया चूकने, ठोकर खाने या गलत मार्ग पर जाने का अर्थ दे सकती है। ‘भटके थे’ यहाँ नैतिक विचलन को व्यक्त करता है, पर उसे अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: वे छिपे भी न रह सकें
  rationale: λανθάνω का अर्थ ध्यान से बचना या अनदेखा रह जाना है। यह अनुवाद उस विडंबना को रखता है कि उनकी भूलों का स्मारक उन्हें उन्हीं बातों में छिपे रहने नहीं देता जिनमें वे भटके।
theological_decisions:
- issue: τὰ καλά का नैतिक आशय
  choice: भली बातें
  alternative: उत्तम बातें; जो अच्छा है
  rationale: यह पद केवल सुंदर या लाभकारी वस्तुओं की नहीं, नैतिक रूप से भली और उचित बातों की ओर संकेत करता है। ‘भली बातें’ अर्थ की व्यापकता और नैतिक बल दोनों बनाए रखता है।
- issue: अंतिम उपवाक्य में कर्ता और सार्वजनिक प्रकटीकरण
  choice: वे छिपे भी न रह सकें
  alternative: उनकी भूलें छिपी न रह सकें; वे अनदेखे न रह सकें
  rationale: यूनानी व्याकरण में क्रिया का कर्ता वही लोग हैं, यद्यपि आशय उनकी भूलों के प्रकट हो जाने से निकटता से जुड़ा है। मुख्य पाठ व्यक्ति-केंद्रित व्याकरण को सुरक्षित रखता है और अस्पष्टता को उनकी भूलों पर स्थानांतरित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। वाक्य की कारणात्मक संरचना और ‘न केवल… बल्कि… भी’ का संतुलन मूल यूनानी के तर्कक्रम को बनाए रखते हैं।
