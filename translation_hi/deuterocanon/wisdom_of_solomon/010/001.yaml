lexical_decisions:
- source_word: Αὕτη
  choice: उसने
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संबंध पिछले प्रसंग की व्यक्तिरूप में चित्रित बुद्धि से है। हिंदी में ‘उसने’ इस अन्वय को स्वाभाविक रूप से बनाए रखता है, बिना पद में ‘बुद्धि’ शब्द जोड़े।
- source_word: πρωτόπλαστον
  choice: प्रथम रचे गए
  rationale: यह आदम के सबसे पहले गढ़े या रचे जाने को सूचित करता है। ‘प्रथम रचे गए’ हिंदी में सहज है और गठन की मूल छवि को यथासंभव बनाए रखता है।
- source_word: πατέρα κόσμου
  choice: संसार के ... पिता
  rationale: यूनानी संबंधकारक पदबंध का औपचारिक और ऊँचा स्वर सुरक्षित रखा गया है। आशय मानव-जगत के पूर्वज से है, पर मुख्य पाठ में उसकी व्याख्या नहीं जोड़ी गई।
- source_word: μόνον
  choice: अकेला ही
  rationale: यह सृजन के समय उस प्रथम मनुष्य की एकाकी अवस्था पर बल देता है। ‘ही’ यूनानी के बलाघात को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κτισθέντα
  choice: सृजा गया था
  rationale: अकर्मक भूतकालीन कृदंत को हिंदी के स्वाभाविक पूर्वकालिक रूप में दिया गया है, जिससे रक्षा किए जाने के समय उसकी पहले से सृजी हुई अवस्था स्पष्ट होती है।
- source_word: διεφύλαξεν
  choice: रक्षा की
  rationale: क्रिया सावधानी से सुरक्षित रखने या बचाए रखने का भाव देती है। ‘रक्षा की’ स्पष्ट, गरिमापूर्ण और व्यक्तिवाचक प्रयोग के अनुकूल है।
- source_word: ἐξείλατο
  choice: छुड़ाया
  rationale: मध्यवाची क्रिया बचाने या संकट से निकालने का अर्थ देती है। ‘छुड़ाया’ हिंदी में स्वाभाविक रहते हुए उद्धार के ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: παραπτώματος
  choice: अपराध
  rationale: शब्द मूलतः चूक, दोष या मर्यादा-भंग का संकेत देता है। ‘अपराध’ नैतिक गंभीरता बनाए रखता है, पर ‘पतन’ जैसी बाद की पारिभाषिक धर्मवैज्ञानिक व्याख्या नहीं थोपता।
- source_word: ἰδίου
  choice: उसके अपने
  rationale: यह अपराध के उसी व्यक्ति का होने पर स्पष्ट बल देता है। ‘उसके अपने’ हिंदी में इस आत्मसंबंधी बल को सुरक्षित रखता है।
theological_decisions:
- issue: ‘संसार के प्रथम रचे गए पिता’ की पहचान
  choice: मुख्य पाठ में यूनानी की तरह आदम का नाम न देकर वर्णन को बनाए रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘आदम’ लिखना।
  rationale: मूल यूनानी आदम की ओर संकेत करता है, पर उसका नाम नहीं लेता। वर्णन को मुख्य पाठ में रखना साहित्यिक शैली और स्रोत की सीमा दोनों को सुरक्षित रखता है; पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: παραπτώματος का अनुवाद
  choice: अपराध
  alternative: पतन
  rationale: ‘पतन’ आदम के पाप के लिए बाद की धर्मवैज्ञानिक पारिभाषिकता ला सकता है। ‘अपराध’ मूल शब्द के नैतिक अर्थ को व्यक्त करता है और उस पारिभाषिक निष्कर्ष को अनिवार्य नहीं बनाता।
