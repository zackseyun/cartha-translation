  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: hi
  text: वह उसके साथ गड्ढे[a] में उतरी और बेड़ियों में भी उसने उसे नहीं छोड़ा, जब तक कि उसने उसे राजसत्ता के राजदंड और उस पर प्रभुता करने वालों पर अधिकार न दिला दिया। उसने उस पर दोष लगाने वालों को झूठा सिद्ध किया[b] और उसे चिरस्थायी महिमा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंदीगृह में’; यूनानी में शाब्दिक रूप से ‘गड्ढे में’ है, जो कैद के लिए प्रयुक्त गड्ढे या हौद को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस पर आरोप लगाने वालों को झूठा प्रमाणित किया।’
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη
  choice: उसके साथ ... उतरी
  rationale: संयुक्त क्रिया साथ उतरने का भाव देती है; स्त्रीलिंग कर्ता प्रसंग में व्यक्तिरूप बुद्धि है।
- source_word: εἰς λάκκον
  choice: गड्ढे में
  rationale: λάκκος का मूल ठोस बिंब सुरक्षित रहता है; यह कैद के लिए प्रयुक्त गड्ढा या हौद भी हो सकता है।
- source_word: ἐν δεσμοῖς
  choice: बेड़ियों में भी
  rationale: δεσμοί बंधनों या बेड़ियों को दर्शाता है; ‘भी’ विपरीत परिस्थिति में न छोड़ने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: उसने उसे नहीं छोड़ा
  rationale: यहाँ ἀφίημι का अर्थ पीछे छोड़ देना या त्याग देना है; ‘नहीं छोड़ा’ सरल और प्रसंगानुकूल है।
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: जब तक कि वह उसे ... तक न ले आई
  rationale: φέρω के लाने या पहुँचाने के भाव को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और पदोन्नति की गति बनाए रखता है।
- source_word: σκῆπτρα βασιλείας
  choice: राजसत्ता के राजदंड
  rationale: σκῆπτρα के बहुवचन और βασιλείας के राजकीय अधिकार—दोनों को यथासंभव बनाए रखा गया है।
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: उन लोगों पर अधिकार ... जिन्होंने उस पर शासन किया था
  rationale: यह प्रभुत्व के उलट जाने को स्पष्ट करता है, जबकि τυραννέω में निहित कठोर या दमनकारी शासन को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: ψευδεῖς ... ἔδειξεν
  choice: झूठा सिद्ध किया
  rationale: रचना का अर्थ आरोप लगाने वालों को असत्य प्रमाणित करना है; हिन्दी में यह संक्षिप्त और स्पष्ट है।
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: जिन्होंने उस पर दोष लगाया था
  rationale: μωμάομαι के दोष लगाने, निंदा करने या आरोप लगाने के अर्थ को बिना ‘बदनामी’ का अतिरिक्त विशिष्ट भाव जोड़े सुरक्षित रखता है।
- source_word: δόξαν αἰώνιον
  choice: चिरस्थायी महिमा
  rationale: αἰώνιος की स्थायी अवधि और δόξα की गरिमा को वर्तमान, प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पूरे पद में स्त्रीलिंग कर्ता की पहचान
  choice: स्त्रीलिंग सर्वनाम ‘वह/उसने’ रखा गया है, जो निकटवर्ती प्रसंग की व्यक्तिरूप बुद्धि को सूचित करता है।
  alternative: पद के आरम्भ में ‘बुद्धि’ को स्पष्ट रूप से दोहराना।
  rationale: यूनानी पाठ सर्वनामात्मक प्रवाह रखता है; स्त्रीलिंग क्रियाएँ साहित्यिक व्यक्तिकरण को सुरक्षित रखती हैं और अनावश्यक व्याख्यात्मक विस्तार से बचाती हैं।
- issue: τυραννούντων में शासन और उत्पीड़न का संबंध
  choice: ‘जिन्होंने उस पर शासन किया था’
  alternative: ‘जिन्होंने उस पर अत्याचारपूर्वक प्रभुता की थी’ या ‘उसके उत्पीड़क’
  rationale: मुख्य पाठ सत्ता के उलटाव को सामने रखता है और शब्द के दमनकारी आयाम को पूर्णतः तय नहीं करता; अधिक तीखा विकल्प व्याख्यात्मक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे यूनानी वाक्य का प्रवाह बनाए रखते हुए विराम से दो संतुलित खंड बनाए गए हैं। ‘राजसत्ता के राजदंड’ में मूल बहुवचन का संकेत सुरक्षित है; ‘चिरस्थायी महिमा’ ज्ञान-साहित्य की उन्नत शैली के अनुरूप है।
