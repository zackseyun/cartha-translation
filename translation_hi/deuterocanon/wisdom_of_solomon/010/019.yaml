  text: पर उसने उनके शत्रुओं को जलप्लावित कर दिया, और अथाह गर्त की गहराई से उन्हें ऊपर उछाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέκλυσεν
  choice: जल में डुबो दिया
  rationale: क्रिया पानी से ढक देने या जलप्लावित कर देने का बोध कराती है। हिन्दी में यह वाक्यांश समुद्री प्रसंग को स्पष्ट रखता है; इसका आशय मृत्यु को अलग से जोड़ना नहीं, बल्कि जल के नीचे कर देना है।
- source_word: τοὺς ἐχθροὺς αὐτῶν
  choice: उनके शत्रुओं को
  rationale: यह मूल यूनानी के संबंधवाचक सर्वनाम और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ἐκ βάθους ἀβύσσου
  choice: अथाह सागर की गहराई से
  rationale: ἀβύσσου समुद्री प्रसंग में अथाह गहरे जल को सूचित करता है। ‘अथाह सागर’ सामान्य पाठक के लिए स्वाभाविक है और गहरे, अगाध जल की छवि बनाए रखता है।
- source_word: ἀνέβρασεν
  choice: उछालकर ऊपर ला दिया
  rationale: क्रिया किसी वस्तु को उफनाकर या जोर से ऊपर निकालने का अर्थ दे सकती है। यह चयन ऊपर आने की गति और जल की सक्रियता दोनों को रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: सर्वनाम पहले आए ‘शत्रुओं’ की ओर लौटता है और हिन्दी में इसका सीधा रूप स्वाभाविक है।
theological_decisions:
- issue: समुद्र में न्याय की ठोस छवि
  choice: जल में डुबोने और अथाह गहराई से ऊपर उछालने की दोनों क्रियाओं को ठोस रूप में बनाए रखा गया।
  alternative: ‘उनके शत्रुओं को मार डाला और उनके शव ऊपर ला दिए’ जैसा व्याख्यात्मक अनुवाद।
  rationale: निर्गमन-संबंधी संदर्भ मृत्यु की ओर संकेत करता है, पर यूनानी पाठ यहाँ न तो ‘मार डाला’ कहता है, न ‘शव’। इसलिए अनुवाद इन बातों को स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘परन्तु’ वाक्य के विरोधसूचक δέ को दर्शाता है। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ἀνέβρασεν की बलपूर्ण और ऊपर उठाने वाली दोनों अर्थ-छटाएँ मुख्य पाठ में ‘उछालकर ऊपर ला दिया’ से व्यक्त हो जाती हैं।
