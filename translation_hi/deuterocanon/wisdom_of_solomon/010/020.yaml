base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: hi
  text: इस कारण धर्मियों ने अधर्मियों से लूट का माल लिया[a]; और हे प्रभु, उन्होंने आपके पवित्र नाम का गुणगान किया और एक मन होकर आपके रक्षा करनेवाले हाथ[b] की स्तुति की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्मियों को लूटा’ अथवा ‘उनसे युद्ध की लूट ली।’ यूनानी क्रिया का अर्थ पराजित शत्रुओं से लूट का माल लेना है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘आपका वह हाथ जो अपने लोगों की ओर से लड़ता है’ अथवा ‘आपका पक्ष लेकर लड़नेवाला हाथ।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इस कारण
  rationale: यह पद पिछली घटना के परिणाम को बताता है; यह संक्षिप्त और स्वाभाविक कारणसूचक प्रयोग है।
- source_word: δίκαιοι
  choice: धर्मियों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में उन लोगों के लिए प्रयुक्त है जिनका चरित्र धार्मिकता से पहचाना जाता है।
- source_word: ἐσκύλευσαν
  choice: लूट का माल लिया
  rationale: यूनानी क्रिया पराजित शत्रुओं से युद्ध की लूट लेने का ठोस भाव रखती है; यह पदबंध उस ऐतिहासिक और विजय-संबंधी अर्थ को स्पष्ट करता है।
- source_word: ἀσεβεῖς
  choice: अधर्मियों
  rationale: यह शब्द परमेश्वर के प्रति अनादर और अधार्मिकता दोनों का संकेत देता है; हिंदी बाइबलीय भाषा में ‘अधर्मी’ इसका स्वाभाविक समतुल्य है।
- source_word: ὕμνησαν
  choice: गुणगान किया
  rationale: क्रिया स्तुतिगान करने का भाव रखती है; ‘गुणगान किया’ संगीतात्मक स्तुति की छाया को सहज हिंदी में बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को किया गया संबोधन है; ‘हे’ हिंदी में प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: आपके पवित्र नाम
  rationale: यह परमेश्वर की प्रकट पहचान और प्रतिष्ठा के लिए प्रचलित बाइबलीय अभिव्यक्ति को सीधे सुरक्षित रखता है।
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: आपके रक्षा करनेवाले हाथ
  rationale: यह अनुवाद ‘हाथ’ के मूल रूपक को बनाए रखते हुए ὑπέρμαχος में निहित किसी की ओर से लड़ने और रक्षा करने का सक्रिय भाव व्यक्त करता है।
- source_word: ᾔνεσαν
  choice: स्तुति की
  rationale: यह स्तुति के लिए सामान्य क्रिया है; इससे पहले आए अधिक विशिष्ट स्तुतिगान के भाव से इसका अंतर भी बना रहता है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह केवल एक साथ होने के बजाय साझा इच्छा और एकमत भाव को व्यक्त करता है।
theological_decisions:
- issue: ‘धर्मियों’ और ‘अधर्मियों’ का संदर्भ
  choice: मुख्य पाठ में नैतिक-धार्मिक पद ‘धर्मियों’ और ‘अधर्मियों’ बनाए रखे गए हैं।
  alternative: इस्राएली धर्मियों और मिस्री अधर्मियों को स्पष्ट रूप से जोड़ना।
  rationale: संदर्भ इस्राएल और मिस्र की ओर संकेत करता है, पर यूनानी पाठ जातीय नामों के बजाय नैतिक-धार्मिक श्रेणियों का प्रयोग करता है; अनुवाद उसी अर्थ-विस्तार को सुरक्षित रखता है।
- issue: परमेश्वर के ‘रक्षा करनेवाले हाथ’ का रूपक
  choice: ‘हाथ’ का रूपक और उसकी सक्रिय रक्षात्मक, युद्ध-संबंधी छाया दोनों बनाए रखी गई हैं।
  alternative: ‘सामर्थ्य’, ‘शक्तिशाली हाथ’ या ‘सुरक्षा देनेवाली शक्ति’।
  rationale: मूल पाठ परमेश्वर की शक्ति को ऐसे हाथ के रूप में प्रस्तुत करता है जो अपने लोगों की ओर से लड़ता है। केवल ‘सामर्थ्य’ कहने से यह चित्र और ὑπέρμαχος का योद्धा-रक्षक भाव धुंधला पड़ जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘गुणगान’ और ‘स्तुति’ यूनानी की दो अलग स्तुति-क्रियाओं का अंतर बनाए रखते हैं। संबोधन में आदरसूचक ‘आपके’ का प्रयोग किया गया है।
