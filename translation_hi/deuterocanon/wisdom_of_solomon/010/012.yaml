  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: hi
  text: उसने उसे शत्रुओं से बचाया, और घात लगाने वालों से उसे सुरक्षित रखा; उसने उसे एक कठिन संघर्ष सौंपा[a], ताकि वह जान ले कि ईश्वर-भक्ति सब कुछ से अधिक शक्तिशाली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कठिन संघर्ष में उसे पुरस्कार दिया।” यूनानी क्रिया में प्रतियोगिता का निर्णय करने और पुरस्कार देने—दोनों की छवि है।
    reason: lexical_alternative
