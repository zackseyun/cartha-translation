  rationale: तुलनात्मक पद का अर्थ समस्त वस्तुओं पर सामर्थ्य में श्रेष्ठता है।
- source_word: εὐσέβεια
  choice: ईश्वर-भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और जीवन में उसकी अभिव्यक्ति दोनों समेटता है; ‘ईश्वर-भक्ति’ आधुनिक पाठक के लिए सुलभ है।
theological_decisions:
- issue: पूरे पद में स्त्रीलिंग कर्ता का संकेत
  choice: ‘उसने’ रखा गया, जिसका संदर्भ निकटवर्ती प्रसंग की मानवीकृत प्रज्ञा से है।
  alternative: पद में ‘प्रज्ञा ने’ स्पष्ट रूप से दोहराया जा सकता था।
  rationale: यूनानी में कर्ता निहित है और प्रसंग से आता है; सर्वनामात्मक हिन्दी स्रोत की साहित्यिक संरचना को बिना अतिरिक्त स्पष्टता थोपे बनाए रखती है।
- issue: ἐβράβευσεν का कठिन संघर्ष से संबंध
  choice: ‘उसके लिए एक कठिन संघर्ष का निर्णय किया’
  alternative: ‘कठिन संघर्ष में उसे पुरस्कार दिया’ या ‘प्रबल संघर्ष में उसे विजय दी’
  rationale: यूनानी में निर्णायक, प्रतियोगिता और पुरस्कार का संयुक्त बिंब है। चुना हुआ पाठ यह तनाव बनाए रखता है कि प्रज्ञा ने संघर्ष को ही उसके लिए निर्णीत किया; इसे सीधे विजय में नहीं बदलता।
