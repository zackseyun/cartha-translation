base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: hi
  text: जब जातियाँ अपनी दुष्ट एकमतता में[a] भ्रमित कर दी गईं, तब उसने भी उस धर्मी मनुष्य को पाया[b], उसे परमेश्वर के सामने निर्दोष बनाए रखा, और उसकी संतान के लिए उसकी गहरी ममता के बावजूद उसे दृढ़ बनाए रखा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी दुष्ट सहमति में’ अथवा ‘बुरी एकता में।’ यूनानी पद जातियों की साझा बुरी मंशा का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में ‘धर्मी मनुष्य’ से सम्भवतः अब्राहम अभिप्रेत है, पर यूनानी पाठ यहाँ उसका नाम नहीं लेता।
    reason: cross_reference
  - marker: c
    text: या ‘उसकी संतान के प्रति कोमल भावनाओं के होते हुए भी उसे अटल बनाए रखा।’ यूनानी में संतान के लिए भीतर की गहरी ममता या करुणा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη καὶ
  choice: तब उसने भी
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संदर्भ प्रसंग में व्यक्तिरूप में प्रस्तुत बुद्धि से है। हिन्दी में ‘उसने’ स्वाभाविक रूप से उसी कर्ता को आगे बढ़ाता है, और καί का भाव ‘भी’ से सुरक्षित रहता है।
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  choice: अपनी दुष्ट एकमतता में
  rationale: ὁμόνοια मन की एकता, सहमति या एकमतता बताता है, जबकि πονηρία उसका नैतिक रूप से दुष्ट चरित्र स्पष्ट करता है। यह अनुवाद उनकी साझा बुरी मंशा को बिना ‘षड्यंत्र’ जैसा अधिक विशिष्ट अर्थ जोड़े व्यक्त करता है।
- source_word: ἐθνῶν συγχυθέντων
  choice: जब जातियाँ ... भ्रमित कर दी गईं
  rationale: सम्बन्धकारक निरपेक्ष रचना परिस्थितिजन्य उपवाक्य के रूप में दी गई है। निष्क्रिय रूप मूल के συγχυθέντων को सुरक्षित रखता है और बाबेल की ओर सम्भावित संकेत को स्पष्ट नाम दिए बिना बनाए रखता है।
- source_word: εὗρεν τὸν δίκαιον
  choice: उस धर्मी मनुष्य को ढूँढ़ निकाला
  rationale: τὸν δίκαιον पुल्लिंग एकवचन में संज्ञा-सदृश विशेषण है। ‘धर्मी मनुष्य’ उसके वर्णनात्मक स्वरूप को रखता है और मुख्य पाठ में अब्राहम का नाम नहीं जोड़ता।
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: उसे परमेश्वर के सामने निर्दोष बनाए रखा
  rationale: τηρέω के संरक्षण और निरन्तर बनाए रखने के भाव को ‘बनाए रखा’ से तथा ἄμεμπτον को ‘निर्दोष’ से व्यक्त किया गया है। θεῷ का सम्बन्धपरक भाव स्वाभाविक हिन्दी में ‘परमेश्वर के सामने’ है।
- source_word: ἐπὶ τέκνου σπλάγχνοις
  choice: अपनी संतान के प्रति उसकी गहरी ममता के बावजूद
  rationale: σπλάγχνα भीतर की कोमल भावनाओं, करुणा या ममता का बोध कराता है। ἐπί के सम्बन्ध को यहाँ परीक्षा के समय उस पितृ-ममता के बावजूद दृढ़ रहने के रूप में व्यक्त किया गया है, पर बलिदान का उल्लेख नहीं जोड़ा गया।
- source_word: ἰσχυρὸν ἐφύλαξεν
  choice: उसे दृढ़ बनाए रखा
  rationale: φυλάσσω संरक्षण का और ἰσχυρός सामर्थ्य या दृढ़ता का भाव देता है। ‘दृढ़ बनाए रखा’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक स्थिरता को व्यक्त करता है।
theological_decisions:
- issue: ‘धर्मी मनुष्य’ की पहचान
  choice: मुख्य पाठ में वर्णनात्मक पद ‘धर्मी मनुष्य’ रखा गया है।
  alternative: सीधे ‘अब्राहम’ नाम देना।
  rationale: प्रसंग, विशेषकर संतान के प्रति ममता का उल्लेख, अब्राहम की ओर संकेत करता है; फिर भी यूनानी पाठ यहाँ उसका नाम नहीं लेता। अतः मुख्य पाठ स्रोत की अभिव्यक्ति को बनाए रखता है और सम्भावित पहचान पादटिप्पणी में बताता है।
- issue: संतान के प्रति ममता और दृढ़ता का सम्बन्ध
  choice: ‘गहरी ममता के बावजूद उसे दृढ़ बनाए रखा’
  alternative: ‘अपनी संतान के विषय में उसे सामर्थी बनाए रखा’ अथवा ‘अपनी संतान के प्रति उसकी ममता के विरुद्ध उसे दृढ़ रखा’।
  rationale: वाक्य अब्राहम की परीक्षा जैसी घटना और पितृ-स्नेह के वास्तविक तनाव को जगाता है, पर यूनानी पाठ बलिदान या घटना का स्पष्ट वर्णन नहीं करता। चुना गया रूप तनाव सुरक्षित रखता है, उसे अनावश्यक रूप से नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जातियाँ’, ‘धर्मी मनुष्य’, ‘परमेश्वर के सामने’ और ‘संतान’ जैसे शब्द शास्त्रीय प्रसंग को बनाए रखते हुए अनावश्यक रूप से संस्कृतनिष्ठ नहीं हैं।
