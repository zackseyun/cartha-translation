  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज बाइबलीय गद्य अपनाया गया है। 'धर्मी पुरुष', 'परमेश्वर का राज्य' और 'सीधे मार्ग' जैसे पद स्रोत की औपचारिकता और रूपक को रखते हैं, जबकि कठिन यूनानी अस्पष्टताओं को पादटिप्पणियों में खुला रखा गया है।
