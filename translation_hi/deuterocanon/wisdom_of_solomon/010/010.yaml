base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: hi
  text: बुद्धि ने उस धर्मी पुरुष की, जो अपने भाई के क्रोध से भागा हुआ था, सीधे मार्गों पर अगुवाई की; उसने उसे परमेश्वर का राज्य दिखाया और पवित्र बातों का ज्ञान दिया[a]; उसने उसके कठिन परिश्रम में उसे सफल बनाया और उसके परिश्रम के फलों को बढ़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जनों का ज्ञान।” यूनानी पद पवित्र बातों अथवा पवित्र व्यक्तियों या प्राणियों—दोनों का बोध करा सकता है।
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप में, “उसके श्रमों/कष्टों को बढ़ाया।” यहाँ प्रसंग के अनुसार आशय संभवतः उसके श्रम से मिलने वाली उपज या लाभ बढ़ाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: उसने
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम निकटवर्ती संदर्भ में व्यक्तिरूपित बुद्धि की ओर संकेत करता है; हिन्दी में क्रिया के स्त्रीलिंग रूप से यह संबंध स्वाभाविक रूप से बना रहता है।
- source_word: φυγάδα ὀργῆς ἀδελφοῦ
  choice: जो अपने भाई के क्रोध से भागा हुआ था
  rationale: φυγάδα भागे हुए व्यक्ति अथवा निर्वासित का बोध कराता है, और संबंधकारक पद उसके भागने के कारण या स्रोत को बताता है।
- source_word: δίκαιον
  choice: उस धर्मी पुरुष को
  rationale: यह विशेषण पुल्लिंग एकवचन में संज्ञा के रूप में प्रयुक्त है और संभवतः याकूब को सूचित करता है; 'धर्मी पुरुष' रूप और आशय दोनों को स्पष्ट रखता है।
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: सीधे मार्गों पर चलाया
  rationale: यह मार्गदर्शन और सीधे पथ की बाइबलीय उपमा को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: βασιλείαν θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह यूनानी पद का सीधा, स्थापित और अर्थपूर्ण हिन्दी अनुवाद है।
- source_word: γνῶσιν ἁγίων
  choice: पवित्र बातों का ज्ञान
  rationale: ἁγίων पवित्र वस्तुओं/बातों अथवा पवित्र जनों/प्राणियों की ओर संकेत कर सकता है। मुख्य पाठ में प्रसंगानुकूल नपुंसकलिंग अर्थ लिया गया है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: उसके कठिन परिश्रम में उसे सफल किया
  rationale: εὐπορέω समृद्ध या सफल करने का अर्थ देता है, जबकि μόχθοις कठिन श्रम को सूचित करता है; यह अनुवाद दोनों तत्वों को स्पष्ट रखता है।
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: उसके परिश्रम के फलों को बढ़ाया
  rationale: शाब्दिक रूप से पद उसके श्रमों या कष्टों को बढ़ाने की बात कह सकता है, पर हितकारी प्रसंग में श्रम से प्राप्त उपज या लाभ अभिप्रेत हो सकता है। मुख्य पाठ में प्रसंगानुकूल अर्थ और पादटिप्पणी में शाब्दिक विकल्प सुरक्षित है।
theological_decisions:
- issue: व्यक्तिरूपित स्त्रीलिंग कर्ता का संदर्भ
  choice: स्त्रीलिंग क्रिया के द्वारा व्यक्तिरूपित बुद्धि की ओर संकेत
  alternative: इस पद में 'बुद्धि' को स्पष्ट रूप से दोहराना
  rationale: यूनानी αὕτη पिछले संदर्भ की बुद्धि की ओर संकेत करता है; संज्ञा जोड़े बिना स्त्रीलिंग रूप साहित्यिक व्यक्तिकरण को बनाए रखता है।
- issue: γνῶσιν ἁγίων का अर्थ
  choice: पवित्र बातों का ज्ञान
  alternative: पवित्र जनों या पवित्र प्राणियों का ज्ञान
  rationale: व्याकरणिक रूप दोनों अर्थों की अनुमति देता है। प्रकाशन और ईश्वरीय राज्य के प्रसंग में पवित्र बातों का अर्थ उपयुक्त है, किंतु वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: τοὺς πόνους αὐτοῦ का हितकारी प्रसंग में अर्थ
  choice: उसके परिश्रम के फलों को बढ़ाया
  alternative: उसके श्रमों/कष्टों को बढ़ाया
  rationale: मूल शब्द श्रम, कष्ट या उनसे जुड़ी प्राप्ति का बोध करा सकता है। पद की लगातार हितकारी दिशा फल या उपज के अर्थ का समर्थन करती है, पर अधिक शाब्दिक तनाव पादटिप्पणी में दिया गया है।
