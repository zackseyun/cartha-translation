  choice: स्मारक के रूप में खड़ा नमक का खंभा
  rationale: ἑστηκυῖα की स्थायी खड़ी अवस्था और μνημεῖον के स्मरण-चिह्न के भाव, दोनों सुरक्षित हैं।
