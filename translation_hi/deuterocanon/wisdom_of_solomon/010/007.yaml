translation:
  language: hi
  text: उसकी दुष्टता की गवाही आज भी धुआँ देती हुई उजाड़ भूमि, फल देने वाले ऐसे पौधे जिनके फल पक नहीं पाते, और एक अविश्वासी आत्मा के स्मारक के रूप में खड़ा नमक का स्तंभ[a] देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नमक का स्तंभ” उत्पत्ति 19:26 में लूत की पत्नी की ओर संकेत करता है, यद्यपि इस पद में उसका नाम स्पष्ट रूप से नहीं दिया गया है। “अविश्वासी” का अनुवाद “विश्वास न करने वाली” भी हो सकता है।
    reason: cross_reference और lexical_alternative
