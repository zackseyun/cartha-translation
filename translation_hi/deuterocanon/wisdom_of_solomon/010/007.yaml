  rationale: वाक्यांश पाठगत रूप से कठिन है; संदर्भ में फल के पूर्ण परिपक्वता तक न पहुँचने का अर्थ सबसे स्वाभाविक है। ὥρας को अलग से ‘ऋतु में’ कहना यहाँ अनिश्चित और संभवतः भ्रामक होता।
