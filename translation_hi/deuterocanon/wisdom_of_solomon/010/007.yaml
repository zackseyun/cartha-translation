  rationale: ἀπιστούσης में विश्वास न करने और विश्वासयोग्य न रहने, दोनों की अर्थ-छाया संभव है; मुख्य पाठ में निकटतम औपचारिक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
