base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: hi
  text: क्योंकि सब वस्तुओं की शिल्पकार बुद्धि ने मुझे शिक्षा दी। उसमें एक ऐसी आत्मा है जो बुद्धिसंपन्न, पवित्र, अद्वितीय[a], बहुरूपी, सूक्ष्म, चपल, स्पष्ट, निष्कलंक, सुस्पष्ट, हानि से अछूती[b], भलाई से प्रेम रखने वाली, तीक्ष्ण, निर्बाध और हितकारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने प्रकार की एकमात्र’; परंपरागत रूप से ‘एकमात्र उत्पन्न’ भी। यहाँ प्रसंग में ‘अद्वितीय’ अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हानि न पहुँचाने वाली’; यूनानी शब्द का अर्थ हानि से अछूता होना या हानि न पहुँचाना—दोनों हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: τεχνῖτις
  choice: शिल्पकार
  rationale: यह स्त्रीलिंग संज्ञा किसी कला या शिल्प में निपुण कर्ता को दर्शाती है। ‘सब वस्तुओं की शिल्पकार बुद्धि’ मूल में बुद्धि के स्त्री-व्यक्तिकरण और कुशल कारीगर के भाव को यथासंभव बनाए रखता है।
- source_word: πνεῦμα νοερόν
  choice: बुद्धिसंपन्न आत्मा
  rationale: πνεῦμα यहाँ हवा या श्वास नहीं, बल्कि बुद्धि में विद्यमान चेतन और बौद्धिक वास्तविकता है; νοερόν उसकी समझने-विचारने की क्षमता व्यक्त करता है।
- source_word: μονογενές
  choice: अद्वितीय
  rationale: यहाँ शब्द किसी पुत्र-संबंध को नहीं, ‘अपने प्रकार की एकमात्र’ अथवा अनोखी होने को व्यक्त करता है। धार्मिक रूप से परिचित वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πολυμερές
  choice: बहुरूपी
  rationale: यह अनेक पक्षों या रूपों वाला होने का भाव देता है और गुणों की इस सूची में सहज हिन्दी है।
- source_word: λεπτόν
  choice: सूक्ष्म
  rationale: यह स्थूलता के विपरीत बारीकी और सूक्ष्म प्रवेश-क्षमता का भाव रखता है, दुर्बलता का नहीं।
- source_word: εὐκίνητον
  choice: चपल
  rationale: शब्द का मूल भाव आसानी और तत्परता से गतिशील होना है।
- source_word: τρανόν
  choice: स्पष्ट
  rationale: यह साफ़ और प्रत्यक्ष होने का भाव देता है। निकटार्थी σαφές से अंतर बनाए रखने के लिए उसके लिए ‘सुस्पष्ट’ चुना गया है।
- source_word: ἀμόλυντον
  choice: निष्कलंक
  rationale: यह दूषण या कलंक से मुक्त होने के नैतिक और शुद्धतासंबंधी भाव को सुरक्षित रखता है।
- source_word: σαφές
  choice: सुस्पष्ट
  rationale: यह स्पष्ट और असंदिग्ध होने का अर्थ देता है; ‘सुस्पष्ट’ निकटवर्ती τρανόν के साथ अर्थगत सामीप्य रखते हुए शब्दगत भेद भी बनाए रखता है।
- source_word: ἀπήμαντον
  choice: हानि से अछूती
  rationale: यूनानी शब्द का निष्क्रिय अर्थ हानि से अप्रभावित या अक्षत होना हो सकता है। दूसरा संभव अर्थ ‘हानि न पहुँचाने वाली’ पादटिप्पणी में दिया गया है।
- source_word: φιλάγαθον
  choice: भलाई से प्रेम रखने वाली
  rationale: यह संयुक्त विशेषण भले या अच्छे से प्रेम करने का भाव स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀκώλυτον
  choice: निर्बाध
  rationale: यह रोके न जा सकने अथवा किसी बाधा से मुक्त होने को व्यक्त करता है।
- source_word: εὐεργετικόν
  choice: हितकारी
  rationale: यह भलाई करने और लाभ पहुँचाने वाले स्वभाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: बुद्धि में स्थित आत्मा के लिए μονογενές का अनुवाद
  choice: अद्वितीय
  alternative: एकलौता उत्पन्न / अपने प्रकार की एकमात्र
  rationale: इस प्रसंग में μονογενές पुत्र-संबंध नहीं बताता, बल्कि आत्मा के अद्वितीय होने का गुण है। इसलिए मुख्य पाठ में गैर-पुत्रात्मक अर्थ रखा गया है, जबकि पारंपरिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἀπήμαντον का कर्तृवाचक या कर्मवाचक अर्थ
  choice: हानि से अछूती
  alternative: हानि न पहुँचाने वाली
  rationale: शब्द दोनों अर्थों की अनुमति देता है। मुख्य पाठ उसके हानि से अप्रभावित रहने के भाव को अपनाता है, पर वास्तविक अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
