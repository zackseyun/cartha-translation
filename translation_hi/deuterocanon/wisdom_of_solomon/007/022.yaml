  register: आधुनिक मानक हिन्दी का गरिमामय किंतु सुबोध स्तर रखा गया है। बुद्धि के स्त्री-व्यक्तिकरण को ‘शिल्पकार बुद्धि’ और आत्मा के स्त्रीलिंग विशेषणों द्वारा बनाए रखा गया है। गुणों की लंबी यूनानी सूची को स्वाभाविक हिन्दी वाक्य में रखा गया है, बिना किसी गुण को हटाए।
