lexical_decisions:
- source_word: ὅσα
  choice: जो कुछ … वह सब
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τε
  choice: और … और
  rationale: κρυπτὰ और ἐμφανῆ की युग्मात्मक संगति को हिन्दी की स्वाभाविक समांतर रचना से प्रकट करता है।
- source_word: κρυπτὰ
  choice: जो कुछ छिपा है
  rationale: κρυπτός का व्यापक अर्थ ‘छिपा हुआ’ है; ‘गुप्त’ जानबूझकर गोपनीय रखे जाने का अतिरिक्त भाव ला सकता है।
- source_word: ἐμφανῆ
  choice: जो प्रकट है
  rationale: ἐμφανής के ‘दिखाई देने वाला, स्पष्ट या प्रत्यक्ष’ अर्थ को dignified और सहज हिन्दी में व्यक्त करता है तथा ‘छिपा’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἔγνων
  choice: मैंने जान लिया
  rationale: γινώσκω के अओरिस्ट में यहाँ ज्ञान प्राप्त करने का भाव हो सकता है; ‘जान लिया’ उस उपलब्धिपरक पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
