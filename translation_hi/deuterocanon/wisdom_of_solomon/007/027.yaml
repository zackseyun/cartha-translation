  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आत्माओं’ और ‘भविष्यद्वक्ता’ जैसे शब्द मूल के ज्ञान-साहित्यिक तथा बाइबलीय स्तर को बनाए रखते हैं। यूनानी की लम्बी वाक्य-रचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
