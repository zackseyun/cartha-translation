  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: hi
  text: यद्यपि वह एक है, फिर भी वह सब कुछ कर सकती है; और अपने आप में स्थित रहते हुए वह सब कुछ नया करती है। पीढ़ी-दर-पीढ़ी पवित्र जनों की आत्माओं में प्रवेश करती हुई, वह उन्हें परमेश्वर के मित्र और भविष्यद्वक्ता बनाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सब कुछ नया करती है” का अनुवाद “सब कुछ नवीकृत करती है” भी हो सकता है। यूनानी क्रिया में नया करने और नवीकृत करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  choice: एक ही
  rationale: बुद्धि की एकता और एकत्व को संक्षेप में रखता है; ‘अकेली’ कहने से अनावश्यक विशिष्टता जुड़ सकती थी।
