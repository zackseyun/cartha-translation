  rationale: व्यापक सामर्थ्य को स्वाभाविक और सीधी हिन्दी में व्यक्त करता है।
- source_word: μένουσα ἐν αὐτῇ
  choice: अपने में बनी रहकर
  rationale: स्त्रीलिंग व्यक्तिरूप बुद्धि के लिए αὐτῇ को आत्मवाचक समझते हुए उसके अपने स्वरूप में स्थिर रहने का भाव सुरक्षित रखता है।
- source_word: τὰ πάντα καινίζει
  choice: सब कुछ नया कर देती है
  rationale: καινίζει में नया करने और नवीकृत करने दोनों का अर्थ संभव है; मुख्य पाठ में सहज हिन्दी चुनी गई है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: κατὰ γενεὰς
  choice: पीढ़ी-दर-पीढ़ी
  rationale: लगातार आने वाली पीढ़ियों में दोहराई जाने वाली क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: पवित्र आत्माओं में प्रवेश करके
  rationale: μεταβαίνουσα की गतिशीलता और ψυχὰς के स्पष्ट ‘आत्माओं’ अर्थ को बनाए रखता है।
- source_word: φίλους θεοῦ
  choice: परमेश्वर के मित्र
  rationale: सम्बन्धवाचक यूनानी पद का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: προφήτας
  choice: भविष्यद्वक्ता
  rationale: प्रचलित बाइबलीय हिन्दी शब्द।
- source_word: κατασκευάζει
  choice: बनाती है
  rationale: सन्दर्भ में पवित्र आत्माओं को परमेश्वर के मित्र और भविष्यद्वक्ता बनाने या गढ़ने का परिणाम व्यक्त करता है; ‘तैयार करती है’ सम्भव है, पर लक्ष्य-परिवर्तन को कुछ कम स्पष्ट करता है।
theological_decisions:
- issue: पूरे पद में स्त्रीलिंग व्यक्तिरूप विषय
  choice: बुद्धि के लिए ‘वह’ और स्त्रीलिंग क्रियाओं का प्रयोग
  alternative: हर बार ‘बुद्धि’ दोहराना या निर्वैयक्तिक अनुवाद करना
  rationale: यूनानी व्याकरण बुद्धि को स्पष्टतः स्त्रीलिंग एकवचन में व्यक्तिरूप देता है; हिन्दी में स्त्रीलिंग क्रियाएँ इस साहित्यिक और धर्मवैचारिक स्वर को सुरक्षित रखती हैं।
- issue: ψυχὰς ὁσίας का अर्थ
  choice: पवित्र आत्माएँ
  alternative: पवित्र जन या पवित्र व्यक्ति
  rationale: मूल में ψυχαί स्पष्ट है; ‘व्यक्ति’ कहने से मूल का मानव-विज्ञान सम्बन्धी और ज्ञान-साहित्यिक स्वर समतल हो जाता।
- issue: κατασκευάζει का परिणाम
  choice: उन्हें परमेश्वर के मित्र और भविष्यद्वक्ता बनाती है
  alternative: परमेश्वर के मित्रों और भविष्यद्वक्ताओं को तैयार करती है
  rationale: ‘उन्हें’ स्पष्ट करता है कि पूर्वोक्त पवित्र आत्माएँ ही इस क्रिया का लक्ष्य हैं, जबकि क्रिया के निर्माण/तैयार करने के अर्थ-क्षेत्र को ‘बनाती है’ स्वाभाविक हिन्दी में व्यक्त करता है।
