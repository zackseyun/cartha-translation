lexical_decisions:
- source_word: ἀνεκλιπὴς ... θησαυρός
  choice: कभी न चुकने वाला खजाना
  rationale: यह अभिव्यक्ति खजाने की अक्षयता और निरंतर उपलब्धता को सहज आधुनिक हिन्दी में व्यक्त करती है।
