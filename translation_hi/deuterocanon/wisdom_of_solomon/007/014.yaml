  text: क्योंकि वह मनुष्यों के लिए कभी न चुकने वाला खजाना है; जिन्होंने उसका उपयोग किया, उन्होंने परमेश्वर के साथ मित्रता प्राप्त की, शिक्षा से मिलने वाले वरदानों के द्वारा प्रशंसित ठहरकर।
