theological_decisions:
- issue: बुद्धि के उपयोग और परमेश्वर की मित्रता के बीच संबंध
  choice: “प्राप्त करते हैं” द्वारा मूल कथन का संबंध बनाए रखा गया
  alternative: “कमा लेते हैं” या “परमेश्वर के मित्र बन जाते हैं”
  rationale: मूल पाठ मित्रता पाने की बात कहता है, पर उसके धार्मिक तंत्र या योग्यता-आधारित कारण को विस्तार से परिभाषित नहीं करता; इसलिए अधिक निर्णायक भाषा से बचा गया।
- issue: παιδεία का अर्थ-क्षेत्र
  choice: मुख्य पाठ में “शिक्षा”
  alternative: “अनुशासन” या “प्रशिक्षण”
  rationale: शब्द शिक्षा, संस्कार, प्रशिक्षण और अनुशासन को समेट सकता है। सन्दर्भ में 'शिक्षा' सबसे व्यापक और स्वाभाविक विकल्प है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: συσταθέντες का आशय
  choice: “प्रशंसित होते हैं”
  alternative: “स्वीकृत ठहरते हैं” या “अनुमोदित होते हैं”
  rationale: यूनानी में प्रशंसा/अनुमोदन का भाव संभव है और यह स्पष्ट नहीं कि अनुमोदन करने वाला व्याकरणतः कौन है; हिन्दी में कर्ता न जोड़कर इस खुलापन को रखा गया है।
