lexical_decisions:
- source_word: προέκρινα
  choice: मैंने ... से बढ़कर चुना
  rationale: क्रिया किसी वस्तु को दूसरी वस्तुओं से अधिक वरीयता देने का भाव व्यक्त करती है; यह हिंदी प्रयोग चयन और तुलनात्मक प्राथमिकता दोनों को बनाए रखता है।
- source_word: αὐτὴν
  choice: उसे / उसकी
  rationale: सर्वनाम का संकेत स्त्रीलिंग ‘बुद्धि’ की ओर है। हिंदी में ‘उसे’ और ‘उसकी’ स्वाभाविक रूप से इस संदर्भ को बनाए रखते हैं।
- source_word: σκήπτρων
  choice: राजदंडों
  rationale: यह राजकीय अधिकार के मूर्त प्रतीक को दर्शाता है; ‘राजदंड’ मूल बिंब को सुरक्षित रखता है।
- source_word: θρόνων
  choice: सिंहासनों
  rationale: शब्द का प्रत्यक्ष अर्थ सिंहासन है और यहाँ शासन-सत्ता का भी संकेत देता है; मूर्त समानांतर बिंब बनाए रखा गया है।
- source_word: πλοῦτον
  choice: धन
  rationale: यह भौतिक संपत्ति या वैभव को दर्शाता है; ‘धन’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: οὐδὲν ἡγησάμην
  choice: कुछ भी नहीं समझा
  rationale: यह मूल्यांकन व्यक्त करता है कि तुलना में धन का कोई मूल्य नहीं माना गया; हिंदी वाक्यांश अर्थ को सहजता से व्यक्त करता है।
- source_word: ἐν συγκρίσει αὐτῆς
  choice: उसकी तुलना में
  rationale: यह तुलना का स्पष्ट मानदंड बताता है और यूनानी संरचना की तुलनात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: बुद्धि का स्त्रीरूप में मानवीकरण
  choice: ‘उसे/उसकी’ द्वारा स्त्रीलिंग संदर्भ बनाए रखा गया।
  alternative: बुद्धि को निर्जीव अमूर्त वस्तु की तरह व्यक्त करना।
  rationale: यूनानी पाठ में σοφία व्याकरणतः स्त्रीलिंग है और प्रसंग में बुद्धि का मानवीकरण किया गया है। हिंदी सर्वनाम स्रोत की साहित्यिक-धर्मवैचारिक प्रस्तुति को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखते हैं।
