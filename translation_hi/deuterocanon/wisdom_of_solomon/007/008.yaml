  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राजदंड’ और ‘सिंहासन’ जैसे ठोस राजकीय बिंबों को अमूर्त ‘सत्ता’ या ‘राज्य’ में नहीं बदला गया।
