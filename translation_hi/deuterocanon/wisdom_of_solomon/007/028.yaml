    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν
  choice: किसी से ... नहीं
  rationale: यूनानी में शाब्दिक अर्थ ‘कुछ भी नहीं’ है, पर अपवाद एक व्यक्ति को सूचित करता है। हिन्दी में ‘किसी से ... नहीं’ इस वाक्य को स्वाभाविक रखते हुए निषेध की व्यापकता व्यक्त करता है।
- source_word: ἀγαπᾷ
  choice: प्रेम करता
  rationale: यह ἀγαπάω का सीधा, सामान्य और धर्मवैचारिक भार को बनाए रखनेवाला हिन्दी रूप है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यहाँ पदबंध शर्त नहीं, बल्कि अपवाद प्रस्तुत करता है; ‘के सिवा’ हिन्दी में इस अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν ... συνοικοῦντα
  choice: के साथ निवास करनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जिसकी संगति निरंतर है। ‘निवास करनेवाले’ συνοικέω में निहित साथ रहने के स्थायी और संबंधपरक भाव को सुरक्षित रखता है।
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: सम्प्रदान कारक यहाँ संगति का भाव देता है। आसपास के प्रसंग में बुद्धि का प्रबल मानवीकरण है, फिर भी यूनानी लिपि स्वयं सामान्य गुण और व्यक्तिरूप बुद्धि के बीच भेद को निर्णायक रूप से चिह्नित नहीं करती।
theological_decisions:
- issue: क्या σοφία को स्पष्ट रूप से व्यक्तिरूप ‘बुद्धि’ मानकर अनुवाद किया जाए
  choice: मुख्य पाठ में ‘बुद्धि’ रखकर अर्थ की खुली गुंजाइश बनाए रखना
  alternative: इसे स्पष्ट रूप से एक व्यक्तिरूप पात्र, जैसे ‘बुद्धि देवी’ या ‘श्रीमती बुद्धि’, के रूप में प्रस्तुत करना
  rationale: अध्याय में बुद्धि का प्रबल मानवीकरण है, पर मूल पद ऐसा कोई अतिरिक्त पद या नाम नहीं देता जो व्यक्तित्व को निर्णायक बना दे। इसलिए मुख्य पाठ सामान्य अर्थ और व्यक्तिरूप संकेत—दोनों को सुनने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘निवास करनेवाले’ मूल क्रिया के साथ रहने और स्थायी संगति के भाव को ‘रहनेवाले’ की अपेक्षा थोड़ा अधिक स्पष्ट रखता है।
