  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: hi
  text: मैंने उसके बराबर किसी बहुमूल्य रत्न[a] को भी नहीं माना, क्योंकि उसके सामने सारा सोना थोड़ी-सी रेत[b] है, और चाँदी उसके आगे मिट्टी समझी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनमोल रत्न’। यूनानी अभिव्यक्ति ऐसे रत्न को दर्शाती है जिसका मूल्य आँका नहीं जा सकता।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘थोड़ी-सी रेत’; आशय यह है कि बुद्धि की तुलना में सोने का मूल्य नगण्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: मैंने उसके बराबर ... को भी नहीं माना
  rationale: ὁμοιόω के तुलना/समान ठहराने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और αὐτῇ के स्त्रीलिंग व्यक्तिकरण को बनाए रखता है।
- source_word: λίθον ἀτίμητον
  choice: किसी बहुमूल्य रत्न
  rationale: ἀτίμητος यहाँ मूल्यहीन नहीं, बल्कि जिसका मूल्य आँका न जा सके ऐसा अत्यन्त मूल्यवान पत्थर है; ‘बहुमूल्य रत्न’ प्रसंगानुकूल और सहज है।
- source_word: ὁ πᾶς χρυσός
  choice: सारा सोना
  rationale: यूनानी सामूहिक और सर्वसमावेशी अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
- source_word: ἐν ὄψει αὐτῆς
  choice: उसके सामने
  rationale: शाब्दिक उपस्थिति-दृश्य को बनाए रखते हुए तुलना का भाव सहजता से देता है।
- source_word: ψάμμος ὀλίγη
  choice: थोड़ी-सी रेत
  rationale: मूल के ‘थोड़ी रेत’ वाले चित्र को सुरक्षित रखता है; यहाँ अल्पता नगण्य मूल्य भी सूचित करती है।
- source_word: λογισθήσεται
  choice: समझी जाएगी
  rationale: भविष्यत् कर्मवाच्य के मूल्यांकनात्मक अर्थ को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πηλός
  choice: मिट्टी
  rationale: πηλός के लिए सामान्य, स्वाभाविक हिन्दी; मूल्यवान चाँदी के विपरीत तुच्छ पदार्थ का चित्र स्पष्ट रहता है।
- source_word: ἄργυρος
  choice: चाँदी
  rationale: सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: ἐναντίον αὐτῆς
  choice: उसके आगे
  rationale: व्यक्तिकृत बुद्धि के सामने तुलना का स्थानिक चित्र बनाए रखता है और निकटवर्ती ‘उसके सामने’ की अनावश्यक पुनरावृत्ति घटाता है।
theological_decisions:
- issue: बुद्धि का स्त्रीलिंग व्यक्तिकरण
  choice: ‘उसके’ द्वारा स्त्रीलिंग व्यक्तिकरण बनाए रखा
  alternative: हर बार ‘बुद्धि’ दोहराना या उसे निर्जीव भाव से प्रस्तुत करना
  rationale: प्रसंग में σοφία और उससे जुड़े सर्वनाम स्त्रीलिंग हैं। हिन्दी में ‘बुद्धि’ भी स्त्रीलिंग है, इसलिए यह साहित्यिक व्यक्तिकरण बिना अतिरिक्त सिद्धान्त आरोपित किए स्वाभाविक रूप से सुरक्षित रहता है।
