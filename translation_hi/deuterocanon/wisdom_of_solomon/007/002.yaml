    text: यूनानी में, ‘दस महीने’; यह गर्भावस्था की प्राचीन गणना को दर्शाता है, सम्भवतः चन्द्र-मासों के अनुसार।
    reason: cultural_note
  - marker: b
    text: या, ‘रक्त में जमाया गया।’ यूनानी शब्द में जमने अथवा आकार पाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: दस महीने की अवधि में
  rationale: यह कालवाचक पद गर्भावस्था की अवधि बताता है। अनुवाद प्राचीन दस-महीने की गणना को मुख्य पाठ में बिना समझाए स्वाभाविक हिन्दी में रखता है।
- source_word: παγεὶς
  choice: रचा गया
  rationale: πήγνυμι से निकला यह कृदन्त जमने, दृढ़ होने या आकार पाने का भाव दे सकता है। भ्रूण के संदर्भ में ‘रचा गया’ सहज है और गठन का भाव देता है, जबकि वैकल्पिक ‘जमाया गया’ पादटिप्पणी में सुरक्षित है।
- source_word: ἐν αἵματι
  choice: रक्त में
  rationale: ἐν का सीधा अर्थ ‘में’ रखकर गर्भधारण से जुड़ी ठोस शारीरिक छवि सुरक्षित रखी गई है।
- source_word: ἐκ σπέρματος ἀνδρός
  choice: पुरुष के बीज से
  rationale: σπέρμα यहाँ प्रजननकारी बीज को दर्शाता है। ‘पुरुष का बीज’ आधुनिक हिन्दी में गरिमापूर्ण और पर्याप्त रूप से शाब्दिक है, तथा अनावश्यक चिकित्सकीय शब्दावली से बचता है।
- source_word: ἡδονῆς ὕπνῳ συνελθούσης
  choice: शयन के साथ मिले सुख से
  rationale: यह संक्षिप्त यूनानी अभिव्यक्ति यौन-संबंध के लिए संयत संकेत है। ‘शयन के साथ मिले सुख’ सुख, साथ आने और शयन—तीनों भावों को अश्लील या अत्यधिक स्पष्ट हुए बिना व्यक्त करता है।
theological_decisions:
- issue: सामान्य मानवीय गर्भधारण और जन्म पर बल
  choice: पद को सामान्य मानवीय गर्भावस्था और गर्भधारण का वर्णन करने दिया गया है, बिना आधुनिक जैविक सटीकता आरोपित किए।
  alternative: ‘रक्त में जमाया गया’ जैसा अधिक शाब्दिक प्राचीन भ्रूण-विज्ञानपरक रूप, या यौन-संबंध को सीधे नाम देने वाला अधिक स्पष्ट रूप।
  rationale: प्रसंग वक्ता की अन्य मनुष्यों जैसी उत्पत्ति पर बल देता है। अनुवाद इस आशय और मूल की संयत भाषा को बनाए रखता है, पर किसी बाद की जैविक या सम्प्रदायगत व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘शयन’ मूल के शिष्ट संकेतात्मक ढंग को बनाए रखता है; ‘रक्त में रचा गया’ प्राचीन शारीरिक बिंब को सुरक्षित रखते हुए अस्वाभाविक चिकित्सकीय भाषा से बचता है।
