  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: hi
  text: इसलिए मैंने प्रार्थना की, और मुझे समझ दी गई; मैंने पुकारा[a], और बुद्धि की आत्मा[b] मेरे पास आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने [परमेश्वर को] पुकारा” अथवा “मैंने आह्वान किया।” यूनानी पाठ यह स्पष्ट नहीं करता कि किसे पुकारा गया।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ सामान्य रूप से “बुद्धि की एक आत्मा” या अधिक विशिष्ट रूप से “वह बुद्धि की आत्मा” समझा जा सकता है। यूनानी में उपपद न होने के कारण मुख्य पाठ इसे औपचारिक उपाधि नहीं बनाता।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह स्वाभाविक निष्कर्षसूचक पद है और पिछले प्रसंग से कारणात्मक संबंध बनाए रखता है।
- source_word: ηὐξάμην
  choice: मैंने प्रार्थना की
  rationale: εὔχομαι के प्रार्थनापरक अर्थ को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φρόνησις
  choice: समझ
  rationale: यह व्यावहारिक सूझ-बूझ या विवेक का भाव देता है और आगे आए σοφία के लिए प्रयुक्त ‘बुद्धि’ से शब्दगत भेद बनाए रखता है।
- source_word: ἐδόθη μοι
  choice: मुझे ... दी गई
  rationale: कर्मवाच्य रचना यह स्पष्ट करती है कि समझ स्वयं अर्जित नहीं हुई, बल्कि दी गई।
- source_word: ἐπεκαλεσάμην
  choice: मैंने पुकारा
  rationale: यह आह्वान या विनती का भाव रखता है, पर यूनानी में न दिए गए कर्म—जैसे ‘परमेश्वर को’—को मुख्य पाठ में नहीं जोड़ता।
- source_word: πνεῦμα σοφίας
  choice: बुद्धि की आत्मा
  rationale: संबंधकारक रचना को बनाए रखता है और इसे केवल मनोवैज्ञानिक प्रवृत्ति अथवा निश्चित औपचारिक उपाधि मान लेने से बचता है।
- source_word: ἦλθέν μοι
  choice: मेरे पास आई
  rationale: गति-सूचक क्रिया और संप्रदान कारक का सीधा, स्वाभाविक अनुवाद है; ‘मुझ पर उतरी’ जैसे अधिक विशिष्ट आध्यात्मिक अर्थ को नहीं जोड़ता।
