- issue: ἐπεκαλεσάμην का निहित कर्म
  choice: मैंने पुकारा
  alternative: मैंने परमेश्वर को पुकारा
  rationale: संदर्भ प्रार्थनापरक आह्वान का संकेत देता है, किंतु यूनानी पाठ कर्म को स्पष्ट रूप से नहीं कहता; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
