  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: hi
  text: क्योंकि वह परमेश्वर की सामर्थ्य की श्वास[a] है, और सर्वशक्तिमान की महिमा से निकलने वाला निर्मल प्रवाह[b] है; इसलिए कोई भी दूषित वस्तु उसमें प्रवेश नहीं करती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वाष्प’ अथवा ‘उच्छ्वास’। यूनानी शब्द (ἀτμίς) किसी स्रोत से निकलती श्वास या उठती वाष्प, दोनों का बिंब दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सर्वशक्तिमान की महिमा का निर्मल निःसरण’। यूनानी शब्द उस निर्मल वस्तु का बिंब देता है जो अपने स्रोत से बहकर या निकलकर आती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμίς
  choice: श्वास
  rationale: यह शब्द श्वास, उच्छ्वास या वाष्प का बिंब दे सकता है। ‘श्वास’ स्रोत से निकलने और उससे घनिष्ठ संबंध रखने के बिंब को सहज हिन्दी में बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: δυνάμεως
  choice: सामर्थ्य
  rationale: ‘सामर्थ्य’ परमेश्वर की शक्ति के अर्थ को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπόρροια
  choice: निकला ... प्रवाह
  rationale: यह शब्द किसी स्रोत से बहकर या निकलकर आने वाली वस्तु को दर्शाता है। ‘निकला ... प्रवाह’ इस संबंध को तकनीकी दार्शनिक शब्दावली के बिना स्पष्ट रखता है।
- source_word: εἰλικρινής
  choice: निर्मल
  rationale: यहाँ अर्थ अमिश्रित, स्वच्छ और दूषणरहित होने का है। ‘निर्मल’ अगले कथन के दूषण-विरोध से भी स्वाभाविक रूप से जुड़ता है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह प्रचलित ईश्वरीय उपाधि यूनानी शब्द में निहित सार्वभौम सामर्थ्य और प्रभुता को व्यक्त करती है।
- source_word: μεμιαμμένον
  choice: दूषित वस्तु
  rationale: पूर्ण कृदंत दूषित अवस्था में पड़ी किसी भी वस्तु की ओर संकेत करता है। ‘दूषित’ नैतिक, धार्मिक और सामान्य अशुद्धि के व्यापक अर्थ को खुला रखता है।
- source_word: παρεμπίπτει
  choice: प्रवेश नहीं करती
  rationale: मूल क्रिया का शाब्दिक बिंब भीतर आ पड़ने का है; इस प्रसंग में ‘प्रवेश करना’ सहज हिन्दी में किसी दूषित वस्तु के बुद्धि तक पहुँच न पाने का भाव देता है।
theological_decisions:
- issue: बुद्धि का स्त्रीरूप में मानवीकरण
  choice: ‘वह’ और ‘उसमें’ के द्वारा संदर्भ बनाए रखा गया
  alternative: हर बार ‘बुद्धि’ दोहराना या निर्जीव भाव में व्याख्यात्मक अनुवाद करना
  rationale: यूनानी में स्त्रीलिंग सर्वनाम बुद्धि की ओर लौटता है और आस-पास का अंश उसका मानवीकरण करता है। हिन्दी सर्वनाम लिंग प्रकट नहीं करते, फिर भी संदर्भ को व्यक्ति-सदृश रखते हैं और अनावश्यक व्याख्या नहीं जोड़ते।
- issue: बुद्धि और परमेश्वर के बीच स्रोत-संबंध का बिंब
  choice: ‘परमेश्वर की सामर्थ्य की श्वास’ और ‘महिमा से निकला निर्मल प्रवाह’
  alternative: स्रोत से निकलने के बिंब को हल्का करने वाला भावानुवाद, या बाद की तात्त्विक शब्दावली
  rationale: पद स्रोत से निकास का प्रबल बिंब देता है, पर उसके आध्यात्मिक या तात्त्विक स्वरूप को व्यवस्थित सिद्धांत में नहीं बाँधता। अनुवाद उसी तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निःसरण’ जैसे तकनीकी शब्द को मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है; मुख्य पाठ में ‘निकला निर्मल प्रवाह’ मूल बिंब को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
