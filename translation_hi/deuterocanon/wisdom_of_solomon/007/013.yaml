  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: hi
  text: मैंने निष्कपट भाव से सीखा और बिना ईर्ष्या के बाँटता हूँ; मैं उसकी संपदा नहीं छिपाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδόλως
  choice: निष्कपट भाव से
  rationale: यह यूनानी क्रियाविशेषण छल या कपट के अभाव को व्यक्त करता है। यह चयन भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔμαθον
  choice: मैंने सीखा
  rationale: μανθάνω के भूतकालिक रूप का सीधा अर्थ ‘सीखा’ है; इससे प्रथम पुरुष का आत्मकथात्मक स्वर सुरक्षित रहता है।
- source_word: ἀφθόνως
  choice: बिना ईर्ष्या के
  rationale: यह शब्द ईर्ष्या, संकोच या कृपणतापूर्वक रोक रखने के अभाव को बताता है। ‘बिना ईर्ष्या के’ मूल शब्द के निकट रहते हुए बाँटने के प्रसंग में स्पष्ट है।
- source_word: μεταδίδωμι
  choice: बाँटता हूँ
  rationale: क्रिया का अर्थ किसी को हिस्सा देना या साझा करना है। ‘बाँटता हूँ’ सामान्य और सहज हिन्दी है।
- source_word: πλοῦτον
  choice: संपदा
  rationale: यहाँ धन या समृद्धि का रूपक ज्ञान की प्रचुरता के लिए है। ‘संपदा’ गरिमापूर्ण और स्वाभाविक है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: सर्वनाम स्त्रीलिंग ‘बुद्धि’ की ओर संकेत करता है। हिन्दी में ‘उसकी’ व्यक्तित्वारोपण को बनाए रखता है, यद्यपि उसका लिंग संदर्भ से समझा जाता है।
- source_word: ἀποκρύπτομαι
  choice: नहीं छिपाता
  rationale: इस रूप का यहाँ सक्रिय अर्थ ‘छिपाना’ या ‘गुप्त रखना’ है; चयन संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: αὐτῆς में बुद्धि का व्यक्तित्वारोपण
  choice: ‘उसकी संपदा’ द्वारा व्यक्तिगत संदर्भ बनाए रखना
  alternative: ‘उस संपदा को’ या ‘इसकी संपदा’ जैसा अपेक्षाकृत निर्वैयक्तिक रूप
  rationale: प्रसंग में बुद्धि स्त्रीलिंग और व्यक्तिरूप में प्रस्तुत है। ‘उसकी’ इसे सुरक्षित रखता है, पर किसी बाद की सिद्धान्तगत पहचान को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर वाक्यरचना मूल के ‘सीखा—बाँटता हूँ—नहीं छिपाता’ क्रम को बनाए रखती है।
