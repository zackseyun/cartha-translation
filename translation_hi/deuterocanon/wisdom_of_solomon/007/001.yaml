  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: hi
  text: क्योंकि मैं भी सबके समान एक मरणशील मनुष्य हूँ और धरती से उत्पन्न उस सबसे पहले गढ़े गए मनुष्य[a] का वंशज हूँ; और अपनी माता के गर्भ में मैं मांस के रूप में गढ़ा गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सबसे पहले गढ़े गए मनुष्य’ से संकेत आदम की ओर है।
    reason: cross_reference
  - marker: b
    text: या, ‘मैं देह के रूप में गढ़ा गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητός
  choice: मरणशील मनुष्य
  rationale: यह शब्द मृत्यु के अधीन होने को व्यक्त करता है। हिन्दी में संज्ञा-संदर्भ स्पष्ट रखने के लिए ‘मरणशील मनुष्य’ स्वाभाविक और सटीक है।
- source_word: ἴσος ἅπασιν
  choice: सबके समान
  rationale: यह सभी मनुष्यों के साथ समान मानवीय स्थिति पर बल देता है; ‘सबके समान’ आधुनिक हिन्दी में सहज है।
- source_word: γηγενοῦς
  choice: धरती से उत्पन्न
  rationale: यूनानी संयुक्त शब्द का शाब्दिक बिंब ‘धरती से जन्मा/उत्पन्न’ है। यह भूमि से मानव की उत्पत्ति के संकेत को बनाए रखता है।
- source_word: ἀπόγονος
  choice: वंशज
  rationale: यह किसी पूर्वज से उत्पन्न व्यक्ति को दर्शाता है; ‘वंशज’ यहाँ वंश-संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: πρωτοπλάστου
  choice: प्रथम गढ़े गए मनुष्य
  rationale: मूल में आदम का नाम नहीं, बल्कि ‘सबसे पहले गढ़े गए’ का वर्णन है। यह अनुवाद उस वर्णन और उसके संकेत दोनों को सुरक्षित रखता है।
- source_word: ἐγλύφην
  choice: ढाला गया
  rationale: क्रिया का मूल बिंब तराशने या आकार देने का है। गर्भ में देह-निर्माण के प्रसंग में ‘ढाला गया’ स्वाभाविक रहते हुए निष्क्रिय गठन का बिंब बनाए रखता है।
- source_word: σάρξ
  choice: देह
  rationale: यहाँ शब्द शाब्दिक शारीरिक अस्तित्व को दर्शाता है। ‘देह’ हिन्दी में ‘मांस’ की अपेक्षा इस प्रसंग में अधिक स्वाभाविक है और ‘शरीर’ की तुलना में मूल के flesh-संबंधी भाव के निकट रहता है।
theological_decisions:
- issue: πρωτοπλάστου का संदर्भ
  choice: मुख्य पाठ में वर्णनात्मक पद ‘प्रथम गढ़े गए मनुष्य’ रखा गया और आदम का संकेत पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में सीधे ‘आदम’ लिखना।
  rationale: यूनानी पाठ व्यक्तिवाचक नाम नहीं देता। वर्णनात्मक रूप बनाए रखने से मूल की अभिव्यक्ति और उसका अंतर्पाठीय संकेत दोनों सुरक्षित रहते हैं।
- issue: ἐγλύφην σάρξ की रचना
  choice: ‘मैं देह में ढाला गया’
  alternative: ‘मैं देह के रूप में गढ़ा गया।’
  rationale: यूनानी में σάρξ को निष्क्रिय क्रिया के साथ परिणाम अथवा अवस्था के रूप में समझा जा सकता है। मुख्य अनुवाद स्वाभाविक हिन्दी में गठन के परिणाम को व्यक्त करता है, जबकि पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्योंकि’ से पद का पूर्ववर्ती तर्क-संबंध बना रहता है; ‘धरती से उत्पन्न’ और ‘प्रथम गढ़े गए’ मूल यूनानी के सृष्टि-बिंब को बिना नाम जोड़े सुरक्षित रखते हैं।
