- source_word: ἀξίως τῶν δεδομένων
  choice: जो कुछ दिया गया है उसके योग्य
  rationale: ἀξίως योग्यता या अनुरूपता का भाव रखता है, और τῶν δεδομένων का व्यापक, अनिर्दिष्ट आशय बनाए रखा गया है।
- source_word: ὁδηγός
  choice: मार्गदर्शक
  rationale: यह उस व्यक्ति को दर्शाता है जो मार्ग दिखाता या आगे ले चलता है।
- source_word: διορθωτής
  choice: सही राह पर लानेवाला
  rationale: शब्द का मूल भाव सुधारने या सीधा करने का है; यह चयन कठोर दंड का अनावश्यक भाव जोड़े बिना सुधारात्मक दिशा को व्यक्त करता है।
- source_word: τῶν σοφῶν
  choice: बुद्धिमानों
  rationale: यह विशेषण का संज्ञार्थक बहुवचन है; हिन्दी में 'बुद्धिमानों' संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: τῶν δεδομένων का संदर्भ और दायरा
  choice: जो कुछ दिया गया है—एक खुला और व्यापक संदर्भ
  alternative: दिए गए वरदान अथवा सौंपी गई शिक्षाएँ
  rationale: यूनानी पाठ वस्तु को स्पष्ट रूप से सीमित नहीं करता। अतः अनुवाद इसे बुद्धि, उसके विषय या किसी विशिष्ट धार्मिक वरदान तक संकुचित नहीं करता।
- issue: परमेश्वर और बुद्धिमानों के संबंध में διορθωτής का बल
  choice: बुद्धिमानों को सही राह पर लानेवाला
  alternative: बुद्धिमानों को सुधारनेवाला अथवा उनका निर्देशक
  rationale: शब्द में सीधा करने और सुधारने का भाव है। चुना हुआ रूप इस तनाव को बनाए रखता है कि बुद्धिमान भी सही दिशा के लिए परमेश्वर पर निर्भर हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनापूर्ण और गरिमामय रखी गई है। 'सही समझ', 'विचार' और 'सही राह पर लानेवाला' सामान्य पाठक के लिए स्पष्ट हैं, जबकि यूनानी पाठ की व्यापकता और सुधारात्मक तनाव सुरक्षित रहता है।
