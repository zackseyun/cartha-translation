  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: hi
  text: परमेश्वर मुझे यह अनुग्रह दे कि मैं सही विवेक के साथ बोल सकूँ[a] और जो कुछ दिया गया है, उसके विषय में योग्य रीति से विचार कर सकूँ[b], क्योंकि वही बुद्धि का मार्गदर्शक और बुद्धिमानों को सुधारनेवाला है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ के अनुसार बोल सकूँ।” यूनानी वाक्यांश सही विवेक या समझ के अनुरूप बोलने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दी हुई वस्तुओं के योग्य” अथवा “दिए गए वरदानों के योग्य।” यूनानी पाठ यह स्पष्ट नहीं करता कि ठीक-ठीक क्या दिया गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “बुद्धिमानों को ठीक करनेवाला” अथवा “बुद्धिमानों का निर्देशक।” यूनानी शब्द का अर्थ सीधा करना, सुधारना, या सही दिशा देना हो सकता है।
    reason: lexical_alternative
