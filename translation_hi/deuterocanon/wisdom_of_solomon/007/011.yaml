lexical_decisions:
- source_word: ἦλθεν
  choice: मेरे पास आईं
  rationale: एकवचन यूनानी क्रिया नपुंसकलिंग बहुवचन कर्ता के साथ स्वाभाविक व्याकरणिक मेल रखती है; हिन्दी में बहुवचन ‘अच्छी वस्तुएँ’ के अनुसार ‘आईं’ स्वाभाविक है। ‘मेरे पास’ आगमन का भाव स्पष्ट करता है।
- source_word: τὰ ἀγαθὰ
  choice: अच्छी वस्तुएँ
  rationale: यह व्यापक पद लाभों, वरदानों और भौतिक वस्तुओं सभी को समेट सकता है; ‘अच्छी वस्तुएँ’ इसे केवल धन या आशीषों तक सीमित नहीं करता।
- source_word: ὁμοῦ πάντα
  choice: साथ ही सभी
  rationale: ‘सभी’ पूर्णता और ‘साथ ही’ संग-साथ आने का भाव व्यक्त करता है, बिना अनिवार्य रूप से ‘एक ही क्षण में’ का अर्थ थोपे।
- source_word: μετ’ αὐτῆς
  choice: उसके साथ ही
  rationale: स्त्रीलिंग सर्वनाम निकटवर्ती संदर्भ की व्यक्तिरूप बुद्धि की ओर संकेत करता है। हिन्दी में ‘उसके’ व्याकरणिक रूप से लिंग-निरपेक्ष दिखता है, इसलिए पादटिप्पणी संदर्भ स्पष्ट करती है।
- source_word: ἀναρίθμητος πλοῦτος
  choice: बेहिसाब धन
  rationale: यह सहज आधुनिक हिन्दी में ऐसे धन को व्यक्त करता है जिसे गिना न जा सके और यूनानी अतिशयोक्तिपूर्ण बल बनाए रखता है।
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: उसके हाथों में ... था
  rationale: मूल स्थानिक रूपक को बनाए रखता है, जो अधिकार और बुद्धि द्वारा साथ लाई गई संपदा—दोनों का संकेत दे सकता है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὐτῆς का पूर्वपद
  choice: इसे संदर्भ में स्त्री-रूप में व्यक्त की गई बुद्धि का संकेत माना गया है।
  alternative: सैद्धांतिक रूप से कोई अन्य स्त्रीलिंग पूर्वपद माना जा सकता है, पर निकटवर्ती संदर्भ में इसकी संभावना बहुत कम है।
  rationale: अध्याय 7 में बुद्धि का स्त्री के रूप में मानवीकरण है। मुख्य पाठ में सर्वनाम और पादटिप्पणी में स्पष्टीकरण इस साहित्यिक-धर्मवैचारिक मानवीकरण को सुरक्षित रखते हैं, बिना अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘पर’ δέ के हल्के विरोध/संक्रमण को व्यक्त करता है। ‘बेहिसाब धन’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी अधिक औपचारिक विकल्प देती है।
