  choice: पवनों का वेग
  alternative: आत्माओं की शक्ति / प्रचंड पवनें
  rationale: πνεῦμα का अर्थ ‘पवन’ या ‘आत्मा’ दोनों हो सकता है। आसपास की प्राकृतिक विषयों वाली सूची मुख्य पाठ में ‘पवनों’ का समर्थन करती है, पर अस्पष्टता को पादटिप्पणी में स्पष्ट रूप से बनाए रखा गया है।
