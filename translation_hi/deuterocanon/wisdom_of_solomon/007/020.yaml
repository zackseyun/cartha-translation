translation:
  language: hi
  text: पशुओं की प्रकृतियाँ और जंगली जानवरों के स्वभाव, पवनों की प्रबलता[a] और मनुष्यों के तर्क-विचार, पौधों की विविधताएँ और जड़ों की शक्तियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्माओं की हिंसक शक्ति”। यूनानी πνευμάτων का अर्थ “पवनों” या “आत्माओं” दोनों हो सकता है, और βίας “बल,” “प्रबलता,” या “हिंसा”।
    reason: πνευμάτων βίας की शब्दार्थगत अस्पष्टता को सुरक्षित रखते हुए βία के बल/हिंसा संबंधी अर्थ को ठीक व्यक्त करता है।
lexical_decisions:
- source_word: φύσεις ζῴων
  choice: पशुओं की प्रकृतियाँ
  rationale: यह पदबंध जीवों के स्वाभाविक गठन और अंतर्निहित गुणों को व्यक्त करता है; ‘प्रकृतियाँ’ सूची के दार्शनिक और प्राकृतिक-ज्ञान संबंधी स्वर को बनाए रखता है।
- source_word: θυμοὺς θηρίων
  choice: जंगली जानवरों के स्वभाव
  rationale: θυμός यहाँ मनोदशा, उग्रता या प्रवृत्ति का बोध करा सकता है। ‘स्वभाव’ आधुनिक हिन्दी में सहज है और अर्थ को केवल क्रोध तक सीमित नहीं करता।
- source_word: πνευμάτων βίας
  choice: पवनों का वेग
  rationale: प्राकृतिक जगत के विषयों की इस सूची में πνεύματα का ‘पवनें’ अर्थ प्रासंगिक है, जबकि βία उनकी प्रबलता या वेग बताता है। यूनानी की ‘आत्माओं’ वाली वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: मनुष्यों के विचार
  rationale: διαλογισμός विचार-प्रक्रिया, मनन या तर्क को दर्शाता है। ‘विचार’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है; ἀνθρώπων को समावेशी सामान्य अर्थ में ‘मनुष्यों’ कहा गया है।
- source_word: διαφορὰς φυτῶν
  choice: पौधों की विभिन्नताएँ
  rationale: διαφορά भेद और विविधता दोनों को सूचित करता है। ‘विभिन्नताएँ’ वर्गीकरणात्मक भाव बनाए रखता है।
- source_word: δυνάμεις ῥιζῶν
  choice: जड़ों की शक्तियाँ
  rationale: δύναμις यहाँ जड़ों की प्रभावकारी क्षमता या गुण, संभवतः औषधीय प्रभाव, को दर्शाता है। ‘शक्तियाँ’ मूल की व्यापकता को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
