  register: आधुनिक मानक हिन्दी में गरिमामय, सूचीबद्ध और सहज शैली अपनाई गई है। प्राकृतिक ज्ञान के संदर्भ को स्पष्ट रखा गया है, पर यूनानी की वास्तविक lexical ambiguity को पादटिप्पणी में संरक्षित किया गया है।
