    reason: lexical_alternative
  - marker: b
    text: या ‘शिल्पों का ज्ञान,’ ‘हुनरों का ज्ञान’ अथवा ‘व्यवसायों का ज्ञान’; यूनानी पद कुशल काम और कारीगरी से जुड़े ज्ञान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: उसके हाथ में
  rationale: यह शाब्दिक बाइबलीय मुहावरा अधिकार, संरक्षण और निर्भरता के भाव को सुरक्षित रखता है; संदर्भ से ‘उसके’ का संकेत परमेश्वर की ओर है, पर नाम पाठ में नहीं जोड़ा गया।
- source_word: ἡμεῖς
  choice: हम
  rationale: यूनानी में सर्वनाम स्पष्ट है और ‘हमारे शब्द’ के समानांतर रखा गया है; सरल ‘हम’ उसी संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ λόγοι ἡμῶν
  choice: हमारे शब्द
  rationale: λόγοι यहाँ वाणी या कही हुई बातों का व्यापक अर्थ देता है; ‘हमारे शब्द’ सीधा और स्वाभाविक अनुवाद है।
- source_word: πᾶσά τε φρόνησις
  choice: समस्त विवेक
  rationale: φρόνησις व्यावहारिक समझ, सूझ-बूझ या विवेक को व्यक्त कर सकता है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त है और इसकी व्यावहारिक-बौद्धिक छाया को बनाए रखता है।
- source_word: ἐργατειῶν
  choice: कारीगरी का
  rationale: बहुवचन ἐργατειῶν कुशल कार्यों, शिल्पों या व्यवसायगत कलाओं की ओर संकेत करता है। हिन्दी में सामूहिक ‘कारीगरी’ इस ठोस कौशल-सम्बन्धी अर्थ को सहजता से व्यक्त करती है।
- source_word: ἐπιστήμη
  choice: ज्ञान
  rationale: ἐπιστήμη व्यवस्थित या दक्षतापूर्ण ज्ञान को सूचित करता है; ‘ज्ञान’ सबसे सीधा और प्रसंगानुकूल हिन्दी विकल्प है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसके’—संदर्भतः परमेश्वर, पर अनुवाद में सर्वनाम सुरक्षित
  alternative: ‘परमेश्वर के हाथ में’
  rationale: मूल यूनानी केवल सर्वनाम देता है। संदर्भ परमेश्वर की ओर संकेत करता है, किन्तु नाम जोड़ने के बजाय मूल की अभिव्यक्ति और उसकी अंतर्निहितता को बनाए रखा गया है।
