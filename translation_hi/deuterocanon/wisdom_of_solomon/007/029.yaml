  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/029.yaml
  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: hi
  text: क्योंकि वह सूर्य से भी अधिक सुंदर है और तारों की हर व्यवस्था से बढ़कर है। प्रकाश से तुलना करने पर वह उससे पहले की ठहरती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पहले की” का अनुवाद “श्रेष्ठ” भी किया जा सकता है।
    reason: यूनानी προτέρα का प्राथमिक अर्थ कालगत पूर्वता है, पर इस तुलनात्मक प्रसंग में श्रेष्ठता का भाव भी समझा जा सकता है।
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: अधिक सुंदर
  rationale: तुलनात्मक रूप सौंदर्य और शोभा को व्यक्त करता है; सहज आधुनिक हिन्दी में ‘अधिक सुंदर’ इसका सीधा अर्थ देता है।
- source_word: πᾶσαν ἄστρων θέσιν
  choice: तारों की हर नक्षत्र-माला
  rationale: θέσις यहाँ तारों की स्थिति, व्यवस्था या विन्यास का बोध देता है। ‘नक्षत्र-माला’ आकाश में तारों के व्यवस्थित समूह की स्वाभाविक हिन्दी अभिव्यक्ति है और केवल एक आधुनिक खगोलीय तकनीकी अर्थ तक सीमित नहीं करती।
- source_word: προτέρα
  choice: पहले की
  rationale: मूल शब्द का प्राथमिक तुलनात्मक अर्थ ‘पहले/पूर्ववर्ती’ है। हिन्दी वाक्य में इसे बनाए रखा गया है, जबकि प्रसंग में श्रेष्ठता का भाव संभव होने के कारण उसे पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: प्रकाश की तुलना में बुद्धि के लिए προτέρα का अर्थ
  choice: उससे पहले की
  alternative: उससे श्रेष्ठ
  rationale: मूल यूनानी में कालगत प्राथमिकता और पदगत श्रेष्ठता के बीच अर्थगत तनाव है। मुख्य पाठ निकटतम शाब्दिक अर्थ रखता है और वैकल्पिक प्रसंगगत अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। स्त्रीलिंग ‘वह’ से प्रसंग की ‘बुद्धि’ का संदर्भ बनाए रखा गया है।
