  rationale: ὑπέρ यहाँ तुलनात्मक प्राथमिकता व्यक्त करता है। यह अनुवाद स्वास्थ्य और शारीरिक सुंदरता की अपेक्षा बुद्धि के अधिक मूल्यवान होने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: ἠγάπησα αὐτήν
  choice: मैंने उससे … प्रेम किया
  rationale: बुद्धि का स्त्री-रूप में मानवीकरण प्रसंग में स्पष्ट है; इसलिए हिन्दी में स्त्रीलिंग सर्वनाम बनाए रखा गया है।
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: प्रकाश के बजाय उसे अपने पास रखना चुना
  rationale: यह जान-बूझकर किए गए चुनाव और प्रकाश की जगह बुद्धि को रखने—दोनों भावों को सुरक्षित रखता है।
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: उससे निकलने वाली ज्योति
  rationale: ἐκ स्रोत को और φέγγος चमकती रोशनी को व्यक्त करता है। ‘ज्योति’ काव्यात्मक गरिमा रखते हुए पूर्ववर्ती ‘प्रकाश’ की अनावश्यक पुनरावृत्ति से बचाती है।
- source_word: ἀκοίμητον
  choice: कभी नहीं सोती
  rationale: शाब्दिक अर्थ ‘निद्रारहित’ है। ‘कभी नहीं सोती’ मूल के सजीव रूपक और निरंतर चमकते रहने के भाव को बनाए रखता है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: स्त्रीलिंग सर्वनाम ‘उसे/उससे’ बनाए रखा गया
  alternative: बुद्धि को निर्जीव मानकर सामान्य संदर्भ देना
  rationale: यूनानी पाठ में σοφία स्त्रीलिंग है और साहित्यिक प्रसंग में उसका सशक्त मानवीकरण हुआ है। स्त्रीलिंग संदर्भ मूल की काव्यात्मक और धर्मवैचारिक तन्यता को बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
- issue: ἀκοίμητον का रूपक
  choice: ज्योति ‘कभी नहीं सोती’
  alternative: ज्योति ‘कभी बुझती नहीं’
  rationale: ‘कभी बुझती नहीं’ आशय स्पष्ट करता, पर यूनानी के निद्रा-संबंधी रूपक को बदल देता। मुख्य पाठ में मूल रूपक रखा गया और शाब्दिक विशेषण पादटिप्पणी में दिया गया।
