  text: मैंने उसे स्वास्थ्य और सौंदर्य से भी अधिक प्रेम किया, और प्रकाश के बजाय उसे अपने पास रखना चुना, क्योंकि उससे निकलने वाली ज्योति कभी नहीं सोती।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा: “क्योंकि उससे निकलने वाली चमक निद्रारहित है।” यूनानी में बुद्धि से निकलने वाले प्रकाश को निरंतर और कभी न थमने वाला बताया गया है।'
    reason: ἀκοίμητον का अधिक शाब्दिक विकल्प और रूपक का स्पष्टीकरण।
lexical_decisions:
