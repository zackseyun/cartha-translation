- from: मैं कपड़ों में लपेटकर पाला गया और चिंताओं के बीच बड़ा हुआ।[a]
  to: मुझे कपड़े की पट्टियों में लपेटकर और देखभाल के साथ पाला गया।[a]
  rationale: The revision preserves the Greek’s single passive verb and its paired modifiers, restores the specific swaddling image, and uses a contextually natural Hindi expression for the care/attention sense of φροντίσιν. The footnote preserves the broader lexical ambiguity without imposing an interpretation.
