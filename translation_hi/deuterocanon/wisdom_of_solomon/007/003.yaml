  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: hi
  text: और मैंने भी, जब मेरा जन्म हुआ, सबकी साझी हवा में साँस ली और सबके समान दुःख सहने वाली धरती पर गिरा; रोते हुए मेरी पहली आवाज़ भी सबकी जैसी ही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενόμενος
  choice: जन्म लेते ही
  rationale: जन्म के इस प्रसंग में कृदंत मनुष्य के रूप में जीवन में आने को व्यक्त करता है; ‘जन्म लेते ही’ उसके कालगत संबंध को सहज हिन्दी में रखता है।
- source_word: ἔσπασα τὸν κοινὸν ἀέρα
  choice: सबकी साझी हवा में साँस ली
  rationale: ἔσπασα यहाँ हवा को भीतर खींचने का बोध देता है और κοινόν उस हवा के सबके लिए साझा होने पर बल देता है। हिन्दी में ‘हवा में साँस ली’ स्वाभाविक है और पहली साँस का चित्र बनाए रखता है।
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: समान दुःखों के अधीन धरती पर
  rationale: ὁμοιοπαθής समान अनुभव, दशा या दुःख के अधीन होने का अर्थ दे सकता है। मुख्य पाठ में संक्षिप्त और गरिमापूर्ण अभिव्यक्ति रखी गई है, जबकि व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: κατέπεσον
  choice: गिरा
  rationale: क्रिया का सीधा अर्थ ‘नीचे गिरना’ है और यह जन्म के शारीरिक चित्र को बनाए रखती है।
- source_word: πρώτην φωνὴν τὴν ὁμοίαν πᾶσιν
  choice: मेरी पहली आवाज़ भी सबकी जैसी ही थी
  rationale: φωνή को ‘आवाज़’ कहना अगले κλαίων से अनावश्यक पुनरुक्ति रोकता है; पूरी अभिव्यक्ति शिशु की पहली ध्वनि की सार्वभौमिक समानता पर बल देती है।
- source_word: ἶσα κλαίων
  choice: रोते समय
  rationale: κλαίων रोने को और ἶσα समान रीति को व्यक्त करता है; समानता का भाव पहले ही ‘सबकी जैसी ही’ में स्पष्ट होने से हिन्दी में इसे सहज रूप से जोड़ा गया है।
theological_decisions:
- issue: वक्ता की सामान्य मानवता और दुर्बलता
  choice: पद में साझा हवा, समान दुःखों के अधीन धरती और सबकी जैसी पहली आवाज़ के द्वारा वक्ता की अन्य मनुष्यों के साथ पूर्ण समानता पर बल बनाए रखा गया है।
  alternative: राजकीय गरिमा पर बल देने के लिए सामान्य मानवीय जन्म और दुर्बलता की भाषा को नरम करना।
  rationale: यूनानी पाठ κοινόν, ὁμοιοπαθῆ और ὁμοίαν πᾶσιν के द्वारा बार-बार साझी मानवीय दशा पर बल देता है; अनुवाद किसी बाद की सिद्धान्तगत व्याख्या को इसमें नहीं जोड़ता।
- issue: ὁμοιοπαθῆ की अर्थगत व्यापकता
  choice: मुख्य पाठ में ‘समान दुःखों के अधीन’ और पादटिप्पणी में ‘समान अनुभवों या दशा के अधीन’ विकल्प।
  alternative: केवल ‘उसी धरती पर’, जिससे शब्द की अनुभव और दुःख संबंधी अर्थच्छाया मिट जाती।
  rationale: विशेषण में दुःख-संवेदनशीलता और समान दशा या अनुभव—दोनों की संभावना है; पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। ‘सबकी साझी हवा’ और ‘सबकी जैसी ही’ मूल पाठ में सामान्य मानवता पर दिए गए दोहरे बल को बनाए रखते हैं; असामान्य यूनानी विशेषण की अर्थगत गुंजाइश पादटिप्पणी में सुरक्षित है।
