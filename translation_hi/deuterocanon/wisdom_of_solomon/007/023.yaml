- source_word: παντοδύναμον
  choice: सर्वशक्तिमान
  rationale: यह संयुक्त यूनानी शब्द ‘सारी शक्ति रखने वाली’ का प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: πανεπίσκοπον
  choice: सब पर दृष्टि रखने वाली
  rationale: यह केवल देखने की क्षमता नहीं, बल्कि सबका अवलोकन करने के क्रियात्मक भाव को भी बनाए रखता है।
- source_word: διὰ πάντων χωροῦν
  choice: सभी ... में होकर जाने वाली
  rationale: यह मूल में निहित होकर गुजरने या व्याप्त होने की गति को निकटता से व्यक्त करता है और वैकल्पिक ‘व्याप्त होने’ की संभावना पादटिप्पणी में सुरक्षित रखता है।
- source_word: πνευμάτων
  choice: आत्माओं
  rationale: इस दार्शनिक-धार्मिक संदर्भ में ‘आत्माएँ’ सबसे स्वाभाविक अर्थ है; ‘श्वासें’ संदर्भानुकूल नहीं होगा।
- source_word: νοερῶν
  choice: बुद्धिमान
  rationale: यह मन और समझ से युक्त होने का भाव सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: καθαρῶν
  choice: शुद्ध
  rationale: यह ऊँची शैली में भी स्वाभाविक और यूनानी विशेषण का सीधा समतुल्य है।
- source_word: λεπτοτάτων
  choice: अत्यंत सूक्ष्म
  rationale: यह विशेषण की उत्कृष्टतम तीव्रता और उसके दार्शनिक ‘सूक्ष्मता’ के भाव दोनों को बचाता है।
theological_decisions:
- issue: παντοδύναμον के लिए पारंपरिक ईश्वरीय पद का प्रयोग
  choice: सर्वशक्तिमान
  alternative: सब सामर्थ्य रखने वाली
  rationale: ‘सर्वशक्तिमान’ आधुनिक हिन्दी में पारदर्शी है और यूनानी संयुक्त शब्द का सीधा अर्थ देता है; फिर भी कम पारंपरिक विकल्प पादटिप्पणी में दिया गया है ताकि बाद की धर्मवैज्ञानिक ध्वनि को अनिवार्य न बनाया जाए।
- issue: διὰ πάντων χωροῦν πνευμάτων... का वाक्यगत संबंध
  choice: सभी बुद्धिमान, शुद्ध और अत्यंत सूक्ष्म आत्माओं में होकर जाने वाली
  alternative: सभी बुद्धिमान, शुद्ध और अत्यंत सूक्ष्म आत्माओं में व्याप्त होने वाली
  rationale: मुख्य पाठ यूनानी में गति/प्रवेश के निकट रहता है, जबकि पादटिप्पणी उसी पदबंध की ‘व्याप्ति’ वाली वास्तविक अर्थ-संभावना बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विशेषण-सूची रखी गई है। स्त्रीलिंग रूप संदर्भ में प्रज्ञा/बुद्धि के अनुरूप हैं। मुख्य पाठ मूल यूनानी की संक्षिप्त, दार्शनिक शैली बनाए रखता है; अस्पष्टता पादटिप्पणी में संरक्षित है।
