    text: या, “मनुष्यों की हितैषी।”
    reason: lexical_alternative
  - marker: b
    text: या, “सब सामर्थ्य रखने वाली।”
    reason: lexical_alternative
  - marker: c
    text: “सभी बुद्धिमान, शुद्ध और सबसे सूक्ष्म आत्माओं में से होकर जाने वाली” का अर्थ “सभी बुद्धिमान, शुद्ध और सबसे सूक्ष्म आत्माओं में व्याप्त होने वाली” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: मनुष्य-प्रेमी
