translation:
  language: hi
  text: मानव-हितैषी[a], दृढ़, सुरक्षित, निश्चिंत, सर्वशक्तिमान[b], सब पर दृष्टि रखने वाली, और सभी बुद्धिमान, शुद्ध और सबसे सूक्ष्म आत्माओं में से होकर जाने वाली[c]।
  philosophy: optimal-equivalence
  footnotes:
