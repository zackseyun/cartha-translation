lexical_decisions:
- source_word: τοῦτο
  choice: इसके
  rationale: नपुंसकलिंग संकेतवाचक सर्वनाम का संबंध पिछले पद में आए प्रकाश से है; हिन्दी में ‘इसके’ मूल की अप्रत्यक्षता बनाए रखते हुए स्वाभाविक है।
- source_word: διαδέχεται
  choice: इसके बाद … आती है
  rationale: क्रिया क्रम में पीछे आने या स्थान लेने का भाव देती है; यह हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: νύξ
  choice: रात
  rationale: प्रकाश के विपरीत सामान्य और सीधा अर्थ।
- source_word: σοφίας
  choice: बुद्धि
  rationale: यहाँ σοφία के लिए प्रतिष्ठित, स्वाभाविक हिन्दी शब्द; संबंधकारक रूप ἀντισχύει के साथ उस सत्ता को दिखाता है जिसके विरुद्ध बुराई प्रबल नहीं होती।
- source_word: οὐκ ἀντισχύει
  choice: पर प्रबल नहीं होती
  rationale: किसी के विरुद्ध शक्ति में टिकने या विजय पाने के भाव को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κακία
  choice: बुराई
  rationale: नैतिक दुष्टता का व्यापक अर्थ रखता है और यहाँ ‘दुष्टता’ या ‘दुर्भावना’ से अधिक सामान्य तथा सहज है।
theological_decisions:
- issue: τοῦτο का अप्रकट संदर्भ
  choice: मुख्य पाठ में ‘इसके’ रखकर संदर्भ को अप्रकट रहने दिया गया।
  alternative: क्योंकि प्रकाश के बाद रात आती है।
  rationale: यूनानी में ‘प्रकाश’ संज्ञा दोहराई नहीं गई, बल्कि संकेतवाचक सर्वनाम है; इसलिए मुख्य पाठ मूल की अभिव्यक्ति बनाए रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: ἀντισχύει का बल
  choice: बुराई बुद्धि पर प्रबल नहीं होती।
  alternative: बुराई बुद्धि का सामना नहीं कर सकती।
  rationale: ‘प्रबल नहीं होती’ संघर्ष और परिणाम दोनों का भाव रखता है, पर मूल से अधिक स्पष्ट सामर्थ्य-असमर्थता का दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप। ‘इसके बाद रात आती है’ निष्क्रिय और कृत्रिम संरचना से बचते हुए यूनानी के क्रमगत अर्थ को व्यक्त करता है; ‘बुद्धि’ इस ग्रंथ के केंद्रीय पद σοφία के लिए निरंतर रखा गया है।
