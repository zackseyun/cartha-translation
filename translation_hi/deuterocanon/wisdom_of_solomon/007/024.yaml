  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: hi
  text: क्योंकि बुद्धि किसी भी गति से अधिक गतिशील है[a], और अपनी शुद्धता के कारण वह सब वस्तुओं में से होकर गुजरती और उनमें व्याप्त होती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर गति से अधिक गतिशील।” यूनानी तुलनात्मक शब्द बुद्धि की गति करने की सबसे बढ़कर क्षमता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘बुद्धि’ स्त्रीलिंग शब्द है और यहाँ उसका मानवीकरण किया गया है। हिन्दी में भी ‘बुद्धि’ स्त्रीलिंग है; ‘गुजरती’ और ‘होती’ जैसे स्त्रीलिंग क्रिया-रूप उस साहित्यिक भाव के अनुकूल हैं।
    reason: cultural_note
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: किसी भी गति से
  rationale: πάσης के साथ तुलनात्मक प्रयोग का आशय है कि कोई भी गति बुद्धि की गतिशीलता की बराबरी नहीं करती। यह हिन्दी में स्वाभाविक रहते हुए यूनानी की व्यापकता बनाए रखता है।
- source_word: κινητικώτερον
  choice: अधिक गतिशील
  rationale: यह तुलनात्मक शब्द चलने या गति करने की श्रेष्ठ क्षमता पर बल देता है। ‘अधिक गतिशील’ इसे ‘अधिक सक्रिय’ जैसे संभावित व्याख्यात्मक विस्तार से बचाते हुए व्यक्त करता है।
- source_word: σοφία
  choice: बुद्धि
  rationale: यह σοφία का मानक और साहित्यिक सन्दर्भ के अनुकूल हिन्दी रूप है; वचन में इसका मानवीकरण है, पर इसे कोई अलग नाम या सत्ता मानना आवश्यक नहीं।
- source_word: διήκει
  choice: में से होकर गुजरती
  rationale: क्रिया किसी वस्तु के आर-पार जाने या उसके भीतर से होकर पहुँचने का भाव देती है और अगली क्रिया से अलग रखी गई है।
- source_word: χωρεῖ
  choice: उनमें प्रवेश करती
  rationale: यह आगे बढ़ने, भीतर जाने या आर-पार पहुँचने का भाव देता है। ‘प्रवेश करती’ दूसरी क्रिया की पृथकता को बनाए रखता है, यद्यपि दोनों अर्थों में निकट हैं।
- source_word: διὰ πάντων
  choice: सब वस्तुओं में से होकर ... उनमें
  rationale: नपुंसक बहुवचन का व्यापक अर्थ ‘सब वस्तुएँ’ है; हिन्दी वाक्य में दोनों क्रियाओं के साथ इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: διὰ τὴν καθαρότητα
  choice: अपनी शुद्धता के कारण
  rationale: διά के साथ कर्मकारक यहाँ स्पष्ट कारण बताता है। ‘अपनी’ मानवीकृत ‘बुद्धि’ की ओर लौटता है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘वह’ और ‘अपनी’ द्वारा मानवीकरण बनाए रखा गया, पर ‘बुद्धि’ को विशेष नाम की तरह नहीं लिखा गया।
  alternative: पूरी तरह निर्जीव ढंग से ‘उसकी शुद्धता’ कहना, या ‘बुद्धि’ को एक पृथक दिव्य सत्ता के रूप में अधिक स्पष्ट करना।
  rationale: σοφία यूनानी में स्त्रीलिंग है और प्रसंग में मानवीकृत है, किन्तु यह पद अकेले उसके पृथक दिव्य व्यक्तित्व का निर्णायक दावा नहीं करता। हिन्दी में ‘वह’ प्राकृतिक लिंग नहीं, बल्कि साहित्यिक मानवीकरण को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ज्ञान-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘गतिशील’, ‘शुद्धता’ और दो पृथक क्रियाएँ मूल यूनानी की संक्षिप्त, उन्नत शैली तथा उसके अर्थगत तनाव को बनाए रखती हैं।
