  text: क्योंकि जिस अनिवार्यता के वे पात्र थे, उसी ने उन्हें इस अंत की ओर घसीटा[a] और उन पर बीती घटनाओं की विस्मृति डाल दी, ताकि वे अपनी यातनाओं में जिस दण्ड की कमी रह गई थी, उसे पहले ही पूरा कर दें।
