  choice: उन लोगों ने ... पर इन लोगों ने
  rationale: दो तुलना किए जा रहे समूहों के बीच यूनानी संकेतवाचक विरोध को बनाए रखता है और संदर्भ से उनके नाम जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τοὺς ἀγνοοῦντας
  choice: अनजान लोगों
  rationale: क्रियाविशेषणीय कृदंत का मूल भाव ऐसे लोगों का है जिनसे परिचय नहीं था; आतिथ्य के संदर्भ में ‘अनजान लोगों’ स्वाभाविक है और ‘अजनबियों’ का भाव व्यक्त करता है।
- source_word: οὐκ ἐδέχοντο
  choice: स्वागत नहीं किया
  rationale: δέχομαι का सामान्य अर्थ ‘ग्रहण करना’ है, पर यहाँ आतिथ्य के प्रसंग में ‘स्वागत करना’ अभिप्रेत सामाजिक क्रिया को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρόντας
  choice: अपने बीच आए
  rationale: शाब्दिक अर्थ ‘उपस्थित’ है। हिंदी में लोगों के आतिथ्य हेतु उपस्थित होने को ‘अपने बीच आए’ कहना स्वाभाविक है, बिना ‘ज़रूरत में’ जैसी अस्रोत व्याख्या जोड़े।
- source_word: εὐεργέτας
  choice: उपकारियों
  rationale: यह संज्ञा उन लोगों को सूचित करती है जिन्होंने भलाई या सहायता की हो; ‘उपकारियों’ से उन्हें दास बनाने की नैतिक विडंबना बनी रहती है।
- source_word: ξένους
  choice: परदेशी
  rationale: यहाँ शब्द εὐεργέτας का विशेषणवत् वर्णन करता है और बाहरी या विदेशी होने का भाव देता है।
- source_word: ἐδουλοῦντο
  choice: दास बना लिया
  rationale: δουλόω किसी को दासत्व में लाने को व्यक्त करता है; यह अनुवाद बंधन की कठोरता को स्पष्ट रखता है।
theological_decisions:
- issue: तुलना किए गए समूहों की ऐतिहासिक पहचान
  choice: मुख्य पाठ में समूहों को ‘उन लोगों’ और ‘इन लोगों’ के रूप में ही रहने दिया गया।
  alternative: पहले समूह को सदोमवासी और दूसरे को मिस्री कहना।
  rationale: यूनानी पद में केवल परस्पर-विरोधी संकेतवाचक अभिव्यक्तियाँ हैं। व्यापक संदर्भ से पहचान का अनुमान हो सकता है, पर उसे इस पद में जोड़ना स्रोत के शब्दों से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘उन लोगों ... इन लोगों’ से मूल यूनानी का विरोध सुरक्षित है; ‘स्वागत’ आतिथ्य के प्रसंग को स्पष्ट करता है, और ‘दास बना लिया’ क्रिया की कठोरता को बिना नरम किए व्यक्त करता है।
