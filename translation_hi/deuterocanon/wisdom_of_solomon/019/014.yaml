  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/014.yaml
  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: hi
  text: क्योंकि उन लोगों ने अपने बीच आए अनजान लोगों[a] का स्वागत नहीं किया[b], पर इन लोगों ने परदेशी उपकारियों को दास बना लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ संभवतः ‘उनसे अपरिचित लोगों’ या ‘जिन्हें वे नहीं जानते थे’ है; संदर्भ में आशय अनजान लोगों अथवा अजनबियों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने बीच उपस्थित लोगों को ग्रहण नहीं किया।’
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक क्रम: ‘परदेशी उपकारियों को दास बनाया’; अर्थात जिन्होंने उनका भला किया था, उन्हीं परदेशियों को उन्होंने दास बना लिया।'
    reason: lexical_clarification
