  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: hi
  text: बाद में उन्होंने पक्षियों की एक नई उत्पत्ति[a] भी देखी, जब लालसा से प्रेरित होकर उन्होंने विलास के स्वादिष्ट भोजन माँगे[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पक्षियों की एक नई जाति।” यूनानी पदबंध का अर्थ पक्षियों का नया उत्पन्न होना या प्रकट होना हो सकता है; कम सम्भावना से यह एक नई किस्म के पक्षियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उन्होंने केवल पेट भरने के लिए नहीं, बल्कि सुख-भोग के लिए विशेष भोजन चाहा। निर्गमन 16 और गिनती 11 में जंगल के दौरान भोजन की लालसा की घटनाएँ देखें।
    reason: cross_reference
