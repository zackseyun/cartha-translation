translation:
  language: hi
  text: परन्तु अधर्मियों[a] पर अन्त तक निर्दय क्रोध आ पड़ा, क्योंकि वह उनके विषय में और होने वाली बातों के विषय में पहले से जानता था,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘श्रद्धाहीनों’।
    reason: ἀσεβέσιν के धार्मिक अर्थ को अधिक प्रत्यक्ष रूप से दिखाने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: '‘पहले से जानता था’ का कर्ता यूनानी में व्यक्त नहीं है; प्रसंग में इससे परमेश्वर का संकेत मिलता है। अंतिम पदबंध का अर्थ संक्षिप्त और कुछ हद तक खुला है: वह उनके विषय में और होने वाली बातों के विषय में पहले से जानता था।'
    reason: मूल पाठ में निहित कर्ता तथा αὐτῶν καὶ τὰ μέλλοντα की संक्षिप्त, व्याख्या-खुली रचना को स्पष्ट करना।
lexical_decisions:
- source_word: ἀσεβέσιν
  choice: अधर्मियों
  rationale: यह शब्द उन लोगों को सूचित करता है जिनका आचरण परमेश्वर के प्रति श्रद्धाहीन और धर्मविरुद्ध है। ‘अधर्मी’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के धार्मिक-नैतिक बल को बनाए रखता है।
- source_word: μέχρι τέλους
  choice: अन्त तक
  rationale: यूनानी पद का मुख्य अर्थ कालगत है; ‘अन्त तक’ उसकी सीमा और बल दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἀνελεήμων
  choice: निर्दय
  rationale: यह विशेषण दया के पूर्ण अभाव को व्यक्त करता है। ‘निर्दय’ सहज हिन्दी है और क्रोध की कठोरता को बनाए रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: न्याय के इस प्रसंग में यह तीव्र दण्डात्मक रोष को सूचित करता है; ‘क्रोध’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त गंभीर है।
- source_word: ἐπέστη
  choice: आ पड़ा
  rationale: क्रोध के किसी पर अचानक या निर्णायक रूप से आ पहुँचने के भाव को ‘आ पड़ा’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προῄδει
  choice: पहले से जानता था
  rationale: यह क्रिया पूर्वज्ञान बताती है। यह रूप अर्थ को स्पष्ट रखता है, पर किसी बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करता।
- source_word: αὐτῶν καὶ τὰ μέλλοντα
  choice: वे आगे जो कुछ करने वाले थे, उसे भी
  rationale: αὐτῶν संबंधसूचक षष्ठी है और τὰ μέλλοντα के साथ उनके भावी कार्यों या आचरण की ओर संकेत करती है; इसलिए इसे ‘उनको और जो होने वाला था’ नहीं बनाया गया। ‘भी’ καί के बल को व्यक्त करता है।
theological_decisions:
- issue: προῄδει का अनकहा कर्ता
  choice: मुख्य पाठ में ‘वह’ रखा गया
  alternative: ‘परमेश्वर’ को स्पष्ट रूप से जोड़ना
  rationale: यूनानी में कर्ता व्यक्त नहीं है। प्रसंग में संकेत सबसे स्वाभाविक रूप से परमेश्वर की ओर है, फिर भी ‘वह’ मूल पाठ की संक्षिप्तता और निहितता को सुरक्षित रखता है।
- issue: αὐτῶν καὶ τὰ μέλλοντα का संबंध
  choice: ‘वे आगे जो कुछ करने वाले थे’
  alternative: ‘उनको और जो कुछ होने वाला था’
  rationale: αὐτῶν षष्ठी रूप है, कर्मकारक ‘उनको’ नहीं। अतः इसे τὰ μέλλοντα से जोड़कर उनके भावी कार्यों के रूप में समझना यूनानी व्याकरण के अधिक अनुरूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की न्याय-विषयक गंभीरता सुरक्षित है। पद स्वतंत्र रूप से प्रस्तुत होने के कारण अन्त में पूर्णविराम दिया गया है, यद्यपि यूनानी पाठ आगे की बात से जुड़ता है।
