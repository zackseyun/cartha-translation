review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the merciless wrath that came upon the ungodly through the end. However, it over-specifies the final clause: αὐτῶν is not an expressed statement that they were going to do something. The wording should retain the source''s broader, somewhat compressed reference to them and to coming events.'
  naturalness: The current Hindi is generally clear and suitably dignified. Revising the final clause to “उनके विषय में और होने वाली बातों के विषय में” is natural modern Hindi and avoids an unwarranted assertion about their intended actions.
  terminology: “अधर्मी,” “निर्दय क्रोध,” “अन्त तक,” and “पहले से जानता था” are appropriate in register and theological tone. The alternative “श्रद्धाहीनों” is a useful footnote, though “भक्तिहीनों” could also be possible; no change is necessary.
  issues:
  - severity: high
    issue: “वे आगे जो कुछ करने वाले थे” introduces specific future actions by the ungodly.
    rationale: The Greek phrase αὐτῶν καὶ τὰ μέλλοντα is syntactically compressed and should not be resolved as an explicit claim about what they were going to do. The English audit trail's “both them and what was going to happen” also supports a broader rendering. A Hindi phrasing with “उनके विषय में” and “होने वाली बातों के विषय में” preserves the ambiguity.
  - severity: low
    issue: The verse-ending full stop does not reflect the source's continuing syntax.
    rationale: The Greek ends with a comma. Retaining a comma in Hindi better signals that the thought continues into the next verse, without affecting meaning.
