lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: अपना रुख पलटने
  rationale: यह क्रिया लौटने या दिशा/निर्णय बदलने का भाव रखती है। यहाँ ऐसा अनुवाद चुना गया है जो मिस्रियों के व्यवहार में आए उलटाव को व्यक्त करता है, पर यह निश्चित नहीं करता कि उलटाव केवल शारीरिक वापसी था या निर्णय का परिवर्तन।
- source_word: τοῦ ἀπεῖναι
  choice: उन्हें जाने देने के विषय में
  rationale: संदर्भ में यह पदबंध इस्राएलियों के प्रस्थान की अनुमति से संबंधित है। ‘के विषय में’ यूनानी संबंध की कुछ अस्पष्टता बनाए रखता है और अनावश्यक रूप से कारण या क्रम निश्चित नहीं करता।
- source_word: μετὰ σπουδῆς
  choice: बड़ी उतावली से
  rationale: σπουδή में तत्परता, गंभीर आग्रह और शीघ्रता के अर्थ हो सकते हैं। निर्गमन के प्रसंग में ‘बड़ी उतावली से’ उनकी जल्दबाजी और प्रबल आग्रह दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προπέμψαντες
  choice: विदा कर देने
  rationale: क्रिया का अर्थ किसी को आगे भेजना या यात्रा पर विदा करना है। ‘विदा कर देना’ यहाँ स्वाभाविक है और साथ जाकर पहुँचाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: διώξουσιν
  choice: पीछा करेंगे
  rationale: भविष्यकालीन क्रिया इस कथा में मिस्रियों द्वारा वास्तविक पीछा किए जाने को दर्शाती है; ‘पीछा करेंगे’ सीधा और प्रसंगानुकूल है।
- source_word: μεταμεληθέντες
  choice: पछताकर
  rationale: यह कृदन्त बीते निर्णय पर खेद और उससे उपजा व्यवहारिक उलटाव दर्शाता है। ‘पछताकर’ धार्मिक अर्थ में औपचारिक ‘मन फिराव’ आरोपित किए बिना भाव को संक्षेप में रखता है।
theological_decisions:
- issue: कर्ता और निहित कर्मों की पहचान
  choice: ‘वे स्वयं’ को मिस्रियों और ‘उन्हें’ को इस्राएलियों की ओर संकेत करने दिया गया है, पर नाम पद में नहीं जोड़े गए।
  alternative: स्पष्टता के लिए ‘मिस्री’ और ‘इस्राएली’ नाम सीधे पाठ में जोड़े जा सकते थे।
  rationale: यूनानी पाठ सर्वनामों पर निर्भर है और पहचान निकटवर्ती कथा से मिलती है। सर्वनाम बनाए रखना स्रोत की संरचना और प्रसंग-निर्भरता को सुरक्षित रखता है।
- issue: ἐπιστρέψαντες और μεταμεληθέντες के बीच संबंध
  choice: पहले पद को ‘अपना रुख पलटने’ और अंतिम पद को ‘पछताकर’ अलग-अलग रखा गया है।
  alternative: दोनों को एक ही मानसिक परिवर्तन का पुनरुक्त वर्णन मानकर मिला दिया जा सकता था।
  rationale: यूनानी में दोनों अलग कृदन्त हैं और इनके सटीक कालगत तथा अर्थगत संबंध में तनाव है। उन्हें अलग रखना उस तनाव को बिना सिद्धान्तगत व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। वाक्य को एक ही प्रवाह में रखा गया है ताकि मूल के कारणसूचक आरंभ और कृदन्त-क्रम सुरक्षित रहें। ‘वे स्वयं’ द्वारा αὐτοὶ का बल बनाए रखा गया है; अस्पष्ट स्थानों को पादटिप्पणियों में विकल्पों सहित दर्शाया गया है।
