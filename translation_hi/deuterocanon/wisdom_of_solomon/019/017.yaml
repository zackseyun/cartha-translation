  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: hi
  text: और वे भी अंधे कर दिए गए[a], ठीक उन लोगों की तरह जो उस धर्मी जन के द्वारों पर थे; जब वे अथाह अंधकार से घिरे हुए थे, तब उनमें से हर एक अपने ही द्वारों से होकर निकलने का मार्ग खोजता रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उत्पत्ति 19:11 की घटना की ओर संकेत है, जहाँ लूत के द्वार पर आए पुरुष अंधे कर दिए गए और द्वार खोजते-खोजते थक गए।
    reason: cross_reference
  - marker: b
    text: इस स्थान का यूनानी वाक्य-विन्यास कठिन है। उसका अधिक शब्दशः भाव है, “हर एक अपने द्वारों के मार्ग से निकलता रहा।” उत्पत्ति 19:11 के संकेत के कारण कुछ अनुवाद इसका अर्थ द्वार या प्रवेश का रास्ता खोजते रहना लेते हैं।
    reason: textual_or_lexical_ambiguity
