  rationale: मूल यूनानी स्पष्ट रूप से ‘तेरे हाथ’ कहता है। इस चित्र को बनाए रखने से परमेश्वर की सक्रिय सुरक्षा का बाइबलीय रूपक अमूर्त नहीं होता।
