  choice: 'हिन्दी में समन्वित क्रिया: ‘पार हो गए और उन्होंने ... देखे’'
  alternative: ‘... देखने के बाद पार हो गए’ अथवा ‘... देखकर पार हो गए’
  rationale: यूनानी का भूतकालिक कृदंत पूर्वकालिकता सुझा सकता है, पर प्रसंग में साथ घटित अनुभव का भाव भी संभव है। समन्वित वाक्य अनावश्यक रूप से क्रम निश्चित नहीं करता।
