base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/022.yaml
  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: hi
  text: क्योंकि हे प्रभु, आपने हर प्रकार से अपनी प्रजा को महान बनाया और उसे महिमामंडित किया; और हर समय और हर स्थान पर उसके साथ खड़े रहकर आपने उसकी उपेक्षा नहीं की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपने उसे अनदेखा नहीं किया”; यूनानी में शाब्दिक भाव “अनदेखा नहीं किया” है, जिसके बाद “उसके साथ खड़े रहकर” आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πάντα
  choice: हर प्रकार से
  rationale: κατά के साथ नपुंसकलिंग बहुवचन यहाँ व्यापकता व्यक्त करता है। ‘हर प्रकार से’ स्वाभाविक हिन्दी में कार्य के सभी पहलुओं को समेटता है।
- source_word: ἐμεγάλυνας
  choice: महान बनाया
  rationale: क्रिया का मूल अर्थ ‘बड़ा या महान करना’ है। यह चयन अर्थ को सीधे और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: τὸν λαόν σου
  choice: अपनी प्रजा
  rationale: बाइबिलीय यूनानी में λαός प्रायः परमेश्वर की प्रजा को सूचित करता है। ‘अपनी प्रजा’ सम्बन्ध और सामुदायिक अर्थ दोनों को स्पष्ट रखता है।
- source_word: ἐδόξασας
  choice: महिमामंडित किया
  rationale: यह क्रिया महिमा या प्रतिष्ठा प्रदान करने का भाव रखती है। ‘महिमामंडित किया’ इसकी ऊँची तथा धर्मवैचारिक गंभीरता बनाए रखता है।
- source_word: οὐχ ὑπερεῖδες
  choice: उपेक्षा नहीं की
  rationale: ὑπεροράω का अर्थ अनदेखा करना, ध्यान न देना या उपेक्षा करना हो सकता है। प्रसंग में ‘उपेक्षा नहीं की’ परमेश्वर की सतत देखभाल का भाव स्वाभाविक हिन्दी में देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: हर समय और हर स्थान पर
  rationale: यह वाक्यांश समय और स्थान दोनों की सर्वव्यापकता व्यक्त करता है। हिन्दी रूप संक्षिप्त और स्पष्ट है।
- source_word: παριστάμενος
  choice: उसके साथ खड़े रहकर
  rationale: कृदंत का मूल भाव पास खड़े होने या उपस्थित रहने का है, जिसमें यहाँ सहायक उपस्थिति निहित है। ‘साथ खड़े रहकर’ रूपक और सहायता—दोनों भाव सुरक्षित रखता है।
theological_decisions:
- issue: κύριε के द्वारा प्रत्यक्ष संबोधन
  choice: हे प्रभु
  alternative: प्रभु
  rationale: κύριε परमेश्वर को प्रत्यक्ष संबोधन है। हिन्दी में ‘हे प्रभु’ श्रद्धापूर्ण और स्वाभाविक संबोधन है; ‘हे’ यूनानी में अलग शब्द के रूप में नहीं है, पर हिन्दी व्याकरण में संबोधन को स्पष्ट करता है।
- issue: παριστάμενος के साथ निहित सम्बन्ध/कर्म
  choice: उसके साथ खड़े रहकर
  alternative: पास उपस्थित रहकर
  rationale: यूनानी कृदंत में स्पष्ट कर्म नहीं है, पर निकटतम संदर्भ ‘अपनी प्रजा’ है। ‘उसके साथ’ जोड़ना अर्थ को स्पष्ट करता है, बिना कोई नया धर्मवैचारिक दावा जोड़े।
- issue: ἐδόξασας का निहित कर्म
  choice: उसे महिमामंडित किया
  alternative: महिमामंडित किया
  rationale: यूनानी में ‘अपनी प्रजा’ दोनों क्रियाओं का साझा कर्म है। हिन्दी में ‘उसे’ दोहराने से वाक्य स्पष्ट और सहज बनता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा’, ‘महान बनाया’ और ‘महिमामंडित किया’ बाइबिलीय ऊँचाई बनाए रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
