  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: hi
  text: क्योंकि सारी सृष्टि अपने ही प्रकार में फिर ऊपर से नए रूप में ढाली जा रही थी,[a] और तेरी ही आज्ञाओं की सेवा कर रही थी, ताकि तेरी संतान हानि से बची रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर आरम्भ से नए रूप में ढाली जा रही थी।” यूनानी शब्द ἄνωθεν का अर्थ “ऊपर से” या “आरम्भ से” हो सकता है, और διετυποῦτο में नए रूप में ढाले जाने या पुनर्गठित किए जाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: सारी सृष्टि
  rationale: एकवचन सामूहिक पद पूरे सृजे हुए जगत को दर्शाता है; ‘सारी सृष्टि’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: ἐν ἰδίῳ γένει
  choice: अपने ही प्रकार में
  rationale: γένος का मूल भाव ‘प्रकार/वर्ग’ है; यह अनावश्यक रूप से दार्शनिक ‘स्वभाव’ ग्रहण किए बिना यूनानी भेद को बनाए रखता है।
- source_word: πάλιν ἄνωθεν
  choice: फिर ऊपर से
  rationale: πάλιν की पुनरावृत्ति और ἄνωθεν के ‘ऊपर से’ अर्थ को मुख्य पाठ में रखा गया है; ‘आरम्भ से’ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: διετυποῦτο
  choice: नए रूप में ढाली जा रही थी
  rationale: अपूर्णकालीन कर्मवाच्य चलते हुए पुनर्रचना-कार्य को सूचित करता है; ‘ढाली जा रही थी’ रूप देने या नए सांचे में गढ़ने का भाव व्यक्त करता है।
- source_word: ὑπηρετοῦσα
  choice: सेवा कर रही थी
  rationale: यह कृदन्त सृष्टि को परमेश्वर के आदेशों के अधीन सक्रिय सेवा करते हुए चित्रित करता है।
- source_word: ταῖς ἰδίαις ἐπιταγαῖς
  choice: तेरी ही आज्ञाओं
  rationale: सम्बोधित परमेश्वर से जुड़े अधिकारपूर्ण आदेशों को ‘आज्ञाओं’ से व्यक्त किया गया है और ἰδίαις का बल ‘ही’ द्वारा सुरक्षित रखा गया है।
- source_word: οἱ σοὶ παῖδες
  choice: तेरी संतान
  rationale: παῖδες यहाँ परमेश्वर के जनों के लिए पारिवारिक पद है; ‘संतान’ लिंग-सीमा लगाए बिना सामूहिक अर्थ देता है।
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: सकुशल बची रहे
  rationale: ἵνα के प्रयोजन और हानि से सुरक्षित रखे जाने, दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἄνωθεν द्वारा सृष्टि के पुनर्गठन का स्रोत या आरम्भ
  choice: मुख्य पाठ में ‘ऊपर से’
  alternative: ‘आरम्भ से’ या ‘नए सिरे से’
  rationale: ἄνωθεν में ऊपर/दैवी स्रोत और आरम्भ—दोनों अर्थ सम्भव हैं। मुख्य पाठ पहले अर्थ को रखता है, जबकि पादटिप्पणी दूसरे को सुरक्षित रखती है; इस प्रकार वास्तविक अर्थगत और धर्मवैचारिक तनाव मिटाया नहीं गया।
- issue: παῖδες का सम्बन्धपरक अर्थ
  choice: ‘संतान’
  alternative: ‘सेवक’
  rationale: निर्गमन-सदृश प्रसंग में परमेश्वर के जनों की रक्षा प्रमुख है। ‘संतान’ पारिवारिक सम्बन्ध को व्यक्त करता है, पर पद की सम्भावित सेवक-संज्ञा को सिद्धान्तगत निष्कर्ष में नहीं बदलता।
