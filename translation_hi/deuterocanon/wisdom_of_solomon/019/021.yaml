- issue: चमत्कारी भोजन के बिंब का अनुवाद, बिना बाद की धर्मसैद्धांतिक व्याख्या आरोपित किए
  choice: अमृतमय भोजन
  alternative: स्वर्गीय भोजन; अमरता देनेवाला भोजन
  rationale: ‘अमृतमय’ मूल यूनानी की उत्कृष्ट और अनश्वर भोजन-संबंधी साहित्यिक छटा को बनाए रखता है, जबकि इसे किसी संकीर्ण बाद की पहचान तक सीमित नहीं करता।
- issue: प्राणियों का लपटों के भीतर होना कितना स्पष्ट किया जाए
  choice: लपटों ने अपने बीच चलते ... प्राणियों
  alternative: लपटों के भीतर चलते प्राणी; उनके बीच घूमते प्राणी
  rationale: यह कृदंत का दृश्य स्पष्ट करता है और चमत्कार की तीव्रता बनाए रखता है, पर मूल वाक्य को अनावश्यक रूप से नहीं फैलाता।
