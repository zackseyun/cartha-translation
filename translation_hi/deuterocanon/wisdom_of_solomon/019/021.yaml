  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: hi
  text: इसके विपरीत[a], लपटों ने लपटों के बीच चलनेवाले नाशवान प्राणियों के मांस को कुम्हलाने नहीं दिया, और न ही उन्होंने अमृतमय भोजन के सहज पिघलनेवाले, स्फटिक-सदृश[b] प्रकार को पिघलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इसके विपरीत’ का अनुवाद ‘उलटे’ या ‘विपरीत रीति से’ भी हो सकता है। यूनानी क्रियाविशेषण बताता है कि लपटों ने सामान्यतः अपेक्षित प्रभाव के उलट व्यवहार किया।
    reason: lexical_alternative
  - marker: b
    text: ‘स्फटिक-सदृश’ को ‘बर्फ-जैसा’ या ‘स्फटिकाकार’ भी समझा जा सकता है; यह चमत्कारी भोजन के रूप या बनावट का वर्णन करता है।
    reason: lexical_alternative
