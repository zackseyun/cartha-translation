  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मुरझाया’ तथा ‘सहज पिघलनेवाले ... पिघलाया’ जैसे कुछ असामान्य प्रयोग मूल यूनानी के काव्यात्मक बिंब और शब्द-पुनरावृत्ति को बचाने के लिए जानबूझकर रखे गए हैं।
