base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: hi
  text: क्योंकि जब उनके हाथों में अब भी शोक के चिह्न थे और वे मृतकों की कब्रों के पास विलाप कर ही रहे थे[a], तभी उन्होंने मूर्खता से भरी एक और योजना अपना ली[b]। जिन्हें उन्होंने विनती करके निकाल दिया था[c], उन्हीं का उन्होंने भगोड़ों की तरह पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “शोक उनके हाथों में था”—यह एक सजीव अभिव्यक्ति है, जिसका आशय है कि वे अब भी शोक-विधियों या शोक के बाहरी चिह्नों में लगे हुए थे।
    reason: cultural_note
  - marker: b
    text: या, “एक और विवेकहीन विचार।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात, जिन लोगों से उन्होंने पहले विनती की थी कि वे चले जाएँ, बाद में उन्हीं का ऐसे पीछा किया मानो वे भाग निकले हों।
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι
  choice: अब भी
  rationale: यह चल रही अवस्था और आगे वर्णित कार्य के साथ उसके समयगत मेल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: उनके हाथों में अब भी शोक के चिह्न थे
  rationale: यूनानी की सजीव शाब्दिक छवि ‘शोक को हाथों में रखना’ सुरक्षित रहती है, साथ ही ‘चिह्न’ जोड़ने से आधुनिक हिन्दी में आशय समझ आता है।
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: मृतकों की कब्रों के पास विलाप कर ही रहे थे
  rationale: क्रिया निरंतर और मुखर शोक व्यक्त करती है; ‘के पास’ कब्रों से संबद्ध विलाप को स्वाभाविक हिन्दी में बताता है।
- source_word: ἕτερον ... λογισμὸν ἀνοίας
  choice: मूर्खता से भरी एक और योजना
  rationale: λογισμός का प्रसंगगत व्यावहारिक अर्थ ‘योजना’ है, जबकि ἀνοίας उसकी विवेकहीन प्रकृति को व्यक्त करता है।
- source_word: ἐπεσπάσαντο
  choice: अपना ली
  rationale: मध्यवाच्य क्रिया किसी विचार या कार्य-योजना को ग्रहण करने का भाव देती है; ‘अपना ली’ सहज और सटीक है।
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: जिन्हें उन्होंने विनती करके निकाल दिया था
  rationale: ἱκετεύοντες की अनुनय-विनय और ἐξέβαλον के निकाल देने—दोनों भावों को बिना अनावश्यक विस्तार के रखा गया है।
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: उन्हीं का उन्होंने भगोड़ों की तरह पीछा किया
  rationale: ‘उन्हीं’ यूनानी के बलाघातपूर्ण पुनरुल्लेख को दर्शाता है और ‘भगोड़ों की तरह’ विडंबना को बनाए रखता है।
theological_decisions:
- issue: मिस्रियों द्वारा इस्राएलियों के प्रति अपने व्यवहार को उलट देने की ऐतिहासिक-धर्मवैचारिक विडंबना
  choice: पहले विनती करके निकालने और फिर भगोड़ों की तरह पीछा करने के विरोध को पाठ में स्पष्ट रखा गया है।
  alternative: निर्गमन की घटनाओं, विपत्तियों या समुद्र का स्पष्ट उल्लेख जोड़ना।
  rationale: यूनानी पद स्वयं इस उलटाव को व्यक्त करता है; अतिरिक्त ऐतिहासिक विवरण जोड़ना अनुवाद की सीमा से बाहर होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। यूनानी की सजीव शोक-छवि और वाक्य की विडंबनापूर्ण पुनरावृत्ति को बचाया गया है; जहाँ शाब्दिकता अस्पष्ट हो सकती थी, वहाँ संक्षिप्त पद और पादटिप्पणी से अर्थ खोला गया है।
