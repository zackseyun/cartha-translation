  rationale: निकटवर्ती साहित्यिक प्रसंग निर्गमन के समय प्रकृति में दिखाई पड़े परिवर्तनों का वर्णन करता है। इसलिए अनुवाद ठोस और प्रेक्षणपरक भाषा रखता है तथा बाद की दार्शनिक या सांप्रदायिक धारणाएँ नहीं जोड़ता।
