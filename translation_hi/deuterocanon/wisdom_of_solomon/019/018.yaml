base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: hi
  text: क्योंकि मूल तत्त्व आपस में पुनर्व्यवस्थित होते हुए, जैसे वीणा में लय के स्वर अपना नाम बदलते हैं, फिर भी नाद में सदा बने रहते हैं[a]—ऐसा घटी हुई घटनाओं के अवलोकन से ठीक-ठीक अनुमान लगाया जा सकता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश अत्यंत संक्षिप्त और कुछ कठिन है। इसका अनुवाद यह भी हो सकता है: “लय के स्वर अपनी पहचान बदलते हैं, फिर भी उनका नाद बना रहता है।” मूल पाठ का असामान्य शब्द “नाम” मुख्य पाठ में सुरक्षित रखा गया है।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात, यह तुलना अभी वर्णित घटनाओं के अवलोकन से ठीक-ठीक अनुमानित की जा सकती है।
    reason: clarification
lexical_decisions:
- source_word: στοιχεῖα
  choice: मूल तत्त्व
  rationale: प्रसंग में सृष्टि के भौतिक घटकों और निर्गमन की घटनाओं के दौरान प्रकृति में हुए परिवर्तनों की बात है। ‘मूल तत्त्व’ इस ठोस अर्थ को रखता है, पर इन्हें व्यक्तित्वयुक्त ब्रह्मांडीय शक्तियाँ नहीं बनाता।
- source_word: μεθαρμοζόμενα
  choice: आपस में नए ढंग से संयोजित होते रहे
  rationale: क्रिया में पुनः व्यवस्थित, पुनः अनुकूलित या नए सामंजस्य में लाए जाने का भाव है। यह चयन पारस्परिक पुनर्संयोजन और संगीत-संबंधी उपमा, दोनों को बनाए रखता है।
- source_word: ψαλτηρίῳ
  choice: वीणा
  rationale: यह एक तारवाला वाद्य था। आधुनिक हिन्दी में ‘वीणा’ सहज और गरिमापूर्ण ठोस समतुल्य है, यद्यपि यह प्राचीन वाद्य की सटीक बनावट निर्धारित नहीं करता।
- source_word: φθόγγοι τοῦ ῥυθμοῦ
  choice: लय के स्वर
  rationale: φθόγγοι संगीत में सुनाई देने वाले अलग-अलग स्वरों को और ῥυθμός उनकी क्रमबद्ध लय या मात्रिक विन्यास को सूचित करता है।
- source_word: τὸ ὄνομα διαλλάσσουσιν
  choice: अपना नाम बदलते हैं
  rationale: मूल यूनानी में असामान्य पर स्पष्ट रूप से ‘नाम’ है। अधिक व्याख्यात्मक ‘रूप’ या ‘पहचान’ के बजाय शाब्दिक बिंब सुरक्षित रखा गया है।
- source_word: πάντοτε μένοντα ἤχῳ
  choice: फिर भी नाद में सदा बने रहते हैं
  rationale: यह कठिन और संक्षिप्त वाक्यांश परिवर्तन के बीच ध्वनि की निरंतरता दर्शाता है। अनिश्चितता को मिटाए बिना ‘नाद में’ मूल रचना के निकट रहता है।
- source_word: ὅπερ ἐστὶν εἰκάσαι ... ἀκριβῶς
  choice: यह बात ... ठीक-ठीक समझी जा सकती है
  rationale: εἰκάσαι में अनुमान या निरीक्षण से पहचानने का भाव है और ἀκριβῶς उसकी सटीकता को बल देता है। सहज हिन्दी के लिए ‘समझी जा सकती है’ चुना गया है।
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: घटी हुई घटनाओं को देखकर
  rationale: यह वाक्यांश निष्कर्ष को अभी वर्णित घटनाओं के प्रत्यक्ष अवलोकन पर आधारित करता है और ὄψις की दृश्य भाषा को बनाए रखता है।
theological_decisions:
- issue: सृष्टि के बदले हुए व्यवहार को बताने वाली संगीतात्मक उपमा
  choice: इसे प्राकृतिक मूल तत्त्वों के पुनर्संयोजन की उपमा के रूप में प्रस्तुत किया गया है।
