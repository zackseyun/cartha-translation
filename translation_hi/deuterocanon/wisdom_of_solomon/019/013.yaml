- issue: οὐκ ἄνευ…τῇ βίᾳ… की संकुचित वाक्य-रचना
  choice: प्रमाण के बिना नहीं, बल्कि वज्रपातों के प्रचंड वेग के साथ
  alternative: वज्रपातों के प्रचंड वेग में, घट चुकी घटनाओं के प्रमाणों के बिना नहीं
  rationale: मुख्य अर्थ को पठनीय हिन्दी में रखा गया है, जबकि पादटिप्पणी यूनानी पदों के संबंध की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
