  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/013.yaml
  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: hi
  text: और पापियों पर दंड आ पड़े—वज्रपातों के प्रचंड वेग में जो कुछ घट चुका था, उसके प्रमाण के बिना नहीं। वे अपने ही दुष्कर्मों के कारण न्यायोचित रूप से कष्ट भोग रहे थे, क्योंकि उन्होंने परदेशियों के प्रति अधिक घोर घृणा बरती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “परदेशियों के प्रति घृणा” का अनुवाद “अतिथि-विरोध” या “अतिथि-सत्कार का अभाव” भी किया जा सकता है; पर यूनानी शब्द केवल स्वागत न करने से अधिक, परदेशियों या अतिथियों के प्रति सक्रिय शत्रुता का भाव दे सकता है।
    reason: lexical_alternative
