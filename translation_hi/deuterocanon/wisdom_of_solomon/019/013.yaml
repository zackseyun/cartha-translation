- source_word: χαλεπωτέραν μισοξενίαν
  choice: परदेशियों के प्रति अधिक घोर घृणा
  rationale: तुलनात्मक χαλεπωτέραν की तीव्रता और μισοξενία के सक्रिय परदेशी-द्वेष को सुरक्षित रखता है; इसे केवल आतिथ्य की कमी तक सीमित नहीं करता।
