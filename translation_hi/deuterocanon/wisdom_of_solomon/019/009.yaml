  rationale: सव्यंजक कृदंत को सम्बोधित ‘आप’ से जोड़ते हुए यह ईश्वर के उद्धारकारी कार्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वर के लिए सम्बोधन κύριε
  choice: हे प्रभु
  alternative: हे स्वामी
  rationale: पद में ईश्वर को सीधे सम्बोधित करके स्तुति की गई है; ‘प्रभु’ धार्मिक प्रयोग में प्रतिष्ठित होने के साथ आधुनिक हिन्दी में सहज है।
- issue: τὸν ῥυόμενον का पक्ष और समय
  choice: जिन्होंने उन्हें बचाया
  alternative: जो उन्हें बचाते हैं
  rationale: यूनानी वर्तमान कृदंत स्वयं समय को पूरी तरह निश्चित नहीं करता, पर प्रसंग में इस्राएल के घटित छुटकारे की ओर संकेत है। हिन्दी में पूर्ण उद्धारकारी घटना के लिए भूतकाल स्वाभाविक है, जबकि कर्ता की पहचान स्पष्ट रहती है।
