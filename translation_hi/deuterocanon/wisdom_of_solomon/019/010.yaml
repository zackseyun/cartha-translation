  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: hi
  text: क्योंकि उन्हें अब भी अपने परदेश-निवास[a] के समय की बातें याद थीं—कैसे पशुओं की उत्पत्ति के बदले धरती ने मच्छर[b] उत्पन्न किए, और जलचरों के बदले नदी ने मेंढकों की बहुतायत उगल दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात परदेशियों के रूप में उनका निवास; अनुवाद ‘प्रवास’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस यूनानी शब्द से अभिप्रेत कीट की ठीक पहचान अनिश्चित है; इसका अर्थ डांस या इसी प्रकार का कोई छोटा काटने वाला कीट भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο ... ἔτι
  choice: उन्हें अब भी ... याद थीं
  rationale: अपूर्णकालिक क्रिया और ἔτι मिलकर बने रहने वाली स्मृति का भाव देते हैं; यह हिन्दी में स्वाभाविक ढंग से उसी निरंतरता को व्यक्त करता है।
- source_word: παροικίᾳ
  choice: परदेश-निवास
  rationale: यह शब्द किसी स्थान में परदेशी के रूप में रहने की दशा को सूचित करता है। ‘परदेश-निवास’ उस सामाजिक भाव को बनाए रखता है और ‘निर्वासन’ जैसी अधिक प्रबल धारणा नहीं जोड़ता।
- source_word: γενέσεως ζῴων
  choice: पशुओं की उत्पत्ति
  rationale: γένεσις यहाँ जीवों के सामान्य उत्पन्न होने की प्रक्रिया को सूचित करता है। ‘उत्पत्ति’ अर्थ की व्यापकता को बनाए रखता है; केवल ‘जन्म’ कहने से प्रक्रिया कुछ अधिक संकुचित हो सकती है।
- source_word: ἐξήγαγεν ἡ γῆ
  choice: धरती ने ... उत्पन्न किए
  rationale: क्रिया का मूल चित्र धरती से किसी वस्तु को बाहर लाने या उपजाने का है। आधुनिक हिन्दी में ‘उत्पन्न किए’ स्पष्ट और स्वाभाविक है।
- source_word: σκνῖπα
  choice: मच्छर
  rationale: इस छोटे कीट की ठीक पहचान अनिश्चित है। ‘मच्छर’ आधुनिक हिन्दी में सबसे सुबोध निकटार्थक शब्द है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐνύδρων
  choice: जलचरों
  rationale: विशेषण का संज्ञात्मक प्रयोग जल में रहने वाले जीवों को दर्शाता है। ‘जलचर’ संक्षिप्त, प्रचलित और अर्थ-सटीक है।
- source_word: ἐξηρεύξατο
  choice: उगल दिए
  rationale: यूनानी क्रिया साधारणतः निकालने या बहाने से अधिक प्रबल, सजीव निष्कासन का चित्र प्रस्तुत करती है; ‘उगल दिए’ उस तीव्रता को बनाए रखता है।
- source_word: πλῆθος βατράχων
  choice: असंख्य मेंढक
  rationale: πλῆθος बड़ी संख्या पर बल देता है। ‘असंख्य मेंढक’ हिन्दी में सहज रहते हुए उस प्रचुरता को व्यक्त करता है।
theological_decisions:
- issue: παροικία में मिस्र-निवास का स्वरूप
  choice: परदेशियों के रूप में निवास का भाव रखते हुए ‘परदेश-निवास’
  alternative: प्रवास; निर्वासन
  rationale: संदर्भ मिस्र में इस्राएल के परदेशी निवास और वहाँ हुई विपत्तियों की स्मृति का है। ‘निर्वासन’ बाद के निर्वासन-संबंधी धर्मवैचारिक अर्थ को अनावश्यक रूप से जोड़ सकता है, जबकि केवल ‘प्रवास’ परदेशी सामाजिक स्थिति को कम स्पष्ट करता है।
- issue: ἐξηρεύξατο में विपत्ति के चित्र की तीव्रता
  choice: नदी ने ... उगल दिए
  alternative: नदी ने निकाल दिए; नदी ने बहा दिए
  rationale: मूल क्रिया जोरदार निष्कासन का चित्र देती है। ‘उगल दिए’ उसी आलंकारिक तीव्रता को सुरक्षित रखता है, बिना कोई अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परदेश-निवास’ सामाजिक परदेशीपन को सुरक्षित रखता है; ‘उगल दिए’ मूल के सजीव और प्रबल बिंब को बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित शब्दों के साथ रखे गए हैं।
