lexical_decisions:
- source_word: ἴδωμεν
  choice: आओ, हम देखें
  rationale: यह ὁράω का प्रथम पुरुष बहुवचन प्रोत्साहनसूचक रूप है। यह अनुवाद वक्ताओं की चुनौती और आपसी उकसावे, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ λόγοι αὐτοῦ
  choice: उसकी बातें
  rationale: λόγοι यहाँ उसके कथनों या दावों को सूचित करता है। ‘उसकी बातें’ मूल के निकट और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ἀληθεῖς
  choice: सच
  rationale: विशेषण कथनों की सत्यता बताता है। ‘सच्ची’ के बजाय ‘सच हैं या नहीं’ हिन्दी में स्वाभाविक है और व्यक्ति के चरित्र के बजाय उसकी बातों की सत्यता पर ध्यान रखता है।
- source_word: πειράσωμεν
  choice: परखें
  rationale: क्रिया का अर्थ जाँचना या कसौटी पर रखना है। ‘परखें’ प्रसंग में निहित शत्रुतापूर्ण परीक्षण को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: अंत में उसके साथ क्या होता है
  rationale: ἐκβάσις परिणाम, परिणति या अंत का बोध करा सकता है। यह रूप व्यक्ति पर आने वाली अंतिम परिणति को स्पष्ट करता है, पर यह तय नहीं करता कि केवल मृत्यु अभिप्रेत है या व्यापक अंतिम परिणाम।
theological_decisions:
- issue: धर्मी व्यक्ति के विषय में ἐκβάσις का आशय
  choice: अंत में उसके साथ क्या होता है
  alternative: उसका अंत क्या होगा / उसका परिणाम क्या होगा
  rationale: प्रसंग में वक्ता यह परखना चाहते हैं कि धर्मी के दावे उसकी अंतिम दशा में सत्य सिद्ध होते हैं या नहीं। चुना हुआ रूप अंतिम परिणाम या सम्भावित ईश्वरीय समर्थन की ओर संकेत बनाए रखता है, पर मूल से अधिक विशिष्ट परलोक-संबंधी सिद्धांत नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आओ, हम’ सामूहिक चुनौती का स्वर देता है, जबकि ‘अंत में उसके साथ क्या होता है’ मूल की परिणाम/अंत संबंधी अस्पष्टता को पर्याप्त रूप से सुरक्षित रखता है।
