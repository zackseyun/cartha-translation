base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने मनुष्य को अविनाशिता के लिए रचा[a], और उसे अपने ही स्वभाव का प्रतिरूप बनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अमरता के लिए’ अथवा ‘अक्षयता के लिए’। यूनानी शब्द में क्षय और मृत्यु के अधीन न होने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी ही विशिष्टता का प्रतिरूप’ अथवा ‘अपनी ही सत्ता का प्रतिरूप’। यूनानी पदबंध असामान्य है और इसके एक से अधिक निकट अनुवाद संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισε
  choice: रचा
  rationale: यहाँ क्रिया किसी को अस्तित्व में लाने का भाव देती है; ‘रचा’ सृष्टि-संदर्भ में स्वाभाविक और सटीक है।
- source_word: τὸν ἄνθρωπον
  choice: मनुष्य
  rationale: एकवचन यहाँ समस्त मानवजाति का प्रतिनिधित्व करता है। ‘मनुष्य’ हिन्दी में इस प्रतिनिधिक और सार्वभौमिक अर्थ को सहजता से व्यक्त करता है।
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: अविनाशिता के लिए
  rationale: ἀφθαρσία क्षय और मृत्यु के अधीन न होने की अवस्था को दर्शाता है। ‘अविनाशिता’ इस व्यापक अर्थ को बनाए रखता है और इसे केवल अनन्त अस्तित्व तक सीमित नहीं करता।
- source_word: εἰκόνα
  choice: प्रतिरूप
  rationale: ‘प्रतिरूप’ किसी के स्वरूप को प्रतिबिंबित करने वाली छवि का भाव देता है और सृष्टि-वर्णन की प्रतिध्वनि बनाए रखता है।
- source_word: τῆς ἰδίας ἰδιότητος
  choice: अपने ही स्वभाव का
  rationale: यह असामान्य यूनानी पदबंध परमेश्वर की अपनी विशिष्ट सत्ता, गुणधर्म या स्वभाव की ओर संकेत कर सकता है। ‘अपने ही स्वभाव का’ पठनीय है, पर इसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐποίησεν αὐτόν
  choice: उसे ... बनाया
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा पहले उपवाक्य के ‘रचा’ के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: τὸν ἄνθρωπον का मानवशास्त्रीय विस्तार
  choice: प्रतिनिधिक एकवचन ‘मनुष्य’, जो मानवजाति को सूचित करता है
  alternative: मानवजाति; मानव-प्राणी
  rationale: पद सृष्टि-विषयक सामान्य कथन करता है। हिन्दी ‘मनुष्य’ यूनानी एकवचन को रखते हुए स्त्री-पुरुष सहित मानवजाति का सामान्य बोध कराता है।
- issue: ἀφθαρσία का अर्थ
  choice: अविनाशिता
  alternative: अमरता; अक्षयता
  rationale: इस शब्द में क्षय और मृत्यु दोनों से मुक्त होने का भाव समाहित है। ‘अविनाशिता’ व्यापक अर्थ को बचाती है और आत्मा की अमरता संबंधी किसी विशिष्ट दार्शनिक मत को पाठ में नहीं जोड़ती।
- issue: τῆς ἰδίας ἰδιότητος का आशय
  choice: अपने ही स्वभाव का
  alternative: अपनी ही विशिष्टता का; अपनी ही सत्ता का
  rationale: यूनानी पदबंध दुर्लभ और अर्थ की दृष्टि से खुला है। मुख्य पाठ में सहज हिन्दी दी गई है, जबकि निकट विकल्प पादटिप्पणी में रखे गए हैं ताकि अस्पष्टता मिटे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण सृष्टि-विषयक लहजा रखा गया है। ‘मनुष्य’ प्रतिनिधिक एकवचन है; ‘अविनाशिता’ और ‘स्वभाव’ जैसे अपेक्षाकृत औपचारिक शब्द कठिन यूनानी अवधारणाओं को संक्षेप में व्यक्त करते हैं, और उनके विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
