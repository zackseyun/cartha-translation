  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: hi
  text: पर हम उस धर्मी मनुष्य[a] की घात लगाएँ, क्योंकि वह हमारे लिए परेशानी का कारण है और हमारे कामों का विरोध करता है। वह व्यवस्था के विरुद्ध किए गए पापों के लिए हमें धिक्कारता है और हम पर हमारे पालन-पोषण[b] के विरुद्ध किए गए पापों का आरोप लगाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस धर्मी जन।” यूनानी का एकवचन किसी प्रतिनिधि धर्मी व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “प्रशिक्षण,” “पालन-पोषण” या “अनुशासन” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: हम ... की घात लगाएँ
  rationale: प्रथम पुरुष बहुवचन के प्रोत्साहनात्मक भाव को बनाए रखते हुए यह वाक्यांश छिपकर हानि पहुँचाने की योजना व्यक्त करता है, पर हमले की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸν δίκαιον
  choice: उस धर्मी मनुष्य
  rationale: यूनानी निश्चित एकवचन एक प्रतिनिधि धर्मी व्यक्ति को सूचित कर सकता है; हिन्दी में यह रूप पुरुषवाचक एकवचन और आदर्शात्मक भाव दोनों को स्वाभाविक रूप से रखता है।
- source_word: δύσχρηστος
  choice: परेशानी का कारण
  rationale: संदर्भ में अर्थ 'बेकार' नहीं, बल्कि ऐसा व्यक्ति है जिससे निपटना कठिन और खटकने वाला है। यह आधुनिक हिन्दी में सहज है।
- source_word: ἐναντιοῦται τοῖς ἔργοις ἡμῶν
  choice: हमारे कामों का विरोध करता है
  rationale: यह सक्रिय प्रतिरोध को स्पष्ट रखता है; 'काम' यहाँ नैतिक अर्थ वाले कर्मों के लिए सामान्य और बोधगम्य शब्द है।
- source_word: ὀνειδίζει ἡμῖν
  choice: हमें धिक्कारता है
  rationale: यह मौखिक निंदा और दोष-दर्शन का भाव देता है, बिना इसे उपहास तक तीखा किए।
- source_word: ἁμαρτήματα νόμου
  choice: व्यवस्था के विरुद्ध किए गए पाप
  rationale: सम्बन्धकारक को व्यवस्था के उल्लंघन से संबंधित पापों के रूप में लिया गया है; 'व्यवस्था' बाइबलीय νόμος का स्वाभाविक हिन्दी रूप है।
- source_word: ἐπιφημίζει ἡμῖν
  choice: अपराधों का दोष हम पर लगाता है
  rationale: क्रिया के आरोप लगाने वाले भाव को व्यक्त करता है और सार्वजनिक घोषणा जैसी अधिक विशिष्ट धारणा नहीं जोड़ता।
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: हमारे पालन-पोषण के विरुद्ध किए गए अपराध
  rationale: παιδεία में पालन-पोषण, प्रशिक्षण और अनुशासन द्वारा हुआ नैतिक निर्माण सम्मिलित हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τὸν δίκαιον के प्रतिनिधि पुरुषवाचक एकवचन का अनुवाद
  choice: उस धर्मी मनुष्य
  alternative: उस धर्मी जन
  rationale: यह यूनानी के पुरुषवाचक एकवचन को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि वह एक प्रतिनिधि धर्मी व्यक्ति भी हो सकता है; पाठ को किसी विशेष मसीही पहचान तक सीमित नहीं किया गया।
- issue: παιδεία का नैतिक-निर्माण संबंधी अर्थ
  choice: हमारे पालन-पोषण
  alternative: हमारे प्रशिक्षण / हमारे अनुशासन
  rationale: संदर्भ केवल औपचारिक शिक्षा का नहीं, प्राप्त नैतिक संस्कारों के विरुद्ध अपराध का है। 'पालन-पोषण' आधुनिक हिन्दी में सहज है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। आरोपों की समानांतर रचना और यूनानी पाठ की नैतिक-कानूनी तीव्रता बनाए रखी गई है; παιδεία की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
