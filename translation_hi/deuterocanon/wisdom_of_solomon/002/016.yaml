base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: hi
  text: उसकी दृष्टि में हम खोटे[a] ठहरे हैं, और वह हमारे मार्गों से ऐसे दूर रहता है जैसे अशुद्ध वस्तुओं से; वह धर्मियों के अंत[b] को धन्य कहता है और डींग मारता है कि परमेश्वर उसका पिता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नकली,” “झूठे” अथवा “मिलावटी”; यूनानी का भाव है कि वह हमें असली या प्रामाणिक नहीं मानता।
    reason: lexical_alternative
  - marker: b
    text: या “अंतिम दशा” अथवा “परिणाम।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से संक्षिप्त यूनानी पद का भाव है, “पिता के रूप में परमेश्वर की डींग मारता है”; अर्थात वह परमेश्वर को अपना पिता बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: खोटे
  rationale: यह शब्द नकली, अमान्य या खोटी धातु जैसी किसी असली न मानी गई वस्तु का बोध कराता है। ‘खोटे’ हिन्दी में इस रूपक और नैतिक अवमूल्यन दोनों को संक्षेप में बनाए रखता है।
- source_word: ἐλογίσθημεν
  choice: ठहरे हैं
  rationale: यहाँ कर्मवाच्य क्रिया किसी के आकलन में गिने या माने जाने को व्यक्त करती है; ‘उसकी दृष्टि में ... ठहरे हैं’ स्वाभाविक हिन्दी में वही मूल्यांकनात्मक अर्थ देता है।
- source_word: ἀπέχεται
  choice: दूर रहता है
  rationale: क्रिया जानबूझकर अपने को किसी चीज़ से अलग रखने का भाव देती है।
- source_word: ὁδῶν
  choice: मार्गों
  rationale: ‘मार्ग’ जीवन-व्यवहार के बाइबिलीय रूपक को सुरक्षित रखता है और हिन्दी में सहज है।
- source_word: ἀκαθαρσιῶν
  choice: अशुद्ध वस्तुओं
  rationale: यूनानी बहुवचन उन चीज़ों की ओर संकेत करता है जिन्हें अपवित्र करने वाला माना जाता है; यह रूप शुद्धता-अशुद्धता की भाषा और बहुवचन दोनों को स्पष्ट रखता है।
- source_word: μακαρίζει
  choice: धन्य कहता है
  rationale: क्रिया किसी को या किसी दशा को धन्य मानने या कहने का अर्थ देती है; ‘धन्य’ केवल भावनात्मक खुशी की अपेक्षा धार्मिक-मूल्यांकनात्मक अर्थ को बनाए रखता है।
- source_word: ἔσχατα
  choice: अंत
  rationale: नपुंसकलिंग बहुवचन अंतिम दशा, परिणाम या अंत को सूचित कर सकता है। ‘अंत’ संक्षिप्त है, जबकि पादटिप्पणी वास्तविक अर्थ-विस्तार को सुरक्षित रखती है।
- source_word: δικαίων
  choice: धर्मियों
  rationale: यह धार्मिक और नैतिक श्रेणी के लिए प्रचलित, सुबोध हिन्दी पद है।
- source_word: ἀλαζονεύεται
  choice: डींग मारता है
  rationale: क्रिया में दंभपूर्ण दावा या शेखी का नकारात्मक भाव है; ‘डींग मारता है’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: πατέρα θεόν
  choice: कि परमेश्वर उसका पिता है
  rationale: 'संक्षिप्त यूनानी पद का स्वाभाविक हिन्दी विस्तार है: वह परमेश्वर को अपना पिता होने का दावा करता है।'
theological_decisions:
- issue: ἀλαζονεύεται के साथ πατέρα θεόν का अर्थ
  choice: दुष्टों के कथन में धर्मी व्यक्ति डींग मारता है कि परमेश्वर उसका पिता है
  alternative: वह पिता के रूप में परमेश्वर की डींग मारता है; वह दावा करता है कि परमेश्वर उसका पिता है
  rationale: यह कथावाचक की प्रत्यक्ष धर्मसैद्धांतिक घोषणा नहीं, बल्कि धर्मी व्यक्ति के विरुद्ध दुष्टों की शिकायत है। अनुवाद संबंधपरक दावे को स्पष्ट करता है, पर बाद की विशिष्ट मसीही व्याख्या को पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘मार्गों,’ ‘धर्मियों’ और ‘धन्य’ से शास्त्रीय-बाइबिलीय रंग रखा गया है; ‘डींग मारता है’ मूल क्रिया के नकारात्मक, दंभपूर्ण स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
