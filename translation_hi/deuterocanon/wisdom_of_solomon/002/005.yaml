base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: hi
  text: क्योंकि हमारा जीवन छाया के गुज़र जाने जैसा है, और हमारे अंत से लौटना संभव नहीं; क्योंकि उस पर मुहर लग चुकी है, और कोई वापस नहीं आता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιᾶς ... πάροδος
  choice: छाया के गुज़र जाने जैसा
  rationale: यह यूनानी रूपक जीवन की क्षणभंगुरता को छाया के शीघ्र बीत जाने से व्यक्त करता है; हिन्दी में तुलना को स्पष्ट और स्वाभाविक रखा गया है।
- source_word: ἀναποδισμὸς
  choice: लौटना
  rationale: इस दुर्लभ संज्ञा का मूल भाव पीछे लौटने या वापसी का है; संदर्भ में मृत्यु के अंत से वापसी न होने की बात है।
- source_word: τῆς τελευτῆς ἡμῶν
  choice: हमारे अंत से
  rationale: τελευτή यहाँ जीवन के अंत अर्थात मृत्यु को संकेत करता है; 'अंत' मूल की संक्षिप्तता और अर्थगत तनाव बनाए रखता है।
- source_word: κατεσφραγίσθη
  choice: उस पर मुहर लग चुकी है
  rationale: पूर्ण निष्पन्न कर्मवाच्य रूप अंतिमता और अपरिवर्तनीयता व्यक्त करता है; निहित कर्ता को जोड़े बिना मुहर का रूपक सुरक्षित रखा गया है।
- source_word: ἀναστρέφει
  choice: वापस नहीं आता
  rationale: क्रिया के लौटने वाले अर्थ को प्रसंगानुकूल स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना पुनरुत्थान के विषय पर कोई अतिरिक्त मत आरोपित किए।
theological_decisions:
- issue: अंत से वापसी की असंभवता
  choice: मृत्यु की अंतिमता के बारे में वक्ताओं का कथन सीधे रखा गया है।
  alternative: इसे अंतिम पुनरुत्थान का सार्वभौमिक निषेध समझाकर अनुवाद करना।
  rationale: यह पद पुस्तक के भीतर अधर्मी वक्ताओं के तर्क का भाग है; अनुवाद उनके कथन को प्रस्तुत करता है, उसे धर्मसैद्धांतिक निष्कर्ष बनाकर न तो पुष्ट करता है, न सुधारता है।
- issue: मुहर लगाने वाला
  choice: 'कर्मवाच्य रखा गया: ''मुहर लग चुकी है''।'
  alternative: '''परमेश्वर ने मुहर लगा दी है'' या किसी अन्य कर्ता को स्पष्ट करना।'
  rationale: यूनानी पाठ कर्ता का नाम नहीं बताता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। 'गुज़र जाने' से क्षणभंगुरता और 'मुहर लग चुकी है' से मूल रूपक तथा अंतिमता दोनों बनाए गए हैं।
