  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: hi
  text: क्योंकि उन्होंने आपस में गलत तर्क करते हुए कहा, “हमारा जीवन छोटा और दुःखमय है; मनुष्य के जीवन के अंत में कोई उपचार नहीं है[b], और ऐसा कोई ज्ञात नहीं हुआ जो अधोलोक से लौट आया हो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अधोलोक से छूटकर आया हो”; यह ὁ ἀναλύσας कृदन्त के अधिक शाब्दिक भाव को सुरक्षित रखता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “मनुष्य के अंत में”; यह मानव मृत्यु के लिए सामान्य एकवचन अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: ठीक विचार न करते हुए
  rationale: यह कृदन्त उनके कहने की रीति और कारण को बताता है; यह रूप यूनानी के नैतिक और बौद्धिक मूल्यांकन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὀλίγος
  choice: छोटा
  rationale: βίος के साथ यह जीवन की अवधि को सूचित करता है; ‘छोटा जीवन’ सामान्य और स्पष्ट हिन्दी है।
- source_word: λυπηρός
  choice: दुःखमय
  rationale: यह शारीरिक पीड़ा तक सीमित नहीं, बल्कि शोक और क्लेश से चिह्नित जीवन को व्यक्त करता है।
- source_word: βίος
  choice: जीवन
  rationale: संदर्भ में इसका अर्थ जीविका या जीवन-शैली नहीं, बल्कि मानव जीवन है।
- source_word: ἴασις
  choice: उपचार
  rationale: यह चंगाई, इलाज या बहाली का भाव रखता है; यहाँ ‘उपचार’ मृत्यु के सामने किसी पुनर्स्थापना के उपाय के न होने को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τελευτῇ ἀνθρώπου
  choice: मनुष्य के जीवन के अंत में
  rationale: τελευτή का अर्थ ‘अंत’ या ‘मृत्यु’ हो सकता है। मुख्य पाठ में ‘जीवन’ जोड़ने से हिन्दी स्पष्ट रहती है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- source_word: ἐγνώσθη
  choice: ज्ञात नहीं हुआ
  rationale: निष्क्रिय क्रिया यह कहती है कि मानवीय अनुभव में ऐसा कोई व्यक्ति जाना या पहचाना नहीं गया।
- source_word: ὁ ἀναλύσας
  choice: जो ... लौट आया हो
  rationale: ἐξ ᾅδου के साथ प्रसंग मृतकों के लोक से वापस आने का संकेत देता है। ‘लौट आया’ स्वाभाविक है, जबकि ‘छूटकर आया’ की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἐξ ᾅδου
  choice: अधोलोक से
  rationale: यह मृतकों के लोक को दर्शाता है। ‘अधोलोक’ स्रोत की धारणा को बनाए रखता है और इसे केवल ‘कब्र’ तक सीमित नहीं करता।
theological_decisions:
- issue: ἀνθρώπου के सामान्य एकवचन का अनुवाद
  choice: मनुष्य के जीवन के अंत में
  alternative: मानव जीवन के अंत में; किसी व्यक्ति के जीवन के अंत में
  rationale: यूनानी पुल्लिंग एकवचन यहाँ समस्त मानवजाति के प्रतिनिधिक अर्थ में है, केवल पुरुषों के विषय में नहीं। ‘मनुष्य’ उस सामान्य अर्थ को सुरक्षित रखता है।
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडेस; मृतकों का लोक; कब्र
  rationale: ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए बोधगम्य रहते हुए मृतकों के लोक की स्रोत-धारणा को व्यक्त करता है; ‘कब्र’ अर्थ को अनावश्यक रूप से संकुचित कर देती है।
- issue: ὁ ἀναλύσας की दिशात्मक अस्पष्टता
  choice: जो अधोलोक से लौट आया हो
  alternative: जो अधोलोक से छूटकर आया हो
  rationale: मुख्य पाठ संदर्भ में निहित वापसी को स्पष्ट करता है, पर यूनानी कृदन्त में ‘छूटने/बंधन खोलने’ की संभावित अधिक शाब्दिक छाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज स्तर रखा गया है। वाक्य में मूल के कारणसूचक ‘क्योंकि’, गलत विचार का मूल्यांकन, जीवन की संक्षिप्तता और दुःख, तथा अधोलोक की धारणा सुरक्षित हैं।
