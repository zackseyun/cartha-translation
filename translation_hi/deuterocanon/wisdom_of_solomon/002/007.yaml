- source_word: πλησθῶμεν
  choice: आओ, हम ... से अपने को भर लें
  rationale: प्रथम पुरुष बहुवचन के exhortative subjunctive को ‘आओ, हम’ से व्यक्त किया गया है; ‘अपने को भर लें’ आत्मभोग की प्रबलता को बनाए रखता है।
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: हमारे पास से न निकल जाए
  rationale: यह निषेधात्मक आज्ञा उस इच्छा को व्यक्त करती है कि आनंद का कोई अवसर हाथ से न जाने पाए; हिन्दी में यह मुहावरा स्वाभाविक है।
- source_word: ἄνθος ἔαρος
  choice: वसंत का कोई फूल
  rationale: मूल का काव्यात्मक चित्र अक्षुण्ण रहता है और हिन्दी में सहज व गरिमापूर्ण सुनाई देता है।
