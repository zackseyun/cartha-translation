translation:
  language: hi
  text: क्योंकि हम संयोगवश अस्तित्व में आए, और इसके बाद ऐसे हो जाएँगे मानो हम कभी थे ही नहीं; क्योंकि हमारी नासिकाओं की श्वास धुआँ है, और हमारे हृदय की धड़कन में बुद्धि एक चिनगारी है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: संयोग से
  rationale: यह क्रियाविशेषण यहाँ बिना पूर्व योजना या उद्देश्य के आकस्मिक रूप से अस्तित्व में आने का भाव व्यक्त करता है; ‘संयोग से’ आधुनिक हिन्दी में इसे सहज और स्पष्ट रखता है।
- source_word: ἐγενήθημεν
  choice: हम ... अस्तित्व में आए
  rationale: निष्क्रिय रूप का स्वाभाविक हिन्दी प्रतिरूप, जो उत्पत्ति के दावे को बिना अतिरिक्त कर्ता जोड़े व्यक्त करता है।
- source_word: πνοὴ
  choice: साँस
  rationale: नासिकाओं के संदर्भ में इसका ठोस अर्थ श्वास है; ‘प्राण’ अनावश्यक दार्शनिक या धार्मिक अर्थ ला सकता है।
- source_word: λόγος
  choice: तर्क-बुद्धि
  rationale: इस शारीरिक-दार्शनिक संदर्भ में λόγος का अर्थ वाणी मात्र नहीं, बल्कि मनुष्य की विचार या तर्क करने की क्षमता है; संयुक्त पद इस अर्थ को स्पष्ट रखते हुए व्यापकता बचाता है।
- source_word: ἐν κινήσει καρδίας ἡμῶν
  choice: हमारे हृदय की धड़कन में
  rationale: शाब्दिक ‘हृदय की गति में’ की अपेक्षा यह स्वाभाविक हिन्दी है और शारीरिक स्पंदन का चित्र सुरक्षित रखती है।
theological_decisions:
- issue: मानव उत्पत्ति को आकस्मिक बताने वाला कथन
  choice: इसे पात्रों के अपने दावे के रूप में बिना सुधार के अनूदित किया गया
  alternative: ऐसी भाषा जोड़ना जिससे कथन को तत्काल असत्य या निंदनीय घोषित किया जाए
  rationale: पद अधर्मी वक्ताओं की विचारधारा प्रस्तुत करता है; अनुवाद को उनकी वाणी की धार्मिक तनातनी बनाए रखनी चाहिए, उस पर व्याख्यात्मक निर्णय नहीं थोपना चाहिए।
- issue: λόγος का अर्थ
  choice: तर्क-बुद्धि
  alternative: वाणी
  rationale: हृदय की गति में ‘चिनगारी’ और मृत्युशीलता पर चल रहे तर्क के संदर्भ में संज्ञान या तर्कशक्ति अधिक संभावित है, यद्यपि यूनानी पद में वचन/वाणी की अर्थ-छाया भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर और काव्यात्मक गद्य। मूल के समानांतर कारण-वाक्यों और धुआँ/चिनगारी के रूपकों को बनाए रखा गया है। पद अगले वाक्य में आगे बढ़ता है, इसलिए अंत में अल्पविराम रखा गया है।
