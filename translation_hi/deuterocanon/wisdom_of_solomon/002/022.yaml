  text: And they did not know his mysteries[a], nor did they hope for the reward of holiness[c][b], nor did they consider blameless souls worthy of honor.
translation:
  language: hi
  text: और उन्होंने उसके रहस्यों[a] को नहीं जाना, न पवित्रता के प्रतिफल[b] की आशा रखी, और न ही निर्दोष आत्माओं को सम्मान के योग्य समझा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी गुप्त बातें।”
    reason: lexical_alternative
  - marker: b
    text: या, “भक्ति के प्रतिफल” या “धर्मनिष्ठा के प्रतिफल।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “और न उन्होंने निर्दोष आत्माओं के सम्मान का निर्णय किया”; यूनानी वाक्यांश संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: नहीं जाना
  rationale: यह γινώσκω के अओरिस्ट रूप का सीधा और स्वाभाविक अनुवाद है; संदर्भ में ज्ञान और समझ, दोनों की कमी निहित हो सकती है।
- source_word: μυστήρια
  choice: रहस्यों
  rationale: यह छिपी हुई वास्तविकताओं या उद्देश्यों का बोध कराता है और यूनानी शब्द का धार्मिक भार बनाए रखता है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यूनानी में सर्वनाम ही है; संदर्भतः संकेत परमेश्वर की ओर है, पर मुख्य पाठ में सर्वनाम रखकर मूल की अभिव्यक्ति और औपचारिक अस्पष्टता सुरक्षित रहती है।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: धार्मिक-नैतिक संदर्भ में यह पुरस्कार या मिलने वाले फल का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है और व्यावसायिक 'मजदूरी' से बचता है।
- source_word: ἤλπισαν
  choice: आशा रखी
  rationale: ἐλπίζω की भविष्याभिमुख आशा या अपेक्षा को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁσιότητος
  choice: पवित्रता
  rationale: ὁσιότης की पवित्र, भक्तिपूर्ण नैतिक निष्ठा को व्यापक रूप से व्यक्त करता है; 'भक्ति' भी सम्भव है।
- source_word: ἔκριναν
  choice: पहचाना
  rationale: κρίνω यहाँ मूल्यांकन कर मान्यता देने के अर्थ में है। संक्षिप्त यूनानी रचना के संदर्भ में 'सम्मान को पहचाना' अपेक्षाकृत औपचारिक रहते हुए अर्थ देता है।
- source_word: γέρας
  choice: सम्मान
  rationale: γέρας सम्मान, सम्मानसूचक पुरस्कार या विशेष प्रतिष्ठा को सूचित करता है। मूल की संज्ञात्मक बनावट को बनाए रखने के लिए 'सम्मान' चुना गया है।
- source_word: ψυχῶν
  choice: प्राणों
  rationale: ψυχή के 'जीवन', 'व्यक्ति' और 'प्राण/आत्मा' अर्थों में से 'प्राण' यहाँ व्यक्तियों के अस्तित्व और भावी नियति की प्रतिध्वनि को बिना अधिक व्यवस्थित सिद्धान्त जोड़े बनाए रखता है।
- source_word: ἀμώμων
  choice: निर्दोष
  rationale: व्यक्तियों के नैतिक वर्णन में 'दोषरहित' की अपेक्षा अधिक स्वाभाविक आधुनिक हिन्दी है और 'बेदाग' की रूपकात्मकता से बचता है।
theological_decisions:
- issue: '''उसके रहस्यों'' में सर्वनाम का संदर्भ'
  choice: मुख्य पाठ में 'उसके' रखा गया; संदर्भतः परमेश्वर अभिप्रेत है
  alternative: सीधे 'परमेश्वर के रहस्य' कहना
  rationale: संदर्भ परमेश्वर के उद्देश्यों की ओर संकेत करता है, किन्तु यूनानी संज्ञा को दोहराने के बजाय सर्वनाम रखता है; इसलिए मूल की औपचारिकता और हल्की अस्पष्टता सुरक्षित रखी गई है।
- issue: ψυχῶν का अर्थ
  choice: प्राणों
  alternative: आत्माओं; जीवनों; व्यक्तियों
  rationale: यह चयन मनुष्य के अस्तित्व और उसकी भावी नियति की ध्वनि बनाए रखता है, पर पद में आत्मा के स्वरूप पर कोई अतिरिक्त सम्प्रदायगत दावा नहीं जोड़ता।
- issue: γέρας ψυχῶν ἀμώμων की संक्षिप्त रचना
  choice: निर्दोष प्राणों के सम्मान को पहचाना
  alternative: निर्दोष प्राणों को सम्मान के योग्य नहीं समझा
  rationale: वैकल्पिक रूप अर्थ को अधिक स्पष्ट करता है, पर मुख्य पाठ में संज्ञात्मक 'सम्मान' को रखकर यूनानी की संक्षिप्तता और यह तनाव सुरक्षित रखा गया है कि γέρας सम्मान, विशेषाधिकार या सम्मानसूचक प्रतिफल हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय स्तर रखा गया है। तीन समानांतर निषेधात्मक खंडों को 'और... न... और न...' से जोड़ा गया है। 'प्राणों' और 'प्रतिफल' साहित्यिक हैं, पर सामान्य धार्मिक हिन्दी में समझने योग्य हैं।
