- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: हमारे कामों को याद नहीं करेगा
  rationale: μνημονεύω यहाँ पहले खंड के ‘भुला दिया जाएगा’ के समानांतर स्मरण करने को व्यक्त करता है। ἔργα के लिए सामान्य और व्यापक ‘काम’ चुना गया है।
