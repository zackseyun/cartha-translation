- source_word: ὁμίχλη διασκεδασθήσεται
  choice: धुंध के समान तितर-बितर हो जाएगा
  rationale: ὁμίχλη के लिए ‘धुंध’ और कर्मवाच्य διασκεδασθήσεται के लिए ‘तितर-बितर हो जाएगा’ वाष्प के छँटने की दृश्यात्मकता बनाए रखते हैं।
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: सूर्य की किरणों से खदेड़ी जाती
  rationale: διώκω की पीछा करके दूर करने वाली सशक्त छवि को ‘खदेड़ी जाती’ से सुरक्षित रखा गया है।
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: उसकी गर्मी से दब जाती है
  rationale: βαρύνω का शाब्दिक भारी करने/दबाने का रूपक संरक्षित है; ‘उसकी’ का संदर्भ निकटवर्ती सूर्य है।
