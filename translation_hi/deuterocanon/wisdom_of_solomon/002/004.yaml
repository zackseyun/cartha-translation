  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: hi
  text: समय के साथ हमारा नाम भुला दिया जाएगा, और कोई हमारे कामों को याद नहीं करेगा; हमारा जीवन बादल के निशानों की तरह गुज़र जाएगा और सूर्य की किरणों से खदेड़ी और उसकी गर्मी से भारी कर दी गई धुंध की तरह तितर-बितर हो जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भारी कर दी गई’ के लिए यूनानी शब्द का शाब्दिक अर्थ ‘भारी बनाई गई’ भी हो सकता है।
    reason: βαρυνθεῖσα के असामान्य, भौतिक रूपक को स्पष्ट करता है, बिना उसके प्रभाव की अतिरिक्त व्याख्या किए।
