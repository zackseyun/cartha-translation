  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: hi
  text: आओ, हम धर्मी निर्धन का उत्पीड़न करें[a]; विधवा को भी न बख्शें, और दीर्घायु वृद्ध के सफेद बालों का भी लिहाज़ न करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायी निर्धन व्यक्ति का।” यूनानी में “निर्धन” और “धर्मी/न्यायी” दोनों एक ही व्यक्ति का वर्णन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बहुत वर्षों वाले वृद्ध के सफेद बालों का भी आदर न करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: आओ, हम ... दबाएँ
  rationale: क्रिया किसी पर कठोर सत्ता चलाने और उसे उत्पीड़ित करने का भाव देती है। ‘दबाएँ’ सहज हिन्दी में इस दमनकारी बल को व्यक्त करता है।
- source_word: πένητα
  choice: निर्धन
  rationale: πένης गरीब या अभावग्रस्त व्यक्ति को सूचित करता है। पुल्लिंग एकवचन का व्यक्तिगत संदर्भ ‘धर्मी निर्धन’ में बना रहता है।
- source_word: δίκαιον
  choice: धर्मी
  rationale: δίκαιος का अर्थ धर्मी, न्यायी या खरा हो सकता है। यहाँ अध्याय में दुष्टों और नैतिक रूप से सीधे व्यक्ति के विरोध के कारण ‘धर्मी’ उपयुक्त है।
- source_word: μὴ φεισώμεθα
  choice: दया न करें
  rationale: φείδομαι का मूल भाव किसी को छोड़ देना या हानि से बचाना है; विधवा के संदर्भ में ‘दया न करें’ हिन्दी में स्वाभाविक है और निर्दयता को स्पष्ट रखता है।
- source_word: χήρας
  choice: विधवा
  rationale: अनिश्चित लेख के बिना आया एकवचन यहाँ असुरक्षित वर्ग के प्रतिनिधि के रूप में समझा जाता है; हिन्दी में ‘विधवा’ स्वाभाविक है।
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: लिहाज़ न करें
  rationale: ἐντρέπομαι यहाँ लज्जा, सम्मान या संकोचवश पीछे हटने का भाव रखता है। ‘लिहाज़ करना’ वृद्धावस्था के चिह्न के प्रति सम्मान और संकोच—दोनों को समेटता है।
- source_word: πρεσβύτου
  choice: बूढ़े मनुष्य
  rationale: यहाँ पद या कार्यालय नहीं, आयु का उल्लेख है; इसलिए ‘बूढ़े मनुष्य’ स्पष्ट है।
- source_word: πολιάς
  choice: पके बालों
  rationale: πολιάς वृद्धावस्था के चिह्न रूप में सफेद या धूसर बालों को दर्शाता है। ‘पके बाल’ हिन्दी का स्वाभाविक और ठोस बिंब है।
- source_word: πολυχρονίους
  choice: बहुत वर्षों से
  rationale: शब्द दीर्घ आयु पर अतिरिक्त बल देता है। यह अनुवाद उस पुनरुक्त बल को मिटाए बिना हिन्दी में ग्रहणीय रहता है।
theological_decisions:
- issue: δίκαιον द्वारा पीड़ित व्यक्ति का नैतिक वर्णन
  choice: धर्मी
  alternative: न्यायी
  rationale: ज्ञान 2 में दुष्टों का लक्ष्य नैतिक रूप से सीधे व्यक्ति को बनाया गया है। ‘धर्मी’ उस नैतिक-धार्मिक विरोध को बनाए रखता है, जबकि ‘न्यायी’ भी संभव है।
- issue: ἐντραπῶμεν में सम्मान और लज्जा/संकोच का संबंध
  choice: लिहाज़ न करें
  alternative: सम्मान न करें / संकोच न करें
  rationale: यूनानी क्रिया में किसी के सामने लज्जित होने, उसका आदर करने या उसके कारण रुकने की अर्थ-सीमा है। ‘लिहाज़’ इस प्रसंग में जानबूझकर उस व्यापकता को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। दुष्टों के सामूहिक उकसावे को ‘आओ, हम...’ से व्यक्त किया गया है। ‘धर्मी निर्धन’ यूनानी विशेषण-समूह की निकटता बनाए रखता है; ‘पके बाल’ वृद्धावस्था के ठोस बिंब को सुरक्षित रखता है।
