  naturalness: The Hindi is modern, clear, and appropriately lively for the speech of the impious. ‘मौज-मस्ती’ suits the immediate festive, self-indulgent context. The revised first clause remains idiomatic and makes the distributive sense explicit.
  terminology: ‘मौज-मस्ती’ is a defensible contextual rendering of ἀγερωχία, while the footnote properly records the significant alternatives ‘अभिमान’ and ‘घमंड.’ ‘चिह्न,’ ‘हिस्सा,’ and ‘नसीब’ appropriately render the respective terms in accessible Hindi. The footnote anchor is correctly placed immediately after the contextually disputed term.
