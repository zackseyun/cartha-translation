- issue: भोगवादी भाषण में ἀγερωχίας का अर्थ
  choice: मौज-मस्ती
  alternative: अभिमान; घमंड
  rationale: ज्ञान 2 के निकटवर्ती प्रसंग में अधर्मी मृत्यु से पहले सुख भोगने और उत्सव मनाने की बात कर रहे हैं, इसलिए ‘मौज-मस्ती’ प्रवाह के अनुकूल है। फिर भी यूनानी शब्द की नैतिक रूप से नकारात्मक अर्थच्छाया को पादटिप्पणी में सुरक्षित रखा गया है।
