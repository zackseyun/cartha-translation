base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: hi
  text: हममें से कोई भी हमारी मौज-मस्ती[a] में अपने हिस्से से वंचित न रहे; हम हर जगह अपने आनंद के चिह्न छोड़ जाएँ, क्योंकि यही हमारा हिस्सा और यही हमारा नसीब है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अभिमान’ अथवा ‘घमंड’। यूनानी शब्द में अकड़ या अहंकार का नकारात्मक भाव हो सकता है, यद्यपि यहाँ का प्रसंग उच्छृंखल मौज-मस्ती की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  choice: भाग लेने से वंचित
  rationale: यह पद किसी हिस्से या सहभागिता से वंचित होने का भाव देता है और आगे आने वाले μερὶς तथा κλῆρος के हिस्से-वाले बिंब से मेल खाता है।
- source_word: ἀγερωχίας
  choice: मौज-मस्ती
  rationale: शब्द में अभिमान या घमंड का नकारात्मक अर्थ हो सकता है, पर इस प्रसंग में अधर्मियों का सुख-भोग का आह्वान उच्छृंखल उत्सव का भाव प्रमुख बनाता है। महत्त्वपूर्ण वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: πανταχῇ
  choice: हर जगह
  rationale: स्थान की व्यापकता व्यक्त करने वाला सहज और सीधा आधुनिक हिन्दी रूप।
- source_word: καταλίπωμεν
  choice: छोड़ जाएँ
  rationale: प्रेरणार्थक सम्भावनार्थक क्रिया के सामूहिक आह्वान और पीछे निशान रह जाने—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σύμβολα
  choice: चिह्न
  rationale: ऐसे पहचाने जा सकने वाले निशानों या संकेतों का बोध कराता है जिन्हें उत्सव मनाने वाले अपने पीछे छोड़ते हैं।
- source_word: εὐφροσύνης
  choice: आनंद
  rationale: यहाँ उत्सवी प्रसन्नता अभिप्रेत है; ‘आनंद’ सामान्य पाठक के लिए सहज है और संदर्भ में मौज-मस्ती से जुड़ा रहता है।
- source_word: μερὶς
  choice: हिस्सा
  rationale: किसी को प्राप्त भाग का सामान्य, स्पष्ट हिन्दी रूप।
- source_word: κλῆρος
  choice: नसीब
  rationale: बाँटे या ठहराए गए भाग से जीवन में मिले नसीब तक के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और μερὶς के साथ समानांतरता बनाए रखता है।
