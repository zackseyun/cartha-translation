  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: hi
  text: पर हमारा बल धार्मिकता का नियम बने[a], क्योंकि जो निर्बल है, वह अनुपयोगी सिद्ध होता है।
