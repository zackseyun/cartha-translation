    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω
  choice: हो
  rationale: εἰμί के तृतीय पुरुष आज्ञार्थक रूप को हिन्दी में सहज इच्छार्थक-आज्ञार्थक ‘हो’ से व्यक्त किया गया है।
- source_word: ἰσχὺς
  choice: बल
  rationale: ‘बल’ शारीरिक, सामाजिक या प्रभुत्वकारी सामर्थ्य—इन सभी की व्यापकता बनाए रखता है और संदर्भ में दुष्ट वक्ताओं की शक्ति-केंद्रित धारणा को अनावश्यक रूप से सीमित नहीं करता।
- source_word: νόμος
  choice: नियम
  rationale: νόμος यहाँ केवल विधिक विधान नहीं, बल्कि निर्णायक शासक मानदंड का अर्थ भी रखता है। आधुनिक हिन्दी में ‘नियम’ इस कथन को स्वाभाविक रखता है; ‘व्यवस्था’ संभव विकल्प है, पर यहाँ कुछ अधिक संस्थागत सुनाई देता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: δικαιοσύνη नैतिक सहीपन और न्याय दोनों को व्यक्त कर सकता है। मुख्य पाठ में ‘धार्मिकता’ मूल की व्यापक नैतिक धारणा और दुष्टों द्वारा उसे बल के आधार पर पुनर्परिभाषित करने की विडंबना को बनाए रखता है; ‘न्याय’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀσθενὲς
  choice: जो निर्बल है
  rationale: नपुंसकलिंग एकवचन विशेषण का संज्ञात्मक प्रयोग किसी विशेष व्यक्ति तक सीमित नहीं है। ‘जो निर्बल है’ उसी सामान्यीकृत सिद्धांत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄχρηστον
  choice: अनुपयोगी
  rationale: ἄχρηστος का मूल अर्थ ‘काम का न होना’ है। ‘अनुपयोगी’ स्पष्ट है और ‘निकम्मा’ जैसे अधिक अपमानजनक अथवा व्यक्तिनिष्ठ अर्थ को नहीं जोड़ता।
- source_word: ἐλέγχεται
  choice: सिद्ध होता है
  rationale: ἐλέγχω यहाँ उजागर या प्रमाणित किए जाने का भाव रखता है। ‘सिद्ध होता है’ निष्क्रिय अर्थ और वक्ताओं के निंदक तर्क—कि निर्बलता व्यर्थ प्रमाणित होती है—दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: δικαιοσύνη का नैतिक धार्मिकता अथवा सामाजिक न्याय के रूप में अनुवाद
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’
  rationale: यूनानी शब्द दोनों अर्थ-क्षेत्रों को समेटता है। ‘धार्मिकता’ व्यापक नैतिक सहीपन को सुरक्षित रखता है, जबकि इस सामाजिक और शक्ति-संबंधी संदर्भ में ‘न्याय’ भी प्रबल संभावना है; इसलिए विकल्प को पादटिप्पणी में दिया गया है।
- issue: दुष्ट वक्ताओं के कथन की विडंबना
  choice: ‘हमारा बल ही धार्मिकता का नियम हो’ की जarring संरचना बनाए रखना
  alternative: अर्थ को स्पष्ट करके ‘हमारा बल ही तय करे कि न्याय क्या है’
  rationale: व्याख्यात्मक विकल्प आशय स्पष्ट करता, पर νόμος और δικαιοσύνη की मूल तनावपूर्ण भाषा को समतल कर देता। मुख्य पाठ दुष्टों द्वारा बल को नैतिक मानदंड बनाने की विडंबना को पाठक के सामने खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘बल ही’ मूल कथन की जोरदार, निंदक मुद्रा व्यक्त करता है। ‘धार्मिकता का नियम’ जानबूझकर कुछ तनावपूर्ण रखा गया है, क्योंकि मूल यूनानी में दुष्ट वक्ता बल को ही सहीपन का मानदंड घोषित करते हैं।
