  source_fidelity: The draft accurately conveys the hortatory force of στεψώμεθα, the rosebuds (ῥόδων κάλυξιν), and the temporal clause ‘before they wither.’ However, ‘उनकी माला’ can point back ambiguously to the buds as a possession and shifts the direct instrumental image slightly. ‘गुलाब-कलियों की मालाएँ’ more directly expresses wreathing/crowning oneself with the buds.
  naturalness: The proposed revision is idiomatic, modern, and dignified Hindi. ‘आओ’ naturally renders the communal exhortation, and ‘पहन लें’ preserves festive self-adornment.
  terminology: ‘गुलाब-कलियाँ’ and ‘मुरझाना’ are natural and precise. ‘माला’ is an appropriate nontechnical Hindi equivalent for the Greek floral wreath/crown. The alternative footnote should not say ‘अपना मुकुट सजा लें,’ which is less idiomatic and somewhat changes the construction; ‘मालाएँ पहन लें’ is clearer.
