theological_decisions:
- issue: τῶν ὄντων ἀγαθῶν का आशय
  choice: उन अच्छी वस्तुओं ... जो मौजूद हैं
  alternative: वर्तमान अच्छी वस्तुएँ / पास उपलब्ध अच्छी वस्तुएँ
  rationale: मुख्य पाठ यूनानी की अस्तित्वसूचक भाषा सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ बताती है; इस प्रकार अस्पष्टता का अनावश्यक समाधान नहीं किया गया।
- issue: τῇ κτίσει का विस्तार
  choice: सृष्टि
  alternative: सृजा हुआ संसार
  rationale: यह अनुवाद किसी एक प्राणी या केवल भौतिक साधनों तक अर्थ को सीमित नहीं करता और रची हुई व्यवस्था के व्यापक संकेत को बनाए रखता है।
- issue: ὡς νεότητι की संक्षिप्त तुलना
  choice: जवानी के जोश के साथ
  alternative: मानो हम जवान हों / जवानी में जैसे
  rationale: ‘हमारी’ जैसा अनुपस्थित सर्वनाम नहीं जोड़ा गया; हिन्दी में अर्थपूर्ण बनाने के लिए तुलना में निहित युवा ऊर्जा को व्यक्त किया गया है।
