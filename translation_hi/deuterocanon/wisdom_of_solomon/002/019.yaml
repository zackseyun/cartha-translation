  rationale: यद्यपि क्रिया का मूल अर्थ न्याय करना है, यहाँ परीक्षा के परिणाम से गुण का आकलन करना अभिप्रेत है; ‘जाँचें’ समानांतरता और संदर्भगत अर्थ बचाता है।
- source_word: ἀνεξικακίαν
  choice: अन्याय सहने की धीरज
  rationale: यह संज्ञा विशेष रूप से बुराई या चोट को प्रतिशोध के बिना सहने का भाव रखती है; विस्तृत हिन्दी पदबंध उस विशिष्टता को स्पष्ट करता है।
