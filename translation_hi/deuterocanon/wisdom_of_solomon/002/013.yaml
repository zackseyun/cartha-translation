lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: दावा करता है
  rationale: संदर्भ में दुष्ट लोग धर्मी व्यक्ति के अपने विषय में किए गए कथन को उद्धृत कर रहे हैं। ‘दावा करता है’ कथन की सत्यता या असत्यता का निर्णय किए बिना इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
