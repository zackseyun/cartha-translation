  rationale: यहाँ संबंधकारक θεοῦ का सामान्य और स्वाभाविक हिन्दी रूप ‘परमेश्वर का’ है; यूनानी में उपपद न होने से कोई अतिरिक्त भेद आरोपित नहीं किया गया।
- source_word: παῖδα
