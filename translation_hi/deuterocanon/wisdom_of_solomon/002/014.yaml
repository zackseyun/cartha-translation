revisions:
- from: वह हमारे विचारों को दोषी ठहराने वाला बन गया है[a]; उसे देखना भी हमारे लिए भारी है[b],
  to: वह हमारे विचारों के लिए एक फटकार बन गया है[a]; उसका दिखाई देना भी हमारे लिए भारी है[b],
  rationale: Revision replaces the judicially colored, agentive “दोषी ठहराने वाला” with the noun phrase “एक फटकार,” which more closely represents εἰς ἔλεγχον and leaves its precise force open. It also uses “उसका दिखाई देना” to express βλεπόμενος naturally in Hindi while retaining the sense that even his being seen burdens them. The trailing comma is retained because the sentence continues into the next verse.
