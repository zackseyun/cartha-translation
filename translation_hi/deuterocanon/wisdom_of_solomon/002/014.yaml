translation:
  language: hi
  text: वह हमारे विचारों के लिए एक फटकार बन गया है[a]; उसका दिखाई देना भी हमारे लिए भारी है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह हमारे अंतर्मन के तर्क-विचारों के लिए एक फटकार बन गया है।” यूनानी ἔλεγχος में दोष को उजागर करने वाली फटकार का भाव हो सकता है, और ἐννοίαι का अर्थ भीतरी विचार या तर्क-विचार हो सकता है।
    reason: lexical_alternative
