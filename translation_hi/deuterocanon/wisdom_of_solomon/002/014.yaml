review_pass:
  verdict: revise
  source_fidelity: Draft correctly retains the implied masculine subject, the resultant sense of ἐγένετο, the moral exposing/reproving force of ἔλεγχος, and the parallel claim that his mere visibility is burdensome. However, “विचारों को दोषी ठहराने वाला” shifts the Greek noun phrase toward an active personal agent who pronounces a verdict, rather than saying that he has become a reproof/exposure in relation to their thoughts.
  naturalness: “उसका दिखाई देना भी हमारे लिए भारी है” is more idiomatic Hindi than the infinitive construction “उसे देखना भी ... भारी है,” while preserving the passive participial perspective of βλεπόμενος. “हमारे विचारों के लिए एक फटकार” is slightly formal but clear and appropriately close to the compact Greek construction.
  terminology: “फटकार” suitably conveys ἔλεγχος without importing formal judicial condemnation. “विचारों” preserves the breadth of ἐννοίαι. The note identifies the relevant Greek terms and presents the lexical alternatives without doctrinal expansion.
  issues:
  - severity: medium
    issue: The main text renders εἰς ἔλεγχον as “दोषी ठहराने वाला.”
    rationale: This verbal, agentive expression can imply that he actively declares their thoughts guilty. Greek has the noun ἔλεγχος (“reproof,” “rebuke,” or “exposure”), so a nominal Hindi expression better preserves both the syntax and the less judicial semantic range.
  - severity: low
    issue: The first footnote does not name the Greek terms and has an imprecise plural reference (“यूनानी शब्द ... दे सकते हैं”).
    rationale: Naming ἔλεγχος and ἐννοίαι makes the alternative transparent and accurately distinguishes the two lexical observations.
