    text: शाब्दिक भाव है, “और देखा जाता हुआ भी वह हमारे लिए भारी है”; अर्थात उसका दिखाई देना तक उनके लिए सहना कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: बन गया है
  rationale: ग्रीक भूतकालीन क्रिया यहाँ उत्पन्न हुई और वर्तमान में अनुभव की जा रही स्थिति को व्यक्त करती है। हिंदी में ‘बन गया है’ इस परिणामी भाव को स्वाभाविक रूप से रखता है।
- source_word: εἰς ἔλεγχον
  choice: दोषी ठहराने वाला
  rationale: ἔλεγχος दोष उजागर करने वाली फटकार या भर्त्सना का भाव रखता है। यहाँ उस धर्मी व्यक्ति का अस्तित्व ही उनके विचारों का दोष प्रकट करता है; यह चयन न्यायिक ‘दंडादेश’ का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐννοιῶν
  choice: विचारों
  rationale: ἐννοίαι मन के भीतर के विचार, धारणाएँ या तर्क हो सकते हैं। ‘विचारों’ सहज और व्यापक है तथा संदर्भ में निहित नैतिक दोष को अनावश्यक रूप से स्पष्ट करके नहीं जोड़ता।
- source_word: βαρύς
  choice: भारी
  rationale: शाब्दिक ‘भारी’ हिंदी में भी रूपक रूप से ‘असह्य’ या ‘कठिन’ होने का अर्थ दे सकता है और यूनानी अभिव्यक्ति की सघनता बनाए रखता है।
- source_word: βλεπόμενος
  choice: उसे देखना
  rationale: यूनानी निष्क्रिय कृदंत का शाब्दिक भाव ‘देखा जाना’ है, पर हिंदी में उसी व्यक्ति के बारे में ‘उसे देखना’ अधिक स्वाभाविक है और आशय—उसका दिखाई देना ही असह्य होना—सुरक्षित रहता है।
theological_decisions:
- issue: निहित कर्ता का संदर्भ
  choice: वह
  alternative: वह धर्मी जन
  rationale: यूनानी में कर्ता प्रसंग से निहित है और पिछले पदों के धर्मी व्यक्ति की ओर संकेत करता है। ‘वह’ मूल की अंतर्निहितता बनाए रखता है और इस पद में अनुपस्थित व्याख्यात्मक संज्ञा नहीं जोड़ता।
