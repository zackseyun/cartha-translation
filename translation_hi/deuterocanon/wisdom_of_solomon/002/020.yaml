translation:
  language: hi
  text: “आओ, हम उसे अपमानजनक मृत्यु का दण्ड दें, क्योंकि उसके कथनों के अनुसार उसकी सुधि ली जाएगी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “उसकी जाँच होगी,” “उसकी देखभाल की जाएगी,” अथवा “उसका पक्ष सही ठहराया जाएगा।” यूनानी शब्द का अर्थ व्यापक रूप से किसी की ओर ध्यान देना, उसकी जाँच करना या उसके लिए हस्तक्षेप करना हो सकता है। अंतिम खण्ड का अनुवाद यह भी हो सकता है: “उसके साथ जो होगा, उससे उसके कथन परखे जाएँगे।”'
    reason: ἐπισκοπή और ἐκ λόγων αὐτοῦ दोनों के अर्थ-संबंध में विद्यमान वास्तविक अस्पष्टता को सुरक्षित रखना।
