  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/018.yaml
  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: hi
  text: क्योंकि यदि धर्मी मनुष्य परमेश्वर का पुत्र है,[a] तो परमेश्वर उसकी सहायता करेगा और उसे उसके विरोधियों के हाथ से छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘परमेश्वर का एक पुत्र’ भी हो सकता है। यूनानी पदबंध को सामान्य पुत्रत्व के दावे या ‘परमेश्वर का पुत्र’ की उपाधि के रूप में समझा जा सकता है; हिन्दी में बड़े और छोटे अक्षरों से इन अर्थों का भेद दिखाना संभव नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: धर्मी मनुष्य
  rationale: संज्ञा के रूप में प्रयुक्त पुल्लिंग एकवचन विशेषण को प्रसंगानुकूल व्यक्त करता है; ‘धर्मी’ नैतिक और धार्मिक आशय बनाए रखता है।
- source_word: υἱὸς θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: अनिश्चित उपपद-विहीन विधेय पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में बड़े अक्षरों का भेद न होने से बाद की मसीही उपाधि को न तो आरोपित किया गया है, न निषिद्ध।
- source_word: ἀντιλήμψεται
  choice: उसकी सहायता करेगा
  rationale: क्रिया का आशय सहारा देने अथवा सहायता के लिए आगे आने का है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ῥύσεται
  choice: उसे ... छुड़ाएगा
  rationale: संकट या शत्रुओं के अधिकार से मुक्त कराने का अर्थ व्यक्त करता है और व्यापक धार्मिक अर्थ वाले ‘उद्धार’ को अनावश्यक रूप से नहीं लाता।
- source_word: ἐκ χειρὸς
  choice: के हाथ से
  rationale: अधिकार या वश को सूचित करने वाला बाइबलीय मुहावरा हिन्दी में भी सुबोध है।
- source_word: ἀνθεστηκότων
  choice: उसके विरोधियों
  rationale: उसके विरुद्ध डटे हुए लोगों की सक्रिय शत्रुता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: υἱὸς θεοῦ को सामान्य पुत्रत्व के दावे या बाद की मसीही उपाधि के रूप में समझना
  choice: मुख्य पाठ में ‘परमेश्वर का पुत्र’ रखा गया और टिप्पणी में वास्तविक व्याकरणिक-व्याख्यात्मक संभावना बताई गई।
  alternative: ‘परमेश्वर का एक पुत्र’ अथवा उपाधि के अर्थ में ‘परमेश्वर का पुत्र’
  rationale: यूनानी पदबंध प्रसंग में धर्मी मनुष्य के पुत्रत्व का दावा करता है, पर बाद की मसीही व्याख्या को अपने आप निर्णीत नहीं करता। हिन्दी लिपि में capitalization का साधन नहीं है, इसलिए टिप्पणी आवश्यक है।
- issue: ἀντιλήμψεται और ῥύσεται का कर्ता
  choice: स्पष्टता के लिए दूसरे खंड में ‘परमेश्वर’ दोहराया गया।
  alternative: सर्वनाम ‘वह’
  rationale: यूनानी में निहित कर्ता निकटवर्ती θεοῦ, अर्थात परमेश्वर, है। हिन्दी में ‘वह उसकी सहायता करेगा’ से धर्मी मनुष्य स्वयं अपना सहायक जान पड़ सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण बाइबलीय शैली। ‘के हाथ से’ मुहावरा मूल की छवि बनाए रखता है। संदिग्ध सर्वनाम से बचने के लिए परमेश्वर को स्पष्ट कर्ता बनाया गया है।
