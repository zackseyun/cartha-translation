base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: hi
  text: पर शैतान की ईर्ष्या के कारण मृत्यु संसार में आई, और जो उसके भाग के हैं वे उसका अनुभव करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जो उसके भाग के हैं, वे उसे परखते/आजमाते हैं।” यूनानी अभिव्यक्ति कठिन है। “उसे” मृत्यु की ओर संकेत करता जान पड़ता है, जबकि “उसके” सम्भवतः शैतान की ओर; आशय सम्भवतः यह है कि शैतान के पक्ष में रहने वाले मृत्यु के प्रभाव में आते हैं।'
    reason: मूल यूनानी मुहावरे और दो सर्वनामों के संकेत में विद्यमान वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: φθόνῳ
  choice: ईर्ष्या के कारण
  rationale: करण/कारण सूचक सम्प्रदान कारक को स्वाभाविक हिन्दी में व्यक्त करता है और ईर्ष्या को मृत्यु के प्रवेश का कारण बताता है।
- source_word: διαβόλου
  choice: शैतान की
  rationale: इस यहूदी-यूनानी ज्ञान-साहित्यिक सन्दर्भ में यह किसी सामान्य निन्दक के बजाय व्यक्तिगत दुष्ट सत्ता का संकेत है; आधुनिक हिन्दी में ‘शैतान’ सर्वाधिक सहज और परिचित पद है।
- source_word: θάνατος
  choice: मृत्यु
  rationale: मूल शब्द का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: संसार में आई
  rationale: प्रवेश की गति-छवि बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: πειράζουσιν
  choice: अनुभव करते हैं
  rationale: क्रिया का सामान्य अर्थ ‘परखना/आजमाना’ है, पर मृत्यु को कर्म मानकर हिन्दी में ऐसा कहना भ्रामक होगा; प्रसंग में मृत्यु की वास्तविकता या प्रभाव में आने का भाव सम्भावित है। शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: αὐτὸν
  choice: उसका
  rationale: सर्वनाम का निकटतम पूर्वपद ‘मृत्यु’ है; हिन्दी वाक्य-विन्यास में ‘उसका अनुभव’ स्वाभाविक है।
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: जो उसके भाग के हैं
  rationale: μερίς के ‘भाग/हिस्से’ के अर्थ और मूल की कठिन अभिव्यक्ति को अत्यधिक व्याख्यात्मक बनाए बिना सुरक्षित रखता है।
theological_decisions:
- issue: διάβολος की पहचान
  choice: व्यक्तिगत दुष्ट सत्ता—‘शैतान’
  alternative: कोई सामान्य निन्दक या दोष लगाने वाला
  rationale: इस प्रसंग में मृत्यु के संसार में आने को उसकी ईर्ष्या से जोड़ना स्थापित यहूदी-यूनानी प्रयोग के अनुसार व्यक्तिगत दुष्ट सत्ता की ओर संकेत करता है।
- issue: πειράζουσιν αὐτόν का आशय
  choice: वे मृत्यु का अनुभव करते हैं
  alternative: वे उसे परखते/आजमाते हैं; अथवा व्यक्तिरूप मृत्यु को ललकारते हैं
  rationale: मूल क्रिया की सामान्य अर्थ-सीमा ‘परखना/आजमाना’ है, किन्तु इस कर्म के साथ मुहावरा कठिन है। मुख्य पाठ सम्भावित प्रसंगगत अर्थ देता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता को बनाए रखती है।
- issue: ἐκείνου में सर्वनाम का संकेत
  choice: ‘उसके’ को शैतान की ओर संकेत मानना
  alternative: वाक्य की निकटता के आधार पर मृत्यु की ओर संकेत मानना
  rationale: ‘उसके भाग के’ लोगों का शैतान से सम्बद्ध होना प्रसंगगत रूप से अधिक सम्भावित है, यद्यपि यूनानी व्याकरण में दोनों संज्ञाएँ पुल्लिंग हैं; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘ईर्ष्या के कारण’ कारणात्मक सम्बन्ध को स्पष्ट करता है; ‘भाग के हैं’ मूल के औपचारिक और कुछ कठिन मुहावरे को जानबूझकर बनाए रखता है। पादटिप्पणी-चिह्न सम्बद्ध दूसरे खण्ड के बाद रखा गया है।
