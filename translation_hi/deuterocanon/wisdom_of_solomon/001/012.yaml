  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: hi
  text: अपने जीवन की भूल के कारण मृत्यु की लालसा न करो[a], और अपने हाथों के कामों से[b] अपने ऊपर विनाश न ले आओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने जीवन की भूल के कारण मृत्यु के पीछे न लगो।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “मृत्यु के लिए उत्साही होना” या “मृत्यु की उत्कट इच्छा करना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथों के काम” का अर्थ व्यापक रूप से मनुष्य के कर्म हो सकता है; यह ठोस अभिव्यक्ति मनुष्य की बनाई हुई वस्तुओं की ओर भी संकेत कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: ζηλοῦτε
  choice: पीछे न लगो
  rationale: यह क्रिया उत्साहपूर्वक चाहने, लालसा रखने या किसी वस्तु के पीछे लगने का भाव दे सकती है। मृत्यु के संदर्भ में यह चुनाव सक्रिय और आत्मघाती आकर्षण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: यूनानी संज्ञा का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ἐν πλάνῃ
  choice: भटकाव में
  rationale: πλάνη में भटकाव, भूल और भ्रम के अर्थ संभव हैं। ‘भटकाव में’ स्थान अथवा परिस्थिति और साधन—दोनों संभावित संबंधों को पूरी तरह बंद नहीं करता।
- source_word: ζωῆς ὑμῶν
  choice: अपने जीवन के
  rationale: बहुवचन संबोधन को हिन्दी के सामूहिक प्रयोग में स्वाभाविक रूप से व्यक्त करता है और इसे πλάνῃ से जोड़ता है।
- source_word: ἐπισπᾶσθε
  choice: अपने ऊपर न खींच लाओ
  rationale: 'मध्यवाच्य क्रिया का आत्म-संबंधी बल सुरक्षित रहता है: संबोधित लोग अपने ही ऊपर विनाश लाते हैं।'
- source_word: ὄλεθρον
  choice: विनाश
  rationale: यह शब्द घातक बरबादी या नाश को दर्शाता है; ‘विनाश’ स्पष्ट और गंभीर है तथा अनावश्यक तकनीकी धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: अपने हाथों के कामों से
  rationale: मूल की ठोस शारीरिक उपमा सुरक्षित रहती है, जबकि यह सामान्य मानवीय कर्मों और मनुष्य की बनाई वस्तुओं—दोनों की संभावित ओर संकेत कर सकती है।
theological_decisions:
- issue: ζηλόω को शाब्दिक ‘मृत्यु के लिए उत्साही न बनो’ कहने या आत्म-विनाशकारी खोज को मुहावरेदार ढंग से व्यक्त करने का प्रश्न
  choice: मृत्यु के पीछे न लगो
  alternative: मृत्यु की लालसा न करो
  rationale: चुना हुआ पाठ क्रिया में निहित सक्रिय अभिलाषा को सहज हिन्दी में व्यक्त करता है; फुटनोट अधिक शाब्दिक अर्थ को खुला रखता है।
- issue: ἐπισπᾶσθε के मध्यवाच्य बल को व्यक्त करना
  choice: विनाश को अपने ऊपर न खींच लाओ
  alternative: अपने लिए विनाश न ले आओ
  rationale: यह रूप स्पष्ट करता है कि मनुष्य अपने कर्मों द्वारा स्वयं अपने ऊपर विनाश लाते हैं, बिना विनाश के स्वरूप के विषय में अतिरिक्त धर्मवैज्ञानिक दावा किए।
