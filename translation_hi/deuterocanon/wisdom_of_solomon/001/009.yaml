lexical_decisions:
- source_word: διαβουλίοις
  choice: योजनाओं
  rationale: यह शब्द सोच-विचार से बनी योजनाओं या मंसूबों को दर्शाता है। संदर्भ में नकारात्मक भाव है, पर ‘योजनाओं’ मूल की व्यापकता बनाए रखता है; अधिक नकारात्मक ‘षड्यंत्रों’ को पादटिप्पणी में रखा गया है।
- source_word: ἀσεβοῦς
  choice: भक्तिहीन मनुष्य
  rationale: यह एकवचन विशेषण धार्मिक और नैतिक अर्थ में ऐसे व्यक्ति को दर्शाता है जो परमेश्वर का आदर नहीं करता। ‘भक्तिहीन मनुष्य’ एकवचन और धार्मिक आयाम दोनों सुरक्षित रखता है।
- source_word: ἐξέτασις
  choice: जाँच
  rationale: यह गहरी छानबीन या परीक्षण का बोध देता है। ‘जाँच’ आधुनिक हिन्दी में सहज है और न्यायिक गंभीरता भी रखता है।
- source_word: λόγων
  choice: बातों
  rationale: ‘बातों’ बोले गए वचनों के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और निकटवर्ती संदर्भ में वाणी पर बल बनाए रखता है।
- source_word: ἀκοὴ
  choice: खबर
  rationale: शाब्दिक अर्थ ‘सुनना/सुनाई पड़ना’ है, पर यहाँ आशय उसकी कही बातों के प्रभु के सामने पहुँचने से है। ‘खबर’ इस अर्थ को सहज रूप से व्यक्त करती है।
- source_word: Κύριον
  choice: प्रभु
  rationale: κύριος के लिए स्थापित, गरिमापूर्ण हिन्दी पद ‘प्रभु’ रखा गया है।
- source_word: ἔλεγχον
  choice: उजागर हों
  rationale: यह शब्द प्रमाणित करने, दोष प्रकट करने, खंडन या ताड़ना का अर्थ दे सकता है। यहाँ उद्देश्यात्मक εἰς के साथ परिणाम को स्वाभाविक हिन्दी में ‘उजागर हों’ कहा गया है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἀνομημάτων
  choice: अधर्म के काम
  rationale: यह व्यवस्था-विरोधी अपराधों या दुष्कर्मों का ठोस बहुवचन है। ‘अधर्म के काम’ धार्मिक-नैतिक और कर्मगत दोनों आयाम स्पष्ट करता है।
theological_decisions:
- issue: ἀσεβοῦς और αὐτοῦ में जातिवाचक एकवचन
  choice: ‘भक्तिहीन मनुष्य ... उसकी ... उसके’ के रूप में एकवचन रखा गया।
  alternative: जातिवाचक बहुवचन—‘भक्तिहीन लोग ... उनकी ... उनके’।
  rationale: यूनानी पाठ एकवचन को सामान्य प्रतिनिधि के रूप में इस्तेमाल करता है। हिन्दी में ‘मनुष्य’ और एकवचन सर्वनाम इसे स्पष्ट तथा स्वाभाविक रखते हैं; इसे केवल पुरुषों तक सीमित करने का आशय नहीं है।
- issue: ἔλεγχον का न्यायिक और नैतिक अर्थ
  choice: मुख्य पाठ में ‘उजागर हों’।
  alternative: ‘दोष सिद्ध हो’ या ‘ताड़ना हो’।
  rationale: मूल शब्द दोष के प्रकाशन, प्रमाण और फटकार के बीच अर्थगत तनाव रखता है। मुख्य पाठ में प्रकाशन का भाव लिया गया है और वैकल्पिक न्यायिक/अनुशासनात्मक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। वाक्य में न्यायिक जाँच का भाव है, पर अत्यधिक कानूनी शब्दावली से बचा गया है। ‘भक्तिहीन’ धार्मिक संदर्भ को बनाए रखता है और ‘अधर्म के काम’ ठोस बहुवचन कर्मों को स्पष्ट करता है।
