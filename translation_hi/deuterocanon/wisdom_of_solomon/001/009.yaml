  text: क्योंकि भक्तिहीन मनुष्य की योजनाओं[a] की जाँच होगी, और उसकी बातों की खबर[b] प्रभु तक उसके अधर्म के कामों को उजागर करने[c] के लिए पहुँचेगी।
