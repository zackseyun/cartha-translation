- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: जो उसकी परीक्षा नहीं लेते
  rationale: πειράζω का अर्थ जाँचना, परीक्षा लेना, या कुछ संदर्भों में प्रलोभित करना हो सकता है। यहाँ परमेश्वर को चुनौती देकर परखने का भाव है; ‘परीक्षा लेना’ मूल अर्थ की व्यापकता को बनाए रखता है।
- source_word: ἐμφανίζεται
  choice: उन पर वह अपने आपको प्रकट करता है
  rationale: क्रिया के प्रकट होने अथवा स्वयं को ज्ञात कराने के व्यक्तिगत भाव को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: जो उस पर अविश्वास नहीं करते
  rationale: ἀπιστέω में विश्वास न करना, भरोसा न रखना, अथवा अविश्वासी होना सम्मिलित हो सकता है। यह अनुवाद बौद्धिक अविश्वास और संबंधपरक भरोसे की कमी—दोनों की गुंजाइश बनाए रखता है।
- source_word: ὅτι
