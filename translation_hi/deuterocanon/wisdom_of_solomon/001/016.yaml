translation:
  language: hi
  text: परन्तु अधर्मियों ने अपने हाथों और अपनी बातों से उसे[a] अपने पास बुलाया; उसे मित्र मानकर वे क्षीण होते गए, और उन्होंने उसके साथ संधि की[b], क्योंकि वे उसके हिस्से में होने के योग्य हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उसे’ पिछले प्रसंग में मानवीकृत ‘मृत्यु’ की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: या, “उसके साथ एक करार किया।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके भागी होने के योग्य हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: भक्तिहीन लोग
  rationale: यह धार्मिक और नैतिक अवज्ञा दोनों का भाव रखता है तथा केवल सामान्य दुष्टता तक अर्थ को सीमित नहीं करता।
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: अपने हाथों और अपनी बातों से
  rationale: यूनानी पाठ में हाथ और वचन का ठोस समानांतर है; यह अनुवाद उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προσεκαλέσαντο αὐτόν
  choice: उसे अपने पास बुलाया
  rationale: मध्यवाच्य रूप किसी को अपनी ओर बुलाने या आमंत्रित करने का संकेत देता है; यह रूप केवल सामान्य पुकारने से अधिक स्पष्ट है।
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: उसे मित्र मानकर
  rationale: यह ἡγέομαι के ‘मानना/समझना’ और φίλος के ‘मित्र’ अर्थ को संक्षिप्त तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐτάκησαν
  choice: वे क्षीण होते गए
  rationale: क्रिया में गलने, मिटने या क्षीण होने का बिंब है; यह चयन आत्म-विनाश की प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: उन्होंने उसके साथ वाचा बाँधी
  rationale: συνθήκη औपचारिक और बाध्यकारी समझौते को दर्शाता है। ‘वाचा बाँधी’ उसकी गंभीरता और मृत्यु के साथ गठबंधन की विडंबना बनाए रखता है।
- source_word: ἄξιοί εἰσιν τῆς ἐκείνου μερίδος εἶναι
  choice: वे उसके भाग में होने के योग्य हैं
  rationale: यह ἄξιος की योग्यता/पात्रता और μερίς के भाग या हिस्से, दोनों को निकटता से सुरक्षित रखता है तथा विडंबना को खुला छोड़ता है।
theological_decisions:
- issue: पूरे पद में αὐτόν का संदर्भ
  choice: मुख्य पाठ में पुल्लिंग सर्वनाम ‘उसे/उसके’ रखा गया है और पादटिप्पणी में उसका संदर्भ मृत्यु बताया गया है।
  alternative: मुख्य पाठ में हर स्थान पर ‘मृत्यु’ लिखना।
  rationale: पिछले प्रसंग में मृत्यु का मानवीकरण हुआ है, जबकि इस पद का यूनानी पाठ सर्वनाम का प्रयोग करता है। सर्वनाम रखने से साहित्यिक निरंतरता और स्रोत की अभिव्यक्ति सुरक्षित रहती है।
- issue: συνθήκη के लिए वाचागत भाषा
  choice: वाचा
  alternative: संधि अथवा समझौता
  rationale: यह शब्द गठबंधन की औपचारिक गंभीरता और भक्तिहीनों द्वारा मृत्यु से संबंध बाँधने की विडंबना को बनाए रखता है, बिना इसे परमेश्वर की वाचा ठहराए।
- issue: ἐτάκησαν में निहित विनाश का स्वरूप
  choice: क्षीण होते गए
  alternative: घुल गए अथवा उसके लिए तड़पते रहे
  rationale: यूनानी क्रिया गलने या क्षीण होने का बिंब देती है। चयन उस बिंब को रखता है, पर यह निर्धारित नहीं करता कि क्षीणता शारीरिक, नैतिक या रूपकात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘हाथों और बातों’ का ठोस समानांतर, मृत्यु का मानवीकरण और ‘भाग’ की जानबूझकर खुली हुई छवि सुरक्षित रखी गई है।
