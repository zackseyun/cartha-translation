  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: hi
  text: क्योंकि बुराई रचने वाली आत्मा में बुद्धि प्रवेश नहीं करेगी,[a] और न पाप के अधीन शरीर में निवास करेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई में निपुण,” “कुटिल,” अथवा “दुष्ट आत्मा में।” यूनानी शब्द का अधिक शाब्दिक भाव है—बुराई रचने में कुशल।
    reason: lexical_alternative
  - marker: b
    text: या “पाप के वश में पड़े,” “पाप का ऋणी,” अथवा “पाप से बँधे शरीर में।” यूनानी पद पाप के दावे या नियंत्रण के नीचे होने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: बुराई की योजनाएँ गढ़ने वाले
  rationale: यह विशेषण केवल सामान्य दुष्टता नहीं, बल्कि बुराई रचने या गढ़ने की प्रवृत्ति व्यक्त करता है। यह हिन्दी प्रयोग उस सक्रिय और नैतिक रूप से विकृत चतुराई को स्पष्ट रखता है।
- source_word: ψυχὴν
  choice: प्राण
  rationale: यहाँ ψυχή व्यक्ति के भीतरी जीवन या आत्मगत स्वरूप को सूचित करता है। ‘प्राण’ गरिमापूर्ण और बोधगम्य है तथा अगले खंड के ‘शरीर’ से मूल का भेद बनाए रखता है।
- source_word: εἰσελεύσεται
  choice: प्रवेश नहीं करेगी
  rationale: भविष्यकाल और स्थानगत रूपक—बुद्धि का किसी के भीतर प्रवेश करना—दोनों सुरक्षित रहते हैं।
- source_word: σοφία
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में σοφία के लिए स्वाभाविक और प्रचलित हिन्दी शब्द; यहाँ व्यावहारिक तथा नैतिक विवेक दोनों का भाव है।
- source_word: κατοικήσει
  choice: निवास करेगी
  rationale: क्रिया स्थायी रूप से रहने का भाव देती है और केवल ‘प्रवेश’ करने से आगे के टिके हुए वास को दर्शाती है।
- source_word: σώματι
  choice: शरीर
  rationale: सीधा अर्थ है और मूल में प्राण तथा शरीर के साहित्यिक भेद को बनाए रखता है।
- source_word: κατάχρεῳ
  choice: वश में पड़े
  rationale: यह पाप के दावे, अधीनता या नियंत्रण के नीचे होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘दास’ रूपक को मूल से अधिक निश्चित किए।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: जननकारक संज्ञा का सीधा और धर्मवैचारिक रूप से तटस्थ अनुवाद।
theological_decisions:
- issue: प्राण और शरीर का भेद
  choice: ‘प्राण’ और ‘शरीर’ दोनों अलग शब्दों के रूप में रखे गए हैं।
  alternative: ψυχή को ‘मनुष्य’, ‘मन’ या ‘भीतरी व्यक्तित्व’ कहना।
  rationale: यूनानी पाठ दोनों को स्पष्ट रूप से अलग रखता है; अनुवाद इस साहित्यिक और नैतिक तनाव को सुरक्षित रखता है, पर इससे किसी पूर्ण शरीर-आत्मा द्वैतवाद का निष्कर्ष नहीं जोड़ता।
- issue: κατάχρεῳ ἁμαρτίας का बल
  choice: ‘पाप के वश में पड़े’
  alternative: ‘पाप के अधीन’, ‘पाप का ऋणी’ या ‘पाप से बँधा हुआ’।
  rationale: κατάχρεος में ऋण, दायित्व और अधीनता की अर्थ-छायाएँ हैं। चुना गया वाक्यांश पाप के नियंत्रण को स्पष्ट करता है, पर ‘गुलाम’ कहकर रूपक को अनावश्यक रूप से तीखा नहीं बनाता।
