  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘बुराई की योजनाएँ गढ़ने वाले प्राण’ मूल के असामान्य संयुक्त विशेषण को स्पष्ट करता है। ‘निवास करेगी’ प्रवेश और स्थायी वास के बीच मूल का अंतर बनाए रखता है।
