base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: hi
  text: क्योंकि बुद्धि मनुष्यों से प्रेम करने वाली आत्मा है,[a] और वह निन्दक को उसके होंठों से निकली बातों के कारण निर्दोष नहीं ठहराएगी; क्योंकि परमेश्वर उसके अंतरतम का साक्षी, उसके हृदय का सच्चा निरीक्षक और उसकी जीभ की बातें सुनने वाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का अर्थ है कि बुद्धि मानवजाति के प्रति प्रेम और हितैषिता रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: मनुष्यों से प्रेम करने वाली
  rationale: यह विशेषण मानवजाति के प्रति प्रेम और हितैषिता व्यक्त करता है; यह सक्रिय अर्थ को स्वाभाविक, समावेशी हिन्दी में बनाए रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ शब्द अनिश्चित और विधेयात्मक है। छोटे अक्षर का भेद हिन्दी में उपलब्ध नहीं है; प्रसंग में इसे पवित्र आत्मा की स्पष्ट पहचान बनाए बिना सामान्य ‘आत्मा’ के रूप में रखा गया है।
- source_word: σοφία
  choice: बुद्धि
  rationale: σοφία का मानक बाइबिलीय अर्थ; प्रसंग में मानवीकृत होते हुए भी इसे अमूर्त संज्ञा के रूप में बनाए रखा गया है।
- source_word: οὐκ ἀθῳώσει
  choice: निर्दोष न ठहराएगी
  rationale: क्रिया का न्यायिक भाव है—किसी को दोषरहित घोषित करना या दण्ड से मुक्त मानना। यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: βλάσφημον
  choice: निन्दक
  rationale: यह परमेश्वर के विरुद्ध अनादरपूर्ण या निन्दात्मक वचन बोलने वाले व्यक्ति को सूचित करता है। ‘निन्दक’ संक्षिप्त और परिचित बाइबिलीय शब्द है।
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: उसके होंठों के कारण
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक संदिग्ध है। यह अनुवाद उसके होंठों से निकले निन्दात्मक वचनों को दोष का कारण मानने वाली सम्भावित कारणवाचक शक्ति को बनाए रखता है।
- source_word: νεφρῶν
  choice: अंतरतम
  rationale: शाब्दिक अर्थ ‘गुर्दे’ है, पर यह छिपे हुए भीतरी मनुष्य—विचारों, भावों और अभिप्रायों—का प्राचीन मुहावरा है। ‘अंतरतम’ अर्थ को किसी एक मनोवैज्ञानिक पक्ष तक सीमित नहीं करता।
- source_word: μάρτυς
  choice: साक्षी
  rationale: यह न्यायिक शब्द है और पद में परमेश्वर की सर्वज्ञ जाँच तथा न्याय के भाव के अनुकूल है।
- source_word: ἐπίσκοπος ἀληθής
  choice: सच्चा निरीक्षक
  rationale: यहाँ ἐπίσκοπος ध्यानपूर्वक देखने और जाँचने वाले को दर्शाता है; ‘निरीक्षक’ कलीसियाई पदवी का अनावश्यक संकेत दिए बिना यह अर्थ रखता है।
- source_word: καρδίας
  choice: हृदय
  rationale: भीतरी व्यक्ति, विचार और इच्छा के केंद्र के लिए मानक बाइबिलीय पद।
- source_word: ἀκουστής
  choice: सुनने वाला
  rationale: यह संज्ञात्मक समानांतरता को स्वाभाविक हिन्दी में व्यक्त करता और परमेश्वर द्वारा वाणी सुने जाने की मूर्त छवि बनाए रखता है।
- source_word: γλώσσης
  choice: जीभ
  rationale: शाब्दिक शारीरिक बिम्ब ‘होंठों’ के समानांतर है और हिन्दी में वाणी के लिए सहज लक्षणा है।
theological_decisions:
- issue: क्या πνεῦμα σοφία बुद्धि की स्पष्ट पहचान पवित्र आत्मा से कराता है
  choice: ‘बुद्धि ... आत्मा है’ रखा गया, पर ‘पवित्र आत्मा’ नहीं जोड़ा गया।
  alternative: ‘बुद्धि पवित्र आत्मा है’ या ‘बुद्धि प्रेमपूर्ण स्वभाव है।’
  rationale: यूनानी पाठ बुद्धि को आत्मा के रूप में चित्रित और मानवीकृत करता है, पर इसी पद में बाद की त्रिएकतावादी पहचान को स्पष्ट नहीं करता। अनुवाद उस धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: τῶν νεφρῶν αὐτοῦ के मानवशास्त्रीय मुहावरे का अर्थ
  choice: ‘उसके अंतरतम’
  alternative: ‘उसके गुर्दों’ या ‘उसके भीतरी अभिप्रायों’
  rationale: शाब्दिक रूप आधुनिक हिन्दी में भ्रामक होगा, जबकि केवल ‘अभिप्राय’ कहना अर्थ को संकरा कर सकता है। ‘अंतरतम’ परमेश्वर द्वारा छिपे भीतरी व्यक्ति को जानने का व्यापक भाव रखता है।
- issue: ἀπὸ χειλέων αὐτοῦ का वाक्यगत सम्बन्ध
  choice: इसे कारणवाचक रूप में ‘उसके होंठों के कारण’ अनूदित किया गया।
  alternative: ‘उसके होंठों से निकली बातों के लिए’ या केवल ‘उसके होंठों से।’
  rationale: वाक्यांश संक्षिप्त है और कारण अथवा स्रोत दोनों का संकेत दे सकता है। मुख्य पाठ में सम्भावित कारणवाचक अर्थ रखा गया और पादटिप्पणी में वैकल्पिक स्पष्टता दी गई है।
