  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘बुद्धि’ का स्त्रीलिंग मानवीकरण और न्यायिक शब्दावली सुरक्षित हैं। शारीरिक बिम्बों में ‘होंठ’ और ‘जीभ’ रखे गए हैं, जबकि अपारदर्शी ‘गुर्दे’ मुहावरे को मुख्य पाठ में अर्थानुसार देकर पादटिप्पणी में शाब्दिक रूप बताया गया है।
