lexical_decisions:
- source_word: σκολιοὶ λογισμοὶ
  choice: कुटिल विचार
  rationale: σκολιοί नैतिक टेढ़ेपन या विकृति को और λογισμοί विचारों अथवा तर्क-वितर्कों को व्यक्त करता है। ‘कुटिल विचार’ सहज, सजीव और प्रसंगानुकूल है।
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: मनुष्य को परमेश्वर से अलग कर देते हैं
  rationale: क्रिया का सीधा अर्थ ‘अलग करना’ है। हिन्दी में कर्म को स्पष्ट करने के लिए ‘मनुष्य को’ जोड़ा गया है; इससे कोई अतिरिक्त धर्मवैज्ञानिक धारणा नहीं आती।
- source_word: δοκιμαζομένη
  choice: जब ... को परखा जाता है
  rationale: कृदन्त के कर्मवाच्य अर्थ को कालसूचक उपवाक्य के रूप में रखा गया है, जिससे हिन्दी स्वाभाविक रहती है और सामर्थ्य को जाँचने या चुनौती देने का भाव बना रहता है।
- source_word: ἡ δύναμις
  choice: उसकी सामर्थ्य
  rationale: यूनानी में शाब्दिक रूप से ‘वह सामर्थ्य’ है, पर ठीक पहले परमेश्वर का उल्लेख होने से उसी की सामर्थ्य अभिप्रेत होना स्वाभाविक है।
- source_word: ἐλέγχει
  choice: दोषी सिद्ध करती है
  rationale: क्रिया में उजागर करने, गलत सिद्ध करने और दोष प्रकट करने का अर्थ-क्षेत्र है। ‘दोषी सिद्ध करती है’ पद का निर्णायक बल बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοὺς ἄφρονας
  choice: मूर्खों
  rationale: यह उन लोगों को सूचित करता है जिनमें बुद्धि या विवेक का अभाव है। ‘मूर्खों’ ज्ञान-साहित्य के प्रसंग में सीधा और स्वाभाविक है।
theological_decisions:
- issue: ἡ δύναμις का संबंध
  choice: इसे परमेश्वर की सामर्थ्य मानकर ‘उसकी सामर्थ्य’ कहा गया है।
  alternative: ‘वह सामर्थ्य’—इसे व्याकरणतः अनिर्दिष्ट रखना।
  rationale: निकटतम पूर्वपद θεοῦ है, इसलिए परमेश्वर की सामर्थ्य का संकेत प्रबल है; सर्वनाम अर्थ को स्पष्ट करता है, नई धर्मवैज्ञानिक बात नहीं जोड़ता।
- issue: ἐλέγχει का न्याय-संबंधी बल
  choice: ‘दोषी सिद्ध करती है’
  alternative: ‘उजागर कर देती है’ या ‘गलत सिद्ध करती है’
  rationale: यूनानी क्रिया दोष प्रकट करने और खंडन करने दोनों का भाव रख सकती है। मुख्य पाठ में इसका सशक्त अर्थ रखा गया है और व्यापक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
