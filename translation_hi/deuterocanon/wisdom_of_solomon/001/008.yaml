  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/008.yaml
  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: hi
  text: इसलिए जो कोई अधर्म की बातें बोलता है, वह छिपा न रह सकेगा[a]; और दोष सिद्ध करने वाला न्याय उसे अनदेखा करके आगे न निकल जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्यायपूर्ण बातें कहने वाला कोई भी व्यक्ति नज़र से बच न सकेगा।”
    reason: lexical_alternative
  - marker: b
    text: “न्याय” को यहाँ मानवीकृत रूप में भी समझा जा सकता है; या भावार्थ, “दोष सिद्ध करने वाला न्यायिक निर्णय उसे छोड़कर आगे नहीं बढ़ेगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्षात्मक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φθεγγόμενος ἄδικα
  choice: जो कोई अधर्म की बातें बोलता है
  rationale: कृदंत को स्वाभाविक सम्बन्धवाचक उपवाक्य बनाया गया है; ‘अधर्म की बातें’ नैतिक और न्यायिक दोनों भावों को बनाए रखता है।
- source_word: οὐδεὶς μὴ λάθῃ
  choice: वह छिपा न रह सकेगा
  rationale: λανθάνω के ‘नज़र से बचना/छिपा रहना’ अर्थ और यूनानी के प्रबल भविष्य-निषेध को व्यक्त करता है।
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: उसे अनदेखा करके आगे न निकल जाएगा
  rationale: παροδεύω के शाब्दिक ‘पास से निकल जाना’ और प्रसंगगत ‘अनदेखा करना’ दोनों पक्षों को एक स्वाभाविक हिन्दी वाक्यांश में सुरक्षित रखता है।
- source_word: ἐλέγχουσα
  choice: दोष सिद्ध करने वाला
  rationale: न्यायिक प्रसंग में ἐλέγχω के दोष प्रकट करने अथवा सिद्ध करने के अर्थ को व्यक्त करता है और कृदंत का संबंध ‘न्याय’ से बनाए रखता है।
- source_word: ἡ δίκη
  choice: न्याय
  rationale: यह नैतिक व्यवस्था, न्यायिक निर्णय और संभावित मानवीकरण की व्यापकता को ‘दण्ड’ जैसे संकुचित विकल्प से बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: ἄδικα और δίκη के नैतिक तथा न्यायिक तनाव को सुरक्षित रखना
  choice: मुख्य पाठ में ‘अधर्म की बातें’ और ‘न्याय’
  alternative: ‘अन्यायपूर्ण बातें’ और ‘दण्ड/न्यायिक निर्णय’
  rationale: ‘अधर्म’ नैतिक टेढ़ेपन को और ‘न्याय’ न्यायिक उत्तरदायित्व को व्यक्त करता है, बिना इसे केवल कानूनी अपराध या केवल दण्ड तक सीमित किए।
- issue: ἡ δίκη के संभावित मानवीकरण को व्यक्त करना
  choice: ‘दोष सिद्ध करने वाला न्याय’
  alternative: ‘जब न्याय दोष सिद्ध करता है’ अथवा ‘दोष सिद्ध करता हुआ न्याय’
  rationale: यूनानी में न्याय को सक्रिय कर्ता के रूप में प्रस्तुत किया गया है। मुख्य अनुवाद इस रूपक को बनाए रखता है; पादटिप्पणी अमूर्त ‘न्यायिक निर्णय’ की सम्भावना बताती है।
