base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: hi
  text: हे पृथ्वी का न्याय करनेवालो[b], धार्मिकता[a] से प्रेम करो; भले मन से प्रभु के विषय में विचार करो, और निष्कपट हृदय[c] से उसे खोजो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।” यूनानी शब्द δικαιοσύνη नैतिक धार्मिकता और न्याय—दोनों का बोध करा सकता है; पृथ्वी का न्याय करनेवालों से सम्बोधन होने के कारण यहाँ “न्याय” भी उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “हे पृथ्वी के शासको।” शाब्दिक रूप से, “हे पृथ्वी का न्याय करनेवालो।”
    reason: lexical_alternative
  - marker: c
    text: या, “एकनिष्ठ हृदय से” अथवा “सरल हृदय से।” यूनानी पद कपटहीन, सीधा और अविभाजित हृदय सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: प्रेम करो
  rationale: आज्ञार्थक क्रिया के सीधे नैतिक आग्रह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह शब्द नैतिक खराई और न्याय—दोनों का अर्थ दे सकता है। मुख्य पाठ में व्यापक नैतिक-धार्मिक अर्थ रखा गया है और संदर्भानुकूल ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: हे पृथ्वी का न्याय करनेवालो
  rationale: यूनानी वाक्यांश का शाब्दिक आशय बनाए रखता है। इससे शासकों या न्यायाधीशों की संभावित ओर संकेत रहता है, पर उसे किसी एक पदवी तक सीमित नहीं किया जाता।
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: प्रभु के विषय में विचार करो
  rationale: φρονέω के चिंतनशील भाव और περί के ‘विषय में’ अर्थ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν ἀγαθότητι
  choice: भले मन से
  rationale: ἀγαθότης की भलाई या सद्भावपूर्ण मनोवृत्ति को मुहावरेदार हिन्दी में व्यक्त करता है; शाब्दिक ‘भलाई में’ यहाँ कम स्वाभाविक होता।
- source_word: ἐν ἁπλότητι καρδίας
  choice: निष्कपट हृदय से
  rationale: ἁπλότης के सरलता, निष्कपटता और अविभाजित निष्ठा के भाव को संप्रेषित करता है, बिना आधुनिक हिन्दी में बौद्धिक ‘सरलता’ का भ्रामक अर्थ पैदा किए।
- source_word: ζητήσατε αὐτόν
  choice: उसे खोजो
  rationale: ζητέω के गंभीर और सक्रिय खोज के भाव को सीधे रूप में रखता है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: सम्बोधन न्याय करनेवालों से है, इसलिए ‘न्याय’ संदर्भ में प्रबल विकल्प है; फिर भी ‘धार्मिकता’ शब्द के व्यापक नैतिक और ईश्वर-संबंधी अर्थ को बनाए रखती है।
- issue: οἱ κρίνοντες τὴν γῆν का अभिप्राय
  choice: पृथ्वी का न्याय करनेवालो
  alternative: पृथ्वी के शासको
  rationale: संदर्भ शासकों की ओर संकेत कर सकता है, लेकिन यूनानी पाठ स्पष्ट रूप से ‘न्याय करनेवालों’ कहता है; इसलिए मुख्य पाठ संभावित राजनीतिक व्याख्या को अनिवार्य नहीं बनाता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस ईश्वर-संबंधी प्रसंग में ‘प्रभु’ κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- issue: ἁπλότης καρδίας की अंतर्निहित छवि
  choice: निष्कपट हृदय
  alternative: एकनिष्ठ हृदय
  rationale: मुख्य पाठ कपटहीनता को स्पष्ट करता है, जबकि पादटिप्पणी अविभाजित या एकनिष्ठ मन की वास्तविक अर्थ-छाया को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष आज्ञार्थक लहजा अपनाया गया है। ‘हे’ सम्बोधन को स्पष्ट करता है; ‘भले मन से’ शाब्दिकता और स्वाभाविक हिन्दी के बीच संतुलन रखता है। सभी वास्तविक अर्थ-विकल्प पादटिप्पणियों में सुरक्षित हैं।
