base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: hi
  text: क्योंकि उसने सब कुछ इस उद्देश्य से रचा कि वे अस्तित्व में हों, और संसार की सृष्टियाँ जीवनदायी हैं[a]; उनमें विनाश का कोई विष नहीं है, और पृथ्वी पर अधोलोक का प्रभुत्व नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संसार के प्राणी कल्याणकारी हैं,” अथवा “सृष्टि की उपज हितकारी है।” यूनानी पद व्यापक है और संसार में उत्पन्न वस्तुओं, प्राणियों या उनकी उत्पत्तियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अधोलोक का राज्य।” यूनानी शब्द राज्य-क्षेत्र या शासन करने वाली शक्ति—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: रचा
  rationale: यह क्रिया किसी वस्तु को अस्तित्व में लाने का भाव रखती है; ‘रचा’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में सृजन का अर्थ व्यक्त करता है।
- source_word: εἰς τὸ εἶναι
  choice: इसलिए ... कि वह अस्तित्व में रहे
  rationale: यह उद्देश्य अथवा आशय व्यक्त करने वाली रचना है और सृष्टि का लक्ष्य अस्तित्व है, विनाश नहीं। हिन्दी में एकवचन ‘वह’ समष्टिवाचक ‘सब कुछ’ से मेल खाता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह समस्त सृष्ट वस्तुओं को समेटने वाली व्यापक अभिव्यक्ति है और हिन्दी में सहज है।
- source_word: σωτήριοι
  choice: जीवनदायी
  rationale: यहाँ शब्द सृष्टि की हितकारी, सुरक्षित रखने वाली और विनाश-विरोधी प्रकृति बताता है। ‘जीवनदायी’ निकटवर्ती मृत्यु-विनाश के विरोध को स्पष्ट रखता है, पर बाद की विशिष्ट उद्धार-धारणा नहीं थोपता।
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: संसार की उत्पत्तियाँ
  rationale: γένεσις की बहुवचन संरचना और उसके व्यापक अर्थ—उत्पत्तियाँ, उत्पन्न वस्तुएँ अथवा सृष्टि की उपज—को निकटता से सुरक्षित रखा गया है। असामान्य किंतु अर्थपूर्ण बहुवचन मूल की अस्पष्टता बनाए रखता है।
- source_word: φάρμακον ὀλέθρου
  choice: विनाश का कोई विष
  rationale: इस संदर्भ में φάρμακον हानिकारक द्रव्य है। यह अनुवाद संबंधकारक संरचना को रखता और जीवनदायी सृष्टि के साथ विरोध स्पष्ट करता है।
- source_word: ᾅδου βασίλειον
  choice: अधोलोक का कोई प्रभुत्व
  rationale: ᾅδης के लिए ‘अधोलोक’ आधुनिक हिन्दी पाठक को बोधगम्य है, जबकि ‘प्रभुत्व’ βασίλειον के शासन अथवा अधिकार के भाव को व्यक्त करता है और उसे केवल स्थान नहीं बनाता।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: यह पृथ्वी के क्षेत्र में अधोलोक के प्रभुत्व का निषेध स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सृष्टि-संदर्भ में σωτήριοι का अर्थ
  choice: जीवनदायी
  alternative: हितकारी; कल्याणकारी; उद्धारकारी
  rationale: आस-पास का संदर्भ सृष्टि, विनाश और मृत्यु के विरोध पर केंद्रित है। ‘जीवनदायी’ इस तनाव को रखता है और पद में स्पष्ट न की गई विकसित उद्धार-संबंधी धारणा नहीं जोड़ता।
- issue: ᾅδης और βασίλειον का निरूपण
  choice: अधोलोक का प्रभुत्व
  alternative: अधोलोक का राज्य; मृत्यु का अधिकार; हेडीस का प्रभुत्व
  rationale: मूल में ᾅδης है और βασίλειον राज्य या शासन-शक्ति दोनों का अर्थ दे सकता है। ‘अधोलोक का प्रभुत्व’ मृत्यु मात्र या कब्र तक अर्थ को सीमित किए बिना शासन के भाव को बनाए रखता है।
- issue: αἱ γενέσεις τοῦ κόσμου की व्यापकता
  choice: संसार की उत्पत्तियाँ
  alternative: संसार के प्राणी; सृष्टि की उपज; संसार की उत्पन्न वस्तुएँ
  rationale: मूल पद उत्पत्ति की प्रक्रियाओं, उत्पन्न जातियों या सृष्ट वस्तुओं की ओर संकेत कर सकता है। मुख्य पाठ में रूपात्मक निकटता रखी गई और अर्थ-विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘संसार की उत्पत्तियाँ’ जानबूझकर मूल की कुछ असामान्यता और अर्थगत व्यापकता सुरक्षित रखता है; पादटिप्पणी इसके स्वाभाविक विकल्प स्पष्ट करती है।
