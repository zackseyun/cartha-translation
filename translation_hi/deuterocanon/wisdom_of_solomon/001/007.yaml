base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: hi
  text: क्योंकि प्रभु की आत्मा ने आबाद संसार को भर दिया है, और जो सब कुछ एक साथ थामे हुए है[a], उसे हर वाणी का ज्ञान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जो सब कुछ अपने में समेटे हुए है’ या ‘वह जो सब कुछ एक साथ थामे रखता है’ भी हो सकता है। यूनानी अभिव्यक्ति नपुंसकलिंग में है और सब कुछ समेटने, संभालने या एक साथ थामे रखने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसे वाणी का ज्ञान है।’ आशय यह है कि प्रभु की सर्वव्यापी आत्मा कही जाने वाली हर बात से अवगत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: प्रभु का आत्मा
  rationale: यह पद परमेश्वर की सक्रिय और सर्वव्यापी उपस्थिति की बात करता है। देवनागरी में बड़े अक्षर का भेद न होने के कारण ‘आत्मा’ स्वाभाविक रूप से संदर्भ की गरिमा बनाए रखता है, पर बाद की धर्मवैज्ञानिक परिभाषाएँ आरोपित नहीं करता। विभक्ति के साथ इसे स्वाभाविक हिंदी में ‘प्रभु के आत्मा ने’ कहा गया है।
- source_word: πεπλήρωκεν
  choice: भर दिया है
  rationale: यूनानी पूर्णकाल किसी पूर्ण हुई क्रिया के वर्तमान परिणाम को व्यक्त करता है; हिंदी का ‘भर दिया है’ उस पक्ष को बनाए रखता है।
- source_word: τὴν οἰκουμένην
  choice: बसे हुए संसार
  rationale: ‘बसा हुआ संसार’ οἰκουμένη के निवासित पृथ्वी या जगत के अर्थ को सामान्य ‘संसार’ से अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: τὸ συνέχον τὰ πάντα
  choice: जो सब कुछ एक साथ थामे हुए है
  rationale: यह अनुवाद συνέχω के ‘थामे रखना/एक साथ जोड़े रखना’ अर्थ को व्यक्त करता है और यूनानी के नपुंसकलिंग कृदंत को किसी स्पष्ट रूप से व्यक्तिगत सत्ता या अमूर्त शक्ति के रूप में तय नहीं करता।
- source_word: γνῶσιν ἔχει φωνῆς
  choice: उसे हर वाणी का ज्ञान है
  rationale: ‘ज्ञान है’ यूनानी मुहावरे की औपचारिक बनावट को सुरक्षित रखता है। φωνή के लिए ‘वाणी’ यहाँ बोले गए कथन और आवाज़ दोनों की ओर संकेत कर सकती है; सार्वभौमिक संदर्भ के कारण ‘हर’ स्वाभाविक रूप से जोड़ा गया है।
theological_decisions:
- issue: क्या πνεῦμα Κυρίου को केवल अवैयक्तिक श्वास/भाव या परमेश्वर के आत्मा के रूप में प्रस्तुत किया जाए
  choice: प्रभु का आत्मा
  alternative: प्रभु की आत्मा; प्रभु की श्वास
  rationale: संसार को भरने और हर वाणी का ज्ञान रखने वाला संदर्भ परमेश्वर की सक्रिय, सर्वव्यापी उपस्थिति की ओर संकेत करता है। फिर भी हिंदी में अक्षर-बड़ाई का भेद न होने से अनुवाद बाद की त्रित्व-संबंधी परिभाषा को पाठ में जबरन नहीं डालता।
- issue: क्या τὸ συνέχον τὰ πάντα को आत्मा से स्पष्ट रूप से एक व्यक्तिगत कर्ता के रूप में पहचाना जाए
  choice: जो सब कुछ एक साथ थामे हुए है
  alternative: वह जो सब कुछ थामे रखता है; वह शक्ति जो सब कुछ समेटे हुए है
  rationale: यूनानी में नपुंसकलिंग substantival participle है। खुली हुई हिंदी संरचना व्यक्तिगत और अधिक अमूर्त—दोनों संभावनाएँ रहने देती है तथा पाठ की वास्तविक अस्पष्टता सुरक्षित रखती है।
