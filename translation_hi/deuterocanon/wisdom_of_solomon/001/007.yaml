  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी अपनाई गई है। वाक्य की काव्यात्मक-धर्मवैज्ञानिक गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। ‘जो…उसे’ की रचना जानबूझकर खुली रखी गई है, ताकि यूनानी पाठ की व्यक्तिगत और अवैयक्तिक व्याख्याओं के बीच का तनाव न मिटे।
