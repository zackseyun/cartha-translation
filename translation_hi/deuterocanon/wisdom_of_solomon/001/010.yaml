lexical_decisions:
- source_word: οὖς
  choice: कान
  rationale: शाब्दिक संज्ञा रखने से सुनने की सजीव, मानवीकृत छवि बनी रहती है।
- source_word: ζηλώσεως
  choice: ईर्ष्या का
  rationale: ζηλώσεως में ईर्ष्या और उत्साह—दोनों अर्थ संभव हैं। मुख्य पाठ में अधिक तीखा और नैतिक रूप से तनावपूर्ण अर्थ रखा गया है; यहाँ इसका आशय पापपूर्ण डाह अनिवार्यतः नहीं, बल्कि बुराई को सहन न करने वाली सतर्कता भी हो सकता है।
- source_word: ἀκροᾶται
  choice: सुनता है
  rationale: यह यूनानी क्रिया सुनने अथवा ध्यान देकर सुनने को व्यक्त करती है; सहज हिन्दी में ‘सुनता है’ व्यापक बोध को स्पष्ट रखता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: आधुनिक हिन्दी में यह यूनानी पद की सर्वसमावेशी व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θροῦς
  choice: धीमी आवाज़
  rationale: θροῦς आवाज़, शोर, फुसफुसाहट या चर्चा की भनक का बोध दे सकता है। γογγυσμῶν के साथ ‘धीमी आवाज़’ गुप्त शिकायत के श्रव्य बिंब को उभारती है।
- source_word: γογγυσμῶν
  choice: कुड़कुड़ाहटों की
  rationale: यह शब्द दबे स्वर में असंतोष, शिकायत या बड़बड़ाहट को दर्शाता है। ‘कुड़कुड़ाहट’ साधारण आधुनिक हिन्दी में इस ध्वनि और नैतिक भाव—दोनों को सँभालती है।
- source_word: οὐκ ἀποκρύπτεται
  choice: छिपी नहीं रहती
  rationale: कर्मवाच्य भाव को स्वाभाविक हिन्दी में बनाए रखता है और बताता है कि दबे स्वर की शिकायत भी छिप नहीं सकती।
theological_decisions:
- issue: ζηλώσεως द्वारा व्यक्त ईश्वरीय बोध का स्वरूप
  choice: ‘ईर्ष्या’ को मुख्य पाठ में रखा गया है, ताकि यूनानी की तीखी और तनावपूर्ण छवि बनी रहे।
  alternative: ‘उत्साह’ या ‘सतर्क लगन’
  rationale: पद का संदर्भ छिपी हुई वाणी तक पहुँचने वाले सर्वव्यापी श्रवण से है। ‘उत्साह’ संभव है, पर वह नैतिक रूप से चौकस और असहिष्णु निगरानी की धार को नरम कर सकता है। पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ईर्ष्या का कान’ जानबूझकर असामान्य किंतु स्रोत-संगत काव्यात्मक व्यक्तिकरण है। मुख्य पाठ के सभी पादटिप्पणी चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
