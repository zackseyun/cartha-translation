base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: hi
  text: क्योंकि अनुशासन की पवित्र आत्मा[a] छल से दूर भागेगी, नासमझ विचारों से अलग हो जाएगी, और अधर्म के आ पहुँचने पर उसकी भर्त्सना की जाएगी[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनुशासन की एक पवित्र आत्मा।’ यूनानी में ‘पवित्र आत्मा’ के साथ निश्चित उपपद नहीं है; इसलिए इसे गुणसूचक पदबंध या निश्चित नाम—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘वह उजागर हो जाएगी,’ ‘दोषी ठहराई जाएगी,’ अथवा ‘लज्जित होगी।’ यूनानी क्रिया के अर्थ-क्षेत्र में भर्त्सना करना, दोष प्रकट करना और दोषी सिद्ध करना सम्मिलित हैं।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जब अन्याय आ पहुँचेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: एक पवित्र आत्मा
  rationale: यूनानी पदबंध में निश्चित उपपद नहीं है। इसलिए इसे सीधे एक निश्चित व्यक्तिवाचक उपाधि बनाने के बजाय गुणात्मक और वास्तविक दोनों अर्थों की गुंजाइश रखते हुए अनूदित किया गया है।
- source_word: παιδείας
  choice: अनुशासन की
  rationale: παιδεία में शिक्षा, प्रशिक्षण, नैतिक गठन और सुधार—सभी का भाव हो सकता है। ‘अनुशासन’ उसके शिक्षाप्रद और सुधारात्मक दोनों पक्षों को संक्षेप में रखता है।
- source_word: φεύξεται ... δόλον
  choice: छल से दूर भागेगी
  rationale: φεύγω के सजीव ‘भागने’ के बिंब को बनाए रखते हुए δόλος के लिए वर्तमान और व्यापक शब्द ‘छल’ चुना गया है।
- source_word: ἀπαναστήσεται ἀπὸ
  choice: से अलग हो जाएगी
  rationale: क्रिया में उठकर दूर हो जाने अथवा हट जाने का भाव है। शाब्दिक ‘उठकर दूर चली जाएगी’ की अपेक्षा यह हिन्दी में स्वाभाविक है और पृथक्करण का बल सुरक्षित रखता है।
- source_word: λογισμῶν ἀσυνέτων
  choice: नासमझ विचारों
  rationale: λογισμοί विचार, तर्क या मन की योजनाएँ हो सकते हैं; ἀσύνετος समझ से रहित होने को बताता है। ‘नासमझ विचार’ अर्थ को अनावश्यक तकनीकीपन के बिना व्यक्त करता है।
- source_word: ἐλεγχθήσεται
  choice: उसे झिड़की दी जाएगी
  rationale: ἐλέγχω में झिड़कने, दोष प्रकट करने, निरुत्तर करने या दोषी सिद्ध करने का अर्थ-क्षेत्र है। मुख्य पाठ में सुधारात्मक-न्यायिक बल रखा गया है और अन्य संभावनाएँ टिप्पणी में दी गई हैं।
- source_word: ἐπελθούσης ἀδικίας
  choice: अधर्म के आ पहुँचने पर
  rationale: यह संबंधवाचक स्वतंत्र रचना साथ घटने वाली परिस्थिति बताती है। ἀδικία यहाँ व्यापक नैतिक बुराई है, इसलिए ‘अन्याय’ के बजाय ‘अधर्म’ चुना गया; ἐπέρχομαι की निकट आने की गति ‘आ पहुँचने’ में बनी रहती है।
theological_decisions:
- issue: क्या ἅγιον ... πνεῦμα को निश्चित नाम ‘पवित्र आत्मा’ के रूप में प्रस्तुत किया जाए
  choice: अनुशासन की एक पवित्र आत्मा
  alternative: अनुशासन की पवित्र आत्मा
  rationale: निश्चित उपपद के अभाव और इस पूर्व-ईसाई प्रज्ञा-साहित्यिक संदर्भ के कारण पाठ बाद की धर्मवैज्ञानिक निश्चितता को अनिवार्य नहीं करता। ‘एक’ गुणात्मक पठन को सामने रखता है, जबकि टिप्पणी निश्चित व्यक्तिवाचक पठन की संभावना सुरक्षित रखती है।
- issue: ἀδικία का अनुवाद ‘अधर्म’ हो या ‘अन्याय’
  choice: अधर्म
  alternative: अन्याय
  rationale: दोनों अर्थ संभव हैं, पर निकट संदर्भ छल, नासमझ विचार और पवित्र आत्मा के साथ नैतिक असंगति का है; अतः व्यापक नैतिक-धार्मिक अर्थ वाला ‘अधर्म’ अधिक उपयुक्त है।
- issue: पवित्र आत्मा के लिए ἐλεγχθήσεται का कठिन निष्क्रिय कथन
  choice: उसे झिड़की दी जाएगी
  alternative: वह उजागर हो जाएगी / दोषी ठहराई जाएगी / लज्जित होगी
  rationale: यूनानी निष्क्रिय क्रिया की धर्मवैज्ञानिक कठिनाई को सरल बनाकर मिटाया नहीं गया। मुख्य अर्थ ‘झिड़कना/भर्त्सना करना’ रखा गया है और क्रिया के अन्य प्रमाणित अर्थ टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘आत्मा’ को स्त्रीलिंग मानकर क्रियाओं में संगति रखी गई है। कठिन अंतिम निष्क्रिय कथन और ‘पवित्र आत्मा’ की अनिश्चितता को टिप्पणियों सहित सुरक्षित रखा गया है।
