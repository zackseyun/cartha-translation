lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या आधार बताता है; ‘क्योंकि’ यूनानी संयोजक की व्याख्यात्मक-कारणात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: निश्चित कर्ता के लिए आधुनिक बाइबलीय हिन्दी का स्पष्ट और गरिमापूर्ण सामान्य पद।
- source_word: θάνατον
  choice: मृत्यु
  rationale: अमूर्त संज्ञा को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखता है।
- source_word: οὐκ ἐποίησεν
  choice: नहीं बनाया
  rationale: ποιέω का सीधा अर्थ ‘बनाना’ है; यह ‘सृजा’ की अपेक्षा कम व्याख्यात्मक है और मूल कथन की व्यापकता बनाए रखता है।
- source_word: οὐδὲ
  choice: और न
  rationale: दूसरे निषेधात्मक उपवाक्य को पहले से स्वाभाविक तथा स्पष्ट रूप से जोड़ता है।
- source_word: τέρπεται
  choice: प्रसन्न होता है
  rationale: क्रिया के आनंद या सुख पाने के भाव को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπʼ ἀπωλείᾳ
  choice: विनाश से
  rationale: ἀπώλεια के नाश, बरबादी या विनाश के परिणामसूचक अर्थ को रखता है; ‘से प्रसन्न होना’ हिन्दी में स्वाभाविक प्रयोग है।
- source_word: ζώντων
  choice: जीवित प्राणियों के
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का सामान्य और व्यापक संकेत बनाए रखता है, उसे केवल मनुष्यों तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर और मृत्यु के संबंध वाले कथन में ἐποίησεν का अनुवाद
  choice: मृत्यु को नहीं बनाया
  alternative: मृत्यु की सृष्टि नहीं की
  rationale: ‘बनाया’ यूनानी ποιέω के अधिक सीधे अनुरूप है और किसी विशिष्ट सृष्टि-सिद्धांत को अनावश्यक रूप से आरोपित किए बिना इस कथन को बनाए रखता है कि मृत्यु परमेश्वर के बनाने से उत्पन्न नहीं हुई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘जीवित प्राणियों’ से यूनानी बहुवचन कृदंत का व्यापक दायरा सुरक्षित रहता है।
