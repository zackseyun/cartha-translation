  rationale: यह पिछले तर्क से निकले निष्कर्ष या परिणाम का संकेत देता है।
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: व्यर्थ कुड़कुड़ाने
  rationale: γογγυσμός दबे स्वर में असंतोष या शिकायत को और ἀνωφελής निष्फल अथवा व्यर्थ होने को बताता है; ‘कुड़कुड़ाना’ साधारण आधुनिक हिन्दी में दोनों भावों के निकट है।
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: अपनी जीभ को निंदा से रोको
  rationale: यह चयन जीभ के बिंब को बनाए रखता है और φείδομαι के विरत रहने तथा καταλαλιά के किसी के विरुद्ध बुरा बोलने के अर्थ को सहज हिन्दी में देता है।
- source_word: φθέγμα λαθραῖον
  choice: चुपके से कही गई कोई बात
  rationale: φθέγμα उच्चरित बात या ध्वनि है और λαθραῖον गुप्त या छिपे ढंग से कही गई बात; यह वाक्यांश फुसफुसाई या गुप्त वाणी का आशय स्पष्ट रखता है।
- source_word: κενὸν οὐ πορεύεται
  choice: निष्फल नहीं जाती
