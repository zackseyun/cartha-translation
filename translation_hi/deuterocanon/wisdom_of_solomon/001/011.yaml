  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुड़कुड़ाना’ दबे स्वर की असंतुष्ट शिकायत को व्यक्त करता है; ‘जीभ’ और ‘मुँह’ के मूल बिंब सुरक्षित हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
