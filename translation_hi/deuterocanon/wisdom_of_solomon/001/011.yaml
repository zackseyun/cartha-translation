  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: hi
  text: इसलिए व्यर्थ बड़बड़ाने से अपने आप को बचाओ, और अपनी जीभ को निंदा से रोको; क्योंकि चुपके से कही गई कोई बात निष्फल नहीं जाती[a], और झूठ बोलने वाला मुँह प्राण[b] को नष्ट करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खाली नहीं जाती।” आशय यह है कि छिपकर कही गई बात भी प्रभाव और परिणाम से रहित नहीं रहती।
    reason: lexical_alternative
  - marker: b
    text: या “जीवन,” “आत्मा,” अथवा “व्यक्ति।” यूनानी शब्द ψυχή प्राण, जीवन, आत्मा या व्यक्ति का बोध करा सकता है।
    reason: lexical_alternative
