- source_word: στόμα ... καταψευδόμενον
  choice: झूठ बोलने वाला मुँह
  rationale: यह कृदंत के सक्रिय झूठ बोलने के भाव और यूनानी के लोकोक्तिपरक ‘मुँह’ बिंब दोनों को बनाए रखता है।
- source_word: ἀναιρεῖ ψυχήν
  choice: प्राण को नष्ट करता है
  rationale: ἀναιρέω नाश करने या मार डालने का अर्थ दे सकता है; ‘नष्ट करता है’ व्यापक गंभीरता बनाए रखता है और केवल शारीरिक हत्या तक अर्थ को सीमित नहीं करता।
- source_word: ψυχήν
  choice: प्राण
  rationale: ψυχή के अर्थ-क्षेत्र में प्राण, जीवन और व्यक्ति सम्मिलित हैं। हिन्दी ‘प्राण’ जीवन और आंतरिक जीवित अस्तित्व दोनों का तनाव बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: अंतिम खंड में ψυχή का आशय
  choice: मुख्य पाठ में ‘प्राण’
  alternative: ‘जीवन’, ‘प्राणी’ या ‘व्यक्ति’
  rationale: ‘प्राण’ यूनानी शब्द के जीवन तथा जीवित अस्तित्व संबंधी विस्तार को बनाए रखता है और इसे किसी एक व्यवस्थित मानवशास्त्रीय अर्थ में बंद नहीं करता। पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखती है।
- issue: गुप्त वाणी के परिणाम का स्वरूप
  choice: ‘निष्फल नहीं जाती’
  alternative: ‘खाली नहीं जाती’
  rationale: मुख्य पाठ परिणाम और प्रभाव के संकेत को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी यूनानी रूपक को सामने रखती है; परिणाम को किसी विशिष्ट दैवी या सामाजिक प्रक्रिया के रूप में नहीं बाँधा गया।
