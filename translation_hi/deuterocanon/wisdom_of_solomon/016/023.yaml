  rationale: यह संकेतवाचक शब्द पिछले पद में बताए गए तत्व की ओर लौटता है। ‘इसी ने’ यूनानी के संकेत और कर्ता-भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πάλιν δʼ
