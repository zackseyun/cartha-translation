  rationale: मूल क्रिया का सीधा अर्थ ‘भूलना’ है। यह निर्जीव तत्व के मानवीकरण को बनाए रखता है, उसे केवल ‘असर खो देना’ नहीं बनाता।
- source_word: τῆς ἰδίας ... δυνάμεως
  choice: अपनी ही शक्ति
  rationale: ἰδίας का निजत्व और बलाघात ‘अपनी ही’ से तथा δύναμις की कार्यकारी सामर्थ्य ‘शक्ति’ से व्यक्त होती है।
