base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: hi
  text: क्योंकि जो अत्याचार कर रहे थे, उन पर ऐसी कमी आ पड़ना आवश्यक था जिससे बचा न जा सके[a]; पर इन्हें केवल यह दिखाया जाना था कि उनके शत्रु किस प्रकार यातना सह रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा अभाव आ पड़े जिससे छुटकारा न मिले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: आवश्यक था
  rationale: यह निर्वैयक्तिक क्रिया उस घटना की अनिवार्यता व्यक्त करती है; ‘आवश्यक था’ बिना अतिरिक्त नैतिक व्याख्या जोड़े उसका बल बनाए रखता है।
- source_word: ἀπαραίτητον ἔνδειαν
  choice: ऐसी कमी ... जिससे बचा न जा सके
  rationale: ἀπαραίτητον का अर्थ टाली या दूर न की जा सकने वाली अवस्था है, और ἔνδεια आवश्यक वस्तुओं की गंभीर कमी दर्शाता है। यह स्वाभाविक हिन्दी में दोनों पदों का संयुक्त अर्थ सुरक्षित रखता है।
- source_word: ἐπελθεῖν
  choice: आ पड़ना
  rationale: यह किसी विपत्ति के किसी पर आ जाने या उसे आ घेरने का भाव व्यक्त करता है; ‘आ पड़ना’ आधुनिक हिन्दी में सहज है।
- source_word: τυραννοῦσιν
  choice: जो अत्याचार कर रहे थे
  rationale: यूनानी रूप संज्ञा मात्र नहीं, बल्कि जारी दमनकारी कार्य पर बल देता है। हिन्दी का क्रियात्मक वाक्यांश उसी बल को बनाए रखता है।
- source_word: τούτοις δὲ μόνον
  choice: पर इन्हें केवल
  rationale: यह पहले समूह से स्पष्ट विरोध और μόνον का सीमित करने वाला अर्थ दोनों सुरक्षित रखता है। संदर्भगत संकेतवाचक सर्वनाम को नाम देकर स्पष्ट नहीं किया गया।
- source_word: δειχθῆναι
  choice: दिखाया जाना था
  rationale: निष्क्रिय infinitive को निष्क्रिय हिन्दी रचना में रखा गया है, जिससे केवल देखने के बजाय उन्हें कुछ दिखाए जाने का भाव बना रहता है।
- source_word: πῶς
  choice: किस प्रकार
  rationale: यह शत्रुओं की पीड़ा के ढंग अथवा दृश्य को प्रस्तुत करता है और मूल की संभावित व्यापकता बनाए रखता है।
- source_word: ἐβασανίζοντο
  choice: यातना सह रहे थे
  rationale: यह गंभीर पीड़ा और क्लेश का अर्थ देता है; ‘यातना सह रहे थे’ तीव्रता तथा अपूर्णकालिक जारी अवस्था दोनों व्यक्त करता है, बिना आधुनिक न्यायिक यातना तक अर्थ सीमित किए।
theological_decisions:
- issue: अत्याचारियों और दूसरे समूह के प्रति न्याय का विरोध
  choice: अत्याचार करने वालों पर अपरिहार्य कमी आई, जबकि दूसरे समूह को केवल अपने शत्रुओं की यातना दिखाई जानी थी।
  alternative: दूसरे समूह ने केवल देखा कि उनके शत्रु कैसे दण्ड पा रहे थे।
  rationale: 'τούτοις δὲ μόνον और निष्क्रिय δειχθῆναι दोनों समूहों के अनुभवों में असमानता दिखाते हैं: एक सीधे अभाव सहता है, दूसरे को वह यातना दिखाई जाती है। अनुवाद इस तनाव को व्याख्यात्मक विस्तार के बिना बनाए रखता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य अपनाया गया है। ‘जो अत्याचार कर रहे थे’ मूल यूनानी की क्रियात्मक शक्ति बनाए रखता है; ‘कमी’ को संदर्भ से आगे बढ़ाकर केवल ‘भूख’ नहीं किया गया।
