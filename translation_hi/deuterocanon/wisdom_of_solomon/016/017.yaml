base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: hi
  text: क्योंकि सबसे अधिक आश्चर्य की बात यह थी कि सब कुछ बुझा देने वाले जल में आग और भी अधिक प्रबलता से काम कर रही थी; क्योंकि संसार धर्मियों की ओर से लड़ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ब्रह्मांड धर्मियों का पक्षधर है’ अथवा ‘सृष्टि धर्मियों की रक्षक है।’
    reason: κόσμος और ὑπέρμαχος के वैध वैकल्पिक अर्थों को दिखाने के लिए।
lexical_decisions:
- source_word: παραδοξότατον
  choice: सबसे अधिक आश्चर्य की बात
  rationale: यह παράδοξος के अतिशयोक्तिपरक रूप को स्वाभाविक हिन्दी में व्यक्त करता है और अपेक्षा के विपरीत घटित होने का भाव बनाए रखता है।
- source_word: σβεννύντι
  choice: बुझा देने वाले
  rationale: यह जल के आग बुझाने वाले सामान्य गुण को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: πλεῖον ἐνήργει
  choice: और भी अधिक प्रबलता से काम कर रही थी
  rationale: यह ἐνήργει के निरंतर प्रभावी होने के भाव और πλεῖον की बढ़ी हुई तीव्रता—दोनों को बनाए रखता है, बिना इसे केवल अंतर्निहित ‘शक्ति’ तक सीमित किए।
- source_word: ὑπέρμαχος
  choice: की ओर से लड़ता है
  rationale: यह किसी के पक्ष में लड़ने या उसकी रक्षा करने के युद्धात्मक भाव को सुरक्षित रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: यह κόσμος का सीधा, व्यापक हिन्दी समतुल्य है; प्रसंग में इससे व्यवस्थित सृष्टि का मानवीकरण होता है।
- source_word: δικαίων
  choice: धर्मियों
  rationale: यह धर्मी व्यक्तियों के सामान्य वर्ग को संक्षिप्त और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: κόσμος ὑπέρμαχος ... δικαίων का अर्थ
  choice: संसार धर्मियों की ओर से लड़ता है
  alternative: सृष्टि धर्मियों की रक्षक है; ब्रह्मांड धर्मियों का पक्षधर है
  rationale: मुख्य पाठ सृष्ट जगत के मानवीकरण और ὑπέρμαχος के युद्धात्मक बल को बनाए रखता है, पर इसे प्रकृति के विषय में किसी व्यवस्थित सिद्धान्त के रूप में नहीं फैलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘जल’ से साहित्यिक गरिमा बनी रहती है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है। पाद-टिप्पणी का चिह्न उस अंतिम कथन के बाद रखा गया है जिससे उसके शब्दार्थ-विकल्प संबंधित हैं।
