  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: hi
  text: क्योंकि एक समय ज्वाला को वश में किया गया था[a], ताकि वह अधर्मियों के विरुद्ध भेजे गए जीव-जंतुओं को भस्म न कर दे; पर वे स्वयं यह देखकर जान सकें कि परमेश्वर के न्याय द्वारा उन्हें हाँका जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ज्वाला को शांत किया गया था’ अथवा ‘ज्वाला को मृदु किया गया था’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: शांत कर दिया जाता था
  rationale: ἡμερόω का मूल भाव वश में करने, कोमल बनाने या शांत करने का है। ज्वाला के संदर्भ में यह प्रयोग उसके बुझ जाने के बजाय उसकी उग्रता नियंत्रित किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φλόξ
  choice: ज्वाला
  rationale: φλόξ विशेष रूप से लौ या ज्वाला को सूचित करता है; इसलिए सामान्य ‘आग’ की अपेक्षा ‘ज्वाला’ अधिक सटीक है।
- source_word: καταφλέξῃ
  choice: भस्म न कर दे
  rationale: संयुक्त क्रिया पूर्णतः जला डालने का तीव्र भाव रखती है। ‘भस्म कर देना’ इस विनाशकारी अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: भक्तिहीनों के विरुद्ध भेजे गए जीवों
  rationale: ζῷα जीवित प्राणियों या पशुओं को सूचित कर सकता है; ‘जीव’ इसकी व्यापकता बचाता है। ἐπί का प्रसंगगत विरोधी भाव ‘के विरुद्ध’ से व्यक्त किया गया है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: ἀσεβής में नैतिक बुराई के साथ परमेश्वर के प्रति श्रद्धा के अभाव का धार्मिक भाव भी है; ‘भक्तिहीन’ इस आयाम को सामान्य ‘दुष्ट’ से बेहतर बचाता है।
- source_word: βλέποντες
  choice: यह देखकर
  rationale: मूल यूनानी में कर्म स्पष्ट नहीं है। ‘यह’ निकटवर्ती घटना—ज्वाला का नियंत्रित होना और जीवों का सुरक्षित रहना—की ओर संकेत करता है, बिना केवल ज्वाला को ही अनिवार्य कर्म ठहराए।
- source_word: εἴδωσιν
  choice: जान लें
  rationale: यहाँ देखने से प्राप्त समझ या पहचान अभिप्रेत है; ‘जान लें’ इस बोधात्मक परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θεοῦ κρίσει
  choice: परमेश्वर के न्याय के द्वारा
  rationale: κρίσις यहाँ दैवी न्यायिक कार्य को सूचित करता है। ‘न्याय के द्वारा’ साधनात्मक विभक्ति और धार्मिक-न्यायिक भार दोनों बनाए रखता है।
- source_word: ἐλαύνονται
  choice: उन्हें खदेड़ा जा रहा था
  rationale: ἐλαύνω का अर्थ हाँकना, आगे धकेलना या खदेड़ना हो सकता है। निष्क्रिय ‘खदेड़ा जा रहा था’ निरंतर बाहरी दबाव को व्यक्त करता है, पर उसकी विधि को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: विपत्ति में दैवी न्याय की भूमिका
  choice: परमेश्वर का न्याय उन भक्तिहीन लोगों को खदेड़ रहा था, जबकि ज्वाला को ऐसा नियंत्रित किया गया कि वह उनके विरुद्ध भेजे गए जीवों को नष्ट न करे।
  alternative: इसे केवल सामान्य दैवी प्रबंध या परिस्थितियों के संयोग के रूप में समझना।
  rationale: θεοῦ κρίσει स्पष्ट न्यायिक भाषा है, इसलिए इसे केवल परिस्थिति या सामान्य प्रबंध बनाकर नरम नहीं किया गया। फिर भी अनुवाद दैवी कारणता की ऐसी विस्तृत व्याख्या नहीं जोड़ता जो पद में स्वयं उपस्थित नहीं है।
- issue: βλέποντες का निहित कर्म
  choice: ‘यह देखकर’ रखा गया है, जिससे देखी गई घटना का संकेत मिलता है पर कर्म को केवल ज्वाला तक सीमित नहीं किया जाता।
  alternative: ‘उसे देखकर’, जिसका संकेत केवल ज्वाला या केवल भेजे गए जीवों की ओर माना जा सकता है।
  rationale: यूनानी में βλέποντες के साथ कोई व्यक्त कर्म नहीं है। संकेतवाचक ‘यह’ हिन्दी में वाक्य को स्वाभाविक बनाते हुए मूल की संदर्भगत अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय रूप अपनाया गया है। ‘भक्तिहीन’, ‘ज्वाला’ और ‘परमेश्वर का न्याय’ धार्मिक-नैतिक तथा काव्यात्मक भार बनाए रखते हैं; वाक्य-संरचना मूल यूनानी के विरोध और उद्देश्य-संबंध को स्पष्ट रखती है।
