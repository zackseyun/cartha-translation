base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: hi
  text: ताकि आपके पुत्र[a], जिनसे आपने प्रेम किया, हे प्रभु, सीखें कि खेतों की उपज मनुष्य[b] का पोषण नहीं करती, बल्कि आपका वचन उन लोगों को जीवित रखता है जो आप पर भरोसा रखते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘आपके पुत्र’; सन्दर्भ में इससे परमेश्वर की सन्तान या उसके लोग सामूहिक रूप से अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यह कथन सम्भवतः व्यवस्थाविवरण 8:3 की ओर संकेत करता है: मनुष्य का जीवन केवल भोजन से नहीं, बल्कि परमेश्वर के वचन से बना रहता है।'
    reason: cross_reference
  - marker: c
    text: या, ‘जो आपकी बात पर विश्वास करते हैं।’ यूनानी क्रिया भरोसा रखने और किसी की बात पर विश्वास करने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: ताकि ... यह सीखें
  rationale: ἵνα के साथ विधिलिंग उद्देश्य प्रकट करता है; ‘ताकि ... सीखें’ आधुनिक हिन्दी में इस प्रयोजनार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ υἱοί σου
  choice: आपके पुत्र
  rationale: यूनानी पद स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है। मुख्य पाठ स्रोत की इस विशेषता को बनाए रखता है; व्यापक सन्दर्भगत अर्थ को पादटिप्पणी में बताया गया है।
- source_word: οὓς ἠγάπησας
  choice: जिनसे आपने प्रेम किया
  rationale: सरल भूतकालीन कथन मूल के aorist को बिना अनावश्यक कालगत व्याख्या जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को गरिमापूर्ण किन्तु प्रचलित हिन्दी प्रार्थना-भाषा में व्यक्त किया गया है।
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: खेतों की उपज नहीं
  rationale: γενέσεις यहाँ उत्पन्न वस्तुओं या पैदावार और καρπῶν कृषि-उपज को सूचित करता है; ‘खेतों की उपज’ अर्थ को स्पष्ट तथा सहज रखता है।
- source_word: τρέφουσιν ἄνθρωπον
  choice: मनुष्य का पोषण ... करती
  rationale: τρέφω का अर्थ पोषण करना है और एकवचन ἄνθρωπον प्रतिनिधिक अर्थ में ‘मनुष्य’ है। हिन्दी वाक्य-विन्यास में ‘मनुष्य का पोषण’ स्वाभाविक है और एकवचन को बनाए रखता है।
- source_word: τὸ ῥῆμά σου
  choice: आपका वचन
  rationale: ῥῆμα ‘वचन/कथन’ है। ‘आपका वचन’ स्पष्ट है और व्यवस्थाविवरण 8:3 की सम्भावित प्रतिध्वनि को बिना विस्तारित किए बनाए रखता है।
- source_word: τοὺς σοὶ πιστεύοντας
  choice: जो आप पर भरोसा रखते हैं
  rationale: πιστεύω के साथ dative व्यक्तिगत विश्वास, भरोसा या किसी की बात मानने का भाव दे सकता है। यहाँ ‘आप पर भरोसा रखते हैं’ निर्भर विश्वास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διατηρεῖ
  choice: जीवित रखता है
  rationale: διατηρέω का अर्थ सुरक्षित रखना, बनाए रखना या जीवित रखना हो सकता है। भोजन और पोषण के इस प्रसंग में ‘जीवित रखता है’ विरोध को स्पष्ट करता है, यद्यपि व्यापक ‘सुरक्षित रखता है’ भी सम्भव है।
theological_decisions:
- issue: व्यवस्थाविवरण 8:3 की सम्भावित प्रतिध्वनि
  choice: ‘आपका वचन ... जीवित रखता है’ के रूप में मूल कथन को बनाए रखना
  alternative: इसे ‘मनुष्य केवल रोटी से जीवित नहीं रहता’ जैसे विस्तृत उद्धरण में बदलना
  rationale: यूनानी पाठ अपनी अलग अभिव्यक्ति देता है। अनुवाद शास्त्रीय प्रतिध्वनि को रहने देता है, पर मूल में अनुपस्थित शब्द जोड़कर सामंजस्य नहीं करता।
- issue: οἱ υἱοί σου का लिंग और सन्दर्भगत विस्तार
  choice: मुख्य पाठ में ‘आपके पुत्र’
  alternative: ‘आपकी सन्तान’ या ‘आपके बच्चे’
  rationale: मूल यूनानी पुल्लिंग बहुवचन है। उसे मुख्य पाठ में बनाए रखा गया है, जबकि सम्भावित सामूहिक अर्थ पादटिप्पणी में दिया गया है; इससे न तो स्रोत की रूपात्मक विशेषता मिटती है, न उसके व्यापक सन्दर्भगत प्रयोग को नकारा जाता है।
- issue: πιστεύω के साथ dative का अर्थ
  choice: ‘आप पर भरोसा रखते हैं’
  alternative: ‘आपकी बात पर विश्वास करते हैं’
  rationale: दोनों अर्थ व्याकरणतः सम्भव हैं। प्रसंग में परमेश्वर पर निर्भर भरोसा अधिक स्वाभाविक है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे प्रभु’ प्रार्थनात्मक सम्बोधन को बनाए रखता है, जबकि शेष वाक्य अनावश्यक रूप से पुरातन या संस्कृतनिष्ठ नहीं है। ‘जीवित रखता है’ कृषि-उपज से मिलने वाले पोषण और परमेश्वर के वचन द्वारा जीवन बनाए रखने के बीच मूल विरोध को सहज हिन्दी में उभारता है।
