  alternative: तेरा क्रोध सदा तक नहीं बना रहा
  rationale: मूल पाठ सीधे कहता है कि परमेश्वर का क्रोध ‘अंत तक’ नहीं रहा। चुना हुआ अनुवाद वास्तविक ईश्वरीय क्रोध और इस घटना में उसके अंत तक न बने रहने—दोनों को बिना व्याख्यात्मक निष्कर्ष थोपे सुरक्षित रखता है।
