  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/005.yaml
  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: hi
  text: क्योंकि जब जंगली पशुओं का भयंकर प्रकोप उन पर आ पड़ा और वे टेढ़े-मेढ़े साँपों[a] के काटने से नष्ट हो रहे थे, तब भी तेरा क्रोध अंत तक नहीं रहा;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बल खाते साँपों’। यूनानी विशेषण का शाब्दिक अर्थ ‘टेढ़ा’ या ‘मुड़ा हुआ’ है; यहाँ संभवतः यह साँपों की आकृति या गति का वर्णन करता है, किसी नैतिक गुण का नहीं।
    reason: lexical_alternative
