  rationale: यूनानी के कालगत कथन को संक्षिप्त और निकट रूप में रखता है तथा अगले पद की व्याख्या को पहले से नहीं जोड़ता।
- source_word: ἡ ὀργή σου
  choice: तेरा क्रोध
  rationale: ὀργή की गंभीरता और परमेश्वर से प्रत्यक्ष एकवचन संबोधन दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय का इस प्रसंग में सीमित अवधि तक रहना
