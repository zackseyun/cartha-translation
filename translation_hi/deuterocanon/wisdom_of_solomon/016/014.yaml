base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: hi
  text: मनुष्य तो अपनी दुष्टता से मार डालता है, पर निकल चुके प्राण[a] को वह लौटा नहीं सकता, और न ही ले ली गई आत्मा को मुक्त कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘आत्मा’ या ‘साँस’ भी हो सकता है; और आगे ‘आत्मा’ के लिए प्रयुक्त शब्द का अर्थ ‘जीवन’ या ‘प्राण’ भी हो सकता है। मृत्यु के इस संदर्भ में इन अर्थों की सीमाएँ एक-दूसरे से मिलती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह एकवचन में मानव जाति के प्रतिनिधि को दर्शाता है और आसपास के प्रसंग में परमेश्वर की सामर्थ्य के सामने मनुष्य की सीमा को उभारता है।
- source_word: ἀποκτέννει
  choice: मार सकता है
  rationale: क्रिया का सीधा अर्थ प्राण लेना है। हिन्दी में सामर्थ्य का भाव आगे की असमर्थता के विरोध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: τῇ κακίᾳ αὐτοῦ
  choice: अपनी दुष्टता से
  rationale: κακία सामान्य नैतिक बुराई या दुष्टता को व्यक्त करता है; possessive αὐτοῦ को ‘अपनी’ से सुरक्षित रखा गया है।
- source_word: ἐξελθὸν ... πνεῦμα
  choice: निकल चुके प्राण
  rationale: मृत्यु के संदर्भ में πνεῦμα सांस, प्राण अथवा आत्मा का बोध करा सकता है। ‘प्राण’ जीवनदायी श्वास और जीवनी-शक्ति दोनों की गुंजाइश रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: οὐκ ἀναστρέφει
  choice: वापस नहीं ला सकता
  rationale: यह निकल चुके πνεῦμα को लौटा लाने के ठोस बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδὲ ἀναλύει
  choice: और न ही ... छुड़ा सकता है
  rationale: ἀναλύω का अर्थ यहां खोलना, मुक्त करना या छुड़ाना है। ‘छुड़ा सकता’ मृत्यु के अधिकार से मुक्त करने का बिंब बनाए रखता है।
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: ले लिए गए जीवन
  rationale: ψυχή मृत्यु के संदर्भ में जीवन या प्राण को सूचित कर सकता है, और παραλημφθεῖσαν उसके ले लिए जाने को। ‘जीवन’ हिन्दी में स्वाभाविक है और πνεῦμα के लिए प्रयुक्त ‘प्राण’ से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: मृत्यु के संदर्भ में πνεῦμα और ψυχή का अर्थ
  choice: मुख्य पाठ में πνεῦμα के लिए ‘प्राण’ और ψυχή के लिए ‘जीवन’
  alternative: πνεῦμα के लिए ‘आत्मा’ या ‘सांस’, और ψυχή के लिए ‘प्राण’ या ‘आत्मा’
  rationale: यूनानी के दोनों शब्दों की अर्थ-सीमाएं एक-दूसरे से मिल सकती हैं और यह पद किसी कठोर आत्मा-विज्ञान को परिभाषित नहीं करता। चुने हुए शब्द मृत्यु को उलट पाने में मनुष्य की असमर्थता स्पष्ट रखते हैं, जबकि पादटिप्पणी वास्तविक शब्दगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘मार तो सकता है ... वापस नहीं ला सकता’ की रचना मानव की सीमित सामर्थ्य और मृत्यु को पलटने की असमर्थता के विरोध को स्पष्ट करती है।
