  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: hi
  text: और इसके द्वारा भी तूने हमारे शत्रुओं को विश्वास दिलाया कि तू ही वह है जो हर बुराई से बचाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर हानि से” अथवा “हर विपत्ति से।” यूनानी शब्द κακοῦ का अर्थ व्यापक रूप से बुराई, हानि या विपत्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसके द्वारा
  rationale: यहाँ ἐν के साथ संकेतवाचक पद पूर्ववर्ती घटना को साधन के रूप में दिखाता है; ‘इसके द्वारा’ उस अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔπεισας
  choice: विश्वास दिलाया
  rationale: क्रिया का अर्थ मनवाना या आश्वस्त करना है। ‘विश्वास दिलाया’ उस कथन की विषयवस्तु के साथ सहज बैठता है जिसे शत्रुओं ने सत्य माना।
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: हमारे शत्रुओं को
  rationale: यह कर्मकारक पद और सामुदायिक प्रथम-पुरुष संबंध दोनों को सीधे बनाए रखता है।
- source_word: ὅτι σὺ εἶ
  choice: कि तू ही वह है
  rationale: स्पष्ट सर्वनाम σὺ के बल को ‘ही’ से व्यक्त किया गया है, बिना वाक्य को अस्वाभाविक रूप से भारी बनाए।
- source_word: ὁ ῥυόμενος
  choice: जो ... बचाता है
  rationale: वर्तमान कृदन्त परमेश्वर की चरित्रगत और निरंतर उद्धारकारी क्रिया बताता है; ‘बचाता है’ आधुनिक और व्यापक रूप से बोधगम्य है।
- source_word: ἐκ παντὸς κακοῦ
  choice: हर बुराई से
  rationale: κακόν नैतिक बुराई, हानि या विपत्ति का व्यापक अर्थ रख सकता है। ‘बुराई’ मूल की व्यापकता को बनाए रखती है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: κακοῦ का अर्थ-क्षेत्र
  choice: हर बुराई से
  alternative: हर हानि से; हर विपत्ति से
  rationale: मूल पद जानबूझकर व्यापक है। ‘बुराई’ उसे केवल शारीरिक संकट या दुर्भाग्य तक सीमित नहीं करती, जबकि पादटिप्पणी अन्य संभव अर्थों को सुरक्षित रखती है।
- issue: σὺ का बल
  choice: तू ही वह है
  alternative: तू वह है
  rationale: यूनानी में व्यक्त कर्तृवाचक सर्वनाम बलाघात देता है; हिन्दी में ‘ही’ इस पहचानात्मक बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
