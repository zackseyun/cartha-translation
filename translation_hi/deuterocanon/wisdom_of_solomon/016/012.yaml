  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘औषधीय जड़ी-बूटी’ और ‘लेप’ सामान्य पाठक के लिए स्पष्ट हैं। ‘ही है जो’ से मूल के मानवीय उपचार और प्रभु के वचन के बीच बलयुक्त विरोध स्वाभाविक हिन्दी में व्यक्त होता है।
