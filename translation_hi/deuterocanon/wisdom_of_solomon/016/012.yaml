  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: hi
  text: क्योंकि न तो किसी औषधीय जड़ी-बूटी ने और न किसी लेप ने उन्हें चंगा किया, बल्कि हे प्रभु, आपका वचन ही है जो सब कुछ चंगा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοτάνη
  choice: औषधीय जड़ी-बूटी
  rationale: चंगाई के इस प्रसंग में यह शब्द सामान्य वनस्पति की अपेक्षा उपचार में प्रयुक्त पौधे या जड़ी-बूटी को सूचित करता है।
- source_word: μάλαγμα
  choice: लेप
  rationale: यह शरीर पर लगाया जाने वाला मुलायम औषधीय पदार्थ है। आधुनिक हिन्दी में ‘लेप’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: क्रिया केवल उपचार करने का प्रयास नहीं, बल्कि स्वस्थ कर देने को व्यक्त करती है; धार्मिक-काव्यात्मक प्रसंग में ‘चंगा किया’ उपयुक्त है।
- source_word: λόγος
  choice: वचन
  rationale: यह प्रभु की प्रभावकारी उक्ति या व्यक्त इच्छा को सूचित करता है। ‘वचन’ उसका धार्मिक अनुनाद बनाए रखता है, पर बाद की किसी विशिष्ट तकनीकी व्याख्या को आरोपित नहीं करता।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का आशय व्यापक और समावेशी है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἰώμενος
  choice: जो सब कुछ चंगा करता है
  rationale: वर्तमान कृदन्त प्रभु के वचन की निरंतर या विशिष्ट चंगा करने वाली सामर्थ्य बताता है; सम्बन्धवाचक उपवाक्य हिन्दी में इसका स्वाभाविक रूप है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन को स्पष्ट करते हुए κύριος का मानक, गरिमापूर्ण हिन्दी रूप दिया गया है।
theological_decisions:
- issue: मानवीय उपचारों और परमेश्वर के कार्य के बीच विरोध
  choice: पद में वर्णित इसी घटना में जड़ी-बूटी और लेप के बजाय प्रभु के वचन को वास्तविक चंगाई का साधन बताया गया है।
  alternative: इसे हर प्रकार की औषधि के सार्वभौमिक निषेध के रूप में समझना।
  rationale: यूनानी पाठ कहता है कि इन उपायों ने ‘उन्हें’ चंगा नहीं किया; वह औषधि के हर उपयोग के विरुद्ध कोई सामान्य सिद्धान्त स्पष्ट रूप से घोषित नहीं करता।
- issue: λόγος का धर्मवैज्ञानिक आशय
  choice: ‘वचन’ रखा गया है, जिससे परमेश्वर की प्रभावकारी उक्ति का अर्थ और मूल की सम्भावित व्यापक धर्मवैज्ञानिक अनुगूँज सुरक्षित रहती है।
  alternative: ‘आदेश’ कहना, जो अर्थ को केवल आज्ञा तक सीमित कर सकता है।
  rationale: λόγος यहाँ उक्ति, वचन या व्यक्त इच्छा का अर्थ दे सकता है; पाठ स्वयं इसे बाद की किसी विशिष्ट व्यक्तित्वगत पहचान तक स्पष्ट रूप से सीमित नहीं करता।
