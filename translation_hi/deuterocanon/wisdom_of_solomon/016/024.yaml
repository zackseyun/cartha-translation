- source_word: σοι τῷ ποιήσαντι
  choice: अपने रचनेवाले आपकी
  rationale: यूनानी में ‘आप’ और ‘रचनेवाले’ एक ही संबोधित व्यक्ति को बताते हैं; यह हिंदी रूप सृष्टि और उसके रचयिता का संबंध स्पष्ट रखता है।
- source_word: ὑπηρετοῦσα
  choice: सेवा करते हुए
  rationale: यह सृष्टि को परमेश्वर के उद्देश्यों के अधीन कार्य करते दिखाता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: ἐπιτείνει
  choice: तन जाती है
  rationale: यह क्रिया खिंचने या कसने की सजीव भौतिक छवि रखती है और विपरीत क्रिया ἀνίεται के साथ स्पष्ट विरोध बनाती है।
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: अधर्मियों को दण्ड देने के लिए
  rationale: यह न्यायिक दण्ड और उसके लक्ष्य दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: ἀνίεται
  choice: ढीली पड़ जाती है
  rationale: यह ἐπιτείνει के ‘तनने’ के विपरीत ढील या शिथिलता की मूल छवि सुरक्षित रखता है।
- source_word: εἰς εὐεργεσίαν
  choice: भला करने के लिए
  rationale: εὐεργεσία का सक्रिय उपकार या हित करने का भाव सरल, वर्तमान हिंदी में व्यक्त होता है।
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: आप पर भरोसा रख चुके लोगों का
  rationale: पूर्णकालिक कृदंत स्थापित और जारी भरोसे का संकेत देता है; ‘भरोसा रख चुके’ उस पहलू को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के अधीन सृष्टि की सक्रिय भूमिका
  choice: सृष्टि न्याय और भलाई दोनों में अपने रचयिता की सेवा करनेवाले साधन के रूप में प्रस्तुत है।
  alternative: सृष्टि या प्रकृति को स्वतंत्र, निरपेक्ष शक्ति मानना।
  rationale: ὑπηρετοῦσα तथा σοι τῷ ποιήσαντι सृष्टि को उसके रचयिता के अधीन और उसकी सेवा में रखते हैं, स्वतंत्र ब्रह्मांडीय शक्ति के रूप में नहीं।
- issue: तनने और ढीली पड़ने की रूपकात्मक भाषा
  choice: दोनों विपरीत भौतिक बिंबों को मुख्य पाठ में बनाए रखा गया है।
  alternative: इन्हें केवल ‘तीव्र होती है’ और ‘उपकार करती है’ जैसे अमूर्त पदों में समतल कर देना।
  rationale: ἐπιτείνει और ἀνίεται का विरोध पद्य की अभिव्यंजना और न्याय तथा उपकार के बीच तनाव को वहन करता है।
