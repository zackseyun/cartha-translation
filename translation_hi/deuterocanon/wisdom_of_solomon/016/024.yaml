  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण स्तर रखा गया है। ‘अधर्मी’, ‘दण्ड’ और ‘सृष्टि’ बाइबलीय-न्यायिक भाव बनाए रखते हैं, जबकि ‘भला करना’ सामान्य पाठक के लिए ‘उपकारशीलता’ से अधिक सहज है।
