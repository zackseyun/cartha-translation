base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: hi
  text: क्योंकि सृष्टि[a], आपकी—अपने रचनेवाले की—सेवा करती हुई, अधर्मियों के विरुद्ध दण्ड देने के लिए तन जाती है, और जिन्होंने आप पर भरोसा रखा है उनका भला करने के लिए ढीली पड़ जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, सृष्टि दण्ड के लिए कस जाती है और भलाई करने के लिए खुल या शिथिल हो जाती है। यूनानी में ‘तनने’ और ‘ढीला पड़ने’ के परस्पर विरोधी भौतिक बिंब हैं।
    reason: lexical_alternative
