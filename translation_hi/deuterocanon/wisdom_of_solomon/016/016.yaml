  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: hi
  text: क्योंकि अधर्मियों ने आपको जानने से इनकार किया, इसलिए वे आपकी भुजा के सामर्थ्य से कोड़ों से पीटे गए; अनोखी वर्षाओं, ओलों और अपरिहार्य मूसलाधार वर्षाओं ने उनका पीछा किया, और आग ने उन्हें भस्म कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνούμενοι … εἰδέναι
  choice: जानने से इनकार करने वाले
  rationale: कृदंत ἀρνούμενοι, εἰδέναι को नियंत्रित करता है और जानबूझकर किए गए इनकार को व्यक्त करता है। ‘जानने’ से मूल क्रिया का सीधा अर्थ बना रहता है; इसे ‘स्वीकार करने’ के रूप में विस्तार नहीं दिया गया।
- source_word: ἀσεβεῖς
  choice: अधर्मी
  rationale: यह शब्द विशेष रूप से परमेश्वर के प्रति भक्ति और श्रद्धा के अभाव को व्यक्त करता है; ‘दुष्ट’ की तुलना में ‘अधर्मी’ इसका धार्मिक आयाम बेहतर बनाए रखता है।
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: आपकी भुजा के सामर्थ्य से
  rationale: यह साधनसूचक वाक्यांश है। अनुवाद में ‘भुजा’ और ‘सामर्थ्य’ दोनों संज्ञाएँ रखी गई हैं, जिससे ईश्वरीय शक्ति का बाइबिलीय बिंब सुरक्षित रहता है।
- source_word: ἐμαστιγώθησαν
  choice: कोड़े खाए
  rationale: क्रिया का मूल बिंब कोड़े लगाए जाने का है। यहाँ प्राकृतिक विपत्तियों द्वारा दंड का रूपक है, फिर भी उसकी तीव्रता को सामान्य ‘दंड पाए’ कहकर हल्का नहीं किया गया।
- source_word: ξένοις ὑετοῖς
  choice: अनोखी वर्षा
  rationale: ξένος यहाँ साधारण से भिन्न, पराई या असाधारण वर्षा का संकेत देता है। ‘अनोखी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी विलक्षणता बनाए रखता है।
- source_word: χαλάζαις
  choice: ओले
  rationale: यूनानी बहुवचन को हिन्दी में स्वाभाविक गणनीय बहुवचन ‘ओले’ से व्यक्त किया गया है।
- source_word: ὄμβροις ἀπαραιτήτοις
  choice: न टाली जा सकने वाली मूसलाधार बारिश
  rationale: ὄμβρος भारी वर्षा या मूसलाधार बारिश है, जबकि ἀπαραίτητος उस वस्तु को दर्शाता है जिसे हटाया, मोड़ा या टाला नहीं जा सकता। यह अनुवाद दोनों अर्थों को स्पष्ट रखता है।
- source_word: διωκόμενοι
  choice: उनका पीछा करती रही
  rationale: मूल में पीछा किए जाने का सजीव बिंब है। हिन्दी में प्राकृतिक शक्तियों को कर्ता बनाकर सक्रिय रचना करने से यह बिंब स्पष्ट और स्वाभाविक रहता है।
- source_word: πυρὶ καταναλισκόμενοι
  choice: आग उन्हें भस्म करती रही
  rationale: καταναλίσκω पूर्ण रूप से खपा या नष्ट कर देने को व्यक्त करता है। ‘भस्म करना’ आग द्वारा विनाश का सशक्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: εἰδέναι में परमेश्वर को ‘जानने’ का स्वरूप
  choice: ‘आपको जानने’ का सीधा अनुवाद रखा गया।
  alternative: ‘आपको स्वीकार करने’ या ‘आपको परमेश्वर मानने’ से इनकार करना
  rationale: संदर्भ में पहचान और स्वीकार का भाव संभव है, पर यूनानी पाठ केवल ‘जानना’ कहता है। विस्तृत धर्मवैज्ञानिक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: ἐμαστιγώθησαν के दंडात्मक रूपक की तीव्रता
  choice: ‘कोड़े खाए’
  alternative: ‘दंड पाए’ या ‘पीड़ित किए गए’
  rationale: मौसम और आग दंड के साधन हैं, फिर भी लेखक जानबूझकर कोड़े मारने का तीखा बिंब इस्तेमाल करता है। उसे नरम करने से पाठ की न्याय-संबंधी तीव्रता घट जाती।
- issue: वर्षा और आग के कर्तृत्व का चित्रण
  choice: प्राकृतिक विपत्तियों को पीछा करने और भस्म करने वाले साधनों के रूप में रखा गया।
  alternative: सामान्य रूप से ‘उन पर विपत्तियाँ आईं’
  rationale: मूल पाठ दंड को गतिशील और मानवीकृत चित्रों में प्रस्तुत करता है। अनुवाद उस तनाव और सजीवता को सुरक्षित रखता है, पर दंड के साधनों से आगे कोई अतिरिक्त कारण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। समानांतर कृदंतों को हिन्दी में प्रवाही बनाने हेतु अंतिम दो खंडों में सक्रिय, मानवीकृत रचना अपनाई गई है; मूल का अर्थ और दंड का क्रम सुरक्षित है।
