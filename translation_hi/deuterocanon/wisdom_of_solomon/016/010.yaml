base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: hi
  text: परन्तु विषैले साँपों के दाँत भी तेरे पुत्रों[a] पर विजय न पा सके, क्योंकि तेरी दया उनकी सहायता के लिए आई और उसने उन्हें चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी सन्तान।’ यूनानी में शाब्दिक रूप से ‘पुत्रों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱούς
  choice: पुत्रों
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और प्रसंग में इस्राएलियों, अर्थात परमेश्वर की प्रजा, को संबोधित करता है। ‘पुत्रों’ मूल की लैंगिक विशिष्टता बनाए रखता है।
- source_word: ἰοβόλων
  choice: विषैले
  rationale: यह यौगिक शब्द विष छोड़ने या पहुँचाने का भाव रखता है। साँपों के संदर्भ में ‘विषैले’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: δρακόντων
  choice: साँपों
  rationale: मरुभूमि में काटने वाले विषैले जीवों के प्रसंग में इसका अभिप्राय साँपों से है; आधुनिक हिन्दी में ‘अजगरों’ या ‘नागों’ से भ्रामक अर्थ उत्पन्न हो सकता है।
- source_word: ἐνίκησαν
  choice: विजय न पा सके
  rationale: क्रिया का अर्थ जीतना या प्रबल होना है। यह रूप मृत्युकारक दाँतों के उन पर अंततः हावी न हो पाने का भाव सुरक्षित रखता है।
- source_word: ἀντιπαρῆλθεν
  choice: उनकी सहायता के लिए आई
  rationale: यह असामान्य यौगिक क्रिया संकट के सामने दया के हस्तक्षेप या सहायतार्थ आने को व्यक्त करती है; चुना हुआ वाक्यांश अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: ἰάσατο
  choice: चंगा किया
  rationale: यह सामान्य आरोग्य प्रदान करने वाली क्रिया है; ‘चंगा किया’ बाइबलीय गरिमा और स्पष्टता दोनों बनाए रखता है।
theological_decisions:
- issue: ‘तेरे पुत्रों’ का संदर्भ
  choice: परमेश्वर को संबोधित करते हुए इस्राएल के लिए ‘तेरे पुत्रों’ रखा गया है।
  alternative: तेरी सन्तान
  rationale: यह पद मरुभूमि में इस्राएल की घटना स्मरण करता है। ‘पुत्रों’ यूनानी के स्पष्ट पुल्लिंग बहुवचन को बनाए रखता है, पर इससे कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ा गया।
