- source_word: τὸ ... μὴ φθειρόμενον
  choice: जो ... नष्ट नहीं हुआ था
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत प्रसंग में पहले बताए गए अद्भुत भोजन की ओर संकेत करता है। आग और पिघलने के भौतिक विरोध के कारण φθείρω के लिए ‘नष्ट’ स्वाभाविक है।
- source_word: ὑπὸ πυρὸς
  choice: आग से
  rationale: ὑπό के साथ संबंध यहाँ कारक अथवा साधन का है; आधुनिक हिन्दी में ‘आग से’ सबसे सहज है।
- source_word: ἁπλῶς
  choice: सहज ही
  rationale: 'यह पद विरोधाभास को तीखा करता है: जिसे आग ने नष्ट नहीं किया, वह मामूली धूप से पिघल गया। ‘सहज ही’ इस बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।'
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: सूर्य की हल्की-सी किरण से
  rationale: βραχείας में अल्पता, क्षीणता अथवा थोड़े समय का भाव हो सकता है। प्रसंग में ‘हल्की-सी किरण’ आग के साथ विरोध को स्पष्ट रखते हुए मूल की वास्तविक अर्थ-व्याप्ति को सुरक्षित रखती है।
- source_word: θερμαινόμενον
  choice: गरम होकर
  rationale: कृदंत को परिस्थितिसूचक रूप में प्रस्तुत किया गया है। ‘गरम होकर’ क्रम और कारण-संबंध को सहज हिन्दी में व्यक्त करता है, बिना अत्यधिक ताप का संकेत दिए।
- source_word: ἐτήκετο
  choice: पिघल गया
  rationale: τήκω यहाँ पिघलने को दर्शाता है। यूनानी अपूर्ण काल को हिन्दी में पूर्ण घटना के रूप में देना इस कथन में अधिक स्वाभाविक है।
