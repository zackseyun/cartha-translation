base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: hi
  text: पर हिम और बर्फ आग को सहते रहे और नहीं पिघले, ताकि वे जान लें कि ओलों में धधकती और वर्षा में बिजली-सी चमकती आग शत्रुओं के फलों[a] को नष्ट कर रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शत्रुओं की फसलों’ अथवा ‘शत्रुओं की उपज’। यूनानी में शब्दशः ‘शत्रुओं के फल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χιὼν
  choice: हिम
  rationale: इसका सामान्य अर्थ ‘snow’ है। आगे χαλάζῃ के लिए ‘ओले’ आने के कारण दोनों को अलग रखा गया है।
- source_word: κρύσταλλος
  choice: बर्फ
  rationale: हिम के साथ और पिघलने के संदर्भ में इसका आशय जमी हुई बर्फ है; ‘स्फटिक’ यहाँ भ्रामक होता।
- source_word: ὑπέμεινε πῦρ
  choice: आग को सहते रहे
  rationale: यह आग के प्रभाव में भी टिके रहने का विरोधाभासी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐτήκετο
  choice: नहीं पिघले
  rationale: हिम और बर्फ के संदर्भ में यही सीधा और स्वाभाविक अर्थ है।
- source_word: ἵνα γνῶσιν
  choice: ताकि वे जान लें
  rationale: ἵνα की प्रयोजनसूचक शक्ति रखी गई है और ‘वे’ का अनिर्दिष्ट संदर्भ मूल पाठ की तरह खुला छोड़ा गया है।
- source_word: κατέφθειρε
  choice: नष्ट कर रही थी
  rationale: अपूर्ण भूतकाल चल रही विनाशकारी क्रिया को दर्शाता है।
- source_word: φλεγόμενον
  choice: धधकती
  rationale: आग की तीव्र जलती अवस्था को संक्षिप्त और सजीव रूप में व्यक्त करता है।
- source_word: ἐν τῇ χαλάζῃ
  choice: ओलों में
  rationale: आग के ओलों के बीच अथवा उनमें उपस्थित होने की असाधारण छवि को सीधे सुरक्षित रखता है।
- source_word: ἐν τοῖς ὑετοῖς
  choice: वर्षा में
  rationale: ग्रीक बहुवचन को शब्दशः ‘वर्षाओं’ कहना अस्वाभाविक होता; सामूहिक ‘वर्षा’ अर्थ और गरिमा दोनों रखता है।
- source_word: διαστράπτον
  choice: बिजली-सी चमकती
  rationale: क्रिया में बिजली के समान कौंधने का भाव है; यह हिन्दी में केवल ‘चमकती’ से अधिक स्पष्ट है।
- source_word: τοὺς τῶν ἐχθρῶν καρπούς
  choice: शत्रुओं के फलों
  rationale: καρπούς का मूल रूप ‘फल’ सुरक्षित है, जबकि पादटिप्पणी कृषि-संदर्भ में ‘फसल/उपज’ की सम्भावना स्पष्ट करती है।
theological_decisions:
- issue: ‘वे जान लें’ का कर्ता
  choice: अनिर्दिष्ट बहुवचन ‘वे’ रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘शत्रु’ अथवा घटना देखने वाले सभी लोग कहा जा सकता था।
  rationale: ग्रीक क्रिया में कर्ता स्पष्ट नहीं है; अनिर्दिष्ट रूप मूल पाठ की वास्तविक अस्पष्टता और चिह्न के धार्मिक आशय को सुरक्षित रखता है।
