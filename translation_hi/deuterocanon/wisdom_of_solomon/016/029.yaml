translation:
  language: hi
  text: क्योंकि कृतघ्न की आशा सर्दियों के पाले की तरह पिघल जाएगी और अनुपयोगी पानी की तरह बह जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχάριστου
  choice: कृतघ्न की
  rationale: संबंधकारक एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘कृतघ्न’ कृतज्ञता के अभाव का नैतिक भाव स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐλπὶς
  choice: आशा
  rationale: मूल शब्द का सामान्य अर्थ ‘आशा’ है और प्रसंग में टिक न सकने वाली आशा का वर्णन उचित रूप से करता है।
- source_word: χειμέριος πάχνη
  choice: सर्दियों के पाले
  rationale: यह चयन ऋतु-संबंधी विशेषण और पाले की उपमा दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τακήσεται
  choice: पिघल जाएगी
  rationale: भविष्यकालीन क्रिया यहाँ पाले के गल जाने को व्यक्त करती है; हिन्दी में यह सहज और सटीक है।
- source_word: ῥυήσεται
  choice: बह जाएगी
  rationale: यह मूल के बहकर चले जाने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὕδωρ ἄχρηστον
  choice: अनुपयोगी पानी
  rationale: ἄχρηστον का सीधा अर्थ काम न आने वाला या अनुपयोगी है; यह अनावश्यक व्याख्या जोड़े बिना मूल अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἀχάριστου का नैतिक अभिप्राय
  choice: कृतघ्न की
  alternative: अकृतज्ञ की
  rationale: ‘कृतघ्न’ आधुनिक हिन्दी में स्पष्ट नैतिक अर्थ देता है और मूल के कृतज्ञता-विहीन व्यक्ति के भाव को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
