  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
translation:
  language: hi
  text: क्योंकि तेरे तत्त्व ने तेरे बच्चों के प्रति तेरी मधुरता प्रकट की[a]; और उसे पानेवाले की इच्छा के अनुरूप, वह हर व्यक्ति जो चाहता था उसके अनुसार बदल जाती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे स्वभाव ने तेरे बच्चों के प्रति तेरी मधुरता प्रकट की।” यूनानी शब्द ὑπόστασις का अर्थ “तत्त्व,” “स्वभाव,” या “आधारभूत वास्तविकता” हो सकता है। इस प्रसंग में इसका संबंध मन्ना की प्रकृति या संरचना से भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिसके अनुसार कोई चाहता था।” प्रसंग में आशय है कि भोजन हर व्यक्ति की पसंद के अनुरूप ढल जाता था।
    reason: clarification
lexical_decisions:
- source_word: ὑπόστασίς σου
  choice: तेरी दी हुई वस्तु
  rationale: संदर्भ में यह मन्ना की परमेश्वर-प्रदत्त वास्तविक वस्तु या संरचना की ओर संकेत करता है। शाब्दिक ‘तेरा तत्त्व’ हिन्दी में भ्रामक रूप से परमेश्वर के दार्शनिक सार का संकेत दे सकता है; चुना हुआ रूप वस्तुगत अर्थ बनाए रखता है, जबकि पादटिप्पणी मूल की व्यापकता बताती है।
- source_word: γλυκύτητα
  choice: मधुरता
  rationale: ‘मधुरता’ स्वाद की मिठास और बच्चों के प्रति परमेश्वर की कृपालुता—दोनों अर्थछायाएँ सुरक्षित रखती है।
- source_word: τέκνα
  choice: बच्चों
  rationale: यहाँ समुदाय के सभी सदस्यों के लिए समावेशी और स्वाभाविक हिन्दी शब्द है।
- source_word: τοῦ προσφερομένου
  choice: उसे पानेवाले
  rationale: कृदन्त उस व्यक्ति को दर्शाता है जिसे भोजन प्रस्तुत या प्रदान किया गया; ‘पानेवाला’ प्राप्तकर्ता-केंद्रित भाव को सहज हिन्दी में रखता है।
- source_word: ἐπιθυμίᾳ ὑπηρετῶν
  choice: इच्छा पूरी करते हुए
  rationale: मूल में इच्छा की सेवा करने का चित्र है; हिन्दी में यह प्रयोग उसी अनुकूल प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετεκιρνᾶτο
  choice: बदल जाती थी
  rationale: क्रिया मिश्रण या गुण में परिवर्तन बताती है। स्त्रीलिंग रूप ‘वस्तु’ को पुनः ग्रहण करता है और अपूर्ण भूतकाल पुनरावृत्त अथवा सतत चमत्कारी अनुकूलन व्यक्त करता है।
- source_word: πρὸς ὃ τις ἐβούλετο
  choice: उस स्वाद में ... जिसे हर कोई चाहता था
  rationale: संदर्भ स्वाद और भोजन का है; ‘स्वाद’ जोड़ने से आशय स्पष्ट होता है, पर इसे पादटिप्पणी में व्याख्यात्मक विस्तार के रूप में दर्शाया गया है।
theological_decisions:
- issue: ‘ὑπόστασίς σου’ का संदर्भ
  choice: परमेश्वर द्वारा दी गई मन्ना की वास्तविक वस्तु या संरचना
  alternative: परमेश्वर का अपना स्वभाव या तत्त्व
  rationale: तत्काल प्रसंग भोजन के स्वाद और उसके अनुकूल बदलने का है। इसलिए मुख्य पाठ मन्ना को संदर्भ मानता है, किंतु पादटिप्पणी मूल पद की वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: γλυκύτης का दोहरा संकेत
  choice: स्वादगत मिठास और परमेश्वर की कृपालु मधुरता दोनों को खुला रखना
  alternative: केवल दयालुता या केवल मीठा स्वाद
  rationale: पद्य का भोजन-संबंधी प्रसंग और बच्चों के प्रति परमेश्वर का व्यवहार दोनों अर्थों को सक्रिय करते हैं; ‘मधुरता’ इन्हें अनावश्यक रूप से अलग नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को संबोधन में एकवचन निकटता के लिए ‘तेरी’ रखा गया है। मुख्य पाठ में दार्शनिक ‘तत्त्व’ से उत्पन्न संभावित भ्रम टाला गया है, पर मूल की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
