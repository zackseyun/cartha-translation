  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
translation:
  language: hi
  text: क्योंकि जो मुड़ा था, वह उस वस्तु के द्वारा नहीं जिसे देखा जा रहा था, बल्कि आपके द्वारा—जो सबके[c] उद्धारकर्ता हैं—बचाया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप में, ‘देखी जा रही वस्तु के द्वारा नहीं, बल्कि आपके द्वारा।’ यह वचन बल देता है कि दृश्य वस्तु स्वयं बचाने का कारण नहीं थी; बचाने वाले आप थे।
    reason: alternative_reading
  - marker: c
    text: ‘सबके’ का यूनानी शब्द व्यापक है; इसका आशय ‘सभी लोगों’ या अधिक व्यापक रूप से ‘समस्त’ हो सकता है।
    reason: scope_ambiguity
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: जो व्यक्ति मुड़ा
  rationale: यह क्रिया उस व्यक्ति के मुड़ने को व्यक्त करती है जिसने ठहराए गए चिह्न की ओर ध्यान किया। ‘मन फिराया’ कहने से पश्चात्ताप का ऐसा अर्थ जुड़ सकता है जिसे यूनानी पाठ यहाँ अनिवार्य नहीं करता।
- source_word: τὸ θεωρούμενον
  choice: वह दिखाई देनेवाली वस्तु
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है और उस दृश्य वस्तु को बताता है जिसे देखा जा रहा था। यह चयन वस्तु और परमेश्वर के बीच किए गए स्पष्ट विरोध को बनाए रखता है।
- source_word: ἐσώζετο
  choice: बचाया गया
  rationale: σῴζω का अपूर्ण भूतकाल कर्मवाच्य रूप है। हिन्दी में ‘बचाया गया’ स्वाभाविक है और परमेश्वर को उद्धार के वास्तविक कर्ता के रूप में प्रस्तुत करता है।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह परमेश्वर की उस उपाधि का सीधा और गरिमापूर्ण हिन्दी पर्याय है जो उन्हें बचाने वाले के रूप में पहचानती है।
- source_word: πάντων
  choice: सबके
  rationale: यूनानी शब्द का दायरा व्यापक है। ‘सबके’ उसे केवल मनुष्यों या केवल वस्तुओं तक सीमित किए बिना संक्षिप्त और स्वाभाविक रूप में रखता है।
theological_decisions:
- issue: दृश्य चिह्न और परमेश्वर के बीच कारणात्मक विरोध
  choice: दृश्य वस्तु ने स्वयं नहीं बचाया; परमेश्वर ने बचाया।
  alternative: दृश्य वस्तु वह साधन थी जिसके द्वारा परमेश्वर ने बचाया।
  rationale: οὐ διὰ ... ἀλλὰ διὰ σέ की रचना दृश्य वस्तु और परमेश्वर के बीच स्पष्ट विरोध करती है। अनुवाद इस बात पर बल देता है कि वस्तु अपने आप उद्धार का कारण नहीं थी, पर व्यापक कथा में चिह्न की भूमिका से इनकार भी नहीं करता।
- issue: πάντων का दायरा
  choice: सबके उद्धारकर्ता
  alternative: सभी लोगों के उद्धारकर्ता; समस्त वस्तुओं के उद्धारकर्ता
  rationale: मूल यूनानी व्यापक और कुछ हद तक अनिर्दिष्ट है। ‘सबके’ इस व्यापकता को सुरक्षित रखता है और सार्वभौमिक उद्धार के बारे में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य में मूल यूनानी का ‘नहीं... बल्कि...’ विरोध स्पष्ट रखा गया है।
