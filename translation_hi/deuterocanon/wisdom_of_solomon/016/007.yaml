  to: क्योंकि जो मुड़ा था, वह उस वस्तु के द्वारा नहीं जिसे देखा जा रहा था, बल्कि आपके द्वारा—जो सबके[c] उद्धारकर्ता हैं—बचाया गया।[b]
  rationale: The text is revised only to represent τὸ θεωρούμενον as an object actively being looked at, rather than merely a visible object, and to make the opening clause more natural in Hindi. The broad scope of ‘सबके,’ the causal ‘नहीं ... बल्कि ...’ contrast, and the title ‘उद्धारकर्ता’ are retained. Footnote b is adjusted to explain the contrast without introducing a denominational conclusion.
