  verdict: revise
  source_fidelity: The central causal contrast is retained, and ‘उद्धारकर्ता’ suitably renders σωτήρ. However, ‘दिखाई देनेवाली वस्तु’ means merely ‘visible object’ and does not convey the present passive participle τὸ θεωρούμενον, ‘the thing being looked at.’
  naturalness: The revision uses idiomatic modern Hindi while retaining the source’s contrast. ‘जो मुड़ा था’ is more natural in this context than ‘जो व्यक्ति मुड़ा,’ and ‘जिसे देखा जा रहा था’ is clear without being overly technical.
  terminology: ‘उद्धारकर्ता’ is an appropriate dignified rendering of σωτῆρα. ‘सबके’ preserves the deliberately broad, unspecified scope of πάντων. The respectful ‘आप’ appropriately renders the direct address without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The rendering of τὸ θεωρούμενον is insufficiently specific.
    rationale: ‘दिखाई देनेवाली वस्तु’ denotes an object capable of being seen, whereas the Greek present passive participle denotes the object that was being looked at. The distinction matters because the verse contrasts God with the appointed object of regard.
  - severity: low
    issue: The subject phrase is slightly unnatural and the temporal aspect is underexpressed.
    rationale: ‘जो व्यक्ति मुड़ा’ is grammatically possible, but ‘जो मुड़ा था’ reads more naturally and better accommodates the aorist participle in relation to the imperfect passive main verb.
  revised_text: क्योंकि जो मुड़ा था, वह उस वस्तु के द्वारा नहीं जिसे देखा जा रहा था, बल्कि आपके द्वारा—जो सबके[c] उद्धारकर्ता हैं—बचाया गया।[b]
