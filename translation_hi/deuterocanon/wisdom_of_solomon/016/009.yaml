  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: hi
  text: टिड्डियों और मक्खियों के काटने से जिनकी मृत्यु हुई, उनके प्राणों के लिए कोई उपचार नहीं मिला[a], क्योंकि वे ऐसी चीज़ों से दण्ड पाने योग्य थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके जीवन के लिए कोई उपचार नहीं मिला”; शाब्दिक रूप से, “उनकी आत्मा के लिए कोई उपचार नहीं मिला।”
    reason: ψυχή इस मृत्यु और उपचार के प्रसंग में जीवन या प्राण को सूचित करता है, यद्यपि इसका शाब्दिक अर्थ “आत्मा” भी हो सकता है।
  - marker: b
    text: या, “ऐसे जीवों से।” यूनानी में अधिक व्यापक रूप से “ऐसी चीज़ों से” है।
    reason: ὑπὸ τοιούτων पहले उल्लिखित जीवों की ओर संकेत कर सकता है, लेकिन अभिव्यक्ति स्वयं उन्हें ही सीमित नहीं करती।
lexical_decisions:
- source_word: δήγματα
  choice: डंक
  rationale: यह शब्द जीवों के काटने या डंक मारने से लगे घाव को दर्शाता है। टिड्डियों और मक्खियों की संयुक्त चर्चा में संक्षिप्त और स्वाभाविक हिन्दी के लिए ‘डंक’ चुना गया है।
- source_word: ἀκρίδων
  choice: टिड्डियों
  rationale: ἀκρίς का सामान्य अर्थ टिड्डी है, और विपत्ति के प्रसंग में यही बाइबिलीय रूप से परिचित अर्थ है।
- source_word: μυιῶν
  choice: मक्खियों
  rationale: शब्द का सामान्य और सीधा अर्थ ‘मक्खियाँ’ है; इसे किसी विशेष प्रजाति तक सीमित करने का आधार नहीं है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: क्रिया स्पष्ट रूप से मृत्यु का कारण बनने को व्यक्त करती है; ‘मार डाला’ सहज और प्रत्यक्ष हिन्दी है।
- source_word: οὐχ εὑρέθη ἴαμα
  choice: कोई उपचार नहीं मिला
  rationale: ἴαμα उपचार, औषधि या चंगाई का साधन हो सकता है। इस शारीरिक मृत्यु के प्रसंग में ‘उपचार’ स्वाभाविक है और यूनानी के निष्क्रिय विन्यास को बनाए रखता है।
- source_word: τῇ ψυχῇ αὐτῶν
  choice: उनके प्राण के लिए
  rationale: ψυχή यहाँ जीवित प्राण या जीवन को सूचित करता है। ‘प्राण’ मूल शब्द की अर्थगत व्यापकता को ‘जीवन’ और ‘आत्मा’ के बीच पूरी तरह समाप्त किए बिना मृत्यु के प्रसंग के अनुकूल है।
- source_word: ἄξιοι ἦσαν
  choice: योग्य थे
  rationale: वाक्यांश दण्ड की पात्रता या औचित्य बताता है। ‘योग्य थे’ यूनानी अभिव्यक्ति के निकट है और हिन्दी में बोधगम्य है।
- source_word: ὑπὸ τοιούτων
  choice: ऐसी ही चीज़ों से
  rationale: यूनानी अभिव्यक्ति व्यापक है और केवल जीवों तक सीमित नहीं करती; इसलिए ‘चीज़ों’ से उसकी अस्पष्टता सुरक्षित रहती है।
- source_word: κολασθῆναι
  choice: दण्ड पाने
  rationale: यहाँ क्रिया न्यायिक दण्ड को व्यक्त करती है। ‘दण्ड पाना’ सीधा, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: मृत्यु और उपचार के प्रसंग में ψυχή का अर्थ
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: पद शारीरिक मृत्यु और उपचार न मिलने की बात करता है। ‘प्राण’ इस संदर्भ के अनुकूल है, पर मूल शब्द में निहित जीवन/आत्मा की अर्थगत गुंजाइश को पूरी तरह बंद नहीं करता।
- issue: ἄξιοι ἦσαν ... κολασθῆναι की नैतिक शक्ति
  choice: वे ऐसी ही चीज़ों से दण्ड पाने योग्य थे
  alternative: वे ऐसे जीवों से दण्ड पाने के पात्र थे; वे ऐसे दण्ड के अधिकारी थे
  rationale: मूल पाठ विपत्ति को पात्र दण्ड के रूप में स्पष्टतः प्रस्तुत करता है। अनुवाद इस न्यायिक कथन को सुरक्षित रखता है, पर पद से आगे कोई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। ‘दण्ड’ जैसी बाइबिलीय रूप से परिचित शब्दावली रखी गई है, जबकि वाक्य-विन्यास को स्वाभाविक हिन्दी बनाया गया है।
