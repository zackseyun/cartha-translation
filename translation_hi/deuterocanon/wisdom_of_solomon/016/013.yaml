  choice: अधोलोक
  alternative: हेडीस; कब्र
  rationale: यहाँ यूनानी शब्द मृतकों के लोक को दर्शाता है। ‘अधोलोक’ अर्थ को सहज हिन्दी में रखता है; ‘कब्र’ अर्थ को एक दफन-स्थान तक सीमित कर सकती है। मूल पद की पहचान पादटिप्पणी में दी गई है।
- issue: ἀνάγεις का धार्मिक आशय
  choice: ऊपर ले आता है
  alternative: जिला उठाता है; फिर ऊपर ले आता है
  rationale: यूनानी केवल ऊपर लाने की बात कहता है। यह अनुवाद परमेश्वर के जीवन-मृत्यु संबंधी अधिकार को बनाए रखता है, पर क्रिया को किसी विशिष्ट पुनरुत्थान-सिद्धान्त तक सीमित नहीं करता और मूल में न होने के कारण ‘फिर’ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर को संबोधित करने के लिए काव्यात्मक-प्रार्थनात्मक संदर्भ के अनुरूप ‘तू/तेरा’ रखा गया है। समानांतर क्रियाओं ‘नीचे ले जाता है’ और ‘ऊपर ले आता है’ से मूल यूनानी की दिशा-संबंधी विरोधात्मकता सुरक्षित रहती है।
