base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: hi
  text: क्योंकि तुम्हारे वचनों की याद दिलाने के लिए उन्हें डंक लगते थे, और वे शीघ्र ही बचा लिए जाते थे, ताकि गहरी विस्मृति में पड़कर वे तुम्हारे उपकार से वंचित न हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में अंतिम वाक्यांश असामान्य है; इसका अर्थ यह भी हो सकता है: “तुम्हारे उपकार से उनका ध्यान पूरी तरह न हट जाए” या “वे तुम्हारे उपकार के प्रति असंवेदनशील न हो जाएँ।”'
    reason: ἀπερίσπαστοι के सामान्य अर्थ और यहाँ प्रयुक्त संबंधकारक के कारण वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: λογίων
  choice: वचनों
  rationale: यह शब्द परमेश्वर के कथनों या घोषणाओं को सूचित करता है। ‘वचन’ आधुनिक हिन्दी में स्वाभाविक है और इसके धार्मिक संदर्भ को बनाए रखता है।
- source_word: ἐνεκεντρίζοντο
  choice: उन्हें डंक लगते थे
  rationale: संदर्भ में साँपों के डंक का संकेत है; अपूर्ण भूतकाल की पुनरावृत्त या जारी क्रिया भी इस रूप में बनी रहती है।
- source_word: ὀξέως διεσώζοντο
  choice: वे शीघ्र ही बचा लिए जाते थे
  rationale: ὀξέως की तीव्रता और διεσώζοντο के निष्क्रिय, जारी या पुनरावृत्त बचाव—दोनों को व्यक्त करता है।
- source_word: βαθεῖαν ... λήθην
  choice: गहरी विस्मृति
  rationale: मूल के रूपक और उसकी गंभीरता को निकटता से बनाए रखता है।
- source_word: εὐεργεσίας
  choice: उपकार
  rationale: यह परमेश्वर द्वारा किए गए कल्याणकारी कार्य या कृपापूर्ण भलाई को दर्शाता है; ‘उपकार’ मूल संज्ञा के अर्थ के निकट है।
theological_decisions:
- issue: सर्प-दंश और उद्धार का प्रयोजन
  choice: दंश को परमेश्वर के वचनों की याद दिलाने वाला और शीघ्र बचाव को विस्मृति से रोकने वाला बताया गया है
  alternative: दंश को केवल दंड और बचाव को केवल चंगाई के रूप में स्पष्ट करना
  rationale: मूल पाठ स्मरण, विस्मृति और परमेश्वर के उपकार के बीच तनाव बनाए रखता है; इसलिए उससे आगे कोई विशिष्ट धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: ἀπερίσπαστοι ... τῆς σῆς εὐεργεσίας का कठिन संबंध
  choice: तुम्हारे उपकार से वंचित न हो जाएँ
  alternative: तुम्हारे उपकार से उनका ध्यान न हट जाए / वे तुम्हारे उपकार के प्रति असंवेदनशील न हो जाएँ
  rationale: वाक्यांश का अभिप्राय परमेश्वर के उपकार से प्रभावी रूप से कट जाने या उसका लाभ न पाने की ओर है, पर यूनानी अभिव्यक्ति असामान्य है; अतः वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘डंक लगते थे’ प्रसंग को स्पष्ट करता है, जबकि ‘वचन’, ‘विस्मृति’ और ‘उपकार’ मूल की धार्मिक तथा साहित्यिक गंभीरता बनाए रखते हैं।
