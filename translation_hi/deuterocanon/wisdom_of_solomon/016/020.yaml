base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: hi
  text: इन बातों के बदले, आपने अपनी प्रजा को स्वर्गदूतों का भोजन[a] खिलाया और उनके परिश्रम के बिना उनके लिए स्वर्ग से तैयार रोटी भेजी, जो हर प्रकार का आनंद देने में समर्थ और हर स्वाद के अनुकूल थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “स्वर्गदूतों के योग्य भोजन” भी हो सकता है। यूनानी पदबंध इससे अधिक निश्चित व्याख्या की माँग नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: इन बातों के बदले
  rationale: यह पदबंध पिछले प्रसंग में बताए गए दण्डों और परमेश्वर द्वारा अपनी प्रजा के साथ किए गए भिन्न व्यवहार के बीच विरोध प्रकट करता है।
- source_word: ἀγγέλων τροφήν
  choice: स्वर्गदूतों का भोजन
  rationale: τροφὴ का अर्थ भोजन या पोषण है। यह अनुवाद यूनानी संबंधकारक पदबंध को बनाए रखता है और उसके आशय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐψώμισας
  choice: खिलाया
  rationale: क्रिया का अर्थ किसी को भोजन देना या खिलाना है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ἕτοιμον ἄρτον
  choice: तैयार रोटी
  rationale: ἕτοιμον का अर्थ तैयार या उपलब्ध है; यह परमेश्वर की ओर से पहले से तैयार प्रबन्ध को व्यक्त करता है।
- source_word: ἀπʼ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह स्थानिक स्रोत का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: ἀκοπιάτως
  choice: उनके परिश्रम के बिना
  rationale: यह क्रियाविशेषण थकाने वाले श्रम के अभाव को बताता है। प्रसंग में भोजन प्रजा ने उत्पन्न नहीं किया, बल्कि उन्हें दिया गया था।
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: हर प्रकार का आनंद देने में समर्थ
  rationale: ἰσχύοντα सामर्थ्य या क्षमता और ἡδονή आनंद को व्यक्त करता है। यह हिन्दी प्रयोग रोटी की आनंददायक सामर्थ्य को बिना अतिव्याख्या के स्पष्ट करता है।
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: हर स्वाद के अनुकूल
  rationale: γεῦσις स्वाद और ἁρμόνιον उपयुक्तता या अनुरूपता को व्यक्त करता है; यह सरल और मुहावरेदार हिन्दी है।
theological_decisions:
- issue: मन्ना को “स्वर्गदूतों का भोजन” कहना
  choice: स्वर्गदूतों का भोजन
  alternative: स्वर्गदूतों के योग्य भोजन
  rationale: यूनानी संबंधकारक यह निश्चित नहीं करता कि भोजन स्वर्गदूतों का अपना भोजन था या उनके योग्य भोजन। मुख्य पाठ पारम्परिक अभिव्यक्ति और उसकी वास्तविक अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, आदरपूर्ण और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर के लिए सम्मानसूचक “आप” का प्रयोग किया गया है; वाक्यरचना मूल यूनानी के क्रम और बल को यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी रखती है।
