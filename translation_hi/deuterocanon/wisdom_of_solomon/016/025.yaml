  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
translation:
  language: hi
  text: इसलिए उस समय भी वह हर प्रकार से रूप बदलती हुई[a], ज़रूरतमंदों की इच्छा के अनुसार[b], आपके उस वरदान की सेवा करती है जो सबका पोषण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वस्तु में बदलती हुई।” यूनानी अभिव्यक्ति असाधारण अनुकूलनशीलता पर बल देती है। संदर्भ में इसका संबंध सृष्टि अथवा स्वर्गीय प्रबंध से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “माँगने वालों की इच्छा के अनुसार।” यूनानी शब्द आवश्यकता रखने वालों या माँगने वालों—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  choice: इसलिए उस समय भी
  rationale: यह पद पिछले कथन से निष्कर्ष जोड़ता है; καί को ‘भी’ के रूप में और τότε को स्पष्ट काल-संकेत के रूप में रखा गया है।
- source_word: εἰς πάντα μεταλλευομένη
  choice: हर प्रकार से रूप बदलती हुई
  rationale: यह अभिव्यक्ति विभिन्न रूपों या गुणों के अनुकूल हो जाने का भाव देती है। सहज हिन्दी के लिए ‘हर प्रकार से’ चुना गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है। स्त्रीलिंग क्रिया पिछले पद की ‘सृष्टि’ के साथ यूनानी व्याकरणिक संबंध को बनाए रखती है, पर मुख्य पाठ में संज्ञा जोड़कर आशय को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  choice: आपके उस वरदान की ... जो सबका पोषण करता है
  rationale: παντοτρόφος का मूल भाव ‘सबका पोषण करने वाला’ है। सम्बन्धवाचक वाक्य हिन्दी में स्वाभाविक है और समास की गरिमा भी बनाए रखता है।
- source_word: ὑπηρετεῖ
  choice: सेवा करती रही
  rationale: क्रिया किसी उद्देश्य या वरदान की सेवा में तत्पर रहने का अर्थ देती है। अपूर्ण भूतकालीन हिन्दी रूप प्रसंग में उस समय जारी सेवा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  choice: ज़रूरतमंदों की इच्छा के अनुसार
  rationale: δεομένων का अर्थ आवश्यकता रखने वाले या माँगने वाले, दोनों हो सकता है। मुख्य पाठ में व्यापक ‘ज़रूरतमंदों’ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: रूप बदलने वाले कर्ता की पहचान
  choice: मुख्य पाठ में ‘वह’ रखा गया है और स्त्रीलिंग क्रिया द्वारा पिछले पद की ‘सृष्टि’ से संबंध बनाए रखा गया है।
  alternative: कर्ता को स्पष्ट रूप से ‘सृष्टि’, ‘मन्ना’ या ‘स्वर्गीय भोजन’ कहा जा सकता है।
  rationale: यूनानी पाठ में इस पद के भीतर कर्ता-संज्ञा दोहराई नहीं गई; स्त्रीलिंग कृदन्त पिछले प्रसंग की κτίσις (‘सृष्टि’) से जुड़ता है, जबकि निकट संदर्भ स्वर्गीय भोजन की अनुकूलनशीलता पर केंद्रित है। सर्वनाम मूल पाठ की साहित्यिक अस्पष्टता और दोनों संदर्भगत स्तरों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ईश्वर के संबोधन के लिए आदरसूचक ‘आपके’ चुना गया है। वाक्य-विन्यास यूनानी के काव्यात्मक व्यक्तिकरण को बनाए रखते हुए स्वाभाविक हिन्दी में रखा गया है।
