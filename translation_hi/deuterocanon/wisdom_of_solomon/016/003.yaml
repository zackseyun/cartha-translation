translation:
  language: hi
  text: ताकि वे लोग, भोजन की लालसा रखते हुए भी, उनके विरुद्ध भेजे गए जीवों को देखकर अपनी ज़रूरी भूख से भी मुँह मोड़ लें; पर ये लोग थोड़े समय के लिए अभाव में पड़कर अनोखे स्वाद वाले भोजन का स्वाद चखें।
