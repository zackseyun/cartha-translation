theological_decisions:
- issue: ‘वे लोग’ और ‘ये लोग’ किन समूहों को सूचित करते हैं
  choice: मुख्य पाठ में यूनानी के संकेतात्मक विरोध—‘वे लोग’ और ‘ये लोग’—को बनाए रखा गया है। प्रसंग में पहला समूह विपत्ति से पीड़ित मिस्री और दूसरा थोड़े समय तक भोजन के अभाव में रहे इस्राएली हैं।
  alternative: समूहों को सीधे ‘मिस्री’ और ‘इस्राएली’ कहना, अथवा सामान्य रूप से ‘दुष्ट’ और ‘धर्मी’ कहना।
  rationale: निकटवर्ती प्रसंग ऐतिहासिक समूहों की पहचान कराता है, लेकिन इस पद का यूनानी पाठ स्वयं सर्वनाम-सदृश विरोध का प्रयोग करता है। उसे बनाए रखना अधिक स्रोत-संगत है और अनावश्यक व्याख्या को मुख्य पाठ में आने से रोकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में ‘वे लोग…पर ये लोग’ का विरोध मूल यूनानी संरचना के अनुसार सुरक्षित है। अर्धविराम दोनों समूहों के विपरीत अनुभव को स्पष्ट करता है।
