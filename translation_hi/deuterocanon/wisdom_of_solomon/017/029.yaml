translation:
  language: hi
  text: क्योंकि कृतघ्न की आशा सर्दी के पाले की तरह पिघल जाएगी और बेकार पानी की तरह बह जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह चित्र ऐसे पानी की ओर संकेत कर सकता है जो बहकर निकल जाता है और ठहरता नहीं है, इसलिए किसी काम नहीं आता।
    reason: cultural_note
lexical_decisions:
- source_word: ἀχαρίστου
  choice: कृतघ्न मनुष्य की
  rationale: सम्बन्धकारक एकवचन विशेषण किसी ऐसे व्यक्ति को दर्शाता है जिसमें कृतज्ञता का अभाव है। हिन्दी में विशेषण को संज्ञात्मक अर्थ देने के लिए ‘मनुष्य’ जोड़ा गया है; इससे व्यापक ‘अधर्मी’ जैसा अर्थ आयात नहीं होता।
- source_word: ἐλπίς
  choice: आशा
  rationale: यहाँ सामान्य और काव्यात्मक अर्थ ‘आशा’ है; ‘अपेक्षा’ इस नैतिक संदर्भ में कम स्वाभाविक है।
- source_word: χειμέριος πάχνη
  choice: सर्दियों के पाले
  rationale: यह वाक्यांश शीतकालीन पाले की छवि देता है। ‘सर्दियों का पाला’ आधुनिक हिन्दी में सहज और चित्रात्मक है।
- source_word: τακήσεται
  choice: पिघल जाएगी
  rationale: τήκω का भविष्यकालीन रूप पिघलने या गल जाने को व्यक्त करता है और पाले की उपमा के साथ ‘पिघल जाएगी’ सीधा समतुल्य है।
- source_word: ῥυήσεται
  choice: बह जाएगी
  rationale: क्रिया पानी के बह निकलने या बह जाने का भाव देती है; ‘बह जाएगी’ संक्षिप्त, स्वाभाविक और मूल छवि के अनुरूप है।
- source_word: ὕδωρ ἄχρηστον
  choice: बेकार पानी
  rationale: ἄχρηστος का अर्थ अनुपयोगी या किसी काम का न होना है। ‘बेकार पानी’ मूल की संक्षिप्त नैतिक-काव्यात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: ἀχαρίστου का नैतिक चरित्रांकन
  choice: कृतघ्न मनुष्य
  alternative: अकृतज्ञ मनुष्य; अधर्मी
  rationale: यूनानी शब्द सीधे कृतज्ञता के अभाव को व्यक्त करता है। ‘कृतघ्न मनुष्य’ उसी नैतिक दोष को स्पष्ट करता है, जबकि ‘अधर्मी’ मूल से अधिक व्यापक धार्मिक श्रेणी जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली रखी गई है। वाक्य की दोनों उपमाएँ और भविष्यकालीन निश्चितता सुरक्षित हैं; वास्तविक अर्थगत अनिश्चितता केवल ‘बेकार पानी’ की छवि के सम्भावित संकेत पर पादटिप्पणी में रखी गई है।
