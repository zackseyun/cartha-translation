  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/014.yaml
  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
translation:
  language: hi
  text: पर वे एक ही नींद सो रहे थे, और सचमुच शक्तिहीन रात शक्तिहीन अधोलोक की गहराइयों से उन पर आ पड़ी थी,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “सचमुच अप्रतिरोध्य रात अप्रतिरोध्य अधोलोक की गहराइयों से उन पर आ पड़ी थी।” यूनानी में दोनों जगह एक ही मूल शब्द (ἀδύνατος) दोहराया गया है। उसका ठीक भाव निश्चित करना कठिन है: शाब्दिक अर्थ “शक्तिहीन/असमर्थ” हो सकता है, पर प्रसंग में “जिसका प्रतिरोध न किया जा सके” का अर्थ भी निकल सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον ... ἀδυνάτου
  choice: शक्तिहीन ... शक्तिहीन
  rationale: दोनों स्थानों पर एक ही यूनानी मूल की पुनरावृत्ति है। ‘शक्तिहीन’ उसका मूल अर्थ सुरक्षित रखता है, जबकि प्रसंग में ‘जिसका प्रतिरोध न किया जा सके’ का भाव भी संभव है।
- source_word: ὄντως
  choice: सचमुच
  rationale: यह रात के वर्णन पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ᾅδου
  choice: अधोलोक
  rationale: यह मृतकों के लोक के लिए प्रयुक्त यूनानी शब्द को व्यक्त करता है और ‘नरक’ से जुड़ी बाद की विशिष्ट धर्मवैज्ञानिक धारणाएँ आरोपित नहीं करता।
- source_word: μυχῶν
  choice: गहराइयों
  rationale: शब्द भीतर के छिपे हुए स्थानों या सुदूर अंतरतम भागों को सूचित करता है; ‘गहराइयों’ से भयावह स्थान-बिंब बना रहता है।
- source_word: ἐπελθοῦσαν
  choice: उन पर आ पड़ी थी
  rationale: रात के उन पर आ जाने को सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν αὐτὸν ὕπνον κοιμώμενοι
  choice: एक ही नींद सो रहे थे
  rationale: सभी के समान नींद की अवस्था में होने का भाव रखते हुए यूनानी अभिव्यक्ति की पुनरुक्ति को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडेस; मृतकों का लोक; नरक
  rationale: ‘अधोलोक’ इस यूनानी यहूदी ग्रंथ के मृतकों के लोक संबंधी बिंब को स्वाभाविक हिन्दी में रखता है; ‘नरक’ दंड के स्थान का अधिक विशिष्ट, बाद का अर्थ ला सकता है।
- issue: ἀδύνατος की संदिग्ध अर्थच्छाया
  choice: शक्तिहीन
  alternative: अप्रतिरोध्य; जिससे बचना असंभव हो
  rationale: मूल अर्थ और दोनों प्रयोगों में शब्द-पुनरावृत्ति को मुख्य पाठ में रखा गया है; प्रसंगगत वैकल्पिक अर्थ को पाद-टिप्पणी में दिया गया है ताकि तनाव को चुपचाप हल न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद यूनानी में आगे चलने वाले वाक्य का अंश है, इसलिए अंत में अल्पविराम रखा गया है।
