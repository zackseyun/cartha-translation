  rationale: यह मूल भावात्मक अवस्था को व्यापक और स्वाभाविक ढंग से व्यक्त करता है; ‘आतंक’ यूनानी शब्द की तीव्रता को अनावश्यक रूप से बढ़ा देता।
- source_word: οὐθὲν ... εἰ μὴ
