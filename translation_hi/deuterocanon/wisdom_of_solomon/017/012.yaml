- source_word: προδοσία
  choice: विश्वासघात
  rationale: यह शब्द अपने ही उपलब्ध सहारों का साथ छोड़ देने की मूल रूपकात्मक धार को बनाए रखता है; केवल ‘त्याग’ कहने से विश्वासघात का भाव मंद पड़ जाता।
- source_word: βοηθημάτων
  choice: सहारों
  rationale: बहुवचन को बनाए रखते हुए यह साधारण आधुनिक हिन्दी में सहायता देने वाले आंतरिक साधनों या संसाधनों का स्वाभाविक संकेत देता है।
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: विचार-विवेक से मिलने वाले
  rationale: λόγισμος यहाँ सोच-विचार, तर्क और विवेकपूर्ण मनन का बोध कराता है। ‘विचार-विवेक’ इस अर्थ-परास को सहज हिन्दी में रखता है, और ἀπό के स्रोत-भाव को ‘से मिलने वाले’ व्यक्त करता है।
