  rationale: पद किसी विशिष्ट मत-सिद्धांत की स्थापना नहीं करता, बल्कि भय के कारण विवेकपूर्ण सोच से मिलने वाले सहारों को छोड़ देने पर दार्शनिक टिप्पणी करता है। ‘विचार-विवेक’ इस तनाव को बिना किसी सांप्रदायिक अर्थ के सुरक्षित रखता है।
