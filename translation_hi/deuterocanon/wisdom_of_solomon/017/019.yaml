translation:
  language: hi
  text: या नीचे गिरती चट्टानों का कर्कश धमाका[a], या कुलाँचे भरते पशुओं की अदृश्य दौड़[b], या अत्यन्त हिंस्र जंगली पशुओं की दहाड़, या पर्वतों के गह्वर से लौटती प्रतिध्वनि[c]—यह सब उन्हें आतंकित करके जड़ कर देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीचे फेंकी जाती चट्टानों का।” यूनानी शब्द केवल गिरने के बजाय बलपूर्वक नीचे फेंके जाने का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कुलाँचे भरते पशुओं की दिखाई न देने वाली दौड़।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “पर्वतों के खोखले स्थान से पलटकर आती प्रतिध्वनि।”
    reason: lexical_alternative
