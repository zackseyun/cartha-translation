  choice: अत्यन्त हिंस्र जंगली पशुओं की दहाड़
  rationale: ὠρύομαι जंगली पशुओं की ऊँची गर्जना को सूचित करता है; ἀπηνεστάτων का उत्कृष्टतम भाव ‘अत्यन्त हिंस्र’ से सुरक्षित रहता है। हिन्दी में ‘दहाड़’ ध्वनि और क्रिया दोनों को स्वाभाविक रूप से समेटती है।
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: पहाड़ों की खोखली गहराइयों से लौटती प्रतिध्वनि
  rationale: ἀντανακλωμένη ध्वनि के पलटकर आने और κοιλότης पहाड़ों के भीतर की खोखली जगह या गहराई को व्यक्त करता है।
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: उन्हें आतंकित करके जड़ कर देता था
  rationale: παραλύω यहाँ भय से निष्क्रिय या शक्तिहीन कर देने का भाव रखता है, जबकि ἐκφοβέω तीव्र आतंक को कारण अथवा रीति के रूप में व्यक्त करता है।
