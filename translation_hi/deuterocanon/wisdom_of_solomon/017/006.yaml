  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: hi
  text: उन्हें केवल एक स्वतः प्रज्वलित, भय से भरी आग[a] दिखाई देती थी; और उस अनदेखे दृश्य[b] से अत्यन्त भयभीत होकर वे दिखाई देनेवाली वस्तुओं को उससे भी बदतर मानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने-आप भड़की हुई आग” अथवा “अपने-आप जली हुई आग।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “वह अनदेखा दृश्य”; यह जानबूझकर प्रयुक्त विरोधाभासी अभिव्यक्ति है।
    reason: lexical_alternative
