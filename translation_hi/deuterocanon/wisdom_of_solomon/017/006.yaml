  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए सहज किंतु गरिमापूर्ण। मूल के भयपूर्ण वातावरण और ‘अनदेखे दृश्य’ के विरोधाभास को सुरक्षित रखा गया है।
