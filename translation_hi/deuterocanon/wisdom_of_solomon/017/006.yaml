    issue: The comparative χείρω is rendered as 'उससे भी अधिक भयानक.'
    rationale: '''भयानक'' supplies the specific sense ''frightening/terrible,'' while χείρω more broadly means ''worse.'' The translation should retain the broader comparative judgment.'
  - severity: low
