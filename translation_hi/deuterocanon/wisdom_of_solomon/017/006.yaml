- source_word: χείρω τὰ βλεπόμενα
  choice: दिखाई देनेवाली वस्तुओं को उससे भी अधिक भयानक
  rationale: तुलनात्मक χείρω को ‘उससे भी अधिक’ द्वारा स्पष्ट किया गया है; प्रसंग में ‘भयानक’ साधारण ‘बुरा’ से अधिक सटीक है।
