  rationale: यूनानी अभिव्यक्ति मनोवैज्ञानिक आतंक और विकृत अनुभूति का तनाव बनाए रखती है; उसे समझाकर सपाट कर देना मूल से अधिक निश्चित अर्थ थोपता।
- issue: अलौकिक प्रसंग में αὐτομάτη का अनुवाद
  choice: अपने-आप जली हुई
