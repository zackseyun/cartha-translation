  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: hi
  text: क्योंकि वे यह सोचते थे कि वे अपने गुप्त पापों में छिपे रहेंगे, विस्मृति के प्रकाशहीन आवरण के नीचे वे तितर-बितर कर दिए गए; वे बहुत स्तब्ध थे और आभासों[a] से व्याकुल हो उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रेत’, ‘छवियाँ’ अथवा ‘प्रकट रूप’। यूनानी शब्द किसी छवि-जैसे या प्रेत-सदृश दिखाई देने वाले रूप का बोध करा सकता है।
    reason: lexical_alternative
