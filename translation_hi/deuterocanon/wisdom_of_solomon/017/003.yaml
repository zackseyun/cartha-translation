- source_word: θαμβούμενοι δεινῶς
  choice: बुरी तरह स्तब्ध थे
  rationale: θαμβέω विस्मय, स्तब्धता और भययुक्त चकित होने का भाव रखता है; δεινῶς उसकी तीव्रता बढ़ाता है।
- source_word: ἰνδάλμασιν
  choice: प्रेताकार दृश्यों
  rationale: ἴνδαλμα छवि, आभास, प्रेत या आकृति हो सकता है। ‘प्रेताकार दृश्य’ भयावह, छवि-जैसे प्रकटाव को व्यक्त करता है, पर उनके वस्तुगत या मानसिक स्वरूप को निश्चित नहीं करता।
