base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/021.yaml
  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: hi
  text: किन्तु केवल उन्हीं पर भारी रात छा गई[a], उस अन्धकार की छवि जो उन्हें अपने में लेने वाला था[b]; फिर भी वे अपने लिए अन्धकार से भी अधिक भारी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में «भारी» शब्द रात और अंतिम उपमा, दोनों के लिए प्रयुक्त हुआ है; इसलिए «भारी रात» और «अधिक भारी» का शब्द-चित्र जानबूझकर समान रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: «जो उन्हें अपने में लेने वाला था» आने वाले, अधिक बड़े न्याय की ओर संकेत कर सकता है, पर पाठ यह स्पष्ट नहीं करता कि वह ऐतिहासिक, अन्तकालीन, या मरणोत्तर है।
    reason: alternative_reading
