- source_word: μόνοις δὲ ἐκείνοις
  choice: पर केवल उन्हीं पर
  rationale: μόνοις और ἐκείνοις का संयुक्त बल उस समूह की विशिष्टता पर है; हिन्दी में यह पदक्रम उसी विरोध और अनन्यता को स्वाभाविक रूप से रखता है।
- source_word: ἐπέτατο βαρεῖα νύξ
  choice: एक भारी रात छा गई
  rationale: ἐπέτατο में ऊपर फैलने या आ पड़ने का भाव है। 'छा गई' रात के लिए स्वाभाविक हिन्दी है, जबकि 'भारी' βαρεῖα को प्रत्यक्ष रखकर अंतिम βαρύτεροι के साथ शब्द-प्रतिध्वनि बचाता है।
- source_word: εἰκὼν
  choice: छवि
  rationale: εἰκών का सीधा अर्थ छवि या प्रतिरूप है; 'छवि' वर्तमान रात और आने वाले अन्धकार के सांकेतिक सम्बन्ध को संक्षेप में व्यक्त करता है।
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: उस अन्धकार की ... जो उन्हें अपने भीतर लेने वाला था
  rationale: μέλλοντος भावी स्थिति बताता है और διαδέχεσθαι यहाँ ग्रहण करने या अपने अधिकार में लेने की अशुभ छवि देता है। यह अनुवाद उसे किसी विशिष्ट परलोक-सिद्धान्त तक सीमित नहीं करता।
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: फिर भी वे स्वयं अपने लिए उस अन्धकार से भी अधिक भारी थे
  rationale: यह रूप ἑαυτοῖς के 'अपने लिए' और βαρύτεροι के तुलनात्मक 'अधिक भारी' दोनों को बनाए रखता है तथा पहले आए 'भारी रात' की जानबूझकर की गई पुनरुक्ति सुरक्षित करता है।
theological_decisions:
- issue: भावी अन्धकार का स्वरूप
  choice: पाठ इसे आने वाले अन्धकार के रूप में खुला रखता है, जिसकी छवि वर्तमान रात है।
  alternative: इसे केवल मनोवैज्ञानिक भय अथवा निश्चित रूप से मरणोत्तर दण्ड मानना।
  rationale: यूनानी वाक्य आने वाले न्याय की ओर संकेत कर सकता है, पर उसका ऐतिहासिक, अन्तकालीन या मरणोत्तर स्वरूप स्पष्ट नहीं करता; इसलिए अनुवाद इस तनाव को नहीं सुलझाता।
- issue: अपने लिए अन्धकार से अधिक भारी होना
  choice: पाठ की कठोर और आत्म-सन्दर्भित उपमा को यथावत रखना।
  alternative: इसे स्पष्ट करके 'उनका अपराधबोध/आतंक अन्धकार से अधिक पीड़ादायक था' कहना।
  rationale: मूल पाठ कारण को अपराधबोध, भय या किसी अन्य आन्तरिक दशा के रूप में परिभाषित नहीं करता; व्याख्यात्मक विस्तार से बचना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। 'अन्धकार' और 'छवि' साहित्यिक-बाइबलीय स्तर बनाए रखते हैं; मूल की असामान्य 'भारी' उपमा और उसका पुनरावर्तन जानबूझकर सुरक्षित रखा गया है।
