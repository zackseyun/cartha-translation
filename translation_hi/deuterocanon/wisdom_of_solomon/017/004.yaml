  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/004.yaml
  text: For not even the inner chamber that held them kept them free from fear[a], but sounds that troubled them rang around them[b], and gloomy apparitions with unsmiling faces appeared.
translation:
  language: hi
  text: क्योंकि जिस भीतरी कक्ष ने उन्हें अपने भीतर रखा था, वह भी उन्हें भयमुक्त न रख सका; बल्कि उन्हें व्याकुल करनेवाली आवाज़ें उनके चारों ओर गूँजती रहीं[a], और मुस्कानरहित, उदास चेहरोंवाली प्रेताभ आकृतियाँ प्रकट होती रहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त दुर्लभ यूनानी क्रिया बार-बार चारों ओर उठनेवाली गूँज या कोलाहल का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रेताभ आकृतियाँ’ के लिए यूनानी शब्द का अनुवाद ‘भयावह आकृतियाँ’ या ‘छायामूर्तियाँ’ भी हो सकता है; वह किसी अलौकिक या विचित्र दृश्य रूप को सूचित करता है।
    reason: lexical_alternative
