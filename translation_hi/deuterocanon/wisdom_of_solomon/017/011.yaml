base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: hi
  text: क्योंकि दोषी ठहराई गई दुष्टता विशेष रूप से अपनी कायरता प्रकट करती है[a]; और विवेक के दबाव में वह सदा भयावह बातों की आशंका करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्योंकि दुष्टता, दोषी ठहराई जाने पर, विशेष रूप से कायर होती है; और विवेक के दबाव में सदा भयावह बातों की आशंका करती है।” यूनानी में ‘गवाही देना/प्रमाण देना’, ‘दोषी ठहराया जाना’, और ‘कायर होना’ के परस्पर संबंध को अलग-अलग ढंग से समझा जा सकता है।'
    reason: यूनानी μαρτυρεῖ, καταδικαζομένη, और δειλόν की संक्षिप्त वाक्यरचना का वैकल्पिक संबंध सुरक्षित रखना; निष्क्रिय καταδικαζομένη को अनावश्यक रूप से आत्मवाचक न बनाना।
lexical_decisions:
- source_word: δειλὸν
  choice: कायर
  rationale: यह विशेषण केवल भयभीत होने के बजाय कायरता का नैतिक गुण व्यक्त करता है; ‘कायर’ उस तीखेपन को बनाए रखता है।
- source_word: ἰδίως
  choice: विशेष रूप से
  rationale: यह स्वाभाविक आधुनिक हिन्दी में क्रिया-विशेषण की बलवत्ता को व्यक्त करता है, बिना ‘स्वभावतः’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: πονηρία
  choice: दुष्टता
  rationale: यह अमूर्त नैतिक बुराई को स्पष्ट रूप से व्यक्त करता है और प्रसंग के नैतिक-मनोवैज्ञानिक स्वर के अनुकूल है।
- source_word: μαρτυρεῖ καταδικαζομένη
  choice: वह स्वयं अपने को दोषी ठहराती है
  rationale: μαρτυρεῖ (‘गवाही देती है’) और καταδικαζομένη (‘दोषी ठहराई जाती हुई’) का संयुक्त भाव अन्तःकरण में अपने विरुद्ध गवाही देकर स्वयं को दोषी ठहराने का है। हिन्दी में यह रूप अर्थ को स्वाभाविक ढंग से संप्रेषित करता है; पदानुक्रम की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: προσειληφεν
  choice: आशंका करती है
  rationale: पूर्णकालिक क्रिया का प्रसंगगत भाव मन में कठिन या भयावह बातों को पहले से ग्रहण करने अथवा अपेक्षित मानने का है; नकारात्मक प्रसंग में ‘आशंका करना’ स्वाभाविक है।
- source_word: τὰ χαλεπὰ
  choice: अनिष्ट
  rationale: बहुवचन वाक्यांश कठिन, दुःखद या भयावह बातों को समेटता है। ‘अनिष्ट’ संक्षिप्त रूप में आने वाली बुरी घटनाओं का व्यापक भाव देता है।
- source_word: συνεχομένη τῇ συνειδήσει
  choice: विवेक के दबाव में
  rationale: συνέχω का दबाने या जकड़ने का बिंब और συνείδησις का नैतिक अन्तर्बोध दोनों इस सहज हिन्दी अभिव्यक्ति में बने रहते हैं।
theological_decisions:
- issue: दोषबोध की नैतिक मनोविज्ञान
  choice: दुष्टता अपने ही नैतिक विवेक से दोषी ठहरकर कायर बनती और अनिष्ट की आशंका करती है।
  alternative: इसे अधिक निरपेक्ष रूप में भी पढ़ा जा सकता है कि दोषी ठहराई जाती हुई दुष्टता भयावह बातों की गवाही देती या उनकी अपेक्षा करती है।
  rationale: καταδικαζομένη को συνεχομένη τῇ συνειδήσει के साथ पढ़ने पर आन्तरिक दोषबोध प्रमुख दिखता है, पर पदों की सम्भावित वैकल्पिक संरचना पादटिप्पणी में रखी गई है; कोई अतिरिक्त धार्मिक सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विवेक’ को नैतिक अन्तर्बोध के अर्थ में लिया गया है। मुख्य पाठ में स्वाभाविक हिन्दी को प्राथमिकता दी गई है और वास्तविक शाब्दिक/वाक्यरचनात्मक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
