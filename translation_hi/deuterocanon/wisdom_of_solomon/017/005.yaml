lexical_decisions:
- source_word: πυρὸς ... βία
  choice: आग की कोई भी शक्ति
  rationale: सम्बन्धकारक रचना और प्रभावकारी सामर्थ्य का भाव सुरक्षित है; ‘शक्ति’ आधुनिक हिन्दी में ‘बल’ या ‘हिंसा’ से अधिक स्वाभाविक है।
- source_word: κατίσχυεν φωτίζειν
  choice: प्रकाश देने में सफल न हुई
  rationale: अपूर्ण भूतकाल में निहित लगातार असफलता और क्रिया के उद्देश्य—प्रकाश देना—दोनों स्पष्ट होते हैं।
- source_word: ἄστρων ἔκλαμπροι φλόγες
  choice: तारों की चमकती ज्वालाएँ
  rationale: मूल की सजीव और काव्यात्मक अग्नि-छवि को बनाए रखता है।
- source_word: καταυγάζειν ὑπέμενον
  choice: आलोकित करती रह सकीं
  rationale: ὑπομένω के ‘टिके रहना/जारी रखना’ और καταυγάζω के ‘आलोकित करना’—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: στυγνὴν ... νύκτα
  choice: भयावह रात
  rationale: στυγνός की घृणित, मनहूस अथवा दारुण भाव-छाया को प्रसंगानुकूल और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विपत्ति के प्रसंग में असाधारण ब्रह्मांडीय अंधकार का काव्यात्मक चित्रण
  choice: आग और तारों, दोनों के प्रकाश को निष्फल बताने वाली मूल अतिशयोक्तिपूर्ण-काव्यात्मक छवि बनाए रखी गई।
  alternative: इसे केवल सामान्य प्राकृतिक अंधकार या केवल मानसिक आतंक के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ अंधकार की प्रकृति की कोई एक व्याख्या निर्धारित नहीं करता; इसलिए भौतिक और मनोवैज्ञानिक आयामों के बीच का तनाव अनसुलझा रखा गया है।
