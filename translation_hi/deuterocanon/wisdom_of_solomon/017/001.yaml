    issue: “अशिक्षित” narrows ἀπαίδευτοι.
    rationale: In current Hindi, “अशिक्षित” predominantly denotes lack of formal education/literacy. The Greek can include being untrained, uninstructed, or lacking moral-intellectual formation. “शिक्षा-दीक्षा से रहित” retains this broader sense without forcing a single theological interpretation.
  - severity: low
