  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes man[c][b], but your word preserves those who trust in you.
translation:
  language: hi
  text: ताकि तेरे पुत्र, जिनसे तूने प्रेम किया, यह सीखें, हे प्रभु, कि फसलों की उपज[a] मनुष्य का पोषण नहीं करती, बल्कि तेरा वचन तुझ पर भरोसा रखने वालों[b] को जीवित रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इसका अर्थ ‘फलों की उत्पत्तियाँ’ हो सकता है; यहाँ आशय खेतों में उत्पन्न होने वाली पैदावार से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुझ पर विश्वास करने वालों’; यूनानी पद का अर्थ ‘तेरी बात को सत्य मानने वालों’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: ताकि ... यह सीखें
  rationale: ἵνα के साथ संभावनार्थक क्रिया उद्देश्य व्यक्त करती है; यह रूप हिंदी में उस प्रयोजन को स्वाभाविक ढंग से बनाए रखता है।
- source_word: οἱ υἱοί σου
  choice: तेरे पुत्र
  rationale: यूनानी पाठ में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है; इसे ‘सन्तान’ कहकर लिंग-सूचना को मिटाया नहीं गया।
- source_word: οὓς ἠγάπησας
  choice: जिनसे तूने प्रेम किया
  rationale: ἠγάπησας सामान्य भूतकाल है; ‘प्रेम किया’ उसके काल और अर्थ को सीधे व्यक्त करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को आधुनिक, गरिमापूर्ण हिंदी में स्पष्ट किया गया है।
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: फसलों की उपज नहीं
  rationale: यहाँ γενέσεις उत्पत्ति या वंशावलियाँ नहीं, बल्कि उगी हुई पैदावार दर्शाता है; καρποί कृषि-सन्दर्भ में फसल या उपज है।
- source_word: τρέφουσιν ἄνθρωπον
  choice: मनुष्य का पोषण ... करती
  rationale: τρέφω का अर्थ खिलाना या पोषण करना है और ἄνθρωπος यहाँ एकवचन में सामान्य मानव का प्रतिनिधित्व करता है।
- source_word: τὸ ῥῆμά σου
  choice: तेरा वचन
  rationale: ῥῆμα बोले हुए वचन या कथन को दर्शाता है; ‘वचन’ स्वाभाविक और संदर्भानुकूल है।
- source_word: τοὺς σοὶ πιστεύοντας
  choice: तुझ पर भरोसा रखनेवालों
  rationale: πιστεύω के साथ सम्प्रदान कारक व्यक्तिगत विश्वास और निर्भरता का भाव दे सकता है; ‘भरोसा रखना’ इसे स्पष्ट करता है।
- source_word: διατηρεῖ
  choice: जीवित रखता है
  rationale: διατηρέω का मूल भाव बचाए या बनाए रखना है; भोजन द्वारा पोषण के साथ विरोध के इस संदर्भ में ‘जीवित रखता है’ स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: ἄνθρωπον का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानवजाति / किसी व्यक्ति
  rationale: ‘मनुष्य’ यूनानी एकवचन को बनाए रखते हुए सामान्य रूप से सभी मनुष्यों को समेट सकता है।
- issue: πιστεύοντας में विश्वास अथवा भरोसे की छाया
  choice: तुझ पर भरोसा रखनेवालों
  alternative: तुझ पर विश्वास करनेवालों / तेरी बात माननेवालों
  rationale: सम्प्रदान σοὶ के साथ यह वाक्य परमेश्वर पर व्यक्तिगत निर्भरता का अर्थ सहज रूप से देता है, पर विश्वास या उसकी बात को सत्य मानने की सम्भावना भी बनी रहती है।
- issue: दैवी वचन द्वारा संरक्षण
  choice: तेरा वचन ... जीवित रखता है
  alternative: तेरा वचन ... सुरक्षित रखता है / बनाए रखता है
  rationale: कृषि-उपज द्वारा पोषण के विपरीत यहाँ जीवन को कायम रखने का संदर्भ प्रबल है; अनुवाद इसे किसी विशिष्ट साम्प्रदायिक सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन सम्बोधन ‘तू/तेरा’ तथा ‘हे प्रभु’ अपनाया गया है। वाक्य की उद्देश्य-संरचना और कृषि-उपज बनाम दैवी वचन का मूल विरोध सुरक्षित रखा गया है।
