- source_word: εὐλάβειαν
  choice: भयशीलता
  rationale: यद्यपि अन्य प्रसंगों में इसका अर्थ सावधानी या श्रद्धा हो सकता है, यहाँ भय और मानसिक विक्षोभ के नकारात्मक संदर्भ में ‘भयशीलता’ उपयुक्त है।
- source_word: ἐνόσουν
  choice: से ग्रस्त थे
  rationale: क्रिया रोगी होने या किसी व्याधि से पीड़ित होने का बोध देती है; ‘से ग्रस्त थे’ स्वाभाविक हिन्दी है और पहले आए रोग के रूपक को बनाए रखती है।
theological_decisions:
