  choice: भयशीलता
  alternative: सावधानी, श्रद्धा, या संकोच
  rationale: निकटवर्ती संदर्भ भय, व्याकुलता और रोग का है, जबकि καταγέλαστον इसे उपहासास्पद बताता है। इसलिए सकारात्मक धार्मिक अर्थ ‘श्रद्धा’ यहाँ असंगत होगा; फिर भी शब्द की अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित रखी गई है।
