theological_decisions:
- issue: वर्णित विनाश का स्वरूप और कर्ता
  choice: न्याय के अधीन जारी विनाश को व्यक्त किया गया है, पर विनाश करने वाले कर्ता को नहीं जोड़ा गया।
  alternative: इसे केवल मानसिक टूटन मानना, या परमेश्वर को स्पष्ट रूप से विनाश का कर्ता कहना।
  rationale: यूनानी मध्य/कर्मवाच्य रूप इस उपवाक्य में कर्ता को अनकहा छोड़ता है। व्यापक प्रसंग में ईश्वरीय न्याय निहित हो सकता है, किंतु पद स्वयं कर्ता का नाम नहीं लेता; इसलिए वही तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘थरथराते हुए’ भय का दृश्यात्मक पक्ष बनाए रखता है, और ‘नष्ट हुए जा रहे थे’ अपूर्ण क्रिया की जारी अवस्था को व्यक्त करता है। अंतिम खंड को हिन्दी में स्वाभाविक बनाने के लिए थोड़ा खोला गया है, पर हवा से बच निकलने की असंभवता और मूल की विचित्र तीव्रता सुरक्षित है।
