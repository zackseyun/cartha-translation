lexical_decisions:
- source_word: διώλλυντο
  choice: नष्ट हुए जा रहे थे
  rationale: अपूर्ण भूतकाल का मध्य/कर्मवाच्य रूप जारी विनाश या मिटते जाने की अवस्था बताता है। इस अनुवाद में प्रक्रिया की निरंतरता और कर्ता का अनकहा रहना दोनों सुरक्षित हैं।
