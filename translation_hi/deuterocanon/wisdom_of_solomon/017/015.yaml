  alternative: भीतर से टूटकर निष्क्रिय हो रहे थे; अथवा उनकी आत्मा ने मानो उनका साथ छोड़ दिया था
  rationale: मूल पाठ यह निश्चित नहीं करता कि आत्मा उन्हें धोखा देती है, भय के आगे समर्पण करती है, या उनका अंतर्मन भीतर से ढह जाता है। मुख्य पाठ रूपक को जस का तस रखता है और पादटिप्पणी संभावित भाव समझाती है।
