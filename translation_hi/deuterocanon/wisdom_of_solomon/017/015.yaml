  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: hi
  text: कुछ लोग भयावह आभासों[a] से खदेड़े जा रहे थे, और कुछ अपनी ही आत्मा के विश्वासघात से अशक्त हो रहे थे[b]; क्योंकि उन पर अचानक और अप्रत्याशित भय आ पड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रेत-जैसी आकृतियाँ” अथवा “दृश्य।” यूनानी शब्द डरावनी दिखाई देने वाली उपस्थितियों या आकृतियों को सूचित करता है; वे संभवतः अलौकिक या भ्रामक थीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आत्मा के विश्वासघात से अशक्त हो रहे थे।” इसका भाव भीतर से ऐसा टूट जाना हो सकता है, मानो उनका अपना अंतर्मन ही उनके विरुद्ध हो गया हो।
    reason: alternative_reading
