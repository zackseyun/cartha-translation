base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: hi
  text: क्योंकि जब अधर्मियों[a] ने सोचा कि वे एक पवित्र राष्ट्र पर अत्याचार कर रहे हैं, तब वे अंधकार के बंदी, लंबी रात की बेड़ियों में जकड़े हुए, अपनी छतों के नीचे बंद किए गए, शाश्वत प्रबन्ध[b] से पलायन करने वालों के समान पड़े रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था-विहीन लोग।” यूनानी में यह पुल्लिंग बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “प्रबन्ध” के लिए यूनानी शब्द πρόνοια है, जिसका अर्थ “पूर्वचिंतन” भी हो सकता है; यहाँ संभवतः परमेश्वर की शाश्वत, सुव्यवस्थित देखभाल अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: यह मान बैठे थे
  rationale: यह पूर्ण हो चुकी, पर भ्रमपूर्ण और दुस्साहसी धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταδυναστεύειν
  choice: दबाए रख सकते हैं
  rationale: क्रिया कठोर प्रभुत्व और शक्ति के दुरुपयोग का बोध कराती है; यह चुनाव निरंतर उत्पीड़न का भाव बनाए रखता है।
- source_word: ἔθνος ἅγιον
  choice: एक पवित्र राष्ट्र
  rationale: यह यूनानी पद का निकट अनुवाद है और वाचा-संबंधी बाइबलीय प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἄνομοι
  choice: वे अधर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘अधर्मी’ व्यवस्था-विरोधी और नैतिक रूप से दोषी होने के व्यापक भाव को रखता है।
- source_word: δέσμιοι σκότους
  choice: अंधकार के बंदी
  rationale: यह अंधकार को कारावास की शक्ति के रूप में प्रस्तुत करने वाला ठोस रूपक सुरक्षित रखता है।
- source_word: μακρᾶς πεδῆται νυκτός
  choice: लंबी रात की बेड़ियों में जकड़े हुए
  rationale: πεδῆται में निहित बेड़ी और बंधन की सजीव छवि को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατακλεισθέντες ὀρόφοις
  choice: अपनी छतों के नीचे बंद
  rationale: ‘छतों’ की मूल ठोस छवि को ‘घरों में’ कहकर सामान्यीकृत नहीं किया गया है; हिन्दी में स्वाभाविकता के लिए स्वामित्व सूचक ‘अपनी’ जोड़ा गया है।
- source_word: φυγάδες
  choice: भागे हुओं की तरह
  rationale: यह उन लोगों की विडंबनापूर्ण छवि रखता है जो बंद पड़े होने पर भी सनातन देखरेख से भागने वाले बताए गए हैं। ‘की तरह’ हिन्दी में विधेय संज्ञा के इस रूपक को स्वाभाविक बनाता है।
- source_word: τῆς αἰωνίου προνοίας
  choice: सनातन देखरेख
  rationale: πρόνοια में पूर्वचिंतन के साथ संरक्षणकारी और सुव्यवस्थित देखभाल का भाव है। ‘देखरेख’ सामान्य पाठक के लिए स्पष्ट है और बिना अनावश्यक व्याख्यात्मक विस्तार के उस भाव को रखती है।
- source_word: ἔκειντο
  choice: पड़े रहे
  rationale: यह यूनानी क्रिया की स्थिर, निरंतर अवस्था और दृश्य की विवशता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πρόνοια का दैवी अर्थ
  choice: सनातन देखरेख
  alternative: सनातन पूर्वचिंतन; सनातन प्रबंध
  rationale: ज्ञान-साहित्य के प्रसंग में यह शब्द केवल पहले से सोचने की क्रिया नहीं, बल्कि टिकाऊ, सुव्यवस्थित देखभाल की ओर संकेत करता है। मुख्य पाठ में परमेश्वर का नाम जोड़कर निहित कर्ता को पूरी तरह स्पष्ट नहीं किया गया, ताकि यूनानी की संक्षिप्तता और कुछ अर्थगत खुलापन बना रहे।
- issue: ἄνομοι का संज्ञात्मक प्रयोग
  choice: वे अधर्मी
  alternative: अधर्मी पुरुष; व्यवस्था-विहीन लोग
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर हिन्दी में ‘अधर्मी’ इसी समूह को स्वाभाविक रूप से व्यक्त करता है। ‘पुरुष’ जोड़ने से मूल की अपेक्षा जैविक लिंग पर अनावश्यक बल पड़ता, जबकि ‘व्यवस्था-विहीन’ बहुत संकीर्ण या अस्वाभाविक लगता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। अंधकार, रात की बेड़ियों, छतों के नीचे बंद होने और भागे हुओं की मूल परस्पर जुड़ी छवियाँ सुरक्षित हैं। अर्धविराम उनके अभिमानी अनुमान और उसके विपरीत उनकी वास्तविक दशा के बीच निहित विरोध को स्पष्ट करता है।
