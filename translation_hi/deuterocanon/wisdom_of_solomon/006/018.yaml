  rationale: ‘नियम’ νόμος के विधिक-नैतिक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है; ‘आज्ञाओं’ की तुलना में यह मूल शब्द के अधिक निकट है।
- source_word: αὐτῆς
  choice: उसके
  rationale: यह स्त्रीलिंग सर्वनाम प्रसंग में मानवीकृत बुद्धि की ओर संकेत करता है। हिन्दी में ‘उसके’ स्वाभाविक है, यद्यपि उसका रूप स्वयं स्त्रीलिंग को चिह्नित नहीं करता।
- source_word: προσοχή
  choice: ध्यान देना
  rationale: यह सावधानी से मन लगाने और नियमों के प्रति सचेत रहने का भाव व्यक्त करता है।
- source_word: βεβαίωσις
  choice: पुष्टि
  rationale: मूल शब्द किसी बात को दृढ़ या सुनिश्चित करने का भाव रखता है। ‘पुष्टि’ इस अर्थ को रखती है और ‘गारंटी’ जैसी अतिशयोक्ति से बचती है।
- source_word: ἀφθαρσίας
  choice: अविनाशिता
  rationale: यह नाश, क्षय या भ्रष्ट होने से मुक्त अवस्था को व्यक्त करता है और ‘अमरता’ की अपेक्षा यूनानी शब्द की व्यापकता को अधिक सुरक्षित रखता है।
theological_decisions:
- issue: αὐτῆς में बुद्धि का मानवीकरण
  choice: ‘उसके’ द्वारा सर्वनाम को बनाए रखना, जिसका प्रसंगगत संकेत मानवीकृत बुद्धि की ओर है।
