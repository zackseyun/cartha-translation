  rationale: आस-पास का प्रसंग बुद्धि को स्त्री के रूप में मानवीकृत करता है और यूनानी स्त्रीलिंग सर्वनाम उसी साहित्यिक-धर्मवैचारिक विशेषता का समर्थन करता है।
- issue: ἀφθαρσία का अर्थ
  choice: मुख्य पाठ में ‘अविनाशिता’।
  alternative: ‘अमरता’ या ‘नाशरहितता’।
  rationale: यूनानी शब्द सीधे नाश या क्षय से मुक्त अवस्था बताता है। ‘अमरता’ प्रसंगानुकूल अर्थ हो सकता है, पर मुख्य पाठ में उसे रखने से अभिप्राय अनावश्यक रूप से संकीर्ण हो सकता है।
