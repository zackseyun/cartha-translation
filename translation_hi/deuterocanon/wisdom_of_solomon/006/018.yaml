- source_word: φροντίς
  choice: चिंता करना
  rationale: यह शब्द सजग परवाह या गंभीर सरोकार व्यक्त करता है। अमूर्त यूनानी संज्ञा को हिन्दी में स्वाभाविक क्रियात्मक पदबंध से व्यक्त किया गया है।
