base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: hi
  text: क्योंकि सबका स्वामी[b] किसी का पक्ष नहीं लेगा[a], न किसी की महानता से प्रभावित होगा; क्योंकि छोटे और बड़े, दोनों को उसी ने बनाया है, और वह सबकी समान रूप से देखभाल करता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘चेहरा नहीं देखेगा’; यह पक्षपात या तरफ़दारी न करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सबका अधिपति।’ यहाँ यूनानी शब्द देस्पोतेस है, क्यूरियोस नहीं।
    reason: lexical_alternative
  - marker: c
    text: या ‘वह सबके लिए समान रूप से प्रबंध करता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστελεῖται πρόσωπον
  choice: किसी का पक्ष नहीं लेगा
  rationale: चेहरे से जुड़ा यूनानी मुहावरा यहाँ किसी व्यक्ति के पद या पहचान के कारण पक्षपात करने का अर्थ देता है; शाब्दिक अनुवाद हिन्दी में भ्रामक होता।
- source_word: ὁ πάντων δεσπότης
  choice: सबका स्वामी
  rationale: δεσπότης अधिकार और स्वामित्व की प्रबल धारणा रखता है। ‘स्वामी’ आधुनिक हिन्दी में स्वाभाविक है और इसे κύριος के सामान्य अनुवाद ‘प्रभु’ से अलग रखता है।
- source_word: ἐντραπήσεται μέγεθος
  choice: न किसी की महानता से प्रभावित होगा
  rationale: संदर्भ में आशय ऊँचे पद, प्रतिष्ठा या बड़प्पन के सामने दबने अथवा उससे अपना निर्णय प्रभावित होने देने का है। यह अनुवाद उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μικρὸν καὶ μέγαν
  choice: छोटे और बड़े, दोनों
  rationale: यह युग्म निम्न और उच्च हैसियत वाले मनुष्यों को समेटता है। ‘छोटे और बड़े’ मूल रूपक और व्यापकता दोनों बनाए रखता है।
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: वह सबकी समान रूप से देखभाल करता है
  rationale: προνοέω में ध्यान रखने, देखभाल करने और प्रबंध करने का अर्थक्षेत्र है। चुना हुआ रूप सहज हिन्दी में समान दैवी चिंता और प्रबंध का भाव व्यक्त करता है।
theological_decisions:
- issue: δεσπότης को κύριος से अलग व्यक्त करना
  choice: स्वामी
  alternative: प्रभु; अधिपति
  rationale: ‘स्वामी’ यूनानी पद के अधिकार और स्वामित्व के बल को बनाए रखता है, पर इसे κύριος के सामान्य हिन्दी समतुल्य ‘प्रभु’ में नहीं मिला देता।
- issue: दैवी निष्पक्षता
  choice: किसी का पक्ष नहीं लेगा
  alternative: किसी का मुँह नहीं देखेगा; किसी के साथ पक्षपात नहीं करेगा
  rationale: यह यूनानी मुहावरे का नैतिक और न्यायिक आशय स्पष्ट करता है, बिना किसी बाद की सांप्रदायिक व्याख्या को आरोपित किए।
- issue: प्रोविडेन्स से संबंधित προνοεῖ का अर्थ
  choice: सबकी समान रूप से देखभाल करता है
  alternative: सबके लिए समान रूप से प्रबंध करता है
  rationale: यह पाठ में व्यक्त समान दैवी ध्यान को बनाए रखता है; ‘प्रबंध’ वाला अधिक तकनीकी अर्थ पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘छोटे और बड़े’ मूल सामाजिक रूपक को बनाए रखता है। पादटिप्पणी-चिह्न अपने संबंधित पदों के तुरंत बाद दिए गए हैं; इसलिए पाठ में उनका क्रम b, a, c है।
