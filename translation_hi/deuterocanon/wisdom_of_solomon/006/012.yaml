lexical_decisions:
- source_word: Λαμπρὰ
  choice: उज्ज्वल
  rationale: यह शब्द प्रज्ञा की चमक और दीप्ति को सहज, आधुनिक हिन्दी में व्यक्त करता है, बिना अर्थ को अनावश्यक रूप से धार्मिक महिमा की ओर बढ़ाए।
