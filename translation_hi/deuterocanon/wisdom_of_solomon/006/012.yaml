- source_word: εὐχερῶς
  choice: सहज ही
  rationale: यह बिना कठिनाई और तत्परता से दिखाई देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεωρεῖται
  choice: दिखाई देती है
  rationale: इससे उज्ज्वलता से जुड़ा दृश्य बिंब बना रहता है, जबकि प्रसंग में पहचानने या ग्रहण करने का व्यापक भाव भी संभव रहता है।
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: जो उससे प्रेम करते हैं, उन्हें
  rationale: यह वर्तमान कृदंत और स्त्रीलिंग सर्वनाम को स्वाभाविक हिन्दी वाक्य-विन्यास में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: σοφία का व्यक्तिरूप
  choice: ‘प्रज्ञा’ को स्त्रीलिंग व्यक्तिरूप में प्रस्तुत किया गया है और उसके लिए ‘उससे’ तथा ‘वह’ का प्रयोग हुआ है।
  alternative: इसे केवल एक अमूर्त गुण मानकर व्यक्तिरूप को हटा देना।
  rationale: यूनानी पाठ में स्त्रीलिंग रूप हैं और निकटवर्ती प्रसंग प्रज्ञा को स्त्री-व्यक्ति के रूप में चित्रित करता है। हिन्दी की स्वाभाविक स्त्रीलिंग व्याकरण इस साहित्यिक-धर्मवैचारिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
