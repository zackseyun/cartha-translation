- source_word: δυνατοὶ
  choice: शक्तिशालियों
  rationale: शासकों के संदर्भ में यह शब्द अधिकार और सामर्थ्य रखने वालों को दर्शाता है।
- source_word: δυνατῶς
  choice: कड़ी
  rationale: सजातीय क्रियाविशेषण जाँच की प्रबलता या कठोरता बताता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘कड़ी’ चुना गया है; यूनानी शब्दालंकार को पादटिप्पणी में बताया गया है।
- source_word: ἐτασθήσονται
  choice: जाँच की जाएगी
  rationale: भविष्यकालीन कर्मवाच्य रूप गहन छानबीन या परीक्षण का बोध कराता है। ‘जाँच’ न्यायिक मूल्यांकन को स्पष्ट रखती है, पर उसके परिणाम को पहले से निर्धारित नहीं करती।
