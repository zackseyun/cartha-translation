- source_word: συγγνωστός
  choice: क्षमा किया जा सकता है
  rationale: यह विशेषण क्षमा या रियायत पाने योग्य होने का भाव देता है। हिन्दी में यह निष्क्रिय संभावनार्थक रूप न्यायिक संदर्भ और सहनशील व्यवहार—दोनों को व्यक्त करता है।
- source_word: ἐλέους
