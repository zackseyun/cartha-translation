  text: इसलिए, हे अत्याचारी शासको[a], मैं तुमसे ये बातें कहता हूँ, ताकि तुम बुद्धि सीखो और चूक न जाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे शासको।’ यूनानी शब्द संप्रभु शासकों को सामान्य रूप से भी सूचित कर सकता है, यद्यपि यहाँ उसका भाव तीखा और नकारात्मक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गिर न पड़ो’ अथवा ‘भटक न जाओ।’ यूनानी क्रिया का अर्थ व्यापक रूप से विफल होना या गलत मार्ग पर जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: तुमसे हैं
  rationale: οἱ λόγοι μου के साथ यह वाक्यांश उन लोगों को सूचित करता है जिन्हें ये बातें संबोधित हैं। ‘मेरी बातें तुमसे हैं’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के दिशात्मक भाव को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पद पिछली चेतावनी से निष्कर्ष निकालते हुए शासकों को संबोधित करता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: ὦ τύραννοι
  choice: हे अत्याचारी शासको
  rationale: τύραννοι संप्रभु शासकों को सूचित कर सकता है, पर इस चेतावनीपूर्ण संदर्भ में इसमें कठोर और नकारात्मक बल है। ‘अत्याचारी शासक’ उस बल को व्यक्त करता है और केवल ‘शासक’ की अपेक्षा अधिक सटीक है।
- source_word: οἱ λόγοι μου
  choice: मेरी बातें
  rationale: यह λόγοι के बहुवचन और वक्ता के स्वामित्व—दोनों को सहज, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἵνα μάθητε
  choice: ताकि तुम ... सीखो
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक क्रिया उद्देश्य व्यक्त करती है; ‘ताकि’ हिन्दी में उस प्रयोजन को स्वाभाविक रूप से सामने लाता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: सुलैमान की बुद्धि पुस्तक में σοφία केंद्रीय नैतिक और धर्मवैचारिक शब्द है; ‘बुद्धि’ इसका स्थापित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: μὴ παραπέσητε
  choice: चूक न जाओ
  rationale: παραπίπτω गिरने, विफल होने या गलत मार्ग पर जाने का व्यापक भाव रख सकता है। ‘चूक न जाओ’ नैतिक विफलता की चेतावनी देता है, पर इसे अनिवार्यतः धर्मत्याग के विशिष्ट अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: राजनीतिक अधिकारियों के लिए τύραννοι के संबोधन का बल
  choice: ‘अत्याचारी शासको’
  alternative: ‘शासको’ या ‘निरंकुश शासको’
  rationale: यूनानी शब्द सामान्यतः संप्रभु शासकों के लिए आ सकता है, किंतु निकटवर्ती चेतावनी के संदर्भ में उसका नकारात्मक और तीखा बल है। चुना हुआ रूप उसी मूल्यांकन को बचाता है, बिना पाठ से आगे कोई राजनीतिक या सांप्रदायिक दावा जोड़े।
- issue: παραπέσητε में निहित नैतिक विफलता का स्वरूप
  choice: ‘चूक न जाओ’
  alternative: ‘गिर न पड़ो’, ‘भटक न जाओ’ या ‘पतन न हो’
  rationale: यूनानी क्रिया का अर्थ व्यापक है और यह पद स्पष्ट रूप से धर्मत्याग जैसी किसी एक विशिष्ट विफलता को निर्धारित नहीं करता। इसलिए हिन्दी में ऐसा रूप चुना गया है जो नैतिक चेतावनी को रखता है और मूल की अर्थगत गुंजाइश को अनावश्यक रूप से संकीर्ण नहीं करता।
