  register: आधुनिक मानक हिन्दी में सीधा, चेतावनीपूर्ण और गरिमापूर्ण संबोधन रखा गया है। ‘तुम’ बहुवचन संबोधित शासकों के लिए प्रयुक्त है; इससे मूल का सीधापन बना रहता है। ‘अत्याचारी शासको’ नकारात्मक बल को स्पष्ट करता है, जबकि पादटिप्पणी अधिक सामान्य अर्थ की संभावना सुरक्षित रखती है।
