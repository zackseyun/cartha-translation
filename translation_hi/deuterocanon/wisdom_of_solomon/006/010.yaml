  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: hi
  text: क्योंकि जिन्होंने पवित्र बातों का पवित्रता से पालन किया है, वे पवित्र किए जाएँगे; और जिन्हें उन पवित्र बातों की शिक्षा दी गई है, वे बचाव का आधार[a] पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बचाव का आधार पाएँगे’ का अनुवाद ‘उत्तर पाएँगे’ या ‘अपनी सफ़ाई का आधार पाएँगे’ भी हो सकता है। यूनानी शब्द जाँच या आरोप के उत्तर में दिए जाने वाले बचाव को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: पालन किया है
  rationale: यह कृदन्त सावधानी से मानने, सँभालने या पालन करने का भाव देता है। यहाँ पवित्र बातों के नैतिक-धार्मिक पालन के लिए ‘पालन किया है’ स्वाभाविक है।
- source_word: ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: पवित्रता से / पवित्र बातों / पवित्र किए जाएँगे
  rationale: यूनानी में एक ही शब्द-परिवार की जानबूझकर की गई पुनरावृत्ति है। हिन्दी में ‘पवित्र’ शब्द-परिवार को तीनों स्थानों पर रखकर इस अलंकार और तर्क-संबंध को यथासंभव सुरक्षित रखा गया है।
- source_word: διδαχθέντες αὐτά
  choice: जिन्हें उनकी शिक्षा दी गई है
  rationale: मूल में कर्मवाच्य है और αὐτά पहले कही गई पवित्र बातों की ओर संकेत करता है; यह अनुवाद दोनों विशेषताओं को बनाए रखता है।
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: अपने बचाव का आधार पाएँगे
  rationale: ἀπολογία जाँच या आरोप के उत्तर में दिए जाने वाले बचाव को सूचित कर सकता है। ‘बचाव का आधार पाएँगे’ हिन्दी में स्वाभाविक रहते हुए न्यायिक अर्थ बनाए रखता है और धर्मशास्त्रीय ‘धर्मी ठहराए जाने’ का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: पवित्रता-संबंधी सजातीय शब्दों का प्रयोग
  choice: ‘पवित्र बातों का पवित्रता से पालन ... पवित्र किए जाएँगे’
  alternative: ‘श्रद्धापूर्वक पवित्र विधियों का पालन ... शुद्ध ठहराए जाएँगे’
  rationale: मूल यूनानी की सघन शब्द-पुनरावृत्ति पद के नैतिक-धार्मिक तर्क का अंग है; इसलिए अधिक मुहावरेदार विकल्प के बजाय उसे प्रत्यक्ष रखा गया है।
- issue: ἀπολογία का अर्थ
  choice: बचाव का आधार
  alternative: उत्तर; सफ़ाई; निर्दोष ठहराव
  rationale: यह शब्द प्रतिवाद या बचाव को व्यक्त करता है। चुना गया रूप संभावित न्यायिक संदर्भ को बनाए रखता है, पर अंतिम दोषमुक्ति या किसी विशिष्ट धर्मसैद्धांतिक ‘धर्मी ठहराव’ को पूर्वनिर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र बातों का पवित्रता से’ सामान्य हिन्दी में कुछ पुनरुक्तिपूर्ण लगता है, पर मूल यूनानी के जानबूझकर किए गए सजातीय शब्द-प्रयोग को सुरक्षित रखने के लिए इसे रखा गया है।
