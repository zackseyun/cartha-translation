lexical_decisions:
- source_word: κράτησις
  choice: शासन का अधिकार
  rationale: शासकों को किए गए संबोधन में यह शासन-सत्ता को धारण और प्रयोग करने का भाव देता है; यह पद आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δυναστεία
  choice: प्रभुता
