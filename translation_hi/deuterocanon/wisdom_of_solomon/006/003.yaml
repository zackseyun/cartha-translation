  text: क्योंकि प्रभु ने तुम्हें शासन का अधिकार दिया है, और परमप्रधान ने तुम्हें शासन-सत्ता दी है; वही तुम्हारे कार्यों की जाँच करेगा और तुम्हारी योजनाओं की गहराई से पड़ताल करेगा।
