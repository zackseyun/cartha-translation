  rationale: संयुक्त क्रिया गहराई से खोजने या जाँचने का प्रबल भाव देती है; यह अनुवाद पहले क्रियापद से तीव्रता में भेद बनाए रखता है।
- source_word: βουλάς
  choice: विचार-विमर्शों
  rationale: यह केवल अंतिम योजनाओं को नहीं, शासकों के भीतर के परामर्श, मंशा और निर्णय-निर्माण को भी समेट सकता है; ‘विचार-विमर्श’ उस व्यापकता को सुरक्षित रखता है।
