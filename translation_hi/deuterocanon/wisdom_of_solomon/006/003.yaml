- source_word: παρὰ τοῦ κυρίου / παρὰ Ὑψίστου
  choice: प्रभु ने ... परमप्रधान ने
  rationale: παρά सम्बन्धित सत्ता के दैवी स्रोत को दर्शाता है। हिन्दी का कर्तृवाच्य प्रयोग अर्थ को स्पष्ट और सहज रखता है।
- source_word: ἐξετάσει
  choice: जाँच करेगा
  rationale: यह भावी, सावधानीपूर्ण परीक्षण को व्यक्त करता है और न्याय-संदर्भ में सहज हिन्दी है।
- source_word: διεραυνήσει
