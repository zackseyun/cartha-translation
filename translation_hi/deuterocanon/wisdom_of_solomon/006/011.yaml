- source_word: παιδευθήσεσθε
  choice: तुम्हें शिक्षा दी जाएगी
  rationale: भविष्यत् कर्मवाच्य रूप को सुरक्षित रखा गया है। प्रसंग में ज्ञान के वचनों को ग्रहण करना प्रमुख है, इसलिए ‘शिक्षा’ अग्रभूमि में है, जबकि अनुशासन और प्रशिक्षण की व्यापक अर्थच्छाया पादटिप्पणी में रखी गई है।
