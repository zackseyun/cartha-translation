- from: क्योंकि वह अपने योग्य लोगों को ढूँढ़ती हुई उनके चारों ओर फिरती है, मार्गों पर उन पर कृपापूर्वक प्रकट होती है, और उनकी हर सोच[a] में उनसे आ मिलती है।
