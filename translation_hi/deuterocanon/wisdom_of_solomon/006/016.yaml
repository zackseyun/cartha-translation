base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: hi
  text: क्योंकि वह उन लोगों को ढूँढ़ती फिरती है जो उसके योग्य हैं, मार्गों पर उन्हें कृपापूर्वक दिखाई देती है, और उनके हर विचार[a] में उनसे आ मिलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके हर अभिप्राय में” अथवा “उनकी हर योजना में।” यूनानी शब्द सामान्य विचार के साथ-साथ निश्चित उद्देश्य या योजना को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: अपने योग्य लोगों
  rationale: यह पदबंध संबंधसूचक भाव और योग्यता का मूल्यांकन दोनों बनाए रखता है, बिना इसे अर्जित पात्रता के किसी संकीर्ण सिद्धांत में बदलने के।
- source_word: περιέρχεται ζητοῦσα
  choice: ढूँढ़ती हुई उनके चारों ओर फिरती है
  rationale: इससे περιέρχεται की गतिशीलता और ζητοῦσα की निरंतर, उद्देश्यपूर्ण खोज दोनों व्यक्त होती हैं।
- source_word: ἐν ταῖς τρίβοις
  choice: मार्गों पर
  rationale: τρίβος के ठोस पथ या मार्ग के बिंब को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: उन पर कृपापूर्वक प्रकट होती है
  rationale: φαντάζεται का दिखाई देने या प्रकट होने का भाव तथा εὐμενῶς का अनुकूल, कृपालु भाव दोनों बने रहते हैं।
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: उनकी हर सोच में
  rationale: ἐπίνοια विचार, अभिप्राय या योजना को सूचित कर सकता है। ‘सोच’ इसकी व्यापकता बनाए रखती है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ὑπαντᾷ αὐτοῖς
  choice: उनसे आ मिलती है
  rationale: ‘आ मिलती है’ साधारण भेंट के साथ आगे बढ़कर मिलने की पहल को भी व्यक्त करता है।
theological_decisions:
- issue: बुद्धि का सक्रिय स्त्री-पात्र के रूप में मानवीकरण
  choice: पूरे पद में स्त्रीलिंग व्यक्तिगत भाषा ‘वह’ और स्त्रीलिंग क्रियाएँ रखी गई हैं।
  alternative: ‘बुद्धि’ को निर्जीव अमूर्त वस्तु की तरह प्रस्तुत करना।
  rationale: यूनानी पाठ स्त्रीलिंग रूपों और व्यक्तिगत क्रियाओं द्वारा बुद्धि का सजीव मानवीकरण करता है; इसे बनाए रखना पाठ के साहित्यिक और धर्मवैचारिक तनाव का सम्मान करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘चारों ओर फिरती है’ मूल की गतिशील खोज को स्पष्ट करता है, जबकि ‘आ मिलती है’ बुद्धि की पहल को बनाए रखता है।
