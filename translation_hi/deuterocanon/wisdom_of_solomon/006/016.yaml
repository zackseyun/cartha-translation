review_pass:
  verdict: revise
  source_fidelity: Draft misconstrues περιέρχεται as moving 'around them' (उनके चारों ओर), whereas the Greek means that Wisdom goes about while seeking the worthy. It also renders the dative αὐτοῖς as 'उन पर' after 'appears,' where 'उन्हें' is required. The revised wording preserves Wisdom's feminine personification, her active initiative, the path imagery, and the breadth of ἐπίνοια.
  naturalness: 'The revision is idiomatic modern standard Hindi: ''उन लोगों को ढूँढ़ती फिरती है जो उसके योग्य हैं'' avoids the spatially misleading ''उनके चारों ओर फिरती है,'' and ''उन्हें ... दिखाई देती है'' is natural with ''प्रकट/appear.'''
  terminology: ‘योग्य,’ ‘मार्गों,’ ‘कृपापूर्वक,’ and ‘विचार’ are suitably dignified and clear. ‘विचार’ preserves the broad sense of ἐπίνοια; the footnote supplies ‘अभिप्राय’ and ‘योजना’ as narrower alternatives.
  issues:
  - severity: high
    issue: ‘उनके चारों ओर फिरती है’ translates περιέρχεται as circling the people.
    rationale: The construction περιέρχεται ζητοῦσα means ‘goes about seeking’ them, not ‘goes around them.’ This changes the action and imagery.
  - severity: medium
    issue: ‘मार्गों पर उन पर ... प्रकट होती है’ uses ‘उन पर’ for αὐτοῖς.
    rationale: With φαντάζεται (‘appears/becomes visible’), the Greek dative refers to the persons to whom she appears. Hindi ‘उन्हें ... दिखाई देती है’ conveys this correctly and naturally.
  revised_text: क्योंकि वह उन लोगों को ढूँढ़ती फिरती है जो उसके योग्य हैं, मार्गों पर उन्हें कृपापूर्वक दिखाई देती है, और उनके हर विचार[a] में उनसे आ मिलती है।
  revised_footnotes:
