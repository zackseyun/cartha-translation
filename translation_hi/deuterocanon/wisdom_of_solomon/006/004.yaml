    text: या “अधीनस्थ अधिकारी”; यूनानी शब्द का अर्थ किसी उच्च अधिकारी के अधीन सेवा करने वाला व्यक्ति है। यहाँ शासक परमेश्वर के शासन के अधीन पदाधिकारी हैं।
    reason: lexical_alternative
  - marker: b
