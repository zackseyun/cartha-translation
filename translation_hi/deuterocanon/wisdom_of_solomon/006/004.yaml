lexical_decisions:
- source_word: ὑπηρέται
  choice: सेवक
  rationale: यह शब्द किसी उच्च अधिकारी के अधीन सेवा करने वाले व्यक्ति या पदाधिकारी को सूचित करता है। संदर्भ में राजा और शासक परमेश्वर के राज्य के अधीन सेवक हैं; ‘सेवक’ अधीनता और सेवा, दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βασιλείας
  choice: राज्य
  rationale: βασιλεία राजकीय शासन या उसके क्षेत्र, दोनों का बोध करा सकता है। ‘राज्य’ सामान्य हिन्दी में सहज है और परमेश्वर के सार्वभौम शासन के अधीन इन शासकों की भूमिका को खुला रखता है।
- source_word: ἐκρίνατε ὀρθῶς
  choice: ठीक रीति से न्याय करते थे
  rationale: ὀρθῶς का अर्थ ठीक, उचित या सीधे ढंग से है। यह अनुवाद न्यायिक संदर्भ को स्पष्ट रखते हुए केवल निष्पक्षता तक अर्थ को सीमित नहीं करता।
- source_word: ἐφυλάξατε νόμον
  choice: व्यवस्था का पालन करते थे
  rationale: φυλάσσω νόμον का स्वाभाविक अर्थ व्यवस्था को मानना या उसका पालन करना है। ‘व्यवस्था’ νόμος के विधिक और नैतिक दोनों आयामों को व्यक्त करती है।
- source_word: βουλή
  choice: योजना
  rationale: βουλή विचारपूर्वक ठहराई गई योजना, उद्देश्य या सम्मति का अर्थ दे सकता है। ‘योजना’ यहाँ परमेश्वर के सुविचारित अभिप्राय को सहज आधुनिक हिन्दी में व्यक्त करती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐπορεύθητε
  choice: चलते थे
  rationale: यहाँ क्रिया नैतिक आचरण के रूपक के रूप में प्रयुक्त है। ‘के अनुसार चलते थे’ हिन्दी की स्वाभाविक अभिव्यक्ति है और मूल रूपक को बनाए रखती है।
theological_decisions:
- issue: परमेश्वर की प्रभुता के अधीन सांसारिक शासकों की भूमिका
  choice: शासकों को परमेश्वर के राज्य के अधीन सेवकों के रूप में प्रस्तुत किया गया है।
  alternative: इसे व्यापक रूप से परमेश्वर के अधीन अधिकार रखने वाले सभी लोगों पर लागू समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग राजाओं और न्यायाधीशों को संबोधित करता है, और ὑπηρέται τῆς αὐτοῦ βασιλείας उनके अधिकार को परमेश्वर के शासन से प्राप्त तथा उसके अधीन दिखाता है। अनुवाद इससे आगे कोई विशिष्ट धर्म-राज्य सिद्धान्त नहीं जोड़ता।
