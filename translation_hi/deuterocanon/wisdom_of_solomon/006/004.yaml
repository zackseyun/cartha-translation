  text: क्योंकि उसके राज्य के सेवक[a] होते हुए भी तुमने न तो ठीक रीति से न्याय किया[b], न व्यवस्था का पालन किया, और न परमेश्वर की योजना[c] के अनुसार चले।
  philosophy: optimal-equivalence
  footnotes:
