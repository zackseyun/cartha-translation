base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: hi
  text: परन्तु बुद्धि क्या है और वह कैसे अस्तित्व में आई[a], यह मैं बताऊँगा; मैं तुमसे रहस्यों को नहीं छिपाऊँगा। बल्कि, उसकी उत्पत्ति के आरम्भ से मैं उसका पता लगाऊँगा, उसका ज्ञान प्रकट करूँगा, और सत्य की तनिक भी उपेक्षा नहीं करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कैसे उत्पन्न हुई।” यूनानी क्रिया का अर्थ अस्तित्व में आना, उत्पन्न होना या उदित होना हो सकता है; यहाँ इससे बुद्धि के सृजित अथवा सनातन होने का प्रश्न अपने आप तय नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  choice: परन्तु बुद्धि क्या है
  rationale: सीधे प्रश्नवाचक उपवाक्य को बनाए रखता है; σοφία के लिए स्वाभाविक और स्थापित हिन्दी शब्द ‘बुद्धि’ चुना गया है।
- source_word: πῶς ἐγένετο
  choice: वह कैसे अस्तित्व में आई
  rationale: γίνομαι के ‘होने में आना/उत्पन्न होना’ भाव को स्पष्ट करता है, पर ‘रची गई’ कहकर सृष्ट होने का कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: ἀπαγγελῶ
  choice: यह मैं बताऊँगा
  rationale: घोषित करने या निवेदन करने का भाव सरल, गरिमापूर्ण और आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: मैं तुमसे रहस्य नहीं छिपाऊँगा
  rationale: μυστήρια की गंभीरता ‘रहस्य’ से बनी रहती है और ἀποκρύπτω का सीधा अर्थ ‘छिपाना’ सुरक्षित रहता है।
- source_word: ἀλλὰ ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: बल्कि उसके उद्भव के आरम्भ से ही उसका पता लगाऊँगा
  rationale: जनन/उद्भव की सघन यूनानी अभिव्यक्ति और ἐξιχνιάζω के पदचिह्नों के सहारे खोज निकालने जैसे अनुसंधानात्मक भाव को सहज हिन्दी में रखता है।
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: उसके विषय का ज्ञान सबके सामने रखूँगा
  rationale: ‘प्रकट क्षेत्र में रखने’ की ठोस छवि को स्वाभाविक हिन्दी ‘सबके सामने रखना’ से व्यक्त करता है और αὐτῆς को बुद्धि से संबद्ध रखता है।
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: सत्य की तनिक भी उपेक्षा नहीं करूँगा
  rationale: οὐ μή की प्रबल निषेधात्मकता ‘तनिक भी नहीं’ से आती है; παροδεύω का सत्य के पास से निकल जाने या उसे अनदेखा करने का भाव ‘उपेक्षा’ में स्पष्ट होता है।
theological_decisions:
- issue: πῶς ἐγένετο और γενέσεως में बुद्धि के उद्गम का संभावित तत्त्वमीमांसात्मक अर्थ
  choice: ‘कैसे अस्तित्व में आई’ और ‘उसके उद्भव के आरम्भ से’
  alternative: ‘कैसे रची गई’ अथवा ‘कैसे उत्पन्न हुई’
  rationale: मूल पाठ बुद्धि के अस्तित्व में आने अथवा उद्भव की बात करता है, लेकिन यह पद अकेला यह निर्धारित नहीं करता कि व्यक्तिरूप बुद्धि सृजित है या सनातन। चुना गया अनुवाद इस तनाव को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथन। ‘तुमसे’ बहुवचन श्रोताओं के लिए प्रयुक्त है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि मूल की क्रमिक प्रतिज्ञाएँ सुरक्षित रखी गई हैं।
