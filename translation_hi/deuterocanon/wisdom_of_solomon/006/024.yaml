  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/024.yaml
  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: hi
  text: बुद्धिमानों की बड़ी संख्या संसार का उद्धार[a] है, और विवेकी राजा प्रजा[b] की स्थिरता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुक्ति’ अथवा ‘रक्षा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘जनता’ अथवा ‘नागरिक समुदाय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  choice: बड़ी संख्या
  rationale: यह शब्द बहुतायत या बड़ी संख्या को दर्शाता है। ‘बड़ी संख्या’ आधुनिक हिन्दी में स्वाभाविक है और मूल के सामूहिक भाव को बनाए रखता है।
- source_word: σοφῶν
  choice: बुद्धिमानों की
  rationale: सम्बन्धकारक बहुवचन सामान्य रूप से बुद्धिमान व्यक्तियों की ओर संकेत करता है। यह चयन संक्षिप्त और सूक्तिपरक है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: σωτηρία में उद्धार, मुक्ति और रक्षा के अर्थ समाए हो सकते हैं। ‘उद्धार’ मूल शब्द की गंभीरता बनाए रखता है और उसे केवल नागरिक कल्याण तक सीमित नहीं करता।
- source_word: κόσμου
  choice: संसार का
  rationale: κόσμος यहाँ व्यापक मानवीय अथवा विश्वव्यापी अर्थ में है; ‘संसार’ इस व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: मूल शब्द विशेष रूप से राजा को दर्शाता है, केवल किसी सामान्य शासक को नहीं।
- source_word: φρόνιμος
  choice: विवेकी
  rationale: यह व्यावहारिक बुद्धि, उचित निर्णय और सूझ-बूझ का बोध देता है। ‘विवेकी’ पहले खंड के ‘बुद्धिमानों’ से इसका सूक्ष्म भेद भी बनाए रखता है।
- source_word: εὐσταθία
  choice: स्थिरता
  rationale: राजनीतिक-सामुदायिक संदर्भ में यह दृढ़ता, सुव्यवस्था और टिकाऊ स्थिरता को व्यक्त करता है।
- source_word: δήμου
  choice: प्रजा
  rationale: राजा के संदर्भ में ‘प्रजा’ स्वाभाविक है और लोगों के संगठित समुदाय को दर्शाता है; फिर भी यूनानी शब्द का अर्थ जनता या नागरिक समुदाय भी हो सकता है।
theological_decisions:
- issue: बुद्धि-राजनीतिक संदर्भ में σωτηρία का दायरा
  choice: ‘उद्धार’ रखा गया है, ताकि शब्द का प्रबल और व्यापक बचावकारी अर्थ बना रहे।
  alternative: ‘मुक्ति’ या ‘रक्षा’
  rationale: पद का संदर्भ सामुदायिक और राजनीतिक है, पर मूल शब्द को केवल सांसारिक कल्याण या सुव्यवस्था तक सीमित करना उसके अर्थभार को घटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूक्तिपरक रखी गई है। ‘बड़ी संख्या’ सहज हिन्दी देता है, जबकि ‘उद्धार’ मूल के अर्थभार और ‘विवेकी’ व्यावहारिक बुद्धि की छाया को बनाए रखते हैं।
