  rationale: κραταιός यहाँ अधिकार और शक्ति रखने वाले लोगों को दर्शाता है; ‘सामर्थी’ मूल की व्यापकता बनाए रखता है, जबकि δέ का विरोधसूचक भाव ‘परन्तु’ से व्यक्त होता है।
- source_word: ἰσχυρὰ
  choice: कठोर
