- source_word: ἔραυνα
  choice: जाँच
  rationale: ἔρευνα/ἔραυνα का आशय छानबीन या परीक्षण है; ‘जाँच’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
