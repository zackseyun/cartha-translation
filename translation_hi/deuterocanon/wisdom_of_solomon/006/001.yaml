lexical_decisions:
- source_word: Ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक अनुवाद; संदर्भ में इसका भाव ध्यानपूर्वक सुनने का है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष या आग्रह को स्पष्ट रूप से जोड़ता है।
- source_word: βασιλεῖς
  choice: राजाओ
  rationale: मूल संज्ञा विशेष रूप से राजाओं को संबोधित करती है; सामान्य अर्थ वाले ‘शासको’ की अपेक्षा यह अधिक सटीक है।
- source_word: σύνετε
  choice: समझो
  rationale: आज्ञार्थक रूप का सीधा अर्थ सुरक्षित रहता है और ‘सुनो’ के साथ स्वाभाविक युग्म बनता है।
- source_word: μάθετε
  choice: सीखो
  rationale: मूल क्रिया का सरल, सीधा अर्थ; ‘शिक्षा ग्रहण करो’ की तुलना में कम व्याख्यात्मक है।
- source_word: δικασταί
  choice: न्यायियो
  rationale: यह उन लोगों को दर्शाता है जो न्याय करते हैं; ‘शासको’ कहने से न्यायिक अर्थ मंद पड़ जाता।
- source_word: περάτων γῆς
  choice: पृथ्वी के छोरों के
  rationale: मूल के चित्रात्मक वाक्यांश को बनाए रखता है, जबकि पादटिप्पणी उसके विश्वव्यापी आशय को स्पष्ट करती है।
