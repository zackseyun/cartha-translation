    text: “पृथ्वी के छोरों के न्यायाधीशो” संसार के दूर-दूर के क्षेत्रों में न्याय करने वालों को संबोधित करने का चित्रात्मक ढंग है; इससे चेतावनी के विश्वव्यापी दायरे पर बल पड़ता है।
