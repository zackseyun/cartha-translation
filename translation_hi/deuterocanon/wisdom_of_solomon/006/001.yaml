review_pass:
  verdict: revise
  source_fidelity: The three imperatives and the inferential force of οὖν are retained, as are the direct addresses to kings and to those who judge at the earth’s extremities. However, न्यायी primarily denotes a just/righteous person in modern Hindi and does not reliably convey δικασταί, ‘judges.’
  naturalness: The sentence is concise, dignified, and natural overall. Replacing न्यायियो with न्यायाधीशो makes the second address clear and idiomatic in modern standard Hindi.
  terminology: राजाओ appropriately retains the specific address βασιλεῖς (‘kings’). न्यायाधीशो accurately retains the judicial sense of δικασταί without broadening it to rulers. पृथ्वी के छोरों preserves the source’s biblical-extremities imagery.
  issues:
  - severity: medium
    issue: ‘न्यायियो’ is lexically ambiguous and can be understood as ‘righteous/just persons,’ rather than judicial officials.
    rationale: δικασταί specifically identifies judges. ‘न्यायाधीशो’ is the standard clear Hindi term for judges and preserves the source’s judicial nuance.
  revised_text: इसलिए, हे राजाओ, सुनो और समझो; पृथ्वी के छोरों के न्यायाधीशो, सीखो।
  revised_footnotes:
