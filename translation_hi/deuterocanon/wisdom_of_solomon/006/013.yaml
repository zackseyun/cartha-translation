lexical_decisions:
- source_word: φθάνει
  choice: पहले ही
  rationale: यह क्रिया किसी से पहले पहुँचने या पहल करने का भाव रखती है। यहाँ यह दिखाती है कि बुद्धि अपने चाहनेवालों की प्रतीक्षा भर नहीं करती, बल्कि स्वयं पहले उनके सामने आती है।
- source_word: τοὺς ἐπιθυμοῦντας
  choice: अपने चाहनेवालों
  rationale: ἐπιθυμέω प्रबल इच्छा या लालसा व्यक्त करता है। निकटवर्ती संदर्भ से इसका अभिप्रेत कर्म ‘बुद्धि’ है, इसलिए हिन्दी में ‘अपने चाहनेवालों’ स्वाभाविक और संक्षिप्त है।
- source_word: προγνωσθῆναι
  choice: प्रकट हो जाती है
  rationale: शाब्दिक रूप से यह ‘पहले से जानी जाए’ जैसा कर्मवाच्य रूप है। ‘प्रकट हो जाती है’ हिन्दी में उस भाव को स्वाभाविक रूप से व्यक्त करता है कि बुद्धि स्वयं पहल करके पहचानी जाती है; ‘पहले’ का तत्व φθάνει के अनुवाद में रखा गया है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: ‘वह’ और ‘अपने’ द्वारा स्त्री-व्यक्तित्व का भाव बनाए रखा गया है
  alternative: बुद्धि को निर्जीव गुण मानकर ‘यह’ कहना
  rationale: यूनानी संदर्भ में बुद्धि को स्त्री-व्यक्ति के रूप में प्रस्तुत किया गया है। हिन्दी में ‘वह’ स्वाभाविक रहते हुए इस साहित्यिक और धर्मवैचारिक मानवीकरण को सुरक्षित रखता है।
- issue: προγνωσθῆναι की संकुचित और संभावित रूप से अस्पष्ट अभिव्यक्ति
  choice: मुख्य पाठ में बुद्धि की पहल का प्रसंगानुकूल अर्थ दिया गया है
  alternative: ‘जो पहले से जाने जाने की इच्छा रखते हैं, उनके पास वह पहले पहुँचती है’
  rationale: मूल यूनानी व्याकरणतः संकुचित है और अत्यधिक शाब्दिक हिन्दी अस्पष्ट हो सकती है। मुख्य पाठ संभावित प्रसंगानुकूल अर्थ देता है, जबकि पादटिप्पणी औपचारिक विकल्प और मूल की अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘चाहनेवालों’ सामान्य पाठकों के लिए स्वाभाविक है, और ‘पहले ही प्रकट हो जाती है’ मूल में निहित अग्रिम पहल को स्पष्ट करता है।
