translation:
  language: hi
  text: जो उसकी खोज में तड़के उठता है[a], वह थकेगा नहीं, क्योंकि वह उसे अपने फाटकों के पास बैठी हुई पाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके लिए भोर में उठता है।” यूनानी क्रिया का मूल अर्थ भोर में या बहुत सवेरे उठना है; इससे उत्सुकतापूर्वक तड़के खोजने का भाव भी निकल सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ बुद्धि को एक स्त्री के रूप में दिखाया गया है, जो खोजने वाले के फाटकों पर पहले से बैठी उसकी प्रतीक्षा कर रही है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας
  choice: जो ... भोर को उठता है
  rationale: ὀρθρίζω का मूल अर्थ भोर में या बहुत सवेरे उठना है। यह अनुवाद कहावत-सरीखे सामान्य कथन को बनाए रखता है और शीघ्र, उत्सुक खोज का निहित भाव भी रहने देता है।
- source_word: ἐπ' αὐτὴν
  choice: उसके लिए
  rationale: ἐπί और कर्मकारक यहाँ व्यक्तिरूप में प्रस्तुत बुद्धि की ओर उद्देश्य या अभिमुखता दर्शाते हैं। स्त्रीलिंग ‘उसके’ से यह व्यक्तिरूप सुरक्षित रहता है।
- source_word: οὐ κοπιάσει
  choice: वह थकेगा नहीं
  rationale: κοπιάω परिश्रम करने या परिश्रम से थकने का अर्थ दे सकता है। यहाँ खोज के श्रमसाध्य न होने पर बल है, इसलिए ‘थकेगा नहीं’ स्वाभाविक और अर्थ-संगत है।
- source_word: πάρεδρον
  choice: पास बैठी हुई
  rationale: πάρεδρος का अर्थ किसी के पास बैठा या उपस्थित होना है। ‘पास बैठी हुई’ बुद्धि को एक उपस्थित, प्रतीक्षारत स्त्री के रूप में दिखाने वाला ठोस चित्र बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पहले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: τῶν πυλῶν αὐτοῦ
  choice: अपने फाटकों के पास
  rationale: πύλη का सामान्य अर्थ फाटक है। बहुवचन और स्वत्व-संबंध को बनाए रखते हुए ‘अपने’ का कर्ता खोजने वाला व्यक्ति है; इससे हिन्दी में अनावश्यक पुरुषवाचक सर्वनाम के बिना मूल संबंध स्पष्ट रहता है।
theological_decisions:
- issue: बुद्धि का स्त्रीलिंग व्यक्तिरूप और खोजने वाले के लिए सामान्य पुल्लिंग
  choice: बुद्धि के लिए स्त्रीलिंग संकेत बनाए रखा गया और खोजने वाले को एकवचन सामान्य पुल्लिंग क्रिया से व्यक्त किया गया।
  alternative: खोजने वाले को लिंग-निरपेक्ष बहुवचन या ‘वह व्यक्ति’ जैसे विस्तार से व्यक्त करना।
  rationale: यूनानी पाठ बुद्धि को स्पष्ट रूप से स्त्रीलिंग व्यक्तिरूप देता है और खोजने वाले के लिए पुल्लिंग एकवचन रूप रखता है। हिन्दी में ‘उसके’ और ‘बैठी हुई’ बुद्धि का स्त्रीलिंग स्पष्ट करते हैं, जबकि ‘वह थकेगा नहीं’ मूल की व्याकरणिक आकृति को बनाए रखता है।
- issue: πάρεδρον में उपस्थिति या परिचारक होने का भाव
  choice: ‘पास बैठी हुई’ द्वारा दृश्यात्मक उपस्थिति को प्रधानता दी गई।
  alternative: ‘सहचरी के रूप में’ या ‘सेवा में उपस्थित’ कहना।
  rationale: शब्द में साथ बैठने अथवा परिचारक-सदृश उपस्थिति दोनों की संभावना है। प्रसंग में फाटकों पर पहले से उपस्थित व्यक्तिरूप बुद्धि का चित्र सबसे प्रत्यक्ष है; परिचारक की भूमिका जोड़ना अर्थ को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कहावत-सदृश रूप अपनाया गया है। ‘भोर को उठता है’ मूल बिंब को, ‘फाटक’ πύλη की ठोस छवि को, और स्त्रीलिंग क्रिया ‘बैठी हुई’ बुद्धि के व्यक्तिरूप को बनाए रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
