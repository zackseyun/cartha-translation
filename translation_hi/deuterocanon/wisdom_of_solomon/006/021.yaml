  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: hi
  text: इसलिए, हे लोगों के शासको[a], यदि तुम सिंहासनों और राजदंडों में आनंद लेते हो, तो बुद्धि का सम्मान करो, ताकि तुम सदा राज्य करो।
