  rationale: यह राजकीय शासन के आसन का सीधा और प्रचलित हिन्दी पर्याय है तथा पद के राजनीतिक बिंब को सुरक्षित रखता है।
- source_word: σκήπτροις
  choice: राजदंडों
  rationale: यह राजकीय अधिकार के प्रतीक को स्पष्ट करता है और ‘सिंहासनों’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: τύραννοι λαῶν
  choice: लोगों के शासको
  rationale: τύραννοι यहाँ सामान्यतः सत्ताधारी शासकों को सूचित कर सकता है, जबकि आधुनिक हिन्दी में ‘अत्याचारी’ कहना नकारात्मक अर्थ को अनावश्यक रूप से निश्चित कर देगा। λαῶν के बहुवचन को ‘लोगों’ से व्यक्त किया गया है।
- source_word: τιμήσατε
  choice: सम्मान करो
  rationale: आज्ञार्थक क्रिया बुद्धि को उचित आदर और प्रतिष्ठा देने का आह्वान करती है; ‘सम्मान करो’ इसकी शक्ति और ऊँची शैली दोनों बनाए रखता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यह पुस्तक में व्यावहारिक विवेक और व्यक्तिरूप में प्रस्तुत बुद्धि—दोनों संभावित आयामों को खुला रखने वाला मानक हिन्दी चयन है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह दीर्घस्थायी अथवा अनंत अवधि बताने वाले यूनानी मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: βασιλεύσητε
  choice: राज्य कर सको
  rationale: यह क्रिया विशेष रूप से राजा के समान शासन करने का अर्थ देती है। ‘कर सको’ ἵνα के बाद आए संभावनार्थक उद्देश्य को स्पष्ट करता है, बिना उसे स्वतंत्र आज्ञा बनाए।
theological_decisions:
- issue: τύραννοι का राजनीतिक और नैतिक आशय
  choice: मुख्य पाठ में तटस्थ ‘शासको’
  alternative: ‘अत्याचारी शासको’ या ‘निरंकुश शासको’
  rationale: हेलेनिस्टिक यूनानी में यह शब्द केवल शासक या अधिपति के अर्थ में भी आ सकता है। प्रसंग सत्ता रखने वालों को उपदेश देता है, सीधे उनके अत्याचार की निंदा नहीं करता; इसलिए नकारात्मक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἵνα के उद्देश्यसूचक संबंध का अनुवाद
  choice: ‘ताकि तुम सदा राज्य कर सको’
  alternative: ‘जिससे तुम सदा राज्य करोगे’
  rationale: ‘ताकि’ मूल के उद्देश्य अथवा अपेक्षित परिणाम को खुला रखता है और कथन को बिना आधार निश्चित प्रतिज्ञा में नहीं बदलता।
