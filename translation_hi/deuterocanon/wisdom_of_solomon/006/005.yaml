translation:
  language: hi
  text: वह भयावह रीति से और शीघ्र ही तुम पर आ पड़ेगा,[a] क्योंकि ऊँचे पदों पर बैठे लोगों का न्याय कठोर होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह भयावह रीति से और शीघ्र ही तुम्हारे सामने आ खड़ा होगा, क्योंकि ऊँचे पद वालों के लिए न्याय अचानक होता है।”
    reason: φρικτῶς के ‘भयावह’ अर्थ, ἐπιστήσεται के ‘सामने आ खड़ा होगा’ अर्थ, और ἀπότομος के ‘अचानक’ अर्थ की वैकल्पिक संभावनाओं को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: φρικτῶς
  choice: भयानक रूप से
  rationale: यह क्रियाविशेषण भय और आतंक उत्पन्न करने वाली रीति बताता है; यह अनुवाद उसके प्रबल भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ταχέως
  choice: शीघ्र ही
  rationale: यह दैवी हस्तक्षेप की तीव्रता को सूचित करता है और पद के गरिमामय स्वर के अनुकूल है।
- source_word: ἐπιστήσεται
  choice: तुम पर आ पड़ेगा
  rationale: ἐφίστημι का यह रूप निकट आने, ऊपर आ खड़े होने या अचानक आ पहुँचने का अर्थ दे सकता है। न्याय के प्रसंग में यह चयन आसन्न और भयावह आगमन व्यक्त करता है, पर आक्रमण का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: κρίσις
  choice: न्याय
  rationale: यहाँ शब्द शासकों के विरुद्ध होने वाली न्यायिक कार्रवाई को दर्शाता है; ‘न्याय’ हिन्दी में सीधा और प्रसंगानुकूल है।
- source_word: ἀπότομος
  choice: कठोर
  rationale: शब्द का अर्थ तीखा, कठोर या अचानक हो सकता है। चूँकि ταχέως पहले ही शीघ्रता व्यक्त करता है, ‘कठोर’ न्याय की तीव्रता को उभारता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: ऊँचे पद पर बैठे लोगों का
  rationale: कृदंत पद ऊँचे दर्जे या अधिकार वाले लोगों को सूचित करता है। यह चयन पद और सत्ता की ऊँचाई की छवि को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: γίνεται
  choice: होता है
  rationale: यह क्रिया किसी घटना के घटित होने को बताती है; हिन्दी में ‘न्याय ... होता है’ सामान्य सिद्धांत के रूप में यूनानी वाक्य की संरचना को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: धमकी दी गई कार्रवाई का स्वरूप
  choice: पद सीधे संबोधित शासकों को चेतावनी देता है कि वह भयावह और शीघ्र रीति से उन पर आ पड़ेगा, और ऊँचे पद वालों का न्याय कठोर होता है।
  alternative: इसे अधिक सामान्य सिद्धांत के रूप में पढ़ा जा सकता है कि महान या प्रतिष्ठित लोगों के लिए न्याय अचानक होता है।
  rationale: निकटवर्ती प्रसंग शासकों को सीधे संबोधित करता है, फिर भी दूसरे उपवाक्य का सामान्य वर्तमानकालीन कथन बनाए रखा गया है। इस प्रकार दैवी आगमन का संदर्भ सुरक्षित रहता है और यूनानी की सामान्य उक्तिपरकता भी मिटती नहीं।
