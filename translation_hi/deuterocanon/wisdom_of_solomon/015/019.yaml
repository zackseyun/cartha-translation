  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
translation:
  language: hi
  text: यह देखने में जीवित प्राणियों की तरह इतना सुंदर भी नहीं कि इसे चाहा जाए[a]; बल्कि यह परमेश्वर की प्रशंसा और उसकी आशीष—दोनों से वंचित रह गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवित प्राणियों के रूप में जो सुंदरता होती है, यह उतना भी चाहने योग्य नहीं है।” ‘रूप/दिखावट’ वाला यूनानी वाक्यांश एक से अधिक प्रकार से जोड़ा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यह परमेश्वर की प्रशंसा और उसकी आशीष से बच निकला है”; यहाँ आशय है कि वह इन्हें पाने से रह गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: इतना सुंदर भी नहीं कि इसे चाहा जाए
  rationale: तुलनात्मक निषेध और इच्छा के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है। कर्मवाच्य ‘इसे चाहा जाए’ उस वस्तु को आकर्षण का विषय बनाए रखता है।
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: देखने में जीवित प्राणियों की तरह ... सुंदर
  rationale: ὄψις के ‘दिखावट/रूप’ वाले अर्थ और ζῷα के ‘जीवित प्राणी’ अर्थ को सामने रखता है। यूनानी वाक्यांश की व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐκπέφευγεν
  choice: वंचित रह गया है
  rationale: पूर्णकाल से उत्पन्न वर्तमान अवस्था और प्रसंग के नकारात्मक अभाव को स्पष्ट करता है; शाब्दिक ‘बच निकला है’ हिन्दी में इच्छित अर्थ के विपरीत सफल बचाव का संकेत दे सकता है।
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: परमेश्वर की प्रशंसा
  rationale: यूनानी संबंधकारक की निकट अभिव्यक्ति है और ‘परमेश्वर से मिलने वाली प्रशंसा/स्वीकृति’ की संभावना को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: उसकी आशीष
  rationale: εὐλογία का सीधा, स्वाभाविक हिन्दी रूप; ‘उसकी’ का संदर्भ परमेश्वर है।
theological_decisions:
- issue: पूरे पद के एकवचन कर्ता का संदर्भ
  choice: ‘यह’ से प्रसंग में वर्णित गढ़ी हुई पशु-प्रतिमा अथवा मूर्ति की ओर संकेत किया गया है।
  alternative: इसे सामान्य रूप से चित्रित पशु या जीवित प्राणी का कथन माना जा सकता है।
  rationale: निकटवर्ती प्रसंग कारीगर द्वारा बनाई गई प्रतिमाओं की आलोचना करता है, पर अनुवाद में ‘मूर्ति’ जोड़कर संदर्भ को मूल से अधिक निश्चित नहीं किया गया।
- issue: परमेश्वर की प्रशंसा और आशीष से ‘बच निकलने’ का भाव
  choice: इसे नकारात्मक वंचना—अर्थात उन्हें न पाने—के रूप में व्यक्त किया गया है।
  alternative: शाब्दिक रूप से ‘बच निकला है’ कहा जा सकता है।
  rationale: प्रसंग निंदात्मक है; हिन्दी में ‘बच निकलना’ लाभकारी या जानबूझकर बचाव का भ्रामक भाव देता। शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘जीवित प्राणी’, ‘प्रशंसा’ और ‘आशीष’ जैसे परिचित शब्द चुने गए हैं; मूल की वाक्यगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
