  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/017.yaml
  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: hi
  text: पर वह मरणशील होते हुए भी अधर्मी हाथों से एक मृत वस्तु बनाता है; क्योंकि वह अपनी पूजनीय वस्तुओं[a] से श्रेष्ठ है—वह स्वयं तो कभी जीवित था, पर वे कभी जीवित नहीं थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी मूर्तियों से।”
    reason: σεβάσματα का संदर्भानुकूल, किंतु अधिक व्याख्यात्मक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: θνητὸς
  choice: मरणशील
  rationale: यह मनुष्य के मृत्यु के अधीन होने को व्यक्त करता है और उसके बनाए हुए पूर्णतः निर्जीव उपासना-विषय के साथ विरोध बनाए रखता है।
- source_word: νεκρὸν
  choice: एक मृत वस्तु
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘मृत वस्तु’ मूर्ति की जीवनहीनता बताता है और ‘शव’ जैसे भ्रामक अर्थ से बचता है।
- source_word: ἐργάζεται
  choice: बनाता है
  rationale: मूर्ति-निर्माण के संदर्भ में यह क्रिया बनाने या गढ़ने का अर्थ देती है; ‘बनाता है’ सहज आधुनिक हिन्दी है।
- source_word: χερσὶν ἀνόμοις
  choice: अपने अधर्मी हाथों से
  rationale: वाक्यांश साधन बताता है। ‘अधर्मी’ ἀνόμοις के विधि-विरोधी और दुष्ट आचरण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρείττων
  choice: श्रेष्ठ
  rationale: यह निर्माता की उसकी बनाई और पूजी हुई वस्तुओं पर तुलनात्मक श्रेष्ठता व्यक्त करता है।
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: जिन वस्तुओं की वह पूजा करता है
  rationale: यह उपासना या श्रद्धा की वस्तुओं का सीधा अर्थ देता है और संदर्भगत ‘मूर्तियों’ को मुख्य पाठ में अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἔζησεν
  choice: कभी जीवित था
  rationale: अओरिस्ट इस तथ्य को रेखांकित करता है कि कारीगर के पास कम-से-कम कभी जीवन था, जबकि उसकी बनाई वस्तुओं में कभी नहीं था।
- source_word: οὐδέποτε
  choice: कभी जीवित नहीं थीं
  rationale: यह उपासना की वस्तुओं में हर समय जीवन के पूर्ण अभाव को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: मूर्ति-पूजा के संदर्भ में σεβάσματα का अनुवाद
  choice: जिन वस्तुओं की वह पूजा करता है
  alternative: अपनी मूर्तियों से
  rationale: चुना गया अनुवाद यूनानी शब्द के व्यापक अर्थ—पूजा या श्रद्धा की वस्तुएँ—को सुरक्षित रखता है, जबकि प्रसंग की मूर्ति-विरोधी धार भी स्पष्ट रहती है। ‘मूर्तियाँ’ संदर्भानुकूल है, पर थोड़ा अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मरणशील’ और ‘मृत’ का विरोध मूल पद्य के जीवन-मृत्यु संबंधी व्यंग्य को बनाए रखता है; अंतिम खंड में ‘जीवित’ की पुनरावृत्ति हिन्दी में विरोध को साफ करती है।
