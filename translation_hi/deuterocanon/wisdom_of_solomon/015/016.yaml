base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/016.yaml
  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: hi
  text: क्योंकि एक मनुष्य ने उन्हें बनाया, और आत्मा[a] उधार लेकर उसने उन्हें गढ़ा; क्योंकि कोई मनुष्य अपने समान कोई देवता गढ़ने की सामर्थ्य नहीं रखता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राण” अथवा “जीवन-श्वास”; यहाँ यूनानी शब्द उस जीवनदायी श्वास को भी सूचित कर सकता है जो मनुष्य के पास केवल उधार की वस्तु के समान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: दोनों स्थानों पर एक नश्वर मानव कारीगर का बोध है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और देवता बनाने के दावे के साथ निहित व्यंग्य बनाए रखता है।
- source_word: ἐποίησεν
  choice: बनाया
  rationale: यह मूर्तियों के निर्माण के लिए प्रयुक्त सामान्य क्रिया है; ‘बनाया’ व्यापक और सहज है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूनानी शब्द आत्मा, प्राण अथवा जीवन-श्वास का बोध करा सकता है। मुख्य पाठ में ‘आत्मा’ मूल की व्यापकता को बनाए रखता है, जबकि पाद-टिप्पणी श्वास-संबंधी अर्थ बताती है।
- source_word: δεδανεισμένος
  choice: उधार लेकर
  rationale: पूर्णकालिक कृदन्त यह दर्शाता है कि कारीगर का अपना जीवन स्वोत्पन्न नहीं, बल्कि मिला हुआ और आश्रित है। ‘उधार लेकर’ मूल रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: ἔπλασεν
  choice: गढ़ा
  rationale: πλάσσω में आकार देने या ढालने का भाव है; मूर्ति-निर्माण के प्रसंग में ‘गढ़ा’ सटीक और स्वाभाविक है।
- source_word: αὐτῷ ὅμοιον
  choice: अपने समान
  rationale: यह वाक्यांश θεόν का विशेषण है और इस विडंबना पर बल देता है कि मनुष्य अपने ही समान देवता बनाने का प्रयत्न करता है।
- source_word: ἰσχύει
  choice: सामर्थ्य नहीं रखता
  rationale: क्रिया शक्ति अथवा क्षमता को व्यक्त करती है; यह चयन मूल के बलपूर्ण अर्थ और व्यंग्य दोनों को बनाए रखता है।
- source_word: θεόν
  choice: कोई देवता
  rationale: मूर्ति-विरोधी प्रसंग में यह सच्चे परमेश्वर नहीं, मनुष्य द्वारा बनाए जाने वाले कथित देवता को सूचित करता है; ‘कोई’ हिन्दी में अनिश्चित एकवचन को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘आत्मा उधार लेकर’ का मनुष्य के जीवन से संबंध
  choice: मूर्ति बनाने वाला मनुष्य स्वयं जीवन या आत्मा का स्वतंत्र स्रोत नहीं है; उसका जीवन उसे मिला हुआ और आश्रित है।
  alternative: इसे अधिक शारीरिक अर्थ में ‘प्राण’ या ‘जीवन-श्वास उधार लेकर’ समझा जा सकता है, जो विशेष रूप से उसकी नश्वरता पर बल देता है।
  rationale: प्रसंग निर्जीव मूर्तियों का उपहास करते हुए उनके मानव निर्माता की निर्भरता और नश्वरता दिखाता है। मुख्य पाठ πνεῦμα की व्यापकता बनाए रखता है और पाद-टिप्पणी उसके संभावित श्वास-संबंधी अर्थ को प्रस्तुत करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उधार लेकर’ का कुछ असामान्य रूपक जानबूझकर सुरक्षित रखा गया है, क्योंकि वही मनुष्य की आश्रित और नश्वर दशा पर मूल पद का प्रहार व्यक्त करता है।
