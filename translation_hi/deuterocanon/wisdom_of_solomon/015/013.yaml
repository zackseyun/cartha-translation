  text: For this man knows better than all others that he is sinning[a], making fragile vessels and carved images out of earthy material.
translation:
  language: hi
  text: क्योंकि यह व्यक्ति दूसरों से बढ़कर जानता है कि वह पाप कर रहा है[a], धरती की सामग्री से आसानी से टूटनेवाले बरतन और तराशी हुई प्रतिमाएँ बनाते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब लोगों से अधिक वह जानता है कि वह पाप करता है।” यूनानी तुलनात्मक पदबंध को हिन्दी में थोड़े भिन्न शब्दक्रम से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: यह व्यक्ति
  rationale: संकेतवाचक सर्वनाम संदर्भ में मूर्तियाँ बनानेवाले कारीगर की ओर संकेत करता है; यह अनुवाद उसके एकवचन और व्यक्तिगत उत्तरदायित्व को स्पष्ट रखता है।
- source_word: παρὰ πάντας
  choice: दूसरों से बढ़कर
  rationale: οἶδεν के साथ यह पदबंध तुलनात्मक अर्थ देता है कि उसे अन्य सब लोगों की अपेक्षा अधिक ज्ञान है। हिन्दी में यह रूप स्वाभाविक है और तुलना को बनाए रखता है।
- source_word: οἶδεν
  choice: जानता है
  rationale: यह क्रिया सचेत ज्ञान को व्यक्त करती है, जो कारीगर के नैतिक उत्तरदायित्व के लिए महत्त्वपूर्ण है।
- source_word: ὅτι ἁμαρτάνει
  choice: कि वह पाप कर रहा है
  rationale: वर्तमान काल को जारी गतिविधि के रूप में व्यक्त किया गया है, जिससे केवल सामान्य कथन नहीं बल्कि उसके वर्तमान कार्य की दोषपूर्णता सामने आती है।
- source_word: ὕλης γεώδους
  choice: मिट्टी जैसे पदार्थ से
  rationale: ὕλη पदार्थ या सामग्री है और γεώδης मिट्टी जैसा या पृथ्वीमय; यह रूप मूल की व्यापकता रखता है और सामग्री को केवल चिकनी मिट्टी तक सीमित नहीं करता।
- source_word: εὔθραυστα σκεύη
  choice: आसानी से टूटनेवाले बरतन
  rationale: εὔθραυστα की भंगुरता और σκεύη के सामान्य उपयोग की वस्तुओं का अर्थ सहज आधुनिक हिन्दी में स्पष्ट होता है।
- source_word: γλυπτὰ
  choice: खुदी हुई प्रतिमाएँ
  rationale: शब्द का मूल अर्थ तराशी या खोदी हुई वस्तुएँ है; संदर्भ में वे प्रतिमाएँ हैं। यह चयन ‘मूरतें’ की अपेक्षा मानक और ‘मूर्तियाँ’ की अपेक्षा निर्माण-विधि के अधिक निकट है।
- source_word: δημιουργῶν
  choice: बनाता है
  rationale: वर्तमान कृदन्त कारीगर की चल रही निर्माण-क्रिया बताता है; सरल ‘बनाता है’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: मूर्ति बनानेवाले का नैतिक ज्ञान और दोष
  choice: पाठ कहता है कि कारीगर अपना काम करते समय जानता है कि वह पाप कर रहा है।
  alternative: तुलनात्मक पदबंध को ‘सबसे अधिक वह यह जानता है कि वह पाप करता है’ जैसे भिन्न शब्दक्रम में भी रखा जा सकता है।
  rationale: यूनानी वाक्य सचेत नैतिक ज्ञान पर बल देता है, पर यह नहीं बताता कि वह यह ज्ञान कैसे या क्यों रखता है। अनुवाद इस तनाव को बनाए रखता है और अतिरिक्त धर्मसिद्धान्त नहीं जोड़ता।
- issue: बरतनों और प्रतिमाओं का एक साथ उल्लेख
  choice: दोनों वस्तुओं को एक ही निर्माण-क्रिया के कर्मों के रूप में रखा गया है।
  alternative: वाक्य को इस प्रकार समझा जा सकता है कि पाप का विशेष संबंध खुदी हुई प्रतिमाओं से है, यद्यपि वही कारीगर साधारण बरतन भी बनाता है।
  rationale: यूनानी व्याकरण दोनों को καὶ से जोड़ता है, पर स्वयं इस पद में पाप का संबंध प्रत्येक वस्तु से अलग-अलग स्पष्ट नहीं किया गया। इसलिए अनुवाद सूची को जस का तस रखता है और व्याख्यात्मक भेद नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘आसानी से टूटनेवाले बरतन’ साधारण पाठक के लिए ‘भंगुर पात्र’ से अधिक स्पष्ट है; ‘खुदी हुई प्रतिमाएँ’ निर्माण की क्रिया और मूर्तिपूजा के संदर्भ दोनों को व्यक्त करती हैं।
