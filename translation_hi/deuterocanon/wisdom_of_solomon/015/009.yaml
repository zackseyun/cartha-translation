  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: hi
  text: फिर भी उसे इस बात की चिंता नहीं कि वह थकने वाला है[a], न इस बात की कि उसका जीवन थोड़े ही समय का है। इसके बजाय, वह सुनारों और चाँदी के कारीगरों से होड़ करता है[b], काँसे के कारीगरों की नकल करता है, और नकली वस्तुएँ गढ़ने को अपनी शान समझता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘थक जाने वाला है’ अथवा ‘क्लांत होने वाला है’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सुनारों और चाँदी के कारीगरों की बराबरी करने की कोशिश करता है’।
    reason: lexical_alternative
  - marker: c
    text: ‘नकली वस्तुएँ’ का अनुवाद ‘झूठी वस्तुएँ’, ‘जाली वस्तुएँ’ या ‘घटिया नकलें’ भी हो सकता है।
    reason: lexical_alternative
