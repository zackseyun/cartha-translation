- source_word: φροντίς
  choice: चिंता
  rationale: यह उस बात को व्यक्त करता है जो कारीगर के मन को व्यस्त करनी चाहिए, पर नहीं करती; ‘चिंता’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से तीव्र मानसिक व्यथा नहीं जोड़ता।
- source_word: μέλλει κάμνειν
  choice: वह थकने वाला है
  rationale: μέλλει आसन्न स्थिति और κάμνειν थकने या निर्बल होने का भाव देता है। मुख्य पाठ निकटतम सामान्य अर्थ रखता है, जबकि मृत्यु या दम टूटने की संदर्भगत संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: βραχυτελῆ βίον
  choice: उसका जीवन थोड़े ही समय का है
  rationale: यह सहज हिन्दी में ऐसे जीवन का भाव देता है जो शीघ्र समाप्त होता है और कारीगर की नश्वरता पर बल बनाए रखता है।
- source_word: ἀντερείδεται
  choice: से होड़ करता है
  rationale: क्रिया प्रतिस्पर्धी ढंग से बराबरी करने या टक्कर लेने का भाव रखती है; ‘होड़ करता है’ आधुनिक और स्पष्ट है।
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: सुनारों और चाँदी के कारीगरों
  rationale: दोनों विशिष्ट शिल्पकार समूहों का समानांतर और स्वाभाविक हिन्दी रूप।
- source_word: χαλκοπλάστας
  choice: काँसे के कारीगरों
  rationale: यह ताँबे या काँसे को आकार देने वाले शिल्पकारों को सूचित करता है; प्रसंग में ‘काँसे के कारीगर’ उपयुक्त और सुबोध है।
- source_word: μιμεῖται
  choice: नकल करता है
  rationale: यह सीधे अनुकरण का भाव देता है और कारीगर की व्युत्पन्न कला को स्पष्ट रखता है।
- source_word: δόξαν ἡγεῖται
  choice: अपनी शान समझता है
  rationale: यह मूल्यांकन से जुड़ा गर्व और लेखक की विडंबनापूर्ण निंदा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κίβδηλα
  choice: नकली वस्तुएँ
  rationale: शब्द जाली, मिलावटी या असली न होने वाली वस्तुओं का बोध करा सकता है। मूर्तिनिर्माण के प्रसंग में ‘नकली वस्तुएँ’ भौतिक और नैतिक दोनों प्रकार की असत्यता की गुंजाइश बनाए रखता है।
- source_word: πλάσσει
  choice: गढ़ने
  rationale: कारीगरी के प्रसंग में यह आकार देने और बनाने दोनों का सजीव, व्यापक अर्थ देता है।
theological_decisions:
- issue: मूर्तियाँ बनाने वाले कारीगर के गर्व का आशय
  choice: कारीगर अपनी नश्वरता की उपेक्षा करता और नकली वस्तुएँ बनाने में शान मानता है—इस विडंबनापूर्ण निंदा को बनाए रखा गया है।
  alternative: पद को केवल अन्य कारीगरों की तकनीकी नकल का तटस्थ वर्णन माना जा सकता है।
  rationale: आस-पास का प्रसंग मूर्तिनिर्माण की आलोचना करता है। ‘नकली वस्तुएँ’ और ‘अपनी शान समझता है’ मूल की नैतिक विडंबना रखते हैं, पर उससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ते।
- issue: κάμνειν में थकावट और मृत्यु के बीच तनाव
  choice: मुख्य पाठ में ‘थकने वाला है’ रखा गया है।
  alternative: प्रसंग के अनुसार ‘मरने वाला है’ या ‘उसका दम टूटने वाला है’ भी संभव है।
  rationale: क्रिया का सामान्य अर्थ थकना या निर्बल होना है, किंतु नश्वरता के निकट प्रसंग में मृत्यु की ओर संकेत संभव है। पाद-टिप्पणी दोनों संभावनाओं को बिना चुपचाप निर्णीत किए सुरक्षित रखती है।
