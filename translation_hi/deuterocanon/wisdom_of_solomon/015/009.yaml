  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शिल्प-संबंधी पदों में प्रचलित व्यवसायवाचक शब्द और छोटे, स्पष्ट वाक्यांश चुने गए हैं।
