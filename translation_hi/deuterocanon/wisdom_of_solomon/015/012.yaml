  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/012.yaml
  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: hi
  text: परन्तु उसने हमारे जीवन को एक खेल[a] और हमारे जीवन-यापन को लाभ कमाने का उत्सव समझा; क्योंकि वह कहता है, “जहाँ कहीं से भी हो सके, यहाँ तक कि बुराई से भी, साधन जुटाने चाहिए।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे जीवन को एक खिलौना।”
    reason: παίγνιον खेल, खिलवाड़ या खेलने की वस्तु का बोध करा सकता है।
  - marker: b
    text: या, “जहाँ कहीं भी अवसर मिले, यहाँ तक कि बुरे उपाय से भी, लाभ कमाना चाहिए।” ‘बुराई से’ का अर्थ ‘बुरी परिस्थिति से’ भी हो सकता है।
    reason: यह πορίζειν के अर्जन-भाव और ἐκ κακοῦ के नैतिक अथवा परिस्थितिजन्य अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐλογίσατο
  choice: समझा
  rationale: यहाँ क्रिया सोच-विचार करके किसी बात को एक विशेष रूप में मानने का भाव देती है; ‘समझा’ स्वाभाविक और मूल्यांकनात्मक है।
- source_word: παίγνιον
  choice: एक खेल
  rationale: यह शब्द मनोरंजन या खिलवाड़ की वस्तु का बोध करा सकता है। ‘खेल’ नैतिक आलोचना को स्पष्ट रखता है, जबकि ‘खिलौना’ वैकल्पिक अर्थ है।
- source_word: ζωὴν
  choice: जीवन
  rationale: यह सामान्य जीवन को सूचित करता है और βίον से भेद बनाए रखता है।
- source_word: βίον
  choice: जीवन-यापन
  rationale: ζωή के साथ आए इस शब्द में जीने के ढंग तथा आजीविका, दोनों की छाया है; आर्थिक संदर्भ में ‘जीवन-यापन’ इस भेद को स्वाभाविक हिन्दी में रखता है।
- source_word: πανηγυρισμὸν ἐπικερδῆ
  choice: लाभ कमाने का उत्सव
  rationale: πανηγυρισμός उत्सव या सार्वजनिक समारोह है और ἐπικερδής उसमें लाभपरक आशय जोड़ता है। यह अनुवाद उत्सवी रूपक और धनलोलुपता दोनों को बनाए रखता है।
- source_word: ὅθεν δὴ κἂν
  choice: जहाँ कहीं से भी हो सके
  rationale: यह अभिव्यक्ति स्रोत के प्रति उदासीनता और व्यापकता पर बल देती है।
- source_word: πορίζειν
  choice: साधन जुटाने
  rationale: क्रिया का अर्थ अपने लिए आवश्यक वस्तुएँ या संसाधन प्राप्त करना अथवा जुटाना है; ‘साधन जुटाना’ इसके भौतिक-अर्जन भाव को स्पष्ट करता है।
- source_word: ἐκ κακοῦ
  choice: बुराई से भी
  rationale: संदर्भ में यह नैतिक रूप से बुरे स्रोत या उपाय की ओर संकेत करता है, पर मूल की संक्षिप्तता और संभावित व्यापकता सुरक्षित रहती है।
theological_decisions:
- issue: ἐκ κακοῦ का नैतिक बल
  choice: ‘बुराई से भी’—लाभ या साधन बुरे स्रोत अथवा बुरे उपाय से प्राप्त करना
  alternative: ‘बुरी परिस्थिति से भी’ या ‘अनिष्ट से भी’
  rationale: मूर्ति-निर्माता की लाभलोलुप मनोवृत्ति के संदर्भ में नैतिक अर्थ अधिक संगत है। फिर भी पदबंध अपने आप में कुछ व्यापक हो सकता है, इसलिए कम नैतिक, परिस्थितिजन्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘जीवन’ और ‘जीवन-यापन’ से ζωή/βίος का भेद रखा गया है। प्रत्यक्ष कथन के लिए हिन्दी में स्वाभाविक उद्धरण और बहुवचन आदरसूचक नहीं, बल्कि सामान्य अवैयक्तिक ‘चाहिए’ का प्रयोग किया गया है।
