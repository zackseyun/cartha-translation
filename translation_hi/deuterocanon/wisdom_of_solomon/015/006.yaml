translation:
  language: hi
  text: बुराई से प्रेम करनेवाले ऐसी आशाओं के योग्य हैं—वे सभी जो उन्हें बनाते हैं,[a] जो उनकी लालसा करते हैं, और जो उनकी उपासना करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उन्हें करनेवाले’; प्रसंग में इसका आशय मूर्तियों को बनाने या गढ़नेवालों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταὶ
  choice: बुराई से प्रेम करनेवाले
  rationale: γενitive κακῶν के साथ ἐρασταί नैतिक रूप से बुराई के प्रेमियों को दर्शाता है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी की तीखी निंदा बनाए रखता है।
- source_word: ἄξιοί τε τοιούτων ἐλπίδων
  choice: ऐसी आशाओं के योग्य हैं
  rationale: ἄξιοι का मूल भाव ‘योग्य’ और τοιούτων का पीछे की ओर संकेत ‘ऐसी’ से सुरक्षित रहता है। ‘आशाओं’ बहुवचन ἐλπίδων के अनुरूप है और मूर्तियों से जुड़ी अपेक्षाओं की ओर संकेत करता है।
- source_word: οἱ δρῶντες
  choice: उन्हें बनानेवाले
  rationale: δρῶντες शाब्दिक रूप से ‘करनेवाले’ है, पर निकटवर्ती प्रसंग में हस्तनिर्मित मूर्तियाँ निहित कर्म हैं; इसलिए ‘बनानेवाले’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: οἱ ποθοῦντες
  choice: उनकी लालसा रखनेवाले
  rationale: ποθέω प्रबल चाह या लालसा व्यक्त करता है। ‘लालसा रखना’ केवल सामान्य इच्छा की अपेक्षा इस तीव्रता को अधिक अच्छी तरह व्यक्त करता है।
- source_word: οἱ σεβόμενοι
  choice: उनकी उपासना करनेवाले
  rationale: धार्मिक संदर्भ में σέβομαι श्रद्धापूर्वक पूजने या उपासना करने का अर्थ देता है; मूर्तियों के संदर्भ में ‘उपासना’ स्पष्ट और उपयुक्त है।
theological_decisions:
- issue: तीनों कृदंतों के लुप्त कर्म की पूर्ति
  choice: ‘उन्हें/उनकी’ जोड़कर इसका संकेत प्रसंग में वर्णित मूर्तियों की ओर रखा गया है।
  alternative: 'कर्म को अनकहा छोड़ना: ‘करनेवाले, लालसा रखनेवाले और उपासना करनेवाले।’'
  rationale: यूनानी में कर्म प्रसंग से समझा जाता है, जबकि स्वाभाविक हिन्दी में उसे व्यक्त करना आवश्यक है। इससे कोई नया धर्मवैज्ञानिक अर्थ नहीं जुड़ता।
- issue: ‘ऐसी आशाओं के योग्य’ का आशय
  choice: मूल की मूल्यांकनात्मक और कुछ हद तक तनावपूर्ण अभिव्यक्ति को ज्यों का त्यों रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘ऐसे ही परिणाम पाने के योग्य’ कहना।
  rationale: ἐλπίδων का सामान्य अर्थ ‘आशाएँ/अपेक्षाएँ’ है। इसे ‘परिणाम’ या ‘दंड’ कहना अस्पष्टता को अनुचित रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और सार्वजनिक पाठ के योग्य शैली। ‘प्रेम करनेवाले’, ‘लालसा रखनेवाले’ और ‘उपासना करनेवाले’ की समानांतर रचना यूनानी के तीन समांतर कृदंतों को प्रतिबिंबित करती है।
