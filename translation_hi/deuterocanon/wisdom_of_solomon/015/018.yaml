    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ζῷα
  choice: पशुओं
  rationale: ζῷον का सामान्य अर्थ जीव या पशु है; पशु-आकृतियों को दिए जाने वाले धार्मिक सम्मान के इस संदर्भ में ‘पशु’ सहज और स्पष्ट है।
- source_word: τὰ ἔχθιστα
  choice: अत्यन्त घृणित
  rationale: ἐχθρός के अतिशयोक्तिपरक रूप का मूल्यांकनात्मक बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σέβονται
  choice: आदर करते हैं
  rationale: σέβομαι धार्मिक श्रद्धा, वंदना या उपासना तक का व्यापक भाव रख सकता है। ‘आदर करते हैं’ मूल की व्यापकता को बनाए रखता है; अधिक स्पष्ट धार्मिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἀνοίᾳ
  choice: मूर्खता में
  rationale: भाववाचक संज्ञा के दत्तिव रूप को तुलना के क्षेत्र या मानदंड के रूप में प्रस्तुत करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: συγκρινόμενα
  choice: तुलना किए जाने पर
  rationale: वर्तमान कर्मवाच्य कृदन्त का तुलनात्मक संबंध स्पष्ट करता है, बिना उसके निहित कर्ता को तय किए।
- source_word: τῶν ἄλλων
  choice: दूसरों से
  rationale: संबंधकारक तुलना के दूसरे पक्ष को सूचित करता है; ‘दूसरों’ का सटीक संदर्भ मूल में खुला है, इसलिए उसे नहीं भरा गया।
- source_word: χείρονα
  choice: बदतर
  rationale: χείρων के तुलनात्मक अर्थ ‘और बुरा/हीन’ का सीधा तथा सहज हिन्दी रूप है।
theological_decisions:
- issue: σέβονται का धार्मिक बल
  choice: आदर करते हैं
  alternative: पूजते हैं; वंदना करते हैं
  rationale: पद मूर्तिपूजक धार्मिक सम्मान की आलोचना करता है, पर यूनानी क्रिया श्रद्धा से लेकर उपासना तक व्यापक है। मुख्य पाठ में व्यापक अर्थ रखा गया और पादटिप्पणी में अधिक स्पष्ट धार्मिक विकल्प दिए गए।
- issue: अंतिम उपवाक्य में ‘वे’ का संभावित संदर्भ
  choice: सर्वनाम ‘वे’ बनाए रखा गया
  alternative: पशु बदतर हैं; उपासक बदतर हैं
  rationale: नपुंसकलिंग बहुवचन χείρονα का व्याकरणिक सामंजस्य τὰ ζῷα/συγκρινόμενα से है, इसलिए मुख्यतः पशुओं की ओर संकेत समझा गया; फिर भी हिन्दी में संज्ञा दोहराकर व्याख्या को अनावश्यक रूप से कठोर नहीं किया गया।
