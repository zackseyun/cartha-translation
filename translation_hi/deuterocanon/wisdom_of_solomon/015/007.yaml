base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are servants to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: hi
  text: क्योंकि कुम्हार भी नरम मिट्टी को बड़े परिश्रम से गूँधकर हमारे काम के लिए एक-एक पात्र बनाता है। फिर भी उसी चिकनी मिट्टी से वह शुद्ध कामों के दास बने पात्रों[a] और उनके विपरीत कामों के पात्रों—सबको एक ही रीति से—गढ़े। पर उनमें से हर एक का क्या उपयोग होगा, इसका निर्णय कुम्हार ही करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् शुद्ध कामों के लिए बने या उनकी सेवा में लगे पात्र। यूनानी में शाब्दिक रूप से पात्रों को ‘शुद्ध कामों के दास’ कहा गया है।
    reason: δοῦλα के रूपक का शाब्दिक बल बनाए रखते हुए उसका स्वाभाविक आशय स्पष्ट करना।
lexical_decisions:
- source_word: κεραμεύς
  choice: कुम्हार
  rationale: मिट्टी के पात्र बनाने वाले के लिए यह स्वाभाविक और सटीक आधुनिक हिन्दी शब्द है।
- source_word: ἁπαλὴν γῆν
  choice: नरम मिट्टी
  rationale: शाब्दिक अर्थ ‘कोमल/नरम धरती’ है; कुम्हारी के संदर्भ में ‘नरम मिट्टी’ अधिक स्वाभाविक है, जबकि आगे πηλός के लिए ‘चिकनी मिट्टी’ रखकर शब्दगत अंतर कुछ हद तक बचाया गया है।
- source_word: θλίβων ἐπίμοχθον
  choice: बड़े परिश्रम से गूँधकर
  rationale: θλίβων में दबाने और काम में लेने का भाव तथा ἐπίμοχθον में कठिन श्रम का भाव है; संयुक्त हिन्दी पदबंध कुम्हार की श्रमसाध्य क्रिया को सहज रूप में व्यक्त करता है।
- source_word: πλάσσει
  choice: बनाता है
  rationale: यह गढ़ने या आकार देने का सामान्य क्रियापद है; हिन्दी वाक्य में ‘बनाता है’ स्पष्ट और सहज है।
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  choice: हमारे काम के लिए
  rationale: यह मनुष्यों की सेवा या उपयोग में आने का भाव देता है; ‘हमारे काम के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἕκαστον
  choice: एक-एक पात्र
  rationale: यूनानी में ‘हर एक’ का संज्ञा-पद निहित है; कुम्हारी के संदर्भ से ‘पात्र’ स्पष्ट किया गया है।
- source_word: πηλοῦ
  choice: चिकनी मिट्टी
  rationale: कुम्हारी में प्रयुक्त clay के लिए यह सटीक हिन्दी अभिव्यक्ति है और पहले आए γῆ से हल्का शब्दगत भेद भी बनाए रखती है।
- source_word: ἀνεπλάσατο
  choice: गढ़ता है
  rationale: मिट्टी को आकार देने की क्रिया को व्यक्त करता है और पहले आए ‘बनाता है’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: शुद्ध कामों के दास बने पात्र
  rationale: δοῦλα के दासत्व-संबंधी रूपक को मुख्य पाठ में बनाए रखा गया है; यहाँ पात्रों को किसी नियत काम के अधीन या उसकी सेवा में लगा हुआ बताया गया है।
- source_word: τὰ ἐναντία
  choice: उनके विपरीत कामों के पात्र
  rationale: यूनानी केवल ‘विपरीत’ कहता है, सीधे ‘अशुद्ध’ नहीं; इसलिए पाठ की अनिर्दिष्टता को सुरक्षित रखा गया है।
- source_word: πάνθʼ ὁμοίως
  choice: सबको एक ही रीति से
  rationale: यह सभी पात्रों के समान ढंग से गढ़े जाने पर बल देता है।
- source_word: κριτὴς ὁ πηλουργός
  choice: इसका निर्णय कुम्हार ही करता है
  rationale: अंतिम पदबंध में कुम्हार को प्रत्येक पात्र के उपयोग का निर्णायक बताया गया है; ‘ही’ यूनानी पदक्रम के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δοῦλα के रूपक का अनुवाद
  choice: ‘शुद्ध कामों के दास बने पात्र’ कहकर दासत्व का रूपक बनाए रखा गया
  alternative: ‘शुद्ध कामों के लिए बने पात्र’ अथवा ‘शुद्ध कामों की सेवा में लगे पात्र’
  rationale: δοῦλα का शाब्दिक अर्थ ‘दास’ है, यद्यपि यहाँ निर्जीव पात्रों के नियत कार्य के लिए रूपक रूप में प्रयुक्त है। मुख्य पाठ रूपक को सुरक्षित रखता है और पादटिप्पणी सहज अर्थ स्पष्ट करती है।
- issue: τὰ ἐναντία में शुद्धता का निहित विरोध
  choice: ‘उनके विपरीत काम’
  alternative: ‘अशुद्ध काम’
  rationale: यूनानी पाठ ‘विपरीत’ कहता है और अशुद्धता को स्पष्ट रूप से नाम नहीं देता; इसलिए अनुवाद में उससे अधिक निश्चित अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शुद्ध काम’ धार्मिक या अनुष्ठानिक शुद्धता की सम्भावना को खुला रखता है; ‘विपरीत काम’ मूल की अस्पष्टता को अनावश्यक रूप से ‘अशुद्ध’ बनाकर निश्चित नहीं करता।
