- source_word: κακόμοχθος
  choice: दुष्ट परिश्रम करके
  rationale: यह पद परिश्रम की कठिनता और उसकी नैतिक बुराई—दोनों को व्यक्त करता है; प्रसंग में मूर्ति बनाने का श्रम दुष्ट कार्य है।
- source_word: θεὸν μάταιον
  choice: एक व्यर्थ देवता
  rationale: μάταιος निष्फलता, खोखलेपन और असारता का भाव रखता है; “व्यर्थ” गढ़े हुए देवता की विडंबनापूर्ण निष्प्रभाविता को बनाए रखता है।
- source_word: πλάσσει
  choice: गढ़ता है
  rationale: मिट्टी को आकार देने के लिए “गढ़ना” स्वाभाविक हिन्दी है और सामान्य “बनाना” से अधिक चित्रात्मक है।
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: उसी मिट्टी से
  rationale: “उसी” इस बात पर बल देता है कि मूर्ति भी उसी साधारण पदार्थ की है जिससे अन्य वस्तुएँ बनाई जाती हैं।
- source_word: ὃς
  choice: वही मनुष्य
  rationale: सम्बन्धवाचक सर्वनाम का संकेत मूर्ति की ओर नहीं, मूर्ति बनाने वाले मनुष्य की ओर है; इसे हिन्दी में स्पष्ट किया गया है।
- source_word: πρὸ μικροῦ
  choice: कुछ ही समय पहले
  rationale: यह निकट अतीत और मनुष्य के अल्पकालिक अस्तित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ γῆς γενηθεὶς
  choice: धरती से बना था
  rationale: γενηθεὶς व्यापक रूप से अस्तित्व में आने या बनने का अर्थ दे सकता है; यह अनुवाद सृष्टि-संबंधी प्रतिध्वनि रखता है, पर “जन्मा” जैसा अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: μετʼ ὀλίγον πορεύεται
  choice: थोड़े ही समय बाद ... लौट जाएगा
  rationale: आगामी गति का गंतव्य अगले वाक्यांश में धरती है; “लौट जाएगा” उस निहित वापसी को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξ ἧς ἐλήμφθη
  choice: उस धरती में ... जिससे वह लिया गया था
  rationale: धरती को दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है और मनुष्य के धरती से लिए जाने की सृष्टि-प्रतिध्वनि सुरक्षित रहती है।
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: जब उससे उसके प्राण का ऋण माँगा जाएगा
  rationale: χρέος के ऋण-रूपक और ἀπαιτέω के वापस माँगने के भाव को बनाए रखा गया है। ψυχή के लिए “प्राण” हिन्दी में आत्मा और जीवन के बीच मूल की अर्थगत व्यापकता को कुछ हद तक सँभालता है; विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: मृत्यु के प्रसंग में ψυχή का अर्थ
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: ψυχή यहाँ जीवन या आत्मा दोनों का बोध करा सकता है। “प्राण” मृत्यु के प्रसंग में स्वाभाविक है और मूल की मानव-विषयक गंभीरता को बनाए रखता है, जबकि “जीवन” को पाद-टिप्पणी में सुरक्षित रखा गया है; इससे अस्पष्टता पूरी तरह समाप्त नहीं की जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। दीर्घ यूनानी वाक्य की विडंबना—मिट्टी से बना नश्वर मनुष्य उसी मिट्टी से देवता गढ़ता है—को डैश और स्पष्ट कर्ता के द्वारा सुरक्षित रखा गया है।
