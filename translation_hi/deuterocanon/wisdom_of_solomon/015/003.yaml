  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: hi
  text: क्योंकि आपको जानना सम्पूर्ण धार्मिकता है, और आपके सामर्थ्य को जानना अमरता की जड़ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: जानना
  rationale: यहाँ क्रिया पहचान और समझ सहित जानने का भाव देती है। समानांतर εἰδέναι के साथ ‘जानना’ संक्षिप्तता और काव्यात्मक समानता बनाए रखता है।
- source_word: ὁλόκληρος
  choice: सम्पूर्ण
  rationale: यह δικαιοσύνη को पूर्ण, अखंड और किसी कमी से रहित बताता है; आधुनिक गरिमापूर्ण हिन्दी में ‘सम्पूर्ण’ स्वाभाविक है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: इस प्रसंग में परमेश्वर को जानने से उत्पन्न उसके साथ सही संबंध और नैतिक खराई का भाव प्रमुख है। ‘धार्मिकता’ इस धर्मवैचारिक आयाम को रखती है, जबकि ‘न्याय’ भी सम्भव अर्थ है।
- source_word: εἰδέναι
  choice: जानना
  rationale: मूल अर्थ ज्ञान या पहचान है। पहले ज्ञान-सूचक क्रिया के समान अनुवाद से यूनानी वाक्य का समानांतर विन्यास स्पष्ट रहता है।
- source_word: κράτος
  choice: सामर्थ्य
  rationale: शब्द प्रभावी शक्ति और पराक्रम का बोध कराता है। ‘सामर्थ्य’ गरिमापूर्ण और व्यापक है तथा अनावश्यक रूप से राजनीतिक प्रभुत्व का अर्थ नहीं जोड़ता।
- source_word: ῥίζα
  choice: जड़
  rationale: यूनानी का सजीव रूपक हिन्दी में भी स्पष्ट है, इसलिए उसे ‘स्रोत’ जैसे अमूर्त शब्द में नहीं बदला गया।
- source_word: ἀθανασίας
  choice: अमरता
  rationale: यह मृत्यु से परे रहने की अवस्था का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी पद है।
theological_decisions:
- issue: बुद्धि-साहित्य के धर्मवैचारिक प्रसंग में δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: पद परमेश्वर को जानने को सम्पूर्ण δικαιοσύνη कहता और उसे अमरता के समानांतर रखता है। इसलिए परमेश्वर के सम्मुख सही संबंध और जीवन की खराई व्यक्त करने वाला ‘धार्मिकता’ मुख्य पाठ में उपयुक्त है; ‘न्याय’ की वास्तविक शब्दार्थीय सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। परमेश्वर को आदरसूचक ‘आप’ से संबोधित किया गया है। यूनानी के दो समानांतर ज्ञान-सूचक क्रियापदों को दोनों बार ‘जानना’ कहा गया और ‘जड़’ का मूल रूपक बनाए रखा गया है।
