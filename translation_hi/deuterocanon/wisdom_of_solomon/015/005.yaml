  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: hi
  text: उनका दृश्य मूर्खों के लिए अपमान का कारण बनता है, और वे एक मृत प्रतिमा के श्वासहीन रूप की लालसा करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘लालसा करता है’ एकवचन है और उसका कर्ता स्पष्ट नहीं है। अधिक शाब्दिक, पर कठिन, अनुवाद यह हो सकता है: ‘और उनका रूप एक मृत प्रतिमा के श्वासहीन रूप की लालसा करता है।’'
    reason: मूल यूनानी के संक्षिप्त वाक्य-विन्यास और दूसरे खंड में कर्ता की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ὧν ὄψις
  choice: उनका दिखाई देना
  rationale: ὄψις का अर्थ ‘दृष्टि’, ‘दिखाई देना’ या ‘रूप’ हो सकता है। यहाँ संबंधवाचक ὧν के साथ यह उन प्रतिमाओं के दृश्य रूप अथवा उन्हें देखे जाने की ओर संकेत करता है; ‘उनका दिखाई देना’ हिन्दी में इस व्यापकता को सहज रूप से रखता है।
- source_word: ἄφροσιν
  choice: मूर्खों के लिए
  rationale: ἄφρων बुद्धि या विवेक से रहित व्यक्ति को दर्शाता है। ‘मूर्ख’ ज्ञान-साहित्य में बुद्धि और मूर्खता के नैतिक विरोध को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: εἰς ὄνειδος ἔρχεται
  choice: लज्जा का कारण बनता है
  rationale: शाब्दिक भाव ‘लज्जा/अपमान में आता है’ है। आधुनिक हिन्दी में ‘लज्जा का कारण बनता है’ परिणामसूचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना यह तय किए कि लज्जा देखने वालों की अनुभूति है या उन पर लगा कलंक।
- source_word: ποθεῖ
  choice: वे ... लालसा करते हैं
  rationale: क्रिया यूनानी में एकवचन है और उसका व्याकरणिक संबंध संक्षिप्त तथा अस्पष्ट है। प्रसंग में प्रतिमाओं की ओर आकर्षित मूर्ख लोग अभिप्रेत प्रतीत होते हैं; इसलिए मुख्य पाठ में उन्हें निहित कर्ता मानकर बहुवचन किया गया है, जबकि पादटिप्पणी मूल वाक्य-विन्यास की कठिनाई बताती है।
- source_word: νεκρᾶς εἰκόνος
  choice: एक मृत प्रतिमा के
  rationale: νεκρός का मूल अर्थ ‘मृत’ है। इसे अलग रखकर अनुवाद करने से आगे आने वाले ἄπνουν के ‘श्वासहीन’ भाव के साथ स्रोत की दोहरी निर्जीवता बनी रहती है।
- source_word: εἶδος
  choice: रूप
  rationale: εἶδος दृश्य आकार या स्वरूप को दर्शाता है। ‘रूप’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἄπνουν
  choice: श्वासहीन
  rationale: ἄπνους का शाब्दिक अर्थ ‘बिना श्वास का’ है। ‘श्वासहीन’ प्रतिमा और जीवित प्राणी के बीच मूल विरोध को सुरक्षित रखता है और νεκρός के अर्थ को अनावश्यक रूप से दोहराता नहीं।
theological_decisions:
- issue: लालसा व्यक्त करने वाली एकवचन क्रिया का कर्ता
  choice: मुख्य पाठ में मूर्ख लोगों को निहित कर्ता मानकर ‘वे ... लालसा करते हैं’
  alternative: ὄψις को कर्ता मानकर ‘उसका दिखाई देना ... लालसा करता है’, अथवा एक सामान्य एकवचन मूर्ख व्यक्ति को निहित मानना
  rationale: ποθεῖ एकवचन है, पर निकटतम स्पष्ट मानवीय समूह ἄφροσιν (‘मूर्खों’) है। दृश्य या दिखाई देने को लालसा का कर्ता बनाना हिन्दी में अत्यंत दुर्बोध होगा। इसलिए प्रसंगानुकूल मानवीय कर्ता अपनाया गया है, पर मूल की संकुचित और अस्पष्ट रचना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मृत’ और ‘श्वासहीन’ दोनों शब्द जानबूझकर रखे गए हैं, ताकि νεκρᾶς और ἄπνουν के अलग-अलग बल न मिटें।
