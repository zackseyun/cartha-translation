  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: hi
  text: क्योंकि यदि हम पाप करें भी, तो हम तेरे ही हैं[a], क्योंकि हम तेरा सामर्थ्य[b] जानते हैं; पर हम पाप नहीं करेंगे, क्योंकि हम जानते हैं कि हम तेरे ही गिने गए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तेरे हैं,” अर्थात हम तुझसे संबंध रखते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरा बल” अथवा “तेरी शक्ति।”
    reason: lexical_alternative
  - marker: c
    text: या, “हम तेरे माने गए हैं।” यूनानी शब्द में हिसाब लगाकर किसी को गिनने या मानने का भाव है और यहाँ वह परमेश्वर से संबंध को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: γὰρ के व्याख्यात्मक अर्थ को ‘क्योंकि’ और καί के बलाघात को शर्तवाचक खंड में ‘भी’ से व्यक्त किया गया है; इससे आधुनिक हिन्दी में स्वाभाविक प्रवाह बना रहता है।
- source_word: ἐὰν ἁμάρτωμεν
  choice: यदि हम पाप करें भी
  rationale: ἐάν के साथ एओरिस्ट सब्जंक्टिव वास्तविक संभावना वाली शर्त प्रकट करता है। ‘करें भी’ प्रसंग का रियायती भाव बनाए रखता है।
- source_word: σοὶ ἐσμεν
  choice: हम तेरे ही हैं
  rationale: ‘होना’ के साथ सम्प्रदानवाचक σοὶ यहाँ संबंध और अपनेपन को दर्शाता है। ‘तेरे ही हैं’ संक्षिप्त और स्वाभाविक है तथा अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: εἰδότες
  choice: क्योंकि हम ... जानते हैं
  rationale: परफेक्ट कृदन्त का यहाँ परिस्थितिजन्य अथवा कारणवाचक अर्थ हो सकता है। हिन्दी में कारणवाचक रूप वाक्य को सहज बनाता है, जबकि ‘जानते हैं’ उसकी स्थायी जानकारी का भाव रखता है।
- source_word: σου τὸ κράτος
  choice: तेरे सामर्थ्य
  rationale: κράτος बल, सामर्थ्य या प्रभावी शक्ति का सूचक है। ‘सामर्थ्य’ गरिमापूर्ण और व्यापक है तथा इसे केवल शासन-अधिकार तक सीमित नहीं करता।
- source_word: οὐχ ἁμαρτησόμεθα
  choice: हम पाप नहीं करेंगे
  rationale: भविष्यकालीन क्रिया को सीधे भविष्यकाल में रखा गया है। इसे आज्ञा या केवल इच्छा में बदलकर मूल कथन की दृढ़ता को कम नहीं किया गया।
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: कि हम तेरे ही गिने गए हैं
  rationale: λογίζομαι का परफेक्ट पैसिव ‘गिना/माना गया होना’ दर्शाता है, और σοὶ संबंध अथवा अपनेपन को। यह अनुवाद हिसाब-किताब से जुड़ी मूल रूपक-छाया और परमेश्वर से संबंध—दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘यदि हम पाप करें भी’ और ‘हम पाप नहीं करेंगे’ के बीच दिखाई देने वाला तनाव
  choice: दोनों कथनों को उनके शर्तवाचक और भविष्यकालीन रूप में ज्यों का त्यों साथ रखा गया है।
  alternative: दूसरे खंड को ‘हम पाप न करें’ या ‘हमें पाप नहीं करना चाहिए’ कहना, अथवा पहले खंड को इस तरह बदलना कि तनाव कम हो जाए।
  rationale: यूनानी पाठ एक ओर पाप की संभावना के बावजूद परमेश्वर से संबंध बताता है और दूसरी ओर पाप न करने का दृढ़ कथन करता है। अनुवाद इस धार्मिक और अलंकारिक तनाव को व्याख्या द्वारा समाप्त नहीं करता।
- issue: σοὶ λελογίσμεθα में गिने जाने और परमेश्वर से संबंधित होने का संयुक्त भाव
  choice: ‘हम तेरे ही गिने गए हैं’
  alternative: ‘हम तेरे हैं’ या ‘हम तेरे लोग माने गए हैं’
  rationale: पहला विकल्प लेखांकन-संबंधी रूपक खो देता है, जबकि दूसरा मूल में स्पष्ट रूप से न आए ‘लोग’ को जोड़ता है। चुना हुआ रूप दोनों अर्थ-स्तरों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरा’ रूप रखा गया है। दोनों अर्धवाक्यों की समानांतर बनावट और पाप संबंधी मूल तनाव सुरक्षित हैं; कृदन्तों को स्वाभाविक हिन्दी के लिए कारणवाचक उपवाक्यों में व्यक्त किया गया है।
