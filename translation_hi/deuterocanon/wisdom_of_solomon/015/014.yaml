translation:
  language: hi
  text: परन्तु वे सभी निपट मूर्ख और शिशु के प्राण से भी अधिक दयनीय हैं—तेरी प्रजा के वे शत्रु, जिन्होंने उस पर अत्याचार किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिशु से भी अधिक दयनीय” अथवा “शिशु के जीवन से भी अधिक दयनीय।” यूनानी वाक्यांश का शाब्दिक अर्थ “शिशु के प्राण/जीवन से” है; यह अत्यन्त असहाय या दयनीय दशा पर बल देने वाला संक्षिप्त कथन हो सकता है।
    reason: ψυχή के ‘प्राण/जीवन’ अर्थ और संक्षिप्त तुलनात्मक वाक्यांश की वास्तविक अस्पष्टता स्पष्ट करना।
