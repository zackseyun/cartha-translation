  source_fidelity: The translation accurately preserves πάντες (‘वे सभी’), the superlative force of ἀφρονέστατοι (‘निपट मूर्ख’), the comparative ὑπέρ, and the deliberately compressed ψυχὴν νηπίου image (‘शिशु के प्राण से भी अधिक दयनीय’). ‘तेरी प्रजा के वे शत्रु’ appropriately supplies the appositional identification, and ‘जिन्होंने उस पर अत्याचार किया’ renders καταδυναστεύσαντες with its oppressive force. The singular reference is natural with Hindi ‘प्रजा’ and does not distort the Greek collective singular.
  naturalness: The Hindi is dignified, modern, and readily understandable. ‘निपट मूर्ख’ is a slightly literary but still natural emphatic equivalent. The phrase ‘शिशु के प्राण से भी अधिक दयनीय’ is intentionally unusual, as is the Greek expression; the footnote responsibly provides more idiomatic possibilities without replacing the source image in the text.
  terminology: ‘प्रजा,’ ‘शत्रु,’ and ‘अत्याचार’ fit the passage’s elevated register and convey the sense without importing theological interpretation. ‘प्राण’ is a valid rendering of ψυχή here, while the footnote properly notes ‘जीवन’ as an alternative.
