  rationale: विशेषण की अतिशयोक्तिपूर्ण तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τάλανες ὑπὲρ ψυχὴν νηπίου
  choice: शिशु के प्राण से भी अधिक दयनीय
  rationale: ὑπέρ के तुलनात्मक अर्थ और ψυχή की जान/प्राण/आत्मा संबंधी वास्तविक अर्थगत अस्पष्टता को अपेक्षाकृत औपचारिक ढंग से सुरक्षित रखता है।
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: तेरी प्रजा के वे शत्रु
  rationale: यह समानाधिकरण द्वारा पहले आए ‘वे सभी’ की पहचान कराता है; ‘तेरी’ मूल के एकवचन संबोधन को बनाए रखता है।
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: जिन्होंने उस पर अत्याचार किया
  rationale: क्रिया दमनकारी प्रभुत्व बताती है; एकवचन सर्वनाम αὐτόν का संबंध सामूहिक एकवचन ‘प्रजा’ से रखकर मूल व्याकरण सुरक्षित किया गया है।
theological_decisions:
- issue: ὑπὲρ ψυχὴν νηπίου की संक्षिप्त और असामान्य तुलना
  choice: ‘शिशु के प्राण से भी अधिक दयनीय’ के रूप में प्रत्यक्ष तुलना
  alternative: ‘शिशु से भी अधिक दयनीय’ अथवा ‘शिशु के जीवन से भी अधिक दयनीय’
  rationale: मूल यूनानी में तुलना ψυχὴν νηπίου से है। मुख्य पाठ में इस असामान्य बिंब को मिटाया नहीं गया, जबकि पादटिप्पणी स्वाभाविक वैकल्पिक अर्थ बताती है।
- issue: αὐτόν का वचन
  choice: ‘उस पर’, जो सामूहिक एकवचन ‘प्रजा’ की ओर संकेत करता है
  alternative: ‘उन पर’, अर्थानुसार प्रजा के सदस्यों को बहुवचन मानकर
  rationale: यूनानी में λαός और αὐτόν दोनों व्याकरणतः पुल्लिंग एकवचन हैं; हिन्दी में ‘प्रजा’ के साथ एकवचन संकेत स्वाभाविक और मूल के निकट है।
