base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: hi
  text: क्योंकि उन्होंने राष्ट्रों की सभी मूर्तियों को देवता समझा—ऐसी वस्तुएँ जिनमें न तो देखने के लिए आँखों का उपयोग है, न हवा भीतर खींचने के लिए नाक का, न सुनने के लिए कानों का, न छूकर अनुभव करने के लिए हाथों की उँगलियों का; और उनके पैर चलने के लिए बेकार हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: मान लिया
  rationale: यह क्रिया किसी वस्तु को कुछ समझने या गिनने का भाव देती है। यहाँ ‘देवता मान लिया’ स्वाभाविक हिन्दी में उसके मूल्यांकनात्मक अर्थ को स्पष्ट रखता है।
- source_word: εἴδωλα
  choice: मूर्तियों
  rationale: इस निंदात्मक धार्मिक संदर्भ में शब्द उन उपासना-प्रतिमाओं के लिए है जिन्हें देवता समझा गया; ‘मूर्ति’ भौतिक वस्तु और प्रसंग, दोनों को सहज रूप से व्यक्त करती है।
- source_word: τῶν ἐθνῶν
  choice: अन्यजातियों की
  rationale: यह यहूदी ज्ञान-साहित्य के संदर्भ में इस्राएल से बाहर की जातियों/राष्ट्रों को दर्शाता है। ‘अन्यजातियाँ’ धार्मिक-सांस्कृतिक भेद को संक्षेप में रखता है, बिना नए नियम की कोई विशिष्ट शिक्षा जोड़े।
- source_word: θεούς
  choice: देवता
  rationale: बहुवचन θεούς का सीधा और प्रसंगानुकूल हिन्दी रूप ‘देवता’ है।
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: आँखें देखने के काम नहीं आतीं
  rationale: मूल यूनानी आँखों के देखने हेतु उपयोग/कार्य की बात करता है। यह हिन्दी उस कार्यात्मक अभिव्यक्ति को स्वाभाविक ढंग से बनाए रखती है।
- source_word: συνολκὴν ἀέρος
  choice: हवा भीतर खींचने
  rationale: वाक्यांश का ठोस अर्थ हवा को भीतर खींचना है। यह ‘साँस लेने’ की अपेक्षा मूल बिंब के अधिक निकट है और हिन्दी में स्पष्ट भी है।
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: हाथों की उँगलियाँ छूकर अनुभव नहीं कर सकतीं
  rationale: ψηλάφησις स्पर्श करके टटोलने या अनुभव करने को सूचित करता है। यह चयन मूल के स्पर्श-संबंधी भाव को साफ और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: चलने के लिए बेकार
  rationale: ἀργοί निष्क्रिय या अनुपयोगी होने और ἐπίβασις कदम रखने/चलने की ओर संकेत करता है; यह अनुवाद मूर्तियों की गतिहीनता पर मूल व्यंग्य को बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी कथन की तीक्ष्णता
  choice: मूर्तियों को निर्जीव वस्तुओं के रूप में सीधे चित्रित किया गया है जिन्हें गलत रूप से देवता माना गया।
  alternative: प्रत्येक अंग-संबंधी पदबंध का अत्यधिक शाब्दिक और कम स्वाभाविक अनुवाद।
  rationale: मूल पाठ इंद्रिय और गति की क्षमताओं का क्रमशः निषेध करके मूर्तियों का उपहास करता है। अनुवाद इस तीक्ष्णता को बनाए रखता है, पर यूनानी से बाहर कोई अतिरिक्त धर्मशास्त्रीय टिप्पणी नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। शरीर-अंगों की समानांतर सूची को प्रवाहपूर्ण रखा गया है और मूल के निंदात्मक स्वर को नरम नहीं किया गया। ‘हवा भीतर खींचने’ को मुख्य पाठ में रखने के कारण अंग्रेज़ी परत का आँखों के बाद लगा असंगत पादटिप्पणी-संकेत नहीं अपनाया गया; हिन्दी मसौदे में कोई पादटिप्पणी आवश्यक नहीं है।
