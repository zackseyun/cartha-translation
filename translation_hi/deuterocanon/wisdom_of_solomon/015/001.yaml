lexical_decisions:
- source_word: Σὺ δὲ
  choice: परन्तु हे हमारे परमेश्वर, आप
  rationale: δέ का प्रसंगगत विरोध ‘परन्तु’ से सुरक्षित रहता है; सम्बोधन को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: χρηστός
  choice: कृपालु
  rationale: यह शब्द भलाई, दयालुता और हितकारी स्वभाव व्यक्त करता है। ‘कृपालु’ यहाँ गरिमापूर्ण और सहज है तथा अगले ἐλέει से पूरी तरह एकार्थक नहीं होता।
- source_word: ἀληθής
  choice: सच्चे
  rationale: यह परमेश्वर के चरित्र की सत्यता और वास्तविक विश्वसनीयता का व्यापक भाव बनाए रखता है; ‘सत्यवादी’ इसका अर्थ अनावश्यक रूप से केवल वाणी तक सीमित कर देता।
- source_word: μακρόθυμος
  choice: धीरजवन्त
  rationale: मूल शब्द क्रोध करने में धीमे और सहनशील होने का भाव देता है। ‘धीरजवन्त’ आधुनिक पाठक के लिए बोधगम्य है और मात्र निष्क्रिय प्रतीक्षा से अधिक व्यापक है।
- source_word: ἐλέει
  choice: दया से
  rationale: करण/रीति के दत्तिव को संज्ञात्मक रूप में सुरक्षित रखते हुए यह बताता है कि परमेश्वर का संचालन दया से होता है।
- source_word: διοικῶν
  choice: संचालित करनेवाले
  rationale: वर्तमान कृदन्त का गुणसूचक रूप सुरक्षित है। ‘संचालित करना’ व्यवस्था, प्रबन्ध और शासन के व्यापक भाव को बिना किसी अतिरिक्त सिद्धान्त के व्यक्त करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह यूनानी पद की सर्वसमावेशी व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दया के साथ परमेश्वर का सार्वभौम संचालन
  choice: ‘दया से सब कुछ संचालित करनेवाले’—परमेश्वर के वर्तमान, सर्वव्यापी संचालन को उसके दयामय ढंग के साथ रखा गया है।
  alternative: ‘दया में सब वस्तुओं पर शासन करनेवाले’ या ‘सब कुछ दयापूर्वक व्यवस्थित करनेवाले’।
  rationale: διοικῶν को वर्तमान गुणसूचक कृदन्त के रूप में और ἐλέει को संचालन की रीति/साधन के रूप में रखना मूल की व्याकरणिक संरचना तथा शासन और दया के संयुक्त कथन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष सम्बोधन। ‘परमेश्वर’ और आदरसूचक ‘आप/हैं’ सामान्य पाठक के लिए स्वाभाविक हैं। वाक्य में मूल यूनानी की गुणसूचक शृंखला और अन्तिम वर्तमान कृदन्त की संरचना यथासम्भव बनाए रखी गई है।
