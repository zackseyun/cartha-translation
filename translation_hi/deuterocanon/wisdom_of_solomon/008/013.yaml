  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: hi
  text: और उसके द्वारा मुझे अमरता मिलेगी[a][b], और मैं अपने बाद आनेवालों के लिए सदा बनी रहनेवाली स्मृति छोड़ जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे” अथवा “उसके साथ”; स्त्रीलिंग सर्वनाम व्यक्तिरूप में चित्रित बुद्धि की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “अमरता” का अर्थ व्यक्तिगत मृत्युरहित जीवन भी हो सकता है; अगले खंड के सम्बन्ध में इसे चिरस्थायी यश के रूप में भी समझा जा सकता है। यूनानी पाठ सम्बन्ध को खुला छोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: मुझे मिलेगी
  rationale: ἔχω का भविष्यकाल मूलतः ‘मेरे पास होगी/मैं पाऊँगा’ व्यक्त करता है। ‘मुझे मिलेगी’ आधुनिक हिन्दी में स्वाभाविक है और प्राप्ति या स्वामित्व की अनावश्यक अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; इसलिए ‘और’ प्रसंग के प्रवाह के अनुकूल है।
- source_word: αὐτὴν
  choice: उसके द्वारा
  rationale: स्त्रीलिंग सर्वनाम व्यक्तिरूप में चित्रित बुद्धि की ओर संकेत करता है। यूनानी में केवल कर्मकारक है, फिर भी प्रसंग साधन या संगति का भाव देता है; ‘उसके द्वारा’ हिन्दी में स्त्री-व्यक्तिरूप और माध्यम, दोनों को बनाए रखता है।
- source_word: ἀθανασίαν
  choice: अमरता
  rationale: ἀθανασία का सीधा और प्रचलित हिन्दी समतुल्य ‘अमरता’ है; यह व्यक्तिगत मृत्युरहित जीवन और स्थायी यश के बीच उपस्थित अर्थगत तनाव को खुला रखता है।
- source_word: μνήμην αἰώνιον
  choice: सदा बनी रहनेवाली स्मृति
  rationale: यह पदबंध चिरस्थायी स्मरण या यश को दर्शाता है। यह चयन अर्थ को स्पष्ट और सहज हिन्दी में देता है, बिना उसे केवल ‘स्मारक’ तक सीमित किए।
- source_word: τοῖς μετʼ ἐμὲ
  choice: अपने बाद आनेवालों के लिए
  rationale: यह बाद की पीढ़ियों की ओर संकेत करता है। दत्तिव कारक का सम्बन्ध हिन्दी में ‘के लिए’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀπολείψω
  choice: छोड़ जाऊँगा
  rationale: ἀπολείπω का भविष्यकाल यहाँ बाद के लोगों के लिए कुछ पीछे छोड़ जाने का अर्थ देता है। ‘छोड़ जाऊँगा’ हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: व्यक्तिरूप में चित्रित बुद्धि के सम्बन्ध में ‘अमरता’ का अर्थ
  choice: ‘अमरता’ को यथावत रखा गया है, ताकि यह कथन व्यक्तिगत मृत्युरहित जीवन या स्थायी यश में से किसी एक तक सीमित न हो।
  alternative: इसे केवल शारीरिक/व्यक्तिगत अमर जीवन या केवल चिरस्थायी ख्याति के रूप में स्पष्ट करना।
  rationale: अगला वाक्यांश सदा बनी रहनेवाली स्मृति का उल्लेख करता है, पर यूनानी पाठ दोनों को पूरी तरह एक ही अर्थ नहीं बनाता। अनुवाद इस धार्मिक और अर्थगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘आनेवालों’ की वर्तनी मानक संयुक्त रूप में रखी गई है। स्त्रीलिंग ‘उसके’ द्वारा बुद्धि के व्यक्तिरूप का संकेत प्रसंग और पाद-टिप्पणी में सुरक्षित है।
