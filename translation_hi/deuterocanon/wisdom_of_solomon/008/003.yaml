    reason: συμβίωσις की अर्थ-व्याप्ति तथा यूनानी सक्रिय क्रिया δοξάζει की वाक्यगत दिशा को स्पष्ट करना।
lexical_decisions:
- source_word: εὐγένειαν
  choice: कुलीनता
  rationale: यह शब्द उत्तम जन्म, कुलीनता या श्रेष्ठ चरित्र का बोध करा सकता है। ‘कुलीनता’ मूल की सामाजिक और गुणात्मक दोनों संभावनाओं को यथासंभव खुला रखती है।
- source_word: δοξάζει
  choice: गौरवान्वित होती है
  rationale: यूनानी वाक्य की संक्षिप्त रचना का आशय है कि परमेश्वर के साथ सहभागिता उसकी कुलीनता को गौरव देती है। हिंदी में कर्मवाच्य अर्थ अधिक स्वाभाविक है।
- source_word: συμβίωσις
  choice: जीवन-संगति
  rationale: यह शब्द साथ रहने, साझा जीवन और संगति—तीनों भाव रखता है। ‘जीवन-संगति’ इसकी ठोस तथा संबंधपरक शक्ति बनाए रखती है।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: συμβίωσις से संबद्ध संबंधकारक रूप; अर्थात परमेश्वर के साथ जीवन-संगति।
- source_word: ἔχουσα
  choice: के कारण
  rationale: स्त्रीलिंग कृदंत को हिंदी में कारण/आधार बताने वाली स्वाभाविक रचना में समाहित किया गया है; इसका संबंध व्यक्तिरूप में प्रस्तुत बुद्धि से है, यद्यपि यूनानी पद-संबंध संक्षिप्त है।
- source_word: ὁ πάντων δεσπότης
  choice: सबके स्वामी
  rationale: δεσπότης का मूल अर्थ स्वामी या अधिपति है; ‘स्वामी’ इसे κύριος के सामान्य अनुवाद से अलग रखते हुए πάντων की व्यापकता भी व्यक्त करता है।
- source_word: ἠγάπησεν
  choice: प्रेम किया
  rationale: सरल भूतकाल यूनानी एओरिस्ट का स्वाभाविक हिंदी प्रतिरूप है।
- source_word: αὐτήν
  choice: उससे
  rationale: बुद्धि को स्त्री रूप में व्यक्त करने वाली साहित्यिक प्रस्तुति को बनाए रखा गया है।
theological_decisions:
- issue: बुद्धि का स्त्री-व्यक्तिरूप
  choice: ‘उसकी’ और ‘उससे’ द्वारा स्त्री-व्यक्तिरूप बनाए रखा गया।
  alternative: बुद्धि को निर्जीव गुण मानकर ‘उसकी/उससे’ के स्थान पर निरपेक्ष भाषा प्रयोग करना।
  rationale: यूनानी पाठ स्त्रीलिंग रूपों द्वारा बुद्धि का व्यक्तिकरण करता है। इसे बनाए रखने से पाठ की साहित्यिक और धर्मवैचारिक तनावपूर्ण खुली अर्थवत्ता सुरक्षित रहती है, बिना किसी बाद की सिद्धान्तगत पहचान को आरोपित किए।
- issue: δεσπότης का अनुवाद
  choice: ‘स्वामी’
  alternative: ‘प्रभु’ या ‘सर्वाधिपति’
  rationale: मूल में δεσπότης है, κύριος नहीं। ‘स्वामी’ इस शब्दगत भेद को सुरक्षित रखता है।
- issue: δοξάζει की वाक्यगत दिशा
  choice: ‘उसकी कुलीनता गौरवान्वित होती है’
  alternative: ‘वह अपनी कुलीनता को गौरव देती है’
  rationale: यूनानी को सक्रिय रूप में पढ़ना संभव है, पर हिंदी में वह रचना अप्राकृतिक लगती है। मुख्य पाठ परिणाम को सहज रूप में व्यक्त करता है और पादटिप्पणी अधिक शाब्दिक विकल्प बताती है।
