  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘जीवन-संगति’ सामान्य ‘संगति’ से अधिक स्पष्ट रूप से साझा जीवन का भाव देता है; ‘कुलीनता’ के संभावित जन्मगत और चारित्रिक दोनों अर्थ पादटिप्पणी के विकल्प द्वारा खुले रखे गए हैं।
