lexical_decisions:
- source_word: διοικήσω
  choice: शासन करूँगा
  rationale: यह διοικέω के भविष्यत् सक्रिय रूप का स्वाभाविक राजनीतिक अर्थ व्यक्त करता है; ‘प्रशासन चलाऊँगा’ की अपेक्षा अधिक सहज है और ‘राज करूँगा’ की अपेक्षा शासन-संचालन का भाव बेहतर रखता है।
- source_word: λαούς
  choice: जन-समुदायों
  rationale: बहुवचन συλλेक्टिव अर्थ को बनाए रखता है और अगले खंड के ἔθνη (‘राष्ट्र’) से शब्दगत भेद स्पष्ट करता है।
- source_word: ἔθνη
  choice: राष्ट्र
  rationale: इस राजनीतिक संदर्भ में ‘राष्ट्र’ स्वाभाविक है और अनावश्यक जातीय-धार्मिक अर्थ जोड़ने से बचता है।
- source_word: ὑποταγήσεταί
  choice: अधीन हो जाएँगे
  rationale: भविष्यत् मध्य/कर्मवाच्य रूप की अधीनता को व्यक्त करता है, पर यह अनावश्यक रूप से तय नहीं करता कि अधीनता स्वेच्छा से होगी या बलपूर्वक कराई जाएगी।
- source_word: μοι
  choice: मेरे
  rationale: ‘मेरे अधीन’ संबंधवाचक दत्तिव का स्वाभाविक हिन्दी रूप है।
