  rationale: τέρψις के आनन्द और ἀγαθή के नैतिक सकारात्मक मूल्य, दोनों को स्पष्ट रखता है।
- source_word: πόνοις χειρῶν αὐτῆς
  choice: उसके हाथों के परिश्रम
  rationale: मूल के ठोस हस्त-श्रम के बिंब को बनाए रखता है, यद्यपि यह बुद्धि की फलदायी गतिविधि का रूपक है।
- source_word: πλοῦτος ἀνεκλιπής
  choice: कभी न चुकनेवाला धन
  rationale: ἀνεκλιπής की न समाप्त होने वाली प्रकृति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: उसके साथ रहकर अभ्यास करने और मेल-जोल रखने में
  rationale: दोनों संज्ञाओं में निहित साझा अनुशासन तथा निकट संगति/व्यवहार को एक ही अस्पष्ट सामान्य शब्द में समेटने के बजाय संयुक्त रूप से व्यक्त करता है।
- source_word: φρόνησις
  choice: विवेक
  rationale: व्यावहारिक समझ और समझ-बूझ का भाव देता है तथा व्यक्तिरूप ‘बुद्धि’ के साथ शब्दगत पुनरुक्ति से बचता है।
- source_word: εὔκλεια
  choice: सुयश
  rationale: यहाँ सार्वजनिक सम्मान अथवा अच्छी ख्याति का अर्थ है; ‘सुयश’ इस अर्थ को ‘आदर’ से अधिक सटीकता से व्यक्त करता है।
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: उसकी बातों में सहभागी होने से
  rationale: κοινωνία की सहभागिता और λόγοι की बातों/वचनों की विषयवस्तु, दोनों को सुरक्षित रखता है।
- source_word: περιῆλθον ζητῶν
  choice: मैं उसकी खोज में निकला
  rationale: घूमते हुए सक्रिय रूप से खोजने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: कि उसे अपने लिए पा सकूँ
  rationale: व्यक्तिरूप बुद्धि को स्वयं के लिए ग्रहण/प्राप्त करने का भाव रखता है, पर इसे स्पष्टतः विवाह या केवल आंतरिक आत्मसात के रूप में निर्धारित नहीं करता।
theological_decisions:
- issue: बुद्धि का स्त्री-व्यक्तित्व और उससे संबंध
  choice: ‘उसकी/उसे’ के द्वारा स्त्रीलिंग व्यक्तिरूपता को बनाए रखा गया है।
  alternative: बुद्धि को केवल अमूर्त गुण मानकर सर्वनामों से बचना।
  rationale: यूनानी पाठ लगातार स्त्रीलिंग सर्वनाम और संबंधपरक भाषा का प्रयोग करता है।
- issue: उसे अपने लिए पाने का आशय
  choice: व्यक्तिगत प्राप्ति का भाव रखा गया, पर वैवाहिक अर्थ स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: इसे सीधे ‘पत्नी बनाना’ अथवा केवल ‘अपने भीतर ग्रहण करना’ कहना।
  rationale: λάμβανω और εἰς ἐμαυτόν व्यक्तिगत ग्रहण को सूचित करते हैं, पर इस पद में कोई एक विशिष्ट व्याख्या अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘बुद्धि’ की स्त्रीलिंग व्यक्तिरूपता सुरक्षित है। पद की सूचीबद्ध लय को बनाए रखते हुए कठिन यूनानी संयुक्त पदबंध को मुख्य पाठ और पादटिप्पणी में पर्याप्त रूप से खोला गया है।
