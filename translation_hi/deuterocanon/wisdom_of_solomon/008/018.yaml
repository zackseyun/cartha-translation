  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: hi
  text: और उसकी मित्रता में उत्तम आनन्द है, उसके हाथों के परिश्रम में कभी न चुकनेवाला धन, उसके साथ साझा अभ्यास और संगति में विवेक[a], और उसकी बातों में सहभागी होने से सुयश[b]। मैं उसकी खोज में निकला कि उसे अपने लिए पा सकूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध में उसके साथ साझा अभ्यास और निकट संगति अथवा बातचीत—दोनों के भाव सघन रूप में जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: या “अच्छी प्रतिष्ठा” अथवा “सम्मान।”
    reason: lexical_alternative
  - marker: c
    text: या “उसे अपने लिए प्राप्त कर सकूँ।” यह अभिव्यक्ति बुद्धि को व्यक्तिगत रूप से अपना बनाने का भाव रखती है, पर यहाँ इसे स्पष्टतः वैवाहिक नहीं बनाती।
    reason: lexical_alternative
