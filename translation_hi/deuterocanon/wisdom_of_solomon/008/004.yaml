  rationale: यह दुर्लभ स्त्रीलिंग संज्ञा चुनने या अपने लिए ग्रहण करने के भाव से बनी है। ‘चुनने वाली’ मूल की असामान्य संक्षिप्तता और संभावित अर्थगत तनाव को बनाए रखता है।
