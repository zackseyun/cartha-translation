  rationale: यह व्यापक शब्द परमेश्वर के किए हुए कामों, कृत्यों या कार्य-व्यापार को समेटता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताने वाला संयोजक है; आधुनिक हिन्दी में ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्पष्ट रखता है।
