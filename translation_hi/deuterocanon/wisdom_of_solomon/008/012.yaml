  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: hi
  text: जब मैं चुप रहूँगा, तब वे मेरी प्रतीक्षा करेंगे; जब मैं बोलूँगा, तब वे ध्यान से सुनेंगे; और जब मैं और अधिक बोलूँगा, तब वे अपने मुँह पर हाथ रख लेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुँह पर हाथ रखना मौन संयम या वक्ता के सामने आदरपूर्ण विस्मय प्रकट करने वाला संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: जब मैं चुप रहूँगा
  rationale: वर्तमान कृदंत का प्रयोग कालवाचक है। भविष्यकालीन मुख्य क्रियाओं के संदर्भ में यह स्वाभाविक हिन्दी में ‘जब मैं चुप रहूँगा’ बनता है।
- source_word: περιμενοῦσιν
  choice: वे मेरी प्रतीक्षा करेंगे
  rationale: क्रिया का मूल अर्थ किसी की प्रतीक्षा करना है; यह सम्मानपूर्वक बोलने की प्रतीक्षा करने के प्रसंग में सहज और स्पष्ट है।
- source_word: φθεγγομένῳ προσέξουσιν
  choice: जब मैं बोलूँगा, तब वे ध्यान से सुनेंगे
  rationale: προσέχω यहाँ वक्ता की ओर ध्यान लगाने, विशेषतः उसकी बात सुनने, का भाव देता है। ‘ध्यान से सुनेंगे’ हिन्दी में इस प्रसंग को स्पष्ट करता है।
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: जब मैं अधिक देर तक बोलूँगा
  rationale: ἐπὶ πλεῖον बोलना आगे जारी रखने अथवा अधिक विस्तार से बोलने को सूचित करता है। ‘अधिक देर तक’ इसकी अवधि और निरंतरता दोनों को स्वाभाविक रूप से व्यक्त करता है, बिना इसे शर्त बनाने के।
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: वे अपने मुँह पर हाथ रख लेंगे
  rationale: यह यूनानी अभिव्यक्ति और उसके सांस्कृतिक संकेत, अर्थात मौन संयम या आदरपूर्ण विस्मय, दोनों को सुरक्षित रखने वाला स्वाभाविक हिन्दी रूप है।
