  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: hi
  text: 'यह समझकर कि परमेश्वर के दिए बिना मैं आत्म-संयमी नहीं हो सकता, और यह भी समझदारी की बात थी कि जानूँ कि यह उपहार[a] किसकी ओर से है, मैंने प्रभु से प्रार्थना की और उससे विनती की, और अपने पूरे हृदय से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुग्रह” या “कृपा।” यूनानी χάρις का अर्थ “उपहार,” “अनुग्रह,” “कृपा” या “अनुकूलता” हो सकता है; यहाँ आत्म-संयम के परमेश्वर से प्राप्त होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: जब मैंने जान लिया
  rationale: अओरिस्ट कृदंत वक्ता की पहचान या बोध को व्यक्त करता है; हिन्दी में कालगत संबंध स्पष्ट करने के लिए यह स्वाभाविक है।
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατής
  choice: मैं आत्म-संयमी नहीं हो सकता
