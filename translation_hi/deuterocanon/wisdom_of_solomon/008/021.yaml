- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: यह जानना कि यह किसका अनुग्रह है
  rationale: τίνος के स्रोत-संबंधी प्रश्न को ‘किसका’ बनाए रखता है। χάρις के ‘अनुग्रह/कृपा/उपहार’ अर्थ-क्षेत्र को मुख्य पाठ में ‘अनुग्रह’ और पादटिप्पणी में विकल्प द्वारा सुरक्षित रखा गया है।
- source_word: ἐνέτυχον τῷ κυρίῳ
