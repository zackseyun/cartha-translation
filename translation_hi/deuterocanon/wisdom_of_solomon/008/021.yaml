  choice: अनुग्रह
  alternative: उपहार; कृपा
  rationale: यूनानी शब्द स्रोत की उदार कृपा और उससे प्राप्त वरदान दोनों को व्यक्त कर सकता है। ‘अनुग्रह’ मूल शब्द की व्यापकता बनाए रखता है, जबकि पादटिप्पणी बताती है कि यहाँ विशेषतः आत्म-संयम के परमेश्वर-प्रदत्त होने का भाव है; इसे बाद की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली तक सीमित नहीं किया गया।
