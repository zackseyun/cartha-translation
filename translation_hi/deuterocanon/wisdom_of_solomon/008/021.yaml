- source_word: ἐὰν μὴ ὁ θεὸς δῷ
  choice: जब तक परमेश्वर यह न दे
  rationale: यह खंड आत्म-संयम के लिए परमेश्वर के देने को आवश्यक शर्त ठहराता है; ‘यह’ प्रसंग से निहित कर्म को स्पष्ट करता है।
- source_word: φρονήσεως
