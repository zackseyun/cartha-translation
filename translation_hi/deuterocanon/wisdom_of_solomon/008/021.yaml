  rationale: प्रार्थना-संदर्भ में ἐντυγχάνω निवेदन या प्रार्थनापूर्वक समीप आने को व्यक्त करता है; हिन्दी में यह स्वाभाविक है।
- source_word: ἐδεήθην αὐτοῦ
  choice: उससे विनती की
  rationale: δέομαι गंभीर और earnest याचना दर्शाता है; ‘विनती’ उसकी तीव्रता और प्रार्थनामय भाव को बनाए रखती है।
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: अपने पूरे हृदय से
  rationale: पूर्ण निष्ठा और सच्चाई व्यक्त करने वाला स्वाभाविक बाइबलीय हिन्दी मुहावरा।
