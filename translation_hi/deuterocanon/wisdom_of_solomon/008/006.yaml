lexical_decisions:
- source_word: φρόνησις
  choice: समझ
  rationale: यहाँ शब्द व्यावहारिक बुद्धि और सूझ-बूझ का बोध कराता है तथा प्रसंग के σοφία से अलग रखा जाना चाहिए। ‘समझ’ आधुनिक और सहज है; इसका स्त्रीलिंग प्रयोग यूनानी के स्त्रीलिंग व्यक्तिकरण को भी बनाए रखता है।
- source_word: ἐργάζεται
  choice: काम करती है
  rationale: क्रिया सक्रिय कार्य, प्रभावशीलता या फल उत्पन्न करने का भाव रख सकती है। ‘काम करती है’ मूल की व्यापकता और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: τῶν ὄντων
  choice: जो कुछ विद्यमान है, उसमें
  rationale: यह ‘जो वस्तुएँ/सत्ताएँ हैं’ की व्यापक अभिव्यक्ति है। यह अनुवाद अस्तित्वगत विस्तार को रखते हुए अत्यधिक दार्शनिक भाषा से बचता है।
- source_word: μᾶλλον
  choice: बढ़कर
  rationale: तुलनात्मक प्रश्न में यह हिन्दी की स्वाभाविक अभिव्यक्ति है।
- source_word: τεχνῖτις
  choice: कुशल कारीगर
  rationale: यह स्त्रीलिंग संज्ञा किसी निपुण शिल्पी या कारीगर को दर्शाती है। हिन्दी में ‘कारीगर’ सामान्यतः दोनों लिंगों के लिए प्रयुक्त हो सकता है; ‘करती है’ और ‘उससे’ स्त्रीलिंग व्यक्तिकरण को स्पष्ट रखते हैं।
theological_decisions:
- issue: φρόνησις का स्त्रीलिंग व्यक्तिकरण
  choice: ‘समझ’ के साथ स्त्रीलिंग क्रिया ‘करती है’ रखी गई।
  alternative: ‘विवेक’ या ‘बोध’ के साथ पुल्लिंग अथवा निर्जीव रूप लेना।
  rationale: यूनानी में αὐτῆς और τεχνῖτις स्पष्टतः स्त्रीलिंग हैं। हिन्दी में सहज रहते हुए इस व्यक्तिकरण को बनाए रखना मूल के अधिक निकट है।
- issue: φρόνησις और σοφία का संबंध
  choice: φρόνησις का अनुवाद ‘समझ’ किया गया, ‘बुद्धि’ नहीं।
  alternative: इसे प्रसंग की σοφία के समान मानकर ‘बुद्धि’ कहना।
  rationale: इस पद में प्रयुक्त यूनानी शब्द σοφία नहीं है। अलग शब्दावली रखने से मूल का भेद और उसकी संभावित धार्मिक अर्थ-तनाव सुरक्षित रहता है।
