  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: hi
  text: मैंने अपनी युवावस्था से ही उससे प्रेम किया और उसे खोजा; मैंने उसे अपनी दुल्हन बनाना चाहा,[a] और मैं उसकी सुंदरता का प्रेमी हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप में: “मैंने उसे अपने लिए दुल्हन के रूप में ले आने की इच्छा की।”'
    reason: विवाह-संबंधी यूनानी मुहावरे और आत्मवाची ‘अपने लिए’ को अधिक शाब्दिक रूप में दिखाने के लिए।
lexical_decisions:
- source_word: Ταύτην
  choice: उससे / उसे
  rationale: यह निकटवर्ती संदर्भ में स्त्री के रूप में व्यक्त की गई बुद्धि की ओर संकेत करता है; हिन्दी में स्त्रीलिंग सर्वनाम इस मानवीकरण को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐφίλησα
  choice: प्रेम किया
  rationale: यहाँ अर्थ स्नेहपूर्ण प्रेम है, न कि शाब्दिक चुंबन; ‘प्रेम किया’ स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐξεζήτησα
  choice: खोजता रहा
  rationale: संयुक्त क्रिया गंभीर और सतत खोज का भाव देती है; ‘खोजता रहा’ आरंभिक कालबिंदु से जारी प्रयास को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκ νεότητός μου
  choice: अपनी जवानी से ही
  rationale: यह युवावस्था से आरंभ होने वाले समय को बताता है; ‘से ही’ उस आरंभिक बिंदु पर बल बनाए रखता है।
- source_word: ἐζήτησα
  choice: मैंने चाहा
  rationale: मूल क्रिया का सामान्य अर्थ ‘खोजना/चाहना’ है। विवाह-संबंधी पूरक के साथ हिन्दी में ‘चाहा’ स्वाभाविक है, यद्यपि इससे यूनानी की पुनरावृत्ति कुछ कम प्रत्यक्ष होती है।
- source_word: νύμφην ἀγαγέσθαι ἐμαυτῷ
  choice: उसे अपनी दुल्हन बनाऊँ
  rationale: शाब्दिक रूप से अपने लिए दुल्हन के रूप में ले आने का विवाह-संबंधी मुहावरा है; चुना हुआ रूप वैवाहिक आशय और आत्मवाची तत्व दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐραστὴς
  choice: प्रेमी
  rationale: यह प्रबल आकर्षण या अनुराग रखने वाले व्यक्ति को दर्शाता है; ‘प्रेमी’ वैवाहिक और अनुरागपूर्ण बिंब की तीव्रता बनाए रखता है।
- source_word: τοῦ κάλλους αὐτῆς
  choice: उसकी सुंदरता का
  rationale: κάλλος का सीधा अर्थ सुंदरता है; यह स्त्रीरूप में व्यक्त बुद्धि के प्रणय-बिंब के अनुकूल है।
theological_decisions:
- issue: बुद्धि का स्त्रीरूप मानवीकरण और वैवाहिक भाषा
  choice: स्त्रीलिंग सर्वनाम, दुल्हन और प्रेमी की भाषा को स्पष्ट रूप से बनाए रखना
  alternative: इसे अमूर्त रूप में ‘बुद्धि को महत्त्व देना’ या ‘उसकी श्रेष्ठता के प्रति समर्पित होना’ कहना
  rationale: यूनानी पाठ बुद्धि को स्पष्टतः स्त्री के रूप में प्रस्तुत करके प्रणय और विवाह की भाषा प्रयोग करता है। इसे बनाए रखना काव्यात्मक धर्मवैचारिक तनाव का सम्मान करता है और पाठ को अमूर्त व्याख्या में समतल नहीं करता।
