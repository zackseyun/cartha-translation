lexical_decisions:
- source_word: ὀξεῖς
  choice: तीक्ष्ण
  rationale: यूनानी विशेषण का मूल अर्थ ‘तेज़/तीक्ष्ण’ है; न्याय-विचार के संदर्भ में ‘तीक्ष्ण’ सूझ-बूझ और विवेक की धार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὑρεθήσομαι
  choice: सिद्ध होऊँगा
  rationale: भविष्यत् कर्मवाच्य रूप का अर्थ यहाँ किसी गुण से युक्त पाया या प्रमाणित होना है। ‘सिद्ध होऊँगा’ हिंदी में स्वाभाविक है और पहचानने वाले कर्ता को अनिर्दिष्ट रखता है।
- source_word: ἐν κρίσει
  choice: न्याय-विचार में
  rationale: κρίσις न्याय, निर्णय अथवा न्यायिक विचार को सूचित कर सकता है। ‘न्याय-विचार’ इस व्यापक न्यायिक और विवेचनात्मक अर्थ को बनाए रखता है, बिना इसे केवल अदालत तक सीमित किए।
- source_word: ἐν ὄψει
  choice: दृष्टि में
  rationale: यह पदबंध शाब्दिक रूप से किसी की दृष्टि या सामने होने को व्यक्त करता है; ‘दृष्टि में’ सार्वजनिक मान्यता की छाया भी बनाए रखता है।
- source_word: δυναστῶν
  choice: शासकों
  rationale: δυνάστης सत्ता रखने वाले व्यक्ति को दर्शाता है। ‘शासक’ आधुनिक, स्पष्ट और राजनीतिक-सार्वजनिक संदर्भ के अनुकूल है।
- source_word: θαυμασθήσομαι
  choice: प्रशंसा पाऊँगा
  rationale: भविष्यत् कर्मवाच्य रूप विस्मय या आदर का पात्र बनने को दर्शाता है। ‘प्रशंसा पाऊँगा’ सकारात्मक मूल्यांकन को सहज हिंदी में व्यक्त करता है।
