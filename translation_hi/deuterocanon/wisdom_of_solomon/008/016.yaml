  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/016.yaml
  text: When I go into my house[a], I will find rest beside her; for her company has no bitterness, nor does living with her have pain, but gladness and joy.
translation:
  language: hi
  text: अपने घर में प्रवेश करके मैं उसके साथ विश्राम करूँगा[a]; क्योंकि उसकी संगति में कोई कड़वाहट नहीं, और उसके साथ जीवन बिताने में कोई पीड़ा नहीं, बल्कि हर्ष और आनन्द है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके पास विश्राम करूँगा।” यूनानी क्रिया बुद्धि की निकट संगति में विश्राम करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: प्रवेश करके
  rationale: कालवाचक एओरिस्ट कृदन्त को सहज हिन्दी में रखते हुए यह मुख्य क्रिया से पहले घर में प्रवेश करने की परिस्थिति व्यक्त करता है।
- source_word: προσαναπαύσομαι
  choice: उसके साथ विश्राम करूँगा
  rationale: भविष्यत् मध्यम रूप निकट संगति में विश्राम करने का भाव देता है। ‘उसके साथ’ मूल में निहित साहचर्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συναναστροφή
  choice: संगति
  rationale: यह सामाजिक साहचर्य और साथ रहने-बैठने को दर्शाता है; ‘संगति’ आधुनिक, संक्षिप्त और सन्दर्भानुकूल है।
- source_word: πικρίαν
  choice: कड़वाहट
  rationale: मूल शब्द की अप्रियता और भावात्मक तीक्ष्णता, दोनों को बनाए रखता है।
- source_word: συμβίωσις
  choice: उसके साथ जीवन बिताना
  rationale: साझे जीवन अथवा साथ रहने के अर्थ को बिना तकनीकी या अनपेक्षित वैवाहिक संकेत के सहज रूप में व्यक्त करता है।
- source_word: ὀδύνην
  choice: पीड़ा
  rationale: शारीरिक अथवा भावात्मक वेदना के व्यापक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: εὐφροσύνην
  choice: हर्ष
  rationale: प्रसन्न उल्लास का भाव देता है और अगले शब्द ‘आनन्द’ से अलग रहते हुए यूनानी की युग्म अभिव्यक्ति बचाता है।
- source_word: χαράν
  choice: आनन्द
  rationale: χαρά का प्रचलित और गरिमापूर्ण हिन्दी प्रतिरूप है; इसे ‘हर्ष’ के साथ अलग रखा गया है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: स्त्रीलिंग सर्वनाम ‘उसके’ बनाए रखना
  alternative: हर बार ‘बुद्धि’ दोहराना या नपुंसक/निर्जीव रूप में प्रस्तुत करना
  rationale: यूनानी αὐτῇ और αὐτῆς स्त्रीलिंग हैं और बुद्धि को स्त्री-रूप में व्यक्त करते हैं। स्त्रीलिंग संकेत बनाए रखने से मूल की साहित्यिक और धर्मवैचारिक प्रस्तुति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘हर्ष और आनन्द’ द्वारा मूल की दोहरी उल्लास-अभिव्यक्ति तथा स्त्रीलिंग सर्वनामों द्वारा बुद्धि का मानवीकरण सुरक्षित रखा गया है।
