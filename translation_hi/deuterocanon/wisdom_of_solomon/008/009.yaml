translation:
  language: hi
  text: इसलिए मैंने निश्चय किया कि उसे अपने साथ रहने के लिए ले आऊँ[a], क्योंकि मैं जानता था कि वह भली बातों में मेरी सलाहकार होगी और चिंताओं तथा दुःख में मुझे ढाढ़स देनेवाली होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे विवाह करूँ” अथवा “उसे पत्नी बनाकर ले आऊँ”; यूनानी में अधिक शाब्दिक अर्थ है, “उसे साथ रहने के लिए ले आऊँ।” यहाँ बुद्धि को स्त्री के रूप में प्रस्तुत किया गया है, पर इस पद में विवाह का स्पष्ट शब्द नहीं है।
    reason: alternative_reading
  - marker: b
