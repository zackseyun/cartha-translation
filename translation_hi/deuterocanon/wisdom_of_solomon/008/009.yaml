- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: वह भली बातों में मेरी सलाहकार होगी
  rationale: σύμβουλος को ‘सलाहकार’ और व्यापक ἀγαθῶν को ‘भली बातें’ कहा गया है, ताकि इसे केवल नैतिक भलाई या व्यावहारिक लाभ तक सीमित न किया जाए।
- source_word: παραίνεσις
  choice: मेरा प्रोत्साहन
  rationale: शब्द में प्रोत्साहन, समझाइश और सांत्वना की अर्थ-छायाएँ हो सकती हैं। चिंताओं और दुःख के संदर्भ में ‘प्रोत्साहन’ सहायक भाव को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: φροντίδων καὶ λύπης
  choice: चिंताओं तथा दुःख में
  rationale: φροντίδων मानसिक बोझ और चिंताओं को, तथा λύπης शोक या दुःख को व्यक्त करता है; हिन्दी पदबंध दोनों को स्पष्ट और संक्षिप्त रखता है।
