    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: इन बातों पर ... विचार करके
  rationale: मध्यवाच्य कृदंत आंतरिक सोच-विचार को व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उसी मननशील भाव को रखता है।
- source_word: ἐν ἐμαυτῷ
  choice: अपने भीतर
  rationale: यह वाक्यांश आंतरिक विचार-विमर्श को सूचित करता है; ‘अपने भीतर’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: φροντίσας ἐν καρδίᾳ μου
  choice: और अपने हृदय में यह मनन करके
  rationale: φροντίζω सावधानी से सोचने या मनन करने का अर्थ देता है; ‘हृदय में’ यूनानी की मानवशास्त्रीय छवि को बनाए रखता है।
- source_word: ὅτι ἐστιν ἀθανασία
  choice: कि ... अमरता है
  rationale: ἀθανασία का सीधा अर्थ ‘अमरता’ है और अस्तित्वसूचक ἐστιν को ‘है’ से व्यक्त किया गया है।
- source_word: ἐν συγγενείᾳ σοφίας
  choice: बुद्धि के साथ आत्मीय संबंध में
  rationale: συγγένεια निकट संबंध, नातेदारी या आत्मीयता को दर्शाता है। ‘आत्मीय संबंध’ पारिवारिक-संबंधपरक भाव को हिंदी में स्वाभाविक रखता है और कारण या रहस्यात्मक एकता को स्पष्ट रूप से आरोपित नहीं करता।
theological_decisions:
- issue: ἐν συγγενείᾳ σοφίας में अमरता और बुद्धि के संबंध का स्वरूप
  choice: बुद्धि के साथ आत्मीय संबंध में अमरता है
  alternative: बुद्धि के साथ आत्मीय संबंध के द्वारा अमरता मिलती है
  rationale: यूनानी पाठ ἐν और संबंधसूचक संज्ञा के साथ अस्तित्व का कथन करता है, स्पष्ट कारणात्मक सूत्र नहीं। चुना हुआ अनुवाद बुद्धि और अमरता की कड़ी को रखता है, पर उसके तंत्र या तत्वमीमांसा को अनावश्यक रूप से निश्चित नहीं करता।
