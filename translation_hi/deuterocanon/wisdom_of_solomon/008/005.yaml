    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: धन
  rationale: यह शब्द भौतिक समृद्धि या संपदा को दर्शाता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक है और आगे के तुलनात्मक रूपक से जुड़ता है।
- source_word: ἐπιθυμητὸν κτῆμα
  choice: चाहने योग्य संपत्ति
  rationale: विशेषण और संज्ञा, दोनों का अर्थ स्पष्ट रखते हुए यह अभिव्यक्ति किसी वांछनीय अर्जित वस्तु या अधिकार की धारणा व्यक्त करती है।
- source_word: ἐν βίῳ
  choice: जीवन में
  rationale: यह यूनानी वाक्यांश मानव जीवन के भीतर धन की वांछनीयता को रखता है; इसमें अनावश्यक रूप से ‘इस जीवन’ नहीं जोड़ा गया।
- source_word: τί σοφίας πλουσιώτερον
  choice: उस बुद्धि से बढ़कर धनवान क्या है
  rationale: ‘धन’ और ‘धनवान’ के शब्द-संबंध द्वारा यूनानी πλοῦτος/πλουσιώτερον का धन-संबंधी रूपक सुरक्षित रहता है। ‘क्या’ नपुंसकलिंग τί की व्यापकता बनाए रखता है।
- source_word: σοφίας
  choice: बुद्धि
  rationale: σοφία के लिए मानक, प्रतिष्ठित और सामान्य हिन्दी पर्याय।
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: जो सब कुछ करती है
  rationale: स्त्रीलिंग संबंधवाचक उपवाक्य ‘बुद्धि’ को विशेषित करता है। ‘करती है’ ἐργάζομαι की व्यापक सक्रियता को बिना केवल सृष्टि, उत्पादन या सिद्धि तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: τὰ πάντα ἐργαζομένης में बुद्धि की गतिविधि का दायरा
  choice: जो सब कुछ करती है
  alternative: जो सब कुछ संपन्न करती है / जो सब कुछ उत्पन्न करती है
  rationale: यूनानी पद बुद्धि की सर्वव्यापी प्रभावकारी सक्रियता बताता है, पर केवल सृष्टि या उत्पादन का विशिष्ट तात्त्विक दावा अनिवार्य नहीं करता। व्यापक अनुवाद मूल की धर्मवैचारिक गंभीरता और अस्पष्टता दोनों बनाए रखता है।
