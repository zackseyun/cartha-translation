  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: hi
  text: और यदि किसी को व्यापक अनुभव की लालसा हो, तो बुद्धि प्राचीन बातों को जानती है और आनेवाली बातों का अनुमान लगा सकती है; वह कथनों के मोड़ और पहेलियों के समाधान समझती है; वह चिह्नों और अद्भुत घटनाओं को, और अवसरों तथा कालों के परिणामों को पहले से जानती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολυπειρίαν
  choice: व्यापक अनुभव
  rationale: यह शब्द अनुभव से प्राप्त विस्तृत परिचय या बहु-अनुभव को दर्शाता है। ‘व्यापक अनुभव’ इसके विस्तार को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ποθεῖ
  choice: लालसा रखता है
  rationale: यह साधारण इच्छा से अधिक प्रबल चाह व्यक्त करता है और ज्ञान-साहित्य के गरिमापूर्ण भाव के अनुकूल है।
- source_word: τὰ ἀρχαῖα
  choice: प्राचीन बातें
  rationale: यह बीते या पुराने समय की बातों को व्यापक रूप से दर्शाता है; इसे केवल सृष्टि के आरम्भ तक सीमित नहीं करता।
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: आनेवाली बातों का अनुमान लगा सकती है
  rationale: εἰκάζω संकेतों के आधार पर अनुमान या निष्कर्ष लगाने का भाव रखता है और बाद के प्रबल προγινώσκει से भेद बनाए रखता है।
- source_word: στροφὰς λόγων
  choice: कथनों के घुमावों
  rationale: यह भाषा, कथन या तर्क के पेचीदा मोड़ों को दर्शाता है। ‘घुमाव’ मूल रूपक और अर्थ की व्यापकता दोनों को रखता है।
- source_word: λύσεις αἰνιγμάτων
  choice: पहेलियों के समाधानों
  rationale: λύσεις का अर्थ खोलना या समाधान और αἰνίγματα का अर्थ पहेलियाँ है; यह अनुवाद स्पष्ट तथा निकट है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिह्नों और अद्भुत घटनाओं
  rationale: ‘चिह्न’ σημεῖα की संकेतकारी शक्ति को रखता है, जबकि ‘अद्भुत घटनाएँ’ τέρατα की असाधारण प्रकृति को सहज हिन्दी में व्यक्त करती हैं।
- source_word: προγινώσκει
  choice: पहले से जानती है
  rationale: यह प्रत्यक्षतः पहले से जानने का प्रबल भाव व्यक्त करता है और εἰκάζειν के केवल अनुमान लगाने से भिन्न रहता है।
- source_word: ἐκβάσεις
  choice: परिणामों
  rationale: यह घटनाओं या अवधियों के निष्कर्ष, फल या अंतिम परिणाम को संक्षेप में व्यक्त करता है।
- source_word: καιρῶν καὶ χρόνων
  choice: अवसरों तथा कालों
  rationale: ‘अवसर’ καιρός के उपयुक्त या नियत समय के भाव को और ‘काल’ χρόνος के सामान्य समय या अवधि के भाव को अलग-अलग बनाए रखते हैं।
- source_word: οἶδεν / ἐπίσταται / προγινώσκει
  choice: जानती है / समझती है / पहले से जानती है
  rationale: तीनों ज्ञान-संबंधी क्रियाओं की अलग-अलग शक्ति को हिन्दी में विविध क्रियाओं द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: बुद्धि का स्त्री-व्यक्तित्व के रूप में चित्रण
  choice: स्त्रीलिंग सर्वनाम ‘वह’ और स्त्रीलिंग क्रियाएँ रखी गईं।
  alternative: हर बार ‘बुद्धि’ दोहराना या उसे निर्जीव भाववाचक संज्ञा की तरह प्रस्तुत करना।
  rationale: निकटवर्ती प्रसंग बुद्धि को सक्रिय स्त्री-व्यक्ति के रूप में चित्रित करता है। स्त्रीलिंग रूप साहित्यिक व्यक्तिकरण को सुरक्षित रखता है, बिना उसके तत्त्वमीमांसात्मक स्वरूप पर अतिरिक्त दावा किए।
- issue: εἰκάζειν की शक्ति
  choice: ‘अनुमान लगा सकती है’
  alternative: ‘भविष्य को पहले से देख सकती है’ या ‘भविष्यवाणी कर सकती है।’
  rationale: मूल क्रिया अनुमान या उपलब्ध संकेतों से निष्कर्ष का भाव रखती है। बाद में प्रयुक्त προγινώσκει अधिक प्रबल पूर्वज्ञान व्यक्त करता है; अतः दोनों का भेद सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य की सूचीबद्ध लय और ज्ञान-साहित्य का उन्नत स्वर सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में अर्थगत भेद स्वाभाविक रूप से व्यक्त हो जाते हैं।
