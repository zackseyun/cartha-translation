  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
translation:
  language: hi
  text: और यदि कोई धार्मिकता[a] से प्रेम करता है, तो उसके परिश्रम सद्गुण हैं; क्योंकि वह[b] संयम और विवेक, धार्मिकता और साहस सिखाती है—मनुष्यों के जीवन में इनसे अधिक उपयोगी कुछ भी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’। यूनानी शब्द नैतिक धार्मिकता और न्याय, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'मूल यूनानी में ‘धार्मिकता’ का स्त्रीलिंग मानवीकरण है: ‘उसके परिश्रम ... वह सिखाती है।’'
    reason: cultural_note
lexical_decisions:
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह शब्द नैतिक खराई और न्याय, दोनों अर्थ रख सकता है। यहाँ सद्गुणों की सूची के संदर्भ में व्यापक नैतिक अर्थ वाला ‘धार्मिकता’ मुख्य पाठ में उपयुक्त है; ‘न्याय’ को पाद-टिप्पणी में रखा गया है।
- source_word: οἱ πόνοι ταύτης
  choice: उसके परिश्रम
  rationale: मूल यूनानी में ‘उसके श्रम/परिश्रम’ है। इसे परिणाम या ‘फल’ में बदलने के बजाय मूल रूपक और धार्मिकता के स्त्रीलिंग मानवीकरण को बनाए रखा गया है।
- source_word: ἀρεταί
  choice: सद्गुण
  rationale: हेलेनवादी नैतिक संदर्भ में यह नैतिक गुणों या उत्कृष्टताओं को सूचित करता है; अगले पदांश में ऐसे गुणों की सूची भी दी गई है।
- source_word: σωφροσύνην
  choice: संयम
  rationale: यह विवेकपूर्ण आत्म-संयम और मर्यादा का बोध कराता है; ‘संयम’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: φρόνησιν
  choice: विवेक
  rationale: यह व्यवहारिक बुद्धि और समझदारी का गुण है; हिन्दी में ‘विवेक’ इस सद्गुण को सहजता से व्यक्त करता है।
- source_word: ἀνδρείαν
  choice: साहस
  rationale: यह धैर्यपूर्ण वीरता या साहस का सद्गुण है। ‘साहस’ अर्थ को स्पष्ट रखता है और अनावश्यक पुरुष-विशिष्ट अर्थ से बचता है।
- source_word: χρησιμώτερον
  choice: अधिक उपयोगी
  rationale: यूनानी तुलनात्मक विशेषण का सीधा और स्वाभाविक अनुवाद है।
- source_word: ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: यह सभी मानवों के लिए सामान्य कथन है; ‘मनुष्यों’ से मूल का समावेशी अर्थ बना रहता है।
theological_decisions:
- issue: धार्मिकता का स्त्रीलिंग मानवीकरण
  choice: ‘उसके’ और ‘वह ... सिखाती है’ के द्वारा स्त्रीलिंग मानवीकरण बनाए रखा गया
  alternative: इसे निर्जीव भाववाचक संज्ञा मानकर वाक्य को पुनर्गठित करना
  rationale: यूनानी में δικαιοσύνη स्त्रीलिंग है और आगे के रूप उसे एक शिक्षिका के रूप में प्रस्तुत करते हैं। हिन्दी में ‘धार्मिकता’ भी स्त्रीलिंग होने से यह साहित्यिक रूप स्वाभाविक ढंग से सुरक्षित रहता है, बिना कोई अतिरिक्त सिद्धान्त स्थापित किए।
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ सद्गुणों के व्यापक नैतिक संदर्भ के कारण ‘धार्मिकता’ मुख्य पाठ में चुना गया है, जबकि ‘न्याय’ की वास्तविक वैकल्पिक संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसके परिश्रम सद्गुण हैं’ हिन्दी में कुछ असामान्य होते हुए भी मूल यूनानी के संक्षिप्त रूपक को बिना ‘फल’ जैसे अतिरिक्त अर्थ के सुरक्षित रखता है।
