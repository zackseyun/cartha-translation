- source_word: ἀναλώσας
  choice: खपा देने के बाद
  rationale: क्रिया उपलब्ध सामग्री को खर्च कर देने या पूरी तरह उपयोग में ले आने का भाव देती है। ‘खपा देना’ इस व्यावहारिक अर्थ को संक्षेप में रखता है।
- source_word: ἐνεπλήσθη
  choice: तृप्त हो गया
  rationale: यूनानी का शाब्दिक भाव ‘भर गया’ है, पर भोजन के प्रसंग में हिन्दी का स्वाभाविक अर्थ ‘तृप्त हो गया’ है।
- source_word: τὰ δὲ
  choice: पर
  rationale: δέ पिछले कथन से संक्रमण अथवा हल्का विरोध दिखाता है; ‘पर’ इस संबंध को संक्षेप में व्यक्त करता है।
