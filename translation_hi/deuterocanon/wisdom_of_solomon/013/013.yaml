  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। मूल की लंबी वाक्य-रचना को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि अंतिम अल्पविराम रखा गया है क्योंकि पद अगले वचन में जारी रहता है। व्यंग्यपूर्ण विरोधाभास को सहज बनाने के बजाय सुरक्षित रखा गया है।
