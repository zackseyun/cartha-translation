theological_decisions:
- issue: εἰκόνι ἀνθρώπου में लिंगयुक्त मानवरूपी संदर्भ
  choice: एक पुरुष की प्रतिमा
  alternative: एक मनुष्य की आकृति
  rationale: ἀνθρώπου रूपतः पुल्लिंग एकवचन है। संदर्भ किसी पुरुषाकार मूर्ति की अनुमति देता है, इसलिए लिंग को सामान्यीकृत किए बिना सुरक्षित रखा गया है।
- issue: अवकाश में मूर्ति-निर्माण पर व्यंग्यपूर्ण कथन
  choice: अपने निकम्मेपन की लगन से... अपने खाली समय की कुशलता से
  alternative: अपने खाली समय में बड़े ध्यान और कुशलता से
  rationale: सरल विकल्प अर्थ स्पष्ट करता, पर मूल के जानबूझकर रचे विरोधाभास और मूर्तिपूजा पर व्यंग्य को समतल कर देता। चुना हुआ पाठ उस तनाव को बचाता है।
