  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: hi
  text: पर उनमें से फेंक दिया गया वह टुकड़ा[a], जो किसी काम का नहीं था—एक टेढ़ी-मेढ़ी, गाँठों से भरी लकड़ी—लेकर उसने अपने अवकाश की लगन से उसे तराशा, और अपने खाली समय की कुशलता से उसे आकार दिया और मनुष्य की प्रतिमा के समान बनाया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात बेकार समझकर फेंक दी गई लकड़ी का टुकड़ा।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में ‘अपने अवकाश की लगन से’ और ‘अपने खाली समय की कुशलता से’ व्यंग्यपूर्ण पदबंध हैं—मूर्ति बनाने में लगाया गया सावधान पर व्यर्थ परिश्रम उपहास का विषय है।
