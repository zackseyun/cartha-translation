  text: परन्तु अपनी सम्पत्ति, विवाह-संबंधी बातों और सन्तानों के विषय में प्रार्थना करते हुए उसे उस निर्जीव वस्तु को संबोधित करने में लज्जा नहीं होती; और स्वास्थ्य के लिए वह उस दुर्बल वस्तु को पुकारता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κτημάτων
  choice: सम्पत्ति
  rationale: यह शब्द व्यक्ति की मिल्कियत और भौतिक साधनों को व्यापक रूप से दर्शाता है; ‘सम्पत्ति’ इसे भूमि तक सीमित नहीं करता।
- source_word: γάμων
  choice: विवाह-संबंधी बातों
  rationale: यूनानी बहुवचन विवाह के क्षेत्र या वैवाहिक मामलों को सूचित कर सकता है। हिन्दी में शाब्दिक ‘विवाहों’ की अपेक्षा यह अधिक स्वाभाविक है और अर्थ की व्यापकता बचाए रखता है।
- source_word: τέκνων
  choice: सन्तानों
  rationale: यह बच्चों या वंशजों के लिए सीधा और गरिमापूर्ण हिन्दी शब्द है।
- source_word: προσευχόμενος
  choice: प्रार्थना करते हुए
  rationale: कृदन्त को क्रियाविशेषणात्मक रूप में रखा गया है, जिससे प्रार्थना और निर्जीव वस्तु को सम्बोधित करने का संबंध स्पष्ट रहता है।
- source_word: οὐκ αἰσχύνεται
  choice: नहीं लजाता
  rationale: यह नैतिक लज्जा के अभाव को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ ἀψύχῳ
  choice: उस निर्जीव वस्तु
  rationale: ἀψύχῳ का आशय जीवन या प्राण से रहित होना है। ‘वस्तु’ नपुंसकलिंगी वर्णन की तिरस्कारपूर्ण शैली को बनाए रखता है और मुख्य पाठ में ‘मूर्ति’ नहीं जोड़ता।
- source_word: προσλαλῶν
  choice: से बोलने
  rationale: क्रिया किसी से बोलने या उसे सम्बोधित करने का बोध देती है; सरल हिन्दी में ‘से बोलने’ प्रार्थना-संदर्भ के साथ स्वाभाविक है।
- source_word: ὑγείας
  choice: स्वास्थ्य
  rationale: यहाँ अपेक्षित शारीरिक कुशलता या आरोग्य का सीधा अर्थ है।
- source_word: τὸ ἀσθενές
  choice: उस दुर्बल वस्तु
  rationale: नपुंसकलिंगी विशेषण संज्ञा की तरह प्रयुक्त होकर मूर्ति को अशक्त बताता है। यह रूप मूल की व्यंग्यपूर्ण समानांतरता को बनाए रखता है।
- source_word: ἐπικαλεῖται
  choice: पुकारता है
  rationale: प्रार्थना या सहायता के लिए किसी को पुकारने के अर्थ में यह सुलभ और सटीक हिन्दी है।
theological_decisions:
- issue: ἀψύχῳ और τὸ ἀσθενές में मूर्ति-विरोधी व्यंग्य
  choice: ‘निर्जीव वस्तु’ और ‘दुर्बल वस्तु’ कहकर वर्णनात्मक भाषा को बनाए रखा गया।
  alternative: ‘निर्जीव मूर्ति’ और ‘शक्तिहीन देवता’
  rationale: यूनानी पाठ यहाँ ‘मूर्ति’ या ‘देवता’ संज्ञा नहीं जोड़ता, बल्कि जीवन और सामर्थ्य के अभाव से उसका तिरस्कार करता है। अनुवाद उसी अलंकार और तनाव को सुरक्षित रखता है।
- issue: γάμων का बहुवचन
  choice: विवाह-संबंधी बातें
  alternative: विवाहों / विवाह
  rationale: बहुवचन को एक ही विवाह तक सीमित किए बिना वैवाहिक क्षेत्र के सामान्य मामलों के रूप में व्यक्त किया गया है। इससे हिन्दी स्वाभाविक रहती है और मूल का व्यापक संकेत भी नहीं मिटता।
