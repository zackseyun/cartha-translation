base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: hi
  text: क्योंकि सभी मनुष्य स्वभाव से व्यर्थ हैं, जिनमें परमेश्वर के विषय में अज्ञान था; वे दिखाई देनेवाली भली वस्तुओं से उसे नहीं जान सके जो है[a], और न उसकी कृतियों पर ध्यान देकर उस कारीगर को पहचान सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक अर्थ: “जो है”; इसे “अस्तित्ववान” भी समझा जा सकता है।'
    reason: τὸν ὄντα की जानबूझकर संक्षिप्त और संभावित धर्मवैचारिक अभिव्यक्ति स्पष्ट करना, बिना मुख्य पाठ में उसकी अस्पष्टता मिटाए।
lexical_decisions:
- source_word: Μάταιοι ... φύσει
