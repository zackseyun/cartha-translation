- source_word: θεοῦ ἀγνωσία
  choice: परमेश्वर का अज्ञान
  rationale: यह असामान्य किंतु स्पष्ट पदबंध मूल के संज्ञात्मक और गंभीर स्वर को बनाए रखता है; इसे केवल ‘परमेश्वर को नहीं जानते थे’ बनाकर हल्का नहीं किया गया।
- source_word: τὸν ὄντα
  choice: उसे ... जो है
  rationale: मूल अभिव्यक्ति का शाब्दिक और संभवतः धर्मवैचारिक महत्व सुरक्षित रखा गया है, बिना उसे किसी अधिक व्याख्यात्मक उपाधि में बदलने के।
- source_word: τεχνίτην
  choice: कारीगर
  rationale: यह सृष्ट वस्तुओं के पीछे कुशल निर्माता के रूपक को बनाए रखता है; ‘सृष्टिकर्ता’ अर्थसंगत होता, पर मूल के शिल्पकारी बिंब को कम कर देता।
theological_decisions:
- issue: τὸν ὄντα में ईश्वरीय अस्तित्व अथवा उपाधि का संकेत
  choice: जो है
  alternative: सच्चे अस्तित्ववान को / उस परम सत्ता को
  rationale: ‘जो है’ मूल की संक्षिप्तता और संभावित निर्गमन-संबंधी प्रतिध्वनि दोनों को खुला रखता है; अधिक दार्शनिक या स्पष्ट व्याख्या आरोपित नहीं की गई।
- issue: φύσει का मानव-स्वभाव संबंधी अर्थ
  choice: स्वभाव से
  alternative: अपने स्वभाव के कारण
  rationale: मूल वाक्य मनुष्यों को ‘स्वभाव से’ ऐसा कहता है, पर कारण-कार्य का विस्तृत सिद्धांत नहीं देता; इसलिए संबंध को ज्यों का त्यों रखा गया है।
