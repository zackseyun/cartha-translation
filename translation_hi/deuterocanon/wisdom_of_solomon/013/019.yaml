  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘अपने हाथों’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि यह मूल यूनानी की संरचना और व्यंग्य को सुरक्षित रखती है।
