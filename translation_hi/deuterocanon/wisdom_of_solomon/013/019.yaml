base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: hi
  text: परन्तु जीविका, काम और अपने हाथों के काम में सफलता[b] के लिए वह अपने हाथों से उस अत्यन्त निष्क्रिय वस्तु से सामर्थ्य माँगता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सबसे अधिक निर्जीव है” अथवा “जो पूरी तरह जड़ है।” यूनानी का पराकाष्ठावाचक रूप मूर्ति की कार्य करने की पूर्ण असमर्थता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपने हाथों की सफलता,” अर्थात जो काम वह करता या बनाता है उसमें सफलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  choice: जीविका
  rationale: यह शब्द साधन जुटाने या जीवन-निर्वाह का अर्थ देता है; प्रसंग में ‘जीविका’ स्वाभाविक है और इसे केवल लाभ तक सीमित नहीं करता।
- source_word: ἐργασίας
  choice: काम
  rationale: यह श्रम या कार्य का व्यापक शब्द है; आधुनिक हिन्दी में ‘काम’ स्पष्ट और सहज है।
- source_word: χειρῶν ἐπιτυχίας
  choice: अपने हाथों के काम की सफलता
  rationale: मूलतः ‘हाथों की सफलता’; हिन्दी में यह रूप अर्थ स्पष्ट करता है और मनुष्य के अपने बनाए निष्क्रिय देव-प्रतिरूप से सफलता माँगने की विडंबना बनाए रखता है।
- source_word: τὸ ἀδρανέστατον
  choice: उस वस्तु से ... जो सबसे अधिक निष्क्रिय है
  rationale: नपुंसकलिंग एकवचन उस गढ़ी हुई वस्तु की ओर संकेत करता है; अतिशयोक्तिपूर्ण रूप उसकी पूर्णतः कर्महीन अवस्था पर बल देता है।
- source_word: ταῖς χερσὶν
  choice: अपने हाथों से
  rationale: द्वितीय ‘हाथों’ का पद सम्भवतः याचक के हाथों से किए जाने वाले निवेदन की ओर संकेत करता है; इसे बनाए रखने से मूल की पुनरुक्ति और विडंबना सुरक्षित रहती है।
- source_word: εὐδράνειαν
  choice: सामर्थ्य
  rationale: यह दुर्लभ संज्ञा सक्रिय प्रभावशीलता या कार्य करने की शक्ति व्यक्त करती है और ἀδρανέστατον के साथ तीखा विरोध रचती है।
- source_word: αἰτεῖται
  choice: माँगता है
  rationale: यहाँ क्रिया किसी से कुछ माँगने का सीधा अर्थ देती है।
theological_decisions:
- issue: प्रार्थना की वस्तु के लिए प्रयुक्त नपुंसकलिंग एकवचन पद का संकेत
  choice: यह पद निष्क्रिय मूर्ति-वस्तु की ओर संकेत करता है, जिससे उपासक व्यावहारिक सफलता माँगता है।
  alternative: इसे केवल किसी निष्क्रिय देव-प्रतिमा का सामान्य उल्लेख माना जा सकता है, उसकी भौतिक जड़ता पर विशेष बल दिए बिना।
  rationale: निकटवर्ती प्रसंग मूर्तियों के निर्माण और उनकी उपासना की आलोचना करता है। नपुंसकलिंग अतिशयोक्तिपूर्ण विशेषण और उससे सामर्थ्य माँगने की विडंबना गढ़ी हुई प्रतिमा की ओर प्रबल संकेत करते हैं।
