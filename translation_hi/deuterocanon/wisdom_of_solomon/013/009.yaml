translation:
  language: hi
  text: क्योंकि यदि वे इतना जानने में समर्थ थे कि युग[a] के बारे में अनुमान लगा सकते थे, तो उन्होंने इन सबके स्वामी को और भी शीघ्र क्यों नहीं खोज लिया?
