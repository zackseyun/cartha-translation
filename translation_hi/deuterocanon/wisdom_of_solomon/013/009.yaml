- source_word: τὸν αἰῶνα
  choice: संसार[a]
  rationale: इस प्रसंग में दृश्य सृष्टि या विश्व अभिप्रेत है; फिर भी αἰών का शाब्दिक अर्थ ‘युग’ भी हो सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὸν τούτων δεσπότην
  choice: इन सबके स्वामी
  rationale: τούτων का संबंध पूर्ववर्ती सृष्ट जगत से और δεσπότης का अर्थ अधिकार रखने वाले स्वामी से है।
- source_word: τάχιον
  choice: और भी शीघ्र
  rationale: तुलनात्मक क्रियाविशेषण के बल को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: αἰών को कालगत ‘युग’ मानें या सृष्टिगत ‘संसार’
  choice: मुख्य पाठ में ‘संसार’
  alternative: ‘युग’
  rationale: अध्याय 13 के निकटवर्ती प्रसंग में प्रकृति और दृश्य सृष्टि के निरीक्षण से उनके रचयिता को पहचानने की बात है, इसलिए ‘संसार’ प्रसंगानुकूल है; यूनानी शब्द की वास्तविक कालगत संभावना पादटिप्पणी में रखी गई है।
