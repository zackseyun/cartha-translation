    reason: τὸν αἰῶνα के प्राथमिक ‘युग’ अर्थ को मुख्य पाठ में रखते हुए उसके वास्तविक अर्थगत विस्तार को सुरक्षित रखता है।
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: इतना जानने में समर्थ थे
  rationale: ἰσχύω की सामर्थ्य और εἰδέναι के जानने—दोनों भावों को सहज हिन्दी में बनाए रखता है।
- source_word: στοχάσασθαι
