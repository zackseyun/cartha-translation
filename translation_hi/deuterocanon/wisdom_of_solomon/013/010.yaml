base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: hi
  text: 'परन्तु वे दयनीय हैं, और उनकी आशाएँ मृतकों के बीच हैं[a]—वे जिन्होंने मनुष्यों के हाथों की बनाई वस्तुओं को देवता कहा: सोना और चाँदी, कारीगरी की उपज, पशुओं की प्रतिमाएँ, या एक अनुपयोगी पत्थर[b], बहुत पहले के किसी हाथ की कृति।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उनकी आशाएँ निर्जीव वस्तुओं में हैं’ या ‘उनकी आशाएँ मृतकों के साथ हैं’ भी हो सकता है। यूनानी पदबंध संक्षिप्त है और सम्भवतः निर्जीव मूर्तियों तथा मृत्यु से जुड़ी निष्फलता—दोनों का बोध कराता है।
    reason: alternative_reading
  - marker: b
    text: ‘बहुत पहले के किसी हाथ की कृति’ का अर्थ बहुत पहले गढ़ी गई पत्थर की मूर्ति हो सकता है; इससे उसकी प्राचीनता और उसका केवल मनुष्य द्वारा बनाया जाना—दोनों उभरते हैं।
    reason: lexical_alternative
