  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। मूल यूनानी की निन्दात्मक लय और सूचीबद्ध संरचना को डैश, द्विबिन्दु और अर्धविराम से स्पष्ट किया गया है; वास्तविक अर्थगत अस्पष्टता को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
