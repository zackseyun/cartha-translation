- source_word: ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν
  choice: उनकी आशाएँ मृतकों के बीच हैं
  rationale: यूनानी बहुवचन और उसकी तीखी, संक्षिप्त छवि को बनाए रखता है तथा यह तय नहीं करता कि संकेत मृत प्राणियों, निर्जीव मूर्तियों या मृत्यु से जुड़ी निष्फलता की ओर है।
- source_word: οἵτινες ἐκάλεσαν θεοὺς
  choice: वे जिन्होंने ... को देवता कहा
  rationale: ἐκάλεσαν की सीधी क्रिया-शक्ति को सुरक्षित रखते हुए हिन्दी वाक्य-विन्यास में कर्म को स्वाभाविक स्थान दिया गया है।
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: मनुष्यों के हाथों की बनाई वस्तुएँ
  rationale: ἀνθρώπων के सामान्य मानवीय अर्थ और हाथ से बनाए जाने पर मूर्तिपूजा-विरोधी बल को स्पष्ट रूप से व्यक्त करता है।
- source_word: τέχνης ἐμμελέτημα
  choice: कारीगरी की उपज
  rationale: यह सुविचारित और कुशल मानव-निर्माण का भाव देता है, बिना उसे अनावश्यक रूप से सौन्दर्यपरक बनाए।
- source_word: ἀπεικάσματα ζώων
  choice: पशुओं की प्रतिमाएँ
  rationale: ἀπεικάσματα के दृश्य प्रतिरूप और ζώων के यहाँ पशु-मूर्तियों से संबंधित स्वाभाविक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: λίθον ἄχρηστον
  choice: कोई अनुपयोगी पत्थर
  rationale: ἄχρηστος का मूल भाव ‘किसी काम का नहीं’ है; ‘अनुपयोगी’ आर्थिक मूल्य के बजाय निष्प्रयोज्यता पर बल देता है।
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: प्राचीन काल के किसी हाथ की कृति
  rationale: संक्षिप्त यूनानी पदबंध की प्राचीनता और पूर्णतः मानवीय उत्पत्ति दोनों को रखता है; ‘किसी’ हिन्दी में अनिश्चित मानवीय कर्ता को स्वाभाविक बनाता है।
