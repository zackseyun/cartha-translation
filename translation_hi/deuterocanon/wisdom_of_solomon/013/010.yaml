  rationale: यूनानी पदबंध सम्भवतः निर्जीव देवमूर्तियों और मृत्यु-संबंधी निष्फलता दोनों को जगाता है; किसी एक आशय तक सीमित करना पाठ के तनाव को मिटा देता।
- issue: मनुष्य-सूचक ἀνθρώπων
  choice: ‘मनुष्यों’ प्रयोग किया गया है।
