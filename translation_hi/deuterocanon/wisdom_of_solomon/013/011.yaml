  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। यूनानी वाक्य की शर्तात्मक और क्रमिक संरचना को बनाए रखने के लिए पद का अंत अल्पविराम से किया गया है, क्योंकि वाक्य आगे जारी रहता है।
