lexical_decisions:
- source_word: ὑλοτόμος τέκτων
  choice: लकड़हारा, जो बढ़ई भी है
  rationale: 'दोनों संज्ञाओं को एक ही कारीगर के पूरक परिचय के रूप में रखा गया है: वह लकड़ी काटता और उससे वस्तुएँ बनाता है।'
- source_word: εὐκίνητον φυτὸν
  choice: काम करने में आसान किसी पेड़
  rationale: φυτὸν संदर्भ में पेड़ है; εὐκίνητον ऐसी लकड़ी/पेड़ का संकेत देता है जिसे संभालना या जिस पर काम करना सहज हो।
- source_word: ἐκπρίσας
  choice: आरी से काटकर
  rationale: क्रिया विशेष रूप से आरी से काटने का भाव रखती है; हिंदी में अनावश्यक रूप से यह निश्चित नहीं किया गया कि पेड़ गिराया गया या कोई भाग काटा गया।
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: उसके सारे छिलके को कुशलता से उतार दे
  rationale: περιέξυσεν चारों ओर से खुरचकर हटाने को और εὐμαθῶς अभ्यासजन्य कुशलता को व्यक्त करता है। ‘छिलका’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: कारीगरी से उसे सुंदर ढंग से गढ़कर
  rationale: τεχνησάμενος तकनीकी कारीगरी और εὐπρεπῶς सुडौल, शोभनीय या उपयुक्त ढंग को दर्शाता है; दोनों भावों को अलग-अलग सुरक्षित रखा गया है।
- source_word: χρήσιμον σκεῦος
  choice: एक उपयोगी पात्र
  rationale: σκεῦος का अर्थ व्यापक वस्तु, उपकरण या पात्र हो सकता है; लकड़ी से बनी घरेलू उपयोग की वस्तु के संदर्भ में ‘पात्र’ पर्याप्त व्यापक और गरिमापूर्ण है।
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: जीवन की आवश्यकताओं के लिए
  rationale: शाब्दिक ‘जीवन की सेवा के लिए’ हिंदी में अस्वाभाविक है; अभिव्यक्ति दैनिक जीवन की व्यावहारिक जरूरतों में उपयोग को सूचित करती है।
theological_decisions:
- issue: सामान्य कारीगरी और आगे आने वाली मूर्तिनिर्माण की आलोचना का संबंध
  choice: इस पद में कारीगर के काम को सामान्य और उपयोगी कार्य के रूप में ही प्रस्तुत किया गया है।
  alternative: आगामी मूर्तिपूजा-विरोध को पहले से संकेत देने के लिए शब्दावली को नकारात्मक बनाना।
  rationale: इस पद में अभी साधारण उपयोग की वस्तु बनाने का वर्णन है; आलोचनात्मक धार्मिक बल आगे के संदर्भ में उभरता है, इसलिए उसे यहाँ आरोपित नहीं किया गया।
