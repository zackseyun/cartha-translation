    text: “उपयोगी वस्तु” के स्थान पर “उपयोगी पात्र” या “उपयोगी उपकरण” भी संभव है। यूनानी शब्द किसी बर्तन, उपकरण या अन्य काम की वस्तु के लिए प्रयुक्त हो सकता है।
