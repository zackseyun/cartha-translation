  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: hi
  text: या फिर यदि कोई लकड़हारा, एक बढ़ई, जिस पर काम करना आसान हो ऐसे किसी पेड़ को आरी से काटे, उसकी सारी छाल कुशलता से उतार दे, और कारीगरी से उसे भली-भाँति गढ़कर जीवन की आवश्यकताओं के लिए एक उपयोगी वस्तु[a] बना दे,
  philosophy: optimal-equivalence
  footnotes:
