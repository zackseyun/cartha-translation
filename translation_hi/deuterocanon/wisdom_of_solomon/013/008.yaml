- source_word: πάλιν δʼ
  choice: फिर भी
  rationale: πάλιν की पुनरुक्ति और δέ की हल्की विरोधसूचक छाया को स्वाभाविक, संक्षिप्त हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: οὐδʼ αὐτοὶ
