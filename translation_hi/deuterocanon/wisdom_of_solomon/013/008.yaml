  choice: वे क्षमा के योग्य नहीं हैं
  alternative: उनका कोई बहाना नहीं है / वे क्षम्य नहीं हैं
  rationale: यूनानी शब्द सीधे ‘बहाना’ नहीं, बल्कि क्षमा या रियायत के योग्य होने की बात करता है। इसलिए अनुवाद नैतिक उत्तरदायित्व को व्यक्त करता है, पर क्षमा के किसी व्यापक धार्मिक सिद्धांत को यहाँ आरोपित नहीं करता।
