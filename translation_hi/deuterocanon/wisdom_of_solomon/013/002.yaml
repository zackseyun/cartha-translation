  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: hi
  text: इसके बजाय, उन्होंने या तो अग्नि को, या पवन[a] को, या वेग से चलती वायु को, या तारों के चक्र[b] को, या प्रचंड जल को, या आकाश की ज्योतियों को देवता—संसार के अधिपति[c]—मान लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘आत्मा’ या ‘श्वास’ भी हो सकता है; यहाँ प्राकृतिक तत्त्वों का संदर्भ ‘पवन’ अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तारों का परिभ्रमण’।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक भाव: ‘संसार पर प्रधानता से शासन करने वाले’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: इसके बजाय, ... या तो
  rationale: पिछले पद से विरोध और गलत पहचानों की वैकल्पिक सूची—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πῦρ
  choice: अग्नि
  rationale: मूल के सामान्य तत्त्व-सूचक शब्द का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: πνεῦμα
  choice: पवन
  rationale: प्राकृतिक शक्तियों की इस सूची में ‘पवन’ संदर्भानुकूल है; इससे ἀήρ के लिए प्रयुक्त ‘वायु’ से कुछ शब्दगत भेद भी बना रहता है।
- source_word: ταχινὸν ἀέρα
  choice: वेग से चलती वायु
  rationale: ταχινόν की गति और ἀέρα के मूल अर्थ, दोनों को स्पष्ट रखता है।
- source_word: κύκλον ἄστρων
  choice: तारों का चक्र
  rationale: तारों के वृत्ताकार क्रम या परिभ्रमण की प्राचीन छवि को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: βίαιον ὕδωρ
  choice: प्रचंड जल
  rationale: βίαιον की बलपूर्ण और उग्र प्रकृति को संक्षेप में व्यक्त करता है तथा जल को सामूहिक एकवचन रूप में रखता है।
- source_word: φωστῆρας οὐρανοῦ
  choice: आकाश की ज्योतियाँ
  rationale: आकाशीय प्रकाश-पिंडों का अर्थ सहज, आधुनिक और गरिमापूर्ण हिन्दी में देता है।
- source_word: πρυτάνεις κόσμου
  choice: संसार के अधिपति
  rationale: πρυτάνεις के प्रधानता से शासन करने वाले अर्थ और κόσμος के विश्व-संदर्भ को बनाए रखता है।
- source_word: θεοὺς ἐνόμισαν
  choice: देवता ... मान लिया
  rationale: ἐνόμισαν में निहित विचार या निर्णय को स्पष्ट रखते हुए हिन्दी में स्वाभाविक विधेय-रचना प्रस्तुत करता है।
theological_decisions:
- issue: πνεῦμα का अर्थ ‘पवन’ लिया जाए या ‘आत्मा’
  choice: पवन
  alternative: आत्मा; श्वास
  rationale: पद में सृष्ट प्राकृतिक तत्त्वों और आकाशीय पिंडों की सूची है। ‘आत्मा’ किसी व्यक्तिगत आध्यात्मिक सत्ता का अनपेक्षित संकेत दे सकता है; ‘पवन’ यहाँ के संदर्भ को अधिक ठीक रखता है।
- issue: πρυτάνεις κόσμου का θεούς से संबंध
  choice: देवता—संसार के अधिपति—
  alternative: संसार पर शासन करने वाले देवता; संसार के शासक और देवता
  rationale: 'मध्य के डैश पदबंध को ‘देवता’ की समानाधिकरणात्मक व्याख्या के रूप में रखते हैं: जिन वस्तुओं को उन्होंने देवता माना, उन्हीं को संसार के अधिपति भी समझा। इससे दोनों दावे सुरक्षित रहते हैं।'
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए स्पष्ट, पर गरिमापूर्ण। ‘पवन’ और ‘वायु’ का चयन यूनानी πνεῦμα और ἀήρ के भेद को यथासंभव बनाए रखता है। सूची की लय के लिए ‘या’ की पुनरावृत्ति तथा समानाधिकरण को स्पष्ट करने के लिए डैश प्रयुक्त हैं।
