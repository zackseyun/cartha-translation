  text: या उसने उसे किसी तुच्छ पशु जैसा बना दिया[a], उस पर गेरू और लाल रंजक लगाकर उसकी सतह को लाल कर दिया, और उसके हर दाग-धब्बे पर लेप कर दिया[b],
