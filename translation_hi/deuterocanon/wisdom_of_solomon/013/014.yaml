lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: किसी तुच्छ पशु
  rationale: ζῷον का अर्थ पशु या जीव है और εὐτελής यहाँ साधारण, सस्ता अथवा निम्न कोटि का होने का तिरस्कारपूर्ण भाव देता है। “तुच्छ पशु” इस भाव को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ὡμοίωσεν αὐτό
  choice: उसे ... जैसा बना दिया
  rationale: ὁμοιόω का अर्थ किसी वस्तु को दूसरी के समान बनाना है। कारीगर द्वारा मूर्ति गढ़े जाने के संदर्भ में यह हिन्दी सहज और सटीक है।
- source_word: καταχρίσας
  choice: पोतकर / रंग पोत दिया
  rationale: क्रिया किसी पदार्थ को सतह पर अच्छी तरह लगाने या उससे ढकने को व्यक्त करती है। “पोतना” रंग लगाने और खामियाँ ढकने—दोनों प्रसंगों में स्वाभाविक है तथा अभिषेक का अनावश्यक धार्मिक भाव नहीं लाता।
- source_word: μίλτῳ
  choice: गेरू
  rationale: μίλτος लाल मिट्टी अथवा लाल गेरू से बने रंग को दर्शाता है। “गेरू” आधुनिक हिन्दी में परिचित और सांस्कृतिक रूप से उपयुक्त समतुल्य है।
- source_word: φύκει
  choice: लाल रंग
  rationale: φῦκος किसी लाल रंजक या श्रृंगारिक रंग का नाम हो सकता है, संभवतः समुद्री वनस्पति से बना हुआ। “लाल रंग” रंग-सामग्री के आशय को स्पष्ट रखता है, जबकि उसकी अनिश्चित ऐतिहासिक संरचना को मुख्य पाठ में नहीं थोपता।
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: उसकी सतह लाल कर दी
  rationale: χρόα त्वचा, रंगत या बाहरी सतह को व्यक्त कर सकता है। निर्जीव मूर्ति के संदर्भ में “सतह” सबसे स्वाभाविक है और ἐρυθῆνας के लाल करने के अर्थ को स्पष्ट करता है।
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: उसकी हर खामी
  rationale: κηλίς दाग, धब्बा या blemish को दर्शाता है। मूर्ति को अंतिम रूप देने के प्रसंग में “खामी” दिखाई देने वाले दोष को समेटती है और रंग पोतने से उसके ढके जाने का आशय बनाए रखती है।
