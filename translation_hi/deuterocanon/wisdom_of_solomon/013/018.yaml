lexical_decisions:
- source_word: ζωῆς
  choice: जीवन
  rationale: περὶ के साथ यह उस विषय या आवश्यकता को बताता है जिसके लिए याचना की जाती है; ‘जीवन के लिए’ सीधा और स्वाभाविक है।
- source_word: τὸ νεκρόν
  choice: एक मरी हुई वस्तु
  rationale: नपुंसकलिंग रूप किसी निर्जीव मूर्ति की ओर संकेत करता है; यह अनुवाद उसके जड़ और निष्प्राण होने पर व्यंग्य को बनाए रखता है।
- source_word: ἀξιοῖ
  choice: योग्य मानता है
  rationale: क्रिया का मूल अर्थ ‘योग्य समझना/मानना’ है। हिन्दी में यह कुछ असामान्य लगते हुए भी यूनानी के मूल्यांकनात्मक भाव को सुरक्षित रखता है।
- source_word: ἐπικουρίας
  choice: सहायता
  rationale: यह याचना के समानांतर विषय को स्पष्ट, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἀπειρότατον
  choice: सबसे अनुभवहीन
  rationale: अतिशयोत्तम रूप को बनाए रखते हुए ἀπειρότατος का ‘अनुभव से सर्वथा रहित’ भाव व्यक्त करता है; इसे केवल ‘असमर्थ’ कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: ἱκετεύει
  choice: विनती करता है
  rationale: यह गंभीर और आग्रहपूर्ण याचना का स्वाभाविक हिन्दी रूप है।
- source_word: ὁδοιπορίας
  choice: यात्रा
  rationale: यह यात्रा करने या मार्ग पर जाने के अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: जो अपने पाँव तक का उपयोग नहीं कर सकता
  rationale: यह मूर्ति की स्वयं चलने में असमर्थता पर व्यंग्य को ठोस रूप देता है; βάσις में निहित ‘आधार/चौकी’ की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: मूर्ति के लिए नपुंसकलिंग और व्यक्तिवाचक अभिव्यक्तियों का बदलता प्रयोग
  choice: τὸ νεκρόν को निर्जीव ‘मरी हुई वस्तु’ के रूप में और बाद की अभिव्यक्तियों को ‘सबसे अनुभवहीन’ तथा ‘जो…नहीं कर सकता’ के रूप में रखा गया।
  alternative: सभी उल्लेखों में केवल ‘वह मूर्ति’ या केवल ‘वह वस्तु’ कहना।
  rationale: यूनानी की बदलती अभिव्यक्ति उस निर्मित वस्तु को कथित सहायक मानने की विडम्बना उभारती है; उसे एकरूप करने से स्रोत का व्यंग्य मंद पड़ता।
- issue: βάσις का अर्थ
  choice: मुख्य पाठ में ‘पाँव’ का गतिशीलता-संबंधी अर्थ रखा गया।
  alternative: ‘आधार’ या ‘चौकी’ पढ़ना।
  rationale: दोनों अर्थ मूर्ति के संदर्भ में सम्भव हैं। यात्रा के समानांतर ‘पाँव’ अधिक सहज है, पर वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और व्यंग्यात्मक समानांतरता वाला वाक्य। ‘मरी हुई वस्तु’ मूर्ति की निर्जीवता को उभारता है; अर्धविराम मूल के तीन समानांतर खंडों को स्पष्ट रखते हैं।
