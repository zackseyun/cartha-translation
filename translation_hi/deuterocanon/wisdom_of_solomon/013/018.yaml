  text: परन्तु जीवन के लिए वह एक मरी हुई वस्तु को योग्य मानता है; सहायता के लिए वह सबसे अनुभवहीन व्यक्ति से विनती करता है; और यात्रा के लिए वह उससे विनती करता है, जो अपने पाँव का भी उपयोग नहीं कर सकता[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने आधार अथवा चौकी का भी उपयोग नहीं कर सकता।” यूनानी शब्द βάσις का अर्थ पाँव/कदम भी हो सकता है और मूर्ति का आधार भी; यह पंक्ति स्वयं चल न सकने वाली मूर्ति का उपहास करती है।
