base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: hi
  text: इसलिए उसने पहले से ऐसा प्रबंध किया कि वह गिर न पड़े, क्योंकि वह जानता था कि वह अपनी सहायता स्वयं नहीं कर सकती; आखिर वह एक प्रतिमा[a] है और उसे सहायता की आवश्यकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्ति”; यूनानी शब्द का शाब्दिक अर्थ “छवि” या “प्रतिरूप” है, यद्यपि प्रसंग उपासना के लिए बनाई गई वस्तु का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: इसलिए ... कि वह गिर न पड़े
  rationale: ἵνα के साथ μή और संभावनार्थक क्रिया रोकथाम का उद्देश्य व्यक्त करती है; यह हिन्दी में स्वाभाविक रहते हुए ‘गिर न पड़े’ का शाब्दिक भाव बनाए रखता है।
- source_word: προενόησεν αὐτοῦ
  choice: उसने पहले से ऐसा प्रबंध किया
  rationale: προνοέω पूर्व-विचार के साथ पहले से उपाय करने का भाव देता है; प्रसंग में कारीगर प्रतिमा को गिरने से बचाने की व्यवस्था करता है। αὐτοῦ का संदर्भ निर्जीव प्रतिमा से है।
- source_word: εἰδὼς ὅτι ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: क्योंकि वह जानता था कि वह अपनी सहायता स्वयं नहीं कर सकती
  rationale: कृदन्त εἰδώς यहाँ कारणसूचक भाव रखता है। ἀδυνατεῖ ... βοηθῆσαι प्रतिमा की अपने लिए कुछ कर सकने की असमर्थता स्पष्ट करता है।
- source_word: εἰκὼν
  choice: प्रतिमा
  rationale: εἰκών का मूल अर्थ ‘छवि/प्रतिरूप’ है; निर्मित उपासना-वस्तु के इस प्रसंग में ‘प्रतिमा’ हिन्दी में सटीक और स्वाभाविक है, जबकि ‘मूर्ति’ प्रासंगिक वैकल्पिक अनुवाद है।
- source_word: χρείαν ἔχει βοηθείας
  choice: उसे सहायता की आवश्यकता है
  rationale: यह यूनानी पदबंध के ‘सहायता की आवश्यकता होना’ वाले अर्थ और लेखक के व्यंग्य—जिस वस्तु से सहायता चाही जाती है, वही सहायता चाहती है—को स्पष्ट रखता है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी प्रसंग में εἰκών का अर्थ
  choice: मुख्य पाठ में ‘प्रतिमा’
  alternative: ‘मूर्ति’ या अधिक शाब्दिक ‘छवि’
  rationale: प्रसंग उपासना के लिए बनाई गई वस्तु का है, पर यूनानी शब्द स्वयं सामान्यतः ‘छवि/प्रतिरूप’ कहता है। ‘प्रतिमा’ मूल अर्थ और प्रसंग दोनों को संभालती है और ‘मूर्ति’ को पादटिप्पणी में वैकल्पिक रूप में सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘आखिर’ γάρ के व्याख्यात्मक और व्यंग्यात्मक बल को स्वाभाविक ढंग से व्यक्त करता है। ‘प्रतिमा’ स्त्रीलिंग होने के कारण संबंधित सर्वनाम और क्रियाएँ स्त्रीलिंग में रखी गई हैं।
