  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: hi
  text: फिर भी इन लोगों पर केवल थोड़ा-सा दोष है, क्योंकि वे भी शायद परमेश्वर[a] को खोजते हुए और उसे पाने की इच्छा रखते हुए भटक जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी देवता को खोजते हुए और उसे पाने की इच्छा रखते हुए”; यूनानी में “परमेश्वर” के साथ निश्चित उपपद नहीं है, पर प्रसंग में आशय संभवतः उस सच्चे परमेश्वर से है जिसे वे भूल करते हुए भी खोजने का प्रयास कर रहे हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: फिर भी
  rationale: यह पद पिछले कथन के बाद विरोध और रियायत—दोनों का भाव व्यक्त करता है; ‘फिर भी’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: ἐπὶ τούτοις
  choice: इन लोगों पर
  rationale: संदर्भ में संकेत पहले वर्णित व्यक्तियों की ओर है; ‘इन लोगों पर’ दोष लगाए जाने के भाव के साथ स्पष्ट और स्वाभाविक है।
- source_word: μέμψις ὀλίγη
  choice: थोड़ा ही दोष
  rationale: μέμψις निंदा या दोषारोपण का भाव देता है, अनिवार्यतः भारी न्यायिक अपराधबोध का नहीं; ‘थोड़ा ही दोष’ ὀλίγη की न्यूनता बनाए रखता है।
- source_word: τάχα
  choice: शायद
  rationale: यह कथन को संभावनात्मक बनाता है; ‘शायद’ इसका सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: πλανῶνται
  choice: भटक जाते हैं
  rationale: क्रिया बौद्धिक और धार्मिक भूल या पथभ्रष्टता का भाव रखती है, बिना बाहरी कर्ता को अनावश्यक रूप से निश्चित किए।
- source_word: θεὸν ζητοῦντες
  choice: परमेश्वर को खोजते हुए
  rationale: यद्यपि यूनानी में पद के साथ निश्चित उपपद नहीं है, प्रसंग सृष्टिकर्ता सच्चे परमेश्वर की खोज की ओर संकेत करता है। ‘परमेश्वर’ हिन्दी में उस संदर्भ को स्पष्ट रखता है।
- source_word: θέλοντες εὑρεῖν
  choice: उसे पाना चाहते हुए
  rationale: θέλοντες इच्छा या अभिलाषा व्यक्त करता है; ‘पाना चाहते हुए’ सरल आधुनिक हिन्दी में उनकी वास्तविक मंशा और समकालिक क्रिया दोनों बनाए रखता है।
theological_decisions:
- issue: θεόν को अनिश्चित ‘किसी देवता’ या निश्चित ‘परमेश्वर’ के रूप में समझना
  choice: परमेश्वर
  alternative: किसी देवता
  rationale: ज्ञान 13 के प्रसंग में लेखक उन लोगों की चर्चा करता है जो सृष्टि के द्वारा दिव्यता का अनुमान लगाते हैं, पर सृष्टिकर्ता को नहीं पहचानते। इसलिए यहाँ सच्चे परमेश्वर का संदर्भ अधिक संभावित है; फिर भी यूनानी में निश्चित उपपद के अभाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। कृदंतों के संबंध को स्वाभाविक रखने के लिए ‘खोजते और ... पाना चाहते हुए’ प्रयोग किया गया है; वाक्य के अंत का अर्धविराम अगले पद से निरंतरता दिखाता है।
