    text: या ‘अच्छी’। यूनानी शब्द καλά का अर्थ ‘सुंदर’ या ‘अच्छी’ दोनों हो सकता है; यहाँ देखने पर दिए गए जोर के कारण ‘सुंदर’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: के बीच विचरते हुए
  rationale: यह कृदंत किसी क्षेत्र में चलने-फिरने या जीवन-व्यवहार में लगे रहने का भाव देता है। यहाँ यह परमेश्वर की कृतियों के बीच प्रत्यक्ष अनुभव को व्यक्त करता है।
- source_word: διεραυνῶσιν
  choice: गहराई से जाँच-पड़ताल करते हैं
  rationale: क्रिया सावधानी से खोजने और सूक्ष्म जाँच करने का तीव्र भाव रखती है; यह हिन्दी में स्वाभाविक ढंग से उस बल को बनाए रखती है।
- source_word: πείθονται
  choice: उन्हें विश्वास हो जाता है
  rationale: मध्य/कर्मवाच्य भाव बताता है कि दृश्य प्रमाण उन्हें आश्वस्त कर देता है। यह चयन निष्कर्ष तक पहुँचने का भाव रखता है, मात्र धार्मिक विश्वास जोड़ता नहीं।
- source_word: τῇ ὄψει
  choice: जो कुछ वे देखते हैं, उससे
  rationale: शाब्दिक अर्थ ‘दृष्टि/दिखाई पड़ने वाले रूप से’ है। हिन्दी में यह साधनकारक अर्थ और प्रत्यक्ष देखने पर जोर दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καλά
  choice: सुंदर
  rationale: καλός का अर्थ ‘अच्छा’ भी हो सकता है, पर दृष्टि और दिखाई देने वाली वस्तुओं के संदर्भ में सौंदर्य का अर्थ प्रमुख प्रतीत होता है।
- source_word: τὰ βλεπόμενα
  choice: दिखाई देने वाली वस्तुएँ
  rationale: यह वर्तमान कर्मवाच्य कृदंत दृश्य सृष्ट वस्तुओं को सूचित करता है। यह हिन्दी वाक्यांश दृश्यता के भाव को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी कृतियाँ’, जहाँ ‘उसकी’ आसपास के तर्क में परमेश्वर/सृष्टिकर्ता की ओर संकेत करता है
  alternative: इसे अधिक अमूर्त ढंग से ‘उसकी/उस वस्तु की कृतियाँ’ समझना
  rationale: आसपास का प्रसंग सृष्टि से उसके रचयिता तक विचार पहुँचने की बात करता है। ‘उसकी’ मूल पाठ के पुरुषवाचक संकेत को बनाए रखता है, पर पद के भीतर अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: καλά का अर्थ
  choice: सुंदर
  alternative: अच्छी
  rationale: मूल शब्द दोनों अर्थ दे सकता है। दृश्य अनुभव पर जोर होने के कारण मुख्य पाठ में ‘सुंदर’ चुना गया है, जबकि वास्तविक अर्थगत विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
