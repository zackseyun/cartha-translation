  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘जाँच-पड़ताल’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘गहराई से’ यूनानी क्रिया की तीव्रता बनाए रखता है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे अर्थगत विकल्प संबंधित है।
