  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: hi
  text: क्योंकि वे उसकी कृतियों के बीच विचरते हुए उनकी गहराई से जाँच करते हैं और जो कुछ वे देखते हैं, उससे आश्वस्त होते हैं कि दिखाई देने वाली वस्तुएँ सुंदर[a] हैं।
  philosophy: optimal-equivalence
  footnotes:
