  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: hi
  text: यदि वे उनकी सुन्दरता से आनन्दित होकर उन्हें देवता समझ बैठे, तो वे जान लें कि उनका स्वामी उनसे कितना अधिक श्रेष्ठ है; क्योंकि सौन्दर्य के सृष्टिकर्ता ने ही उन्हें रचा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλλονῇ / κάλλους
  choice: सुन्दरता / सौन्दर्य
  rationale: पहले पद में सहज आधुनिक हिन्दी ‘सुन्दरता’ और फिर सृष्टि के गुण के रूप में गरिमापूर्ण ‘सौन्दर्य’ रखा गया है; दोनों यूनानी शब्द एक ही अर्थ-क्षेत्र में हैं।
- source_word: θεοὺς
  choice: देवता
  rationale: बहुवचन और सन्दर्भ में सृष्ट वस्तुओं को देव मानने का भाव स्पष्ट रखता है।
- source_word: ὁ δεσπότης
  choice: उनका स्वामी
  rationale: δεσπότης का प्रभुत्व-सूचक अर्थ सुरक्षित रहता है और ‘उनका’ का सम्बन्ध पूर्वोक्त सृष्ट वस्तुओं से है।
- source_word: βελτίων
  choice: अधिक श्रेष्ठ
  rationale: तुलनात्मक अर्थ ‘इनसे कितना बेहतर/श्रेष्ठ’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὁ τοῦ κάλλους γενεσιούργης
  choice: सौन्दर्य के जनक
  rationale: γενεσιούργης सौन्दर्य को अस्तित्व देने वाले मूल उत्पादक की ओर संकेत करता है; ‘जनक’ इसे संक्षिप्त रूप में व्यक्त करता है, जबकि अगले खण्ड का ‘रचा’ सृष्टिकर्ता का आशय स्पष्ट करता है।
- source_word: ἔκτισεν
  choice: रचा है
  rationale: सृष्टि करने के अर्थ को सामान्य, वर्तमान हिन्दी में स्पष्ट रखता है।
theological_decisions:
- issue: सृष्टिकर्ता और सुन्दर सृष्ट वस्तुओं के बीच तुलना
  choice: ‘उनका स्वामी उनसे कितना अधिक श्रेष्ठ है’
  alternative: ‘उनका प्रभु उनसे कितना महान है’
  rationale: मूल का तुलनात्मक πόσῳ ... βελτίων स्पष्ट रखा गया है और δεσπότης को किसी विशिष्ट साम्प्रदायिक उपाधि में सीमित नहीं किया गया।
- issue: γενεσιούργης का अर्थ
  choice: ‘सौन्दर्य के जनक’
  alternative: ‘सौन्दर्य के सृष्टिकर्ता’
  rationale: दुर्लभ यूनानी पद के ‘उत्पन्न करने वाले’ भाव को बचाता है; साथ का ‘उन्हें रचा है’ ईश्वरीय सृष्टि का आशय निर्बाध रूप से स्पष्ट करता है।
