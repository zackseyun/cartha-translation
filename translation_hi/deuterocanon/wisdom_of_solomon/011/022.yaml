  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: hi
  text: क्योंकि आपके सामने सारा संसार तराज़ू के पलड़े के हल्के-से झुकाव के समान है[a], और भोर की ओस की एक बूँद के समान, जो धरती पर उतर आई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तराज़ू को झुका देने वाले एक छोटे-से बाट के समान’ अथवा ‘तराज़ू पर पड़े एक कण के समान’; यूनानी अभिव्यक्ति अत्यन्त हल्केपन का बोध कराती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: तराज़ू के पलड़े के हल्के-से झुकाव
  rationale: ῥοπή झुकाव, पलड़ा मुड़ने की गति, या उसे झुकाने वाले अत्यल्प भार का बोध करा सकता है। यह अनुवाद तराज़ू की मूल छवि और अत्यल्पता—दोनों को रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ὅλος ὁ κόσμος
  choice: सारा संसार
  rationale: κόσμος यहाँ समूचे व्यवस्थित जगत को समष्टि के रूप में दर्शाता है। आधुनिक हिन्दी में ‘सारा संसार’ स्वाभाविक और व्यापक है।
- source_word: ἐναντίον σου
  choice: आपके सामने
  rationale: यह मूल अर्थ ‘आपकी उपस्थिति में/आपके सामने’ को बनाए रखता है और परमेश्वर की तुलना में संसार की अत्यल्पता को बिना अतिरिक्त व्याख्या के व्यक्त होने देता है।
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: भोर की ओस की उस बूँद
  rationale: ῥανίς एक बूँद और ὄρθρινή प्रातःकालीन होने का बोध देता है। ‘भोर की ओस’ स्पष्ट, काव्यात्मक और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: जो धरती पर गिरती है
  rationale: कृदन्त का शाब्दिक भाव ‘धरती पर उतर आई’ है; ओस के संदर्भ में ‘गिरती है’ सहज हिन्दी है और नीचे आने की मूल छवि बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के सामने संसार की अत्यल्पता
  choice: दोनों मूर्त उपमाओं को सीधे बनाए रखा गया है।
  alternative: ‘आपके सामने संसार कुछ भी नहीं है’ जैसा व्याख्यात्मक अनुवाद।
  rationale: यूनानी पाठ सृष्टि के मूल्य पर अमूर्त या तात्त्विक निर्णय नहीं देता, बल्कि दो ठोस उपमाओं से उसकी अत्यल्पता दर्शाता है। इसलिए उपमाओं को बिना सिद्धान्तगत तीव्रता जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ अपनाया गया है। ‘भोर की ओस’ काव्यात्मकता को सहज हिन्दी में बनाए रखता है।
