  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: hi
  text: क्योंकि जब उनकी परीक्षा हुई[a], तब उन्होंने, यद्यपि उन्हें दया के साथ अनुशासित किया जा रहा था[b], जान लिया कि जिन अधर्मी[c] लोगों का क्रोध में न्याय हो रहा था, वे कैसे यातना सह रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परखे गए”; यहाँ यूनानी शब्द परीक्षा या परख को दर्शाता है, मुख्यतः पाप के लिए लुभाए जाने को नहीं।
    reason: lexical_alternative
  - marker: b
    text: “अनुशासित” के लिए “सिखाए जाते” या “ताड़ना दिए जाते” भी संभव है; यूनानी शब्द में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन के भाव आ सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: या “भक्तिहीन”; यूनानी शब्द विशेष रूप से परमेश्वर के प्रति अनादर या भक्ति के अभाव पर बल देता है।
    reason: lexical_alternative
