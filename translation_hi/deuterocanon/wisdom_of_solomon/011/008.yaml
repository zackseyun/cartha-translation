translation:
  language: hi
  text: तूने उन्हें प्रचुर जल दिया, जब उन्हें इसकी आशा न थी, और उनकी उस समय की प्यास के द्वारा दिखाया कि तूने उनके विरोधियों को किस प्रकार दंड दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκας
  choice: तूने दिया
  rationale: दूसरे पुरुष एकवचन के साधारण भूतकाल को सीधे रूप में रखा गया है; प्रसंग में सम्बोधन परमेश्वर से है।
- source_word: δαψιλὲς ὕδωρ
  choice: बहुतायत से जल
  rationale: δαψιλής जल की प्रचुर मात्रा व्यक्त करता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀνελπίστως
  choice: आशा के परे
  rationale: यूनानी क्रियाविशेषण में अपेक्षा के विपरीत और आशा से परे होने, दोनों की सम्भावना है। मुख्य पाठ में अधिक सशक्त शाब्दिक छाया रखी गई है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: δείξας
  choice: दिखाया
  rationale: यह कृदन्त मुख्य क्रिया के साथ जुड़ी व्याख्यात्मक परिस्थिति बताता है; हिन्दी में संयोजित क्रिया-वाक्य स्वाभाविक है।
- source_word: διὰ τοῦ τότε δίψους
  choice: उस समय की उनकी प्यास के द्वारा
  rationale: διά के माध्यम-सूचक अर्थ और τότε के काल-सन्दर्भ, दोनों को स्पष्ट रखा गया है। 'उनकी' प्रसंग से पूरित है।
- source_word: τοὺς ὑπεναντίους
  choice: उनके विरोधियों
  rationale: यह उन लोगों को सूचित करता है जो उनके विरुद्ध खड़े थे; 'विरोधी' आधुनिक हिन्दी में स्पष्ट है और 'शत्रु' की अपेक्षा मूल की संरचना के निकट है।
- source_word: ἐκόλασας
  choice: तूने दण्ड दिया
  rationale: κολάζω यहाँ दण्डात्मक कार्रवाई व्यक्त करता है; इसे बिना नरम किए सीधे अनूदित किया गया है।
theological_decisions:
- issue: '''उन्हें'' और ''उनके विरोधियों'' का सन्दर्भ'
  choice: सर्वनामों को मुख्य पाठ में बनाए रखा गया है; निकट प्रसंग में 'उन्हें' परमेश्वर की प्रजा और 'विरोधियों' से उनके मिस्री विरोधी अभिप्रेत हैं।
  alternative: इसे सामान्य रूप से धर्मियों और उनके विरोधियों के बीच का अन्तर माना जा सकता है।
  rationale: अध्याय का निकट प्रसंग इस्राएल को मिले जल और विरोधियों के दण्ड की तुलना करता है, पर पद स्वयं नाम नहीं लेता; इसलिए अनुवाद में नाम जोड़कर सम्भावित व्यापकता को सीमित नहीं किया गया।
