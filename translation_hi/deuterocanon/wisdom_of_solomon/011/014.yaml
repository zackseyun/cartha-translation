  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: hi
  text: क्योंकि उन्होंने उस व्यक्ति को, जिसे बहुत पहले शिशु अवस्था में बाहर छोड़ दिया गया था[a], उपहास करते हुए ठुकरा दिया; पर उन घटनाओं के अंत में वे चकित हुए[b], धर्मियों की तरह नहीं प्यासे होकर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह शिशु जिसे कभी बाहर छोड़ दिया गया था—यह मूसा की ओर संकेत है।
    reason: cross_reference
  - marker: b
    text: या, “उन परिणामों के अंत में”; यूनानी पद का अर्थ उन घटनाओं के अंतिम परिणाम अथवा उनके समापन से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει
  choice: शिशु के रूप में बाहर…छोड़ दिया गया था
  rationale: ἔκθεσις विशेष रूप से किसी शिशु को बाहर छोड़ देने या त्याग देने के लिए प्रयुक्त हो सकता है। हिन्दी में इस ऐतिहासिक संकेत को स्पष्ट रखा गया है, पर मुख्य पाठ में मूसा का नाम नहीं जोड़ा गया।
- source_word: ῥιφέντα
  choice: फेंककर
  rationale: ῥίπτω का मूल भाव फेंकने का है। इसे ἐν ἐκθέσει के साथ जोड़कर ‘बाहर फेंककर छोड़ दिया गया’ कहना दोनों यूनानी अभिव्यक्तियों का बल बनाए रखता है।
- source_word: ἀπεῖπον
  choice: अस्वीकार कर दिया था
  rationale: यहाँ क्रिया तिरस्कारपूर्वक ठुकराने या अपना मानने से इनकार करने का भाव देती है। ‘अस्वीकार’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: χλευάζοντες
  choice: ठट्ठा करते हुए
  rationale: कृदंत अस्वीकार करने की रीति बताता है—उन्होंने उपहास करते हुए उसे ठुकराया।
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: उन घटनाओं के अंतिम परिणाम पर
  rationale: ἐκβάσεις घटनाओं के परिणाम, निष्कर्ष या विकसित होते क्रम को सूचित कर सकता है। यह अनुवाद ‘घटनाओं’ और ‘परिणाम’ दोनों अर्थ-छायाओं को साथ रखता है।
- source_word: ἐθαύμασαν
  choice: चकित रह गए
  rationale: क्रिया आश्चर्यचकित होने का भाव देती है; यह हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  choice: क्योंकि उन्हें धर्मियों से भिन्न प्रकार की प्यास लगी थी
  rationale: यूनानी पाठ उनकी प्यास की तुलना धर्मियों की प्यास से करता है। ‘भिन्न प्रकार की’ उस विरोध को बनाए रखता है और अस्वाभाविक शाब्दिक संरचना से बचता है।
theological_decisions:
- issue: बाहर छोड़ दिए गए शिशु की पहचान
  choice: मुख्य पाठ में व्यक्ति का नाम न देकर संकेत को अप्रत्यक्ष रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘मूसा’ कहना।
  rationale: यूनानी पाठ नाम नहीं लेता, यद्यपि प्रसंग मूसा की ओर संकेत करता है। स्रोत की संयमित अभिव्यक्ति को सुरक्षित रखते हुए पहचान पादटिप्पणी में बताई गई है।
- issue: मिस्रियों और धर्मियों की प्यास का अंतर
  choice: ‘धर्मियों से भिन्न प्रकार की प्यास’ के रूप में तुलना को खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से दंडात्मक बनाम अस्थायी प्यास कहना।
  rationale: निकटवर्ती प्रसंग ऐसा अंतर सुझाता है, पर इस पद में उस अंतर का स्वरूप सीधे परिभाषित नहीं किया गया; इसलिए व्याख्यात्मक धर्मवैज्ञानिक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाहर फेंककर छोड़ दिया गया’ जानबूझकर कुछ ठोस है, ताकि शिशु को बाहर छोड़ने और फेंके जाने—दोनों यूनानी भाव सुरक्षित रहें।
