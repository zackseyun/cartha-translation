lexical_decisions:
- source_word: διώδευσαν
  choice: से होकर गए
  rationale: यह क्रिया किसी क्षेत्र के भीतर से होकर आगे बढ़ने का भाव देती है; यह हिंदी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: ἔρημον ἀοίκητον
  choice: निर्जन उजाड़ प्रदेश
  rationale: ἔρημον उजाड़ या वन्य क्षेत्र और ἀοίκητον आबादी से रहित होने का बोध कराता है। संयुक्त पद दोनों विशेषताओं को संक्षेप में बनाए रखता है और रेतीले मरुस्थल का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἀβάτοις
  choice: दुर्गम स्थानों में
  rationale: शब्द का अर्थ ऐसे स्थानों से है जहाँ पहुँचना या चलना कठिन हो। 'दुर्गम' इसकी व्यापक अर्थ-सीमा को बनाए रखता है; 'पगडंडी-विहीन' अपेक्षाकृत संकीर्ण होता।
- source_word: ἔπηξαν σκηνάς
  choice: तंबू गाड़े
  rationale: σκηνάς यात्रियों के अस्थायी तंबुओं को दर्शाता है और ἔπηξαν उन्हें दृढ़ता से खड़ा करने का भाव देता है। 'तंबू गाड़े' आधुनिक हिंदी का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: निर्गमनकालीन उजाड़ प्रदेश की छवि
  choice: यात्रा और पड़ाव की ठोस भाषा को बिना अतिरिक्त व्याख्या के बनाए रखा गया।
  alternative: इसे व्याख्यात्मक रूप से 'उन्होंने मरुभूमि में पड़ाव डाला' कहना।
  rationale: पद इस्राएल की उजाड़ प्रदेश की यात्रा की ओर संकेत करता है, पर यूनानी पाठ स्वयं वर्णनात्मक है। अनुवाद ऐतिहासिक छवि को रखता है, किंतु कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'उजाड़ प्रदेश' ἔρημος की व्यापक भौगोलिक अर्थ-सीमा को रखता है, जबकि 'दुर्गम' ἀβάτοις की वास्तविक अस्पष्टता—अगम्य, कठिन या अनचला भूभाग—को अत्यधिक संकीर्ण नहीं करता।
