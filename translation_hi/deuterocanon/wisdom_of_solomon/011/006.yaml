  alternative: ‘जल के कीचड़-जैसे लहू में बदल जाने से वे व्याकुल हुए’ या ‘नील नदी के लहू बन जाने से वे व्याकुल हुए’
  rationale: मूल यूनानी निर्गमन की पृष्ठभूमि मानकर चलता है, पर इस खंड में न ‘जल’ जोड़ता है, न ‘नील नदी’। उन्हें स्पष्ट रूप से जोड़ना अर्थ खोल देता, पर मूल से अधिक कहता।
- issue: μέν के प्रतितुलनात्मक बल को इसी पद में अलग शब्द से व्यक्त करना
  choice: ἀντί को ‘के बदले’ द्वारा विरोध स्पष्ट करना और μέν के लिए कृत्रिम ‘एक ओर’ न जोड़ना
  alternative: ‘एक ओर, सदा बहनेवाली नदी के सोते के बदले...’
  rationale: μέν का संतुलन आगे के कथन में पूरा होता है। अकेले इस पद में ‘एक ओर’ हिन्दी को अधूरा और बोझिल बनाता; ‘के बदले’ आवश्यक विरोध को पहले ही सुरक्षित रखता है।
