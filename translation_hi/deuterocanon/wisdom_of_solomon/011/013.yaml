translation:
  language: hi
  text: क्योंकि जब उन्होंने सुना कि उनके अपने ही दण्डों के द्वारा उन लोगों का भला हो रहा था, तब उन्होंने प्रभु को पहचाना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें प्रभु का बोध हुआ।” यूनानी क्रिया पूर्ण विश्वास का अंगीकार बताने के बजाय अनुभूति या पहचान को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: क्योंकि जब
  rationale: γάρ के व्याख्यात्मक अर्थ और ὅτε के कालवाचक संबंध—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἤκουσαν
  choice: उन्होंने सुना
  rationale: क्रिया के सामान्य श्रवण-संबंधी अर्थ को सीधे व्यक्त करता है; प्रसंग में किसी समाचार के सुनने का भाव है।
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: उनके अपने ही दण्डों के द्वारा
  rationale: διά और संबंधकारक का साधनवाचक अर्थ बनाए रखता है। ‘अपने ही’ ἰδίων में निहित विरोधाभासी बल को स्पष्ट करता है, और ‘दण्ड’ महामारीरूपी न्याय के प्रसंग के अनुकूल है।
- source_word: εὐεργετουμένους
  choice: भला हो रहा है
  rationale: 'निष्क्रिय कृदन्त का भाव सहज आधुनिक हिन्दी में व्यक्त करता है: वे लाभ या भलाई प्राप्त कर रहे थे। मुख्य क्रिया भूतकाल में होते हुए भी आश्रित कथन में वर्तमान-सदृश रूप हिन्दी में स्वाभाविक है।'
- source_word: αὐτούς
  choice: उन लोगों
  rationale: सर्वनाम का संकेत दूसरे, पहले से प्रसंग में उपस्थित समुदाय की ओर रखता है। इससे इस्राएलियों का आशय समझ में आता है, पर उनके नाम को यूनानी पाठ में जोड़े बिना।
- source_word: ᾔσθοντο
  choice: पहचाना
  rationale: यहाँ क्रिया का अर्थ अनुभव या बोध के द्वारा पहचानने तक विस्तृत हो सकता है। ‘पहचाना’ प्रभु के कार्य का उदित बोध दर्शाता है, पर पूर्ण विश्वास या अंगीकार को अनिवार्य नहीं बनाता।
- source_word: τοῦ κυρίου
  choice: प्रभु को
  rationale: κύριος के लिए मानक ईश्वरीय संबोधन ‘प्रभु’ रखा गया है; संबंधकारक यहाँ ᾔσθοντο के कर्म के रूप में आता है।
theological_decisions:
- issue: αὐτούς का संदर्भ और दण्ड पानेवालों तथा लाभ पानेवालों का संबंध
  choice: ‘उन लोगों’ से प्रसंगानुसार इस्राएलियों की ओर संकेत रखा गया है, जिनका मिस्रियों के अपने दण्डों के द्वारा भला हो रहा था।
  alternative: केवल ‘उनका’ कहकर दोनों समूहों का भेद और अधिक अप्रकट रखा जा सकता है।
  rationale: आस-पास का प्रसंग मिस्रियों के दण्ड और इस्राएलियों की भलाई में विरोध दिखाता है। ‘उन लोगों’ इस अंतर को पठनीय बनाता है, पर मूल पाठ से आगे बढ़कर समुदाय का नाम नहीं जोड़ता।
- issue: ᾔσθοντο τοῦ κυρίου में पहचान का स्वरूप
  choice: ‘उन्होंने प्रभु को पहचाना’
  alternative: ‘उन्हें प्रभु का बोध हुआ’ या ‘वे प्रभु के विषय में सचेत हुए’
  rationale: यूनानी अभिव्यक्ति अनुभूति, बोध या पहचान को सूचित कर सकती है; यह आवश्यक रूप से पूर्ण विश्वास या धर्म-स्वीकार नहीं बताती। मुख्य पाठ में संक्षिप्तता और धर्मवैचारिक खुलापन बनाए रखा गया है, और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘अपने ही दण्डों’ से मूल की विडंबना उभरती है; ‘भला हो रहा है’ अधिक कृत्रिम ‘लाभान्वित किए जा रहे हैं’ की अपेक्षा सामान्य पाठकों के लिए स्वाभाविक है।
