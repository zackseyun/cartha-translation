lexical_decisions:
- source_word: Εὐόδωσεν
  choice: सफल बनाया
  rationale: यह क्रिया किसी कार्य को सफल करने या उन्नति देने का कारक अर्थ रखती है। आधुनिक हिन्दी में ‘सफल बनाया’ इस अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: τὰ ἔργα αὐτῶν
  choice: उनके कार्यों को
  rationale: ἔργα व्यापक शब्द है, जिसका अर्थ कार्य, कर्म या उद्यम हो सकता है। ‘कार्य’ इस संक्षिप्त कथन में व्यापकता बनाए रखता है।
- source_word: ἐν χειρὶ
  choice: के हाथों
  rationale: यह सामी प्रभाव वाला यूनानी मुहावरा माध्यम या कर्तृत्व को दर्शाता है। ‘के हाथों’ बाइबलीय भाव और नबी की माध्यमिक भूमिका दोनों को सुरक्षित रखता है।
- source_word: προφήτου ἁγίου
  choice: एक पवित्र नबी
  rationale: यूनानी में निश्चित उपपद नहीं है और नबी का नाम नहीं दिया गया; इसलिए ‘एक पवित्र नबी’ मूल की अनिश्चितता को बनाए रखता है।
