- issue: पवित्र नबी की पहचान
  choice: मुख्य पाठ में ‘एक पवित्र नबी’ रखा गया।
  alternative: ‘मूसा’ अथवा ‘उसका पवित्र नबी’
  rationale: आस-पास का प्रसंग संभवतः मूसा की ओर संकेत करता है, पर इस पद के यूनानी पाठ में उनका नाम या स्वत्वसूचक सर्वनाम नहीं है।
