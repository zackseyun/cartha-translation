base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/010.yaml
  text: For these you tested by admonishing them as a father[b][a], but those you examined by condemning them as a stern king.
translation:
  language: hi
  text: क्योंकि इन्हें तो आपने पिता की तरह समझाते हुए[a] परखा, पर उन्हें कठोर[b] राजा की तरह दोषी ठहराते हुए जाँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चेतावनी देते हुए।”
    reason: lexical_alternative
  - marker: b
    text: या, “सख्त।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: इन्हें तो ... पर उन्हें
  rationale: दो समूहों के बीच यूनानी पाठ के स्पष्ट विरोध को बनाए रखता है, पर उनकी पहचान को पाठ से अधिक स्पष्ट नहीं करता।
- source_word: ὡς πατὴρ
  choice: पिता की तरह
  rationale: पिता की उपमा और सुधारात्मक स्नेह का बिंब सीधे तथा स्वाभाविक हिंदी में सुरक्षित रहता है।
- source_word: νουθετῶν
  choice: समझाते हुए
  rationale: यह केवल शिक्षा देने के बजाय सुधार के उद्देश्य से समझाने या चेतावनी देने का भाव रखता है; ‘समझाते हुए’ सहज हिंदी में इस भाव को व्यक्त करता है।
- source_word: ἐδοκίμασας
  choice: परखा
  rationale: चरित्र या गुण की परीक्षा करने का भाव देता है और पहले खंड की सुधारात्मक प्रक्रिया के अनुकूल है।
- source_word: ἀπότομος
  choice: कठोर
  rationale: राजकीय न्याय की तीव्रता और अनमनीय कठोरता व्यक्त करता है, बिना अनावश्यक रूप से क्रूरता का अर्थ जोड़ने के।
- source_word: βασιλεὺς
  choice: राजा
  rationale: मूल शब्द का सीधा और प्रसंगानुकूल अर्थ है तथा राजकीय न्याय का बिंब बनाए रखता है।
- source_word: καταδικάζων
  choice: दोषी ठहराते हुए
  rationale: प्रतिकूल न्यायिक निर्णय का भाव स्पष्ट करता है और केवल सामान्य न्याय करने से अधिक सटीक है।
- source_word: ἐξήτασας
  choice: जाँचा
  rationale: पहले खंड के ‘परखा’ से शब्दगत भेद रखते हुए बारीकी से जाँचने का भाव व्यक्त करता है।
theological_decisions:
- issue: दो समूहों के प्रति परमेश्वर के भिन्न व्यवहार
  choice: पहले समूह को पिता की तरह सुधारात्मक रीति से परखा गया, जबकि दूसरे को कठोर राजा की तरह दोषी ठहराते हुए जाँचा गया।
  alternative: दोनों खंडों को केवल सामान्य ‘परीक्षा’ के रूप में अनूदित किया जा सकता था।
  rationale: यूनानी पाठ दोनों खंडों में अलग उपमाएँ और अलग क्रियाएँ रखता है। अनुवाद पिता-सदृश सुधार और राजा-सदृश दंडात्मक न्याय के बीच तनाव को समतल नहीं करता।
- issue: ईश्वर को संबोधित करने का हिंदी सम्मान-सूचक रूप
  choice: आपने
  alternative: तूने
  rationale: यूनानी क्रिया द्वितीय पुरुष एकवचन है, पर उसमें हिंदी जैसी सम्मान-श्रेणी चिह्नित नहीं होती। आधुनिक मानक हिंदी में ‘आपने’ सीधा संबोधन बनाए रखते हुए स्वाभाविक और गरिमापूर्ण है।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध वाक्य। ‘इन्हें ... उन्हें’ का विरोध, पिता और राजा की समानांतर उपमाएँ, तथा ‘परखा’ और ‘जाँचा’ का मूलभूत भेद सुरक्षित रखा गया है।
