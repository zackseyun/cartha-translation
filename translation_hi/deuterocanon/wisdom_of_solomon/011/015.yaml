  alternative: अन्याय; दुष्टता
  rationale: यह पद भ्रष्ट सोच, मूर्तिपूजा और ईश्वरीय न्याय को जोड़ता है; ‘अधार्मिकता’ इस व्यापक धार्मिक-नैतिक संबंध को सुरक्षित रखती है।
