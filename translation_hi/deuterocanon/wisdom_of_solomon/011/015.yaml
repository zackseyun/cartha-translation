  text: परन्तु उनकी अधार्मिकता के मूर्खतापूर्ण तर्क-विचारों के बदले में[a]—जिनके कारण भटककर वे विवेकहीन रेंगनेवाले जीवों और तुच्छ पशुओं की उपासना करते थे—तूने उन्हें दण्ड देने के लिए[c] विवेकहीन जीवों की भीड़ भेजी[b]।
