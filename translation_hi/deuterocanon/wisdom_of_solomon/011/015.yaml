  alternative: बुद्धिहीन ... जंगली; निर्बुद्धि ... विवेकहीन
  rationale: एक ही हिन्दी शब्द की पुनरावृत्ति उस विडम्बना को प्रकट करती है कि विवेकहीन जीवों की उपासना करनेवालों को विवेकहीन जीवों से दण्ड मिला।
- issue: ईश्वर के लिए द्वितीय पुरुष एकवचन
  choice: तूने
  alternative: आपने
  rationale: यह परमेश्वर को सीधे सम्बोधित करनेवाली प्रार्थनात्मक शैली और यूनानी एकवचन को रखता है; हिन्दी बाइबिलीय-काव्य भाषा में यह आत्मीय है, अनादरपूर्ण नहीं।
