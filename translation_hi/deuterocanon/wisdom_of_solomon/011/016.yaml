translation:
  language: hi
  text: ताकि वे जानें कि जिन चीज़ों के द्वारा कोई पाप करता है,[a] उन्हीं के द्वारा उसे दंड दिया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “जिन साधनों से कोई पाप करता है, उन्हीं साधनों से उसे दंड दिया जाता है।” यूनानी में “के द्वारा” के लिए एक ही पूर्वसर्ग की पुनरावृत्ति पाप और दंड के बीच के अनुरूप संबंध पर बल देती है।
    reason: lexical_alternative
