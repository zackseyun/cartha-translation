- source_word: ἵνα γνῶσιν
  choice: ताकि वे जान लें
  rationale: ἵνα के उद्देश्य अथवा अभिप्रेत परिणाम और अओरिस्ट सब्जंक्टिव γνῶσιν को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διʼ ὧν ... διὰ τούτων
  choice: जिन चीज़ों के द्वारा ... उन्हीं के द्वारा
  rationale: दोहराए गए διά की साधनवाचकता और पाप के साधन तथा दण्ड के साधन के बीच बलयुक्त अनुरूपता को सुरक्षित रखता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित एकवचन के सामान्य मानवीय संदर्भ को स्वाभाविक और समावेशी हिन्दी में व्यक्त करता है।
- source_word: ἁμαρτάνει
  choice: पाप करता है
  rationale: क्रिया के नैतिक और धर्मवैज्ञानिक अर्थ को 'गलती करता है' जैसे अपेक्षाकृत हल्के विकल्प की तुलना में अधिक ठीक रूप से रखता है।
- source_word: κολάζεται
  choice: उसे दण्ड दिया जाता है
  rationale: इस प्रसंग में न्यायस्वरूप दण्ड के निष्क्रिय अर्थ को स्पष्ट करता है, बिना इसे केवल सुधारात्मक अनुशासन या यातना तक सीमित किए।
theological_decisions:
- issue: कर्म के अनुरूप दैवी न्याय
  choice: जिन साधनों से कोई पाप करता है, उन्हीं के द्वारा उसे दण्ड मिलता है।
  alternative: पापी को उसके पाप के संबंध में सामान्य रूप से दण्ड मिलता है, पर साधनों की सीधी अनुरूपता पर बल नहीं है।
  rationale: διʼ ὧν ... διὰ τούτων की समानांतर पुनरावृत्ति पाप और दण्ड के साधनों के बीच उपयुक्त प्रतिफल की धारणा पर स्पष्ट बल देती है; अनुवाद इसे बनाए रखता है, पर मूल से आगे बढ़कर पूर्णतः यांत्रिक समानता का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। 'जिन चीज़ों के द्वारा ... उन्हीं के द्वारा' जानबूझकर समानांतर रखा गया है ताकि यूनानी की पुनरावृत्ति और बल सुरक्षित रहें।
