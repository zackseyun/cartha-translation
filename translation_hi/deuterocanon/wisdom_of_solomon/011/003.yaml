- source_word: ἀντέστησαν
  choice: सामना किया
  rationale: ἀνθίστημι का यह रूप किसी के विरुद्ध खड़े होने या उसका प्रतिरोध करने को व्यक्त करता है। ‘सामना किया’ आधुनिक हिन्दी में स्वाभाविक है और विरोध के ठोस भाव को बनाए रखता है।
- source_word: πολεμίοις
