  rationale: πολέμιος यहाँ युद्धरत या प्रतिकूल विरोधियों के लिए प्रयुक्त है। ‘शत्रु’ इसके सैन्य और वैमनस्यपूर्ण अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἠμύναντο
  choice: अपनी रक्षा की
  rationale: ἀμύνω के मध्यवाच्य रूप में अपने बचाव के लिए रोकने, दूर रखने या प्रतिकार करने का भाव हो सकता है। ‘अपनी रक्षा की’ मध्यवाच्य के आत्म-संबंधी संकेत को स्वाभाविक हिन्दी में व्यक्त करता है, पर आक्रामक कार्रवाई को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐχθρούς
  choice: बैरियों
  rationale: ἐχθρός भी शत्रु या विरोधी को दर्शाता है। ‘बैरी’ पहले प्रयुक्त ‘शत्रु’ की यांत्रिक पुनरावृत्ति से बचाते हुए यूनानी के निकट-समानार्थी समानांतर को बनाए रखता है।
