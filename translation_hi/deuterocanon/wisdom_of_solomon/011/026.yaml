  rationale: यह पद स्वामित्व और अधिकार रखनेवाले स्वामी को सूचित करता है तथा κύριος जैसे अन्य यूनानी पद से भेद को यथासंभव बनाए रखता है।
- source_word: φιλόψυχε
  choice: जीवन से प्रेम करनेवाले
  rationale: यौगिक पद ψυχή/जीवन या प्राणी से प्रेम का भाव रखता है। सृष्टि के व्यापक प्रसंग में यह रूप केवल मानव आत्माओं तक अर्थ को सीमित नहीं करता।
- source_word: ἄφθαρτόν
  choice: अविनाशी
  rationale: जो नष्ट, क्षीण या भ्रष्ट नहीं होता उसके लिए यह स्पष्ट, प्रतिष्ठित और आधुनिक हिन्दी शब्द है।
- source_word: πνεῦμά
  choice: आत्मा
  rationale: यहाँ परमेश्वर की जीवनदायी उपस्थिति का भाव है; ‘आत्मा’ धार्मिक और साहित्यिक बल को सुरक्षित रखता है, जबकि ‘श्वास’ अर्थ को अनावश्यक रूप से संकुचित कर सकता है।
- source_word: ἐν πᾶσιν
  choice: सबमें
  rationale: यह संक्षिप्त हिन्दी रूप सार्वभौमिक सृष्टिगत विस्तार को बनाए रखता और पहले आए πάντων की प्रतिध्वनि करता है।
theological_decisions:
- issue: φιλόψυχε में परमेश्वर के प्रेम का विषय
  choice: जीवन से प्रेम करनेवाले
  alternative: प्राणियों से प्रेम करनेवाले; आत्माओं से प्रेम करनेवाले
  rationale: निकटवर्ती संदर्भ में परमेश्वर सबको इसलिए बचाए रखता है कि वे उसके हैं, और उसका अविनाशी आत्मा सबमें है। अतः व्यापक जीवन-संबंधी अर्थ मुख्य पाठ में रखा गया है, जबकि अधिक संकीर्ण शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: Δέσποτα का दिव्य संबोधन
  choice: स्वामी
  alternative: प्रभु; अधिपति
  rationale: ‘स्वामी’ मूल पद के स्वामित्व और पूर्ण अधिकार के भाव को बनाए रखता है और इसे κύριος के सामान्य अनुवाद में विलीन नहीं करता।
- issue: τὸ ἄφθαρτόν σου πνεῦμα ἐν πᾶσιν का आशय
  choice: आपका अविनाशी आत्मा सबमें है
  alternative: आपकी अविनाशी श्वास सबमें है
  rationale: मूल कथन की व्यापकता और धर्मवैचारिक तनाव को बिना यह निर्धारित किए रखा गया है कि ‘सबमें’ उपस्थिति का ठीक स्वरूप क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप। आदरसूचक ‘आप’ और बहुवचन क्रिया का प्रयोग किया गया है। ‘दया करके बचाए रखते हैं’ φείδῃ के बख्शने तथा विनाश से रोक रखने—दोनों भावों को स्वाभाविक हिन्दी में समेटता है।
