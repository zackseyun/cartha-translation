- source_word: σά ἐστιν
  choice: वे आपके हैं
  rationale: यूनानी का संबंध पहले आए बहुव्यापक πάντων से है; हिन्दी में बहुवचन सर्वनाम इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
