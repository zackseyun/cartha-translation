base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: hi
  text: परन्तु आप सबको बख्शते हैं, क्योंकि वे आपके हैं, हे जीवन से प्रेम करनेवाले स्वामी![a] क्योंकि आपका अविनाशी आत्मा सबमें है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे प्राणियों से प्रेम करनेवाले स्वामी!” अथवा अधिक शाब्दिक रूप से, “हे आत्माओं से प्रेम करनेवाले स्वामी!” यूनानी शब्द जीवन या आत्मा से प्रेम का भाव दे सकता है; यहाँ प्रसंग समस्त सृष्टि के प्रति परमेश्वर की देखभाल का है।
    reason: lexical_alternative
