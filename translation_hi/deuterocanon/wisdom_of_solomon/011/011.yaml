- source_word: ἐτρύχοντο
  choice: पीड़ित होते रहे
  rationale: अपूर्ण भूतकाल का यह रूप जारी या बार-बार होने वाली पीड़ा तथा थकाकर तोड़ दिए जाने का भाव दे सकता है। ‘पीड़ित होते रहे’ इसकी कालगत निरंतरता बचाता है और पीड़ा का स्वरूप अनावश्यक रूप से संकीर्ण नहीं करता।
