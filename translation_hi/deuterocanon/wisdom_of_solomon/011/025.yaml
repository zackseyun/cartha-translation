base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: hi
  text: भला कोई भी वस्तु कैसे बनी रह सकती थी, यदि आपने न चाहा होता? या जिसे आपने नहीं बुलाया था[a], वह कैसे सुरक्षित रखी जा सकती थी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्पष्ट रूप से, “जिसे आपने अस्तित्व में आने के लिए नहीं बुलाया था।” यूनानी में केवल “बुलाया” है, पर प्रसंग में यह परमेश्वर की सृजनकारी पुकार की ओर संकेत कर सकता है।
    reason: ‘बुलाया’ के संभावित सृष्टिसंबंधी अर्थ को स्पष्ट करना, बिना उसे मुख्य पाठ में अनिवार्य ठहराए।
lexical_decisions:
- source_word: πῶς δὲ
  choice: क्योंकि ... कैसे
  rationale: यह पद पिछले कथन का आधार देते हुए अलंकारिक प्रश्न करता है। हिन्दी में ‘क्योंकि ... कैसे’ इस संबंध और निहित असंभवता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔμεινεν ἄν τι
  choice: तो कोई भी वस्तु कैसे बनी रहती
  rationale: μένω यहाँ टिके रहने या अस्तित्व में बने रहने का भाव देता है; ‘बनी रहती’ स्रोत से अधिक व्याख्या जोड़े बिना निरंतरता बताता है। ἄν τι की व्यापक अनिश्चितता ‘कोई भी वस्तु’ से व्यक्त होती है।
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: यदि आपने न चाहा होता
  rationale: θέλω इच्छा और संकल्प दोनों को व्यक्त कर सकता है। ‘चाहा होता’ आधुनिक हिन्दी में स्वाभाविक है और ‘इच्छा की होती’ की अपेक्षा कम कृत्रिम रहते हुए उद्देश्यपूर्ण इच्छा का अर्थ बनाए रखता है।
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: जिसे आपने नहीं बुलाया था
  rationale: κληθέν का सीधा अर्थ ‘बुलाया गया’ है। मुख्य पाठ में ‘अस्तित्व में’ नहीं जोड़ा गया, ताकि यूनानी की संक्षिप्तता और संभावित अर्थगत खुलापन बना रहे।
- source_word: διετηρήθη
  choice: सुरक्षित रह सकती थी
  rationale: διατηρέω किसी वस्तु को बचाए या कायम रखे जाने का भाव देता है। प्रतिकल्पनात्मक अलंकारिक प्रश्न में ‘सुरक्षित रह सकती थी’ स्वाभाविक हिन्दी है और संरक्षण का निष्क्रिय भाव बनाए रखता है।
theological_decisions:
- issue: क्या τὸ μὴ κληθέν को मुख्य पाठ में सृष्टि के लिए परमेश्वर की प्रभावकारी पुकार के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में शाब्दिक रूप से ‘जिसे आपने नहीं बुलाया था’ रखा गया
  alternative: ‘जिसे आपने अस्तित्व में नहीं बुलाया था’
  rationale: आस-पास का प्रसंग परमेश्वर की सृजनकारी और संभालने वाली इच्छा की ओर संकेत कर सकता है, पर यूनानी में केवल ‘बुलाया’ कहा गया है। इसलिए व्याख्यात्मक विस्तार को पाद-टिप्पणी में रखा गया है, मुख्य पाठ में नहीं।
- issue: परमेश्वर के लिए द्वितीय पुरुष संबोधन का स्तर
  choice: सम्मानसूचक ‘आप’
  alternative: परंपरागत एकवचन ‘तू’
  rationale: आधुनिक मानक हिन्दी में ‘आप’ सामान्य पाठकों के लिए स्वाभाविक और आदरपूर्ण है; इससे स्रोत के एकवचन संबोधन का आशय नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ का प्रयोग किया गया है। दोनों अलंकारिक प्रश्नों की प्रतिकल्पनात्मक शक्ति और सृष्टि के परमेश्वर की इच्छा तथा संरक्षण पर निर्भर होने का भाव सुरक्षित रखा गया है।
