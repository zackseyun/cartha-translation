  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को सम्बोधन में एकवचन ‘तू’ मूल के निकट और प्रार्थनात्मक-बाइबिलीय शैली के अनुरूप है। अर्धविराम यूनानी वाक्य के दो निकट सम्बद्ध कथनों को स्पष्ट करता है।
