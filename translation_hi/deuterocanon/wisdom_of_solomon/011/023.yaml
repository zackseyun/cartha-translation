    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεεῖς
  choice: दया करता है
  rationale: यह क्रिया करुणापूर्ण दया दिखाने को व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और धर्मवैचारिक भारयुक्त है।
- source_word: πάντας
  choice: सब पर
  rationale: सन्दर्भ में इसका विस्तार सभी मनुष्यों तक है; संक्षिप्त ‘सब पर’ यूनानी की सार्वभौमिकता बनाए रखता है।
- source_word: πάντα δύνασαι
  choice: तू सब कुछ कर सकता है
  rationale: यह परमेश्वर की सर्वव्यापक सामर्थ्य को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: παρορᾷς
  choice: अनदेखा करता है
  rationale: यहाँ अर्थ पाप को तुच्छ मानना नहीं, बल्कि पश्चात्ताप का अवसर देने के लिए तत्काल दण्ड न देना है; इस आशय को पादटिप्पणी स्पष्ट करती है।
- source_word: ἁμαρτήματα ἀνθρώπων
  choice: मनुष्यों के पापों
  rationale: ‘मनुष्यों’ यहाँ समस्त मानवजाति के लिए सामान्य और स्वाभाविक हिन्दी पद है; ‘पाप’ ἁμαρτήματα का स्पष्ट मानक अनुवाद है।
- source_word: εἰς μετάνοιαν
  choice: ताकि वे मन फिराएँ
  rationale: εἰς उद्देश्य या परिणति व्यक्त कर सकता है। क्रियात्मक हिन्दी इस आशय को स्वाभाविक बनाती है, जबकि मूल की सम्भावित उद्देश्य-परिणाम व्यापकता बनी रहती है।
theological_decisions:
- issue: παρορᾷς ἁμαρτήματα में ईश्वरीय सहनशीलता
  choice: परमेश्वर पश्चात्ताप का अवसर देने के लिए पापों पर तत्काल दण्ड नहीं देता।
  alternative: परमेश्वर पापों को महत्त्वहीन मानकर उनकी उपेक्षा करता है, अथवा इसी वाक्यांश में उन्हें पूर्णतः क्षमा कर देता है।
  rationale: εἰς μετάνοιαν इस कार्य को पश्चात्ताप की ओर उन्मुख करता है। इसलिए न तो नैतिक उदासीनता और न ही तत्काल पूर्ण क्षमा को पाठ में आरोपित किया गया है।
- issue: εἰς μετάνοιαν का सम्बन्ध
  choice: ‘ताकि वे मन फिराएँ’—उद्देश्य की स्वाभाविक हिन्दी अभिव्यक्ति
  alternative: ‘मन फिराव के लिए’ या ‘मन फिराव की ओर’
  rationale: यूनानी वाक्यांश उद्देश्य अथवा परिणाम दोनों की छाया रख सकता है। हिन्दी में क्रियात्मक रूप स्पष्ट है, पर पादटिप्पणी अनावश्यक रूप से किसी कठोर धर्मवैचारिक क्रम को निर्धारित नहीं करती।
