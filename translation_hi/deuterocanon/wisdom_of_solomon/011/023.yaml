translation:
  language: hi
  text: परन्तु तू सब पर दया करता है, क्योंकि तू सब कुछ कर सकता है; और तू मनुष्यों के पापों को अनदेखा करता है[a], ताकि वे मन फिराएँ।
  philosophy: optimal-equivalence
  footnotes:
