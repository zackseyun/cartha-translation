  text: or foul masses of smoke being winnowed[a], or terrible sparks flashing from their eyes—whose harm was able not only to crush them together, but even their frightening appearance to destroy them.
translation:
  language: hi
  text: या धुएँ के घृणित गुच्छे, जो भूसी की तरह उड़ाए जा रहे हों[a], या उनकी आँखों से चमकती भयानक चिंगारियाँ—इनसे होने वाली हानि न केवल उन्हें कुचल सकती थी, बल्कि उनका भयावह रूप ही उन्हें नष्ट कर सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “धुएँ के घृणित गुच्छे, जो पछोरे जा रहे हों।” यूनानी में अनाज को पछोरकर हवा में उड़ाने की कृषि-छवि है; इसका अर्थ “घृणित धुएँ के घूमते बादल” भी हो सकता है।'
    reason: दुर्लभ शब्द और कृषि-रूपक के कारण वैकल्पिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: βρόμους λικμωμένους καπνοῦ
  choice: धुएँ के घृणित गुच्छे, जो भूसी की तरह उड़ाए जा रहे हों
  rationale: βρόμους की दुर्लभ और घृणित/हानिकारक वस्तु की ठोस छवि को ‘घृणित गुच्छे’ से रखा गया है। λικμωμένους में अनाज पछोरने की कृषि-छवि है; हिंदी में केवल ‘पछोरे जाते’ धुएँ के साथ अस्पष्ट होता, इसलिए उपमा के रूप में इसे स्वाभाविक और बोधगम्य बनाया गया है।
- source_word: δεινοὺς ... σπινθῆρας ἀστράπτοντας
  choice: चमकती भयानक चिंगारियाँ
  rationale: δεινούς यहाँ नैतिक बुराई नहीं, आतंक उत्पन्न करने वाला गुण बताता है; ἀστράπτοντας बिजली-जैसी आकस्मिक चमक का बोध देता है।
- source_word: ἀπʼ ὀμμάτων
  choice: उनकी आँखों से
  rationale: पूर्वसर्गीय पद को सीधे रखा गया है; संदर्भानुसार आँखें उन भयानक जीवों की हैं।
- source_word: ἡ βλάβη ἠδύνατο συνεκτρῖψαι αὐτούς
  choice: इनसे होने वाली हानि ... उन्हें कुचल सकती थी
  rationale: βλάβη का व्यापक अर्थ ‘हानि’ रखा गया है। συνεκτρῖψαι की तीव्र विनाशकारी शक्ति ‘कुचल’ में आती है; συν- को अनिवार्यतः ‘एक साथ’ मानकर कृत्रिम हिंदी नहीं बनाई गई।
- source_word: ἡ ὄψις ἐκφοβήσασα διολέσαι
  choice: उनका भयावह रूप ही उन्हें नष्ट कर सकता था
  rationale: ग्रीक में ‘दृश्य/रूप’ और भय उत्पन्न करने वाले कृदंत को सहज हिंदी में ‘भयावह रूप’ कहा गया है; ‘ही’ इस बात पर बल देता है कि केवल दिखाई देना भी विनाशकारी हो सकता था।
theological_decisions:
- issue: अत्यंत संक्षिप्त और विचित्र दैत्याकार बिंबों की शाब्दिकता
  choice: धुएँ के घृणित गुच्छों, पछोरने की कृषि-छवि और आँखों से चमकती चिंगारियों को बनाए रखा गया है।
  alternative: इसे पूरी तरह सहज बनाकर ‘दुर्गंधमय धुएँ के घूमते बादल’ कहना।
  rationale: मूल यूनानी की काव्यात्मक विचित्रता और भयावहता पाठ का सार्थक अंग है; फिर भी हिंदी में कृषि-रूपक समझाने के लिए संक्षिप्त उपमा दी गई है।
- issue: ὧν का संबंध
  choice: ‘इनसे होने वाली हानि’ द्वारा धुएँ के गुच्छों और चिंगारियों को सामूहिक पूर्वपद माना गया है।
  alternative: संबंधवाचक पद को केवल निकटतम ‘चिंगारियों’ से जोड़ना।
  rationale: बहुवचन संबंधवाचक सर्वनाम पूर्ववर्ती दोनों भयावह रूपों को सामूहिक रूप से समेट सकता है; हिंदी में ‘इनसे’ इस व्यापक संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए बोधगम्य रूप। वाक्य पूर्ववर्ती संदर्भ से जुड़ता है, इसलिए आरंभ में ‘या’ रखा गया है। मूल की भयावह काव्यात्मक छवि को अनावश्यक व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
