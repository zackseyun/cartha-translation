  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: hi
  text: क्योंकि आप जो कुछ अस्तित्व में है, उस सब से प्रेम करते हैं, और अपनी बनाई हुई किसी भी वस्तु से घृणा नहीं करते; क्योंकि यदि आप किसी वस्तु से बैर रखते, तो उसे गढ़ते ही नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: आप ... से प्रेम करते हैं
  rationale: वर्तमान काल के क्रियापद का सीधा और स्वाभाविक हिन्दी रूप; यह सकारात्मक, इच्छापूर्ण प्रेम को बिना भावार्थ बढ़ाए व्यक्त करता है।
- source_word: τὰ ὄντα πάντα
  choice: उन सभी वस्तुओं ... जो अस्तित्व में हैं
  rationale: ὄντα के अस्तित्व-संबंधी विस्तार को बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: οὐδὲν βδελύσσῃς
  choice: किसी भी वस्तु से घृणा नहीं करते
  rationale: βδελύσσομαι की तीव्र अरुचि और घृणा का अर्थ व्यक्त करता है; 'घृणा' साधारण पाठक के लिए स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: ὧν ἐποίησας
  choice: अपनी बनाई हुई किसी भी वस्तु
  rationale: ποιέω का सीधा अर्थ 'बनाना' रखा गया है; 'सृष्टि करना' जोड़कर अनावश्यक धर्मवैज्ञानिक विशिष्टता नहीं लाई गई।
- source_word: μισῶν τι
  choice: किसी वस्तु से बैर रखा होता
  rationale: ἂν के साथ यह भूतकालीन अवास्तविक शर्त है। 'बैर रखा होता' μισέω को स्पष्ट करता है और पहले प्रयुक्त 'घृणा' से हिन्दी में पठनीय भेद रखता है।
- source_word: κατεσκεύασας
  choice: उसे गढ़ा ... न होता
  rationale: κατασκευάζω के सोद्देश्य रूप देने या तैयार करने के भाव को दर्शाता है और पहले के ἐποίησας, 'बनाई', से सूक्ष्म भेद बचाता है।
theological_decisions:
- issue: ईश्वरीय प्रेम और सृष्टि का संबंध
  choice: पद कहता है कि परमेश्वर अस्तित्व में आने वाली सभी वस्तुओं से प्रेम करते हैं और अपनी बनाई किसी वस्तु से घृणा नहीं करते; इसका आधार यह तर्क है कि जिससे वे बैर रखते, उसे गढ़ते नहीं।
  alternative: इसे यह अधिक प्रबल दावा मानना कि परमेश्वर सृष्टि की हर वर्तमान दशा को बिना किसी भेद के स्वीकार करते हैं, अथवा इसे केवल सृष्टि की आरंभिक भलाई तक सीमित करना।
  rationale: यूनानी पाठ की व्यापक भाषा और उसका आंतरिक तर्क ज्यों का त्यों रखा गया है; बाद की धर्मवैज्ञानिक सीमाएँ या समाधान अनुवाद में नहीं जोड़े गए।
