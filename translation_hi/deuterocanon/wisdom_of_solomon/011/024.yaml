  register: आधुनिक मानक हिन्दी में आदरार्थक एकवचन 'आप' और उसके अनुरूप बहुवचन क्रिया-रूप अपनाए गए हैं। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। 'वस्तु' का प्रयोग निर्जीवता का दार्शनिक दावा करने के लिए नहीं, बल्कि यूनानी नपुंसकलिंग बहुवचन के व्यापक अर्थ—जो कुछ अस्तित्व में है—को समेटने के लिए किया गया है।
