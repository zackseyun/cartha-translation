base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: hi
  text: उन्हें प्यास लगी और उन्होंने तुझे पुकारा[a], और उन्हें खड़ी चट्टान से पानी दिया गया, और कठोर पत्थर से प्यास की औषधि[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे प्यासे थे और उन्होंने तुझे पुकारा।”
    reason: क्रियापद ἐδίψησαν को हिन्दी में अनुभूति (‘उन्हें प्यास लगी’) या अवस्था (‘वे प्यासे थे’) के रूप में व्यक्त किया जा सकता है।
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “प्यास की औषधि” है; पानी को प्यास दूर करने वाले आरोग्यकारी उपाय के रूप में चित्रित किया गया है।
    reason: मूल पाठ के चिकित्सकीय रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: ἐδίψησαν
  choice: वे प्यासे हुए
  rationale: यह यूनानी क्रिया की पूर्ण घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘उन्हें प्यास लगी’ भी संभव है, पर चुना हुआ रूप अगले क्रियापद के साथ समानांतर रहता है।
- source_word: ἐπεκαλέσαντό σε
  choice: उन्होंने तुझे पुकारा
  rationale: यह संकट में परमेश्वर को पुकारने या उससे सहायता माँगने का भाव रखता है और हिन्दी में प्रार्थनापूर्ण संबोधन के रूप में सहज है।
- source_word: ἐδόθη αὐτοῖς
  choice: उन्हें ... दिया गया
  rationale: यूनानी के कर्मवाच्य को बनाए रखा गया है। प्रसंग में देने वाला परमेश्वर है, पर मूल वाक्य इस खंड में उसे स्पष्ट कर्ता नहीं बनाता।
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: खड़ी चट्टान से
  rationale: ἀκρότομος तीखी कटी हुई या लगभग सीधी उठी चट्टान का बोध देता है। ‘खड़ी चट्टान’ असंभव-से स्रोत से जल मिलने की छवि को संक्षेप में रखता है।
- source_word: ὕδωρ
  choice: पानी
  rationale: सामान्य आधुनिक हिन्दी में इसका सीधा और स्वाभाविक समतुल्य ‘पानी’ है।
- source_word: ἄκος δίψης
  choice: प्यास की औषधि
  rationale: ἄκος उपचार या औषधि है। यह चयन पानी को केवल राहत नहीं, बल्कि प्यास का आरोग्यकारी उपाय बताने वाले काव्यात्मक रूपक को बनाए रखता है।
- source_word: ἐκ λίθου σκληροῦ
  choice: कठोर पत्थर से
  rationale: यह σκληρός के मूल अर्थ को रखते हुए पहले खंड के साथ काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: क्या पानी देने वाले के रूप में परमेश्वर को वाक्य में स्पष्ट करना है
  choice: कर्मवाच्य ‘उन्हें ... दिया गया’ रखा गया है।
  alternative: ‘तूने उन्हें पानी दिया’
  rationale: प्रसंग परमेश्वर की ही व्यवस्था की ओर संकेत करता है, फिर भी यूनानी पाठ कर्मवाच्य द्वारा कर्ता को इस खंड में अनकहा छोड़ता है; अनुवाद उसी संयम को सुरक्षित रखता है।
- issue: ἄκος δίψης के चिकित्सकीय रूपक की शक्ति
  choice: ‘प्यास की औषधि’
  alternative: ‘प्यास से राहत’
  rationale: ‘राहत’ अधिक सहज है, पर वह ἄκος के उपचारात्मक और काव्यात्मक बल को घटा देती है। चुना हुआ पाठ ईश्वरीय प्रबंध को आरोग्यकारी उपाय के रूप में प्रस्तुत करने वाली छवि बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक रजिस्टर रखा गया है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तुझे’ अपनाया गया है। ‘प्यास की औषधि’ सामान्य गद्य से अधिक काव्यात्मक है, पर मूल यूनानी रूपक को जानबूझकर सुरक्षित रखता है।
