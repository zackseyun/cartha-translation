  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सर्वशक्तिमान हाथ’ का मूल रूपक तथा ‘असमर्थ नहीं था’ की यूनानी न्यूनोक्ति सुरक्षित रखी गई है। पद के अंत का अल्पविराम अगले पद से जारी रहने वाले वाक्य का संकेत देता है।
