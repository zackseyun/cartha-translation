  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: hi
  text: क्योंकि आपका सर्वशक्तिमान हाथ, जिसने रूपहीन पदार्थ से[a] संसार की सृष्टि की, उन पर भालुओं की बड़ी भीड़ या हिंस्र सिंहों का दल भेजने में असमर्थ नहीं था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अव्यवस्थित पदार्थ से।” यह यूनानी पदबंध हेलेनवादी सृष्टितात्त्विक अभिव्यक्ति को प्रतिबिम्बित करता है; सृष्टि की रीति से जुड़े बाद के धर्मसैद्धान्तिक विवादों का निर्णय करने के लिए इस पद पर आवश्यकता से अधिक बल नहीं देना चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπόρει
  choice: असमर्थ नहीं था
  rationale: नकार सहित यह क्रिया साधनों या सामर्थ्य की कमी न होने का भाव देती है। यह अनुवाद यूनानी की न्यूनोक्ति को बनाए रखता है।
- source_word: παντοδύναμός ... χείρ
  choice: सर्वशक्तिमान हाथ
  rationale: ‘हाथ’ परमेश्वर की सक्रिय शक्ति का रूपक है; उसे बनाए रखने से मूल बिंब और παντοδύναμος का पूर्ण सामर्थ्य—दोनों सुरक्षित रहते हैं।
- source_word: κτίσασα τὸν κόσμον
  choice: जिसने ... संसार की सृष्टि की
  rationale: स्त्रीलिंग कृदन्त ‘हाथ’ का विशेषण है और सृष्टि-कार्य को परमेश्वर की सामर्थ्य के प्रमाण के रूप में प्रस्तुत करता है।
- source_word: ἐξ ἀμόρφου ὕλης
  choice: निराकार पदार्थ से
  rationale: यह यूनानी पदबंध के दार्शनिक-सृष्टितात्त्विक स्वर को बिना किसी बाद के धर्मसैद्धान्तिक निष्कर्ष को आरोपित किए निकटता से व्यक्त करता है।
- source_word: ἐπιπέμψαι αὐτοῖς
  choice: उन पर ... भेजने में
  rationale: ἐπιπέμπω में किसी पर या उसके विरुद्ध भेजने का भाव है; ‘उन पर भेजना’ न्याय के प्रसंग और मूल दिशा-बोध दोनों को व्यक्त करता है।
- source_word: πλῆθος ἄρκων
  choice: भालुओं का झुंड
  rationale: πλῆθος की बहुलता को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘भालू’ कहने से उसका परिमाण-सूचक बल घट जाता।
- source_word: θρασεῖς λέοντας
  choice: हिंस्र सिंह
  rationale: θρασύς का मूल भाव निर्भीक या दुस्साहसी हो सकता है, पर दण्ड के लिए भेजे जाने वाले शिकारी पशुओं के संदर्भ में ‘हिंस्र’ उसका धमकीपूर्ण आशय स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: परमेश्वर के सामर्थ्य के विषय में न्यूनोक्ति
  choice: असमर्थ नहीं था
  alternative: भेज सकता था
  rationale: मूल पाठ सीधे ‘भेज सकता था’ न कहकर सामर्थ्य की कमी का निषेध करता है। चुना हुआ रूप उसी वक्तृत्वात्मक तनाव को बनाए रखता है।
- issue: ἐξ ἀμόρφου ὕλης का सृष्टितात्त्विक अर्थ
  choice: निराकार पदार्थ से
  alternative: अरचित पदार्थ से
  rationale: मूल वाक्यांश को स्पष्ट रूप से रखा गया है, पर उससे सृष्टि की रीति पर बाद के किसी विशिष्ट धर्मसैद्धान्तिक मत का निर्णय नहीं कराया गया।
