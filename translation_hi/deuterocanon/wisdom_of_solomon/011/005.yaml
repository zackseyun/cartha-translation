translation:
  language: hi
  text: क्योंकि जिन वस्तुओं के द्वारा उनके शत्रुओं को दंड दिया गया, उन्हीं वस्तुओं के द्वारा वे स्वयं, जब उन्हें आवश्यकता थी, लाभान्वित हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
