    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: जिन चीज़ों के द्वारा ... उन्हीं के द्वारा
  rationale: 'दोहराई गई यूनानी संरचना साधन और विडंबनापूर्ण उलटाव पर बल देती है: जिन साधनों से शत्रुओं को दण्ड मिला, उन्हीं से परमेश्वर के लोगों को सहायता मिली।'
- source_word: ἐκολάσθησαν
