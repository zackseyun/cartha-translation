- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: उनके शत्रुओं
  rationale: स्वाभाविक हिन्दी में संबंधसूचक अर्थ को सीधे बनाए रखता है।
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: यह शत्रुओं और लाभ पाने वालों के बीच यूनानी मूल के बलयुक्त विरोध को सुरक्षित रखता है।
- source_word: ἀποροῦντες
  choice: अभाव में
  rationale: कृदन्त असमंजस, असहायता, कठिनाई या आवश्यकता का संकेत दे सकता है। प्रसंग में भौतिक आवश्यकता प्रमुख है, पर पादटिप्पणी व्यापक अर्थक्षेत्र को सुरक्षित रखती है।
- source_word: εὐεργετήθησαν
  choice: सहायता पाए
  rationale: निष्क्रिय रूप उपकार या लाभ प्राप्त करने को दर्शाता है। ‘सहायता पाए’ सहज आधुनिक हिन्दी है और कर्ता को मूल पाठ की तरह अनिर्दिष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय कार्य में साधनात्मक उलटाव
  choice: एक ही साधन से शत्रुओं को दण्ड और परमेश्वर के लोगों को सहायता मिलने का विरोध स्पष्ट रखा गया है।
  alternative: दोहराई गई साधनात्मक संरचना को छोड़कर केवल दण्ड और लाभ का सामान्य विरोध बताया जा सकता था।
  rationale: διʼ ὧν ... διὰ τούτων की पुनरावृत्ति इस खंड के साहित्यिक और धर्मवैचारिक उलटाव के लिए केंद्रीय है; इसे बनाए रखना बिना अतिरिक्त सिद्धान्त जोड़े मूल पाठ की शक्ति को सुरक्षित रखता है।
