  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: hi
  text: और इन बातों के बिना भी वे एक ही फूँक से गिर सकते थे—न्याय द्वारा उनका पीछा किया जाता और आपकी सामर्थ्य की वायु से उन्हें भूसी की तरह उड़ा दिया जाता; पर आपने सब कुछ माप, संख्या और तौल के अनुसार व्यवस्थित किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: और इन बातों के बिना भी
  rationale: χωρίς के संबंधकारक प्रयोग का अर्थ ‘के बिना/से अलग’ है; ‘भी’ पहले वर्णित दंड-साधनों के अतिरिक्त इस संभावना को स्पष्ट करता है।
- source_word: ἐνὶ πνεύματι
  choice: एक ही फूँक से
  rationale: ἐνί का ‘एक ही’ और πνεῦμα का प्रसंगानुकूल ठोस अर्थ ‘फूँक’ लिया गया है; यह तत्काल विनाश की सहज हिंदी अभिव्यक्ति है, जबकि ‘वायु’ या ‘आत्मा’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: πεσεῖν
  choice: गिर सकते थे
  rationale: πίπτω के मूल अर्थ ‘गिरना’ को बनाए रखा गया है; प्रसंग में विनाश निहित है, पर उसे मुख्य पाठ में स्पष्ट करके अर्थ को संकरा नहीं किया गया।
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: न्याय उनका पीछा करता
  rationale: δίκη को ‘न्याय’ रखने से उसके मानवीकरण और नैतिक-न्यायिक बल की रक्षा होती है; हिंदी में सक्रिय उपवाक्य कृदंत की अपेक्षा अधिक स्वाभाविक है।
- source_word: λικμηθέντες
  choice: उन्हें भूसी की तरह उड़ा देती
  rationale: λικμάω के ओसाने और भूसी उड़ाने के कृषि-बिंब को सामान्य आधुनिक हिंदी में स्पष्ट किया गया है; केवल ‘ओसा जाता’ यहाँ कम सहज और अस्पष्ट होता।
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: आपकी सामर्थ्य की वायु
  rationale: विनोइंग के बिंब में πνεῦμα का ‘वायु’ अर्थ सर्वाधिक स्वाभाविक है; δυνάμεώς σου की संबंधवाचक रचना को निकटता से रखा गया है।
- source_word: πάντα ... διέταξας
  choice: आपने सब कुछ ... व्यवस्थित किया है
  rationale: διατάσσω का अर्थ क्रमपूर्वक व्यवस्थित करना है; पूर्ण वर्तमान हिंदी में किए गए दैवी क्रम की स्थायी परिणति सहज रूप से व्यक्त होती है।
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: माप, संख्या और तौल के अनुसार
  rationale: प्रसिद्ध त्रिक और तीनों संज्ञाओं का क्रम सुरक्षित है; σταθμός यहाँ तौल/वजन का बोध देता है।
theological_decisions:
- issue: πνεῦμα को आत्मा, श्वास/फूँक या वायु के रूप में प्रस्तुत करना
  choice: पहले प्रयोग में ‘फूँक’ और ओसाने वाले दूसरे प्रयोग में ‘वायु’
  alternative: दोनों स्थानों पर ‘श्वास’, ‘वायु’ या ‘आत्मा’
  rationale: दोनों प्रयोगों की शब्दगत संगति महत्त्वपूर्ण है, पर हिंदी में समान शब्द रखना कृत्रिम या भ्रामक हो सकता है। ‘फूँक’ तत्काल शक्ति और ‘वायु’ ओसाने के बिंब को स्वाभाविक रूप से व्यक्त करते हैं; ग्रीक की बहुअर्थकता पादटिप्पणी में सुरक्षित है और व्यक्तिगत ‘पवित्र आत्मा’ का अर्थ अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: δίκη का अर्थ न्याय, न्याय-दंड या दंड
  choice: न्याय
  alternative: न्याय-दंड; दंड
  rationale: ‘न्याय’ सक्रिय पीछा करने वाले मानवीकृत नैतिक विधान को बचाता है; ‘दंड’ परिणाम पर अर्थ को सीमित कर देता। विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘भूसी की तरह उड़ा देती’ से ओसाने का कृषि-बिंब स्पष्ट होता है। आदरसूचक ‘आप’ का प्रयोग किया गया है।
