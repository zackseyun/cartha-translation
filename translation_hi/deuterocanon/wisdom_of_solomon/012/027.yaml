base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: hi
  text: क्योंकि जिन वस्तुओं के द्वारा वे स्वयं दुःख सहते और रुष्ट होते थे—जिन्हें वे देवता मानते थे—उन्हीं के द्वारा दण्डित होते हुए, यह देखकर उन्होंने उस परमेश्वर को, जिसे जानने से वे पहले इनकार करते थे, सच्चे परमेश्वर के रूप में पहचान लिया।[a] इसलिए दोष-दण्ड की अंतिम परिणति भी उन पर आ पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस परमेश्वर को जानने से वे पहले इनकार करते थे, उसे उन्होंने सचमुच परमेश्वर के रूप में पहचान लिया।” यूनानी में ἀληθῆ को “सच्चा” के साथ-साथ क्रियाविशेषणात्मक रूप से “सचमुच” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: जिन चीज़ों के कारण
  rationale: ἐπί के कारण अथवा प्रसंग-सूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और आगे आने वाले उन्हीं साधनों से दण्ड पाने के अलंकारिक संबंध को बनाए रखता है।
- source_word: πάσχοντες ἠγανάκτουν
  choice: दुःख सहते और क्रोधित होते थे
  rationale: πάσχω के अनिर्दिष्ट कष्ट और ἀγανακτέω के प्रबल रोष को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐδόκουν θεούς
  choice: जिन्हें वे देवता समझते थे
  rationale: δοκέω के व्यक्तिपरक मानने के भाव और मूर्तिपूजा पर निहित विडम्बना को स्पष्ट करता है।
- source_word: ἐν αὐτοῖς κολαζόμενοι
  choice: उन्हीं के द्वारा दण्ड पाते हुए
  rationale: 'ἐν के संभावित साधनवाचक भाव को सामने रखता है: जिन वस्तुओं को उन्होंने देवता माना, उन्हीं के माध्यम से उन्हें दण्ड मिला।'
- source_word: ἐπέγνωσαν ἀληθῆ
  choice: सच्चे परमेश्वर के रूप में पहचान लिया
  rationale: ἐπιγινώσκω की पहचान अथवा पूर्ण अभिज्ञान की शक्ति और ἀληθῆ के सम्भावित विशेषणात्मक अर्थ को व्यक्त करता है।
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: दण्डाज्ञा का चरम परिणाम
  rationale: τέρμα के अंतिम बिंदु या परिणति तथा καταδίκη के दोषसिद्धि/दण्डाज्ञा संबंधी अर्थ को ऐसी हिन्दी में रखता है जो केवल प्रक्रिया या केवल दण्ड तक सीमित नहीं करती।
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: उन पर आ पड़ा
  rationale: आने वाले न्याय के अकस्मात और भारपूर्ण आगमन को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
theological_decisions:
- issue: ἰδόντες ... θεὸν ἐπέγνωσαν ἀληθῆ में पहचाने गए व्यक्ति और ἀληθῆ का संबंध
  choice: जिसे वे पहले जानने से इनकार करते थे, उसे सच्चे परमेश्वर के रूप में पहचान लिया
  alternative: जिस परमेश्वर को जानने से वे पहले इनकार करते थे, उसे उन्होंने सचमुच पहचान लिया
  rationale: झूठे देवताओं के साथ विरोध के कारण ἀληθῆ को θεόν का विशेषण मानना प्रसंगानुकूल है; फिर भी यूनानी में इसे क्रियाविशेषणात्मक रूप से ‘सचमुच’ समझना सम्भव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सुबोध स्तर रखा गया है। ‘देवता’ बहुदेववादी दावों के लिए और ‘परमेश्वर’ θεός के उस एक सच्चे संदर्भ के लिए प्रयुक्त है। वाक्य की पुनरावृत्त संरचना—जिन्हें देवता समझा, उन्हीं से दण्ड पाया—सुरक्षित रखी गई है।
