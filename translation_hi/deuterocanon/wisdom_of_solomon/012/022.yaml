  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। एकवचन ईश्वरीय संबोधन के लिए ‘तू/तेरी’ रखा गया है। सक्रिय और निष्क्रिय न्याय की मूल समानांतरता सुरक्षित है।
