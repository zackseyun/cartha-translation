  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/022.yaml
  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: hi
  text: इसलिए, हमें अनुशासित करते हुए तू हमारे शत्रुओं को असंख्य कोड़े लगाता है[a], ताकि न्याय करते समय हम तेरी भलाई का ध्यान रखें, और जब हमारा न्याय हो, तब दया की आशा रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दस-दस हज़ार कोड़ों से”; यूनानी अभिव्यक्ति प्रहारों की अत्यंत बड़ी संख्या या उनकी कठोरता पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύων
  choice: अनुशासित करते हुए
  rationale: यह सुधारात्मक शिक्षा और ताड़ना—दोनों का भाव रखता है; इसे केवल दंड के अर्थ तक सीमित नहीं करता।
- source_word: ἐν μυριότητι μαστιγοῖς
  choice: असंख्य कोड़ों से मारता है
  rationale: ग्रीक पदबंध बहुत बड़ी संख्या अथवा प्रहारों की तीव्रता व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए मूल बिंब को बनाए रखता है।
- source_word: μεριμνῶμεν
  choice: ध्यान रखें
  rationale: यहाँ अर्थ परमेश्वर की भलाई के प्रति विचारशील और सजग रहने का है, न कि उसके विषय में चिंतित होने का।
- source_word: κρίνοντες
  choice: न्याय करते समय
  rationale: कालवाचक परिस्थिति और मानव द्वारा न्याय करने की सक्रिय भूमिका को स्पष्ट रखता है।
- source_word: κρινόμενοι
  choice: जब हमारा न्याय हो
  rationale: पहले सक्रिय कृदंत के साथ मूल का सक्रिय-निष्क्रिय विरोध और समानांतरता सुरक्षित रहती है।
- source_word: προσδοκῶμεν ἔλεος
  choice: दया की आशा रखें
  rationale: प्रतीक्षा और अपेक्षा का भाव व्यक्त करता है, पर दया मिलने की निश्चितता को मूल से अधिक प्रबल नहीं बनाता।
- source_word: ἀγαθότητα
  choice: भलाई
  rationale: यह नैतिक अच्छाई और कृपालुता—दोनों को समेटने वाला सहज तथा व्यापक हिंदी शब्द है।
theological_decisions:
- issue: ‘हमें’ दिए जाने वाले अनुशासन और ‘हमारे शत्रुओं’ पर पड़ने वाले प्रहारों का संबंध
  choice: परमेश्वर अपने लोगों को अनुशासित करता है, जबकि उनके शत्रुओं को असंख्य कोड़ों से मारता है।
  alternative: कोड़ों के असंख्य प्रहारों को ‘हम पर’ होने वाले अनुशासन का वर्णन माना जा सकता है।
  rationale: ग्रीक वाक्य-विन्यास में ἡμᾶς स्वाभाविक रूप से παιδεύων का और τοὺς ἐχθροὺς ἡμῶν μαστιγοῖς का कर्म है; इस प्रकार सुधारात्मक अनुशासन और कठोर दंड का विरोध बना रहता है।
- issue: μεριμνῶμεν का धार्मिक-नैतिक बल
  choice: न्याय करते समय परमेश्वर की भलाई का ध्यान रखना।
  alternative: परमेश्वर की भलाई के लिए चिंतित अथवा उसके प्रति विशेष रूप से सजग रहना।
  rationale: ‘ध्यान रखें’ नैतिक विचारशीलता को व्यक्त करता है और ऐसा भ्रामक अर्थ नहीं देता कि परमेश्वर की भलाई स्वयं चिंता का विषय है।
