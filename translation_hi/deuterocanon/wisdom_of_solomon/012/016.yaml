  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: hi
  text: क्योंकि आपका सामर्थ्य धार्मिकता[a] का आरम्भ[b] है, और सब पर आपका प्रभुत्व आपको सबको बख्शने वाला बनाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’। यूनानी δικαιοσύνη में धार्मिकता और न्याय—दोनों अर्थ समाए हो सकते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘स्रोत’ अथवा ‘मूल सिद्धान्त’। यूनानी ἀρχή का अर्थ आरम्भ, स्रोत या प्रथम सिद्धान्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχύς
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति और कार्य करने की क्षमता को व्यक्त करता है। ‘सामर्थ्य’ स्वाभाविक और गरिमापूर्ण है तथा केवल शारीरिक बल तक अर्थ को सीमित नहीं करता।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: δικαιοσύνη नैतिक सहीपन और न्याय—दोनों का भाव रखता है। मुख्य पाठ में ‘धार्मिकता’ रखा गया है और ‘न्याय’ को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: ἀρχή
  choice: आरम्भ
  rationale: ἀρχή का सीधा अर्थ ‘आरम्भ’ है, पर यहाँ ‘स्रोत’ या ‘मूल सिद्धान्त’ का भाव भी सम्भव है; इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: δεσπόζειν
  choice: प्रभुत्व
  rationale: यह क्रिया स्वामी होने और अधिकारपूर्वक शासन करने को बताती है। ‘सब पर आपका प्रभुत्व’ यूनानी के संज्ञार्थक infinitive की संरचना और वास्तविक सार्वभौमिक सत्ता—दोनों को बनाए रखता है।
- source_word: φείδεσθαι
  choice: बख्शने
  rationale: क्रिया का अर्थ नष्ट करने या हानि पहुँचाने से रुकना, अर्थात बख्श देना है। ‘बख्शना’ इस प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: ποιεῖ
  choice: प्रेरित करता है
  rationale: यहाँ क्रिया प्रभुत्व के परिणामस्वरूप बख्शने को व्यक्त करती है। शाब्दिक ‘कराता है’ की अपेक्षा ‘प्रेरित करता है’ आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि कारणात्मक सम्बन्ध बना रहता है।
- source_word: πάντων ... πάντων
  choice: सब पर ... सबको
  rationale: दोहराए गए ‘सब’ से मूल का आलंकारिक समानान्तर और व्यापकता सुरक्षित रहती है; इसे केवल व्यक्तियों या वस्तुओं तक सीमित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर के चरित्र के विषय में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: पद परमेश्वर के सामर्थ्य को उसके नैतिक रूप से सही शासन और संयम से जोड़ता है। ‘धार्मिकता’ इस व्यापक अर्थ को मुख्य पाठ में रखती है, जबकि ‘न्याय’ निकट और प्रसंगोचित वैकल्पिक अर्थ है।
- issue: परमेश्वर के सार्वभौमिक प्रभुत्व और उसके द्वारा सबको बख्शने के बीच कारणात्मक सम्बन्ध
  choice: प्रभुत्व आपको सबको बख्शने के लिए प्रेरित करता है
  alternative: प्रभुत्व आपसे सबको बख्शवाता है
  rationale: यूनानी ποιεῖ कारण या परिणाम का स्पष्ट सम्बन्ध बनाता है। चुना हुआ पाठ इस सम्बन्ध को बनाए रखता है, पर ऐसा अस्वाभाविक अर्थ नहीं देता कि कोई बाहरी शक्ति परमेश्वर को विवश करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली गरिमापूर्ण पर सहज रखी गई है। ‘धार्मिकता’ और ‘आरम्भ’ की वास्तविक अर्थगत व्यापकता पाद-टिप्पणियों में सुरक्षित है; ‘सब’ की पुनरावृत्ति मूल यूनानी के बल और विस्तार को बनाए रखती है।
