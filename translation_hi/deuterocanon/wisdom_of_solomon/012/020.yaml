base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: hi
  text: क्योंकि यदि तूने अपनी संतानों के शत्रुओं का, जो मृत्यु के योग्य थे, इतनी बड़ी सावधानी और विनती के साथ आदर किया[a], और उन्हें समय और अवसर दिया कि वे दुष्टता से मुक्त हो सकें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इतने बड़े ध्यान और याचना के साथ सम्मानित किया।” यूनानी में ‘सावधानी/ध्यान’ और ‘विनती/याचना’ के शब्द हैं; ‘विनती के साथ आदर किया’ अभिव्यक्ति असामान्य है, पर मूल पाठ का यही प्रत्यक्ष अर्थ है।
    reason: प्रसोख़े और देएसिस के शाब्दिक अर्थ तथा उनके असामान्य संयोजन को बिना व्याख्यात्मक प्रतिस्थापन के सुरक्षित रखना।
lexical_decisions:
- source_word: ἐχθροὺς παίδων σου
  choice: अपनी सन्तानों के शत्रुओं
  rationale: ἐχθρούς का सामान्य अर्थ ‘शत्रु’ है। παῖς सन्तान, पुत्र या सेवक हो सकता है; इस प्रसंग में ‘सन्तान’ संबंधपरक अर्थ को बनाए रखता है और अनावश्यक रूप से लिंग निर्धारित नहीं करता।
- source_word: ὀφειλομένους θανάτῳ
  choice: जो मृत्यु के योग्य थे
  rationale: यह वाक्यांश मृत्यु के प्रति देयता या दण्डनीयता व्यक्त करता है; हिन्दी में ‘मृत्यु के योग्य’ इसका स्वाभाविक न्यायिक भाव देता है।
- source_word: ἐτίμησας
  choice: दण्ड दिया
  rationale: τιμάω का मूल अर्थ सम्मान देना या मूल्य ठहराना है, पर न्यायिक प्रयोग में इसका अर्थ दण्ड निर्धारित करना या दण्ड देना भी हो सकता है। प्रसंग में कनानियों पर विलम्बित और संयमित न्याय की चर्चा होने के कारण ‘दण्ड दिया’ सर्वाधिक सुसंगत है।
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: इतनी सावधानी और रियायत के साथ
  rationale: προσοχή ध्यानपूर्ण सावधानी दर्शाता है। δέησις सामान्यतः विनती या याचना है, पर यहाँ दण्ड में नरमी और पश्चात्ताप का अवसर देने का प्रसंग है; ‘रियायत’ उस प्रासंगिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: δοὺς χρόνους καὶ τόπον
  choice: उन्हें समय और अवसर दिया
  rationale: χρόνους समय-अवधि और τόπον शाब्दिक रूप से स्थान दर्शाता है, पर यहाँ ‘स्थान’ का मुहावरेदार अर्थ गुंजाइश या अवसर है।
- source_word: ἀπαλλαγῶσι τῆς κακίας
  choice: वे अपनी दुष्टता से छूट सकें
  rationale: ἀπαλλάσσω से मुक्ति या छुटकारा पाने का भाव आता है और κακία नैतिक बुराई या दुष्टता है। सम्भावनार्थक क्रिया ‘सकें’ यूनानी संभावनार्थक रूप को बनाए रखती है।
theological_decisions:
- issue: परमेश्वर द्वारा शत्रुओं के साथ किए गए व्यवहार में δέησις का अर्थ
  choice: रियायत
  alternative: विनती या याचना
  rationale: शाब्दिक अर्थ ‘विनती’ है, किंतु तत्काल प्रसंग दण्ड में संयम तथा दुष्टता छोड़ने के लिए समय देने पर केन्द्रित है। ‘रियायत’ उस आशय को व्यक्त करती है, जबकि पादटिप्पणी वास्तविक शाब्दिक तनाव को छिपने नहीं देती।
- issue: ἐτίμησας का न्यायिक अर्थ
  choice: दण्ड दिया
  alternative: सम्मान किया या आदरपूर्ण व्यवहार किया
  rationale: सम्मान का अर्थ शब्द का सामान्य अर्थ है, किंतु इस प्रसंग में मृत्यु के योग्य शत्रुओं और न्याय की चर्चा न्यायिक अर्थ की ओर संकेत करती है। ‘दण्ड दिया’ को सावधानी और रियायत से सीमित किया गया है, इसलिए यह क्रूर या तत्काल विनाश का भाव नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ रखा गया है। पद मूल वाक्य का आश्रित खण्ड है, इसलिए अन्त में अल्पविराम रखा गया है।
