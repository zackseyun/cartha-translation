  rationale: मूल यूनानी में πνεῦμα परमेश्वर से संबंधित है और सबमें उसकी उपस्थिति बताता है, पर यह पद बाद की धर्मवैज्ञानिक परिभाषाओं को स्पष्ट रूप से निर्धारित नहीं करता। ‘आत्मा’ दिव्य संदर्भ को बनाए रखता है, जबकि हिन्दी में ‘आपका’ का प्रयोग परमेश्वर के आत्मा को उनसे संबंधित सत्ता के रूप में व्यक्त करता है और मूल की कुछ theological tension सुरक्षित रखता है।
