- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के हाथों
  rationale: यह साधन या माध्यम बताने वाला सजीव मुहावरा है। ‘पूर्वजों’ ऐतिहासिक रूप से इस्राएल की पिछली पीढ़ियों को स्पष्ट करता है और ‘हाथों’ मूल चित्रात्मकता को सुरक्षित रखता है।
