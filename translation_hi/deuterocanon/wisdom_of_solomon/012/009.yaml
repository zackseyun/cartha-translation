  source_fidelity: The draft conveys the causal force of οὐκ ἀδυνατῶν and retains the military sense of ἐν παρατάξει. Its rendering of ὑποχειρίους as ‘अपने वश में’ is understandable, but ‘अपने अधिकार में कर देने’ more explicitly expresses being brought under God's power. The totalizing and single-action force of ὑφʼ ἓν ἐκτρῖψαι is best kept together in the Hindi clause.
  naturalness: The proposed revision uses idiomatic modern standard Hindi and improves the coordination of the two means of judgment. ‘भयानक जंगली पशुओं द्वारा’ is more natural than the compound ‘वन-पशुओं,’ while retaining the sense of θηρίοις δεινοῖς.
  terminology: ‘भक्तिहीन’ suitably preserves the religious dimension of ἀσεβεῖς. ‘कठोर वचन’ is a defensible rendering of λόγῳ ἀποτόμῳ, provided its possible sense of ‘तीखा’ is noted. The note for the single-action idiom must be anchored to ‘एक ही बार में,’ not to ‘असमर्थ.’
  issues:
