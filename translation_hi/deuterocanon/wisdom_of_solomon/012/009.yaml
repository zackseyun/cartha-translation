  text: इसलिए नहीं कि आप युद्ध में भक्तिहीनों को अपने अधिकार में कर देने, या भयानक जंगली पशुओं द्वारा अथवा एक कठोर वचन से उन सबको एक ही बार में मिटा डालने में असमर्थ थे।
