lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: इसलिए नहीं कि आप ... असमर्थ थे
  rationale: 'संदर्भ में कृदन्तीय वाक्यांश कारणसूचक है: परमेश्वर का क्रमिक न्याय सामर्थ्य की कमी के कारण नहीं था। आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से स्पष्ट किया गया है।'
- source_word: ἐν παρατάξει
  choice: युद्ध में
  rationale: παράταξις युद्ध-विन्यास अथवा युद्ध-संघर्ष को सूचित करता है; ‘युद्ध में’ सैन्य अर्थ को सहज और संक्षिप्त रूप में रखता है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: ἀσεβής में परमेश्वर के प्रति श्रद्धा के अभाव का धार्मिक अर्थ है; ‘भक्तिहीन’ सामान्य नैतिक बुराई से अधिक इस आयाम को व्यक्त करता है।
- source_word: ὑποχειρίους δοῦναι
  choice: अपने वश में करने
  rationale: ὑποχείριος का मूल भाव किसी के हाथ या अधिकार के अधीन होना है। ‘अपने वश में करने’ आधुनिक हिन्दी में अधीनता और प्रभुत्व दोनों व्यक्त करता है।
- source_word: θηρίοις δεινοῖς
  choice: भयानक वन-पशुओं
  rationale: θηρίον जंगली पशु और δεινός भयावहता अथवा प्रचंडता व्यक्त करता है; ‘भयानक वन-पशु’ दोनों तत्वों को सुरक्षित रखता है।
- source_word: λόγῳ ἀποτόμῳ
  choice: एक कठोर वचन से
  rationale: ἀπότομος का अर्थ तीखा, काटनेवाला या कठोर हो सकता है। ‘कठोर वचन’ निर्णायक और दंडात्मक ईश्वरीय उच्चारण का भाव देता है, बिना उसे केवल ‘आज्ञा’ मानकर अर्थ सीमित किए।
- source_word: ὑφʼ ἓν
  choice: एक ही बार में
  rationale: यह यूनानी मुहावरा एक ही कार्य या अवसर में सब कुछ कर डालने पर बल देता है; ‘एक ही बार में’ हिन्दी में स्वाभाविक है।
- source_word: ἐκτρῖψαι
  choice: उन सबका ... सर्वनाश करने
  rationale: क्रिया पूरी तरह मिटा देने अथवा नष्ट कर देने का प्रबल अर्थ रखती है। ‘सर्वनाश’ इसकी समग्रता को व्यक्त करता है; ‘सबका’ ὑφʼ ἓν के सामूहिक बल को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर को संबोधित कृदन्तीय खंड और उसकी कारणसूचक भूमिका
  choice: ‘इसलिए नहीं कि आप ... असमर्थ थे’ के रूप में सीधे परमेश्वर को संबोधन और नकारात्मक कारण स्पष्ट किया गया है।
  alternative: 'अधिक शाब्दिक रूप: ‘असमर्थ न होते हुए’ या ‘शक्तिहीन न होकर।’'
  rationale: आसपास का संदर्भ परमेश्वर को सीधे संबोधित करता है और उनके संयमित न्याय को सामर्थ्य की कमी से अलग करता है। कारणसूचक हिन्दी मूल आशय स्पष्ट करती है, पर कोई अतिरिक्त धर्मसिद्धान्त नहीं जोड़ती।
- issue: λόγῳ ἀποτόμῳ में ईश्वरीय वचन की प्रकृति
  choice: ‘कठोर वचन’ रखा गया है।
  alternative: ‘तीखे वचन’ या ‘कठोर आज्ञा’ से।
  rationale: यूनानी पद रूपकात्मक ‘तीखापन’ और कठोर निर्णायकता दोनों की अनुमति देता है। ‘आज्ञा’ कहना सम्भव है, पर वह λόγος को अनावश्यक रूप से आदेश तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की आश्रित वाक्य-रचना को पूर्ण हिन्दी वाक्य बनाया गया है; ‘आप’ द्वारा परमेश्वर के प्रत्यक्ष संबोधन को बनाए रखा गया है।
