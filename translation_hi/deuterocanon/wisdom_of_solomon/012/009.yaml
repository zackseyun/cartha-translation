    issue: The source-audit note concerning ὑφʼ ἓν is not anchored to the corresponding expression in the translation.
    rationale: ὑφʼ ἓν modifies ἐκτρῖψαι (‘wipe out/destroy’) and means ‘in one action/all at once’; it does not qualify οὐκ ἀδυνατῶν (‘unable’).
  - severity: low
    issue: ‘अपने वश में करने’ can be slightly less explicit about the source sense of bringing people under divine power.
    rationale: ‘अपने अधिकार में कर देने’ more directly represents ὑποχειρίους δοῦναι without changing the meaning.
