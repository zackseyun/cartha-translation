base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: hi
  text: इसलिए जो भटक जाते हैं, उन्हें तू थोड़ा-थोड़ा करके फटकारता है और जिन बातों में वे पाप करते हैं उनकी याद दिलाकर उन्हें चेताता है, ताकि वे दुष्टता से मुक्त होकर तुझ पर विश्वास करें[a], हे प्रभु।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझ पर भरोसा रखें।” यूनानी वाक्यांश परमेश्वर की ओर उन्मुख विश्वास या भरोसा व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διό
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς παραπίπτοντας
  choice: जो भटक जाते हैं
  rationale: παραπίπτω यहाँ नैतिक मार्ग से हटने या अपराध में पड़ने का भाव रखता है; ‘भटक जाते हैं’ इस अर्थ को किसी एक क्षणिक चूक तक सीमित नहीं करता।
- source_word: κατʼ ὀλίγον
  choice: थोड़ा-थोड़ा करके
  rationale: यह सुधार की क्रमिक और मापी हुई रीति को बनाए रखता है; यूनानी पद के ‘धीरे-धीरे’ अथवा ‘कुछ-कुछ करके’ वाले भाव को स्वाभाविक हिन्दी देता है।
- source_word: ἐλέγχεις
  choice: फटकारता है
  rationale: क्रिया गलत काम को उजागर करके सुधारने वाली भर्त्सना बताती है; ‘फटकारता है’ सामान्य पाठक के लिए स्पष्ट है और अनुशासनात्मक बल बनाए रखता है।
- source_word: ἐν οἷς ἁμαρτάνουσιν
  choice: जिन बातों में वे पाप करते हैं
  rationale: यह उनके पाप के विशिष्ट क्षेत्रों या कामों की ओर संकेत करने वाली यूनानी संरचना को सुरक्षित रखता है।
- source_word: ὑπομιμνήσκων
  choice: याद दिलाकर
  rationale: कृदन्त उस साधन को बताता है जिसके द्वारा चेतावनी दी जाती है; हिन्दी में यह संबंध स्पष्ट और सहज है।
- source_word: νουθετεῖς
  choice: चेताता है
  rationale: νουθετέω में सुधार के उद्देश्य से समझाने और सावधान करने का भाव है; ‘चेताता है’ संक्षिप्त और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: ἀπαλλαγέντες τῆς κακίας
  choice: दुष्टता से मुक्त होकर
  rationale: यह निष्क्रिय मुक्ति और व्यापक नैतिक बुराई—दोनों भावों को बनाए रखता है।
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: तुझ पर विश्वास करें
  rationale: πιστεύω के साथ ἐπί और द्वितीया विभक्ति परमेश्वर की ओर निर्देशित विश्वास या भरोसा व्यक्त करते हैं; हिन्दी में ‘तुझ पर विश्वास करना’ दोनों को स्वाभाविक रूप से समेटता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को किए गए प्रत्यक्ष संबोधन को हिन्दी में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: πιστεύσωσιν ἐπὶ σέ में विश्वास और भरोसे का संबंध
  choice: तुझ पर विश्वास करें
  alternative: तुझ पर भरोसा रखें
  rationale: यूनानी वाक्यांश परमेश्वर की ओर उन्मुख विश्वास के साथ निर्भर भरोसे का भाव भी रखता है। मुख्य पाठ में प्रचलित धर्मवैचारिक शब्दावली ‘विश्वास’ रखी गई है, जबकि ‘भरोसा’ को पादटिप्पणी में वास्तविक अर्थ-विकल्प के रूप में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन निकट संबोधन ‘तू/तुझ’ रखा गया है, क्योंकि यूनानी क्रियाएँ और सर्वनाम एकवचन हैं तथा वक्ता सीधे प्रभु को संबोधित करता है। शैली सरल, गरिमापूर्ण और सुधारात्मक क्रम को स्पष्ट रखने वाली है।
