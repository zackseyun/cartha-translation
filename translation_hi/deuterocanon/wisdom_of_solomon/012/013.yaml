lexical_decisions:
- source_word: οὔτε γὰρ θεός ἐστιν πλὴν σοῦ
  choice: क्योंकि आपके सिवा कोई ईश्वर नहीं
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से व्यक्त होता है; πλήν σοῦ अपवाद और अनन्यता बताता है। ‘ईश्वर’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: ᾧ μέλει περὶ πάντων
  choice: जिसे सबकी चिंता है
  rationale: ᾧ के दत्तिव और μέλει की निरपेक्ष रचना को स्वाभाविक हिन्दी में रखा गया है। ‘सबकी’ πάντων की जानबूझकर खुली व्यापकता बनाए रखता है—यह सभी व्यक्तियों अथवा सभी वस्तुओं तक संकेत कर सकता है।
- source_word: ἵνα δείξῃς
  choice: इसलिए आपको यह दिखाने की आवश्यकता नहीं
  rationale: 'यहाँ ἵνα को पूर्ववर्ती ‘आपके सिवा कोई ईश्वर नहीं’ से जुड़े निहितार्थ के रूप में समझा गया है: कोई अन्य ईश्वर ऐसा नहीं जिसके सामने परमेश्वर को अपना न्याय सिद्ध करना पड़े। हिन्दी में निहित निषेध स्पष्ट करना अर्थगत संबंध को स्वाभाविक बनाता है।'
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: आपने अन्यायपूर्वक न्याय नहीं किया
  rationale: यूनानी की निषेधात्मक अभिव्यक्ति को सकारात्मक ‘न्यायपूर्वक किया’ में बदले बिना सुरक्षित रखा गया है; κρίνω का व्यापक न्यायिक अर्थ ‘न्याय करना’ से व्यक्त होता है।
theological_decisions:
- issue: क्या ἵνα δείξῃς को सीधा उद्देश्यवाचक माना जाए या संदर्भगत निहित निषेध व्यक्त किया जाए
  choice: आपको यह दिखाने की आवश्यकता नहीं
  alternative: ताकि आप दिखाएँ
  rationale: मुख्य वाक्य में किसी अन्य सर्वचिंतक ईश्वर के अस्तित्व का निषेध है; इसलिए आशय यह है कि परमेश्वर को किसी अन्य के सामने अपने निर्णय का औचित्य प्रदर्शित नहीं करना पड़ता। फिर भी यह व्याख्यात्मक विस्तार है, इसलिए पादटिप्पणी में अधिक शाब्दिक रूप दिया गया है।
- issue: οὐκ ἀδίκως को सकारात्मक न्याय-वचन में बदलना
  choice: अन्यायपूर्वक न्याय नहीं किया
  alternative: न्यायपूर्वक न्याय किया
  rationale: मूल यूनानी आरोप के निषेध के रूप में बात कहता है। उसी अलंकारिक और धर्मवैचारिक तनाव को बनाए रखा गया है।
- issue: πάντων का आशय
  choice: सबकी
  alternative: सब वस्तुओं की / सब लोगों की
  rationale: यूनानी रूप पुल्लिंग अथवा नपुंसकलिंग दोनों अर्थ दे सकता है; ‘सबकी’ इस व्यापकता को बिना सीमित किए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। परमेश्वर को संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘अन्यायपूर्वक न्याय नहीं किया’ कुछ औपचारिक है, पर मूल की जानबूझकर रखी गई निषेधात्मक अभिव्यक्ति को सुरक्षित करता है।
