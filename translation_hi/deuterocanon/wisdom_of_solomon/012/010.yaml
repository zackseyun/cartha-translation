  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: hi
  text: परन्तु थोड़ा-थोड़ा करके उनका न्याय करते हुए, तू उन्हें मन फिराने का अवसर देता रहा[a]। तू इस बात से अनजान नहीं था कि उनकी उत्पत्ति बुरी थी[b], उनकी दुष्टता जन्मजात थी, और उनकी विचार-प्रवृत्ति कभी नहीं बदलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मन फिराने के लिए स्थान देता रहा”; इसका अर्थ “मन फिराने का मौका देता रहा” या “मन फिराने के लिए समय देता रहा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उनका जन्म बुरा था” या “उनका वंश बुरा था” भी सम्भव है। यूनानी शब्द γένεσις उत्पत्ति, जन्म या वंश का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχὺ
  choice: परन्तु थोड़ा-थोड़ा करके उनका न्याय करते हुए
  rationale: वर्तमान कृदन्त न्याय करने की परिस्थिति या रीति बताता है, और κατὰ βραχύ क्रमिक, चरणबद्ध कार्यवाही को व्यक्त करता है।
- source_word: ἐδίδους τόπον μετανοίας
  choice: तू उन्हें मन फिराने का अवसर देता रहा
  rationale: τόπος का शाब्दिक अर्थ ‘स्थान’ है, पर यहाँ मुहावरे के रूप में अवसर या गुंजाइश है। ‘मन फिराना’ μετάνοια के विचार और आचरण में परिवर्तन के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἀγνοῶν
  choice: तू इस बात से अनजान नहीं था
  rationale: यूनानी की नकारात्मक अभिव्यक्ति को बनाए रखते हुए परमेश्वर की पूर्ण जानकारी प्रकट होती है।
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: उनका मूल बुरा था
  rationale: γένεσις मूल, जन्म या वंश का अर्थ दे सकता है। ‘मूल’ इस अर्थ-व्याप्ति को अपेक्षाकृत खुला रखता है और अनावश्यक जैविक निर्धारणवाद नहीं जोड़ता।
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: उनकी दुष्टता जन्मजात थी
  rationale: ἔμφυτος भीतर से उत्पन्न, स्वभावगत या जन्म से विद्यमान होने का प्रबल भाव रखता है; ‘जन्मजात’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ὁ λογισμὸς αὐτῶν
  choice: उनकी सोच
  rationale: λογισμός यहाँ किसी एक तर्क के बजाय विचार-प्रवृत्ति या मानसिकता का संकेत देता है; ‘सोच’ सहज और पर्याप्त व्यापक है।
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: सदा तक कभी नहीं बदलेगी
  rationale: οὐ μή का प्रबल निषेध ‘कभी नहीं’ से और εἰς τὸν αἰῶνα की स्थायित्व-सूचक शक्ति ‘सदा तक’ से व्यक्त की गई है।
theological_decisions:
- issue: क्या पद को पश्चाताप करने की निरपेक्ष दार्शनिक या आध्यात्मिक असमर्थता के कथन के रूप में स्पष्ट किया जाए
  choice: पाठ के कठोर कथन—बुरा मूल, जन्मजात दुष्टता और सदा न बदलने वाली सोच—को बनाए रखा गया है, पर उसके आगे कोई व्यवस्थित धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ा गया।
  alternative: इसे ‘वे जन्म से ही ऐसे थे कि पश्चाताप कर ही नहीं सकते थे’ कहना, या इसके विपरीत इसे केवल ‘उनका झुकाव बुराई की ओर था’ कहकर नरम करना।
  rationale: यूनानी पाठ एक ओर पश्चाताप का अवसर और दूसरी ओर उनकी गहरी, स्थायी दुष्टता दोनों को साथ रखता है। अनुवाद इस तनाव को सुलझाए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। परमेश्वर को एकवचन निकट संबोधन ‘तू’ दिया गया है। ‘मन फिराना’ सामान्य पाठक के लिए बोधगम्य है और केवल भावनात्मक पछतावे की अपेक्षा दिशा-परिवर्तन का भाव रखता है।
