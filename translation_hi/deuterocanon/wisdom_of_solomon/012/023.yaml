base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: hi
  text: इसलिए तुमने उन अन्यायी लोगों को भी, जिन्होंने मूर्खतापूर्ण जीवन जिया था, अपनी ही घृणित बातों[a] के द्वारा यातना दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके अपने घिनौने आचरणों के द्वारा।” यूनानी शब्द घृणित बातों के लिए व्यापक रूप से प्रयुक्त हो सकता है, जिनमें मूर्तिपूजा से जुड़े कर्म या वस्तुएँ भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν καὶ
  choice: इसलिए ... भी
  rationale: ὅθεν पिछले तर्क से निष्कर्ष प्रकट करता है और καὶ यहाँ ‘भी’ का भाव जोड़ता है। हिंदी में अलग स्थानों पर रखे ये शब्द संबंध और बल दोनों को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: τοὺς ... ἀδίκους
  choice: उन अधर्मी लोगों को
  rationale: ἀδίκους व्यक्तियों के लिए प्रयुक्त substantival विशेषण है। ‘अधर्मी’ अन्याय और नैतिक दुष्टता दोनों का व्यापक भाव रखता है, जबकि ‘लोगों’ से व्यक्तिगत संदर्भ स्पष्ट होता है।
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  choice: जिन्होंने जीवन की मूर्खता में अपना जीवन बिताया था
  rationale: ἀφροσύνη का मूल भाव मूर्खता या विवेकहीनता है और βιόω जीवन बिताने को सूचित करता है। यह रूप ग्रीक की संक्षिप्त अभिव्यक्ति तथा मुख्य क्रिया से पूर्व का काल-संबंध बनाए रखता है।
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: उनकी अपनी घिनौनी वस्तुओं के द्वारा
  rationale: διά + संबंधकारक साधन का भाव देता है। βδελύγματα घिनौनी या घृणित वस्तुओं, कर्मों अथवा प्रथाओं को सूचित कर सकता है; मुख्य पाठ में ‘वस्तुओं’ से संज्ञा की ठोस परंतु व्यापक प्रकृति बचती है और पादटिप्पणी अन्य संभावना बताती है।
- source_word: ἐβασάνισας
  choice: यातना दी
  rationale: βασανίζω यहाँ न्याय-दंड के संदर्भ में तीव्र कष्ट देने का अर्थ रखता है। ‘यातना दी’ इस तीव्रता को ‘दंड दिया’ की अपेक्षा अधिक सीधे व्यक्त करता है।
theological_decisions:
- issue: διὰ τῶν ἰδίων βδελυγμάτων में ईश्वरीय प्रतिफल का स्वरूप
  choice: परमेश्वर ने उन्हीं की घिनौनी वस्तुओं या आचरणों को उनके कष्ट का साधन बनाया।
  alternative: परमेश्वर ने उनकी घिनौनी बातों के कारण उन्हें दंड दिया।
  rationale: διά के साथ संबंधकारक सबसे स्वाभाविक रूप से साधन व्यक्त करता है, केवल कारण नहीं। फिर भी पद यह निश्चित नहीं करता कि साधन मूर्तियाँ, जीव-जंतु, कर्म या प्रथाएँ थीं; इसलिए अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप रखा गया है। ‘अधर्मी’, ‘यातना दी’ और ‘के द्वारा’ मूल की नैतिक तथा न्यायिक तीव्रता को बनाए रखते हैं; पादटिप्पणी βδελύγματα की वास्तविक अर्थगत व्यापकता सुरक्षित रखती है।
