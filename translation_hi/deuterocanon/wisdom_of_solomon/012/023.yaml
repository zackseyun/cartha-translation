review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the inferential force of ὅθεν καὶ, the instrumental sense of διά with the genitive, and the severity of ἐβασάνισας. However, “घिनौनी वस्तुओं” narrows βδελυγμάτων to physical objects, whereas the Greek remains broader and may include practices, objects, or other detestable things. “अधर्मी” is possible but can introduce a more specifically religious sense than ἀδίκους; “अन्यायी” more directly reflects injustice.
  naturalness: “जीवन की मूर्खता में अपना जीवन बिताया था” is intelligible but noticeably repetitive and stiff in modern Hindi. “मूर्खतापूर्ण जीवन जिया था” is natural and retains the sense of βιώσαντας together with the characterization supplied by ἐν ἀφροσύνῃ ζωῆς.
  terminology: Use “अन्यायी” for ἀδίκους and “घृणित बातों” for βδελυγμάτων in the text, with the footnote retaining the possible more specific sense of detestable practices or idolatrous objects. “यातना दी” suitably renders the strong judgment-language without doctrinal expansion.
  issues:
  - severity: medium
    issue: “घिनौनी वस्तुओं” is overly specific for βδελυγμάτων.
    rationale: The Greek can denote detestable things broadly, including actions, practices, or objects. Restricting the main text to “वस्तुओं” reduces its deliberate ambiguity.
  - severity: low
    issue: “जीवन की मूर्खता में अपना जीवन बिताया था” is tautological and stiff.
    rationale: The repetition of “जीवन” makes the Hindi less idiomatic without adding source-level meaning.
  - severity: low
    issue: “अधर्मी” is less precise than “अन्यायी” for ἀδίκους.
    rationale: While contextually defensible, “अधर्मी” may foreground impiety; ἀδίκους directly denotes those characterized by injustice.
  revised_text: इसलिए तुमने उन अन्यायी लोगों को भी, जिन्होंने मूर्खतापूर्ण जीवन जिया था, अपनी ही घृणित बातों[a] के द्वारा यातना दी।
