  choice: ‘परमेश्वर के योग्य न्याय’—गुणात्मक सम्बन्ध
  alternative: ‘परमेश्वर का न्याय’ अथवा ‘परमेश्वर की ओर से न्याय’
  rationale: ἀξίαν सीधे κρίσιν को विशेषित करता है; इसलिए वाक्यांश स्वाभाविक रूप से ऐसे न्याय का संकेत देता है जो परमेश्वर के अनुरूप या योग्य हो। दूसरी सम्भावनाओं को पूर्णतः नकारे बिना मुख्य पाठ मूल संरचना को सुरक्षित रखता है।
