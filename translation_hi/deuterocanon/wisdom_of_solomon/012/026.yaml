  text: परन्तु जिन लोगों को बाल-सुलभ ताड़नाओं से शिक्षा नहीं मिली, वे परमेश्वर के योग्य न्याय का अनुभव करेंगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
