  rationale: ἀξίαν के ‘योग्य/अनुरूप’ भाव और θεοῦ की सम्भावित गुणात्मक शक्ति को बनाए रखता है, बिना इसे केवल ‘परमेश्वर का न्याय’ बनाकर अस्पष्टता मिटाए।
