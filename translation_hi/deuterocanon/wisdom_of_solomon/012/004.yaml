- issue: μισήσας का कर्ता और निहित कर्म
  choice: पिछले वाक्य के आधार पर कर्ता परमेश्वर (‘तू’) और कर्म वहाँ के पुराने निवासी (‘उनसे’) माने गए हैं।
  alternative: कृदन्त को अधिक खंडित रूप में ‘अत्यन्त घृणित काम करने के कारण घृणा करके’ रखा जा सकता है; या इसे उन कामों से परमेश्वर की घृणा के रूप में समझाया जा सकता है।
  rationale: यूनानी पद अकेले में कर्ता और कर्म को दोहराता नहीं, पर पिछले संदर्भ से दोनों मिलते हैं। ‘उनसे’ जोड़ना कोई नया धर्मवैज्ञानिक दावा नहीं, बल्कि वाक्यगत लोप की स्वाभाविक हिन्दी पूर्ति है; साथ ही घृणा का कारण उनके कर्म ही रहता है।
