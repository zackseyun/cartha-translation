base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: hi
  text: क्योंकि वह वंश आरम्भ से ही शापित था[a]; और न तुम किसी का लिहाज़ करके उन्हें उनके पापों के लिए दण्ड से छूट देते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘बीज’ है; यहाँ इसका अर्थ ‘सन्तान’, ‘वंश’ या ‘जाति’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस खण्ड का अनुवाद यह भी हो सकता है: ‘और न तुम किसी से डरकर उन बातों के लिए उन्हें दण्ड से छूट देते थे जिनमें उन्होंने पाप किया था।’ ‘दण्ड से छूट’ के लिए प्रयुक्त यूनानी शब्द अनुमति, निर्भयता या दण्ड-मुक्ति का भाव भी दे सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: वंश
  rationale: यूनानी शब्द का मूल अर्थ ‘बीज’ है, पर यहाँ वह लाक्षणिक रूप से सन्तान-परम्परा या जनसमूह को दर्शाता है। आधुनिक हिन्दी में ‘वंश’ इस अर्थ को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है; मूल रूपक फुटनोट में सुरक्षित है।
- source_word: κατηραμένον
  choice: शापित
  rationale: यह शब्द किसी शाप के अधीन होने की विशेषणात्मक अवस्था बताता है; ‘शापित’ हिन्दी में सटीक और गरिमापूर्ण है।
- source_word: ἀπʼ ἀρχῆς
  choice: आरम्भ से ही
  rationale: यह सीधा कालवाचक पद है। ‘ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है कि यह दशा आरम्भ से विद्यमान थी।
- source_word: εὐλαβούμενός τινα
  choice: किसी का लिहाज़ करके
  rationale: εὐλαβέομαι यहाँ भय, सावधानी या किसी के प्रति संकोच/मान रखने का भाव दे सकता है। ‘लिहाज़ करके’ व्यक्ति के कारण न्याय से रुकने या संकोच करने का अर्थ स्वाभाविक हिन्दी में रखता है, बिना इसे केवल भय तक सीमित किए।
- source_word: ἄδειαν
  choice: दण्ड से छूट
  rationale: ἄδεια का अर्थ अनुमति, निर्भयता या दण्ड से मुक्ति हो सकता है। इस न्याय-संदर्भ में ‘दण्ड से छूट’ अभीष्ट अर्थ स्पष्ट करता है, जबकि फुटनोट व्यापक सम्भावना को दर्ज करता है।
- source_word: ἐδίδους
  choice: नहीं देते थे
  rationale: यूनानी अपूर्ण काल अतीत में जारी या चरित्रगत कार्य को सूचित कर सकता है; हिन्दी का ‘नहीं देते थे’ इस पहलू को सहज रूप से व्यक्त करता है।
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: उन पापों के लिए
  rationale: शाब्दिक अर्थ ‘उन बातों के सम्बन्ध में जिनमें उन्होंने पाप किया’ है। ‘उन पापों के लिए’ आधार या कारण का अर्थ स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: σπέρμα से संकेतित लोगों की पहचान स्पष्ट करनी है या नहीं
  choice: मुख्य पाठ में केवल ‘वंश’ रखा गया है; किसी विशेष जाति का नाम नहीं जोड़ा गया।
  alternative: ‘वे कनानी लोग’ अथवा ‘वह कनानी वंश’
  rationale: आस-पास का प्रसंग संकेतित समूह की पहचान करता है, पर इस पद में स्वयं केवल σπέρμα है। इसलिए अनुवाद मूल से अधिक विशिष्ट पहचान नहीं जोड़ता।
- issue: क्या परमेश्वर के किसी व्यक्ति से ‘डरने’ को मुख्य अर्थ बनाया जाए
  choice: ‘किसी का लिहाज़ करके’
  alternative: ‘किसी से डरकर’
  rationale: εὐλαβούμενος में भय के साथ सावधानी, आदर या संकोच का अर्थ भी सम्भव है। ‘लिहाज़’ इस अर्थ-व्याप्ति और न्यायिक तनाव को बनाए रखता है तथा परमेश्वर के भय को अनावश्यक रूप से एकमात्र अर्थ नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लिहाज़’ प्रचलित मानक हिन्दी में व्यक्ति के मान, संकोच या दबाव के कारण रुकने का भाव देता है। वाक्य में एकवचन ‘वह वंश’ यूनानी के एकवचन σπέρμα और ἦν का अनुसरण करता है, जबकि आगे ‘उन्हें/उन्होंने’ उसी सामूहिक वंश के सदस्यों को स्वाभाविक हिन्दी में दर्शाता है।
