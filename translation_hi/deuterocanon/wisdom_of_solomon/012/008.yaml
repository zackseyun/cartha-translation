base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: hi
  text: फिर भी तूने इन्हें भी, मनुष्य होने के कारण[a], बख्श दिया और अपनी सेना[b] के अग्रदूतों के रूप में बर्रों[c] को भेजा, ताकि वे उन्हें धीरे-धीरे नष्ट कर दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन्हें मनुष्य समझकर।” यूनानी पद उनके मनुष्य होने को परमेश्वर के संयम का आधार बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी छावनी।” यूनानी शब्द στρατόπεδον का अर्थ ‘छावनी’ या ‘सेना’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘बर्रे’ परमेश्वर द्वारा इस्राएल के आगे डंक मारने वाले कीट भेजने के बाइबलीय बिंब की प्रतिध्वनि है; निर्गमन 23:28; व्यवस्थाविवरण 7:20; यहोशू 24:12 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: फिर भी तूने इन्हें भी
  rationale: ‘फिर भी’ विरोधसूचक ἀλλά और ‘भी’ καί के योग को स्वाभाविक हिन्दी में व्यक्त करता है; ‘इन्हें’ पिछले प्रसंग के लोगों की ओर संकेत बनाए रखता है।
- source_word: ὡς ἀνθρώπων
  choice: मनुष्य होने के कारण
  rationale: ὡς के कारणसूचक भाव और ἀνθρώπων द्वारा उनकी मानवीय स्थिति पर दिए गए बल को स्पष्ट तथा लिंग-समावेशी ढंग से व्यक्त करता है।
- source_word: ἐφείσω
  choice: बख्श दिया
  rationale: क्रिया का अर्थ किसी को हानि या विनाश से बचाना अथवा उस पर संयम बरतना है; ‘बख्श दिया’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἀπέστειλάς τε
  choice: और ... भेजा
  rationale: अओरिस्ट क्रिया और τε के संयोजक बल का सीधा, स्वाभाविक अनुवाद।
- source_word: προδρόμους
  choice: अग्रदूतों के रूप में
  rationale: यह उन व्यक्तियों या शक्तियों को दर्शाता है जिन्हें मुख्य दल से पहले भेजा जाता है; सैन्य रूपक सुरक्षित रहता है।
- source_word: τοῦ στρατοπέδου σου
  choice: अपनी सेना
  rationale: στρατόπεδον का अर्थ ‘छावनी’ या ‘सेना’ दोनों हो सकता है। यहाँ ‘सेना’ दंडात्मक कार्रवाई के सैन्य बिंब को सहज हिन्दी में व्यक्त करती है।
- source_word: σφῆκας
  choice: बर्रों
  rationale: σφῆκες डंक मारने वाले बर्रों/ततैयों को दर्शाता है; ‘बर्रे’ आधुनिक हिन्दी में संक्षिप्त और परिचित शब्द है।
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: ताकि वे उन्हें धीरे-धीरे नष्ट कर दें
  rationale: ‘ताकि’ उद्देश्यसूचक ἵνα, ‘धीरे-धीरे’ κατὰ βραχύ की क्रमिकता, और ‘नष्ट कर दें’ ἐξολεθρεύω की तीव्रता को साथ रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा बख्शे जाने का कारण
  choice: उनके मनुष्य होने को परमेश्वर के संयम का कारण व्यक्त किया गया है।
  alternative: वाक्यांश का अर्थ अधिक शाब्दिक रूप से ‘उन्हें मनुष्यों के समान मानकर’ भी लिया जा सकता है।
  rationale: ‘मनुष्य होने के कारण’ ὡς ἀνθρώπων के संभावित कारणसूचक बल को बनाए रखता है और नश्वर मनुष्यों के प्रति दया का संकेत देता है, पर पद से आगे कोई व्यापक धर्मसिद्धांत नहीं जोड़ता।
- issue: ईश्वरीय कार्रवाई का सैन्य रूपक
  choice: ‘अपनी सेना’ द्वारा सैन्य बिंब बनाए रखा गया है।
  alternative: ‘अपनी छावनी’ भी सम्भव है।
  rationale: στρατόπεδον दोनों अर्थ दे सकता है। प्रसंग में बर्रे आगे भेजे गए अग्रदूत हैं, इसलिए ‘सेना’ रूपक को अधिक स्पष्ट रखती है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को सीधे संबोधन में एकवचन ‘तू’ मूल यूनानी के एकवचन संबोधन को सुरक्षित रखता है। सैन्य बिंब को स्पष्ट रखा गया है और στρατόπεδον की वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में दी गई है।
