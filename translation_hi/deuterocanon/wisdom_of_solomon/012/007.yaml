  rationale: παρὰ σοὶ परमेश्वर के मूल्यांकन को और τιμιωτάτη सर्वोच्च सम्मान अथवा मूल्य को व्यक्त करता है। हिन्दी में स्पष्टता के लिए ‘भूमियों’ की पूर्ति की गई है।
