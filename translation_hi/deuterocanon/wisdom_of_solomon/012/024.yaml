base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: hi
  text: क्योंकि वे भूल के मार्गों पर और भी दूर तक भटक गए[a]; उन्होंने अपने शत्रुओं के पशुओं में भी जो तुच्छ माने जाते थे, उन्हें देवता मान लिया[b] और निर्बुद्धि शिशुओं के समान धोखा खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूल के मार्गों पर और भी अधिक बहका दिए गए।” यूनानी क्रिया स्वयं भटकने या बहकाए जाने—दोनों भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने अपने शत्रुओं के तुच्छ पशुओं तक को देवता मान लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: भूल के मार्गों पर
  rationale: πλάνη में भूल, भटकाव और भ्रम के अर्थ हैं; ‘भूल के मार्ग’ वैचारिक और नैतिक भटकाव को मार्ग-रूपक सहित सहज हिन्दी में व्यक्त करता है।
- source_word: μακρότερον ἐπλανήθησαν
  choice: और भी दूर तक भटक गए
  rationale: μακρότερον तुलनात्मक तीव्रता देता है और ἐπλανήθησαν भटकने अथवा बहकाए जाने का भाव रख सकता है। मुख्य पाठ मार्ग के रूपक और कर्ता के भटकने को बनाए रखता है; दूसरा सम्भव भाव पादटिप्पणी में दिया गया है।
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: देवता मान लिया
  rationale: ὑπολαμβάνω यहाँ गलत धारणा बनाकर किसी को देवता समझने या मानने का अर्थ देता है। ‘देवता मान लिया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὰ καὶ ἐν ζῴοις τῶν ἐχθρῶν ἄτιμα
  choice: अपने शत्रुओं के पशुओं में भी तुच्छ समझे जानेवाले जीवों को
  rationale: यह अनुवाद τὰ के जीव-सन्दर्भ, ἐν ζῴοις के ‘पशुओं में’ सम्बन्ध और ἄτιμα के सम्मानरहित/तुच्छ भाव को बनाए रखता है। वाक्यांश की सम्भव संक्षिप्त व्याख्या पादटिप्पणी में दी गई है।
- source_word: νηπίων δίκην ἀφρόνων
  choice: निर्बुद्धि शिशुओं के समान
  rationale: δίκην स्पष्ट उपमा देता है; νήπιοι छोटे शिशु हैं और ἄφρονες विवेकहीन या निर्बुद्धि। चुना हुआ रूप कठोर मूल्यांकन को नरम नहीं करता।
- source_word: ψευσθέντες
  choice: धोखा खाया
  rationale: यह निष्क्रिय अर्थ में धोखा दिए जाने या भ्रमित होने को व्यक्त करता है। ‘धोखा खाया’ हिन्दी में स्वाभाविक है और परिणाम को स्पष्ट रखता है।
theological_decisions:
- issue: मूर्तिपूजा के प्रति पद का नैतिक मूल्यांकन
  choice: ‘भूल,’ ‘भटक गए,’ ‘तुच्छ,’ और ‘धोखा खाया’ जैसे नकारात्मक पद बनाए रखे गए।
  alternative: मूल्यांकन को हल्का करके ‘गलती,’ ‘साधारण जीव,’ या केवल ‘मान लिया’ कहना।
  rationale: यूनानी पाठ मूर्तिपूजक निर्णय को भटकाव, अनादरयोग्य वस्तुओं के देवत्वकरण और धोखे के रूप में प्रस्तुत करता है; अनुवाद इस आलोचना को न बढ़ाता है, न नरम करता है।
- issue: ἐπλανήθησαν में कर्तृवाच्य-सदृश और निष्क्रिय सम्भावना
  choice: मुख्य पाठ में ‘भटक गए’।
  alternative: ‘और भी अधिक बहका दिए गए’।
  rationale: सन्दर्भ में स्वयं मार्ग से भटकने का रूपक प्रमुख है, पर यूनानी रूप निष्क्रिय अर्थ की सम्भावना भी रखता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘देवता’ बहुवचन θεούς को स्वाभाविक रूप से व्यक्त करता है। वाक्य का आरोपात्मक स्वर मूल के अनुरूप रखा गया है, और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
