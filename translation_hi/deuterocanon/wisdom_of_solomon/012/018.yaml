  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: hi
  text: परन्तु आप, सामर्थ्य के स्वामी होकर, नरमी से न्याय करते हैं और बहुत संयम के साथ हम पर शासन करते हैं; क्योंकि जब भी आप चाहें, कार्य करने की क्षमता आपके पास है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि जब भी आप चाहें, सक्षम होना आपके लिए उपस्थित है”—अर्थात कार्य करने की क्षमता सदा आपके अधिकार में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: सामर्थ्य के स्वामी होकर
  rationale: यह पदबंध सामर्थ्य पर प्रभुता और उसके पूर्ण अधिकार को व्यक्त करता है। ‘सामर्थ्य’ बाद के τὸ δύνασθαι से कुछ शब्दगत भेद भी बनाए रखता है।
- source_word: ἐν ἐπιεικείᾳ
  choice: उदारता से
  rationale: ἐπιείκεια में नम्रता, नरमी, उचित रियायत और क्षमाशील उदारता का भाव हो सकता है। ‘उदारता से’ न्याय के प्रसंग में स्वाभाविक है और इसे केवल भावनात्मक कोमलता तक सीमित नहीं करता।
- source_word: κρίνεις
  choice: न्याय करते हैं
  rationale: यह क्रिया न्याय करने या निर्णय देने का सामान्य न्यायिक अर्थ सुरक्षित रखती है।
- source_word: μετὰ πολλῆς φειδοῦς
  choice: बड़े संयम के साथ
  rationale: φειδώ का मूल भाव किसी को बचाते हुए शक्ति का मितव्ययी और नियंत्रित प्रयोग है। ‘संयम’ इसे ‘दया’ कहकर अधिक व्याख्यायित किए बिना स्पष्ट करता है।
- source_word: διοικεῖς ἡμᾶς
  choice: हम पर शासन करते हैं
  rationale: διοικεῖς व्यवस्था चलाने और संचालन करने को दर्शाता है; ‘हम पर शासन’ स्पष्ट रूप से ἡμᾶς को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: πάρεστιν γάρ σοι ὅταν θέλῃς τὸ δύνασθαι
  choice: क्योंकि जब भी आप चाहें, सामर्थ्य आपके पास उपस्थित है
  rationale: यह निकटवर्ती रूप से क्षमता की सदा उपलब्धता और उसके प्रयोग का परमेश्वर की इच्छा पर निर्भर होना दोनों बनाए रखता है।
theological_decisions:
- issue: असीम सामर्थ्य और उदार न्याय का तनाव
  choice: परमेश्वर को सामर्थ्य का स्वामी बताते हुए भी उसके न्याय को उदार और शासन को संयमित रखा गया है।
  alternative: φειδώ को सीधे ‘दया’ कहना या δεσπόζων को अधिक कठोर प्रभुत्वसूचक शब्द से प्रस्तुत करना।
  rationale: यूनानी पाठ शक्ति और उसके नियंत्रित प्रयोग को साथ रखता है; अनुवाद किसी एक पक्ष को दूसरे में विलीन नहीं करता।
- issue: ἡμᾶς का प्रथम पुरुष बहुवचन
  choice: ‘हम’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे ‘सब पर’ या किसी निरपेक्ष वस्तु के रूप में सामान्यीकृत करना।
  rationale: मूल पाठ वक्ता और समुदाय को स्पष्टतः सम्मिलित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सुबोध संबोधन के लिए ‘आप’ और बहुवचन आदरसूचक क्रियाओं का प्रयोग किया गया है। ‘उदारता’ और ‘संयम’ न्याय तथा शासन के संदर्भ में सहज हैं और मूल की अर्थ-व्याप्ति को अत्यधिक सांप्रदायिक या तकनीकी भाषा में नहीं बाँधते।
