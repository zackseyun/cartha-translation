lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: कितनी सावधानी से
  rationale: ἀκρίβεια यहाँ परमेश्वर के न्याय की सावधानी, यथार्थता और कठोर सूक्ष्मता का बोध कराता है। ‘कितनी सावधानी से’ विस्मयात्मक बल बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἔκρινας
  choice: न्याय किया
  rationale: κρίνω का न्यायिक और नैतिक अर्थ सुरक्षित रहता है; इसे केवल शासन या निर्णय तक सीमित नहीं किया गया।
- source_word: τοὺς υἱούς σου
  choice: अपने पुत्रों
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन υἱούς है। ‘पुत्रों’ से इस्राएल के वाचा-संबंधी पुत्रत्व की प्रतिध्वनि भी बनी रहती है।
- source_word: ὧν τοῖς πατράσιν
  choice: उनके पितरों को
  rationale: सम्बन्धवाचक रचना ‘पुत्रों’ को उनके पूर्वजों से जोड़ती है। बाइबलीय वाचा के प्रसंग में ‘पितरों’ से वंशगत सम्बन्ध स्पष्ट रहता है।
- source_word: ὅρκους
  choice: शपथें
  rationale: ὅρκος का सीधा अर्थ ‘शपथ’ है। इसके बाद आए συνθήκας से इसे अलग रखा गया है।
- source_word: συνθήκας
  choice: वाचाएँ
  rationale: बाइबलीय प्रसंग में ‘वाचा’ परमेश्वर द्वारा पितरों से किए गए गंभीर, बंधनकारी सम्बन्ध और संकल्प को व्यक्त करती है; सामान्य ‘समझौते’ से इसका धार्मिक भार घट जाता।
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: भली प्रतिज्ञाओं की
  rationale: यह संक्षिप्त सम्बन्धकारक रचना शपथों और वाचाओं को भली प्रतिज्ञाओं से जोड़ती है। हिन्दी में कुछ औपचारिकता रखते हुए मूल की संरचनात्मक अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: इस्राएल के लिए लिंग-विशिष्ट पुत्रत्व की भाषा
  choice: अपने पुत्रों
  alternative: अपनी सन्तानों
  rationale: मूल में υἱούς (‘पुत्र’) है, कोई लिंग-निरपेक्ष शब्द नहीं। इसलिए स्रोत की भाषा और वाचा-संबंधी पुत्रत्व, दोनों को बनाए रखा गया है।
- issue: शपथ और वाचा की अलग-अलग शब्दावली
  choice: शपथें और वाचाएँ
  alternative: शपथपूर्वक किए गए समझौते
  rationale: मूल दो अलग संज्ञाएँ रखकर परमेश्वर की प्रतिज्ञाबद्ध निष्ठा पर बल देता है। दोनों को मिलाने से यह बल कम हो जाता।
- issue: ἀγαθῶν ὑποσχέσεων का सम्बन्ध
  choice: भली प्रतिज्ञाओं की शपथें और वाचाएँ
  alternative: भली प्रतिज्ञाओं से युक्त शपथें और वाचाएँ
  rationale: यूनानी सम्बन्धकारक को अधिक व्याख्यात्मक बनाए बिना रखा गया है। वैकल्पिक पाठ उसका सम्भावित आशय अधिक स्पष्ट करता है, पर मूल की संक्षिप्तता और हल्की अस्पष्टता घटाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ बाइबलीय प्रत्यक्ष सम्बोधन की निकटता और स्रोत के एकवचन रूप को बनाए रखता है। ‘पितरों’ और ‘वाचाएँ’ जैसे स्थापित बाइबलीय पद प्रसंग की वंशगत और धार्मिक गम्भीरता सुरक्षित रखते हैं।
