  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: hi
  text: परन्तु धर्मी होकर तू सब कुछ धर्मपूर्वक संचालित करता है; जो दण्ड पाने योग्य नहीं है[a], उसे दोषी ठहराना तू अपनी शक्ति के अनुरूप नहीं समझता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दण्ड का उत्तरदायी नहीं है।” यूनानी का शाब्दिक भाव है, “जिस पर दण्डित किए जाने का दायित्व नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος … δικαίως
  choice: धर्मी … धर्मपूर्वक
  rationale: यह चयन परमेश्वर के चरित्र और उसके शासन की नैतिक न्यायशीलता व्यक्त करता है तथा यूनानी के सजातीय शब्दों की पुनरुक्ति को यथासंभव बनाए रखता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह व्यापक और स्वाभाविक हिन्दी अभिव्यक्ति है, जो मूल के समावेशी दायरे को किसी विशिष्ट ब्रह्माण्ड-विज्ञान तक सीमित नहीं करती।
- source_word: διέπεις
  choice: संचालित करता है
  rationale: यह व्यवस्थित देखरेख, प्रबन्ध और शासन का भाव देता है; केवल ‘राज करता है’ की अपेक्षा क्रिया के प्रशासनिक पक्ष को भी सुरक्षित रखता है।
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: जो दण्ड पाने योग्य नहीं है
  rationale: ὀφείλω और कर्मवाच्य infinitive यहाँ दण्ड की देयता अथवा पात्रता बताते हैं। यह हिन्दी में सहज है, जबकि शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: καταδικάσαι
  choice: दोषी ठहराना
  rationale: यह न्यायिक निर्णय और निन्दात्मक दण्डादेश का भाव रखता है; प्रसंग में केवल दण्ड देना नहीं, बल्कि किसी के विरुद्ध निर्णय सुनाना मुख्य है।
- source_word: ἀλλότριον
  choice: प्रतिकूल
  rationale: मूलतः इसका अर्थ ‘पराया’ या ‘असम्बद्ध’ है; यहाँ यह ऐसी बात को दर्शाता है जो परमेश्वर की शक्ति के अनुरूप नहीं। ‘प्रतिकूल’ आधुनिक हिन्दी में स्पष्ट है और रूपक के आशय को बचाता है।
- source_word: ἡγούμενος
  choice: समझता है
  rationale: यह मानसिक मूल्यांकन या मानने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς σῆς δυνάμεως
  choice: अपनी शक्ति के
  rationale: δύναμις का व्यापक अर्थ शक्ति या सामर्थ्य है; ‘अधिकार’ कहने से अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
theological_decisions:
- issue: परमेश्वर की शक्ति और धार्मिक न्याय का सम्बन्ध
  choice: निर्दोष को दोषी ठहराना परमेश्वर की शक्ति के प्रतिकूल है।
  alternative: इसे केवल ‘तेरी गरिमा के नीचे’ या δύναμις को केवल ‘अधिकार’ समझना।
  rationale: पद परमेश्वर के धर्मी स्वभाव, धर्मपूर्वक शासन और दण्ड के अयोग्य व्यक्ति को दोषी न ठहराने को एक साथ जोड़ता है। अनुवाद इस सम्बन्ध को बनाए रखता है, पर बाद की किसी व्यवस्थित धर्मशास्त्रीय व्याख्या को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। परमेश्वर को सम्बोधित एकवचन ‘तू’ मूल के प्रत्यक्ष सम्बोधन और प्रचलित बाइबलीय हिन्दी के अनुरूप है। ‘धर्मी … धर्मपूर्वक’ द्वारा यूनानी δίκαιος … δικαίως का अलंकारिक सम्बन्ध सुरक्षित रखा गया है।
