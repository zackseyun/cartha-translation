  rationale: यह शब्द-युग्म राजा और निरंकुश शासक के बीच यूनानी भेद को बनाए रखता है और सहसंबद्ध निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀντοφθαλμῆσαι σοι
