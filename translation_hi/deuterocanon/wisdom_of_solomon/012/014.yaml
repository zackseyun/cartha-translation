  language: hi
  text: न कोई राजा, न कोई तानाशाह उन लोगों के विषय में, जिन्हें तूने दण्ड दिया, तेरी आँखों में आँखें डाल सकेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा सामना कर सकेगा” अथवा “तेरी दृष्टि का सामना कर सकेगा।” यूनानी क्रिया किसी से सीधे आमने-सामने होने का सजीव भाव देती है। “उन लोगों के विषय में” का अनुवाद “उन बातों के विषय में” भी सम्भव है।
    reason: दुर्लभ confrontation idiom और περὶ ὧν की व्याकरणिक अस्पष्टता को सुरक्षित रखना।
