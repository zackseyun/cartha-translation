  rationale: दुर्लभ यूनानी क्रिया आमने-सामने होकर दृष्टि मिलाने और सीधे सामना करने का सजीव बिंब देती है; हिन्दी मुहावरा उस साहसपूर्ण टकराव को सुरक्षित रखता है।
- source_word: περὶ ὧν
