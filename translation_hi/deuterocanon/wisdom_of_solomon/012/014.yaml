  rationale: यहाँ क्रिया दैवी न्याय के अंतर्गत दण्ड देने को व्यक्त करती है, केवल सुधारात्मक अनुशासन को नहीं।
theological_decisions:
- issue: परमेश्वर के सामने सांसारिक शासक के टकराव का आशय
  choice: कोई सांसारिक शासक परमेश्वर द्वारा दिए गए दण्ड को लेकर सीधे उसका सामना नहीं कर सकेगा।
  alternative: कोई शासक परमेश्वर से जवाब नहीं माँग सकता या उसके न्याय का विरोध नहीं कर सकता।
  rationale: अनुवाद सीधे आँख मिलाने का मूल बिंब बनाए रखता है और उसे स्पष्ट न्यायालयी जवाबदेही या विरोध के सिद्धान्त में बदलकर अन्तर्निहित तनाव को हल नहीं करता।
