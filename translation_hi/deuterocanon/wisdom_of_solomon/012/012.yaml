base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: hi
  text: क्योंकि कौन कहेगा, “तूने क्या किया?” या कौन तेरे न्याय का विरोध करेगा? जिन राष्ट्रों का तूने विनाश किया, उनके विषय में कौन तुझ पर अभियोग लगाएगा?[a] या अधर्मी मनुष्यों के विरुद्ध प्रतिशोध लेनेवाला बनकर कौन तेरे सामने उपस्थित होने आएगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का अधिक शाब्दिक रूप है, “नष्ट हो चुके राष्ट्रों के विषय में, जिन्हें तूने बनाया/जिनके साथ तूने ऐसा किया।” प्रसंग में इसका आशय उन राष्ट्रों से है जिनका विनाश परमेश्वर ने किया।
    reason: lexical_alternative
  - marker: b
    text: “तेरे सामने उपस्थित होने आएगा” के पीछे का यूनानी पदबंध कठिन है। इसका अर्थ अधिक विरोधात्मक या विधिक भाव में “तुझसे विवाद करने आगे आएगा” अथवा “तेरा सामना करने आएगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: क्योंकि कौन कहेगा
  rationale: γάρ के आधारसूचक अर्थ और भविष्यकालीन आलंकारिक प्रश्न—जिसका अपेक्षित उत्तर ‘कोई नहीं’ है—दोनों को बनाए रखता है।
- source_word: Τί ἐποίησας
  choice: तूने यह क्या किया?
  rationale: सीधी चुनौती के सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है; ‘यह’ प्रसंगगत है और प्रश्न को मुहावरेदार बनाता है, बिना ‘क्यों’ जोड़कर अर्थ बदलने के।
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: तेरे न्याय का विरोध करेगा
  rationale: ἀνθίστημι के सक्रिय प्रतिरोध और κρίμα के न्यायिक निर्णय—दोनों को स्पष्ट, आधुनिक हिन्दी में रखता है।
- source_word: ἐγκαλέσει σοι
  choice: तुझ पर अभियोग लगाएगा
  rationale: क्रिया के विधिक अर्थ को बनाए रखता है; केवल ‘दोष लगाएगा’ की अपेक्षा न्यायालय-सदृश भाषा अधिक स्पष्ट है।
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  choice: जिन राष्ट्रों का तूने विनाश किया, उनके विषय में
  rationale: 'संक्षिप्त और कठिन यूनानी रचना को प्रसंगानुसार व्यक्त करता है: राष्ट्र नष्ट हुए और यह परमेश्वर के किए से जुड़ा है। ‘राष्ट्रों’ आधुनिक पाठक के लिए ἔθνη का स्वाभाविक सामूहिक अर्थ देता है। शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।'
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: तेरा सामना करने आएगा
  rationale: दुर्लभ और कठिन अभिव्यक्ति के विरोधात्मक/विधिक भाव को स्वाभाविक हिन्दी में रखता है, पर उसकी संभावित व्याख्याओं को पादटिप्पणी में खुला छोड़ता है।
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: अधर्मी मनुष्यों के विरुद्ध प्रतिशोध लेनेवाला
  rationale: ἔκδικος के न्याय लागू करने अथवा प्रतिशोध लेनेवाले व्यक्ति के अर्थ और ἀδίκων के नैतिक-विधिक भाव को बनाए रखता है। ‘मनुष्यों’ ἀνθρώπων को न तो केवल पुरुषों तक सीमित करता है, न अमूर्त बनाता है।
theological_decisions:
- issue: परमेश्वर के न्याय को चुनौती देनेवाली आलंकारिक प्रश्नमाला
  choice: चारों प्रश्नों को प्रबल आलंकारिक चुनौतियों के रूप में रखा गया है, जिनका निहित उत्तर ‘कोई नहीं’ है।
  alternative: इन्हें केवल व्यावहारिक असमर्थता की हल्की अभिव्यक्ति मानना।
  rationale: बार-बार आया τίς और अभियोग, न्याय तथा प्रतिशोध की विधिक शब्दावली परमेश्वर के न्याय की अचुनौतीयोग्यता पर बल देती है; अनुवाद इससे आगे कोई व्यवस्थित दार्शनिक दावा नहीं जोड़ता।
- issue: नष्ट राष्ट्रों के साथ परमेश्वर के कृत्य का संबंध
  choice: ‘जिन राष्ट्रों का तूने विनाश किया’
  alternative: ‘जो नष्ट हो गए, जिन्हें तूने बनाया’ अथवा ‘जिनके साथ तूने ऐसा किया’।
  rationale: ἀπολωλότων और ἃ σὺ ἐποίησας का संबंध भाषिक रूप से कठिन है। मुख्य पाठ प्रसंग में निहित कारक भाव व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है; इस प्रकार दैवी न्याय का तनाव मिटाया नहीं गया।
- issue: ἀδίκων ἀνθρώπων का लिंग और दायरा
  choice: अधर्मी मनुष्यों
  alternative: अधर्मी पुरुषों; अन्यायी लोगों
  rationale: ἄνθρωποι सामान्यतः मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं; ‘मनुष्यों’ मूल की मानव-संज्ञा और न्यायिक संदर्भ दोनों को सुरक्षित रखता है।
