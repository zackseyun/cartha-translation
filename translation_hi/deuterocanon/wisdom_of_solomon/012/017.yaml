base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: hi
  text: क्योंकि जब तेरी सामर्थ्य की पूर्णता पर विश्वास नहीं किया जाता, तब तू अपना बल दिखाता है; और जो इसे जानते हैं, उनमें तू धृष्टता को उजागर करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तेरी सामर्थ्य की पूर्णता के विषय में तुझ पर विश्वास नहीं किया जाता।” यूनानी वाक्य संक्षिप्त है और अविश्वास का लक्ष्य स्वयं परमेश्वर अथवा उसकी सामर्थ्य की पूर्णता—दोनों में से किसी को प्रमुख बना सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: बल
  rationale: यहाँ ἰσχύς को ‘बल’ कहा गया है, ताकि इसी पद में आगे आने वाले δύναμις (‘सामर्थ्य’) से उसका शब्दगत भेद बना रहे।
- source_word: ἐνδείκνυσαι
  choice: तू ... दिखाता है
  rationale: क्रिया का अर्थ दिखाना या प्रदर्शित करना है; ‘दिखाता है’ सहज और स्पष्ट हिन्दी है।
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: जब तेरी सामर्थ्य की पूर्णता पर विश्वास नहीं किया जाता
  rationale: यह अनुवाद संक्षिप्त यूनानी रचना में निहित अविश्वास और सामर्थ्य की पूर्णता के संबंध को व्यक्त करता है, पर यह तय नहीं करता कि अविश्वास सीधे परमेश्वर पर है या उसकी पूर्ण सामर्थ्य पर।
- source_word: ἐν τοῖς εἰδόσι
  choice: जो उसे जानते हैं, उनके बीच
  rationale: ἐν के समूहगत भाव को ‘के बीच’ से व्यक्त किया गया है; ‘उसे’ निकटवर्ती सामर्थ्य/उसकी पूर्णता की ओर संकेत करता है।
- source_word: τὸ θράσος
  choice: धृष्टता
  rationale: संदर्भ में θράσος का भाव सकारात्मक साहस नहीं, बल्कि दुस्साहस या उद्दंडता है; ‘धृष्टता’ इस नकारात्मक अर्थ को संक्षेप में व्यक्त करती है।
- source_word: ἐξελέγχεις
  choice: बेनकाब करता है
  rationale: ἐξελέγχω किसी दोष को प्रकाश में लाकर उजागर करने, दोषी ठहराने या झिड़कने का भाव रखता है; ‘बेनकाब करता है’ यहाँ धृष्टता को सामने लाने की शक्ति व्यक्त करता है।
theological_decisions:
- issue: अविश्वास का लक्ष्य और परमेश्वर की सामर्थ्य की पूर्णता
  choice: मुख्य पाठ में ‘तेरी सामर्थ्य की पूर्णता पर विश्वास नहीं किया जाता’ रखा गया है।
  alternative: ‘जब तेरी पूर्ण सामर्थ्य के विषय में तुझ पर विश्वास नहीं किया जाता।’
  rationale: ἀπιστούμενος व्याकरणतः परमेश्वर के ‘अविश्वसनीय समझे जाने’ की ओर संकेत कर सकता है, जबकि ἐπὶ δυνάμεως τελειότητι उस अविश्वास को उसकी सामर्थ्य की पूर्णता से जोड़ता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को एकवचन निकट संबोधन ‘तू/तेरी’ से संबोधित किया गया है। ‘बल’ और ‘सामर्थ्य’ अलग रखकर मूल के ἰσχύς और δύναμις का भेद सुरक्षित किया गया है।
