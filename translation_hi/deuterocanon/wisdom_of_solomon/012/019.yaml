base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: hi
  text: परन्तु ऐसे कार्यों के द्वारा तूने अपनी प्रजा को सिखाया कि धर्मी को मनुष्यों के प्रति दयालु होना चाहिए[a]; और तूने अपने पुत्रों को अच्छी आशा से भर दिया[b], क्योंकि तू पापों के सम्बन्ध में पश्चात्ताप प्रदान करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी को लोगों के प्रति कृपालु होना चाहिए।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “अपने पुत्रों” है; यहाँ यह परमेश्वर की सन्तान अथवा उसकी प्रजा का प्रतिनिधिक उल्लेख हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: ऐसे कामों के द्वारा
  rationale: διά के संबंधकारक प्रयोग का साधनसूचक अर्थ है; ἔργων यहाँ परमेश्वर के पहले वर्णित कार्यों की ओर संकेत करता है।
- source_word: δεῖ
  choice: होना चाहिए
  rationale: यह नैतिक आवश्यकता व्यक्त करता है; आधुनिक हिन्दी में 'होना चाहिए' स्वाभाविक और स्पष्ट है।
- source_word: τὸν δίκαιον
  choice: धर्मी
  rationale: यूनानी का एकवचन पुल्लिंग विशेषण संज्ञा के रूप में प्रतिनिधिक अर्थ रखता है; 'धर्मी' हिन्दी में उसी रूप को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: φιλάνθρωπον
  choice: मनुष्यों के प्रति दयालु
  rationale: यह शब्द मानवों के प्रति परोपकार, कृपा और सदयता का भाव रखता है; यह अनुवाद उसे केवल 'करुणामय' जैसे अधिक विशिष्ट धार्मिक अर्थ तक सीमित नहीं करता।
- source_word: εὐέλπιδας
  choice: अच्छी आशा से भर दिया
  rationale: विशेषण सकारात्मक और भरोसे-भरी आशा रखने का भाव देता है; हिन्दी वाक्यांश उसकी प्रबलता को व्यक्त करता है।
- source_word: τοὺς υἱούς σου
  choice: अपने पुत्रों
  rationale: यूनानी में स्पष्ट रूप से बहुवचन 'पुत्र' है; मुख्य पाठ स्रोत की लैंगिक और आलंकारिक आकृति बनाए रखता है, जबकि पादटिप्पणी उसके प्रतिनिधिक अर्थ को स्पष्ट करती है।
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: पापों के लिए मन-फिराव प्रदान करता है
  rationale: वाक्यांश पापों के संबंध में परमेश्वर द्वारा मन-फिराव दिए या उपलब्ध कराए जाने को व्यक्त करता है। 'प्रदान करता है' दैवी पहल बनाए रखता है, पर अवसर या अनुमति जैसी किसी एक व्याख्या को अनिवार्य नहीं करता।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग पद
  choice: '''धर्मी'' और ''अपने पुत्रों'' को मुख्य पाठ में रखा गया'
  alternative: '''धर्मी व्यक्ति'' और ''अपनी सन्तान'''
  rationale: मूल यूनानी पुल्लिंग रूपों का प्रयोग करता है। हिन्दी में 'धर्मी' प्रतिनिधिक एकवचन के रूप में स्वाभाविक है, और 'पुत्रों' मूल की स्पष्ट शब्दावली को सुरक्षित रखता है; व्यापक सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
- issue: परमेश्वर द्वारा μετάνοια दिया जाना
  choice: मन-फिराव प्रदान करता है
  alternative: मन फिराने का अवसर देता है; पापों के बाद मन फिराने देता है
  rationale: अनुवाद परमेश्वर की अनुग्रहपूर्ण पहल को बनाए रखता है, पर यह निर्धारित नहीं करता कि यहाँ स्वयं मन-फिराव, उसका अवसर, या उसकी अनुमति में से कौन-सा सूक्ष्म अर्थ प्रमुख है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। परमेश्वर के लिए निकटवर्ती एकवचन 'तू' मूल यूनानी के एकवचन संबोधन और बाइबलीय काव्य-प्रार्थना शैली को दर्शाता है। 'मन-फिराव' μετάνοια के दिशा-परिवर्तन के भाव को 'पश्चात्ताप' की तुलना में अधिक प्रत्यक्ष रखता है।
