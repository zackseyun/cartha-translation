    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε
  choice: चाहे
  rationale: संदर्भ में यह रियायती शर्त व्यक्त करता है; आधुनिक हिन्दी में ‘चाहे’ स्वाभाविक और स्पष्ट है।
- source_word: ὀξέως
  choice: शीघ्र
  rationale: यह क्रिया-विशेषण गति या कम समय में होने का बोध देता है। ‘शीघ्र’ मूल अर्थ को रखता है और ‘अकाल’ जैसी व्याख्यात्मक धारणा नहीं जोड़ता।
- source_word: τελευτήσωσιν
  choice: मर जाएँ
  rationale: यहाँ क्रिया जीवन के अंत, अर्थात मृत्यु, के लिए प्रयुक्त है; ‘मर जाएँ’ सीधा और सहज अनुवाद है।
- source_word: ἐλπίδα
  choice: आशा
  rationale: यह शब्द आशा या अपेक्षा का बोध देता है; इस संदर्भ में ‘आशा’ सर्वाधिक स्वाभाविक है।
- source_word: ἡμέρᾳ διαγνώσεως
  choice: न्याय के दिन
  rationale: διάγνωσις निर्णायक जाँच, निर्णय या न्याय को सूचित कर सकता है। मृत्यु के बाद के प्रतिफल के संदर्भ में ‘न्याय’ उपयुक्त है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: παραμύθιον
  choice: सांत्वना
  rationale: यह संज्ञा दिलासा या सांत्वना को सूचित करती है; ‘सांत्वना’ गरिमापूर्ण और प्रचलित हिन्दी है।
theological_decisions:
- issue: ἡμέρᾳ διαγνώσεως का अंतिम न्याय-संबंधी आशय
  choice: न्याय के दिन
  alternative: निर्णय के दिन; परख के दिन
  rationale: आस-पास का प्रसंग मृत्यु के बाद धर्मियों और अधर्मियों की दशा में अंतर करता है। ‘न्याय के दिन’ इस अंतिम लेखे के आशय को व्यक्त करता है, पर यूनानी शब्द की व्यापकता को पाद-टिप्पणी में बनाए रखा गया है।
