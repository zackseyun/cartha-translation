  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: hi
  text: जिन्होंने उस पर भरोसा रखा है, वे सत्य को समझेंगे; और निष्ठावान जन प्रेम में उसके साथ बने रहेंगे[a], क्योंकि अनुग्रह और दया उसके चुने हुओं[b] के लिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी प्रतीक्षा करेंगे”; यूनानी क्रिया का अर्थ किसी के साथ बने रहना या आशा से उसकी प्रतीक्षा करना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके निर्वाचित जनों के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: जिन्होंने उस पर भरोसा रखा है
  rationale: पूर्णकालिक कृदन्त भरोसा करने से उत्पन्न स्थायी अवस्था को व्यक्त करता है। ‘भरोसा रखा है’ इस पूर्ण और अब भी जारी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συνήσουσιν ἀλήθειαν
  choice: सत्य को समझेंगे
  rationale: συνίημι का भविष्यकाल समझने या बोध पाने को व्यक्त करता है। अनिश्चित ἀλήθειαν को बिना अनावश्यक विशिष्टीकरण के ‘सत्य’ कहा गया है।
- source_word: οἱ πιστοὶ
  choice: विश्वासयोग्य जन
  rationale: यहाँ πιστοί उन लोगों की स्थिर निष्ठा पर बल देता है। ‘विश्वासयोग्य जन’ इसे केवल किसी मत को मानने वालों की संज्ञा बनाने से बचाता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: संक्षिप्त यूनानी पदबंध को वैसा ही खुला रखा गया है; यह स्पष्ट नहीं किया गया कि प्रेम परमेश्वर का है, उनका है, या वह संबंध का क्षेत्र है।
- source_word: προσμενοῦσιν αὐτῷ
  choice: उसके साथ बने रहेंगे
  rationale: προσμένω का अर्थ किसी के साथ बने रहना, जारी रहना या उसकी प्रतीक्षा करना हो सकता है। प्रसंग में ‘साथ बने रहेंगे’ स्थायी संगति को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: χάρις καὶ ἔλεος
  choice: अनुग्रह और दया
  rationale: दोनों अलग यूनानी संज्ञाओं और उनके धार्मिक भार को स्पष्ट, प्रचलित हिन्दी में सुरक्षित रखा गया है।
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: उसके चुने हुओं के लिए
  rationale: ‘चुने हुए’ ἐκλεκτοῖς में निहित चयन को सरल आधुनिक हिन्दी में व्यक्त करता है और बाद की संप्रदायगत पारिभाषिकता थोपने से बचता है।
theological_decisions:
- issue: πιστοὶ में विश्वास और विश्वासयोग्यता का संबंध
  choice: विश्वासयोग्य जन
  alternative: विश्वास करनेवाले
  rationale: ज्ञान-साहित्य के इस संदर्भ में धर्मियों की अटल निष्ठा प्रमुख प्रतीत होती है। यह पहले खंड के ‘भरोसा रखा है’ के साथ समानांतरता भी बनाए रखता है।
- issue: προσμενοῦσιν αὐτῷ का अर्थ
  choice: उसके साथ बने रहेंगे
  alternative: उसकी बाट जोहेंगे
  rationale: आस-पास का प्रसंग धर्मियों की अंतिम दशा का वर्णन करता है, इसलिए स्थायी संगति का अर्थ उपयुक्त है; फिर भी क्रिया में संभावित प्रतीक्षा का अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐκλεκτοῖς का धार्मिक आशय
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: यूनानी पाठ परमेश्वर द्वारा चुने गए लोगों का संकेत देता है। सामान्य हिन्दी का प्रयोग बाद की व्यवस्थित धर्मशास्त्रीय धारणाएँ जोड़े बिना इस अर्थ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की समानांतर रचना तथा ‘प्रेम में’ की जानबूझकर खुली हुई अर्थ-सीमा सुरक्षित है। पादटिप्पणी-चिह्न उन पदों पर लगाए गए हैं जिनसे उनके वास्तविक वैकल्पिक पाठ संबंधित हैं।
