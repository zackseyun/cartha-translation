- source_word: ἀσεβεῖς
  choice: भक्तिहीनों
  rationale: यह शब्द नैतिक दुष्टता के साथ परमेश्वर के प्रति अनादर का भाव भी रखता है; ‘भक्तिहीन’ दोनों पक्षों को संक्षेप में व्यक्त करता है।
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: जो कुछ उन्होंने सोचा था, उसी के अनुसार
  rationale: यह उनकी सोच, विचार या योजना और मिलने वाले दण्ड के बीच अनुरूपता बनाए रखता है, पर दुर्भावनापूर्ण षड्यंत्र का अर्थ अनिवार्य नहीं बनाता।
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: दण्ड मिलेगा
  rationale: ἐπιτιμία यहाँ दण्ड या दण्डात्मक परिणाम को सूचित करता है; यह हिन्दी में स्वाभाविक भविष्यकालीन अभिव्यक्ति है।
- source_word: τοῦ δικαίου
  choice: धर्मी जन
  rationale: यूनानी में निश्चित एकवचन व्यक्ति है। ‘धर्मी जन’ उसके व्यक्तिगत और प्रतिनिधि स्वरूप को बनाए रखता है तथा अमूर्त ‘धार्मिकता’ नहीं बनाता।
- source_word: ἀμελήσαντες
  choice: उपेक्षा की
  rationale: यह जानबूझकर ध्यान न देने, परवाह न करने या अनदेखा करने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου ἀποστάντες
  choice: प्रभु से दूर हो गए
  rationale: यह प्रभु से हट जाने या मुँह मोड़ लेने का भाव रखता है, बिना अधिक तकनीकी ‘धर्मत्याग’ शब्द आरोपित किए।
theological_decisions:
- issue: τοῦ δικαίου का अभिप्रेत व्यक्ति
  choice: धर्मी जन—निकटवर्ती साहित्यिक प्रसंग का प्रतिनिधि धर्मी व्यक्ति
  alternative: सामूहिक रूप से धर्मी लोग, अथवा अमूर्त धार्मिकता/न्याय
  rationale: निश्चित एकवचन और पिछले प्रसंग का प्रवाह व्यक्तिगत अभिप्राय का समर्थन करते हैं; अनुवाद इससे आगे बढ़कर किसी विशिष्ट मसीही पहचान को आरोपित नहीं करता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस यहूदी-यूनानी ज्ञान-साहित्य के प्रसंग में κύριος परमेश्वर को सूचित करता है; ‘प्रभु’ उसका धार्मिक भार और प्रचलित बाइबलीय प्रयोग बनाए रखता है।
- issue: दण्ड और उनकी सोच का संबंध
  choice: दण्ड उनकी अपनी सोच या योजनाओं के अनुरूप होगा
  alternative: केवल उनकी योजनाएँ बनाने के अपराध के कारण दण्ड मिलेगा
  rationale: καθʼ ἃ अनुरूपता और आधार—दोनों की छाया रख सकता है। मुख्य पाठ अनुरूपता को बनाए रखता है और पादटिप्पणी वैकल्पिक अर्थ खोलती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम यूनानी सहभागी पदों को मुख्य कथन से जोड़ता है, पर स्पष्ट कारणसूचक संबंध आरोपित नहीं करता।
