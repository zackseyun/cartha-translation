translation:
  language: hi
  text: परन्तु अधर्मियों को उनकी सोच के अनुसार दंड मिलेगा[a]; उन्होंने धर्मी व्यक्ति[b] की उपेक्षा की और प्रभु से मुँह मोड़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विचार के अनुसार” अथवा “उनकी योजनाओं के अनुसार।” यूनानी वाक्य इस बात पर बल देता है कि उनका दंड उनकी अपनी सोच और योजनाओं के अनुरूप है।
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मी जन।” एकवचन पद सम्भवतः इस पुस्तक के तर्क में प्रतिनिधि धर्मी व्यक्ति की ओर संकेत करता है।
    reason: alternative_reading
