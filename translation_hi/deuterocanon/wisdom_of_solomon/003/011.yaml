base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: hi
  text: क्योंकि जो बुद्धि और शिक्षा[a] को तुच्छ समझता है, वह दयनीय है; ऐसे लोगों की आशा खोखली, उनका परिश्रम मूर्खतापूर्ण और उनके काम अनुपयोगी होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासन”; यूनानी शब्द παιδεία में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—सभी शामिल हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ज्ञान-साहित्य के संदर्भ में यह नैतिक और बौद्धिक विवेक को दर्शाता है; ‘बुद्धि’ इसका स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: παιδείαν
  choice: शिक्षा
  rationale: यह शब्द शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—तीनों का भाव रख सकता है। मुख्य पाठ में ‘शिक्षा’ सहज है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὁ ἐξουδενῶν
  choice: जो ... को तुच्छ समझता है
  rationale: यह सक्रिय अवमानना और किसी वस्तु को नगण्य मानने का भाव व्यक्त करता है।
- source_word: ταλαίπωρος
  choice: दयनीय
  rationale: यह दुःखद और तरस योग्य दशा को स्पष्ट करता है तथा आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: ऐसे लोगों की आशा खोखली
  rationale: ‘खोखली’ κενή के खाली और सारहीन होने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ κόποι ἀνόητοι
  choice: उनका परिश्रम मूर्खतापूर्ण
  rationale: κόποι कठिन श्रम को और ἀνόητοι समझ से रहित अथवा मूर्खतापूर्ण होने को व्यक्त करता है; अनुवाद इस कठोर मूल्यांकन को बनाए रखता है।
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: उनके काम अनुपयोगी
  rationale: ἄχρηστα का अर्थ किसी उपयोग या लाभ के न होना है; ‘अनुपयोगी’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: एकवचन कर्ता से बहुवचन संबंधवाचक रूपों की ओर परिवर्तन
  choice: आरंभ में प्रतिनिधिक एकवचन ‘जो ... समझता है’ रखा गया और आगे ‘ऐसे लोगों’ तथा बहुवचन संबंधों से उस पूरे वर्ग का संकेत दिया गया।
  alternative: 'पूरे वाक्य को एकवचन में रखना: ‘उसकी आशा... उसका परिश्रम... उसके काम’।'
  rationale: यूनानी पाठ एकवचन कृदंत से बहुवचन αὐτῶν की ओर स्वयं बदलता है। हिन्दी में ‘ऐसे लोगों’ से यह बदलाव स्पष्ट और स्वाभाविक बनता है, बिना पाठ के आशय को किसी एक लिंग तक सीमित किए।
- issue: κόποι ἀνόητοι का अर्थ
  choice: परिश्रम मूर्खतापूर्ण
  alternative: परिश्रम निष्फल
  rationale: ἀνόητοι मूलतः समझ या विवेक से रहित होने का भाव रखता है। ‘निष्फल’ परिणाम पर अधिक बल देता और अगले ‘अनुपयोगी’ के अर्थ से मिल जाता; इसलिए मूल की वैचारिक धार बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखा गया है। ‘शिक्षा’ और ‘अनुशासन’ के बीच मूल शब्द की अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
