  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/012.yaml
  text: Their women are foolish[a], and their children are evil[b]; their offspring is accursed.
translation:
  language: hi
  text: उनकी स्त्रियाँ[a] मूर्ख हैं, और उनके बच्चे दुष्ट हैं; उनका वंश[b] शापित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी पत्नियाँ’। यूनानी शब्द γυναῖκες का अर्थ संदर्भ के अनुसार ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी संतान’ अथवा ‘उनकी वंश-परंपरा’। यूनानी शब्द γένεσις संतान, वंश या वंशक्रम को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: γυνή का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। ‘स्त्रियाँ’ यूनानी बहुवचन का सीधा रूप है; पारिवारिक संदर्भ में ‘पत्नियाँ’ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἄφρονες
  choice: मूर्ख
  rationale: यह शब्द समझ-बूझ के अभाव को व्यक्त करता है। ‘मूर्ख’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है तथा कथन की बौद्धिक और नैतिक तीक्ष्णता बनाए रखता है।
- source_word: πονηρά
  choice: दुष्ट
  rationale: यहाँ शब्द केवल खराब होने का नहीं, बल्कि नैतिक बुराई का बोध कराता है। ‘दुष्ट’ इस न्यायसूचक संदर्भ में उपयुक्त है।
- source_word: τέκνα
  choice: बच्चे
  rationale: τέκνα का स्वाभाविक अर्थ ‘बच्चे’ है। इससे बाद के γένεσις के व्यापक वंशगत अर्थ से भेद बना रहता है।
- source_word: ἐπικατάρατος
  choice: शापित
  rationale: यह विशेषण शाप के अधीन होने का गंभीर भाव रखता है। ‘शापित’ आधुनिक हिन्दी में स्पष्ट है और मूल का गंभीर न्यायसूचक स्वर बनाए रखता है।
- source_word: γένεσις
  choice: वंश
  rationale: यहाँ γένεσις उत्पन्न संतान, वंशक्रम या वंश को सूचित कर सकता है। पारिवारिक त्रिक में ‘वंश’ स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: परिवार और वंश पर न्यायसूचक कथन का आशय और तीव्रता
  choice: पद को उनके घराने और वंश के विषय में सीधे और कठोर न्यायसूचक कथन के रूप में रखा गया है।
  alternative: इसे नैतिक निंदा के बजाय सामान्य दुर्भाग्य का नरम कथन माना जा सकता था।
  rationale: यूनानी पाठ में ‘मूर्ख’, ‘दुष्ट’ और ‘शापित’ जैसे स्पष्ट विधेय-विशेषण हैं और कथन को हल्का करने का कोई पाठगत आधार नहीं है। इसलिए मूल की नैतिक और धर्मवैचारिक कठिनाई को बिना सुलझाए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे समानांतर खंड और अर्धविराम मूल यूनानी कथन की संक्षिप्त, प्रहारक लय को बनाए रखते हैं।
