lexical_decisions:
- source_word: ἔδοξαν
  choice: जान पड़े
  rationale: यह क्रिया देखने वालों की धारणा व्यक्त करती है, वस्तुगत सत्य नहीं; ‘जान पड़े’ आगे आने वाले दृष्टिकोण-विरोध को सुरक्षित रखता है।
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: मूर्खों की दृष्टि में
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और ἀφρόνων की नैतिक-बौद्धिक तीक्ष्णता बनाए रखता है।
- source_word: τεθνάναι
  choice: मरे हुए
  rationale: पूर्ण infinitive मृत्यु के फलस्वरूप बनी अवस्था को दर्शाता है; ‘मरे हुए जान पड़े’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλογίσθη
  choice: माना गया
  rationale: यह निष्क्रिय रूप पर्यवेक्षकों द्वारा किए गए आकलन या निर्णय को दर्शाता है।
- source_word: ἡ ἔξοδος αὐτῶν
  choice: उनके प्रस्थान को
  rationale: ‘प्रस्थान’ मृत्यु के लिए प्रयुक्त रूपक को बनाए रखता है और उसे सीधे ‘मृत्यु’ कहकर उसकी अर्थ-छाया को समतल नहीं करता।
theological_decisions:
- issue: ἔξοδος में मृत्यु का रूपक
  choice: उनके प्रस्थान को
  alternative: उनकी मृत्यु को / उनके अंत को
  rationale: ‘प्रस्थान’ निकटवर्ती संदर्भ में मनुष्यों की धारणा और धर्मियों की वास्तविक दशा के बीच तनाव को बनाए रखता है।
- issue: आपूर्तित यूनानी पाठ में ἐλογίσθη का विधेय-पूरक अनुपस्थित होना
  choice: अपूर्ण वाक्यांश को टिप्पणी सहित बनाए रखा गया
  alternative: ‘विपत्ति माना गया’ जोड़ना
  rationale: दिए गए मूल-पाठ में ‘विपत्ति’ के अनुरूप कोई शब्द नहीं है और पाठ अल्पविराम पर समाप्त होता है; इसलिए परामर्शी अंग्रेज़ी से अनुपस्थित शब्द को मुख्य पाठ में आयात नहीं किया गया।
