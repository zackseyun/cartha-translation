translation:
  language: hi
  text: और थोड़ा-सा अनुशासन पाने के बाद[a] उन्हें बहुत बड़ा लाभ मिलेगा[b], क्योंकि परमेश्वर ने उन्हें परखा और उन्हें अपने योग्य पाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘थोड़े समय तक अनुशासन पाने के बाद,’ अथवा ‘यद्यपि उन्हें थोड़ा ही अनुशासन मिला।’ यूनानी शब्द अनुशासन की सीमित मात्रा या सीमित अवधि, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके साथ बहुत भलाई की जाएगी।’ यूनानी में शाब्दिक रूप से बहुत लाभ पहुँचाए जाने की बात है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उन्हें अपने लिए योग्य पाया।’ यह पदबंध इस बात पर बल देता है कि वे स्वयं परमेश्वर के संबंध में योग्य पाए गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: थोड़े-से
  rationale: यह क्रियाविशेषण-सदृश प्रयोग अनुशासन की सीमित मात्रा या अवधि, दोनों का संकेत दे सकता है। ‘थोड़े-से’ अगले पदबंध ‘बड़े उपकार’ के साथ यूनानी विरोधाभास को बनाए रखता है।
- source_word: παιδευθέντες
  choice: अनुशासन के बाद
  rationale: παιδεύω में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन के अर्थ समाए हैं। यहाँ ‘अनुशासन’ केवल दंड का संकीर्ण अर्थ थोपे बिना निर्माणकारी और सुधारात्मक भाव रखता है।
- source_word: μεγάλα … εὐεργετηθήσονται
  choice: उन्हें बड़े उपकार मिलेंगे
  rationale: यूनानी का शाब्दिक भाव है कि उनके साथ बड़ी भलाई की जाएगी या उन्हें बड़े लाभ प्राप्त होंगे। यह हिन्दी प्रयोग स्वाभाविक है और प्रदत्त भलाई के निष्क्रिय भाव को सुरक्षित रखता है।
- source_word: ἐπείρασεν
  choice: परखा
  rationale: यहाँ क्रिया का अर्थ चरित्र की परीक्षा लेना है, बुराई के लिए लुभाना नहीं। ‘परखा’ आधुनिक हिन्दी में इस आशय को स्पष्ट रखता है।
- source_word: ἀξίους ἑαυτοῦ
  choice: अपने योग्य
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति है, जो इस बात को बनाए रखती है कि उनकी योग्यता स्वयं परमेश्वर के संबंध में आँकी गई।
theological_decisions:
- issue: दुःख और परमेश्वर की परीक्षा का संबंध
  choice: परमेश्वर ने उन्हें परखा
  alternative: परमेश्वर ने उन्हें सिद्ध प्रमाणित किया
  rationale: मूल पाठ दुःख को ऐसी परीक्षा के रूप में प्रस्तुत करता है जिसमें उनकी योग्यता सामने आती है। ‘परखा’ यह तनाव बनाए रखता है और इसे न तो बुराई के प्रलोभन में बदलता है, न दंड या पवित्रीकरण के किसी विस्तृत सिद्धांत को पाठ में जोड़ता है।
- issue: ἑαυτοῦ के संबंध का अर्थ
  choice: अपने योग्य पाया
  alternative: अपने लिए योग्य पाया
  rationale: ‘अपने योग्य’ यूनानी संबंधवाचक संरचना के अधिक निकट है और इस अस्पष्टता को बनाए रखता है कि वे परमेश्वर के योग्य अथवा उसके संबंध में उपयुक्त पाए गए; ‘अपने लिए’ अधिक उद्देश्यपरक व्याख्या करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘अनुशासन’ παιδεύω के निर्माणकारी और सुधारात्मक दोनों भावों को समेटता है; ‘परखा’ परीक्षा और प्रलोभन में भेद स्पष्ट करता है। सभी वास्तविक lexical alternatives को पादटिप्पणियों में रखा गया है।
