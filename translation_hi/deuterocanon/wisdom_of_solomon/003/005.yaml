  naturalness: ‘थोड़ा-सा अनुशासन पाने के बाद’ is idiomatic modern Hindi and retains the source’s ambiguity between limited degree and duration. ‘उन्हें बहुत बड़ा लाभ मिलेगा’ is more natural than ‘उन्हें बड़े उपकार मिलेंगे,’ while still expressing bestowed great benefit.
  terminology: ‘अनुशासन’ appropriately retains the formative/corrective range of παιδεύω; ‘परखा’ correctly renders testing rather than temptation; and ‘अपने योग्य पाया’ is a natural, source-faithful rendering of ἀξίους ἑαυτοῦ without forcing the more purposive sense ‘अपने लिए.’
