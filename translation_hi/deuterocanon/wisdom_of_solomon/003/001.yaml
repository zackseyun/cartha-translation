  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: hi
  text: परन्तु धर्मियों की आत्माएँ परमेश्वर के हाथ में हैं, और कोई यातना[a] उन्हें कभी नहीं छुएगी।
  philosophy: optimal-equivalence
  footnotes:
