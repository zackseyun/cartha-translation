    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  choice: धर्मियों की
  rationale: यह δίκαιος का संबंधकारक बहुवचन संज्ञात्मक प्रयोग है। ‘धर्मियों’ से नैतिक और धर्मवैचारिक श्रेणी संक्षिप्त तथा स्वाभाविक रूप में बनी रहती है।
- source_word: ψυχαὶ
  choice: आत्माएँ
  rationale: ψυχή का अर्थ ‘आत्मा’, ‘जीवन’ या ‘व्यक्ति’ हो सकता है; निकटवर्ती संदर्भ में दिखाई देने वाली मृत्यु के बाद भी धर्मियों के अस्तित्व की बात होने के कारण ‘आत्माएँ’ सबसे पारदर्शी अनुवाद है।
- source_word: ἐν χειρὶ θεοῦ
  choice: परमेश्वर के हाथ में
  rationale: मूल बाइबलीय रूपक को बनाए रखा गया है। यह सुरक्षा, अधिकार और संरक्षण के अर्थ सुझाता है, पर अनुवाद उनमें से किसी एक तक अर्थ को सीमित नहीं करता।
- source_word: οὐ μὴ ἅψηται αὐτῶν
  choice: उन्हें कभी नहीं छुएगी
  rationale: οὐ μή के साथ aorist subjunctive अत्यंत प्रबल निषेध व्यक्त करता है। ‘कभी नहीं’ आधुनिक हिन्दी में इस बल को स्वाभाविक ढंग से प्रकट करता है।
- source_word: βάσανος
  choice: यातना
  rationale: βάσανος कठोर पीड़ा, यंत्रणा या यातना को दर्शा सकता है। यहाँ ‘यातना’ शब्द उसकी तीव्रता को बनाए रखता है; व्यापक विकल्प को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ψυχαί और मृत्यु के बाद अस्तित्व का संबंध
  choice: मुख्य पाठ में ‘आत्माएँ’
  alternative: ‘जीवन’ या ‘व्यक्ति’
  rationale: निकटवर्ती संदर्भ दृश्य मृत्यु के पार धर्मियों के निरंतर अस्तित्व की ओर संकेत करता है। ‘आत्माएँ’ मूल की मानव-स्वरूप और अंतकाल-संबंधी गंभीरता बनाए रखता है, पर इससे आगे किसी विस्तृत सिद्धान्त को आरोपित नहीं करता।
- issue: ἐν χειρὶ θεοῦ रूपक का अर्थ
  choice: ‘परमेश्वर के हाथ में’ के रूप में रूपक को सुरक्षित रखना
  alternative: ‘परमेश्वर की सुरक्षा में’ या ‘परमेश्वर की देखभाल में’
  rationale: शाब्दिक रूपक हिन्दी में बोधगम्य है और सुरक्षा, संरक्षण तथा अधिकार की संयुक्त अर्थ-छटा को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। मूल यूनानी की ‘हाथ’ वाली छवि और प्रबल निषेध दोनों सुरक्षित रखे गए हैं। पादटिप्पणी-चिह्न को उसी शब्द-विचार के बाद रखा गया है जिससे वह संबंधित है।
