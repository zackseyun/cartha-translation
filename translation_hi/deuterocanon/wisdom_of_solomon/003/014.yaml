  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अपने हाथ से’ और बाहरी कर्म/भीतरी विचार का समानान्तर ढाँचा मूल से सुरक्षित रखा गया है। ‘नपुंसक’ यहाँ ऐतिहासिक शारीरिक-सामाजिक पद है, न कि सामान्य अपमानसूचक प्रयोग।
