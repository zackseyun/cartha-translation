translation:
  language: hi
  text: और वह नपुंसक, जिसने अपने हाथ से कोई अधर्म नहीं किया और न प्रभु के विरुद्ध बुरी बातों का विचार किया, उसे विश्वास का उत्तम अनुग्रह[a] और प्रभु के मन्दिर में अधिक मनभावना भाग[b] दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास का चुना हुआ वरदान,” “विश्वासयोग्यता का उत्तम अनुग्रह,” अथवा “भरोसे का अति उत्तम अनुग्रह।” यूनानी पदबंध संक्षिप्त है और ‘अनुग्रह’ तथा ‘विश्वास’ दोनों के लिए एक से अधिक अर्थच्छायाएँ सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “अधिक प्रिय हिस्सा” अथवा “अधिक वांछनीय भाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  choice: नपुंसक
  rationale: यूनानी शब्द शारीरिक रूप से नपुंसक किए गए पुरुष को सूचित करता है; संदर्भ की सामाजिक और धार्मिक धार को बनाए रखने के लिए ठोस पद रखा गया है।
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: जिसने अपने हाथ से कोई अधर्म नहीं किया
  rationale: ‘अपने हाथ से’ मूल की सजीव शारीरिक अभिव्यक्ति रखता है, जबकि ‘अधर्म नहीं किया’ आधुनिक हिन्दी में स्वाभाविक रूप से ἀνόμημα का नैतिक-विधिक भाव व्यक्त करता है।
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: और न प्रभु के विरुद्ध किसी बुरी बात का विचार किया
  rationale: यह बाहरी कर्म के साथ भीतरी सोच का विरोध बनाए रखता है और κατὰ की विरोधात्मक दिशा को स्पष्ट करता है।
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: विश्वास का उत्तम अनुग्रह
  rationale: πίστις को ‘विश्वास’ और χάρις को ‘अनुग्रह’ दिया गया है; ἐκλεκτή का गुणात्मक भाव ‘उत्तम’ से व्यक्त होता है। संक्षिप्त यूनानी पदबंध की अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: κλῆρος ἐν ναῷ Κυρίου θυμηρέστερος
  choice: प्रभु के मन्दिर में अधिक मनभावना भाग
  rationale: κλῆρος का मूल अर्थ आवंटित भाग है; ‘भाग’ ‘विरासत’ से कम व्याख्यात्मक है। θυμηρέστερος की तुलनात्मक शक्ति ‘अधिक मनभावना’ में बनी रहती है।
theological_decisions:
- issue: τῆς πίστεως χάρις ἐκλεκτή में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: πίστις का सामान्य धार्मिक अर्थ ‘विश्वास’ मुख्य पाठ में उचित है, पर पदबंध की संक्षिप्तता अन्य अर्थच्छायाओं को सम्भव बनाती है; उन्हें पादटिप्पणी में रखा गया है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस ईश्वरीय संदर्भ में ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा का स्वाभाविक और गैर-साम्प्रदायिक रूप है।
- issue: κλῆρος का अर्थ
  choice: भाग
  alternative: विरासत; चिट्ठी से मिला अंश
  rationale: इनाम के संदर्भ में ‘भाग’ आवंटित हिस्से का अर्थ रखता है और किसी विशेष उत्तराधिकार-सिद्धान्त को अनावश्यक रूप से नहीं जोड़ता।
