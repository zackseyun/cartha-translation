  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘धन्य’, ‘निष्कलंक’ और ‘शय्या’ जैसे शब्द ऊँचे साहित्यिक स्वर को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
