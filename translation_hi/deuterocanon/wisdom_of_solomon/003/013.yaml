review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the verse's principal contrasts and preserves the open-ended sense of ἐν ἐπισκοπῇ ψυχῶν. However, ‘अपराध की शय्या’ turns Greek ἐν παραπτώματι (‘in transgression’) into a possessive construction (‘the bed of transgression’), and ‘शय्या को नहीं जाना’ is not a clear or natural Hindi sexual euphemism.
  naturalness: The overall elevated register is suitable. ‘आत्माओं की सुधि ली जाएगी’ is natural and appropriately leaves divine visitation/reckoning unspecified. Recasting the sexual phrase makes the sentence intelligible to modern Hindi readers without adding a specific kind of offense.
  terminology: ‘धन्य,’ ‘बाँझ स्त्री,’ and ‘आत्माओं’ are appropriate. ‘कलंक-रहित’ more directly communicates ἀμίαντος as freedom from defilement than ‘निष्कलंक,’ which can suggest blamelessness in a broader or forensic sense. ‘फल पाएगी’ retains the source's deliberate ‘have fruit’ wording more closely than ‘फल मिलेगा.’
  issues:
  - severity: medium
    issue: ‘अपराध की शय्या’ misrepresents ἐν παραπτώματι.
    rationale: 'The Greek preposition ἐν marks the circumstance of the sexual union: ‘in transgression,’ not a genitive expression meaning ‘a transgression''s bed.’'
  - severity: medium
    issue: ‘शय्या को नहीं जाना’ is opaque in modern standard Hindi.
    rationale: Although γινώσκω (‘know’) is sexually euphemistic in Greek biblical diction, a literal calque does not function comparably in Hindi. A clear rendering should convey sexual union while the footnote retains the Greek ‘bed’ metaphor.
  - severity: low
    issue: The footnote marker for the lexical note is attached to the whole clause rather than to the term it explains.
    rationale: Placing it after ‘यौन-संबंध’ gives readers a clear anchor for the note concerning Greek κοίτη (‘bed’).
