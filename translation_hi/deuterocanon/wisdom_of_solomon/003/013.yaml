base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: hi
  text: क्योंकि धन्य है वह कलंक-रहित बाँझ स्त्री, जिसने अपराध में यौन-संबंध नहीं किया[a]; जब आत्माओं की सुधि ली जाएगी[b], तब वह फल पाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपराध में शय्या’; ‘शय्या’ यहाँ यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: ‘आत्माओं की सुधि ली जाएगी’ परमेश्वर द्वारा भविष्य में मनुष्यों की आत्माओं पर ध्यान देने या उनका लेखा लेने का संकेत हो सकता है—अर्थात न्याय अथवा प्रतिफल का समय।
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: धन्य
  rationale: यह शब्द परमेश्वर की दृष्टि में प्रशंसनीय और कृपाप्राप्त स्थिति को व्यक्त करता है; ‘धन्य’ बाइबलीय गरिमा को बनाए रखता है।
- source_word: στεῖρα
  choice: बाँझ स्त्री
  rationale: यह स्त्री के संतान उत्पन्न न कर सकने को स्पष्ट करता है और आगे आने वाले ‘फल’ के रूपक के साथ मूल पाठ का विरोधाभास बनाए रखता है।
- source_word: ἀμίαντος
  choice: निष्कलंक
  rationale: यह नैतिक अथवा धार्मिक अशुद्धि से रहित होने का भाव व्यक्त करता है; यहाँ केवल सामान्य ‘शुद्ध’ की अपेक्षा अधिक सटीक है।
- source_word: ἔγνω
  choice: नहीं जाना
  rationale: मूल का ‘जानना’ यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है। इसे बनाए रखने से स्रोत की रूपकात्मक भाषा सुरक्षित रहती है।
- source_word: κοίτην
  choice: शय्या
  rationale: शाब्दिक अर्थ ‘बिस्तर/शय्या’ है और यहाँ यह यौन-संबंध का लाक्षणिक संकेत है। ‘शय्या’ गरिमापूर्ण तथा प्रसंगानुकूल है।
- source_word: ἐν παραπτώματι
  choice: अपराध की
  rationale: यह शय्या अथवा यौन-संबंध को अनुचित उल्लंघन से जोड़ता है, पर अपराध का स्वरूप मूल से अधिक संकीर्ण नहीं करता।
- source_word: ἕξει καρπὸν
  choice: उसे फल मिलेगा
  rationale: यह बाँझ स्त्री के विषय में ‘फल’ कहे जाने की जानबूझकर रखी गई विडंबना को बनाए रखता है, जबकि हिन्दी में स्वाभाविक भी है।
- source_word: ἐν ἐπισκοπῇ
  choice: जब ... सुधि ली जाएगी
  rationale: ‘सुधि लेना’ दैवी ध्यान, देखभाल, निरीक्षण अथवा लेखे—इन संबद्ध अर्थों के लिए स्थान छोड़ता है और इसे केवल दंडात्मक न्याय तक सीमित नहीं करता।
- source_word: ψυχῶν
  choice: आत्माओं की
  rationale: यह मूल का सीधा अनुवाद है और पुस्तक के आध्यात्मिक तथा भविष्य-संबंधी भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ‘आत्माओं की सुधि लिए जाने’ का अर्थ
  choice: मानव आत्माओं के संबंध में परमेश्वर के भावी आगमन, ध्यान अथवा लेखे का संकेत, जिसे प्रतिफल और न्याय के बीच खुला रखा गया है।
  alternative: इसे केवल अंतिम न्याय का दिन, अथवा केवल अनुग्रहपूर्ण दैवी भेंट मानना।
  rationale: निकटवर्ती प्रसंग मृत्यु के बाद धर्मियों की दशा और उनके प्रतिफल की बात करता है, किंतु यूनानी ἐπισκοπή अपने आप में केवल न्याय या केवल कृपापूर्ण भेंट को अनिवार्य नहीं करता।
