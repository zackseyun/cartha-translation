lexical_decisions:
- source_word: γενεᾶς
  choice: पीढ़ी
  rationale: यह शब्द पीढ़ी, वंश या संतान-समूह को सूचित कर सकता है। यहाँ ‘पीढ़ी’ सामूहिक अर्थ को बनाए रखता है और जैविक वंश का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀδίκου
  choice: अधर्मी
  rationale: यह नैतिक और धार्मिक अन्याय/दुष्टता का बोध कराता है। ‘अधर्मी’ प्रज्ञा-साहित्य के गंभीर नैतिक स्वर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: χαλεπὰ
  choice: दुःखद
  rationale: χαλεπός कठिन, पीड़ादायक, कठोर या भीषण परिणाम का बोध करा सकता है। ‘दुःखद’ गंभीर परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अतिरिक्त चित्रण जोड़े।
- source_word: τὰ τέλη
  choice: अंत
  rationale: यूनानी में यह बहुवचन है और अंतिम परिणामों या नियतियों की ओर संकेत करता है। हिन्दी में ‘अंत’ का रूप प्रसंगानुसार बहुवचन अर्थ ग्रहण कर सकता है; ‘होते हैं’ उस सामूहिक बहुवचन भाव को स्पष्ट करता है।
theological_decisions:
- issue: γενεᾶς ἀδίκου को जैविक वंश/संतान के अर्थ में लिया जाए या सामूहिक नैतिक श्रेणी के रूप में।
  choice: अधर्मी पीढ़ी
  alternative: अधर्मियों की संतान; दुष्ट वंश
  rationale: यूनानी में वंश या संतान का अर्थ संभव है, विशेषकर निकटवर्ती प्रसंग के कारण; फिर भी मुख्य पाठ में ‘अधर्मी पीढ़ी’ नैतिक सामूहिकता को सुरक्षित रखता है और वंशानुगत दोष का अधिक प्रबल सिद्धांत आरोपित नहीं करता। विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘अंत’ को जानबूझकर बनाए रखा गया है ताकि अंतिम परिणाम/नियति का अर्थ खुला रहे; पादटिप्पणी γενεά की वास्तविक अर्थगत व्यापकता सुरक्षित रखती है।
