lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: क्योंकि यदि … भी
  rationale: यह पदबंध γὰρ के कारणसूचक संबंध और ἐὰν की शर्त को स्वाभाविक हिन्दी में रखता है; ‘भी’ प्रसंग के रियायती भाव को व्यक्त करता है।
- source_word: μακρόβιοι γένωνται
  choice: वे दीर्घायु … हो जाएँ
  rationale: μακρόβιοι लंबी आयु पाने को और γένωνται संभावित अवस्था में आने को दर्शाता है; ‘दीर्घायु हो जाएँ’ संक्षिप्त और वर्तमान मानक हिन्दी है।
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: उन्हें कुछ नहीं समझा जाएगा
  rationale: भविष्यत् कर्मवाच्य λογισθήσονται के मूल्यांकन या लेखे में माने जाने के भाव को सुरक्षित रखते हुए यह वाक्यांश εἰς οὐθέν का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: ἐπʼ ἐσχάτων
  choice: अंत में
  rationale: यह अंतिम अवस्था या परिणाम की ओर संकेत करता है; ‘अंत में’ उसकी कालगत और परिणामी दोनों संभावनाओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἄτιμον … τὸ γῆρας αὐτῶν
  choice: उनका बुढ़ापा अनादर का होगा
  rationale: ἄτιμον के सम्मान से वंचित होने के भाव और γῆρας को वाक्य के विषय के रूप में बनाए रखा गया है। ‘अनादर का’ यह नहीं तय करता कि अनादर केवल सामाजिक है या व्यापक नैतिक मूल्यांकन।
theological_decisions:
- issue: दीर्घायु होने पर भी अधर्मियों का मूल्यांकन
  choice: दीर्घायु अपने-आप उन्हें मूल्य या सम्मान नहीं दिलाती।
  alternative: इसे केवल वृद्धावस्था में सामाजिक प्रतिष्ठा के बारे में कथन मानना।
  rationale: आसपास का प्रसंग धर्मियों और अधर्मियों के परिणामों की तुलना करता है, पर पद में ‘परमेश्वर के सामने’ स्पष्टतः नहीं है; इसलिए उस व्याख्यात्मक वाक्यांश को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बुढ़ापा’ सामान्य और सहज शब्द है; ‘अनादर का होगा’ मूल के सम्मान-लज्जा संबंधी आयाम को बनाए रखता है।
