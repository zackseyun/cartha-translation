  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: hi
  text: उसने उन्हें भट्ठी[a] में सोने के समान परखा, और पूर्ण होम-बलि[b] के समान उन्हें स्वीकार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धातु गलाने के पात्र में’; यूनानी शब्द धातु को गलाने या शुद्ध करने के पात्र अथवा स्थान के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसी बलि जो पूरी तरह जला दी जाती थी; इसे केवल ‘होम-बलि’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς χρυσὸν
  choice: सोने के समान
  rationale: ὡς द्वारा व्यक्त उपमा और χρυσόν के परिष्कृत किए जाने वाले बहुमूल्य धातु के बिंब को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν χωνευτηρίῳ
  choice: भट्ठी में
  rationale: χωνευτήριον धातु गलाने या शुद्ध करने के पात्र अथवा स्थान को दर्शाता है। ‘भट्ठी’ सामान्य पाठक के लिए सहज है और धातु-परिष्कार का बिंब सुरक्षित रखती है।
- source_word: ἐδοκίμασεν
  choice: परखा
  rationale: δοκιμάζω यहाँ किसी वस्तु की असलियत या खरेपन को जाँचने का भाव देता है; ‘परखा’ सोने की उपमा के साथ इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: संदर्भ में पहले उल्लिखित धर्मियों की ओर संकेत करने वाले बहुवचन कर्मवाचक सर्वनाम को यथावत रखा गया है।
- source_word: ὁλοκάρπωμα θυσίας
  choice: पूर्ण होम-बलि
  rationale: ὁλοκάρπωμα ऐसी बलि को सूचित करता है जो पूरी तरह अर्पित या जलाई जाती है, और θυσίας इसके बलिदानी स्वरूप को पुष्ट करता है। ‘पूर्ण होम-बलि’ इस विशिष्ट धार्मिक बिंब को अनावश्यक पुनरुक्ति के बिना रखती है।
- source_word: προσεδέξατο
  choice: स्वीकार किया
  rationale: क्रिया अनुकूलतापूर्वक ग्रहण करने का अर्थ देती है; बलि के संदर्भ में ‘स्वीकार किया’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: ὁλοκάρπωμα θυσίας का बलिदानी बिंब
  choice: पूर्ण होम-बलि
  alternative: पूरी तरह जलाई जाने वाली बलि
  rationale: पाठ धर्मियों के परखे जाने और परमेश्वर द्वारा अनुकूलतापूर्वक ग्रहण किए जाने को बलिदानी उपमा में रखता है। तकनीकी विशिष्टता को बनाए रखते हुए उपमा को किसी विशेष प्रायश्चित्त-सिद्धांत के रूप में नहीं खोला गया।
- issue: यूनानी क्रियाओं का अप्रकट कर्ता
  choice: उसने
  alternative: परमेश्वर ने
  rationale: यूनानी पद में कर्ता सर्वनाम या नाम से स्पष्ट नहीं किया गया, यद्यपि संदर्भ उसे परमेश्वर से जोड़ता है। ‘उसने’ मूल की व्याकरणिक अप्रत्यक्षता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य की दोनों समानांतर उपमाएँ और बलिदानी शब्दावली सुरक्षित रखी गई हैं; तकनीकी पद ‘पूर्ण होम-बलि’ को पादटिप्पणी से स्पष्ट किया गया है।
