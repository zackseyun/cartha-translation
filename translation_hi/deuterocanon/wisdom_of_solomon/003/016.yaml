  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/016.yaml
  text: But the children of adulterers will be imperfect[b][a], and the offspring of an unlawful union will perish.
translation:
  language: hi
  text: परन्तु व्यभिचारियों के बच्चे अपूर्ण[a] रहेंगे, और अवैध संबंध[b] से उत्पन्न संतान मिट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अधूरे,” “अपनी परिणति तक न पहुँचे हुए।” यूनानी शब्द पूर्णता या पूरा विकास न पाने का भाव दे सकता है, पर यह नहीं बताता कि वह अपूर्णता किस रूप में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “व्यवस्था-विरुद्ध शय्या।” यूनानी में “शय्या” यौन-संबंध के लिए प्रयुक्त लाक्षणिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: बच्चे
  rationale: यह सामान्य रूप से संतान या बच्चों को दर्शाता है; ‘बच्चे’ सहज है और अर्थ को केवल पुत्रों तक सीमित नहीं करता।
- source_word: μοιχῶν
  choice: व्यभिचारियों के
  rationale: सम्बन्धकारक बहुवचन उन लोगों को दर्शाता है जो व्यभिचार करते हैं; यह अनुवाद यूनानी की स्पष्ट नैतिक श्रेणी को बनाए रखता है।
- source_word: ἀτέλεστα
  choice: अपूर्ण
  rationale: शब्द में पूर्णता, परिणति या पूरा विकास न पाने का भाव है। ‘अपूर्ण’ इस अनिश्चितता को बनाए रखता है और कमी का कोई विशिष्ट स्वरूप तय नहीं करता।
- source_word: ἔσται
  choice: रहेंगे
  rationale: भविष्यकाल को स्वाभाविक हिन्दी में व्यक्त करता है; इस संदर्भ में ‘अपूर्ण रहेंगे’ सहज है।
- source_word: παρανόμου κοίτης
  choice: अवैध संबंध
  rationale: शाब्दिक अर्थ ‘व्यवस्था-विरुद्ध शय्या’ है, जिसमें शय्या यौन-संबंध का लाक्षणिक प्रयोग है। ‘अवैध संबंध’ आधुनिक हिन्दी में स्पष्ट रहते हुए कानूनी-नैतिक बल को सुरक्षित रखता है।
- source_word: σπέρμα
  choice: संतान
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ इससे उत्पन्न वंशज या संतान अभिप्रेत है; ‘संतान’ आधुनिक हिन्दी में स्पष्ट और सामूहिक अर्थ के अनुकूल है।
- source_word: ἀφανισθήσεται
  choice: मिट जाएगी
  rationale: भविष्यकालीन कर्मवाच्य में लुप्त कर दिए जाने, नष्ट होने या गायब हो जाने का भाव है। ‘मिट जाएगी’ विनाश और लोप—दोनों की छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यभिचारी संबंधों से जन्मे बच्चों के विषय में सामूहिक न्याय की कठोर भाषा
  choice: कथन को ज्ञान-साहित्य के गंभीर न्याय-वचन के रूप में ज्यों का त्यों बनाए रखा गया है।
  alternative: इसे केवल सामाजिक कलंक का वर्णन मानना, या इसे सामान्यतः अवैध जन्म के विषय में एक नरम कहावत बना देना।
  rationale: यूनानी पाठ व्यभिचार और व्यवस्था-विरुद्ध संबंध से जुड़ा कठोर मूल्यांकन प्रस्तुत करता है। अनुवाद उस तनाव को नरम नहीं करता, पर बच्चों पर विरासत में आए दोष का कोई अधिक विशिष्ट सिद्धांत भी नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘अपूर्ण’ और ‘मिट जाएगी’ मूल की अर्थगत व्यापकता तथा गंभीरता बनाए रखते हैं; ‘अवैध संबंध’ शाब्दिक मुहावरे को स्पष्ट हिन्दी में व्यक्त करता है।
