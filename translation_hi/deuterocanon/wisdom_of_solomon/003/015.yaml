base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/015.yaml
  text: For the fruit of good labors is glorious[a], and the root of understanding does not fail.
translation:
  language: hi
  text: क्योंकि भले परिश्रमों का फल यशस्वी[a] होता है, और विवेक[b] की जड़ कभी विफल नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गौरवशाली” अथवा “सुयश वाला।”
    reason: εὐκλεής में गौरव, अच्छा नाम और सम्मान—इन परस्पर जुड़े भावों की lexical ambiguity है।
  - marker: b
    text: या, “समझ-बूझ” अथवा “सद्बुद्धि।”
    reason: φρόνησις व्यावहारिक समझ, विवेक या सूझ-बूझ को सूचित कर सकता है।
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: भले परिश्रमों
  rationale: यह पदबंध नैतिक रूप से अच्छे और श्रमसाध्य प्रयत्नों को व्यक्त करता है। ‘भले परिश्रमों’ में सकारात्मक नैतिक गुण और कठिन श्रम—दोनों बने रहते हैं।
- source_word: καρπός
  choice: फल
  rationale: मूल कृषि-रूपक को स्पष्ट रखता है और दूसरे खंड की ‘जड़’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: εὐκλεής
  choice: यशस्वी
  rationale: इस शब्द में अच्छे नाम, सम्मान और गौरव का भाव है। ‘यशस्वी’ केवल चमक-दमक नहीं, बल्कि सुयश और आदर का अर्थ भी व्यक्त करता है।
- source_word: ἀδιάπτωτος
  choice: कभी विफल नहीं होती
  rationale: शब्द का मूल भाव न गिरने, न चूकने या बने रहने का है। क्रियात्मक हिन्दी प्रयोग अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे ‘अविनाशी’ कहकर अधिक प्रबल बनाए।
- source_word: ῥίζα
  choice: जड़
  rationale: ‘फल’ के साथ मूल पाठ के संतुलित कृषि-रूपक को बनाए रखता है।
- source_word: φρονήσεως
  choice: विवेक
  rationale: φρόνησις यहाँ व्यावहारिक समझ, सूझ-बूझ और समझदारी का बोध देता है। ‘विवेक’ आधुनिक हिन्दी में स्वाभाविक है और इसे σοφία के सामान्य अनुवाद ‘बुद्धि/ज्ञान’ में विलीन नहीं करता।
theological_decisions:
- issue: φρόνησις का बुद्धि-साहित्य की शब्दावली से संबंध
  choice: विवेक
  alternative: समझ-बूझ; सद्बुद्धि; प्रज्ञा
  rationale: मूल में φρόνησις है, σοφία नहीं। ‘विवेक’ उसके व्यावहारिक-बौद्धिक भाव को रखता है और अलग यूनानी शब्दों के बीच का भेद मिटाता नहीं।
- issue: फल और जड़ के रूपकों की संरचना
  choice: दोनों रूपकों को स्पष्ट रूप से बनाए रखना
  alternative: व्याख्यात्मक रूप में ‘अच्छे प्रयत्नों के परिणाम स्थायी होते हैं’
  rationale: यूनानी वाक्य दोनों खंडों में संतुलित कृषि-बिंब रखता है। उन्हें बनाए रखना साहित्यिक बनावट और अर्थगत तनाव को सुरक्षित रखता है।
- issue: εὐκλεής में यश और गौरव का संबंध
  choice: यशस्वी
  alternative: गौरवशाली; सम्माननीय
  rationale: ‘यशस्वी’ अच्छे नाम और सार्वजनिक सम्मान के अर्थ को सामने लाता है; पादटिप्पणी निकटवर्ती ‘गौरवशाली’ अर्थ की संभावना भी दर्शाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फल’ और ‘जड़’ की लोकोक्तिपरक समानांतरता सुरक्षित है। ‘कभी विफल नहीं होती’ कुछ असामान्य किंतु बोधगम्य है और ἀδιάπτωτος के ‘न चूकने/न गिरने’ वाले भाव को ‘अविनाशी’ जैसे अधिक निर्णायक शब्द से बचाते हुए व्यक्त करता है।
