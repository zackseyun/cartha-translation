- source_word: ἐν ὄψει ἀνθρώπων
  choice: लोगों की दृष्टि में
  rationale: यह वाक्यांश मनुष्यों के बाहरी दृष्टिकोण को व्यक्त करता है और दिखाई देने वाली दशा तथा अंतिम वास्तविकता के बीच के विरोध को बनाए रखता है।
- source_word: ἐὰν κολασθῶσιν
  choice: यदि उन्हें दण्ड भी दिया जाए
  rationale: κολάζω दण्ड देने के साथ-साथ अनुशासन या ताड़ना देने का अर्थ भी रख सकता है। मुख्य पाठ में ‘दण्ड’ इसकी प्रबल ध्वनि को बनाए रखता है, जबकि पादटिप्पणी सुधारात्मक अर्थ की संभावना बताती है। ‘भी’ concessive भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: उनकी आशा
  rationale: यह यूनानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप है तथा धर्मियों की अपनी आशा की ओर संकेत करता है।
- source_word: ἀθανασίας
  choice: अमरता से
  rationale: 'ἀθανασία का मानक अर्थ ‘अमरता’ है। ‘से’ पूर्णता की विषयवस्तु को व्यक्त करता है: उनकी आशा अमरता से भरी हुई है।'
- source_word: πλήρης
  choice: भरपूर है
  rationale: यह विधेय के रूप में परिपूर्णता या भराव को व्यक्त करता है। ‘भरपूर है’ आधुनिक हिन्दी में स्वाभाविक है और आशा को केवल अमरता की ओर उन्मुख बताने के बजाय उससे परिपूर्ण बताता है।
theological_decisions:
- issue: धर्मियों के दुःख के लिए प्रयुक्त भाषा का बल
  choice: मुख्य पाठ में ‘दण्ड दिया जाए’ रखा गया है, पर ‘लोगों की दृष्टि में’ इसे मानवीय दिखाई पड़ने वाली दशा के रूप में सीमित करता है।
  alternative: ‘अनुशासित किए जाएँ’ या ‘ताड़ना दी जाए’
  rationale: पद बाहरी मानवीय आकलन और धर्मियों की वास्तविक आशा के बीच तनाव रखता है। अनुवाद यह निर्णय नहीं थोपता कि उनका दुःख परमेश्वर द्वारा दोषी ठहराया जाना है; साथ ही κολάζω की प्रबल दण्डात्मक संभावना भी नहीं मिटाता।
