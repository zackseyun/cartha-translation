  rationale: βασιλεύω के साथ संबंधकारक सर्वनाम को शासन के विषय के रूप में व्यक्त किया गया है; सर्वनाम को बनाए रखने से उसका संदर्भ जानबूझकर अनिर्णीत रहता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए उपाधि Κύριος का मानक, गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह यूनानी बहुवचन मुहावरे के युगों तक बने रहने वाले भाव को स्वाभाविक बाइबिलीय हिन्दी में सुरक्षित रखता है।
