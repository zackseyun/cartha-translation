- source_word: βασιλεύσει
  choice: राज्य करेगा
  rationale: βασιλεύω का राजकीय भाव स्वाभाविक और गरिमापूर्ण हिन्दी में ‘राज्य करेगा’ से व्यक्त होता है।
- source_word: αὐτῶν
