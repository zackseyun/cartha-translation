    reason: lexical_alternative
  - marker: b
    text: या, ‘सूखे डंठलों के बीच’ अथवा ‘सरकंडों के बीच’; यूनानी उपमा ऐसी ज्वलनशील वनस्पति में तेजी से फैलती आग का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: समय
  rationale: καιρός किसी उपयुक्त या नियत अवसर को दर्शा सकता है। ‘समय’ सहज हिन्दी है और प्रसंग को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: ἐπισκοπῆς
  choice: सुधि लिए जाने
  rationale: ἐπισκοπή में निरीक्षण, देखरेख और हस्तक्षेप के लिए आने के अर्थ समाए हैं। ‘सुधि लिए जाने’ से किसी उच्चतर कर्ता, प्रसंगतः परमेश्वर, के हस्तक्षेप का भाव आता है, पर मुख्य पाठ यह तय नहीं करता कि बल जाँच पर है या निर्दोष ठहराए जाने पर।
- source_word: ἀναλάμψουσιν
  choice: चमक उठेंगे
  rationale: ἀναλάμπω अचानक या प्रकट रूप से चमकने का सजीव भाव देता है; ‘चमक उठेंगे’ आधुनिक हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σπινθῆρες
  choice: चिनगारियाँ
  rationale: शब्द का मूल अर्थ आग की छोटी चिनगारियाँ है; हिन्दी में यही चित्र सबसे स्पष्ट है।
- source_word: καλάμῃ
  choice: सूखे डंठलों
  rationale: κάλαμος/καλάμη सरकंडे, तिनके या कटे हुए सूखे डंठलों का बोध करा सकता है। आग के तेजी से फैलने वाले उपमान में ‘सूखे डंठल’ व्यापक और स्वाभाविक विकल्प है।
- source_word: διαδραμοῦνται
  choice: दौड़ेंगे
  rationale: क्रिया किसी क्षेत्र में या उसके आर-पार तेज गति से जाने का संकेत देती है। ‘के बीच…दौड़ेंगे’ चिनगारियों की तीव्र गति का चित्र बनाए रखता है।
theological_decisions:
- issue: ‘उनकी सुधि लिए जाने का समय’ का आशय
  choice: धर्मियों के विषय में परमेश्वर के निर्णायक हस्तक्षेप का समय, जिसे मुख्य पाठ में व्यापक रखा गया है
  alternative: वह समय जब परमेश्वर उनकी जाँच करता है अथवा उन्हें निर्दोष ठहराता है
  rationale: निकटवर्ती प्रसंग धर्मियों के दुःख के बाद उनके प्रतिपादन की ओर संकेत करता है, फिर भी ἐπισκοπή स्वयं निरीक्षण, न्यायिक जाँच या अनुग्रहपूर्ण हस्तक्षेप में से केवल एक अर्थ को अनिवार्य नहीं करता। इसलिए मुख्य पाठ तनाव और व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘सुधि लिए जाने’ कुछ साहित्यिक है, पर ‘दर्शन’ की संभावित भ्रांति से बचते हुए यूनानी ἐπισκοπή की धार्मिक व्यापकता को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
