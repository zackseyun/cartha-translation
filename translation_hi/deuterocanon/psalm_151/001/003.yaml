lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक सर्वनाम है; ‘कौन’ इसका स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἀναγγελεῖ
  choice: बताएगा
  rationale: भविष्यकालीन क्रिया का अर्थ किसी बात को बताना, सूचित करना या घोषित करना हो सकता है। ‘बताएगा’ सहज हिन्दी में अर्थ की व्यापकता और प्रश्न का भविष्यकाल बनाए रखता है।
- source_word: τῷ κυρίῳ μου
  choice: मेरे प्रभु को
  rationale: सम्प्रदान कारक और स्वत्वसूचक सर्वनाम को स्पष्ट रखते हुए κύριος को उपाधि के रूप में ‘प्रभु’ अनूदित किया गया है।
- source_word: αὐτός
  choice: स्वयं / वह स्वयं
  rationale: दोनों बार प्रयुक्त बलाघाती सर्वनाम को हिन्दी में दोहराकर यूनानी पाठ का जोर सुरक्षित रखा गया है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος बिना उपपद के बलाघाती कर्ता अथवा उपाधि के रूप में है; हिन्दी में ‘प्रभु’ स्वाभाविक है और पहले प्रयोग के साथ संगति रखता है।
- source_word: εἰσακούει
  choice: सुनता है
  rationale: क्रिया सुनने, ध्यान देकर सुनने अथवा स्वीकार करने का भाव दे सकती है। ‘सुनता है’ सबसे कम व्याख्यात्मक विकल्प है और सम्भावित अनुकूल प्रत्युत्तर को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: κύριος के दोनों प्रयोगों का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दोनों प्रयोगों में उपाधि-संबंधी भाषा और उनकी परस्पर संगति बनाए रखता है। ‘स्वामी’ शब्दार्थतः सम्भव है, पर यहाँ वह दूसरे प्रयोग के धार्मिक अथवा उपाधिगत स्वर को कम स्पष्ट कर सकता है।
- issue: दो बार आए αὐτός का बल
  choice: ‘स्वयं प्रभु—वह स्वयं’ के रूप में पुनरावृत्ति
  alternative: केवल ‘प्रभु स्वयं सुनता है’
  rationale: संक्षिप्त विकल्प अधिक सहज होता, पर यूनानी की जानबूझकर की गई पुनरावृत्ति और उसके धर्मवैचारिक जोर को घटा देता। चुना हुआ रूप उस बल को हिन्दी में दृश्यमान रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। डैश दोनों बलाघाती खंडों का संबंध स्पष्ट करता है, जबकि ‘स्वयं’ की पुनरावृत्ति मूल यूनानी के जोर को सुरक्षित रखती है।
