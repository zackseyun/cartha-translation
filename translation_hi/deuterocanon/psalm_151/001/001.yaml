translation:
  language: hi
  text: मैं अपने भाइयों में छोटा था और अपने पिता के घराने में उम्र में छोटा था; मैं अपने पिता की भेड़ें चराता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μικρὸς
  choice: छोटा
  rationale: यह मूल के सामान्य और संदर्भतः तुलनात्मक भाव को बनाए रखता है; इसे अनावश्यक रूप से ‘सबसे छोटा’ नहीं बनाया गया।
- source_word: νεώτερος
  choice: कम उम्र का
  rationale: यूनानी तुलनात्मक रूप का अर्थ ‘कम उम्र का/छोटा’ है, न कि स्पष्ट रूप से ‘सबसे छोटा’; इसलिए मूल की अस्पष्टता सुरक्षित रखी गई।
- source_word: ἔποιμαινον
  choice: चराता था
  rationale: अपूर्ण भूतकाल निरंतर अथवा अभ्यस्त चरवाही को व्यक्त करता है; हिंदी में ‘चराता था’ स्वाभाविक रूप से वही भाव देता है।
- source_word: τὰ πρόβατα
  choice: भेड़ें
  rationale: यह पशुओं के लिए सीधा और सामान्य हिंदी समतुल्य है।
theological_decisions:
- issue: दाऊद की पारिवारिक आयु-स्थिति
  choice: कम उम्र का
  alternative: सबसे छोटा
  rationale: पाठ में νεώτερος तुलनात्मक है। ‘सबसे छोटा’ कहना संभावित कथात्मक संदर्भ के आधार पर अर्थ को अधिक निश्चित कर देता; अनुवाद ने मूल व्याकरण को प्राथमिकता दी।
