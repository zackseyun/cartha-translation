- source_word: οἱ δάκτυλοί μου
  choice: मेरी उँगलियों ने
  rationale: मूल के बहुवचन और प्रथम-पुरुष संबंध को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἥρμοσαν
  choice: जोड़कर तैयार किया
  rationale: ἁρμόζω में अंगों को ठीक से मिलाने या जोड़ने का भाव है। यह अनुवाद केवल ‘गढ़ा’ कहने की अपेक्षा वाद्य के संयोजन का भाव बनाए रखता है और संदिग्ध ‘सुर मिलाया’ अर्थ को नहीं थोपता।
- source_word: ψαλτήριον
  choice: एक तार-वाद्य
  rationale: ψαλτήριον किसी प्राचीन झंकारकर बजाए जाने वाले तार-वाद्य को दर्शाता है। उसका ठीक आधुनिक समकक्ष अनिश्चित होने के कारण व्यापक और बोधगम्य पद चुना गया है।
