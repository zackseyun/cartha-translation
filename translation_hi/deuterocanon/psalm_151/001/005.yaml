    reason: εὐδόκησεν के ‘प्रसन्न होना,’ ‘पसन्द करना,’ और ‘आनन्द पाना’ जैसे निकटार्थी भावों को दर्शाने के लिए।
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और प्रसंग में दाऊद के पुरुष भाइयों को सूचित करता है।
- source_word: καλοί
  choice: सुन्दर
  rationale: μεγάλοι के साथ शारीरिक वर्णन में यह आकर्षक रूप या सुडौल व्यक्तित्व का स्वाभाविक बोध देता है, न कि नैतिक भलाई का।
- source_word: μεγάλοι
  choice: ऊँचे कद के
  rationale: मूल अर्थ ‘बड़े/महान’ हो सकता है, पर शारीरिक वर्णन के इस प्रसंग में प्रभावशाली कद का अर्थ अधिक स्वाभाविक है।
- source_word: οὐκ εὐδόκησεν
  choice: प्रसन्न नहीं हुआ
  rationale: यह εὐδοκέω के अनुमोदन या प्रसन्नता के अर्थ को बनाए रखता है और ‘नहीं चुना’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह इस्राएल के परमेश्वर के लिए प्रयुक्त यूनानी Κύριος का प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दाऊद के भाइयों के प्रति प्रभु के मूल्यांकन का स्वरूप
  choice: प्रभु उनसे प्रसन्न नहीं हुआ
  alternative: प्रभु ने उन्हें नहीं चुना
  rationale: मूल क्रिया प्रसन्नता या अनुमोदन बताती है, पर स्पष्टतः चयन की क्रिया नहीं है; अतः अनुवाद कारण या परिणाम को अनावश्यक रूप से निश्चित नहीं करता।
