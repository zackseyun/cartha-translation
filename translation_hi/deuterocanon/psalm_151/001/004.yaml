base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: hi
  text: उसी ने अपने दूत को भेजा[a], और मुझे मेरे पिता की भेड़ों के बीच से निकाल लिया, और अपने अभिषेक के तेल से मेरा अभिषेक किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने स्वर्गदूत को।” यूनानी शब्द मनुष्य-दूत या स्वर्गदूत, दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: उसी ने
  rationale: कर्ता-सर्वनाम पर दिए गए बल को स्वाभाविक हिन्दी में ‘उसी ने’ व्यक्त करता है।
- source_word: ἐξαπέστειλεν
  choice: भेजा
  rationale: यौगिक क्रिया का अर्थ यहाँ किसी को कार्य के लिए भेजना है; ‘भेजा’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त है।
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: अपने दूत को
  rationale: ἄγγελος मनुष्य-दूत या स्वर्गदूत, दोनों के लिए प्रयुक्त हो सकता है। अभिषेक के प्रसंग में ‘दूत’ उपयुक्त है और यूनानी की व्यापकता को भी कुछ हद तक बनाए रखता है; अलौकिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἦρέν με
  choice: मुझे ... निकाल लिया
  rationale: αἴρω का मूल भाव उठाने या किसी स्थान से ले लेने का है। भेड़ों के बीच से चुनाव करके ले जाने के प्रसंग में ‘निकाल लिया’ स्पष्ट और स्वाभाविक है।
- source_word: ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: मेरे पिता की भेड़ों के बीच से
  rationale: यह πρόβατα के ठोस अर्थ ‘भेड़ें’ को रखता है और ἐκ के चयन/अलग किए जाने के भाव को स्पष्ट करता है।
- source_word: ἔχρισέν με
  choice: मेरा अभिषेक किया
  rationale: χρίω के राजकीय और समर्पण-संबंधी अर्थ के लिए ‘अभिषेक करना’ मानक और सटीक हिन्दी है।
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: अपने अभिषेक के तेल से
  rationale: ἐν का साधनवाचक अर्थ ‘से’ द्वारा स्वाभाविक रूप से व्यक्त होता है, जबकि ‘अभिषेक के तेल’ से मूल संबंधवाचक संरचना बनी रहती है।
theological_decisions:
- issue: ईश्वरीय कार्य के प्रसंग में ἄγγελος का अर्थ
  choice: दूत
  alternative: स्वर्गदूत
  rationale: यूनानी शब्द दोनों अर्थों की अनुमति देता है। दाऊद के अभिषेक के परिचित प्रसंग में मनुष्य-दूत अधिक संदर्भानुकूल है, पर यूनानी पाठ अकेले अलौकिक अर्थ को पूरी तरह निषिद्ध नहीं करता; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अभिषेक के तेल से मेरा अभिषेक किया’ की पुनरुक्ति मूल यूनानी की शब्द-संबद्धता को जानबूझकर सुरक्षित रखती है।
