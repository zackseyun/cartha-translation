base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/007.yaml
  text: But I drew his own sword and cut off his head[b][a], and I removed disgrace from the sons of Israel.
translation:
  language: hi
  text: पर मैंने उसी की तलवार खींचकर उसका सिर काट डाला[a], और इस्राएल के पुत्रों से अपमान दूर कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसे सिर काटकर मार डाला।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “इस्राएल के पुत्रों से”; यह इस्राएल के लिए प्रयुक्त एक पारंपरिक सामूहिक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: खींचकर
  rationale: यहाँ σπάω का कृदन्त हथियार को खींच निकालने का अर्थ देता है। ‘तलवार खींचकर’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: उसी की तलवार
  rationale: παρ' αὐτοῦ तलवार के उसके पास या उसके अधिकार में होने का संकेत देता है। ‘उसी की तलवार’ स्वामित्व और उसी के हथियार से उसे मारने की कथात्मक विडंबना, दोनों को स्पष्ट रखता है।
- source_word: ἀπεκεφάλισα
  choice: उसका सिर काट डाला
  rationale: क्रिया का अर्थ सिर काटकर अलग करना है। यह चयन मूल की प्रत्यक्षता और कथात्मक तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦρα
  choice: दूर कर दिया
  rationale: αἴρω यहाँ ὄνειδος के साथ लाक्षणिक रूप से किसी कलंक को हटा देने के अर्थ में है। ‘दूर कर दिया’ स्पष्ट और मुहावरेदार हिन्दी है।
- source_word: ὄνειδος
  choice: कलंक
  rationale: ὄνειδος सार्वजनिक निंदा, अपमान या बदनामी का बोध कराता है। इस प्रसंग में ‘कलंक’ इस्राएल पर आए सामूहिक अपमान को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों से
  rationale: अनुवाद यूनानी के स्पष्ट पुरुषवाची सामूहिक पदबंध ‘इस्राएल के पुत्रों’ को बनाए रखता है और ἐξ को ‘से’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: पुरुषवाची सामूहिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों से
  alternative: इस्राएल के लोगों से
  rationale: यूनानी पाठ में υἱῶν, अर्थात ‘पुत्रों’, का स्पष्ट प्रयोग है। मूल रूप को बनाए रखा गया है; साथ की टिप्पणी बताती है कि यह इस्राएल के लिए पारंपरिक सामूहिक अभिव्यक्ति है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसी की तलवार’ कथात्मक पलटाव को स्पष्ट करता है, जबकि ‘इस्राएल के पुत्रों’ से मूल यूनानी की पारंपरिक सामूहिक अभिव्यक्ति सुरक्षित रहती है।
