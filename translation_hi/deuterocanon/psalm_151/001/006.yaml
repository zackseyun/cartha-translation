lexical_decisions:
- source_word: ἐξῆλθον
  choice: मैं ... निकला
  rationale: क्रिया प्रथम पुरुष एकवचन में है और बाहर निकलकर किसी से मिलने अथवा उसका सामना करने जाने का भाव देती है।
- source_word: εἰς συνάντησιν
  choice: का सामना करने
  rationale: दाऊद और विरोधी के युद्ध-संदर्भ में यह स्वाभाविक हिन्दी है; फिर भी यूनानी पदबंध के मिलने के उद्देश्य को बनाए रखती है।
- source_word: τῷ ἀλλοφύλῳ
  choice: उस परदेशी
  rationale: ἀλλόφυλος का मूल अर्थ दूसरे लोगों या जाति का व्यक्ति है। सप्तति में यह प्रायः पलिश्ती के लिए आता है, पर मुख्य पाठ में व्यापक यूनानी शब्द रखा गया है।
- source_word: ἐπικατηράσατό με
  choice: उसने ... मुझे शाप दिया
  rationale: क्रिया किसी के विरुद्ध शाप कहने या बुलाने का सीधा अर्थ व्यक्त करती है।
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: अपनी मूरतों की दुहाई देकर
  rationale: ἐν यहाँ माध्यम अथवा आह्वान का भाव दे सकता है। यह हिन्दी प्रयोग स्पष्ट करता है कि विरोधी ने अपनी मूरतों का सहारा लेकर शाप दिया, बिना इसे किसी एक संकीर्ण व्याख्या तक सीमित किए।
theological_decisions:
- issue: दाऊद और गोलियत के संदर्भ में ἀλλόφυλος का अनुवाद
  choice: उस परदेशी
  alternative: उस पलिश्ती
  rationale: कथा-संदर्भ पलिश्ती की ओर संकेत करता है, किंतु यूनानी पाठ जाति का प्रत्यक्ष नाम न देकर व्यापक पद का प्रयोग करता है। मुख्य पाठ उसी व्यापकता को रखता है और विशिष्ट पहचान पादटिप्पणी में देता है।
- issue: ἐν τοῖς εἰδώλοις αὐτοῦ में शाप देने का माध्यम
  choice: अपनी मूरतों की दुहाई देकर
  alternative: अपनी मूरतों के नाम पर
  rationale: वाक्यांश विरोधी की मूरतों का आह्वान करके शाप देने का संकेत देता है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। “परदेशी” मूल यूनानी की व्यापकता बचाता है; “मूरतों की दुहाई देकर” मूर्तियों के आह्वान का आशय स्वाभाविक ढंग से व्यक्त करता है।
