    text: या, “उस पलिश्ती।” यूनानी शब्द का शाब्दिक अर्थ “दूसरे लोगों का व्यक्ति” है; सप्तति में यह शब्द प्रायः पलिश्तियों के लिए प्रयुक्त हुआ है।
    reason: alternative_reading
  - marker: b
    text: या, “उसने अपनी मूर्तियों के नाम पर मुझे शाप दिया।”
