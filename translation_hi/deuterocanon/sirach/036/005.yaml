translation:
  language: hi
  text: मूर्ख की अंतड़ियाँ गाड़ी के पहिए के समान हैं[a], और उसका विचार घूमती हुई धुरी के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में प्रयुक्त शब्द का शाब्दिक अर्थ शरीर के भीतरी अंग या ‘अंतड़ियाँ’ है; यहाँ मूर्ख की भीतरी दशा के लिए शारीरिक बिंब का प्रयोग हुआ है।
    reason: lexical_note
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: गाड़ी का पहिया
  rationale: τροχός का अर्थ ‘पहिया’ और ἅμαξα का अर्थ ‘गाड़ी’ है; यह चुनाव कहावत के ठोस ग्रामीण बिंब को बनाए रखता है।
- source_word: σπλάγχνα
  choice: अंतड़ियाँ
  rationale: शब्द का मूल अर्थ शरीर के भीतरी अंग या अंतड़ियाँ है। यहाँ शारीरिक बिंब को बनाए रखना उचित है; इसे केवल ‘मन’ या ‘हृदय’ कहना अर्थ को संकुचित कर देता।
- source_word: μωροῦ
  choice: मूर्ख की
  rationale: μωρός ज्ञान-साहित्य में नैतिक और बौद्धिक अर्थ में ‘मूर्ख’ को सूचित करता है।
- source_word: διαλογισμὸς
  choice: विचार
  rationale: διαλογισμός विचार, चिंतन या तर्क-वितर्क को दर्शा सकता है। एकवचन ‘विचार’ स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: ὡς ἄξων στρεφόμενος
  choice: घूमती हुई धुरी के समान
  rationale: ἄξων ‘धुरी’ है और στρεφόμενος निरंतर घूमने की क्रिया व्यक्त करता है; अनुवाद चक्कर काटते, अस्थिर विचार का बिंब सुरक्षित रखता है।
