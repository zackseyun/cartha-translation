  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: hi
  text: समझदार मनुष्य व्यवस्था पर भरोसा रखेगा, और व्यवस्था उसके लिए धर्मियों की देववाणी[a] के समान विश्वसनीय होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “प्रश्न,” “पूछताछ,” “उत्तर,” या किसी पूछताछ के प्रत्युत्तर में मिली “देववाणी” भी हो सकता है; वाक्यांश का अधिक शाब्दिक रूप है, “धर्मियों की पूछताछ।”
    reason: ἐρώτημα δικαίων की वास्तविक अर्थगत अस्पष्टता को बनाए रखने के लिए।
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: समझदार मनुष्य
  rationale: यह पद सामान्य रूप से विवेक और समझ रखने वाले व्यक्ति की बात करता है; आधुनिक हिन्दी में यह सहज और मूल के निकट है।
- source_word: ἐμπιστεύσει νόμῳ
  choice: व्यवस्था पर भरोसा रखेगा
  rationale: ἐμπιστεύσει भविष्यकाल है और νόμος यहाँ धार्मिक व्यवस्था या विधि के अर्थ में है; ‘भरोसा रखेगा’ विश्वासयोग्यता पर निर्भर होने का भाव व्यक्त करता है।
- source_word: πιστός
  choice: विश्वसनीय
  rationale: यहाँ शब्द व्यवस्था की भरोसेमंदता बताता है; ‘विश्वसनीय’ हिन्दी में इस गुण को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐρώτημα δικαίων
  choice: धर्मियों को मिली देववाणी
  rationale: ἐρώτημα प्रश्न, पूछताछ, प्रत्युत्तर या दैवी उत्तर की ओर संकेत कर सकता है। प्रसंग में व्यवस्था की विश्वसनीयता से तुलना होने के कारण ‘देववाणी’ उपयुक्त है, जबकि पादटिप्पणी मूल की शाब्दिक अनिश्चितता सुरक्षित रखती है।
theological_decisions:
- issue: व्यवस्था और देववाणी के बीच तुलना
  choice: दोनों को समान नहीं ठहराया, बल्कि व्यवस्था की विश्वसनीयता की तुलना धर्मियों को मिली देववाणी से की गई है।
  alternative: व्यवस्था को स्वयं एक देववाणी कहना।
  rationale: ग्रीक में ὡς तुलना सूचित करता है; इसलिए मूल का भेद बनाए रखना आवश्यक है।
- issue: ἐρώτημα δικαίων का संबंध
  choice: इसे धर्मियों को प्राप्त दैवी उत्तर के रूप में प्रस्तुत किया गया है।
  alternative: ‘धर्मियों की पूछताछ’ या ‘धर्मियों का प्रश्न’।
  rationale: मूल वाक्यांश व्याकरण और अर्थ की दृष्टि से संक्षिप्त तथा कुछ अस्पष्ट है। मुख्य पाठ में प्रसंगानुकूल अर्थ दिया गया है, पर पादटिप्पणी वैकल्पिक शाब्दिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’ बाइबिलीय νόμος के लिए परिचित पद है, और ‘देववाणी’ को पादटिप्पणी द्वारा स्पष्ट किया गया है।
