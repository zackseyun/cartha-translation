translation:
  language: hi
  text: प्रभु के ज्ञान से वे अलग किए गए, और उसने ऋतुओं और पर्वों को बदल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: प्रभु के ज्ञान से
  rationale: ἐν यहाँ साधन या आधार का भाव दे सकता है; यह अनुवाद यूनानी की संक्षिप्तता और संभावित अर्थ-व्याप्ति बनाए रखता है।
- source_word: διεχωρίσθησαν
  choice: अलग-अलग ठहराए गए
  rationale: कर्मवाच्य रूप और भेद किए जाने के अर्थ को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: καιρούς
  choice: ऋतुओं
  rationale: संदर्भ में विशिष्ट या नियत कालखंडों का भाव है; ‘ऋतुओं’ से अंग्रेज़ी परामर्श-पाठ का आशय भी बना रहता है, यद्यपि यूनानी शब्द ‘समयों’ को भी समेट सकता है।
- source_word: ἑορτάς
  choice: पर्वों
  rationale: धार्मिक उत्सवों या पर्व-दिनों के लिए सामान्य, गरिमापूर्ण और व्यापक हिन्दी शब्द।
- source_word: ἠλλοίωσεν
  choice: बदल दिया
  rationale: क्रिया का मूल अर्थ बदलना या भिन्न बनाना है; इसे किसी विशेष प्रकार के परिवर्तन तक सीमित नहीं किया गया।
theological_decisions:
- issue: दूसरे खंड में कर्ता की पहचान
  choice: ‘उसने’ द्वारा प्रभु की ओर संकेत
  alternative: कर्ता को अव्यक्त रखना या ‘प्रभु ने’ दोहराना
  rationale: यूनानी में एकवचन क्रिया का स्वाभाविक कर्ता ‘प्रभु’ है; सर्वनाम मूल पाठ की संबद्धता और संक्षिप्तता बनाए रखता है।
- issue: पहले खंड के कर्मवाच्य को सक्रिय बनाना
  choice: कर्मवाच्य बनाए रखा गया
  alternative: ‘प्रभु ने अपने ज्ञान से उनमें भेद किया’
  rationale: मूल के διεχωρίσθησαν का कर्मवाच्य रूप संरक्षित है और इससे ‘वे’ पर दिया गया बल बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वे’ का पूर्वपद प्रसंग से ग्रहण किया जाता है, जैसा यूनानी पद में है।
