base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: hi
  text: जो तेरी बाट जोहते हैं, उन्हें प्रतिफल दे[a], और तेरे भविष्यद्वक्ता विश्वसनीय ठहरें[b]। हे प्रभु, अपने याचकों की विनती सुन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तेरे लिए धीरज धरते हैं,” अथवा “जो तेरे प्रति दृढ़ बने रहते हैं।” यूनानी क्रिया प्रतीक्षा करने और धीरज से टिके रहने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे भविष्यद्वक्ताओं पर विश्वास किया जाए,” अथवा “तेरे भविष्यद्वक्ता विश्वासयोग्य सिद्ध हों।” यूनानी वाक्य संक्षिप्त है और इसका संकेत या तो भविष्यद्वक्ताओं को भरोसे योग्य माने जाने की ओर, या उनकी विश्वसनीयता प्रमाणित होने की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  choice: प्रतिफल दे
  rationale: आज्ञार्थक δὸς का सीधा अर्थ ‘दे’ है; μισθός के लिए ‘प्रतिफल’ प्रार्थना के संदर्भ में उचित है और व्यापारिक ‘मज़दूरी’ का अनावश्यक भाव नहीं लाता।
- source_word: τοῖς ὑπομένουσίν σε
  choice: जो तेरी बाट जोहते हैं
  rationale: ὑπομένω में ठहरे रहने, सहने और प्रतीक्षा करने के भाव हो सकते हैं। व्यक्ति-वाचक कर्म ‘तेरी’ के साथ ‘बाट जोहना’ परमेश्वर से आशापूर्ण प्रतीक्षा का स्वाभाविक हिन्दी रूप है।
- source_word: οἱ προφῆταί σου
  choice: तेरे भविष्यद्वक्ता
  rationale: यूनानी संज्ञा-समूह का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: ἐμπιστευθήτωσαν
  choice: विश्वसनीय ठहरें
  rationale: निष्क्रिय आज्ञार्थक का संक्षिप्त यूनानी प्रयोग भरोसे योग्य सिद्ध या स्वीकार किए जाने का भाव दे सकता है। ‘विश्वसनीय ठहरें’ भविष्यद्वक्ताओं की विश्वसनीयता प्रमाणित होने का भाव रखता है।
- source_word: εἰσάκουσον
  choice: सुन
  rationale: प्रार्थना में अनुकूलतापूर्वक सुनने की विनती; ‘सुन’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: κύριε परमेश्वर के लिए प्रत्यक्ष संबोधन है; हिन्दी में ‘हे प्रभु’ इसका स्थापित स्वाभाविक रूप है।
- source_word: δεήσεως
  choice: विनती
  rationale: δέησις प्रार्थनापूर्ण निवेदन या याचना को दर्शाता है; ‘विनती’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: τῶν ἱκετῶν σου
  choice: अपने याचकों की
  rationale: ἱκέτης उस व्यक्ति को दर्शाता है जो दीनतापूर्वक प्रार्थना या याचना करता है; ‘याचक’ इस मुद्रा को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: τοῖς ὑπομένουσίν σε का अर्थ
  choice: जो तेरी बाट जोहते हैं
  alternative: जो तेरे लिए धीरज धरते हैं; जो तेरे प्रति दृढ़ बने रहते हैं
  rationale: संदर्भ परमेश्वर के कार्य की प्रतीक्षा और विश्वासयोग्य धीरज दोनों की अनुमति देता है। मुख्य पाठ में स्वाभाविक भक्तिपरक अर्थ रखा गया है और अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: भविष्यद्वक्ताओं के संबंध में ἐμπιστευθήτωσαν का बल
  choice: तेरे भविष्यद्वक्ता विश्वसनीय ठहरें
  alternative: तेरे भविष्यद्वक्ताओं पर विश्वास किया जाए; तेरे भविष्यद्वक्ता विश्वासयोग्य सिद्ध हों
  rationale: संक्षिप्त निष्क्रिय रूप इस बात की ओर संकेत कर सकता है कि भविष्यद्वक्ताओं को भरोसे योग्य माना जाए या उनके वचन सत्य सिद्ध हों। मुख्य पाठ इस तनाव को ‘विश्वसनीय ठहरें’ से खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन आत्मीय संबोधन ‘तेरी/तेरे’ रखा गया है, जो परमेश्वर से प्रत्यक्ष प्रार्थना की निकटता और मूल यूनानी के एकवचन को दर्शाता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है; ‘प्रतिफल’, ‘भविष्यद्वक्ता’, ‘विनती’ और ‘याचक’ जैसे स्थापित धार्मिक शब्द अनावश्यक रूप से पुरातन नहीं हैं।
