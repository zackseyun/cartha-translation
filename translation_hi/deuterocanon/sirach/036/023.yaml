translation:
  language: hi
  text: स्त्री किसी भी पुरुष को स्वीकार करेगी[a], पर एक बेटी दूसरी बेटी से बेहतर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्नी किसी भी पुरुष को स्वीकार करेगी।” यूनानी γυνή का अर्थ “स्त्री” या “पत्नी” हो सकता है; और ἄρρην का अधिक अक्षरशः अर्थ “नर” है, जिसे यहाँ स्वाभाविक हिन्दी में “पुरुष” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: किसी भी पुरुष को
  rationale: πάντα के साथ एकवचन ἄρρενα का भाव ‘किसी भी/हर पुरुष’ है। ‘नर’ अधिक अक्षरशः है, पर आधुनिक हिन्दी में मनुष्य के लिए अस्वाभाविक या अवमाननापूर्ण लग सकता है; इसलिए ‘पुरुष’ मूल अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιδέξεται
  choice: स्वीकार करेगी
  rationale: भविष्यत् मध्यम रूप यहाँ ग्रहण या स्वीकार करने का अर्थ देता है। ‘स्वीकार करेगी’ हिन्दी में स्पष्ट है और ‘ले लेगी’ की अपेक्षा कम अर्थारोपण करता है।
- source_word: γυνή
  choice: स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है। कथन सामान्य और लोकोक्तिपरक है, इसलिए मुख्य पाठ में कम व्याख्यात्मक ‘स्त्री’ रखा गया है और ‘पत्नी’ को पादटिप्पणी में दिया गया है।
- source_word: ἔστιν δὲ
  choice: पर
  rationale: यह पद दोनों कथन-खंडों के बीच विरोध या भेद दिखाता है। संक्षिप्त ‘पर’ लोकोक्ति की शैली बनाए रखता है।
- source_word: θυγάτηρ θυγατρὸς
  choice: एक बेटी दूसरी बेटी से
  rationale: दोहराया गया संज्ञा-रूप κρεῖσσον के साथ तुलनात्मक मुहावरा है; हिन्दी में उसका स्वाभाविक रूप ‘एक बेटी दूसरी बेटी से’ है।
- source_word: κρεῖσσον
  choice: अच्छी होती है
  rationale: κρεῖσσον का अर्थ ‘बेहतर/श्रेष्ठ’ है। व्यक्ति के संदर्भ में ‘अच्छी होती है’ सहज हिन्दी है और तुलनात्मकता ‘दूसरी ... से’ में स्पष्ट रहती है।
theological_decisions:
- issue: लोकोक्ति का सामाजिक और वैवाहिक संदर्भ
  choice: इसे स्त्रियों और बेटियों के बारे में एक सामान्य, संक्षिप्त कथन के रूप में रखा गया है; विवाह या नैतिक मूल्यांकन की अतिरिक्त व्याख्या नहीं जोड़ी गई।
  alternative: γυνή को ‘पत्नी’ मानकर कथन को स्पष्ट रूप से विवाह-संबंधी बनाना, अथवा इसके प्राचीन लैंगिक दृष्टिकोण को नरम करना।
  rationale: यूनानी पाठ संक्षिप्त और लोकोक्तिपरक है। अनुवाद उसके सामाजिक संसार और तनाव को बनाए रखता है, पर पाठ से बाहर की धार्मिक या नैतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘स्त्री’ और ‘पुरुष’ गरिमापूर्ण तथा सामान्य पाठक के लिए स्पष्ट हैं; मूल की लैंगिक सामान्योक्ति को न तो बढ़ाया गया है, न नरम किया गया है।
