  text: From them he exalted and sanctified[b][a], and from them he appointed a fixed number of days.
translation:
  language: hi
  text: उनमें से कुछ को उसने ऊँचा उठाया और पवित्र किया[a], और कुछ को दिनों की एक नियत संख्या के लिए ठहराया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर उठाया और पवित्र ठहराया।” यूनानी क्रियाओं का अधिक शाब्दिक अनुवाद ऐसा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दिनों की गिनती/संख्या में।” इसका अर्थ दिनों की एक ठहराई हुई या निश्चित संख्या, अर्थात एक निर्धारित अवधि, के लिए ठहराना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν / ἐξ αὐτῶν
  choice: उनमें से कुछ को
  rationale: दोनों यूनानी पदों का मूल अर्थ ‘उनमें से/उनसे’ है। हिन्दी में सकर्मक क्रियाओं के छूटे हुए कर्म को स्वाभाविक ढंग से व्यक्त करने के लिए ‘कुछ को’ जोड़ा गया है; इससे समूह में से चयन का भाव आता है, पर चुने गए सदस्यों की पहचान तय नहीं की जाती।
- source_word: ἀνύψωσεν
  choice: ऊँचा उठाया
  rationale: यह ἀνυψόω के ‘ऊँचा उठाना/महान करना’ दोनों भावों को साधारण, गरिमापूर्ण हिन्दी में बनाए रखता है और केवल सम्मान देने तक अर्थ को सीमित नहीं करता।
- source_word: ἡγίασεν
  choice: पवित्र किया
  rationale: ἁγιάζω का सीधा और सुबोध अनुवाद है। ‘अभिषिक्त’ या केवल अनुष्ठानिक ‘समर्पित’ कहने से आने वाली अनावश्यक संप्रदायगत अथवा कर्मकांडीय विशिष्टता से बचा गया है।
- source_word: ἔθηκεν
  choice: रखा
  rationale: τίθημι का व्यापक अर्थ ‘रखना/ठहराना’ है। ‘नियुक्त किया’ अर्थ को अधिक स्पष्ट कर देता, जबकि यहाँ असामान्य यूनानी रचना की खुली अर्थ-सम्भावना बचाना उचित है।
- source_word: εἰς ἀριθμὸν ἡμερῶν
  choice: दिनों की गिनती में
  rationale: यह ‘into a number/count of days’ के निकट है और वाक्यांश को अनिवार्य रूप से ‘दिनों की निश्चित संख्या’ नहीं बनाता। सम्भावित अर्थ फुटनोट में बताया गया है।
theological_decisions:
- issue: यूनानी क्रियाओं का कर्ता स्पष्ट रूप से नहीं दिया गया है
  choice: उसने
  alternative: परमेश्वर ने / प्रभु ने
  rationale: हिन्दी में सर्वनाम देकर वाक्य स्वाभाविक बनाया गया है, पर स्रोत में अनुपस्थित ईश्वरीय नाम या उपाधि नहीं जोड़ी गई; इस प्रकार पूर्वसंदर्भ पर निर्भरता बनी रहती है।
- issue: समूह में से किसे ऊँचा और पवित्र किया गया
  choice: कुछ को
  alternative: उन्हें
  rationale: दो बार आए ‘उनमें से’ के स्वाभाविक अंशवाचक अर्थ को व्यक्त किया गया है, लेकिन उनकी पहचान या श्रेणी के बारे में कोई धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। ‘ऊँचा उठाया’ तथा ‘पवित्र किया’ सामान्य पाठक के लिए स्पष्ट हैं; अंतिम असामान्य पदबंध को अत्यधिक व्याख्यायित करने के बजाय स्रोत की सम्भावित अस्पष्टता सहित रखा गया है।
