base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/001.yaml
  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
translation:
  language: hi
  text: जो प्रभु का भय मानता है, उसके सामने कोई बुराई नहीं आएगी[a]; बल्कि परीक्षा के समय प्रभु उसे फिर छुड़ाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो प्रभु का भय मानता है, उसे कोई हानि नहीं पहुँचेगी।” यूनानी κακόν का अर्थ “बुराई,” “हानि” या “विपत्ति” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परख अथवा प्रलोभन के समय प्रभु उसे फिर बचाएगा।” यूनानी πειρασμός का अर्थ परीक्षा, परख या प्रलोभन हो सकता है; यहाँ प्रसंग प्रतिकूल परिस्थिति या परखे जाने के भाव का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  choice: जो प्रभु का भय मानता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी भी ऐसे व्यक्ति की ओर संकेत करता है जिसकी पहचान प्रभु का भय मानने से होती है। यह रूप एकवचन और नीतिवचन-सदृश सामान्य कथन, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκ ἀπαντήσει
  choice: उसके सामने ... नहीं आएगी
  rationale: ἀπαντάω में मिलने या सामने आने का बिंब है। यह अनुवाद उस बिंब को सुरक्षित रखते हुए हिन्दी में स्वाभाविक है और यह भाव देता है कि बुराई उस व्यक्ति को आ नहीं घेरेगी।
- source_word: κακόν
  choice: बुराई
  rationale: κακόν नैतिक बुराई, हानि या विपत्ति को व्यक्त कर सकता है। ‘बुराई’ इसकी व्यापकता बनाए रखती है; संकुचित अर्थ फुटनोट में दिए गए हैं।
- source_word: ἐν πειρασμῷ
  choice: परीक्षा के समय
  rationale: πειρασμός का अर्थ परीक्षा, परख या प्रलोभन हो सकता है। यहाँ छुड़ाए जाने की बात होने के कारण ‘परीक्षा’ प्रतिकूल परिस्थिति और परखे जाने—दोनों भावों को बिना केवल नैतिक प्रलोभन तक सीमित किए व्यक्त करती है।
- source_word: καὶ πάλιν
  choice: फिर
  rationale: πάλιν का सामान्य अर्थ ‘फिर’ या ‘एक बार और’ है। संक्षिप्त ‘फिर’ बार-बार या नए सिरे से मिलने वाले छुटकारे का भाव बनाए रखता है।
- source_word: ἐξελεῖται
  choice: प्रभु उसे ... छुड़ाएगा
  rationale: क्रिया का अर्थ बचाना या छुड़ाना है। यूनानी में कर्ता निहित है; प्रसंग में निकटतम और सबसे स्वाभाविक कर्ता प्रभु है। हिन्दी में स्पष्टता के लिए ‘प्रभु’ और कर्म के रूप में ‘उसे’ रखा गया है।
theological_decisions:
- issue: ἐξελεῖται का निहित कर्ता
  choice: 'कर्ता के रूप में ‘प्रभु’ को स्पष्ट किया गया: ‘प्रभु उसे फिर छुड़ाएगा।’'
  alternative: ‘वह फिर छुड़ाया जाएगा’ जैसा कर्मवाच्य या निर्वैयक्तिक अनुवाद
  rationale: पहले खंड में प्रभु का उल्लेख और ईश्वरीय छुटकारे का प्रसंग प्रभु को सबसे स्वाभाविक निहित कर्ता बनाते हैं। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए नाम दोहराया गया है।
- issue: बुराई न आने और परीक्षा उपस्थित होने के बीच तनाव
  choice: पहले खंड में व्यापक ‘बुराई’ और दूसरे में वास्तविक ‘परीक्षा’ दोनों को ज्यों का त्यों रखा गया है।
  alternative: पहले खंड को केवल अंतिम हानि या नैतिक बुराई तक सीमित करके स्पष्ट करना
  rationale: मूल कथन एक ओर बुराई के न मिलने और दूसरी ओर परीक्षा में छुटकारे की बात करता है। अनुवाद इस ज्ञान-साहित्यिक तनाव को किसी धर्मवैज्ञानिक व्याख्या से समाप्त नहीं करता।
- issue: κακόν का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘बुराई’
  alternative: ‘हानि’ या ‘विपत्ति’
  rationale: ‘बुराई’ यूनानी शब्द की नैतिक और प्रतिकूल दोनों संभावनाओं को व्यापक रूप से रखती है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और नीतिवचन-सदृश वाक्य-विन्यास अपनाया गया है। ‘प्रभु का भय मानना’ बाइबिलीय ज्ञान-साहित्य का परिचित पद है और मूल की धार्मिक अर्थवत्ता सुरक्षित रखता है।
