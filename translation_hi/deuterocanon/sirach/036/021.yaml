lexical_decisions:
- source_word: φάρυγξ
  choice: गला
  rationale: यह शब्द गले या कंठ को दर्शाता है। ‘गला’ शारीरिक बिंब को बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γεύεται
  choice: स्वाद पहचानता है
  rationale: क्रिया का मूल अर्थ ‘चखना’ है; प्रसंग में स्वाद के द्वारा भेद पहचानने का भाव है, इसलिए यह प्रयोग तुलना की विवेचनात्मक धार को स्पष्ट करता है।
- source_word: βρώματα θήρας
  choice: शिकार से मिले भोजन
  rationale: बहुवचन βρώματα खाने की वस्तुओं को और θήρας शिकार से संबंध को व्यक्त करता है। यह अनुवाद केवल ‘मांस’ का अर्थ आरोपित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: καρδία συνετή
  choice: समझदार हृदय
  rationale: ज्ञान-साहित्य में ‘हृदय’ समझ और निर्णय का केंद्र है। ‘समझदार’ συνετή की विवेकयुक्त समझ को सामान्य पाठकों के लिए स्पष्ट रखता है।
- source_word: λόγους ψευδεῖς
  choice: झूठी बातों
  rationale: λόγους यहाँ वचनों या कही गई बातों को और ψευδεῖς उनकी असत्यता को दर्शाता है। ‘झूठी बातें’ आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: '[οὕτως के बाद निहित क्रिया]'
  choice: परखता है
  rationale: दूसरे उपवाक्य में यूनानी पाठ स्पष्ट क्रिया नहीं देता; पहले उपवाक्य की स्वाद द्वारा पहचानने की क्रिया तुलना में निहित है। ‘परखता है’ हिन्दी में वाक्य पूरा करता है और इस निहित समानता को व्यक्त करता है।
