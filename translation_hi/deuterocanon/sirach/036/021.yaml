  naturalness: The draft is generally fluent modern Hindi. “गला ... स्वाद पहचानता है” is less idiomatic than “गला ... स्वाद लेता है.”
  terminology: “हृदय,” “झूठी बातें,” and “परखता है” appropriately preserve the wisdom-literature imagery and the elliptical comparison. “विवेकी” gives συνετή a slightly more precise sense of discernment than the broader “समझदार.”
