  yaml_path: translation/deuterocanon/sirach/036/014.yaml
  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: hi
  text: हे प्रभु, उस प्रजा पर दया कर जो तेरे नाम से कहलाती है, और इस्राएल पर भी, जिसे तूने ज्येष्ठ पुत्र के समान बनाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल, जिसे तूने अपना ज्येष्ठ पुत्र बनाया है।” यह इस्राएल को परमेश्वर का ज्येष्ठ पुत्र कहने वाले व्यापक बाइबलीय विषय को दर्शाता है (निर्गमन 4:22 देखें)। यहाँ यूनानी का अधिक शाब्दिक अर्थ है, “जिसे तूने ज्येष्ठ पुत्र के समान बनाया।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: दया कर
  rationale: अओरिस्ट आज्ञार्थक प्रार्थना में करुणापूर्ण हस्तक्षेप की सीधी विनती है; ‘दया कर’ स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: λαόν
  choice: उस प्रजा
  rationale: यूनानी में संबंधसूचक ‘तेरी’ स्पष्ट नहीं है; अगले विशेषण-वाक्य से प्रजा की पहचान होती है। ‘उस प्रजा’ हिन्दी में निश्चितता दिखाते हुए अनावश्यक स्वामित्व नहीं जोड़ता।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को आधुनिक गरिमापूर्ण प्रार्थनात्मक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: जो तेरे नाम से पुकारी जाती है
  rationale: पूर्ण निष्क्रिय कृदन्त और ἐπί + नाम के मुहावरे में किसी के नाम से अभिहित होने या उसके अधिकार से जुड़े होने का भाव है; यह रूप उस वाचा-संबंधी अनुगूँज को बनाए रखता है।
- source_word: Ἰσραήλ
  choice: इस्राएल
  rationale: प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: πρωτόγονον
  choice: पहलौठे
  rationale: शब्द का मूल अर्थ ‘पहला जन्मा’ है। हिन्दी में ‘पहलौठा’ पारिवारिक और पुत्रवत तुलना को स्वाभाविक ढंग से व्यक्त करता है; मुख्य पाठ में ‘पुत्र’ जोड़ना आवश्यक नहीं।
- source_word: ὡμοίωσας
  choice: समान ठहराया
  rationale: ὁμοιόω की तुलनात्मक शक्ति—किसी के समान करना या मानना—को बनाए रखता है और इस्राएल को सीधे ‘अपना पहलौठा बनाया’ कहकर अर्थ को अधिक प्रबल नहीं करता।
theological_decisions:
- issue: क्या अंतिम उपवाक्य इस्राएल को परमेश्वर का वास्तविक पहलौठा घोषित करता है या पहलौठे के समान ठहराता है?
  choice: ‘जिसे तूने पहलौठे के समान ठहराया है’
  alternative: ‘जिसे तूने अपना पहलौठा बनाया है’
  rationale: यूनानी ὡμοίωσας में तुलना का भाव स्पष्ट है। मुख्य पाठ उसी तनाव को सुरक्षित रखता है; निर्गमन 4:22 से संभावित अधिक प्रबल अर्थ को पाठ में चुपचाप नहीं मिलाया गया, बल्कि पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थना-शैली में है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तेरे/तूने’ रखा गया है। ‘प्रजा’ सामूहिक λαός के लिए और ‘पहलौठा’ πρωτόγονος की पारिवारिक अनुगूँज के लिए चुना गया है।
