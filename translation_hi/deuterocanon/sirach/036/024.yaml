  yaml_path: translation/deuterocanon/sirach/036/024.yaml
  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: hi
  text: स्त्री का सौंदर्य चेहरे को खिला देता है[a] और पुरुष की हर अभिलाषा से बढ़कर होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चेहरे को प्रसन्न कर देता है” अथवा “मुख को हर्षित करता है।”
    reason: ἱλαρύνει में प्रसन्न करने और उज्ज्वल करने, दोनों का भाव हो सकता है।
  - marker: b
    text: यूनानी ἀνθρώπου का अर्थ कुछ प्रसंगों में “मनुष्य की” या “किसी व्यक्ति की” भी हो सकता है।
    reason: मूल शब्द के लैंगिक और सामान्य—दोनों संभावित प्रयोगों को स्पष्ट करना।
lexical_decisions:
- source_word: κάλλος
  choice: सौंदर्य
  rationale: यह संज्ञा रूप-सौंदर्य या आकर्षक रूप को व्यक्त करती है; आधुनिक हिन्दी में ‘सौंदर्य’ स्वाभाविक और गरिमापूर्ण है।
- source_word: γυναικὸς
  choice: स्त्री का
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर इस वाक्य में वैवाहिक अर्थ अनिवार्य नहीं है; इसलिए व्यापक अर्थ ‘स्त्री’ रखा गया है।
- source_word: ἱλαρύνει πρόσωπον
  choice: चेहरे को खिला देता है
  rationale: ἱλαρύνει प्रसन्न या उज्ज्वल करने का भाव देता है और πρόσωπον ठोस रूप से ‘चेहरा’ है। हिन्दी मुहावरा ‘चेहरे को खिला देना’ प्रसन्नता और दिखाई देने वाली चमक—दोनों को सुरक्षित रखता है।
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν
  choice: हर अभिलाषा से बढ़कर
  rationale: ὑπέρ के साथ कर्मकारक यहाँ अतिक्रमण या श्रेष्ठता बताता है; ἐπιθυμία के लिए ‘अभिलाषा’ इच्छा या लालसा के भाव को गरिमापूर्ण, सहज हिन्दी में व्यक्त करती है।
- source_word: ἀνθρώπου
  choice: पुरुष की
  rationale: ἀνθρώπου कई प्रसंगों में सामान्यतः ‘मनुष्य’ का अर्थ दे सकता है, किंतु यहाँ ‘स्त्री’ के सौंदर्य के संबंध में कही गई उक्ति का लैंगिक रूप बनाए रखने के लिए ‘पुरुष’ चुना गया है; सामान्य अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: ὑπεράγει
  choice: बढ़कर होता है
  rationale: क्रिया किसी वस्तु से आगे निकलने या उससे श्रेष्ठ होने का अर्थ देती है; हिन्दी में यह तुलनात्मक बल स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: ज्ञानोक्ति में लैंगिक शब्दावली
  choice: मुख्य पाठ में ‘स्त्री’ और ‘पुरुष’ रखा गया है।
  alternative: ‘स्त्री का सौंदर्य ... मनुष्य की हर अभिलाषा से बढ़कर होता है।’
  rationale: γυναικός स्पष्टतः स्त्री को सूचित करता है और इस प्रसंग में ἀνθρώπου को पुरुष के रूप में समझना उक्ति के लैंगिक एवं आलंकारिक ढाँचे को बनाए रखता है। फिर भी ἄνθρωπος का सामान्य ‘मनुष्य’ अर्थ वास्तविक है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कहावत-जैसी और गरिमापूर्ण शैली रखी गई है। ‘चेहरे को खिला देता है’ सामान्य पाठक के लिए सहज है और मूल की दृश्यात्मकता तथा प्रसन्नता, दोनों को व्यक्त करता है।
