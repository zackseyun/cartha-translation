translation:
  language: hi
  text: तेरे पवित्रस्थान के नगर, यरूशलेम, तेरे विश्रामस्थान के नगर पर करुणा कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτείρησον
  choice: करुणा कर
  rationale: आज्ञार्थक क्रिया दयापूर्ण करुणा की पुकार व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πόλιν
  choice: नगर
  rationale: यूनानी में पद बिना उपपद के है, पर यरूशलेम के साथ समानाधिकरण और संबंधसूचक पदों के कारण आशय निश्चित नगर का है।
- source_word: ἁγιάσματός σου
  choice: अपने पवित्रस्थान के
  rationale: ἁγίασμα पवित्र या समर्पित स्थान को दर्शाता है; ‘पवित्रस्थान’ धार्मिक संदर्भ में संक्षिप्त और स्पष्ट है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: καταπαύματός σου
  choice: अपने विश्रामस्थान के
  rationale: κατάπαυμα मूलतः विश्राम अथवा ठहरने के स्थान को दर्शाता है; ‘विश्रामस्थान’ इसकी ठोस संज्ञात्मक छवि को बनाए रखता है और केवल ‘निवासस्थान’ कहकर अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: यरूशलेम का वर्णन करने वाले दो संबंधसूचक पदबंध
  choice: यरूशलेम को ‘अपने पवित्रस्थान के नगर’ और ‘अपने विश्रामस्थान के नगर’—दोनों रूपों में समानाधिकरण द्वारा प्रस्तुत किया गया है।
  alternative: ‘यरूशलेम, तेरा पवित्र नगर और तेरा विश्रामस्थान’ अथवा ‘वह नगर जहाँ तेरा पवित्रस्थान ठहरा है’।
  rationale: यूनानी पाठ में πόλιν दो बार आता है और दोनों पदबंध यरूशलेम के समानाधिकरण में हैं। दोनों को अलग रखते हुए अनुवाद पवित्र उपस्थिति और दिव्य विश्राम की जुड़ी हुई, पर भिन्न छवियों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ईश्वर के लिए निकट संबोधन के अनुरूप ‘अपने’ और एकवचन आज्ञार्थक ‘कर’ रखा गया है। डैश यूनानी के दूसरे समानाधिकरणीय वर्णन को स्वाभाविक हिन्दी में स्पष्ट करता है।
