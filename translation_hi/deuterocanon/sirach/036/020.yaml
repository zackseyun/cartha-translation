translation:
  language: hi
  text: पेट हर तरह का भोजन खा लेता है, फिर भी कोई भोजन दूसरे से उत्तम होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν βρῶμα
  choice: हर तरह का भोजन
  rationale: शाब्दिक रूप से ‘हर भोजन’; हिन्दी में यह प्रयोग विभिन्न प्रकार के भोजन को समेटते हुए सूक्ति का सामान्य भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: φάγεται
  choice: खा लेता है
  rationale: रूप भविष्यत्/कर्मवाच्य है, पर ज्ञान-साहित्य में यह सार्वकालिक सत्य व्यक्त करता है। हिन्दी का सामान्य वर्तमान काल सूक्तिपरक अर्थ को सहजता से रखता है।
- source_word: κοιλία
  choice: पेट
  rationale: खाने के प्रसंग में इसका अर्थ उदर या पेट है; ‘पेट’ आधुनिक सामान्य हिन्दी में सबसे स्वाभाविक और स्पष्ट है।
- source_word: ἔστιν δὲ
  choice: फिर भी
  rationale: यह पहले कथन के बावजूद भोजनों की गुणवत्ता में अंतर दिखाने वाला विरोधसूचक संबंध व्यक्त करता है।
- source_word: βρῶμα βρώματος κάλλιον
  choice: कोई भोजन दूसरे से उत्तम होता है
  rationale: यूनानी तुलनात्मक प्रयोग का शाब्दिक रूप ‘भोजन भोजन से बेहतर’ है। हिन्दी में स्पष्ट तुलनात्मक जोड़ी देकर वही अर्थ स्वाभाविक ढंग से व्यक्त किया गया है।
