  text: And all men are from the ground[a], and Adam was created from the earth.
translation:
  language: hi
  text: और सभी मनुष्य मिट्टी से हैं, और आदम पृथ्वी से रचा गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: सभी मनुष्य
  rationale: यह पदबंध पूरी मानवजाति के लिए सामान्य अर्थ में प्रयुक्त है। हिन्दी में ‘सभी मनुष्य’ स्रोत के मानवीय संदर्भ को स्वाभाविक और समावेशी ढंग से व्यक्त करता है; व्याकरणिक पुल्लिंग के प्रतिनिधिक प्रयोग को समझाने के लिए अलग पादटिप्पणी आवश्यक नहीं है।
- source_word: ἀπὸ ἐδάφους
  choice: मिट्टी से
  rationale: ἐδάφος यहाँ धरातल या मिट्टी को दर्शाता है। ‘मिट्टी’ सृष्टि की ठोस छवि को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: ἐκ γῆς
  choice: पृथ्वी से
  rationale: γῆ के लिए ‘पृथ्वी’ चुनने से पहले खंड की ‘मिट्टी’ के साथ स्रोत में उपस्थित शब्दगत भिन्नता बनी रहती है और अर्थ अनावश्यक रूप से संकुचित नहीं होता।
- source_word: ἐκτίσθη
  choice: रचा गया
  rationale: κτίζω के निष्क्रिय रूप का अर्थ ‘सृजा गया’ या ‘बनाया गया’ है। ‘रचा गया’ आधुनिक, गरिमापूर्ण हिन्दी में सृष्टि के भाव को सहजता से व्यक्त करता है।
- source_word: Ἀδάμ
  choice: आदम
  rationale: व्यक्तिवाचक नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में लिप्यंतरित किया गया है; इसे सामान्य ‘मनुष्य’ में नहीं बदला गया, ताकि व्यक्तिगत और प्रतिनिधिक दोनों संकेत सुरक्षित रहें।
theological_decisions:
- issue: ἄνθρωποι πάντες और आदम के बीच प्रतिनिधिक संबंध
  choice: पहला खंड सभी मनुष्यों के मिट्टी से होने की सामान्य बात कहता है, और दूसरा खंड आदम के पृथ्वी से रचे जाने को उसके साथ रखता है।
  alternative: दूसरे खंड को आदम के द्वारा आदर्श या प्रतिनिधिक मानवता की व्याख्या मानना।
  rationale: यूनानी पाठ सामान्य कथन के बाद आदम का उल्लेख करता है, पर दोनों के संबंध को स्पष्ट रूप से कारणात्मक या समानाधिकरणात्मक नहीं बताता। हिन्दी अनुवाद ‘और’ को बनाए रखकर इस अर्थगत खुलापन और धार्मिक तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मिट्टी’ और ‘पृथ्वी’ द्वारा ἐδάφος तथा γῆ की सूक्ष्म शब्दगत भिन्नता रखी गई है। हिन्दी में ‘मनुष्य’ स्वाभाविक रूप से मानवजाति को समावेशी ढंग से व्यक्त करता है, इसलिए अंग्रेज़ी की लिंग-संबंधी पादटिप्पणी स्थानांतरित नहीं की गई।
