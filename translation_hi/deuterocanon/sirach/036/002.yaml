translation:
  language: hi
  text: बुद्धिमान पुरुष व्यवस्था से बैर नहीं रखेगा, पर जो व्यवस्था के मामले में ढोंग करता है, वह तूफ़ान में जहाज़ के समान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  choice: बुद्धिमान पुरुष
  rationale: ἀνήρ स्पष्ट रूप से पुल्लिंग एकवचन है और σοφός ज्ञान-साहित्य के संदर्भ में ‘बुद्धिमान’ है; यह संयोजन मूल की लिंग-सूचना और गरिमापूर्ण शैली दोनों बनाए रखता है।
- source_word: οὐ μισήσει
  choice: बैर नहीं रखेगा
  rationale: μισέω का मूल भाव ‘घृणा/विरोध रखना’ है। यहाँ व्यवस्था के प्रति स्थायी प्रतिकूल रुख के लिए ‘बैर रखना’ स्वाभाविक हिन्दी है और क्रिया के प्रबल अर्थ को बनाए रखता है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: सिराख के यहूदी ज्ञान-साहित्यिक संदर्भ में νόμος मुख्यतः परमेश्वर की व्यवस्था/तोरा की ओर संकेत करता है; ‘व्यवस्था’ इस पारंपरिक अर्थ को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करती है।
- source_word: ὁ δὲ ὑποκρινόμενος ἐν αὐτῷ
  choice: पर जो उसके विषय में ढोंग करता है
  rationale: वर्तमान कृदंत ὑποκρινόμενος किसी स्थिर उपाधि से अधिक किए जा रहे दिखावे या कपट को दर्शाता है। ‘उसके विषय में’ ἐν αὐτῷ का व्यवस्था से संबंध स्पष्ट करते हुए हिन्दी में स्वाभाविक है।
- source_word: ὡς ἐν καταιγίδι πλοῖον
  choice: आँधी में पड़े जहाज़ के समान
  rationale: καταιγίς प्रचंड आँधी या तूफ़ान है और πλοῖον जहाज़। ‘पड़े’ जोड़ने से हिन्दी में जहाज़ की अस्थिर, संकटग्रस्त दशा स्वाभाविक रूप से सामने आती है, बिना उपमा का अर्थ बदलने के।
theological_decisions:
- issue: νόμον का संदर्भ
  choice: परमेश्वर की व्यवस्था/तोरा की यहूदी ज्ञान-साहित्यिक धारणा को ‘व्यवस्था’ से व्यक्त किया गया
  alternative: सामान्य अर्थ में ‘शिक्षा’ या ‘नियम’
  rationale: सिराख में νόμος सामान्यतः तोरा से जुड़ा है, यद्यपि उसमें शिक्षापरक भाव भी है। केवल ‘व्यवस्था’ कहना संभावित अर्थ-विस्तार को अनावश्यक रूप से सीमित किए बिना मुख्य संदर्भ बनाए रखता है।
- issue: ὑποκρινόμενος का नैतिक बल
  choice: व्यवस्था के विषय में सक्रिय दिखावा—‘ढोंग करता है’
  alternative: स्थिर संज्ञात्मक वर्णन—‘पाखंडी है’
  rationale: कृदंत का क्रियात्मक बल ऐसे व्यक्ति को दिखाता है जो व्यवस्था के प्रति सच्ची निष्ठा के बजाय उसका दिखावा करता है; इससे बुद्धिमान पुरुष और कपटी आचरण के बीच मूल विरोध सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण ज्ञान-साहित्यिक शैली अपनाई गई है। ‘व्यवस्था’ बाइबलीय संदर्भ बनाए रखता है, जबकि ‘ढोंग करता है’ सामान्य पाठक के लिए स्पष्ट और वर्तमान प्रयोग का है।
