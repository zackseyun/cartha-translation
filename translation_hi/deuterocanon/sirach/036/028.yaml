  choice: क्योंकि ... कौन भरोसा करेगा
  rationale: πιστεύω यहाँ किसी व्यक्ति पर विश्वास या भरोसा रखने के अर्थ में है; γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से सुरक्षित रखा गया है।
- source_word: εὐζώνῳ λῃστῇ
  choice: कमर-कसे लुटेरे
  rationale: εὔζωνος का मूल भाव कमर कसकर कार्य के लिए तैयार या सुसज्जित होना है। ‘कमर-कसा’ इस चित्र को सुरक्षित रखता है और ‘हथियारबंद’ जैसा अनिवार्य रूप से हथियार जोड़ने से बचता है; λῃστής के लिए ‘लुटेरा’ उपयुक्त है।
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: जो एक नगर से दूसरे नगर तक भटकता फिरता है
  rationale: σφάλλομαι में लड़खड़ाने, अस्थिर होने या मार्ग से विचलित होकर फिरने का भाव हो सकता है। प्रसंग में अस्थिर भ्रमण प्रधान है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: οὕτως ἀνθρώπῳ
  choice: ऐसा ही वह मनुष्य है
  rationale: οὕτως उपमा के दूसरे पक्ष को प्रस्तुत करता है; ἀνθρώπῳ के एकवचन मानवीय संदर्भ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: जिसका कोई घोंसला नहीं
  rationale: νοσσιά का प्रत्यक्ष अर्थ ‘घोंसला’ है। स्थायी घर न होने का रूपक सपाट किए बिना सुरक्षित रखा गया है।
- source_word: καταλύοντι
  choice: रात बिताता है
  rationale: यहाँ καταλύω रुकने या रात के लिए ठहरने के अर्थ में है; ‘रात बिताता है’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: जहाँ शाम उसे आ घेरती है
  rationale: ὀψίζω में देर या शाम हो जाने का भाव है। यह अनिश्चित स्थान और संध्या द्वारा आ पकड़े जाने की मूल अभिव्यक्ति को बनाए रखता है।
