  verdict: revise
  source_fidelity: Draft correctly renders the rhetorical question, the robber image, the nest metaphor, and lodging where evening overtakes him. However, σφαλλομένῳ more distinctly conveys staggering/tottering than the neutral ‘भटकता फिरता है’; this nuance should be retained in the main text rather than only in a footnote. The comparison introduced by οὕτως is more natural and precise in Hindi as ‘ऐसा ही ... के साथ है.’
  naturalness: ‘कमर-कसे लुटेरे’ and ‘जहाँ शाम उसे आ घेरती है’ are natural, dignified modern Hindi. ‘ऐसा ही वह मनुष्य है’ is awkward and does not idiomatically express the Greek comparative construction; ‘ऐसा ही उस मनुष्य के साथ है’ is preferable.
  terminology: ‘लुटेरा’ appropriately renders λῃστής, and ‘कमर-कसा’ preserves εὐζώνῳ without adding weapons. ‘घोंसला’ rightly retains the Greek bird-nest metaphor. No theological terminology is involved.
  issues:
  - severity: medium
    issue: σφαλλομένῳ is rendered too neutrally as ‘भटकता फिरता है.’
    rationale: The participle carries a sense of stumbling, tottering, or unstable movement. ‘लड़खड़ाता फिरता है’ preserves this salient image while remaining idiomatic Hindi.
  - severity: medium
    issue: ‘ऐसा ही वह मनुष्य है’ is an awkward rendering of οὕτως ἀνθρώπῳ.
    rationale: The Greek presents the corresponding case of a man; Hindi naturally expresses this as ‘ऐसा ही उस मनुष्य के साथ है,’ without changing the proverbial comparison.
