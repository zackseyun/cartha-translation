base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: hi
  text: क्योंकि उस कमर-कसे लुटेरे पर कौन भरोसा करेगा, जो एक नगर से दूसरे नगर लड़खड़ाता फिरता है?[a] ऐसा ही उस मनुष्य के साथ है जिसका कोई घोंसला नहीं और जो वहीं रात बिताता है जहाँ शाम उसे आ घेरती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कमर-कसा” का अर्थ कार्य के लिए तैयार या सुसज्जित है। “लड़खड़ाता फिरता है” के लिए यूनानी शब्द में अस्थिर होने, ठोकर खाने, या डगमगाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “घोंसला” यूनानी का प्रत्यक्ष रूपक है; आशय किसी स्थायी और सुरक्षित घर या ठिकाने के न होने से है।
    reason: lexical_alternative
