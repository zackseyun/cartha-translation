  - marker: b
    text: यूनानी का अर्थ अधिक सामान्य रूप से ‘उसे प्रत्युत्तर देगा’ या ‘उसे वैसा ही लौटाएगा’ भी हो सकता है। प्रतिक्रिया का ठीक स्वरूप स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  choice: हृदय
  rationale: यह विचार, स्वभाव और भीतरी प्रवृत्ति के केंद्र को दर्शाने वाली बाइबलीय उपमा को बनाए रखता है।
- source_word: στρεβλὴ
  choice: टेढ़ा
  rationale: यह नैतिक विकृति का बोध कराता है, पर मूल यूनानी से अधिक कठोर अर्थ नहीं थोपता।
- source_word: δώσει λύπην
  choice: दुःख पहुँचाएगा
  rationale: शाब्दिक अर्थ ‘दुःख देगा’ है; हिन्दी में ‘दुःख पहुँचाएगा’ उसी आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह एकवचन मानवीय संदर्भ और नीतिवचन की सामान्य व्यापकता, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πολύπειρος
  choice: बहुत अनुभवी
  rationale: यह ऐसे व्यक्ति को दर्शाता है जिसने बहुत अनुभव पाया है; सरल और वर्तमान हिन्दी में यूनानी विशेषण का सीधा अर्थ देता है।
- source_word: ἀνταποδώσει
  choice: प्रतिफल देगा
  rationale: यह लौटाकर देने अथवा प्रत्युत्तर में देने के पारस्परिक भाव को रखता है और प्रतिक्रिया को अनावश्यक रूप से प्रतिशोध तक सीमित नहीं करता।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह यूनानी के पुल्लिंग एकवचन संप्रदान को रखता है; निकटतम निहित संदर्भ टेढ़े हृदय वाला व्यक्ति है।
theological_decisions:
- issue: ἀνταποδώσει की प्रतिक्रिया का स्वरूप
  choice: उसे प्रतिफल देगा
  alternative: उसे प्रत्युत्तर देगा / उसे वैसा ही लौटाएगा
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि प्रतिक्रिया सलाह, न्यायोचित प्रतिफल या प्रतिशोध है। इसलिए अनुवाद उसकी नैतिक दिशा को खुला रखता है।
- issue: नीतिवचन में ἄνθρωπος का सामान्य मानवीय संदर्भ
  choice: मनुष्य
  alternative: व्यक्ति / आदमी
  rationale: ‘मनुष्य’ यूनानी एकवचन को बनाए रखते हुए स्त्री-पुरुष दोनों पर लागू होने वाले नीतिवचन-संबंधी कथन के लिए स्वाभाविक और गरिमापूर्ण है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘टेढ़ा हृदय’ मूल रूपक को बनाए रखता है, जबकि ‘दुःख पहुँचाएगा’ हिन्दी में शाब्दिक ‘दुःख देगा’ से अधिक स्वाभाविक है।
