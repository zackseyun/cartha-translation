  yaml_path: translation/deuterocanon/sirach/036/017.yaml
  text: Give testimony to your creatures from the beginning[b][a], and raise up the prophecies spoken in your name.
translation:
  language: hi
  text: आरम्भ में रची हुई अपनी उन सृजित वस्तुओं के पक्ष में गवाही दे[a], और अपने नाम से कही गई भविष्यवाणियों को उठा खड़ा कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरम्भ में रची हुई अपनी सृष्टि के लिए गवाही दे।” यूनानी पदबंध संक्षिप्त है और जीवित प्राणियों के साथ-साथ आरम्भ में रची गई सभी वस्तुओं की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने नाम से कही गई भविष्यवाणियों को पूरा कर।” यूनानी में शाब्दिक रूप से “भविष्यवाणियों को उठा खड़ा कर” है, जिसका आशय उन्हें प्रभाव में लाना या पूरा करना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μαρτύριον
  choice: गवाही दे
  rationale: δὸς आज्ञार्थक रूप है और μαρτύριον का मूल अर्थ ‘गवाही’ या ‘साक्ष्य’ है। ‘गवाही दे’ हिन्दी में स्वाभाविक रहते हुए न्यायिक और प्रकाशनात्मक दोनों भाव बनाए रखता है।
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  choice: अपनी उन सृष्टियों के पक्ष में ... जो आरम्भ से हैं
  rationale: κτίσμα अनेकवचन में सृजी हुई वस्तुओं या प्राणियों को सूचित कर सकता है। ‘सृष्टियों’ इसका व्यापक अर्थ खुला रखता है; चतुर्थी को ‘के पक्ष में’ से व्यक्त किया गया है, और संक्षिप्त यूनानी पदबंध ἐν ἀρχῇ को सहज हिन्दी संबंधवाक्य में रखा गया है।
- source_word: ἔγειρον
  choice: उठा खड़ा कर
  rationale: यह ἐγείρω का आज्ञार्थक रूप है, जिसका मूल बिंब जगाने या उठाने का है। यह अनुवाद उस रूपक को बनाए रखता है और ‘पूरा कर’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति को मुख्य पाठ में नहीं लाता।
- source_word: προφητείας
  choice: भविष्यवाणियों
  rationale: प्रसंग में προφητεία भविष्यसूचक कथनों को दर्शाता है। हिन्दी में ‘भविष्यवाणियाँ’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: अपने नाम से कही गई
  rationale: ἐπʼ ὀνόματί σου को शब्दशः रखना हिन्दी में अस्पष्ट होता। ‘अपने नाम से कही गई’ उन भविष्यवाणियों के परमेश्वर के अधिकार और नाम में कहे जाने का भाव व्यक्त करता है, बिना उन्हें केवल परमेश्वर के नाम के विषय में कही गई बातें मान लेने के।
theological_decisions:
- issue: ‘आरम्भ से’ वाली सृष्टियों की पहचान
  choice: इसे व्यापक रूप से परमेश्वर की आरम्भ से विद्यमान सृजी हुई वस्तुओं या प्राणियों के रूप में खुला रखा गया है।
  alternative: इसे विशेष रूप से प्राचीन इस्राएली गोत्रों या परमेश्वर की प्रजा का संकेत माना जा सकता है।
  rationale: κτίσμα का सामान्य अर्थ सृजी हुई वस्तु या प्राणी है। प्रसंग में परमेश्वर की प्रजा की ओर संकेत संभव है, पर यूनानी पाठ स्वयं उस पहचान को स्पष्ट नहीं करता; इसलिए मुख्य पाठ उसे संकीर्ण नहीं करता।
- issue: भविष्यवाणियों को ‘उठा खड़ा करने’ का आशय
  choice: मूल रूपक को बनाए रखते हुए इसे भविष्यसूचक वचनों को सक्रिय प्रभाव या प्रमाणित स्थिति में लाने की विनती के रूप में खुला रखा गया है।
  alternative: इसे सीधे ‘भविष्यवाणियाँ पूरी कर’ अनूदित किया जा सकता है।
  rationale: क्रिया ἐγείρω का सीधा अर्थ उठाना या जगाना है और उसका कर्म ‘भविष्यवाणियाँ’ है, ‘भविष्यद्वक्ता’ नहीं। रूपक को बनाए रखने से पूर्ति, पुष्टि और नया प्रभाव—इन संभावित अर्थों में से किसी एक को अनावश्यक रूप से निर्णायक नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘सृष्टियों’ और ‘उठा खड़ा कर’ कुछ असामान्य होते हुए भी मूल यूनानी की व्यापकता और रूपक को सुरक्षित रखते हैं; पादटिप्पणियाँ संभावित अधिक सहज या व्याख्यात्मक अर्थ स्पष्ट करती हैं।
