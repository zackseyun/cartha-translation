- source_word: γυνή
  choice: पत्नी
  rationale: इस घरेलू और लोकोक्तिपरक प्रसंग में अर्थ सामान्य ‘स्त्री’ के बजाय ‘पत्नी’ है।
- source_word: στενάξει
  choice: कराहेगा
  rationale: यह क्रिया गहरी व्यथा की ध्वनि व्यक्त करती है; ‘कराहेगा’ साधारण ‘आह भरेगा’ से अधिक प्रबल और स्रोत के निकट है।
- source_word: πλανώμενος
  choice: भटकता हुआ
  rationale: वर्तमान कृदन्त कराहने के साथ चल रही अस्थिर, इधर-उधर भटकने की दशा बताता है।
- source_word: οὗ οὐκ ἔστιν ... καὶ οὗ οὐκ ἔστιν
  choice: जहाँ ... नहीं होती, वहाँ ...; और जहाँ ... नहीं होती, वहाँ ...
  rationale: यह चयन यूनानी की दोहराई गई लोकोक्तिपरक समानांतर रचना को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दूसरे खंड में लिंग-सूचक निहित कर्ता
  choice: वह भटकता हुआ कराहेगा
  alternative: कोई पुरुष भटकता हुआ कराहेगा
  rationale: यूनानी में στενάξει का कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया, यद्यपि γυνή (‘पत्नी’) के कारण पति या गृहस्थ पुरुष निहित है। ‘वह’ स्रोत की निहितता और लिंग-सूचक क्रियारूप दोनों को बनाए रखता है, पर ‘पुरुष’ जैसी अनुपस्थित संज्ञा नहीं जोड़ता।
