  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लोकोक्तिपरक समानांतरता को ‘जहाँ…वहाँ…’ से सुरक्षित रखा गया है। दूसरे खंड में निहित कर्ता की अस्पष्टता को मुख्य पाठ और पाद-टिप्पणी दोनों में बिना अनावश्यक व्याख्यात्मक विस्तार के बनाए रखा गया है।
