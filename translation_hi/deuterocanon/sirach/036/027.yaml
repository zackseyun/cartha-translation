- source_word: διαρπαγήσεται
  choice: लूट ली जाएगी
  rationale: भविष्यत् कर्मवाच्य रूप दूसरों द्वारा बलपूर्वक संपत्ति ले लिए जाने का भाव देता है; ‘लूट ली जाएगी’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: κτῆμα
