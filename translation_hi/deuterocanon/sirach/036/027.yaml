  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: hi
  text: जहाँ बाड़[a] नहीं होती, वहाँ संपत्ति लूट ली जाएगी; और जहाँ पत्नी नहीं होती, वहाँ वह भटकता हुआ कराहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेरा”; यूनानी शब्द संपत्ति के चारों ओर की रक्षक घेराबंदी या अवरोध को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का शाब्दिक क्रम है, “और जहाँ पत्नी नहीं होती, वहाँ भटकता हुआ कराहेगा”; कर्ता स्पष्ट रूप से नहीं कहा गया है, पर पति या गृहस्थ पुरुष निहित है।
    reason: source_ambiguity
