  yaml_path: translation/deuterocanon/sirach/036/012.yaml
  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: hi
  text: शत्रुओं के शासकों के सिरों को कुचल दे, जो कहते हैं, “हमारे सिवा कोई नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे अलावा कोई नहीं।” यूनानी वाक्य अपनी ही सर्वोच्चता का घमंडी दावा व्यक्त करता है। कुछ पाठकों को इसमें लगभग ईश्वरीय अहंकार की ध्वनि सुनाई दे सकती है, पर मूल पाठ में ‘परमेश्वर’ शब्द नहीं है।
    reason: शाब्दिक विकल्प और कथन की वास्तविक धर्मवैचारिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: σύντριψον
  choice: कुचल दे
  rationale: यह συντρίβω का एकवचन आज्ञार्थक रूप है और प्रबल विनाश की ठोस छवि व्यक्त करता है। प्रार्थनात्मक संबोधन में ‘कुचल दे’ स्वाभाविक और सीधा है।
- source_word: κεφαλὰς
  choice: सिर
  rationale: यूनानी में बहुवचन का ठोस शारीरिक बिंब है; इसे ‘शक्ति’ जैसे अमूर्त रूप में नरम नहीं किया गया। हिंदी में ‘उन शासकों के सिर’ से बहुवचन स्पष्ट है।
- source_word: ἀρχόντων
  choice: शासकों
  rationale: ἄρχων अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘शासक’ आधुनिक हिंदी में राजनीतिक अथवा शासकीय अधिकार को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐχθρῶν
  choice: शत्रुओं के
  rationale: संबंधकारक बहुवचन को ἀρχόντων से जोड़ते हुए ‘शत्रुओं के शासक’ किया गया है। इससे विरोधी पक्ष का अर्थ बना रहता है और किसी अनुल्लिखित जाति या राष्ट्र को नहीं जोड़ा जाता।
- source_word: λεγόντων
  choice: जो कहते हैं
  rationale: कृदंत शासकों का वर्णन करता है। हिंदी का संबंधवाचक उपवाक्य अर्थ को सहज रूप से व्यक्त करता है।
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: हमारे सिवा कोई नहीं है
  rationale: यह वाक्य घमंड से भरी अनन्य श्रेष्ठता का दावा व्यक्त करता है। यह स्वाभाविक हिंदी है और मूल में अनुपस्थित ‘परमेश्वर’ शब्द नहीं जोड़ता।
theological_decisions:
- issue: शत्रुओं के दावे का स्वरूप
  choice: दावे को ‘हमारे सिवा कोई नहीं है’ के रूप में रखा गया है—अर्थात घमंडी अनन्यता—पर उसे स्पष्ट ईश्वरीय दावा नहीं बनाया गया।
  alternative: ‘हमारे अलावा कोई नहीं’ अथवा ‘हमारे सिवा कोई परमेश्वर नहीं है।’
  rationale: यूनानी पाठ में ‘परमेश्वर’ नहीं है। कथन में लगभग ईश्वरीय स्तर का अहंकार सुनाई दे सकता है, पर अनुवाद को मूल से अधिक स्पष्ट धार्मिक दावा नहीं जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सीधी और प्रार्थनात्मक है। ‘कुचल दे’ मूल आज्ञार्थक की तीव्रता तथा ‘सिर’ की ठोस छवि बनाए रखता है। ‘उन’ जोड़ने से लंबे संबंधकारक पदबंध की हिंदी स्वाभाविक होती है, बिना नई सूचना जोड़े।
