  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: hi
  text: तेरी प्रजा पर हारून की आशीष के अनुसार[a], और पृथ्वी पर रहने वाले सभी लोग जानेंगे कि तू प्रभु है—युगों का परमेश्वर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी प्रजा के लिए हारून की आशीष के अनुसार” अथवा “तेरी प्रजा के विषय में हारून की आशीष के अनुसार।” ग्रीक पदबंध हारून द्वारा इस्राएल पर आशीष दिए जाने से संबंधित है।
    reason: lexical_alternative
  - marker: b
    text: या, “सनातन परमेश्वर।” ग्रीक में अधिक शाब्दिक रूप से “युगों का परमेश्वर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν Ἀαρὼν
  choice: हारून की आशीष के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को ‘के अनुसार’ से व्यक्त किया गया है। ‘आशीष’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक प्रसंग के लिए उपयुक्त है।
- source_word: περὶ τοῦ λαοῦ σου
  choice: तेरी प्रजा पर
  rationale: περί मूलतः ‘के विषय में/के लिए’ भी हो सकता है, पर आशीष दिए जाने के प्रसंग में हिन्दी का ‘प्रजा पर आशीष’ स्वाभाविक रूप से किसी समुदाय के ऊपर आशीष बोले जाने का भाव व्यक्त करता है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: γνώσονται
  choice: जानेंगे
  rationale: ग्रीक भविष्यकाल का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहने वाले सभी लोग
  rationale: शाब्दिक ‘पृथ्वी पर के सभी’ की अपेक्षा यह हिन्दी में स्पष्ट है, और वाक्यांश का सार्वभौमिक मानवीय संदर्भ बनाए रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर की उपाधि है; ‘प्रभु’ इसका स्थापित, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: युगों का परमेश्वर
  rationale: यह αἰώνων के बहुवचन और मूल पदबंध की कालगत व्यापकता को सुरक्षित रखता है; इसे केवल ‘सनातन परमेश्वर’ बनाकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: दिव्य उपाधि Κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दिव्य उपाधि के रूप में हिन्दी पाठकों के लिए स्वाभाविक है और यहाँ किसी विशिष्ट सांप्रदायिक अर्थ को नहीं जोड़ता।
- issue: ὁ θεὸς τῶν αἰώνων का अर्थ
  choice: युगों का परमेश्वर
  alternative: सनातन परमेश्वर
  rationale: चुना हुआ रूप ग्रीक के बहुवचन ‘युगों’ को स्पष्ट रखता है और ‘अनन्त/सनातन’ अर्थ की सम्भावना को पादटिप्पणी में देता है, जिससे मूल की अर्थगत व्यापकता बनी रहती है।
- issue: प्रत्यक्ष प्रार्थना में द्वितीय पुरुष संबोधन
  choice: तू/तेरी
  alternative: आप/आपकी
  rationale: ‘तू’ हिन्दी की बाइबिलीय और भक्तिपरक परंपरा में परमेश्वर के प्रति निकटता तथा प्रत्यक्ष संबोधन व्यक्त करता है; इसे अनादरसूचक अर्थ में नहीं लिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। स्रोत-पद स्वयं पिछले संदर्भ पर निर्भर वाक्यांश से आरम्भ होता है, इसलिए आरम्भिक खंड की अपूर्णता को कोई नया क्रियापद जोड़कर नहीं मिटाया गया। ग्रीक καί को ‘और’ के रूप में रखा गया है; ‘तब’ जोड़कर ऐसा परिणाम-संबंध नहीं बनाया गया जो मूल में स्पष्ट नहीं है।
