  rationale: यह अओरिस्ट आज्ञार्थक क्रिया सोच-समझकर पहले से तैयारी करने की सीधी आज्ञा देती है; आधुनिक हिन्दी में “तैयार कर” स्वाभाविक है।
- source_word: λόγον
  choice: अपनी बात
  rationale: λόγος यहाँ कहे जाने वाले शब्द, कथन या भाषण को सूचित कर सकता है। “अपनी बात” हिन्दी में स्वाभाविक है और यूनानी एकवचन की व्यापकता बनाए रखता है।
- source_word: οὕτως
  choice: तब
  rationale: यहाँ क्रियाविशेषण तैयारी के फल या ढंग को दर्शाता है। “तब” संक्षेप में व्यावहारिक परिणाम व्यक्त करता है; “इस प्रकार” भी सम्भव है।
- source_word: ἀκουσθήσῃ
  choice: तेरी सुनी जाएगी
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए यह मुहावरा केवल सुनाई पड़ने के बजाय किसी की बात को सुनवाई मिलने का सामाजिक अर्थ देता है।
- source_word: σύνδησον
  choice: एक सूत्र में बाँध
  rationale: मूल क्रिया का शाब्दिक अर्थ “साथ बाँधना” है। हिन्दी का यह वाक्यांश बन्धन के रूपक और विचारों को सुव्यवस्थित करने, दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: παιδείαν
  choice: शिक्षा
  rationale: ज्ञान-साहित्य में παιδεία अनुशासनात्मक गठन, प्रशिक्षण या शिक्षा को दर्शाता है। “शिक्षा” यहाँ दण्ड के अनावश्यक भाव से बचते हुए व्यापक अर्थ रखती है।
- source_word: ἀποκρίθητι
  choice: उत्तर दे
  rationale: अओरिस्ट मध्यवाच्य आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप “उत्तर दे” है।
