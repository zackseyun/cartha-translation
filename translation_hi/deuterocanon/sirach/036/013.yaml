    text: इस दुर्लभ यूनानी क्रिया का अधिक शाब्दिक अनुवाद ‘जैसा आरम्भ में था, वैसा ही उन्हें अपनी विरासत बना ले’ या ‘जैसा आरम्भ में था, वैसा ही उन्हें विरासत के रूप में आवंटित कर दे’ भी हो सकता है। इसमें उत्तराधिकार और भाग-वितरण, दोनों की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: एकत्र कर
  rationale: συνάγω के आज्ञार्थक रूप का सीधा और स्वाभाविक अनुवाद; यह बिखरे हुए लोगों को फिर साथ लाने की प्रार्थना व्यक्त करता है।
- source_word: πάσας φυλὰς Ἰακώβ
  choice: याकूब के सभी गोत्रों को
  rationale: यूनानी पदबंध का सीधा अनुवाद है। मूल में ‘याकूब’ है, इसलिए उसकी जगह ‘इस्राएल’ नहीं रखा गया।
- source_word: κατακληρονομήσεις
  choice: उन्हें उनका उत्तराधिकार बाँट दे
  rationale: यह दुर्लभ क्रिया उत्तराधिकार और भाग-वितरण की धारणा रखती है। मुख्य पाठ में यह अनुवाद प्राचीन भाग या स्थान फिर दिए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह सर्वनाम पीछे आए ‘गोत्रों’ की ओर संकेत करता है। हिन्दी वाक्य में उत्तराधिकार बाँटने की स्वाभाविक संरचना के भीतर इसे रखा गया है।
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: आरम्भ के समान
  rationale: यह प्राचीन या मूल व्यवस्था से तुलना को बनाए रखता है और यह तय नहीं करता कि संकेत सृष्टि, इस्राएल के आरम्भिक समय या भूमि के मूल बँटवारे की ओर है।
theological_decisions:
- issue: κατακληρονομήσεις में उत्तराधिकार का कर्ता और कर्म
  choice: गोत्रों को उनका उत्तराधिकार बाँटने की प्रार्थना
  alternative: उन्हें आरम्भ के समान अपनी विरासत बना ले
  rationale: यूनानी क्रिया का अधिक शाब्दिक रूप परमेश्वर द्वारा गोत्रों को विरासत में लेने का अर्थ दे सकता है, पर प्रसंग में गोत्रों को एकत्र कर उनकी प्राचीन व्यवस्था या भाग में पुनः स्थापित करने का अर्थ भी सम्भव है। मुख्य पाठ सहज अर्थ देता है और पादटिप्पणी मूल की वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर को संबोधित एकवचन आज्ञार्थक ‘कर/दे’ मूल की सीधी विनती को बनाए रखता है। ‘गोत्र’ और ‘उत्तराधिकार’ जैसे प्रचलित बाइबलीय शब्द अर्थगत सटीकता के लिए रखे गए हैं।
