base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: hi
  text: क्योंकि कौन उस कमर कसे हुए[a] डाकू पर भरोसा करेगा, जो एक नगर से दूसरे नगर तक ठोकरें खाता फिरता है? इसी तरह उस मनुष्य पर भी कौन भरोसा करेगा, जिसका कोई घोंसला[b] नहीं और जो जहाँ भी उसे शाम आ घेरे, वहीं ठहर जाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘अच्छी तरह कमर कसा हुआ’ है—अर्थात् काम के लिए तैयार या सुसज्जित; प्रसंग में हथियारबंद होने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घोंसला’ यहाँ अपने स्थायी घर या सुरक्षित विश्राम-स्थान का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: कमर-कसे
  rationale: यूनानी विशेषण का मूल अर्थ अच्छी तरह कमर कसा हुआ या काम के लिए तैयार है। यह अनुवाद हथियार होने की बात को निश्चित किए बिना तत्परता का चित्र बनाए रखता है; अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: λῃστῇ
  choice: डाकू
  rationale: यह शब्द साधारण चोर से अधिक, लूटपाट करने वाले और संभवतः हिंसक व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘डाकू’ इस भेद को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σφαλλομένῳ
  choice: ठोकरें खाता फिरता
  rationale: कृदंत में ठोकर खाने, डगमगाने या अस्थिर होकर भटकने का भाव है। यह चयन केवल ‘भटकने’ की अपेक्षा उस अस्थिरता के सजीव बिंब को सुरक्षित रखता है।
- source_word: νοσσιὰν
  choice: घोंसला
  rationale: शब्द का शाब्दिक अर्थ पक्षी का घोंसला है, जो यहाँ अपने स्थायी और सुरक्षित घर के रूपक के तौर पर आया है। ‘घर’ कहने से मूल बिंब मिट जाता।
- source_word: καταλύοντι
  choice: ठहर जाता है
  rationale: क्रिया यात्री के किसी स्थान पर टिकने या रात बिताने को व्यक्त करती है। ‘ठहर जाता है’ आधुनिक हिन्दी में सहज है और अगले संध्याकालीन वाक्यांश के साथ स्वाभाविक बैठता है।
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: जहाँ भी शाम हो जाए
  rationale: वाक्यांश का आशय उस जगह रुकना है जहाँ यात्रा करते-करते शाम पड़ जाए। यह हिन्दी प्रयोग अर्थ को स्वाभाविक रूप में देता है और संध्या से जुड़ी मूल अनिश्चितता बनाए रखता है।
- source_word: ἀνθρώπῳ
  choice: उस मनुष्य पर
  rationale: यूनानी में एकवचन पुल्लिंग और संप्रदान कारक है, जो पहले खंड की ‘भरोसा करेगा’ क्रिया से जुड़ता है। हिन्दी में ‘उस मनुष्य पर भी कौन भरोसा करेगा’ उस निहित समानांतरता को स्पष्ट करता है।
