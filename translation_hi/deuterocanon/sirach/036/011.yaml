- source_word: ἐν ὀργῇ πυρὸς
  choice: आग के प्रकोप में
  rationale: यूनानी पदबंध का निकट और स्वाभाविक रूप; यह आग और दैवी प्रकोप—दोनों की प्रबल छवि बनाए रखता है।
