  choice: भस्म हो जाए
  rationale: निष्क्रिय आज्ञार्थक प्रार्थना को बनाए रखते हुए ‘खा लिया/निगल लिया जाए’ के उपभोग या पूर्ण विनाश के भाव को आग के प्रसंग में स्वाभाविक हिन्दी देता है।
- source_word: ὁ σωζόμενος
  choice: बचा हुआ जन
  rationale: 'वर्तमान कृदन्त की मूल अस्पष्टता को यथासंभव बचाता है: इसका अर्थ बचाया जा रहा व्यक्ति भी हो सकता है, किंतु इस शत्रुतापूर्ण प्रसंग में अब तक बच निकला व्यक्ति अधिक संभावित है।'
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: जो तेरे लोगों के साथ अन्याय करते हैं
  rationale: क्रियात्मक बल और परमेश्वर के लोगों के प्रति किए जा रहे अन्याय को बिना ‘अत्याचार’ जैसा अधिक विशिष्ट अर्थ जोड़े व्यक्त करता है।
- source_word: εὕροισαν ἀπώλειαν
  choice: वे विनाश को प्राप्त हों
  rationale: ‘विनाश पाएँ’ के शाब्दिक भाव तथा यूनानी इच्छार्थक प्रार्थना—दोनों को गरिमापूर्ण, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: न्याय के लिए अभिशापात्मक प्रार्थना
  choice: 'इसे प्रत्यक्ष प्रार्थना/कामना के रूप में रखा गया है: ‘भस्म हो जाए’ और ‘विनाश को प्राप्त हों।’'
  alternative: इसे भविष्य में होने वाले न्याय की भविष्यवाणी के रूप में नरम करना।
  rationale: καταβρωθήτω और εὕροισαν दण्ड की कामना या प्रार्थना व्यक्त करते हैं; मूल पाठ के धार्मिक तनाव और कठोरता को घटाना उचित नहीं।
- issue: ὁ σωζόμενος की प्रसंगगत पहचान
  choice: ‘बचा हुआ जन’—अर्थात संभवतः शत्रुओं में से अब तक बचा हुआ व्यक्ति।
  alternative: ‘जिसका उद्धार हो रहा है’ या ‘बचाया जा रहा व्यक्ति।’
  rationale: पद स्वयं अस्पष्ट है। आसपास के न्याय-विषयक प्रसंग में शत्रु का बचा हुआ व्यक्ति अधिक स्वाभाविक है, पर शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
