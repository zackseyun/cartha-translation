  text: आग के प्रकोप में जो बच निकला है, वह भस्म हो जाए[a], और जो तेरे लोगों के साथ अन्याय करते हैं, वे विनाश को प्राप्त हों।
  philosophy: optimal-equivalence
  footnotes:
