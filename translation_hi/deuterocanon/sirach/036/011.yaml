  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली। ‘तेरे’ का प्रयोग एकवचन सम्बोधन को स्पष्ट रखता है; भाषा सहज है, पर न्याय की कठोरता और मूल की अस्पष्टता को नरम नहीं करती।
