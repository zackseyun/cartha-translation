  text: सवारी के लिए घोड़ा[a] उपहास करनेवाले मित्र के समान है; जो कोई उस पर बैठता है, उसके नीचे वह हिनहिनाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त और कुछ असामान्य है। यहाँ “सवारी के लिए” अनूदित शब्द दूसरे संदर्भों में पशुओं के मैथुन, अर्थात नर के मादा पर चढ़ने, का अर्थ भी दे सकता है; पर अगले वाक्यांश में किसी के घोड़े पर बैठने का चित्र सवारी वाला अर्थ सुझाता है।
    reason: lexical_alternative
