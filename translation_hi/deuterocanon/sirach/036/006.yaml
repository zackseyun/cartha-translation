- source_word: ἵππος
  choice: घोड़ा
  rationale: यह सामान्य और स्वाभाविक हिन्दी अर्थ है; यूनानी शब्द अपने-आप नर घोड़े की अधिक विशिष्ट पहचान अनिवार्य नहीं करता।
- source_word: εἰς ὀχείαν
  choice: चढ़ने के लिए रखा गया
  rationale: आगे किसी व्यक्ति के घोड़े पर बैठने का स्पष्ट चित्र है, इसलिए मुख्य पाठ में सवारी संबंधी अर्थ ग्रहण किया गया है। फिर भी ὀχεία का पशुओं के मैथुन या मादा पर नर के चढ़ने का अर्थ भी हो सकता है; इस वास्तविक द्विअर्थता को पाद-टिप्पणी में रखा गया है।
- source_word: ὡς φίλος μῶκος
  choice: उपहास करनेवाले मित्र के समान
  rationale: μῶκος उपहास, हँसी उड़ाने या उपहास करनेवाले व्यक्ति का बोध कराता है। यह अनुवाद मित्र से की गई तुलना को बनाए रखता है और इसे केवल ‘मूर्ख’ के अर्थ तक सीमित नहीं करता।
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: जो कोई उस पर बैठता है, उसके नीचे
  rationale: ‘जो कोई’ παντός के व्यापक और अनिर्दिष्ट अर्थ को व्यक्त करता है, जबकि ‘उस पर बैठता है’ ἐπικαθημένου का सीधा अर्थ रखता है।
- source_word: χρεμετίζει
  choice: हिनहिनाता है
  rationale: घोड़े की आवाज़ के लिए यह मानक, सहज हिन्दी क्रिया है।
