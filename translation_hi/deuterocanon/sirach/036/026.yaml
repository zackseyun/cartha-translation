  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: hi
  text: जो पुरुष पत्नी प्राप्त करता है, वह एक प्राप्ति[a] की शुरुआत करता है—उसके अनुरूप[b] सहायक और विश्राम का स्तम्भ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक संपत्ति की शुरुआत करता है” अथवा “अधिकार में लेने की शुरुआत करता है।” यूनानी में “प्राप्त करता है” और “प्राप्ति/संपत्ति” के लिए सजातीय शब्दों की शब्द-क्रीड़ा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके अनुसार”; अर्थ “उसके अनुरूप” या “उसके लिए उपयुक्त” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  choice: जो पुरुष ... अपना बनाता है
  rationale: यूनानी का वर्तमान कृदन्त सामान्य कहावत के रूप में पुल्लिंग एकवचन है। ‘अपना बनाता है’ κτάομαι के प्राप्त करने/अधिकार में लेने के भाव को व्यक्त करता है और आगे के सजातीय κτήσεως से शब्द-संबंध बनाए रखने में सहायता करता है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: गृहस्थ जीवन और सहायक के वर्णन के इस संदर्भ में γυνή का अर्थ ‘पत्नी’ है, केवल ‘स्त्री’ नहीं।
- source_word: ἐνάρχεται κτήσεως
  choice: संपत्ति का आरम्भ करता है
  rationale: यह जानबूझकर कुछ औपचारिक अनुवाद है, जो ‘आरम्भ करना’ और κτάομαι/κτῆσις की प्राप्ति-संपत्ति संबंधी शब्द-क्रीड़ा को यथासंभव बचाता है। ‘गृहस्थी बसाता है’ अधिक स्वाभाविक होता, पर मूल के ‘संपत्ति/अधिग्रहण’ भाव को चुपचाप स्पष्ट कर देता।
- source_word: βοηθὸν
  choice: सहायक
  rationale: यह संज्ञा के रूप में ‘सहायता करने वाले व्यक्ति’ को सीधे व्यक्त करता है और पद के समानाधिकरणात्मक ढाँचे को बनाए रखता है।
- source_word: κατʼ αὐτόν
  choice: जो उसके अनुरूप है
  rationale: शाब्दिक ‘उसके अनुसार’ आधुनिक हिन्दी में अस्पष्ट है। ‘उसके अनुरूप’ समानता, संगति अथवा उपयुक्तता की मूल अस्पष्टता को अत्यधिक संकीर्ण किए बिना व्यक्त करता है।
- source_word: στύλον ἀναπαύσεως
  choice: विश्राम का एक स्तम्भ
  rationale: स्थापत्य रूपक को ‘सहारा’ जैसे अमूर्त शब्द में बदलने के बजाय ‘स्तम्भ’ के रूप में रखा गया है; ἀνάπαυσις के लिए सरल और व्यापक ‘विश्राम’ चुना गया है।
theological_decisions:
- issue: कहावत के कर्ता का लिंग
  choice: जो पुरुष पत्नी को अपना बनाता है
  alternative: जो कोई पत्नी पाता है
  rationale: यूनानी अभिव्यक्ति व्याकरणतः पुल्लिंग एकवचन है और पत्नी ग्रहण करने वाले पति की बात करती है। स्पष्ट ‘पुरुष’ हिन्दी में इस लिंग-संदर्भ को सुरक्षित रखता है; लिंग-निरपेक्ष बहुवचन नहीं अपनाया गया।
- issue: पत्नी को κτῆσις कहने की तनावपूर्ण भाषा
  choice: संपत्ति का आरम्भ करता है
  alternative: गृहस्थी का आरम्भ करता है
  rationale: मूल में κτάομαι और κτῆσις का सजातीय प्रयोग है, जिसमें प्राप्ति, अधिकार और संपत्ति के अर्थ मिलते हैं। आधुनिक संवेदनशीलता के कारण इस तनाव को मिटाकर केवल ‘गृहस्थी’ कहना स्रोत को व्याख्यायित कर देता; इसलिए मूल भाव रखा और पादटिप्पणी में विकल्प बताए।
- issue: κατʼ αὐτόν का संबंधात्मक अर्थ
  choice: उसके अनुरूप
  alternative: उसके योग्य / उसके लिए उपयुक्त
  rationale: वाक्यांश में ‘अनुसार’, ‘अनुरूप’ और ‘उपयुक्त’ के बीच अर्थगत खुलापन है। ‘अनुरूप’ इस तनाव को सुरक्षित रखता है और किसी विशिष्ट वैवाहिक सिद्धान्त को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कहावत के अनुरूप संक्षिप्त और गरिमापूर्ण रखी गई है। ‘संपत्ति का आरम्भ करता है’ सामान्य हिन्दी में कुछ औपचारिक और असहज है, पर मूल यूनानी की जानबूझकर प्रयुक्त शब्द-क्रीड़ा तथा उसके अर्थगत तनाव को बनाए रखने के लिए इसे रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं और जिस पदांश को समझाते हैं, उसके तुरंत बाद लगाए गए हैं।
