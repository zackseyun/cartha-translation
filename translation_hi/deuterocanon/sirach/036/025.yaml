  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: hi
  text: यदि उसकी जीभ पर दया और नम्रता है, तो उसका पति मनुष्यों के पुत्रों के समान नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “उसका पति अन्य पुरुषों के समान नहीं है।” यूनानी में शाब्दिक रूप से “मनुष्यों के पुत्र” है; वाक्य-विन्यास कुछ असामान्य है और आशय यह प्रतीत होता है कि दयालु और नम्र वाणी वाली पत्नी का पति दूसरों से अलग माना जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: उसकी जीभ पर
  rationale: यह यूनानी बिंब को बनाए रखता है और हिन्दी में वाणी के स्वभाव के लिए समझ में आने वाला मुहावरा है।
- source_word: ἔλεος
  choice: दया
  rationale: यह करुणामय और कृपालु व्यवहार का सीधा, गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: πραΰτης
  choice: नम्रता
  rationale: यह कोमल और अहंकाररहित व्यवहार के सद्गुण को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘मृदुता’ भी संभव है।
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: उसका पति
  rationale: विवाह-संबंधी प्रसंग में ἀνήρ का स्वाभाविक अर्थ ‘पति’ है।
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: मनुष्यों के पुत्रों के समान
  rationale: यह कुछ असामान्य किंतु वास्तविक यूनानी अभिव्यक्ति और उसके पुल्लिंग कहावती रूप को सुरक्षित रखता है; अधिक मुहावरेदार अर्थ ‘अन्य पुरुषों के समान’ हो सकता है।
theological_decisions:
- issue: καθʼ υἱοὺς ἀνθρώπων में लिंग-सूचक मानववैज्ञानिक अभिव्यक्ति
  choice: मनुष्यों के पुत्रों के समान
  alternative: अन्य पुरुषों के समान
  rationale: मुख्य पाठ में यूनानी की पुल्लिंग और कहावती अभिव्यक्ति को बनाए रखा गया है, क्योंकि उसे लिंग-निरपेक्ष करने या उसके आशय को पूरी तरह स्पष्ट कर देने से मूल की असामान्यता मिट जाती। पादटिप्पणी अधिक स्वाभाविक संभावित अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल यूनानी की ‘जीभ पर’ वाली छवि तथा अंतिम वाक्यांश की वास्तविक असामान्यता को मुख्य पाठ में सुरक्षित रखा गया है; अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
