  yaml_path: translation/deuterocanon/sirach/036/007.yaml
  text: Why does one day surpass another[a], when every daylight of the year comes from the sun?
translation:
  language: hi
  text: एक दिन दूसरे दिन से बढ़कर क्यों होता है,[a] जबकि वर्ष के प्रत्येक दिन का सारा प्रकाश सूर्य से आता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक दिन दूसरे दिन से श्रेष्ठ क्यों होता है, जबकि वर्ष के प्रत्येक दिन का सारा प्रकाश सूर्य से मिलता है?”
    reason: ὑπερέχει के लिए ‘श्रेष्ठ’ एक वैकल्पिक अभिव्यक्ति है; ‘सारा प्रकाश’ πᾶν φῶς के समग्र अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: διὰ τί
  choice: क्यों
  rationale: यह पद भेद का कारण पूछने वाला सीधा प्रश्न प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: एक दिन दूसरे दिन से बढ़कर होता है
  rationale: ὑπερέχει के साथ संबंधकारक तुलनात्मक अर्थ देता है। ‘बढ़कर’ तुलना को बनाए रखता है, पर अपने-आप नैतिक या धार्मिक श्रेष्ठता नहीं जोड़ता।
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: वर्ष के हर दिन का प्रकाश
  rationale: यह रूप πᾶν के वितरणात्मक भाव और ἐνιαυτοῦ द्वारा निर्धारित वार्षिक दायरे को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀφ᾽ ἡλίου
  choice: सूर्य से आता है
  rationale: ἀπό स्रोत को सूचित करता है; ‘से आता है’ इस संबंध को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὑπερέχει का तुलनात्मक आशय
  choice: बढ़कर
  alternative: श्रेष्ठ
  rationale: पद समान सौर स्रोत के बावजूद दिनों के बीच अंतर पर ज्ञान-साहित्य की शैली में प्रश्न उठाता है। ‘बढ़कर’ वास्तविक तुलना सुरक्षित रखता है, किंतु यूनानी पाठ में स्पष्ट न किए गए नैतिक या उपासना-संबंधी मूल्यांकन को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नवाचक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मुख्य पाठ तुलनात्मक तनाव को स्पष्ट किए बिना बनाए रखता है।
