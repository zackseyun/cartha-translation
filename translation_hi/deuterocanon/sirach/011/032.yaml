base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/032.yaml
  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: hi
  text: किसी मनुष्य को परखने से पहले उसे धन्य न कहो[a], क्योंकि मनुष्य अपने अंत में धन्य कहलाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी व्यक्ति को परखने से पहले उसे सुखी घोषित न करो।” इब्रानी में “धन्य कहना” क्रिया पहले कर्तृवाच्य और फिर कर्मवाच्य रूप में दोहराई गई है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “आग की एक चिनगारी से अंगारों का ढेर बढ़ेगा, और पापी मनुष्य खून बहाने के लिए घात लगाता है।” यह इब्रानी और यूनानी पाठ-परंपराओं के बीच बड़े अंतर को दिखाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  choice: परखने से पहले
  rationale: חקר का अर्थ जाँच-पड़ताल या गहराई से मूल्यांकन करना है; नीतिवचन-सदृश प्रसंग में ‘परखना’ स्वाभाविक और संक्षिप्त है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक व्यक्तिगत मानव के लिए प्रयुक्त सामान्यवाची एकवचन है; ‘मनुष्य’ हिन्दी में स्रोत के प्रतिनिधिक प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: उसे धन्य न कहो
  rationale: אשר के पिअेल रूप का मूल्यांकनात्मक अर्थ ‘धन्य कहना’ है और यह उत्तरार्ध के निष्क्रिय रूप के साथ शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: בְּאַחֲרִיתוֹ
  choice: अपने अंत में
  rationale: אַחֲרִית अंत, अंतिम दशा या परिणाम को सूचित कर सकता है। ‘अपने अंत में’ मूल की अस्पष्टता को बनाए रखता है कि आशय जीवन का अंत है या अंतिम परिणाम।
- source_word: יְאֻשַּׁר
  choice: धन्य कहलाएगा
  rationale: यह אשר का निष्क्रिय रूप है; ‘धन्य कहलाएगा’ पहले खंड के ‘धन्य ... कहो’ से मूल की सक्रिय-निष्क्रिय प्रतिध्वनि सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם का सामान्यवाची प्रयोग
  choice: मनुष्य
  alternative: आदमी / व्यक्ति
  rationale: ‘मनुष्य’ किसी एक मानव को सामान्य रूप से दर्शाता है और हिन्दी में अनावश्यक रूप से केवल पुरुष तक अर्थ सीमित नहीं करता।
- issue: אַחֲרִיתוֹ का अर्थ
  choice: अपने अंत में
  alternative: अपने परिणाम से
  rationale: ‘अंत’ जीवन के अंतिम समय और अंतिम परिणाम—दोनों संभावनाएँ खुली रखता है; पाठ स्वयं इनमें से किसी एक को स्पष्ट रूप से निर्धारित नहीं करता।
- issue: אשר की धार्मिक-मूल्यांकनात्मक भाषा
  choice: धन्य कहना / धन्य कहलाना
  alternative: सुखी कहना / भाग्यवान मानना
  rationale: ‘धन्य’ मूल की औपचारिक प्रशंसात्मक घोषणा को बनाए रखता है, जबकि केवल सांसारिक सुख या भाग्य तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘परखना’ साधारण पाठक के लिए सहज है; ‘धन्य कहना/कहलाना’ मूल इब्रानी की पुनरावृत्ति को सुरक्षित रखता है।
