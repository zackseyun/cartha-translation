base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: hi
  text: मेरे बेटे[a], यदि तुम नहीं दौड़ोगे, तो नहीं पहुँचोगे; और यदि तुम नहीं खोजोगे, तो नहीं पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान पर यूनानी पाठ बहुत भिन्न है। उसमें एक ऐसे व्यक्ति का वर्णन है जो सुस्त है, जिसे सहायता की आवश्यकता है, जो शक्ति में कम और अत्यन्त दरिद्र है; प्रभु की दृष्टि उस पर भलाई के लिए पड़ती है और उसे उसकी दीन दशा से उठाती है। इसलिए मुख्य पाठ में इब्रानी साक्षी का अनुसरण किया गया है, जबकि यूनानी पाठ को एक महत्त्वपूर्ण वैकल्पिक पाठ-परंपरा के रूप में यहाँ दर्ज किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह בן के साथ प्रथम पुरुष एकवचन प्रत्यय वाला संबोधन है। ‘मेरे बेटे’ मूल के पुल्लिंग एकवचन रूप और ज्ञान-साहित्य की पिता-पुत्र शिक्षात्मक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תָּרוּץ
  choice: दौड़ोगे
  rationale: רוץ का मूल अर्थ ‘दौड़ना’ है। ठोस और कहावत-सरीखी छवि को बनाए रखने के लिए अधिक व्याख्यात्मक ‘प्रयत्न करोगे’ या ‘शीघ्रता करोगे’ के बजाय ‘दौड़ोगे’ चुना गया है।
- source_word: תַגִּיעַ
  choice: पहुँचोगे
  rationale: यह क्रिया पहुँचने या किसी लक्ष्य को प्राप्त करने का भाव रखती है। मूल में लक्ष्य स्पष्ट नहीं किया गया, इसलिए ‘लक्ष्य तक पहुँचोगे’ जोड़ने के बजाय व्यापक और स्वाभाविक ‘पहुँचोगे’ रखा गया है।
- source_word: תְּבַקֵּשׁ
  choice: खोजोगे
  rationale: בקש का सामान्य अर्थ ‘खोजना’ या ‘ढूँढ़ना’ है। ‘खोजोगे’ अगले खंड के ‘पाओगे’ के साथ मूल की खोजने-पाने वाली समानांतरता बनाए रखता है।
- source_word: תִמְצָא
  choice: पाओगे
  rationale: מצא का सामान्य अर्थ ‘पाना’ या ‘मिलना’ है। कर्तृवाच्य संरचना और खोज के परिणाम को स्पष्ट रखने के लिए ‘पाओगे’ स्वाभाविक हिन्दी विकल्प है।
theological_decisions:
- issue: ज्ञान-शिक्षा में लिंगसूचक पुत्र-संबोधन
  choice: मेरे बेटे
  alternative: मेरे बच्चे
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग एकवचन पुत्र-संबोधन है। ‘मेरे बेटे’ उसे तटस्थ बनाए बिना मूल के शिक्षात्मक संबंध को सुरक्षित रखता है।
- issue: भिन्न यूनानी पाठ के सामने मुख्य पाठ का आधार
  choice: उपलब्ध इब्रानी कहावत का सीधा अनुवाद, और यूनानी भिन्नता का पादटिप्पणी में उल्लेख
  alternative: दुर्बलता और परमेश्वर द्वारा उठाए जाने वाले यूनानी पाठ के अनुसार मुख्य पाठ देना
  rationale: इस स्थान पर उपलब्ध इब्रानी पाठ स्पष्ट है और मुख्य साक्षी के रूप में उसका अनुसरण किया गया है। यूनानी पाठ विषय-वस्तु में बहुत भिन्न है; इस महत्त्वपूर्ण पाठांतर को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ अंतरंग संबोधन को व्यक्त करता है और आधुनिक हिन्दी में ‘तू’ की संभावित अवमाननापूर्ण ध्वनि से बचता है। दोनों शर्तीय खंडों की समानांतर संरचना और मूल की संक्षिप्त कहावत-सरीखी लय बनाए रखी गई है।
