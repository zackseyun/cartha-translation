base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/010.yaml
  text: Do not contend where there is no cause[b][a], and do not rise up in the quarrel of the arrogant.
translation:
  language: hi
  text: जहाँ विवाद का कोई कारण न हो, वहाँ झगड़ा न करो[a]; और घमंडियों के झगड़े में उठ खड़े न हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू शब्द עַצָּבָה का ठीक भाव अनिश्चित है; इसका अर्थ “दुःख,” “परेशानी,” या “शिकायत/विवाद का कारण” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “हे बच्चे, तेरे काम बहुत-सी बातों में न लगे रहें; यदि तू उन्हें बढ़ाएगा, तो निर्दोष न ठहरेगा; यदि तू पीछा करेगा, तो पकड़ न पाएगा; और भागकर भी बच न सकेगा।” सम्भवतः यह किसी अलग हिब्रू आधार-पाठ या बड़े पाठांतर को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֵין עַצָּבָה
  choice: जहाँ विवाद का कोई कारण न हो
  rationale: בְּאֵין किसी वस्तु के अभाव की परिस्थिति बताता है। עַצָּבָה का अर्थ यहाँ अनिश्चित है—यह दुःख, परेशानी या शिकायत/विवाद के आधार की ओर संकेत कर सकता है। प्रसंग में ‘विवाद का कोई कारण’ स्वाभाविक हिन्दी में सम्भावित सम्बन्धपरक अर्थ व्यक्त करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אַל תִּתְחָר
  choice: झगड़ा न करो
  rationale: क्रिया में गरम होने, होड़ करने या विवाद में पड़ने का भाव हो सकता है। इस नीति-वचन में ‘झगड़ा न करो’ उसका व्यावहारिक आशय साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וּבְרִיב
  choice: और ... के झगड़े में
  rationale: רִיב झगड़े, विवाद या मुकदमे को सूचित कर सकता है। यहाँ ‘झगड़ा’ अन्तरव्यक्तिगत प्रसंग के अनुकूल और सहज है।
- source_word: זֵדִים
  choice: घमंडियों
  rationale: זֵדִים उद्दंड, धृष्ट या अभिमानी लोगों को दर्शाता है। ‘घमंडी’ आधुनिक हिन्दी में स्पष्ट है और नैतिक अभिलक्षण को बनाए रखता है।
- source_word: אַל תְּקוֹמֵם
  choice: उठ खड़े न हो
  rationale: קום का मूल चित्र ‘उठना/खड़ा होना’ है। यहाँ इसका आशय किसी झगड़े में पक्ष लेकर खड़े होने या उसमें शामिल होने से हो सकता है; अनुवाद हिब्रू चित्र को बनाए रखता है।
theological_decisions:
- issue: मुख्य पाठ-साक्ष्य और यूनानी समानांतर का उपयोग
  choice: उपलब्ध हिब्रू पाठ का अनुवाद मुख्य पाठ में किया गया है; बहुत भिन्न यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी पाठ को मुख्य पाठ बनाना: “हे मेरे बच्चे, तेरे काम बहुत-सी बातों में न लगे रहें...”'
  rationale: इस पद का हिब्रू साक्ष्य उपलब्ध और उच्च-विश्वास वाला है। यूनानी पाठ अत्यन्त भिन्न है और सम्भवतः अलग हिब्रू आधार-पाठ या बड़े पाठांतर को दर्शाता है; इसलिए वह हिब्रू को नियंत्रित नहीं करता, पर पाठकीय पारदर्शिता के लिए दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘झगड़ा न करो’ व्यावहारिक निषेध को स्पष्ट करता है, जबकि ‘उठ खड़े न हो’ मूल हिब्रू की देहात्मक छवि सुरक्षित रखता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न दिए गए हैं।
