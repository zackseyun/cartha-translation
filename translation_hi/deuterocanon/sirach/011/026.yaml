base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/026.yaml
  text: For it is easy in the eyes of the Lord[a], in a sudden moment, to make a poor man rich.
translation:
  language: hi
  text: क्योंकि प्रभु की दृष्टि में किसी निर्धन को एकाएक, पल भर में धनी कर देना सहज है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “क्योंकि प्रभु के सामने यह सहज है कि मृत्यु के दिन मनुष्य को उसके आचरण के अनुसार प्रतिफल दे।” यूनानी पाठ इस पद के उपलब्ध इब्रानी पाठ से बहुत भिन्न रूप प्रस्तुत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח
  choice: सहज
  rationale: בְּעֵינֵי יי और यूनानी κοῦφον के साथ इसका भाव है कि यह कार्य प्रभु के लिए कठिन नहीं है। ‘सहज’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּעֵינֵי יי
  choice: प्रभु की दृष्टि में
  rationale: यह इब्रानी मुहावरे को बनाए रखते हुए हिन्दी में स्वाभाविक है। יי को श्रद्धासूचक रीति से ‘प्रभु’ कहा गया है।
- source_word: בְּפֶתַע פִּתְאֹם
  choice: एकाएक, पल भर में
  rationale: दोहराव आकस्मिकता और अत्यल्प समय—दोनों पर बल देता है। यह रूप उस जोर को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: לְהַעֲשִׁיר
  choice: धनी कर देना
  rationale: हिफ़ील का कारणवाचक अर्थ प्रत्यक्ष रूप से व्यक्त होता है।
- source_word: דָּל
  choice: किसी निर्धन को
  rationale: एकवचन निर्धन व्यक्ति का बोध देता है। ‘किसी निर्धन’ लिंग-निरपेक्ष, स्वाभाविक और मूल के अनिश्चित व्यक्तिगत संदर्भ के अनुरूप है।
- source_word: ἐν ἡμέρᾳ τελευτῆς ἀποδοῦναι ἀνθρώπῳ κατὰ τὰς ὁδοὺς αὐτοῦ
  choice: मुख्य पाठ में ग्रहण नहीं किया
  rationale: यूनानी पाठ उपलब्ध इब्रानी से मूलतः भिन्न पाठ-रूप प्रस्तुत करता है। जीवित इब्रानी साक्ष्य को मुख्य पाठ में प्राथमिकता दी गई और यूनानी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: प्रभु
  alternative: याहवे / यहोवा
  rationale: יי ईश्वरीय नाम का श्रद्धासूचक लेखन है; ‘प्रभु’ आधुनिक हिन्दी में प्रतिष्ठित और संप्रदाय-निरपेक्ष रूप है।
- issue: इब्रानी और यूनानी के परस्पर भिन्न पाठ-रूप
  choice: मुख्य पाठ में उपलब्ध इब्रानी; पादटिप्पणी में यूनानी विकल्प
  alternative: 'मुख्य पाठ में यूनानी: ‘क्योंकि प्रभु के सामने यह सहज है कि मृत्यु के दिन मनुष्य को उसके आचरण के अनुसार प्रतिफल दे।’'
  rationale: इस पद के लिए उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य उपलब्ध है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी की वास्तविक और महत्त्वपूर्ण भिन्नता को छिपाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एकाएक, पल भर में’ मूल के तीव्र दोहरे बल को व्यक्त करता है; विराम-चिह्न हिन्दी में स्वाभाविक लय देता है।
