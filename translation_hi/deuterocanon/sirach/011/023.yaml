base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/023.yaml
  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: hi
  text: यह मत कहो, “मुझे किस बात की ज़रूरत है, और अब से कौन-सी अच्छी चीज़ें मेरी होंगी?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध हिब्रू पाठ बहुत अलग है: “वह नहीं जानता था कि आगे क्या आने वाला है; उसने उसे किसी दूसरे के लिए छोड़ दिया और मर गया,” या इसी आशय का वाक्य। यूनानी समानांतर में इसके बजाय एक चेतावनी है। इस स्थान पर हिब्रू पाठ असंगत प्रतीत होने के कारण मुख्य पाठ में यूनानी पाठ का अनुसरण किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: לֹא יָדַע / μὴ εἴπῃς
  choice: यह मत कहो
  rationale: प्राप्त हिब्रू में ‘वह नहीं जानता था’ है, पर इस स्थान का वाक्य संदर्भ से असंगत प्रतीत होता है। यूनानी समानांतर का निषेधात्मक आदेश ‘यह मत कहो’ आसपास के उपदेशात्मक संदर्भ में सुसंगत है; हिब्रू पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: Τίς ἐστίν μου χρεία
  choice: मुझे किस बात की ज़रूरत है
  rationale: χρεία का अर्थ ‘ज़रूरत’ या ‘आवश्यकता’ है। यह हिंदी अभिव्यक्ति स्वसंतुष्ट भाव वाले आलंकारिक प्रश्न को सहज और स्पष्ट रूप में व्यक्त करती है।
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: मुझे कौन-सी अच्छी चीज़ें मिलेंगी
  rationale: τὰ ἀγαθά का अर्थ अच्छी चीज़ें, संपत्ति या लाभ हो सकता है। ‘अच्छी चीज़ें’ अर्थ को केवल भौतिक संपत्ति तक सीमित किए बिना उसकी व्यापकता बनाए रखता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह समय-सूचक पदबंध का संक्षिप्त, स्वाभाविक और आधुनिक हिंदी रूप है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठों के भिन्न होने पर मूल-पाठ का निर्धारण
  choice: मुख्य पाठ में यूनानी का उपदेशात्मक वाक्य रखा गया है
  alternative: 'प्राप्त हिब्रू का लगभग शाब्दिक अर्थ: ‘वह नहीं जानता था कि आगे क्या आने वाला है; उसने उसे दूसरे के लिए छोड़ दिया और मर गया।’'
  rationale: सिराख के उपलब्ध हिब्रू को सामान्यतः प्राथमिकता दी जाती है, किंतु यहाँ उसका पाठ यूनानी और निकटवर्ती उपदेशात्मक संदर्भ से स्पष्ट रूप से असंगत जान पड़ता है। इसलिए मुख्य पाठ में सुसंगत यूनानी पाठ रखा गया है और वास्तविक पाठगत अनिश्चितता को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘अच्छी चीज़ें’ जानबूझकर व्यापक है, ताकि अर्थ को केवल धन-संपत्ति तक सीमित न किया जाए।
