  text: For the works of the Lord are wondrous[b][a], and his work is hidden from man.
translation:
  language: hi
  text: क्योंकि प्रभु के कार्य अद्भुत हैं,[a] और उसका कार्य मनुष्य से छिपा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “बहुत-से अत्याचारी भूमि पर बैठे, पर जिस व्यक्ति की किसी ने कल्पना भी नहीं की थी, उसने मुकुट पहना।” इस स्थान पर हिब्रू और यूनानी साक्षी संभवतः पाठ के अलग-अलग रूप दर्शाते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: פְלָאוֹת
  choice: अद्भुत हैं
  rationale: पלא मूल असाधारण और विस्मयकारी होने का भाव देता है; विधेय के रूप में ‘अद्भुत हैं’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַעֲשֵׂי יי
  choice: प्रभु के कार्य
  rationale: מַעֲשֵׂי बहुवचन रचना है और יי परमेश्वर के नाम का आदरसूचक लेखन है; ‘प्रभु के कार्य’ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְנֶעְלָם
  choice: समझ से परे है
  rationale: עלם का निफ़अल रूप मानव की पहुँच या बोध से छिपे होने का भाव रखता है; हिन्दी में ‘समझ से परे’ इसी अभिप्राय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאָדָם
  choice: मनुष्य की समझ से
  rationale: אָדָם यहाँ समस्त मानवजाति का प्रतिनिधित्व करने वाला एकवचन है; ‘मनुष्य’ उसके सामान्य मानवीय संदर्भ को बनाए रखता है।
- source_word: פָּעֳלוֹ
  choice: उसका किया हुआ
  rationale: एकवचन פָּעֳלוֹ को पहले आए बहुवचन מַעֲשֵׂי से अलग रखते हुए, ‘उसका किया हुआ’ परमेश्वर के कार्य या क्रियाशीलता का सामूहिक भाव देता है।
theological_decisions:
- issue: יי का अनुवाद
  choice: प्रभु
  alternative: याहवे
  rationale: हिब्रू साक्षी में परमेश्वर के नाम का आदरसूचक संक्षिप्त लेखन है। ‘प्रभु’ उसके धार्मिक प्रयोग को दर्शाता है, बिना उस लेखन को पूर्ण יהוה मानकर आवश्यकता से अधिक निश्चित किए।
- issue: מֵאָדָם में सामान्य मानव-संदर्भ
  choice: मनुष्य की समझ से
  alternative: मानवजाति से छिपा है
  rationale: एकवचन אָדָם को ‘मनुष्य’ के रूप में बनाए रखा गया है, पर वाक्य का आशय किसी एक पुरुष तक सीमित नहीं किया गया।
- issue: परमेश्वर के कार्य का मानव से छिपा होना
  choice: समझ से परे है
  alternative: मनुष्य से छिपा है
  rationale: यह पाठ परमेश्वर के कार्य की मानवीय अगम्यता व्यक्त करता है। ‘समझ से परे’ इसे ज्ञानात्मक अर्थ में स्पष्ट करता है, जबकि पादटिप्पणी-संबंधी पाठांतर के अतिरिक्त कोई निजी धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। हिब्रू के बहुवचन ‘कार्य’ और बाद के एकवचन भाव के बीच अंतर यथासंभव रखा गया है।
