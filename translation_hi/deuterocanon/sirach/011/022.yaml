  text: And at the time he says, “I have found rest,” then now he will eat from his good things.
translation:
  language: hi
  text: और जब वह कहता है, “मुझे चैन मिल गया है, और अब मैं अपनी अच्छी चीज़ों में से खाऊँगा,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ इससे बहुत भिन्न है: “प्रभु की आशीष भक्त के प्रतिफल में है, और वह शीघ्र ही उसकी आशीष को फलने-फूलने देता है।” यहाँ हिब्रू और यूनानी संभवतः अलग-अलग पाठ-रूपों को दर्शाते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת
  choice: और जब
  rationale: यह पदबंध किसी निश्चित समय या अवसर को दिखाता है। हिन्दी में ‘और जब’ हिब्रू की कालवाचक संरचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹאמַר
  choice: वह कहता है
  rationale: यहाँ अपूर्ण क्रिया व्यक्ति की उस समय की उक्ति को सजीव रूप में प्रस्तुत करती है; वर्तमानकालीन हिन्दी प्रसंग में स्वाभाविक है और हिब्रू की पक्षगत लचक बनाए रखती है।
- source_word: מָצָאתִי נַחַת
  choice: मुझे चैन मिल गया है
  rationale: מָצָאתִי उपलब्धि की पूर्णता और נַחַת स्थिर विश्राम, राहत या सहजता व्यक्त करता है। ‘चैन मिल गया है’ साधारण आधुनिक हिन्दी में इस प्राप्त अवस्था को स्पष्ट रखता है।
- source_word: וְעַתָּה אֹכַל
  choice: और अब मैं … खाऊँगा
  rationale: स्वरांकित हिब्रू में אֹכַל प्रथम पुरुष एकवचन है, इसलिए इसे उसी व्यक्ति की प्रत्यक्ष उक्ति के रूप में जारी रखा गया है। इससे व्यक्ति-परिवर्तन किए बिना मूल पाठ की व्याकरणिक रचना सुरक्षित रहती है।
- source_word: מִטּוֹבָתִי
  choice: अपनी अच्छी चीज़ों में से
  rationale: प्रथम पुरुष प्रत्यय ‘मेरी/अपनी’ वस्तुओं की ओर संकेत करता है और טוֹבָה यहाँ भौतिक अच्छी वस्तुओं, संपत्ति या समृद्धि के अर्थ में समझा जा सकता है। मुख्य पाठ अपेक्षाकृत ठोस और अनिर्णायक अभिव्यक्ति रखता है।
theological_decisions:
- issue: वक्ता की आत्मसंतुष्ट उक्ति का विस्तार
  choice: पूरे वाक्य को प्रथम पुरुष प्रत्यक्ष कथन के रूप में रखा गया है
  alternative: 'अंतिम खंड को तीसरे पुरुष के वर्णन के रूप में देना: ‘अब वह अपनी अच्छी चीज़ों में से खाएगा’'
  rationale: स्वरांकित हिब्रू אֹכַל और מִטּוֹבָתִי दोनों प्रथम पुरुष का समर्थन करते हैं। तीसरे पुरुष में बदलना व्याख्यात्मक होगा और मूल की आत्मकथित निश्चिंतता को कम कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चैन’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘अच्छी चीज़ों में से खाऊँगा’ मूल हिब्रू की ठोस भोजन-संबंधी उपमा और संपत्ति/समृद्धि की संभावित व्यापकता दोनों को बनाए रखता है।
