  yaml_path: translation/deuterocanon/sirach/011/015.yaml
  text: And the eye of the Lord looked on him for good[c][b][a], and shook him out of the dust of filth.
translation:
  language: hi
  text: और प्रभु की आँख ने उसकी भलाई के लिए उस पर दृष्टि रखी[a], और उसे दुर्गंध-भरी धूल में से झाड़कर निकाल दिया[b]।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की आँख ने उस पर कृपापूर्वक दृष्टि की।” इब्रानी पदबंध में निगाह रखने और उसका हित चाहने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दुर्गंध-भरी धूल” का अर्थ “गंदगी की धूल,” “सड़ांध-भरी धूल” या व्यापक रूप से कोई घृणित, अपमानजनक दशा भी हो सकता है; इब्रानी बिंब तीखा है, पर उसका ठीक सूक्ष्म अर्थ अनिश्चित है।
    reason: alternative_reading
  - marker: c
    text: 'इस पद का यूनानी पाठ बहुत भिन्न है: “प्रभु ने जातियों की जड़ें उखाड़ दीं और उनके स्थान पर दीन लोगों को रोप दिया।” सम्भवतः इब्रानी और यूनानी पाठ यहाँ अलग-अलग पाठ-रूपों को दर्शाते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: और प्रभु की आँख
  rationale: एकवचन ‘आँख’ की ठोस इब्रानी अभिव्यक्ति को बनाए रखा गया है; יי को श्रद्धासूचक रूप में ‘प्रभु’ किया गया है।
- source_word: צָפַתְהוּ לְטוֹב
  choice: उसकी भलाई के लिए उस पर दृष्टि रखी
  rationale: צפה में देखने और निगाह रखने दोनों का भाव है, जबकि לְטוֹב हितकारी उद्देश्य या अनुग्रहपूर्ण दृष्टि व्यक्त करता है। यह रूप उस संयुक्त भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיְנַעֲרֵהוּ
  choice: उसे ... झाड़कर निकाल दिया
  rationale: נער के झाड़ने या झटककर बाहर निकालने के सजीव बिंब को ‘उठाया’ जैसे अधिक व्याख्यात्मक रूप से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: מֵעֲפַר צַחֲנָה
  choice: दुर्गन्ध भरी धूल में से
  rationale: עפר का अर्थ ‘धूल’ है और צחנה दुर्गन्ध, सड़ाँध या गन्दगी का संकेत देता है। ‘दुर्गन्ध भरी धूल’ मूल के असामान्य और तीखे बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम के संक्षिप्त श्रद्धासूचक रूप יי का अनुवाद
  choice: प्रभु
  alternative: याहवे / यहोवा
  rationale: इस इब्रानी साक्ष्य में प्रयुक्त श्रद्धासूचक संक्षेप को हिन्दी के परिचित और गरिमापूर्ण ‘प्रभु’ से व्यक्त किया गया है; किसी विशिष्ट सम्प्रदायगत उच्चारण को आरोपित नहीं किया गया।
- issue: ईश्वरीय दृष्टि और हितकारी उद्देश्य का सम्बन्ध
  choice: प्रभु की आँख ने उसकी भलाई के लिए उस पर दृष्टि रखी
  alternative: प्रभु ने उस पर कृपादृष्टि की
  rationale: मूल में ‘आँख’, देखने/निगाह रखने की क्रिया और ‘भलाई के लिए’ अलग-अलग उपस्थित हैं। अनुवाद उन्हें बनाए रखता है और इसे केवल कृपा, सुरक्षा या पूर्वज्ञान में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘प्रभु की आँख’ और ‘झाड़कर निकाल दिया’ जैसे ठोस इब्रानी बिंब सुरक्षित रखे गए हैं। पाठांतर-सूचक [c] को पूरे वाक्य के बाद रखा गया है, जबकि शब्दार्थ-संबंधी टिप्पणियाँ सम्बद्ध पदबंधों के साथ हैं।
