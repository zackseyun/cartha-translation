base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/014.yaml
  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: hi
  text: भलाई और बुराई, जीवन और मृत्यु, निर्धनता और धन—प्रभु की ओर से हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रमुख उपलब्ध इब्रानी साक्ष्य में यहाँ एक भिन्न पंक्ति है, जो इस पद-संदर्भ से मेल नहीं खाती। यूनानी पाठ में है: “भलाई और बुराई, जीवन और मृत्यु, निर्धनता और धन—प्रभु की ओर से हैं।” इसलिए इस पद का अनुवाद अधिक स्थिर यूनानी साक्ष्य के आधार पर किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαθὰ
  choice: भलाई
  rationale: यह κακά के साथ अमूर्त और संतुलित विरोधी जोड़ी बनाता है; ‘भली वस्तुएँ’ की अपेक्षा ‘भलाई’ अधिक स्वाभाविक और सूक्तिपरक है।
- source_word: κακά
  choice: बुराई
  rationale: यूनानी शब्द की नैतिक और अनुभवगत व्यापकता को बनाए रखता है; इसे केवल ‘विपत्ति’ कहने से अर्थ अनावश्यक रूप से संकरा हो जाता।
- source_word: ζωὴ καὶ θάνατος
  choice: जीवन और मृत्यु
  rationale: मूल की स्थिर विरोधी जोड़ी का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πτωχεία καὶ πλοῦτος
  choice: निर्धनता और धन
  rationale: सामाजिक-आर्थिक विरोध को स्पष्ट रखता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक है और ‘निर्धनता’ उसके साथ संतुलित है।
- source_word: παρὰ Κυρίου
  choice: प्रभु की ओर से हैं
  rationale: παρά यहाँ स्रोत या उद्गम प्रकट करता है। यह रूप दैवी स्रोत को व्यक्त करता है, पर उसके ढंग की अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: Κυρίου
  choice: प्रभु
  rationale: इस यूनानी संदर्भ में κύριος का मानक, गरिमापूर्ण और सामान्य हिन्दी रूप।
theological_decisions:
- issue: अनुकूल और प्रतिकूल दोनों अवस्थाओं का दैवी स्रोत
  choice: पद के अनुसार भलाई और बुराई, जीवन और मृत्यु, निर्धनता और धन प्रभु की ओर से हैं।
  alternative: ‘बुराई’ को ‘विपत्ति’ या ‘दुर्दशा’ समझना, ताकि कथन केवल परिस्थितियों पर प्रभु की प्रभुता बताए और नैतिक बुराई का कर्ता न ठहराए।
  rationale: यूनानी पाठ ἀγαθὰ और κακά को स्पष्ट रूप से साथ रखकर दोनों को प्रभु से संबद्ध करता है। अनुवाद इस धर्मवैचारिक तनाव को नरम या हल नहीं करता और पाठ से आगे भी नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। समानांतर विरोधी जोड़ियों की लय बनाए रखने के लिए अनावश्यक क्रियाएँ नहीं दोहराई गईं; अंतिम खंड में ‘हैं’ पूरे वाक्य पर लागू है।
