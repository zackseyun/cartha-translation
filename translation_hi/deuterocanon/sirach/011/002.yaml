translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘मत करो/मत समझो’ सामान्य पाठक के लिए सहज निषेध है। दोनों उपवाक्यों के दृश्य-रूप संबंधी समानांतर भाव को बनाए रखते हुए शब्दशः कृत्रिम पुनरावृत्ति से बचा गया है।
