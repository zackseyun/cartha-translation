  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: hi
  text: किसी मनुष्य के बाहरी रूप के कारण उसकी प्रशंसा मत करो,[a] और किसी मनुष्य के कुरूप दिखने के कारण उससे घृणा मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “किसी पुरुष की सुन्दरता के कारण उसकी प्रशंसा मत करो, और किसी मनुष्य से उसके रूप के कारण घृणा मत करो।” पहले उपवाक्य में हिब्रू का “बाहरी रूप” व्यापक है, जबकि यूनानी उसे “सुन्दरता” तक सीमित करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: प्रशंसा मत करो
  rationale: पिएल रूप में הלל का सामान्य अर्थ ‘प्रशंसा करना’ है; यह सीधा, स्वाभाविक और यूनानी αἰνέσῃς के अनुरूप है।
- source_word: אָדָם
  choice: किसी मनुष्य
  rationale: यहाँ אָדָם समानांतर दोनों उपवाक्यों में किसी एक मानव व्यक्ति को सूचित करता है। ‘किसी मनुष्य’ हिन्दी में सामान्य मानव-संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּתָאֳרוֹ
  choice: उसकी रूप-रंग के कारण
  rationale: תֹּאַר बाहरी रूप या आकृति को सूचित करता है। ‘रूप-रंग’ प्रत्यक्ष शारीरिक दिखावट का व्यापक अर्थ देता है और यूनानी ‘सुन्दरता’ की अपेक्षा हिब्रू की व्यापकता बनाए रखता है।
- source_word: וְאַל תְּתַעֵב
  choice: घृणित मत समझो
  rationale: תעב तीव्र विकर्षण या घृणा व्यक्त करता है। ‘घृणित मत समझो’ व्यक्ति के प्रति ऐसे तिरस्कारपूर्ण मूल्यांकन को स्वाभाविक हिन्दी में व्यक्त करता है और क्रिया की तीव्रता बनाए रखता है।
- source_word: מְכוֹעָר
  choice: कुरूप
  rationale: מְכוֹעָר का सीधा अर्थ ‘कुरूप’ या ‘भद्दा’ है। ‘कुरूप’ स्पष्ट है और ‘विकृत’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: בְּמַרְאֵהוּ
  choice: उसके ... दिखने के कारण
  rationale: מַרְאֶה दृश्य रूप या दिखाई देने वाली सूरत को सूचित करता है। ‘दिखने’ से यह ठोस दृश्य अर्थ बना रहता है, जबकि पहले उपवाक्य के ‘रूप-रंग’ की अनावश्यक पुनरावृत्ति नहीं होती।
