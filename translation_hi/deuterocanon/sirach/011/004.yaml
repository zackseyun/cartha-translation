translation:
  language: hi
  text: फटे-पुराने वस्त्र का उपहास मत कर[a], और दुःख भरे दिनों में अपनी बड़ाई मत कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नष्टप्राय” या “जर्जर वस्त्र।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ: “पहनावे पर घमंड न कर, और महिमा के दिन अपने आपको ऊँचा न उठा; क्योंकि प्रभु के कार्य अद्भुत हैं, और मनुष्यों के बीच उसके कार्य छिपे हुए हैं।”'
    reason: textual_variant
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: फटे-पुराने वस्त्र वाला
  rationale: מַעֲטֶה बाहरी ओढ़ने या पहनने के वस्त्र को और אֹבֵד नष्ट होते, जर्जर या खराब दशा को सूचित करता है। हिन्दी में यह पदबंध व्यक्ति को उसके जर्जर वस्त्र से पहचानते हुए दृश्य बिंब को बनाए रखता है; केवल ‘गरीब’ कहने से वस्त्र का बिंब मिट जाता।
- source_word: אַל תְּהַתֵּל
  choice: उपहास मत कर
  rationale: यहाँ क्रिया התל का अर्थ हँसी उड़ाना या उपहास करना है। निषेधवाचक हिन्दी रूप सीधा और स्वाभाविक है।
- source_word: וְאַל תְּקַלֵּס
  choice: अपनी बड़ाई मत कर
  rationale: קלס स्तुति या बड़ाई करने का भाव रखता है। इस चेतावनी में कर्म के न दिए जाने और समानांतर उपदेश के कारण आत्म-प्रशंसा का भाव प्रसंग से ग्रहण किया गया है।
- source_word: בִּמְרִירֵי יוֹם
  choice: दुःख भरे दिनों में
  rationale: शाब्दिक भाव ‘दिन की कड़वाहटों/कड़वे दिनों में’ है। ‘दुःख भरे दिनों में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए कठिन समय का अर्थ बनाए रखता है।
theological_decisions:
- issue: जीवित हिब्रू पाठ और यूनानी समानांतर पाठ में अंतर
  choice: मुख्य पाठ में हिब्रू की दो-खंडीय चेतावनी का अनुसरण किया गया है।
  alternative: यूनानी में वस्त्र पर घमंड न करने, महिमा के दिन स्वयं को ऊँचा न उठाने, और प्रभु के अद्भुत तथा मनुष्यों के बीच छिपे कार्यों के विषय में एक अतिरिक्त कथन है।
  rationale: इस पद का हिब्रू पाठ उपलब्ध, उच्च-विश्वास वाला और सत्यापित है; इसलिए उसे मुख्य आधार बनाया गया। वास्तविक यूनानी भिन्नता को पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे खंड में क्रिया का अंतर्निहित कर्म
  choice: ‘अपनी बड़ाई’ कहकर आत्म-संदर्भ को स्पष्ट किया गया है।
  alternative: ‘बड़ाई मत कर’ या ‘प्रशंसा मत कर।’
  rationale: हिब्रू में कर्म स्पष्ट नहीं है। उपदेशात्मक समानांतरता आत्म-प्रशंसा की ओर संकेत करती है, किंतु पाठ में अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फटे-पुराने वस्त्र वाला’ हिब्रू के ठोस बाहरी-वस्त्र बिंब को बचाता है, जबकि ‘दुःख भरे दिन’ शाब्दिक ‘कड़वे दिन’ का स्वाभाविक हिन्दी रूप है।
