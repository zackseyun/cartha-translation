base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/007.yaml
  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: hi
  text: बहुत-से ऊँचे उठाए गए लोग अत्यन्त तुच्छ ठहराए गए और एक साथ नीचा किए गए; सम्मानित लोग भी किसी दूसरे के हाथ में दे दिए गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक बहुत भिन्न पाठ मिलता है: “जाँच करने से पहले दोष मत दो; पहले समझो, फिर डाँटो।” जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता देने की नीति के अनुसार मुख्य अनुवाद विद्यमान इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यहाँ परिमाणवाचक शब्द संज्ञा के रूप में प्रयुक्त है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘लोग’ जोड़ना स्वाभाविक है।
- source_word: נִשָּׂאִים
  choice: जो ऊँचे उठाए गए थे
  rationale: נשׂא का निष्क्रिय रूप यहाँ शारीरिक रूप से उठाने के बजाय पद, प्रतिष्ठा या सामाजिक ऊँचाई की ओर संकेत करता है।
- source_word: נִקְלוּ מְאֹד
  choice: बहुत अपमानित हुए
  rationale: נִקְלוּ तुच्छ समझे जाने या अनादर पाने का भाव रखता है, और מְאֹד की तीव्रता ‘बहुत’ से व्यक्त होती है।
- source_word: וְהִשְׁפִּילוּ יַחַד
  choice: और साथ ही नीचे गिरा दिए गए
  rationale: इब्रानी रूप कुछ संक्षिप्त या पाठगत रूप से कठिन है, पर प्रसंग में प्रतिष्ठा से पतन का भाव स्पष्ट है। ‘साथ ही’ יַחַד के सामूहिक अथवा समवर्ती भाव को बनाए रखता है।
- source_word: וְגַם נִכְבָּדִים
  choice: यहाँ तक कि सम्मानित लोग भी
  rationale: וְגַם का बलवर्धक भाव ‘यहाँ तक कि … भी’ से और כבד से निकले सामाजिक सम्मान का भाव ‘सम्मानित’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: נִתְּנוּ בְיָד
  choice: दूसरे के हाथ में सौंप दिए गए
  rationale: ‘हाथ में देना’ किसी अन्य के अधिकार या वश में कर दिए जाने का इब्रानी मुहावरा है। ‘दूसरे’ मूल में प्रत्यक्ष नहीं है, पर हिन्दी में संबंध स्पष्ट करता है और मुहावरे का रूप बनाए रखता है।
theological_decisions:
- issue: विद्यमान इब्रानी पाठ और उससे बहुत भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में काहाना के विद्यमान इब्रानी साक्ष्य का अनुवाद किया गया है।
  alternative: 'यूनानी पाठ के अनुसार: ‘जाँच करने से पहले दोष न लगाओ; पहले समझो, तब डाँटो।’'
  rationale: सिराख के लिए जहाँ इब्रानी पाठ उपलब्ध है, वहाँ उसे मूल साक्ष्य के रूप में प्राथमिकता दी जाती है। यूनानी पाठ यहाँ मामूली पाठांतर नहीं, बल्कि एक पर्याप्त भिन्न कथन प्रस्तुत करता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप रखा गया है। ‘ऊँचे उठाए गए’ और ‘नीचे गिरा दिए गए’ प्रतिष्ठा के उत्कर्ष और पतन की काव्यात्मक समानता बनाए रखते हैं; ‘दूसरे के हाथ में’ मूल इब्रानी मुहावरे को सहज हिन्दी में सुरक्षित रखता है।
