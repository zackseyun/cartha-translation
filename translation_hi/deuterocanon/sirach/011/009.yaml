base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/009.yaml
  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
translation:
  language: hi
  text: मेरे पुत्र[a], किसी बात को सुने बिना उत्तर मत दो, और बातचीत के बीच में मत बोलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “जिस विषय की तुम्हें आवश्यकता नहीं है, उसके बारे में झगड़ा मत करो, और पापियों के न्याय में सहभागी मत बनो।” उपलब्ध इब्रानी और यूनानी पाठ यहाँ बहुत भिन्न हैं। मुख्य पाठ विद्यमान इब्रानी साक्ष्य पर आधारित है; यूनानी को वैकल्पिक पाठ-परंपरा के रूप में दिया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे पुत्र
  rationale: इब्रानी में पुल्लिंग एकवचन संबोधन स्पष्ट है; यह पिता या शिक्षक द्वारा शिष्य को दी जाने वाली ज्ञान-शिक्षा का गरिमापूर्ण और स्वाभाविक रूप है।
- source_word: אַל תָּשִׁיב דָּבָר טֶרֶם תִּשְׁמָע
  choice: पूरी बात सुनने से पहले उत्तर मत दो
  rationale: השיב का अर्थ ‘उत्तर देना’ है और דבר यहाँ ‘बात/विषय’ हो सकता है। हिन्दी में ‘पूरी बात सुनने से पहले’ समय से पहले उत्तर देने की मनाही को स्वाभाविक ढंग से व्यक्त करता है; ‘पूरी’ संदर्भगत भाव स्पष्ट करता है, कोई नया विषय नहीं जोड़ता।
- source_word: וּבְתוֹךְ שִׂיחָה אַל תְּדַבֵּר
  choice: और बातचीत के बीच में मत बोलो
  rationale: שיחה का सीधा अर्थ बातचीत या वार्तालाप है। इब्रानी में ‘किसी दूसरे की’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया; यह वाक्य बीच में बोलने से रोकता है।
- source_word: περὶ πράγματος οὗ οὐκ ἔστιν σοι χρεία μὴ ἔριζε, καὶ ἐν κρίσει ἁμαρτωλῶν μὴ σύνεδρευε
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत भिन्न है। उच्च-विश्वसनीयता वाले विद्यमान इब्रानी साक्ष्य को मुख्य पाठ बनाया गया है और यूनानी परंपरा को पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
