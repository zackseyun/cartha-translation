base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/006.yaml
  text: Many who were oppressed sat on a throne[b][a], and one not thought of put on a turban.
translation:
  language: hi
  text: बहुत-से दबे-कुचले लोग सिंहासन पर बैठे,[a] और जिनका खयाल तक मन में नहीं आया था, उन्होंने पगड़ी बाँधी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर का पाठ भिन्न है: “बहुत-से शासक अत्यन्त अपमानित हुए, और प्रतिष्ठित लोग दूसरों के हाथों में सौंप दिए गए।” दोनों पाठ सामाजिक स्थिति के उलटफेर को व्यक्त करते हैं।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मन में नहीं आए” और फिर “पगड़ी बाँधी” है—यह उन अनपेक्षित लोगों का ठोस चित्र है जिन्हें अचानक ऊँचा पद या सम्मान मिला।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: बहुत-से दबे-कुचले लोग
  rationale: רַבִּים का स्वाभाविक अर्थ ‘बहुत-से’ है, और נִדְכָּאִים कुचले, दबाए या दीन किए गए लोगों को दर्शाता है। ‘दबे-कुचले’ आधुनिक हिन्दी में सामाजिक अपमान और उत्पीड़न—दोनों का भाव सहज रूप से व्यक्त करता है।
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: सिंहासन पर बैठे
  rationale: כִּסֵּא का सामान्य अर्थ आसन हो सकता है, पर यहाँ प्रतिष्ठा और शासन-स्थिति के उलटफेर का प्रसंग है; इसलिए ‘सिंहासन’ अधिक सटीक है।
- source_word: וּבַל עָלוּ עַל לֵב
  choice: और जिनका खयाल तक मन में नहीं आया था
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘मन पर नहीं चढ़े/आए’ है, अर्थात ऐसे लोग जिनके बारे में किसी ने सोचा या जिन्हें संभावित नहीं माना। क्रियापद बहुवचन है, इसलिए हिन्दी में बहुवचन ‘जिनका…उन्होंने’ रखा गया है।
- source_word: עָטוּ צְנִיף
  choice: उन्होंने पगड़ी बाँधी
  rationale: עָטוּ आवरण लपेटने या पहनने और צְנִיף पगड़ी अथवा गरिमापूर्ण सिर-पोश को दर्शाता है। ‘पगड़ी बाँधी’ ठोस बिंब और अचानक मिले ऊँचे पद या सम्मान—दोनों को बनाए रखता है।
theological_decisions:
- issue: कठिन दूसरे खंड में इब्रानी पाठ और भिन्न यूनानी समानांतर का संबंध
  choice: उच्च-विश्वसनीयता वाले इब्रानी पाठ को आधार बनाकर अप्रत्याशित लोगों के ऊँचे पद पर पहुँचने का ठोस बिंब रखा गया है।
  alternative: 'यूनानी पाठ के अनुसार अनुवाद किया जा सकता है: ‘बहुत-से शासक अत्यन्त अपमानित हुए, और प्रतिष्ठित लोग दूसरों के हाथों में सौंप दिए गए।’'
  rationale: यूनानी समानांतर की शब्दावली काफी भिन्न है, पर वह भी प्रतिष्ठा और स्थिति के उलटफेर की व्यापक विषयवस्तु व्यक्त करता है। उपलब्ध इब्रानी यहाँ प्राथमिक स्रोत है, इसलिए उसे यूनानी के अनुसार बदलना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दबे-कुचले’ सामाजिक निम्नता और उत्पीड़न का भाव देता है, जबकि ‘पगड़ी बाँधी’ मूल इब्रानी के सांस्कृतिक बिंब को अमूर्त व्याख्या में बदलने से बचाता है। इब्रानी के बहुवचन क्रियापदों को हिन्दी में भी बहुवचन रखा गया है।
