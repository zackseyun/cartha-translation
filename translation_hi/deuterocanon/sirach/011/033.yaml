base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/033.yaml
  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: hi
  text: मृत्यु से पहले किसी पुरुष को धन्य[a] न कहो, क्योंकि मनुष्य अपने अंत में पहचाना जाता है।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी पुरुष को सुखी/भाग्यशाली घोषित न करो।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने अंत में मनुष्य जाना जाता है” अथवा “मनुष्य का स्वरूप स्पष्ट होता है।”
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी समानांतर का पाठ बहुत भिन्न है: “कुकर्मी से सावधान रहो, क्योंकि वह बुराई की योजनाएँ बनाता है, कहीं ऐसा न हो कि वह तुम पर सदा के लिए कलंक लगा दे।” सम्भवतः यह किसी भिन्न पाठ-रूप को दर्शाता है; यहाँ मुख्य साक्षी के रूप में इब्रानी पाठ का अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: मृत्यु से पहले
  rationale: यह सीधा कालवाचक वाक्यांश है और समय से पहले किसी के जीवन का अंतिम मूल्यांकन न करने की चेतावनी को संक्षेप में बनाए रखता है।
- source_word: אַל תְּאַשֶּׁר
  choice: धन्य न कहो
  rationale: अर्थ किसी को धन्य, सुखी या भाग्यशाली घोषित करना है। ‘धन्य न कहो’ इब्रानी ज्ञान-साहित्य की मूल्यांकनात्मक भाषा को सुरक्षित रखता है।
- source_word: גָּבֶר
  choice: किसी पुरुष को
  rationale: इब्रानी संज्ञा पुल्लिंग एकवचन है। ‘किसी’ जोड़ने से निषेध आधुनिक हिन्दी में स्वाभाविक बनता है, जबकि ‘पुरुष’ मूल की व्याकरणिक विशिष्टता बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: בְּאַחֲרִיתוֹ
  choice: अपने अंत में
  rationale: אַחֲרִית जीवन के अंत या अंतिम परिणाम—दोनों की ओर संकेत कर सकता है। ‘अपने अंत में’ इस संक्षिप्तता और अर्थगत व्यापकता को बनाए रखता है।
- source_word: יִנָּכֵר
  choice: पहचाना जाता है
  rationale: क्रिया का भाव पहचाने जाने या वास्तविक स्वरूप के प्रकट होने का है। यह निष्क्रिय अर्थ को बिना अतिरिक्त व्याख्या के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन प्रतिनिधिक, सामान्य अर्थ में प्रयुक्त है। ‘मनुष्य’ हिन्दी में उस सार्वत्रिक नीतिवचनात्मक प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: इब्रानी ज्ञान-साहित्य की प्रतिनिधिक पुल्लिंग भाषा
  choice: पहले खंड में ‘पुरुष’ और दूसरे में ‘मनुष्य’
  alternative: दोनों स्थानों पर ‘व्यक्ति’ या ‘मनुष्य’
  rationale: גָּבֶר और אִישׁ के शब्दगत अंतर को यथासंभव रखते हुए नीतिवचन के सामान्य मानवीय अनुप्रयोग को स्पष्ट किया गया है।
- issue: अंतिम खंड का आशय
  choice: ‘मनुष्य अपने अंत में पहचाना जाता है’
  alternative: ‘जीवन के अंत में मनुष्य का असली स्वरूप प्रकट होता है’
  rationale: चुना गया रूप मूल की संक्षिप्तता तथा ‘अंत’ के कालगत और परिणामगत दोनों संभावित अर्थों को सुरक्षित रखता है; विस्तृत विकल्प मूल से अधिक व्याख्यात्मक है।
- issue: यूनानी समानांतर का भिन्न पाठ
  choice: मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता
  alternative: यूनानी पाठ का अनुवाद मुख्य पाठ में रखना
  rationale: प्राप्त इब्रानी पाठ उच्च विश्वास के साथ उपलब्ध है, जबकि यूनानी समानांतर अत्यंत भिन्न पाठ-रूप का साक्षी है; इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक रूप। ‘धन्य’ धार्मिक और ज्ञान-साहित्यिक ध्वनि रखता है, पर पाद-टिप्पणी में सामान्य विकल्प दिए गए हैं। वाक्य ने इब्रानी की संक्षिप्तता और ‘अंत’ की वास्तविक अस्पष्टता को बनाए रखा है।
