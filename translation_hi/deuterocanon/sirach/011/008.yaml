translation:
  language: hi
  text: जाँच-पड़ताल करने से पहले बात को मत तोड़ो-मरोड़ो; पहले परख लो, फिर फटकारो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के उत्तरार्ध का हिब्रू पाठ कठिन है। यूनानी पाठ है: “सुनने से पहले उत्तर मत दो, और बातों के बीच में मत टोको।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: जाँच-पड़ताल करने से पहले
  rationale: חקר का अर्थ खोजबीन या गहन जाँच करना है; यह रूप निषेध से पहले आवश्यक जाँच को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל תְּסַלֵּף
  choice: बात को मत तोड़ो-मरोड़ो
  rationale: סלף का मूल बिंब किसी बात को मोड़ने, विकृत करने या गलत रूप देने का है। हिन्दी मुहावरा ‘तोड़ो-मरोड़ो’ इस अर्थ को स्पष्ट रखते हुए समय से पहले दोष निकालने का व्यावहारिक संकेत भी देता है।
- source_word: בַּקֵּר לְפָנִים
  choice: पहले परख लो
  rationale: בקר यहाँ जाँचने या निरीक्षण करने का आदेश देता है और לפנים क्रम में पहले होने का भाव; ‘परख लो’ पहले पद की ‘जाँच-पड़ताल’ से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: וְאַחַר תַּזִּיף
  choice: फिर फटकारो
  rationale: दुर्बोध हिब्रू रूप को उपलब्ध हिब्रू अनुक्रम और संदर्भ के अनुसार जाँच के बाद दी जाने वाली आलोचनात्मक प्रतिक्रिया माना गया है; इसकी अनिश्चितता और यूनानी समानांतर को पादटिप्पणी में सुरक्षित रखा गया है।
