base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
translation:
  language: hi
  text: कोई कष्ट सहते-सहते धनी हो जाता है[a], और यही उसका देय प्रतिफल है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्म-संयम करते-करते,’ ‘दुःख उठाते-उठाते,’ अथवा ‘परिश्रम से।’ इब्रानी शब्द कष्ट और स्वेच्छा से स्वयं को कष्ट देने—दोनों का भाव दे सकता है; यूनानी समानांतर परिश्रम और निर्धनता की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक रूप लगभग ‘और यह उसके प्रतिफल को देय ठहराएगा’ है। उपवाक्य कठिन है; यहाँ सम्भावित अर्थ को स्वाभाविक हिन्दी में दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: यह अस्तित्वसूचक प्रयोग किसी प्रकार के व्यक्ति का परिचय देता है; हिन्दी में ‘कोई’ संक्षिप्त और स्वाभाविक है।
- source_word: מִתְעַשּׁר
  choice: धनी हो जाता है
  rationale: हितपएल कृदन्त धनवान बनने की प्रक्रिया बताता है, केवल धनी होने की स्थिति नहीं।
- source_word: מֵהִתְעַנּוֹת
  choice: कष्ट सहते-सहते
  rationale: इब्रानी पद कष्ट, दुःख अथवा स्वेच्छा से किए गए आत्म-संयम की व्यापक धारणा रखता है। यह चयन उस व्यापकता को बनाए रखता है और यूनानी समानांतर में आए परिश्रम तथा निर्धनता के भाव से भी मेल खाता है।
- source_word: וְזֶה
  choice: और यही
  rationale: संकेतवाचक पद ठीक पहले वर्णित परिणाम की ओर लौटता है।
- source_word: יְחַיֵּב שְׂכָרוֹ
  choice: वह प्रतिफल है जिसका वह अधिकारी है
  rationale: इब्रानी वाक्यांश अत्यन्त संक्षिप्त और कठिन है; क्रिया दायित्व अथवा देयता और שְׂכָרוֹ प्रतिफल या मजदूरी का भाव रखती है। चयन देय प्रतिफल का सम्भावित अर्थ स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: धन, कष्ट और प्रतिफल के बीच सम्बन्ध
  choice: 'पद को एक ज्ञानोक्तिपरक अवलोकन के रूप में रखा गया है: कोई व्यक्ति कष्ट के बीच धनी होता है और यह उसका उचित प्रतिफल बताया जाता है।'
  alternative: कोई आत्म-संयम से धनी होता है, और यही उसका निर्धारित प्रतिफल है; अथवा कोई परिश्रम से धनी होता है, और यही उसकी मजदूरी है।
  rationale: कठिन इब्रानी उपवाक्य को पुण्य-कर्म से अर्जित धार्मिक योग्यता का स्पष्ट सिद्धान्त नहीं बनाया गया। ‘अधिकारी’ देय प्रतिफल का भाव व्यक्त करता है, जबकि पादटिप्पणी पाठ की अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कष्ट सहते-सहते’ मूल की व्यापकता को बनाए रखता है, जबकि कठिन अंतिम उपवाक्य का सहज अर्थ मुख्य पाठ में और उसकी अनिश्चितता पादटिप्पणी में दी गई है।
