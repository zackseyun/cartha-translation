  text: Good and evil[a], life and death[c][b], poverty and wealth—they are from him.
translation:
  language: hi
  text: भलाई और बुराई[a], जीवन और मृत्यु[b], गरीबी और धन—ये उससे[c] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुराई’ के लिए ‘विपत्ति’ या ‘अनिष्ट’ भी संभव है; हिब्रू רַע नैतिक बुराई के साथ-साथ दुःखद परिस्थिति या हानि का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीटे में सुरक्षित यूनानी पाठ इस हिब्रू पाठ से बहुत भिन्न है: “प्रभु का दान भक्तों के लिए बना रहता है, और उसकी कृपा सदा फलवती होगी।” दोनों पाठ-साक्ष्य यहाँ निकटता से मेल नहीं खाते।'
    reason: textual_variant
  - marker: c
    text: हिब्रू में शब्दशः अर्थ ‘उससे’ है। प्रसंग में संकेत संभवतः परमेश्वर की ओर है, पर इस पंक्ति में ईश्वरीय नाम नहीं आया है।
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: भलाई
  rationale: यह शब्द अपने व्यापक अर्थ में प्रयुक्त है और רַע के साथ विरोधी युग्म बनाता है; ‘भलाई’ इसे केवल समृद्धि तक सीमित नहीं करती।
- source_word: וְרַע
  choice: और बुराई
  rationale: रַע का व्यापक अर्थ ‘बुराई’ है, यद्यपि यह विपत्ति या अनिष्ट भी दर्शा सकता है; मुख्य पाठ में व्यापक अर्थ और टिप्पणी में संभावित अर्थ-छाया सुरक्षित रखी गई है।
- source_word: חַיִּים
  choice: जीवन
  rationale: जीवन–मृत्यु के परिचित विरोधी युग्म में यह स्वाभाविक हिन्दी रूप है।
- source_word: וָמָוֶת
  choice: और मृत्यु
  rationale: यह חַיִּים का सीधा विरोधी है और मूल पाठ का स्पष्ट अर्थ बनाए रखता है।
- source_word: רֵישׁ
  choice: गरीबी
  rationale: यह अभाव या निर्धनता का बोध कराता है; ‘धन’ के साथ ‘गरीबी’ आधुनिक हिन्दी में स्वाभाविक विरोधी युग्म है।
- source_word: וְעֹשֶׁר
  choice: और धन
  rationale: यह संपन्नता या धन-दौलत को सूचित करता है; संक्षिप्त ‘धन’ मूल की युग्मात्मक शैली के अनुकूल है।
- source_word: מֵיי הוּא
  choice: ये उसी से हैं
  rationale: हिब्रू में स्पष्ट ईश्वरीय नाम के बजाय तीसरे पुरुष का सर्वनाम है। ‘उसी से’ संभावित दैवी संदर्भ को बनाए रखता है, पर ‘परमेश्वर’ या ‘प्रभु’ जोड़कर अस्पष्टता समाप्त नहीं करता।
theological_decisions:
- issue: अंतिम सर्वनाम का संदर्भ
  choice: उसी से
  alternative: प्रभु से / परमेश्वर से
  rationale: प्रसंग में संकेत संभवतः परमेश्वर की ओर है, किंतु उपलब्ध हिब्रू पंक्ति में ईश्वरीय नाम नहीं है। इसलिए मुख्य पाठ में सर्वनाम सुरक्षित रखा गया है।
- issue: दैवी स्रोत के संबंध में רַע का अर्थ-क्षेत्र
  choice: बुराई
  alternative: विपत्ति / अनिष्ट
  rationale: हिब्रू शब्द नैतिक बुराई के साथ-साथ विपत्ति या अनिष्ट भी व्यक्त कर सकता है। व्यापक ‘बुराई’ मूल की धार्मिक और अर्थगत तनातनी को सुरक्षित रखती है; वैकल्पिक अर्थ टिप्पणी में दिए गए हैं।
- issue: हिब्रू और यूनानी साक्ष्यों का अंतर
  choice: हिब्रू पाठ को मुख्य पाठ का आधार बनाया गया
  alternative: 'यूनानी समानांतर: प्रभु का दान भक्तों के पास बना रहता है, और उसकी कृपा सदा सफल होगी'
  rationale: दिया गया हिब्रू साक्ष्य उच्च विश्वास-स्तर वाला है और इस पद के यूनानी पाठ से बहुत अलग है। मूल-भाषा प्राथमिकता के अनुसार हिब्रू का अनुवाद किया गया तथा पाठांतर टिप्पणी में दर्ज किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और युग्मात्मक शैली रखी गई है। ‘भलाई–बुराई’, ‘जीवन–मृत्यु’ और ‘गरीबी–धन’ मूल हिब्रू के विरोधी युग्मों को स्वाभाविक हिन्दी में प्रस्तुत करते हैं।
