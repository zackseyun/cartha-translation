- source_word: דְּבֹרָה
  choice: मधुमक्खी
  rationale: इस सामान्य जीव का सीधा और स्वाभाविक हिन्दी नाम।
- source_word: וְרֹאשׁ
  choice: पर ... श्रेष्ठ
  rationale: רֹאשׁ यहाँ प्रथम या प्रधान होने का भाव देता है। दोनों पंक्तियों का विरोधाभास हिन्दी में ‘पर’ से स्पष्ट होता है, जबकि ‘श्रेष्ठ’ गुणवत्ता या स्थान की प्रधानता बनाए रखता है।
- source_word: תְּנוּבוֹת
  choice: सब उपजों में
  rationale: תְּנוּבוֹת का मूल अर्थ उपज या पैदावार है। ‘सब’ हिन्दी में ‘उपजों में प्रधान’ के सर्वोच्च तुलनात्मक भाव को स्वाभाविक बनाता है, बिना यूनानी के ‘मीठी वस्तुएँ’ को मुख्य पाठ में जोड़ने के।
- source_word: פּרִיָהּ
  choice: उसका फल
  rationale: हिब्रू का शाब्दिक रूपक सुरक्षित रखा गया है; सन्दर्भ में यह मधु की ओर संकेत करता है।
