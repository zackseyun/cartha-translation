  text: The bee is small among flying creatures[a], but the first of sweet produce is its fruit.
translation:
  language: hi
  text: उड़ने वाले जीवों में मधुमक्खी छोटी है,[a] पर उसका फल उपजों में प्रधान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पक्षियों में मधुमक्खी छोटी है, और उसका फल मीठी वस्तुओं में प्रधान है।” हिब्रू में “उपजें” है, जबकि यूनानी समानांतर पाठ “मीठी वस्तुएँ” कहता है।
    reason: עוף के व्यापक या संकुचित अर्थ तथा हिब्रू תנובות और यूनानी γλυκασμάτων के पाठगत-सार्थक अंतर को सुरक्षित रखना।
lexical_decisions:
