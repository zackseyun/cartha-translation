translation:
  language: hi
  text: निर्धन की बुद्धि उसका सिर ऊँचा करती है[a] और उसे कुलीनों के बीच बैठाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दीन” अथवा “नम्र”; इब्रानी में “निर्धन” है, जबकि यूनानी समानांतर अधिक व्यापक रूप से निम्न सामाजिक स्थिति का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת דַּל
  choice: निर्धन की बुद्धि
  rationale: रचना-संबंध को स्पष्ट रखते हुए דַּל का प्राथमिक आर्थिक-सामाजिक अर्थ ‘निर्धन’ लिया गया है।
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: उसका सिर ऊँचा करती है
  rationale: यह स्रोत का सजीव मुहावरा और सम्मान अथवा सामाजिक प्रतिष्ठा बढ़ने का भाव दोनों सुरक्षित रखता है; यूनानी समानांतर भी इसी बिंब की पुष्टि करता है।
- source_word: וּבֵין נְדִיבִים
  choice: कुलीनों के बीच
  rationale: बहुवचन के साथ ‘के बीच’ स्वाभाविक है, और यहाँ נְדִיבִים सामाजिक रूप से प्रतिष्ठित लोगों को सूचित करता है।
- source_word: תּוֹשִׁיבֶנּוּ
  choice: उसे ... बैठाती है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित है और प्रतिष्ठित जनों के साथ स्थान मिलने का सामाजिक-सम्मान बिंब बना रहता है।
theological_decisions:
- issue: דַּל को मुख्यतः आर्थिक निर्धनता के अर्थ में लें या व्यापक दीनता/नम्रता के अर्थ में
  choice: निर्धन
  alternative: दीन; नम्र
  rationale: प्राथमिक इब्रानी साक्ष्य ठोस आर्थिक-सामाजिक अर्थ का समर्थन करता है, जबकि यूनानी समानांतर व्यापक निम्न स्थिति या दीनता का संकेत दे सकता है। इसलिए मुख्य पाठ में ‘निर्धन’ और विकल्प पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-बिंब के निकट भाषा। ‘सिर ऊँचा करती है’ सामान्य पाठक के लिए स्वाभाविक है और सम्मान बढ़ने का आशय व्यक्त करता है।
