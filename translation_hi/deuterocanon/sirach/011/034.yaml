base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/034.yaml
  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: hi
  text: बहुतों को अपने घर से बाहर रखो[a], और हर आदमी को अपने घर में न लाओ, क्योंकि घात लगाने वाले बहुत हैं[b], और छल करने वाले भी बहुत हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ मुख्य पाठ इब्रानी साक्ष्य पर आधारित है। यूनानी समानांतर का भाव है: “किसी पराए को अपने यहाँ ठहराओ, और वह तुम्हें उथल-पुथल में डाल देगा और जो तुम्हारा है उससे तुम्हें अलग कर देगा।” संभवतः यह चेतावनी के किसी भिन्न पाठ-रूप या विस्तृत रूप को दर्शाता है।'
    reason: alternative_reading
  - marker: b
    text: उद्धृत संस्करण में इस पद के कुछ इब्रानी शब्द कोष्ठकों में हैं, जो उपलब्ध हस्तलिखित पाठ की पुनर्रचना या अनिश्चितता का संकेत देते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: बहुतों को अपने घर से बाहर रखो
  rationale: मְנַע का निषेधात्मक/रोकने वाला भाव और מִתּוֹךְ בֵּיתֶךָ का घर के भीतर से बाहर रखने का स्थानिक संकेत स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: और हर पुरुष को घर के भीतर न लाओ
  rationale: यह अंधाधुंध किसी को घर में प्रवेश देने के विरुद्ध चेतावनी है। אִישׁ के पुल्लिंग एकवचन को ‘पुरुष’ से व्यक्त किया गया है।
- source_word: אוֹרְבִים
  choice: घात लगानेवाले
  rationale: यह शब्द छिपकर हानि पहुँचाने की ताक में रहनेवालों का सहभागी और चित्रात्मक भाव रखता है।
- source_word: וְכֵן נוֹכְלִים רַבִּים הֵם
  choice: और छल करनेवाले भी बहुत हैं
  rationale: נוֹכְלִים के कपटपूर्ण व्यवहार को ‘छल करनेवाले’ व्यक्त करता है और וְכֵן का समानांतर जोड़ ‘भी’ से स्वाभाविक रूप में आता है।
