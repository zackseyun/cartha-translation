lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: अस्तित्वसूचक आरंभ एक सामान्य प्रकार के व्यक्ति का परिचय देता है; ‘कोई’ लिंग को अनावश्यक रूप से निर्दिष्ट किए बिना स्वाभाविक हिन्दी है।
- source_word: עָמֵל
  choice: कड़ी मेहनत करता
  rationale: यह कठिन और श्रमसाध्य काम करने का भाव व्यक्त करता है तथा साधारण आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וְיָגֵעַ
  choice: थककर परिश्रम करता
  rationale: निकटार्थक दूसरे पद की तीव्रता और थका देने वाले श्रम का भाव बनाए रखता है।
- source_word: וָרָץ
  choice: दौड़-धूप करता है
  rationale: शाब्दिक अर्थ ‘दौड़ता है’ है; ज्ञान-साहित्य के इस संदर्भ में ‘दौड़-धूप’ व्यस्त और हड़बड़ी भरे प्रयास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּכְדֵי כֵן
  choice: फिर भी उतना ही
  rationale: कठिन हिब्रू मुहावरे में परिणाम की मात्रा और विडंबनापूर्ण विरोध दोनों संभव हैं; यह चयन उस तनाव को संक्षेप में रखता है।
- source_word: הוּא מִתְאַחֵר
  choice: पीछे रह जाता है
  rationale: हित्पाएल रूप विलंबित होने या पिछड़ने का अर्थ देता है; यह हिन्दी में स्वाभाविक है और प्रयास तथा प्रगति के बीच विरोध को बनाए रखता है।
