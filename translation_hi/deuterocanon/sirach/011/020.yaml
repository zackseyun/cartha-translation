base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/020.yaml
  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: hi
  text: धर्मी का दान उन लोगों के लिए बना रहेगा जो उससे डरते हैं, और उसकी इच्छा सदा सफल होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ बहुत भिन्न है: “अपनी वाचा में दृढ़ बने रहो और उसी में लगे रहो, और अपने काम में बूढ़े हो जाओ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מַתַּן צַדִּיק
  choice: धर्मी का दान
  rationale: מַתַּן का सामान्य अर्थ ‘दान’ या ‘भेंट’ है और צַדִּיק संबंधसूचक रूप में दान देनेवाले धर्मी व्यक्ति को दर्शाता है। यह उपलब्ध इब्रानी पाठ का सीधा और स्वाभाविक अनुवाद है।
- source_word: יַעֲמֹד
  choice: बना रहेगा
  rationale: शाब्दिक अर्थ ‘खड़ा रहेगा’ है; यहाँ स्थायित्व और टिके रहने का भाव है, जिसे आधुनिक हिन्दी में ‘बना रहेगा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִירֵאָיו
  choice: उन लोगों के लिए ... जो उससे डरते हैं
  rationale: לְ लाभार्थी संबंध दर्शाता है और ירא के कृदंत बहुवचन के साथ एकवचन प्रत्यय का अर्थ ‘उससे डरनेवाले’ है। ‘डरते हैं’ भय/श्रद्धा के मूल तनाव को ‘आदर करते हैं’ कहकर समाप्त नहीं करता।
- source_word: רְצוֹנוֹ
  choice: उसकी कृपा
  rationale: רָצוֹן का अर्थ इच्छा, प्रसन्नता, अनुग्रह या कृपादृष्टि हो सकता है। इस प्रसंग में ‘कृपा’ स्वाभाविक है, पर प्रत्यय किस व्यक्ति की ओर संकेत करता है, यह पाठ की तरह खुला रहता है।
- source_word: יִצְלַח לָעַד
  choice: सदा फलती-फूलती रहेगी
  rationale: צלח सफलता, उन्नति या समृद्धि को व्यक्त करता है और לָעַד स्थायी अवधि को। ‘फलती-फूलती रहेगी’ हिन्दी में निरंतर सफल होने का जीवंत भाव देता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में गंभीर भिन्नता
  choice: मुख्य पाठ उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य का अनुवाद करता है।
  alternative: 'यूनानी पाठ: ‘अपनी वाचा पर दृढ़ रहो और उसी में लगे रहो, और अपने काम में बूढ़े हो जाओ।’'
  rationale: प्रदत्त मूल-भाषा स्रोत में इब्रानी पाठ पूर्ण और विश्वसनीय बताया गया है; इसलिए उसे मुख्य पाठ में प्राथमिकता दी गई है। असंबद्ध यूनानी पाठ को महत्त्वपूर्ण वैकल्पिक साक्ष्य के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘उससे/उसकी’ का संदर्भ
  choice: एकवचन सर्वनामों को स्पष्ट किए बिना बनाए रखा गया है।
  alternative: उन्हें निश्चित रूप से या तो धर्मी व्यक्ति या परमेश्वर की ओर संकेत करनेवाला मानना।
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन हैं, पर उनका संदर्भ पूरी तरह निर्विवाद नहीं है। अनुवाद इस संभावित अस्पष्टता को धर्मवैज्ञानिक व्याख्या से नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धर्मी’, ‘दान’ और ‘कृपा’ परिचित बाइबलीय शब्द हैं; वाक्यरचना सरल है।
