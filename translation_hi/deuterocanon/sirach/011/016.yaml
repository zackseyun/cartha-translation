  text: He lifted him up and exalted him[b][a], and many were astonished at him.
translation:
  language: hi
  text: उसने उसे ऊँचा उठाया[a] और प्रतिष्ठित किया; और बहुत-से लोग उसे देखकर चकित रह गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप लगभग ‘उसने उसे उसके सिर पर उठाया’ है। संभवतः आशय उसे सबसे ऊँचे स्थान या पद तक उठाने से है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के लिए दिया गया यूनानी समानांतर यहाँ के इब्रानी वाक्य से मेल नहीं खाता; इसलिए अनुवाद उपलब्ध इब्रानी पाठ के अनुसार किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא
  choice: ऊँचा उठाया
  rationale: नָשָׂא का मूल अर्थ ‘उठाना’ या ‘ऊपर ले जाना’ है। यहाँ अगली समानांतर क्रिया के साथ यह किसी को ऊँचा स्थान या पद दिए जाने का भाव व्यक्त करता है।
- source_word: בְּרֹאשׁוֹ
  choice: ऊँचा
  rationale: इब्रानी पदबंध का शाब्दिक रूप ‘उसके सिर पर/में’ है, पर इस संदर्भ में संभवतः सर्वोच्च स्थान या पद तक उठाए जाने का मुहावरेदार भाव है। स्वाभाविक हिन्दी के लिए ‘ऊँचा’ रखा गया और शाब्दिक कठिनाई को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וַיְרֹמְמֵהוּ
  choice: और प्रतिष्ठित किया
  rationale: रומם का अर्थ ऊँचा करना या महिमा/प्रतिष्ठा देना है। ‘प्रतिष्ठित किया’ पहली क्रिया की केवल पुनरावृत्ति किए बिना सामाजिक या पदगत उन्नति का समानांतर भाव रखता है।
- source_word: וַיִּתְמְהוּ
  choice: चकित रह गए
  rationale: תמה प्रबल आश्चर्य या विस्मय को दर्शाता है। आधुनिक हिन्दी में ‘चकित रह गए’ इस प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָלָיו
  choice: उसे देखकर
  rationale: आश्चर्य की क्रिया के साथ עַל उस व्यक्ति को बताता है जो आश्चर्य का कारण है। हिन्दी में ‘उसे देखकर’ ‘उस पर’ की अपेक्षा अधिक स्वाभाविक है, पर कारण को अनावश्यक रूप से नहीं समझाता।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: रַבִּים का सीधा अर्थ ‘बहुत-से’ है; हिन्दी में मानव समूह स्पष्ट करने के लिए ‘लोग’ जोड़ा गया है।
theological_decisions:
- issue: इब्रानी में कर्ता और कर्म का स्पष्ट नाम नहीं दिया गया है
  choice: ‘उसने’ और ‘उसे’ के द्वारा दोनों को अनिर्दिष्ट रखा गया
  alternative: कर्ता को ‘परमेश्वर/प्रभु’ अथवा किसी शासक के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ में पुल्लिंग एकवचन क्रियाएँ और सर्वनाम-सूचक प्रत्यय हैं, पर कोई नामित कर्ता नहीं है। किसी विशेष धार्मिक पहचान को जोड़ने के बजाय मूल की खुली संदर्भ-संभावना सुरक्षित रखी गई है।
- issue: प्रतिष्ठा की प्रकृति
  choice: ‘प्रतिष्ठित किया’ के द्वारा पद या सम्मान में उन्नति का व्यापक भाव रखा गया
  alternative: ‘महिमा दी’ या ‘सर्वोच्च पद दिया’
  rationale: ‘महिमा दी’ धार्मिक अर्थ को अधिक निश्चित कर सकती है, जबकि ‘सर्वोच्च पद दिया’ कठिन इब्रानी पदबंध की केवल एक व्याख्या को मुख्य पाठ में निर्णायक बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊँचा उठाया’ और ‘प्रतिष्ठित किया’ काव्यात्मक समानांतरता बनाए रखते हैं। सर्वनामों को जानबूझकर अनिर्दिष्ट रखा गया है, और पाठ-संबंधी असंगति पादटिप्पणी में बताई गई है।
