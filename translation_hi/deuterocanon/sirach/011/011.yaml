  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: hi
  text: कोई ऐसा व्यक्ति है[a] जो मेहनत करता, कठिन परिश्रम करता और जल्दबाज़ी करता है, फिर भी वह उतना ही अधिक पिछड़ जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध काहिरा गनीज़ा की इब्रानी पंक्ति इस पद के यूनानी समानांतर पाठ से मेल नहीं खाती; इसलिए मुख्य अनुवाद यहाँ यूनानी साक्ष्य का अनुसरण करता है। दिए गए इब्रानी का लगभग अर्थ है: “मेरे पुत्र, तू अपना अत्याचार क्यों बढ़ाता है? ... वह दण्ड से न बचेगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: कोई ऐसा व्यक्ति है
  rationale: यह अस्तित्वसूचक प्रयोग एक प्रकार के व्यक्ति का परिचय देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κοπιῶν
  choice: मेहनत करता
  rationale: यह श्रमसाध्य काम का भाव व्यक्त करता है और अगले प्रयाससूचक शब्द से अलग रखा गया है।
- source_word: πονῶν
  choice: कठिन परिश्रम करता
  rationale: यह कष्टपूर्ण अथवा थका देने वाले प्रयास को उभारता है और मूल में प्रयाससूचक शब्दों के संचय को बनाए रखता है।
- source_word: σπεύδων
  choice: जल्दी मचाता है
  rationale: संदर्भ में यह तत्परता से अधिक जल्दबाज़ी या हड़बड़ी का चित्र प्रस्तुत करता है।
- source_word: τόσῳ μᾶλλον
  choice: उतना ही अधिक
  rationale: 'यह विडंबनापूर्ण वृद्धि को सुरक्षित रखता है: प्रयास बढ़ने के साथ कमी भी बढ़ती है।'
- source_word: ὑστερεῖται
  choice: पीछे रह जाता है
  rationale: यह अभाव या लक्ष्य से चूकने के भाव को बिना आर्थिक अथवा सामाजिक अर्थ निश्चित किए स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पंक्ति और इस पद के यूनानी समानांतर पाठ में असंगति
  choice: मुख्य पाठ में इस पद से संगत यूनानी साक्ष्य का अनुवाद किया गया है और इब्रानी असंगति को पादटिप्पणी में बताया गया है।
  alternative: 'दिए गए इब्रानी का लगभग शाब्दिक अनुवाद: “मेरे पुत्र, तू अपना अत्याचार क्यों बढ़ाता है? ... वह निर्दोष न ठहरेगा।”'
  rationale: दिया गया इब्रानी पाठ इस पद के यूनानी पाठ से मेल नहीं खाता और संभवतः किसी दूसरे संदर्भ की पंक्ति है। इसलिए संगत यूनानी साक्ष्य को मुख्य पाठ में रखते हुए पाठगत अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। मूल यूनानी में लगातार आए तीन प्रयाससूचक कृदंतों को अलग-अलग हिन्दी क्रियाओं से व्यक्त किया गया है।
