  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
translation:
  language: hi
  text: मूर्खता और अंधकार अपराधियों के लिए सुरक्षित रखे गए हैं[a], और बुराई करनेवालों के साथ बुराई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “जब वह कहता है, ‘मुझे विश्राम मिल गया है, और अब मैं अपनी संपत्ति में से खाऊँगा,’ तब वह नहीं जानता कि कौन-सा समय बीत जाएगा; फिर वह उन्हें दूसरों के लिए छोड़ देगा और मर जाएगा।” यहाँ इब्रानी साक्ष्य यूनानी पाठ-परंपरा से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂכְלוּת
  choice: मूर्खता
  rationale: यह संज्ञा मूर्खता या विवेकहीन अवस्था/आचरण को दर्शाती है; ‘मूर्खता’ आधुनिक हिन्दी में सहज है और ज्ञान-साहित्य का नैतिक भार बनाए रखती है।
- source_word: וְחֹשֶׁךְ
  choice: और अंधकार
  rationale: यह मूल रूपक को बिना नैतिक या विपत्तिजनक अर्थ को आवश्यकता से अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: לְפוֹשְׁעִים
  choice: अपराधियों के लिए
  rationale: פשע जानबूझकर किए गए उल्लंघन या विद्रोह का बोध देता है; ‘अपराधियों’ से उल्लंघन का भाव स्वाभाविक हिन्दी में व्यक्त होता है, यद्यपि ‘विद्रोहियों’ भी संभव है।
- source_word: נוֹצְרָה
  choice: संचित हैं
  rationale: निष्क्रिय रूप किसी वस्तु के किसी के लिए रखे या बचाकर रखे जाने का संकेत देता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन ‘हैं’ स्वाभाविक है।
- source_word: וּמְרֵעִים
  choice: और बुराई करनेवालों
  rationale: कृदन्त की क्रियात्मक शक्ति को स्पष्ट रखते हुए यह सामान्य पाठक के लिए ‘कुकर्मियों’ की अपेक्षा अधिक पारदर्शी है।
- source_word: רָעָה
  choice: बुराई
  rationale: शब्द नैतिक बुराई, हानि या विपत्ति का अर्थ दे सकता है। ‘बुराई’ מְרֵעִים के साथ शब्दगत पुनरावृत्ति बनाए रखती है और अस्पष्टता को पूरी तरह समाप्त नहीं करती।
- source_word: עִמָּם
  choice: उनके साथ रहती है
  rationale: עם का सामान्य अर्थ ‘साथ’ है। हिन्दी में ‘रहती है’ जोड़ने से संक्षिप्त इब्रानी कथन स्वाभाविक बनता है और यह भाव बना रहता है कि बुराई उनका साथ नहीं छोड़ती।
theological_decisions:
- issue: काहिरा गनीज़ा के इब्रानी पाठ और यूनानी समानांतर पाठ में तीखा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है और यूनानी पाठ को पादटिप्पणी में दिया गया है।
  alternative: 'यूनानी परंपरा का अनुवाद मुख्य पाठ बनाया जाए: “जब वह कहता है, ‘मुझे विश्राम मिल गया है, और अब मैं अपनी अच्छी वस्तुओं में से खाऊँगा,’ तब वह नहीं जानता कि कितना समय बीतेगा; फिर वह उन्हें दूसरों के लिए छोड़कर मर जाएगा।”'
  rationale: इस पद के लिए इब्रानी साक्ष्य उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। अत्यंत भिन्न यूनानी पाठ को छिपाने के बजाय पाठांतर के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। इब्रानी की संक्षिप्त समानांतर रचना तथा ‘बुराई करनेवालों/बुराई’ की शब्दगत पुनरावृत्ति को यथासंभव बनाए रखा गया है।
