  text: My son[a], stand by your appointed lot and walk in it[b], and grow old in your work.
translation:
  language: hi
  text: मेरे बेटे[a], अपनी नियत राह पर स्थिर रह और उसी पर चलता रह[b], और अपने काम में बूढ़ा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में है: “यह मत कह, ‘मैं आत्मनिर्भर हूँ; अब से मुझ पर कौन-सी विपत्ति आएगी?’” यहाँ उपलब्ध हिब्रू पाठ यूनानी परंपरा से बहुत भिन्न है।'
    reason: alternative_reading
  - marker: b
    text: हिब्रू शब्द בְּחֻקֶּךָ कठिन है। इसका अर्थ लगभग “तेरा निर्धारित भाग,” “तेरा नियत क्षेत्र,” या “तेरी विधि अथवा राह” हो सकता है।
