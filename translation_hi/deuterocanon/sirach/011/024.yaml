lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: पुल्लिंग एकवचन संबोधन को सुरक्षित रखते हुए पिता-सदृश ज्ञान-उपदेश का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲמוֹד
  choice: स्थिर रह
  rationale: आज्ञार्थक क्रिया का आशय केवल खड़े होने से अधिक, अपने स्थान या दायित्व में दृढ़ बने रहने का है।
- source_word: בְּחֻקֶּךָ
  choice: अपने निर्धारित भाग में
  rationale: दुर्बोध חקך को केवल ‘विधि’ मानने के बजाय मिले हुए भाग, निर्धारित क्षेत्र या नियत जीवन-परिधि के अर्थ में रखा गया है; ‘भाग’ मूल की अस्पष्टता को कुछ सीमा तक बचाता है।
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: और उसी में चलता रह
  rationale: התהלך के निरंतर आचरण तथा ‘चलने’ के हिब्रू रूपक, दोनों को बनाए रखता है।
- source_word: וּבִמְלָאכְתְּךָ
  choice: और अपने काम में
  rationale: מלאכה के व्यापक अर्थ—काम, श्रम या व्यवसाय—के लिए सरल और स्वाभाविक हिन्दी।
- source_word: הִתְיַשֶּׁן
  choice: बूढ़ा हो
  rationale: शाब्दिक रूप से वृद्ध होने और लंबे समय तक उसी काम में टिके रहने के भाव को बिना ‘थक जाना’ जैसे अतिरिक्त अर्थ के सुरक्षित रखता है।
theological_decisions:
- issue: उपलब्ध हिब्रू पाठ और यूनानी परंपरा में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू को प्राथमिकता दी गई है।
  alternative: 'यूनानी के अनुसार: “यह मत कह, ‘मैं आत्मनिर्भर हूँ; अब से मुझ पर कौन-सी विपत्ति आएगी?’”'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है, वही मूल आधार है। यूनानी साक्षी एक महत्वपूर्ण वैकल्पिक पाठ है, इसलिए उसे पादटिप्पणी में पूरा दिया गया है, न कि चुपचाप मुख्य पाठ में मिला दिया गया है।
- issue: בְּחֻקֶּךָ का अनिश्चित अर्थ
  choice: अपने निर्धारित भाग में
  alternative: अपनी विधि में; अपने नियत क्षेत्र में; अपने निर्धारित मार्ग पर
  rationale: पाठ का शब्द कठिन है और कानूनी ‘विधि’ से लेकर नियत हिस्से या कार्य-क्षेत्र तक अर्थ दे सकता है। अनुवाद संदर्भानुकूल है, पर अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा ज्ञानोपदेश। ‘चलता रह’ हिब्रू जीवन-आचरण रूपक को बनाए रखता है; ‘बूढ़ा हो’ जानबूझकर कुछ असामान्य पर मूलनिष्ठ है और दीर्घकालीन स्थिरता व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
