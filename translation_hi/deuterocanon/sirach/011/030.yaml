base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: hi
  text: अच्छे दिन में विपत्ति भुला दी जाती है, और बुरे दिन में समृद्धि भुला दी जाती है; और मनुष्य का अंत उस पर होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “और मनुष्य का अंत उस पर होगा।” इसका अर्थ यह हो सकता है कि उसका अंतिम परिणाम उसके सामने आ खड़ा होगा या उस पर आ पड़ेगा। इस स्थान पर यूनानी पाठ उपलब्ध हिब्रू से बहुत भिन्न है और इस वाक्यांश को स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: अच्छे दिन में
  rationale: शाब्दिक अर्थ ‘अच्छा दिन’ है; प्रसंग में यह अनुकूल समय को दर्शाता है। अधिक स्वाभाविक हिन्दी वाक्य-विन्यास के लिए ‘अच्छे दिन में’ चुना गया।
- source_word: תִּשָּכַח רָעָה
  choice: विपत्ति भुला दी जाती है
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, बल्कि कष्ट या विपत्ति है। हिब्रू क्रिया के निष्क्रिय भाव को हिन्दी में बनाए रखा गया है।
- source_word: וְרָע יוֹם
  choice: और बुरे दिन में
  rationale: यह पहले पदांश का सीधा विरोधी समानांतर है और प्रतिकूल समय को सूचित करता है।
- source_word: תִּשָׁכַח טוֹבָה
  choice: समृद्धि भुला दी जाती है
  rationale: טוֹבָה यहाँ अनुभव की गई भलाई, सुख-समृद्धि या अनुकूल दशा है; ‘समृद्धि’ विपत्ति के साथ स्पष्ट विरोध बनाए रखती है।
- source_word: וְאַחֲרִית אָדָם
  choice: और मनुष्य का अंत
  rationale: אַחֲרִית का अर्थ अंत, अंतिम दशा या परिणाम हो सकता है। אָדָם सामान्य रूप से मानव व्यक्ति का बोध कराता है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: תִּהְיֶה עָלָיו
  choice: उस पर आ पड़ेगा
  rationale: शाब्दिक संरचना ‘उस पर होगा’ है। ‘आ पड़ेगा’ עָלָיו के ‘ऊपर आने/आ पड़ने’ के भाव को स्वाभाविक हिन्दी में रखता है, पर अस्पष्टता के कारण टिप्पणी दी गई है।
theological_decisions:
- issue: मनुष्य के ‘अंत’ और עָלָיו का संबंध
  choice: मनुष्य का अंत उस पर आ पड़ेगा
  alternative: मनुष्य का अंत उसके सामने रखा जाएगा
  rationale: हिब्रू केवल कहता है कि अंत ‘उस पर होगा’; वह इसे स्पष्ट रूप से न्याय, मृत्यु या अंतिम प्रतिफल नहीं कहता। इसलिए किसी विशिष्ट धर्मवैज्ञानिक अर्थ को आरोपित किए बिना निकट और स्वाभाविक अभिव्यक्ति चुनी गई।
- issue: सामान्य अर्थ में אָדָם
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ‘मनुष्य’ हिब्रू के प्रतिनिधिक एकवचन को बनाए रखता है और यहाँ केवल पुरुषों तक अर्थ सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पहले दो समानांतर पदांशों में निष्क्रिय रचना बचाई गई है। अंतिम पदांश की वास्तविक हिब्रू अस्पष्टता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
