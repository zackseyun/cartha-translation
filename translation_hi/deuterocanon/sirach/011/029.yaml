  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: hi
  text: यह मत कहना[a], “मेरे पास पर्याप्त है; मुझ पर कौन-सी विपत्ति आएगी?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “हर किसी को अपने घर में मत लाना, क्योंकि कपटी व्यक्ति के अनेक घात हैं।” यह इस पद के एक बहुत भिन्न पाठ-रूप को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह न कहना
  rationale: निषेधात्मक आज्ञा और אמר के सीधे अर्थ ‘कहना’ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: דַּיִּי
  choice: पर्याप्त है
  rationale: די का मूल भाव पर्याप्तता है; यह ‘मैं संतुष्ट हूँ’ की अपेक्षा उपलब्ध साधनों की वस्तुगत पर्याप्तता को अधिक ठीक रखता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: इब्रानी बिंब को बनाए रखता है और वर्तमान में सामने या उपलब्ध वस्तुओं की ओर संकेत कर सकता है, बिना अर्थ को अधिक स्पष्ट करके सीमित किए।
- source_word: מַה אָסוֹן
  choice: कौन-सी विपत्ति
  rationale: אָסוֹן गंभीर हानि या अनिष्ट को दर्शाता है; ‘विपत्ति’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יְהִי עָלָי
  choice: मुझ पर ... आएगी
  rationale: इब्रानी के शाब्दिक ‘मुझ पर होगी’ को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है और अपूर्ण क्रिया में अनावश्यक संभावनार्थक भाव नहीं जोड़ता।
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी पाठ उपलब्ध इब्रानी से मूलतः भिन्न पाठ-रूप का प्रतिनिधित्व करता है; दोनों को मिलाने के बजाय उसे वैकल्पिक पाठ के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सिराख 11:29 के इब्रानी और यूनानी पाठ-रूपों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुसरण और यूनानी को पादटिप्पणी में संरक्षण
  alternative: 'यूनानी को मुख्य पाठ बनाना: “हर किसी को अपने घर में न लाना, क्योंकि छल करनेवाले के घात बहुत हैं।”'
  rationale: इस पद का इब्रानी पाठ उच्च विश्वास के साथ उपलब्ध है और परियोजना की नीति के अनुसार वही मुख्य आधार है। यूनानी पाठ को छिपाना या इब्रानी में मिलाना उचित नहीं, क्योंकि वह अत्यंत भिन्न पाठ-परंपरा का साक्षी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त ज्ञान-वचन की सीधी, गरिमापूर्ण शैली। ‘मेरे सामने’ को इब्रानी बिंब और उसकी हल्की अस्पष्टता बनाए रखने के लिए रखा गया है।
