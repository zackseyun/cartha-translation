base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/027.yaml
  text: The blessing of God is the lot of the righteous[b][a], and in the time of his hope it will blossom.
translation:
  language: hi
  text: परमेश्वर की आशीष धर्मी का भाग है,[a] और उसकी आशा के समय वह खिल उठेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ का अर्थ है: “परमेश्वर की आशीष धर्मी का भाग है, और उसकी आशा के समय वह खिल उठेगी।” यूनानी पाठ बहुत भिन्न है: “दुःख की घड़ी भोग-विलास को भुला देती है, और मनुष्य के अंत में उसके काम प्रकट होते हैं।” इससे संकेत मिलता है कि इस पद की पाठ-परंपराएँ अलग रही हैं।'
    reason: textual_variant
  - marker: b
    text: इसे “उसकी आशा खिल उठेगी” भी समझा जा सकता है। इब्रानी क्रिया का संबंध “आशीष” या “आशा”—दोनों में से किसी से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: परमेश्वर की आशीष
  rationale: रचना-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; אֵל के लिए सामान्य और संप्रदाय-निरपेक्ष 'परमेश्वर' उपयुक्त है।
- source_word: גּוֹרָל
  choice: भाग
  rationale: यहाँ शब्द आवंटित हिस्से या किसी के हिस्से में आने वाली वस्तु को दर्शाता है। हिन्दी में 'भाग' इस भाव को स्वाभाविक रूप से व्यक्त करता है; 'नियति' अनावश्यक रूप से अर्थ को निश्चित कर देती।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। 'धर्मी' नैतिक श्रेणी और प्रतिनिधिक एकवचन दोनों को संक्षेप में बनाए रखता है।
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: और उसकी आशा के समय
  rationale: समय-संबंधी पदबंध और एकवचन प्रत्यय दोनों सुरक्षित रहते हैं। हिन्दी में यह कुछ काव्यात्मक होते हुए भी स्पष्ट और मूल के निकट है।
- source_word: תִּפְרָח
  choice: वह खिल उठेगी
  rationale: פרח की पुष्पित होने की सजीव छवि को बनाए रखता है। स्त्रीलिंग क्रिया 'खिल उठेगी' पूर्ववर्ती 'आशीष' अथवा 'आशा'—दोनों से जुड़ सकती है, इसलिए मूल की संदर्भगत अस्पष्टता सुरक्षित रहती है।
theological_decisions:
- issue: תִּפְרָח का कर्ता या पूर्वपद
  choice: '''वह खिल उठेगी'' कहकर संदर्भ खुला रखा गया है; मुख्य पाठ में ''वह'' का स्वाभाविक संबंध ''आशीष'' से हो सकता है।'
  alternative: '''उसकी आशा खिल उठेगी''—क्रिया को स्पष्ट रूप से ''आशा'' से जोड़ना।'
  rationale: इब्रानी स्त्रीलिंग एकवचन क्रिया को 'आशीष' और 'आशा' दोनों से समझा जा सकता है। स्पष्ट संज्ञा दोहराने से मूल की वास्तविक अस्पष्टता मिट जाती, इसलिए सर्वनाम रखा गया और विकल्प पादटिप्पणी में बताया गया।
- issue: इब्रानी और यूनानी पाठ-परंपराओं का पर्याप्त अंतर
  choice: मुख्य पाठ के लिए उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ को आधार बनाया गया।
  alternative: 'यूनानी पाठ के अनुसार अनुवाद: ''दुःख की घड़ी भोग-विलास को भुला देती है, और मनुष्य के अंत में उसके काम प्रकट होते हैं।'''
  rationale: यूनानी समानांतर का आशय इब्रानी से बहुत भिन्न है और संभवतः अलग पाठ-रूप का साक्षी है। मूल-भाषा स्रोत की प्राथमिकता रखते हुए इब्रानी को मुख्य पाठ में और अंतर को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और हल्का काव्यात्मक ज्ञान-साहित्यिक लहजा। 'भाग' और 'खिल उठेगी' जैसे सहज शब्द मूल रूपक को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
