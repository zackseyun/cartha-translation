base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/018.yaml
  text: Wisdom and understanding and the knowledge of a matter are from the Lord[a]; sin and upright ways are from the Lord.
translation:
  language: hi
  text: एक व्यक्ति सावधानी और कंजूसी के कारण धनी हो जाता है, और यही उसके प्रतिफल का भाग है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रदत्त काहिरा गनीज़ा इब्रानी पंक्ति में एक अलग कथन है: “बुद्धि, समझ और किसी बात की समझ प्रभु से है; पाप और सीधे मार्ग प्रभु से हैं।” यह सिराख 11:18 के यूनानी पाठ से मेल नहीं खाती; इसलिए यहाँ मुख्य अनुवाद यूनानी समानांतर का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: कोई व्यक्ति ... धनी हो जाता है
  rationale: वर्तमान कृदंत धन अर्जित करने या धनी बनने की प्रक्रिया/परिणाम व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀπὸ προσοχῆς
  choice: अपनी सावधानी से
  rationale: προσοχή का अर्थ ध्यान या सावधानी है। 'सावधानी' कारणसूचक ἀπό को सहज हिन्दी में रखती है और अगले नकारात्मक पद से पहले स्वयं अनावश्यक नैतिक निर्णय नहीं जोड़ती।
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: और कंजूसी से
  rationale: σφιγγία कृपणता या धन को कसकर रोके रखने का भाव देता है। 'कंजूसी' आधुनिक सामान्य हिन्दी में स्पष्ट है और 'मितव्ययिता' की अपेक्षा उचित नकारात्मक रंग बनाए रखती है।
- source_word: καὶ αὕτη ἡ μερὶς
  choice: और ... उसका भाग यही है
  rationale: μερίς का मूल अर्थ भाग या हिस्सा है। 'भाग' आवंटित परिणाम के रूपक को बनाए रखता है।
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: उसके प्रतिफल में
  rationale: μισθός वेतन या प्रतिफल हो सकता है। यहाँ व्यवहार से मिलने वाले परिणाम का भाव है; 'प्रतिफल' औपचारिक नौकरी का अनावश्यक संकेत दिए बिना अर्थ व्यक्त करता है।
theological_decisions:
- issue: प्रदत्त इब्रानी पाठ और यूनानी समानांतर के बीच पाठगत असंगति
  choice: इस पद के मुख्य पाठ में यूनानी साक्ष्य का अर्थ अनूदित किया गया है और भिन्न इब्रानी कथन को पादटिप्पणी में सुरक्षित रखा गया है।
  alternative: 'मुख्य पाठ में इब्रानी कथन का अनुवाद: “बुद्धि, समझ और किसी बात को परखना प्रभु से है; पाप और सीधे मार्ग प्रभु से हैं।”'
  rationale: प्रदत्त इब्रानी पंक्ति यूनानी में सुरक्षित सिराख 11:18 के क्रम और कथन से मेल नहीं खाती और संभवतः किसी अन्य कथन का प्रतिनिधित्व करती है। इसलिए पद की सुसंगत सामग्री यूनानी समानांतर से ली गई है, जबकि पाठगत तनाव को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। 'कंजूसी' नकारात्मक भाव को स्पष्ट रखती है, जबकि 'प्रतिफल' μισθός को व्यापक परिणाम के अर्थ में प्रस्तुत करता है।
