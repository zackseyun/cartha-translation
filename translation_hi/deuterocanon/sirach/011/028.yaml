base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/028.yaml
  text: Do not say[a], “Look, I have done what I desired; and what now will be lacking to me?”
translation:
  language: hi
  text: मत कहो[a], “देखो, मैंने अपनी इच्छा पूरी कर ली है; और अब मुझे किस बात की कमी होगी?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ: “अन्त से पहले किसी को धन्य न कहो, और मनुष्य अपनी सन्तान से पहचाना जाएगा।” यहाँ इब्रानी साक्ष्य इसके बजाय यह चेतावनी देता है: “मैंने अपनी इच्छा पूरी कर ली है; और अब मुझे किस बात की कमी होगी?”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: मत कहो
  rationale: निषेधवाचक कण और क्रिया का स्वाभाविक आधुनिक हिन्दी रूप; यह सीधे दिए गए निषेध को स्पष्ट रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: वक्ता के आत्मसन्तुष्ट दावे पर ध्यान खींचने वाले संकेतवाचक बल को सहज हिन्दी में बनाए रखता है।
- source_word: עָשִׂיתִי חֶפְצִי
  choice: मैंने अपनी इच्छा पूरी कर ली है
  rationale: इब्रानी सिद्ध क्रिया और חֵפֶץ के ‘इच्छा/चाह’ अर्थ को परिणाम सहित स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמֶה עַתָּה
  choice: और अब
  rationale: וְ के संयोजक बल तथा עַתָּה के वर्तमानकालिक संकेत, दोनों को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: יֵעָזֵב לִי
  choice: मुझे किस बात की कमी होगी
  rationale: शाब्दिक रूप में ‘मेरे लिए क्या छोड़ा/शेष रहेगा’ सम्भव है, पर प्रसंग में आत्मसन्तुष्ट व्यक्ति का आशय ‘अब मुझे क्या कमी हो सकती है?’ है; प्रश्नवाचक हिन्दी उसी दम्भपूर्ण सुरक्षा-बोध को व्यक्त करती है।
theological_decisions:
- issue: इब्रानी पाठ और भिन्न यूनानी समानान्तर पाठ का सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का सीधा अनुवाद
  alternative: 'यूनानी-आधारित पाठ: “अन्त से पहले किसी को धन्य न कहो, और मनुष्य अपनी सन्तान से पहचाना जाएगा।”'
  rationale: यहाँ सुरक्षित इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी पाठ शब्दशः समान नहीं, यद्यपि समय से पहले अपने को सफल या धन्य मानने के विरुद्ध सम्बद्ध ज्ञान-विषय रखता है; इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में पूर्ण वैकल्पिक पाठ के रूप में रखा गया है।
- issue: יֵעָזֵב לִי की अर्थगत अनिश्चितता
  choice: “मुझे किस बात की कमी होगी?”
  alternative: “मेरे लिए अब क्या शेष रहेगा?”
  rationale: क्रिया में ‘छोड़ा जाना/शेष रहना’ का शाब्दिक क्षेत्र है, पर कथन के आत्मसन्तुष्ट स्वर में अभाव या कमी न होने का दावा अधिक सुसंगत है। अनुवाद इस प्रसंगगत अर्थ को अपनाता है, बिना इसे दैवी प्रतिज्ञा या निश्चित सुरक्षा में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “मत कहो” सामान्य पाठक के लिए सीधा निषेध है; “देखो” मूल के संकेतवाचक बल को बिना पुरातन शैली के व्यक्त करता है। अर्धविराम आत्मसन्तुष्ट उपलब्धि और उससे निकाले गए सुरक्षा-बोध के बीच सम्बन्ध स्पष्ट करता है।
