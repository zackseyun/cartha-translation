base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/031.yaml
  text: An evil time makes pleasure be forgotten[a], and a man's end tells about him.
translation:
  language: hi
  text: बुरा समय सुख को भुला देता है[a], और मनुष्य का अंत उसके विषय में बता देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्योंकि वह अच्छी वस्तुओं को बुरी वस्तुओं में बदलते हुए घात लगाता है, और चुनी हुई वस्तुओं पर दोष लगाएगा।” यहाँ इब्रानी और यूनानी पाठों में उल्लेखनीय भिन्नता है; मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: बुरा समय
  rationale: עֵת का अर्थ समय या काल और רָעָה का अर्थ यहाँ विपत्ति या बुरा समय है। यह चयन नैतिक बुराई से अधिक प्रतिकूल परिस्थिति का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: תְּשַׁכֵּח תַּעֲנוּג
  choice: सुख को भुला देता है
  rationale: שכח का हिफ़ील रूप कारणवाचक है और תענוג उसका कर्म है; इसलिए बुरा समय पहले के सुख को भुला देता है।
- source_word: וְסוֹף אָדָם
  choice: और मनुष्य का अंत
  rationale: סוף परिणाम या अंत को और אדם यहाँ नीतिवचन के प्रतिनिधि एकवचन में मनुष्य को सूचित करता है। हिन्दी में 'मनुष्य' इस सामान्य मानवीय संदर्भ को गरिमापूर्ण और सहज ढंग से रखता है।
- source_word: יַגִּיד עָלָיו
  choice: उसके विषय में बता देता है
  rationale: נגד के हिफ़ील का अर्थ बताना या प्रकट करना है; עליו के साथ वाक्य का आशय है कि मनुष्य का अंत उसके विषय में सच्चाई प्रकट करता है, पर अनुवाद मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
theological_decisions:
- issue: नीतिवचन के प्रतिनिधि एकवचन में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदमी / व्यक्ति
  rationale: '''मनुष्य'' मूल के सामान्य मानवीय अर्थ को बनाए रखता है और आधुनिक मानक हिन्दी में गरिमापूर्ण है; यह किसी विशेष लिंग-संबंधी निष्कर्ष को अनावश्यक रूप से नहीं जोड़ता।'
- issue: मनुष्य के अंत द्वारा उसके विषय में बताने का आशय
  choice: उसके विषय में बता देता है
  alternative: उसकी असलियत प्रकट कर देता है
  rationale: अधिक व्याख्यात्मक विकल्प से बचते हुए मूल की अस्पष्टता सुरक्षित रखी गई है कि 'अंत' उसके चरित्र, जीवन या परिणति में से किस बात की गवाही देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। 'बुरा समय' सामान्य पाठक के लिए सहज है, जबकि कारणवाचक क्रिया और दूसरे खंड की वास्तविक अस्पष्टता सुरक्षित हैं।
