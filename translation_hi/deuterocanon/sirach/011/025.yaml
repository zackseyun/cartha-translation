translation:
  language: hi
  text: बुराई करने वालों को देखकर चकित न हो[a]; प्रभु की ओर दौड़ और उसके प्रकाश की प्रतीक्षा कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “अच्छी बातों के दिन बुरी बातें भुला दी जाती हैं, और बुरी बातों के दिन अच्छी बातें स्मरण नहीं रहतीं।” यहाँ यूनानी साक्ष्य उपलब्ध इब्रानी पाठ से बहुत भिन्न है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: चकित न हो
  rationale: यह इब्रानी क्रिया विस्मित या हतप्रभ होने का भाव देती है। ‘चकित न हो’ उपदेशात्मक स्वर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּעוֹשֵׂי רָע
  choice: बुराई करनेवालों को देखकर
  rationale: शाब्दिक अर्थ ‘बुराई करनेवालों पर/के कारण’ है। हिन्दी में ‘को देखकर’ विस्मय के कारण को सहज रूप से व्यक्त करता है, बिना इसे भय या ईर्ष्या के अर्थ तक सीमित किए।
- source_word: תָּרוּץ
  choice: दौड़
  rationale: मूल क्रिया का ठोस और तीव्र चित्र सुरक्षित रखा गया है; ‘शीघ्र जा’ की अपेक्षा ‘दौड़’ अधिक प्रत्यक्ष है।
- source_word: לַיי
  choice: प्रभु की ओर
  rationale: יי परमेश्वर के नाम का श्रद्धासूचक लेखन है। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में गरिमामय और सामान्यतः बोधगम्य है; ‘की ओर’ गति की दिशा स्पष्ट करता है।
- source_word: וְקַוֵּה
  choice: बाट जोह
  rationale: यह क्रिया प्रतीक्षा और आशा दोनों का भाव रख सकती है। ‘बाट जोह’ अपेक्षापूर्ण प्रतीक्षा को स्वाभाविक ढंग से व्यक्त करती है और आशा की अंतर्ध्वनि भी बनाए रखती है।
- source_word: לְאוֹרוֹ
  choice: उसके प्रकाश की
  rationale: इब्रानी का शाब्दिक बिंब ‘उसका प्रकाश’ सुरक्षित है। इसे सहायता, अनुग्रह या उद्धार कहकर किसी एक व्याख्या में सीमित नहीं किया गया।
theological_decisions:
- issue: श्रद्धासूचक इब्रानी लेखन יי में निहित दिव्य नाम का अनुवाद
  choice: प्रभु
  alternative: याहवे
  rationale: ‘प्रभु’ हिन्दी में दिव्य नाम का स्वीकृत, गरिमामय प्रतिनिधित्व है और यहाँ ‘प्रभु की ओर दौड़’ वाक्य में स्वाभाविक बैठता है।
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और यूनानी भिन्न पाठ को पादटिप्पणी में देना
  alternative: केवल यूनानी पाठ का अनुवाद करना या दोनों पाठों को मिलाना
  rationale: यहाँ उपलब्ध इब्रानी और यूनानी कथन अर्थ की दृष्टि से बहुत भिन्न हैं। उन्हें समन्वित करने के बजाय इब्रानी को मुख्य पाठ में रखा गया है और यूनानी साक्ष्य को स्पष्ट पाठांतर के रूप में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, उपदेशात्मक और गरिमामय शैली। एकवचन आज्ञार्थक संबोधन रखा गया है। ‘प्रकाश’ के रूपक और ‘बाट जोह’ में निहित प्रतीक्षा-आशा की अर्थगत व्यापकता सुरक्षित रखी गई है।
