base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: hi
  text: जुए के नीचे अपनी गर्दनें रखो[a], और तुम्हारे प्राण उसका भार उठाएँ। वह उसे खोजने वालों के निकट है, और जो अपने आप को समर्पित करता है, वह उसे पा लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “और तुम्हारा प्राण शिक्षा ग्रहण करे।” हिब्रू में है: “और तुम्हारे प्राण उसका भार उठाएँ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם בְּעֻלָּהּ הָבִיאוּ
  choice: अपनी गर्दनें उसके जुए के नीचे ले आओ
  rationale: बहुवचन ‘गर्दनें’ संबोधित समुदाय के अनुरूप है। कठिन हिब्रू वाक्यांश को यूनानी समानांतर में स्पष्ट जुए की छवि की पुष्टि के साथ स्वाभाविक हिन्दी में रखा गया है।
- source_word: וּמַשָּׂאָהּ תִּשָּׂא נַפְשְׁכֶם
  choice: और तुम्हारे प्राण उसका भार उठाएँ
  rationale: हिब्रू की ‘प्राण’ और ‘भार उठाने’ की भाषा को बनाए रखा गया है; इसे यूनानी के ‘शिक्षा ग्रहण करे’ के अनुसार मुख्य पाठ में नहीं बदला गया।
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: वह उसे खोजने वालों के निकट है
  rationale: स्त्रीलिंग सर्वनाम द्वारा मानवीकृत बुद्धि का संकेत सुरक्षित रहता है और खोजने की सक्रियता भी व्यक्त होती है।
- source_word: וְנוֹתֵן נַפְשׁוֹ
  choice: और जो अपने आपको अर्पित करता है
  rationale: शाब्दिक अर्थ ‘अपना प्राण देता है’ है; प्रसंग में इसका आशय बुद्धि की खोज में स्वयं को पूर्णतः लगा देना है। ‘अपने आपको अर्पित करता है’ इस आत्म-समर्पण को बिना मृत्यु का अनपेक्षित अर्थ दिए व्यक्त करता है।
- source_word: מוֹצֵא אֹתָהּ
  choice: वह उसे पा लेता है
  rationale: हिब्रू के सामान्य ‘पाना’ क्रियार्थ और बुद्धि के स्त्रीलिंग व्यक्तिकरण दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: बुद्धि के लिए स्त्रीलिंग ‘वह/उसे/उसके’ का प्रयोग
  alternative: अमूर्त वस्तु के रूप में ‘यह/इसे’ कहना
  rationale: हिब्रू में बुद्धि स्त्रीलिंग है और इस प्रसंग में स्त्री-रूप में मानवीकृत है; स्त्रीलिंग संकेत को बनाए रखना मूल की काव्यात्मक और धर्मवैचारिक तनावपूर्ण छवि के प्रति अधिक निष्ठावान है।
- issue: हिब्रू और यूनानी के दूसरे खंड का अंतर
  choice: मुख्य पाठ में हिब्रू ‘उसका भार उठाएँ’
  alternative: यूनानी के अनुसार ‘तुम्हारे प्राण शिक्षा ग्रहण करें’
  rationale: यहाँ हिब्रू पाठ उपलब्ध और अर्थपूर्ण है, इसलिए मुख्य पाठ उसी का अनुसरण करता है; महत्वपूर्ण यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। बहुवचन संबोधन तथा जुए और भार की परस्पर जुड़ी काव्यात्मक छवियाँ बनाए रखी गई हैं।
