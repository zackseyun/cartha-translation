base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: hi
  text: और मैंने यहोवा की करुणाओं और उसकी प्राचीनकाल से चली आ रही प्रेममयी निष्ठाओं को स्मरण किया—वह अपने शरणागतों को बचाता और उन्हें हर बुराई से छुड़ाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “और मैंने तेरी दया को, हे प्रभु, और प्राचीनकाल से तेरे कार्य को स्मरण किया; क्योंकि तू अपनी बाट जोहनेवालों को छुड़ाता और उन्हें राष्ट्रों के हाथ से बचाता है।” यहाँ हिब्रू पाठ में “अपने शरणागतों” और “हर बुराई से” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: और मैंने ... स्मरण किया
  rationale: זכר का सीधा अर्थ स्मरण करना है; यह रूप गरिमापूर्ण और आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: רַחֲמֵי יְהֹוָה
  choice: यहोवा की करुणाओं
  rationale: बहुवचन רַחֲמֵי परमेश्वर की करुणा के अनेक प्रकट कार्यों का संकेत देता है; ‘करुणाओं’ से यह बहुवचन बना रहता है। दिव्य नाम को ‘यहोवा’ रखा गया है।
- source_word: וַחֲסָדָיו אֲשֶׁר מֵעוֹלָם
  choice: प्राचीनकाल से चले आ रहे उसके अटल प्रेम के कामों
  rationale: חסד में स्थिर निष्ठा और प्रेम दोनों निहित हैं; बहुवचन को ‘कामों’ से व्यक्त किया गया है। מֵעוֹלָם को ‘प्राचीनकाल से’ कहना पुरातन निरंतरता व्यक्त करता है, पर अनिवार्यतः दार्शनिक अनन्तता निर्धारित नहीं करता।
- source_word: הַמַּצִּיל אֶת חוֹסֵי בוֹ
  choice: वह अपने शरणागतों को बचाता
  rationale: חסה בוֹ शरण लेने की ठोस उपमा रखता है। ‘अपने शरणागतों’ से सम्बन्ध और आश्रय दोनों संक्षेप में व्यक्त होते हैं; participle को हिन्दी में स्वाभाविक वर्तमान क्रिया बनाया गया है।
- source_word: וַיִּגְאָלֵם מִכָּל רָע
  choice: और उन्हें हर बुराई से छुड़ाता है
  rationale: גאל का उद्धार/छुड़ाने का बल ‘छुड़ाता’ में सुरक्षित है। רָע नैतिक बुराई, विपत्ति या हानि को समेट सकता है; ‘हर बुराई’ इस व्यापकता को खुला रखता है।
theological_decisions:
- issue: חסד का अर्थ और उसकी वाचा-संबंधी ध्वनि
  choice: अटल प्रेम के कामों
  alternative: वाचा की विश्वासयोग्यता के कामों / स्थिर प्रेम
  rationale: ‘अटल प्रेम’ ईश्वरीय निष्ठा को सामान्य पाठक के लिए सहज ढंग से व्यक्त करता है, जबकि ‘कामों’ से हिब्रू बहुवचन और उद्धारकारी क्रियाओं का संदर्भ बना रहता है; किसी विशिष्ट व्यवस्थित धर्मवैज्ञानिक परिभाषा को थोपा नहीं गया।
- issue: מֵעוֹלָם की कालगत सीमा
  choice: प्राचीनकाल से चले आ रहे
  alternative: अनादिकाल से / सदा से
  rationale: संदर्भ में स्मरण किए गए पुराने उद्धारकारी कार्य प्रमुख हैं। चुना हुआ रूप दीर्घकालीन निरंतरता रखता है, पर पद से अधिक स्पष्ट अनन्तता का दावा नहीं करता।
- issue: הַמַּצִּיל का वाक्यगत सम्बन्ध
  choice: 'डैश के बाद यहोवा का वर्णन: ‘वह ... बचाता’'
  alternative: क्योंकि वह ... बचाता है / जो ... बचाता है
  rationale: हिब्रू participle यहोवा का वर्णन करता है और पूर्व कथन को उद्धारकारी चरित्र से जोड़ता है। डैश हिन्दी में इस appositional/व्याख्यात्मक सम्बन्ध को स्वाभाविक रखता है, बिना अनिवार्यतः कारणसूचक अर्थ तय किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। ‘शरणागत’ प्रचलित धार्मिक-साहित्यिक शब्द है और חסה की आश्रय-उपमा को संक्षेप में बनाए रखता है। मुख्य पाठ में केवल एक पादटिप्पणी-चिह्न है और उसका मिलान पादटिप्पणी [a] से होता है।
