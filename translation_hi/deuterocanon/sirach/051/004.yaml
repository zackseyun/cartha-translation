translation:
  language: hi
  text: चारों ओर की दमघोंटू आग से[a], और उस आग के बीच से जिसे मैंने नहीं सुलगाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का उपलब्ध इब्रानी पाठ कठिन है और यूनानी पाठ से बहुत भिन्न है। इसके उत्तरार्ध का इब्रानी रूप अधिक निकटता से कुछ ऐसा होगा: “अथाह गहराई के गर्भ से, मेरी माँ तक”; पर प्रसंग में इसका अर्थ अस्पष्ट है।'
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ / ἀπὸ πνιγμοῦ πυρᾶς
  choice: दमघोंटू आग से
  rationale: प्राप्त इब्रानी पद कठिन और संभवतः पाठगत रूप से अस्थिर है। यूनानी πνιγμός का अर्थ ‘दम घुटना/दम घोंटना’ है और वह प्रसंग में स्पष्ट अर्थ देता है; ‘आग’ इब्रानी और यूनानी दोनों में सुनिश्चित है।
- source_word: לְאֵין פֶּחָה / κυκλόθεν
  choice: चारों ओर से घेर लेने वाली
  rationale: इब्रानी पदबंध का प्रसंगानुकूल अर्थ अनिश्चित है; यूनानी κυκλόθεν स्पष्ट रूप से ‘चारों ओर से’ बताता है। ‘घेर लेने वाली’ जोड़ने से आधुनिक हिन्दी में आग से चारों ओर घिरे होने का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: מֵרֶחֶם תְּהוֹם לְאִמִּי / ἐκ μέσου πυρὸς
  choice: उस आग के बीच से
  rationale: प्राप्त इब्रानी पाठ यहाँ यूनानी से बहुत भिन्न और प्रसंग में अत्यंत अस्पष्ट है। मुख्य पाठ में सुसंगत यूनानी समानांतर का अर्थ लिया गया है और इब्रानी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: जिसे मैंने नहीं सुलगाया था
  rationale: ἐξέκαυσα प्रथम पुरुष सक्रिय रूप है और स्वाभाविक अर्थ ‘मैंने नहीं सुलगाया’ देता है, न कि ‘जिससे मैं नहीं जला।’ ‘था’ हिन्दी में पूर्ववर्ती क्रिया-संबंध को सहज बनाता है।
theological_decisions:
- issue: गंभीर रूप से कठिन इब्रानी पाठ के स्थान पर यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ में यूनानी का सुसंगत अर्थ लिया गया, जबकि आग की छवि दोनों पाठों से पुष्ट है।
  alternative: 'प्राप्त इब्रानी का अधिक शाब्दिक किंतु प्रसंग में अस्पष्ट अनुवाद: ‘अथाह गहराई के गर्भ से, मेरी माता से/मेरी माता के लिए।’'
  rationale: सिराख के उपलब्ध इब्रानी पाठ को सामान्यतः प्राथमिकता दी जाती है, पर इस पद का उत्तरार्ध यूनानी से बहुत भिन्न है और स्पष्ट सुसंगत अर्थ नहीं देता। इसलिए यूनानी को वास्तविक पाठ-साक्ष्य के रूप में अपनाया गया है और भिन्नता को पादटिप्पणी में साफ बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘दमघोंटू’ संकट की तीव्रता व्यक्त करता है, जबकि पादटिप्पणी पाठगत अनिश्चितता को बिना छिपाए सामने रखती है।
