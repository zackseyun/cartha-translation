base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: hi
  text: 'मैंने अपना प्राण उसके पीछे लगा दिया,

    और युगानुयुग उससे न हटूँगा।

    मैंने उसे शुद्धता में पाया,

    और मैंने आरम्भ से ही उसके लिए मन अर्जित किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: मैंने अपना प्राण उसके पीछे लगा दिया
  rationale: נפשׁ का मूल बिंब ‘प्राण’ से सुरक्षित रहता है, जबकि ‘पीछे लगा दिया’ हिब्रू נתתי אחריה की समर्पित खोज को स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग सर्वनाम प्रसंग में बुद्धि की ओर संकेत करता है।
- source_word: וּלְנֵצַח נְצָחִים
  choice: और युगानुयुग
  rationale: हिब्रू की तीव्र काल-अभिव्यक्ति का संक्षिप्त, गरिमापूर्ण और सहज हिन्दी समतुल्य।
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: उससे न हटूँगा
  rationale: נטה का अर्थ मुड़ना या हटना हो सकता है; यहाँ निष्ठा के भाव में ‘न हटूँगा’ स्वाभाविक है और दिशा-संबंधी बिंब भी बनाए रखता है।
- source_word: וּבְטָהֳרָה מְצָאתִיהָ
  choice: मैंने उसे शुद्धता में पाया
  rationale: 'בְּ के संबंध को जानबूझकर खुला रखा गया है: यह खोज की शुद्ध दशा, साधन या क्षेत्र का बोध करा सकता है।'
- source_word: וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ
  choice: और आरम्भ से ही उसके लिए मन प्राप्त किया
  rationale: לב को ‘मन’ कहना आधुनिक हिन्दी में विचार, इच्छा और अंतर्मन के संयुक्त अर्थ को व्यक्त करता है। קנה के लिए ‘प्राप्त किया’ मूल की अर्जन-संबंधी अस्पष्टता बचाता है; ‘उसके लिए मन’ कुछ असामान्य होते हुए भी हिब्रू संबंध को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: स्त्रीलिंग ‘उसके’ का संकेत
  choice: स्त्रीलिंग संकेत को यथावत रखा गया
  alternative: हर बार ‘बुद्धि’ नाम को स्पष्ट रूप से दोहराना
  rationale: मूल पद सर्वनाम का प्रयोग करता है और उसका पूर्वसंदर्भ बुद्धि है; नाम जोड़ना मूल से अधिक व्याख्यात्मक होता।
- issue: शुद्धता और बुद्धि को पाने का संबंध
  choice: ‘शुद्धता में’
  alternative: ‘शुद्ध होकर’ या ‘शुद्ध आचरण के द्वारा’
  rationale: हिब्रू בְטָהֳרָה संबंध की प्रकृति को पूर्णतः निश्चित नहीं करता; अनुवाद कारण, साधन या नैतिक योग्यता का कोई अतिरिक्त धार्मिक दावा नहीं करता।
- issue: अन्तिम पंक्ति का कठिन हिब्रू
  choice: ‘उसके लिए मन प्राप्त किया’
  alternative: ‘मैंने अपना मन उसे दे दिया’
  rationale: वैकल्पिक पाठ अधिक सहज है, पर वह קניתי (‘मैंने पाया/अर्जित किया’) को נתתי (‘मैंने दिया’) के अर्थ में बदल देता। कठिनता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण सामान्य शब्दावली। हिब्रू को प्राथमिक आधार बनाया गया है। यूनानी समानांतर में पंक्तियों का क्रम और अन्तिम कथन भिन्न है; उच्च-विश्वास वाले उपलब्ध हिब्रू पाठ का अनुसरण किया गया है।
