translation:
  language: hi
  text: दुष्टता-भरे होंठों से, झूठ गढ़ने वालों से,[a] और छलपूर्ण जीभ के तीरों से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में इसके स्थान पर ‘अशुद्ध जीभ से और झूठी बात से’ है। इब्रानी पाठ इस पद के लिए उपलब्ध है, इसलिए मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है; अंतर पर्याप्त होने के कारण यूनानी पाठ यहाँ दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  choice: दुष्टता भरे होंठों से
  rationale: מִן छुटकारे के स्रोत को व्यक्त करता है और שִׂפְתֵי का ठोस बिंब ‘होंठों’ के रूप में रखा गया है। זִמָּה के संभावित यौन अर्थ को इस वाणी-संबंधी संदर्भ में अनावश्यक रूप से सीमित न करके व्यापक नैतिक अर्थ ‘दुष्टता’ लिया गया है।
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: झूठ गढ़नेवालों से
  rationale: טפל में पोतने/चिपकाने से विकसित झूठ आरोपित या निर्मित करने का भाव है। स्वाभाविक हिन्दी में ‘झूठ गढ़नेवाले’ व्यक्तियों की सक्रिय और अभ्यस्त भूमिका स्पष्ट करता है।
- source_word: וְחִצֵּי
  choice: और ... तीरों से
  rationale: दूसरे खंड में מן व्यक्त नहीं है, पर पहले खंड का ‘से’ पूरी समांतर सूची पर लागू होता है। ‘तीर’ हानिकारक वाणी का हिंसक काव्य-बिंब सुरक्षित रखता है।
- source_word: לְשוֹן מִרְמָה
  choice: छलपूर्ण जीभ
  rationale: ‘जीभ’ को ‘वाणी’ में अमूर्त करने के बजाय होंठों के समानांतर शारीरिक बिंब बनाए रखा गया है। מִרְמָה का संज्ञात्मक भाव सहज हिन्दी में विशेषण ‘छलपूर्ण’ से व्यक्त होता है।
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी समानांतर का पाठ उपलब्ध इब्रानी से पर्याप्त भिन्न है। इब्रानी पाठ विद्यमान और उच्च विश्वास वाला होने के कारण मुख्य पाठ उसी पर आधारित है; यूनानी भिन्नता पादटिप्पणी में दी गई है।
