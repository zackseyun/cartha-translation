  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: hi
  text: मेरी आत्मा मृत्यु के निकट आ पहुँची थी[a], और मेरा जीवन अधोलोक की गहराइयों के निकट था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आत्मा ने मृत्यु को छू लिया था।” यहाँ भाव सम्भवतः मृत्यु के निकट पहुँचने का है; यूनानी समानांतर भी “मृत्यु के निकट आई” कहता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “शिओल की गहराइयों के निकट”; शिओल मृतकों के लोक के लिए इब्रानी शब्द है। यूनानी समानांतर में “नीचे का हेडीस” है।
    reason: source_term
lexical_decisions:
- source_word: וַתִּגַּע
  choice: निकट पहुँच गई थी
  rationale: נגע का मूल अर्थ ‘छूना/पहुँचना’ है, पर לַמָּוֶת के साथ यहाँ मृत्यु के अत्यन्त निकट आने का भाव है; यूनानी ἤγγισεν भी इसी अर्थ की पुष्टि करता है।
- source_word: נַפְשִׁי
  choice: मेरी आत्मा
  rationale: נפש का अर्थ प्राण, जीवन, स्वयं या आत्मा हो सकता है। दूसरे चरण के חַיָּתִי (‘मेरा जीवन’) से भेद और काव्यात्मक समानांतरता बनाए रखने के लिए ‘मेरी आत्मा’ चुना गया।
- source_word: חַיָּתִי
  choice: मेरा जीवन
  rationale: यह वक्ता के जीवन या जीवन-शक्ति को दर्शाता है और यूनानी ἡ ζωή μου से भी मेल खाता है।
- source_word: לִשְׁאוֹל
  choice: अधोलोक
  rationale: שְׁאוֹל मृतकों के लोक को सूचित करता है। सामान्य हिन्दी पाठक के लिए ‘अधोलोक’ स्वाभाविक और सुबोध है, जबकि इसे केवल ‘कब्र’ कहना अर्थ को बहुत संकीर्ण कर देगा।
- source_word: תַּחְתִּיּוֹת
  choice: गहराइयों
  rationale: बहुवचन रूप सबसे निचले या गहरे भागों का बोध कराता है; ‘अधोलोक की गहराइयाँ’ इस प्रबलता को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद, जिसके यूनानी समानांतर में ᾅδης है
  choice: अधोलोक
  alternative: शिओल / कब्र / हेडीस
  rationale: ‘अधोलोक’ मृतकों के लोक के सामान्य भाव को सुरक्षित रखता है, ‘कब्र’ से अधिक व्यापक है, और ‘हेडीस’ के यूनानी पौराणिक संबंधों को अनावश्यक रूप से नहीं लाता। पादटिप्पणी मूल इब्रानी पद ‘शिओल’ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, काव्यात्मक और सुबोध शैली। दोनों समानांतर पदों—‘मेरी आत्मा’ और ‘मेरा जीवन’—का भेद रखा गया है। मुख्य पाठ में ‘अधोलोक’ पठनीयता के लिए है, जबकि पादटिप्पणी मूल इब्रानी ‘शिओल’ को सुरक्षित रखती है।
