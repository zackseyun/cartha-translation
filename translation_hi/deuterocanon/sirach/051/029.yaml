base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/029.yaml
  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: hi
  text: मेरी आत्मा मेरी वृद्धावस्था में आनंदित हो[a], और तुम सब मेरे गीत के संबंध में लज्जित न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ: “तुम्हारी आत्मा उसकी दया में आनंदित हो, और तुम उसकी स्तुति में लज्जित न हो।” इसके विपरीत, हिब्रू साक्ष्य में “मेरी आत्मा,” “मेरी वृद्धावस्था में,” और “मेरा गीत” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: आनन्दित हो
  rationale: हिब्रू रूप को इच्छा/कामना के रूप में रखा गया है; यूनानी optative भी इसी भाव की पुष्टि करता है।
- source_word: נַפְשִׁי
  choice: मेरी आत्मा
  rationale: ‘मैं’ कहकर सरल करने के बजाय हिब्रू के आन्तरिक और व्यक्तिगत मुहावरे को सुरक्षित रखा गया है।
- source_word: בְּשֵׂיבָתִי
  choice: मेरे बुढ़ापे में
  rationale: שֵׂיבָה का शाब्दिक सम्बन्ध पके बालों से है, पर यहाँ स्वाभाविक हिन्दी में इसका आशय वृद्धावस्था है।
- source_word: וְלֹא תֵבוֹשוּ
  choice: और तुम ... लज्जित न हो
  rationale: द्वितीय पुरुष बहुवचन को हिन्दी में प्रसंगानुकूल ‘तुम’ से व्यक्त किया गया है। בוש के लज्जा/अपमान भाव को बनाए रखते हुए सहज हिन्दी का प्रयोग किया गया है।
- source_word: בְּשִׁירָתִי
  choice: मेरे गीत के कारण
  rationale: हिब्रू का अर्थ ‘मेरा गीत/गायन’ है। בְּ को यहाँ लज्जा के कारण अथवा अवसर के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; यूनानी का ‘उसकी स्तुति’ अलग पाठ को दर्शाता है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठों में व्यक्ति तथा विषयवस्तु का उल्लेखनीय अन्तर
  choice: 'मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले हिब्रू को अपनाया गया: ‘मेरी आत्मा ... मेरे बुढ़ापे में ... मेरे गीत’।'
  alternative: 'यूनानी समानान्तर: ‘तुम्हारी आत्मा उसकी दया में आनन्दित हो, और तुम उसकी स्तुति में लज्जित न हो।’'
  rationale: सिराख के उपलब्ध हिब्रू पाठ को प्राथमिक मानते हुए मुख्य अनुवाद उसी पर आधारित है। यूनानी पाठ कामनासूचक भाव और दूसरे पुरुष बहुवचन की पुष्टि करता है, किन्तु अन्य पदों में भिन्न पाठ प्रस्तुत करता है; इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, प्रार्थनात्मक शैली रखी गई है। ‘आत्मा’ हिब्रू मुहावरे को सुरक्षित रखता है और ‘बुढ़ापा’ सामान्य पाठक के लिए स्वाभाविक है।
