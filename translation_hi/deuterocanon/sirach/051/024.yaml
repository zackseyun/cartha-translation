  text: How long will you lack these things[a], while your soul is very thirsty?
translation:
  language: hi
  text: कब तक तुम इन बातों से वंचित रहोगे[a], और तुम्हारा प्राण बहुत प्यासा रहेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप है, “कब तक तुम इन और इनसे वंचित रहोगे, और तुम्हारा प्राण बहुत प्यासा रहेगा?” यूनानी समानांतर पाठ अधिक मुहावरेदार ढंग से कहता है, “तुम कहते हो कि इन बातों में तुम्हें कमी है, और तुम्हारे प्राण बहुत प्यासे हैं।” मुख्य पाठ इब्रानी को प्राथमिक मानता है और “इन बातों” का अर्थ स्पष्ट करने के लिए यूनानी से सहायता लेता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह समय-संबंधी प्रश्न का स्वाभाविक हिन्दी रूप है और मूल के उलाहने तथा आग्रह को बनाए रखता है।
- source_word: תַחְסְרוּן
  choice: तुम ... वंचित रहोगे
  rationale: חסר का अर्थ किसी वस्तु का अभाव होना या उससे वंचित रहना है। अपूर्ण क्रिया-रूप यहाँ जारी दशा को भविष्याभिमुख प्रश्न के रूप में व्यक्त करता है।
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: इन बातों से
  rationale: इब्रानी पदबंध शाब्दिक रूप से असामान्य है—'इन और इनसे'। सन्दर्भगत विषयों की ओर संकेत करने वाला 'इन बातों से' स्वाभाविक है और यूनानी ἐν τούτοις से भी पुष्ट होता है।
- source_word: וְנַפְשְׁכֶם
  choice: और तुम्हारा प्राण
  rationale: נפש यहाँ प्यास के साथ मनुष्य के भीतरी, लालायित अस्तित्व को सूचित करता है। 'प्राण' ज्ञान-साहित्य की गरिमा और मूल की मानववैज्ञानिक व्यापकता रखता है, बिना किसी विशिष्ट आत्मा-सिद्धान्त को आरोपित किए।
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: बहुत प्यासा रहेगा
  rationale: यह मूल इब्रानी के 'बहुत प्यासा होगा/रहेगा' को सीधे रखता है। 'रहेगा' जारी स्थिति की सम्भावना व्यक्त करता है; यूनानी वर्तमानकाल में 'बहुत प्यासे हैं' पढ़ता है।
theological_decisions:
- issue: ज्ञान-संबंधी उपदेश में נֶפֶשׁ का मानववैज्ञानिक अर्थ
  choice: तुम्हारा प्राण
  alternative: तुम्हारी आत्मा; तुम स्वयं
  rationale: '''प्राण'' गहरी आन्तरिक लालसा और पूरे जीवित व्यक्ति—दोनों की प्रतिध्वनि रखता है। यह पद को केवल तकनीकी ''आत्मा'' तक सीमित नहीं करता और न ही ''तुम स्वयं'' कहकर उसकी काव्यात्मक गहराई घटाता है।'
- issue: प्यास की अवस्था का काल
  choice: बहुत प्यासा रहेगा
  alternative: बहुत प्यासा है / बहुत प्यासे हैं
  rationale: मुख्य पाठ उच्च-विश्वास वाले इब्रानी תִּהְיֶה के भविष्य/अपूर्ण रूप को बनाए रखता है। यूनानी का वर्तमान और बहुवचन पाठ-टिप्पणी में दिया गया है, ताकि वास्तविक पाठांतर छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपदेशात्मक शैली रखी गई है। बहुवचन सम्बोधन के लिए 'तुम' प्रयुक्त है। 'इन बातों' सन्दर्भ को अनावश्यक रूप से विशिष्ट किए बिना अस्पष्ट इब्रानी पदबंध को स्वाभाविक बनाता है; पादटिप्पणी में उसका शाब्दिक रूप और यूनानी पाठ सुरक्षित हैं।
