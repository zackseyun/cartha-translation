base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: hi
  text: मैं आपकी स्तुति करूँगा, मेरे उद्धार के परमेश्वर; मैं आपका धन्यवाद करूँगा, मेरे पिता के परमेश्वर। मैं आपके नाम का, जो मेरे जीवन का दृढ़ गढ़ है, बखान करूँगा—क्योंकि आपने मेरे प्राण[b] को मृत्यु से छुड़ा लिया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘मेरे प्राण’ का अनुवाद ‘मेरे जीवन,’ ‘मुझे स्वयं’ या ‘मेरी आत्मा’ भी हो सकता है; हिब्रू נֶפֶשׁ (नेफ़ेश) प्रसंग के अनुसार ये अर्थ रखता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी समानांतर पाठ का आरम्भ कुछ भिन्न है: ‘हे प्रभु राजा, मैं आपका धन्यवाद करूँगा और हे मेरे उद्धारकर्ता परमेश्वर, आपकी स्तुति करूँगा।’'
    reason: textual_variant
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: मैं आपकी स्तुति करूँगा
  rationale: हिब्रू क्रिया सार्वजनिक रूप से प्रशंसा करने का भाव रखती है; ‘स्तुति करना’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: मेरे उद्धार के परमेश्वर
  rationale: यह चयन हिब्रू की संबंधवाचक रचना को बनाए रखता है और ‘उद्धार’ को केवल सामान्य सहायता तक सीमित नहीं करता।
- source_word: אוֹדְךָ
  choice: मैं आपका धन्यवाद करूँगा
  rationale: यह क्रिया धन्यवाद, अंगीकार अथवा प्रशंसा का अर्थ दे सकती है; पास की ‘स्तुति’ से अर्थगत भेद बनाए रखने के लिए ‘धन्यवाद’ चुना गया है।
- source_word: אֱלֹהֵי אָבִי
  choice: मेरे पिता के परमेश्वर
  rationale: हिब्रू में ‘पिता’ एकवचन है; इसलिए इसे ‘पूर्वजों’ अथवा ‘पितरों’ के रूप में सामान्यीकृत नहीं किया गया।
- source_word: אֲסַפְּרָה שִׁמְךָ
  choice: मैं आपके नाम का बखान करूँगा
  rationale: ספר यहाँ सुनाने, घोषित करने या वर्णन करने का भाव रखता है। ‘बखान करना’ स्तुतिपरक प्रसंग में सहज है और ‘नाम’ को स्पष्ट रूप से कर्म बनाए रखता है।
- source_word: מָעוֹז חַיַּי
  choice: मेरे जीवन का दृढ़ गढ़
  rationale: מָעוֹז सुरक्षा देने वाले सुदृढ़ स्थान या शरण का ठोस रूपक है। ‘दृढ़ गढ़’ उस रूपक को ‘सहायता’ जैसे अमूर्त शब्द में सपाट नहीं करता।
- source_word: פָדִיתָ
  choice: आपने ... छुड़ा लिया है
  rationale: פדה छुड़ाने, दाम देकर मुक्त करने या उद्धार करने का अर्थ दे सकता है। इस वाक्य में ‘मृत्यु से छुड़ा लिया’ स्वाभाविक हिन्दी में वास्तविक बचाव का भाव रखता है, बिना किसी बाद की धर्मसैद्धांतिक व्यवस्था को आरोपित किए।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש व्यक्ति, जीवन या प्राण को सूचित कर सकता है। मृत्यु से बचाए जाने के प्रसंग में ‘प्राण’ स्वाभाविक है और हिन्दी में केवल शरीर से अलग किसी अमूर्त आत्मा का अनिवार्य अर्थ नहीं देता।
theological_decisions:
- issue: פָדִיתָ का धर्मवैचारिक भार
  choice: मृत्यु से छुड़ा लिया है
  alternative: मृत्यु से उद्धार किया है / मृत्यु से मोल लेकर छुड़ाया है
  rationale: मूल क्रिया में छुटकारे और मोचन की गहराई है, पर इस धन्यवाद-प्रार्थना में हिन्दी का ‘छुड़ा लिया’ बचाव को स्पष्ट रखते हुए दाम चुकाने की ऐसी धारणा अनिवार्य नहीं बनाता जो पद में खुलकर नहीं कही गई।
- issue: שִׁמְךָ מָעוֹז חַיַּי का संबंध
  choice: आपके नाम का बखान करूँगा—मेरे जीवन का दृढ़ गढ़
  alternative: आपके नाम का बखान करूँगा, क्योंकि वह मेरे जीवन का दृढ़ गढ़ है
  rationale: हिब्रू में स्पष्ट जोड़ने वाली क्रिया नहीं है और वाक्यांश को समानाधिकरण के रूप में पढ़ा जा सकता है। डैश के साथ संक्षिप्त रचना मूल की काव्यात्मकता और व्याकरणिक तनाव बनाए रखती है।
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरे प्राण
  alternative: मेरे जीवन / मेरी आत्मा
  rationale: यह शब्द अनेक प्रसंगों में संपूर्ण जीवित व्यक्ति अथवा जीवन को दर्शाता है। ‘प्राण’ इस बहुअर्थकता को पर्याप्त रूप से खुला रखता है और मृत्यु से बचाए जाने के प्रसंग में स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भक्तिपूर्ण पर गैर-पुरातन शैली में रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। ‘दृढ़ गढ़’ मूल के ठोस सुरक्षा-रूपक को बनाए रखता है, जबकि ‘प्राण’ मृत्यु से बचाए गए जीवन/व्यक्ति के अर्थ को सहज हिन्दी में व्यक्त करता है।
