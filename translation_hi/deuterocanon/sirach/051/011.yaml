  text: Then Yahweh heard my voice[a], and listened to my supplications.
translation:
  language: hi
  text: तब याहवे ने मेरी आवाज़[a] सुनी और मेरी विनतियों पर ध्यान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘मेरी आवाज़’ है; इसे मुहावरे के रूप में ‘मेरी पुकार’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछली प्रार्थना और उसके बाद मिले परमेश्वर के उत्तर के बीच स्वाभाविक संक्रमण दिखाता है।
- source_word: שָׁמַע
  choice: सुनी
  rationale: यह קוֹלִי का सीधा क्रियापद है और अगले וַיַּאֲזִין से भिन्न सामान्य ‘सुनने’ का अर्थ बनाए रखता है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: यह हिब्रू का सीधा अर्थ है; प्रार्थना के प्रसंग में ‘मेरी पुकार’ संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम का आधुनिक हिन्दी में निकट लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: וַיַּאֲזִין
  choice: ध्यान दिया
  rationale: यह साधारण सुनने से आगे ध्यानपूर्वक ग्रहण करने का भाव देता है और हिन्दी में स्वाभाविक रहते हुए समानांतर क्रियाओं का अंतर बनाए रखता है।
- source_word: תַּחֲנוּנָי
  choice: मेरी विनतियों
  rationale: बहुवचन संज्ञा दया या अनुग्रह के लिए की गई गंभीर प्रार्थनाओं को व्यक्त करती है; ‘विनतियाँ’ वर्तमान हिन्दी में गरिमापूर्ण और समझने योग्य है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का निकट हिन्दी रूप है; ‘प्रभु’ नाम को उपाधि से बदल देता और ‘यहोवा’ भिन्न पारंपरिक स्वरांकन दर्शाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। ‘सुनी’ और ‘ध्यान दिया’ के द्वारा हिब्रू की दोनों निकटार्थी क्रियाओं का अंतर सुरक्षित है। उपलब्ध हिब्रू पाठ में पद-संख्या से पहले की पंक्ति पिछले संदर्भ का अंश है; यहाँ (יא) के बाद वाला पद 51:11 अनूदित किया गया है।
