base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: hi
  text: उसके फूल से, जो पकते अंगूरों के गुच्छे के समान था[a], मेरा हृदय उसमें आनंदित हुआ; मेरे पाँव ने सीधाई में कदम रखा[b]; अपनी जवानी से ही मैं उसके पदचिह्नों पर चलता रहा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो रंग चढ़ता हुआ अंगूरों का गुच्छा हो”; यूनानी बिंब पकते अंगूरों पर रंग आने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे पाँव ने सीधेपन में कदम रखा” अथवा “सीधे मार्ग पर कदम रखा”; यूनानी पद में मार्ग के सीधेपन और नैतिक सीधाई, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “मैं उसका पता लगाता रहा” अथवा “मैं उसे खोजता रहा”; यूनानी क्रिया में पदचिह्नों का अनुसरण करके खोजने का सजीव बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: उसके फूल से
  rationale: ἄνθος का अर्थ फूल या पुष्प है। प्रसंग में स्त्रीरूप में व्यक्त की गई बुद्धि इसका आशय है, इसलिए संबंधसूचक 'उसके' रूपक को स्पष्ट रखता है।
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: मानो पकता हुआ अंगूरों का गुच्छा हो
  rationale: σταφυλή अंगूरों के गुच्छे को और περκάζουσης पकते समय रंग चढ़ने को दर्शाता है। यह रूप स्वाभाविक हिन्दी में कृषि-बिंब को सुरक्षित रखता है।
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: मेरा हृदय उसमें आनन्दित हुआ
  rationale: εὐφράνθη आन्तरिक हर्ष को व्यक्त करता है और ἐν αὐτῇ का निकट औपचारिक रूप 'उसमें' है; यह बुद्धि में आनन्दित होने का भाव बनाए रखता है।
- source_word: ἐπέβη ὁ πούς μου ἐν εὐθύτητι
  choice: मेरा पाँव सीधाई में चला
  rationale: ἐπέβη में कदम रखने या आगे बढ़ने का भाव है और εὐθύτης भौतिक सीधेपन तथा नैतिक खराई दोनों का संकेत दे सकता है। 'सीधाई में चला' पथ-बिंब और नैतिक अर्थ दोनों को खुला रखता है।
- source_word: ἐκ νεότητός μου ἴχνευον αὐτήν
  choice: अपनी जवानी से ही मैं उसके पदचिह्न खोजता रहा
  rationale: ἴχνευον मूलतः पदचिह्नों के सहारे खोजने या पता लगाने का बिंब देता है। अपूर्ण भूतकाल की निरन्तरता 'खोजता रहा' में व्यक्त होती है।
theological_decisions:
- issue: αὐτῇ और αὐτήν का संदर्भ तथा लिंग
  choice: सर्वनामों को स्त्रीरूप में व्यक्त बुद्धि के लिए 'उसमें' और 'उसके' के रूप में रखा गया है।
  alternative: बुद्धि को अमूर्त मानकर नपुंसक अथवा व्याख्यात्मक रूप में प्रस्तुत करना।
  rationale: सिराख के प्रसंग में बुद्धि का स्त्रीरूप व्यक्तित्व स्पष्ट है; हिन्दी में इसे बनाए रखने से मूल रूपक सुरक्षित रहता है।
- issue: ἐν εὐθύτητι में मार्ग और नैतिकता का द्वि-अर्थ
  choice: '''सीधाई में'' रखा गया है, ताकि सीधे मार्ग और नैतिक खराई दोनों की प्रतिध्वनि बनी रहे।'
  alternative: '''सीधे मार्ग पर'' या ''ईमानदारी से''।'
  rationale: केवल एक अर्थ चुनने से यूनानी पद की वास्तविक अर्थगत व्यापकता संकुचित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सुबोध शैली अपनाई गई है। 'सीधाई' और 'पदचिह्न' मूल के पाँव/मार्ग/खोज संबंधी बिंब को जोड़कर रखते हैं; वाक्य का काव्यात्मक प्रवाह डैश और अर्धविरामों से सुरक्षित किया गया है।
