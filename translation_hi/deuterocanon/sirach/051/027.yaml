  text: See with your own eyes that I was young[b][a], and I stood by her and found her.
translation:
  language: hi
  text: अपनी आँखों से देखो कि मैं छोटा था[a]; मैं उसमें दृढ़ बना रहा और मैंने उसे पा लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छोटा’ का अर्थ यहाँ कम आयु का या अल्प/तुच्छ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में है, “अपनी आँखों से देखो कि मैंने थोड़ा परिश्रम किया और अपने लिए बहुत विश्राम पाया।” यह एक उल्लेखनीय रूप से भिन्न पाठ-रूप को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם
  choice: अपनी आँखों से देखो
  rationale: बहुवचन आज्ञार्थक और प्रत्यक्ष अनुभव द्वारा पुष्टि करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קָטֹן הָיִיתִי
  choice: मैं छोटा था
  rationale: קטן का मूल भाव ‘छोटा/अल्प’ है और प्रसंग में कम आयु का संकेत भी हो सकता है। ‘छोटा था’ इस दायरे को ‘युवा था’ की अपेक्षा अधिक खुला रखता है।
- source_word: וְעָמַדְתִּי בָהּ
  choice: मैं उसमें दृढ़ बना रहा
  rationale: עמד यहाँ केवल शारीरिक रूप से खड़े होने के बजाय टिके रहने या दृढ़ बने रहने का भाव दे सकता है; स्त्रीलिंग प्रत्यय का संभावित संदर्भ बुद्धि है।
- source_word: וּמְצָאתִיהָ
  choice: और मैंने उसे पा लिया
  rationale: מצא के साथ स्त्रीलिंग कर्म-प्रत्यय का सीधा अर्थ ‘उसे पाया’ है। हिन्दी का ‘उसे’ बुद्धि के स्त्रीलिंग संदर्भ के साथ स्वाभाविक है।
theological_decisions:
- issue: בָהּ और מְצָאתִיהָ के स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में ‘उसमें’ और ‘उसे’ रखा गया है, जिससे सम्भावित संदर्भ ‘बुद्धि’ बना रहता है।
  alternative: ‘बुद्धि में दृढ़ बना रहा और बुद्धि को पा लिया’ कहकर संदर्भ को स्पष्ट करना।
  rationale: इब्रानी व्याकरण स्त्रीलिंग संदर्भ दिखाता है और सिराख में बुद्धि का स्त्रीरूप में चित्रण सामान्य है, पर इस पद में संज्ञा को जोड़ देना मूल की अंतर्निहितता को आवश्यकता से अधिक स्पष्ट कर देता।
- issue: इब्रानी और यूनानी पाठ-रूपों का अंतर
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ में अनूदित कर यूनानी रूप को पादटिप्पणी में देना।
  alternative: यूनानी के अनुसार ‘मैंने थोड़ा परिश्रम किया और अपने लिए बहुत विश्राम पाया’ अनूदित करना।
  rationale: यहाँ इब्रानी पाठ उच्च विश्वास के साथ उपलब्ध है और परियोजना में वही प्राथमिक स्रोत है; यूनानी का अर्थ पर्याप्त भिन्न है, इसलिए उसे चुपचाप मिलाने के बजाय पारदर्शी रूप से नोट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसमें दृढ़ बना रहा’ शाब्दिक ‘उसमें खड़ा रहा’ की तुलना में perseverance का प्रसंगगत भाव स्पष्ट करता है, जबकि स्त्रीलिंग संदर्भ को अनावश्यक रूप से नामित नहीं करता।
