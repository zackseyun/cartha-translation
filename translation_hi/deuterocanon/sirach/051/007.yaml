translation:
  language: hi
  text: मैंने चारों ओर देखा, पर मेरी सहायता करने वाला कोई न था; मैंने किसी सहारा देने वाले को खोजा[a], पर कोई न था।
  philosophy: optimal-equivalence
  footnotes:
