    text: यूनानी समानान्तर पाठ अधिक स्पष्ट रूप से कहता है, “मनुष्यों से सहायता की ओर देखता रहा, पर कोई न था।” मुख्य पाठ इब्रानी के अधिक संक्षिप्त कथन का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: मैंने चारों ओर देखा
  rationale: פנה का मूल भाव ‘मुड़ना’ है और סָבִיב उसे चारों दिशाओं में देखने का अर्थ देता है। शाब्दिक ‘मैं चारों ओर मुड़ा’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और खोजती हुई दृष्टि का भाव बनाए रखता है।
- source_word: עוֹזֵר
  choice: मेरी सहायता करने वाला
  rationale: इब्रानी कृदन्त किसी कार्यरत सहायक व्यक्ति को सूचित करता है। यह रूप उसके व्यक्तिवाचक और कर्तृवाचक भाव को स्पष्ट रखता है।
- source_word: וַאֲצַפֶּה
  choice: मैंने ... खोजा
  rationale: צפה में देखना, बाट जोहना या प्रतीक्षा करना सम्भव है। समानान्तर पंक्ति और यूनानी ἐμβλέπων यहाँ उपलब्ध सहारे की तलाश की ओर संकेत करते हैं; ‘खोजा’ प्रसंग में सहज है, यद्यपि मूल क्रिया की प्रतीक्षा-संबंधी छाया पूरी तरह निश्चित नहीं है।
- source_word: סוֹמֵךְ
  choice: किसी सहारा देने वाले
  rationale: סמך का कृदन्त ‘सहारा देने वाला’ या ‘समर्थन करने वाला’ व्यक्ति सूचित कर सकता है। इसे अमूर्त ‘सहारा’ बनाने के बजाय व्यक्तिवाचक रखना עוֹזֵר के साथ इब्रानी समानान्तरता को सुरक्षित रखता है।
- source_word: וְאָיִן
  choice: पर कोई न था
  rationale: संक्षिप्त अस्तित्ववाचक निषेध को स्वाभाविक हिन्दी में उतारते हुए मूल का जोर और पिछली पंक्ति से समानान्तरता बनाए रखी गई है।
