base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/023.yaml
  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: hi
  text: मेरी ओर मुड़ो[a], हे नासमझ लोगो[b], और मेरे शिक्षागृह में ठहरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे निकट आओ’; यूनानी समानांतर में है, ‘मेरे निकट आओ, हे अप्रशिक्षित लोगो, और शिक्षागृह में ठहरो।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘मूर्ख’, ‘नासमझ’, ‘भोले’ या ‘अशिक्षित’ लोग हो सकता है। यूनानी समानांतर शिक्षा न पाए हुए या अप्रशिक्षित लोगों के अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: मेरी ओर मुड़ो
  rationale: इब्रानी פנה का सीधा अर्थ ‘मुड़ना/ओर होना’ है। यह अनुवाद इब्रानी शब्दावली को बनाए रखता है; यूनानी समानांतर का ‘मेरे निकट आओ’ इसके आमंत्रणात्मक भाव की पुष्टि करता है।
- source_word: סְכָלִים
  choice: हे नासमझ लोगो
  rationale: यह शब्द मूर्ख, अनुभवहीन या शिक्षा से वंचित लोगों को सूचित कर सकता है। इस शिक्षापरक संदर्भ में ‘नासमझ’ मूल की तीक्ष्णता और सीखने की आवश्यकता—दोनों को रखता है, जबकि केवल नैतिक अपमान तक सीमित नहीं करता।
- source_word: וְלִינוּ
  choice: और ... ठहरो
  rationale: לין का अर्थ रात बिताना, टिकना या ठहरना है। ‘ठहरो’ आधुनिक हिन्दी में स्वाभाविक है और शिक्षा के स्थान में आकर बने रहने के रूपक को सुरक्षित रखता है।
- source_word: בְּבֵית מִדְרָשִׁי
  choice: मेरे शिक्षागृह में
  rationale: शाब्दिक भाव ‘मेरे अध्ययन/शिक्षा के घर में’ है। ‘शिक्षागृह’ संक्षिप्त और गरिमापूर्ण ढंग से शिक्षा पाने के स्थान को व्यक्त करता है तथा बाद के तकनीकी ‘बेइत मिद्राश’ अर्थ को अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: סְכָלִים को नैतिक भर्त्सना (‘मूर्खो’) माना जाए या शिक्षा/समझ की कमी का संकेत
  choice: हे नासमझ लोगो
  alternative: हे मूर्खो; हे अनपढ़ लोगो; हे भोले लोगो
  rationale: ज्ञान-शिक्षा के इस आमंत्रण में शब्द में नकारात्मक मूल्यांकन अवश्य है, पर मुख्य बल सीखने की आवश्यकता पर है। यूनानी ἀπαίδευτοι भी अशिक्षित/अप्रशिक्षित अर्थ का समर्थन करता है। ‘नासमझ’ इस तनाव को किसी एक अर्थ में पूरी तरह सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आमंत्रणात्मक और गरिमापूर्ण शैली। ‘शिक्षागृह’ मूल के ‘अध्ययन/शिक्षा के घर’ को सहज रूप में व्यक्त करता है; पदचिह्न [a] और [b] मुख्य पाठ में दिए गए हैं।
