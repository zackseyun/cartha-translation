  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: hi
  text: क्योंकि उसने मुझे हर बुराई से छुड़ाया[a] और संकट के दिन मुझे बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्योंकि तूने मुझे विनाश से बचाया और बुरे समय से छुड़ाया।” इब्रानी में “हर बुराई से” और “संकट के दिन” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: उसने मुझे…छुड़ाया
  rationale: פדה में छुड़ाने अथवा मूल्य देकर मुक्त करने का भाव है। यहाँ ‘छुड़ाया’ इस विशिष्ट उद्धार-भाव को स्वाभाविक हिन्दी में रखता है और अगले समानांतर क्रियापद ‘बचाया’ से भेद भी बनाए रखता है।
- source_word: מִכָּל רָע
  choice: हर बुराई से
  rationale: רָע नैतिक बुराई, हानि या विपत्ति को सूचित कर सकता है। ‘हर बुराई’ मूल की व्यापकता और संभावित अर्थ-तनाव को किसी एक प्रकार की विपत्ति तक सीमित नहीं करता।
- source_word: וַיְמַלְּטֵנִי
  choice: मुझे बचाया
  rationale: מלט का यहाँ भाव किसी को संकट से निकालकर सुरक्षित करने का है। ‘बचाया’ आधुनिक हिन्दी में सहज है और पंक्ति के समानांतर उद्धार-भाव को स्पष्ट रखता है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह इब्रानी का ठोस काल-सूचक मुहावरा है। ‘संकट के दिन’ उसके रूप को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और बोधगम्य है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर में प्राथमिकता
  choice: विद्यमान इब्रानी पाठ को मुख्य पाठ मानकर अनुवाद किया गया और यूनानी को अर्थ-जाँच तथा पाठांतर के रूप में रखा गया।
  alternative: 'यूनानी के अनुसार: ‘क्योंकि तूने मुझे विनाश से बचाया और बुरे समय से छुड़ाया।’'
  rationale: यहाँ इब्रानी पाठ सुवाच्य और सुसंगत है, इसलिए मुख्य अनुवाद उसी पर आधारित है। यूनानी में व्यक्ति और वाक्यांश दोनों कुछ भिन्न हैं; इस वास्तविक पाठांतर को मुख्य पाठ में मिलाकर समाप्त करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल रखी गई है। ‘छुड़ाया’ और ‘बचाया’ निकटार्थी होते हुए भी मूल के दो अलग क्रियापदों का भेद बनाए रखते हैं।
