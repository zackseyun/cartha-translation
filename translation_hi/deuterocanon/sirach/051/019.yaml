translation:
  language: hi
  text: मेरी आत्मा उससे अनुरक्त हुई, और मैंने अपना मुँह उससे नहीं मोड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַשְׁקָה
  choice: लिपटी रही
  rationale: क्रिया חשׁק गहरी आसक्ति, अनुराग या दृढ़ लगाव व्यक्त करती है। यहाँ ‘लिपटी रही’ इस सक्रिय और निरंतर लगाव को स्वाभाविक हिन्दी में प्रकट करता है और संदर्भ में बुद्धि के प्रति समर्पण बनाए रखता है।
- source_word: נַפְשִׁי
  choice: मेरी आत्मा
  rationale: נפשׁ व्यक्ति के भीतरी प्राण या स्वयं को सूचित कर सकता है; ‘मेरी आत्मा’ मूल रूपक और गरिमापूर्ण बाइबलीय भाषा को सुरक्षित रखता है।
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: और मैंने उससे अपना मुँह नहीं मोड़ा
  rationale: मूल इब्रानी के ‘अपना मुख फेरना’ मुहावरे को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; इसका अर्थ उससे विमुख न होना है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम का संदर्भ
  choice: ‘उससे’ के द्वारा स्त्रीलिंग संदर्भ को प्रसंग पर निर्भर रहने दिया गया
  alternative: ‘बुद्धि से’ को स्पष्ट रूप से दोहराना
  rationale: इब्रानी में מִמֶּנָּה स्त्रीलिंग एकवचन है, जो पूर्ववर्ती प्रसंग में व्यक्तिरूप बुद्धि की ओर संकेत करता है। मूल पद सर्वनाम ही प्रयोग करता है, इसलिए अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य। मूल के आत्मा, आसक्ति और मुख न मोड़ने के रूपकों को बनाए रखा गया है।
