translation:
  language: hi
  text: मैं तेरे नाम का धन्यवाद करता हूँ, क्योंकि तू मेरा आश्रय और सहायक बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: धन्यवाद करता हूँ
  rationale: इस स्तुतिपरक प्रसंग में क्रिया कृतज्ञता व्यक्त करने का अर्थ देती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τῷ ὀνόματί σου
  choice: तेरे नाम का
  rationale: यूनानी पदबंध का सीधा और सहज हिन्दी रूप, जिसमें ‘नाम’ व्यक्ति और उसकी प्रकट पहचान का प्रतिनिधित्व करता है।
- source_word: σκεπαστής
  choice: आश्रय
  rationale: शब्द रक्षा देने वाले या आड़ प्रदान करने वाले को सूचित करता है; ‘आश्रय’ इस चित्र को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: βοηθός
  choice: सहायक
  rationale: मूल अर्थ ‘सहायता करने वाला’ है; ‘सहायक’ सामान्य आधुनिक हिन्दी में सटीक है।
- source_word: ἐγένου μοι
  choice: मेरा … बना
  rationale: ‘तू मेरे लिए हुआ’ की शाब्दिक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है और बनने/सिद्ध होने की क्रियात्मकता बनाए रखता है।
theological_decisions:
- issue: सम्बोधन में आदरसूचक स्तर
  choice: तेरे/तू
  alternative: आपके/आप
  rationale: बाइबिलीय प्रार्थना की निकटता और एकवचन सम्बोधन को बनाए रखने के लिए गरिमापूर्ण अनौपचारिक रूप चुना गया; इससे ईश्वर के प्रति अनादर अभिप्रेत नहीं है।
- issue: हिब्रू और यूनानी स्रोत-साक्ष्य में पद-सीमा का बड़ा अंतर
  choice: दिए गए यूनानी समानांतर और संदर्भ से मेल खाने वाली संक्षिप्त पंक्ति का अनुवाद
  alternative: दिए गए मिश्रित हिब्रू पाठ की सभी उद्धार-विषयक पंक्तियों को इसी पद में सम्मिलित करना
  rationale: हिब्रू अंश विषयवस्तु और पद-सीमा में आगे की सामग्री समेटता प्रतीत होता है, जबकि यूनानी समानांतर ठीक Sirach 51:2 और परामर्शी अंग्रेज़ी पाठ से मेल खाता है। अतिरिक्त पंक्तियाँ जोड़ना इस निर्दिष्ट पद की सीमा को अनिश्चित रूप से विस्तृत कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, संक्षिप्त और गरिमापूर्ण शैली। वाक्य में मूल का प्रथम-पुरुष धन्यवाद और ईश्वर के आश्रय तथा सहायता बनने की समानांतर छवि सुरक्षित रखी गई है।
