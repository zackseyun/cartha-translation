base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/021.yaml
  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: hi
  text: मेरी अंतड़ियाँ उसे देखते हुए तंदूर की तरह तप उठीं; इसलिए मैं उसे नहीं छोड़ूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “और उसे खोजने के लिए मेरा उदर व्याकुल हुआ; इसलिए मैंने एक उत्तम संपत्ति प्राप्त की।”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: मेरी अंतड़ियाँ
  rationale: यह शब्द शाब्दिक रूप से शरीर के भीतरी अंगों को दर्शाता है और गहरी आंतरिक भावना का बिंब भी है। ‘अंतड़ियाँ’ मूल शारीरिक रूपक को बनाए रखता है।
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: भट्ठी के समान तप उठीं
  rationale: क्रिया गरम होने या तपने को और תַּנּוּר आग से गरम किए जाने वाले चूल्हे/तंदूर को दर्शाता है। हिंदी में ‘भट्ठी के समान तप उठीं’ तीव्रता और काव्यात्मक बिंब को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהַבִּיט בָּהּ
  choice: उसे निहारने के लिए
  rationale: לְ उपसर्ग उद्देश्य का अर्थ दे सकता है और הביט ב का अर्थ उसकी ओर ध्यान से देखना है। ‘निहारने के लिए’ इस अर्थ को सहज हिंदी में रखता है, यद्यपि कारण/समय का संबंध भी संभव है।
- source_word: בַּעֲבוּר כֵּן
  choice: इसलिए
  rationale: यह पदबंध पिछले कथन से निकलने वाले परिणाम को व्यक्त करता है; ‘इसलिए’ संक्षिप्त और स्वाभाविक है।
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: मैं उसे नहीं छोड़ूँगा
  rationale: עזב का सीधा अर्थ छोड़ना या त्यागना है। ‘नहीं छोड़ूँगा’ आधुनिक हिंदी में स्पष्ट है और स्त्रीलिंग प्रत्यय द्वारा ज्ञान की ओर संकेत बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ के अंतिम भाग में बड़ा अंतर
  choice: 'मुख्य पाठ में इब्रानी: ‘इसलिए मैं उसे नहीं छोड़ूँगा।’'
  alternative: 'यूनानी: ‘इसलिए मैंने एक उत्तम संपत्ति प्राप्त की।’'
  rationale: जहाँ विश्वसनीय इब्रानी पाठ उपलब्ध है, उसे मुख्य पाठ में प्राथमिकता दी गई है। अर्थपूर्ण यूनानी भिन्नता को पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। शारीरिक रूपक को जानबूझकर बनाए रखा गया है। ‘ज्ञान’ का स्त्रीलिंग व्यक्तित्व ‘उसे’ में सुरक्षित है; पाठ से बाहर कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
