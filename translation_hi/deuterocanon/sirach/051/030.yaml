base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: hi
  text: धार्मिकता से अपने काम करो, और वह तुम्हें तुम्हारा प्रतिफल उचित समय पर[a] देगा। याहवे युगानुयुग धन्य है, और उसका नाम पीढ़ी-दर-पीढ़ी प्रशंसित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके समय पर’; हिब्रू בְּעִתּוֹ और यूनानी ἐν καιρῷ αὐτοῦ का अर्थ प्रतिफल का उचित समय हो सकता है; सर्वनाम को परमेश्वर के समय से संबंधित भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: अपने काम ... करो
  rationale: संज्ञा और उसी मूल की क्रिया के हिब्रू प्रयोग को शब्दशः दोहराने के बजाय यह स्वाभाविक हिन्दी में आज्ञार्थक भाव और व्यावहारिक अर्थ दोनों रखता है।
- source_word: בִצְדָקָה
  choice: धार्मिकता से
  rationale: यहाँ בְּ रीति या ढंग को व्यक्त करता है। ‘धार्मिकता’ नैतिक और ईश्वर-संबंधी आशय को बनाए रखता है, जबकि ‘से’ हिन्दी में कार्य करने के ढंग को स्वाभाविक रूप से बताता है।
- source_word: וְהוּא
  choice: और वह
  rationale: हिब्रू की तरह सर्वनाम को बनाए रखा गया है; संदर्भ में इसका संकेत परमेश्वर की ओर है, पर अनावश्यक रूप से नाम जोड़कर पाठ को अधिक स्पष्ट नहीं किया गया।
- source_word: נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: तुम्हें तुम्हारा प्रतिफल ... देगा
  rationale: שְׂכַר के लिए ‘प्रतिफल’ ज्ञान-साहित्य के नैतिक संदर्भ में उपयुक्त है और केवल व्यावसायिक मजदूरी का भाव नहीं देता। वर्तमान कृदंत का यहाँ प्रतिज्ञात्मक भाव हिन्दी भविष्यकाल से व्यक्त किया गया है।
- source_word: בְּעִתּוֹ
  choice: उसके समय पर
  rationale: यह रूप ‘उसके/इसके समय में’ कहता है। हिन्दी में ‘उसके’ का संबंध प्रतिफल अथवा परमेश्वर से सुना जा सकता है, इसलिए मूल की वास्तविक संदिग्धता बनी रहती है।
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: याहवे सदा धन्य है
  rationale: हिब्रू के विधेयात्मक आशीर्वाद-वाक्य को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है तथा याहवे नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: और उसका नाम पीढ़ी-दर-पीढ़ी प्रशंसित है
  rationale: यह अनुवाद पिछले खंड के समानांतर स्तुतिपरक लय को रखता है और לְדֹר וָדֹר के लगातार पीढ़ियों तक बने रहने वाले अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना व्यक्तिगत वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: צְדָקָה के नैतिक-धर्मवैचारिक स्वर का निर्वाह
  choice: धार्मिकता
  alternative: न्याय; जो उचित है
  rationale: पद परमेश्वर के सामने सही आचरण का आह्वान करता है। ‘धार्मिकता’ मुख्य शब्द की नैतिक और ज्ञान-साहित्यिक गहराई रखता है, पर उसे किसी विशिष्ट सम्प्रदायगत सिद्धांत तक सीमित नहीं करता।
- issue: בְּעִתּוֹ में सर्वनाम का संदर्भ
  choice: उसके समय पर
  alternative: उचित समय पर; उसके ठहराए समय पर
  rationale: हिब्रू और यूनानी समानांतर दोनों में समय को सूचित करने वाला सर्वनाम प्रतिफल के उचित समय या परमेश्वर के समय की ओर समझा जा सकता है। मुख्य पाठ में इस तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली अपनाई गई है। ‘धार्मिकता’, ‘प्रतिफल’ और ‘प्रशंसित’ जैसे परिचित औपचारिक शब्द मूल के नैतिक तथा स्तुतिपरक स्वर को बनाए रखते हैं; वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
