  text: In her I made progress, and I will give glory to the one who gives me wisdom[b][a].
translation:
  language: hi
  text: उसका जूआ मेरे लिए सम्मान की बात था,[a] और मैं अपने शिक्षकों को धन्यवाद दूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ कठिन है और यूनानी से उल्लेखनीय रूप से भिन्न है। इब्रानी का आशय लगभग ‘उसका जूआ मेरे लिए सम्मान की बात था’ है; यूनानी में है, ‘उसमें मैंने उन्नति की।’
    reason: textual_variant
  - marker: b
    text: इब्रानी में ‘मेरे शिक्षकों को धन्यवाद दूँगा’ है। यूनानी में है, ‘मुझे बुद्धि देनेवाले को मैं महिमा दूँगा।’
    reason: textual_variant
lexical_decisions:
- source_word: עֻלָּהּ
  choice: उसका जूआ
  rationale: प्राप्त इब्रानी पाठ को प्राथमिकता देते हुए इसे עֹל (‘जूआ’) के सप्रत्यय रूप के तौर पर समझा गया है। स्त्रीलिंग ‘उसका’ प्रसंग में व्यक्तिरूप बुद्धि की ओर संकेत करता है। पाठ कठिन है, इसलिए यूनानी समानांतर का भिन्न पाठ पादटिप्पणी में दिया गया है।
- source_word: הָיָה לִי לְכָבוֹד
  choice: मेरे लिए सम्मान की बात था
  rationale: शाब्दिक अर्थ ‘मेरे लिए सम्मान हेतु था’ है। यह हिन्दी प्रयोग मूल के ‘सम्मान/गौरव’ के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִמְלַמְּדַי
  choice: अपने शिक्षक को
  rationale: यह रूप ‘मुझे सिखानेवाले/मेरे शिक्षक’ का अर्थ दे सकता है; वचन की संभावित अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है। इसे स्पष्ट रूप से परमेश्वर मानकर अनूदित नहीं किया गया।
- source_word: הוֹדָאָה
  choice: धन्यवाद
  rationale: इब्रानी संज्ञा यहाँ धन्यवाद या कृतज्ञता व्यक्त करने के अर्थ में है; इसलिए यूनानी δόξαν (‘महिमा’) के बजाय इब्रानी अर्थ को मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: ‘मेरे शिक्षक’ का अभिप्राय
  choice: अभिप्राय को अनिर्धारित रखा गया है
  alternative: इसे स्पष्ट रूप से परमेश्वर, बुद्धि देनेवाला, अथवा अनेक मानवीय शिक्षक मानना
  rationale: इब्रानी पाठ शिक्षक की भाषा रखता है, जबकि यूनानी में ‘मुझे बुद्धि देनेवाला’ है। मुख्य पाठ किसी एक धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
- issue: इब्रानी और यूनानी पाठों का प्रमुख अंतर
  choice: उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ को मुख्य पाठ बनाया गया है
  alternative: यूनानी के अनुसार ‘उसमें मैंने उन्नति की; मुझे बुद्धि देनेवाले को मैं महिमा दूँगा’
  rationale: मूल-भाषा इब्रानी साक्ष्य को पहले स्थान पर रखते हुए वास्तविक पाठांतर को पादटिप्पणी में स्पष्ट रूप से सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘जूआ’ बाइबलीय रूपक को बनाए रखता है; ‘सम्मान की बात’ अस्वाभाविक शाब्दिक संरचना से बचते हुए इब्रानी לכבוד का भाव देता है।
