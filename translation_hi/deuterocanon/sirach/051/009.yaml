base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/009.yaml
  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
translation:
  language: hi
  text: और मैंने धरती से अपनी आवाज़ उठाई[a], और शेओल[b] के फाटकों से सहायता के लिए पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश से।’ इब्रानी में ‘धरती/देश से’ है, जबकि यूनानी समानांतर में ‘धरती पर’ मिलता है; यह पाठ-साक्ष्यों का छोटा-सा अंतर है।
    reason: textual_variant
  - marker: b
    text: ‘शेओल’ मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है; इसका अनुवाद ‘अधोलोक’ या ‘कब्र’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים
  choice: मैंने…उठाई
  rationale: रום का यह रूप उठाने का भाव देता है; ‘अपनी आवाज़ उठाई’ हिन्दी में स्वाभाविक है और इब्रानी बिंब को बनाए रखता है।
- source_word: מֵאֶרֶץ
  choice: धरती से
  rationale: מן के साथ אֶרֶץ का सीधा अर्थ ‘धरती/देश से’ है। व्यापक काव्यात्मक अर्थ के कारण ‘धरती से’ चुना गया; यूनानी समानांतर में ‘धरती पर’ मिलता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: קוֹלִי
  choice: अपनी आवाज़
  rationale: קוֹל का सामान्य अर्थ ‘आवाज़’ है। ‘पुकार’ कहने से दूसरे खंड का व्याकुल निवेदन पहले ही खंड में आ जाता, इसलिए सीधा अर्थ रखा गया।
- source_word: וּמִּשַּׁעֲרֵי
  choice: और…के फाटकों से
  rationale: שַׁעַר का बहुवचन संबंध रूप शाब्दिक रूप से ‘के फाटकों’ है। यह मृत्यु-जगत की दहलीज़ का ठोस काव्य-बिंब सुरक्षित रखता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: इब्रानी पारिभाषिक नाम को लिप्यंतरित करने से उसे केवल ‘कब्र’ या बाद की किसी विशिष्ट परलोक-धारणा तक सीमित नहीं किया जाता।
- source_word: שִׁוַּעְתִּי
  choice: सहायता के लिए पुकारा
  rationale: שוע संकट में सहायता पाने के लिए पुकारने का भाव रखता है। यह हिन्दी प्रयोग क्रिया की निवेदनात्मक शक्ति को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; कब्र; मृतकों का लोक
  rationale: मूल इब्रानी शब्द बनाए रखने से मृतकों के लोक की प्राचीन काव्यात्मक अवधारणा सुरक्षित रहती है और पद को किसी अधिक संकीर्ण या बाद की परलोक-संबंधी शिक्षा के अनुसार नहीं ढाला जाता।
