base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: hi
  text: 'और मैं तेरी महिमा करूँगा: हे यहोवा[a], तू मेरा पिता है, क्योंकि तू मेरा पराक्रमी उद्धारकर्ता है। संकट के दिन मुझे निर्बल न पड़ने दे[b], विनाश और उजाड़ के दिन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “मैंने प्रभु, अपने प्रभु के पिता, को पुकारा।” इब्रानी पाठ है: “हे यहोवा, तू मेरा पिता है।”'
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में है, “क्लेश के दिनों में मुझे न छोड़”; इब्रानी का अधिक शाब्दिक अर्थ है, “मुझे शिथिल न पड़ने दे” या “मुझे निर्बल न पड़ने दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: और मैं तेरी महिमा करूँगा
  rationale: רומם का अर्थ ऊँचा करना अथवा महिमा करना है। प्रार्थना में निहित कर्म ‘तेरी’ को हिन्दी में स्पष्ट किया गया है; भविष्यत् संकल्प का भाव बनाए रखा गया है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को देवनागरी में लिप्यंतरित किया गया है; महत्वपूर्ण यूनानी पाठांतर पादटिप्पणी में दिया गया है।
- source_word: אָבִי
  choice: मेरा पिता
  rationale: उपलब्ध इब्रानी पाठ का सीधा अर्थ है ‘मेरा पिता’; यूनानी का भिन्न पाठ पादटिप्पणी में सुरक्षित है।
- source_word: גִּבּוֹר יִשְׁעִי
  choice: मेरे उद्धार का पराक्रमी
  rationale: גבור को संज्ञात्मक ‘पराक्रमी’ और ישעי को ‘मेरे उद्धार’ के रूप में रखा गया है। इससे सामर्थ्य का भाव बचता है, पर अनावश्यक रूप से युद्धवीर का अर्थ आरोपित नहीं होता।
- source_word: אַל תַּרְפֵּנִי
  choice: मुझे निर्बल न पड़ने दे
  rationale: רפה की ढीला या निर्बल पड़ने की छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है। यूनानी ‘मुझे न छोड़’ को मुख्य पाठ में मिलाए बिना पादटिप्पणी में रखा गया है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: צרה के क्लेश, विपत्ति या संकट के अर्थ को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: בּיוֹם שׁוֹאָה וּמְשׁוֹאָה
  choice: विनाश और उजाड़ के दिन
  rationale: दो निकटार्थक विपत्ति-संज्ञाओं को एक में समेटने के बजाय ‘विनाश’ और ‘उजाड़’ के रूप में अलग रखा गया है।
theological_decisions:
- issue: परमेश्वर को संबोधन में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी ‘हे यहोवा, तू मेरा पिता है’
  alternative: 'यूनानी: ‘मैंने प्रभु, अपने प्रभु के पिता, को पुकारा’'
  rationale: जहाँ इब्रानी पाठ उपलब्ध और सुसंगत है, उसे प्राथमिकता दी गई है; अर्थपूर्ण यूनानी पाठांतर को पादटिप्पणी में संरक्षित किया गया है।
- issue: אַל תַּרְפֵּנִי में निर्बल पड़ने और छोड़ दिए जाने का अंतर
  choice: इब्रानी के अनुसार ‘मुझे निर्बल न पड़ने दे’
  alternative: यूनानी के अनुसार ‘मुझे न छोड़’
  rationale: मुख्य पाठ רפה की निर्बल या शिथिल पड़ने की धारणा रखता है और यूनानी ἐγκαταλιπεῖν के परित्याग वाले अर्थ से उसका मौन सामंजस्य नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनामय हिन्दी। ‘तेरी/तू’ निकट और प्रत्यक्ष ईश्वरीय संबोधन को स्वाभाविक रूप से बनाए रखते हैं। समानांतर आपदा-संज्ञाओं को अलग रखा गया है, और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
