base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/003.yaml
  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: hi
  text: मेरे लड़खड़ाने की बाट जोहनेवालों के फंदे से[a], और मेरे प्राण लेने वालों के हाथ से। तूने मुझे बहुत-सी विपत्तियों से बचाया, और चारों ओर की ज्वाला के संकट से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पतन की बाट जोहनेवालों” अथवा “मेरी लंगड़ाहट पर नज़र रखनेवालों।” इब्रानी वाक्यांश मुहावरेदार है और उसका ठीक आशय कुछ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अधिक शब्दशः अर्थ है, “चारों ओर की ज्वाला के संकटों से।” यूनानी समानांतर यहाँ काफी भिन्न है और इसी शब्दावली को रखने के बजाय बचाव का विस्तृत वर्णन देता है।
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: फंदे से
  rationale: यह शब्द फंदे या जाल को दर्शाता है; ‘फंदा’ शत्रुओं द्वारा फँसाने के काव्यात्मक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צוֹפֵי צַלְעִי
  choice: मेरे लड़खड़ाने की बाट जोहनेवालों
  rationale: वाक्यांश शत्रुतापूर्वक किसी की ठोकर, लड़खड़ाहट या पतन की प्रतीक्षा करनेवालों को सूचित करता है। यह अनुवाद मुहावरे का आशय देता है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וּמִּיַד
  choice: और ... के हाथ से
  rationale: ‘हाथ’ शक्ति या नियंत्रण का इब्रानी मुहावरा है; इसे रखने से ठोस बिंब और समानांतरता बनी रहती है।
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: मेरे प्राण के खोजियों
  rationale: खतरे के इस संदर्भ में נֶפֶשׁ का अर्थ जीवन या प्राण है। ‘प्राण के खोजी’ जीवन लेने की मंशा व्यक्त करता है और काव्यात्मक शैली बनाए रखता है।
- source_word: מֵרַבּוֹת צָרוֹת
  choice: बहुत-सी विपत्तियों से
  rationale: רַבּוֹת को बहुवचनात्मक ‘बहुत-सी’ समझा गया है; צָרוֹת के लिए ‘विपत्तियाँ’ व्यापक संकट और दुःख को सहज हिन्दी में व्यक्त करता है।
- source_word: הוֹשַׁעְתָּנִי
  choice: तूने मुझे ... बचाया
  rationale: क्रिया प्रत्यक्ष उद्धार या बचाव को व्यक्त करती है। एकवचन ईश्वरीय संबोधन के लिए आदरपूर्ण साहित्यिक ‘तू’ रखा गया है।
- source_word: וּמִמְּצוּקוֹת שַׁלְהֶבֶת
  choice: और ... धधकती ज्वाला की घुटन से
  rationale: מְצוּקוֹת दबाव, तंगी या घोर व्याकुलता का बोध कराता है और שַׁלְהֶבֶת से रचनात्मक संबंध रखता है। ‘घुटन’ संकट के दबाव को व्यक्त करती है, जबकि ‘धधकती ज्वाला’ आग के ठोस बिंब को बचाए रखती है।
- source_word: מִסָּבִיב
  choice: चारों ओर की
  rationale: यह चारों ओर से घेरे हुए संकट का संकेत देता है; विशेषणात्मक रूप हिन्दी वाक्य में सहज है।
theological_decisions:
- issue: נַפְשִׁי को ‘मेरी आत्मा’ या ‘मेरे प्राण’ कहना
  choice: मेरे प्राण
  alternative: मेरी आत्मा
  rationale: शत्रुओं, फंदे और बचाव के प्रसंग में यह मुहावरा व्यक्ति के जीवन को लेने की चेष्टा बताता है; ‘आत्मा’ कहने से अनावश्यक तात्त्विक अर्थ जुड़ सकता है।
- issue: अंतिम पदबंध को शाब्दिक आग या रूपकात्मक क्लेश मानना
  choice: चारों ओर की धधकती ज्वाला की घुटन
  alternative: चारों ओर के अग्निमय संकट
  rationale: अनुवाद ज्वाला के ठोस बिंब और संकट के दबाव—दोनों को रखता है, और यह तय नहीं करता कि आग शाब्दिक है या रूपकात्मक। इब्रानी पाठ को प्राथमिकता दी गई है; यूनानी समानांतर यहाँ काफी भिन्न है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। परमेश्वर को एकवचन संबोधन में साहित्यिक ‘तू’ रखा गया है। ‘बाट जोहना’, ‘प्राण’ और ‘विपत्ति’ जैसे परिचित शब्द मूल की काव्यात्मक समानांतरता रखते हैं; कठिन इब्रानी पदबंधों की अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
