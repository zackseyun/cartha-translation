base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/025.yaml
  text: 'I opened my mouth and spoke of her: acquire wisdom for yourselves without silver[a].'
translation:
  language: hi
  text: मैंने अपना मुँह खोला और उसके विषय में कहा, “अपने लिए बिना चाँदी दिए बुद्धि प्राप्त करो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ स्त्रीलिंग सर्वनाम है, जो सम्भवतः स्त्री-रूप में मानवीकृत बुद्धि की ओर संकेत करता है। इसे अधिक अमूर्त अर्थ में विषय या शिक्षा के बारे में कहना भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  choice: मैंने अपना मुँह खोला
  rationale: यह बोलना आरम्भ करने का इब्रानी मुहावरा है। शाब्दिक रूप मूल की सजीवता बनाए रखता है और यूनानी समानांतर से भी मेल खाता है।
- source_word: וְדִבַּרְתִּי בָהּ
  choice: और उसके विषय में कहा
  rationale: स्त्रीलिंग एकवचन प्रत्यय का सबसे स्वाभाविक संकेत ‘बुद्धि’ की ओर है, जिसका यहाँ स्त्री-रूप में मानवीकरण हुआ है। ‘उसके विषय में’ इस संकेत को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: קְנוּ לָכֶם
  choice: अपने लिए ... प्राप्त करो
  rationale: קנה का अर्थ ‘खरीदना’ या व्यापक रूप से ‘प्राप्त करना’ हो सकता है। ‘बिना चाँदी दिए’ व्यापारिक रूपक को स्पष्ट रखता है, जबकि ‘प्राप्त करो’ बुद्धि अर्जित करने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह मूल शब्द का सीधा अर्थ है और पिछले स्त्रीलिंग संकेत के साथ वैचारिक निरंतरता बनाए रखता है।
- source_word: בְּלֹא כָסֶף
  choice: बिना चाँदी दिए
  rationale: इब्रानी में शाब्दिक रूप से ‘चाँदी के बिना’ है और यूनानी भी इसका समर्थन करता है। ‘दिए’ जोड़ने से हिन्दी में बिना मूल्य चुकाए प्राप्त करने का व्यापारिक बिंब स्पष्ट और स्वाभाविक बनता है।
theological_decisions:
- issue: וְדִבַּרְתִּי בָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: प्रत्यय को मानवीकृत ‘बुद्धि’ के लिए ‘उसके’ के रूप में सुरक्षित रखा गया है।
  alternative: इसे अधिक अमूर्त रूप में ‘उसके बारे में’, अर्थात विषय या शिक्षा के बारे में, समझा जा सकता है।
  rationale: इसके तुरंत बाद बुद्धि प्राप्त करने का आह्वान और सिराख में बुद्धि का सामान्य स्त्री-मानवीकरण इस संदर्भ का समर्थन करते हैं। यह व्याकरणिक और साहित्यिक संकेत को बचाता है, पर बाद की कोई धर्मसैद्धांतिक पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘मुँह खोला’ मूल मुहावरे की सजीवता, ‘उसके’ स्त्रीलिंग संकेत, और ‘चाँदी’ ठोस आर्थिक बिंब को सुरक्षित रखते हैं।
