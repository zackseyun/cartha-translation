base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/028.yaml
  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: hi
  text: 'बहुतों ने मेरी युवावस्था में मेरी शिक्षा सुनी, और मेरे माध्यम से[b] चाँदी और सोना अर्जित किया।[a]


    [a] यूनानी समानांतर पाठ में है: “बहुत-सी चाँदी के बदले शिक्षा ग्रहण करो, और उसके द्वारा बहुत सोना प्राप्त करो।” यहाँ इब्रानी पाठ आज्ञा नहीं, बल्कि कथन है।


    [b] या “मुझसे” / “मुझमें।” इब्रानी अभिव्यक्ति संक्षिप्त और संदिग्ध है। “मेरे माध्यम से” का अर्थ है कि वक्ता अथवा उसकी शिक्षा वह साधन थी जिससे दूसरों ने धन प्राप्त किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “बहुत-सी चाँदी के बदले शिक्षा ग्रहण करो, और उसके द्वारा बहुत सोना प्राप्त करो।” यहाँ इब्रानी पाठ आज्ञा नहीं, बल्कि कथन है।'
    reason: alternative_reading
  - marker: b
    text: या “मुझसे” / “मुझमें।” इब्रानी अभिव्यक्ति संक्षिप्त और संदिग्ध है। “मेरे माध्यम से” का अर्थ है कि वक्ता अथवा उसकी शिक्षा वह साधन थी जिससे दूसरों ने धन प्राप्त किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: बहुतों ने
  rationale: परिमाणवाचक शब्द को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: שָׁמְעוּ
  choice: सुनी
  rationale: मूल अर्थ सुनना है; “मानी” कहना आज्ञापालन का ऐसा भाव जोड़ देता जिसे क्रिया स्वयं अनिवार्य नहीं बनाती।
- source_word: לִמּוּדִי
  choice: मेरी शिक्षा
  rationale: ज्ञानोपदेश के प्रसंग में לימוד के शिक्षण अथवा उपदेश के भाव को स्पष्ट, गरिमापूर्ण हिन्दी में रखता है।
- source_word: בִּנְעֻרוֹתָי
  choice: मेरी युवावस्था में
  rationale: यौवन की अवधि बताने वाले इब्रानी बहुवचन भाव का स्वाभाविक हिन्दी रूप।
- source_word: וְכֶסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: दोनों बहुमूल्य धातुओं की ठोस छवि को यथावत रखता है; “धन” कहने से विशिष्टता मिट जाती।
- source_word: תִּקְנוּ
  choice: अर्जित किया
  rationale: קנה के प्राप्त करने अथवा हासिल करने के अर्थ को वस्तु “चाँदी और सोना” के साथ स्वाभाविक रूप देता है; “खरीदा” कहना यहाँ अनुपयुक्त होगा।
- source_word: בִּי
  choice: मेरे माध्यम से
  rationale: संदर्भ में साधन अथवा मध्यस्थता का सम्भावित भाव स्पष्ट करता है, जबकि पाठ-टिप्पणी “मुझसे” और “मुझमें” जैसे अधिक अक्षरशः विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: इब्रानी कथन और यूनानी आज्ञार्थक समानांतर के बीच भिन्नता
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वास वाले इब्रानी पाठ के अनुसार इसे कथन के रूप में रखना
  alternative: 'यूनानी के अनुसार: “बहुत-सी चाँदी देकर शिक्षा ग्रहण करो, और उसके द्वारा बहुत सोना प्राप्त करो।”'
  rationale: इब्रानी में क्रियाएँ पूर्णकालिक कथन बनाती हैं, जबकि यूनानी में आज्ञार्थ है। विद्यमान इब्रानी साक्ष्य को प्राथमिक रखते हुए वास्तविक पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
- issue: בִּי का संबंध वक्ता से है या उसकी शिक्षा से
  choice: “मेरे माध्यम से” द्वारा साधन का भाव देना, पर अस्पष्टता को पादटिप्पणी में बनाए रखना
  alternative: “मुझसे” या “मुझमें”
  rationale: इब्रानी वाक्यांश संक्षिप्त है और कई संबंध व्यक्त कर सकता है। यूनानी “उसके द्वारा/उसमें” इसे शिक्षा से जोड़ता है, पर इब्रानी प्रथम पुरुष को सीधे वक्ता से जोड़ता है; इसलिए मुख्य पाठ अर्थगम्य है, पर विकल्प दबाए नहीं गए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर। वाक्यरचना इब्रानी के दो समन्वित खंडों को बनाए रखती है; कठिन पाठगत और व्याकरणिक भिन्नताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
