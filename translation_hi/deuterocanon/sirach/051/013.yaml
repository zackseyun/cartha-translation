base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: hi
  text: जब मैं युवा था, तब मैंने बुद्धि से प्रेम किया[a]; मैंने उसे चाहा और उसकी खोज की। मैं निष्ठा से चला[b]; हे प्रभु, मैंने युवावस्था से ही बुद्धि सीखी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और मैंने बुद्धि से प्रेम किया’ इब्रानी संस्करण में कोष्ठकों में दिया गया है; इससे इस वाक्यांश की पाठगत स्थिति अनिश्चित होने का संकेत मिलता है।
    reason: textual_uncertainty
  - marker: b
    text: 'इब्रानी का शाब्दिक अर्थ: ‘उसकी सच्चाई/निष्ठा में मेरा पाँव चला।’ ‘सच्चाई में’ भी सम्भव है।'
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी समानांतर पाठ उल्लेखनीय रूप से भिन्न है: ‘जब मैं अभी युवा था, भटकने से पहले, मैंने अपनी प्रार्थना में खुलकर बुद्धि को खोजा।’ मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר
  choice: युवक
  rationale: यह शब्द वक्ता की युवावस्था को दर्शाता है। ‘युवक’ आधुनिक हिन्दी में सहज है और इब्रानी के पुल्लिंग रूप को बनाए रखता है।
- source_word: וָאוֹהַב חָכְמָה
  choice: मैंने बुद्धि से प्रेम किया
  rationale: कोष्ठकबद्ध इब्रानी पाठ का सीधा अर्थ यही है। पाठगत अनिश्चितता को पादटिप्पणी में बताया गया है, यूनानी पाठ से मिलाकर मुख्य पाठ को बदला नहीं गया।
- source_word: וְחָפַצְתִּי בָהּ
  choice: मैंने उसे चाहा
  rationale: חפץ में चाहने, प्रसन्न होने या अभिलाषा रखने का भाव है। स्त्रीलिंग सर्वनाम ‘उसे’ बुद्धि के व्यक्तिरूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּבִקַּשְׁתִיהָ
  choice: उसकी खोज की
  rationale: בקש सक्रिय और उद्देश्यपूर्ण खोज को व्यक्त करता है; यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּאֲמִתָּהּ
  choice: उसकी सच्चाई में
  rationale: रूप में स्त्रीलिंग एकवचन प्रत्यय है, जिसका निकटतम संदर्भ ‘बुद्धि’ है। אמת का अर्थ ‘सच्चाई’ या ‘निष्ठा’ हो सकता है; मुख्य पाठ सच्चाई को रखता है और विकल्प पादटिप्पणी में देता है।
- source_word: דָּרְכָה רַגְלִי
  choice: मेरा पाँव चला
  rationale: इब्रानी के मूर्त मुहावरे ‘मेरा पाँव चला/रौंदता गया’ को बनाए रखते हुए हिन्दी में समझने योग्य रूप दिया गया है।
- source_word: מִנְּעוּרַי
  choice: युवावस्था से ही
  rationale: यह किसी अभ्यास के आरम्भ-बिंदु को दिखाता है; ‘से ही’ उस निरंतरता पर स्वाभाविक बल देता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यहाँ पद प्रत्यक्ष संबोधन के रूप में है; ‘हे प्रभु’ हिन्दी में स्पष्ट और गरिमापूर्ण संबोधन है।
- source_word: לָמַדְתִּי
  choice: मैंने ... सीखी
  rationale: क्रिया का सामान्य सक्रिय अर्थ ‘सीखना’ है। ‘अध्ययन किया’ अर्थ को संकरा करता और ‘मुझे सिखाया गया’ वाच्य बदल देता।
theological_decisions:
- issue: इब्रानी साक्ष्य और भिन्न यूनानी समानांतर पाठ
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: ‘जब मैं अभी जवान ही था, भटकने से पहले, मैंने अपनी प्रार्थना में खुले रूप से बुद्धि को खोजा।’'
  rationale: सिराख का इब्रानी पाठ उपलब्ध होने पर उसे प्राथमिकता दी गई है। यूनानी में शब्दावली और कथन उल्लेखनीय रूप से भिन्न हैं, इसलिए दोनों को मिलाकर कृत्रिम पाठ बनाने के बजाय यूनानी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בַּאֲמִתָּהּ में स्त्रीलिंग प्रत्यय का संबंध
  choice: ‘उसकी सच्चाई’ को बुद्धि से संबद्ध रखना
  alternative: प्रत्यय को स्पष्ट न करते हुए ‘सच्चाई में’ या नैतिक भाव से ‘निष्ठा से’
  rationale: इब्रानी रूप में ‘उसकी’ का संकेत मौजूद है और निकटतम स्त्रीलिंग संज्ञा ‘बुद्धि’ है। फिर भी אמת की अर्थ-सीमा खुली रखने के लिए ‘निष्ठा’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और हल्का काव्यात्मक गद्य रखा गया है। ‘बुद्धि’ के लिए स्त्रीलिंग संदर्भ स्वाभाविक हिन्दी व्याकरण के अनुरूप है; ‘मेरा पाँव चला’ इब्रानी की ठोस काव्यात्मक छवि को सुरक्षित रखता है।
