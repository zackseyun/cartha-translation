base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/022.yaml
  text: Yahweh has given me the reward of my lips[b][a]; therefore I acquired her as a good possession.
translation:
  language: hi
  text: यहोवा ने मुझे मेरे होंठों का प्रतिफल दिया है;[a] इसलिए मैंने उसे एक उत्तम संपत्ति के रूप में प्राप्त किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ है, “प्रभु ने मुझे मेरे प्रतिफल के रूप में जीभ दी, और उससे मैं उसकी स्तुति करूँगा।”
    reason: alternative_reading
  - marker: b
    text: “उसे” आसपास के प्रसंग में बुद्धि की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को आधुनिक हिन्दी में प्रचलित और स्पष्ट रूप में रखा गया है।
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: मेरे होंठों का प्रतिफल
  rationale: मूल के ठोस बिंब और उसकी संभावित अर्थगत खुली प्रकृति को बनाए रखता है; इसे केवल ‘मेरी स्तुति का प्रतिफल’ कहकर सीमित नहीं किया गया।
- source_word: בַּעֲבוּר כֵּן
  choice: इसलिए
  rationale: इब्रानी पदबंध के कारण-परिणाम संबंध को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: קְנִיתִיהָ
  choice: मैंने उसे ... प्राप्त किया
  rationale: क्रिया के ‘अर्जित/प्राप्त करना’ अर्थ को रखता है, पर अनावश्यक रूप से खरीद-बिक्री का भाव नहीं थोपता; स्त्रीलिंग प्रत्यय संदर्भ में बुद्धि की ओर संकेत करता है।
- source_word: קִנְיָן טוֹב
  choice: एक उत्तम संपत्ति के रूप में
  rationale: קנה और קנין के शब्द-संबंध को हिन्दी में पूरी तरह दोहराना कठिन है; यह चयन स्वाभाविक रहते हुए मूल्यवान प्राप्ति और स्वामित्व दोनों का भाव देता है।
- source_word: αἰνέσω αὐτόν
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: जीवित इब्रानी पाठ को प्राथमिकता दी गई है; भिन्न यूनानी पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच भिन्नता
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण: यहोवा प्रतिफल देता है और वक्ता बुद्धि को उत्तम संपत्ति के रूप में प्राप्त करता है।'
  alternative: 'यूनानी: “प्रभु ने मुझे मेरे प्रतिफल के रूप में जीभ दी, और उससे मैं उसकी स्तुति करूँगा।”'
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिक मानते हुए वास्तविक पाठांतर को दबाया नहीं गया, बल्कि पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: स्त्रीलिंग कर्म-प्रत्यय का संदर्भ
  choice: ‘उसे’ को आसपास के प्रसंग की ‘बुद्धि’ से संबंधित माना गया।
  alternative: सर्वनाम का संदर्भ अनिर्दिष्ट छोड़ना।
  rationale: इब्रानी में स्त्रीलिंग प्रत्यय स्पष्ट है और संदर्भ बुद्धि की ओर संकेत करता है; फिर भी मुख्य पाठ में व्याख्यात्मक संज्ञा जोड़ने के बजाय सर्वनाम रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘होंठों’ का इब्रानी बिंब और ‘उसे’ की संदर्भगत खुली प्रकृति सुरक्षित रखी गई है; वाक्य को अत्यधिक संस्कृतनिष्ठ या व्यावसायिक शब्दावली से बचाया गया है।
