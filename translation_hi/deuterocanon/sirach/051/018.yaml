  yaml_path: translation/deuterocanon/sirach/051/018.yaml
  text: I planned to improve my way[a], and I will not turn back, for I will find it.
translation:
  language: hi
  text: मैंने अपनी राह सुधारने की योजना बनाई[a], और मैं पीछे नहीं हटूँगा, क्योंकि मैं उसे पा लूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ है: “क्योंकि मैंने उसे करने का निश्चय किया, मैं भलाई के प्रति उत्साही था, और मैं निश्चय ही लज्जित न होऊँगा।” यह उपलब्ध इब्रानी से काफ़ी भिन्न पाठ-रूप को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  choice: मैंने ... निश्चय किया
  rationale: क्रिया सोचने, विचार करने या योजना बनाने को व्यक्त करती है; यहाँ नैतिक उद्देश्य के संदर्भ में ‘निश्चय किया’ जानबूझकर लिए गए संकल्प को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהִיטֶיב [דַּרְכִּי]
  choice: अपनी राह सुधारने का
  rationale: हिफ़ील रूप ‘अच्छा करना/बेहतर बनाना’ बताता है और ‘मेरी राह’ उसके साथ जीवन-आचरण सुधारने का अर्थ देता है। ‘राह’ मूल रूपक को बनाए रखती है, जबकि ‘सुधारने’ से आशय सहज रूप से स्पष्ट होता है।
- source_word: וְלֹא אַהֲפֹךְ
  choice: और मैं पीछे नहीं हटूँगा
  rationale: यह कठिन पाठ चुने हुए मार्ग से न पलटने का भाव देता है। ‘पीछे नहीं हटूँगा’ आधुनिक हिन्दी में दृढ़ता को स्पष्ट करता है और क्रिया के पलटने वाले बिंब को बनाए रखता है।
- source_word: כִּי אֶמְצָאֶנּוּ
  choice: क्योंकि मैं उसे पा लूँगा
  rationale: מצא का अर्थ ‘पाना/खोजना’ हो सकता है। पुल्लिंग एकवचन प्रत्यय का संदर्भ स्पष्ट नहीं है; ‘उसे’ इस वास्तविक अस्पष्टता को बनाए रखता है और ज्ञान अथवा भलाई जैसे संभावित संदर्भ को निश्चित नहीं करता।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ के अंत में बड़ा अंतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी को अपनाया गया: ‘और मैं पीछे नहीं हटूँगा, क्योंकि मैं उसे पा लूँगा।’'
  alternative: 'यूनानी: ‘क्योंकि मैंने उसे करने का निश्चय किया, मैं भलाई के लिए उत्साही हुआ, और मैं निश्चय ही लज्जित न होऊँगा।’'
  rationale: सीराख का उपलब्ध इब्रानी पाठ यहाँ प्राथमिक साक्ष्य है। यूनानी एक पर्याप्त भिन्न पाठ-रूप प्रस्तुत करता है; इसलिए उसे मुख्य पाठ में मिलाने के बजाय पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘राह’ इब्रानी रूपक को सुरक्षित रखती है; ‘निश्चय किया’ और ‘पीछे नहीं हटूँगा’ सामान्य पाठक के लिए स्वाभाविक हैं।
