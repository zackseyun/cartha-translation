translation:
  language: hi
  text: यदि विपत्ति तुम्हें आ घेरे[a], तो वह तुम्हारे विरुद्ध हो जाएगा और तुमसे छिपेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यदि तुम दीन दशा में आ जाओ,” जबकि इब्रानी में है: “यदि विपत्ति तुम्हें आ घेरे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: यदि विपत्ति तुम्हें आ घेरे
  rationale: תַּשִּׂיגְךָ का अर्थ ‘तुम्हें जा पकड़े/आ घेरे’ और רָעָה का प्रसंगानुसार अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति है। यह रूप मूल की सजीव छवि बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יֵהָפֵךְ בְּךָ
  choice: वह तुम्हारे विरुद्ध हो जाएगा
  rationale: הפך के साथ ב संबंध में प्रतिकूल पलटाव व्यक्त करता है; प्रसंग में कथित मित्र का विपत्ति के समय विरोधी हो जाना अभिप्रेत है।
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: और तुमसे छिपेगा
  rationale: शाब्दिक भाव ‘तुम्हारे सामने से अपने को छिपाएगा’ है। ‘तुमसे छिपेगा’ आधुनिक हिन्दी में उस जानबूझकर बचने और ओझल होने के भाव को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ में आरम्भिक शर्त का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी ‘यदि विपत्ति तुम्हें आ घेरे’ का अनुसरण किया गया।
  alternative: 'यूनानी के अनुसार: ‘यदि तुम दीन दशा में पहुँचा दिए जाओ।’'
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिक रखते हुए यूनानी के वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है; इस प्रकार स्रोतगत तनाव को चुपचाप समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चेतावनीपूर्ण लहजा। ‘विपत्ति’ प्रसंग में उपयुक्त है, और ‘आ घेरे’ मूल क्रिया की सजीवता बनाए रखता है।
