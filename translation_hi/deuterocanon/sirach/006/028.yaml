base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/028.yaml
  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: hi
  text: क्योंकि अन्त में[a] तुम उसका विश्राम[b] पाओगे, और वह तुम्हारे लिए आनन्द में बदल जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव ‘बाद में/पीछे’ है; यूनानी समानान्तर पाठ में ‘अन्ततः’ है। आशय यह है कि बुद्धि के साथ धीरज रखने पर अन्ततः विश्राम और आनन्द मिलता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ स्त्रीलिंग प्रत्यय है, जो प्रसंग में व्यक्तिरूप में प्रस्तुत बुद्धि की ओर संकेत करता है; इसे बुद्धि से मिलने वाले या उससे जुड़े विश्राम के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָחוֹר
  choice: अन्त में
  rationale: इब्रानी शब्द का मूल भाव ‘बाद में/पीछे’ है; यूनानी समानान्तर पाठ भी ‘अन्ततः’ का समयगत अर्थ पुष्ट करता है। ‘अन्त में’ धैर्यपूर्वक बुद्धि का अनुसरण करने के भावी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּמְצָא
  choice: तुम ... पाओगे
  rationale: מצא के सामान्य अर्थ ‘पाना/खोजना’ को भविष्यकाल में सीधा और स्वाभाविक रूप दिया गया है।
- source_word: מְנוּחָתָהּ
  choice: उसका विश्राम
  rationale: स्त्रीलिंग प्रत्यय निकटवर्ती सन्दर्भ में व्यक्तिरूप में चित्रित बुद्धि की ओर संकेत करता है। ‘उसका विश्राम’ इब्रानी सम्बन्धसूचक रचना को बनाए रखता है और यूनानी ἀνάπαυσις से भी मेल खाता है।
- source_word: וְתֵהָפֵךְ
  choice: वह ... बदल जाएगी
  rationale: הפך का अर्थ ‘पलटना/बदलना’ है। स्त्रीलिंग क्रिया बुद्धि की ओर संकेत बनाए रखती है और उसके अनुशासन के आनन्द में परिवर्तित होने की छवि को सुरक्षित रखती है।
- source_word: לְךָ
  choice: तुम्हारे लिए
  rationale: यह हित अथवा व्यक्तिगत परिणाम का भाव बताता है—बुद्धि साधक के अनुभव में आनन्द बन जाती है।
- source_word: לְתַעֲנוּג
  choice: आनन्द में
  rationale: תענוג का अर्थ ‘आनन्द/सुख’ है। ‘आनन्द में’ परिवर्तनसूचक हिन्दी रचना के साथ स्वाभाविक है और ज्ञान-साहित्य के गरिमापूर्ण स्वर को बनाए रखता है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों और क्रिया का सन्दर्भ
  choice: इन्हें आसपास के प्रसंग में व्यक्तिरूप में प्रस्तुत बुद्धि का सन्दर्भ माना गया है।
  alternative: इन्हें अधिक सामान्य रूप से बुद्धि की खोज या उसके अनुशासन का सन्दर्भ माना जा सकता है।
  rationale: इब्रानी के स्त्रीलिंग प्रत्यय और क्रिया तथा यूनानी समानान्तर पाठ का स्त्रीलिंग, दोनों निकटवर्ती प्रसंग में बुद्धि की ओर संकेत करते हैं। हिन्दी में ‘वह ... बदल जाएगी’ इस सम्बन्ध को स्पष्ट रखता है, जबकि पादटिप्पणी सम्भावित व्यापक अर्थ को भी खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘विश्राम’ और ‘आनन्द’ सामान्य पाठक के लिए सुबोध हैं; स्त्रीलिंग ‘बदल जाएगी’ मूल पाठ में बुद्धि के व्यक्तिरूप को सुरक्षित रखता है।
