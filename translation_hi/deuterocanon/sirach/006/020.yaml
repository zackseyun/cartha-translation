translation:
  language: hi
  text: वह मूर्ख के लिए कठिन है[a], और समझ से रहित व्यक्ति उसे सह नहीं सकेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुर्गम” अथवा “टेढ़ी।” यूनानी समानांतर में “बहुत कठिन” है।
    reason: lexical_alternative
  - marker: b
    text: “समझ से रहित” का शाब्दिक अर्थ “हृदय से रहित” है; इब्रानी में “हृदय” समझ और विवेक का भी बोध कराता है। “सह नहीं सकेगा” का अर्थ “उसे थामे नहीं रह सकेगा” या “उसमें बना नहीं रहेगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: कठिन
  rationale: यह असामान्य इब्रानी शब्द किसी टेढ़ी, दुर्गम या कठिन वस्तु का बोध करा सकता है। प्रसंग में यह बुद्धि को मूर्ख के लिए कठिन बताता है; यूनानी समानांतर भी ‘बहुत कठिन/दुर्गम’ अर्थ का समर्थन करता है, पर इब्रानी में स्पष्ट तीव्रताबोधक शब्द न होने के कारण मुख्य पाठ में केवल ‘कठिन’ रखा गया है।
- source_word: לָאֱוִיל
  choice: मूर्ख के लिए
  rationale: אֱוִיל ज्ञान-साहित्य का प्रचलित शब्द है, जो केवल कम बुद्धि नहीं बल्कि नैतिक और बौद्धिक मूढ़ता प्रकट करता है।
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: उसे सह नहीं सकेगा
  rationale: כלכל यहाँ संभालने, सहने या टिके रहने का अर्थ दे सकता है। स्त्रीलिंग प्रत्यय का संदर्भ बुद्धि से है। यूनानी ‘उसमें बना नहीं रहेगा’ दृढ़ बने रहने की धारणा की पुष्टि करता है; ‘सह नहीं सकेगा’ इब्रानी क्रिया की व्यापकता को स्वाभाविक हिन्दी में रखता है।
- source_word: חֲסַר לֵב
  choice: समझ से रहित व्यक्ति
  rationale: शाब्दिक अर्थ ‘हृदय से रहित’ है, पर इब्रानी में हृदय समझ और विवेक का केंद्र है। हिन्दी में ‘हृदयहीन’ निर्दयता का भ्रामक अर्थ देता, इसलिए मुहावरे का आशय स्पष्ट किया गया है।
theological_decisions:
- issue: बुद्धि के लिए स्त्रीलिंग संदर्भ और समझहीन व्यक्ति का लिंग
  choice: बुद्धि के लिए ‘वह/उसे’ और व्यक्ति के लिए सामान्य अभिव्यक्ति ‘समझ से रहित व्यक्ति’
  alternative: ‘समझहीन पुरुष उसे सह नहीं सकेगा’ अथवा बुद्धि को स्पष्ट रूप से ‘वह स्त्री’ कहना
  rationale: इब्रानी में बुद्धि व्याकरणतः स्त्रीलिंग है और क्रिया का प्रत्यय उसी की ओर संकेत करता है, पर हिन्दी के सर्वनाम स्वाभाविक रूप से इस संबंध को बनाए रखते हैं। חֲסַר לֵב व्याकरणतः पुल्लिंग होते हुए भी ज्ञान-साहित्य में एक सामान्य मानवीय प्रकार को दर्शाता है, इसलिए कथन को केवल पुरुषों तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य रखा गया है। ‘हृदयहीन’ से बचा गया है क्योंकि आज की हिन्दी में उसका सामान्य अर्थ निर्दयी होता है। पूर्वपद में बुद्धि का स्त्रीलिंग संदर्भ ‘वह’ और ‘उसे’ से स्वाभाविक रूप में सुरक्षित है।
