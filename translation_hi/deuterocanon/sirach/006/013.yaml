lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: जो तुमसे बैर रखते हैं
  rationale: इब्रानी कृदन्त का शाब्दिक अर्थ ‘तुमसे घृणा करने वाले’ है। ‘जो तुमसे बैर रखते हैं’ आधुनिक हिन्दी में स्वाभाविक है और शत्रुतापूर्ण सम्बन्ध को स्पष्ट रखता है; यूनानी ἐχθρῶν भी इसी अर्थ की पुष्टि करता है।
- source_word: הִבָּדֵל
  choice: अलग रहो
  rationale: בדל का निफ़अल आज्ञार्थक रूप अपने को अलग करने या दूरी बनाए रखने का निर्देश देता है। ‘अलग रहो’ इस आत्मवाची और निरन्तर सावधानी के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וּמֵאֹהֲבֶיָך
  choice: और जो तुमसे प्रेम करते हैं
  rationale: प्राथमिक इब्रानी पाठ का अर्थ ‘तुमसे प्रेम करने वाले’ है। इसे मुख्य पाठ में बनाए रखा गया है; यूनानी समानान्तर पाठ के अधिक संकीर्ण ‘मित्रों’ को पादटिप्पणी में दर्ज किया गया है।
- source_word: הֵשָּׁמֵר
  choice: सावधान रहो
  rationale: שמר का यह आज्ञार्थक रूप स्वयं की रक्षा करने, चौकन्ने रहने या सावधानी बरतने का भाव देता है। ‘सावधान रहो’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है; यूनानी πρόσεχε भी सावधान रहने का समर्थन करता है।
theological_decisions:
- issue: दूसरे अर्धवाक्य में सम्बन्ध-सूचक पद
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘जो तुमसे प्रेम करते हैं’
  alternative: यूनानी समानान्तर पाठ के अनुसार ‘तुम्हारे मित्र’
  rationale: उपलब्ध इब्रानी मूल पाठ स्पष्ट और उच्च-विश्वसनीयता वाला है, इसलिए उसके व्यापक और कुछ तनावपूर्ण कथन को मुख्य पाठ में रखा गया है। यूनानी φίλων अर्थ को ‘मित्रों’ तक सीमित करता है; इस पाठान्तर को चुपचाप अपनाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। दोनों अर्धवाक्यों की समानान्तर संरचना बनाए रखी गई है और इब्रानी मूल की असहज किंतु सार्थक चेतावनी को नरम नहीं किया गया।
