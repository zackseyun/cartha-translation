translation:
  language: hi
  text: जो लोग तुम्हारे साथ शांति से रहते हैं, वे बहुत हों; पर तुम्हारा विश्वासपात्र हज़ार में से एक ही हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “तुम्हारे सलाहकार” या “तुम्हारे परामर्शदाता” है। इब्रानी में शाब्दिक अर्थ “तुम्हारे गुप्त परामर्श का अधिकारी” है, जो अधिक अंतरंग, विश्वासपूर्ण संबंध का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: जो लोग तुम्हारे साथ शांति से रहते हैं
  rationale: शाब्दिक अर्थ ‘तुम्हारी शांति के लोग’ है। यह अनुवाद मित्रता मात्र कहने के बजाय शांति-आधारित संबंध का भाव बनाए रखता है और यूनानी समानांतर से भी मेल खाता है।
- source_word: יִהְיוּ רַבִּים
  choice: वे बहुत हों
  rationale: इब्रानी अपूर्ण क्रिया का यहाँ इच्छार्थक/उपदेशात्मक बल है; ‘बहुत हों’ उसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבַעַל סוֹדְךָ
  choice: तुम्हारे भेद का सहभागी
  rationale: בעל סוד का आशय उस व्यक्ति से है जिसे किसी के गुप्त या अंतरंग विचार-विमर्श में सम्मिलित किया गया हो। ‘भेद का सहभागी’ गोपनीयता और निकट विश्वास दोनों को रखता है, जबकि यूनानी पाठ परामर्शदाता का पक्ष उभारता है।
- source_word: אֶחַד מֵאָלֶף
  choice: हज़ार में से एक
  rationale: यह अत्यंत दुर्लभ और सावधानी से चुने गए विश्वस्त व्यक्ति का भाव स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
theological_decisions:
- issue: बड़े पाठांतर के संकेत के बीच इब्रानी और यूनानी साक्ष्यों का उपयोग
  choice: मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिक रखकर ‘भेद का सहभागी’ अनूदित किया गया है।
  alternative: यूनानी के अनुसार ‘तुम्हारे सलाहकार’ या ‘तुम्हारे परामर्शदाता’।
  rationale: दोनों साक्ष्य बहुत-से शांतिपूर्ण संबंधों और अत्यंत सीमित विश्वस्त मंडली के बीच अंतर रखते हैं। इब्रानी סוד गोपनीय और अंतरंग विचार-विमर्श का अतिरिक्त भाव देता है, इसलिए उसे मुख्य पाठ में सुरक्षित रखा गया है; यूनानी विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘भेद का सहभागी’ ने ‘राज़दार’ की बोलचाल और ‘विश्वस्त सलाहकार’ की व्याख्यात्मक संकीर्णता से बचते हुए इब्रानी की गोपनीयता तथा अंतरंग परामर्श—दोनों को रखा है।
