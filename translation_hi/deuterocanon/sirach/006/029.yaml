base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/029.yaml
  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: hi
  text: उसका जाल तुम्हारे लिए एक दृढ़ शरणस्थान बन जाएगा,[a] और उसकी डोरियाँ खरे सोने के वस्त्र बन जाएँगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ जो वस्तु पहले बाँधने या रोकने वाली लगती है, वही अंततः सुरक्षा देने वाली बनती है।
    reason: cross_reference
  - marker: b
    text: 'यूनानी समानांतर पाठ है: “उसकी बेड़ियाँ तुम्हारे लिए सामर्थ्य की शरण होंगी, और उसकी शाखाएँ महिमा का वस्त्र।” यह उपलब्ध इब्रानी के “जाल ... डोरियाँ ... खरे सोने के वस्त्र” से उल्लेखनीय रूप से भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: उसका जाल
  rationale: רשת का सामान्य अर्थ ‘जाल’ है। यह आगे आने वाली ‘डोरियों’ की छवि से स्वाभाविक रूप से जुड़ता है और यूनानी ‘बेड़ियों’ के बजाय उपलब्ध इब्रानी पाठ का अनुसरण करता है।
- source_word: מְכוֹן עֹז
  choice: एक दृढ़ शरणस्थान
  rationale: מכון किसी स्थिर या स्थापित स्थान को और עז सामर्थ्य या दृढ़ता को व्यक्त करता है। प्रसंग में ‘दृढ़ शरणस्थान’ सुरक्षा की रूपकात्मक भावना को सहज हिन्दी में सामने लाता है; अधिक शब्दशः ‘सामर्थ्य का आधार’ भी संभव है।
- source_word: חַבְלֹתֶיהָ
  choice: उसकी डोरियाँ
  rationale: חבל का अर्थ डोरी, रस्सी या बंधन हो सकता है। ‘डोरियाँ’ जाल और वस्त्र—दोनों से जुड़ी हुई बिंब-श्रृंखला को बनाए रखती हैं।
- source_word: בִּגְדֵי כָתֶם
  choice: खरे सोने के वस्त्र
  rationale: בגדי का अर्थ ‘वस्त्र’ और כתם का अर्थ उत्तम, विशुद्ध या खरा सोना है। ‘खरे सोने के वस्त्र’ इब्रानी की मूल्यवान और सम्मानसूचक छवि को सुरक्षित रखता है।
- source_word: וְהָיְתָה לְךָ
  choice: तुम्हारे लिए ... बन जाएगा
  rationale: यह अभिव्यक्ति भावी परिणाम बताती है। हिन्दी में ‘बन जाएगा’ उस परिवर्तन को स्पष्ट करती है जिसमें पहले बंधन जैसा दिखने वाला अनुशासन अंततः सुरक्षा और सम्मान देता है।
theological_decisions:
- issue: इब्रानी और यूनानी समानांतर पाठ की उल्लेखनीय भिन्नता
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी को आधार बनाया गया: ‘जाल ... डोरियाँ ... खरे सोने के वस्त्र।’'
  alternative: 'यूनानी: ‘उसकी बेड़ियाँ तुम्हारे लिए सामर्थ्य की शरण होंगी, और उसकी शाखाएँ महिमा का वस्त्र।’'
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए वही मुख्य आधार है। यूनानी पाठ संभवतः भिन्न आधार-पाठ या व्याख्यात्मक परंपरा को दर्शाता है; उसकी अलग छवि को पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘डोरियाँ’ को ‘रस्सियाँ’ पर इसलिए चुना गया कि वह जाल और वस्त्र दोनों की संयुक्त रूपक-छवि को अधिक स्वाभाविक ढंग से बनाए रखता है।
