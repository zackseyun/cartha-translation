translation:
  language: hi
  text: कोई मित्र भोजन की मेज़ का साथी होता है,[a] पर विपत्ति के दिन वह नहीं मिलेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मेज़ का मित्र/साथी’ है; यूनानी समानांतर में ‘मेज़ों का सहभागी’ है। आशय ऐसे व्यक्ति से है जो भोजन में साथ देता है, पर कठिन समय में भरोसेमंद सिद्ध नहीं होता।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘नहीं मिलेगा’ है, जबकि यूनानी समानांतर में ‘नहीं ठहरेगा’ है। दोनों का आशय है कि ऐसा मित्र विपत्ति आने पर साथ नहीं देता।
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹהֵב חָבֵר שֻׁלְחָן
  choice: मित्र केवल भोजन की मेज़ का साथी
  rationale: इब्रानी पदबंध संक्षिप्त है और शब्दशः ‘मेज़ का मित्र/साथी’ का भाव देता है। यूनानी समानांतर ‘मेज़ों का सहभागी’ कहकर भोजन-संगति का आशय स्पष्ट करता है। ‘केवल’ सतही मित्रता के निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘मतलबी मित्र’ जैसी व्याख्यात्मक संज्ञा अपनाए।
- source_word: וְלֹא יִמָּצֵא
  choice: वह नहीं मिलेगा
  rationale: निफ़ाल रूप का सीधा अर्थ ‘नहीं पाया जाएगा/नहीं मिलेगा’ है। सहज हिन्दी के लिए ‘नहीं मिलेगा’ रखा गया है; यूनानी में ‘नहीं ठहरेगा’ है, जिसका व्यावहारिक आशय भी संकट में साथ छोड़ना है।
- source_word: בְּיוֹם רָעָה
  choice: विपत्ति के दिन
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि संकट या विपत्ति को दर्शाता है। ‘विपत्ति के दिन’ ज्ञान-साहित्य के अनुरूप, संक्षिप्त और गरिमापूर्ण हिन्दी है।
