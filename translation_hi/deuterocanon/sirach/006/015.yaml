    text: इब्रानी में अधिक शाब्दिक रूप से ‘विश्वासयोग्यता से प्रेम करने वाला’; यूनानी में ‘विश्वासयोग्य मित्र’। प्रसंग में आशय संभवतः विश्वासयोग्य मित्र से है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी में: ‘उसकी सुंदरता का कोई माप नहीं’; ‘सुंदरता’ का अर्थ यहाँ ‘श्रेष्ठता’ या ‘गरिमा’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: विश्वासयोग्य मित्र
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘विश्वासयोग्यता से प्रेम करने वाला’ है, पर निकटवर्ती प्रसंग और यूनानी समानांतर दोनों एक ऐसे मित्र की ओर संकेत करते हैं जो विश्वासयोग्य है।
- source_word: אֵין מְחִיר
  choice: कोई मोल नहीं होता
  rationale: מְחִיר मूल्य या कीमत को सूचित करता है। ‘कोई मोल नहीं’ स्वाभाविक हिन्दी में उसकी अमूल्यता व्यक्त करता है।
- source_word: מִשְׁקָל
  choice: तौलने का कोई पैमाना
  rationale: यह शब्द भार और तौलने की धारणा रखता है। यह रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट अर्थ देता है।
- source_word: לְטוֹבָתוֹ
  choice: उसकी भलाई
  rationale: उपलब्ध इब्रानी पाठ का प्राथमिक अर्थ ‘उसकी भलाई/अच्छाई’ है; इसलिए मुख्य पाठ में इसे रखा गया है, जबकि यूनानी पाठ का भिन्न अर्थ पादटिप्पणी में दिया गया है।
