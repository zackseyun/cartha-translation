translation:
  language: hi
  text: अपने सारे मन से उसके पास आ, और अपनी पूरी शक्ति से उसके मार्गों पर बना रह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ ψυχῇ σου
  choice: अपने सारे मन से
  rationale: यहाँ ψυχή पूरे अंतर्मन और समर्पण का बोध कराता है; आधुनिक हिन्दी में ‘सारे मन से’ स्वाभाविक और व्यापक रूप से समझ में आता है।
- source_word: πρόσελθε αὐτῇ
  choice: उसके पास आ
  rationale: προσέρχομαι का सीधा अर्थ पास आना या निकट जाना है; स्त्रीलिंग सर्वनाम पूर्ववर्ती ‘बुद्धि’ की ओर संकेत करता है।
- source_word: ἐν ὅλῃ δυνάμει σου
  choice: अपनी पूरी शक्ति से
  rationale: δύναμις को ‘शक्ति’ कहना मूल के बल और सामर्थ्य के भाव को सुरक्षित रखता है।
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  choice: उसके मार्गों पर बना रह
  rationale: συντηρέω में सावधानी से थामे रहने, बनाए रखने और दृढ़ता से पालन करने का भाव है। हिन्दी में मार्गों को ‘रखना’ अस्वाभाविक होता; ‘मार्गों पर बना रह’ मूल आशय और अंग्रेज़ी consultation layer के ‘keep to’ दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग αὐτῇ / αὐτῆς का संदर्भ
  choice: ‘उसके’ द्वारा स्त्रीरूप में व्यक्त बुद्धि का संदर्भ बनाए रखा गया
  alternative: संज्ञा ‘बुद्धि’ को इस पद में दोहराना
  rationale: यूनानी पाठ सर्वनाम का प्रयोग करता है; सर्वनाम रखने से निकटवर्ती संदर्भ और मूल की साहित्यिक संरचना सुरक्षित रहती है।
translation_notes:
  register: आज्ञार्थक एकवचन शैली रखी गई है। भाषा आधुनिक, सरल और गरिमापूर्ण है; ‘मन’ सामान्य पाठक के लिए ‘प्राण’ या ‘आत्मा’ की अपेक्षा यहाँ अधिक स्वाभाविक है, जबकि पूरे व्यक्तित्व से समर्पण का भाव बना रहता है।
