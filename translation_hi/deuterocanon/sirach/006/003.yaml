translation:
  language: hi
  text: वह तुम्हारे पत्ते खा जाएगा और तुम्हारे फल को नष्ट कर देगा[a], और तुम्हें सूखे पेड़ के समान छोड़ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में इब्रानी पाठ कई स्थानों पर कठिन है। यूनानी समानांतर ‘तुम्हारे पत्ते’ पढ़ता है और तुम्हारे फल के विनाश का भाव देता है। इब्रानी क्रिया में ‘जड़ से उखाड़ने’ या ‘जड़ से नष्ट करने’ का संकेत भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: עָלֶיךָ
  choice: तुम्हारे पत्ते
  rationale: इब्रानी रूप कठिन है, पर यूनानी समानांतर τὰ φύλλα σου स्पष्ट रूप से ‘तुम्हारे पत्ते’ पढ़ता है; इससे ‘फल’ और ‘सूखे पेड़’ के साथ सुसंगत वृक्ष-रूपक बनता है।
- source_word: תֹּאכַל
  choice: खा जाएगा
  rationale: मूल क्रिया का अर्थ ‘खाना/भस्म करना’ है। हिन्दी में ‘पत्ते खा जाएगा’ स्वाभाविक है और विनाशकारी वृक्ष-रूपक को बनाए रखता है।
- source_word: וּפֶרְיְךָ
  choice: तुम्हारे फल को
  rationale: ‘फल’ मूल संज्ञा का सीधा अर्थ है और पद के वृक्ष-रूपक को सुरक्षित रखता है।
- source_word: תְּשָׁרֵשׁ
  choice: जड़ से उखाड़ देगा
  rationale: इब्रानी क्रियारूप अनिश्चित है। जड़ से संबंधित संभावित अर्थ के कारण यह चयन सजीव रूपक बनाए रखता है; यूनानी पाठ व्यापक अर्थ ‘नष्ट कर देगा’ का समर्थन करता है।
- source_word: וְהִנִיחַתְךָ
  choice: तुम्हें ... छोड़ देगा
  rationale: सन्दर्भ में हिफ़ील रूप का अर्थ ‘छोड़ देना’ उपयुक्त है; यूनानी समानांतर भी त्यागे जाने के परिणाम की पुष्टि करता है।
- source_word: כְּעֵץ יָבֵשׁ
  choice: सूखे पेड़ के समान
  rationale: यह मूल उपमा का निकट और गरिमापूर्ण हिन्दी रूप है; ‘मुरझाए पेड़’ की अपेक्षा ‘सूखे पेड़’ इब्रानी יָבֵשׁ के अधिक निकट है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और यूनानी समानांतर का संबंध
  choice: इब्रानी को आधार रखते हुए कठिन शब्दों को यूनानी समानांतर से स्पष्ट करना
  alternative: केवल सतही इब्रानी रूप के अनुसार ‘तुम पर वह खाएगा’ कहना, अथवा यूनानी के अनुसार सीधे ‘फल नष्ट कर देगा’ कहना
  rationale: उपलब्ध इब्रानी पाठ प्राथमिक साक्ष्य है, किंतु इस पद में कुछ रूप कठिन हैं। यूनानी समानांतर ‘पत्ते—फल—सूखा पेड़’ की संगत छवि की पुष्टि करता है, इसलिए वह अर्थ स्पष्ट करने में उपयोगी है, बिना इब्रानी की प्राथमिकता छोड़े।
- issue: תְּשָׁרֵשׁ में निहित विनाश का स्वरूप
  choice: ‘जड़ से उखाड़ देगा’ द्वारा संभावित जड़-संबंधी अर्थ को रखना
  alternative: ‘नष्ट कर देगा’
  rationale: पहला विकल्प इब्रानी की संभावित शब्द-छवि को बचाता है, जबकि पाठगत अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है; इससे किसी विशेष धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और चित्रात्मक शैली रखी गई है। ‘पत्ते’, ‘फल’ और ‘सूखा पेड़’ की क्रमिक वृक्ष-छवि सुरक्षित है; पाठगत अनिश्चितता को मुख्य पाठ में बोझिल बनाए बिना पादटिप्पणी में बताया गया है।
