base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/016.yaml
  text: A faithful friend is a bundle of life[b][a], and one who fears the Lord will attain him.
translation:
  language: hi
  text: विश्वासयोग्य मित्र जीवन की पोटली है[a], और जो प्रभु का भय मानता है, वह उसे पा लेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “जीवन की पोटली, विश्वासयोग्यता से प्रेम करने वाला”; यूनानी समानांतर में, “विश्वासयोग्य मित्र जीवन की औषधि है।” यहाँ इब्रानी का “जीवन की पोटली” वाला बिंब रखा गया है और यूनानी से वाक्य का आशय स्पष्ट किया गया है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में अंतिम उपवाक्य पाठगत रूप से कठिन है: “भय मानने” का कर्म स्पष्ट नहीं है और अंतिम क्रिया का रूप “उन्हें प्राप्त कर लेगा” भी समझा जा सकता है। यूनानी समानांतर में है, “जो प्रभु का भय मानते हैं, वे उसे पाएँगे।”'
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: जीवन की पोटली
  rationale: इब्रानी पदबंध के ठोस और बहुमूल्य वस्तु को सँभालकर रखने वाले बिंब को सुरक्षित रखता है। यूनानी समानांतर का ‘जीवन की औषधि’ इसके जीवनदायी आशय की पुष्टि करता है, पर मुख्य पाठ में इब्रानी बिंब को प्राथमिकता दी गई है।
- source_word: אוֹהֵב אֱמוּנָה
  choice: विश्वासयोग्य मित्र
  rationale: शाब्दिक रूप से यह ‘विश्वासयोग्यता से प्रेम करने वाला’ है, किंतु वाक्य संक्षिप्त और कठिन है। प्रसंग तथा यूनानी φίλος πιστός से स्पष्ट होता है कि आशय भरोसेमंद या विश्वासयोग्य मित्र है।
- source_word: יְרֵא
  choice: जो ... भय मानता है
  rationale: कृदंत को सामान्य ज्ञानोक्ति के रूप में स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְאַל
  choice: और
  rationale: प्रचलित निषेधार्थ में इब्रानी रूप इस वाक्य में असंगत है। यूनानी समानांतर एक साधारण संयोजक के साथ सुसंगत अर्थ देता है; इसलिए कठिन पाठ को पादटिप्पणी में रखते हुए मुख्य पाठ में अर्थानुसार ‘और’ रखा गया है।
- source_word: יַשִּׂיגֵם
  choice: वह उसे पा लेगा
  rationale: इब्रानी रूप का अर्थ ‘उन्हें प्राप्त कर लेगा/जा पकड़ेगा’ हो सकता है, पर बहुवचन कर्म प्रसंग में कठिन है। यूनानी ‘उसे पाएँगे’ एकवचन मित्र की ओर संकेत करता है। ‘पा लेगा’ लक्ष्य की प्राप्ति और मित्र को पाने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κύριον
  choice: प्रभु
  rationale: इब्रानी में भय का कर्म स्पष्ट नहीं है; यूनानी समानांतर Κύριον को स्पष्ट करता है। हिन्दी बाइबलीय प्रयोग के अनुरूप इसे ‘प्रभु’ कहा गया है।
theological_decisions:
- issue: ‘भय मानता है’ के अस्पष्ट कर्म को यूनानी समानांतर से पूरा करना
  choice: जो प्रभु का भय मानता है
  alternative: जो भय मानता है
  rationale: उपलब्ध इब्रानी में कर्म नहीं है, जबकि यूनानी समानांतर स्पष्टतः ‘प्रभु का भय मानने वाले’ कहता है। पाठ की कठिन अवस्था में यह पूर्ति संभावित आशय को स्पष्ट करती है, कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ती।
- issue: अंतिम क्रिया के कर्म और वचन की पाठगत कठिनाई
  choice: वह उसे पा लेगा
  alternative: वह उन्हें प्राप्त कर लेगा
  rationale: इब्रानी रूप बहुवचन कर्म का संकेत देता है, जिसका पूर्वपद अस्पष्ट है; यूनानी में एकवचन ‘उसे’ विश्वासयोग्य मित्र से सहज रूप से जुड़ता है। मुख्य पाठ में सुसंगत अर्थ रखा गया और कठिनाई पादटिप्पणी में बताई गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीवन की पोटली’ असामान्य किंतु समझ में आने वाला बिंब है और मूल इब्रानी की विशिष्टता बचाता है। ‘विश्वासयोग्य मित्र’ प्रसंग में स्वाभाविक है; ‘पा लेगा’ औपचारिक ‘प्राप्त करेगा’ की अपेक्षा मित्र के संदर्भ में अधिक सहज है।
