  text: If you are willing to listen[a], you will receive instruction; if you incline your ear[b], you will become wise.
translation:
  language: hi
  text: यदि तुम सुनना चाहो[a], तो शिक्षा पाओगे; और यदि अपना कान लगाओ, तो बुद्धिमान हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ यहाँ कठिन है और यूनानी पाठ से छोटा प्रतीत होता है। यूनानी समानांतर का अर्थ है: “यदि तुम सुनना पसंद करो, तो शिक्षा ग्रहण करोगे; और यदि अपना कान लगाओ, तो बुद्धिमान हो जाओगे।” अनुवाद में इब्रानी को प्राथमिक रखते हुए भाव और पूर्ण समानांतरता स्पष्ट करने के लिए यूनानी पाठ का भी सहारा लिया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: यदि तुम सुनना चाहो
  rationale: इब्रानी पाठ का रूप कुछ कठिन है, पर यूनानी समानांतर में ἀγαπήσῃς ἀκούειν सुनने की इच्छा या तत्परता का भाव स्पष्ट करता है। यह अनुवाद उस इच्छापरक भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: וְתֵט אָזְנְךָ
  choice: यदि अपना कान लगाओ
  rationale: यह ध्यानपूर्वक सुनने का इब्रानी मुहावरा है। ‘कान लगाना’ मूल बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और बोधगम्य है।
- source_word: תִּוָּסֵר
  choice: शिक्षा पाओगे
  rationale: יסר का यह रूप शिक्षा, अनुशासन या सुधार ग्रहण करने का भाव दे सकता है। ‘शिक्षा पाओगे’ निष्क्रिय अर्थ को स्वाभाविक रूप में व्यक्त करता है और अनावश्यक दंडात्मक कठोरता से बचता है।
- source_word: σοφὸς ἔσῃ (Greek parallel)
  choice: बुद्धिमान हो जाओगे
  rationale: यह परिणामसूचक उपवाक्य उपलब्ध इब्रानी पाठ में स्पष्ट रूप से नहीं है, पर यूनानी समानांतर में संरक्षित है। इसे शामिल करने से यूनानी का पूर्ण समानांतर विन्यास बना रहता है।
