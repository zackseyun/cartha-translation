base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/027.yaml
  text: Search out and investigate; seek[a], and find. Hold fast to her, and do not let her go.
translation:
  language: hi
  text: ढूँढ़ और गहराई से जाँच कर; खोज[a] और पा। उसे दृढ़ता से थामे रह, और उसे मत छोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “खोज, और वह तुझे ज्ञात हो जाएगी।” हिब्रू साक्ष्य अधिक सीधे रूप में कहता है: “खोज और पा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  choice: ढूँढ़
  rationale: यह דרש की सक्रिय खोज और पूछताछ की शक्ति व्यक्त करता है तथा अगले בקש से कुछ भिन्नता बनाए रखता है।
- source_word: וַחֲקֹר
  choice: और गहराई से जाँच
  rationale: חקר सूक्ष्म और गंभीर छानबीन का बोध देता है; 'गहराई से जाँच' दोनों आरंभिक आज्ञाओं की तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּקֵּש
  choice: खोज
  rationale: בקש का सामान्य अर्थ खोज करना है; इसे דרש से अलग हिन्दी क्रिया देकर हिब्रू की क्रमिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: וּמְצָא
  choice: और पा
  rationale: हिब्रू में यह आज्ञार्थक क्रम है—'खोज और पा'। मुख्य पाठ उपलब्ध उच्च-विश्वसनीयता वाले हिब्रू साक्ष्य का अनुसरण करता है।
- source_word: וְהֶחֱזַקְתָּהּ
  choice: उसे दृढ़ता से थामे रह
  rationale: हिफ़ील क्रिया और स्त्रीलिंग कर्म-प्रत्यय दृढ़ पकड़ बनाए रखने का भाव देते हैं; प्रसंग में इसका संकेत स्त्रीरूप में चित्रित बुद्धि की ओर है।
- source_word: וְאַל תַּרְפֶּהָ
  choice: और उसे मत छोड़
  rationale: רפה यहाँ पकड़ ढीली करने या हाथ से जाने देने का चित्र प्रस्तुत करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक रूप से व्यक्त हुआ है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: '''उसे'' रखा गया है, जो प्रसंग में स्त्रीरूप में चित्रित बुद्धि की ओर संकेत करता है।'
  alternative: '''इसे'' कहकर शिक्षा या समझ जैसी अमूर्त वस्तु का संकेत देना।'
  rationale: हिब्रू के स्त्रीलिंग कर्म-प्रत्यय और निकटवर्ती प्रसंग बुद्धि के स्त्री-व्यक्तित्व से मेल खाते हैं। हिन्दी में 'उसे' उस साहित्यिक संकेत को बनाए रखता है, यद्यपि सर्वनाम स्वयं व्याकरणिक लिंग स्पष्ट नहीं करता।
- issue: पाने वाले उपवाक्य में हिब्रू और यूनानी का अंतर
  choice: 'मुख्य पाठ में हिब्रू का आज्ञार्थक क्रम: ''खोज और पा।'''
  alternative: 'यूनानी समानांतर: ''खोज, और वह तुझ पर प्रकट हो जाएगी'' अथवा ''वह तुझे ज्ञात हो जाएगी।'''
  rationale: यहाँ हिब्रू पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए मुख्य पाठ उसी का अनुसरण करता है; वास्तविक यूनानी भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आज्ञार्थक और गरिमापूर्ण शैली रखी गई है। आरंभिक तीन खोज-संबंधी क्रियाओं की पुनरुक्त तीव्रता को यथासंभव अलग शब्दों से व्यक्त किया गया है।
