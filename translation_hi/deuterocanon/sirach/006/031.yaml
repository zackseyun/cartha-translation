  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: hi
  text: 'तू उसे सम्मान के वस्त्रों के समान पहनेगा,

    और वैभव के मुकुट[a] के समान उसे अपने सिर पर धारण करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “वैभव का मुकुट” के स्थान पर “आनन्द (या उल्लास) का मुकुट” है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: सम्मान के वस्त्र
  rationale: यह כָבוֹד के ‘सम्मान/महिमा’ अर्थ और वस्त्र के ठोस बिंब, दोनों को बनाए रखता है; आधुनिक हिन्दी में ‘सम्मान के वस्त्र’ सहज और गरिमापूर्ण है।
- source_word: תִלְבְּשֶׁנָּה
  choice: तू उसे … पहनेगा
  rationale: לבש का मूल अर्थ ‘पहनना’ है। स्त्रीलिंग प्रत्यय को ‘उसे’ द्वारा व्यक्त किया गया है, क्योंकि निकटवर्ती प्रसंग में बुद्धि स्त्री के रूप में व्यक्तित्व धारण करती है।
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: वैभव का मुकुट
  rationale: תִּפְאֶרֶת के सौंदर्य, शोभा और महिमा-संबंधी अर्थ को ‘वैभव’ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; ‘मुकुट’ עֲטֶרֶת के स्पष्ट राजसी बिंब को सुरक्षित रखता है।
- source_word: תְּעַטְּרֶנָּה
  choice: उसे अपने सिर पर धारण करेगा
  rationale: עטר के मुकुट पहनाने/सिर पर रखने के बिंब को हिन्दी में स्वाभाविक बनाया गया है। ‘उसे’ स्त्रीलिंग प्रत्यय को सुरक्षित रखता है और ‘अपने सिर पर’ यूनानी समानांतर में स्पष्ट आत्मवाचक भाव से भी संगत है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: दोनों पंक्तियों में ‘उसे’ रखकर बुद्धि के स्त्री-व्यक्तित्व को बनाए रखा गया है।
  alternative: प्रत्ययों को अप्रकट करके केवल ‘सम्मान के वस्त्र पहनेगा’ और ‘वैभव का मुकुट धारण करेगा’ कहना।
  rationale: सिराख 6 का निकटवर्ती प्रसंग बुद्धि को स्त्री के रूप में प्रस्तुत करता है। ‘उसे’ हटाने से मूल का साहित्यिक और धर्मवैचारिक व्यक्तित्व-बिंब सपाट हो जाता।
- issue: दूसरी पंक्ति में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी ‘वैभव का मुकुट’ का अनुसरण किया गया है।
  alternative: यूनानी के अनुसार ‘आनन्द/उल्लास का मुकुट’ कहना।
  rationale: प्राप्त इब्रानी साक्ष्य यहाँ स्पष्ट है और अनुरोधित मूल स्रोत भी वही है; यूनानी की अर्थपूर्ण भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल काव्यात्मक गद्य रखा गया है। एकवचन संबोधन के लिए ‘तू’ चुना गया है, जो बाइबिलीय ज्ञान-साहित्य में गुरु द्वारा शिष्य को किए गए सीधे संबोधन को संक्षिप्त और निकट बनाए रखता है। दोनों समानांतर पंक्तियों और वस्त्र-मुकुट के रूपकों को स्पष्ट रखा गया है।
