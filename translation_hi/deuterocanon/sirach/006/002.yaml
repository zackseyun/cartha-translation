  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
translation:
  language: hi
  text: अपनी ही लालसा के वश में मत पड़ो[a], नहीं तो तुम्हारी शक्ति तुम्हारे ही विरुद्ध क्षीण हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपनी आत्मा के हाथ में मत पड़ो।” यूनानी समानांतर में है, “अपनी आत्मा की सलाह से अपने को ऊँचा मत उठाओ, कहीं ऐसा न हो कि तुम्हारी आत्मा बैल के समान नोच डाली जाए।” इब्रानी का दूसरा उपवाक्य कठिन है; इसलिए अनुवाद उस साझा चेतावनी को व्यक्त करता है कि अपनी ही लालसा के अधीन होना विनाश की ओर ले जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: के वश में मत पड़ो
  rationale: शाब्दिक रूप से ‘हाथ में मत पड़ो’; हिन्दी में ‘वश में पड़ना’ किसी शक्ति या प्रवृत्ति के अधीन हो जाने का स्वाभाविक मुहावरा है और मूल चित्र को पर्याप्त रूप से बनाए रखता है।
- source_word: נַפְשְׁךָ
  choice: अपनी ही लालसा
  rationale: ज्ञान-साहित्य में נֶפֶשׁ यहाँ केवल तत्त्वमीमांसक ‘आत्मा’ नहीं, बल्कि व्यक्ति की भूख, अभिलाषा या भीतरी चाह को सूचित कर सकता है। यूनानी समानांतर भी अपनी ही ψυχή की सलाह/इच्छा के पीछे चलने की चेतावनी देता है।
- source_word: וּתְעַבֶּה
  choice: नष्ट हो जाएगी
  rationale: प्रेषित इब्रानी रूप कठिन और संदिग्ध है। अर्थगत संदर्भ तथा यूनानी διαρπαγῇ (‘नोच ली जाए/उजाड़ दी जाए’) आत्म-विनाशकारी परिणाम की ओर संकेत करते हैं; ‘नष्ट हो जाएगी’ अनिश्चित क्रिया पर अत्यधिक विशिष्ट चित्र आरोपित किए बिना वह परिणाम व्यक्त करता है।
- source_word: חֵילֵךָ
  choice: तुम्हारी शक्ति
  rationale: חַיִל का अर्थ शक्ति, सामर्थ्य या संपत्ति हो सकता है। इस चेतावनी में ‘शक्ति’ व्यक्ति की सामर्थ्य के विनाश का व्यापक अर्थ बनाए रखती है।
- source_word: עָלֶיךָ
  choice: तुम्हारे ही विरुद्ध
  rationale: עַל का मूल अर्थ ‘पर’ है, पर इस प्रसंग में परिणाम स्वयं व्यक्ति के विरुद्ध पड़ता है; ‘ही’ आत्म-विनाश की प्रतिवर्ती धार को स्पष्ट करता है।
theological_decisions:
- issue: कठिन इब्रानी दूसरे उपवाक्य के लिए यूनानी समानांतर का उपयोग
  choice: पद को अपनी लालसा के अधीन होने से उत्पन्न आत्म-विनाश की चेतावनी के रूप में प्रस्तुत किया गया है।
  alternative: 'अधिक शाब्दिक किंतु अस्पष्ट रूप: ‘अपनी आत्मा के हाथ में मत पड़ो, और अपनी शक्ति को अपने ऊपर मोटा मत करो।’'
  rationale: इब्रानी साक्ष्य प्राथमिक है, पर दूसरा उपवाक्य पाठगत और अर्थगत रूप से कठिन है। यूनानी समानांतर विनाशकारी परिणाम की पुष्टि करता है। मुख्य पाठ स्वाभाविक हिन्दी में साझा चेतावनी देता है, जबकि पादटिप्पणी वास्तविक अनिश्चितता को स्पष्ट रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यीय चेतावनी। ‘लालसा’ सामान्य ‘इच्छा’ से अधिक अनियंत्रित अभिलाषा का भाव देती है, और ‘वश में पड़ना’ इब्रानी ‘हाथ में पड़ना’ का स्वाभाविक हिन्दी समतुल्य है।
