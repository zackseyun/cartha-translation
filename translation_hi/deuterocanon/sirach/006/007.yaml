  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: hi
  text: यदि तुम किसी को मित्र बनाओ[a], तो उसे परखकर ही अपना मित्र बनाओ, और उस पर भरोसा करने में जल्दबाज़ी न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि तुम कोई मित्र प्राप्त करो”; हिब्रू और यूनानी दोनों में ऐसी क्रिया है जिसका अर्थ “पाना,” “प्राप्त करना” या “अर्जित करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: मित्र बनाओ / उसे ... मित्र बनाओ
  rationale: קנה का मूल अर्थ ‘पाना, प्राप्त करना, अर्जित करना’ है और यूनानी κτάομαι भी इसकी पुष्टि करता है। फिर भी हिन्दी में किसी व्यक्ति को ‘अर्जित करना’ अत्यधिक लेन-देन जैसा और अस्वाभाविक लगेगा; ‘मित्र बनाना’ सम्बन्धगत रूपक को स्वाभाविक ढंग से व्यक्त करता है। दोनों हिब्रू क्रियारूपों की पुनरावृत्ति हिन्दी में भी रखी गई है।
- source_word: אוֹהֵב
  choice: मित्र
  rationale: इस ज्ञान-साहित्यिक प्रसंग में אוֹהֵב व्यक्तिगत मित्र को दर्शाता है; यूनानी φίλος भी इसी अर्थ का समर्थन करता है।
- source_word: בְּנִסָּיוֹן
  choice: परखकर
  rationale: ניסיון का अर्थ परीक्षा या परख है। उपसर्ग ב साधन अथवा परिस्थिति बता सकता है; ‘परखकर’ संक्षेप और स्वाभाविक हिन्दी में यह बताता है कि मित्रता स्वीकार करने से पहले विश्वसनीयता जाँची जाए, बिना यह तय किए कि परीक्षा औपचारिक है या जीवन की परिस्थितियों में होती है।
- source_word: וְאַל תְּמַהֵר
  choice: जल्दबाज़ी न करो
  rationale: מהר जल्द करने की चेतावनी देता है। ‘जल्दबाज़ी न करो’ आधुनिक हिन्दी में स्वाभाविक है और उपदेशात्मक स्वर बनाए रखता है।
- source_word: לִבְטוֹחַ עָלָיו
  choice: उस पर भरोसा करने में
  rationale: בטח על का अर्थ किसी पर भरोसा या निर्भरता रखना है। ‘उस पर भरोसा करना’ हिन्दी में सीधा और स्वाभाविक है तथा हिब्रू के सम्बन्धसूचक प्रयोग को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-उपदेश में एकवचन पुल्लिंग संकेत
  choice: ‘उस/उसे’ के रूप में प्रतिनिधिक एकवचन रखा गया
  alternative: बहुवचन या स्पष्ट रूप से लिंग-निरपेक्ष पुनर्लेखन
  rationale: हिब्रू और यूनानी दोनों एकवचन पुल्लिंग रूप रखते हैं। हिन्दी के ‘उसे/उस पर’ प्रसंग में सहज प्रतिनिधिक एकवचन हैं और स्रोत की संख्या को बदले बिना अनावश्यक रूप से जैविक लिंग पर बल नहीं देते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्रोत की दोहराई हुई ‘प्राप्त करने’ वाली क्रिया को ‘मित्र बनाओ ... मित्र बनाओ’ के रूप में बनाए रखा गया है; ‘परखकर ही’ सावधानी के बल को स्पष्ट करता है।
