  text: Its yoke is a golden ornament[b][a], and its bonds are a cord of blue thread.
translation:
  language: hi
  text: उसका जूआ सोने का आभूषण है[a], और उसके बंधन नीले-बैंगनी धागे की डोर हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “जूआ” की छवि है; यूनानी समानांतर पाठ में “उस पर सोने का आभूषण” है। यहाँ दोनों भाव साथ रखे गए हैं।
    reason: alternative_reading
  - marker: b
    text: या “बैंगनी-नीली डोर।” यह शब्द बहुमूल्य नीले-बैंगनी रंग से रँगे धागे को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: जूआ … आभूषण
  rationale: इब्रानी पाठ जूए की छवि बनाए रखता है, जबकि वाक्य-विन्यास और यूनानी समानांतर पाठ उसके अलंकारमय, मूल्यवान रूप को उभारते हैं। इसलिए दोनों भाव साथ रखे गए हैं।
- source_word: זָהָב
  choice: सोने का
  rationale: यह पदार्थ का सीधा और स्वाभाविक हिन्दी वर्णन है।
- source_word: מוֹסְרוֹתֶיהָ
  choice: बन्धन
  rationale: यह अनुशासन से बाँधने वाली वस्तुओं की छवि को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: פְּתִיל
  choice: धागे की डोरी
  rationale: मूल शब्द बटे हुए धागे या डोरी को सूचित कर सकता है; यह अभिव्यक्ति उसकी बनावट और डोरी-जैसी दृढ़ता दोनों बताती है।
- source_word: תְּכֵלֶת
  choice: नीले-बैंगनी
  rationale: यह विशिष्ट मूल्यवान रंजित रंग नीले से बैंगनी के बीच था; यूनानी ὑάκινθινον भी इसी रंग-सीमा का समर्थन करता है।
theological_decisions:
- issue: बुद्धि के अनुशासन को बन्धन और शोभा—दोनों के रूप में चित्रित करना
  choice: जूए और बन्धनों की छवि को सोने के आभूषण और मूल्यवान रंगीन डोरी के साथ बनाए रखना
  alternative: पद को केवल अलंकार या केवल बोझ के रूप में प्रस्तुत करना
  rationale: मूल की अर्थगत कसावट यही है कि बुद्धि से जुड़ने वाला अनुशासन बाँधता भी है और बहुमूल्य शोभा भी बनता है; किसी एक पक्ष को हटाना इस तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। स्त्रीलिंग सर्वनाम का संबंध प्रसंग में व्यक्तिरूप दी गई बुद्धि से है। “जूआ” और “बन्धन” मूल रूपक को स्पष्ट रखते हैं, जबकि “सोने का आभूषण” और “नीले-बैंगनी” उसकी सौन्दर्यात्मक तथा बहुमूल्य प्रकृति व्यक्त करते हैं।
