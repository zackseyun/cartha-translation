base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/037.yaml
  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: hi
  text: वह तुम्हारे हृदय को समझ प्रदान करेगा[a], और जो तुमने चाहा है, वही तुम्हें बुद्धिमान बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “वह स्वयं तुम्हारे हृदय को दृढ़ करेगा, और तुम्हारी बुद्धि की अभिलाषा तुम्हें दी जाएगी।” यहाँ उपलब्ध इब्रानी पाठ इसके बजाय कहता है: “वह तुम्हारे हृदय को समझ प्रदान करेगा, और जो तुमने चाहा है, वही तुम्हें बुद्धिमान बनाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: वह
  rationale: इब्रानी में पुल्लिंग एकवचन सर्वनाम है। निकटवर्ती यूनानी समानांतर पाठ में αὐτός का संकेत प्रभु की ओर है; इसलिए व्यक्तिगत कर्ता को बनाए रखने के लिए ‘वह’ उपयुक्त है।
- source_word: יָבִין
  choice: समझ देगा
  rationale: בין के हिफ़ील रूप का अर्थ कारणवाचक है—समझ देना या समझने योग्य बनाना। ‘समझ देगा’ सरल और स्वाभाविक हिन्दी में इस अर्थ को व्यक्त करता है।
- source_word: לִבֶּךָ
  choice: तुम्हारे हृदय को
  rationale: इब्रानी ‘हृदय’ विचार, विवेक और इच्छा के भीतरी केंद्र को दर्शाता है। ‘हृदय’ मूल बिंब को सुरक्षित रखता है, जबकि क्रिया उसके बौद्धिक आशय को स्पष्ट करती है।
- source_word: וַאֲשֶׁר אִוִּיתָה
  choice: और जिसकी तुमने अभिलाषा की है
  rationale: संबंधवाचक पद किसी इच्छित वस्तु को खुला छोड़ता है। ‘अभिलाषा की है’ אוה की इच्छा अथवा लालसा के अर्थ को dignified आधुनिक हिन्दी में रखता है।
- source_word: יְחַכְּמֶךָּ
  choice: वह तुम्हें बुद्धिमान बनाएगा
  rationale: क्रिया का कारणवाचक भाव ‘बुद्धिमान बनाना’ है। वाक्य में दूसरा ‘वह’ इच्छित वस्तु को कर्ता के रूप में स्पष्ट करता है और इब्रानी की वास्तविक अर्थगत असामान्यता को मिटाता नहीं।
theological_decisions:
- issue: पहले ‘वह’ का संदर्भ
  choice: प्रभु की ओर संकेत
  alternative: बुद्धि, मनन या कोई अनिर्दिष्ट कर्ता
  rationale: केवल उपलब्ध इब्रानी पंक्ति में पूर्वपद स्पष्ट नहीं है, पर यूनानी समानांतर पाठ में प्रभु की आज्ञाओं पर मनन के बाद ‘वह स्वयं’ आता है। इसलिए प्रभु का संदर्भ सबसे समर्थित है, यद्यपि मुख्य पाठ में नाम जोड़कर अस्पष्टता को पूरी तरह समाप्त नहीं किया गया।
- issue: दूसरे खंड में कर्ता
  choice: जिसकी अभिलाषा की गई है, वही बुद्धिमान बनाएगा
  alternative: प्रभु तुम्हें इच्छित बुद्धि देगा
  rationale: इब्रानी व्याकरण में אֲשֶׁר אִוִּיתָה के बाद יְחַכְּמֶךָּ आता है, जिससे इच्छित वस्तु को कर्ता की तरह पढ़ना स्वाभाविक है। यूनानी अलग पाठ देता है; उसे मुख्य इब्रानी पाठ में मिलाकर तनाव को शांत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘हृदय’ मूल इब्रानी मानवीय अंतःकरण की अवधारणा को सुरक्षित रखता है; ‘समझ देगा’ उसका बौद्धिक आशय सहज बनाता है।
