base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: hi
  text: हल चलानेवाले और फसल काटनेवाले की तरह उसके पास जाओ[a], और उसकी भरपूर उपज की प्रतीक्षा करो। क्योंकि उसकी सेवा में तुम थोड़ा ही परिश्रम करोगे, और शीघ्र ही[b] उसका फल खाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘हल चलानेवाले और बीज बोनेवाले की तरह’ है, न कि ‘हल चलानेवाले और फसल काटनेवाले की तरह’।
    reason: textual_variant
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘कल’ है; यहाँ इसका अर्थ ‘शीघ्र ही’ हो सकता है, और यूनानी पाठ भी ‘शीघ्र’ कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: हल चलाने और फसल काटनेवाले के समान
  rationale: इब्रानी पाठ में खेती के आरम्भ और कटनी—दोनों की छवि है। ‘फसल काटनेवाला’ आधुनिक हिन्दी में ‘लवनेवाला’ से अधिक सहज है।
- source_word: קְרַב אֵלֶיהָ
  choice: उसके पास जा
  rationale: आज्ञार्थक क्रिया निकट आने या पास जाने का निर्देश देती है। यह रूप सरल, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וְקַוֵּה
  choice: बाट जोह
  rationale: क्रिया में आशापूर्वक प्रतीक्षा करने का भाव है; खेती के प्रसंग में ‘बाट जोह’ धैर्यपूर्ण प्रतीक्षा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: उसकी भरपूर उपज
  rationale: רֹב बहुतायत और תְּבוּאָה खेत की उपज को सूचित करते हैं; यह चयन कृषि-रूपक को बनाए रखता है।
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  choice: उसकी सेवा में तू थोड़ा ही परिश्रम करेगा
  rationale: עבודה में काम और सेवा दोनों अर्थ निहित हैं। स्त्रीरूप में चित्रित प्रज्ञा के संदर्भ में ‘सेवा’ संबंधपरक भाव रखती है, जबकि ‘परिश्रम’ उसी धातु की श्रम-संबंधी पुनरावृत्ति को व्यक्त करता है।
- source_word: וּלְמָחָר
  choice: और शीघ्र ही
  rationale: शाब्दिक अर्थ ‘और कल’ है, पर यहाँ निकट भविष्य का आशय संभव है; यूनानी समानांतर का ταχὺ भी ‘शीघ्र’ का समर्थन करता है। शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: פִּרְיָהּ
  choice: उसका फल
  rationale: ‘फल’ कृषि-रूपक और प्रज्ञा से मिलनेवाले परिणाम—दोनों को संक्षेप में बनाए रखता है। हिन्दी के स्त्रीलिंग-संबंधसूचक रूप ‘उसका’ का चयन संज्ञा ‘फल’ के लिंग के अनुसार है और इससे मूल की स्त्री-व्यक्तिकरण छवि नहीं मिटती।
theological_decisions:
- issue: प्रज्ञा का स्त्रीरूप में व्यक्तिकरण
  choice: स्त्री को सूचित करनेवाले संबंधसूचक रूप ‘उसकी’ के द्वारा व्यक्तिकरण बनाए रखा गया
  alternative: प्रज्ञा को निर्जीव अमूर्त वस्तु मानकर तटस्थ ढंग से प्रस्तुत करना
  rationale: इब्रानी संदर्भ प्रज्ञा को स्त्रीरूप में प्रस्तुत करता है। हिन्दी में सर्वनाम का रूप प्रायः संबंधित संज्ञा के लिंग पर निर्भर होता है, इसलिए जहाँ संभव है वहाँ ‘उसकी’ इस साहित्यिक और धर्मवैचारिक छवि को बनाए रखता है।
- issue: इब्रानी और यूनानी में कृषि-क्रिया का पाठांतर
  choice: मुख्य पाठ में इब्रानी ‘हल चलाने और फसल काटनेवाले’ का अनुसरण
  alternative: यूनानी ‘हल चलाने और बीज बोनेवाले’
  rationale: उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है; फिर भी यूनानी का सार्थक पाठांतर पादटिप्पणी में स्पष्ट रूप से दिया गया है, ताकि पाठगत तनाव मिटाया न जाए।
- issue: וּלְמָחָר का समय-संबंधी अर्थ
  choice: मुख्य पाठ में ‘शीघ्र ही’, पादटिप्पणी में शाब्दिक ‘कल’
  alternative: मुख्य पाठ में सीधे ‘कल’
  rationale: इब्रानी का शाब्दिक अर्थ सुरक्षित रखना आवश्यक है, पर प्रसंग में यह निकट भविष्य का मुहावरेदार संकेत हो सकता है और यूनानी ‘शीघ्र’ पढ़ता है। मुख्य पाठ स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। एकवचन संबोधन के लिए ‘तू’ चुना गया है, जो ज्ञान-साहित्य की सीधी व्यक्तिगत शिक्षा और इब्रानी के एकवचन रूप को स्पष्ट रखता है। कृषि-संबंधी शब्दावली सामान्य पाठक के लिए परिचित रखी गई है।
