base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/036.yaml
  text: Reflect on the fear of the Most High and on his commandments[a]; meditate continually.
translation:
  language: hi
  text: परमप्रधान के भय और उसकी आज्ञाओं पर विचार कर[a]; निरन्तर मनन करता रह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यदि तू किसी समझदार मनुष्य को देखे, तो भोर होते ही उसके पास जा, और तेरा पैर उसके द्वार की सीढ़ियाँ घिस डाले।” यहाँ उपलब्ध इब्रानी पाठ यूनानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: विचार कर
  rationale: हित्पोलेल रूप यहाँ ध्यानपूर्वक सोचने और समझने का भाव देता है। ‘विचार कर’ आधुनिक हिन्दी में स्वाभाविक है और केवल देखने के बजाय चिंतनशील ध्यान को व्यक्त करता है।
- source_word: בְּיִרְאַת
  choice: के भय
  rationale: ज्ञान-साहित्य में יראה श्रद्धा, विस्मय और जवाबदेही से भरे धार्मिक भय को समेटता है। ‘भय’ स्थापित बाइबलीय पदावली और इसके धर्मवैचारिक भार को सुरक्षित रखता है; इसे केवल ‘श्रद्धा’ तक सीमित नहीं करता।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: עליון परमेश्वर की उपाधि है। ‘परमप्रधान’ हिन्दी बाइबलीय भाषा में स्पष्ट, प्रतिष्ठित और उसके सर्वोच्च होने का उपयुक्त द्योतक है।
- source_word: וּבְמִצוֹתָיו
  choice: और उसकी आज्ञाओं पर
  rationale: संयोजक और पूर्वसर्ग इस पदबंध को पहले पदबंध के साथ उसी क्रिया का दूसरा विषय बनाते हैं। ‘आज्ञाओं’ से बाइबलीय और वाचा-संबंधी अर्थ बना रहता है।
- source_word: וֶהְגֵה
  choice: मनन करता रह
  rationale: הגה विचार में लगे रहने को दर्शाता है और कभी धीमे स्वर में दोहराने का संकेत भी रखता है। ‘मनन करता रह’ चिंतन और उसकी निरंतरता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָמִיד
  choice: निरन्तर
  rationale: תמיד सतत या नियमित रूप से जारी रहने का भाव देता है। ‘निरन्तर’ इस कालगत विस्तार को गरिमापूर्ण और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी पाठ के बीच पर्याप्त भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है और यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी: “यदि तू किसी समझदार मनुष्य को देखे, तो भोर होते ही उसके पास जा, और तेरा पैर उसके द्वार की सीढ़ियाँ घिस डाले।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। इस पद में यूनानी पाठ का आशय बहुत भिन्न है, इसलिए पाठ-साक्ष्य की वास्तविक विविधता को छिपाए बिना उसे वैकल्पिक पाठ के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। एकवचन अनौपचारिक आज्ञार्थक ‘कर/रह’ आसपास के उपदेशात्मक रूप के अनुकूल है। ‘विचार’ और ‘मनन’ द्वारा दोनों इब्रानी क्रियाओं में अंतर रखा गया है; अर्धविराम दूसरी क्रिया को स्वतंत्र रखते हुए दोनों उपदेशों का निकट संबंध दिखाता है।
