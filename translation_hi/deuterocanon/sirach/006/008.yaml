    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: मित्र
  rationale: इस कृदंत का शाब्दिक अर्थ ‘प्रेम करने वाला’ है, पर इस ज्ञान-साहित्यिक संदर्भ में यह संज्ञा के रूप में साथी या मित्र को दर्शाता है; यूनानी φίλος भी इसकी पुष्टि करता है।
- source_word: כְּפִי עֵת
  choice: अवसर भर का
  rationale: यह मुहावरेदार पद समय या परिस्थिति से बँधी मित्रता बताता है। ‘अवसर भर का’ ऐसी मित्रता की अस्थायी और परिस्थितिनिर्भर प्रकृति को सहज हिन्दी में व्यक्त करता है।
- source_word: יַעֲמוֹד
  choice: अडिग रहेगा
  rationale: עמד का मूल अर्थ ‘खड़ा रहना’ है, पर यहाँ आशय कठिनाई में स्थिर और वफ़ादार बने रहने से है। यूनानी παραμείνῃ भी टिके रहने का भाव देता है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह चयन मूल इब्रानी के ‘संकट के दिन’ वाले मुहावरे और विपत्ति के अर्थ, दोनों को बनाए रखता है।
