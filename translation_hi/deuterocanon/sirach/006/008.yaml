  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: hi
  text: क्योंकि कोई मित्र केवल अवसर का होता है[a], और संकट के दिन अडिग नहीं रहेगा।
  philosophy: optimal-equivalence
