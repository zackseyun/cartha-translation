base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/032.yaml
  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
translation:
  language: hi
  text: यदि तू चाहे[a], हे मेरे पुत्र, तो तू बुद्धिमान बनेगा; और यदि तू अपना मन लगाए[b], तो तू सूझ-बूझ वाला बनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यदि तू इच्छुक हो, हे बालक, तो तुझे शिक्षा मिलेगी; और यदि तू अपना प्राण/जीवन दे, तो तू कुशल/चतुर होगा।” यहाँ ‘अपना प्राण/जीवन दे’ यूनानी का शाब्दिक बिंब है। हिब्रू और यूनानी का समग्र आशय समान है, पर जहाँ हिब्रू में “बुद्धिमान बनेगा” है, वहाँ यूनानी शिक्षा पाने पर बल देता है।'
    reason: alternative_reading
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “अपना हृदय रखना” है। यह जान-बूझकर ध्यान देने और स्वयं को समर्पित करने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: यदि तू चाहे
  rationale: חפץ इच्छा, अभिलाषा और स्वेच्छापूर्वक तत्पर होने का भाव व्यक्त करता है। संदर्भ से इसका निहित विषय बुद्धि की खोज है; हिन्दी में बिना अनावश्यक कर्म जोड़े यह वाक्य स्वाभाविक है। यूनानी ἐὰν θέλῃς भी इच्छा अथवा तत्परता की शर्त का समर्थन करता है।
- source_word: בְּנִי
  choice: मेरे पुत्र
  rationale: हिब्रू पद स्पष्ट रूप से पुल्लिंग एकवचन संबोधन है। ‘मेरे पुत्र’ मूल की लिंग-सटीकता और ज्ञान-साहित्य की शिक्षापरक गरिमा बनाए रखता है।
- source_word: תִּתְחַכָּם
  choice: तू बुद्धिमान बनेगा
  rationale: חכם का हित्पएल रूप बुद्धिमत्ता की अवस्था में बढ़ने या प्रवेश करने का भाव देता है। इसलिए ‘बुद्धिमान बनेगा’ विकासशील अर्थ को सीधे व्यक्त करता है; यूनानी में ‘शिक्षित किया जाएगा’ है, जिसे पाठांतर-संबंधी टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: और यदि तू अपना मन लगाए
  rationale: शाब्दिक रूप से ‘अपना हृदय रखे’ वाला हिब्रू मुहावरा जान-बूझकर ध्यान और प्रतिबद्धता व्यक्त करता है। आधुनिक हिन्दी में ‘अपना मन लगाना’ उसी आशय का स्वाभाविक समतुल्य है।
- source_word: תַּעֲרֹם
  choice: तू सूझ-बूझ वाला बनेगा
  rationale: ערם यहाँ सकारात्मक ज्ञान-संदर्भ में व्यावहारिक चतुराई, विवेक और कुशल समझ बताता है, न कि छल-कपट। ‘सूझ-बूझ वाला’ इस सकारात्मक किन्तु तीक्ष्ण व्यावहारिक बुद्धि को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
