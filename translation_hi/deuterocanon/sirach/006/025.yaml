translation:
  language: hi
  text: अपने कंधे को झुका और उसे उठाए रख; उसके बंधनों[a] से घृणा न कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पद कठिन है; यूनानी समानांतर में ‘उसके बंधन’ है, जो संभवतः ज्ञान के अनुशासन द्वारा बाँधे रखने का अभिप्रेत चित्र सुरक्षित रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: הַט שִׁכְמְךָ
  choice: अपना कंधा झुका
  rationale: נטה का आज्ञार्थ जानबूझकर झुकने का भाव देता है, और שכם का शाब्दिक अर्थ ‘कंधा’ है। यह ज्ञान का भार उठाने के सजीव रूपक को बनाए रखता है।
- source_word: וְשָׂאֶהָ
  choice: और उसे उठा ले
  rationale: נשׂא यहाँ स्त्रीलिंग कर्म—व्यक्तिरूप में प्रस्तुत ज्ञान—को उठाने और वहन करने का भाव देता है। ‘उठा ले’ हिंदी में इस भार-वहन रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאַל תָּקוֹץ
  choice: घृणा न कर
  rationale: קוץ यहाँ अरुचि, विकर्षण या घृणा से पीछे हटने का प्रबल भाव रखता है। ‘घृणा न कर’ संक्षिप्त, स्वाभाविक और स्रोत की तीव्रता के अनुरूप है।
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: उसके बंधनों से
  rationale: इब्रानी पद इस स्थान पर पाठगत रूप से कठिन है। यूनानी समानांतर δεσμοῖς, ‘बंधनों’, को समर्थन देता है; यह ज्ञान के अनुशासन और नियंत्रण के रूपक को भी बनाए रखता है।
theological_decisions:
- issue: ज्ञान का स्त्रीरूप में व्यक्तिकरण
  choice: स्त्रीलिंग संदर्भ को ‘उसे’ और ‘उसके’ के द्वारा बनाए रखा गया
  alternative: ज्ञान को अव्यक्त ‘वह वस्तु’ मानकर रूपक को समतल करना
  rationale: इब्रानी स्त्रीलिंग प्रत्यय और यूनानी स्त्रीलिंग सर्वनाम दोनों आसपास के प्रसंग में व्यक्तिरूप ज्ञान की ओर संकेत करते हैं। हिंदी के ये सर्वनाम व्याकरणतः लिंग-निरपेक्ष दिख सकते हैं, पर संदर्भ में व्यक्तिकरण सुरक्षित रहता है।
- issue: कठिन इब्रानी पद תַחְבּוּלוֹתֶיהָ का निर्वचन
  choice: मुख्य पाठ में यूनानी-समर्थित ‘बंधन’
  alternative: युक्तियाँ; रोक-टोक; अनुशासन
  rationale: इब्रानी पाठ को प्राथमिक रखते हुए उसकी कठिनता को पाद-टिप्पणी में स्पष्ट किया गया है। यूनानी समानांतर ‘बंधन’ का सीधा पाठ देता है और प्रसंग के भार तथा अनुशासन के रूपक से मेल खाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में संक्षिप्त, आज्ञार्थक और गरिमापूर्ण रखी गई है। ‘कंधा झुका’, ‘उठा ले’ और ‘बंधन’ मूल के शारीरिक तथा अनुशासनात्मक रूपक को सामान्य पाठक के लिए स्पष्ट रखते हैं।
