base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/035.yaml
  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
translation:
  language: hi
  text: देखो कि कौन समझदार है[a], और उसे लगन से खोजो; उसकी देहरी पर अपना पैर घिसते रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “हर दैवीय शिक्षा को सुनने की इच्छा रखो, और समझ के नीतिवचन तुमसे न छूटें।” यहाँ इब्रानी और यूनानी पाठों में बहुत अंतर है, यद्यपि दोनों बुद्धि को उत्सुकता से खोजने का आग्रह करते हैं।'
    reason: alternative_reading
  - marker: b
    text: शाब्दिक चित्र है—उसकी देहरी पर अपना पैर घिसते रहना; अर्थात् सीखने के लिए किसी समझदार व्यक्ति के घर बार-बार जाना।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: देख
  rationale: आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से रखता है; यहाँ भाव किसी समझदार व्यक्ति को पहचानने का है।
- source_word: מִי יָבִין
  choice: कौन समझदार है
  rationale: यह पद ऐसे व्यक्ति की ओर संकेत करता है जिसमें समझ-बूझ है। यह हिन्दी में स्वाभाविक है और इब्रानी के व्यक्तिकेंद्रित भाव को बनाए रखता है।
- source_word: וְשַׁחֲרֵהוּ
  choice: और उसे यत्न से खोज
  rationale: שחר यहाँ लगन या तत्परता से खोजने का भाव देता है। ‘यत्न से खोज’ उस सक्रिय और गंभीर खोज को व्यक्त करता है, बिना ‘भोर में खोजने’ के संभावित शाब्दिक अर्थ को अनावश्यक रूप से थोपे।
- source_word: וְתִשְׁחוֹק
  choice: घिसते रह
  rationale: पैर और देहरी के संदर्भ में यह बार-बार आने-जाने से घिसने का चित्र प्रस्तुत करता है। निरंतरता बताने वाला ‘रह’ दृढ़ता और आवृत्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּסִפּוֹ
  choice: उसकी देहरी पर
  rationale: סַף का सामान्य अर्थ देहरी या चौखट का निचला भाग है। ‘देहरी’ घर पर बार-बार उपस्थित होने के चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: רַגְלְךָ
  choice: अपना पैर
  rationale: इब्रानी में एकवचन है; हिन्दी में भी एकवचन रखते हुए मूल चित्र सुरक्षित रखा गया है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध और अर्थपूर्ण इब्रानी पाठ का अनुवाद किया गया है; यूनानी पाठ को पादटिप्पणी में वैकल्पिक पाठ के रूप में सुरक्षित रखा गया है।
  alternative: 'यूनानी-आधारित अनुवाद: ‘हर ईश्वरीय उपदेश को सुनने की इच्छा रख, और समझ की नीतिवचन-सदृश बातों को अपने हाथ से न निकलने दे।’'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी जाती है। यहाँ यूनानी साक्षी की शब्दावली बहुत भिन्न है, फिर भी दोनों पाठ बुद्धि की उत्सुक खोज का आग्रह करते हैं। इब्रानी पाठ अपने आप में संगत है, इसलिए उसे मुख्य पाठ बनाया गया और वास्तविक पाठांतर को छिपाने के बजाय पादटिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। ‘यत्न से’ ज्ञान-साहित्य के अनुरूप हल्की औपचारिकता देता है, जबकि ‘अपना पैर घिसते रह’ मूल इब्रानी के सजीव और कुछ असामान्य चित्र को बनाए रखता है।
