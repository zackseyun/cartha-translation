translation:
  language: hi
  text: अपने पैर उसकी बेड़ियों में डाल, और अपनी गर्दन उसके जुए में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राप्त हिब्रू पाठ यहाँ इस पद के यूनानी पाठ से बिल्कुल अलग है: “जैसी पेड़ की देखभाल, वैसा उसका फल; वैसे ही मनुष्य की प्रवृत्ति के अनुसार उसका विचार।” पदक्रम और प्रसंग के आधार पर मुख्य पाठ यूनानी से अनूदित है।'
    reason: महत्त्वपूर्ण पाठांतर को छिपाने के बजाय पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: πέδας
  choice: बेड़ियों
  rationale: यूनानी समानांतर में पैरों को बाँधने वाली बेड़ियाँ अभिप्रेत हैं; यह बिंब हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κλοιόν
  choice: जुए
  rationale: κλοιός गर्दन में डाले जाने वाले बंधन या कंठे को दर्शाता है। प्रसंग में ज्ञान के अनुशासन को स्वेच्छा से स्वीकार करने का बिंब है; ‘जुआ’ आधुनिक बाइबलीय हिन्दी में इसे संक्षेप और गरिमा से व्यक्त करता है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: स्त्रीलिंग सर्वनाम पूर्ववर्ती ‘बुद्धि’ की ओर संकेत करता है; हिन्दी में भी स्त्रीलिंग संबंध सुरक्षित रखा गया है।
theological_decisions:
- issue: प्राप्त हिब्रू पाठ और पद-संदर्भ के यूनानी पाठ में बड़ा असंगतिपूर्ण अंतर
  choice: इस पद के लिए यूनानी समानांतर का अनुवाद
  alternative: 'प्रदत्त हिब्रू का अनुवाद: ‘जैसी पेड़ की देखभाल, वैसा उसका फल; वैसे ही मनुष्य की प्रवृत्ति के अनुसार उसका विचार।’'
  rationale: प्रदत्त हिब्रू वाक्य का विषय और आशय इस पद के मान्य यूनानी पाठ तथा 6:23–25 के क्रम से मेल नहीं खाता और सम्भवतः किसी अन्य स्थान की मिश्रित पांडुलिपीय सामग्री है। स्रोत-टिप्पणी स्वयं बड़ी असंगति बताती है और हिब्रू के अनिश्चित होने पर यूनानी को सहायक आधार बनाने की अनुमति देती है।
translation_notes:
  register: आज्ञार्थक एकवचन शैली रखी गई है। भाषा आधुनिक, सीधी और गरिमापूर्ण है; स्त्रीलिंग ‘उसकी’ से प्रसंग की बुद्धि की मानवीकृत छवि बनी रहती है।
