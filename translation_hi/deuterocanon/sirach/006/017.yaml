base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/017.yaml
  text: For as he is[a], so is his friend, and as his name, so are his deeds.
translation:
  language: hi
  text: क्योंकि जैसा वह है,[a] वैसा ही उसका मित्र भी है; और जैसा उसका नाम है, वैसे ही उसके कर्म हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “जो प्रभु का भय मानता है, वह अपनी मित्रता को सही दिशा देता है, क्योंकि जैसा वह है, वैसा ही उसका पड़ोसी भी है।” यहाँ पहले खंड में इब्रानी साक्ष्य यूनानी पाठ से काफी भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: जैसा वह स्वयं है
  rationale: כ־ सहित सर्वनाम का स्वाभाविक अर्थ ‘जैसा वह है’ है। ‘स्वयं’ हिन्दी में तुलना को स्पष्ट करता है और इब्रानी कहावत की संक्षिप्तता बनाए रखता है।
- source_word: רֵעֵהוּ
  choice: उसका मित्र
  rationale: רֵעַ का अर्थ मित्र, साथी या पड़ोसी हो सकता है। मित्रता के प्रसंग और यूनानी समानांतर में φιλίαν के कारण ‘मित्र’ यहाँ सबसे उपयुक्त है।
- source_word: כִּשְׁמוֹ
  choice: जैसा उसका नाम
  rationale: इब्रानी में शाब्दिक रूप से ‘उसका नाम’ है। यह प्रतिष्ठा का संकेत दे सकता है, पर ‘नाम’ रखने से मूल की अर्थगत खुलावट बनी रहती है।
- source_word: מַעֲשָׂיו
  choice: उसके काम
  rationale: מַעֲשָׂיו कर्मों या किए हुए कामों को दर्शाता है। आधुनिक हिन्दी में ‘काम’ सहज और व्यापक है, जबकि प्रसंग उसका नैतिक आशय बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में उल्लेखनीय अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: “जो प्रभु का भय मानता है, वह अपनी मित्रता को सही दिशा देता है, क्योंकि जैसा वह है, वैसा ही उसका पड़ोसी भी है।”
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है, इसलिए मुख्य अनुवाद उसी पर आधारित है। यूनानी पाठ का पहला खंड काफी अलग है; पाठांतर को छिपाने के बजाय पादटिप्पणी में पूरा वैकल्पिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘नाम’ का शाब्दिक रूप बनाए रखकर ‘प्रतिष्ठा’ जैसे व्याख्यात्मक विस्तार से बचा गया है।
