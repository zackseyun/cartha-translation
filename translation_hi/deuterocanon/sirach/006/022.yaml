  text: For discipline is true to its name[a], and it is not evident to many.
translation:
  language: hi
  text: क्योंकि अनुशासन वैसा ही है जैसा उसका नाम बताता है,[a] और बहुतों के लिए वह स्पष्ट नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “क्योंकि बुद्धि वैसी ही है जैसा उसका नाम बताता है, और बहुतों के लिए वह स्पष्ट नहीं है।” जहाँ इब्रानी साक्ष्य में “अनुशासन” है, वहाँ यूनानी में “बुद्धि” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוּסָר
  choice: अनुशासन
  rationale: इब्रानी מוּסָר का अर्थ अनुशासन, शिक्षा या सुधार हो सकता है। यहाँ मुख्य इब्रानी पाठ का अनुसरण करते हुए “अनुशासन” रखा गया है; यूनानी समानांतर में “बुद्धि” है।
- source_word: בִּשְׁמָהּ כֵּן הִיא
  choice: अपने नाम के अनुरूप ही है
  rationale: शाब्दिक भाव “अपने नाम के अनुसार ऐसी ही है” है। यह हिन्दी प्रयोग मूल के नाम और स्वभाव के बीच संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְכוֹחָה
  choice: स्पष्ट
  rationale: इस प्रसंग में शब्द का भाव प्रत्यक्ष, साफ़ या आसानी से समझ में आने योग्य होने का है। यूनानी φανερά भी “प्रकट/स्पष्ट” अर्थ का समर्थन करता है।
- source_word: לְרַבִּים
  choice: बहुतों के लिए
  rationale: לְ उपसर्ग और רַבִּים का सहज हिन्दी रूप, जो “स्पष्ट नहीं है” के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: विषय-संज्ञा में इब्रानी और यूनानी पाठांतर
  choice: मुख्य पाठ में इब्रानी के अनुसार “अनुशासन”
  alternative: यूनानी समानांतर के अनुसार “बुद्धि”
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य प्राथमिक रखा गया है। चूँकि यूनानी पाठ का भेद अर्थ की दृष्टि से महत्त्वपूर्ण है, उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। “अपने नाम के अनुरूप” मूल अभिव्यक्ति को स्वाभाविक रखते हुए उसकी हल्की अर्थगत असामान्यता को बनाए रखता है।
