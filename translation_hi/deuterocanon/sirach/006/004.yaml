base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/004.yaml
  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: hi
  text: क्योंकि उग्र स्वभाव अपने मालिक को नष्ट कर देता है और उसे शत्रुओं के आनन्द का विषय बना देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में, “और शत्रु का आनन्द उन्हें आ पकड़ेगा।” हिब्रू पाठ में “उसके मालिकों” और “उन्हें” बहुवचन हैं, और इस अंतिम उपवाक्य का आशय कठिन है। यूनानी समानांतर में है, “और वह उसे शत्रुओं के आनन्द का विषय बना देगा”; मुख्य पाठ इसी अर्थ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: मन
  rationale: यहाँ शब्द व्यक्ति के भीतरी स्वभाव या प्रवृत्ति को दर्शाता है। ‘मन’ आधुनिक हिन्दी में स्वाभाविक है और ‘आत्मा’ से उत्पन्न हो सकने वाले अनावश्यक तात्त्विक अर्थ से बचता है।
- source_word: עַזָּה
  choice: उग्र
  rationale: मूल अर्थ बलवान या प्रबल है, पर इस चेतावनी के संदर्भ में अनियंत्रित और कठोर प्रवृत्ति अभिप्रेत है। ‘उग्र’ इस नकारात्मक तीव्रता को बनाए रखता है; यूनानी πονηρά इसे स्पष्ट रूप से बुरा बताता है।
- source_word: תַּשְׁחִית
  choice: नष्ट कर देता है
  rationale: שחת का अर्थ नष्ट करना, बिगाड़ना या बरबाद करना हो सकता है। यहाँ आत्म-विनाशकारी परिणाम की तीव्रता के कारण ‘नष्ट कर देता है’ उपयुक्त है।
- source_word: בְּעָלֶיהָ
  choice: अपने स्वामी को
  rationale: בעל का भाव स्वामी या अधिकारी का है। हिन्दी में ‘अपने स्वामी को’ उस व्यक्ति के लिए संक्षिप्त और बोधगम्य है जिसके भीतर यह उग्र मन है, यद्यपि हिब्रू रूप को बहुवचन भी समझा जा सकता है।
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: शत्रुओं के आनन्द का कारण
  rationale: हिब्रू में शाब्दिक रूप से ‘शत्रु का आनन्द’ है। यूनानी समानांतर के अनुसार आशय यह है कि उस व्यक्ति का विनाश शत्रुओं के आनन्द का विषय बनता है। हिन्दी में ‘आनन्द का कारण’ इस विधेयात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּשִּׂיגֵם
  choice: उसे … बना देता है
  rationale: हिब्रू נשׂג सामान्यतः ‘पकड़ लेना/जा पहुँचना’ है और यहाँ प्रत्यय बहुवचन ‘उन्हें’ है। वाक्य कठिन है; यूनानी ποιήσει αὐτόν (‘उसे बना देगा’) एक सुसंगत अर्थ देता है, इसलिए मुख्य पाठ उसी अर्थ को ग्रहण करता है और हिब्रू रूप को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: कठिन अंतिम उपवाक्य में हिब्रू और यूनानी का संबंध
  choice: 'पहले उपवाक्य को हिब्रू से और अंतिम उपवाक्य के आशय को यूनानी समानांतर के सहारे प्रस्तुत किया गया: ‘उसे शत्रुओं के आनन्द का कारण बना देता है।’'
  alternative: ‘और शत्रु का आनन्द उन्हें आ पकड़ता है’ अथवा ‘और शत्रु का आनन्द उन तक पहुँचता है।’
  rationale: हिब्रू अंतिम उपवाक्य में वचन और अर्थ की कठिनाई रखता है, जबकि यूनानी एक स्पष्ट, संदर्भानुकूल वाक्य देता है। मुख्य पाठ पठनीय अर्थ देता है, पर पादटिप्पणी हिब्रू की वास्तविक अनिश्चितता को छिपाती नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उग्र मन’ भीतरी अनियंत्रित प्रवृत्ति को सामान्य पाठक के लिए स्पष्ट रखता है; अंतिम उपवाक्य स्वाभाविक हिन्दी में है और पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
