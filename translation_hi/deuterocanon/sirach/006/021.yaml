    reason: alternative_reading
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: भारी पत्थर के समान
  rationale: כְּ उपमा सूचित करता है और מַשָּׂא का मूल अर्थ ‘बोझ/भार’ है। स्वाभाविक हिन्दी में ‘भारी पत्थर’ भार की छवि को स्पष्ट रखता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תִּהְיֶה עָלָיו
  choice: वह उस पर ... होगी
  rationale: यह रूप मूल पाठ की भविष्यकालीन क्रिया और व्यक्ति पर पत्थर के भार की छवि को बनाए रखता है। स्त्रीलिंग ‘होगी’ प्रसंग में ज्ञान/शिक्षा की ओर संकेत भी सुरक्षित रखता है।
- source_word: וְלֹא יְאַחֵר
  choice: देर नहीं करेगा
  rationale: हिफ़ील क्रिया אחר का सीधा अर्थ यहाँ किसी काम को करने में विलंब करना है।
- source_word: לְהַשְׁלִיכָה
  choice: उसे फेंक देने में
  rationale: क्रिया का अर्थ ‘फेंकना/दूर कर देना’ है। स्त्रीलिंग प्रत्यय को ‘उसे’ से बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: इब्रानी ‘बोझ के पत्थर’ और यूनानी ‘परीक्षा के दृढ़ पत्थर’ के बीच अंतर
  choice: मुख्य पाठ में इब्रानी की भार-वाली छवि को प्राथमिकता दी गई और यूनानी पाठांतर पादटिप्पणी में रखा गया।
  alternative: वह उस पर परीक्षा के भारी पत्थर के समान होगी।
  rationale: उपलब्ध इब्रानी पाठ स्पष्ट रूप से מַשָּׂא (‘बोझ/भार’) पढ़ता है, जबकि यूनानी δοκιμασίας (‘परीक्षा/परख’) एक वास्तविक अर्थभेद प्रस्तुत करता है। दोनों को मिलाकर एक नया संयुक्त वाक्य बनाने के बजाय पाठगत तनाव को पादटिप्पणी द्वारा ईमानदारी से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘उस पर’ मूल भार-रूपक को बनाए रखता है, जबकि ‘भारी पत्थर’ अस्वाभाविक ‘बोझ का पत्थर’ की अपेक्षा सामान्य पाठक के लिए स्पष्ट है।
