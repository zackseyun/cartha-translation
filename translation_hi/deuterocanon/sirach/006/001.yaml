base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: hi
  text: मित्र के बदले शत्रु मत बन[a], क्योंकि बुरा नाम लज्जा और अपमान का वारिस होगा; ऐसा ही दोहरी ज़बान वाला[b] दुष्ट मनुष्य होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वर्तमान इब्रानी साक्षी संक्षिप्त है और लगभग ऐसा पढ़ता है: “बुरा नाम लज्जा और अपमान का वारिस होगा; ऐसा ही दो [वस्तुओं] का स्वामी दुष्ट मनुष्य है।” यूनानी पाठ आरम्भ में “मित्र के बदले शत्रु मत बन” जोड़ता है और अन्तिम अभिव्यक्ति को “दोहरी ज़बान वाला” समझता है। यूनानी में “दुष्ट मनुष्य” के स्थान पर “पापी” है।'
    reason: textual_variant
  - marker: b
    text: इब्रानी अभिव्यक्ति शाब्दिक रूप से “दो [वस्तुओं] का स्वामी” है और उसका आशय अनिश्चित है; यूनानी में “दोहरी ज़बान वाला” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: बुरा नाम
  rationale: इब्रानी और यूनानी दोनों में शाब्दिक रूप से ‘बुरा नाम’ है। हिन्दी में यह मुहावरा प्रतिष्ठा का भाव भी व्यक्त करता है और मूल बिंब को बनाए रखता है।
- source_word: וְקָלוֹן / αἰσχύνη
  choice: लज्जा
  rationale: यह सार्वजनिक शर्म और अनादर का भाव देता है; अगले समानार्थी पद से भेद बनाए रखने के लिए ‘लज्जा’ चुना गया है।
- source_word: חֶרְפָּה / ὄνειδος
  choice: अपमान
  rationale: यह निंदा, तिरस्कार और सार्वजनिक बदनामी का बोध कराता है; आधुनिक हिन्दी में ‘अपमान’ सहज और स्पष्ट है।
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: का वारिस होगा
  rationale: इब्रानी रूप प्रसंग में कठिन है, पर यूनानी पाठ विरासत पाने के रूपक की पुष्टि करता है। इसलिए रूपक को समतल करके ‘पाएगा’ नहीं किया गया।
- source_word: אִישׁ רַע / ὁ ἁμαρτωλός
  choice: दुष्ट मनुष्य
  rationale: यह चयन उपलब्ध इब्रानी ‘बुरा/दुष्ट मनुष्य’ को प्राथमिकता देता है; यूनानी में इसके स्थान पर ‘पापी’ है, जिसे पाठांतर टिप्पणी में बताया गया है।
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: दोहरी ज़बान वाला
  rationale: इब्रानी का शाब्दिक अर्थ लगभग ‘दो [वस्तुओं] का स्वामी’ है और वह अस्पष्ट है; यूनानी δίγλωσσος इसे दोहरी बात बोलने वाले के रूप में समझाता है। हिन्दी अभिव्यक्ति संभावित आशय और ज़बान के रूपक दोनों को सुरक्षित रखती है।
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: मित्र के बदले शत्रु मत बन
  rationale: यह यूनानी पाठ का स्पष्ट निषेध है। वर्तमान इब्रानी साक्षी में यह वाक्य नहीं बचा है, इसलिए इसके साक्ष्यगत स्थान को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: इब्रानी और यूनानी साक्षियों में बड़ा अंतर
  choice: स्पष्ट यूनानी चेतावनी को मुख्य पाठ में रखा गया, साझा मूल चेतावनी का अनुवाद किया गया, और भिन्नता को पादटिप्पणी में खुला रखा गया।
  alternative: 'केवल बचे हुए इब्रानी का अनुवाद: ‘बुरा नाम लज्जा और अपमान का वारिस होगा; ऐसा ही दो [वस्तुओं] का स्वामी दुष्ट मनुष्य है।’'
  rationale: यहाँ इब्रानी पाठ छोटा और अंतिम पद में अस्पष्ट है, जबकि यूनानी अधिक पूर्ण है। संयुक्त प्रस्तुति पाठकों को सुबोध वचन देती है, पर पादटिप्पणी किसी एक साक्षी को चुपचाप मूल घोषित नहीं करती।
- issue: אִישׁ רַע और ὁ ἁμαρτωλός का अंतर
  choice: मुख्य पाठ में इब्रानी के निकट ‘दुष्ट मनुष्य’ रखा गया।
  alternative: यूनानी के अनुसार ‘पापी’।
  rationale: मूलभाषीय इब्रानी साक्षी को प्राथमिकता दी गई, जबकि अर्थगत अंतर को पादटिप्पणी में दर्ज किया गया; इससे नैतिक आशय को अनावश्यक रूप से किसी विशेष धर्मवैज्ञानिक शब्दावली में नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोपयोगी शैली रखी गई है। ‘बुरा नाम’ और ‘वारिस होगा’ जैसे मूल रूपक सुरक्षित हैं। ‘दोहरी ज़बान वाला’ सामान्य पाठक के लिए बोधगम्य है, जबकि उसकी पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट है।
