base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/011.yaml
  text: In your prosperity he is like you[a], but in your adversity he will separate himself from you.
translation:
  language: hi
  text: तेरी समृद्धि में वह तेरे जैसा होता है, पर तेरी विपत्ति में वह तुझसे अलग हो जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में दूसरी पंक्ति है, “और वह तेरे सेवकों से बेधड़क बोलेगा।” उपलब्ध इब्रानी साक्ष्य में इसके बदले है, “वह तुझसे अलग हो जाएगा।” जहाँ सीराख का इब्रानी पाठ उपलब्ध है, मुख्य पाठ उसी का अनुसरण करता है; इस बड़े पाठांतर के कारण यूनानी पाठ यहाँ दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: तेरी समृद्धि में
  rationale: טובה यहाँ अच्छी परिस्थिति या संपन्न दशा को सूचित करता है और רעה के साथ स्पष्ट विरोध बनाता है। ‘समृद्धि’ स्वाभाविक और गरिमापूर्ण है, यद्यपि इसका अर्थ केवल धन तक सीमित नहीं है।
- source_word: הוּא כָמוֹךָ
  choice: वह तेरे जैसा बना रहता है
  rationale: शाब्दिक अर्थ ‘वह तेरे जैसा है’ है। प्रसंग में यह अनुकूल समय में मित्र के अपने को निकटता से जोड़ने को व्यक्त करता है; ‘बना रहता है’ अपूर्ण क्रिया के प्रसंगगत भाव को सहज हिन्दी में रखता है।
- source_word: וּבְרָעָתְךָ
  choice: पर तेरी विपत्ति में
  rationale: רעה यहाँ טובה के विपरीत बुरी परिस्थिति, संकट या दुर्भाग्य है। समानांतर पंक्तियों का विरोध स्पष्ट करने के लिए ו को ‘पर’ किया गया है।
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: वह तुझसे अलग हो जाएगा
  rationale: हित्पएल रूप स्वयं दूरी बनाने या अलग होने का भाव देता है। यह अनुवाद उस आत्मवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में दूसरी पंक्ति का बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी ‘वह तुझसे अलग हो जाएगा’ का अनुसरण
  alternative: 'यूनानी: ‘वह तेरे सेवकों से बेधड़क बोलेगा’'
  rationale: सीराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिक मानते हुए मुख्य पाठ उसी पर आधारित है; पर्याप्त भिन्न यूनानी पाठ को दबाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल और सूत्रात्मक रूप अपनाया गया है। मूल में एकवचन अनौपचारिक द्वितीय पुरुष के अनुरूप ‘तेरी/तेरे/तुझसे’ रखा गया है।
