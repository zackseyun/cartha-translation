translation:
  language: hi
  text: बेटे, सुनो और मेरी राय स्वीकार करो; मेरी सलाह को ठुकराओ मत।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इब्रानी पंक्ति इस पद से मेल नहीं खाती और सम्भवतः किसी अन्य स्थान का पाठ है; इसलिए अनुवाद यूनानी समानांतर पाठ के आधार पर किया गया है।
    reason: textual_variant
  - marker: b
    text: ‘बेटे’ के स्थान पर ‘बच्चे’ भी सम्भव है; यूनानी शब्द का अर्थ अधिक व्यापक है, पर यहाँ गुरु-शिष्य सम्बोधन की परम्परागत शैली है।
    reason: lexical_alternative
  - marker: c
    text: ‘मेरी राय’ के स्थान पर ‘मेरे मत’ या ‘मेरे निर्णय’ भी सम्भव है; यूनानी शब्द में सोच-विचार से बनी राय या विवेक का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσον
  choice: सुनो
  rationale: यूनानी आज्ञार्थक क्रिया का सीधा, स्वाभाविक और प्रसंगानुकूल हिन्दी रूप।
- source_word: τέκνον
  choice: मेरे बेटे
  rationale: शब्द सामान्यतः ‘सन्तान/बच्चे’ भी हो सकता है, पर यहाँ ज्ञान-साहित्य में गुरु द्वारा पुरुष शिष्य को सम्बोधित करने की शैली को दर्शाता है।
- source_word: δέξαι
  choice: स्वीकार करो
  rationale: यह केवल सुन लेने के बजाय शिक्षा को इच्छापूर्वक ग्रहण करने का भाव स्पष्ट करता है।
- source_word: γνώμην
  choice: समझ-बूझ
  rationale: γνώμη के विचार, विवेकपूर्ण मत और निर्णय जैसे अर्थों को इस उपदेशात्मक प्रसंग में सहज हिन्दी में व्यक्त करता है, बिना इसे न्यायिक ‘निर्णय’ तक सीमित किए।
- source_word: ἀπαναίνου
  choice: ठुकराओ
  rationale: नकारात्मक आज्ञा में जानबूझकर अस्वीकार करने की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συμβουλίαν
  choice: सलाह
  rationale: आधुनिक पाठक के लिए सहज रहते हुए बुद्धिमत्तापूर्ण मार्गदर्शन का अर्थ देता है।
theological_decisions:
- issue: असंगत इब्रानी पंक्ति और सुसंगत यूनानी समानांतर पाठ में प्राथमिक पाठ का चयन
  choice: इस पद का अनुवाद यूनानी समानांतर पाठ से किया गया है और इब्रानी साक्ष्य की असंगति पादटिप्पणी में बताई गई है।
  alternative: दिए गए इब्रानी पाठ का अनुवाद कुम्हार के पात्र और भट्ठी से सम्बद्ध कथन के रूप में करना।
  rationale: दिया गया इब्रानी वाक्य सिराख 6:23 के यूनानी पाठ और निकटवर्ती उपदेशात्मक प्रसंग से मेल नहीं खाता तथा सम्भवतः किसी अन्य पद का पाठ है। यूनानी पाठ इस स्थान पर पूर्ण और प्रसंगानुकूल है; इसलिए अनिश्चितता छिपाए बिना उसी को आधार बनाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘हे मेरे बेटे’ ज्ञान-साहित्य की शिक्षापरक सम्बोधन-शैली को बनाए रखता है; ‘समझ-बूझ’ और ‘सलाह’ सामान्य पाठक के लिए स्पष्ट हैं।
