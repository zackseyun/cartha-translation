base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/034.yaml
  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
translation:
  language: hi
  text: हर वार्ता सुनने के लिए उत्सुक रहो, और समझ-बूझ की कोई कहावत तुमसे छूट न जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “बुज़ुर्गों की सभा में खड़े रहो; और यदि कोई बुद्धिमान हो, तो उससे जुड़े रहो।” उपलब्ध इब्रानी साक्ष्य यहाँ इससे बहुत भिन्न है। चूँकि इस पद का इब्रानी पाठ सुरक्षित है, मुख्य पाठ उसी का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: हर वार्ता
  rationale: כָּל को वितरणात्मक अर्थ में ‘हर’ और שִׂיחָה को व्यापक, गरिमापूर्ण अर्थ में ‘वार्ता’ किया गया है; इससे बातचीत, कथन और शिक्षाप्रद चर्चा—इन सबकी गुंजाइश बनी रहती है।
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: सुनने के लिए उत्सुक रहो
  rationale: חֲפוֹץ की आज्ञार्थक शक्ति और इच्छापूर्वक तत्परता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘सुनने’ में प्रसंगानुसार ध्यान से सुनना निहित है।
- source_word: וּמְשַׁל בִּינָה
  choice: और समझ-बूझ की कोई कहावत
  rationale: מָשָׁל के ज्ञान-साहित्यिक अर्थ के लिए ‘कहावत’ स्पष्ट और सहज है। בִּינָה की संबंधवाचक रचना को ‘समझ-बूझ की’ द्वारा बनाए रखा गया है, बिना यह तय किए कि समझ वक्ता की है या कथन की विषयवस्तु की। हिन्दी वाक्य में ‘कोई’ निषेध के साथ स्वाभाविक वितरणात्मक अर्थ देता है।
- source_word: אַל יֵצְאֶךָּ
  choice: तुमसे छूट न जाए
  rationale: शाब्दिक रूप से यह ‘तुमसे निकल न जाए’ है। ‘तुमसे छूट न जाए’ आधुनिक हिन्दी में इस चेतावनी को स्वाभाविक ढंग से व्यक्त करता है कि समझ की बात को अनसुना या हाथ से न जाने दिया जाए।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध, उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य का अनुवाद किया गया है।
  alternative: 'यूनानी के आधार पर: ‘बुज़ुर्गों की सभा में खड़े रहो; और जो बुद्धिमान हो, उससे जुड़े रहो।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध है, इसलिए मूल-भाषा की प्राथमिकता के अनुसार वही मुख्य पाठ का आधार है। यूनानी पाठ ज्ञानियों से सीखने की समान व्यापक शिक्षा देता है, पर उसकी विशिष्ट शब्दावली इब्रानी में नहीं है; अतः उसे मुख्य पाठ में मिलाया नहीं गया, बल्कि पाठांतर के रूप में टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘वार्ता’ व्यापक अर्थ बनाए रखता है और ‘तुमसे छूट न जाए’ इब्रानी मुहावरे को बिना अनावश्यक शाब्दिक कठोरता के स्वाभाविक हिन्दी में व्यक्त करता है।
