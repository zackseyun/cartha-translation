translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीति-वचनात्मक स्वर। पहले पद में अत्यधिक अस्वाभाविक ‘मधुर तालु’ के बजाय उसके वाणी-संबंधी रूपक का स्वाभाविक अर्थ दिया गया है; दूसरे पद में ‘होंठ’ का मूल देहात्मक बिंब सुरक्षित रखा गया है।
