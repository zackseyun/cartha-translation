  yaml_path: translation/deuterocanon/sirach/006/005.yaml
  text: A sweet palate multiplies friends[b][a], and gracious lips ask after peace.
translation:
  language: hi
  text: मधुर वाणी मित्र बढ़ाती है[a], और कृपापूर्ण होंठ कुशल-क्षेम पूछते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप ‘प्रेम करनेवाले को बढ़ाती है’ कठिन है; यूनानी समानांतर में ‘उसके मित्रों को बढ़ाती है’ है, जिसका स्पष्ट अर्थ यहाँ अपनाया गया है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक रूप से: ‘अनुग्रह के होंठ शांति/भलाई पूछते हैं’; इसका आशय स्नेहपूर्वक अभिवादन करने या किसी का कुशल-क्षेम पूछने से हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: मधुर वाणी
  rationale: शाब्दिक अर्थ ‘मधुर तालु’ है, पर यहाँ तालु वाणी का प्रतीक है। ‘मधुर वाणी’ आधुनिक हिन्दी में स्वाभाविक है और עָרֵב की मिठास/मनभावनता बनाए रखती है; यूनानी में भी ‘मधुर कंठ’ है।
- source_word: יַרְבֶּה אוֹהֵב
  choice: मित्र बढ़ाती है
  rationale: इब्रानी रूप शाब्दिक रूप से ‘प्रेम करनेवाले को बढ़ाता है’ जैसा कठिन है। यूनानी समानांतर ‘उसके मित्रों को बढ़ाएगा’ पढ़ता है और प्रसंग में यही स्पष्ट अर्थ बनता है।
- source_word: שִׂפְתֵי חֵן
  choice: कृपापूर्ण होंठ
  rationale: शाब्दिक ‘कृपा/अनुग्रह के होंठ’। यह चयन देहात्मक चित्र और विनम्र, मनभावन बोलचाल—दोनों को बनाए रखता है।
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: कुशल-क्षेम पूछते हैं
  rationale: यह किसी की शांति या भलाई पूछने का इब्रानी मुहावरा है। हिन्दी का ‘कुशल-क्षेम पूछना’ सामाजिक अभिवादन और भलाई की पूछताछ, दोनों अर्थ स्वाभाविक रूप से व्यक्त करता है।
