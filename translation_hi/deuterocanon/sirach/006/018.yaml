review_pass:
  verdict: revise
  source_fidelity: 'Draft is substantively faithful to the Hebrew: it retains the filial male address, the command to receive instruction from youth, and the promise of attaining wisdom by the time of gray hair. The added possessive in “मेरे पुत्र” correctly represents בְּנִי (“my son”).'
  naturalness: “पके बालों तक” is understandable but less idiomatic and less precise in contemporary standard Hindi than an explicit expression for hair becoming gray/white. “तेरे बाल सफेद होने तक” preserves the Hebrew image naturally.
  terminology: “शिक्षा ग्रहण कर” suitably conveys קַח לֶקַח, and “बुद्धि” is an appropriate established rendering of חָכְמָה in this wisdom context. The Greek alternative (“choose instruction”) should be retained in a concise footnote, as in the English audit trail.
  issues:
  - severity: low
    issue: The phrase “पके बालों तक” is stylistically awkward.
    rationale: It intends to preserve שֵׂיבָה (“gray hair”), but “तेरे बाल सफेद होने तक” is more natural modern Hindi while retaining the concrete image rather than flattening it to “old age.”
  - severity: low
    issue: The Greek alternative reading is not represented in a footnote.
    rationale: The primary Hebrew supports “receive instruction,” but the supplied audit trail identifies Greek “choose instruction.” A brief note transparently records this textual variation without displacing the Hebrew reading.
  revised_text: हे मेरे पुत्र, अपनी युवावस्था से शिक्षा ग्रहण कर; और तेरे बाल सफेद होने तक तू बुद्धि प्राप्त करेगा।
