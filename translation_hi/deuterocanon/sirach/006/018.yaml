translation:
  language: hi
  text: हे मेरे पुत्र, अपनी युवावस्था से शिक्षा ग्रहण कर; और तेरे बाल सफेद होने तक तू बुद्धि प्राप्त करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: इब्रानी में पुरुषवाचक पुत्र को संबोधित करने वाला पितृवत् शिक्षोपदेश है; इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: מִנְּעוּרֶיךָ
  choice: अपनी युवावस्था से ही
  rationale: यह आरंभिक जीवन अथवा युवावस्था को दर्शाता है; ‘से ही’ आरंभ-बिंदु पर स्वाभाविक हिंदी बल देता है।
- source_word: קַח לֶקַח
  choice: शिक्षा ग्रहण कर
  rationale: קַח का मूल अर्थ ‘ले’ है और לֶקַח शिक्षण/उपदेश है; संयुक्त रूप में ‘शिक्षा ग्रहण कर’ आधुनिक हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: וְעַד שֵׂיבָה
  choice: और पके बालों तक
  rationale: इब्रानी ‘सफेद/पके बाल’ की ठोस छवि द्वारा वृद्धावस्था व्यक्त करता है; उसे केवल ‘बुढ़ापे’ में समतल नहीं किया गया।
- source_word: תַּשִּׂיג
  choice: तू ... प्राप्त करेगा
  rationale: क्रिया का अर्थ पहुँच पाना, पा लेना या प्राप्त करना है; यहाँ शिक्षा से बुद्धि की उपलब्धि अभिप्रेत है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: ज्ञान-साहित्य के इस प्रमुख शब्द के लिए ‘बुद्धि’ प्रतिष्ठित और सहज हिंदी विकल्प है।
