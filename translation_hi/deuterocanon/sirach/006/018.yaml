translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। एकवचन निकट संबोधन के कारण ‘तू’ रखा गया है; यह यहाँ अपमानसूचक नहीं, पितृवत् शिक्षोपदेशी प्रयोग है। ग्रीक में ‘शिक्षा चुन’ का पाठ है, पर प्राथमिक इब्रानी साक्ष्य स्पष्ट रूप से ‘शिक्षा ले/ग्रहण कर’ पढ़ता है; इसलिए मुख्य पाठ इब्रानी पर आधारित है और अनावश्यक पाठांतर-टिप्पणी नहीं जोड़ी गई।
