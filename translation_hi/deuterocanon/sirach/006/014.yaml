  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
translation:
  language: hi
  text: विश्वासयोग्य मित्र एक मज़बूत शरणस्थल है[a], और जो उसे पा लेता है, वह खज़ाना पा लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध इब्रानी पाठ कठिन है और यूनानी साक्ष्य से उल्लेखनीय रूप से भिन्न है। प्राप्त इब्रानी का अधिक शाब्दिक अर्थ लगभग यह है: “विश्वासयोग्यता से प्रेम करने वाला [सामर्थ्य का प्रेमी है/सामर्थ्य से प्रेम करता है], और जो उसे पाता है, वह धन पाता है।” मुख्य पाठ यूनानी समानांतर के अधिक स्पष्ट अर्थ का अनुसरण करता है: “विश्वासयोग्य मित्र एक मज़बूत शरणस्थल है।”'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה
  choice: विश्वासयोग्य मित्र
  rationale: प्राप्त इब्रानी पाठ कठिन है और शाब्दिक रूप से ‘विश्वासयोग्यता से प्रेम करने वाला’ जैसा अर्थ दे सकता है; यूनानी समानांतर φίλος πιστός स्पष्ट रूप से ‘विश्वासयोग्य मित्र’ का समर्थन करता है और दूसरे खंड के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: תְּקוֹף / σκέπη κραταιά
  choice: दृढ़ शरण
  rationale: इब्रानी रूप संदर्भ में कठिन है, जबकि यूनानी में शक्तिशाली सुरक्षात्मक आश्रय का स्पष्ट बिंब है। ‘दृढ़ शरण’ उस संरक्षण और सामर्थ्य दोनों को संक्षेप में व्यक्त करता है।
- source_word: וּמוֹצְאוֹ
  choice: जो उसे पा लेता है
  rationale: एकवचन प्रत्यय पूर्वोक्त मित्र की ओर संकेत करता है। हिन्दी में ‘उसे’ इस व्यक्तिगत संदर्भ को सहजता से बनाए रखता है।
- source_word: הוֹן / θησαυρόν
  choice: खज़ाना
  rationale: इब्रानी הוֹן का अर्थ धन-संपत्ति हो सकता है, जबकि यूनानी θησαυρόν ‘खज़ाना’ है। यहाँ मूल्यवान खोज के नीतिवचनात्मक रूपक के लिए ‘खज़ाना’ अधिक स्वाभाविक है।
theological_decisions:
- issue: भिन्न इब्रानी और यूनानी साक्ष्यों में से मुख्य पाठ का आधार
  choice: 'पहले खंड में यूनानी समानांतर से समर्थित अर्थ: ‘विश्वासयोग्य मित्र एक दृढ़ शरण है।’'
  alternative: 'प्राप्त इब्रानी का अधिक शाब्दिक रूप: ‘विश्वासयोग्यता से प्रेम करने वाला सामर्थ्य से प्रेम करता है,’ अथवा ‘विश्वासयोग्यता का प्रेमी सामर्थ्य है।’'
  rationale: प्राप्त इब्रानी पंक्ति वाक्यरचना और अर्थ की दृष्टि से कठिन है। यूनानी पाठ सुसंगत नीतिवचन देता है और दूसरे खंड में मित्र को मूल्यवान प्राप्ति कहे जाने से स्पष्ट मेल खाता है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण नीतिवचनात्मक शैली। ‘दृढ़ शरण’ सुरक्षात्मक रूपक को बनाए रखता है; ‘खज़ाना’ सामान्य पाठक के लिए स्वाभाविक और प्रभावी है।
