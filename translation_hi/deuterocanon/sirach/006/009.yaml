  yaml_path: translation/deuterocanon/sirach/006/009.yaml
  text: There is a friend who turns into an enemy[a], and he will expose the quarrel that brings your disgrace.
translation:
  language: hi
  text: ऐसा मित्र होता है जो शत्रु बन जाता है, और वह उस झगड़े को उजागर कर देगा जो तुम्हारी बदनामी का कारण है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और वह तुम्हारी बदनामी के झगड़े को उजागर कर देगा।” हिब्रू वाक्यांश संक्षिप्त है; इसका अर्थ ऐसा झगड़ा भी हो सकता है जो बदनामी का कारण बनता है, या ऐसा झगड़ा जिसमें तुम्हारा अपमान निहित है।'
    reason: हिब्रू संबंधवाचक रचना की वास्तविक अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: ऐसा मित्र भी होता है
  rationale: אוֹהֵב का मूल अर्थ ‘प्रेम करने वाला’ हो सकता है, पर ज्ञान-साहित्य के प्रसंग और यूनानी φίλος के आधार पर यहाँ ‘मित्र’ स्वाभाविक है। יֵשׁ को वर्तमान अस्तित्वसूचक अभिव्यक्ति से व्यक्त किया गया है।
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: जो शत्रु बन जाता है
  rationale: נהפך संबंध के उलट जाने को और שׂוֹנֵא विरोधी या बैरी को सूचित करता है। ‘शत्रु बन जाता है’ आधुनिक हिन्दी में इस परिवर्तन को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: רִיב
  choice: झगड़ा
  rationale: רִיב का अर्थ विवाद, कलह या कभी कानूनी वाद भी हो सकता है। यूनानी μάχη और मित्रता के प्रसंग में ‘झगड़ा’ अनावश्यक कानूनी अर्थ जोड़े बिना पारस्परिक संघर्ष व्यक्त करता है।
- source_word: חֶרְפָּתְךָ
  choice: तुम्हारी बदनामी का कारण
  rationale: חֶרְפָּה निन्दा, अपमान या बदनामी को दर्शाता है। संक्षिप्त हिब्रू संबंध को मुख्य पाठ में संभावित परिणामसूचक अर्थ से खोला गया है, जबकि पाद-टिप्पणी अधिक शाब्दिक और अस्पष्ट रचना को सुरक्षित रखती है।
- source_word: יַחְשֹׂף
  choice: उजागर कर देगा
  rationale: חשׂף का अर्थ ढका हुआ खोलना या प्रकट करना है; यूनानी ἀποκαλύψει भी इसकी पुष्टि करता है। ‘उजागर कर देगा’ निजी विवाद को दूसरों के सामने लाने की शत्रुतापूर्ण क्रिया के अनुकूल है।
