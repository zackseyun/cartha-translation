base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/012.yaml
  text: Do not despise hearing from those who have returned[b][a], who have heard from their fathers.
translation:
  language: hi
  text: लौटने वालों[b] की बातें सुनने को तुच्छ न समझो—उन्होंने वे बातें अपने पुरखों से सुनी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-परम्परा में है: “अपने से अधिक शक्तिशाली मनुष्य को उधार न दो; और यदि उधार दो, तो उसे खोया हुआ मानो।” यह इस पद की एक भिन्न पाठ-परम्परा जान पड़ती है।'
    reason: textual_variant
  - marker: b
    text: या “मन फिराने वालों” अथवा “लौट आए लोगों”; इब्रानी शब्द लौटने वाले लोगों को सूचित कर सकता है, पर यहाँ उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: तुच्छ न समझो
  rationale: यह निषेध और מָאַס के तिरस्कारपूर्ण भाव, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּשְׁמִיעַת
  choice: की बातें सुनने को
  rationale: शाब्दिक अर्थ ‘सुनने’ का है; सम्बन्धित समूह की ओर संकेत करने के लिए हिन्दी में ‘की बातें सुनने’ अधिक स्वाभाविक है।
- source_word: שָׁבִים
  choice: लौटने वालों
  rationale: मूल क्रिया का व्यापक अर्थ ‘लौटना’ है। प्रसंग में यह लौट आए लोगों या मन फिराने वालों को सूचित कर सकता है; मुख्य पाठ व्यापक अर्थ बनाए रखता है।
- source_word: שָׁמְעוּ מֵאֲבֹתָם
  choice: उन्होंने वे बातें अपने पुरखों से सुनी हैं
  rationale: यह पूर्वजों से सुनकर मिली परम्परा का भाव स्पष्ट करता है। ‘पुरखों’ आधुनिक हिन्दी में स्वाभाविक है और אֲבֹתָם का सामूहिक पैतृक अर्थ रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परम्पराओं में पूर्ण भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी वचन का अनुवाद
  alternative: 'यूनानी परम्परा: “अपने से अधिक शक्तिशाली मनुष्य को उधार न दो; और यदि उधार दो, तो उसे खोया हुआ मानो।”'
  rationale: इस पद का इब्रानी पाठ सुरक्षित और विश्वसनीय है। यूनानी में कोई छोटा पाठांतर नहीं, बल्कि अलग सूक्ति है; इसलिए उसे मिलाए बिना पादटिप्पणी में रखा गया है।
- issue: שָׁבִים का प्रसंगगत अर्थ
  choice: लौटने वालों
  alternative: मन फिराने वालों / लौट आए लोगों
  rationale: इब्रानी शब्द के मूल ‘लौटने’ के भाव को सुरक्षित रखा गया है और अनिश्चित धार्मिक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बातें’ इब्रानी में निहित सुनी हुई सामग्री को हिन्दी में स्वाभाविक ढंग से प्रकट करता है; ‘पुरखों’ से पीढ़ियों द्वारा मिली शिक्षा का भाव स्पष्ट होता है।
