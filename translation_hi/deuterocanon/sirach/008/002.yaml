  text: अपने से अधिक कठोर व्यक्ति से झगड़ा मत कर, कहीं ऐसा न हो कि तू उसके हाथ में पड़ जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשֶׁה מִמְּךָ
  choice: अपने से अधिक कठोर व्यक्ति
  rationale: קָשֶׁה का मूल अर्थ ‘कठोर/सख़्त’ है। यहाँ यह किसी शक्तिशाली, निर्दयी या कठिन प्रतिद्वंद्वी की ओर संकेत कर सकता है; ‘कठोर’ मूल की व्यापकता और वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: תָּרִיב
  choice: झगड़ा मत कर
  rationale: ריב विवाद, कलह या मुक़ाबला करने को व्यक्त करता है; सामान्य नीति-वचन की शैली में ‘झगड़ा मत कर’ स्वाभाविक और स्पष्ट है।
- source_word: תִפּוֹל בְּיָדוֹ
  choice: तू उसके हाथ में पड़ जाए
  rationale: हिब्रू मुहावरे की छवि को सुरक्षित रखता है और किसी के वश अथवा अधिकार में आ जाने का अर्थ सहज रूप से देता है।
