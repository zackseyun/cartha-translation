base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/014.yaml
  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
translation:
  language: hi
  text: किसी दुष्ट की विरासत में उन्नति मत कर[a], कहीं ऐसा न हो कि तुम उसकी आग की चिंगारी से जल जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य (स्वीट/LXX) में यहाँ एक अलग उक्ति है: “किसी न्यायी के साथ मुकदमा न लड़ो, क्योंकि वे उसकी प्रतिष्ठा के अनुसार उसके लिए न्याय करेंगे।” इसके विपरीत, काहिरा गनीज़ा का इब्रानी पाठ किसी दुष्ट की विरासत में संलग्न होने के विरुद्ध चेतावनी देता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: सफल न हो
  rationale: צלח का सामान्य अर्थ सफल होना या उन्नति करना है। आज्ञार्थक निषेध को सीधे रखा गया है और मूल की कुछ असामान्य अभिव्यक्ति को सहज व्याख्या में बदलकर छिपाया नहीं गया।
- source_word: בְּנַחֲלַת
  choice: विरासत में
  rationale: נחלה विरासत, पैतृक संपत्ति या जायदाद को दर्शाता है। ‘विरासत’ मूल सामाजिक-आर्थिक बिंब को बनाए रखता है, और בְּ को ‘में’ कहने से उस क्षेत्र में संलग्नता का भाव बना रहता है।
- source_word: רָשָׁע
  choice: किसी दुष्ट की
  rationale: पुल्लिंग एकवचन संज्ञा को प्रतिनिधि व्यक्ति के रूप में अनिश्चित ‘किसी दुष्ट’ से व्यक्त किया गया है; इससे आधुनिक हिन्दी में वाक्य स्वाभाविक रहता है।
- source_word: פֶּן תְּבֹעַר
  choice: कहीं ऐसा न हो कि तुम ... जल जाओ
  rationale: פֶּן चेतावनीसूचक सम्भावना प्रकट करता है और בער यहाँ आग से जल जाने या भस्म होने का भाव देता है। हिन्दी की यह संरचना चेतावनी और परिणाम दोनों को स्पष्ट रखती है।
- source_word: בִּשְׁבִיב
  choice: चिनगारी से
  rationale: שביב का अर्थ चिनगारी, ज्वाला या अग्नि की चमक हो सकता है। एकवचन रूप के अनुरूप ‘चिनगारी’ चुना गया है और בְּ को साधनसूचक ‘से’ के रूप में व्यक्त किया गया है।
- source_word: אִשּׁוֹ
  choice: उसकी आग की
  rationale: पुल्लिंग एकवचन प्रत्यय पीछे आए ‘दुष्ट’ की ओर संकेत करता है। ‘उसकी आग’ विनाशकारी खतरे के रूपक को बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: उपलब्ध काहिरा गनीज़ा के इब्रानी पाठ को मुख्य मानकर अनुवाद किया गया है।
  alternative: 'यूनानी साक्ष्य में अलग उक्ति है: ‘किसी न्यायी के साथ मुकदमा न लड़ो, क्योंकि वे उसकी प्रतिष्ठा के अनुसार उसी के पक्ष में न्याय करेंगे।’'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ यहाँ समान कथन का केवल शब्दांतर नहीं, बल्कि मूलतः भिन्न उक्ति प्रस्तुत करता है; इसलिए दोनों को मिलाया नहीं गया और पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ज्ञान-साहित्य की संक्षिप्त और गरिमापूर्ण चेतावनी-शैली बनाए रखी गई है। ‘विरासत में सफल न हो’ हिन्दी में जानबूझकर कुछ असामान्य रखा गया है, क्योंकि इब्रानी संयोजन भी असामान्य है और सम्भवतः दुष्ट की संपत्ति या विरासत के माध्यम से उन्नति खोजने के विरुद्ध चेताता है।
