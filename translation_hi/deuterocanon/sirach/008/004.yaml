base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/004.yaml
  text: For many has gold ruined[b][a], and it leads astray the heart of nobles.
translation:
  language: hi
  text: क्योंकि सोने ने बहुतों को बरबाद कर दिया है, और वह उदार जनों[b] के हृदय को भटका देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक बहुत भिन्न वाक्य है: “अशिक्षित व्यक्ति का उपहास न करो, कहीं ऐसा न हो कि तुम्हारे पूर्वजों का अपमान हो।”'
    reason: alternative_reading
  - marker: b
    text: या “कुलीनों” अथवा “प्रधानों”; इब्रानी शब्द उदार व्यक्तियों, कुलीनों या प्रधानों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: बहुतों
  rationale: यह विशेषण यहाँ संज्ञा के रूप में बड़ी संख्या में लोगों को दर्शाता है; ‘बहुतों’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הִפְחִיז
  choice: बरबाद कर दिया है
  rationale: यह दुर्लभ और कठिन क्रिया उतावला, अस्थिर या विनाशकारी बना देने का भाव रखती है। समानांतर खंड में हृदय को भटकाने की बात होने से परिणामसूचक ‘बरबाद कर दिया है’ उपयुक्त है, यद्यपि मूल की अर्थ-सीमा पूरी तरह निश्चित नहीं है।
- source_word: זָהָב
  choice: सोना
  rationale: मूल शब्द का सीधा और सामान्य हिन्दी पर्याय।
- source_word: יַשְׂגֶּה
  choice: भटका देता है
  rationale: क्रिया किसी को भूल या गलत मार्ग पर ले जाने का कारण बनने को व्यक्त करती है; ‘भटका देता है’ नैतिक संदर्भ और कारक भाव दोनों बनाए रखता है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में हृदय विचार, इच्छा और निर्णय का केंद्र है; ‘हृदय’ मूल बिंब को सुरक्षित रखता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נְדִיבִים
  choice: उदार जनों
  rationale: शब्द का अर्थ कुलीन, प्रधान या उदार व्यक्ति हो सकता है। हिन्दी मुख्य पाठ में ‘उदार जनों’ वास्तविक शाब्दिक संभावना को सहज रूप में रखता है, जबकि अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और अत्यंत भिन्न यूनानी पाठ में चयन
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद किया गया है: सोना बहुतों को बरबाद करता और उदार अथवा कुलीन जनों के हृदय को भटकाता है।'
  alternative: 'यूनानी पाठ: ‘अशिक्षित व्यक्ति का उपहास न करो, कहीं ऐसा न हो कि तुम्हारे पूर्वजों का अपमान हो।’'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है। यूनानी में यहाँ मामूली शब्दांतर नहीं, बल्कि सर्वथा भिन्न वाक्य है; इसलिए इब्रानी मुख्य पाठ में और यूनानी पाठांतर पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक लहजा अपनाया गया है। वाक्य-संरचना इब्रानी के दो समानांतर खंडों को बनाए रखती है। दोनों पादटिप्पणी-चिह्न संबंधित स्थानों पर मुख्य पाठ में दिए गए हैं।
