  text: For from him you will gain understanding[a], at a time of need to answer a saying.
translation:
  language: hi
  text: क्योंकि उससे तुम्हें समझ मिलेगी,[a] जब किसी कथन का उत्तर देने की ज़रूरत पड़ेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक बहुत भिन्न पाठ मिलता है: “अपनी सामर्थ्य से बढ़कर ज़मानत मत दो; और यदि ज़मानत दो, तो ऐसा चिंता करो मानो तुम्हें ही उसे चुकाना हो।” इस पद का इब्रानी पाठ उपलब्ध होने के कारण मुख्य अनुवाद में काहिरा गनीज़ा का इब्रानी पाठ अपनाया गया है, पर यह पाठांतर महत्त्वपूर्ण है।'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: पूर्वसर्ग और पुल्लिंग एकवचन प्रत्यय का स्वाभाविक अर्थ ‘उससे’ है; यह आसपास के संदर्भ में उल्लिखित व्यक्ति की ओर संकेत करता है।
- source_word: תִּקַּח שֶׂכֶל
  choice: तुम्हें समझ मिलेगी
  rationale: शाब्दिक रूप ‘समझ लोगे’ है, पर यहाँ भाव किसी व्यक्ति से व्यावहारिक समझ प्राप्त करने का है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּעֵת צֹרֶךְ
  choice: ज़रूरत के समय
  rationale: यह पद आवश्यकता के अवसर या समय को व्यक्त करता है और हिन्दी में संक्षिप्त तथा सहज है।
- source_word: לְהַשִׁיב
  choice: उत्तर दे सको
  rationale: פתגם के साथ यह क्रिया प्रत्युत्तर देने का अर्थ रखती है; सामर्थ्यसूचक हिन्दी रचना उस समझ के प्रयोजन को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: פִּתְגָּם
  choice: किसी कथन
  rationale: शब्द का अर्थ उक्ति, सूक्ति या कथन हो सकता है। ‘कथन’ इसकी व्यापकता बनाए रखता है और ‘नीतिवचन’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक लहजा रखा गया है। ‘समझ’ व्यावहारिक विवेक का संकेत देती है, और ‘कथन’ मूल शब्द की अर्थगत व्यापकता बनाए रखता है।
