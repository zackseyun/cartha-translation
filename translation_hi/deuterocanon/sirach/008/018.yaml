  text: न्यायाधीश से विवाद न कर[a], क्योंकि वह अपनी इच्छा के अनुसार न्याय करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक भिन्न उक्ति है: “किसी अजनबी के सामने कोई गुप्त काम न कर, क्योंकि तू नहीं जानता कि उसका क्या परिणाम होगा।” मुख्य पाठ में काहिरा गनीज़ा का इब्रानी पाठ अपनाया गया है, क्योंकि इस पद का इब्रानी साक्ष्य उपलब्ध है; फिर भी दोनों पाठों का अंतर उल्लेखनीय है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: विवाद न कर
  rationale: שפט का सामान्य अर्थ ‘न्याय करना’ है, पर עִם שׁוֹפֵט के साथ यहाँ किसी न्यायी से न्यायिक या प्रतिकूल विवाद करने का भाव है। ‘विवाद न कर’ इस चेतावनी को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: עִם שׁוֹפֵט
  choice: न्यायी से
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, किंतु हिन्दी में ‘विवाद’ के साथ प्रतिकूल संबंध स्वाभाविक रूप से ‘से’ द्वारा व्यक्त होता है। ‘न्यायी’ व्यक्ति और कानूनी संदर्भ दोनों को स्पष्ट रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: כִּרְצוֹנוֹ
  choice: अपनी इच्छा के अनुसार
  rationale: רָצוֹן यहाँ उस न्यायी की निजी इच्छा या मर्जी को दर्शाता है। यह अनुवाद मूल की चेतावनी को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: יִשְׁפֹּט
  choice: न्याय करेगा
  rationale: मूल धातु שפט के सीधे न्यायिक अर्थ को रखा गया है और पहले खंड के कानूनी संदर्भ से संबंध स्पष्ट रहता है।
