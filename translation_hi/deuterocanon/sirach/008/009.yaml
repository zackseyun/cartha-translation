base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/009.yaml
  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: hi
  text: किसी मरते हुए व्यक्ति पर मत इतराना[b]; याद रख कि हम सब समेटे जा रहे हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से ‘समेटे जा रहे हैं’; यह मृत्यु के लिए प्रयुक्त पारंपरिक रूपक है। वैकल्पिक अर्थ: ‘हम सब मरेंगे।’'
    reason: lexical_alternative
  - marker: b
    text: सिराख 8:9 की यूनानी पाठ-परम्परा यहाँ बहुत भिन्न है और इसके बजाय बुज़ुर्गों की बातों से सीखने की शिक्षा देती है। इसलिए इस पद में काहिरा गनीज़ा के इब्रानी पाठ को मुख्य आधार बनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: मत इतराना
  rationale: हित्पएल रूप यहाँ अपने को ऊँचा समझने, डींग मारने या दूसरे की दशा पर विजयी भाव दिखाने का अर्थ दे सकता है। हिंदी में ‘मत इतराना’ मरते हुए व्यक्ति पर घमण्डपूर्ण उल्लास की मनाही को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל גֹּוֵעַ
  choice: किसी मरते हुए व्यक्ति पर
  rationale: עַל को ‘पर’ और גֹּוֵעַ के कृदन्तीय, जारी भाव को ‘मरते हुए व्यक्ति’ से रखा गया है; इसे ‘मरे हुए व्यक्ति’ नहीं किया गया।
- source_word: זְכֹר
  choice: याद रख
  rationale: आज्ञार्थक रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिंदी अनुवाद।
- source_word: כֻּלָּנוּ
  choice: हम सब
  rationale: इब्रानी की स्पष्ट समावेशी सर्वनाम-संरचना को बनाए रखता है।
- source_word: נֶאֱסָפִים
  choice: समेटे जा रहे हैं
  rationale: निफ़अल कृदन्त के कर्मवाच्य और जारी भाव के साथ मृत्यु के लिए प्रयुक्त ‘इकट्ठा किए जाने’ के रूपक को सुरक्षित रखा गया है। ‘समेटे’ हिंदी में इस गंभीर रूपक को ‘मरेंगे’ कहकर सपाट किए बिना सुबोध बनाता है।
theological_decisions:
- issue: נֶאֱסָפִים में मृत्यु का रूपक
  choice: हम सब समेटे जा रहे हैं
  alternative: हम सब मरेंगे
  rationale: मूल पाठ मृत्यु को सीधे नाम नहीं देता, बल्कि ‘समेटे जाने’ का पारंपरिक रूपक रखता है। अनुवाद उस रूपक और वर्तमान कृदन्तीय तनाव को बनाए रखता है; साथ ही ‘अपने पुरखों के पास’ जैसी अनुपस्थित धारणा नहीं जोड़ता।
- issue: תִּתְהַלֵּל का नैतिक बल
  choice: मत इतराना
  alternative: घमण्ड मत करना
  rationale: ‘इतराना’ दूसरे की मृत्यु पर आत्मोन्नत या विजयी भाव दिखाने की मनाही को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘घमण्ड करना’ यहाँ अपेक्षाकृत असहज और कम प्रसंग-स्पष्ट होता।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, ज्ञान-साहित्य के अनुकूल और गरिमापूर्ण लहजा। एकवचन आज्ञार्थक ‘मत इतराना’ और ‘याद रख’ मूल की सीधी व्यक्तिगत चेतावनी को बनाए रखते हैं। मृत्यु के रूपक को जानबूझकर स्पष्ट व्याख्या में नहीं बदला गया।
