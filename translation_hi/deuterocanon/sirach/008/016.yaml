base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/016.yaml
  text: Do not lend to a man stronger than you; and if you do lend[a], regard it as lost.
translation:
  language: hi
  text: अपने से अधिक शक्तिशाली पुरुष को उधार मत दो; और यदि तुम उधार दे भी दो, तो उसे खोया हुआ समझो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में यहाँ एक भिन्न चेतावनी है: “क्रोधी मनुष्य से झगड़ा मत करो और उसके साथ निर्जन प्रदेश से होकर मत जाओ ... जहाँ कोई सहायता न हो, वहाँ वह तुम्हें गिरा देगा।” इसके विपरीत, उपलब्ध हिब्रू पाठ अपने से अधिक शक्तिशाली व्यक्ति को उधार देने से सावधान करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: उधार मत दो
  rationale: निषेधात्मक आज्ञा और हिफ़ील क्रिया के ऋण देने वाले सामान्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: अपने से अधिक शक्तिशाली पुरुष
  rationale: אִישׁ के पुल्लिंग एकवचन को बनाए रखता है और חָזָק מִמְּךָ की तुलनात्मक शक्ति—शारीरिक ही नहीं, सामाजिक सामर्थ्य भी—को ‘अधिक शक्तिशाली’ से व्यक्त करता है।
- source_word: וְאִם הִלְוִיתָ
  choice: और यदि तुमने उधार दिया हो
  rationale: निषेध के बाद संभावित परिस्थिति को शर्त के रूप में रखता है और हिब्रू के पूर्ण क्रियारूप को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: כִּמְאַבֵּד
  choice: तो उसे खोया हुआ समझो
  rationale: हिब्रू पद संक्षिप्त और कुछ हद तक लुप्तार्थक है; ‘उसे’ से ऋण का निहित कर्म स्पष्ट होता है, जबकि כ की तुलनात्मक भावना और हानि का आशय सुरक्षित रहता है।
theological_decisions:
- issue: ज्ञान-सूक्ति में אִישׁ का लिंग-सूचक रूप
  choice: पुरुष
  alternative: व्यक्ति
  rationale: मूल हिब्रू में पुल्लिंग एकवचन אִישׁ है; संदर्भ इसे लिंग-निरपेक्ष करने की माँग नहीं करता।
- issue: हिब्रू और यूनानी पाठों का पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू की ऋण-संबंधी चेतावनी
  alternative: यूनानी की क्रोधी मनुष्य से झगड़ा और निर्जन प्रदेश में यात्रा न करने की चेतावनी
  rationale: उपलब्ध हिब्रू साक्ष्य उच्च विश्वसनीयता वाला प्राथमिक पाठ है। यूनानी में एक अलग सूक्ति है; दोनों को मिलाने से वास्तविक पाठांतर मिट जाएगा, इसलिए यूनानी पाठ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर। ‘शक्तिशाली’ सामाजिक या व्यावहारिक सामर्थ्य को भी समेटता है; वाक्य की संक्षिप्त चेतावनी और दूसरे पुरुष का सीधा संबोधन बनाए रखा गया है।
