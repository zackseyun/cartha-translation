  yaml_path: translation/deuterocanon/sirach/008/017.yaml
  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: hi
  text: अपने से अधिक सामर्थी व्यक्ति के लिए ज़मानत मत दो; और यदि तुमने ज़मानत दी है[a], तो अपने को भुगतान करने वाला समझो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू का शाब्दिक अर्थ ‘अपने से बड़े/अधिक व्यक्ति के लिए’ या ‘जो तुम्हारी सीमा से परे हो, उसके लिए’ भी हो सकता है; आशय ऐसे व्यक्ति से है जिसका दायित्व तुम्हारी क्षमता या हैसियत से बढ़कर हो। यूनानी समानांतर पाठ भिन्न है: ‘मूर्ख के साथ परामर्श मत करो, क्योंकि वह किसी बात को गुप्त नहीं रख सकेगा।’'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: ज़मानत मत लो
  rationale: हिब्रू ערב यहाँ किसी दूसरे के दायित्व के लिए ज़मानती बनने का कानूनी-आर्थिक अर्थ रखता है। आधुनिक हिन्दी में ‘ज़मानत लेना’ इस आशय को सहज ढंग से व्यक्त करता है।
- source_word: יָתֵר מִמְּךָ
  choice: अपने से अधिक सामर्थी व्यक्ति की
  rationale: יָתֵר श्रेष्ठता, अधिकता या किसी की सीमा से परे होने का भाव दे सकता है। ज़मानत के प्रसंग में ‘अधिक सामर्थी’ दायित्व और ज़मानती की क्षमता के बीच असंतुलन को व्यक्त करता है, जबकि मूल की कुछ अर्थगत व्यापकता पाद-टिप्पणी में सुरक्षित है।
- source_word: וְאִם עָרַבְתָּ
  choice: और यदि तुमने ज़मानत ली है
  rationale: पहले खंड के उसी हिब्रू क्रियामूल की पुनरावृत्ति को हिन्दी में भी एक ही पदावली द्वारा बनाए रखा गया है।
- source_word: כִּמְשַׁלֵּם
  choice: तो अपने को भुगतान के लिए उत्तरदायी समझो
  rationale: כְּ तुलना का भाव देता है और משלם भुगतान करने वाले को दर्शाता है। यह हिन्दी रूप उस व्यावहारिक आशय को स्पष्ट करता है कि ज़मानती को ऋण चुकाने की वास्तविक जिम्मेदारी मानकर चलना चाहिए।
