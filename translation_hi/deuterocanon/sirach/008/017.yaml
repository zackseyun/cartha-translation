  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘ज़मानत’ सामान्य हिन्दी में समझ में आने वाला कानूनी-आर्थिक शब्द है। हिब्रू और यूनानी पाठों के बड़े अंतर को मुख्य पाठ में मिलाने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
