base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/019.yaml
  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: hi
  text: किसी क्रूर मनुष्य के साथ मत जाओ,[a] कहीं ऐसा न हो कि तुम अपनी विपत्ति को और भारी कर लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “हर किसी के सामने अपना हृदय प्रकट न करो, और वह तुम्हें उपकार का बदला न दे।” यहाँ इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: किसी क्रूर मनुष्य के साथ
  rationale: אַכְזָרִי क्रूर अथवा निर्दयी व्यक्ति को दर्शाता है। यहाँ אִם का पाठ संभवतः ‘के साथ’ के अर्थ में समझा गया है; ‘मनुष्य’ एक प्रतिनिधि पुरुष व्यक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תֵּלֵךְ
  choice: मत चलो
  rationale: הלך का मूल अर्थ ‘चलना/जाना’ है। ‘के साथ मत चलो’ संगति या साथ जाने का भाव रखता है और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी देता है; आधुनिक हिन्दी में यह स्वाभाविक और चेतावनीपूर्ण प्रयोग है।
- source_word: תַּכְבִּיד
  choice: बोझ और बढ़ा लो
  rationale: כבד के हिफ़ील रूप में भारी करने या भार बढ़ाने का भाव है। यह चयन इब्रानी की भार-संबंधी छवि को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: אֶת רָעָתֶךָ
  choice: अपनी विपत्ति
  rationale: רעה संदर्भानुसार बुराई, हानि, संकट या विपत्ति हो सकता है। यहाँ क्रूर व्यक्ति के साथ जाने से स्वयं पर आने वाली मुसीबत अभिप्रेत है; ‘अपनी’ द्वितीय पुरुष प्रत्यय को व्यक्त करता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: “हर मनुष्य के सामने अपना हृदय प्रकट न करो, और उसे अपने प्रति उपकार का प्रतिफल न देने दो।”'
  rationale: इस पद का इब्रानी पाठ उच्च विश्वसनीयता के साथ उपलब्ध है, इसलिए उसे मुख्य आधार बनाया गया है। यूनानी परंपरा का पाठ विषयवस्तु में बहुत भिन्न है और संभवतः अलग मूलपाठ या पाठ-विकास को दर्शाता है; अतः पारदर्शिता के लिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और उपदेशात्मक है। ‘बोझ और बढ़ा लो’ इब्रानी की भारी करने वाली छवि को स्वाभाविक हिन्दी में बनाए रखता है।
