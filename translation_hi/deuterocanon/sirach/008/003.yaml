  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
translation:
  language: hi
  text: तेज़ ज़बान वाले व्यक्ति से झगड़ा न करो, और उसकी आग पर लकड़ियाँ न डालो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राप्त इब्रानी पाठ का लगभग यह अर्थ है: “किसी निर्धन अथवा सामर्थ्यहीन व्यक्ति के विरुद्ध षड्यंत्र न रचो, कहीं ऐसा न हो कि वह तुम्हारा मूल्य आँके और तुम नष्ट हो जाओ।” यूनानी समानांतर का अर्थ है: “तेज़ ज़बान वाले व्यक्ति से झगड़ा न करो, और उसकी आग पर लकड़ियाँ न डालो।” इब्रानी यहाँ कठिन है और यूनानी एक सुसंगत नीति-वचन देता है; इसलिए मुख्य पाठ में यूनानी अर्थ रखा गया है और इब्रानी पाठ का वैकल्पिक अर्थ यहाँ दिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ
  choice: झगड़ा न करो
  rationale: प्राप्त इब्रानी में חרשׁ सामान्यतः ‘चुप रहना’ या ‘योजना/षड्यंत्र रचना’ बताता है, पर इस पद का इब्रानी पाठ कठिन है। यूनानी समानांतर में μὴ διαμάχου स्पष्ट रूप से ‘झगड़ा न करो’ है और अगले अग्नि-रूपक के साथ एक सुसंगत नीति-वचन बनाता है।
- source_word: עַל אִישׁ לֹא הוֹן / ἀνθρώπου γλωσσώδους
  choice: तेज़ ज़बान वाले व्यक्ति से
  rationale: इब्रानी वाक्यांश का शाब्दिक अर्थ लगभग ‘निर्धन/सामर्थ्यहीन व्यक्ति के विरुद्ध’ है, पर संदर्भ में अस्पष्ट है। यूनानी γλωσσώδους वाचाल या कटु/तेज़ ज़बान वाले व्यक्ति को सूचित करता है; स्वाभाविक हिन्दी में ‘तेज़ ज़बान वाला’ विवाद भड़काने के आशय को बनाए रखता है।
- source_word: μὴ ἐπιστοίβαζης ἐπὶ τὸ πῦρ αὐτοῦ ξύλα
  choice: उसकी आग पर लकड़ियाँ न डालो
  rationale: यह यूनानी अग्नि-रूपक का सीधा और स्वाभाविक हिन्दी रूप है, जो झगड़े को और भड़काने की छवि को बिना व्याख्या जोड़े सुरक्षित रखता है।
