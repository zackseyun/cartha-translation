base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/011.yaml
  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: hi
  text: उसकी साधारण बातचीत को भी तुच्छ न समझो,[a] क्योंकि उससे तुम शासकों के सामने उपस्थित होने की सीख पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “उद्दंड मनुष्य के सामने से उठ खड़े मत हो, कहीं ऐसा न हो कि वह तुम्हारे मुँह के लिए घात की तरह बैठ जाए।” यहाँ यूनानी परंपरा उपलब्ध इब्रानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: साधारण बातचीत
  rationale: यह पदबंध रोज़मर्रा की या सामान्य बातचीत को दर्शाता है, न कि अनिवार्य रूप से अपवित्र या बुरी वाणी को।
- source_word: תִבְזֶה
  choice: तुच्छ न समझो
  rationale: क्रिया का अर्थ अवमानना करना या किसी को मूल्यहीन समझना है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: शासकों के सामने खड़े होने
  rationale: वाक्यांश उच्च पदाधिकारियों की उपस्थिति में स्वयं को प्रस्तुत करने और उचित आचरण करने का व्यावहारिक भाव रखता है।
- source_word: לֶקַח
  choice: शिक्षा
  rationale: यहाँ शब्द ग्रहण की गई सीख या व्यावहारिक शिक्षा को व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: इब्रानी का पुल्लिंग एकवचन सर्वनाम पूर्वसंदर्भित व्यक्ति की ओर संकेत करता है; हिन्दी में 'उससे' इसे संक्षिप्त और स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: इब्रानी पाठ और उससे बहुत भिन्न यूनानी समानांतर पाठ में चयन
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है और यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी: “उद्दंड मनुष्य के सामने से उठकर मत जाओ, कहीं ऐसा न हो कि वह तुम्हारे मुँह के विरुद्ध घात लगाकर बैठ जाए।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी जाती है। इस पद में यूनानी परंपरा की विषयवस्तु बहुत भिन्न है, इसलिए दोनों को मिलाकर अंतर को मिटाने के बजाय वैकल्पिक पाठ को स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'साधारण बातचीत' रोज़मर्रा की वाणी का भाव देता है और नैतिक रूप से बुरी या अपवित्र बात का अनावश्यक संकेत नहीं करता।
