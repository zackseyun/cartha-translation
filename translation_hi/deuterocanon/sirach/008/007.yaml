base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/007.yaml
  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: hi
  text: अपराध से लौटने वाले मनुष्य को लज्जित न कर[a]; याद रख कि हम सब दोषी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “मरे हुए पर आनन्द न कर; याद रख कि हम सबका अन्त होता है।” इस पद का इब्रानी पाठ दोनों अर्धपदों में भिन्न है; इसलिए मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है और यूनानी पाठ को वैकल्पिक पाठ के रूप में यहाँ दिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: लज्जित न कर
  rationale: כלם के हिफ़ील रूप का अर्थ किसी को लज्जित या अपमानित करना है। ‘लज्जित न कर’ संक्षिप्त, स्वाभाविक और उसके पारस्परिक प्रभाव के निकट है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है। ‘मनुष्य’ स्रोत के रूप को बनाए रखते हुए आधुनिक हिन्दी में प्रतिनिधिक अर्थ भी सहज रूप से व्यक्त करता है।
- source_word: שָׁב
  choice: लौटने वाले
  rationale: שוב का कृदन्त लौटने या फिरने की गति व्यक्त करता है। यहाँ यह अपराध से विमुख होने का संकेत देता है, पर अनावश्यक रूप से तकनीकी धार्मिक शब्दावली नहीं जोड़ता।
- source_word: מִפֶּשֶׁע
  choice: अपराध से
  rationale: פשע में अपराध, उल्लंघन या विद्रोह का भाव हो सकता है। ‘अपराध’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक दोष का भाव बनाए रखता है।
- source_word: זְכֹר
  choice: याद रख
  rationale: यह एकवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: כֻּלָּנוּ
  choice: हम सब
  rationale: यह मूल के समावेशी बल को सहज हिन्दी में व्यक्त करता है।
- source_word: חַיָּבִים
  choice: दोषी हैं
  rationale: חייבים उत्तरदायी, दायी या दोषी होने का अर्थ दे सकता है। इस नैतिक संदर्भ में ‘दोषी हैं’ स्वाभाविक है, यद्यपि इब्रानी शब्द में दायित्व का व्यापक भाव भी बना रहता है।
theological_decisions:
- issue: इब्रानी और यूनानी समानांतर पाठ में अंतर
  choice: मुख्य पाठ में जीवित इब्रानी साक्ष्य—‘हम सब दोषी हैं’—का अनुसरण
  alternative: ‘मरे हुए पर आनन्द न कर; याद रख कि हम सबका अन्त होता है।’
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी पाठ दोनों अर्धपदों में भिन्न है और मृत्युशीलता पर बल देता है; इस महत्त्वपूर्ण वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मन-फिराव की भाषा
  choice: अपराध से लौटने वाले
  alternative: पाप से पश्चाताप करने वाले
  rationale: इब्रानी में लौटने/फिरने की सामान्य क्रिया है। चुना हुआ अनुवाद नैतिक दिशा-परिवर्तन को बनाए रखता है और बाद की तकनीकी धर्मवैज्ञानिक शब्दावली आरोपित नहीं करता।
- issue: חַיָּבִים का अर्थ-क्षेत्र
  choice: दोषी हैं
  alternative: उत्तरदायी हैं; दायी हैं
  rationale: ‘दोषी’ प्रसंग में स्पष्ट और स्वाभाविक है, पर शब्द दायित्व या देनदारी का अर्थ भी रख सकता है। यूनानी का ‘हम सब मरते हैं’ इस इब्रानी शब्द का सीधा अनुवाद नहीं, बल्कि एक भिन्न पाठ-परम्परा है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक रूप अपनाया गया है। एकवचन आज्ञार्थक ‘कर’ और ‘याद रख’ मूल की सीधी संबोधन-शैली को सुरक्षित रखते हैं।
