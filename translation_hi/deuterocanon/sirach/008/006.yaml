translation:
  language: hi
  text: किसी मूर्ख मनुष्य से घनिष्ठता न बढ़ाओ[a], कहीं ऐसा न हो कि वह कुलीनों का तिरस्कार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “किसी मनुष्य का उसके बुढ़ापे में अपमान न करो, क्योंकि हममें से भी कुछ बूढ़े हो रहे हैं।” इस पद में यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּרַגִּיל
  choice: घनिष्ठता न बढ़ाओ
  rationale: रגל के इस रूप में नियमित मेल-जोल या परिचय को आदत बनाने का भाव है। शाब्दिक ‘अभ्यस्त न हो’ की अपेक्षा ‘घनिष्ठता न बढ़ाओ’ आधुनिक हिन्दी में स्वाभाविक है और बार-बार के निकट संपर्क की चेतावनी को बनाए रखता है।
- source_word: אִישׁ אֱוִיל
  choice: किसी मूर्ख मनुष्य से
  rationale: एकवचन पुल्लिंग और ज्ञान-साहित्य की नैतिक श्रेणी को बनाए रखा गया है; ‘मूर्ख मनुष्य’ गरिमापूर्ण और स्पष्ट है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेध के बाद आशंकित परिणाम को व्यक्त करने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: יָבוּז
  choice: तिरस्कार करे
  rationale: בוז का मूल भाव हेय समझना या तिरस्कार करना है; हिन्दी में यह सीधा और सटीक है।
- source_word: לִנְדִיבִים
  choice: प्रतिष्ठित लोगों का
  rationale: נְדִיבִים का अर्थ कुलीन, प्रधान अथवा उदार लोग हो सकता है। यहाँ सामाजिक प्रतिष्ठा का संकेत सम्भावित है; ‘प्रतिष्ठित लोग’ आधुनिक पाठक के लिए स्पष्ट रहते हुए ‘कुलीनों’ की अनावश्यक वंशगत संकीर्णता से बचता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: “किसी मनुष्य के बुढ़ापे में उसका अपमान न करो, क्योंकि हममें से भी कुछ बूढ़े हो रहे हैं।”
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी पाठ का अर्थ पूरी तरह भिन्न है, अतः पाठक के लिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उपदेशात्मक रखी गई है। ‘घनिष्ठता न बढ़ाओ’ नियमित निकट संगति के भाव को सहज हिन्दी में व्यक्त करता है; ‘प्रतिष्ठित लोग’ נְדִיבִים के सामाजिक-मान संबंधी अर्थ को दर्शाता है, जबकि उसकी ‘उदार लोग’ वाली सम्भावना को निर्णायक रूप से थोपता नहीं।
