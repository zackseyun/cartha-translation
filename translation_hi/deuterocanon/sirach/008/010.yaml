lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: मत छोड़
  rationale: नָטַשׁ का अर्थ छोड़ना या त्याग देना है। ‘मत छोड़’ आधुनिक हिन्दी में स्वाभाविक है और जानबूझकर विमुख न होने की आज्ञा को बनाए रखता है।
- source_word: שִׂיחַת
  choice: वार्ता
  rationale: שִׂיחָה बातचीत, कथन या विचारपूर्ण संवाद को सूचित कर सकता है। यहाँ ‘वार्ता’ बुद्धिमानों की शिक्षाप्रद बातचीत का व्यापक अर्थ देता है और इसे केवल औपचारिक उपदेश तक सीमित नहीं करता।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: इब्रानी बहुवचन बुद्धिमान व्यक्तियों के एक वर्ग को सूचित करता है। ‘बुद्धिमानों’ हिन्दी में स्वाभाविक और लिंग की दृष्टि से अनावश्यक रूप से सीमित न करने वाला रूप है।
- source_word: וּבְחִידֹתֵיהֶם
  choice: उनकी पहेलियों में
  rationale: חִידָה पहेली, गूढ़ कथन या ऐसी उक्ति है जिस पर विचार करना पड़े। ‘पहेलियों’ मूल रूपक को सीधे बनाए रखता है।
- source_word: הִתְרַפֵּשׂ
  choice: मन लगाए रख
  rationale: यह असामान्य आत्मवाचक क्रियारूप सक्रिय और निरंतर संलग्नता का भाव देता है। ‘मन लगाए रख’ सहज हिन्दी में उसी आग्रह को व्यक्त करता है, जबकि इसकी शाब्दिक छवि को अनिश्चित होने के कारण मुख्य पाठ पर नहीं थोपा गया।
