translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। सूक्ति की सीधी व्यक्तिगत चेतावनी बनाए रखने के लिए एकवचन ‘तू’ का प्रयोग किया गया है। मुख्य पाठ में इब्रानी की कठिन अभिव्यक्ति को यूनानी समानांतर के सहारे स्वाभाविक हिन्दी में प्रस्तुत किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
