translation:
  language: hi
  text: किसी शक्तिशाली व्यक्ति से झगड़ा मत करो, कहीं ऐसा न हो कि तुम उसके हाथों में पड़ जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अधिक शाब्दिक अर्थ है, “तुम्हें क्यों उसके हाथ में रखा जाए?” यूनानी समानांतर इस सहज अर्थ का समर्थन करता है: “कहीं तुम उसके हाथों में न पड़ जाओ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: झगड़ा न कर
  rationale: रיב का अर्थ झगड़ा, विवाद या मुकदमेबाज़ी करना हो सकता है। यहाँ निषेधात्मक चेतावनी के लिए ‘झगड़ा न कर’ सहज और पर्याप्त व्यापक है; यूनानी διαμάχου भी इसका समर्थन करता है।
- source_word: עִם אִישׁ גָּדוֹל
  choice: किसी शक्तिशाली व्यक्ति से
  rationale: גדול का शाब्दिक अर्थ ‘बड़ा/महान’ है, पर इस ज्ञान-साहित्यिक संदर्भ में सामाजिक या राजनीतिक सामर्थ्य अभिप्रेत है। यूनानी δυνάστου (‘शक्तिशाली/शासक’) इस अर्थ की पुष्टि करता है। ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से पुरुष-विशेष पर बल नहीं देता।
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: कहीं ऐसा न हो कि तू उसके हाथों में पड़ जाए
  rationale: 'प्राप्त इब्रानी पाठ शाब्दिक रूप से कुछ कठिन है: ‘क्यों तू उसके हाथ में रखा जाए?’ यूनानी समानांतर स्पष्ट चेतावनी देता है, ‘कहीं तू उसके हाथों में न पड़ जाए।’ हिन्दी मुहावरे ‘हाथों में पड़ना’ से आशय उसके वश या अधिकार में आ जाना स्वाभाविक रूप से व्यक्त होता है।'
