  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
translation:
  language: hi
  text: ठट्ठा उड़ानेवाले के सामने से मत हटो[a], कहीं ऐसा न हो कि वह उसे तुम्हारे सामने घात लगानेवाले के समान बिठा दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति का हिब्रू कठिन है। उसका शाब्दिक अर्थ है, “कहीं ऐसा न हो कि वह उसे तुम्हारे सामने घात लगानेवाले के समान बिठा दे।” यूनानी समानांतर में व्यापक भाव एक खतरनाक, मनमाना व्यक्ति है जो तुम्हारे विरुद्ध कार्य करता है।
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: मत हटो
  rationale: क्रिया में अपने स्थान से हटने या दूसरे को जगह देने का भाव है। ‘मत हटो’ शारीरिक रूपक को बचाते हुए सहज आधुनिक हिन्दी है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: यह ‘सामने से/के सम्मुख से’ का स्थान-संबंधी भाव व्यक्त करता है और हटने की क्रिया के साथ स्वाभाविक बैठता है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: ज्ञान-साहित्य में यह तिरस्कार और उपहास करनेवाले व्यक्ति को सूचित करता है; यह केवल हँसी-मज़ाक करनेवाला नहीं है।
- source_word: לְהוֹשִׁיבוֹ
  choice: वह उसे ... बिठा दे
  rationale: हिब्रू रूप का सीधा अर्थ ‘उसे बिठाना’ है। संदर्भ कठिन होने पर भी पुरुषवाचक कर्म-प्रत्यय को आत्मवाचक बनाकर कठिनाई मिटाई नहीं गई।
- source_word: כְּאוֹרֵב
  choice: घात लगानेवाले के समान
  rationale: यह छिपकर अवसर की प्रतीक्षा करनेवाले शत्रु की स्पष्ट और स्वाभाविक हिन्दी छवि देता है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे सामने
  rationale: हिब्रू का स्थान-संबंधी अर्थ सुरक्षित रखा गया है; विरोधी आशय ‘घात लगानेवाले’ की छवि से प्रकट होता है।
theological_decisions:
- issue: कठिन हिब्रू उपवाक्य और भिन्न यूनानी समानांतर
  choice: विद्यमान हिब्रू को रूढ़िवादी ढंग से अनूदित किया गया और उसकी कठिनता पाद-टिप्पणी में बताई गई।
  alternative: 'यूनानी के अनुसार भावानुवाद करना: ‘दुस्साहसी मनुष्य के साथ मार्ग पर मत चलो, कहीं वह तुम्हारे विरुद्ध भारी न पड़े।’'
  rationale: यहाँ हिब्रू साक्ष्य उपलब्ध और उच्च-विश्वसनीय है, इसलिए यूनानी व्यापक शत्रुतापूर्ण आशय की पुष्टि तो करता है, पर मुख्य पाठ को विस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘ठट्ठा करनेवाला’ ज्ञान-साहित्य के नैतिक आशय को व्यक्त करता है; दूसरे खंड की असामान्यता मूल हिब्रू की वास्तविक कठिनता के कारण जानबूझकर सुरक्षित है।
