base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/008.yaml
  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: hi
  text: किसी वृद्ध पुरुष को लज्जित न करो[a]; याद रखो कि तुम भी वृद्धों में गिने जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी परम्परा में इसके स्थान पर यह पाठ है: “बुद्धिमानों के उपदेश की उपेक्षा न करो, और उनके नीतिवचनों पर मन लगाओ; क्योंकि उनसे तुम शिक्षा पाओगे और महान लोगों की सेवा करना सीखोगे।” यहाँ इब्रानी साक्ष्य वृद्ध व्यक्ति का आदर करने के विषय में एक भिन्न उपदेश सुरक्षित रखता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: लज्जित न करो
  rationale: पिअल रूप का कारक अर्थ है किसी को लज्जा या अपमान का अनुभव कराना। ‘लज्जित न करो’ संक्षिप्त, स्वाभाविक और नैतिक निषेध की शक्ति को बनाए रखता है।
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: किसी बूढ़े पुरुष को
  rationale: אֱנוֹשׁ मनुष्य/पुरुष को और יָשִׁישׁ अधिक आयु को दर्शाता है। ‘बूढ़े पुरुष’ मूल के एकवचन पुल्लिंग को स्पष्ट रूप से सुरक्षित रखता है और सामान्य पाठक के लिए सहज है।
- source_word: זְכֹר
  choice: याद रखो
  rationale: आज्ञार्थक זכר का सीधा अर्थ ‘स्मरण रखना’ है। ‘याद रखो’ निषेध के पीछे दिए गए आत्म-संबंधी कारण को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: תִמָּנֶה
  choice: गिने जाओगे
  rationale: निफ़अल रूप का निष्क्रिय भाव ‘गिना जाना’ है। यह वृद्धों के वर्ग में सम्मिलित होने की मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: מִזְּקֵנִים
  choice: वृद्धों में
  rationale: מִן यहाँ समूह के बीच या उनमें से होने का भाव देता है। ‘वृद्धों में’ आयु-समूह और सामाजिक समुदाय, दोनों की सम्भावित छाया बनाए रखता है।
theological_decisions:
- issue: एकवचन पुल्लिंग व्यक्ति का अनुवाद
  choice: ‘किसी बूढ़े पुरुष’ के रूप में मूल के एकवचन पुल्लिंग को बनाए रखा गया।
  alternative: ‘किसी बुज़ुर्ग व्यक्ति’ या ‘किसी वृद्ध को’।
  rationale: इब्रानी में संज्ञा और विशेषण दोनों एकवचन पुल्लिंग हैं। अनुवाद इसे अनावश्यक रूप से लिंग-निरपेक्ष नहीं बनाता, यद्यपि उपदेश का नैतिक प्रयोग व्यापक है।
- issue: भिन्न यूनानी पाठ का स्थान
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया और यूनानी परम्परा को पादटिप्पणी में रखा गया।
  alternative: मुख्य पाठ को बुद्धिमानों की बातों और नीतिवचनों वाले यूनानी पाठ के अनुसार देना।
  rationale: इस पद का सुरक्षित इब्रानी पाठ स्पष्ट और उच्च-विश्वसनीयता वाला है। यूनानी पाठ substantially भिन्न परम्परा को प्रमाणित करता है, इसलिए उसे इब्रानी में मिलाने के बजाय अलग पाठांतर के रूप में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक स्वर रखा गया है। ‘लज्जित’ नैतिक अपमान का भाव देता है; ‘बूढ़े पुरुष’ मूल की ठोस एकवचन पुल्लिंग अभिव्यक्ति को बनाए रखता है, जबकि ‘वृद्धों में गिने जाओगे’ मूल के निष्क्रिय वाक्य-विन्यास और सामुदायिक अर्थ को सुरक्षित करता है।
