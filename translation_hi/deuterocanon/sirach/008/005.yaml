  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
translation:
  language: hi
  text: तीखी ज़बान वाले व्यक्ति से मत उलझो,[b] और आग में लकड़ी मत डालो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में है: “पाप से फिरनेवाले मनुष्य को धिक्कार मत दो; याद रखो कि हम सब ताड़ना के अधीन हैं।” यहाँ सुरक्षित इब्रानी पाठ इसके बजाय तीखी ज़बान वाले व्यक्ति से न उलझने और विवाद को न भड़काने की चेतावनी देता है।'
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “जीभ का व्यक्ति”; यह हानिकारक या विवादप्रिय वाणी से पहचाने जानेवाले व्यक्ति के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: मत उलझो
  rationale: निषेध के साथ आया यह क्रियापद विवाद या झगड़े में पड़ने का भाव देता है। ‘मत उलझो’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक टकराव से बचने की चेतावनी व्यक्त करता है।
- source_word: עִם
  choice: से
  rationale: विवाद के प्रसंग में हिन्दी में ‘से उलझना’ स्वाभाविक प्रयोग है।
- source_word: אִישׁ לָשׁוֹן
  choice: बातों से झगड़ा खड़ा करनेवाला व्यक्ति
  rationale: शाब्दिक अर्थ ‘जीभ का व्यक्ति’ है, पर यह हानिकारक या विवादप्रिय वाणी से पहचाने जानेवाले व्यक्ति के लिए इब्रानी मुहावरा है। अर्थ-स्पष्ट अनुवाद हिन्दी पाठक के लिए स्वाभाविक है और अगले आग वाले रूपक से मेल खाता है।
- source_word: וְאַל תִּתֵּן
  choice: और ... मत डालो
  rationale: दूसरा समानांतर निषेध है; इस संदर्भ में सामान्य क्रिया ‘देना/रखना’ आग में ईंधन डालने का अर्थ देती है।
- source_word: עַל אֵשׁ עֵץ
  choice: आग में लकड़ी
  rationale: 'मूल का ठोस, नीतिवचनात्मक चित्र सुरक्षित रहता है: लकड़ी डालने से आग और भड़कती है। हिन्दी में ‘आग में लकड़ी डालना’ स्वाभाविक है।'
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी पाठ: ‘पाप से फिरनेवाले मनुष्य को धिक्कार मत दो; याद रखो कि हम सब दंड के योग्य हैं।’'
  rationale: 'जहाँ बेन सीरा का इब्रानी पाठ सुरक्षित है, वहाँ उसे प्राथमिकता दी गई है। यहाँ इब्रानी पाठ अपने दोनों खंडों में सुसंगत चेतावनी देता है: विवादप्रिय वाणी वाले से उलझना आग में लकड़ी डालने जैसा है। यूनानी पाठ एक भिन्न और महत्त्वपूर्ण पाठ-रूप प्रस्तुत करता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक स्वर। ‘व्यक्ति’ लिंग-समावेशी और मूल אישׁ के सामान्य मानवीय संदर्भ के अनुकूल है। मुख्य पाठ में मुहावरे का अर्थ स्पष्ट किया गया है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
