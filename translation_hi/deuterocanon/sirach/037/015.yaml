  yaml_path: translation/deuterocanon/sirach/037/015.yaml
  text: And more than all this, pray to the Most High that he may direct your way in truth.
translation:
  language: hi
  text: क्योंकि मनुष्य का अंतर्मन कभी-कभी सात पहरेदारों से भी अधिक सचेत कर देता है, जो ऊँचे स्थान पर चौकसी के लिए बैठे हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध काहाना हिब्रू पांडुलिपि-पाठ यहाँ गंभीर रूप से असंगत है और लगभग यह कहता है: “दुष्ट मनुष्य के साथ भलाई के प्रतिदान के विषय में, और निर्दयी के साथ शरीर की भलाई के विषय में।” दिए गए यूनानी समानांतर में इसके बजाय अंतर्मन और सात पहरेदारों वाली उक्ति है, जिसका मुख्य पाठ में अनुवाद किया गया है। कुछ पद-क्रमों में इस स्थान पर परमप्रधान से सत्य में मार्ग सीधा करने की प्रार्थना मिलती है।'
    reason: textual_variant
lexical_decisions:
- source_word: ψυχή
  choice: अंतर्मन
  rationale: यहाँ शब्द मनुष्य के भीतर के बोध या अंतःचेतना को दर्शाता है; केवल शारीरिक ‘प्राण’ या दार्शनिक ‘आत्मा’ कहना संदर्भ को अनावश्यक रूप से सीमित कर देता।
- source_word: ἀπαγγέλλειν ἐνίοτε εἴωθεν
  choice: कभी-कभी … सचेत कर देता है
  rationale: शाब्दिक अर्थ ‘कभी-कभी बताया करता है’ है। पहरेदारों की उपमा के संदर्भ में ‘सचेत कर देता है’ स्वाभाविक हिन्दी में सूचना और चेतावनी, दोनों का भाव रखता है।
- source_word: ἢ ἑπτὰ σκοποί
  choice: सात पहरेदारों से भी अधिक
  rationale: ἤ यहाँ तुलना सूचित करता है। हिन्दी में निहित तुलनात्मक भाव स्पष्ट करने के लिए ‘से भी अधिक’ रखा गया है।
- source_word: ἐπὶ μετεώρου καθήμενοι ἐπὶ σκοπῆς
  choice: जो ऊँचे स्थान पर चौकसी के लिए बैठे हों
  rationale: यह ऊँचाई पर तैनात निगरानी करने वालों का दृश्य सुरक्षित रखता है और यूनानी वाक्य की पुनरुक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: עם איש רע על תגמול חסד, ואכזרי על טוב בשר
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: उपलब्ध काहाना हिब्रू पंक्ति इस पद के संदर्भ और दिए गए यूनानी समानांतर से मेल नहीं खाती; अतः उसे पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: हिब्रू और यूनानी साक्ष्यों का गंभीर असामंजस्य
  choice: मुख्य पाठ दिए गए वास्तविक यूनानी समानांतर का अनुवाद करता है।
  alternative: 'हिब्रू का लगभग शाब्दिक रूप: ‘दुष्ट मनुष्य के साथ भलाई के प्रतिदान के विषय में, और निर्दयी के साथ शरीर की भलाई के विषय में।’ एक अन्य प्रचलित पद-पाठ यहाँ परमप्रधान से सच्चाई में मार्ग सीधा करने की प्रार्थना देता है।'
  rationale: प्रस्तुत हिब्रू पाठ संदर्भ में असंगत और संभवतः गलत स्थान पर जुड़ा हुआ है। साथ ही, दिए गए यूनानी पाठ में प्रार्थना वाला वाक्य नहीं, बल्कि अंतर्मन और सात पहरेदारों की उक्ति है। इसलिए अंग्रेज़ी परामर्श-पाठ के दावे को वास्तविक उद्धृत यूनानी के ऊपर नहीं रखा गया; पाठगत तनाव पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘अंतर्मन’ अंतःबोध को सहज रूप में व्यक्त करता है, और ‘सचेत कर देता है’ पहरेदारों की उपमा से स्वाभाविक संबंध बनाए रखता है।
