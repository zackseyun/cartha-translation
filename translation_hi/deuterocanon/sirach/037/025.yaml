  yaml_path: translation/deuterocanon/sirach/037/025.yaml
  text: There is a wise man who is wise for many[b][a], but for himself he is worthless.
translation:
  language: hi
  text: कोई बुद्धिमान मनुष्य बहुतों के लिए बुद्धिमान होता है,[b] पर अपने लिए वह निकम्मा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גוֹאָל कठिन और अनिश्चित है। इसका अर्थ ‘अपवित्र’, ‘कलंकित’ या अपने लिए किसी काम का न होना हो सकता है; यहाँ प्रसंग के विरोध को देखते हुए ‘निकम्मा’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी परम्परा में इस स्थान पर एक अलग उक्ति है: “मनुष्य का जीवन गिने हुए दिनों का है, पर इस्राएल के दिन अनगिनत हैं।” यहाँ इब्रानी और यूनानी पाठ एक-दूसरे से निकटता से मेल नहीं खाते।'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई … होता है
  rationale: यह अस्तित्वसूचक पद एक सामान्य नीतिवचन प्रस्तुत करता है; हिन्दी में ‘कोई … होता है’ स्वाभाविक है।
- source_word: חָכָם
  choice: बुद्धिमान मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है और यहाँ एक प्रतिनिधि प्रकार का मनुष्य अभिप्रेत है।
- source_word: לְרַבִּים
  choice: बहुतों के लिए
  rationale: לְ को हित अथवा संबंध के अर्थ में लेकर यह बताता है कि उसकी बुद्धिमानी का लाभ या प्रभाव बहुतों तक पहुँचता है।
- source_word: נֶחְכָּם
  choice: बुद्धिमान होता है
  rationale: निफ़अल रूप में बुद्धिमान ठहरने या अपने को बुद्धिमान दिखाने की छाया हो सकती है; सन्दर्भ में ‘बुद्धिमान होता है’ प्रक्रिया का अनावश्यक भाव जोड़े बिना अस्पष्टता को पर्याप्त रूप से रखता है।
- source_word: וּלְנַפְשׁוֹ
  choice: पर अपने लिए
  rationale: נפש यहाँ आध्यात्मिक ‘आत्मा’ से अधिक स्वयं व्यक्ति को सूचित करता है; यह उसके सार्वजनिक लाभ और निजी विफलता का विरोध है।
- source_word: גוֹאָל
  choice: निकम्मा
  rationale: यह कठिन और संभवतः दूषित/कलंकित होने से जुड़ा रूप है। सन्दर्भगत विरोध में ‘निकम्मा’ अपने ही काम न आने का नकारात्मक मूल्यांकन स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अनिश्चितता पाद-टिप्पणी में रखी गई है।
