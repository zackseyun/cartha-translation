  yaml_path: translation/deuterocanon/sirach/037/001.yaml
  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: hi
  text: हर मित्र कहता है, “मैं भी उससे प्रेम करता हूँ”; पर कोई मित्र केवल नाम का मित्र[a] होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ बहुत संक्षिप्त अभिव्यक्ति है, जिसका रूप लगभग ‘मित्र—नाम का मित्र’ है। यूनानी समानांतर अर्थ को ‘केवल नाम का मित्र’ के रूप में स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  choice: हर मित्र
  rationale: אוהב का अर्थ ‘प्रेम करने वाला’ या सामाजिक अर्थ में ‘मित्र’ हो सकता है। यूनानी समानांतर Πᾶς φίλος और पद में मित्रता का विरोधाभास यहाँ ‘हर मित्र’ का समर्थन करते हैं।
- source_word: אומר
  choice: कहता है
  rationale: यह सामान्य कथन-सूचक क्रिया है; ‘कहता है’ नीतिवचन की सरल शैली को बनाए रखता है।
- source_word: אהבתי
  choice: मैं भी उससे प्रेम करता हूँ
  rationale: इब्रानी पूर्ण रूप का शाब्दिक अर्थ ‘मैंने प्रेम किया’ है, पर प्रत्यक्ष कथन में यह स्थायी दावे को व्यक्त कर सकता है। यूनानी समानांतर में ‘मैं भी’ और ‘उससे’ स्पष्ट हैं; हिन्दी में यह रूप स्वाभाविक और अर्थ-संगत है।
- source_word: אך
  choice: पर
  rationale: यह मित्रता के दावे और वास्तविकता के बीच विरोध प्रकट करता है।
- source_word: יש
  choice: कोई … होता है
  rationale: इब्रानी अस्तित्व-सूचक पद को हिन्दी के सामान्य नीतिवचनात्मक ढंग में व्यक्त किया गया है।
- source_word: אהב שם אהב
  choice: कोई मित्र केवल नाम का मित्र होता है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ असामान्य है। यूनानी ὀνόματι μόνον φίλος स्पष्ट करता है कि आशय केवल नाममात्र की मित्रता से है।
