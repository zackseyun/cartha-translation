base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/024.yaml
  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: hi
  text: भलाई और बुराई,[a] जीवन और मृत्यु—इन सब पर जीभ शासन करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “बुद्धिमान मनुष्य आशीष से भर जाएगा, और जितने उसे देखेंगे वे उसे धन्य कहेंगे।” यहाँ यूनानी पाठ उपलब्ध हिब्रू से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: भलाई
  rationale: רעה के साथ व्यापक विरोधी युग्म में यह नैतिक और अनुभवगत ‘अच्छाई/भलाई’ को व्यक्त करता है; ‘समृद्धि’ जैसा संकरा अर्थ यहाँ उपयुक्त नहीं।
- source_word: רעה
  choice: बुराई
  rationale: טוב के साथ तीखे और व्यापक विरोध को बनाए रखता है; ‘हानि’ या ‘विपत्ति’ संभव अर्थ हैं, पर जीवन और मृत्यु के समानांतर व्यापक ध्रुवों के कारण ‘बुराई’ अधिक उपयुक्त है।
- source_word: חיים
  choice: जीवन
  rationale: מות के साथ प्रचलित और सीधा विरोधी युग्म है।
- source_word: מות
  choice: मृत्यु
  rationale: חיים के साथ प्रचलित और सीधा विरोधी युग्म है।
- source_word: ומושלת
  choice: शासन करती है
  rationale: क्रिया משל यहाँ अधिकार या प्रभुत्व चलाने का भाव देती है; यह अनुवाद उस शक्ति को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: בם כליל
  choice: इन सब पर
  rationale: यह वाक्यांश पहले कही गई सभी बातों पर जीभ के व्यापक प्रभुत्व को दर्शाता है।
- source_word: לשון
  choice: जीभ
  rationale: ठोस हिब्रू रूपक को बनाए रखता है, जिसमें ‘जीभ’ वाणी और उसकी शक्ति का प्रतिनिधित्व करती है।
theological_decisions:
- issue: हिब्रू पाठ और उससे बहुत भिन्न यूनानी समानांतर पाठ का संबंध
  choice: 'मुख्य पाठ में उपलब्ध हिब्रू को आधार बनाया गया: ‘भलाई और बुराई, जीवन और मृत्यु—इन सब पर जीभ शासन करती है।’'
  alternative: 'यूनानी समानांतर में इसके स्थान पर है: ‘बुद्धिमान मनुष्य आशीष से भर जाएगा, और जितने उसे देखेंगे वे उसे धन्य कहेंगे।’'
  rationale: सिराख का हिब्रू पाठ उपलब्ध होने पर वही प्राथमिक स्रोत है। यूनानी साक्ष्य यहाँ निकट अनुवाद नहीं, बल्कि बहुत भिन्न पाठ प्रस्तुत करता है; इसलिए उसे मुख्य पाठ में मिलाए बिना पादटिप्पणी में पारदर्शी रूप से दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘जीभ’ के बाइबिलीय रूपक को ‘वाणी’ में स्पष्ट करके नहीं बदला गया, ताकि मूल की ठोस छवि और अर्थगत तनाव बने रहें।
