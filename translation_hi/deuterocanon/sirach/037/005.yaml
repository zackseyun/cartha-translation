base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/005.yaml
  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
translation:
  language: hi
  text: एक मित्र किसी भलाई[b] को लेकर किसी पराए से लड़ता है, और नगरों के विरुद्ध ढाल उठा लेता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “एक साथी अपने पेट के लिए मित्र के साथ कष्ट उठाता है, और युद्ध के सामने ढाल उठा लेता है।” पहले उपवाक्य में तथा हिब्रू के “नगरों” के स्थान पर यूनानी के “युद्ध” में उल्लेखनीय पाठांतर है; मुख्य पाठ उपलब्ध हिब्रू साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
  - marker: b
    text: हिब्रू טוב का अर्थ “भलाई” के साथ-साथ “लाभ” या “फायदा” भी हो सकता है। हिब्रू वाक्यांश की रचना संक्षिप्त और कुछ कठिन है; “अच्छा मित्र” पढ़ना भी प्रस्तावित है, पर मुख्य पाठ טוב को संघर्ष के विषय के रूप में रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוהב טוב
  choice: अच्छा मित्र
  rationale: אוהב का संज्ञात्मक प्रयोग ‘मित्र’ के अर्थ में स्वाभाविक है, और उसके बाद आया טוב विशेषण के रूप में ‘अच्छा’ समझा जा सकता है। यह पाठ के संक्षिप्त हिब्रू रूप और मित्रता के प्रसंग, दोनों के अनुकूल है; दूसरी सम्भव व्याख्या पादटिप्पणी में रखी गई है।
- source_word: נלחם עם זר
  choice: किसी पराए से लड़ता है
  rationale: נלחם युद्ध या संघर्ष करने को और עם यहाँ विरोधात्मक सम्बन्ध में ‘से’ को व्यक्त करता है। זר किसी जातीय ‘विदेशी’ तक सीमित नहीं, बल्कि अपने संबंध-वृत्त से बाहर के व्यक्ति को दर्शाता है; इसलिए ‘पराया’ चुना गया है।
- source_word: נגד ערים
  choice: नगरों के विरुद्ध
  rationale: נגד का सीधा संघर्षात्मक अर्थ ‘के विरुद्ध’ है और उपलब्ध हिब्रू पाठ में ערים ‘नगरों’ है। यद्यपि यह वाक्यांश कठिन है और यूनानी में ‘युद्ध’ मिलता है, मुख्य पाठ हिब्रू साक्ष्य का अनुसरण करता है।
- source_word: יחזיק צנה
  choice: ढाल उठा लेता है
  rationale: शाब्दिक अर्थ ‘ढाल थामेगा’ है, पर युद्ध के लिए सन्नद्ध होने के चित्र में आधुनिक हिन्दी का ‘ढाल उठा लेना’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: צנה
  choice: ढाल
  rationale: यह शब्द प्रायः बड़ी ढाल का बोध करा सकता है, किन्तु आकार को मुख्य पाठ में अनावश्यक रूप से निश्चित किए बिना सामान्य ‘ढाल’ पर्याप्त है।
