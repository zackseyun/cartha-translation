  yaml_path: translation/deuterocanon/sirach/037/019.yaml
  text: There is also a wise man whose own understanding is trustworthy to him[a][b].
translation:
  language: hi
  text: और विवेकी हृदय की सलाह भी—तुम पर उससे अधिक कौन भरोसा करेगा?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ बहुत भिन्न है: “एक चतुर मनुष्य और बहुतों का शिक्षक है, फिर भी वह अपने ही प्राण के लिए निकम्मा है।” संभवतः यह पद के किसी भिन्न इब्रानी रूप या अत्यन्त अलग पाठ-परंपरा को दर्शाता है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी पदबंध का शाब्दिक भाव “विवेकी हृदय की सलाह” है। अंतिम प्रश्न कुछ लुप्तपदीय है; “उससे” विवेकी व्यक्ति या उसके भीतरी परामर्श की ओर संकेत कर सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וגם
  choice: और ... भी
  rationale: यह आसपास के कथनों में एक और विचार जोड़ता है; हिन्दी में विभक्त रूप ‘और ... भी’ स्वाभाविक है।
- source_word: עצת לבב הבין
  choice: विवेकी मन की सलाह
  rationale: शाब्दिक संरचना ‘विवेकी/समझदार मन की सलाह’ है। ‘सलाह’ आंतरिक विचार-विमर्श और निर्णय-बुद्धि, दोनों को व्यक्त करती है; इसे केवल ‘समझ’ कह देने से मूल का सलाह-संबंधी रूप दब जाता।
- source_word: מי יאמן לך
  choice: तुम्हारे लिए ... भरोसेमंद कौन होगा?
  rationale: प्रश्नवाचक रचना और दूसरे पुरुष ‘तुम्हारे लिए’ को बनाए रखते हुए אמן का अर्थ विश्वास योग्य होना लिया गया है।
- source_word: אמן ממנו
  choice: उससे अधिक भरोसेमंद
  rationale: कठिन और कुछ हद तक लुप्तपदीय पदबंध में ממנו के तुलनात्मक भाव को सुरक्षित रखा गया है। ‘उससे’ का संकेत निकटवर्ती ‘विवेकी मन’ अथवा उसके भीतरी परामर्श की ओर समझा जा सकता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और अत्यन्त भिन्न यूनानी समानांतर पाठ
  choice: मुख्य पाठ में उपलब्ध इब्रानी की प्रश्नवाचक और तुलनात्मक संरचना का अनुवाद
  alternative: 'यूनानी के अनुसार: ‘एक चतुर मनुष्य बहुतों को शिक्षा देता है, फिर भी अपने ही प्राण के लिए निकम्मा है।’'
  rationale: इस पद का इब्रानी साक्ष्य उपलब्ध और उच्च विश्वास वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी संभवतः किसी भिन्न इब्रानी मूलरूप या अलग पाठ-परंपरा को दर्शाता है; अतः उसे पादटिप्पणी में पूरा बताया गया है।
- issue: לבב הבין में व्यक्ति और उसके मन के बीच संदर्भगत अस्पष्टता
  choice: ‘विवेकी मन’
  alternative: ‘विवेकी मनुष्य’ अथवा ‘अपनी समझ’
  rationale: यह रूप मूल की आंतरिक विवेक-बुद्धि को बनाए रखता है और सर्वनाम के संकेत को किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज ज्ञान-साहित्यिक रूप अपनाया गया है। प्रश्नवाचक तनाव, दूसरे पुरुष का संबोधन और कठिन इब्रानी की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
