  text: But a man is always fearful[a]; whom you know keeps the commandment.
translation:
  language: hi
  text: हर काम की शुरुआत बात से होती है, और हर कार्य से पहले सलाह होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इब्रानी पाठ यहाँ बहुत अलग है। उसका अनुमानित अर्थ है: “परन्तु मनुष्य सदा डरता रहता है—वह, जिसे तुम आज्ञा माननेवाला जानते हो।” इस पद का इब्रानी पाठ पाठ-संबंधी रूप से समस्याग्रस्त प्रतीत होता है; मुख्य अनुवाद सुसंगत ग्रीक पाठ पर आधारित है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ παντὸς ἔργου
  choice: हर काम की शुरुआत
  rationale: ग्रीक पाठ का अर्थ ‘हर काम का आरम्भ’ है। ‘शुरुआत’ आधुनिक हिन्दी में सहज है और सूक्तिपरक कथन को स्पष्ट रखती है।
- source_word: λόγος
  choice: बात
  rationale: λόγος यहाँ काम शुरू होने से पहले कही या विचार में रखी गई बात को सूचित कर सकता है। ‘बात’ उसके व्यापक अर्थ को बनाए रखती है; ‘योजना’ कहना अधिक व्याख्यात्मक होता और ‘वचन’ अनावश्यक धार्मिक अर्थ जगा सकता था।
- source_word: πρὸ πάσης πράξεως
  choice: हर कार्य से पहले
  rationale: πρό कालगत पूर्वता बताता है और πρᾶξις कार्य या क्रिया को। ‘कार्य’ पहले खंड के ‘काम’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: βουλή
  choice: सलाह
  rationale: βουλή का अर्थ सलाह, विचार-विमर्श या सुविचारित योजना हो सकता है। ‘सलाह’ साधारण आधुनिक हिन्दी में स्वाभाविक है और पहले सोचने अथवा परामर्श लेने, दोनों संभावनाओं को खुला रखती है।
- source_word: אך איש מפחד תמיד, אשר תדע שומר מצוה
  choice: मुख्य पाठ में नहीं; पादटिप्पणी में पाठांतर
  rationale: उपलब्ध इब्रानी पाठ इस पद के सुसंगत ग्रीक पाठ से बहुत भिन्न है और पाठ-संबंधी रूप से विक्षुब्ध प्रतीत होता है। पारदर्शिता के लिए उसका अनुमानित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: उपलब्ध इब्रानी और ग्रीक पाठ के बीच बड़ा पाठांतर
  choice: सुसंगत ग्रीक पाठ को मुख्य पाठ में अनूदित किया गया है और इब्रानी पाठांतर को पादटिप्पणी में दिया गया है।
  alternative: 'इब्रानी का अनुमानित अनुवाद मुख्य पाठ में देना: ‘परन्तु मनुष्य सदा डरता रहता है—वह, जिसे तुम आज्ञा माननेवाला जानते हो।’'
  rationale: दिया गया इब्रानी पाठ उच्च-विश्वास से लिपिबद्ध है, पर इस स्थान पर ग्रीक से बिल्कुल अलग और अर्थ की दृष्टि से कठिन है। ग्रीक पाठ पूर्ण, व्याकरणसम्मत और ज्ञान-साहित्य के प्रसंग में सुसंगत है; फिर भी इब्रानी साक्ष्य को दबाने के बजाय स्पष्ट पाठांतर के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण सूक्तिपरक शैली। ‘बात’ और ‘सलाह’ सामान्य पाठक के लिए स्पष्ट हैं तथा ग्रीक λόγος और βουλή के बीच का भेद बनाए रखते हैं।
