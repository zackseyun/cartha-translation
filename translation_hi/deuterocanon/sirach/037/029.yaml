translation:
  language: hi
  text: मनुष्य का जीवन गिनती के दिनों का है, पर इस्राएल के लोगों का जीवन अनगिनत दिनों का है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और इस्राएल के लोगों का जीवन—ऐसे दिन जिनकी कोई गिनती नहीं।” इब्रानी संयोजक का अर्थ केवल “और” भी हो सकता है, यद्यपि यहाँ विरोध का भाव है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: मनुष्य का जीवन
  rationale: यह इब्रानी के सामान्य एकवचन ‘मनुष्य का जीवन’ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: מִסְפַּר יָמִים
  choice: गिने हुए दिनों का
  rationale: यह सीमित और गणनीय जीवनकाल का भाव रखते हुए ‘दिनों’ की ठोस छवि तथा अगले खंड के ‘अनगिनत दिनों’ से विरोध बनाए रखता है।
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: पर इस्राएल जाति का जीवन
  rationale: वाव का मूल अर्थ ‘और’ हो सकता है, लेकिन समानांतर रचना में व्यक्ति के सीमित जीवन और इस्राएल के सामूहिक जीवन के बीच विरोध स्पष्ट है; ‘पर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַם יִשְׂרָאֵל
  choice: इस्राएल जाति
  rationale: यह इस्राएल को केवल व्यक्तिवाचक नाम नहीं, बल्कि एक सामूहिक जनसमुदाय के रूप में व्यक्त करता है।
- source_word: יְמֵי אֵין מִסְפָּר
  choice: अनगिनत दिनों का
  rationale: इब्रानी ‘ऐसे दिन जिनकी कोई गिनती नहीं’ का संक्षिप्त और स्वाभाविक हिन्दी रूप है तथा पहले खंड के ‘गिने हुए’ से शब्दगत विरोध बनाए रखता है।
theological_decisions:
- issue: व्यक्ति की नश्वरता और इस्राएल की सामूहिक निरंतरता का विरोध
  choice: व्यक्ति के सीमित जीवनकाल की तुलना इस्राएल जाति के अनगिनत दिनों वाले सामूहिक जीवन से की गई है।
  alternative: इसे केवल इतना कहने वाला समझा जा सकता है कि इस्राएल का इतिहास बहुत लंबा है, न कि उसकी निरंतरता के विषय में कोई व्यापक धार्मिक कथन।
  rationale: इब्रानी समानांतरता ‘गिने हुए दिनों’ और ‘बिना गिनती के दिनों’ के बीच प्रबल विरोध रखती है। अनुवाद उस तनाव को बनाए रखता है, पर उसे स्पष्ट शाश्वतता या किसी विस्तृत वाचा-सिद्धांत के कथन में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘जाति’ यहाँ किसी नस्ली वर्गीकरण के बजाय सामूहिक ‘लोग/जन’ के अर्थ में प्रयुक्त है।
