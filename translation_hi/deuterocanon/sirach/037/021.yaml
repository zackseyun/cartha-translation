base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/021.yaml
  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
translation:
  language: hi
  text: और इन सब बातों के साथ परमेश्वर से लगन से प्रार्थना करो, जो सचमुच तुम्हारे कदमों को स्थिर करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य में है: “क्योंकि उसे प्रभु की ओर से अनुग्रह नहीं दिया गया, इसलिए कि वह सारी बुद्धि से वंचित था।” यहाँ इब्रानी और यूनानी पाठों में पर्याप्त अंतर है; मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: और इन सब बातों के साथ
  rationale: यह पद को पिछले परामर्श से जोड़ता है और ועם के योगात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עתר
  choice: मन लगाकर प्रार्थना करो
  rationale: क्रिया साधारण प्रार्थना से बढ़कर गंभीर विनती का भाव रखती है; यह अभिव्यक्ति उसी आग्रह को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: אל אל
  choice: परमेश्वर से
  rationale: यहाँ पूर्वसर्ग के बाद सामान्य ईश्वरीय उपाधि है, कोई वाचा-नाम नहीं; इसलिए हिन्दी में स्वाभाविक रूप से ‘परमेश्वर से’ उपयुक्त है।
- source_word: אשר
  choice: वही
  rationale: सम्बन्धवाचक पद का आशय व्यक्तिगत ईश्वरीय कर्ता से है; अर्धविराम के बाद ‘वही’ इस सम्बन्ध और बल को स्वाभाविक बनाता है।
- source_word: יכין
  choice: स्थिर करेगा
  rationale: כון मूल का प्रमुख अर्थ स्थापित या दृढ़ करना है। ‘कदमों’ के साथ यह जीवन-मार्ग को स्थिर करने का रूपक है; ‘स्थिर करेगा’ मूल अर्थ को ‘मार्ग दिखाएगा’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: באמת
  choice: सचमुच
  rationale: यह क्रियाविशेषण सत्य, विश्वसनीयता या निश्चय का भाव दे सकता है। ‘सचमुच’ इस बहुअर्थी बल को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: צעדיך
  choice: तुम्हारे कदमों को
  rationale: यह मूल रूपक को बनाए रखता है और हिन्दी में जीवन की चाल या मार्ग के लिए समझ में आने वाली अभिव्यक्ति है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों का सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध इब्रानी का प्रार्थना और परमेश्वर द्वारा कदम स्थिर किए जाने वाला पाठ रखा गया है।
  alternative: 'यूनानी साक्ष्य: “क्योंकि उसे प्रभु की ओर से अनुग्रह नहीं दिया गया, इसलिए कि वह सारी बुद्धि से वंचित था।”'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है। यूनानी में यहाँ मामूली शब्दांतर नहीं, बल्कि पर्याप्त रूप से भिन्न वाक्य है; इसलिए उसे मुख्य पाठ में मिलाने के बजाय पाठांतर के रूप में पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘मन लगाकर प्रार्थना करो’ गंभीर विनती का भाव देता है, और ‘कदमों को स्थिर करेगा’ इब्रानी रूपक तथा כן मूल के स्थापित/दृढ़ करने वाले अर्थ को बनाए रखता है।
