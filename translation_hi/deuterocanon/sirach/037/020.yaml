  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: hi
  text: मनुष्य का हृदय उसकी चिंताओं[a][b] को प्रकट कर देता है—चौकी पर तैनात सात पहरेदारों से भी बढ़कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी שעיותיו का अर्थ अनिश्चित है; इससे मनुष्य की परेशानियाँ, चिंताएँ या भीतरी सरोकार अभिप्रेत हो सकते हैं। इस पद का यूनानी पाठ बहुत भिन्न है: उसमें ऐसे व्यक्ति की बात है जो वचनों में चतुर है, फिर भी घृणा का पात्र है और भोजन से वंचित रहेगा।'
    reason: textual_variant
  - marker: b
    text: या, “मनुष्य का हृदय उसके भीतरी विचारों को प्रकट कर देता है—चौकी पर तैनात सात पहरेदारों से भी बढ़कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לב
  choice: हृदय
  rationale: इब्रानी में यह मनुष्य के भीतरी व्यक्तित्व, विचार और भावनाओं का केंद्र है। ‘हृदय’ मूल बिंब को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: אנוש
  choice: मनुष्य
  rationale: यह एक मानव व्यक्ति को सूचित करने वाला एकवचन शब्द है; यहाँ कहावत में इसका अर्थ सामान्य रूप से किसी भी मनुष्य से है।
- source_word: יגיד
  choice: प्रकट कर देता है
  rationale: हिफ़ील क्रिया का अर्थ बताना, घोषित करना या ज्ञात कराना है। संदर्भ में ‘प्रकट कर देता है’ भीतरी दशा के उजागर होने का भाव सहज रूप से व्यक्त करता है।
- source_word: שעיותיו
  choice: उसकी चिंताओं
  rationale: यह इब्रानी रूप अनिश्चित है और संभवतः चिंताओं, परेशानियों या भीतरी सरोकारों की ओर संकेत करता है। ‘चिंताओं’ को मुख्य पाठ में रखते हुए अन्य संभावना पादटिप्पणी में दी गई है।
- source_word: משבעה
  choice: सात ... से भी बढ़कर
  rationale: यहाँ מן तुलनात्मक है; वाक्य हृदय की प्रकट करने की क्षमता की तुलना सात पहरेदारों से करता है।
- source_word: צופים
  choice: पहरेदारों
  rationale: צפה से बना यह कृदंत निगरानी करने वालों को दर्शाता है। ‘पहरेदार’ हिन्दी में स्पष्ट और बिंब के अनुकूल है।
- source_word: על מצפה
  choice: चौकी पर तैनात
  rationale: מצפה निगरानी की जगह या चौकी है। यह अनुवाद बिना अनावश्यक रूप से मीनार मान लिए निगरानी-स्थल का चित्र स्पष्ट करता है।
