  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
translation:
  language: hi
  text: हर सलाहकार हाथ हिलाता है[b], पर ऐसा भी सलाहकार है जो अपने लिए सलाह देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद के अंत में उपलब्ध इब्रानी पाठ कठिन है। यूनानी समानांतर का अर्थ है, “पर ऐसा व्यक्ति है जो अपने लिए सलाह देता है,” और उसी के आधार पर यहाँ यह भाव अपनाया गया है।
    reason: textual_variant
  - marker: b
    text: 'अधिक भावानुवादी रूप: “हर सलाहकार सलाह पेश करता है, पर कुछ सलाहकार अपने लिए सलाह देते हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  choice: हर सलाहकार
  rationale: כל को यहाँ नीतिवचन-सदृश सामान्य कथन में वितरणात्मक अर्थ में लिया गया है; יועץ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप ‘सलाहकार’ है।
- source_word: יניף יד
  choice: हाथ हिलाता है
  rationale: यह इब्रानी बिंब को बनाए रखता है, यद्यपि प्रसंग में इसका आशय तत्परता से सलाह पेश करना हो सकता है।
- source_word: אך
  choice: पर
  rationale: यह सामान्य कथन और स्वार्थी सलाहकार के विषय में चेतावनी के बीच विरोध प्रकट करता है।
- source_word: יש יועץ
  choice: कोई सलाहकार ... देता है
  rationale: יש के अस्तित्वसूचक भाव को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: דרך אל לץ
  choice: अपने ही लाभ के लिए
  rationale: दिया गया इब्रानी पाठ यहाँ कठिन और संभवतः दूषित है। यूनानी समानांतर εἰς αὐτόν (‘अपने लिए’) स्वार्थ-साधक सलाह का अर्थ समर्थित करता है; हिन्दी में ‘अपने ही लाभ के लिए’ उस अभिप्राय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सलाहकार की मंशा का स्वरूप
  choice: अपने ही लाभ के लिए
  alternative: अपने लिए
  rationale: पाठ का उद्देश्य स्वार्थपूर्ण परामर्श से सावधान करना प्रतीत होता है। ‘लाभ’ अर्थ को स्वाभाविक हिन्दी में खोलता है, पर इसे निश्चित धर्मवैचारिक व्याख्या के रूप में नहीं थोपा गया; पाठगत कठिनाई पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। मुख्य पाठ में इब्रानी का ‘हाथ हिलाने’ वाला कठिन बिंब सुरक्षित है, जबकि पादटिप्पणी अधिक सहज भावार्थ देती है।
