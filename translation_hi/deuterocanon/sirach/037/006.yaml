translation:
  language: hi
  text: अपने मन में मित्र को न भूलना,[a] और धन-संपत्ति के समय भी उसे न भूलना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ कठिन है और इसे ‘युद्ध में मित्र को न भूलना’ भी समझा जा सकता है; यूनानी में ‘अपने मन में मित्र को न भूलना’ है।
    reason: textual_variant
  - marker: b
    text: हिब्रू की दूसरी पंक्ति अनिश्चित है और संभवतः ‘अपनी लूट में उसे न छोड़ना’ का अर्थ देती है; यूनानी में ‘अपनी संपत्तियों में उसे न भूलना’ है।
    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח
  choice: न भूलना
  rationale: निषेधात्मक हिब्रू रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी अनुवाद।
- source_word: חבר
  choice: मित्र
  rationale: यह शब्द मित्र या साथी को दर्शाता है; इस नैतिक प्रसंग में ‘मित्र’ सबसे स्वाभाविक है और यूनानी φίλου से भी मेल खाता है।
- source_word: בקרב
  choice: अपने मन में
  rationale: हिब्रू व्यंजन-पाठ का अर्थ ‘भीतर/बीच में’ या भिन्न स्वरीकरण पर ‘युद्ध में’ समझा जा सकता है। प्रमुख पाठ-असंगति को देखते हुए यूनानी ἐν τῇ ψυχῇ σου (‘अपने प्राण/मन में’) मुख्य पाठ के लिए आधार देता है; हिब्रू की दूसरी सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ואל תעזבהן
  choice: और उसकी उपेक्षा न करना
  rationale: प्रेषित हिब्रू रूप का प्रत्यय कठिन है, पर मित्र की ओर संकेत करने वाला यूनानी एकवचन αὐτοῦ अर्थ स्पष्ट करता है। यूनानी ‘उसके प्रति बेपरवाह न होना’ को हिन्दी में स्वाभाविक रूप से ‘उसकी उपेक्षा न करना’ कहा गया है।
- source_word: בשללך
  choice: अपनी संपत्ति में
  rationale: हिब्रू रूप ‘तुम्हारी लूट’ का अर्थ दे सकता है, जबकि यूनानी ἐν χρήμασίν σου ‘तुम्हारी संपत्ति/धन में’ पढ़ता है। मुख्य पाठ में स्पष्ट यूनानी समानांतर लिया गया और हिब्रू पाठ पादटिप्पणी में दिया गया है।
