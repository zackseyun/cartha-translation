  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
translation:
  language: hi
  text: किसी स्त्री से उसकी प्रतिद्वंद्वी के विषय में, और किसी कायर से उसके युद्ध के विषय में परामर्श लो;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध इब्रानी पाठ कठिन है और यूनानी पाठ से बहुत भिन्न है। यूनानी का भाव लगभग यह है: “जो अपने मन में तुम्हारे मन के अनुरूप है, और यदि तुम ठोकर खाओ, तो वह तुम्हारे साथ दुःखी होगा”—अर्थात ऐसा आत्मीय मित्र जो तुम्हारे दुःख में सहभागी हो। जिस इब्रानी शब्द का अनुवाद “कायर” किया गया है, वह अनिश्चित है; “विद्रोही” या “भगोड़ा” भी सम्भव हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: से … परामर्श लो
  rationale: इब्रानी में सामान्यतः ‘के साथ’ है, पर आस-पास का प्रसंग अनुपयुक्त सलाहकारों से परामर्श लेने की बात करता है; हिन्दी में ‘से … परामर्श लो’ निहित आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִשָּׁה
  choice: किसी स्त्री
  rationale: शब्द का अर्थ ‘स्त्री/पत्नी’ हो सकता है, लेकिन कोई संबंधसूचक चिह्न नहीं है; इसलिए ‘किसी स्त्री’ कम व्याख्यात्मक है।
- source_word: צָרָהּ
  choice: उसकी प्रतिद्वंद्वी
  rationale: यह शब्द सौत या स्त्री-विरोधी को सूचित कर सकता है। ‘प्रतिद्वंद्वी’ व्यापक अर्थ रखता है और ‘सौत’ जैसे संकुचित अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מָרֵד
  choice: किसी कायर
  rationale: पाठ कठिन और अनिश्चित है। युद्ध के साथ इसका संबंध युद्ध में अविश्वसनीय या पीछे हटने वाले व्यक्ति की ओर संकेत कर सकता है; सहज हिन्दी में ‘कायर’ इस संभावित अर्थ को व्यक्त करता है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִלְחַמְתּוֹ
  choice: उसके युद्ध
  rationale: संज्ञा का अर्थ युद्ध/लड़ाई है और प्रत्यय ‘उसका’ दर्शाता है। ‘उसके युद्ध के विषय में’ मूल के संबंधसूचक बल को बनाए रखता है।
theological_decisions:
- issue: सराख 37:13 में उपलब्ध इब्रानी और यूनानी पाठों का तीखा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और पादटिप्पणी में भिन्न यूनानी पाठ
  alternative: 'यूनानी के अनुसार लगभग: ‘उससे सलाह लो जिसका मन तुम्हारे मन के अनुरूप है, और यदि तुम ठोकर खाओ तो वह तुम्हारे साथ दुःखी होगा।’'
  rationale: इब्रानी पाठ उपलब्ध होने के कारण उसे प्राथमिक रखा गया है, किंतु यूनानी कोई छोटा पाठांतर नहीं बल्कि लगभग पूर्णतः भिन्न वाक्य देता है। अतः पाठगत तनाव को दबाने के बजाय स्पष्ट पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। पद की सूची-जैसी संरचना और अंत का अर्धविराम बनाए रखा गया है, क्योंकि यह आस-पास की चेतावनियों की शृंखला का अंश है।
