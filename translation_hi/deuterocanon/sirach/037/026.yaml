  yaml_path: translation/deuterocanon/sirach/037/026.yaml
  text: There is a wise man who is despised for his words[a], and he is deprived of every pleasant food.
translation:
  language: hi
  text: एक बुद्धिमान मनुष्य ऐसा भी है जो अपनी बातों के कारण तिरस्कृत होता है[a], और हर स्वादिष्ट भोजन से वंचित रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “अपने लोगों के बीच बुद्धिमान मनुष्य लोगों का विश्वास प्राप्त करेगा, और उसका नाम सदा जीवित रहेगा।” यहाँ इब्रानी और यूनानी पाठों में बहुत बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  choice: एक ... भी है
  rationale: यह अस्तित्वसूचक आरंभ है; संयोजक וְ को प्रसंगानुकूल ‘भी’ से व्यक्त किया गया है।
- source_word: חָכָם
  choice: बुद्धिमान मनुष्य
  rationale: पुल्लिंग एकवचन संज्ञा का प्रतिनिधिक और स्वाभाविक हिन्दी रूप।
- source_word: בִּדְבָרוֹ
  choice: अपनी बातों के कारण
  rationale: בְּ को यहाँ कारणसूचक समझना उचित है; דָּבָר का एकवचन इस प्रसंग में व्यक्ति की कही बातों अथवा वाणी को सामूहिक रूप से दर्शा सकता है।
- source_word: נִמְאָס
  choice: तुच्छ समझा जाता है
  rationale: מאס के निफ़अल रूप में अस्वीकार या तिरस्कार किए जाने का भाव है; यह हिन्दी में सामाजिक अवमानना को सहज रूप से व्यक्त करता है।
- source_word: וּמִכָּל מַאֲכָל תַּעֲנוּג
  choice: हर स्वादिष्ट भोजन से
  rationale: शब्दसमूह आनंददायक अथवा रुचिकर भोजन को दर्शाता है; ‘स्वादिष्ट भोजन’ ठोस बिंब और सहज भाषा बनाए रखता है।
- source_word: נִבְצָר
  choice: वंचित रहता है
  rationale: מִן के साथ यह किसी वस्तु के अप्राप्य या रोके जाने का परिणाम बताता है; ‘वंचित रहता है’ उस दशा को स्पष्ट करता है।
- source_word: ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν, καὶ τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα
  choice: मुख्य पाठ में नहीं अपनाया; पादटिप्पणी में वैकल्पिक यूनानी पाठ
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है, जबकि अत्यधिक भिन्न यूनानी परंपरा को पाठक के लिए पारदर्शी रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: सिराख 37:26 में इब्रानी और यूनानी पाठ-परंपराओं का व्यापक अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी: ‘अपने लोगों के बीच बुद्धिमान मनुष्य विश्वास पाएगा, और उसका नाम सदा जीवित रहेगा।’'
  rationale: जहाँ सिराख का इब्रानी साक्ष्य उपलब्ध है, वही मुख्य आधार है। यूनानी पाठ केवल छोटा पाठांतर नहीं, बल्कि पूर्णतः भिन्न कथन है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अपनी बातों के कारण’ कारणसूचक अर्थ को स्पष्ट करता है और ‘तुच्छ समझा जाता है’ सामाजिक तिरस्कार को स्वाभाविक ढंग से व्यक्त करता है।
