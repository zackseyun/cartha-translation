translation:
  language: hi
  text: अपने ससुर से सलाह मत लेना, और ईर्ष्यालु व्यक्ति से भेद छिपाए रखना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אל תועץ
  choice: सलाह न लेना
  rationale: निषेधात्मक रूप यहाँ किसी से परामर्श लेने से रोकता है। यह आधुनिक हिन्दी में स्वाभाविक है और सलाह के प्रसंग को स्पष्ट रखता है।
- source_word: חמיך
  choice: अपने ससुर
  rationale: इब्रानी शब्द विशेष रूप से ‘ससुर’ को दर्शाता है, इसलिए अधिक सामान्य ‘संबंधी’ नहीं चुना गया।
- source_word: וממקנא
  choice: ईर्ष्यालु व्यक्ति से
  rationale: מן के साथ מקנא का अर्थ ऐसे व्यक्ति से है जो ईर्ष्या करता है। ‘व्यक्ति’ मूल के सामान्य आशय को अनावश्यक रूप से पुरुष तक सीमित नहीं करता।
- source_word: העלים סוד
  choice: भेद छिपाए रखना
  rationale: इस पदबंध का अर्थ किसी गोपनीय बात को प्रकट न करना है। ‘भेद’ और ‘छिपाए रखना’ वर्तमान हिन्दी में स्वाभाविक और अर्थ-सटीक हैं।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: उपलब्ध इब्रानी पाठ का सीधे अनुवाद करना
  alternative: यूनानी पाठ के आधार पर आज्ञाओं को मानने वाले भक्त पुरुष की संगति में बने रहने का अनुवाद
  rationale: यहाँ इब्रानी साक्ष्य उपलब्ध और उच्च विश्वास वाला है, इसलिए उसे प्राथमिक रखा गया है। यूनानी समानांतर का पाठ वस्तुतः अलग है; इस अंतर को मुख्य पाठ में मिलाकर तनाव मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न लेना’ और ‘छिपाए रखना’ दोनों आज्ञार्थक निषेध/निर्देश को स्वाभाविक ढंग से व्यक्त करते हैं।
