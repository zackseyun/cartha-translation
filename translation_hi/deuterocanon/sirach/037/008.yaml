base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/008.yaml
  text: Every counselor says[b][a], “See!” but there is a counselor who trips him up.
translation:
  language: hi
  text: हर सलाहकार कहता है, “देखो!”[a] पर कोई सलाहकार ऐसा भी होता है जो उसे पैरों तले रौंदता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में “देखो!” कठिन और अत्यंत संक्षिप्त है; इसका आशय अंतर्दृष्टि या दिशा देने का दावा भी हो सकता है। यूनानी समानांतर में अधिक विस्तृत चेतावनी है: सलाहकार से अपनी रक्षा करो, क्योंकि वह अपने ही हित में भी सलाह देगा।'
    reason: alternative_reading
  - marker: b
    text: या, “उसका लाभ उठाता है।” इब्रानी का शाब्दिक अर्थ है “उस पर पैर रखता है,” जो संभवतः हानिकारक या स्वार्थी सलाह को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  choice: हर सलाहकार
  rationale: כל का यहाँ वितरणात्मक अर्थ है—प्रत्येक सलाह देने वाला; ‘हर सलाहकार’ नीतिवचन-जैसी सामान्य उक्ति के लिए स्वाभाविक है और יועץ की पुनरावृत्ति भी बनाए रखता है।
- source_word: אומר
  choice: कहता है
  rationale: साधारण वर्तमान काल इब्रानी कथन के सार्वकालिक, नीतिपरक स्वर को व्यक्त करता है।
- source_word: חזה
  choice: “देखो!”
  rationale: यह रूप अत्यंत संक्षिप्त और पाठगत रूप से कठिन है। ‘देखो!’ उसकी आकस्मिकता तथा संभवतः अंतर्दृष्टि या दिशा देने के दावे को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: אך
  choice: पर
  rationale: यह सामान्य कथन से चेतावनी की ओर विरोधात्मक मोड़ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דורך עליו
  choice: उसे पैरों तले रौंदता है
  rationale: דרך का मूल बिंब पैर रखने या रौंदने का है। हिन्दी में यह प्रयोग हानिकारक अथवा स्वार्थी व्यवहार का संकेत देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और विस्तृत यूनानी समानांतर के बीच चयन
  choice: मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता देते हुए उसकी संक्षिप्तता और अस्पष्टता बनाए रखी गई है।
  alternative: 'यूनानी के आधार पर अधिक विस्तृत रूप: “सलाहकार से अपने प्राण की रक्षा कर... क्योंकि वह अपने ही लिए सलाह देगा।”'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है। यूनानी समानांतर स्वार्थी सलाह के विरुद्ध चेतावनी की पुष्टि करता है, पर उसकी विस्तृत शब्दावली को इब्रानी मुख्य पाठ में मिलाना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “देखो!” की पाठगत कठिनाई को सरल बनाकर मिटाया नहीं गया, और “पैरों तले रौंदता है” मूल इब्रानी बिंब को साधारण हिन्दी पाठक के लिए बोधगम्य रखता है।
