  text: Alas for an evil thought—why were you created, to fill the face of the world with deceit?
translation:
  language: hi
  text: हाय, बुरी सोच![a] तू क्यों रची गई कि सारे संसार को छल से भर दे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का यह पद कठिन है। यूनानी समानांतर में है: “हाय, बुरी सोच! तू कहाँ से लुढ़ककर आ गई कि सूखी भूमि को छल से ढक दे?” यूनानी यहाँ “सोच/विचार” अर्थ का समर्थन करता है और इब्रानी के “भर दे” के स्थान पर “ढक दे” कहता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  choice: हाय
  rationale: यह शोक और धिक्कार व्यक्त करने वाला विस्मयादिबोधक है; आधुनिक हिन्दी में ‘हाय’ स्वाभाविक और गंभीर है।
- source_word: רע
  choice: बुरी
  rationale: यहाँ नैतिक बुराई का बोध है और यह संबोधित संज्ञा ‘सोच’ को विशेषित करता है।
- source_word: יאמר
  choice: सोच
  rationale: प्राप्त इब्रानी रूप कठिन है; यूनानी समानांतर का ἐνθύμημα ‘विचार/युक्ति’ इस प्रसंग में ‘सोच’ का समर्थन करता है।
- source_word: מדוע כן נוצרתי
  choice: तू क्यों रची गई
  rationale: व्यक्तिरूप में संबोधित ‘सोच’ के साथ स्त्रीलिंग और द्वितीय पुरुष रखकर इब्रानी के अलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप दिया गया है; כן को अलग से ‘ऐसी’ कहना हिन्दी में अनावश्यक रूप से भारी पड़ता है।
- source_word: למלא
  choice: भर दे
  rationale: इब्रानी क्रिया का मूल अर्थ ‘भरना’ है; उद्देश्यसूचक रचना के लिए ‘कि ... भर दे’ सहज हिन्दी है।
- source_word: פני תבל
  choice: संसार का मुख
  rationale: इब्रानी बिंब ‘संसार का मुख’ सुरक्षित रखा गया है, यद्यपि हिन्दी में ‘सारा संसार’ अधिक मुहावरेदार विकल्प होता।
- source_word: תרמית
  choice: छल
  rationale: यह धोखे और कपट का संक्षिप्त, स्वाभाविक तथा अर्थपूर्ण हिन्दी पर्याय है।
theological_decisions:
- issue: कठिन इब्रानी יאמר की व्याख्या
  choice: ‘बुरी सोच’ के रूप में संबोधन
  alternative: ‘बुरी उक्ति’ अथवा ‘बुरा साथी’
  rationale: इब्रानी पाठ को सीधे पढ़ने पर यह शब्द कठिन है। यूनानी समानांतर स्पष्टतः ‘बुरा विचार/मनसूबा’ कहता है, जो व्यक्तिरूप संबोधन और आगे के प्रश्न को सुसंगत बनाता है। विकल्प को पादटिप्पणी में पारदर्शी रूप से बताया गया है।
- issue: लמלא और यूनानी καλύψαι का अंतर
  choice: मुख्य पाठ में ‘भर दे’
  alternative: ‘ढक दे’
  rationale: उच्च-विश्वास वाले इब्रानी पाठ में ‘भरना’ स्पष्ट है; यूनानी का ‘ढकना’ वास्तविक पाठांतर है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘बुरी सोच’ सामान्य पाठक के लिए सहज है, जबकि ‘संसार का मुख’ मूल इब्रानी का काव्यात्मक बिंब बचाता है।
