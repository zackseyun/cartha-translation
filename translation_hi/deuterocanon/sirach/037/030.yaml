base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/030.yaml
  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
translation:
  language: hi
  text: बुद्धिमान अपने लिए आनंद से तृप्त होगा,[b] और उसे देखने वाले सभी लोग उसे सुखी कहेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे देखने वाले सभी लोग’ है। अंतिम शब्द का प्रेषित रूप वर्तनी की दृष्टि से अनियमित जान पड़ता है, पर प्रसंग से अर्थ स्पष्ट है।
    reason: textual_variant
  - marker: b
    text: 'यूनानी पाठ में यहाँ एक बहुत भिन्न पंक्ति है: ‘क्योंकि बहुत-से भोजनों में पीड़ा होगी, और पेटूपन पित्तजनित रोग तक जा पहुँचेगा।’ जहाँ काहिरा गनीज़ा में इब्रानी पाठ उपलब्ध है, वहाँ मुख्य पाठ के लिए उसी प्राथमिक साक्ष्य का अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: बुद्धिमान
  rationale: यह पुल्लिंग एकवचन में किसी बुद्धिमान व्यक्ति को सूक्तिपरक ढंग से दर्शाता है; हिन्दी में ‘बुद्धिमान’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לנפשו
  choice: अपने लिए
  rationale: शाब्दिक अर्थ ‘अपने प्राण/स्वयं के लिए’ है। यहाँ נפש पूरे व्यक्ति या स्वयं को दर्शाता है, इसलिए ‘अपने लिए’ प्रतिवर्ती भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ישבע
  choice: तृप्त होगा
  rationale: שבע का मूल भाव भर जाने या संतुष्ट होने का है। ‘तृप्त होगा’ आनंद के साथ सहज बैठता है और इब्रानी की परिपूर्ण संतुष्टि का भाव बनाए रखता है।
- source_word: תענוג
  choice: आनंद
  rationale: शब्द सुख, आनंद या मनोविनोद को दर्शाता है। ‘आनंद’ वर्तमान, dignified हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ויאשרוהו
  choice: उसे सुखी कहेंगे
  rationale: אשר यहाँ किसी को सुखी या भाग्यवान घोषित करने के अर्थ में है, न कि अनिवार्यतः धार्मिक आशीर्वाद देने के अर्थ में।
- source_word: כל רואינו
  choice: उसे देखने वाले सभी लोग
  rationale: प्रेषित रूप की अंतिम वर्तनी अनियमित जान पड़ती है, पर समानांतरता और प्रसंग से अर्थ ‘वे सभी जो उसे देखते हैं’ स्पष्ट है।
