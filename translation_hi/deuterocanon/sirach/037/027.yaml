base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/027.yaml
  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: hi
  text: एक बुद्धिमान मनुष्य अपने ही लिए बुद्धिमान होता है[a]; उसके ज्ञान का फल उसके अपने शरीर पर पड़ता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने प्राण के लिए’; यहाँ आशय ‘अपने लिए’ या ‘अपने जीवन के हित में’ है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू शब्द का अर्थ कुछ प्रसंगों में ‘लाश’ भी हो सकता है, पर यहाँ वह जीवित शरीर अथवा व्यक्ति को दर्शाता है, जिसे अपने ज्ञान का लाभ मिलता है। यूनानी पाठ इस पद में पर्याप्त भिन्न वाक्य देता है: अपने प्राण को परखने और जो उसके लिए बुरा हो, उसे न देने की शिक्षा।'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: और कोई … होता है
  rationale: यह हिब्रू के सरल अस्तित्वसूचक वाक्य को स्वाभाविक हिन्दी में रखता है और प्रसंग में एक अन्य प्रकार के बुद्धिमान व्यक्ति का परिचय देता है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: पुल्लिंग एकवचन रूप को बनाए रखते हुए हिन्दी में सहज और नीतिवचन-संगत शब्द चुना गया है।
- source_word: לְנַפְשׁוֹ
  choice: अपने ही लिए
  rationale: शाब्दिक अर्थ ‘अपने प्राण/जीवन के लिए’ है, पर यहाँ प्रयोग आत्म-संबंधी लाभ का है; ‘अपने ही लिए’ इस भाव को बिना शरीर-आत्मा का तकनीकी भेद जोड़े व्यक्त करता है।
- source_word: יֶחְכָּם
  choice: बुद्धिमान होता है
  rationale: यह कथन के सामान्य, नीतिपरक बल को बनाए रखता है; ‘बुद्धिमानी दिखाता है’ जैसी अतिरिक्त सक्रियता नहीं जोड़ता।
- source_word: פְּרִי
  choice: फल
  rationale: मूल रूपक को सुरक्षित रखते हुए परिणाम अथवा लाभ का स्वाभाविक हिन्दी बोध देता है।
- source_word: דַעְתּוֹ
  choice: उसके ज्ञान
  rationale: דעת का सीधा अर्थ ‘ज्ञान’ है; ज्ञान-साहित्य के प्रसंग में इसमें व्यावहारिक समझ भी निहित हो सकती है, जिसे पादटिप्पणी की आवश्यकता के बिना मूल शब्द के निकट रखा गया है।
- source_word: עַל
  choice: पर
  rationale: मूल के स्थानसूचक/लाभ-सूचक रूपक को सीधे बनाए रखता है।
- source_word: גְוִיָּתוֹ
  choice: उसके अपने शरीर
  rationale: यहाँ जीवित व्यक्ति को अपने ज्ञान का फल मिलने की बात है; ‘लाश’ प्रसंग के विरुद्ध होगा। ‘अपने’ आत्म-संबंधी बल को स्पष्ट करता है।
theological_decisions:
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: 'आत्म-संबंधी अर्थ: ‘अपने ही लिए’'
  alternative: ‘अपने प्राण के लिए’ या ‘अपने जीवन के लिए’
  rationale: कथन का आशय यह है कि बुद्धिमत्ता का लाभ उसी व्यक्ति को मिलता है; ‘आत्मा’ कहने से मूल में अनिवार्य न होने वाला द्वैतवादी अर्थ आ सकता है।
- issue: גְוִיָּה का आशय
  choice: जीवित ‘शरीर’
  alternative: ‘लाश’ या व्यापक अर्थ में ‘व्यक्ति’
  rationale: ज्ञान का फल व्यक्ति के अपने शरीर पर होने का कथन जीवित व्यक्ति के कल्याण को सूचित करता है; मृत्यु-संबंधी अर्थ यहाँ असंगत है।
- issue: हिब्रू और यूनानी पाठ का भेद
  choice: मुख्य अनुवाद प्रमाणित हिब्रू पाठ पर आधारित
  alternative: 'यूनानी समानांतर का अनुवाद: ‘हे पुत्र, अपने जीवन में अपने प्राण को परख…’'
  rationale: दिए गए हिब्रू स्रोत का विश्वास-स्तर उच्च है और वह यूनानी पाठ से पर्याप्त भिन्न है; इसलिए यूनानी को हिब्रू के स्थान पर मिलाया नहीं गया, केवल पाठांतर के रूप में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, नीतिवचन-सदृश शैली रखी गई है। ‘अपने ही लिए’ और ‘अपने शरीर पर’ मूल की कुछ असामान्य, तनावपूर्ण अभिव्यक्ति को सहज बनाते हुए भी उसे मिटाते नहीं हैं।
