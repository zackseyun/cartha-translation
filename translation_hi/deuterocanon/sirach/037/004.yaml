lexical_decisions:
- source_word: מרע אוהב
  choice: बुरा मित्र
  rationale: यह पदबंध मित्र या साथी की भूमिका में बुरे अथवा हानिकारक व्यक्ति को बताता है। सहज आधुनिक हिन्दी में ‘बुरा मित्र’ नैतिक मूल्यांकन और संबंध, दोनों को स्पष्ट रखता है।
- source_word: מביט אל שלחן
  choice: मेज़ की ओर ताकता है
  rationale: ‘ताकता है’ लाभ या भोजन पर लगी दृष्टि का संकेत देता है, जबकि ‘मेज़’ मूल इब्रानी बिंब को बनाए रखता है।
- source_word: בעת מצוקה
  choice: संकट के समय
  rationale: מצוקה तंगी, विपत्ति या संकट की दशा को व्यक्त करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מנגד יעמד
  choice: सामने खड़ा होगा
  rationale: इब्रानी का शाब्दिक अर्थ सामने अथवा विपरीत ओर खड़ा होना है। यूनानी ἀπέναντι भी इसकी पुष्टि करता है। यह अनुवाद दूरी और विरोध—दोनों संभावनाओं को खुला रखता है।
theological_decisions:
- issue: संकट में मित्र की स्थिति
  choice: ‘सामने खड़ा होगा’ द्वारा अस्पष्टता सुरक्षित रखी गई
  alternative: ‘दूर खड़ा रहेगा’ या ‘विरोध में खड़ा होगा’
  rationale: मूल अभिव्यक्ति केवल सहायता से दूर रहने और सक्रिय विरोध करने के बीच निर्णय नहीं करती; इसलिए किसी एक अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
