base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/010.yaml
  text: 'For he too will think for himself: “Why should this fall to him?”[a][b]'
translation:
  language: hi
  text: 'क्योंकि वह भी अपने ही हित का विचार करेगा: “यह उसके हिस्से में क्यों आए?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानी पाठ संक्षिप्त और कुछ कठिन है। यूनानी समानांतर पाठ है: “जो तुम्हें संदेह की दृष्टि से देखता है, उससे सलाह न लो; और जो तुमसे ईर्ष्या करते हैं, उनसे अपनी योजना छिपाए रखो।” इससे यह भाव पुष्ट होता है कि दूसरा व्यक्ति अपने स्वार्थ या दुर्भावना के अनुसार हिसाब लगा रहा है।'
    reason: alternative_reading
  - marker: b
    text: 'या, “क्योंकि वह भी अपने विषय में सोचेगा: ‘यह उस पर क्यों आ पड़े?’” इब्रानी शब्दावली में यह अनिश्चितता है कि अंतिम सर्वनाम सलाह देने वाले व्यक्ति की ओर संकेत करता है या किसी दूसरे व्यक्ति की ओर।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: यह आसपास दी गई चेतावनी का कारण बताता है और ज्ञान-साहित्य की संक्षिप्त तर्क-शैली को बनाए रखता है।
- source_word: גם הוא
  choice: वह भी
  rationale: גם की योगात्मक शक्ति और दूसरे व्यक्ति पर बल, दोनों स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: לנפשך
  choice: अपने ही हित का
  rationale: प्राप्त इब्रानी रूप का शाब्दिक अर्थ ‘तेरे प्राण/अपने लिए’ कठिन है। प्रसंग और यूनानी समानांतर पाठ के आधार पर यहाँ दूसरे व्यक्ति की स्वार्थपूर्ण गणना सम्भावित है; फिर भी पाठ की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: יחשב
  choice: विचार करेगा
  rationale: क्रिया सोचने, हिसाब लगाने या मन में विचार करने को दर्शाती है; यह चयन स्पष्ट है और प्रसंग में निहित गणनात्मक भाव को खुला रखता है।
- source_word: למה זה
  choice: यह ... क्यों
  rationale: इब्रानी प्रश्नवाचक पदबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אליו יפול
  choice: उसके हिस्से में ... आए
  rationale: ‘उस पर/उसकी ओर गिरे’ के रूपक को किसी वस्तु के भाग या हिस्से में आने के अर्थ में स्वाभाविक हिन्दी देता है, जबकि व्यक्ति-सूचक सर्वनाम की अस्पष्टता पादटिप्पणी में सुरक्षित है।
