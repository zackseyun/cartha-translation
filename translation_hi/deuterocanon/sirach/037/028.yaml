base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/028.yaml
  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
translation:
  language: hi
  text: क्योंकि हर चीज़ हर किसी के लिए लाभदायक नहीं होती, और हर व्यक्ति हर चीज़ में आनंद नहीं पाता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इस पद का इब्रानी पाठ कठिन है और यूनानी पाठ से निकटता से मेल नहीं खाता। उसका शाब्दिक अर्थ है: “और एक बुद्धिमान व्यक्ति अपने लोगों के लिए बुद्धिमानी से काम करता है; उसके ज्ञान का फल उनके शरीरों में है।” इस असंगति के कारण मुख्य अनुवाद यहाँ यूनानी साक्ष्य का अनुसरण करता है और इब्रानी पाठ को इस टिप्पणी में दर्ज करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  choice: क्योंकि हर चीज़ हर किसी के लिए लाभदायक नहीं होती
  rationale: यूनानी समानांतर का यह वाक्य प्रसंगानुकूल और स्पष्ट है। συμφέρει का सामान्य अर्थ ‘लाभदायक होना’ है; ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: οὐ πᾶσα ψυχὴ
  choice: हर व्यक्ति ... नहीं
  rationale: यहाँ ψυχή पूरे व्यक्ति के लिए प्रयुक्त है। ‘प्राण’ या ‘आत्मा’ कहने से अनावश्यक मानवशास्त्रीय अर्थ जुड़ सकता था।
- source_word: ἐν παντὶ εὐδοκεῖ
  choice: हर चीज़ से प्रसन्न नहीं होता
  rationale: εὐδοκεῖ प्रसन्न होने या संतोष पाने का भाव देता है। यह अनुवाद व्यापक ἐν παντί को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיֵשׁ חָכָם לְעַמּוֹ יֶחְכָּם
  choice: और कोई बुद्धिमान अपने लोगों के लिए बुद्धिमानी बरतता है
  rationale: मुख्य पाठ में नहीं, बल्कि पाठांतर-संबंधी पादटिप्पणी में इब्रानी साक्ष्य का निकट अनुवाद दिया गया है; इससे חכם/יתחכם की पुनरुक्ति भी बनी रहती है।
- source_word: פְּרִי דַעְתּוֹ בִּגְוִיָתָם
  choice: उसके ज्ञान का फल उनके शरीरों में है
  rationale: इब्रानी पाठ के कठिन अंतिम खंड को पादटिप्पणी में यथासंभव शाब्दिक रखा गया है, बिना उसके अस्पष्ट अर्थ को चुपचाप स्पष्ट किए।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में यूनानी साक्ष्य का अनुवाद और पादटिप्पणी में उपलब्ध इब्रानी पाठ
  alternative: उपलब्ध इब्रानी पंक्ति को मुख्य पाठ बनाना
  rationale: दिया गया इब्रानी पाठ इस पद के यूनानी पाठ से निकटता से मेल नहीं खाता और स्रोत-विवरण भी मामूली असंगति दर्ज करता है। यूनानी पाठ एक पूर्ण, प्रसंगानुकूल वाक्य देता है; फिर भी प्राचीन इब्रानी साक्ष्य को छिपाने के बजाय पादटिप्पणी में निकट अनुवाद सहित सुरक्षित रखा गया है। यह चयन किसी सिद्धान्तगत अर्थ को थोपने के लिए नहीं, बल्कि पाठ-साक्ष्य की वास्तविक अनिश्चितता दिखाने के लिए है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। ‘हर व्यक्ति’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘प्रसन्न नहीं होता’ यूनानी के आनंद/संतोष के भाव को बिना अतिव्याख्या के व्यक्त करता है।
