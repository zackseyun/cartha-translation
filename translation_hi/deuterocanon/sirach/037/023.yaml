base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/023.yaml
  text: A wise man instructs his own people, and the fruits of his understanding are trustworthy.[a][b]
translation:
  language: hi
  text: बुद्धिमान पुरुष अपने ही लोगों को शिक्षा देगा, और उसकी समझ के फल भरोसेमंद होंगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ बचा हुआ इब्रानी पाठ कठिन है और यूनानी पाठ से बहुत अलग है। मुख्य पाठ अधिक स्पष्ट यूनानी साक्ष्य का अनुसरण करता है: “बुद्धिमान पुरुष अपने ही लोगों को शिक्षा देगा, और उसकी समझ के फल भरोसेमंद होंगे।”'
    reason: textual_variant
  - marker: b
    text: 'इब्रानी साक्ष्य में एक अस्पष्ट वाक्यांश मिलता है, जिसका लगभग शाब्दिक रूप है: “हृदय की युक्तियों की जड़/उखाड़ना; चार कंधे(?) खिलेंगे।” शब्दावली अनिश्चित है और पाठ संभवतः बिगड़ा हुआ या अधूरा सुरक्षित हुआ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνὴρ σοφός
  choice: बुद्धिमान पुरुष
  rationale: यूनानी पद स्पष्ट रूप से पुल्लिंग एकवचन है; यह अनुवाद उसके रूप और नीतिवचन-सदृश गरिमा दोनों को बनाए रखता है।
- source_word: τὸν ἑαυτοῦ λαόν
  choice: अपने ही लोगों को
  rationale: λαός का स्वाभाविक अर्थ ‘लोग’ या ‘प्रजा’ है, और ‘ही’ ἑαυτοῦ के आत्मवाचक बल को स्पष्ट करता है।
- source_word: παιδεύσει
  choice: शिक्षा देगा
  rationale: यह यूनानी भविष्यकाल है। ‘शिक्षा देगा’ उसके शैक्षिक अर्थ और काल, दोनों को सुरक्षित रखता है; ‘अनुशासित करेगा’ यहाँ अनावश्यक रूप से कठोर होता।
- source_word: οἱ καρποὶ
  choice: फल
  rationale: बहुवचन रूपक को हिन्दी में सामूहिक ‘फल’ से स्वाभाविक रूप से व्यक्त किया गया है, उसे ‘परिणाम’ जैसे अमूर्त शब्द में नहीं बदला गया।
- source_word: τῆς συνέσεως αὐτοῦ
  choice: उसकी समझ के
  rationale: σύνεσις यहाँ समझ, सूझ-बूझ या विवेक का बोध देता है; ‘समझ’ सामान्य पाठक के लिए स्पष्ट और व्यापक है।
- source_word: πιστοί
  choice: भरोसेमंद
  rationale: यहाँ शब्द उन फलों की विश्वसनीयता बताता है; ‘भरोसेमंद’ आधुनिक हिन्दी में ‘विश्वसनीय’ की अपेक्षा अधिक सहज है।
- source_word: עקרת תחבולות לבב, ארבעה שכמים יפרחו
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: उपलब्ध इब्रानी पाठ अत्यंत दुर्बोध है और प्रसंग में निश्चयपूर्वक अर्थ नहीं देता। इसलिए मुख्य पाठ स्पष्ट प्राचीन यूनानी साक्ष्य का अनुसरण करता है, जबकि इब्रानी को पादटिप्पणी में सुरक्षित रखा गया है।
