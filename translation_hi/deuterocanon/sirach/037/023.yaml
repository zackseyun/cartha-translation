  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। मुख्य पाठ स्पष्ट यूनानी समानांतर पर आधारित है; कठिन इब्रानी पाठ को बिना कृत्रिम समाधान दिए दोनों पादटिप्पणियों में प्रस्तुत किया गया है।
