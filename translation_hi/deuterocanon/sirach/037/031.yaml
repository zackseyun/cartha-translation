base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/031.yaml
  text: A wise man among his people will inherit honor, and his name will endure for everlasting life.
translation:
  language: hi
  text: लोगों के बीच बुद्धिमान मनुष्य सम्मान विरासत में पाएगा, और उसका नाम अनन्त जीवन में बना रहेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका नाम सदा बना रहेगा।” इब्रानी में शाब्दिक रूप से, “उसका नाम अनन्तता के जीवन में बना रहता है।” इसका अर्थ चिरस्थायी स्मरण हो सकता है, और इसमें अनन्त जीवन की प्रतिध्वनि भी सुनाई दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ यहाँ बहुत भिन्न है: “लालच के कारण बहुत-से लोग मर गए, पर जो सचेत रहता है वह जीवन में वृद्धि करेगा।” मुख्य अनुवाद उपलब्ध इब्रानी पाठ का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם עם
  choice: अपने लोगों के बीच बुद्धिमान मनुष्य
  rationale: חכם एक बुद्धिमान व्यक्ति को और עם यहाँ उसके अपने लोगों या समुदाय के बीच उसकी स्थिति को व्यक्त करता है। हिंदी में यह रूप स्वाभाविक रहते हुए पुल्लिंग एकवचन को सुरक्षित रखता है।
- source_word: ינחל
  choice: अधिकारी होगा
  rationale: נחל का मूल भाव विरासत या स्थायी अधिकार के रूप में कुछ पाना है। ‘आदर का अधिकारी होगा’ हिंदी में सहज है और केवल क्षणिक रूप से आदर पाने की अपेक्षा इस ठोस भाव को बेहतर बनाए रखता है।
- source_word: כבוד
  choice: आदर
  rationale: इस ज्ञान-साहित्यिक संदर्भ में כבוד सामाजिक सम्मान और प्रतिष्ठा को सूचित करता है; ‘आदर’ साधारण आधुनिक हिंदी में ‘महिमा’ से अधिक उपयुक्त है।
- source_word: שמו עומד
  choice: उसका नाम ... बना रहेगा
  rationale: शाब्दिक अर्थ ‘उसका नाम खड़ा रहता है’ है। नाम या स्मृति के टिके रहने के लिए ‘बना रहेगा’ स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: בחיי עולם
  choice: अनन्त जीवन तक
  rationale: यह रूप स्रोत के ‘जीवन’ और ‘अनन्तता’ दोनों शब्द-भावों को बचाता है, पर हिंदी में इसे सीधे व्यक्ति के परलोक-संबंधी दावे के रूप में निर्णीत नहीं करता। इसकी संभावित मुहावरेदार व्याख्या पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: בחיי עולם का आशय
  choice: अनन्त जीवन तक
  alternative: सदा के लिए / सर्वदा
  rationale: इब्रानी अभिव्यक्ति स्थायी स्मृति का मुहावरा हो सकती है और अनन्त जीवन की ओर संकेत भी कर सकती है। मुख्य पाठ जीवन-संबंधी भाषा को सुरक्षित रखता है; पाद-टिप्पणी इस तनाव को बिना सुलझाए स्पष्ट करती है।
- issue: इब्रानी और यूनानी पाठ का पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण
  alternative: 'यूनानी पाठ: ‘लालच के कारण बहुत-से लोग मर गए, पर जो सावधान रहता है वह अपना जीवन बढ़ाएगा।’'
  rationale: प्रदत्त इब्रानी साक्ष्य उच्च विश्वसनीयता वाला है और मुख्य अनुवाद का आधार है। काफी भिन्न यूनानी समानांतर को पाठ में मिलाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘बुद्धिमान मनुष्य’ मूल के पुल्लिंग एकवचन को दर्शाता है; ‘आदर का अधिकारी होगा’ विरासत-संबंधी क्रिया के स्थायी प्राप्ति-भाव को स्वाभाविक हिंदी में व्यक्त करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
