  yaml_path: translation/deuterocanon/sirach/037/016.yaml
  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
translation:
  language: hi
  text: अपने काम के लिए व्यर्थ काम करनेवाला[a], और बुराई उत्पन्न करनेवाले के लिए व्यर्थ पहरेदार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इसके स्थान पर है: “और इन सब बातों के विषय में परमप्रधान से प्रार्थना करो कि वह सत्य में तुम्हारा मार्ग सीधा करे।” यहाँ इब्रानी और यूनानी पाठों में बहुत बड़ा अंतर है।'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: कामगार
  rationale: यह संज्ञा काम करनेवाले व्यक्ति को दर्शाती है। ‘कामगार’ ठोस कर्ता का अर्थ बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: שוא
  choice: निष्फल
  rationale: यह शब्द खालीपन, व्यर्थता या निरर्थकता का भाव रखता है। ‘निष्फल’ दोनों समानांतर खंडों में स्वाभाविक रूप से लागू होता है और सूक्तिपरक संक्षिप्तता बनाए रखता है।
- source_word: מלאכתו
  choice: अपने काम
  rationale: संज्ञा कार्य, पेशे या सौंपे गए काम को दर्शाती है। ‘अपने काम’ अधिकारसूचक प्रत्यय को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: שומר
  choice: पहरेदार
  rationale: यह रूप निगरानी या रक्षा करनेवाले को दर्शाता है। ‘पहरेदार’ कामगार के समानांतर एक ठोस व्यक्ति-संज्ञा है।
- source_word: מוציא רע
  choice: बुराई उपजानेवाला
  rationale: इब्रानी का शाब्दिक भाव ‘बुराई बाहर लानेवाला’ है। ‘बुराई उपजानेवाला’ उस व्यापक और कुछ अस्पष्ट भाव को बनाए रखते हुए हिन्दी में अधिक स्वाभाविक है; इसे केवल ‘कुकर्मी’ कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: על
  choice: में / पर
  rationale: पहले खंड में ‘अपने काम में’ और दूसरे में ‘...पर’ प्रसंगानुसार हिन्दी संबंध व्यक्त करते हैं। मूल की संक्षिप्त रचना कठिन है, इसलिए अर्थ को अनावश्यक रूप से विस्तृत नहीं किया गया।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ के बीच मूलभूत अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और पादटिप्पणी में यूनानी पाठ
  alternative: “और इन सब बातों के विषय में परमप्रधान से प्रार्थना करो कि वह सत्य में तुम्हारा मार्ग सीधा करे।”
  rationale: यह साधारण शब्दांतर नहीं, बल्कि पूरी तरह भिन्न पंक्ति है। उपलब्ध इब्रानी को मुख्य पाठ में रखते हुए यूनानी साक्ष्य को पादटिप्पणी में देना पाठगत अनिश्चितता को ईमानदारी से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली रखी गई है। मूल इब्रानी की खंडात्मक समानांतर रचना और अर्थगत कठिनाई को व्याख्यात्मक वाक्य जोड़कर समाप्त नहीं किया गया।
