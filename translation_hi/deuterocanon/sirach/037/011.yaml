base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: hi
  text: वह तुमसे तुम्हारे मार्ग की भलाई के विषय में बात करेगा[a], फिर सामने खड़ा होकर तुम्हारी दुर्दशा देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू संक्षिप्त और कुछ अनिश्चित है। अंतिम पद का अनुवाद “तुम्हारी विपत्ति देखने” या “तुम्हारी दरिद्रता देखने” भी किया जा सकता है। इस पद का यूनानी समानांतर इसके बजाय उन कई प्रकार के लोगों की विस्तृत चेतावनी सुरक्षित रखता है जिनकी सलाह पर भरोसा नहीं करना चाहिए।
    reason: alternative_reading
lexical_decisions:
- source_word: ואמר לך
  choice: वह तुमसे ... बात करेगा
  rationale: אמר सामान्यतः ‘कहना/बोलना’ है। यह चयन सीधे व्यक्तिगत संबोधन को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מטוב דרכך
  choice: तुम्हारे मार्ग की भलाई की
  rationale: हिब्रू पदबंध संक्षिप्त और कुछ अनिश्चित है। यह अनुवाद מן־טוב की कठिनता को अत्यधिक स्पष्ट किए बिना मार्ग के विषय में अनुकूल या प्रशंसात्मक बात कहने का भाव रखता है।
- source_word: דרכך
  choice: तुम्हारे मार्ग
  rationale: דרך का शाब्दिक और रूपक दोनों अर्थ ‘मार्ग’ है; ज्ञान-साहित्य की मूल छवि सुरक्षित रखी गई है।
- source_word: וקם מנגד
  choice: फिर सामने खड़ा होकर
  rationale: מנגד का अर्थ सामने या आमने-सामने की स्थिति में होना है। ‘सामने खड़ा होकर’ स्थान-संबंधी छवि को बनाए रखता है; ‘फिर’ प्रसंगगत क्रम को सहज बनाता है, जबकि स्पष्ट विरोधी संयोजक नहीं जोड़ा गया।
- source_word: להביט
  choice: देखेगा
  rationale: הביט ध्यान से देखने या निहारने को व्यक्त करता है। हिन्दी में ‘देखेगा’ स्वाभाविक है और अगले पद के नकारात्मक संदर्भ में जानबूझकर देखते रहने का भाव ग्रहण कर सकता है।
- source_word: רישך
  choice: तुम्हारी दुर्दशा
  rationale: यह कठिन रूप संभवतः दरिद्रता, अभाव या विपत्ति से संबंधित है। ‘दुर्दशा’ अर्थ-क्षेत्र को पर्याप्त व्यापक रखती है और ‘पतन’ जैसी अधिक व्याख्यात्मक निश्चितता से बचती है।
theological_decisions:
- issue: अल्प-मेल वाले पद में काहाना के संयुक्त काहिरा गनीज़ा हिब्रू पाठ और विस्तृत यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ का अनुवाद उपलब्ध हिब्रू से किया गया है; यूनानी को केवल प्रसंगगत जाँच के रूप में लिया गया है।
  alternative: यूनानी में सुरक्षित उन लोगों की पूरी सूची का अनुवाद करना जिनसे परामर्श नहीं लेना चाहिए।
  rationale: हिब्रू पाठ उपलब्ध और उच्च-विश्वास वाला है, यद्यपि संक्षिप्त तथा अंतिम शब्द कठिन है। इसलिए मुख्य अनुवाद हिब्रू का अनुसरण करता है और पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ज्ञान-साहित्यिक लहजा। ‘मार्ग’ की मूल रूपक-छवि रखी गई है और कठिन अंतिम संज्ञा को ‘दुर्दशा’ द्वारा जानबूझकर व्यापक रखा गया है।
