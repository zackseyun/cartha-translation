  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: hi
  text: व्यापारी से खरीद-बिक्री को लेकर मोल-भाव न कर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “अपने हृदय की सलाह को दृढ़ कर, क्योंकि तेरे लिए उससे अधिक विश्वासयोग्य कोई नहीं है।” यहाँ उपलब्ध हिब्रू पाठ यूनानी परंपरा से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: व्यापारी के साथ
  rationale: עם संगति या व्यवहार का संबंध बताता है, और סוחר व्यापार करने वाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘व्यापारी के साथ’ स्वाभाविक और सटीक है।
- source_word: אל תתגר
  choice: मोल-भाव न कर
  rationale: क्रिया का सामान्य अर्थ विवाद या उलझाव की ओर जा सकता है, पर ‘व्यापारी’ और अगले वाणिज्यिक पदों के संदर्भ में सौदे के लिए मोल-भाव करना सबसे संभावित अर्थ है।
- source_word: ממקנה על ממכר
  choice: खरीद-बिक्री को लेकर
  rationale: מקנה और ממכר क्रमशः अर्जन/खरीद तथा बिक्री से जुड़े वाणिज्यिक पद हैं। यह रूप दोनों को संक्षेप और स्वाभाविक हिन्दी में रखता है, यद्यपि हिब्रू वाक्यांश का ठीक संबंध कुछ कठिन है।
- source_word: ו־
  choice: और न
  rationale: दूसरे समानांतर वाक्यांश पर पहले निषेध का बल जारी रखने के लिए ‘और न’ स्पष्ट हिन्दी रूप है।
- source_word: καὶ βουλὴν καρδίας στήσον
  choice: मुख्य पाठ में नहीं अपनाया; पादटिप्पणी में भिन्न यूनानी पाठ
  rationale: उपलब्ध हिब्रू पाठ इस स्थान पर सुरक्षित है और यूनानी परंपरा से बहुत अलग है; इसलिए मुख्य पाठ हिब्रू का अनुसरण करता है और महत्त्वपूर्ण यूनानी पाठांतर को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: उपलब्ध हिब्रू पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में व्यापार और लेन-देन से संबंधित हिब्रू निषेध का अनुसरण
  alternative: 'यूनानी: ‘अपने हृदय की सम्मति को दृढ़ कर, क्योंकि उससे अधिक विश्वासयोग्य तेरे लिए कोई नहीं है।’'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है, वहाँ उसे मुख्य आधार मानना उचित है। यूनानी कोई छोटा पाठांतर नहीं, बल्कि पूर्णतः भिन्न परंपरा दर्शाता है; अतः उसे छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। एकवचन आदेश के लिए ‘कर’ का प्रयोग संदर्भ की सीधी शिक्षात्मक शैली के अनुरूप है।
