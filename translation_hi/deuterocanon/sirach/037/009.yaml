translation:
  language: hi
  text: सलाहकार से सावधान रह, और पहले ही जान ले कि उसकी ज़रूरत क्या है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “उसका हित क्या है।” इब्रानी शब्द का अर्थ केवल आवश्यकता ही नहीं, बल्कि उसका सरोकार या वह बात भी हो सकता है जो उसे प्रेरित करती है। यूनानी समानांतर इस विचार को अलग ढंग से बढ़ाता है: “और वह सामने खड़ा होकर देखेगा कि तेरे साथ क्या होगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: सलाहकार से
  rationale: מן के साथ יועץ यहाँ उस व्यक्ति के प्रति सावधान रहने का भाव देता है जिससे सलाह ली जाती है; ‘सलाहकार से’ हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: שמור נפשך
  choice: अपने आप को बचाए रख
  rationale: शाब्दिक अर्थ ‘अपने प्राण/स्वयं की रक्षा कर’ है। यहाँ נפש पूरे व्यक्ति को सूचित करता है, इसलिए यह अनुवाद केवल शारीरिक जीवन तक अर्थ को सीमित नहीं करता।
- source_word: ודע לפנים
  choice: और पहले ही जान ले
  rationale: לפנים का क्रियाविशेषणात्मक अर्थ ‘पहले से/अग्रिम रूप से’ है; यह सलाह मानने से पहले विवेकपूर्वक जाँचने का भाव रखता है।
- source_word: מה צרכו
  choice: कि उसका अपना स्वार्थ क्या है
  rationale: צרך आवश्यकता, सरोकार या प्रेरक हित को सूचित कर सकता है। इस प्रसंग में सलाहकार की निजी मंशा जाँचने के लिए ‘अपना स्वार्थ’ सहज हिन्दी है, जबकि पादटिप्पणी अधिक शाब्दिक ‘आवश्यकता’ को सुरक्षित रखती है।
