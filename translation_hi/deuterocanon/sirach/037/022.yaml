  yaml_path: translation/deuterocanon/sirach/037/022.yaml
  text: The beginning of every deed is a word[c][b][a], and the beginning of every work is a thought.
translation:
  language: hi
  text: हर कर्म का आरम्भ एक शब्द[a] है, और हर कार्य का आरम्भ एक विचार[b] है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बात’ अथवा ‘विषय’; इब्रानी शब्द दावार के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘योजना’; इब्रानी शब्द मख़शेवेत विचार, अभिप्राय या योजना का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी साक्षी में यहाँ एक अलग कथन है: ‘कोई ऐसा है जो अपने ही प्राण के लिए बुद्धिमान है, और उसके मुख से उसकी समझ के विश्वसनीय फल प्रकट होते हैं।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ראש
  choice: आरम्भ
  rationale: इस सूक्तिपरक समानांतर रचना में यह उस बात को बताता है जो सबसे पहले आती है। ‘आरम्भ’ स्वाभाविक हिन्दी है और दोनों खंडों की समानता बनाए रखता है।
- source_word: כל
  choice: हर
  rationale: यहाँ इसका प्रयोग वितरणात्मक सामान्यीकरण के लिए हुआ है; ‘हर’ हिन्दी में सूक्ति की सार्वभौमिकता स्पष्ट करता है।
- source_word: מעשה
  choice: कर्म
  rationale: ‘कर्म’ किसी किए गए काम या कृत्य को व्यक्त करता है और दूसरे खंड के פועל से हल्का भेद बनाए रखता है।
- source_word: דבר
  choice: शब्द
  rationale: דבר का अर्थ ‘शब्द’ और ‘बात/विषय’ दोनों हो सकता है। मुख्य पाठ में ‘शब्द’ बाहरी अभिव्यक्ति और भीतरी विचार के समानांतर संबंध को स्पष्ट रखते हुए सम्भावित अर्थ को सुरक्षित करता है।
- source_word: פועל
  choice: कार्य
  rationale: ‘कार्य’ स्वाभाविक आधुनिक हिन्दी है और מעשה के लिए प्रयुक्त ‘कर्म’ से निकट अर्थ रखते हुए भी शब्दगत भेद बनाए रखता है।
- source_word: היא
  choice: है
  rationale: स्त्रीलिंग सर्वनाम מחשבת से मेल खाता है और यहाँ संयोजक क्रिया का काम करता है; हिन्दी में इसे सहज रूप से ‘है’ कहा गया है।
- source_word: מחשבת
  choice: विचार
  rationale: यह शब्द विचार, मनसा या योजना का बोध करा सकता है। ‘विचार’ इसका व्यापक अर्थ बनाए रखता है, जबकि ‘योजना’ अर्थ को अधिक संकीर्ण कर देगी।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में पर्याप्त भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी वाचन का अनुवाद किया गया है और यूनानी के भिन्न कथन को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी: ‘कोई ऐसा है जो अपने ही प्राण के लिए बुद्धिमान है, और उसकी समझ के फल उसके मुख पर भरोसेमंद हैं।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध और विश्वसनीय है, वहाँ उसी को प्राथमिकता दी जाती है। यूनानी पाठ यहाँ निकट अनुवाद नहीं, बल्कि एक अलग कथन प्रस्तुत करता है; इसलिए दोनों को मिलाकर कृत्रिम सामंजस्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूक्तिपरक रखी गई है। ‘कर्म/कार्य’ और ‘शब्द/विचार’ के युग्म इब्रानी समानांतरता तथा निकटार्थक शब्दों के हल्के भेद को बनाए रखते हैं।
