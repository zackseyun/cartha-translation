base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/018.yaml
  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: hi
  text: परन्तु जिसका हृदय तुम्हारे हृदय के समान है[a], यदि तुम ठोकर खाओ, तो उस पर भी असर पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “उसका हृदय तुम्हारे हृदय के समान है।” इसका अर्थ “जो तुम्हारे समान सोचता है” भी हो सकता है, पर इब्रानी रूपक को बनाए रखने के लिए “हृदय” रखा गया है।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी की अंतिम पंक्ति संक्षिप्त है; शाब्दिक रूप से: “यदि तुम ठोकर खाओ, तो वह उस तक भी पहुँचेगा।” इब्रानी में यह स्पष्ट नहीं है कि क्या उस तक पहुँचेगा। आशय सम्भवतः यह है कि तुम्हारी चूक या विपत्ति का प्रभाव उस व्यक्ति पर भी पड़ेगा।'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: परन्तु
  rationale: यह पिछले परामर्श के साथ विरोध या सीमा का संकेत देता है; गरिमापूर्ण आधुनिक हिन्दी में ‘परन्तु’ इस संक्षिप्त संयोजक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עם לבבו כלבבך
  choice: जिसका हृदय तुम्हारे हृदय के समान है
  rationale: इब्रानी का शाब्दिक भाव ‘उसका हृदय तुम्हारे हृदय के समान’ है। हिन्दी वाक्य-रचना के लिए व्यक्ति को संबंधवाचक उपवाक्य में व्यक्त किया गया और ‘हृदय’ को बनाए रखा गया, क्योंकि यहाँ यह केवल भावना नहीं, बल्कि भीतरी प्रवृत्ति और अभिप्राय को भी दर्शाता है।
- source_word: אם תכשל
  choice: यदि तुम ठोकर खाओ
  rationale: क्रिया ठोकर खाने या लड़खड़ाने का रूपक रखती है और नैतिक अथवा व्यावहारिक चूक—दोनों की सम्भावना खुली छोड़ती है।
- source_word: יגיע אליו
  choice: वह बात उस तक भी पहुँचेगी
  rationale: इब्रानी में कर्ता व्यक्त नहीं है और मूल अर्थ किसी चीज़ के उस व्यक्ति तक पहुँचने का है। ‘वह बात’ हिन्दी में आवश्यक संकेत देता है, पर परिणाम की ठीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: לב/לבב का मानवशास्त्रीय अर्थ
  choice: हृदय
  alternative: मन; भीतरी व्यक्ति
  rationale: ‘हृदय’ इब्रानी के व्यापक अर्थ—विचार, इच्छा, प्रवृत्ति और अभिप्राय—को बाइबलीय रूपक सहित सुरक्षित रखता है; इसे केवल ‘मन’ कहना अर्थ को संकुचित कर सकता है।
- issue: יגיע אליו में निहित कर्ता और परिणाम
  choice: वह बात उस तक भी पहुँचेगी
  alternative: वह भी उससे प्रभावित होगा; तुम्हारी विपत्ति उसे भी प्रभावित करेगी
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त है और यह स्पष्ट नहीं करता कि वास्तव में क्या उस तक पहुँचेगा। चुना हुआ पाठ उस अस्पष्टता को बनाए रखते हुए हिन्दी में समझने योग्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यीय स्तर रखा गया है। ‘ठोकर खाना’ और ‘हृदय’ जैसे परिचित रूपकों से मूल इब्रानी की अर्थगत खुलावट सुरक्षित रहती है। यूनानी समानांतर का पाठ इस इब्रानी पंक्ति से काफी भिन्न है, इसलिए अनुवाद में उच्च-विश्वास वाले इब्रानी पाठ को प्रधानता दी गई है।
