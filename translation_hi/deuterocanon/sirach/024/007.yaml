base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/007.yaml
  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: hi
  text: इन सबके बीच मैंने विश्राम की जगह[a] खोजी, और किसकी विरासत में मैं ठहरूँगी?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्राम”; यूनानी संज्ञा विश्राम या चैन का अर्थ दे सकती है, पर यहाँ ठहरने के अगले उल्लेख के कारण विश्राम की जगह का भाव सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “डेरा डालूँगी”; यूनानी क्रिया रात बिताने, ठहरने या शिविर लगाने का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: इन सबके बीच
  rationale: सम्बन्धवाचक अर्थ में μετά के साथ सम्बन्धकारक यहाँ उन सभी लोगों या क्षेत्रों के बीच स्थान खोजने का भाव देता है; इसे केवल कालक्रमसूचक ‘इन सबके बाद’ समझना संदर्भ में कम उपयुक्त है।
- source_word: ἀνάπαυσιν
  choice: विश्राम की जगह
  rationale: संज्ञा का मूल अर्थ ‘विश्राम’ है, पर ठहरने के स्थान से जुड़ा अगला प्रश्न यहाँ स्थानवाचक भाव को प्रमुख बनाता है।
- source_word: ἐζήτησα
  choice: मैंने ... खोजी
  rationale: ζητέω के भूतकालीन अर्थ ‘खोजना’ को सहज और सीधी हिन्दी में व्यक्त करता है।
- source_word: κληρονομίᾳ
  choice: विरासत में
  rationale: κληρονομία विरासत या बाँटकर मिले अधिकार-क्षेत्र को सूचित कर सकता है। ‘विरासत’ बाइबलीय उत्तराधिकार और निर्धारित भाग—दोनों की अनुगूँज बनाए रखता है।
- source_word: τίνος
  choice: किसकी
  rationale: सम्बन्धकारक प्रश्नवाचक सर्वनाम यहाँ विरासत के स्वामी के विषय में पूछता है; ‘किसकी’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: αὐλισθήσομαι
  choice: मैं ठहरूँगी
  rationale: क्रिया रात बिताने, ठहरने या डेरा डालने का अर्थ दे सकती है। ‘ठहरूँगी’ आधुनिक हिन्दी में स्वाभाविक है और विश्राम की जगह खोजने के समानान्तर भी बैठता है। स्त्रीलिंग रूप वक्ता के रूप में व्यक्तित्व-प्राप्त बुद्धि के अनुरूप है।
theological_decisions:
- issue: व्यक्तित्व-प्राप्त बुद्धि का ठहरने की जगह खोजना
  choice: बुद्धि को विश्राम की जगह खोजते और यह पूछते हुए प्रस्तुत किया गया है कि वह किसकी विरासत में ठहरेगी; विरासत की पहचान इस पद में स्पष्ट नहीं की गई।
  alternative: मुख्य पाठ में ही विरासत को इस्राएल बताना, या कथन को केवल लोगों के बीच स्वीकृति पाने का अमूर्त रूप देना।
  rationale: यूनानी पाठ स्वयं व्यक्तित्व-प्राप्त बुद्धि की वाणी और विरासत की भाषा को बनाए रखता है, जबकि आगे का संदर्भ उसकी पहचान को अधिक स्पष्ट करता है। इसलिए अनुवाद को इस पद में उस तनाव को समय से पहले नहीं सुलझाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विरासत’ बाइबलीय अनुगूँज को बनाए रखता है, जबकि ‘ठहरूँगी’ अनावश्यक सैन्य भाव से बचते हुए यूनानी क्रिया की निवासगत ठोसता व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
