  yaml_path: translation/deuterocanon/sirach/024/010.yaml
  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: hi
  text: पवित्र तम्बू में मैंने उसके सामने पवित्र सेवा की[a], और इस प्रकार मैं सिय्योन में स्थापित हुई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र निवास-तम्बू में, उसकी उपस्थिति में, मैंने पवित्र सेवा की।”
    reason: ‘तम्बू’, ‘सामने’ और उपासना-संबंधी सेवा के लिए सम्भव अधिक व्याख्यात्मक शब्दावली।
  - marker: b
    text: या, “और इस प्रकार सिय्योन में मुझे दृढ़ किया गया।”
    reason: ἐστηρίχθην के निष्क्रिय और दृढ़ किए जाने के भाव को अधिक प्रत्यक्ष रूप से दिखाने वाला अनुवाद।
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  choice: पवित्र तम्बू
  rationale: σκηνή का मूल अर्थ तम्बू या निवास-तम्बू है। ‘पवित्र तम्बू’ यूनानी के ठोस उपासना-संबंधी बिंब को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह यूनानी पदबंध का सीधा और स्वाभाविक रूप है; इससे ‘उसके’ का संदर्भ प्रसंग के अनुसार खुला रहता है।
- source_word: ἐλειτούργησα
  choice: मैंने पवित्र सेवा की
  rationale: λειτουργέω यहाँ उपासना-स्थल में की जाने वाली पवित्र सेवा का अर्थ रखता है। यह अनुवाद उस धार्मिक भाव को बनाए रखता है, पर वक्ता को किसी विशिष्ट याजकीय पद से नहीं जोड़ता।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पहले कथन को अगले परिणाम से जोड़ता है और यूनानी की रीति अथवा परिणाम-सूचक कड़ी को स्पष्ट रखता है।
- source_word: ἐστηρίχθην
  choice: मैं स्थापित हुई
  rationale: निष्क्रिय क्रिया का अर्थ स्थिर या दृढ़ रूप से स्थापित किया जाना है। ‘स्थापित हुई’ हिन्दी में स्वाभाविक है और व्यक्तिरूप में बोलती बुद्धि के स्त्रीलिंग प्रसंग के अनुरूप है।
- source_word: Σειὼν
  choice: सिय्योन
  rationale: यह हिन्दी बाइबलीय परंपरा में इस स्थान-नाम का प्रचलित और पहचाना जाने वाला रूप है।
theological_decisions:
- issue: पवित्र स्थान में बुद्धि की सेवा का उपासना-संबंधी अर्थ
  choice: ‘पवित्र सेवा की’ कहा गया है।
  alternative: ‘सेवा की’ या ‘याजकीय सेवा की’
  rationale: यूनानी क्रिया में पवित्र अथवा उपासना-संबंधी सेवा का भाव है, पर पाठ वक्ता को स्पष्ट रूप से कोई याजकीय पद नहीं देता। चुना हुआ रूप इस धार्मिक अर्थ को बचाता है और अनावश्यक रूप से उसे संकीर्ण नहीं करता।
- issue: व्यक्तिरूप बुद्धि का व्याकरणिक लिंग
  choice: ‘मैं स्थापित हुई’
  alternative: ‘मुझे स्थापित किया गया’
  rationale: अध्याय में वक्ता व्यक्तिरूप बुद्धि है, जो हिन्दी में स्त्रीलिंग है। यह रूप प्रसंग को स्वाभाविक बनाता है; विकल्प यूनानी के निष्क्रिय भाव को अधिक स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तम्बू’ ठोस बिंब को बनाए रखता है; ‘पवित्र सेवा’ उपासना-संबंधी अर्थ स्पष्ट करती है। वाक्य में अनावश्यक विराम नहीं दिए गए, जिससे यूनानी की प्रवाहपूर्ण संरचना हिन्दी में बनी रहे।
