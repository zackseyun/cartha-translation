translation:
  language: hi
  text: टेरेबिन्थ वृक्ष[a] के समान मैंने अपनी डालियाँ फैलाईं[b], और मेरी डालियाँ महिमा और अनुग्रह की डालियाँ हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘टेरेबिन्थ’ नामक पिस्ता-कुल का एक बड़ा वृक्ष है; कुछ अनुवाद इसे अधिक सामान्य रूप से ‘बलूत’ कहते हैं।
    reason: cultural_note
  - marker: b
    text: या, “अपनी डालियाँ दूर तक बढ़ाईं।”
    reason: lexical_alternative
  - marker: c
    text: “अनुग्रह” का अर्थ यहाँ “कृपा,” “शोभा” या “मनोहरता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τερέβινθος
  choice: पिस्ता-वृक्ष
  rationale: यूनानी में एक विशिष्ट वृक्ष, टेरेबिन्थ, का नाम है। आधुनिक हिन्दी में केवल लिप्यंतरण अपेक्षाकृत अस्पष्ट होगा; ‘पिस्ता-वृक्ष’ उसके वनस्पतीय संबंध और वृक्ष-चित्र को सामान्य पाठक के लिए अधिक बोधगम्य रखता है। पादटिप्पणी सटीक नाम स्पष्ट करती है।
- source_word: ἐξέτεινα
  choice: फैलाईं
  rationale: यह क्रिया बाहर की ओर बढ़ाने या फैलाने का भाव देती है; डालियों के साथ ‘फैलाईं’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: κλάδους / κλάδοι
  choice: डालियाँ
  rationale: दोनों स्थानों पर एक ही शब्द रखकर यूनानी की काव्यात्मक पुनरुक्ति सुरक्षित की गई है। ‘शाखाएँ’ की अपेक्षा ‘डालियाँ’ साधारण पाठकों के लिए अधिक सहज है।
- source_word: δόξης
  choice: महिमा
  rationale: यह δόξα के ऊँचे बाइबलीय भाव को बनाए रखता है और उसे केवल दृश्य शोभा तक सीमित नहीं करता।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: χάρις में कृपा, अनुकूलता और मनोहरता के अर्थ संभव हैं। ‘अनुग्रह’ इसका प्रमुख बाइबलीय अर्थ बनाए रखता है, जबकि पादटिप्पणी ‘कृपा’ और ‘शोभा’ की अर्थ-संभावना बताती है।
theological_decisions:
- issue: बुद्धि का वृक्ष-सदृश काव्यात्मक आत्म-वर्णन
  choice: रूपक और ‘डालियाँ’ की पुनरुक्ति को सीधे बनाए रखना
  alternative: ‘मेरी डालियाँ महिमामय और मनोहर हैं’ जैसे विशेषणात्मक रूप में अर्थ खोल देना
  rationale: यूनानी में κλάδοι की स्पष्ट पुनरुक्ति और ‘महिमा तथा अनुग्रह की डालियाँ’ वाला संबंधवाचक विन्यास है। इसे बनाए रखने से काव्यात्मक बल सुरक्षित रहता है और व्याख्या अनावश्यक रूप से निश्चित नहीं होती।
- issue: χάριτος की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘अनुग्रह’
  alternative: ‘कृपा’, ‘शोभा’ या ‘मनोहरता’
  rationale: संदर्भ में आकर्षकता और हितकारी कृपा दोनों की छाया संभव है। ‘अनुग्रह’ इस तनाव को काफी हद तक बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। उपमा को यूनानी शब्दक्रम के निकट आरम्भ में रखा गया है। ‘डालियाँ’ की तीन बार पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है; मुख्य पाठ में वृक्ष की पहचान बोधगम्य बनाई गई है और अधिक सटीक यूनानी नाम पादटिप्पणी में दिया गया है।
