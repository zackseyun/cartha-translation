base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/031.yaml
  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: hi
  text: मैंने कहा, “मैं अपने बाग को सींचूँगा और अपनी क्यारी[a] को पानी से तर कर दूँगा।” और देखो, मेरी सिंचाई की नाली नदी बन गई, और मेरी नदी समुद्र बन गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्यारी’ से आशय हरियाली या फसल उगाने के लिए तैयार किए गए छोटे भूखंड से है।
    reason: lexical_alternative
  - marker: b
    text: चित्र एक छोटी सिंचाई-नाली से नदी और फिर समुद्र तक बढ़ता है और असाधारण वृद्धि को व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ποτιῶ
  choice: सींचूँगा
  rationale: बाग को पानी देने के कृषि-संदर्भ में यह स्वाभाविक और सटीक हिन्दी है।
- source_word: κῆπον
  choice: बाग
  rationale: κῆπος का सामान्य अर्थ बाग या उद्यान है; ‘बाग’ आधुनिक पाठक के लिए सहज है और खेती की छवि बनाए रखता है।
- source_word: μεθύσω
  choice: पानी से तर कर दूँगा
  rationale: क्रिया का शाब्दिक संबंध मतवाला करने या भरपूर पिलाने से है, पर यहाँ पानी से पूरी तरह भिगो देने का रूपक है; यह अनुवाद उसकी प्रचुरता को बिना मदिरा-संबंधी भ्रम के व्यक्त करता है।
- source_word: πρασιάν
  choice: क्यारी
  rationale: यह हरियाली या फसल उगाने के लिए तैयार की गई छोटी क्यारी अथवा भूखंड को दर्शाता है; ‘क्यारी’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: अचानक हुए आश्चर्यजनक परिवर्तन की ओर ध्यान खींचने वाली यूनानी अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: διῶρυξ
  choice: सिंचाई की नाली
  rationale: यह खोदी गई जलधारा या नहर को दर्शाता है। ‘सिंचाई की नाली’ उसके आरंभिक छोटे आकार और कृषि-संदर्भ को स्पष्ट करती है, जिससे नदी और समुद्र तक बढ़ने की छवि उभरती है।
- source_word: ποταμόν
  choice: नदी
  rationale: यह शब्द का सामान्य अर्थ है और छोटी सिंचाई-नाली से बड़े प्रवाह में वृद्धि को व्यक्त करता है।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: यह सामान्य और सटीक अर्थ है; यूनानी पाठ किसी विशिष्ट समुद्र की पहचान नहीं करता।
theological_decisions:
- issue: ज्ञान की शिक्षा के असाधारण विस्तार को सिंचाई के रूपक से व्यक्त करना
  choice: मुख्य पाठ में कृषि और जल का ठोस रूपक ज्यों का त्यों रखा गया है, उसका धर्मवैचारिक अर्थ स्पष्ट करके नहीं जोड़ा गया।
  alternative: इसे राष्ट्रों में ज्ञान के प्रसार या पवित्र शिक्षा के विस्तार के रूप में खुलकर समझाना।
  rationale: पद स्वयं रूपक प्रस्तुत करता है, पर उसका निश्चित अर्थ नहीं खोलता; इसलिए अनुवाद उसकी सार्थक अस्पष्टता और व्यापक व्याख्या की संभावना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ कथन की जीवंतता बनाए रखता है; ‘सिंचाई की नाली’ से नदी और समुद्र तक बढ़ती हुई मूल छवि को स्पष्ट करता है।
