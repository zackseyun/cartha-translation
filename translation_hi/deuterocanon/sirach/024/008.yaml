base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/008.yaml
  text: Then the Creator of all commanded me[a], and the one who created me pitched my tent and said, “Dwell in Jacob[c][b], and receive your inheritance in Israel.”
translation:
  language: hi
  text: तब सबके सृष्टिकर्ता ने मुझे आज्ञा दी, और जिसने मेरी सृष्टि की, उसने मेरा तम्बू गाड़ा[a] और कहा, “याकूब में निवास कर, और इस्राएल में अपनी विरासत प्राप्त कर[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा निवास-तम्बू खड़ा किया।” यूनानी में तम्बू को गाड़ने या दृढ़ता से स्थापित करने का ठोस चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएल में विरासत पा” अथवा “इस्राएल में तुझे भाग दिया जाए।” यूनानी क्रिया विरासत मिलने और भाग आवंटित किए जाने—दोनों का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατό μοι
  choice: मुझे आज्ञा दी
  rationale: ἐντέλλομαι का सामान्य अर्थ आज्ञा देना है; यह दैवी आदेश की स्पष्टता और बल बनाए रखता है।
- source_word: ὁ κτίστης ἁπάντων
  choice: सबके सृष्टिकर्ता
  rationale: κτίστης सृष्टिकर्ता को और ἁπάντων समस्त सृष्टि के व्यापक क्षेत्र को व्यक्त करता है।
- source_word: ὁ κτίσας με
  choice: जिसने मेरी सृष्टि की
  rationale: कृदन्त पदबंध को स्पष्ट रखते हुए पहले खंड के साथ समानांतरता और ज्ञान के सृजित होने की बात सुरक्षित रखी गई है।
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: उसने मेरा तम्बू गाड़ा
  rationale: καταπήγνυμι तम्बू को दृढ़ता से गाड़ने या खड़ा करने और σκηνή तम्बू को दर्शाता है; यह ठोस निवास-चित्र को बनाए रखता है।
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: याकूब में निवास कर
  rationale: κατασκηνόω का आशय डेरा डालकर बसना या निवास करना है। सहज हिन्दी के लिए ‘निवास कर’ चुना गया, जबकि निकटवर्ती तम्बू का चित्र मूल बिंब बनाए रखता है।
- source_word: κατακληρονομήθητι
  choice: अपना विरासत का भाग पा
  rationale: निष्क्रिय आदेशात्मक रूप विरासत अथवा आवंटित भाग प्राप्त करने का भाव रखता है। ‘विरासत का भाग पा’ उस आवंटन-भाव को साधारण ‘अधिकार कर’ से अधिक स्पष्ट रखता है।
- source_word: ἐν Ἰσραήλ
  choice: इस्राएल में
  rationale: ἐν का सीधा अर्थ ‘में’ है और इससे याकूब/इस्राएल की समानांतर रचना बनी रहती है।
theological_decisions:
- issue: व्यक्तिरूप ज्ञान का परमेश्वर से संबंध
  choice: ज्ञान की स्त्रीलिंग प्रथम-पुरुष वाणी और उसके सृजित होने—दोनों को स्पष्ट रखा गया है।
  alternative: ज्ञान को अमूर्त सिद्धांत की तरह प्रस्तुत करना, अथवा बाद की किसी विशिष्ट मसीही पहचान को पद में जोड़ना।
  rationale: यूनानी पाठ ज्ञान को सजीव वक्ता के रूप में दिखाता है, पर साथ ही उसे सबके सृष्टिकर्ता द्वारा सृजित और आज्ञापित बताता है। अनुवाद इस तनाव को बिना doctrinal विस्तार के सुरक्षित रखता है।
- issue: निवास और विरासत की छवियाँ
  choice: ‘तम्बू गाड़ा’, ‘निवास कर’ और ‘विरासत का भाग पा’ द्वारा ठोस निवास तथा आवंटन की दोनों छवियाँ रखी गई हैं।
  alternative: ‘निवासस्थान स्थापित किया’ जैसे अमूर्त शब्द या ‘मन्दिर/पवित्र तम्बू’ जैसी अधिक उपासना-संबंधी शब्दावली।
  rationale: मूल में तम्बू का स्पष्ट बिंब है, पर वह किसी विशिष्ट संस्थागत अथवा सम्प्रदायगत अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘तम्बू’ ठोस बिंब को बचाता है; ‘डेरा’ की अपेक्षा यह σκηνή के लिए अधिक औपचारिक और बाइबिलीय होते हुए भी सामान्य पाठकों के लिए स्पष्ट है। आज्ञाएँ स्त्रीलिंग एकवचन वक्ता ‘ज्ञान’ को संबोधित हैं, किंतु हिन्दी रूपों में अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
