  text: Wisdom will praise herself[c][b][a], and in the midst of her people she will boast.
translation:
  language: hi
  text: बुद्धि अपनी ही प्रशंसा करेगी[a], और अपने लोगों के बीच अपनी बड़ाई करेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राण की” या “अपनी आत्मा की”; यहाँ यूनानी पद आत्मवाचक अर्थ, “अपनी ही,” में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गर्व करेगी” अथवा “अपने गौरव का बखान करेगी।” यूनानी क्रिया सार्वजनिक गौरव-प्रकटन या शेखी बघारने, दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ σοφία
  choice: बुद्धि
  rationale: यूनानी में यह स्त्रीलिंग है और पूरे प्रसंग में मानवीकृत वक्ता के रूप में सामने आती है; हिन्दी में स्त्रीलिंग क्रियाओं द्वारा यह व्यक्तित्व स्पष्ट रहता है।
- source_word: αἰνέσει
  choice: प्रशंसा करेगी
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक अर्थ ‘प्रशंसा करेगी’ है।
- source_word: ψυχὴν αὐτῆς
  choice: अपनी ही
  rationale: शाब्दिक रूप ‘अपने प्राण/अपनी आत्मा’ है, पर यहाँ यह सामी प्रभाव वाला आत्मवाचक प्रयोग हो सकता है; ‘अपनी ही प्रशंसा’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: ἐν μέσῳ λαοῦ αὐτῆς
  choice: अपने लोगों के बीच
  rationale: यह स्थानसूचक अर्थ और स्पष्ट स्वामित्व दोनों बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: καυχήσεται
  choice: अपना गौरव बखानेगी
  rationale: क्रिया में सार्वजनिक रूप से अपने गौरव की घोषणा करने या शेखी बघारने, दोनों की अर्थ-छाया संभव है; यह चयन संदर्भ में गरिमापूर्ण है, जबकि विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘बुद्धि’ को स्त्रीलिंग व्यक्तिगत कर्ता के रूप में बनाए रखा गया है।
  alternative: इसे केवल अमूर्त गुण मानकर व्यक्तित्व को कम स्पष्ट करना।
  rationale: यूनानी व्याकरण और अध्याय की साहित्यिक प्रस्तुति बुद्धि को स्त्री-वक्ता के रूप में सामने रखते हैं; अनुवाद इस तनाव को किसी विशिष्ट धर्मसैद्धांतिक पहचान में बदले बिना सुरक्षित रखता है।
- issue: ψυχὴν αὐτῆς का आत्मवाचक अथवा शाब्दिक अर्थ
  choice: मुख्य पाठ में आत्मवाचक अर्थ ‘अपनी ही’ लिया गया है।
  alternative: ‘अपने प्राण की’ या ‘अपनी आत्मा की’।
  rationale: संदर्भ में यह सामी आत्मवाचक मुहावरा हो सकता है, पर शाब्दिक संभावना पादटिप्पणी में रखी गई है ताकि वास्तविक भाषिक अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘अपना गौरव बखानेगी’ सार्वजनिक आत्म-घोषणा की काव्यात्मक ध्वनि रखता है; पादटिप्पणियाँ आत्मवाचक मुहावरे और καυχήσεται की अर्थ-सीमा को सुरक्षित रखती हैं।
