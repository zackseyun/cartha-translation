lexical_decisions:
- source_word: μήτηρ
  choice: माता
  rationale: यह शब्द सीधे ‘माता’ का अर्थ देता है। व्यक्तिरूप में बोलती हुई प्रज्ञा के पारिवारिक रूपक को बनाए रखने के लिए ‘स्रोत’ या ‘उद्गम’ की अपेक्षा ‘माता’ अधिक उपयुक्त है।
- source_word: καλῆς
  choice: सुंदर
  rationale: καλός में सुंदरता के साथ भलाई और श्रेष्ठता का भाव भी हो सकता है। ‘सुंदर’ मूल की काव्यात्मकता बनाए रखता है; अन्य नैतिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: ἀγάπη का यहाँ स्वाभाविक और सीधा हिन्दी प्रतिशब्द ‘प्रेम’ है।
- source_word: φόβου
  choice: भय
  rationale: φόβος का मूल अर्थ ‘भय’ है। प्रज्ञा-साहित्य में इसमें श्रद्धापूर्ण भय का भाव हो सकता है, पर मूल यूनानी उसे केवल ‘श्रद्धा’ तक सीमित नहीं करता।
- source_word: γνώσεως
  choice: ज्ञान
  rationale: γνῶσις का सीधा अर्थ ‘ज्ञान’ है; ‘समझ’ की अपेक्षा यह मूल शब्द के अधिक निकट है।
- source_word: ἁγίας
  choice: पवित्र
  rationale: ἅγιος के लिए ‘पवित्र’ स्वाभाविक बाइबलीय शब्द है और इसके धार्मिक आशय को बनाए रखता है।
- source_word: ἐλπίδος
  choice: आशा
  rationale: इस प्रसंग में ἐλπίς का स्वाभाविक अर्थ ‘आशा’ है; ‘अपेक्षा’ अपेक्षाकृत निर्बल और कम उपयुक्त होगा।
theological_decisions:
- issue: प्रज्ञा-साहित्य में φόβου का आशय
  choice: भय
  alternative: श्रद्धापूर्ण भय; श्रद्धा
  rationale: प्रज्ञा-साहित्य में ‘भय’ प्रायः परमेश्वर के प्रति श्रद्धायुक्त भय को दर्शाता है। फिर भी यहाँ यूनानी पाठ केवल φόβου कहता है, इसलिए ‘भय’ मूल की व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘माता’ व्यक्तिरूप प्रज्ञा के काव्यात्मक रूपक को बनाए रखता है। यूनानी की बार-बार आने वाली संयोजक रचना को स्वाभाविक हिन्दी सूची में बदला गया है, बिना अर्थ घटाए।
