translation:
  language: hi
  text: मेरे पास आओ, मेरी चाह रखनेवालो,[a] और मेरे फलों[b] से भर जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी उत्कट चाह रखनेवालो।’ यूनानी कृदन्त प्रबल इच्छा व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी उपज’ या ‘मेरी पैदावार।’ यूनानी शब्द का अर्थ उत्पन्न वस्तु या उपज है; आस-पास बुद्धि को फलदायी वनस्पति के रूप में चित्रित किए जाने के कारण यहाँ ‘फलों’ शब्द चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: मेरे पास आओ
  rationale: यह बहुवचन आज्ञार्थक निमंत्रण बुद्धि के निकट आने को कहता है। ‘मेरे पास आओ’ आधुनिक हिन्दी में स्वाभाविक है और गति का अनावश्यक विस्तार नहीं करता।
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: मेरी लालसा रखनेवालो
  rationale: यूनानी कृदन्त प्रबल इच्छा या उत्कंठा व्यक्त करता है। ‘लालसा रखनेवालो’ इस तीव्रता को बनाए रखते हुए सम्बोधन के रूप में स्वाभाविक है।
- source_word: γενημάτων
  choice: फलों
  rationale: γένημα का अर्थ उत्पन्न हुई वस्तु, उपज या फल हो सकता है। आस-पास बुद्धि को फलदायी वनस्पति के रूप में चित्रित किए जाने के कारण ‘फलों’ से काव्यात्मक बिंब सुरक्षित रहता है।
- source_word: ἐμπλήσθητε
  choice: भर जाओ
  rationale: यह अओरिस्ट निष्क्रिय आज्ञार्थक बहुवचन है। ‘भर जाओ’ यूनानी रूप और खुले रूपक को बनाए रखता है; ‘तृप्त हो जाओ’ अर्थ को अधिक संकुचित कर देता।
theological_decisions:
- issue: मानवीकृत बुद्धि का प्रथम-पुरुष निमंत्रण और फल का रूपक
  choice: बुद्धि की वाणी और ‘मेरे फलों’ के रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘फलों’ को मुख्य पाठ में स्पष्ट रूप से बुद्धि की शिक्षाएँ, वरदान या लाभ कहना।
  rationale: यूनानी पाठ मानवीकृत बुद्धि को बोलते हुए प्रस्तुत करता है, पर फलों का तात्पर्य स्पष्ट नहीं करता। अनुवाद उस काव्यात्मक और धर्मवैचारिक खुलेपन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। सम्बोधन ‘रखनेवालो’ सामान्य पाठक के लिए स्पष्ट है; ‘भर जाओ’ मूल के निष्क्रिय आज्ञार्थक और रूपक दोनों को सुरक्षित रखता है।
