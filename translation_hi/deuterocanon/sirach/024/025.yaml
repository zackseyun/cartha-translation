  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: hi
  text: वह पीशोन के समान बुद्धि से भर देता है, और नई उपज के दिनों में दजला के समान।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नई उपज के दिनों में’ का अर्थ संभवतः ‘नई बढ़वार के दिनों में’ या अधिक शाब्दिक रूप से ‘नई वस्तुओं के दिनों में’ भी हो सकता है; यूनानी वाक्यांश कठिन है।
    reason: lexical_alternative
  - marker: b
    text: 'दूसरे खंड में क्रिया यूनानी में दोहराई नहीं गई है। अर्थ को स्पष्ट करके अनुवाद किया जा सकता है: ‘वह पीशोन के समान, और नई उपज के दिनों में दजला के समान, बुद्धि से भर देता है।’'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: वह ... भर देता है
  rationale: वर्तमान कृदन्त का सक्रिय, प्रचुरता-सूचक अर्थ रखा गया है। यूनानी में किसे भरा जाता है, यह स्पष्ट नहीं कहा गया; इसलिए हिन्दी में भी कोई कर्म नहीं जोड़ा गया।
- source_word: ὡς Φισὼν
  choice: पीशोन के समान
  rationale: नदी के पारंपरिक नाम का सीधा लिप्यंतरण और उपमा का स्वाभाविक हिन्दी रूप।
- source_word: σοφίαν
  choice: बुद्धि से
  rationale: σοφία का मानक अर्थ; ‘भर देना’ के साथ हिन्दी में करण कारक स्वाभाविक है।
- source_word: ὡς Τίγρις
  choice: दजला के समान
  rationale: टिग्रिस नदी के लिए आधुनिक हिन्दी में प्रचलित नाम ‘दजला’ चुना गया है।
- source_word: ἐν ἡμέραις νέων
  choice: नई उपज के दिनों में
  rationale: नपुंसकलिंग बहुवचन νέων का आशय नई उपज या नई फसल हो सकता है; यह रूप ‘पहली उपज’ जैसा अधिक विशिष्ट धार्मिक अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: मानवीकृत बुद्धि और पद का निहित कर्ता
  choice: ‘बुद्धि’ को सामान्य संज्ञा के रूप में रखा और कर्ता के लिए केवल ‘वह’ कहा
  alternative: ‘बुद्धि’ को व्यक्तिवाचक रूप देना या ‘व्यवस्था’ को स्पष्ट कर्ता बनाना
  rationale: यूनानी पाठ में σοφίαν कर्मकारक है और ὁ πιπλῶν का कर्ता निकटवर्ती प्रसंग से समझा जाता है। अनुवाद ने प्रसंगगत कर्ता को नाम देकर व्याख्यात्मक निर्णय नहीं थोपा।
- issue: नदी-संबंधी उपमा की अपूर्ण समानांतरता
  choice: दूसरे खंड में यूनानी की संक्षिप्त, लुप्त क्रिया वाली रचना बनाए रखी
  alternative: ‘दजला के समान बहता है’ जोड़ना
  rationale: ‘बहता है’ अर्थ को सहज बनाता, पर स्रोत में दूसरी क्रिया नहीं है; अतः मूल की वास्तविक व्याकरणिक संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नदी-चित्र की प्रचुरता को ‘भर देता है’ से व्यक्त किया गया है, जबकि स्रोत में अनकहे कर्म और दूसरे खंड की लुप्त क्रिया को जानबूझकर नहीं भरा गया।
