  text: I came forth from the mouth of the Most High, and like a mist I covered the earth;
translation:
  language: hi
  text: 'मैं परमप्रधान के मुख से निकली,

    और कुहरे के समान मैंने पृथ्वी को ढक लिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: निकली
  rationale: ἐξέρχομαι के अओरिस्ट रूप का सीधा और स्वाभाविक अनुवाद। वक्ता व्यक्तिरूप में प्रस्तुत स्त्रीलिंग ‘बुद्धि’ है, इसलिए स्त्रीलिंग क्रिया रखी गई है; इससे उद्गम का बिंब भी बना रहता है।
- source_word: ἀπὸ στόματος
  choice: के मुख से
  rationale: यह अभिव्यक्ति वाणी और उद्गम—दोनों से जुड़ा मूल रूपक सुरक्षित रखती है और हिन्दी में गरिमापूर्ण तथा स्वाभाविक है।
- source_word: Ὑψίστου
  choice: परमप्रधान
  rationale: Ὕψιστος के लिए प्रचलित बाइबलीय ईश्वरीय उपाधि, जो ‘सबसे ऊँचे’ का भाव संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: ὡς ὁμίχλη
  choice: कुहरे के समान
  rationale: ὁμίχλη धुंध या कुहरे को सूचित करता है। ‘कुहरा’ पृथ्वी को व्यापक रूप से ढक लेने के दृश्य को स्पष्ट रखता है, जबकि ‘के समान’ काव्यात्मक उपमा को बनाए रखता है।
- source_word: κατεκάλυψα
  choice: मैंने ... ढक लिया
  rationale: क्रिया का अर्थ पूरी तरह ऊपर से ढक देना है। ‘ढक लिया’ मूल के पूर्ण आवरण के भाव को सहज हिन्दी में व्यक्त करता है, बिना ‘घेर लिया’ जैसे अतिरिक्त स्थानिक अर्थ जोड़े।
- source_word: γῆν
  choice: पृथ्वी को
  rationale: इस विश्वव्यापी काव्यात्मक प्रसंग में γῆ किसी विशेष भूभाग के बजाय पूरी पृथ्वी को सूचित करता है।
theological_decisions:
- issue: परमेश्वर से व्यक्तिरूप बुद्धि का निकलना
  choice: ‘मैं परमप्रधान के मुख से निकली’ को सीधे बनाए रखा गया।
  alternative: ‘परमप्रधान ने मुझे कहा’ अथवा ‘मैं परमप्रधान की आज्ञा से उत्पन्न हुई’
  rationale: यूनानी पाठ बुद्धि को प्रथम पुरुष में बोलते हुए और परमप्रधान के मुख से निकलते हुए प्रस्तुत करता है। अनुवाद इस काव्यात्मक-धर्मवैज्ञानिक तनाव को न तो केवल उच्चरित वचन में सीमित करता है, न सृष्टि या किसी बाद की सिद्धान्तगत श्रेणी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली। ‘मुख’ और ‘परमप्रधान’ मूल पद्य के ऊँचे धार्मिक स्तर को बनाए रखते हैं; वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है।
