translation:
  language: hi
  text: मैं अंगूर की बेल के समान अनुग्रह बिखेरते हुए अंकुरित हुई,[a] और मेरे फूल महिमा और समृद्धि के फल हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “मैं अंगूर की बेल के समान अनुग्रह को अंकुरित करती हुई फूटी।” यहाँ “अनुग्रह” के अर्थ में मनोहरता, कृपा या सौन्दर्य भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “महिमा और समृद्धि के फल” का अर्थ “महिमामय और समृद्ध फल” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  choice: मैं
  rationale: व्यक्त रूप से आए प्रथम पुरुष सर्वनाम को बल देने के लिए रखा गया है; प्रसंग में व्यक्तिरूप ज्ञान स्वयं बोल रहा है।
- source_word: ὡς ἄμπελος
  choice: अंगूर की बेल के समान
  rationale: यह उपमा को स्पष्ट रखता है और हिन्दी में केवल ‘बेल’ की अपेक्षा अंगूर की लता का चित्र अधिक निश्चित करता है।
- source_word: βλαστήσασα χάριν
  choice: अनुग्रह से अंकुरित हुई
  rationale: βλαστήσασα वनस्पति के अंकुरित होने को व्यक्त करता है। कर्मकारक χάριν को हिन्दी में ‘अनुग्रह से’ कहना मूल के असामान्य काव्यात्मक मेल को स्वाभाविक रूप देता है, यद्यपि ‘अनुग्रह को अंकुरित किया’ अधिक शब्दशः सम्भव है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: χάρις में कृपा, मनोहरता और कृपापूर्ण गुण—सभी की छाया हो सकती है; ‘अनुग्रह’ इस व्यापकता और ऊँचे काव्यात्मक स्वर को यथासम्भव बनाए रखता है।
- source_word: τὰ ἄνθη μου
  choice: मेरे फूल
  rationale: ἄνθη का सीधा और आधुनिक हिन्दी रूप ‘फूल’ है; यह बेल के बिंब के साथ स्वाभाविक है।
- source_word: καρπὸς δόξης καὶ πλούτου
  choice: महिमा और समृद्धि के फल
  rationale: एकवचन विधेय καρπός को हिन्दी के स्वाभाविक सामूहिक ‘फल’ से व्यक्त किया गया है। सम्बन्धकारक पदों की वास्तविक अस्पष्टता—उत्पत्ति, गुण या परिणाम—को ‘के’ द्वारा खुला रखा गया है।
- source_word: δόξης
  choice: महिमा
  rationale: δόξα के गौरव, सम्मान और वैभवपूर्ण चमक के ऊँचे अर्थक्षेत्र को ‘महिमा’ सुरक्षित रखता है।
- source_word: πλούτου
  choice: समृद्धि
  rationale: πλοῦτος का अर्थ धन या प्रचुरता है; वनस्पति और ज्ञान के काव्यात्मक प्रसंग में ‘समृद्धि’ केवल भौतिक धन तक अर्थ को सीमित नहीं करती।
theological_decisions:
- issue: व्यक्तिरूप ज्ञान के कथन में χάριν का अर्थ
  choice: अनुग्रह
  alternative: मनोहरता / कृपा / सौन्दर्य
  rationale: मूल शब्द सौन्दर्यात्मक आकर्षण और हितकारी कृपा दोनों व्यक्त कर सकता है। ‘अनुग्रह’ किसी एक संकीर्ण, केवल शारीरिक अर्थ को थोपे बिना धार्मिक-काव्यात्मक गहराई बनाए रखता है।
- issue: δόξης καὶ πλούτου का καρπός से सम्बन्ध
  choice: महिमा और समृद्धि के फल
  alternative: महिमामय और समृद्ध फल
  rationale: यूनानी सम्बन्धकारक पद फल के स्रोत, स्वरूप या परिणाम को सूचित कर सकते हैं। हिन्दी में ‘के फल’ इस तनाव को व्याख्यात्मक विशेषणों से समयपूर्व नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। स्त्रीलिंग ‘हुई’ प्रसंग में व्यक्तिरूप ‘ज्ञान’ के स्त्रीलिंग स्वरूप के अनुरूप है। वनस्पति-बिंब और मूल की अर्थगत अस्पष्टता दोनों सुरक्षित रखे गए हैं।
