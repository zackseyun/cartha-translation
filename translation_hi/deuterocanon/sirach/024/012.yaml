  yaml_path: translation/deuterocanon/sirach/024/012.yaml
  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
translation:
  language: hi
  text: और मैंने महिमा पाए हुए लोगों[a] के बीच जड़ पकड़ी, प्रभु की विरासत के भाग में।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमामय लोगों के बीच।” यूनानी पूर्ण कर्मवाच्य कृदन्त को विशेषण के रूप में भी समझा जा सकता है; मुख्य पाठ महिमा प्राप्त होने के उसके परिणामी भाव को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: वाक्यांश का अनुवाद “प्रभु के भाग में—अर्थात उसकी विरासत में” या “प्रभु की आवंटित विरासत में” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: मैंने ... जड़ पकड़ी
  rationale: प्रथम पुरुष एकवचन एओरिस्ट सक्रिय रूप को स्वाभाविक हिन्दी में व्यक्त करता है और सक्रिय भाव बनाए रखता है।
- source_word: λαῷ
  choice: प्रजा
  rationale: यहाँ एक सामूहिक, वाचा-संबंधी समुदाय का भाव है; ‘प्रजा’ उस एकवचन सामूहिक अर्थ को गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: δεδοξασμένῳ
  choice: महिमान्वित की गई
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त के परिणामी और प्रदत्त महिमा के भाव को सुरक्षित रखता है, उसे केवल ‘महिमामयी’ विशेषण में नहीं बदलता।
- source_word: μερίδι
  choice: भाग
  rationale: किसी को बाँटकर मिले अंश का अर्थ देता है और विरासत के संदर्भ के साथ स्वाभाविक बैठता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए परियोजना-अनुकूल, प्रतिष्ठित और सामान्य हिन्दी पद।
- source_word: κληρονομίας
  choice: विरासत
  rationale: κληρονομία के उत्तराधिकार और आवंटित धरोहर—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δεδοξασμένῳ को साधारण विशेषण मानें या कर्मवाच्य/परिणामी कृदन्त के रूप में व्यक्त करें।
  choice: महिमान्वित की गई प्रजा
  alternative: महिमामयी प्रजा; सम्मानित प्रजा
  rationale: यूनानी पूर्णकालिक कर्मवाच्य कृदन्त है। चुना हुआ रूप यह खुला रखता है कि प्रजा को महिमा प्रदान की गई है, न कि महिमा केवल उसका अंतर्निहित गुण है।
- issue: ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ की संक्षिप्त और कुछ हद तक समानाधिकरणीय रचना को कैसे व्यक्त किया जाए।
  choice: प्रभु के भाग में—उसकी विरासत में
  alternative: प्रभु की विरासत के भाग में; प्रभु को मिली विरासत में
  rationale: मुख्य पाठ ‘भाग’ और ‘विरासत’ दोनों को अलग रखते हुए उनके समानाधिकरणीय संबंध को डैश से दिखाता है और यूनानी की वास्तविक वाक्यगत अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और स्रोत-समीप रूप। ‘जड़ पकड़ी’ बोलचाल में बोधगम्य है, जबकि ‘महिमान्वित की गई’ यूनानी कृदन्त की सूक्ष्मता बनाए रखता है।
