  yaml_path: translation/deuterocanon/sirach/024/021.yaml
  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
translation:
  language: hi
  text: जो मुझे खाते हैं, वे फिर भी भूखे रहेंगे[a], और जो मुझे पीते हैं, वे फिर भी प्यासे रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अधिक के लिए भूखे रहेंगे … और अधिक के लिए प्यासे रहेंगे।” यूनानी में शाब्दिक रूप से “फिर भी भूखे रहेंगे” और “फिर भी प्यासे रहेंगे” है; इससे बुद्धि का आस्वादन करने के बाद भी उसके लिए बनी रहने वाली अभिलाषा व्यक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: जो मुझे खाते हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत सामान्य और निरंतर क्रिया का भाव देता है। ‘जो मुझे खाते हैं’ स्वाभाविक हिन्दी में इसे और व्यक्त रूप में बोल रही बुद्धि के ‘मुझे’ रूपक को बनाए रखता है।
- source_word: ἔτι
  choice: फिर भी
  rationale: यह सहभागी होने के बाद भी भूख-प्यास के बने रहने का विरोधाभासी भाव व्यक्त करता है। ‘फिर भी’ आधुनिक हिन्दी में इस तनाव को स्पष्ट रखता है।
- source_word: πεινάσουσιν
  choice: भूखे रहेंगे
  rationale: यूनानी भविष्यकालीन क्रिया का स्वाभाविक हिन्दी रूप है; यह आगे भी भूख बने रहने का अर्थ देता है।
- source_word: οἱ πίνοντές με
  choice: जो मुझे पीते हैं
  rationale: पहले खंड के समानांतर संज्ञात्मक वर्तमान कृदंत और प्रथम-पुरुष कर्म को सीधे बनाए रखा गया है।
- source_word: διψήσουσιν
  choice: प्यासे रहेंगे
  rationale: भविष्यकाल और जारी अवस्था दोनों को स्वाभाविक हिन्दी में व्यक्त करता है तथा पहले खंड के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: बुद्धि को खाने-पीने के बाद भी भूख और प्यास बने रहने का विरोधाभास
  choice: मुख्य पाठ में भूख और प्यास के रूपक को शाब्दिक रूप से बनाए रखना
  alternative: ‘और अधिक के लिए भूखे/प्यासे होंगे’ कहकर निहित अर्थ स्पष्ट करना
  rationale: यूनानी पाठ सीधे ‘फिर भी भूखे होंगे’ और ‘फिर भी प्यासे होंगे’ कहता है। ‘और अधिक’ सम्भावित आशय है, पर स्पष्ट शब्द नहीं; इसलिए उसे पादटिप्पणी में रखा गया है ताकि मूल का धार्मिक और काव्यात्मक तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘खाते’ और ‘पीते’ की प्रत्यक्ष रूपकात्मक भाषा सुरक्षित रखी गई है; ‘फिर भी’ विरोधाभास को स्वाभाविक ढंग से सामने लाता है।
