lexical_decisions:
- source_word: ἐκλίπητε
  choice: शिथिल न पड़ो
  rationale: यह क्रिया चूक जाने, समाप्त हो जाने या निर्बल पड़ने का भाव दे सकती है। ἐν ἰσχύϊ के साथ ‘शिथिल न पड़ो’ स्वाभाविक हिन्दी में सामर्थ्य न खोने की चेतावनी देता है और अर्थ को अनावश्यक रूप से नहीं खोलता।
- source_word: ἰσχύϊ
  choice: बल में
  rationale: ἰσχύς का अर्थ बल, सामर्थ्य या शक्ति है। ‘बल’ संक्षिप्त और सीधा समतुल्य है तथा अगले क्रियापद के साथ शब्द-संबंध भी बनाए रखता है।
- source_word: κολλᾶσθε
  choice: लिपटे रहो
  rationale: मध्य/कर्मवाच्य रूप अपने आपको किसी से निकटता से जोड़ने और दृढ़ता से लगे रहने का भाव देता है। ‘लिपटे रहो’ इस घनिष्ठ और सतत लगाव को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: यूनानी सर्वनाम रूपतः पुल्लिंग या नपुंसकलिंग हो सकता है। हिन्दी ‘उससे’ इस व्याकरणिक अस्पष्टता को सुरक्षित रखता है और संदर्भ से व्यक्तिपरक अथवा वस्तुपरक संकेत ग्रहण करने देता है।
- source_word: κραταιωθῆτε
  choice: बलवन्त किए जाओ
  rationale: कर्मवाच्य संभावनार्थक रूप उस परिणाम को दर्शाता है जो लिपटे रहने से प्राप्त हो। ‘बलवन्त किए जाओ’ उसके कर्मवाच्य और परिणामसूचक बल को स्पष्ट रखता है।
theological_decisions:
