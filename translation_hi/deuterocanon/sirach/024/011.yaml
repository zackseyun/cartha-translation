  text: In the beloved city likewise he gave me rest[b][a], and in Jerusalem was my authority.
translation:
  language: hi
  text: प्रिय नगर में भी उसने मुझे विश्राम दिया[a], और यरूशलेम में मेरा अधिकार था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उसने’ का कर्ता नाम से नहीं बताया गया है। आसपास का प्रसंग परमेश्वर की ओर संकेत करता है। ‘मुझे विश्राम दिया’ का अनुवाद ‘मुझे बसाया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: प्रिय नगर
  rationale: ἠγαπημένῃ का अर्थ ‘प्रेम किया हुआ/प्रिय’ है। ‘प्रिय नगर’ विशिष्ट नगर के प्रति प्रेम और काव्यात्मक गरिमा दोनों को स्वाभाविक हिन्दी में बनाए रखता है; अगला खंड उसे यरूशलेम के रूप में पहचानता है।
- source_word: ὁμοίως
  choice: भी
  rationale: ὁμοίως पिछले कथन से समानता और निरंतरता जोड़ता है। इस वाक्य में ‘भी’ आधुनिक हिन्दी में ‘उसी प्रकार/वैसे ही’ की अपेक्षा अधिक सहज है, जबकि उसका संयोजक भाव सुरक्षित रहता है।
- source_word: κατέπαυσεν
  choice: उसने मुझे विश्राम दिया
  rationale: καταπαύω यहाँ किसी को ठहराने, विश्राम देने या बसाने का भाव रखता है। ‘मुझे विश्राम दिया’ मूल क्रिया की विश्राम-संबंधी छवि को बनाए रखता है और कर्म με को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: ἐξουσία अधिकार, सामर्थ्य या अधिकार-क्षेत्र का बोध करा सकता है। ‘अधिकार’ अमूर्त संज्ञा को सुरक्षित रखता है और ‘शासन’ या ‘राज्य’ जैसे अधिक विशिष्ट अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: κατέπαυσεν का अप्रकट कर्ता
  choice: मुख्य पाठ में केवल ‘उसने’ रखा गया है।
  alternative: ‘परमेश्वर ने मुझे विश्राम दिया’ अथवा ‘प्रभु ने मुझे बसाया।’
  rationale: यूनानी क्रिया में कर्ता पुल्लिंग एकवचन है, पर इस पद में उसका नाम नहीं दिया गया। आसपास का प्रसंग परमेश्वर की ओर संकेत करता है, फिर भी मुख्य पाठ में नाम जोड़ना पद की अंतर्निहित अस्पष्टता को समाप्त कर देता।
- issue: ἐξουσία के साथ निहित काल-सूचक क्रिया
  choice: ‘मेरा अधिकार था’
  alternative: ‘मेरा अधिकार है’
  rationale: यूनानी के दूसरे खंड में संयोजक क्रिया लिखी नहीं गई है। प्रसंग में ज्ञान के स्थापित किए जाने की बीती घटना और पहले खंड की अओरिस्ट क्रिया के अनुरूप ‘था’ स्वाभाविक है, यद्यपि व्याकरण अकेले वर्तमान अर्थ को पूरी तरह निषिद्ध नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रिय नगर’ ज्ञान-साहित्य के काव्यात्मक स्वर को बनाए रखता है; ‘भी’ पूर्ववर्ती प्रसंग से संबंध को बोलचाल से अधिक स्वाभाविक साहित्यिक हिन्दी में व्यक्त करता है।
