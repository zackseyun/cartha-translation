  yaml_path: translation/deuterocanon/sirach/024/002.yaml
  text: In the assembly of the Most High she will open her mouth[c][b][a], and before his power she will boast.
translation:
  language: hi
  text: परमप्रधान की सभा में वह अपना मुँह खोलेगी[a], और उसकी सामर्थ्य के सम्मुख वह अपनी बड़ाई करेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् व्यक्तिरूप में प्रस्तुत ज्ञान; यह पहचान आस-पास के प्रसंग से स्पष्ट होती है।
    reason: cross_reference
  - marker: b
    text: या, “उसकी सेना/दल के सामने वह अपनी बड़ाई करेगी।” यूनानी शब्द का अर्थ “सामर्थ्य” और कुछ प्रसंगों में “सेना/दल” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: सभा
  rationale: यहाँ ἐκκλησία एकत्र समुदाय को दर्शाता है। ‘सभा’ आधुनिक हिन्दी में स्वाभाविक और तटस्थ है तथा बाद के संस्थागत अर्थ को अनावश्यक रूप से नहीं लाता।
- source_word: Ὑψίστου
  choice: परमप्रधान
  rationale: यह Ὕψιστος के लिए प्रचलित, श्रद्धापूर्ण ईश्वरीय उपाधि है।
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: वह अपना मुँह खोलेगी
  rationale: यूनानी मुहावरे की सजीवता और स्त्रीरूप में व्यक्त ज्ञान के मानवीकरण को बनाए रखता है।
- source_word: ἔναντι
  choice: के सामने
  rationale: यह किसी की उपस्थिति में होने का स्थानिक-संबंधात्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δυνάμεως αὐτοῦ
  choice: उसकी सामर्थ्य
  rationale: δύναμις का सीधा अर्थ ‘सामर्थ्य/शक्ति’ है। प्रसंग में ‘सेना’ या ‘स्वर्गीय दल’ संभव है, पर वह अर्थ यूनानी में निर्विवाद नहीं; इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: καυχήσεται
  choice: अपनी बड़ाई करेगी
  rationale: यह καυχάομαι के ‘गर्व से कहना/बड़ाई करना’ अर्थ को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है और अस्पष्ट रूप से केवल आनंद मनाने का अर्थ नहीं देता।
theological_decisions:
- issue: स्त्रीलिंग कर्ता का संदर्भ
  choice: मुख्य पाठ में केवल ‘वह’ रखा गया
  alternative: ‘ज्ञान’ को स्पष्ट रूप से जोड़ना
  rationale: आस-पास का प्रसंग कर्ता को मानवीकृत ज्ञान के रूप में पहचानता है, किंतु इस पद में संज्ञा दोहराई नहीं गई; इसलिए पाठ की संरचना और संदर्भगत निर्भरता सुरक्षित रखी गई।
- issue: δυνάμεως का अर्थ
  choice: सामर्थ्य
  alternative: सेना/स्वर्गीय दल
  rationale: ‘सामर्थ्य’ यूनानी शब्द का प्रत्यक्ष और व्यापक अर्थ है। सामूहिक ‘दल’ का अर्थ सप्तति में संभव है, पर यहाँ निश्चित नहीं; विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘परमप्रधान’, ‘सभा’ और ‘सामर्थ्य’ सामान्य बाइबलीय पाठकों के लिए परिचित हैं; वाक्य की काव्यात्मक समानांतरता और भविष्यकाल सुरक्षित रखे गए हैं।
