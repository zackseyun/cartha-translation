  yaml_path: translation/deuterocanon/sirach/024/013.yaml
  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: hi
  text: लबानोन में मुझे देवदार के समान ऊँचा उठाया गया, और हेरमोन[a] के पहाड़ों में सरू के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी Ἀερμών उस स्थाननाम का रूप है जिसे सामान्यतः ‘हेरमोन’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: के समान
  rationale: यह उपमा का संकेत देता है; आधुनिक हिन्दी में ‘के समान’ काव्यात्मक और स्वाभाविक है।
- source_word: κέδρος
  choice: देवदार
  rationale: यह यूनानी वृक्षनाम का प्रचलित हिन्दी पर्याय है और लबानोन के ऊँचे, भव्य वृक्ष की छवि बनाए रखता है।
- source_word: ἀνυψώθην
  choice: मुझे ऊँचा उठाया गया
  rationale: यह यूनानी क्रिया के भूतकालीन कर्मवाच्य भाव को सुरक्षित रखता है और ‘महिमान्वित किया गया’ जैसी अधिक धर्मवैचारिक व्याख्या जोड़े बिना ऊँचाई की वृक्ष-संबंधी छवि व्यक्त करता है। ‘मुझे’ वाला विन्यास हिन्दी में वक्ता के लिंग को अनावश्यक रूप से निर्धारित करने से भी बचाता है।
- source_word: ἐν τῷ Λιβάνῳ
  choice: लबानोन में
  rationale: यह स्थानवाचक वाक्यांश का सीधा और हिन्दी में स्वाभाविक अनुवाद है।
- source_word: κυπάρισσος
  choice: सरू
  rationale: ‘सरू’ κυπάρισσος का मानक हिन्दी वृक्षनाम है; ‘चीड़’ या ‘सनोबर’ की अपेक्षा यह यूनानी शब्द के अधिक निकट है।
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: हेरमोन के पहाड़ों में
  rationale: ὄρεσιν के बहुवचन को ‘पहाड़ों’ से व्यक्त किया गया है और Ἀερμών के लिए प्रचलित स्थाननाम ‘हेरमोन’ रखा गया है।
theological_decisions:
- issue: क्या ἀνυψώθην का अनुवाद स्पष्ट रूप से सम्मान या महिमा सूचित करने वाले शब्द से किया जाए
  choice: मुझे ऊँचा उठाया गया
  alternative: मुझे महिमान्वित किया गया
  rationale: यहाँ व्यक्तिरूप में बोलती हुई प्रज्ञा वृक्षों की उपमाओं द्वारा अपना वर्णन करती है। ऊँचाई-केंद्रित अनुवाद तत्काल काव्यात्मक बिंब और कर्मवाच्य रूप बनाए रखता है तथा पद में निहित अर्थ से आगे बढ़कर किसी विशेष धर्मवैचारिक प्रतिष्ठा का दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। दूसरे खंड में यूनानी मूल की क्रियाविहीन समानांतर रचना को हिन्दी में भी बनाए रखा गया है।
