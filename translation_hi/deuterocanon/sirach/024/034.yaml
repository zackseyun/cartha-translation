  yaml_path: translation/deuterocanon/sirach/024/034.yaml
  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: hi
  text: देखो, मैंने केवल अपने लिए ही नहीं, बल्कि उसे खोजने वाले सब लोगों के लिए परिश्रम किया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, मैंने केवल अपने लिए ही नहीं, बल्कि उसे खोजने वाले सब लोगों के लिए परिश्रम किया।”
    reason: यूनानी अओरिस्ट को हिन्दी में साधारण भूतकाल से भी व्यक्त किया जा सकता है; मुख्य पाठ वर्तमान तक बने प्रभाव को दिखाने के लिए पूर्ण वर्तमान का प्रयोग करता है।
lexical_decisions:
- source_word: ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप श्रोताओं से कही गई बात को पहचानने पर ध्यान देने का आग्रह करता है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक और सीधा रूप है।
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: केवल अपने लिए ही नहीं
  rationale: सम्प्रदान कारक यहाँ लाभ या हित का भाव देता है। यह चयन स्पष्ट करता है कि परिश्रम वक्ता के अकेले लाभ के लिए नहीं था और μόνῳ के बल को बनाए रखता है।
- source_word: ἐκοπίασα
  choice: परिश्रम किया है
  rationale: यूनानी में यह अओरिस्ट है, पर प्रसंग में पूरा हो चुका परिश्रम पाठकों के लिए अब भी फलदायी रूप में उपस्थित है; हिन्दी का पूर्ण वर्तमान इस वर्तमान-संबद्ध प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλὰ πᾶσι
  choice: बल्कि उन सबके लिए
  rationale: ‘बल्कि’ पहले निषेध के साथ प्रबल विरोध प्रकट करता है, और ‘उन सबके लिए’ आगे आने वाले कृदन्तीय समूह से लाभार्थियों को जोड़ता है।
- source_word: τοῖς ἐκζητοῦσιν
  choice: जो ... खोज करते हैं
  rationale: यह निरन्तर या विशेष रूप से खोजने वालों को दर्शाता है। ‘खोज करते हैं’ ज्ञान-साहित्य के प्रसंग में सहज है और अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: αὐτήν
  choice: उसकी
  rationale: स्त्रीलिंग सर्वनाम का संकेत इस अध्याय में स्त्रीरूप में व्यक्त बुद्धि की ओर है। हिन्दी में ‘उसकी’ इस व्यक्तिकरण को बनाए रखता है।
theological_decisions:
- issue: बुद्धि-विमर्श में αὐτήν का संकेत और लिंग
  choice: ‘उसकी’, अर्थात स्त्रीरूप में व्यक्त बुद्धि
  alternative: ‘उसकी’ को अमूर्त बुद्धि का केवल व्याकरणिक संदर्भ मानना, या अर्थ को लिंग-निरपेक्ष ढंग से व्यक्त करना
  rationale: सिराख 24 में बुद्धि स्वयं स्त्री वक्ता के रूप में बोलती है। स्त्रीलिंग संदर्भ बनाए रखने से अध्याय की साहित्यिक और धर्मवैचारिक बनावट सुरक्षित रहती है, बिना पाठ से आगे कोई सिद्धान्त जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परिश्रम’ ज्ञान-साहित्य के औपचारिक स्वर के अनुकूल है, जबकि वाक्य-विन्यास बोलचाल से अत्यधिक दूर नहीं जाता।
