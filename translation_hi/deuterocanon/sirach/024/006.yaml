lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: समुद्र की लहरों में
  rationale: यह सहज स्थानवाचक अनुवाद मूल के ठोस समुद्री बिंब को बनाए रखता है।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: सारी पृथ्वी पर
  rationale: γῆ का अर्थ भूमि या पृथ्वी हो सकता है; यहाँ व्यापक भौगोलिक क्रम के कारण ‘सारी पृथ्वी’ उपयुक्त है।
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: हर जाति और राष्ट्र के बीच
  rationale: यह वाक्यांश मानव समुदायों के बीच प्रज्ञा की व्यापक उपस्थिति दर्शाता है; ‘बीच’ आधुनिक हिन्दी में स्वाभाविक है और λαός तथा ἔθνος का भेद यथासंभव बनाए रखता है।
- source_word: ἐκτησάμην
  choice: मैंने अधिकार पाया
  rationale: κτάομαι प्राप्त करने अथवा अधिकार पाने का भाव देता है। मूल यूनानी में कर्म अनकहा है; ‘अधिकार पाया’ हिन्दी में सहज रहते हुए कोई निश्चित कर्म नहीं जोड़ता।
theological_decisions:
- issue: ἐκτησάμην का अनकहा कर्म
  choice: ‘मैंने अधिकार पाया’ द्वारा कर्म को अनिर्दिष्ट रखना
  alternative: ‘मैंने उन्हें प्राप्त किया’ या ‘मैंने वहाँ अधिकार कर लिया’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि प्रज्ञा ने किस वस्तु को प्राप्त किया। अनिर्दिष्ट अभिव्यक्ति इस वास्तविक अस्पष्टता को बनाए रखती है और किसी संकुचित धर्मवैचारिक अर्थ को आरोपित नहीं करती।
