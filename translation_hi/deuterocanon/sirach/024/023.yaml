  yaml_path: translation/deuterocanon/sirach/024/023.yaml
  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
translation:
  language: hi
  text: ये सब बातें परमप्रधान परमेश्वर[a] की वाचा की पुस्तक हैं—वह व्यवस्था जिसे मूसा ने याकूब के समुदायों[b] के लिए विरासत के रूप में आज्ञापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर, जो परमप्रधान है।”
    reason: lexical_alternative
  - marker: b
    text: या, “याकूब की सभाओं” या “मंडलियों।” यहाँ आशय याकूब अर्थात इस्राएल के एकत्र समुदायों से है, केवल बाद के संस्थागत आराधनालयों से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: यह नपुंसकलिंग बहुवचन पद पिछले पूरे वर्णन की अलग-अलग बातों को समेटता है; हिन्दी में ‘ये सब बातें’ उसका बहुवचन बल स्पष्ट रखता है।
- source_word: βίβλος
  choice: पुस्तक
  rationale: βίβλος किसी लिखित पुस्तक या ग्रंथ को सूचित करता है। आधुनिक हिन्दी में ‘पुस्तक’ स्वाभाविक है और प्राचीन लेखन-सामग्री को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: διαθήκης
  choice: वाचा
  rationale: मूसा और याकूब के संदर्भ में διαθήκη परमेश्वर और उसके लोगों के बीच की बंधनकारी वाचा को सूचित करता है; ‘वाचा’ इस बाइबलीय अर्थ को बनाए रखता है।
- source_word: θεοῦ Ὑψίστου
  choice: परमप्रधान परमेश्वर
  rationale: यह पद परमेश्वर को ‘परमप्रधान’ बताता है। ‘परमप्रधान परमेश्वर’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: νόμον
  choice: वह व्यवस्था
  rationale: यहाँ νόμος मूसा से संबद्ध पहचानी हुई व्यवस्था है। ‘वह व्यवस्था’ उसकी निश्चितता और पिछले पद से उसके समानाधिकरण को स्पष्ट करता है।
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: जिसकी आज्ञा मूसा ने … दी
  rationale: ἐντέλλομαι का मूल अर्थ आज्ञा देना है। हिन्दी में ‘जिसकी आज्ञा … दी’ इस क्रियात्मक बल को बनाए रखते हुए स्वाभाविक वाक्य बनाता है।
- source_word: κληρονομίαν
  choice: विरासत के रूप में
  rationale: κληρονομίαν व्यवस्था को याकूब की सभाओं की स्थायी पैतृक संपत्ति के रूप में प्रस्तुत करता है; ‘विरासत के रूप में’ इस समानाधिकरण को साफ करता है।
- source_word: συναγωγαῖς
  choice: सभाओं
  rationale: इस संदर्भ में συναγωγαί इस्राएल के एकत्र समुदायों को सूचित करता है, न कि अनिवार्य रूप से बाद के संस्थागत आराधनालयों को। ‘सभाओं’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: Ἰακώβ
  choice: याकूब
  rationale: यूनानी पाठ में कुलपिता का नाम Ἰακώβ है। सामूहिक संकेत इस्राएल के लोगों की ओर है, फिर भी मूल नाम ‘याकूब’ को बनाए रखना उचित है।
theological_decisions:
- issue: διαθήκη का वाचागत अर्थ
  choice: वाचा
  alternative: वसीयतनामा
  rationale: पद दिव्य प्रकाशन को मूसा और याकूब के समुदाय से जोड़ता है। इसलिए ‘वाचा’ संबंध और प्रतिज्ञा के बाइबलीय आशय को सुरक्षित रखता है, जबकि ‘वसीयतनामा’ यहाँ भ्रामक होगा।
- issue: θεοῦ Ὑψίστου में विशेषण का संबंध
  choice: परमप्रधान परमेश्वर
  alternative: परमेश्वर, जो परमप्रधान है
  rationale: दोनों रूप परमेश्वर को परमप्रधान बताते हैं। मुख्य पाठ में अधिक स्वाभाविक संज्ञा-पद चुना गया है, बिना ‘परमप्रधान’ को किसी अलग सत्ता का नाम बनाए।
- issue: συναγωγαῖς का ऐतिहासिक आशय
  choice: सभाओं
  alternative: मंडलियों
  rationale: यह शब्द याकूब अर्थात इस्राएल के एकत्र समुदायों के लिए है। ‘सभाओं’ बाद की यहूदी आराधनालय-संस्था का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा’, ‘व्यवस्था’ और ‘विरासत’ जैसे स्थापित बाइबलीय शब्द मूल के धार्मिक तथा कानूनी संबंधों को बनाए रखते हैं। डैश βίβλος और νόμον के समानाधिकरण को स्पष्ट करता है।
