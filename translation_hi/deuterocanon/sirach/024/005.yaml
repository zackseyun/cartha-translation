translation:
  language: hi
  text: मैं अकेली आकाश के घुमावदार विस्तार[a] के चारों ओर घूमी, और अथाह गहराइयों[b] की गहराई में चली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश के वृत्त’। यूनानी शब्द किसी गोल विस्तार, घेरे या मेहराब-जैसे घुमाव को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अथाह गहराइयों’ के लिए यूनानी में बहुवचन है, जो अनेक अगाध गहराइयों का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γῦρον
  choice: घुमावदार विस्तार
  rationale: यह शब्द गोलाई या वक्राकार घेरे का बोध कराता है। आकाश के संदर्भ में ‘घुमावदार विस्तार’ उसके मेहराब-जैसे रूप को सहज हिन्दी में व्यक्त करता है, जबकि ‘वृत्त’ उसका संभावित वैकल्पिक अर्थ है।
- source_word: ἐκύκλωσα
  choice: के चारों ओर घूमी
  rationale: क्रिया किसी वस्तु के चारों ओर जाने या चक्कर लगाने का भाव रखती है। यह हिन्दी प्रयोग मूल की गतिशील और वृत्ताकार छवि को सुरक्षित रखता है।
- source_word: μόνη
  choice: मैं अकेली
  rationale: स्त्रीलिंग एकवचन रूप बोलने वाली व्यक्तिरूप बुद्धि से मेल खाता है और उसके अकेले ऐसा करने पर बल देता है।
- source_word: βάθει
  choice: गहराई में
  rationale: यह एकवचन दत्तिव रूप है; ‘गहराई में’ उसकी व्याकरणिक संख्या को बनाए रखते हुए अगले बहुवचन पद के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἀβύσσων
  choice: अथाह गहराइयों की
  rationale: बहुवचन संबंधकारक अनेक अगाध या अथाह गहराइयों का संकेत देता है। ‘अथाह गहराइयाँ’ ऊँचे ब्रह्मांडीय भाव को स्पष्ट और बोधगम्य रखता है।
- source_word: περιεπάτησα
  choice: चली
  rationale: मूल क्रिया का सीधा अर्थ चलना या इधर-उधर चलना है। ‘चली’ ठोस गतिशील बिंब को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: व्यक्तिरूप में बोलने वाली बुद्धि
  choice: प्रथम पुरुष के स्त्रीलिंग रूप ‘मैं अकेली’ और ‘घूमी/चली’ को बनाए रखा गया है।
  alternative: इस कथन को तत्काल साहित्यिक संदर्भ से आगे किसी विशिष्ट दैवी सत्ता की सीधी पहचान मानना।
  rationale: सिराख 24 में बुद्धि व्यक्तिरूप में बोलती है। अनुवाद इस साहित्यिक और धर्मवैचारिक बल को सुरक्षित रखता है, पर पद से परे किसी बाद की सिद्धान्तगत पहचान का निर्णय नहीं करता।
