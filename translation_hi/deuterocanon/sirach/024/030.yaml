  text: And I, like a canal from a river, and like a water channel, went out into a garden.
translation:
  language: hi
  text: और मैं नदी से निकली नहर के समान, और जल-वाहिनी के समान, एक बगीचे[a] में जा निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परादीस’ अथवा ‘स्वर्गोद्यान’। यूनानी शब्द बगीचे, उद्यान या परादीस को सूचित कर सकता है; यहाँ निकटवर्ती चित्र सिंचाई किए जाने वाले बगीचे का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: और मैं
  rationale: यह पद वक्ता की अपनी भूमिका की ओर बढ़ता है। ‘और मैं’ यूनानी संयोजन और सर्वनाम—दोनों को सरल, स्वाभाविक हिन्दी में व्यक्त करता है; ‘मैं भी’ सम्भव है, पर यहाँ ‘भी’ पर अनावश्यक बल पड़ सकता है।
- source_word: διῶρυξ
  choice: नहर
  rationale: यह शब्द खोदी या बनाई गई जलधारा को दर्शाता है। ‘नहर’ कृत्रिम जलमार्ग का अर्थ स्पष्ट करता और प्राकृतिक ‘नदी’ से उसका भेद बनाए रखता है।
- source_word: ἀπὸ ποταμοῦ
  choice: नदी से निकली
  rationale: ἀπό स्रोत या उद्गम बताता है। हिन्दी में ‘नदी से निकली नहर’ उस नहर का चित्र स्वाभाविक रूप से प्रस्तुत करता है जो नदी से शाखा के रूप में निकलती है। यूनानी में निश्चित उपपद न होने के कारण ‘उस नदी’ नहीं जोड़ा गया।
- source_word: ὑδραγωγός
  choice: जल-वाहिनी
  rationale: यह पानी ले जाने वाली बनाई हुई नाली या वाहिका है। ‘जल-वाहिनी’ कृत्रिम रूप से पानी पहुँचाने का भाव रखता है और ‘नहर’ के समानार्थी होते हुए भी शब्दगत समानता को पूरी तरह मिटाता नहीं।
- source_word: ἐξῆλθον
  choice: जा निकला
  rationale: क्रिया का मूल भाव बाहर निकलने या आगे जाने का है। निर्जीव जलमार्गों की उपमा और बगीचे की ओर गति के संदर्भ में ‘जा निकला’ सहज हिन्दी है। हिन्दी में क्रिया का पुल्लिंग रूप वक्ता को सिराख के रूप में समझने के निकट संदर्भ पर आधारित है; यूनानी क्रिया स्वयं लिंग नहीं बताती।
- source_word: παράδεισον
  choice: बगीचा
  rationale: इस सिंचाई-रूपक में शब्द का ठोस अर्थ बगीचा, उपवन या उद्यान है। ‘बगीचा’ साधारण पाठक के लिए स्पष्ट है और बाद की पारलौकिक धारणाओं को अनावश्यक रूप से आरोपित नहीं करता। ‘परादीस’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ज्ञान-रूपक में παράδεισον का अर्थ
  choice: बगीचा
  alternative: परादीस अथवा स्वर्गोद्यान
  rationale: तात्कालिक प्रसंग नदी, नहर और जल-वाहिनी द्वारा सिंचाई का चित्र खींचता है; इसलिए ‘बगीचा’ प्राथमिक अर्थ को सामने रखता है। फिर भी यूनानी शब्द के व्यापक और धर्मवैचारिक रूप से महत्त्वपूर्ण अर्थ को पादटिप्पणी में छोड़ा गया है, ताकि वास्तविक अर्थ-सम्भावना दबे नहीं।
- issue: प्रथम पुरुष वक्ता का लिंग
  choice: पुल्लिंग क्रियारूप ‘निकला’
  alternative: स्त्रीलिंग ‘निकली’ यदि वक्ता को व्यक्तिरूप ज्ञान माना जाए
  rationale: निकटवर्ती साहित्यिक प्रवाह में प्रथम पुरुष को लेखक/शिक्षक के स्वर के रूप में समझना सम्भव और प्रबल है। किंतु यूनानी ἐξῆλθον लिंग-चिह्नित नहीं है; हिन्दी की बाध्य लिंग-सहमति के कारण पुल्लिंग चुना गया है, न कि यूनानी द्वारा किसी लिंग का स्पष्ट निर्धारण किए जाने के कारण।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘नहर’ सामान्य बोलचाल का स्पष्ट शब्द है, जबकि ‘जल-वाहिनी’ समानांतर पद में थोड़ी औपचारिकता के साथ कृत्रिम जल-मार्ग का भाव बनाए रखता है। अल्पविराम यूनानी समानांतर संरचना को सुनने योग्य बनाते हैं।
