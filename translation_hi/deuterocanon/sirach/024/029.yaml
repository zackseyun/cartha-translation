  yaml_path: translation/deuterocanon/sirach/024/029.yaml
  text: For her understanding is more abundant than the sea[d][c][b][a], and her counsel than the great deep.
translation:
  language: hi
  text: क्योंकि उसकी समझ[a] समुद्र से भी अधिक व्यापक है, और उसकी सलाह विशाल अथाह जलराशि[b] से भी अधिक।[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विचार’। यूनानी शब्द विचार करने की क्षमता अथवा उससे उत्पन्न विचार, दोनों को सूचित कर सकता है; ज्ञान के प्रसंग के कारण मुख्य पाठ में ‘समझ’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘विशाल अथाह गहराई’। मूल अभिव्यक्ति आदिम अथवा ब्रह्मांडीय गहरे जल का बिंब जगा सकती है।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक शाब्दिक रूप में: ‘क्योंकि उसकी समझ समुद्र से बढ़ाई गई, और उसकी सलाह विशाल अथाह जलराशि से।’ यहाँ ‘से’ को तुलनात्मक मुहावरा समझना अधिक संभावित है, न कि उद्गम का संकेत।'
    reason: previous_rendering
  - marker: d
    text: या ‘क्योंकि उसकी समझ समुद्र से भी अधिक व्यापक है, और उसकी सलाह विशाल अथाह जलराशि से भी अधिक गहरी।’ ‘गहरी’ बिंब को सहज बनाता है, पर यूनानी में इसके लिए अलग शब्द नहीं है।
    reason: previous_rendering
lexical_decisions:
- source_word: διανόημα
  choice: समझ
  rationale: यह शब्द विचार करने की क्षमता या उससे उत्पन्न विचार, दोनों का बोध करा सकता है। ज्ञान के इस प्रसंग में ‘समझ’ स्वाभाविक है और अर्थ को केवल एक ‘विचार’ तक सीमित नहीं करती।
- source_word: ἐπληθύνθη
  choice: अधिक व्यापक है
  rationale: यहाँ निष्क्रिय क्रिया ἀπό के साथ सामी तुलनात्मक मुहावरे को व्यक्त करती है। शाब्दिक ‘बढ़ाई गई’ के बजाय ‘अधिक व्यापक है’ समुद्र से बढ़कर होने का आशय स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: βουλή
  choice: सलाह
  rationale: ‘सलाह’ आधुनिक सामान्य हिन्दी में परामर्श या विवेकपूर्ण सम्मति का स्वाभाविक शब्द है और ज्ञान-साहित्य के प्रसंग के अनुकूल है।
- source_word: ἀβύσσου μεγάλης
  choice: विशाल अथाह जलराशि
  rationale: ἀβύσσος यहाँ केवल किसी गड्ढे को नहीं, बल्कि आदिम या ब्रह्मांडीय अथाह जल-गहराई को जगाता है। ‘जलराशि’ समुद्र के साथ समानांतर जल-बिंब बनाए रखती है।
- source_word: ἀπὸ … θαλάσσης / ἀπὸ ἀβύσσου μεγάλης
  choice: समुद्र से भी … / विशाल अथाह जलराशि से भी
  rationale: ἀπό यहाँ स्रोत (‘से निकली’) नहीं, सामी तुलनात्मक प्रयोग (‘से बढ़कर’) दर्शाता है; हिन्दी का ‘से भी अधिक’ यही संबंध स्पष्ट करता है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: संदर्भ में पूर्वपद स्त्री-रूप में व्यक्त और मानवीकृत ज्ञान है। हिन्दी में ‘उसकी’ उसी व्यक्तिगत संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ज्ञान का स्त्री-रूप में मानवीकरण
  choice: ‘उसकी’ द्वारा व्यक्तिगत संदर्भ बनाए रखा गया।
  alternative: ज्ञान को निरपेक्ष अमूर्त वस्तु मानकर ‘इसकी’ या संज्ञा की पुनरावृत्ति करना।
  rationale: यूनानी पाठ और निकटवर्ती प्रसंग ज्ञान को स्त्री वक्ता के रूप में प्रस्तुत करते हैं। अनुवाद इस साहित्यिक-धर्मवैचारिक विशेषता को अमूर्त बनाकर समाप्त नहीं करता।
- issue: दूसरे उपवाक्य में लुप्त क्रिया
  choice: ‘अधिक’ को रखा, पर ‘व्यापक है’ की पुनरावृत्ति नहीं की।
  alternative: ‘और उसकी सलाह विशाल अथाह जलराशि से भी अधिक व्यापक है।’
  rationale: यूनानी में दूसरे उपवाक्य की क्रिया पहले उपवाक्य से समझी जाती है। हिन्दी में संक्षिप्त समानांतर रचना मूल की इस शैली को सुरक्षित रखते हुए अर्थ स्पष्ट रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘समझ’ और ‘सलाह’ सामान्य पाठक के लिए सहज हैं; ‘विशाल अथाह जलराशि’ समुद्र तथा ब्रह्मांडीय गहराई के काव्यात्मक समानांतर को बनाए रखती है।
