translation:
  language: hi
  text: जो समझ को फरात के समान, और कटनी के दिनों में यरदन के समान भर देता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह समझ को फरात के समान और कटनी के दिनों में यरदन के समान भर देता है।” यूनानी पद निश्चित उपपद सहित कृदंत से आरम्भ होता है; संदर्भ के अनुसार इसे “वह ... देता है” कहकर भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह उपमा नदियों की प्रचुर जलधारा का चित्र सामने लाती है और इस प्रकार समझ की भरपूरी व्यक्त करती है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: वह ... भरपूर कर देती है
  rationale: संज्ञीकृत वर्तमान कृदंत पूर्ववर्ती स्त्रीलिंग ‘व्यवस्था’ की ओर संकेत करता है। ‘भरपूर कर देती है’ क्रिया के सकर्मक भाव और नदी-जैसी प्रचुरता—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: σύνεσιν
  choice: समझ को
  rationale: σύνεσις के लिए ‘समझ’ सामान्य, स्पष्ट और ज्ञान-साहित्य के अनुकूल है; कर्मकारक रूप को ‘को’ से स्पष्ट रखा गया है।
- source_word: ὡς Εὐφράτης
  choice: फरात के समान
  rationale: ὡς तुलनात्मक है। हिन्दी में प्रचलित नदी-नाम ‘फरात’ के साथ ‘के समान’ गरिमापूर्ण और स्वाभाविक है।
- source_word: Ἰορδάνης
  choice: यरदन
  rationale: बाइबलीय भौगोलिक नाम का हिन्दी में परिचित रूप अपनाया गया है।
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: कटनी के दिनों में
  rationale: यूनानी के ठोस काल-सूचक पद का निकट और सहज अनुवाद है; यह केवल सामान्य ‘कटनी के समय’ कहने की अपेक्षा ‘दिनों’ को सुरक्षित रखता है।
theological_decisions:
- issue: ὁ ἀναπληρῶν का कर्ता
  choice: पूर्ववर्ती प्रसंग की ‘व्यवस्था’ को संकेतित करते हुए स्त्रीलिंग ‘वह’
  alternative: ‘जो समझ को भरपूर करता है’ अथवा निरपेक्ष ‘यह’
  rationale: यूनानी कृदंत पुल्लिंग एकवचन है, किंतु पाठ-परंपरा और निकटवर्ती संदर्भ में वाक्य-रचना की कुछ असंगति/अस्पष्टता है। हिन्दी में अर्थ-संबंध स्पष्ट करने के लिए पूर्ववर्ती ‘व्यवस्था’ के अनुसार स्त्रीलिंग रखा गया है, जबकि वैकल्पिक व्याकरणिक रूप को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘भरपूर कर देती है’ ने यूनानी की सकर्मकता को सुरक्षित रखा है और ‘उमड़ती है’ जैसे अकर्मक अनुवाद से बचा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
