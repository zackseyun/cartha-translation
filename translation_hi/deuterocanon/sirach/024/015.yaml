base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: hi
  text: दालचीनी और अस्पालाथुस[a] के समान मैंने मसालों की सुगंध बिखेरी; उत्तम गंधरस के समान मैंने सुवास फैलाई—गुलबान, नखी और स्तक्ते[b] के समान, और तंबू[c] में लोबान के धुएँ के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अस्पालाथुस एक सुगंधित पौधा था, पर उसकी ठीक पहचान अनिश्चित है।
    reason: cultural_note
  - marker: b
    text: गुलबान, नखी और स्तक्ते सुगंधित धूप में प्रयुक्त पदार्थ थे; स्तक्ते की ठीक पहचान अनिश्चित है।
    reason: cultural_note
  - marker: c
    text: या, “पवित्र तंबू में।” यूनानी में केवल “तंबू” है, पर धूप के इस प्रसंग में पवित्रस्थान के तंबू की ओर संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: दालचीनी
  rationale: यूनानी शब्द का सामान्य और सर्वाधिक पहचाना जाने वाला हिन्दी समतुल्य; ‘तेजपात/कैसिया’ से अनावश्यक विशिष्टता नहीं लाई गई।
- source_word: ἀσπάλαθος
  choice: अस्पालाथुस
  rationale: इस सुगंधित वनस्पति की ठीक पहचान अनिश्चित है; लिप्यंतरण मूल की विशिष्टता बचाता और झूठी निश्चितता से बचता है।
- source_word: ἀρωμάτων
  choice: मसालों की
  rationale: सम्बन्धकारक बहुवचन को ‘सुगंध’ के साथ जोड़कर यूनानी पदबंध ὀσμὴ ἀρωμάτων का स्वाभाविक अर्थ दिया गया है।
- source_word: δέδωκα ὀσμήν
  choice: मैंने ... सुगंध बिखेरी
  rationale: शाब्दिक ‘गंध दी’ की अपेक्षा वर्तमान हिन्दी में स्वाभाविक है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: σμύρνα ἐκλεκτή
  choice: उत्तम गंधरस
  rationale: ἐκλεκτή चयनित/उत्तम को सूचित करता है; ‘गंधरस’ हिन्दी बाइबलीय प्रयोग में मिर्र का सुबोध नाम है।
- source_word: διέδωκα εὐωδίαν
  choice: मैंने सुवास फैलाई
  rationale: क्रिया के फैलाने के भाव और εὐωδία की मनभावन सुगंध—दोनों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χαλβάνη
  choice: गुलबान
  rationale: इस सुगंधित गोंद-राल का प्रचलित बाइबलीय हिन्दी नाम है।
- source_word: ὄνυξ
  choice: नखी
  rationale: धूप-सामग्री के प्रसंग में यह रत्न ‘सुलेमानी पत्थर’ नहीं, सुगंधित पदार्थ onycha है; ‘नखी’ पारंपरिक हिन्दी नाम है।
- source_word: στακτή
  choice: स्तक्ते
  rationale: विशिष्ट सुगंधित द्रव्य की पहचान पूरी तरह स्पष्ट नहीं; लिप्यंतरण उसकी विशिष्टता और अनिश्चितता दोनों बनाए रखता है।
- source_word: λίβανου ἀτμίς
  choice: लोबान का धुआँ
  rationale: जलते लोबान के प्रसंग में ἀτμίς का दृश्य परिणाम ‘धुआँ’ है; यह ‘वाष्प’ से अधिक सहज हिन्दी है।
- source_word: ἐν σκηνῇ
  choice: तंबू में
  rationale: σκηνή का प्रत्यक्ष अर्थ ‘तंबू’ है। पवित्रस्थान का संकेत सम्भावित है, पर मुख्य पाठ उसे निर्विवाद रूप से ‘मिलापवाला तंबू’ नहीं बनाता।
theological_decisions:
- issue: σκηνή का उपासना-संबंधी संकेत
  choice: तंबू में
  alternative: पवित्र तंबू में / मिलापवाले तंबू में
  rationale: धूप-सामग्री की सूची पवित्रस्थान की ओर संकेत करती है, फिर भी यूनानी शब्द अपने आप में सामान्य ‘तंबू’ भी हो सकता है। मुख्य पाठ वास्तविक भाषिक व्यापकता रखता है और पादटिप्पणी उपासना-संबंधी सम्भावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दुर्लभ सुगंध-द्रव्यों के पारंपरिक अथवा लिप्यंतरित नाम रखकर पादटिप्पणियों में आवश्यक सहायता दी गई है; अनिश्चित पहचानों को सामान्य पदार्थों से बदलकर कृत्रिम स्पष्टता नहीं लाई गई।
