  yaml_path: translation/deuterocanon/sirach/024/022.yaml
  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: hi
  text: जो मेरी बात मानता है, वह लज्जित नहीं होगा; और जो मेरे साथ काम करते हैं[a], वे पाप नहीं करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “मुझमें कार्य करते हैं”; इसका अर्थ “मेरे साथ काम करते हैं” या “मुझमें लगे रहते हैं” भी हो सकता है।
    reason: ἐν ἐμοὶ संबंध, सहभागिता, या कार्यक्षेत्र का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक हिंदी दी गई है, जबकि पादटिप्पणी स्रोत की शाब्दिकता और शेष अस्पष्टता सुरक्षित रखती है।
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: जो मेरी बात मानता है
  rationale: ὑπακούω में सुनकर मानने और आज्ञापालन करने का भाव है। यह हिंदी प्रयोग दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ αἰσχυνθήσεται
  choice: लज्जित नहीं होगा
  rationale: भविष्यकालीन निष्क्रिय रूप को सीधे रखा गया है; इसका अर्थ लज्जा उठाना या निराश होकर अपमानित होना हो सकता है।
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  choice: जो मुझमें कार्य करते हैं
  rationale: ἐν ἐμοὶ का मूल स्थानगत/संबंधगत रूप ‘मुझमें’ है। कुछ अस्वाभाविकता के बावजूद इसे मुख्य पाठ में रखा गया है ताकि ‘मेरे साथ’ कहकर अर्थ को अनावश्यक रूप से सीमित न किया जाए।
- source_word: οὐχ ἁμαρτήσουσιν
  choice: वे पाप नहीं करेंगे
  rationale: ἁμαρτάνω के सामान्य नैतिक-धार्मिक अर्थ और भविष्यकाल को स्पष्ट तथा सीधे रूप में व्यक्त किया गया है।
theological_decisions:
- issue: व्यक्तिरूप में बोलती बुद्धि के साथ संबंध
  choice: ‘मुझमें कार्य करते हैं’ द्वारा ἐν ἐμοὶ को खुला रखा गया
  alternative: ‘मेरे साथ काम करते हैं’ या ‘मेरी सेवा में लगे रहते हैं’
  rationale: स्रोत का वाक्यांश सहभागिता, क्षेत्र अथवा समर्पित गतिविधि का संकेत दे सकता है। किसी एक धर्मवैज्ञानिक व्याख्या को निश्चित मानने के बजाय मूल अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘पाप नहीं करेंगे’ का कथन
  choice: स्रोत के स्पष्ट भविष्यकालीन निषेध को बिना नरम किए रखा गया
  alternative: ‘पाप में नहीं पड़ेंगे’ या ‘गलती नहीं करेंगे’
  rationale: मूल पाठ का कथन प्रबल है। इसे केवल संभावना या सामान्य प्रवृत्ति बनाना धर्मवैज्ञानिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘मेरी बात मानता है’ सामान्य पाठक के लिए स्वाभाविक है। अर्धविराम दोनों समानांतर कथनों को स्पष्ट करता है।
