translation:
  language: hi
  text: वह शिक्षा को ज्योति के समान चमका देती है[a]—अंगूर की कटनी के दिनों में गीहोन के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शब्दशः: “शिक्षा को ज्योति के समान चमकाने वाली।” संदर्भ में यह पूर्ववर्ती आयतों की “व्यवस्था” का वर्णन आगे बढ़ाता है।'
    reason: यूनानी के आर्टिकलयुक्त कृदंत के अधिक शब्दशः रूप और उसके संदर्भगत कर्ता को स्पष्ट करता है।
lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: वह ... प्रकाशित करती है
  rationale: संदर्भ में यह कृदंत 24:23 की व्यवस्था का वर्णन आगे बढ़ाता है। हिन्दी में ‘व्यवस्था’ स्त्रीलिंग है, इसलिए ‘करती है’ स्वाभाविक है। ἐκφαίνω के ‘सामने लाने/प्रकट करने’ के भाव को यहाँ ज्योति की उपमा के साथ ‘प्रकाशित करती है’ व्यक्त करता है।
- source_word: ὡς φῶς
  choice: ज्योति के समान
  rationale: ὡς द्वारा व्यक्त स्पष्ट उपमा को बनाए रखता है; ‘ज्योति’ गरिमापूर्ण किंतु सामान्य आधुनिक हिन्दी में बोधगम्य है।
- source_word: παιδείαν
  choice: शिक्षा
  rationale: यह शब्द ज्ञान और चरित्र को गढ़ने वाली शिक्षा या प्रशिक्षण को सूचित करता है। ‘अनुशासन’ दंड का अनावश्यक भाव ला सकता है।
- source_word: ὡς Γηὼν
  choice: गीहोन के समान
  rationale: नदी के नाम का प्रचलित लिप्यंतरण रखा गया है और ὡς की तुलनात्मक शक्ति स्पष्ट की गई है।
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: अंगूर की कटनी के दिनों में
  rationale: τρυγητός विशेष रूप से अंगूर बटोरने की ऋतु को दर्शाता है; यह रूप कृषि-संबंधी विशिष्टता को स्पष्ट रखता है।
theological_decisions:
- issue: ὁ ἐκφαίνων का संदर्भ
  choice: ‘वह’ को पूर्ववर्ती ‘व्यवस्था’ का संकेत माना गया है
  alternative: ‘वह जो शिक्षा को...’ अथवा किसी पुरुषवाचक व्यक्ति के लिए ‘वह ... करता है’
  rationale: 24:23 के νόμον को आगे के कृदंतों का संदर्भ मानने से पदों की शृंखला बनी रहती है और परमेश्वर या किसी अन्य पुरुषवाचक कर्ता को अनावश्यक रूप से नहीं जोड़ा जाता। यूनानी में νόμος और कृदंत दोनों पुल्लिंग हैं, जबकि हिन्दी ‘व्यवस्था’ स्त्रीलिंग है; इसलिए हिन्दी क्रिया स्त्रीलिंग है।
- issue: ज्योति और गीहोन की दो उपमाओं का संबंध
  choice: दोनों उपमाओं को एक ही कथन के साथ रखा गया है और दूसरी उपमा में कोई नया क्रियापद नहीं जोड़ा गया
  alternative: ‘गीहोन के समान उमड़ती/बहती है’
  rationale: यूनानी पाठ दूसरी उपमा के लिए ‘बहना’ या ‘उमड़ना’ जैसा कोई स्पष्ट क्रियापद नहीं देता। नया क्रियापद जोड़ने से कठिन किंतु वास्तविक साहित्यिक तनाव हल हो जाता; विराम-चिह्न के द्वारा इसे पठनीय रखते हुए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘प्रकाशित करती है’ ज्योति की उपमा के साथ स्वाभाविक है, जबकि डैश दूसरी, क्रियारहित नदी-उपमा की स्रोतगत संक्षिप्तता और तनाव को बनाए रखता है।
