  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: hi
  text: फिर मैं शिक्षा को भविष्यवाणी के समान उँडेलूँगा[a], और उसे अनन्त पीढ़ियों के लिए छोड़ जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भविष्यवाणी के रूप में।” यूनानी पद का अर्थ तुलना भी हो सकता है और पहचान भी।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: फिर
  rationale: यहाँ यह आगे या पुनः किए जाने वाले कार्य को सूचित करता है; ‘फिर’ आधुनिक हिन्दी में स्वाभाविक है और केवल विलंब का भाव नहीं देता।
- source_word: διδασκαλίαν
  choice: शिक्षा
  rationale: यह ज्ञान-साहित्य के प्रसंग में सिखाई जाने वाली बात या उपदेश को सहज रूप से व्यक्त करता है और ‘सिद्धान्त’ के तकनीकी भाव से बचता है।
- source_word: ὡς προφητείαν
  choice: भविष्यवाणी के समान
  rationale: ὡς के तुलनात्मक बल को स्पष्ट रखता है और शिक्षा को सीधे भविष्यवाणी घोषित नहीं करता।
- source_word: ἐκχέω
  choice: उँडेलूँगा
  rationale: आगामी καταλείψω के साथ भविष्यकाल स्वाभाविक है; यह प्रचुरता से फैलाने के सजीव रूपक को बनाए रखता है।
- source_word: καταλείψω
  choice: छोड़ जाऊँगा
  rationale: किसी वस्तु को आने वालों के लिए विरासत के रूप में छोड़ने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: αὐτήν
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद ‘शिक्षा’ है; हिन्दी में ‘उसे’ स्वाभाविक संदर्भ देता है।
- source_word: εἰς γενεὰς αἰώνων
  choice: अनन्त पीढ़ियों के लिए
  rationale: यूनानी पदबंध की दीर्घ, कालातीत पीढ़ियों की धारणा को संक्षिप्त और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: ὡς προφητείαν में तुलना अथवा पहचान
  choice: 'तुलनात्मक: शिक्षा भविष्यवाणी के समान उँडेली जाती है'
  alternative: 'पहचानात्मक: शिक्षा भविष्यवाणी के रूप में उँडेली जाती है'
  rationale: ὡς दोनों अर्थ दे सकता है; मुख्य पाठ तुलनात्मक अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी दूसरे सम्भव पाठ को सुरक्षित रखती है और शिक्षा की सटीक भविष्यवाणी-संबंधी स्थिति पर अनावश्यक निर्णायक दावा नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली। ‘उँडेलूँगा’ मूल के सजीव रूपक को बनाए रखता है और ‘छोड़ जाऊँगा’ भावी पीढ़ियों के लिए विरासत छोड़ने का अर्थ स्वाभाविक रूप से देता है।
