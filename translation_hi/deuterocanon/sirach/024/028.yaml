translation:
  language: hi
  text: पहला उसे पूरी तरह न जान सका, और इसी प्रकार अन्तिम भी उसकी थाह न पा सका।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ συνετέλεσεν … γνῶναι
  choice: पूरी तरह न जान सका
  rationale: συντελέω के पूर्णता-बोध को सहज हिन्दी में व्यक्त करता है और γινώσκω के ‘जानना’ अर्थ को बनाए रखता है।
- source_word: ὁ πρῶτος
  choice: पहला
  rationale: यह पद संज्ञा के रूप में प्रयुक्त है और ὁ ἔσχατος के साथ खुले कालगत या पीढ़ीगत विरोध को सुरक्षित रखता है।
- source_word: αὐτήν
  choice: उसे / उसकी
  rationale: आसपास के प्रसंग में स्त्रीरूप में व्यक्त प्रज्ञा इसका पूर्वपद है; हिन्दी सर्वनाम व्याकरणतः लिंग नहीं दर्शाता, पर ‘उसकी थाह’ उसी व्यक्तीकृत सन्दर्भ को बनाए रखता है।
- source_word: καὶ οὕτως
  choice: और इसी प्रकार
  rationale: यह दोनों कथनों को समानान्तर रखता है, पहले को दूसरे का कारण नहीं बनाता।
- source_word: ὁ ἔσχατος
  choice: अन्तिम
  rationale: ‘पहला’ के साथ मूल का संतुलित और अनिर्दिष्ट कालगत विरोध बनाए रखता है।
- source_word: οὐκ ἐξιχνίασεν
  choice: थाह न पा सका
  rationale: ἐξιχνιάζω के पदचिह्नों का अनुसरण करके खोज निकालने और पूरी गहराई तक पहुँचने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यक्तीकृत प्रज्ञा का सन्दर्भ और स्त्रीलिंग
  choice: सर्वनाम का सन्दर्भ व्यक्तीकृत प्रज्ञा ही रखा गया है।
  alternative: प्रज्ञा को केवल अमूर्त और निर्वैयक्तिक वस्तु मानकर अनुवाद करना।
  rationale: सिराख 24 में प्रज्ञा स्त्री-वक्ता के रूप में व्यक्तीकृत है। हिन्दी का ‘उसे’ लिंग-निरपेक्ष रूप वाला सर्वनाम है, इसलिए सन्दर्भ को बनाए रखते हुए ऐसा कोई अतिरिक्त स्त्रीसूचक शब्द नहीं जोड़ा गया जो यूनानी से अधिक स्पष्टता लाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूरी तरह न जान सका’ मूल के कुछ असामान्य ‘जानना पूरा करना’ भाव को स्वाभाविक हिन्दी में देता है; ‘थाह न पा सका’ खोज की सीमा और प्रज्ञा की अगम्यता दोनों को व्यक्त करता है।
