lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: युग से पहले
  rationale: αἰών का मूल कालगत बोध बनाए रखता है और किसी विशिष्ट सीमित युग को अनिवार्य नहीं बनाता; प्रसंग आदिकालीन अस्तित्व का है।
- source_word: ἀπʼ ἀρχῆς
  choice: आरम्भ ही से
  rationale: काल के प्रारम्भ-बिंदु को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ आरम्भिकता पर हल्का बल देता है।
- source_word: ἔκτισέν με
  choice: उसने मुझे रचा
  rationale: κτίζω के स्पष्ट सृजनार्थ को सुरक्षित रखता है और व्यक्तिरूप बुद्धि के प्रथम पुरुष को ज्यों का त्यों प्रस्तुत करता है।
- source_word: ἕως αἰῶνος
  choice: युग-युग तक
  rationale: मुहावरेदार हिन्दी में निरन्तर, अनन्त अवधि का भाव देता है, बिना यूनानी वाक्यांश को कृत्रिम रूप से शब्दशः बनाने के।
- source_word: οὐ μὴ ἐκλίπω
  choice: मेरा अन्त कभी न होगा
  rationale: οὐ μή की प्रबल निषेधात्मकता और ἐκλείπω के अस्तित्व समाप्त होने के भाव—‘कभी समाप्त न होना’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या बुद्धि के उद्गम की भाषा को प्राणी होने के संकेत से बचाने के लिए नरम किया जाए
  choice: ‘उसने मुझे रचा’ बनाए रखा
  alternative: ‘उसने मुझे स्थापित किया’ या ‘उसने मुझे गढ़ा’
  rationale: ἔκτισεν का सीधा अर्थ ‘रचा/सृजा’ है। पाठ में व्यक्तिरूप बुद्धि बोल रही है; बाद की धर्मवैज्ञानिक बहस के आधार पर मूल शब्द को नरम करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘रचा’ सामान्य पाठक के लिए ‘सृष्टि की’ से अधिक प्रवाहपूर्ण है, जबकि मूल का धर्मवैज्ञानिक तनाव बनाए रखता है। ‘युग-युग तक’ अनन्त अवधि का परिचित बाइबिलीय मुहावरा है।
