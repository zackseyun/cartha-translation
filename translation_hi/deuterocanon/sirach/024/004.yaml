  text: I made my dwelling in the heights[a], and my throne was in a pillar of cloud;
translation:
  language: hi
  text: 'मैंने ऊँचाइयों में अपना निवास बनाया,

    और मेरा सिंहासन बादल के एक खंभे में था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादल के खंभे में।” यूनानी में इस पद के साथ निश्चित उपपद नहीं है, पर यह वाक्यांश संभवतः परमेश्वर की उपस्थिति और मार्गदर्शन से जुड़े प्रसिद्ध बादल के खंभे की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: अपना निवास बनाया
  rationale: यह क्रिया बसने या निवास करने का भाव व्यक्त करती है और तंबू डालकर रहने की हल्की प्रतिध्वनि भी रखती है। ‘अपना निवास बनाया’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी निवास के भाव को स्पष्ट रखता है।
- source_word: ἐν ὑψηλοῖς
  choice: ऊँचे स्थानों में
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त होकर ऊँचे अथवा स्वर्गीय स्थानों को सूचित करता है। यह अनुवाद उसके बहुवचन और स्थानवाचक बल को बनाए रखता है।
- source_word: θρόνος
  choice: सिंहासन
  rationale: मूल में राजकीय और महिमामय बिंब स्पष्ट है; हिन्दी में ‘सिंहासन’ उसका स्वाभाविक समतुल्य है।
- source_word: στύλῳ νεφέλης
  choice: बादल के एक खंभे में
  rationale: यह पद इस्राएल की जंगल-यात्रा से जुड़े बादल के खंभे की ओर संकेत करता प्रतीत होता है। यूनानी में निश्चित उपपद न होने के कारण मुख्य पाठ में ‘एक खंभे’ रखा गया है; ‘खंभा’ हिन्दी की परिचित बाइबलीय शब्दावली को बनाए रखता है।
theological_decisions:
- issue: ‘बादल के खंभे’ में जंगल-यात्रा के दौरान परमेश्वर की उपस्थिति और मार्गदर्शन की ओर संकेत
  choice: मुख्य पाठ में ‘बादल के एक खंभे में’ कहकर बिंब को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘बादल के खंभे में’
  rationale: अंतरपाठीय संकेत प्रबल है, पर पद स्वयं उसकी स्पष्ट व्याख्या नहीं करता। इसलिए अनिश्चित और निश्चित अर्थ के बीच के तनाव को मुख्य पाठ तथा पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में प्रस्तुत किया गया है।
