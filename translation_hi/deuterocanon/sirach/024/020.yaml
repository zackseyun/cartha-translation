  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: hi
  text: क्योंकि मेरा स्मरण[a] शहद से अधिक मधुर है, और मेरी विरासत शहद के छत्ते[b] से अधिक मधुर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरी याद’ अथवा ‘मेरा स्मारक।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, ‘शहद का मोम’; यह ‘शहद के छत्ते’ के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: मेरा स्मरण
  rationale: μνημόσυνον स्मरण, याद या स्मारक का अर्थ दे सकता है। यहाँ प्रज्ञा के प्रथम-पुरुष कथन में ‘मेरा स्मरण’ स्वाभाविक है और स्मरण किए जाने का भाव बनाए रखता है।
- source_word: ὑπὲρ μέλι γλυκύ
  choice: मधु से भी मीठा
  rationale: ὑπέρ के साथ γλυκύ यहाँ तुलनात्मक अर्थ देता है; हिन्दी में ‘से भी मीठा’ इस तुलना को स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: ἡ κληρονομία μου
  choice: मेरी विरासत
  rationale: κληρονομία का सीधा अर्थ विरासत या उत्तराधिकार है। ‘विरासत’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और यह अनिर्णीत रहने देता है कि प्रज्ञा की विरासत उससे प्राप्त भाग है या उसके द्वारा दिया गया धन।
- source_word: μέλιτος κηροῦ
  choice: मधु-छत्ता
  rationale: शाब्दिक संरचना ‘मधु का मोम’ है, पर यूनानी में यह मधु से भरे छत्ते की रूढ़ अभिव्यक्ति है। ‘मधु-छत्ता’ चित्रात्मकता को संक्षेप में रखता है।
theological_decisions:
- issue: प्रथम-पुरुष वक्ता का संदर्भ
  choice: प्रज्ञा को अपने विषय में बोलती हुई बनाए रखा गया है।
  alternative: पंक्ति को अमूर्त रूप देकर केवल प्रज्ञा की स्मृति या धरोहर कहना।
  rationale: सिराख 24 के प्रसंग में प्रज्ञा प्रथम पुरुष में अपना परिचय देती है। इसलिए ‘मेरा’ और ‘मेरी’ को बनाए रखकर व्यक्तित्वपूर्ण कथन को निर्जीव नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘मधु’ तथा ‘विरासत’ सामान्य पाठक के लिए बोधगम्य हैं; दोनों समानांतर खंडों में ‘से भी मीठा/मीठी’ दोहराकर यूनानी तुलना स्पष्ट की गई है।
