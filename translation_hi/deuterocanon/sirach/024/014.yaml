base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/014.yaml
  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
translation:
  language: hi
  text: समुद्र-तटों पर मैं खजूर के पेड़ के समान ऊँची उठी[a], और यरीहो में गुलाब के पौधों के समान; मैदान में शोभायमान जैतून के पेड़ के समान, और मैं चिनार के पेड़ के समान ऊँची उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शाब्दिक अर्थ ‘समुद्र-तटों पर’ है। खजूर के पेड़ का बिंब प्रायः मरूद्यान या नदी-तट से जोड़ा जाता है, इसलिए कुछ व्याख्याकार यहाँ किसी दूसरे मूल स्थान-नाम की संभावना मानते हैं; पर उपलब्ध यूनानी पाठ ‘समुद्र-तटों’ का ही समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φοῖνιξ
  choice: खजूर का पेड़
  rationale: इस वनस्पति-संबंधी उपमा में यूनानी शब्द ताड़-जाति के वृक्ष को दर्शाता है। हिन्दी में ‘खजूर का पेड़’ स्पष्ट, स्वाभाविक और इस बिंब के अनुकूल है।
- source_word: ἀνυψώθην
  choice: मैं ऊँची उठी
  rationale: यह प्रयोग वृक्ष की ऊँचाई और महिमा या उत्कर्ष—दोनों की छाया बनाए रखता है। स्त्रीलिंग रूप उस व्यक्तिरूप बुद्धि के वक्तव्य के अनुरूप है जो इस प्रसंग में बोल रही है।
- source_word: αἰγιαλοῖς
  choice: समुद्र-तटों पर
  rationale: यूनानी बहुवचन समुद्र के तटों या तटीय प्रदेशों को सूचित करता है। हिन्दी में ‘पर’ स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φυτὰ ῥόδου
  choice: गुलाब के पौधे
  rationale: यह अनुवाद φυτά के बहुवचन और वनस्पति-बिंब को बनाए रखता है तथा पौधों को अनावश्यक रूप से झाड़ी नहीं ठहराता।
- source_word: Ἰερειχώ
  choice: यरीहो
  rationale: यह स्थान-नाम का हिन्दी बाइबलीय रूप है।
- source_word: ἐλαία εὐπρεπής
  choice: शोभायमान जैतून का पेड़
  rationale: εὐπρεπής में सुंदरता, गरिमा और प्रभावशाली रूप का भाव है; ‘शोभायमान’ इस भाव को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: πεδίῳ
  choice: मैदान
  rationale: यह शब्द समतल, खुली भूमि को दर्शाता है; ‘मैदान’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: πλάτανος
  choice: चिनार का पेड़
  rationale: πλάτανος प्लेन वृक्ष को दर्शाता है। ‘चिनार’ हिन्दी में इसी वृक्ष-समूह का परिचित नाम है और इसे बाइबलीय गूलर से मिलाने की भूल से बचाता है।
theological_decisions:
- issue: ἀνυψώθην में शारीरिक ऊँचाई और उत्कर्ष का संयुक्त भाव
  choice: ऊँची उठी
  alternative: बड़ी हुई / ऊँची उठाई गई
  rationale: ‘ऊँची उठी’ वृक्ष-वृद्धि के दृश्य बिंब को स्वाभाविक रखता है और साथ ही व्यक्तिरूप बुद्धि के उत्कर्ष की ध्वनि को समाप्त नहीं करता; यह कर्ता को स्पष्ट करके निष्क्रिय रूप की संभावित अस्पष्टता को भी अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु काव्यात्मक उपमाओं के अनुरूप गरिमापूर्ण रखी गई है। समानांतर वाक्य-रचना और स्त्रीलिंग वक्ता को सुरक्षित रखा गया है।
