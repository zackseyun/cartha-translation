base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/032.yaml
  text: I will again make instruction shine like the dawn[c][b][a], and I will bring these things to light far into the distance.
translation:
  language: hi
  text: मैं फिर[a] शिक्षा को भोर के समान चमकाऊँगा, और इन बातों[b] को दूर-दूर तक उजागर करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब भी” अथवा “और भी।” यूनानी शब्द पिछले कथन की निरंतरता या उसमें एक और बात जोड़ने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से यूनानी में यहाँ बहुवचन “उन्हें” है, जबकि पहले “शिक्षा” एकवचन है। सम्भवतः संकेत शिक्षा की बातों या विषयवस्तु की ओर है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔτι
  choice: फिर
  rationale: यहाँ शब्द पिछले कथन को आगे बढ़ाते हुए एक और कार्य का संकेत देता है। ‘फिर’ आधुनिक हिन्दी में इस योगात्मक और निरंतरतामूलक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παιδείαν
  choice: शिक्षा
  rationale: सिराख में यह शब्द दंड मात्र नहीं, बल्कि चरित्र गढ़नेवाली शिक्षा और प्रशिक्षण को सूचित करता है; इस प्रसंग में ‘शिक्षा’ सबसे स्पष्ट और व्यापक विकल्प है।
- source_word: ὡς ὄρθρον
  choice: भोर के समान
  rationale: ὄρθρος दिन निकलने के समय को दर्शाता है। यह अनुवाद बढ़ते प्रकाश के काव्यात्मक बिंब को बनाए रखता है।
- source_word: φωτιῶ
  choice: चमकाऊँगा
  rationale: क्रिया का कर्म ‘शिक्षा’ है। ‘चमकाऊँगा’ हिन्दी में प्रकाश के बिंब को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκφανῶ
  choice: उजागर करूँगा
  rationale: इस क्रिया में प्रकट या दृष्टिगोचर करने का भाव है। ‘उजागर’ पहले खंड के प्रकाश-बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτά
  choice: इन बातों
  rationale: यूनानी में यह नपुंसकलिंग बहुवचन है और सम्भवतः शिक्षा की विषयवस्तु या उसकी बातों की ओर संकेत करता है। बहुवचन को बनाए रखने से मूल का व्याकरणिक तनाव सुरक्षित रहता है।
- source_word: ἕως εἰς μακράν
  choice: दूर-दूर तक
  rationale: यह स्थानिक विस्तार और व्यापक पहुँच का भाव देता है। ‘दूर-दूर तक’ हिन्दी में सहज है और शिक्षा के व्यापक प्रसार का चित्र बनाए रखता है।
theological_decisions:
- issue: αὐτά का संदर्भ
  choice: ‘इन बातों’ के रूप में बहुवचन रखा गया, जो शिक्षा की विषयवस्तु की ओर संकेत कर सकता है।
  alternative: इसे एकवचन ‘इसे’ मानकर ‘शिक्षा’ से सीधे जोड़ना।
  rationale: παιδείαν एकवचन है, पर αὐτά स्पष्टतः बहुवचन है। अनुवाद इस बदलाव को मिटाकर किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: प्रथम पुरुष वक्ता का हिन्दी में लिंग
  choice: पुल्लिंग भविष्यत् रूप ‘चमकाऊँगा/करूँगा’ प्रयुक्त किया गया।
  alternative: स्त्रीलिंग रूप, यदि वक्ता को इसी स्थान पर व्यक्तिरूप बुद्धि माना जाए।
  rationale: इस पद के निकटवर्ती साहित्यिक संदर्भ में वक्ता को शिक्षा प्रसारित करनेवाले लेखक/आचार्य के रूप में समझना सम्भव और स्वाभाविक है। फिर भी यूनानी प्रथम पुरुष क्रियाएँ स्वयं वक्ता का लिंग व्यक्त नहीं करतीं; इसलिए इस विवश हिन्दी चयन को व्याख्यात्मक निर्णायकता नहीं दी जानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘भोर’, ‘चमकाऊँगा’ और ‘उजागर’ मूल के प्रकाश-बिंब को एकसूत्र में रखते हैं। ‘दूर-दूर तक’ सामान्य पाठक के लिए सहज है। हिन्दी में प्रथम पुरुष भविष्यत् क्रिया के अनिवार्य लिंग-चयन को संदर्भ के आधार पर पुल्लिंग रखा गया है और उसकी मूल-भाषागत अस्पष्टता निर्णय-टिप्पणी में दर्ज है।
