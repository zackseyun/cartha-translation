base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: hi
  text: नूह धर्मी और निष्कलंक पाया गया; विनाश के समय वह बदले के रूप में ठहरा[a]। उसके कारण एक शेष बचा रहा, और उसकी वाचा के द्वारा जलप्रलय थम गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह स्थानापन्न,” “प्रतिपूर्ति,” अथवा “छुड़ौती-मूल्य बना।” इब्रानी תחליף और यूनानी ἀντάλλαγμα, दोनों में किसी के बदले दी या रखी गई वस्तु का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर पाठ का अंतिम उपवाक्य भिन्न है और जलप्रलय के थमने के बजाय उसके आने की ओर संकेत करता प्रतीत होता है। यहाँ अपनाए गए इब्रानी पाठ में है, “और उसकी वाचा के द्वारा जलप्रलय थम गया।”
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: नूह
  rationale: यह इस बाइबलीय नाम का मानक हिन्दी रूप है।
- source_word: צדיק
  choice: धर्मी
  rationale: यह नैतिक खराई और परमेश्वर के सम्मुख उचित ठहरने के बाइबलीय भाव को व्यक्त करता है तथा यूनानी δίκαιος के अनुरूप है।
- source_word: תמים
  choice: निर्दोष
  rationale: यहाँ शब्द नूह की अखंड निष्ठा और निष्कलंक चाल का वर्णन करता है, न कि निरपेक्ष सिद्धता का।
- source_word: לעת כלה
  choice: विनाश के समय
  rationale: כלה यहाँ केवल किसी अवधि के अंत को नहीं, बल्कि विनाशकारी समाप्ति को सूचित करता है।
- source_word: תחליף
  choice: बदले में ठहरा
  rationale: शब्द में किसी दूसरे के स्थान पर होने, विनिमय, प्रतिपूर्ति या छुड़ौती-मूल्य का भाव हो सकता है। यह अनुवाद उस व्यापक अर्थ-सीमा को किसी एक संकीर्ण धार्मिक व्याख्या में बाँधे बिना रखता है।
- source_word: בעבורו
  choice: उसके कारण
  rationale: यह नूह को शेष के बचने का कारण बताने वाली स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: שארית
  choice: एक शेष बचा रहा
  rationale: ‘शेष’ न्याय या विनाश के बीच सुरक्षित बचे हुए अंश अथवा लोगों के बाइबलीय भाव को बनाए रखता है।
- source_word: ובבריתו
  choice: उसकी वाचा के द्वारा
  rationale: ב को यहाँ साधनसूचक माना गया है; प्रत्यय स्वाभाविक रूप से नूह से जुड़ी वाचा की ओर संकेत करता है।
- source_word: חדל מבול
  choice: जलप्रलय थम गया
  rationale: חדל का सीधा अर्थ रुकना या समाप्त होना है; ‘जलप्रलय’ מבול के लिए प्रचलित और स्पष्ट हिन्दी शब्द है।
theological_decisions:
- issue: अंतिम उपवाक्य में इब्रानी और यूनानी पाठों का अंतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण: ‘उसकी वाचा के द्वारा जलप्रलय थम गया।’'
  alternative: दिया गया यूनानी समानांतर पाठ जलप्रलय के आने की ओर संकेत करता प्रतीत होता है, उसके थमने की ओर नहीं।
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध और स्पष्ट है, वहाँ उसी को प्राथमिक स्रोत माना गया है। चूँकि इस पाठांतर से अर्थ में वास्तविक परिवर्तन आता है, यूनानी साक्ष्य को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मी,’ ‘शेष,’ ‘वाचा’ और ‘जलप्रलय’ जैसे परिचित बाइबलीय शब्द मूल के अर्थ-संबंधों को बनाए रखते हैं; कठिन תחליף की अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
