base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/020.yaml
  text: who kept the commandments of the Most High and entered into covenant with him[a]. In his flesh he cut for him a statute[b], and in testing he was found faithful.
translation:
  language: hi
  text: 'जिसने परमप्रधान की आज्ञाओं का पालन किया

    और उसके साथ वाचा में प्रवेश किया।

    उसने अपने शरीर पर उसके लिए एक विधान काटा[a][b],

    और परीक्षा में वह विश्वासयोग्य पाया गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “उसने अपने शरीर में उसके साथ वाचा स्थापित की।” इब्रानी साक्ष्य यहाँ “विधान” पढ़ता है।'
    reason: alternative_reading
  - marker: b
    text: “अपने शरीर में” संभवतः खतने की ओर संकेत करता है, जो अब्राहम के साथ वाचा का शारीरिक चिह्न था।
    reason: cross_reference
lexical_decisions:
- source_word: שמר מצות
  choice: आज्ञाओं का पालन किया
  rationale: आज्ञाओं के साथ שמר का आशय निष्ठापूर्वक मानना और उनका पालन करना है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: עליון
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: ובא בברית עמו
  choice: और उसके साथ वाचा में प्रवेश किया
  rationale: यह इब्रानी के ‘उसके साथ वाचा में आया’ को स्वाभाविक हिन्दी में व्यक्त करता है और वाचा-संबंध के आरम्भ का भाव बनाए रखता है।
- source_word: בבשרו
  choice: अपने शरीर में
  rationale: मूल का ठोस शारीरिक बिंब सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से सीधे ‘खतना’ नहीं बनाया गया।
- source_word: כרת לו חק
  choice: उसके लिए एक विधान काटकर अंकित किया
  rationale: חק के लिए ‘विधान’ इब्रानी पाठ का अनुसरण करता है। ‘काटकर अंकित किया’ כרת की काटने संबंधी ठोस छवि को शरीर के संदर्भ में बनाए रखते हुए हिन्दी में उसके आशय को समझने योग्य बनाता है।
- source_word: בניסוי
  choice: परीक्षा में
  rationale: यह परखे जाने की स्थिति बताता है और ‘प्रलोभन’ जैसा अनावश्यक नैतिक अर्थ नहीं जोड़ता।
- source_word: נמצא נאמן
  choice: विश्वासयोग्य पाया गया
  rationale: यह मूल की निष्क्रिय रचना और वाचा-संबंधी निष्ठा, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: शरीर में विधान काटकर अंकित करने का अब्राहम के खतने से संबंध
  choice: शारीरिक और संकेतात्मक भाषा को मुख्य पाठ में बनाए रखा गया, पर ‘खतना’ स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘उसने खतना करवाकर अपने शरीर पर वाचा का चिह्न पाया’ जैसे स्पष्ट व्याख्यात्मक रूप में अनुवाद करना।
  rationale: संदर्भ इस वाक्य को अब्राहम के खतने से जोड़ता है, लेकिन मूल पाठ संक्षिप्त और संकेतात्मक है; अनुवाद को इस संकेत को सिद्धांतात्मक विस्तार में नहीं बदलना चाहिए।
- issue: तीसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी חק के अनुसार ‘विधान’ रखा गया।
  alternative: यूनानी διαθήκην के अनुसार ‘उसने अपने शरीर में उसके साथ वाचा स्थापित की’ पढ़ना।
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है, जबकि अर्थपूर्ण यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। काव्यात्मक पंक्ति-विन्यास मूल के खंडों को स्पष्ट करता है। ‘वाचा’, ‘परमप्रधान’ और ‘विश्वासयोग्य’ जैसे स्थापित धर्मग्रंथीय शब्द रखे गए हैं, जबकि पाठ की संक्षिप्तता और इब्रानी-यूनानी तनाव को नहीं मिटाया गया।
