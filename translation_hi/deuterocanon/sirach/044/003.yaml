base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/003.yaml
  text: rulers of the land in their kingdoms[a], and men renowned for their might; counselors in their understanding[b], and seers of all things in their prophecy.
translation:
  language: hi
  text: अपने-अपने राज्यों में देश पर शासन करने वाले[a], और अपने पराक्रम के लिए प्रसिद्ध पुरुष; अपनी सूझ-बूझ से परामर्श देने वाले, और अपनी भविष्यसूचक वाणी में सब कुछ देखने वाले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी דורי ארץ कठिन है; यूनानी समानांतर पाठ में ‘अपने राज्यों में प्रभुत्व करने वाले’ है, जो ‘देश पर शासन करने वाले’ अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘सब कुछ के द्रष्टा।’ यहाँ इब्रानी बहुत संक्षिप्त है; यूनानी समानांतर पाठ अधिक स्पष्ट रूप से ‘भविष्यवाणियों में घोषणा करने वाले’ कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: देश पर शासन करनेवाले
  rationale: इब्रानी पद कठिन है, पर במלכותם और यूनानी κυριεύοντες के साथ इसका आशय राजनीतिक शासन करनेवालों से है। यह अनुवाद अर्थ स्पष्ट रखते हुए ‘देश’ के ठोस राजनीतिक संदर्भ को बनाए रखता है।
- source_word: במלכותם
  choice: अपने-अपने राज्यों में
  rationale: מלכות का अर्थ राज्य, राजत्व या शासनकाल हो सकता है। यूनानी बहुवचन और प्रसंग के अनुसार ‘राज्यों में’ स्वाभाविक है; ‘अपने-अपने’ हिन्दी में वितरणात्मक भाव स्पष्ट करता है।
- source_word: אנשי שם
  choice: प्रसिद्ध पुरुष
  rationale: शाब्दिक अर्थ ‘नामवाले पुरुष’ है, जो यश या ख्याति का मुहावरा है। इब्रानी के स्पष्ट पुल्लिंग को सुरक्षित रखा गया है।
- source_word: בגבורתם
  choice: अपने पराक्रम के लिए
  rationale: גבורה सामर्थ्य, वीरता और पराक्रम का बोध कराता है। इस सम्मान-सूची में ‘पराक्रम’ वीर सामर्थ्य को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: היועצים
  choice: परामर्श देनेवाले
  rationale: यह कृदंत रूप बुद्धिमान सलाह देनेवालों के एक वर्ग को दर्शाता है। हिन्दी में यह संज्ञा ‘परामर्शदाता’ की अपेक्षा अधिक सहज और क्रियाशील है।
- source_word: בתבונתם
  choice: अपनी सूझ-बूझ से
  rationale: תבונה समझ, अंतर्दृष्टि और विवेक को व्यक्त करता है। ‘सूझ-बूझ’ आधुनिक सामान्य हिन्दी में बौद्धिक और व्यावहारिक विवेक दोनों समेटता है।
- source_word: וחוזי כל
  choice: और ... सब कुछ देखनेवाले
  rationale: חוזי का मूल अर्थ ‘द्रष्टा’ है और כל का प्रयोग अत्यंत संक्षिप्त तथा कुछ अस्पष्ट है। मुख्य पाठ इब्रानी की व्यापकता बनाए रखता है; पादटिप्पणी वैकल्पिक समझ और यूनानी साक्ष्य बताती है।
- source_word: בנבואתם
  choice: अपनी भविष्यवाणी में
  rationale: נבואה भविष्यवाणी या भविष्यसूचक वाणी का संकेत करता है। एकवचन भाववाचक रूप को हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: इस्राएल के सम्मानित पूर्वजों की सूची में पुल्लिंग भाषा
  choice: प्रसिद्ध पुरुष
  alternative: प्रसिद्ध लोग / विख्यात जन
  rationale: इब्रानी אנשי स्पष्ट रूप से पुल्लिंग है; इसलिए पाठ को लिंग-निरपेक्ष बनाकर मूल का विवरण नहीं बदला गया।
- issue: द्रष्टाओं के ज्ञान के विस्तार और भविष्यसूचक घोषणा के बीच अस्पष्टता
  choice: अपनी भविष्यवाणी में सब कुछ देखनेवाले
  alternative: भविष्यवाणियों में घोषणा करनेवाले
  rationale: इब्रानी וחוזי כל को प्राथमिकता देकर उसकी व्यापक और तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है, जबकि यूनानी अधिक स्पष्ट रूप से भविष्यसूचक घोषणा कहता है; उस विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक सूची-शैली रखी गई है। ‘शासन करनेवाले’, ‘पराक्रम’, ‘सूझ-बूझ’ और ‘भविष्यवाणी’ सामान्य पाठकों के लिए बोधगम्य हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
