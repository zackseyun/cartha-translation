base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/001.yaml
  text: Let us now praise godly men[a], our fathers in their generations.
translation:
  language: hi
  text: अब मैं प्रेम और निष्ठा से भरे पुरुषों[a] की प्रशंसा करूँगा—हमारे उन पुरखों की, जो अपनी-अपनी पीढ़ियों में हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “आओ, अब हम यशस्वी पुरुषों की और अपनी पीढ़ी में हमारे पुरखों की प्रशंसा करें।” इब्रानी में “प्रेम और निष्ठा से भरे पुरुष” है और आरंभिक क्रिया एकवचन में है; इब्रानी में “पीढ़ियों” बहुवचन है।'
    reason: इब्रानी और यूनानी साक्ष्यों में वर्णन, क्रिया के वचन और ‘पीढ़ी’ के वचन का पाठांतर।
lexical_decisions:
- source_word: אהללה נא
  choice: अब मैं ... प्रशंसा करूँगा
  rationale: प्राप्त इब्रानी पाठ का क्रियारूप प्रथम पुरुष एकवचन और इच्छासूचक भाव रखता है; आधुनिक हिन्दी में भविष्यत् रूप इसके संकल्पात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है। נא को ‘अब’ से व्यक्त किया गया है। यूनानी का बहुवचन आह्वान पादटिप्पणी में सुरक्षित है।
- source_word: אנשי חסד
  choice: निष्ठावान पुरुषों
  rationale: חסד में दया, अटल निष्ठा और विश्वस्त प्रेम का अर्थक्षेत्र है। ‘निष्ठावान’ संक्षिप्त और स्वाभाविक हिन्दी है तथा केवल ‘दयालु’ या व्याख्यात्मक ‘भक्त’ की अपेक्षा इस प्रसंग में पूर्वजों के स्थिर सद्गुण को बेहतर व्यक्त करता है। यूनानी ‘यशस्वी पुरुषों’ का भिन्न पाठ पादटिप्पणी में दिया गया है।
- source_word: אבותינו
  choice: हमारे ... पुरखों
  rationale: ‘पुरखे’ इब्रानी के स्पष्ट पितृवाचक शब्द को आधुनिक, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: בדורותם
  choice: जो अपनी-अपनी पीढ़ियों में हुए
  rationale: इब्रानी बहुवचन ‘उनकी पीढ़ियों में’ को शब्दशः रखने पर हिन्दी असहज होती; संबंधवाचक वाक्य विन्यास अलग-अलग ऐतिहासिक पीढ़ियों का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सम्मानित पूर्वजों के वर्णन में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी אנשי חסד के अनुसार ‘निष्ठावान पुरुषों’ को रखा गया है।
  alternative: यूनानी के अनुसार ‘यशस्वी पुरुषों’।
  rationale: जहाँ इब्रानी साक्ष्य उपलब्ध है, उसे प्राथमिकता दी गई है; किंतु पूर्वजों के चरित्र-वर्णन को प्रभावित करने वाला वास्तविक यूनानी पाठांतर पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
- issue: आरंभिक क्रिया का वचन
  choice: 'इब्रानी के अनुसार प्रथम पुरुष एकवचन: ‘अब मैं ... प्रशंसा करूँगा’।'
  alternative: 'यूनानी के अनुसार सामूहिक आह्वान: ‘आओ, अब हम ... प्रशंसा करें’।'
  rationale: प्राप्त इब्रानी रूप אהללה को उसके स्वाभाविक प्रथम पुरुष एकवचन अर्थ में रखा गया है। यूनानी समानांतर का बहुवचन पाठ पादटिप्पणी में दिया गया है, जिससे पाठगत तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘पुरखे’ सामान्य पाठक के लिए ‘पितरों’ से अधिक स्वाभाविक है; डैश इब्रानी के समानाधिकरण को स्पष्ट करता है।
