translation:
  language: hi
  text: परमप्रधान ने भरपूर सम्मान बाँटा[a][b], और उसकी महानता सनातन काल से है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: काहिरा गेनीज़ा के इब्रानी पाठ में חלק עליון है, जबकि पुरानी मसादा-पांडुलिपि में חולק עליון मिलता है; मसादा का पाठ ‘परमप्रधान ने बाँटा’ अर्थ का समर्थन करता है। यूनानी समानांतर पाठ में है, ‘प्रभु ने बहुत महिमा रची।’
    reason: textual_variant
  - marker: b
    text: या ‘भरपूर महिमा।’ इब्रानी כבוד और यूनानी δόξα का अर्थ प्रसंग के अनुसार ‘सम्मान’ या ‘महिमा’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘प्राचीन काल से’ अथवा ‘अनादि काल से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: רב
  choice: भरपूर
  rationale: רב यहाँ כבוד की प्रचुरता या महान मात्रा बताता है। ‘भरपूर’ आधुनिक हिन्दी में सहज है और ‘बहुत’ से अधिक गरिमापूर्ण ढंग से यही भाव व्यक्त करता है।
- source_word: כבוד
  choice: सम्मान
  rationale: כבוד का अर्थ ‘सम्मान’ या ‘महिमा’ हो सकता है। प्रसिद्ध पूर्वजों की प्रशंसा आरम्भ करने वाले इस प्रसंग में बाँटे जाने वाले सम्मान का भाव स्वाभाविक है; वैकल्पिक अर्थ ‘महिमा’ पादटिप्पणी में रखा गया है।
- source_word: חלק / חולק
  choice: बाँटा
  rationale: काहाना के संयुक्त काहिरा-गेनीज़ा पाठ חלק और पुराने मसादा पाठ חולק को साथ देखकर परमप्रधान को कर्ता और क्रिया को ‘बाँटा’ समझना उचित है। यह सरल हिन्दी में वितरण का भाव स्पष्ट रखता है।
- source_word: עליון
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है। ‘परमप्रधान’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित, संक्षिप्त और गरिमापूर्ण है।
- source_word: וגדלו
  choice: और उसकी महानता
  rationale: इसे संज्ञा גדל के साथ प्रत्यय, अर्थात ‘उसकी महानता’, समझा गया है; यूनानी μεγαλωσύνην αὐτοῦ भी इस अर्थ का समर्थन करता है। सर्वनाम परमप्रधान की ओर संकेत करता है।
- source_word: מימות עולם
  choice: सनातन काल से
  rationale: यह पदबंध अत्यन्त प्राचीन समय अथवा अनादि काल को सूचित कर सकता है। परमप्रधान की महानता के विषय में ‘सनातन काल से’ अर्थ की व्यापकता और धार्मिक तनाव को बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में हैं।
theological_decisions:
- issue: पहले खंड का कर्ता और क्रियात्मक पाठ
  choice: 'परमप्रधान कर्ता है: ‘परमप्रधान ने भरपूर सम्मान बाँटा।’'
  alternative: ‘प्रभु ने बहुत महिमा रची’ अथवा ‘बड़ा सम्मान परमप्रधान का भाग है।’
  rationale: विद्यमान इब्रानी को प्राथमिकता दी गई है, और मसादा का חולק स्पष्ट रूप से क्रियात्मक अर्थ ‘बाँटता/बाँटा’ का समर्थन करता है। यूनानी में ἔκτισεν (‘रचा’) भिन्न पाठ या व्याख्यात्मक अनुवाद को दर्शाता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे खंड का संबंध
  choice: 'इसे स्वतंत्र कथन माना गया है: ‘उसकी महानता सनातन काल से है।’'
  alternative: ‘और सनातन काल से चली आ रही अपनी महानता [भी उसने बाँटी]।’
  rationale: इब्रानी में योजक क्रिया नहीं है, इसलिए दोनों रचनाएँ संभव हैं। दिए गए इब्रानी पाठ में וגדלו को ‘उसकी महानता’ मानते हुए स्वतंत्र कथन हिन्दी में स्वाभाविक है; फिर भी क्रिया ‘बाँटा’ के दूसरे कर्म के रूप में इसका संबंध पूरी तरह असंभव नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘परमप्रधान’ और ‘सनातन काल’ पद की गरिमा बनाए रखते हैं, जबकि ‘भरपूर सम्मान बाँटा’ साधारण पाठक के लिए सहज और स्पष्ट है। सभी पाठगत और अर्थगत विकल्प पादटिप्पणियों में दिए गए हैं।
