base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/018.yaml
  text: An everlasting covenant was cut with him[a], that all flesh might not be destroyed.
translation:
  language: hi
  text: उसके साथ एक अनन्तकाल की वाचा बाँधी गई, ताकि समस्त प्राणियों का विनाश न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “ताकि जलप्रलय द्वारा समस्त प्राणी मिट न जाएँ।” इससे नूह का प्रसंग स्पष्ट हो जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: באות עולם
  choice: सदा की वाचा
  rationale: प्रस्तुत हिब्रू पाठ का आशय स्थायी अथवा चिरस्थायी वाचा है। आधुनिक हिन्दी में “सदा की वाचा” सहज है और עולם की दीर्घकालिकता को बनाए रखता है।
- source_word: נכרת עמו
  choice: उसके साथ ... वाचा बाँधी गई
  rationale: हिब्रू में वाचा के साथ כרת, अर्थात् शाब्दिक रूप से “काटना,” प्रचलित मुहावरा है। हिन्दी का बाइबलीय और स्वाभाविक समतुल्य “वाचा बाँधना” स्रोत के वाचागत भार को बनाए रखता है, जबकि “वाचा काटना” अस्वाभाविक होता।
- source_word: לבלתי השחית
  choice: ताकि ... नष्ट न किए जाएँ
  rationale: לבלתי उद्देश्य अथवा परिणाम का निषेध व्यक्त करता है; “ताकि ... न” आधुनिक हिन्दी में स्पष्ट है। कर्मवाच्य रूप विनाश के कार्य को व्यक्त करता है, बिना कर्ता को पाठ से अधिक स्पष्ट किए।
- source_word: כל בשר
  choice: सब प्राणी
  rationale: शाब्दिक अर्थ “समस्त देह” है, पर जलप्रलय के प्रसंग में यह मानव मात्र के बजाय व्यापक रूप से जीवधारियों को दर्शाता है। “सब प्राणी” आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से व्यापक है।
theological_decisions:
- issue: क्या यूनानी समानांतर पाठ के आधार पर जलप्रलय का स्पष्ट उल्लेख किया जाए
  choice: मुख्य पाठ में हिब्रू का व्यापक कथन रखा गया और जलप्रलय नहीं जोड़ा गया।
  alternative: ताकि जलप्रलय से सब प्राणी मिट न जाएँ
  rationale: उपलब्ध हिब्रू पाठ में जलप्रलय का स्पष्ट शब्द नहीं है, जबकि यूनानी में κατακλυσμῷ इसे स्पष्ट करता है। इसलिए मुख्य पाठ हिब्रू का अनुसरण करता है और यूनानी पाठांतर को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “वाचा बाँधी गई” हिन्दी में स्वाभाविक बाइबलीय पदावली है; “सब प्राणी” शाब्दिक “समस्त देह” का प्रसंगानुकूल, व्यापक अर्थ देता है।
