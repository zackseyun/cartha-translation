base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: hi
  text: इसी कारण उसने उससे शपथ खाकर यह वचन पक्का किया कि उसके वंश में जातियाँ आशीष पाएँगी, और वह उन्हें समुद्र से समुद्र तक[a] और महानद[b] से पृथ्वी के छोर तक का उत्तराधिकारी बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उद्धृत इब्रानी पाठ का अक्षरशः रूप ‘जल से समुद्र तक’ है; यूनानी समानांतर पाठ में ‘समुद्र से समुद्र तक’ है, जो सम्भवतः अभिप्रेत प्रादेशिक सूत्र को सुरक्षित रखता है। अनुवाद में इसी अर्थ को अपनाया गया है।
    reason: textual_variant
  - marker: b
    text: प्रादेशिक प्रतिज्ञाओं की बाइबलीय भाषा में ‘महानद’ से सामान्यतः फ़रात नदी अभिप्रेत होती है।
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: इसी कारण
  rationale: यह पद पिछले प्रसंग से निकलने वाले परिणाम को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट संयोजक है।
- source_word: בשבועה הקים לו
  choice: उसने शपथ खाकर उसके लिए यह पक्का किया
  rationale: הקים और शपथ-संबंधी वाक्यांश किसी प्रतिज्ञा को दृढ़ या स्थापित करने का भाव देते हैं। निहित प्रतिज्ञा के लिए ‘यह’ जोड़ा गया है।
- source_word: לברך בזרעו גוים
  choice: कि उसके वंश में जातियाँ आशीष पाएँगी
  rationale: यह अब्राहम से जुड़ी प्रतिज्ञा की भाषा को प्रतिध्वनित करता है। यूनानी समानांतर पाठ निष्क्रिय अर्थ का समर्थन करता है; इससे आशीष देने की रीति या माध्यम को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: זרעו
  choice: उसके वंश
  rationale: यह सामूहिक एकवचन है और संतान/वंशजों को समेटता है। ‘वंश’ आधुनिक हिन्दी में स्वाभाविक रहते हुए वाचा-संबंधी सामूहिक भाव बनाए रखता है।
- source_word: להנחילם
  choice: वह उन्हें … भूभाग विरासत में देगा
  rationale: हिफ़ील रूप विरासत दिलाने या विरासत के रूप में देने का अर्थ रखता है। ‘उन्हें’ मूल के बहुवचन कर्म-सर्वनाम को बनाए रखता है, जबकि ‘भूभाग’ सीमा-सूचक वाक्यांश को हिन्दी में स्पष्ट करता है।
- source_word: מים עד ים
  choice: समुद्र से समुद्र तक
  rationale: उद्धृत इब्रानी में מים है, जो ‘जल से समुद्र तक’ भी पढ़ा जा सकता है; किंतु यूनानी ἀπὸ θαλάσσης ἕως θαλάσσης और परिचित सीमावर्ती सूत्र ‘समुद्र से समुद्र तक’ पाठ का प्रबल समर्थन करते हैं।
- source_word: ומנהר
  choice: और महानद से
  rationale: सीमावर्ती प्रतिज्ञा की बाइबलीय भाषा में ‘नदी/महानद’ से सामान्यतः फ़रात अभिप्रेत है। मुख्य पाठ में उसका नाम जोड़े बिना पारंपरिक निश्चित संकेत बनाए रखा गया है।
- source_word: עד אפסי ארץ
  choice: पृथ्वी के छोर तक
  rationale: यह दूरस्थ सीमाओं के लिए प्रचलित बाइबलीय मुहावरे का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अब्राहमी प्रतिज्ञा में आशीष की वाच्यता और माध्यम
  choice: उसके वंश में जातियाँ आशीष पाएँगी
  alternative: वह उसके वंश के द्वारा जातियों को आशीष देगा
  rationale: इब्रानी infinitive सक्रिय रूप में भी समझा जा सकता है, पर यूनानी समानांतर निष्क्रिय वाच्यता का स्पष्ट समर्थन करता है। चुना हुआ रूप आशीष की कर्तृता या माध्यम को अधिक संकीर्ण ढंग से तय नहीं करता।
- issue: להנחילם में बहुवचन सर्वनाम का संदर्भ
  choice: मूल के समान ‘उन्हें’ बनाए रखा गया
  alternative: स्पष्ट रूप से ‘उसके वंशजों को’ कहना
  rationale: संदर्भ में सर्वनाम संभवतः अब्राहम के वंश की ओर लौटता है, पर निकटवर्ती बहुवचन ‘जातियाँ’ के कारण व्याकरणिक तनाव मौजूद है। स्पष्ट संज्ञा जोड़कर इस तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आशीष पाएँगी’, ‘वंश’ और ‘विरासत’ बाइबलीय प्रतिज्ञा की प्रतिध्वनि बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचते हैं।
