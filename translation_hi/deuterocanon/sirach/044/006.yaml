  text: Men of valor[a], steadfast in strength, and at ease in their place.
translation:
  language: hi
  text: वीर पुरुष[a], सामर्थ्य में दृढ़, और अपने-अपने स्थान पर शांतिपूर्वक रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “धनी पुरुष, सामर्थ्य से संपन्न, और अपनी बस्तियों में शांतिपूर्वक रहने वाले।” यहाँ इब्रानी पाठ को मुख्य आधार बनाया गया है; यूनानी पाठ को तुलना और संगति-जांच के लिए देखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  choice: वीर पुरुष
  rationale: यह इब्रानी पद सामर्थ्य, योग्यता और वीरता से युक्त पुरुषों को दर्शाता है। प्रशंसात्मक संदर्भ में ‘वीर पुरुष’ इसका स्वाभाविक और संक्षिप्त हिन्दी रूप है; इसे केवल धन-संपत्ति तक सीमित नहीं करता।
- source_word: וסמכי כח
  choice: सामर्थ्य में दृढ़
  rationale: סמכי में टिके या दृढ़ होने का भाव और כח में बल अथवा सामर्थ्य का अर्थ है। यह अनुवाद पद की कुछ हद तक मुहावरेदार प्रकृति को स्वाभाविक हिन्दी में रखता है।
- source_word: ושוקטים
  choice: निश्चिंत
  rationale: यह कृदन्त शांति, चैन और स्थिर विश्राम की दशा बताता है। ‘निश्चिंत’ यहाँ सम्मानित पूर्वजों के शांत और सुरक्षित जीवन का स्वाभाविक बोध कराता है; यूनानी εἰρηνεύοντες भी शांतिपूर्ण दशा की पुष्टि करता है।
- source_word: על מכונתם
  choice: अपने स्थान में
  rationale: מכונה किसी स्थिर स्थान, आधार या स्थापित स्थिति को सूचित कर सकता है। ‘अपने स्थान में’ इस व्यापकता को बनाए रखता है और ‘निवासों’ जैसा अनावश्यक रूप से विशिष्ट अर्थ नहीं थोपता।
