  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। पद की काव्यात्मक सूची-संरचना और इब्रानी की अर्थगत व्यापकता को यथासंभव सुरक्षित रखा गया है।
