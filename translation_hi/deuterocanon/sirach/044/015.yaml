  text: Their wisdom is proclaimed by the assembly[b][a], and their praise is recounted by the congregation.
translation:
  language: hi
  text: उनकी बुद्धि को सभा दोहराती है,[a][b] और मंडली उनकी प्रशंसा का वर्णन करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: काहिरा गनीज़ा की इब्रानी पांडुलिपियों के संयुक्त पाठ का अर्थ है, “उनकी बुद्धि को सभा दोहराती है, और मंडली उनकी प्रशंसा का वर्णन करती है।” यूनानी समानांतर पाठ में है, “देश-देश के लोग उनकी बुद्धि का वर्णन करेंगे, और सभा उनकी प्रशंसा की घोषणा करती है।” मुख्य पाठ यहाँ प्राथमिक इब्रानी साक्ष्य का अनुसरण करता है; यूनानी में कर्ता अधिक व्यापक, अर्थात् “देश-देश के लोग,” है।
    reason: alternative_reading
  - marker: b
    text: इस पद के स्थान पर मसादा की पुस्तक-पट्टी खंडित है। उसमें केवल अंतिम वाक्यांश के अंश बचे हैं, जो “उनकी प्रशंसा ... मंडली/सभा” के अनुरूप हैं; पूरी पंक्ति सुरक्षित नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  choice: उनकी बुद्धि
  rationale: חכמה के साथ तृतीय पुरुष बहुवचन प्रत्यय का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: תשנה
  choice: दोहराती है
  rationale: שנה का यहाँ अर्थ ‘दोहराना/फिर से सुनाना’ है। सक्रिय रचना हिन्दी में स्वाभाविक है और हिब्रू में עדה को क्रिया के कर्ता के रूप में बनाए रखती है।
- source_word: עדה
  choice: सभा
  rationale: एकत्र समुदाय का सामान्य और गरिमापूर्ण रूप; इससे समानांतर קהל के लिए अलग शब्द रखा जा सकता है।
- source_word: ותהלתם
  choice: और ... उनकी प्रशंसा
  rationale: תהלה यहाँ उनके विषय में कही जाने वाली प्रशंसा को सूचित करता है। हिन्दी शब्दक्रम के अनुसार इसे क्रिया से पहले रखा गया है।
- source_word: יספר
  choice: वर्णन करती है
  rationale: ספר का भाव बताने या सुनाने का है; ‘वर्णन करती है’ सार्वजनिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קהל
  choice: मंडली
  rationale: एकत्र जनसमुदाय का अर्थ देता है और עדה के ‘सभा’ से काव्यात्मक समानता तथा शब्दगत भिन्नता दोनों बचाता है।
