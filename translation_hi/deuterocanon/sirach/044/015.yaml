  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक समानांतरता रखी गई है। ‘दोहराती है’ इब्रानी תשנה के मूल पुनःकथन/पाठ करने के भाव को ‘घोषणा करती है’ की अपेक्षा अधिक निकटता से बचाता है। ‘सभा’ और ‘मंडली’ क्रमशः עדה और קהל की समानार्थक किन्तु भिन्न सामुदायिक संज्ञाएँ हैं।
