  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
translation:
  language: hi
  text: उनके शरीर शांति में इकट्ठे किए गए[b][a], और उनका नाम पीढ़ी-दर-पीढ़ी जीवित रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उनका शरीर शांति में दफनाया गया।” जहाँ इब्रानी में “शांति में इकट्ठे किए गए” है, वहाँ यूनानी अंत्येष्टि का अर्थ स्पष्ट कर देता है।'
    reason: alternative_reading
  - marker: b
    text: मसादा की पांडुलिपि में यहाँ छोटा पाठ सुरक्षित है (“यदि/शांति में वे इकट्ठे किए गए”), जबकि काहिरा गनीज़ा के पाठ में है, “उनके शरीर शांति में इकट्ठे किए गए।”
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: उनके शरीर
  rationale: גויה शरीर अथवा शव को दर्शाता है। सन्दर्भ में बहुवचन ‘उनके शरीर’ स्वाभाविक है और इब्रानी रूप को यूनानी के सामूहिक एकवचन पर प्राथमिकता देता है।
- source_word: בשלום
  choice: शान्ति से
  rationale: यह בשלום का स्वाभाविक आधुनिक हिन्दी रूप है और मृत्यु के प्रसंग में निहित शान्तिपूर्ण भाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: נאספו
  choice: समेटे गए
  rationale: אסף का कर्मवाच्य मृत्यु में ‘समेटे जाने’ का मुहावरा हो सकता है। ‘समेटे गए’ इब्रानी रूपक को सुरक्षित रखता है और मुख्य पाठ में यूनानी ‘दफनाया गया’ को आयात नहीं करता।
- source_word: ושמם
  choice: और उनका नाम
  rationale: ‘नाम’ सीधा अर्थ है और चिरस्थायी यश या स्मृति के बाइबलीय मुहावरे को खुला रखता है।
- source_word: חי
  choice: जीवित रहता है
  rationale: यह חי की सजीव, मानवीकृत अभिव्यक्ति को बनाए रखता है और केवल ‘बना रहता है’ की अपेक्षा मूल के अधिक निकट है।
- source_word: לדור ודור
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों का स्वाभाविक और प्रतिष्ठित आधुनिक हिन्दी मुहावरा है।
theological_decisions:
- issue: क्या इब्रानी मृत्यु-मुहावरे को यूनानी ‘दफनाया गया’ के अनुरूप स्पष्ट किया जाए
  choice: मुख्य पाठ में इब्रानी-आधारित ‘शान्ति से समेटे गए’ रखा गया
  alternative: उनके शरीर शान्ति से दफनाए गए
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वही मुख्य आधार है। यूनानी पाठ अंत्येष्टि-संबंधी अर्थ को स्पष्ट करता है, पर मुख्य पाठ में इब्रानी की वास्तविक अभिव्यक्ति और उसकी कुछ अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और शास्त्रीय प्रतिध्वनि वाली रखी गई है। ‘समेटे गए’ जानबूझकर ‘दफनाए गए’ से कम स्पष्ट है, ताकि इब्रानी पाठ की अभिव्यक्ति बनी रहे; यूनानी साक्ष्य पादटिप्पणी में दिया गया है। मुख्य पाठ में पादटिप्पणी-चिह्न अंग्रेज़ी POB के क्रम [b][a] के अनुसार रखे गए हैं।
