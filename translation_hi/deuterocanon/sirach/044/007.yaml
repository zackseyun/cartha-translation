  text: ये सभी अपनी-अपनी पीढ़ी में सम्मानित हुए, और अपने समय में गौरव थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ संक्षिप्त, क्रियारहित वाक्यांश है—शाब्दिक रूप से, “और उनके दिनों में, उनका गौरव।” यूनानी समानांतर में है, “और उनके दिनों में [वे] गौरव/गर्व का विषय [थे]।” हिन्दी अनुवाद इस संज्ञात्मक वाक्यांश का आशय स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  choice: ये सभी
  rationale: यह पहले बताए गए व्यक्तियों का स्वाभाविक सार-संकेत है और मूल में न होने के कारण ‘पुरुष’ नहीं जोड़ता।
- source_word: בדורם
  choice: अपनी-अपनी पीढ़ियों में
  rationale: इब्रानी में प्रत्यय के साथ ‘पीढ़ी’ है; यूनानी समानांतर का बहुवचन भी प्रत्येक व्यक्ति के अपने ऐतिहासिक काल की ओर संकेत करता है। हिन्दी में ‘अपनी-अपनी’ इस वितरणात्मक भाव को सहजता से व्यक्त करता है।
- source_word: ומימיהם
  choice: और अपने दिनों में
  rationale: यहाँ מימי का अर्थ काल-सूचक ‘अपने दिनों में’ है; यूनानी समानांतर भी इसी अर्थ की पुष्टि करता है।
- source_word: תפארתם
  choice: गौरव थे
  rationale: תפארת का अर्थ ‘गौरव/शोभा’ हो सकता है। इब्रानी वाक्यांश क्रियारहित और संक्षिप्त है; ‘गौरव थे’ स्वाभाविक हिन्दी में इन व्यक्तियों को अपने समय के लिए सम्मान का कारण बताता है, बिना अर्थ को ‘घमंड’ की ओर मोड़े।
