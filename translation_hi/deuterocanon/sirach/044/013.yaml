  yaml_path: translation/deuterocanon/sirach/044/013.yaml
  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: hi
  text: उनकी स्मृति सदा बनी रहेगी[a], और उनकी धार्मिकता भुलाई नहीं जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “उनकी संतान सदा बनी रहेगी, और उनकी महिमा मिटाई नहीं जाएगी।” मसादा-पांडुलिपि भी काहिरा गनीज़ा के यहाँ दिए गए “उनकी स्मृति” के स्थान पर “उनकी संतान/वंश” पढ़ती है।
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: उनकी स्मृति
  rationale: זֵכֶר स्मरण या बनी रहने वाली याद को दर्शाता है। ‘उनकी स्मृति’ मूल इब्रानी संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יעמד
  choice: बनी रहेगी
  rationale: עמד का मूल अर्थ ‘खड़ा रहना’ है, पर यहाँ इसका भाव टिके रहने या स्थायी होने का है। ‘बनी रहेगी’ आधुनिक हिन्दी में यही अर्थ सहजता से व्यक्त करता है।
- source_word: עד עולם
  choice: सदा
  rationale: यह इब्रानी मुहावरा निरंतर अथवा अनंत काल तक बने रहने का भाव देता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: וצדקתם
  choice: और उनकी धार्मिकता
  rationale: צדקה धार्मिकता, न्याय या धर्ममय आचरण का बोध करा सकता है। ‘धार्मिकता’ अमूर्त संज्ञा को बनाए रखती है और इसे केवल कर्मों तक सीमित नहीं करती।
- source_word: לא תשכח
  choice: भुलाई नहीं जाएगी
  rationale: निष्क्रिय अर्थ को सीधे व्यक्त करते हुए यह स्मृति के समानांतर वाक्यांश को भी सुरक्षित रखता है।
theological_decisions:
- issue: काहिरा गनीज़ा के इब्रानी पाठ और यूनानी/मसादा पाठ-परंपरा में भिन्नता
  choice: मुख्य पाठ में उपलब्ध काहिरा गनीज़ा इब्रानी के अनुसार ‘उनकी स्मृति ... उनकी धार्मिकता’ रखा गया है।
  alternative: 'यूनानी में है: ‘उनकी संतान सदा बनी रहेगी, और उनकी महिमा मिटाई नहीं जाएगी’; मसादा-पांडुलिपि भी ‘स्मृति’ के स्थान पर ‘संतान/वंश’ पढ़ती है।'
  rationale: उपलब्ध इब्रानी मुख्य साक्ष्य को आधार बनाया गया है, पर अर्थ को पर्याप्त रूप से बदलने वाली प्राचीन पाठ-भिन्नता को पाद-टिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य भाषा। ‘बनी रहेगी’ ने इब्रानी क्रिया की स्थायित्व-संबंधी छवि को स्वाभाविक हिन्दी में व्यक्त किया है।
