base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/004.yaml
  text: leaders of nations in their planning[a], and rulers in their investigations; wise in discourse through their writings[b], and governors in their watches.
translation:
  language: hi
  text: 'जातियों के नेता अपनी योजनाओं में,

    और शासक अपनी खोजबीन में;

    अपने लेखों[a] में विचार-विमर्श के ज्ञानी,

    और अपने पहरों में शासन करने वाले।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी साक्ष्यों में यहाँ थोड़ा पाठांतर है। काहिरा गनीज़ा के पाठ का अर्थ “अपने लेख/लेखों में” है, जबकि मसादा की पुस्तक-पट्टी निकट अर्थ वाला पाठ “अपनी पुस्तकों में” देती है। दोनों पाठ लेखकीय या साहित्यिक प्रज्ञा की ओर संकेत करते हैं।
    reason: textual_variant
  - marker: b
    text: “पहरों” के लिए प्रयुक्त इब्रानी शब्द का अर्थ पहरा या रखवाली के साथ-साथ सौंपा हुआ दायित्व अथवा नियुक्त सेवा भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שרי גוים
  choice: जो जातियों का ... नेतृत्व करते थे
  rationale: שרים उच्च अधिकारियों या प्रधानों को सूचित करता है और גוים का राजनीतिक बहुवचन अर्थ ‘जातियाँ’ है। क्रियात्मक हिंदी पदबंध सूची के प्रशंसात्मक संदर्भ में सहज है।
- source_word: במזמתם
  choice: अपनी योजनाओं में
  rationale: מזמה का अर्थ योजना, युक्ति या मंत्रणा हो सकता है। यहाँ सकारात्मक-तटस्थ ‘योजनाओं’ उपयुक्त है और यूनानी ἐν διαβουλίοις से भी मेल खाता है।
- source_word: ורוזנים
  choice: और शासक
  rationale: רוזנים उच्च पदस्थ शासकों या प्रतिष्ठित अधिकारियों के लिए है; ‘शासक’ शासन-संबंधी अर्थ स्पष्ट रखता है।
- source_word: במחקרותם
  choice: जो अपनी खोजबीन में लगे रहते थे
  rationale: मूल शब्द खोजने, जाँचने और गहन पड़ताल करने का भाव रखता है। ‘खोजबीन’ इस सक्रिय अर्थ को ‘समझ’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखती है।
- source_word: חכמי שיח
  choice: विचार-विमर्श के ज्ञाता
  rationale: שיח वाणी, संवाद अथवा मननपूर्ण चर्चा को सूचित कर सकता है। ‘विचार-विमर्श के ज्ञाता’ आधुनिक हिंदी में स्वाभाविक रहते हुए बौद्धिक संभाषण का भाव रखता है।
- source_word: בספרתם
  choice: अपने लेखों में
  rationale: काहाना पाठ लेखन या लिखित रचनाओं की ओर संकेत करता है; मसादा का निकट पाठ ‘अपनी पुस्तकों में’ इसी साहित्यिक क्षेत्र की पुष्टि करता है।
- source_word: ומושלים
  choice: और ... अधिकारी
  rationale: משל का कृदन्त शासन या अधिकार चलाने वालों को सूचित करता है। ‘अधिकारी’ पहले प्रयुक्त ‘शासक’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: במשמרותם
  choice: अपने पहरों के अधिकारी
  rationale: משמרת पहरा, रखवाली, सौंपा हुआ दायित्व या नियुक्त सेवा हो सकता है। ‘पहरों’ मूल का ठोस चित्र सुरक्षित रखता है; टिप्पणी व्यापक प्रशासनिक अर्थ बताती है।
