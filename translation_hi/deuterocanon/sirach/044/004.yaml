translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। पद की समानांतर सूची-रचना बनाए रखने के लिए चार संबंधवाचक खंडों का प्रयोग किया गया है। यूनानी समानांतर दूसरे खंड में जनता के लेखकीय प्रशासन से जुड़ी समझ पर बल देता है, पर मुख्य पाठ में उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य का अनुसरण किया गया है।
