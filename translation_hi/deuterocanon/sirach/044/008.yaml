  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: hi
  text: उनमें से कुछ अपने पीछे नाम छोड़ गए[a], ताकि उनकी विरासत में उनकी प्रशंसा की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी «उनकी विरासत में» का अर्थ उनके वंशजों या उनसे चली आती धरोहर के बीच भी हो सकता है। यूनानी समानांतर उनकी प्रशंसाओं के वर्णन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יש מהם
  choice: उनमें से कुछ
  rationale: यह अंश पहले वर्णित प्रतिष्ठित पूर्वजों में से एक समूह को अलग करता है; यह हिन्दी में स्वाभाविक और इब्रानी के निकट है।
- source_word: הניחו
  choice: अपने पीछे छोड़ गए
  rationale: क्रिया मृत्यु के बाद किसी वस्तु या स्मृति के बने रहने का भाव देती है; यहाँ स्थायी प्रतिष्ठा अभिप्रेत है।
- source_word: שם
  choice: नाम
  rationale: इब्रानी मुहावरे में ‘नाम’ प्रतिष्ठा और स्मरण को भी व्यक्त करता है। शाब्दिक बिंब बनाए रखने से बाइबिलीय प्रतिध्वनि सुरक्षित रहती है।
- source_word: להשתענות
  choice: प्रशंसा होती रहे
  rationale: इब्रानी रूप कठिन है, पर संदर्भ और यूनानी समानांतर प्रशंसापूर्वक स्मरण किए जाने का समर्थन करते हैं। यह चयन उस भाव को स्पष्ट रखता है, बिना उसे केवल ‘प्रशंसा सुनाना’ मान लेने के।
- source_word: בנחלתם
  choice: उनकी विरासत में
  rationale: यह मूल के ‘उनकी विरासत में’ को बनाए रखता है; प्रसंग में विरासत का अर्थ वंशजों या चली आती धरोहर से भी हो सकता है।
theological_decisions:
- issue: ‘नाम’ और ‘विरासत’ की स्मारकीय भाषा
  choice: ठोस बिंबों को ‘नाम’ और ‘विरासत’ के रूप में सुरक्षित रखा गया है।
  alternative: ‘यश’ और ‘वंशज’ कहकर आशय को पूरी तरह स्पष्ट किया जा सकता था।
  rationale: पद कोई प्रमुख सिद्धान्तगत विवाद प्रस्तुत नहीं करता, फिर भी इन बाइबिलीय बिंबों को अमूर्त शब्दों में बदलने से मूल की अर्थ-समृद्धि घटती।
- issue: कठिन क्रियारूप להשתענות का अर्थ
  choice: निरंतर प्रशंसा पाए जाने का भाव
  alternative: उनकी प्रशंसा का वर्णन किया जाए
  rationale: यूनानी समानांतर प्रशंसा सुनाए जाने पर बल देता है, जबकि उपलब्ध इब्रानी को प्राथमिक रखते हुए निष्क्रिय/स्मारकीय अर्थ को पाठ में रखा गया है और वैकल्पिक अर्थ टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। ‘नाम’ और ‘विरासत’ जैसे मूल बाइबिलीय बिंब बनाए रखते हुए ‘होती रहे’ से मृत्यु के बाद भी जारी स्मरण का स्वाभाविक हिन्दी भाव व्यक्त किया गया है।
