base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: hi
  text: और उनमें से कुछ ऐसे हैं जिनकी कोई स्मृति नहीं रही[a]; वे ऐसे मिट गए मानो कभी अस्तित्व में ही न रहे हों, और उनके बाद उनकी संतान भी वैसे ही मिट गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ छोटा है और उसका शाब्दिक अर्थ है, “और उनमें से कुछ ऐसे हैं जिनका कोई स्मरण नहीं; और वे समाप्त हुए जैसे वे समाप्त हुए।” यूनानी समानांतर विचार का अधिक पूर्ण रूप देता है: “वे ऐसे नष्ट हुए मानो उनका अस्तित्व ही न रहा हो ... और उनके बाद उनकी संतान भी।” मुख्य पाठ इब्रानी को प्राथमिक मानते हुए उसकी संक्षिप्त भाषा को स्पष्ट करने के लिए यूनानी पाठ का सहारा लेता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: और उनमें से कुछ ऐसे हैं
  rationale: यह पदबंध पहले वर्णित पूर्वजों में से एक समूह को अलग करता है; हिन्दी में यह स्वाभाविक ढंग से अंशवाचक अर्थ बनाए रखता है।
- source_word: אשר אין לו זכר
  choice: जिनकी कोई स्मृति नहीं रही
  rationale: זכר यहाँ स्मरण या याद बने रहने को दर्शाता है। ‘स्मृति’ अमूर्त अर्थ को बनाए रखता है और यूनानी μνημόσυνον से भी मेल खाता है।
- source_word: וישבתו כאשר שבתו
  choice: वे ऐसे मिट गए
  rationale: शाब्दिक इब्रानी अत्यंत संक्षिप्त और पुनरुक्तिपूर्ण है—‘और वे समाप्त हुए जैसे वे समाप्त हुए।’ वर्तमान पाठ में ‘मिट गए’ अस्तित्व और सामूहिक स्मृति से लुप्त होने का भाव देता है; आगे की भाषा यूनानी समानांतर से स्पष्ट की गई है।
- source_word: καὶ ἀπώλοντο ὡς οὐχ ὑπάρξαντες, καὶ ἐγένοντο ὡς οὐ γεγονότες
  choice: मानो कभी अस्तित्व में ही न रहे हों
  rationale: 'यूनानी समानांतर संक्षिप्त इब्रानी का भाव स्पष्ट करता है: वे इस प्रकार लुप्त हुए मानो कभी हुए ही न हों।'
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: और उनके बाद उनकी संतान भी वैसे ही मिट गई
  rationale: यह अंश उपलब्ध इब्रानी साक्ष्य में नहीं, पर यूनानी समानांतर में है। ‘वैसे ही’ पूर्ववर्ती लुप्त होने की क्रिया को संतान पर लागू करता है।
