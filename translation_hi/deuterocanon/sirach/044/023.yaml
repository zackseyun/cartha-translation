  yaml_path: translation/deuterocanon/sirach/044/023.yaml
  text: He established him with a blessing[a], and gave him his inheritance; he set him over the tribes, as twelve divisions.
translation:
  language: hi
  text: उसने उसे आशीष के साथ स्थिर किया और उसे उसकी विरासत दी; उसने उसे गोत्रों के लिए ठहराया, बारह भाग करने के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अंतिम वाक्यांश संक्षिप्त है: उसका शाब्दिक भाव ‘बारह भाग करने के लिए’ है, पर यह नहीं बताया गया कि क्या बाँटा गया। यूनानी समानांतर अधिक स्पष्ट रूप से बारह गोत्रों के बीच विभाजन की बात करता है।'
    reason: संक्षिप्त और कुछ अस्पष्ट इब्रानी वाक्यरचना तथा यूनानी समानांतर पाठ को दर्ज करना।
lexical_decisions:
- source_word: ויכוננהו
  choice: उसने उसे दृढ़ किया
  rationale: כון के कारक रूप का अर्थ किसी को दृढ़ या स्थिर करना है। ‘दृढ़ किया’ मूल बिंब को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: בברכה
  choice: आशीष देकर
  rationale: ב यहाँ साधन या साथ का भाव व्यक्त कर सकता है। ‘आशीष देकर’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: נחלתו
  choice: उसकी विरासत
  rationale: נחלה विरासत अथवा भाग में मिली संपत्ति को दर्शाता है; ‘विरासत’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ויציבהו
  choice: उसने उसे स्थापित किया
  rationale: יצב का अर्थ दृढ़ता से रखना या स्थापित करना है। इससे मूल क्रिया का भाव बना रहता है और अनावश्यक रूप से अधिकार का अर्थ नहीं जोड़ा जाता।
- source_word: לשבטים
  choice: गोत्रों में
  rationale: यह पद इस्राएल की गोत्रीय संरचना की ओर संकेत करता है। ל का सटीक संबंध कुछ संक्षिप्त है; ‘गोत्रों में’ अगले विभाजन-वाक्यांश के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: לחלק שנים עשר
  choice: बारह भागों में बाँटकर
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और विभाजित वस्तु स्पष्ट नहीं करता। यह अनुवाद बारह-गुना विभाजन का परिणाम व्यक्त करता है, जबकि टिप्पणी में पाठगत संक्षिप्तता बताई गई है।
theological_decisions:
- issue: एकवचन पुल्लिंग सर्वनामों का संदर्भ
  choice: हिन्दी में ‘उसे/उसकी’ रखते हुए याकूब/इस्राएल को निहित संदर्भ माना गया है।
  alternative: नाम जोड़कर ‘याकूब’ कहना, या संदर्भ को किसी सामान्य कुलपिता पर छोड़ना।
  rationale: इब्रानी पंक्ति नाम नहीं दोहराती, पर निकटवर्ती प्रसंग और यूनानी समानांतर याकूब की पहचान करते हैं। नाम को मुख्य पाठ में न जोड़ने से इब्रानी की संक्षिप्तता बनी रहती है।
- issue: बारह भागों और गोत्रों का संबंध
  choice: उसे गोत्रों में स्थापित करने और बारह भागों में बाँटने को एक संबद्ध कथन के रूप में रखा गया है।
  alternative: उसे गोत्रों के ऊपर नियुक्त करना, या उसकी विरासत को बारह हिस्सों में बाँटना।
  rationale: इब्रानी में कर्म और व्याकरणिक संबंध संक्षिप्त हैं। ‘गोत्रों के ऊपर’ अधिकार का ऐसा भाव जोड़ता है जो मूल में निश्चित नहीं है; चुना हुआ रूप बारह गोत्रों की ओर संकेत बनाए रखते हुए अस्पष्टता को टिप्पणी में स्वीकार करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘गोत्र’ बाइबिलीय-सांस्कृतिक पद के रूप में रखा गया है; वाक्य की मूल संक्षिप्तता को मुख्य पाठ और टिप्पणी के संयोजन से सुरक्षित रखा गया है।
