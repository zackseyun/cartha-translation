base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/010.yaml
  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: hi
  text: पर ये दयावान पुरुष थे[a], जिनके नेक काम[b] भुलाए नहीं गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इस स्थान की इब्रानी पंक्ति कठिन है और संभवतः यहाँ के पद से मेल नहीं खाती। अधिक शाब्दिक रूप में वह कुछ ऐसी है: “मानो वे कभी थे ही नहीं, वे थे, और उनके बाद उनकी संतान भी।” मुख्य पाठ इस पद के सुसंगत यूनानी समानांतर का अनुसरण करता है।'
    reason: textual_variant
  - marker: b
    text: या, “न्याय के काम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: पर ये
  rationale: उपलब्ध इब्रानी पंक्ति इस स्थान पर कठिन और संभवतः असंगत है। यूनानी समानांतर पिछले पद के उन लोगों से स्पष्ट विरोध दिखाता है जिनकी कोई स्मृति न रही; इसलिए मुख्य पाठ में यूनानी का स्वाभाविक विरोधसूचक भाव लिया गया है और पाठगत समस्या को टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन है; ‘पुरुष’ स्रोत के रूप और गरिमापूर्ण हिन्दी, दोनों को बनाए रखता है।
- source_word: ἐλέους
  choice: दयावान
  rationale: शाब्दिक रचना ‘दया के पुरुष’ हिन्दी में अस्वाभाविक है। ‘दयावान पुरुष’ उसी चरित्रगत अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύναι
  choice: नेक काम
  rationale: बहुवचन यहाँ अमूर्त धार्मिकता के बजाय उसके ठोस कार्यों की ओर संकेत करता है। ‘नेक काम’ सामान्य पाठक के लिए स्वाभाविक है; ‘न्याय के काम’ को वैकल्पिक अर्थ के रूप में टिप्पणी में दिया गया है।
- source_word: οὐκ ἐπελήσθησαν
  choice: भुलाए नहीं गए
  rationale: यह यूनानी क्रिया का सीधा अर्थ है और पिछले पद में स्मृति मिट जाने की बात के साथ स्पष्ट विरोध बनाए रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर के बीच पाठगत तनाव
  choice: मुख्य पाठ में इस पद के सुसंगत यूनानी समानांतर का अनुवाद करना और इब्रानी साक्ष्य की कठिनाई को टिप्पणी में स्पष्ट करना
  alternative: 'उपलब्ध इब्रानी का अधिक शाब्दिक रूप: ‘मानो वे कभी थे ही नहीं, वे थे, और उनके बाद उनकी संतान भी।’'
  rationale: सिराख के लिए उपलब्ध इब्रानी साक्ष्य को प्राथमिक महत्त्व है, पर यहाँ दी गई इब्रानी पंक्ति पदक्रम से असंगत या स्थानांतरित प्रतीत होती है और इसका अर्थ भी कठिन है। यूनानी पाठ प्रसंग में स्थिर और स्पष्ट है। अतः अनिश्चित इब्रानी को चुपचाप सुधारने के बजाय मुख्य पाठ यूनानी पर आधारित है और भिन्नता खुलकर दर्ज की गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दयावान पुरुष’ स्रोत के पुल्लिंग और दया-प्रधान चरित्र को बनाए रखता है, जबकि ‘नेक काम’ बहुवचन δικαιοσύναι के ठोस नैतिक कार्यों को सामान्य हिन्दी में स्पष्ट करता है।
