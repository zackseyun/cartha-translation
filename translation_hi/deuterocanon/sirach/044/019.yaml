base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/019.yaml
  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: hi
  text: अब्राहम, बहुत-सी जातियों का पिता था; उसने अपने सम्मान पर कोई कलंक नहीं लगने दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “और महिमा (या सम्मान) में उसके समान कोई नहीं पाया गया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אב
  choice: पिता
  rationale: इब्रानी शब्द का सीधा अर्थ ‘पिता’ है; यूनानी πατήρ भी इसकी पुष्टि करता है। यहाँ ‘पूर्वज’ की अपेक्षा ‘पिता’ वाचा की प्रतिज्ञा की भाषा को अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: המון גוים
  choice: बहुत-सी जातियों
  rationale: המון बहुलता या बड़ी संख्या को दर्शाता है। ‘बहुत-सी जातियों का पिता’ आधुनिक हिन्दी में स्वाभाविक है और अब्राहम से जुड़ी प्रतिज्ञा की प्रतिध्वनि को बनाए रखता है।
- source_word: לא נתן
  choice: नहीं लगने दिया
  rationale: शाब्दिक ‘नहीं दिया’ हिन्दी में इस प्रसंग में अस्पष्ट और अस्वाभाविक होगा। מום और בכבודו के साथ यह प्रयोग इस भाव को व्यक्त करता है कि उसने अपने सम्मान को कलंकित नहीं होने दिया। यह सक्रिय इब्रानी रूप को भी बनाए रखता है।
- source_word: בכבודו
  choice: अपने सम्मान पर
  rationale: כבוד के अर्थ ‘सम्मान’ और ‘महिमा’ दोनों हो सकते हैं। מום के साथ ‘सम्मान’ हिन्दी में अधिक सहज है और व्यक्ति की प्रतिष्ठा का भाव देता है।
- source_word: מום
  choice: कलंक
  rationale: מום मूलतः दोष या दाग को दर्शाता है। सम्मान के संदर्भ में ‘कलंक’ स्वाभाविक हिन्दी है और नैतिक अथवा प्रतिष्ठा-संबंधी दोष का भाव सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी में अंतिम उपवाक्य का भिन्न पाठ
  choice: मुख्य पाठ में इब्रानी के अनुसार अब्राहम द्वारा अपने सम्मान पर कोई कलंक न लगने देने का भाव रखा गया है।
  alternative: 'यूनानी: “और महिमा (या सम्मान) में उसके समान कोई नहीं पाया गया।”'
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है, पर यूनानी समानांतर पाठ की वास्तविक भिन्नता को दबाया नहीं गया। इसलिए उसका पाठ पादटिप्पणी में स्पष्ट रूप से दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘बहुत-सी जातियों का पिता’ प्रतिज्ञा-संबंधी प्रतिध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है। अंतिम खंड में कठिन इब्रानी रचना को सक्रिय रूप में रखा गया है और भिन्न यूनानी पाठ पादटिप्पणी में सुरक्षित है।
