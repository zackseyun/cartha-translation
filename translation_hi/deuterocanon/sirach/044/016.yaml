base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/016.yaml
  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: hi
  text: हनोक निर्दोष पाया गया; वह यहोवा के साथ चला और उठा लिया गया—पीढ़ी-दर-पीढ़ी के लिए ज्ञान का एक चिन्ह।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में अंतिम वाक्यांश है: “पीढ़ियों के लिए पश्चात्ताप का एक आदर्श।”'
    reason: प्रमाणित हिब्रू ‘पीढ़ी-दर-पीढ़ी के लिए ज्ञान का एक चिन्ह’ और यूनानी समानांतर के बीच महत्वपूर्ण पाठांतर को दर्ज करना आवश्यक है।
lexical_decisions:
- source_word: תמים
  choice: निर्दोष
  rationale: यह शब्द नैतिक खराई और निष्कलंकता व्यक्त करता है; ‘निर्दोष’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: והתהלך עם יהוה
  choice: और वह यहोवा के साथ-साथ चला
  rationale: हिब्रू की ‘चलने’ वाली रूपक-भाषा को बनाए रखते हुए ‘साथ-साथ’ निरंतर संगति का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ונלקח
  choice: फिर उसे उठा लिया गया
  rationale: हिब्रू का कर्मवाच्य और कर्ता की अनिर्दिष्टता सुरक्षित रखी गई है; वाक्य-संदर्भ में परमेश्वर कर्ता समझे जा सकते हैं, पर उन्हें स्पष्ट रूप से जोड़ा नहीं गया।
- source_word: אות דעת
  choice: ज्ञान का एक चिन्ह
  rationale: प्रमाणित हिब्रू में אות का सामान्य अर्थ ‘चिन्ह’ और דעת का अर्थ ‘ज्ञान’ है। अंग्रेज़ी परामर्श-पाठ के ‘example’ की अपेक्षा यह हिब्रू के अधिक निकट है; कठिन वाक्यांश की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: לדור ודור
  choice: पीढ़ी-दर-पीढ़ी
  rationale: हिब्रू मुहावरे की पुनरावृत्ति और निरंतरता को संक्षिप्त, प्रचलित हिन्दी रूप में व्यक्त करता है।
theological_decisions:
- issue: हनोक का उठा लिया जाना
  choice: उसे उठा लिया गया
  alternative: परमेश्वर ने उसे उठा लिया
  rationale: कर्मवाच्य मूल पाठ की संयमित भाषा और संभावित दैवी कर्म के संकेत, दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: אות דעת का आशय
  choice: ज्ञान का एक चिन्ह
  alternative: पश्चात्ताप का आदर्श / ज्ञान का उदाहरण
  rationale: हिब्रू पाठ को प्राथमिकता दी गई है। यूनानी समानांतर में ‘पीढ़ियों के लिए पश्चात्ताप का आदर्श’ है, जो एक महत्वपूर्ण पाठांतर है, पर मुख्य अनुवाद में उसे मिलाकर अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पाठ। वाक्य की बाइबिलीय रूपक-भाषा और हिब्रू पाठ की कठिनता को बनाए रखा गया है; संप्रदायगत व्याख्या नहीं जोड़ी गई।
