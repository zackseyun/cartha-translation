base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/011.yaml
  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: hi
  text: परन्तु ये करुणामय पुरुष हैं,[a] और उनकी आशा कभी समाप्त न होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अटल प्रेम रखनेवाले,” “दयालु,” अथवा “निष्ठावान”; इब्रानी חֶסֶד में करुणा, निष्ठा और अटल प्रेम के भाव समाहित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ है: “उनकी सन्तान के साथ एक उत्तम विरासत बनी रहेगी—उनके वंशज।” यहाँ काहिरा गनीज़ा का इब्रानी पाठ इसके बजाय कहता है: “ये करुणामय पुरुष हैं, और उनकी आशा कभी समाप्त न होगी।” मसादा का पाठ भी आस-पास की पंक्तियों में सन्तान और बने रहने पर केन्द्रित एक भिन्न रूप दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह पिछले संदर्भ के विपरीत इन आदरणीय पूर्वजों का परिचय देता है; ‘परन्तु’ उस विरोधात्मक बल को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: אֵלֶּה אַנְשֵׁי
  choice: ये ... पुरुष हैं
  rationale: इब्रानी बहुवचन पुल्लिंग है और यहाँ चर्चित पूर्वजों की ओर संकेत करता है; यह अनुवाद उसके व्याकरणिक और प्रसंगगत स्वरूप को बनाए रखता है।
- source_word: חֶסֶד
  choice: करुणामय
  rationale: חסד में करुणा, निष्ठा और अटल प्रेम के परस्पर जुड़े भाव हो सकते हैं। ‘करुणामय’ यहाँ אנשי חסד का स्वाभाविक हिन्दी विशेषण है; अन्य अर्थ-पहलुओं को पादटिप्पणी में रखा गया है।
- source_word: וְתִקְוָתָם
  choice: और उनकी आशा
  rationale: תקוה का सीधा अर्थ ‘आशा’ है और प्रत्यय उनके स्वामित्व को व्यक्त करता है।
- source_word: לֹא תִשְׁבֹּת
  choice: कभी समाप्त न होगी
  rationale: שבת यहाँ रुकने या समाप्त होने के अर्थ में है। ‘कभी समाप्त न होगी’ भावी निरंतरता को सहज हिन्दी में व्यक्त करता है, बिना आशा के परिणाम की अतिरिक्त व्याख्या किए।
theological_decisions:
- issue: इस पद में काहिरा गनीज़ा के इब्रानी पाठ और यूनानी समानांतर पाठ के बीच पर्याप्त पाठांतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी पंक्ति का अनुवाद: ‘ये करुणामय पुरुष हैं, और उनकी आशा कभी समाप्त न होगी।’'
  alternative: 'यूनानी पाठ के अनुसार: ‘उनकी सन्तान के साथ एक उत्तम विरासत बनी रहेगी—उनके वंशज।’'
  rationale: सिराख का इब्रानी पाठ उपलब्ध होने पर उसे प्राथमिकता दी गई है। यूनानी परंपरा एक स्पष्टतः भिन्न पंक्ति देती है; इसलिए दोनों को मिलाकर अनिश्चितता दबाने के बजाय उस महत्त्वपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण शैली अपनाई गई है। इब्रानी पाठ को मुख्य पंक्ति बनाया गया है और महत्त्वपूर्ण यूनानी पाठांतर को स्पष्ट पादटिप्पणी में रखा गया है।
