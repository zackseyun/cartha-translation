  text: With their offspring their good endures faithfully[a], and their inheritance is for their children's children.
translation:
  language: hi
  text: उनकी संतति के साथ उनकी भलाई स्थिर है[a], और उनकी विरासत उनके बच्चों के बच्चों के लिए है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उनकी संतति वाचाओं में स्थिर रही, और उनके कारण उनकी संतान भी।” मसादा से मिला अधिक प्राचीन इब्रानी साक्ष्य भी काहिरा गनीज़ा के “उनकी भलाई … और उनकी विरासत” के स्थान पर वाचा-केंद्रित पाठ को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עם
  choice: के साथ
  rationale: यह पूर्वसर्ग पूर्वजों की बनी रहने वाली भलाई को उनकी संतति से जोड़ता है और इब्रानी की संक्षिप्त रचना को बनाए रखता है।
- source_word: זרעם
  choice: उनकी संतति
  rationale: זרע यहाँ वंशजों के अर्थ में है; ‘संतति’ स्वाभाविक, गरिमापूर्ण और लिंग-समावेशी है।
- source_word: נאמן
  choice: स्थिर रहती है
  rationale: נאמן दृढ़, विश्वसनीय या टिके रहने का भाव देता है। संक्षिप्त इब्रानी वाक्य में क्रियात्मक हिन्दी रूप अर्थ को स्पष्ट करता है, पर covenant का अर्थ मुख्य पाठ में नहीं जोड़ता।
- source_word: טובם
  choice: उनकी भलाई
  rationale: טוב नैतिक अच्छाई, कल्याण या समृद्धि को सूचित कर सकता है। ‘भलाई’ इस व्यापकता को ‘समृद्धि’ की तुलना में बेहतर बचाती है।
- source_word: ונחלתם
  choice: और उनकी विरासत
  rationale: נחלה पारिवारिक उत्तराधिकार या धरोहर का बोध देता है; ‘विरासत’ यहाँ पीढ़ीगत समानांतरता के अनुकूल है।
- source_word: לבני בניהם
  choice: उनके बच्चों के बच्चों के लिए
  rationale: शाब्दिक ‘उनके पुत्रों के पुत्रों के लिए’ है, पर यह वंशगत मुहावरा व्यापक संतति को दर्शाता है; चुना हुआ रूप बहु-पीढ़ीगत बल बनाए रखता है।
theological_decisions:
- issue: काहिरा गनीज़ा के इब्रानी पाठ और यूनानी/मसादा की वाचा-केंद्रित वैकल्पिक परंपरा में अंतर
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वास वाले इब्रानी पाठ की ‘भलाई’ और ‘विरासत’ वाली रचना का अनुवाद
  alternative: ‘उनकी संतति वाचाओं में स्थिर रही, और उनके कारण उनकी संतान भी’ जैसा यूनानी-आधारित पाठ
  rationale: परियोजना के अनुसार जहाँ इब्रानी सुरक्षित है वहाँ उसे प्राथमिकता दी गई है। वास्तविक पाठांतर महत्वपूर्ण है, इसलिए वाचा-केंद्रित यूनानी और प्राचीन मसादा साक्ष्य को पादटिप्पणी में स्पष्ट रखा गया है, मुख्य पाठ में मिलाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। इब्रानी की संक्षिप्त समानांतर रचना और ‘भलाई’ की अर्थगत व्यापकता को रखा गया है; पाठांतर को पादटिप्पणी में बिना सुलझाए प्रस्तुत किया गया है।
