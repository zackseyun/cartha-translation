translation:
  language: hi
  text: नियम के अनुसार गीत की खोज-परख करनेवाले[a], और नीतिवचनों[b] को लिखित रूप में प्रस्तुत करनेवाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियम के अनुसार’ वाला इब्रानी वाक्यांश कठिन है। यूनानी समानांतर में ‘संगीतमय गीतों या रचनाओं की खोज करनेवाले’ है, जो सुव्यवस्थित अथवा कुशलता से रचे गए गीतों का भाव सुझाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘नीतिवचन’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ दृष्टान्त या सूक्तिपूर्ण कथन भी हो सकता है; यूनानी समानांतर में अधिक व्यापक अर्थ वाला ‘कथन’ या ‘पद्य’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: חוקרי
  choice: अन्वेषण करनेवाले
  rationale: חקר का अर्थ गहराई से खोजना या जाँच-पड़ताल करना है। कृदन्त रूप को हिन्दी में निरंतर विशेषता बतानेवाले पदबंध से व्यक्त किया गया है।
- source_word: מזמור
  choice: गीतों
  rationale: מזמור गीत या भजन हो सकता है। यहाँ सांस्कृतिक और साहित्यिक उपलब्धियों के संदर्भ में ‘गीत’ अधिक व्यापक है और अनावश्यक रूप से उपासना-संबंधी अर्थ नहीं जोड़ता।
- source_word: על חוק
  choice: नियम के अनुसार
  rationale: חוק किसी निश्चित नियम, विधान या निर्धारित क्रम को सूचित करता है। कलात्मक संदर्भ में ‘नियम के अनुसार’ मूल की औपचारिकता और वाक्यांश की कठिनता को यथासंभव बनाए रखता है; इसे स्पष्ट रूप से ‘रचना-विधान’ कहना व्याख्या को पाठ में मिला देता।
- source_word: נושאי
  choice: प्रस्तुत करनेवाले
  rationale: נשא का मूल अर्थ उठाना या वहन करना है, पर משל और בכתב के साथ यह लिखित कथनों को सामने लाने या प्रस्तुत करने का भाव देता है। हिन्दी में शाब्दिक ‘ढोनेवाले’ अस्वाभाविक और भ्रामक होता।
- source_word: משל
  choice: नीतिवचनों
  rationale: משל का अर्थ नीतिवचन, दृष्टान्त या सूक्तिपूर्ण कथन हो सकता है। प्रज्ञा-साहित्य के संदर्भ में ‘नीतिवचन’ स्वाभाविक है, जबकि यूनानी समानांतर अधिक व्यापक ‘कथन/पद्य’ का संकेत देता है।
- source_word: בכתב
  choice: लिखित रूप में
  rationale: इसका सीधा अर्थ ‘लेखन में’ या ‘लिखित रूप में’ है। यूनानी ἐν γραφῇ भी लिखित माध्यम की पुष्टि करता है।
