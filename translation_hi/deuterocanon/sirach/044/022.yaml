base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/022.yaml
  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: hi
  text: इसहाक के लिए भी उसने एक पुत्र दिया[a], उसके पिता अब्राहम के कारण। उसने उसे हर पहलौठे की वाचा दी[b], और आशीष इस्राएल के सिर पर ठहरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “और इसहाक में उसने, उसके पिता अब्राहम के द्वारा, सब मनुष्यों की आशीष और वाचा स्थापित की।” इब्रानी पाठ में यहाँ “इसहाक के लिए ... एक पुत्र” पढ़ा जाता है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी पदबंध “हर पहलौठे की वाचा” कठिन है। यूनानी पाठ इसके स्थान पर व्यापक भाव, “सब मनुष्यों की आशीष और वाचा,” प्रस्तुत करता है।
    reason: textual_variant
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: उसने इसहाक के लिए भी एक पुत्र उत्पन्न किया
  rationale: इब्रानी में ליצחק का स्वाभाविक अर्थ ‘इसहाक के लिए’ और הקים בן का अर्थ ‘एक पुत्र खड़ा/उत्पन्न किया’ है। आधुनिक हिन्दी में ‘एक पुत्र उत्पन्न किया’ इस वंशावली-संबंधी भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है तथा प्रामाणिक इब्रानी पाठ के בן (‘पुत्र’) को बनाए रखता है।
- source_word: בעבור אברהם אביו
  choice: उसके पिता अब्राहम के कारण
  rationale: בעבור कारण अथवा निमित्त व्यक्त करता है। ‘के कारण’ संक्षिप्त है और यह अनावश्यक रूप से नहीं तय करता कि भाव केवल प्रतिफल का है या व्यापक वाचागत अनुग्रह का।
- source_word: ברית כל ראשון נתיו
  choice: उसने उसे हर पहलौठे की वाचा दी
  rationale: यह इब्रानी पदबंध पाठगत और वाक्यगत रूप से कठिन है। ברית को ‘वाचा’, כל ראשון को उसके प्रत्यक्ष शब्दार्थ के अनुसार ‘हर पहलौठे’, और נתיו को ‘उसने उसे ... दी’ से स्पष्ट रूप से व्यक्त किया गया है। कठिनाई को मुख्य पाठ में सहज बनाकर छिपाने के बजाय पादटिप्पणी में बताया गया है।
- source_word: וברכה נחה על ראש ישראל
  choice: और आशीष इस्राएल के सिर पर ठहरी
  rationale: נחה का चित्रात्मक अर्थ ‘ठहरी/विश्राम किया’ है। ‘इस्राएल के सिर पर’ इब्रानी बिंब को बनाए रखता है और ‘इस्राएल’ को याकूब अथवा उससे निकले समुदाय में से किसी एक तक सीमित नहीं करता।
theological_decisions:
- issue: ‘इस्राएल’ की पहचान
  choice: मुख्य पाठ में केवल ‘इस्राएल’ रखा गया है
  alternative: ‘याकूब’ लिखकर कुलपिता की पहचान स्पष्ट करना, अथवा ‘इस्राएल की प्रजा’ लिखकर सामूहिक अर्थ चुनना
  rationale: अब्राहम–इसहाक–इस्राएल के क्रम में कुलपिता याकूब प्रमुख संकेत है, पर अभिव्यक्ति उसके वंशज समुदाय को भी प्रतिध्वनित कर सकती है। मूल नाम रखने से यह वास्तविक अर्थ-विस्तार सुरक्षित रहता है।
- issue: इब्रानी בן और यूनानी διαθήκην के बीच पाठांतर
  choice: मुख्य पाठ में इब्रानी ‘पुत्र’ रखा गया है और यूनानी पाठांतर पादटिप्पणी में दिया गया है
  alternative: यूनानी के आधार पर पहली पंक्ति को ‘इसहाक में उसने ... वाचा स्थापित की’ के रूप में पुनर्गठित करना
  rationale: दिया गया इब्रानी स्रोत उच्च विश्वास के साथ प्राथमिक मूल-भाषा साक्ष्य है और उसमें בן स्पष्ट है। यूनानी एक महत्वपूर्ण, किंतु भिन्न, पाठ-परंपरा सुरक्षित रखता है; उसे मुख्य पाठ में चुपचाप प्रतिस्थापित करने के बजाय पाठांतर के रूप में दर्ज करना अधिक पारदर्शी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा’, ‘पहलौठा’ और ‘आशीष’ बाइबलीय संदर्भ में प्रचलित हिन्दी शब्द हैं। मूल इब्रानी की असामान्य अभिव्यक्ति को अत्यधिक सहज बनाकर उसके पाठगत तनाव को मिटाया नहीं गया है।
