base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: hi
  text: सुलैमान ने शान्ति के दिनों में राज्य किया,[a] और परमेश्वर ने उसे चारों ओर से विश्राम दिया, ताकि वह परमेश्वर के नाम के लिए एक भवन बनाए और सदा के लिए एक पवित्रस्थान तैयार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पंक्ति संक्षिप्त है: “सुलैमान ने शान्ति के दिनों में राज्य किया, और परमेश्वर ने उसे चारों ओर से विश्राम दिया।” परमेश्वर के नाम के लिए भवन बनाने और सदा के लिए पवित्रस्थान तैयार करने वाला उद्देश्यवाचक अंश यूनानी समानान्तर पाठ में मिलता है।'
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी बाइबलीय रूप।
- source_word: מלך
  choice: राज्य किया
  rationale: इब्रानी क्रियात्मक रूप को स्वाभाविक और औपचारिक हिन्दी में व्यक्त करता है।
- source_word: בימי שלוה
  choice: शान्ति के दिनों में
  rationale: कालसूचक इब्रानी मुहावरे और शान्ति/निश्चिन्तता के भाव, दोनों को सुरक्षित रखता है।
- source_word: ואל הניח לו מסביב
  choice: और परमेश्वर ने उसे चारों ओर से विश्राम दिया
  rationale: प्राप्त इब्रानी पाठ में 'ואל' कुछ अनियमित है; यूनानी समानान्तर में परमेश्वर कर्ता के रूप में स्पष्ट है। 'चारों ओर से विश्राम दिया' מסביב और κατέπαυσεν κυκλόθεν का स्वाभाविक बाइबलीय हिन्दी रूप है।
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: ताकि वह उसके नाम के लिए एक भवन बनाए
  rationale: यूनानी साक्ष्य में उपस्थित उद्देश्यवाचक उपवाक्य को मंदिर-निर्माण की भाषा के अनुरूप प्रस्तुत करता है; 'भवन' οἶκον की औपचारिक अस्पष्टता बनाए रखता है।
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: और सदा के लिए एक पवित्रस्थान तैयार करे
  rationale: '''पवित्रस्थान'' ἁγίασμα का स्पष्ट और प्रतिष्ठित हिन्दी समतुल्य है; ''सदा के लिए'' εἰς τὸν αἰῶνα को बिना अनावश्यक विस्तार के व्यक्त करता है।'
theological_decisions:
- issue: यूनानी समानान्तर में उपस्थित, पर उपलब्ध इब्रानी पंक्ति में अनुपस्थित मंदिर-उद्देश्य उपवाक्य का समावेश
  choice: यूनानी उपवाक्य को मुख्य पाठ में रखा गया है और पाठांतर को पादटिप्पणी में बताया गया है।
  alternative: 'केवल उपलब्ध इब्रानी का अनुवाद: “सुलैमान ने शान्ति के दिनों में राज्य किया, और परमेश्वर ने उसे चारों ओर से विश्राम दिया।”'
  rationale: उपलब्ध इब्रानी साक्ष्य छोटा है और उसमें मामूली पाठगत असंगति है; प्रत्यक्ष यूनानी समानान्तर सुलैमान और मंदिर के प्रसंग से मेल खाता हुआ सुसंगत विस्तार सुरक्षित रखता है। पादटिप्पणी दोनों साक्ष्यों का अंतर पारदर्शी बनाती है और किसी धर्मसैद्धान्तिक निष्कर्ष को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। 'शान्ति', 'विश्राम', 'भवन' और 'पवित्रस्थान' सामान्य पाठक के लिए बोधगम्य रहते हुए स्रोत की औपचारिक और धार्मिक भाषा को सुरक्षित रखते हैं।
