lexical_decisions:
- source_word: בשיר
  choice: गीत के द्वारा
  rationale: उपसर्ग ב यहाँ साधन या अभिव्यक्ति-क्षेत्र बताता है; सूची के साथ ‘के द्वारा’ स्वाभाविक हिन्दी है।
- source_word: משל
  choice: नीतिवचन
  rationale: ज्ञान-साहित्य में משל सामान्यतः संक्षिप्त शिक्षाप्रद कथन या नीतिवचन को दर्शाता है।
- source_word: חידה
  choice: पहेली
  rationale: חידה का सीधा और आधुनिक हिन्दी समतुल्य ‘पहेली’ है, जिसमें गूढ़ कथन का भाव भी है।
- source_word: ומליצה
  choice: सुबोध उक्ति
  rationale: מליצה कलात्मक या प्रभावपूर्ण अभिव्यक्ति का बोध करा सकता है; यूनानी ἑρμηνίᾳ व्याख्या अथवा अर्थ स्पष्ट करने की दिशा दिखाता है। ‘सुबोध उक्ति’ दोनों संकेतों के बीच संतुलन रखती है, यद्यपि शब्द अनिश्चित है।
- source_word: עמים
  choice: लोगों
  rationale: עמים बहुवचन सामूहिक समुदायों को दर्शाता है; ‘लोगों’ से आधुनिक हिन्दी में यह व्यापक मानवीय अर्थ स्वाभाविक रहता है।
- source_word: הסערתה
  choice: तुमने ... विस्मित कर दिया
  rationale: इब्रानी रूप कठिन है और סער से उद्वेलित करने का भाव निकल सकता है; यूनानी समानांतर का ‘देश तुम पर चकित हुए’ स्पष्ट करता है कि परिणाम व्यापक विस्मय था।
