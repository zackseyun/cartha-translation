    reason: alternative_reading
  - marker: b
    text: यहाँ इब्रानी क्रिया कठिन है और शाब्दिक रूप से उद्वेलित करने का भाव दे सकती है; अनुवाद में यूनानी समानांतर के अधिक स्पष्ट अर्थ, “तुम पर चकित हुए,” को भी ध्यान में रखा गया है।
