base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: hi
  text: परन्तु परमेश्वर अपनी करुणा को नहीं त्यागेगा,[a] और अपने किसी वचन को धरती पर गिरने नहीं देगा। वह अपने चुने हुए व्यक्ति[b] की संतान और वंशजों को समाप्त नहीं करेगा, और जो उससे प्रेम करता था उसके वंश का विनाश नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “परन्तु प्रभु निश्चय ही अपनी करुणा को नहीं त्यागेगा, और न अपने किसी कार्य को नष्ट करेगा।” इसके विपरीत इब्रानी में है: “और अपने किसी वचन को धरती पर गिरने नहीं देगा।”'
    reason: textual_variant
  - marker: b
    text: इब्रानी रूप को “अपने चुने हुओं” के बहुवचन अर्थ में भी पढ़ा जा सकता है, पर यूनानी समानांतर एकवचन “अपने चुने हुए व्यक्ति” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: परमेश्वर
  rationale: इब्रानी में सामान्य ईश्वरीय उपाधि אל है, न कि परमेश्वर का विशिष्ट वाचा-नाम। इसलिए यूनानी Κύριος के आधार पर ‘प्रभु’ लेने के बजाय इब्रानी साक्ष्य के अनुरूप ‘परमेश्वर’ रखा गया है।
- source_word: יטוש
  choice: त्यागेगा
  rationale: यह क्रिया छोड़ देने या परित्याग करने का भाव देती है; ‘त्यागना’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: חסד
  choice: करुणा
  rationale: यहाँ परमेश्वर की कृपालु, निष्ठावान दया का भाव है। ‘करुणा’ सामान्य पाठक के लिए स्वाभाविक है और यूनानी ἔλεος से भी मेल खाती है, यद्यपि ‘अटल प्रेम’ भी संभव है।
- source_word: ולא יפיל מדבריו ארצה
  choice: और अपने किसी वचन को धरती पर गिरने नहीं देगा
  rationale: इब्रानी मुहावरे को यथासंभव बनाए रखा गया है; इसका आशय है कि परमेश्वर का कोई वचन निष्फल नहीं होगा। यूनानी पाठ यहाँ अलग है, इसलिए उसका उल्लेख पादटिप्पणी में है।
- source_word: לא יכרית
  choice: समाप्त नहीं करेगा
  rationale: क्रिया का अर्थ काट डालना या अस्तित्व मिटा देना है। वंश के संदर्भ में ‘समाप्त नहीं करेगा’ स्वाभाविक हिन्दी है और मूल की शक्ति बनाए रखता है।
- source_word: לבחיריו
  choice: अपने चुने हुए जन की
  rationale: इब्रानी रूप बहुवचन के रूप में भी समझा जा सकता है, पर यूनानी समानांतर एकवचन है और प्रसंग दाऊद के राजवंश पर केंद्रित है। ‘जन’ जोड़ने से हिन्दी में विशेषण का संज्ञात्मक प्रयोग सहज बनता है।
- source_word: נין ונכד
  choice: संतान और वंश
  rationale: यह युग्म पीढ़ियों तक चलने वाली वंशावली व्यक्त करता है। ‘संतान और वंश’ दोनों पदों को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है और इसे केवल पुत्र-पौत्र तक सीमित नहीं करता।
- source_word: זרע
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर मनुष्यों की वंशावली के लिए आधुनिक हिन्दी में ‘वंश’ अधिक स्वाभाविक है और राजवंशीय अर्थ को सुरक्षित रखता है।
- source_word: אובהו
  choice: जिसने उससे प्रेम किया
  rationale: रूप उस व्यक्ति की ओर संकेत करता है जिसने परमेश्वर से प्रेम किया; यूनानी भूतकालिक कृदन्त भी इसी अर्थ का समर्थन करता है। प्रसंग में संकेत संभवतः दाऊद की ओर है, पर नाम को पाठ में स्पष्ट नहीं किया गया।
- source_word: ישמיד
  choice: विनाश नहीं करेगा
  rationale: यह मूल क्रिया की तीव्रता को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आरम्भ में ईश्वरीय उपाधि
  choice: परमेश्वर
  alternative: प्रभु
  rationale: प्राथमिक इब्रानी साक्ष्य में אל है, जबकि यूनानी समानांतर में Κύριος है। मूल-भाषा की प्रधानता के कारण मुख्य पाठ में ‘परमेश्वर’ चुना गया; पादटिप्पणी में यूनानी पाठ का भेद बताया गया है।
- issue: चुने हुए व्यक्ति की वचन-संख्या
  choice: अपने चुने हुए जन
  alternative: अपने चुने हुओं
  rationale: इब्रानी रूप बहुवचन पढ़ा जा सकता है, किंतु यूनानी एकवचन और दाऊदी वंश का प्रसंग एकवचन का समर्थन करते हैं। वास्तविक पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: אובהו का संदर्भ
  choice: जिसने उससे प्रेम किया
  alternative: उसका प्रिय जन
  rationale: क्रियात्मक अनुवाद यह संबंध स्पष्ट करता है कि उस व्यक्ति ने परमेश्वर से प्रेम किया। प्रसंगगत रूप से दाऊद संभावित है, पर मूल पाठ नाम नहीं देता, इसलिए अनुवाद भी नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। इब्रानी मुहावरे ‘वचन को धरती पर गिरने देना’ को उसकी बाइबलीय छवि और निष्फल न होने के भाव सहित रखा गया है। ‘बीज’ जैसे अत्यधिक शाब्दिक शब्द के स्थान पर वंशावली के संदर्भ में स्वाभाविक ‘वंश’ चुना गया है।
