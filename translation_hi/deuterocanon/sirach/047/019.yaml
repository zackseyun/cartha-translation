  text: You gave your strength to women[a], and let them rule over your body.
translation:
  language: hi
  text: तूने अपना बल स्त्रियों को दे दिया[a], और उन्हें अपने शरीर पर शासन करने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘अपना बल’; यूनानी समानांतर में ‘अपनी कमर’ है, जिससे यहाँ यौन आशय स्पष्ट होता है।
    reason: कठिन इब्रानी शब्द और यूनानी पाठ में उपलब्ध अधिक स्पष्ट शारीरिक अर्थ को दर्ज करना।
lexical_decisions:
- source_word: כסלך
  choice: अपना बल
  rationale: इब्रानी शब्द कठिन है, पर प्रसंग और यूनानी समानांतर ‘कमर’ की ओर संकेत करते हैं; ‘बल’ दैहिक और पुरुषोचित सामर्थ्य का भाव स्वाभाविक ढंग से रखता है, बिना अनावश्यक रूप से शारीरिक हुए।
- source_word: ותתן
  choice: तूने ... दे दिया
  rationale: נתן का सीधा अर्थ ‘देना’ है; ‘दे दिया’ यहाँ स्वेच्छा से सौंप देने के निंदात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לנשים
  choice: स्त्रियों को
  rationale: ל दिशा अथवा प्राप्तकर्ता बताता है; इसलिए ‘स्त्रियों को’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ותמשילם
  choice: उन्हें ... शासन करने दिया
  rationale: हिफ़ील रूप किसी को शासन करने देना या शासक बनाना व्यक्त करता है। प्रत्यय का संबंध स्त्रियों से है, इसलिए ‘उन्हें’ स्पष्ट किया गया है।
- source_word: בגויתך
  choice: अपने शरीर पर
  rationale: גויה यहाँ भौतिक शरीर को दर्शाता है। क्रिया में निहित प्रभुत्व के कारण हिन्दी में ‘शरीर पर’ अधिक स्वाभाविक है; यूनानी समानांतर भी ‘शरीर’ का समर्थन करता है।
theological_decisions:
- issue: कठिन इब्रानी पद כסלך की व्याख्या में यूनानी समानांतर का उपयोग
  choice: इब्रानी को आधार रखते हुए ‘अपना बल’ अनुवाद किया गया और यूनानी ‘अपनी कमर’ को पादटिप्पणी में दिया गया।
  alternative: ‘अपनी कमर’ या ‘अपनी मूर्खता’
  rationale: प्रसंग सुलैमान द्वारा स्त्रियों के सामने अपने दैहिक और राजकीय सामर्थ्य को सौंपने की भर्त्सना करता है। यूनानी पाठ यौन-दैहिक अर्थ की पुष्टि करता है, जबकि ‘मूर्खता’ इस प्रसंग में कम समर्थित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। एकवचन संबोधन के लिए ‘तूने’ रखा गया है, क्योंकि यह पूर्ववर्ती व्यक्ति को संबोधित करती हुई तीखी काव्यात्मक भर्त्सना है।
