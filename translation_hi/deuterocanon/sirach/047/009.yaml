  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: hi
  text: बागों में गीतों के साथ[a] उसने वेदी के सामने तैयारी की, और भजन तथा वीणाओं[b] की ध्वनि को व्यवस्थित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “बागों में गीतों के साथ” वाक्यांश अनिश्चित है। यूनानी समानांतर में है, “उसने गायकों को वेदी के सामने खड़ा किया, ताकि उनकी ध्वनि से धुनें मधुर हों।” यह किसी भिन्न आधार-पाठ या इब्रानी वाक्यांश में पाठ-विकृति का संकेत हो सकता है।
    reason: textual_variant
  - marker: b
    text: या “तार वाले वाद्यों”; इब्रानी शब्द एक प्रकार के तार-वाद्य को दर्शाता है, जिसकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: गीतों से बागों में
  rationale: प्राप्त इब्रानी पाठ का निकट, यद्यपि कठिन, अर्थ रखा गया है। בגינות सामान्यतः ‘बागों में’ की ओर संकेत करता है; इसे अनुमान के आधार पर ‘गायकों’ या ‘वाद्यों’ में नहीं बदला गया।
- source_word: הכין
  choice: तैयारी की
  rationale: क्रिया का अर्थ ‘तैयार करना, तैयार रखना, स्थापित करना’ हो सकता है। कर्म स्पष्ट न होने के कारण ‘तैयारी की’ अनावश्यक विशिष्टता से बचता है।
- source_word: לפני מזבח
  choice: वेदी के सामने
  rationale: उपासना-संबंधी प्रसंग में यह स्वाभाविक और सीधा अनुवाद है।
- source_word: קול
  choice: ध्वनि
  rationale: शब्द का अर्थ ‘आवाज़’ या ‘ध्वनि’ है; संगीत के प्रसंग में ‘ध्वनि’ अधिक स्वाभाविक है।
- source_word: מזמור
  choice: भजन
  rationale: यह संगीतबद्ध स्तुति-गीत को सूचित करता है; मंदिर के प्रसंग में ‘भजन’ उपयुक्त है।
- source_word: נבלים
  choice: वीणाओं
  rationale: यह एक प्रकार के तार वाले वाद्यों का नाम है। हिन्दी में ‘वीणा’ परिचित व्यापक समतुल्य है, पर ठीक वाद्य-प्रकार अनिश्चित है।
- source_word: תקן
  choice: व्यवस्थित किया
  rationale: क्रिया में क्रम में लगाने, व्यवस्थित करने या स्थापित करने का भाव है; यहाँ संगीत और उपासना के संदर्भ में ‘व्यवस्थित किया’ ठीक बैठता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और अधिक सहज यूनानी समानांतर में अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी शब्दावली को रखा गया और उसकी अनिश्चितता पादटिप्पणी में बताई गई।
  alternative: “उसने गायकों को वेदी के सामने खड़ा किया, ताकि उनकी ध्वनि से धुनें मधुर हों।”
  rationale: इब्रानी साक्ष्य उपलब्ध है, पर आरंभिक वाक्यांश कठिन है और यूनानी पाठ से बड़ा अंतर रखता है। किसी एक पाठ को चुपचाप दूसरे के अनुरूप बनाने के बजाय दोनों पाठ-परंपराओं का तनाव स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। कठिन आरंभिक इब्रानी वाक्यांश को जानबूझकर सहज बनाकर नहीं बदला गया।
