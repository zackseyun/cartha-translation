  text: to divide the people into two tribes[b][a], and from Ephraim a lawless kingdom.
translation:
  language: hi
  text: लोगों को दो गोत्रों में बाँटने के लिए,[a] और एप्रैम से एक हिंसक राज्य।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ का अर्थ है: “शासन दो भागों में बँट जाए, और एप्रैम से एक अवज्ञाकारी राज्य आरम्भ हो।” इब्रानी पाठ अधिक स्पष्ट रूप से कहता है: “लोगों को दो गोत्रों में बाँटना।”'
    reason: alternative_reading
  - marker: b
    text: या “एक अन्यायी राज्य” अथवा “एक विद्रोही राज्य।” इब्रानी חמס हिंसा, अत्याचार या अन्याय को व्यक्त कर सकता है; यूनानी समानांतर अवज्ञा या विद्रोह पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק
  choice: बाँटने के लिए
  rationale: यहाँ क्रिया राजनीतिक विभाजन कराने का भाव रखती है; ‘बाँटना’ सरल और स्रोत के निकट है।
- source_word: העם
  choice: लोगों को
  rationale: עם का सीधा अर्थ ‘लोग’ है और यहाँ विभाजन से पहले समूचे समुदाय का बोध कराता है।
- source_word: לשני שבטים
  choice: दो गोत्रों में
  rationale: שבטים का शाब्दिक अर्थ ‘गोत्र’ है; ऐतिहासिक स्थिति को व्याख्यात्मक रूप से बदलने के बजाय इब्रानी कथन सुरक्षित रखा गया है।
- source_word: ומאפרים
  choice: और एप्रैम से
  rationale: מן उद्गम का अर्थ देता है; ‘से’ संक्षिप्त है और स्थान अथवा उद्भव की सूक्ष्म अस्पष्टता बनाए रखता है।
- source_word: ממלכת
  choice: राज्य
  rationale: ממלכה यहाँ राजनीतिक राज्य अथवा राजसत्ता को दर्शाता है; ‘राज्य’ स्वाभाविक हिन्दी है।
- source_word: חמס
  choice: हिंसक
  rationale: חמס का प्रमुख अर्थ हिंसा, अत्याचार या अन्याय है। यूनानी समानांतर विद्रोह/अवज्ञा पर बल देता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: एप्रैम से निकले राज्य का चरित्र
  choice: हिंसक राज्य
  alternative: अन्यायी राज्य; विद्रोही राज्य; अवज्ञाकारी राज्य
  rationale: मुख्य पाठ में इब्रानी חמס के प्रत्यक्ष हिंसा/अत्याचार-बोध को प्राथमिकता दी गई है, जबकि यूनानी ἀπειθῆ से मिलने वाला विद्रोह या अवज्ञा का अर्थ पादटिप्पणी में सुरक्षित है।
- issue: दूसरे खंड का क्रियारहित रूप
  choice: और एप्रैम से एक हिंसक राज्य
  alternative: और एप्रैम से एक हिंसक राज्य उठा
  rationale: इब्रानी में दूसरे खंड में स्पष्ट क्रिया नहीं है। मुख्य पाठ उसकी संक्षिप्तता और तनाव को बनाए रखता है; यूनानी में ‘आरम्भ होना’ का क्रियात्मक भाव है, जिसका उल्लेख पादटिप्पणी में है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्रोत-निकट हिन्दी। ‘गोत्र’ बाइबलीय जनजातीय संदर्भ के लिए चुना गया है। क्रियारहित अंतिम खंड जानबूझकर सुरक्षित रखा गया है, क्योंकि इब्रानी में कोई स्पष्ट क्रिया नहीं है।
