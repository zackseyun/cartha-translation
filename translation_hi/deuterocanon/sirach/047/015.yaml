  text: How wise you were in your youth[a], and instruction overflowed like the Nile.
translation:
  language: hi
  text: अपनी जवानी में तुम कितने बुद्धिमान थे,[a] और शिक्षा नील नदी के समान उमड़ पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “तुम्हारे प्राण ने पृथ्वी को ढक लिया, और तुमने उसे पहेली-जैसे दृष्टान्तों से भर दिया।” सम्भवतः यह किसी भिन्न इब्रानी मूल-पाठ या अलग पाठ-परम्परा को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מה חכמת
  choice: तुम कितने बुद्धिमान थे
  rationale: מה यहाँ प्रश्न नहीं, बल्कि प्रशंसात्मक विस्मय प्रकट करता है; חכמת को स्वाभाविक हिन्दी में अवस्था के रूप में व्यक्त किया गया है।
- source_word: בנעוריך
  choice: अपनी जवानी में
  rationale: यह सुलैमान के आरम्भिक जीवन को सूचित करने वाला सीधा कालवाचक पद है।
- source_word: ותצף
  choice: उमड़ पड़ी
  rationale: क्रिया प्रचुरता से ऊपर उठने या बह निकलने का बिंब देती है; ‘उमड़ पड़ी’ उस गतिशील प्रचुरता को स्वाभाविक हिन्दी में रखता है।
- source_word: כיאר
  choice: नील नदी के समान
  rationale: יאר सामान्यतः नील नदी का द्योतक है; विशिष्ट नदी-संबंधी बिंब को सामान्य ‘नदी’ बनाकर धुँधला नहीं किया गया।
- source_word: מוסר
  choice: शिक्षा
  rationale: מוסר में अनुशासन और चरित्र-निर्माण करने वाली शिक्षा दोनों का भाव हो सकता है; इस प्रसंग में ‘शिक्षा’ सहज है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
theological_decisions:
- issue: इब्रानी पाठ और भिन्न यूनानी पाठ में से आधार-पाठ का चयन
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी पाठ: ‘तुम्हारे प्राण ने पृथ्वी को ढक लिया, और तुमने उसे पहेलियों से भरे दृष्टान्तों से भर दिया।’'
  rationale: सीराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे मुख्य आधार बनाया गया है। यूनानी पाठ एक पर्याप्त रूप से भिन्न प्राचीन पाठ-परम्परा या अलग इब्रानी मूल-पाठ को दर्शाता है; अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रशंसात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। जल-प्रचुरता के मूल बिंब और नील नदी के विशिष्ट संकेत को बनाए रखा गया है।
