base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/018.yaml
  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
translation:
  language: hi
  text: तुम उस आदरणीय नाम से पुकारे गए, जो इस्राएल पर पुकारा जाता है[a]; तुमने सोना लोहे के समान बटोर लिया और चाँदी को सीसे के समान बहुत बढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका नाम इस्राएल पर लिया जाता है।” इब्रानी मुहावरा किसी व्यक्ति या समुदाय पर नाम पुकारे जाने, उसके उस नाम से संबंधित होने, अथवा उस नाम के अधिकार में होने का भाव दे सकता है।
    reason: मूल मुहावरे की वास्तविक अर्थ-व्याप्ति और वैकल्पिक अनुवाद सुरक्षित रखना।
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: तुम उस महिमामय नाम से पुकारे गए
  rationale: נקראת का कर्मवाच्य भाव और दूसरे पुरुष का संबोधन बनाए रखा गया है। הנכבד में सम्मान, गरिमा और महिमा का भाव है; ‘महिमामय’ सामान्य आधुनिक हिन्दी में दिव्य नाम की गरिमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הנקרא על ישראל
  choice: जो इस्राएल पर पुकारा जाता है
  rationale: मूल इब्रानी में पहले प्रयुक्त נקרא धातु की पुनरावृत्ति और ‘पर’ के स्थानिक रूपक को सुरक्षित रखा गया है। यूनानी ἐπικεκλημένου भी किसी पर नाम पुकारे या लगाए जाने के अर्थ का समर्थन करता है।
- source_word: ותצבר
  choice: तुमने … बटोर लिया
  rationale: क्रिया धन को इकट्ठा या संचित करने का बोध देती है। ‘बटोर लिया’ राजकीय धन-संचय के संदर्भ में सहज और स्पष्ट है।
- source_word: כברזל זהב
  choice: सोना लोहे के समान
  rationale: संक्षिप्त उपमा ज्यों की त्यों रखी गई है; आशय है कि सोना लोहे जितना प्रचुर हो गया था।
- source_word: וכעפרת הרבית כסף
  choice: चाँदी सीसे के समान बढ़ा ली
  rationale: עפרת का अर्थ यहाँ ‘सीसा’ है, जिसकी पुष्टि यूनानी μόλιβον से होती है। הרבית की वृद्धि/बहुलता को ‘बढ़ा ली’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘महिमामय नाम’ का अभिप्राय
  choice: इसे इस्राएल पर पुकारे जाने वाले दिव्य नाम की ओर संकेत करने वाली, परंतु पूरी तरह न खोली गई भाषा के रूप में रखा गया है।
  alternative: इसे स्पष्ट रूप से या तो सुलैमान द्वारा प्रभु का नाम धारण करना या केवल इस्राएल की वाचा-संबंधी पहचान कहना।
  rationale: इब्रानी और यूनानी दोनों एक प्रतिष्ठित दिव्य नाम को इस्राएल से जोड़ते हैं, पर पद स्वयं इस संबंध की प्रकृति स्पष्ट नहीं करता। इसलिए अनुवाद उस धर्मवैज्ञानिक संकेत और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। समानांतर उपमाओं—सोना/लोहा और चाँदी/सीसा—की संरचना तथा दूसरे पुरुष में सुलैमान को संबोधन बनाए रखा गया है।
