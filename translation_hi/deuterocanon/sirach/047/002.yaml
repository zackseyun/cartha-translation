base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/002.yaml
  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
translation:
  language: hi
  text: जैसे पवित्र भेंट में से चरबी अलग की जाती है,[a][b] वैसे ही दाऊद इस्राएल में से अलग किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक स्पष्ट रूप में यों भी अनुवाद किया जा सकता है: “जैसे मेलबलि में से चरबी अलग की जाती है, वैसे ही दाऊद इस्राएल की संतानों में से अलग किए गए।” यूनानी पाठ में “मेलबलि” और पृथक्करण का भाव अधिक स्पष्ट है।'
    reason: alternative_reading
  - marker: b
    text: “पवित्र भेंट में से” के लिए इब्रानी शब्द बहुत संक्षिप्त हैं; बलिदान से जुड़ी इस तुलना को समझने में समानांतर यूनानी पाठ सहायक है।
    reason: textual_variant
lexical_decisions:
- source_word: כחלב
  choice: जैसे…चरबी
  rationale: חֵלֶב का ठोस, बलिदान-संबंधी अर्थ ‘चरबी’ है। मुख्य पाठ में इसे ‘सबसे उत्तम भाग’ जैसे अमूर्त अर्थ में बदलने के बजाय मूल उपमा को बनाए रखा गया है।
- source_word: מורם
  choice: अलग की जाती है / अलग किए गए
  rationale: बलिदान के प्रसंग में רום का यह कर्मवाच्य कृदंत किसी भाग को उठाकर नियत या पृथक किए जाने का बोध देता है। यूनानी ἀφωρισμένον भी ‘अलग किया हुआ’ अर्थ का समर्थन करता है। तुलना की समानांतरता स्पष्ट करने के लिए यही क्रिया दाऊद के संबंध में भी व्यक्त की गई है।
- source_word: מקדש
  choice: पवित्र भेंट में से
  rationale: इब्रानी पद संक्षिप्त और कुछ अस्पष्ट है। यहाँ भौतिक पवित्रस्थान की अपेक्षा अर्पित पवित्र वस्तु या बलि का अंश अभिप्रेत है। ‘पवित्र भेंट’ इस धार्मिक संदर्भ को रखता है, पर मुख्य पाठ में यूनानी के अधिक विशिष्ट ‘मेलबलि’ अर्थ को आरोपित नहीं करता।
- source_word: כן דוד מישראל
  choice: वैसे ही दाऊद इस्राएल में से अलग किए गए
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है, जबकि यूनानी ‘इस्राएल की संतानों में से’ कहकर पृथक्करण का भाव स्पष्ट करता है। हिंदी में तुलना को स्वाभाविक बनाने के लिए पहले खंड की क्रिया को दूसरे खंड में दोहराया गया है।
theological_decisions:
- issue: दाऊद के चयन या विशिष्ट किए जाने को कितना स्पष्ट किया जाए
  choice: उन्हें ‘इस्राएल में से अलग किए गए’ कहना
  alternative: दाऊद को परमेश्वर ने इस्राएल में से चुन लिया
  rationale: बलिदान के नियत अंश की उपमा दाऊद की विशिष्टता और सम्मान का संकेत देती है, पर इस पंक्ति में परमेश्वर का कर्ता के रूप में स्पष्ट उल्लेख नहीं है। कर्मवाच्य अनुवाद उस संकेत को रखता है और अनुपस्थित धर्मवैचारिक विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चरबी’ ने बलिदान-संबंधी ठोस बिंब को सुरक्षित रखा है। दाऊद के लिए आदरसूचक बहुवचन का प्रयोग किया गया है।
