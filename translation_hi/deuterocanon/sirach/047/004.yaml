base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: hi
  text: अपनी जवानी में उसने एक वीर योद्धा को मार गिराया और सदा का अपमान दूर कर दिया[a]; गोफन के साथ हाथ उठाकर[b] उसने गोलियत का गौरव चूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “और उसने लोगों में से अपमान दूर कर दिया।” इब्रानी पाठ में है, “और उसने सदा का अपमान दूर कर दिया।”
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ स्पष्ट रूप से “दैत्य” कहता है और “गोफन के पत्थर” से गोलियत का घमंड गिराने की बात करता है; इससे स्पष्ट होता है कि यहाँ दाऊद द्वारा गोलियत को हराने का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: अपनी जवानी में
  rationale: यह दाऊद के युवावस्था के समय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना उसकी आयु को अनावश्यक रूप से निश्चित किए।
- source_word: הכה גבור
  choice: उसने एक वीर योद्धा को मार गिराया
  rationale: גבור का मूल अर्थ वीर या शक्तिशाली योद्धा है; प्रसंग और यूनानी समानांतर से प्राणघातक परिणाम स्पष्ट होने के कारण ‘मार गिराया’ उपयुक्त है, जबकि मुख्य पाठ में यूनानी का अधिक स्पष्ट ‘दैत्य’ नहीं थोपा गया।
- source_word: ויסר חרפת עולם
  choice: और सदा का अपमान दूर कर दिया
  rationale: इब्रानी के עולם को ‘सदा का’ और חרפה को सुबोध हिन्दी ‘अपमान’ से व्यक्त किया गया है। यूनानी के ‘लोगों से अपमान’ वाले भिन्न पाठ को पादटिप्पणी में रखा गया है।
- source_word: בהניפו ידו על קלע
  choice: गोफन चलाने के लिए अपना हाथ उठाकर
  rationale: इब्रानी वाक्यांश संक्षिप्त है। यह अनुवाद हाथ उठाने और गोफन के साधनात्मक संबंध को सहज हिन्दी में स्पष्ट करता है; यूनानी का ‘गोफन के पत्थर’ वाला विस्तार पादटिप्पणी में बताया गया है।
- source_word: וישבר תפארת גלית
  choice: उसने गोलियत का गौरव चूर कर दिया
  rationale: תפארת में गौरव, वैभव या घमंड का अर्थ हो सकता है। ‘गौरव चूर कर दिया’ इब्रानी रूपक को बनाए रखता है और प्रसंग में अभिमान के पतन का संकेत भी देता है।
theological_decisions:
- issue: दूर किए गए अपमान के वर्णन में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी ‘सदा का अपमान दूर कर दिया’
  alternative: 'यूनानी: ‘लोगों में से अपमान दूर कर दिया’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिक रखा गया है। यूनानी समानांतर दाऊद और गोलियत के प्रसंग की पुष्टि करता है, पर उसके अधिक स्पष्ट सामुदायिक रूप को मुख्य पाठ में इब्रानी के स्थान पर नहीं रखा गया।
- issue: गोलियत के लिए वीर योद्धा या दैत्य
  choice: इब्रानी के अनुसार ‘वीर योद्धा’
  alternative: यूनानी के अनुसार ‘दैत्य’
  rationale: इब्रानी גבור को उसके सामान्य अर्थ में रखा गया है, जबकि यूनानी की अधिक स्पष्ट पहचान को पादटिप्पणी में दर्ज किया गया है; इससे साक्ष्यों का वास्तविक अंतर बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गोफन’ बाइबलीय प्रसंग में प्रचलित और सटीक शब्द है। इब्रानी को मुख्य आधार बनाया गया है तथा यूनानी के स्पष्टकारी या भिन्न पाठों को पादटिप्पणियों में सुरक्षित रखा गया है।
