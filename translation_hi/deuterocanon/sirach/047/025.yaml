base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/025.yaml
  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: hi
  text: उसने एप्रैम को ठोकर का कारण दिया[a], उन्हें उनकी भूमि से निकालने के लिए। उसका पाप बहुत बढ़ गया, और उसने अपने आपको हर बुराई के हाथों बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “उनके पाप बहुत बढ़ गए, जिससे वे अपनी भूमि से दूर कर दिए गए; और उन्होंने हर प्रकार की दुष्टता खोजी, जब तक कि उन पर दण्ड न आ पड़ा।” यहाँ हिब्रू साक्ष्य एकवचन में और अधिक संक्षिप्त है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: उसने एप्रैम के लिए ठोकर का कारण रखा
  rationale: वाक्यांश में सामान्य क्रिया ‘दिया/रखा’ और מכשול की ठोकर-दिलाने वाली उपमा को बनाए रखा गया है। ‘के लिए’ हिब्रू ל की दिशा/संबंधगत अस्पष्टता को अनावश्यक रूप से ‘के हवाले कर दिया’ नहीं बनाता।
- source_word: להדיחם מאדמתם
  choice: ताकि उन्हें उनकी भूमि से निकाल दिया जाए
  rationale: להדיחם का अर्थ हटाने या खदेड़ने का कारण बनना है। हिंदी का कर्मवाच्य लक्ष्यित परिणाम को स्वाभाविक ढंग से व्यक्त करता है और बहुवचन प्रत्यय ‘उन्हें/उनकी’ सुरक्षित रखता है।
- source_word: ותגדל חטאתו מאד
  choice: उसका पाप बहुत बढ़ गया
  rationale: प्राप्त हिब्रू पाठ के एकवचन ‘उसका पाप’ का अनुसरण किया गया है; यूनानी के बहुवचन पाठ को पादटिप्पणी में रखा गया है।
- source_word: ולכל רעה התמכר
  choice: उसने अपने आपको हर प्रकार की बुराई के हाथ बेच दिया
  rationale: התמכר में निहित स्वयं को बेच देने की सशक्त उपमा को स्वाभाविक हिंदी में सुरक्षित रखा गया है। ‘हर प्रकार की बुराई’ לכל רעה का सहज सामूहिक अर्थ देता है।
theological_decisions:
- issue: दूसरे भाग में हिब्रू एकवचन और यूनानी बहुवचन
  choice: मुख्य पाठ में हिब्रू का एकवचन—‘उसका पाप बहुत बढ़ गया’—रखा गया है।
  alternative: ‘उनके पाप बहुत बढ़ गए’
  rationale: यहाँ उपलब्ध हिब्रू साक्ष्य प्राथमिक है और संभवतः पिछले प्रसंग के शासक की ओर संकेत करता है। किंतु यूनानी पाठ वास्तविक प्राचीन वैकल्पिक साक्ष्य है, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: התמכר में नैतिक कर्तृत्व की उपमा
  choice: ‘उसने अपने आपको ... बेच दिया’
  alternative: ‘उसने अपने आपको ... के वश में कर दिया’
  rationale: चुना हुआ रूप हिब्रू की आत्म-विक्रय वाली उपमा और उसके नैतिक भार को बनाए रखता है, बिना किसी बाद की विशिष्ट धर्मसैद्धांतिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘एप्रैम’, ‘ठोकर का कारण’ और ‘अपने आपको ... बेच दिया’ स्रोत की प्रमुख उपमाओं और नाम को सुरक्षित रखते हैं।
