base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/016.yaml
  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: hi
  text: तूने अपनी बुद्धि से[a] पृथ्वी को ढक दिया, और ऊँचाइयों को स्तुतिगान से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “तेरा नाम दूरस्थ द्वीपों तक पहुँचा, और तेरी शांति में तू प्रिय ठहरा।” यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כסית
  choice: ढक दिया
  rationale: यह כסה के सामान्य अर्थ ‘ढकना’ को सीधे व्यक्त करता है और बुद्धि के व्यापक रूप से फैलने का ठोस काव्यात्मक रूपक बनाए रखता है।
- source_word: בחכמתך
  choice: अपनी बुद्धि से
  rationale: ב का साधनवाचक भाव ‘से’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है; ‘अपनी’ द्वितीय पुरुष प्रत्यय को स्पष्ट करता है।
- source_word: ותקלס
  choice: भर दिया
  rationale: यह कठिन रूप है। במרום שירה के साथ प्रसंग में इसका आशय ऊँचाइयों को गीत से भर देने या गुंजा देने का प्रतीत होता है। ‘भर दिया’ वाक्य-संयोजन को स्वाभाविक रखता है, यद्यपि मूल रूप की व्याख्या निश्चित नहीं है।
- source_word: במרום
  choice: ऊँचाइयों को
  rationale: מרום ऊँचे स्थान, ऊँचाइयाँ या स्वर्ग सूचित कर सकता है। ‘ऊँचाइयों’ से काव्यात्मक स्थान-बिंब बना रहता है और अर्थ को केवल ‘स्वर्ग’ तक सीमित नहीं किया जाता।
- source_word: שירה
  choice: स्तुतिगान
  rationale: שירה का मूल अर्थ ‘गीत’ या ‘गायन’ है। इस प्रसंग में ‘स्तुतिगान’ उसके संभावित प्रशंसात्मक भाव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और अत्यंत भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य का अनुसरण किया गया है।
  alternative: 'यूनानी के आधार पर: ‘तेरा नाम दूर-दूर के द्वीपों तक पहुँचा, और तेरी शांति के कारण तुझसे प्रेम किया गया।’'
  rationale: यहाँ इब्रानी पाठ उपलब्ध और विश्वसनीय है, इसलिए उसे प्राथमिकता दी गई है। यूनानी संभवतः भिन्न आधार-पाठ या पाठ के किसी दूसरे चरण को दर्शाता है; पारदर्शिता के लिए उसका रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। सुलैमान को संबोधन के लिए ‘तूने’ चुना गया है, जो बाइबलीय काव्य में सीधा और स्वाभाविक संबोधन है।
