  text: He played with young lions as with a kid[b][a], and with bears as with calves of Bashan.
translation:
  language: hi
  text: वह युवा सिंहों के साथ ऐसे खेलता था मानो वे बकरी के बच्चे हों, और भालुओं के साथ ऐसे मानो वे बाशान के पशुओं के बच्चे हों।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बाशान अपने हृष्ट-पुष्ट पशुधन के लिए प्रसिद्ध था। इब्रानी में यहाँ ‘बाशान के बच्चे’ है; इससे युवा पशुओं का संकेत मिलता है, पर पशु की जाति निश्चित नहीं होती।
    reason: cultural_note
  - marker: b
    text: 'यूनानी पाठ: “और भालुओं के साथ ऐसे जैसे भेड़ों के मेमनों के साथ।” यह दूसरी तुलना को इब्रानी “बाशान के बच्चे” की अपेक्षा अधिक स्पष्ट बनाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לכפירים
  choice: जवान सिंहों के साथ
  rationale: כפירים जवान सिंहों को सूचित करता है; उपसर्ग ל को यहाँ साथ या बीच में होने के अर्थ में लेना यूनानी समानांतर से भी पुष्ट होता है।
- source_word: שחק
  choice: खेलता था
  rationale: क्रिया निर्भय, खेल-जैसे व्यवहार को व्यक्त करती है; आधुनिक हिन्दी में यह सरल और स्वाभाविक है।
- source_word: כגדי
  choice: जैसे बकरी के बच्चे के साथ
  rationale: גדי का अर्थ बकरी का बच्चा है। तुलना का आशय है कि दाऊद खतरनाक सिंहों को पालतू छोटे पशु की तरह सहजता से लेता था।
- source_word: ולדבים
  choice: और भालुओं के साथ
  rationale: संयोजक और पूर्वसर्ग पहली अर्ध-पंक्ति के समानांतर भालुओं के साथ व्यवहार का चित्र जारी रखते हैं।
- source_word: כבני בשן
  choice: ऐसे जैसे बाशान के पशु-शावकों के साथ
  rationale: इब्रानी का शाब्दिक अर्थ ‘बाशान के पुत्रों/बच्चों’ जैसा है। ‘पशु-शावक’ उस खुले पशुपालन-संबंधी संकेत को बनाए रखता है और बिना पर्याप्त आधार इसे केवल बछड़ों या मेमनों तक सीमित नहीं करता।
theological_decisions:
- issue: काव्यात्मक उपमा में विद्यमान इब्रानी पाठ और अधिक स्पष्ट यूनानी समानांतर के बीच चुनाव
  choice: मुख्य पाठ में विद्यमान इब्रानी ‘बाशान के बच्चों/शावकों’ का अनुसरण किया गया है।
  alternative: यूनानी के अनुसार ‘भेड़ों के मेमनों के साथ।’
  rationale: जहाँ इब्रानी पाठ उपलब्ध है वहाँ उसे प्राथमिकता दी गई है। यूनानी समग्र भाव की पुष्टि करता है, पर दूसरी उपमा को अधिक स्पष्ट या व्याख्यायित करता प्रतीत होता है; इसलिए उसका पाठ टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पशु-शावक’ इब्रानी की वास्तविक अस्पष्टता को बचाता है; टिप्पणियाँ बाशान की सांस्कृतिक पृष्ठभूमि और यूनानी वैकल्पिक रूप दोनों देती हैं।
