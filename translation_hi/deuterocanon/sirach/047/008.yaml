base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: hi
  text: अपने हर काम में उसने महिमापूर्ण वचनों से परमप्रधान परमेश्वर को धन्यवाद दिया[a]। उसने अपने पूरे हृदय से अपने रचनेवाले से प्रेम किया, और हर दिन गीतों से उसका धन्यवाद किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “महिमा के वचनों से”; यूनानी में भी इसी प्रकार एकवचन में “महिमा के वचन से” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में है, “और हर दिन उसने गीतों से उसका धन्यवाद किया।” इसके विपरीत यूनानी समानांतर पाठ में है, “उसने स्तुति गाई और अपने रचनेवाले से प्रेम किया,” और उसमें “हर दिन” का स्पष्ट वाक्यांश नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: अपने हर काम में
  rationale: यह इब्रानी के सामूहिक और व्यापक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आशय उसके समस्त कार्यों से है।
- source_word: נתן הודות
  choice: धन्यवाद दिया
  rationale: इब्रानी मुहावरे का सहज हिन्दी समतुल्य है और कृतज्ञता के भाव को सामान्य ‘स्तुति की’ से अधिक स्पष्ट रखता है।
- source_word: לאל עליון
  choice: परमप्रधान परमेश्वर को
  rationale: यह ईश्वर के लिए प्रयुक्त עליון उपाधि को प्रचलित, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: באמרי כבוד
  choice: महिमापूर्ण वचनों से
  rationale: शाब्दिक संरचना ‘महिमा के वचनों से’ है; ‘महिमापूर्ण वचनों से’ उसी संबंध को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בכל לבו
  choice: अपने पूरे हृदय से
  rationale: यह पूर्ण आंतरिक समर्पण व्यक्त करने वाले इब्रानी मुहावरे का स्पष्ट हिन्दी रूप है।
- source_word: אוהב עשהו
  choice: अपने रचनेवाले से प्रेम किया
  rationale: עשהו का व्यक्तिगत अर्थ ‘जिसने उसे बनाया’ है; ‘अपने रचनेवाले’ इसे संक्षिप्त और संबंधपरक ढंग से व्यक्त करता है।
- source_word: וכבל יום
  choice: और हर दिन
  rationale: प्रेषित पाठ का संभावित आशय ‘हर दिन/दिन-प्रतिदिन’ है; पाठगत अनिश्चितता को पादटिप्पणी में बताया गया है।
- source_word: הודה לו בזמירות
  choice: गीतों से उसका धन्यवाद किया
  rationale: הודה में धन्यवाद और स्तुति दोनों की छाया हो सकती है; यहाँ पहले समान क्रिया के अनुरूप ‘धन्यवाद किया’ रखा गया है, जबकि זמירות को व्यापक और सहज ‘गीतों’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय उपाधि עליון
  choice: परमप्रधान
  alternative: सर्वोच्च
  rationale: ‘परमप्रधान’ इस ईश्वरीय उपाधि का स्थापित और गरिमापूर्ण हिन्दी रूप है तथा इब्रानी और यूनानी दोनों साक्ष्यों के अनुरूप है।
- issue: עשהו का ईश्वर-संबंधी वर्णन
  choice: अपने रचनेवाले
  alternative: अपने सृष्टिकर्ता
  rationale: ‘रचनेवाले’ मूल के व्यक्तिगत ‘जिसने उसे बनाया’ भाव को बनाए रखता है और अनावश्यक रूप से अधिक अमूर्त धार्मिक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘परमप्रधान परमेश्वर’, ‘पूरे हृदय से’ और ‘रचनेवाले’ जैसे पद सामान्य पाठक के लिए बोधगम्य रखते हुए मूल की धार्मिक गंभीरता बनाए रखते हैं।
