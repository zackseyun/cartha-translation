base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/020.yaml
  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: hi
  text: तुमने अपने सम्मान पर कलंक लगाया और अपने बिछौने को अपवित्र किया,[a] इस प्रकार अपनी संतान पर क्रोध और अपनी शय्या पर कराहना ले आए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “और अपने वंश को अपवित्र किया” है, न कि “और अपने बिछौने को अपवित्र किया।”
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ का अंत “और तुम्हारी मूर्खता पर संताप” से होता है, न कि “अपनी शय्या पर कराहना” से।
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום בכבודך
  choice: तुमने अपने सम्मान पर कलंक लगाया
  rationale: शाब्दिक इब्रानी मुहावरा ‘अपने सम्मान में/पर दोष देना’ है। ‘कलंक लगाया’ מום की ठोस छवि और राजकीय-मर्यादात्मक अपमान, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ותחלל
  choice: और ... को अपवित्र किया
  rationale: पिएल रूप חלל नैतिक और धार्मिक अपवित्रीकरण की प्रबल धारणा रखता है; ‘अपवित्र किया’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יצועיך
  choice: अपने बिछौने
  rationale: यह शब्द लेटने के स्थान या बिछौने को दर्शाता है और यहाँ यौन/वैवाहिक संकेत रखता है। ‘बिछौना’ मूल बिंब को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: להביא אף על צאצאיך
  choice: जिससे तुम्हारी संतान पर क्रोध आया
  rationale: क्रियार्थक infinitive को परिणाम के रूप में पढ़ा गया है। אף यहाँ तीव्र क्रोध है और צאצאים सामूहिक रूप से वंशज/संतान को सूचित करता है।
- source_word: ואנחה על משכבך
  choice: और तुम्हारी शय्या पर कराहना पड़ा
  rationale: אנחה को ‘कराहना’ और משכב को ‘शय्या’ अनूदित करने से पीड़ा तथा लेटने के स्थान का बिंब सुरक्षित रहता है। पहले आए ‘बिछौने’ से जानबूझकर निकट समानांतरता भी बनी रहती है।
theological_decisions:
- issue: अंतिम उपवाक्य का सुलैमान के पाप और उसके परिणामों से संबंध
  choice: इब्रानी के अनुसार उसके बिछौने के अपवित्रीकरण के फलस्वरूप वंश पर क्रोध और उसकी शय्या पर व्यक्तिगत कराहने का चित्र रखा गया है।
  alternative: यूनानी पाठ अंतिम परिणाम को ‘तुम्हारी मूर्खता पर संताप’ कहता है।
  rationale: प्राथमिक इब्रानी पाठ दोनों पंक्तियों में बिछौने/शय्या का बिंब रखता है और यौन-वैवाहिक अपराध को उसके परिणाम से जोड़ता है। यूनानी भिन्न पाठ को पादटिप्पणी में सुरक्षित रखा गया है, न कि मुख्य पाठ में मिला दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक गद्य। ‘सम्मान’, ‘कलंक’ और ‘अपवित्र’ सामान्य पाठक के लिए स्पष्ट हैं; ‘बिछौना/शय्या’ की समानांतर शब्दावली मूल इब्रानी के दो निकटार्थी पदों और उनके साहित्यिक संबंध को बनाए रखती है।
