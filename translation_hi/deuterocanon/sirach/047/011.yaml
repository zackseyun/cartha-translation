base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: hi
  text: याहवे ने उसका अपराध भी दूर कर दिया[a], और उसके सींग[b] को सदा के लिए ऊँचा उठाया। उसने उसे राजत्व का विधान दिया[c] और यरूशलेम में उसका सिंहासन स्थिर किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ है, “प्रभु ने उसके पाप दूर कर दिए।” इब्रानी में एकवचन “उसका अपराध” है; क्रिया का मूल बिंब उसे “पार कर देने” या “जाने देने” का है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सींग” सामर्थ्य, प्रतिष्ठा और राजकीय उत्कर्ष का बाइबलीय रूपक है।
    reason: metaphor_clarification
  - marker: c
    text: यूनानी पाठ है, “उसे राजाओं की वाचा और इस्राएल में महिमा का सिंहासन दिया।” इब्रानी में “राजत्व का विधान” है; अंतिम पदबंध का अधिक शाब्दिक रूप “यरूशलेम तक उसका सिंहासन स्थिर किया” है।
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को नाम के रूप में सुरक्षित रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: העביר פשעו
  choice: उसका अपराध भी दूर कर दिया
  rationale: העביר के ‘हटा देना/दूर कर देना’ वाले बिंब और פשע के गंभीर ‘अपराध/उल्लंघन’ भाव को स्वाभाविक हिन्दी में रखता है; केवल ‘क्षमा किया’ कहकर बिंब को पूरी तरह नहीं समेटता।
- source_word: וירם לעולם קרנו
  choice: उसके सींग को सदा के लिए ऊँचा किया
  rationale: राजकीय सामर्थ्य और प्रतिष्ठा के इब्रानी ‘सींग’ रूपक को सपाट किए बिना सुरक्षित रखता है।
- source_word: חוק ממלכת
  choice: राजत्व की विधि
  rationale: חוק के विधान/स्थायी व्यवस्था के कानूनी भाव और ממלכת के राजत्व-संबंधी अर्थ को बनाए रखता है; यूनानी पाठ के ‘राजाओं की वाचा’ को मुख्य पाठ में नहीं मिलाता।
- source_word: וכסאו הכין עד ירושלים
  choice: यरूशलेम में उसका सिंहासन स्थिर किया
  rationale: הכין का अर्थ ‘दृढ़/स्थिर करना’ है। עד ירושלים का शब्दशः रूप असामान्य है; प्रसंगानुकूल हिन्दी में स्थानगत अर्थ दिया गया है और शाब्दिक रूप तथा यूनानी भिन्नता पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: दाऊद के अपराध के प्रति परमेश्वर का कार्य
  choice: ‘अपराध दूर कर दिया’—दैवी अपराध-निवारण को व्यक्त करते हुए इब्रानी क्रिया का बिंब बनाए रखा गया।
  alternative: ‘अपराध क्षमा कर दिया’ अथवा यूनानी के अनुसार ‘उसके पाप दूर कर दिए।’
  rationale: पाठ से आगे बढ़कर प्रायश्चित या दाऊद की बिना शर्त स्वीकृति का कोई सिद्धान्त नहीं जोड़ा गया।
- issue: राजवंशीय अनुदान का स्वरूप
  choice: इब्रानी के अनुसार ‘राजत्व की विधि।’
  alternative: यूनानी के अनुसार ‘राजाओं की वाचा।’
  rationale: जहाँ इब्रानी पाठ उपलब्ध है, उसे मुख्य साक्ष्य माना गया है; महत्वपूर्ण यूनानी पाठांतर पादटिप्पणी में दिया गया है।
- issue: सिंहासन का स्थान या विस्तार
  choice: मुख्य पाठ में स्वाभाविक स्थानगत अर्थ ‘यरूशलेम में।’
  alternative: इब्रानी का अधिक शाब्दिक ‘यरूशलेम तक’; यूनानी में ‘इस्राएल में महिमा का सिंहासन।’
  rationale: कठिन इब्रानी वाक्यांश को चुपचाप निर्णीत नहीं किया गया; उसकी वास्तविक अनिश्चितता पादटिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय धार्मिक गद्य। ‘सींग’ जैसे मूल बाइबलीय रूपक को बनाए रखते हुए पादटिप्पणी से स्पष्ट किया गया है; कठिन पाठांतरों को मुख्य पाठ में मिलाने के बजाय अलग दर्ज किया गया है।
