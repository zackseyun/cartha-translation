base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: hi
  text: 'क्योंकि उसने परमप्रधान परमेश्वर[a] को पुकारा,

    और परमेश्वर ने उसके दाहिने हाथ में सामर्थ्य दिया,

    ताकि वह युद्ध-कुशल पुरुष को पीछे धकेल दे

    और इस्राएल के सींग[b] को ऊँचा उठाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “परमप्रधान प्रभु।”
    reason: इब्रानी אל עליון (“परमप्रधान परमेश्वर”) और यूनानी κύριον τὸν ὕψιστον के बीच उपाधि-संबंधी अंतर को सुरक्षित रखना।
  - marker: b
    text: “सींग” बाइबिल में सामर्थ्य, प्रतिष्ठा या शक्ति का प्रतीक है।
    reason: मुख्य पाठ में रखे गए बाइबिलीय रूपक का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: קרא אל
  choice: को पुकारा
  rationale: यह इब्रानी मुहावरा सहायता के लिए किसी को पुकारने या उसका आह्वान करने को दर्शाता है। “को पुकारा” आधुनिक हिन्दी में स्वाभाविक है और प्रार्थनापूर्ण निवेदन का भाव बनाए रखता है।
- source_word: אל עליון
  choice: परमप्रधान परमेश्वर
  rationale: इब्रानी का सीधा अर्थ “परमप्रधान परमेश्वर” है। यूनानी समानांतर पाठ “परमप्रधान प्रभु” पढ़ता है; उस भिन्नता को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ויתן בימינו עז
  choice: परमेश्वर ने उसके दाहिने हाथ को बल दिया
  rationale: मूल में किसी के दाहिने हाथ में या उसे बल देने का सजीव शारीरिक बिंब है। संदर्भ में देने वाला परमेश्वर और पाने वाला दाऊद है; नाम दोहराने से हिन्दी में अस्पष्ट सर्वनाम से बचते हुए बिंब बना रहता है।
- source_word: להדוף
  choice: पीछे धकेल दे
  rationale: क्रिया का मूल भाव धकेलना या खदेड़ना है। यह अनुवाद युद्ध-संदर्भ में स्वाभाविक है और उसे अनावश्यक रूप से “मार डालना” नहीं बनाता।
- source_word: איש יודע מלחמות
  choice: युद्ध-कुशल पुरुष
  rationale: शाब्दिक भाव “युद्धों को जानने वाला पुरुष” है। “युद्ध-कुशल” उसकी युद्ध-संबंधी दक्षता को संक्षिप्त और सहज हिन्दी में व्यक्त करता है, संभवतः गोलियत की ओर संकेत करते हुए भी नाम नहीं जोड़ता।
- source_word: ולהרים את קרן ישראל
  choice: इस्राएल का सींग ऊँचा करे
  rationale: “सींग” सामर्थ्य, प्रतिष्ठा और प्रभुत्व का पारंपरिक बाइबिलीय रूपक है। इसे मुख्य पाठ में बनाए रखने से काव्यात्मक बिंब सुरक्षित रहता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: इब्रानी और यूनानी में ईश्वरीय उपाधि का अंतर
  choice: परमप्रधान परमेश्वर
  alternative: परमप्रधान प्रभु
  rationale: प्राथमिक इब्रानी साक्ष्य אל עליון स्पष्ट रूप से “परमप्रधान परमेश्वर” देता है, जबकि यूनानी में κύριον τὸν ὕψιστον, “परमप्रधान प्रभु,” है। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर पादटिप्पणी में दिया गया है, ताकि दोनों को कृत्रिम रूप से न मिलाया जाए।
- issue: ויתן में कर्ता की पहचान
  choice: परमेश्वर ने उसके दाहिने हाथ को बल दिया
  alternative: उसने उसके दाहिने हाथ को बल दिया
  rationale: इब्रानी क्रिया का कर्ता व्याकरणतः पिछले कथन के परमप्रधान परमेश्वर से स्वाभाविक रूप से जुड़ता है। स्पष्ट संज्ञा का प्रयोग हिन्दी में दो पुरुषवाचक सर्वनामों से उत्पन्न भ्रम को दूर करता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध और हल्का काव्यात्मक पद्य-विन्यास अपनाया गया है। “दाहिने हाथ” और “सींग ऊँचा करना” जैसे मूल बिंब सुरक्षित रखे गए हैं; कठिन रूपक की व्याख्या पादटिप्पणी में है।
