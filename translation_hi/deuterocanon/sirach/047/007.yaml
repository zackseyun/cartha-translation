base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/007.yaml
  text: He gave cities among the Philistines[b][a], and to this day he has broken their horn.
translation:
  language: hi
  text: उसने पलिश्तियों के बीच नगर दिए[a], और आज तक उनका सींग तोड़ रखा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस संक्षिप्त इब्रानी अभिव्यक्ति का अर्थ संभवतः ‘पलिश्तियों से नगर लिए’ या ‘पलिश्तिया में नगर दिए’ भी हो सकता है। यूनानी समानांतर इसे पलिश्तियों पर दाऊद की स्थायी विजय के संदर्भ में समझता है।
    reason: alternative_reading
  - marker: b
    text: ‘सींग’ बाइबिल में शक्ति या सामर्थ्य का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: उसने ... दिए
  rationale: נתן का सामान्य अर्थ ‘देना/रखना/स्थापित करना’ है। संदर्भ असामान्य रूप से संक्षिप्त है, इसलिए मुख्य पाठ में सीधे अर्थ ‘दिए’ को बनाए रखा गया है और संभावित स्थानिक अथवा विजय-संबंधी अर्थ को टिप्पणी में बताया गया है।
- source_word: בפלשתים
  choice: पलिश्तियों के बीच
  rationale: ב के साथ जातिनाम का प्रयोग यहाँ संक्षिप्त और कुछ अस्पष्ट है। ‘के बीच’ इब्रानी रूप के निकट है; यूनानी समानांतर इससे पलिश्तियों पर दाऊद की विजय का संदर्भ पुष्ट करता है।
- source_word: ערים
  choice: नगर
  rationale: ערים का सामान्य अर्थ नगर/शहर है। ‘नगर’ आधुनिक, गरिमापूर्ण और सैन्य-राजनीतिक संदर्भ के अनुकूल है।
- source_word: ועד היום שבר
  choice: आज तक ... तोड़ रखा है
  rationale: ועד היום के साथ पूर्ण क्रिया शבר ऐसे कार्य और उसके वर्तमान तक बने प्रभाव को व्यक्त करती है। ‘तोड़ रखा है’ हिन्दी में इस स्थायी परिणाम को स्वाभाविक ढंग से प्रकट करता है।
- source_word: קרנם
  choice: उनका सींग
  rationale: ‘सींग’ मूल इब्रानी बिंब को सुरक्षित रखता है और यूनानी κέρας से भी पुष्ट है। इसका रूपकात्मक अर्थ शक्ति या सामर्थ्य है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पलिश्ती नगरों के प्रति दाऊद की कार्रवाई का ऐतिहासिक अर्थ
  choice: इब्रानी का संक्षिप्त कथन ‘पलिश्तियों के बीच नगर दिए’ मुख्य पाठ में रखा गया।
  alternative: उसने पलिश्तियों से नगर ले लिए / उसने चारों ओर के पलिश्तियों को पराजित किया।
  rationale: प्राथमिक इब्रानी साक्ष्य को यूनानी समानांतर के विस्तार से प्रतिस्थापित नहीं किया गया। फिर भी यूनानी पाठ यह पुष्टि करता है कि व्यापक संदर्भ पलिश्ती शक्ति पर दाऊद की स्थायी विजय है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण शैली अपनाई गई है। इब्रानी की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है; ‘सींग’ के मूल बिंब को सरल अर्थ से प्रतिस्थापित नहीं किया गया।
