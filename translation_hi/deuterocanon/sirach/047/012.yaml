translation:
  language: hi
  text: उसके कारण, उसके बाद एक समझदार पुत्र उठा[a], जो सुरक्षित रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उसके बाद एक समझदार पुत्र उठा, और उसके कारण वह खुले विस्तार में बस गया।” इब्रानी साक्ष्य में है: “जो सुरक्षित रहता था।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: उसके कारण
  rationale: בַּעֲבוּר के कारणवाचक अर्थ को सीधे रखता है और पुत्र की अनुकूल स्थिति को उसके पूर्ववर्ती से जोड़ता है, बिना संबंध को और अधिक स्पष्ट किए।
- source_word: עָמַד אַחֲרָיו
  choice: उसके बाद ... खड़ा हुआ
  rationale: עמד की ‘खड़ा होना’ वाली इब्रानी छवि और उत्तराधिकार का प्रसंग दोनों सुरक्षित रहते हैं; यूनानी ἀνέστη भी ‘उठा/खड़ा हुआ’ का समर्थन करता है।
- source_word: בֵּן מַשְׂכִּיל
  choice: एक समझदार पुत्र
  rationale: מַשְׂכִּיל बोध, विवेक और समझ रखने वाले व्यक्ति को दर्शाता है। ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल नैतिक ‘बुद्धिमत्ता’ तक सीमित नहीं करता।
- source_word: שׁוֹכֵן לָבֶטַח
  choice: जो निश्चिन्त होकर रहता था
  rationale: שׁוֹכֵן के रहने/निवास करने और לָבֶטַח की सुरक्षित, निर्भय दशा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुत्र की सुरक्षित दशा का उसके पूर्ववर्ती से संबंध
  choice: पुत्र उसके कारण उसके बाद खड़ा हुआ और निश्चिन्त होकर रहा
  alternative: 'यूनानी के अनुसार: ‘उसके बाद एक समझदार पुत्र उठा, और उसके कारण वह खुले विस्तार में बस गया।’'
  rationale: इब्रानी और यूनानी दोनों पुत्र की अनुकूल दशा को पूर्ववर्ती से जोड़ते हैं। मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है और इस संबंध को किसी अतिरिक्त राजवंशीय या धर्मवैज्ञानिक दावे में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘खड़ा हुआ’ इब्रानी बिंब को बनाए रखता है; ‘निश्चिन्त होकर रहता था’ सुरक्षा और निर्भय निवास का स्वाभाविक हिन्दी रूप है।
