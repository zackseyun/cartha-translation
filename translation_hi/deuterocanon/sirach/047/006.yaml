  choice: मुख्य पाठ में हिब्रू के अनुसार ‘पगड़ी’
  alternative: यूनानी के अनुसार ‘महिमा का मुकुट’
  rationale: उपलब्ध हिब्रू साक्ष्य को प्राथमिकता दी गई है, जबकि राजकीय अभिषेक पर बल देने वाली वास्तविक यूनानी पाठ-परंपरा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘युवतियों’ प्रसंगगत स्वाभाविकता देता है, ‘जयघोष’ सार्वजनिक विजय-प्रशंसा को व्यक्त करता है, और मुख्य पाठ हिब्रू साक्ष्य की कठिनता तथा यूनानी विकल्प के बीच अंतर को मिटाता नहीं है।
