base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: hi
  text: इसलिए युवतियों ने उसे उत्तर दिया[a], और दसियों हज़ारों के बीच उसका जयघोष किया। जब उसने पगड़ी बाँधी, तब वह लड़ा, और उसने चारों ओर शत्रुओं को अधीन कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ ‘उत्तर दिया’ संभवतः विजय के बाद युवतियों द्वारा प्रत्युत्तर में गीत गाने या उत्सव मनाने की ओर संकेत करता है। यूनानी पाठ में है: ‘इस प्रकार उसने उसे दसियों हज़ारों के बीच महिमा दी और प्रभु की आशीषों के साथ उसकी प्रशंसा की, जब उसके लिए महिमा का मुकुट लाया गया।’ यह हिब्रू की ‘पगड़ी’ की अपेक्षा अधिक स्पष्ट राजकीय छवि प्रस्तुत करता है।'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: על כן
  choice: इसलिए
  rationale: पिछले प्रसंग की विजय और प्रशंसा से परिणामात्मक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ענו לו
  choice: उसे उत्तर दिया
  rationale: ענה के मूल अर्थ ‘उत्तर देना/प्रत्युत्तर देना’ को बनाए रखता है; विजय के बाद गीत में प्रत्युत्तर देने की संभावना टिप्पणी में स्पष्ट की गई है।
- source_word: בנות
  choice: युवतियों
  rationale: शाब्दिक ‘बेटियों’ की अपेक्षा इस विजय-उत्सव के प्रसंग में आधुनिक हिन्दी में अधिक स्वाभाविक है, पर स्त्री-समूह का संकेत सुरक्षित रखता है।
- source_word: ויכנוהו
  choice: उसका जयघोष किया
  rationale: कठिन हिब्रू रूप और यूनानी समानांतर के महिमान्वित/प्रशंसित करने के भाव को सार्वजनिक विजय-अभिनंदन के रूप में व्यक्त करता है।
- source_word: ברבבה
  choice: दस हज़ारों के बीच
  rationale: רבבה की संख्यात्मक अभिव्यक्ति को बहुवचन और विशाल जनसमूह के भाव सहित सुरक्षित रखता है।
- source_word: בעטותו
  choice: जब उसने … बाँधी
  rationale: स्वयं सिर पर लपेटने या धारण करने की क्रिया और उसके कालगत संबंध को स्पष्ट करता है।
- source_word: צניף
  choice: पगड़ी
  rationale: लपेटे जाने वाले सिर-वस्त्र के हिब्रू अर्थ का सीधा और सहज हिन्दी रूप; यूनानी ‘महिमा का मुकुट’ वैकल्पिक पाठ के रूप में टिप्पणी में रखा गया है।
- source_word: נלחם
  choice: वह लड़ा
  rationale: सामान्य युद्ध-संबंधी क्रिया का सीधा, स्वाभाविक अनुवाद।
- source_word: ומסביב
  choice: चारों ओर के
  rationale: शत्रु के आसपास या हर दिशा में होने के क्षेत्रगत भाव को संक्षेप में व्यक्त करता है।
- source_word: הכניע
  choice: झुका दिया
  rationale: शत्रु को नीचा करने, अधीन करने और निर्णायक रूप से वश में लाने का भाव बनाए रखता है।
- source_word: צר
  choice: शत्रु
  rationale: एकवचन सामूहिक अर्थ को गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
