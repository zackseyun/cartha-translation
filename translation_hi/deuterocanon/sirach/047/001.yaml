translation:
  language: hi
  text: और उसके बाद नातान दाऊद के सामने उपस्थित होने के लिए उठा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “नातान दाऊद के दिनों में भविष्यवाणी करने के लिए उठा।” इब्रानी में है: “दाऊद के सामने उपस्थित होने के लिए।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: और
  rationale: यह पिछले प्रसंग से निरंतरता और जोड़ का संबंध दिखाता है; आधुनिक हिन्दी में ‘और’ גם की योजक शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אחריו
  choice: उसके बाद
  rationale: यह पहले बताए गए व्यक्ति के बाद क्रम में आने का संकेत देता है और व्यक्तिगत संदर्भ को बनाए रखता है।
- source_word: עמד
  choice: उठा
  rationale: मूल अर्थ ‘खड़ा हुआ’ है, पर यहाँ किसी व्यक्ति के क्रमशः सामने आने का भाव है; यूनानी समानांतर का ἀνέστη भी ‘उठा’ का समर्थन करता है।
- source_word: נתן
  choice: नातान
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: להתיצב
  choice: खड़ा हो
  rationale: हित्पएल रूप स्वयं को उपस्थित करने या अपना स्थान लेकर खड़े होने का भाव देता है; ‘खड़ा हो’ संक्षिप्त रहते हुए इस मुद्रा को सुरक्षित रखता है।
- source_word: לפני דוד
  choice: दाऊद के सामने
  rationale: इब्रानी में स्पष्टतः ‘दाऊद के सामने’ है; यूनानी का ‘दाऊद के दिनों में’ पाठभेद पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अंतिम वाक्यांश में नातान और दाऊद का संबंध
  choice: दाऊद के सामने
  alternative: दाऊद के दिनों में भविष्यवाणी करने के लिए
  rationale: जहाँ इब्रानी पाठ उपलब्ध है, मुख्य पाठ उसी का अनुसरण करता है। यूनानी समानांतर अर्थपूर्ण भिन्न पाठ देता है, इसलिए उसे बिना समरस किए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठा’ क्रम में प्रकट होने का भाव देता है, जबकि ‘खड़ा हो’ इब्रानी להתיצב की शारीरिक और औपचारिक मुद्रा को बनाए रखता है।
