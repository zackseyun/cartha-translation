base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: hi
  text: उसने हर वर्ष पर्वों को वैभव, शोभा और महिमा[b] प्रदान किया; जब वे उसके पवित्र नाम की स्तुति करते थे, तब भोर से ही पवित्रस्थान गूँज उठता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बचे हुए हिब्रू पाठ का अंतिम उपवाक्य कठिन है और उसका अधिक शाब्दिक अर्थ ‘भोर से पहले न्याय/विधान गूँज उठा’ भी हो सकता है। यूनानी समानांतर में है, ‘भोर से ही पवित्रस्थान गूँज उठता था,’ जिसे यहाँ मुख्य पाठ में अपनाया गया है।
    reason: textual_variant
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘प्रताप, शोभा और सम्मान।’ हिब्रू में गरिमा व्यक्त करने वाले तीन निकटार्थक शब्द एक साथ आए हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: उसने ... प्रदान की
  rationale: נתן का मूल अर्थ ‘देना’ है। यहाँ पर्वों को गरिमा से सुशोभित करने का भाव है, इसलिए ‘प्रदान की’ सहज और गरिमापूर्ण है।
- source_word: לחגים בכל שנה ושנה
  choice: हर वर्ष पर्वों को
  rationale: ל संबंध अथवा लाभ को सूचित करता है और שנה ושנה वार्षिक पुनरावृत्ति पर बल देता है। ‘हर वर्ष’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הוד פאר וכבוד
  choice: वैभव, शोभा और महिमा
  rationale: हिब्रू में गरिमा और सुंदरता के तीन निकटार्थक शब्दों का संचय है। हिन्दी में तीनों को बनाए रखने से मूल की ऊँची काव्यात्मक शैली सुरक्षित रहती है।
- source_word: בהללו את שם קדשו
  choice: जब वे उसके पवित्र नाम की स्तुति करते थे
  rationale: ב־युक्त रूप को कालवाचक परिस्थिति के रूप में लिया गया है। कर्ता की संख्या हिब्रू रूप में सहज नहीं है; यूनानी समानांतर सामूहिक ‘वे’ का समर्थन करता है।
- source_word: לפני בקר ירן משפט
  choice: तब भोर से ही पवित्रस्थान गूँज उठता था
  rationale: बचा हुआ हिब्रू पाठ अर्थ की दृष्टि से कठिन है। यूनानी समानांतर ‘भोर से पवित्रस्थान गूँजता था’ जैसा सुसंगत पाठ देता है, जो मन्दिर की स्तुति के प्रसंग में उपयुक्त है। कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: कठिन हिब्रू अंतिम उपवाक्य और यूनानी समानांतर का संबंध
  choice: मुख्य पाठ में यूनानी से पुष्ट अर्थ ‘भोर से ही पवित्रस्थान गूँज उठता था’ अपनाया गया।
  alternative: 'हिब्रू शब्दों का अधिक शाब्दिक रूप: ‘भोर से पहले न्याय/विधान गूँज उठा’ या ‘भोर से पहले प्रांगण गूँज उठा’।'
  rationale: हिब्रू अंतिम शब्दसमूह पाठगत अथवा अर्थगत रूप से अस्पष्ट है। यूनानी समानांतर उपासना और पवित्रस्थान का स्पष्ट, प्रसंगानुकूल अर्थ सुरक्षित रखता है; पादटिप्पणी वास्तविक अनिश्चितता छिपाती नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘पर्व’, ‘पवित्र नाम’, ‘स्तुति’ और ‘पवित्रस्थान’ सामान्य बाइबलीय प्रयोग से परिचित हैं। मूल हिब्रू के तीन सम्मानसूचक शब्दों को संक्षिप्त करने के बजाय हिन्दी में तीन पदों से सुरक्षित रखा गया है; अंतिम पाठगत कठिनाई को मुख्य पाठ में चुपचाप निर्णीत न करके पादटिप्पणी में दर्ज किया गया है।
