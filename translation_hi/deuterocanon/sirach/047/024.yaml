base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: hi
  text: अत्यन्त मूर्ख और समझ से रहित रहूबियाम[a] था, जिसने अपनी नीति के द्वारा लोगों को विद्रोह करने पर उकसाया[b], जब तक एक उठा—उसका स्मरण न रहे—नबात का पुत्र यारोबाम, जिसने पाप किया और इस्राएल को पाप करवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी साक्ष्य बहुत संक्षिप्त है और पद-विभाजन भी अस्थिर प्रतीत होता है। यूनानी समानांतर में अधिक पूर्ण वाक्य है, जिसमें ‘और एप्रैम को पाप का मार्ग दिया’ भी आता है। चूँकि यह अतिरिक्त वाक्यांश बची हुई इब्रानी पंक्ति में स्पष्ट नहीं है, इसलिए इसे मुख्य पाठ में नहीं रखा गया है।
    reason: textual_variant
  - marker: b
    text: ‘अपनी नीति के द्वारा लोगों को विद्रोह करने पर उकसाया’ कठिन इब्रानी पदबंध और यूनानी समानांतर, दोनों के आधार पर किया गया अनुवाद है। इसका अर्थ ‘अपनी नीति से लोगों को अलग कर दिया’ भी हो सकता है; यूनानी पाठ लोगों के विद्रोह या अलग हो जाने के भाव का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רחב אולת
  choice: मूर्खता में बढ़ा हुआ
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। רחב के ‘व्यापक/बहुत’ भाव और אולת के ‘मूर्खता’ अर्थ को व्यक्ति के चरित्र-वर्णन के रूप में रखा गया है, बिना यूनानी पाठ की संभावित पुनर्रचना को मुख्य पाठ में आरोपित किए।
- source_word: חסר בינה
  choice: समझ से रहित
  rationale: इब्रानी का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यूनानी ἐλαττούμενον συνέσει भी इसी अभाव की पुष्टि करता है।
- source_word: רחבעם
  choice: रहूबियाम
  rationale: नाम का रूप इब्रानी उच्चारण के निकट रखते हुए प्रचलित हिन्दी बाइबलीय शैली के अनुकूल है।
- source_word: הפריע בעצתו עם
  choice: अपनी नीति से प्रजा को विद्रोह के लिए उकसाया
  rationale: इब्रानी क्रिया इस साक्षी में कठिन है; यूनानी समानांतर पाठ लोगों के अलग हो जाने या विद्रोह की ओर जाने का भाव स्पष्ट करता है। ‘नीति’ यहाँ राजा के परामर्श/निर्णय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אל יהי לו זכר
  choice: उसका स्मरण न रहे
  rationale: इब्रानी के शापात्मक या निंदात्मक वाक्य को उसके तीखेपन सहित संक्षेप में सुरक्षित रखा गया है।
- source_word: ירבעם בן נבט
  choice: नबाट का पुत्र यारोबियाम
  rationale: व्यक्तिनामों को इब्रानी रूप के निकट लिप्यंतरित किया गया है।
- source_word: חטא והחטיא את ישראל
  choice: पाप किया और इस्राएल से भी पाप करवाया
  rationale: 'पहली क्रिया और हिफ़ील कारक रूप के बीच भेद सुरक्षित है: उसने स्वयं पाप किया और इस्राएल को पाप का कर्ता बनाया।'
theological_decisions:
- issue: खंडित इब्रानी वाक्य-विन्यास और यूनानी समानांतर पाठ का संबंध
  choice: इब्रानी में बचे हुए रहूबियाम और यारोबियाम संबंधी कथनों को एक सतत वाक्य में रखा, पर यूनानी का ‘एप्रैम को पाप का मार्ग दिया’ खंड मुख्य पाठ में नहीं जोड़ा।
  alternative: यूनानी के पूर्णतर रूप के अनुसार एप्रैम वाला खंड भी सम्मिलित करना, या इब्रानी पंक्तियों को असंबद्ध टुकड़ों की तरह प्रस्तुत करना।
  rationale: इब्रानी प्राथमिक साक्ष्य है, जबकि यूनानी कठिन वाक्य-विन्यास समझने में सहायक है। जो विस्तार वर्तमान इब्रानी पंक्ति में स्पष्ट नहीं है, उसे मुख्य पाठ में जोड़ना उचित नहीं।
- issue: אל יהי לו זכר का संबोधन
  choice: इसे आगे आने वाले ‘एक व्यक्ति’ अर्थात यारोबियाम से संबद्ध रखा।
  alternative: इसे रहूबियाम के लिए स्वतंत्र अभिशाप मानना।
  rationale: इब्रानी क्रम ‘जब तक एक उठा—उसका स्मरण न रहे—यारोबियाम...’ यारोबियाम से संबंध का समर्थन करता है, यद्यपि संकुचित पाठ के कारण वाक्य-संबंध पूरी तरह निर्विवाद नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय गद्य अपनाया गया है। ‘प्रजा’, ‘नीति’, ‘स्मरण’ और ‘समझ से रहित’ जैसे शब्द साधारण पाठकों के लिए बोधगम्य रहते हुए प्राचीन राजकीय और नैतिक संदर्भ को बनाए रखते हैं।
