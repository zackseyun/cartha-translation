base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/023.yaml
  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: hi
  text: उसने याकूब को एक शेषांश दिया, और दाऊद के घराने को उससे एक जड़[a] दी। सुलैमान अपने पूर्वजों के साथ सो गया[b] और अपने पीछे अपनी एक संतान[c] छोड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उससे एक जड़’; अर्थात सुलैमान के द्वारा दाऊद के वंश की निरंतरता। इसका अनुवाद ‘उससे निकला एक वंशज’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस स्थान पर इब्रानी शब्द अनिश्चित है। यूनानी समानांतर पाठ में ‘अपने पूर्वजों के साथ’ है, जिसका यहाँ अनुसरण किया गया है।
    reason: textual_variant
  - marker: c
    text: या ‘एक उत्तराधिकारी’ अथवा ‘एक वंशज’। इब्रानी पद दुर्लभ और अनिश्चित है, पर आशय सुलैमान की अपनी वंश-रेखा में छोड़े गए उत्तराधिकारी से है।
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: एक शेषांश
  rationale: इब्रानी और यूनानी दोनों शब्द उस अंश को सूचित करते हैं जो बचा या सुरक्षित रहता है। ‘शेषांश’ इस अर्थ और वंश के बने रहने की अंतर्ध्वनि, दोनों को बनाए रखता है।
- source_word: שרש / ῥίζαν
  choice: जड़
  rationale: दोनों स्रोतों में शाब्दिक चित्र ‘जड़’ का है। यहाँ यह दाऊद के वंश की निरंतरता का रूपक है; इसे सीधे ‘वंशज’ कहकर रूपक को समाप्त नहीं किया गया।
- source_word: וישכב ... / ἀνεπαύσατο
  choice: अपने पूर्वजों के साथ सो गया
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी मुहावरे को स्वाभाविक हिन्दी में रखा गया है। यूनानी समानांतर पाठ ‘पूर्वजों के साथ’ का समर्थन करता है।
- source_word: מיושש
  choice: अपने पूर्वजों के साथ
  rationale: इस साक्षी में इब्रानी रूप पाठगत दृष्टि से कठिन है। यूनानी μετὰ τῶν πατέρων स्पष्ट रूप से ‘पूर्वजों के साथ’ पढ़ता है, इसलिए मुख्य पाठ में उसी अधिक समर्थित अर्थ को अपनाया गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מנון
  choice: अपनी एक संतान
  rationale: यह इब्रानी पद दुर्लभ या अनिश्चित है, पर प्रसंग सुलैमान की अपनी वंश-रेखा में छोड़े गए उत्तराधिकारी की ओर संकेत करता है। ‘अपनी एक संतान’ ‘पुत्र’ से कम विशिष्ट रहकर मूल की अनिश्चितता को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उससे निकली एक जड़’ में दाऊदी वंश की प्रतिज्ञा
  choice: जड़ का रूपक बनाए रखते हुए दाऊद के वंश की निरंतरता व्यक्त करना
  alternative: इसे सीधे ‘उसका एक वंशज’ या स्पष्ट मसीही कथन के रूप में प्रस्तुत करना
  rationale: पद दाऊद के घराने की निरंतरता बताता है। ‘जड़’ आगे के मसीही प्रयोगों की प्रतिध्वनि दे सकती है, पर यहाँ अनुवाद में उस संकेत को स्पष्ट सिद्धांत बनाकर नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘सो गया’ मृत्यु का पारंपरिक बाइबलीय मुहावरा है; ‘पूर्वज’ आधुनिक हिन्दी में ‘पितरों’ से अधिक सहज है। मूल पाठ की रूपकात्मकता और पाठगत अनिश्चितता पादटिप्पणियों सहित सुरक्षित रखी गई है।
