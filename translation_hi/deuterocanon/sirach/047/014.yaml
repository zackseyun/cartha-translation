  text: who prepared a house for his name[a], and established the sanctuary forever.
translation:
  language: hi
  text: जिसने उसके नाम के लिए एक भवन तैयार किया[a], और पवित्रस्थान को सदा के लिए स्थापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए दिया गया यूनानी समानांतर पाठ इसके बजाय कहता है, “तू अपनी युवावस्था में कितना बुद्धिमान हो गया, और समझ से ऐसे भर गया जैसे कोई नदी।” यह आसपास के प्रसंग की एक भिन्न पंक्ति को दर्शाता है। मुख्य पाठ यहाँ उपलब्ध इब्रानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: אשר
  choice: जिसने
  rationale: यह पिछले संदर्भ के सुलैमान की ओर संकेत करने वाला संबंधवाचक पद है; हिन्दी में ‘जिसने’ स्वाभाविक है।
- source_word: הכין
  choice: तैयार किया
  rationale: क्रिया का मूल अर्थ तैयार करना या सिद्ध करना है। यह केवल ‘बनाया’ कहकर निर्माण की क्रिया तक अर्थ को सीमित नहीं करता।
- source_word: בית
  choice: एक भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ मन्दिर का संकेत है। ‘भवन’ आधुनिक हिन्दी में गरिमापूर्ण है तथा ‘उसके नाम के लिए भवन’ वाली इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: לשמו
  choice: उसके नाम के लिए
  rationale: यह परमेश्वर को समर्पित पवित्रस्थान की प्रचलित इब्रानी अभिव्यक्ति है। इसे व्याख्यात्मक रूप से ‘यहोवा के लिए’ नहीं बनाया गया।
- source_word: ויצב
  choice: स्थापित किया
  rationale: क्रिया किसी वस्तु को दृढ़ता से खड़ा करने या स्थिर करने का भाव देती है; अगले शब्द के स्थायित्व-बोध के साथ ‘स्थापित किया’ उपयुक्त है।
- source_word: לעד
  choice: सदा के लिए
  rationale: यह दीर्घ अथवा स्थायी अवधि व्यक्त करता है। अनुवाद मूल की आदर्श स्थायित्व-वाणी को ऐतिहासिक तनाव सुलझाए बिना सुरक्षित रखता है।
- source_word: מקדש
  choice: पवित्रस्थान
  rationale: यह पवित्र स्थल या मन्दिर के पवित्र क्षेत्र को दर्शाता है। ‘पवित्रस्थान’ सटीक और प्रचलित बाइबलीय हिन्दी है।
- source_word: ὡς ἐσοφίσθης ἐν νεότητί σου, καὶ ἐνεπλήσθης ὡς ποταμὸς συνέσεως
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: दिया गया यूनानी समानांतर पाठ सुलैमान की युवावस्था की बुद्धि की अलग पंक्ति प्रस्तुत करता है। उपलब्ध उच्च-विश्वास वाले इब्रानी पाठ का मुख्य पाठ में अनुसरण किया गया और पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया।
theological_decisions:
- issue: मन्दिर की भाषा और परमेश्वर के नाम की इब्रानी अभिव्यक्ति
  choice: ‘उसके नाम के लिए एक भवन’ को बनाए रखा गया।
  alternative: ‘यहोवा के लिए मन्दिर’ या ‘यहोवा के सम्मान में भवन’
  rationale: मूल अभिव्यक्ति इस सूक्ष्मता को सुरक्षित रखती है कि पवित्रस्थान परमेश्वर के नाम से संबद्ध और उसे समर्पित है; पाठ में न आए अतिरिक्त ईश-नाम या व्याख्या को नहीं जोड़ा गया।
- issue: לעד का बल
  choice: ‘सदा के लिए’
  alternative: ‘सर्वदा’ या ‘सभी कालों के लिए’
  rationale: यह सुलैमान के मन्दिर के स्थायित्व की आदर्श भाषा को सीधे व्यक्त करता है और बाद में मन्दिर के विनाश से उत्पन्न ऐतिहासिक-धर्मवैज्ञानिक तनाव को चुपचाप हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबलीय शैली रखी गई है। ‘भवन’ से בית की मूल छवि और ‘उसके नाम के लिए’ वाली धर्मवैज्ञानिक अभिव्यक्ति सुरक्षित रहती है; ‘पवित्रस्थान’ מקדש का स्वाभाविक धार्मिक पर्याय है।
