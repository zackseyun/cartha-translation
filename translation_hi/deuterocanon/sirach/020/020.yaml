  yaml_path: translation/deuterocanon/sirach/020/020.yaml
  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
translation:
  language: hi
  text: मूर्ख के मुँह से निकली कहावत[a] ठुकरा दी जाएगी, क्योंकि वह उसे उचित समय पर कभी नहीं कहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दृष्टान्त।” यूनानी शब्द παραβολή का अर्थ यहाँ ‘कहावत’ से अधिक व्यापक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  choice: के मुँह से निकली
  rationale: यह पदबंध कथन के स्रोत को दर्शाता है। हिन्दी में ‘के मुँह से निकली’ मूल के ठोस बिंब और स्वाभाविक अभिव्यक्ति—दोनों को बनाए रखता है।
- source_word: μωροῦ
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह शब्द केवल कम बुद्धि वाले व्यक्ति के लिए नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति के लिए प्रयुक्त होता है।
- source_word: ἀποδοκιμασθήσεται
  choice: ठुकरा दी जाएगी
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए यह स्पष्ट करता है कि वक्ता के कारण कहावत अस्वीकार की जाएगी।
- source_word: παραβολή
  choice: कहावत
  rationale: सिराख के ज्ञान-साहित्यिक संदर्भ में यह शब्द प्रायः संक्षिप्त नीतिवचन या लोकप्रचलित बुद्धिमत्तापूर्ण कथन को सूचित करता है; व्यापक अर्थ ‘दृष्टान्त’ को पादटिप्पणी में रखा गया है।
- source_word: οὐ γὰρ μὴ
  choice: क्योंकि ... कभी नहीं
  rationale: दोहरे प्रबल निषेध की निश्चितता को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἴπῃ αὐτὴν
  choice: वह उसे ... कहेगा
  rationale: सर्वनाम का संदर्भ कहावत से है और λέγω का सीधा अर्थ यहाँ उसे बोलना या कहना है।
- source_word: ἐν καιρῷ αὐτῆς
  choice: उचित समय पर
  rationale: καιρός केवल समय नहीं, बल्कि उपयुक्त अवसर भी बताता है; ‘उचित समय’ दोनों भावों को समेटता है।
