  yaml_path: translation/deuterocanon/sirach/020/025.yaml
  text: A thief is preferable to one who persists in lying[a]; yet both will inherit destruction.
translation:
  language: hi
  text: झूठ बोलने में लगे रहनेवाले से चोर भला है[a]; फिर भी दोनों विनाश के वारिस होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “झूठ बोलने में लगे रहनेवाले के बजाय चोर को चुनना अच्छा है।”'
    reason: αἱρετὸν के अधिक औपचारिक अर्थ ‘चुनने योग्य’ और निहित तुलनात्मक रचना को दिखाने के लिए।
lexical_decisions:
- source_word: αἱρετὸν
  choice: भला है
  rationale: यह विशेषण ‘चुनने योग्य’ या ‘अधिक अच्छा/वरीय’ होने का तुलनात्मक भाव देता है। हिन्दी लोकोक्तिपरक शैली में ‘से ... भला है’ इस तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κλέπτης
  choice: चोर
  rationale: κλέπτης सामान्यतः चोरी करनेवाले को दर्शाता है, हिंसक लुटेरे को नहीं; इसलिए ‘चोर’ सीधा और सटीक समतुल्य है।
- source_word: ἐνδελεχίζων
  choice: लगे रहनेवाला
  rationale: वर्तमान कृदन्त निरंतर या आदतन किए जानेवाले कार्य का भाव रखता है। ‘लगे रहनेवाला’ उस सतत प्रवृत्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ψεύδει
  choice: झूठ बोलने में
  rationale: यहाँ दत्तिव कारक उस क्षेत्र या अभ्यास को बताता है जिसमें व्यक्ति निरंतर लगा रहता है; ‘झूठ बोलने में’ इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀμφότεροι
  choice: दोनों
  rationale: यह दोनों व्यक्तियों को सम्मिलित करनेवाला स्पष्ट द्विवचनात्मक शब्द है।
- source_word: ἀπώλειαν
  choice: विनाश
  rationale: शब्द का अर्थ नाश या बरबादी है। ‘विनाश’ गंभीरता बनाए रखता है, पर किसी बाद की विशिष्ट धर्मवैज्ञानिक तकनीकी धारणा को आरोपित नहीं करता।
- source_word: κληρονομήσουσιν
  choice: वारिस होंगे
  rationale: क्रिया का शाब्दिक अर्थ ‘विरासत में पाएँगे’ है। ‘विनाश के वारिस होंगे’ मूल की विरासत-संबंधी विडंबना को संक्षिप्त और प्रभावशाली हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: नीतिवचन में नैतिक तुलना
  choice: पद आदतन झूठ बोलनेवाले की अपेक्षा चोर को भला बताता है, लेकिन चोरी को उचित नहीं ठहराता; दोनों का परिणाम विनाश है।
  alternative: इसे लगातार झूठ बोलने की विशेष विनाशकारी प्रकृति पर बल देनेवाली अतिशयोक्तिपूर्ण प्रज्ञा-वाणी माना जा सकता है।
  rationale: यूनानी पाठ वास्तविक तुलना करता है, पर दूसरा खंड दोनों को एक ही विनाशकारी परिणाम के अधीन रखकर चोरी का नैतिक अनुमोदन रोकता है। इस तनाव को अनसुलझा ही रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली अपनाई गई है। ‘से ... भला है’ सहज तुलनात्मक मुहावरा है, जबकि ‘विनाश के वारिस होंगे’ मूल यूनानी की गंभीर विडंबना को बनाए रखता है।
