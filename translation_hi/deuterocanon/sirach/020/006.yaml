base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/006.yaml
  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: hi
  text: कोई उत्तर न होने के कारण चुप रहता है,[a] और कोई उचित समय देखकर चुप रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्तर के अभाव में” अथवा “क्योंकि उसके पास कोई उत्तर नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर में है: “बुद्धिमान मनुष्य उचित समय तक चुप रहेगा, पर बकवादी और मूर्ख उचित समय को पार कर जाएगा।” इस कहावत के इब्रानी और यूनानी रूपों में उल्लेखनीय अंतर है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है; “उचित समय” की बारीकी को समझने में यूनानी रूप सहायक है।'
    reason: textual_variant
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: चुप रहता है
  rationale: यह कृदन्त बोलने से रुके रहने का अर्थ देता है। ‘चुप रहता है’ आधुनिक हिन्दी में स्वाभाविक है और कहावत के सामान्य, निरंतर भाव को बनाए रखता है।
- source_word: מֵאֵין מַעֲנֶה
  choice: कोई उत्तर न होने के कारण
  rationale: इब्रानी पदबंध का सीधा अर्थ उत्तर या प्रत्युत्तर का अभाव है। यह अनुवाद जानबूझकर यह निर्धारित नहीं करता कि उत्तर स्वयं वक्ता के पास नहीं है या किसी ओर से नहीं मिल रहा।
- source_word: עֵת
  choice: उचित समय
  rationale: עֵת का मूल अर्थ ‘समय’ है, पर ज्ञान-साहित्य के प्रसंग में उपयुक्त अवसर का भाव निहित है। यूनानी समानांतर भी सही अवसर की इस बारीकी की पुष्टि करता है।
- source_word: רֹאֶה עֵת
  choice: उचित समय देखकर
  rationale: शाब्दिक चित्र ‘समय देखना’ है। ‘देखकर’ उस इब्रानी बिंब को सुरक्षित रखता है, जबकि ‘उचित समय’ उसका प्रसंगानुकूल आशय स्पष्ट करता है।
