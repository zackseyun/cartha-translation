translation:
  language: hi
  text: महिमा के लिए अपमान होता है[a], और कोई ऐसा है जिसने अपमान की दशा से सिर उठाया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमा के लिए नीचा किया जाना होता है।” यूनानी संज्ञा का अर्थ कमी, घटाया जाना, नीचा किया जाना, या अपमानित अवस्था हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सिर उठाना” नीची दशा से निकलकर गरिमा या आत्मविश्वास पाने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  choice: अपमान
  rationale: यह संज्ञा घटाए जाने, नीचा किए जाने या दीन दशा में पहुँचने का भाव दे सकती है। यहाँ सामाजिक अवनति और δόξης के साथ विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘अपमान’ चुना गया है; व्यापक अर्थ-पट्टी को पादटिप्पणी में रखा गया है।
- source_word: ἕνεκεν
  choice: के लिए
  rationale: यूनानी पद उद्देश्य अथवा कारण दोनों का संकेत दे सकता है। ‘के लिए’ संक्षिप्त है और महिमा से जुड़ी प्रयोजनात्मक अस्पष्टता बनाए रखता है।
- source_word: δόξης
  choice: महिमा
  rationale: δόξα सम्मान, प्रतिष्ठा या महिमा का अर्थ दे सकता है। ‘महिमा’ मूल के व्यापक और ऊँचे भाव को तथा अपमान के साथ उसके विरोध को सुरक्षित रखता है।
- source_word: ταπεινώσεως
  choice: अपमान की दशा
  rationale: ἀπό के बाद यह उस नीची या अपमानित अवस्था को बताता है जहाँ से व्यक्ति ऊपर उठता है। ‘अपमान की दशा’ इसे नैतिक गुण ‘नम्रता’ समझे जाने से बचाता है।
- source_word: ἦρεν κεφαλήν
  choice: अपना सिर ऊँचा किया है
  rationale: यह मूल शारीरिक बिंब को रखते हुए नीची दशा से गरिमा या आत्मविश्वास में उठने के मुहावरेदार अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔστιν ὃς
  choice: कोई ऐसा भी होता है जिसने
  rationale: यह लोकोक्तिपरक ढंग से एक प्रकार के व्यक्ति का परिचय देता है। चयनित हिन्दी रूप सामान्य और स्वाभाविक है।
theological_decisions:
- issue: अपमान और महिमा के बीच सम्बन्ध
  choice: ‘महिमा के लिए’ रखकर प्रयोजनात्मक अर्थ व्यक्त किया गया है।
  alternative: ‘महिमा के कारण’ या ‘महिमा तक पहुँचाने वाला’
  rationale: ἕνεκεν उद्देश्य और कारण दोनों की छाया रख सकता है। मुख्य पाठ मूल के निकट रहता है और यह निश्चित नहीं करता कि अपमान स्वेच्छिक है, दैवी साधन है, या केवल सम्मान की ओर ले जाने वाली परिस्थिति।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। दोनों खंडों की समानान्तर संरचना सुरक्षित है; ‘महिमा’ और ‘सिर ऊँचा करना’ बाइबलीय बिंब को बनाए रखते हैं।
