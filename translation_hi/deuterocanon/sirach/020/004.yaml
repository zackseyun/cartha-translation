- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: बहुत बोलने के कारण
  rationale: ἀπό यहाँ कारण व्यक्त करता है और πολλῆς λαλιᾶς अत्यधिक या बहुत अधिक बोलने की ओर संकेत करता है; चुना हुआ वाक्यांश सहज हिन्दी में दोनों भाव रखता है।
