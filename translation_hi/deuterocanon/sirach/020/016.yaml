- source_word: τοῖς ἀγαθοῖς μου
  choice: मेरे भले कामों के लिए
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण वक्ता द्वारा किए गए अच्छे कामों या उपकारों को सूचित कर सकता है; ‘भले काम’ अर्थ को सहज हिन्दी में रखता है।
