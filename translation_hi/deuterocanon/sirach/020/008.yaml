lexical_decisions:
- source_word: εὐοδία
  choice: सफलता
  rationale: यह शब्द सफल मार्ग, अनुकूल परिणाम या समृद्धि का भाव व्यक्त कर सकता है। यहाँ “सफलता” सहज हिन्दी में कथन की विडंबना बनाए रखती है और इसे केवल आर्थिक समृद्धि तक सीमित नहीं करती।
- source_word: ἐν κακοῖς
  choice: बुरे कामों में
  rationale: यूनानी पदबंध का अर्थ नैतिक बुराइयों में या बुरी परिस्थितियों के बीच हो सकता है। इस सूक्तिपरक चेतावनी में नैतिक अर्थ अधिक संगत है; “कामों” जोड़ने से आधुनिक हिन्दी में आशय स्वाभाविक रूप से स्पष्ट होता है।
- source_word: ἀνδρί
  choice: किसी मनुष्य को
  rationale: यूनानी में पुल्लिंग एकवचन है और कथन सामान्य सूक्ति के रूप में है। “किसी मनुष्य को” इस व्याकरणिक रूप और सार्वत्रिक सूक्तिपरक भाव दोनों को बनाए रखता है।
- source_word: εὕρεμα
  choice: लाभ
  rationale: मूल शब्द किसी मिली हुई वस्तु, उपलब्धि या प्राप्त लाभ को दर्शाता है। समानांतर रचना और अगले “घटाव” के विचार के साथ “लाभ” स्पष्ट विरोधाभास उत्पन्न करता है।
- source_word: εἰς ἐλάττωσιν
  choice: जो अंत में हानि पहुँचाता है
  rationale: इस पदबंध का शाब्दिक अर्थ घटाव या कमी की ओर होना है। चुना हुआ वाक्यांश हिन्दी में स्वाभाविक ढंग से उस परिणाम को व्यक्त करता है जिसमें दिखने वाला लाभ अंततः नुकसान बन जाता है।
