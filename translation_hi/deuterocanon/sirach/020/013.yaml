base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/013.yaml
  text: A wise man speaks little for himself[c][b][a], but the goodness of fools pours out wisdom.
translation:
  language: hi
  text: बुद्धिमान अपने लिए थोड़े ही शब्द बोलता है[b], पर मूर्खों की भलाई बुद्धि उँडेलती है[c][a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “मूर्ख की भेंट से तुम्हें लाभ नहीं होगा, क्योंकि एक के बदले उसकी आँखें बहुत-सी हैं।” इस पद के इब्रानी और यूनानी साक्षियों में बड़ा अन्तर है। मुख्य पाठ उपलब्ध इब्रानी साक्षी का अनुसरण करता है; अर्थ पर इस अन्तर के गहरे प्रभाव के कारण यूनानी पाठ यहाँ दिया गया है।'
    reason: textual_variant
  - marker: b
    text: या, “बुद्धिमान संक्षेप में बोलता है।”
    reason: lexical_alternative
  - marker: c
    text: 'अन्तिम उपवाक्य व्यंग्यपूर्ण हो सकता है: मूर्ख ऐसे शब्द उँडेलते हैं, मानो वे बुद्धि बाँट रहे हों।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और किसी बुद्धिमान व्यक्ति को दर्शाता है; हिन्दी में ‘बुद्धिमान’ सहज और गरिमापूर्ण है।
- source_word: בִּמְעַט דִבֶּר
  choice: थोड़े ही शब्द बोलता है
  rationale: शाब्दिक ‘थोड़ा बोलता है’ के आशय को स्वाभाविक हिन्दी में व्यक्त करता है और संक्षिप्त अथवा संयमित वाणी—दोनों संभावनाएँ खुली रखता है।
- source_word: נַפְשׁוֹ
  choice: अपने विषय में
  rationale: यहाँ נֶפֶשׁ संभवतः आत्मा के तत्त्व का नाम नहीं, बल्कि आत्मवाचक अर्थ रखता है। ‘अपने विषय में’ आत्म-संदर्भित वाणी का सम्भावित भाव व्यक्त करता है।
- source_word: וְטוֹבַת
  choice: भलाई
  rationale: טוֹבָה का मूल अर्थ अच्छाई, भलाई अथवा लाभ हो सकता है। उपलब्ध इब्रानी पाठ का निकट अनुवाद रखते हुए इसे यूनानी ‘भेंट’ के अनुसार चुपचाप नहीं बदला गया।
- source_word: כְּסִילִים
  choice: मूर्खों की
  rationale: इब्रानी बहुवचन सम्बन्धसूचक संरचना को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: יִשְׁפוֹךְ
  choice: उँडेलती है
  rationale: क्रिया का मूल चित्र ‘उँडेलना’ है; यह सम्भावित व्यंग्य और वाचालता की छवि को बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה का सीधा और प्रचलित हिन्दी समतुल्य; वाक्य के सम्भावित व्यंग्यार्थ को मुख्य पाठ में स्पष्ट करके सीमित नहीं किया गया।
- source_word: δόσις ἄφρονος οὐ λυσιτελήσει σοι
  choice: मूर्ख की भेंट से तुम्हें लाभ नहीं होगा
  rationale: यूनानी साक्षी का अर्थ इब्रानी से बहुत भिन्न है; इसे मुख्य पाठ में नहीं अपनाया गया, पर महत्त्वपूर्ण पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अन्तिम उपवाक्य का सम्भावित व्यंग्य
  choice: मुख्य पाठ में ‘बुद्धि उँडेलती है’ की असहजता और विडम्बना को बनाए रखा
  alternative: इसे स्पष्ट करके ‘मानो बुद्धि उँडेलती हो’ या ‘शब्द उँडेलती है’ कहना
  rationale: इब्रानी में ‘बुद्धि’ ही है; व्यंग्यार्थ सम्भव है, पर निश्चित नहीं। इसलिए उसकी व्याख्या पादटिप्पणी में दी गई है, पाठ में आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, नीतिवचन-सदृश संक्षिप्त और गरिमापूर्ण शैली। इब्रानी मुख्य पाठ को प्राथमिकता दी गई है; बड़े यूनानी पाठांतर और अन्तिम खण्ड के सम्भावित व्यंग्य को पादटिप्पणियों में स्पष्ट किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
