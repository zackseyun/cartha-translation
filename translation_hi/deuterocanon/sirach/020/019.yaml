    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  choice: अशिष्ट व्यक्ति
  rationale: ἄνθρωπος यहाँ सामान्य रूप से किसी व्यक्ति को दर्शाता है। ἄχαρις में शालीनता, मनोहरता या कृतज्ञता के अभाव का भाव हो सकता है; प्रसंग में ‘अशिष्ट’ सामाजिक व्यवहार की कमी को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: μῦθος
  choice: बात
  rationale: यहाँ μῦθος किसी विस्तृत कथा के बजाय कही गई बात या कथन जान पड़ता है; ‘बात’ हिन्दी में इस सूक्तिपरक संदर्भ के लिए सहज है।
- source_word: ἄκαιρος
  choice: बेमौके की
  rationale: यह शब्द ऐसी बात का संकेत देता है जो उचित समय पर न कही गई हो। ‘बेमौके की’ वर्तमान हिन्दी में स्वाभाविक है और समय-अनुपयुक्तता को स्पष्ट रखता है।
- source_word: ἀπαιδεύτων
  choice: अनुशासनहीनों
  rationale: ἀπαίδευτος केवल औपचारिक शिक्षा के अभाव तक सीमित नहीं, बल्कि प्रशिक्षण, संस्कार या अनुशासन की कमी भी दर्शाता है। ‘अनुशासनहीन’ इस व्यापक नैतिक-सामाजिक भाव को सुरक्षित रखता है।
- source_word: ἐνδελεχισθήσεται
  choice: लगातार दोहराई जाती रहेगी
  rationale: भविष्यत् कर्मवाच्य रूप निरंतर बने रहने या बार-बार होने का भाव देता है। वाणी के संदर्भ में ‘लगातार दोहराई जाती रहेगी’ इसका आशय स्पष्ट करता है।
- source_word: ἐν στόματι
  choice: के मुँह में
  rationale: मूल का वाणी-संबंधी चित्र ज्यों का त्यों रखा गया है; यह हिन्दी में भी बोधगम्य है।
