lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: जो ... खाते हैं
  rationale: वर्तमान कृदन्त यहाँ संज्ञा के रूप में सामान्य या बार-बार होने वाले व्यवहार को व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप है।
- source_word: τὸν ἄρτον μου
  choice: मेरी रोटी
  rationale: मूल के ठोस बिंब को बनाए रखता है और भोजन अथवा मेज़ की सहभागिता की ओर संकेत कर सकता है, बिना उसे केवल ‘भोजन’ बनाकर सपाट किए।
- source_word: φαῦλοι γλώσσῃ
  choice: अपनी ज़बान से बुराई करते हैं
  rationale: φαῦλοι का नैतिक नकारात्मक भाव और γλώσσῃ का वाणी-संबंधी आशय स्वाभाविक हिन्दी में व्यक्त होता है; शाब्दिक ‘जीभ से दुष्ट’ असहज होता।
- source_word: ποσάκις
  choice: कितनी बार
  rationale: प्रश्नवाचक क्रिया-विशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: καὶ ὅσοι
  choice: और कितने लोग
  rationale: मूल की संक्षिप्त और आकस्मिक प्रश्नात्मक संरचना को काफी निकट रखते हुए हिन्दी में कर्ता स्पष्ट करता है।
- source_word: καταγελάσονται
  choice: हँसेंगे
  rationale: καταγελάω का सीधा अर्थ किसी पर हँसना है, यद्यपि इसमें उपहास करने का अधिक प्रबल भाव भी हो सकता है; वह विकल्प पादटिप्पणी में दिया गया है।
- source_word: αὐτοῦ
  choice: उस पर
  rationale: καταγελάω के साथ संबंधवाचक रूप व्यक्ति को लक्ष्य बनाता है; हिन्दी मुहावरे में ‘उस पर हँसेंगे’ स्वाभाविक है, जबकि संदर्भित व्यक्ति मूल में भी संक्षिप्त रूप से संकेतित है।
theological_decisions:
- issue: दूसरे वाक्यांश की आकस्मिक और सम्भवतः संकुचित पाठ-संरचना
  choice: ‘कितनी बार और कितने लोग उस पर हँसेंगे?’ के रूप में प्रश्नात्मकता और असामान्य समन्वय बनाए रखना
