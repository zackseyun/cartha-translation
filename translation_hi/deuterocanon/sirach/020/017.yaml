  rationale: उपलब्ध यूनानी पाठ संक्षिप्त और कुछ कठिन है। अनिश्चितता को किसी निश्चित व्याख्या से ढकने के बजाय अनुवाद मूल संरचना के निकट रहता है और पादटिप्पणी पाठक को कठिनाई बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण शैली। ‘ज़बान’ वाणी के ठोस बिंब को स्वाभाविक हिन्दी में रखता है; दूसरे वाक्य की हल्की असामान्यता मूल यूनानी की वास्तविक कठिनाई को सुरक्षित रखती है।
