  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: hi
  text: जो भूमि पर खेती करता है, वह अपने अनाज का ढेर ऊँचा करेगा; और जो बड़े लोगों को प्रसन्न करता है, वह अन्याय का प्रायश्चित करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुकर्म को ढक देगा।” यूनानी में शाब्दिक रूप से “अन्याय का प्रायश्चित करेगा” है; यह शक्तिशाली लोगों की कृपा पाने के व्यावहारिक प्रभाव का वर्णन कर सकता है।
    reason: ‘ἐξιλάσεται ἀδικίαν’ के प्रायश्चित-संबंधी शाब्दिक अर्थ और संभावित सामाजिक-व्यावहारिक आशय—दोनों को सामने रखना।
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: जो भूमि पर खेती करता है
  rationale: शाब्दिक अर्थ ‘भूमि पर काम करने वाला’ है; कृषि-संदर्भ में ‘खेती करता है’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀνυψώσει
  choice: ऊँचा करेगा
  rationale: क्रिया का मूल बिंब ‘ऊँचा उठाना’ है। यह उपज के ढेर के बढ़ने का संकेत देता है, पर उस बिंब को व्याख्यात्मक रूप से समतल नहीं करता।
- source_word: θιμωνιὰν αὐτοῦ
  choice: अपने अनाज का ढेर
  rationale: संज्ञा काटे हुए अनाज अथवा पूलों के ढेर को बताती है। ‘अनाज का ढेर’ साधारण पाठक के लिए स्पष्ट कृषि-बिंब है।
- source_word: ὁ ἀρέσκων
  choice: जो … को प्रसन्न करता है
  rationale: यूनानी कृदंत का सीधा अर्थ ‘प्रसन्न करने वाला’ है। ‘चापलूसी करता है’ जैसी नकारात्मक व्याख्या मूल में स्पष्ट नहीं है।
- source_word: μεγιστᾶσιν
  choice: बड़े लोगों को
  rationale: यह सामाजिक रूप से प्रतिष्ठित या शक्तिशाली पुरुषों को सूचित करता है। ‘शासकों’ की अपेक्षा ‘बड़े लोगों’ में मूल की व्यापकता बनी रहती है।
- source_word: ἐξιλάσεται ἀδικίαν
  choice: अन्याय का प्रायश्चित करेगा
  rationale: क्रिया में प्रायश्चित, दोष-निवारण या तुष्टीकरण का अर्थ-भार है। यह रूप मूल की नैतिक-धार्मिक भाषा और कहावत के संभावित व्यावहारिक आशय के बीच तनाव बनाए रखता है।
theological_decisions:
- issue: दूसरे खंड में शक्तिशाली लोगों को प्रसन्न करने और ‘अन्याय का प्रायश्चित करने’ के बीच संबंध
  choice: मुख्य पाठ में ‘अन्याय का प्रायश्चित करेगा’
  alternative: ‘कुकर्म को ढक देगा’ अथवा ‘अन्याय के कारण तुष्ट करेगा’
  rationale: ἐξιλάσεται स्वाभाविक रूप से प्रायश्चित अथवा तुष्टीकरण का अर्थ रखता है। कहावत सामाजिक प्रभाव के द्वारा दोष ढक जाने की ओर संकेत कर सकती है, किंतु अनुवाद उस संभावित व्यावहारिक आशय को मुख्य पाठ में थोपने के बजाय मूल का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कहावत के अनुरूप संक्षिप्त रखी गई है। अर्धविराम दोनों समानांतर खंडों को स्पष्ट करता है। ‘बड़े लोगों’ से सामाजिक प्रतिष्ठा और शक्ति का व्यापक भाव सुरक्षित रहता है।
