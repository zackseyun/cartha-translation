base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/007.yaml
  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: hi
  text: बुद्धिमान उचित समय तक मौन रहता है, पर मूर्ख उचित समय का ध्यान नहीं रखता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दूसरे खंड का शाब्दिक अर्थ है, “समय की रखवाली नहीं करता।” इस पद का यूनानी समानांतर पाठ बहुत भिन्न है: “जो बहुत बोलता है, उससे घृणा की जाएगी, और जो मनमाने ढंग से अधिकार चलाता है, उससे घृणा की जाएगी।”'
    reason: इब्रानी मुहावरे के शाब्दिक रूप और पर्याप्त रूप से भिन्न यूनानी समानांतर पाठ को दर्ज करना।
lexical_decisions:
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: इब्रानी का पुल्लिंग एकवचन संज्ञात्मक रूप नीतिवचन की प्रतिनिधिक शैली में बुद्धिमान मनुष्य को दर्शाता है। हिन्दी में ‘बुद्धिमान’ और पुल्लिंग क्रिया ‘रहता है’ इस रूप को स्वाभाविक ढंग से बनाए रखते हैं।
- source_word: יַחֲרִישׁ
  choice: मौन रहता है
  rationale: क्रिया का अर्थ चुप या मौन रहना है। ‘मौन रहता है’ नीतिवचन की सामान्य वर्तमानकालीन शैली और जानबूझकर न बोलने का भाव दोनों व्यक्त करता है।
- source_word: עַד עֵת
  choice: उचित समय तक
  rationale: शाब्दिक अर्थ ‘समय तक’ है, पर ज्ञान-साहित्य में עֵת अवसर के अनुकूल समय को सूचित कर सकता है। ‘उचित समय तक’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: וּכְסִיל
  choice: पर मूर्ख
  rationale: וְ सामान्यतः ‘और’ है, किंतु यहाँ बुद्धिमान और मूर्ख के बीच स्पष्ट विरोध है; इसलिए ‘पर’ प्रसंगगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: उचित समय का ध्यान नहीं रखता
  rationale: शाब्दिक रूप से यह ‘समय की रखवाली/पालना नहीं करता’ है। हिन्दी में ‘उचित समय का ध्यान नहीं रखता’ बोलने के सही अवसर की उपेक्षा का अर्थ स्पष्ट करता है, जबकि शाब्दिक स्वरूप पादटिप्पणी में सुरक्षित है।
