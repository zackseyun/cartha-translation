  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: hi
  text: ज़मीन पर फिसलना जीभ फिसलने से बेहतर है; इस प्रकार दुष्टों[a] का पतन शीघ्र आ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराइयों का पतन।” यूनानी κακῶν का अर्थ भाववाचक रूप में “बुराइयों” या व्यक्तिवाचक रूप में “दुष्टों” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  choice: फिसलना
  rationale: यह संज्ञा शारीरिक रूप से फिसलने या ठोकर खाने को दर्शाती है। हिन्दी में संज्ञार्थक क्रिया ‘फिसलना’ कहावत की स्वाभाविकता बनाए रखती है और नैतिक ‘चूक’ का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: ἀπὸ ἐδάφους
  choice: ज़मीन पर
  rationale: यूनानी वाक्यांश उस धरातल या पाँव के नीचे की जगह को सूचित करता है जिसके कारण व्यक्ति फिसलता है। शाब्दिक ‘ज़मीन से’ की अपेक्षा ‘ज़मीन पर’ आधुनिक हिन्दी में ठोस चित्र को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: जीभ से फिसलने से अच्छा है
  rationale: यूनानी तुलना में क्रिया निहित है। हिन्दी में ‘अच्छा है’ जोड़ने से आशय स्पष्ट होता है और शारीरिक फिसलन तथा बोलने की भूल के बीच तुलना बनी रहती है।
- source_word: γλώσσης
  choice: जीभ
  rationale: ‘जीभ’ वाणी का ठोस रूपक सुरक्षित रखती है; ‘बात’ या ‘वाणी’ करने पर मूल बिंब कुछ मंद पड़ जाता।
- source_word: πτῶσις
  choice: पतन
  rationale: यहाँ शब्द गिरने, ढहने या विनाश की ओर संकेत करता है। ‘पतन’ नैतिक-नीतिवचनात्मक संदर्भ में स्वाभाविक है और मूल ‘गिरने’ की धारणा भी बनाए रखता है।
- source_word: κακῶν
  choice: दुष्टों का
  rationale: संबंधकारक बहुवचन को यहाँ व्यक्तिवाचक रूप में लेना प्रसंगानुकूल और हिन्दी में स्वाभाविक है। फिर भी ‘बुराइयों’ वाला भाव व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: κατὰ σπουδήν
  choice: शीघ्र
  rationale: वाक्यांश तीव्रता या जल्द आने का भाव देता है। ‘शीघ्र’ गरिमापूर्ण, स्पष्ट और कहावत-सदृश हिन्दी है।
- source_word: ἥξει
  choice: आ पहुँचेगा
  rationale: भविष्यकालीन ‘आना’ को ‘आ पहुँचेगा’ स्वाभाविक हिन्दी में व्यक्त करता है और आसन्न परिणाम का भाव बनाए रखता है।
theological_decisions:
- issue: κακῶν का संदर्भ
  choice: 'व्यक्तिवाचक: ‘दुष्टों का’'
  alternative: 'भाववाचक: ‘बुराइयों का’'
  rationale: πτῶσις के साथ व्यक्तियों के पतन का अर्थ नीतिसाहित्य में अधिक सहज है, पर यूनानी रूप दोनों अर्थों की अनुमति देता है। अतः मुख्य पाठ में व्यक्तिवाचक अर्थ और पादटिप्पणी में वैकल्पिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली रखी गई है। ‘जीभ से फिसलना’ हिन्दी का स्वाभाविक मुहावरा है और मूल की ठोस शब्द-छवि को सुरक्षित रखता है।
