  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: hi
  text: बुद्धिमान अपने वचनों से स्वयं को आगे बढ़ाएगा, और समझदार मनुष्य बड़े लोगों[a] को प्रसन्न करेगा।
  philosophy: optimal-equivalence
  footnotes:
