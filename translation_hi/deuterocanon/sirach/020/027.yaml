    issue: The reflexive object in προάξει ἑαυτόν is not explicit in “स्वयं उन्नति करेगा.”
    rationale: The Greek verb is transitive with ἑαυτόν as its object. Revising to “स्वयं को आगे बढ़ाएगा” preserves both self-directed action and the non-pejorative sense of advancement.
