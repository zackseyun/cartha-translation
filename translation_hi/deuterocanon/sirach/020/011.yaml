  text: कोई बहुत-सी चीज़ें थोड़े दाम में खरीदता है और उनके लिए सात गुना चुकाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य संक्षिप्त है। बहुवचन सर्वनाम का संबंध खरीदी हुई चीज़ों या उनके मूल्य से हो सकता है। अर्थ यह हो सकता है कि कोई बहुत-सी चीज़ें सस्ते में खरीदता है और उनके लिए सात गुना चुकाता है; व्यापक अर्थ में, दिखने में लाभ का सौदा बहुत महँगा पड़ सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν ἀγοράζων
  choice: कोई ... खरीदता है
  rationale: अस्तित्वसूचक ἔστιν और कृदंत ἀγοράζων मिलकर नीतिवचन की शैली में एक प्रकार के व्यक्ति या स्थिति का परिचय देते हैं; यह हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: πολλὰ
  choice: बहुत-सी चीज़ें
  rationale: नपुंसकलिंग बहुवचन यहाँ खरीदी गई वस्तुओं को सूचित करता है। स्पष्ट हिंदी के लिए बहुवचन अर्थ को प्रत्यक्ष रखा गया है।
- source_word: ὀλίγου
  choice: थोड़े दाम में
  rationale: खरीदने के संदर्भ में संबंधकारक मूल्य बताता है। यह रूप कम कीमत का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποτιννύων
  choice: चुकाता है
  rationale: क्रिया देय राशि भरने या वापस चुकाने का भाव रखती है। 'चुकाता है' व्यापारिक संदर्भ के अनुकूल है और यह निर्धारित नहीं करता कि भुगतान तत्काल है या बाद में।
- source_word: αὐτὰ
  choice: उनका
  rationale: यूनानी सर्वनाम नपुंसकलिंग बहुवचन है और खरीदी गई चीज़ों अथवा उनके मूल्य की ओर संकेत कर सकता है। हिंदी में 'उनका' बहुवचन रूप और संदर्भ की संक्षिप्तता दोनों बनाए रखता है।
- source_word: ἑπταπλάσιον
  choice: सात गुना
  rationale: यह सात गुने परिमाण को व्यक्त करता है और यह खुला रखता है कि गुणा कीमत, मूल्य या अंतिम भुगतान का है।
