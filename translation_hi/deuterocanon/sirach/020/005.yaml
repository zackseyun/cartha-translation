  yaml_path: translation/deuterocanon/sirach/020/005.yaml
  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
translation:
  language: hi
  text: कोई चुप रहता है और बुद्धिमान समझा जाता है[a], और कोई बहुत बोलने के कारण तुच्छ समझा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “कोई इसलिए चुप रहता है कि उसके पास उत्तर नहीं है, और कोई उचित समय जानकर चुप रहता है।” यहाँ सुरक्षित इब्रानी पाठ इससे काफी भिन्न है; मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: अस्तित्वसूचक יֵשׁ यहाँ एक प्रकार के व्यक्ति का परिचय देता है; हिन्दी में ‘कोई’ दोनों समानांतर खंडों को स्वाभाविक और संक्षिप्त रखता है।
- source_word: מַחֲרִישׁ
  choice: चुप रहता है
  rationale: חרש का कृदन्त लगातार या स्वभावतः मौन रहने का भाव देता है; ‘चुप रहता है’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנֶחְשָׁב
  choice: समझा जाता है
  rationale: निफ़अल रूप दूसरों द्वारा किसी रूप में माने जाने का अर्थ देता है; ‘समझा जाता है’ सामाजिक मूल्यांकन को स्पष्ट रखता है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह ज्ञान-साहित्य के सामान्य अर्थ में विवेकशील या बुद्धिमान होने को दर्शाता है; ‘बुद्धिमान’ इसका सीधा और प्रचलित हिन्दी रूप है।
- source_word: נִמְאָס
  choice: तुच्छ समझा जाता है
  rationale: מאס अस्वीकार या अवमानना का भाव रखता है। ‘तुच्छ समझा जाता है’ पहले खंड के ‘बुद्धिमान समझा जाता है’ के साथ समानांतरता बनाए रखते हुए सामाजिक तिरस्कार व्यक्त करता है।
- source_word: בְּרוֹב
  choice: बहुत … के कारण
  rationale: בְּ यहाँ कारण या अवसर बताता है और רֹב अधिकता; हिन्दी में ‘बहुत … के कारण’ इस कारणात्मक संबंध को स्पष्ट करता है।
- source_word: שִׂיחַ
  choice: बोलने
  rationale: שִׂיחַ वाणी या बातचीत को सूचित करता है। इस कहावत में मौन के विपरीत अत्यधिक बोलना अभिप्रेत है, इसलिए ‘बोलने’ सहज और सटीक है।
