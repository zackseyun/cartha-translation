lexical_decisions:
- source_word: ὀλίγα
  choice: थोड़ा
  rationale: नपुंसकलिंग बहुवचन यहाँ देने की अल्प मात्रा बताता है; हिन्दी में ‘थोड़ा देगा’ सहज और अर्थसंगत है।
- source_word: δώσει
  choice: देगा
  rationale: यूनानी भविष्यकाल को औपचारिक रूप से सुरक्षित रखा गया है; ज्ञान-साहित्य के नीतिवचन में यह किसी व्यक्ति के सामान्य व्यवहार को भी व्यक्त कर सकता है।
- source_word: πολλὰ ὀνειδίσει
  choice: बहुत उलाहना देगा
  rationale: ὀνειδίζω में धिक्कारने, ताना देने या अपमानजनक उलाहना देने का भाव है। ‘बहुत उलाहना देगा’ अल्प दान और प्रचुर उलाहने के विरोध को संक्षेप में बनाए रखता है।
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: अपना मुँह खोलेगा
  rationale: मूल का स्पष्ट वाक्-चित्र सुरक्षित है और अगले उपमान से स्वाभाविक रूप से जुड़ता है।
- source_word: ὡς κῆρυξ
  choice: दूत की तरह
  rationale: κῆρυξ सार्वजनिक रूप से ऊँची आवाज़ में घोषणा करने वाले राजदूत या घोषक को दर्शाता है। ‘दूत’ dignified और सामान्य हिन्दी है; सार्वजनिक घोषणा का भाव संदर्भ से उभरता है।
