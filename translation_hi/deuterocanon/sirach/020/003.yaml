translation:
  language: hi
  text: किसी युवती का कौमार्य भंग करने की नपुंसक की इच्छा जैसी ही वह व्यक्ति है जो बलपूर्वक न्यायिक निर्णय लागू करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिंसा के साथ।’ यूनानी पद ἐν βίᾳ बाध्य करने या हिंसक कार्रवाई पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस कहावत का चित्र बलपूर्वक न्याय करने की अनुचितता पर, या उसकी असंगति और निष्फलता पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यह शब्द प्रबल इच्छा या लालसा को व्यक्त करता है। ‘अभिलाषा’ यहाँ यौन आशय को संदर्भ से स्पष्ट रहने देती है और अनावश्यक रूप से उसे अधिक तीखा नहीं बनाती।
- source_word: εὐνούχου
  choice: खोजे की
  rationale: ‘खोजा’ εὐνοῦχος का प्रचलित और सटीक हिन्दी रूप है तथा इस दृष्टांत में निहित शारीरिक और सामाजिक अर्थ को बनाए रखता है।
- source_word: ἀποπαρθενῶσαι
  choice: कौमार्य भंग करने
  rationale: क्रिया का विशिष्ट अर्थ किसी युवती को उसके कौमार्य से वंचित करना है। यह अनुवाद उस अर्थ को अस्पष्ट ‘संभोग करने’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है।
- source_word: νεάνιδα
  choice: किसी युवती का
  rationale: यह शब्द एक युवा स्त्री को दर्शाता है। ‘युवती’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: οὕτως
  choice: वैसा ही
  rationale: यह कहावत के दोनों पक्षों के बीच स्पष्ट उपमा स्थापित करता है।
- source_word: ὁ ποιῶν ... κρίματα
  choice: वह व्यक्ति ... न्यायिक निर्णय लागू करता है
  rationale: शाब्दिक अर्थ ‘निर्णय करने वाला’ हो सकता है, पर κρίματα के साथ वाक्यांश न्यायिक निर्णयों को कार्यान्वित करने का भाव देता है। ‘लागू करता है’ इस सक्रिय पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν βίᾳ
  choice: बलपूर्वक
  rationale: यह पद बाध्य करने या हिंसक बल के प्रयोग को सूचित कर सकता है। ‘बलपूर्वक’ संक्षिप्त है और दोनों संभावनाओं के लिए पर्याप्त खुला रहता है।
theological_decisions:
- issue: कहावत के नैतिक आशय की व्याख्या
  choice: मुख्य पाठ उपमा को बिना खोले प्रस्तुत करता है और बलपूर्वक न्यायिक निर्णय लागू करने को मूलतः असंगत या निष्फल चित्र के समान रखता है।
  alternative: उपमा का प्रमुख बल नैतिक निंदा के बजाय असमर्थता, विफल लालसा या बेतुकी असंगति पर हो सकता है।
  rationale: यूनानी पाठ उपमा देता है, पर उसका सटीक बिंदु स्पष्ट नहीं करता। इसलिए मुख्य पाठ चित्र और तनाव को सुरक्षित रखता है, जबकि पादटिप्पणी संभावित अर्थों को बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘खोजा’, ‘कौमार्य भंग करना’ और ‘न्यायिक निर्णय लागू करना’ मूल यूनानी चित्र तथा न्यायिक अर्थ को सटीक रखते हुए औपचारिक किंतु सामान्य पाठक के लिए बोधगम्य शैली बनाए रखते हैं।
