lexical_decisions:
- source_word: σήμερον
  choice: आज
  rationale: यह कालवाचक क्रियाविशेषण वर्तमान दिन को सूचित करता है और αὔριον के साथ कहावत का तीखा विरोध बनाए रखता है।
- source_word: δανιεῖ
  choice: वह उधार देगा
  rationale: यह भविष्यत्काल का रूप है; हिन्दी में स्पष्ट भविष्यत्काल मूल यूनानी की कालगत अभिव्यक्ति को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: αὔριον
  choice: कल
  rationale: यह σήμερον के विपरीत अगले दिन को सूचित करता है; हिन्दी में ‘आज…कल’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀπαιτήσει
  choice: उसे वापस माँगेगा
  rationale: क्रिया का अर्थ दी हुई वस्तु को लौटाने की माँग करना है। उधार के प्रसंग से निहित कर्म को ‘उसे’ द्वारा स्पष्ट किया गया है, जबकि ‘वापस’ प्रत्यावर्तन का भाव रखता है।
- source_word: μισητὸς
  choice: घृणा का पात्र
  rationale: विशेषण के ‘घृणित’ और ‘जिससे घृणा की जाती है’ दोनों संभावित अर्थों के बीच यह अभिव्यक्ति प्रतिक्रिया-केंद्रित अर्थ देती है, पर वास्तविक द्व्यर्थता को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधि मानवीय प्रकार का उल्लेख है। ‘मनुष्य’ आधुनिक मानक हिन्दी में गरिमापूर्ण और लिंग की दृष्टि से अनावश्यक रूप से सीमित न करने वाला सहज विकल्प है।
- source_word: ὁ τοιοῦτος
  choice: ऐसा
  rationale: यह पहले वर्णित आचरण वाले व्यक्ति की ओर संकेत करता है और हिन्दी कहावत की शैली में संक्षिप्त तथा स्वाभाविक है।
theological_decisions:
- issue: ज्ञान-साहित्य की कहावत में सामान्य अर्थ वाले ἄνθρωπος का अनुवाद
  choice: मनुष्य
  alternative: आदमी
  rationale: यूनानी शब्द यहाँ किसी एक पुरुष के बजाय इस प्रकार के मानवीय चरित्र को प्रस्तुत करता है। ‘मनुष्य’ उस व्यापक संदर्भ को बनाए रखता है और मूल के एकवचन को भी सुरक्षित रखता है।
- issue: μισητός की कर्तृवाचक अथवा कर्मवाचक अर्थ-छाया
  choice: घृणा का पात्र
  alternative: घृणित
  rationale: यूनानी विशेषण किसी व्यक्ति के घृणित होने या लोगों द्वारा उससे घृणा किए जाने—दोनों अर्थ दे सकता है। मुख्य पाठ में सहज हिन्दी चुनी गई है और वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है, ताकि नैतिक चरित्र और उत्पन्न प्रतिक्रिया के बीच का तनाव मिटे नहीं।
