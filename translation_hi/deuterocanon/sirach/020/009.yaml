translation:
  language: hi
  text: एक ऐसा दान है जिससे तुम्हें लाभ नहीं होगा, और एक ऐसा दान है जिसका प्रतिदान दुगुना होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόσις
  choice: दान
  rationale: यह शब्द देने की क्रिया या दी हुई वस्तु, दोनों का बोध करा सकता है। नीतिवचन-जैसे इस वाक्य में ‘दान’ संक्षिप्त और स्वाभाविक है तथा दोनों प्रयोगों की कुछ व्यापकता बनाए रखता है।
- source_word: λυσιτελήσει
  choice: लाभदायक नहीं होगा
  rationale: भविष्यकालीन क्रिया उपयोग, हित या लाभ पहुँचने का अर्थ देती है। यह चयन आर्थिक लाभ तक सीमित हुए बिना सामान्य हित को व्यक्त करता है।
- source_word: σοι
  choice: तुम्हारे लिए
  rationale: सम्प्रदान कारक उस व्यक्ति को सूचित करता है जिस पर लाभ या हानि का प्रभाव पड़ता है। ‘तुम्हारे लिए’ हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: ἀνταπόδομα
  choice: प्रतिदान
  rationale: यह बदले में लौटाई या दी जाने वाली वस्तु अथवा फल को दर्शाता है। ‘प्रतिदान’ पारस्परिक प्रत्युत्तर का अर्थ स्पष्ट रखता है।
- source_word: διπλοῦν
  choice: दुगुना
  rationale: इसका सीधा अर्थ ‘दो गुना’ है। ‘दुगुना’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
