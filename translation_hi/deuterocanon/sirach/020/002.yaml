  yaml_path: translation/deuterocanon/sirach/020/002.yaml
  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: hi
  text: क्रोधित होने के बजाय दोष बताना कितना अच्छा है! और जो स्वीकार करता है[a], वह हानि से बचाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो इसे स्वीकार करता है, वह नुकसान, कमी या प्रतिकूलता से बचाया जाएगा।” यूनानी में ‘स्वीकार करता है’ का कर्म नहीं बताया गया है, और परिणाम के लिए प्रयुक्त संज्ञा का अर्थ हानि, नुकसान, कमी या प्रतिकूलता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: कितना अच्छा है
  rationale: यह विस्मयात्मक पदबंध नैतिक मूल्यांकन व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और मूल के बल के अनुरूप है।
- source_word: ἐλέγξαι
  choice: सुधारना
  rationale: यहाँ शब्द का आशय किसी की गलती दिखाकर उसे सुधारने से है। ‘सुधारना’ सामान्य पाठक के लिए सहज है और केवल कठोर फटकार का भाव नहीं जोड़ता।
- source_word: ἢ θυμοῦσθαι
  choice: क्रोधित होने के बजाय
  rationale: यह तुलना रचनात्मक सुधार को क्रोध के विपरीत रखती है; ‘क्रोधित होना’ θυμόομαι का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: ὁ ἀνθομολογούμενος
  choice: जो अपनी गलती मान लेता है
  rationale: कृदन्त स्वीकार करने या खुलकर मान लेने का भाव देता है। प्रसंग में गलती स्वीकारना निहित है, यद्यपि यूनानी में कर्म अनुक्त है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀπὸ ἐλαττώσεως
  choice: हानि से
  rationale: ἐλάττωσις कमी, नुकसान या प्रतिकूलता का व्यापक अर्थ रख सकता है। ‘हानि’ इस अर्थ-क्षेत्र को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κωλυθήσεται
  choice: बचाया जाएगा
  rationale: भविष्यत् कर्मवाच्य और ἀπό के साथ इसका भाव किसी प्रतिकूल परिणाम से रोके या बचाए जाने का है; हिन्दी में ‘बचाया जाएगा’ स्वाभाविक है।
