lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: ज्ञान-साहित्य के संदर्भ में ‘बुद्धि’ इसका स्वाभाविक और मानक अर्थ है।
- source_word: κεκρυμμένη
  choice: छिपी हुई
  rationale: पूर्ण निष्क्रिय कृदंत ऐसी वस्तु को दर्शाता है जो छिपाई गई है और अब भी छिपी है; ‘छिपी हुई’ इस भाव को सहज हिन्दी में रखता है।
- source_word: θησαυρός
  choice: खज़ाना
  rationale: यह मूल्यवान संचित वस्तु का ठोस बिंब बनाए रखता है और ‘बुद्धि’ के समानांतर स्वाभाविक है।
- source_word: ἀφανής
  choice: दृष्टि से ओझल
  rationale: शब्द का अर्थ दिखाई न देने वाला या प्रकट न होना है; यह चयन पहले खंड के ‘छिपी हुई’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: τίς ὠφέλεια
  choice: क्या लाभ है
  rationale: यह व्यावहारिक उपयोग या फायदे के विषय में पूछने वाले यूनानी मुहावरे का स्पष्ट, वर्तमान हिन्दी रूप है।
- source_word: ἐν ἀμφοτέροις
  choice: इन दोनों से
  rationale: ἀμφοτέροις औपचारिक रूप से दोनों वस्तुओं को एक साथ इंगित करता है; ‘इन दोनों से’ उस सामूहिक संदर्भ को सीधे बनाए रखता है।
