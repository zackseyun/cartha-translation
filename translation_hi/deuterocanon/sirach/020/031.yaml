translation:
  language: hi
  text: अपनी मूर्खता छिपाने वाला मनुष्य अपनी बुद्धि छिपाने वाले मनुष्य से उत्तम है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείσσων
  choice: उत्तम है
  rationale: यह तुलनात्मक विशेषण दो प्रकार के मनुष्यों की तुलना करता है। ‘उत्तम है’ कहावत की संक्षिप्त और गरिमापूर्ण शैली बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यूनानी शब्द यहाँ सामान्य अर्थ में किसी व्यक्ति को दर्शाता है। ‘मनुष्य’ आधुनिक हिन्दी में इस प्रतिनिधिक और लिंग-सामान्य भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀποκρύπτων
  choice: छिपाने वाला
  rationale: वर्तमान कृदन्त व्यक्ति की विशेषता बताता है। दोनों खंडों में यही रूप रखने से मूल का समानांतर वाक्य-विन्यास सुरक्षित रहता है।
- source_word: μωρίαν
  choice: मूर्खता
  rationale: यह μωρία के नैतिक और व्यावहारिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ‘बुद्धि’ σοφία का स्थापित, संक्षिप्त और इस ज्ञान-साहित्य के लिए उपयुक्त अनुवाद है।
