  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
translation:
  language: hi
  text: ऐसी डाँट भी होती है जो समय के अनुकूल नहीं होती[a], और जो चुप रहता है, वह स्वयं भी बुद्धिमान होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उचित नहीं होती।” यूनानी विशेषण का अर्थ “समयोचित,” “उपयुक्त,” या दूसरे संदर्भों में “सुन्दर” हो सकता है; यहाँ सम्भवतः उचित समय या अवसर का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  choice: डाँट
  rationale: यह शब्द किसी दोष को प्रकट करके मौखिक रूप से फटकारने या सुधारने का भाव रखता है। ‘डाँट’ आधुनिक हिन्दी में स्वाभाविक है और चुप रहने के साथ दिए गए नीतिवचनात्मक विरोध को स्पष्ट रखता है।
- source_word: ὡραῖος
  choice: समय के अनुकूल
  rationale: यहाँ विशेषण का अर्थ केवल ‘सुन्दर’ नहीं, बल्कि उचित अवसर या समय के अनुरूप होना अधिक स्वाभाविक है। यह अभिव्यक्ति समयोचितता और उपयुक्तता—दोनों की सम्भावना बनाए रखती है।
- source_word: σιωπῶν
  choice: जो चुप रहता है
  rationale: वर्तमान कृदन्त ऐसे व्यक्ति को दर्शाता है जो बोलने के बजाय मौन रहता है; यह हिन्दी में स्वाभाविक ढंग से उसके आचरण को व्यक्त करता है।
- source_word: φρόνιμος
  choice: बुद्धिमान
  rationale: इस शब्द में व्यावहारिक समझ, विवेक और सूझ-बूझ का भाव है। नीतिवचनात्मक संदर्भ में ‘बुद्धिमान’ सहज और पर्याप्त व्यापक है।
- source_word: καὶ αὐτός
  choice: वह स्वयं भी
  rationale: यह पद दूसरे व्यक्ति पर बल देता है और ‘भी’ के द्वारा यूनानी καί की समावेशी छाया को बनाए रखता है।
