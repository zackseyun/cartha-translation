  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: hi
  text: झूठ मनुष्य पर लगा एक बुरा कलंक है[a]; अनुशासनहीनों के मुँह में वह लगातार बना रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झूठ मनुष्य में एक बुरा कलंक है’; यूनानी μῶμος का अर्थ ‘कलंक’, ‘अपयश’ या ‘निंदा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अनुशासनहीन’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘अशिक्षित’, ‘अप्रशिक्षित’ या ‘जिसे शिक्षा-संस्कार न मिला हो’ भी हो सकता है; यहाँ संभवतः नैतिक और ज्ञानपरक अनुशासन का भाव प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: बुरा कलंक
  rationale: μῶμος दाग, कलंक या निंदा का भाव रखता है, और πονηρός उसकी बुरी नैतिक गुणवत्ता को स्पष्ट करता है। यह पदबंध ठोस रूपक और मूल्यांकन—दोनों को बनाए रखता है।
- source_word: ἐν ἀνθρώπῳ
  choice: मनुष्य पर लगा
  rationale: ἄνθρωπος यहाँ जातिवाचक एकवचन है। हिंदी में ‘मनुष्य’ स्वाभाविक रूप से सामान्य मानवीय संदर्भ देता है; ‘पर लगा’ कलंक के रूपक को सहज बनाता है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: ψεῦδος का अर्थ झूठ या असत्य है। ‘झूठ’ इस नीतिवचन को संक्षिप्त, ठोस और सामान्य पाठक के लिए सहज रखता है।
- source_word: ἀπαιδεύτων
  choice: अनुशासनहीन लोगों
  rationale: ज्ञान-साहित्य में ἀπαίδευτος केवल अशिक्षित नहीं, बल्कि शिक्षा-संस्कार और नैतिक अनुशासन से रहित व्यक्ति को भी दर्शाता है। बहुवचन को हिंदी में स्पष्ट रखा गया है।
- source_word: ἐνδελεχισθήσεται
  choice: लगातार बना रहेगा
  rationale: भविष्यकालीन रूप निरंतर टिके रहने या बार-बार उपस्थित होने का भाव देता है। यह हिंदी अभिव्यक्ति उसके काल और दीर्घता दोनों को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: जातिवाचक एकवचन ἐν ἀνθρώπῳ
  choice: मनुष्य पर लगा
  alternative: किसी व्यक्ति में
  rationale: यूनानी पद किसी विशेष पुरुष तक सीमित नहीं, बल्कि सामान्य मनुष्य को सूचित करता है। ‘मनुष्य’ हिंदी में उसकी जातिवाचक एकवचनता और व्यापक मानवीय प्रयोग दोनों बनाए रखता है।
- issue: ἀπαίδευτος का नैतिक-ज्ञानपरक अर्थ
  choice: अनुशासनहीन
  alternative: अशिक्षित
  rationale: संदर्भ में दोष औपचारिक शिक्षा की कमी मात्र नहीं, बल्कि चरित्र-निर्माण और विवेकपूर्ण अनुशासन के अभाव से जुड़ा है; इसलिए ‘अनुशासनहीन’ को मुख्य पाठ में रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘मनुष्य’ जातिवाचक है और किसी विशेष लिंग तक अर्थ को सीमित नहीं करता। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
