- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: अपने को प्रिय बना लेगा
  rationale: यह चयन मूल के आत्मवाचक निर्माण और προσφιλής के ‘प्रिय/स्नेहभाजन’ अर्थ को सुरक्षित रखता है।
- source_word: χάριτες
  choice: कृपाएँ
  rationale: χάριτες में कृपापूर्ण कार्य, अनुग्रह अथवा आकर्षक गुण का अर्थ संभव है। ‘कृपाएँ’ मुख्य पाठ में उसकी बहुवचनता और अर्थगत विस्तार को अपेक्षाकृत निकटता से रखता है।
- source_word: μωρῶν
  choice: मूर्खों की
  rationale: यह संबंधकारक बहुवचन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐκχυθήσονται
  choice: उँडेल दी जाएँगी
  rationale: यह भविष्यत् कर्मवाच्य के ‘बहा/उँडेल दिया जाना’ रूपक को बनाए रखता है और उसे व्याख्यात्मक रूप से ‘व्यर्थ कर दी जाएँगी’ नहीं बनाता।
