  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: hi
  text: कोई ऐसा व्यक्ति है जो अभाव के कारण पाप करने से रोका जाता है[a], और उसके विश्राम में उसके मन में कोई चुभन नहीं होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अभाव के कारण’ का अनुवाद ‘कमी के कारण,’ ‘ज़रूरत के कारण’ या ‘गरीबी के कारण’ भी हो सकता है। यूनानी वाक्यांश अभाव को उस व्यक्ति के पाप करने से रोके जाने का कारण बताता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘वह बेधा या चुभाया नहीं जाएगा।’ इसका आशय मन की टीस, ग्लानि या पश्चात्ताप न होना हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: रुक जाता है
  rationale: यह यूनानी कृदंत किसी बाहरी परिस्थिति द्वारा रोके या बाधित किए जाने का भाव रखता है। हिंदी में यह प्रयोग स्वाभाविक रहते हुए उस निष्क्रिय अर्थ को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἁμαρτάνειν
  choice: पाप करने से
  rationale: यह मूल क्रिया के नैतिक और धार्मिक अर्थ को सीधे बनाए रखता है।
- source_word: ἀπὸ ἐνδείας
  choice: अभाव के कारण
  rationale: ἐνδεία का अर्थ आवश्यकता, कमी या गरीबी हो सकता है। यहाँ ἀπό कारण सूचित करता है; ‘अभाव के कारण’ अर्थ-सीमा को केवल आर्थिक गरीबी तक सीमित नहीं करता।
- source_word: ἀναπαύσει
  choice: विश्राम
  rationale: यह मूल शब्द के विश्राम, चैन या राहत के व्यापक भाव को बनाए रखता है, बिना प्रसंग को अनावश्यक रूप से निश्चित किए।
- source_word: οὐ κατανυγήσεται
  choice: उसके मन में कोई चुभन नहीं होगी
  rationale: κατανύσσω भीतर तक चुभने या बेधने से उत्पन्न ग्लानि अथवा मन की टीस का रूपक रखता है। यह अनुवाद उस चित्रात्मकता को बचाता है और हिंदी पाठक के लिए समझने योग्य है।
theological_decisions:
- issue: अभाव द्वारा पाप से रोके जाने का नैतिक आशय
  choice: पद को इस अवलोकन के रूप में रखा गया है कि अभाव किसी व्यक्ति को पाप करने से रोक सकता है।
  alternative: इसे इस दावे के रूप में पढ़ना कि गरीबी अपने-आप में मनुष्य को धर्मी बनाती है।
  rationale: यूनानी पाठ परिस्थिति द्वारा संयमित होने की बात कहता है, गरीबी को अपने-आप में नैतिक पुण्य घोषित नहीं करता।
- issue: οὐ κατανυγήσεται में अंतःकरण की दशा
  choice: मूल की ‘चुभन’ वाली रूपकात्मक भाषा को बनाए रखा गया है, जो ग्लानि, टीस या पश्चात्ताप का संकेत दे सकती है।
  alternative: स्पष्ट रूप से ‘उसे कोई पश्चात्ताप नहीं होगा’ कहना।
  rationale: रूपक को बनाए रखने से मूल की अर्थगत व्यापकता और संभावित तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘अभाव’ ἐνδεία की व्यापकता को और ‘मन में कोई चुभन’ κατανυγήσεται की मूल रूपकात्मकता को सुरक्षित रखते हैं।
