  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: hi
  text: अतिथि-सत्कार[a] और उपहार[b] बुद्धिमानों की आँखें अंधी कर देते हैं, और मुँह पर बँधे मुँहबंद की तरह फटकारों को टाल देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अतिथि-संबंधी भेंटें’; यूनानी ξένια अतिथि के सत्कार या अतिथि-मित्रता से जुड़ी भेंटों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘उपहार’ का आशय ऐसे अनुग्रहों से हो सकता है जो निर्णय को भ्रष्ट करें; यूनानी पाठ स्पष्ट रूप से ‘रिश्वत’ नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: अतिथि-सत्कार
  rationale: यह शब्द अतिथि की आवभगत या अतिथि-संबंधी भेंटों का अर्थ दे सकता है। δῶρα से इसका भेद बनाए रखते हुए ‘अतिथि-सत्कार’ सामाजिक कृपा और उसके प्रभाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: δῶρα
  choice: उपहार
  rationale: यूनानी शब्द का सीधा अर्थ ‘उपहार’ है। संदर्भ में ये विवेक को भ्रष्ट करने वाली कृपाएँ हो सकती हैं, पर मूल शब्द स्पष्ट रूप से ‘रिश्वत’ नहीं कहता।
- source_word: ἀποτυφλοῖ
  choice: अंधी कर देते हैं
  rationale: यह प्रबल क्रिया दृष्टिहीन करने का बिंब रखती है और यहाँ नैतिक विवेक के कुंठित होने को दर्शाती है।
- source_word: ὀφθαλμοὺς σοφῶν
  choice: बुद्धिमानों की आँखें
  rationale: यह मूल संबंधवाचक संरचना और प्रतिनिधिक बहुवचन को सहज हिंदी में बनाए रखता है।
- source_word: φιμός
  choice: थूथन
  rationale: शब्द मुँह पर लगाए जाने वाले muzzle को दर्शाता है। ‘थूथन’ ठोस बिंब को बनाए रखता है; वाक्य में ‘मुँह पर लगे’ जोड़ने से अर्थ स्पष्ट होता है।
- source_word: ἀποτρέπει
  choice: टाल देते हैं
  rationale: क्रिया का अर्थ मोड़ देना, दूर करना या रोकना है। ‘टाल देते हैं’ फटकार को सामने आने या प्रभावी होने से हटा देने की अस्पष्टता बनाए रखता है।
- source_word: ἐλεγμούς
  choice: फटकारों
  rationale: ज्ञान-साहित्य के संदर्भ में यह नैतिक भर्त्सना या सुधारात्मक उलाहने को सूचित करता है; ‘फटकार’ आधुनिक और स्पष्ट है।
