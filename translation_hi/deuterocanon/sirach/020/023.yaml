  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: hi
  text: कोई व्यक्ति लज्जा के मारे अपने मित्र से वादा कर बैठता है, और व्यर्थ ही[a] उसे अपना शत्रु बना लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिना कारण’; यूनानी शब्द का अर्थ ‘व्यर्थ’ अथवा ‘बिना उचित कारण’—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν αἰσχύνης
  choice: लज्जा के मारे
  rationale: यहाँ χάριν, αἰσχύνης के साथ उत्तरसर्गीय वाक्यांश बनाकर कारण या प्रेरणा व्यक्त करता है—‘लज्जा के कारण।’ इसे अलग संज्ञा ‘कृपा/उपकार’ मानना यूनानी वाक्य-विन्यास के अनुकूल नहीं है। ‘लज्जा के मारे’ आधुनिक हिन्दी में सामाजिक दबाव से किए गए वादे का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπαγγελλόμενος
  choice: वादा कर बैठता है
  rationale: क्रिया वादा करने को व्यक्त करती है। ‘कर बैठता है’ अनिच्छा या दबाव में उठाए गए ऐसे कदम और उसके अनचाहे परिणाम को स्वाभाविक हिन्दी में सामने लाता है, बिना वादे की अनिर्दिष्ट वस्तु को जोड़ने के।
- source_word: φίλῳ
  choice: अपने मित्र से
  rationale: सम्प्रदान कारक उस मित्र को सूचित करता है जिसके प्रति वादा किया जाता है। हिन्दी में ‘किसी से वादा करना’ स्वाभाविक प्रयोग है; ‘अपने’ αὐτοῦ का अनुवाद नहीं, बल्कि सम्बन्ध को हिन्दी में स्पष्ट करने वाला मुहावरेदार संकेत है।
- source_word: ἐκτήσατο αὐτὸν ἐχθρόν
  choice: उसे अपना शत्रु बना लेता है
  rationale: ἐκτήσατο का मूल भाव अपने लिए प्राप्त कर लेना है। इस प्रसंग में शाब्दिक ‘शत्रु प्राप्त कर लेता है’ की अपेक्षा ‘अपना शत्रु बना लेता है’ अधिक स्वाभाविक है और विडंबनापूर्ण परिणाम को सुरक्षित रखता है।
- source_word: δωρεάν
  choice: व्यर्थ ही
  rationale: यह क्रियाविशेषण निष्फलता (‘व्यर्थ’) या उचित कारण के अभाव (‘बिना कारण’) को व्यक्त कर सकता है। मुख्य पाठ में ‘व्यर्थ ही’ प्रसंग की विडंबना को सहज हिन्दी में रखता है; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
