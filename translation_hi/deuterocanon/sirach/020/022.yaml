  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: hi
  text: कोई ऐसा है जो लज्जा के कारण अपना जीवन[a] नष्ट कर देता है, और मूर्खतापूर्ण चेहरे के कारण[b] उसे खो देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने प्राण” अथवा “अपनी आत्मा”; यूनानी ψυχή का अर्थ ‘जीवन’, ‘स्वयं’, ‘प्राण’ या ‘आत्मा’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मूर्ख चेहरे से।” यह पदबंध मूर्खतापूर्ण हाव-भाव या किसी मूर्ख व्यक्ति की बाहरी उपस्थिति की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολλύων
  choice: नष्ट कर देता है
  rationale: ἀπόλλυμι की तीव्रता और आगे आने वाले ἀπολεῖ के साथ उसके शाब्दिक संबंध को बनाए रखता है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: ψυχή यहाँ ‘जीवन’, ‘स्वयं’ या ‘प्राण/आत्मा’ का बोध करा सकता है। इस ज्ञान-साहित्यिक चेतावनी में ‘अपना जीवन’ स्वाभाविक है और अनावश्यक रूप से किसी संकीर्ण मानवशास्त्रीय निष्कर्ष को नहीं थोपता।
- source_word: διʼ αἰσχύνην
  choice: लज्जा के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या माध्यम बताता है; हिन्दी में ‘के कारण’ स्पष्ट और सहज है।
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: मूर्खता भरे चेहरे के कारण
  rationale: यह यूनानी पदबंध लगभग ‘मूर्ख/बुद्धिहीन चेहरे से’ है। ‘मूर्खता भरे चेहरे’ से πρόσωπον की दृश्य छवि बनी रहती है, जबकि पादटिप्पणी में ‘हाव-भाव’ और ‘मूर्ख व्यक्ति’ की संभावनाएँ सुरक्षित रखी गई हैं।
- source_word: ἀπολεῖ αὐτήν
  choice: उसे खो देगा
  rationale: भविष्यकालीन ἀπολεῖ पहले प्रयुक्त ἀπολλύων को दोहराता है; ‘खो देगा’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘उसे’ का संबंध ‘जीवन’ से बना रहता है।
theological_decisions:
- issue: ज्ञान-साहित्य के इस प्रसंग में ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण, आत्मा, अथवा स्वयं
  rationale: पद आत्म-विनाशकारी आचरण की चेतावनी देता है। ‘जीवन’ व्यावहारिक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा और धर्मवैचारिक तनाव को बनाए रखती है।
- issue: ἀπὸ ἄφρονος προσώπου की संदिग्ध छवि
  choice: मूर्खता भरे चेहरे के कारण
  alternative: मूर्खतापूर्ण हाव-भाव के कारण; किसी मूर्ख व्यक्ति के कारण
  rationale: मूल पाठ के ‘चेहरे/मुख’ वाले रूपक को मुख्य पाठ में सुरक्षित रखा गया है; व्यक्ति या बाहरी हाव-भाव के रूप में उसका अर्थ निर्णायक रूप से तय नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मूल यूनानी के निकट भाषा रखी गई है। ‘लज्जा’ αἰσχύνη की गंभीरता को बनाए रखता है; अस्पष्ट ‘चेहरे’ वाली अभिव्यक्ति को सरल करके समाप्त करने के बजाय पादटिप्पणी में उसकी संभावित अर्थ-सीमा दी गई है।
