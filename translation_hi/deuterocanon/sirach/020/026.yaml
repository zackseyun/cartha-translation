lexical_decisions:
- source_word: ἦθος
  choice: चरित्र
  rationale: यहाँ शब्द मनुष्य की स्थायी नैतिक प्रवृत्ति या स्वभावगत आचरण को दर्शाता है; ‘चरित्र’ आधुनिक हिन्दी में इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀνθρώπου ψευδοῦς
  choice: झूठे मनुष्य का
  rationale: सम्बन्धकारक पदबंध ऐसे मनुष्य को बताता है जिसकी पहचान झूठ से है। ‘झूठे मनुष्य’ यूनानी के पुल्लिंग एकवचन को बनाए रखता है और हिन्दी में स्पष्ट है।
- source_word: ἀτιμία
  choice: अपमानजनक
  rationale: ἀτιμία सम्मान के अभाव, अनादर या बदनामी की दशा बताता है। विधेय-संज्ञा वाले यूनानी वाक्य को स्वाभाविक हिन्दी में ‘अपमानजनक होता है’ कहा गया है, जिससे चरित्र की अनादरणीय प्रकृति स्पष्ट होती है।
- source_word: αἰσχύνη
  choice: लज्जा
  rationale: ‘लज्जा’ उस शर्म और कलंक को व्यक्त करती है जो झूठे मनुष्य से जुड़ा रहता है, और इसे ἀτιμία से अलग शब्द में बनाए रखती है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ रहती है
  rationale: मूल अर्थ ‘उसके साथ’ है; हिन्दी में क्रिया ‘रहती है’ जोड़ने से वाक्य स्वाभाविक बनता है और निरन्तर संग रहने का भाव स्पष्ट होता है।
- source_word: ἐνδελεχῶς
  choice: निरन्तर
  rationale: यह क्रियाविशेषण लगातार या स्थायी रूप से बने रहने का भाव देता है; ‘निरन्तर’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
