translation:
  language: hi
  text: और उसने उनसे कहा, “हर अन्याय से सावधान रहो[a],” और उसने उनमें से हर एक को उसके पड़ोसी के विषय में आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर गलत बात से बचे रहो” अथवा “हर अन्यायपूर्ण बात से चौकन्ने रहो।” यूनानी अभिव्यक्ति संक्षिप्त है और इन निकट अर्थों की गुंजाइश रखती है।
    reason: शाब्दिक विकल्प और स्रोत की संक्षिप्त अभिव्यक्ति को दर्शाने के लिए।
lexical_decisions:
- source_word: Προσέχετε
  choice: सावधान रहो
  rationale: यह आज्ञार्थक क्रिया ध्यान देने, सचेत रहने या बचने की चेतावनी दे सकती है। ἀπό के साथ यहाँ ‘सावधान रहो’ आधुनिक हिन्दी में चेतावनी का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ παντὸς ἀδίκου
  choice: हर प्रकार के अन्याय से
  rationale: यूनानी पदबंध संक्षिप्त है और हर अन्यायपूर्ण अथवा गलत बात या काम को समेट सकता है। ‘हर प्रकार के अन्याय से’ उसके व्यापक नैतिक और सामाजिक अर्थ को बनाए रखता है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: क्रिया अधिकारपूर्वक आदेश देने का बोध कराती है; इसलिए अपेक्षाकृत कोमल ‘समझाया’ के बजाय ‘आज्ञा दी’ चुना गया है।
- source_word: ἑκάστῳ
  choice: उनमें से हर एक को
  rationale: एकवचन दत्तिव का वितरणात्मक बल स्पष्ट करता है कि यह आज्ञा प्रत्येक व्यक्ति को अलग-अलग दी गई थी।
- source_word: περὶ τοῦ πλησίον
  choice: उसके पड़ोसी के विषय में
  rationale: πλησίον नैतिक प्रसंग में निकटवर्ती अथवा साथी मनुष्य को दर्शाता है। ‘पड़ोसी’ बाइबिल की परिचित नैतिक भाषा और यूनानी के एकवचन रूप दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἀδίκου की नैतिक व्याप्ति
  choice: ‘अन्याय’ के रूप में अनुवाद
  alternative: ‘हर गलत बात’ अथवा ‘हर अधर्म’
  rationale: सिराख के ज्ञान-साहित्यिक प्रसंग और अगले पदबंध में पड़ोसी के उल्लेख के कारण सामाजिक-नैतिक अर्थ प्रमुख है। ‘अधर्म’ यहाँ अनावश्यक रूप से तकनीकी धर्मवैज्ञानिक अर्थ ग्रहण कर सकता है।
- issue: ‘पड़ोसी’ का वितरणात्मक एकवचन
  choice: ‘उनमें से हर एक को उसके पड़ोसी के विषय में’
  alternative: ‘हर एक को अपने पड़ोसियों के विषय में’ अथवा ‘एक-दूसरे के विषय में’
  rationale: यूनानी पाठ एकवचन और वितरणात्मक रचना रखता है। उसे बनाए रखने से व्यक्तिगत नैतिक उत्तरदायित्व उभरता है और पाठ में ‘एक-दूसरे’ का अर्थ जोड़ा नहीं जाता।
- issue: पड़ोसी के विषय में आज्ञा की अनिर्दिष्ट विषयवस्तु
  choice: ‘पड़ोसी के विषय में आज्ञा दी’ की खुली अभिव्यक्ति बनाए रखी
  alternative: ‘पड़ोसी के प्रति उसके कर्तव्य की आज्ञा दी’
  rationale: यूनानी पाठ आज्ञा की विषयवस्तु को स्पष्ट नहीं करता। ‘कर्तव्य’ जोड़ना अर्थ को सहज बनाता, पर स्रोत की वास्तविक संक्षिप्तता और अस्पष्टता को अनुचित रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘सावधान रहो’ सामान्य पाठक के लिए स्पष्ट है; ‘आज्ञा दी’ मूल के अधिकारपूर्ण स्वर को रखता है। स्रोत की संक्षिप्तता के कारण अंतिम खंड को व्याख्यात्मक विस्तार दिए बिना रखा गया है।
