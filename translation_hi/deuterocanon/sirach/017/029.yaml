  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: hi
  text: प्रभु की दया कितनी महान है, और उसकी ओर लौटने वालों के लिए उसका प्रायश्चित[a] भी कितना महान है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रायश्चित’ के लिए यूनानी शब्द में पाप या दोष के निवारण और मेल कराने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: कितनी महान है
  rationale: विस्मयवाचक ὡς को तुलना के रूप में नहीं, बल्कि स्वाभाविक हिन्दी विस्मय के रूप में व्यक्त किया गया है।
- source_word: ἐλεημοσύνη
  choice: दया
  rationale: प्रभु के गुण और ἐξιλασμός के साथ प्रयुक्त होने के कारण यहाँ अर्थ दयालु करुणा है, दान देना नहीं।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: κύριος को परमेश्वर की उपाधि के रूप में प्रचलित और गरिमापूर्ण हिन्दी ‘प्रभु’ से व्यक्त किया गया है।
- source_word: ἐξιλασμός
  choice: प्रायश्चित
  rationale: यह शब्द दोष या पाप के निवारण और मेल-मिलाप से जुड़ा है। ‘प्रायश्चित’ हिन्दी बाइबलीय प्रयोग में सुलभ है, यद्यपि इसका अर्थक्षेत्र यूनानी शब्द से पूरी तरह समान नहीं है।
- source_word: τοῖς ἐπιστρέφουσιν
  choice: जो ... लौटते हैं उनके लिए
  rationale: ἐπιστρέφω यहाँ धार्मिक अर्थ में परमेश्वर की ओर फिरने या लौटने को दर्शाता है; ‘लौटते हैं’ पश्चाताप की दिशा को बनाए रखता है।
- source_word: ἐπʼ αὐτόν
  choice: उसकी ओर
  rationale: ἐπιστρέφω के साथ यह वाक्यांश किसी की ओर मुड़ने या लौटने का लक्ष्य बताता है।
theological_decisions:
- issue: ἐξιλασμός का अनुवाद
  choice: प्रायश्चित
  alternative: पाप-निवारण; मेल कराने वाला उपाय
  rationale: ‘प्रायश्चित’ पाप या दोष के निवारण और मेल-मिलाप की व्यापक धारणा को संक्षेप में रखता है, बिना यह तय किए कि यहाँ कोई एक विशिष्ट प्रायश्चित-सिद्धांत अभिप्रेत है। परमेश्वर की ओर लौटने वालों के लिए इसकी उपलब्धता को मूल पाठ के अनुसार खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और विस्मयवाचक शैली। ‘उसकी’ का निकटतम संदर्भ ‘प्रभु’ है। मुख्य वाक्य में ‘भी’ जोड़कर समन्वित दूसरे संज्ञा-पद और पूरे विस्मय के स्वाभाविक हिन्दी प्रवाह को स्पष्ट किया गया है।
