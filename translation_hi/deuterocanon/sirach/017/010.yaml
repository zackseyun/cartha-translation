lexical_decisions:
- source_word: προσέθηκεν
  choice: भी दिया
  rationale: क्रिया का मूल अर्थ ‘जोड़ना’ है। यहाँ ‘भी दिया’ पहले दिए गए वरदानों के अतिरिक्त ज्ञान दिए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιστήμην
  choice: ज्ञान
  rationale: यह व्यापक बौद्धिक और नैतिक ज्ञान को सूचित कर सकता है; ‘ज्ञान’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: νόμον ζωῆς
  choice: जीवन की व्यवस्था
  rationale: यह चयन यूनानी संबंधकारक रचना ‘जीवन की व्यवस्था/विधि’ को बनाए रखता है और उसे मुख्य पाठ में व्याख्यात्मक रूप से ‘जीवन देने वाली’ नहीं बनाता।
- source_word: ἐκληροδότησεν
  choice: विरासत में दी
  rationale: यह क्रिया विरासत के रूप में सौंपने या प्रदान करने का भाव रखती है; यह हिन्दी में स्वाभाविक है और केवल सामान्य ‘दिया’ की अपेक्षा मूल शब्द की विशेषता बचाती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: दोनों उपवाक्यों में दोहराए गए संप्रदान कारक को हिन्दी में भी बनाए रखा गया है, जिससे पाने वालों पर यूनानी पाठ का बल सुरक्षित रहता है।
theological_decisions:
- issue: νόμον ζωῆς को संबंधकारक रूप में रखा जाए या फलसूचक अर्थ में खोला जाए
  choice: जीवन की व्यवस्था
  alternative: जीवन देने वाली व्यवस्था
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘जीवन की व्यवस्था’ है। मुख्य पाठ संबंध की वास्तविक अस्पष्टता बनाए रखता है; संभावित फलसूचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘विरासत में दी’ मूल क्रिया की विरासत-संबंधी छाया को स्पष्ट करती है, जबकि ‘जीवन की व्यवस्था’ जानबूझकर मूल की अर्थगत व्यापकता बनाए रखती है।
