  yaml_path: translation/deuterocanon/sirach/017/022.yaml
  text: Return to the Most High and turn away from unrighteousness[c][b][a], and hate what is abominable intensely.
translation:
  language: hi
  text: परमप्रधान की ओर लौट आओ और अधर्म से मुँह मोड़ लो,[a][b][c] और घृणित वस्तु से बहुत घृणा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लौट आओ’ का अनुवाद ‘फिरो’ भी किया जा सकता है; यूनानी क्रिया परमप्रधान की ओर नए सिरे से उन्मुख होने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: ‘अधर्म’ के लिए ‘अन्याय’, ‘बुराई’ या ‘गलत काम’ भी संभव हैं; यूनानी शब्द का अर्थ व्यापक नैतिक बुराई से लेकर विशेष अन्याय तक हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह अनुवाद इस खंड में उपलब्ध यूनानी पाठ का निकटता से अनुसरण करता है; पद की पाठ-परंपरा में असंगति दर्ज की गई है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπάναγε
  choice: लौट आओ
  rationale: आज्ञार्थक क्रिया परमेश्वर की ओर फिर आने और नए सिरे से उन्मुख होने का आह्वान करती है; ‘लौट आओ’ आधुनिक हिन्दी में स्वाभाविक है और पश्चात्ताप का भाव बनाए रखती है।
- source_word: ἐπὶ Ὕψιστον
  choice: परमप्रधान की ओर
  rationale: ἐπί यहाँ दिशा व्यक्त करता है; ‘की ओर’ इस गतिशीलता को स्पष्ट रखता है, और ‘परमप्रधान’ Ὕψιστος को ईश्वरीय उपाधि के रूप में प्रस्तुत करता है।
- source_word: ἀπόστρεφε
  choice: मुँह मोड़ लो
  rationale: वर्तमान आज्ञार्थक नैतिक दिशा-परिवर्तन का आदेश देता है। ‘मुँह मोड़ लो’ केवल बचने की तुलना में अधिक सक्रिय और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ἀπὸ ἀδικίας
  choice: अधर्म से
  rationale: ἀδικία अन्याय, गलत काम या व्यापक नैतिक बुराई को सूचित कर सकता है। परमेश्वर की ओर लौटने के इस ज्ञान-साहित्यिक संदर्भ में ‘अधर्म’ इसके व्यापक नैतिक-धार्मिक अर्थ को संक्षेप में बनाए रखता है।
- source_word: σφόδρα
  choice: बहुत
  rationale: यह क्रियाविशेषण आदेश की तीव्रता बढ़ाता है। ‘बहुत’ साधारण आधुनिक हिन्दी में स्पष्ट और जोरदार है, जबकि अधिक कृत्रिम शब्दावली से बचता है।
- source_word: μίσησον
  choice: घृणा करो
  rationale: मूल क्रिया प्रबल है; ‘घृणा करो’ उसकी नैतिक तीव्रता को नरम किए बिना गरिमापूर्ण हिन्दी देती है।
- source_word: βδέλυγμα
  choice: घिनौनी बात
  rationale: यह किसी घृणित या वीभत्स नैतिक वस्तु/बात को सूचित करता है। ‘घिनौनी बात’ आधुनिक पाठक के लिए स्वाभाविक है और मूल की अनिर्दिष्टता बनाए रखती है; संदर्भ इसे किसी एक खास कर्म तक सीमित नहीं करता।
theological_decisions:
- issue: ज्ञान-साहित्य के उपदेश में ἀδικία का अनुवाद
  choice: अधर्म
  alternative: अन्याय; बुराई; गलत काम
  rationale: परमप्रधान की ओर लौटने के समानांतर यह व्यापक नैतिक विमुखता की माँग करता है। ‘अधर्म’ केवल सामाजिक अन्याय तक अर्थ को सीमित नहीं करता, फिर भी वैकल्पिक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: βδέλυγμα की प्रबलता और विस्तार
  choice: घिनौनी बात
  alternative: घृणित वस्तु; घृणित काम; घिनौनी वस्तु
  rationale: मूल संज्ञा अत्यंत नकारात्मक है, पर यह पद स्वयं किसी विशिष्ट धार्मिक या अनुष्ठानिक श्रेणी को नाम नहीं देता। चुना हुआ रूप उसकी तीव्रता और व्यापकता दोनों बनाए रखता है।
- issue: परमेश्वर की ओर लौटने की भाषा
  choice: परमप्रधान की ओर लौट आओ
  alternative: परमप्रधान के पास लौट आओ; परमप्रधान की ओर फिरो
  rationale: यह दिशा और पश्चात्ताप दोनों का भाव रखता है, बिना यह तय किए कि क्रिया केवल स्थानिक वापसी है या पूरी तरह तकनीकी धार्मिक पद।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण आज्ञार्थक शैली। ‘परमप्रधान’ पारंपरिक और सुबोध ईश्वरीय उपाधि है। समानांतर क्रियाओं—‘लौट आओ’ और ‘मुँह मोड़ लो’—से मूल का नैतिक दिशा-परिवर्तन स्पष्ट रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में क्रमवार रखे गए हैं।
