    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: छिपे नहीं रहे
  rationale: यूनानी का निष्क्रिय रूप अधिक शाब्दिक रूप से ‘छिपे नहीं रहे’ है। यह उन कामों के परमेश्वर के सामने प्रकट होने की छवि बनाए रखता है।
- source_word: αἱ ἀδικίαι
  choice: उनके अन्याय के काम
  rationale: ἀδικίαι अन्याय अथवा अनुचित कामों को दर्शाता है। ‘अन्याय के काम’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल अमूर्त गुण के रूप में नहीं प्रस्तुत करता।
- source_word: ἀπ᾿ αὐτοῦ
  choice: उससे
  rationale: ἀπό के साथ संबंधकारक का सीधा अर्थ ‘से’ है; ‘उससे छिपे’ हिन्दी में परमेश्वर की जानकारी से छिपे होने का स्वाभाविक भाव देता है।
- source_word: πᾶσα ἁμαρτία
  choice: हर पाप
  rationale: वितरणसूचक एकवचन प्रत्येक पाप पर बल देता है; इसलिए ‘हर पाप’ चुना गया है।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: ἔναντι का अर्थ ‘सामने’ अथवा ‘उपस्थिति में’ है। ‘प्रभु के सामने’ संक्षिप्त, स्वाभाविक और मूल की छवि के निकट है।
theological_decisions:
- issue: मनुष्य के पापों का परमेश्वर से प्रकट होना और इससे निहित सर्वज्ञता
  choice: अन्याय के काम उससे छिपे नहीं रहे और हर पाप प्रभु के सामने था
  alternative: उनका कोई पाप प्रभु की दृष्टि से नहीं बचा
  rationale: मूल यूनानी परमेश्वर के सामने पापों के प्रकट होने की बात करता है, पर इसे विस्तृत धर्मसैद्धांतिक कथन में नहीं बदलता। चुना हुआ पाठ इसी छवि और उसके धार्मिक भार को बनाए रखता है।
- issue: αὐτοῦ और Κυρίου के संदर्भ की निरंतरता
  choice: पहले ‘उससे’ और फिर ‘प्रभु’
  alternative: दोनों स्थानों पर ‘प्रभु’
  rationale: यूनानी में पहले सर्वनाम और फिर स्पष्ट पद Κυρίου है। हिन्दी में इसे बनाए रखने से मूल की संदर्भगत प्रगति सुरक्षित रहती है, बिना सर्वनाम की पहचान को अनावश्यक रूप से दोहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘अन्याय के काम’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘अधर्म’ या ‘अधार्मिकता’ जैसे अधिक धर्मशास्त्रीय और संभावित रूप से अमूर्त शब्दों से बचा गया है।
