  text: प्रभु की ओर लौट आओ और पापों को छोड़ दो; उसके सम्मुख विनती करो[a] और ठोकर का कारण घटाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुख के सामने विनती करो”; यह प्रभु की उपस्थिति में सीधे उसके पास आने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “ठोकर घटाओ,” “बाधा कम करो,” या “ठोकर खाने का अवसर कम करो” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: लौट आओ
  rationale: यह ἐπιστρέφω का आज्ञार्थक रूप है और प्रभु की ओर फिरने या लौटने की दिशा व्यक्त करता है; ‘पश्चाताप करो’ की अपेक्षा यह मूल क्रिया की गतिशील छवि को बनाए रखता है।
- source_word: ἐπὶ Κύριον
  choice: प्रभु की ओर
  rationale: ἐπί + कर्मकारक दिशा को दर्शाता है। ‘प्रभु की ओर’ हिन्दी में स्वाभाविक है और यूनानी की दिशात्मकता को स्पष्ट रखता है।
- source_word: ἀπόλειπε
  choice: छोड़ दो
  rationale: आज्ञार्थक क्रिया निर्णायक रूप से अलग हो जाने का भाव देती है। ‘छोड़ दो’ आधुनिक और सहज हिन्दी है।
- source_word: ἁμαρτίας
  choice: पापों को
  rationale: मूल में बहुवचन है, इसलिए ‘पापों’ के रूप में संख्या सुरक्षित रखी गई है।
- source_word: δεήθητι
  choice: विनती करो
  rationale: δέομαι यहाँ प्रार्थनापूर्ण याचना का अर्थ देता है। ‘विनती करो’ केवल सामान्य प्रार्थना की तुलना में निवेदन के विशिष्ट भाव को अधिक निकटता से व्यक्त करता है।
- source_word: κατὰ πρόσωπον
  choice: उसके सम्मुख
  rationale: शाब्दिक अर्थ ‘मुख के सामने’ है, पर यह किसी की उपस्थिति में सीधे आने का मुहावरा है। ‘उसके’ का संकेत निकटवर्ती ‘प्रभु’ से लिया गया है।
- source_word: σμίκρυνον
  choice: घटाओ
  rationale: क्रिया का अर्थ छोटा करना या कम करना है; ‘घटाओ’ संक्षिप्त और स्वाभाविक आज्ञार्थक रूप है।
- source_word: πρόσκομμα
  choice: ठोकर का कारण
  rationale: शब्द बाधा, ठोकर या नैतिक पतन के कारण को सूचित कर सकता है। ‘ठोकर का कारण’ अस्पष्ट नैतिक आशय को बनाए रखते हुए हिन्दी में समझने योग्य है।
theological_decisions:
- issue: κατὰ πρόσωπον में किसी सर्वनाम का स्पष्ट न होना
  choice: ‘उसके सम्मुख’—‘उसके’ को पहले आए ‘प्रभु’ से संबद्ध किया गया।
  alternative: ‘मुख के सामने’ या ‘उसकी उपस्थिति में’
  rationale: स्रोत का मुहावरा हिन्दी में बिना संबद्ध व्यक्ति के अधूरा लगेगा। निकटवर्ती ‘प्रभु’ को संदर्भ मानना नया धार्मिक दावा नहीं जोड़ता और प्रत्यक्ष उपस्थिति का भाव सुरक्षित रखता है।
- issue: πρόσκομμα का नैतिक आशय
  choice: ‘ठोकर का कारण’
  alternative: ‘ठोकर’ या ‘बाधा’
  rationale: शब्द किसी बाधा, अपराध के अवसर, या नैतिक रूप से गिराने वाली वस्तु की ओर संकेत कर सकता है। चुना हुआ रूप इनमें से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण आज्ञार्थक शैली में रखी गई है। ‘प्रभु’ स्थापित धार्मिक पद है; ‘विनती करो’ याचक प्रार्थना का भाव देता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
