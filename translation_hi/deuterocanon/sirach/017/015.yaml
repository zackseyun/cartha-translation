  text: For each nation he appointed a ruler[a], and Israel is the Lord’s own portion.
translation:
  language: hi
  text: प्रत्येक राष्ट्र के लिए उसने एक शासक नियुक्त किया, और इस्राएल प्रभु का भाग है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: हर जाति के लिए
  rationale: वितरणसूचक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ ἔθνος विभिन्न जातियों या राष्ट्रों के व्यापक अर्थ में है।
- source_word: κατέστησεν
  choice: ठहराया
  rationale: किसी को अधिकार के पद पर नियुक्त करने का भाव सुरक्षित रहता है और बाइबिलीय प्रसंग में स्वाभाविक है।
- source_word: ἡγούμενον
  choice: एक शासक
  rationale: यह नेतृत्व या शासन करनेवाले व्यक्ति को दर्शाता है; 'शासक' शासन-संबंधी भाव को स्पष्ट रखता है।
- source_word: μερὶς
  choice: भाग
  rationale: हिस्से या आवंटित अंश का मूल रूपक सुरक्षित रखता है; 'विरासत' कहने से मूल में निहित अर्थ से अधिक विशेष अर्थ जुड़ सकता था।
- source_word: Κυρίου
  choice: प्रभु का
  rationale: सम्बन्धकारक स्वामित्व को स्वाभाविक हिन्दी में व्यक्त करता है और κύριος के लिए मानक बाइबिलीय पद है।
- source_word: Ἰσραήλ
  choice: इस्राएल
  rationale: व्यक्ति-समुदाय के नाम का प्रचलित हिन्दी बाइबिलीय रूप।
- source_word: ἐστιν
  choice: है
  rationale: सरल वर्तमानकालीन संयोजक क्रिया का सीधा अनुवाद।
theological_decisions:
- issue: जातियों और इस्राएल के बीच सम्बन्ध या विरोध
  choice: '''और'' द्वारा दोनों उपवाक्यों को जोड़ा गया'
  alternative: '''परन्तु इस्राएल प्रभु का अपना भाग है'''
  rationale: यूनानी καί का प्रत्यक्ष अर्थ 'और' है। प्रसंग में विरोधाभास का संकेत सम्भव है, पर उसे 'परन्तु' या मूल में अनुपस्थित 'अपना' जोड़कर स्पष्ट करना वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: इस्राएल को प्रभु का 'भाग' कहना
  choice: रूपक को 'प्रभु का भाग' के रूप में बनाए रखा गया
  alternative: प्रभु की विरासत / प्रभु की अपनी प्रजा
  rationale: मेरिस (μερὶς) आवंटित हिस्से या भाग की छवि रखता है। अधिक व्याख्यात्मक विकल्प स्वामित्व और वाचा की सम्भावित ध्वनि तो स्पष्ट करते, पर मूल रूपक को सीमित कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबिलीय गद्य। 'जाति' यहाँ जाति-व्यवस्था के सामाजिक वर्ग के अर्थ में नहीं, बल्कि जनसमुदाय या राष्ट्र के अर्थ में प्रयुक्त है। मूल यूनानी के समन्वयी 'और' तथा संक्षिप्त भाग-रूपक को सुरक्षित रखा गया है।
