translation:
  language: hi
  text: और उसने सभी जीवित प्राणियों में मनुष्य का भय बैठा दिया, और उसे पशुओं और पक्षियों पर शासन करने का अधिकार दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν
  choice: बैठा दिया
  rationale: τίθημι का मूल अर्थ ‘रखना’ है, पर भय के साथ आधुनिक हिन्दी में ‘भय बैठा देना’ स्वाभाविक और ठोस मुहावरा है।
- source_word: τὸν φόβον αὐτοῦ
  choice: उसका भय
  rationale: यूनानी एकवचन संबंधवाचक सर्वनाम को बनाए रखा गया है। प्रसंग में यह प्रतिनिधि मनुष्य से संबंधित है; अनुवाद अनावश्यक रूप से उसके संदर्भ को स्पष्ट नहीं करता।
- source_word: ἐπὶ πάσης σαρκός
  choice: सब प्राणियों में
  rationale: शाब्दिक अर्थ ‘समस्त देह पर’ है, पर यहाँ σάρξ व्यापक रूप से जीवित प्राणियों के लिए प्रयुक्त है। हिन्दी में भय ‘प्राणियों में बैठना’ स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: κατακυριεύειν
  choice: शासन करने का अधिकार दिया
  rationale: यह क्रिया किसी पर अधिकारपूर्वक शासन करने का भाव रखती है। यूनानी क्रियार्थक संज्ञा के आशय को सुबोध हिन्दी में व्यक्त करने के लिए ‘अधिकार दिया’ की पूर्ति की गई है।
- source_word: θηρίων
  choice: पशुओं
  rationale: θηρία यहाँ पशु-जगत के प्राणियों को दर्शाता है। ‘पशु’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज है।
- source_word: πετεινῶν
  choice: पक्षियों
  rationale: πετεινά का सामान्य और स्वाभाविक हिन्दी समतुल्य ‘पक्षी’ है; ‘आकाश के पक्षी’ कहना स्रोत में अनुपस्थित शब्द जोड़ता।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: एकवचन ‘उसका’ बनाए रखना
  alternative: ‘मनुष्य का भय’ कहकर संदर्भ स्पष्ट करना, अथवा सामूहिक अर्थ के लिए ‘उनका’ कहना
  rationale: यूनानी पाठ एकवचन रखता है और प्रसंग में प्रतिनिधि मनुष्य की ओर संकेत करता है। ‘उसका’ मूल की व्याकरणिक बनावट और संदर्भगत हल्की अस्पष्टता दोनों बचाता है।
- issue: κατακυριεύειν के निहित कर्ता और अधिकार का भाव
  choice: ‘उसे … शासन करने का अधिकार दिया’
  alternative: अधिक शाब्दिक किंतु हिन्दी में खंडित ‘और पशुओं और पक्षियों पर शासन करना’
  rationale: यूनानी में क्रियार्थक संज्ञा का कर्ता अलग से व्यक्त नहीं है, पर प्रसंग में वही प्रतिनिधि मनुष्य निहित है। हिन्दी वाक्य पूरा करने के लिए ‘उसे’ और अधिकार दिए जाने का भाव व्यक्त किया गया है, बिना प्रभुत्व की धार्मिक व्याख्या बढ़ाए।
- issue: πάσης σαρκός में σάρξ
  choice: मुख्य पाठ में ‘सब प्राणियों’, पादटिप्पणी में ‘समस्त देह’
  alternative: मुख्य पाठ में ‘समस्त देह’ या ‘सब देहधारियों’
  rationale: यहाँ σάρξ नैतिक या पौलुसी अर्थ में नहीं, बल्कि जीवित प्राणियों के सामूहिक संकेत के रूप में है। अर्थ को सहज रखा गया है और स्रोत का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय बैठा दिया’ स्वाभाविक हिन्दी मुहावरा है, जबकि ‘शासन करने का अधिकार दिया’ यूनानी अधिकारसूचक क्रिया का बल स्पष्ट करता है।
