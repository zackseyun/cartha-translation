  yaml_path: translation/deuterocanon/sirach/017/028.yaml
  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: hi
  text: मरे हुए व्यक्ति से—मानो वह अस्तित्व में ही न हो—स्तुति[a] मिट जाती है; पर जो जीवित और स्वस्थ है, वह प्रभु की स्तुति करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद।” यूनानी शब्द का अर्थ “अंगीकार” भी हो सकता है, पर “वह प्रभु की स्तुति करेगा” के समानांतर यहाँ स्तुति या धन्यवाद का अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: मरे हुए व्यक्ति से
  rationale: एकवचन का प्रयोग सामान्य अर्थ में है और उस व्यक्ति को सूचित करता है जिससे मृत्यु के बाद स्तुति नहीं आती। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὡς μηδὲ ὄντος
  choice: मानो वह अस्तित्व में ही न हो
  rationale: यह तुलना मृत व्यक्ति की दशा को प्रबल रूप में व्यक्त करती है। ‘मानो’ यूनानी ὡς के तुलनात्मक बल को बनाए रखता है और इसे निरपेक्ष तत्त्वमीमांसात्मक कथन बनने से रोकता है।
- source_word: ἀπόλλυται
  choice: मिट जाती है
  rationale: क्रिया के नष्ट हो जाने या समाप्त हो जाने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ अभिप्राय है कि मृत व्यक्ति की ओर से स्तुति का स्वर समाप्त हो जाता है।
- source_word: ἐξομολόγησις
  choice: स्तुति
  rationale: यद्यपि शब्द का अर्थ अंगीकार या धन्यवाद भी हो सकता है, अगले खंड के αἰνέσει (‘स्तुति करेगा’) के साथ समानांतरता यहाँ प्रशंसापूर्ण धन्यवाद या स्तुति के अर्थ का समर्थन करती है।
- source_word: ζῶν καὶ ὑγιὴς
  choice: जो जीवित और स्वस्थ है
  rationale: दोनों विशेषताओं को सीधे सुरक्षित रखते हुए मृत व्यक्ति के साथ स्पष्ट विरोध प्रस्तुत करता है।
- source_word: αἰνέσει
  choice: स्तुति करेगा
  rationale: यूनानी भविष्यकाल को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त करता है और कथन की सूक्तिपरक प्रकृति बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यह यहूदी ज्ञान-साहित्य के संदर्भ में परमेश्वर को सूचित करता है; ‘प्रभु’ आधुनिक हिन्दी बाइबिलीय भाषा में dignified और परिचित पद है।
theological_decisions:
- issue: ἐξομολόγησις का अर्थ ‘अंगीकार’, ‘धन्यवाद’ या ‘स्तुति’
  choice: स्तुति
  alternative: अंगीकार; धन्यवाद
  rationale: αἰνέσει τὸν κύριον के साथ काव्यात्मक समानांतरता ‘स्तुति’ को प्रमुख अर्थ बनाती है। इससे अनावश्यक रूप से पाप-अंगीकार का भाव नहीं जोड़ा जाता, जबकि शब्द की व्यापक अर्थ-सीमा को निर्णय-विवरण में स्वीकार किया गया है।
- issue: ὡς μηδὲ ὄντος को मृतक के अस्तित्व के बारे में निरपेक्ष कथन मानना
  choice: 'तुलनात्मक भाषा: ‘मानो वह अस्तित्व में ही न हो’'
  alternative: ‘जो अब अस्तित्व में नहीं है’
  rationale: ὡς का ‘मानो’ अर्थ सुरक्षित रखने से पद की अलंकारिक तीव्रता बनी रहती है और मृत्यु-पश्चात अस्तित्व के विषय में स्रोत से अधिक निश्चित निष्कर्ष नहीं निकाला जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। यूनानी वाक्य की तीखी तुलना और दोनों खंडों का विरोध सुरक्षित है। ‘मिट जाती है’ सामान्य पाठक के लिए ‘नष्ट हो जाती है’ से अधिक स्वाभाविक है, जबकि अर्थ की गंभीरता बनी रहती है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ और निर्णय-विवरण वास्तविक अर्थ-सीमा को पर्याप्त रूप से संभालते हैं।
