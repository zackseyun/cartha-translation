lexical_decisions:
- source_word: διαβούλιον
  choice: विचार-विमर्श की क्षमता
  rationale: यह संज्ञा सोच-समझकर विचार या निर्णय करने की क्षमता को सूचित करती है। केवल ‘परामर्श’ कहने से बाहरी सलाह का अर्थ प्रमुख हो सकता है, इसलिए क्षमता को स्पष्ट किया गया है।
- source_word: γλῶσσαν
  choice: जीभ
  rationale: यूनानी में शारीरिक अंग का नाम है, जो वाणी की क्षमता की ओर भी संकेत करता है। ठोस अंगों की सूची बनाए रखने के लिए ‘जीभ’ रखा गया है।
- source_word: ὀφθαλμούς
  choice: आँखें
  rationale: बहुवचन ठोस संज्ञा को ज्यों का त्यों रखा गया है; ‘दृष्टि’ करने पर अंग के स्थान पर उसकी क्रिया आ जाती।
- source_word: ὦτα
  choice: कान
  rationale: स्रोत की ठोस शारीरिक सूची को बनाए रखता है; ‘श्रवण-शक्ति’ अनावश्यक रूप से अमूर्त होता।
- source_word: καρδίαν
  choice: हृदय
  rationale: बाइबलीय प्रयोग में हृदय विचार और इच्छा का भी आंतरिक केंद्र है। ‘मन’ कहने के बजाय ‘हृदय’ स्रोत की अवधारणा और उसके तनाव को सुरक्षित रखता है।
- source_word: ἔδωκεν
  choice: दिया
  rationale: सरल भूतकालीन क्रिया यूनानी का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: διανοεῖσθαι
  choice: सोचने के लिए
  rationale: अनंत क्रिया मानसिक क्रिया तथा दिए गए वरदान के प्रयोजन को व्यक्त करती है। ‘सोचने के लिए’ आधुनिक हिन्दी में स्पष्ट और सहज है, जबकि ‘तर्क करने’ से अर्थ अनावश्यक रूप से संकुचित हो सकता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी रूप है और ‘दिया’ के साथ स्रोत की संरचना को स्पष्ट करता है।
theological_decisions:
- issue: मानवीय क्षमताओं की सूची में καρδία का अर्थ
  choice: ‘हृदय’ को बनाए रखा और ‘सोचने के लिए’ से उसके बौद्धिक कार्य को स्पष्ट किया।
  alternative: ‘मन’ या ‘बुद्धि’
  rationale: यह पद उस बाइबलीय मानव-विज्ञान को दर्शाता है जिसमें हृदय केवल भावनाओं का स्थान नहीं, बल्कि विचार और इच्छा का भी केंद्र है। ‘हृदय’ इस व्यापक अर्थ को किसी आधुनिक मनोवैज्ञानिक श्रेणी में सीमित नहीं करता।
- issue: ठोस अंगों और अमूर्त क्षमता की मिश्रित सूची
  choice: ‘जीभ’, ‘आँखें’, ‘कान’ और ‘हृदय’ जैसे ठोस शब्दों के साथ ‘विचार-विमर्श की क्षमता’ रखा।
  alternative: पूरी सूची को ‘वाणी, दृष्टि, श्रवण और बुद्धि’ जैसी अमूर्त क्षमताओं में बदलना
  rationale: यूनानी पाठ स्वयं ठोस अंगों और मानसिक क्षमता को एक साथ रखता है। उसी मिश्रित रूप को बनाए रखना स्रोत के अधिक निकट है और व्याख्यात्मक समानीकरण से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। स्रोत की संक्षिप्त सूची और ‘हृदय’ की बाइबलीय वैचारिक व्यापकता सुरक्षित है; ‘विचार-विमर्श की क्षमता’ से διαβούλιον को बाहरी सलाह मात्र समझने की संभावना घटती है।
