  text: He filled them with the knowledge of understanding[a], and showed them good and evil.
translation:
  language: hi
  text: उसने उन्हें समझ-बूझ के ज्ञान से भर दिया और उन्हें भला और बुरा दिखाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अच्छी और बुरी चीज़ें।’ यूनानी शब्द नैतिक भले-बुरे के साथ-साथ लाभदायक और हानिकारक चीज़ों को भी सूचित कर सकते हैं; प्रसंग में नैतिक पहचान का भाव अधिक प्रबल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: समझ-बूझ का ज्ञान
  rationale: ἐπιστήμην मुख्य संज्ञा है और συνέσεως उसका संबंधसूचक विशेषण है। यह अभिव्यक्ति दोनों को अलग-अलग वरदान बनाने के बजाय समझ से युक्त ज्ञान का भाव बनाए रखती है।
- source_word: ἐνέπλησεν
  choice: से भर दिया
  rationale: क्रिया का मूल अर्थ ‘भर देना’ है; ‘से भर दिया’ आधुनिक हिन्दी में इसके कर्म और विषय को स्वाभाविक रूप से जोड़ता है।
- source_word: αὐτούς / αὐτοῖς
  choice: उन्हें
  rationale: दोनों सर्वनाम प्रसंग में पहले उल्लिखित मनुष्यों की ओर संकेत करते हैं; हिन्दी में प्रत्यक्ष और अप्रत्यक्ष कर्म, दोनों के लिए ‘उन्हें’ स्वाभाविक है।
- source_word: ἀγαθὰ καὶ κακὰ
  choice: भला और बुरा
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं। ‘भला और बुरा’ नैतिक अर्थ को प्रमुख रखता है, पर टिप्पणी में लाभदायक और हानिकारक वस्तुओं की संभावित अर्थ-छाया भी सुरक्षित है।
- source_word: ὑπέδειξεν
  choice: दिखाया
  rationale: यह क्रिया ‘दिखाना’, ‘संकेत करना’ या ‘अवगत कराना’ व्यक्त कर सकती है। ‘दिखाया’ मूल रूपक और कथन की संक्षिप्तता को बनाए रखता है।
theological_decisions:
- issue: ἀγαθὰ καὶ κακὰ को नैतिक श्रेणियों के रूप में समझा जाए या लाभदायक और हानिकारक चीज़ों के रूप में
  choice: मुख्य पाठ में ‘भला और बुरा’
  alternative: ‘अच्छी और बुरी चीज़ें’ अथवा ‘लाभदायक और हानिकारक चीज़ें’
  rationale: प्रसंग परमेश्वर द्वारा मनुष्यों को दी गई बौद्धिक और नैतिक क्षमता का वर्णन करता है, इसलिए नैतिक विवेक का अर्थ अधिक प्रबल है। फिर भी यूनानी पदों की व्यापक अर्थ-सीमा को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समझ-बूझ’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘ज्ञान से भर दिया’ यूनानी वाक्य-रचना और उसके धार्मिक भार को बनाए रखता है।
