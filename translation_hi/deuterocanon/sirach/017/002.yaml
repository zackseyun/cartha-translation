translation:
  language: hi
  text: उसने उन्हें दिनों की एक निश्चित संख्या और एक नियत समय दिया,[a] और उन्हें उस पर की वस्तुओं पर अधिकार दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक निर्धारित समय।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस पर की वस्तुओं”; “उस” संभवतः पिछले पद में उल्लिखित पृथ्वी की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: गिनती के दिन
  rationale: यह पदबंध मनुष्य के दिनों की गिनी हुई, सीमित संख्या व्यक्त करता है। ‘गिनती के दिन’ यूनानी संरचना के निकट रहते हुए स्वाभाविक और संक्षिप्त है।
- source_word: καιρόν
  choice: एक ठहराया हुआ समय
  rationale: यहाँ καιρός सामान्य या अमूर्त समय नहीं, बल्कि निर्धारित अथवा नियत अवधि का बोध कराता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: ἐξουσία यहाँ केवल सामर्थ्य नहीं, बल्कि प्रदान किया गया शासनाधिकार या हक व्यक्त करता है; ‘अधिकार’ इसे बिना अतिशयोक्ति के सुरक्षित रखता है।
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: उस पर की वस्तुओं पर
  rationale: यह अनुवाद यूनानी के स्त्रीलिंग सर्वनाम और उसके संक्षिप्त, संदर्भ-निर्भर संकेत को बनाए रखता है। ‘उस’ का संभावित संदर्भ पिछले पद में आई पृथ्वी है।
theological_decisions:
- issue: ἐξουσίαν τῶν ἐπ᾿ αὐτῆς में मानव अधिकार का दायरा
  choice: मनुष्यों को उस पर की वस्तुओं पर अधिकार दिया गया
  alternative: मनुष्यों को स्वयं पृथ्वी पर अधिकार दिया गया
  rationale: यूनानी पाठ अधिकार के विषय के रूप में ‘उस पर की वस्तुओं’ को रखता है, न कि स्पष्ट रूप से स्वयं पृथ्वी को। सर्वनाम को बनाए रखने से सृष्टि-संदर्भ सुरक्षित रहता है और पूर्ण स्वामित्व जैसी बात पाठ में जोड़ी नहीं जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। सीमित जीवनकाल और पृथ्वी पर मानव अधिकार—दोनों विचारों को मूल यूनानी की संक्षिप्तता और संदर्भगत अस्पष्टता सहित रखा गया है।
