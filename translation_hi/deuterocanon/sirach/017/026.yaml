  text: आखिर मनुष्यों में सब कुछ संभव नहीं है, क्योंकि मनुष्य का पुत्र[a] अमर नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मनुष्य अमर नहीं है।” यूनानी में शाब्दिक रूप से “मनुष्य का पुत्र” है; यहाँ यह किसी उपाधि के बजाय नश्वर मनुष्य के लिए प्रयुक्त सामान्य अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: δύναται πάντα εἶναι
  choice: सब कुछ नहीं हो सकता
  rationale: δύναται संभावना या सामर्थ्य व्यक्त करता है और πάντα व्यापक रूप से ‘सब कुछ’ है; यह रचना यूनानी अर्थ को स्वाभाविक हिन्दी में रखती है।
- source_word: ἐν ἀνθρώποις
  choice: मनुष्यों में
  rationale: ἀνθρώποις पूरी मानवजाति के लिए सामान्य शब्द है; ‘मनुष्यों में’ ἐν के मूल स्थान-संबंध को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ἀθάνατος
  choice: अमर
  rationale: ἀθάνατος का सीधा और संक्षिप्त हिन्दी समतुल्य ‘अमर’ है, जो मनुष्य की नश्वरता के निहित विरोध को बनाए रखता है।
- source_word: υἱὸς ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह शब्दशः स्रोत की सामी शैली की अभिव्यक्ति को बनाए रखता है। यहाँ यह किसी उपाधि के रूप में नहीं, बल्कि एक सामान्य नश्वर मनुष्य के अर्थ में प्रयुक्त है; इस बात को पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: υἱὸς ἀνθρώπου को उपाधि माना जाए या सामान्य मनुष्य का उल्लेख
  choice: 'सामान्य मानवीय उल्लेख: ‘मनुष्य का पुत्र’'
  alternative: ‘मनुष्य’ अथवा उपाधि के रूप में ‘मनुष्य का पुत्र’
  rationale: इस ज्ञान-साहित्यिक प्रसंग में पदबंध नश्वर मानव को दर्शाता है। यूनानी में निश्चित उपपद का अभाव और अमर न होने का कथन सामान्य अर्थ का समर्थन करते हैं; अतः इसे मसीहाई उपाधि के रूप में प्रस्तुत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। यूनानी के दो कारणसूचक संयोजकों को ‘क्योंकि’ और ‘चूँकि’ से व्यक्त किया गया है, ताकि संबंध स्पष्ट रहे और हिन्दी में अनावश्यक पुनरावृत्ति न हो।
