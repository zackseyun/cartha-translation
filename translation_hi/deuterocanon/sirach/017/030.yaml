  text: For not everything can be among human beings[a], because a son of man is not immortal.
translation:
  language: hi
  text: क्योंकि मनुष्यों में सब कुछ नहीं हो सकता, इसलिए कि मनुष्य का पुत्र[a] अमर नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘मनुष्य का पुत्र’। यहाँ यह कोई मसीहाई उपाधि नहीं है, बल्कि मरणशील मनुष्य के लिए इब्रानी ढंग की अभिव्यक्ति है।
    reason: शाब्दिक विकल्प और प्रसंगगत अर्थ स्पष्ट करना
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: क्योंकि ... संभव नहीं है
  rationale: δύναται क्षमता या संभावना व्यक्त करता है। हिंदी में ‘संभव नहीं है’ इस सामान्य कथन को स्वाभाविक ढंग से व्यक्त करता है; γάρ को कारणसूचक ‘क्योंकि’ से रखा गया है।
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: मनुष्यों में सब कुछ होना
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। यह अनुवाद उस अस्पष्टता को बनाए रखता है कि मनुष्यों में समस्त गुण या क्षमताएँ विद्यमान नहीं हो सकतीं, और ἐν का निकट अर्थ ‘में’ सुरक्षित रखता है।
- source_word: ἀνθρώποις
  choice: मनुष्यों
  rationale: यहाँ बहुवचन शब्द समस्त मानवजाति के लिए सामान्य अर्थ में प्रयुक्त है, केवल पुरुषों के लिए नहीं।
- source_word: ὅτι
  choice: क्योंकि
  rationale: ὅτι पहले कथन का कारण प्रस्तुत करता है; आधुनिक हिंदी में ‘क्योंकि’ तार्किक संबंध स्पष्ट करता है।
- source_word: οὐκ ἀθάνατος
  choice: अमर नहीं है
  rationale: ἀθάνατος का सीधा अर्थ ‘अमर’ या ‘मृत्यु से रहित’ है; ‘अमर नहीं है’ स्पष्ट और प्रसंगानुकूल है।
- source_word: υἱὸς ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह स्रोत की शाब्दिक, सामी शैली की अभिव्यक्ति को सुरक्षित रखता है। इस प्रसंग में इसका आशय एक मरणशील मनुष्य से है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: υἱὸς ἀνθρώπου को मुहावरेदार रूप में रखा जाए या शाब्दिक रूप में
  choice: मनुष्य का पुत्र
  alternative: मनुष्य; मरणशील मनुष्य
  rationale: इस प्रसंग में यह मसीहाई उपाधि नहीं, बल्कि सामान्य मरणशील मानव के लिए सामी शैली की अभिव्यक्ति है। स्रोत की बनावट और संभावित पाठकीय तनाव को बनाए रखने के लिए शाब्दिक रूप मुख्य पाठ में रखा गया है और आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। यूनानी की संक्षिप्तता तथा ‘मनुष्यों में सब कुछ होना’ की वास्तविक अस्पष्टता को अनावश्यक व्याख्या जोड़कर नहीं सुलझाया गया।
