revisions:
- from: मरे हुए व्यक्ति से—मानो वह अस्तित्व में ही न हो—धन्यवाद[a] लुप्त हो जाता है; पर जो जीवित और स्वस्थ है, वह प्रभु की स्तुति करेगा।
  to: मरे हुए व्यक्ति की ओर से—मानो वह अस्तित्व में ही न हो—धन्यवाद नष्ट हो जाता है; पर जो जीवित और स्वस्थ है, वह प्रभु की स्तुति करेगा।
  rationale: The revision makes the first clause more idiomatic in modern standard Hindi while preserving the Greek source relation and its rhetorical comparison. It also uses “नष्ट हो जाता है” for the explicit force of ἀπόλλυται and clarifies the lexical-alternative footnote. No doctrinal claim about postmortem existence is added or resolved.
