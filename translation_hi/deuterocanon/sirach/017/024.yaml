base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/024.yaml
  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: hi
  text: मरे हुए व्यक्ति की ओर से—मानो वह अस्तित्व में ही न हो—धन्यवाद नष्ट हो जाता है; पर जो जीवित और स्वस्थ है, वह प्रभु की स्तुति करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: मरे हुए व्यक्ति से
  rationale: ἀπό के साथ संबंधकारक यहाँ स्रोत को व्यक्त करता है। एकवचन νεκροῦ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्तिगत रूप से रखा गया है।
- source_word: ὡς μηδὲ ὄντος
  choice: मानो वह अस्तित्व में ही न हो
  rationale: यह मृत व्यक्ति के विषय में एक प्रभावशाली आलंकारिक तुलना है। ‘मानो’ तुलना को स्पष्ट रखता है और इसे मृत्यु के बाद के अस्तित्व पर व्यवस्थित दार्शनिक कथन नहीं बनाता।
- source_word: ἀπόλλυται
  choice: लुप्त हो जाता है
  rationale: मध्य/कर्मवाच्य रूप का अर्थ ‘नष्ट होना’ या ‘खो जाना’ हो सकता है। ‘लुप्त हो जाता है’ कथन की सजीवता बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ἐξομολόγησις
  choice: धन्यवाद
  rationale: सप्तति में यह संज्ञा प्रायः परमेश्वर के प्रति कृतज्ञ अंगीकार या धन्यवादपूर्ण स्तुति को दर्शाती है। ‘धन्यवाद’ अगले खंड के αἰνέσει से अर्थगत संबंध रखते हुए दोनों शब्दों का भेद भी बनाए रखता है।
- source_word: ζῶν καὶ ὑγιὴς
  choice: जो जीवित और स्वस्थ है
  rationale: दोनों विशेषण/कृदंत मिलकर व्यक्ति को सूचित करते हैं। यह आधुनिक हिन्दी में सहज है और यूनानी के एकवचन को सुरक्षित रखता है।
- source_word: αἰνέσει
  choice: स्तुति करेगा
  rationale: भविष्यत्कालीन क्रिया को सीधे भविष्यत्काल में रखा गया है; यह पहले खंड के लुप्त होने के विपरीत जीवित व्यक्ति की सक्रिय स्तुति दर्शाती है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यह यहूदी पवित्रशास्त्रीय संदर्भ में κύριος का प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘मानो वह अस्तित्व में ही न हो’ का मृतकों के संबंध में आशय
  choice: इसे जीवन में सक्रिय धन्यवाद देने की असमर्थता को व्यक्त करने वाली आलंकारिक तुलना के रूप में रखा गया है।
  alternative: अधिक अक्षरशः ‘मानो वह है ही नहीं’।
  rationale: पद मृत और जीवित व्यक्ति की इस जीवन में स्तुति करने की क्षमता का विरोध करता है। अनुवाद इसकी तीक्ष्ण भाषा और धर्मवैज्ञानिक तनाव को बचाता है, पर इसे मृत्यु के बाद किसी भी प्रकार के अस्तित्व का स्पष्ट निषेध नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और ज्ञान-साहित्य के अनुरूप रखी गई है। डैश यूनानी तुलना को स्पष्ट करता है, और अर्धविराम दोनों विपरीत खंडों को जोड़ता है।
