lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: महिमामय वैभव
  rationale: यह कठिन यूनानी संयोग महानता और प्रकट महिमा का भाव देता है। ‘महिमामय वैभव’ स्वाभाविक हिन्दी में दोनों पहलुओं को व्यक्त करता है।
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: उनकी आँखों ने
  rationale: मूल में आँखों का स्पष्ट उल्लेख है और यह आगे ‘कान’ के साथ काव्यात्मक समानांतर बनाता है।
- source_word: δόξαν φωνῆς αὐτῶν
  choice: उनकी वाणी की महिमा
  rationale: प्राप्त यूनानी पाठ में αὐτῶν का अर्थ ‘उनकी’ है। मुख्य पाठ मूल की वास्तविक कठिनाई और अस्पष्टता को बिना सुधारे सुरक्षित रखता है। संदर्भानुसार परमेश्वर की वाणी समझने की संभावना पादटिप्पणी में दी गई है।
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: उनके कान ने … सुनी
  rationale: यूनानी में ‘कान’ एकवचन है; हिन्दी में यह रचना संभव और बोधगम्य है तथा मूल की संख्या को सुरक्षित रखती है।
- source_word: δόξα
  choice: महिमा
  rationale: यहाँ शब्द प्रकट गौरव और तेज को सूचित करता है; ‘महिमा’ बाइबलीय और आधुनिक हिन्दी में उपयुक्त है।
theological_decisions:
- issue: ‘वाणी’ के साथ संबंधवाचक सर्वनाम
  choice: मुख्य पाठ में ‘उनकी वाणी’
  alternative: ‘उसकी वाणी’ अथवा स्पष्ट रूप से ‘परमेश्वर की वाणी’
  rationale: Swete के प्राप्त यूनानी पाठ में αὐτῶν (‘उनकी’) है, यद्यपि यह संदर्भ में कठिन प्रतीत होता है। परमेश्वर की ओर संकेत मान लेना संभव है, पर मूल पाठ को चुपचाप बदलने के बजाय उसकी कठिनाई मुख्य अनुवाद में रखी गई और संदर्भगत विकल्प पादटिप्पणी में बताया गया।
