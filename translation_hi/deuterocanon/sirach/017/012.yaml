  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। दृष्टि और श्रवण के समानांतर विन्यास तथा मूल पाठ की कठिन सर्वनाम-संबंधी अस्पष्टता सुरक्षित रखी गई है।
