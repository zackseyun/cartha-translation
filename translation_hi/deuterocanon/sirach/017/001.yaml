lexical_decisions:
- source_word: Κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त यूनानी उपाधि κύριος का मानक, गरिमापूर्ण हिन्दी रूप।
- source_word: ἔκτισεν
  choice: रचा
  rationale: κτίζω के सृष्टि-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल भौतिक रूप से ‘गढ़ने’ का अनावश्यक संकेत नहीं देता।
- source_word: ἐκ γῆς
  choice: मिट्टी से
  rationale: γῆ यहाँ उस धरती/मिट्टी को दर्शाती है जिससे मनुष्य की उत्पत्ति हुई और जिसमें वह लौटता है। ‘मिट्टी’ हिन्दी में सृष्टि और मृत्यु—दोनों संकेतों को सहज रूप से बनाए रखती है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: एकवचन ἄνθρωπον यहाँ समस्त मानवता का प्रतिनिधित्व करता है। ‘मनुष्य’ एकवचन और व्यापक मानव-संदर्भ दोनों को सुरक्षित रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν के पुनः अथवा वापस होने के भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπέστρεψεν
  choice: लौटा दिया
  rationale: सकर्मक यूनानी क्रिया उस कर्तृक क्रिया को व्यक्त करती है जिसमें प्रभु मनुष्य को उसके मूल में वापस पहुँचाता है।
- source_word: εἰς αὐτήν
  choice: उसी में
  rationale: स्त्रीलिंग सर्वनाम αὐτήν का संकेत γῆ की ओर है। ‘उसी में’ इस संदर्भ को स्पष्ट रखता है और εἰς के भीतर लौटने के भाव को व्यक्त करता है।
theological_decisions:
- issue: ἄνθρωπον का मानवशास्त्रीय विस्तार
  choice: एकवचन प्रतिनिधिक अर्थ में ‘मनुष्य’
  alternative: ‘मानवजाति’ या ‘एक मनुष्य’
  rationale: पद एक मानव प्राणी के एकवचन रूप में पूरी मानवता की सृष्टि और नश्वरता की बात करता है। ‘मनुष्य’ इस प्रतिनिधिक एकवचन तथा संभावित आदमिक प्रतिध्वनि को बिना अधिक व्याख्या जोड़े बनाए रखता है।
- issue: γῆ का अर्थ
  choice: दोनों स्थानों पर ‘मिट्टी’ का संदर्भ
  alternative: ‘धरती’
  rationale: संदर्भ मनुष्य के भौतिक उद्गम और मृत्यु पर उसी पदार्थ में लौटने का है। ‘मिट्टी’ इस संबंध को हिन्दी में सजीव रखती है, जबकि मूल की अर्थगत सीमा का उल्लंघन नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘रचा’ सृष्टि-संदर्भ की ऊँचाई बनाए रखता है; ‘मिट्टी’ आरंभ और अंत के बीच मूल पद में उपस्थित समानता को स्पष्ट करता है।
