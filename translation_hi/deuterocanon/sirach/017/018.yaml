base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/018.yaml
  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: hi
  text: पुरुष का दान उसके पास की मुहर के समान है, और वह[a] मनुष्य के उपकार को आँख की पुतली के समान[b] सँभालकर रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ का संकेत किसकी ओर है, यूनानी पाठ में स्पष्ट नहीं है। व्यापक प्रसंग के आधार पर इसका अर्थ ‘परमेश्वर मनुष्य के उपकार को ... सँभालकर रखेगा’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘आँख की पुतली के समान’ अत्यंत सावधानी से सुरक्षित रखने का रूपक है; हिन्दी में ‘आँखों की पुतली की तरह’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: दिया हुआ दान
  rationale: यहाँ शब्द जरूरतमंदों को दया से कुछ देने के ठोस कार्य को दर्शाता है। ‘दिया हुआ दान’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य ‘दया’ की अपेक्षा अधिक विशिष्ट है।
- source_word: ἀνδρός
  choice: पुरुष का
  rationale: यूनानी संज्ञा एकवचन और पुल्लिंग है; इसलिए पहले खंड में उसके व्याकरणिक रूप को बनाए रखा गया है।
- source_word: σφραγίς
  choice: मुहर
  rationale: यह सीधा और सहज हिन्दी पर्याय है तथा मूल्यवान पहचान-चिह्न की उपमा को बिना अधिक विशिष्ट किए बनाए रखता है।
- source_word: μετ᾿ αὐτοῦ
  choice: उसके साथ रहने वाली
  rationale: यह ‘उसके साथ’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता और मुहर को पास रखे जाने की छवि बनाए रखता है।
- source_word: χάριν
  choice: उपकार
  rationale: इस संदर्भ में शब्द किसी व्यक्ति द्वारा किए गए कृपापूर्ण या हितकारी काम को दर्शाता है। ‘उपकार’ इस अर्थ को व्यक्त करता है और ‘अनुग्रह’ से जुड़ा अनावश्यक धर्मवैज्ञानिक अर्थ नहीं लाता।
- source_word: ἀνθρώπου
  choice: मनुष्य के
  rationale: यह ἀνδρός की तुलना में व्यापक मानववाची शब्द है; ‘मनुष्य’ उस भेद को बनाए रखता है।
- source_word: κόρην
  choice: आँख की पुतली
  rationale: यह मूल शारीरिक रूपक का सीधा हिन्दी रूप है और अत्यंत सावधानी से रक्षा करने का भाव भी सहज रूप से देता है।
- source_word: συντηρήσει
  choice: सँभालकर रखेगा
  rationale: भविष्यकालीन क्रिया सुरक्षित रखने और सावधानी से रक्षा करने, दोनों भावों को समेटती है।
theological_decisions:
- issue: συντηρήσει क्रिया का अनकहा कर्ता
  choice: ‘वह ... सँभालकर रखेगा’, जिसमें कर्ता का नाम नहीं बताया गया
  alternative: ‘परमेश्वर ... सँभालकर रखेगा’
  rationale: यूनानी वाक्य में क्रिया एकवचन है, पर उसका कर्ता स्पष्ट रूप से लिखा नहीं गया। ‘वह’ इस अनिश्चितता को बनाए रखता है; व्यापक प्रसंग के आधार पर परमेश्वर समझना संभव है, पर उसे मुख्य पाठ में जोड़ना मूल से अधिक स्पष्टता लाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों निकटवर्ती मानववाची शब्दों—ἀνήρ और ἄνθρωπος—का अंतर क्रमशः ‘पुरुष’ और ‘मनुष्य’ से सुरक्षित रखा गया है। सक्रिय भविष्यकाल और उसके अनकहे कर्ता की वास्तविक अस्पष्टता को ‘वह’ तथा पादटिप्पणी द्वारा बनाए रखा गया है।
