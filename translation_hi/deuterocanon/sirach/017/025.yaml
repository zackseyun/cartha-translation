  yaml_path: translation/deuterocanon/sirach/017/025.yaml
  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: hi
  text: प्रभु की दया कितनी महान है! और जो उसकी ओर लौटते हैं, उनके लिए प्रायश्चित[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप-दोष का निवारण।”
    reason: ἐξιλασμός प्रायश्चित, दोष-निवारण अथवा क्षमा सम्भव करनेवाले कार्य को सूचित कर सकता है; विकल्प को खुला रखने के लिए।
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: कितनी महान है!
  rationale: विशेषण के साथ ὡς यहाँ विस्मय प्रकट करता है; हिन्दी में यह रचना उसके भाव और बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἐλεημοσύνη
  choice: दया
  rationale: यद्यपि इस शब्द का अर्थ कुछ प्रसंगों में दान देना हो सकता है, यहाँ प्रभु के संबंध में यह उसकी दयालुता और करुणामय व्यवहार को व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: यहूदी ज्ञान-साहित्य के इस प्रसंग में κύριος परमेश्वर के लिए आदरसूचक पद है; इसलिए ‘प्रभु’ उपयुक्त है।
- source_word: ἐξιλασμός
  choice: प्रायश्चित
  rationale: यह शब्द पाप-दोष के निवारण अथवा प्रायश्चित को सूचित करता है। ‘प्रायश्चित’ इसके धार्मिक भार को बनाए रखता है, जबकि पादटिप्पणी अर्थ की दूसरी सम्भव अभिव्यक्ति स्पष्ट करती है।
- source_word: τοῖς ἐπιστρέφουσιν
  choice: जो ... लौटते हैं
  rationale: ἐπιστρέφω का मूल बिंब मुड़कर लौटने का है। ‘लौटते हैं’ पश्चाताप का अर्थ थोपे बिना परमेश्वर की ओर वापसी को व्यक्त करता है।
- source_word: ἐπ᾿ αὐτόν
  choice: उसकी ओर
  rationale: ἐπιστρέφω के साथ यह पद दिशा और संबंधपरक उन्मुखता बताता है; आधुनिक हिन्दी में ‘उसकी ओर’ स्वाभाविक है।
theological_decisions:
- issue: ἐξιλασμός का अर्थ और उसका कर्ता
  choice: प्रायश्चित
  alternative: पाप-दोष का निवारण; क्षमा का उपाय
  rationale: मूल पाठ यह नहीं बताता कि प्रायश्चित किस विशिष्ट प्रक्रिया से होता है। इसलिए अनुवाद उसके धर्मवैज्ञानिक भार को रखता है, पर किसी बाद के निश्चित प्रायश्चित-सिद्धान्त को इसमें नहीं जोड़ता। ‘उसका प्रायश्चित’ भी नहीं कहा गया, क्योंकि यूनानी में स्पष्ट स्वामित्ववाचक सर्वनाम नहीं है।
- issue: ἐπιστρέφουσιν में पश्चाताप का भाव
  choice: उसकी ओर लौटते हैं
  alternative: मन फिराते हैं
  rationale: ‘लौटना’ मूल रूपक को सुरक्षित रखता है और पश्चाताप के निहित भाव को किसी तकनीकी धार्मिक पद में बदलकर अधिक स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले खंड का विस्मयादिबोधक स्वर यूनानी ὡς μεγάλη के अनुरूप है। दूसरे खंड में मूल की संक्षिप्त, कुछ हद तक दीर्घवृत्तीय रचना को हिन्दी में आवश्यक ‘है’ जोड़कर स्पष्ट किया गया है।
