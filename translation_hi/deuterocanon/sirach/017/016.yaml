translation:
  language: hi
  text: उनके सभी कार्य सूर्य के समान उसके सामने हैं,[a] और उसकी आँखें निरंतर उनके मार्गों पर लगी रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके सभी कर्म सूर्य के समान उसके सामने हैं।” इस उपमा का संभावित आशय है कि मनुष्यों के कार्य परमेश्वर के सामने पूरी तरह खुले हुए हैं।
    reason: ‘कार्य/कर्म’ की शाब्दिक सम्भावना और सूर्य की उपमा में निहित, पर स्पष्ट रूप से न कही गई, पूर्ण दृश्यता को बताना।
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: उनके सभी काम
  rationale: यह वाक्यांश उनके समस्त कार्यों को समेटता है। ‘काम’ सामान्य आधुनिक हिन्दी में व्यापक है और कार्यों तथा कर्मों—दोनों का भाव रख सकता है।
- source_word: ὡς ὁ ἥλιος
  choice: सूर्य के समान
  rationale: ὡς द्वारा व्यक्त स्पष्ट उपमा को बनाए रखता है; मूल में ‘प्रकाश में’ या ‘स्पष्ट’ जैसे शब्द नहीं जोड़े गए हैं।
- source_word: ἐναντίον αὐτοῦ
  choice: उसके सामने
  rationale: परमेश्वर की उपस्थिति और दृष्टि के सामने होने का स्वाभाविक तथा निकट अर्थ देता है।
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: उसकी आँखें
  rationale: ईश्वरीय ज्ञान के लिए प्रयुक्त मूल की ठोस मानवरूपी छवि को अमूर्त व्याख्या में बदले बिना सुरक्षित रखता है।
- source_word: ἐνδελεχεῖς
  choice: निरन्तर ... लगी रहती हैं
  rationale: विशेषण में निहित सतत और अटल ध्यान को स्वाभाविक हिन्दी विधेय के रूप में व्यक्त करता है।
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: उनके मार्गों पर
  rationale: ‘मार्ग’ मूल रूपक को बनाए रखते हुए जीवन-चाल और आचरण का नैतिक अर्थ भी ग्रहण कर सकता है।
theological_decisions:
- issue: ईश्वरीय ज्ञान के लिए मानवरूपी भाषा
  choice: ‘उसकी आँखें निरन्तर उनके मार्गों पर लगी रहती हैं’
  alternative: ‘वह उनके आचरण को सदा देखता रहता है’
  rationale: यूनानी पाठ ‘आँखें’ कहकर परमेश्वर की सतत दृष्टि की ठोस छवि प्रस्तुत करता है; अनुवाद उस तनाव और चित्रात्मकता को बनाए रखता है।
- issue: सूर्य की उपमा का आशय
  choice: ‘सूर्य के समान उसके सामने हैं’
  alternative: ‘उसके सामने सूर्य की तरह स्पष्ट हैं’
  rationale: पूर्ण दृश्यता का भाव सम्भवतः निहित है, पर ‘स्पष्ट’ मूल पाठ में प्रत्यक्ष नहीं है; इसलिए उसे मुख्य पाठ में जोड़ने के बजाय टिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘निरन्तर’ और ‘मार्गों’ से शास्त्रीय गरिमा बनी रहती है, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
