  yaml_path: translation/deuterocanon/sirach/017/007.yaml
  text: He set his eye upon their hearts[a], to show them the greatness of his works.
translation:
  language: hi
  text: उसने अपनी आँख उनके हृदयों पर टिकाई[a], ताकि वह उन्हें अपने कार्यों की महानता दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी दृष्टि।” मूल यूनानी में शब्दशः एकवचन “अपनी आँख” है।
    reason: ‘आँख’ का ठोस मानवरूपी बिंब सुरक्षित रखते हुए अधिक स्वाभाविक वैकल्पिक अर्थ बताना।
lexical_decisions:
- source_word: ἔθηκεν
  choice: टिकाई
  rationale: τίθημι का मूल अर्थ ‘रखना/स्थापित करना’ है। ‘आँख ... पर टिकाई’ हिन्दी में स्वाभाविक रहते हुए किसी ओर आँख लगाने की ठोस क्रिया को बनाए रखता है।
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
  choice: अपनी आँख
  rationale: यूनानी पाठ में ‘आँख’ एकवचन है। इसे ‘दृष्टि’ जैसे अमूर्त शब्द से बदलने के बजाय मानवरूपी बिंब को सुरक्षित रखा गया है।
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: उनके हृदयों पर
  rationale: ἐπί को ‘पर’ और καρδίαι को ‘हृदयों’ से अनूदित किया गया है। ‘हृदय’ यहाँ भीतरी मनुष्य—विचार, इच्छा और समझ—का बिंब हो सकता है, पर अनुवाद उस व्यापकता को स्वयं स्पष्ट करके सीमित नहीं करता।
- source_word: δεῖξαι
  choice: ताकि वह ... दिखाए
  rationale: उद्देश्यसूचक अनंत क्रिया को स्पष्ट हिन्दी उद्देश्य-वाक्य से व्यक्त किया गया है। ‘दिखाए’ मूल के दृश्य-संबंधी भाव को भी बनाए रखता है।
- source_word: τὸ μεγαλεῖον
  choice: महानता
  rationale: यह शब्द महानता या भव्यता का बोध देता है। ‘महानता’ आगामी संबंधवाचक पद के साथ सहज है और अर्थ को किसी एक महान कार्य तक सीमित नहीं करता।
- source_word: τῶν ἔργων αὐτοῦ
  choice: अपने कार्यों की
  rationale: ἔργα बहुवचन में किए गए कामों या कृतियों को दर्शाता है। ‘कार्यों’ से परमेश्वर के कामों का व्यापक अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर की अनुभूति के लिए मानवरूपी भाषा
  choice: ‘उसने अपनी आँख उनके हृदयों पर टिकाई’ के ठोस बिंब को बनाए रखा गया है।
  alternative: ‘उसने उनके हृदयों पर अपनी दृष्टि रखी’ या ‘उसने उनके हृदयों की देखभाल की।’
  rationale: यूनानी पाठ परमेश्वर के लिए एकवचन ‘आँख’ का सजीव मानवरूपी बिंब प्रयोग करता है। इसे निगरानी, ध्यान या देखभाल जैसे व्याख्यात्मक शब्दों में बदलना मूल की शारीरिक उपमा और मनुष्य के आंतरिक ‘हृदयों’ के बीच के तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण है। ‘आँख ... पर टिकाई’ स्वाभाविक हिन्दी मुहावरा है और मूल यूनानी के ठोस एकवचन बिंब को यथासंभव निकटता से रखता है।
