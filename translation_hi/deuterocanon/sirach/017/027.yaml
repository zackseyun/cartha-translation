lexical_decisions:
- source_word: Ὑψίστῳ
  choice: परमप्रधान की
  rationale: यह दैवी उपाधि का स्वाभाविक हिन्दी रूप है; सम्बन्धसूचक रचना ‘स्तुति करेगा’ के साथ प्रशंसा पाने वाले को स्पष्ट करती है।
- source_word: τίς αἰνέσει
  choice: कौन ... स्तुति करेगा
  rationale: भविष्यकालीन क्रिया और आलंकारिक प्रश्न को सीधे रखा गया है। αἰνέω में ‘गाने’ का अर्थ अनिवार्य नहीं, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐν ᾅδου
  choice: अधोलोक में
  rationale: यह मृतकों के लोक को दर्शाता है और इसे केवल कब्र या अंतिम दण्ड का स्थान मानकर अर्थ को संकुचित नहीं करता।
- source_word: ἀντὶ ζώντων
  choice: जीवित लोगों के बदले
  rationale: ἀντί के प्रतिस्थापन/विरोध के बल और ζώντων के संज्ञात्मक प्रयोग को सुरक्षित रखता है।
- source_word: διδόντων ἀνθομολόγησιν
  choice: जो धन्यवाद चढ़ाते हैं
  rationale: διδόντων के ‘देने/अर्पित करने’ और ἀνθομολόγησιν के धन्यवाद अथवा प्रत्युत्तरात्मक स्तुति के भाव को स्वाभाविक उपासना-भाषा में व्यक्त करता है।
theological_decisions:
- issue: ᾅδης का आशय
  choice: अधोलोक—मृतकों का लोक
  alternative: कब्र; शीओल; नरक
  rationale: यह पद मृतकों और जीवित उपासकों का विरोध करता है। ‘अधोलोक’ यूनानी शब्द की व्यापकता बनाए रखता है और अंतिम दण्ड के विषय में ऐसा निष्कर्ष नहीं जोड़ता जो पद में स्पष्ट नहीं है।
- issue: ἀνθομολόγησις का उपासना-संबंधी अर्थ
  choice: धन्यवाद
  alternative: स्तुति; कृतज्ञ स्वीकारोक्ति
  rationale: शब्द धन्यवाद और प्रत्युत्तरात्मक स्तुति दोनों का संकेत दे सकता है; मुख्य पाठ में सहज ‘धन्यवाद’ रखा गया है और व्यापक अर्थ पादटिप्पणी में बताया गया है।
