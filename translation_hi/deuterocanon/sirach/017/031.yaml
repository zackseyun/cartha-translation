  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: hi
  text: सूर्य से अधिक उज्ज्वल क्या है? फिर भी वह भी मंद पड़ जाता है[a]; और मांस और लहू[b] बुरा सोचता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे भी ग्रहण लगता है” अथवा “वह भी लुप्त हो जाता है”; यूनानी क्रिया मंद या क्षीण पड़ने, समाप्त होने, अथवा ग्रहण लगने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मांस और लहू”; अर्थात नश्वर, देहधारी मनुष्य।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: सूर्य से अधिक उज्ज्वल क्या है?
  rationale: तुलनात्मक विशेषण के बाद आए संबंधकारक को हिन्दी में स्वाभाविक रूप से ‘से अधिक’ द्वारा व्यक्त किया गया है; τί निर्जीव वस्तु के विषय में अलंकारिक प्रश्न होने के कारण ‘क्या’ है।
- source_word: καὶ τοῦτο ἐκλείπει
  choice: फिर भी वह भी मंद पड़ जाता है
  rationale: ἐκλείπει के अर्थ-क्षेत्र में घट जाना, चूकना, समाप्त होना और ग्रहण लगना शामिल हैं। सूर्य के संदर्भ में ‘मंद पड़ना’ स्वाभाविक है और उसके प्रकाश के विफल या ओझल होने की व्यापक छवि बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: πονηρὸς ἐνθυμήσεται
  choice: बुराई की कल्पना करता है
  rationale: वाक्यांश भीतर मन में बुरी बात सोचने या गढ़ने का भाव देता है। यूनानी भविष्यकाल यहाँ मनुष्य की सामान्य प्रवृत्ति को सूक्तिपरक ढंग से व्यक्त कर सकता है, जिसे हिन्दी में सामान्य वर्तमान अधिक स्वाभाविक रूप से प्रकट करता है।
- source_word: σάρκα καὶ αἷμα
  choice: हाड़-माँस का मनुष्य
  rationale: शाब्दिक ‘माँस और लहू’ हिन्दी में इस मानववाचक मुहावरे का आशय सहजता से नहीं देता। ‘हाड़-माँस का मनुष्य’ देहधारी, नश्वर मानव का ठोस और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: σάρκα καὶ αἷμα का मानवशास्त्रीय आशय
  choice: हाड़-माँस का मनुष्य
  alternative: माँस और लहू; नश्वर मनुष्य
  rationale: यहाँ अभिव्यक्ति किसी पृथक तत्त्व या बाद की सिद्धान्तगत धारणा की नहीं, देहधारी और नश्वर मानव की नैतिक दुर्बलता की ओर संकेत करती है। हिन्दी मुहावरा ठोस देहात्मकता और मानव-संदर्भ दोनों को बनाए रखता है।
- issue: ἐκλείπει में सूर्यग्रहण का संभावित संकेत
  choice: मंद पड़ जाता है
  alternative: उसे भी ग्रहण लगता है; वह भी लुप्त हो जाता है
  rationale: क्रिया सचमुच ग्रहण लगने का अर्थ दे सकती है, पर केवल उसी अर्थ को निश्चित करना आवश्यक नहीं। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी वास्तविक विकल्पों को सुरक्षित रखती है।
