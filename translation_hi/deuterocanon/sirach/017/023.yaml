  - marker: b
    text: ‘धन्यवाद अर्पित करते हैं’ का अनुवाद ‘कृतज्ञ अभिस्वीकृति देते हैं’ या ‘स्वीकारोक्ति करते हैं’ भी हो सकता है; यहाँ भाव उपासना में कृतज्ञ स्तुति का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: परमप्रधान की
  rationale: यह सम्प्रदान कारक में प्रयुक्त ईश्वरीय उपाधि है और स्तुति पाने वाले को बताती है। हिन्दी में ‘स्तुति करना’ के साथ ‘की’ स्वाभाविक है।
- source_word: τίς αἰνέσει
  choice: कौन ... स्तुति करेगा
  rationale: τίς आलंकारिक प्रश्न आरम्भ करता है और αἰνέσει भविष्यत्काल में सामान्यतः ‘स्तुति करेगा’ है; यूनानी क्रिया अपने-आप गायन को अनिवार्य नहीं बनाती।
- source_word: ἐν ᾅδου
  choice: अधोलोक में
  rationale: ᾅδης यहाँ मृतकों के लोक को सूचित करता है। ‘अधोलोक’ आधुनिक हिन्दी में अपेक्षाकृत स्पष्ट है और इसे अंतिम दण्ड के विकसित सिद्धान्त के रूप में नहीं बाँधता।
- source_word: ἀντὶ ζώντων
  choice: उन जीवित लोगों के स्थान पर
  rationale: ἀντί स्थान या प्रतिस्थापन का विरोध व्यक्त करता है; यह मृतकों और जीवितों के बीच पद का मुख्य विरोध बनाए रखता है।
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: जो धन्यवाद अर्पित करते हैं
  rationale: ἀνθομολόγησις स्वीकारोक्ति, कृतज्ञ अभिस्वीकृति या धन्यवादपूर्ण स्तुति को सूचित कर सकता है। उपासना के प्रसंग में ‘धन्यवाद अर्पित करना’ स्वाभाविक है और διδόντων के ‘देने/अर्पित करने’ भाव को भी रखता है।
theological_decisions:
- issue: ᾅδης का अर्थ
  choice: मृतकों का लोक, जिसे ‘अधोलोक’ कहा गया है
  alternative: कब्र; शीओल; नरक
  rationale: पद का विरोध मृतकों और जीवितों की परमप्रधान की स्तुति करने की स्थिति के बीच है। यूनानी शब्द अपने-आप अंतिम दण्ड या ‘नरक’ की बाद की धर्मवैज्ञानिक धारणा निश्चित नहीं करता।
- issue: ζώντων καὶ διδόντων का संबंध
  choice: धन्यवाद अर्पित करने वाले जीवित लोग
  alternative: ‘जीवित लोगों और धन्यवाद अर्पित करने वालों’ के दो अलग समूह
  rationale: समन्वित कृदन्तों को एक ही समूह के वर्णन के रूप में पढ़ना प्रसंग और हिन्दी वाक्य-प्रवाह के अनुकूल है, यद्यपि यूनानी संरचना संक्षिप्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आलंकारिक प्रश्न और मृतकों तथा जीवितों का तीखा विरोध सुरक्षित है; दीर्घ विराम-चिह्न उस विरोध को स्पष्ट करता है।
