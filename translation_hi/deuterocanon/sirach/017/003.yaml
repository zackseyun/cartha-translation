lexical_decisions:
- source_word: ἐνέδυσεν
  choice: पहनाया
  rationale: क्रिया का मूल अर्थ ‘वस्त्र पहनाना’ है। ‘सामर्थ्य पहनाया’ यूनानी रूपक को बनाए रखता है, यद्यपि हिन्दी में यह जानबूझकर काव्यात्मक अभिव्यक्ति है।
- source_word: ἰσχύν
  choice: सामर्थ्य
  rationale: यहाँ शब्द बल या शक्ति को व्यक्त करता है। ‘सामर्थ्य’ गरिमापूर्ण और स्वाभाविक है तथा इसे अमूर्त अधिकार के अर्थ में अधिक नहीं खींचता।
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: अपने स्वरूप के अनुसार
  rationale: κατά + कर्मकारक के ‘के अनुसार’ भाव को स्पष्ट रखते हुए उत्पत्ति-वृत्तांत की सृष्टि-भाषा की प्रतिध्वनि बनाए रखता है।
- source_word: ἐποίησεν
  choice: बनाया
  rationale: ποιέω का सामान्य अर्थ ‘बनाना’ है; ‘सृजा’ मूल क्रिया से अधिक विशिष्ट अर्थ जोड़ सकता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: बहुवचन सर्वनाम मनुष्यों को सामूहिक रूप से सूचित करता है; ‘उन्हें’ उस संदर्भ को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: κατ᾿ εἰκόνα αὐτοῦ में उत्पत्ति-वृत्तांत से जुड़ी मानव-समझ
  choice: अपने स्वरूप के अनुसार
  alternative: अपने स्वरूप में
  rationale: यह अनुवाद मनुष्य और परमेश्वर के स्वरूप के बीच पाठ में व्यक्त संबंध तथा उत्पत्ति की प्रतिध्वनि को सुरक्षित रखता है, पर उस संबंध की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
