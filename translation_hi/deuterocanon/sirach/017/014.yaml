  text: Their ways are always before him[a]; they will not be hidden from his eyes.
translation:
  language: hi
  text: उनके मार्ग सदा उसके सामने हैं[a]; वे उसकी आँखों से छिपे न रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका आचरण सदा उसके सामने है”; “मार्ग” केवल वास्तविक रास्तों को ही नहीं, बल्कि किसी व्यक्ति की जीवन-चाल या आचरण को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ὁδοὶ
  choice: उनके मार्ग
  rationale: ὁδοί का शाब्दिक अर्थ रास्ते या मार्ग है, पर ज्ञान-साहित्य में यह जीवन-चाल या आचरण का भी बोध कराता है। ‘मार्ग’ मूल रूपक और उसके विस्तृत अर्थ—दोनों को बनाए रखता है।
- source_word: ἐναντίον αὐτοῦ
  choice: उसके सामने
  rationale: यह पदबंध किसी की उपस्थिति और दृष्टि के सामने होने का अर्थ देता है। ‘उसके सामने’ हिन्दी में स्वाभाविक है और दृश्य भाव को सुरक्षित रखता है।
- source_word: διὰ παντός
  choice: सदा
  rationale: यह यूनानी मुहावरा निरंतरता या हर समय का बोध कराता है। ‘सदा’ संक्षिप्त, सहज और गरिमापूर्ण समतुल्य है।
- source_word: οὐ κρυβήσονται
  choice: छिपे न रहेंगे
  rationale: κρύπτω के भविष्यत् कर्मवाच्य रूप को यह स्वाभाविक हिन्दी में प्रतिज्ञप्ति के रूप में रखता है, बिना उसे ‘छिप नहीं सकते’ जैसी सामर्थ्य-सूचक व्याख्या में बदलने के।
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ
  choice: उसकी आँखों से
  rationale: मूल का ठोस दृष्टि-संबंधी मानवीय चित्र हिन्दी में स्पष्ट है और परमेश्वर के निरंतर ज्ञान को व्यक्त करने वाली छवि को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के ज्ञान के लिए मानवीय दृष्टि-भाषा
  choice: ‘उसके सामने’ और ‘उसकी आँखों से’ को बनाए रखा गया है।
  alternative: इसे अमूर्त रूप में ‘वह उन्हें सदा जानता है’ या ‘उसकी दृष्टि से’ कहना।
  rationale: यूनानी पाठ मनुष्यों के जीवन-मार्ग पर परमेश्वर की निरंतर दृष्टि व्यक्त करने के लिए ठोस दृश्य भाषा का उपयोग करता है। इसे बनाए रखने से ज्ञान-साहित्य का स्वर और मूल धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘मार्ग’ से मूल रूपक सुरक्षित है, जबकि पादटिप्पणी उसका आचरण-संबंधी आशय स्पष्ट करती है।
