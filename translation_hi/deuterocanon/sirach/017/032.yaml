  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: hi
  text: वह स्वयं स्वर्ग की ऊँचाई की सेना[a] पर ध्यान रखता है, और सभी मनुष्य धरती और राख हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग की ऊँचाई का सामर्थ्य।’ यूनानी शब्द δύναμις का अर्थ ‘सामर्थ्य’ हो सकता है और बाइबलीय प्रयोग में ‘सेना’ भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: सेना
  rationale: बाइबलीय यूनानी में δύναμις सामर्थ्य के साथ-साथ किसी सैन्य-दल या स्वर्गीय सेना का भी बोध करा सकता है। यहाँ ब्रह्मांडीय संदर्भ और अगली उपवाक्य में नश्वर मनुष्यों से किया गया विरोध ‘सेना’ का समर्थन करता है; दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ὕψους οὐρανοῦ
  choice: स्वर्ग की ऊँचाई की
  rationale: यह पदबंध वर्णनात्मक रूप से ‘स्वर्ग की ऊँचाई’ कहता है। इसे ‘परमप्रधान’ जैसा ईश्वरीय नाम बनाना यूनानी पाठ से अधिक अर्थ ग्रहण करना होता।
- source_word: ἐπισκέπτεται
  choice: पर ध्यान रखता है
  rationale: क्रिया का अर्थ भेंट करना, निरीक्षण करना या देखभाल करना हो सकता है। इस संदर्भ में यह परमेश्वर की सक्रिय निगरानी और देखरेख को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἄνθρωποι πάντες
  choice: सभी मनुष्य
  rationale: यूनानी अभिव्यक्ति समस्त मानवजाति को समावेशी रूप से सूचित करती है। ‘सभी मनुष्य’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: γῆ καὶ σποδός
  choice: धरती और राख
  rationale: यूनानी में ठीक-ठीक ‘धरती और राख’ है। अधिक परिचित ‘धूल और राख’ कहने से γῆ का अर्थ अनावश्यक रूप से बदल जाता।
theological_decisions:
- issue: स्वर्गीय संदर्भ में δύναμιν का अर्थ
  choice: सेना
  alternative: सामर्थ्य
  rationale: यहाँ परमेश्वर की स्वर्गीय क्षेत्र पर निगरानी और मनुष्यों की नश्वरता के बीच विरोध है। ‘सेना’ सम्भावित सामूहिक, ब्रह्मांडीय अर्थ को व्यक्त करती है, जबकि वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: οἱ ἄνθρωποι πάντες का मानववैज्ञानिक विस्तार
  choice: सभी मनुष्य
  alternative: सभी लोग
  rationale: यह पद किसी एक लिंग तक सीमित न होकर पूरी मानवजाति की धरती और राख जैसी नश्वर दशा बताता है। ‘सभी मनुष्य’ उस सार्वभौमिक अर्थ को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धरती और राख’ मूल यूनानी की ठोस मानववैज्ञानिक छवि को बनाए रखता है; ‘पर ध्यान रखता है’ ईश्वरीय देखरेख को सहज हिन्दी में व्यक्त करता है।
