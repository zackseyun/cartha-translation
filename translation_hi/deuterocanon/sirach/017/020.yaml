  - marker: c
    text: यहाँ उपलब्ध यूनानी स्रोत के सत्यापन में बड़ी असंगति दर्ज है; इसलिए समग्र अर्थ स्पष्ट होने पर भी सटीक शब्द-विन्यास को कुछ सावधानी से ग्रहण करना चाहिए।
    reason: textual_variant
