theological_decisions:
- issue: पश्चात्ताप के संदर्भ में ἐπάνοδον का आशय
  choice: लौटने का अवसर
  alternative: वापसी; लौटने का मार्ग; पुनःस्थापन
  rationale: पद परमेश्वर की ओर से मन फिराने वालों के लिए वापसी की संभावना बताता है, पर यूनानी संज्ञा स्वयं किसी विस्तृत उद्धार-सिद्धान्त को निर्दिष्ट नहीं करती। चुना हुआ रूप इस खुलेपन को बनाए रखता है।
- issue: παρεκάλεσεν ἐκλείποντας ὑπομονήν का व्याकरणिक संबंध
  choice: धीरज खोते हुओं को प्रोत्साहित किया
  alternative: जो चूक रहे थे, उन्हें धीरज रखने के लिए प्रोत्साहित किया
  rationale: संक्षिप्त यूनानी वाक्यांश में ὑπομονήν को ἐκλείποντας का कर्म अथवा प्रोत्साहन की विषयवस्तु समझा जा सकता है। मुख्य पाठ पहली स्वाभाविक सम्भावना अपनाता है और पादटिप्पणी दूसरी को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘मन फिराना’ बाइबिलीय अर्थ को रखते हुए सामान्य पाठक के लिए समझने योग्य है। पादटिप्पणी-चिह्न संबंधित पदांशों के ठीक बाद रखे गए हैं।
