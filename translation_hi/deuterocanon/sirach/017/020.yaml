  rationale: ἐκλείπω घटने, चूकने, थकने या जवाब देने का भाव रख सकता है। ὑπομονήν के साथ ‘धीरज खोते हुए’ स्वाभाविक हिन्दी है, पर पादटिप्पणी में वैकल्पिक व्याकरणिक संबंध सुरक्षित रखा गया है।
- source_word: ὑπομονήν
