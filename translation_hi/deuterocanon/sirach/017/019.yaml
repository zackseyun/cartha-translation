  rationale: The revision replaces the revenge-specific “बदला” with “प्रतिफल” to preserve the Greek’s broader recompense vocabulary and its deliberate repetition. It also streamlines the second clause while retaining the literal biblical image of recompense being returned upon their head. No doctrinal interpretation is added.
