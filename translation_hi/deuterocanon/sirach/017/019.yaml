- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह यूनानी पद स्पष्ट कालक्रम बताता है; ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक और निकट अर्थ वाला है।
- source_word: ἐξαναστήσεται
  choice: वह उठ खड़ा होगा
  rationale: क्रिया का चित्रात्मक अर्थ ‘उठना/उठ खड़ा होना’ है और यह निर्णायक व्यक्तिगत कार्रवाई को बनाए रखता है।
- source_word: ἀνταποδώσει αὐτοῖς
  choice: उन्हें बदला देगा
  rationale: ἀνταποδίδωμι प्रतिउत्तर में चुकाने या प्रतिफल देने का भाव रखता है; न्याय के इस संदर्भ में ‘बदला देगा’ प्रतिकारात्मक अर्थ को स्पष्ट रखता है, बिना उसे केवल स्वाभाविक परिणाम बना देने के।
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: उनका प्रतिफल
  rationale: संज्ञा का अर्थ प्रत्युत्तर में मिलने वाला फल या बदला है; ‘प्रतिफल’ dignified और सामान्य हिन्दी में समझने योग्य है तथा सकारात्मक या नकारात्मक प्रतिदान की मूल व्यापकता भी रखता है।
- source_word: εἰς κεφαλὴν αὐτῶν ἀποδώσει
  choice: उन्हीं के सिर पर लौटा देगा
  rationale: यह चयन ‘सिर पर’ वाले मूल मुहावरे और ἀποδώσει के लौटाने/चुकाने के भाव दोनों को सुरक्षित रखता है; ‘उन्हीं’ परिणाम के उन्हीं पर वापस आने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय में परमेश्वर की व्यक्तिगत और प्रतिकारात्मक कार्रवाई
  choice: ‘वह उठ खड़ा होगा और उन्हें बदला देगा’ के रूप में व्यक्तिगत, निर्णायक कार्रवाई बनाए रखी गई है।
  alternative: इसे केवल ‘उनके कर्मों के परिणाम उन पर आएँगे’ जैसे निर्वैयक्तिक परिणाम के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ का कर्ता स्वयं सक्रिय होकर उठता और प्रतिदान करता है। अनुवाद इस मानवीकरण और न्यायगत तनाव को नरम नहीं करता।
- issue: ‘उनका प्रतिफल’ का संदर्भ
  choice: सर्वनामात्मक अभिव्यक्ति को उसी अस्पष्टता सहित रखा गया है।
  alternative: स्पष्ट करके ‘उनके कर्मों का दण्ड’ कहना।
  rationale: मूल में ‘उनका प्रतिफल’ है; उसे ‘दण्ड’ या ‘कर्मों का फल’ कहकर अधिक निश्चित करना मूल की अभिव्यक्ति से आगे जाना होता।
