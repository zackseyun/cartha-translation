  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली रखी गई है। ‘उठ खड़ा होगा’ मूल की सजीवता बनाए रखता है; ‘बदला देगा’ और ‘प्रतिफल’ साथ मिलकर यूनानी की संबंधित क्रिया-संज्ञा को यांत्रिक पुनरुक्ति के बिना व्यक्त करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के बाद दिए गए हैं।
