  source_fidelity: The temporal sequence, future personal action, and the head idiom are retained. However, “बदला देगा” can specifically imply revenge and is narrower than ἀνταποδώσει, which denotes recompense/repayment. The repeated Greek recompense language is better represented with “प्रतिफल” in both clauses.
  naturalness: “उनका प्रतिफल उन्हीं के सिर पर लौटा देगा” is understandable, but “उनके सिर पर” is more direct and the added “उन्हीं” is unnecessary because the possessive already carries the reference. Anchoring the idiom immediately after “सिर पर” improves readability.
  terminology: “प्रतिफल” is a dignified, modern-standard Hindi term that can retain the source’s broad recompense sense without prematurely specifying either revenge or punishment. Repeating it preserves the Greek lexical connection between ἀνταποδώσει, ἀνταπόδομα, and ἀποδώσει.
  issues:
