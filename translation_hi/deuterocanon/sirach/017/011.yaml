  yaml_path: translation/deuterocanon/sirach/017/011.yaml
  text: He established with them an everlasting covenant[b][a], and showed them his judgments.
translation:
  language: hi
  text: उसने उनके साथ सदा की वाचा[a] स्थापित की और उन्हें अपने न्याय-विधान[b] दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनन्त वाचा” अथवा “युगों तक रहने वाली वाचा।”
    reason: lexical_alternative
  - marker: b
    text: या “न्याय,” “विधि-विधान” अथवा “निर्णय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: वाचा
  rationale: बाइबलीय यूनानी में यह शब्द केवल सामान्य समझौता नहीं, बल्कि परमेश्वर द्वारा स्थापित वाचा का भाव रखता है; ‘वाचा’ उस धर्मवैधानिक और संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: αἰῶνος
  choice: सदा की
  rationale: संबंधकारक पदबंध वाचा की दीर्घस्थायी अथवा युगपर्यंत प्रकृति बताता है। ‘सदा की’ आधुनिक हिन्दी में स्वाभाविक है और अनन्त/युगों तक की वास्तविक अर्थ-व्याप्ति को पादटिप्पणी में खुला रखता है।
- source_word: ἔστησεν
  choice: स्थापित की
  rationale: क्रिया किसी वस्तु को दृढ़ रूप से ठहराने या प्रभावी रूप में कायम करने को व्यक्त करती है; वाचा के साथ ‘स्थापित की’ सटीक और स्वाभाविक है।
- source_word: μετ᾿ αὐτῶν
  choice: उनके साथ
  rationale: μετά के साथ संबंधकारक का सीधा संबंधपरक अर्थ ‘के साथ’ है।
- source_word: τὰ κρίματα αὐτοῦ
  choice: अपने न्याय-विधान
  rationale: κρίματα में न्यायिक निर्णयों और बाध्यकारी विधानों, दोनों का भाव हो सकता है। ‘न्याय-विधान’ इस व्यापकता को किसी एक संकुचित अर्थ में सीमित किए बिना हिन्दी में स्पष्ट करता है।
- source_word: ὑπέδειξεν
  choice: दिखाए
  rationale: मूल क्रिया का सीधा अर्थ दिखाना या संकेत करके ज्ञात कराना है; ‘दिखाए’ समानांतर वाक्य-रचना और मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के प्रसंग में वाचा की भाषा
  choice: सदा की वाचा
  alternative: अनन्त वाचा; युगों तक रहने वाली वाचा
  rationale: मूल में स्पष्ट वाचागत शब्दावली है। इसे सामान्य ‘समझौते’ में बदलने के बजाय ‘वाचा’ कहना उसके शास्त्रीय और धार्मिक भार को बनाए रखता है, जबकि अवधि से जुड़ी अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- issue: वाचा के प्रसंग में κρίματα का अर्थ
  choice: न्याय-विधान
  alternative: न्याय; विधि-विधान; निर्णय
  rationale: यूनानी शब्द न्यायिक निर्णय और मानक आदेश दोनों को व्यक्त कर सकता है। संयुक्त पद ‘न्याय-विधान’ इस तनाव को बनाए रखता है और केवल दंडात्मक न्याय अथवा केवल अनुष्ठानिक नियम का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वाचा’ और ‘न्याय-विधान’ बाइबलीय संदर्भ का भार रखते हैं, पर अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
