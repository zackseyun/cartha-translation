base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: hi
  text: अपने मुँह को शपथ खाने का आदी न बना, और पवित्र परमेश्वर का नाम लेने का अभ्यस्त न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र नाम का प्रयोग करने का अभ्यस्त न हो।” यूनानी पद का अर्थ पवित्र परमेश्वर का नाम लेना, या उनका नाम लेकर आह्वान करना, भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκῳ
  choice: शपथ खाने का
  rationale: ἐθίζω के साथ संबंध उस व्यवहार को दर्शाता है जिसकी आदत डाली जाती है। ‘शपथ खाना’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और बार-बार शपथ लेने के भाव को स्पष्ट रखता है।
- source_word: μὴ ἐθίσῃς τὸ στόμα σου
  choice: अपने मुँह को ... आदी न बना
  rationale: 'यह निषेधात्मक और कारक भाव को बनाए रखता है: व्यक्ति अपने ‘मुँह’ को किसी व्यवहार की आदत न डाले। ‘मुँह’ मूल पाठ की सजीव वाणी-संबंधी छवि को सुरक्षित रखता है।'
- source_word: ὀνομασίᾳ
  choice: नाम लेने का
  rationale: ὀνομασία नाम लेने, नाम से उल्लेख करने या आह्वान करने को सूचित कर सकता है। ‘नाम लेना’ हिन्दी में स्वाभाविक है और मूल की अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τοῦ ἁγίου
  choice: पवित्र परमेश्वर का
  rationale: यह संबंधकारक पद सम्भवतः परमेश्वर को श्रद्धापूर्वक ‘पवित्र जन’ कहता है। हिन्दी में केवल ‘पवित्र जन’ अस्पष्ट या मानवीय व्यक्ति का संकेत दे सकता है; ‘पवित्र परमेश्वर’ सम्भावित ईश्वरीय संदर्भ को स्पष्ट करता है, जबकि नाम-विषयक वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: μὴ συνεθισθῇς
  choice: अभ्यस्त न हो
  rationale: यह निष्क्रिय/आरम्भिक भाव को व्यक्त करता है—ऐसी आदत में न पड़ना—और पहले खंड के कारक ‘आदी न बना’ से हल्का भेद भी बनाए रखता है।
theological_decisions:
- issue: τοῦ ἁγίου का संदर्भ
  choice: इसे परमेश्वर के लिए श्रद्धापूर्ण संकेत मानकर ‘पवित्र परमेश्वर’ प्रस्तुत किया गया है।
  alternative: इसे ‘पवित्र नाम’ के अर्थ में लाक्षणिक रूप से समझना, या अधिक अक्षरशः ‘पवित्र जन’ कहना।
  rationale: शपथ और नाम लेने के संदर्भ में ईश्वरीय संदर्भ प्रबल है। फिर भी ὀνομασίᾳ τοῦ ἁγίου की रचना नाम लेने, पवित्र जन का आह्वान करने, अथवा पवित्र नाम के प्रयोग की ओर संकेत कर सकती है; अतः विकल्प पादटिप्पणी में सुरक्षित है।
- issue: निषेध का नैतिक विस्तार
  choice: शपथ खाने और परमेश्वर का नाम लेने की आदत डालने का निषेध।
  alternative: हर परिस्थिति में सभी प्रकार की शपथ का पूर्ण निषेध।
  rationale: ἐθίζω और συνεθίζω दोनों आदत पड़ने पर बल देते हैं। इसलिए पाठ से परे जाकर हर सम्भव गंभीर शपथ पर सार्वभौमिक निषेध आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन अनौपचारिक उपदेशात्मक संबोधन ‘तू’ के अनुरूप ‘अपने’ और ‘न बना/न हो’ रखा गया है। मूल के समानार्थी किन्तु भिन्न क्रियापदों को ‘आदी न बना’ और ‘अभ्यस्त न हो’ से अलग किया गया है।
