  text: जो मनुष्य अपमानजनक बातों का अभ्यस्त हो जाता है, वह अपने जीवन भर कभी अनुशासित नहीं होगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपमानजनक बातें’ का अनुवाद ‘निन्दा की बातें’ या ‘गाली-गलौज की बातें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
