    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह यूनानी एकवचन सामान्य प्रतिनिधि व्यक्ति को दर्शाता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के मानवीय संदर्भ को बनाए रखता है।
- source_word: συνεθιζόμενος
  choice: अभ्यस्त हो जाता है
  rationale: वर्तमान कृदन्त बार-बार के व्यवहार से आदत पड़ने या अभ्यस्त होने का भाव देता है; ‘अभ्यस्त हो जाता है’ इस प्रक्रिया और आदतन दशा दोनों को व्यक्त करता है।
- source_word: λόγοις ὀνειδισμοῦ
  choice: निन्दा की बातें करने का
  rationale: λόγοις का अर्थ बातें या वचन है और ὀνειδισμοῦ में निन्दा, अपमान या दुर्वचन का अर्थ हो सकता है। हिन्दी में आदतन बोलने का आशय स्पष्ट और स्वाभाविक बनाने के लिए ‘करने का’ जोड़ा गया है, जबकि पादटिप्पणी अन्य सम्भव तीव्रताओं को सुरक्षित रखती है।
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘उसके सभी दिनों में’ है; हिन्दी मुहावरे ‘जीवन भर’ से वही पूरे जीवन की कालावधि संक्षेप और स्वाभाविक रूप में व्यक्त होती है।
- source_word: οὐ μὴ παιδευθῇ
  choice: कभी अनुशासित नहीं होगा
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है, जिसे ‘कभी ... नहीं’ दर्शाता है। παιδεύω में शिक्षा, प्रशिक्षण, सुधार और अनुशासन के परस्पर जुड़े अर्थ हैं; इस ज्ञान-साहित्यिक नैतिक संदर्भ में ‘अनुशासित’ इस व्यापक गठनात्मक भाव को बनाए रखता है।
