  text: Two kinds multiply sins[a], and the third will bring wrath.
translation:
  language: hi
  text: दो प्रकार पापों को बढ़ाते हैं, और तीसरा[a] क्रोध लाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल “तीसरा” है; उसके बाद की संज्ञा निहित है। इसका अर्थ “तीसरा प्रकार” या “तीसरी बात” हो सकता है।
    reason: मूल पाठ की व्याकरणिक अपूर्णता और संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: Δύο εἴδη
  choice: दो प्रकार
  rationale: यह पद दो श्रेणियों की गणना से आरम्भ होता है। ‘प्रकार’ आधुनिक हिन्दी में स्वाभाविक है और εἴδη का श्रेणीगत अर्थ सुरक्षित रखता है।
- source_word: πληθύνουσιν
  choice: बढ़ाते हैं
  rationale: क्रिया का अर्थ संख्या या मात्रा बढ़ाना है। ‘पापों को बढ़ाते हैं’ हिन्दी में सहज रहते हुए पापों के अधिक होने का भाव व्यक्त करता है।
- source_word: ἁμαρτίας
  choice: पापों को
  rationale: यूनानी में संज्ञा बहुवचन है; हिन्दी में भी बहुवचन रखा गया है।
- source_word: τὸ τρίτον
  choice: तीसरा
  rationale: यूनानी में संज्ञा स्पष्ट रूप से नहीं दी गई, इसलिए मुख्य पाठ में ‘प्रकार’ या ‘विषय’ जोड़ने के बजाय संक्षिप्त, अपूर्ण संकेत बनाए रखा गया है।
- source_word: ἐπάξει
  choice: ले आएगा
  rationale: ἐπάγω के भविष्यकाल का अर्थ यहाँ किसी परिणाम को लाना या घटित कराना है; ‘ले आएगा’ स्वाभाविक हिन्दी है।
- source_word: ὀργήν
  choice: क्रोध
  rationale: यह शब्द गंभीर रोष अथवा दंडात्मक क्रोध का बोध करा सकता है। स्रोत में क्रोध किसका है, यह नहीं बताया गया, इसलिए हिन्दी में भी कोई कर्ता नहीं जोड़ा गया।
theological_decisions:
- issue: ‘क्रोध’ किसका है
  choice: मुख्य पाठ में क्रोध के धारक को अनिर्दिष्ट रखा गया
  alternative: परमेश्वर का क्रोध; दंड
  rationale: यूनानी पाठ केवल ὀργήν कहता है और परमेश्वर का नाम नहीं जोड़ता। संदर्भ में ईश्वरीय क्रोध संभव हो सकता है, पर उसे स्पष्ट कर देना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
- issue: ‘तीसरा’ का निहित संज्ञा-संदर्भ
  choice: संज्ञा जोड़े बिना ‘तीसरा’ रखा गया
  alternative: तीसरा प्रकार; तीसरी बात
  rationale: τὸ τρίτον संज्ञा के बिना प्रयुक्त हुआ है। ‘तीसरा प्रकार’ संभावित अर्थ है, पर मुख्य पाठ में उसे अनिवार्य करना मूल की संक्षिप्तता और अस्पष्टता को घटाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और ज्ञान-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘क्रोध’ सामान्य पाठक के लिए स्पष्ट है, जबकि किसी विशेष धार्मिक व्याख्या को नहीं थोपता।
