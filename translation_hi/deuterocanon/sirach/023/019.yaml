translation:
  language: hi
  text: और मनुष्यों की आँखों में उसका भय है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश असामान्य रूप से संक्षिप्त है और उसका पाठ भी अनिश्चित हो सकता है। इसका अर्थ यह भी समझा जा सकता है: “और वह मनुष्यों की आँखों से डरता है।”'
    reason: वैकल्पिक पाठ और मूल की अनिश्चितता को सुरक्षित रखना
lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: आँखों
  rationale: मूल संज्ञा का ठोस अर्थ ‘आँखें’ है। ‘दृष्टि’ या ‘निगाह’ करने से संक्षिप्त यूनानी बिंब की व्याख्या बढ़ जाती।
- source_word: ἀνθρώπων
  choice: मनुष्यों की
  rationale: यह ἄνθρωπος का संबंधकारक बहुवचन है और सामान्य रूप से मानवों को सूचित करता है; ‘मनुष्यों की’ मूल रूप और अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φόβος
  choice: भय
  rationale: ‘भय’ इस संज्ञा का सीधा और तटस्थ अर्थ है। ‘आतंक’ या ‘दहशत’ तीव्रता को अनावश्यक रूप से बढ़ाते।
- source_word: αὐτοῦ
  choice: उसका
  rationale: संबंधकारक सर्वनाम को निकट रूप से ‘उसका’ कहा गया है। अत्यंत संक्षिप्त वाक्यांश में इसका सटीक संबंध अस्पष्ट है, इसलिए मुख्य पाठ उसे व्याख्यात्मक ढंग से नहीं खोलता।
theological_decisions:
- issue: अत्यंत संक्षिप्त, क्रियारहित और संभवतः पाठगत रूप से अनिश्चित यूनानी वाक्यांश का अनुवाद
  choice: और मनुष्यों की आँखों में उसका भय है।
  alternative: और वह मनुष्यों की आँखों से डरता है।
  rationale: मुख्य पाठ उपलब्ध यूनानी शब्दक्रम और अंग्रेज़ी परामर्श-पाठ के नवीनतम निर्णय के निकट रहते हुए एक समझ में आने योग्य हिन्दी वाक्य देता है। फिर भी यूनानी को इस अर्थ में भी समझा जा सकता है कि मनुष्यों की निगाह ही उसके भय का कारण है; इस संभावना को पादटिप्पणी में रखा गया है, ताकि अस्पष्टता को चुपचाप हल न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मूल के ठोस ‘आँखों’ वाले बिंब को बनाए रखने वाला रूप। ‘मनुष्य’ यहाँ सामान्य रूप से मानवों के लिए है।
