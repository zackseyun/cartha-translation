  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: hi
  text: यह पुरुष नगर की चौड़ी सड़कों पर दण्ड पाएगा[a], और जहाँ उसे इसका अनुमान भी न था[b], वहीं वह पकड़ा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर के चौकों में”; यूनानी में नगर के चौड़े या खुले सार्वजनिक स्थानों का उल्लेख है, जिससे सार्वजनिक रूप से उजागर होने पर बल पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जहाँ उसे इसकी आशा न थी” अथवा “जहाँ उसने इसकी कल्पना न की थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: यह पुरुष
  rationale: यह संकेतवाचक शब्द पिछले प्रसंग के व्यभिचारी पुरुष की ओर लौटता है; ‘यह पुरुष’ उसके पुल्लिंग और संदर्भगत बल को स्पष्ट रखता है।
- source_word: ἐν πλατείαις πόλεως
  choice: नगर की चौड़ी सड़कों पर
  rationale: πλατεῖαι नगर के चौड़े मार्गों अथवा खुले सार्वजनिक स्थानों को सूचित करता है। यह अनुवाद सार्वजनिक दण्ड और अपमान की छवि बनाए रखता है।
- source_word: ἐκδικηθήσεται
  choice: दण्ड पाएगा
  rationale: यहाँ कर्मवाच्य क्रिया प्रतिशोध अथवा न्याय लागू किए जाने का भाव रखती है; प्रसंग में सहज हिन्दी ‘दण्ड पाएगा’ है, जो निजी बदले की अपेक्षा दण्डात्मक न्याय बताती है।
- source_word: οὗ
  choice: जहाँ…वहीं
  rationale: सम्बन्धवाचक क्रियाविशेषण स्थान या परिस्थिति बताता है; हिन्दी में ‘जहाँ…वहीं’ पकड़ लिए जाने की अनपेक्षित जगह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐχ ὑπενόησεν
  choice: उसे इसका अनुमान भी न होगा
  rationale: ὑπονοέω अनुमान लगाने, संदेह करने या पहले से भाँपने का अर्थ देता है। ‘अनुमान भी न होगा’ इस अनपेक्षितता को आधुनिक हिन्दी में सुरक्षित रखता है। यूनानी में भूतकाल है, पर भविष्यकालीन मुख्य क्रिया के साथ हिन्दी में भावी दृष्टिकोण अधिक स्वाभाविक है।
- source_word: πιασθήσεται
  choice: वह पकड़ा जाएगा
  rationale: भविष्यत् कर्मवाच्य रूप पकड़े, धर लिए या फँसा लिए जाने का भाव देता है; ‘पकड़ा जाएगा’ स्पष्ट और सामान्य हिन्दी है।
theological_decisions:
- issue: पुल्लिंग संकेतवाचक और क्रियाओं का संदर्भ
  choice: पद तत्कालीन प्रसंग के व्यभिचारी पुरुष की बात करता है, इसलिए ‘यह पुरुष’ और पुल्लिंग भाषा रखी गई है।
  alternative: लिंग-निरपेक्ष ‘यह व्यक्ति’
  rationale: यूनानी रूप पुल्लिंग हैं और निकटवर्ती प्रसंग एक विशिष्ट पुरुष की ओर संकेत करता है; लिंग-निरपेक्ष रूप मूल की विशिष्टता को कम कर देता।
- issue: ἐκδικηθήσεται का आशय
  choice: सार्वजनिक दण्डात्मक न्याय—‘दण्ड पाएगा’
  alternative: ‘उससे बदला लिया जाएगा’
  rationale: क्रिया में प्रतिशोध का शब्दार्थ संभव है, पर यहाँ निजी बदले को निश्चित करना आवश्यक नहीं। ‘दण्ड पाएगा’ न्यायपूर्ण प्रतिफल का भाव रखता है, बिना दण्ड देने वाले की पहचान जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘नगर’, ‘दण्ड’ और ‘अनुमान’ जैसे परिचित तत्सम शब्द ज्ञान-साहित्य के स्वर के अनुकूल हैं; वाक्य-संरचना सामान्य पाठक के लिए सीधी रखी गई है।
