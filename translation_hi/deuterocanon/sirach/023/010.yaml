base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a servant being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: hi
  text: क्योंकि जैसे लगातार जाँच-परख से गुज़रने वाला घर का दास मार के निशानों से नहीं बचेगा, वैसे ही जो लगातार शपथ खाता और नाम लेता रहता है[a], वह पाप से कभी शुद्ध नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और निरन्तर नाम का आह्वान करता है।” यूनानी में सम्भवतः शपथ खाते समय या अनादरपूर्ण वाणी में बार-बार परमेश्वर का नाम लेने की बात है।
    reason: ‘नाम लेने’ के सम्भावित ईश्वरीय सन्दर्भ और वैकल्पिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: οἰκέτης
  choice: घर का दास
  rationale: यह शब्द घराने के अधीन दास या सेवक को दर्शाता है। ‘घर का दास’ उसकी घरेलू भूमिका और पराधीन स्थिति—दोनों को बनाए रखता है।
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: लगातार जाँच-परख से गुज़रने वाला
  rationale: वर्तमान कृदन्त और ἐνδελεχῶς मिलकर एक बार की जाँच नहीं, बल्कि निरन्तर और गहन पड़ताल का भाव देते हैं।
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: चोटों से नहीं बचेगा
  rationale: μώλωψ मार से पड़े घाव, नील या चोट को सूचित करता है। यूनानी मुहावरे का स्वाभाविक हिन्दी अर्थ है कि ऐसा व्यक्ति चोटों से अछूता नहीं रहेगा।
- source_word: ὁ ὀμνύων
  choice: जो निरन्तर शपथ खाता
  rationale: वर्तमान कृदन्त आदतन या बार-बार शपथ खाने की क्रिया व्यक्त करता है; διὰ παντός के साथ ‘निरन्तर’ इस पहलू को स्पष्ट करता है।
- source_word: καὶ ὀνομάζων
  choice: और नाम लेता है
  rationale: शपथ के प्रसंग में इसका संकेत सम्भवतः परमेश्वर का नाम लेने या उसे पुकारने की ओर है, पर मूल पाठ केवल ‘नाम लेने’ कहता है; इसलिए मुख्य पाठ उस संक्षिप्तता और अस्पष्टता को बनाए रखता है।
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: वह पाप से कभी शुद्ध नहीं होगा
  rationale: οὐ μὴ प्रबल निषेध है और καθαρίζω नैतिक या धार्मिक शुद्धि का भाव देता है; ‘कभी ... नहीं’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘नाम लेने’ का आशय
  choice: मुख्य पाठ में केवल ‘नाम लेता है’, और पादटिप्पणी में सम्भावित ईश्वरीय सन्दर्भ
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर का नाम लेता है’
  rationale: शपथ के निकट प्रसंग में ईश्वरीय नाम का आह्वान सम्भावित है, पर καὶ ὀνομάζων में परमेश्वर स्पष्ट रूप से उल्लिखित नहीं है। अतः व्याख्या को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घर का दास’ प्राचीन घरेलू पराधीनता को छिपाता नहीं; ‘जाँच-परख’ और ‘चोटों से नहीं बचेगा’ यूनानी तुलना को स्वाभाविक हिन्दी में व्यक्त करते हैं। पादटिप्पणी का चिह्न उसी वाक्यांश पर लगाया गया है जिससे उसका वास्तविक सम्बन्ध है।
