base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: hi
  text: बार-बार शपथ खाने वाला मनुष्य अधर्म से भर जाएगा, और उसके घर से कोड़ा[a] न हटेगा। यदि वह चूक करे[b], तो उसका पाप उसी पर रहेगा; और यदि वह उसे अनदेखा कर दे, तो उसने दुगुना पाप किया है। और यदि वह व्यर्थ शपथ खाए[c], तो वह निर्दोष न ठहराया जाएगा, क्योंकि उसका घर विपत्तियों[d] से भर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ शाब्दिक रूप से ‘कोड़ा’ और रूपक रूप से दंड का ‘प्रकोप’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यदि वह अपराध करे’ अथवा ‘यदि उससे कोई दोष हो जाए।’ यूनानी शब्द दोष या चूक करने को दर्शाता है, पर यह अपने आप में उसे अनजाने में किया गया पाप नहीं बताता।
    reason: lexical_alternative
  - marker: c
    text: या ‘यदि वह झूठी शपथ खाए’ अथवा ‘खोखली शपथ खाए।’ यूनानी में शाब्दिक भाव ‘खालीपन के द्वारा शपथ खाना’ है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ प्रयुक्त यूनानी शब्द कठिन है; इसका आशय घर पर आने वाली या लाई गई मुसीबतों, दंडों अथवा विपत्तियों से हो सकता है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: बहुत शपथ खाने वाला मनुष्य
  rationale: πολύορκος ऐसे व्यक्ति को दर्शाता है जिसकी पहचान बार-बार या बहुत शपथ खाने से होती है। यह रूप हिन्दी में स्वाभाविक है और ἀνήρ के एक प्रतिनिधि पुरुष/मनुष्य के अर्थ को बनाए रखता है।
- source_word: πλησθήσεται ἀνομίας
  choice: अधर्म से भर जाएगा
  rationale: ἀνομία नैतिक व्यवस्था या विधि के उल्लंघन का भाव रखता है; ‘अधर्म’ उसके नैतिक भार को संक्षिप्त और परिचित हिन्दी में व्यक्त करता है।
- source_word: μάστιξ
  choice: कोड़ा
  rationale: शब्द का मूल अर्थ कोड़ा है और रूपकतः दंड या प्रकोप भी हो सकता है। मुख्य पाठ में मूर्त बिंब रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: πλημμελήσῃ
  choice: चूक करे
  rationale: क्रिया दोष करने, गलती करने या अपराध करने को सूचित कर सकती है। ‘चूक करे’ जानबूझकर अथवा अनजाने पाप का निर्णय किए बिना इसकी कुछ अर्थगत खुलावट बनाए रखता है।
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: उसका पाप उसी पर रहेगा
  rationale: यह यूनानी के ठोस मुहावरे और व्यक्ति पर रहने वाले उत्तरदायित्व दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑπερίδῃ
  choice: उसे अनदेखा कर दे
  rationale: यह अपने किए दोष की उपेक्षा करने या उसे गंभीरता से न लेने का भाव व्यक्त करता है।
- source_word: ἥμαρτεν δισσῶς
  choice: उसने दुगुना पाप किया है
  rationale: δισσῶς दोष के दोगुना हो जाने को व्यक्त करता है; हिन्दी वाक्य मूल के पूर्ण क्रियारूप और बढ़े हुए उत्तरदायित्व को रखता है।
- source_word: διὰ κενῆς ὤμοσεν
  choice: व्यर्थ शपथ खाई हो
  rationale: वाक्यांश का शाब्दिक संबंध ‘खालीपन’ से है। ‘व्यर्थ शपथ’ असार, निराधार या झूठी शपथ के बीच मौजूद अर्थगत खुलावट को बनाए रखती है।
- source_word: οὐ δικαιωθήσεται
  choice: निर्दोष न ठहराया जाएगा
  rationale: यहाँ क्रिया न्यायिक अथवा नैतिक रूप से सही या दोषमुक्त ठहराए जाने की बात करती है। यह हिन्दी में स्पष्ट है और बाद की धर्मवैज्ञानिक तकनीकी शब्दावली को अनावश्यक रूप से आरोपित नहीं करती।
- source_word: ἐπαγωγῶν
  choice: विपत्तियों
  rationale: यह दुर्लभ और संदर्भगत रूप से कठिन पद घर पर लाई गई मुसीबतों, दंडों या प्रकोपों की ओर संकेत करता है। ‘विपत्तियाँ’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करती।
theological_decisions:
- issue: δικαιωθήσεται का न्यायिक और नैतिक बल
  choice: वह निर्दोष न ठहराया जाएगा
  alternative: वह धर्मी न ठहराया जाएगा
  rationale: शपथ, दोष और दंड का निकट संदर्भ दोषमुक्ति या न्यायिक समर्थन की ओर संकेत करता है। ‘निर्दोष न ठहराया जाएगा’ इस अर्थ को व्यक्त करता है, पर इसे बाद की किसी विशिष्ट धर्मसैद्धांतिक व्यवस्था से नहीं बाँधता।
- issue: πλημμελήσῃ में दोष की अभिप्रेरणा
  choice: यदि वह चूक करे
  alternative: यदि वह अनजाने में पाप करे
  rationale: यूनानी क्रिया अपने आप में अनजाने पाप का स्पष्ट दावा नहीं करती। इसलिए अनिच्छितता को मुख्य पाठ में जोड़ने के बजाय व्यापक अर्थ रखा गया है।
