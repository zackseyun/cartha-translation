  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शपथ खाना’, ‘अधर्म’, ‘कोड़ा’ और ‘निर्दोष ठहराया जाना’ जैसे परिचित पद मूल के नैतिक और न्यायिक स्वर को बनाए रखते हैं। कठिन या बहुअर्थी पदों को मुख्य पाठ में अति-व्याख्यायित न करके पादटिप्पणियों में विकल्प दिए गए हैं।
