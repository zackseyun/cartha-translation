  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: hi
  text: इसी प्रकार वह स्त्री भी, जो अपने पति को छोड़ देती है और दूसरे पुरुष से उत्पन्न वारिस प्रस्तुत करती है;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “किसी पराए से।” यूनानी वाक्यांश विवाह-संबंध से बाहर के व्यक्ति की ओर संकेत करता है; यहाँ संदर्भ में “दूसरे पुरुष से” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पद पिछले कथन से तुलना और संबंध जोड़ता है; हिन्दी में विभक्त अभिव्यक्ति स्वाभाविक है।
- source_word: γυνὴ
  choice: वह स्त्री
  rationale: γυνή का अर्थ स्त्री या पत्नी हो सकता है; आगे 'अपने पति' आने से वैवाहिक संदर्भ स्पष्ट है, जबकि 'स्त्री' मूल की शब्दगत व्यापकता रखता है।
- source_word: καταλιποῦσα
  choice: जो ... छोड़ देती है
  rationale: अओरिस्ट कृदन्त को सामान्य वर्णनात्मक हिन्दी उपवाक्य में रखा गया है; 'त्याग देती है' की अपेक्षा यह अनावश्यक अतिरिक्त नैतिक तीव्रता नहीं जोड़ता।
- source_word: τὸν ἄνδρα
  choice: अपने पति को
  rationale: इस वैवाहिक संदर्भ में ἀνήρ पति को सूचित करता है; हिन्दी में संबंधवाचक 'अपने' स्वाभाविक और स्पष्ट है।
- source_word: παριστῶσα
  choice: सामने लाती है
  rationale: यह παρίστημι के प्रस्तुत करने या सामने खड़ा करने के भाव को बनाए रखता है और वारिस के कानूनी-पारिवारिक संदर्भ को अति-व्याख्यायित नहीं करता।
- source_word: κληρονόμον
  choice: वारिस
  rationale: यह उत्तराधिकार पाने वाले व्यक्ति के लिए सामान्य, संक्षिप्त और आधुनिक हिन्दी शब्द है।
- source_word: ἐξ ἀλλοτρίου
  choice: दूसरे पुरुष से उत्पन्न
  rationale: शाब्दिक भाव 'किसी दूसरे/पराए से' है। हिन्दी में यह चयन विवाह से बाहर के पितृत्व को स्पष्ट करता है, जबकि 'अजनबी' अनजान व्यक्ति होने का भ्रामक अर्थ दे सकता है।
theological_decisions:
- issue: व्यभिचार और विवाह से बाहर उत्पन्न वारिस से संबंधित नैतिक-कानूनी आशय
  choice: स्त्री के पति को छोड़ने और दूसरे पुरुष से उत्पन्न वारिस को सामने लाने का सीधा वर्णन
  alternative: पति को त्यागने वाली व्यभिचारिणी, जो पराए पुरुष का पुत्र वारिस ठहराती है
  rationale: यूनानी पाठ कर्मों का वर्णन करता है, पर इस पद में स्त्री को स्पष्ट रूप से 'व्यभिचारिणी' नहीं कहता। इसलिए अनुवाद नैतिक उपाधि या 'पुत्र' जैसी अनुल्लिखित विशिष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्यांत का अर्धविराम स्रोत-पाठ और दिए गए खंड के अगले संदर्भ से जुड़े होने का संकेत बनाए रखता है।
