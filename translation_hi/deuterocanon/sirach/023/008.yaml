  text: By his lips the sinner will be caught[a], and the reviler and the proud will stumble by them.
translation:
  language: hi
  text: पापी अपने होंठों से फँस जाएगा[a], और निंदा करने वाला और घमंडी उन्हीं से ठोकर खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापी अपने होंठों में छोड़ दिया जाएगा।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “छोड़ दिया जाएगा” या “पीछे छोड़ दिया जाएगा” हो सकता है; यहाँ सम्भवतः आशय है कि पापी अपनी ही बातों से फँस या बरबाद हो जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: अपने ही होंठों से
  rationale: यहाँ ἐν साधन का भाव व्यक्त कर सकता है। ‘होंठ’ वाणी की ठोस छवि बनाए रखता है, और ‘अपने ही’ αὐτοῦ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: καταλειφθήσεται
  choice: फँस जाएगा
  rationale: क्रिया का मूल अर्थ ‘छोड़ दिया जाएगा’ या ‘पीछे रह जाएगा’ है, पर होंठों के उल्लेख और समानांतर ‘ठोकर खाएँगे’ के संदर्भ में अपने कथन से फँसने या विनाश में पड़ने का भाव सम्भावित है। पाठ की वास्तविक शब्दार्थगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἁμαρτωλός
  choice: पापी
  rationale: एकवचन संज्ञात्मक विशेषण को नीतिवचन-सदृश सामान्य कथन के रूप में संक्षिप्त और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: λοίδορος
  choice: निन्दा करनेवाला
  rationale: यह अपमानजनक या कटु वचन बोलनेवाले व्यक्ति को दर्शाता है। यह आधुनिक पाठक के लिए ‘निन्दक’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ὑπερήφανος
  choice: घमण्डी
  rationale: अहंकारी आत्म-उत्कर्ष का नैतिक भाव सामान्य आधुनिक हिन्दी में साफ़ व्यक्त होता है।
- source_word: σκανδαλισθήσονται
  choice: ठोकर खाएँगे
  rationale: मूल रूपक को बनाए रखते हुए विफल होने या अपने ही वचनों के कारण गिरने का भाव देता है; बाद के किसी तकनीकी धर्मशास्त्रीय अर्थ को आरोपित नहीं करता।
- source_word: ἐν αὐτοῖς
  choice: उन्हीं के कारण
  rationale: बहुवचन सर्वनाम का स्वाभाविक संकेत पहले आए ‘होंठों’—अर्थात उनसे निकले वचनों—की ओर है। कारण अथवा साधन का भाव हिन्दी में स्पष्ट किया गया है।
