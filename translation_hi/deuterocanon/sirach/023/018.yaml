  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: hi
  text: जो पुरुष अपने बिछौने की मर्यादा लाँघता है[a], वह अपने मन में कहता है, “मुझे कौन देखता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “अपने बिछौने से अतिक्रमण/भटकाव करने वाला।” इस प्रसंग में यह संकेतात्मक रूप से अपनी विवाह-शय्या के प्रति अविश्वासयोग्य होने, अर्थात यौन पाप, की ओर इशारा करता है।
    reason: मूल के ‘बिछौने’ संबंधी संकेतात्मक पदबंध तथा παραβαίνων के अतिक्रमण के नैतिक भाव को स्पष्ट करना, बिना मुख्य पाठ में व्यभिचार को प्रत्यक्ष और निश्चित रूप से कहे।
lexical_decisions:
- source_word: ἄνθρωπος
  choice: पुरुष
  rationale: यह शब्द यहाँ एकवचन और व्याकरण की दृष्टि से पुल्लिंग व्यक्ति को प्रस्तुत करता है; प्रसंग में किसी सामान्य अमूर्त ‘मनुष्यजाति’ की नहीं, एक पुरुष की बात है।
- source_word: παραβαίνων
  choice: भटकता है
  rationale: कृदन्त में सीमा लाँघने, उल्लंघन करने या पथ से हटने का नैतिक भाव है। ‘भटकता है’ बिछौने से जुड़े संकेतात्मक कथन को स्वाभाविक हिन्दी में रखते हुए उसके नैतिक विचलन को भी बनाए रखता है।
- source_word: ἀπὸ τῆς κλίνης αὐτοῦ
  choice: अपने बिछौने से
  rationale: κλίνη का सामान्य अर्थ बिछौना या शय्या है। मूल यूनानी यहाँ सीधे ‘व्यभिचार’ नहीं कहता, इसलिए मुख्य पाठ में संकेतात्मक भाषा सुरक्षित रखी गई है।
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: अपने मन में कहता है
  rationale: यह अपने भीतर कही गई बात का यूनानी मुहावरा है। ‘अपने मन में’ आधुनिक हिन्दी में स्वाभाविक है और आंतरिक वचन का अर्थ स्पष्ट करता है; यहाँ ψυχή का शाब्दिक ‘प्राण/आत्मा’ अनावश्यक रूप से अस्वाभाविक होता।
- source_word: Τίς με ὁρᾷ;
  choice: मुझे कौन देखता है?
  rationale: यह वर्तमान काल का सीधा प्रश्न है और बोलने वाले की इस धारणा को बनाए रखता है कि उसका काम छिपा हुआ है।
theological_decisions:
- issue: क्या यौन या वैवाहिक संकेत को मुख्य पाठ में स्पष्ट कर दिया जाए
  choice: मुख्य पाठ में ‘अपने बिछौने से भटकता है’ जैसी संकेतात्मक भाषा रखना
  alternative: ‘अपनी विवाह-शय्या छोड़ता है’ या ‘व्यभिचार करता है’
  rationale: आसपास का प्रसंग छिपे हुए यौन पाप की ओर प्रबल संकेत करता है, पर इस वाक्यांश में यूनानी सीधे व्यभिचार का शब्द नहीं रखता। इसलिए अनुवाद मूल की व्यंजना और अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘बिछौना’ सामान्य पाठक के लिए ‘शय्या’ से अधिक स्वाभाविक है, जबकि ‘पुरुष’ प्रसंग के पुल्लिंग पात्र को स्पष्ट रखता है।
