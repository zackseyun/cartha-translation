base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: hi
  text: अपने पिता और अपनी माता को स्मरण रखो, क्योंकि तुम प्रभावशाली पुरुषों के बीच बैठते हो; कहीं ऐसा न हो कि उनके सामने तुम अपने-आपको भूल जाओ[a], और अपनी आदत के कारण मूर्ख बन जाओ, और चाहो कि तुम जन्मे ही न होते, और अपने जन्म के दिन को कोसो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके सामने तुम भुला दिए जाओ।” यूनानी क्रियारूप को कर्मवाच्य अथवा आत्मवाच्य ढंग से समझा जा सकता है; प्रसंग में आत्मवाच्य अर्थ अपने ऊपर से संयम खो देने की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  choice: स्मरण रखो
  rationale: आज्ञार्थक क्रिया सक्रिय रूप से याद रखने का आह्वान करती है; यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πατρὸς καὶ μητρός σου
  choice: अपने पिता और अपनी माता को
  rationale: यूनानी पाठ दोनों माता-पिता का अलग-अलग उल्लेख करता है; अनुवाद उसी ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: बड़े पदाधिकारियों के बीच
  rationale: μεγιστάνων ऊँचे सामाजिक पद या प्रभाव वाले पुरुषों को सूचित करता है। 'बड़े पदाधिकारी' सामाजिक हैसियत स्पष्ट करता है, जबकि 'महान पुरुष' नैतिक महानता का अनचाहा संकेत दे सकता है।
- source_word: συνεδρεύει
  choice: बैठते हो
  rationale: क्रिया साथ या सभा में बैठने का अर्थ देती है; आसपास का वाक्यांश औपचारिक सामाजिक परिवेश स्पष्ट कर देता है।
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: उनके सामने तुम अपने-आपको भूल जाओ
  rationale: संदर्भ में यह प्रतिष्ठित लोगों के सामने आत्मसंयम या उचित मर्यादा खो देने की चेतावनी है। यूनानी रूप की वैकल्पिक कर्मवाच्य समझ को पादटिप्पणी में रखा गया है।
- source_word: τῷ ἐθισμῷ σου
  choice: अपनी आदत के कारण
  rationale: ἐθισμός अभ्यास से बनी आदत या अभ्यस्त व्यवहार को दर्शाता है; संबंधकारक भाव को 'के कारण' से स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: μωρανθῇς
  choice: मूर्ख बन जाओ
  rationale: क्रिया का परिणामसूचक भाव किसी के मूर्ख हो जाने या मूर्ख सिद्ध होने को दर्शाता है।
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: चाहो कि तुम जन्मे ही न होते
  rationale: यह जन्म न लेने की तीव्र इच्छा या पछतावे की मुहावरेदार हिंदी अभिव्यक्ति है।
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου
  choice: अपने जन्म के दिन
  rationale: τοκετός यहाँ जन्म की घटना को दर्शाता है; 'जन्म का दिन' स्पष्ट और स्वाभाविक है।
- source_word: μὴ καταράσῃ
  choice: और अपने जन्म के दिन को कोसो
  rationale: यह μή ποτε से आरंभ हुई आशंकित परिणामों की शृंखला का अंतिम अंग है; इसलिए हिंदी में सकारात्मक क्रियारूप उस निषेधात्मक आशंका के अधीन रहता है।
theological_decisions:
- issue: μεγιστάνων का सामाजिक और लिंग-सूचक अर्थ
  choice: बड़े पदाधिकारियों
  alternative: बड़े पुरुषों / कुलीनों
  rationale: शब्द शक्तिशाली या ऊँचे पद वाले पुरुषों के वर्ग को सूचित करता है। चुना हुआ हिंदी पद सामाजिक श्रेणी को प्रमुखता देता है और नैतिक महानता का अर्थ नहीं जोड़ता; इसका पुल्लिंग रूप प्राचीन सार्वजनिक परिवेश के अनुरूप है।
- issue: ἐπιλαθῇ ἐνώπιον αὐτῶν की अस्पष्टता
  choice: उनके सामने तुम अपने-आपको भूल जाओ
  alternative: उनके सामने तुम्हें भुला दिया जाए / तुम उनकी दृष्टि में भुला दिए जाओ
  rationale: यूनानी रूप को कर्मवाच्य ढंग से समझना संभव है, पर प्रसंग आत्मसंयम और मर्यादा खोने के आत्मवाचक अर्थ का समर्थन करता है। वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण ज्ञान-साहित्यीय स्वर रखा गया है। वाक्य को एक सतत चेतावनी के रूप में संरक्षित किया गया है और अस्पष्ट यूनानी पद को अत्यधिक व्याख्यायित करने के बजाय पादटिप्पणी में वैकल्पिक अर्थ दिया गया है।
