base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: hi
  text: पेट की लालसा और संभोग मुझ पर हावी न हों[a], और मुझे निर्लज्ज मन के हवाले न कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘यौन-संबंध’ या ‘यौन-संयोग’ भी हो सकता है। यहाँ आसपास की प्रार्थना का संदर्भ अनियंत्रित शारीरिक इच्छाओं से बचाए जाने का है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मुझे निर्लज्ज आत्मा [या प्राण] के हवाले न कर।’ यहाँ ‘आत्मा/प्राण’ व्यक्ति के भीतरी स्वभाव या स्वयं व्यक्ति का भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: पेट की लालसा
  rationale: κοιλία यहाँ पेट अथवा उदर और ὄρεξις शारीरिक भूख या इच्छा को व्यक्त करता है। ‘पेट की लालसा’ मूल बिंब को बनाए रखते हुए सामान्य आधुनिक हिन्दी में समझ में आता है।
- source_word: συνουσιασμός
  choice: संभोग की कामना
  rationale: यह शब्द यौन-संयोग या संभोग को सूचित करता है। समानांतर रचना और दुर्वासना से बचाने की प्रार्थना के संदर्भ में ‘की कामना’ जोड़ने से हिन्दी में उस आवेग का भाव स्वाभाविक रूप से व्यक्त होता है, जबकि पादटिप्पणी अधिक निरपेक्ष अर्थ सुरक्षित रखती है।
- source_word: μὴ καταλαβέτωσάν με
  choice: मुझ पर हावी न हों
  rationale: καταλαμβάνω यहाँ पकड़ लेने, काबू कर लेने या वश में कर लेने का भाव देता है। ‘हावी न हों’ दोनों कर्ताओं के साथ सहज हिन्दी है और मनुष्य के इन इच्छाओं से पराजित होने का आशय रखता है।
- source_word: ψυχὴ ἀναιδεῖ
  choice: निर्लज्ज मन
  rationale: ψυχή का शाब्दिक अर्थ ‘प्राण/आत्मा’ है, पर यहाँ यह भीतरी स्वभाव या अंतर्मन को सूचित कर सकता है। ‘निर्लज्ज मन’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: μὴ παραδῷς με
  choice: मुझे ... के हवाले न कर
  rationale: παραδίδωμι सौंप देने या किसी के अधिकार में कर देने को व्यक्त करता है। ‘के हवाले न कर’ इस अधीनता के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: συνουσιασμός का नैतिक बल
  choice: मुख्य पाठ में ‘संभोग की कामना’
  alternative: ‘संभोग’ या ‘यौन-संबंध’
  rationale: यूनानी शब्द अपने आप में यौन-संयोग को अपेक्षाकृत निरपेक्ष ढंग से कह सकता है, किंतु इस प्रार्थना में वक्ता उस पर हावी होने वाली शारीरिक इच्छा से मुक्ति माँगता है। चुना हुआ रूप संदर्भगत नैतिक चिंता दिखाता है, पर ‘व्यभिचार’ जैसा अधिक संकीर्ण या दोषारोपक अर्थ नहीं जोड़ता।
- issue: ψυχή का मानव-स्वरूप संबंधी अर्थ
  choice: मुख्य पाठ में ‘मन’ और पादटिप्पणी में शाब्दिक ‘आत्मा/प्राण’
  alternative: मुख्य पाठ में ‘निर्लज्ज आत्मा’
  rationale: यहाँ ψυχή को किसी अलग सत्ता के रूप में लेना आवश्यक नहीं; वह व्यक्ति के भीतर के स्वभाव या स्वयं व्यक्ति को सूचित कर सकता है। ‘मन’ हिन्दी में वाक्य को बोधगम्य रखता है, जबकि पादटिप्पणी मूल की मानव-स्वरूप संबंधी शब्दावली और उसकी वास्तविक अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘हावी न हों’ तथा ‘हवाले न कर’ सामान्य पाठक के लिए सहज हैं, जबकि पादटिप्पणियाँ συνουσιασμός और ψυχή की शब्दार्थगत व्यापकता तथा अस्पष्टता को सुरक्षित रखती हैं।
