base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: hi
  text: क्योंकि पहले तो उसने परमप्रधान की व्यवस्था की अवज्ञा की; दूसरे, उसने अपने पति के विरुद्ध अपराध किया; और तीसरे, उसने यौन अनैतिकता में व्यभिचार किया और दूसरे पुरुष से बच्चे जने।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और दूसरे पुरुष से उत्पन्न बच्चों को प्रस्तुत किया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: पहले तो ... दूसरे ... और तीसरे
  rationale: यूनानी पाठ की स्पष्ट त्रिस्तरीय गणना और γάρ के कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν νόμῳ Ὑψίστου
  choice: परमप्रधान की व्यवस्था
  rationale: Ὑψίστος को बिना ‘परमेश्वर’ जोड़े प्रचलित ईश्वरीय उपाधि ‘परमप्रधान’ से और νόμος को प्रसंगानुकूल ‘व्यवस्था’ से व्यक्त किया गया है।
- source_word: ἠπείθησεν
  choice: अवज्ञा की
  rationale: अओरिस्ट क्रिया का सीधा अर्थ आज्ञा न मानना है; ‘अवज्ञा की’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: εἰς ἄνδρα ἑαυτῆς ἐπλημμέλησεν
  choice: अपने पति के विरुद्ध अपराध किया
  rationale: पति के संबंध में किए गए दोष को व्यक्त करता है, पर इसे अगले खंड में स्पष्ट किए गए व्यभिचार के साथ समय से पहले एक नहीं करता।
- source_word: ἐν πορνείᾳ
  choice: यौन अनैतिकता में
  rationale: πορνεία के व्यापक अर्थ को आधुनिक और समझने योग्य हिन्दी में रखता है; इसे वेश्यावृत्ति जैसे संकुचित अर्थ तक सीमित नहीं करता।
- source_word: ἐμοιχεύθη
  choice: व्यभिचार किया
  rationale: रूप निष्क्रिय/मध्य है, किंतु प्रसंग में अर्थ स्त्री द्वारा व्यभिचार करने का है; हिन्दी का सक्रिय प्रयोग सबसे स्पष्ट है।
- source_word: ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν
  choice: दूसरे पुरुष से उत्पन्न बच्चों को सामने लाई
  rationale: ἀλλότριος को यहाँ पति से भिन्न पुरुष के अर्थ में और παρίστημι के ‘सामने लाना/प्रस्तुत करना’ भाव को सुरक्षित रखता है; ‘उत्पन्न’ पितृत्व-संबंध स्पष्ट करता है।
theological_decisions:
- issue: तीन आरोपों की नैतिक प्रगति
  choice: ईश्वरीय व्यवस्था की अवज्ञा, पति के विरुद्ध अपराध, और फिर यौन अनैतिकता में व्यभिचार तथा दूसरे पुरुष से बच्चों की उत्पत्ति—इन तीनों को अलग रखा गया।
  alternative: दूसरे और तीसरे खंड को वैवाहिक बेवफाई के एक ही आरोप में मिला देना।
  rationale: यूनानी पाठ जानबूझकर तीन अपराध गिनाता है; उन्हें अलग रखने से उसकी अलंकारिक और नैतिक प्रगति बनी रहती है।
- issue: Ὑψίστου का अनुवाद
  choice: परमप्रधान
  alternative: सर्वोच्च; परमप्रधान परमेश्वर
  rationale: यह ईश्वरीय उपाधि का स्वाभाविक हिन्दी अनुवाद है और मूल में न आए ‘परमेश्वर’ को नहीं जोड़ता।
- issue: ἐπλημμέλησεν और ἐμοιχεύθη का संबंध
  choice: ‘अपराध किया’ और ‘व्यभिचार किया’ को अलग आरोपों के रूप में रखा गया।
  alternative: पहले ही आरोप को ‘पति से बेवफाई की’ कहना।
  rationale: व्यापक दोष-सूचक क्रिया को व्यभिचार तक सीमित करने से तीसरे खंड की स्पष्टता और त्रिस्तरीय संरचना धुंधली हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परमप्रधान’, ‘व्यवस्था’, ‘अवज्ञा’, ‘यौन अनैतिकता’ और ‘व्यभिचार’ जैसे प्रचलित धार्मिक-नैतिक शब्द चुने गए हैं। फुटनोट-चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वैकल्पिक प्रस्तुति दी गई है।
