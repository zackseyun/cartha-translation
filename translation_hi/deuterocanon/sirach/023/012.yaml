base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: hi
  text: एक ऐसी उक्ति है जो मृत्यु से लिपटी हुई[a] है; वह याकूब की विरासत में न पाई जाए। क्योंकि ये सब बातें भक्त जनों से दूर हो जाएँगी, और वे पापों में नहीं लोटेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु से लिपटी हुई’ का अनुवाद ‘मृत्यु से आच्छादित’ या ‘मृत्यु से चारों ओर घिरी हुई’ भी हो सकता है। यूनानी में ऐसी वाणी का चित्र है जो मृत्यु से आवृत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέξις
  choice: उक्ति
  rationale: यहाँ शब्द किसी बोली गई अभिव्यक्ति या कथन को सूचित करता है। ‘उक्ति’ एकवचन और वाणी-संबंधी अर्थ दोनों को बनाए रखती है।
- source_word: ἀντιπεριβεβλημένη θανάτῳ
  choice: मृत्यु से लिपटी हुई
  rationale: कृदंत चारों ओर से ढके या आवृत होने का सजीव बिंब देता है; यह अनुवाद उस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ εὑρεθήτω
  choice: न पाई जाए
  rationale: यह तीसरे पुरुष की निषेधात्मक आज्ञा/कामना का भाव सुरक्षित रखता है।
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  choice: याकूब की विरासत में
  rationale: ‘विरासत’ सामुदायिक और वाचागत संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
- source_word: εὐσεβῶν
  choice: भक्त जनों
  rationale: यह श्रद्धालु और परमेश्वर-भक्त लोगों का बोध आधुनिक, सम्मानजनक हिन्दी में कराता है।
- source_word: ταῦτα πάντα ἀποστήσεται
  choice: ये सब बातें ... दूर हो जाएँगी
  rationale: यूनानी में ‘ये सब’ कर्ता है और भविष्यकालीन क्रिया अलग हो जाने या दूर हट जाने को व्यक्त करती है।
- source_word: ἐν ἁμαρτίαις οὐκ ἐγκυλισθήσονται
  choice: वे पापों में नहीं लोटेंगे
  rationale: ‘लोटेंगे’ पापों में लिप्त होकर पड़े रहने के तीखे यूनानी बिंब और ‘पापों’ के बहुवचन को बनाए रखता है।
theological_decisions:
- issue: ‘याकूब की विरासत’ की पहचान
  choice: मूल वाचागत-सामुदायिक पदबंध को यथावत रखना
  alternative: इसे स्पष्ट रूप से केवल जातीय इस्राएल या सामान्यतः धर्मियों के लिए प्रयुक्त रूपक बताना
  rationale: पाठ स्वयं दायरे को और स्पष्ट नहीं करता; इसलिए बाद की धर्मवैज्ञानिक पहचान आरोपित किए बिना इसकी तनावपूर्ण व्यापकता सुरक्षित रखी गई है।
- issue: ἀποστήσεται का कर्ता
  choice: ‘ये सब बातें’ को व्याकरणिक कर्ता रखना
  alternative: ‘भक्त जन इन सब बातों से दूर रहेंगे’
  rationale: वैकल्पिक रूप अर्थ की दृष्टि से सहज है, पर यूनानी वाक्य-विन्यास में ‘ये सब बातें’ कर्ता हैं; अनुवाद उसी अस्पष्ट/असामान्य संरचना को पठनीय रूप में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुलभ शैली। ‘उक्ति’ प्रसंग की वाणी-संबंधी एकवचन संज्ञा को रखती है; ‘लोटेंगे’ जानबूझकर तीखा और दृश्यात्मक है। पादटिप्पणी-चिह्न संबंधित रूपक वाले पहले वाक्य के अंत में रखा गया है।
