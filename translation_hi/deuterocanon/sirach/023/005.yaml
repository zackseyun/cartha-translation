lexical_decisions:
- source_word: ἐπιθυμίαν
  choice: लालसा
  rationale: यह शब्द प्रबल इच्छा को दर्शाता है और प्रसंग में उसका नैतिक रूप से नकारात्मक भाव है। ‘लालसा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करती है, पर इसे केवल यौन वासना तक सीमित नहीं करती।
- source_word: ἀπόστρεψον
  choice: दूर कर दे
  rationale: यूनानी क्रिया किसी वस्तु को वक्ता से फेर देने की निर्णायक विनती व्यक्त करती है। ‘दूर कर दे’ हिन्दी में स्वाभाविक है और अलग किए जाने की मूल छवि बनाए रखता है।
- source_word: ἀπʼ ἐμοῦ
  choice: मुझसे
  rationale: यह पद वक्ता से अलगाव को दर्शाता है। ‘मुझसे दूर कर दे’ मूल अर्थ का सहज हिन्दी रूप है और ‘मेरे भीतर से’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वाक्य से प्रार्थना को आगे बढ़ाता है; साधारण संयोजक ‘और’ इस संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: ἐπιθυμία का नैतिक और अर्थगत दायरा
  choice: इसे ‘लालसा’ अनूदित किया गया है, जो नकारात्मक प्रबल इच्छा को व्यक्त करता है पर केवल यौन वासना तक सीमित नहीं है।
  alternative: ‘वासना’, ‘अभिलाषा’ या ‘प्रबल इच्छा’
  rationale: यूनानी संज्ञा व्यापक अर्थ में प्रबल इच्छा बता सकती है और प्रसंग में नैतिक रूप से नकारात्मक है। ‘वासना’ इसे अनावश्यक रूप से यौन अर्थ तक सीमित कर सकती है, जबकि ‘अभिलाषा’ यहाँ अपेक्षाकृत सकारात्मक या तटस्थ सुनाई दे सकती है।
translation_notes:
