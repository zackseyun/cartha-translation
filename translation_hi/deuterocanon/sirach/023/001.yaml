translation:
  language: hi
  text: हे प्रभु, मेरे जीवन के पिता और स्वामी, उनकी योजना में मुझे न छोड़; मुझे उनके बीच गिरने न दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πάτερ καὶ δέσποτα ζωῆς μου
  choice: मेरे जीवन के पिता और स्वामी
  rationale: दोनों उपाधियों—‘पिता’ और ‘स्वामी’—को बनाए रखता है और ζωῆς μου के सम्बन्ध को सहज हिन्दी में व्यक्त करता है।
- source_word: βουλῇ αὐτῶν
  choice: उनकी युक्ति के वश में
  rationale: βουλή यहाँ सलाह, योजना या षड्यंत्र का अर्थ दे सकता है; ‘युक्ति’ इस नकारात्मक संदर्भ को बिना अत्यधिक स्पष्ट किए बनाए रखती है, और ‘के वश में’ ἐν के प्रसंगगत भाव को व्यक्त करता है।
- source_word: πεσεῖν ἐν αὐτοῖς
  choice: उनके कारण गिरने
  rationale: ἐν αὐτοῖς का सटीक सम्बन्ध अस्पष्ट है; यह ‘उनके बीच’, ‘उनके हाथों’ या ‘उनके कारण’ हो सकता है। ‘उनके कारण’ अंग्रेज़ी परामर्श-पाठ के ‘by them’ के निकट रहते हुए कारण/माध्यम की अस्पष्टता को काफी हद तक बचाता है।
theological_decisions:
- issue: परमेश्वर के लिए संयुक्त सम्बोधन
  choice: ‘पिता’ और ‘स्वामी’ दोनों को समान रूप से सुरक्षित रखा गया
  alternative: किसी एक उपाधि को दूसरी की व्याख्या मानना
  rationale: यूनानी पाठ दोनों उपाधियों को καὶ से जोड़ता है; किसी एक को कम करना पाठ के धार्मिक तनाव और पूर्णता को घटाता।
- issue: ‘उनके’ का अस्पष्ट पूर्वसंदर्भ
  choice: सर्वनाम को बिना पहचान बताए बनाए रखा गया
  alternative: इसे शत्रुओं, पापों या प्रलोभनों के रूप में स्पष्ट करना
  rationale: इस पद में αὐτῶν/αὐτοῖς का स्पष्ट संज्ञात्मक पूर्वसंदर्भ नहीं दिया गया; अनुवाद में कोई निजी व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। एकवचन सम्बोधन में ‘न छोड़’ और ‘न दे’ मूल प्रार्थना की सीधी निकटता बनाए रखते हैं।
