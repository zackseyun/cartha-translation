translation:
  language: hi
  text: सब कुछ के सृजे जाने से पहले ही उसे यह ज्ञात था[a]; और सब कुछ पूरा हो जाने के बाद भी ज्ञात है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब कुछ के सृजे जाने से पहले ही वह इसे जानता था; और सब कुछ पूरा हो जाने के बाद भी।” यूनानी क्रियारूप ἔγνωσται का अनुवाद एक से अधिक प्रकार से किया जा सकता है, यद्यपि पहले से पूर्ण ज्ञान का भाव स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ
  choice: से पहले ही
  rationale: यह कालगत पूर्वता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ पहले से विद्यमान ज्ञान पर उचित बल देता है।
- source_word: κτισθῆναι
  choice: सृजा जाने
  rationale: κτίζω के एओरिस्ट कर्मवाच्य क्रियारूप को कर्मवाच्य में रखते हुए सृष्टि के संदर्भ को स्पष्ट करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह यूनानी के व्यापक, समग्र अर्थ को सामान्य आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔγνωσται
  choice: उसे ज्ञात था
  rationale: पूर्णकालिक रूप की परिणामी अवस्था को व्यक्त करता है और αὐτῷ के साथ ‘उसके लिए ज्ञात’ का भाव बनाए रखता है; रूप की संभावित सक्रिय व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: αὐτῷ
  choice: उसे
  rationale: दत्तिव रूप को स्वाभाविक हिन्दी में रखा गया है और प्रसंग से समझे जाने वाले ईश्वर का नाम मूल पाठ से आगे बढ़कर नहीं जोड़ा गया।
- source_word: οὕτως καὶ
  choice: भी वैसा ही
  rationale: सृष्टि से पहले और पूर्णता के बाद की समान स्थिति के बीच स्पष्ट समानांतर संबंध बनाए रखता है।
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: सब कुछ पूरा हो जाने के बाद
  rationale: कालसूचक संरचना और पूर्ण किए जाने के भाव को स्पष्ट करता है तथा τὰ πάντα से संबंध बनाए रखता है।
theological_decisions:
- issue: αὐτῷ में निहित व्यक्ति का संदर्भ
  choice: ‘उसे’ रखा गया, जिसका संदर्भ प्रसंग से ईश्वर समझा जाता है।
  alternative: स्पष्ट रूप से ‘ईश्वर को’ कहना।
  rationale: मूल यूनानी सर्वनाम ही देता है; इसलिए ईश्वर का नाम जोड़ने के बजाय पाठ की अभिव्यक्ति और उसके संदर्भगत तनाव को सुरक्षित रखा गया।
- issue: ἔγνωσται की वाच्यगत और कालगत अस्पष्टता
  choice: अवस्थात्मक अर्थ में ‘उसे ज्ञात था’ अनूदित किया गया।
  alternative: ‘उसने उसे जान लिया था’ या ‘वह उसे ज्ञात है।’
  rationale: यह अनुवाद पूर्ण पूर्वज्ञान के भाव को स्पष्ट करता है, पर सक्रिय और अधिक शाब्दिक वर्तमान-परिणामी प्रतिनिधित्व की संभावना को पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब कुछ’ व्यापक अर्थ देता है, जबकि ‘सृजा जाना’ सृष्टि-संबंधी औपचारिकता बनाए रखता है। अर्धविराम मूल वाक्य के दो कालगत पक्षों का समानांतर संबंध दिखाता है।
