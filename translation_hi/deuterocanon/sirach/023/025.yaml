  text: उसके बच्चे जड़ नहीं पकड़ेंगे[a], और उसकी डालियाँ फल नहीं देंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जड़ बनने के लिए नहीं फैलेंगे।” यूनानी में यह स्थापित होकर बढ़ न पाने की संक्षिप्त वानस्पतिक छवि है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαδώσουσιν
  choice: जड़ नहीं पकड़ेंगे
  rationale: क्रिया का मूल भाव फैलने या विस्तार पाने का है; εἰς ῥίζαν के साथ यह पौधे के स्थापित होकर जड़ पकड़ने की संक्षिप्त छवि बनाता है। स्वाभाविक हिन्दी में संयुक्त रूप से यही अर्थ स्पष्ट होता है।
- source_word: τὰ τέκνα αὐτῆς
  choice: उसके बच्चे
  rationale: τέκνα का सीधा और सामान्य अर्थ ‘बच्चे’ है; इससे पारिवारिक रूपक बना रहता है।
- source_word: εἰς ῥίζαν
  choice: जड़ पकड़ेंगे
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘जड़ की ओर/जड़ में’ जैसा संक्षिप्त है। ‘जड़ पकड़ना’ हिन्दी का स्वाभाविक वानस्पतिक मुहावरा है और स्थापित न हो पाने का भाव रखता है।
- source_word: οἱ κλάδοι αὐτῆς
  choice: उसकी डालियाँ
  rationale: κλάδοι के लिए ‘डालियाँ’ आधुनिक हिन्दी में स्पष्ट है और जड़ तथा फल की विस्तृत वानस्पतिक छवि को बनाए रखता है।
- source_word: οὐ δώσουσιν καρπόν
  choice: फल नहीं देंगी
  rationale: यूनानी में क्रिया का शाब्दिक अर्थ ‘देना’ है। ‘फल देना’ स्वाभाविक हिन्दी अभिव्यक्ति है और मूल रूपक को सुरक्षित रखती है।
theological_decisions:
- issue: संदर्भ में उस स्त्री और उसकी संतान पर न्याय का रूपक
  choice: पारिवारिक और वानस्पतिक चित्रों को बिना अतिरिक्त व्याख्या के बनाए रखा गया है।
  alternative: इसे स्पष्ट करके ‘उसके वंशज स्थापित नहीं होंगे और उसकी संतान निष्फल रहेगी’ कहना।
  rationale: यूनानी पाठ परिणाम को रूपक में व्यक्त करता है। अनुवाद उस तनाव को बनाए रखता है और पद में न दिए गए नैतिक या धर्मसैद्धांतिक स्पष्टीकरण को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जड़ पकड़ना’ तथा ‘फल देना’ सामान्य हिन्दी मुहावरे हैं और मूल पाठ की परस्पर जुड़ी वानस्पतिक छवि को बनाए रखते हैं।
