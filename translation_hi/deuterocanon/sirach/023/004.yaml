  text: Lord[a], Father and God of my life, do not give me haughty eyes,
translation:
  language: hi
  text: हे प्रभु, पिता और मेरे जीवन के परमेश्वर, मुझे घमंड भरी आँखें[a] न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँची आँखें” अथवा “अहंकारी आँखें”; यूनानी पदबंध का अधिक शाब्दिक अर्थ “आँखों की चंचलता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: κύριος के संबोधन रूप को प्रार्थना की स्वाभाविक और प्रतिष्ठित हिन्दी में “हे प्रभु” कहा गया है।
- source_word: πάτερ
  choice: पिता
  rationale: परमेश्वर के लिए सीधे संबोधन को सरल और संक्षिप्त रूप में रखा गया है; आरम्भ का “हे” संबोधनों की पूरी शृंखला पर लागू होता है।
- source_word: θεὲ ζωῆς μου
  choice: मेरे जीवन के परमेश्वर
  rationale: यूनानी संबंधकारक पदबंध की संक्षिप्तता और उसके संभावित अर्थ-विस्तार को बनाए रखने के लिए इसे व्याख्यात्मक रूप से “मुझे जीवन देनेवाले परमेश्वर” नहीं किया गया।
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: घमंड भरी आँखें
  rationale: संदर्भ में यह पदबंध आँखों से प्रकट होने वाले गर्व या ऊँचेपन की ओर संकेत करता है। हिन्दी में “घमंड भरी आँखें” इस नैतिक बिंब को सहज रूप से व्यक्त करता है, जबकि अधिक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: μὴ δῷς μοι
  choice: मुझे ... न दे
  rationale: निषेधात्मक प्रार्थना को मूल के निकट, संक्षिप्त और हिन्दी में स्वाभाविक रखा गया है।
theological_decisions:
- issue: μετεωρισμὸν ὀφθαλμῶν का नैतिक आशय
  choice: गर्व या घमंड प्रकट करने वाली आँखें
  alternative: आँखों की चंचलता या भटकाव
  rationale: ज्ञान-साहित्य की इस प्रार्थना में घमंड का अर्थ सबसे स्वाभाविक जान पड़ता है, पर यूनानी संज्ञा ऊँचेपन के साथ-साथ चंचलता या अस्थिरता भी सूचित कर सकती है; इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमामय और सामान्य पाठक के लिए सुबोध शैली रखी गई है। संबोधन की संक्षिप्त समानांतर रचना और “मेरे जीवन के परमेश्वर” की मूल अस्पष्टता सुरक्षित रखी गई है।
