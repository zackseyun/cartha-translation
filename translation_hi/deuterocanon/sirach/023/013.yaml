translation:
  language: hi
  text: अपने मुँह को भद्दी अज्ञानता का अभ्यस्त न बना, क्योंकि उसमें पाप की बात होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: भद्दी अज्ञानता
  rationale: ἀπαιδευσία शिक्षा, संस्कार या समझ के अभाव को सूचित करता है और ἀσυρῆ उसे भद्दा या अशोभनीय ठहराता है। यह असामान्य यूनानी पदबंध का तनाव बनाए रखता है और उसे केवल ‘अश्लील भाषा’ मानकर संकुचित नहीं करता।
- source_word: συνεθίσῃς τὸ στόμα σου
  choice: अपने मुँह को … का अभ्यस्त न बना
  rationale: यूनानी निषेध में आदत डालने का भाव स्पष्ट है; हिन्दी में यह स्वाभाविक रहते हुए मूल बिंब को सुरक्षित रखता है।
- source_word: λόγος ἁμαρτίας
  choice: पाप की बात
  rationale: λόγος का मूल ‘बात/वचन’ और ἁμαρτίας का संबंधसूचक रूप दोनों बने रहते हैं; ‘पापपूर्ण वाणी’ की तुलना में यह मूल की संक्षिप्त और कुछ हद तक खुली अभिव्यक्ति को अधिक निकटता से दर्शाता है।
theological_decisions:
- issue: λόγος ἁμαρτίας में संबंध की अस्पष्टता
  choice: पाप की बात
  alternative: पापपूर्ण वाणी
  rationale: संबंधसूचक ἁμαρτίας को केवल गुणसूचक अर्थ में तय नहीं किया गया; हिन्दी पदबंध यह खुला रखता है कि ऐसी अज्ञानता में पाप से जुड़ी बात निहित है या उससे पापपूर्ण कथन निकलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, चेतावनीपूर्ण और गरिमापूर्ण शैली रखी गई है। ‘भद्दी अज्ञानता’ जानबूझकर कुछ असामान्य है, क्योंकि मूल यूनानी पदबंध भी असामान्य और अर्थ की दृष्टि से तनावपूर्ण है।
