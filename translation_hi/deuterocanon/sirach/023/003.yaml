base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: hi
  text: ताकि मेरी अनजानी भूलें[a] बढ़ती न जाएँ, मेरे पाप बढ़ न जाएँ, मैं अपने विरोधियों के सामने गिर न पड़ूँ, और मेरा शत्रु मुझ पर आनन्दित न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी अज्ञानताएँ’ अथवा ‘अज्ञान से हुई मेरी भूलें।’ यूनानी में यह पद अगले पदबंध ‘मेरे पाप’ से अलग है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझ पर न इतराए’ अथवा ‘मुझ पर उल्लसित न हो।’ क्रिया में शत्रुतापूर्ण प्रसन्नता का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: ताकि ... न
  rationale: यह पहले की प्रार्थना पर निर्भर उद्देश्य अथवा आशंकित परिणाम की शृंखला आरम्भ करता है। हिन्दी में ‘ताकि ... न’ इसके निषेधात्मक और प्रयोजनसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἱ ἄγνοιαι μου
  choice: मेरी अनजानी भूलें
  rationale: ἄγνοια अज्ञान या न जानने के कारण हुई भूल को सूचित कर सकता है। ‘अनजानी भूलें’ आधुनिक हिन्दी में समझने योग्य है और अगले पदबंध ‘मेरे पाप’ से इसका भेद बनाए रखता है।
- source_word: μὴ πληθύνωσιν
  choice: बढ़ती न जाएँ
  rationale: क्रिया के ‘बहुत हो जाना/संख्या में बढ़ना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और निरन्तर वृद्धि की आशंका को स्पष्ट रखता है।
- source_word: αἱ ἁμαρτίαι μου
  choice: मेरे पाप
  rationale: ἁμαρτία का मानक धार्मिक और नैतिक अर्थ ‘पाप’ है; इसे ἄγνοιαι से अलग रखा गया है।
- source_word: πλεονάσωσιν
  choice: बढ़ न जाएँ
  rationale: संख्या या मात्रा में वृद्धि का सीधा, आधुनिक हिन्दी रूप है।
- source_word: πεσοῦμαι
  choice: मैं ... गिर न पड़ूँ
  rationale: मूल की व्यापक ‘गिरने’ की छवि को बनाए रखता है और पराजय, पतन या अपमान में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: अपने विरोधियों के सामने
  rationale: ἔναντι का स्थानगत/साक्षीगत अर्थ ‘सामने’ और ὑπεναντίων का अर्थ ‘विरोधी’ स्वाभाविक तथा सटीक रूप में व्यक्त होता है।
- source_word: ἐπιχαρεῖταί μοι
  choice: मुझ पर खुश न हो
  rationale: शत्रु के किसी की दुर्दशा पर प्रसन्न होने का अर्थ सरल आधुनिक हिन्दी में आता है; अधिक स्पष्ट ‘मेरी हार पर आनन्द न मनाए’ मूल से अतिरिक्त विवरण जोड़ देता।
- source_word: ὁ ἐχθρός μου
  choice: मेरा शत्रु
  rationale: मूल के एकवचन और विरोधियों से शत्रु की ओर हुए संख्या-परिवर्तन को ज्यों का त्यों रखता है।
theological_decisions:
- issue: ἄγνοιαι और ἁμαρτίαι के बीच भेद
  choice: ‘अनजानी भूलें’ और ‘पाप’ को अलग-अलग रखा गया
  alternative: ἄγνοιαι को ‘अज्ञानताएँ’ या अधिक व्याख्यात्मक रूप से ‘अज्ञान में किए गए पाप’ कहना
  rationale: यूनानी पाठ दोनों शब्दों को अलग रखता है। ‘अनजानी भूलें’ इस भेद को समझने योग्य हिन्दी में बचाता है, पर इसे तकनीकी रूप से ‘अज्ञान के पाप’ घोषित नहीं करता।
- issue: ὅπως μή के निषेध का समन्वित उपवाक्यों पर विस्तार
  choice: हर आशंकित परिणाम के साथ हिन्दी में निषेध स्पष्ट किया गया
  alternative: केवल पहले उपवाक्य में ‘न’ रखकर शेष को व्याकरणिक रूप से उसी पर निर्भर छोड़ना
  rationale: यूनानी में आरम्भिक μή पूरी समन्वित शृंखला पर प्रभाव डालता है। हिन्दी में प्रत्येक क्रिया के साथ ‘न’ लगाने से यही अर्थ अस्पष्टता के बिना व्यक्त होता है।
- issue: ἐπιχαρεῖταί μοι का शत्रुतापूर्ण भाव
  choice: मुख्य पाठ में ‘मुझ पर खुश न हो’
  alternative: ‘मुझ पर विजय का आनन्द न मनाए’ या ‘मेरी दुर्दशा पर न फूले’
  rationale: सन्दर्भ शत्रुतापूर्ण प्रसन्नता बताता है, किन्तु मूल क्रिया अपने आप में विजय या दुर्दशा को स्पष्ट नहीं करती। संयत अनुवाद मूल की सीमा में रहता है; दुर्भावनापूर्ण भाव टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पूर्ववर्ती प्रार्थना पर निर्भर उद्देश्यसूचक खण्ड है, इसलिए आरम्भ में ‘ताकि’ रखा गया। ‘अज्ञानताएँ’ की अत्यधिक शाब्दिक किन्तु अस्वाभाविक हिन्दी के स्थान पर ‘अनजानी भूलें’ चुना गया, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
