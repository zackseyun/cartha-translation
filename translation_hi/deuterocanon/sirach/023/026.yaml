  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: hi
  text: वह अपने पीछे ऐसी स्मृति छोड़ जाएगी जो शाप का विषय होगी, और उसका कलंक मिटाया नहीं जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: छोड़ेगी
  rationale: भविष्यकालीन क्रिया यहाँ उसके बाद रह जाने वाली विरासत या स्मृति को व्यक्त करती है; ‘छोड़ेगी’ हिन्दी में स्वाभाविक है और मूल अर्थ बनाए रखती है।
- source_word: εἰς κατάραν
  choice: शाप का कारण बना
  rationale: εἰς परिणाम या परिणति का भाव देता है। ‘शाप का कारण बना’ यह स्पष्ट करता है कि उसकी याद शाप से जुड़ी हुई विरासत बन जाएगी, बिना ‘शापित’ जैसा अतिरिक्त निष्क्रिय भाव जोड़ने के।
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: अपनी याद
  rationale: μνημόσυνον यहाँ किसी भौतिक स्मारक के बजाय उसके मरने के बाद बनी रहने वाली स्मृति या ख्याति को दर्शाता है; ‘याद’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: τὸ ὄνειδος αὐτῆς
  choice: उसका कलंक
  rationale: ὄνειδος सार्वजनिक निंदा, अपमान और लज्जाजनक बदनामी का भाव रखता है। ‘कलंक’ इस सामाजिक और स्थायी अपयश को संक्षेप में व्यक्त करता है।
- source_word: οὐκ ἐξαλειφθήσεται
  choice: मिटाया नहीं जाएगा
  rationale: भविष्य निष्क्रिय रूप और मिटाने/पोंछ देने के रूपक दोनों को बनाए रखता है; यह आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: संदर्भ में व्यभिचारिणी स्त्री के लिए नैतिक परिणाम की कठोर भाषा
  choice: स्थायी सार्वजनिक कलंक के कठोर कथन को बिना नरम किए बनाए रखना
  alternative: इसे केवल सामान्य बुरी प्रतिष्ठा कहना, या इसमें स्पष्ट ईश्वरीय दंड जोड़ना
  rationale: यूनानी पाठ याद के शाप का कारण बनने और कलंक के न मिटने की बात करता है, पर इस उपवाक्य में अलग से ईश्वरीय न्याय का उल्लेख नहीं करता। इसलिए न कठोरता घटाई गई है, न अतिरिक्त धर्मवैज्ञानिक दावा जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और ज्ञान-साहित्य के अनुरूप भाषा। ‘कलंक’ सार्वजनिक अपयश के भाव को स्वाभाविक ढंग से व्यक्त करता है।
