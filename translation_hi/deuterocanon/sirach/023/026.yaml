review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the future action, enduring remembrance, and future passive negation. However, “शाप का कारण” changes εἰς κατάραν from the remembered person's memory becoming an object of curse/reproach into that memory causing a curse. The Greek supports a resultant cursed or maledicted remembrance, not specifically causation.
  naturalness: “वह अपनी याद को शाप का कारण बना छोड़ेगी” is not idiomatic modern Hindi. A relative clause naturally conveys the resultant sense while retaining the brief, grave wisdom-literature register.
  terminology: “कलंक” is an acceptable rendering of ὄνειδος in this context, preserving public disgrace/reproach. “स्मृति” is slightly more fitting than “याद” for μνημόσυνον as a person's enduring remembrance.
  issues:
  - severity: medium
    issue: “शाप का कारण” adds a causal relationship not expressed by εἰς κατάραν.
    rationale: The phrase indicates the outcome/status of her remembrance—something associated with or subject to a curse—not that it causes a curse.
  - severity: medium
    issue: The first clause is syntactically unnatural in Hindi.
    rationale: “अपनी याद को ... बना छोड़ेगी” is not a natural way to express leaving behind a remembrance that becomes an object of curse.
  revised_text: वह अपने पीछे ऐसी स्मृति छोड़ जाएगी जो शाप का विषय होगी, और उसका कलंक मिटाया नहीं जाएगा।
  revised_footnotes: []
