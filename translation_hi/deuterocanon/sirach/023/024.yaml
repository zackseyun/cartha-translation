translation:
  language: hi
  text: उसे सभा के सामने लाया जाएगा, और उसके बच्चों के विषय में जाँच[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बच्चों पर दंडात्मक निरीक्षण होगा।” यूनानी शब्द का अर्थ निरीक्षण या ‘भेंट’ भी हो सकता है और उसमें न्यायिक दंड का संकेत हो सकता है।
    reason: ἐπισκοπή और ἐπί की संभावित न्यायिक-दंडात्मक अर्थ-छाया को सुरक्षित रखना, बिना दंड को निश्चित रूप से घोषित किए।
lexical_decisions:
- source_word: αὕτη
  choice: उसे
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम निकटवर्ती संदर्भ की व्यभिचारिणी स्त्री की ओर संकेत करता है; कर्मवाच्य हिंदी वाक्य में ‘उसे’ स्वाभाविक है।
- source_word: ἐκκλησίαν
  choice: सभा
  rationale: यहाँ अर्थ एकत्रित समुदाय है, न कि बाद का पारिभाषिक ‘कलीसिया’; ‘सभा’ सार्वजनिक सामुदायिक प्रसंग को स्पष्ट रखता है।
- source_word: ἐξαχθήσεται
  choice: सामने लाया जाएगा
  rationale: भविष्यत् कर्मवाच्य सार्वजनिक रूप से प्रस्तुत किए जाने का भाव देता है; ‘सभा के सामने लाया जाएगा’ हिंदी में सहज और न्यायिक-सार्वजनिक संकेत के अनुकूल है।
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: उसके बच्चों के विषय में
  rationale: ἐπί का संबंध यहाँ बच्चों से है, पर उसका बल ‘विषय में’, ‘पर’ या ‘विरुद्ध’ हो सकता है; मुख्य पाठ में कम निर्णायक रूप चुना गया है।
- source_word: ἐπισκοπὴ
  choice: जाँच
  rationale: शब्द निरीक्षण, पड़ताल अथवा दंडात्मक आगमन का संकेत दे सकता है। ‘जाँच’ साधारण आधुनिक हिंदी में आधिकारिक परीक्षण का भाव रखता है, जबकि अधिक कठोर संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἔσται
  choice: होगी
  rationale: यूनानी के सामान्य भविष्यत् अस्तित्वसूचक प्रयोग का स्वाभाविक हिंदी रूप।
theological_decisions:
- issue: क्या ἐκκλησία के लिए बाद की कलीसियाई पारिभाषिक भाषा अपनाई जाए
  choice: सभा
  alternative: मंडली / कलीसिया
  rationale: ज्ञान-साहित्य के इस प्रसंग में सार्वजनिक समुदाय के सामने उजागर किए जाने की बात है; ‘सभा’ किसी विकसित मसीही संस्थागत अर्थ को आरोपित नहीं करता।
- issue: ἐπισκοπή को कितना दंडात्मक बनाया जाए
  choice: जाँच
  alternative: उसके बच्चों पर दंडात्मक कार्रवाई / विपत्ति का आना
  rationale: शब्द में आधिकारिक निरीक्षण और दंडात्मक ‘भेंट’ दोनों की संभावना है। यूनानी इस खंड में दंड को स्पष्ट नहीं करता, इसलिए मुख्य पाठ तटस्थतर अर्थ रखता है और प्रबल विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सभा’ सामुदायिक न्याय का संदर्भ देता है; ‘जाँच’ औपचारिकता बनाए रखते हुए अस्पष्टता को पूरी तरह समाप्त नहीं करता।
