  yaml_path: translation/deuterocanon/sirach/023/027.yaml
  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: hi
  text: और जो पीछे रह गए हैं[a], वे जान लेंगे कि प्रभु का भय मानने से बढ़कर कुछ नहीं, और प्रभु की आज्ञाओं पर ध्यान देने से अधिक मधुर कुछ नहीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो बचे रह गए हैं’। यूनानी में शाब्दिक अर्थ है, ‘जो छोड़ दिए गए हैं’ या ‘जो रह गए हैं’।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु की आज्ञाओं को मन लगाकर मानने से’। यूनानी क्रिया सजग ध्यान और उसके अनुरूप प्रत्युत्तर देने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: वे जान लेंगे
  rationale: भविष्यकालीन क्रिया परिणामों के बाद स्पष्ट रूप से जान लेने या पहचान लेने का भाव दे सकती है; ‘जान लेंगे’ आधुनिक हिन्दी में स्वाभाविक है और उस परिणामी बोध को बनाए रखता है।
- source_word: οἱ καταλειφθέντες
  choice: जो पीछे रह गए हैं
  rationale: यह अनुवाद यूनानी निष्क्रिय कृदंत, अर्थात् ‘जो छोड़े गए/रह गए’, को बनाए रखता है और यह तय नहीं करता कि वे विशेष रूप से न्याय से बचे हुए लोग हैं या किसी अन्य अर्थ में पीछे रह गए हैं।
- source_word: οὐδὲν κρεῖττον
  choice: से बढ़कर कुछ नहीं
  rationale: यह तुलनात्मक अभिव्यक्ति की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φόβου Κυρίου
  choice: प्रभु का भय मानने
  rationale: ‘प्रभु का भय’ बाइबलीय ज्ञान-साहित्य की प्रमुख अभिव्यक्ति है; ‘भय मानना’ हिन्दी में श्रद्धामय भय और उसके अनुरूप जीवन-भंगिमा, दोनों के लिए सुबोध है।
- source_word: γλυκύτερον
  choice: अधिक मधुर
  rationale: यह मूल के मिठास-संबंधी रूपक और सूक्ति की काव्यात्मकता को सुरक्षित रखता है।
- source_word: τοῦ προσέχειν
  choice: ध्यान देने से
  rationale: προσέχειν का अर्थ ध्यान लगाना, ध्यान देना या मन लगाकर मानना हो सकता है। ‘ध्यान देने’ से इसकी सजग और प्रत्युत्तरशील दृष्टि बनी रहती है, बिना इसे केवल बाहरी पालन तक सीमित किए।
- source_word: ἐντολαῖς Κυρίου
  choice: प्रभु की आज्ञाओं पर
  rationale: ἐντολαί के लिए ‘आज्ञाएँ’ प्रतिष्ठित और स्पष्ट बाइबलीय शब्द है; यह पहले खंड के ‘प्रभु’ के साथ समानांतरता भी रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में ‘प्रभु का भय’ का अर्थ
  choice: ‘प्रभु का भय मानना’ वाक्यांश को बनाए रखा गया है।
  alternative: ‘प्रभु के प्रति श्रद्धा’ या ‘प्रभु का विस्मयपूर्ण आदर’
  rationale: मूल अभिव्यक्ति में भय, श्रद्धा, विस्मय और आज्ञाकारी जीवन-भंगिमा का व्यापक धर्मवैचारिक तनाव है। केवल ‘श्रद्धा’ कहने से इसका अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
- issue: प्रभु की आज्ञाओं के प्रति προσέχειν
  choice: ‘आज्ञाओं पर ध्यान देना’
  alternative: ‘आज्ञाओं का पालन करना’
  rationale: ‘पालन करना’ संदर्भानुकूल है, पर मूल क्रिया पहले सजग ध्यान और मन लगाने को व्यक्त करती है, जिसमें आज्ञापालन निहित हो सकता है। मुख्य पाठ उस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज ज्ञान-साहित्यिक शैली अपनाई गई है। दोनों तुलनात्मक खंडों की समानांतर रचना और ‘मधुर’ का मूल रूपक सुरक्षित रखा गया है।
