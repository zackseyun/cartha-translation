base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/017.yaml
  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: hi
  text: यौन-दुराचारी पुरुष को हर रोटी मीठी लगती है[a]; वह तब तक नहीं रुकेगा, जब तक उसका अंत न हो जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हर प्रकार की रोटी मीठी लगती है।” यह रूपक सम्भवतः केवल भोजन नहीं, बल्कि बिना भेद किए हर उपलब्ध संतुष्टि की लालसा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “जब तक वह मर न जाए।” यूनानी क्रिया विशेष रूप से मृत्यु को सूचित कर सकती है, जबकि “उसका अंत” अन्तिम विनाश के व्यापक भाव को भी बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνῳ
  choice: यौन-दुराचारी पुरुष
  rationale: यह शब्द आदतन अवैध या अनैतिक यौन-व्यवहार करने वाले पुरुष को दर्शाता है। यह अनुवाद अर्थ को केवल वेश्यागमन या विवाहेतर संबंध तक सीमित नहीं करता।
- source_word: πᾶς ἄρτος
  choice: हर रोटी
  rationale: यूनानी पाठ की रोटी वाली रूपकात्मक छवि को बनाए रखा गया है। संदर्भ में यह बिना भेद किए किसी भी उपलब्ध यौन-संतुष्टि की लालसा की ओर संकेत करती है।
- source_word: ἡδύς
  choice: मीठी लगती है
  rationale: ἡδύς का अर्थ ‘मीठा’ या ‘सुखद’ हो सकता है। रोटी के साथ जुड़ी स्वाद की छवि और कथन की नैतिक विडंबना को बनाए रखने के लिए ‘मीठी लगती है’ स्वाभाविक हिन्दी है।
- source_word: οὐ μὴ κοπάσῃ
  choice: नहीं रुकेगा
  rationale: οὐ μή के साथ क्रिया प्रबल निषेध व्यक्त करती है। ‘नहीं रुकेगा’ निरंतर और अनियंत्रित व्यवहार को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: ἕως ἂν τελευτήσῃ
  choice: जब तक उसका अंत न हो जाए
  rationale: τελευτάω का अर्थ ‘अंत होना’ और विशेष रूप से ‘मरना’ दोनों हो सकता है। मुख्य पाठ का वाक्यांश मृत्यु के साथ-साथ अंतिम विनाश की व्यापक छाया को भी बनाए रखता है।
theological_decisions:
- issue: रोटी के रूपक को स्पष्ट करके सीधे यौन-लालसा या यौन-साथियों के रूप में व्यक्त करना
  choice: मुख्य पाठ में ‘हर रोटी मीठी लगती है’ रूपक को बनाए रखना
  alternative: ‘हर प्रकार की रोटी मीठी लगती है’ या ‘हर स्त्री उसे मनभावनी लगती है’
  rationale: यूनानी पाठ स्वयं रोटी की छवि का प्रयोग करता है। यौन-संदर्भ को सीधे ‘हर स्त्री’ कहना पाठ से अधिक विशिष्ट व्याख्या जोड़ देगा और सम्भवतः अर्थ को अनुचित ढंग से सीमित करेगा।
- issue: τελευτήσῃ को केवल शारीरिक मृत्यु के रूप में अनूदित करना या व्यापक ‘अंत’ बनाए रखना
  choice: ‘जब तक उसका अंत न हो जाए’
  alternative: ‘जब तक वह मर न जाए’
  rationale: क्रिया मृत्यु का संकेत दे सकती है, पर ‘अंत’ अनुवाद शारीरिक मृत्यु और अन्तिम विनाश—दोनों सम्भावनाओं को बिना कृत्रिम रूप से तय किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यौन-दुराचारी’ यौन-अनैतिकता को स्पष्ट करता है, जबकि ‘हर रोटी’ मूल यूनानी रूपक को जानबूझकर सुरक्षित रखता है।
