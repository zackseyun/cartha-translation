  yaml_path: translation/deuterocanon/sirach/023/007.yaml
  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: hi
  text: बच्चों, वाणी-संबंधी शिक्षा सुनो[a]; जो उसका पालन करता है, वह कदापि पकड़ा नहीं जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुँह की शिक्षा।” इसका अनुवाद “वाणी की शिक्षा” या “बोलने के विषय में शिक्षा” भी हो सकता है। यूनानी अभिव्यक्ति संक्षिप्त है।
    reason: lexical_alternative
  - marker: b
    text: “कदापि ... नहीं” यूनानी के प्रबल निषेध को व्यक्त करता है। अंतिम शब्द का अनुवाद “नहीं फँसेगा” या “निश्चय ही पकड़ा नहीं जाएगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  choice: शिक्षा
  rationale: यह शब्द शिक्षा, प्रशिक्षण या अनुशासन का अर्थ दे सकता है। इस ज्ञान-साहित्य संबंधी उपदेश में “शिक्षा” स्वाभाविक है और उसके सुधारात्मक भाव को भी खुला रखता है।
- source_word: στόματος
  choice: मुँह की
  rationale: यूनानी में शाब्दिक रूप से “मुँह की” है; यहाँ मुँह वाणी या बोलने का द्योतक है। संक्षिप्त मूल अभिव्यक्ति को मुख्य पाठ में रखा गया है और उसका आशय पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἀκούσατε
  choice: सुनो
  rationale: यह बहुवचन आज्ञार्थक क्रिया ध्यानपूर्वक ग्रहण करने का आह्वान करती है। “सुनो” मूल के निकट और आधुनिक हिन्दी में सहज है।
- source_word: τέκνα
  choice: बच्चो
  rationale: यह सम्बोधन का बहुवचन है और लिंग-समावेशी रूप से “बच्चो” स्वाभाविक है; मूल में “मेरे” नहीं है।
- source_word: ὁ φυλάσσων
  choice: जो उसका पालन करता है
  rationale: φυλάσσω का अर्थ रखना, रक्षा करना या पालन करना हो सकता है। यहाँ निहित कर्म पहले कही गई शिक्षा है, इसलिए हिन्दी की स्पष्टता के लिए “उसका” जोड़ा गया है।
- source_word: οὐ μὴ
  choice: निश्चय ही ... नहीं
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है। “निश्चय ही ... नहीं” उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἁλῷ
  choice: पकड़ा नहीं जाएगा
  rationale: ἁλίσκομαι का मूल अर्थ पकड़ा या धर लिया जाना है। यह अनुवाद कानूनी रूप से “दोषी ठहराए जाने” का संकरा अर्थ थोपे बिना वाणी के कारण पकड़े जाने या संकट में पड़ने की व्यापक संभावना बनाए रखता है।
theological_decisions:
- issue: “पालन करता है” का निहित कर्म
  choice: “उसका” देकर इसे पहले उल्लिखित शिक्षा से जोड़ा गया है।
  alternative: 'कर्म को निहित छोड़ना: “जो पालन करता है।”'
  rationale: हिन्दी में सकर्मक भाव को स्पष्ट करना आवश्यक है, और निकटतम पूर्वपद यही शिक्षा है; इससे कोई नई धार्मिक अवधारणा नहीं जुड़ती।
- issue: अंतिम उपवाक्य का आशय
  choice: इसे सामान्य परिणाम के रूप में “निश्चय ही पकड़ा नहीं जाएगा” कहा गया है।
  alternative: 'अधिक न्यायिक अर्थ: “दोषी नहीं ठहराया जाएगा”; या रूपकात्मक अर्थ: “नहीं फँसेगा।”'
  rationale: मूल क्रिया व्यापक है। “पकड़ा” उसके सामान्य अर्थ को बनाए रखता है और कथन को केवल न्यायालयीन दोषसिद्धि तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। “बच्चो” प्रत्यक्ष सम्बोधन को सहज बनाता है; अर्धविराम उपदेश और उसके परिणाम को स्पष्ट रूप से जोड़ता है।
