base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: hi
  text: कौन मेरे विचारों पर कोड़े और मेरे हृदय पर बुद्धि का अनुशासन लगाएगा, ताकि वे मेरी अज्ञानवश हुई भूलों के लिए मुझे न बख्शें और उनके पापों[a] को किसी भी तरह अनदेखा न करें?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से “उनके पापों” है। “मेरी अज्ञानवश हुई भूलों” के बाद यह सर्वनाम प्रसंग में कठिन है; कुछ विद्वान इसका आशय “मेरे पापों” समझते हैं।
    reason: मूल पाठ के कठिन तृतीय-पुरुष सर्वनाम को बनाए रखते हुए संभावित सहज अर्थ को पारदर्शी बनाना।
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: कौन ... ठहराएगा
  rationale: यूनानी प्रश्न की सीधी, आलंकारिक पुकार और किसी सुधारक शक्ति को ऊपर नियुक्त करने का भाव सुरक्षित रहता है।
- source_word: ἐπὶ τοῦ διανοήματός μου
  choice: मेरे विचार पर
  rationale: एकवचन संज्ञा मानसिक विचार अथवा चिंतन को दर्शाती है; हिन्दी में सामूहिक अर्थ वाला एकवचन स्रोत की व्याकरणिक बनावट के निकट है।
- source_word: μάστιγας
  choice: कोड़े
  rationale: शब्द का ठोस अर्थ कोड़े या चाबुक है; कठोर नैतिक सुधार का रूपक जानबूझकर नरम नहीं किया गया।
- source_word: ἐπὶ τῆς καρδίας μου παιδείαν σοφίας
  choice: मेरे हृदय पर बुद्धि का अनुशासन
  rationale: हृदय को विचार और इच्छा के भीतरी केंद्र के रूप में बनाए रखते हुए παιδεία के प्रशिक्षण तथा सुधार, दोनों भाव व्यक्त होते हैं।
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: मेरी अनजाने में हुई भूलों के कारण
  rationale: ἀγνόημα केवल अज्ञान नहीं, बल्कि अज्ञान या अनजानेपन से हुई गलती को सूचित करता है; यह स्वाभाविक हिन्दी में अगले ‘पापों’ से भेद भी बनाए रखता है।
- source_word: μὴ φείσωνται
  choice: मुझे न बख्शें
  rationale: क्रिया दंड या सुधार से परहेज़ न करने का भाव देती है; हिन्दी में निहित कर्म ‘मुझे’ स्पष्ट करना आवश्यक है।
- source_word: οὐ μὴ παρῇ
  choice: अनदेखा न करें
  rationale: प्रबल निषेध के साथ क्रिया यहाँ दोषों को जाने देना या उपेक्षित करना बताती है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: उनके पापों
  rationale: प्राप्त यूनानी पाठ का तृतीय-पुरुष बहुवचन संबंधसूचक सर्वनाम ज्यों का त्यों रखा गया है, यद्यपि प्रसंग में कठिन है।
theological_decisions:
- issue: बुद्धि से संबंधित दंडात्मक सुधार का रूपक
  choice: ‘कोड़े’ और ‘बुद्धि का अनुशासन’ की ठोस भाषा बनाए रखना
  alternative: इसे ‘रोक’ या ‘मार्गदर्शन’ जैसे नरम शब्दों में कहना
  rationale: वचन भीतरी जीवन के कठोर नैतिक सुधार की प्रार्थना करता है; रूपक को नरम करना उसकी गंभीरता घटाता।
- issue: ‘उनके पापों’ में कठिन सर्वनाम
  choice: मुख्य पाठ में यूनानी ‘उनके’ को सुरक्षित रखना और पाद-टिप्पणी में कठिनाई बताना
  alternative: अर्थ सुगम बनाने के लिए चुपचाप ‘मेरे पापों’ कर देना
  rationale: दिए गए उच्च-विश्वसनीयता वाले यूनानी साक्ष्य में αὐτῶν स्पष्टतः ‘उनके’ है; वास्तविक पाठगत अथवा व्याकरणिक तनाव को अनिर्दिष्ट संशोधन से मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। ‘कोड़े’ की तीखी छवि और ‘हृदय’ की बाइबिलीय भाषा रखी गई है। कठिन तृतीय-पुरुष सर्वनाम को मुख्य पाठ में सुरक्षित रखकर पाद-टिप्पणी से स्पष्ट किया गया है।
