translation:
  language: hi
  text: उसकी महिमा का सामर्थ्य कौन गिन सकता है? और कौन उसकी दया के कामों का वर्णन और आगे बढ़ा सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और कौन उसकी दया के कामों का पूरा वर्णन कर सकता है?” यूनानी में शाब्दिक रूप से, “कौन वर्णन करने में और जोड़ेगा?” है—अर्थात् कौन इस वर्णन को और आगे बढ़ा सकेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτος
  choice: सामर्थ्य
  rationale: यह प्रकट शक्ति या पराक्रम को व्यक्त करता है; ‘सामर्थ्य’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μεγαλωσύνης
  choice: महिमा
  rationale: सम्बन्धकारक पद परमेश्वर की महान और प्रतिष्ठित गरिमा से जुड़े सामर्थ्य को सूचित करता है; ‘महिमा’ ऊँचे धार्मिक भाव को बनाए रखती है।
- source_word: ἐξαριθμήσεται
  choice: गिन सकता है
  rationale: भविष्यत् रूप यहाँ अलंकारिक प्रश्न में सामर्थ्य का भाव देता है; हिन्दी में ‘कौन गिन सकता है’ स्वाभाविक है।
- source_word: προσθήσει
  choice: पूरा
  rationale: इसका शाब्दिक अर्थ ‘और जोड़ना’ है, पर अगले infinitive के साथ यह वर्णन को आगे बढ़ाने या पूर्ण रूप से कहने का मुहावरा बनता है। मुख्य पाठ में ‘पूरा’ उसी आशय को सहज हिन्दी में देता है।
- source_word: ἐκδιηγήσασθαι
  choice: वर्णन कर सकता है
  rationale: यह विस्तृत अथवा पूर्ण रीति से सुनाने का भाव रखता है; ‘पूरा वर्णन’ उस तीव्रता को स्पष्ट करता है।
- source_word: τὰ ἐλέη αὐτοῦ
  choice: उसकी दया के कामों
  rationale: बहुवचन ἐλέη अनेक दयापूर्ण कार्यों की ओर संकेत कर सकता है। ‘दया के काम’ हिन्दी में बहुवचन और ठोस कार्य—दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर के लिए प्रयुक्त सर्वनाम और गरिमापूर्ण शब्दावली
  choice: सामान्य सर्वनाम ‘उसकी’ के साथ ‘महिमा’ और ‘दया’ जैसे गरिमापूर्ण शब्द
  alternative: विशेष आदरसूचक सर्वनाम या ‘महानता’ जैसा अधिक सपाट अनुवाद
  rationale: यूनानी पाठ श्रद्धा को विशेष सर्वनाम-रूप से नहीं, बल्कि ऊँची शब्दावली से व्यक्त करता है। हिन्दी में ‘महिमा’ उस धार्मिक भार को बिना अतिरिक्त सांप्रदायिक परम्परा जोड़े बनाए रखती है।
- issue: προσθήσει ἐκδιηγήσασθαι का अर्थ
  choice: ‘पूरा वर्णन कर सकता है’
  alternative: ‘वर्णन में और जोड़ सकता है’ या ‘वर्णन करता रह सकता है’
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से वर्णन में और जोड़ने की बात करती है, पर सन्दर्भ में दया के कामों को पूर्णतः कह पाने की असम्भवता व्यक्त करती है। स्वाभाविक हिन्दी मुख्य पाठ में अर्थ दिया गया है और शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण अलंकारिक प्रश्न। ‘पूरा वर्णन’ सहजता देता है, जबकि पादटिप्पणी यूनानी मुहावरे की वास्तविक अस्पष्टता और शाब्दिक छवि सुरक्षित रखती है।
