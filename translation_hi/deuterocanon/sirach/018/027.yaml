translation:
  language: hi
  text: बुद्धिमान मनुष्य हर बात में सावधान रहेगा,[a] और पाप के दिनों में[b] वह गलत काम से बचने का ध्यान रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बात में श्रद्धापूर्ण रहेगा”; यूनानी क्रिया सावधानी के साथ-साथ श्रद्धा या श्रद्धापूर्ण संकोच का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “पाप के दिनों” का अर्थ संभवतः ऐसे समय हैं जो पाप या प्रलोभन से चिह्नित हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφὸς
  choice: बुद्धिमान मनुष्य
  rationale: यह एकवचन नीतिवचनात्मक अभिव्यक्ति है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए यूनानी ἄνθρωπος की व्यापक मानवीय दृष्टि को बनाए रखता है।
- source_word: ἐν παντὶ
  choice: हर बात में
  rationale: यह सभी मामलों और परिस्थितियों का व्यापक भाव व्यक्त करता है और हिन्दी में ‘हर वस्तु में’ से अधिक स्वाभाविक है।
- source_word: εὐλαβηθήσεται
  choice: सावधान रहेगा
  rationale: क्रिया में सावधानी, चौकसी और श्रद्धापूर्ण संकोच के अर्थ संभव हैं। अगले समांतर खंड में बुराई से बचने की चौकसी होने के कारण यहाँ व्यावहारिक नैतिक सावधानी प्रमुख है।
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: पाप के दिनों में
  rationale: यह यूनानी के ‘पापों के दिनों में’ के निकट है, पर हिन्दी में अधिक सहज है; इससे पाप या प्रलोभन से चिह्नित समय का संकेत मिलता है।
- source_word: προσέξει ἀπὸ πλημμελίας
  choice: बुराई से बचने के लिए चौकस रहेगा
  rationale: προσέχω ध्यान देने और सावधान रहने को, जबकि ἀπό अलग रहने या बचने की दिशा को सूचित करता है। πλημμέλεια दोष, अपराध या गलत काम है; ‘बुराई’ इस नैतिक संदर्भ में सहज और पर्याप्त व्यापक है।
theological_decisions:
- issue: εὐλαβηθήσεται का नैतिक सावधानी अथवा श्रद्धा संबंधी अर्थ
  choice: व्यावहारिक नैतिक सावधानी
  alternative: हर बात में श्रद्धापूर्ण रहेगा
  rationale: क्रिया दोनों अर्थ धारण कर सकती है। निकटवर्ती समांतर कथन गलत काम से बचने पर केंद्रित है, इसलिए मुख्य पाठ में सावधानी उपयुक्त है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἡμέραις ἁμαρτιῶν की व्याख्या
  choice: पाप के दिनों में
  alternative: पापों के दिनों में; प्रलोभन के समय
  rationale: मुख्य पाठ स्रोत की रूपकात्मक समय-अभिव्यक्ति को बनाए रखता है और उसे केवल ‘प्रलोभन’ तक सीमित नहीं करता। पादटिप्पणी संभावित आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचनात्मक रखी गई है। ‘सावधान’ और ‘चौकस’ की पुनरावृत्ति यूनानी के निकटवर्ती समानार्थी नैतिक बल को दर्शाती है, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत अस्पष्टता को सुरक्षित रखती हैं।
