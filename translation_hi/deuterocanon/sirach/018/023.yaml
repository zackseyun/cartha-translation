  text: Before you pray[a], prepare yourself, and do not be like a man testing the Lord.
translation:
  language: hi
  text: प्रार्थना करने से पहले अपने आप को तैयार कर, और किसी ऐसे मनुष्य के समान मत बन जो प्रभु को परखता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की परीक्षा लेता है।” यूनानी क्रिया का अर्थ “परखना” या “परीक्षा लेना” दोनों हो सकता है; यहाँ संभवतः प्रभु को कसौटी पर रखने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: प्रार्थना करने से पहले
  rationale: πρὶν समय की पूर्वता बताता है और εὔξασθαι यहाँ परमेश्वर से प्रार्थना करने के स्वाभाविक अर्थ में है। हिंदी में यह पदबंध स्पष्ट और सहज है।
- source_word: ἑτοίμασον σεαυτόν
  choice: अपने को तैयार कर
  rationale: आज्ञार्थक क्रिया और आत्मवाचक कर्म दोनों को सीधे बनाए रखता है; तैयारी व्यक्तिगत और जान-बूझकर की जाने वाली है।
- source_word: μὴ γίνου ὡς ἄνθρωπος
  choice: उस मनुष्य के समान मत बन
  rationale: γίνου के ‘बनना’ संबंधी बल को सुरक्षित रखता है और ἄνθρωπος के एकवचन सामान्य मानवीय उदाहरण को ‘मनुष्य’ से व्यक्त करता है।
- source_word: πειράζων
  choice: परखता है
  rationale: क्रिया का अर्थ ‘परखना’ अथवा ‘परीक्षा में डालना’ हो सकता है। प्रभु के संबंध में ‘परखना’ उसे कसौटी पर रखने के भाव को स्वाभाविक हिंदी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यह यहूदी ज्ञान-साहित्य के संदर्भ में परमेश्वर के लिए प्रयुक्त κύριος का पारंपरिक, स्पष्ट और गरिमापूर्ण हिंदी रूप है।
theological_decisions:
- issue: πειράζων τὸν κύριον का अर्थ
  choice: प्रभु को परखता है
  alternative: प्रभु को परीक्षा में डालता है
  rationale: संदर्भ में भाव प्रभु को अनुचित रीति से कसौटी पर रखने का है। फिर भी यूनानी क्रिया की ‘परखने/परीक्षा में डालने’ की अर्थ-सीमा को पादटिप्पणी में खुला रखा गया है।
- issue: ἄνθρωπος का सामान्य एकवचन प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ‘मनुष्य’ स्रोत के एकवचन मानवीय उदाहरण और ज्ञानोक्ति की गरिमा दोनों को सुरक्षित रखता है; संदर्भ में इसका प्रयोग सामान्य मानव के लिए है।
translation_notes:
  register: आधुनिक मानक हिंदी में एकवचन आज्ञार्थक शैली रखी गई है। भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; ‘मत बन’ से γίνου का परिवर्तन या मुद्रा अपनाने वाला भाव भी बना रहता है।
