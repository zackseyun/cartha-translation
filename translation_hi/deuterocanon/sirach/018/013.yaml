base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: hi
  text: मनुष्य की दया उसके पड़ोसी पर होती है, पर प्रभु की दया सभी प्राणियों[a] पर होती है; वह डाँटता, अनुशासित करता और सिखाता है, और चरवाहे के समान अपने झुंड को वापस ले आता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “समस्त देह”; यह व्यापक बाइबिलीय अभिव्यक्ति समस्त मानवजाति या प्रत्येक जीवित प्राणी की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “वापस मोड़ता है” अथवा “फिर से लौटा लाता है”; यूनानी में भटके हुए झुंड को फेरकर लाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: दया
  rationale: ‘दया’ मानवीय और ईश्वरीय करुणामय व्यवहार, दोनों के लिए स्वाभाविक है और दोनों उपवाक्यों की समानांतरता बनाए रखती है।
- source_word: ἀνθρώπου
  choice: मनुष्य की
  rationale: एक प्रतिनिधि मनुष्य और प्रभु के बीच मूल यूनानी के एकवचन विरोध को बनाए रखता है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: नैतिक संदर्भ में यह πλησίον का प्रचलित और सहज हिन्दी पर्याय है।
- source_word: Κυρίου
  choice: प्रभु की
  rationale: Κύριος के धार्मिक संबोधन और पहले उपवाक्य के संबंधकारक ढाँचे को सुरक्षित रखता है।
- source_word: πᾶσαν σάρκα
  choice: हर देहधारी
  rationale: मूल के ‘समस्त देह’ संबंधी व्यापक बाइबिलीय मुहावरे को समझने योग्य हिन्दी में व्यक्त करता है और उसे केवल मानवजाति तक सीमित नहीं करता।
- source_word: ἐλέγχων
  choice: डाँटता
  rationale: प्रभु की सुधारात्मक दया के अंतर्गत मौखिक ताड़ना का सीधा और सामान्य हिन्दी रूप है।
- source_word: παιδεύων
  choice: अनुशासित करता
  rationale: सुधार और प्रशिक्षण, दोनों को समेटने वाली παιδεύω की अर्थ-व्याप्ति को बनाए रखता है।
- source_word: διδάσκων
  choice: सिखाता
  rationale: इस शिक्षापरक क्रिया का सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐπιστρέφων
  choice: वापस ले आता है
  rationale: भटके हुए झुंड को फेरकर लौटाने के चरवाही बिंब को स्पष्ट करता है, पर तकनीकी धर्मवैज्ञानिक अर्थ नहीं थोपता।
- source_word: ὡς ποιμήν
  choice: चरवाहे के समान
  rationale: मूल में व्यक्त उपमा को गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: अपने झुंड को
  rationale: स्वामित्व और चरवाही के रूपक, दोनों को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: πᾶσαν σάρκα का विस्तार
  choice: ‘हर देहधारी’ के द्वारा प्रभु की दया का व्यापक, प्राणिमात्र-संबंधी आयाम खुला रखा गया है।
  alternative: ‘समस्त मानवजाति’ या ‘हर जीवित प्राणी’
  rationale: यूनानी अभिव्यक्ति व्यापक है और सामान्य मानवीय दया की सीमित परिधि के विपरीत रखी गई है; इसे केवल मनुष्यों या स्पष्ट रूप से सभी जीवों तक सीमित करना मूल की वास्तविक अर्थ-खुलावट को घटा देता।
- issue: ἐπιστρέφων का भाव
  choice: चरवाहे द्वारा झुंड को ‘वापस ले आना’
  alternative: ‘फेरता है’, ‘लौटाता है’ या धर्मवैज्ञानिक अर्थ में ‘मन फिराता है’
  rationale: चरवाहे की उपमा भटके हुओं को वापस लाने का संकेत देती है। चुना गया रूप पुनःस्थापन का भाव रखता है, बिना बाद की तकनीकी धर्मवैज्ञानिक शब्दावली आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। क्रियाओं की क्रमिक शृंखला मूल यूनानी के सुधारात्मक और चरवाही स्वर को बनाए रखती है; ‘हर देहधारी’ बाइबिलीय मुहावरे की व्यापकता को पठनीय रूप में प्रस्तुत करता है।
