translation:
  language: hi
  text: भोर से साँझ तक समय बदलता रहता है[a], और प्रभु के सामने सब कुछ शीघ्र है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऋतु बदलती है,” “अवसर बदलता है,” अथवा “परिस्थिति बदलती है”; यूनानी καιρός प्रसंग के अनुसार समय, ऋतु, अवसर या परिस्थिति का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “और प्रभु के सामने सब कुछ त्वरित है।” यूनानी विशेषण का मूल भाव शीघ्रता या त्वरितता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: भोर से साँझ तक
  rationale: यह पूरे दिन की समय-सीमा को सहज और संक्षिप्त हिन्दी में व्यक्त करता है; πρωΐθεν के आरम्भिक प्रातःकालीन भाव को ‘भोर’ स्पष्ट करता है।
- source_word: μεταβάλλει
  choice: बदलता रहता है
  rationale: क्रिया परिवर्तन को सूचित करती है। ‘बदलता रहता है’ हिन्दी में सूत्रात्मक कथन की गतिशीलता और निरन्तर बदलती दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καιρός
  choice: समय
  rationale: καιρός समय, अवसर, ऋतु या परिस्थिति का बोध करा सकता है। यहाँ ‘समय’ व्यापकता बनाए रखता है और दिन के भीतर होने वाले परिवर्तन के प्रसंग से मेल खाता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की समग्रता को आधुनिक हिन्दी में ‘सब कुछ’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ταχινὰ
  choice: तेज़ी से घटित होता है
  rationale: ταχινός का मूल भाव शीघ्रता है। शाब्दिक ‘तेज़ हैं’ हिन्दी में अस्वाभाविक होता; यह क्रियात्मक रूप उसी गति के भाव को स्पष्ट रखता है, उसे ‘सरल’ या ‘क्षणभंगुर’ नहीं बनाता।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: यह यूनानी पद ‘प्रभु के समक्ष/दृष्टि में’ का भाव रखता है। ‘प्रभु के सामने’ संक्षिप्त, गरिमापूर्ण और स्रोत के निकट है।
theological_decisions:
- issue: ज्ञान-वचन में καιρός का अर्थ
  choice: समय
  alternative: ऋतु; अवसर; परिस्थिति
  rationale: ‘समय’ यूनानी शब्द की अर्थगत व्यापकता को मुख्य पाठ में बचाए रखता है; पादटिप्पणी अन्य वास्तविक सम्भावनाएँ बताती है और कथन को किसी एक प्रकार की परिस्थिति तक सीमित नहीं करती।
- issue: πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου का आशय
  choice: प्रभु के सामने सब कुछ तेज़ी से घटित होता है
  alternative: प्रभु की दृष्टि में सब कुछ शीघ्र है; प्रभु के सामने सब कुछ क्षणभंगुर है
  rationale: मुख्य पाठ ταχινὰ के गति या शीघ्रता वाले मूल भाव को रखता है। ‘क्षणभंगुर’ अर्थ को अधिक निर्धारित कर देगा, जबकि ‘प्रभु के लिए सब कुछ आसान है’ यूनानी विशेषण के प्राथमिक अर्थ से समर्थित नहीं है।
