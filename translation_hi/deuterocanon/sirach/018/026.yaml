  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सूत्रात्मक ज्ञान-साहित्यिक स्वर रखा गया है। ‘तेज़ी से घटित होता है’ शाब्दिक संरचना को हल्का-सा स्वाभाविक बनाते हुए यूनानी के शीघ्रता-भाव को सुरक्षित रखता है। मुख्य पाठ के दोनों पादटिप्पणी चिह्न [a] और [b] उपस्थित हैं।
