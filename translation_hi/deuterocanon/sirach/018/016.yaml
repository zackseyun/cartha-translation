base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/016.yaml
  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
translation:
  language: hi
  text: मन्नत मानने से पहले, उसे पूरा करने की तैयारी कर लो[a]; और उस व्यक्ति के समान न बनो जो याहवे को परखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी मन्नत तैयार कर।” इब्रानी अभिव्यक्ति संक्षिप्त और कुछ कठिन है; सम्भवतः आशय यह है कि मन्नत मानने से पहले उसे पूरा करने के लिए तैयार रहो।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “क्या ओस तपन को ठंडा नहीं करती? इसी प्रकार, वचन दान से उत्तम है।” सम्भवतः यूनानी परम्परा के पीछे पाठ का कोई दूसरा रूप था।'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: मन्नत मानने से पहले
  rationale: नדר के क्रियात्मक अर्थ ‘मन्नत मानना’ और בְּטֶרֶם के कालवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָכֵן נִדְרֶךָ
  choice: उसे पूरा करने की तैयारी कर लो
  rationale: शाब्दिक रूप से यह ‘अपनी मन्नत तैयार कर’ है। सन्दर्भ में आशय मन्नत मानने से पहले उसके निर्वाह के लिए तैयार रहने का है; पाठ की संक्षिप्तता और कठिनता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּל תִּהְיֶה כִּמְנַסָּה
  choice: उस व्यक्ति के समान न बनो जो … को परखता है
  rationale: निषेध और נסה के ‘परखना/परीक्षा लेना’ वाले अर्थ को स्पष्ट रखते हुए सहभागी रूप को सहज हिन्दी वाक्य में प्रस्तुत करता है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण हिन्दी में सुरक्षित रखता है।
- issue: याहवे को ‘परखने’ का अर्थ
  choice: परखता है
  alternative: परीक्षा लेता है / आज़माता है
  rationale: נסה का व्यापक अर्थ सुरक्षित रखा गया है; पाठ यह स्पष्ट नहीं करता कि यह अविश्वास, उकसावे या अधूरी मन्नत के द्वारा किस विशेष प्रकार की परीक्षा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्नत मानना’ हिन्दी का स्वाभाविक धार्मिक मुहावरा है। अर्धविराम दोनों समानान्तर आज्ञाओं को स्पष्ट रूप से अलग करता है।
