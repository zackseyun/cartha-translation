translation:
  language: hi
  text: बीमार पड़ने से पहले अपने आपको नम्र कर, और पापों के समय पश्चात्ताप प्रकट कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: बीमार पड़ने से पहले
  rationale: यह स्वाभाविक हिन्दी में बीमारी आरम्भ होने से पहले का समय व्यक्त करता है और यूनानी क्रिया के ‘बीमार पड़ने’ वाले भाव को बनाए रखता है।
- source_word: ταπεινώθητι
  choice: अपने आपको नम्र कर
  rationale: रूप की दृष्टि से यह निष्क्रिय आज्ञार्थक है, पर ज्ञान-साहित्य के इस उपदेश में इसका स्वाभाविक बल स्वेच्छा से स्वयं को नम्र करने पर है।
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: पापों के समय
  rationale: यह καιρός के काल-संबंधी भाव और ἁμαρτημάτων के बहुवचन को सुरक्षित रखता है, बिना पापों और समय के संबंध को आवश्यकता से अधिक स्पष्ट किए।
- source_word: δεῖξον
  choice: प्रकट कर
  rationale: ‘प्रकट कर’ हिन्दी में पश्चात्ताप को दिखाई देने योग्य बनाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιστροφήν
  choice: पश्चात्ताप
  rationale: मूल शब्द का अर्थ लौटना या फिरना हो सकता है; पापों के निकट संदर्भ में ‘पश्चात्ताप’ उसका नैतिक भाव स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पापों के संदर्भ में ἐπιστροφήν का अर्थ
  choice: पश्चात्ताप
  alternative: लौटना; फिरना
  rationale: निकट संदर्भ में ‘पापों’ का उल्लेख इसे केवल स्थानगत वापसी नहीं, बल्कि पाप से मुड़ने का नैतिक आह्वान बनाता है। फिर भी मूल शब्द की व्यापकता पादटिप्पणी में रखी गई है।
- issue: ταπεινώθητι का वाच्य और बल
  choice: अपने आपको नम्र कर
  alternative: नम्र किया जा
  rationale: यूनानी रूप निष्क्रिय है, पर आज्ञा के रूप में यहाँ स्वेच्छापूर्वक आत्म-दीनता अधिक स्वाभाविक अर्थ है; हिन्दी का शाब्दिक निष्क्रिय रूप असहज होता और बाहरी विवशता का अनावश्यक संकेत देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली रखी गई है। एकवचन आज्ञार्थक रूप मूल यूनानी के व्यक्तिगत संबोधन को सुरक्षित रखता है।
