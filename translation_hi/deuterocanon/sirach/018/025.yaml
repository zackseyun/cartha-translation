  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: hi
  text: भरपूरी के समय अकाल का समय याद रखो,[a] और धन के दिनों में गरीबी और अभाव को याद रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रचुरता के समय भूख का काल याद रखो।’ यूनानी में अकाल और भरपूरी के समयों का विरोध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: याद रखो
  rationale: यह आज्ञार्थक रूप सोच-समझकर स्मरण रखने का आह्वान करता है। ‘याद रखो’ सीधा, स्वाभाविक और उपदेशात्मक बल को सुरक्षित रखने वाला अनुवाद है।
- source_word: καιρὸν λιμοῦ
  choice: अकाल का समय
  rationale: καιρός समय या अवसर/काल को और λιμός अकाल को दर्शाता है; इसलिए यह केवल भूख नहीं, बल्कि अभाव की ठोस परिस्थिति है।
- source_word: ἐν καιρῷ πλησμονῆς
  choice: भरपूरी के समय
  rationale: πλησμονή का अर्थ भराव या प्रचुरता है। ‘भरपूरी’ अकाल के साथ स्पष्ट विरोध बनाए रखती है और सामान्य हिन्दी में सहज है।
- source_word: πτωχείαν
  choice: गरीबी
  rationale: πτωχεία निर्धन होने की दशा को व्यक्त करता है; ‘गरीबी’ इसका सीधा और सर्वसुलभ हिन्दी रूप है।
- source_word: ἔνδειαν
  choice: अभाव
  rationale: ἔνδεια किसी आवश्यक वस्तु की कमी या तंगी पर बल देता है। ‘अभाव’ इसे ‘गरीबी’ से संबद्ध, पर अलग अर्थ के रूप में सुरक्षित रखता है।
- source_word: ἐν ἡμέραις πλούτου
  choice: धन के दिनों में
  rationale: πλοῦτος धन या संपत्ति को दर्शाता है। ‘धन के दिनों में’ यूनानी बिंब और समानांतर वाक्य-संरचना को बनाए रखता है।
theological_decisions:
- issue: क्या पद को भविष्य की कठिनाई के बारे में सामान्य नैतिक कथन बनाकर सरल किया जाए
  choice: अकाल/भरपूरी और गरीबी/अभाव बनाम धन के ठोस विरोधों को बनाए रखा गया है।
  alternative: ‘अच्छे दिनों में याद रखो कि बुरे दिन आ सकते हैं’ जैसी सामान्य व्याख्यात्मक अभिव्यक्ति।
  rationale: यूनानी पाठ संतुलित समानांतरता में विशिष्ट आर्थिक दशाएँ रखता है। इन्हें बनाए रखना ज्ञान-साहित्य की ठोस शैली का सम्मान करता है और पाठ में न कही गई सामान्य व्याख्या जोड़ने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्मरणीय ज्ञानोक्ति। ‘भरपूरी’ सामान्य पाठक के लिए सहज रहते हुए πλησμονή की ‘पूर्णता/प्रचुरता’ को व्यक्त करती है; पद की संतुलित समानांतरता को यथासंभव बनाए रखा गया है।
