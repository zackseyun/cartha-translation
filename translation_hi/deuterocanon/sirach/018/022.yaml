  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
translation:
  language: hi
  text: समय पर अपनी मन्नत पूरी करने से बाधित मत हो, और धर्मी ठहराए जाने[a] के लिए मृत्यु तक प्रतीक्षा न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सही ठहराए जाने’ अथवा ‘धर्मी सिद्ध होने’। यूनानी शब्द का व्यापक अर्थ सही पाया जाना भी हो सकता है; यहाँ आवश्यक नहीं कि इसका आशय ‘धर्मी ठहराए जाने’ के उत्तरवर्ती तकनीकी धर्मवैज्ञानिक अर्थों से हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: किसी बात को तुम्हें रोकने न दो
  rationale: यूनानी निष्क्रिय आज्ञार्थक बाधा पड़ने या रोके जाने के विरुद्ध चेतावनी देता है। यह हिंदी प्रयोग निष्क्रिय भाव और नैतिक आग्रह को स्वाभाविक ढंग से व्यक्त करता है, बिना बाधा के स्रोत को निश्चित किए।
- source_word: ἀποδοῦναι
  choice: पूरी करने
  rationale: εὐχή के साथ क्रिया का अर्थ मन्नत को चुकाना या पूरा करना है। हिंदी में ‘मन्नत पूरी करना’ सर्वाधिक स्वाभाविक और प्रचलित संयोग है।
- source_word: εὐχήν
  choice: अपनी मन्नत
  rationale: यद्यपि εὐχή का अर्थ प्रार्थना भी हो सकता है, ἀποδοῦναι के साथ यहाँ परमेश्वर से की गई मन्नत अभिप्रेत है। ‘अपनी’ हिंदी में संदर्भगत संबंध स्पष्ट करता है, बिना अर्थ में नई बात जोड़े।
- source_word: εὐκαίρως
  choice: समय पर
  rationale: यह उचित अथवा नियत अवसर पर कार्य करने का भाव देता है। ‘समय पर’ संक्षिप्त, आधुनिक और विलंब न करने की चेतावनी के अनुकूल है।
- source_word: μὴ μείνῃς
  choice: प्रतीक्षा न करो
  rationale: संदर्भ में μένω का आशय केवल ठहरे रहने से नहीं, बल्कि आवश्यक कार्य को टालते रहने से है।
- source_word: ἕως θανάτου
  choice: मृत्यु तक
  rationale: यह विलंब की चरम सीमा को मूल के निकट रहते हुए संक्षेप में व्यक्त करता है।
- source_word: δικαιωθῆναι
  choice: धर्मी ठहराए जाने
  rationale: यह δικαιόω के निष्क्रिय रूप को बनाए रखता है और परमेश्वर के सामने सही या धर्मी ठहराए जाने का अर्थ खुला रखता है। पादटिप्पणी संभावित व्यापक अर्थ स्पष्ट करती है, ताकि बाद की किसी विशिष्ट धर्मवैज्ञानिक तकनीकी धारणा को अनिवार्य न बनाया जाए।
theological_decisions:
- issue: ज्ञान-साहित्य की इस चेतावनी में δικαιωθῆναι का अर्थ
  choice: धर्मी ठहराए जाने
  alternative: सही ठहराए जाने; धर्मी सिद्ध होने
  rationale: चुना हुआ अनुवाद यूनानी धार्मिक-नैतिक शब्दावली से संबंध बनाए रखता है, पर पादटिप्पणी यह स्पष्ट करती है कि यहाँ आशय व्यापक रूप से सही पाया जाना भी हो सकता है। इस तरह पाठ में बाद की तकनीकी धर्मवैज्ञानिक परिभाषा आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण आज्ञार्थक शैली रखी गई है। ‘मन्नत पूरी करना’ सामान्य हिंदी का स्वाभाविक पदबंध है। मूल अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘in due time’ के बाद था, जबकि पादटिप्पणी δικαιωθῆναι की व्याख्या करती है; इसलिए हिंदी में चिह्न अर्थानुसार ‘धर्मी ठहराए जाने’ के बाद रखा गया है।
