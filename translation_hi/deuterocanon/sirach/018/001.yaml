lexical_decisions:
- source_word: Ὁ ζῶν
  choice: जो जीवित रहता है
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है। यह अनुवाद उसके वर्णनात्मक रूप को बनाए रखता है और मूल में न आए हुए ‘परमेश्वर’ या ‘प्रभु’ को नहीं जोड़ता।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह पदबंध अनंत काल तक बने रहने का भाव व्यक्त करता है। ‘सदा’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: ἔκτισεν
  choice: रचा
  rationale: सृष्टि के प्रसंग में κτίζω अस्तित्व में लाने या सृजन करने को दर्शाता है। ‘रचा’ हिन्दी में इस भाव को स्वाभाविक और ऊँचे साहित्यिक स्तर पर व्यक्त करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह अस्तित्वमान समस्त वस्तुओं की व्यापक समष्टि को सूचित करता है। ‘सब कुछ’ सामान्य आधुनिक हिन्दी में स्पष्ट और सर्वसमावेशी है।
- source_word: κοινῇ
  choice: एक साथ
  rationale: क्रियाविशेषण का मूल भाव ‘सामूहिक रूप से’, ‘मिलाकर’ या ‘एक साथ’ हो सकता है। ‘एक साथ’ मुख्य पाठ में स्वाभाविक है, जबकि टिप्पणी यह स्पष्ट करती है कि यूनानी शब्द केवल समयगत तात्कालिकता ही नहीं, सृष्टि की समग्रता पर भी बल दे सकता है।
theological_decisions:
- issue: कर्ता की पहचान परमेश्वर के रूप में है, पर मूल यूनानी में कोई स्पष्ट ईश्वरीय नाम या उपाधि नहीं है
  choice: जो सदा जीवित रहता है
  alternative: परमेश्वर, जो सदा जीवित रहता है; प्रभु, जो सदा जीवित रहता है
  rationale: यूनानी पाठ कर्ता को वर्णनात्मक कृदंत-पदबंध से प्रस्तुत करता है; उसमें θεός या κύριος नहीं है। इसलिए अनुवाद मूल अभिव्यक्ति को बनाए रखता है और पहचान को प्रसंग से समझने देता है।
- issue: κοινῇ को समयगत अर्थ देना या समष्टिगत अर्थ देना
  choice: मुख्य पाठ में ‘एक साथ’, साथ में अर्थ-स्पष्टकारी पादटिप्पणी
  alternative: सभी को सामूहिक रूप से; सारी वस्तुओं को एक समष्टि के रूप में
  rationale: यूनानी क्रियाविशेषण संक्षिप्त और कुछ हद तक बहुअर्थी है। केवल ‘एक ही क्षण में’ कहना समयगत अर्थ को आवश्यकता से अधिक निश्चित कर देता, जबकि केवल ‘सामूहिक रूप से’ हिन्दी में अस्वाभाविक लग सकता है। मुख्य पाठ और पादटिप्पणी मिलकर दोनों संभावनाएँ सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘उसी ने’ वर्णनात्मक कर्ता पर यूनानी वाक्य के बल को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी-चिह्न संबंधित पद ‘एक साथ’ के तुरंत बाद रखा गया है।
