  naturalness: ‘जो सदा जीवित रहता है’ is understandable, but ‘जो सदा जीवित है’ is more idiomatic Hindi for an enduring, eternal state. The emphatic ‘उसी ने’ is not required by the Greek and slightly adds emphasis beyond the source; ‘उसने’ is natural and sufficient.
  terminology: ‘रचा’ is an apt elevated-modern rendering for κτίζω in this cosmological context. No unexpressed theological title is introduced. The note’s terms ‘सामूहिक रूप से’ and ‘समष्टि के रूप में’ appropriately explain alternatives without forcing either into the main text.
  issues:
