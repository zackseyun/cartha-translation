translation:
  language: hi
  text: जो सदा जीवित है, उसने सब कुछ एक साथ[a] रचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘सब कुछ सामूहिक रूप से’ या ‘सारी वस्तुओं को एक समष्टि के रूप में’ भी हो सकता है। यूनानी क्रियाविशेषण κοινῇ संक्षिप्त और कुछ हद तक बहुअर्थी है; यह पूरी सृष्टि की समग्रता पर बल दे सकता है।
