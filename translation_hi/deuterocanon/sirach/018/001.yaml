    issue: The main text uses ‘उसी ने’.
    rationale: The Greek articular participle identifies the subject but does not inherently carry the restrictive/emphatic force normally conveyed by Hindi ‘उसी’. Replacing it with ‘उसने’ is closer to the source while remaining natural.
  - severity: low
    issue: ‘सदा जीवित रहता है’ can suggest habitual continuance.
    rationale: For εἰς τὸν αἰῶνα, ‘सदा जीवित है’ more directly and idiomatically expresses the abiding state intended by ‘lives forever’.
