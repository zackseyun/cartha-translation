  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
translation:
  language: hi
  text: भोग-सुख की थोड़ी-सी मात्रा में भी आनंद मत ले[a], क्योंकि उसका अंत दरिद्रता में होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज़रा-से सुख में भी आनंद मत ले।” हिब्रू शब्द का अर्थ छोटा अंश, टुकड़ा या लेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू का अंतिम उपवाक्य अनिश्चित है। उसका शाब्दिक रूप कुछ ऐसा है, “जिसका ‘मुख/किनारा’ दो का है—उसकी दरिद्रता,” पर इसका स्पष्ट अर्थ नहीं बनता। यूनानी समानांतर पाठ का भाव है, “बहुत विलास में आनंद मत मना, और उसके खर्च से मत बँध,” जो इस चेतावनी को आर्थिक हानि से जोड़ता है।
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: आनन्द मत ले
  rationale: שמח का निषेध यहाँ किसी वस्तु में सुख या प्रसन्नता लेने को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और ज्ञान-साहित्य के अनुरूप है।
- source_word: שֶׁמֶץ
  choice: एक अंश में भी
  rationale: שֶׁמֶץ छोटे टुकड़े, अंश या लेश को सूचित करता है। ‘एक अंश में भी’ उसके न्यूनतावाची बल को बनाए रखता है और निषेध को स्वाभाविक हिन्दी देता है।
- source_word: תַּעֲנוּג
  choice: भोग-विलास
  rationale: संज्ञा सुख, ऐश या इन्द्रियजन्य आनन्द का बोध करा सकती है। प्रसंग में ‘भोग-विलास’ उस आत्मतुष्टिपरक सुख को स्पष्ट करता है, बिना यूनानी के ‘बहुत विलास’ को हिब्रू में आरोपित किए।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यद्यपि यह मूलतः सम्बन्धवाचक अव्यय है, यहाँ चेतावनी का कारण प्रस्तुत करता जान पड़ता है; ‘क्योंकि’ हिन्दी में इस सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: פִּי
  choice: परिणाम
  rationale: शाब्दिक अर्थ ‘मुख’ है, पर कठिन अंतिम वाक्यांश में इसे अन्त, सीमा या फल के अर्थ में समझना सम्भव है। ‘परिणाम’ कथन का सम्भावित आशय देता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: שְׂנַיִם
  choice: प्रत्यक्ष रूप से अनूदित नहीं
  rationale: प्रेषित पाठ में ‘दो/दुगुना’ अर्थ वाला यह रूप आसपास के शब्दों के साथ स्पष्ट वाक्य नहीं बनाता। इसे मुख्य पाठ में कृत्रिम ढंग से जोड़ने के बजाय पाठगत कठिनाई पादटिप्पणी में बताई गई है।
- source_word: רֵישׁוֹ
  choice: दरिद्रता
  rationale: ריש का स्पष्ट अर्थ गरीबी, अभाव या दरिद्रता है। कठिन उपवाक्य में यही सबसे स्थिर अर्थगत आधार है।
