  yaml_path: translation/deuterocanon/sirach/018/031.yaml
  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: hi
  text: यदि तुम अपने प्राण को उसकी इच्छा की तृप्ति दोगे,[a] तो इससे तुम अपने शत्रुओं के आनन्द का कारण बनोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम अपने प्राण की लालसा को तृप्त करोगे, तो तुम ऐसी वस्तु बन जाओगे जिस पर तुम्हारे शत्रु आनन्द मनाएँगे।”
    reason: εὐδοκίαν ἐπιθυμίας और ἐπίχαρμα के अधिक व्याख्यात्मक, प्रसंगानुकूल विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐὰν χορηγήσεις
  choice: यदि तुम ... दोगे
  rationale: शर्त और किसी वस्तु को उपलब्ध कराने का सीधा भाव सुरक्षित रहता है; प्रसंग में आत्म-लिप्सा निहित है, पर उसे मुख्य पाठ में अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τῇ ψυχῇ σου
  choice: अपने प्राण को
  rationale: ψυχή के भीतरी स्व या जीवन-तत्त्व संबंधी व्यापक अर्थ को रखता है। हिन्दी बाइबलीय भाषा में ‘प्राण’ स्वाभाविक है और यहाँ किसी तकनीकी आत्मा-सिद्धान्त को आरोपित नहीं करता।
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: उसकी अभिलाषा का सुख
  rationale: यह कठिन संबंध इच्छा से मिलने वाले सुख या संतुष्टि को सूचित करता है। शाब्दिक संबंध को दृश्यमान रखा गया है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ποιήσει σε
  choice: वह तुम्हें ... बना देगा
  rationale: यूनानी भविष्यकालीन कारक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘वह’ निकटवर्ती आत्म-तुष्टि के परिणाम की ओर संकेत करता है।
- source_word: ἐπίχαρμα τῶν ἐχθρῶν σου
  choice: तुम्हारे शत्रुओं के आनन्द का कारण
  rationale: ἐπίχαρμα किसी ऐसी वस्तु या व्यक्ति को दर्शाता है जिस पर दूसरे आनन्द मनाएँ। यह शत्रुओं के दुर्भावनापूर्ण हर्ष को व्यक्त करता है, पर ‘उपहास का पात्र’ जैसे अधिक संकुचित अर्थ को मुख्य पाठ में नहीं थोपता।
theological_decisions:
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘प्राण’
  alternative: अपने आपको; अपनी लालसा को
  rationale: यह आत्म-संयम से जुड़ा ज्ञानोपदेश है, आत्मा की प्रकृति पर तकनीकी कथन नहीं। फिर भी मूल में ψυχή स्पष्ट रूप से उपस्थित है, इसलिए उसे मिटाया नहीं गया।
- issue: ἐπίχαρμα में शत्रुतापूर्ण आनन्द
  choice: शत्रुओं के आनन्द का कारण
  alternative: शत्रुओं के उपहास का पात्र; ऐसी वस्तु जिस पर शत्रु आनन्द मनाएँ
  rationale: मूल में दूसरों के आनन्द का पात्र बनने का चित्र है। ‘उपहास’ या ‘पतन’ संभावित प्रसंगार्थ हैं, पर यूनानी उन्हें स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्राण’ स्रोत की ψυχή को बनाए रखता है; वाक्य की चेतावनीपूर्ण नीतिवचन-शैली और मूल की कुछ अर्थगत अस्पष्टता सुरक्षित रखी गई है।
