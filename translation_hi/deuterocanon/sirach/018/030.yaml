  register: आधुनिक मानक हिन्दी; उपदेशात्मक बहुवचन/आदरवाचक आज्ञा-रूप ‘चलो’ और ‘रोको’ सामान्य पाठक के लिए सहज हैं। वाक्य की समानांतर रचना और मूल का समापन अर्धविराम सुरक्षित रखा गया है।
