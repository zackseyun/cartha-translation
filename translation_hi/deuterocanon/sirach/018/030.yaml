translation:
  language: hi
  text: अपनी इच्छाओं के पीछे मत चलो[a], और अपनी लालसाओं से अपने आपको रोको;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी इच्छाओं का अनुसरण मत करो, और अपनी प्रबल चाहतों से अपने आपको रोको।”
    reason: 'शाब्दिक विकल्प: ὀπίσω … πορεύου में ‘अनुसरण करना’ और ὄρεξις में ‘प्रबल चाह’ का भाव भी संभव है।'
lexical_decisions:
- source_word: Ὀπίσω … μὴ πορεύου
  choice: पीछे मत चलो
  rationale: ὀπίσω के साथ πορεύομαι का अर्थ किसी के पीछे जाना या उसका अनुसरण करना है। ‘पीछे मत चलो’ मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: τῶν ἐπιθυμιῶν σου
  choice: अपनी इच्छाओं
  rationale: ἐπιθυμία व्यापक अर्थ में इच्छा या अभिलाषा को दर्शाता है। ‘इच्छाओं’ से चेतावनी का नैतिक संदर्भ बना रहता है, पर अर्थ को केवल यौन वासना तक सीमित नहीं किया जाता।
- source_word: τῶν ὀρέξεών σου
  choice: अपनी लालसाओं
  rationale: ὄρεξις प्रबल चाह, भूख या आवेग का बोध करा सकता है। ‘लालसाओं’ पहले पद की ‘इच्छाओं’ से भेद रखते हुए इसकी अधिक तीव्रता व्यक्त करता है।
- source_word: κωλύου
  choice: अपने आपको रोको
  rationale: मध्यवाच्य आज्ञार्थक रूप आत्म-संयम का भाव देता है। ‘अपने आपको रोको’ इस आत्मवाचक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इच्छा-संबंधी शब्दों का नैतिक दायरा
  choice: ‘इच्छाओं’ और ‘लालसाओं’ के द्वारा व्यापक, किंतु सावधान करने वाला अर्थ रखा गया।
  alternative: ‘वासनाओं’ और ‘भूखों’ अथवा ‘कामनाओं’ और ‘आवेगों’ का प्रयोग।
  rationale: यूनानी पाठ अनियंत्रित इच्छा के पीछे चलने से चेताता है, पर इसे केवल यौन पाप तक सीमित नहीं करता। चुने हुए शब्द इस व्यापकता और दोनों संज्ञाओं के बीच तीव्रता के अंतर को बनाए रखते हैं।
