- source_word: πρὶν ἢ λαλῆσαι
  choice: बोलने से पहले
  rationale: यह वाक्यांश बोलने की क्रिया से पहले की जाने वाली तैयारी बताता है। हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: μάνθανε
  choice: सीखो
  rationale: वर्तमान आज्ञार्थक क्रिया का सीधा अर्थ ‘सीखो’ है; यह बोलने से पहले ज्ञान प्राप्त करने की नीतिपरक सीख को बनाए रखता है।
- source_word: πρὸ ἀρρωστίας
  choice: बीमारी आने से पहले
  rationale: πρό कालगत प्राथमिकता और ἀρρωστία बीमारी या शारीरिक दुर्बलता को दर्शाते हैं। ‘आने’ जोड़ने से हिन्दी में भाव स्वाभाविक होता है, बिना बीमारी के प्रकार को सीमित किए।
- source_word: θεραπεύου
  choice: अपनी देखभाल करो
  rationale: मध्यवाच्य आज्ञार्थक रूप यहाँ बीमारी से पहले सावधानीपूर्वक अपनी देखभाल करने का भाव दे सकता है। यह ‘बीमारी से पहले उपचार’ जैसी अस्वाभाविक हिन्दी से बचता है, जबकि चिकित्सकीय अर्थ को पाद-टिप्पणी में सुरक्षित रखता है।
