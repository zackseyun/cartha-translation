  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
translation:
  language: hi
  text: मूर्ख और कृतघ्न व्यक्ति उलाहना देता है, और ईर्ष्यालु व्यक्ति[a] का उपहार आँखों को क्षीण कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बुरी नज़र वाले व्यक्ति’ का—अर्थात ऐसे व्यक्ति का जो कुढ़ते हुए या कंजूसी से देता है। यूनानी βασκάνος में ईर्ष्या और ‘बुरी नज़र’ दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
  choice: मूर्ख
  rationale: यह विशेषण व्यक्ति की मूर्खता को सूक्तिपरक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀχάριστος
  choice: कृतघ्न व्यक्ति
  rationale: शब्द का अर्थ उपकार या उपहार के प्रति आभार न मानने वाला है; ‘कृतघ्न’ इसका संक्षिप्त और नैतिक बल बनाए रखने वाला रूप है।
- source_word: ὀνειδιεῖ
  choice: उलाहना देता है
  rationale: क्रिया दोष लगाने, ताना देने या धिक्कारने का भाव रखती है। ‘उलाहना देता है’ प्रसंग के अनुरूप और सामान्य हिन्दी में स्वाभाविक है।
- source_word: δόσις
  choice: उपहार
  rationale: यद्यपि इसका अर्थ ‘देना’ भी हो सकता है, यहाँ देने वाले व्यक्ति के स्वभाव के साथ संबंध होने के कारण दी हुई वस्तु, अर्थात ‘उपहार’, अधिक स्वाभाविक है।
- source_word: βασκάνου
  choice: ईर्ष्यालु व्यक्ति का
  rationale: यूनानी शब्द सीधे ईर्ष्या या दुर्भावना रखने वाले व्यक्ति को सूचित कर सकता है। देने के प्रसंग में इसमें अनिच्छा से या कुढ़ते हुए देने का भाव भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἐκτήκει
  choice: क्षीण कर देता है
  rationale: क्रिया धीरे-धीरे गलाने, चुकाने या नष्ट करने का चित्र प्रस्तुत करती है। ‘क्षीण कर देता है’ आँखों के असामान्य पर जानबूझकर रखे गए रूपक को सुरक्षित रखता है।
- source_word: ὀφθαλμούς
  choice: आँखों को
  rationale: मूल पाठ के ठोस चित्र को बिना उसकी संभावित भावात्मक व्याख्या तय किए ज्यों का त्यों रखा गया है।
