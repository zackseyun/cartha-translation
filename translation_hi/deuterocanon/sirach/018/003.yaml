translation:
  language: hi
  text: उसने किसी को भी अपने कार्यों की घोषणा करने की अनुमति नहीं दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने किसी को भी अपने कार्यों का वर्णन करने में समर्थ नहीं बनाया”; अथवा, “उसने किसी को अपने कार्यों की घोषणा करने का अधिकार नहीं दिया।” यूनानी क्रिया दुर्लभ है और अनुमति, नियुक्ति या सामर्थ्य प्रदान करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθενί
  choice: किसी को भी नहीं
  rationale: नकारात्मक अनिश्चित सर्वनाम का संप्रदान रूप है; ἐξεποίησεν के साथ यह बताता है कि यह अनुमति या सामर्थ्य किसी व्यक्ति को नहीं दिया गया।
- source_word: ἐξεποίησεν
  choice: अनुमति नहीं दी
  rationale: यह दुर्लभ क्रिया यहाँ infinitive के साथ प्रयुक्त है और अनुमति देने, समर्थ बनाने या नियुक्त करने के बीच अर्थगत गुंजाइश रखती है। मुख्य पाठ में सहज हिन्दी के लिए ‘अनुमति नहीं दी’ चुना गया है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐξαγγεῖλαι
  choice: घोषणा करने
  rationale: ἐξαγγέλλω का यह रूप खुले रूप से घोषित या व्यापक रूप से वर्णित करने का भाव रखता है; ‘घोषणा करना’ उसके सार्वजनिक कथन-बल को बनाए रखता है।
- source_word: τὰ ἔργα αὐτοῦ
  choice: अपने कार्यों
  rationale: यह सीधा और स्वाभाविक अनुवाद है, जो परमेश्वर के कार्यों के व्यापक अर्थ को किसी विशेष प्रकार के कर्म तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के कार्यों के विषय में कथन का दायरा
  choice: पद कहता है कि उसने किसी को अपने कार्यों की घोषणा करने की अनुमति नहीं दी।
  alternative: उसने किसी को अपने कार्य घोषित करने में समर्थ नहीं बनाया; अथवा उसने किसी को उनकी घोषणा करने का अधिकार नहीं दिया।
  rationale: यूनानी वाक्य संक्षिप्त है और दुर्लभ ἐξεποίησεν अनुमति, सामर्थ्य प्रदान करने या नियुक्ति का संकेत दे सकती है। अनुवाद इस तनाव को पादटिप्पणी में रखता है और परमेश्वर के कार्यों की पूर्ण अज्ञेयता जैसी अधिक प्रबल धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘अपने’ का प्रयोग हिन्दी में कर्ता की ओर स्वाभाविक रूप से संकेत करता है; ‘कार्यों’ मूल के बहुवचन और व्यापक अर्थ को बनाए रखता है।
