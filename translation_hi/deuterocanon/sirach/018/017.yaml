  language: hi
  text: क्या एक वचन[a] अच्छी भेंट से बढ़कर नहीं है? और ये दोनों एक कृपालु मनुष्य[b] के पास होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बात’ या ‘कहना’। यूनानी में यह बोले गए वचन का भौतिक भेंट से विरोध करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘ये दोनों एक कृपालु मनुष्य में पाए जाते हैं।’ यूनानी वाक्यांश का अर्थ यह भी हो सकता है कि दोनों गुण ऐसे मनुष्य में विद्यमान हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: क्या ... नहीं होती?
  rationale: यह योग एक आलंकारिक प्रश्न का परिचय देता है। हिन्दी में प्रश्नवाचक रचना इसके बल को स्वाभाविक रूप से व्यक्त करती है; अलग से ‘देखो’ जोड़ना असहज और अनावश्यक होगा।
- source_word: λόγος
  choice: अच्छी बात
  rationale: यहाँ λόγος भौतिक भेंट के विपरीत बोले गए हितकारी या उचित वचन को सूचित करता है। केवल ‘शब्द’ की अपेक्षा ‘अच्छी बात’ हिन्दी में इस नीतिवचन का आशय अधिक स्वाभाविक ढंग से रखती है।
- source_word: ὑπὲρ
  choice: से बढ़कर
  rationale: तुलनात्मक प्रयोग में ὑπέρ श्रेष्ठता व्यक्त करता है। ‘से बढ़कर’ मूल की संक्षिप्त मूल्यपरक तुलना बनाए रखता है।
- source_word: δόμα ἀγαθόν
  choice: भली भेंट
  rationale: δόμα किसी दी हुई भेंट को और ἀγαθόν उसकी अच्छाई को दर्शाता है। ‘भली भेंट’ संक्षिप्त, गरिमापूर्ण और भौतिक देने तथा वचन के बीच का विरोध स्पष्ट रखता है।
- source_word: ἀμφότερα
  choice: ये दोनों
  rationale: यह पहले कही गई बात और भेंट, दोनों की ओर लौटता है। संकेतवाचक ‘ये’ हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: παρὰ
  choice: के पास होते हैं
  rationale: व्यक्ति के साथ παρά यहाँ दोनों वस्तुओं के उसके पास पाए जाने या उसके स्वभाव और व्यवहार में होने का भाव दे सकता है। ‘के पास होते हैं’ मूल की संगति/अधिकार की छवि को बिना एक ही अर्थ में सीमित किए रखता है।
- source_word: ἀνδρὶ
  choice: मनुष्य
  rationale: ἀνήρ का रूप व्याकरणतः पुल्लिंग एकवचन है। हिन्दी में ‘मनुष्य’ प्रतिनिधिक एकवचन और मानवीय संदर्भ दोनों को गरिमापूर्वक व्यक्त करता है, बिना अंग्रेज़ी ‘man’ की यांत्रिक नकल किए।
- source_word: κεχαριτωμένῳ
  choice: अनुग्रहशील
  rationale: यह कृपा या मनोहर अनुग्रह से युक्त व्यक्ति का वर्णन करता है। ‘अनुग्रहशील’ उदार और कृपालु आचरण का भाव रखता है और इसे केवल ‘कृपा पाया हुआ’ मानकर धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
theological_decisions:
- issue: नीतिवचन में पुल्लिंग प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: पुरुष
  rationale: यूनानी ἀνδρὶ पुल्लिंग एकवचन है, पर यह सामान्य मानवीय आचरण पर लागू नीतिकथन है। ‘मनुष्य’ एकवचन को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक प्रतिनिधिक अर्थ देता है।
- issue: κεχαριτωμένῳ का सक्रिय गुण या प्राप्त कृपा
  choice: अनुग्रहशील
  alternative: अनुग्रह पाया हुआ
  rationale: संदर्भ दयालु वचन और भेंट देने वाले व्यक्ति के चरित्र की बात करता है। इसलिए गुणसूचक अनुवाद संदर्भानुकूल है, जबकि कृपा प्राप्त करने का निष्क्रिय अर्थ संभव होते हुए भी यहाँ कम स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, नीतिवचनात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘भली भेंट’ और ‘अच्छी बात’ का संतुलन मौखिक कृपा तथा भौतिक उपहार के विरोध को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि मुख्य पाठ मूल की अर्थ-सीमा पर्याप्त रूप से सुरक्षित रखता है।
