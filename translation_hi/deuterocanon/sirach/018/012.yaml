translation:
  language: hi
  text: उसने देखा और भली-भाँति जान लिया कि उनका विनाश[a] बुरा था; इसलिए उसने अपने प्रायश्चित्त[b] को बढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी बरबादी’ अथवा ‘उनका पतन’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द पाप या दोष के निवारण का भाव भी रखता है; इसे ‘प्रायश्चित’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἶδεν
  choice: उसने देखा
  rationale: साधारण दृष्टि या बोध को व्यक्त करने वाले यूनानी क्रिया-रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: ἐπέγνω
  choice: भली-भाँति जान लिया
  rationale: यह क्रिया केवल देखने से आगे बढ़कर पूर्ण पहचान या समझ का भाव देती है; इससे दोनों यूनानी क्रियाओं की क्रमिक प्रगति बनी रहती है।
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: उनका विनाश
  rationale: καταστροφή यहाँ विनाश, बरबादी या पतन को सूचित करता है। ‘विनाश’ मूल के प्रबल अर्थ को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: ὅτι πονηρά
  choice: कि उनका विनाश बुरा था
  rationale: πονηρά का अर्थ संदर्भानुसार बुरा, दुःखद या अनिष्टकारी हो सकता है। ‘बुरा’ मूल की व्यापक अर्थ-सीमा और उसकी अस्पष्टता को बनाए रखता है।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: कारण से निकलने वाले निष्कर्ष को आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπλήθυνεν
  choice: बढ़ाया
  rationale: क्रिया का अर्थ बढ़ाना या बहुतायत करना है। हिन्दी में ‘बढ़ाया’ ‘बहुगुणित किया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: अपने प्रायश्चित
  rationale: ἐξιλασμός दोष या पाप के निवारण से जुड़े प्रायश्चित को दर्शाता है। ‘अपने’ से यूनानी संबंधवाचक αὐτοῦ सुरक्षित रहता है; ‘उनके लिए’ हिन्दी में निहित लाभार्थी को स्पष्ट करता है, यद्यपि वह यूनानी में अलग शब्द के रूप में नहीं आया।
theological_decisions:
- issue: ἐξιλασμός का अनुवाद
  choice: प्रायश्चित
  alternative: पाप-निवारण; क्षमा
  rationale: ‘प्रायश्चित’ मूल शब्द के पाप अथवा दोष दूर करने वाले धार्मिक भार को बनाए रखता है। केवल ‘क्षमा’ कहना अर्थ को जरूरत से अधिक हल्का कर देता, जबकि ‘पाप-निवारण’ व्याख्यात्मक है।
- issue: प्रायश्चित के लाभार्थी को स्पष्ट करना
  choice: उनके लिए
  alternative: 'वाक्यांश को न जोड़ना: ‘अपने प्रायश्चित को बढ़ाया’'
  rationale: यूनानी में लाभार्थी अलग से व्यक्त नहीं है, पर संदर्भ में वही लोग अभिप्रेत हैं जिनके विनाश का उल्लेख हुआ है। ‘उनके लिए’ हिन्दी में संबंध स्पष्ट करता है, इसलिए इसे पाठ में रखा गया है और टिप्पणी में इसकी निहित प्रकृति बताई गई है।
- issue: πονηρά की अर्थ-छाया
  choice: बुरा
  alternative: दुःखद; अनिष्टकारी; दुष्ट
  rationale: यह विशेषण यहाँ विनाश की दशा का वर्णन करता है और नैतिक दुष्टता तक सीमित नहीं है। ‘बुरा’ उसकी व्यापकता बनाए रखता है; अधिक संदर्भपरक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भली-भाँति जान लिया’ मूल की दो क्रमिक क्रियाओं को अलग रखता है। ‘प्रायश्चित’ धार्मिक अर्थ-भार सुरक्षित रखता है, जबकि पादटिप्पणियाँ καταστροφή की वैकल्पिक अर्थ-छायाओं और निहित लाभार्थी को स्पष्ट करती हैं।
