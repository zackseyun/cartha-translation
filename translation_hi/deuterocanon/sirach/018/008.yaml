  yaml_path: translation/deuterocanon/sirach/018/008.yaml
  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
translation:
  language: hi
  text: मनुष्य[a] क्या है, और उसकी उपयोगिता[b] क्या है? उसकी भलाई क्या है, और उसकी बुराई[c] क्या है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में एकवचन ἄνθρωπος है, जिसका अर्थ यहाँ सामान्य रूप से “मानव” या प्रतिनिधि रूप में “मनुष्य” है।
    reason: lexical_alternative
  - marker: b
    text: “उपयोगिता” के लिए यूनानी χρῆσις है; इसका अर्थ “उपयोग,” “काम,” “कार्य” या “लाभ” भी हो सकता है। यहाँ प्रश्न मनुष्य के व्यावहारिक मूल्य या भूमिका के विषय में है।
    reason: lexical_alternative
  - marker: c
    text: “बुराई” के लिए यूनानी κακόν है; इसका अर्थ अधिक व्यापक रूप से “खराबी,” “अनिष्ट” या “हानि” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: क्या
  rationale: बार-बार आया प्रश्नवाचक τί मनुष्य के स्वरूप, मूल्य और दशा पर आलंकारिक प्रश्न उठाता है; हिन्दी में “क्या” इसके रूप और संक्षिप्त लय को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: एकवचन ἄνθρωπος यहाँ सामान्य अर्थ में किसी मानव व्यक्ति अथवा प्रतिनिधि रूप में मानवता को सूचित करता है। “मनुष्य” आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और लिंग की दृष्टि से व्यापक है।
- source_word: χρῆσις
  choice: उपयोगिता
  rationale: χρῆσις उपयोग, व्यवहार अथवा व्यावहारिक मूल्य/कार्य को सूचित कर सकता है। “उपयोगिता” हिन्दी में “उसका उपयोग” की अपेक्षा अधिक स्वाभाविक है और उद्देश्य का अतिरिक्त भाव जोड़े बिना व्यावहारिक मूल्य को व्यक्त करता है।
- source_word: ἀγαθόν
  choice: भलाई
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग ἀγαθόν, κακόν के सीधे विरोध में, व्यक्ति की अच्छाई या उससे जुड़ी भलाई का व्यापक अर्थ रखता है। “भलाई” इस नैतिक और हितकारी विस्तार को खुला रखती है।
- source_word: κακόν
  choice: बुराई
  rationale: ἀγαθόν के प्रतिलोम में κακόν बुराई, खराबी अथवा हानि का अर्थ दे सकता है। “बुराई” विरोध की नैतिक गंभीरता बनाए रखती है, जबकि पादटिप्पणी इसके व्यापक अर्थ की सूचना देती है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: दोनों बार आया एकवचन संबंधकारक सर्वनाम ἄνθρωπος की ओर लौटता है। हिन्दी में स्त्रीलिंग संज्ञाओं “उपयोगिता,” “भलाई” और “बुराई” के साथ “उसकी” स्वाभाविक संबंधसूचक रूप है।
theological_decisions:
- issue: ज्ञान-साहित्य में ἄνθρωπος का सामान्य मानव-संदर्भ
  choice: मनुष्य … उसकी
  alternative: आदमी … उसका; मानवजाति … उसकी
  rationale: यूनानी पाठ एकवचन ἄνθρωπος और एकवचन αὐτοῦ रखता है। “मनुष्य” उस एकवचन, प्रतिनिधिक मानव-संदर्भ को बनाए रखता है, पर अनावश्यक रूप से केवल पुरुष तक सीमित नहीं करता।
- issue: κακόν का नैतिक अथवा व्यापक प्रतिकूल अर्थ
  choice: बुराई
  alternative: खराबी; हानि; अनिष्ट
  rationale: ἀγαθόν और κακόν का युग्म नैतिक चिंतन को आमंत्रित करता है, इसलिए मुख्य पाठ में “भलाई/बुराई” का संतुलित विरोध रखा गया है। फिर भी κακόν प्रतिकूलता या हानि तक व्यापक हो सकता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: χρῆσις को उद्देश्यपरक अर्थ देना या व्यावहारिक मूल्य तक सीमित रखना
  choice: उपयोगिता
  alternative: उद्देश्य; लाभ; काम
  rationale: “उद्देश्य” किसी निर्धारित परम प्रयोजन का भाव जोड़ सकता है जो χρῆσις में अनिवार्य नहीं है। “उपयोगिता” व्यावहारिक मूल्य या कार्य के प्रश्न को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष के व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और ज्ञान-साहित्य की संक्षिप्त, प्रश्नात्मक तथा गरिमापूर्ण शैली रखती है। समानांतर वाक्य-विन्यास यूनानी की लय को सुरक्षित रखता है; “मनुष्य” साधारण पाठक के लिए स्पष्ट रहते हुए सामान्य मानव-संदर्भ व्यक्त करता है।
