  text: और उसके महान कार्यों को कौन खोज निकाल सकेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम एक आलंकारिक प्रश्न आरम्भ करता है; ‘कौन’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἐξιχνιάσει
  choice: थाह पा सकेगा
  rationale: क्रिया का अर्थ किसी बात का पूरी तरह पता लगाना या उसे खोज निकालना है। ‘थाह पा सकेगा’ भविष्यकालीन आलंकारिक प्रश्न और निहित मानवीय असमर्थता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ μεγαλεῖα
  choice: महान कामों
  rationale: बहुवचन संज्ञा महान कार्यों या महानता के प्रकट रूपों को सूचित करती है। ‘महान कामों’ मूल की व्यापकता बनाए रखता है और अत्यधिक व्याख्यात्मक नहीं है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यह सामान्य संबंधवाचक रूप है। प्रसंग में इसका संकेत परमेश्वर की ओर है, पर मूल पद की तरह यहाँ नाम को जोड़कर स्पष्ट नहीं किया गया।
theological_decisions:
- issue: सर्वनाम αὐτοῦ का संदर्भ
  choice: ‘उसके’—प्रसंगानुसार परमेश्वर
  alternative: ‘परमेश्वर के’ कहकर संदर्भ को स्पष्ट करना
  rationale: आसपास का प्रसंग स्पष्ट करता है कि सर्वनाम परमेश्वर के लिए है। फिर भी मूल की सर्वनामात्मक अभिव्यक्ति बनाए रखने से अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज आलंकारिक प्रश्न। ‘थाह पाना’ सामान्य पाठक के लिए बोधगम्य है और यूनानी क्रिया के पूर्ण खोज या अन्वेषण के भाव को अच्छी तरह व्यक्त करता है।
