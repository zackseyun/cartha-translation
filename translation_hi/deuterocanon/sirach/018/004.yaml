review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, future/modal force, plural object, and possessive pronoun are retained. However, ‘थाह पाना’ more naturally takes an abstract depth, extent, or mystery as its object; with ‘कामों’ it can imply measuring their profundity rather than tracing/searching them out (ἐξιχνιάσει).
  naturalness: ‘उसके महान कामों की थाह कौन पा सकेगा?’ is understandable, but the collocation is somewhat strained in modern standard Hindi. ‘खोज निकाल सकेगा’ is idiomatic and directly conveys thorough searching or tracing out.
  terminology: ‘महान कार्यों’ suitably renders τὰ μεγαλεῖα as God’s great acts, without over-specifying them. The pronoun ‘उसके’ rightly preserves the Greek expression and its contextual reference to God.
  issues:
  - severity: low
    issue: ‘थाह पाना’ is not the most precise idiom for searching out deeds.
    rationale: The Greek verb ἐξιχνιάζω denotes tracing out or investigating thoroughly. Revising to ‘खोज निकाल सकेगा’ better represents that action while preserving the rhetorical future question.
