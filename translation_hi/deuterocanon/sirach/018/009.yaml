lexical_decisions:
- source_word: ἀνθρώπου
  choice: मनुष्य के
  rationale: यहाँ सामान्य मानव-जीवन का उल्लेख है; ‘मनुष्य’ लिंग-समावेशी और प्रसंगानुकूल है।
- source_word: ἀριθμὸς ἡμερῶν
  choice: दिनों की संख्या
  rationale: यूनानी पदबंध की गणनात्मक छवि को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πολλὰ ἔτη ἑκατόν
  choice: बहुत-से वर्ष है—सौ
  rationale: ‘बहुत-से’ और उसके बाद आने वाली स्पष्ट संख्या ‘सौ’—दोनों को सुरक्षित रखता है; मूल में ‘अधिक-से-अधिक’ जैसा कोई पद नहीं है।
theological_decisions:
- issue: मानव आयु की सीमा या सामान्य परिमाण
  choice: पाठ को ‘बहुत-से वर्ष—सौ’ के रूप में रखा गया है
  alternative: ‘अधिक-से-अधिक सौ वर्ष’
  rationale: यूनानी पाठ में अधिकतम सीमा सूचित करने वाला पद नहीं है। इसलिए व्याख्यात्मक सीमा जोड़ने के बजाय मूल कथन का असामान्य तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। डैश यूनानी कथन में ‘बहुत-से वर्ष’ और ‘सौ’ के बीच के संक्षिप्त व्याख्यात्मक संबंध को दर्शाता है।
