base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/033.yaml
  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: hi
  text: पेटू और पियक्कड़ मत बनो,[b] जब तुम्हारी थैली में कुछ भी न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी בַּכִּים कठिन है; यूनानी समानांतर में ‘तुम्हारी थैली में’ है, जो यहाँ अपनाए गए आर्थिक अर्थ का समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: 'यूनानी साक्षी चेतावनी को विस्तार से कहता है: “उधार के पैसे से भोज करके निर्धन मत बनो, जब तुम्हारी थैली में कुछ भी न हो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹלֵל
  choice: पेटू
  rationale: इब्रानी ज्ञान-साहित्य में यह शब्द प्रायः अतिभोजन करने वाले या खाने में अपव्ययी व्यक्ति को दर्शाता है। ‘पेटू’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा अगले शब्द के साथ दुर्गुणों की जोड़ी बनाए रखता है।
- source_word: וְסוֹבֵא
  choice: और पियक्कड़
  rationale: यह अत्यधिक मदिरापान के अभ्यस्त व्यक्ति को दर्शाता है। ‘पियक्कड़’ साधारण आधुनिक हिन्दी में स्पष्ट है और नैतिक चेतावनी का बल बनाए रखता है।
- source_word: וּמְאוּמָה אֵין
  choice: जब ... कुछ भी न हो
  rationale: शाब्दिक संयोजन ‘और कुछ भी नहीं’ है, पर प्रसंग में यह अभाव की परिस्थिति बताता है। ‘जब’ हिन्दी में चेतावनी और आर्थिक स्थिति का संबंध स्वाभाविक रूप से व्यक्त करता है, बिना उसे कठोर कारणात्मक कथन बनाने के।
- source_word: בַּכִּים
  choice: तुम्हारी थैली में
  rationale: इब्रानी रूप कठिन और अनिश्चित है। यूनानी समानांतर ἐν μαρσιππίῳ स्पष्टतः धन रखने की थैली बताता है; इसलिए आर्थिक आशय को ‘तुम्हारी थैली में’ से व्यक्त किया गया है।
theological_decisions:
- issue: कठिन अंतिम इब्रानी शब्द के लिए यूनानी समानांतर का उपयोग
  choice: मुख्य चेतावनी को उपलब्ध इब्रानी के अनुसार पेटूपन और पियक्कड़पन के विरुद्ध रखा गया, और अंतिम पदबंध को यूनानी के समर्थन से ‘जब तुम्हारी थैली में कुछ भी न हो’ अनूदित किया गया।
  alternative: ‘उधार के पैसे से भोज करके निर्धन मत बनो, जब तुम्हारी थैली में कुछ भी न हो।’
  rationale: जहाँ इब्रानी उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी आर्थिक आशय स्पष्ट करता है, पर उधार लेकर भोज करने और निर्धन बनने की उसकी विस्तृत भाषा को मुख्य पाठ में जोड़ना उपलब्ध इब्रानी से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोपयोगी रखी गई है। ‘पेटू’ और ‘पियक्कड़’ दुर्गुणों की इब्रानी जोड़ी को सीधे व्यक्त करते हैं; ‘थैली’ प्राचीन धन-थैली और सामान्य आर्थिक साधनों—दोनों का सहज बोध कराती है।
