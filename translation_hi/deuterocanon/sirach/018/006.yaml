  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: hi
  text: न तो घटाना संभव है, न जोड़ना; और प्रभु के आश्चर्यों की थाह पाना[a] संभव नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूरी तरह खोज लेना’ अथवा ‘पूरी तरह समझ पाना’।
    reason: ἐξιχνιάσαι में खोजते हुए अंत तक पहुँचने और पूरी तरह समझ लेने—दोनों का भाव हो सकता है।
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: संभव नहीं है
  rationale: यह निर्वैयक्तिक यूनानी रचना केवल किसी वस्तु के न होने की नहीं, बल्कि मानवीय असमर्थता या असंभवता की बात करती है। हिंदी में वाक्य-संतुलन के लिए पहले खंड में ‘संभव है’ के साथ ‘न…न’ और दूसरे में ‘संभव नहीं है’ रखा गया है।
- source_word: ἐλαττῶσαι
  choice: घटाना
  rationale: इसका अर्थ किसी चीज़ को कम या छोटा करना है। ‘घटाना’ आधुनिक हिंदी में स्पष्ट है और ‘जोड़ना’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: προσθεῖναι
  choice: जोड़ना
  rationale: मूल अर्थ किसी चीज़ को और मिलाने या जोड़ने का है। यह ‘घटाना’ के विपरीत अर्थ को सीधे बनाए रखता है।
- source_word: ἐξιχνιάσαι
  choice: थाह पाना
  rationale: यूनानी क्रिया किसी बात के चिह्नों का पीछा करते हुए उसकी पूरी खोज या समझ तक पहुँचने का भाव रखती है। ‘थाह पाना’ संपूर्ण समझ की सीमा और मानवीय असमर्थता दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὰ θαυμάσια
  choice: आश्चर्यों
  rationale: बहुवचन संज्ञा अद्भुत वस्तुओं, घटनाओं या कार्यों—सभी को समेट सकती है। ‘आश्चर्यों’ से यह व्यापकता बनी रहती है और अर्थ केवल कार्यों तक सीमित नहीं होता।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त दैवी उपाधि है। ‘प्रभु’ हिंदी बाइबलीय प्रयोग में प्रतिष्ठित और सहज समकक्ष है।
theological_decisions:
- issue: ‘घटाना’ और ‘जोड़ना’ का अनकहा कर्म
  choice: कर्म को मूल यूनानी की तरह अनकहा रखा गया है।
  alternative: संदर्भ के आधार पर ‘उसके कामों में’ या ‘उनमें’ जैसा कर्म जोड़ना।
  rationale: यूनानी पाठ कर्म को स्पष्ट नहीं करता। उसे जोड़ने से कथन का क्षेत्र अनावश्यक रूप से संकरा हो जाता; कर्मरहित रूप मूल की सूक्तिपरक संक्षिप्तता और अस्पष्टता बचाता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस ज्ञान-साहित्यिक संदर्भ में यह किसी मानवीय स्वामी का सामाजिक संबोधन नहीं, बल्कि परमेश्वर की उपाधि है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले खंड का कर्म जानबूझकर नहीं जोड़ा गया है। अर्धविराम यूनानी वाक्य के दो समानांतर असंभवताओं वाले खंडों को स्पष्ट करता है।
