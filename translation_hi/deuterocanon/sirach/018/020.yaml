  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
translation:
  language: hi
  text: न्याय होने से पहले अपने आप को परखो, और जाँच की घड़ी[a] में तुम्हें प्रायश्चित[b] मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निरीक्षण की घड़ी में’ अथवा ‘लेखा लिए जाने के समय’; यूनानी शब्द दैवी जाँच या हस्तक्षेप के निर्णायक समय का संकेत भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दोष-निवारण’; यूनानी शब्द दोष के हटने और अनुग्रह या मेल की पुनर्स्थापना का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: न्याय से पहले
  rationale: κρίσις का अर्थ न्याय या न्यायिक आकलन है। ‘न्याय से पहले’ इसके व्यापक अर्थ को बनाए रखता है और इसे केवल दण्डादेश तक सीमित नहीं करता।
- source_word: ἐξέταζε σεαυτόν
  choice: अपनी जाँच कर
  rationale: यह आत्म-परीक्षण की आज्ञा है। ‘अपनी जाँच कर’ आधुनिक हिन्दी में सहज है और मूल के प्रत्यक्ष आत्मावलोकन को व्यक्त करता है।
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: परख की घड़ी में
  rationale: ἐπισκοπή में निरीक्षण, लेखा लिया जाना और दैवी हस्तक्षेप—इन सबकी संभावना है। ‘परख की घड़ी’ स्वाभाविक हिन्दी में न्यायिक गंभीरता बनाए रखती है, जबकि इसकी व्यापकता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: εὑρήσεις
  choice: तू … पाएगा
  rationale: εὑρίσκω के भविष्यत् रूप का सीधा अर्थ ‘पाएगा’ है; हिन्दी में यह ‘ढूँढ़ निकालेगा’ की तुलना में इस प्रसंग में अधिक स्वाभाविक है।
- source_word: ἐξιλασμόν
  choice: प्रायश्चित
  rationale: ἐξιλασμός दोष के निवारण और संबंध या कृपा की पुनर्स्थापना का भाव रखता है। ‘प्रायश्चित’ हिन्दी में संक्षिप्त और परिचित है, यद्यपि संभावित वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: बुद्धि-साहित्य के इस प्रसंग में ἐπισκοπή का अर्थ
  choice: दैवी या न्यायिक भाव वाली ‘परख’
  alternative: निरीक्षण; लेखा लिए जाने का समय; दैवी आगमन या हस्तक्षेप
  rationale: यह पद संभवतः उस निर्णायक समय की ओर संकेत करता है जब मनुष्य की जाँच होती या उससे लेखा लिया जाता है। ‘परख’ इस न्यायिक भाव को व्यक्त करती है, पर यह निश्चित नहीं करती कि आशय केवल अन्तिम न्याय, कोई दैवी हस्तक्षेप, या सामान्य निरीक्षण है।
- issue: ἐξιλασμόν का अनुवाद
  choice: प्रायश्चित
  alternative: दोष-निवारण; अनुग्रह की पुनःप्राप्ति
  rationale: मूल शब्द दोष मिटाए जाने और कृपा या मेल की पुनर्स्थापना का धार्मिक भार रखता है। ‘प्रायश्चित’ इसे पठनीय हिन्दी में संजोता है, जबकि पाद-टिप्पणी इसके अर्थ-क्षेत्र को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर ज्ञान-वचन की शैली रखी गई है। एकवचन संबोधन के लिए ‘तू’ मूल यूनानी के प्रत्यक्ष व्यक्तिगत आदेश को बनाए रखता है। पाद-टिप्पणी चिह्न उन्हीं शब्दों पर लगाए गए हैं जिनकी व्याख्या वे करते हैं।
