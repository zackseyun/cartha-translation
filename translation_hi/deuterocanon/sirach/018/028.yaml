  yaml_path: translation/deuterocanon/sirach/018/028.yaml
  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
translation:
  language: hi
  text: हर विवेकी मनुष्य ने बुद्धि को पहचान लिया है[a], और बुद्धि को पानेवाले की वह प्रशंसा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर विवेकी व्यक्ति ने बुद्धि को पहचान लिया है, और बुद्धि को पानेवाले की प्रशंसा करेगा।” यूनानी में विवेकी व्यक्ति के लिए पुल्लिंग एकवचन शब्द है, जबकि ‘बुद्धि’ के लिए प्रयुक्त सर्वनाम स्त्रीलिंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: हर
  rationale: एकवचन विशेषण के साथ इसका भाव प्रत्येक व्यक्ति पर अलग-अलग लागू होता है; इसलिए ‘हर’ स्वाभाविक और सटीक है।
- source_word: συνετὸς
  choice: विवेकी मनुष्य
  rationale: यह शब्द समझ-बूझ और व्यावहारिक परख रखनेवाले व्यक्ति को दर्शाता है। ‘विवेकी’ इस अर्थ को समेटता है, और ‘मनुष्य’ यूनानी के पुल्लिंग एकवचन प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: ἔγνω
  choice: पहचान लिया है
  rationale: γινώσκω के भूतकालिक रूप में यहाँ बुद्धि को उसके वास्तविक स्वरूप में जान लेने या पहचान लेने का पूर्ण भाव है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में σοφία का मानक और स्वाभाविक हिन्दी प्रतिशब्द ‘बुद्धि’ है।
- source_word: τῷ εὑρόντι αὐτὴν
  choice: उसे पानेवाले की
  rationale: यूनानी पद का शाब्दिक अर्थ ‘उसको पानेवाले को’ है। हिन्दी में ‘प्रशंसा करना’ के साथ संबंधकारक संरचना अधिक स्वाभाविक है; ‘उसे’ का संदर्भ स्त्रीलिंग संज्ञा ‘बुद्धि’ से है।
- source_word: δώσει ἐξομολόγησιν
  choice: प्रशंसा करेगा
  rationale: शाब्दिक रूप ‘प्रशंसा देगा’ हिन्दी में अस्वाभाविक है। क्रियात्मक अभिव्यक्ति यूनानी के भाव—सम्मानपूर्ण अथवा कृतज्ञ सार्वजनिक सराहना—को स्पष्ट रखती है और भविष्यकाल को भी सुरक्षित रखती है।
theological_decisions:
- issue: बुद्धि का स्त्रीलिंग चित्रण और मानव विषय का प्रतिनिधिक पुल्लिंग
  choice: मुख्य पाठ में ‘विवेकी मनुष्य’ और स्त्रीलिंग संज्ञा ‘बुद्धि’ रखी गई है
  alternative: ‘हर विवेकी व्यक्ति ने बुद्धि को पहचान लिया है, और उसे पानेवाले की प्रशंसा करेगा’
  rationale: यूनानी में मानव विषय पुल्लिंग एकवचन है और σοφία स्त्रीलिंग है। हिन्दी में ‘बुद्धि’ स्वयं स्त्रीलिंग है, जबकि ‘उसे’ से सजीव स्त्री और निर्जीव वस्तु के बीच भेद प्रकट नहीं होता। मुख्य पाठ स्रोत की प्रतिनिधिक पुल्लिंग रचना बनाए रखता है; पादटिप्पणी अधिक लिंग-निरपेक्ष स्वाभाविक विकल्प बताती है, बिना बुद्धि के साहित्यिक स्त्रीलिंग को सिद्धान्तगत रूप से बढ़ाने या घटाने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘विवेकी’ ज्ञान-साहित्य के अनुरूप है; ‘प्रशंसा करेगा’ शाब्दिक ‘प्रशंसा देगा’ की अपेक्षा स्वाभाविक हिन्दी है।
