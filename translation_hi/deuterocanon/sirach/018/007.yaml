base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
translation:
  language: hi
  text: जब मनुष्य अपना काम पूरा कर लेता है[a], तब वह आरम्भ करता है; और जब वह रुक जाता है, तब वह असमंजस में पड़ जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मनुष्य पूर्ण करता है” या “जब मनुष्य पूरा कर लेता है।” यूनानी क्रिया का अधिक औपचारिक अनुवाद “पूर्ण करता है” या “पूर्णता तक पहुँचता है” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह निरुत्तर हो जाएगा,” “वह उलझन में पड़ जाएगा,” अथवा “उसे आगे का मार्ग नहीं सूझेगा।” यूनानी शब्द ऐसी दशा बता सकता है जिसमें कोई उत्तर या आगे बढ़ने का उपाय न मिले।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह सामान्य कालगत शर्त प्रकट करता है। हिन्दी में ‘जब’ सूक्तिपरक शैली और दोनों समानांतर उपवाक्यों के लिए स्वाभाविक है।
- source_word: συντελέσῃ
  choice: पूरा कर चुका होता है
  rationale: क्रिया किसी काम या प्रक्रिया को पूर्ण करने का भाव देती है। यह पूर्णता और अगले ‘आरम्भ करता है’ के बीच मूल विरोधाभास बनाए रखती है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यूनानी एकवचन संज्ञा यहाँ प्रतिनिधिक और सामान्य अर्थ में है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और कथन को केवल पुरुषों तक सीमित नहीं करता।
- source_word: τότε ἄρχεται
  choice: तभी वह आरम्भ करता है
  rationale: ἄρχεται का सीधा अर्थ ‘आरम्भ करता है’ है। ‘तभी’ τότε को उभारते हुए पूर्णता और आरम्भ के सूक्तिपरक विरोध को स्पष्ट रखता है।
- source_word: παύσηται
  choice: रुक जाता है
  rationale: यह किसी क्रिया के रुकने या समाप्त होने को व्यक्त करता है। ‘रुक जाता है’ स्पष्ट, आधुनिक और पहले खंड के अनुरूप है।
- source_word: ἀπορηθήσεται
  choice: निरुत्तर हो जाएगा
  rationale: यह आगे का मार्ग या उत्तर न सूझने की दशा व्यक्त कर सकता है। ‘निरुत्तर’ उस असमंजस को संक्षेप में रखता है, जबकि पादटिप्पणी व्यापक वैकल्पिक अर्थ बताती है।
theological_decisions:
- issue: मानवीय पूर्णता और सीमित समझ से संबंधित सूक्ति का आशय
  choice: 'पद को व्यापक विरोधाभासी सूक्ति के रूप में रखा गया है: मनुष्य जब पूरा करता है, तभी आरम्भ करता है; और रुकने पर निरुत्तर हो जाता है।'
  alternative: इसे केवल मानव परिश्रम की अनंतता या विशेष रूप से मृत्यु में मानवीय गतिविधि के अंत का कथन माना जा सकता है।
  rationale: यूनानी पाठ संक्षिप्त है और उसमें न परिश्रम का स्पष्ट उल्लेख है, न मृत्यु का। इसलिए अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सहज और सूक्तिपरक शैली अपनाई गई है। ‘पूरा’ और ‘आरम्भ’ का विरोध मूल पद की संक्षिप्त विडंबना बनाए रखता है; किसी विशिष्ट धार्मिक व्याख्या को पाठ में नहीं जोड़ा गया।
