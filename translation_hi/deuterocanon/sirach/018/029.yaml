- source_word: συνετοὶ ἐν λόγοις
  choice: वचनों में समझदार
  rationale: यह यूनानी पद की संरचना और उसके व्यापक अर्थ को बनाए रखता है; λόγοις यहाँ कथनों, बातों या उपदेशों की ओर संकेत कर सकता है।
- source_word: καὶ αὐτοὶ ἐσοφίσαντο
  choice: उन्होंने स्वयं भी बुद्धि पाई
  rationale: मध्यवाच्य क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और ज्ञान अर्जित करने या बुद्धिमान बनने के भाव को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀνώμβρησαν
  choice: वर्षा की
  rationale: क्रिया के सजीव रूपक—वर्षा की तरह बहुतायत से उंडेलना—को बनाए रखता है।
