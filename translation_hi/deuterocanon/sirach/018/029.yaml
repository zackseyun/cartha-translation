  rationale: παροιμία के ज्ञानपरक कथन के अर्थ के लिए ‘नीतिवचन’ और ἀκριβής के शुद्ध, सावधानी से गढ़े अथवा ठीक होने के भाव के लिए ‘सटीक’ चुना गया है।
