lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले कारणात्मक निष्कर्ष को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐμακροθύμησεν
  choice: धीरज रखा
  rationale: क्रिया का अर्थ क्रोध करने में देर करना, सहनशील होना या धैर्य दिखाना है। ‘धीरज रखा’ इस भाव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि κύριος का मानक, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: ἐπʼ αὐτοῖς
  choice: उनके साथ
  rationale: μακροθυμέω के साथ यह सम्बन्धवाचक भाव हिन्दी में ‘उनके साथ धीरज रखा’ के रूप में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἐξέχεεν
  choice: उंडेल दी
  rationale: मूल क्रिया के ‘बहा देने/उंडेल देने’ के सजीव रूपक को बनाए रखता है और दया की प्रचुरता का संकेत देता है।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: अपनी दया
  rationale: ἔλεος के लिए ‘दया’ सामान्य, स्पष्ट और धार्मिक संदर्भ में परिचित शब्द है; आत्मवाचक ‘अपनी’ हिन्दी में कर्ता प्रभु की ओर स्वाभाविक संकेत करता है।
- source_word: ἐπʼ αὐτοὺς
  choice: उन पर
  rationale: ‘उंडेल दी’ के साथ यह मूल यूनानी के दिशात्मक रूपक को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में κύριος परमेश्वर की उपाधि है। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और गरिमापूर्ण है, जबकि ‘स्वामी’ यहाँ मानवीय स्वामित्व का अनचाहा भाव दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दया उंडेल दी’ मूल के ठोस रूपक को सुरक्षित रखता है, जबकि ‘धीरज रखा’ अप्रचलित या अत्यधिक संस्कृतनिष्ठ अभिव्यक्ति से बचता है।
