  yaml_path: translation/deuterocanon/sirach/018/010.yaml
  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
translation:
  language: hi
  text: जैसे समुद्र से पानी की एक बूँद और रेत का एक कण[a], वैसे ही अनन्तकाल के एक दिन में कुछ वर्ष हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रेत की एक छोटी कंकड़ी’; यूनानी शब्द का अर्थ प्रायः ‘कंकड़ी’ होता है, पर ‘रेत’ के साथ यहाँ एक कण अभिप्रेत जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘युग के दिन में।’ यह संक्षिप्त यूनानी पदबंध कुछ वर्षों की तुलना अत्यन्त विशाल काल से करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  choice: समुद्र में से पानी की एक बूँद
  rationale: यह पदबंध समुद्र की विशालता के सामने एक अकेली बूँद की नगण्यता दिखाता है। ‘में से’ यूनानी ἀπό के स्रोत/अलगाव के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψῆφος ἄμμου
  choice: रेत का एक कण
  rationale: ψῆφος सामान्यतः छोटी कंकड़ी भी हो सकता है, पर ἄμμου के साथ यहाँ रेत के एक अकेले कण का चित्र सबसे स्वाभाविक है। पाठ की वास्तविक शब्दार्थ-संभावना पादटिप्पणी में रखी गई है।
- source_word: ὀλίγα ἔτη
  choice: मनुष्य के कुछ वर्ष
  rationale: ‘कुछ वर्ष’ मूल की संक्षिप्तता बनाए रखता है। प्रसंग में ये मानव जीवन के वर्ष हैं; हिन्दी में तुलना स्पष्ट और स्वाभाविक बनाने के लिए ‘मनुष्य के’ जोड़ा गया है।
- source_word: ἐν ἡμέρᾳ αἰῶνος
  choice: अनन्तकाल के एक दिन में
  rationale: यह रूपक के असामान्य एकवचन ‘दिन’ को बचाता है और αἰών के यहाँ अपरिमित काल वाले भाव को व्यक्त करता है। अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὕτως
  choice: वैसे ही
  rationale: ‘जैसे ... वैसे ही’ आधुनिक हिन्दी में तुलना की स्वाभाविक और स्पष्ट रचना है।
theological_decisions:
- issue: ἐν ἡμέρᾳ αἰῶνος में αἰών का अर्थ
  choice: अनन्तकाल
  alternative: युग
  rationale: समुद्र की बूँद और रेत के कण के समान मानव वर्षों की अल्पता का विरोध अपरिमित अवधि से है। ‘अनन्तकाल’ यह भाव स्पष्ट करता है, जबकि ‘युग’ अधिक सीमित अवधि भी समझा जा सकता है; फिर भी अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: ὀλίγα ἔτη के निहित संदर्भ को स्पष्ट करना
  choice: मनुष्य के कुछ वर्ष
  alternative: कुछ वर्ष
  rationale: ‘मनुष्य के’ मूल में स्पष्ट संज्ञा के रूप में नहीं है, पर इस ज्ञान-साहित्यिक तुलना में मानव जीवन निहित है। इसे जोड़ने से हिन्दी पाठ स्वतंत्र रूप से स्पष्ट होता है और कोई विशिष्ट सांप्रदायिक अर्थ आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘जैसे ... वैसे ही’ से यूनानी तुलना की संरचना बनी रहती है। ‘अनन्तकाल के एक दिन’ का असामान्य पर प्रभावशाली चित्र जानबूझकर सुरक्षित रखा गया है।
