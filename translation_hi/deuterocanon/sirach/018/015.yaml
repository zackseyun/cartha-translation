translation:
  language: hi
  text: हे मेरे बच्चे, भलाई करते समय उलाहना मत दो, और किसी भी भेंट के साथ दुःख पहुँचाने वाली बातें मत कहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον
  choice: हे मेरे बच्चे
  rationale: एकवचन संबोधन है। यह ज्ञान-साहित्य के आत्मीय, अभिभावकीय स्वर को बनाए रखता है और लिंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν ἀγαθοῖς
  choice: भलाई करते समय
  rationale: बहुवचन पदबंध का आशय भलाई या उपकार के अवसरों से है। शाब्दिक 'भली बातों में' की तुलना में यह हिन्दी में स्वाभाविक है और संदर्भगत व्यापकता बनाए रखता है।
- source_word: μὴ δῷς μῶμον
  choice: उलाहना मत दो
  rationale: δῷς का मूल अर्थ 'दो' है और μῶμον यहाँ निंदा, दोषारोपण या उलाहने का भाव रखता है। यह अनुवाद देने के साथ जुड़े कटु तिरस्कार को संक्षेप में व्यक्त करता है।
- source_word: ἐν πάσῃ δόσει
  choice: किसी भी दान के साथ
  rationale: δόσις देने की क्रिया या दी गई वस्तु दोनों हो सकता है। यहाँ 'दान' अगले वाक्यांश के साथ सहज है, जबकि 'किसी भी' πάσῃ की व्यापक वितरणात्मक शक्ति को व्यक्त करता है।
- source_word: λύπην λόγων
  choice: दुःख देनेवाली बातें
  rationale: यूनानी का संक्षिप्त संबंधकारक पदबंध शब्दों से उत्पन्न दुःख बताता है। हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है, बिना कटुता के किसी खास प्रकार को अनावश्यक रूप से निश्चित किए।
