  yaml_path: translation/deuterocanon/sirach/018/024.yaml
  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
translation:
  language: hi
  text: अंत के दिनों में प्रकोप[a] को स्मरण रखो, और मुख फेरने पर[b] प्रतिशोध के समय को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्रोध’। यूनानी शब्द सामान्य प्रबल क्रोध को भी सूचित कर सकता है; यहाँ संभवतः न्याय के समय का प्रकोप अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मुख के फेरने में’। यह संभवतः कृपा हटने की ओर संकेत करता है, शायद परमेश्वर की कृपा की ओर; पर यूनानी पाठ कर्ता को स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: स्मरण रखो
  rationale: यह आज्ञार्थक क्रिया का सीधा और गरिमापूर्ण अनुवाद है; प्रसंग में केवल याद आने के बजाय चेतावनी को मन में बनाए रखने का भाव देता है।
- source_word: θυμοῦ
  choice: प्रकोप
  rationale: θυμός प्रबल क्रोध या न्यायिक प्रकोप को सूचित कर सकता है। यहाँ प्रतिशोध और अंत के संदर्भ में ‘प्रकोप’ गंभीर न्याय का भाव व्यक्त करता है, फिर भी कर्ता को स्पष्ट रूप से परमेश्वर नहीं बताता।
- source_word: ἐν ἡμέραις τελευτῆς
  choice: अपने अंत के दिनों में
  rationale: τελευτή का अर्थ अंत अथवा मृत्यु हो सकता है। यह रूप यूनानी अभिव्यक्ति के निकट रहते हुए व्यक्ति के अंतिम दिनों का स्वाभाविक बोध कराता है।
- source_word: καιρὸν
  choice: समय
  rationale: καιρός किसी समय, अवसर या नियत घड़ी को सूचित करता है। संबंधकारक ἐκδικήσεως के साथ ‘प्रतिशोध का समय’ स्वाभाविक और पर्याप्त रूप से निश्चित है।
- source_word: ἐκδικήσεως
  choice: प्रतिशोध
  rationale: ἐκδίκησις का अर्थ प्रतिशोध, दंडात्मक न्याय या न्याय दिलाया जाना हो सकता है। प्रकोप और अंत की चेतावनी के संदर्भ में ‘प्रतिशोध’ सबसे उपयुक्त है।
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: मुख फेर लिए जाने पर
  rationale: यह यूनानी के ‘मुख के फिरने/फेरे जाने में’ वाले चित्र को बनाए रखता है। कर्मवाच्य रूप कर्ता को अनिर्दिष्ट रखता है और परमेश्वर का नाम पाठ में नहीं जोड़ता।
theological_decisions:
- issue: क्या प्रकोप, प्रतिशोध और मुख फेरने वाले को मुख्य पाठ में स्पष्ट रूप से परमेश्वर कहा जाए
  choice: कर्ता को मुख्य पाठ में अनिर्दिष्ट रखा गया है
  alternative: इन सभी अभिव्यक्तियों को स्पष्ट रूप से परमेश्वर के न्याय और अनुग्रह हटा लेने से जोड़ना
  rationale: प्रसंग संभवतः ईश्वरीय न्याय की ओर संकेत करता है, पर यूनानी पाठ परमेश्वर को स्पष्ट कर्ता नहीं बनाता। इसलिए अनुवाद मूल की अंतर्निहितता और धार्मिक तनाव को बनाए रखता है।
- issue: ἐκδίκησις को प्रतिशोध मानना या न्याय/दोषमुक्ति
  choice: प्रतिशोध
  alternative: न्याय अथवा दोषमुक्ति
  rationale: θυμός और जीवन के अंत की चेतावनी के साथ इसका दंडात्मक अर्थ अधिक संभावित है, यद्यपि शब्द में न्याय दिलाने का व्यापक अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘स्मरण रखो’, ‘प्रकोप’ और ‘प्रतिशोध’ चेतावनी के गंभीर स्वर को बनाए रखते हैं; ‘मुख फेर लिए जाने पर’ मूल बिंब और अनिर्दिष्ट कर्ता दोनों को सुरक्षित रखता है।
