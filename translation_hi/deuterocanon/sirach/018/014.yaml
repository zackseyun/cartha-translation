  yaml_path: translation/deuterocanon/sirach/018/014.yaml
  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: hi
  text: वह उन पर दया करता है जो अनुशासन[a] स्वीकार करते हैं, और उन पर भी जो उसके निर्णयों[b] की ओर उत्सुकता से बढ़ते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिक्षा।” यूनानी शब्द का अर्थ शिक्षा, प्रशिक्षण या सुधारात्मक अनुशासन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय-विधानों।” यूनानी शब्द निर्णयों, न्यायादेशों या विधानों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: दया करता है
  rationale: यह यूनानी क्रिया दया या करुणा दिखाने को व्यक्त करती है। ‘दया करता है’ सहज हिन्दी है और धार्मिक-नैतिक अर्थ को बनाए रखती है।
- source_word: τοὺς ἐκδεχομένους
  choice: जो ... स्वीकार करते हैं
  rationale: ἐκδέχομαι का अर्थ प्रतीक्षा करना या ग्रहण करना भी हो सकता है, पर παιδείαν के साथ यहाँ शिक्षा-सुधार को खुले मन से स्वीकार करने का भाव अधिक उपयुक्त है।
- source_word: παιδείαν
  choice: अनुशासन
  rationale: παιδεία शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—इन सबका बोध करा सकता है। ‘अनुशासन’ यहाँ उसके निर्माणकारी और सुधारात्मक बल को सुरक्षित रखता है।
- source_word: κατασπεύδοντας
  choice: उत्सुकता से बढ़ते हैं
  rationale: इस संयुक्त क्रिया में शीघ्रता के साथ तत्परता का भाव है। यह हिन्दी प्रयोग उस सक्रिय और उत्साही अग्रसरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: उसके निर्णयों की ओर
  rationale: ἐπί के साथ कर्मकारक दिशा का बोध कराता है, इसलिए ‘की ओर’ उपयुक्त है। κρίματα न्यायिक निर्णयों या प्रामाणिक विधानों को सूचित कर सकता है; ‘निर्णयों’ से मूल की व्यापकता बनी रहती है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में παιδεία का अर्थ
  choice: अनुशासन
  alternative: शिक्षा; प्रशिक्षण; सुधार
  rationale: यह चयन परमेश्वर से मिलने वाले निर्माणकारी सुधार को ग्रहण करने का भाव रखता है, फिर भी पादटिप्पणी में व्यापक शैक्षिक अर्थ को खुला रखा गया है।
- issue: κρίματα αὐτοῦ का आशय
  choice: उसके निर्णयों
  alternative: उसके न्याय-विधानों; उसके अध्यादेशों
  rationale: यूनानी पद न्यायिक निर्णय और अधिकारपूर्ण विधान दोनों का संकेत दे सकता है। ‘निर्णयों’ से इसे केवल कानूनी नियमों तक सीमित किए बिना मूल की अर्थगत व्यापकता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्यरचना ‘उन पर ... और उन पर भी’ से यूनानी संरचना स्पष्ट होती है; ‘उत्सुकता से बढ़ते हैं’ मूल क्रिया की शीघ्रता और तत्परता दोनों को व्यक्त करता है।
