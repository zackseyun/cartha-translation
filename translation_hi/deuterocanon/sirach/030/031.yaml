    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: अपने सब कामों में
  rationale: यह पदबंध व्यक्ति के सभी कार्यों और आचरण को समेटता है। ‘कामों’ आधुनिक हिन्दी में स्वाभाविक है और ἔργοις के अर्थ को स्पष्ट रखता है।
- source_word: γίνου
  choice: बनो
  rationale: γίνομαι का वर्तमान आज्ञार्थक रूप यहाँ निरंतर आचरण के लिए उपदेश देता है। ‘बनो’ मूल क्रिया के ‘होना/बनना’ भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπεράγων
  choice: उत्कृष्ट
  rationale: यह शब्द दूसरों से आगे बढ़ने या श्रेष्ठता दिखाने का भाव रखता है। ‘उत्कृष्ट’ नैतिक प्रोत्साहन को गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: μὴ δῷς μῶμον
  choice: कलंक न लगाओ
  rationale: शाब्दिक चित्र ‘दोष/कलंक देना’ है; हिन्दी मुहावरे में ‘कलंक लगाना’ उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν τῇ δόξῃ σου
  choice: अपने सम्मान पर
  rationale: इस ज्ञान-साहित्यिक संदर्भ में δόξα व्यक्ति के सम्मान, यश या प्रतिष्ठा का बोध कराता है। ‘सम्मान’ अनावश्यक धार्मिक अर्थ जोड़े बिना सामाजिक आदर को व्यक्त करता है।
