  yaml_path: translation/deuterocanon/sirach/030/028.yaml
  text: Years of a glad heart are better than delicacies[b][a], and his food will agree with him.
translation:
  language: hi
  text: प्रसन्न मन वाले के वर्ष स्वादिष्ट व्यंजनों से उत्तम हैं[b][a], और उसका भोजन उसे रास आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “अच्छे मन के वर्ष स्वादिष्ट व्यंजनों के स्थान पर, और उसका भोजन उस पर चढ़ेगा।” दूसरी पंक्ति का भाव यह है कि प्रसन्न व्यक्ति का भोजन उसे अनुकूल पड़ता या अच्छी तरह पचता है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में इस पद पर एक भिन्न कहावत है: अपने जीवनकाल में पुत्र, पत्नी, भाई या मित्र को अपने ऊपर अधिकार न दो, और अपनी संपत्ति किसी दूसरे को न दो। इसलिए यहाँ इब्रानी साक्ष्य एक अत्यंत भिन्न पाठ-परंपरा को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: के वर्ष
  rationale: बहुवचन समासरूप को बनाए रखकर समय तक बनी रहने वाली अवस्था का चित्र सुरक्षित रखा गया है।
- source_word: לב טוב
  choice: प्रसन्न मन
  rationale: ज्ञान-साहित्य के संदर्भ में इसका आशय केवल नैतिक रूप से ‘अच्छा’ होना नहीं, बल्कि भीतरी प्रसन्नता और कुशलता भी है।
- source_word: תחת
  choice: से उत्तम
  rationale: शाब्दिक अर्थ ‘के स्थान पर’ है, पर यहाँ दो स्थितियों की वरीयता का भाव है; हिन्दी में ‘से उत्तम’ उस निहित तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מטעמים
  choice: स्वादिष्ट व्यंजन
  rationale: यह शब्द विशेष रूप से स्वादिष्ट या बढ़िया भोजन को दर्शाता है; यह चयन आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: ומאכלו
  choice: और उसका भोजन
  rationale: पुल्लिंग एकवचन प्रत्यय को सुरक्षित रखा गया है। इसका संदर्भ प्रसन्न मन वाले व्यक्ति से है, यद्यपि हिन्दी में सर्वनाम का संबंध कुछ हद तक अस्पष्ट रह सकता है।
- source_word: יעלה עליו
  choice: उसे रास आएगा
  rationale: शाब्दिक रूप ‘उस पर चढ़ेगा’ है, पर प्रसंग में भोजन के अनुकूल पड़ने, पचने या लाभकारी होने का मुहावरेदार भाव है; ‘रास आएगा’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
