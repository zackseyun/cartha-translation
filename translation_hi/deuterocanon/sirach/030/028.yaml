translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली अपनाई गई है। ‘प्रसन्न मन’ भावात्मक अर्थ को, और ‘रास आएगा’ भोजन के अनुकूल या सुपाच्य होने के मुहावरे को व्यक्त करता है। मुख्य पाठ में पादटिप्पणी-चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में सुरक्षित हैं।
