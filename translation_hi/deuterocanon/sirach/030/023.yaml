  yaml_path: translation/deuterocanon/sirach/030/023.yaml
  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: hi
  text: अपने प्राण को शोक के हवाले न करो[a][b], और अपने अधर्म में ठोकर न खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू לדין कठिन है। यूनानी समानांतर पाठ ‘शोक’ या ‘दुःख’ के अर्थ का समर्थन करता है; केवल हिब्रू व्यंजनों को अधिक शाब्दिक रूप से पढ़ने पर ‘न्याय’ का अर्थ भी सुझाया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी साक्षी यहाँ काफी विस्तृत है: ‘अपने प्राण से प्रेम करो और अपने हृदय को सांत्वना दो; शोक को अपने से बहुत दूर कर दो, क्योंकि शोक ने बहुतों को मार डाला है और उसमें कोई लाभ नहीं।’ उपलब्ध हिब्रू पाठ इससे छोटा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: हवाले न करो
  rationale: נתן का यह प्रयोग किसी के अधीन कर देने या सौंप देने का भाव रखता है। ‘हवाले न करो’ चेतावनी की शक्ति बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לדין
  choice: शोक के
  rationale: हिब्रू शब्द यहाँ कठिन है। यूनानी समानांतर में λύπη बार-बार ‘शोक/दुःख’ के अर्थ में आया है, इसलिए कानूनी ‘न्याय’ की अपेक्षा ‘शोक’ अधिक संभावित है।
- source_word: נפשך
  choice: अपने प्राण को
  rationale: נפש का अर्थ प्राण, जीवन या स्वयं हो सकता है। ‘प्राण’ हिब्रू मानव-विषयक पद की गहराई को बनाए रखता है और यहाँ पूरे आंतरिक जीवन को सूचित करता है।
- source_word: ואל תכשל
  choice: और ... ठोकर न खाओ
  rationale: כשל का मूल बिंब लड़खड़ाने या ठोकर खाने का है; हिन्दी में यह नैतिक विफलता के लिए भी सहज रूपक है।
- source_word: בעונך
  choice: अपने अधर्म में
  rationale: עון में अधर्म, दोष और उसके परिणाम—तीनों अर्थ-छायाएँ हो सकती हैं। ‘अधर्म में’ हिब्रू पूर्वसर्ग और नैतिक गंभीरता को बनाए रखता है, बिना कारण या परिणाम को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: काहिरा गनीज़ा के संक्षिप्त हिब्रू पाठ और अधिक विस्तृत यूनानी पाठ में चयन
  choice: मुख्य पाठ में उपलब्ध संक्षिप्त हिब्रू पंक्ति का अनुवाद किया गया है; केवल कठिन לדין को समझने में यूनानी पाठ का सहारा लिया गया है।
  alternative: 'यूनानी के अनुसार विस्तृत पाठ दिया जा सकता है: ‘अपने प्राण से प्रेम करो और अपने हृदय को सांत्वना दो; शोक को अपने से बहुत दूर कर दो, क्योंकि शोक ने बहुतों को मार डाला है और उसमें कोई लाभ नहीं।’'
  rationale: जहाँ हिब्रू पाठ उपलब्ध है, वही प्राथमिक स्रोत है। यूनानी साक्षी कठिन हिब्रू पद के अर्थ की पुष्टि करता है, पर उसकी अतिरिक्त सामग्री को हिब्रू मुख्य पाठ में मिलाना पाठांतर को छिपा देगा।
- issue: לדין का अर्थ
  choice: शोक
  alternative: न्याय
  rationale: हिब्रू व्यंजन-पाठ से ‘न्याय’ जैसा अर्थ संभव दिखाई दे सकता है, पर वाक्य का उपदेशात्मक संदर्भ और यूनानी λύπη स्पष्ट रूप से ‘शोक’ का समर्थन करते हैं। कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्राण’ स्रोत के נפש को बनाए रखता है, जबकि ‘हवाले न करो’ आज की हिन्दी में समर्पण या वश में कर देने का स्वाभाविक भाव देता है।
