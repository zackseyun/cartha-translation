translation:
  language: hi
  text: स्वस्थ शरीर[a] से बढ़कर कोई धन नहीं, और प्रसन्न हृदय[b] से बढ़कर कोई भलाई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद संक्षिप्त और मुहावरेदार है; यूनानी समानांतर में ‘शरीर का स्वास्थ्य’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘हृदय की भलाई’ है; यूनानी समानांतर में ‘हृदय का आनन्द’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין עֹשֶׁר עַל עֹשֶׁר
  choice: से बढ़कर कोई धन नहीं
  rationale: אֵין ... עַל की तुलनात्मक संरचना किसी वस्तु से बढ़कर दूसरी वस्तु न होने का भाव व्यक्त करती है। यह हिन्दी प्रयोग उस तुलना को स्वाभाविक ढंग से रखता है।
- source_word: שַׂר עֶצֶם
  choice: स्वस्थ शरीर
  rationale: इब्रानी पद संक्षिप्त और मुहावरेदार है। यूनानी समानांतर ὑγείας σώματος (‘शरीर का स्वास्थ्य’) से स्पष्ट होता है कि आशय शारीरिक स्वस्थता है।
- source_word: אֵין טוֹבָה עַל
  choice: से बढ़कर कोई भलाई नहीं
  rationale: दूसरी पंक्ति पहली पंक्ति की तुलनात्मक बनावट दोहराती है। ‘भलाई’ से טוֹבָה का संज्ञात्मक रूप बना रहता है।
- source_word: טוּב לֵבָב
  choice: प्रसन्न हृदय
  rationale: शाब्दिक अर्थ ‘हृदय की भलाई’ है, पर प्रसंग में यह भीतरी प्रसन्नता या कुशलता बताता है; यूनानी χαρὰν καρδίας (‘हृदय का आनन्द’) भी इसी भाव का समर्थन करता है।
