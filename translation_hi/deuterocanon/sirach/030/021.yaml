base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/021.yaml
  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: hi
  text: वह अपनी आँखों से देखता और आहें भरता है[a], जैसे कोई नपुंसक किसी युवती को गले लगाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “अपने प्राण को शोक के वश में न कर, और अपनी ही सोच-विचार से अपने को दुःख न दे।” इब्रानी पाठ असफल लालसा का सजीव चित्र प्रस्तुत करता है, जबकि यूनानी इसे अपने ऊपर लाए गए शोक के विरुद्ध सीधे उपदेश के रूप में कहता है। स्वरचिह्न-रहित इब्रानी ראה को आज्ञा (“देख”) या कथन (“वह देखता है”) माना जा सकता है; “उसकी आँखों से” के कारण यहाँ कथनात्मक अर्थ लिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: वह अपनी आँखों से देखता है
  rationale: स्वरचिह्न-रहित ראה को आज्ञार्थक या तृतीय पुरुष कथन—दोनों रूपों में समझा जा सकता है; पर בעיניו का शाब्दिक अर्थ ‘उसकी आँखों से’ है। इसलिए मुख्य पाठ में स्वाभाविक तृतीय पुरुष कथन रखा गया है और यूनानी पाठ का निषेधात्मक रूप पादटिप्पणी में दिया गया है।
- source_word: ומתאנח
  choice: और आहें भरता है
  rationale: यह क्रिया पीड़ा और व्यथा से निकलने वाली साँस या कराह को व्यक्त करती है। ‘आहें भरता है’ आधुनिक हिन्दी में स्वाभाविक है और असफल लालसा का भाव बनाए रखता है।
- source_word: כאשר
  choice: जैसे
  rationale: यह उपमा का संकेत देता है; हिन्दी में ‘जैसे’ सहज और स्पष्ट है।
- source_word: סריס
  choice: नपुंसक
  rationale: यहाँ राजकीय पद नहीं, बल्कि उस शारीरिक असमर्थता की ओर संकेत है जिस पर उपमा निर्भर है। ‘नपुंसक’ मूल चित्र को अपेक्षाकृत स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: יחבק
  choice: गले लगाता है
  rationale: क्रिया का अर्थ बाँहों में लेना या आलिंगन करना है। ‘गले लगाता है’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נערה
  choice: युवती
  rationale: यह किसी युवा स्त्री को सूचित करता है। ‘युवती’ न तो बालिका का आभास देता है, न पुरातन शैली का।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-रूपों का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी के तृतीय पुरुष वर्णन और सजीव उपमा को रखा गया है।
  alternative: 'यूनानी के अनुसार सीधे निषेधात्मक उपदेश के रूप में अनुवाद करना: ‘अपने प्राण को शोक के वश में न कर, और अपनी ही सोच-विचार से अपने को दुःख न दे।’'
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है। स्वरचिह्न-रहित ראה में व्याकरणिक अस्पष्टता है, किंतु בעיניו तृतीय पुरुष की ओर संकेत करता है। यूनानी में पाठ काफी भिन्न है और इब्रानी की उपमा अनुपस्थित है; इसलिए दोनों को मिलाकर एक नया वाक्य बनाने के बजाय वैकल्पिक यूनानी रूप पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल इब्रानी की असहज तथा तीखी उपमा को नरम करके हटाया नहीं गया। ‘नपुंसक’ का प्रयोग यहाँ उपमा में निहित शारीरिक असमर्थता को व्यक्त करने के लिए है, किसी राजकीय अधिकारी के अर्थ में नहीं।
