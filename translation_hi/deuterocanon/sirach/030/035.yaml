  yaml_path: translation/deuterocanon/sirach/030/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: hi
  text: जुआ और चमड़े का पट्टा गर्दन को झुका देंगे; और दुष्ट दास[a] के लिए मरोड़ने के यंत्र और यातनाएँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अनुवाद “सेवक” या “घरेलू सेवक” भी हो सकता है। यहाँ दंड और बलपूर्वक अधीनता के प्रसंग के कारण “दास” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγὸς
  choice: जुआ
  rationale: गर्दन झुकाने के प्रसंग में इसका अर्थ पशु पर रखा जाने वाला जुआ है, न कि तराजू की डंडी।
- source_word: ἱμὰς
  choice: चमड़े का पट्टा
  rationale: यह चमड़े के पट्टे या बंधन को दर्शाता है; स्पष्टता के लिए पदार्थ को व्यक्त किया गया है।
- source_word: κάμψουσιν
  choice: झुका देंगे
  rationale: भविष्यकालीन क्रिया के भौतिक और बलपूर्वक झुकाने वाले बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τράχηλον
  choice: गर्दन
  rationale: नीतिवचन-सदृश सामान्य कथन में हिन्दी में बिना अनिश्चित सूचक के यह स्वाभाविक है।
- source_word: οἰκέτῃ
  choice: दास
  rationale: शब्द घरेलू सेवक को भी सूचित कर सकता है, पर इस दंडात्मक और बाध्यकारी प्रसंग में 'दास' उसकी पराधीन सामाजिक स्थिति को अधिक स्पष्ट रखता है।
- source_word: κακούργῳ
  choice: दुष्ट
  rationale: यह नैतिक विशेषण है; 'अपराधी' कहना अर्थ को केवल कानूनी दर्जे तक सीमित कर सकता है।
- source_word: στρέβλαι
  choice: मरोड़ने के यंत्र
  rationale: शब्द मरोड़कर यातना देने वाले उपकरणों को दर्शाता है; यह अनिश्चित ऐतिहासिक उपकरण को किसी एक विशिष्ट रूप तक सीमित नहीं करता।
- source_word: βάσανοι
  choice: यातनाएँ
  rationale: मूल शब्द की कठोर शारीरिक पीड़ा और दंड की तीव्रता को बनाए रखता है।
theological_decisions:
- issue: पराधीन व्यक्ति के लिए प्रयुक्त οἰκέτης का अनुवाद
  choice: दास
  alternative: सेवक / घरेलू सेवक
  rationale: प्रसंग में जुआ, बंधन और यातना जैसे बाध्यकारी बिंब हैं; इसलिए 'दास' सामाजिक पराधीनता को नरम किए बिना व्यक्त करता है, जबकि पादटिप्पणी शब्द की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। अर्धविराम पद के दो समानांतर दंडात्मक कथनों को जोड़ता है।
