base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
translation:
  language: hi
  text: उसकी जवानी में उसका सिर झुका दे, और जब वह छोटा ही हो, उसकी कमर तोड़ दे[a]। कहीं ऐसा न हो कि वह कठोर हो जाए[b] और तुम्हारे विरुद्ध विद्रोह करे, और उससे तुम्हारे मन को संताप हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसकी कमर चीर/तोड़ दे’ है; यूनानी समानांतर में ‘उसकी बगलें/पसलियाँ कुचल दे’ मिलता है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: इस स्थान का इब्रानी पाठ कठिन है। यूनानी समानांतर अधिक स्पष्ट रूप से कहता है, ‘कहीं ऐसा न हो कि वह कठोर हो जाए।’
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: उसका सिर झुका दे
  rationale: इब्रानी में शब्दशः ‘उसका सिर’ है और क्रिया अधीन करने या झुकाने का बिंब रखती है। यह अनुवाद उस ठोस बिंब को बनाए रखता है, उसे केवल ‘अनुशासन दे’ में नहीं बदलता।
- source_word: בנערותו
  choice: उसकी जवानी में
  rationale: यह काल-सूचक पद बालक को आरंभिक आयु में अनुशासित करने की बात करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ובקע מתניו
  choice: उसकी कमर तोड़ दे
  rationale: בקע में चीरने या तोड़ने और מתנים में कमर/कटि का अर्थ है। हिन्दी में ‘कमर तोड़ दे’ कठोर शारीरिक बिंब को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: כשהוא קטן
  choice: जब वह छोटा ही हो
  rationale: यह उसकी छोटी आयु पर बल देता है; ‘ही’ मूल के समयगत जोर को सहज हिन्दी में व्यक्त करता है।
- source_word: למה ישקה
  choice: कहीं ऐसा न हो कि वह कठोर हो जाए
  rationale: उपलब्ध इब्रानी पाठ कठिन और अनिश्चित है। यूनानी समानांतर में ‘कठोर हो जाए’ स्पष्ट है, इसलिए मुख्य पाठ में यही संभावित अर्थ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: ומרה בך
  choice: और तेरे विरुद्ध विद्रोह करे
  rationale: इब्रानी में विरोध या विद्रोह का भाव स्पष्ट है; इसे छोड़ने के बजाय सीधे अनूदित किया गया है।
- source_word: ונולד ממנו מפח נפש
  choice: और उससे मन का संताप उत्पन्न हो
  rationale: वाक्यांश गहरे आंतरिक दुःख या निराशा को व्यक्त करता है। ‘मन का संताप’ भावनात्मक भार बनाए रखता है, जबकि ‘उससे’ मूल की संबंधगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: ज्ञान-साहित्य में कठोर शारीरिक दंड का बिंब
  choice: ‘सिर झुका दे’ और ‘कमर तोड़ दे’ जैसे ठोस और कठोर बिंब बनाए रखे गए हैं।
  alternative: इसे नरम करके ‘उसे कड़ा अनुशासन दे’ कहना।
  rationale: इब्रानी और यूनानी दोनों साक्ष्य कठोर शारीरिक भाषा रखते हैं। आधुनिक नैतिक असुविधा के कारण मूल की तीव्रता छिपाना उचित नहीं; साथ ही अनुवाद इस उक्ति की व्याख्या या समर्थन जोड़े बिना उसे प्रस्तुत करता है।
- issue: कठिन इब्रानी पद למה ישקה का अर्थ
  choice: यूनानी समानांतर के आधार पर ‘कठोर हो जाए’ रखा गया है और पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
  alternative: अनिश्चित इब्रानी को अनुमानपूर्वक किसी अन्य अर्थ, जैसे ‘वह पिलाए’, में शब्दशः प्रस्तुत करना।
  rationale: संरक्षित इब्रानी पाठ यहाँ कठिन है, जबकि यूनानी संभवतः अंतर्निहित इब्रानी का अधिक स्पष्ट अर्थ सुरक्षित रखता है। पादटिप्पणी वास्तविक अनिश्चितता को छिपने नहीं देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। आज्ञार्थक एकवचन ‘दे/करे’ मूल के प्रत्यक्ष उपदेशात्मक स्वर को बनाए रखता है। ‘कमर तोड़ दे’ की कठोरता जानबूझकर नरम नहीं की गई, और पाठगत भेद पादटिप्पणियों में दिए गए हैं।
