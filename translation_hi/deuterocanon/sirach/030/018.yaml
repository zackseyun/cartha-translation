  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
translation:
  language: hi
  text: बंद मुँह के आगे उँडेला हुआ स्वादिष्ट भोजन वैसा ही है जैसा किसी मूर्ति[a][b] के सामने रखी भेंट।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גלול मूर्ति के लिए तिरस्कारसूचक शब्द है; इसका अर्थ ‘घृणित मूर्ति’ या अधिक शाब्दिक रूप में ‘गोबर-मूर्ति’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर में इब्रानी के ‘मूर्ति के सामने रखी गई भेंट’ के स्थान पर ‘कब्र के पास रखे भोजन के भाग’ हैं। दूसरा तुलनात्मक बिंब अलग है, पर निरर्थकता का मूल भाव वही रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: स्वादिष्ट भोजन
  rationale: संदर्भ और यूनानी समानांतर में भोजन का स्पष्ट बिंब है; इसलिए इसे अमूर्त ‘भलाई’ के बजाय खाने की अच्छी वस्तु के रूप में व्यक्त किया गया है।
- source_word: שפוכה
  choice: उँडेला गया
  rationale: שפך के निष्क्रिय कृदंत का मूल बिंब ‘उँडेला हुआ’ है; यह इब्रानी की सजीवता बनाए रखता है।
- source_word: על פה סתום
  choice: बंद मुँह के आगे
  rationale: यह स्वाभाविक हिन्दी में उस मुँह के सामने भोजन रखने का निरर्थक दृश्य व्यक्त करता है जो उसे खा नहीं सकता या नहीं खाता।
- source_word: תנופה
  choice: भेंट
  rationale: शब्द का तकनीकी अर्थ ‘हिलाई जानेवाली भेंट’ हो सकता है, पर यहाँ ज्ञानोक्ति का केंद्र किसी ऐसी सत्ता के सामने अर्पण रखने की निरर्थकता है जो उसे ग्रहण नहीं कर सकती; सामान्य ‘भेंट’ इस आशय को स्पष्ट रखता है।
- source_word: מצגת
  choice: रखी गई
  rationale: यह किसी वस्तु को सामने प्रस्तुत या स्थापित किए जाने के कृदंत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לפני גלול
  choice: किसी मूर्ति के सामने
  rationale: גלול मूर्तियों के लिए प्रयुक्त तिरस्कारसूचक शब्द है। मुख्य पाठ में ‘मूर्ति’ स्पष्ट और स्वाभाविक है; उसकी अपमानसूचक छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ज्ञानोक्ति की तुलना में पंथ-संबंधी शब्द תנופה
  choice: सामान्य रूप से ‘भेंट’
  alternative: ‘हिलाई जानेवाली भेंट’ अथवा ‘अर्पण की भेंट’
  rationale: तकनीकी अनुष्ठानिक पद तुलना को अनावश्यक रूप से संकीर्ण कर सकता है। ‘भेंट’ पंथ-संबंधी पृष्ठभूमि रखते हुए निरर्थक अर्पण के केंद्रीय बिंब को सामने लाता है।
- issue: मूर्ति के लिए तिरस्कारसूचक शब्द גלול
  choice: मुख्य पाठ में ‘मूर्ति’
  alternative: ‘घृणित मूर्ति’ अथवा शाब्दिक तिरस्कार के साथ ‘गोबर-मूर्ति’
  rationale: ‘मूर्ति’ अभिप्रेत वस्तु को साफ ढंग से बताता है, जबकि मूल शब्द की तिरस्कारसूचक शक्ति पाठकीय पारदर्शिता के लिए पादटिप्पणी में सुरक्षित है।
- issue: इब्रानी और यूनानी के दूसरे तुलना-बिंब में अंतर
  choice: मुख्य पाठ में प्रमाणित इब्रानी पाठ ‘मूर्ति के सामने ... भेंट’
  alternative: 'यूनानी समानांतर: ‘कब्र के पास रखे भोजन के भाग’'
  rationale: दिए गए इब्रानी स्रोत को प्राथमिकता दी गई है; यूनानी पाठ का उल्लेख पादटिप्पणी में किया गया है क्योंकि वह निरर्थकता का वही मूल भाव रखते हुए अलग चित्र प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, संक्षिप्त और ज्ञानोक्तिपरक रखी गई है। ‘उँडेला गया’ मूल इब्रानी बिंब को बचाता है, जबकि ‘स्वादिष्ट भोजन’ संदर्भगत ठोस अर्थ स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
