lexical_decisions:
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: अपने जीवनकाल में
  rationale: यह यूनानी काल-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप है और जीवन के दौरान होने का अर्थ बनाए रखता है।
- source_word: εἶδεν
  choice: उसने देखा
  rationale: मूल पाठ में क्रिया का कर्म व्यक्त नहीं है; इसलिए प्रसंग से कोई वस्तु जोड़ने के बजाय उसकी व्यापकता सुरक्षित रखी गई है।
- source_word: εὐφράνθη
  choice: आनन्दित हुआ
  rationale: यह क्रिया की प्रबल प्रसन्नता को गरिमापूर्ण और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ τελευταῖ αὐτοῦ
  choice: अपने अन्त समय में
  rationale: यह कुछ असामान्य यूनानी पदबंध को जीवन की समाप्ति के समय के रूप में स्वाभाविक ढंग से व्यक्त करता है, बिना 'अन्तिम दिनों' जैसी अधिक विशिष्ट व्याख्या थोपे।
- source_word: οὐκ ἐλυπήθη
  choice: वह दुःखी नहीं हुआ
  rationale: यह भावात्मक अर्थ और यूनानी निषेध दोनों को सीधे व्यक्त करता है; हिन्दी में यह रूप स्वाभाविक है और दुःख का कारण नहीं जोड़ता।
