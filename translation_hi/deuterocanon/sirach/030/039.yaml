base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a servant, let him be like yourself, because you acquired him with blood; if you have a servant, lead him as yourself, because you need him as your own life.
translation:
  language: hi
  text: यदि तुम्हारे पास कोई दास[a] हो, तो वह तुम्हारे समान रहे, क्योंकि तुमने उसे रक्त के द्वारा प्राप्त किया है[b]। यदि तुम्हारे पास कोई दास हो, तो उसे अपने समान मानकर चलो, क्योंकि तुम्हें उसकी उतनी ही आवश्यकता है जितनी अपने प्राणों की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ घर में सेवा करने वाला दास है।
    reason: ‘दास’ की ऐतिहासिक-सामाजिक विशिष्टता स्पष्ट करना।
  - marker: b
    text: 'शाब्दिक रूप से: “रक्त में।” इस अभिव्यक्ति का सटीक आशय अनिश्चित है; यह संभवतः चुकाई गई भारी कीमत की ओर संकेत करती है।'
    reason: मूल यूनानी की असामान्य और वास्तविक अस्पष्टता को पाठक के सामने रखना।
lexical_decisions:
- source_word: οἰκέτης
  choice: दास
  rationale: यह शब्द घर में सेवा करने वाले ऐसे व्यक्ति को सूचित करता है जो स्वामी के अधिकार में था; केवल ‘सेवक’ कहने से उस सामाजिक स्थिति की कठोरता दब सकती है।
- source_word: ἐν αἵματι
  choice: रक्त के द्वारा
  rationale: यूनानी पद का असामान्य और संभावित रूप से बहुअर्थी चित्र यथासंभव सुरक्षित रखा गया है; इसे बिना प्रमाण केवल ‘कीमत देकर’ नहीं बनाया गया।
- source_word: ἄγε
  choice: मानकर चलो
  rationale: ἄγω के मूल ‘ले चलना/संचालित करना’ भाव को स्वाभाविक हिन्दी मुहावरे में रखा गया है; संदर्भ में यह उसके साथ अपने समान ढंग से पेश आने का निर्देश देता है।
- source_word: ἐπιδέησις
  choice: आवश्यकता पड़ेगी
  rationale: क्रिया के भविष्यकालीन अर्थ ‘तुम्हें जरूरत होगी’ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ψυχή
  choice: प्राण
  rationale: यहाँ ψυχή व्यक्ति के जीवन/प्राण का बोध कराता है; ‘प्राण’ तुलना की तीव्रता और मूल रूपक दोनों बनाए रखता है।
theological_decisions:
- issue: दासता-संबंधी ऐतिहासिक भाषा
  choice: मूल पाठ की सामाजिक वास्तविकता को ‘दास’ द्वारा स्पष्ट रखना
  alternative: ‘सेवक’ कहकर भाषा को नरम करना
  rationale: अनुवाद पाठ में उपस्थित दासता को न तो अनुमोदन के रूप में बढ़ाता है, न आधुनिक शब्दावली से छिपाता है।
- issue: ‘रक्त के द्वारा प्राप्त किया’ का अर्थ
  choice: मुख्य पाठ में मूल की अस्पष्ट अभिव्यक्ति बनाए रखना
  alternative: इसे निर्णायक रूप से ‘बहुत बड़ी कीमत देकर खरीदा’ या ‘अपने रक्त से पाया’ कहना
  rationale: ἐν αἵματι का आशय संदर्भ में कठिन है; किसी एक धार्मिक या व्याख्यात्मक अर्थ को पाठ पर थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने समान मानकर चलो’ आज की स्वाभाविक हिन्दी में संबंध और व्यवहार दोनों को व्यक्त करता है, जबकि मूल क्रिया का गतिशील भाव पूरी तरह मिटाता नहीं।
