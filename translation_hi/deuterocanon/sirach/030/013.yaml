translation:
  language: hi
  text: अपने पुत्र को अनुशासन दे और उसका जुआ भारी कर,[a] कहीं ऐसा न हो कि वह अपनी मूर्खता में तुझे निगल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “अपने पुत्र को अनुशासन दे और उस पर परिश्रम कर, कहीं ऐसा न हो कि वह तेरी लज्जा के कारण ठोकर खाए।” इब्रानी पाठ में है: “कहीं ऐसा न हो कि वह अपनी मूर्खता में तुझे निगल जाए।”'
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: अनुशासन दे
  rationale: यह क्रिया सुधारने, शिक्षा देने और संयम में रखने का भाव व्यक्त करती है। ‘अनुशासन दे’ आधुनिक हिन्दी में इसके सुधारात्मक और निर्माणात्मक दोनों पक्षों को बनाए रखता है।
- source_word: והכבד עולו
  choice: उसका जुआ भारी कर
  rationale: इब्रानी का शाब्दिक चित्र ‘उसका जुआ भारी कर’ है। यह पुत्र पर कड़ा अनुशासन और उत्तरदायित्व रखने का रूपक है; इसे सामान्य ‘बोझ डाल’ कहकर सपाट नहीं किया गया।
- source_word: באולתו
  choice: अपनी मूर्खता में
  rationale: אולת का अर्थ मूर्खता या मूढ़ता है। इब्रानी पूर्वसर्ग सहित यह पद परिस्थिति और कारण—दोनों की छाया रखता है, जिसे ‘अपनी मूर्खता में’ स्वाभाविक रूप से बनाए रखता है।
- source_word: יבלע בך
  choice: तुझे निगल जाए
  rationale: בלע का मूल चित्र ‘निगल जाना’ है। यहाँ यह माता-पिता को हानि या विनाश पहुँचाने का रूपक है; हिन्दी में भी यह सजीवता और कठोर चेतावनी को सुरक्षित रखता है।
theological_decisions:
- issue: भिन्न इब्रानी और यूनानी पाठों में आधार-पाठ का चुनाव
  choice: 'उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ का अनुसरण: ‘कहीं ऐसा न हो कि वह अपनी मूर्खता में तुझे निगल जाए।’'
  alternative: 'यूनानी समानांतर पाठ: ‘कहीं ऐसा न हो कि वह तेरी लज्जा के कारण ठोकर खाए।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और सत्यापित है, इसलिए उसे मुख्य पाठ बनाया गया है। अर्थ में उल्लेखनीय रूप से भिन्न यूनानी पाठ को छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। ‘पुत्र’, ‘जुआ’ और ‘निगल जाए’ मूल इब्रानी की ठोस रूपकात्मक भाषा को सुरक्षित रखते हैं; एकवचन ‘तू’ का रूप आदेश की निकट और सीधी शैली के अनुरूप है।
