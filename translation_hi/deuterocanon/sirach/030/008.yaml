  yaml_path: translation/deuterocanon/sirach/030/008.yaml
  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
translation:
  language: hi
  text: जिस घोड़े को साधा नहीं गया, वह अड़ियल हो जाता है[a]; और जिस बेटे को खुली छूट दी गई हो, वह मनमाना हो जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जिसे साधा नहीं गया’ का अनुवाद ‘अनियंत्रित’ भी हो सकता है (ἀδάμαστος)। चित्र ऐसे घोड़े का है जिसे प्रशिक्षण देकर वश में नहीं लाया गया।
    reason: lexical_alternative
  - marker: b
    text: अंतिम विशेषण προαλής दुर्लभ है; इसके संभावित अर्थों में ‘हठीला’, ‘स्वेच्छाचारी’ या ‘ढीठ’ शामिल हैं। यहाँ प्रसंग में अनियंत्रित ढंग से अपनी इच्छा चलाने का भाव व्यक्त करने के लिए ‘मनमाना’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: घोड़ा
  rationale: यह सामान्य और स्वाभाविक हिन्दी शब्द है; प्रसंग में किसी अधिक काव्यात्मक पद की आवश्यकता नहीं है।
- source_word: ἀδάμαστος
  choice: जिसे साधा नहीं गया
  rationale: घोड़े के संदर्भ में यह प्रशिक्षण और वश में लाए जाने के अभाव को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀποβαίνει
  choice: हो जाता है
  rationale: क्रिया यहाँ परिणामी अवस्था बताती है; यह चयन कहावत की स्वाभाविकता बनाए रखता है।
- source_word: σκληρός
  choice: अड़ियल
  rationale: यहाँ अर्थ शारीरिक कठोरता नहीं, बल्कि न मानने और नियंत्रण का प्रतिरोध करने वाला स्वभाव है।
- source_word: υἱός
  choice: बेटा
  rationale: यूनानी पाठ पुल्लिंग एकवचन में विशेष रूप से पुत्र का उल्लेख करता है, इसलिए इसे सामान्यीकृत करके ‘संतान’ नहीं किया गया।
- source_word: ἀνειμένος
  choice: जिसे खुली छूट दी गई हो
  rationale: यह छोड़े जाने या रोक-टोक न होने की अवस्था व्यक्त करता है और अभिभावकीय अनुशासन की कमी को बिना अनावश्यक विस्तार के सामने लाता है।
- source_word: ἐκβαίνει
  choice: हो जाता है
  rationale: पहले खंड की परिणामी क्रिया के समानांतर यही अभिव्यक्ति रखी गई है।
- source_word: προαλής
  choice: मनमाना
  rationale: यह दुर्लभ विशेषण अनियंत्रित, अपनी इच्छा से आगे बढ़ने वाले स्वभाव का संकेत देता है; ‘मनमाना’ सहज हिन्दी में उस भाव को व्यक्त करता है, पर इसकी शब्दार्थगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
