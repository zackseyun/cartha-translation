translation:
  language: hi
  text: उसकी युवावस्था में उसे खुली छूट न दो,[a] और उसके भ्रष्ट आचरण को अनदेखा न करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी युवावस्था में उसे अधिकार न दो।” इब्रानी क्रिया का अर्थ किसी को शासन या नियंत्रण देना हो सकता है; यूनानी पाठ में भी “अधिकार” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी भ्रष्टताओं”; इसका अर्थ उसके दोष, भ्रष्ट काम या विनाशकारी व्यवहार भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: उसे मनमानी न करने दो
  rationale: हिफ़इल रूप का मूल अर्थ किसी को शासन या अधिकार देना है। माता-पिता की शिक्षा के इस संदर्भ में यह स्वच्छंद अधिकार या खुली छूट न देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी ἐξουσίαν भी ‘अधिकार’ का समर्थन करता है।
- source_word: בנעוריו
  choice: उसकी जवानी में
  rationale: यह युवावस्था को सूचित करने वाला सीधा कालवाचक पद है।
- source_word: תשא
  choice: अनदेखी न करो
  rationale: נשא का मूल अर्थ उठाना या सहना है, पर दोषों के साथ प्रयुक्त होने पर उन्हें सह जाने, छोड़ देने या अनदेखा करने का अर्थ हो सकता है। यहाँ ‘क्षमा’ की अपेक्षा ‘अनदेखी’ अनुशासन के संदर्भ में अधिक उपयुक्त और कम धर्मवैज्ञानिक रूप से भारित है।
- source_word: לשחיתותיו
  choice: उसके बिगड़े कामों
  rationale: שחיתותיו भ्रष्टता, बिगाड़ या विनाशकारी आचरण का संकेत दे सकता है। ‘बिगड़े काम’ नैतिक दोष और हानिकारक व्यवहार दोनों को सहज हिन्दी में व्यक्त करता है, जबकि शब्द की सीमा को पाद-टिप्पणी में सुरक्षित रखा गया है।
