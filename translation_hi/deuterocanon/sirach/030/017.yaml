base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/017.yaml
  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: hi
  text: व्यर्थ जीवन से मृत्यु भली है,[a] और निरंतर पीड़ा से चिरस्थायी विश्राम।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में है, “कड़वे जीवन से मृत्यु भली है।” इब्रानी पाठ में “व्यर्थ जीवन” है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “लगातार बनी रहने वाली पीड़ा” है, जबकि यूनानी समानांतर में “लंबे समय तक रहने वाली बीमारी/व्याधि” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: मृत्यु भली है
  rationale: טוב ל־ यहाँ तुलनात्मक अर्थ देता है। यद्यपि למות व्याकरणतः ‘मरना’ है, इस नीतिवचन में ‘मृत्यु’ स्वाभाविक हिन्दी में उसी सामान्य कथन-शक्ति को बनाए रखती है।
- source_word: מחיי שוא
  choice: व्यर्थ जीवन से
  rationale: שוא में खोखलेपन, व्यर्थता और निष्फलता का भाव है। ‘व्यर्थ जीवन’ संक्षिप्त, स्वाभाविक और स्रोत के निकट है; यूनानी समानांतर के ‘कड़वे जीवन’ को पादटिप्पणी में रखा गया है।
- source_word: ונוחת עולם
  choice: और ... चिरस्थायी विश्राम
  rationale: נוחה/נוחת का अर्थ विश्राम है और עולם दीर्घकालिक अथवा अनंत अवधि सूचित करता है। ‘चिरस्थायी विश्राम’ अभिव्यक्ति का भार बनाए रखता है, पर उसके परलोक-संबंधी आशय को पाठ से आगे बढ़कर निश्चित नहीं करता।
- source_word: מכאב נאמן
  choice: निरंतर पीड़ा से
  rationale: כאב ‘पीड़ा’ है। נאמן का मूल भाव दृढ़ या स्थिर है और यहाँ ऐसी पीड़ा को बताता है जो बनी रहती है; आधुनिक हिन्दी में ‘निरंतर पीड़ा’ इस संदर्भगत अर्थ को स्पष्ट रूप से व्यक्त करती है।
theological_decisions:
- issue: पहली तुलना में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘व्यर्थ जीवन’
  alternative: यूनानी समानांतर के अनुसार ‘कड़वा जीवन’
  rationale: उपलब्ध इब्रानी पाठ यहाँ उच्च-विश्वसनीयता वाला प्राथमिक साक्ष्य है। यूनानी पाठ तुलनात्मक संरचना की पुष्टि करता है, पर उसकी भिन्न शब्दावली को पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
- issue: עולם की कालगत शक्ति
  choice: चिरस्थायी
  alternative: सदा का; अनंत
  rationale: यह चयन दीर्घ अथवा असीम अवधि का भाव रखता है, जबकि कथन को किसी विशिष्ट परलोक-सिद्धांत की निर्णायक घोषणा में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘भली है’ गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। दूसरी पंक्ति में इब्रानी की लुप्त तुलनात्मक क्रिया को हिन्दी में भी स्वाभाविक रूप से अध्याहृत रहने दिया गया है।
