  text: Give rest to your soul[a], and gladden your heart; and keep anger far from you.
translation:
  language: hi
  text: अपने प्राण को विश्राम दे[a], और अपने हृदय को प्रसन्न कर; और क्रोध को अपने से दूर रख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू पाठ कठिन है, और उपलब्ध यूनानी पाठ में इस पद के लिए बिल्कुल अलग कथन मिलता है। अनुवाद उपलब्ध हिब्रू साक्ष्य का अनुसरण करता है; ‘अपने हृदय को प्रसन्न कर’ कठिन क्रिया का संदर्भानुसार अर्थ है।
    reason: textual_variant
lexical_decisions:
- source_word: פוג
  choice: विश्राम दे
  rationale: आज्ञार्थक क्रिया ढीला छोड़ने, शांत करने या थमने देने का भाव रख सकती है। ‘विश्राम दे’ प्राण के साथ स्वाभाविक है और पुनर्स्थापन का भाव व्यक्त करता है।
- source_word: נפשך
  choice: अपने प्राण को
  rationale: נפש यहाँ व्यक्ति के भीतरी जीवन या स्वयं को सूचित करता है। ‘प्राण’ हिब्रू शब्द की व्यापक मानवीय गहराई बनाए रखता है, बिना कठोर देह-आत्मा द्वैत थोपे।
- source_word: ופיג
  choice: और ... प्रसन्न कर
  rationale: क्रियारूप कठिन है; निकटवर्ती ‘हृदय’ और क्रोध को दूर रखने की शिक्षा के संदर्भ में यह भीतरी मनुष्य को हर्षित या तरोताज़ा करने का सकारात्मक भाव देता प्रतीत होता है। ‘प्रसन्न कर’ इस संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לבך
  choice: अपने हृदय को
  rationale: לב विचार और भाव के भीतरी केंद्र को सूचित करता है; ज्ञान-साहित्य में ‘हृदय’ इसका मानक और सहज हिन्दी प्रतिरूप है।
- source_word: וקצפון
  choice: और क्रोध को
  rationale: संज्ञा क्रोध या रोष का अर्थ देती है। आधुनिक हिन्दी में ‘क्रोध’ गरिमापूर्ण और स्पष्ट है।
- source_word: הרחק ממך
  choice: अपने से दूर रख
  rationale: आज्ञार्थक रूप सक्रिय दूरी बनाने की शिक्षा देता है। ‘अपने से दूर रख’ स्वाभाविक हिन्दी में उसका उपदेशात्मक बल बनाए रखता है।
theological_decisions:
- issue: נפש का मानवशास्त्रीय आशय
  choice: अपने प्राण को
  alternative: अपने जीवन को; अपने मन को; स्वयं को
  rationale: पद ज्ञान-साहित्य की शैली में भीतरी व्यक्ति को संबोधित करता है। ‘प्राण’ स्रोत की गहराई को बनाए रखता है, पर किसी तकनीकी देह-आत्मा सिद्धांत को अनिवार्य नहीं बनाता।
- issue: कठिन हिब्रू पंक्ति और असंगत यूनानी समानांतर का निर्वाह
  choice: उपलब्ध हिब्रू साक्ष्य के आधार पर भीतरी विश्राम, प्रसन्नता और क्रोध से दूरी की शिक्षा के रूप में अनुवाद, तथा पाठगत अनिश्चितता की पाद-टिप्पणी
  alternative: ופיג को अधिक अक्षरशः ‘ढीला कर’ या ‘शिथिल कर’ कहना; उपलब्ध यूनानी पाठ का अनुसरण करना
  rationale: हिब्रू साक्ष्य उपलब्ध होने के कारण उसे प्राथमिकता दी गई है। फिर भी ופיג कठिन है और यूनानी समानांतर का कथ्य सर्वथा भिन्न है; इसलिए भिन्नता को मिलाने के बजाय स्पष्ट रूप से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञानोपदेश। समानांतर आज्ञार्थक वाक्यरचना रखी गई है। ‘प्राण’ और ‘हृदय’ पारंपरिक किन्तु आज भी बोधगम्य शब्द हैं; कठिन पाठ को पाद-टिप्पणी में पारदर्शी बनाया गया है।
