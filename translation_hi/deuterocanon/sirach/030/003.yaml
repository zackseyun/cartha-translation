  rationale: ἀγαλλιάσεται के साथ यह बेटे को आनन्द के कारण या अवसर के रूप में दर्शाता है। ‘उस पर’ मूल की संक्षिप्तता और कुछ अर्थगत खुलापन बनाए रखता है।
