  text: Life for the poor is better than refined gold[a], and a good spirit than pearls.
translation:
  language: hi
  text: दरिद्र का जीवन कुन्दन से उत्तम है[a], और अच्छी आत्मा मोतियों से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “स्वास्थ्य और कुशलता सारे सोने से उत्तम हैं, और बलवान शरीर अथाह धन से।” यहाँ इब्रानी और यूनानी पाठ में काफी अंतर है; सम्भवतः वे अलग पाठ-परम्पराओं को दर्शाते हैं, या उपलब्ध इब्रानी पाठ विकृत हो गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: חיי שר
  choice: दरिद्र का जीवन
  rationale: חיי को संबंधसूचक रचना में ‘जीवन’ और कठिन पाठ שר को प्रसंगानुसार ‘दरिद्र’ समझा गया है। इससे इब्रानी साक्ष्य का संक्षिप्त नीतिवचनात्मक रूप बना रहता है।
- source_word: איביתי
  choice: उत्तम है
  rationale: इब्रानी रूप पाठगत रूप से कठिन है, पर מן के साथ दोनों तुलनाओं और यूनानी समानांतर के βελτίων से श्रेष्ठता की तुलना स्पष्ट होती है।
- source_word: מפז
  choice: कुन्दन से
  rationale: פז अत्यन्त शुद्ध या उत्तम सोने को दर्शाता है; ‘कुन्दन’ आधुनिक हिन्दी में शुद्ध किए हुए सोने का संक्षिप्त और स्वाभाविक पद है।
- source_word: ורוח טובה
  choice: और अच्छी आत्मा
  rationale: רוח यहाँ मनुष्य की भीतरी दशा, प्रवृत्ति या जीवन-शक्ति को समेट सकता है। ‘अच्छी आत्मा’ मूल की व्यापकता बनाए रखती है और इसे केवल प्रसन्न मनोदशा तक सीमित नहीं करती।
- source_word: מפנינים
  choice: मोतियों से
  rationale: פנינים बहुमूल्य मोतियों या समान मूल्यवान रत्न-सामग्री का संकेत दे सकता है; ‘मोती’ सर्वाधिक परिचित और सम्भावित अर्थ है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी के अनुसार ‘दरिद्र का जीवन ... और अच्छी आत्मा ...’ रखा गया है।
  alternative: 'यूनानी: ‘स्वास्थ्य और कुशलता सारे सोने से उत्तम हैं, और बलवान शरीर अथाह धन से।’'
  rationale: जहाँ इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है; फिर भी यूनानी पाठ किसी भिन्न मूल-पाठ परम्परा या बचे हुए इब्रानी में विकृति का साक्ष्य हो सकता है। इसलिए वैकल्पिक पाठ को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन के अनुरूप संक्षिप्त रखी गई है। ‘कुन्दन’ शुद्ध सोने का सहज हिन्दी पर्याय है। इब्रानी רוח की अर्थ-व्याप्ति बचाने के लिए ‘अच्छी आत्मा’ चुना गया है।
