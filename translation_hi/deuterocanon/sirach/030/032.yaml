translation:
  language: hi
  text: जिस दिन तुम्हारे जीवन के दिन पूरे हों[a] और तुम्हारी मृत्यु का समय आए, उस समय अपनी विरासत बाँट देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस दिन तुम्हारे जीवन के दिनों की समाप्ति हो।” यूनानी पदबंध संक्षिप्त है और अधिक शाब्दिक रूप से इसका अर्थ है, “तुम्हारे जीवन के दिनों की समाप्ति के दिन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας
  choice: जिस दिन ... पूरे हों
  rationale: यह यूनानी पदबंध ‘पूर्णता के दिन’ का भाव रखता है। हिन्दी में क्रियात्मक रूप स्वाभाविक है और जीवन के दिनों के अंत तक पहुँचने का अर्थ बनाए रखता है।
- source_word: ἡμερῶν ζωῆς σου
  choice: तुम्हारे जीवन के दिन
  rationale: यह संबंधकारक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; इससे मूल की ‘जीवन के दिनों’ वाली अभिव्यक्ति सुरक्षित रहती है।
- source_word: ἐν καιρῷ τελευτῆς
  choice: तुम्हारी मृत्यु का समय आए
  rationale: τελευτή का अर्थ ‘अंत’ या प्रसंगानुसार ‘मृत्यु’ हो सकता है। विरासत के प्रसंग में ‘मृत्यु’ स्पष्ट और स्वाभाविक है, जबकि ‘समय आए’ हिन्दी वाक्य-विन्यास को सहज बनाता है।
- source_word: διάδος
  choice: बाँट देना
  rationale: यह आदेशात्मक क्रिया देने, सौंपने या वितरित करने को बताती है। विरासत के संदर्भ में ‘बाँट देना’ सामान्य पाठक के लिए स्वाभाविक और सटीक है।
- source_word: κληρονομίαν
  choice: अपनी विरासत
  rationale: κληρονομία का सामान्य अर्थ ‘विरासत’ है। स्वामित्व मूल में प्रसंग से स्पष्ट है; हिन्दी में ‘अपनी’ जोड़ने से आशय सहज रूप से व्यक्त होता है।
theological_decisions:
- issue: विरासत संबंधी निर्देश का नैतिक आशय
  choice: जीवन के अंत में अपनी संपत्ति के उत्तराधिकार का बँटवारा करने का व्यावहारिक ज्ञान-निर्देश
  alternative: मृत्यु से पहले सामान्य उदारता का व्यापक आह्वान
  rationale: पद में मृत्यु और विरासत की स्पष्ट शब्दावली है। इसलिए अनुवाद संपत्ति के बँटवारे तक सीमित रहता है और बाद की कानूनी या संप्रदायगत धारणाएँ नहीं जोड़ता।
- issue: मृत्यु के ठीक समय पर कार्य करने की व्यावहारिक कठिनाई
  choice: मूल की कालगत अभिव्यक्ति और तनाव को बनाए रखना
  alternative: ‘मृत्यु से पहले’ कहकर निर्देश को व्यावहारिक रूप से स्पष्ट करना
  rationale: यूनानी पाठ ‘पूर्णता के दिन’ और ‘मृत्यु के समय’ कहता है। ‘मृत्यु से पहले’ अर्थ को सहज कर देता, पर मूल में निहित तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक शैली अपनाई गई है। ‘तुम्हारे’ और ‘अपनी’ मूल के एकवचन संबोधन को स्पष्ट रखते हैं।
