  yaml_path: translation/deuterocanon/sirach/030/029.yaml
  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: hi
  text: जब तक तुम जीवित हो और तुम्हारे भीतर साँस है, किसी भी मनुष्य[a] के हवाले अपने आपको न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “किसी भी देह।” यहाँ इसका अर्थ “किसी भी मनुष्य” या “किसी भी नश्वर मनुष्य” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: जब तक तुम जीवित हो
  rationale: यह कालवाचक प्रयोग जीवन की अवधि को व्यक्त करता है। ‘जब तक’ ἕως का स्वाभाविक हिन्दी रूप है और प्रसंग में ἔτι का आशय भी समेटता है।
- source_word: πνοὴ ἐν σοί
  choice: तुम्हारे भीतर साँस है
  rationale: यह मूल पाठ में जीवन के चिह्न के रूप में प्रयुक्त ‘साँस’ की सजीव शारीरिक छवि को बनाए रखता है।
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: अपने आपको … के हवाले न करो
  rationale: ἀλλάσσω का सामान्य अर्थ ‘बदलना’ या ‘बदले में देना’ है, पर यहाँ आत्मवाचक कर्म और दत्तिव कारक के साथ इसका भाव अपने को दूसरे के अधिकार में देने का है। यह हिन्दी में अर्थपूर्ण रहते हुए उस चेतावनी को व्यक्त करता है।
- source_word: πάσῃ σαρκί
  choice: किसी भी देहधारी मनुष्य
  rationale: एकवचन में πᾶς का प्रयोग वितरणात्मक है, इसलिए ‘किसी भी’ उपयुक्त है। ‘देहधारी मनुष्य’ σάρξ की देह-संबंधी छवि और यहाँ नश्वर मानव के अभिप्राय—दोनों को व्यक्त करता है।
theological_decisions:
- issue: गैर-पौलिनी ज्ञान-साहित्य में σάρξ का अनुवाद
  choice: देहधारी मनुष्य
  alternative: देह; कोई भी मनुष्य; नश्वर मनुष्य
  rationale: यहाँ σάρξ पापी स्वभाव का तकनीकी धर्मशास्त्रीय पद नहीं, बल्कि नश्वर मानवता का संकेत है। ‘देहधारी मनुष्य’ मूल की देहात्मक छवि को रखता है और हिन्दी पाठक के लिए अभिप्राय भी स्पष्ट करता है; पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- issue: ἀλλάξῃς के अर्थ की अस्पष्टता
  choice: के हवाले न करो
  alternative: न बदलो; बदले में न दो; अधीन न करो
  rationale: क्रिया मूलतः ‘बदलना/विनिमय करना’ कह सकती है, किंतु σεαυτόν और दत्तिव पद के साथ शाब्दिक हिन्दी अस्पष्ट और अस्वाभाविक होगी। चुना हुआ रूप दूसरे मनुष्य के अधिकार या निर्णय में स्वयं को सौंपने की प्रासंगिक चेतावनी व्यक्त करता है, बिना किसी विशिष्ट सांप्रदायिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक लहजा रखा गया है। ‘तुम’ एकवचन संबोधन को बनाए रखता है; ‘हवाले न करो’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल यूनानी की असामान्य देह-संबंधी अभिव्यक्ति सुरक्षित करती है।
