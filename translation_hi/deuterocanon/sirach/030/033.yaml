base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/033.yaml
  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: hi
  text: गधे के लिए चारा, छड़ी और बोझ[a]; घरेलू दास[c] के लिए रोटी, अनुशासन[b] और काम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लादे जाने वाले भार’।
    reason: lexical_alternative
  - marker: b
    text: ‘अनुशासन’ का अर्थ यहाँ ‘प्रशिक्षण’ या ‘सुधार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सेवक’ अथवा ‘घरेलू सेवक’; यूनानी शब्द οἰκέτης प्रायः घराने के अधीन किसी बंधुआ सेवक को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: χορτάσματα
  choice: चारा
  rationale: यह पशु को दिए जाने वाले आहार को दर्शाता है; ‘चारा’ आधुनिक हिन्दी में स्वाभाविक है और कहावत की ठोस छवि बनाए रखता है।
- source_word: ῥάβδος
  choice: छड़ी
  rationale: यहाँ शब्द गधे को नियंत्रित या सुधारने के साधन के अर्थ में है। ‘छड़ी’ सहज हिन्दी है और सहारा देने वाली ‘लाठी’ की अपेक्षा प्रसंग के अधिक अनुकूल है।
- source_word: φορτία
  choice: बोझ
  rationale: बहुवचन संज्ञा उन भारों को बताती है जिन्हें ढोया जाता है। ‘बोझ’ अर्थ और कहावत की संक्षिप्तता दोनों को सुरक्षित रखता है; ‘लदे हुए भार’ भी संभव है।
- source_word: ὄνῳ
  choice: गधे के लिए
  rationale: यूनानी संप्रदान कारक को हिन्दी में ‘के लिए’ से व्यक्त किया गया है, जिससे दोनों समानांतर खंड स्वाभाविक बनते हैं।
- source_word: ἄρτος
  choice: रोटी
  rationale: मूल शब्द विशेष रूप से रोटी को दर्शाता है, यद्यपि प्रसंग में यह मूल भोजन का भी संकेत कर सकता है। ठोस शब्द को सामान्यीकृत नहीं किया गया।
- source_word: παιδεία
  choice: अनुशासन
  rationale: शब्द में शिक्षा, प्रशिक्षण और सुधार—तीनों का अर्थक्षेत्र है। इस प्रसंग में नियंत्रण और सुधार का पक्ष प्रमुख है, पर पादटिप्पणी व्यापक अर्थ की संभावना बनाए रखती है।
- source_word: ἔργον
  choice: काम
  rationale: यह सरल और स्वाभाविक हिन्दी है तथा पद की संक्षिप्त कहावती शैली को बनाए रखता है।
- source_word: οἰκέτῃ
  choice: घरेलू दास
  rationale: οἰκέτης सामान्यतः घराने से जुड़े अधीनस्थ सेवक, प्रायः बंधुआ दास, को दर्शाता है। ‘घरेलू दास’ घरेलू संदर्भ और बंधित सामाजिक स्थिति दोनों को स्पष्ट करता है।
theological_decisions:
- issue: οἰκέτῃ की सामाजिक स्थिति को हिन्दी में कैसे व्यक्त किया जाए
  choice: घरेलू दास
  alternative: सेवक; घरेलू सेवक
  rationale: पद में रोटी, अनुशासन और थोपे गए काम का मेल अधीन और बंधित स्थिति को सामने लाता है। केवल ‘सेवक’ कहना उस ऐतिहासिक सामाजिक वास्तविकता को नरम कर सकता है; फिर भी शब्द के व्यापक प्रयोग को पादटिप्पणी में स्वीकार किया गया है।
- issue: παιδεία के बहुअर्थी स्वरूप को कैसे सुरक्षित रखा जाए
  choice: अनुशासन
  alternative: प्रशिक्षण; शिक्षा; सुधार
  rationale: गधे के लिए छड़ी और घरेलू दास के लिए παιδεία के समानांतर प्रयोग से सुधारात्मक या नियंत्रणकारी भाव उभरता है। फिर भी मूल शब्द केवल दंड तक सीमित नहीं है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत के अनुरूप रखी गई है। दोनों खंडों में ‘के लिए’ की समानांतर रचना मूल यूनानी के संतुलन को दर्शाती है। ऐतिहासिक दासता को नरम किए बिना ‘घरेलू दास’ चुना गया है; यह पद के कथन का अनुवाद है, उसका नैतिक अनुमोदन नहीं।
