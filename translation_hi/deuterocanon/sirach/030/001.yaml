base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/001.yaml
  text: He who loves his son will continue the lash for him[b][a], so that he may rejoice in his final days.
translation:
  language: hi
  text: जो अपने पुत्र से प्रेम करता है, वह उसे बार-बार कोड़े लगाएगा[a], ताकि उसके अन्त समय में वह आनन्दित हो सके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसके लिए कोड़े लगाने में लगा रहेगा।” यूनानी क्रिया में लगातार, बार-बार या लगन से किए जाने का भाव है; संज्ञा का अर्थ “कोड़े” अथवा “कोड़े मारना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी अन्तिम बातों/अवस्थाओं पर।” यह पद उसके बाद के वर्षों, अन्तिम अवस्था या अन्तिम परिणाम की ओर संकेत कर सकता है। यूनानी में यह भी पूरी तरह स्पष्ट नहीं कि यहाँ ‘उसके’ और आनन्दित होने वाला व्यक्ति किसे सूचित करते हैं।
    reason: ambiguity
lexical_decisions:
- source_word: Ὁ ἀγαπῶν
  choice: जो ... प्रेम करता है
  rationale: संज्ञार्थक कृदन्त सामान्य, नीतिवचनात्मक कथन बनाता है; हिन्दी में ‘जो ... करता है’ उसी कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपने पुत्र से
  rationale: υἱός विशेष रूप से ‘पुत्र’ है; ‘सन्तान’ कहने से मूल का पुल्लिंग पारिवारिक संकेत मिट जाता। ‘अपने’ हिन्दी में कर्ता के साथ सम्बन्ध स्पष्ट करता है।
- source_word: ἐνδελεχήσει
  choice: बार-बार ... लगाएगा
  rationale: क्रिया निरन्तरता, लगन या बारम्बारता का भाव देती है। अनुशासन के प्रसंग में ‘बार-बार’ इस भाव को सहज हिन्दी में व्यक्त करता है, यद्यपि क्रिया की दुर्लभता के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: μάστιγας αὐτῷ
  choice: उसे ... कोड़े लगाएगा
  rationale: μάστιγας बहुवचन में कोड़ों अथवा कोड़े मारने की घटनाओं को सूचित करता है और αὐτῷ उनके लक्ष्य को। हिन्दी में यह रचना स्पष्ट और स्वाभाविक है तथा मूल की कठोर शारीरिक छवि को बनाए रखती है।
- source_word: ἵνα εὐφρανθῇ
  choice: ताकि ... वह आनन्दित हो सके
  rationale: ἵνα उद्देश्य अथवा अपेक्षित परिणाम बताता है और εὐφρανθῇ प्रसन्न या आनन्दित होने को; ‘हो सके’ उस लक्ष्यार्थ को बिना निश्चित परिणाम बनाए रखता है।
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: उसके अन्त समय में
  rationale: यह संक्षिप्त यूनानी पद किसी के बाद के समय, अन्तिम अवस्था या अन्तिम परिणाम की ओर संकेत कर सकता है। ‘अन्त समय’ उसकी गंभीरता और व्यापकता को रखता है, जबकि अस्पष्टता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: शारीरिक दण्ड की छवि को नरम करना या बनाए रखना
  choice: ‘कोड़े लगाएगा’ के रूप में स्पष्ट छवि बनाए रखना
  alternative: ‘अनुशासन देगा’ या ‘सुधारेगा’
  rationale: मूल में μάστιγας स्पष्ट रूप से कोड़ों की छवि रखता है। अमूर्त ‘अनुशासन’ मूल की कठोरता और नैतिक तनाव को छिपा देता; अनुवाद छवि को प्रस्तुत करता है, उसका अनुमोदन या विस्तार नहीं।
- issue: अन्त में आनन्दित होने वाले और ‘उसके’ सन्दर्भ की पहचान
  choice: मुख्य पाठ में सर्वनामगत अस्पष्टता बनाए रखना
  alternative: स्पष्ट करना कि पिता पुत्र के कारण आनन्दित होगा, या पुत्र अपने अन्त में आनन्दित होगा
  rationale: यूनानी में εὐφρανθῇ का अप्रकट कर्ता प्रसंगतः पिता हो सकता है, पर αὐτοῦ और संक्षिप्त पदबंध सम्बन्ध को पूरी तरह स्पष्ट नहीं करते। किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना उचित नहीं।
- issue: पुल्लिंग नीतिवचनात्मक रूप
  choice: ‘जो अपने पुत्र से प्रेम करता है’
  alternative: ‘जो अपनी सन्तान से प्रेम करता है’
  rationale: मूल पिता-सदृश पुल्लिंग कर्ता और विशेष रूप से पुत्र का उल्लेख करता है; लिंग-निरपेक्ष रूप अर्थ की इस विशिष्टता को बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचनात्मक रखी गई है। ‘पुत्र’ और ‘आनन्दित’ सामान्य हिन्दी में समझे जाने योग्य हैं, जबकि ‘कोड़े’ मूल की ठोस और कठोर छवि को बिना प्राचीनतावादी शब्दावली के बनाए रखता है।
