  yaml_path: translation/deuterocanon/sirach/030/040.yaml
  text: If you mistreat him and send him away[a], he will run off; on what road will you look for him?
translation:
  language: hi
  text: यदि तुम उसके साथ बुरा व्यवहार करोगे और उसे भगा दोगे, तो वह भाग जाएगा; फिर तुम उसे किस रास्ते पर ढूँढ़ोगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में प्रश्न बहुत ठोस है: “तुम उसे किस रास्ते पर ढूँढ़ोगे?” आशय यह है कि एक बार भगा दिए जाने पर उसे फिर पा लेना कठिन होगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; ‘यदि’ यूनानी के खुले शर्तार्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κακώσῃς
  choice: उसके साथ बुरा व्यवहार करोगे
  rationale: क्रिया किसी को हानि पहुँचाने या उसके साथ दुर्व्यवहार करने का व्यापक अर्थ रखती है; यह चयन प्रसंग में केवल शारीरिक चोट तक अर्थ को सीमित नहीं करता।
- source_word: ἀπάρᾳς
  choice: उसे भगा दोगे
  rationale: इस प्रसंग में क्रिया किसी को दूर कर देने या अपने पास से निकाल देने की ओर संकेत करती है। अगले पदबंध ‘वह भाग जाएगा’ के साथ ‘भगा दोगे’ कारण और परिणाम का बल स्पष्ट करता है।
- source_word: ἀποδρᾷ
  choice: वह भाग जाएगा
  rationale: क्रिया का अर्थ भाग निकलना या पलायन करना है; ‘भाग जाएगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν ποίᾳ ὁδῷ
  choice: किस रास्ते पर
  rationale: शाब्दिक, ठोस मार्ग-चित्र को सुरक्षित रखा गया है; इसे केवल ‘कहाँ’ कहने से यूनानी की आलंकारिक तीक्ष्णता घट जाती।
- source_word: ζητήσεις
  choice: ढूँढ़ोगे
  rationale: भविष्यकालीन क्रिया यहाँ आलंकारिक प्रश्न में किसी को खोजने का भाव देती है; ‘ढूँढ़ोगे’ सहज आधुनिक हिन्दी है।
