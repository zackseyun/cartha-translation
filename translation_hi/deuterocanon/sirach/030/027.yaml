  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
translation:
  language: hi
  text: ईर्ष्या और क्रोध जीवन के दिन घटा देते हैं[a], और चिंता समय से पहले बूढ़ा कर देती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी דין का अर्थ कठिन है। इसका अर्थ “क्रोध” हो सकता है; “झगड़ा/कलह” या “न्याय” भी संभव हैं, पर उनकी संभावना कम है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ दिया गया यूनानी समानांतर इस पद से मेल नहीं खाता और किसी दूसरे अंश का जान पड़ता है; इसलिए अनुवाद में इब्रानी पाठ को आधार बनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: קנאה
  choice: ईर्ष्या
  rationale: इस ज्ञान-साहित्यिक संदर्भ में यह शब्द सकारात्मक उत्साह नहीं, बल्कि मन को खा जाने वाली ईर्ष्या को दर्शाता है।
- source_word: דין
  choice: क्रोध
  rationale: यद्यपि सामान्यतः यह शब्द न्याय या निर्णय से जुड़ा है, यहाँ विनाशकारी मनोवृत्तियों की जोड़ी में इसे क्रोध अथवा झगड़ालू रोष के अर्थ में लेना प्रसंगानुकूल है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: יקצרו ימים
  choice: जीवन के दिन घटा देते हैं
  rationale: यह इब्रानी मुहावरे के 'दिनों को छोटा करने' के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और अकाल मृत्यु की ओर संकेत बनाए रखता है।
- source_word: ובלא עת
  choice: समय से पहले
  rationale: यह समय से पूर्व या असमय होने का अर्थ स्पष्ट और सहज आधुनिक हिन्दी में देता है।
- source_word: תזקין
  choice: बूढ़ा कर देती है
  rationale: क्रिया के बूढ़ा होने या बनाने के अर्थ को चिंता के कारणात्मक प्रभाव के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: דאגה
  choice: चिंता
  rationale: यह शब्द भीतर ही भीतर खा जाने वाली व्याकुल चिंता को दर्शाता है; 'चिंता' सामान्य पाठक के लिए सहज और सटीक है।
