lexical_decisions:
- source_word: ἔμβαλε
  choice: लगा दो
  rationale: ἐμβάλλω का अओरिस्ट आज्ञार्थक रूप यहाँ किसी व्यक्ति को किसी गतिविधि में लगाने का भाव देता है। ‘लगा दो’ स्वाभाविक हिन्दी में आज्ञार्थक बल को बनाए रखता है और ‘फेंक दो’ जैसे अतिशाब्दिक अर्थ से बचता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मकारक सर्वनाम संदर्भ में पुरुष व्यक्ति की ओर संकेत करता है। हिन्दी में ‘उसे’ स्वाभाविक रूप से कर्म का कार्य करता है; लिंग का संकेत आगे ‘वह’ से संदर्भानुसार समझ आता है।
- source_word: εἰς ἐργασίαν
  choice: काम में
  rationale: εἰς के साथ ἐργασίαν किसी को श्रम या उत्पादक गतिविधि में लगाने का भाव व्यक्त करता है। ‘काम में’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: ἵνα μὴ ἀργῇ
  choice: ताकि वह बेकार न बैठा रहे
  rationale: ἵνα उद्देश्य बताता है, μὴ निषेध करता है, और ἀργῇ निष्क्रिय या बिना काम के रहने का भाव देता है। ‘बेकार न बैठा रहे’ इस प्रयोजन और निष्क्रियता को सहज हिन्दी में व्यक्त करता है, बिना इसे नैतिक रूप से अधिक तीखे ‘आलसी’ में बदलने के।
