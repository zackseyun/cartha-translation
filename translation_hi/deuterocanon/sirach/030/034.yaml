  yaml_path: translation/deuterocanon/sirach/030/034.yaml
  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: hi
  text: बालक को बचपन में काम में लगाओ, और तुम्हें चैन मिलेगा; उसके हाथों को खाली रहने दो[a], और वह स्वतंत्रता चाहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके हाथों को ढीला/खुला छोड़ दो”; अर्थात उसके काम या गतिविधि पर अनुशासन ढीला कर दो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “स्वतंत्रता” का आशय राजनीतिक आज़ादी नहीं, बल्कि रोक-टोक या अनुशासन से छूट चाहना है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: बालक से बचपन ही में काम कराओ
  rationale: ἔργασαι का यहाँ उपदेशात्मक अर्थ बालक को काम या अनुशासित गतिविधि में लगाना है। ἐν παιδί को प्रसंग और आगे के पुल्लिंग निर्देशों के आधार पर कालवाचक रूप में समझते हुए ‘बचपन ही में’ कहा गया है।
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: तुम्हें चैन मिलेगा
  rationale: ἀνάπαυσις विश्राम या राहत को सूचित करता है। इस लोकोक्तिपरक पारिवारिक संदर्भ में ‘चैन मिलेगा’ स्वाभाविक और अर्थसंगत हिन्दी है।
- source_word: ἄνες χεῖρας αὐτῷ
  choice: उसके हाथों को ढील दे दो
  rationale: ἄνες में ढीला छोड़ने या नियंत्रण कम करने का भाव है; ‘हाथ’ को बनाए रखने से यूनानी बिंब और काम-काज का आशय दोनों सुरक्षित रहते हैं।
- source_word: ζητήσει ἐλευθερίαν
  choice: वह स्वतंत्रता खोजेगा
  rationale: ἐλευθερία का सीधा अर्थ स्वतंत्रता है। अनुवाद इस शब्द को बनाए रखता है और प्रसंगगत अर्थ—अनुशासन से छूट चाहना—पादटिप्पणी में स्पष्ट करता है।
theological_decisions:
- issue: ज्ञान-साहित्य के निर्देश में παιδί और पुल्लिंग एकवचन निर्देशों का रूप
  choice: ‘बालक ... उसके ... वह’ के रूप में पुल्लिंग एकवचन बनाए रखा गया
  alternative: लिंग-निरपेक्ष ‘बच्चा’ या बहुवचन रूप
  rationale: यूनानी पाठ में एकवचन बालक और उसके लिए पुल्लिंग निर्देश हैं; इसलिए स्रोत के व्याकरणिक रूप को बिना व्यापक या लिंग-निरपेक्ष बनाए सुरक्षित रखा गया।
- issue: ἐλευθερίαν का नैतिक आशय
  choice: मुख्य पाठ में शाब्दिक ‘स्वतंत्रता’ रखकर प्रसंग पादटिप्पणी में बताया गया
  alternative: मुख्य पाठ में ‘अनुशासन से छूट’ या ‘मनमानी’ कहना
  rationale: शाब्दिक शब्द पाठ की वास्तविक अर्थगत व्यापकता और तनाव को बनाए रखता है; अधिक नकारात्मक व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चैन मिलेगा’ बोलचाल में स्वाभाविक है, जबकि ‘स्वतंत्रता खोजेगा’ मूल यूनानी की संकल्पनात्मक भाषा और उसकी संभावित अर्थगत तीक्ष्णता को बनाए रखता है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी [a] का चिह्न संभवतः गलत स्थान पर था; हिन्दी में उसे संबंधित वाक्यांश ‘हाथों को ढील दे दो’ के बाद रखा गया है।
