  text: Before enemies he left behind an avenger[a], and for friends one who repays kindness.
translation:
  language: hi
  text: शत्रुओं के सामने वह एक बदला लेनेवाला[a] छोड़ गया, और मित्रों के लिए उपकार का प्रतिदान करनेवाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय दिलानेवाला’ अथवा ‘रक्षक’; यूनानी शब्द ऐसे व्यक्ति को सूचित कर सकता है, जो किसी दूसरे की ओर से न्याय दिलाता या बदला लेता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναντίον ἐχθρῶν
  choice: शत्रुओं के सामने
  rationale: यह पद शत्रुओं की उपस्थिति और उनके प्रति विरोध की परिस्थिति व्यक्त करता है। ‘शत्रुओं के सामने’ यूनानी की संरचना के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: κατέλιπεν
  choice: छोड़ गया
  rationale: संदर्भ में यह किसी व्यक्ति—विशेषतः पुत्र—को अपने बाद छोड़ जाने का भाव देता है। हिन्दी में ‘छोड़ गया’ इस उत्तराधिकार-संबंधी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἔκδικον
  choice: एक बदला लेनेवाला
  rationale: यह शब्द किसी दूसरे की ओर से न्याय दिलाने या प्रतिशोध लेनेवाले व्यक्ति को सूचित कर सकता है। ‘बदला लेनेवाला’ इसके प्रबल प्रतिशोधात्मक भाव को सुरक्षित रखता है।
- source_word: τοῖς φίλοις
  choice: मित्रों के लिए
  rationale: सम्बन्धवाचक सम्प्रदान को स्वाभाविक हिन्दी में व्यक्त करता है और शत्रुओं के साथ बने विरोधी समानांतर को बनाए रखता है।
- source_word: ἀνταποδιδόντα χάριν
  choice: ऐसा व्यक्ति, जो उपकार का बदला उपकार से चुकाता है
  rationale: ἀνταποδίδωμι प्रत्युत्तर में लौटाने और χάρις यहाँ किए गए उपकार या कृपा का भाव देता है। यह वाक्यांश पारस्परिक उपकार को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἔκδικον का नैतिक और प्रतिशोधात्मक भाव
  choice: बदला लेनेवाला
  alternative: न्याय दिलानेवाला; रक्षक
  rationale: मूल शब्द न्याय का पक्ष लेने और प्रतिशोध लेने, दोनों अर्थों की सीमा में आता है। मुख्य पाठ में उसका प्रबल प्रतिशोधात्मक भाव रखा गया है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ बताती है; इस प्रकार पाठ के नैतिक तनाव को नरम करके समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘बदला लेनेवाला’ साधारण पाठक के लिए स्पष्ट है; पादटिप्पणी यूनानी शब्द की न्याय, प्रतिशोध और रक्षा से जुड़ी अर्थ-सीमा सुरक्षित रखती है।
