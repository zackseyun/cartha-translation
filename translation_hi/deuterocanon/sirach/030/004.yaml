  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: hi
  text: उसका पिता मर गया है, फिर भी मानो वह मरा नहीं है, क्योंकि पिता अपने पीछे अपने जैसा कोई छोड़ गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: मर गया
  rationale: क्रिया का मूल भाव अंत तक पहुँचना है और यहाँ इसका स्पष्ट अर्थ मृत्यु है; ‘मर गया’ सीधा, स्वाभाविक और पूर्ण हुई घटना को व्यक्त करता है।
- source_word: ὁ πατήρ
  choice: उसका पिता
  rationale: αὐτοῦ के साथ यह संबंधसूचक है; इसलिए आधुनिक हिन्दी में ‘उसका पिता’ सटीक है।
- source_word: ὡς οὐκ ἀπέθανεν
  choice: ऐसा है मानो वह मरा ही न हो
  rationale: ὡς वास्तविक निषेध नहीं बल्कि तुलना प्रस्तुत करता है; ‘मानो’ इस भाव को सुरक्षित रखता है और ‘ही’ विरोधाभास पर स्वाभाविक बल देता है।
- source_word: ὅμοιον
  choice: अपने जैसा एक जन
  rationale: यह नपुंसकलिंग एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘एक जन’ व्यक्ति का संकेत देता है, पर यूनानी में अनुपस्थित ‘पुत्र’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: κατέλιπεν
  choice: छोड़ गया है
  rationale: यहाँ अर्थ मृत्यु के बाद किसी उत्तरजीवी को पीछे छोड़ जाना है; हिन्दी क्रिया इस बने हुए परिणाम को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: μετʼ αὐτόν
  choice: अपने पीछे
  rationale: वाक्य-संदर्भ में यह पिता के बाद जीवित रहने वाले व्यक्ति का क्रमिक/कालगत भाव व्यक्त करता है; ‘अपने पीछे’ हिन्दी में सहज है।
theological_decisions:
- issue: क्या मुख्य पाठ में उत्तरजीवी को ‘पुत्र’ कहा जाए
  choice: अपने जैसा एक जन
  alternative: अपने जैसा एक पुत्र
  rationale: व्यापक संदर्भ पुत्रों से संबंधित है और अभिप्रेत व्यक्ति संतान होने की संभावना रखता है, पर इस पद में ὅμοιον के साथ कोई स्पष्ट संज्ञा नहीं है। इसलिए मुख्य पाठ स्रोत से अधिक विशिष्ट नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक जन’ सामान्य बोलचाल की तुलना में कुछ साहित्यिक है, पर यह व्यक्ति-सूचक अर्थ को स्पष्ट करते हुए ‘पुत्र’ जोड़ने से बचाता है।
