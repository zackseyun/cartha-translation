  text: अपने पुत्रों के प्राणों को लेकर वह अपने घावों पर पट्टी बाँधेगा[a], और हर चीख पर उसका अंतरतम व्याकुल हो उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का शाब्दिक अर्थ है, “पुत्रों के प्राणों/जीवनों के विषय में वह अपने घाव बाँधेगा।” इसका संबंध और आशय अनिश्चित है; “को लेकर” एक स्वाभाविक, पर अनिर्णायक, हिन्दी रूप है।
    reason: περὶ ψυχῶν υἱῶν के असामान्य संबंध को किसी एक निश्चित कारणात्मक या व्याख्यात्मक अर्थ में बदले बिना स्पष्ट करने के लिए।
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: अपने पुत्रों के प्राणों के कारण
  rationale: περί के प्रसंगगत अर्थ ‘के कारण/के विषय में’ और ψυχαί के ‘प्राण/जीवन’ अर्थ को बनाए रखता है। यूनानी पदबंध असामान्य है, इसलिए अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: वह अपने घावों पर पट्टी बाँधेगा
  rationale: καταδεσμεύω घाव को बाँधने या उस पर पट्टी लगाने का भाव देता है; αὐτοῦ को स्वाभाविक हिन्दी में ‘अपने’ कहा गया है।
- source_word: ἐπὶ πάσῃ βοῇ
  choice: हर चीख पर
  rationale: βοή पुकार, चिल्लाहट या चीख हो सकती है; इस संदर्भ में भय और व्याकुलता व्यक्त करने के लिए ‘चीख’ उपयुक्त है।
- source_word: σπλάγχνα αὐτοῦ
  choice: उसका अंतरतम
  rationale: σπλάγχνα शाब्दिक रूप से शरीर के भीतरी अंग हैं, पर भावनाओं और गहरी संवेदना के केंद्र के रूप में प्रयुक्त है; ‘अंतरतम’ इस मुहावरे का dignified और बोधगम्य हिन्दी रूप है।
