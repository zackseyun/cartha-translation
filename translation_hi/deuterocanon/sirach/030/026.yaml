base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/026.yaml
  text: For anger has killed many[b][a], and there is no benefit in wrath.
translation:
  language: hi
  text: क्योंकि क्रोध ने बहुतों को मार डाला है[b], और रोष से कोई लाभ नहीं होता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए दिया गया यूनानी समानांतर एक अलग कथन प्रस्तुत करता है: “ध्यान दो कि मैंने केवल अपने लिए परिश्रम नहीं किया, बल्कि उन सबके लिए किया है जो शिक्षा खोजते हैं।” यह पद-संख्या की असंगति या भिन्न पाठ-परंपरा का संकेत देता है। मुख्य अनुवाद उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
  - marker: b
    text: पहले खंड में ‘क्रोध’ अनूदित इब्रानी शब्द का रूप कुछ अनिश्चित है; इसका अर्थ संदर्भ और दूसरे खंड के ‘रोष’ के साथ इसकी समानांतरता के आधार पर लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: यह आसपास की चेतावनी का कारण बताने वाला संबंधसूचक है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: רבים
  choice: बहुतों को
  rationale: यह अनिश्चित बड़ी संख्या में लोगों को सूचित करता है और कहावत की व्यापकता बनाए रखता है।
- source_word: הרג
  choice: मार डाला है
  rationale: क्रिया का मूल अर्थ मारना या वध करना है; पूर्ण पक्ष बार-बार प्रमाणित सामान्य सत्य को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: דין
  choice: क्रोध
  rationale: रूप कुछ अनिश्चित है, पर दूसरे खंड के קצפון के समानांतर भाव से यहाँ रोष या क्रोध का अर्थ संदर्भानुकूल है।
- source_word: ואין
  choice: और ... नहीं होता
  rationale: यह इब्रानी के समन्वयी अस्तित्व-निषेध को स्वाभाविक हिन्दी वाक्य-विन्यास में रखता है।
- source_word: תעלה
  choice: लाभ
  rationale: शब्द का अर्थ फायदा, लाभ या उपयोगिता है; ‘लाभ’ संक्षिप्त, सामान्य और ज्ञान-साहित्य के अनुकूल है।
- source_word: בקצפון
  choice: प्रकोप से
  rationale: קצפון तीव्र क्रोध या रोष को सूचित करता है। ‘प्रकोप’ पहले खंड के ‘क्रोध’ से हल्का शब्दगत भेद रखते हुए समानांतरता बचाता है; हिन्दी में परिणाम के अभाव के साथ ‘से’ स्वाभाविक है।
theological_decisions:
- issue: इब्रानी पाठ और दिए गए यूनानी समानांतर के बीच पूर्ण विषयगत असंगति
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है और पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
  alternative: 'दिए गए यूनानी पाठ के आधार पर: “ध्यान दो कि मैंने केवल अपने लिए परिश्रम नहीं किया, बल्कि उन सबके लिए किया है जो शिक्षा खोजते हैं।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है वहाँ उसे प्राथमिकता दी जानी चाहिए। यूनानी समानांतर की विषयवस्तु यहाँ बिल्कुल अलग है, जिससे पद-संख्या की असंगति या भिन्न पाठ-परंपरा का संकेत मिलता है; इसलिए उससे इब्रानी मुख्य पाठ को बदलना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। ‘क्रोध’ और ‘प्रकोप’ समानार्थी समानांतरता को बनाए रखते हैं, जबकि ‘कोई लाभ नहीं होता’ सामान्य पाठक के लिए सहज है।
