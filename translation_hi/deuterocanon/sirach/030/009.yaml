  yaml_path: translation/deuterocanon/sirach/030/009.yaml
  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: hi
  text: अपने बेटे को अनुशासित कर, कहीं ऐसा न हो कि तुझे लज्जित होना पड़े; यदि तू उसके साथ खेले, तो वह तुझे अपमानित करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יסר
  choice: अनुशासित कर
  rationale: यह इब्रानी क्रिया सुधारने के उद्देश्य से दी जाने वाली शिक्षा और अनुशासन को व्यक्त करती है; ‘अनुशासित कर’ अभिभावकीय सुधार के भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: בנך
  choice: अपने बेटे को
  rationale: इब्रानी पाठ स्पष्ट रूप से पुल्लिंग एकवचन ‘तेरा बेटा’ कहता है, इसलिए इसे लिंग-निरपेक्ष ‘बच्चा’ नहीं किया गया।
- source_word: לבל תבוש
  choice: कहीं ऐसा न हो कि तुझे लज्जित होना पड़े
  rationale: לבל निषेधात्मक उद्देश्य अथवा बचाव व्यक्त करता है। यह अनुवाद पिता पर आने वाली सामाजिक लज्जा का भाव बनाए रखता है।
- source_word: תשחק עמו
  choice: तू उसके साथ खेलेगा
  rationale: שחק का प्रत्यक्ष अर्थ ‘खेलना’ है और यूनानी σύνπαιξον भी इसकी पुष्टि करता है। संदर्भ में लाड़ या अनुचित घनिष्ठता का संकेत संभव है, पर उसे मुख्य पाठ में स्पष्टार्थ बनाकर नहीं जोड़ा गया।
- source_word: יכלימך
  choice: वह तुझे अपमानित करेगा
  rationale: כלם का हिफ़ील रूप किसी को लज्जित या अपमानित करने का सक्रिय भाव देता है। ‘अपमानित करेगा’ पहले खंड की लज्जा से संबंध रखते हुए क्रिया की सक्रियता बचाता है।
theological_decisions:
- issue: जहाँ यूनानी समानांतर पाठ का अर्थ भिन्न है, वहाँ इब्रानी और यूनानी में से पाठ का चयन
  choice: उपलब्ध, उच्च-विश्वसनीयता वाले इब्रानी पाठ को मुख्य पाठ का आधार बनाया गया।
  alternative: 'यूनानी पर आधारित अनुवाद: ‘बच्चे को पाल-पोस/लाड़ कर, और वह तुझे चकित करेगा; उसके साथ खेल, और वह तुझे दुःखी करेगा।’'
  rationale: बेन सीरा का विद्यमान इब्रानी साक्ष्य यहाँ सुसंगत और स्पष्ट है, इसलिए वह प्राथमिक है। यूनानी दूसरे खंड में ‘उसके साथ खेल’ की पुष्टि करता है, किंतु पहली और अंतिम क्रियाओं में अलग पाठ या अर्थ दर्शाता है; इस वास्तविक भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। एकवचन निकटवर्ती संबोधन ‘तू/तुझे’ मूल इब्रानी के दूसरे पुरुष एकवचन को स्पष्ट और संक्षिप्त रूप से दर्शाता है। ‘खेलेगा’ को जानबूझकर प्रत्यक्ष रखा गया है ताकि संदर्भगत ‘लाड़ करना’ अर्थ को पाठ पर थोपा न जाए।
