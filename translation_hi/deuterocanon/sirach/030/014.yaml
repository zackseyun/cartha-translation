  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
translation:
  language: hi
  text: अपने आप में जीवित निर्धन, अपने शरीर में पीड़ित धनी से अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “स्वस्थ और शरीर से बलवान निर्धन उस धनी से अच्छा है, जिसे अपने शरीर में कोड़े मारे गए हों।” हिब्रू साक्ष्य छोटा है और उसका शाब्दिक अर्थ “अपने आप में जीवित” तथा “अपने शरीर में पीड़ित” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: अच्छा है
  rationale: नीतिवचन की तुलनात्मक रचना में טוב का अर्थ ‘से अच्छा’ है; यूनानी κρείσσων भी तुलना की पुष्टि करता है।
- source_word: מסכן
  choice: निर्धन
  rationale: यह शब्द गरीब या जरूरतमंद पुरुष को सूचित करता है; ‘निर्धन’ आधुनिक, सम्मानपूर्ण और संक्षिप्त है।
- source_word: וחי בעצמו
  choice: अपने में जीवित रहनेवाला
  rationale: यह अनगढ़पन की सीमा तक गए बिना हिब्रू के शाब्दिक और कुछ अस्पष्ट ‘अपने में जीवित’ भाव को बचाता है। यूनानी समानांतर इसे स्वस्थ और शरीर से बलवान होने के रूप में स्पष्ट करता है, पर मुख्य पाठ में वह विस्तार नहीं जोड़ा गया।
- source_word: מעשיר
  choice: उस धनी से
  rationale: हिब्रू के तुलनात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘से’ जोड़ा गया है; एकवचन पुरुषवाचक रूप बनाए रखा गया है।
- source_word: ונגע
  choice: पीड़ित है
  rationale: यह शारीरिक आघात या व्याधि से ग्रस्त होने का भाव देता है। ‘पीड़ित’ आधुनिक हिन्दी में स्वाभाविक है और कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בבשרו
  choice: अपने शरीर में
  rationale: בשר का मूल अर्थ ‘मांस’ है, किंतु इस शारीरिक दशा के संदर्भ में हिन्दी का ‘शरीर’ अधिक स्वाभाविक है; ‘अपने’ प्रत्ययगत संबंध को व्यक्त करता है।
theological_decisions:
- issue: शारीरिक दशा और व्यक्ति के अस्तित्व का विरोध
  choice: हिब्रू की संक्षिप्त और अस्पष्ट अभिव्यक्ति ‘अपने में जीवित’ को मुख्य पाठ में बनाए रखना
  alternative: ‘स्वस्थ और हृष्ट-पुष्ट’ अथवा ‘जीता-जागता और स्वस्थ’
  rationale: पद मुख्यतः नीतिपरक है, फिर भी हिब्रू केवल जीवित होने और अपने में होने की बात करता है। यूनानी परंपरा स्वास्थ्य और शारीरिक बल को स्पष्ट करती है; उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
- issue: בשר का ठोस मानवशास्त्रीय शब्द
  choice: स्वाभाविक हिन्दी के लिए ‘शरीर’
  alternative: ‘मांस’ अथवा ‘देह’
  rationale: यहाँ आशय शरीर में आई पीड़ा से है। ‘मांस’ हिन्दी में अस्वाभाविक या केवल शरीर के ऊतक का संकेत दे सकता है; ‘शरीर’ मूल विरोध को स्पष्ट रखता है, बिना इसे सामान्यीकृत ‘स्वास्थ्य’ में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘अपने में जीवित’ जानबूझकर कुछ असामान्य है, क्योंकि वह हिब्रू की वास्तविक अस्पष्टता को सुरक्षित रखता है; यूनानी की अधिक स्पष्ट स्वास्थ्य-संबंधी व्याख्या पादटिप्पणी में दी गई है।
