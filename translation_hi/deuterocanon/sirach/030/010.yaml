    reason: lexical_alternative
lexical_decisions:
- source_word: συγγελάσῃς
  choice: उसके साथ हँसी-मज़ाक न करो
  rationale: संयुक्त क्रिया किसी के साथ हँसने या उसकी हँसी में शामिल होने का भाव देती है। प्रसंग में यह अनुशासन के स्थान पर लाड़भरे मनोरंजन की चेतावनी है; ‘हँसी-मज़ाक करना’ आधुनिक हिन्दी में स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: συνοδυνηθῇς
  choice: तुम्हें उसके साथ दुःख उठाना पड़े
  rationale: संयुक्त क्रिया साथ-साथ पीड़ा या दुःख सहने को दर्शाती है। यह अनुवाद सहभोगी दुःख का अर्थ बनाए रखते हुए सहज हिन्दी देता है।
- source_word: ἐπʼ ἐσχάτῳ
  choice: अंत में
  rationale: यह पदबंध अंतिम परिणाम की ओर संकेत करता है; ‘अंत में’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: γομφιάσεις
  choice: तुम ... दाँत पीसोगे
  rationale: दाँतों के साथ प्रयुक्त क्रिया पीड़ा, खेद या झुँझलाहट में दाँत पीसने को दर्शाती है। हिन्दी का यही प्रचलित मुहावरा मूल बिंब को सुरक्षित रखता है।
- source_word: τοὺς ὀδόντας σου
  choice: अपने दाँत
  rationale: क्रिया के कर्म का सीधा अनुवाद; कर्ता से संबंध दिखाने के लिए हिन्दी में ‘अपने’ स्वाभाविक है।
