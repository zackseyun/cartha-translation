  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: hi
  text: जो अपने बेटे को शिक्षा और अनुशासन देता है, वह उससे लाभ पाएगा, और अपने परिचितों के बीच उसके कारण डींग मारेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: जो ... अनुशासन में रखता है
  rationale: παιδεύω में पालन-पोषण के अंतर्गत शिक्षा, प्रशिक्षण और सुधार—तीनों का भाव हो सकता है। ‘अनुशासन में रखता है’ सुधारात्मक शक्ति बनाए रखते हुए इसे केवल दंड तक सीमित नहीं करता।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपने बेटे को
  rationale: यूनानी पद स्पष्ट रूप से पुल्लिंग एकवचन ‘अपने बेटे’ को दर्शाता है; इसलिए इसे सामान्य ‘संतान’ नहीं किया गया।
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  choice: वह उससे लाभ पाएगा
  rationale: भविष्यत् मध्यम रूप ὀνήσεται लाभ या फायदा पाने का अर्थ देता है, और ἐπʼ αὐτῷ यहाँ उस लाभ के स्रोत को इंगित करता है।
- source_word: ἀνὰ μέσον γνωρίμων
  choice: अपने परिचितों के बीच
  rationale: γνώριμοι परिचित या जाने-पहचाने साथियों को सूचित करता है। ‘परिचित’ निकटता को ‘मित्र’ कहकर बढ़ा नहीं देता।
- source_word: καυχήσεται ἐπʼ αὐτῷ
  choice: उसके कारण डींग मारेगा
  rationale: καυχάομαι का सीधा अर्थ डींग मारना या गर्वपूर्वक कहना है; ἐπʼ αὐτῷ बेटे को उस डींग का कारण बताता है। यह रूप पाठ की सामाजिक प्रतिष्ठा वाली धार को नरम नहीं करता।
theological_decisions:
- issue: माता-पिता के डींग मारने का नैतिक मूल्य
  choice: ‘डींग मारेगा’ कहकर καυχήσεται का सीधा अर्थ बनाए रखा गया।
  alternative: ‘गर्व करेगा’ या ‘गौरव करेगा’
  rationale: पद अनुशासित बेटे से मिलने वाली सामाजिक प्रतिष्ठा का वर्णन करता है, पर इस डींग को स्पष्ट रूप से न तो दोषी ठहराता है और न सराहता है। इसलिए अनुवाद नैतिक तनाव को स्वयं हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। वाक्य की दोनों समानांतर प्रतिज्ञाएँ और यूनानी भविष्यकाल सुरक्षित रखे गए हैं।
