  text: Gladness of heart is a man's life, and a man's rejoicing prolongs his days.[a]
translation:
  language: hi
  text: हृदय की प्रसन्नता मनुष्य का जीवन है, और पुरुष का उल्लास उसके दिनों को बढ़ाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का उपलब्ध हिब्रू साक्ष्य कठिन है और यूनानी परंपरा से बहुत भिन्न है। अनुवाद स्पष्ट यूनानी समानांतर पाठ के अर्थ का अनुसरण करता है: “हृदय की प्रसन्नता मनुष्य का जीवन है, और पुरुष का उल्लास उसके दिनों को बढ़ाता है।”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  choice: हृदय की प्रसन्नता
  rationale: यह यूनानी पद भीतर की प्रसन्नता या आनंद को व्यक्त करता है और हृदय की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: ζωὴ ἀνθρώπου
  choice: मनुष्य का जीवन
  rationale: यह यूनानी के एकवचन और उसके सामान्य मानवीय अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀγαλλίαμα ἀνδρός
  choice: पुरुष का उल्लास
  rationale: ‘उल्लास’ प्रकट और सक्रिय आनंद का भाव देता है, जबकि ‘पुरुष’ यूनानी ἀνδρός के एकवचन पुल्लिंग रूप को दर्शाता है।
- source_word: μακροημέρευσις
  choice: उसके दिनों को बढ़ाता है
  rationale: यह दीर्घायु के अर्थ को स्पष्ट रखते हुए ‘दिन बढ़ने’ की बाइबलीय शैली को सुरक्षित रखता है।
theological_decisions:
- issue: उपलब्ध हिब्रू पाठ और यूनानी समानांतर पाठ में तीखा अंतर
  choice: मुख्य पाठ में स्पष्ट और सुसंगत यूनानी पाठ का अर्थ ग्रहण किया गया है तथा हिब्रू पाठ की कठिनाई को पादटिप्पणी में बताया गया है।
  alternative: 'उपलब्ध हिब्रू का अत्यंत अनिश्चित शाब्दिक अनुवाद: ‘जैसे कोई कुँवारी के साथ लेटता है, वैसे ही वह बलपूर्वक न्याय करता है, और यहोवा उसके हाथ से उसका लेखा लेगा।’'
  rationale: दिया गया हिब्रू पाठ इस पद के यूनानी अर्थ से मेल नहीं खाता और पाठगत रूप से कठिन या भिन्न प्रतीत होता है। यूनानी परंपरा स्पष्ट व पूर्ण वाक्य देती है; इसलिए अनिश्चित हिब्रू को चुपचाप सुधारने के बजाय यूनानी अर्थ का अनुवाद कर पाठभेद को स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘हृदय’, ‘प्रसन्नता’, ‘उल्लास’ और ‘दिनों को बढ़ाता है’ मूल की काव्यात्मक तथा बाइबलीय अभिव्यक्ति को बिना अनावश्यक कठिनाई के बनाए रखते हैं।
