lexical_decisions:
- source_word: כן
  choice: वैसा ही
  rationale: यह पिछले संदर्भ से तुलना जोड़ता है और हिब्रू की कहावत-जैसी संक्षिप्तता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מי
  choice: वह व्यक्ति
  rationale: यह अनिश्चित व्यक्ति का बोध कराता है; आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से लिंग पर बल नहीं देता।
- source_word: יש לו
  choice: जिसके पास ... है
  rationale: हिब्रू का स्वामित्व-सूचक मुहावरा हिन्दी में इसी प्रकार स्वाभाविक ढंग से व्यक्त होता है।
- source_word: עושר
  choice: धन
  rationale: यह भौतिक संपन्नता का स्पष्ट, सामान्य और आधुनिक हिन्दी शब्द है।
- source_word: ואין נהנה ממנו
  choice: पर वह उसका आनंद नहीं लेता
  rationale: נהנה किसी वस्तु से आनंद या लाभ पाने को दर्शाता है। यहाँ धन के संदर्भ में 'आनंद नहीं लेता' अनुभवगत अर्थ को सीधे व्यक्त करता है; 'पर' स्वामित्व और उपभोग के बीच निहित विरोध को स्वाभाविक बनाता है।
