  yaml_path: translation/deuterocanon/sirach/030/024.yaml
  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
translation:
  language: hi
  text: हृदय का आनन्द मनुष्य का जीवन है, और व्यक्ति की प्रसन्नता उसकी आयु बढ़ाती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अन्तिम इब्रानी शब्द कठिन हैं; प्राप्त इब्रानी पाठ का शाब्दिक अर्थ लगभग “उसकी नाक/क्रोध को लम्बा किया” है। यूनानी समानांतर पाठ दिनों के घटने और समय से पहले बुढ़ापे का उल्लेख करता है, जिससे यहाँ “आयु बढ़ाती है” का आशय समर्थित होता है।
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: हृदय का आनन्द
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘हृदय का आनन्द’ है। यह स्वाभाविक और गरिमापूर्ण हिन्दी में भीतरी प्रसन्नता का भाव बनाए रखता है।
- source_word: חיי איש
  choice: मनुष्य का जीवन है
  rationale: חיים यहाँ रूप में बहुवचन होते हुए भी सामूहिक अर्थ में ‘जीवन’ है। איש को इस नीतिवचन के सामान्य मानवीय संदर्भ में ‘मनुष्य’ कहना आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וגיל אדם
  choice: और व्यक्ति की प्रसन्नता
  rationale: גיל आनन्द या प्रसन्नता को व्यक्त करता है और אדם का संदर्भ सामान्य मानव से है। ‘व्यक्ति की प्रसन्नता’ पहले खंड से अर्थपूर्ण समानता रखते हुए शब्द-विविधता भी बचाती है।
- source_word: האריך אפו
  choice: उसकी आयु बढ़ाती है
  rationale: प्रेषित इब्रानी पाठ का अंतिम पद शाब्दिक रूप से कठिन है और ‘उसकी नाक/क्रोध को लम्बा किया’ जैसा पढ़ता है। यूनानी समानांतर पाठ दिनों के घटने और समय से पहले बुढ़ापा आने का विचार देता है; इसलिए सम्भावित आशय ‘आयु बढ़ाती है’ मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: איש और אדם जैसे मानव-संज्ञक शब्दों का रूपान्तरण
  choice: איש के लिए ‘मनुष्य’ और אדם के लिए ‘व्यक्ति’
  alternative: दोनों को ‘मनुष्य’ कहना, या איש को विशेष रूप से ‘पुरुष’ कहना
  rationale: यह नीतिवचन सामान्य मानव-अनुभव की बात करता है। चुने हुए शब्द आधुनिक हिन्दी में स्वाभाविक हैं और मूल के दो अलग शब्दों की कुछ भिन्नता भी बनाए रखते हैं।
- issue: अन्तिम कठिन इब्रानी शब्दावली
  choice: यूनानी समानांतर से समर्थित सम्भावित आशय ‘उसकी आयु बढ़ाती है’
  alternative: शाब्दिक रूप से ‘उसकी नाक/क्रोध को लम्बा किया’ छापना
  rationale: शाब्दिक रूप संदर्भ में असंगत और सम्भवतः पाठगत विकृति है। मुख्य पाठ में सम्भावित अर्थ देना तथा पादटिप्पणी में समस्या को स्पष्ट करना अर्थ और पारदर्शिता दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण नीतिवचन-शैली। ‘हृदय का आनन्द’ मूल की संरचना के निकट है, जबकि ‘आयु बढ़ाती है’ कठिन अन्तिम पाठ का स्वाभाविक और पारदर्शी अर्थानुवाद है।
