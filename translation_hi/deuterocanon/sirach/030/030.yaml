  yaml_path: translation/deuterocanon/sirach/030/030.yaml
  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
translation:
  language: hi
  text: क्योंकि यह अच्छा है कि तुम्हारे बच्चे तुमसे माँगें, बजाय इसके कि तुम अपने बेटों के हाथों की ओर देखो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, भरण-पोषण के लिए अपने बेटों पर निर्भर रहो। यूनानी में शाब्दिक रूप से है, “अपने बेटों के हाथों की ओर देखो।”
    reason: मूल की ‘हाथों’ वाली ठोस छवि रखते हुए उसके मुहावरेदार आशय को स्पष्ट करना।
lexical_decisions:
- source_word: κρεῖσσον
  choice: बेहतर
  rationale: तुलनात्मक अर्थ ‘अधिक अच्छा/श्रेयस्कर’ को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ τέκνα δεηθῆναί σου
  choice: तुम्हारे बच्चे तुमसे माँगें
  rationale: τέκνα को व्यापक अर्थ में ‘बच्चे’ और δεηθῆναί को सहायता की आवश्यकता के कारण ‘माँगना’ समझा गया है; ‘भीख माँगें’ यहाँ सम्भव है, पर यूनानी क्रिया अपने आप में हर प्रसंग में उतनी तीखी नहीं है।
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: हाथों की ओर ताकते रहो
  rationale: मूल की दृष्टि और हाथों वाली ठोस छवि सुरक्षित रहती है, जबकि ‘ताकते रहना’ अपेक्षा और निर्भरता का भाव भी स्वाभाविक हिन्दी में सुनाता है।
- source_word: υἱῶν σου
  choice: अपने बेटों
  rationale: υἱῶν विशेष रूप से ‘बेटों’ को सूचित करता है; इसे पहले खंड के व्यापक τέκνα (‘बच्चे’) में विलीन नहीं किया गया।
theological_decisions:
- issue: पहले और दूसरे खंड में पारिवारिक शब्दों का अंतर
  choice: बच्चे … बेटे
  alternative: दोनों स्थानों पर ‘बच्चे’
  rationale: यूनानी पाठ τέκνα और υἱῶν में स्पष्ट अंतर करता है; अनुवाद उसी अंतर को बनाए रखता है।
- issue: संतानों पर आर्थिक निर्भरता की छवि
  choice: अपने बेटों के हाथों की ओर ताकते रहो
  alternative: अपने बेटों के सहारे रहो
  rationale: मुख्य पाठ में यूनानी की ठोस शारीरिक छवि रखी गई है; पादटिप्पणी उसके मुहावरेदार आशय को स्पष्ट करती है, बिना मूल तनाव को सपाट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन और अनौपचारिक ‘तुम’ में रखा गया है। भाषा सरल किंतु गरिमापूर्ण है। ‘ताकते रहो’ सहायता की प्रतीक्षा का भाव देता है, जबकि पादटिप्पणी निर्भरता का आशय खोलती है।
