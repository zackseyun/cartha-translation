  verdict: revise
  source_fidelity: The draft accurately reflects the imperatives, the conditional disobedience clause, the concrete image of heavy fetters, the warning against excess, and the final prohibition. However, “उसकी योग्यता के अनुसार” narrows καθὼς πρέπει αὐτῷ (“as is fitting/proper for him”) to personal capability, which the Greek does not specifically state.
  naturalness: The Hindi is clear and appropriately concise. “किसी भी मनुष्य के साथ अति न करो” and “बिना विवेक के” are natural, dignified formulations that retain the wisdom-saying register more directly than the draft’s more idiomatic paraphrases.
  terminology: “बेड़ियाँ” suitably renders πέδαι. Rendering σάρξ as “मनुष्य” in the main text is contextually sound, provided the literal wording is retained in the footnote. “विवेक” appropriately conveys κρίσις here as discernment/judgment rather than merely casual thought.
  issues:
  - severity: medium
    issue: “उसकी योग्यता के अनुसार” is overly specific for καθὼς πρέπει αὐτῷ.
    rationale: πρέπει denotes what is fitting, proper, or appropriate for him; it does not expressly refer to ability or competence. The revision preserves the source’s broader ethical/practical sense.
  - severity: low
    issue: “हद से आगे न बढ़ो” is understandable but somewhat less direct than the source’s prohibition against excess in one’s treatment of another person.
    rationale: “किसी भी मनुष्य के साथ अति न करो” keeps the relation to ἐν πάσῃ σαρκί explicit and mirrors the concise proverbial register.
  revised_text: उसे उन कामों में लगाओ जो उसके लिए उचित हों; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी भी मनुष्य[a] के साथ अति न करो, और बिना विवेक के कुछ भी न करो।
