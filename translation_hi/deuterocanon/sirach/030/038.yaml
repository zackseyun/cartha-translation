base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: hi
  text: उसे उन कामों में लगाओ जो उसके लिए उचित हों; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी भी मनुष्य[a] के साथ अति न करो, और बिना विवेक के कुछ भी न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “किसी भी देह के साथ।” यह सामी-शैली की अभिव्यक्ति सामान्यतः मनुष्यों के लिए प्रयुक्त होती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: काम पर लगाओ
  rationale: यह καθίστημι के प्रेरणार्थक भाव और काम सौंपने के संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καθὼς πρέπει αὐτῷ
  choice: उसकी योग्यता के अनुसार
  rationale: πρέπει उपयुक्त या अनुरूप होने का भाव देता है। हिन्दी में यह वाक्यांश उस व्यक्ति के लिए उचित काम का स्वाभाविक अर्थ देता है, यद्यपि शाब्दिक विकल्प 'जैसा उसके लिए उचित है' भी सम्भव है।
- source_word: κἂν μὴ πειθαρχῇ
  choice: यदि वह आज्ञा न माने
  rationale: πειθαρχέω अधिकार या अनुशासन के अधीन आज्ञापालन को सूचित करता है; यूनानी में 'अनुशासन' अलग संज्ञा के रूप में नहीं है।
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: उसकी बेड़ियाँ भारी कर दो
  rationale: यह βαρύνω और πέδαι की ठोस छवि को निकटता से रखता है और 'कस दो' जैसी अस्रोत क्रिया नहीं जोड़ता।
- source_word: μὴ περισσεύσῃς
  choice: हद से आगे न बढ़ो
  rationale: यह अति करने की मनाही को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν πάσῃ σαρκί
  choice: किसी भी मनुष्य के साथ
  rationale: शाब्दिक अर्थ 'हर/किसी भी देह के साथ' है, पर यहाँ σάρξ से सामान्यतः मनुष्य अभिप्रेत हैं। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और स्रोत की छवि पादटिप्पणी में संरक्षित है।
- source_word: ἄνευ κρίσεως
  choice: बिना सोच-विचार के
  rationale: κρίσις यहाँ निर्णय, विवेक या विचार का अर्थ दे सकता है। यह हिन्दी प्रयोग प्रसंगानुकूल है और अस्पष्टता को अनुचित रूप से केवल न्यायिक 'न्याय' तक सीमित नहीं करता।
- source_word: μὴ ποιήσῃς μηδέν
  choice: कुछ भी न करो
  rationale: दोहरे निषेध के बल को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-साहित्य के मानवशास्त्रीय प्रसंग में σάρξ का अनुवाद
  choice: मुख्य पाठ में 'मनुष्य', पादटिप्पणी में शाब्दिक 'देह'
  alternative: '''किसी भी देह के साथ'''
  rationale: यहाँ σάρξ कोई विशिष्ट पौलुसी धर्मवैज्ञानिक अर्थ नहीं, बल्कि मनुष्यों की सामान्य और देहधारी दशा को सूचित करता है। 'मनुष्य' हिन्दी में आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक और वास्तविक अनुवाद-विकल्प बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञार्थक, संक्षिप्त और गरिमापूर्ण शैली रखी गई है। दास अथवा सेवक के अनुशासन से जुड़ी कठोर ऐतिहासिक छवि को नरम करके छिपाया नहीं गया; साथ ही अन्तिम चेतावनी को सहज आधुनिक मुहावरे में व्यक्त किया गया है।
