revisions:
- from: उसे उसकी योग्यता के अनुसार काम पर लगाओ; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी भी मनुष्य[a] के साथ हद से आगे न बढ़ो, और बिना सोच-विचार के कुछ भी न करो।
  to: उसे उन कामों में लगाओ जो उसके लिए उचित हों; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी भी मनुष्य[a] के साथ अति न करो, और बिना विवेक के कुछ भी न करो।
  rationale: The revision corrects the unwarranted limitation of “fitting” to “ability,” while preserving the source’s imperative force and difficult historical image. It also makes the warning against excess and the concluding appeal to discernment more direct in modern standard Hindi. The footnote preserves the literal “flesh” wording without importing a Pauline theological sense.
