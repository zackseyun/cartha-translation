lexical_decisions:
- source_word: Ἔλεγξον
  choice: पूछताछ करो
  rationale: क्रिया में जाँचने, सामना करने और दोष दिखाने तक का अर्थ-क्षेत्र है। यहाँ पहले यह निश्चित करना है कि मित्र ने काम किया भी है या नहीं, इसलिए ‘पूछताछ करो’ बिना पहले से दोषी ठहराए जाँच और सामना—दोनों का भाव देता है।
- source_word: φίλον
  choice: मित्र
  rationale: निर्दिष्ट उपपद के बिना एकवचन कर्म यहाँ सामान्य नीतिवचनात्मक अर्थ रखता है; हिन्दी में ‘मित्र’ स्वाभाविक है।
- source_word: μή ποτε οὐκ ἐποίησεν
  choice: हो सकता है कि उसने वह काम न किया हो
  rationale: μή ποτε यहाँ सावधानी से जुड़ी संभावना व्यक्त करता है। ‘हो सकता है’ अनिश्चितता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; ‘वह काम’ प्रसंग में निहित आरोपित कार्य को दर्शाता है।
- source_word: καὶ εἴ τι ἐποίησεν
  choice: और यदि उसने कुछ किया भी हो
  rationale: τι की अनिश्चितता ‘कुछ’ से और पहले खंड के साथ विरोध ‘भी’ से व्यक्त होता है।
- source_word: προσθῇ
  choice: उसमें और न बढ़ाए
  rationale: προστίθημι का मूल अर्थ ‘जोड़ना/बढ़ाना’ है; यह अनिष्ट काम को आगे बढ़ाने, दोहराने या अधिक करने की गुंजाइश खुली रखता है।
