  text: मित्र से पूछो[a]—हो सकता है कि उसने वह काम न किया हो; और यदि उसने कुछ किया हो, तो ऐसा न हो कि वह उसमें और जोड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मित्र को दोष दिखाओ … ऐसा न हो कि वह उसमें और जोड़ दे।” आरम्भिक क्रिया का अर्थ “दोष दिखाना,” “सामना करना” या “जाँच करना” भी हो सकता है; और अन्तिम वाक्यांश उस काम को दोहराने या आगे बढ़ाने के विरुद्ध अधिक तीखी चेतावनी के रूप में समझा जा सकता है।
