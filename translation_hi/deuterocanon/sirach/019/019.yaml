  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
translation:
  language: hi
  text: एक दुष्टता है, और वह घृणित है; और एक मूर्ख है जो बुद्धि में कम है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “जिसमें बुद्धि की कमी है” या अधिक शाब्दिक रूप में “जो बुद्धि में न्यून है” भी हो सकता है। यूनानी कृदंत कमी या न्यूनता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρία
  choice: दुष्टता
  rationale: यहाँ यह व्यापक नैतिक बुराई को व्यक्त करता है; ‘दुष्टता’ इसे केवल दुर्भावना तक सीमित नहीं करती।
- source_word: βδέλυγμα
  choice: घृणित
  rationale: यह शब्द तीव्र नैतिक या धार्मिक घृणा का भाव रखता है। विशेषणात्मक हिंदी वाक्य में ‘घृणित है’ स्वाभाविक और गंभीर है।
- source_word: ἄφρων
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह नैतिक और बौद्धिक विवेक से रहित व्यक्ति के लिए प्रचलित, संक्षिप्त शब्द है।
- source_word: ἐλαττούμενος
  choice: कम है
  rationale: कृदंत किसी कमी या न्यूनता को व्यक्त करता है। ‘कम है’ सहज हिंदी है और केवल बुद्धि के पूर्ण अभाव का दावा नहीं करता।
- source_word: σοφίᾳ
  choice: बुद्धि में
  rationale: सिराख के ज्ञान-साहित्यिक संदर्भ में σοφία के लिए ‘बुद्धि’ उपयुक्त है और कमी के क्षेत्र को स्पष्ट रखता है।
- source_word: καὶ αὕτη
  choice: ऐसी भी है
  rationale: यह यूनानी पद पहले कथन से जोड़ते हुए ‘यह भी’ का योगात्मक बल रखता है; ‘ऐसी भी है’ हिंदी में उसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
