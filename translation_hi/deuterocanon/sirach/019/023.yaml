    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश संक्षिप्त और कुछ कठिन है। भाव यह है कि यह छलपूर्ण व्यक्ति अनदेखा या अपरिचित रहकर लाभ उठाने के लिए दीन अथवा अनुत्तरदायी होने की मुद्रा अपनाता है।
    reason: translation_note
