  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: hi
  text: और यदि वह सामर्थ्य की कमी के कारण पाप करने से बाधित हो,[a] तो अवसर पाते ही वह बुराई करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुर्बलता के कारण।” यूनानी पदबंध शक्ति या क्षमता की कमी को अधिक सामान्य अर्थ में भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले विचार को आगे बढ़ाने वाला सामान्य संयोजक है; यहाँ विरोध का अर्थ जोड़ना आवश्यक नहीं।
- source_word: ἐὰν
  choice: यदि … तो
  rationale: दोनों क्रियाओं के साथ मिलकर यह शर्त और उसके परिणाम को व्यक्त करता है। स्वाभाविक हिन्दी में दूसरे ἐὰν को ‘अवसर मिलने पर’ के रूप में व्यक्त किया गया है।
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  choice: शक्ति की कमी के कारण
  rationale: यह पदबंध सामर्थ्य या क्षमता की न्यूनता को कारण के रूप में बताता है और यह तय नहीं करता कि कमजोरी शारीरिक है या अधिक सामान्य असमर्थता।
- source_word: κωλυθῇ ἁμαρτεῖν
  choice: पाप करने से रुका रहे
  rationale: निष्क्रिय क्रिया बताती है कि वह सुधार या सदाचार के कारण नहीं, बल्कि किसी असमर्थता के कारण पाप नहीं कर पाता। ‘रुका रहे’ इस परिस्थिति-जन्य रोक को स्वाभाविक हिन्दी में रखता है।
- source_word: εὕρῃ καιρόν
  choice: अवसर मिलने पर
  rationale: καιρός यहाँ केवल काल या समय नहीं, बल्कि अनुकूल अवसर का बोध कराता है। हिन्दी में ‘अवसर मिलने पर’ यही अर्थ सहज रूप से देता है।
- source_word: κακοποιήσει
  choice: वह बुराई करेगा
  rationale: भविष्यकालीन क्रिया का व्यापक अर्थ बुरा काम करना या अनिष्ट करना है। ‘बुराई करेगा’ पूर्ववर्ती ‘पाप’ से संबंध बनाए रखते हुए अर्थ को अनावश्यक रूप से संकुचित नहीं करता।
theological_decisions:
- issue: व्यक्ति के पाप से रुके रहने का स्वरूप
  choice: उसे शक्ति या क्षमता की कमी पाप करने से रोकती है; पाठ उसके भीतर नैतिक परिवर्तन होने की बात नहीं कहता।
  alternative: ‘शक्ति की कमी’ को केवल शारीरिक दुर्बलता या केवल नैतिक कमजोरी समझना।
  rationale: ἐλάττωμα ἰσχύος का मूल अर्थ शक्ति/सामर्थ्य की कमी है। अगला वाक्यांश बताता है कि अवसर पाते ही वह बुराई करेगा, इसलिए संयम परिस्थिति-जन्य है; फिर भी अनुवाद कमजोरी के सटीक प्रकार को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और सहज शैली रखी गई है। ‘शक्ति की कमी’ मूल पदबंध की व्यापकता बचाता है, जबकि ‘अवसर मिलने पर’ हिन्दी में स्वाभाविक ढंग से καιρός के अवसर-सूचक अर्थ को व्यक्त करता है।
