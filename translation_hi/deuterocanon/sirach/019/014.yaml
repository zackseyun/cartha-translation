  text: Reprove a friend[a], for often there is slander, and do not believe every word.
translation:
  language: hi
  text: मित्र को टोको[a], क्योंकि अक्सर निंदा होती है; और हर बात पर विश्वास मत करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मित्र को डाँटो” या “मित्र को सुधारो।” यूनानी क्रिया का अर्थ दोष दिखाना, ताड़ना देना, या सुधारना हो सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से, “हर वचन पर”; प्रसंग में आशय किसी के बारे में कही गई हर बात या खबर से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: टोककर पूछो
  rationale: ἐλέγχω का अर्थ दोष दिखाना, डाँटना, जाँच करना या किसी से जवाब माँगना हो सकता है। आसपास के प्रसंग में किसी मित्र के विषय में सुनी बात की पुष्टि करने का भाव है; इसलिए यह चयन पूछने और जवाबदेह ठहराने—दोनों को व्यक्त करता है।
- source_word: φίλον
  choice: मित्र
  rationale: अनिश्चित, एकवचन संज्ञा यहाँ सामान्य नीतिवचन के रूप में प्रयुक्त है। हिन्दी में बिना किसी संबंधसूचक शब्द के ‘मित्र’ यही सामान्य अर्थ स्वाभाविक रूप से देता है।
- source_word: πολλάκις
  choice: अकसर
  rationale: यह यूनानी क्रियाविशेषण बार-बार या बहुत बार होने का सीधा भाव देता है; ‘अकसर’ आधुनिक और सहज हिन्दी है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले आदेश का कारण बताता है; ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: γίνεται διαβολή
  choice: बदनामी की बात उठती है
  rationale: διαβολή निंदात्मक आरोप, चुगली या बदनामी का बोध कराता है और γίνεται उसके उत्पन्न होने या घटित होने का। यह अनुवाद केवल विधिक अर्थ वाले ‘झूठे आरोप’ तक भाव को सीमित नहीं करता।
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: हर बात पर विश्वास न करो
  rationale: λόγος का मूल अर्थ ‘वचन/बात’ है, पर यहाँ किसी के विषय में कही या सुनाई गई बात अभिप्रेत है। यह हिन्दी अभिव्यक्ति मूल की व्यापकता और प्रसंगगत चेतावनी दोनों बनाए रखती है।
