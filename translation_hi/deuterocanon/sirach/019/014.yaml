  naturalness: “मित्र को टोको” is concise, modern, and suitably proverbial. “अक्सर निंदा होती है” is natural Hindi and directly conveys the occurrence of slander.
  terminology: “निंदा” is an appropriately broad equivalent for διαβολή, without narrowing it to a legally framed false accusation. “हर बात पर विश्वास मत करो” preserves the broad λόγος (‘word, statement, report’) and is idiomatic.
  issues:
