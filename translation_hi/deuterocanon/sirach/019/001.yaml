translation:
  language: hi
  text: जो इस काम में लगा रहता है, वह धनी नहीं होगा; और जो छोटी चीज़ों को तुच्छ समझता है, वह बरबाद हो जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में पहला भाग है, “शराबी मज़दूर धनी नहीं होगा,” और दूसरा भाग समाप्त होता है, “वह धीरे-धीरे गिर पड़ेगा।”
    reason: इब्रानी और यूनानी पाठों के बीच अर्थपूर्ण पाठांतर को पारदर्शी रूप से दर्ज करना।
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: जो ऐसा करता है
  rationale: शाब्दिक अर्थ ‘यह करने वाला’ है। ‘ऐसा’ पिछले प्रसंग की ओर संकेत बनाए रखता है और यूनानी पाठ के ‘शराबी मज़दूर’ को बिना आधार इब्रानी मुख्य पाठ में नहीं जोड़ता।
- source_word: לֹא יַעֲשִׁיר
  choice: धनी नहीं होगा
  rationale: हिफ़ील रूप यहाँ धनवान होने या समृद्ध होने का अर्थ देता है; सरल भविष्यवाची हिन्दी मूल के कथन को स्पष्ट रखती है।
- source_word: וְבוֹזֶה מְעוּטִים
  choice: और जो थोड़े को तुच्छ समझता है
  rationale: מְעוּטִים का आशय छोटी मात्राओं या थोड़ी वस्तुओं से हो सकता है। ‘थोड़े’ इस अस्पष्टता को ‘छोटी-छोटी बातों’ कहकर सीमित नहीं करता।
- source_word: יִתְעַרְעָר
  choice: बरबाद हो जाएगा
  rationale: क्रिया अस्थिर होने, गिरने या विनाश की दशा में पहुँचने का भाव देती है। संदर्भ में ‘बरबाद’ आर्थिक और सामान्य पतन—दोनों को समेटता है।
