- source_word: ἑτεροκωφῶν
  choice: अनसुना करने का ढोंग करता है
  rationale: दुर्लभ कृदंत बहरा बनने या जानबूझकर न सुनने का भाव देता है; यह अनुवाद उस दिखावटी व्यवहार को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅπου
  choice: जहाँ
  rationale: यूनानी क्रियाविशेषण का मूल स्थानवाचक अर्थ सुरक्षित रखा गया है।
- source_word: οὐκ ἐπεγνώσθη
  choice: उसे पहचाना नहीं गया
  rationale: ἐπιγινώσκω के कर्मवाच्य रूप का यहाँ उपयुक्त अर्थ ‘पहचाना जाना’ है, जो छद्म व्यवहार के सामाजिक प्रसंग से मेल खाता है।
- source_word: προφθάσει
