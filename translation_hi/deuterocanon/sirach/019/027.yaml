  rationale: क्रिया किसी से पहले पहुँचने, उसे पछाड़ने या उससे बढ़त लेने का अर्थ दे सकती है; ‘आगे निकल जाएगा’ इस अर्थ को बिना अनावश्यक व्याख्या जोड़े बनाए रखता है।
