revisions:
- from: जो अपना चेहरा झुकाता और अनसुना करने का ढोंग करता है[a]—जहाँ उसे पहचाना नहीं गया, वहाँ वह तुमसे आगे निकल जाएगा।[b]
  to: जो चेहरा झुकाए और अनसुना करने का ढोंग करे[a]—जहाँ उसे पहचाना नहीं जाता, वहाँ वह तुम पर बढ़त पा लेगा।[b]
  rationale: The revision keeps the Greek’s two descriptive participles, locative ‘where,’ and passive ‘is not recognized,’ while improving the idiomatic proverbial form in Hindi. It replaces a potentially physical reading of ‘get ahead’ with ‘gain an advantage,’ which better conveys the likely contextual force of προφθάσει without overdetermining it. Footnotes are retained and aligned with the revised syntax.
