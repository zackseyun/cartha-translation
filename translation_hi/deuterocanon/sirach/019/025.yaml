  text: एक मनुष्य अपने रूप से पहचाना जाता है, और समझदार मनुष्य चेहरे के भाव से[a] पहचाना जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, ‘चेहरे के आमने-सामने होने से।’ यह असामान्य पदबंध संभवतः भेंट के समय चेहरे पर दिखाई देने वाले भाव की ओर संकेत करता है।
    reason: मूल यूनानी पदबंध असामान्य और कुछ हद तक अस्पष्ट है; पादटिप्पणी उसका अधिक शाब्दिक रूप और संभावित अर्थ सुरक्षित रखती है।
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: अपने रूप से
  rationale: यह वाक्यांश उस दिखाई देनेवाले रूप को पहचान का आधार बताता है। ‘अपने रूप से’ स्वाभाविक हिन्दी है और बाहरी दृश्य रूप के अर्थ को बनाए रखता है।
- source_word: ἐπιγνωσθήσεται
  choice: पहचाना जाता है
  rationale: भविष्यत् कर्मवाच्य यहाँ नीतिवचन-सदृश सामान्य सत्य व्यक्त करता है; इसलिए हिन्दी में सामान्य वर्तमान काल स्वाभाविक है।
- source_word: ἀνήρ
  choice: मनुष्य
  rationale: यहाँ ἀνήρ एक व्यक्ति के लिए प्रयुक्त है। ‘मनुष्य’ सामान्य नीतिवचन के अनुरूप है और अनावश्यक रूप से केवल जैविक लिंग पर बल नहीं देता।
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: अपने चेहरे के भाव से
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘चेहरे के मिलने/सामने आने से’ जैसा है और असामान्य है। प्रसंग में यह आमने-सामने होने पर चेहरे से प्रकट होनेवाली बात को दर्शाता है; ‘चेहरे के भाव’ इसे सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की अनिश्चितता सुरक्षित रखती है।
- source_word: νοήμων
  choice: समझदार व्यक्ति
  rationale: νοήμων समझ, बुद्धि और विवेक रखनेवाले व्यक्ति को दर्शाता है। ‘समझदार व्यक्ति’ आधुनिक हिन्दी में इस व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
