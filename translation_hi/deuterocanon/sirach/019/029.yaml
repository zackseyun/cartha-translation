  text: From appearance a man is recognized[a], and from the expression of the face one who has understanding is recognized.
translation:
  language: hi
  text: मनुष्य अपने रूप से पहचाना जाता है, और समझदार व्यक्ति अपने चेहरे के भाव से पहचाना जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चेहरे की मुद्रा से समझदार व्यक्ति पहचाना जाता है।”
    reason: ἀπαντήσεως προσώπου का शाब्दिक गठन असामान्य है और इसका अर्थ चेहरे के भाव, मुद्रा या सामने दिखाई देने वाले ढंग के रूप में लिया जा सकता है।
lexical_decisions:
- source_word: ὁράσεως
  choice: रूप
  rationale: ἀπὸ ὁράσεως यहाँ देखने की क्रिया नहीं, बल्कि व्यक्ति के दिखाई देने वाले रूप या बाहरी स्वरूप को सूचित करता है। ‘रूप’ संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुकूल है।
- source_word: ἐπιγνωσθήσεται
  choice: पहचाना जाता है
  rationale: यूनानी रूप भविष्यत् कर्मवाच्य है, पर इस सार्वकालिक नीतिवचन में हिन्दी का सामान्य वर्तमान स्वाभाविक रूप से ‘पहचान में आता है/पहचाना जाता है’ का भाव देता है। कर्मवाच्य से यह बात भी बनी रहती है कि दूसरे लोग दृश्य संकेतों के आधार पर उसे पहचानते हैं।
- source_word: ἀνήρ
  choice: मनुष्य
  rationale: ἀνήρ एकवचन पुल्लिंग है और यहाँ सामान्य नीतिवचन में प्रतिनिधिक अर्थ रखता है। ‘मनुष्य’ स्रोत के मानवीय संदर्भ और गरिमामय शैली को बनाए रखता है, बिना ‘पति’ का अनुचित अर्थ लाए।
- source_word: ἀπαντήσεως προσώπου
  choice: चेहरे के भाव
  rationale: इस कठिन मुहावरे का आशय चेहरे पर सामने दिखाई देने वाली मुद्रा, अभिव्यक्ति या ढंग से है। ‘चेहरे के भाव’ आधुनिक हिन्दी में सहज है और अस्पष्ट शाब्दिक ‘चेहरे के मिलन’ से अधिक अर्थपूर्ण है।
- source_word: νοήμων
  choice: समझदार व्यक्ति
  rationale: νοήμων समझ, बुद्धि और विवेक रखने वाले व्यक्ति को दर्शाता है। ‘समझदार व्यक्ति’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ज्ञान-साहित्य की नैतिक-बौद्धिक छाया को बनाए रखता है।
