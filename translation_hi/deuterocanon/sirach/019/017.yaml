translation:
  language: hi
  text: समस्त बुद्धि प्रभु का भय मानना है[a], और हर बुद्धि में व्यवस्था का पालन है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के प्रति श्रद्धा रखना।” यूनानी अभिव्यक्ति में भय के साथ विस्मयपूर्ण श्रद्धा भी शामिल है, पर मुख्य पाठ में स्रोत का अधिक प्रबल शब्द रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “व्यवस्था का करना।” इसका आशय व्यवस्था को आचरण में लाने या उसका पालन करने से है।
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: समस्त बुद्धि
  rationale: यह पदबंध बुद्धि की पूर्णता और व्यापकता व्यक्त करता है। ‘समस्त बुद्धि’ यूनानी की सार्वभौमिक अभिव्यक्ति को संक्षिप्त और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: φόβος Κυρίου
  choice: प्रभु का भय मानना
  rationale: यह प्रज्ञा-साहित्य की स्थापित धार्मिक अभिव्यक्ति है। ‘भय मानना’ डर के साथ श्रद्धा और विस्मय की गंभीरता को भी खुला रखता है; इसे केवल ‘आदर’ कहकर नरम नहीं किया गया है।
- source_word: ἐν πάσῃ σοφίᾳ
  choice: हर प्रकार की बुद्धि में
  rationale: यह रूप यूनानी पदबंध की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है और दूसरी पंक्ति को सामान्य सिद्धांत के रूप में रखता है।
- source_word: ποίησις νόμου
  choice: व्यवस्था का पालन करना
  rationale: ποίησις का मूल भाव ‘करना’ है। νόμου के साथ इसका आशय व्यवस्था को व्यवहार में पूरा करने या मानने से है; इसलिए ‘पालन करना’ हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: यहाँ νόμος यहूदी धार्मिक व्यवस्था या तोराह की ओर संकेत करता है। ‘व्यवस्था’ इस विधिक-धार्मिक अर्थ को ‘शिक्षा’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध यूनानी पाठ में Κυρίου है, प्रत्यक्ष इब्रानी चतुरक्षरी नाम नहीं। इसलिए ‘प्रभु’ स्रोत के रूप और उसके प्रज्ञा-साहित्यिक धार्मिक अर्थ दोनों के अनुरूप है।
- issue: φόβος में निहित धार्मिक भाव
  choice: भय मानना
  alternative: श्रद्धा रखना
  rationale: मूल अभिव्यक्ति में भय, विस्मय और श्रद्धा का तनाव बना हुआ है। केवल ‘श्रद्धा’ चुनने से φόβος की प्रबलता घट सकती थी।
- issue: ποίησις νόμου का संबंध
  choice: व्यवस्था का पालन करना
  alternative: व्यवस्था को करना
  rationale: ‘पालन करना’ सक्रिय आज्ञाकारिता को स्पष्ट करता है, जबकि शाब्दिक ‘करना’ हिन्दी में अस्वाभाविक है। फिर भी पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और प्रज्ञा-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। समानांतर यूनानी संरचना को यथासंभव बनाए रखते हुए हिन्दी में स्वाभाविक क्रियात्मक रूप अपनाया गया है।
