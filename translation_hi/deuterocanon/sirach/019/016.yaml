  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
translation:
  language: hi
  text: धमकी देने से पहले अपने पड़ोसी को उसकी गलती पर टोको, और परमप्रधान की व्यवस्था को स्थान दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमप्रधान की व्यवस्था के लिए जगह दो।’ यूनानी मुहावरे का शाब्दिक अर्थ ‘स्थान देना’ है; यहाँ इसका आशय व्यवस्था के मार्गदर्शन के लिए स्थान छोड़ना या उसे अपना कार्य करने देना हो सकता है।
    reason: δὸς τόπον के शाब्दिक रूपक और उसके खुले, संभावित आशय को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔλεγξον
  choice: उसकी गलती बताओ
  rationale: आज्ञार्थक क्रिया दोष को सीधे सामने लाकर सुधारने या उलाहना देने का भाव रखती है। ‘उसकी गलती बताओ’ आधुनिक हिन्दी में स्वाभाविक है और केवल कठोर डाँट का अर्थ थोपे बिना नैतिक गंभीरता बनाए रखता है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी को
  rationale: नैतिक उपदेश के प्रसंग में πλησίον अपने निकटवर्ती व्यक्ति या साथी मनुष्य को दर्शाता है; ‘पड़ोसी’ इसका स्थापित और स्पष्ट हिन्दी रूप है।
- source_word: πρὶν ἢ ἀπειλῆσαι
  choice: धमकी देने से पहले
  rationale: πρὶν ἢ समयगत प्राथमिकता बताता है और ἀπειλῆσαι का सामान्य अर्थ धमकी देना है। हिन्दी वाक्य-विन्यास में यह रूप सीधा और स्वाभाविक है।
- source_word: δὸς τόπον
  choice: जगह दो
  rationale: मूल यूनानी मुहावरे का स्थान देने या पीछे हटकर अवसर देने वाला रूपक सुरक्षित रखा गया है। इसका आशय व्यवस्था के मार्गदर्शन या कार्यवाही के लिए स्थान छोड़ना हो सकता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: यहाँ νόμος परमप्रधान की दैवी व्यवस्था या विधि को दर्शाता है। ‘व्यवस्था’ बाइबलीय हिन्दी में परिचित है और केवल सामान्य मानवीय कानून तक अर्थ सीमित नहीं करता।
- source_word: Ὑψίστου
  choice: परमप्रधान
  rationale: यह परमेश्वर की स्थापित श्रद्धापूर्ण उपाधि है और यूनानी अतिशयोक्तिपूर्ण उपाधि का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: δὸς τόπον νόμῳ Ὑψίστου का आशय
  choice: परमप्रधान की व्यवस्था के लिए जगह देना
  alternative: परमप्रधान की व्यवस्था को अपना काम करने देना या अपनी प्रतिक्रिया को उसके मार्गदर्शन के अधीन करना
  rationale: 'यूनानी पदबंध खुला है: यह व्यवस्था के मार्गदर्शन के आगे झुकने या उसे अपना मार्ग लेने देने का संकेत दे सकता है। मुख्य पाठ में रूपक सुरक्षित रखा गया है और पाद-टिप्पणी संभावित आशय स्पष्ट करती है, बिना किसी एक व्याख्या को अनिवार्य बनाए।'
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और सम्मानपूर्ण रखी गई है। ‘उसकी गलती बताओ’ सामान्य पाठक के लिए सहज है, जबकि ‘परमप्रधान’ और ‘व्यवस्था’ ज्ञान-साहित्य के गरिमापूर्ण धार्मिक स्वर को बनाए रखते हैं। पाद-टिप्पणी का चिह्न उसी पदबंध पर रखा गया है जिसे वह स्पष्ट करती है।
