  text: सड़न और कीड़े उसके वारिस होंगे, और एक दुस्साहसी व्यक्ति को उठा लिया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σήπη
  choice: सड़न
  rationale: यह शब्द गलने-सड़ने या क्षय की अवस्था को दर्शाता है; ‘सड़न’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: κληρονομήσουσιν αὐτόν
  choice: उसके वारिस होंगे
  rationale: 'यूनानी क्रिया का शाब्दिक उत्तराधिकार-संबंधी रूपक सुरक्षित रखा गया है: अंततः सड़न और कीड़े ही उसे अपने भाग में पाएँगे।'
- source_word: ψυχὴ τολμηρὰ
  choice: धृष्ट व्यक्ति
  rationale: ψυχή यहाँ पूरे व्यक्ति के लिए प्रयुक्त हो सकता है, जबकि τολμηρά प्रसंग में साहस से अधिक नकारात्मक दुस्साहस या धृष्टता व्यक्त करता है। इसलिए अप्राकृतिक ‘धृष्ट आत्मा’ के बजाय व्यक्ति-सूचक स्वाभाविक हिन्दी चुनी गई है।
- source_word: ἐξαρθήσεται
  choice: हटा दिया जाएगा
  rationale: निष्क्रिय क्रिया के ‘दूर कर दिए जाने’ के अर्थ को रखा गया है और कर्ता अथवा हटाए जाने के सटीक ढंग को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ψυχή को ‘आत्मा’ या ‘व्यक्ति’ समझना
  choice: व्यक्ति
  alternative: आत्मा/प्राण
  rationale: इस कथन में ψυχή मनुष्य के संपूर्ण व्यक्तित्व या स्वयं उस व्यक्ति का संकेत कर सकता है। ‘व्यक्ति’ से देह और आत्मा के विषय में ऐसा विशिष्ट सिद्धान्त आरोपित नहीं होता जिसे यूनानी पाठ अनिवार्य नहीं करता।
- issue: τολμηρά का नैतिक भाव
  choice: धृष्ट
  alternative: साहसी
  rationale: निकटवर्ती चेतावनी और विनाशकारी परिणाम के कारण शब्द का नकारात्मक भाव अधिक संभावित है। फिर भी इसे ‘दुष्ट’ जैसे अधिक व्यापक नैतिक निर्णय में नहीं बदला गया।
translation_notes:
  register: वाक्य को संक्षिप्त, गंभीर और लोकोक्तिपरक रखा गया है। ‘वारिस होंगे’ मूल के तीखे रूपक को बनाए रखता है; ‘हटा दिया जाएगा’ निष्क्रियता और परिणाम की अस्पष्टता सुरक्षित रखता है।
