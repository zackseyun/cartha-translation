  yaml_path: translation/deuterocanon/sirach/019/009.yaml
  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: hi
  text: क्या तुमने कोई बात[a] सुनी है? उसे अपने साथ ही मर जाने दो। हिम्मत रखो—वह तुम्हें फाड़ नहीं डालेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई समाचार’ अथवा ‘कोई कही हुई बात’; यूनानी λόγον का अर्थ यहाँ केवल एक ‘शब्द’ नहीं, बल्कि सुनी हुई बात या सूचना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में बिंब बहुत सजीव है: गुप्त बात को अपने भीतर रखने से तुम सचमुच फट नहीं जाओगे।'
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας
  choice: क्या तुमने ... सुनी है?
  rationale: यूनानी पूर्णकाल को प्रश्नात्मक, लोकोक्तिपरक रूप में रखा गया है; हिन्दी का पूर्णकाल पहले सुन लेने और उसकी वर्तमान प्रासंगिकता—अब उस बात को गुप्त रखने—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λόγον
  choice: कोई बात
  rationale: यहाँ λόγος किसी कही या सुनी हुई बात, समाचार अथवा गोपनीय सूचना का संकेत देता है। ‘बात’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल ‘शब्द’ तक सीमित नहीं करती।
- source_word: συναποθανέτω σοι
  choice: उसे अपने साथ ही मर जाने दो
  rationale: 'आज्ञार्थक क्रिया का सजीव रूपक सुरक्षित रखा गया है: सुनी हुई बात सुनने वाले से आगे न जाए। ‘साथ ही’ συνα- के साहचर्य और कथन के जोर को व्यक्त करता है।'
- source_word: θάρσει
  choice: हिम्मत रखो
  rationale: यह आश्वस्त करने वाला आज्ञार्थक है। ‘हिम्मत रखो’ सरल, वर्तमान और लोकोक्ति के स्वर के अनुकूल है।
- source_word: οὐ μή
  choice: नहीं ... डालेगी
  rationale: यूनानी में प्रबल निषेध है। हिन्दी में ‘नहीं’ के साथ ‘फाड़ डालेगी’ की संयुक्त क्रिया दृढ़ आश्वासन को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ῥήξει
  choice: तुम्हें फाड़ नहीं डालेगी
  rationale: ῥήγνυμι के ‘फाड़ देना/फट जाना’ वाले तीखे शारीरिक बिंब को अमूर्त ‘हानि नहीं करेगी’ में बदलने के बजाय सुरक्षित रखा गया है।
