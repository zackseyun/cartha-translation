  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
translation:
  language: hi
  text: जो मन में आनन्दित होता है, वह दोषी ठहराया जाएगा; और जो बकबक से घृणा करता है[a], उसका बुराई से ह्रास होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी λαλιάν का अनुवाद ‘बातूनीपन’, ‘व्यर्थ बातें’ या सामान्य रूप से ‘बातचीत’ भी हो सकता है; यहाँ सम्भवतः अत्यधिक या निरर्थक बोलना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश बहुत संक्षिप्त है। इसका अर्थ ‘बुराई के कारण उसका ह्रास होता है’ या ‘बुराई के द्वारा उसका ह्रास होता है’ हो सकता है; इसे ‘बुराई में उसका ह्रास होता है’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος καρδίᾳ
  choice: जो मन में आनन्दित होता है
  rationale: यूनानी कृदन्त को सार्वकालिक नीतिवचन के रूप में रखा गया है। καρδίᾳ भीतरी मनोभाव बताता है; मूल पाठ आनन्द का कारण या स्वरूप स्पष्ट नहीं करता, इसलिए उसे जोड़ा नहीं गया।
- source_word: καταγνωσθήσεται
  choice: दोषी ठहराया जाएगा
  rationale: भविष्यत् कर्मवाच्य रूप में न्यायिक निर्णय या दोषसिद्धि का भाव है। यह ‘निन्दित होगा’ की अपेक्षा verdictive अर्थ को अधिक स्पष्ट रखता है, पर दण्ड का अतिरिक्त विचार नहीं जोड़ता।
- source_word: λαλιὰν
  choice: बकबक
  rationale: λαλιά का अर्थ बातचीत या बोलना हो सकता है, पर इस ज्ञान-साहित्यिक संदर्भ में सम्भवतः अनावश्यक या अत्यधिक बोलना अभिप्रेत है। ‘बकबक’ आधुनिक और सहज है तथा सामान्य वाणी से घृणा का अर्थ लेने से बचाता है।
- source_word: ἐλαττονοῦται κακίᾳ
  choice: वह बुराई में घटता जाता है
  rationale: ἐλαττονοῦται घटने या कम होने का भाव देता है। κακίᾳ का दातृकारक प्रयोग संक्षिप्त और अस्पष्ट है; ‘बुराई में’ इस सम्भावना को खुला रखता है कि व्यक्ति बुराई के सम्बन्ध में कम होता है, बिना वाक्य को पूरी तरह व्याख्यायित किए।
theological_decisions:
- issue: पहले उपवाक्य में आनन्दित होने पर दोषी ठहराए जाने का तनाव
  choice: आनन्द को अपने आप नकारात्मक बनाकर नहीं समझाया गया
  alternative: ‘बुराई में आनन्दित होता है’ या ‘पाप में आनन्द मनाता है’
  rationale: प्रदत्त यूनानी पाठ में आनन्द के साथ ‘बुराई’ या ‘पाप’ का कोई स्पष्ट पूरक नहीं है। अर्थगत कठिनाई के बावजूद ऐसा पूरक जोड़ना मूल पाठ की वास्तविक संक्षिप्तता और तनाव को मिटा देता।
- issue: κακίᾳ का सम्बन्ध
  choice: मुख्य पाठ में ‘बुराई में’
  alternative: ‘बुराई के कारण’ या ‘बुराई के द्वारा’
  rationale: दातृकारक को सम्बन्ध/क्षेत्र के रूप में पढ़ने पर कथन का नीतिपरक क्रम अधिक संगत है, पर साधन या कारण का अर्थ भी व्याकरणतः सम्भव है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नीतिवचन की संक्षिप्तता बनाए रखने के लिए दो समानान्तर ‘जो…वह…’ उपवाक्य प्रयुक्त हुए हैं। अर्थगत कठिनाइयों को व्याख्यात्मक शब्द जोड़कर दूर करने के बजाय पादटिप्पणियों में दर्शाया गया है।
