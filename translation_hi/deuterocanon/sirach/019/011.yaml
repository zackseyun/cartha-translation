translation:
  language: hi
  text: मांस की जाँघ में धँसा हुआ तीर—वैसे ही मूर्ख के पेट में बात है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जाँघ के मांस में धँसा हुआ तीर।” यूनानी वाक्यांश बहुत संक्षिप्त है और उसकी व्याकरणिक बनावट को थोड़ा भिन्न ढंग से समझा जा सकता है; दोनों दशाओं में चित्र जाँघ के मांस में धँसे तीर का ही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλος
  choice: तीर
  rationale: यह शब्द किसी प्रक्षेप्य हथियार को दर्शाता है; इस सजीव शारीरिक उपमा में ‘तीर’ सबसे स्वाभाविक और सटीक है।
- source_word: πεπηγὸς
  choice: धँसा हुआ
  rationale: πήγνυμι का पूर्ण कृदंत किसी वस्तु के गड़कर वहीं टिके रहने की अवस्था बताता है; ‘धँसा हुआ’ तीर की उस निरंतर अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν μηρῷ
  choice: जाँघ में
  rationale: μηρός विशेष रूप से जाँघ को दर्शाता है; ‘टाँग’ कहना अनावश्यक रूप से व्यापक होता।
- source_word: σαρκός
  choice: मांस की
  rationale: σάρξ यहाँ शाब्दिक शारीरिक अर्थ में है। यूनानी संबंधकारक की संक्षिप्त और कुछ असामान्य बनावट को पूरी तरह समतल किए बिना ‘मांस की जाँघ’ के रूप में रखा गया है।
- source_word: λόγος
  choice: बात
  rationale: यहाँ λόγος सुनी या कही गई बात को दर्शाता है। प्रसंग और आधुनिक हिन्दी में ‘बात’ अधिक स्वाभाविक है, जबकि ‘वचन’ अनावश्यक रूप से औपचारिक या धार्मिक अर्थ दे सकता है।
- source_word: ἐν κοιλίᾳ
  choice: पेट में
  rationale: κοιλία का ठोस अर्थ ‘पेट’ है। यह पहले खंड की शारीरिक छवि के समानांतर है, इसलिए रूपक को ‘मन में’ कहकर अमूर्त नहीं किया गया।
- source_word: μωροῦ
  choice: मूर्ख के
  rationale: ज्ञान-साहित्य में μωρός बुद्धि और चरित्र की मूर्खता वाले व्यक्ति को दर्शाता है; एकवचन proverbial type को बनाए रखने के लिए ‘मूर्ख’ रखा गया है।
theological_decisions:
- issue: σάρξ का अर्थ
  choice: शाब्दिक ‘मांस’
  alternative: शरीर
  rationale: यहाँ कोई धर्मवैज्ञानिक ‘पापी स्वभाव’ अभिप्रेत नहीं, बल्कि जाँघ में धँसे तीर की ठोस शारीरिक उपमा है; इसलिए शाब्दिक अर्थ रखा गया है।
- issue: λόγος का आशय
  choice: बात
  alternative: वचन
  rationale: आसपास के ज्ञान-साहित्यिक प्रसंग में आशय सुनी हुई बात से है जिसे मूर्ख अपने भीतर रोक नहीं पाता। ‘बात’ इस व्यापक अर्थ को बिना धार्मिक विशेषार्थ जोड़े बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों खंडों की ठोस शारीरिक समानता बनाए रखने के लिए ‘जाँघ’, ‘मांस’ और ‘पेट’ जैसे प्रत्यक्ष शब्द चुने गए हैं। ‘पड़ी हुई बात’ भीतर अटकी उस बात का भाव देता है जिसे मूर्ख अंततः बाहर निकालने को व्याकुल होता है।
