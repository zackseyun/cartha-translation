translation:
  language: hi
  text: और बुराई का ज्ञान बुद्धि नहीं है[a], और जहाँ पापियों की सलाह है, वहाँ समझ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई में निपुणता बुद्धि नहीं है।” यूनानी पाठ में σοφία (“बुद्धि”), ἐπιστήμη (“ज्ञान/निपुणता”), और φρόνησις (“समझ/सूझ-बूझ”) के बीच भेद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में यह नैतिक और बौद्धिक बुद्धिमत्ता का स्वाभाविक मानक शब्द है।
- source_word: πονηρίας
  choice: बुराई का
  rationale: यह संबंधकारक रूप ἐπιστήμη को विशेषित करता है; ‘बुराई’ व्यापक नैतिक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: ἐπιστήμη
  choice: ज्ञान
  rationale: ‘ज्ञान’ σοφία और φρόνησις से यूनानी पाठ का शब्दगत भेद सुरक्षित रखता है।
- source_word: βουλή
  choice: सलाह
  rationale: यह पापियों के विचार-विमर्श से निकली सलाह या सम्मति को दर्शाता है और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἁμαρτωλῶν
  choice: पापियों की
  rationale: यूनानी संबंधकारक का सीधा और बाइबलीय सन्दर्भ में स्वाभाविक अनुवाद है।
- source_word: φρόνησις
  choice: समझ
  rationale: यहाँ व्यावहारिक नैतिक सूझ-बूझ अभिप्रेत है; ‘समझ’ सरल है और ‘बुद्धि’ तथा ‘ज्ञान’ से शब्दगत भेद रखता है।
- source_word: οὐκ ἔστιν ὅπου
  choice: जहाँ … होती है, वहाँ … नहीं होती
  rationale: यह स्पष्ट स्थानवाचक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या नैतिक रूप से भ्रष्ट चतुराई को किसी सकारात्मक बुद्धि का दर्जा मिलता है
  choice: पद इस बात से इनकार करता है कि बुराई की ओर निर्देशित ज्ञान बुद्धि है, और यह भी कि पापियों की सलाह में सच्ची समझ होती है।
  alternative: पहले खंड को केवल ‘बुराई का ज्ञान बुद्धि से भिन्न है’ जैसे कमजोर भेद के रूप में पढ़ा जा सकता है।
  rationale: दोनों खंडों में οὐκ ἔστιν का प्रबल निषेध है; अनुवाद इस नैतिक दावे को बिना किसी बाद की सांप्रदायिक व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘बुद्धि’, ‘ज्ञान’ और ‘समझ’ द्वारा यूनानी के तीन निकटार्थी, पर भिन्न, बौद्धिक शब्दों का अंतर सुरक्षित रखा गया है।
