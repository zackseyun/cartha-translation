lexical_decisions:
- source_word: Ἔλεγξον
  choice: पूछो
  rationale: ἐλέγχω जाँचने, प्रश्न करने, दोष प्रकट करने या फटकारने का अर्थ दे सकता है। अगला वाक्यांश मित्र के निर्दोष होने की संभावना रखता है, इसलिए पहले तथ्य जानने का भाव रखने वाला ‘पूछो’ उपयुक्त है; सुधारात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸν φίλον
  choice: मित्र से
  rationale: नीतिवचन-जैसे सामान्य निर्देश में निश्चित पदबंध का स्वाभाविक हिन्दी रूप ‘मित्र’ है। ‘पूछो’ के साथ हिन्दी में ‘से’ कारक आवश्यक है।
- source_word: μή ποτε οὐκ εἶπεν
  choice: हो सकता है कि उसने वह बात कही ही न हो
  rationale: μή ποτε यहाँ सावधानीपूर्ण संभावना व्यक्त करता है। ‘वह बात’ यूनानी में निहित कथन-विषय को स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘ही न हो’ निर्दोष होने की वास्तविक संभावना उभारता है।
- source_word: καὶ εἰ εἴρηκεν
  choice: और यदि उसने कही हो
  rationale: यूनानी perfect को हिन्दी के पूर्ण संभावनार्थक रूप में रखा गया है। ‘कही’ का निहित कर्म पिछले खंड की ‘वह बात’ है।
- source_word: ἵνα μὴ δευτερώσῃ
  choice: तो इसलिए पूछो कि वह उसे दोबारा न कहे
  rationale: δευτερόω का अर्थ दूसरी बार करना है; भाषण के संदर्भ में ‘दोबारा न कहे’ सटीक और स्वाभाविक है। ‘इसलिए पूछो’ जोड़कर यूनानी उद्देश्यवाचक ἵνα-खंड का संबंध आरंभिक आज्ञा से हिन्दी में स्पष्ट किया गया है।
