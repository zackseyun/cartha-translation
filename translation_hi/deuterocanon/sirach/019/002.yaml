  text: Wine and women lead the heart astray[a], and a bold soul destroys its owner.
translation:
  language: hi
  text: दाखमधु और स्त्रियाँ मन को उद्दंड बना देते हैं[a], और धृष्ट प्राण अपने स्वामी को नष्ट कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “दाखमधु और स्त्रियाँ समझदारों को भटका देंगे, और वेश्याओं से चिपका रहनेवाला और अधिक दुस्साहसी हो जाएगा।” दूसरी पंक्ति में इब्रानी साक्ष्य इससे काफ़ी भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: दाखमधु
  rationale: मद्य के रूप में दाखरस का स्पष्ट और गरिमापूर्ण हिन्दी रूप; सामान्य ‘मदिरा’ की अपेक्षा मूल के अंगूरी पेय को अधिक निकटता से व्यक्त करता है।
- source_word: נָשִׁים
  choice: स्त्रियाँ
  rationale: इब्रानी बहुवचन सामान्यतः ‘स्त्रियाँ’ है; मूल पाठ इसे न पत्नियों तक सीमित करता है, न वेश्याओं तक।
- source_word: יַפְחִיזוּ
  choice: उतावला कर देते हैं
  rationale: क्रिया अस्थिर, अविवेकी अथवा दुस्साहसी बना देने का भाव रखती है। ‘मन को उतावला करना’ इब्रानी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल भटकाव तक सीमित किए।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी ‘हृदय’ यहाँ विचार, इच्छा और निर्णय के भीतरी केंद्र को सूचित करता है; आधुनिक हिन्दी में ‘मन’ इस प्रयोग को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ शब्द जीवित व्यक्ति अथवा उसके आत्मगत स्वरूप का बोध देता है। ‘प्राण’ इसकी गंभीरता और ठोस व्यक्तित्व-सूचक प्रयोग दोनों को बनाए रखता है।
- source_word: עָזָה
  choice: ढीठ
  rationale: विशेषण बल, उद्दंड साहस या धृष्टता का नकारात्मक नैतिक भाव रखता है। ‘ढीठ’ इस संदर्भ में सामान्य सकारात्मक ‘साहसी’ से अधिक उपयुक्त है।
- source_word: תַשְׁחִית
  choice: विनाश कर देता है
  rationale: क्रिया नष्ट या बरबाद करने की तीव्र चेतावनी देती है; ‘विनाश’ उसकी गंभीरता बनाए रखता है।
- source_word: בְעָלֶיהָ
  choice: अपने स्वामी
  rationale: शाब्दिक अर्थ ‘उसका स्वामी/अधिकारी’ है। स्त्रीलिंग प्रत्यय ‘प्राण’ की ओर लौटता है; आशय उस व्यक्ति से है जिसका वह प्राण है। ‘अपने स्वामी’ मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर में पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का सीधा अनुवाद
  alternative: 'यूनानी के अनुसार: ‘दाखमधु और स्त्रियाँ समझदार पुरुषों को भटका देंगे, और वेश्याओं से चिपका रहनेवाला और अधिक दुस्साहसी हो जाएगा।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए वही मुख्य आधार है। यूनानी दूसरी पंक्ति में अलग पाठ देता है; उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, नीतिवचन-सदृश स्वर रखा गया है। ‘ढीठ प्राण’ और ‘अपने स्वामी’ कुछ असामान्य किंतु जानबूझकर निकट-मूल अभिव्यक्तियाँ हैं, जो इब्रानी की नैतिक तीक्ष्णता और रूपक को सुरक्षित रखती हैं।
