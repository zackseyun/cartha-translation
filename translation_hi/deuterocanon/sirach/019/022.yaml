  yaml_path: translation/deuterocanon/sirach/019/022.yaml
  text: There is one who plots evil[a], bent low in gloom, and inwardly he is full of deceit;
translation:
  language: hi
  text: कोई है जो बुराई की योजनाएँ बनाता है, उदासी में झुका हुआ है,[a] और भीतर से छल से भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कालिमा में झुका हुआ है” या “अँधेरे रूप में झुका हुआ है”; यूनानी शब्द मन की उदासी अथवा बाहरी काली/अँधेरी दशा, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν
  choice: कोई ऐसा भी है
  rationale: यूनानी अस्तित्वसूचक आरंभ एक सामान्य प्रकार के व्यक्ति का परिचय देता है; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: πονηρευόμενος
  choice: जो बुराई करता है
  rationale: कृदंत सक्रिय दुष्ट आचरण में लगे होने का संकेत देता है। 'बुराई करता है' मूल अर्थ को बनाए रखता है और केवल मन में योजना बनाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: συγκεκυφώς
  choice: झुका रहता है
  rationale: पूर्ण कृदंत झुकी हुई स्थायी मुद्रा या दशा दर्शाता है; यह उसके शारीरिक, भावात्मक या दिखावटी होने का निर्णय नहीं करता।
- source_word: μελανίᾳ
  choice: उदासी में
  rationale: यह संज्ञा कालिमा अथवा मन की उदास, अँधेरी दशा का बोध करा सकती है। मुख्य पाठ में सहज हिन्दी के लिए 'उदासी' चुना गया है और व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: उसका अंतर्मन
  rationale: शाब्दिक रूप से 'उसके भीतर की वस्तुएँ' यहाँ व्यक्ति के भीतरी स्वभाव को दर्शाता है; 'अंतर्मन' बाहरी मुद्रा के साथ विरोध स्पष्ट करता है।
- source_word: πλήρης δόλου
  choice: छल से भरा है
  rationale: δόλος कपट, धोखे या छल को सूचित करता है; 'छल' आधुनिक और संक्षिप्त हिन्दी में नैतिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: व्यक्ति की बाहरी मुद्रा और भीतरी दशा का संबंध
  choice: पद बाहरी झुकी और उदास दशा के साथ भीतर के छल को रखता है, पर यह नहीं कहता कि बाहरी दशा अनिवार्य रूप से ढोंग है।
  alternative: बाहरी उदासी को जानबूझकर ओढ़ा हुआ मुखौटा माना जा सकता है।
  rationale: यूनानी पाठ बाहरी अवस्था और भीतरी छल का विरोध तो करता है, पर मुद्रा के बनावटी होने को प्रत्यक्ष रूप से नहीं कहता; इसलिए इस तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम-सदृश विरोध को हिन्दी में 'पर' से व्यक्त किया गया है।
