translation:
  language: hi
  text: एक पुरुष की वेशभूषा, उसके दाँतों की हँसी[a] और किसी व्यक्ति के कदम उसके विषय की बातें प्रकट करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दाँतों की हँसी”; इसका आशय किसी की मुस्कान या दाँत दिखने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμός
  choice: वेशभूषा
  rationale: यह संज्ञा बाहरी सज्जा, विशेषकर पहनावे और प्रस्तुत रूप, को दर्शाती है। ‘वेशभूषा’ आधुनिक हिन्दी में दृश्य पहनावे को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀνδρός
  choice: मनुष्य की
  rationale: यूनानी पद पुल्लिंग एकवचन है और यहाँ लोकोक्तिपरक व्यक्ति को सूचित करता है; हिन्दी में ‘मनुष्य’ कथन का सामान्य मानवीय आशय रखते हुए व्याकरणिक रूप को सहज बनाता है।
- source_word: γέλως ὀδόντων
  choice: उसके दाँतों की हँसी
  rationale: शाब्दिक और असामान्य यूनानी बिंब ‘दाँतों की हँसी’ सुरक्षित रखा गया है; अधिक व्याख्यात्मक ‘मुस्कान’ को पादटिप्पणी में दिया गया है।
- source_word: βήματα
  choice: उसके कदम
  rationale: यह शब्द कदमों अथवा चलने के ढंग को सूचित कर सकता है। ‘कदम’ मूल बिंब और उसके व्यापक संकेत—चाल—दोनों के लिए स्थान छोड़ता है।
- source_word: ἀνθρώπου
  choice: उसके
  rationale: दूसरी संबंधकारक संज्ञा का आशय उसी व्यक्ति से है; हिन्दी में सर्वनाम की पुनरावृत्ति वाक्य को स्वाभाविक रखती है, जबकि यूनानी के सामान्य मानवीय संदर्भ को नहीं बदलती।
- source_word: ἀναγγέλλει
  choice: प्रकट करते हैं
  rationale: क्रिया का अर्थ बताना, घोषित करना या ज्ञात कराना है। संयुक्त कर्ताओं के साथ हिन्दी बहुवचन ‘प्रकट करते हैं’ बाहरी चिह्नों द्वारा सूचना खुलने की शक्ति व्यक्त करता है।
- source_word: τὰ περὶ αὐτοῦ
  choice: उसके बारे में बातें
  rationale: यूनानी पद व्यापक है—उस व्यक्ति से संबंधित बातें या उसके विषय की बातें। यह अनुवाद अस्पष्टता को बनाए रखता है और इसे केवल चरित्र तक सीमित नहीं करता।
