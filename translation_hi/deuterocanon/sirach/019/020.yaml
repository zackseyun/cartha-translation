  text: Better is one who is lacking[a], with understanding and fear, than one who abounds in prudence and transgresses the law.
translation:
  language: hi
  text: समझ में कम और भयभीत[a] व्यक्ति उस व्यक्ति से अच्छा है जो विवेक में प्रचुर होकर भी व्यवस्था का उल्लंघन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘श्रद्धापूर्ण भय रखनेवाला’; यूनानी पाठ यह नहीं बताता कि भय किसका है।
    reason: ἔμφοβος के सामान्य अर्थ ‘भयभीत’ के साथ उस संभावित श्रद्धापूर्ण अर्थ को दर्शाने के लिए, जबकि भय का विषय यूनानी पाठ में अनिर्दिष्ट है।
lexical_decisions:
- source_word: κρείττων
  choice: अच्छा है
  rationale: यह तुलनात्मक विशेषण नीतिवचन की तुलना आरम्भ करता है; ‘से अच्छा है’ आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἡττώμενος ἐν συνέσει
  choice: समझ में कम
  rationale: 'ἡττώμενος को उसके साथ आए ἐν συνέσει से जोड़ना यूनानी वाक्य-विन्यास के अनुकूल है: व्यक्ति सामान्य रूप से अभावग्रस्त नहीं, बल्कि समझ में कम है। यह पाठ अंग्रेज़ी परामर्श-पाठ की संभावित विभाजन-समस्या को भी ठीक करता है।'
- source_word: ἔμφοβος
  choice: भय रखनेवाला
  rationale: शब्द का अर्थ भययुक्त या भय माननेवाला है। ‘भय रखनेवाला’ उसके अनिर्दिष्ट विषय को बनाए रखता है और पाठ में ‘प्रभु का’ नहीं जोड़ता।
- source_word: περισσεύων ἐν φρονήσει
  choice: विवेक में प्रचुर
  rationale: περισσεύων प्रचुर होने या बढ़कर होने का भाव देता है; φρόνησις व्यावहारिक बुद्धि या विवेक है। ‘विवेक’ पहले खंड के σύνεσις (‘समझ’) से शब्दार्थगत भेद बनाए रखता है।
- source_word: παραβαίνων νόμον
  choice: व्यवस्था का उल्लंघन करता है
  rationale: यह नियम या व्यवस्था की सीमा लाँघने का नैतिक-विधिक भाव स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ἔμφοβος को ‘प्रभु का भय माननेवाला’ बनाकर स्पष्ट किया जाए
  choice: भय रखनेवाला
  alternative: प्रभु का भय माननेवाला; श्रद्धाभाव रखनेवाला; भयभीत
  rationale: सिराख के व्यापक ज्ञान-साहित्यिक संदर्भ में परमेश्वर के प्रति श्रद्धापूर्ण भय संभव है, पर यूनानी पद में भय का विषय नहीं दिया गया। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और टिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। ‘समझ’ और ‘विवेक’ द्वारा σύνεσις तथा φρόνησις का भेद सुरक्षित है। मुख्य पाठ में अनावश्यक रूप से ‘प्रभु’ नहीं जोड़ा गया।
