  yaml_path: translation/deuterocanon/sirach/019/007.yaml
  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: hi
  text: यह बात मित्र या शत्रु को न बताओ; और यदि यह तुम्हारे लिए पाप नहीं है, तो इसे प्रकट न करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य संक्षिप्त और कुछ अस्पष्ट है। इसका अधिक व्याख्यात्मक अर्थ यह भी हो सकता है: “मित्र या शत्रु से यह बात न कहो—सिवाय उस स्थिति के, जब इसे छिपाना तुम्हारे लिए पाप हो।”'
    reason: मूल शर्तात्मक उपवाक्य की अस्पष्टता और संभावित अपवादात्मक अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: मित्र या शत्रु से
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘मित्र के साथ और शत्रु के साथ’ है, पर यहाँ ये उन व्यक्तियों को सूचित करते हैं जिनसे बात कही जा सकती है। ‘मित्र या शत्रु से’ स्वाभाविक हिन्दी में विरोधी युग्म और निषेध की व्यापकता बनाए रखता है।
- source_word: μὴ διηγοῦ
  choice: उसका वर्णन न करो
  rationale: διηγέομαι का अर्थ किसी बात को कहना, सुनाना या विस्तार से बयान करना है। यूनानी में कर्म निहित है; हिन्दी में ‘उसका’ जोड़ना पूर्वप्रसंग की ज्ञात या सुनी हुई बात की ओर स्वाभाविक संकेत करता है।
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: और यदि वह तुम्हारे लिए पाप नहीं है
  rationale: यह अनुवाद यूनानी εἰ μή की प्रत्यक्ष शर्तात्मक रचना और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है। इसे ‘जब तक चुप रहना पाप न हो’ बनाना अर्थ को अधिक स्पष्ट तो करता, पर मूल में निहित नैतिक तनाव का व्याख्यात्मक समाधान कर देता।
- source_word: μὴ ἀποκάλυπτε
  choice: उसे प्रकट न करो
  rationale: ἀποκαλύπτω यहाँ छिपी या निजी बात को उजागर करने के अर्थ में है। ‘प्रकट न करो’ dignified और स्पष्ट हिन्दी है तथा पहले निषेध की अपेक्षा खुलासे पर अधिक बल बनाए रखता है।
theological_decisions:
- issue: καὶ εἰ μή ἐστίν σοι ἁμαρτία का नैतिक और तार्किक बल
  choice: ‘और यदि वह तुम्हारे लिए पाप नहीं है’ के रूप में निकट, शर्तात्मक अनुवाद
  alternative: ‘जब तक चुप रहना तुम्हारे लिए पाप न हो’ अथवा ‘सिवाय इसके कि चुप रहना पाप हो’
  rationale: अपवाद वाला अर्थ प्रसंग में संभव है, लेकिन यूनानी सीधे यह नहीं कहता कि ‘चुप रहना’ पाप है। मुख्य पाठ मूल की संक्षिप्तता और तनाव को बनाए रखता है; पादटिप्पणी संभावित अपवादात्मक समझ बताती है, उसे पाठ पर थोपती नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर। ‘मित्र या शत्रु’ कहावत-जैसी संक्षिप्तता रखता है। मुख्य पाठ जानबूझकर यूनानी की नैतिक अस्पष्टता को नहीं सुलझाता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
