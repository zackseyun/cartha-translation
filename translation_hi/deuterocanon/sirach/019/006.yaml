- source_word: λόγον
  choice: किसी बात को
  rationale: λόγος का अर्थ ‘शब्द,’ ‘कथन,’ या ‘बात/मामला’ हो सकता है। प्रसंग में ‘बात’ हिन्दी में स्वाभाविक रहते हुए इस व्यापकता को सबसे अच्छी तरह बनाए रखता है।
- source_word: οὐθέν
  choice: कुछ भी
  rationale: प्रबल नकार के साथ यह सम्पूर्ण अभाव व्यक्त करता है; ‘कुछ भी ... नहीं’ उसका सहज हिन्दी रूप है।
- source_word: οὐ μὴ ἐλαττονωθῇ
  choice: कम नहीं होगा
  rationale: οὐ μή भावी परिणाम का प्रबल निषेध करता है और निष्क्रिय ἐλαττονωθῇ का शाब्दिक भाव ‘घटाया/कम किया जाना’ है। हिन्दी में ‘तुम्हारा कुछ भी कम नहीं होगा’ इस आश्वासन और मूल रूपक दोनों को सुरक्षित रखता है।
