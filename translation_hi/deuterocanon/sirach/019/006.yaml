- source_word: μηδέποτε
  choice: कभी ... मत
  rationale: यह समय-संबंधी प्रबल निषेध है; आधुनिक हिन्दी में ‘कभी ... मत’ स्वाभाविक और स्पष्ट है।
- source_word: δευτερώσῃς
  choice: दोबारा ... कहो
