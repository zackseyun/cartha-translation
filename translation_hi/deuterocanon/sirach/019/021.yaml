base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: hi
  text: एक बहुत सोची-समझी धूर्तता भी होती है,[a] और वह भी अन्यायपूर्ण है; और कोई ऐसा भी होता है जो निर्णय[b] को उजागर करने के लिए बातों को तोड़-मरोड़ देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बहुत सावधानी से की गई चतुराई भी होती है।”
    reason: lexical_alternative
  - marker: b
    text: “निर्णय” का अनुवाद “न्याय” या “फैसला” भी हो सकता है; यूनानी शब्द में ये अर्थ-संभावनाएँ बनी रहती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία
  choice: धूर्तता
  rationale: यह शब्द ऐसी चतुराई का संकेत दे सकता है जिसका प्रयोग बुरे या कपटपूर्ण ढंग से हो; ‘धूर्तता’ उसके नकारात्मक नैतिक भाव को बनाए रखता है।
- source_word: ἀκριβὴς
  choice: बड़ी बारीकी से रची गई
  rationale: विशेषण यहाँ ऐसी धूर्तता बताता है जो ठीक-ठीक सोची और सावधानी से गढ़ी गई हो। यह हिंदी में स्वाभाविक रहते हुए उसकी सूक्ष्म और सुनियोजित प्रकृति व्यक्त करता है।
- source_word: ἄδικος
  choice: अन्यायपूर्ण
  rationale: यह नैतिक रूप से गलत और न्याय के विरुद्ध होने का भाव देता है; ‘अन्यायपूर्ण’ आगे आने वाले κρίμα के न्यायिक-नैतिक संदर्भ से भी मेल खाता है।
- source_word: διαστρέφων
  choice: बातों को तोड़-मरोड़ देता है
  rationale: कृदंत किसी वस्तु या विषय को उसके सही रूप या दिशा से विकृत करने का भाव देता है। यूनानी में कर्म निहित है, इसलिए हिंदी में सामान्य कर्म ‘बातों’ को स्पष्ट किया गया है।
- source_word: χάριν τοῦ
  choice: के लिए
  rationale: यह रचना उद्देश्य व्यक्त करती है; हिंदी में ‘के लिए’ इसका सरल और स्वाभाविक रूप है।
- source_word: ἐκφᾶναι
  choice: उजागर करने
  rationale: क्रिया किसी बात को प्रकट या स्पष्ट करने का अर्थ देती है; ‘उजागर करना’ इस भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: κρίμα
  choice: न्याय-निर्णय
  rationale: यूनानी शब्द निर्णय, न्याय या न्यायिक फैसले की ओर संकेत कर सकता है। ‘न्याय-निर्णय’ उसके न्यायिक और नैतिक दोनों आयामों को यथासंभव खुला रखता है।
theological_decisions:
- issue: कुशल या चतुर व्यवहार का नैतिक मूल्यांकन
  choice: पहला उपवाक्य बड़ी बारीकी से रची गई धूर्तता को अन्यायपूर्ण ठहराता है।
  alternative: इसे पहले अधिक तटस्थ ‘सावधानीपूर्ण चतुराई’ कहा जा सकता था और फिर अगले वाक्यांश में उसका नकारात्मक मूल्यांकन किया जा सकता था।
  rationale: αὕτη ἄδικος सीधे पहले उल्लिखित πανουργία का मूल्यांकन करता है। इसलिए मुख्य पाठ में उसकी नकारात्मक नैतिक दिशा स्पष्ट रखी गई है।
- issue: अंतिम उपवाक्य में κρίμα का अर्थ
  choice: ‘न्याय-निर्णय’ रखा गया है और अर्थ को कुछ खुला छोड़ा गया है।
  alternative: ‘न्याय’ या ‘फैसला’।
  rationale: यूनानी शब्द किसी एक संकुचित अर्थ को अनिवार्य नहीं करता। व्यापक पद चुनने से कानूनी और नैतिक दोनों संभावनाएँ बनी रहती हैं तथा कथन का तनाव—बातों को तोड़-मरोड़कर निर्णय उजागर करना—दूर नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘बातों को तोड़-मरोड़ना’ सामान्य पाठक के लिए स्वाभाविक है, जबकि अंतिम उपवाक्य की मूल अर्थगत असहजता और नैतिक तनाव को जानबूझकर बनाए रखा गया है।
