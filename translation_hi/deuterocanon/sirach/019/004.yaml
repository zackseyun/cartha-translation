  yaml_path: translation/deuterocanon/sirach/019/004.yaml
  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: hi
  text: जो बहुत जल्दी विश्वास कर लेता है, वह हल्के मन का है; और जो अपनी ही आत्मा[a] के विरुद्ध पाप करता है, वह चूक करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अपने ही विरुद्ध” या “अपनी ही हानि के लिए”; यूनानी में, “अपनी ही आत्मा के विरुद्ध।”
    reason: ψυχή यहाँ ‘आत्मा’, ‘स्वयं’ या ‘जीवन’ का बोध करा सकता है; पादटिप्पणी मूल अभिव्यक्ति की अर्थ-व्याप्ति बनाए रखती है।
lexical_decisions:
- source_word: ταχὺ
  choice: बहुत जल्दी
  rationale: यह क्रियाविशेषण ἐμπιστεύων को विशेषित करता है। नीतिवचन के नकारात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करने के लिए केवल ‘जल्दी’ की अपेक्षा ‘बहुत जल्दी’ उपयुक्त है।
- source_word: ἐμπιστεύων
  choice: विश्वास कर लेता है
  rationale: क्रिया किसी पर भरोसा या विश्वास रखने को दर्शाती है; ‘विश्वास कर लेता है’ उतावले ढंग से भरोसा करने का भाव सहज हिन्दी में रखता है।
- source_word: κοῦφος καρδίᾳ
  choice: मन का हलका
  rationale: कोῦφος का मूल रूपक ‘हलका’ है और καρδίᾳ आंतरिक मनोवृत्ति को सूचित करता है। यह अनुवाद उथले अथवा अस्थिर स्वभाव का संकेत देते हुए रूपक को बनाए रखता है।
- source_word: ἁμαρτάνων
  choice: पाप करता है
  rationale: यह कृदन्त नैतिक रूप से पाप करने का सामान्य अर्थ रखता है; प्रसंग में इसे दुर्बल करके केवल ‘गलती करना’ उचित नहीं।
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: अपनी ही आत्मा के विरुद्ध
  rationale: यह यूनानी संरचना आत्म-निर्देशित हानि अथवा अपराध को प्रकट करती है। ‘आत्मा’ मूल मानवशास्त्रीय पद को बनाए रखता है, जबकि पादटिप्पणी उसके व्यापक अर्थ बताती है।
- source_word: πλημμελήσει
  choice: गलत राह पर जाएगा
  rationale: πλημμελέω का भाव गलत कदम उठाने, चूकने या अनुचित करने का है। ‘गलत राह पर जाएगा’ भविष्यकाल और नैतिक विचलन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: आत्मा
  alternative: स्वयं; जीवन
  rationale: ज्ञान-साहित्य में ψυχή व्यक्ति, जीवन अथवा आत्मा का बोध करा सकता है। ‘आत्मा’ यूनानी पद का नैतिक-मानवशास्त्रीय भार बचाता है; पादटिप्पणी आत्म-हानि के वैकल्पिक अर्थ को सुरक्षित रखती है।
- issue: πλημμελήσει में नैतिक चूक और भटकाव
  choice: गलत राह पर जाएगा
  alternative: गलती करेगा; अपराध करेगा
  rationale: मूल क्रिया गलत कदम अथवा नैतिक चूक के बीच अर्थ रखती है। चुना हुआ अनुवाद इसे किसी विशिष्ट धर्मसैद्धान्तिक परिणाम में सीमित किए बिना नैतिक विचलन व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ‘मन का हलका’ मूल रूपक को बचाता है; ‘गलत राह पर जाएगा’ आज के पाठक के लिए स्पष्ट रहते हुए πλημμελήσει की नैतिक चूक का भाव देता है।
