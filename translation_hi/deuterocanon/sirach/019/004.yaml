  verdict: revise
  source_fidelity: The draft accurately conveys πιστεύειν, ἁμαρτάνειν, and the self-directed force of εἰς ψυχὴν αὐτοῦ. However, ‘गलत राह पर जाएगा’ imports an extended image of straying that is less direct than πλημμελήσει, ‘will make a false step / err / do wrong.’ A closer Hindi equivalent is needed. The footnote anchor must also be attached to ‘आत्मा,’ the term to which it pertains, rather than placed at the end of the verse.
  naturalness: ‘मन का हलका’ is not idiomatic modern standard Hindi and also uses a nonstandard spelling in this context. ‘हल्के मन का’ is grammatical and preserves the Greek metaphor, though it retains the source’s proverbial compactness. ‘वह चूक करेगा’ is concise, natural, and appropriately proverbial.
  terminology: ‘आत्मा’ suitably preserves ψυχή, while the footnote responsibly supplies ‘स्वयं’ and a harm-oriented alternative without deciding the term’s anthropological sense. ‘पाप’ is appropriate for ἁμαρτάνων. The revision avoids treating πλημμελήσει as a specifically doctrinal state of apostasy.
  issues:
  - severity: medium
    issue: The rendering ‘गलत राह पर जाएगा’ over-specifies πλημμελήσει.
    rationale: The Greek future πλημμελήσει denotes making a false step, erring, or doing wrong. A journey/path image is possible only as an interpretive expansion and is not present in the source.
  - severity: low
    issue: The footnote marker is placed after the entire verse rather than immediately after ‘आत्मा.’
    rationale: The note explains ψυχή and its phrase, so the anchor should identify that expression directly.
  - severity: low
    issue: ‘मन का हलका’ is awkward in modern standard Hindi.
    rationale: ‘हल्के मन का’ is grammatically natural while retaining the lightness metaphor of κοῦφος καρδίᾳ.
