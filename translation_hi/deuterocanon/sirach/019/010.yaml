lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: के कारण
  rationale: इस पदबंध का शाब्दिक अर्थ ‘मुख/उपस्थिति की ओर से’ है, पर यहाँ यह कारण या अवसर बताता है। दोनों उपवाक्यों में ‘के कारण’ रखने से यूनानी समानांतरता और आशय स्पष्ट रहते हैं।
- source_word: λόγου
  choice: बात
  rationale: λόγος का अर्थ ‘शब्द’, ‘बात’, ‘समाचार’ या ‘विषय’ हो सकता है। प्रसंग में यह सुनी हुई बात या जानकारी है जिसे मूर्ख अपने भीतर रोक नहीं पाता; ‘बात’ इस अर्थ-विस्तार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὠδινήσει
  choice: प्रसव-पीड़ा उठेगी
  rationale: क्रिया प्रसव की वेदना या तीव्र पीड़ा का बिंब जगाती है। अगला उपवाक्य जन्म देनेवाली स्त्री से तुलना करता है, इसलिए प्रसव-बिंब को स्पष्ट रूप से बनाए रखा गया है।
- source_word: μωρός
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह नैतिक और व्यावहारिक विवेक से रहित व्यक्ति के लिए प्रचलित पद है।
- source_word: βρέφους
  choice: बच्चे
  rationale: βρέφος शिशु या नवजात को दर्शाता है। जन्म के प्रसंग में ‘बच्चा’ सहज आधुनिक हिन्दी है।
- source_word: ἡ τίκτουσα
  choice: जन्म देनेवाली स्त्री
  rationale: इस कृदंत का शाब्दिक अर्थ ‘वह जो जन्म दे रही है’ है। यह अनुवाद क्रिया और स्त्री—दोनों को स्पष्ट रखता है।
