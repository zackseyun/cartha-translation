  text: A man may slip and not mean it; and who has not sinned with his tongue?
translation:
  language: hi
  text: कोई व्यक्ति चूक जाता है, पर जान-बूझकर नहीं[a]; और ऐसा कौन है जिसने अपनी जीभ से पाप न किया हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई चूकता है, पर मन से नहीं”; यूनानी में शाब्दिक अर्थ है, “आत्मा से नहीं।”
    reason: οὐκ ἀπὸ ψυχῆς के शाब्दिक रूप और उसकी वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: कोई व्यक्ति चूक जाता है
  rationale: अस्तित्ववाचक ἔστιν और सामान्य अर्थ वाले कृदंत को हिन्दी की स्वाभाविक नीतिवचन-शैली में व्यक्त किया गया है। ‘चूक जाता है’ नैतिक या वाचिक भूल का संकेत देता है, बिना इसे शारीरिक गिरने तक सीमित किए।
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: पर जान-बूझकर नहीं
  rationale: शाब्दिक अर्थ ‘प्राण/मन से नहीं’ है। प्रसंग में यह अनिच्छित चूक और सोची-समझी गलती के बीच भेद करता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τίς οὐχ ἥμαρτεν
  choice: ऐसा कौन है जिसने ... पाप न किया हो?
  rationale: प्रश्न अलंकारिक है और अपेक्षित उत्तर ‘कोई नहीं’ है। ‘पाप’ ἁμαρτάνω की नैतिक गंभीरता बनाए रखता है।
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: अपनी जीभ से
  rationale: यह वाणी के लिए प्रयुक्त यूनानी देहात्मक रूपक को हिन्दी में भी बनाए रखता है और स्वाभाविक है।
theological_decisions:
- issue: ἥμαρτεν का नैतिक अर्थ या केवल बोलने की भूल
  choice: पाप न किया हो
  alternative: गलती न की हो / अपराध न किया हो
  rationale: यहाँ वाणी की विफलता को नैतिक महत्व दिया गया है। ‘पाप’ उस बल को सुरक्षित रखता है, पर किसी अतिरिक्त साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: οὐκ ἀπὸ ψυχῆς में अभिप्राय की मात्रा
  choice: जान-बूझकर नहीं
  alternative: मन से नहीं / प्राण से नहीं
  rationale: वाक्यांश के प्रसंगगत आशय को मुख्य पाठ में स्पष्ट किया गया है, जबकि उसके शाब्दिक और कुछ हद तक अस्पष्ट रूप को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘कोई व्यक्ति’ सामान्य मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है; ‘अपनी जीभ से’ मूल का सजीव रूपक बनाए रखता है।
