base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
translation:
  language: hi
  text: और यदि वह शक्ति की कमी के कारण पाप करने से रोका जाए, तो जब उसे अवसर मिलेगा, वह बुराई करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह हानि पहुँचाएगा’; यूनानी क्रिया सामान्य रूप से बुराई करने या अधिक विशेष रूप से किसी को हानि पहुँचाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαττώματος
  choice: कमी
  rationale: यह शब्द यहाँ उस अभाव या न्यूनता को बताता है जिसके कारण व्यक्ति पाप नहीं कर पाता; ‘कमी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἰσχύος
  choice: शक्ति
  rationale: ἰσχύς शारीरिक या व्यावहारिक सामर्थ्य को व्यक्त कर सकता है। ‘शक्ति’ मूल की व्यापकता बनाए रखता है और इसे नैतिक दुर्बलता तक सीमित नहीं करता।
- source_word: κωλυθῇ
  choice: रोका जाए
  rationale: निष्क्रिय क्रिया यह दिखाती है कि रुकावट व्यक्ति की सदाचारिता से नहीं, बल्कि किसी परिस्थिति या असमर्थता से आती है।
- source_word: ἁμαρτεῖν
  choice: पाप करने से
  rationale: यह κωλυθῇ पर निर्भर अनंत क्रिया है; ‘पाप करने से रोका जाए’ स्वाभाविक हिन्दी है और मूल की स्पष्ट नैतिक श्रेणी को सुरक्षित रखता है।
- source_word: καιρόν
  choice: अवसर
  rationale: καιρός केवल समय नहीं, बल्कि अनुकूल मौका या उचित अवसर बताता है; ‘अवसर पाते ही’ इस आशय को सहजता से व्यक्त करता है।
- source_word: κακοποιήσει
  choice: बुराई करेगा
  rationale: यह भविष्यकालीन क्रिया सामान्य रूप से बुरा काम करने और विशेष रूप से किसी को हानि पहुँचाने—दोनों अर्थ दे सकती है। मुख्य पाठ में व्यापक नैतिक अर्थ रखा गया है।
theological_decisions:
- issue: पाप न कर पाने और धर्मी होने के बीच भेद
  choice: वचन यह बताता है कि केवल असमर्थता के कारण पाप से रुका होना धार्मिकता नहीं है; अवसर मिलने पर व्यक्ति की बुरी मंशा कर्म में प्रकट होगी।
  alternative: इसे अधिक संकीर्ण रूप से दूसरों को हानि पहुँचाने के संदर्भ में समझा जा सकता है।
  rationale: ἁμαρτεῖν और κακοποιήσει का संयोजन सामान्य नैतिक निदान प्रस्तुत करता है। अनुवाद इस तनाव को बनाए रखता है और व्यक्ति के न पाप करने को सद्गुण नहीं मान लेता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘शक्ति की कमी’ मूल यूनानी संबंध को निकटता से दर्शाता है, जबकि ‘अवसर पाते ही’ हिन्दी में καιρός की अनुकूल मौके वाली छाया को स्वाभाविक रूप देता है।
