base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/020.yaml
  text: He did not command anyone to be ungodly, and he did not permit anyone to sin.
translation:
  language: hi
  text: उसने किसी मनुष्य को पाप करने की आज्ञा नहीं दी, और न झूठे लोगों को बल दिया। वह निरर्थक काम करने वाले और भेद खोलने वाले पर दया नहीं करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इस पद का रूप है: “उसने किसी को अधर्म करने की आज्ञा नहीं दी, और किसी को पाप करने की छूट नहीं दी।” हिब्रू पाठ में इसके स्थान पर झूठे लोगों को बल न देने, निरर्थक काम करने वाले और भेद खोलने वाले पर दया न करने की बातें हैं।'
    reason: हिब्रू और यूनानी पाठ-परंपराओं के बीच पर्याप्त अंतर है; पाठक के लिए प्रमुख प्राचीन वैकल्पिक साक्ष्य बताना आवश्यक है।
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: किसी मनुष्य
  rationale: यहाँ शब्द सामान्य रूप से मनुष्य को सूचित करता है; नकारात्मक वाक्य में स्वाभाविक हिन्दी के लिए ‘किसी मनुष्य’ उपयुक्त है।
- source_word: לַחֲטֹא
  choice: पाप करने
  rationale: हिब्रू क्रिया का सीधा और प्रचलित धार्मिक अर्थ सुरक्षित रखा गया है।
- source_word: הֶחֱלִים
  choice: बल दिया
  rationale: हिफ़ील रूप को ‘बलवान/समर्थ करना’ के अर्थ में लिया गया है; इससे कठिन हिब्रू पाठ को यूनानी समानांतर के अनुसार बदलकर ‘अनुमति दी’ नहीं बनाया गया।
- source_word: אַנְשֵׁי כָזָב
  choice: झूठे लोगों
  rationale: शाब्दिक रूप से ‘झूठ के लोग’; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: עֹשֶׂה שָׁוְא
  choice: निरर्थक काम करने वाले
  rationale: שָׁוְא में व्यर्थता, खोखलेपन और मिथ्यापन का अर्थक्षेत्र है; ‘निरर्थक’ मूल अस्पष्टता का पर्याप्त अंश बनाए रखता है।
- source_word: מְגַלֶּה סוֹד
  choice: भेद खोलने वाले
  rationale: ‘गुप्त बात प्रकट करने वाला’ का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: क्या परमेश्वर मनुष्य को पाप के लिए आज्ञा या सामर्थ्य देता है
  choice: हिब्रू पाठ के अनुसार ‘आज्ञा नहीं दी’ और ‘झूठे लोगों को बल नहीं दिया’
  alternative: यूनानी के अनुसार ‘किसी को अधर्म करने की आज्ञा नहीं दी और किसी को पाप करने की छूट नहीं दी’
  rationale: मुख्य पाठ के रूप में दिए गए उच्च-विश्वसनीयता वाले हिब्रू साक्ष्य को प्राथमिकता दी गई है; यूनानी का अलग पाठ पादटिप्पणी में सुरक्षित है।
- issue: दया के विषय में कठोर कथन
  choice: ‘दया नहीं करता’ को बिना नरम किए रखा गया
  alternative: इसे अनुशासन, अंतिम न्याय या अपश्चात्तापी व्यक्ति तक सीमित करके समझाना
  rationale: हिब्रू वाक्य स्वयं ऐसी सीमा स्पष्ट नहीं करता; इसलिए उसके धर्मवैचारिक तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भेद खोलना’ बोलचाल में समझ आने वाला है, जबकि ‘पाप’, ‘आज्ञा’ और ‘दया’ बाइबलीय भाव बनाए रखते हैं।
