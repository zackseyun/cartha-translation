  text: She is far from scoffers[a], and men of falsehood will not remember her.
translation:
  language: hi
  text: वह ठट्ठा करने वालों से दूर है,[a] और झूठे लोग उसे याद नहीं करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “वह घमण्ड से दूर है, और झूठे लोग उसे निश्चय ही याद नहीं करेंगे।” जहाँ इब्रानी में “ठट्ठा करने वाले” है, वहाँ यूनानी में “घमण्ड” है; सम्भव है कि यह भिन्न इब्रानी मूल-पाठ या अर्थानुवाद को दर्शाता हो।'
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא
  choice: वह ... से दूर रहती है
  rationale: इब्रानी में शाब्दिक अर्थ ‘वह दूर है’ है। हिन्दी में ‘दूर रहती है’ व्यक्तिरूप में प्रस्तुत बुद्धि और नैतिक दूरी—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִלֵּצִים
  choice: ठट्ठा करनेवालों से
  rationale: לֵצִים उन अहंकारी लोगों को सूचित करता है जो उपहास या तिरस्कार करते हैं। ‘ठट्ठा करनेवाले’ आधुनिक पाठक के लिए स्पष्ट है और इब्रानी पाठ का अनुसरण करता है; यूनानी समानांतर में इसके स्थान पर ‘घमण्ड’ है।
- source_word: וְאַנְשֵׁי כָזָב
  choice: और झूठे लोग
  rationale: शाब्दिक पदबंध ‘झूठ के पुरुष’ है। ‘झूठे लोग’ हिन्दी में स्वाभाविक है और असत्य से पहचाने जानेवाले व्यक्तियों का अर्थ सुरक्षित रखता है।
- source_word: לֹא יִזְכְּרוּהָ
  choice: उसे याद नहीं करेंगे
  rationale: זכר का सामान्य अर्थ याद करना या मन में लाना है। यूनानी μνησθήσονται भी इसी अर्थ की पुष्टि करता है; इसलिए इसे ‘उसका उल्लेख नहीं करेंगे’ नहीं बनाया गया।
- source_word: הִיא / ־הָ
  choice: वह / उसे
  rationale: स्त्रीलिंग सर्वनाम संदर्भ में व्यक्तिरूप में प्रस्तुत बुद्धि की ओर संकेत करते हैं। हिन्दी में ‘वह’ और ‘उसे’ स्वाभाविक हैं; स्त्रीलिंग व्यक्तित्व का संकेत निकटवर्ती संदर्भ से मिलता है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम का अभिप्राय और बुद्धि का व्यक्तिरूप
  choice: वचन को व्यक्तिरूप में प्रस्तुत बुद्धि के विषय में रखकर ‘वह/उसे’ अनूदित किया गया है।
  alternative: ‘यह/इसे’ कहकर बुद्धि को केवल एक निराकार गुण के रूप में प्रस्तुत करना।
  rationale: सिराख 15 के संदर्भ और इब्रानी स्त्रीलिंग रूपों में बुद्धि का व्यक्तिरूप बना रहता है। अनुवाद इस साहित्यिक और धर्मवैचारिक तनाव को सुरक्षित रखता है, पर उससे आगे कोई निजी सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठट्ठा करनेवाले’ ज्ञान-साहित्य की नैतिक तीक्ष्णता को बनाए रखता है; ‘झूठे लोग’ शाब्दिक इब्रानी मुहावरे की तुलना में अधिक स्वाभाविक हिन्दी है।
