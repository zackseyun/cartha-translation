base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: hi
  text: वह उस पर टिकेगा[a] और न डगमगाएगा[b]; वह उसी पर भरोसा रखेगा और लज्जित न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उस’ से अभिप्राय बुद्धि है, जिसे आस-पास के सन्दर्भ में एक स्त्री के रूप में चित्रित किया गया है।
    reason: cross_reference
  - marker: b
    text: या, “और न हिलेगा” अथवा “और न लड़खड़ाएगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “शर्मिन्दा न होगा”; इसका अर्थ यह भी हो सकता है कि उसका भरोसा निष्फल नहीं होगा और उसे निराशा नहीं मिलेगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  choice: वह उस पर टिकेगा
  rationale: שׁען का मूल भाव किसी पर टिकने या सहारा लेने का है। यह अनुवाद ठोस रूपक और भरोसे—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है; स्त्रीलिंग प्रत्यय का संबंध सन्दर्भ में स्त्री के रूप में चित्रित बुद्धि से है।
- source_word: וְלֹא יִמּוֹט
  choice: और न डगमगाएगा
  rationale: מוֹט फिसलने, डगमगाने या अपने स्थान से हिल जाने को व्यक्त करता है। ‘न डगमगाएगा’ व्यक्ति की स्थिरता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וּבָהּ יִבְטַח
  choice: वह उसी पर भरोसा रखेगा
  rationale: בטח का अर्थ भरोसा करना और अपने को सुरक्षित समझना है। ‘उसी पर’ हिब्रू के स्त्रीलिंग सन्दर्भ को बनाए रखते हुए भरोसे के केन्द्र पर स्वाभाविक बल देता है।
- source_word: וְלֹא יֵבוֹשׁ
  choice: और लज्जित न होगा
  rationale: בוש में लज्जित होने के साथ यह भाव भी हो सकता है कि रखा हुआ भरोसा विफल होने पर निराशा या अपमान हाथ लगे। ‘लज्जित न होगा’ मूल का सीधा अर्थ रखता है और अन्य अर्थ को पाद-टिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम का सन्दर्भ
  choice: ‘उस पर/उसी पर’ के द्वारा स्त्री के रूप में चित्रित बुद्धि का सन्दर्भ बनाए रखा गया है।
  alternative: बुद्धि को निर्जीव मानकर ‘इस पर’ कहना।
  rationale: हिब्रू में दोनों प्रत्यय स्त्रीलिंग हैं और निकटवर्ती सन्दर्भ बुद्धि का स्त्री के रूप में मानवीकरण करता है। हिन्दी में ‘उस पर’ व्याकरणतः लिंग को खुलकर नहीं दिखाता, इसलिए पाद-टिप्पणी साहित्यिक मानवीकरण को स्पष्ट करती है, बिना मुख्य पाठ को अस्वाभाविक बनाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘टिकेगा’ सहारे के ठोस रूपक को और ‘डगमगाएगा’ उससे मिलने वाली स्थिरता को बनाए रखता है। समान्तर रचना को अर्धविराम से स्पष्ट किया गया है।
