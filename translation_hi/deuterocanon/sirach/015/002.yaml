translation:
  language: hi
  text: वह माँ की तरह उससे मिलने आएगी और उसकी युवावस्था की पत्नी की तरह[a] उसका स्वागत करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “कौमार्य की स्त्री की तरह,” अर्थात् एक युवा दुल्हन या कुँवारी पत्नी की तरह।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: वह ... उससे मिलने आएगी
  rationale: קדם यहाँ आगे बढ़कर मिलने या अगवानी करने का भाव देता है; यूनानी ὑπαντήσεται भी सक्रिय रूप से मिलने आने की पुष्टि करता है।
- source_word: כָאֵם
  choice: माँ की तरह
  rationale: यह स्पष्ट उपमा है और हिब्रू כָ तथा यूनानी ὡς दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: उसकी युवावस्था की पत्नी की तरह
  rationale: हिब्रू मुहावरा युवावस्था से जुड़ी पत्नी, अर्थात आरम्भिक वैवाहिक स्नेह और निकटता, का संकेत देता है। सम्बन्धसूचक 'उसकी' प्रसंग से स्वाभाविक रूप से स्पष्ट होता है।
- source_word: תְּקַבְּלֶנּוּ
  choice: उसे अपनाएगी
  rationale: קבל का अर्थ ग्रहण करना या स्वीकार करना है। यहाँ वैवाहिक उपमा में 'अपनाएगी' सहज हिन्दी है और स्नेहपूर्ण स्वागत का भाव रखता है।
theological_decisions:
- issue: बुद्धि का स्त्री रूप में मानवीकरण और मातृ/वैवाहिक बिंब
  choice: स्त्रीलिंग व्यक्तित्व को 'वह' तथा स्त्रीलिंग क्रियाओं के साथ बनाए रखा गया।
  alternative: बुद्धि को निर्जीव 'यह' कहकर या बिंब को अमूर्त भाषा में व्यक्त करना।
  rationale: हिब्रू क्रियाएँ स्त्रीलिंग हैं और पद बुद्धि की तुलना स्पष्टतः माँ तथा पत्नी से करता है; इस काव्यात्मक धर्मवैचारिक तनाव को बनाए रखना स्रोत के प्रति निष्ठावान है।
- issue: यूनानी γυνὴ παρθενείας की तुलना में אֵשֶׁת נְעוּרִים का अनुवाद
  choice: मुख्य पाठ में हिब्रू के अनुसार 'उसकी युवावस्था की पत्नी'।
  alternative: कुँवारी पत्नी; युवती दुल्हन।
  rationale: इस पद का हिब्रू पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए मुख्य पाठ में उसकी मुहावरेदार अभिव्यक्ति को प्राथमिकता दी गई; यूनानी का कौमार्य/नववधू-संबंधी संकेत पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण, सहज और काव्यात्मक है। 'मिलने आएगी' बुद्धि की पहल को तथा 'अपनाएगी' स्नेहपूर्ण ग्रहण को व्यक्त करता है।
