base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/009.yaml
  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
translation:
  language: hi
  text: दुष्ट के मुँह में स्तुति शोभा नहीं देती[a], क्योंकि परमेश्वर की ओर से यह उसके हिस्से में नहीं आई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में है, “क्योंकि वह प्रभु की ओर से नहीं भेजी गई।” इब्रानी का अधिक शाब्दिक अर्थ है, “क्योंकि परमेश्वर की ओर से यह उसके हिस्से में नहीं आई है।”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: शोभा नहीं देती
  rationale: यह इब्रानी पदबंध केवल सुंदरता नहीं, बल्कि उपयुक्तता और मर्यादा का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘शोभा नहीं देती’ दोनों अर्थ स्वाभाविक रूप से पहुँचाता है।
- source_word: תְהִלָּה
  choice: स्तुति
  rationale: संदर्भ में यह मुँह से की जाने वाली परमेश्वर की प्रशंसा को सूचित करता है; ‘स्तुति’ संक्षिप्त, प्रतिष्ठित और धार्मिक संदर्भ में सहज है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: यह इब्रानी की ठोस देहात्मक छवि को बनाए रखता है और यूनानी समानांतर ‘मुँह में’ से भी मेल खाता है।
- source_word: רָשָׂע
  choice: दुष्ट
  rationale: इब्रानी शब्द नैतिक रूप से दुष्ट व्यक्ति को दर्शाता है। हिन्दी में संज्ञा के रूप में ‘दुष्ट’ स्वाभाविक है और यूनानी के ‘पापी’ से इब्रानी पाठ का भेद बनाए रखता है।
- source_word: נֶחְלְקָה לּוֹ
  choice: वह उसे ... बाँटी नहीं गई
  rationale: חלק के निष्क्रिय अर्थ में किसी भाग को बाँटने या हिस्से में देने की छवि है। ‘बाँटी नहीं गई’ इस रूपक को सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: מֵאֵל
  choice: परमेश्वर की ओर से
  rationale: מִן का स्रोत-सूचक अर्थ सुरक्षित रहता है। निष्क्रिय हिन्दी वाक्य में ‘परमेश्वर की ओर से’ स्वाभाविक है और केवल कर्तृवाचक ‘परमेश्वर के द्वारा’ की तुलना में मूल के ‘से’ को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: दूसरे अर्धपद में इब्रानी और यूनानी पाठ का संबंध
  choice: 'मुख्य पाठ में इब्रानी अर्थ लिया गया है: स्तुति उसे परमेश्वर की ओर से बाँटी नहीं गई।'
  alternative: 'यूनानी: “क्योंकि वह प्रभु की ओर से नहीं भेजी गई।”'
  rationale: इस पद का उपलब्ध इब्रानी पाठ उच्च-विश्वास वाला प्राथमिक साक्ष्य है और ‘हिस्से में बाँटने’ की सुसंगत छवि देता है। यूनानी संभवतः भिन्न आधार-पाठ या व्याख्यात्मक अनुवाद को दर्शाता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘शोभा नहीं देती’ उपयुक्तता और नैतिक असंगति दोनों को सहज रूप से व्यक्त करता है; ‘मुँह में’ और ‘बाँटी’ मूल इब्रानी की प्रमुख छवियाँ बनाए रखते हैं।
