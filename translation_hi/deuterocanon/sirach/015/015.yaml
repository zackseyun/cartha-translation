base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: hi
  text: यदि तुम चाहो, तो आज्ञा का पालन करोगे[a], और उसकी इच्छा पूरी करने की समझ पाओगे[b]। यदि तुम उस पर भरोसा रखो[c], तो तुम भी जीवित रहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘आज्ञा’ एकवचन है; यूनानी समानांतर में ‘आज्ञाएँ’ बहुवचन है।
    reason: textual_variant
  - marker: b
    text: 'इब्रानी का यह खंड कठिन है। यूनानी समानांतर का आशय लगभग यह है: ‘और विश्वासयोग्यता से काम करना तुम्हारी प्रसन्न इच्छा का विषय है।’ यह सम्भवतः किसी भिन्न इब्रानी मूल-पाठ या व्याख्यात्मक अनुवाद को दर्शाता है।'
    reason: alternative_reading
  - marker: c
    text: या, ‘यदि तुम उस पर विश्वास करो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: यदि तुम चाहो
  rationale: חפץ इच्छा या तत्परता व्यक्त करता है। यह अनुवाद शर्त और मानवीय संकल्प—दोनों को बनाए रखता है, पर इसे दार्शनिक अर्थ में स्वतंत्र इच्छा का दावा नहीं बनाता।
- source_word: תִּשְׁמֹר מִצְוָה
  choice: आज्ञा का पालन करोगे
  rationale: इब्रानी में מִצְוָה एकवचन है। हिन्दी में ‘आज्ञा का पालन करना’ स्वाभाविक है और שמר के सावधानी से मानने के भाव को व्यक्त करता है।
- source_word: וְתָבִינָה לַעֲשׂוֹת רְצוֹנוֹ
  choice: और उसकी इच्छा पूरी करने की समझ पाओगे
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिक रखते हुए תבינה को בין से ‘समझ पाओगे’ और לעשות רצונו को ‘उसकी इच्छा पूरी करने’ के रूप में लिया गया है। वाक्यांश कठिन है, इसलिए पाठ में सहज किन्तु अनिर्णायक अर्थ रखा गया और यूनानी समानांतर को पादटिप्पणी में बताया गया है।
- source_word: אִם תַּאֲמִין בּוֹ
  choice: यदि तुम उस पर भरोसा रखो
  rationale: אמן के साथ ב किसी व्यक्ति पर विश्वास या भरोसा रखने का संबंधपरक भाव देता है। ‘भरोसा रखो’ आधुनिक हिन्दी में स्वाभाविक है; ‘विश्वास करो’ भी सम्भव है।
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: तो तुम भी जीवित रहोगे
  rationale: ‘भी’ גַּם אַתָּה के बलाघात और सम्बोधित व्यक्ति के समावेश को सुरक्षित रखता है। תִּחְיֶה का सीधा अर्थ ‘जीवित रहोगे’ है।
theological_decisions:
- issue: मानवीय इच्छा और आज्ञापालन का संबंध
  choice: 'शर्तात्मक और इच्छापरक कथन: ‘यदि तुम चाहो, तो ... पालन करोगे’'
  alternative: ‘यदि तुम चुनो, तो आज्ञाओं का पालन कर सकते हो’
  rationale: मूल पाठ मानवीय उत्तरदायित्व पर बल देता है, पर ‘कर सकते हो’ जोड़ने से सामर्थ्य और स्वतंत्र इच्छा के विषय में मूल से अधिक स्पष्ट दार्शनिक दावा हो जाता।
- issue: कठिन मध्य खंड में इब्रानी और यूनानी का तनाव
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘उसकी इच्छा पूरी करने की समझ पाओगे’
  alternative: यूनानी के आधार पर ‘विश्वासयोग्यता से काम करना तुम्हारी प्रसन्न इच्छा पर निर्भर है’
  rationale: इब्रानी पाठ उपलब्ध और उच्च-विश्वास वाला है, इसलिए उसे मुख्य आधार बनाया गया। यूनानी में πίστιν ποιῆσαι εὐδοκίας भिन्न या व्याख्यात्मक पाठ दर्शाता है; उस भिन्नता को चुपचाप मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया।
- issue: אמן ב का संबंधपरक अर्थ
  choice: ‘उस पर भरोसा रखो’
  alternative: ‘उस पर विश्वास करो’
  rationale: दोनों अर्थ सम्भव हैं। ‘भरोसा’ व्यक्ति की ओर उन्मुख संबंधपरक अर्थ को उभारता है, जबकि पादटिप्पणी पाठक को ‘विश्वास’ वाला समान रूप देती है; किसी विशेष सम्प्रदायगत विश्वास-सिद्धान्त को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘तुम’ सामान्य पाठक के लिए स्वाभाविक है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘आज्ञा’, ‘इच्छा’, ‘समझ’ और ‘जीवित’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं।
