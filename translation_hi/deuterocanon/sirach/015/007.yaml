  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: hi
  text: झूठे लोग उसे प्राप्त नहीं करेंगे[a][b], और धृष्ट लोग उसे नहीं देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “झूठ के लोग” है; यूनानी समानांतर में “निर्बुद्धि लोग” है। यह किसी भिन्न मूलपाठ या व्याख्यात्मक अनुवाद को दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: हिब्रू क्रिया को शाब्दिक रूप से पढ़ने पर “उसे मार्ग दिखाएँगे” अर्थ निकल सकता है, जो यहाँ कठिन है। यूनानी समानांतर “उसे पा लेना” या “प्राप्त करना” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: उसे प्राप्त नहीं करेंगे
  rationale: דרך का हिफ़ील रूप सामान्यतः ‘मार्ग दिखाना/चलाना’ अर्थ दे सकता है, पर यहाँ प्रज्ञा को कर्म बनाकर वह अर्थ कठिन है। समानांतर यूनानी καταλήμψονται ‘पा लेना/प्राप्त करना/पकड़ पाना’ अर्थ का समर्थन करता है; इसलिए संदर्भानुकूल ‘प्राप्त नहीं करेंगे’ चुना गया।
- source_word: מְתֵי שָׁוְא
  choice: झूठ के लोग
  rationale: מְתֵי का अर्थ ‘लोग/मनुष्य’ और שָׁוְא का अर्थ ‘झूठ, मिथ्यापन, व्यर्थता’ हो सकता है। ‘झूठ के लोग’ हिब्रू की संबंधवाचक संरचना और नैतिक आशय दोनों को बनाए रखता है।
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: और ढिठाई करनेवाले
  rationale: זָדוֹן में घमंड, उद्दंडता और धृष्ट विद्रोह का भाव है। सहज आधुनिक हिन्दी में ‘ढिठाई करनेवाले’ इस सक्रिय नैतिक गुण को व्यक्त करता है, जबकि केवल ‘दुष्ट’ कहना अर्थ को अधिक सामान्य बना देता।
- source_word: לֹא יִרְאוּהָ
  choice: उसे नहीं देखेंगे
  rationale: ראה का सीधा अर्थ ‘देखना’ है और यूनानी समानांतर भी इसी अर्थ की पुष्टि करता है। सम्भावित ‘पहचानना/समझना’ भाव को स्पष्ट करके मूल की अर्थ-व्याप्ति सीमित नहीं की गई।
theological_decisions:
- issue: पहले खंड के कठिन हिब्रू क्रिया-रूप को यूनानी समानांतर के प्रकाश में प्रस्तुत करना
  choice: हिब्रू के ‘झूठ के लोग’ को प्राथमिक रखते हुए क्रिया का अर्थ ‘प्राप्त करना’ लिया गया।
  alternative: ‘झूठ के लोग उसका मार्ग नहीं दिखाएँगे’ अथवा यूनानी के अनुसार ‘निर्बुद्धि लोग उसे नहीं पा सकेंगे।’
  rationale: जहाँ हिब्रू पाठ उपलब्ध है, उसे आधार बनाया गया है; किंतु यहाँ क्रिया का सामान्य हिफ़ील अर्थ संदर्भ में असंगत लगता है। यूनानी समानांतर स्पष्ट करता है कि बात प्रज्ञा को पा सकने की है। इस प्रकार अनुवाद हिब्रू पर आधारित और यूनानी से सूचित है, तथा पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप रखा गया है। प्रज्ञा के लिए स्त्रीलिंग सर्वनाम ‘उसे’ संदर्भानुसार सुरक्षित है। ‘झूठ के लोग’ मूल हिब्रू मुहावरे के निकट है और ‘ढिठाई करनेवाले’ זָדוֹן की उद्दंडता को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
