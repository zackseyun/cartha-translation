translation:
  language: hi
  text: जो यहोवा का भय मानता है, वह ऐसा करेगा; और जो व्यवस्था[a] को थामे रहता है, वह उसे[b] पा लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी תּוֹרָה का अनुवाद ‘तोरा’ या, अधिक व्यापक अर्थ में, ‘शिक्षा’ अथवा ‘निर्देश’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसे’ संदर्भ में स्त्रीरूप में व्यक्त ज्ञान की ओर संकेत करता है। प्राप्त इब्रानी पाठ का अंतिम क्रिया-रूप कठिन है; यूनानी समानांतर का अर्थ ‘उसे प्राप्त करेगा’ है और इसी अर्थ का समर्थन करता है। इब्रानी रूप को अधिक शाब्दिक रूप से लेने पर ‘वह उसे मार्ग दिखाएगा’ जैसा अर्थ निकल सकता है, पर वह इस संदर्भ में कठिन है।
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: जो यहोवा का भय मानता है
  rationale: इब्रानी कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है—‘जो भय मानता है।’ परमेश्वर के व्यक्तिवाचक नाम को ‘यहोवा’ रखने से मूल पाठ का भेद सुरक्षित रहता है।
- source_word: יַעֲשֶׂה זֹאת
  choice: वह ऐसा करेगा
  rationale: स्त्रीलिंग एकवचन संकेतवाचक का सीधा, स्वाभाविक हिन्दी रूप; संदर्भ को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- source_word: וְתוֹפֵשׂ תּוֹרָה
  choice: और जो व्यवस्था को थामे रहता है
  rationale: תפש में दृढ़ता से पकड़ने का ठोस बिंब है। ‘थामे रहता है’ निरंतर निष्ठा का भाव देता है; תורה के लिए ‘व्यवस्था’ यूनानी νόμος और यहूदी प्रज्ञा-संदर्भ के अनुकूल है।
- source_word: יַדְרִיכֶנָּה
  choice: वह उसे पा लेगा
  rationale: प्राप्त इब्रानी रूप कठिन है। यूनानी समानांतर καταλήμψεται αὐτήν ‘उसे पा लेगा/प्राप्त करेगा’ अर्थ का समर्थन करता है; स्त्रीलिंग ‘उसे’ संदर्भ में व्यक्तिरूप ज्ञान की ओर संकेत करता है।
theological_decisions:
- issue: अंतिम स्त्रीलिंग कर्म का संदर्भ
  choice: ‘उसे’—अर्थात संदर्भ में व्यक्तिरूप ज्ञान
  alternative: इसे व्यवस्था-पालन के फल की अमूर्त प्राप्ति माना जा सकता है, या कठिन इब्रानी रूप के आधार पर मार्गदर्शन का भाव लिया जा सकता है।
  rationale: सिराख 14:20–15:10 में ज्ञान का स्त्री के रूप में मानवीकरण है और यूनानी पाठ में स्पष्ट स्त्रीलिंग सर्वनाम है। मुख्य पाठ में ‘उसे’ रखने से संबंध सुरक्षित रहता है, पर ‘ज्ञान’ जोड़कर अस्पष्टता पूरी तरह समाप्त नहीं की जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक रूप। ‘व्यवस्था’ सामान्य पाठक के लिए सहज है, जबकि पकड़ने के रूपक को ‘थामे रहता है’ से बनाए रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
