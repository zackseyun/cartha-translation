  text: Do not say[b][a], “He made me stumble,” for he has no need of violent men.
translation:
  language: hi
  text: यह मत कहना[a][b], “उसने मुझे ठोकर खिलाई,” क्योंकि उसे हिंसक लोगों की कोई आवश्यकता नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “उसने मुझे भटका दिया,” जिसका अर्थ इब्रानी के “मुझे ठोकर खिलाई” से अधिक व्यापक है।'
    reason: alternative_reading
  - marker: b
    text: यूनानी समानांतर पाठ में इब्रानी के “हिंसक लोगों” के स्थान पर “पापी मनुष्य” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: यह मत कहना
  rationale: ज्ञान-साहित्य की निषेधात्मक चेतावनी को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: उसी ने
  rationale: सर्वनाम का संकेत प्रसंग में परमेश्वर की ओर है; ‘उसी’ आरोप के बल को व्यक्त करता है, बिना नाम जोड़े।
- source_word: הִתְקִילָנִי
  choice: मुझे ठोकर खिलाई
  rationale: इब्रानी की ठोकर लगवाने की ठोस उपमा को सुरक्षित रखता है; यूनानी का अर्थ अधिक व्यापक, ‘भटका दिया,’ है।
- source_word: כִּי אֵין צֹרֶךְ
  choice: क्योंकि उसे ... कोई आवश्यकता नहीं है
  rationale: कारणसूचक सम्बन्ध और ‘आवश्यकता न होना’ दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: בְּאַנְשֵׁי חָמָס
  choice: हिंसक लोगों की
  rationale: חָמָס के हिंसा अथवा हिंसक अन्याय के विशिष्ट भाव को बनाए रखता है; इसे सामान्य ‘पापी’ नहीं बनाता।
theological_decisions:
- issue: क्या परमेश्वर पर लगाए जाने वाले आरोप को इब्रानी के अनुसार ‘ठोकर खिलाई’ या यूनानी के अनुसार ‘भटका दिया’ कहा जाए
  choice: उसी ने मुझे ठोकर खिलाई
  alternative: उसने मुझे भटका दिया
  rationale: उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ को मुख्य पाठ में प्राथमिकता दी गई है; यूनानी की व्यापक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- issue: क्या חָמָס को विशिष्ट ‘हिंसक लोग’ या यूनानी के अनुसार सामान्य ‘पापी मनुष्य’ कहा जाए
  choice: हिंसक लोग
  alternative: पापी मनुष्य
  rationale: इब्रानी साक्ष्य हिंसक अन्याय की अधिक विशिष्ट नैतिक श्रेणी देता है; यूनानी पाठ का भिन्न अर्थ पाठकीय जानकारी के लिए पादटिप्पणी में रखा गया है।
