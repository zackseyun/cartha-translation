base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/013.yaml
  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: hi
  text: यहोवा बुराई और घृणित बात से घृणा करता है, और जो उसका भय मानते हैं, उन्हें वह ऐसा करने नहीं देता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “प्रभु हर घृणित वस्तु से घृणा करता है, और जो उसका भय मानते हैं, उन्हें वह प्रिय या स्वीकार्य नहीं है।” इब्रानी पाठ में इसके बजाय है: “और जो उसका भय मानते हैं, उन्हें वह ऐसा करने नहीं देता।”'
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  choice: बुराई
  rationale: תּוֹעֵבָה के साथ प्रयुक्त होने के कारण यहाँ विपत्ति नहीं, बल्कि नैतिक बुराई अभिप्रेत है।
- source_word: וְתוֹעֵבָה
  choice: और घृणित बात
  rationale: यह परमेश्वर की दृष्टि में अत्यंत घिनौनी या निंदनीय वस्तु अथवा आचरण को व्यक्त करता है; ‘घृणित बात’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी प्रबलता बनाए रखता है।
- source_word: שָׂנֵא
  choice: से घृणा करता है
  rationale: सूक्तिपरक सामान्य सत्य को हिन्दी में स्वाभाविक वर्तमान काल में व्यक्त किया गया है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: וְלֹא יְאַנֶּנָּה
  choice: उन्हें वह ऐसा करने की अनुमति नहीं देता
  rationale: इब्रानी पाठ के अनुमति न देने वाले भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘ऐसा करने’ का संकेत पूर्वोक्त बुराई और घृणित बात की ओर है; यूनानी पाठ का भिन्न अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לִירֵאָיו
  choice: जो उसका भय मानते हैं
  rationale: यह बाइबलीय अभिव्यक्ति केवल आतंक नहीं, बल्कि परमेश्वर के प्रति श्रद्धापूर्ण भय और निष्ठा को दर्शाती है।
theological_decisions:
- issue: दूसरे खंड में उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ का अंतर
  choice: 'मुख्य पाठ में इब्रानी का भाव: ‘उन्हें वह ऐसा करने की अनुमति नहीं देता’'
  alternative: 'यूनानी: ‘और जो उसका भय मानते हैं, उन्हें वह प्रिय/स्वीकार्य नहीं है’'
  rationale: सिराख का उपलब्ध और उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य मुख्य आधार है। यूनानी पाठ में विधेय अलग है, इसलिए उसके पाठार्थ को बिना मिलाए पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘घृणित बात’ प्रबल नैतिक अर्थ बनाए रखता है, जबकि दूसरे खंड को अत्यधिक शाब्दिक और अस्वाभाविक हिन्दी से बचाते हुए इब्रानी के अनुमति-संबंधी भाव में रखा गया है।
