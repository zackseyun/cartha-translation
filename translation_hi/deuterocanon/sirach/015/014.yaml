base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: hi
  text: परमेश्वर ने आरम्भ से मनुष्य[a] को रचा और उसे उसके अपने अधिकार[b] में रख दिया; उसने उसे उसकी अपनी प्रवृत्ति के हाथ में सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ समस्त मानवजाति का प्रतिनिधि भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू शब्द कठिन और अनिश्चित है। अधिक शाब्दिक रूप में: ‘उसे उसके अपने छीनने वाले/हिंसक बल के हाथ में रख दिया।’ यूनानी में है: ‘उसे उसके अपने विचार-विमर्श के हाथ में छोड़ दिया।’'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּרֵאשִׁית
  choice: आरम्भ से
  rationale: מִן के साथ רֵאשִׁית का स्वाभाविक कालगत अर्थ ‘आरम्भ से’ है; यूनानी ἐξ ἀρχῆς भी इसकी पुष्टि करता है।
- source_word: בָּרָא
  choice: रचा
  rationale: परमेश्वर के सृजन-कर्म के लिए ברא का सीधा और गरिमापूर्ण हिन्दी रूप ‘रचा’ है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन אָדָם यहाँ समस्त मानवजाति का प्रतिनिधि हो सकता है; ‘मनुष्य’ एकवचन और सामूहिक दोनों अर्थों को स्वाभाविक रूप से रखता है।
- source_word: וַיְשִׁיתֵהוּ בְּיַד חוֹתְפוֹ
  choice: उसे उसके अपने वश में छोड़ दिया
  rationale: यह हिब्रू वाक्यांश पाठगत और अर्थगत रूप से कठिन है। ‘अपने वश में’ आत्म-दिशा का व्यापक भाव रखता है, जबकि ‘छोड़ दिया’ यूनानी ἀφῆκεν से समर्थित है; पादटिप्पणी अधिक शाब्दिक कठिन पाठ बताती है।
- source_word: וַיִּתְּנֵהוּ בְּיַד יִצְרוֹ
  choice: उसे उसकी अपनी प्रवृत्ति के हाथ में सौंप दिया
  rationale: נתן ביד सौंपे जाने या अधिकार में दिए जाने का भाव रखता है। יצר ज्ञान-साहित्य में मन की प्रवृत्ति या झुकाव को दर्शा सकता है; ‘प्रवृत्ति’ अनावश्यक रूप से उसे केवल बुरा नहीं ठहराती।
theological_decisions:
- issue: मानवीय नैतिक अभिकरण
  choice: परमेश्वर सृष्टिकर्ता है, फिर भी मनुष्य को उसके अपने वश और प्रवृत्ति के अधीन छोड़े जाने की बात कही गई है।
  alternative: इसे पूर्ण स्वायत्त इच्छा या विशेष रूप से केवल बुरी प्रवृत्ति का सिद्धान्त मानना।
  rationale: हिब्रू और यूनानी दोनों मानवीय आत्म-दिशा की ओर संकेत करते हैं, पर कठिन हिब्रू शब्द חוֹתְפוֹ उसका ठीक स्वरूप अनिश्चित छोड़ता है। अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘वश में’ और ‘हाथ में’ से अधिकार तथा आत्म-दिशा का बिंब रखा गया है; कठिन हिब्रू को मुख्य पाठ में अतिशय निश्चित न करके पादटिप्पणी में स्पष्ट किया गया है।
