  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: hi
  text: वह उसे उसके साथियों से ऊँचा उठाएगी[a], और सभा के बीच उसका मुँह खोलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके साथी से ऊँचा”; इब्रानी में एकवचन रूप है, जबकि यूनानी समानांतर व्यापक बहुवचन अर्थ, “उसके निकटवर्ती जनों/साथियों,” को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: वह उसे ऊँचा उठाएगी
  rationale: רומם का अर्थ ऊँचा उठाना या प्रतिष्ठित करना है। यह चयन वास्तविक ऊँचाई और सार्वजनिक सम्मान—दोनों भावों को बनाए रखता है; यूनानी ὑψώσει भी इसकी पुष्टि करता है।
- source_word: מֵרֵעֵהוּ
  choice: उसके साथियों से
  rationale: इब्रानी רֵעַ यहाँ एकवचन रूप में है, पर सामूहिक अर्थ दे सकता है। यूनानी समानांतर में बहुवचन ‘उसके निकटवर्ती जन’ है; ज्ञान-साहित्य के इस सामाजिक प्रसंग में ‘साथियों’ स्वाभाविक है।
- source_word: וּבְתוֹךְ קָהָל
  choice: सभा के बीच
  rationale: यह सार्वजनिक रूप से एकत्र समुदाय के मध्य होने का सीधा स्थानवाचक भाव रखता है। ‘सभा’ קָהָל के लिए तटस्थ और व्यापक आधुनिक हिन्दी शब्द है।
- source_word: תִּפְתַּח פִּיו
  choice: उसका मुँह खोलेगी
  rationale: इब्रानी और यूनानी दोनों की ठोस उक्ति को केवल ‘उसे बोलने देगी’ बनाकर संक्षिप्त नहीं किया गया। इससे सभा में बोलने का अवसर और सामर्थ्य मिलने का भाव बना रहता है।
theological_decisions:
- issue: क्रियाओं का कर्ता
  choice: 'स्त्रीलिंग क्रियाओं द्वारा ज्ञान को संभावित कर्ता के रूप में रखा गया है: ‘उठाएगी… खोलेगी।’'
  alternative: कर्ता को परमेश्वर मानकर पुल्लिंग ‘उठाएगा… खोलेगा’ किया जा सकता है।
  rationale: इस पद में कर्ता का संज्ञा-रूप से उल्लेख नहीं है, पर इब्रानी क्रियारूप स्त्रीलिंग कर्ता से मेल खाते हैं और निकटवर्ती प्रसंग में ज्ञान स्त्रीलिंग कर्ता है। हिन्दी में क्रिया का लिंग छिपाया नहीं जा सकता, इसलिए स्रोत और प्रसंग के अनुसार स्त्रीलिंग रखा गया है, बिना ज्ञान और परमेश्वर के संबंध को अतिरिक्त रूप से परिभाषित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह खोलेगी’ स्रोत की सजीव उक्ति को सुरक्षित रखता है, जबकि ‘सभा’ अनावश्यक रूप से किसी विशिष्ट धार्मिक संस्था का अर्थ नहीं जोड़ता।
