  yaml_path: translation/deuterocanon/sirach/015/017.yaml
  text: Before human beings are life and death[b][a], and whichever he chooses will be given to him.
translation:
  language: hi
  text: मनुष्यों के सामने जीवन और मृत्यु हैं,[a] और जिसे वह चाहेगा, वही उसे दिया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्यों के लिए जीवन और मृत्यु हैं”; इब्रानी संबंधबोधक उपसर्ग का यह अर्थ भी संभव है, पर यूनानी समानांतर “मनुष्यों के सामने” अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या, “और जो कुछ वह चाहेगा, उसे दिया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के सामने
  rationale: इब्रानी में शाब्दिक अर्थ ‘मनुष्यों के लिए/को’ संभव है, पर यूनानी समानांतर ἔναντι ἀνθρώπων विकल्पों को मनुष्यों के सामने रखे होने का भाव स्पष्ट करता है।
- source_word: חַיִּים וָמָוֶת
  choice: जीवन और मृत्यु
  rationale: यह दोनों परस्पर विपरीत विकल्पों का सीधा और स्वाभाविक अनुवाद है; इब्रानी का बहुवचन חַיִּים हिन्दी में मुहावरे के अनुसार एकवचन ‘जीवन’ है।
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: जिसे चाहेगा
  rationale: חפץ इच्छा, प्रसन्नता और चयन की ओर संकेत करता है। ‘जिसे चाहेगा’ इच्छा के मूल भाव को बनाए रखते हुए इस प्रसंग में विकल्प चुनने का आशय भी व्यक्त करता है।
- source_word: יִנָּתֵן לוֹ
  choice: वही उसे दिया जाएगा
  rationale: इब्रानी की कर्मवाच्य रचना सुरक्षित रखी गई है और अनकहे कर्ता को अनुवाद में निर्दिष्ट नहीं किया गया। ‘वही’ चुने हुए विकल्प से संबंध स्पष्ट करता है।
theological_decisions:
- issue: मानवीय नैतिक चुनाव और कर्मवाच्य प्रतिफल
  choice: जीवन और मृत्यु को मनुष्यों के सामने उपस्थित विकल्पों के रूप में कहना और इच्छित विकल्प के दिए जाने की बात को कर्मवाच्य में रखना
  alternative: स्वतंत्र इच्छा को अधिक प्रबल बनाना, अथवा देने वाले के रूप में परमेश्वर को स्पष्ट रूप से जोड़ना
  rationale: मूल पाठ मानवीय इच्छा और मिलने वाले परिणाम को जोड़ता है, पर ईश्वरीय प्रभुता तथा मानवीय स्वतंत्रता का संबंध नहीं समझाता। अनुवाद इस तनाव को अनिर्णीत रखता है।
- issue: सामूहिक בני אדם से एकवचन क्रिया और सर्वनाम की ओर बदलाव
  choice: ‘मनुष्यों’ के बाद ‘वह…उसे’ के द्वारा सामान्य एकवचन बनाए रखना
  alternative: 'पूरे वाक्य को बहुवचन में कर देना: ‘वे जिसे चाहेंगे, वही उन्हें दिया जाएगा’'
  rationale: यह मूल के सामूहिक आरंभ और उसके बाद आने वाले सामान्य एकवचन के व्याकरणिक बदलाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘मनुष्यों’ सामूहिक मानवता को व्यक्त करता है; अगले खंड का सामान्य एकवचन मूल की संरचना को बनाए रखता है।
