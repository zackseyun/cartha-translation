base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/018.yaml
  text: For the wisdom of Yahweh is abundant[a]; he is mighty in power and sees all things.
translation:
  language: hi
  text: क्योंकि यहोवा की बुद्धि अपार है[a]; वह अत्यन्त सामर्थी है और सब कुछ देखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी סָפְקָה का अर्थ ‘पर्याप्त है’ या ‘उसने उपलब्ध कराया है’ भी हो सकता है; यूनानी समानांतर में ‘बहुत/महान’ है, जो यहाँ ‘अपार है’ अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקָה
  choice: अपार है
  rationale: यह इब्रानी रूप पर्याप्तता या प्रचुरता का भाव दे सकता है। यहाँ ‘यहोवा की बुद्धि’ के साथ और यूनानी πολλὴ (‘बहुत/महान’) के समर्थन से ‘अपार है’ स्वाभाविक रूप से प्रचुरता और महानता व्यक्त करता है।
- source_word: חָכְמַת
  choice: बुद्धि
  rationale: חכמה का मानक और प्रसंगानुकूल हिन्दी रूप ‘बुद्धि’ है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम आया है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: सामर्थ्य में महान
  rationale: אַמִּיץ शक्ति और पराक्रम का सूचक है, जबकि גְּבוּרוֹת सामर्थ्य अथवा शक्तिशाली कार्यों को दर्शा सकता है। यूनानी समानांतर ἰσχυρὸς ἐν δυναστείᾳ यहाँ अमूर्त ‘सामर्थ्य’ का समर्थन करता है।
- source_word: וְחוֹזֶה כֹל
  choice: और सब कुछ देखता है
  rationale: חזה का अर्थ ‘देखना/निहारना’ है और כֹל व्यापकता बताता है; यह हिन्दी अभिव्यक्ति परमेश्वर की सर्वव्यापी दृष्टि को सरल और ठीक ढंग से व्यक्त करती है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में टेट्राग्राम सीधे उपस्थित है। ‘यहोवा’ नाम को विशिष्ट नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि के रूप में प्रस्तुत करता।
- issue: וְחוֹזֶה כֹל में दिव्य दृष्टि की व्यापकता
  choice: सब कुछ देखता है
  alternative: सबको देखता है
  rationale: כֹל का व्यापक अर्थ व्यक्त करते हुए ‘सब कुछ’ व्यक्तियों तक सीमित न रहकर समस्त वस्तुओं और घटनाओं को समेटता है; इससे कोई अतिरिक्त व्यवस्थित धर्मवैज्ञानिक शब्द नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक-सूक्तिपरक रखी गई है। ‘अपार’ संक्षिप्त रूप में बुद्धि की प्रचुरता व्यक्त करता है; अर्धविराम पद के दो संबद्ध कथनों को स्पष्ट करता है।
