translation:
  language: hi
  text: बुद्धिमान के मुँह से स्तुति कही जाती है, और जो उस पर अधिकार रखता है, वह उसे सिखाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “और प्रभु उसे सफल करेगा।” वहाँ सर्वनाम का संकेत किसी व्यक्ति की ओर, या संभवतः स्तुति की ओर, समझा जा सकता है। यह उपलब्ध इब्रानी की दूसरी पंक्ति से काफी भिन्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה חָכָם
  choice: बुद्धिमान के मुँह से
  rationale: בְּפֶה में ב साधन अथवा वाणी के निकलने के क्षेत्र को सूचित कर सकता है। हिन्दी में ‘मुँह से’ स्वाभाविक है और मूल बिंब बनाए रखता है। חָכָם एकवचन में सामान्य वर्ग-प्रतिनिधि है, इसलिए ‘बुद्धिमान’ उपयुक्त है।
- source_word: תֵּאָמֵר תְּהִלָּה
  choice: स्तुति कही जाती है
  rationale: निफ़अल अपूर्ण रूप को नीतिवचन-सदृश सामान्य वर्तमान में लिया गया है। תְּהִלָּה के लिए ‘स्तुति’ संक्षिप्त और प्रसंगानुकूल है; यूनानी αἶνος भी इसी अर्थ का समर्थन करता है।
- source_word: וּמשֵׁל בָּהּ
  choice: और जो उस पर अधिकार रखता है
  rationale: משל को शासन या अधिकार रखने के अर्थ में लिया गया है। בָּהּ का स्त्रीलिंग प्रत्यय निकटतम स्त्रीलिंग संज्ञा ‘स्तुति’ की ओर संकेत कर सकता है, पर उसका संदर्भ पूरी तरह स्पष्ट नहीं है; ‘उस पर’ इस संक्षिप्तता और कुछ अस्पष्टता को बनाए रखता है।
- source_word: יִלַמְּדֶנָּה
  choice: वह उसे सिखाएगा
  rationale: למד का मूल अर्थ ‘सिखाना’ है और स्त्रीलिंग कर्म-प्रत्यय को ‘उसे’ से व्यक्त किया गया है। भविष्यसूचक रूप मूल के अपूर्ण क्रियारूप को निकटता से दर्शाता है।
theological_decisions:
- issue: इब्रानी दूसरी पंक्ति और यूनानी समानांतर पाठ का संबंध
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी का अनुसरण: ‘और जो उस पर अधिकार रखता है, वह उसे सिखाएगा।’'
  alternative: 'यूनानी समानांतर: ‘और प्रभु उसे सफल करेगा,’ जहाँ सर्वनाम का संकेत ‘उसे/उसको’ दोनों तरह समझा जा सकता है।'
  rationale: इस पद का इब्रानी पाठ उपलब्ध, उच्च-विश्वसनीय और सत्यापित है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी दूसरी पंक्ति एक उल्लेखनीय भिन्न पाठ-परंपरा दिखाती है; उसे पादटिप्पणी में सुरक्षित रखा गया है, न कि चुपचाप इब्रानी में मिला दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, संक्षिप्त नीतिवचनात्मक रूप। ‘अधिकार रखता है’ मूल משל की शासन/नियंत्रण-संबंधी शक्ति को ‘निपुण’ जैसे अधिक व्याख्यात्मक शब्द के बिना व्यक्त करता है। पादटिप्पणी-चिह्न को पद के अंत में रखा गया है क्योंकि वह पूरी दूसरी पंक्ति के वैकल्पिक यूनानी पाठ से संबंधित है।
