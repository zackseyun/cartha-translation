  text: Fire and water are set before you; whichever you choose[a], stretch out your hand to it.
translation:
  language: hi
  text: तुम्हारे सामने आग और पानी रखे हैं[a]; जिसे तुम चाहो, उसकी ओर अपना हाथ बढ़ाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में आरम्भिक शब्द (מוּצָק) का रूप असामान्य है। ‘रखे हैं’ का अर्थ समानांतर यूनानी पाठ—‘उसने तुम्हारे सामने रखा है’—से समर्थित है।
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק
  choice: रखे गए हैं
  rationale: इब्रानी रूप असामान्य है, पर לְפָנֶיךָ और यूनानी παρέθηκέν σοι के साथ इसका आशय सामने प्रस्तुत या रखा जाना है। बहुवचन क्रिया ‘आग और पानी’ दोनों के साथ स्वाभाविक हिन्दी देती है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे सामने
  rationale: स्थानवाचक अर्थ को सीधी और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֵשׁ וָמָיִם
  choice: आग और पानी
  rationale: इब्रानी के ठोस परस्पर-विरोधी चित्र को ज्यों का त्यों बनाए रखता है; यूनानी समानांतर भी इसकी पुष्टि करता है।
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: जिसकी तुम इच्छा करो
  rationale: חפץ का मूल भाव इच्छा या चाह है। यह अनुवाद चयन की वास्तविकता को बनाए रखते हुए स्रोत से अधिक स्पष्ट अर्थ ‘चुनना’ आरोपित नहीं करता।
- source_word: שְׁלַח יָדֶיךָ
  choice: उसकी ओर अपना हाथ बढ़ाओ
  rationale: यह मुहावरा किसी वस्तु की ओर हाथ फैलाने का संकेत देता है। हिन्दी में एकवचन ‘हाथ’ यूनानी χεῖρά σου से भी समर्थित है; ‘उसकी ओर’ संदर्भगत लक्ष्य को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: मानवीय नैतिक अभिकर्तृत्व
  choice: विकल्पों को सचमुच मनुष्य के सामने रखा गया और उसे अपनी इच्छा के अनुसार हाथ बढ़ाने को कहा गया है।
  alternative: ऐसा नियतिवादी निर्वचन जो आज्ञा और इच्छा की वास्तविक शक्ति को कम कर दे।
  rationale: इब्रानी और यूनानी दोनों विकल्पों की प्रस्तुति और मनुष्य की इच्छापूर्ण प्रतिक्रिया को सीधे व्यक्त करते हैं। अनुवाद इस तनाव को बिना किसी बाद की धर्मवैज्ञानिक शर्त जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिसकी तुम इच्छा करो’ स्रोत की इच्छा-संबंधी शब्दावली और उसकी वास्तविक नैतिक चुनौती को सुरक्षित रखता है।
