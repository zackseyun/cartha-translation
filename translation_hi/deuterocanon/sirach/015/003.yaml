  yaml_path: translation/deuterocanon/sirach/015/003.yaml
  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
translation:
  language: hi
  text: वह उसे समझ की रोटी खिलाएगी[a] और विवेक का जल पिलाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में ‘वह’ व्यक्तिरूप में प्रस्तुत बुद्धि है; हिब्रू की क्रिया स्त्रीलिंग एकवचन है।
    reason: contextual_clarification
  - marker: b
    text: यूनानी समानांतर में यहाँ ‘बुद्धि का जल’ है, जबकि हिब्रू पाठ में ‘विवेक का जल’ है। यहाँ हिब्रू पाठ को प्राथमिकता दी गई है।
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: वह उसे ... खिलाएगी
  rationale: अכל के हिफ़ील रूप का अर्थ ‘खिलाना’ है। हिब्रू क्रिया स्त्रीलिंग एकवचन है और संदर्भ में इसका कर्ता व्यक्तिरूप में प्रस्तुत ‘बुद्धि’ है; इसलिए हिन्दी में स्त्रीलिंग ‘खिलाएगी’ स्वाभाविक और स्रोत-संगत है।
- source_word: לֶחֶם שָׂכֶל
  choice: समझ की रोटी
  rationale: ठोस रूपक ‘रोटी’ को बनाए रखा गया है। שׂכל के लिए ‘समझ’ सहज आधुनिक हिन्दी है और यूनानी συνέσεως से भी मेल खाता है।
- source_word: וּמֵי תְבוּנָה
  choice: विवेक का जल
  rationale: हिब्रू में מַיִם रूपतः बहुवचन है, पर हिन्दी में द्रव्यवाचक ‘जल’ स्वाभाविक है। תְבוּנָה को שָׂכֶל से अलग रखने के लिए ‘विवेक’ चुना गया है; इससे समझ-बूझ और परख की क्षमता का भाव आता है।
- source_word: תַּשְׁקֶנּוּ
  choice: पिलाएगी
  rationale: שקה का हिफ़ील अर्थ ‘पीने को देना/पिलाना’ है। ‘जल पिलाएगी’ हिन्दी में संक्षिप्त, सहज और मूल के समानांतर वाक्य-विन्यास के अनुकूल है।
theological_decisions:
- issue: व्यक्तिरूप में प्रस्तुत बुद्धि को निहित कर्ता मानना
  choice: मुख्य पाठ में स्त्रीलिंग ‘वह ... खिलाएगी ... पिलाएगी’
  alternative: लिंग को अस्पष्ट रखने वाला पुनर्गठन, अथवा पुल्लिंग कर्ता
  rationale: हिब्रू क्रियाएँ स्त्रीलिंग एकवचन हैं और निकटवर्ती संदर्भ में कर्ता ‘बुद्धि’ है। हिन्दी में क्रिया के लिंग को छिपाना कृत्रिम होता; इसलिए संदर्भगत व्यक्तिरूपण को स्पष्ट रखा गया है, बिना कर्ता-संज्ञा को मूल से अधिक दोहराए।
- issue: תְבוּנָה और यूनानी σοφίας के बीच पाठांतर
  choice: हिब्रू के अनुसार ‘विवेक’
  alternative: यूनानी के अनुसार ‘बुद्धि’
  rationale: प्राथमिक और उच्च-विश्वसनीयता वाले हिब्रू साक्ष्य में תְבוּנָה है। यूनानी समानांतर व्यापक बुद्धि-रूपक की पुष्टि करता है, पर उसका ‘बुद्धि’ पाठ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘रोटी’ और ‘जल’ की समानांतर ज्ञान-रूपक छवियाँ सुरक्षित हैं; ‘समझ’ और ‘विवेक’ दो निकट, पर अलग हिब्रू शब्दों का भेद बनाए रखते हैं।
