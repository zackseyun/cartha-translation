  yaml_path: translation/deuterocanon/sirach/015/019.yaml
  text: The eyes of God see his works[b][a], and he knows every deed of a man.
translation:
  language: hi
  text: परमेश्वर की आँखें मनुष्य के कामों को देखती हैं,[b] और वह मनुष्य के हर कर्म को पहचानता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में אִישׁ पुल्लिंग एकवचन संज्ञा है, जिसका अर्थ ‘मनुष्य’ या ‘पुरुष’ हो सकता है; ज्ञान-साहित्य में यह शब्द प्रायः सामान्य रूप से किसी मनुष्य के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ में पहला खंड भिन्न है: “उसकी आँखें उन पर हैं जो उसका भय मानते हैं”; दूसरा खंड मनुष्य के हर कर्म के विषय में परमेश्वर के पूर्ण ज्ञान से सहमत है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: परमेश्वर की आँखें
  rationale: इब्रानी की ठोस, मानवरूपी छवि को बनाए रखता है। אֵל के लिए यहाँ सामान्य और स्वाभाविक हिन्दी पद ‘परमेश्वर’ उपयुक्त है; मूल में वाचा-नाम नहीं है।
- source_word: יִרְאוּ
  choice: देखती हैं
  rationale: क्रिया का सीधा अर्थ ‘देखना’ है; हिन्दी में बहुवचन कर्ता ‘आँखें’ के साथ यह स्वाभाविक है।
- source_word: מַעֲשָׂיו
  choice: उसके कामों को
  rationale: पुल्लिंग एकवचन प्रत्यय को ‘उसके’ से सुरक्षित रखा गया है। संदर्भ में इसका संभावित संकेत आगे आए ‘मनुष्य’ की ओर है, पर मूल की व्याकरणिक संदिग्धता को अनावश्यक रूप से नहीं सुलझाया गया।
- source_word: יַכִּיר
  choice: पहचानता है
  rationale: הכיר केवल सामान्य जानकारी नहीं, बल्कि पहचानने और भली-भाँति अवगत होने का भाव भी दे सकता है। ‘पहचानता है’ इस विशेषता को बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: כָּל מִפְעַל
  choice: हर कर्म
  rationale: एकवचन संज्ञा के साथ כָּל का स्वाभाविक हिन्दी रूप ‘हर’ है; ‘कर्म’ नैतिक संदर्भ में किए गए काम को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: אִישׁ पुल्लिंग एकवचन है, पर ज्ञान-साहित्य में प्रायः प्रतिनिधिक या सामान्य मानवीय अर्थ में आता है। ‘मनुष्य’ हिन्दी में इस अर्थ को स्वाभाविक रखते हुए मूल के एकवचन मानवीय संदर्भ को सुरक्षित करता है।
theological_decisions:
- issue: परमेश्वर के देखने के लिए मानवरूपी भाषा
  choice: ‘परमेश्वर की आँखें’ को अक्षरशः बनाए रखा गया।
  alternative: ‘परमेश्वर देखता है’
  rationale: मूल की काव्यात्मक और ठोस छवि को अमूर्त कथन में बदलना आवश्यक नहीं है।
- issue: מַעֲשָׂיו में सर्वनाम का संदर्भ
  choice: ‘उसके कामों’ द्वारा मूल की संभावित संदिग्धता बनाए रखी गई।
  alternative: ‘मनुष्य के कामों’
  rationale: प्रत्यय का निकटतम आशय संभवतः अगले खंड के मनुष्य से है, पर इब्रानी वाक्य में उसे स्पष्ट संज्ञा से नहीं बाँधा गया; अतः अनुवाद ने अर्थ को अधिक निश्चित नहीं बनाया।
- issue: אִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: मुख्य पाठ में ‘मनुष्य’
  alternative: ‘पुरुष’ या ‘व्यक्ति’
  rationale: ‘मनुष्य’ आधुनिक हिन्दी में सामान्य मानव को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी मूल के पुल्लिंग एकवचन रूप को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आँखें’, ‘कामों’ और ‘कर्म’ मूल की ठोस ज्ञान-साहित्यिक शैली को बनाए रखते हैं; दिव्य सर्वनामों के लिए असामान्य आदरसूचक पूँजीकरण हिन्दी में लागू नहीं किया गया।
