  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
translation:
  language: hi
  text: वह हर्ष और आनन्द पाएगा, और वह उसे सदा रहने वाला नाम विरासत में देगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में क्रिया स्त्रीलिंग है: “वह [बुद्धि] उसे सदा रहने वाला नाम विरासत में देगी।” यूनानी समानान्तर में, “वह सदा रहने वाला नाम विरासत में पाएगा।”'
    reason: अन्तिम उपवाक्य में इब्रानी और यूनानी के कर्ता तथा वाक्य-विन्यास अलग हैं, पर दोनों स्थायी नाम को विरासत के रूप में मिलने का भाव व्यक्त करते हैं।
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: हर्ष
  rationale: यह शब्द आनन्दपूर्ण उल्लास को व्यक्त करता है। ‘हर्ष’ निकटवर्ती שִׂמְחָה के अनुवाद ‘आनन्द’ से भिन्न रहते हुए काव्यात्मक समानार्थी जोड़ी को बनाए रखता है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह सामान्य और गहरे सुख का स्वाभाविक आधुनिक हिन्दी शब्द है; ‘हर्ष और आनन्द’ इब्रानी की निकटार्थी शब्द-जोड़ी को सहज ढंग से व्यक्त करता है।
- source_word: יִמְצָא
  choice: पाएगा
  rationale: מצא का मूल अर्थ ‘पाना/खोजना’ है। इस सन्दर्भ में ‘पाएगा’ हिन्दी में स्वाभाविक है और उस आनन्द की प्राप्ति का भाव स्पष्ट करता है।
- source_word: שֵׂם עוֹלָם
  choice: सदा बना रहने वाला नाम
  rationale: शाब्दिक भाव ‘सदा का नाम’ है। यह अनुवाद स्थायी यश की व्याख्या किए बिना इब्रानी के ‘नाम’ रूपक और उसके चिरस्थायी होने के भाव को सुरक्षित रखता है।
- source_word: תּוֹרִישֶׁנּוּ
  choice: उसे विरासत में मिलेगा
  rationale: इब्रानी रूप संक्षिप्त है और ‘उसे विरासत दिलाएगी/देगी’ का भाव दे सकता है, जिसका सम्भावित कर्ता पूर्वसन्दर्भ की बुद्धि है। परिणामवाचक हिन्दी रचना विरासत के बिम्ब को रखती है, पर अनिश्चित कर्ता को मुख्य पाठ में जबरन स्पष्ट नहीं करती।
theological_decisions:
- issue: अन्तिम उपवाक्य में תּוֹרִישֶׁנּוּ का कर्ता और वाक्य-विन्यास
  choice: ‘सदा बना रहने वाला नाम उसे विरासत में मिलेगा’—प्राप्त होने वाले परिणाम को मुख्य पाठ में व्यक्त किया गया है।
  alternative: ‘वह [बुद्धि] उसे सदा बना रहने वाला नाम विरासत में देगी’; यूनानी समानान्तर के अनुसार, ‘वह सदा बना रहने वाला नाम विरासत में पाएगा।’
  rationale: इब्रानी का स्त्रीलिंग क्रियारूप पूर्वसन्दर्भ की ‘बुद्धि’ को कर्ता मानने देता है, जबकि यूनानी पाठ उस व्यक्ति को विरासत पाने वाला कर्ता बनाता है। दोनों में मूल विचार स्थायी नाम की विरासत है। मुख्य पाठ स्वाभाविक हिन्दी में साझा अर्थ रखता है और पाठ-साक्ष्यों के वाक्यगत तनाव को पाद-टिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हर्ष और आनन्द’ मूल की काव्यात्मक समानार्थी जोड़ी को बनाए रखता है; ‘नाम’ को ‘यश’ बनाकर व्याख्यायित नहीं किया गया।
