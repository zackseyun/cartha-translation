base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/011.yaml
  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: hi
  text: यह मत कहना,[a] “मेरा अपराध परमेश्वर से है,” क्योंकि जिस काम से वह घृणा करता है, वह उसने नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “यह मत कहना, ‘प्रभु के कारण मैं भटक गया,’ क्योंकि जिन कामों से उसने घृणा की है, उन्हें तुम नहीं करोगे।” यूनानी पाठ उपलब्ध इब्रानी से संबंधित है, पर उसकी शब्दावली और अंतिम उपवाक्य का कर्ता भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहना
  rationale: निषेधात्मक आज्ञा को सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है। ‘यह’ आगे आने वाले कथन की सहज भूमिका बनाता है।
- source_word: מֵאֵל
  choice: परमेश्वर से
  rationale: מִן यहाँ सबसे स्वाभाविक रूप से स्रोत या उत्पत्ति बताता है; अतः व्यक्ति अपने अपराध का मूल परमेश्वर को न ठहराए।
- source_word: פִּשְׁעִי
  choice: मेरा अपराध
  rationale: פשע में जानबूझकर किए गए उल्लंघन या विद्रोह का भाव हो सकता है। ‘अपराध’ सामान्य पाठक के लिए स्वाभाविक है और नैतिक गंभीरता बनाए रखता है; ‘विद्रोह’ यहाँ अनावश्यक रूप से विशिष्ट होता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले निषेध का कारण प्रस्तुत करता है और हिन्दी में स्पष्ट कारण-संबंध बनाता है।
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: जिससे वह घृणा करता है
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप; ‘वह’ का संकेत पूर्ववर्ती परमेश्वर की ओर है।
- source_word: לֹא עָשָׂה
  choice: उसे उसने नहीं किया
  rationale: इब्रानी पूर्ण क्रिया और उसके कर्ता को सुरक्षित रखा गया है। शब्दक्रम हिन्दी में थोड़ा बल देता है कि घृणित काम परमेश्वर ने नहीं किया।
theological_decisions:
- issue: क्या पद पाप के परमेश्वर से उत्पन्न होने का निषेध करता है या परमेश्वर के कारण पथभ्रष्ट होने का?
  choice: मुख्य पाठ में ‘मेरा अपराध परमेश्वर से है’ रखा गया है, जो अपराध के स्रोत या उत्पत्ति को परमेश्वर ठहराने से मना करता है।
  alternative: 'यूनानी समानांतर के अनुसार: ‘प्रभु के कारण मैं भटक गया।’'
  rationale: प्राथमिक इब्रानी साक्ष्य מֵאֵל के द्वारा स्रोत का भाव सबसे सीधे व्यक्त करता है। यूनानी पाठ संबंधित परंतु समान न होने वाला कारणात्मक रूप देता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: פשע में अपराध और विद्रोह के बीच चयन
  choice: अपराध
  alternative: विद्रोह; पाप; उल्लंघन
  rationale: ‘अपराध’ नैतिक उत्तरदायित्व और गंभीरता को व्यक्त करता है, पर पाठ में राजनीतिक या अत्यधिक तकनीकी ‘विद्रोह’ का भाव आरोपित नहीं करता।
- issue: अंतिम उपवाक्य का कर्ता
  choice: 'इब्रानी के अनुसार कर्ता परमेश्वर है: ‘उसे उसने नहीं किया।’'
  alternative: 'यूनानी के अनुसार कर्ता संबोधित व्यक्ति है: ‘तुम वह नहीं करोगे जिससे उसने घृणा की।’'
  rationale: इब्रानी עָשָׂה तीसरे पुरुष एकवचन है और प्राथमिक उच्च-विश्वास वाला साक्ष्य है। यूनानी में दूसरा पुरुष भविष्यत् रूप है; इस वास्तविक पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक शैली अपनाई गई है। ‘परमेश्वर’ सामान्य और संप्रदाय-निरपेक्ष ईश्वरवाचक चयन है। मुख्य पाठ इब्रानी की कठोर, कुछ असामान्य तर्क-रचना को अत्यधिक व्याख्यायित किए बिना बनाए रखता है।
