  yaml_path: translation/deuterocanon/sirach/005/004.yaml
  text: Do not say[a], “Who can withstand his power?” for Yahweh seeks the persecuted.
translation:
  language: hi
  text: यह मत कहो[a], “उसकी शक्ति का सामना कौन कर सकता है?” क्योंकि यहोवा सताए गए लोगों को खोजता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “यह मत कहो, ‘मैंने पाप किया, फिर मेरा क्या बिगड़ा?’ क्योंकि प्रभु धीरजवान है।” संभवतः यह उपलब्ध इब्रानी पाठ से भिन्न किसी आधार-पाठ को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहो
  rationale: निषेधात्मक आज्ञा को आधुनिक और सीधी हिन्दी में व्यक्त करता है।
- source_word: מִי יוּכַל כֹּחוֹ
  choice: उसकी शक्ति का सामना कौन कर सकता है?
  rationale: प्राप्त इब्रानी पाठ संक्षिप्त और कुछ कठिन है। יוכל के साथ निहित विरोधात्मक भाव मानकर यह अनुवाद दैवी शक्ति का सामना करने की अलंकारिक चुनौती को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को व्यक्तिगत नाम के रूप में स्पष्ट रूप से प्रस्तुत करता है।
- source_word: מְבַקֵּשׁ
  choice: खोजता है
  rationale: בקש का मूल अर्थ ‘खोजना/ढूँढ़ना’ है; अनुवाद इससे अधिक स्पष्ट रूप से ‘बचाना’ या ‘न्याय दिलाना’ नहीं जोड़ता।
- source_word: נִרְדָּפִים
  choice: सताए गए लोगों को
  rationale: רדף के निष्क्रिय कृदंत का मानवीय और नैतिक संदर्भ में सहज अर्थ है—वे लोग जिनका पीछा किया या जिन्हें सताया गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परंपराओं में पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण किया गया है और यूनानी पाठ को पादटिप्पणी में दिया गया है।
  alternative: “यह मत कहो, ‘मैंने पाप किया, फिर मेरा क्या बिगड़ा?’ क्योंकि प्रभु धीरज रखता है।”
  rationale: यहाँ उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है, किंतु यूनानी पाठ शायद किसी भिन्न आधार-पाठ को दर्शाता है। इसलिए किसी एक परंपरा को चुपचाप दूसरी में मिलाने के बजाय दोनों का अंतर स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी की कठिन संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी प्रश्न बनाया गया है, पर उसके चेतावनीपूर्ण और अलंकारिक स्वर को बनाए रखा गया है।
