base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/002.yaml
  text: Do not rely on your own strength to walk after the desire of your soul[a][b].
translation:
  language: hi
  text: अपने बल पर भरोसा करके अपने प्राण की अभिलाषा के पीछे मत चलो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर के अधिक निकट अनुवाद हो सकता है: “अपने प्राण और अपने बल का अनुसरण मत करो, अपने हृदय की अभिलाषाओं में चलने के लिए।” इब्रानी पाठ में है: “अपने बल पर भरोसा मत रखो, अपने प्राण की अभिलाषा के पीछे चलने के लिए।”'
    reason: इब्रानी और यूनानी पाठों की वाक्य-रचना तथा शब्दावली में अंतर को सुरक्षित रखना।
  - marker: b
    text: यहाँ “प्राण” के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंगानुसार “स्वयं” या “जीवन” भी हो सकता है; यह इच्छा या लालसा करने वाले व्यक्ति का भी बोध करा सकता है।
    reason: נפשׁ की व्यापक अर्थ-सीमा स्पष्ट करना और ‘प्राण’ को अनावश्यक रूप से संकीर्ण अर्थ में पढ़ने से बचाना।
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: भरोसा करके ... मत चलो
  rationale: שׁען का मूल अर्थ किसी पर टिकना या भरोसा रखना है। हिन्दी में संयुक्त निषेध—‘भरोसा करके ... मत चलो’—इब्रानी वाक्य के आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּחֶךָ
  choice: अपने बल पर
  rationale: כֹּחַ का सामान्य अर्थ ‘बल’ या ‘शक्ति’ है। ‘अपने बल पर’ व्यक्तिगत सामर्थ्य पर निर्भर रहने की चेतावनी को स्पष्ट और संक्षिप्त रखता है।
- source_word: לָלֶכֶת אַחַר
  choice: के पीछे ... चलो
  rationale: शाब्दिक भाव ‘पीछे चलना’ है और यहाँ आचरण या जीवन-दिशा को सूचित करता है। हिन्दी में यह मुहावरा बोधगम्य है और मूल बिंब को बनाए रखता है।
- source_word: תַּאֲוַת
  choice: अभिलाषा
  rationale: इब्रानी संज्ञा एकवचन में है और इच्छा, लालसा या तीव्र चाह को व्यक्त कर सकती है। ‘अभिलाषा’ अर्थ की व्यापकता बनाए रखती है और इसे केवल यौन वासना तक सीमित नहीं करती।
- source_word: נַפְשֶׁךָ
  choice: अपने प्राण की
  rationale: נפשׁ का अर्थ प्रसंगानुसार प्राण, स्वयं, जीवन या लालसा करने वाला आंतरिक व्यक्ति हो सकता है। ‘प्राण’ मूल की मानव-स्वरूप संबंधी शब्दावली और उसकी अस्पष्टता को यथासंभव सुरक्षित रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: נַפְשֶׁךָ / ψυχή के मानव-स्वरूप संबंधी अर्थ
  choice: अपने प्राण की
  alternative: अपने मन की; अपनी ही इच्छा
  rationale: ‘प्राण’ मूल शब्द की व्यापकता को किसी संकीर्ण मन-शरीर द्वैत में निर्णायक रूप से नहीं बाँधता। चूँकि आधुनिक हिन्दी में इसे केवल जीवनी-शक्ति या अमर आत्मा भी समझा जा सकता है, ‘स्वयं’ और ‘जीवन’ जैसे संभावित अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- issue: इब्रानी पाठ और यूनानी समानांतर की वाक्य-रचना
  choice: इब्रानी के अनुसार अपने बल पर भरोसा न करना और प्राण की अभिलाषा के पीछे न चलना
  alternative: 'यूनानी के अधिक निकट: अपने प्राण और बल के पीछे न चलना, और हृदय की अभिलाषाओं में चलना'
  rationale: विश्वसनीय इब्रानी पाठ को मुख्य आधार बनाया गया है। यूनानी समानांतर में वाक्य-संबंध और ‘हृदय की अभिलाषाएँ’ भिन्न हैं, इसलिए उस साक्ष्य को पादटिप्पणी में रखा गया है, न कि चुपचाप मुख्य पाठ में मिला दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्राण की अभिलाषा’ सामान्य बोलचाल की अपेक्षा कुछ अधिक साहित्यिक है, पर यह मूल इब्रानी की मानव-स्वरूप संबंधी बनावट और अर्थगत तनाव को बनाए रखती है।
