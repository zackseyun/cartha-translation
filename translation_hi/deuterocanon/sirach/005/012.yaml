review_pass:
  verdict: revise
  source_fidelity: The draft accurately follows the extant Hebrew rather than the sharply divergent Greek parallel. Its prohibition, reference to deceit-associated wealth, and warning that such wealth is of no avail on the day of wrath are all preserved. The collective singular treatment of धन-संपत्ति with वह ... आएगी is acceptable Hindi.
  naturalness: ‘झूठी धन-सम्पत्ति’ is understandable but not idiomatic for wealth characterized by falsehood or deception; it can suggest wealth that is literally unreal. ‘छलपूर्ण धन-संपत्ति’ expresses the Hebrew ambiguity more naturally. ‘कोप के दिन’ is a more direct rendering of עֶבְרָה (‘wrath’) than ‘प्रकोप के दिन,’ which can primarily suggest a calamity.
  terminology: ‘भरोसा न रखो’ is natural and suitably proverbial. ‘छलपूर्ण धन-संपत्ति’ retains the semantic range of נכסי שקר without limiting it to dishonestly acquired wealth. ‘कोप’ retains the intense wrath sense without specifying whose wrath it is. The textual-variant footnote correctly identifies the Greek reading and the priority of the Hebrew witness.
  issues:
  - severity: medium
    issue: The main-text phrase ‘झूठी धन-सम्पत्ति’ is semantically awkward and may imply imaginary rather than deceit-marked or unreliable wealth.
    rationale: The Hebrew שקר can encompass falsehood, deception, fraud, and unreliability. ‘छलपूर्ण’ is a natural Hindi adjective that preserves this breadth without prematurely deciding whether the wealth was deceitfully gained or proves deceptive.
  - severity: low
    issue: ‘प्रकोप’ can denote a destructive outbreak or calamity more readily than the wrath denoted by עֶבְרָה.
    rationale: ‘कोप’ directly conveys intense wrath while retaining the elevated wisdom-literature register and leaving its subject unstated, as in the Hebrew.
