  to: छलपूर्ण धन-संपत्ति पर भरोसा न रखो[b], क्योंकि कोप के दिन वह किसी काम न आएगी।[a]
  rationale: The revision improves idiomatic Hindi and more closely represents the lexical force of שקר and עֶבְרָה. It does not alter the Hebrew-based reading, introduce a specified agent of wrath, or resolve the ambiguity concerning whether the wealth is fraudulently acquired or inherently unreliable. Both required footnote anchors remain present and the complete footnote set is retained.
