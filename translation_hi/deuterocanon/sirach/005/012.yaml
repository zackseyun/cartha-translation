base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/012.yaml
  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
translation:
  language: hi
  text: छलपूर्ण धन-संपत्ति पर भरोसा न रखो[b], क्योंकि कोप के दिन वह किसी काम न आएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद की यूनानी पाठ-परम्परा में इसके स्थान पर यह मिलता है: “यदि तुममें समझ है, तो अपने पड़ोसी को उत्तर दो; यदि नहीं, तो अपना हाथ अपने मुँह पर रखो।” यहाँ हिब्रू साक्ष्य इससे बहुत भिन्न है; इस अनुवाद में उपलब्ध हिब्रू पाठ को प्राथमिकता दी गई है।'
    reason: textual_variant
  - marker: b
    text: या “झूठी धन-संपत्ति,” “धोखे से अर्जित संपत्ति,” अथवा “अविश्वसनीय धन।” हिब्रू पदबंध ऐसे धन-संपत्ति का वर्णन कर सकता है जो छल से अर्जित की गई हो या जो अन्ततः भरोसे के योग्य सिद्ध न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח עַל
  choice: भरोसा न रखो
  rationale: यह हिब्रू के सामान्य निषेधात्मक ज्ञानोपदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘पर’ हिन्दी में ‘भरोसा रखना’ के साथ सहज है।
- source_word: נִכְסֵי שֶׁקֶר
  choice: झूठी धन-सम्पत्ति
  rationale: נִכְסֵי सामूहिक रूप से सम्पत्ति या धन-साधनों को दर्शाता है और שֶׁקֶר झूठ, छल अथवा अविश्वसनीयता का भाव रखता है। ‘झूठी’ इस जानबूझकर खुली रखी गई व्यापकता को सँभालती है।
- source_word: לֹא יוֹעִילוּ
  choice: किसी काम न आएगी
  rationale: यह ‘लाभ न पहुँचाना/सहायक न होना’ का स्पष्ट और बोलचाल-सम्मत हिन्दी रूप है। सामूहिक ‘धन-सम्पत्ति’ को हिन्दी में एकवचन स्त्रीलिंग मानकर ‘आएगी’ रखा गया है।
- source_word: בְּיוֹם עֶבְרָה
  choice: प्रकोप के दिन
  rationale: ‘प्रकोप’ עֶבְרָה की तीव्र क्रोध या कोप की शक्ति तथा सम्भावित न्यायिक संकेत को बनाए रखता है, पर यह स्पष्ट रूप से नहीं जोड़ता कि प्रकोप किसका है।
theological_decisions:
- issue: עֶבְרָה को सामान्य क्रोध या न्यायिक-धार्मिक बल वाले शब्द से व्यक्त करना
  choice: प्रकोप
  alternative: क्रोध; कोप; न्याय
  rationale: ‘प्रकोप’ तीव्रता और सम्भावित न्यायिक अर्थ बनाए रखता है। मूल पाठ प्रकोप के कर्ता को स्पष्ट नहीं करता, इसलिए अनुवाद में ‘परमेश्वर का’ नहीं जोड़ा गया।
- issue: भिन्न यूनानी पाठ के सामने हिब्रू साक्ष्य की प्राथमिकता
  choice: उपलब्ध हिब्रू पाठ का अनुवाद
  alternative: 'यूनानी पाठ: ‘यदि तुममें समझ है, तो अपने पड़ोसी को उत्तर दो; यदि नहीं, तो अपना हाथ अपने मुँह पर रखो।’'
  rationale: इस पद के लिए उच्च-विश्वसनीयता वाला हिब्रू साक्ष्य उपलब्ध है और परियोजना में उपलब्ध हिब्रू को प्राथमिक माना गया है। अत्यन्त भिन्न यूनानी रूप को पाठांतर-सूचना में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धन-सम्पत्ति’ साहित्यिक होते हुए भी सहज है; ‘किसी काम न आएगी’ औपचारिकता को अनावश्यक रूप से बढ़ाए बिना मूल अर्थ स्पष्ट करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न उपस्थित हैं।
