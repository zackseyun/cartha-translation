base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: hi
  text: यह मत कहो, “मैंने पाप किया है, और मेरे साथ क्या किया जाएगा? कुछ भी नहीं।”[b] क्योंकि परमेश्वर धैर्यवान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “क्योंकि परमेश्वर क्रोध करने में देर करता है।”'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ भिन्न है: “प्रायश्चित के विषय में निडर होकर पाप पर पाप मत बढ़ाओ।” इब्रानी साक्ष्य यहाँ यह कहने से सावधान करता है कि परमेश्वर के धैर्य के कारण पाप का कोई परिणाम नहीं होता; दोनों पाठ दैवी दया का अनुचित लाभ उठाने के विरुद्ध चेतावनी देते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहो
  rationale: इब्रानी का सीधा निषेधात्मक आदेश है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: पूर्ण क्रिया ऐसे किए गए पाप को व्यक्त करती है जिसका वर्तमान प्रसंग से संबंध बना हुआ है।
- source_word: וְמַה יֵעָשֶה לִי
  choice: और मेरा क्या होगा?
  rationale: इब्रानी क्रिया कर्मवाच्य है और भविष्य के परिणाम की ओर भी संकेत कर सकती है। यह हिन्दी अभिव्यक्ति स्वाभाविक रहते हुए ‘मेरे साथ क्या किया जाएगा?’ और ‘मुझ पर क्या बीतेगी?’ के भाव को खुला रखती है।
- source_word: מְאוּמָה
  choice: कुछ भी नहीं
  rationale: यह प्रश्न का संक्षिप्त, आत्मविश्वासी उत्तर है और पाप के किसी परिणाम से इनकार प्रकट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषिद्ध सोच का कारण बताता है—मनुष्य परमेश्वर के धीरज को दण्ड न मिलने का आधार मानता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: इस ज्ञान-साहित्यिक प्रसंग में אֵל के लिए मानक और सहज हिन्दी पद।
- source_word: אֶרֶךְ אַפַּיִם
  choice: धीरज धरता है
  rationale: शाब्दिक मुहावरे ‘क्रोध करने में देर करता है’ का सहज आधुनिक हिन्दी रूप; यह दैवी सहनशीलता को व्यक्त करता है, दण्ड के निषेध को नहीं।
- source_word: הוּא
  choice: धरता है
  rationale: इब्रानी सर्वनाम को हिन्दी की स्वाभाविक विधेय-रचना में समाहित किया गया है।
theological_decisions:
- issue: אֶרֶךְ אַפַּיִם में परमेश्वर के गुण का अनुवाद
  choice: परमेश्वर धीरज धरता है
  alternative: परमेश्वर क्रोध करने में देर करता है
  rationale: मुख्य पाठ में सहज आधुनिक हिन्दी रखी गई है, जबकि अधिक शाब्दिक बाइबलीय मुहावरा पादटिप्पणी में दिया गया है। इससे यह तनाव बना रहता है कि परमेश्वर का धीरज पाप की अनुमति या न्याय के अभाव का प्रमाण नहीं है।
- issue: इब्रानी और यूनानी पाठांतर
  choice: इब्रानी साक्ष्य के अनुसार पाप के परिणाम को नकारने वाली उक्ति
  alternative: प्रायश्चित के विषय में निर्भय होकर पाप पर पाप बढ़ाने की चेतावनी
  rationale: दिए गए उच्च-विश्वसनीयता वाले इब्रानी पाठ को मुख्य पाठ बनाया गया है; पर्याप्त रूप से भिन्न यूनानी समानांतर को छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “मेरा क्या होगा?” जानबूझकर इतना खुला है कि अनुपस्थित वर्तमान परिणाम और अपेक्षित भविष्य परिणाम—दोनों की ध्वनि बनी रहे।
