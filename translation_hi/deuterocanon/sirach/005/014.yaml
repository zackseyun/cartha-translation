  text: Be firm in your understanding[a], and let your word be one.
translation:
  language: hi
  text: अपनी समझ में दृढ़ रहो, और तुम्हारी बात एक ही हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “तुम्हें कानाफूसी करनेवाला न कहा जाए ... दोहरी ज़बान वाले पर कड़ी निंदा होती है।” इससे संकेत मिलता है कि “तुम्हारी बात एक ही हो” बँटी हुई या कपटपूर्ण वाणी के विरुद्ध चेतावनी है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ עַל דַּעְתֶּךָ
  choice: अपनी समझ पर दृढ़ रहो
  rationale: स्मख धातु से बना סָמוּךְ सहारा पाए हुए, स्थिर या दृढ़ होने का भाव देता है। दַּעַת यहाँ केवल जानकारी नहीं, बल्कि समझ या विवेक है। यह अनुवाद हिब्रू की संरचना और ज्ञान-साहित्य के उपदेशात्मक स्वर, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וְאֶחָד
  choice: एक ही
  rationale: हिब्रू में शाब्दिक रूप से ‘एक’ है। ‘एक ही’ वाणी में एकरूपता और अद्वैतता का संकेत देता है, पर अर्थ को सीधे ‘निष्कपट’ या ‘सुसंगत’ बनाकर मूल की संक्षिप्त अभिव्यक्ति को नहीं खोलता।
- source_word: יְהִי דְבָרֶךָ
  choice: तुम्हारी बात ... हो
  rationale: יְהִי आदेशात्मक कामना है, जिसका स्वाभाविक हिन्दी रूप ‘हो’ है। דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘कथन’ हो सकता है; सामान्य आधुनिक हिन्दी में ‘तुम्हारी बात’ यहाँ बोलचाल और कथन दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: हिब्रू पाठ और काफी भिन्न यूनानी समानांतर के बीच संबंध
  choice: 'मुख्य पाठ में उपलब्ध हिब्रू का सीधा अनुवाद किया गया है: समझ में दृढ़ता और बात के एक होने का उपदेश।'
  alternative: यूनानी के आधार पर कानाफूसी, जीभ से घात लगाने और दोहरी जीभ वाले पर दोष का विस्तृत निषेध।
  rationale: इस पद का हिब्रू साक्ष्य उच्च विश्वास के साथ उपलब्ध है, इसलिए मुख्य पाठ में उसे प्राथमिकता दी गई है। यूनानी पाठ संभवतः भिन्न आधार-पाठ या विस्तृत परंपरा को दर्शाता है। फिर भी ‘तुम्हारी बात एक ही हो’ और यूनानी में दोहरी जीभ की निंदा के बीच अर्थगत संबंध है; इसलिए उस साक्ष्य को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘समझ’ सामान्य पाठक के लिए सहज है और ‘बात एक ही हो’ मूल हिब्रू की संक्षिप्तता तथा संभावित नैतिक तनाव को बनाए रखता है।
