translation:
  language: hi
  text: और तुमने कहा, “उसकी करुणा बहुत अधिक है; मेरे बहुत-से अधर्मों के कारण वह मुझे क्षमा कर देगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “अधर्म से कमाए धन पर भरोसा मत रखो, क्योंकि दण्ड के दिन उससे तुम्हें कोई लाभ न होगा।” इसके विपरीत, यहाँ उपलब्ध हिब्रू पाठ परमेश्वर की करुणा का अनुचित भरोसा करने के विरुद्ध चेतावनी देता है।'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और तुम कहते हो
  rationale: हिब्रू पूर्ण रूप यहाँ चेतावनीपूर्ण उपदेश के संदर्भ में संबोधित व्यक्ति की कही जाने वाली धृष्ट धारणा व्यक्त करता है; स्वाभाविक हिन्दी में वर्तमानकाल ‘कहते हो’ इस कार्य को स्पष्ट करता है।
- source_word: רַחֲמָיו רַבִּים
  choice: उसकी करुणा बहुत अधिक है
  rationale: רַחֲמִים रूप की दृष्टि से बहुवचन है, पर हिन्दी में ‘करुणाएँ’ अस्वाभाविक है; सामूहिक एकवचन ‘करुणा’ के साथ ‘बहुत अधिक’ उसके प्रचुर होने का भाव रखता है।
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: मेरे बहुत-से अधर्मों को
  rationale: לְרֹב यहाँ पापों की बड़ी संख्या पर बल देता है। हिन्दी में क्षमा के कर्म के रूप में ‘बहुत-से अधर्मों को’ अर्थ को सहजता से व्यक्त करता है, बिना इस धृष्ट निष्कर्ष को अनुमोदित किए।
- source_word: יִסְלָח
  choice: क्षमा कर देगा
  rationale: अपूर्ण रूप वक्ता की भविष्य-संबंधी आश्वस्त धारणा व्यक्त करता है; ‘क्षमा कर देगा’ आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
theological_decisions:
- issue: हिब्रू पाठ और यूनानी समानांतर में मूलतः भिन्न वचन
  choice: उपलब्ध हिब्रू साक्ष्य का मुख्य पाठ में अनुवाद और यूनानी पाठ को पाठांतर की पादटिप्पणी में संरक्षण
  alternative: 'यूनानी: “अधर्म से कमाए धन पर भरोसा मत रखो, क्योंकि दण्ड के दिन उससे तुम्हें कोई लाभ न होगा।”'
  rationale: इस स्थान पर हिब्रू पाठ सुरक्षित और उच्च-विश्वास वाला है तथा परमेश्वर की करुणा का अनुचित भरोसा करने के विरुद्ध चेतावनी देता है। यूनानी पाठ केवल शब्दगत अंतर नहीं, बल्कि एक अलग चेतावनी देता है; इसलिए उसे छिपाने के बजाय महत्त्वपूर्ण पाठांतर के रूप में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘करुणा’ को स्वाभाविक हिन्दी के लिए एकवचन सामूहिक संज्ञा रखा गया है। मुख्य वाक्य में वक्ता की धृष्ट धारणा उद्धरण के रूप में सुरक्षित है; पादटिप्पणी-चिह्न [a] वचन के अंत में रखा गया है।
