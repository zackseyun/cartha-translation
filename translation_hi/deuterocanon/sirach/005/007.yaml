lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: क्षमा के भरोसे
  rationale: בָּטַח के साथ אֶל भरोसे के आधार को सूचित करता है। आधुनिक हिन्दी में ‘क्षमा के भरोसे’ इस मुहावरे और चेतावनी के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תִּבְטָח
  choice: मत ... जाओ
  rationale: निषेधात्मक आदेश को सरल और प्रत्यक्ष हिन्दी में रखा गया है; ‘भरोसे’ के साथ मिलकर यह क्षमा पर अनुचित निर्भरता की चेतावनी देता है।
- source_word: לְהוֹסִיף
  choice: करते जाओ
  rationale: हिब्रू infinitive पाप बढ़ाते रहने के उद्देश्य अथवा परिणाम को जोड़ता है। ‘करते जाओ’ निरंतरता और बढ़ोतरी दोनों को सहज हिन्दी में प्रकट करता है।
- source_word: עָוֹן עַל עָוֹן
  choice: पाप पर पाप
  rationale: यह एक अपराध के ऊपर दूसरा जोड़ते जाने का सघन हिब्रू प्रयोग है। ‘पाप पर पाप’ हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय क्षमा और लगातार पाप करते रहने का संबंध
  choice: पद क्षमा को नकारता नहीं, बल्कि क्षमा को लगातार पाप करने का आधार मान लेने से सावधान करता है।
  alternative: इसे केवल क्षमा मिलने के विषय में सामान्य अति-आत्मविश्वास के विरुद्ध चेतावनी माना जा सकता है।
  rationale: हिब्रू वाक्य क्षमा पर भरोसा करने को सीधे ‘पाप पर पाप’ जोड़ने से संबद्ध करता है। यूनानी समानांतर पश्चाताप टालने और अचानक आने वाले न्याय की विस्तृत चेतावनी देता है, जो इस अर्थ की पुष्टि करता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘क्षमा के भरोसे’ धार्मिक अर्थ को सहज बनाता है, जबकि ‘पाप पर पाप मत करते जाओ’ हिब्रू की पुनरावृत्ति और लगातार बढ़ते अपराध का बल सुरक्षित रखता है।
