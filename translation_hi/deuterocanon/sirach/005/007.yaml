  text: क्षमा के भरोसे पाप पर पाप मत करते जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “प्रभु की ओर लौटने में देर मत करो, और इसे दिन-प्रतिदिन मत टालो; क्योंकि प्रभु का क्रोध अचानक प्रकट होगा, और दण्ड के समय तुम नष्ट हो जाओगे।” यहाँ उपलब्ध हिब्रू पाठ छोटा है और पाप करते रहने के लिए क्षमा का अनुचित भरोसा करने पर विशेष ध्यान देता है।'
