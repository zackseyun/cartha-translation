  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “सामर्थ्य,” “साधन” या “धन-संपत्ति” हो सकता है; यूनानी समानांतर में “धन-संपत्ति” है।
    reason: lexical_ambiguity
  - marker: b
    text: इब्रानी में एक संक्षिप्त मुहावरा है, जिसका भाव लगभग “मेरे हाथ में शक्ति है” है। यूनानी समानांतर इसका भाव “मैं आत्मनिर्भर हूँ” या “मेरे लिए इतना पर्याप्त है” देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: भरोसा मत रखो
  rationale: שׁען का मूल अर्थ किसी पर टिकना है, पर यहाँ इसका लाक्षणिक अर्थ भरोसा या निर्भरता रखना है। आधुनिक हिन्दी में यह प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: חֵילֶךָ
  choice: अपनी धन-संपत्ति
  rationale: חַיִל का अर्थ सामर्थ्य, साधन या धन-संपत्ति हो सकता है। यूनानी समानांतर χρήματα अर्थात धन/संपत्ति आर्थिक अर्थ की पुष्टि करता है।
- source_word: יֵשׁ לְאֵל יָדִי
  choice: मेरे हाथ में सामर्थ्य है
  rationale: यह संक्षिप्त इब्रानी मुहावरा अपनी क्षमता या शक्ति होने का दावा व्यक्त करता है। हिन्दी वाक्य इब्रानी के ‘हाथ’ और ‘सामर्थ्य’ दोनों बिंबों को बनाए रखता है, जबकि यूनानी में निहित आत्मनिर्भरता के भाव को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दूसरे उपवाक्य में कठिन इब्रानी मुहावरे और यूनानी समानांतर का संबंध
  choice: इब्रानी के शक्ति/हाथ वाले कथन को मुख्य पाठ में रखना
  alternative: “मैं अपने आप में पर्याप्त हूँ” या “मेरे पास पर्याप्त है”
  rationale: जीवित इब्रानी साक्ष्य प्राथमिक है और अपनी क्षमता का दावा स्पष्ट करता है। यूनानी समानांतर आत्मनिर्भरता का भाव सामने लाता है, पर उसे मुख्य पाठ में रखने से इब्रानी का ‘हाथ’ संबंधी बिंब मिट जाता; इसलिए उसे पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “मेरे हाथ में सामर्थ्य है” सामान्य पाठक के लिए बोधगम्य रहते हुए मूल इब्रानी बिंब को सुरक्षित रखता है।
