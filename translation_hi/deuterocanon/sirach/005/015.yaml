  text: Be quick to listen[c][b][a], and with patience give a reply.
translation:
  language: hi
  text: सुनने के लिए तत्पर रहो,[c] और धीरज के साथ उत्तर दो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘लंबी आत्मा के साथ’; यह धीरज या संयमित स्वभाव का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धीरज के साथ एक वचन लौटाओ’ अथवा ‘कथन से उत्तर दो।’ इब्रानी वाक्यांश संक्षिप्त है; संदर्भ में ‘उत्तर दो’ उसका संभावित आशय स्पष्ट करता है।
    reason: alternative_reading
  - marker: c
    text: इस पद का यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत भिन्न है और संभवतः किसी दूसरे पाठ-रूप को दर्शाता है। यहाँ अनुवाद में सुरक्षित इब्रानी साक्ष्य को प्राथमिक माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: तत्पर रहो
  rationale: आज्ञार्थक रूप और कृदंत मिलकर शीघ्रता से अधिक तत्परता और तैयार रहने का भाव देते हैं; यह आधुनिक हिन्दी में स्वाभाविक उपदेशात्मक अभिव्यक्ति है।
- source_word: לְהַאֲזִין
  choice: सुनने के लिए
  rationale: क्रिया ध्यानपूर्वक सुनने का बोध कराती है; संदर्भ में ‘सुनना’ सहज है और सक्रिय ग्रहणशीलता व्यक्त करता है।
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: धीरज के साथ
  rationale: शाब्दिक अर्थ ‘लंबी आत्मा/श्वास के साथ’ है, जो संयम, धैर्य और प्रतिक्रिया देने में उतावली न करने का इब्रानी मुहावरा है।
- source_word: הָשֵׁב
  choice: दो
  rationale: यहाँ क्रिया किसी बात के प्रत्युत्तर में वचन लौटाने या उत्तर देने का अर्थ रखती है; हिन्दी में ‘उत्तर दो’ स्वाभाविक है।
- source_word: פִּתְגָּם
  choice: उत्तर
  rationale: संज्ञा ‘वचन’, ‘कथन’ या ‘उक्ति’ भी हो सकती है, पर सुनने के बाद प्रत्युत्तर देने के इस संदर्भ में ‘उत्तर’ सर्वाधिक स्वाभाविक है।
