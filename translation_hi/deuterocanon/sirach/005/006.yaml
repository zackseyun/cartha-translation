  text: Do not say, “The LORD is compassionate; he will wipe away all my iniquities.”
translation:
  language: hi
  text: यह मत कहो, “यहोवा दयालु है; वह मेरे सारे अधर्म मिटा देगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहो
  rationale: हिब्रू निषेध और प्रत्यक्ष संबोधन को स्वाभाविक, स्पष्ट हिन्दी में सुरक्षित रखता है।
- source_word: רַחוּם
  choice: दयालु
  rationale: करुणा और दया से युक्त होने का भाव संक्षेप और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: יהוה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: כָל עֲוֹנוֹתַי
  choice: मेरे सारे अधर्म
  rationale: עָוֹן के नैतिक दोष/कुटिलता के अर्थ को व्यक्त करता है और बहुवचन की समष्टि को ‘सारे’ से दर्शाता है।
- source_word: יִמְחֶה
  choice: मिटा देगा
  rationale: מחה के ‘मिटा देना/पोंछ देना’ रूपक को हिन्दी में बनाए रखता है; कथन में निहित आश्वस्त भविष्यभाव भी सुरक्षित है।
theological_decisions:
- issue: परमेश्वर की दया को पाप करते रहने की गारंटी समझना
  choice: वक्ता के भ्रामक आत्म-आश्वासन को सीधे उद्धरण में रखा गया है
  alternative: इसे व्याख्यात्मक रूप से ‘उसकी दया के भरोसे पाप मत करो’ कहना
  rationale: हिब्रू केवल ऐसा कहने से रोकता है; वह इस अर्ध-पद में अतिरिक्त नैतिक व्याख्या नहीं जोड़ता।
- issue: पापों के हटाए जाने की भाषा
  choice: ‘अधर्म मिटा देगा’
  alternative: ‘पाप क्षमा कर देगा’
  rationale: ‘क्षमा’ धार्मिक आशय को स्पष्ट करती, पर मूल क्रिया के मिटाने वाले रूपक को खो देती और कथन को अनावश्यक रूप से व्याख्यायित करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और साधारण पाठक के लिए सहज। हिब्रू के एक-वाक्यीय पाठ का अनुसरण किया गया है। यूनानी समानांतर में इस पद के साथ आगे का विस्तृत वाक्य भी है, पर वह उपलब्ध उच्च-विश्वसनीय हिब्रू पंक्ति में नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
