base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/011.yaml
  text: For suddenly his wrath will come forth[a], and at the time of vengeance you will be swept away.
translation:
  language: hi
  text: क्योंकि उसका कोप अचानक फूट पड़ेगा,[a] और प्रतिशोध के समय तुम नष्ट हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का यूनानी समानांतर पाठ बहुत भिन्न है: “सुनने में तत्पर हो, और धीरज के साथ उत्तर बोल।” यहाँ मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है, जिसकी शब्दावली यूनानी पाठ-परंपरा से काफी अलग है।'
    reason: textual_variant
lexical_decisions:
- source_word: פִתְאוֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण अकस्मात होने का सीधा और स्वाभाविक अर्थ देता है।
- source_word: יֵצֵא
  choice: फूट पड़ेगा
  rationale: शाब्दिक अर्थ ‘बाहर निकलेगा’ है; कोप के साथ ‘फूट पड़ेगा’ उसके अचानक प्रकट होने की जीवंत छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זַעְמוֹ
  choice: उसका कोप
  rationale: ‘कोप’ זעם की तीव्रता और गरिमापूर्ण चेतावनी-शैली को बनाए रखता है। ‘उसका’ मूल के प्रत्यय को सुरक्षित रखता है और स्पष्ट रूप से ‘परमेश्वर का’ जोड़कर अंतर्निहित संदर्भ को अनावश्यक रूप से तय नहीं करता।
- source_word: וּבְעֵת
  choice: और ... के समय
  rationale: मूल के कालवाचक पदबंध को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נָקָם
  choice: प्रतिशोध
  rationale: यह शब्द दंड मात्र के बजाय נָקָם में निहित बदला लेने अथवा न्यायपूर्ण प्रत्युत्तर की शक्ति को बनाए रखता है।
- source_word: תִּסָּפֶה
  choice: तुम मिटा दिए जाओगे
  rationale: निष्क्रिय रूप में विनाश या नाश हो जाने का भाव व्यक्त करता है। हिन्दी में यह स्वाभाविक है और विनाश की विधि को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: ‘उसका कोप’ में सर्वनाम का अंतर्निहित संदर्भ
  choice: मूल पाठ के अनुसार केवल ‘उसका’ रखा गया है; प्रसंग में इसका सबसे स्वाभाविक संकेत परमेश्वर की ओर है।
  alternative: ‘परमेश्वर का कोप’ कहकर संदर्भ को स्पष्ट कर देना, अथवा इसे किसी अनिर्दिष्ट अधिकारी से जोड़ना।
  rationale: इब्रानी पद में ईश्वरीय नाम दोहराया नहीं गया है। सर्वनाम को बनाए रखने से प्रसंगगत अर्थ सुरक्षित रहता है, पर अनकही पहचान को मुख्य पाठ में स्पष्ट जोड़कर धार्मिक तनाव समाप्त नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कोप’ और ‘प्रतिशोध’ चेतावनी की गंभीरता बनाए रखते हैं; वाक्य-रचना इब्रानी के निकट रहते हुए स्वाभाविक हिन्दी में है।
