translation:
  language: hi
  text: अपने मन और अपनी आँखों के पीछे मत चलो,[a][b] और बुरी अभिलाषाओं में मत चलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन और अपनी आँखों का अनुसरण मत करो, और दुष्ट लालसाओं में मत चलो।” “मन और आँखें” भीतर की चाह और बाहर के आकर्षण का ठोस हिब्रू बिंब है। “अभिलाषाएँ” का अर्थ चाही या ललचाई हुई वस्तुएँ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद का यूनानी पाठ बहुत भिन्न है: “और यह मत कह, ‘मुझ पर कौन प्रबल होगा?’ क्योंकि प्रभु निश्चय ही तुझसे बदला लेगा।” यहाँ मुख्य पाठ में हिब्रू साक्ष्य का अनुसरण किया गया है; यूनानी एक भिन्न समानांतर पाठ-परंपरा को सुरक्षित रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: पीछे मत चलो
  rationale: הלך के साथ אחרי का अर्थ किसी के पीछे चलना या उसका अनुसरण करना है। यह चयन मूल बिंब और आरंभ तथा अंत में आए הלך के शाब्दिक संबंध को बनाए रखता है।
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: अपने मन और अपनी आँखों
  rationale: हिब्रू לֵב भीतर की इच्छा, सोच और प्रवृत्ति का केंद्र है; आधुनिक हिन्दी में ‘मन’ यहाँ ‘हृदय’ से अधिक सहज है। ‘आँखों’ को यथावत रखने से भीतरी चाह और बाहरी आकर्षण का ठोस बिंब सुरक्षित रहता है।
- source_word: לָלֶכֶת
  choice: चलने लगो
  rationale: दूसरे הלך को भी ‘चलना’ कहकर मूल की पुनरुक्ति रखी गई है। ‘लगो’ निषेध के परिणाम अथवा उद्देश्य की हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: בַּחֲמוּדוֹת רָעָה
  choice: बुरी अभिलाषाओं में
  rationale: חמד से बना संज्ञा-रूप चाही या ललचाई हुई वस्तुओं अथवा इच्छाओं को सूचित कर सकता है। प्रसंग में मन और आँखों के पीछे चलने की बात होने से ‘अभिलाषाओं’ उपयुक्त है; רעה को नैतिक विशेषण ‘बुरी’ के रूप में रखा गया है।
theological_decisions:
- issue: ‘मन और आँखों’ का मानव-स्वभाव संबंधी बिंब
  choice: मुख्य पाठ में दोनों ठोस अंगों का उल्लेख बनाए रखना
  alternative: अपनी इच्छाओं के पीछे मत चलो
  rationale: मूल पाठ भीतर की चाह और बाहर के आकर्षण को ‘मन और आँखों’ द्वारा व्यक्त करता है। इसे सामान्यीकृत करके केवल ‘इच्छाएँ’ कहना बाइबिलीय बिंब और उसके तनाव को घटा देता।
- issue: חֲמוּדוֹת רָעָה की अर्थगत संक्षिप्तता
  choice: बुरी अभिलाषाएँ
  alternative: बुरी ललचाई हुई वस्तुएँ; दुष्ट लालसाएँ
  rationale: हिब्रू पद इच्छाओं और चाही गई वस्तुओं—दोनों की ओर संकेत कर सकता है। निकटवर्ती ‘मन और आँखों’ के कारण मुख्य पाठ में इच्छात्मक अर्थ अधिक स्वाभाविक है, जबकि पादटिप्पणी वैकल्पिक अर्थ को सुरक्षित रखती है।
- issue: हिब्रू और यूनानी पाठ-परंपराओं का पर्याप्त अंतर
  choice: उच्च-विश्वसनीयता वाले हिब्रू साक्ष्य को मुख्य पाठ बनाना
  alternative: 'यूनानी पाठ: ‘और यह मत कह, “मुझ पर कौन प्रबल होगा?” क्योंकि प्रभु निश्चय ही तुझसे बदला लेगा।’'
  rationale: दिए गए हिब्रू और यूनानी पाठ इस पद पर एक-दूसरे के अनुवाद मात्र नहीं, बल्कि अलग पाठ-परंपराएँ दर्शाते हैं। इसलिए हिब्रू को आधार बनाकर यूनानी भिन्नता को स्पष्ट पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्वर रखा गया है। ‘मन’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘आँखों’ और ‘चलना’ की पुनरावृत्ति मूल हिब्रू की ठोस काव्यात्मकता को बनाए रखती है।
