base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/010.yaml
  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: hi
  text: उसकी ओर लौटने में देर न कर[b], और इसे दिन-प्रतिदिन न टाल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे एक दिन से दूसरे दिन तक न टाल।” दूसरे खंड की इब्रानी क्रिया कठिन है, पर प्रसंग बार-बार टालने की ओर स्पष्ट संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी ओर लौटने” का संकेत संभवतः पश्चाताप करके परमेश्वर की ओर लौटने से है, यद्यपि इब्रानी में केवल “उसकी ओर” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּאַחֵר
  choice: देर न कर
  rationale: निषेध के साथ אחר का यह रूप देर करने या विलंब करने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और सीधा है।
- source_word: לָשׁוּב
  choice: लौटने में
  rationale: שוב का मूल अर्थ लौटना या फिरना है। यहाँ नैतिक-धार्मिक वापसी का संकेत है, पर अनुवाद में पश्चाताप जैसा अधिक स्पष्ट धर्मशास्त्रीय पद नहीं जोड़ा गया।
- source_word: אֵלָיו
  choice: उसकी ओर
  rationale: इब्रानी में केवल पुरुषवाचक सर्वनाम है। प्रसंग में इसका संकेत परमेश्वर की ओर होने की संभावना है, फिर भी पद में अनुपस्थित दिव्य उपाधि नहीं जोड़ी गई।
- source_word: אַל תִּתְעַבֵּר
  choice: न टाल
  rationale: क्रिया का रूप कठिन है, किंतु पहले खंड की समानांतरता और अगले समय-वाचक वाक्यांश से बार-बार स्थगित करने का अर्थ स्पष्ट होता है।
- source_word: מִיּוֹם אֶל יוֹם
  choice: दिन-प्रतिदिन
  rationale: यह लगातार एक दिन से दूसरे दिन तक टालते रहने का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: क्या लौटने को स्पष्ट रूप से परमेश्वर के पास लौटना या पश्चाताप करना कहा जाए
  choice: पाठ की निहित अभिव्यक्ति ‘उसकी ओर लौटने’ को बनाए रखा गया
  alternative: ‘परमेश्वर की ओर लौटने’ या ‘पश्चाताप करके उसके पास लौटने’
  rationale: प्रसंग में सर्वनाम संभवतः परमेश्वर को सूचित करता है और שוב में मन-फिराव का भाव हो सकता है, पर स्वयं इब्रानी पद केवल ‘उसकी ओर’ कहता है। इसलिए निहित धर्मशास्त्रीय अर्थ को स्पष्ट जोड़कर तनाव समाप्त नहीं किया गया।
- issue: कठिन इब्रानी क्रिया תִּתְעַבֵּר का अर्थ
  choice: ‘न टाल’
  alternative: ‘देर न कर’, ‘आगे न बढ़ा’, या ‘लापरवाही न कर’
  rationale: क्रिया स्वयं कठिन है, लेकिन समानांतर पहले खंड और ‘दिन से दिन’ पदबंध के कारण स्थगन का अर्थ सर्वाधिक संगत है। इस स्थान का यूनानी पाठ बहुत भिन्न है, इसलिए उसने इब्रानी पाठ को नियंत्रित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण निषेधात्मक शैली रखी गई है। ‘उसकी ओर’ मूल की अस्पष्टता बचाता है, जबकि ‘दिन-प्रतिदिन न टाल’ सामान्य पाठक के लिए पुनरावृत्त विलंब का आशय स्पष्ट करता है।
