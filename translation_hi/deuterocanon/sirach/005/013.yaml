    text: यहाँ इब्रानी शब्द שִׁבֹּלֶת का अर्थ अनिश्चित है। इसका अर्थ ‘तूफ़ान’ या ‘तेज़ धारा’ हो सकता है; अन्य संदर्भों में इसका अर्थ ‘अनाज की बाली’ भी होता है। यहाँ ‘हर हवा’ के समांतर चित्र के कारण ‘तूफ़ान’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “बातचीत में आदर और अनादर दोनों होते हैं, और मनुष्य की जीभ ही उसके पतन का कारण बनती है।” मुख्य अनुवाद उपलब्ध इब्रानी पाठ पर आधारित है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: मत बनो
  rationale: निषेधसूचक אַל के साथ היה यहाँ चेतावनी के रूप में है; ‘मत बनो’ उसके सीधे और स्वाभाविक हिन्दी रूप को बनाए रखता है।
- source_word: זוֹרֶה
  choice: अनाज फटकनेवाले
  rationale: זרה का कृषि-संबंधी अर्थ हवा में अनाज फटकना है। इस ठोस रूपक को सामान्यीकृत करके केवल ‘डाँवाडोल’ कहना मूल चित्र को खो देता।
- source_word: לְכָל רוּחַ
  choice: हर हवा में
  rationale: यह हर बदलती हवा के अनुसार अनाज फटकने का चित्र प्रस्तुत करता है और अस्थिरता का निहित संकेत भी बनाए रखता है।
- source_word: וּפוֹנֶה דֶרֶך
  choice: और … की राह पर मत चलो
  rationale: शाब्दिक ‘और राह की ओर मुड़नेवाले’ हिन्दी में असहज है। निषेध को दूसरे समांतर खंड में लागू करते हुए ‘राह पर मत चलो’ स्वाभाविक और अर्थसंगत है।
- source_word: שִׁבֹּלֶת
  choice: तूफ़ान
  rationale: यहाँ शब्द का अर्थ अनिश्चित है। ‘तूफ़ान’ पहले खंड की ‘हवा’ से मेल खाने वाला संभावित अर्थ है; अन्य संभावना ‘तेज़ धारा’ को पाद-टिप्पणी में रखा गया है।
