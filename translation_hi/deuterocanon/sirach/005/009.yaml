base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/009.yaml
  text: For mercy and anger are with him[a], and his wrath comes to rest on the wicked.
translation:
  language: hi
  text: क्योंकि दया और क्रोध उसके पास हैं,[a] और उसका प्रकोप दुष्टों पर आ ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-परंपरा में इसके स्थान पर है: “हर हवा में अनाज मत फटकाओ, और हर रास्ते पर मत चलो; ऐसा ही दोहरी ज़बान वाला पापी होता है।” यह उपलब्ध इब्रानी पाठ से बहुत भिन्न है और संभवतः इस पद के किसी दूसरे पाठ-रूप को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक पिछले उपदेश का कारण प्रस्तुत करता है; इसलिए ‘क्योंकि’ प्रसंग के तर्क-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַחֲמִים
  choice: दया
  rationale: बहुवचन रूप यहाँ भाववाचक अर्थ में करुणामय दया को दर्शाता है। आधुनिक हिन्दी में ‘दया’ संक्षिप्त, स्वाभाविक और ‘क्रोध’ के साथ संतुलित है।
- source_word: אַף
  choice: क्रोध
  rationale: शाब्दिक अर्थ ‘नाक’ है, पर इब्रानी मुहावरे में इसका अर्थ क्रोध है। ‘क्रोध’ पहले खंड के लिए स्वाभाविक है और दूसरे खंड के अधिक प्रबल ‘प्रकोप’ से भेद बनाए रखता है।
- source_word: עִמּוֹ
  choice: उसके पास
  rationale: मूल अर्थ ‘उसके साथ’ है। हिन्दी में दया और क्रोध जैसी अमूर्त संज्ञाओं के साथ ‘उसके पास’ अधिक स्वाभाविक रूप से बताता है कि दोनों उसी से संबद्ध हैं, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
- source_word: אֵל
  choice: पर
  rationale: यह पूर्वसर्ग यहाँ प्रकोप के लक्ष्य को चिह्नित करता है; हिन्दी में ‘दुष्टों पर’ स्वाभाविक प्रयोग है।
- source_word: רְשָעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञात्मक रूप का सीधा और गरिमापूर्ण हिन्दी प्रतिरूप है।
- source_word: יָנוּחַ
  choice: आ ठहरेगा
  rationale: נוח का अर्थ विश्राम करना, टिकना या ठहरना है। ‘आ ठहरेगा’ गति से स्थिर होने का भाव और अपूर्ण/भावी क्रिया—दोनों सुरक्षित रखता है।
- source_word: רָגְזוֹ
  choice: उसका प्रकोप
  rationale: यह शब्द तीव्र उत्तेजित क्रोध को व्यक्त करता है। ‘प्रकोप’ पहले खंड के ‘क्रोध’ से भेद रखते हुए दूसरे खंड की अधिक प्रबल न्यायिक गंभीरता प्रकट करता है।
theological_decisions:
- issue: ‘उसके पास’ और ‘उसका प्रकोप’ में सर्वनाम का संदर्भ
  choice: प्रसंग के आधार पर सर्वनाम का संकेत परमेश्वर की ओर माना गया है, पर मूल पाठ की तरह उसका नाम वाक्य में जोड़ा नहीं गया।
  alternative: स्पष्टता के लिए ‘परमेश्वर के पास’ और ‘उसका प्रकोप’ कहना।
  rationale: आसपास का प्रसंग परमेश्वर की दया और न्याय की ओर संकेत करता है, किंतु इस इब्रानी पंक्ति में ईश्वरीय नाम स्पष्टतः नहीं है। इसलिए संदर्भ को समझते हुए भी अनुवाद में निहितता सुरक्षित रखी गई है।
- issue: इब्रानी पाठ और अत्यंत भिन्न यूनानी परंपरा
  choice: विद्यमान इब्रानी पाठ को मुख्य पाठ बनाया गया और यूनानी पाठ को पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया।
  alternative: 'यूनानी पाठ को मुख्य पाठ बनाना: ‘हर हवा के साथ मत फटको, और हर पगडंडी पर मत चलो; ऐसा ही दोहरी जीभ वाला पापी होता है।’'
  rationale: सिराख का इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी परंपरा का पाठ अर्थ की दृष्टि से बहुत अलग है; अतः उसे मौन रूप से मिलाने या त्यागने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘दया/क्रोध’ का संतुलन तथा ‘प्रकोप’ की अधिक तीव्रता सुरक्षित है। वाक्य में परमेश्वर का नाम जोड़कर मूल की निहित अभिव्यक्ति को स्पष्ट नहीं किया गया।
