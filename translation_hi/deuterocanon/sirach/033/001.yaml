base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: hi
  text: याहवे का भय माननेवाला विपत्ति का सामना नहीं करेगा; संकट में भी वह फिर बच निकलेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का हिब्रू पाठ कठिन है। “संकट में” के लिए स्वरांकित हिब्रू का अधिक शाब्दिक अर्थ “जब वह भागता है” है, और अंतिम शब्दों का अनुवाद “वह लौटता है और बच निकलता है” भी हो सकता है। उपलब्ध यूनानी समानांतर इस पद से संबंधित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: याहवे का भय माननेवाला
  rationale: यह सहभागी पद ऐसे व्यक्ति को दर्शाता है जिसकी पहचान याहवे के प्रति श्रद्धापूर्ण भय से होती है। यह हिन्दी में स्वाभाविक है और प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: לֹא יִפְגַּע רָע
  choice: विपत्ति का सामना नहीं करेगा
  rationale: פגע का अर्थ सामना होना या टकराना है, जबकि רָע यहाँ नैतिक बुराई के साथ-साथ अनिष्ट या विपत्ति का अर्थ भी दे सकता है। प्रसंग में ‘विपत्ति’ अधिक स्वाभाविक है और पूर्ण दुःख-मुक्ति का दावा नहीं बनाती।
- source_word: כִּי אִם
  choice: में भी
  rationale: 'यह पहले कथन को सीमित या स्पष्ट करने वाला विरोधात्मक-रियायती संबंध बनाता है: भय माननेवाला संकट से सर्वथा अछूता नहीं, पर उससे बच निकलता है।'
- source_word: בְּנוּסוֹ
  choice: संकट में
  rationale: प्राप्त स्वरांकित रूप का शाब्दिक अर्थ ‘उसके भागने में/जब वह भागता है’ हो सकता है, किंतु अगले पद के साथ यह वाक्य कठिन है। ‘संकट में’ सम्भावित आशय को पठनीय रूप में देता है; शाब्दिक कठिनाई पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: שָׁב וְנִמְלָט
  choice: वह फिर बच निकलेगा
  rationale: שוב क्रियाविशेषणवत् ‘फिर/दोबारा’ का भाव दे सकता है और נמלט बच निकलने को दर्शाता है। इससे कठिन हिब्रू वाक्य हिन्दी में स्वाभाविक रहता है, बिना इसे स्पष्टतः पश्चात्ताप या दैवी उद्धार घोषित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उस नाम को सीधे सुरक्षित रखता है।
- issue: विपत्ति से सुरक्षा के कथन की सीमा
  choice: विपत्ति का सामना नहीं करेगा; संकट में भी वह फिर बच निकलेगा
  alternative: उसे कभी कोई हानि नहीं होगी
  rationale: दूसरा खंड संकट की वास्तविकता मानता है, इसलिए नीति-वचन के विश्वास को पूर्ण दुःख-मुक्ति के निरपेक्ष वादे में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘भय माननेवाला’ श्रद्धापूर्ण भय को व्यक्त करता है। कठिन दूसरे खंड को मुख्य पाठ में पठनीय रखा गया है, जबकि पाठगत और अर्थगत अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
