  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
translation:
  language: hi
  text: हर किसी से सलाह न लो[a], बल्कि हज़ार में से एक को अपना सलाहकार रखो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘हर किसी से परामर्श न करो’ भी हो सकता है। यूनानी क्रिया का अर्थ ‘परामर्श करना’ या ‘सलाह लेना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हज़ार में से एक’ कहावत के रूप में किया गया अतिशयोक्तिपूर्ण कथन है; इसका आशय सलाहकार चुनने में बहुत अधिक सावधानी बरतना है।
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἐν παντὶ ἀνθρώπῳ συμβούλευε
  choice: हर किसी से सलाह न लो
  rationale: यूनानी वाक्यांश का आशय बिना परखे प्रत्येक व्यक्ति से परामर्श लेने की मनाही है। आधुनिक हिन्दी में ‘किसी से सलाह लेना’ स्वाभाविक है और συμβούλευε के परामर्श-संबंधी अर्थ को बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकारात्मक आदेश के विपरीत सकारात्मक निर्देश को स्पष्ट करने वाला स्वाभाविक विरोधसूचक संयोजक।
- source_word: ἕνα ἐκ χιλίων
  choice: हज़ार में से एक
  rationale: यूनानी संरचना का सीधा और कहावत-जैसा रूप, जो सलाहकार चुनने में अत्यधिक सावधानी पर बल देता है।
- source_word: σύμβουλον ἔχε
  choice: अपना सलाहकार रखो
  rationale: σύμβουλον व्यक्ति-वाचक ‘सलाहकार’ है और ἔχε रखने अथवा बनाए रखने का आदेश देता है। ‘अपना’ हिन्दी में संबंध को स्वाभाविक बनाता है, बिना अर्थ में कोई संप्रदायगत विस्तार जोड़े।
