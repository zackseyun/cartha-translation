  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: hi
  text: और एक मित्र ऐसा भी होता है जो शत्रुता में बदल जाता है[a], और वह ऐसा झगड़ा उजागर कर देगा जिससे तुम्हारी बदनामी[b] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शत्रुतापूर्ण हो जाता है।” यूनानी में “शत्रु” के बजाय अमूर्त संज्ञा “शत्रुता” प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह तुम्हारे विरुद्ध निन्दा के रूप में झगड़े को प्रकट कर देगा।” यूनानी वाक्यांश संक्षिप्त है और उसका बल झगड़े पर भी हो सकता है तथा उससे होने वाली बदनामी पर भी।
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: मित्र
  rationale: यह सामान्य व्यक्तिगत संबंध को व्यक्त करता है और प्रसंग में स्वाभाविक है।
- source_word: μεταβαλλόμενος
  choice: रूप ले लेता है
  rationale: यह अवस्था के बदलने की प्रक्रिया व्यक्त करता है और अगले अमूर्त संज्ञा-पद ‘शत्रुता’ के साथ हिन्दी में अपेक्षाकृत स्वाभाविक बैठता है।
- source_word: εἰς ἔχθραν
  choice: शत्रुता का
  rationale: मूल यूनानी में व्यक्ति-वाचक ‘शत्रु’ नहीं, बल्कि अमूर्त संज्ञा ‘शत्रुता’ है; अनुवाद इस भेद को बनाए रखता है।
- source_word: μάχην
  choice: झगड़ा
  rationale: ज्ञान-साहित्य के इस सामाजिक प्रसंग में इसका अर्थ युद्ध से अधिक विवाद या कलह है; ‘झगड़ा’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὀνειδισμοῦ σου
  choice: जिससे तुम्हारी बदनामी हो
  rationale: संक्षिप्त यूनानी संबंध को परिणामसूचक हिन्दी में व्यक्त किया गया है, जबकि उसकी दूसरी सम्भव व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀποκαλύψει
  choice: उजागर कर देगा
  rationale: क्रिया का अर्थ छिपी बात को खोलना या प्रकट करना है; विरोधपूर्ण प्रसंग में ‘उजागर करना’ उपयुक्त है।
