base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/003.yaml
  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: hi
  text: समझदार पुरुष याहवे का वचन समझता है,[b] और उसकी शिक्षा वक्षपट में ऊरीम के समान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘उसकी’ का संबंध याहवे से भी माना जा सकता है: “और याहवे की व्यवस्था/शिक्षा वक्षपट में ऊरीम के समान है।”'
    reason: alternative_reading
  - marker: b
    text: 'यहाँ उपलब्ध इब्रानी पाठ और वर्तमान यूनानी पाठ में बहुत बड़ा अंतर है। यूनानी पाठ है: “पराए राष्ट्रों के विरुद्ध अपना हाथ उठा, और वे तेरा सामर्थ्य देखें।” जहाँ इब्रानी पाठ उपलब्ध है, वहाँ इस अनुवाद ने उसी को प्राथमिक आधार माना है।'
    reason: textual_variant
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: समझदार पुरुष
  rationale: यह अनुवाद व्याकरणिक पुल्लिंग एकवचन और ज्ञान-साहित्य में वर्णित विवेकी व्यक्ति—दोनों को बनाए रखता है; ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָבִין
  choice: समझता है
  rationale: क्रिया का बोध किसी बात को ठीक प्रकार ग्रहण करने से है; ‘समझता है’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: דְּבַר יְהֹוָה
  choice: यहवे का वचन
  rationale: דָּבָר यहाँ दैवी कथन या संदेश के अर्थ में सबसे स्वाभाविक है। पवित्र नाम יְהֹוָה को ‘यहवे’ के रूप में रखा गया है।
- source_word: וְתוֹרָתוֹ
  choice: और उसकी शिक्षा
  rationale: תּוֹרָה का शिक्षापरक अर्थ ‘शिक्षा’ से अधिक स्पष्ट होता है और ‘व्यवस्था’ से उत्पन्न केवल कानूनी अर्थ से बचता है। ‘उसकी’ मूल इब्रानी के प्रत्यय की संदिग्धता बनाए रखता है।
- source_word: כְּאוּרִים
  choice: ऊरीम के समान
  rationale: यह याजकीय निर्णय से जुड़ा पारिभाषिक नाम है; इसलिए इसे ‘ज्योतियों’ के रूप में अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है।
- source_word: בַּחֹשֶׁן
  choice: वक्षपट में
  rationale: חֹשֶׁן याजक के न्याय-वक्षपट को दर्शाता है। ‘वक्षपट’ इसे युद्ध-कवच समझे जाने से बचाते हुए संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: पवित्र नाम יְהֹוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निजी नाम सीधे आया है; ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण स्वरूप है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: וְתוֹרָתוֹ में एकवचन पुल्लिंग प्रत्यय का संदर्भ
  choice: ‘उसकी शिक्षा’—मुख्य पाठ में इसे समझदार पुरुष से संबंधित समझा गया है
  alternative: यहवे की व्यवस्था/शिक्षा
  rationale: वाक्य की संरचना में पहले उल्लिखित ‘समझदार पुरुष’ संभावित संदर्भ है, पर ‘यहवे’ भी व्याकरणतः संभव है। इसलिए सर्वनाम की मूल अस्पष्टता मुख्य पाठ में और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ऊरीम’ और ‘वक्षपट’ जैसे याजकीय पारिभाषिक शब्द मूल सांस्कृतिक संदर्भ को सुरक्षित रखते हैं; पाठगत और सर्वनाम-संबंधी अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
