lexical_decisions:
- source_word: δόξασον
  choice: महिमा दे
  rationale: δοξάζω के एकवचन आज्ञार्थक रूप का मूल अर्थ किसी को महिमा या गौरव देना है। ‘महिमा दे’ यूनानी की धार्मिक और साहित्यिक गरिमा को बनाए रखता है; ‘आदर कर’ अधिक बोलचाल का है, पर अर्थ को कुछ सीमित कर देता।
- source_word: χεῖρα
  choice: हाथ
  rationale: χείρ का सीधा अर्थ ‘हाथ’ है। यूनानी में निश्चित उपपद नहीं है; हिन्दी में भी बिना अतिरिक्त संबंधसूचक सर्वनाम के इसे स्वाभाविक रूप से रखा जा सकता है।
- source_word: βραχίονα
  choice: भुजा
  rationale: βραχίων का अर्थ ‘बाँह/भुजा’ है और बाइबिलीय प्रयोग में यह सामर्थ्य का संकेत भी हो सकता है। ‘भुजा’ इस साहित्यिक संदर्भ में गरिमापूर्ण और स्वाभाविक है।
- source_word: δεξιόν
  choice: दाहिनी
  rationale: δεξιός यहाँ βραχίονα का विशेषण है। ‘दाहिनी’ शारीरिक दिशा का सीधा अर्थ रखता है और सामर्थ्य आदि के संभावित प्रतीकात्मक अर्थ को बिना विस्तार दिए खुला छोड़ता है।
theological_decisions:
- issue: दिए गए यूनानी स्रोत और पद-संदर्भ के बीच गंभीर असंगति; स्रोत में केवल एक खंड सुरक्षित है
  choice: उपलब्ध यूनानी खंड का ही सीधा अनुवाद किया गया और कोई लुप्त संदर्भ नहीं जोड़ा गया
  alternative: अन्य संस्करणों या अनुवादों के आधार पर पूरा पद पुनर्निर्मित करना
  rationale: मूल-भाषा के दिए गए साक्ष्य में केवल ‘δόξασον χεῖρα καὶ βραχίονα δεξιόν’ है और सत्यापन में इसे बड़ी असंगति के रूप में चिह्नित किया गया है। इसलिए अप्रस्तुत शब्द, संबोधन या संबंधसूचक सर्वनाम जोड़ना उचित नहीं है।
- issue: हाथ और दाहिनी भुजा किसकी हैं
  choice: कोई संबंधसूचक सर्वनाम नहीं जोड़ा गया
  alternative: ‘अपने हाथ और अपनी दाहिनी भुजा’ कहना
  rationale: यूनानी खंड में ‘अपने/तेरे’ जैसा कोई स्पष्ट सर्वनाम नहीं है। संदर्भ के अभाव में उसे जोड़ने से वास्तविक अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल खंड के निकट भाषा रखी गई है। ‘महिमा दे’ धार्मिक-साहित्यिक भाव बनाए रखता है। स्रोत में कर्ता, संबोधित व्यक्ति और अंगों के स्वामी का स्पष्ट उल्लेख न होने के कारण हिन्दी में भी उन्हें नहीं जोड़ा गया।
