  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: hi
  text: जब तुम किसी को मित्र बनाओ, तो उसे परखकर मित्र बनाओ[a], और उस पर जल्दी भरोसा मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परीक्षा के समय उसे मित्र बनाओ” अथवा “परख के द्वारा उसे अपना मित्र बनाओ।” यूनानी पद ἐν πειρασμῷ के ये निकट-संबंधित अर्थ संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήσῃ / κτῆσαι
  choice: मित्र बनाओ … मित्र बनाओ
  rationale: κτάομαι का मूल अर्थ ‘प्राप्त करना’ या ‘हासिल करना’ है, पर मित्र के संबंध में आधुनिक हिन्दी में ‘मित्र बनाना’ स्वाभाविक है। क्रिया की पुनरावृत्ति रखी गई है, ताकि यूनानी वाक्य की नीतिवचन-जैसी दृढ़ता बनी रहे।
- source_word: φίλον
  choice: किसी को मित्र
  rationale: φίλον एकवचन में है। ‘किसी को मित्र’ हिन्दी में स्वाभाविक रहते हुए उसी एकवचन व्यक्ति को दर्शाता है।
- source_word: ἐν πειρασμῷ
  choice: परखकर ही
  rationale: πειρασμός यहाँ प्रलोभन की अपेक्षा किसी व्यक्ति की विश्वसनीयता की जाँच या परीक्षा को सूचित करता है। ‘परखकर ही’ साधन और सावधानी—दोनों भाव संक्षेप में व्यक्त करता है; ‘ही’ जल्दबाजी के विरुद्ध उपदेश के बल को स्पष्ट करता है।
- source_word: μὴ ταχὺ
  choice: जल्द … मत
  rationale: ταχὺ यहाँ भरोसा करने में उतावली या शीघ्रता को बताता है। ‘जल्द भरोसा मत करो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐμπιστεύσῃς αὐτῷ
  choice: उस पर … भरोसा मत करो
  rationale: ἐμπιστεύω का अर्थ किसी पर विश्वास या भरोसा रखना है, और हिन्दी में ‘उस पर भरोसा करना’ दत्तिव संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-साहित्य के निर्देश में पुल्लिंग एकवचन संदर्भ
  choice: एकवचन ‘उसे/उस पर’ बनाए रखा गया
  alternative: बहुवचन या आदरसूचक ‘उन्हें/उन पर’
  rationale: यूनानी पाठ प्रतिनिधि व्यक्ति के लिए पुल्लिंग एकवचन रूपों का प्रयोग करता है। हिन्दी के ‘उसे’ और ‘उस पर’ लिंग को अनावश्यक रूप से उभारे बिना संख्या की एकवचनता और मूल संदर्भ को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मित्र बनाओ’ शाब्दिक ‘प्राप्त करो’ की अपेक्षा सामान्य हिन्दी में अधिक स्वाभाविक है, जबकि क्रिया की पुनरावृत्ति मूल यूनानी की संरचना को बनाए रखती है।
