  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: hi
  text: किसी पराए को अपने यहाँ बसा लो[a], तो वह तुम्हें उपद्रवों में उलझा देगा और तुम्हें तुम्हारे अपनों से पराया कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी बाहरी व्यक्ति को अपने घर में रहने दो।” यूनानी पद का आशय किसी ऐसे व्यक्ति को अपने पास निवासी बनाकर रखने से है जो अपने घराने या दायरे का न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  choice: अपने यहाँ बसा लो
  rationale: यह आज्ञार्थक क्रिया किसी को अपने पास निवासी बनाकर रखने का कारणवाचक भाव व्यक्त करती है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀλλότριον
  choice: किसी पराए को
  rationale: ἀλλότριος का अर्थ अपने घराने या दायरे से बाहर का व्यक्ति है। ‘पराया’ इस संबंधपरक विरोध को बचाता है और जातीय अर्थ वाले ‘विदेशी’ से अधिक व्यापक है।
- source_word: διαστρέψει σε ἐν ταραχαῖς
  choice: तुम्हें उपद्रवों में उलझा देगा
  rationale: διαστρέφω और ἐν ταραχαῖς मिलकर अशांति तथा संकट में डालने का व्यावहारिक भाव देते हैं; यहाँ नैतिक रूप से ‘भ्रष्ट करना’ अनावश्यक रूप से संकीर्ण होगा।
- source_word: ἀπαλλοτριώσει σε
  choice: तुम्हें ... पराया कर देगा
  rationale: क्रिया का मूल भाव किसी को अलग या पराया कर देना है। यह चयन ἀλλότριον के साथ मूल यूनानी की शब्दगत प्रतिध्वनि भी बनाए रखता है।
- source_word: τῶν ἰδίων σου
  choice: तुम्हारे अपनों से
  rationale: यूनानी पद शाब्दिक रूप से ‘तुम्हारी अपनी वस्तुओं/अपने लोगों से’ व्यापक अर्थ रखता है। ‘तुम्हारे अपनों’ में परिवार, घराने और निकट संबंधियों का संकेत रहता है, जबकि केवल संपत्ति का अर्थ थोपने से बचा जाता है।
