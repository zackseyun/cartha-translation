  source_fidelity: ‘किसी पराए को अपने यहाँ बसा लो’ accurately conveys the causative imperative παροίκισον with ἀλλότριον, without unnecessarily making the outsider ethnically foreign. ‘उपद्रवों में उलझा देगा’ suitably represents the disruptive force of διαστρέψει σε ἐν ταραχαῖς. ‘तुम्हें तुम्हारे अपनों से पराया कर देगा’ conveys ἀπαλλοτριώσει and preserves the Greek’s deliberate resonance with ἀλλότριον. ‘तुम्हारे अपनों’ naturally favors the relational sense while remaining sufficiently open in conjunction with the note.
