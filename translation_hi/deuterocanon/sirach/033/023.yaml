lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: अपने सभी कामों में
  rationale: यह पदबंध πᾶσι की व्यापकता और ἔργοις के सामान्य अर्थ ‘कामों/कार्यों’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γίνου
  choice: बनो
  rationale: γίνομαι का वर्तमान मध्यवाच्य आज्ञार्थक रूप यहाँ आचरण के विषय में आग्रह करता है; ‘बनो’ उसके आज्ञार्थक बल को स्वाभाविक ढंग से रखता है।
- source_word: ὑπεράγων
  choice: उत्कृष्ट
  rationale: यह शब्द सामान्य स्तर से आगे बढ़ने या श्रेष्ठ ठहरने का भाव देता है। ‘उत्कृष्ट’ प्रशंसात्मक अर्थ को बनाए रखता है, बिना अनावश्यक रूप से दूसरों के साथ प्रत्यक्ष तुलना किए।
- source_word: μὴ δῷς
  choice: मत लगाओ
  rationale: μή के साथ aorist subjunctive निषेध व्यक्त करता है। हिन्दी में ‘कलंक मत लगाओ’ अक्षरशः ‘मत दो’ की अपेक्षा अधिक स्वाभाविक है और कर्ता की जिम्मेदारी बनाए रखता है।
- source_word: μῶμον
  choice: कलंक
  rationale: μῶμον दोष, धब्बे या निंदा का बिंब रखता है। ‘कलंक’ सम्मान के संदर्भ में उस रूपक और सामाजिक अपयश दोनों को स्पष्ट करता है।
- source_word: ἐν τῇ δόξῃ σου
  choice: अपने सम्मान पर
  rationale: इस ज्ञान-साहित्य संबंधी नैतिक संदर्भ में δόξα सामाजिक मान-सम्मान या प्रतिष्ठा को सूचित करता है। ‘सम्मान पर’ हिन्दी में कलंक के रूपक के साथ स्वाभाविक है।
theological_decisions:
- issue: ज्ञान-साहित्य के नैतिक संदर्भ में δόξα का अर्थ
  choice: सम्मान
  alternative: गौरव; प्रतिष्ठा
  rationale: पद का विषय ऐसा आचरण है जिससे व्यक्ति निंदा का पात्र न बने। इसलिए ‘सम्मान’ यहाँ सामाजिक-नैतिक अर्थ को व्यक्त करता है; ‘महिमा’ अनावश्यक रूप से अधिक धार्मिक या ईशतत्त्व-संबंधी अर्थ दे सकती है।
- issue: ὑπεράγων में निहित श्रेष्ठता की मात्रा
  choice: उत्कृष्ट
  alternative: सबसे बढ़कर; श्रेष्ठ
  rationale: मूल शब्द आगे बढ़ने या बढ़कर होने का भाव रखता है, पर संदर्भ यह निश्चित नहीं करता कि तुलना हर दूसरे व्यक्ति से है। ‘उत्कृष्ट’ इस तनाव को बिना अतिशयोक्ति के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कामों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘उत्कृष्ट’ और ‘सम्मान पर कलंक’ ज्ञान-साहित्य की नैतिक गंभीरता बनाए रखते हैं।
