lexical_decisions:
- source_word: ἔγειρον
  choice: भड़का
  rationale: ἐγείρω का यह आज्ञार्थक रूप θυμός के साथ क्रोध को सक्रिय या तीव्र करने का भाव देता है। ‘भड़का’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञा की शक्ति बनाए रखता है।
- source_word: θυμόν
  choice: क्रोध
  rationale: θυμός यहाँ आवेशपूर्ण रोष को दर्शाता है। ‘क्रोध’ सामान्य और गरिमापूर्ण शब्द है तथा अगले ὀργή से कुछ भेद भी बनाए रखता है।
- source_word: ἔκχεον
  choice: उंडेल दे
  rationale: ἐκχέω का मूल बिंब किसी द्रव्य को बाहर उंडेलने का है। ‘उंडेल दे’ उस सजीव रूपक और आज्ञार्थक बल दोनों को सुरक्षित रखता है।
- source_word: ὀργήν
  choice: कोप
  rationale: ὀργή व्यक्त या प्रकट किए गए प्रबल रोष का बोध करा सकता है। ‘कोप’ ऊँचे किंतु समझ में आने वाले रजिस्टर में है और θυμός के लिए प्रयुक्त ‘क्रोध’ की पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: स्रोत की अखंडता और पद-विभाजन
  choice: उपलब्ध यूनानी खंड को स्वतंत्र आज्ञार्थक पंक्ति के रूप में अनूदित किया गया है; आसपास के पदों से कोई शब्द नहीं जोड़ा गया।
  alternative: यदि किसी अन्य संस्करण में पद-विभाजन अलग हो, तो इसे किसी लंबे वाक्य का अंश माना जा सकता है।
  rationale: दिए गए यूनानी साक्ष्य में केवल यही आज्ञार्थक उपवाक्य सुरक्षित है और स्रोत पर ‘major_mismatch’ चिह्नित है। इसलिए अनुवाद उपलब्ध पाठ तक सीमित है और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सजीव आज्ञार्थक शैली। ‘क्रोध’ और ‘कोप’ से यूनानी θυμός और ὀργή के निकटार्थक किंतु अलग शब्दों का सीमित भेद बनाए रखा गया है।
