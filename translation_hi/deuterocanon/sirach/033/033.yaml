  yaml_path: translation/deuterocanon/sirach/033/033.yaml
  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: hi
  text: गधे के लिए चारा, छड़ी और बोझ हैं; दास[a] के लिए रोटी, अनुशासन और काम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ विशेष रूप से ‘घरेलू दास’ है; अनुवाद ‘घर का सेवक’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: चारा
  rationale: यह बहुवचन संज्ञा पशु को दिए जाने वाले आहार को दर्शाती है; हिन्दी में सामूहिक अर्थ वाला ‘चारा’ गधे के संदर्भ में स्वाभाविक और ठोस है।
- source_word: ῥάβδος
  choice: छड़ी
  rationale: इस नीतिवचन-सदृश संदर्भ में शब्द नियंत्रण या सुधार के साधन को दर्शाता है; ‘छड़ी’ इस अर्थ को सहज हिन्दी में बनाए रखती है।
- source_word: φορτία
  choice: बोझ
  rationale: यह उन भारों को दर्शाता है जिन्हें बोझ ढोने वाला पशु उठाता है; हिन्दी में ‘बोझ’ एकवचन रूप में भी सामूहिक अर्थ दे सकता है और यूनानी बहुवचन का आशय सुरक्षित रखता है।
- source_word: ὄνῳ
  choice: गधे के लिए
  rationale: सम्बन्धसूचक सम्प्रदान कारक को हिन्दी में ‘के लिए’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἄρτος
  choice: रोटी
  rationale: यूनानी में ठोस रूप से ‘रोटी’ है; सामान्य ‘भोजन’ कहने के बजाय मूल बिंब रखा गया है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: शब्द में शिक्षा, प्रशिक्षण और सुधार के अर्थ समाहित हो सकते हैं। यहाँ घरेलू श्रम और पहले खंड की छड़ी के समानांतर ‘अनुशासन’ सुधारात्मक तथा निर्माणात्मक दोनों पक्षों को अपेक्षाकृत खुला रखता है।
- source_word: ἔργον
  choice: काम
  rationale: यह श्रम या सौंपे गए कार्य के लिए सीधा, व्यापक और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: οἰκέτῃ
  choice: दास
  rationale: οἰκέτης विशेषतः घर से संबद्ध दास या सेवक को दर्शाता है। ‘दास’ अधीन और बंधुआ सामाजिक स्थिति को नरम किए बिना व्यक्त करता है; घरेलू विशेषता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: घरेलू अधीनता के संदर्भ में οἰκέτῃ का अनुवाद
  choice: दास
  alternative: घर का सेवक / घरेलू सेवक
  rationale: पद में घर के अधीन श्रमिक के भरण-पोषण, अनुशासन और काम की बात है। केवल ‘सेवक’ कहने से बंधुआ सामाजिक स्थिति दब सकती है, जबकि ‘दास’ उसे स्पष्ट रखता है। फिर भी οἰκέτης की विशेष घरेलू छाया और ‘सेवक’ की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा संक्षिप्त, नीतिवचन-सदृश और आधुनिक मानक हिन्दी में रखी गई है। दोनों समानांतर खंडों की सूचीबद्ध संरचना सुरक्षित है; पहले खंड में ‘हैं’ जोड़कर हिन्दी वाक्य को स्वाभाविक बनाया गया है, जबकि दूसरे खंड में उसका लोप समानांतर शैली के अनुरूप है।
