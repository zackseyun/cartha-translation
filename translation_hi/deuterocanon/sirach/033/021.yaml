  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: hi
  text: जब तक तुम जीवित हो और तुममें साँस है, अपने आपको किसी भी मनुष्य के हवाले न करो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘किसी भी देह/मांस के लिए अपने आपको न बदलो’ जैसा असामान्य वाक्य है। इसका अर्थ ‘अपने आपको किसी के हाथ में न सौंपो’ या ‘किसी मनुष्य के अधीन न हो जाओ’ भी हो सकता है।
    reason: ἀλλάσσω के असामान्य आत्मवाचक प्रयोग और πάσῃ σαρκί के शाब्दिक ‘देह/मांस’ तथा व्यक्ति-सूचक अर्थ—दोनों की अनिश्चितता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: जब तक तुम जीवित हो
  rationale: ἕως, ἔτι और वर्तमानकालीन ζῇς मिलकर उस पूरे समय को सूचित करते हैं जिसमें संबोधित व्यक्ति जीवित बना रहता है। यह हिन्दी में स्वाभाविक रूप से उसी कालगत सीमा को व्यक्त करता है।
- source_word: πνοὴ ἐν σοί
  choice: तुममें साँस है
  rationale: πνοή का सीधा अर्थ साँस या श्वास है। यहाँ इसका आशय जीवन के बने रहने से है, पर ‘साँस’ मूल बिंब को बिना अतिरिक्त धार्मिक अर्थ जोड़े सुरक्षित रखता है।
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: अपने आपको … के हवाले न करो
  rationale: ἀλλάσσω का सामान्य अर्थ बदलना या अदला-बदली करना है, पर यहाँ आत्मवाचक कर्म और दत्तिव कारक के साथ यह अपने को दूसरे के अधिकार में सौंपने का भाव देता है। ‘हवाले न करो’ हिन्दी में उस भाव को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: πάσῃ σαρκί
  choice: किसी भी देहधारी के
  rationale: σάρξ का मूल अर्थ ‘देह’ या ‘मांस’ है, पर यहाँ वह किसी मनुष्य के लिए प्रयुक्त है। ‘देहधारी’ मूल देह-संबंधी बिंब को बनाए रखते हुए हिन्दी में व्यक्ति-सूचक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: σάρξ को व्यक्ति-सूचक अर्थ में प्रस्तुत करना
  choice: देहधारी
  alternative: मनुष्य; व्यक्ति; शाब्दिक रूप से ‘देह’
  rationale: पद मनुष्य के अधीन अपने को सौंपने की चेतावनी देता है, पर σάρξ मानवीय देहधर्मिता और नश्वरता का रंग भी रखता है। ‘देहधारी’ उस रंग को पूरी तरह समतल किए बिना बोधगम्य रहता है।
- issue: ἀλλάξῃς से व्यक्त संबंध
  choice: हवाले न करो
  alternative: अधीन न करो; हाथ में न सौंपो; शाब्दिक रूप से ‘न बदलो’
  rationale: यूनानी प्रयोग का ठीक मुहावरेदार बल विवाद्य है। मुख्य पाठ में आत्मसमर्पण या दूसरे के अधिकार में जाने का संभावित भाव रखा गया है, जबकि दूसरे संभव अनुवाद पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देहधारी’ सामान्य बोलचाल से कुछ ऊँचा शब्द है, पर यहाँ वह यूनानी σάρξ की विशिष्टता को सुरक्षित रखते हुए सहज समझ में आता है।
