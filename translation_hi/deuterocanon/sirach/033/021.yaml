review_pass:
  verdict: revise
  source_fidelity: The temporal clause and πνοὴ are conveyed accurately. The main warning appropriately reflects the likely idiomatic force of μὴ ἀλλάξῃς σεαυτόν πάσῃ σαρκί as not placing oneself under another person's control. However, देहधारी is not the most natural Hindi way to render σάρξ used person-referentially here, and the footnote's ‘किसी भी देह के लिए’ risks presenting the dative construction as a settled literal meaning rather than a deliberately awkward literal gloss.
  naturalness: ‘अपने आपको किसी भी देहधारी के हवाले न करो’ is understandable but somewhat stilted in modern Hindi. ‘किसी भी मनुष्य के हवाले न करो’ is idiomatic, direct, and preserves the intended warning. The footnote can retain the Greek’s literal ‘flesh’ wording and explain the ambiguity.
  terminology: ‘साँस’ is a good, non-theological rendering of πνοή. For πάσῃ σαρκί, ‘मनुष्य’ is preferable in the main text because the expression denotes a person; the literal term ‘देह’/‘मांस’ should be retained in a carefully qualified footnote rather than through the unnatural ‘देहधारी.’
  issues:
  - severity: medium
    issue: ‘देहधारी’ is overly formal and semantically broad in this context.
    rationale: Although it attempts to preserve the bodily coloring of σάρξ, it is not a customary Hindi designation for a person and can suggest any embodied being rather than the Greek idiom’s reference to a human person/mortal.
  - severity: low
    issue: The footnote’s literal gloss ‘किसी भी देह के लिए न बदलो’ is misleadingly rigid.
    rationale: The Greek dative and the reflexive use of ἀλλάσσω are unusual. A literal representation should be explicitly marked as awkward and should not imply that ‘for any flesh’ is an unambiguous Hindi equivalent.
  revised_text: जब तक तुम जीवित हो और तुममें साँस है, अपने आपको किसी भी मनुष्य के हवाले न करो[a]।
