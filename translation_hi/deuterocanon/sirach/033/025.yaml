  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: hi
  text: गधे के लिए चारा, डंडा और बोझ हैं; घरेलू दास के लिए रोटी, अनुशासन और काम हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χορτάσματα
  choice: चारा
  rationale: बहुवचन रूप पशु को दिए जाने वाले आहार को सूचित करता है; हिन्दी में ‘चारा’ इसका स्वाभाविक सामूहिक पद है।
- source_word: ῥάβδος
  choice: छड़ी
  rationale: यह ठोस रूप से छड़ी या डंडे को दर्शाता है। यहाँ नियंत्रण या सुधार का भाव निहित हो सकता है, पर ‘छड़ी’ मूल बिंब को बिना अनावश्यक व्याख्या के बनाए रखती है।
- source_word: φορτία
  choice: बोझ
  rationale: यह गधे पर लादी जाने वाली वस्तुओं या भारों को दर्शाता है। ‘बोझ’ हिन्दी में इस संदर्भ का सहज और ठोस अनुवाद है।
- source_word: ὄνῳ
  choice: गधे के लिए
  rationale: यह एकवचन संप्रदान कारक है और निहित ‘हैं’ के साथ उस प्राणी को बताता है जिसके लिए ये चीज़ें हैं।
- source_word: ἄρτος
  choice: रोटी
  rationale: मूल शब्द विशेष रूप से रोटी को दर्शाता है; समानांतर ठोस बिंब बनाए रखने के लिए व्यापक ‘भोजन’ के बजाय ‘रोटी’ रखा गया है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: इस घरेलू प्रबंधन-संबंधी कथन में शब्द शिक्षा, प्रशिक्षण और सुधार के व्यापक क्षेत्र को समेटता है; ‘अनुशासन’ उसके सुधारात्मक पक्ष सहित अर्थ-विस्तार को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔργον
  choice: काम
  rationale: व्यावहारिक घरेलू संदर्भ में यह संज्ञा श्रम या सौंपे गए कार्य को सीधे दर्शाती है; ‘काम’ सरल और आधुनिक हिन्दी है।
- source_word: οἰκέτῃ
  choice: घर के दास
  rationale: οἰκέτης घराने में अधीन और प्रायः बंधुआ स्थिति वाले व्यक्ति को दर्शाता है। ‘घर के दास’ घरेलू संबंध और स्वतंत्र कर्मचारी से भिन्न सामाजिक स्थिति—दोनों को सामने रखता है।
theological_decisions:
- issue: प्राचीन घरेलू पदानुक्रम में οἰκέτῃ का अनुवाद
  choice: घर के दास
  alternative: घर के सेवक
  rationale: यह कथन प्राचीन घराने की अधीनस्थ और बंधुआ सामाजिक व्यवस्था को प्रतिबिंबित करता है। केवल ‘सेवक’ कहने से उस स्थिति की कठोरता दब सकती है; फिर भी शब्द की वैकल्पिक व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अर्ध-पंक्तियों का समानांतर ढाँचा सुरक्षित है। पद प्राचीन सामाजिक व्यवस्था का वर्णन करता है; अनुवाद उसके कठोर स्वर को नरम नहीं करता और न उसे समर्थन देने वाली अतिरिक्त व्याख्या जोड़ता है।
