  text: In the wrath of fire[a], let the one who is saved be consumed[b], and let those who wrong your people find destruction.
translation:
  language: hi
  text: आग के प्रकोप में जो बचाया जा रहा है[a], वह भस्म किया जाए, और तेरी प्रजा के साथ अन्याय करनेवाले विनाश को प्राप्त हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद का अनुवाद “जो बच रहा है,” “बचा हुआ व्यक्ति,” या संदर्भानुसार “बच निकला हुआ व्यक्ति” भी हो सकता है। वर्तमान निष्क्रिय रूप का अधिक सीधा अर्थ “जो बचाया जा रहा है” है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के लिए दिया गया यूनानी स्रोत सिराख 33:11 की अपेक्षित पद-संगति से बहुत भिन्न है। इसलिए यहाँ किसी दूसरी पाठ-परंपरा से सामंजस्य करने के बजाय दिए गए यूनानी पाठ का ही अनुवाद किया गया है।
    reason: textual_variant
