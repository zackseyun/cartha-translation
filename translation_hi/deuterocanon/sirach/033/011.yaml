- source_word: ἐν ὀργῇ πυρὸς
  choice: आग के प्रकोप में
  rationale: यूनानी पदबंध की तीव्र और कुछ असामान्य संबंधवाचक छवि को बनाए रखता है, बिना यह निश्चित किए कि आग स्वयं प्रकोपित है या प्रकोप का साधन।
- source_word: καταβρωθήτω
  choice: भस्म हो जाए
  rationale: निष्क्रिय आज्ञार्थक/कामनार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; आग के प्रसंग में पूर्णतः निगल लिए जाने या नष्ट हो जाने का अर्थ देता है।
- source_word: ὁ σωζόμενος
  choice: बच निकला हुआ
  rationale: वर्तमान कृदन्त का मूल अर्थ ‘बचाया जा रहा व्यक्ति’ भी हो सकता है, पर न्याय के इस प्रसंग में पहले संकट से बच निकले व्यक्ति का अर्थ अधिक संगत है; टिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: तेरी प्रजा के साथ अन्याय करनेवाले
  rationale: ἀδικέω के सक्रिय अन्याय करने के भाव और उसके कर्म ‘तेरी प्रजा’ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: εὕροισαν ἀπώλειαν
  choice: विनाश को प्राप्त हों
  rationale: यूनानी कामनार्थक भाव तथा ‘विनाश पाना’ की धारणा को गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ σωζόμενος में उद्धार पाए व्यक्ति और बच निकले व्यक्ति के बीच अर्थगत तनाव
  choice: बच निकला हुआ
  alternative: जो बचाया जा रहा है / बचाया गया व्यक्ति
  rationale: न्यायसूचक संदर्भ में विडंबना यह है कि पहले विनाश से बच निकला व्यक्ति भी आग में भस्म हो; फिर भी टिप्पणी में दूसरे संभव अर्थ को छिपाया नहीं गया।
- issue: अपेक्षित सिराख 33:11 से स्रोत-पाठ का बड़ा असामंजस्य
  choice: दिए गए यूनानी पाठ का सीधे अनुवाद
  alternative: अन्य पाठ-परंपरा या पद-संख्या के अनुसार सामंजस्य करना
  rationale: मूल-भाषा स्रोत को प्राथमिकता देते हुए दूसरे पाठ से शब्दावली आयात नहीं की गई; पाठ-संबंधी अनिश्चितता टिप्पणी में स्पष्ट की गई है।
