- source_word: ἡμεῖς
  choice: हमने
  rationale: यूनानी में स्पष्ट सर्वनाम तुलनात्मक जोर देता है; हिन्दी में ‘हमने’ उसे बनाए रखता है।
- source_word: ἔγνωμεν
  choice: हमने ... जाना है
  rationale: γινώσκω के अओरिस्ट को यहाँ ऐसी प्राप्त पहचान के रूप में समझा गया है जो वर्तमान प्रार्थना में प्रासंगिक बनी हुई है; हिन्दी पूर्ण वर्तमान स्वाभाविक है।
