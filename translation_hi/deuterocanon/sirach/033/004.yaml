  alternative: ‘आप महान किए जाएँ’ या ‘काश, आप महान ठहराए जाएँ’
  rationale: यूनानी ऑप्टेटिव इच्छा या विनती व्यक्त करता है। हिन्दी में ‘प्रकट हो’ उसी प्रार्थनात्मक बल को सहजता से पहुँचाता है, बिना यह अर्थ दिए कि परमेश्वर की वास्तविक महानता बढ़नी है।
- issue: दिव्य संबोधन का स्तर
  choice: आदरपूर्ण बहुवचन ‘आप’
  alternative: एकवचन ‘तू’
