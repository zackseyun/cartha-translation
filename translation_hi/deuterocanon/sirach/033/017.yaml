base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: hi
  text: हे प्रभु, उन लोगों पर दया कर जो तेरे नाम से कहलाते हैं[a], और इस्राएल पर भी—उसे पहलौठे पुत्र के समान बना दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरे नाम से कहलाते हैं’ बाइबिल का एक मुहावरा है, जिसका अर्थ है परमेश्वर के अपने लोगों के रूप में पहचाना जाना।
    reason: cultural_note
  - marker: b
    text: 'यूनानी में इस वाक्य का अंत व्याकरण की दृष्टि से कठिन है। इसका अनुवाद यह भी हो सकता है: ‘इस्राएल पर भी, जिसे तूने पहलौठे पुत्र के समान बनाया।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: दया कर
  rationale: अओरिस्ट आज्ञार्थक रूप प्रार्थना में करुणापूर्ण हस्तक्षेप की सीधी विनती व्यक्त करता है।
- source_word: λαόν
  choice: उन लोगों पर
  rationale: λαός सामूहिक रूप से परमेश्वर से संबंधित लोगों की ओर संकेत करता है। हिन्दी में बहुवचन ‘लोगों’ स्वाभाविक है; ‘अपने’ नहीं जोड़ा गया, क्योंकि वह यूनानी में स्पष्ट नहीं है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप κύριε को प्रार्थनापूर्ण और प्रतिष्ठित आधुनिक हिन्दी में ‘हे प्रभु’ कहना स्वाभाविक है।
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: जो तेरे नाम से कहलाते हैं
  rationale: यह चयन यूनानी मुहावरे को बनाए रखता है और परमेश्वर के नाम से पहचाने जाने अथवा उसके अपने माने जाने का भाव व्यक्त करता है।
- source_word: Ἰσραήλ
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: πρωτογόνῳ
  choice: पहलौठे पुत्र के समान
  rationale: ‘पहलौठा’ प्रथम जन्मे की विशेष हैसियत व्यक्त करता है; ‘पुत्र’ यूनानी में अलग शब्द के रूप में नहीं है, पर इस बाइबलीय उपमा का अभिप्राय हिन्दी में स्पष्ट और स्वाभाविक करता है।
- source_word: ὁμοίωσον
  choice: समान बना दे
  rationale: यह अओरिस्ट आज्ञार्थक रूप है, इसलिए इसे एक नई विनती के रूप में प्रस्तुत किया गया है। डैश कठिन यूनानी वाक्य-विन्यास को बिना कृत्रिम रूप से समतल किए हिन्दी में पठनीय बनाता है।
theological_decisions:
- issue: इस्राएल की ‘पहलौठे’ जैसी स्थिति
  choice: 'अंतिम क्रिया को विनती के रूप में रखा गया है: ‘उसे पहलौठे पुत्र के समान बना दे।’'
  alternative: 'इसे परमेश्वर के पहले किए हुए कार्य का वर्णन समझा जा सकता है: ‘जिसे तूने पहलौठे पुत्र के समान बनाया।’'
  rationale: ὁμοίωσον का रूप स्वाभाविक रूप से आज्ञार्थक है, इसलिए मुख्य पाठ में विनती को प्राथमिकता दी गई। फिर भी पूरा यूनानी वाक्य-विन्यास कठिन है और परंपरा में इसे पूर्व कार्य का वर्णन भी समझा गया है; इस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, प्रार्थनापूर्ण और गरिमामय हिन्दी अपनाई गई है। ‘तेरे’ और ‘कर/बना दे’ का एकवचन सम्बोधन बाइबलीय प्रार्थना की निकटता बनाए रखता है। डैश समन्वित वाक्य में दूसरी विनती को स्पष्ट करता है, जबकि मूल की वाक्यगत कठिनाई पादटिप्पणी में बताई गई है।
