  text: 'And so look at all the works of the Most High: two by two[a], one opposite the other.'
translation:
  language: hi
  text: 'और इस प्रकार परमप्रधान के सभी कार्यों को देखो: दो-दो, एक दूसरे के सामने[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक दूसरे के अनुरूप।” यूनानी शब्द विरोध या मेल खाते अनुरूप संबंध, दोनों को व्यक्त कर सकता है; प्रसंग में विरोधी जोड़ों के कारण मुख्य अनुवाद चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβλεψον
  choice: ध्यान दो
  rationale: यह आज्ञार्थक क्रिया किसी बात की ओर दृष्टि लगाकर उसे देखने और विचारने का भाव देती है। ‘ध्यान दो’ आधुनिक हिन्दी में स्वाभाविक है और केवल दृश्य रूप से देखने तक अर्थ को सीमित नहीं करती।
- source_word: πάντα τὰ ἔργα
  choice: सभी कार्यों
  rationale: ἔργα परमप्रधान के समस्त कार्यों और रची हुई वस्तुओं के लिए व्यापक रूप से प्रयुक्त है। ‘कार्य’ इस व्यापकता को बनाए रखता है।
- source_word: τοῦ ὑψίστου
  choice: परमप्रधान के
  rationale: ὁ ὕψιστος परमेश्वर की एक स्थापित उपाधि है। ‘परमप्रधान’ उसका संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
- source_word: δύο δύο
  choice: दो-दो करके
  rationale: दो शब्द की पुनरावृत्ति वितरण और जोड़ों में व्यवस्था का संकेत देती है। ‘दो-दो करके’ यूनानी संरचना और उसके भाव दोनों को बनाए रखता है।
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: एक दूसरे के सामने
  rationale: κατέναντι आमने-सामने रखे जाने, विरोध या अनुरूप संगति का भाव दे सकता है। ‘एक दूसरे के सामने’ स्थानिक रूपक और मूल अस्पष्टता को उस सीमा तक सुरक्षित रखता है जहाँ संदर्भ विरोधी जोड़ों की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि ὁ ὕψιστος
  choice: परमप्रधान
  alternative: सर्वोच्च
  rationale: ‘परमप्रधान’ यहूदी ज्ञान-साहित्य में प्रयुक्त ईश्वरीय उपाधि का गरिमापूर्ण और प्रचलित हिन्दी रूप है तथा इसमें अतिरिक्त सांप्रदायिक अर्थ नहीं जुड़ता।
- issue: सृष्टि के जोड़ों का संबंध
  choice: एक दूसरे के सामने
  alternative: एक दूसरे के अनुरूप
  rationale: मूल κατέναντι में विरोध और सामने रखी हुई अनुरूपता दोनों की संभावना है। मुख्य पाठ संदर्भ के विरोधी जोड़ों को उभरने देता है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्य शैली। वाक्य ने यूनानी के आज्ञार्थक स्वर और जोड़े वाली संरचना को बनाए रखा है; पादटिप्पणी का चिह्न [a] मुख्य पाठ में उपस्थित है।
