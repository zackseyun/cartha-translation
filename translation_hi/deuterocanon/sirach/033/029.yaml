  text: क्योंकि निष्क्रियता ने बहुत बुराई सिखाई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὴν
  choice: बहुत
  rationale: यह विशेषण एकवचन κακίαν की मात्रा बताता है; ‘बहुत बुराई’ यूनानी वाक्य की परिमाणात्मक शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह संयोजक पिछले उपदेश का कारण बताता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: κακίαν
  choice: बुराई
  rationale: यहाँ शब्द का अर्थ व्यापक नैतिक बुराई है; ‘बुराई’ इसे किसी खास अर्थ, जैसे दुर्भावना या किसी निश्चित दुर्गुण, तक सीमित नहीं करता।
- source_word: ἐδίδαξεν
  choice: सिखाता है
  rationale: यूनानी कथन का एओरिस्ट यहाँ लोकोक्तिपरक सामान्य सत्य व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल इस भाव को स्वाभाविक रूप से देता है और सिखाने के रूपक को बनाए रखता है।
- source_word: ἡ ἀργία
  choice: निकम्मापन
  rationale: ἀργία काम से खाली रहने या निष्क्रिय पड़े रहने की दशा को दर्शाता है। इस प्रसंग में ‘निकम्मापन’ केवल तटस्थ निष्क्रियता की अपेक्षा चेतावनी के नैतिक आशय को अधिक स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘आलस्य’ के केवल मनोवृत्ति-संबंधी अर्थ तक सीमित हुए।
