  text: Hasten the time and remember the oath[b][a], and let them recount your mighty deeds.
translation:
  language: hi
  text: समय को शीघ्र कर[a] और शपथ को स्मरण कर; और वे तेरे महान कार्यों का विस्तार से वर्णन करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समय’ के लिए ‘नियत समय’ भी सम्भव है (यूनानी औरρόν)।
    reason: lexical_alternative
  - marker: b
    text: स्रोत सत्यापन में इस पद के यूनानी पाठ को अनिश्चित (‘major mismatch’) चिह्नित किया गया है। यहाँ बिना अनुमानित पाठ-संशोधन के उपलब्ध यूनानी शब्दों का अनुवाद किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: σπεῦσον
  choice: शीघ्र ले आ
  rationale: यह σπεύδω का आज्ञार्थक रूप है और समय को जल्दी लाने की प्रार्थना व्यक्त करता है। हिन्दी में केवल ‘जल्दी कर’ अस्पष्ट होता, इसलिए कर्म ‘समय’ के साथ ‘शीघ्र ले आ’ स्वाभाविक और अर्थ-संगत है।
- source_word: καιρόν
  choice: समय
  rationale: καιρός उपयुक्त या नियत समय को सूचित कर सकता है। ‘समय’ मूल की अर्थगत खुलावट बनाए रखता है; ‘नियत समय’ अधिक व्याख्यात्मक होता।
- source_word: μνήσθητι
  choice: स्मरण कर
  rationale: μιμνῄσκομαι के आज्ञार्थक रूप का सीधा, गरिमापूर्ण और प्रार्थना-संगत अनुवाद।
- source_word: ὁρκισμοῦ
  choice: शपथ
  rationale: ὁρκισμός का सामान्य अर्थ शपथ या शपथपूर्वक किया गया वचन है। ‘शपथ’ संक्षिप्त है और यह तय नहीं करता कि उसका विशिष्ट वाचागत संदर्भ क्या है।
- source_word: ἐκδιηγησάσθωσαν
  choice: वे ... पूरा वर्णन करें
  rationale: ἐκδιηγέομαι विस्तार से सुनाने या वर्णन करने का भाव रखता है। ‘पूरा वर्णन करें’ तृतीय पुरुष आज्ञार्थक बल और उपसर्ग से आने वाली पूर्णता—दोनों को व्यक्त करता है।
- source_word: τὰ μεγαλεῖά σου
  choice: तेरे सामर्थी कामों
  rationale: बाइबलीय यूनानी में बहुवचन μεγαλεῖα प्रायः परमेश्वर के महान या सामर्थी कार्यों को दर्शाता है। ‘सामर्थी काम’ स्वाभाविक हिन्दी में उन कार्यों का भाव रखता है, बिना ‘महानताएँ’ जैसे असहज शाब्दिक रूप के।
theological_decisions:
- issue: द्वितीय पुरुष और स्तुति-भाषा का संदर्भ
  choice: पद को परमेश्वर से प्रत्यक्ष प्रार्थना के रूप में रखते हुए ‘तेरे सामर्थी कामों’ का प्रयोग
  alternative: किसी अनिर्दिष्ट संबोधित व्यक्ति के लिए अधिक सामान्य भाषा
  rationale: शपथ स्मरण करने और सामर्थी कामों का वर्णन किए जाने की भाषा यूनानी बाइबलीय प्रार्थना में परमेश्वर को संबोधन के अनुकूल है। फिर भी अनुवाद मूल में अनुपस्थित कोई उपाधि नहीं जोड़ता।
- issue: स्रोत-पाठ की अनिश्चितता
  choice: दिए गए वर्तमान यूनानी पाठ का अनुवाद और पाद-टिप्पणी में अनिश्चितता का स्पष्ट उल्लेख
  alternative: किसी अनुमानित इब्रानी मूल के आधार पर पाठ-संशोधन
  rationale: स्रोत सत्यापन में ‘major mismatch’ दर्ज है। इसलिए अप्रमाणित पुनर्निर्माण करने के बजाय उपलब्ध यूनानी साक्ष्य का अनुसरण किया गया है और पाठगत समस्या पाठक को बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर से निकट प्रत्यक्ष संबोधन के अनुरूप एकवचन ‘तेरे’ और आज्ञार्थक ‘कर’ प्रयुक्त हैं। वाक्य मूल यूनानी के दो समन्वित आदेशों को बनाए रखता है और अनावश्यक धार्मिक पदावली नहीं जोड़ता।
