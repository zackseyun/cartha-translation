base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/002.yaml
  text: One who hates instruction will not become wise[b][a], and he is tossed about in a storm like a ship.
translation:
  language: hi
  text: शिक्षा से घृणा करने वाला बुद्धिमान नहीं बनेगा[a], और वह तूफ़ान में जहाज़ की तरह डगमगाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था” अथवा “उपदेश”; इब्रानी शब्द תוֹרָה में ये सभी अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: स्रोत-सामग्री में दिया गया यूनानी समानांतर किसी दूसरी पंक्ति को दर्शाता प्रतीत होता है; यहाँ सुसंगत इब्रानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: שׂוֹנֵא
  choice: घृणा करने वाला
  rationale: इब्रानी कृदंत यहाँ व्यक्ति के स्वभाव को व्यक्त करने वाली संज्ञा के रूप में प्रयुक्त है। यह अनुवाद सक्रिय विरोध की तीव्रता बनाए रखता है।
- source_word: תוֹרָה
  choice: शिक्षा
  rationale: बेन सिरा के ज्ञान-साहित्यिक संदर्भ में यह शब्द शिक्षा, उपदेश या व्यवस्था का अर्थ दे सकता है। ‘शिक्षा’ यहाँ व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करती है; ‘व्यवस्था’ को पादटिप्पणी में रखा गया है।
- source_word: יֶחְכַּם
  choice: बुद्धिमान नहीं बनेगा
  rationale: यह रूप बुद्धिमत्ता प्राप्त करने या बुद्धिमान बनने के परिणाम को व्यक्त करता है; इसलिए केवल ‘बुद्धिमान नहीं होगा’ की अपेक्षा यह अधिक सटीक है।
- source_word: מִתְמוֹטֵט
  choice: डगमगाता है
  rationale: यह शब्द अस्थिर होकर हिलने या लड़खड़ाने का भाव देता है। जहाज़ और तूफ़ान के बिंब में ‘डगमगाता है’ स्वाभाविक और चित्रात्मक है।
- source_word: בְּמִסְעָר
  choice: तूफ़ान में
  rationale: इब्रानी संज्ञा प्रचंड आँधी या तूफ़ान को दर्शाती है; यह चयन संक्षिप्त और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָּאֳנִיָּה
  choice: जहाज़ की तरह
  rationale: तुलना सीधी है और ‘जहाज़’ तूफ़ानी समुद्र के गंभीर बिंब के अनुकूल है।
theological_decisions:
- issue: ज्ञान-साहित्य में תוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था; उपदेश
  rationale: कथन का प्रसंग ज्ञान और चरित्र से जुड़ा है, इसलिए ‘शिक्षा’ अर्थ को अनावश्यक रूप से विधिक दायरे में सीमित नहीं करती। फिर भी ‘व्यवस्था’ एक वास्तविक और पारंपरिक अर्थ है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दिए गए यूनानी समानांतर का इब्रानी पाठ से मेल न खाना
  choice: उच्च-विश्वसनीयता वाले, अर्थपूर्ण इब्रानी पाठ का अनुवाद
  alternative: दिए गए यूनानी वाक्य को आधार बनाना या पद को अनिर्णीत छोड़ना
  rationale: दिया गया यूनानी वाक्य इस इब्रानी पद की विषयवस्तु से मेल नहीं खाता और संभवतः किसी दूसरी पंक्ति को दर्शाता है। उपलब्ध इब्रानी पाठ सुसंगत और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्रधानता दी गई है तथा पाठगत समस्या स्पष्ट रूप से पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। ‘बुद्धिमान नहीं बनेगा’ ज्ञान अर्जित करने के परिणाम को, और ‘डगमगाता है’ तूफ़ान में जहाज़ की अस्थिरता को स्वाभाविक ढंग से व्यक्त करता है।
