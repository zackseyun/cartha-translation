review_pass:
  verdict: revise
  source_fidelity: The rendering correctly retains the future force of κάμψουσιν, the generic singular ‘neck,’ the household-dependent status denoted by οἰκέτῃ, and the two distinct plural terms for instruments of torture and tortures. ‘दास’ is a defensible main-text choice in this coercive context; the footnote appropriately preserves the lexical alternative. ‘यातना के शिकंजे,’ however, denotes clamps or vises more specifically than στρέβλαι. The Greek refers broadly to twisting/stretching torture devices, especially racks.
  naturalness: The Hindi is modern, clear, and appropriately grave. ‘जुआ,’ ‘चमड़े का पट्टा,’ and ‘गर्दन को झुका देंगे’ are natural in context. Replacing the overly specific ‘यातना के शिकंजे’ with ‘यातना-यंत्र’ remains readable while better matching the source’s scope.
  terminology: ‘दुष्ट दास’ accurately reflects κακούργῳ οἰκέτῃ without recasting the adjective as a legal charge. ‘यातनाएँ’ suitably renders βάσανοι. ‘यातना-यंत्र’ distinguishes στρέβλαι as instruments from the ensuing sufferings without asserting a particular apparatus.
  issues:
  - severity: medium
    issue: ‘यातना के शिकंजे’ is too narrow for στρέβλαι.
    rationale: A शिकंजा ordinarily evokes a clamp, vise, or tightening device. στρέβλαι can include racks and other twisting/stretching torture instruments. ‘यातना-यंत्र’ preserves the concrete instrumental sense while avoiding unsupported specificity.
  revised_text: जुआ और चमड़े का पट्टा गर्दन को झुका देंगे, और दुष्ट दास[a] के लिए यातना-यंत्र और यातनाएँ हैं।
