  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: hi
  text: जुआ और चमड़े का पट्टा गर्दन को झुका देंगे, और दुष्ट दास[a] के लिए यातना-यंत्र और यातनाएँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’ अथवा ‘घर का सेवक’; यूनानी शब्द οἰκέτῃ घरेलू सेवक को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: जुआ
  rationale: गर्दन झुकाने के प्रसंग में इसका ठोस अर्थ पशु पर रखा जाने वाला ‘जुआ’ है, न कि तराजू।
- source_word: ἱμάς
  choice: चमड़े का पट्टा
  rationale: यह चमड़े की पट्टी या तस्मे को सूचित करता है; ‘चमड़े का पट्टा’ साधारण आधुनिक हिन्दी में स्पष्ट है और बंधन के चित्र को बनाए रखता है।
- source_word: κάμψουσιν
  choice: झुका देंगे
  rationale: भविष्यकालीन क्रिया गर्दन को झुकाने की भौतिक और बलपूर्वक क्रिया व्यक्त करती है; यह अनावश्यक व्याख्या जोड़े बिना प्रभाव को स्वाभाविक हिन्दी में रखती है।
- source_word: τράχηλον
  choice: गर्दन को
  rationale: यूनानी में एकवचन सामान्य अर्थ में है; हिन्दी में ‘गर्दन को’ वही प्रतिनिधिक कथन स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἰκέτῃ
  choice: दास
  rationale: शब्द घर के सेवक को सूचित कर सकता है, पर यहाँ कठोर बंधन और यातना का प्रसंग उसकी पराधीन सामाजिक स्थिति को प्रमुख बनाता है; ‘दास’ इसे ‘सेवक’ से अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: κακούργῳ
  choice: दुष्ट
  rationale: यह विशेषण दास के चरित्र को बुरा या अनिष्टकारी बताता है; ‘दुष्ट’ इसे किसी संकीर्ण कानूनी श्रेणी में बदले बिना संक्षेप में व्यक्त करता है।
- source_word: στρέβλαι
  choice: यातना के शिकंजे
  rationale: बहुवचन संज्ञा मरोड़ने या खींचने वाले यातना-यंत्रों को सूचित करती है; ‘यातना के शिकंजे’ हिन्दी पाठक के लिए ठोस और बोधगम्य है।
- source_word: βάσανοι
  choice: यातनाएँ
  rationale: शब्द कठोर शारीरिक पीड़ा या यातना को दर्शाता है; ‘यातनाएँ’ इसकी तीव्रता और बहुवचन दोनों बनाए रखता है।
theological_decisions:
- issue: οἰκέτῃ में पराधीन सेवा की सामाजिक स्थिति
  choice: दास
  alternative: सेवक / घर का सेवक
  rationale: शब्द घरेलू सेवक के लिए भी प्रयुक्त हो सकता है, इसलिए विकल्प को पादटिप्पणी में रखा गया है; किंतु बंधन और बलपूर्वक दंड के इस संदर्भ में ‘दास’ सामाजिक यथार्थ को नरम किए बिना व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गंभीर रखी गई है। ‘चमड़े का पट्टा’ और ‘यातना के शिकंजे’ ठोस चित्र को साधारण पाठक के लिए बोधगम्य बनाते हैं, जबकि मूल पद की कठोरता को नरम नहीं करते।
