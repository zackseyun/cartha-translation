  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: hi
  text: उसे उन कामों में लगाओ जो उसके लिए उचित हों; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी के प्रति अति मत करो, और बिना विवेक के कुछ भी न करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: काम पर लगाओ
  rationale: κατάστησον नियुक्त करने या किसी स्थिति में लगाने का आदेश है और ἔργα कामों को सूचित करता है; यह सहज आधुनिक हिन्दी में दोनों का निर्देशात्मक बल रखता है।
- source_word: καθὼς πρέπει αὐτῷ
  choice: उसकी योग्यता के अनुसार
  rationale: πρέπει यहाँ उसके लिए उचित या अनुकूल काम का भाव देता है। ‘योग्यता के अनुसार’ हिन्दी में स्वाभाविक है, यद्यपि इसका अर्थ केवल कौशल नहीं बल्कि उपयुक्तता भी है।
- source_word: κἂν μὴ πειθαρχῇ
  choice: यदि वह आज्ञा न माने
  rationale: πειθαρχέω अधिकार या आदेश के अधीन आज्ञापालन को व्यक्त करता है; यूनानी में ‘अनुशासन’ कोई अलग संज्ञा नहीं है, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: उसकी बेड़ियाँ भारी कर दो
  rationale: βάρυνον का शाब्दिक अर्थ भारी करना और πέδαι का अर्थ पैरों की बेड़ियाँ है। कठिन दास-अनुशासन संबंधी भाषा को नरम किए बिना रखा गया है।
- source_word: μὴ περισσεύσῃς
  choice: हद से आगे न बढ़ो
  rationale: निषेधात्मक प्रसंग में περισσεύω उचित सीमा लाँघने या अति करने को दर्शाता है; यह मुहावरेदार हिन्दी उसी चेतावनी को स्पष्ट रखती है।
- source_word: ἐν πάσῃ σαρκί
  choice: किसी भी मनुष्य के साथ
  rationale: शाब्दिक रूप ‘हर/किसी भी देह में’ है, पर इस सामी-प्रभावित यूनानी मुहावरे में σάρξ मनुष्य को सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया।
- source_word: ἄνευ κρίσεως
  choice: बिना सोच-विचार के
  rationale: κρίσις यहाँ न्यायिक निर्णय के साथ विवेकपूर्ण विचार का अर्थ भी रख सकता है। प्रसंग में ‘सोच-विचार’ सामान्य हिन्दी में बिना उचित परख के कार्य करने का भाव देता है।
- source_word: μὴ ποιήσῃς μηδέν
  choice: कुछ भी न करो
  rationale: यूनानी निषेध की पूर्ण व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दास या अधीनस्थ व्यक्ति के प्रति कठोर अनुशासन की नैतिक रूप से कठिन भाषा
  choice: काम, आज्ञापालन और भारी बेड़ियों के सीधे उल्लेख को बनाए रखा गया।
  alternative: भाषा को ‘सेवा’ और सामान्य ‘रोक-टोक’ जैसे नरम शब्दों में प्रस्तुत करना।
  rationale: यूनानी पाठ शारीरिक बंधन और बाध्यकारी श्रम की सामाजिक वास्तविकता स्पष्ट रूप से व्यक्त करता है; आधुनिक असुविधा के कारण उसे अस्पष्ट करना स्रोत के प्रति निष्ठा घटाता।
- issue: ἐν πάσῃ σαρκί का अर्थ
  choice: मुख्य पाठ में ‘किसी भी मनुष्य के साथ’, और पादटिप्पणी में शाब्दिक ‘किसी भी देह के साथ’।
  alternative: मुख्य पाठ में ‘किसी भी देह के साथ’ रखना।
  rationale: यहाँ ‘देह’ मनुष्य के लिए मुहावरा है। हिन्दी में शाब्दिक रूप अस्वाभाविक और संभवतः भ्रामक होता; पादटिप्पणी स्रोत की ठोस शब्दावली को पारदर्शी रखती है।
- issue: ἄνευ κρίσεως में κρίσις की अर्थ-सीमा
  choice: ‘बिना सोच-विचार के’
  alternative: ‘बिना न्याय किए’ या ‘बिना निर्णय के’।
  rationale: प्रसंग आचरण में उचित परख और विवेक की माँग करता है। अनुवाद न्यायिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता, जबकि पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और निर्देशात्मक लहजा रखा गया है। नैतिक रूप से कठिन ‘बेड़ियाँ भारी कर दो’ को जानबूझकर नरम नहीं किया गया। ‘हद से आगे न बढ़ो’ और ‘सोच-विचार’ सामान्य पाठक के लिए स्वाभाविक हैं; पद के विपरीत संतुलन—कठोर अनुशासन और अति न करने की चेतावनी—को बनाए रखते हैं।
