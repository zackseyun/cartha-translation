base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/012.yaml
  text: Crush the heads of the rulers of the enemies[a], who say[b], “There is no one except us.”
translation:
  language: hi
  text: शत्रुओं के शासकों के सिर कुचल दे, जो कहते हैं[a], “हमारे सिवा कोई नहीं है।”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “जो कहते हैं” का संबंध “शासकों” से भी हो सकता है और “शत्रुओं” से भी।
    reason: grammatical_ambiguity
  - marker: b
    text: 'अधिक औपचारिक रूप: “हमारे अतिरिक्त कोई नहीं है।”'
    reason: lexical_alternative
  - marker: c
    text: इस पद के उपलब्ध यूनानी स्रोत पर स्रोत-सत्यापन में गंभीर असंगति का संकेत है; यहाँ दिया अनुवाद प्रस्तुत यूनानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: σύντριψον
  choice: कुचल दे
  rationale: यह συντρίβω का एकवचन आज्ञार्थक रूप है और बलपूर्वक तोड़ने या चूर करने का भाव रखता है। ‘कुचल दे’ हिंसक बिंब को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κεφαλὰς
  choice: सिर
  rationale: κεφαλή का बहुवचन यहाँ ठोस शारीरिक बिंब है; इसलिए इसे किसी अमूर्त अर्थ में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ἀρχόντων
  choice: शासकों
  rationale: ἄρχων अधिकार रखनेवालों या शासन करनेवालों को सूचित करता है। ‘शासक’ आधुनिक हिन्दी में राजनीतिक अथवा शासकीय अधिकार को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐχθρῶν
  choice: शत्रुओं के
  rationale: संबंधकारक बहुवचन को निकटता से रखते हुए यह शासकों का शत्रुओं से संबंध व्यक्त करता है। ‘शत्रु शासकों’ भी संभव है, पर वह दोनों संज्ञाओं के बीच के संबंध को अधिक निश्चित कर देता।
- source_word: λεγόντων
  choice: जो कहते हैं
  rationale: वर्तमान कृदन्त का जारी रहनेवाला चरित्र स्वाभाविक हिन्दी संबंधवाचक उपवाक्य से व्यक्त हुआ है। यूनानी में यह रूप ἀρχόντων अथवा ἐχθρῶν—दोनों से व्याकरणतः जुड़ सकता है; हिन्दी वाक्य और पादटिप्पणी इस अस्पष्टता को सुरक्षित रखते हैं।
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: हमारे सिवा कोई नहीं है
  rationale: πλήν के साथ संबंधकारक सर्वनाम अपवर्जन व्यक्त करता है—हमसे अलग कोई नहीं। यह चयन सहज आधुनिक हिन्दी में घमंडपूर्ण अनन्यता को बनाए रखता है और इसे ‘हमारे समान कोई नहीं’ जैसी तुलनात्मक उक्ति नहीं बनाता।
theological_decisions:
- issue: शत्रुओं के दावे का आशय और बल
  choice: “हमारे सिवा कोई नहीं है” को उनकी अपनी अनन्यता या सर्वोच्चता के घमंडपूर्ण दावे के रूप में रखा गया है।
  alternative: “हमारे समान कोई नहीं है”
  rationale: यूनानी पाठ सीधे तौर पर अपवर्जन व्यक्त करता है, तुलना नहीं। अनुवाद किसी अधिक विशिष्ट धार्मिक या राजनीतिक दावे को आरोपित किए बिना मूल तनाव बनाए रखता है।
- issue: λεγόντων का व्याकरणिक संबंध
  choice: मुख्य पाठ में ‘जो कहते हैं’ रखा गया है और पादटिप्पणी में बताया गया है कि यह शासकों या शत्रुओं—दोनों की ओर संकेत कर सकता है।
  alternative: इसे केवल शासकों अथवा केवल शत्रुओं से जोड़ना
  rationale: ἀρχόντων और ἐχθρῶν दोनों संबंधकारक बहुवचन हैं, इसलिए यूनानी रूप वास्तविक व्याकरणिक अस्पष्टता की अनुमति देता है; इसे चुपचाप सुलझाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और प्रार्थनात्मक आज्ञार्थक शैली में है। ‘सिर कुचल दे’ के कठोर बिंब को जानबूझकर नरम नहीं किया गया। ‘शत्रुओं के शासक’ मूल संबंधकारक संरचना के निकट है, जबकि पादटिप्पणी कृदन्त की वास्तविक अस्पष्टता और स्रोत-सत्यापन की अनिश्चितता को खुलकर बताती है।
