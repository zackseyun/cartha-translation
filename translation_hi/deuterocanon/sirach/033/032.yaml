translation:
  language: hi
  text: जिस दिन तुम्हारे जीवन के दिन पूरे हो जाएँ[a], और मृत्यु के समय, विरासत दे दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तुम्हारे जीवन के दिनों की पूर्णता के दिन।”'
    reason: यूनानी मूल के संज्ञात्मक और पुनरुक्तिपूर्ण वाक्य-विन्यास को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  choice: जिस दिन तुम्हारे जीवन के दिन पूरे हों
  rationale: यह अनुवाद यूनानी के समय-सूचक वाक्यांश और ‘जीवन के दिनों की पूर्णता’ को स्वाभाविक हिन्दी में रखता है। ‘पूरे हों’ जीवन के अंत का संकेत देता है, पर उसे अगले पदबंध ‘मृत्यु के समय’ में अनावश्यक रूप से पहले ही स्पष्ट नहीं करता।
- source_word: ἐν καιρῷ τελευτῆς
  choice: मृत्यु के समय
  rationale: τελευτή यहाँ जीवन के अंत अथवा मृत्यु को सूचित करता है; प्रसंग में ‘मृत्यु’ स्पष्ट और स्वाभाविक है।
- source_word: διδὸς
  choice: दे देना
  rationale: वर्तमान आज्ञार्थक रूप सीधा निर्देश देता है। हिन्दी में ‘दे देना’ उचित समय आने पर कार्य पूरा करने की व्यावहारिक आज्ञा को सहज रूप से व्यक्त करता है।
- source_word: κληρονομίαν
  choice: अपनी विरासत
  rationale: κληρονομία पैतृक या उत्तराधिकार में दी जाने वाली संपत्ति है। हिन्दी में ‘विरासत’ इसका स्वाभाविक कानूनी-पारिवारिक अर्थ रखती है; ‘अपनी’ प्रसंग से स्पष्ट दाता-संबंध को व्यक्त करती है, बिना विरासत को रूपक बनाने के।
theological_decisions:
- issue: क्या κληρονομίαν को ठोस उत्तराधिकार-संपत्ति के रूप में रखा जाए या व्यापक नैतिक/आध्यात्मिक ‘विरसा’ माना जाए?
  choice: अपनी विरासत
  alternative: अपना उत्तराधिकार / अपनी संपत्ति
  rationale: पद व्यावहारिक रूप से जीवन के अंत में संपत्ति सौंपने की बात करता है। ‘विरासत’ पारिवारिक और कानूनी ठोसपन बनाए रखती है तथा कोई आध्यात्मिक रूपक आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सहज। मूल की ‘दिन…दिनों’ वाली पुनरुक्ति मुख्य पाठ में यथासंभव बनाए रखी गई है और अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
