  rationale: कृदन्त मुख्य कटाई के बाद शेष वस्तु इकट्ठी करने का भाव देता है। दाखबारी के प्रसंग में यह सहज हिन्दी में बीनने के कार्य को स्पष्ट करता है।
- source_word: ὀπίσω
  choice: के पीछे
  rationale: 'मूल का स्थानिक चित्र सुरक्षित रहता है: वक्ता मुख्य कामगारों के पीछे-पीछे शेष उपज बटोरता है।'
- source_word: τρυγητῶν
