  rationale: क्रिया का मूल भाव जागते रहने या सतर्क रहने का है, जबकि प्रसंग देर तक किए गए परिश्रमी कार्य की ओर संकेत करता है। यह चयन दोनों भावों को समेटता है, और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ὡς
