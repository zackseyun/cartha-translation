  rationale: इस्राएली जातीय और बाइबिलीय संदर्भ में φυλή के लिए ‘गोत्र’ स्थापित और सटीक शब्द है; ‘कुल’ यहाँ उसके जनजातीय अर्थ को कम कर सकता है।
- source_word: Ἰακώβ
  choice: याकूब
  rationale: यूनानी पाठ में स्पष्ट रूप से Ἰακώβ है। ‘याकूब’ रखने से मूल शब्दावली और पूर्वज से जुड़े गोत्रीय संकेत दोनों सुरक्षित रहते हैं।
