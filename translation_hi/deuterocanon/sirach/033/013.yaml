lexical_decisions:
- source_word: συνάγαγε
  choice: इकट्ठा कर
  rationale: यह συνάγω का एओरिस्ट आज्ञार्थक रूप है और सीधे आदेश को व्यक्त करता है। ‘इकट्ठा कर’ आधुनिक हिन्दी में स्वाभाविक है तथा यूनानी क्रिया का बल बनाए रखता है।
- source_word: πάσας
