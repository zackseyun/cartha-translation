base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: hi
  text: बेटे और पत्नी को, भाई और मित्र को, अपने जीते-जी अपने ऊपर अधिकार मत दो; और अपनी संपत्ति किसी दूसरे को मत दो, कहीं ऐसा न हो कि पछताकर तुम्हें उसके लिए विनती करनी पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “कहीं ऐसा न हो कि पछताकर तुम्हें उनके विषय में आवश्यकता पड़े।” यूनानी में ‘उनके’ संपत्ति/वस्तुओं के लिए बहुवचन है। आशय यह हो सकता है कि संपत्ति दे देने के बाद उसे पाने के लिए विनती करनी पड़े।
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ
  choice: बेटे को
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और विशेष रूप से ‘बेटे’ का अर्थ देता है।
- source_word: γυναικί
  choice: पत्नी को
  rationale: घरेलू संबंधों की इस सूची में γυνή का स्वाभाविक अर्थ ‘पत्नी’ है।
- source_word: ἀδελφῷ
  choice: भाई को
  rationale: मूल शब्द पुल्लिंग एकवचन है; इसलिए ‘भाई’ सीधा और सटीक अनुवाद है।
- source_word: φίλῳ
  choice: मित्र को
  rationale: संबंधों की सूची में ‘मित्र’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σέ
  choice: अपने ऊपर अधिकार मत दो
  rationale: ἐξουσία अधिकार, सामर्थ्य या नियंत्रण को सूचित करता है; यह अनुवाद मूल संरचना और आशय दोनों को सुरक्षित रखता है।
- source_word: ἐν ζωῇ σου
  choice: अपने जीते-जी
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से उस चेतावनी की समय-सीमा, अर्थात व्यक्ति के जीवनकाल, को व्यक्त करता है।
- source_word: ἑτέρῳ
  choice: किसी दूसरे को
  rationale: संदर्भ में अनिश्चित व्यक्ति के लिए यह सहज हिन्दी अभिव्यक्ति है।
- source_word: τὰ χρήματά σου
  choice: अपनी संपत्ति
  rationale: χρήματα धन, माल-असबाब या संपत्ति के व्यापक अर्थ में आ सकता है; ‘संपत्ति’ इसे केवल नकदी तक सीमित नहीं करता।
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: कहीं ऐसा न हो कि बाद में पछताकर
  rationale: μεταμέλομαι किए हुए निर्णय पर बाद में पछताने या मन बदलने का भाव रखता है।
- source_word: δέῃ περὶ αὐτῶν
  choice: तुम्हें उसके लिए विनती करनी पड़े
  rationale: वाक्यांश मूलतः उन वस्तुओं के विषय में जरूरतमंद होने को कहता है; संदर्भ में दी हुई संपत्ति के लिए फिर निवेदन करने की विवशता निहित है।
