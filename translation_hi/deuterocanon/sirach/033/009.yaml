  text: एक विरोधी को ऊपर उठा[a], और एक शत्रु को मिटा दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परियोजना-मेटाडेटा में यहाँ यूनानी स्रोत के संबंध में बड़ी पाठगत असंगति दर्ज है। यह अनुवाद उपलब्ध स्वीटे-पाठ का निकटता से अनुसरण करता है और अन्य पाठ-परंपराओं के आधार पर पुनर्निर्माण नहीं करता। यूनानी ἔξαρον का अर्थ ‘ऊपर उठा’ है; संदर्भ के अनुसार ‘उठा खड़ा कर’ भी समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔξαρον
  choice: हटा दे
  rationale: यह ἐξαίρω का आज्ञार्थक रूप है, जिसका अर्थ ‘उठा लेना’ और प्रसंगानुसार ‘दूर कर देना/हटा देना’ हो सकता है। समानांतर दूसरे खंड में शत्रु को मिटाने की बात होने के कारण ‘हटा दे’ स्वाभाविक है, जबकि मूल क्रिया की उठाकर दूर करने की छवि भी बनी रहती है।
- source_word: ἀντίδικον
  choice: विरोधी
  rationale: यह विवाद या मुकदमे में प्रतिपक्षी और व्यापक अर्थ में विरोधी व्यक्ति को दर्शा सकता है। ‘विरोधी’ कानूनी अर्थ तक सीमित किए बिना शत्रुतापूर्ण समानांतरता बनाए रखता है।
- source_word: ἔκτριψον
  choice: मिटा दे
  rationale: ἐκτρίβω का मूल भाव रगड़कर मिटा देना है और शत्रुतापूर्ण संदर्भ में पूरी तरह नष्ट कर देना। ‘मिटा दे’ उसकी तीव्रता और चित्रात्मकता दोनों व्यक्त करता है।
- source_word: ἐχθρόν
  choice: शत्रु
  rationale: यह किसी शत्रुतापूर्ण व्यक्ति के लिए सामान्य शब्द है। अनिश्चित एकवचन को हिन्दी में बिना अनावश्यक निर्धारक के स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: उपलब्ध यूनानी पाठ और परियोजना-मेटाडेटा के बीच बड़ी असंगति
  choice: स्वीटे में उपलब्ध संक्षिप्त यूनानी वाक्य को दो आज्ञाओं के रूप में निकटता से अनुवादित किया गया है।
  alternative: अन्य यूनानी या इब्रानी पाठ-परंपरा के आधार पर पंक्ति का पुनर्निर्माण करना, अथवा ἔξαρον को ‘उठा खड़ा कर’ अनुवादित करना।
  rationale: उपलब्ध यूनानी वाक्य व्याकरण की दृष्टि से स्पष्ट है, पर पाठ-संबंधी बड़ी असंगति दर्ज है। इसलिए व्यापक संदर्भ या किसी दूसरी परंपरा से सामग्री जोड़ने के बजाय इसी साक्ष्य का अनुवाद किया गया है; पहले क्रियापद का संदर्भानुकूल अर्थ ‘हटा दे’ लिया गया है।
translation_notes:
  register: भाषा संक्षिप्त, काव्यात्मक और आज्ञार्थक रखी गई है। ‘विरोधी’ और ‘शत्रु’ मूल के समानांतर किंतु अलग शब्दों को सहज आधुनिक हिन्दी में बनाए रखते हैं।
