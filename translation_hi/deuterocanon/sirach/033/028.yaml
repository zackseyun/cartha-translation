translation:
  language: hi
  text: उसे काम में लगा दे, ताकि वह खाली न बैठे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: लगा दे
  rationale: ἐμβάλλω का मूल अर्थ ‘अंदर डालना’ है, पर εἰς ἐργασίαν के साथ यह किसी को काम में लगाने का मुहावरेदार आदेश है। ‘लगा दे’ आज की स्वाभाविक हिन्दी में आदेश की शक्ति बनाए रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन कर्मकारक सर्वनाम है और प्रसंग में पुरुष दास या सेवक की ओर संकेत करता है। हिन्दी का ‘उसे’ उसी एकवचन व्यक्ति-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς ἐργασίαν
  choice: काम में
  rationale: ἐργασία का अर्थ काम, श्रम या कार्य-व्यवसाय है। ἔμβαλε के साथ ‘काम में लगा दे’ मूल अभिव्यक्ति के निकट भी है और सहज हिन्दी भी।
- source_word: ἵνα μὴ ἀργῇ
  choice: ताकि वह खाली न बैठे
  rationale: ἀργέω का अर्थ निष्क्रिय या बिना काम के रहना है। ‘खाली न बैठे’ इसका स्वाभाविक हिन्दी मुहावरा है और ‘आलसी’ कहकर अनावश्यक नैतिक दोष नहीं जोड़ता।
theological_decisions:
- issue: दासता के प्रसंग में पुल्लिंग एकवचन व्यक्ति का निरूपण
  choice: उसे
  alternative: उसे (लिंग को प्रसंग से पूर्णतः अप्रकट मानना)
  rationale: मूल यूनानी में सर्वनाम पुल्लिंग एकवचन है और निकटवर्ती प्रसंग पुरुष अधीनस्थ की ओर संकेत करता है। हिन्दी में ‘उसे’ व्याकरणतः स्वाभाविक रहते हुए व्यक्ति को बहुवचन या लिंग-समावेशी रूप में नहीं बदलता।
- issue: ἔμβαλε εἰς ἐργασίαν की शाब्दिकता का स्तर
  choice: काम में लगा दे
  alternative: उसे श्रम में डाल दे
  rationale: चुना हुआ रूप यूनानी संरचना की ठोस छवि को पर्याप्त रूप से बचाता है, पर हिन्दी में अस्वाभाविक और कठोर शब्दशः अनुवाद से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, आदेशात्मक और गरिमापूर्ण। ‘खाली न बैठे’ सामान्य पाठक के लिए सहज है तथा निष्क्रियता का अर्थ देता है, आलस्य का अतिरिक्त नैतिक आरोप नहीं।
