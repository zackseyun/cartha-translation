lexical_decisions:
- source_word: κατανοήσατε
  choice: समझ लो
  rationale: यह बहुवचन आज्ञार्थक रूप है, जो श्रोताओं से बात को पहचानने और ग्रहण करने का आग्रह करता है। ‘समझ लो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: केवल अपने लिए ही नहीं
  rationale: 'यह पद वक्ता के लाभ या हित को व्यक्त करता है: उसका परिश्रम मात्र अपने लिए नहीं था। यह हिन्दी प्रयोग उस अर्थ को स्वाभाविक रूप से रखता है।'
- source_word: ἐκοπίασα
  choice: मैंने ... परिश्रम किया
  rationale: κοπιάω कठिन और थकाने वाले श्रम का बोध कराता है। ‘परिश्रम किया’ गरिमापूर्ण, सुबोध और पर्याप्त रूप से सशक्त है।
- source_word: πᾶσιν τοῖς ζητοῦσιν
  choice: उन सबके लिए ... जो ... की खोज करते हैं
  rationale: यह समावेशी और सामान्य अभिव्यक्ति है। चुना हुआ रूप πᾶσιν और वर्तमान कृदन्त ζητοῦσιν, दोनों का आशय स्पष्ट रखता है।
- source_word: παιδείαν
  choice: शिक्षा
  rationale: παιδεία बौद्धिक शिक्षण के साथ नैतिक अनुशासन और चरित्र-निर्माण को भी समेट सकती है। ‘शिक्षा’ मुख्य पाठ में सबसे सहज व्यापक विकल्प है, जबकि टिप्पणी इसकी अर्थ-व्याप्ति स्पष्ट करती है।
