translation:
  language: hi
  text: जब तुम्हारे जीवन के दिन पूरे हो जाएँ[a] और मृत्यु का समय आए, तब अपनी विरासत बाँट देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारे जीवन के दिनों की पूर्णता के दिन।”'
    reason: मूल यूनानी की संज्ञात्मक और कुछ पुनरुक्त संरचना को दिखाने के लिए।
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  choice: जब तुम्हारे जीवन के दिन पूरे हो जाएँ
  rationale: यह यूनानी वाक्यांश की समय-सूचक संरचना और ‘तुम्हारे जीवन के दिनों की पूर्णता’ के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘जीवन के दिन’ को बनाए रखने से मूल की अभिव्यक्ति भी सुरक्षित रहती है।
- source_word: ἐν καιρῷ τελευτῆς
  choice: मृत्यु का समय आए
  rationale: यहाँ καιρός किसी विशेष समय को और τελευτή जीवन के अंतिम अंत, अर्थात मृत्यु, को सूचित करता है। यह रूप हिन्दी में स्वाभाविक है और पहले उपवाक्य के समानांतर चलता है।
- source_word: διάδος
  choice: बाँट देना
  rationale: διαδίδωμι का आज्ञार्थक रूप संपत्ति को अलग-अलग उत्तराधिकारियों में वितरित करने का भाव रखता है। ‘बाँट देना’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: κληρονομίαν
  choice: विरासत
  rationale: यह शब्द उत्तराधिकार में दी या पाई जाने वाली संपत्ति को दर्शाता है; ‘विरासत’ इसका सीधा और प्रचलित हिन्दी रूप है।
