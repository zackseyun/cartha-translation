  yaml_path: translation/deuterocanon/sirach/033/022.yaml
  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
translation:
  language: hi
  text: क्योंकि यह उत्तम है कि तुम्हारे बच्चे तुम्हारे मोहताज हों, न कि तुम अपने बेटों के हाथों की ओर देखो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावानुवाद: “न कि तुम अपने बेटों पर निर्भर रहो।” यूनानी में शाब्दिक रूप से “अपने बेटों के हाथों की ओर देखो” है; यहाँ “हाथ” सहायता या भरण-पोषण का बिंब है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: उत्तम
  rationale: यह तुलनात्मक रूप उस स्थिति को व्यक्त करता है जो अधिक अच्छी या श्रेयस्कर है; ‘उत्तम है कि’ हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τὰ τέκνα
  choice: तुम्हारे बच्चे
  rationale: τέκνα व्यापक शब्द है, जिसमें केवल पुत्र नहीं बल्कि संतान सामान्यतः सम्मिलित है; इसलिए ‘बच्चे’ इसकी व्यापकता बनाए रखता है।
- source_word: δεηθῆναί σου
  choice: तुम्हारे मोहताज हों
  rationale: δέομαι के साथ संबंधकारक यहाँ किसी की आवश्यकता होने या उस पर निर्भर होने का भाव देता है। ‘मोहताज हों’ उस संबंधपरक निर्भरता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: हाथों की ओर देखो
  rationale: यह शाब्दिक बिंब बनाए रखता है, जबकि प्रसंग में किसी से सहायता या भरण-पोषण पाने की आशा करने का संकेत देता है। अर्थ को मुख्य पाठ में पूरी तरह खोल देने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: υἱῶν
  choice: बेटों
  rationale: υἱῶν विशेष रूप से पुत्रों को सूचित करता है। पहले आए व्यापक τέκνα (‘बच्चे’) से शब्दगत अंतर को बनाए रखा गया है।
