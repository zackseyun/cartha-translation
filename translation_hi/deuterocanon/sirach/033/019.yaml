translation:
  language: hi
  text: जनता के प्रतिष्ठित पुरुषों, मेरी सुनो; और सभा के अगुवों, ध्यान से सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατέ
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया सीधे और स्वाभाविक ढंग से ध्यान देने का आह्वान करती है।
- source_word: μεγιστᾶνες
  choice: प्रतिष्ठित पुरुषो
  rationale: यह शब्द ऊँचे पद या सामाजिक प्रभाव वाले पुरुषों को संबोधित करता है। ‘प्रतिष्ठित पुरुष’ इस पुरुषवाचक और उच्च-स्थिति के भाव को सहज आधुनिक हिन्दी में रखता है; ‘कुलीन’ वंशगत अभिजातता का अनावश्यक संकेत दे सकता है।
- source_word: λαοῦ
  choice: प्रजा के
  rationale: यहाँ λαός सामूहिक जनसमुदाय को सूचित करता है। नेतृत्व-संबंधी सार्वजनिक प्रसंग में ‘प्रजा’ स्वाभाविक है।
- source_word: ἡγούμενοι
  choice: अगुओ
  rationale: यह कृदन्त उन लोगों को दर्शाता है जो नेतृत्व करते हैं। संबोधन में ‘अगुओ’ संक्षिप्त और स्वाभाविक है तथा ‘शासकों’ की अपेक्षा कम औपचारिक अर्थ आरोपित करता है।
- source_word: ἐκκλησίας
  choice: सभा के
  rationale: यहाँ आशय एकत्र समुदाय से है, बाद की संस्थागत ‘कलीसिया’ से आवश्यक रूप से नहीं। ‘सभा’ इस सार्वजनिक, एकत्रित समूह के अर्थ को सुरक्षित रखता है।
- source_word: ἐνωτίσασθε
  choice: ध्यान से सुनो
  rationale: दूसरा आज्ञार्थक पहले आह्वान को तीव्र करता है और ध्यानपूर्वक कान लगाने का भाव देता है। ‘ध्यान से सुनो’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: सामाजिक अभिजनों के लिए पुरुषवाचक संबोधन
  choice: प्रजा के प्रतिष्ठित पुरुषो
  alternative: प्रजा के प्रतिष्ठित लोगो
  rationale: यूनानी संज्ञा पुरुषवाचक है और सार्वजनिक जीवन के उच्च-स्थिति वाले पुरुषों को संबोधित करती है; इसलिए लिंग को तटस्थ नहीं किया गया।
- issue: ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मंडली
  rationale: इस प्रसंग में शब्द एकत्र जनसमूह को दर्शाता है। ‘सभा’ बाद की विशिष्ट कलीसियाई संस्था का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संबोधन के अनुकूल रखी गई है। दोनों श्रवण-आज्ञाओं की पुनरुक्ति बनाए रखी गई है, जबकि दूसरी को ‘ध्यान से’ द्वारा तीव्र किया गया है।
