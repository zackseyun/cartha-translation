    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: मित्र
  rationale: यह व्यक्तिगत मित्र या साथी का सामान्य अर्थ देता है; ‘मित्र’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἐν καιρῷ αὐτοῦ
  choice: अपने ही समय में
  rationale: καιρός उपयुक्त या नियत समय को सूचित करता है और αὐτοῦ के साथ मित्र के अपने अनुकूल अवसर की ओर संकेत कर सकता है। यह अभिव्यक्ति मूल की अस्पष्टता बनाए रखती है; ‘साथ देता है’ हिन्दी में वाक्य का आशय स्वाभाविक बनाता है।
- source_word: οὐ μὴ παραμείνῃ
  choice: निश्चय ही साथ नहीं रहेगा
  rationale: οὐ μή और विधिलिंग का मेल प्रबल निषेध व्यक्त करता है। ‘निश्चय ही ... नहीं रहेगा’ उस बल को सुरक्षित रखता है; प्रसंग में παραμένω का आशय संकट में किसी के साथ टिके रहना है।
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: तुम्हारे संकट के दिन
  rationale: θλῖψις संकट, क्लेश या विपत्ति को सूचित करता है। ‘संकट’ सहज आधुनिक हिन्दी है, और ‘... के दिन’ मूल की कालवाचक अभिव्यक्ति को बनाए रखता है।
