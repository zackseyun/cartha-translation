  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: hi
  text: क्योंकि ऐसा मित्र भी होता है जो केवल अपने ही समय में मित्र होता है[a], और तुम्हारे संकट के दिन वह कदापि नहीं ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
