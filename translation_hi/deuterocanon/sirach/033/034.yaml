translation:
  language: hi
  text: बुराई करने वाले से सावधान रहो, क्योंकि वह बुरी योजनाएँ रचता है; कहीं ऐसा न हो कि वह तुम पर सदा के लिए कलंक लगा दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: बुराई करनेवाले से सावधान रहो
  rationale: πρόσεχε के चेतावनीसूचक भाव और ἀπό के दूरी/सावधानी के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। κακοῦργος को केवल कानूनी अर्थ वाले ‘अपराधी’ तक सीमित न करके नैतिक रूप से हानि या बुराई करनेवाले व्यक्ति के रूप में रखा गया है।
- source_word: πονηρὰ
  choice: बुरी योजनाएँ
  rationale: नपुंसकलिंग बहुवचन यहाँ वस्तुगत रूप से ‘बुरी बातें/काम’ दर्शाता है; τεκταίνεται के साथ ‘बुरी योजनाएँ’ हिन्दी में आशय स्पष्ट करता है, बिना किसी खास षड्यंत्र का अर्थ जोड़ने के।
- source_word: τεκταίνεται
  choice: रचता है
  rationale: यह क्रिया सोच-समझकर गढ़ने या युक्ति बनाने का भाव रखती है। ‘रचता है’ योजनाबद्ध निर्माण के रूपक को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: μή ποτε
  choice: कहीं ऐसा न हो कि
  rationale: संभावित अनिष्ट के विरुद्ध चेतावनी देनेवाली यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य।
- source_word: μῶμον
  choice: कलंकित
  rationale: μῶμος में दोष, निंदा, धब्बा या अपयश का अर्थ हो सकता है। क्रियात्मक हिन्दी ‘कलंकित कर दे’ इस हानि को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: अभिव्यक्ति की स्थायी या दीर्घकालिक अवधि को स्पष्ट रूप से बनाए रखता है और उसे केवल ‘कभी’ के अर्थ में कमजोर नहीं करता।
- source_word: δῷ σοι
  choice: तुम्हें … कर दे
  rationale: शाब्दिक ‘तुम्हें दे’ को μῶμον के साथ स्वाभाविक हिन्दी परिणामसूचक रचना में प्रस्तुत किया गया है।
