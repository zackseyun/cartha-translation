  register: आधुनिक मानक हिन्दी; ज्ञान-साहित्य के अनुरूप संक्षिप्त, गंभीर और चेतावनीपूर्ण शैली। ‘बुराई करनेवाले’ व्यापक नैतिक अर्थ रखता है, जबकि ‘कलंकित’ μῶμος के दोष, निंदा और अपयश के अर्थ-क्षेत्र को समेटता है।
