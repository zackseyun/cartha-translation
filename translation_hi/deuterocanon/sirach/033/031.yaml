  yaml_path: translation/deuterocanon/sirach/033/031.yaml
  text: If you have a servant[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: hi
  text: यदि तुम्हारे पास कोई दास[a] हो, तो वह तुम्हारे समान हो, क्योंकि तुमने उसे रक्त से[b] प्राप्त किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक” अथवा “घरेलू सेवक।” यूनानी οἰκέτης प्रायः घर के सेवक के लिए आता है, पर यहाँ उसे “प्राप्त करने” का संदर्भ उसकी बँधी हुई स्थिति को प्रमुख बनाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “रक्त में/से।” संभवतः इसका आशय बड़ी कीमत या प्राणों के जोखिम पर प्राप्त करना है, पर पाठ यह नहीं बताता कि किसका रक्त अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: दास
  rationale: यह शब्द घर में सेवा करने वाले व्यक्ति को सूचित कर सकता है, पर ἐκτήσω (‘प्राप्त किया’) के साथ यहाँ उसकी बँधी हुई सामाजिक स्थिति प्रमुख है; इसलिए ‘दास’ उस वास्तविकता को ‘सेवक’ या ‘नौकर’ से अधिक स्पष्ट रखता है।
- source_word: ἔστω ὡς σύ
  choice: वह तुम्हारे समान हो
  rationale: यह यूनानी के अस्तित्वसूचक आज्ञार्थ ‘वह तुम्हारे जैसा/समान हो’ को बनाए रखता है और ‘उसके साथ अपने समान व्यवहार करो’ जैसी व्याख्यात्मक वृद्धि नहीं करता।
- source_word: ἐν αἵματι
  choice: रक्त से
  rationale: यूनानी पद का सजीव और जानबूझकर अस्पष्ट रूप सुरक्षित रखा गया है; इसे ‘रक्त की कीमत पर’ कहना अर्थ को अधिक निश्चित कर देता।
- source_word: ἐκτήσω
  choice: तुमने ... प्राप्त किया है
  rationale: ‘प्राप्त किया’ κτάομαι के व्यापक अर्थ को व्यक्त करता है, जबकि ‘खरीदा’ ऐसे स्पष्ट व्यापारिक लेन-देन को मान लेता जिसे यूनानी पाठ स्वयं नहीं बताता।
theological_decisions:
- issue: दासता-संबंधी भाषा का अनुवाद
  choice: दास
  alternative: सेवक / घरेलू सेवक
  rationale: व्यक्ति को ‘प्राप्त करने’ का उल्लेख बँधी हुई स्थिति को प्रमुख बनाता है। ‘दास’ सामाजिक वास्तविकता को नरम किए बिना प्रस्तुत करता है, पर पादटिप्पणी οἰκέτης की व्यापक अर्थ-सीमा भी बताती है।
- issue: ‘रक्त से प्राप्त किया’ का आशय
  choice: अस्पष्टता को बनाए रखते हुए ‘रक्त से’
  alternative: रक्त की कीमत पर / अपने प्राणों की कीमत पर
  rationale: पाठ यह निश्चित नहीं करता कि रक्त किसका है या वाक्यांश ठीक किस प्रकार की कीमत अथवा जोखिम की ओर संकेत करता है; इसलिए किसी एक धर्मवैचारिक या ऐतिहासिक व्याख्या को मुख्य पाठ में नहीं रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल यूनानी संरचना के निकट भाषा रखी गई है। ‘रक्त से प्राप्त किया’ सामान्य बोलचाल में असामान्य है, किंतु मूल की सजीव अस्पष्टता सुरक्षित रखने के लिए इसे जानबूझकर बनाए रखा गया है।
