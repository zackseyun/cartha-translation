  yaml_path: translation/deuterocanon/sirach/033/026.yaml
  text: Put your servant to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: hi
  text: अपने दास[a] से काम कराओ, और तुम्हें विश्राम मिलेगा; उसके हाथ खाली रहने दो, और वह स्वतंत्रता खोजेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी παιδί का शाब्दिक अर्थ ‘बालक’ या ‘लड़का’ है, पर यहाँ यह अधिकार के अधीन घर के एक आश्रित व्यक्ति को दर्शाता है। ‘सेवक’ भी संभव है, किंतु उसके स्वतंत्रता खोजने का संदर्भ ‘दास’ अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: अपने दास से काम कराओ
  rationale: आज्ञार्थक क्रिया और ἐν + संबंधकारक पद का स्वाभाविक हिन्दी रूप है। संदर्भ घर के अधीनस्थ व्यक्ति से श्रम कराने का है; ‘अपने’ हिन्दी में संबंध स्पष्ट करने के लिए प्रसंगानुसार जोड़ा गया है।
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: तुम्हें विश्राम मिलेगा
  rationale: यह भविष्यकालीन परिणाम को सहज हिन्दी में व्यक्त करता है और ἀνάπαυσις के ‘विश्राम/राहत’ अर्थ को बनाए रखता है।
- source_word: ἄνες χεῖρας αὐτῷ
  choice: उसके हाथ खाली रहने दो
  rationale: शाब्दिक बिंब ‘हाथ’ को रखते हुए ἀνίημι के यहाँ काम में ढील देने या निष्क्रिय छोड़ने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ζητήσει ἐλευθερίαν
  choice: वह स्वतंत्रता खोजेगा
  rationale: ζητέω की खोजने वाली क्रिया और ἐλευθερία के स्वतंत्रता अर्थ को बिना ‘माँगने’ या ‘विद्रोह करने’ का अतिरिक्त भाव जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: घरेलू श्रम और स्वतंत्रता के संदर्भ में παιδί की सामाजिक स्थिति
  choice: दास
  alternative: सेवक; बालक
  rationale: παιδί का मूल अर्थ ‘बालक/लड़का’ हो सकता है, पर यहाँ अनिवार्य श्रम और स्वतंत्रता खोजने का उल्लेख बंधुआ स्थिति को प्रमुख बनाता है। ‘दास’ इस सामाजिक वास्तविकता को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है, जबकि पादटिप्पणी मूल शब्द की अर्थ-व्याप्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा रखी गई है। मूल पद की कठोर सामाजिक वास्तविकता को नरम नहीं किया गया, और ‘हाथ’ का ठोस बिंब सुरक्षित रखा गया है।
