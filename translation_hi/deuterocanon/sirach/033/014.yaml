translation:
  language: hi
  text: बुराई के विपरीत भलाई है, और मृत्यु के विपरीत जीवन; उसी प्रकार धर्मपरायण व्यक्ति के विपरीत पापी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: के सामने
  rationale: यह पद में तीन बार आए संबंधसूचक शब्द की पुनरावृत्ति और आमने-सामने रखे गए विरोधी युग्मों की संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κακοῦ / ἀγαθόν
  choice: बुराई / भलाई
  rationale: ये सुबोध नैतिक प्रतिशब्द हैं और यूनानी के विशेषणों के संज्ञात्मक प्रयोग को हिन्दी में संतुलित रूप देते हैं।
- source_word: θανάτου / ζωή
  choice: मृत्यु / जीवन
  rationale: दोनों शब्द सीधे और स्पष्ट विरोधी युग्म हैं।
- source_word: οὕτως
  choice: उसी प्रकार
  rationale: यह पहले दो विरोधी युग्मों से अंतिम नैतिक तुलना की ओर संकेत करता है और नीतिवचन-जैसा प्रवाह रखता है।
- source_word: εὐσεβοῦς
  choice: भक्त जन
  rationale: यह परमेश्वर के प्रति श्रद्धा और भक्ति रखने वाले व्यक्ति का अर्थ देता है; आधुनिक हिन्दी में 'धर्मपरायण' की अपेक्षा अधिक सहज है, जबकि एकवचन व्यक्तिगत संदर्भ भी बना रहता है।
- source_word: ἁμαρτωλός
  choice: पापी
  rationale: यह यूनानी के संज्ञात्मक विशेषण का मानक और संक्षिप्त हिन्दी रूप है।
theological_decisions:
- issue: εὐσεβοῦς के एकवचन पुल्लिंग संज्ञात्मक प्रयोग का अनुवाद
  choice: भक्त जन
  alternative: भक्त पुरुष; धर्मपरायण व्यक्ति; भक्त
  rationale: यूनानी रूप व्याकरणतः एकवचन पुल्लिंग है, पर इस ज्ञानोक्ति में प्रतिनिधिक व्यक्ति को सूचित करता है। 'भक्त जन' व्यक्तिगत एकवचन और धार्मिक चरित्र दोनों को व्यक्त करता है, बिना लिंग को अनावश्यक रूप से प्रमुख बनाए।
- issue: विरोध का संबंध
  choice: के सामने
  alternative: के विपरीत
  rationale: ἀπέναντι का मूल स्थानिक रूपक बनाए रखने से तीनों खंडों का समानांतर तनाव सुरक्षित रहता है; 'के विपरीत' अर्थ को स्पष्ट करता, पर रूपक को कुछ सपाट कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और नीतिवचन-सदृश हिन्दी। तीनों खंडों में 'के सामने' की पुनरावृत्ति जानबूझकर रखी गई है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई।
