    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית
  choice: आरम्भ
  rationale: यह शब्द किसी बात के आरम्भ या प्रथम आधार को सूचित कर सकता है; ‘आरम्भ’ इस अर्थगत खुलेपन को बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: हिब्रू ज्ञान-साहित्य में यह मानक और स्वाभाविक हिन्दी पर्याय है।
- source_word: יִרְאַת
  choice: भय मानना
  rationale: ‘भय’ की गंभीरता को बनाए रखते हुए यह प्रचलित हिन्दी बाइबलीय अभिव्यक्ति आदर और आज्ञाकारिता के भाव को भी समेटती है; केवल ‘श्रद्धा’ कहना मूल को अनावश्यक रूप से नरम कर देता।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम चतुरक्षरी नाम को हिन्दी में परिचित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וּמַרְבָּה
  choice: बहुतायत से मिलती है
  rationale: यह रूप वृद्धि या प्रचुरता का भाव देता है। हिब्रू पंक्ति अत्यन्त संक्षिप्त है; हिन्दी में स्वाभाविक विधेय बनाने के लिए ‘मिलती है’ जोड़ा गया है, बिना स्पष्ट कर्ता को मूल से अधिक निश्चित किए।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह प्राथमिक अर्थ को रखता है, यद्यपि हिब्रू में कुशलता और सम्पूर्ण कल्याण की व्यापक छाया भी है।
- source_word: חַיִּים
  choice: जीवन
  rationale: रूप बहुवचन होते हुए भी यहाँ अमूर्त अर्थ में ‘जीवन’ स्वाभाविक है।
- source_word: וּמַרְפֵּא
  choice: चंगाई
  rationale: यह स्वास्थ्य, उपचार या आरोग्य के पुनर्स्थापन का सक्रिय भाव रखता है और सामान्य आधुनिक धार्मिक हिन्दी में सुबोध है।
theological_decisions:
- issue: परमेश्वर के नाम יְהֹוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम देता है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ के रूप में रखा गया है।
- issue: हिब्रू और यूनानी पाठों में बड़ा अन्तर
  choice: मुख्य पाठ में उपलब्ध हिब्रू पंक्ति का अनुवाद और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखना
  alternative: यूनानी पाठ को मुख्य पाठ बनाना
  rationale: इस पद का उपलब्ध हिब्रू साक्ष्य उच्च विश्वसनीयता के साथ दिया गया है, पर यूनानी साक्षी बिल्कुल भिन्न पंक्ति रखता है। इस पाठगत तनाव को मिटाने के बजाय स्पष्ट रूप से दर्ज किया गया है।
- issue: दूसरे खंड का व्याकरणिक सम्बन्ध
  choice: ‘इससे ... मिलती है’
  alternative: ‘और शान्ति, जीवन और चंगाई की बहुतायत’
  rationale: हिब्रू वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। चुनी हुई हिन्दी उसे पूर्ण वाक्य बनाती है और फलस्वरूप सम्बन्ध सुझाती है, पर किसी ऐसे स्पष्ट कर्ता को नहीं जोड़ती जो मूल में नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘भय मानना’ बाइबलीय गंभीरता बनाए रखता है; ‘चंगाई’ उपचार और पुनर्स्थापन का भाव स्पष्ट करती है। मुख्य पाठ में [a] चिह्न संबंधित पाठांतर-पादटिप्पणी से मेल खाता है।
