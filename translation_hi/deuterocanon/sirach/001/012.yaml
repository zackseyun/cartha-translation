base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/012.yaml
  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: hi
  text: यहोवा का भय हृदय को आनंदित करता है[a] और आनंद, अनुग्रह और दीर्घायु देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “जो प्रभु का भय मानता है, अंत में उसका भला होगा, और अपनी मृत्यु के दिन वह आशीष पाएगा।” यूनानी समानांतर पाठ में इस पद का रूप मूलतः भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: यहोवा का भय
  rationale: इब्रानी में यह पद परमेश्वर के प्रति श्रद्धायुक्त भय को व्यक्त करता है। ‘भय’ मूल शब्द की पूरी गंभीरता बनाए रखता है, और יהוה को उसके नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מְשַׂמַּחַת לֵב
  choice: हृदय को आनन्दित करता है
  rationale: क्रिया का कारक भाव स्वाभाविक हिन्दी में ‘आनन्दित करता है’ से व्यक्त होता है; לֵב के लिए ‘हृदय’ भीतरी मनुष्य के भाव और विचार दोनों को समेटता है।
- source_word: וְנוֹתֶנֶת שִׂמְחָה
  choice: और आनन्द ... देता है
  rationale: मूल की समानान्तर रचना और आनन्द-विषयक जानबूझकर की गई पुनरुक्ति को बनाए रखा गया है। हिन्दी में कर्ता ‘भय’ पुल्लिंग होने के कारण ‘देता है’ स्वाभाविक है।
- source_word: חֵן
  choice: कृपा
  rationale: חֵן कृपा, अनुग्रह या प्रसन्नता का पात्र होने का भाव रख सकता है। ‘कृपा’ यहाँ संक्षिप्त और स्वाभाविक है तथा किसी विशिष्ट बाद की धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाता।
- source_word: אֹרֶךְ יָמִים
  choice: दीर्घायु
  rationale: शाब्दिक अर्थ ‘दिनों की लम्बाई’ है; आधुनिक हिन्दी में उसी आशय को स्पष्ट और गरिमापूर्ण ढंग से ‘दीर्घायु’ व्यक्त करता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानान्तर पाठ के बीच बड़ा अन्तर
  choice: मुख्य पाठ में उपलब्ध और सुसंगत इब्रानी पाठ का अनुवाद किया गया है; यूनानी रूप को पादटिप्पणी में पूरा बताया गया है।
  alternative: “जो प्रभु का भय मानता है, अन्त में उसका भला होगा, और अपनी मृत्यु के दिन वह आशीष पाएगा।”
  rationale: जहाँ बेन सीरा का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। फिर भी यूनानी साक्षी एक बिलकुल अलग कथन सुरक्षित रखती है, इसलिए दोनों को मिलाकर तनाव मिटाने के बजाय वैकल्पिक पाठ को स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘आनन्दित करता है’ और ‘दीर्घायु’ सामान्य पाठक के लिए स्पष्ट हैं; पादटिप्पणी का चिह्न मुख्य पाठ में ठीक उसी स्थान पर दिया गया है जहाँ भिन्न यूनानी साक्ष्य की सूचना प्रासंगिक होती है।
