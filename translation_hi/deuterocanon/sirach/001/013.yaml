base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/013.yaml
  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: hi
  text: जो यहोवा का भय मानता है, उसका अन्त भला होगा[a], और अपने जीवन के अन्त में वह आशीष पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का यूनानी साक्षी बहुत भिन्न है: “बुद्धि का आरम्भ प्रभु का भय मानना है, और वह विश्वासयोग्य जनों के साथ, उनके लिए, गर्भ में ही रची गई।” मुख्य पाठ उपलब्ध इब्रानी साक्षी के अनुसार है; स्रोतों में बड़े अन्तर के कारण यूनानी पाठ यहाँ दिया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא
  choice: जो ... का भय मानता है
  rationale: इब्रानी कृदन्त यहाँ संज्ञात्मक रूप से ऐसे व्यक्ति को बताता है जिसकी पहचान यहोवा का भय मानने से होती है। यह हिन्दी में स्वाभाविक रहते हुए सामान्य एकवचन भाव को बनाए रखता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: मूल इब्रानी में स्पष्ट रूप से चतुरक्षरीय दिव्य नाम है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में उसका परिचित और प्रत्यक्ष रूप है।
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: उसका अन्त भला होगा
  rationale: טוב और אַחֲרִית का मुहावरा व्यक्ति के अन्तिम परिणाम पर केन्द्रित है। यह अनुवाद न तो इसे केवल सांसारिक समृद्धि बनाता है, न अस्पष्ट रूप से केवल भविष्य।
- source_word: וּבְאַחֲרִית יָמָיו
  choice: अपने जीवन के अन्त में
  rationale: शाब्दिक भाव ‘उसके दिनों के अन्त में’ है। सहज आधुनिक हिन्दी में ‘अपने जीवन के अन्त में’ वही कालगत ठोसपन व्यक्त करता है और पिछले ‘अन्त’ की पुनरुक्ति भी बनाए रखता है।
- source_word: יִתְבָּרָךְ
  choice: वह आशीष पाएगा
  rationale: इस संदर्भ में हित्पाएल रूप को प्राप्त आशीष के निष्क्रिय भाव में लेना समानान्तर पंक्ति के ‘भले अन्त’ से मेल खाता है। ‘आशीष पाएगा’ आधुनिक हिन्दी में ‘आशीषित होगा’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानान्तर साक्षी के बीच बड़ा पाठांतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्षी का अनुवाद किया गया और यूनानी पाठांतर को पादटिप्पणी में स्पष्ट रखा गया।
  alternative: यूनानी को मुख्य पाठ बनाना, अथवा दोनों पाठों को मिलाकर सामंजस्यपूर्ण पाठ रचना।
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए वह मुख्य आधार है। पर यूनानी साक्षी बिल्कुल भिन्न वाक्य देता है; इस तनाव को छिपाने या दोनों को मिलाने के बजाय पाठांतर के रूप में सुरक्षित रखना उचित है।
- issue: יִתְבָּרָךְ का निष्क्रिय अथवा आत्मवाचक अर्थ
  choice: 'निष्क्रिय अर्थ: ‘वह आशीष पाएगा।’'
  alternative: आत्मवाचक अर्थ, जैसे ‘वह अपने को धन्य मानेगा।’
  rationale: इब्रानी रूप दोनों प्रकार की सम्भावना रख सकता है, पर यहाँ अच्छे अन्त के साथ समानान्तरता प्राप्त आशीष के अर्थ को अधिक उपयुक्त बनाती है; फिर भी अनुवाद यह निर्धारित नहीं करता कि आशीष किस मानवीय या दैवी माध्यम से व्यक्त होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अन्त’ की पुनरावृत्ति इब्रानी समानान्तरता को सुरक्षित रखती है। ‘भय मानना’ बाइबलीय हिन्दी में परिचित है और यहाँ केवल आतंक नहीं, श्रद्धापूर्ण भय का व्यापक भाव रखता है।
