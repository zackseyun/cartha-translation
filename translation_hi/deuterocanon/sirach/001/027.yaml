  text: प्रभु के भय की अवहेलना न करो, और दोचित्त मन से उसके पास न आओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध इब्रानी पाठ यूनानी पाठ से मेल नहीं खाता और संभवतः किसी दूसरे अंश का है। इसलिए यहाँ अनुवाद प्राचीन यूनानी पाठ के आधार पर किया गया है।
    reason: दिए गए इब्रानी पाठ और सिराख 1:27 के यूनानी साक्ष्य में गंभीर पाठ्य/संदर्भ-विसंगति है; अनुवाद के आधार-पाठ को स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: ἀπειθήσῃς
  choice: अवज्ञाकारी न बनो
  rationale: यह क्रिया अविश्वास, न मानने या आज्ञा न मानने का भाव रखती है। यहाँ ‘प्रभु के भय के प्रति’ के साथ ‘अवज्ञाकारी न बनो’ यूनानी वाक्य की असामान्य पर अर्थपूर्ण संरचना को बनाए रखता है।
- source_word: φόβῳ Κυρίου
  choice: प्रभु के भय के प्रति
  rationale: ‘प्रभु का भय’ बाइबलीय श्रद्धा और जवाबदेही की अवधारणा है; इसे केवल ‘श्रद्धा’ कहकर इसकी अर्थ-व्याप्ति संकुचित नहीं की गई।
- source_word: προσέλθῃς αὐτῷ
  choice: उसके पास न आओ
  rationale: προσέρχομαι का सीधा अर्थ निकट आना है। यह उपासना या परमेश्वर की ओर आने का संकेत दे सकता है, पर पाठ उसे स्पष्ट नहीं करता, इसलिए व्यापक अभिव्यक्ति रखी गई।
- source_word: ἐν καρδίᾳ δισσῇ
  choice: बँटे हुए हृदय से
  rationale: δισσός का अर्थ दोहरा या विभाजित है। ‘बँटा हुआ हृदय’ आंतरिक निष्ठा के विभाजन को स्वाभाविक हिन्दी में व्यक्त करता है और कपट या संदेह में से केवल किसी एक अर्थ को निर्णायक नहीं बनाता।
theological_decisions:
- issue: ‘प्रभु के भय’ की आज्ञा का स्वरूप
  choice: ‘प्रभु के भय’ को मूल बाइबलीय पद के रूप में बनाए रखा
  alternative: ‘प्रभु का आदर करने से इनकार न करो’
  rationale: वैकल्पिक रूप अधिक व्याख्यात्मक होता और ‘भय’ में निहित श्रद्धा, विस्मय तथा न्याय-बोध के तनाव को घटा देता।
- issue: ‘बँटे हुए हृदय’ का आशय
  choice: आंतरिक विभाजन को खुला रखा
  alternative: ‘कपटी मन’ या ‘संदेह से भरे मन’
  rationale: यूनानी पद कपट, दोहरी निष्ठा या डगमगाहट की ओर संकेत कर सकता है; किसी एक धर्मवैचारिक अर्थ को थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘अवज्ञाकारी न बनो’ तथा ‘बँटे हुए हृदय’ मूल यूनानी की नैतिक और आध्यात्मिक तीव्रता को बिना अनावश्यक व्याख्या के सुरक्षित रखते हैं।
