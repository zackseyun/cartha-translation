translation:
  language: hi
  text: यहोवा के भय से प्रेम कर; उसी में अपने हृदय को सुखी कर,[a] और मत डर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुखी कर”—इब्रानी क्रिया का अर्थ “धन्य/सुखी ठहराना” भी हो सकता है; इसे “आशीष देना” भी समझा गया है।
    reason: असामान्य इब्रानी क्रिया-प्रयोग की वास्तविक शाब्दिक अनिश्चितता बताना।
  - marker: b
    text: 'प्राचीन यूनानी पाठ यहाँ बिल्कुल भिन्न है: “समझदार का हृदय दृष्टान्त पर विचार करेगा, और श्रोता का कान बुद्धिमान की इच्छा है।”'
    reason: उपलब्ध इब्रानी और यूनानी पाठों के बीच बड़े पाठांतर को पारदर्शी रूप से दर्ज करना।
lexical_decisions:
- source_word: אֱהַב
  choice: प्रेम कर
  rationale: यह एकवचन आज्ञार्थक रूप है। सरल और सीधा अनुवाद मूल की आज्ञा को बनाए रखता है।
- source_word: יִרְאַת יְהֹוָה
  choice: यहोवा का भय
  rationale: यह प्रचलित बाइबिलीय अभिव्यक्ति श्रद्धामय भय को व्यक्त करती है; इसे केवल ‘श्रद्धा’ कहने से मूल में उपस्थित भय का तत्व मिट जाता।
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  choice: उसी में अपने हृदय को आनंदित कर
  rationale: אשר के पिएल रूप को यहाँ ‘सुखी/आनंदित करना’ समझा गया है। ‘आशीष दे’ संभव है, पर अपने ही हृदय को आशीष देने की अभिव्यक्ति हिन्दी में अस्वाभाविक और अर्थ की दृष्टि से कम स्पष्ट है।
- source_word: וְאַל תִּירָא
  choice: और मत डर
  rationale: निषेधात्मक आज्ञा का सीधा अनुवाद है और ‘यहोवा के भय’ तथा ‘मत डर’ के बीच मूल का जानबूझकर बना तनाव सुरक्षित रखता है।
theological_decisions:
- issue: ‘यहोवा के भय’ और ‘मत डर’ के बीच दिखने वाला तनाव
  choice: दोनों कथनों को बिना समतल किए यथावत रखा गया है।
  alternative: पहले ‘भय’ को केवल ‘श्रद्धा’ बनाकर विरोधाभास हटाना।
  rationale: मूल इब्रानी एक ही भय-संबंधी शब्दमूल के द्वारा श्रद्धामय परमेश्वर-भय और सामान्य डर के बीच अर्थपूर्ण अंतर तथा तनाव उत्पन्न करता है।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ हिन्दी पाठक के लिए पहचाना जाने वाला रूप है और नाम को सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एकवचन अनौपचारिक आज्ञार्थक ‘कर/मत डर’ मूल के एकवचन संबोधन को बनाए रखता है; वाक्य में भय संबंधी धर्मवैचारिक तनाव जानबूझकर सुरक्षित है।
