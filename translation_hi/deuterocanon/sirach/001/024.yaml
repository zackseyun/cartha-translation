translation:
  language: hi
  text: बुद्धि के भंडारों में ज्ञान की सूक्तियाँ[b] हैं, पर परमेश्वर-भक्ति[c] पापी को घृणित लगती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस स्थान पर काहाना के उपलब्ध काहिरा गनीज़ा इब्रानी पाठ का आशय लगभग यह है: “वह उसमें आनन्दित होगा और वह उसमें आनन्दित होगी; और उसे सदा-सर्वदा न छोड़ना।” यह यहाँ के यूनानी पाठ से मेल नहीं खाता; इसलिए मुख्य अनुवाद यूनानी साक्ष्य पर आधारित है।'
    reason: textual_variant
  - marker: b
    text: या “समझ के नीतिवचन” अथवा “ज्ञान के दृष्टांत।”
    reason: lexical_alternative
  - marker: c
    text: या “भक्ति,” “धर्मपरायणता,” अथवा “परमेश्वर के प्रति श्रद्धा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: बुद्धि के भंडारों में
  rationale: यूनानी ἐν का स्थानवाचक भाव और θησαυροῖς का भंडार/निधि रूपक सुरक्षित रहता है; σοφίας को स्वाभाविक संबंधकारक के रूप में ‘बुद्धि के’ कहा गया है।
- source_word: παραβολαὶ ἐπιστήμης
  choice: ज्ञान की सूक्तियाँ
  rationale: παραβολαί ज्ञान-साहित्य में दृष्टांत, कहावत या नीतिवचन हो सकता है। ‘सूक्तियाँ’ संक्षिप्त ज्ञानपूर्ण कथनों का स्वाभाविक हिन्दी रूप है, जबकि ἐπιστήμης के संबंधकारक को ‘ज्ञान की’ बनाकर मूल की संरचना और अस्पष्टता पर्याप्त रूप से बनी रहती है।
- source_word: βδέλυγμα
  choice: घृणित
  rationale: यह शब्द तीव्र घृणा या जुगुप्सा की वस्तु का बोध कराता है। ‘घृणित’ आधुनिक हिन्दी में स्पष्ट और प्रबल है तथा अनावश्यक रूप से तकनीकी नहीं है।
- source_word: ἁμαρτωλῷ
  choice: पापी के लिए
  rationale: सम्प्रदान कारक यहाँ पापी के दृष्टिकोण अथवा उसके लिए किसी वस्तु के घृणित होने को व्यक्त करता है।
- source_word: θεοσέβεια
  choice: परमेश्वर का भय मानना
  rationale: θεοσέβεια का अर्थ परमेश्वर के प्रति श्रद्धा, भक्ति और भययुक्त आदर है। ‘परमेश्वर का भय मानना’ सिराख के ज्ञान-साहित्यिक संदर्भ में सहज तथा अर्थपूर्ण है; ‘भक्ति’ विकल्प के रूप में टिप्पणी में रखा गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा असामंजस्य
  choice: मुख्य पाठ का अनुवाद यूनानी साक्ष्य से किया गया है और उपलब्ध इब्रानी पंक्ति को पाठांतर-संबंधी टिप्पणी में दर्ज किया गया है।
  alternative: उपलब्ध काहाना इब्रानी पंक्ति—‘वह उसमें आनन्दित होगा और वह उसमें आनन्दित होगी...’—को मुख्य पाठ बनाया जाए।
  rationale: दिया गया इब्रानी पाठ इस स्थान के यूनानी सिराख 1:24 से अर्थतः मेल नहीं खाता और स्रोत ने इसे major_mismatch कहा है। इसलिए इस पद के सतत और पहचाने हुए पाठ के लिए यूनानी साक्ष्य ग्रहण करना तथा भिन्न इब्रानी पंक्ति को स्पष्ट रूप से बताना पाठ-साक्ष्य के प्रति अधिक ईमानदार है।
- issue: θεοσέβεια की धार्मिक अर्थ-सीमा
  choice: परमेश्वर का भय मानना
  alternative: भक्ति; परमेश्वर के प्रति श्रद्धा
  rationale: यह चयन ईश्वर के प्रति श्रद्धापूर्ण आचरण को व्यक्त करता है और सिराख 1 के प्रमुख विषय ‘प्रभु का भय’ से जुड़ता है, पर किसी सम्प्रदाय-विशेष की परिभाषा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सूक्तियाँ’ ज्ञान-साहित्य का स्वर बनाए रखता है; ‘घृणित’ यूनानी शब्द की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है। सभी टिप्पणियों के चिह्न मुख्य पाठ में दिए गए हैं।
