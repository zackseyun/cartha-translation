  text: One alone is fearsome[b][a], God ruling over all her storehouses.
translation:
  language: hi
  text: बुद्धि की जड़ किसे प्रकट की गई है, और उसकी युक्तियों[b] को किसने जाना है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहाना संस्करण में सुरक्षित काहिरा गनीज़ा की इब्रानी पंक्ति इस पद की यूनानी पाठ-परंपरा से बहुत अलग है। उसका अर्थ लगभग यह है: “केवल एक ही भययोग्य है—परमेश्वर, जो उसके सब भंडारों पर शासन करता है।” इसलिए मुख्य अनुवाद यूनानी पाठ के अनुसार किया गया है।'
    reason: textual_variant
  - marker: b
    text: या “उसकी गूढ़ युक्तियों” अथवा “उसके सूक्ष्म उपायों।” यूनानी शब्द चतुर और जटिल कार्यों को सूचित कर सकता है; यहाँ उसका आशय अनिवार्य रूप से नकारात्मक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: जड़
  rationale: यह शब्द मूलतः ‘जड़’ को दर्शाता है। इससे बुद्धि के छिपे मूल का रूपक बना रहता है। उपलब्ध इब्रानी पंक्ति इस पद की यूनानी परंपरा से मेल नहीं खाती, इसलिए यहाँ यूनानी पाठ को आधार बनाया गया है।
- source_word: σοφίας
  choice: बुद्धि
  rationale: σοφία के लिए यह प्रचलित, स्वाभाविक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: τίνι ἀπεκαλύφθη
  choice: किस पर प्रकट की गई है
  rationale: यह अनुवाद यूनानी क्रिया के कर्मवाच्य अर्थ ‘प्रकट की गई’ को बनाए रखता है और प्रश्न को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πανουργεύματα αὐτῆς
  choice: उसकी सूक्ष्म कार्य-विधियाँ
  rationale: πανουργεύματα चतुराई से किए गए जटिल कार्यों, उपायों या युक्तियों का संकेत दे सकता है। यहाँ बुद्धि के संदर्भ में अनावश्यक नकारात्मक भाव से बचते हुए उसकी जटिल और सूक्ष्म कार्यप्रणाली व्यक्त की गई है।
- source_word: τίς ἔγνω
  choice: किसने जाना है
  rationale: यह कालातीत आलंकारिक प्रश्न के भाव को बनाए रखता है; ‘जाना है’ यूनानी अओरिस्ट को इस प्रसंग में स्वाभाविक हिन्दी पूर्ण अर्थ देता है।
theological_decisions:
- issue: असंगत इब्रानी साक्ष्य के रहते मुख्य पाठ का चयन
  choice: इस पद के मुख्य पाठ का अनुवाद यूनानी समानांतर पाठ से करना
  alternative: उपलब्ध इब्रानी पंक्ति को इसी पद का मूल पाठ मानकर अनुवाद करना
  rationale: दिया गया इब्रानी पाठ Sirach 1:6 की यूनानी परंपरा से स्पष्ट रूप से भिन्न है और स्रोत-सूचना में इसे major_mismatch कहा गया है। इसलिए अनिश्चित या असंगत इब्रानी साक्ष्य की स्थिति में पूर्णतर यूनानी पाठ का अनुसरण किया गया है तथा पाठांतर को पादटिप्पणी में पारदर्शी ढंग से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण प्रश्नात्मक रूप अपनाया गया है। ‘जड़’ का मूल रूपक सुरक्षित रखा गया है और ‘सूक्ष्म कार्य-विधियाँ’ सामान्य पाठक के लिए बोधगम्य रहते हुए यूनानी शब्द की अर्थगत जटिलता को व्यक्त करती हैं।
