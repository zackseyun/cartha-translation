  text: Do not be hypocritical in the mouths of men[a], and watch your lips.
translation:
  language: hi
  text: लोगों के सामने कपट मत करो[a], और अपने होंठों को सँभालो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शब्दशः ‘मनुष्यों के मुँहों में’ है; भावार्थ ‘लोगों के सामने’ या ‘लोगों के बीच’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध इब्रानी साक्ष्य में यहाँ लिखा है, ‘मेरी सब बातें सुनो और उन्हें पूरा करो, और तुम जीवन की पुस्तक में लिखे जाओगे।’ यह पंक्ति इस पद के यूनानी पाठ से मेल नहीं खाती और संभवतः किसी दूसरे स्थान की है; इसलिए मुख्य अनुवाद यूनानी पाठ पर आधारित है।
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: कपट मत करो
  rationale: यह क्रिया कपटपूर्ण व्यवहार या ढोंग करने से रोकती है। ‘कपट मत करो’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और नैतिक चेतावनी के अनुरूप है।
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: लोगों के सामने
  rationale: यूनानी का शब्दशः अर्थ ‘मनुष्यों के मुँहों में’ है, पर हिन्दी में यह अस्पष्ट और अस्वाभाविक होगा। प्रसंगानुकूल ‘लोगों के सामने’ सार्वजनिक या सामाजिक व्यवहार का भाव व्यक्त करता है; मूल बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: καὶ
  choice: और
  rationale: दोनों उपदेशों के सरल समन्वय और समानांतरता को बनाए रखता है।
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: अपने होंठों पर ध्यान रखो
  rationale: यह वाणी के विषय में सावधान रहने का निर्देश है। अनुवाद χείλη के ‘होंठ’ बिंब को बनाए रखते हुए πρόσεχε का सहज हिन्दी रूप देता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ में गंभीर असंगति के कारण आधार-पाठ का चयन
  choice: इस पद का अनुवाद यूनानी पाठ से किया गया है और इब्रानी पंक्ति की असंगति पादटिप्पणी में बताई गई है।
  alternative: 'उपलब्ध इब्रानी पंक्ति का अनुवाद: ‘मेरी सब बातें सुनो और उन्हें पूरा करो, और तुम जीवन की पुस्तक में लिखे जाओगे।’'
  rationale: दिया गया इब्रानी पाठ सिराख 1:28 के यूनानी पाठ से मेल नहीं खाता और संभवतः किसी अन्य स्थान की पंक्ति है। पद की पहचान और पाठ-साक्ष्य की ईमानदार प्रस्तुति के लिए यहाँ यूनानी समानांतर को आधार बनाना उचित है, जबकि इब्रानी साक्ष्य को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले खंड की असामान्य यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि उसका शब्दशः रूप पादटिप्पणी में दिया गया है। दूसरे खंड में ‘होंठ’ का मूल शारीरिक बिंब बनाए रखा गया है।
