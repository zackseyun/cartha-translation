translation:
  language: hi
  text: उसने अपनी इच्छा के अनुसार उसे सभी प्राणियों पर उंडेल दिया[a], और उसे उससे प्रेम करने वालों को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त इब्रानी पाठ में यहाँ “उसे दिया” है; यूनानी समानांतर “उसे उंडेल दिया” का समर्थन करता है। इस पद के इब्रानी साक्ष्य की पाठगत अनिश्चितता के कारण मुख्य पाठ में यूनानी-समर्थित पाठ रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: सभी प्राणियों पर
  rationale: शाब्दिक अर्थ ‘सब शरीरों की ओर/को’ है, पर यह इब्रानी मुहावरा समस्त जीवधारियों या मानवजाति का बोध करा सकता है। ‘सभी प्राणियों पर’ आधुनिक हिन्दी में स्वाभाविक है और ‘उंडेल दिया’ के साथ सहज बैठता है।
- source_word: כִּרְצוֹנוֹ
  choice: अपनी इच्छा के अनुसार
  rationale: רָצוֹן इच्छा, अभिलाषा या प्रसन्नता का अर्थ दे सकता है। यह चुनाव परमेश्वर के स्वतंत्र और उद्देश्यपूर्ण निर्णय को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נְתָנָהּ
  choice: उसे … उंडेल दिया
  rationale: प्रेषित इब्रानी पाठ में נתן से बना रूप ‘उसे दिया’ पढ़ा जाता है, जबकि यूनानी समानांतर में ἐξέχεεν, ‘उंडेल दिया,’ है। इब्रानी साक्ष्य की पाठगत अनिश्चितता और प्रसंग में बुद्धि के व्यापक वितरण को देखते हुए यूनानी-समर्थित अर्थ मुख्य पाठ में रखा गया है और इब्रानी पाठांतर पादटिप्पणी में बताया गया है।
- source_word: וַיִּתְּנָהּ
  choice: और उसे … दे दिया
  rationale: यह क्रिया स्पष्ट रूप से ‘और उसने उसे दिया’ का अर्थ देती है। स्त्रीलिंग प्रत्यय का संकेत ‘बुद्धि’ की ओर है; हिन्दी में ‘उसे’ स्वाभाविक रूप से इस संदर्भ को बनाए रखता है।
- source_word: לְאֹהֲבָיו
  choice: अपने प्रेम रखने वालों को
  rationale: इस कृदंत का अर्थ ‘उससे प्रेम रखने वाले’ है। यह हिन्दी अभिव्यक्ति संबंधपरक अर्थ को स्पष्ट रखती है और ‘उसके प्रेमी’ जैसे संभावित रूप से भ्रामक पद से बचती है।
theological_decisions:
- issue: पहले खंड में इब्रानी साक्ष्य और यूनानी समानांतर के बीच पाठगत अंतर
  choice: इब्रानी पद की संरचना और दूसरे खंड को रखते हुए पहले क्रियापद का यूनानी-समर्थित अर्थ ‘उंडेल दिया’ अपनाया गया।
  alternative: उसने अपनी इच्छा के अनुसार उसे सभी प्राणियों को दिया, और उसे अपने प्रेम रखने वालों को दे दिया।
  rationale: उपलब्ध इब्रानी पंक्ति में पहले और दूसरे खंड में ‘देना’ दोहराया गया है और साक्ष्य को पाठगत रूप से अनिश्चित चिह्नित किया गया है। यूनानी समानांतर बुद्धि के लिए ‘उंडेल दिया’ का निकटवर्ती रूप देता है। मुख्य पाठ में इसे अपनाने पर भी वास्तविक इब्रानी पाठांतर को पादटिप्पणी में स्पष्ट रखा गया है, इसलिए अनिश्चितता छिपाई नहीं गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सभी प्राणियों’ से इब्रानी ‘सब शरीर’ का मुहावरेदार व्यापक अर्थ व्यक्त होता है; ‘उंडेल दिया’ बुद्धि के प्रचुर वितरण की सजीव छवि बनाए रखता है।
