translation:
  language: hi
  text: अपने दान के अनुसार सब प्राणियों के बीच[a]; और उसने बुद्धि उन लोगों को प्रदान की जो उससे प्रेम करते हैं।
  philosophy: optimal-equivalence
  footnotes:
