    text: या ‘सब प्राणियों के साथ’ अथवा ‘सब प्राणियों को’; यूनानी पदबंध यह बता सकता है कि बुद्धि सभी जीवधारियों के बीच बाँटी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: सब प्राणियों के बीच
  rationale: μετά के साथ संबंधवाचक रूप यहाँ ‘साथ/बीच’ का भाव देता है। πάσης σαρκός का शाब्दिक अर्थ ‘समस्त देह’ है, पर इस सामूहिक मुहावरे को आधुनिक हिन्दी में ‘सब प्राणियों’ कहना स्वाभाविक है और इसे केवल मानवजाति तक सीमित नहीं करता।
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: अपने दान के अनुसार
  rationale: δόσις ‘देना’ अथवा ‘दान’ दर्शाता है; यह वाक्यांश बताता है कि बुद्धि का वितरण परमेश्वर के दान के अनुसार है।
- source_word: ἐχορήγησεν
  choice: प्रदान की
  rationale: χορηγέω का अर्थ उपलब्ध कराना, देना या उदारता से प्रदान करना हो सकता है। ‘प्रदान की’ हिन्दी में गरिमापूर्ण और स्वाभाविक है, तथा क्रिया में अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: αὐτήν
  choice: बुद्धि
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ पिछले प्रसंग की ‘बुद्धि’ से है। हिन्दी में केवल ‘उसे’ कहने पर संदर्भ अस्पष्ट हो सकता था, इसलिए संदर्भित संज्ञा दोहराई गई है; ‘की’ स्त्रीलिंग संबंध भी बनाए रखती है।
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: अपने प्रेम करनेवालों को
  rationale: यह उन लोगों को सूचित करता है जो परमेश्वर से प्रेम करते हैं। ‘अपने’ से अन्तिम पुल्लिंग सर्वनाम का परमेश्वर की ओर संकेत स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: स्त्रीलिंग और पुल्लिंग सर्वनामों के संदर्भ
  choice: स्त्रीलिंग αὐτήν को ‘बुद्धि’ और पुल्लिंग αὐτόν को परमेश्वर का संदर्भ माना गया है।
  alternative: स्त्रीलिंग सर्वनाम को निर्जीव ‘उसे’ कहा जा सकता है, या अन्तिम सर्वनाम को अधिक अस्पष्ट रखा जा सकता है।
  rationale: सिराख 1 में बुद्धि स्त्रीलिंग रूप में व्यक्त है और परमेश्वर उसे बाँटनेवाला है। ‘बुद्धि’ तथा ‘अपने प्रेम करनेवालों’ से यही साहित्यिक और धर्मवैचारिक संरचना बनी रहती है, बिना अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। उपलब्ध यूनानी अंश वाक्य के बीच से आरम्भ होता प्रतीत होता है; इसलिए अर्धविराम से खंड की संरचना स्पष्ट की गई है, पर लुप्त क्रिया को पाठ में जोड़ा नहीं गया।
