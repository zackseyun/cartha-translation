  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
translation:
  language: hi
  text: बुद्धि की अभिलाषा रखो, आज्ञाओं का पालन करो, और प्रभु उसे तुम्हें प्रदान करेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध इब्रानी पंक्ति सिराख 1:25 से मेल नहीं खाती; इसलिए यहाँ अनुवाद यूनानी पाठ-साक्ष्य पर आधारित है।
    reason: textual_variant
  - marker: b
    text: या, “यदि तुम बुद्धि की अभिलाषा रखते हो, तो आज्ञाओं का पालन करो, और प्रभु उसे तुम्हें प्रदान करेगा।” आरम्भिक यूनानी कृदंत को शर्तवाचक भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: अभिलाषा रखो
  rationale: उपलब्ध इब्रानी पंक्ति इस पद से मेल नहीं खाती, इसलिए यूनानी साक्ष्य अनुवाद का आधार है। प्रसंग में कृदंत को आग्रहसूचक रूप में लेना स्वाभाविक है; शर्तवाचक अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में इसका मानक और स्वाभाविक हिन्दी रूप; आगे स्त्रीलिंग सर्वनाम से इसका साहित्यिक व्यक्तित्व भी बना रहता है।
- source_word: διατήρησον
  choice: पालन करो
  rationale: आज्ञाओं के संदर्भ में यह आधुनिक हिन्दी का स्वाभाविक प्रयोग है और आज्ञाकारिता का भाव स्पष्ट रखता है।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: धार्मिक-नैतिक आदेशों के लिए प्रतिष्ठित और सुबोध बाइबलीय शब्द।
- source_word: Κύριος
  choice: प्रभु
  rationale: κύριος का प्रचलित, गरिमापूर्ण हिन्दी रूप।
- source_word: χορηγήσει
  choice: प्रदान करेगा
  rationale: सिर्फ ‘देगा’ की अपेक्षा उदारतापूर्वक उपलब्ध कराने का भाव अधिक अच्छी तरह व्यक्त करता है।
- source_word: σοι
  choice: तुम्हें
  rationale: द्वितीय पुरुष एकवचन के दत्तिव अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτήν
  choice: उसे
  rationale: हिन्दी में ‘बुद्धि’ स्त्रीलिंग है, इसलिए ‘उसे’ स्रोत की स्त्रीलिंग संबद्धता को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: इस पद के लिए प्राथमिक पाठ-साक्ष्य
  choice: असंगत इब्रानी पंक्ति के बजाय यूनानी समानांतर पाठ से अनुवाद
  alternative: दी गई इब्रानी पंक्ति को ही सिराख 1:25 मानकर अनुवाद करना
  rationale: दी गई इब्रानी पंक्ति (‘परमेश्वर के दूत उसमें आनन्दित होंगे...’) सिराख 1:25 से मेल नहीं खाती, जबकि यूनानी पाठ इस पद का संगत साक्ष्य देता है। इस पाठगत स्थिति को पादटिप्पणी में स्पष्ट किया गया है।
- issue: σοφία का स्त्रीलिंग साहित्यिक रूप
  choice: ‘बुद्धि’ के लिए ‘उसे’
  alternative: ऐसी पुनर्रचना जिसमें सर्वनाम हटा दिया जाए
  rationale: स्रोत में बुद्धि स्त्रीलिंग है और ज्ञान-साहित्य में उसका व्यक्तिकरण महत्त्वपूर्ण है; हिन्दी का स्त्रीलिंग ‘बुद्धि’ इसे स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सुबोध शैली। ‘अभिलाषा रखो’ आग्रह को व्यक्त करता है, ‘आज्ञाओं का पालन करो’ सामान्य धार्मिक भाषा है, और पाठगत अनिश्चितता को मुख्य पाठ में सुलझाने के बजाय पादटिप्पणी में ईमानदारी से सुरक्षित रखा गया है।
