  text: The root of wisdom—to whom has it been revealed? And who has known her subtleties?[a]
translation:
  language: hi
  text: बुद्धि की जड़ किसे प्रकट हुई है, और उसकी गूढ़ताओं को किसने जाना है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “सर्वोच्च स्थानों में परमेश्वर का वचन बुद्धि का स्रोत है, और उसके मार्ग सनातन आज्ञाएँ हैं।” यहाँ इब्रानी साक्ष्य यूनानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: जड़
  rationale: इब्रानी में ठोस रूपक ‘जड़’ है, जो बुद्धि के उद्गम या मूल आधार को दर्शाता है; यूनानी के ‘स्रोत’ से सामंजस्य बैठाने के बजाय इब्रानी बिंब सुरक्षित रखा गया है।
- source_word: הַחָכְמָה
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में חכמה का स्वाभाविक और मानक हिन्दी अनुवाद।
- source_word: לְמִי נִגְלָה
  choice: किस पर प्रकट हुई है
  rationale: לְמִי के दत्तिव अर्थ और נִגְלָה के निष्क्रिय ‘प्रकट होना’ को सुरक्षित रखता है; ‘किसे प्रकट की गई’ की तुलना में मूल की व्याकरणिक रचना के अधिक निकट है।
- source_word: מַעֲרֻמֶּיהָ
  choice: उसकी गूढ़ बातें
  rationale: यहाँ शब्द बुद्धि की सूक्ष्म, दुर्गम या गहन बातों को सूचित करता है। ‘चालाकियाँ’ अनावश्यक नकारात्मक भाव लाता, जबकि ‘गूढ़ बातें’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ की व्यापकता बनाए रखता है।
- source_word: מִי יָדַע
  choice: किसने जानी हैं
  rationale: ידע के ‘जानना’ और पूर्ण क्रिया के भाव को प्रश्नवाचक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: विद्यमान इब्रानी पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में विद्यमान इब्रानी का अनुवाद और पादटिप्पणी में यूनानी वैकल्पिक पाठ
  alternative: “परम ऊँचे स्थानों में परमेश्वर का वचन बुद्धि का स्रोत है, और उसके मार्ग अनन्त आज्ञाएँ हैं।”
  rationale: इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वास वाला है, इसलिए वह मुख्य पाठ का आधार है। यूनानी पाठ केवल छोटा पाठांतर नहीं, बल्कि मूलतः भिन्न कथन है; अतः उसे छिपाने या दोनों को मिलाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक प्रश्नात्मक शैली। स्त्रीलिंग ‘उसकी’ से ‘बुद्धि’ का व्याकरणिक व्यक्तिकरण बना रहता है।
