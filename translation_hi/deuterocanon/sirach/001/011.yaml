  yaml_path: translation/deuterocanon/sirach/001/011.yaml
  text: The fear of Yahweh is glory and honor[a], greatness and a crown of splendor.
translation:
  language: hi
  text: यहोवा का भय महिमा और आदर[a], महानता और शोभा का मुकुट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इससे बहुत भिन्न रूप मिलता है: “प्रभु का भय हृदय को आनंदित करता है और प्रसन्नता, हर्ष और दीर्घायु देता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: यहोवा का भय
  rationale: इब्रानी ज्ञान-साहित्य की प्रचलित संरचना को सीधे बनाए रखता है। यहाँ ‘भय’ में श्रद्धा और विस्मय भी निहित हैं, पर केवल ‘श्रद्धा’ कहना अर्थ को संकुचित कर देता।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: यह शब्द गरिमा और प्रतिष्ठा का भाव देता है; अगले समानांतर पद וִיקָר से भेद बनाए रखने के लिए ‘महिमा’ उपयुक्त है।
- source_word: וִיקָר
  choice: और आदर
  rationale: יקר मूल्य, बहुमूल्यता या सम्मान का बोध करा सकता है। כָּבוֹד के साथ इस युग्म में ‘आदर’ स्वाभाविक है और अंतिम תִּפְאָרֶת से अलग रहता है।
- source_word: וּגְדֻלָּה
  choice: महानता
  rationale: גדלה का सीधा अर्थ ‘महानता’ है और यह मूल की संज्ञात्मक श्रृंखला को सुरक्षित रखता है।
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  choice: और शोभा का मुकुट
  rationale: עֲטֶרֶת की संबंधवाचक रचना को ‘का मुकुट’ से व्यक्त किया गया है। תִּפְאָרֶת के लिए ‘शोभा’ चुना गया ताकि כָּבוֹד के लिए प्रयुक्त ‘महिमा’ की पुनरावृत्ति न हो और मुकुट की दीप्त गरिमा बनी रहे।
- source_word: φόβος κυρίου τέρψει καρδίαν, καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: यूनानी पाठ हृदय को आनंदित करने, प्रसन्नता, हर्ष और दीर्घायु देने की बात करता है, जबकि उपलब्ध इब्रानी पाठ गुणों की संज्ञात्मक सूची देता है। उपलब्ध इब्रानी साक्ष्य को मुख्य पाठ में प्राथमिकता देकर यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच पर्याप्त भिन्नता
  choice: मुख्य पाठ में इब्रानी की संज्ञात्मक उक्ति का अनुसरण
  alternative: 'यूनानी के अनुसार: ‘प्रभु का भय हृदय को आनंदित करता है और प्रसन्नता, हर्ष और दीर्घायु देता है।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वास वाला है, इसलिए मुख्य अनुवाद उसी पर आधारित है। फिर भी यूनानी पाठ केवल शैलीगत नहीं बल्कि आशय की दृष्टि से भी पर्याप्त भिन्न है; अतः पाठगत तनाव को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘यहोवा का भय’ ज्ञान-साहित्य के पारंपरिक धार्मिक मुहावरे को सुरक्षित रखता है; वाक्य की संज्ञात्मक और काव्यात्मक समानांतरता भी यथासंभव बनाए रखी गई है।
