  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: hi
  text: उचित समय तक वह अपने शब्द छिपाए रखेगा, और बहुतों के होंठ उसकी समझ का वर्णन करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ काहाना के संपादन में उपलब्ध काहिरा गनीज़ा का इब्रानी पाठ यूनानी पाठ से बहुत भिन्न है। उसका लगभग अर्थ है: “तू उसके ऊपर एक अनन्त मुकुट रखेगा, और पवित्र जनों के बीच चिरस्थायी पुण्य।” इब्रानी साक्ष्य में गंभीर असंगति चिह्नित होने के कारण इस पद का मुख्य पाठ यूनानी के अनुसार है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: उचित समय तक
  rationale: καιρός यहाँ केवल बीतते समय के बजाय उपयुक्त या नियत अवसर का बोध कराता है; ‘उचित समय’ इस भाव को स्वाभाविक ढंग से रखता है।
- source_word: κρύψει
  choice: छिपाए रखेगा
  rationale: भविष्यत्कालीन क्रिया का अर्थ छिपाना या गुप्त रखना है; ‘छिपाए रखेगा’ समय तक जारी संयम का भाव स्पष्ट करता है।
- source_word: τοὺς λόγους αὐτοῦ
  choice: अपने शब्द
  rationale: λόγοι का सीधा अर्थ ‘शब्द’ या ‘कथन’ है; कर्ता की ओर लौटते संबंध को हिन्दी में ‘अपने’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: χείλη πολλῶν
  choice: बहुतों के होंठ
  rationale: मूल का काव्यात्मक अंगवाचक प्रयोग सुरक्षित रखा गया है; इसे ‘बहुत से लोग’ बनाकर स्पष्ट करने से बिंब और समानांतरता खो जाती।
- source_word: ἐκδιηγήσεται
  choice: वर्णन करेंगे
  rationale: क्रिया विस्तार से सुनाने या प्रकट करने का बोध देती है; बहुवचन ‘होंठ’ के साथ हिन्दी में ‘वर्णन करेंगे’ स्वाभाविक है।
- source_word: σύνεσιν αὐτοῦ
  choice: उसकी समझ
  rationale: σύνεσις बुद्धि, सूझ या समझ को सूचित करता है; ‘समझ’ व्यापक और सामान्य पाठक के लिए स्पष्ट समतुल्य है।
theological_decisions:
- issue: इब्रानी और यूनानी साक्ष्यों के बीच गंभीर पाठांतर
  choice: मुख्य पाठ में यूनानी समानांतर का अनुवाद
  alternative: 'उपलब्ध इब्रानी पंक्ति का अनुवाद: ‘वह उसके सिर पर अनन्त मुकुट रखेगा, और पवित्र जनों के बीच चिरस्थायी पुण्य।’'
  rationale: प्रदत्त इब्रानी पंक्ति इस पद के यूनानी पाठ से अर्थ की दृष्टि से पूर्णतः भिन्न है और स्रोत में ‘major_mismatch’ के रूप में चिह्नित है। पद-संदर्भ से संगत पूर्ण यूनानी साक्ष्य को मुख्य पाठ बनाया गया है, जबकि इब्रानी पाठांतर को टिप्पणी में ईमानदारी से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज ज्ञान-साहित्यिक रूप अपनाया गया है। ‘बहुतों के होंठ’ में मूल का काव्यात्मक बिंब सुरक्षित है; वाक्य को अनावश्यक व्याख्या से नहीं बढ़ाया गया।
