  text: He examined her and saw her and counted her[a], and he gave her to those who love him.
translation:
  language: hi
  text: उसने उसकी परख की, उसे देखा और उसे गिना[a]; फिर उसे उन लोगों को दिया जो उससे प्रेम करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर साक्षी में है: “एक ही बुद्धिमान है, अत्यन्त भय उत्पन्न करनेवाला, जो अपने सिंहासन पर बैठा है।” यहाँ उपलब्ध इब्रानी पाठ यूनानी परम्परा से बहुत भिन्न है।'
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  choice: उसकी जाँच की
  rationale: בחן का अर्थ जाँचना या परखना है। ‘जाँच की’ आधुनिक हिन्दी में स्वाभाविक है और मूल क्रिया का अभिप्राय बिना अतिरिक्त व्याख्या के रखता है।
- source_word: וְרָאָהּ
  choice: उसे देखा
  rationale: ראה की सीधी क्रिया ‘देखना’ रखी गई है, जिससे इब्रानी की संक्षिप्त क्रिया-शृंखला बनी रहती है।
- source_word: וְסְפָרָהּ
  choice: उसे गिना
  rationale: ספר यहाँ गिनने या संख्या निर्धारित करने के अर्थ में है। ‘गिना’ मूल बिंब को सुरक्षित रखता है, भले ही ज्ञान को गिनने की अभिव्यक्ति हिन्दी में असामान्य लगे।
- source_word: וּנְתָנָהּ
  choice: उसे ... दे दिया
  rationale: נתן की सामान्य और सीधी हिन्दी ‘देना’ है। पूर्ण क्रिया-प्रवाह के लिए ‘दे दिया’ स्वाभाविक है।
- source_word: לְאֹהֲבָיו
  choice: अपने प्रेम रखनेवालों को
  rationale: पुल्लिंग एकवचन प्रत्यय का संकेत निहित कर्ता परमेश्वर की ओर है। ‘अपने प्रेम रखनेवालों’ से सम्बन्ध स्पष्ट रहता है और ‘ज्ञान से प्रेम करनेवालों’ जैसा व्याकरण-विरुद्ध अर्थ आरोपित नहीं होता।
- source_word: הּ
  choice: उसकी / उसे
  rationale: स्त्रीलिंग प्रत्यय ज्ञान की ओर संकेत करते हैं। हिन्दी में स्त्रीलिंग व्यक्तिवाचकता को सर्वनाम में स्वाभाविक रूप से हर स्थान पर दिखाना कठिन है; आरम्भिक ‘उसकी’ और सन्दर्भगत क्रियाएँ उसी स्त्रीलिंग संदर्भ को बनाए रखती हैं।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर साक्षी के बीच बड़ा पाठांतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और पादटिप्पणी में यूनानी पाठांतर
  alternative: 'यूनानी-आधारित मुख्य पाठ: ‘केवल एक ही बुद्धिमान है, अत्यन्त भयावह, जो अपने सिंहासन पर विराजमान है।’'
  rationale: इस स्थान का उपलब्ध इब्रानी पाठ सुसंगत और अनुवादयोग्य है, इसलिए उसे प्राथमिकता दी गई है। फिर भी यूनानी परम्परा बिल्कुल अलग कथन देती है; इस महत्त्वपूर्ण अंतर को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: לְאֹהֲבָיו में पुल्लिंग एकवचन सर्वनाम का पूर्वपद
  choice: इसे निहित कर्ता परमेश्वर के लिए ‘अपने प्रेम रखनेवालों’ के रूप में समझना
  alternative: इसे अर्थानुसार ज्ञान से जोड़कर ‘उससे प्रेम रखनेवालों’ कहना
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है, जबकि ‘ज्ञान’ स्त्रीलिंग है। इसलिए व्याकरण के अनुसार परमेश्वर इसका सबसे स्वाभाविक संदर्भ है; नाम जोड़कर स्रोत से अधिक स्पष्टता आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। इब्रानी की लगातार चार क्रियाओं की संक्षिप्त लय सुरक्षित है। ‘उसे गिना’ जानबूझकर रखा गया है, क्योंकि अधिक मुहावरेदार विकल्प मूल के मापन/गणना वाले बिंब को मिटा सकते हैं।
