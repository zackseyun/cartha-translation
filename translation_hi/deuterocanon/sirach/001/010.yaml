  text: The fear of the Lord is glory and exultation[a], and gladness and a crown of rejoicing.
translation:
  language: hi
  text: प्रभु का भय महिमा और गौरव[a], आनन्द और हर्षोल्लास का मुकुट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गर्व करने का कारण।” यूनानी में सम्मान और आनन्द के निकटार्थी शब्दों की शृंखला है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: भय
  rationale: बाइबिल के ज्ञान-साहित्य की स्थापित अभिव्यक्ति ‘प्रभु का भय’ को सुरक्षित रखता है। यहाँ इसका आशय केवल आतंक नहीं, बल्कि विनम्र श्रद्धा और आज्ञाकारी आदर भी है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: κύριος के लिए स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य ‘प्रभु’ है; सम्बन्धकारक रूप वाक्यांश को सहज बनाता है।
- source_word: δόξα
  choice: महिमा
  rationale: यह शब्द सम्मान और प्रतिष्ठा का भाव रखता है तथा δόξα की बाइबिलीय गम्भीरता को बनाए रखता है।
- source_word: καύχημα
  choice: गौरव
  rationale: सकारात्मक प्रसंग में यह गर्व अथवा गर्व करने के आधार को दर्शाता है। ‘गौरव’ नकारात्मक अहंकार का अनावश्यक भाव लाए बिना इस सम्मानपूर्ण आत्मगौरव को व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: εὐφροσύνη
  choice: आनन्द
  rationale: सूची में उल्लासपूर्ण प्रसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है और अगले अधिक उत्कट शब्द से पर्याप्त भेद बनाए रखता है।
- source_word: στέφανος
  choice: मुकुट
  rationale: सम्मान या विजय के पहनाए जाने वाले हार/मुकुट का रूपक हिन्दी में ‘मुकुट’ से स्पष्ट और स्वाभाविक रहता है।
- source_word: ἀγαλλιάματος
  choice: हर्षोल्लास
  rationale: तीव्र और प्रकट आनन्द का भाव देता है तथा εὐφροσύνη के सामान्य ‘आनन्द’ से काव्यात्मक भेद बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य की अभिव्यक्ति φόβος κυρίου का अनुवाद
  choice: प्रभु का भय
  alternative: प्रभु के प्रति श्रद्धा / प्रभु का विस्मयपूर्ण आदर
  rationale: ‘प्रभु का भय’ मूल रूपक और उसकी व्यापक धर्मवैचारिक अर्थ-सीमा को सुरक्षित रखता है। इसे केवल ‘श्रद्धा’ कर देने से भय, विनम्रता और आज्ञाकारिता के बीच का मूल तनाव कम हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। चार सकारात्मक पदों की मूल संचयी लय को बनाए रखते हुए ‘महिमा—गौरव’ और ‘आनन्द—हर्षोल्लास’ के अर्थगत निकटत्व को जानबूझकर समतल नहीं किया गया।
