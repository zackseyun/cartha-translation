base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/002.yaml
  text: Who can count the sand of the seas[a], the drops of rain, and the days of eternity?
translation:
  language: hi
  text: समुद्रों की रेत, वर्षा की बूँदों और अनन्त काल के दिनों[a] को कौन गिन सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘युग के दिनों’ अथवा ‘प्राचीन काल के दिनों।’ इब्रानी עוֹלָם का अर्थ अनन्त काल, कोई युग या प्राचीन समय हो सकता है; यूनानी समानांतर पाठ ऐसी अवधि का संकेत देता है जिसे मापा या गिना नहीं जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: समुद्रों की रेत
  rationale: חוֹל सामूहिक रूप से ‘रेत’ को और יַמִּים बहुवचन में ‘समुद्रों’ को दर्शाता है। यह अनुवाद मूल बिंब और बहुवचन दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: נִטְפֵי מָטָר
  choice: वर्षा की बूँदों
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा अर्थ ‘वर्षा की बूँदें’ है। यह स्पष्ट, स्वाभाविक और ठोस बिंब वाला हिन्दी प्रयोग है।
- source_word: וִימוֹת עוֹלָם
  choice: अनन्त काल के दिनों
  rationale: עוֹלָם अनन्तता, दीर्घ युग या प्राचीन काल का बोध करा सकता है। यहाँ अगणनीय वस्तुओं की सूची और यूनानी समानांतर पाठ immeasurable duration का समर्थन करते हैं; फिर भी पाद-टिप्पणी में इसकी वास्तविक अर्थ-व्याप्ति सुरक्षित रखी गई है।
- source_word: מִי יִמְנֶה
  choice: कौन गिन सकता है
  rationale: प्रश्नवाचक מִי और अपूर्ण क्रिया יִמְנֶה यहाँ मानवीय असमर्थता को व्यक्त करने वाला आलंकारिक प्रश्न बनाते हैं। ‘कौन गिन सकता है’ आधुनिक हिन्दी में यही भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ज्ञान-साहित्य के अतिशयोक्तिपूर्ण संदर्भ में עוֹלָם का कालगत अर्थ
  choice: मुख्य पाठ में ‘अनन्त काल’
  alternative: ‘युग’ अथवा ‘प्राचीन काल’
  rationale: पद का उद्देश्य ऐसी कालावधि का बिंब देना है जिसे मनुष्य गिन नहीं सकता। ‘अनन्त काल’ इस आलंकारिक व्यापकता को व्यक्त करता है, पर इसे किसी विशिष्ट पारलौकिक या तत्त्वमीमांसात्मक सिद्धान्त का तकनीकी कथन नहीं माना गया; अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। पद की काव्यात्मक सूची तथा आलंकारिक प्रश्न को बनाए रखा गया है; ‘समुद्रों’ का बहुवचन मूल इब्रानी और यूनानी समानांतर पाठ के अनुरूप सुरक्षित है।
