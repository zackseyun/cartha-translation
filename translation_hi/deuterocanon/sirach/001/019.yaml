  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: hi
  text: वह सामर्थ्य की लाठी और सहारा है[a]; उसके पीछे चलने वाले हर व्यक्ति के लिए वह प्रशंसा और चिरस्थायी सम्मान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठांतर: “बुद्धि की जड़ प्रभु का भय मानना है, और उसकी शाखाएँ दीर्घ जीवन हैं।” यहाँ उपलब्ध इब्रानी पाठ यूनानी परम्परा से बहुत भिन्न है।'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: सामर्थ्य की लाठी
  rationale: מַטֶּה का सामान्य अर्थ लाठी या दण्ड है और עֹז सामर्थ्य को दर्शाता है। ‘लाठी’ सहारा देनेवाली वस्तु की छवि को बनाए रखती है तथा अगले समानांतर पद से स्वाभाविक रूप से जुड़ती है।
- source_word: מַשְׁעֵנָה
  choice: सहारा
  rationale: यह संज्ञा उस वस्तु या व्यक्ति को सूचित करती है जिस पर टिका या भरोसा किया जा सके। ‘सहारा’ आधुनिक हिन्दी में स्वाभाविक है और ‘लाठी’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: תְּהִלָּה
  choice: प्रशंसा
  rationale: मूल शब्द का सीधा अर्थ प्रशंसा है। यहाँ वह बुद्धि का अनुसरण करनेवाले को मिलनेवाली प्रशंसा या प्रशंसनीयता—दोनों की कुछ अर्थगत गुंजाइश बनाए रखता है।
- source_word: כְבוֹד עוֹלָם
  choice: सदा का सम्मान
  rationale: כָּבוֹד के लिए मानवीय प्राप्तकर्ता के संदर्भ में ‘सम्मान’ स्वाभाविक है, जबकि עוֹלָם उसके स्थायी काल को व्यक्त करता है।
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: उसके पीछे चलनेवाले हर एक के लिए
  rationale: यह चयन ‘पीछे चलना’ वाली इब्रानी छवि और बुद्धि के स्त्रीलिंग व्यक्तित्व—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परम्पराओं में बड़ा अन्तर
  choice: उपलब्ध इब्रानी पंक्ति को मुख्य पाठ बनाया गया है।
  alternative: 'यूनानी: “बुद्धि की जड़ प्रभु का भय मानना है, और उसकी शाखाएँ दीर्घायु हैं।”'
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य यहाँ मुख्य स्रोत है। यूनानी पाठ का आशय मूलतः अलग है, इसलिए उसे मुख्य पाठ में मिलाकर तनाव मिटाने के बजाय पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘वह’ और ‘उसके’ द्वारा बुद्धि के स्त्रीलिंग व्यक्तित्व को बनाए रखा गया है; ‘चलनेवाले’ की वर्तनी संयुक्त रूप में रखी गई है।
