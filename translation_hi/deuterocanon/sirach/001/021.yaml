  text: Happy is the man who meditates on her[b][a], and she is better for him than every treasure.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो उस पर मनन करता है,[b] और वह उसके लिए हर खजाने से बढ़कर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य में यहाँ बहुत भिन्न पाठ है: “क्योंकि उसके क्रोध का झोंका उसके लिए पतन है।” संभवतः यह किसी भिन्न पाठ-रूप या पद-क्रम को दर्शाता है।'
    reason: textual_variant
  - marker: b
    text: या, “सुखी है वह मनुष्य जो उस पर विचार करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी ज्ञान-साहित्य में प्रयुक्त मंगल-वचन का सूत्र है। ‘धन्य है’ उसकी प्रतिष्ठित, गरिमापूर्ण अभिव्यक्ति है और ऐसी कल्याणमय दशा बताता है जिसे पाने योग्य माना गया है।
- source_word: אֱנוֹשׁ
  choice: वह मनुष्य
  rationale: यह शब्द नश्वर मानव को सूचित करता है। इब्रानी के प्रतिनिधिक पुल्लिंग एकवचन को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: יֶהְגֶּה
  choice: मनन करता है
  rationale: यहाँ क्रिया का अर्थ किसी विषय पर लगातार ध्यानपूर्वक विचार करना है। ‘मनन करता है’ ज्ञान-साहित्य के संदर्भ में स्वाभाविक और सटीक है।
- source_word: בָּהּ
  choice: उस पर
  rationale: स्त्रीलिंग प्रत्यय का संकेत निकटवर्ती संदर्भ की व्यक्तिरूप बुद्धि की ओर है। हिन्दी में ‘उस पर’ उसी संदर्भ को बनाए रखता है और उसे निर्जीव ‘इस बात पर’ में नहीं बदलता।
- source_word: וְטוֹבָה
  choice: और वह ... उत्तम है
  rationale: וְ को ‘और’ से व्यक्त किया गया है। מִכָּל के साथ विशेषण तुलनात्मक अर्थ देता है, इसलिए ‘उत्तम है’ केवल ‘अच्छी है’ की अपेक्षा अधिक स्पष्ट है।
- source_word: מִכָּל אוֹצָר
  choice: हर खजाने से
  rationale: אוֹצָר यहाँ संचित धन या बहुमूल्य निधि के अर्थ में है, और מִכָּל की समग्रता ‘हर’ से व्यक्त होती है।
- source_word: ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: यूनानी साक्ष्य उपलब्ध इब्रानी से मूलतः भिन्न है और संभवतः दूसरी पाठ-परंपरा या पद-क्रम को दर्शाता है। इसलिए मुख्य अनुवाद इब्रानी का अनुसरण करता है और भिन्न यूनानी पाठ को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के मंगल-वचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति / जो कोई
  rationale: इब्रानी אֱנוֹשׁ पुल्लिंग एकवचन है, पर ज्ञान-वचन में प्रतिनिधिक रूप से प्रयुक्त है। अनुवाद उसके व्याकरणिक रूप को बिना अनावश्यक विस्तार के बनाए रखता है।
- issue: बुद्धि का स्त्रीरूप व्यक्तिकरण
  choice: उस पर / वह ... उत्तम है
  alternative: इस पर / यह ... उत्तम है
  rationale: इब्रानी स्त्रीलिंग प्रत्यय और विशेषण संदर्भ में व्यक्तिरूप बुद्धि की ओर संकेत करते हैं। हिन्दी सर्वनाम में लिंग प्रकट नहीं होता, फिर भी वाक्य-संरचना उस संदर्भ को निर्जीव बनाए बिना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-वचन शैली अपनाई गई है। ‘धन्य’, ‘मनन’ और ‘उत्तम’ सामान्य पाठक के लिए बोधगम्य रहते हुए शास्त्रीय गंभीरता बनाए रखते हैं।
