  yaml_path: translation/deuterocanon/sirach/001/015.yaml
  text: The fullness of wisdom is to fear the Lord, and it makes them drunk from its fruits[b][a].
translation:
  language: hi
  text: बुद्धि की परिपूर्णता प्रभु का भय मानना है, और वह उन्हें अपने फलों से मतवाला कर देती है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस स्थान पर उपलब्ध काहिरा गनीज़ा का इब्रानी पाठ बहुत अलग है: “सत्यनिष्ठ लोगों के साथ वह प्राचीनकाल से स्थापित की गई, और उनकी संतान के साथ उसकी निष्ठावान कृपा विश्वासयोग्य है।” उद्धृत संस्करण में यह पंक्ति कोष्ठकों में है और बड़े पाठांतर के रूप में चिह्नित है; इसलिए यहाँ मुख्य पाठ यूनानी के अनुसार दिया गया है।'
    reason: textual_variant
  - marker: b
    text: “वह” से अभिप्राय बुद्धि है; यूनानी में “बुद्धि” स्त्रीलिंग है और सिराख में उसे प्रायः एक स्त्री के रूप में व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: बुद्धि की परिपूर्णता
  rationale: यूनानी पदबंध में πλησμονή का अर्थ ‘परिपूर्णता’ या ‘भरपूरी’ है; ‘परिपूर्णता’ संज्ञात्मक रूप और ज्ञान-साहित्य की गरिमा बनाए रखता है।
- source_word: φοβεῖσθαι τὸν κύριον
  choice: प्रभु का भय मानना
  rationale: यह अनंत क्रिया-रचना बताती है कि बुद्धि की परिपूर्णता किसमें है। ‘भय मानना’ मूल अर्थ और पारंपरिक धार्मिक तनाव को बनाए रखता है, उसे केवल ‘आदर करना’ तक सीमित नहीं करता।
- source_word: μεθύσκει
  choice: मतवाला कर देती है
  rationale: क्रिया का सजीव अर्थ नशे में करना या मतवाला करना है। रूपक को ‘तृप्त करती है’ कहकर सपाट नहीं किया गया।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यूनानी में सर्वनाम का पूर्वपद इसी पद में स्पष्ट नहीं है; ‘उन्हें’ स्रोत की संक्षिप्तता और अस्पष्टता बनाए रखता है।
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: अपने फलों से
  rationale: αὐτῆς का संकेत स्त्रीलिंग σοφία, अर्थात बुद्धि, की ओर है। हिन्दी में कर्ता ‘वह’ के साथ ‘अपने’ स्वाभाविक है; ἀπό को यहाँ साधन/स्रोत के अर्थ में ‘से’ कहा गया है।
theological_decisions:
- issue: कोष्ठकबद्ध इब्रानी पंक्ति और यूनानी पाठ के बीच बड़ा पाठांतर
  choice: मुख्य पाठ में यूनानी समानांतर का अनुवाद
  alternative: “सत्यनिष्ठ लोगों के साथ वह प्राचीनकाल से स्थापित की गई, और उनकी संतान के साथ उसकी करुणा विश्वासयोग्य है।”
  rationale: दिया गया इब्रानी साक्ष्य संपादित पाठ में कोष्ठकबद्ध है और इस स्थान पर बड़े असामंजस्य के रूप में चिह्नित है; वह यूनानी पद से मेल नहीं खाता। इसलिए मुख्य पाठ यूनानी के अनुसार है और इब्रानी पाठांतर पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
- issue: बुद्धि का स्त्रीलिंग व्यक्तिकरण
  choice: ‘वह’ और ‘अपने फलों’ द्वारा स्वाभाविक हिन्दी व्यक्तिकरण बनाए रखना
  alternative: 'अव्यक्तिगत रूप: “यह उन्हें उसके फलों से मतवाला कर देता है”'
  rationale: यूनानी में σοφία और उससे संबंधित सर्वनाम स्त्रीलिंग हैं तथा सिराख में बुद्धि का व्यक्तिकरण सामान्य है। हिन्दी में ‘बुद्धि’ भी स्त्रीलिंग है, इसलिए व्यक्तिकरण सहज रूप से सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक रजिस्टर। ‘प्रभु का भय मानना’ पारंपरिक बाइबलीय अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘मतवाला कर देती है’ मूल यूनानी रूपक की तीव्रता बनाए रखता है।
