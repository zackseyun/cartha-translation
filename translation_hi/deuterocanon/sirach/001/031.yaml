base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: hi
  text: मेरे बेटे,[a] याहवे के भय में कपटी मत बन, और दोहरे मन से[b] उसके निकट मत जा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी साक्ष्य में है: “मेरे बेटे, याहवे के भय में कपटी मत बन, और दोहरे मन से उसके निकट मत जा।” इस पद का यूनानी समानांतर इसके बजाय कहता है: “जो उपकारों का प्रतिदान देता है, वह आगे आनेवाली बातों को स्मरण रखता है, और गिरने के समय उसे सहारा मिलेगा।”'
    reason: textual_variant
  - marker: b
    text: 'शाब्दिक अर्थ: “हृदय और हृदय से”; यह भीतरी दोहरेपन या कपट के लिए प्रयुक्त इब्रानी मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह בֵּן के साथ प्रथम पुरुष एकवचन प्रत्यय वाला संबोधन है। ‘मेरे बेटे’ मूल के पुल्लिंग एकवचन और ज्ञान-साहित्य की शिक्षक-संबोधन शैली को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אַל תְּכַזֵּב
  choice: कपटी मत बन
  rationale: כזב यहाँ केवल झूठ बोलने के बजाय धार्मिक आचरण में असत्यता या ढोंग का भाव देता है। ‘कपटी मत बन’ इस व्यापक नैतिक अर्थ को हिन्दी में स्पष्ट करता है।
- source_word: בְּיִרְאַת יְהֹוָה
  choice: यहवे का भय मानने में
  rationale: יִרְאָה ज्ञान-साहित्य का स्थापित धार्मिक पद है। ‘भय मानना’ श्रद्धा और जवाबदेही से युक्त भय को बनाए रखता है; יְהוָה को उसके व्यक्तिनाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: उसके निकट मत जा
  rationale: קרב के साथ אֶל पास आने या निकट जाने को दर्शाता है। यह रूप संबंधपरक और संभावित उपासना-संबंधी अर्थ, दोनों के लिए खुला रहता है।
- source_word: בְּלֵב וָלֵב
  choice: दोहरे मन से
  rationale: शाब्दिक अभिव्यक्ति ‘हृदय और हृदय’ आंतरिक दोहरेपन या कपट का मुहावरा है। ‘दोहरे मन से’ हिन्दी में स्वाभाविक रहते हुए उस चित्र और अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: इब्रानी पाठ में चतुरक्षरीय व्यक्तिनाम सीधे आया है। ‘यहवे’ उसे सामान्य उपाधि में बदलने के बजाय वाचा के नाम के रूप में सुरक्षित रखता है।
- issue: इब्रानी और यूनानी पाठों का बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और पादटिप्पणी में यूनानी पाठ
  alternative: यूनानी कथन को मुख्य पाठ बनाना अथवा दोनों को मिलाना
  rationale: इस पद का उपलब्ध इब्रानी पाठ स्पष्ट है, जबकि यूनानी समानांतर एक बिल्कुल अलग कथन देता है। दोनों को मिलाने से पाठीय भिन्नता छिप जाएगी; इसलिए इब्रानी को मुख्य रखते हुए यूनानी साक्ष्य को स्पष्ट रूप से नोट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और ज्ञान-साहित्य के सीधे उपदेशात्मक स्वर के अनुरूप। ‘कपटी’ धार्मिक असत्यता को और ‘दोहरे मन’ मूल इब्रानी मुहावरे को सहज रूप में व्यक्त करता है।
