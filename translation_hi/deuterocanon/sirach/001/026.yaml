  text: For wisdom and instruction are fear of the Lord, and his good pleasure is faith and meekness.
translation:
  language: hi
  text: क्योंकि बुद्धि और शिक्षा प्रभु का भय हैं, और उसकी प्रसन्नता विश्वास और नम्रता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इब्रानी साक्ष्य इस पद के शब्दों से मेल नहीं खाता और उसे गंभीर असंगति वाला माना गया है; इसलिए अनुवाद सीराख 1:26 के यूनानी पाठ पर आधारित है।
    reason: textual_variant
  - marker: b
    text: या, “उसकी कृपा विश्वासयोग्यता और सौम्यता है।” यूनानी शब्दों का अर्थ क्रमशः “विश्वासयोग्यता” या “भरोसा,” और “सौम्यता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: सीराख के ज्ञान-साहित्यिक संदर्भ में यह नैतिक और व्यावहारिक बुद्धि का सामान्य पद है।
- source_word: παιδεία
  choice: शिक्षा
  rationale: यहाँ अमूर्त रूप से बुद्धि के साथ युग्मित होने के कारण ‘शिक्षा’ स्वाभाविक है; ‘अनुशासन’ या ‘प्रशिक्षण’ भी संभव हैं, पर वे अर्थ को अधिक विशिष्ट बना सकते हैं।
- source_word: φόβος κυρίου
  choice: प्रभु का भय
  rationale: यह ज्ञान-साहित्य का प्रमुख पारिभाषिक वाक्यांश है; ‘भय’ श्रद्धापूर्ण विस्मय सहित मूल की धर्मवैचारिक गंभीरता बनाए रखता है।
- source_word: ἡ εὐδοκία αὐτοῦ
  choice: उसे ... प्रसन्न करते हैं
  rationale: शाब्दिक ‘उसकी प्रसन्नता’ की अपेक्षा आधुनिक हिन्दी में यह स्वाभाविक रूप से व्यक्त करता है कि विश्वास और नम्रता प्रभु को प्रिय हैं। सर्वनाम का संदर्भ ‘प्रभु’ है।
- source_word: πίστις
  choice: विश्वास
  rationale: मुख्य पाठ में प्रचलित और स्रोत-समीप अर्थ रखा गया है; इस ज्ञान-साहित्यिक संदर्भ में ‘विश्वासयोग्यता’ भी संभव है, इसलिए उसे पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: πρᾳότης
  choice: नम्रता
  rationale: यह शब्द कोमल, अहंकाररहित व्यवहार सूचित करता है। आधुनिक हिन्दी में ‘नम्रता’ स्वाभाविक है; ‘सौम्यता’ वैकल्पिक अर्थ के रूप में पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: असंगत इब्रानी साक्ष्य वाले पद के लिए प्राथमिक स्रोत
  choice: इस पद का अनुवाद यूनानी पाठ से करना और इब्रानी असंगति को पाद-टिप्पणी में बताना
  alternative: दिए गए इब्रानी वाक्य का अनुवाद करना
  rationale: दिया गया इब्रानी पाठ इस पद की यूनानी शब्दावली से मेल नहीं खाता और स्वयं ‘major_mismatch’ चिह्नित है। अतः पद 1:26 के लिए उपलब्ध यूनानी समानांतर को कार्यकारी मूल-पाठ माना गया है, जबकि पाठगत स्थिति स्पष्ट रूप से दर्ज की गई है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता अथवा भरोसा
  rationale: ‘विश्वास’ मुख्य अर्थ को बनाए रखता है, पर ज्ञान-साहित्यिक प्रसंग ‘विश्वासयोग्यता’ की अनुमति भी देता है; इसलिए संभावित अर्थ को बिना निर्णायक रूप से दबाए पाद-टिप्पणी में रखा गया है।
- issue: ἡ εὐδοκία αὐτοῦ की वाक्य-रचना
  choice: ‘उसे विश्वास और नम्रता प्रसन्न करते हैं’
  alternative: ‘उसकी प्रसन्नता विश्वास और नम्रता है’ अथवा ‘उसकी कृपा विश्वासयोग्यता और सौम्यता है’
  rationale: यूनानी पदबंध में यह अस्पष्टता है कि εὐδοκία उस चीज़ को दर्शाता है जो प्रभु को भाती है या उसकी कृपा/अनुग्रह को। मुख्य पाठ स्वाभाविक हिन्दी में प्रथम अर्थ देता है और दूसरे को पाद-टिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण ज्ञान-साहित्यिक शैली। पारंपरिक ‘प्रभु का भय’ बनाए रखा गया है, जबकि εὐδοκία को सहज हिन्दी वाक्य-रचना में व्यक्त किया गया है।
