    text: यूनानी पाठ में है, “क्रोधी मनुष्य धर्मी नहीं ठहर सकता।” इस पद के इब्रानी और यूनानी पाठ-साक्ष्यों में बहुत बड़ा अंतर है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “दिनों की लंबाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: उसकी जड़ें
  rationale: स्त्रीलिंग एकवचन प्रत्यय निकटवर्ती स्त्रीलिंग धारणा—बुद्धि या प्रभु का भय—की ओर संकेत करता है। हिन्दी में “उसकी” इस संबंध और वृक्ष-रूपक दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती हैं
  rationale: शाब्दिक “सदा के लिए” के बजाय यह वाक्य में निहित स्थायित्व को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַעֲנָפֶיהָ
  choice: और उसकी शाखाएँ
  rationale: यह जड़ों के साथ मूल पाठ का वनस्पति-रूपक और समानांतर संरचना सुरक्षित रखता है।
- source_word: אֹרֶךְ יָמִים
  choice: दीर्घायु
  rationale: “दिनों की लंबाई” का भाव दीर्घ जीवन है। “दीर्घायु” संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतर के अनुकूल है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में व्यापक अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी काव्य-पंक्ति का अनुवाद
  alternative: 'यूनानी: “क्रोधी मनुष्य धर्मी नहीं ठहर सकता।”'
  rationale: यहाँ उपलब्ध इब्रानी को प्राथमिक स्रोत मानते हुए उसका सीधा अनुवाद किया गया है। यूनानी में बिल्कुल अलग वाक्य होने के कारण अंतर को छिपाने या मिलाने के बजाय पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण काव्यात्मक शैली। “जड़ें—शाखाएँ” का समानांतर रूपक सुरक्षित रखा गया है और अस्पष्ट पाठ-परंपरा को पादटिप्पणी में पारदर्शी बनाया गया है।
