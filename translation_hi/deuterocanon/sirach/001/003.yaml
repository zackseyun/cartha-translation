base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/003.yaml
  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: hi
  text: आकाश की ऊँचाई, पृथ्वी की चौड़ाई और अथाह गर्त की गहराई—कौन इनकी खोजबीन कर सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में ‘और बुद्धि’ जोड़ा गया है। तब वाक्य होगा: “आकाश की ऊँचाई, पृथ्वी की चौड़ाई, अथाह गर्त की गहराई और बुद्धि—कौन इनकी खोजबीन कर सकता है?”'
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: आकाश की ऊँचाई
  rationale: यह पदबंध आकाश के ऊर्ध्व विस्तार को दर्शाता है। ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ ब्रह्मांडीय संदर्भ रखता है।
- source_word: רֹחַב אָרֶץ
  choice: पृथ्वी की चौड़ाई
  rationale: रֹחַב एक आयामी शब्द है; ‘चौड़ाई’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ऊँचाई तथा गहराई के समानांतर बैठता है। אָרֶץ यहाँ किसी विशेष भूभाग के बजाय पृथ्वी को दर्शाता है।
- source_word: עֹמֶק תְּהוֹם
  choice: अथाह गहराई की गहराई
  rationale: עֹמֶק आयाम के रूप में ‘गहराई’ है, जबकि תְּהוֹם ब्रह्मांडीय अथाह गहराई को सूचित करता है। दोहराव मूल के ‘depth of the abyss’ संबंध को बनाए रखता है, यद्यपि हिन्दी में कुछ भार लिए हुए है।
- source_word: מִי יַחֲקֹר
  choice: कौन उनका पूरा पता लगा सकता है?
  rationale: क्रिया गहन खोज या पूरी तरह छानबीन करने का भाव रखती है। ‘सकता है’ प्रश्न में निहित सामर्थ्य को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘उनका’ सूचीबद्ध आयामों को स्पष्ट करता है।
theological_decisions:
- issue: इब्रानी पाठ में अनुपस्थित, पर यूनानी समानांतर में उपस्थित ‘और बुद्धि’
  choice: मुख्य पाठ में उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ का अनुसरण करते हुए ‘और बुद्धि’ नहीं जोड़ा गया।
  alternative: यूनानी पाठ में ‘और बुद्धि’ भी है, जिससे प्रश्न का दायरा ब्रह्मांडीय आयामों के साथ बुद्धि तक बढ़ जाता है।
  rationale: जहाँ इब्रानी साक्ष्य सुरक्षित और विश्वसनीय है, उसे मुख्य पाठ में प्राथमिकता दी गई है। अर्थपूर्ण यूनानी पाठांतर को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। आयामी समानांतरता बनाए रखने के लिए ‘ऊँचाई/चौड़ाई/गहराई’ रखा गया है। ‘अथाह गहराई की गहराई’ मूल के औपचारिक संबंध को सुरक्षित रखता है, हालांकि शैलीगत रूप से भारी है।
