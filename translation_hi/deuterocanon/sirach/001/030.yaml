translation:
  language: hi
  text: जल धधकती आग को बुझा देता है, और गरीबों को दिया गया दान पापों का प्रायश्चित करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῦρ φλογιζόμενον
  choice: धधकती आग
  rationale: यूनानी पद का स्वाभाविक और सजीव अर्थ; आग के तीव्रता से जलने का भाव बनाए रखता है।
- source_word: ἀποσβέσει
  choice: बुझा देता है
  rationale: यूनानी भविष्यकाल यहाँ सामान्य सत्य व्यक्त करता है; हिन्दी में सामान्य वर्तमान अधिक स्वाभाविक है।
- source_word: ἐλεημοσύνη
  choice: गरीबों को दिया गया दान
  rationale: सिर्फ सामान्य ‘दान’ की अपेक्षा जरूरतमंदों के प्रति दयापूर्ण सहायता का यूनानी अर्थ स्पष्ट करता है।
- source_word: ἐξιλάσεται
  choice: प्रायश्चित करता है
  rationale: पापों के संबंध में प्रायश्चितकारी प्रभाव की धार्मिक गंभीरता को बनाए रखता है, बिना उसकी प्रक्रिया को अतिरिक्त रूप से समझाए।
- source_word: ἁμαρτίας
  choice: पापों
  rationale: बहुवचन और नैतिक-धार्मिक अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: दान और पापों के प्रायश्चित के बीच संबंध
  choice: पापों का प्रायश्चित करता है
  alternative: पापों को ढाँप देता है / पापों के लिए क्षमा दिलाता है
  rationale: यूनानी ἐξιλάσεται को सीधे रखा गया है। अनुवाद न तो इस कथन को केवल प्रतीकात्मक बनाता है, न यह जोड़ता है कि दान अपने आप किस प्रकार क्षमा प्राप्त कराता है; मूल का धर्मवैचारिक तनाव बना रहता है।
- issue: प्रदत्त इब्रानी पाठ और पद-संरेखण का बड़ा अंतर
  choice: इस पद से अर्थतः मेल खाने वाले यूनानी समानांतर का अनुवाद
  alternative: प्रदत्त इब्रानी पाठ ‘निकट आ और देर न कर…’ का अनुवाद
  rationale: दिया गया इब्रानी अंश इस संदर्भ, यूनानी पाठ और सत्यापित अंग्रेजी परामर्श-पाठ से पूर्णतः भिन्न है और स्पष्टतः किसी दूसरे पद से जुड़ा जान पड़ता है। इसलिए गलत-संरेखित इब्रानी को इस पद का आधार नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। दोनों खंडों में सामान्य सत्य का वाक्य-विन्यास रखा गया है। कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
