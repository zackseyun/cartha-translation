  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: hi
  text: वह अपने सभी भंडारों को मनभावनी वस्तुओं से[a] और अपने अन्नागारों को अपनी उपज से भर देती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुमूल्य वस्तुओं,” “मनोहर वस्तुओं,” या “वांछनीय वस्तुओं” भी।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू पाठ में है, “वह अपने सभी भंडारों को मनभावनी वस्तुओं से और अपने अन्नागारों को अपनी उपज से भर देती है।” इसके विपरीत यूनानी साक्ष्य में है, “बुद्धि का मुकुट प्रभु का भय है, जो शांति और चंगाई देनेवाले आरोग्य को पुष्पित करता है।”
    reason: textual_variant
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: अपने सभी भंडारों को
  rationale: אוֹצָר का अर्थ भंडार, भंडार-गृह या कोष हो सकता है। समानांतर אֲסָמֶיהָ (‘अन्नागारों’) के कारण यहाँ वस्तुओं के भंडारण का ठोस अर्थ उपयुक्त है; כָּל और बहुवचन प्रत्यय को ‘सभी भंडारों’ से व्यक्त किया गया है।
- source_word: תְּמַלֵּא
  choice: भर देती है
  rationale: हिब्रू अपूर्ण क्रिया को इस ज्ञान-साहित्यिक कथन में सामान्य वर्तमान के रूप में लिया गया है। स्त्रीलिंग रूप निहित कर्ता, व्यक्तिरूप में प्रस्तुत बुद्धि, के अनुरूप है।
- source_word: חֶמְדָּה
  choice: मनभावनी वस्तुओं
  rationale: חֶמְדָּה में चाहत, मनोहरता, बहुमूल्यता या वांछनीय वस्तुओं का भाव हो सकता है। भंडारों को भरने के संदर्भ में मूर्त बहुवचन ‘मनभावनी वस्तुओं’ स्वाभाविक है, जबकि अर्थ की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַאֲסָמֶיהָ
  choice: और अपने अन्नागारों को
  rationale: אָסָם विशेषतः अन्न रखने के भंडार या कोठार को दर्शाता है। ‘अन्नागार’ कृषि-संबंधी बिंब और अगले शब्द ‘उपज’ के साथ संबंध बनाए रखता है।
- source_word: בִּתְבוּאָתָהּ
  choice: अपनी उपज से
  rationale: תְּבוּאָה का अर्थ उपज, पैदावार या फसल है। ‘उपज’ व्यापक और सहज है; स्त्रीलिंग प्रत्यय को ‘अपनी’ द्वारा व्यक्त किया गया है।
- source_word: στέφανος σοφίας
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी साक्ष्य इस पद के लिए बहुत भिन्न पाठ देता है। उपलब्ध हिब्रू को मुख्य पाठ का आधार बनाया गया है और यूनानी पाठ को महत्त्वपूर्ण पाठांतर के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सिराख 1:17 के हिब्रू और यूनानी साक्ष्यों में बड़ा अंतर
  choice: उपलब्ध हिब्रू पाठ का मुख्य पाठ में अनुवाद
  alternative: 'यूनानी पाठ: ‘बुद्धि का मुकुट प्रभु का भय है, जो शांति और आरोग्यदायी स्वास्थ्य को पुष्पित करता है।’'
  rationale: सिराख का हिब्रू जहाँ उपलब्ध है वहाँ उसे प्राथमिकता दी गई है। दोनों परंपराओं को मिलाकर तनाव मिटाने के बजाय यूनानी के स्वतंत्र और महत्त्वपूर्ण पाठ को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘भंडार’ और ‘अन्नागार’ से मूल के दो निकटवर्ती भंडारण-शब्दों का अंतर तथा कृषि-बिंब बना रहता है। व्यक्तिरूप में प्रस्तुत बुद्धि के स्त्रीलिंग को ‘वह,’ ‘अपनी’ और ‘भर देती है’ से स्पष्ट रखा गया है।
