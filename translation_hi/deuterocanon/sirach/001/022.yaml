  source_fidelity: 'The supplied Hebrew line is explicitly marked as a major mismatch and is semantically unrelated to the Greek parallel. The Hindi should therefore follow the Greek: ἕως καιροῦ, μακρόθυμος, ἀνέξεται, ὕστερον, and the unspecified-agent sense of ἀναδώσει εὐφροσύνη. The draft does this overall; the revision makes the Hindi expression of the patient person and of the subsequent granting of joy more idiomatic.'
  naturalness: ‘धीरज रखनेवाला सहता रहेगा’ is understandable but stylistically repetitive and slightly awkward because both expressions foreground the same endurance idea. ‘धैर्यवान व्यक्ति ... सहता रहेगा’ is smoother modern standard Hindi. ‘आनन्द लौटा दिया जाएगा’ can imply that a previously possessed joy is being restored; ‘आनंद प्रदान किया जाएगा’ better fits the context while retaining an unspecified agent.
  terminology: ‘नियत समय’ suitably conveys καιρός as a fitting or appointed time. ‘धैर्यवान व्यक्ति’ is inclusive and natural for the substantival μακρόθυμος. ‘आनंद’ is a clear, dignified rendering of εὐφροσύνη. No divine agent is supplied.
  issues:
  - severity: low
    issue: The phrase ‘धीरज रखनेवाला ... सहता रहेगा’ is semantically repetitive in Hindi.
    rationale: It represents both μακρόθυμος and ἀνέξεται, but the resulting collocation is less natural than a compact adjectival description followed by the endurance verb.
  - severity: low
    issue: ‘आनन्द लौटा दिया जाएगा’ may suggest restoration of previously held joy.
    rationale: ἀναδώσει can carry repayment or requital, but the context does not explicitly say that joy was previously possessed. ‘आनंद प्रदान किया जाएगा’ is idiomatic and avoids that unintended implication, while the passive preserves the unexpressed agent.
