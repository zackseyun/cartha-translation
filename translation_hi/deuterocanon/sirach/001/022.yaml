    reason: textual_variant
  - marker: b
    text: या “सहनशील व्यक्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: नियत समय तक
  rationale: καιρός केवल सामान्य समय नहीं, बल्कि उपयुक्त या निर्धारित अवसर का भाव दे सकता है; ‘नियत समय’ इस सूक्ष्मता को संक्षेप में रखता है।
- source_word: ἀνέξεται
  choice: सहता रहेगा
  rationale: यह कठिनाई में टिके रहने और सहन करने का भाव व्यक्त करता है; भविष्यकाल और निरंतर धैर्य दोनों हिन्दी में स्वाभाविक रूप से आते हैं।
- source_word: μακρόθυμος
  choice: धीरज रखनेवाला
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। यह लिंग-निरपेक्ष ढंग से दीर्घ धैर्य रखनेवाले व्यक्ति को दर्शाता है।
- source_word: ὕστερον
  choice: उसके बाद
  rationale: यह पहले सहने और फिर मिलनेवाले आनन्द के स्पष्ट कालक्रम को बनाए रखता है।
- source_word: ἀναδώσει
  choice: लौटा दिया जाएगा
  rationale: क्रिया में वापस देने या प्रतिफलस्वरूप देने का भाव है। कर्मवाच्य अनुवाद अनकहे कर्ता को स्पष्ट किए बिना वही अर्थ बनाए रखता है।
- source_word: εὐφροσύνη
  choice: आनन्द
  rationale: यह प्रसन्नता और हर्ष का सामान्य, गरिमापूर्ण और स्वाभाविक हिन्दी पर्याय है।
theological_decisions:
- issue: इस पद के लिए दिए गए इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा असामंजस्य
  choice: इस पद का अनुवाद यूनानी समानांतर पाठ के आधार पर करना और पाठगत समस्या को पादटिप्पणी में बताना
  alternative: 'दिए गए इब्रानी वाक्य का अनुवाद करना: ‘धन्य है वह मनुष्य जो उसके निकट आता है और उसकी आज्ञाओं में आनन्दित होता है।’'
  rationale: दिया गया इब्रानी वाक्य इस पद के यूनानी पाठ से अर्थ की दृष्टि से मेल नहीं खाता और स्रोत में स्वयं ‘major_mismatch’ चिह्नित है। अतः उपलब्ध संगत प्राचीन साक्ष्य के रूप में यूनानी पाठ का अनुसरण करना अधिक उचित है, पर अनिश्चितता छिपाई नहीं गई है।
- issue: आनन्द देनेवाले कर्ता की पहचान
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘उसे आनन्द लौटा दिया जाएगा’ कहना
  alternative: परमेश्वर उसे आनन्द देगा
  rationale: यूनानी वाक्य परमेश्वर को स्पष्ट कर्ता नहीं बनाता। स्पष्ट दिव्य कर्ता जोड़ना मूल पाठ से आगे जाना होता।
