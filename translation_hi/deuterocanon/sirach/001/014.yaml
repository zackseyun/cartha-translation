base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: hi
  text: यहोवा का भय मानना बुद्धि का आरम्भ है, और विश्वासयोग्य जनों के साथ वह गर्भ में रची गई थी[a]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “गर्भ में सुरक्षित रखी गई थी”; इब्रानी क्रिया को “रक्षा करना/सुरक्षित रखना” अर्थ वाले मूल से भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ बहुत भिन्न है: “मनुष्यों के बीच वह सनातन नींव के रूप में बसी, और उनकी सन्तान के साथ वह सौंपी जाएगी।” यहाँ इब्रानी और यूनानी साक्ष्यों में बड़ा अन्तर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: बुद्धि का आरम्भ
  rationale: सम्बद्ध पदबंध का स्वाभाविक अर्थ बुद्धि की शुरुआत या आधारभूत आरम्भ है; हिन्दी वाक्य में स्पष्टता के लिए पदक्रम बदला गया है।
- source_word: יִרְאַת יְהֹוָה
  choice: यहोवा का भय मानना
  rationale: यह ज्ञान-साहित्य का स्थापित पदबंध है। ‘भय’ मूल शब्द की शक्ति बनाए रखता है, जबकि ‘मानना’ हिन्दी में ईश्वर के प्रति श्रद्धायुक्त भय का स्वाभाविक भाव व्यक्त करता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: मूल इब्रानी में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए उसका लिप्यन्तरण किया गया है।
- source_word: נֶאֱמָנִים
  choice: विश्वासयोग्य जनों
  rationale: विशेषण यहाँ संज्ञा के रूप में उन लोगों को सूचित करता है जो विश्वासी अथवा भरोसेमन्द हैं। ‘विश्वासयोग्य जन’ नैतिक और धार्मिक दोनों अर्थों को खुला रखता है।
- source_word: נוֹצְרָה
  choice: रची गई थी
  rationale: गर्भ के सन्दर्भ में यह पाठ निर्माण या रूप दिए जाने का अर्थ दे सकता है। फिर भी व्यंजन-पाठ को ‘सुरक्षित रखी गई थी’ भी समझा जा सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: בַבָּטֶן
  choice: गर्भ में
  rationale: इस प्रसवपूर्व बिम्ब के लिए आधुनिक हिन्दी में ‘गर्भ’ सबसे स्वाभाविक और सटीक शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; लिप्यन्तरण मूल की विशिष्टता बनाए रखता है।
- issue: इब्रानी और यूनानी पाठों का बड़ा अन्तर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी पाठ को मुख्य पाठ बनाना: ‘मनुष्यों के बीच उसने सनातन नींव के समान घोंसला बनाया, और उनकी सन्तान को वह सौंपी जाएगी।’'
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च विश्वास-स्तर वाला है, इसलिए उसे प्राथमिकता दी गई है; किन्तु यूनानी साक्ष्य का आशय बहुत भिन्न होने के कारण उसे पादटिप्पणी में पूरा बताया गया है।
- issue: बुद्धि का स्त्रीलिंगी व्यक्तिकरण
  choice: ‘वह ... रची गई थी’
  alternative: स्त्रीलिंगी सर्वनाम से बचते हुए ‘बुद्धि ... रची गई थी’ को दोहराना
  rationale: इब्रानी क्रिया स्त्रीलिंगी है और ‘बुद्धि’ भी स्त्रीलिंगी संज्ञा है; हिन्दी में ‘वह’ इस व्याकरणिक तथा सम्भावित काव्यात्मक व्यक्तिकरण को सहज रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले उपवाक्य का पदक्रम स्वाभाविक हिन्दी के अनुसार बदला गया है, पर मूल कथन का सम्बन्ध सुरक्षित है। ‘विश्वासयोग्य जन’ औपचारिकता और सहजता के बीच संतुलन रखता है।
