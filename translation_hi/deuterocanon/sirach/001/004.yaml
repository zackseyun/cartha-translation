  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
translation:
  language: hi
  text: इन सब से पहले बुद्धि की सृष्टि हुई[a], और विवेकपूर्ण समझ अनादिकाल से है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध इब्रानी पाठ का अधिक शाब्दिक अनुवाद है, “इन सब से बढ़कर बुद्धि महान है”; यूनानी समानांतर में है, “सब वस्तुओं से पहले बुद्धि की सृष्टि हुई।” मुख्य पाठ यूनानी पाठ का अनुसरण करता है।
    reason: alternative_reading
  - marker: b
    text: उपलब्ध इब्रानी की दूसरी पंक्ति है, “और सत्य अनादिकाल से प्रबल रहा है”; यूनानी में है, “और विवेकपूर्ण समझ अनादिकाल से है।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִכָּל אֵלֶּה / προτέρα πάντων
  choice: इन सब से पहले
  rationale: मौजूदा इब्रानी पाठ का स्वाभाविक अर्थ तुलनात्मक, ‘इन सब से बढ़कर,’ है; किंतु यूनानी समानांतर स्पष्टतः कालगत पूर्वता व्यक्त करता है। मुख्य पाठ में यूनानी संरचना रखी गई और इब्रानी पाठांतर पादटिप्पणी में दिया गया।
- source_word: רַבָּה / ἔκτισται
  choice: की सृष्टि हुई
  rationale: इब्रानी רַבָּה का अर्थ ‘महान है/बढ़ी’ होता है, जबकि यूनानी ἔκτισται ‘सृजी गई है’ कहता है। साक्ष्यों के तीखे अंतर को छिपाए बिना मुख्य पाठ यूनानी अर्थ का अनुसरण करता है।
- source_word: הַחָכְמָה
  choice: बुद्धि
  rationale: חכמה का मानक और सहज हिन्दी प्रतिशब्द; यहाँ व्यक्तिरूप संकेत संभव है, पर पाठ उसे अनिवार्य नहीं करता।
- source_word: הָאֱמֶת / σύνεσις φρονήσεως
  choice: विवेकपूर्ण समझ
  rationale: यूनानी पदबंध समझ और व्यावहारिक विवेक—दोनों का बोध देता है। ‘विवेकपूर्ण समझ’ अर्थ को स्वाभाविक हिन्दी में बनाए रखता है; इब्रानी ‘सत्य’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵעוֹלָם / ἐξ αἰῶνος
  choice: अनादिकाल से
  rationale: दोनों भाषाओं में आदिकालीन अथवा अत्यंत प्राचीन अस्तित्व का भाव है। ‘अनादिकाल से’ काव्यात्मक और धर्मवैचारिक तनाव बनाए रखते हुए सामान्य हिन्दी में सहज है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में दोनों पंक्तियों का गंभीर अंतर
  choice: मुख्य पाठ यूनानी की संरचना और मूल आशय का अनुसरण करता है तथा इब्रानी पाठ को पादटिप्पणियों में पूरा स्थान देता है।
  alternative: इन सब से बढ़कर बुद्धि महान है, और सत्य अनादिकाल से प्रबल रहा है।
  rationale: कहाना संस्करण की इब्रानी पंक्ति कोष्ठकबद्ध है और यूनानी से विधेय तथा दूसरी पंक्ति—दोनों में भिन्न है। इसलिए किसी एक परंपरा को बिना सूचना मिलाने के बजाय यूनानी पाठ मुख्य पंक्ति में और उपलब्ध इब्रानी पाठ स्पष्ट पाठांतर के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक लहजा। ‘बुद्धि,’ ‘सृष्टि’ और ‘अनादिकाल’ परिचित धार्मिक-काव्यात्मक शब्द हैं; पाठ-साक्ष्यों की अनिश्चितता पादटिप्पणियों में स्पष्ट रखी गई है।
