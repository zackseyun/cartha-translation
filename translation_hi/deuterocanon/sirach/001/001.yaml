  text: All wisdom is from the Lord[a], and it is with him forever.
translation:
  language: hi
  text: समस्त बुद्धि याहवे[a] से आती है, और वह सदा उसके साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का नाम ‘याहवे’ है; यूनानी समानांतर पाठ में ‘प्रभु’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: समस्त बुद्धि
  rationale: כָּל व्यापक समग्रता व्यक्त करता है और חָכְמָה का यहाँ सामान्य ज्ञान-साहित्यिक अर्थ ‘बुद्धि’ है। ‘समस्त बुद्धि’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल के सार्वभौमिक दावे को बनाए रखता है।
- source_word: מֵיהֹוָה
  choice: याहवे से आती है
  rationale: מִן स्रोत या उद्गम बताता है। हिन्दी में केवल ‘याहवे से है’ की अपेक्षा ‘याहवे से आती है’ अधिक स्वाभाविक है और अर्थ को स्पष्ट करती है; יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וִעמּוֹ הִיא
  choice: और वह उसके साथ है
  rationale: עִם का अर्थ ‘साथ’ है और सर्वनाम-प्रत्यय ‘उसके’ को सूचित करता है। हिब्रू का क्रियारहित वाक्य हिन्दी में ‘है’ जोड़कर स्वाभाविक रूप से व्यक्त होता है। ‘वह’ बुद्धि की ओर संकेत करता है, पर इससे अनावश्यक व्यक्तिकरण नहीं थोपा जाता।
- source_word: לְעוֹלָמִים
  choice: सदा
  rationale: यह बहुवचन रूप अनंत या निरंतर बने रहने का भाव देता है। ‘सदा’ संक्षिप्त, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है; यूनानी εἰς τὸν αἰῶνα भी इसी स्थायी कालबोध की पुष्टि करता है।
theological_decisions:
- issue: हिब्रू יהוה और समानांतर यूनानी Κύριος में परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: प्राथमिक हिब्रू साक्ष्य में चार-अक्षरीय व्यक्तिगत नाम יהוה है, इसलिए मुख्य पाठ में ‘याहवे’ उस विशिष्ट नाम को सुरक्षित रखता है। यूनानी समानांतर में ‘प्रभु’ है; इसे पादटिप्पणी में दर्ज किया गया है ताकि पाठ-परंपराओं का अंतर छिपे नहीं।
- issue: बुद्धि का संभावित व्यक्तिकरण
  choice: सामान्य स्त्रीलिंग संज्ञा के रूप में ‘वह’
  alternative: व्यक्तिरूप ‘वह स्त्री’ या कोई स्पष्ट दैवी व्यक्तित्व
  rationale: חָכְמָה व्याकरण की दृष्टि से स्त्रीलिंग है, पर अकेला यह पद पूर्ण व्यक्तिकरण सिद्ध नहीं करता। हिन्दी का ‘वह’ मूल संदर्भ को बनाए रखता है और किसी अतिरिक्त धर्मवैज्ञानिक पहचान को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समस्त बुद्धि’ मूल की व्यापकता को व्यक्त करता है, जबकि ‘से आती है’ स्रोत के भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
