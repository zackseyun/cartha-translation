  yaml_path: translation/deuterocanon/sirach/001/018.yaml
  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: hi
  text: याहवे का भय बुद्धि का आरम्भ है[a], और वह अपनी उपज की भरपूरी से मन को तृप्त करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उसने ज्ञान और समझ-बूझ बरसाई, और उसे थामे रहने वालों की महिमा को ऊँचा किया।” यहाँ यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत भिन्न है और सम्भवतः किसी अलग पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: आरम्भ
  rationale: यह इब्रानी शब्द किसी वस्तु के आरम्भ या प्रथम भाग को दर्शाता है। यहाँ प्रचलित ज्ञान-सूत्र के अनुरूप सीधा अर्थ रखा गया है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में यह स्वाभाविक और मानक हिन्दी शब्द है तथा आगे की स्त्रीलिंग मानवीकरण-भाषा को बनाए रखता है।
- source_word: יִרְאַת יְהֹוָה
  choice: याहवे का भय
  rationale: ‘भय’ मूल अभिव्यक्ति में निहित श्रद्धा, विस्मय और उचित डर के तनाव को बनाए रखता है; परमेश्वर के निजी नाम को ‘याहवे’ लिखा गया है।
- source_word: וּתְרַוֵּה
  choice: और वह ... तृप्त करती है
  rationale: क्रिया भर देने, सराबोर करने या तृप्त करने का भाव रखती है। ‘तृप्त करती है’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वह’ बुद्धि के स्त्रीलिंग मानवीकरण को सुरक्षित रखता है।
- source_word: בְּרֹב
  choice: की भरपूरी से
  rationale: यह साधन या सामग्री के साथ प्रचुर मात्रा का भाव व्यक्त करता है; ‘भरपूरी से’ हिन्दी में सहज है और प्रचुरता को बनाए रखता है।
- source_word: תְּבוּאָתָהּ
  choice: अपनी उपज
  rationale: संज्ञा खेत की उपज या पैदावार को दर्शाती है। ‘उपज’ कृषि-रूपक को बिना अनावश्यक विस्तार के बनाए रखता है, और ‘अपनी’ स्त्रीलिंग बुद्धि से उसके सम्बन्ध को स्पष्ट करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अन्तर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी के अनुसार: “उसने ज्ञान और समझ-बूझ बरसाई, और उसे थामे रहनेवालों की महिमा ऊँची की।”'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वास-स्तर वाला है, इसलिए उसे मुख्य आधार बनाया गया है। यूनानी पाठ बहुत भिन्न है और सम्भवतः किसी अलग पाठ-रूप को दर्शाता है; अतः उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: बुद्धि का स्त्रीलिंग मानवीकरण
  choice: ‘वह’ और ‘अपनी’ द्वारा मानवीकरण बनाए रखना
  alternative: बुद्धि को निर्जीव मानकर वाक्य को पुनर्गठित करना
  rationale: इब्रानी में सम्बन्धसूचक प्रत्यय स्त्रीलिंग है और ज्ञान-साहित्य में बुद्धि का स्त्रीरूप मानवीकरण सामान्य है। इसे सपाट या निर्जीव रूप देना स्रोत की साहित्यिक विशेषता मिटा देता।
