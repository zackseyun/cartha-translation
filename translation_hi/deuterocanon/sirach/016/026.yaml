  language: en
  yaml_path: translation/deuterocanon/sirach/016/026.yaml
  text: When God created his works from the beginning[a], he assigned their dominion over their living things.
translation:
  language: hi
  text: जब परमेश्वर ने आरम्भ से अपने कार्यों को रचा, तब उसने उनके जीवन पर उनका शासन बाँट दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति का इब्रानी पाठ कठिन है। यूनानी समानान्तर में है, “और उन्हें बनाने के समय उसने उनके भाग अलग-अलग कर दिए,” जो उनके भागों के विभाजन का भाव दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: जब ... ने सृष्टि की
  rationale: כ के साथ infinitive construct यहाँ स्वाभाविक रूप से कालवाचक है; हिन्दी में ‘जब’ इस संबंध को स्पष्ट और सहज रखता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह सामान्य ईश्वरीय उपाधि है; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַעֲשָׂיו
  choice: अपने कार्यों
  rationale: सन्दर्भ में इसका आशय परमेश्वर की बनाई हुई सृष्टि से है; ‘कार्य’ मूल के व्यापक अर्थ और सृष्टि-सन्दर्भ दोनों को बनाए रखता है।
- source_word: מֵרֹאשׁ
  choice: आरम्भ से
  rationale: यह सृष्टि-व्यवस्था के प्रारम्भिक बिन्दु को दर्शाता है और यूनानी ἀπ’ ἀρχῆς से भी मेल खाता है।
- source_word: עַל חַיֵּיהֶם
  choice: उनके जीवन के लिए
  rationale: प्रेषित इब्रानी कठिन और संदिग्ध है। यह अनुवाद ‘जीवन’ के प्रत्यक्ष अर्थ को बचाता है और ‘उनके जीवधारियों पर’ जैसी अधिक अनुमानाधारित व्याख्या से बचता है।
- source_word: חָלָק
  choice: बाँट दिया
  rationale: मूल धातु बाँटने या भाग ठहराने का भाव देती है; यूनानी समानान्तर का ‘उनके भाग अलग किए’ भी इसी अर्थ की पुष्टि करता है।
- source_word: מִשְׁטָרָם
  choice: उनका नियत क्रम
  rationale: शब्द शासन, व्यवस्था या प्रशासन को सूचित कर सकता है। सृष्टि-सन्दर्भ में ‘नियत क्रम’ अर्थ को स्वाभाविक रखता है, पर स्वतंत्र राजनीतिक प्रभुत्व का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: पाठ की दृष्टि से कठिन दूसरी पंक्ति में सृष्टि की व्यवस्था
  choice: इब्रानी के ‘जीवन’, बाँटने और व्यवस्था के संकेतों को रखते हुए ‘उनके जीवन के लिए उनका नियत क्रम बाँट दिया’ प्रस्तुत किया गया।
  alternative: 'यूनानी के अधिक निकट: ‘और उन्हें बनाने के समय उसने उनके भाग अलग-अलग कर दिए।’'
  rationale: इब्रानी साक्ष्य को प्राथमिक रखा गया है, जबकि यूनानी से केवल बाँटने/भाग ठहराने का सामान्य भाव पुष्ट किया गया है। अस्पष्ट संबंध को किसी विशिष्ट सृष्टि-विज्ञान या प्रभुत्व-सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। कठिन इब्रानी को अत्यधिक शाब्दिक अस्पष्टता या अत्यधिक निश्चित व्याख्या—दोनों से बचाते हुए प्रस्तुत किया गया है।
