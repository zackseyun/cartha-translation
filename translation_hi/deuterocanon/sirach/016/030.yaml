  yaml_path: translation/deuterocanon/sirach/016/030.yaml
  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: hi
  text: उसकी सतह ने हर जीव का जीवन ढक लिया,[a] और उसी की ओर उनका लौटना होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके मुख ने।” यहाँ आशय सम्भवतः पृथ्वी की सतह से है।
    reason: lexical_alternative
  - marker: b
    text: या, “और उसी में उनका लौटना होता है।” यह वाक्य जीवों के पृथ्वी में लौटने की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  choice: जीवन
  rationale: παντὸς ζῴου के साथ यहाँ ψυχή का अर्थ प्राणवान जीवन है; ‘आत्मा’ कहना अनावश्यक रूप से संकीर्ण और दार्शनिक अर्थ जोड़ सकता है।
- source_word: παντὸς ζῴου
  choice: हर जीव का
  rationale: ζῷον सभी जीवित प्राणियों को सूचित कर सकता है; ‘जीव’ व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκάλυψεν
  choice: ढक लिया
  rationale: यह क्रिया ‘ढकना’ का सीधा अर्थ देती है; भूतकालीन रूप यूनानी वाक्य के काल को दर्शाता है।
- source_word: τὸ πρόσωπον αὐτῆς
  choice: उसकी सतह
  rationale: शाब्दिक अर्थ ‘उसका मुख’ है, पर पृथ्वी के संदर्भ में πρόσωπον दृश्य सतह को सूचित करता है। ‘उसकी’ स्त्रीलिंग पूर्वसंदर्भ की अस्पष्टता को स्पष्ट noun जोड़े बिना बनाए रखता है।
- source_word: καὶ εἰς αὐτὴν
  choice: और उसी की ओर
  rationale: εἰς दिशा या भीतर जाने, दोनों को व्यक्त कर सकता है। ‘की ओर’ पृथ्वी की ओर वापसी बताता है, पर दफन किए जाने की छवि को अनिवार्य नहीं बनाता।
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: उनका लौटना होता है
  rationale: ἀποστροφή यहाँ वापस मुड़ने या लौटने का भाव देता है। यह हिन्दी में सामान्य सत्य को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: αὐτῆς/αὐτὴν स्त्रीलिंग सर्वनामों का संदर्भ
  choice: ‘उसकी ... उसी की ओर’ द्वारा निहित पृथ्वी का संदर्भ बनाए रखा गया है।
  alternative: ‘पृथ्वी की सतह ... पृथ्वी में’ कहकर संदर्भ को पूर्णतः स्पष्ट किया जा सकता है।
  rationale: आसपास के सृष्टि-वर्णन में सर्वनाम संभवतः पृथ्वी को सूचित करते हैं, पर इस पंक्ति में संज्ञा स्वयं उपस्थित नहीं है। इसलिए अनुवाद संदर्भ को निहित ही रखता है और पृथ्वी शब्द नहीं जोड़ता।
- issue: εἰς का दिशात्मक अथवा अंतर्मुखी अर्थ
  choice: ‘की ओर’
  alternative: ‘उसी में’
  rationale: दोनों अर्थ व्याकरणतः संभव हैं। मुख्य पाठ में दिशात्मक अर्थ चुना गया है, जबकि अधिक ठोस ‘में’ पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। निहित स्त्रीलिंग संदर्भ को ‘उसकी/उसी’ से रखा गया है; ‘पृथ्वी’ को मुख्य पाठ में जोड़कर यूनानी की संदर्भगत अस्पष्टता समाप्त नहीं की गई।
