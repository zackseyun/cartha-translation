base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: hi
  text: उसकी करुणा उसके सभी प्राणियों को दिखाई देती है,[b] और उसने अपना प्रकाश और अपनी स्तुति मनुष्यों को बाँट दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “आदम के पुत्रों को”; यह इब्रानी मुहावरा मानवजाति अर्थात मनुष्यों के लिए है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में यहाँ बहुत भिन्न वाक्य है: “ऊपर से मुझे कौन स्मरण करेगा?” मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  choice: उसकी करुणा
  rationale: इब्रानी बहुवचन רחמים दया और करुणामय कार्यों का सामूहिक भाव व्यक्त कर सकता है। स्वाभाविक हिन्दी में ‘उसकी करुणा’ इस भाव को गरिमापूर्ण और स्पष्ट रूप से रखता है।
- source_word: יֵרָאוּ
  choice: दिखाई देती है
  rationale: यहाँ ראה का निष्क्रिय अर्थ ‘देखी जाती है/दिखाई देती है’ संदर्भ के अनुकूल है। वचन-सामंजस्य हिन्दी के एकवचन सामूहिक संज्ञा ‘करुणा’ के अनुसार रखा गया है।
- source_word: לְכָל בִּרְיוֹתָיו
  choice: उसके सभी प्राणियों को
  rationale: पूर्वसर्ग ל यहाँ देखने वालों के संबंध में ‘को’ से स्वाभाविक रूप में व्यक्त होता है। ‘प्राणी’ בריותיו के सृजे हुए जीवों के भाव को बनाए रखता है।
- source_word: וְאוֹרוֹ
  choice: अपना प्रकाश
  rationale: אור का मूल चित्र ‘प्रकाश’ है; इसे बनाए रखने से उसके संभावित आत्मिक या प्रकटकारी अर्थ को अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: וְשִׁבְחוֹ
  choice: अपनी स्तुति
  rationale: שבח का सीधा अर्थ ‘स्तुति’ है। यह चयन ‘महिमा’ जैसे अधिक व्याख्यात्मक विकल्प को आरोपित किए बिना मूल की अर्थगत खुली स्थिति सुरक्षित रखता है।
- source_word: חָלַק
  choice: बाँट दी है
  rationale: חלק का अर्थ बाँटना या हिस्सा देना है। ‘बाँट दी है’ आधुनिक साधारण हिन्दी में सहज है और प्रकाश तथा स्तुति के वितरण का भाव रखता है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों को
  rationale: בני אדם शब्दशः ‘आदम के पुत्रों’ है, पर इब्रानी मुहावरे में समस्त मानवजाति का द्योतक है। मुख्य पाठ में ‘मनुष्यों’ से वही प्रतिनिधिक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है; शब्दशः रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בני אדם का मानवशास्त्रीय अर्थ
  choice: मनुष्यों को
  alternative: आदम के पुत्रों को / मानवजाति को
  rationale: यह व्याकरणतः पुल्लिंग इब्रानी मुहावरा है, पर संदर्भ में मानवजाति को समष्टिगत रूप से सूचित करता है। हिन्दी ‘मनुष्यों’ मूल अर्थ को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
- issue: ईश्वरीय ‘प्रकाश’ और ‘स्तुति’ का मनुष्यों में बाँटा जाना
  choice: उसने अपना प्रकाश और अपनी स्तुति मनुष्यों को बाँट दी है
  alternative: उसने अपनी ज्योति और अपनी महिमा मानवजाति में बाँट दी
  rationale: इब्रानी कथन यह स्पष्ट नहीं करता कि इसका आशय प्रकाशन, सम्मान, या स्तुति करने की क्षमता से है। सीधी संज्ञाएँ और ‘बाँट दी’ इस धर्मवैचारिक खुलापन को सुरक्षित रखते हैं।
- issue: इब्रानी और यूनानी पाठों का बड़ा अंतर
  choice: मुख्य पाठ उपलब्ध इब्रानी साक्ष्य पर आधारित है
  alternative: 'यूनानी: ‘ऊपर से मुझे कौन स्मरण करेगा?’'
  rationale: इस पद का यूनानी समानांतर आशय और शब्दावली दोनों में बहुत भिन्न है। दिए गए उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य को मुख्य पाठ मानते हुए यूनानी पाठ को पादटिप्पणी में सुरक्षित रखना पाठभेद को ईमानदारी से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘करुणा’, ‘प्रकाश’ और ‘स्तुति’ मूल बिंबों को बनाए रखते हैं; ‘बाँट दी है’ अत्यधिक संस्कृतनिष्ठ ‘विभाजित/आवंटित किया’ की तुलना में अधिक स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
