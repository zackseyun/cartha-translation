base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/015.yaml
  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: hi
  text: यहोवा ने उस फ़िरौन के हृदय को कठोर किया जो उसे नहीं जानता था, क्योंकि उसके कार्य आकाश के नीचे प्रकट हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “यह मत कहना, ‘मैं प्रभु से छिप जाऊँगा।’” यहाँ यूनानी साक्ष्य उपलब्ध इब्रानी पंक्ति से बहुत भिन्न है; यह किसी अलग पाठरूप या पद-विन्यास का संकेत हो सकता है।'
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को पारदर्शी रूप से लिप्यंतरित किया गया है; इससे मूल पाठ की विशिष्टता बनी रहती है।
- source_word: הִקְשָׁה
  choice: कठोर कर दिया
  rationale: हिफ़ील रूप किसी को कठोर या अडिग करने का भाव देता है और निर्गमन में फ़िरौन के प्रसंग की प्रतिध्वनि सुरक्षित रखता है।
- source_word: לֵב פַּרְעֹה
  choice: फ़िरौन का हृदय
  rationale: ‘हृदय’ विचार और इच्छा के भीतरी केंद्र का बाइबलीय रूपक है; इसे बनाए रखने से मूल मुहावरा और अंतरपाठीय संबंध दोनों सुरक्षित रहते हैं।
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: वह उसे नहीं जानता था
  rationale: सम्बन्धवाचक खंड का स्वाभाविक आशय फ़िरौन द्वारा यहोवा को न जानना है। इब्रानी में सम्बन्ध का सटीक भाव कुछ खुला है, इसलिए हिन्दी में कारण या विरोध का अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: שֶׁמַעֲשָׂיו
  choice: क्योंकि उसके काम
  rationale: आरम्भिक שׁ को यहाँ व्याख्यात्मक/कारणसूचक माना गया है। प्रत्यय स्वाभाविक रूप से फ़िरौन के कामों की ओर संकेत करता है, जो परमेश्वर से छिपे नहीं हैं।
- source_word: מְגֻלִּין תַּחַת הַשָּׁמַיִם
  choice: आकाश के नीचे प्रकट हैं
  rationale: निष्क्रिय कृदन्त का अर्थ खुले या उजागर होने का है; ‘आकाश के नीचे’ मूल बाइबलीय मुहावरे को सहज हिन्दी में रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया और यूनानी भिन्नता को पादटिप्पणी में रखा गया।
  alternative: 'यूनानी के अनुसार: “यह मत कहना, ‘मैं प्रभु से छिप जाऊँगा।’”'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है। यूनानी पंक्ति उससे पर्याप्त रूप से भिन्न है और सम्भवतः अलग पाठरूप या पद-विन्यास दर्शाती है; अतः उसे मुख्य पाठ में मिलाए बिना स्पष्ट रूप से दर्ज किया गया है।
- issue: אֲשֶׁר का सम्बन्ध और अर्थ
  choice: ‘वह उसे नहीं जानता था’—फ़िरौन को कर्ता और यहोवा को कर्म माना गया, पर स्पष्ट कारणसूचक या विरोधसूचक संयोजक नहीं जोड़ा गया।
  alternative: ‘यद्यपि वह उसे नहीं जानता था’ अथवा ‘क्योंकि वह उसे नहीं जानता था।’
  rationale: इब्रानी सम्बन्धवाचक खंड स्वयं ‘यद्यपि’ या ‘क्योंकि’ को अनिवार्य नहीं करता। अपेक्षाकृत सीधा अनुवाद वास्तविक अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय कठोर कर दिया’ और ‘आकाश के नीचे’ जैसे बाइबलीय मुहावरे जानबूझकर सुरक्षित रखे गए हैं।
