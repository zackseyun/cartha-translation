  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
translation:
  language: hi
  text: इसी प्रकार वे छह लाख पैदल सैनिक भी[a], जो अपने मन के अहंकार में इकट्ठा किए गए थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छह लाख पैदल सैनिक’ संभवतः निर्जन प्रदेश की इस्राएली पीढ़ी की ओर संकेत करता है; तुलना करें निर्गमन 12:37 और गिनती 11:21।
    reason: cross_reference
  - marker: b
    text: ‘अहंकार’ के लिए प्रयुक्त शब्द का अनुवाद ‘ढिठाई’, ‘धृष्टता’ या ‘दुस्साहस’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: इसी प्रकार … भी
  rationale: यह पिछले न्याय-दृष्टांतों के साथ एक और समानांतर उदाहरण जोड़ता है; हिन्दी में विभाजित पदबंध स्वाभाविक रूप से इस संयोजक बल को व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: छः लाख
  rationale: हिब्रू की संख्या 600,000 को हिन्दी की स्वाभाविक संख्या-पद्धति में ठीक-ठीक व्यक्त किया गया है।
- source_word: רַגְלִי
  choice: पैदल सैनिक
  rationale: शब्द का मूल अर्थ पैदल चलने वालों से संबंधित है और यूनानी πεζῶν सैनिक संदर्भ की पुष्टि करता है; ‘पैदल सैनिक’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַנֶּאֱסָפִים
  choice: जो … इकट्ठे हुए थे
  rationale: אסף के निष्पन्न कर्मवाच्य कृदंत का सामूहिक अर्थ सुरक्षित रहता है और हिन्दी वाक्य सहज बनता है।
- source_word: בִּזְדוֹן
  choice: अहंकार में
  rationale: זדון उद्दंड, धृष्ट या दुस्साहसी घमंड को सूचित करता है; ‘अहंकार’ मुख्य पाठ में सहज है, जबकि अधिक तीखे संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: לִבָּם
  choice: अपने मन के
  rationale: हिब्रू में बहुवचन प्रत्यय के साथ सामूहिक एकवचन ‘हृदय’ है। हिन्दी में ‘अपने मन के’ उसी आंतरिक प्रवृत्ति को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: छः लाख लोगों की पहचान
  choice: मुख्य पाठ में समूह को इस्राएल या निर्जन प्रदेश की पीढ़ी के रूप में स्पष्टतः नाम नहीं दिया गया।
  alternative: इसे निर्गमन और गिनती की जनगणना में उल्लिखित इस्राएल की निर्जन प्रदेश वाली पीढ़ी के रूप में अनूदित करना।
  rationale: संख्या उस पीढ़ी की ओर प्रबल संकेत करती है, पर इस पद में समूह का नाम नहीं दिया गया है। इसलिए संभावित पहचान को पाद-टिप्पणी तक सीमित रखना मूल पाठ की अंतर्निहितता और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। पद की मूल वाक्यखंड-जैसी संरचना और पिछले संदर्भ से उसका संबंध बनाए रखा गया है; ‘वे’ हिन्दी में समूह को स्पष्ट करता है, पर उसकी पहचान नहीं जोड़ता।
