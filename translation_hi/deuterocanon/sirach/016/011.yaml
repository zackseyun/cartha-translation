base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: hi
  text: यदि एक भी व्यक्ति हठपूर्वक गर्दन अकड़ाने वाला हो, तो उसका दोषमुक्त ठहराया जाना आश्चर्य की बात होगी।[a] क्योंकि परमेश्वर के पास दया और क्रोध दोनों हैं; वह सहता है और क्षमा करता है, पर दुष्टों पर अपना प्रकोप ठहरा देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दोषमुक्त ठहराया जाना” का अर्थ “बरी किया जाना” या “दण्ड से बच जाना” भी हो सकता है। इब्रानी יִנָּקֶה और यूनानी ἀθῳωθήσεται दोनों में न्यायिक अर्थ निहित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक बिंब है, “वह दुष्टों पर अपना प्रकोप ठहरा देता है”—अर्थात प्रकोप केवल भड़कता नहीं, उन पर आकर ठहर जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: हठपूर्वक अपनी गर्दन अकड़ाए
  rationale: यह इब्रानी मुहावरे के शारीरिक बिंब और उसके आशय—हठीले प्रतिरोध—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: आश्चर्य की बात होगी
  rationale: यह सम्भावना पर व्यक्त विस्मय को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: निर्दोष ठहराया जाना
  rationale: दोनों स्रोतों में उपस्थित न्यायिक अर्थ को प्रमुख रखता है, जबकि दण्ड से बच निकलने का निकट अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: רַחֲמִים
  choice: दया
  rationale: करुणामय अनुग्रह का स्पष्ट आधुनिक शब्द है और क्रोध के साथ मूल विरोध को बनाए रखता है।
- source_word: אַף
  choice: क्रोध
  rationale: यहाँ शब्द संयोजक नहीं, क्रोध-संज्ञा है; आगे के רָגְזוֹ से इसका समानांतर सम्बन्ध भी स्पष्ट है।
- source_word: וְנוֹשֵׂא
  choice: वह सहता है
  rationale: मूल क्रिया के ‘उठाने/सहन करने’ के संक्षिप्त भाव को नैतिक प्रसंग में स्वाभाविक हिन्दी देता है, बिना इसे क्षमा का पूर्ण पर्याय बनाए।
- source_word: וְסוֹלֵחַ
  choice: क्षमा करता है
  rationale: ईश्वरीय अपराध-क्षमा के लिए क्रिया का सामान्य और स्पष्ट अर्थ है।
- source_word: יַנִּיחַ רָגְזוֹ
  choice: अपना प्रकोप टिकाए रखता है
  rationale: दुष्टों पर प्रकोप के आकर ठहरने के मूल बिंब को सुरक्षित रखता है; केवल क्षणिक भड़क उठने का अर्थ नहीं देता।
theological_decisions:
- issue: परमेश्वर के स्वभाव में दया और क्रोध का साथ-साथ वर्णन
  choice: दया और क्रोध दोनों को उसके साथ बताया गया है, और क्षमा तथा दुष्टों पर टिके प्रकोप—दोनों को यथावत रखा गया है।
  alternative: वाक्य को इस प्रकार सहज बनाना कि केवल दया पर बल पड़े, या क्रोध को क्षणिक अप्रसन्नता मान लिया जाए।
  rationale: इब्रानी पाठ जानबूझकर दया और क्रोध, फिर सहनशीलता/क्षमा और दुष्टों पर प्रकोप को साथ रखता है; अनुवाद इस धर्मवैचारिक तनाव का समाधान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘गर्दन अकड़ाए’ से बाइबलीय मुहावरा बचाया गया है; ‘निर्दोष ठहराया’ न्यायिक स्वर रखता है। सर्वनाम ‘उसके/वह’ संदर्भानुसार परमेश्वर के लिए हैं, पर स्रोत की संक्षिप्तता को बनाए रखने हेतु नाम नहीं जोड़ा गया।
