base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/001.yaml
  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
translation:
  language: hi
  text: निकम्मे युवकों के रूप की लालसा मत कर[a], और अधर्मी पुत्रों के कारण आनन्दित मत हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “निकम्मे बच्चों की बहुतायत की लालसा मत कर, और भक्तिहीन पुत्रों के कारण आनन्दित मत हो।” इसके विपरीत, इब्रानी साक्ष्य निकम्मे युवकों के बाहरी रूप की बात करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: लालसा मत कर
  rationale: אַל के साथ क्रिया निषेध व्यक्त करती है। ‘लालसा मत कर’ इच्छा की प्रबलता को स्वाभाविक आधुनिक हिन्दी में रखता है, बिना इसे कामुक अर्थ देने के।
- source_word: תֹּאַר
  choice: रूप
  rationale: תֹּאַר बाहरी आकार-प्रकार या रूप-सौन्दर्य को दर्शाता है। ‘रूप’ स्रोत की संक्षिप्तता और बाहरी दिखावट पर उसके बल को बनाए रखता है; ‘सुन्दर रूप’ कहना स्रोत से अधिक स्पष्टता जोड़ता।
- source_word: נַעֲרֵי שָׁוְא
  choice: निकम्मे युवकों
  rationale: נַעֲרֵי का अर्थ युवक/जवान पुरुष है, और שָׁוְא यहाँ खोखलेपन, व्यर्थता या निकम्मेपन का नैतिक-व्यावहारिक भाव देता है। ‘निकम्मे युवक’ सामान्य हिन्दी में समझने योग्य है।
- source_word: וְאַל תִּשְׂמַח
  choice: और ... आनन्दित मत हो
  rationale: यह पहले निषेध के समानान्तर दूसरा निषेध है। ‘आनन्दित मत हो’ भावात्मक अर्थ और ज्ञान-साहित्य की गरिमा दोनों रखता है।
- source_word: בִּבְנֵי עַוְלָה
  choice: अधर्मी पुत्रों के कारण
  rationale: शाब्दिक मुहावरा ‘अधर्म के पुत्र’ है। हिन्दी में ‘अधर्मी पुत्र’ स्वाभाविक है और עַוְלָה के अन्याय/अधर्म के नैतिक अर्थ को बनाए रखता है। בְּ को यहाँ आनन्द के कारण या आधार के अर्थ में ‘के कारण’ किया गया है।
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: मुख्य पाठ में नहीं अपनाया
  rationale: यूनानी पाठ ‘निकम्मे बच्चों की बहुतायत’ कहता है, जबकि उपलब्ध इब्रानी पाठ ‘निकम्मे युवकों के रूप’ की बात करता है। उपलब्ध इब्रानी साक्ष्य को मुख्य पाठ में और यूनानी भिन्न पाठ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण
  alternative: 'यूनानी: ‘निकम्मे बच्चों की बहुतायत की लालसा मत कर, और भक्तिहीन पुत्रों के कारण आनन्दित मत हो।’'
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए वही मुख्य पाठ का आधार है। अर्थपूर्ण यूनानी भिन्नता को दबाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक निषेध। एकवचन आज्ञार्थ ‘मत कर/मत हो’ मूल इब्रानी संबोधन के अनुरूप है। ‘रूप’ जानबूझकर अस्पष्ट रखा गया है ताकि बाहरी दिखावट का संकेत बना रहे, पर स्रोत में निहित न होने पर ‘सुन्दर’ न जोड़ा जाए।
