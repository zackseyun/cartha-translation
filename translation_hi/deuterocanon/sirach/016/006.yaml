    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲדַת רְשָׁעִים
  choice: दुष्टों की सभा में
  rationale: עֵדָה का अर्थ संगठित सभा या समुदाय है और בְּ यहाँ स्थानवाचक है। רְשָׁעִים के नैतिक अर्थ को ‘दुष्टों’ से सीधे और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: יוֹקֶדֶת אֵשׁ
  choice: आग धधकती है
  rationale: יקד जलने या प्रचंड रूप से दहकने का भाव देता है। ‘धधकती है’ वर्तमान सक्रियता और काव्यात्मक तीव्रता दोनों बनाए रखता है।
- source_word: וּבְגוֹי חָנֵף
  choice: और अधर्मी राष्ट्र में
  rationale: גוי के लिए ‘राष्ट्र’ और स्थानवाचक בְּ के लिए ‘में’ लिया गया है। חָנֵף यहाँ धर्महीनता या अपवित्र नैतिक दशा को दर्शाता है; ‘अधर्मी’ आधुनिक हिन्दी में गरिमापूर्ण और व्यापक समतुल्य है।
- source_word: נִצְּתָה חֵמָה
  choice: कोप भड़क उठा
  rationale: נצתה प्रज्वलित या भड़क उठने का रूपक रखता है और उसका पूर्ण क्रियाभाव ‘भड़क उठा’ में सुरक्षित है। חֵמָה के तीव्र रोष के लिए ‘कोप’ उपयुक्त गरिमापूर्ण शब्द है।
theological_decisions:
- issue: חָנֵף को इब्रानी के अनुसार ‘अधर्मी’ रखना या यूनानी ἀπειθεῖ के अनुसार ‘अवज्ञाकारी’ करना
  choice: अधर्मी
  alternative: अवज्ञाकारी
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी पाठ निकट संबंध वाला किंतु विशिष्ट रूप से भिन्न अर्थ देता है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘धधकती है’ और ‘भड़क उठा’ आग तथा कोप के समानांतर बिंब को बनाए रखते हैं, जबकि इब्रानी के वर्तमान और पूर्ण क्रियाभाव का अंतर भी सुरक्षित रहता है।
