translation:
  language: hi
  text: और इसके बाद प्रभु ने पृथ्वी पर दृष्टि की और उसे अपनी अच्छी वस्तुओं से भर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह यूनानी पद घटनाक्रम में समयगत क्रम बताता है; ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ Κύριος परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ हिन्दी बाइबलीय भाषा में प्रतिष्ठित, स्पष्ट और संक्षिप्त रूप है।
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  choice: पृथ्वी पर दृष्टि की
  rationale: ἐπιβλέπω किसी की ओर निगाह करने या ध्यानपूर्वक देखने को व्यक्त करता है। ‘दृष्टि की’ मूल अर्थ और पद की गरिमा को बनाए रखता है।
- source_word: ἐνέπλησεν
  choice: भर दिया
  rationale: क्रिया पृथ्वी को किसी वस्तु से परिपूर्ण करने का सीधा अर्थ देती है; ‘भर दिया’ सहज हिन्दी है।
- source_word: τῶν ἀγαθῶν αὐτοῦ
  choice: अपनी अच्छी वस्तुओं से
  rationale: ἀγαθά का अर्थ व्यापक रूप से अच्छी वस्तुएँ या हितकारी चीज़ें है। यह अनुवाद ‘वरदानों’ या ‘आशीषों’ जैसी अधिक व्याख्यात्मक सीमाओं को आरोपित नहीं करता।
theological_decisions:
- issue: ईश्वरीय उपाधि Κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: संदर्भ में Κύριος परमेश्वर की उपाधि है। ‘प्रभु’ आधुनिक हिन्दी के बाइबलीय प्रयोग में स्वाभाविक है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से सामान्य मानवीय संबोधन जैसा लग सकता है।
- issue: τῶν ἀγαθῶν αὐτοῦ की व्यापकता
  choice: अपनी अच्छी वस्तुओं से
  alternative: अपनी आशीषों से
  rationale: मूल पद अच्छी और हितकारी वस्तुओं का व्यापक बोध देता है। ‘आशीषों’ से अर्थ धार्मिक लाभों तक सीमित हो सकता है, इसलिए मूल की अर्थगत खुली प्रकृति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की सरल समन्वयी संरचना यूनानी मूल के क्रम को बनाए रखती है।
