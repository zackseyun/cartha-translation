  text: Even to me he will not pay attention[a], and who will consider my ways?
translation:
  language: hi
  text: “वह मुझ पर भी ध्यान नहीं देगा[a], और मेरे चालचलन पर कौन विचार करेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में ‘वह’ से प्रभु का संकेत मिलता है, यद्यपि इब्रानी में कर्ता कहा नहीं गया है; शाब्दिक रूप से, “वह मुझ पर मन नहीं लगाएगा।”
    reason: अव्यक्त कर्ता और इब्रानी मुहावरे की व्याख्या।
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले विचार में एक और धारणा जोड़ता है; हिन्दी में ‘भी’ स्वाभाविक रूप से ‘मुझ पर भी’ के साथ आता है और ‘even/also’ का बल बनाए रखता है।
- source_word: עָלַי
  choice: मुझ पर
  rationale: שׂים לב के साथ इसका अर्थ किसी पर ध्यान देना है; ‘मुझ पर ध्यान देना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: לֹא יָשִׂים לֵב
  choice: ध्यान नहीं देगा
  rationale: शाब्दिक ‘हृदय नहीं लगाएगा’ की अपेक्षा यह इब्रानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी अर्थ व्यक्त करता है।
- source_word: וּבִדְרָכַי
  choice: और मेरे चालचलन पर
  rationale: यहाँ ‘मार्ग’ व्यक्ति के आचरण और जीवन-व्यवहार का बोध कराता है; ‘चालचलन’ उस आशय को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: מִי יִתְבּוֹנָן
  choice: कौन विचार करेगा
  rationale: התבונן ध्यानपूर्वक सोचने या विचार करने को दर्शाता है; यह आलंकारिक प्रश्न के लिए उपयुक्त है।
theological_decisions:
- issue: יָשִׂים का अव्यक्त एकवचन कर्ता
  choice: मुख्य पाठ में ‘वह’ रखा गया है और पादटिप्पणी में प्रसंगतः प्रभु की ओर संकेत बताया गया है।
  alternative: ‘प्रभु मुझ पर भी ध्यान नहीं देगा’ अथवा ‘कोई मुझ पर ध्यान नहीं देगा।’
  rationale: इब्रानी क्रिया का कर्ता व्यक्त नहीं किया गया है। प्रसंग प्रभु की ओर संकेत करता है, पर मुख्य पाठ में सीधे ‘प्रभु’ जोड़ने से मूल की वास्तविक अस्पष्टता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल और गरिमापूर्ण रखी गई है। वक्ता की धृष्ट धारणा दिखाने के लिए कथन को उद्धरण-चिह्नों में रखा गया है।
