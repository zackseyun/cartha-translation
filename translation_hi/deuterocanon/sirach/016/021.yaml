base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/021.yaml
  text: If I have sinned, no eye sees me; or if I lie, who knows it in every hiding place?
translation:
  language: hi
  text: यदि मैंने पाप किया है, तो कोई आँख मुझे नहीं देखती; या यदि मैं झूठ बोलूँ, तो हर गुप्त स्थान में उस बात को कौन जानता है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ यहाँ बहुत भिन्न है। उसमें, अन्य बातों के साथ, ऐसे तूफ़ान का उल्लेख है जिसे मनुष्य नहीं देखेगा, और यह कहा गया है कि उसके अधिकांश कार्य गुप्त स्थानों में हैं। इस पद के लिए उपलब्ध इब्रानी पाठ को मुख्य माना गया है।
    reason: textual_variant
  - marker: b
    text: या, ‘हर छिपे हुए स्थान में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: यदि मैंने पाप किया है
  rationale: אִם के साथ पूर्ण क्रिया सामान्य काल्पनिक शर्त व्यक्त करती है; हिन्दी में पूर्णतासूचक रूप इस भाव को स्वाभाविक ढंग से रखता है।
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: कोई आँख मुझे नहीं देखती
  rationale: इब्रानी में ‘आँख’ कर्ता है; ठोस बिंब को ‘कोई मुझे नहीं देखता’ में समतल करने के बजाय सुरक्षित रखा गया है।
- source_word: אוֹ אִם אֲכַזֵב
  choice: या यदि मैं झूठ बोलूँ
  rationale: כזב यहाँ छिपे हुए अनुचित आचरण के संदर्भ में झूठ बोलने अथवा असत्य होने का भाव देता है; ‘झूठ बोलूँ’ आधुनिक हिन्दी में सबसे स्पष्ट है।
- source_word: בְּכָל סֵתֶר
  choice: हर गुप्त स्थान में
  rationale: סֵתֶר किसी छिपे या गुप्त स्थान को दर्शाता है। ‘गुप्त स्थान’ स्थानवाचक अर्थ बनाए रखता है और हिन्दी में सहज है।
- source_word: מִי יוֹדֵעַ
  choice: उसे कौन जानता है?
  rationale: मूल में शाब्दिक रूप से ‘कौन जानता है?’ है। हिन्दी में संदर्भित झूठ अथवा छिपे कर्म की स्पष्टता के लिए ‘उसे’ जोड़ा गया है।
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: मुख्य पाठ नहीं, केवल गुप्तता के भाव की तुलना के लिए
  rationale: यूनानी समानांतर इस पद में इब्रानी से बहुत अलग है, पर ἐν ἀποκρύφοις गुप्तता का भाव पुष्ट करता है। उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ को प्राथमिक रखा गया है।
theological_decisions:
- issue: सिराख के इस पद में भिन्न इब्रानी और यूनानी पाठों की प्राथमिकता
  choice: उपलब्ध इब्रानी को मुख्य पाठ मानकर अनुवाद करना और गुप्तता के अर्थ की पुष्टि के लिए यूनानी समानांतर से परामर्श लेना
  alternative: यूनानी-आधारित पाठ, जिसमें मनुष्य से अदृश्य तूफ़ान और उसके बहुत-से गुप्त कार्यों का उल्लेख है; अथवा दोनों पाठों का मिश्रण
  rationale: इस पद का इब्रानी साक्ष्य उपलब्ध और उच्च विश्वसनीयता वाला है। यूनानी पाठ में पर्याप्त भिन्नता है, इसलिए उसे मिलाकर मूल की पाठगत तनातनी मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘कोई आँख’ का इब्रानी बिंब बनाए रखा गया है। वक्ता की आत्म-भ्रमपूर्ण धारणा को कथन के रूप में रखा गया है; व्याख्यात्मक शब्द जोड़कर उसे प्रत्यक्ष दैवी उत्तर में नहीं बदला गया।
