  text: He did not spare the princes of old[b][a], who revolted in their might.
translation:
  language: hi
  text: उसने पुराने समय के शासकों[a] को नहीं बख्शा, जिन्होंने अपनी शक्ति में विद्रोह किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “प्राचीन दैत्य”; यह “पुराने समय के शासकों” को आदिकालीन विद्रोही दैत्यों के रूप में पहचानता है।'
    reason: alternative_reading
  - marker: b
    text: इस स्थान पर इब्रानी पाठ में עוֹלָם शब्द पाठगत रूप से कठिन है; यूनानी समानांतर “अपनी शक्ति में” अर्थ का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: לֹא נָשָׂא
  choice: नहीं छोड़ा
  rationale: व्यक्तियों के संदर्भ में निषेध के साथ यह मुहावरा क्षमा या दंड से छूट न देने का भाव रखता है। ‘नहीं छोड़ा’ न्याय के प्रसंग में स्वाभाविक है और यूनानी समानांतर से भी पुष्ट होता है।
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: प्राचीनकाल के प्रधानों
  rationale: इब्रानी पाठ का शाब्दिक भाव ‘पुराने समय के प्रधान/शासक’ है। ‘प्रधानों’ से पद और प्रतिष्ठा का भाव बना रहता है; यूनानी का ‘प्राचीन दैत्य’ पाठ-टिप्पणी में सुरक्षित रखा गया है।
- source_word: הַמּוֹרִים
  choice: विद्रोही हुए
  rationale: מרה अवज्ञा और विद्रोह को व्यक्त करता है। कृदंत के वर्णनात्मक बल को बनाए रखने के लिए ‘विद्रोही हुए’ चुना गया है।
- source_word: בִּגְבוּרָתָם
  choice: अपने पराक्रम के बल पर
  rationale: גבורה सामर्थ्य, वीरता या पराक्रम को दर्शाता है। यह अभिव्यक्ति बताती है कि उनका अपना सामर्थ्य उनके विद्रोह का आधार था।
- source_word: עוֹלָם
  choice: मुख्य पाठ में पृथक रूप से अनूदित नहीं
  rationale: प्रेषित इब्रानी पंक्ति में यह शब्द इस स्थान पर पाठगत रूप से कठिन है। यूनानी समानांतर ‘अपने बल में’ का समर्थन करता है; इसलिए अर्थ को בִּגְבוּרָתָם के साथ संयुक्त वाक्यांश में व्यक्त किया गया और कठिनाई को टिप्पणी में बताया गया है।
theological_decisions:
- issue: दंड पाए समूह की पहचान
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘प्राचीनकाल के प्रधान’
  alternative: ‘प्राचीन दैत्य’
  rationale: जहाँ इब्रानी उपलब्ध है, उसे मुख्य पाठ का आधार बनाया गया है। यूनानी समानांतर इन प्राचीन प्रधानों को आदिकालीन दैत्यों के रूप में पहचानता है; इस प्राचीन व्याख्यात्मक पहचान को टिप्पणी में रखा गया है, ताकि दोनों साक्ष्य सुरक्षित रहें।
- issue: उनके विद्रोह और सामर्थ्य का संबंध
  choice: ‘अपने पराक्रम के बल पर विद्रोही हुए’
  alternative: ‘अपने पराक्रम में विद्रोह किया’
  rationale: यह चयन उनके सामर्थ्य को विद्रोह के आधार या भरोसे के रूप में प्रस्तुत करता है, पर कारण और परिस्थिति के बीच मूल की संभावित अर्थगत व्यापकता को पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘प्रधान’ प्राचीन पद-सूचक भाषा को बनाए रखता है, जबकि ‘नहीं छोड़ा’ न्याय के प्रसंग में सहज मुहावरा है। सभी टिप्पणियों के चिह्न मुख्य पाठ में दिए गए हैं।
