  yaml_path: translation/deuterocanon/sirach/016/009.yaml
  text: And he did not spare a people devoted to destruction[a], those trampled down in their iniquity.
translation:
  language: hi
  text: और उसने विनाश के लिए अर्पित एक जाति को नहीं बख्शा[a]—उन लोगों को, जो अपने अधर्म में रौंदे गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “विनाश की एक जाति, वे जो अपने पापों में दूर कर दिए गए।” हिब्रू में रौंदे या कुचले जाने का बिंब जान पड़ता है; यूनानी अलग शब्दावली में उससे निकटता से जुड़ा न्याय का भाव व्यक्त करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: और उसने ... नहीं बख्शा
  rationale: חמל का अर्थ दया करना या छोड़ देना हो सकता है। न्याय के इस प्रसंग में “नहीं बख्शा” स्वाभाविक है और दंड से न छोड़ने का भाव स्पष्ट करता है।
- source_word: גוֹי
  choice: एक जाति
  rationale: גוי किसी जनसमुदाय या जाति को दर्शाता है। यहाँ “जाति” आधुनिक राष्ट्र-राज्य का अनावश्यक संकेत दिए बिना सामूहिक अर्थ को बनाए रखता है।
- source_word: חֶרֶם
  choice: विनाश के लिए अर्पित
  rationale: חרם ऐसी वस्तु या प्रजा के लिए प्रयुक्त होता है जिसे प्रतिबंध के अधीन विनाश के लिए अलग किया गया हो। “विनाश के लिए अर्पित” इसके धार्मिक और न्यायिक भार को बनाए रखता है; केवल “विनाश के लिए ठहराई गई” कहने से इसका अर्पण/प्रतिबंध संबंधी पक्ष दब सकता है।
- source_word: הַנּדוֹשִׁים
  choice: जो ... रौंदे गए थे
  rationale: कठिन हिब्रू रूप संभवतः रौंदने या दाँवने से संबंधित मूल से निकला है। “रौंदे गए” मूल बिंब को सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: בַּעֲוֹנָם
  choice: अपने अधर्म में
  rationale: עון में पाप के साथ दोष और कुटिलता का भाव भी है। ב उपसर्ग को “में” रखकर हिब्रू की वास्तविक अस्पष्टता बचती है कि अधर्म उनकी दशा है या उनके न्याय का कारण।
theological_decisions:
- issue: न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए अर्पित
  alternative: प्रतिबंध के अधीन; विनाश के लिए ठहराई गई
  rationale: चुना हुआ रूप शब्द के धार्मिक-न्यायिक अर्थ और न्याय की कठोरता दोनों को व्यक्त करता है, पर किसी बाद की सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: कठिन हिब्रू הַנּדוֹשִׁים और यूनानी समानांतर का संबंध
  choice: मुख्य पाठ में “अपने अधर्म में रौंदे गए”
  alternative: अपने पापों में दूर कर दिए गए
  rationale: मुख्य पाठ हिब्रू साक्ष्य के रौंदने वाले बिंब को प्राथमिकता देता है। यूनानी में निकाले या दूर किए जाने से जुड़ी भिन्न किंतु न्याय-संबंधी अभिव्यक्ति है; इसलिए उसे पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “अधर्म” नैतिक दोष के भार को तथा “रौंदे गए” हिब्रू के ठोस बिंब को बनाए रखता है।
