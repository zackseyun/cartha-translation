base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: hi
  text: उसने अपने कार्यों को सदा के लिए सुव्यवस्थित किया, और उनके अधिकार-क्षेत्रों[a] को उनकी पीढ़ियों के लिए ठहराया। न वे भूखे हुए, न थके, और न उन्होंने अपने कार्य करना छोड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उनके आरंभों को उनकी पीढ़ियों के लिए।’ यूनानी शब्द का अर्थ ‘आरंभ’ अथवा ‘अधिकार या शासन के क्षेत्र’ हो सकता है; यहाँ सृष्टि में नियत कार्य-क्षेत्र का अर्थ संदर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: सुव्यवस्थित किया … नियत किया
  rationale: क्रिया का मूल भाव सजाना नहीं, बल्कि क्रम में रखना या व्यवस्थित करना है। दूसरे खंड में यूनानी क्रिया निहित है; स्वाभाविक हिन्दी में उसे ‘नियत किया’ के रूप में दोहराया गया है।
- source_word: εἰς αἰῶνα
  choice: सदा के लिए
  rationale: यह सृष्टि के कार्यों की स्थायी और निरंतर व्यवस्था व्यक्त करता है।
- source_word: τὰ ἔργα αὐτοῦ
  choice: अपने कार्यों
  rationale: यह परमेश्वर की बनाई हुई कृतियों और उनके व्यवस्थित कार्य—दोनों की ओर संकेत कर सकता है; ‘कार्यों’ से यह व्यापकता बनी रहती है।
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: उनके अधिकार-क्षेत्रों
  rationale: ἀρχή का अर्थ ‘आरंभ’ भी हो सकता है, पर बहुवचन में यह अधिकार, शासन अथवा नियत क्षेत्र का बोध दे सकता है। सृष्टि के प्राणियों द्वारा अपने नियत काम निरंतर करने के संदर्भ में ‘अधिकार-क्षेत्र’ अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εἰς γενεὰς αὐτῶν
  choice: उनकी पीढ़ियों तक
  rationale: यह उनकी क्रमिक पीढ़ियों या युगों में व्यवस्था के बने रहने को व्यक्त करता है।
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: वे न भूखे हुए, न थके
  rationale: यूनानी के समानांतर नकारात्मक वाक्य-विन्यास और सृष्टि के कार्यों की निर्बाधता को सीधे रूप में रखा गया है।
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: अपने कार्यों से कभी नहीं चूके
  rationale: ἐκλείπω यहाँ विफल होने, पीछे हटने या काम छोड़ देने का भाव रखता है। ‘कभी नहीं चूके’ निरंतर और विश्वसनीय कार्य-निष्पादन को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τὰς ἀρχὰς αὐτῶν में सृष्टि के ‘आरंभ’ या उसके नियत अधिकार-क्षेत्र
  choice: मुख्य पाठ में सृष्टि के कार्यों के स्थायी, नियत अधिकार-क्षेत्र
  alternative: उनके आरंभ उनकी पीढ़ियों तक
  rationale: आस-पास का प्रसंग सृष्टि की सुव्यवस्थित और निरंतर गतिविधि का वर्णन करता है, इसलिए अधिकार अथवा नियत कार्य-क्षेत्र का अर्थ संदर्भ में अधिक संगत है। फिर भी यूनानी शब्द का ‘आरंभ’ अर्थ वास्तविक है, इसलिए उसे पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। ‘अधिकार-क्षेत्र’ सृष्टि की नियत भूमिकाओं को स्पष्ट करता है, जबकि पादटिप्पणी मूल यूनानी की वास्तविक शब्दार्थगत अस्पष्टता को सुरक्षित रखती है।
