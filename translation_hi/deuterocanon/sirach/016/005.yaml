translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘मेरी आँख’ और ‘मेरे कान’ के एकवचन रूप मूल की काव्यात्मक समानांतरता बनाए रखते हैं; ‘प्रबल’ ऊँचे भाव को रखता है, पर अत्यधिक पुरातन नहीं लगता।
