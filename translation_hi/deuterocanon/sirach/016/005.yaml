  yaml_path: translation/deuterocanon/sirach/016/005.yaml
  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
translation:
  language: hi
  text: मेरी आँख ने ऐसी बहुत-सी बातें देखी हैं, और मेरे कान ने ऐसी ही प्रबल बातें सुनी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनसे भी अधिक प्रबल बातें।” हिब्रू में “ऐसी प्रबल बातें” है, जबकि यूनानी पाठ स्पष्ट रूप से “इनसे भी अधिक प्रबल बातें” कहता है।
    reason: पाठ-परंपरा और तुलनात्मक अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: ऐसी बहुत-सी बातें
  rationale: रַבּוֹת मात्रा को और כָּאֵלֶּה ‘ऐसी/इन जैसी’ तुलना को व्यक्त करता है। ‘बातें’ को निहित संज्ञा के रूप में जोड़ा गया है, जिससे हिन्दी स्वाभाविक रहती है।
- source_word: רַאֲתָה עֵינִי
  choice: मेरी आँख ने … देखी हैं
  rationale: हिब्रू के एकवचन ‘मेरी आँख’ को बनाए रखा गया है, ताकि अगले खंड के एकवचन ‘मेरे कान’ के साथ काव्यात्मक समानांतरता सुरक्षित रहे।
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: ऐसी ही प्रबल बातें
  rationale: עַצֻּמוֹת शक्ति, प्रबलता या प्रभावशालिता का बोध देता है और כָּאֵלֶּה का सीधा अर्थ ‘ऐसी’ है। ‘प्रबल’ मूल की शक्ति-संबंधी छवि को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: שָׂמְעָה אָזְנִי
  choice: मेरे कान ने … सुनी हैं
  rationale: मूल के एकवचन शारीरिक अंग और पहले खंड के साथ उसके काव्यात्मक संतुलन को सुरक्षित रखा गया है।
