translation:
  language: hi
  text: एक निःसंतान मनुष्य से, जो यहोवा का भय मानता है, एक नगर बस जाएगा[a], पर विश्वासघातियों के परिवार से वह उजड़ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “एक बुद्धिमान मनुष्य से एक नगर बस जाएगा।” इब्रानी पाठ में है, “एक निःसंतान मनुष्य से, जो यहोवा का भय मानता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  choice: एक ... मनुष्य से
  rationale: מִן + אֶחָד स्रोत या उद्गम को व्यक्त करता है; हिंदी में “एक ... मनुष्य से” समानांतर वाक्य-रचना को स्वाभाविक रूप से बनाए रखता है।
- source_word: עֲרִירִי
  choice: निःसंतान
  rationale: इब्रानी शब्द सामान्यतः संतान या वंशज से रहित व्यक्ति को दर्शाता है। यह उपलब्ध उच्च-विश्वास वाले इब्रानी पाठ का ठोस अर्थ सुरक्षित रखता है।
- source_word: יְרֵא יְהֹוָה
  choice: जो यहोवा का भय मानता है
  rationale: यह पदबंध श्रद्धापूर्ण भय को व्यक्त करता है और इब्रानी पाठ में उपस्थित दिव्य नाम को स्पष्ट रखता है। आधुनिक हिंदी में संबंधवाचक उपवाक्य विशेषण-समूह से अधिक स्वाभाविक है।
- source_word: תֵּשֵׁב עִיר
  choice: एक नगर बस जाएगा
  rationale: ישב का यहाँ परिणामसूचक अर्थ नगर का आबाद या बसा होना है। “बस जाएगा” संक्षिप्त, स्वाभाविक और कर्मवाच्य भाव के निकट है।
- source_word: מִמִּשְׁפַּחַת
  choice: परिवार से
  rationale: מִשְׁפָּחָה परिवार, कुल या वंश-समूह हो सकता है; सामान्य पाठक के लिए “परिवार” सबसे सुलभ है और पहले खंड के “एक मनुष्य” के साथ विरोध बनाए रखता है।
- source_word: בֹּגְדִים
  choice: विश्वासघातियों
  rationale: यह शब्द भरोसा तोड़ने और छलपूर्ण निष्ठाहीनता का सक्रिय नैतिक भाव रखता है; “विश्वासघाती” आधुनिक हिंदी में इसी बल को स्पष्ट करता है।
- source_word: תֶּחֱרָב
  choice: वह उजड़ जाएगा
  rationale: חרב का अर्थ उजड़ना या निर्जन हो जाना है। निकटतम पूर्ववर्ती नगर को “वह” से ग्रहण करना हिंदी में स्पष्ट है और यूनानी समानांतर का विनाशकारी भाव भी सुरक्षित रहता है।
theological_decisions:
- issue: पहले खंड में इब्रानी עֲרִירִי (‘निःसंतान’) और यूनानी συνετοῦ (‘बुद्धिमान/समझदार’) के बीच पाठांतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ के अनुसार “निःसंतान”
  alternative: यूनानी के अनुसार “एक बुद्धिमान मनुष्य से एक नगर बस जाएगा”
  rationale: जहाँ सिराख का विश्वसनीय इब्रानी पाठ उपलब्ध है, वही मुख्य आधार है। अर्थपूर्ण यूनानी भिन्नता को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: יְהֹוָה में दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इब्रानी में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है। “यहोवा” उसे प्रत्यक्ष रूप से दर्शाता है और पदबंध को सामान्य धार्मिक भय तक सीमित नहीं होने देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। दोनों खंडों की “एक ... से / परिवार से” समानांतर संरचना रखी गई है। “निःसंतान” औपचारिक लेकिन सर्वबोध्य है; “उजड़ जाएगा” विनाश और निर्जनता दोनों का स्वाभाविक हिंदी बोध देता है।
