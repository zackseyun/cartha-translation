  yaml_path: translation/deuterocanon/sirach/016/024.yaml
  text: Listen to me and receive understanding[b][a], and pay attention in your heart to my words.
translation:
  language: hi
  text: मेरी सुनो और मेरी समझ ग्रहण करो[a]; मेरी बातों पर अपना मन लगाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “हे बच्चे, मेरी सुनो और ज्ञान सीखो”; इब्रानी पाठ में “बच्चे” नहीं है और वहाँ “मेरी समझ ग्रहण करो” है।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से: “मेरी बातों पर हृदय लगाओ”; यूनानी में भी हृदय से ध्यान देने की बात है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक रूप को बनाए रखते हुए यह स्वाभाविक हिन्दी में ध्यानपूर्वक सुनने का भाव व्यक्त करता है।
- source_word: וּקְחוּ שִׂכְלִי
  choice: मेरी समझ ग्रहण करो
  rationale: לקח का मूल भाव ‘लेना’ है, पर शिक्षापरक प्रसंग में ‘ग्रहण करना’ अधिक स्वाभाविक है। שִׂכְלִי में प्रथम पुरुष संबंधसूचक प्रत्यय है, इसलिए ‘मेरी समझ’ रखा गया है; यूनानी समानांतर में ‘ज्ञान सीखो’ है।
- source_word: וְעַל דְבָרַי
  choice: मेरी बातों पर
  rationale: यह आगामी ‘मन लगाओ’ के साथ मिलकर ध्यान को वक्ता की बातों की ओर लगाने का स्वाभाविक हिन्दी प्रयोग बनाता है।
- source_word: שִׂימוּ לֵב
  choice: अपना मन लगाओ
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘हृदय रखो/लगाओ’ है। हिन्दी में ‘मन लगाना’ उसी आंतरिक ध्यान और तत्परता को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: सम्बोधित व्यक्ति की पहचान
  choice: मुख्य पाठ में ‘बच्चे/पुत्र’ नहीं जोड़ा गया
  alternative: हे बच्चे, मेरी सुनो और ज्ञान सीखो
  rationale: उपलब्ध इब्रानी पाठ में पुत्रवत् सम्बोधन नहीं है और क्रियाएँ बहुवचन हैं; यूनानी पाठ में τέκνον (‘बच्चे’) और एकवचन आज्ञाएँ हैं। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
- issue: ‘हृदय’ की मानवशास्त्रीय भाषा
  choice: स्वाभाविक हिन्दी मुहावरे ‘अपना मन लगाओ’ से לב का भाव रखा गया
  alternative: मेरी बातों पर अपना हृदय लगाओ
  rationale: ‘हृदय लगाना’ इस वाक्य में अस्वाभाविक हिन्दी लगेगा, जबकि ‘मन लगाना’ विचार, ध्यान और आंतरिक अभिमुखता—तीनों को व्यक्त करता है तथा मूल मुहावरे को केवल ‘ध्यान दो’ में सपाट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण शिक्षापरक स्वर। इब्रानी के बहुवचन आज्ञार्थक रूप बनाए गए हैं। अर्धविराम दोनों समानांतर आग्रहों को स्पष्ट करता है।
