translation:
  language: hi
  text: जिनमें समझ की कमी है, वे इन बातों को समझेंगे[a], और मूर्ख मनुष्य इस पर विचार करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले खंड में इब्रानी पाठ ‘इन बातों’ कहता है, जबकि दूसरे खंड में ‘इस’ है। यूनानी समानांतर दूसरे खंड में ‘मूर्खतापूर्ण बातों’ का उल्लेख करता है। मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है; यूनानी पाठ से פּוֹתֶה का अर्थ केवल ‘भोला’ नहीं, बल्कि विवेकहीन भी समझ में आता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: जिनमें समझ की कमी है
  rationale: शाब्दिक अर्थ ‘हृदय की कमी वाले’ है, पर इब्रानी में यह समझ या विवेक की कमी का मुहावरा है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उस भाव को सुरक्षित रखता है।
- source_word: יָבִינוּ
  choice: समझेंगे
  rationale: क्रिया का सीधा अर्थ समझना या परखना है; यहाँ ‘समझेंगे’ प्रसंगानुकूल और सहज है।
- source_word: אֵלֶּה
  choice: इन बातों को
  rationale: इब्रानी बहुवचन ‘ये’ को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘इन बातों को’ कहा गया है।
- source_word: גֶבֶר
  choice: मनुष्य
  rationale: यहाँ ज्ञान-साहित्य की शैली में एक पुरुष व्यक्ति का उल्लेख है; ‘मनुष्य’ dignified और व्याकरणतः उपयुक्त हिन्दी रूप है।
- source_word: פּוֹתֶה
  choice: मूर्ख
  rationale: शब्द सरल, अनुभवहीन या आसानी से बहकने वाले व्यक्ति को बता सकता है। यूनानी समानांतर में ‘मूर्ख और भटका हुआ’ भाव होने से यहाँ केवल निष्कपट भोलेपन के बजाय दोषपूर्ण विवेक सूचित होता है।
- source_word: יַחְשֹׁב
  choice: विचार करेगा
  rationale: क्रिया का अर्थ सोचना, गणना करना या विचार करना हो सकता है। ‘विचार करेगा’ ज्ञान-साहित्य के प्रसंग में स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: זֹאת
  choice: इस पर
  rationale: इब्रानी में यह एकवचन संकेतवाचक है। ‘इस पर’ पहले खंड के बहुवचन से इसके रूपगत अंतर को बनाए रखता है।
