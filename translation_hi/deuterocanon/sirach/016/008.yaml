translation:
  language: hi
  text: और उसने लूत के प्रवास-स्थान के लोगों को नहीं छोड़ा[a], जो अपने घमंड में उद्दंड हो गए थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लूत का प्रवासी समुदाय’ अथवा ‘वे लोग जिनके बीच लूत परदेशी होकर रहता था।’ हिब्रू पद असामान्य है; यूनानी समानांतर में ‘लूत का प्रवासी समुदाय’ है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू रूप कठिन है; इसका अर्थ ‘जो अपने घमंड के कारण घृणित हो गए’ भी समझा जा सकता है। यूनानी समानांतर में है, ‘जिनसे उसने उनके घमंड के कारण घृणा की।’
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: और उसने ... को नहीं छोड़ा
  rationale: חמל का अर्थ दया करना अथवा विनाश से बचाना हो सकता है। न्याय के इस प्रसंग में ‘नहीं छोड़ा’ स्वाभाविक ढंग से ‘दंड से नहीं बचाया’ का भाव देता है; यूनानी οὐκ ἐφείσατο भी इसका समर्थन करता है।
- source_word: מְגוּרֵי לוֹט
  choice: लूत के पड़ोसी
  rationale: מגורי, גור से बना असामान्य पद है और लूत के प्रवास-स्थान अथवा वहाँ रहने वाले समुदाय की ओर संकेत करता है। अगले बहुवचन कृदंत के कारण यहाँ लोगों का बोध स्वाभाविक है। ‘पड़ोसी’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी शाब्दिक स्थान/प्रवासी-समुदाय का विकल्प सुरक्षित रखती है।
- source_word: הַמִּתְעַבְּרִים
  choice: उद्दंड हो गए थे
  rationale: यह कठिन रूप संदर्भ में घमंड से उग्र, हठी या उद्दंड होने का भाव दे सकता है। ‘उद्दंड हो गए थे’ गर्व से उपजे विद्रोही आचरण को व्यक्त करता है, पर यूनानी समानांतर में पाए जाने वाले ‘घृणित ठहराया’ के अर्थ को पादटिप्पणी में रखा गया है।
- source_word: בְּגַאֲוָתָם
  choice: अपने घमंड में
  rationale: בְּ को यहाँ अवस्था/परिस्थिति के रूप में रखते हुए हिब्रू संरचना सुरक्षित की गई है। इसे कारणवाचक ‘अपने घमंड के कारण’ भी समझा जा सकता है, जैसा यूनानी διὰ इंगित करता है।
theological_decisions:
- issue: ‘लूत के पड़ोसियों’ का संदर्भ
  choice: लूत के निवास-स्थान से जुड़े लोग
  alternative: लूत का घराना अथवा वह क्षेत्र जहाँ लूत परदेशी होकर रहा
  rationale: ऐतिहासिक संदर्भ सदोम के लोगों की ओर जाता है, पर हिब्रू सीधे ‘सदोमवासी’ नहीं कहता। इसलिए अनावश्यक विशिष्टीकरण से बचते हुए मूल की व्यापक अभिव्यक्ति रखी गई है।
- issue: הַמִּתְעַבְּרִים का नैतिक भाव
  choice: वे अपने घमंड में उद्दंड हो गए
  alternative: परमेश्वर ने उनके घमंड के कारण उनसे घृणा की / वे घृणित हो गए
  rationale: हिब्रू रूप कठिन है और उग्र या उद्दंड होने का अर्थ दे सकता है; यूनानी समानांतर घृणा किए जाने का पाठ देता है। मुख्य पाठ हिब्रू को प्राथमिकता देता है और पादटिप्पणी वास्तविक पाठगत/अर्थगत तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उद्दंड’ घमंड से उपजी उग्रता और हठ दोनों को संक्षेप में व्यक्त करता है। सर्वनाम ‘उसने’ पूर्ववर्ती संदर्भ में परमेश्वर को सूचित करता है, जैसा मूल में है।
