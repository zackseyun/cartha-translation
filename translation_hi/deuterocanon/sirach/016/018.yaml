base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: hi
  text: देखो—आकाश और सर्वोच्च आकाश[a], अथाह गहराई और पृथ्वी! जब वह उन पर उतरता है, तब वे स्थिर खड़े रहते हैं[b]; जब वह उनका निरीक्षण करता है, तब वे काँप उठेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘आकाश और आकाशों का आकाश’ है; यहाँ परमोत्कृष्टता का भाव ‘सर्वोच्च आकाश’ से व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: b
    text: संयुक्त काहाना इब्रानी पाठ में ‘जब वह उन पर उतरता है, तब वे खड़े रहते हैं’ वाला वाक्य कठिन है। यूनानी समानांतर में यह अलग वाक्य स्पष्ट नहीं है; वहाँ ‘अथाह गहराई और पृथ्वी उसके निरीक्षण के समय हिलाई जाएँगी’ मिलता है। मुख्य पाठ उपलब्ध इब्रानी शब्दों को बनाए रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह विस्मय और ध्यान आकर्षित करने वाला उद्घोष है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके बल को बनाए रखता है।
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: आकाश और सर्वोच्च आकाश
  rationale: शाब्दिक ‘आकाशों का आकाश’ इब्रानी की परमोत्कृष्टता-सूचक रचना है; ‘सर्वोच्च आकाश’ आधुनिक हिन्दी में उसका अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְהוֹם
  choice: अथाह गहराई
  rationale: यह आदिम अथाह जलराशि अथवा अगाध गहराई को सूचित करता है। ‘अथाह गहराई’ सामान्य पाठक के लिए बोधगम्य है और यूनानी ἄβυσσος से भी संगत है।
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: जब वह उन पर उतरता है, तब वे स्थिर खड़े रहते हैं
  rationale: संयुक्त इब्रानी पाठ की कठिनता के बावजूद उसके ‘उतरने’ और ‘खड़े रहने’—दोनों बिंबों को मुख्य पाठ में रखा गया है; अस्पष्ट तनाव को हटाया नहीं गया।
- source_word: בְּפָקְדוֹ
  choice: जब वह उनका निरीक्षण करता है
  rationale: פקד यहाँ ईश्वरीय निरीक्षण अथवा हस्तक्षेप का भाव रखता है। यह चयन यूनानी ἐπισκοπή से संगत है और केवल दंड अथवा कृपा में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִרְגְּשׁוּ
  choice: वे काँप उठते हैं
  rationale: क्रिया हलचल, थरथराने या हिलाए जाने का भाव देती है। ‘काँप उठते हैं’ सृष्टि-व्यापी प्रतिक्रिया को सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के उतरने का मानवरूपी चित्रण
  choice: जब वह उन पर उतरता है
  alternative: जब वह उनका निरीक्षण करता है
  rationale: कठिन होने पर भी उपलब्ध इब्रानी पाठ स्पष्टतः ‘उसके उतरने’ की भाषा रखता है। इसे केवल यूनानी के ‘निरीक्षण’ में समेटने के बजाय मुख्य पाठ में बनाए रखना स्रोत की धार्मिक और काव्यात्मक तनातनी को सुरक्षित रखता है।
- issue: ईश्वरीय פקד का स्वरूप
  choice: निरीक्षण करता है
  alternative: लेखा लेने आता है
  rationale: ‘लेखा लेने’ से दंडात्मक अर्थ आवश्यकता से अधिक निश्चित हो जाता। ‘निरीक्षण’ न्याय, देखरेख और हस्तक्षेप की संभावनाओं को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘सर्वोच्च आकाश’ और ‘अथाह गहराई’ स्वाभाविक हिन्दी हैं, जबकि कठिन इब्रानी खंड को सरल बनाकर मिटाने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
