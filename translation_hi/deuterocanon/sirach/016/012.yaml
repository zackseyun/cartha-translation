base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: hi
  text: उसकी दयाएँ जितनी बहुत हैं[a], उसकी फटकार भी उतनी ही बहुत है[b]; वह मनुष्य[c] का न्याय उसके कामों के अनुसार करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उसकी दया’ एकवचन है; इब्रानी में ‘उसकी दयाएँ’ बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी डाँट’ अथवा ‘उसका सुधार’; यूनानी में भी ‘फटकार’ का भाव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘मनुष्य’ पुल्लिंग एकवचन रूप में है, पर यहाँ उसका प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב ... כֵּן
  choice: जितनी महान ... उतनी ही बड़ी
  rationale: यह आनुपातिक ‘जितनी... उतनी ही...’ रचना इब्रानी तुलना को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: רַחֲמָיו
  choice: उसकी दयाएँ
  rationale: इब्रानी में शब्द बहुवचन है और परमेश्वर की प्रचुर करुणा अथवा दया के अनेक प्रकट रूपों को व्यक्त कर सकता है; हिन्दी में ‘दयाएँ’ उस बहुवचन को सुरक्षित रखता है।
- source_word: תּוֹכַחְתּוֹ
  choice: उसकी फटकार
  rationale: यह शब्द दोष दिखाने वाली डाँट, सुधार या ताड़ना का बोध देता है। ‘फटकार’ नैतिक-सुधारात्मक अर्थ को रखता है और इसे केवल दंड नहीं बनाता।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन संज्ञा प्रतिनिधिक अर्थ में प्रयुक्त है। ‘मनुष्य’ हिन्दी में इस रूप और उसके सामान्य मानवीय संदर्भ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּמִפְעָלָיו
  choice: उसके कामों के अनुसार
  rationale: מִפְעָל कर्म, काम या किए हुए कार्य को दर्शाता है; यूनानी समानांतर का ἔργα भी इसी अर्थ की पुष्टि करता है।
- source_word: יִשְׁפֹּט
  choice: न्याय ... करेगा
  rationale: इब्रानी अपूर्ण क्रिया और यूनानी भविष्यकाल के अनुरूप भविष्य का गंभीर न्यायिक भाव स्पष्ट रखा गया है।
theological_decisions:
- issue: परमेश्वर की दया और उसकी सुधारात्मक फटकार/न्याय का संबंध
  choice: पद दया और फटकार को समानांतर तथा आनुपातिक रूप में रखता है, फिर कामों के अनुसार न्याय की बात करता है।
  alternative: תּוֹכַחַת को अधिक दंडात्मक अर्थ में ‘दंड’ या ‘सज़ा’ कहा जा सकता है।
  rationale: 'इब्रानी תּוֹכַחַת और यूनानी ἔλεγχος मुख्यतः फटकार, दोष-दर्शन या सुधार को सूचित करते हैं, केवल प्रतिशोधात्मक दंड को नहीं। इससे पाठ का तनाव बना रहता है: महान दया नैतिक उत्तरदायित्व और न्याय को समाप्त नहीं करती।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘दयाएँ’ सामान्य बोलचाल में अपेक्षाकृत कम आता है, पर प्राथमिक इब्रानी पाठ के बहुवचन को जानबूझकर सुरक्षित रखता है। ‘फटकार’ सुधारात्मक अर्थ रखता है और पद को केवल दंड की घोषणा में नहीं बदलता।
