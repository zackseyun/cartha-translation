base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: hi
  text: उनके जीवन पर भरोसा मत रखो और न उनके भविष्य पर निर्भर रहो[a], क्योंकि उनका अंत अच्छा नहीं होगा। जो स्वीकार्य काम करता है[b], ऐसा एक व्यक्ति हज़ार से बेहतर है; और निःसंतान मरना अधर्म में पड़े बहुत-से बच्चे होने और उद्दंडता-भरा अंत होने से बेहतर है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ “उनके स्थान पर ध्यान मत लगाओ” या “उनकी स्थिति पर निर्भर मत रहो” जैसा पाठ है; इब्रानी में भावी परिणाम या भविष्य का भाव है।
    reason: textual_variant
  - marker: b
    text: या, “जो इच्छा पूरी करता है।” प्रसंग में सम्भवतः परमेश्वर को प्रसन्न करने या उसकी इच्छा पूरी करने का भाव है, पर “परमेश्वर” मूल पाठ में स्पष्ट रूप से नहीं आया है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम इब्रानी पदबंध अत्यन्त संक्षिप्त और कुछ कठिन है। इसका अर्थ यह भी लिया जा सकता है: “और उद्दंडता से भरे अंत से।” समग्र तुलना निःसंतान मृत्यु और अधर्म तथा बुरे अंत से चिह्नित बहुत-सी संतानों के बीच है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: उनके जीवन पर भरोसा मत रखो
  rationale: हिफ़ील रूप और בְּ के साथ यह बौद्धिक विश्वास से अधिक किसी पर भरोसा रखने की चेतावनी देता है। बहुवचन सम्बन्ध के बावजूद חַיִּים को स्वाभाविक हिन्दी में सामूहिक ‘जीवन’ कहा गया है।
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: और न उनके भविष्य पर निर्भर रहो
  rationale: עִקְבוֹתָם का मूल बिंब पीछे आने वाली बात या परिणाम का है। अगले वाक्य में ‘अच्छा अन्त’ न होने का उल्लेख भविष्य/भावी परिणाम वाले अर्थ का समर्थन करता है; यूनानी पाठ का भिन्न पाठ पादटिप्पणी में रखा गया है।
- source_word: כִּי לֹא תִהְיֶה לָהֶם אַחֲרִית טוֹבָה
  choice: क्योंकि उनका अन्त अच्छा नहीं होगा
  rationale: यह इब्रानी स्रोत में स्पष्ट स्वतंत्र उपवाक्य है, इसलिए परामर्शी अंग्रेज़ी पाठ में छूट जाने पर भी इसे मुख्य पाठ में पुनः रखा गया है। אַחֲרִית यहाँ अन्त, भावी परिणाम या परिणति बताता है।
- source_word: כִּי טוֹב אֶחָד ... מֵאָלֶף
  choice: ऐसा एक व्यक्ति हज़ार से बेहतर है
  rationale: इब्रानी वाक्य संक्षिप्त है, और यूनानी समानांतर पाठ तुलनात्मक अर्थ ‘एक हज़ार से बेहतर’ की पुष्टि करता है। हिन्दी में वाक्य पूरा और स्वाभाविक बनाने के लिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: עוֹשֶׂה רָצוֹן
  choice: जो मनभावना काम करता है
  rationale: רָצוֹן इच्छा, स्वीकृति या प्रसन्नता का भाव दे सकता है। ‘मनभावना काम’ नैतिक-धार्मिक अर्थ बनाए रखता है, पर इब्रानी में अनुपस्थित ‘परमेश्वर का’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: וּמוֹת עֲרִירִי
  choice: निःसंतान मरना
  rationale: עֲרִירִי संतान से रहित होने को दर्शाता है। ‘निःसंतान’ स्पष्ट, संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: בָּנִים רַבִּים בְּעַוְלָה
  choice: बहुत-से बच्चे अधर्म में हों
  rationale: עַוְלָה अन्याय, कुटिलता या अधर्म को सूचित करता है। ‘अधर्म में हों’ मूल की संज्ञात्मक नैतिक अभिव्यक्ति को बनाए रखता है और ‘बच्चे’ लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּמֵאַחֲרִית זָדוֹן
  choice: और उसका अन्त उद्दंड दुष्टता में हो
  rationale: זָדוֹן में उद्दंडता, धृष्टता और जान-बूझकर की गई दुष्टता का भाव है। इब्रानी पदबंध संकुचित और व्याकरणतः कठिन है; यह हिन्दी रूप उसके नैतिक भार और ‘अन्त’ से सम्बन्ध को पठनीय ढंग से बनाए रखता है।
theological_decisions:
- issue: ‘मनभावना काम’ किसे प्रसन्न करता है
  choice: मुख्य पाठ में कर्म का लक्ष्य अनिर्दिष्ट रखा गया है।
  alternative: ‘जो परमेश्वर की इच्छा पूरी करता है’
  rationale: ज्ञान-साहित्य के प्रसंग में परमेश्वर की प्रसन्नता सम्भावित है, किन्तु इब्रानी में परमेश्वर का नाम या सर्वनाम स्पष्ट नहीं है। लक्ष्य जोड़ने से वास्तविक अस्पष्टता मिट जाती।
- issue: निःसंतान मृत्यु और अधर्मी संतानों की तुलना
  choice: मूल की कठोर तुलना को बिना नरम किए रखा गया है।
  alternative: तुलना को सामान्य नैतिक शिक्षा के रूप में ढीला करना
  rationale: पद स्पष्ट रूप से वंश की संख्या से अधिक धार्मिकता को महत्त्व देता है। आधुनिक संवेदनशीलता के कारण इस तनाव को कम करना स्रोत के कथन को बदल देता।
- issue: भविष्य/अन्त सम्बन्धी चेतावनी
  choice: इब्रानी में उपस्थित ‘क्योंकि उनका अन्त अच्छा नहीं होगा’ वाक्य को मुख्य पाठ में रखा गया है।
  alternative: परामर्शी अंग्रेज़ी पाठ की तरह इस उपवाक्य को छोड़ देना
  rationale: मूल इब्रानी साक्ष्य प्राथमिक है और उपवाक्य अर्थपूर्ण तथा स्पष्ट है। इसे छोड़ना स्रोत-पाठ की वास्तविक सामग्री को घटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। आज्ञार्थ में बहुवचन/आदरयुक्त ‘मत रखो’ और ‘निर्भर रहो’ प्रयुक्त हैं। ‘निःसंतान’, ‘अधर्म’ और ‘उद्दंड दुष्टता’ ज्ञान-साहित्य की गंभीरता बनाए रखते हैं, जबकि अनावश्यक संस्कृतनिष्ठ जटिलता से बचते हैं।
