  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
translation:
  language: hi
  text: मैं अपनी आत्मा[a] को नपे-तुले ढंग से[b] व्यक्त करूँगा, और सावधानी से[c] अपना ज्ञान प्रकट करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मेरी आत्मा’ है; यूनानी समानांतर में ‘शिक्षा’ है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ ‘वज़न के साथ’ है—अर्थात नपे-तुले, सोच-समझकर ढंग से।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अर्थ ‘संयम से,’ ‘विवेकपूर्वक’ या ‘विनम्रता से’ भी हो सकता है; यूनानी समानांतर ‘सटीकता से’ पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  choice: कहूँगा
  rationale: यह क्रिया भीतर से वाणी निकालने, व्यक्त करने या घोषित करने का भाव रखती है। ‘कहूँगा’ यहाँ स्वाभाविक हिन्दी है और अगले पदखंड के ‘प्रकट करूँगा’ से अनावश्यक पुनरावृत्ति भी बचाती है।
- source_word: בְמִשְׁקָל
  choice: तौलकर
  rationale: शाब्दिक अर्थ ‘वज़न/माप के साथ’ है। ‘तौलकर’ सोच-समझकर और नपी-तुली वाणी बोलने की मूल रूपकात्मक छवि बनाए रखता है।
- source_word: רוּחִי
  choice: अपने मन की बात
  rationale: इब्रानी में शाब्दिक रूप से ‘मेरी आत्मा/मेरी रूह’ है। इस प्रसंग में यह वक्ता के भीतर के विचार या अभिव्यक्ति को सूचित कर सकता है; ‘अपने मन की बात’ आधुनिक हिन्दी में स्वाभाविक है, जबकि पाठांतर की अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: וּבְהַצְנֵעַ
  choice: सावधानी से
  rationale: צנע में संयम, विनम्रता, गोपनीय विवेक या सावधानी के अर्थ हो सकते हैं। यूनानी समानांतर का ‘सटीकता से’ वाला भाव भी सावधानी का समर्थन करता है।
- source_word: אֲחַוֶּה
  choice: प्रकट करूँगा
  rationale: क्रिया का अर्थ दिखाना, बताना या ज्ञात कराना है। ‘अपना ज्ञान प्रकट करूँगा’ हिन्दी में स्वाभाविक और अर्थ-संगत है।
- source_word: דֵעִי
  choice: अपना ज्ञान
  rationale: यह ‘मेरा ज्ञान/मेरी समझ’ का सीधा अनुवाद है और यूनानी ἐπιστήμην से भी मेल खाता है।
theological_decisions:
- issue: רוּחִי और यूनानी παιδείαν के बीच पाठ-साक्ष्य का अंतर
  choice: मुख्य पाठ में ‘अपने मन की बात’
  alternative: ‘अपनी आत्मा’ अथवा यूनानी के अनुसार ‘अपनी शिक्षा’
  rationale: मुख्य पाठ इब्रानी के आंतरिक/व्यक्तिगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर यूनानी के ‘शिक्षा’ पाठ को मुख्य पाठ में मिलाकर इब्रानी की वास्तविक अस्पष्टता नहीं मिटाता; दोनों साक्ष्य पाद-टिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनीय रखी गई है। ‘मन की बात’ बोलचाल में समझ आने वाला पद है, पर यहाँ उसका प्रयोग अनौपचारिक मुहावरे के रूप में नहीं, भीतर के विचार को व्यक्त करने के अर्थ में है। ‘तौलकर कहना’ मूल इब्रानी की भार/माप वाली छवि को स्वाभाविक हिन्दी में बनाए रखता है।
