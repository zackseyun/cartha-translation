base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: hi
  text: यह मत कहो, “मैं परमेश्वर से छिपा हुआ हूँ; और ऊँचाई से कौन मुझे स्मरण करेगा? एक विशाल जनसमूह में मैं जाना नहीं जाऊँगा; और सभी मनुष्यों के बीच मेरा जीवन क्या है—पवनों के छोरों के समान?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “पवनों के छोरों के समान” के स्थान पर “असीम सृष्टि में” है; संभवतः उसके पीछे कोई भिन्न मूलपाठ था, या यह कठिन इब्रानी वाक्यांश की व्याख्यात्मक प्रस्तुति है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहो
  rationale: निषेधात्मक आज्ञा का सीधा, स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: मैं परमेश्वर से छिपा हुआ हूँ
  rationale: इब्रानी में छिपे होने का भाव है; यह वक्ता के इस भ्रम को बनाए रखता है कि वह परमेश्वर की दृष्टि से ओझल है।
- source_word: וּבַמָּרוֹם מִי יִזְכְּרֵנִי
  choice: और ऊँचाई पर से कौन मुझे स्मरण करेगा?
  rationale: מָרוֹם की ऊँचे स्वर्गीय क्षेत्र की स्थानिक छवि और זכר के मूल अर्थ ‘स्मरण करना’—दोनों सुरक्षित रखे गए हैं।
- source_word: בְּעַם כָּבֵד
  choice: इतने विशाल जनसमूह में
  rationale: כָּבֵד का मूल भाव ‘भारी’ है, पर यहाँ जनसमूह की विशालता या बहुलता अभिप्रेत है; यूनानी समानांतर भी बहुत बड़ी संख्या का समर्थन करता है।
- source_word: לֹא אִוָּדֵעַ
  choice: मैं पहचाना नहीं जाऊँगा
  rationale: ידע के निफ़अल रूप का निष्क्रिय भाव दर्शाता है और भीड़ में गुमनाम रहने की कल्पना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמַה נַפְשִׁי
  choice: और मेरा जीवन क्या है
  rationale: נֶפֶשׁ यहाँ जीवन, प्राण या स्वयं व्यक्ति को सूचित कर सकता है; ‘मेरा जीवन’ वक्ता की नगण्यता के आलंकारिक प्रश्न को सहज रूप देता है।
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: मानो पवनों के छोरों के बीच हो
  rationale: दुर्बोध इब्रानी ब्रह्मांडीय छवि को सुधारे या यूनानी पाठ से बदले बिना रखा गया है; ‘मानो’ כְּ की तुलना को स्पष्ट करता है।
- source_word: כּלָ בּנֵי אָדָם
  choice: मनुष्य के सब पुत्रों के बीच
  rationale: सामूहिक इब्रानी मुहावरे ‘आदम/मनुष्य के पुत्र’ को बनाए रखते हुए वाक्य में मानव-समुदाय का अर्थ स्पष्ट किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में इब्रानी ब्रह्मांडीय बिंब और यूनानी व्याख्यात्मक पाठ का अंतर
  choice: मुख्य पाठ में ‘पवनों के छोरों’ वाला इब्रानी पाठ
  alternative: ‘असीम सृष्टि में’
  rationale: इस पद का इब्रानी पाठ उपलब्ध है और प्राथमिक स्रोत है। यूनानी पाठ संभवतः भिन्न मूलपाठ या कठिन इब्रानी की व्याख्यात्मक प्रस्तुति दर्शाता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। कठिन अंतिम इब्रानी वाक्यांश की असामान्य ब्रह्मांडीय छवि जानबूझकर सुरक्षित रखी गई है; विराम-चिह्न केवल उसके संबंध को पठनीय बनाते हैं।
