  yaml_path: translation/deuterocanon/sirach/016/019.yaml
  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: hi
  text: यहाँ तक कि पर्वतों की चोटियाँ और संसार की नींवें[a] भी—जब वह उनकी ओर देखता है, तो वे थरथर काँपती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘संसार की नींवें’; यूनानी समानांतर पाठ में ‘पृथ्वी की नींवें’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: पर्वतों की चोटियाँ
  rationale: קִצְבֵי का मूल भाव छोर या चरम सीमा है; पर्वतों के संदर्भ में ‘चोटियाँ’ इस चित्र को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וִיסוֹדֵי תֵבֵל
  choice: और संसार की नींवें
  rationale: יְסוֹדֵי का अर्थ ‘नींवें’ और תֵבֵל का अर्थ व्यवस्थित या बसा हुआ ‘संसार’ है। यह अनुवाद प्रधान इब्रानी पाठ का ब्रह्मांडीय चित्र बनाए रखता है।
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: जब वह उनकी ओर देखता है
  rationale: पूर्वसर्ग सहित infinitive construct और उसके प्रत्यय को स्वाभाविक कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है। कर्ता को ‘परमेश्वर’ कहकर स्पष्ट नहीं किया गया, क्योंकि इब्रानी में नाम नहीं है।
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: वे थरथर काँप उठती हैं
  rationale: संज्ञा רַעַשׁ और उसी धातु की क्रिया יִרְעָשׁוּ मिलकर प्रबल कंपन व्यक्त करती हैं। ‘थरथर काँप उठती हैं’ हिन्दी में उस तीव्रता को स्वाभाविक ढंग से रखता है, बिना बोझिल शब्दशः पुनरुक्ति के।
theological_decisions:
- issue: ‘जब वह उनकी ओर देखता है’ में निहित ईश्वरीय कर्ता
  choice: केवल ‘वह’ रखा गया है
  alternative: ‘जब परमेश्वर उनकी ओर देखता है’
  rationale: संदर्भ में कर्ता परमेश्वर है, पर इब्रानी वाक्यांश उसका नाम स्पष्ट रूप से नहीं देता। सर्वनाम रखने से स्रोत की शैली और उसकी निहितता सुरक्षित रहती है।
- issue: पर्वतों और संसार की नींवों का काँपना
  choice: दोनों को व्याकरणतः संयुक्त बहुवचन कर्ता मानकर ‘वे…काँप उठती हैं’ कहा गया है
  alternative: भाव को केवल ‘नींवों’ से जोड़ना
  rationale: इब्रानी और यूनानी समानांतर दोनों पर्वतों तथा नींवों को एक साथ कंपन का कर्ता प्रस्तुत करते हैं; अनुवाद उसी व्यापक ब्रह्मांडीय प्रतिक्रिया को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘यहाँ तक कि’ से אַף का बल, और ‘थरथर काँप उठती हैं’ से इब्रानी की तीव्र पुनरुक्ति स्वाभाविक रूप में व्यक्त होती है। स्त्रीलिंग बहुवचन क्रिया निकटवर्ती ‘नींवें’ के अनुरूप है, जबकि ‘वे’ संयुक्त कर्ता को समेटता है।
