- from: यदि वे बहुत हो भी जाएँ, तो उनसे प्रसन्न मत होना,[a] यदि यहोवा का भय उनके साथ न हो।
  to: भले ही वे बहुत हो जाएँ, उनके कारण आनन्दित मत होना,[a] यदि यहोवा का भय उनके साथ न हो।
  rationale: ‘भले ही’ concessive force is natural in modern Hindi. Replacing ‘उनसे प्रसन्न मत होना’ with ‘उनके कारण आनन्दित मत होना’ makes explicit that the warning concerns rejoicing in their increase, not merely being pleased with them. The footnote retains the textual caution arising from the less transparent Hebrew wording and gives a close alternative.
