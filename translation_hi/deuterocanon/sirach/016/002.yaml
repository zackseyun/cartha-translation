base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/002.yaml
  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: hi
  text: भले ही वे बहुत हो जाएँ, उनके कारण आनन्दित मत होना,[a] यदि यहोवा का भय उनके साथ न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर प्रसन्न मत होना।” यहाँ इब्रानी शब्दावली कुछ अस्पष्ट है, पर यूनानी समानांतर पाठ प्रसन्न या आनन्दित होने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִם
  choice: यदि ... भी
  rationale: यह रचना रियायती शर्त व्यक्त करती है; हिन्दी में ‘यदि ... भी’ मूल के ‘भले ही’ वाले भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: פָּרוּ
  choice: वे बहुत हो जाएँ
  rationale: क्रिया का मूल भाव फलना-बढ़ना या संख्या में बढ़ना है। यूनानी समानांतर πληθύνωσιν भी संख्या बढ़ने की पुष्टि करता है; ‘बहुत हो जाएँ’ अनावश्यक जैविक व्याख्या किए बिना यह अर्थ रखता है।
- source_word: אַל תָּבֻעַ בָּם
  choice: उनसे प्रसन्न मत होना
  rationale: इब्रानी रूप कुछ अस्पष्ट है, पर यूनानी μὴ εὐφραίνου ἐπʼ αὐτοῖς प्रसन्न या आनन्दित न होने का अर्थ पुष्ट करता है। ‘उनसे प्रसन्न मत होना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִם אֵין אִתָּם
  choice: यदि ... उनके साथ न हो
  rationale: मूल में केवल अधिकार नहीं, साथ या उपस्थिति का भाव है; इसलिए ‘उनके साथ न हो’ संरक्षित किया गया है।
- source_word: יִרְאַת יְהֹוָה
  choice: यहोवा का भय
  rationale: यह बाइबलीय ज्ञान-साहित्य का केंद्रीय पदबंध है। ‘भय’ उसकी धार्मिक और नैतिक गहराई बनाए रखता है, जबकि केवल ‘श्रद्धा’ कहना अर्थ को संकरा कर सकता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से दर्शाया गया है।
theological_decisions:
- issue: יִרְאַת יְהֹוָה का अनुवाद
  choice: यहोवा का भय
  alternative: यहोवा के प्रति श्रद्धा
  rationale: ‘भय’ ज्ञान-साहित्य के स्थापित धर्मवैचारिक पदबंध और उसकी जानबूझकर रखी गई व्यापकता को सुरक्षित रखता है; इसे केवल श्रद्धा में बदलना अर्थ को पहले से व्याख्यायित कर देगा।
- issue: बहुत-सी सन्तान और धार्मिकता का संबंध
  choice: संख्या बढ़ने पर प्रसन्न न होने की सशर्त चेतावनी
  alternative: बहुत-सी सन्तान को अपने-आप बुरा बताना
  rationale: वचन संख्या या फलवृद्धि की निरपेक्ष निन्दा नहीं करता; चेतावनी तभी लागू होती है जब यहोवा का भय उनके साथ न हो।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बहुत हो भी जाएँ’ रियायती भाव को तथा ‘उनके साथ न हो’ मूल के साथ-उपस्थिति संबंध को बनाए रखता है।
