    rationale: It may suggest disapproval of the people rather than a prohibition against rejoicing in their numerical increase. A wording with ‘उनके कारण आनन्दित’ better reflects the Greek parallel ἐπʼ αὐτοῖς while retaining the Hebrew uncertainty in the note.
