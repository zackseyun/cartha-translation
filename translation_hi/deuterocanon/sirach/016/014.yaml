  text: For every act of righteousness there is a reward; each person will find it according to his works[a][b].
translation:
  language: hi
  text: जो कोई धार्मिकता करता है, उसके लिए प्रतिफल है; हर व्यक्ति अपने कर्मों के अनुसार उसे पाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ छोटा है: “जो कोई धार्मिकता करता है, उसके लिए प्रतिफल है।” यूनानी समानांतर अधिक विस्तृत है और आगे कहता है: “हर व्यक्ति अपने कर्मों के अनुसार उसे पाएगा।”'
    reason: textual_variant
  - marker: b
    text: यूनानी ἐλεημοσύνη का अर्थ “दान” या अधिक व्यापक रूप से “दया का काम” हो सकता है; इब्रानी साक्ष्य में צְדָקָה, अर्थात “धार्मिकता” या “न्यायपूर्ण आचरण,” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: जो कोई ... करता है
  rationale: इब्रानी में यह शब्दशः ‘हर वह व्यक्ति जो करता है’ है। ‘जो कोई’ इसके व्यक्ति-सूचक और वितरणात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता का काम
  rationale: इब्रानी צְדָקָה का मूल अर्थ धार्मिकता या न्यायपूर्ण आचरण है। ‘धार्मिकता का काम’ उसे किसी अमूर्त गुण के बजाय किए गए आचरण के रूप में व्यक्त करता है, जबकि यूनानी पाठ के दान/दयाकर्म वाले अर्थ को पादटिप्पणी में रखा गया है।
- source_word: יֵשׁ לוֹ שָׂכָר
  choice: उसके लिए प्रतिफल है
  rationale: यह इब्रानी अस्तित्ववाची मुहावरे ‘उसके पास/लिए प्रतिफल है’ को निकटता से रखता है। ‘प्रतिफल’ שָׂכָר के पुरस्कार, मजदूरी या बदले के व्यापक अर्थ को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  choice: हर व्यक्ति अपने कर्मों के अनुसार पाएगा
  rationale: यह यूनानी समानांतर के भविष्यकाल और कर्मानुसार पाने के कथन को रखता है। यूनानी में पाने की वस्तु स्पष्ट नहीं है, इसलिए हिन्दी में भी अनावश्यक रूप से ‘प्रतिफल’ को कर्म के रूप में नहीं जोड़ा गया।
theological_decisions:
- issue: צְדָקָה को धार्मिकता/न्याय अथवा यूनानी ἐλεημοσύνη के अनुसार दान/दयाकर्म कहना
  choice: मुख्य पाठ में ‘धार्मिकता का काम’
  alternative: दान अथवा दया का काम
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है; यूनानी पाठ का महत्वपूर्ण परोपकारी अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: इब्रानी में अनुपस्थित, पर यूनानी में उपस्थित अंतिम उपवाक्य को शामिल करना
  choice: ‘हर व्यक्ति अपने कर्मों के अनुसार पाएगा’ को मुख्य पाठ में शामिल किया गया
  alternative: 'केवल छोटा इब्रानी वाक्य: ‘जो कोई धार्मिकता का काम करता है, उसके लिए प्रतिफल है।’'
  rationale: दिए गए स्रोत में पाठांतर को ‘minor_mismatch’ कहा गया है और यूनानी समानांतर संभवतः पद का अधिक पूर्ण रूप सुरक्षित रखता है। अंतर को पादटिप्पणी में स्पष्ट किया गया है, ताकि पाठ-साक्ष्य की अनिश्चितता छिपे नहीं।
- issue: कर्मों के अनुसार क्या पाया जाएगा
  choice: पाने की वस्तु को अनकहा रखा गया
  alternative: ‘वह प्रतिफल पाएगा’
  rationale: यूनानी उपवाक्य में सीधा कर्म व्यक्त नहीं है। उसे स्पष्ट कर देना वास्तविक व्याकरणिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। ‘प्रतिफल’ औपचारिक किंतु सामान्यतः बोधगम्य है; ‘कर्मों के अनुसार’ स्रोत की नैतिक गंभीरता और खुलापन बनाए रखता है।
