  yaml_path: translation/deuterocanon/sirach/016/013.yaml
  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: hi
  text: अन्यायी लूट के सहारे बच नहीं निकलेगा, और धर्मी की अभिलाषा[a] को कभी समाप्त नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “और भक्त का धीरज निश्चय ही विलंबित नहीं होगा।” इब्रानी पाठ में: “धर्मी की अभिलाषा को कभी समाप्त नहीं किया जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: बच नहीं निकलेगा
  rationale: מלט के निफ़अल रूप का सामान्य अर्थ ‘बच निकलना’ या ‘छुटकारा पाना’ है। यहाँ न्याय से बच निकलने का भाव स्वाभाविक है।
- source_word: בְּגָזֵל
  choice: लूट के सहारे
  rationale: גזל लूट या अन्याय से छीनी हुई वस्तु को दर्शाता है; בְּ साधन अथवा साथ लगी परिस्थिति बता सकता है। ‘के सहारे’ यह भाव व्यक्त करता है कि लूटा हुआ माल अन्यायी को बचा नहीं सकेगा।
- source_word: עַוָּל
  choice: अन्यायी
  rationale: इब्रानी शब्द अन्याय या कुटिलता करने वाले व्यक्ति को सूचित करता है। ‘अन्यायी’ मूल इब्रानी के नैतिक अर्थ को ‘पापी’ की अपेक्षा अधिक सीधे रूप में रखता है।
- source_word: וְלֹא יַשְׁבִּית
  choice: कभी समाप्त नहीं की जाएगी
  rationale: שבת के हिफ़ईल रूप में ‘समाप्त कर देना’ या ‘रोक देना’ का कारक भाव है। कर्मवाच्य रचना इब्रानी में निहित कर्ता को अनावश्यक रूप से निश्चित किए बिना आशय को स्वाभाविक हिन्दी में रखती है।
- source_word: תַּאֲוַת צַדִּיק
  choice: धर्मी की अभिलाषा
  rationale: תאוה इच्छा या अभिलाषा है और צדיק एक प्रतिनिधिक एकवचन है। ‘धर्मी की अभिलाषा’ मूल की एकवचन संरचना और सकारात्मक नैतिक संदर्भ दोनों बनाए रखती है।
- source_word: לְעוֹלָם
  choice: कभी
  rationale: नकार के साथ לְעוֹלָם का अर्थ ‘कभी नहीं’ है; आधुनिक हिन्दी में यही सबसे स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: עַוָּל का नैतिक पदनाम और यूनानी ἁμαρτωλός
  choice: अन्यायी
  alternative: पापी
  rationale: मुख्य पाठ में इब्रानी की अन्यायपूर्ण आचरण वाली छाया को प्राथमिकता दी गई है; यूनानी का ‘पापी’ निकट अर्थ रखता है, पर अधिक व्यापक नैतिक पदनाम है।
- issue: दूसरे खंड का अर्थ और पाठांतर
  choice: धर्मी की अभिलाषा कभी समाप्त नहीं की जाएगी
  alternative: भक्त का धीरज निश्चय ही देर में फलित नहीं होगा
  rationale: मुख्य पाठ इब्रानी תאות צדיק और ישבית का अनुसरण करता है। यूनानी पाठ में ‘भक्त का धीरज/सहनशीलता’ और ‘विलंब’ का भिन्न अर्थ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे खंड में क्रिया का कर्ता
  choice: कर्मवाच्य द्वारा कर्ता को अनिर्दिष्ट रखना
  alternative: वह धर्मी की अभिलाषा को कभी समाप्त नहीं करेगा
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस पृथक वचन में उसका अभिप्रेत कर्ता स्पष्ट नहीं है। हिन्दी में ‘वह’ रखने पर निकटतम संज्ञा ‘अन्यायी’ को कर्ता समझे जाने का जोखिम है; कर्मवाच्य मूल कथन को बिना अनावश्यक समाधान के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘लूट के सहारे’ साधनात्मक בְּ को स्पष्ट करता है, जबकि दूसरे खंड की कर्मवाच्य रचना मूल में कर्ता की अस्पष्टता को सुरक्षित रखती है।
