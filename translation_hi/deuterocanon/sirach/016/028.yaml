  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: hi
  text: हर एक ने अपने पड़ोसी को नहीं सताया, और वे उसके वचन की अवज्ञा[a] कभी नहीं करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसके वचन के प्रति अवज्ञाकारी नहीं होंगे।” यूनानी भविष्यकालीन क्रिया को सक्रिय रूप में “अवज्ञा करेंगे” अथवा अधिक स्थितिवाचक रूप में “अवज्ञाकारी होंगे” अनुवाद किया जा सकता है।
    reason: लेक्सिकल_वैकल्पिक
lexical_decisions:
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह यूनानी के वितरणात्मक एकवचन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὸν πλησίον αὐτοῦ
  choice: अपने पड़ोसी को
  rationale: नैतिक और पारस्परिक संदर्भ में πλησίον के लिए ‘पड़ोसी’ सहज और स्थापित अर्थ है; ‘अपने’ कर्ता से संबंध स्पष्ट करता है।
- source_word: οὐκ ἔθλιψεν
  choice: नहीं दबाया
  rationale: θλίβω का मूल भाव दबाने और कष्ट पहुँचाने का है। ‘दबाया’ सृष्ट वस्तुओं के परस्पर व्यवधान न डालने के संदर्भ में ‘अत्याचार किया’ की अपेक्षा अधिक व्यापक और उपयुक्त है।
- source_word: ἕως αἰῶνος
  choice: कभी नहीं
  rationale: नकारात्मक भविष्य कथन के साथ यह अनंत अवधि को आधुनिक हिन्दी की स्वाभाविक अभिव्यक्ति में व्यक्त करता है।
- source_word: οὐκ ἀπειθήσουσι
  choice: अवज्ञा कभी नहीं करेंगे
  rationale: ἀπειθέω आज्ञा न मानने या अवज्ञा करने को व्यक्त करता है; हिन्दी में ‘अवज्ञा करना’ भविष्यकालीन सक्रिय अर्थ को स्पष्ट रखता है।
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: उसके वचन की
  rationale: ῥῆμα का व्यापक अर्थ ‘वचन’ से सुरक्षित रहता है; ‘आज्ञा’ कहने पर अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
theological_decisions:
- issue: ‘उसके वचन’ में ‘उसके’ का संदर्भ
  choice: सर्वनाम को बनाए रखा गया; संदर्भ में इसका स्वाभाविक संकेत परमेश्वर की ओर है।
  alternative: सीधे ‘परमेश्वर के वचन’ कहना, अथवा किसी अनिर्दिष्ट एकवचन शासक संदर्भ को मानना।
  rationale: आसपास के सृष्टि-वर्णन में परमेश्वर सबसे स्वाभाविक अभिप्रेत है, पर यूनानी पाठ केवल αὐτοῦ कहता है। इसलिए नाम जोड़कर निहितार्थ को स्पष्ट रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। वाक्य की वितरणात्मक शुरुआत और फिर बहुवचन क्रिया यूनानी के ‘हर एक ... वे’ विन्यास को सुरक्षित रखती है।
