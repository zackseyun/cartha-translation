base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/022.yaml
  text: Who will declare a work of righteousness[c][b][a], and who will wait for it? For the covenant is far off.
translation:
  language: hi
  text: धार्मिकता के कार्य की घोषणा कौन करेगा[a][b], और कौन उसकी प्रतीक्षा करेगा? क्योंकि वाचा[c] दूर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ हिब्रू पाठ कठिन है; उसका मोटा अर्थ है, “धार्मिकता का कार्य क्या है—कौन उसे बताएगा? और किस बात की आशा...?” यूनानी पाठ अधिक स्पष्ट है: “धार्मिकता के कार्यों की घोषणा कौन करेगा, और कौन प्रतीक्षा करेगा या धीरज धरेगा? क्योंकि वाचा दूर है।”'
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद “धार्मिकता के कार्य,” “धार्मिकता का एक कार्य” या “न्याय का कार्य” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “वाचा”; उपलब्ध हिब्रू में संभवतः “विधि,” “नियम” या “आदेश” है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: धार्मिकता का काम
  rationale: हिब्रू में एकवचन ‘धार्मिकता का काम’ है, यद्यपि वाक्य कठिन है; यूनानी में बहुवचन ‘धार्मिकता के काम’ है। मुख्य पाठ में हिब्रू के एकवचन को स्वाभाविक हिन्दी में रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: घोषणा कौन करेगा
  rationale: हिब्रू और यूनानी दोनों क्रियाएँ बताने, घोषित करने या वर्णन करने का अर्थ दे सकती हैं। ‘घोषणा करेगा’ अलंकारिक प्रश्न की गरिमा और सार्वजनिक रूप से बताने का भाव बनाए रखता है।
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  choice: और कौन उसकी प्रतीक्षा करेगा
  rationale: हिब्रू खंड अत्यंत कठिन है, पर תִקְוָה आशा या अपेक्षा की ओर संकेत करता है; यूनानी में ‘कौन प्रतीक्षा करेगा/धीरज धरेगा’ का स्पष्ट पाठ है। ‘उसकी प्रतीक्षा करेगा’ दोनों के संभावित साझा भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: חוֹק / ἡ διαθήκη
  choice: वाचा
  rationale: हिब्रू में ‘विधि/आदेश’ दिखाई देता है, जबकि यूनानी में स्पष्ट रूप से ‘वाचा’ है। कठिन हिब्रू वाक्य के कारण मुख्य पाठ में सुसंगत यूनानी अर्थ लिया गया है और हिब्रू पाठ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: μακρὰν
  choice: दूर है
  rationale: यूनानी μακράν का सीधा अर्थ ‘दूर’ है। यह प्रतीक्षा करने के प्रश्न का कारण भी स्पष्ट करता है; यह भाव उपलब्ध हिब्रू में स्पष्ट नहीं है।
theological_decisions:
- issue: कठिन हिब्रू पाठ और अधिक स्पष्ट यूनानी समानांतर पाठ में किसे मुख्य पाठ में स्थान दिया जाए
  choice: जहाँ हिब्रू पाठ अस्थिर और अर्थ की दृष्टि से अस्पष्ट है, वहाँ यूनानी की सुसंगत पंक्ति को मुख्य पाठ में अपनाया गया है; हिब्रू के महत्वपूर्ण पाठांतर पादटिप्पणियों में दिए गए हैं।
  alternative: 'अधिक हिब्रू-केंद्रित अनुवाद: ‘धार्मिकता का काम क्या है—कौन उसे बताएगा? और किस बात की आशा, क्योंकि विधि ठहराई गई है?’'
  rationale: सिराख के उपलब्ध हिब्रू को सामान्यतः प्राथमिकता मिलनी चाहिए, किंतु इस पद का दूसरा भाग विशेष रूप से कठिन या विकृत प्रतीत होता है। यूनानी एक पूर्ण और अर्थपूर्ण कथन सुरक्षित रखता है। पादटिप्पणियाँ पाठगत तनाव को छिपाने के बजाय स्पष्ट करती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘धार्मिकता’ बाइबलीय नैतिक अर्थ को बनाए रखता है, ‘वाचा’ प्रचलित धर्मग्रंथीय शब्द है, और पाठगत अनिश्चितता को पादटिप्पणियों में स्पष्ट रूप से दर्ज किया गया है।
