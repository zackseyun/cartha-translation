base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/001.yaml
  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: hi
  text: यदि तुम्हें अगुआ ठहराया गया है, तो अपने आपको ऊँचा न उठाओ; उनके बीच उन्हीं में से एक बनकर रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस संदर्भ के लिए दिया गया इब्रानी साक्ष्य पढ़ता है: “हे सबके परमेश्वर, हमारा उद्धार कर, और सब जातियों पर अपना भय डाल।” यह कथन सिराख 35:1 से जुड़े यूनानी पद से मेल नहीं खाता; इसलिए मुख्य अनुवाद यहाँ यूनानी का अनुसरण करता है और इस असंगति को स्पष्ट रूप से दर्ज करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: अगुआ
  rationale: यह कृदंत ऐसे व्यक्ति को दर्शाता है जो नेतृत्व करता या दायित्व सँभालता है। ‘अगुआ’ स्वाभाविक हिंदी है और किसी औपचारिक राजनीतिक पद का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: κατέστησαν
  choice: ठहराया गया है
  rationale: क्रिया किसी भूमिका में नियुक्त या स्थापित किए जाने का भाव देती है। हिंदी का कर्मवाच्य यूनानी के अनिश्चित बहुवचन कर्ता को बिना कृत्रिम ‘उन्होंने’ जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ ἐπαίρου
  choice: अपने आपको ऊँचा न उठाओ
  rationale: यह आत्म-उन्नयन के रूपक और नैतिक चेतावनी, दोनों को बनाए रखता है; केवल ‘घमंड न करो’ कहना रूपक को सपाट कर देता।
- source_word: γίνου
  choice: बनकर रहो
  rationale: इस आज्ञार्थक प्रसंग में यह निरंतर विनम्र आचरण का स्वाभाविक हिंदी संकेत देता है।
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: उन्हीं में से एक बनकर
  rationale: यह समूह के साथ समानता और एकजुटता पर बल देता है तथा यूनानी तुलना को स्पष्ट, सहज हिंदी में रखता है।
theological_decisions:
- issue: इस पद के लिए इब्रानी और यूनानी पाठों में पूर्ण असंगति
  choice: मुख्य अनुवाद में संदर्भ से मेल खाने वाले यूनानी समानांतर पाठ को आधार बनाया गया और दिए गए इब्रानी पाठ को पाद-टिप्पणी में स्पष्ट रूप से दर्ज किया गया।
  alternative: 'दिए गए इब्रानी का अनुवाद: ‘हे सबके परमेश्वर, हमारा उद्धार कर, और सब जातियों पर अपना भय डाल।’'
  rationale: दिया गया इब्रानी पाठ और Sirach 35:1 से जुड़ा यूनानी पाठ एक ही वाक्य के पाठांतर नहीं, बल्कि पूरी तरह भिन्न कथन हैं। पद-संदर्भ से सुसंगत पाठ यूनानी में उपलब्ध है; इसलिए उसे मुख्य पाठ में रखा गया है, पर स्रोत-असंगति को छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। ‘अगुआ’ सामान्य नेतृत्व को व्यक्त करता है; ‘अपने आपको ऊँचा न उठाओ’ मूल रूपक बचाता है; और ‘उन्हीं में से एक बनकर रहो’ विनम्र सहभागिता का भाव सहज रूप से देता है।
