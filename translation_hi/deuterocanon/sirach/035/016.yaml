base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/016.yaml
  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: hi
  text: और पृथ्वी के दूर-दराज़ के सभी लोग जान लेंगे कि आप सनातन परमेश्वर हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-परंपरा में है: “जो प्रभु का भय मानते हैं, वे न्याय पाएँगे और धार्मिक कामों को ज्योति के समान प्रज्वलित करेंगे।” यहाँ इब्रानी साक्ष्य में इससे बहुत भिन्न पंक्ति सुरक्षित है।'
    reason: textual_variant
  - marker: b
    text: या, “अनंतकाल के परमेश्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: जान लेंगे
  rationale: काव्यात्मक और प्रार्थनापरक संदर्भ में यह रूप भावी परिणाम को व्यक्त करता है; इसलिए ‘जान लेंगे’ स्वाभाविक और स्रोत-संगत है।
- source_word: כל אפסי ארץ
  choice: पृथ्वी के दूर-दूर तक के सभी लोग
  rationale: इब्रानी मुहावरा पृथ्वी के सबसे दूरस्थ क्षेत्रों और वहाँ के लोगों की ओर संकेत करता है। शाब्दिक ‘पृथ्वी के सभी छोर’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और सार्वभौमिक विस्तार स्पष्ट करता है।
- source_word: כי אתה
  choice: कि आप ... हैं
  rationale: स्पष्ट सर्वनाम אתה पर बल बना रहता है; ‘केवल’ जोड़ने का कोई शाब्दिक आधार नहीं है। परमेश्वर को संबोधित करने के लिए आदरसूचक ‘आप’ चुना गया है।
- source_word: אלהי עולם
  choice: सनातन परमेश्वर
  rationale: עולם यहाँ अनंतता अथवा चिरस्थायित्व व्यक्त करता है। ‘सनातन परमेश्वर’ आधुनिक, गरिमापूर्ण हिन्दी में इसका स्वाभाविक रूप है; पदटिप्पणी में अधिक संरचनात्मक विकल्प रखा गया है।
theological_decisions:
- issue: इब्रानी पाठ और भिन्न यूनानी परंपरा का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: ‘जो प्रभु का भय मानते हैं, वे न्याय पाएँगे और धार्मिक कामों को ज्योति के समान प्रज्वलित करेंगे।’
  rationale: इस पद का उपलब्ध इब्रानी पाठ स्पष्ट है और यूनानी में मूलतः अलग पंक्ति मिलती है। दोनों को मिलाकर भेद मिटाने के बजाय इब्रानी को मुख्य पाठ में और यूनानी पाठांतर को पदटिप्पणी में रखा गया है।
- issue: אלהי עולם का अर्थ
  choice: सनातन परमेश्वर
  alternative: अनंतकाल के परमेश्वर
  rationale: दोनों रूप इब्रानी संबंध-रचना की अर्थ-सीमा में हैं। मुख्य पाठ में सहज विशेषणात्मक हिन्दी चुनी गई है, जबकि अधिक शाब्दिक संरचना पदटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ईश्वर-संबोधन में आदरसूचक ‘आप’ और אלהים के लिए परिचित ‘परमेश्वर’ प्रयोग हुआ है। ‘पृथ्वी के दूर-दूर तक के सभी लोग’ इब्रानी भौगोलिक मुहावरे का स्वाभाविक हिन्दी अर्थ खोलता है।
