  yaml_path: translation/deuterocanon/sirach/035/019.yaml
  text: Any male will accept a woman[a], but a man will choose a young woman.
translation:
  language: hi
  text: हर नर किसी स्त्री को स्वीकार कर लेता है[a], पर एक पुरुष युवती को चुनता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “बिना सलाह के कुछ मत करो, और कुछ कर लेने के बाद पछताओ मत।” यहाँ यूनानी परंपरा उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ प्रस्तुत करती है।'
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: हर नर
  rationale: זכר जैविक रूप से ‘नर’ को व्यक्त करता है और दूसरे खंड के איש से भिन्न है। ‘हर नर’ इस तीखे शब्दगत अंतर और नीतिवचन-सदृश सामान्यीकरण को बनाए रखता है।
- source_word: תְּקַבֵּל
  choice: स्वीकार कर लेता है
  rationale: קבל का सामान्य अर्थ ‘स्वीकार करना/ग्रहण करना’ है। ‘स्वीकार कर लेता है’ संबंधपरक संदर्भ में स्वाभाविक है और विवाह या यौन संबंध का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: אִשָּׁה
  choice: किसी स्त्री को
  rationale: אשה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ कथन सामान्य है और इसका विरोध עלמה से है, इसलिए ‘स्त्री’ कम व्याख्यात्मक और अधिक सुरक्षित विकल्प है।
- source_word: אַךְ
  choice: पर
  rationale: यह संयोजक दोनों खंडों के बीच विरोध दिखाता है; आधुनिक हिन्दी में ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: दूसरे खंड में זכר के बजाय איש आया है। ‘पुरुष’ इस शब्दगत बदलाव को हिन्दी में यथासंभव सुरक्षित रखता है।
- source_word: יִבְחַר
  choice: चुनता है
  rationale: בחר का सीधा अर्थ ‘चुनना’ है। हिन्दी का सामान्य वर्तमान काल नीतिवचन के सार्वकालिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַלְמָה
  choice: युवती
  rationale: עלמה विवाह-योग्य आयु की युवा स्त्री को सूचित करता है। ‘युवती’ आधुनिक और संक्षिप्त है; ‘कुँवारी’ शब्द की अपेक्षा यह कौमार्य का ऐसा विशिष्ट अर्थ नहीं जोड़ता जो शब्द से अनिवार्यतः सिद्ध नहीं है।
theological_decisions:
- issue: वर्तमान इब्रानी पाठ और अत्यंत भिन्न यूनानी पाठ में चयन
  choice: मुख्य पाठ में उपलब्ध इब्रानी नीतिवचन का अनुवाद
  alternative: 'यूनानी परंपरा: “बिना सलाह के कुछ न करना, और जब तुम कर चुकना, तो पछताना मत।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। यहाँ यूनानी पाठ केवल शैलीगत रूपांतर नहीं, बल्कि एक पूर्णतः अलग कथन देता है; इसलिए उसे पाठांतर की पादटिप्पणी में पारदर्शी ढंग से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन-सदृश रखी गई है। ‘नर’ जानबूझकर कुछ तीखा है, क्योंकि मूल इब्रानी पहले खंड में जैविक זכר और दूसरे में איש का भेद करता है। ‘किसी स्त्री’ हिन्दी में כָּל के सामान्यीकरण को अधिक स्वाभाविक बनाता है।
