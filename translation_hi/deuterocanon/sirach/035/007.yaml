base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/007.yaml
  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: hi
  text: अंत को शीघ्र ला और नियत समय का ध्यान रख,[a] क्योंकि तुझे कौन बताएगा कि तू क्या करेगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर परम्परा में यहाँ बहुत भिन्न पाठ है: “हे युवक, यदि तेरी आवश्यकता हो तो बोल; और यदि तुझसे पूछा जाए, तो मुश्किल से दो बार ही बोल।” यह उपलब्ध इब्रानी का निकट अनुवाद न होकर किसी भिन्न पाठ-रूप को दर्शाता जान पड़ता है।'
    reason: textual_variant
  - marker: b
    text: इब्रानी का शाब्दिक अर्थ “तू क्या करेगा” है; प्रसंग में इसे “तुझे क्या करना चाहिए” या “क्या करना है” के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש
  choice: शीघ्र कर
  rationale: यह חושׁ का आज्ञार्थक रूप है और तत्कालता प्रकट करता है। संक्षिप्त ‘शीघ्र कर’ मूल इब्रानी की तीखी और कुछ हद तक अपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: קץ
  choice: अन्त
  rationale: קץ का सामान्य अर्थ ‘अन्त’ या ‘समाप्ति’ है। यहाँ किसी विशेष प्रकार के परिणाम को मान लेने के बजाय मूल की व्यापकता सुरक्षित रखी गई है।
- source_word: ופקוד
  choice: और … का ध्यान रख
  rationale: פקד के अर्थों में ध्यान देना, सुधि लेना, निरीक्षण करना और नियुक्त करना सम्मिलित हैं। מועד के साथ ‘ध्यान रख’ सक्रिय सावधानी का भाव देता है, पर किसी एक तकनीकी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מועד
  choice: नियत समय
  rationale: מועד किसी ठहराए या निर्धारित समय को दर्शाता है। ‘नियत समय’ आधुनिक हिन्दी में स्वाभाविक है और समय के पहले से निर्धारित होने का भाव बनाए रखता है।
- source_word: כי
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेशों का कारण प्रस्तुत करता है।
- source_word: מי יאמר לך
  choice: कौन तुझे बताएगा
  rationale: यह सीधे भविष्यकालीन प्रश्न और उसके आलंकारिक बल को सुरक्षित रखता है।
- source_word: מה תעשה
  choice: कि तू क्या करेगा
  rationale: यह इब्रानी का निकट और स्वाभाविक रूप है। प्रसंग में इसका अर्थ ‘तुझे क्या करना चाहिए’ भी समझा जा सकता है, जिसे टिप्पणी में रखा गया है ताकि मुख्य पाठ मूल की अस्पष्टता न मिटाए।
theological_decisions:
- issue: इब्रानी पाठ और अत्यन्त भिन्न यूनानी समानान्तर पाठ में चुनाव
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ का आधार बनाया गया है और यूनानी भिन्नता को पादटिप्पणी में बताया गया है।
  alternative: यूनानी परम्परा के अनुसार युवक को केवल आवश्यकता और पूछे जाने पर बोलने की शिक्षा वाला कथन।
  rationale: यहाँ उपलब्ध इब्रानी साक्ष्य स्पष्ट और उच्च-विश्वसनीयता वाला है, जबकि यूनानी कथन उसका निकट अनुवाद नहीं है और किसी अलग पाठ-रूप या पद-संयोजन का प्रतिनिधित्व करता प्रतीत होता है। इसलिए इब्रानी को प्राथमिकता देते हुए वास्तविक पाठभेद को खुलकर दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘अन्त शीघ्र कर’ जानबूझकर कुछ असामान्य और अर्थ की दृष्टि से खुला है, क्योंकि इब्रानी वाक्यांश भी संक्षिप्त तथा कुछ हद तक अस्पष्ट है। सर्वनाम ‘तू/तुझे’ मूल के एकवचन प्रत्यक्ष सम्बोधन को बनाए रखते हैं।
