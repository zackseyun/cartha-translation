base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/023.yaml
  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: hi
  text: स्त्री का सौंदर्य मुख को खिला देता है,[a] और वह आँखों को भाने वाली हर वस्तु से बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इससे बहुत अलग वाचन है: “हर काम में अपने मन पर भरोसा रख, क्योंकि यह भी आज्ञाओं का पालन है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: सौंदर्य
  rationale: यह संज्ञा बाहरी रूप या सुंदरता को दर्शाती है। स्त्री और मुख पर पड़ने वाले उसके प्रभाव के संदर्भ में ‘सौंदर्य’ स्वाभाविक और अर्थानुकूल है।
- source_word: יחליץ פנים
  choice: मुख को खिला देता है
  rationale: यह कठिन मुहावरा मुख पर दिखाई देने वाले सकारात्मक, सजीव प्रभाव की ओर संकेत करता है। ‘मुख को खिला देता है’ आधुनिक हिन्दी में इस भाव को सहज रूप से व्यक्त करता है, जबकि मूल की कुछ अस्पष्टता बनी रहती है।
- source_word: מחמד עין
  choice: आँखों को भाने वाली हर वस्तु
  rationale: इस पदबंध का शाब्दिक भाव आँख के लिए वांछनीय या प्रिय वस्तु है। चुना हुआ अनुवाद दृश्य आकर्षण और अभिलाषणीयता—दोनों को व्यक्त करता है।
- source_word: יגבר
  choice: से बढ़कर है
  rationale: क्रिया का मूल अर्थ प्रबल होना या विजय पाना है; इस तुलनात्मक काव्य-संदर्भ में ‘से बढ़कर है’ स्वाभाविक हिन्दी में श्रेष्ठता व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद किया गया और यूनानी पाठ को पाद-टिप्पणी में रखा गया।
  alternative: 'यूनानी पाठ: ‘हर काम में अपने मन पर भरोसा रख, क्योंकि यह भी आज्ञाओं का पालन है।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ निकट शाब्दिक समानांतर न होकर पूरी तरह अलग पाठ-परंपरा प्रस्तुत करता है; इसलिए उसे मुख्य पाठ में मिलाए बिना वैकल्पिक पाठ के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक अभिव्यक्ति। ‘मुख को खिला देता है’ कठिन इब्रानी मुहावरे का सहज अनुवाद है; पाद-टिप्पणी बड़े पाठांतर को स्पष्ट करती है।
