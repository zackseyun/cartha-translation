base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: hi
  text: अपने जीवनकाल में बेटे या पत्नी को, भाई या मित्र को अपने ऊपर अधिकार मत दो; और अपनी संपत्ति किसी और को मत दो, कहीं ऐसा न हो कि बाद में पछताकर तुम्हें उसे वापस माँगना पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पछताने के बाद तुम्हें उनकी ज़रूरत पड़ जाए” या “उनके लिए विनती करनी पड़े।” यूनानी का अंतिम खंड संक्षिप्त है; δέῃ περὶ αὐτῶν का अधिक शाब्दिक अर्थ “उनके संबंध में ज़रूरत में पड़ना” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: अपने ऊपर अधिकार मत दो
  rationale: यह अनुवाद ‘अधिकार देना’ की ठोस यूनानी रचना और व्यक्ति पर नियंत्रण के भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ζωῇ σου
  choice: अपने जीवनकाल में
  rationale: यह वाक्यांश उस अवधि को स्पष्ट करता है जिसमें व्यक्ति को अपने ऊपर का नियंत्रण नहीं सौंपना चाहिए।
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: बेटे या पत्नी, भाई या मित्र को
  rationale: यूनानी में निकट संबंधियों की सूची है। निषेधात्मक हिन्दी सूची में ‘या’ प्रत्येक संभावित व्यक्ति पर अलग-अलग निषेध को स्वाभाविक ढंग से व्यक्त करता है; संबंधसूचक सर्वनाम मूल में स्पष्ट नहीं है।
- source_word: τὰ χρήματά σου
  choice: अपनी संपत्ति
  rationale: χρήματα धन के साथ-साथ संपत्ति या साधनों को व्यापक रूप से सूचित कर सकता है; ‘संपत्ति’ इस विस्तार को बनाए रखता है।
- source_word: ἑτέρῳ
  choice: किसी दूसरे को
  rationale: यह सामान्य रूप से किसी अन्य व्यक्ति का बोध कराता है और हिन्दी में सहज है।
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: कहीं ऐसा न हो कि पछताने के बाद
  rationale: यह परिणाम से सावधान करने वाली रचना और μεταμέλομαι के बाद में पछताने के अर्थ को सुरक्षित रखता है।
- source_word: δέῃ περὶ αὐτῶν
  choice: तुम्हें उसके लिए माँगना पड़े
  rationale: यूनानी अंतिम खंड संक्षिप्त और कुछ हद तक संदिग्ध है। मुख्य पाठ संपत्ति के लिए फिर माँगने की प्रसंगानुकूल धारणा देता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावनाएँ सुरक्षित रखती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। ‘अधिकार’ और ‘संपत्ति’ सामान्य पाठक के लिए स्पष्ट हैं। मूल यूनानी के संक्षिप्त अंतिम खंड की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
