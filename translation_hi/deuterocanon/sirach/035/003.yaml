base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/003.yaml
  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: hi
  text: बुज़ुर्ग, बोलिए, क्योंकि यह आपको शोभा देता है—पर सटीक ज्ञान के साथ; और संगीत में बाधा न डालिए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिया गया मुख्य इब्रानी साक्ष्य इस पद से मेल खाता हुआ नहीं जान पड़ता। इसलिए यूनानी समानांतर पाठ को अनुवाद का मुख्य आधार बनाया गया है।
    reason: textual_variant
  - marker: b
    text: या, “संगीत-प्रस्तुति में व्यवधान न डालिए।” यूनानी शब्द केवल संगीत को ही नहीं, बल्कि संगीत से जुड़ी पूरी प्रस्तुति या गतिविधि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: बोलिए
  rationale: यह बोलने की सीधी आज्ञा है। आदरसूचक रूप संबोधित बुज़ुर्ग की गरिमा के अनुकूल है।
- source_word: πρεσβύτερε
  choice: बुज़ुर्ग
  rationale: संबोधन में आयु और सामाजिक सम्मान दोनों का भाव है; ‘बुज़ुर्ग’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πρέπει
  choice: यह आपको शोभा देता है
  rationale: यह औचित्य और उपयुक्तता व्यक्त करता है तथा हिन्दी में सामाजिक प्रसंग के अनुरूप सहज सुनाई देता है।
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: सटीक ज्ञान के साथ
  rationale: वाक्यांश बोलने में शुद्धता और विषय की ठीक जानकारी पर बल देता है; ‘सटीक’ मूल के परिशुद्धता-संबंधी भाव को बनाए रखता है।
- source_word: μὴ ἐμποδίσῃς
  choice: बाधा न डालिए
  rationale: क्रिया का व्यापक अर्थ रास्ता रोकना या किसी कार्य के प्रवाह में व्यवधान डालना है।
- source_word: μουσικά
  choice: संगीत
  rationale: नपुंसकलिंग बहुवचन रूप संगीत से जुड़ी गतिविधि या प्रस्तुति को सूचित कर सकता है; संक्षिप्त मुख्य पाठ में ‘संगीत’ स्वाभाविक है और व्यापक अर्थ को पादटिप्पणी में रखा गया है।
