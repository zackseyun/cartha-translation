lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: जिस दिन
  rationale: कालवाचक ἐν ἡμέρᾳ का स्वाभाविक हिन्दी रूप ‘जिस दिन’ है; यह निर्दिष्ट समय का भाव बनाए रखता है।
- source_word: συντελείας
  choice: पूरे हों
  rationale: यह शब्द पूर्ण होने या अंत तक पहुँचने का बोध देता है। ‘पूरे हों’ मूल अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡμερῶν ζωῆς σου
  choice: तुम्हारे जीवन के दिन
  rationale: यूनानी संबंधवाचक रचना का निकट और स्पष्ट रूप है तथा मूल में ‘दिन’ की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: καιρῷ τελευτῆς
  choice: तुम्हारी मृत्यु के समय
  rationale: संदर्भ में τελευτή जीवन के अंत, अर्थात मृत्यु, की ओर संकेत करता है; विरासत बाँटने की बात इस अर्थ की पुष्टि करती है।
- source_word: διάδος
  choice: बाँट देना
  rationale: आज्ञार्थक क्रिया संपत्ति को अलग-अलग हिस्सों में देने का भाव रखती है। ‘बाँट देना’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κληρονομίαν
  choice: अपनी विरासत
  rationale: κληρονομίαν विरासत में मिलने या आगे दी जाने वाली संपत्ति को दर्शाता है। कर्ता से संबंध हिन्दी में ‘अपनी’ द्वारा स्वाभाविक रूप से स्पष्ट होता है।
theological_decisions:
- issue: τελευτή को सामान्य ‘अंत’ या स्पष्ट ‘मृत्यु’ के रूप में प्रस्तुत करना
  choice: मृत्यु
  alternative: अंत
  rationale: यद्यपि शब्द सामान्य अंत को भी व्यक्त कर सकता है, विरासत के अंतिम वितरण के संदर्भ में यहाँ मृत्यु अभिप्रेत है। यह चयन कथन की व्यावहारिक गंभीरता बनाए रखता है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीवन के दिन पूरे हों’ मूल यूनानी की पुनरुक्ति और भाव को बचाता है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प देती है।
