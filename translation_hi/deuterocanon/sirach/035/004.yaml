base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/004.yaml
  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: hi
  text: जहाँ[a] सुनने वाले हों[b], वहाँ बातें मत उँडेलो, और असमय अपनी बुद्धिमानी मत दिखाओ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिया गया इब्रानी साक्ष्य सिराख 35:4 से मेल नहीं खाता। इसलिए अनुवाद यूनानी समानांतर पाठ के अनुसार किया गया है, जिसमें अनुचित समय पर बोलने और बुद्धिमानी दिखाने से सावधान किया गया है।
    reason: textual_variant
  - marker: b
    text: या, “जहाँ सुनना हो रहा हो।” यूनानी शब्द का अर्थ सुनना/श्रवण अथवा सुनने वालों का समूह—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “असमय बुद्धिमान बनने का दिखावा मत करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: यह स्थान या परिस्थिति सूचित करता है और अगले वाक्यांश को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἀκρόαμα
  choice: सुननेवाले हों
  rationale: इस संज्ञा में ‘सुनना/श्रवण’ और ‘श्रोता-समुदाय’ दोनों अर्थ संभव हैं। मुख्य पाठ में ‘सुननेवाले’ प्रसंगानुकूल और स्वाभाविक है; दूसरी संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: μὴ ἐκχέῃς
  choice: धारा मत बहाओ
  rationale: मूल क्रिया का शाब्दिक भाव ‘उँडेलना/बहा देना’ है। ‘बातों की धारा मत बहाओ’ उस सजीव रूपक को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: λαλιάν
  choice: बातों
  rationale: यह शब्द वाणी, बातचीत या कही गई बातों को सूचित कर सकता है। ‘बातों’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचनात्मक प्रवाह के रूपक के साथ ठीक बैठता है।
- source_word: ἀκαίρως
  choice: असमय
  rationale: इसका अर्थ अनुचित या अनुपयुक्त समय पर है। ‘असमय’ संक्षिप्त, dignified और स्पष्ट हिन्दी है।
- source_word: μὴ σοφίζου
  choice: अपनी बुद्धिमानी मत दिखाओ
  rationale: यहाँ भाव केवल बुद्धिमान होने का निषेध नहीं, बल्कि स्वयं को बुद्धिमान प्रदर्शित करने या बुद्धिमानी बघारने का है। चुना हुआ वाक्यांश इस भेद को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: इस पद के लिए मूल-पाठ का चयन
  choice: दिए गए यूनानी समानांतर पाठ का अनुवाद
  alternative: 'दिए गए इब्रानी पाठ का अनुवाद: ‘और वे जानेंगे, जैसा हमने जाना है, कि तेरे सिवा कोई परमेश्वर नहीं है।’'
  rationale: प्रस्तुत इब्रानी पाठ इस पद के यूनानी पाठ और अपेक्षित विषय से मेल नहीं खाता तथा किसी दूसरे प्रसंग का प्रतीत होता है। इसलिए इस पद का सुसंगत पाठ देने के लिए यूनानी साक्ष्य अपनाया गया है, और पाठगत समस्या पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन-सदृश रखी गई है। ‘बातों की धारा मत बहाओ’ यूनानी रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘अपनी बुद्धिमानी मत दिखाओ’ दिखावटी प्रज्ञा के निषेध को व्यक्त करता है, न कि वास्तविक बुद्धि को नकारता है।
