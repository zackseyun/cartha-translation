lexical_decisions:
- source_word: כן
  choice: वैसा ही
  rationale: यह शब्द पहले कही गई बात से तुलना या समानता जोड़ता है। ‘वैसा ही’ हिन्दी में इस नीतिवचनात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: איש
  choice: वह मनुष्य
  rationale: इब्रानी में शब्द एकवचन और पुल्लिंग है। ‘मनुष्य’ स्रोत के रूप को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: אשר לא קן
  choice: जिसका कोई घोंसला नहीं है
  rationale: קן का शाब्दिक अर्थ ‘घोंसला’ है। इसे बनाए रखने से किसी स्थायी बसेरे से वंचित प्राणी का मूल बिंब सुरक्षित रहता है; ‘घर’ अधिक व्याख्यात्मक होगा।
- source_word: המרגיע
  choice: वह विश्राम करता है
  rationale: यह रूप शांत होने, ठहरने या विश्राम करने का भाव देता है। पाठ की व्याकरणिक अनिश्चितता को देखते हुए सरल ‘विश्राम करता है’ किसी विशिष्ट धातु-रूप पर अनावश्यक आग्रह नहीं करता।
- source_word: כאשר יערב
  choice: शाम जहाँ उसे आ घेरे
  rationale: शाब्दिक रूप से वाक्यांश शाम होने की परिस्थिति बताता है। ‘जहाँ उसे आ घेरे’ स्थायी बसेरा न होने के निहित स्थानगत भाव को स्वाभाविक हिन्दी में सामने लाता है, पर इसे मुख्य क्रिया से अधिक निश्चित नहीं बनाता।
