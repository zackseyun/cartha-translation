  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: hi
  text: गधे के लिए चारा, छड़ी[a] और बोझ; दास[c] के लिए रोटी, अनुशासन[b] और काम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डंडा’ अथवा ‘लाठी’।
    reason: lexical_alternative
  - marker: b
    text: या ‘शिक्षा’, ‘प्रशिक्षण’ अथवा ‘सुधार’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द οἰκέτης विशेष रूप से घराने के दास या सेवक को सूचित करता है; अधिक स्पष्ट अनुवाद ‘घरेलू दास’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: चारा
  rationale: यह पशु को तृप्त करने वाले आहार के लिए प्रयुक्त है; गधे के संदर्भ में ‘चारा’ स्वाभाविक और सटीक है।
- source_word: ῥάβδος
  choice: छड़ी
  rationale: शब्द का अर्थ छड़ी, डंडा या लाठी हो सकता है। यहाँ पशु को हाँकने के साधन के रूप में ‘छड़ी’ सहज है और अनावश्यक रूप से कठोर अर्थ नहीं जोड़ती।
- source_word: φορτία
  choice: बोझ
  rationale: बहुवचन उन भारों को सूचित करता है जिन्हें बोझ ढोने वाला पशु उठाता है; हिन्दी में ‘बोझ’ सामूहिक अर्थ में स्वाभाविक है।
- source_word: ὄνῳ
  choice: गधे के लिए
  rationale: सम्बन्ध अथवा उपयुक्तता बताने वाले यूनानी सम्प्रदान कारक को ‘के लिए’ से स्पष्ट और स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἄρτος
  choice: रोटी
  rationale: मूल शब्द विशेष रूप से रोटी को दर्शाता है; इसे सामान्य ‘भोजन’ बनाना आवश्यक नहीं है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: इस घरेलू श्रम-संदर्भ में शब्द में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन के अर्थ जुड़े हैं। ‘अनुशासन’ इस व्यापकता और कठोरता को यथासम्भव बनाए रखता है।
- source_word: ἔργον
  choice: काम
  rationale: घरेलू श्रम के संदर्भ में यह सरल, सीधा और आधुनिक हिन्दी रूप है।
- source_word: οἰκέτῃ
  choice: दास
  rationale: οἰκέτης घराने के अधीन दास या सेवक को सूचित करता है। ‘दास’ उसकी बँधी हुई सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है, जबकि पद की संक्षिप्त समानान्तर रचना भी बनी रहती है।
theological_decisions:
- issue: घरेलू श्रमिक के लिए οἰκέτῃ का अनुवाद
  choice: दास
  alternative: सेवक; घरेलू दास
  rationale: यहाँ व्यक्ति घराने के अधीन आश्रित श्रमिक है, और कथन उसके प्रबन्ध की तुलना गधे के प्रबन्ध से करता है। इसलिए सामाजिक असमानता और बँधी हुई स्थिति को नरम किए बिना ‘दास’ रखा गया है; ‘घरेलू दास’ अधिक स्पष्ट, पर मुख्य पंक्ति के लिए भारी है।
translation_notes:
  register: कहावत-जैसी संक्षिप्त, समानान्तर रचना बनाए रखी गई है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। मूल यूनानी में क्रिया नहीं है, इसलिए हिन्दी में भी अनावश्यक क्रिया जोड़ने के बजाय ‘के लिए’ वाली संतुलित संरचना रखी गई है।
