  text: Stir up anger and pour out wrath[a]; humble the foe and drive back the enemy.
translation:
  language: hi
  text: क्रोध को जगा और प्रकोप उंडेल दे[a]; विरोधी को झुका दे और शत्रु को खदेड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'स्वीटे के यूनानी समानांतर का पाठ यहाँ बहुत भिन्न है: उसमें सोने की कारीगरी में जड़ी पन्ने की मुहर और सुखद दाखमधु के साथ संगीत का उल्लेख है। इस पद के लिए काहिरा गनीज़ा परंपरा में इब्रानी पाठ भली-भाँति प्रमाणित है, इसलिए यहाँ उसी को प्राथमिक स्रोत माना गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: भड़का
  rationale: हिफ़ील आज्ञार्थक का अर्थ जगाना या सक्रिय करना है। ‘भड़का’ क्रोध के साथ स्वाभाविक हिन्दी प्रयोग है और आज्ञा की तीव्रता बनाए रखता है।
- source_word: אף
  choice: क्रोध
  rationale: शाब्दिक अर्थ ‘नाक’ हो सकता है, पर यहाँ यह प्रचलित रूपक के अनुसार क्रोध को दर्शाता है।
- source_word: ושפוך
  choice: और ... उंडेल दे
  rationale: שפך का ठोस बिंब ‘उंडेलना’ है; इसे बनाए रखने से दण्डात्मक प्रकोप की काव्यात्मक छवि सुरक्षित रहती है।
- source_word: חמה
  choice: प्रकोप
  rationale: यह तीव्र, दण्डकारी रोष को व्यक्त करता है और אף के लिए प्रयुक्त ‘क्रोध’ से काव्यात्मक भेद बनाए रखता है।
- source_word: והכניע
  choice: और ... नीचा कर
  rationale: כנע में अधीन करने और नीचे लाने दोनों का भाव है। ‘नीचा कर’ lowering motif को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: צר
  choice: विरोधी
  rationale: צר किसी शत्रुतापूर्ण प्रतिद्वंद्वी या सताने वाले को सूचित करता है। ‘विरोधी’ अगले पदांश के ‘शत्रु’ से अनावश्यक पुनरुक्ति बचाता है।
- source_word: והדוף
  choice: और ... खदेड़ दे
  rationale: הדף का अर्थ धक्का देकर दूर करना या पीछे हटाना है। ‘खदेड़ दे’ इसकी सक्रिय, संघर्षपूर्ण शक्ति व्यक्त करता है।
- source_word: אויב
  choice: शत्रु
  rationale: אויב के लिए यह मानक और गरिमापूर्ण हिन्दी शब्द है तथा अंतिम पदांश का चरम समानांतर भाव बनाए रखता है।
theological_decisions:
- issue: आज्ञाओं का संबोधन और निहित कर्ता
  choice: दूसरे पुरुष की आज्ञाओं को परमेश्वर से सीधी विनती के रूप में रखा गया है, पर उसका नाम पाठ में नहीं जोड़ा गया।
  alternative: इसे बिना किसी निश्चित ईश्वरीय संबोधन के सामान्य आह्वान के रूप में समझना।
  rationale: इब्रानी में कर्ता व्यक्त नहीं है, जबकि प्रसंग प्रार्थना का है। हिन्दी के एकवचन आज्ञार्थक रूप इस संबोधन को स्वाभाविक ढंग से रखते हैं, बिना ‘हे प्रभु’ जैसे अनुपस्थित शब्द जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और काव्यात्मक शैली रखी गई है। ‘क्रोध/प्रकोप’ और ‘विरोधी/शत्रु’ से इब्रानी समानांतरता के निकट अर्थभेद सुरक्षित हैं; एकवचन अनौपचारिक आज्ञार्थक यहाँ परमेश्वर से तीव्र प्रत्यक्ष विनती को दर्शाता है, अनादर को नहीं।
