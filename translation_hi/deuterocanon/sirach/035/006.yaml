  terminology: «क्रोध/प्रकोप» and «विरोधी/शत्रु» appropriately retain the Hebrew poetic distinctions. «उंडेल दे» preserves the concrete image of pouring out, and «खदेड़ दे» adequately conveys driving off. The textual-variant footnote is retained, with slightly smoother wording for the Greek image.
  issues:
  - severity: low
    issue: «क्रोध को भड़का» is semantically less precise for העיר.
    rationale: Although it can be understood as an appeal for divine anger to flare up, «भड़काना» commonly means to provoke or incite. The source verb means awaken/arouse; «जगा» preserves that sense more directly.
  - severity: low
    issue: «विरोधी को नीचा कर» is somewhat less natural and may imply humiliation.
    rationale: The Hebrew can mean humble or subdue. «विरोधी को झुका दे» is idiomatic modern Hindi and retains the image of bringing low without adding a particular social nuance.
