  source_fidelity: 'The Hebrew is accurately represented as four second-person imperatives: arouse anger, pour out wrath, humble/subdue the adversary, and drive back the enemy. The draft preserves the two pairs and their deliberate lexical distinction. However, «क्रोध को भड़का» can suggest inciting anger rather than awakening it; «जगा» more directly renders העיר.'
