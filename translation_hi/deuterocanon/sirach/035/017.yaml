base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/017.yaml
  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: hi
  text: गला हर प्रकार का भोजन खाता है[b][a], पर एक प्रकार का भोजन दूसरे से अधिक मनभावन होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बचा हुआ इब्रानी पाठ संक्षिप्त लोकोक्ति है और उसकी रचना कुछ असहज है। इस पद का यूनानी पाठ बहुत भिन्न है: “पापी मनुष्य डाँट से बचेगा और अपनी इच्छा के अनुसार कोई निर्णय/तर्क पाएगा।” इससे सम्भव है कि यूनानी अनुवाद के पीछे अलग इब्रानी पाठ था, या इब्रानी पाठ-परम्परा में कहीं विकार आया हो।'
    reason: textual_variant
  - marker: b
    text: या “कंठ”; इब्रानी शब्द गले अथवा निगलने की नली के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: हर प्रकार का भोजन
  rationale: यह सामान्य और सार्वभौमिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘हर भोजन’ की अपेक्षा प्रकारों का भाव अधिक स्पष्ट है।
- source_word: אוכל
  choice: खा लेता है
  rationale: मूल क्रिया सामान्यतः ‘खाना’ है। ‘खा लेता है’ इस लोकोक्तिपरक कथन में सहज हिन्दी है और अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: גרגרת
  choice: गला
  rationale: शब्द भोजन ग्रहण करने वाले कंठ या निगलने की नली को सूचित करता है। ‘गला’ सामान्य पाठक के लिए स्वाभाविक है; ‘ग्रासनली’ अधिक तकनीकी होती।
- source_word: אך
  choice: पर
  rationale: यह सामान्य कथन और उसके बाद आने वाले भेद के बीच स्पष्ट विरोध दर्शाता है।
- source_word: יש אכל
  choice: एक प्रकार का भोजन
  rationale: शाब्दिक अस्तित्ववाचक रचना हिन्दी में असहज होती; सन्दर्भ में भोजन की एक श्रेणी को दूसरी से तुलना करने का भाव है।
- source_word: נעים
  choice: अधिक स्वादिष्ट
  rationale: विशेषण का मूल भाव मनभावन या सुखद है। भोजन के सन्दर्भ में ‘स्वादिष्ट’ स्वाभाविक है, और विरोध से निहित तुलनात्मक अर्थ को ‘अधिक’ व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अन्तर
  choice: मुख्य पाठ में उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी पाठ का अनुवाद: ‘पापी मनुष्य डाँट से बचेगा और अपनी इच्छा के अनुसार कोई निर्णय/तर्क ढूँढ़ लेगा।’'
  rationale: दिए गए स्रोत में इब्रानी पाठ को मूल स्रोत के रूप में उच्च विश्वसनीयता और सहमति प्राप्त है। फिर भी यूनानी समानान्तर बिल्कुल अलग कथन देता है, इसलिए पाठान्तर को पादटिप्पणी में सुरक्षित रखा गया है, न कि चुपचाप समरस किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लोकोक्ति की संक्षिप्तता बनाए रखते हुए दूसरे खण्ड में निहित तुलना को स्पष्ट हिन्दी में व्यक्त किया गया है। पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में रखे गए हैं जिस क्रम में वे सम्बद्ध शब्द और व्यापक पाठगत समस्या से जुड़ते हैं।
