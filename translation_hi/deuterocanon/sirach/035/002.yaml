  text: Strike the foreign people[b][a], and let them see your mighty deeds.
translation:
  language: hi
  text: पराए लोगों के प्रति ढील दे[b], और उन्हें अपने पराक्रम के कार्य देखने दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का उपलब्ध यूनानी समानांतर पाठ हिब्रू साक्ष्य से बहुत अलग है और संभवतः पाठ के किसी दूसरे रूप को दर्शाता है। यहाँ अनुवाद उपलब्ध हिब्रू के अनुसार है।
    reason: textual_variant
  - marker: b
    text: या, “पराए लोगों के प्रति ढीला पड़ जा,” “उन्हें छोड़ दे,” अथवा “पराए लोगों के साथ निश्चिंत रह।” हिब्रू आज्ञा बहुत संक्षिप्त है और उसका सटीक भाव पूरी तरह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הרף
  choice: प्रहार कर
  rationale: यह संक्षिप्त आज्ञार्थक रूप संदर्भ में किसी पर हाथ छोड़ने अथवा वार करने का भाव दे सकता है। फिर भी רפה का सामान्य अर्थ ‘ढीला छोड़ना’ या ‘हट जाना’ भी है, इसलिए अनिश्चितता को पाद-टिप्पणी में रखा गया है।
- source_word: על
  choice: पर
  rationale: प्रहार की लक्षित दिशा को व्यक्त करने के लिए על का स्वाभाविक हिन्दी रूप ‘पर’ है।
- source_word: עם נכר
  choice: पराया राष्ट्र
  rationale: עם सामूहिक जनसमुदाय और נכר उसके पराए अथवा विदेशी होने को बताता है; ‘पराया राष्ट्र’ इस सामूहिक अर्थ को बनाए रखता है।
- source_word: ויראו
  choice: और उन्हें … देखने दे
  rationale: आज्ञा के बाद यह उपसर्गयुक्त क्रिया इच्छार्थक अर्थ दे सकती है—‘और वे देखें’ अथवा ‘उन्हें देखने दे।’
- source_word: גבורתיך
  choice: अपने पराक्रम के काम
  rationale: बहुवचन रूप दिखाई देने वाले सामर्थ्यपूर्ण कार्यों की ओर संकेत करता है, केवल अमूर्त शक्ति की ओर नहीं।
theological_decisions:
- issue: हिब्रू साक्ष्य और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू साक्ष्य का अनुवाद किया गया है।
  alternative: यूनानी पाठ के अनुसार देखभाल करने, बैठने, भोजन करने और मुकुट पाने से संबंधित बिल्कुल अलग वाक्य बनता।
  rationale: जहाँ हिब्रू पाठ उपलब्ध है, उसे प्राथमिक मानना उचित है। यहाँ यूनानी समानांतर हिब्रू पंक्ति का निकट अनुवाद नहीं है, इसलिए दोनों को कृत्रिम रूप से मिलाया नहीं गया।
- issue: הרף का संदर्भगत अर्थ
  choice: प्रहार कर
  alternative: पराए राष्ट्र के प्रति ढील दे / उससे हट जा / उसके साथ निश्चिंत रह
  rationale: इस अत्यंत संक्षिप्त वाक्य में क्रिया का सटीक भाव निश्चित नहीं है। संदर्भगत आक्रामक अर्थ मुख्य पाठ में रखा गया है, पर सामान्य कोशगत अर्थों को पाद-टिप्पणी में स्पष्ट किया गया है ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक संबोधन के अनुकूल रखी गई है। ‘पराया राष्ट्र’ मूल के सामूहिक एकवचन को और ‘पराक्रम के काम’ बहुवचन गבורתיך को स्पष्ट करता है।
