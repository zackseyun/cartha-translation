base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/015.yaml
  text: Hear the prayer of your servants[b][a], according to your favor toward your people.
translation:
  language: hi
  text: अपने लोगों के प्रति अपनी कृपा[a] के अनुसार अपने सेवकों की प्रार्थना सुन।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी इच्छा के अनुसार।” इब्रानी רצון का अर्थ “इच्छा” या “कृपा/प्रसन्नता” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद की यूनानी पाठ-परंपरा बहुत भिन्न है: “जो व्यवस्था की खोज करता है, वह उससे भर जाएगा; और ढोंगी उसी में ठोकर खाएगा।” यह उपलब्ध इब्रानी और यूनानी रूपों के बीच एक बड़ा पाठांतर है।'
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: सुन
  rationale: प्रार्थना की भाषा में क़ाल अपूर्ण रूप निवेदनात्मक बल रखता है। हिन्दी में प्रत्यक्ष संबोधन का “सुन” इस विनती को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: תפלת עבדיך
  choice: अपने सेवकों की प्रार्थना
  rationale: תפלת एकवचन रचना-रूप है, इसलिए “प्रार्थना” एकवचन रखा गया है। עבדיך के लिए ईश्वर की सेवा और समर्पण के संदर्भ में “सेवकों” स्वाभाविक है; “दासों” यहाँ सामाजिक बंधन पर अनावश्यक बल देता।
- source_word: כרצונך
  choice: अपनी कृपा के अनुसार
  rationale: רצון का अर्थ इच्छा, प्रसन्नता, स्वीकृति या अनुग्रह हो सकता है। על עמך के साथ यहाँ लोगों के प्रति ईश्वर की हितकारी प्रवृत्ति प्रमुख जान पड़ती है, इसलिए “कृपा” चुना गया; “इच्छा” को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: על עמך
  choice: अपने लोगों पर
  rationale: על को “पर” और עמך को “अपने लोगों” के रूप में रखना मूल की संबंधपरक दिशा और सामुदायिक अर्थ दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वर को संबोधित करते हुए עבדיך का अर्थ
  choice: अपने सेवकों
  alternative: अपने दासों
  rationale: इस प्रार्थनात्मक संदर्भ में शब्द उपासना, समर्पण और सेवा का संबंध व्यक्त करता है; बंधुआ सामाजिक स्थिति को प्रमुख बनाना संदर्भ से अधिक विशिष्ट होगा।
- issue: כרצונך में רצון का अर्थ
  choice: अपनी कृपा के अनुसार
  alternative: अपनी इच्छा के अनुसार
  rationale: दोनों अर्थ शब्द की वास्तविक अर्थ-सीमा में हैं। “अपने लोगों पर” के साथ “कृपा” हितकारी भाव को अधिक स्वाभाविक रूप से व्यक्त करती है, जबकि “इच्छा” की संभव व्याख्या पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए लक्ष्य पदबंध को पहले रखता है, पर इब्रानी के सभी प्रमुख अर्थ-घटकों को सुरक्षित रखता है। ईश्वर के प्रत्यक्ष संबोधन में “सुन” संक्षिप्त बाइबलीय विनती का स्वर देता है; आदरसूचक बहुवचन नहीं जोड़ा गया है।
