base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/030.yaml
  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: hi
  text: क्योंकि इससे अच्छा है कि तुम्हारी संतान तुमसे माँगे, बजाय इसके कि तुम अपने बेटों के हाथों की ओर देखो[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे विनती करे”; यूनानी क्रिया आवश्यकता के कारण माँगने या आग्रहपूर्वक निवेदन करने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपने बेटों के हाथों की ओर देखो”; यह उनसे सहायता या भरण-पोषण पाने के लिए उन पर निर्भर रहने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: इससे अच्छा है
  rationale: तुलनात्मक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τέκνα
  choice: संतान
  rationale: यह व्यापक शब्द बच्चों या संतान को सूचित करता है और बाद के अधिक विशिष्ट υἱῶν से भेद बनाए रखता है।
- source_word: δεηθῆναί
  choice: माँगे
  rationale: δέομαι यहाँ आवश्यकता के कारण किसी से माँगने या विनती करने का भाव रखता है। ‘माँगे’ सहज हिन्दी है और क्रिया की अर्थ-सीमा को अनावश्यक रूप से केवल भिक्षा माँगने तक सीमित नहीं करता।
- source_word: ἐμβλέπειν
  choice: ताकते रहो
  rationale: मूल में देखने की ठोस छवि है; हाथों के साथ यह सहायता या भरण-पोषण की आशा में निर्भर रहने का संकेत देती है।
- source_word: εἰς χεῖρας
  choice: हाथों की ओर
  rationale: यूनानी की शारीरिक छवि को बनाए रखता है, जहाँ हाथ सहायता या उपलब्ध कराने के साधन का संकेत हैं।
- source_word: υἱῶν
  choice: बेटों
  rationale: υἱῶν विशेष रूप से पुत्रों को दर्शाता है; इसे ‘संतान’ से अलग रखकर मूल का शब्दगत भेद सुरक्षित रहता है।
theological_decisions:
- issue: τέκνα और υἱῶν के बीच लिंग-संबंधी भेद
  choice: τέκνα का अनुवाद ‘संतान’ और υἱῶν का ‘बेटों’ किया गया है।
  alternative: दोनों का अनुवाद ‘संतान’ या ‘बच्चों’ किया जा सकता था।
  rationale: मूल यूनानी पहले व्यापक और फिर विशेष रूप से पुल्लिंग शब्द का प्रयोग करता है; भेद को सुरक्षित रखना स्रोत के प्रति अधिक पारदर्शी है।
- issue: बेटों के हाथों की ओर देखने की छवि
  choice: रूपक को मुख्य पाठ में बनाए रखा गया और उसका आशय पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में सीधे ‘अपने बेटों पर निर्भर रहो’ कहा जा सकता था।
  rationale: मूल की ठोस और अर्थपूर्ण छवि को व्याख्यात्मक अनुवाद से बदलना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संतान’ और ‘बेटों’ से मूल का व्यापक-विशिष्ट भेद सुरक्षित है। ‘हाथों की ओर ताकते रहो’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
