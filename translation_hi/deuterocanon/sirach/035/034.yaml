translation:
  language: hi
  text: बालक को काम पर लगाओ[a], और तुम्हें विश्राम मिलेगा; उसे बेकार रहने दो, और वह स्वतंत्रता की तलाश करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “बालक के साथ/में काम करो ... उसके लिए उसके हाथ ढीले करो।” यूनानी पदबंध संक्षिप्त और कुछ अस्पष्ट है; इस संदर्भ में इसका आशय बालक को काम में लगाने और उसे निष्क्रिय न छोड़ने से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: बालक को काम में लगाए रखो
  rationale: यूनानी पदबंध संक्षिप्त और कुछ असामान्य है; शाब्दिक अर्थ ‘बालक के साथ/में काम करो’ हो सकता है, पर प्रसंग में बालक को काम में लगाए रखने का भाव अधिक स्वाभाविक है। ‘लगाए रखो’ निरंतर व्यस्त रखने के निहित व्यावहारिक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: तुम्हें विश्राम मिलेगा
  rationale: ἀνάπαυσις का सीधा अर्थ विश्राम या राहत है। यह चयन कहावत के परिणाम-वाक्य को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἄνες χεῖρας αὐτῷ
  choice: उसके हाथ ढीले छोड़ दो
  rationale: ἄνες का अर्थ ढीला करना या छोड़ देना है और χεῖρας का अर्थ हाथ। यह अनुवाद यूनानी की ठोस उपमा को सुरक्षित रखता है, जबकि हिन्दी में निष्क्रियता या अनुशासन में ढील का संकेत भी देता है।
- source_word: ζητήσει ἐλευθερίαν
  choice: वह स्वतंत्रता खोजेगा
  rationale: ἐλευθερία का मूल अर्थ स्वतंत्रता है। ‘खोजेगा’ ζητήσει के भाव को सीधे व्यक्त करता है और घरेलू अनुशासन के संदर्भ को बिना ‘स्वेच्छाचार’ जैसी व्याख्यात्मक शब्दावली थोपे खुला रखता है।
theological_decisions:
- issue: παιδί और ἐλευθερία का सामाजिक-नैतिक आशय
  choice: इसे बालक के अनुशासन से जुड़ी ज्ञानोक्ति के रूप में प्रस्तुत किया गया है और ἐλευθερία का अनुवाद ‘स्वतंत्रता’ रखा गया है।
  alternative: παιδί को ‘सेवक-बालक’ और ἐλευθερία को ‘मनमानी’ या ‘बंधन से छुटकारा’ कहना।
  rationale: παιδί ‘बालक’ के साथ युवा सेवक का संकेत भी दे सकता है, पर पाठ अकेले किसी एक सामाजिक स्थिति को निर्णायक नहीं बनाता। ‘स्वतंत्रता’ मूल शब्द का तनाव बनाए रखती है और आधुनिक राजनीतिक अर्थ अथवा नैतिक निंदा को अनावश्यक रूप से नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कहावत-जैसी और गरिमापूर्ण शैली। ‘बालक’ ने παιδί की आयु-संबंधी मूल छवि को रखा है, जबकि पादटिप्पणी यूनानी वाक्य-विन्यास की वास्तविक अस्पष्टता बताती है।
