  yaml_path: translation/deuterocanon/sirach/035/012.yaml
  text: Fill Zion with your splendor[a], and your temple with your glory.
translation:
  language: hi
  text: सिय्योन को अपने वैभव से भर दे[a], और अपने मंदिर को अपनी महिमा से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का यूनानी पाठ बहुत भिन्न है: “वहाँ क्रीड़ा कर, अपने विचार पूरे कर, और घमंड की बात से पाप न कर।” यह उपलब्ध इब्रानी पाठ से एक बड़े पाठांतर की ओर संकेत करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: भर दे
  rationale: यह आज्ञार्थक रूप है, जो प्रार्थना में विनती का भाव रखता है। ‘भर दे’ सहज और सीधा हिन्दी रूप है; दूसरी पंक्ति में यही क्रिया अध्याहृत है।
- source_word: ציון
  choice: सिय्योन
  rationale: इब्रानी में विशिष्ट स्थान-नाम सिय्योन है; इसे सामान्यीकृत करके ‘यरूशलेम’ नहीं किया गया।
- source_word: הודך
  choice: अपने वैभव से
  rationale: הוד दिव्य तेज, शोभा या प्रताप को व्यक्त करता है। ‘वैभव’ काव्यात्मक गरिमा बनाए रखता है और כבוד के लिए प्रयुक्त ‘महिमा’ से भेद भी सुरक्षित रखता है।
- source_word: ומכבודך
  choice: और ... अपनी महिमा से
  rationale: दूसरी पंक्ति में ‘भर दे’ पहली पंक्ति से समझी जाती है। מ־ को यहाँ भरने वाली वस्तु अथवा माध्यम के अर्थ में स्वाभाविक हिन्दी ‘से’ द्वारा व्यक्त किया गया है।
- source_word: היכלך
  choice: अपने मंदिर को
  rationale: היכל का अर्थ महल भी हो सकता है, पर सिय्योन और परमेश्वर की उपासना के इस संदर्भ में ‘मंदिर’ उपयुक्त है।
- source_word: כבודך
  choice: अपनी महिमा
  rationale: כבוד के लिए ‘महिमा’ इस धार्मिक-काव्यात्मक संदर्भ में स्वाभाविक है और הוד के ‘वैभव’ से मूल का शब्दगत भेद बनाए रखती है।
theological_decisions:
- issue: הוד और כבוד के बीच काव्यात्मक भेद
  choice: הוד को ‘वैभव’ और כבוד को ‘महिमा’ अनूदित किया गया।
  alternative: दोनों को ‘महिमा’ कहना, अथवा הוד को ‘प्रताप’ कहना।
  rationale: मूल इब्रानी दो निकटार्थी पर भिन्न शब्दों का प्रयोग करता है। हिन्दी में उनका भेद बनाए रखने से कविता की बनावट सुरक्षित रहती है और कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
- issue: इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: मुख्य पाठ के लिए उपलब्ध इब्रानी रूप का अनुवाद किया गया।
  alternative: 'यूनानी पाठ का अनुसरण करना: ‘वहाँ क्रीड़ा कर, अपने विचार पूरे कर, और घमंड की बात से पाप न कर।’'
  rationale: इस पद का उपलब्ध इब्रानी पाठ स्पष्ट प्रार्थना-पंक्ति देता है, जबकि यूनानी साक्षी सर्वथा भिन्न पाठ-रूप दर्शाती है। अंतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में पारदर्शी रूप से बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। समानांतर काव्य-रचना को बनाए रखते हुए दूसरी पंक्ति में इब्रानी की तरह क्रिया को अध्याहृत छोड़ा गया है।
