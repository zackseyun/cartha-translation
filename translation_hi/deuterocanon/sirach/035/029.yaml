  yaml_path: translation/deuterocanon/sirach/035/029.yaml
  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
translation:
  language: hi
  text: जब तक तुम जीवित हो और तुममें साँस है, तब तक अपने आप को किसी भी मनुष्य के हवाले न कर दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “किसी भी मनुष्य के लिए अपने आप को न बदलो।” यूनानी अभिव्यक्ति मुहावरेदार है और इसका भाव यह भी हो सकता है कि तुम अपने को नश्वर मनुष्यों के वश में न कर दो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: जब तक तुम जीवित हो
  rationale: यह पदबंध जीवन की शेष अवधि को सूचित करता है। आधुनिक हिन्दी में यह स्वाभाविक है और यूनानी के कालगत बल को बनाए रखता है।
- source_word: πνοὴ ἐν σοί
  choice: तुममें साँस है
  rationale: πνοή का सामान्य अर्थ शारीरिक साँस या जीवन-श्वास है। ‘साँस’ समानांतर ‘जीवित हो’ के अनुकूल है और ‘आत्मा’ जैसा अधिक धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: अपने आप को ... के हवाले न कर दो
  rationale: ἀλλάσσω का मूल अर्थ बदलना या विनिमय करना है, पर यहाँ आत्मवाचक कर्म और दत्तिव πάσῃ σαρκί के साथ यह किसी के अधीन अपने को सौंप देने का संक्षिप्त मुहावरेदार भाव देता है। हिन्दी प्रयोग अर्थ को स्पष्ट रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πάσῃ σαρκί
  choice: किसी भी मनुष्य के
  rationale: यहाँ σάρξ शरीर की अभिलाषा या ‘पापी स्वभाव’ नहीं, बल्कि नश्वर मनुष्य के लिए प्रयुक्त अभिव्यक्ति है। शाब्दिक ‘किसी भी देह’ हिन्दी में भ्रामक होगा; ‘किसी भी मनुष्य’ संदर्भगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: इस ज्ञान-साहित्यिक संदर्भ में σάρξ का अर्थ
  choice: नश्वर मनुष्य
  alternative: शारीरिक अभिलाषा अथवा पापी स्वभाव
  rationale: πάσῃ σαρκί मनुष्यों की नश्वरता और सीमितता की ओर संकेत करने वाली प्रचलित अभिव्यक्ति है। इसे ‘पापी स्वभाव’ कहना संदर्भ से परे बाद की धर्मवैज्ञानिक धारणा आरोपित करेगा।
- issue: μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί का बल
  choice: अपने को किसी मनुष्य के वश या अधिकार में न सौंपना
  alternative: किसी के लिए अपने को न बदलना
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ संभावित नैतिक चेतावनी को पठनीय हिन्दी में व्यक्त करता है; ‘अपने को न बदलो’ वाला अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘देह’ की शाब्दिकता से होने वाली सम्भावित गलतफहमी से बचते हुए ‘मनुष्य’ रखा गया है। ‘के हवाले न कर दो’ साधारण पाठक के लिए बोधगम्य है और मूल की नैतिक चेतावनी को बनाए रखता है।
