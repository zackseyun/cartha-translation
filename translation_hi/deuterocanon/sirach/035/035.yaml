  yaml_path: translation/deuterocanon/sirach/035/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: hi
  text: जूआ और चमड़े का पट्टा गर्दन को झुका देंगे, और दुष्ट दास[a] के लिए खींचने-मरोड़ने के यंत्र और यातनाएँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुष्ट घरेलू सेवक’। यूनानी οἰκέτης घर में सेवा करने वाले व्यक्ति को भी दर्शा सकता है, पर यहाँ बंधन और दंड का प्रसंग ‘दास’ अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: जूआ
  rationale: गर्दन झुकाने के चित्र में इसका ठोस अर्थ ‘जूआ’ स्पष्ट है; यहाँ ‘तराजू’ या ‘जोड़ी’ अभिप्रेत नहीं है।
- source_word: ἱμάς
  choice: चमड़े का पट्टा
  rationale: यह शब्द चमड़े के पट्टे या तस्मे को दर्शाता है। ‘चमड़े का पट्टा’ आधुनिक हिन्दी में स्पष्ट है और जूए के साथ नियंत्रण के साधन का चित्र बनाए रखता है।
- source_word: κάμψουσιν
  choice: झुका देंगे
  rationale: भविष्यत् काल के बहुवचन क्रिया-रूप को सुरक्षित रखते हुए यह गर्दन को बलपूर्वक नीचे करने का स्वाभाविक हिन्दी चित्र देता है।
- source_word: τράχηλον
  choice: गर्दन
  rationale: यह सीधे शरीर के अंग का उल्लेख है और हिन्दी में बिना अनावश्यक निर्धारक के स्वाभाविक है।
- source_word: οἰκέτῃ
  choice: दास
  rationale: οἰκέτης का अर्थ घरेलू सेवक भी हो सकता है, पर जूए, बंधन और दंड के इस प्रसंग में पराधीन स्थिति प्रमुख है; इसलिए ‘दास’ चुना गया है, जबकि व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: κακούργῳ
  choice: दुष्ट
  rationale: यह οἰκέτῃ को विशेषित कर नैतिक बुराई या दुष्कर्म का भाव देता है। ‘अपराधी’ अर्थ को अनावश्यक रूप से संकरा कर देता।
- source_word: στρέβλαι
  choice: खींचने-मरोड़ने के यंत्र
  rationale: यह बहुवचन संज्ञा शरीर को कसकर या मरोड़कर यातना देने वाले यंत्रों, विशेषतः रैक, को दर्शाती है। हिन्दी पाठक के लिए वर्णनात्मक अनुवाद केवल ‘रैक’ से अधिक स्पष्ट है।
- source_word: βάσανοι
  choice: यातनाएँ
  rationale: इस दंडात्मक संदर्भ में पीड़ा देकर दंडित करने का अर्थ प्रमुख है; बहुवचन भी सुरक्षित रखा गया है।
theological_decisions:
- issue: οἰκέτῃ में सेवक अथवा दास का अर्थ
  choice: दास
  alternative: घरेलू सेवक
  rationale: मूल शब्द दोनों अर्थों की गुंजाइश रखता है। इस पद में शारीरिक नियंत्रण और यातना का प्रसंग पराधीनता को उभारता है, इसलिए मुख्य पाठ में ‘दास’ रखा गया है; फिर भी शब्द की व्यापकता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्राचीन यातना-यंत्र के लिए अस्पष्ट विदेशी शब्द के स्थान पर अर्थ-स्पष्ट वर्णनात्मक पदबंध अपनाया गया है।
