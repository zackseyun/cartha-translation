  text: Gather all the tribes of Jacob[a], and let them inherit as in former days.
translation:
  language: hi
  text: याकूब के सभी गोत्रों को इकट्ठा कर[a], और उन्हें प्राचीन काल की भाँति उत्तराधिकार प्राप्त करने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के यूनानी समानांतर में इसके बदले यह लिखा है: “प्रमुख लोगों के बीच अपने आपको उनके बराबर न ठहरा, और जब कोई दूसरा बोल रहा हो, तो बहुत बातें न कर।” संभवतः यह बचे हुए इब्रानी पाठ से भिन्न पाठ-परंपरा या पद-विन्यास को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אסוף
  choice: इकट्ठा कर
  rationale: אסף के आज्ञार्थक रूप में बिखरे हुओं को एक साथ लाने का आह्वान है। “इकट्ठा कर” सहज आधुनिक हिन्दी में उसका सीधा और प्रार्थनापूर्ण बल बनाए रखता है।
- source_word: כל שבטי יעקב
  choice: याकूब के सभी गोत्रों
  rationale: यह इब्रानी संबंध-संरचना का स्वाभाविक हिन्दी रूप है और “गोत्र” पूर्वज तथा वाचा से जुड़ी सामुदायिक पहचान को सुरक्षित रखता है।
- source_word: ויתנחלו
  choice: उन्हें अपनी विरासत पाने दे
  rationale: נחל का यह रूप पैतृक अथवा बाँटी गई विरासत प्राप्त करने या उस पर अधिकार पाने का भाव रखता है। हिन्दी में “अपनी विरासत पाने दे” इस निहित अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी अनुल्लिखित भूमि को स्पष्ट रूप से जोड़ने के।
- source_word: כימי קדם
  choice: प्राचीन दिनों की तरह
  rationale: यह पद पहले के प्राचीन समय की ओर संकेत करता है और पुनर्स्थापना की अपेक्षा को बनाए रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में गंभीर भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी समानांतर: “प्रतिष्ठित लोगों के बीच अपने को उनके बराबर न ठहरा, और जब कोई दूसरा बोल रहा हो, तो बहुत बकबक न कर।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। यहाँ इब्रानी में इस्राएल के गोत्रों की पुनर्स्थापना की प्रार्थना है, जबकि यूनानी में एक सर्वथा भिन्न नीतिवचन मिलता है। इसलिए भिन्नता को मिटाए बिना यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “इकट्ठा कर” और “पाने दे” परमेश्वर से की जा रही सीधी प्रार्थना के आज्ञार्थक रूप को स्वाभाविक हिन्दी में व्यक्त करते हैं।
