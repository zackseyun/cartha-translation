  text: Any food is shut up in the belly[b][a], but one food is more pleasant than another.
translation:
  language: hi
  text: हर भोजन पेट में बंद हो जाता है[b], पर कोई भोजन दूसरे से अधिक मनभावन होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश कुछ संक्षिप्त है; शाब्दिक रूप से, “ऐसा भोजन है जो भोजन से मनभावन होता है।” भाव तुलनात्मक है: कोई भोजन दूसरे से अधिक मनभावन होता है।'
    reason: lexical_alternative
  - marker: b
    text: इस स्थान पर यूनानी समानांतर पाठ उपलब्ध इब्रानी पाठ से बहुत अलग है और संभवतः पाठ की किसी दूसरी पंक्ति को दर्शाता है। यहाँ अनुवाद में इब्रानी साक्ष्य को मुख्य स्रोत माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: כל מאכל
  choice: हर भोजन
  rationale: एकवचन संज्ञा के साथ כל यहाँ वितरणात्मक समग्रता व्यक्त करता है। ‘हर भोजन’ सामान्य कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תסגר
  choice: बंद हो जाता है
  rationale: निफ़अल का निष्क्रिय भाव भोजन के पेट के भीतर बंद हो जाने का ठोस चित्र देता है; इसे पाचन जैसी व्याख्यात्मक भाषा में नहीं बदला गया।
- source_word: בבטן
  choice: पेट में
  rationale: भोजन के प्रसंग में בטן का अर्थ पाचन से संबंधित ‘पेट’ है, गर्भ नहीं। यह आधुनिक हिन्दी में सहज और मूल के ठोस भाव के अनुरूप है।
- source_word: אך
  choice: पर
  rationale: यह सभी भोजनों की समान परिणति और उनके अलग-अलग मनभावन होने के बीच विरोध दर्शाता है।
- source_word: יש מאכל ממאכל
  choice: कोई भोजन दूसरे से
  rationale: इब्रानी की संक्षिप्त तुलनात्मक रचना को स्वाभाविक हिन्दी तुलना के रूप में व्यक्त किया गया है, बिना ‘प्रकार’ शब्द जोड़े।
- source_word: תנעם
  choice: अधिक मनभावन होता है
  rationale: נעם सुखद या प्रिय लगने का व्यापक भाव रखता है। ‘मनभावन’ उस भाव को बचाता है और अर्थ को केवल मिठास या स्वादिष्टता तक सीमित नहीं करता।
