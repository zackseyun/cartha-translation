base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: hi
  text: उसे ऐसा काम सौंपो जो उसके लिए उचित हो; और यदि वह आज्ञा न माने, तो उसकी बेड़ियाँ भारी कर दो। पर किसी भी मनुष्य के साथ हद से आगे न बढ़ो,[a] और बिना विचार किए कुछ भी न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किसी भी देह के साथ।” यहाँ अर्थ किसी भी व्यक्ति के साथ है।
    reason: यूनानी σάρξ के ठोस शब्द और उसके प्रसंगगत मानवीय अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: काम पर लगाओ
  rationale: εἰς के साथ κατάστησον किसी को कार्य में नियुक्त या प्रवृत्त करने का निर्देश देता है। ‘काम पर लगाओ’ आधुनिक हिन्दी में स्वाभाविक और आदेशात्मक है।
- source_word: καθὼς πρέπει αὐτῷ
  choice: उसकी योग्यता के अनुसार
  rationale: πρέπει उचित या अनुकूल होने का भाव रखता है। प्रसंग में सौंपे जाने वाले काम और व्यक्ति के बीच उपयुक्तता व्यक्त करने के लिए यह स्वाभाविक हिन्दी है।
- source_word: πειθαρχῇ
  choice: आज्ञा न माने
  rationale: πειθαρχέω अधिकार के अधीन आज्ञापालन को सूचित करता है; यूनानी में ‘अनुशासन’ के लिए अलग संज्ञा नहीं है, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: उसकी बेड़ियाँ भारी कर दो
  rationale: यह πέδαι के ठोस अर्थ और βαρύνω की क्रिया को निकटता से सुरक्षित रखता है।
- source_word: μὴ περισσεύσῃς
  choice: हद से आगे न बढ़ो
  rationale: यहाँ περισσεύω उचित सीमा से अधिक कठोरता बरतने का निषेध करता है। यह हिन्दी में ‘अत्यधिक न हो’ से अधिक सहज है।
- source_word: ἐν πάσῃ σαρκί
  choice: किसी भी मनुष्य के साथ
  rationale: इस ज्ञान-साहित्यिक प्रसंग में σάρξ मनुष्य या नश्वर व्यक्ति के लिए सामूहिक मुहावरा है। शाब्दिक ‘किसी भी देह में’ हिन्दी में भ्रामक होगा; ठोस शब्दार्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἄνευ κρίσεως
  choice: बिना विचार किए
  rationale: κρίσις यहाँ निर्णय, विवेकपूर्ण विचार या न्यायोचित परख का व्यापक भाव रख सकता है। ‘बिना विचार किए’ चेतावनी का स्वाभाविक अर्थ देता है और अस्पष्टता को पादटिप्पणी में दर्शाता है।
- source_word: μὴ ποιήσῃς μηδέν
  choice: कुछ भी न करो
  rationale: यूनानी निषेध का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ἐν πάσῃ σαρκί में σάρξ का अर्थ
  choice: किसी भी मनुष्य के साथ
  alternative: किसी भी देह के साथ
  rationale: यहाँ ‘देह’ मानव व्यक्ति के लिए सामी प्रभाव वाला यूनानी मुहावरा है। हिन्दी में शाब्दिक रूप अस्पष्ट या शरीर-संबंधी अर्थ देगा, इसलिए मुख्य पाठ में अभिप्रेत मानवीय संदर्भ रखा गया और मूल बिंब पादटिप्पणी में बताया गया।
- issue: ἄνευ κρίσεως का अर्थ-क्षेत्र
  choice: बिना विचार किए
  alternative: बिना न्याय / बिना विवेक के
  rationale: κρίσις निर्णय, परख और न्याय—तीनों अर्थ रख सकता है। प्रसंग किसी कार्य से पहले उचित निर्णय की माँग करता है; किसी एक न्यायशास्त्रीय अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। दासता-संबंधी प्राचीन सामाजिक संदर्भ को नरम करके छिपाया नहीं गया; ‘बेड़ियाँ’ का ठोस बिंब बनाए रखा गया है।
