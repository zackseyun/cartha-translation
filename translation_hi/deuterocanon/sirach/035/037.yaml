lexical_decisions:
- source_word: πολλὴν
  choice: बहुत
  rationale: एकवचन भाववाचक संज्ञा κακίαν के साथ यह संख्या नहीं, बल्कि मात्रा या विस्तार बताता है; इसलिए ‘बहुत’ स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या आधार प्रस्तुत करने वाला संबंधसूचक अव्यय है।
- source_word: κακίαν
  choice: बुराई
  rationale: यहाँ शब्द व्यापक नैतिक बुराई को व्यक्त करता है; ‘दुष्टता’ या ‘दुर्भावना’ अर्थ को अनावश्यक रूप से संकीर्ण कर सकते हैं।
- source_word: ἐδίδαξεν
  choice: सिखाई है
  rationale: यूनानी क्रिया में स्पष्टतः ‘सिखाने’ का रूपक है। हिन्दी पूर्ण वर्तमान इस लोकोक्तिपरक कथन के अब तक प्रमाणित और वर्तमान में प्रासंगिक सत्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ ἀργία
  choice: निकम्मापन
  rationale: ἀργία काम न करने की अवस्था, निष्क्रियता या आलस्य को दर्शाता है। ‘निकम्मापन’ इस ज्ञान-साहित्यिक संदर्भ में व्यापक और सहज है, जबकि ‘आलस्य’ व्यक्ति की प्रवृत्ति पर कुछ अधिक बल देता है।
