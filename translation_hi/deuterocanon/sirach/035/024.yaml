  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण धार्मिक शैली। ‘व्यवस्था’, ‘आज्ञाएँ’ और ‘प्रभु’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्यरचना साधारण पाठकों के लिए स्पष्ट रखी गई है।
