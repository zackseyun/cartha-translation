base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/024.yaml
  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
translation:
  language: hi
  text: जो व्यवस्था पर भरोसा रखता है, वह आज्ञाओं पर ध्यान देता है; और जो प्रभु पर भरोसा रखता है, उसे कम नहीं किया जाएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहाना संस्करण में उपलब्ध काहिरा गनीज़ा की इब्रानी पंक्ति इस पद से असंगत या विकृत प्रतीत होती है। इसलिए मुख्य अनुवाद सुसंगत यूनानी समानांतर पाठ पर आधारित है। इब्रानी पंक्ति का लगभग अर्थ है: “और फिर, यदि जीभ के लिए चंगाई है, तो वह मनुष्यों में नहीं है।”'
    reason: textual_variant
  - marker: b
    text: “उसे कम नहीं किया जाएगा” का अनुवाद “उसे नीचा नहीं किया जाएगा” या, अधिक भावार्थ रूप में, “उसमें कोई कमी नहीं होगी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: जो ... भरोसा रखता है
  rationale: πιστεύω यहाँ केवल बौद्धिक विश्वास नहीं, बल्कि भरोसा और निर्भरता व्यक्त करता है; आधुनिक हिन्दी में यह दोनों खंडों के लिए स्वाभाविक है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: सिराख के यहूदी ज्ञान-साहित्यिक संदर्भ में νόμος तोराह, अर्थात परमेश्वर की दी हुई व्यवस्था, को सूचित करता है।
- source_word: προσέχει
  choice: ध्यान देता है
  rationale: यह προσέχω की सावधानीपूर्वक ध्यान देने की भावना बनाए रखता है और इसे सीधे 'पालन करता है' कहकर अधिक अर्थ नहीं जोड़ता।
- source_word: ἐντολαῖς
  choice: आज्ञाओं
  rationale: धार्मिक और नैतिक संदर्भ में ἐντολή का मानक, स्पष्ट हिन्दी प्रतिरूप।
- source_word: Κυρίῳ
  choice: प्रभु
  rationale: यूनानी κύριος के लिए प्रतिष्ठित और गरिमापूर्ण हिन्दी रूप।
- source_word: οὐκ ἐλαττωθήσεται
  choice: घटाया न जाएगा
  rationale: ἐλαττόω के भावी कर्मवाच्य का निकट रूप, जो घटाए जाने या छोटा किए जाने की वास्तविक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: प्राप्त इब्रानी पंक्ति और इस पद के यूनानी पाठ में असंगति
  choice: मुख्य पाठ में सुसंगत यूनानी समानांतर का अनुवाद किया गया और पाठगत समस्या को पाद-टिप्पणी में स्पष्ट किया गया।
  alternative: 'प्राप्त इब्रानी पंक्ति का अनुवाद: “और फिर, यदि जीभ के लिए चंगाई है, तो वह मनुष्यों में नहीं है।”'
  rationale: दिया गया इब्रानी पाठ इस पद से असंबद्ध या विकृत प्रतीत होता है, जबकि यूनानी पाठ पद-संदर्भ पर एक पूर्ण और सुसंगत वाक्य देता है। स्रोतगत अनिश्चितता छिपाए बिना यूनानी को आधार बनाना उचित है।
- issue: οὐκ ἐλαττωθήσεται का आशय
  choice: घटाया न जाएगा
  alternative: नीचा न किया जाएगा; उसे घटी न होगी
  rationale: शाब्दिक बल और कर्मवाच्य रूप को सुरक्षित रखा गया है; अधिक व्याख्यात्मक अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
