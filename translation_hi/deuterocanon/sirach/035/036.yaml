  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: लगा दे
  rationale: ἐμβάλλω का अओरिस्ट आज्ञार्थक रूप यहाँ εἰς ἐργασίαν के साथ किसी को काम में लगाने का भाव देता है। ‘लगा दे’ स्वाभाविक हिन्दी में आज्ञा का बल बनाए रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मकारक सर्वनाम को प्रसंगानुसार स्वाभाविक हिन्दी में ‘उसे’ कहा गया है।
- source_word: εἰς ἐργασίαν
  choice: काम में
  rationale: ἐργασία का अर्थ काम, श्रम या कार्य है। क्रिया के साथ ‘काम में लगा दे’ हिन्दी का स्वाभाविक और अर्थनिष्ठ मुहावरा है।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα यहाँ उद्देश्य व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में इस प्रयोजनात्मक संबंध को स्पष्ट रखता है।
- source_word: μὴ ἀργῇ
  choice: वह बेकार न बैठे
  rationale: ἀργέω निष्क्रिय या काम के बिना रहने को दर्शाता है। ‘बेकार न बैठे’ इस व्यावहारिक भाव को स्वाभाविक ढंग से व्यक्त करता है और ‘आलसी’ जैसा अधिक प्रबल चरित्र-निर्णय नहीं जोड़ता।
