  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
translation:
  language: hi
  text: दीन जन की प्रार्थना बादलों को पार कर गई है[a]; और जब तक वह निकट न पहुँच जाए, उसे सांत्वना न मिलेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादलों को चीरकर निकल गई है”; यूनानी चित्र में दीन जन की प्रार्थना बिना रुकावट परमेश्वर की उपस्थिति की ओर ऊपर उठती है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में ‘प्रार्थना’ और ‘सांत्वना पाए’ दोनों स्त्रीलिंग हैं; इसलिए वाक्य प्रार्थना को मानवीकृत रूप में प्रस्तुत करता है: “जब तक वह निकट न पहुँचे, उसे सांत्वना न मिलेगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ
  choice: प्रार्थना
  rationale: परमेश्वर से की गई विनती के लिए यह स्वाभाविक और प्रचलित हिन्दी शब्द है।
- source_word: ταπεινοῦ
  choice: दीन जन की
  rationale: यहाँ शब्द विनम्र या सामाजिक रूप से दबे हुए व्यक्ति, दोनों की छाया रख सकता है; ‘दीन जन’ इस व्यापकता को सहज हिन्दी में बनाए रखता है।
- source_word: νεφέλας διῆλθεν
  choice: बादलों को पार कर गई है
  rationale: यह प्रार्थना के निर्बाध रूप से ऊपर उठने की यूनानी काव्यात्मक छवि को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: ἕως συνεγγίσῃ
  choice: जब तक वह निकट न पहुँच जाए
  rationale: निकटतम व्याकरणिक संदर्भ ‘प्रार्थना’ है; स्त्रीलिंग ‘वह’ मूल की संदिग्धता को पूरी तरह समाप्त किए बिना काव्यात्मक प्रवाह बनाए रखता है।
- source_word: οὐ μὴ παρακληθῇ
  choice: उसे सांत्वना न मिलेगी
  rationale: παρακαλέω का कर्मवाच्य यहाँ ‘सांत्वना पाना’ हो सकता है। हिन्दी सर्वनाम जानबूझकर खुला रखा गया है, ताकि वह प्रार्थना या प्रार्थना करने वाले दीन जन की ओर संकेत कर सके।
theological_decisions:
- issue: दूसरे खंड में कर्ता/संदर्भ की अस्पष्टता
  choice: '‘वह’ और ‘उसे’ के द्वारा संदर्भ को खुला रखा गया है: प्रार्थना निकट पहुँचती है, जबकि सांत्वना प्रार्थना अथवा दीन प्रार्थी से संबंधित समझी जा सकती है।'
  alternative: स्पष्ट रूप से कहना कि प्रार्थना निकट पहुँचती है और दीन जन को सांत्वना नहीं मिलती।
  rationale: यूनानी पाठ पहली पंक्ति में प्रार्थना पर केंद्रित है, पर अंतिम कर्मवाच्य क्रिया प्रार्थी की ओर भी मुड़ सकती है। हिन्दी में अस्पष्ट सर्वनाम मूल की काव्यात्मक और धर्मवैचारिक तनाव को बेहतर सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, सहज और काव्यात्मक है। ‘दीन जन’ ने नैतिक विनम्रता और सामाजिक दीनता दोनों की संभावित छाया सुरक्षित रखी है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
