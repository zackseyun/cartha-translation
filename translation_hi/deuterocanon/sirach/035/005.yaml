  text: Renew a sign and repeat a wonder[a]; glorify the hand and strengthen the arm and the right hand.
translation:
  language: hi
  text: चिह्न को नया कर और चमत्कार को दोहरा; हाथ को महिमामय कर और भुजा तथा दाहिने हाथ को बलवान बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חדש אות
  choice: चिह्न को फिर से प्रकट कर
  rationale: חדש का मूल भाव नया करने या नए सिरे से सामने लाने का है। शाब्दिक ‘चिह्न को नया कर’ आधुनिक हिन्दी में अस्वाभाविक होता; ‘फिर से प्रकट कर’ नवीनीकरण और पुनः प्रदर्शन—दोनों भावों को स्वाभाविक ढंग से रखता है।
- source_word: ושנה מופת
  choice: और अद्भुत काम को दोहरा
  rationale: שנה यहाँ किसी कार्य को दूसरी बार करने या दोहराने के अर्थ में है। מופת के लिए ‘अद्भुत काम’ सामान्य पाठक के लिए स्पष्ट है और असाधारण दैवी कार्य का बाइबलीय भाव बनाए रखता है।
- source_word: האדר יד
  choice: हाथ को महिमामय कर
  rationale: האדר महिमा या प्रताप प्रदान करने अथवा उसे प्रकट करने का आदेश है। ‘महिमामय कर’ स्रोत की संक्षिप्त और कुछ असामान्य अभिव्यक्ति को बिना ‘सामर्थ्य दिखा’ जैसे व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ואמץ זרוע וימין
  choice: और भुजा तथा दाहिने हाथ को बलवान बना
  rationale: אמץ को सीधे ‘बलवान बना’ से व्यक्त किया गया है। זרוע और ימין की शारीरिक उपमाएँ ‘भुजा’ और ‘दाहिना हाथ’ के रूप में अलग-अलग रखी गई हैं।
theological_decisions:
- issue: परमेश्वर के सामर्थ्य के लिए मानवरूपी भाषा
  choice: ‘हाथ’, ‘भुजा’ और ‘दाहिना हाथ’ को ज्यों का त्यों बनाए रखना
  alternative: इन सबको ‘सामर्थ्य’ या ‘शक्ति’ कहकर भावानुवाद करना
  rationale: इब्रानी पाठ दैवी कार्य के लिए जानबूझकर शारीरिक बिंबों का प्रयोग करता है। उन्हें अमूर्त शब्दों में बदलने से पाठ की काव्यात्मक और धर्मवैचारिक बनावट सपाट हो जाती।
- issue: इब्रानी और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ का अनुसरण करना
  alternative: यूनानी के लाल मणि, सोने के आभूषण और दाखमधु के भोज में संगीत-सामंजस्य वाले बिंबों का अनुवाद करना
  rationale: यहाँ इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वसनीयता वाला है, जबकि यूनानी पाठ की शब्दावली और विषय-वस्तु काफी भिन्न है। इसलिए मुख्य पाठ इब्रानी पर आधारित है और यूनानी भिन्नता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक आदेश-शैली में है। इब्रानी की संक्षिप्तता तथा ‘हाथ—भुजा—दाहिना हाथ’ की क्रमिक मानवरूपी छवि सुरक्षित रखी गई है; केवल ‘חדש אות’ को स्वाभाविक हिन्दी के लिए ‘चिह्न को फिर से प्रकट कर’ कहा गया है।
