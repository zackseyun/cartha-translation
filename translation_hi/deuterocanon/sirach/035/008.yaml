base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/008.yaml
  text: Sum up your speech[a]; in few words say much[b]. Be like one who knows and yet keeps silent.
translation:
  language: hi
  text: अपनी बात समेटकर कहो[a]; थोड़े शब्दों में बहुत कुछ कहो[b]। ऐसे बनो जैसे कोई जानता है और साथ ही मौन रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का उपलब्ध इब्रानी पाठ कठिन है और कुछ स्थानों पर आंशिक रूप से विकृत जान पड़ता है। सम्भावित अर्थ को पुनः प्राप्त करने के लिए, विशेषकर पहले दो खंडों में, समानांतर यूनानी पाठ का सहारा लिया गया है।
    reason: textual_variant
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘थोड़ी बातों में बहुत-सी बातें’ है; यह कम शब्दों में बहुत कुछ कहने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: השבת ראש / κεφαλαίωσον
  choice: समेटकर कहो
  rationale: प्राप्त इब्रानी पाठ यहाँ कठिन है। यूनानी κεφαλαίωσον का अर्थ बात को उसके मुख्य बिंदु तक लाना या संक्षेप में प्रस्तुत करना है; ‘समेटकर कहो’ इस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פאתי / λόγον
  choice: अपनी बात
  rationale: इब्रानी रूप पाठगत दृष्टि से संदिग्ध है और अकेले लेने पर ‘किनारे’ या ‘कोने’ का अर्थ दे सकता है। यूनानी λόγον यहाँ कथन या बात को सूचित करता है; इसलिए ‘अपनी बात’ प्रसंग के अनुकूल है।
- source_word: ἐν ὀλίγοις πολλά
  choice: थोड़े शब्दों में बहुत कुछ
  rationale: यूनानी में शाब्दिक रूप से ‘थोड़ी बातों में बहुत-सी बातें’ है। हिन्दी में ‘थोड़े शब्दों में बहुत कुछ’ इसी संक्षिप्त वाणी के निर्देश को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: γίνου ὡς γινώσκων
  choice: ऐसे व्यक्ति के समान बनो जो जानता तो है
  rationale: यह अनुवाद आज्ञार्थक तुलना और γινώσκων के ‘जाननेवाला’ अर्थ को बनाए रखता है। ‘तो है’ अगले विरोधात्मक खंड के साथ ज्ञान और संयम का तनाव उभारता है।
- source_word: ἅμα σιωπῶν
  choice: फिर भी मौन रहता है
  rationale: यूनानी पदबंध ज्ञान के साथ-साथ चुप रहने की बात कहता है। ‘फिर भी’ उस अर्थपूर्ण विरोध को स्वाभाविक हिन्दी में सामने लाता है, जबकि ‘मौन रहता है’ गरिमापूर्ण शैली बनाए रखता है।
