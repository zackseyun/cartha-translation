translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘समेटकर कहो’ बोलचाल में सहज है, जबकि ‘मौन रहता है’ पद की ज्ञान-साहित्य संबंधी गरिमा को बनाए रखता है। पाठगत कठिनाई को मुख्य पाठ में अस्वाभाविक इब्रानी शब्दों के शाब्दिक अनुकरण से नहीं, बल्कि स्पष्ट पाद-टिप्पणी द्वारा सुरक्षित रखा गया है।
