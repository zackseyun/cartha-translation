- source_word: ἐν τῇ δόξῃ σου
  choice: अपने सम्मान पर
  rationale: इस नीतिपरक संदर्भ में δόξα का अर्थ सार्वजनिक सम्मान या अच्छा नाम है; ‘पर’ हिन्दी में कलंक की उपमा के साथ स्वाभाविक है।
