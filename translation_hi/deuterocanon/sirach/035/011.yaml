base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/011.yaml
  text: Have mercy on the city of your sanctuary[a], Jerusalem[b], the place established for your dwelling.
translation:
  language: hi
  text: तेरी पवित्रता के नगर[a], यरूशलेम[b], जो तेरे निवास का स्थापित स्थान है, पर दया कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘तेरी पवित्रता का नगर’ है। इसे ‘तेरा पवित्र नगर’ या, अधिक व्याख्यात्मक रूप में, ‘तेरे पवित्रस्थान का नगर’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध यूनानी समानांतर यहाँ बहुत भिन्न है; उसका आशय है कि समय पर उठो, पीछे न रहो, घर जाओ और देर न करो। इस पद का हिब्रू पाठ उपलब्ध होने के कारण मुख्य पाठ में उसी का अनुसरण किया गया है और यूनानी को पाठांतर माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: दया कर
  rationale: यह רחם का आज्ञार्थक रूप है और करुणामय दया की प्रार्थना व्यक्त करता है। ‘दया कर’ आधुनिक हिन्दी में सीधा, स्वाभाविक और प्रार्थनापूर्ण है।
- source_word: קרית קדשך
  choice: अपनी पवित्रता के नगर
  rationale: קרית का अर्थ ‘नगर’ है और קדשך का शाब्दिक अर्थ ‘तेरी पवित्रता’ है। यह रचना हिब्रू के संक्षिप्त संबंधवाचक पदबंध को बनाए रखती है और यह तय नहीं करती कि संकेत पूरे पवित्र नगर की ओर है या उसमें स्थित पवित्रस्थान की ओर।
- source_word: ירושלים
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबिल परंपरा में प्रचलित रूप।
- source_word: מכון שבתך
  choice: तेरे निवास के लिए ठहराया हुआ स्थान
  rationale: מכון किसी स्थिर अथवा स्थापित स्थान को और שבתך तेरे निवास को सूचित करता है। यह अनुवाद दोनों तत्वों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: קדשך में पवित्रता का आशय कितना स्पष्ट किया जाए
  choice: अपनी पवित्रता के नगर
  alternative: अपने पवित्र नगर; अपने पवित्रस्थान के नगर
  rationale: हिब्रू में अमूर्त संबंधवाचक अभिव्यक्ति है। मुख्य पाठ उसे बनाए रखता है, ताकि यरूशलेम की पवित्रता और उसके भीतर परमेश्वर के पवित्रस्थान के बीच निहित अर्थ को अनावश्यक रूप से किसी एक दिशा में सीमित न किया जाए।
- issue: हिब्रू पाठ और अत्यंत भिन्न यूनानी समानांतर के बीच चयन
  choice: मुख्य पाठ में उपलब्ध हिब्रू का अनुसरण
  alternative: शीघ्र उठने और घर जाने के यूनानी पाठ का अनुवाद
  rationale: इस पद के लिए हिब्रू उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए वही मुख्य पाठ का आधार है। सामग्री में बहुत भिन्न यूनानी पाठ को मिलाकर संयुक्त पाठ बनाने के बजाय पाठांतर के रूप में टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण प्रार्थना-शैली में है। एकवचन संबोधन ‘तेरे’ हिब्रू के एकवचन प्रत्ययों के अनुरूप है। ‘अपनी पवित्रता के नगर’ सामान्य हिन्दी में कुछ ऊँचा और संक्षिप्त पदबंध है, पर स्रोत की वास्तविक अस्पष्टता को बचाने के लिए जानबूझकर रखा गया है; अधिक सहज विकल्प पादटिप्पणी में दिए गए हैं।
