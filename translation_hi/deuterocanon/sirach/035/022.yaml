  text: Any wound a living creature may heal[b][a], but there is pain worse than pain.
translation:
  language: hi
  text: हर घायल को जंगली पशु खा जाता है; पर कोई चोट दूसरी चोट से अधिक सुखद होती है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी पाठ कठिन है और सम्भवतः कुछ स्थानों पर क्षतिग्रस्त है। अंतिम शब्द का अधिक शाब्दिक अर्थ ‘सुखद होती है’ जान पड़ता है, यद्यपि कुछ अनुवाद प्रसंगानुमान से इसका उलटा भाव—‘अधिक दुखद’ या ‘बदतर’—देते हैं।
    reason: textual_variant
  - marker: b
    text: स्वीट के यूनानी पाठ में इसके स्थान पर है, “और अपनी सन्तान से सावधान रहो।” यह उपलब्ध इब्रानी पाठ से बहुत भिन्न है और सम्भवतः किसी दूसरे पाठरूप को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כל נכה
  choice: हर घायल
  rationale: נכה यहाँ संज्ञा-सदृश विशेषण के रूप में ‘घायल/आहत व्यक्ति या जीव’ समझा गया है। כל को सामान्य, नीतिवचनात्मक कथन में ‘हर’ से व्यक्त किया गया है।
- source_word: תאכל חיה
  choice: जंगली पशु खा जाता है
  rationale: תאכל स्त्रीलिंग क्रिया है और חיה उसका स्वाभाविक स्त्रीलिंग कर्ता है; इसलिए वाक्य को ‘पशु हर घायल को खाता है’ समझना ‘घाव को चंगा करना’ की अपेक्षा उपलब्ध इब्रानी व्याकरण के अधिक निकट है। חיה के लिए प्रसंगानुकूल ‘जंगली पशु’ चुना गया है।
- source_word: אך
  choice: पर
  rationale: यह संक्षिप्त विरोधसूचक अव्यय है और नीतिवचन के दूसरे खंड की ओर मोड़ दिखाता है।
- source_word: מכה ממכה
  choice: कोई चोट दूसरी चोट से
  rationale: מכה को ‘चोट’ और מן को तुलनात्मक ‘से’ माना गया है। हिन्दी में अर्थ स्पष्ट करने के लिए पुनरुक्ति को ‘एक/दूसरी चोट’ के रूप में स्वाभाविक बनाया गया है।
- source_word: תנעם
  choice: अधिक सुखद होती है
  rationale: रूप को נעם (‘सुखद होना’) से निकला स्त्रीलिंग क्रियारूप माना गया है, जो מכה से मेल खाता है। पाठ कठिन और सम्भवतः क्षतिग्रस्त है, इसलिए इस चौंकाने वाले अर्थ को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में अनिश्चितता बताई गई है।
