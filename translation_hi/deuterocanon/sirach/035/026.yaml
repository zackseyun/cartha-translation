  text: Who will trust an armed troop[a], leaping from city to city?
translation:
  language: hi
  text: एक नगर से दूसरे नगर छलाँग लगाती फिरनेवाली सैनिक टुकड़ी[a] पर कौन भरोसा करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए दिया गया यूनानी समानांतर पाठ पूरी तरह भिन्न है: “समझ लो कि मैंने केवल अपने लिए परिश्रम नहीं किया, बल्कि उन सबके लिए किया है जो शिक्षा की खोज करते हैं।” इसलिए यहाँ प्राथमिक पाठ के रूप में इब्रानी साक्ष्य का अनुसरण किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: מי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम एक आलंकारिक प्रश्न आरम्भ करता है।
- source_word: יאמין
  choice: भरोसा करेगा
  rationale: अमन धातु का हिफ़ील रूप यहाँ किसी पर विश्वास या भरोसा रखने के अर्थ में है, केवल किसी कथन को सच मानने के अर्थ में नहीं।
- source_word: בגדוד צבא
  choice: सैनिक टुकड़ी
  rationale: גדוד किसी दल या सैन्य टुकड़ी को और צבא उसके सैनिक स्वरूप को व्यक्त करता है; संयुक्त हिन्दी पद दोनों का अर्थ स्वाभाविक ढंग से देता है।
- source_word: המדלג
  choice: छलाँग लगाती फिरनेवाली
  rationale: दलג का सजीव मूल अर्थ ‘छलाँग लगाना’ है; ‘फिरनेवाली’ लगातार और अस्थिर आवागमन का प्रसंग स्पष्ट करता है, बिना इसे ‘धावा बोलना’ मान लेने के।
- source_word: מעיר אל עיר
  choice: नगर-नगर
  rationale: यह ‘एक नगर से दूसरे नगर’ की बार-बार होनेवाली गति को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी पाठ और दिए गए यूनानी समानांतर पाठ में पूर्ण भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: ‘समझ लो कि मैंने केवल अपने लिए परिश्रम नहीं किया, बल्कि उन सबके लिए किया है जो शिक्षा की खोज करते हैं।’'
  rationale: इस स्थान पर इब्रानी पाठ उपलब्ध है और परियोजना की पद्धति के अनुसार वही प्राथमिक स्रोत है। यूनानी पाठ को इब्रानी के साथ मिलाकर अर्थ निकालना संभव नहीं, इसलिए उसकी भिन्नता पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण प्रश्न। ‘छलाँग लगाती’ इब्रानी बिंब को बनाए रखता है, जबकि ‘सैनिक टुकड़ी’ גדוד צבא का सहज समतुल्य है।
