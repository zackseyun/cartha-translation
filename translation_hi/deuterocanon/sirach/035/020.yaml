  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कहावती शैली रखी गई है। 'तालू' और दोनों खंडों में 'स्वादों' की पुनरावृत्ति मूल इब्रानी के ठोस रूपक को सुरक्षित रखती है; दूसरे खंड में निहित क्रिया को हिन्दी काव्यात्मक समानांतरता के अनुसार लोपित रखा गया है।
