translation:
  language: hi
  text: 'तालू वाणी के स्वादों को परखता है,

    और हृदय झूठ के स्वादों को समझता है।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तालू कथन का स्वाद परखता है, और विवेकी हृदय झूठ का स्वाद समझता है।” इब्रानी में दोनों पंक्तियों में स्वाद का रूपक दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ यहाँ बहुत भिन्न है: “ठोकर के मार्ग पर मत चलो, और पथरीली जगहों में ठोकर न खाओ।” यह एक प्रमुख पाठांतर है; अनुवाद उपलब्ध इब्रानी पाठ का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: तालू
  rationale: यह इब्रानी शब्द स्वाद ग्रहण करने वाले अंग, अर्थात् तालू, को दर्शाता है; इससे कहावत का इंद्रिय-बिंब बना रहता है।
- source_word: בוחן
  choice: परखता है
  rationale: यह क्रिया जाँचने या परखने का भाव देती है और स्वाद लेकर पहचानने के रूपक के अनुकूल है।
- source_word: מטעמי
  choice: स्वादों को
  rationale: मूल में स्वाद-संबंधी यही पद दोनों खंडों में दोहराया गया है; हिन्दी में भी पुनरावृत्ति रखकर रूपक सुरक्षित रखा गया है।
- source_word: דבר
  choice: वाणी
  rationale: यहाँ एकवचन शब्द का सामूहिक अर्थ बोले गए कथन या वाणी से है; 'वाणी' स्वाभाविक और संक्षिप्त है।
- source_word: לב מבין
  choice: समझदार हृदय
  rationale: शाब्दिक संरचना 'समझने वाला हृदय' है। 'समझदार हृदय' इब्रानी मानव-दृष्टि में हृदय को समझ का केंद्र मानने वाले भाव को बनाए रखता है।
- source_word: כזב
  choice: झूठ
  rationale: यह असत्य या मिथ्या को दर्शाता है। 'झूठ' आधुनिक हिन्दी में सहज है और यहाँ सामूहिक अर्थ में प्रयुक्त है।
