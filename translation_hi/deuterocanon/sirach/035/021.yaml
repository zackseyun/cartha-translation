base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/021.yaml
  text: A devious heart causes grief[b][a], and an experienced man will repay him in kind.
translation:
  language: hi
  text: कुटिल मन दुःख पहुँचाता है,[a][b] और अनुभवी पुरुष उसका उसी प्रकार प्रत्युत्तर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम उपवाक्य कठिन है। इब्रानी का शाब्दिक रूप लगभग यह है: “और अनुभवी पुरुष उसे उसमें/उसके द्वारा/उसके साथ लौटा देगा।” इसका अर्थ “उसका उसी प्रकार प्रत्युत्तर देगा” या “उसे उसके अनुसार लौटा देगा” भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: 'यूनानी समानांतर पाठ इससे बहुत भिन्न है: “ऐसे मार्ग पर भरोसा न कर जिसमें ठोकर न हो।” सम्भव है कि उसके पीछे भिन्न इब्रानी मूलपाठ था या पाठ में विकृति हुई हो।'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: मन
  rationale: इब्रानी ज्ञान-साहित्य में यह भीतरी व्यक्ति, विचार और अभिप्राय को सूचित करता है। आधुनिक हिन्दी में यहाँ ‘मन’ नैतिक और मानसिक दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עקוב
  choice: टेढ़ा
  rationale: यह नैतिक कुटिलता या विकृति का बोध देता है। ‘टेढ़ा’ मूल रूपक को बचाता है और केवल छल-कपट तक अर्थ को सीमित नहीं करता।
- source_word: יתן
  choice: देता है
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है; ‘दुःख देता है’ हिन्दी में स्वाभाविक कारणवाचक अभिव्यक्ति है।
- source_word: עצבת
  choice: दुःख
  rationale: शब्द शोक, पीड़ा या मनस्ताप को सूचित करता है। ‘दुःख’ व्यापक, स्पष्ट और प्रसंगानुकूल है।
- source_word: ואיש
  choice: और ... पुरुष
  rationale: איש पुल्लिंग एकवचन है; स्रोत की लिंग-सूचना बनाए रखने के लिए ‘पुरुष’ रखा गया है।
- source_word: ותיק
  choice: अनुभवी
  rationale: यह परखे हुए, प्रौढ़ या अनुभवी व्यक्ति का बोध देता है। ‘अनुभवी’ आधुनिक औपचारिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ישיבנה
  choice: उसे ... उत्तर देगा
  rationale: שוב का यह रूप लौटाने अथवा प्रत्युत्तर देने का भाव रखता है और स्त्रीलिंग कर्म-प्रत्यय पूर्ववर्ती ‘दुःख/पीड़ा’ की ओर संकेत कर सकता है। ‘उत्तर देगा’ प्रतिउत्तर का भाव रखता है, बिना इसे निश्चित रूप से प्रतिशोध बना देने के।
- source_word: בו
  choice: वैसा ही
  rationale: यह संक्षिप्त सर्वनामयुक्त पद अस्पष्ट है। प्रसंग में अनुरूप या उसी ढंग का प्रत्युत्तर सम्भव है; ‘वैसा ही’ इस पारस्परिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: איש का लिंग-सूचक अनुवाद
  choice: पुरुष
  alternative: व्यक्ति
  rationale: मूल पाठ पुल्लिंग एकवचन प्रयोग करता है। ‘पुरुष’ इस रूप को सुरक्षित रखता है, यद्यपि सूक्ति का सामान्य मानवीय प्रयोग सम्भव है।
- issue: अंतिम उपवाक्य की कठिन सर्वनामात्मक रचना
  choice: उसे वैसा ही उत्तर देगा
  alternative: उसे उसी प्रकार लौटा देगा / उसके साथ वैसा ही व्यवहार करेगा
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त और अर्थ की दृष्टि से अनिश्चित है। मुख्य पाठ प्रत्युत्तर और अनुरूपता का सम्भावित भाव रखता है, पर इसे निश्चित प्रतिशोध या भुगतान के अर्थ में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज सूक्तिपरक रूप। ‘टेढ़ा मन’ मूल नैतिक रूपक को बनाए रखता है; कठिन अंतिम वाक्य की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
