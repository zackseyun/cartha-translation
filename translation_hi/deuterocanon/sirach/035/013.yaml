base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/013.yaml
  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
translation:
  language: hi
  text: अपने पहले के कार्यों की गवाही दे[a], और अपने नाम में दर्शन को शीघ्र स्थापित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति का इब्रानी पाठ कठिन है, विशेषकर वह पद जिसका अनुवाद “शीघ्र” किया गया है। इसके बजाय यूनानी समानांतर पाठ है: “और इन बातों के अतिरिक्त, अपने रचयिता को धन्य कह, जो अपनी अच्छी वस्तुओं से तुझे तृप्त करता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  choice: गवाही दे
  rationale: यह आज्ञार्थक पद शाब्दिक रूप से ‘गवाही देना’ है। हिन्दी में यह स्वाभाविक है और इसके साक्ष्यात्मक भाव को बनाए रखता है।
- source_word: למראש מעשיך
  choice: अपने पहले के कार्यों की
  rationale: למראש का रूप कठिन है, पर מעשיך के साथ यह पहले किए गए या पूर्वकालीन कार्यों की ओर संकेत करता जान पड़ता है। ‘पहले के कार्यों’ से अनिश्चितता को बिना अधिक व्याख्या जोड़े व्यक्त किया गया है।
- source_word: והקם
  choice: और ... स्थापित कर
  rationale: קום के हिफ़ील आज्ञार्थक रूप में खड़ा करने, स्थिर करने या स्थापित करने का कारक भाव है। ‘स्थापित कर’ חזון के साथ उपयुक्त है और इसे निश्चित रूप से ‘पूरा कर’ नहीं बनाता।
- source_word: חזון
  choice: उस दर्शन को
  rationale: חזון का सीधा अर्थ भविष्यदर्शी ‘दर्शन’ है। ‘प्रकाशन’ या ‘भविष्यवाणी’ कहने से अर्थ अधिक निश्चित हो जाता।
- source_word: דברק
  choice: शीघ्र
  rationale: यह पाठ अत्यंत कठिन और संभवतः विकृत है। उपलब्ध व्यंजनों का संबंध चमक या बिजली जैसी तीव्रता से हो सकता है; इसलिए ‘शीघ्र’ एक संयत संभावित अर्थ है, जिसे निश्चित न मानते हुए पादटिप्पणी में कठिनाई स्पष्ट की गई है।
- source_word: בשמך
  choice: अपने नाम में
  rationale: ב उपसर्ग को निकटता से ‘में’ अनूदित किया गया है। हिन्दी में वाक्यांश कुछ असामान्य है, पर मूल इब्रानी का अस्पष्ट वाक्य-संबंध सुरक्षित रहता है; ‘अपने नाम से’ कहने पर साधन का अर्थ अधिक निश्चित हो जाता।
theological_decisions:
- issue: काहिरा गनीज़ा के इब्रानी पाठ और उससे बहुत भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का संयत अनुवाद
  alternative: “और इन बातों के अतिरिक्त, अपने रचयिता को धन्य कह, जो अपनी अच्छी वस्तुओं से तुझे तृप्त करता है।”
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। फिर भी यह पंक्ति कठिन है और यूनानी पाठ पूरी तरह अलग वाक्य देता है; इसलिए वैकल्पिक यूनानी पाठ को पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त प्रार्थनात्मक आज्ञार्थक शैली रखी गई है। परमेश्वर को संबोधित एकवचन रूप ‘दे/कर’ मूल इब्रानी के एकवचन आज्ञार्थक रूपों के अनुरूप है। कठिन इब्रानी को सहज बनाने के लिए उसकी अस्पष्टता हटाई नहीं गई।
