base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/014.yaml
  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: hi
  text: जो तेरी बाट जोहते हैं[a], उन्हें उनका प्रतिफल दे, और तेरे नबी सच्चे सिद्ध हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुझ पर आशा रखते हैं।” इब्रानी क्रिया में बाट जोहने और आशा रखने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “जो प्रभु का भय मानता है, वह शिक्षा पाएगा, और जो भोर में उठते हैं, वे कृपा पाएँगे।” संभवतः यह किसी भिन्न पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: दे
  rationale: נתן के आज्ञार्थक रूप को परमेश्वर से की गई सीधी विनती के रूप में स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: פעלת
  choice: प्रतिफल
  rationale: פעלה का मूल अर्थ काम या कार्य हो सकता है, पर यहाँ परमेश्वर की बाट जोहने वालों के लिए मिलने वाले फल या प्रत्युत्तर का भाव अधिक संभावित है। ‘प्रतिफल’ इस अर्थ को गरिमापूर्ण और संक्षिप्त रूप में रखता है।
- source_word: קוויך
  choice: जो तेरी बाट जोहते हैं
  rationale: קוה में प्रतीक्षा और आशा, दोनों का भाव है। ‘बाट जोहते हैं’ अपेक्षापूर्ण प्रतीक्षा को मुख्य पाठ में रखता है; ‘तुझ पर आशा रखते हैं’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ונביאיך
  choice: और तेरे नबी
  rationale: समुच्चयबोधक के साथ संज्ञा और द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा अनुवाद है।
- source_word: יאמנו
  choice: सच्चे सिद्ध हों
  rationale: אמן का यह रूप नबियों के कथन या विश्वसनीयता के प्रमाणित होने का भाव दे सकता है। ‘सच्चे सिद्ध हों’ सत्यता और पुष्टि, दोनों को व्यक्त करता है, बिना इसे केवल व्यक्तिगत निष्ठा तक सीमित किए।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: 'मुख्य पाठ में इब्रानी विनती का अनुसरण किया गया है: परमेश्वर से बाट जोहने वालों को प्रतिफल देने और उसके नबियों को सच्चा सिद्ध करने की प्रार्थना।'
  alternative: 'यूनानी पाठ का अर्थ है: ‘जो प्रभु का भय मानता है, वह शिक्षा पाएगा, और जो भोर को उठते हैं, वे कृपा पाएँगे।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी पाठ शब्दशः समानांतर नहीं है और संभवतः भिन्न पाठ-रूप को दर्शाता है; महत्त्वपूर्ण अंतर को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधन में एकवचन आत्मीय रूप ‘तेरी’ अपनाया गया है। ‘बाट जोहना’ प्रतीक्षा और भरोसे की संयुक्त छाया देता है, जबकि ‘सच्चे सिद्ध हों’ नबियों के सत्यापित या विश्वसनीय ठहरने की अर्थगत गुंजाइश बनाए रखता है।
