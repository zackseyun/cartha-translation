base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/010.yaml
  text: Have mercy on the people called by your name[a], on Israel, your firstborn[c][b], whom you acquired.
translation:
  language: hi
  text: तेरे नाम से पुकारे जाने वाली प्रजा पर दया कर[a]—इस्राएल पर, जिसे तूने पहलौठा कहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन लोगों पर जो तेरा नाम धारण करते हैं।’ यह इब्रानी मुहावरा परमेश्वर से संबंध और उसके नाम से पहचाने जाने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: स्वीट के यूनानी पाठ में यहाँ एक सर्वथा भिन्न पंक्ति है, जो अलग पाठ-परंपरा को दर्शाती है; यहाँ उपलब्ध इब्रानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: दया कर
  rationale: आज्ञार्थक क्रिया प्रार्थना में करुणापूर्ण हस्तक्षेप की विनती करती है। ‘दया कर’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: עם
  choice: लोगों
  rationale: यह सामूहिक अर्थ वाला एकवचन है। हिन्दी में ‘लोगों’ सहज है और अगले वाक्यांश द्वारा उनकी पहचान परमेश्वर के नाम से जुड़ी हुई बताई जाती है।
- source_word: נקרא בשמך
  choice: अपने नाम से पुकारे जानेवाले
  rationale: यह इब्रानी मुहावरा परमेश्वर के नाम से पहचाने जाने और उससे संबंध रखने का भाव देता है। अनुवाद मुहावरे की बाइबिलीय प्रतिध्वनि को बनाए रखता है।
- source_word: ישראל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בכור
  choice: अपना पहलौठा
  rationale: शब्द का अर्थ ‘पहलौठा’ है। प्रसंग में इस्राएल को संबोधित परमेश्वर की उपाधि का संबंधसूचक भाव हिन्दी में ‘अपना’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: כניתָה
  choice: कहा है
  rationale: 'प्रदत्त इब्रानी पाठ में रूप כניתה, धातु כנה (‘नाम देना, उपाधि देना, कहना’) से समझा जाता है: ‘जिसे तूने पहलौठा कहा/नाम दिया।’ इसलिए परामर्शी अंग्रेज़ी की ‘acquired’ व्याख्या के बजाय मूल इब्रानी रूप को प्राथमिकता दी गई है।'
theological_decisions:
- issue: ‘तेरे नाम से पुकारे गए’ में वाचा-संबंधी पहचान
  choice: इब्रानी मुहावरे को ‘अपने नाम से पुकारे जानेवाले’ के रूप में बनाए रखा
  alternative: ‘जो तेरे हैं’
  rationale: गतिशील विकल्प संबंध का अर्थ स्पष्ट करता, पर नाम से पहचाने जाने की मूल छवि और उसका धर्मवैचारिक भार घटा देता।
- issue: כניתָה और ‘पहलौठा’ का संबंध
  choice: ‘जिसे तूने अपना पहलौठा कहा है’
  alternative: ‘तेरा पहलौठा, जिसे तूने प्राप्त किया’
  rationale: प्रदत्त व्यंजन-पाठ כניתה को כנה से पढ़ना वाक्य-विन्यास और ज्ञात सिराखी पंक्ति के अनुकूल है। ‘प्राप्त किया’ के लिए अपेक्षित קניתה भिन्न आरंभिक अक्षर वाला रूप होगा; इसलिए उस अर्थ को मूल पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ अपनाया गया है। मुख्य अनुवाद में इब्रानी כניתה को मूलाक्षर के अनुसार ‘कहा/उपाधि दी’ समझा गया है, न कि परामर्शी अंग्रेज़ी के ‘acquired’ अर्थ में।
