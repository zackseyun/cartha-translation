    issue: “अपने अंतिम समय में” restricts אַחֲרִיתֶךָ.
    rationale: אַחֲרִיתֶךָ may refer not only to one’s final time of life but also to one’s end, future, or ultimate outcome. A less specific Hindi expression preserves the source ambiguity.
  - severity: low
    issue: “उससे लिपटे रहो” is overly physical in contemporary Hindi.
    rationale: Although it can convey attachment, it readily evokes literal bodily clinging. “उसे थामे रहो” communicates resolute adherence more naturally without weakening the imperative.
