base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/003.yaml
  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: hi
  text: उसे थामे रहो और उससे दूर न हटो, ताकि अंत में तुम महान बनो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि अंत में तुम बढ़ो।” हिब्रू में “बढ़ना/महान होना” है, जबकि यूनानी समानांतर पाठ में “बढ़ाया जाना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדָּבֵק
  choice: लिपटे रहो
  rationale: דבק निकटता से जुड़े रहने और दृढ़ निष्ठा का भाव देता है। आज की स्वाभाविक हिन्दी में “लिपटे रहो” इस प्रबल संबंधपरक आग्रह को बनाए रखता है; यूनानी κολλήθητι भी निकटता से जुड़ने का समर्थन करता है।
- source_word: בּוֹ
  choice: उससे
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती संदर्भ में परमेश्वर की ओर संकेत करता है। “उससे” हिन्दी में व्यक्तिगत संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: וְאַל תָּסוּר
  choice: और उससे दूर न हटो
  rationale: סור का अर्थ हटना, फिरना या दूर होना हो सकता है। यहाँ “दूर न हटो” परमेश्वर के प्रति संबंधपरक और नैतिक स्थिरता दोनों को व्यक्त करता है; यूनानी μὴ ἀποστῇς भी दूर न होने के भाव की पुष्टि करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम बताने वाला संयोजक है; “ताकि” आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: תִּגְדַּל
  choice: तुम महान बनो
  rationale: גדל का मूल अर्थ बढ़ना या महान होना है। सक्रिय हिब्रू रूप और यूनानी ‘बढ़ाए जाओ’ के बीच मौजूद सूक्ष्म तनाव को ध्यान में रखते हुए “महान बनो” मूल के निकट रहता है और ‘ऊँचे उठाए जाने’ की व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: בְּאַחֲרִיתֶךָ
  choice: अपने अंतिम समय में
  rationale: אַחֲרִית अंत, बाद का समय या अंतिम परिणाम सूचित कर सकता है। “अपने अंतिम समय में” इस अंतिम-परिणाम संबंधी अर्थ को बनाए रखता है, बिना इसे केवल सांसारिक भविष्य या स्पष्ट परलोक तक सीमित किए।
theological_decisions:
- issue: पुल्लिंग सर्वनाम का संदर्भ
  choice: “उससे” को परमेश्वर के संदर्भ में रखा गया है।
  alternative: इसे बुद्धि या शिक्षा का अधिक सामान्य संदर्भ माना जा सकता है।
  rationale: आसपास का प्रसंग प्रभु पर भरोसा रखने और उसके प्रति बने रहने का आग्रह करता है; हिब्रू और यूनानी दोनों नए पूर्वपद के बिना पुल्लिंग एकवचन सर्वनाम रखते हैं।
- issue: अंतिम उपवाक्य में प्रतिज्ञा का स्वरूप
  choice: “महान बनो” द्वारा अंतिम परिणाम में वृद्धि या महानता की व्यापक प्रतिज्ञा रखी गई है।
  alternative: “ऊँचे उठाए जाओ,” “बढ़ो,” या “समृद्ध होओ।”
  rationale: हिब्रू גדל बढ़ने अथवा महान होने और यूनानी αὐξηθῇς बढ़ाए जाने का अर्थ दे सकता है। अनुवाद भौतिक समृद्धि, सामाजिक सम्मान या दैवी उत्कर्ष में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “लिपटे रहो” दृढ़ व्यक्तिगत निष्ठा को जीवंत रूप में व्यक्त करता है। “अंतिम समय” जानबूझकर इतना व्यापक है कि जीवन के अंतिम चरण और अंतिम परिणाम—दोनों की संभावित छाया बनी रहे।
