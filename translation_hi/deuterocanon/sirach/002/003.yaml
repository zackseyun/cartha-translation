review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the masculine singular pronominal reference, the injunction not to depart, the purposive clause, and the broad sense of גדל as becoming/growing great. However, “अपने अंतिम समय में” narrows אַחֲרִיתֶךָ primarily to a chronological final period, whereas the Hebrew can denote one’s end or ultimate outcome. “अंत में” better preserves this breadth.
  naturalness: “लिपटे रहो” can sound physically literal in modern Hindi. “उसे थामे रहो” is more idiomatic in an exhortative religious register while conveying steadfast attachment. “अंत में” is also more natural and less restrictive than “अपने अंतिम समय में.”
  terminology: No doctrinally loaded terminology is introduced. The implicit divine referent should remain implicit in the translation, as it is in the Hebrew, while the contextual reference may be noted in translation rationale. The footnote appropriately records the Hebrew/Greek lexical difference, with wording adjusted for natural Hindi.
  issues:
