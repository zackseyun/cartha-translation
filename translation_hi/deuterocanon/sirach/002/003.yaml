revisions:
- from: उससे लिपटे रहो और उससे दूर न हटो, ताकि अपने अंतिम समय में तुम महान बनो।[a]
  to: उसे थामे रहो और उससे दूर न हटो, ताकि अंत में तुम महान बनो।[a]
  rationale: The revision improves modern Hindi idiom and preserves the semantic range of the Hebrew. “उसे थामे रहो” renders the call to steadfast attachment without the physical connotation of “लिपटे रहो.” “अंत में” leaves open both the temporal and ultimate-outcome senses of אַחֲרִיתֶךָ. The rendering “तुम महान बनो” retains the Hebrew’s broad growth/greatness sense and does not impose a specific interpretation such as material prosperity or exaltation.
  reviewer_model: gpt-5.6-terra
