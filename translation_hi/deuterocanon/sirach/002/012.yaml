  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: hi
  text: हाय कायर हृदयवालों और शिथिल हाथवालों पर, और उस पापी पर जिसके मार्ग टेढ़े हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, “टेढ़े मार्गोंवाला दुष्ट/पापी।” यूनानी पाठ में है, “वह पापी जो दो मार्गों पर चलता है,” जो संभवतः विभाजित या कपटपूर्ण आचरण का भाव देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: धिक्कार है
  rationale: यह शोक और दंडसूचक चेतावनी का उद्गार है; ‘धिक्कार है’ ज्ञान-साहित्य की गंभीर चेतावनी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְרַכֵּי לֵב
  choice: कायर मनवालों
  rationale: शाब्दिक भाव ‘कोमल/दुर्बल हृदय’ है, पर यहाँ करुणाशीलता नहीं बल्कि भय और साहस की कमी अभिप्रेत है; यूनानी δειλαῖς भी कायरता की पुष्टि करता है।
- source_word: וּרְפֵה יָדָיִם
  choice: ढीले हाथों
  rationale: मूल की ठोस शारीरिक छवि को रखा गया है; यह शक्ति, तत्परता या संकल्प की कमी का मुहावरा है।
- source_word: וְלָרָשָׁע
  choice: और उस पापी पर
  rationale: רשע का अर्थ ‘दुष्ट’ भी हो सकता है, जबकि यूनानी समानांतर ἁμαρτωλῷ ‘पापी’ का समर्थन करता है।
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: जिसके मार्ग टेढ़े हैं
  rationale: यह विद्यमान इब्रानी पाठ के ‘टेढ़े/विकृत मार्गोंवाला’ अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है, बिना यूनानी के ‘दो मार्गों’ को चुपचाप मुख्य पाठ में स्थापित किए।
theological_decisions:
- issue: इब्रानी के अंतिम पदांश और यूनानी समानांतर के बीच अंतर
  choice: मुख्य पाठ में ‘जिसके मार्ग टेढ़े हैं’
  alternative: ‘जो दो मार्गों पर चलता है’
  rationale: उच्च-विश्वसनीयता वाले विद्यमान इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी पाठ दो मार्गों पर चलने, अर्थात विभाजित या कपटपूर्ण आचरण, का अर्थ देता है; इस वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, ज्ञान-साहित्य के अनुरूप स्वर। ‘कायर मन’ और ‘ढीले हाथ’ मूल की समानांतर ठोस छवियों को रखते हैं; अंतिम पदांश में इब्रानी को मुख्य पाठ और यूनानी पाठांतर को टिप्पणी में दिया गया है।
