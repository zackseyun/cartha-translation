  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: hi
  text: अपना हृदय तैयार कर और दृढ़ हो जा; विपत्ति के दिन घबरा मत।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में है: “क्लेश के समय जल्दबाज़ी मत कर।” हिब्रू पाठ घबराने या व्याकुल होने से मना करता है, जबकि यूनानी पाठ संकट के समय जल्दबाज़ी न करने पर बल देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  choice: तैयार कर
  rationale: हिफ़ील रूप का अर्थ तैयार करना, स्थिर करना या व्यवस्थित करना हो सकता है। यहाँ ‘अपना हृदय तैयार कर’ स्वाभाविक हिन्दी में आंतरिक तैयारी और संकल्प, दोनों को व्यक्त करता है; यूनानी εὐθυνον में हृदय को सीधा करने या सही दिशा देने की छाया भी है।
- source_word: לִבְּךָ
  choice: अपना हृदय
  rationale: हिब्रू में ‘हृदय’ विचार, इच्छा और संकल्प सहित भीतरी मनुष्य को दर्शाता है। हिन्दी का बाइबलीय मुहावरा ‘हृदय’ इस व्यापकता को बनाए रखता है।
- source_word: וְהִתְחַזֵּק
  choice: दृढ़ हो जा
  rationale: रूप में आत्मवाचक भाव है—अपने को मजबूत करना या दृढ़ बने रहना। ‘दृढ़ हो जा’ बल, साहस और धीरज को संक्षेप में व्यक्त करता है तथा यूनानी καρτέρησον के धीरजपूर्ण स्थिरता के भाव से भी मेल खाता है।
- source_word: וְאַל תִּבָּהֵל
  choice: घबरा मत
  rationale: בהל भय से व्याकुल, चकित या आतंकित होने को दर्शाता है। आधुनिक हिन्दी में ‘घबरा मत’ इस चेतावनी को सीधा और स्वाभाविक रूप देता है।
- source_word: בְּיוֹם אֵד
  choice: विपत्ति के दिन
  rationale: यह मूल हिब्रू के ‘विपत्ति/विनाश के दिन’ को निकटता से रखता है। ‘दिन’ किसी विशेष तारीख के बजाय संकट के अवसर या काल को भी दर्शा सकता है।
theological_decisions:
- issue: अंतिम उपवाक्य में हिब्रू और यूनानी पाठ का संबंध
  choice: 'मुख्य पाठ में हिब्रू के अनुसार भय से व्याकुल न होने की चेतावनी: ‘घबरा मत।’'
  alternative: 'यूनानी के अनुसार: ‘क्लेश के समय उतावली मत कर।’'
  rationale: उपलब्ध और उच्च-विश्वसनीयता वाले हिब्रू पाठ को मुख्य आधार बनाया गया है। यूनानी पाठ संकट में जल्दबाज़ी न करने पर बल देता है; यह हिब्रू के भाव से संबंधित है, पर बिल्कुल समान नहीं। इसलिए इस वास्तविक भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन और सीधे आज्ञार्थक रूप रखे गए हैं। भाषा सरल, गरिमापूर्ण और मौखिक पाठ के लिए सहज है; ‘हृदय’ मूल बाइबलीय मुहावरे को सुरक्षित रखता है।
