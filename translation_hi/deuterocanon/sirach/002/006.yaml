  yaml_path: translation/deuterocanon/sirach/002/006.yaml
  text: Trust in him[a], and he will uphold you; make your ways straight[b], and hope in him.
translation:
  language: hi
  text: उसी पर भरोसा रखो[a], और वह तुम्हें सहारा देगा; अपने मार्ग सीधे करो[b], और उसी पर आशा रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पर विश्वास करो” अथवा “उस पर आस्था रखो।” इब्रानी और यूनानी में केवल मन से किसी बात को सच मानना नहीं, बल्कि भरोसे के साथ उस पर निर्भर रहना भी व्यक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी और यूनानी के आज्ञार्थ रूप के अनुसार: “अपने मार्ग सीधे करो।” कुछ अनुवाद इसे प्रतिज्ञा के रूप में लेते हैं: “वह तुम्हारे मार्ग सीधे करेगा” या “वह तुम्हें सही मार्ग दिखाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֵן / πίστευσον
  choice: उस पर भरोसा रखो
  rationale: इब्रानी हिफ़ील आज्ञार्थ और यूनानी समानांतर दोनों केवल किसी बात को सच मानने के बजाय भरोसे के साथ उस पर निर्भर रहने का भाव व्यक्त कर सकते हैं। आधुनिक हिन्दी में “भरोसा रखो” यह भाव स्वाभाविक रूप से देता है।
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: वह तुम्हें सँभाले रखेगा
  rationale: इब्रानी पदबंध और यूनानी क्रिया किसी को थामने, सहारा देने या उसकी सहायता करने का भाव रखते हैं। “सँभाले रखेगा” निरंतर सहारे का रूपक बचाता है और सामान्य हिन्दी में सहज है।
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: अपने मार्ग सीधे करो
  rationale: इब्रानी और यूनानी दोनों में क्रिया आज्ञार्थ है और “तुम्हारे मार्ग” उसका कर्म है। इसलिए इसे श्रोता को दिए गए आदेश के रूप में रखा गया है, न कि परमेश्वर के कार्य की प्रतिज्ञा के रूप में।
- source_word: אָרְחוֹתֶיךָ / ὁδούς σου
  choice: अपने मार्ग
  rationale: दोनों स्रोत जीवन के आचरण और दिशा के लिए मार्ग का परिचित रूपक प्रयोग करते हैं। “अपने मार्ग” हिन्दी के ज्ञान-साहित्य की शैली में स्वाभाविक और व्यापक है।
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: और उस पर आशा रखो
  rationale: इब्रानी क्रिया में प्रतीक्षा और आशा दोनों का भाव हो सकता है, जबकि यूनानी समानांतर आशा के अर्थ को स्पष्ट करता है। “उस पर आशा रखो” संयुक्त साक्ष्य और व्यक्ति पर टिके भरोसे को व्यक्त करता है।
theological_decisions:
- issue: मध्य उपवाक्य का कर्ता और विधा
  choice: 'इसे पाठक को दी गई आज्ञा के रूप में अनूदित किया गया है: “अपने मार्ग सीधे करो।”'
  alternative: 'कुछ अनुवाद इसे परमेश्वर के विषय में प्रतिज्ञा मानते हैं: “वह तुम्हारे मार्ग सीधे करेगा/तुम्हें सही मार्ग दिखाएगा।”'
  rationale: इब्रानी יַשֵּׁר और यूनानी εὐθύνας इस संदर्भ में आज्ञार्थ रूप हैं और आसपास की आज्ञाओं की शृंखला को आगे बढ़ाते हैं। अतः पाठक को संबोधन बनाए रखना स्रोत-साक्ष्य के अधिक निकट है; वैकल्पिक परंपरागत पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ज्ञान-साहित्य के अनुरूप रखी गई है। “मार्ग” जीवन-आचरण का रूपक सुरक्षित रखता है; “सँभाले रखेगा” सहारा देने के मूल बिंब को सहज हिन्दी में व्यक्त करता है।
