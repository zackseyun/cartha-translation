review_pass:
  verdict: revise
  source_fidelity: 'The three imperatives and intervening promise are correctly represented: trust in him; he will support/uphold you; make your paths straight; and hope in him. The draft correctly retains the middle clause as an imperative addressed to the reader, in agreement with the Hebrew and Greek. However, footnote a gives “उसकी बात मानो” (“obey what he says”), which is not a suitable lexical alternative for הַאֲמֵן בּוֹ / πίστευσον αὐτῷ in this construction; it introduces obedience rather than trust or faith.'
  naturalness: The main text is clear, dignified, and natural modern Hindi. “सहारा देगा” is slightly more direct and idiomatic than “सँभाले रखेगा” while retaining the supporting sense of the source. “उसी पर आशा रखो” gives the final exhortation a natural emphatic connection to the preceding reference.
  terminology: “भरोसा रखो,” “मार्ग,” and “आशा रखो” appropriately sustain the wisdom-literature register. The revised footnote avoids conflating faith/trust with obedience. No doctrinal interpretation is added.
  issues:
  - severity: medium
    issue: Footnote a offers “उसकी बात मानो” as an alternative.
    rationale: The source expression means trust/believe/have faith in the person, not obey that person’s words. The proposed alternative changes the semantic domain and should be removed.
  - severity: low
    issue: “सँभाले रखेगा” somewhat over-specifies continuing preservation.
    rationale: The Hebrew and Greek express taking hold in support, helping, or upholding. “सहारा देगा” is a more direct Hindi rendering without implying a durative nuance.
