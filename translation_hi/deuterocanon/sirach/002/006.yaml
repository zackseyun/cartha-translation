revisions:
- from: उस पर भरोसा रखो[a], और वह तुम्हें सँभाले रखेगा; अपने मार्ग सीधे करो[b] और उस पर आशा रखो।
  to: उसी पर भरोसा रखो[a], और वह तुम्हें सहारा देगा; अपने मार्ग सीधे करो[b], और उसी पर आशा रखो।
  rationale: The revision preserves the source sequence and imperative force while correcting the inaccurate lexical alternative in footnote a. It also uses a more direct Hindi equivalent for divine support. The alternative reading of the middle clause remains in the footnote because it is interpretively attested, while the main text follows the Hebrew and Greek imperative forms.
