base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/009.yaml
  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: hi
  text: हे याहवे का भय मानने वालो, भलाई[a], सदा के आनंद और दया[b] की आशा रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘अच्छी वस्तुओं’ का बहुवचन है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का अनुवाद ‘अटल प्रेम’ या ‘कृपालुता’ भी किया जा सकता है; यूनानी समानांतर में भी ‘दया’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: हे याहवे का भय माननेवालो
  rationale: यह बहुवचन संबोधन है। ‘हे ... माननेवालो’ उपदेशात्मक प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: קַוּוּ
  choice: आशा रखो
  rationale: आज्ञार्थक क्रिया में प्रतीक्षापूर्ण भरोसे का भाव है। ‘आशा रखो’ इब्रानी और यूनानी समानांतर, दोनों के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לְטוֹב
  choice: भलाई
  rationale: इब्रानी में एकवचन/समष्टिवाचक ‘भला’ है। ‘भलाई’ इसके व्यापक और अनिर्दिष्ट सकारात्मक अर्थ को सुरक्षित रखता है; यूनानी का बहुवचन पादटिप्पणी में दिया गया है।
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: सदा के आनंद
  rationale: यह अनवरत या चिरस्थायी आनंद को व्यक्त करता है। ‘सदा के आनंद’ आधुनिक हिन्दी में स्वाभाविक है और עוֹלָם की कालगत व्यापकता को किसी अतिरिक्त दार्शनिक अर्थ से सीमित नहीं करता।
- source_word: וָחֶסֶד
  choice: और करुणा
  rationale: חֶסֶד में दया, कृपालुता और अटल प्रेम के अर्थ संभव हैं। इस आशीष-सूची में ‘करुणा’ स्वाभाविक है और यूनानी ἐλέους से भी मेल खाता है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को नाम के रूप में प्रस्तुत किया गया है; यूनानी समानांतर का Κύριον आदरसूचक प्रतिस्थापन है।
- issue: प्रमुख पाठ-साक्ष्य का चयन
  choice: उपलब्ध इब्रानी पाठ को प्रमुख मानकर यूनानी समानांतर से जाँच
  alternative: केवल यूनानी के आधार पर ‘अच्छी वस्तुओं’ का बहुवचन
  rationale: इस पद का इब्रानी पाठ उपलब्ध और अर्थ की दृष्टि से स्थिर है। यूनानी मूल भाव की पुष्टि करता है, पर ‘भला/भलाई’ के वचन-संबंधी सूक्ष्म अंतर को मुख्य पाठ में इब्रानी के अनुसार रखा गया है।
- issue: חֶסֶד की अर्थ-व्याप्ति
  choice: करुणा
  alternative: अटल प्रेम अथवा कृपालुता
  rationale: संदर्भ किसी एक वाचा-संबंधी तकनीकी अर्थ को अनिवार्य नहीं करता। इसलिए मुख्य पाठ में ‘करुणा’ रखा गया है और व्यापक अर्थ-क्षेत्र पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष संबोधन और आज्ञार्थक शैली मूल पाठ के उपदेशात्मक स्वर को बनाए रखते हैं।
