translation:
  language: hi
  text: क्योंकि यहोवा करुणामय और अनुग्रहकारी है; वह पापों को क्षमा करता और संकट के समय बचाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם
  choice: करुणामय
  rationale: यह शब्द दया और गहरी करुणा के भाव को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: ईश्वर द्वारा अनुग्रह दिखाने के अर्थ को बनाए रखता है और רָחוּם से उसका भेद भी स्पष्ट करता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לַעֲוֹנוֹת
  choice: पापों को
  rationale: बहुवचन संज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में दोषपूर्ण कर्मों और अपराधों का व्यापक नैतिक अर्थ है।
- source_word: בְּעֵת צָרָה
  choice: संकट के समय
  rationale: समय-सूचक संरचना और צרה के विपत्ति अथवा क्लेश के भाव को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल इब्रानी में יהוה है; इसलिए व्यक्तिगत नाम को स्पष्ट रखना स्रोत-पाठ के अधिक निकट है।
- issue: עֲוֹנוֹת का अर्थ
  choice: पापों
  alternative: अधर्मों / अपराधों
  rationale: ‘पापों’ सामान्य पाठक के लिए स्वाभाविक है और यूनानी समानांतर ἁμαρτίας से भी मेल खाता है, यद्यपि इब्रानी शब्द में दोष या कुटिलता की छाया भी हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। समानांतर विशेषणों तथा दोनों क्रियाओं की संरचना सुरक्षित रखी गई है।
