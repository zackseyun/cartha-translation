base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: hi
  text: हाय तुम पर, जिन्होंने आशा खो दी है[a]! जब यहोवा निरीक्षण करने आएगा[b], तब तुम क्या करोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘जिन्होंने धीरज खो दिया है’ या ‘जिन्होंने सहनशीलता खो दी है’ है; इब्रानी पाठ में ‘आशा’ है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द यहोवा के ध्यान देने, निरीक्षण करने और निर्णायक रूप से कार्य करने को दर्शा सकता है; इस प्रसंग में उसका संकेत न्याय की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: हाय तुम पर
  rationale: यह शोक और धमकी—दोनों का भाव रखने वाला उद्गार है; यह रूप चेतावनी की भविष्यद्वक्तापूर्ण तीव्रता बनाए रखता है।
- source_word: אוֹבְדֵי תִּקְוָה
  choice: जिन्होंने आशा खो दी है
  rationale: इब्रानी पदबंध का स्वाभाविक अर्थ उन लोगों से है जिनकी आशा जाती रही है। यूनानी समानांतर में ‘धीरज खो चुके’ है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: यह इब्रानी शब्द का सामान्य और इस ज्ञान-साहित्यिक प्रसंग में स्वाभाविक हिन्दी अर्थ है।
- source_word: פְקוֹד
  choice: हस्तक्षेप करेगा
  rationale: פקד से बना रूप परमेश्वर के ध्यान देने, निरीक्षण करने अथवा निर्णायक रूप से कार्य करने को सूचित कर सकता है। ‘हस्तक्षेप’ इसके व्यापक अर्थ को रखता है, जबकि चेतावनीपूर्ण प्रसंग न्याय का संकेत देता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: मूल पाठ में आए चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा स्पष्ट रूप से प्रस्तुत किया गया है।
theological_decisions:
- issue: क्या अंतिम पदबंध को स्पष्ट रूप से दंड के अर्थ में अनूदित किया जाए
  choice: जब यहोवा हस्तक्षेप करेगा
  alternative: जब यहोवा दंड देगा
  rationale: इब्रानी פקד यहाँ भयावह संदर्भ में है, पर उसका अर्थ केवल दंड तक सीमित नहीं है। चुना हुआ अनुवाद दिव्य हस्तक्षेप की व्यापकता बनाए रखता है और प्रसंग को उसके न्यायसूचक बल को व्यक्त करने देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाय तुम पर’ चेतावनी की तीव्रता रखता है, और ‘हस्तक्षेप करेगा’ मूल शब्द की व्यापकता को बिना सीधे ‘दंड’ ठहराए व्यक्त करता है।
