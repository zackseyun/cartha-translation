lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: जो याहवे का भय मानते हैं
  rationale: यह स्वाभाविक हिन्दी में इब्रानी की उस विशेषता को बनाए रखता है जिसमें ये लोग याहवे का भय मानने वाले हैं। “भय मानना” बाइबिल की परिचित अभिव्यक्ति है और इसे केवल “आदर करना” कहकर हल्का नहीं करता।
- source_word: יָכִינוּ לְבָבָם
  choice: वे अपने हृदयों को तैयार करेंगे
  rationale: हिफ़ील रूप यहाँ तैयार करने या तत्पर करने का भाव देता है; यूनानी ἑτοιμάσουσιν भी इसकी पुष्टि करता है। “हृदय” भीतरी इच्छा और विचार के बाइबिलीय रूपक को सुरक्षित रखता है।
- source_word: וּלְפָנָיו
  choice: और उसके सामने
  rationale: यह इब्रानी का सीधा और स्वाभाविक रूपांतरण है तथा परमेश्वर की उपस्थिति में अपनाई गई मुद्रा को व्यक्त करता है।
- source_word: יַכְנִיעוּ רוּחָם
  choice: अपनी आत्माओं को दीन करेंगे
  rationale: मुख्य पाठ इब्रानी רוּחַ को स्पष्ट रूप से बनाए रखता है और उसे केवल “अपने आपको दीन करेंगे” बनाकर समतल नहीं करता। बहुवचन हिन्दी में प्रत्येक व्यक्ति की आत्मा का आशय सहज रूप से प्रकट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम है; “याहवे” उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: רוּחָם और यूनानी ψυχὰς के बीच पाठगत-मानवशास्त्रीय भिन्नता
  choice: इब्रानी के अनुसार “अपनी आत्माओं”
  alternative: यूनानी के अनुसार “अपने प्राणों”
  rationale: उपलब्ध इब्रानी साक्ष्य को मुख्य पाठ में प्राथमिकता दी गई है। यूनानी समानांतर का अलग शब्द पाद-टिप्पणी में रखा गया है, ताकि भिन्नता मिटाई न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “भय मानते हैं,” “हृदयों” और “दीन करेंगे” जैसी बाइबिलीय अभिव्यक्तियाँ मूल की काव्यात्मक-सापेक्ष औपचारिकता को बनाए रखती हैं।
