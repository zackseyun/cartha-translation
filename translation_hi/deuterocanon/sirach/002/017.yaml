  verdict: revise
  source_fidelity: The draft correctly renders the divine name, the fear-of-Yahweh idiom, preparation of the heart, and the posture before him. However, it renders Hebrew רוּחָם ('their spirit') as 'अपनी आत्माओं' (their souls), thereby obscuring the explicit Hebrew–Greek lexical difference which its footnote intends to preserve. The Hebrew noun is singular with a plural suffix, so distributive singular Hindi is preferable.
  naturalness: The verse is generally readable and appropriately elevated. 'अपनी आत्माओं को दीन करेंगे' is less natural in modern Hindi and, in addition to the lexical issue, the plural sounds unnecessarily heavy. 'अपनी आत्मा को नम्र करेंगे' is clearer and idiomatic in a formal biblical register.
  terminology: ‘याहवे,’ ‘भय मानते हैं,’ and ‘हृदयों’ appropriately preserve the biblical register. The main-text term must distinguish Hebrew 'spirit' from the Greek parallel's 'souls'; using singular ‘आत्मा’ for the Hebrew and ‘प्राणों’ in the note maintains the documented textual contrast without over-interpreting it.
  issues:
  - severity: medium
    issue: Hebrew ‘their spirit’ is rendered as ‘अपनी आत्माओं’ (‘their souls’).
    rationale: The Hebrew reads רוּחָם, whereas the Greek parallel has ψυχὰς (‘souls’). The current wording adopts the Greek-like sense in the main text despite claiming to follow the Hebrew witness, and thus fails to preserve the source’s stated lexical distinction.
  - severity: low
    issue: The plural ‘आत्माओं’ and phrase ‘दीन करेंगे’ are less natural than a distributive singular construction.
    rationale: The Hebrew has singular רוּחַ with a plural possessive suffix. ‘अपनी आत्मा को नम्र करेंगे’ is natural modern formal Hindi and better reflects that grammar.
  revised_text: जो याहवे का भय मानते हैं, वे अपने हृदयों को तैयार करेंगे और उसके सामने अपनी आत्मा को नम्र करेंगे।[a]
