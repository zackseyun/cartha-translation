  yaml_path: translation/deuterocanon/sirach/002/013.yaml
  text: Woe to the heart that does not trust[a], for it also will not stand.
translation:
  language: hi
  text: हाय उस हृदय पर जो भरोसा नहीं करता,[a] और वह भी स्थिर न रह सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “हाय उस शिथिल हृदय पर, क्योंकि वह विश्वास नहीं करता; इसलिए उसे आश्रय नहीं मिलेगा।” इब्रानी पाठ में केवल “हृदय” और “स्थिर न रह सकेगा” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: धिक्कार है
  rationale: यह विलाप और चेतावनी—दोनों का प्रबल भाव व्यक्त करता है और ज्ञान-साहित्य की गंभीर शैली बनाए रखता है।
- source_word: לְלֵב
  choice: उस हृदय पर
  rationale: ‘हृदय’ इब्रानी में मनुष्य के भीतरी व्यक्तित्व, इच्छा और प्रवृत्ति को दर्शाता है; इसे बनाए रखने से मूल की मानव-विषयक धारणा सुरक्षित रहती है।
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: जो भरोसा नहीं करता
  rationale: אמן यहाँ विश्वास करने अथवा भरोसा रखने का अर्थ देता है। परीक्षा में परमेश्वर पर निर्भर रहने के संदर्भ में ‘भरोसा’ सहज और सटीक है।
- source_word: וְאַף הוּא
  choice: क्योंकि वह भी
  rationale: यह परिणामसूचक संबंध के साथ मूल के बलाघात को व्यक्त करता है कि वही हृदय भी बताए गए परिणाम से नहीं बचेगा।
- source_word: לֹא יָקוּם
  choice: स्थिर न रह सकेगा
  rationale: קום का मूल अर्थ उठना या खड़ा रहना है। यहाँ ‘स्थिर न रह सकेगा’ संकट में टिके न रहने का भाव देते हुए इब्रानी रूपक को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के उपदेश में विश्वास/भरोसे के क्रियापद का अनुवाद
  choice: भरोसा नहीं करता
  alternative: विश्वास नहीं करता
  rationale: इब्रानी और यूनानी दोनों विश्वास अथवा भरोसे की कमी बताते हैं। परीक्षा के बीच दृढ़ निर्भरता के इस संदर्भ में ‘भरोसा’ व्यावहारिक भाव को स्पष्ट करता है और बाद की किसी विशिष्ट सिद्धान्तगत परिभाषा को आरोपित नहीं करता।
- issue: इब्रानी और यूनानी में परिणामसूचक वाक्य का अंतर
  choice: इब्रानी के अनुसार ‘स्थिर न रह सकेगा’
  alternative: यूनानी के अनुसार ‘उसे आश्रय नहीं मिलेगा’
  rationale: उपलब्ध इब्रानी पाठ का प्रमाण उच्च विश्वसनीयता वाला है, इसलिए मुख्य पाठ में उसका अनुसरण किया गया है; यूनानी का वास्तविक पाठांतर पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
