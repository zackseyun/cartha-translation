base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/001.yaml
  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
translation:
  language: hi
  text: मेरे बेटे, यदि तू यहोवा की सेवा करने के लिए उसके पास आए, तो हर परीक्षा के लिए अपने आपको तैयार कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राण को हर परीक्षा के लिए तैयार कर।” इब्रानी शब्द का अर्थ जाँच या कसौटी हो सकता है; समानांतर यूनानी शब्द प्रसंग के अनुसार “परीक्षा,” “परख,” या “प्रलोभन” भी सूचित कर सकता है।
    reason: नפש की शाब्दिक अभिव्यक्ति तथा ניסיון/πειρασμός की अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: इब्रानी संबोधन एकवचन और पुल्लिंग है तथा ज्ञान-साहित्य के पिता-सदृश उपदेश का स्वर रखता है।
- source_word: תִּקְרַב
  choice: निकट आता है
  rationale: קרב का मूल अर्थ निकट आना है; यह परमेश्वर के पास उपासना और सेवा के लिए आने की छाया को बनाए रखता है।
- source_word: לַעֲבוֹד
  choice: सेवा करने के लिए
  rationale: עבד में आज्ञापालन और उपासना दोनों समा सकते हैं; ‘सेवा करना’ इस व्यापकता को बनाए रखता है।
- source_word: אֶת יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה स्पष्ट रूप से आया है; उसका लिप्यंतरण नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: הָכֵן
  choice: तैयार कर
  rationale: आज्ञार्थक क्रिया जानबूझकर तत्पर होने का आह्वान करती है।
- source_word: נַפְשְׁךָ
  choice: अपने आपको
  rationale: נפש यहाँ पूरे व्यक्ति को सूचित करता है; आधुनिक हिन्दी में ‘अपने आपको’ स्वाभाविक है और देह से पृथक किसी तत्त्व तक अर्थ को सीमित नहीं करता।
- source_word: לְכָל נִסָּיוֹן
  choice: हर परीक्षा के लिए
  rationale: ניסיון जाँच या कसौटी का भाव देता है और לכל उसकी व्यापकता दिखाता है; ‘हर परीक्षा’ आने वाली प्रत्येक कसौटी के लिए तत्परता व्यक्त करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल इब्रानी में चतुरक्षरीय दिव्य नाम है। उसे ‘यहोवा’ कहना व्यक्तिगत वाचा-नाम को सुरक्षित रखता है; यूनानी समानांतर में Κυρίῳ (‘प्रभु’) है।
- issue: נַפְשְׁךָ को शाब्दिक ‘अपने प्राण’ कहना या पूरे व्यक्ति के रूप में व्यक्त करना
  choice: अपने आपको
  alternative: अपने प्राण को
  rationale: इब्रानी נפש और यूनानी ψυχή दोनों यहाँ व्यक्ति के आंतरिक या संपूर्ण अस्तित्व को सूचित कर सकते हैं। ‘अपने आपको’ अनावश्यक देह-प्राण द्वैत थोपे बिना आशय देता है; शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- issue: נִסָּיוֹן / πειρασμόν का अर्थ
  choice: परीक्षा
  alternative: परख; प्रलोभन
  rationale: इब्रानी शब्द मुख्यतः जाँच या कसौटी बताता है। यूनानी πειρασμός प्रसंगानुसार परीक्षा अथवा प्रलोभन हो सकता है; यहाँ परमेश्वर की सेवा के साथ आने वाली कठिन कसौटी प्रसंग के अधिक अनुकूल है, पर अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल की एकवचन, आत्मीय उपदेशात्मक शैली बनाए रखने के लिए ‘तू’ रूप प्रयुक्त है; वाक्य में उपासना-संबंधी ‘निकट आने’ की छाया और परीक्षा की वास्तविकता दोनों सुरक्षित हैं।
