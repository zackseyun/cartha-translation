base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/008.yaml
  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: hi
  text: याहवे का भय माननेवालो, उस पर भरोसा रखो; वह तुम्हारा प्रतिफल देने में देर नहीं करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “वह तुम्हारा प्रतिफल रात भर नहीं रोकेगा।” यूनानी समानांतर पाठ में है, “तुम अपना प्रतिफल कदापि नहीं खोओगे।”
    reason: इब्रानी मुहावरे के शाब्दिक रूप और यूनानी समानांतर पाठ के वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: याहवे का भय माननेवालो
  rationale: बहुवचन कृदंत यहाँ सीधे संबोधन के रूप में प्रयुक्त है। यह हिंदी में उस संबोधन और श्रद्धामय भय—दोनों को स्वाभाविक ढंग से व्यक्त करता है; יְהֹוָה को उसके नाम ‘याहवे’ से रखा गया है।
- source_word: הַאֲמִינוּ בּוֹ
  choice: उस पर भरोसा रखो
  rationale: אמן के साथ ב का अर्थ केवल किसी बात को सत्य मानना नहीं, बल्कि किसी पर निर्भर होना और भरोसा रखना है।
- source_word: לֹא יָלִין
  choice: देर नहीं करेगा
  rationale: לין का मूल अर्थ ‘रात भर ठहरना/रोक रखना’ है। प्रतिफल के प्रसंग में यह उसे रोककर रखने अथवा देने में विलंब करने का मुहावरा है; असामान्य शाब्दिक चित्र और यूनानी पाठ का भिन्न रूप पादटिप्पणी में सुरक्षित है।
- source_word: שְׂכַרְכֶם
  choice: तुम्हारा प्रतिफल
  rationale: שכר का अर्थ मजदूरी या प्रतिफल हो सकता है। इस ज्ञान-साहित्यिक उपदेश में ‘प्रतिफल’ व्यापक और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल इब्रानी में चार अक्षरों वाला ईश्वरीय नाम स्पष्ट रूप से है; उसका लिप्यंतरण व्यक्तिगत नाम को बनाए रखता है।
- issue: अंतिम उपवाक्य में इब्रानी और यूनानी पाठों का तनाव
  choice: वह तुम्हारा प्रतिफल देने में देर नहीं करेगा
  alternative: तुम अपना प्रतिफल कदापि नहीं खोओगे
  rationale: मुख्य पाठ इब्रानी לין के ‘रात भर रोकने’ वाले बिंब का स्वाभाविक हिंदी अर्थ देता है। यूनानी समानांतर प्रतिफल न खोने की बात कहता है; उसे पादटिप्पणी में देकर वास्तविक पाठांतर को बिना मिलाए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। ‘भय माननेवालो’ धार्मिक श्रद्धा और जवाबदेही का भाव रखता है, जबकि ‘भरोसा रखो’ सामान्य पाठक के लिए सहज है।
