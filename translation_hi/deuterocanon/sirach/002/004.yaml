    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: जो कुछ तुम पर आए
  rationale: यह इब्रानी के ‘वह सब जो तुम पर आए’ का स्वाभाविक हिन्दी रूप है और विपत्ति तक अर्थ को सीमित नहीं करता।
- source_word: קַבֵּל
  choice: स्वीकार करो
  rationale: आज्ञार्थक क्रिया यहाँ आने वाली परिस्थितियों को ग्रहण करने का भाव देती है; ‘स्वागत करो’ मूल से अधिक सकारात्मक होता।
- source_word: וּבְשִׁבְרְךָ
  choice: अपनी दुर्दशा के उतार-चढ़ाव में
  rationale: इब्रानी पद का अधिक शाब्दिक अर्थ ‘अपनी टूटन में’ है, जबकि यूनानी समानांतर दीनता या अपमान की बदलती दशाओं की ओर संकेत करता है। मुख्य पाठ दोनों साक्ष्यों को ध्यान में रखते हुए स्वाभाविक हिन्दी में संभावित आशय देता है और भिन्नता पादटिप्पणी में स्पष्ट करता है।
- source_word: הַאֲרֵךְ רוּחַ
  choice: धीरज रखो
  rationale: शाब्दिक मुहावरा ‘आत्मा को लंबा करना’ धैर्यपूर्वक सहने का अर्थ देता है; यूनानी μακροθύμησον भी इसकी पुष्टि करता है।
theological_decisions:
- issue: कठिन इब्रानी पद וּבְשִׁבְרְךָ और यूनानी समानांतर के बीच अंतर
  choice: मुख्य पाठ में ‘अपनी दुर्दशा के उतार-चढ़ाव में’
  alternative: ‘अपनी टूटन में’
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिक रखते हुए उसके टूटन या दुर्दशा के भाव को सुरक्षित रखा गया है, और यूनानी के ‘बदलती दशाओं’ के संकेत को ‘उतार-चढ़ाव’ द्वारा व्यक्त किया गया है। पादटिप्पणी पाठक को अधिक शाब्दिक इब्रानी और यूनानी भिन्नता दोनों बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दुर्दशा’ टूटन, दीनता और अपमान से जुड़ी कठिन अवस्था को संक्षेप में व्यक्त करती है; ‘उतार-चढ़ाव’ यूनानी समानांतर के परिवर्तन-संबंधी संकेत को स्वाभाविक हिन्दी देता है।
