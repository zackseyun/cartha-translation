  yaml_path: translation/deuterocanon/sirach/002/015.yaml
  text: Those who fear Yahweh will not rebel against his ways[a], and those who love him will keep his paths.
translation:
  language: hi
  text: याहवे का भय माननेवाले उसके मार्गों के विरुद्ध विद्रोह नहीं करेंगे[a], और उससे प्रेम करनेवाले उसके पथों का पालन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में ‘उसके मार्गों के विरुद्ध विद्रोह नहीं करेंगे’ के स्थान पर ‘उसके वचनों की अवज्ञा नहीं करेंगे’ है। यहाँ काहिरा गनीज़ा का इब्रानी पाठ प्राथमिक रखा गया है; दोनों पाठ निष्ठापूर्ण आज्ञाकारिता का समान व्यापक भाव देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: याहवे का भय माननेवाले
  rationale: यह सहभागी पद ऐसे लोगों को दर्शाता है जिनकी पहचान याहवे का भय मानने से होती है। ‘भय मानना’ इब्रानी ज्ञान-साहित्य की श्रद्धा और उत्तरदायित्व—दोनों की धार को बनाए रखता है।
- source_word: לֹא יַמְרוּ
  choice: विद्रोह नहीं करेंगे
  rationale: מרה केवल आज्ञा न मानने से अधिक, अवज्ञापूर्ण प्रतिरोध या विद्रोह का भाव रखता है; इसलिए अपेक्षाकृत प्रबल अभिव्यक्ति चुनी गई है।
- source_word: בִּדְרָכָיו
  choice: उसके मार्गों के विरुद्ध
  rationale: מרה के साथ ב उस लक्ष्य को बता सकता है जिसके विरुद्ध विद्रोह किया जाता है। हिन्दी में ‘के विरुद्ध’ इस संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: וְאוֹהֲבָיו
  choice: उससे प्रेम करनेवाले
  rationale: सहभागी रूप और सर्वनाम-प्रत्यय मिलकर उन लोगों को दर्शाते हैं जो परमेश्वर से प्रेम करते हैं; यह हिन्दी में सहज व्यक्तिगत अभिव्यक्ति है।
- source_word: יִצְרוּ
  choice: पालन करेंगे
  rationale: נצר का अर्थ रखना, रक्षा करना या सावधानी से मानना हो सकता है। ‘पथों’ के संदर्भ में ‘पालन करेंगे’ निष्ठापूर्ण अनुपालन का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרְחוֹתָיו
  choice: उसके पथों
  rationale: אֹרַח मार्ग, पथ या जीवन-क्रम को दर्शाता है। ‘पथों’ से पहले चरण के ‘मार्गों’ के साथ इब्रानी काव्यात्मक समानता और शब्द-वैविध्य दोनों बने रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल इब्रानी में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण को दर्शाता और नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: भय और प्रेम का संबंध
  choice: ‘भय माननेवाले’ और ‘प्रेम करनेवाले’ दोनों को समानांतर पहचान-सूचक पदों के रूप में रखा गया
  alternative: ‘भक्त’ जैसे एक ही सामान्य पद में दोनों को समेटना
  rationale: पद श्रद्धामय भय और प्रेम को अलग किंतु समानांतर रूपों में रखता है; अनुवाद इस धर्मवैचारिक तनाव और परस्पर संबंध को बिना मिलाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘मार्गों’ और ‘पथों’ से मूल की काव्यात्मक समानांतरता बचती है; ‘विद्रोह’ मूल की प्रबलता और ‘पालन’ आज्ञाकारिता का व्यावहारिक भाव व्यक्त करते हैं।
