base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: hi
  text: 'प्राचीन पीढ़ियों की ओर देखो: किसने यहवे पर विश्वास किया और लज्जित हुआ? अथवा किसने उस पर भरोसा रखा और त्याग दिया गया?[a] अथवा किसने उसे पुकारा और उसे उत्तर न मिला?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “कौन उसके भय में बना रहा और त्याग दिया गया?” उपलब्ध हिब्रू पाठ में इसके स्थान पर है: “किसने उस पर भरोसा रखा और त्याग दिया गया?”'
    reason: alternative_reading
  - marker: b
    text: 'यूनानी पाठ: “किसने उसे पुकारा और उसने उसकी उपेक्षा की?” हिब्रू पाठ में है: “किसने उसे पुकारा और उसे उत्तर न मिला?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: प्राचीन पीढ़ियों की ओर देखो
  rationale: बहुवचन आज्ञार्थक और पहले की पीढ़ियों को ऐतिहासिक उदाहरण के रूप में देखने का भाव स्पष्ट रखता है।
- source_word: הֶאֱמִין בַּיהֹוָה
  choice: यहवे पर विश्वास किया
  rationale: האמין और अगले खंड के בטח के बीच शब्दगत भेद बचाने के लिए यहाँ ‘विश्वास किया’ और वहाँ ‘भरोसा रखा’ कहा गया है। יהוה को उसके व्यक्तिगत नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: וַיֵּבוֹשׁ
  choice: लज्जित हुआ
  rationale: यह भरोसे के विफल सिद्ध होने के फलस्वरूप लज्जा उठाने का भाव देता है और हिंदी में स्वाभाविक है।
- source_word: בָּטַח בּוֹ
  choice: उस पर भरोसा रखा
  rationale: בטח व्यावहारिक निर्भरता और भरोसे को व्यक्त करता है; यह पहले प्रयुक्त ‘विश्वास किया’ से मूल का भेद बनाए रखता है।
- source_word: וְנֶעֱזַב
  choice: त्याग दिया गया
  rationale: निष्क्रिय रूप को सुरक्षित रखते हुए सहायता के बिना छोड़ दिए जाने का अर्थ व्यक्त करता है।
- source_word: קָרָא אֵלָיו
  choice: उसे पुकारा
  rationale: परमेश्वर से प्रार्थनापूर्वक सहायता माँगने का भाव संक्षिप्त और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: וְלֹא נֶעֱנָה
  choice: उसे उत्तर न मिला
  rationale: निष्क्रिय हिब्रू का स्वाभाविक हिंदी रूप है और ‘उसकी सुनवाई न हुई’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है; ‘यहवे’ उसे पदवी में बदले बिना सुरक्षित रखता है।
- issue: हिब्रू और यूनानी पाठ में भिन्नता
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले हिब्रू का अनुसरण; यूनानी पाठांतर पादटिप्पणियों में
  alternative: मुख्य पाठ में यूनानी के अनुसार ‘उसके भय में बना रहा’ और ‘उसने उसकी उपेक्षा की’
  rationale: इस स्थान पर हिब्रू उपलब्ध और विश्वसनीय है; फिर भी यूनानी की अर्थपूर्ण भिन्नताओं को छिपाने के बजाय पादटिप्पणियों में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। तीनों आलंकारिक प्रश्नों की समानांतर संरचना सुरक्षित है। ‘विचार करो’ यूनानी समानांतर के ‘और देखो’ के आशय को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि हिब्रू के आरंभिक ‘देखो’ को भी बनाए रखता है।
