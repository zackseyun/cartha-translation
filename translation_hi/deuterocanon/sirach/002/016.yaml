base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/016.yaml
  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: hi
  text: जो यहोवा का भय मानते हैं, वे उसकी कृपा पाने का प्रयत्न करेंगे; और जो उससे प्रेम करते हैं, वे उसकी व्यवस्था[a] सीखेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी शिक्षा।”
    reason: תורה का अर्थ व्यवस्था के साथ-साथ शिक्षा या उपदेश भी हो सकता है।
  - marker: b
    text: 'यूनानी समानांतर में: “और जो उससे प्रेम करते हैं, वे व्यवस्था से भर जाएँगे।”'
    reason: यूनानी पाठ दूसरे अर्ध-पद में उपलब्ध इब्रानी पाठ से भिन्न है।
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: जो यहोवा का भय मानते हैं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इब्रानी पदबंध का धार्मिक और वाचा-संबंधी भाव सुरक्षित रखता है; यहाँ ‘भय’ श्रद्धापूर्ण भय को व्यक्त करता है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा स्पष्ट रूप से प्रस्तुत किया गया है।
- source_word: יְבַקְּשׁוּ רְצוֹנוֹ
  choice: उसकी कृपा पाने का प्रयत्न करेंगे
  rationale: בקשׁ का अर्थ खोजने या पाने का प्रयत्न करना है, और רצון यहाँ अनुग्रह, स्वीकृति अथवा प्रसन्नता का भाव देता है। यह वाक्यांश हिन्दी में उस संयुक्त अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: וְאֹהֲבָיו
  choice: और जो उससे प्रेम करते हैं
  rationale: प्रत्यय का संकेत यहोवा की ओर है; यह रूप व्यक्तिगत भक्ति और प्रेम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִלְמְדוּ
  choice: सीखेंगे
  rationale: इब्रानी למד के काल रूप का यहाँ सामान्य/भावी कथन के रूप में स्वाभाविक अर्थ ‘सीखेंगे’ है। यूनानी समानांतर का पाठ भिन्न है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: תוֹרָתוֹ
  choice: उसकी व्यवस्था
  rationale: תורה का पारंपरिक वाचा-संबंधी अर्थ ‘व्यवस्था’ सुरक्षित रहता है, जबकि उसके व्यापक अर्थ ‘शिक्षा’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दूसरे अर्ध-पद में इब्रानी और यूनानी पाठ का अंतर
  choice: इब्रानी के अनुसार ‘उसकी व्यवस्था सीखेंगे’
  alternative: 'यूनानी समानांतर: ‘व्यवस्था से भर जाएँगे’'
  rationale: Sirach का उपलब्ध, उच्च-विश्वसनीयता वाला इब्रानी पाठ प्राथमिक स्रोत है। भौतिक रूप से भिन्न यूनानी पाठ को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רצון का अर्थ
  choice: कृपा
  alternative: इच्छा / जो उसे प्रसन्न करता है
  rationale: संदर्भ और यूनानी εὐδοκία ‘कृपा, अनुग्रह, प्रसन्नता’ के अर्थ का समर्थन करते हैं। ‘कृपा पाने का प्रयत्न’ हिन्दी में अर्थ स्पष्ट करता है, पर इसे केवल आज्ञात्मक ‘इच्छा’ के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा का भय मानना’ बाइबिलीय पदबंध को सुरक्षित रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से [a], [b] दिए गए हैं।
