base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/005.yaml
  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: hi
  text: क्योंकि सोना आग में परखा जाता है, और स्वीकार किए गए मनुष्य दुःख की भट्ठी में परखे जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति का इब्रानी पद कठिन है। यूनानी समानांतर का अर्थ है, ‘स्वीकार किए गए मनुष्य दीनता की भट्ठी में।’ मुख्य पाठ इस अर्थ का अनुसरण करते हुए उपलब्ध इब्रानी पाठ से जुड़ा रहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  choice: परखा जाता है
  rationale: בחן का अर्थ जाँचना या कसौटी पर परखना है। निष्क्रिय रूप को बनाए रखते हुए यह स्वाभाविक हिन्दी है; ‘शुद्ध किया जाता है’ क्रिया में परिणाम का भाव अनावश्यक रूप से जोड़ देता।
- source_word: זָהָב
  choice: सोना
  rationale: सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: בְּנֵי אָדָם
  choice: मनुष्य
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘मनुष्य की संतान’ है, पर यहाँ वह मानव व्यक्तियों के लिए सामान्य अभिव्यक्ति है। ‘मनुष्य’ आधुनिक, गरिमापूर्ण और समावेशी है।
- source_word: בְּכוּר
  choice: स्वीकार किए गए
  rationale: प्रेषित इब्रानी पाठ में यह रूप संदर्भ की दृष्टि से कठिन है। यूनानी समानांतर δεκτοί ‘स्वीकार्य/स्वीकार किए गए’ अर्थ का समर्थन करता है। ‘स्वीकार किए गए’ निष्क्रिय भाव और ईश्वरीय स्वीकृति की सम्भावना को बिना अत्यधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: עֹנִי
  choice: दुःख
  rationale: עֹנִי कष्ट, दीनता, विपत्ति या अपमान को सूचित कर सकता है। यहाँ परीक्षा की उपमा में ‘दुःख’ सहज है और अर्थ-क्षेत्र को अनावश्यक रूप से केवल अपमान या गरीबी तक सीमित नहीं करता।
- source_word: καμίνῳ
  choice: भट्ठी
  rationale: इब्रानी पंक्ति में भट्ठी का संज्ञापद स्पष्ट नहीं है, पर यूनानी समानांतर καμίνῳ इसे सुरक्षित रखता है और सोने को आग में परखने वाली समानांतर छवि पूरी करता है।
theological_decisions:
- issue: कठिन इब्रानी दूसरे चरण को स्पष्ट करने में यूनानी समानांतर का उपयोग
  choice: दूसरे चरण को स्वीकार किए गए मनुष्यों के दुःख की भट्ठी में परखे जाने के आशय से प्रस्तुत करना
  alternative: अधिक यांत्रिक रूप से ‘और मनुष्य दुःख की कसौटी में’ या בְּכוּר को ‘चुने हुए’ कहना
  rationale: जीवित इब्रानी साक्ष्य संदर्भगत कठिनाई रखता है, जबकि यूनानी पाठ ‘स्वीकार किए गए मनुष्य’ और ‘दीनता की भट्ठी’ के साथ कहावत का समानांतर स्पष्ट करता है। मुख्य पाठ उसी प्राचीन साक्ष्य का सहारा लेता है, पर कठिनाई को पादटिप्पणी में खुला रखता है और चुनाव-संबंधी कोई विशिष्ट सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त ज्ञानोक्ति-सदृश वाक्य, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भट्ठी’ रूपक की ठोस छवि बनाए रखता है और ‘दुःख’ עֹנִי की व्यापक अर्थ-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
