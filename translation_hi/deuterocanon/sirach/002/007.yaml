  yaml_path: translation/deuterocanon/sirach/002/007.yaml
  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: hi
  text: हे याहवे का भय मानने वालो, उसकी दया[a] की प्रतीक्षा करो और मार्ग से मत हटो, कहीं ऐसा न हो कि तुम गिरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חֶסֶד का अर्थ ‘अटल प्रेम’, ‘निष्ठावान प्रेम’ या ‘दया’ हो सकता है; यूनानी समानांतर में यहाँ ‘दया’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: हे याहवे का भय मानने वालो
  rationale: इब्रानी बहुवचन संबोधन और यूनानी कृदंत-संबोधन दोनों किसी समूह को सीधे संबोधित करते हैं। यह रूप श्रद्धापूर्ण भय और उपदेशात्मक संबोधन, दोनों को बनाए रखता है।
- source_word: חַכּוּ / ἀναμείνατε
  choice: बाट जोहो
  rationale: दोनों स्रोत धैर्यपूर्वक प्रतीक्षा करने की बहुवचन आज्ञा देते हैं। ‘बाट जोहो’ स्वाभाविक हिन्दी में अपेक्षापूर्ण प्रतीक्षा व्यक्त करता है और कर्म ‘उसकी दया’ के साथ सहज बैठता है।
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: उसकी दया
  rationale: इब्रानी חֶסֶד में अटल प्रेम, निष्ठा और कृपा के अर्थ भी हो सकते हैं; यूनानी समानांतर का ἔλεος यहाँ ‘दया’ का स्पष्ट समर्थन करता है।
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: मार्ग से न हटो
  rationale: क्रिया किसी दिशा या पथ से मुड़ने का बिंब रखती है। हिन्दी में यह चयन उस बिंब और चेतावनी के भाव को स्पष्ट तथा स्वाभाविक रूप से बनाए रखता है।
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: कहीं ऐसा न हो कि तुम गिर पड़ो
  rationale: इब्रानी פֶּן और यूनानी ἵνα μή नकारात्मक आशंका या चेतावनी व्यक्त करते हैं। अनुवाद यह तय नहीं करता कि गिरना नैतिक, आत्मिक या परिस्थितिजन्य है।
theological_decisions:
- issue: परमेश्वर के व्यक्तिगत नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करके वाचा-संबंधी नाम को पाठ में प्रत्यक्ष रखता है; यूनानी समानांतर में Κύριον है।
- issue: חֶסֶד की अर्थ-छाया
  choice: दया
  alternative: अटल प्रेम
  rationale: इब्रानी शब्द में वफादार अथवा अटल प्रेम की व्यापक अर्थ-छाया है, किंतु यूनानी समानांतर ἔλεος पढ़ता है, इसलिए मुख्य पाठ में ‘दया’ अधिक प्रत्यक्ष रूप से दोनों साक्ष्यों से समर्थित है। पादटिप्पणी व्यापक इब्रानी अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और उपदेशात्मक संबोधन रखा गया है। ‘बाट जोहो’ सामान्य पाठक के लिए बोधगम्य रहते हुए धैर्यपूर्ण अपेक्षा का भाव देता है। ‘गिर पड़ो’ को जानबूझकर खुला रखा गया है ताकि मूल की नैतिक, आत्मिक या परिस्थितिजन्य अस्पष्टता बनी रहे।
