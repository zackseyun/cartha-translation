base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: hi
  text: हम याहवे के हाथ में पड़ें[a], न कि मनुष्य के हाथ में; क्योंकि जितनी उसकी महानता है, उतनी ही उसकी करुणा भी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में दोनों जगह बहुवचन ‘हाथों’ है—‘प्रभु के हाथों में … मनुष्यों के हाथों में’; इब्रानी साक्ष्य दोनों जगह एकवचन ‘हाथ’ पढ़ता है। यहाँ इब्रानी का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: या ‘उसका अटल प्रेम’। इब्रानी חֶסֶד का अर्थ निष्ठावान प्रेम अथवा वाचा-संबंधी कृपा भी हो सकता है; यूनानी समानांतर पाठ में ‘करुणा’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: आओ, हम ... पड़ें
  rationale: यह नפל का प्रथम पुरुष बहुवचन इच्छासूचक रूप है, जो साझा आग्रह व्यक्त करता है। यह अनुवाद इब्रानी और यूनानी दोनों में विद्यमान ‘पड़ने’ के सजीव रूपक को बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी पाठ दोनों वाक्यांशों में एकवचन ‘हाथ’ रखता है। हिन्दी में ‘किसी के हाथ में पड़ना’ स्वाभाविक है और सामर्थ्य अथवा अधिकार का मूल रूपक सुरक्षित रखता है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम चार अक्षरों में दिया गया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द किसी पुरुष विशेष के लिए नहीं, बल्कि याहवे के विपरीत नश्वर मानव के लिए जातिवाचक रूप में प्रयुक्त है। एकवचन ‘मनुष्य’ मूल की अलंकारिक समानता बनाए रखता है।
- source_word: כְּגָדְלוֹ ... כֵּן
  choice: जितनी उसकी महानता है, उतनी ही
  rationale: ‘जितनी…उतनी ही’ इब्रानी כ...כן तुलनात्मक संरचना का स्वाभाविक हिन्दी रूप है और परमेश्वर की महानता तथा करुणा के बीच प्रत्यक्ष समानुपात को व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी करुणा
  rationale: इस प्रसंग में חֶסֶד संकट में पड़े लोगों के प्रति परमेश्वर की दयापूर्ण और निष्ठावान भलाई को दर्शाता है। ‘करुणा’ यूनानी समानांतर ἔλεος से भी मेल खाती है, जबकि ‘अटल प्रेम’ एक वास्तविक वैकल्पिक अर्थ है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में वाचा-नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है; ‘याहवे’ मूल उच्चारण का व्यापक रूप से स्वीकृत निकट रूप है।
- issue: याहवे और אָדָם के बीच विरोध
  choice: मनुष्य
  alternative: मनुष्यों / मानवजाति
  rationale: इब्रानी में जातिवाचक एकवचन है। ‘मनुष्य’ किसी पुरुष विशेष का संकेत दिए बिना परमेश्वर और नश्वर मानव के बीच मूल एकवचन विरोध को सुरक्षित रखता है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: करुणा
  alternative: अटल प्रेम / निष्ठावान प्रेम
  rationale: याहवे के हाथ में पड़ने के संदर्भ में दंड के बीच उसकी दयालुता प्रमुख है, और यूनानी पाठ भी ‘करुणा’ पढ़ता है। फिर भी इब्रानी शब्द में निष्ठावान, संबंधपरक प्रेम का अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाथ में पड़ना’ मूल रूपक और स्वाभाविक हिन्दी मुहावरे दोनों को सुरक्षित रखता है। अर्धविराम पद के आग्रह और उसके कारण के बीच स्पष्ट संबंध दिखाता है।
