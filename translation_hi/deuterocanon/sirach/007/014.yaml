base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/014.yaml
  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
translation:
  language: hi
  text: शासकों की सभा में बकबक मत करो[a], और अपनी प्रार्थना में एक ही बात मत दोहराओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यर्थ बातें मत बनाते रहो” अथवा “बहुत अधिक मत बोलो।” यूनानी समानांतर भी बुज़ुर्गों की सभा में निरर्थक या अत्यधिक बोलने से सावधान करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “अपनी प्रार्थना में कोई बात दोबारा मत कहो।” सम्भवतः यह निरर्थक या यांत्रिक पुनरुक्ति के विरुद्ध चेतावनी है, न कि हर बार दोहराई गई विनती का निषेध।'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: बकबक मत करो
  rationale: इब्रानी क्रिया और यूनानी समानांतर ἀδολέσχει निरर्थक, असंयमित या अत्यधिक बोलने की चेतावनी देते हैं। ‘बकबक’ इस भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: בַּעֲדַת
  choice: सभा में
  rationale: עֵדָה किसी एकत्र समुदाय या औपचारिक सभा को दर्शाता है; यहाँ ‘सभा’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: שָׂרִים
  choice: अधिकारियों की
  rationale: שָׂרִים पद और अधिकार रखने वाले व्यक्तियों को सूचित करता है। ‘अधिकारी’ आधुनिक हिन्दी में ‘राजकुमार’ से अधिक व्यापक है और अनावश्यक राजतंत्रीय अर्थ से बचता है।
- source_word: תִּישֶׁן דָּבָר
  choice: एक ही बात मत दोहराओ
  rationale: इस कठिन इब्रानी पदबंध को यूनानी μὴ δευτερώσῃς λόγον ‘वचन/बात को न दोहराओ’ के अर्थ में पुष्ट करता है। ‘एक ही बात’ हिन्दी में ‘एक शब्द’ की अपेक्षा अभिप्रेत पुनरुक्ति को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּתְּפִלָּה
  choice: अपनी प्रार्थना में
  rationale: यूनानी ἐν προσευχῇ σου में स्वत्वसूचक ‘अपनी/तुम्हारी’ स्पष्ट है और सम्भवतः इब्रानी का आशय भी यही है; इसलिए व्यक्तिगत सम्बोधन बनाए रखा गया है।
theological_decisions:
- issue: क्या दूसरा निषेध प्रार्थना में हर प्रकार की पुनरावृत्ति को मना करता है या निरर्थक/यांत्रिक पुनरुक्ति को?
  choice: मुख्य पाठ मूल के निकट रहकर एक ही बात दोहराने से मना करता है; पादटिप्पणी सम्भावित निरर्थक या यांत्रिक पुनरुक्ति का संकेत देती है।
  alternative: इसे प्रार्थना में किसी भी दोहराई गई विनती का पूर्ण निषेध समझना।
  rationale: इब्रानी पदबंध और यूनानी समानांतर पुनरावृत्ति का स्पष्ट उल्लेख करते हैं, पर वे अपने आप हर प्रकार की लगनपूर्ण पुनः-विनती पर सिद्धान्तगत रोक सिद्ध नहीं करते। इसलिए तनाव को मुख्य पाठ में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘बकबक’ जानबूझकर सीधा और सामान्य शब्द है, क्योंकि मूल क्रिया में तुच्छ या अत्यधिक बोलने का नकारात्मक भाव है। दोनों पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरंत बाद रखे गए हैं।
