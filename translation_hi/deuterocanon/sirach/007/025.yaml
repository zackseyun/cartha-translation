  text: Marry off a daughter[a], and the matter will be settled[b]; and give her to an intelligent man.
translation:
  language: hi
  text: बेटी को ब्याह दो, और मामला निपट जाएगा[a]; उसे किसी समझदार पुरुष से जोड़ दो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और मामला बाहर निकल जाएगा।” आशय यह है कि मामला समाप्त हो जाएगा। यूनानी पाठ अधिक स्पष्ट रूप से कहता है, “और तुम एक बड़ा काम पूरा कर चुके होगे।”
    reason: alternative_reading
  - marker: b
    text: या, “उसका विवाह किसी समझदार पुरुष से कर दो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: बेटी को ब्याह दो
  rationale: הוֹצֵא का शाब्दिक अर्थ ‘बाहर भेजना/निकालना’ है, पर बेटी के संदर्भ में और यूनानी ἔκδου की पुष्टि के अनुसार यह उसे विवाह में देने का मुहावरा है। हिंदी में ‘ब्याह दो’ स्वाभाविक और संक्षिप्त है।
- source_word: וְיֵצֵא עֵסֶק
  choice: और मामला निपट जाएगा
  rationale: शाब्दिक रूप से ‘और मामला बाहर निकल जाएगा’; यहाँ आशय काम या चिंता के समाप्त हो जाने का है। ‘मामला निपट जाएगा’ इब्रानी मुहावरे का सहज हिंदी समतुल्य है।
- source_word: גֶּבֶר נָבוֹן
  choice: समझदार पुरुष
  rationale: נָבוֹן विवेक, समझ और सूझ-बूझ रखने वाले व्यक्ति को दर्शाता है। ‘समझदार’ आधुनिक हिंदी में स्वाभाविक है और केवल बौद्धिक क्षमता तक सीमित नहीं रहता।
- source_word: חַבְּרָהּ
  choice: उसे … से जोड़ दो
  rationale: חבר मूल का अर्थ जोड़ना या संबद्ध करना है। विवाह का संदर्भ स्पष्ट रखते हुए ‘जोड़ दो’ मूल की अभिव्यक्ति को बचाता है; अधिक स्पष्ट वैवाहिक विकल्प पादटिप्पणी में दिया गया है।
