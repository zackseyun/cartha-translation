  register: आधुनिक मानक हिंदी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘ब्याह दो’ सामान्य बोलचाल में सहज है, जबकि ‘समझदार पुरुष’ मूल के विवेक-संबंधी अर्थ को बनाए रखता है।
