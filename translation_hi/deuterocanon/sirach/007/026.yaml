base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/026.yaml
  text: Do not despise a wife who is yours[a], and do not trust one you hate.
translation:
  language: hi
  text: अपनी पत्नी से घृणा मत करो[a], और जिस स्त्री से तुम घृणा करते हो उस पर भरोसा मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्या तुम्हारे मन के अनुसार तुम्हारी पत्नी है? उसे निकाल न देना।” इस पद के उपलब्ध इब्रानी और यूनानी पाठों में उल्लेखनीय अंतर है; इसलिए मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है और यह टिप्पणी यूनानी पाठांतर को सुरक्षित रखती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: अपनी पत्नी
  rationale: אִשָּׁה के साथ לְךָ यहाँ वैवाहिक संबंध और अपनेपन को व्यक्त करता है; आधुनिक हिन्दी में ‘अपनी पत्नी’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: אַל תְּתַעֲבֶהָ
  choice: उससे घृणा न करना
  rationale: תעב तीव्र अरुचि, घृणा या तिरस्कार प्रकट करता है। ‘घृणा न करना’ मूल की तीव्रता बनाए रखता है और अगले खंड के שׂנא से जानबूझकर निकट शब्दावली में रहता है।
- source_word: וּשְׂנוּאָה
  choice: जिससे तुम घृणा करते हो
  rationale: यह रूप ‘घृणित/जिससे घृणा की जाती है’ भी समझा जा सकता है। संदर्भ में इसे संबोधित व्यक्ति के संबंध में ग्रहण किया गया है, पर निष्क्रिय अर्थ की संभाव्यता पूरी तरह समाप्त नहीं होती।
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: उस पर भरोसा न करना
  rationale: אמן के हिफ़ील रूप के साथ בְ का अर्थ किसी पर विश्वास या भरोसा रखना है। ‘उस पर भरोसा न करना’ मूल का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: बचे हुए इब्रानी पाठ और यूनानी समानांतर पाठ में उल्लेखनीय भिन्नता
  choice: मुख्य पाठ में इब्रानी साक्ष्य का अनुवाद, और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखना
  alternative: 'यूनानी: “क्या तुम्हारी पत्नी तुम्हारे मन के अनुसार है? उसे निकाल न देना।”'
  rationale: इस पद का उपलब्ध इब्रानी पाठ दोनों उपवाक्यों में यूनानी से पर्याप्त भिन्न है। इब्रानी साक्ष्य को मुख्य पाठ का आधार बनाया गया है, जबकि यूनानी पाठ की स्वतंत्र और महत्वपूर्ण पाठ-परंपरा को पादटिप्पणी में स्पष्ट किया गया है।
- issue: וּשְׂנוּאָה की व्याकरणिक अस्पष्टता
  choice: इसे ‘जिससे तुम घृणा करते हो’ के संबंधपरक अर्थ में प्रस्तुत करना
  alternative: ‘घृणित स्त्री’ या ‘जिस स्त्री से घृणा की जाती है’
  rationale: अगला स्त्रीलिंग सर्वनाम בָּהּ और पत्नी-संबंधी पहला खंड संबोधित व्यक्ति के दृष्टिकोण से संबंधपरक अर्थ का समर्थन करते हैं; फिर भी यह रूप व्याकरणतः निष्क्रिय विशेषण के रूप में भी पढ़ा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘न करना’ का प्रयोग आज्ञार्थक निषेध को सहज रूप देता है। पहले और दूसरे खंड में ‘घृणा’ की पुनरावृत्ति इब्रानी के निकटार्थी तीव्र क्रियापदों और पद के कठोर संबंधपरक तनाव को बनाए रखती है।
