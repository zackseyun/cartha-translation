  text: Do not make yourself guilty in the assembly at the gates of God[a], and do not bring yourself down in the congregation.
translation:
  language: hi
  text: परमेश्वर के फाटकों पर इकट्ठी सभा में अपने ऊपर दोष मत लाओ[a], और समुदाय में अपने आपको मत गिराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “नगर की भीड़ में पाप मत करो, और भीड़ में अपने आपको मत गिराओ।” यह किसी भिन्न इब्रानी पाठ को दर्शा सकता है, या इब्रानी के कठिन पदबंध “परमेश्वर के फाटक” का व्याख्यात्मक सरलीकरण हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: अपने ऊपर दोष मत लाओ
  rationale: रשע के हिफ़ील रूप और आत्मवाची प्रत्यय का भाव केवल सामान्य रूप से ‘पाप करना’ नहीं, बल्कि स्वयं को दोषी ठहरने की स्थिति में लाना या अपने ऊपर दोष लेना है। यह हिन्दी में स्वाभाविक रहते हुए इब्रानी की विशिष्टता बचाता है।
- source_word: בַּעֲדַת
  choice: सभा में
  rationale: עֵדָה किसी एकत्रित जनसमूह या सभा को सूचित करता है। ‘सभा’ सार्वजनिक और सामुदायिक प्रसंग को सरल, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: שַׁעֲרֵי אֵל
  choice: परमेश्वर के फाटकों पर
  rationale: इब्रानी का असामान्य पदबंध शाब्दिक रूप से ‘परमेश्वर के फाटक’ है। ‘पर’ सार्वजनिक अथवा न्यायिक सभा-स्थल का संकेत देता है, पर वाक्यांश की वास्तविक कठिनाई को मिटाता नहीं।
- source_word: וְאַל תַּפִּילְךָ
  choice: अपने आपको मत गिराओ
  rationale: नפל के हिफ़ील और आत्मवाची प्रयोग में स्वयं को गिराने अथवा पतन में डालने का रूपक है। यह अनुवाद उस रूपक को बनाए रखता है और परिणाम को केवल ‘अपमानित होना’ या ‘बरबाद होना’ मानकर सीमित नहीं करता।
- source_word: בַּקְּהִלָּה
  choice: समुदाय में
  rationale: קְהִלָּה एकत्रित समुदाय को दर्शाता है। ‘समुदाय’ पहले खंड के עֵדָה के लिए प्रयुक्त ‘सभा’ से हल्का भेद रखता है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: मुख्य पाठ में इब्रानी के ‘परमेश्वर के फाटक’ को रखा जाए या यूनानी के ‘नगर की भीड़’ को
  choice: इब्रानी-पाठानुसार ‘परमेश्वर के फाटकों पर’ मुख्य पाठ में रखा गया
  alternative: नगर की भीड़ में पाप मत करो
  rationale: इस पद का उपलब्ध इब्रानी पाठ उच्च-विश्वसनीयता वाला है और परियोजना में उसका प्राथमिक स्थान है। यूनानी संभवतः किसी भिन्न इब्रानी पाठ या कठिन वाक्यांश के व्याख्यात्मक सरलीकरण को दर्शाता है; इसलिए उसे पादटिप्पणी में दिया गया है, मुख्य पाठ में नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली रखी गई है। ‘अपने ऊपर दोष मत लाओ’ नैतिक दोष अर्जित करने का भाव देता है, जबकि ‘अपने आपको मत गिराओ’ मूल के पतन-रूपक और उसकी अर्थगत खुली गुंजाइश को सुरक्षित रखता है।
