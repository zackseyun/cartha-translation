lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: हिम्मत मत हारो
  rationale: इब्रानी रूप अपने आप में कठिन है, पर यूनानी समानांतर μὴ ὀλιγοψυχήσῃς स्पष्टतः निरुत्साहित होने या हिम्मत हारने का भाव पुष्ट करता है। यह आधुनिक हिन्दी में स्वाभाविक और अर्थपूर्ण है।
- source_word: בַּתְּפִלָּה
  choice: प्रार्थना में
  rationale: इब्रानी में संज्ञा के साथ कोई स्पष्ट संबंधवाचक प्रत्यय नहीं है; इसलिए ‘प्रार्थना में’ मूल पाठ के अधिक निकट है। यूनानी का ‘तुम्हारी प्रार्थना में’ एक संभावित स्पष्टिकरण है, पर हिन्दी में इसकी आवश्यकता नहीं।
- source_word: וּבִצְדָקָה
  choice: और दान देने
  rationale: צדקה का अर्थ ‘धार्मिकता/नेक काम’ भी हो सकता है, किंतु उत्तरकालीन इब्रानी प्रयोग और यूनानी ἐλεημοσύνην ποιῆσαι यहाँ जरूरतमंदों को दान देने का अर्थ पुष्ट करते हैं।
- source_word: אַל תִּתְעַבָּר
  choice: उपेक्षा मत करो
  rationale: क्रिया का मूल भाव किसी बात को पार कर जाने, अनदेखा करने या छोड़ देने का है। यूनानी μὴ παρίδῃς भी ‘अनदेखा/उपेक्षित न करना’ पुष्ट करता है।
