  yaml_path: translation/deuterocanon/sirach/007/035.yaml
  text: Do not delay with those who weep[a], and mourn with those who mourn.
translation:
  language: hi
  text: रोने वालों के पास जाने में देर न कर[a], और शोक मनाने वालों के साथ शोक मना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य में है: “बीमार से मिलने जाने में संकोच न कर, क्योंकि ऐसे कामों के कारण तू प्रिय होगा।” यह उपलब्ध इब्रानी पाठ से पर्याप्त रूप से भिन्न वाचन है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  choice: देर न कर
  rationale: निषेध के साथ यह रूप रुकने या देर करने से मना करता है। यह सहज आधुनिक हिन्दी में आग्रह की तात्कालिकता बनाए रखता है।
- source_word: מִבּוֹכִים
  choice: रोनेवालों के पास जाने में
  rationale: शाब्दिक पूर्वसर्ग अलगाव का आभास दे सकता है, पर समानांतर दूसरी पंक्ति और नैतिक संदर्भ रोनेवालों के साथ उपस्थित होने का भाव बताते हैं। ‘के पास जाने में’ उस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲבֵלִים
  choice: शोक मनानेवालों
  rationale: यह संज्ञा विशेष रूप से उन लोगों को सूचित करती है जो शोक की अवस्था में हैं। यह चयन स्पष्ट है और अगली क्रिया के साथ मूल की शब्दगत समानता रखता है।
- source_word: תִּתְאַבָּל
  choice: शोक मना
  rationale: हित्पएल रूप दूसरों के साथ शोक में सम्मिलित होने का भाव देता है। ‘शोक मना’ उस सहभागिता को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों का संबंध
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ मानकर रोने और शोक करनेवालों के साथ एकजुटता का उपदेश अनुवादित किया गया है।
  alternative: 'यूनानी साक्ष्य में है: ‘बीमार से मिलने जाने में संकोच न कर, क्योंकि ऐसे कामों के कारण तू प्रिय होगा।’'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वास वाला है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी पाठ कोई छोटा शब्दांतर नहीं बल्कि पर्याप्त रूप से भिन्न वाचन देता है; अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन अनौपचारिक आज्ञार्थक शैली; भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। इब्रानी समानांतरता को यथासंभव सुरक्षित रखा गया है।
