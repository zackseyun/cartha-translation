translation:
  language: hi
  text: वीरों की रोटी और हाथ का चढ़ावा[a], धार्मिकता के बलिदान और पवित्र चढ़ावा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “और गरीब की ओर अपना हाथ बढ़ा, ताकि तेरी आशीष पूरी हो जाए।” यहाँ हिब्रू और यूनानी पाठों में बहुत बड़ा अंतर है, जो किसी भिन्न पाठ-परंपरा या पाठ-विकृति का संकेत देता है।'
    reason: textual_variant
lexical_decisions:
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का सामान्य और ठोस अर्थ ‘रोटी’ है; प्रसंग इसे व्यापक ‘भोजन’ बनाने के लिए पर्याप्त आधार नहीं देता।
- source_word: אַבִּירִים
  choice: वीरों की
  rationale: शब्द ‘बलवानों/वीरों’ को सूचित कर सकता है और कुछ प्रसंगों में ‘साँड़ों’ को भी। यहाँ पाठ कठिन है; ‘वीरों’ से संदर्भ को अनावश्यक रूप से निश्चित किए बिना मूल की अस्पष्टता काफी हद तक बनी रहती है।
- source_word: וּתְרוּמַת יָד
  choice: और हाथ का चढ़ावा
  rationale: תרומה अर्पित अंश या चढ़ावे को दर्शाता है; יד के साथ यह हाथ से दिए गए चढ़ावे की छवि रखता है। संक्षिप्त शाब्दिक संरचना कठिन हिब्रू को सरल करके किसी एक अर्थ में नहीं बाँधती।
- source_word: זִבְחֵי צֶדֶק
  choice: धार्मिकता के बलिदान
  rationale: सम्बन्धवाचक हिब्रू संरचना का औपचारिक अर्थ सुरक्षित रखा गया है; इससे नैतिक और उपासना-संबंधी दोनों आयाम बने रहते हैं।
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: और पवित्र अंशदान
  rationale: यह पवित्र ठहराए गए योगदान का संकेत देता है। ‘पवित्र अंशदान’ मूल की उपासना-संबंधी भाषा और ‘चढ़ावे’ से उसका हल्का lexical भेद बनाए रखता है।
theological_decisions:
- issue: उपलब्ध हिब्रू पाठ और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू साक्ष्य का अनुवाद किया गया है और यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: “और गरीब की ओर अपना हाथ बढ़ा, ताकि तेरी आशीष पूरी हो जाए।”
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ का अर्थ पूरी तरह भिन्न है, इसलिए वह केवल शैलीगत विकल्प नहीं बल्कि भिन्न पाठ-परंपरा या पाठ-विकृति का साक्ष्य हो सकता है; उसे पाठकीय पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और उपासना-संबंधी शैली रखी गई है। कठिन हिब्रू पदबंधों को सहज बनाने के नाम पर उनका अर्थ अत्यधिक निश्चित नहीं किया गया।
