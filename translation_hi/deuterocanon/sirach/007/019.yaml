translation:
  language: hi
  text: समझदार पत्नी[a] का तिरस्कार मत करो; उसका मनोहर गुण मोतियों[b] से बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समझदार स्त्री’ अथवा ‘विवेकी पत्नी।’ हिब्रू शब्द सूझ-बूझ और अच्छे विवेक पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू पदबंध संक्षिप्त है और इसका अर्थ ‘उसका मनोहर गुण मोतियों (या किसी बहुमूल्य रत्न) से बढ़कर है’ समझा जा सकता है। यूनानी पाठ है: ‘किसी बुद्धिमान और भली स्त्री को न चूको, क्योंकि उसका अनुग्रह सोने से बढ़कर है।’'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: तिरस्कार मत करो
  rationale: מָאַס में ठुकराने या तुच्छ समझने का भाव है। संबंधपरक चेतावनी में ‘तिरस्कार मत करो’ इसके कड़े उपेक्षापूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: समझदार पत्नी
  rationale: שכל से बना रूप सूझ-बूझ, विवेक और समझ पर बल देता है। प्रसंग में אִשָּׁה का अर्थ ‘पत्नी’ अधिक स्वाभाविक है, यद्यपि ‘स्त्री’ भी भाषिक रूप से संभव है।
- source_word: וְטוֹבַת חֵן
  choice: उसका मनोहर गुण
  rationale: यह संक्षिप्त हिब्रू पदबंध अनुग्रह, आकर्षण या मनभावन स्वभाव का बोध कराता है। ‘मनोहर गुण’ इसे केवल शारीरिक सुंदरता तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है; स्त्री से इसका संबंध प्रसंग से स्पष्ट किया गया है।
- source_word: מִפְּנִינִים
  choice: मोतियों से बढ़कर
  rationale: פְּנִינִים किसी अत्यंत मूल्यवान रत्न या विलास-वस्तु को सूचित करता है और इसका पारंपरिक संभावित अर्थ ‘मोती’ है। तुलनात्मक מִן को ‘से बढ़कर’ से व्यक्त किया गया है।
theological_decisions:
- issue: अִשָּׁה का संदर्भ
  choice: पत्नी
  alternative: स्त्री
  rationale: घर-परिवार और संबंधों से जुड़ी शिक्षाओं के प्रसंग में ‘पत्नी’ अधिक विशिष्ट और स्वाभाविक है, पर मूल शब्द अपने आप में ‘स्त्री’ भी हो सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: וְטוֹבַת חֵן का स्त्री से संबंध
  choice: उसका मनोहर गुण
  alternative: और मनोहर अनुग्रह मोतियों से बढ़कर है
  rationale: हिब्रू पदबंध संक्षिप्त है और उसमें स्पष्ट सर्वनाम नहीं है। प्रसंग तथा यूनानी समानांतर पाठ स्त्री के गुण की ओर संकेत करते हैं, इसलिए मुख्य पाठ में संबंध स्पष्ट किया गया, जबकि टिप्पणी में मूल की संक्षिप्तता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। ‘मनोहर गुण’ חֵן के आकर्षण, अनुग्रह और मनभावन चरित्र की व्यापकता को बनाए रखता है तथा उसे केवल बाहरी रूप-सौंदर्य तक सीमित नहीं करता।
