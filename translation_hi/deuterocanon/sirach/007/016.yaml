translation:
  language: hi
  text: अपने घमंड को बहुत ही नीचा कर[a], क्योंकि मनुष्य की आशा कीड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “अपने आपको पापियों की भीड़ में मत गिन।” यह केवल शब्दों का छोटा अंतर नहीं, बल्कि किसी भिन्न पाठ-परंपरा को दर्शाता जान पड़ता है।'
    reason: textual_variant
lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: बहुत ही
  rationale: दोहराया हुआ क्रियाविशेषण आज की स्वाभाविक हिन्दी में प्रबल बलाघात व्यक्त करता है; शब्दशः दोहराव की अपेक्षा यह अधिक सहज है।
- source_word: הַשְׁפִּיל
  choice: नीचे कर
  rationale: हिफ़ील आज्ञार्थक रूप सक्रिय रूप से नीचा करने की माँग करता है। यह चयन मूल बिंब और आज्ञा का बल बनाए रखता है।
- source_word: גַּאֲוָה
  choice: अपने घमंड को
  rationale: ‘घमंड’ आत्मोन्नति और अहंकार का स्वाभाविक आधुनिक हिन्दी रूप है। ‘अपने’ हिन्दी में आज्ञा का आशय स्पष्ट करता है, यद्यपि इब्रानी संज्ञा में यह अलग शब्द के रूप में नहीं है।
- source_word: תִקְוַת
  choice: की आशा
  rationale: תקוה का सामान्य अर्थ ‘आशा’ या ‘अपेक्षा’ है। कठिन कथन को ‘अंत’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह नश्वर और दुर्बल मानव को सूचित करता है; ‘मनुष्य’ एकवचन और व्यापक मानवीय अर्थ दोनों को स्वाभाविक रूप से रखता है।
- source_word: רִמָּה
  choice: कीड़े
  rationale: यह सड़न से जुड़े कृमियों को दर्शाता है। ‘कीड़े’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है तथा मृत्युशीलता का चित्र बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परंपराओं में बड़ा अंतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी वाचन का अनुसरण: ‘अपने घमंड को बहुत ही नीचे कर, क्योंकि मनुष्य की आशा कीड़े हैं।’'
  alternative: 'यूनानी समानांतर: ‘अपने आपको पापियों की भीड़ में मत गिन।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वही प्राथमिक स्रोत है। यूनानी वाचन समान अर्थ का छोटा शब्दांतर नहीं, बल्कि अलग पाठ-परंपरा का प्रमाण है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘मनुष्य की आशा कीड़े हैं’ की कठिन धर्मवैचारिक छवि
  choice: ‘आशा’ और ‘कीड़े’ को बिना नरम किए बनाए रखना
  alternative: ‘मनुष्य का अंत कीड़े हैं’
  rationale: ‘अंत’ कथन का संभावित आशय स्पष्ट करता, पर תקוה के सामान्य अर्थ को बदल देता। मूल की विडंबना और मृत्युशीलता संबंधी तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त ज्ञान-साहित्यीय शैली। ‘नीचे कर’ मूल के सक्रिय रूपक को रखता है; ‘बहुत ही’ दोहरे מְאֹד का स्वाभाविक प्रबल बलाघात देता है।
