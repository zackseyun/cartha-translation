base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/030.yaml
  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: hi
  text: अपनी सारी शक्ति से[a] अपने रचयिता से प्रेम कर, और उसके सेवकों[b] को न त्याग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सारे सामर्थ्य से’ अथवा ‘अपनी पूरी ताकत से’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘सेवकों’ से विशेष रूप से वे लोग अभिप्रेत हो सकते हैं जो ईश्वर की पवित्र या मन्दिर-सेवा करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: अपनी सारी शक्ति से
  rationale: इस इब्रानी मुहावरे में पूर्ण शक्ति या सामर्थ्य का भाव है; यूनानी ἐν ὅλῃ δυνάμει भी इसकी पुष्टि करता है। यह हिन्दी में स्वाभाविक है और संपूर्ण समर्पण का बल बनाए रखता है।
- source_word: אֱהוֹב
  choice: प्रेम कर
  rationale: אהב के आज्ञार्थक रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: עוֹשֶׂךָ
  choice: अपने रचयिता
  rationale: शाब्दिक अर्थ ‘तुझे बनानेवाला’ है। ‘रचयिता’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में ईश्वर के सृजनकर्ता होने का व्यक्तिगत संबंध व्यक्त करता है।
- source_word: מְשָׁרְתָיו
  choice: उसके सेवकों
  rationale: שרת सेवा करने, विशेषकर औपचारिक या पवित्र सेवा, का संकेत दे सकता है। ‘सेवक’ हिन्दी में स्वाभाविक है, जबकि संभावित मन्दिर या धार्मिक-सेवा संबंधी विशेष अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹא תַעֲזֹב
  choice: न त्याग
  rationale: עזב का अर्थ छोड़ना, त्यागना या असहाय छोड़ देना है। ‘न त्याग’ मूल निषेध की नैतिक दृढ़ता को बनाए रखता है।
theological_decisions:
- issue: עוֹשֶׂךָ का ईश्वर-संबंधी अर्थ
  choice: अपने रचयिता
  alternative: तुझे बनानेवाले
  rationale: संदर्भ में बनानेवाला ईश्वर है। ‘रचयिता’ इस अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े स्पष्ट और संक्षिप्त रखता है।
- issue: מְשָׁרְתָיו / λειτουργοὺς का दायरा
  choice: उसके सेवकों
  alternative: उसकी पवित्र सेवा करनेवालों
  rationale: मूल शब्द सामान्य सेवा और अधिक विशिष्ट धार्मिक या मन्दिर-सेवा, दोनों की संभावना रखता है। मुख्य पाठ में व्यापक ‘सेवकों’ और पादटिप्पणी में विशिष्ट संभावना रखने से मूल की अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली अपनाई गई है। इब्रानी के एकवचन पुल्लिंग आज्ञार्थ को हिन्दी के सामान्य उपदेशात्मक एकवचन ‘कर/त्याग’ से रखा गया है; अनावश्यक रूप से साम्प्रदायिक पदावली नहीं जोड़ी गई।
