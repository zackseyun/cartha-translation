  yaml_path: translation/deuterocanon/sirach/007/003.yaml
  text: Do not seek authority from God[a], nor from the king a seat of honor.
translation:
  language: hi
  text: परमेश्वर से शासनाधिकार मत माँग, और राजा से सम्मान का आसन भी मत माँग।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में यहाँ एक भिन्न कथन है: “पुत्र, अन्याय की क्यारियों में बीज न बोना, और तुम उनकी फसल सात गुनी नहीं काटोगे।” मुख्य पाठ इस पद के उपलब्ध इब्रानी पाठ-साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: न माँगना
  rationale: בקש का अर्थ खोजने, चाहने या माँगने से हो सकता है। यहाँ מֵאֵל और מִמֶּלֶךְ के साथ किसी से पद या अधिकार माँगने का भाव स्वाभाविक है; निषेधात्मक उपदेश के लिए ‘न माँगना’ सहज आधुनिक हिन्दी है।
- source_word: מֵאֵל
  choice: परमेश्वर से
  rationale: אֵל यहाँ ईश्वर के लिए सामान्य पद है। ‘परमेश्वर’ आधुनिक गरिमापूर्ण हिन्दी में स्पष्ट है और मूल से कोई अतिरिक्त विशिष्ट उपाधि नहीं जोड़ता।
- source_word: מֶמְשֶׁלַת
  choice: अधिकार
  rationale: ממשלה शासन, प्रभुत्व या शासकीय अधिकार को दर्शाता है। ‘अधिकार’ पद या सत्ता की व्यापक धारणा को बनाए रखता है और इसे केवल भू-राज्य तक सीमित नहीं करता।
- source_word: וְכֵן
  choice: और न
  rationale: शाब्दिक अर्थ ‘और इसी प्रकार’ है; पहले निषेध के समानांतर दूसरे निषेध को स्वाभाविक हिन्दी में ‘और न’ व्यक्त करता है।
- source_word: מִמֶּלֶךְ
  choice: राजा से
  rationale: מן का अर्थ ‘से’ है और מֶלֶךְ एकवचन ‘राजा’ है। हिन्दी में बिना निश्चित उपपद के यह सामान्य अथवा प्रसंगगत राजा दोनों के लिए स्वाभाविक है।
- source_word: מוֹשַׁב כָּבוֹד
  choice: सम्मान का आसन
  rationale: מוֹשב बैठने का आसन, स्थान या पद हो सकता है और כבוד सम्मान का भाव देता है। ‘सम्मान का आसन’ मूल बिंब को बनाए रखता है, यद्यपि इसमें प्रतिष्ठित पद का निहितार्थ भी है।
theological_decisions:
- issue: इस पद के इब्रानी और यूनानी पाठ-साक्ष्यों का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और यूनानी के भिन्न कथन को पादटिप्पणी में दर्ज करना
  alternative: “पुत्र, अन्याय की क्यारियों में बीज न बोना, और तुम उनकी फसल सात गुनी नहीं काटोगे।”
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वही प्राथमिक स्रोत है। यहाँ यूनानी साक्ष्य का कथन विषय और शब्दों दोनों में मूलतः भिन्न है; इसलिए दोनों को मिलाकर पाठ बनाने के बजाय इब्रानी को मुख्य पाठ में और यूनानी को पाठांतर के रूप में देना स्रोतगत तनाव को ईमानदारी से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण उपदेशात्मक शैली रखी गई है। ‘सम्मान का आसन’ मूल के ठोस बिंब को बचाता है और सामान्य पाठक के लिए प्रतिष्ठित स्थान या पद का अर्थ भी संप्रेषित करता है।
