  yaml_path: translation/deuterocanon/sirach/007/024.yaml
  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: hi
  text: क्या तुम्हारी बेटियाँ हैं? उनके शरीर की रक्षा करो, और उनके प्रति प्रसन्न मुख मत दिखाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “उनकी ओर अपना चेहरा उजला न करो।” सम्भवतः आशय है: उनके प्रति अत्यधिक नरम या लाड़-प्यार करने वाले न बनो।'
    reason: मुहावरे के शाब्दिक मुख-संबंधी बिंब और उसके सम्भावित आशय दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: בָּנוֹת לְךָ / θυγατέρες σοί εἰσιν
  choice: क्या तुम्हारी बेटियाँ हैं?
  rationale: इब्रानी का संक्षिप्त अस्तित्वसूचक वाक्यांश और यूनानी समानांतर दोनों ‘तुम्हारी बेटियाँ हैं?’ का भाव देते हैं। प्रश्नात्मक हिन्दी इसके प्रसंगगत उपदेशात्मक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: נְצוֹר / πρόσεχε
  choice: रक्षा करो
  rationale: इब्रानी क्रिया का अर्थ सुरक्षित रखना, पहरा देना या सावधानी से देखना है; यूनानी समानांतर भी सचेत देखभाल का समर्थन करता है।
- source_word: שְׁאֵרָם / τῷ σώματι αὐτῶν
  choice: उनके शरीर
  rationale: इब्रानी שְׁאֵר का मूल अर्थ मांस या देह हो सकता है, और यूनानी इसे स्पष्टतः ‘शरीर’ के रूप में समझता है। इसलिए ‘पवित्रता’ जैसे अधिक व्याख्यात्मक अर्थ के बजाय ठोस देह-संबंधी भाषा रखी गई है।
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים / καὶ μὴ ἱλαρώσῃς πρὸς αὐτὰς τὸ πρόσωπόν σου
  choice: उनके सामने अपना चेहरा प्रसन्न न करो
  rationale: यह स्रोत की मुख-मुद्रा वाली ठोस उपमा को बनाए रखता है। सम्भावित आशय अत्यधिक नरमी या लाड़ है, पर उसे मुख्य पाठ में निर्णायक रूप से आरोपित नहीं किया गया।
theological_decisions:
- issue: माता-पिता को दी गई चेतावनी का नैतिक आशय
  choice: चेहरा प्रसन्न न करने की मूल उपमा को बनाए रखना
  alternative: उनके प्रति अधिक नरम या लाड़-प्यार करने वाले न बनो
  rationale: मूल बिंब को रखने से पाठ को किसी विशिष्ट आधुनिक पालन-पोषण सिद्धान्त में सीमित नहीं किया जाता; पादटिप्पणी सम्भावित मुहावरेदार अर्थ स्पष्ट करती है।
- issue: שְׁאֵרָם का अर्थ
  choice: उनके शरीर
  alternative: उनकी शुचिता
  rationale: यूनानी समानांतर σώμα ‘शरीर’ इस ठोस अर्थ की पुष्टि करता है। ‘शुचिता’ प्रसंगानुकूल सम्भव व्याख्या है, पर मूल शब्द से अधिक विशिष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली। ‘शरीर’ मूल इब्रानी और यूनानी साक्ष्य की ठोस भाषा रखता है; कठिन मुख-मुद्रा वाले मुहावरे को पादटिप्पणी में समझाया गया है।
