base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/023.yaml
  text: Do you have sons? Discipline them[a], and get wives for them in their youth.
translation:
  language: hi
  text: क्या तुम्हारे बेटे हैं? उन्हें अनुशासित करो,[a] और जब वे युवा हों, उनका विवाह करा दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “क्या तुम्हारे बच्चे हैं? उन्हें अनुशासित करो, और युवावस्था से ही उनकी गर्दन झुका दो।” इसके विपरीत, इब्रानी पाठ में है: “...और जब वे युवा हों, उनका विवाह करा दो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: बेटे
  rationale: इब्रानी बहुवचन यहाँ विशेष रूप से पुत्रों को दर्शाता है; आगे उनके लिए पत्नियाँ लेने का निर्देश भी इसी अर्थ की पुष्टि करता है।
- source_word: יַסֵּר
  choice: अनुशासन में रखो
  rationale: क्रिया में सुधार, शिक्षा और प्रशिक्षण के लिए अनुशासन देने का भाव है। यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त व्यापक है।
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: उनका विवाह करा दो
  rationale: इब्रानी मुहावरा उनके लिए पत्नियाँ प्राप्त करने, अर्थात माता-पिता द्वारा उनका विवाह कराने, को व्यक्त करता है। शाब्दिक 'उनके लिए पत्नियाँ ले लो' की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है।
- source_word: בִּנְעוּרֵיהֶם
  choice: उनकी युवावस्था में
  rationale: यह समयसूचक वाक्यांश विवाह कराने के निर्देश से जुड़ता है और उनके युवा रहते ऐसा करने का अर्थ देता है।
theological_decisions:
- issue: दूसरे अर्धवाक्य में इब्रानी और यूनानी पाठ का अंतर
  choice: 'इब्रानी पाठ के अनुसार: ''उनकी युवावस्था में उनका विवाह करा दो'''
  alternative: 'यूनानी समानांतर पाठ: ''और युवावस्था से ही उनकी गर्दन झुका दो'''
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध और सुसंगत है, उसे मुख्य पाठ में प्राथमिकता दी गई है। यूनानी पाठ एक वास्तविक और महत्त्वपूर्ण वैकल्पिक पाठ प्रस्तुत करता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। 'विवाह करा दो' प्राचीन पारिवारिक व्यवस्था में अभिभावक की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी पाठांतर को बिना समरस किए पादटिप्पणी में दिया गया है।
