base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/031.yaml
  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: hi
  text: परमेश्वर का आदर करो और याजक को सम्मान दो[a], और उन्हें उनका भाग दो[b], जैसा तुम्हें आदेश दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “प्रभु का भय मानो और याजक की महिमा करो, और उसे उसका भाग दो, जैसा आरम्भ से तुम्हें आदेश दिया गया है”; इसके बाद याजकीय देयों की अधिक विस्तृत सूची आती है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “उनका भाग” बहुवचन है, जो सम्भवतः याजकों के लिए नियत अंशों को सामूहिक रूप से बताता है; यूनानी समानांतर में एकवचन, “उसका भाग,” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד אֵל
  choice: परमेश्वर का आदर करो
  rationale: पिएल आज्ञार्थक כבד का अर्थ उचित आदर देना है। אֵל को उपलब्ध इब्रानी पाठ के अनुसार सामान्य और स्वाभाविक हिन्दी में ‘परमेश्वर’ कहा गया है।
- source_word: וַהֲדַר כֹּהֵן
  choice: और याजक को सम्मान दो
  rationale: הדר यहाँ सम्मान या प्रतिष्ठा देने का भाव रखता है। ‘सम्मान दो’ पहले खंड की अर्थगत समानता बनाए रखते हुए अनावश्यक शब्दशः पुनरावृत्ति से बचता है। כֹּהֵן का एकवचन याजकीय पद का प्रतिनिधि है।
- source_word: וְתֵן חֶלְקָם
  choice: उनका भाग उन्हें दो
  rationale: חֶלְקָם में बहुवचन प्रत्यय स्पष्ट है, इसलिए ‘उनका भाग’ रखा गया है। हिन्दी में ‘उन्हें’ जोड़ने से देने की क्रिया का आशय स्वाभाविक और स्पष्ट होता है, और बहुवचन याजकों के सामूहिक अधिकार की ओर संकेत कर सकता है।
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: जैसा तुम्हें आदेश दिया गया है
  rationale: निष्क्रिय क्रिया उस पूर्व आदेश को व्यक्त करती है जो संबोधित व्यक्ति को दिया गया था। यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
theological_decisions:
- issue: मुख्य पाठ में ईश्वरीय संबोधन
  choice: इब्रानी אֵל के अनुसार ‘परमेश्वर’
  alternative: यूनानी समानांतर के अनुसार ‘प्रभु’
  rationale: जहाँ इब्रानी पाठ स्पष्ट और उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी पाठ का κύριον महत्त्वपूर्ण वैकल्पिक साक्ष्य है, इसलिए उसे पादटिप्पणी में बताया गया है।
- issue: חֶלְקָם में अधिकारसूचक प्रत्यय की संख्या
  choice: बहुवचन ‘उनका भाग’ बनाए रखना
  alternative: यूनानी के अनुरूप एकवचन ‘उसका भाग’ अथवा व्याख्यात्मक ‘याजक का भाग’
  rationale: इब्रानी में प्रत्यय बहुवचन है और संदर्भ में इसे याजकों के सामूहिक नियत अंश के रूप में समझा जा सकता है। इसे चुपचाप एकवचन करना मूल पाठ की वास्तविक व्याकरणिक विषमता मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘आदर’ और ‘सम्मान’ से इब्रानी के निकटार्थी किन्तु भिन्न क्रियापदों का संबंध सुरक्षित है; ‘याजक’ धार्मिक पद के लिए प्रचलित बाइबलीय हिन्दी है।
