base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/018.yaml
  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: hi
  text: किसी मित्र का दाम के बदले सौदा मत करो,[b] और न उस भाई का, जिसका मोल ओपीर के सोने के बराबर है।[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी पाठ बहुत भिन्न है: “याद रखो कि क्रोध अधिक समय तक नहीं रहता।” काहिरा गनीज़ा में सुरक्षित इब्रानी साक्ष्य इसके बजाय धन के लिए मित्र या भाई को त्यागने से सावधान करता है।'
    reason: textual_variant
  - marker: b
    text: या “किसी मित्र का भुगतान के बदले सौदा मत करो।”
    reason: lexical_alternative
  - marker: c
    text: “भाई” का अर्थ सगा भाई हो सकता है, और व्यापक अर्थ में निकट संबंधी या घनिष्ठ साथी भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִיר
  choice: दे डालो
  rationale: यहाँ हिफ़ील रूप का अर्थ किसी को दूसरी वस्तु या लाभ के बदले छोड़ देना अथवा सौदा करके दे देना है। “दाम के बदले मत दे डालो” हिन्दी में व्यापारिक भाव और चेतावनी की तीव्रता दोनों बनाए रखता है।
- source_word: אוֹהֵב
  choice: मित्र
  rationale: शाब्दिक अर्थ “प्रेम करने वाला” है, पर ज्ञान-साहित्य में यह निष्ठावान मित्र या साथी के लिए स्वाभाविक पद है।
- source_word: בִּמְחִיר
  choice: दाम के बदले
  rationale: מְחִיר मूल्य, दाम या भुगतान को दर्शाता है। यह अनुवाद धन के लिए संबंध त्यागने का व्यापारिक भाव रखता है, पर भुगतान का माध्यम अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אָח
  choice: भाई
  rationale: मूल शब्द का सीधा अर्थ “भाई” है। इसका आशय सगा भाई, निकट संबंधी या घनिष्ठ साथी भी हो सकता है; मुख्य पाठ में ठोस पारिवारिक शब्द सुरक्षित रखा गया है।
- source_word: תָּלוּי
  choice: जिसका मोल ... के बराबर है
  rationale: यह रूप इस स्थान पर कठिन है। दाम और ओपीर के सोने वाले समानांतर वाक्यांशों के कारण इसे मूल्यांकन या तुलना के अर्थ में समझना सबसे संगत है। अनुवाद इस अर्थ को स्पष्ट करता है, पर किसी अधिक विशिष्ट पाठ-पुनर्निर्माण का दावा नहीं करता।
- source_word: בִּזְהַב אוֹפִיר
  choice: ओपीर के सोने
  rationale: ओपीर बाइबलीय परंपरा में अत्यंत बहुमूल्य सोने के स्रोत के रूप में प्रसिद्ध है। स्थान-नाम बनाए रखने से सांस्कृतिक और साहित्यिक संकेत सुरक्षित रहता है।
theological_decisions:
- issue: इब्रानी साक्ष्य और बहुत भिन्न यूनानी पाठ में चयन
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: “याद रखो कि क्रोध अधिक समय तक नहीं रहता।”'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिक आधार माना गया है। यहाँ यूनानी और इब्रानी पाठों का अंतर साधारण शब्दांतर नहीं, बल्कि अलग पाठ-परंपरा का संकेत है; इसलिए यूनानी पाठ को व्याख्या में मिलाने के बजाय पादटिप्पणी में पूरा बताया गया है।
- issue: אָח תָּלוּי की कठिन अभिव्यक्ति
  choice: भाई के मोल की तुलना ओपीर के सोने से
  alternative: “सच्चा भाई” या अधिक शाब्दिक “लटका/निर्भर भाई”
  rationale: “सच्चा” मूल में नहीं है, जबकि “लटका हुआ” इस संदर्भ में अस्पष्ट और अस्वाभाविक होगा। मूल्य-संबंधी पहले अर्धांश और सोने के उल्लेख के आधार पर तुलना का अर्थ लिया गया है, साथ ही पाठ की कठिनता को स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूक्तिपरक रखी गई है। “दाम के बदले मत दे डालो” व्यापारिक रूपक को सामान्य पाठक के लिए स्वाभाविक बनाता है। “मोल ... के बराबर” कठिन इब्रानी तָּלוּי की संभावित मूल्य-तुलना को स्पष्ट करता है, जबकि पादटिप्पणी भिन्न यूनानी परंपरा को ईमानदारी से सुरक्षित रखती है।
