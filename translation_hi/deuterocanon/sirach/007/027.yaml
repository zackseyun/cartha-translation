base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/027.yaml
  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: hi
  text: अपने पूरे मन से अपने पिता का आदर कर, और अपनी माँ की प्रसव-पीड़ा को मत भूल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दूसरी पंक्ति संक्षिप्त है—लगभग, “और तुझे जन्म देनेवाली माँ को मत…”। यूनानी समानांतर इसका अर्थ स्पष्ट करता है: “अपनी माँ की प्रसव-पीड़ा को मत भूल।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: अपने पूरे मन से
  rationale: यह इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है, जो पूरे मन और सच्ची निष्ठा का भाव बनाए रखता है।
- source_word: כַּבֵּד לְאָבִיךָ
  choice: अपने पिता का आदर कर
  rationale: כבד का पारिवारिक संदर्भ में अर्थ उचित सम्मान देना है; यह हिन्दी में स्पष्ट और बाइबलीय प्रयोग के अनुरूप है।
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: अपनी माँ
  rationale: इब्रानी का शाब्दिक भाव ‘और वह माँ जिसने तुझे जन्म दिया’ है। संक्षिप्त हिन्दी में संबंध स्पष्ट है, जबकि जन्म देने का कष्ट अगले पदांश में सुरक्षित रहता है।
- source_word: אַל תִּשֶּׁה
  choice: मत भूल
  rationale: इब्रानी पदांश संक्षिप्त है; यूनानी समानांतर μὴ ἐπιλάθῃ स्पष्ट रूप से ‘मत भूल’ का समर्थन करता है।
- source_word: μητρὸς ὠδῖνας
  choice: अपनी माँ की प्रसव-पीड़ा
  rationale: यूनानी समानांतर इब्रानी की संक्षिप्त दूसरी पंक्ति को माँ के प्रसव-कष्ट के रूप में स्पष्ट करता है। ‘प्रसव-पीड़ा’ आधुनिक, गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: विद्यमान इब्रानी पाठ और यूनानी समानांतर के बीच संबंध
  choice: इब्रानी को प्राथमिक रखते हुए संक्षिप्त अंतिम वाक्यांश को यूनानी समानांतर के आधार पर ‘अपनी माँ की प्रसव-पीड़ा को मत भूल’ के रूप में प्रस्तुत किया गया।
  alternative: 'केवल इब्रानी की कठोर शाब्दिक रचना रखना: ‘और जन्म देनेवाली माँ को मत…’, जिससे क्रिया का आशय अस्पष्ट रहता।'
  rationale: यूनानी पाठ इब्रानी के विपरीत कोई अलग धर्मवैज्ञानिक अर्थ नहीं जोड़ता, बल्कि उसके संक्षिप्त और कठिन वाक्यांश का सुसंगत अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन अनौपचारिक आज्ञार्थक शैली (‘कर’, ‘मत भूल’) मूल इब्रानी के एकवचन संबोधन को सुरक्षित रखती है। शब्दावली सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है।
