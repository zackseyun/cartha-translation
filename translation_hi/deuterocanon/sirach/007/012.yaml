translation:
  language: hi
  text: किसी भाई के विरुद्ध हिंसा की योजना न बना[a]; और उसी तरह मित्र और साथी—दोनों के विरुद्ध हिंसा की योजना मत बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘योजना न बना’—इब्रानी क्रिया का मूल अर्थ ‘हल चलाना’ है; ‘हिंसा को हल चलाना’ यहाँ हिंसा की योजना बनाने का रूपक है। यूनानी समानांतर पाठ में ‘हिंसा’ के स्थान पर ‘झूठ’ है: ‘अपने भाई के विरुद्ध झूठ मत रच।’'
    reason: इब्रानी रूपक और यूनानी पाठांतर को सटीक तथा स्पष्ट रूप से दर्शाना।
lexical_decisions:
- source_word: תַּחֲרוֹשׁ
  choice: योजना न बना
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘हल चलाना’ है, पर यहाँ חָרַשׁ का प्रयोग किसी हानिकारक काम की योजना गढ़ने के अर्थ में है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, अन्याय या हिंसक हानि का बोध करा सकता है; यहाँ सीधा और व्यापक अर्थ ‘हिंसा’ उपयुक्त है।
- source_word: אָח
  choice: भाई
  rationale: यह रक्त-संबंधी भाई या अपने समुदाय के व्यक्ति—दोनों का बोध करा सकता है; ‘भाई’ मूल की इस व्यापकता को बनाए रखता है।
- source_word: רֵעַ וְחָבֵר יַחְדָּו
  choice: मित्र और साथी—दोनों
  rationale: दो निकटार्थक संबंध-संज्ञाओं तथा יַחְדָּו के संयुक्त बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ‘भाई’ की पहचान
  choice: सामान्य ‘भाई’ रखा गया
  alternative: ‘स्वजातीय’ या ‘समुदाय के भाई’
  rationale: इब्रानी אָח में पारिवारिक और सामुदायिक दोनों अर्थ संभव हैं; पाठ स्वयं दायरा निश्चित नहीं करता।
- issue: मनाही का विषय
  choice: हिंसा की योजना बनाने की मनाही
  alternative: झूठ गढ़ने की मनाही
  rationale: उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ में חָמָס ‘हिंसा/अन्याय’ है; यूनानी समानांतर में ψεῦδος ‘झूठ’ है, पर प्राथमिक अनुवाद इब्रानी स्रोत पर आधारित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन निषेधात्मक संबोधन, सरल किंतु गरिमापूर्ण शब्दावली। ‘दोनों’ से יַחְדָּו का बल स्वाभाविक रूप में व्यक्त किया गया है।
