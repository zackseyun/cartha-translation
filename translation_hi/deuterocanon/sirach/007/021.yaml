  text: Love an intelligent servant as yourself[a], and do not withhold freedom from him.
translation:
  language: hi
  text: समझदार[a] दास को अपने प्राण के समान प्रिय रखो, और उसे स्वतंत्रता से वंचित न रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में “समझदार”; यूनानी समानांतर पाठ में “अच्छा”: “अच्छे दास को अपने प्राण के समान प्रिय रखो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द बंधुआ दास को सूचित करता है; आगे स्वतंत्रता न रोकने की आज्ञा से उसकी पराधीन स्थिति स्पष्ट है। ‘दास’ आधुनिक हिन्दी में गरिमापूर्ण और बाइबिलीय प्रसंग के अनुकूल है, जबकि संदर्भ इसे केवल सामान्य सेवक समझने से रोकता है।
- source_word: מַשְׂכִּיל
  choice: समझदार
  rationale: यह ऐसे व्यक्ति को दर्शाता है जो समझ-बूझ रखता और सूझ-बूझ से काम करता है। ‘समझदार’ सहज आधुनिक हिन्दी है और इब्रानी पाठ का अर्थ सुरक्षित रखता है।
- source_word: חַבֵּב
  choice: प्रिय रखो
  rationale: आज्ञार्थक क्रिया स्नेह और गहरे आदर का भाव व्यक्त करती है। ‘प्रिय रखो’ प्रेमपूर्ण मूल्यांकन को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: כְּנֶפֶשׁ
  choice: अपने प्राण के समान
  rationale: शाब्दिक रूप से ‘प्राण/जीवन के समान’ का भाव है। यह हिन्दी में समझने योग्य रहते हुए मूल की देह-प्राण संबंधी अभिव्यक्ति और उसके नैतिक बल को बनाए रखता है।
- source_word: וְאַל תִּמְנַע
  choice: और ... से वंचित न रखो
  rationale: क्रिया किसी वस्तु को रोक रखने या न देने का अर्थ देती है। स्वतंत्रता के साथ ‘वंचित न रखो’ स्वाभाविक और अर्थ-सटीक है।
- source_word: חֹפֶשׁ
  choice: स्वतंत्रता
  rationale: यह दासत्व से मुक्त अवस्था या रिहाई को दर्शाता है। ‘स्वतंत्रता’ स्पष्ट, वर्तमान और गैर-तकनीकी हिन्दी है।
theological_decisions:
- issue: עֶבֶד के सामाजिक दर्जे को कैसे व्यक्त किया जाए
  choice: दास
  alternative: सेवक
  rationale: स्वतंत्रता न रोकने का अगला वाक्यांश बंधुआ स्थिति को स्पष्ट करता है; इसलिए ‘सेवक’ की अपेक्षा ‘दास’ स्रोत के सामाजिक यथार्थ को अधिक ठीक ढंग से व्यक्त करता है।
- issue: כְּנֶפֶשׁ में तुलना का आशय
  choice: अपने प्राण के समान
  alternative: अपने समान
  rationale: इब्रानी अभिव्यक्ति को अत्यधिक व्याख्यायित किए बिना उसके शाब्दिक और भावात्मक तनाव को बचाने के लिए ‘प्राण’ रखा गया है; इसका आशय अपने जीवन के समान मूल्यवान समझना है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आज्ञार्थक एकवचन के लिए आदरसूचक/सामान्य ‘रखो’ प्रयोग हुआ है। ‘दास’ पराधीन सामाजिक स्थिति को व्यक्त करता है, और ‘अपने प्राण के समान’ मूल इब्रानी रूपक को हिन्दी में सुरक्षित रखता है।
