base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/015.yaml
  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: hi
  text: अपने आपको लोगों के मृतकों में मत गिनो; याद रखो, मृत्यु किसी को छोड़कर नहीं गुज़रेगी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी की दूसरी पंक्ति कठिन है और עבר मूल पर शब्दालंकार करती जान पड़ती है। इसे अधिक शाब्दिक ढंग से, “याद रखो, गुज़र जाना टल नहीं जाएगा,” भी समझा जा सकता है; भाव यह है कि मृत्यु या नश्वरता किसी को नहीं छोड़ती।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी परम्परा में यहाँ बहुत भिन्न पाठ है: “कठिन परिश्रम और परमप्रधान द्वारा रची गई खेती से घृणा न करो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: अपने को ... मत गिनो
  rationale: חשב का मूल भाव ‘गिनना/मानना’ है। यह प्रयोग किसी वर्ग में अपने को गिनने की मनाही व्यक्त करता है; हिन्दी में ‘अपने को ... मत गिनो’ स्वाभाविक और मूल के निकट है।
- source_word: בָּמֳתֵי עָם
  choice: लोगों के ऊँचे पदवालों में
  rationale: दिए गए स्वरांकन में בָּמֳתֵי, במה (‘ऊँचा स्थान/ऊँचाई’) का बहुवचन-सम्बन्ध रूप है। सन्दर्भ में इसे समुदाय के ऊँचे या प्रतिष्ठित लोगों के लिए रूपक मानकर अनूदित किया गया है। पाठ संक्षिप्त और कठिन है, इसलिए अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: זְכוֹר
  choice: याद रखो
  rationale: זכר के आज्ञार्थक रूप का सीधा, स्वाभाविक हिन्दी अनुवाद।
- source_word: עִבָּרוֹן
  choice: प्रकोप
  rationale: यह दुर्लभ और कठिन संज्ञा עבר मूल से सम्बद्ध है और ‘क्रोध/प्रकोप’ अथवा ‘गुज़रना’ जैसे अर्थों का संकेत दे सकती है। अगले समान-मूल क्रियापद के साथ शब्दालंकार है। मुख्य पाठ में ‘प्रकोप’ चेतावनी के भाव को बनाए रखता है, पर वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: לֹא יִתְעַבָּר
  choice: टल नहीं जाएगा
  rationale: התעבר/עבר से बना यह रूप यहाँ किसी आने वाली बात के न टलने या न गुज़रने का भाव दे सकता है। ‘टल नहीं जाएगा’ हिन्दी में चेतावनी को स्पष्ट रखता है और उसके अनिवार्य होने का भाव देता है।
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी परम्परा उपलब्ध इब्रानी से मूलतः भिन्न पाठ देती है। चूँकि यहाँ उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य उपलब्ध है, मुख्य पाठ उसी पर आधारित है और यूनानी पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी परम्परा के बीच बड़ा पाठान्तर
  choice: मुख्य पाठ में इब्रानी साक्ष्य का अनुसरण; यूनानी पाठ पाद-टिप्पणी में
  alternative: “कठिन परिश्रम से और परमप्रधान द्वारा रची गई खेती से घृणा न करो।”
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है। दोनों परम्पराओं को मिलाकर नया पाठ बनाने के बजाय मुख्य पाठ इब्रानी का अनुवाद करता है और महत्त्वपूर्ण यूनानी पाठान्तर को पारदर्शी ढंग से दर्ज करता है।
- issue: עִבָּרוֹן और יִתְעַבָּר का कठिन शब्दालंकार
  choice: “प्रकोप टल नहीं जाएगा”
  alternative: “मृत्यु किसी को छोड़कर नहीं गुज़रेगी” अथवा “गुज़र जाना टल नहीं सकता”
  rationale: इब्रानी शब्दों का सटीक आशय अनिश्चित है। मुख्य अनुवाद क्रोध/प्रकोप और उसके न टलने की सम्भावना अपनाता है, जबकि मृत्यु अथवा गुज़रने से जुड़ी सम्भावना को पाद-टिप्पणी में स्पष्ट किया गया है; इस तरह धर्मवैचारिक तनाव को चुपचाप समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञार्थक बहुवचन/आदरात्मक रूप ‘गिनो, याद रखो’ सामान्य पाठक के लिए सहज है। ‘ऊँचे पदवाले’ रूपक को स्पष्ट करता है, और ‘प्रकोप’ गरिमापूर्ण पर समझने योग्य शब्द है।
