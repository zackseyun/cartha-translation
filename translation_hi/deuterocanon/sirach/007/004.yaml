  text: Do not justify yourself before a king[a], and do not show understanding before a king.
translation:
  language: hi
  text: राजा के सामने अपने को धर्मी सिद्ध मत कर,[a] और राजा के सामने अपनी समझ का प्रदर्शन मत कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “प्रभु से शासन का पद न माँग, और राजा से महिमा का आसन न माँग।” यहाँ अपनाया गया इब्रानी पाठ इससे पर्याप्त भिन्न है।
    reason: textual_variant
lexical_decisions:
- source_word: אַל
  choice: मत
  rationale: निषेधात्मक आज्ञा के लिए आधुनिक हिन्दी का स्वाभाविक और सीधा रूप।
- source_word: תִּצְטַדֵּק
  choice: अपने को धर्मी सिद्ध मत कर
  rationale: צדק के हित्पअेल रूप की आत्मवाचक शक्ति—अपने को धर्मी या सही ठहराना—को बनाए रखता है; केवल ‘घमण्ड मत कर’ कहने जैसी व्याख्यात्मक संकीर्णता से बचता है।
- source_word: לִפְנֵי מֶלֶךְ
  choice: राजा के सामने
  rationale: לִפְנֵי का स्वाभाविक स्थानवाचक अर्थ देता है। इब्रानी में निश्चित उपपद नहीं है, इसलिए हिन्दी में सामान्य श्रेणी के अर्थ वाला ‘राजा’ रखा गया है।
- source_word: וּמִפְּנֵי מֶלֶךְ
  choice: और राजा के सामने
  rationale: पहले खंड के समानान्तर स्थानवाचक भाव और इब्रानी की पुनरावृत्ति को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: תִּתְבּוֹנֵן
  choice: अपनी समझ का प्रदर्शन मत कर
  rationale: בין के आत्मवाचक रूप को इस सामाजिक प्रसंग में केवल मनन करने के बजाय अपने को समझदार या विवेकी दिखाने की चेतावनी के रूप में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में पर्याप्त भिन्नता
  choice: उपलब्ध इब्रानी पाठ को मुख्य मानते हुए राजा के सामने अपने को धर्मी सिद्ध करने और अपनी समझ दिखाने के विरुद्ध चेतावनी का अनुवाद किया गया है।
  alternative: 'यूनानी: ‘प्रभु से शासन का पद न माँग, और राजा से महिमा का आसन न माँग।’'
  rationale: इस पद का इब्रानी साक्ष्य उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी पाठ का अर्थ बहुत भिन्न है; उसे मुख्य पाठ में मिलाकर अस्पष्टता मिटाने के बजाय पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। दोनों खंडों में ‘राजा के सामने’ दोहराकर इब्रानी समानान्तरता बनाए रखी गई है। ‘धर्मी सिद्ध’ मूल के धार्मिक-नैतिक अर्थ को खुला रखता है, जबकि ‘समझ का प्रदर्शन’ बाहरी आत्म-प्रदर्शन के भाव को व्यक्त करता है।
