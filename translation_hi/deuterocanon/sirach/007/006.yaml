  yaml_path: translation/deuterocanon/sirach/007/006.yaml
  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: hi
  text: किसी कुलीन व्यक्ति के सामने भयभीत मत होना,[a] कहीं ऐसा न हो कि तुम अपनी खराई में बेईमानी की कमाई को जगह दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “कहीं ऐसा न हो कि तुम अपनी सीधाई में ठोकर का कारण रख दो।” इब्रानी में यहाँ अधिक ठोस रूप से बेईमानी या अन्याय से प्राप्त कमाई का उल्लेख है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: डरकर पीछे न हटना
  rationale: यहाँ גור का आशय किसी प्रभावशाली व्यक्ति के सामने भयभीत होकर दब जाने या अपने कर्तव्य से पीछे हटने का है; यूनानी εὐλαβηθῇς भी भयपूर्ण संकोच का समर्थन करता है।
- source_word: נָדִיב
  choice: कुलीन व्यक्ति
  rationale: נדיב यहाँ ऊँचे सामाजिक पद और प्रभाव वाले व्यक्ति को दर्शाता है। यह इब्रानी की सामाजिक-प्रतिष्ठा की छाया बनाए रखता है, जबकि यूनानी δυνάστης उसके सामर्थ्य पर बल देता है।
- source_word: וְנָתוּן
  choice: मिला दो
  rationale: शाब्दिक अर्थ ‘रखना/देना’ है। हिन्दी में ‘खराई में ... मिला दो’ उस ठोस रूपक को स्वाभाविक ढंग से व्यक्त करता है कि भ्रष्ट लाभ नैतिक सत्यनिष्ठा में प्रवेश कर रहा है।
- source_word: בֶּצַע
  choice: बेईमानी की कमाई
  rationale: בצע लोभ या अन्याय से प्राप्त लाभ को सूचित करता है। ‘रिश्वत’ संभव है, पर इब्रानी शब्द स्वयं अधिक व्यापक है; इसलिए ‘बेईमानी की कमाई’ उसकी वास्तविक अस्पष्टता को बेहतर बनाए रखता है।
- source_word: בִּתְמִימִיךָ
  choice: अपनी खराई में
  rationale: תמים-सम्बन्धी भाषा नैतिक अखंडता, निष्कपटता और सीधेपन को व्यक्त करती है। ‘खराई’ साधारण आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा यूनानी ἐν εὐθύτητί σου से भी मेल खाती है।
theological_decisions:
- issue: इब्रानी וְנָתוּן בֶּצַע בִּתְמִימִיךָ और यूनानी ‘अपनी सीधाई में ठोकर का कारण रखना’ के बीच भिन्नता
  choice: मुख्य पाठ में इब्रानी के अनुसार बेईमानी की कमाई को अपनी खराई में मिलाने का भाव रखा गया है।
  alternative: ‘कहीं ऐसा न हो कि तुम अपनी खराई में ठोकर का कारण रख दो।’
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है और בצע अन्यायपूर्ण लाभ को दर्शाता है। यूनानी व्यापक नैतिक बाधा या समझौते का भाव देता है; उसे पादटिप्पणी में सुरक्षित रखा गया है, बिना दोनों पाठों को चुपचाप एक कर देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदेशात्मक वाक्य में आत्मीय एकवचन ‘तुम’ रखा गया है। भाषा सहज और गरिमापूर्ण है। ‘कुलीन व्यक्ति’ सामाजिक प्रतिष्ठा को, ‘डरकर पीछे हटना’ भय के कारण दबने को, और ‘खराई’ नैतिक अखंडता को व्यक्त करता है।
