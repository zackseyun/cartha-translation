base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/034.yaml
  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: hi
  text: हर जीवित व्यक्ति के सामने भेंट दे[a], और मरे हुए के प्रति भी भलाई करने से पीछे न हट।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “रोने वालों की उपेक्षा न कर, और शोक करने वालों के साथ शोक कर।” यह इस पद की एक काफी भिन्न पाठ-परंपरा को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: भेंट दे
  rationale: आज्ञार्थक תֵּן और संज्ञा מַתָּן का सीधा तथा स्वाभाविक हिन्दी रूप; ‘चढ़ावा’ कहने से अनावश्यक धार्मिक-अनुष्ठानिक अर्थ जुड़ सकता है।
- source_word: לִפְנֵי כָל חָי
  choice: हर जीवित व्यक्ति को
  rationale: शाब्दिक रूप ‘हर जीवित जन के सामने’ है, पर इस वाक्य में לִפְנֵי प्राप्तकर्ता की दिशा में देने का भाव व्यक्त करता है। ‘को’ आधुनिक हिन्दी में आशय स्पष्ट करता है और כָל חָי के मानवीय, लोकोक्तिपरक संदर्भ को बनाए रखता है।
- source_word: וְגַם מִמֵּת
  choice: और मरे हुए के प्रति भी
  rationale: וְגַם का योगात्मक बल ‘और…भी’ से व्यक्त किया गया है। एकवचन מֵת को ‘मरे हुए’ के सामान्य, प्रतिनिधिक अर्थ में रखा गया है और ‘के प्रति’ अगली क्रिया के साथ स्वाभाविक सम्बन्ध बनाता है।
- source_word: אַל תִּמְנַע
  choice: पीछे न हट
  rationale: מנע का मूल भाव रोकने या न देने का है। हिन्दी में ‘कृपा करने से पीछे न हट’ निषेध की नैतिक शक्ति को सहज रूप से व्यक्त करता है।
- source_word: חָסֶד
  choice: कृपा
  rationale: यहाँ חסד किसी मृत व्यक्ति के प्रति किए जाने वाले ठोस दयालु या निष्ठापूर्ण कर्तव्य को सूचित करता है। ‘कृपा’ व्यापक और गरिमापूर्ण है; ‘वाचा का प्रेम’ जैसा विशिष्ट धर्मवैज्ञानिक अर्थ यहाँ आरोपित नहीं किया गया।
theological_decisions:
- issue: इब्रानी पाठ और अत्यन्त भिन्न यूनानी पाठ का सम्बन्ध
  choice: जहाँ इब्रानी पाठ उपलब्ध है, वहाँ उसी को मुख्य पाठ मानकर अनुवाद किया गया।
  alternative: 'यूनानी पाठ: “रोनेवालों की सहायता करने में पीछे न रह, और शोक करनेवालों के साथ शोक कर।”'
  rationale: इस पद का यूनानी रूप केवल शब्दगत भेद नहीं, बल्कि एक अलग पाठ-परम्परा को दर्शाता है। इसलिए इब्रानी को मुख्य पाठ रखते हुए यूनानी पाठ को पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी आज्ञार्थक शैली और गरिमापूर्ण ज्ञान-साहित्यिक लहजा। ‘मरे हुए के प्रति कृपा’ की व्यापकता को बनाए रखा गया है, उसे केवल अन्त्येष्टि या स्मरण-विधि तक सीमित नहीं किया गया।
