base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/002.yaml
  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
translation:
  language: hi
  text: भाई के विरुद्ध अन्याय की हल की लकीरें मत बोओ, कहीं ऐसा न हो कि तुम उसकी फसल सात गुनी काटो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसे काटो’ है। प्रत्यय का संदर्भ अकेले में अस्पष्ट है; बोने और काटने की छवि के अनुसार यहाँ इसे बोए गए अन्याय, अथवा उसके फल, से संबंधित समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर में इस कहावत का एक भिन्न रूप है: “अन्याय से दूर हो जा, और वह तुझसे दूर हो जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: मत बो
  rationale: निषेधात्मक उपदेश को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है तथा कृषि-रूपक बनाए रखता है।
- source_word: חֲרוּשֵׁי
  choice: क्यारियाँ
  rationale: शब्द जुताई से बनी भूमि या खाँचों की ओर संकेत करता है। ‘क्यारियाँ’ बोने और काटने के कृषि-चित्र को सामान्य हिन्दी में स्पष्ट रखता है, यद्यपि ‘हल की लकीरें’ अधिक शाब्दिक विकल्प है।
- source_word: עָוֶל
  choice: अन्याय
  rationale: नैतिक और संबंधपरक अनुचित आचरण को व्यक्त करता है; यहाँ ‘अधर्म’ की अपेक्षा कम पारिभाषिक और अधिक सटीक है।
- source_word: עַל אָח
  choice: भाई के विरुद्ध
  rationale: עַל को प्रसंगानुसार विरोधात्मक अर्थ में लिया गया है। אָח के साथ मूल में स्वत्वसूचक सर्वनाम नहीं है, इसलिए ‘अपने’ नहीं जोड़ा गया।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: चेतावनी के भाव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: תִּקְצְרֵהוּ
  choice: तुम उसे ... काटो
  rationale: क्रिया का कृषि-अर्थ ‘फसल काटना’ है। ‘उसे’ मूल के पुल्लिंग एकवचन कर्म-प्रत्यय की अस्पष्टता को हिन्दी में भी यथासंभव बनाए रखता है; संदर्भ में इसे बोए गए अन्याय का परिणाम समझना सबसे संगत है।
- source_word: שִׁבְעָתָיִם
  choice: सात गुना
  rationale: तीव्र या पूर्ण प्रतिफल के संख्यात्मक मुहावरे को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: תִּקְצְרֵהוּ में कर्म-प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखा गया है, जिसे संदर्भतः बोए गए अन्याय अथवा उसके फल की ओर संकेत करने वाला समझा जा सकता है।
  alternative: 'इसे ‘भाई’ की ओर संकेत करने वाला माना जा सकता है; यूनानी समानांतर में पूरा कथन सामान्य रूप से है: ‘अन्याय से दूर हो जा, और वह तुझसे दूर हो जाएगा।’'
  rationale: बोने और काटने की समानांतर कृषि-छवि अन्याय के फल को काटने की व्याख्या का समर्थन करती है, पर इब्रानी प्रत्यय अकेले में निर्णायक नहीं है। इसलिए अस्पष्टता को टिप्पणी में स्पष्ट किया गया है और यूनानी के भिन्न पाठ को भी दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सदृश रखी गई है। ‘क्यारियाँ बोना’ मूल के असामान्य कृषि-रूपक को सपाट किए बिना सामान्य पाठक के लिए बोधगम्य बनाता है। सभी टिप्पणियों के चिह्न मुख्य पाठ में दिए गए हैं।
