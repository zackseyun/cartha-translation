base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/005.yaml
  text: Do not seek to become a ruler if you have no strength to put an end to insolence[a].
translation:
  language: hi
  text: यदि तुममें ढिठाई का अंत करने की सामर्थ्य नहीं है, तो शासक बनने की इच्छा मत रखो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ है, “प्रभु के सामने अपने को धर्मी न ठहराओ, और राजा के सामने अपनी बुद्धिमानी न दिखाओ।” यह इस पद के एक बहुत भिन्न रूप को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: इच्छा मत रखो
  rationale: निषेध के साथ בקש किसी पद को पाने की चाह या उसके लिए प्रयत्न करने को व्यक्त करता है। हिंदी में “इच्छा मत रखो” इस आकांक्षापूर्ण संदर्भ को सहजता से व्यक्त करता है।
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: शासक बनने की
  rationale: מוֹשֵׁל शासन करने वाले व्यक्ति को दर्शाता है। לִהְיוֹת के साथ “शासक बनने” से पद पाने की आकांक्षा का भाव स्पष्ट रहता है।
- source_word: חַיִל
  choice: सामर्थ्य
  rationale: חַיִל यहाँ बल, योग्यता या व्यावहारिक क्षमता का व्यापक अर्थ रखता है। “सामर्थ्य” इसे केवल शारीरिक शक्ति तक सीमित नहीं करता।
- source_word: לְהַשְׁבִּית
  choice: अंत करने की
  rationale: שבת के हिफ़ील रूप का अर्थ किसी बात को रुकवा देना या समाप्त कर देना है। “अंत करने” में अपेक्षित निर्णायकता बनी रहती है।
- source_word: זָדוֹן
  choice: ढिठाई
  rationale: זָדוֹן घमंडी, धृष्ट और दुस्साहसी आचरण को सूचित कर सकता है। “ढिठाई” साधारण आधुनिक हिंदी में इसके सामाजिक और नैतिक दोनों पक्षों को व्यक्त करती है।
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: मुख्य पाठ में नहीं अपनाया; भिन्न यूनानी पाठ के रूप में पादटिप्पणी में दिया
  rationale: यूनानी पाठ उपलब्ध इब्रानी पाठ से बहुत अलग है। जहाँ सिराख का इब्रानी पाठ सुरक्षित है, वहाँ वह मुख्य आधार है; फिर भी यूनानी रूप को पाठांतर के रूप में सुरक्षित रखना आवश्यक है।
theological_decisions:
- issue: सिराख 7:5 के इब्रानी और यूनानी रूपों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी के अनुसार: “प्रभु के सामने अपने को धर्मी न ठहराओ, और राजा के सामने अपनी बुद्धिमानी न दिखाओ।”'
  rationale: सिराख के सुरक्षित इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी संभवतः किसी अलग मूल-पाठ या पाठ-विकास को दर्शाता है, इसलिए उसे पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। वाक्य-क्रम को हिंदी की स्वाभाविक शर्त–परिणाम संरचना के अनुसार रखा गया है। “सामर्थ्य” חַיִל की व्यापकता और “ढिठाई” זָדוֹן के घमंडी-दुस्साहसी व्यवहार को सामान्य पाठक के लिए स्पष्ट रखते हैं।
