base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: hi
  text: याद रखो, यदि वे न होते[a], तो तुम संसार में न आते; और जो उन्होंने तुम्हारे लिए किया है, उसका प्रतिदान तुम उन्हें कैसे दे सकते हो?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तुम्हारे माता-पिता; निकटवर्ती प्रसंग से सर्वनाम का संकेत स्पष्ट होता है।
    reason: cross_reference
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “और तुम उनके लिए क्या करते हो, जैसा वे तुम्हारे लिए करते हैं?” यूनानी पाठ प्रश्न को स्पष्ट रूप से प्रतिदान के रूप में व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: याद रखो
  rationale: זכר के आज्ञार्थक रूप को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לוּלֵי הֵם
  choice: यदि वे न होते
  rationale: यह इब्रानी की प्रतिकल्पनात्मक निर्भरता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वे’ का संकेत प्रसंगानुसार माता-पिता की ओर है।
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: तो तुम संसार में न आते
  rationale: इब्रानी के ‘संसार में आना’ रूपक को सुरक्षित रखते हुए जन्म या अस्तित्व में आने का भाव स्पष्ट करता है।
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: तुम उन्हें कैसे दे सकते हो?
  rationale: शाब्दिक रूप से यह ‘तुम उनके लिए क्या करते हो?’ हो सकता है, पर अगले खंड और यूनानी ἀνταποδώσεις से प्रतिदान का आलंकारिक प्रश्न स्पष्ट होता है।
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: जो उन्होंने तुम्हारे लिए किया है, उसका बदला
  rationale: גמל में किए हुए उपकार के प्रत्युत्तर या प्रतिदान का भाव है। ‘बदला देना’ यहाँ प्रतिदान के अर्थ में सहज है, प्रतिशोध के अर्थ में नहीं।
theological_decisions:
- issue: ‘वे’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘वे’ रखा गया है और पादटिप्पणी में माता-पिता की पहचान स्पष्ट की गई है।
  alternative: मुख्य पाठ में सीधे ‘तुम्हारे माता-पिता’ जोड़ना।
  rationale: आस-पास का प्रसंग माता-पिता के सम्मान के विषय में है, लेकिन इब्रानी और यूनानी दोनों इस पद में केवल सर्वनाम रखते हैं; इसलिए स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- issue: माता-पिता के उपकार का प्रतिदान
  choice: प्रश्न को असमर्थता सूचित करने वाले आलंकारिक प्रश्न के रूप में रखा गया है।
  alternative: ‘तुम उनके लिए क्या कर रहे हो?’ जैसा साधारण वर्तमानकालीन प्रश्न।
  rationale: इब्रानी में कुछ व्याकरणिक खुलापन है, किंतु גמל और यूनानी ἀνταποδώσεις प्रतिदान की धारणा का समर्थन करते हैं; अनुवाद इस तनाव को प्रश्नात्मक रूप में रखता है, कोई पूर्ण धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संबोधनात्मक रूप। ‘संसार में आना’ इब्रानी बिंब को बनाए रखता है। ‘बदला देना’ सामान्य हिन्दी में उपकार का प्रत्युपकार भी व्यक्त करता है; पूरे वाक्य का सकारात्मक पारिवारिक प्रसंग प्रतिशोध की संभावित गलत समझ को रोकता है।
