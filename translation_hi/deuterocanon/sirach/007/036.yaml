  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: hi
  text: अपने हर कथन में अपने अंत को स्मरण रखो, और तुम कभी पाप नहीं करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहाना के काहिरा गनीज़ा-आधारित संयुक्त इब्रानी पाठ का लगभग अर्थ है: “जो तुमसे प्रेम करता है, उससे अपना मन न फेरो, क्योंकि उसी से तुम्हें प्रेम मिलेगा।” यहाँ इब्रानी पाठ यूनानी परंपरा से बहुत भिन्न प्रतीत होता है; इसलिए मुख्य पाठ यूनानी के अनुसार है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  choice: अपने हर कथन में
  rationale: λόγοις का अर्थ ‘वचनों/कथनों’ या व्यापक रूप से ‘बातों’ हो सकता है। ‘हर कथन में’ यूनानी के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μιμνήσκου
  choice: स्मरण रखो
  rationale: यह स्मरण करते रहने की आज्ञा है; ‘स्मरण रखो’ निरंतर सजगता का भाव सहज रूप से व्यक्त करता है।
- source_word: τὰ ἔσχατά σου
  choice: अपने अंत को
  rationale: शाब्दिक भाव ‘तुम्हारी अंतिम बातें/तुम्हारा अंत’ है। ‘अपने अंत’ मृत्यु या अंतिम परिणाम—दोनों की संभावित व्यापकता बनाए रखता है और कोई विकसित परलोक-सिद्धान्त नहीं जोड़ता।
- source_word: καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις
  choice: और तुम कभी पाप नहीं करोगे
  rationale: नकारात्मक भविष्यकाल के साथ εἰς τὸν αἰῶνα का मुहावरेदार अर्थ ‘कभी नहीं’ है; ἁμαρτάνω का सामान्य धार्मिक अर्थ ‘पाप करना’ है।
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב, כִּי מִמֶּנוּ תֵּאָהֵב
  choice: मुख्य पाठ में नहीं अपनाया; वैकल्पिक इब्रानी पाठ पादटिप्पणी में दिया गया
  rationale: उपलब्ध इब्रानी साक्ष्य यूनानी परंपरा से मूलतः भिन्न है और उसका वाक्यार्थ कठिन है। संगत यूनानी पाठ को मुख्य पाठ में रखते हुए इब्रानी पाठ को पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘अपने अंत’ को स्पष्ट रूप से परलोक या न्याय से जोड़ना
  choice: अपने अंत को
  alternative: अपने अंतिम भाग्य को
  rationale: मूल पाठ अंत को याद रखने की शिक्षा देता है, पर उसका आशय केवल मृत्यु, न्याय या अंतिम भाग्य में से किसी एक तक सीमित नहीं करता। इसलिए व्यापकता और तनाव बनाए रखा गया है।
- issue: परस्पर बहुत भिन्न इब्रानी और यूनानी पाठों में मुख्य पाठ का चयन
  choice: मुख्य पाठ में यूनानी परंपरा; इब्रानी पाठ पादटिप्पणी में
  alternative: मुख्य पाठ में उपलब्ध इब्रानी पाठ
  rationale: यद्यपि सुरक्षित इब्रानी पाठ सामान्यतः प्राथमिक है, यहाँ वह कठिन और यूनानी से अत्यंत भिन्न है। यूनानी पाठ पूर्ण और संगत है; इब्रानी विकल्प को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्मरण रखो’ ज्ञान-साहित्य के उपदेशात्मक स्वर के अनुकूल है।
