base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/011.yaml
  text: Do not despise a man in bitterness of spirit[a]; remember that there is one who exalts and humbles.
translation:
  language: hi
  text: मन की कड़वाहट से भरे मनुष्य को तुच्छ न समझ; याद रख कि कोई है जो ऊँचा उठाता और नीचा करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में क्रम है, “ऊँचा उठाता और नीचा करता है”; यूनानी समानांतर में, “नीचा करता और ऊँचा उठाता है।”
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: तुच्छ न समझ
  rationale: हिब्रू क्रिया בזה किसी के साथ तिरस्कार का भाव रखने या उसे हेय मानने को व्यक्त करती है। यह अनुवाद केवल मौखिक उपहास तक अर्थ को सीमित नहीं करता।
- source_word: לֶאֱנוֹשׁ
  choice: मनुष्य को
  rationale: אֱנוֹשׁ यहाँ एक मानव व्यक्ति को सूचित करता है और उसमें मानवीय दुर्बलता की छाया भी हो सकती है। ‘मनुष्य’ प्रतिनिधिक एकवचन और स्वाभाविक हिन्दी—दोनों को बनाए रखता है।
- source_word: בְּמַר רוּחַ
  choice: मन की कड़वाहट से भरे
  rationale: शाब्दिक बिंब ‘आत्मा/मन की कड़वाहट’ है। हिन्दी में यह प्रयोग पीड़ा और आंतरिक कटुता की दशा को समझने योग्य ढंग से व्यक्त करता है, बिना उसे केवल बुरे स्वभाव का व्यक्ति बना देने के।
- source_word: זְכוֹר
  choice: याद रख
  rationale: एकवचन आज्ञार्थक का सीधा, स्वाभाविक और गरिमापूर्ण रूप।
- source_word: כִּי יֵשׁ
  choice: कि कोई है
  rationale: यह יֵשׁ के अस्तित्वसूचक बल को बनाए रखता है और उसके बाद आने वाले निहित कर्ता को अनावश्यक रूप से परमेश्वर नाम नहीं देता।
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: जो ऊँचा उठाता और नीचा करता है
  rationale: मुख्य हिब्रू साक्ष्य में क्रियाओं का क्रम पहले ‘ऊँचा उठाना’ और फिर ‘नीचा करना’ है। हिन्दी इस क्रम और सामाजिक स्थिति के उलटफेर—दोनों को स्पष्ट रखती है।
theological_decisions:
- issue: मानवीय स्थिति को उलटने वाले का निहित परिचय
  choice: ‘कोई है’ कहकर कर्ता को निहित रखना
  alternative: ‘परमेश्वर ऊँचा उठाता और नीचा करता है’
  rationale: हिब्रू और यूनानी में इस कर्ता का ईश्वरीय संकेत है, पर इस वाक्य में उसका नाम स्पष्ट रूप से नहीं दिया गया। इसलिए अनुवाद धार्मिक आशय को मिटाए बिना पाठ से अधिक स्पष्ट दावा नहीं करता।
- issue: अंतिम दो क्रियाओं का क्रम
  choice: हिब्रू के अनुसार ‘ऊँचा उठाता और नीचा करता है’
  alternative: यूनानी समानांतर के अनुसार ‘नीचा करता और ऊँचा उठाता है’
  rationale: प्रदत्त हिब्रू स्रोत उच्च विश्वास के साथ उपलब्ध है और परियोजना में मूल-भाषा साक्ष्य प्राथमिक है। यूनानी क्रम प्रसंग के प्रवाह से सुगम लग सकता है, पर उसे मुख्य पाठ में रखकर हिब्रू क्रम को चुपचाप बदलना उचित नहीं; इसलिए भिन्नता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन रखा गया है। भाषा सहज और गरिमापूर्ण है। ‘मन की कड़वाहट से भरे’ हिब्रू बिंब को बचाता है, पर ‘कटु स्वभाव वाले’ जैसा नैतिक आरोप लगाने से बचता है।
