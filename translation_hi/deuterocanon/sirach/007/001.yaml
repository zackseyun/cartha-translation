base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: hi
  text: बुराई मत करो[a], और बुराई तुम्हें नहीं घेरेगी; अधर्म से दूर रहो, और वह तुमसे दूर हट जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरे उपवाक्य में इसी शब्द का अर्थ ‘अनिष्ट’ या ‘विपत्ति’ भी हो सकता है: “बुराई मत करो, और अनिष्ट तुम्हें नहीं घेरेगा।” इब्रानी में दोनों जगह एक ही शब्द है; यूनानी में भी यही पुनरावृत्ति है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अंतिम उपवाक्य संक्षिप्त है; इसका अनुवाद “और वह तुमसे हट जाएगा” भी किया जा सकता है। आशय यह है कि अधर्म से दूरी रखने पर उससे जुड़ा खतरा या प्रभाव भी दूर हटता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: मत करो
  rationale: עשה के साथ निषेध का सीधा और स्वाभाविक हिन्दी रूप है; इससे ‘करना’ की सामान्य क्रिया बनी रहती है और ‘अभ्यास करना’ जैसा अतिरिक्त भाव नहीं जुड़ता।
- source_word: רָעָה
  choice: बुराई
  rationale: इब्रानी में यही शब्द दोनों उपवाक्यों में दोहराया गया है और यूनानी समानांतर भी इसी पुनरावृत्ति को रखता है। ‘बुराई’ नैतिक अर्थ तथा दूसरे प्रयोग में संभावित हानिकारक परिणाम—दोनों के लिए पर्याप्त खुला है।
- source_word: יַשִּׂיגְךָ
  choice: तुम्हें आ न घेरेगी
  rationale: נשׂג यहाँ पीछे से पहुँचने या जा पकड़ने का भाव देता है। ‘आ घेरना’ आधुनिक हिन्दी में उस आसन्न और पकड़ लेने वाले संकट को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַרְחֵק מֵעָוֹן
  choice: अधर्म से दूर रहो
  rationale: यह सक्रिय दूरी बनाए रखने की स्थानिक उपमा को सुरक्षित रखता है। עָוֹן के नैतिक भार के लिए ‘अधर्म’ उपयुक्त है और केवल सामान्य ‘गलती’ से अधिक गंभीर है।
- source_word: וְיֵט מִמְּךָ
  choice: और वह तुमसे दूर हट जाएगा
  rationale: इब्रानी का वाक्य संक्षिप्त है और कर्ता को स्पष्ट नहीं करता। ‘वह’ इस अस्पष्टता को बनाए रखता है तथा दूर होने या मुड़ जाने का भाव सहज हिन्दी में देता है।
theological_decisions:
- issue: दो बार प्रयुक्त רָעָה में नैतिक बुराई और विपत्ति का संबंध
  choice: मुख्य पाठ में दोनों बार ‘बुराई’
  alternative: दूसरी बार ‘अनिष्ट’, ‘हानि’ या ‘विपत्ति’
  rationale: एक ही शब्द की पुनरावृत्ति कर्म और उसके फल के बीच जानबूझकर बनाए गए संबंध को दिखाती है। दूसरी बार परिणामस्वरूप अनिष्ट का भाव संभव है, पर उसे मुख्य पाठ में स्पष्ट कर देना मूल की अर्थगत व्यापकता को सीमित कर देगा।
- issue: अंतिम उपवाक्य का अस्पष्ट कर्ता
  choice: कर्ता को ‘वह’ के रूप में अनिर्दिष्ट रखना
  alternative: ‘अधर्म का अनिष्ट तुमसे दूर हो जाएगा’ अथवा ‘परमेश्वर उसे तुमसे दूर कर देगा’
  rationale: मूल इब्रानी कर्ता को विस्तार से नहीं बताता। किसी अनिष्ट या परमेश्वर को स्पष्ट कर्ता बनाना पाठ में ऐसी व्याख्या जोड़ देगा जो वहाँ प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बुराई’ की पुनरावृत्ति मूल का अलंकारिक समानांतर सुरक्षित रखती है; ‘अधर्म’ עָוֹן का गंभीर नैतिक स्वर बनाए रखता है।
