  text: Do not mistreat a faithful servant[b][a], nor a hired laborer who gives himself.
translation:
  language: hi
  text: सच्चाई से काम करनेवाले सेवक[a] के साथ बुरा व्यवहार न कर, और न उस मज़दूर के साथ, जो अपने प्राण लगा देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘सत्य का काम करनेवाला’ है; यूनानी में ‘सच्चाई से काम करनेवाला घर का सेवक।’ आशय ऐसे सेवक या कामगार से है जो ईमानदारी और निष्ठा से काम करता है।
    reason: lexical_alternative
  - marker: b
    text: दूसरे खंड का इब्रानी पाठ कठिन है। यूनानी समानांतर में है, ‘मजदूरी पर काम करनेवाला, जो अपना प्राण देता है।’ इसका आशय ऐसा मज़दूर हो सकता है जो अपने काम में स्वयं को पूरी तरह लगा देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: बुरा व्यवहार न कर
  rationale: רעע के causative अर्थ में किसी को हानि पहुँचाना या उसके साथ बुरा व्यवहार करना निहित है। यह हिन्दी में स्वाभाविक है और यूनानी μὴ κακώσῃς से भी मेल खाता है।
- source_word: עוֹבֵד אֱמֶת
  choice: सच्चाई से काम करनेवाला सेवक
  rationale: इस पदबंध का शाब्दिक अर्थ ‘सत्य का काम करनेवाला/सेवक’ है। यूनानी में भी ‘सच्चाई से काम करनेवाला घर का सेवक’ है। चुना हुआ रूप ईमानदारी और निष्ठा, दोनों की सम्भावना बनाए रखता है।
- source_word: וְכֵן
  choice: और न
  rationale: यह पहले निषेध के समानांतर दूसरा निषेध जोड़ता है; आधुनिक हिन्दी में ‘और न’ उसका सहज रूप है।
- source_word: שׁוֹמֵר
  choice: मज़दूर
  rationale: प्राप्त इब्रानी पाठ में यह शब्द कठिन है और सामान्यतः ‘रखवाला’ समझा जा सकता है, पर यूनानी समानांतर μίσθιον स्पष्ट रूप से मजदूरी पर रखे गए श्रमिक की ओर संकेत करता है।
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: अपने प्राण लगा देता है
  rationale: इब्रानी पाठ कठिन है, जबकि यूनानी में ‘अपना प्राण/जीवन देता है’ है। हिन्दी मुहावरा ‘प्राण लगा देना’ पूर्ण समर्पण और परिश्रम व्यक्त करता है, बिना इसे अनिवार्य रूप से वास्तविक मृत्यु बताने के।
