translation:
  language: hi
  text: और निर्धन के लिए भी अपना हाथ बढ़ा[a], ताकि तुम्हारी आशीष पूरी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “हर जीवित व्यक्ति के लिए उदारता दिखाओ, और मृतक के प्रति भी कृपा मत रोको।” यहाँ इब्रानी साक्ष्य इसके बजाय कहता है: “और निर्धन के लिए भी अपना हाथ बढ़ा, ताकि तुम्हारी आशीष पूरी हो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: और...भी
  rationale: यह पद को पहले के उपदेशों से जोड़ता है और इब्रानी के योगात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְאֶבְיוֹן
  choice: निर्धन की ओर
  rationale: אֶבְיוֹן आर्थिक अभाव और सहायता की आवश्यकता वाले व्यक्ति को दर्शाता है; ‘निर्धन’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: הוֹשִׁיט יָד
  choice: अपना हाथ बढ़ा
  rationale: इब्रानी के सजीव शारीरिक बिंब को बनाए रखते हुए यह सहायता और उदारता का संकेत देता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का संबंध स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּשְׁלַם
  choice: पूरी हो
  rationale: שלם यहाँ पूर्णता तक पहुँचने का अर्थ दे सकता है। यह चयन ‘प्रतिफल मिले’ जैसा अधिक निश्चित अर्थ आरोपित नहीं करता।
- source_word: בִּרְכָתֶךָ
  choice: तुम्हारी आशीष
  rationale: शाब्दिक और व्यापक अभिव्यक्ति रखी गई है, जिससे प्राप्त आशीष, दी गई आशीष, अथवा उदार भेंट के बीच इब्रानी की संभावित अर्थविस्तारता बनी रहती है।
theological_decisions:
- issue: सिराख 7:33 के इब्रानी और यूनानी पाठों में पर्याप्त भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और पादटिप्पणी में यूनानी समानांतर पाठ
  alternative: 'यूनानी: ‘हर जीवित व्यक्ति के प्रति भेंट की कृपा बनी रहे, और मृतक से भी कृपा मत रोक।’'
  rationale: जहाँ इब्रानी पाठ उपलब्ध है, वही प्राथमिक स्रोत है। यूनानी पाठ निकट शब्दगत समानांतर नहीं है और संभवतः अलग पाठ-रूप का साक्ष्य देता है; इसलिए उसकी महत्वपूर्ण भिन्नता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ‘तुम्हारी आशीष’ का आशय
  choice: अर्थ को व्यापक और अनिर्णीत रखना
  alternative: इसे केवल ‘तुम्हारी दान-भेंट’ अथवा केवल ‘तुम्हें मिलने वाली आशीष’ कहना
  rationale: בִּרְכָתֶךָ आशीष, आशीषस्वरूप भेंट, या हितकारी कार्य की ओर संकेत कर सकता है। किसी एक धार्मिक व्याख्या को निश्चित करना स्रोत की वास्तविक अर्थविस्तारता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘अपना हाथ बढ़ा’ मूल के बिंब को सुरक्षित रखता है; ‘आशीष पूरी हो’ जानबूझकर अर्थ की धार्मिक और शाब्दिक व्यापकता बनाए रखता है।
