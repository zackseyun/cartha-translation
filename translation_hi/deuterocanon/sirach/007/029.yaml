translation:
  language: hi
  text: अपने पूरे हृदय से परमेश्वर का भय मानो, और उसके याजकों का आदर करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: अपने पूरे हृदय से
  rationale: हिब्रू के समग्र आंतरिक समर्पण के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פְּחַד אִל
  choice: परमेश्वर का भय मानो
  rationale: פחד के धार्मिक श्रद्धा और भय के तनाव को बनाए रखता है; केवल ‘आदर करो’ कहना अर्थ को अधिक नरम कर देता।
- source_word: כֹּהֲנָיו
  choice: उसके याजकों
  rationale: כהן के धार्मिक पद के लिए प्रचलित और सटीक बाइबलीय हिन्दी शब्द।
- source_word: הַקְדִישׁ
  choice: आदर करो
  rationale: शाब्दिक रूप से ‘पवित्र ठहराओ/मानो’ संभव है, पर इस आज्ञा के संदर्भ में पद की पवित्र प्रतिष्ठा स्वीकार करने का आशय है; यूनानी θαύμαζε भी विशेष सम्मान की पुष्टि करता है।
theological_decisions:
- issue: परमेश्वर के भय का स्वरूप
  choice: भय मानो
  alternative: श्रद्धा रखो
  rationale: मूल פחד में वास्तविक भय और श्रद्धा दोनों की गुंजाइश है; ‘भय मानो’ इस तनाव को बिना नरम किए सुरक्षित रखता है।
- issue: याजकों के प्रति आज्ञा
  choice: आदर करो
  alternative: पवित्र मानो
  rationale: ‘आदर करो’ पाठक को मनुष्यों को स्वयं पवित्र बनाने का भ्रामक संकेत नहीं देता, जबकि उनके पवित्र पद की प्रतिष्ठा का व्यावहारिक आशय व्यक्त करता है।
