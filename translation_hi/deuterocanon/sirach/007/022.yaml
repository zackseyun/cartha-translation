    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द אֻמָּנָה का ठीक आशय अनिश्चित है; यूनानी समानान्तर में “उपयोगी” है। अन्य सम्भावित अर्थ हैं “भरोसेमन्द” या “लाभदायक”।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה לְךָ
  choice: यदि तुम्हारे पास कोई पशु हो
  rationale: इब्रानी में यह क्रियारहित स्वामित्व-सूचक वाक्यांश है, जिसका स्वाभाविक हिन्दी रूप ‘तुम्हारे पास’ है। בְּהֵמָה पालतू या घरेलू पशु को सूचित करता है; एकवचन सर्वनामों के कारण ‘कोई पशु’ रखा गया है।
- source_word: רְאֵה עֵינֶיךָ
  choice: अपनी आँखों से उसकी देखभाल करो
  rationale: शाब्दिक अर्थ ‘अपनी आँखों से देखो’ है, पर सन्दर्भ में आशय पशु पर ध्यान देने, उसका निरीक्षण करने और उसकी देखभाल करने से है। हिन्दी में यह रूप ठोस नेत्र-बिम्ब और व्यावहारिक अर्थ दोनों बचाता है।
- source_word: אֻמָּנָה
  choice: उपयोगी
  rationale: इस विशेषण का ठीक आशय अनिश्चित है। यूनानी समानान्तर χρήσιμα ‘उपयोगी/काम का’ अर्थ देता है, इसलिए ‘लाभदायक’ जैसे अधिक आर्थिक और संकुचित अर्थ के बजाय ‘उपयोगी’ चुना गया है।
- source_word: הַעֲמִידָהּ
  choice: उसे अपने पास रखो
  rationale: हिफ़ील रूप का शाब्दिक भाव ‘उसे खड़ा/कायम रखो’ है; यहाँ व्यावहारिक अर्थ पशु को बनाए रखने या अपने अधिकार में रखने का है। ‘अपने पास रखो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
