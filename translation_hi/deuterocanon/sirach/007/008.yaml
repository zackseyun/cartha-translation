translation:
  language: hi
  text: पाप पर फिर पाप मत जोड़ो, क्योंकि एक ही पाप के लिए भी तुम दण्ड से नहीं बचोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम दोषमुक्त नहीं ठहरोगे” अथवा “तुम्हें निर्दोष नहीं माना जाएगा।” इब्रानी और यूनानी में न्यायिक अर्थ के साथ-साथ दण्ड से न बचने का भाव भी हो सकता है।
    reason: לֹא תִנָּקֶה की न्यायिक और दण्डात्मक अर्थ-संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: אַל תִּקְשׁוֹר
  choice: अपने को उससे मत बाँधो
  rationale: קשר का मूल अर्थ ‘बाँधना’ है और यूनानी समानांतर भी इसी बिंब की पुष्टि करता है। हिन्दी में कर्म के साथ संबंध स्पष्ट करने के लिए ‘अपने को उससे’ जोड़ा गया है, ताकि मूल बिंब बना रहे और वाक्य समझने योग्य हो।
- source_word: לְשָׁנוֹת
  choice: दूसरी बार
  rationale: यहाँ שנה पुनरावृत्ति का भाव देता है; ‘दूसरी बार’ उस चेतावनी को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֵטְ
  choice: पाप
  rationale: यह ‘पाप’ या ‘अपराध’ को सूचित करता है और यूनानी ἁμαρτία से भी मेल खाता है। ‘पाप’ सबसे सीधा और धार्मिक रूप से पारदर्शी विकल्प है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक कारणसूचक है।
- source_word: בְאַחַת
  choice: एक ही पाप के लिए भी
  rationale: मूल का शाब्दिक रूप ‘एक में’ है। संदर्भ में आशय यह है कि केवल एक पाप भी दण्ड या न्याय से मुक्त नहीं रहता; ‘ही’ और ‘भी’ उसके बल को सुरक्षित रखते हैं।
- source_word: לֹא תִנָּקֶה
  choice: तुम दण्ड से नहीं बचोगे
  rationale: נקה के निफ़अल रूप में निर्दोष या दोषमुक्त ठहरने और दण्ड से बच निकलने—दोनों का भाव संभव है। मुख्य पाठ में चेतावनी के व्यावहारिक, दण्डात्मक अर्थ को स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: अन्तिम उपवाक्य को न्यायालयी अर्थ (‘दोषमुक्त नहीं ठहरोगे’) में प्रस्तुत किया जाए या दण्डात्मक अर्थ (‘दण्ड से नहीं बचोगे’) में
  choice: दण्ड से नहीं बचोगे
  alternative: दोषमुक्त नहीं ठहरोगे; निर्दोष नहीं माने जाओगे
  rationale: इब्रानी और यूनानी दोनों न्यायालयी तथा दण्डात्मक अर्थ की अनुमति देते हैं। ज्ञान-साहित्य की चेतावनी के संदर्भ में मुख्य पाठ में दण्ड से न बचने का व्यावहारिक अर्थ स्वाभाविक है, जबकि न्यायालयी संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अपने को उससे बाँधो’ मूल इब्रानी और यूनानी के बाँधने वाले बिंब को बनाए रखता है, जबकि ‘दूसरी बार पाप करके’ पुनरावृत्ति का आशय स्पष्ट करता है।
