  text: Do not be hasty in the army[a], for it is laborious work allotted by God.
translation:
  language: hi
  text: सेना में जल्दबाज़ी न करो[a], क्योंकि यह कठिन परिश्रम का काम है, जो परमेश्वर की ओर से सौंपा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “यह न कहना, ‘वह मेरे बहुत-से उपहारों पर दृष्टि करेगा, और जब मैं परमप्रधान परमेश्वर को भेंट चढ़ाऊँगा, तो वह उन्हें स्वीकार करेगा।’” यह उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ-परंपरा को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: जल्दबाज़ी न करो
  rationale: निषेधात्मक रूप किसी काम में उतावली करने या शीघ्र आगे बढ़ने से रोकता है। यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בַּצָּבָא
  choice: सेना में
  rationale: צָבָא का सीधा अर्थ सेना, सैन्य दल या सेवा हो सकता है। इस इब्रानी पाठ में सैन्य संदर्भ को बिना विस्तार जोड़े सुरक्षित रखा गया है।
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: परिश्रम का काम
  rationale: दोनों संज्ञाएँ मिलकर काम और श्रम/सेवा की कठिनता पर बल देती हैं। यह अनुवाद उस दोहरे भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵאֵל נֶחֱלָקָה
  choice: परमेश्वर की ओर से सौंपा गया है
  rationale: מֵאֵל स्रोत या कर्ता को और निष्क्रिय נֶחֱלָקָה बाँटे, निर्धारित या सौंपे जाने को व्यक्त करता है। 'की ओर से सौंपा गया' हिन्दी में इस अर्थ को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद
  alternative: यूनानी पाठ उपहारों की बहुतायत और परमप्रधान परमेश्वर द्वारा भेंट स्वीकार किए जाने की धारणा पर चेतावनी देता है।
  rationale: यह केवल शब्दगत भिन्नता नहीं, बल्कि अलग पाठ-परंपरा का प्रमाण है। जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे मुख्य पाठ बनाया गया है और यूनानी पाठ को पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। 'सेना में' इब्रानी की संक्षिप्तता बनाए रखता है; अनुवाद में भर्ती होने या युद्ध में जाने जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
