  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
translation:
  language: hi
  text: अन्याय से मुँह मोड़ो और अपने हाथों को सीधा करो[a]; सभी अपराधों से अपने हृदय को शुद्ध करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बचा हुआ इब्रानी पाठ इस खंड में कठिन है। यूनानी समानांतर में ‘अपने हाथों को सीधा करो’ है, जिसका आशय संभवतः अपने कामों को सही करना है।
    reason: textual_variant
lexical_decisions:
- source_word: נום מעול
  choice: अन्याय से मुँह मोड़ो
  rationale: इब्रानी क्रिया का रूप कुछ अनिश्चित है, पर यूनानी ἀπόστησον और प्रसंग बुराई से दूर होने की आज्ञा का समर्थन करते हैं। עול के लिए ‘अन्याय’ उसके नैतिक अर्थ को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ומהכר פנים
  choice: और अपने हाथ सीधे करो
  rationale: बचा हुआ इब्रानी पाठ यहाँ कठिन है। यूनानी εὔθυνον χεῖρας स्पष्ट रूप से ‘हाथ सीधे करो’ कहता है, अर्थात अपने कामों को सही करो। अनुवाद ने इस चित्रात्मक भाषा को बनाए रखा है और पाठगत कठिनाई को पादटिप्पणी में बताया है।
- source_word: ומכל פשעים
  choice: सब अपराधों से
  rationale: פשעים में जान-बूझकर किए गए उल्लंघनों या विद्रोही अपराधों का प्रबल भाव हो सकता है। ‘अपराधों’ इस अर्थ को सामान्य हिन्दी में बनाए रखता है; यूनानी समानांतर में व्यापक शब्द ‘हर पाप’ है।
- source_word: טהר לב
  choice: अपने हृदय को शुद्ध करो
  rationale: טהר शुद्ध या निर्मल करने की आज्ञा देता है। ‘हृदय को शुद्ध करो’ नैतिक और धार्मिक दोनों अनुगूँजों को स्वाभाविक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: कठिन इब्रानी मध्य खंड के अर्थ में यूनानी समानांतर का उपयोग
  choice: इब्रानी को प्राथमिक साक्षी मानते हुए, यूनानी के आधार पर इसे ‘अपने हाथ सीधे करो’ अनूदित किया गया।
  alternative: कठिन इब्रानी शब्दों का अत्यधिक शाब्दिक अनुवाद करना, या उन्हें मुख/पक्षपात से जुड़ा वाक्यांश मानना।
  rationale: इब्रानी पाठ इस स्थान पर असुरक्षित और अर्थ की दृष्टि से कठिन है, जबकि यूनानी पाठ एक सुसंगत समानांतर आज्ञा देता है। ‘हाथ सीधे करो’ कर्मों को सुधारने की छवि बनाए रखता है और किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आज्ञार्थक शैली रखी गई है। ‘हाथ सीधे करो’ की मूल चित्रात्मकता को सरल व्याख्या से बदलने के बजाय पादटिप्पणी द्वारा स्पष्ट किया गया है।
