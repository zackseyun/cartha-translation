translation:
  language: hi
  text: वह अपने कामों को पूरा करने में अपना हृदय लगाएगा[a], और उन्हें अंतिम रूप देने के लिए जागता रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “वह कामों की पूर्णता के लिए अपना हृदय देगा, और उसका जागते रहना पूर्णता तक सँवारने के लिए होगा।” मूल वाक्य संक्षिप्त और मुहावरेदार है।
    reason: शाब्दिक वैकल्पिक रूप और मूल यूनानी की संक्षिप्त संरचना स्पष्ट करना।
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: अपना हृदय लगाएगा
  rationale: यूनानी में शाब्दिक भाव ‘अपना हृदय देगा’ है, जो पूरे मन और संकल्प से किसी काम में लगने का मुहावरा है। ‘हृदय लगाएगा’ मूल बिंब को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: συντέλειαν ἔργων
  choice: अपने कामों को पूरा करने में
  rationale: συντέλεια यहाँ कारीगरी के कामों को उनके अंतिम चरण तक पहुँचाने का बोध देता है। ἔργων बहुवचन है, इसलिए ‘कामों’ रखा गया है।
- source_word: ἀγρυπνία αὐτοῦ
  choice: रात-रात भर जागेगा
  rationale: ἀγρυπνία जागते रहने या नींद त्यागकर सतर्क परिश्रम करने को व्यक्त करता है। संज्ञात्मक यूनानी अभिव्यक्ति को हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है।
- source_word: κοσμῆσαι
  choice: सँवारकर
  rationale: κοσμέω का अर्थ सजाना, व्यवस्थित करना या उचित रूप देना हो सकता है। कारीगरी के प्रसंग में ‘सँवारना’ अंतिम रूप और सुंदर परिष्कार—दोनों भावों को रखता है।
- source_word: ἐπὶ συντελείας
  choice: पूर्ण करने के लिए
  rationale: यह संक्षिप्त पदबंध कार्य को समापन तक पहुँचाने के लक्ष्य को दर्शाता है। ‘पूर्ण करने के लिए’ इस लक्ष्यसूचक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
