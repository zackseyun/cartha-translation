base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: hi
  text: जो हल चलाता और बैल को हाँकता है, वह बुद्धिमान कैसे बनेगा?[a] उसका ध्यान तो मवेशियों पर ही रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का पहला खंड कुछ कठिन है। यूनानी समानांतर अधिक स्पष्ट रूप से कहता है, “हल थामने वाला कैसे बुद्धिमान बनेगा ... बैलों को हाँकते हुए ...?” अनुवाद कृषि-संबंधी अर्थ स्पष्ट करने के लिए यूनानी से सहायता लेते हुए इब्रानी का अनुसरण करता है।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी बातचीत मवेशियों के बारे में ही रहती है।” इब्रानी उसके ध्यान या चिंताओं की ओर, अथवा विशेष रूप से उसकी बातचीत की ओर संकेत कर सकता है; यूनानी समानांतर ‘बात/वृत्तांत’ के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף ינהג ... לשדד
  choice: जो हल चलाता है
  rationale: इब्रानी का आरम्भ कठिन है। संदर्भ खेत जोतने वाले व्यक्ति का है, और यूनानी समानांतर में हल थामने वाला स्पष्ट है। स्वाभाविक हिन्दी में ‘हल चलाता है’ कृषि-कर्म को ठीक व्यक्त करता है।
- source_word: ישובב בשור
  choice: बैल को हाँकता है
  rationale: रूप और वाक्य-संबंध कुछ अनिश्चित हैं, पर प्रसंग में काम करते बैल को चलाने का भाव है। ‘हाँकता’ पशु को निर्देशित करने की सामान्य और सटीक हिन्दी है।
- source_word: שעיותיו
  choice: उसके ध्यान में
  rationale: शब्द विचार, चिंता अथवा बातचीत की ओर संकेत कर सकता है। मुख्य पाठ में ‘ध्यान’ व्यापक अर्थ को सुरक्षित रखता है; ‘बातचीत’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: בני בקר
  choice: गाय-बैल
  rationale: शाब्दिक रूप से ‘गोवंश के बच्चे/बछड़े’; यहाँ सामूहिक रूप से गो-पशुओं का बोध है। ‘गाय-बैल’ साधारण हिन्दी में पशुधन के इस वर्ग को स्वाभाविक ढंग से व्यक्त करता है।
