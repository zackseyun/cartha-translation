  text: Also give the physician a place[a], and do not dismiss him, for there is need of him as well.
translation:
  language: hi
  text: चिकित्सक को भी स्थान दो[a], और उसे दूर न होने दो, क्योंकि उसकी भी आवश्यकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ “उसे दूर न होने दो” से पहले जोड़ता है, “क्योंकि प्रभु ने उसे बनाया है।”
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: וגם
  choice: भी
  rationale: यह पिछले प्रसंग से जुड़ी एक अतिरिक्त शिक्षा को व्यक्त करता है; हिन्दी में ‘भी’ इसके योगात्मक बल को स्वाभाविक ढंग से रखता है।
- source_word: לרופא
  choice: चिकित्सक को
  rationale: רופא का अर्थ रोग का उपचार करने वाला है। ‘चिकित्सक’ आधुनिक, स्पष्ट और ज्ञान-साहित्य की गरिमा के अनुकूल है।
- source_word: תן מקום
  choice: स्थान दो
  rationale: शाब्दिक अर्थ ‘स्थान दो’ है, जिसमें चिकित्सक को उचित अवसर और भूमिका देने का भाव निहित है; ठोस रूपक को बनाए रखा गया है।
- source_word: ולא ימוש
  choice: और उसे दूर न होने दो
  rationale: מוש दूर हटने या चले जाने को दर्शाता है। यह अनुवाद निषेधात्मक आग्रह को स्वाभाविक हिन्दी में रखता है, बिना यूनानी पाठ के स्पष्ट ‘अपने से’ को मुख्य पाठ में जोड़ने के।
- source_word: כי גם בו צורך
  choice: क्योंकि उसकी भी आवश्यकता है
  rationale: यह हिब्रू की अवैयक्तिक आवश्यकता-वाचक रचना और גם के बल—चिकित्सक की भी जरूरत है—दोनों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: हिब्रू मुख्य पाठ और विस्तृत यूनानी समानांतर पाठ के बीच अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू को आधार बनाया गया और ‘क्योंकि प्रभु ने उसे सृजा है’ को केवल पादटिप्पणी में रखा गया।
  alternative: ‘चिकित्सक को भी स्थान दो, क्योंकि प्रभु ने उसे सृजा है; और उसे अपने से दूर न होने दो, क्योंकि उसकी भी आवश्यकता है।’
  rationale: इस पद का हिब्रू पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, जबकि सृष्टि-संबंधी वाक्यांश केवल यूनानी समानांतर में मिलता है। इसलिए उसे मुख्य पाठ में मिलाना पाठ-साक्ष्य के अंतर को मिटा देता; पादटिप्पणी उस महत्वपूर्ण वैकल्पिक पाठ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘चिकित्सक’ गरिमापूर्ण किंतु सामान्यतः बोधगम्य शब्द है। ‘स्थान दो’ मूल रूपक को बनाए रखता है, जबकि ‘दूर न होने दो’ हिब्रू के अर्थ को स्वाभाविक हिन्दी में प्रस्तुत करता है।
