  text: Whoever sins before his Maker will be defiant before a physician[a].
translation:
  language: hi
  text: जो अपने बनानेवाले के सामने पाप करता है, वह वैद्य के सामने पराये जैसा व्यवहार करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “वैद्य के हाथों में पड़ जाएगा।” इब्रानी पाठ में है: “वैद्य के सामने पराये जैसा व्यवहार करेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אשר
  choice: जो
  rationale: यह सामान्य सिद्धांत बताने वाला संबंधवाचक प्रयोग है; हिन्दी में “जो” स्वाभाविक रूप से नीतिवचन-सदृश सार्वत्रिक भाव देता है।
- source_word: חואט
  choice: पाप करता है
  rationale: חטא का नैतिक और धार्मिक अर्थ बनाए रखने के लिए “पाप करता है” उपयुक्त है।
- source_word: לפני
  choice: के सामने
  rationale: मूल अर्थ “के सामने/उपस्थिति में” है; यूनानी ἔναντι भी इसी अर्थ की पुष्टि करता है। “के विरुद्ध” कहना संबंध को अनावश्यक रूप से निश्चित कर देता।
- source_word: עושהו
  choice: अपने बनानेवाले
  rationale: शाब्दिक अर्थ “उसे बनानेवाला” है। “अपने बनानेवाले” सहज हिन्दी में सृष्टिकर्ता का आशय रखता है और मूल के עשה से निकट रहता है।
- source_word: יתנכר
  choice: अपने को पराया बना लेगा
  rationale: נכר के हित्पएल रूप में अपने को अपरिचित या पराया बनाना, दूरी रखना अथवा पराये की तरह व्यवहार करना निहित हो सकता है। यह अनुवाद मूल की रूपकात्मकता और अर्थगत अस्पष्टता बचाता है; “अवज्ञाकारी होगा” कहना व्यावहारिक आशय को अधिक निश्चित कर देता।
- source_word: רופא
  choice: वैद्य
  rationale: यह चिकित्सक के लिए गरिमापूर्ण और संक्षिप्त आधुनिक हिन्दी शब्द है तथा आसपास के चिकित्सा-संदर्भ के अनुकूल है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: उपलब्ध इब्रानी पाठ के अनुसार “वैद्य के सामने अपने को पराया बना लेगा”
  alternative: 'यूनानी: “वैद्य के हाथों में पड़ जाए”'
  rationale: इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए मुख्य पाठ में उसे प्राथमिकता दी गई है। यूनानी परंपरा का पर्याप्त भिन्न पाठ पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
- issue: יתנכר के भाव को कितनी स्पष्टता से व्यक्त किया जाए
  choice: रूपकात्मक “अपने को पराया बना लेगा”
  alternative: “अवज्ञाकारी होगा” या “विरोध करेगा”
  rationale: इब्रानी क्रिया में परायापन, दूरी और अपरिचित जैसा व्यवहार करने की अर्थ-छायाएँ हैं। किसी एक व्यवहारगत निष्कर्ष को मुख्य पाठ में थोपने के बजाय वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “वैद्य” ज्ञान-साहित्य और चिकित्सा-संदर्भ के अनुकूल है। “अपने को पराया बना लेगा” कुछ असामान्य होते हुए भी मूल इब्रानी की जानबूझकर रखी गई रूपकात्मक अस्पष्टता को सुरक्षित रखता है।
