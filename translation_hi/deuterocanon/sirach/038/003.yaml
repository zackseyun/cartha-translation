  text: A physician’s knowledge will raise his horn[a], and before nobles he will stand.
translation:
  language: hi
  text: चिकित्सक का ज्ञान उसका सींग ऊँचा उठाएगा,[a] और वह कुलीनों के सामने खड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “चिकित्सक का ज्ञान उसका सिर ऊँचा उठाएगा, और महानुभावों के सामने उसकी प्रशंसा होगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: דעת רופא
  choice: चिकित्सक का ज्ञान
  rationale: דעת का सामान्य अर्थ ‘ज्ञान’ है और רופא चिकित्सा करने वाले व्यक्ति को दर्शाता है। यह पद चिकित्सक की अर्जित योग्यता की ओर संकेत करता है; ‘चिकित्सक का ज्ञान’ मूल की संक्षिप्तता और गरिमा बनाए रखता है।
- source_word: תרים קרנו
  choice: उसका सींग ऊँचा करेगा
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘उसका सींग ऊँचा करेगा’ कहता है और सम्मान, सामर्थ्य या प्रतिष्ठा बढ़ने का बिंब देता है। बिंब को मुख्य पाठ में सुरक्षित रखा गया है, क्योंकि इसे केवल ‘सम्मान बढ़ाएगा’ कहना मूल की काव्यात्मक अभिव्यक्ति को मिटा देता।
- source_word: נדיבים
  choice: प्रतिष्ठित लोगों
  rationale: נדיבים यहाँ समाज के ऊँचे पद और प्रभाव वाले लोगों को दर्शाता है। ‘प्रतिष्ठित लोगों’ आधुनिक हिन्दी में स्वाभाविक है और ‘कुलीनों’ की अपेक्षा अधिक व्यापक अर्थ सुरक्षित रखता है।
- source_word: יתיצב
  choice: खड़ा होगा
  rationale: यह क्रिया खड़े होने या अपने को उपस्थित करने का अर्थ देती है। ‘सामने खड़ा होगा’ प्रभावशाली व्यक्तियों की उपस्थिति में आदरपूर्ण स्थान पाने का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दूसरे चरण में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘प्रतिष्ठित लोगों के सामने खड़ा होगा’
  alternative: 'यूनानी: ‘महान लोगों के सामने उसकी प्रशंसा होगी’'
  rationale: उपलब्ध इब्रानी पाठ स्पष्ट और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी पाठ अर्थ को उपस्थिति या स्थान से प्रशंसा की ओर मोड़ता है; इस वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘सींग ऊँचा करना’ मूल इब्रानी सम्मान-वृद्धि के बिंब को सुरक्षित रखता है; प्रसंग उसका अर्थ स्पष्ट करता है।
