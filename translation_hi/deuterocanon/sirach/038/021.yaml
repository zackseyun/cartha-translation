base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/021.yaml
  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: hi
  text: उसे बार-बार याद न करते रहो, क्योंकि उसके लिए कोई आशा नहीं है।[a] इससे क्या लाभ होगा? तुम अपना ही नुकसान करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “क्योंकि लौटना संभव नहीं है।”
    reason: alternative_reading
lexical_decisions:
- source_word: אל תזכרנו
  choice: उसे बार-बार याद न करते रहो
  rationale: निषेधात्मक प्रयोग और शोक के प्रसंग में זכר का आशय मृत व्यक्ति की स्मृति को पूरी तरह मिटाना नहीं, बल्कि उसके विषय में लगातार डूबे रहने से है।
- source_word: כי אין לו תקוה
  choice: क्योंकि उसके लिए कोई आशा नहीं है
  rationale: 'यह इब्रानी का सीधा और सामान्य अर्थ है: תקוה का अर्थ ‘आशा’ है और לו का अर्थ ‘उसके लिए’। यूनानी समानांतर में ‘लौटना नहीं है’ मिलता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।'
- source_word: מה תועיל
  choice: इससे क्या लाभ होगा?
  rationale: इब्रानी प्रश्न को उसके खुले रूप में रखा गया है; ‘इससे’ शोक में लगातार डूबे रहने की पिछली बात की ओर संकेत करता है। यूनानी पाठ स्पष्ट रूप से ‘तुम उसकी सहायता नहीं करोगे’ कहता है, पर वह विस्तार मुख्य इब्रानी पाठ में नहीं जोड़ा गया।
- source_word: ולך תרע
  choice: तुम अपना ही नुकसान करोगे
  rationale: इब्रानी में होने वाली हानि शोक मनाने वाले की ओर लौटती है; ‘अपना ही’ इस आत्महानिकारक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी σεαυτὸν κακώσεις से भी पुष्ट है।
theological_decisions:
- issue: תקוה को उसके सामान्य अर्थ ‘आशा’ में अनूदित किया जाए या यूनानी-समानांतर के अनुसार ‘वापसी’ के रूप में
  choice: क्योंकि उसके लिए कोई आशा नहीं है
  alternative: क्योंकि लौटना संभव नहीं है
  rationale: उपलब्ध इब्रानी पाठ प्राथमिक और उच्च-विश्वसनीयता वाला है तथा אין לו תקוה का स्वाभाविक अर्थ ‘उसके लिए कोई आशा नहीं है’ है। यूनानी पाठ प्रसंगगत अर्थ ‘वापसी नहीं’ देता है; इस भिन्नता को मिटाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बार-बार याद न करते रहो’ शोक में निरंतर डूबे रहने का भाव देता है, बिना यह कहे कि मृत व्यक्ति को कभी याद ही न किया जाए।
