base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: hi
  text: हे मेरे पुत्र, अपनी बीमारी में लापरवाही न करना[a]; परमेश्वर से प्रार्थना करना[b], क्योंकि वह तुम्हें चंगा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसकी उपेक्षा न करना” अथवा “इसे अनदेखा न करना।” यूनानी समानांतर पाठ अपनी बीमारी को अनदेखा न करने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर पाठ में “प्रभु से प्रार्थना करना” है; यहाँ इब्रानी पाठ “परमेश्वर से” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בני
  choice: हे मेरे पुत्र
  rationale: इब्रानी संबोधन का शाब्दिक अर्थ ‘मेरे पुत्र’ है और यह सिराख की पितृवत शिक्षात्मक शैली बनाए रखता है।
- source_word: בחולי
  choice: अपनी बीमारी में
  rationale: ב उपसर्ग और חולי का स्वाभाविक अर्थ ‘अपनी बीमारी में’ अथवा ‘बीमार होने पर’ है; चुना गया रूप इब्रानी के निकट और आधुनिक हिन्दी में सहज है।
- source_word: על תתעבר
  choice: लापरवाही न करना
  rationale: इब्रानी पदबंध का सटीक आशय कुछ अनिश्चित है। यूनानी μὴ παράβλεπε बीमारी की उपेक्षा या अनदेखी न करने के अर्थ का समर्थन करता है; यह अनुवाद अनुपस्थित कर्म को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: התפלל
  choice: प्रार्थना करना
  rationale: यह क्रिया सीधे ‘प्रार्थना करना’ व्यक्त करती है; यूनानी εὔξαι भी इसी अर्थ की पुष्टि करता है।
- source_word: אל אל
  choice: परमेश्वर से
  rationale: इब्रानी में אל ‘परमेश्वर’ है। हिन्दी में ‘परमेश्वर से प्रार्थना करना’ स्वाभाविक है; यूनानी का वैकल्पिक ‘प्रभु’ पादटिप्पणी में रखा गया है।
- source_word: כי הוא ירפא
  choice: क्योंकि वह तुम्हें चंगा करेगा
  rationale: इब्रानी में ‘क्योंकि वह चंगा करेगा’ है; प्रसंग में ‘तुम्हें’ निहित है और यूनानी में σε द्वारा स्पष्ट भी है। ‘चंगा करेगा’ आरोग्य देने की क्रिया को गरिमापूर्ण और परिचित ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना वाले उपवाक्य में ईश्वरीय संबोधन
  choice: परमेश्वर
  alternative: प्रभु
  rationale: विद्यमान और प्राथमिक इब्रानी पाठ אל (‘परमेश्वर’) पढ़ता है, जबकि यूनानी समानांतर Κυρίῳ (‘प्रभु’) पढ़ता है। इसलिए मुख्य पाठ में इब्रानी को रखा गया और स्रोतगत भिन्नता पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे मेरे पुत्र’ शिक्षात्मक संबोधन को सुरक्षित रखता है; आदेशों के लिए हिन्दी का स्वाभाविक ‘न करना/करना’ विन्यास अपनाया गया है।
