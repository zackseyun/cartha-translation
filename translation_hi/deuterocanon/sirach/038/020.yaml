  yaml_path: translation/deuterocanon/sirach/038/020.yaml
  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: hi
  text: उसके नियत भाग को याद रखो[a], क्योंकि वही तुम्हारा भी भाग है—कल उसके लिए था, और आज तुम्हारे लिए है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विधान को,” “उसके आदेश को,” अथवा “उसके लिए ठहराए हुए हिस्से को।” इब्रानी חק का अर्थ प्रायः “विधान” या “आदेश” होता है, पर यहाँ सम्भवतः मृत्यु में हर मनुष्य के लिए नियत भाग की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ भिन्न है: “अपने मन को शोक के वश में मत कर; अन्त को स्मरण करके उसे दूर कर।” यह पद के मृत्यु और अन्त के प्रसंग से मेल खाता है, यद्यपि यहाँ इब्रानी शब्द भिन्न हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: याद रखो
  rationale: आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; यह सक्रिय स्मरण का भाव व्यक्त करता है।
- source_word: חקו
  choice: उसके ठहराए हुए भाग
  rationale: חק का मूल अर्थ विधान, ठहराव या निर्धारित हिस्सा हो सकता है। मृत्यु और शोक के प्रसंग में यह मनुष्य के लिए नियत भाग्य या हिस्से की ओर संकेत करता है; ‘ठहराया हुआ भाग’ इस नियतता को बनाए रखता है और ‘भाग्य’ से जुड़ी संयोग की सम्भावित छाया से बचता है।
- source_word: כי הוא חקך
  choice: क्योंकि वही तुम्हारा भी भाग है
  rationale: यह वाक्य मृत व्यक्ति के निर्धारित हिस्से को शोक करने वाले का भी साझा मानवीय हिस्सा बताता है। ‘भी’ हिन्दी में निहित समानता को स्पष्ट और स्वाभाविक करता है।
- source_word: לו אתמול ולך היום
  choice: कल उसकी बारी थी, आज तुम्हारी
  rationale: शाब्दिक संरचना ‘उसके लिए कल और तुम्हारे लिए आज’ अत्यन्त संक्षिप्त है। ‘बारी’ उस काव्यात्मक लोप को अनावश्यक रूप से ‘मृत्यु’ कहकर खोलने के बिना आधुनिक हिन्दी में अर्थग्राह्य बनाती है।
theological_decisions:
- issue: मृत्यु और शोक के प्रसंग में חק का अर्थ
  choice: ठहराया हुआ भाग / साझा मानवीय नियति
  alternative: विधान या आदेश
  rationale: निकटवर्ती प्रसंग विधिक आज्ञा का नहीं, मृत्यु और शोक का है। इसलिए ‘ठहराया हुआ भाग’ अधिक प्रसंगानुकूल है, जबकि पदटिप्पणी मूल शब्द की ‘विधान/आदेश’ वाली सम्भावना सुरक्षित रखती है।
- issue: अन्तिम संक्षिप्त खंड को कितना स्पष्ट किया जाए
  choice: ‘बारी’ जोड़कर काव्यात्मक संक्षिप्तता बनाए रखना
  alternative: ‘वह कल मरा, तुम आज मरोगे’ जैसे पूर्ण विस्तार से अर्थ खोलना
  rationale: इब्रानी मृत्यु का उल्लेख स्पष्ट रूप से नहीं करता। ‘बारी’ निहित तुलना को समझने योग्य बनाती है, पर मृत्यु का समय निश्चित बताकर कथन को उससे अधिक स्पष्ट नहीं करती जितना मूल है।
- issue: यूनानी समानांतर के भिन्न पाठ का व्यवहार
  choice: मुख्य पाठ में इब्रानी को रखना और यूनानी को पदटिप्पणी में देना
  alternative: यूनानी पाठ को मुख्य पाठ में अपनाना
  rationale: दिया गया इब्रानी पाठ उच्च-विश्वास और मान्य स्रोत है तथा यूनानी उससे स्पष्टतः भिन्न है। अतः इब्रानी मुख्य आधार है; यूनानी मृत्यु-स्मरण के प्रसंग की पुष्टि करता है, पर उसका पाठ मुख्य पंक्ति में मिलाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठहराया हुआ भाग’ नियत हिस्से का भाव देता है; ‘कल उसकी बारी थी, आज तुम्हारी’ मूल की संक्षिप्त, गंभीर और समानांतर शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
