base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/013.yaml
  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: hi
  text: क्योंकि एक समय ऐसा होता है जब सफलता उसके हाथों में होती है[a]; क्योंकि वह भी परमेश्वर से विनती करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में है, “ऐसा समय आता है जब सफलता उनके हाथों में भी होती है।” इब्रानी साक्ष्य में एकवचन, “उसके हाथों में,” है, जिसका मुख्य पाठ में अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: दोनों उपवाक्यों में इसका कारणसूचक बल रखा गया है; यह आसपास के प्रसंग में वैद्य का आदर करने का कारण बताता है।
- source_word: יש עתם
  choice: ऐसा समय भी आता है
  rationale: इब्रानी के अनिश्चित एकवचन ‘एक समय होता है’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे विशेष रूप से ‘नियत समय’ बनाने के।
- source_word: בידו
  choice: उसके हाथों में
  rationale: इब्रानी एकवचन और हाथों द्वारा सामर्थ्य या व्यावहारिक कार्यकुशलता के मुहावरे—दोनों को बनाए रखता है।
- source_word: מצלחת
  choice: सफलता
  rationale: यह अनुकूल परिणाम या सफल होने का भाव देता है और चिकित्सकीय प्रसंग में स्पष्ट तथा स्वाभाविक है।
- source_word: גם הוא
  choice: वह भी
  rationale: इस बात पर बल बना रहता है कि रोगी के साथ-साथ वैद्य भी परमेश्वर की ओर फिरता है।
- source_word: אל אל
  choice: परमेश्वर से
  rationale: पहला אֶל संबंधसूचक अव्यय और दूसरा אֵל ईश्वरीय पद है; हिन्दी में विनती के साथ ‘परमेश्वर से’ स्वाभाविक है।
- source_word: יעתיר
  choice: विनती करेगा
  rationale: क्रिया की गंभीर और याचनापूर्ण प्रार्थना का भाव सामान्य पाठक के लिए सहज हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: चिकित्सकीय कौशल और परमेश्वर पर निर्भरता का संबंध
  choice: वचन वैद्य के हाथों मिलने वाली वास्तविक सफलता को स्वीकार करता है, साथ ही दिखाता है कि वैद्य स्वयं भी परमेश्वर से विनती करता है।
  alternative: इसे केवल इतना कहने के रूप में पढ़ा जा सकता है कि वैद्य कभी-कभी सफल होते हैं; यूनानी बहुवचन कथन को सभी वैद्यों पर सामान्य रूप से लागू करता है।
  rationale: इब्रानी और यूनानी दोनों मानवीय चिकित्सकीय साधनों की प्रभावशीलता तथा परमेश्वर पर प्रार्थनापूर्ण निर्भरता को साथ रखते हैं; अनुवाद इस तनाव को किसी एक ओर नहीं झुकाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसके हाथों में’ इब्रानी मुहावरे और एकवचन पाठ को सुरक्षित रखता है; पादटिप्पणी यूनानी बहुवचन को दर्ज करती है।
