translation:
  language: hi
  text: उन्हीं से वैद्य पीड़ा को शांत करता है, और इसी प्रकार औषधि बनाने वाला मिश्रण तैयार करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בהם
  choice: उन्हीं से
  rationale: बहुवचन सर्वनाम पिछले पद में वर्णित औषधीय पदार्थों या जड़ी-बूटियों की ओर संकेत करता है; करण का भाव बनाए रखा गया है।
- source_word: רופא
  choice: वैद्य
  rationale: चिकित्सा करने वाले व्यक्ति के लिए स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिन्दी शब्द।
- source_word: יניח מכאוב
  choice: पीड़ा को शांत करता है
  rationale: शाब्दिक भाव ‘पीड़ा को विश्राम देना/थमा देना’ है; यह अनुवाद दर्द घटाने का अर्थ देता है, बिना पूर्ण आरोग्य का दावा किए।
- source_word: רוקח
  choice: औषधि बनाने वाला
  rationale: संदर्भ में सुगंध-विक्रेता की अपेक्षा औषधीय पदार्थ मिलाकर तैयार करने वाला व्यक्ति अभिप्रेत है; सामान्य पाठक के लिए वर्णनात्मक रूप स्पष्ट है।
- source_word: עושה מרקחת
  choice: मिश्रण तैयार करता है
  rationale: רקח-सम्बन्धी पद मिश्रित औषधीय तैयारी को दर्शाता है; हिन्दी में अनावश्यक रूप से किसी विशिष्ट औषधि-रूप को निर्धारित नहीं किया गया।
