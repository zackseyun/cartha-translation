  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और शिक्षापरक शैली रखी गई है। ‘मृतक’ औपचारिक होने पर भी सामान्य पाठक के लिए स्पष्ट है; ‘विलाप’ मूल की औपचारिक शोक-अभिव्यक्ति को सुरक्षित रखता है।
