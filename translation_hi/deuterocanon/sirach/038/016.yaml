  yaml_path: translation/deuterocanon/sirach/038/016.yaml
  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
translation:
  language: hi
  text: मेरे बेटे, मृतक के लिए आँसू बहा; दुःख से व्याकुल हो और विलाप आरम्भ कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में अंतिम क्रिया का अर्थ अनिश्चित है। यूनानी समानांतर में है, “और मानो घोर पीड़ा सहते हुए विलाप आरम्भ कर,” जो यहाँ दिए गए अर्थ का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: मेरे बेटे
  rationale: एकवचन सम्बोधन के साथ प्रथम पुरुष एकवचन प्रत्यय है। यह अनुवाद मूल के पितृतुल्य शिक्षापरक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: על המת
  choice: मृतक के लिए
  rationale: यहाँ על शोक के कारण अथवा उसके विषय को दर्शाता है। ‘मृतक के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הזיב דמעה
  choice: आँसू बहा
  rationale: हिब्रू मुहावरे का शाब्दिक भाव आँसू को बहने देना है; यूनानी समानांतर भी रोने की आज्ञा की पुष्टि करता है।
- source_word: התמרר
  choice: दुःख से व्याकुल हो
  rationale: हित्पाएल रूप शोक की कड़वाहट में प्रवेश करने या अत्यन्त दुःखी होने का भाव देता है। ‘दुःख से व्याकुल हो’ हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल क्रिया-विशेषण बना देने के।
- source_word: וגהה קינה
  choice: और विलाप आरम्भ कर
  rationale: प्रेषित हिब्रू में अंतिम क्रिया कठिन है, पर קינה औपचारिक विलाप है और यूनानी समानांतर स्पष्ट रूप से विलाप आरम्भ करने का समर्थन करता है।
