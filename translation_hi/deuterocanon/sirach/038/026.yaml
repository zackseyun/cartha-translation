  register: भाषा आधुनिक, गरिमापूर्ण और ग्रामीण श्रम के ठोस चित्र को बनाए रखने वाली रखी गई है। ‘कूड़’ कृषि-संदर्भ का सटीक शब्द है; उसके साथ ‘हल से बनी’ जोड़कर इसे व्यापक हिन्दी पाठक-वर्ग के लिए समझने योग्य बनाया गया है।
