base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/026.yaml
  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
translation:
  language: hi
  text: उसकी लगन पशुओं को चारा देने की जगह को पूरा करने में है[a]; वह अपना मन हल से बनी कूड़ों में मिट्टी तोड़ने पर लगाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “और उसका रात भर जागना बछड़ों के चारे के लिए है।” यह पशुओं को लगातार चारा देने की चिंता का वही सामान्य भाव व्यक्त करता है। इब्रानी में संभवतः उस बाड़े या स्थान पर बल है जहाँ पशुओं को खिलाया जाता है।
    reason: alternative_reading
  - marker: b
    text: या “वह अपना मन हल से बनी कूड़ों पर फिर से काम करने में लगाता है।” इब्रानी क्रिया मिट्टी को जोतने के बाद उसके ढेले तोड़ने या उसे समतल करने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: उसकी लगन
  rationale: שקד से निकला यह शब्द लगातार ध्यान, तत्परता और परिश्रम का भाव रखता है। खेती के प्रसंग में ‘लगन’ सहज हिन्दी में इस निरंतर समर्पण को व्यक्त करता है।
- source_word: לכלות
  choice: काम पूरा करने
  rationale: כלה का मूल अर्थ पूरा करना या समाप्त करना है। हिन्दी में केवल ‘जगह पूरी करना’ अस्वाभाविक होता, इसलिए निहित कृषि-कार्य को स्पष्ट करते हुए ‘काम पूरा करने’ कहा गया है।
- source_word: מרבק
  choice: पशुओं को चारा देने की जगह
  rationale: מרבק उस स्थान या बाड़े को दर्शाता है जहाँ पशुओं को खिलाया और मोटा किया जाता है। यह रूप केवल घेराबंदी नहीं, बल्कि चारा देने के कार्य पर भी ध्यान रखता है; यूनानी समानांतर भी बछड़ों के चारे का उल्लेख करता है।
- source_word: לב ישית
  choice: वह अपना मन ... पर लगाता है
  rationale: यह इब्रानी मुहावरा किसी काम पर दृढ़तापूर्वक ध्यान लगाने का भाव देता है। ‘मन लगाना’ उसी चित्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לשדד
  choice: मिट्टी तोड़ने
  rationale: कृषि-प्रसंग में क्रिया का अर्थ जुती हुई मिट्टी को फिर से काम में लेना, ढेले तोड़ना या समतल करना हो सकता है। ‘मिट्टी तोड़ने’ ने किसी अत्यधिक संकीर्ण तकनीकी अर्थ को थोपे बिना यह क्रिया व्यक्त की है।
- source_word: בתלמים
  choice: हल से बनी कूड़ों में
  rationale: תלמים हल चलाने से बनी furrows या लंबी खाँचियाँ हैं। ‘कूड़’ इसका उपयुक्त कृषि-शब्द है, और ‘हल से बनी’ जोड़ने से सामान्य पाठक के लिए अर्थ स्पष्ट होता है।
