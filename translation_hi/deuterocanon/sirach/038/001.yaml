  text: Honor the physician according to your need of him[a], for God has also given him a portion.
translation:
  language: hi
  text: अपनी आवश्यकता के अनुसार चिकित्सक का आदर करो[a], क्योंकि उसके पास भी परमेश्वर की ओर से मिला एक हिस्सा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या यूनानी पाठ के अनुसार: “चिकित्सक की सेवाओं के लिए उसका आदर करो, क्योंकि प्रभु ने उसे भी बनाया है।” इब्रानी का अधिक शाब्दिक अर्थ है: “क्योंकि उसके पास भी परमेश्वर की ओर से एक हिस्सा है।”'
    reason: वैकल्पिक पाठ और इब्रानी वाक्यांश की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: רעי
  choice: आदर करो
  rationale: इब्रानी क्रिया में स्नेहपूर्वक व्यवहार करने या मान देने का भाव हो सकता है। यूनानी Τίμα (‘आदर करो’) इस अर्थ की पुष्टि करता है; ‘आदर करो’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: רופא
  choice: चिकित्सक
  rationale: यह शब्द रोगों का उपचार करने वाले व्यक्ति को दर्शाता है। ‘चिकित्सक’ ज्ञान-साहित्य की गरिमा बनाए रखते हुए आधुनिक पाठकों के लिए सहज है।
- source_word: לפני צרכו
  choice: अपनी आवश्यकता के अनुसार
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक संदिग्ध है, पर आवश्यकता के संदर्भ में चिकित्सक के प्रति व्यवहार का निर्देश देता है। यह अनुवाद उसी संबंध को स्वाभाविक हिन्दी में रखता है और वैकल्पिक यूनानी पाठ को पाद-टिप्पणी में सुरक्षित करता है।
- source_word: חלק אל
  choice: परमेश्वर की ओर से मिला एक हिस्सा
  rationale: חלק का मूल अर्थ ‘हिस्सा’ या ‘भाग’ है और אל यहाँ ‘परमेश्वर’ समझा गया है। यह रूप चिकित्सक के परमेश्वर-प्रदत्त स्थान को व्यक्त करते हुए इब्रानी बिंब को बनाए रखता है।
theological_decisions:
- issue: चिकित्सक का आदर करने का ईश्वरीय आधार
  choice: उसके पास भी परमेश्वर की ओर से मिला एक हिस्सा है
  alternative: प्रभु ने उसे भी बनाया है
  rationale: उपलब्ध इब्रानी पाठ ‘हिस्से/भाग’ की भाषा का प्रयोग करता है, जबकि यूनानी समानांतर पाठ सृष्टि की भाषा का। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठ को पाद-टिप्पणी में देता है, ताकि दोनों साक्ष्यों के बीच का अंतर मिटाया न जाए।
translation_notes:
