base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/024.yaml
  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: hi
  text: शास्त्री की बुद्धि अवकाश मिलने पर बढ़ती है, और जो अपने काम में कम व्यस्त रहता है, वह बुद्धिमान बनेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति का उपलब्ध इब्रानी पाठ कठिन है और यूनानी पाठ से साफ़ मेल नहीं खाता। यहाँ अनुवाद मुख्यतः अधिक स्पष्ट यूनानी पाठ के अर्थ का अनुसरण करता है, विशेषकर ‘शास्त्री’ और बुद्धि के लिए अवकाश मिलने की धारणा में।
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: बुद्धि / बुद्धिमान बनेगा
  rationale: इब्रानी पंक्ति पाठ की दृष्टि से कठिन है, जबकि यूनानी समानांतर स्पष्ट रूप से बुद्धि और बुद्धिमान बनने की बात करता है। यह चयन ज्ञान-साहित्य के भाव को बनाए रखता है।
- source_word: תומך מלמד || γραμματέως
  choice: शास्त्री
  rationale: उपलब्ध इब्रानी पदबंध अस्थिर और संदिग्ध है; यूनानी γραμματεύς का अर्थ यहाँ अध्ययन और लेखन से जुड़े ‘शास्त्री’ से है। आधुनिक हिन्दी में यह संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: अवकाश पाने पर
  rationale: यह पदबंध अनुकूल खाली समय अथवा श्रम से मिली फुरसत को बुद्धि के विकास की परिस्थिति के रूप में प्रस्तुत करता है।
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: जो अपने काम में कम व्यस्त रहता है
  rationale: यूनानी अभिव्यक्ति ऐसे व्यक्ति की ओर संकेत करती है जिसका व्यावहारिक काम या कामकाज अपेक्षाकृत कम हो। यह हिन्दी रूप सहज रहते हुए तुलना को सुरक्षित रखता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और उससे मेल न खाने वाले यूनानी समानांतर में चयन
  choice: मुख्य अर्थ के लिए स्पष्ट यूनानी समानांतर का अनुसरण, और पाठांतर को पादटिप्पणी में स्पष्ट करना
  alternative: 'कठिन इब्रानी का शाब्दिक अनुवाद: ‘हल थामने वाला कैसे बुद्धिमान बनेगा, और जो अंकुश की डंडी पर घमण्ड करता है?’'
  rationale: यह सिद्धान्तगत नहीं, पाठालोचनात्मक निर्णय है। वर्तमान इब्रानी पंक्ति कठिन है और यूनानी से साफ़ मेल नहीं खाती; यूनानी एक सुसंगत सूक्ति देता है। अनिश्चितता को छिपाने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सरल शैली। ‘शास्त्री’ से प्राचीन लेखक-अध्येता का भाव लिया गया है। वाक्य को स्वाभाविक बनाने के लिए ‘बढ़ती है’ प्रयुक्त है, जो अवकाश में शास्त्री की बुद्धि विकसित होने का यूनानी भाव व्यक्त करता है।
