- source_word: κεραμεὺς
  choice: कुम्हार
  rationale: मिट्टी के बर्तन बनाने वाले कारीगर के लिए यही सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: अपने काम पर बैठा रहता है
  rationale: यह कुम्हार की बैठी हुई मुद्रा और अपने काम में लगे होने, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: अपने पैरों से चाक घुमाता है
  rationale: ‘चाक’ कुम्हार के घूमने वाले पहिए का स्वाभाविक हिन्दी नाम है; ‘पैरों से’ क्रिया के साधन को स्पष्ट रखता है।
- source_word: ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ
  choice: वह निरंतर अपने काम की चिंता में लगा रहता है
  rationale: वाक्यांश लगातार बनी रहने वाली चिंता, ध्यान और व्यग्र लगन का भाव देता है। ‘चिंता में लगा रहता है’ इसे केवल मानसिक रोग-सदृश घबराहट बनाए बिना व्यक्त करता है।
- source_word: ἐνάριθμος πᾶσα ἡ ἐργασία αὐτοῦ
  choice: उसका सारा काम गिनती के अनुसार होता है
  rationale: ἐνάριθμος का मूल भाव ‘गिना हुआ/संख्या के अनुसार’ है। यह रूप जानबूझकर कुछ खुलापन रखता है कि आशय काम, उत्पादन या बनाई वस्तुओं की गणना से है।
