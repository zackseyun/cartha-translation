  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: hi
  text: इसी प्रकार कुम्हार अपने काम पर बैठा रहता है और अपने पैरों से चाक घुमाता है। वह निरंतर अपने काम की चिंता में लगा रहता है, और उसका सारा काम गिना हुआ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका सारा काम संख्या में है,” अथवा “उसकी बनाई हर वस्तु गिनी हुई है।” यूनानी शब्द ἐνάριθμος का अर्थ ‘गिना हुआ’ या ‘संख्याबद्ध’ हो सकता है।
    reason: ἐνάριθμος और ἐργασία के मेल में यह कुछ अस्पष्ट है कि कथन पूरे काम/उत्पादन के गिने होने का है या बनाई हुई वस्तुओं के गिने होने का।
