base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: hi
  text: क्या लकड़ी के द्वारा पानी मीठा नहीं किया गया था[b], ताकि हर मनुष्य को उसकी सामर्थ्य ज्ञात हो[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसकी” का संदर्भ स्पष्ट नहीं है। प्रसंग में इससे परमेश्वर की सामर्थ्य समझी जा सकती है। हिब्रू में इसे लकड़ी से जोड़कर भी समझना व्याकरणतः संभव है; किंतु यूनानी सर्वनाम पुल्लिंग है, जबकि ‘लकड़ी’ के लिए प्रयुक्त शब्द नपुंसकलिंग है।
    reason: alternative_reading
  - marker: b
    text: यह सम्भवतः उस घटना की ओर संकेत है जिसमें लकड़ी के माध्यम से कड़वा पानी मीठा किया गया था (निर्गमन 15:25)।
    reason: cross_reference
lexical_decisions:
- source_word: הלא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा करने वाला आलंकारिक प्रश्न है; यूनानी οὐκ भी इसी प्रश्नात्मक बल की पुष्टि करता है।
- source_word: בעץ
  choice: लकड़ी के द्वारा
  rationale: ב साधन का बोध कराता है और עץ को व्यापक रूप से 'लकड़ी' रखना निर्गमन 15:25 के संकेत को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता; यूनानी ξύλου भी इसका समर्थन करता है।
- source_word: המתיקו מים
  choice: पानी मीठा ... किया गया था
  rationale: हिब्रू क्रिया पानी को मीठा किए जाने की ठोस घटना बताती है; 'शुद्ध' या 'पीने योग्य' कहना अर्थ का विस्तार होता।
- source_word: בעבור להודיע
  choice: ताकि ... प्रकट हो
  rationale: בעבור के प्रयोजनार्थक संबंध और להודיע के 'ज्ञात कराना' भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כל אנוש
  choice: हर मनुष्य
  rationale: אנוש सामान्य मानव के लिए प्रयुक्त पुल्लिंग एकवचन संज्ञा है; 'हर मनुष्य' उसके वितरणात्मक और सार्वमानवीय अर्थ दोनों को बनाए रखता है।
- source_word: כחו
  choice: उसकी सामर्थ्य
  rationale: पुल्लिंग एकवचन प्रत्यय की संदिग्धता हिन्दी 'उसकी' में बनी रहती है; प्रसंग में इसे परमेश्वर की सामर्थ्य समझना संभव है, पर मुख्य पाठ उस निष्कर्ष को बाध्य नहीं करता।
theological_decisions:
- issue: כחו / αὐτοῦ में सर्वनाम का संदर्भ
  choice: '''उसकी''—मुख्य पाठ में संदर्भ को खुला रखा गया'
  alternative: '''परमेश्वर की सामर्थ्य'' या ''लकड़ी की सामर्थ्य'''
  rationale: हिब्रू और यूनानी दोनों में पुल्लिंग एकवचन सर्वनाम है। व्यापक प्रसंग परमेश्वर की सामर्थ्य की ओर संकेत कर सकता है, जबकि निकटतम संज्ञा लकड़ी है। हिन्दी सर्वनाम मूल की वास्तविक अस्पष्टता सुरक्षित रखता है; पादटिप्पणी प्रमुख व्याख्या बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न, साधन के रूप में लकड़ी, और सर्वनाम की मूल अस्पष्टता सुरक्षित हैं। 'हर मनुष्य' यहाँ समस्त मानवजाति के प्रत्येक व्यक्ति के अर्थ में है।
