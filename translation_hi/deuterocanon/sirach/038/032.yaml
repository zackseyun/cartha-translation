lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: अपनी बाँह से
  rationale: यहाँ βραχίων कारीगर की बाँह को श्रम के साधन के रूप में दिखाता है; ‘अपनी बाँह से’ स्वाभाविक हिन्दी में इस शारीरिक बिंब को बनाए रखता है।
- source_word: τυπώσει
  choice: आकार देगा
  rationale: πηλόν के साथ यह क्रिया मिट्टी को गढ़ने या रूप देने का अर्थ रखती है; ‘आकार देगा’ तकनीक को अनावश्यक रूप से विशिष्ट किए बिना भाव स्पष्ट करता है।
- source_word: πηλόν
  choice: मिट्टी
  rationale: कुम्हार के काम के संदर्भ में πηλός गढ़ने योग्य मिट्टी है; सामान्य हिन्दी में ‘मिट्टी’ सबसे सहज विकल्प है।
- source_word: πρὸ ποδῶν
  choice: अपने पैरों के आगे
  rationale: यह अनुवाद मूल यूनानी की ठोस स्थान-सूचक अभिव्यक्ति और नीचे रखे काम की छवि को सुरक्षित रखता है।
- source_word: κάμψει ἰσχὺν αὐτοῦ
  choice: पूरी ताकत से झुकेगा
  rationale: मूल वाक्यांश शाब्दिक रूप से ‘अपनी शक्ति को झुकाएगा’ है, जो हिन्दी में अस्वाभाविक होगा। चुना हुआ पाठ κάμψει के शारीरिक झुकाव और ἰσχύς के पूरे बल, दोनों को व्यक्त करता है, जबकि संभावित अर्थभेद पाद-टिप्पणी में रखा गया है।
