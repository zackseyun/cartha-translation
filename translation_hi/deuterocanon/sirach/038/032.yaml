  language: hi
  text: वह अपनी बाँह से मिट्टी को आकार देगा और अपने पैरों के आगे पूरी ताकत से झुकेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का शाब्दिक अर्थ है, “वह अपने पैरों के आगे अपनी शक्ति झुकाएगा।” इसका आशय कारीगर के पूरी ताकत से झुकने या अपने काम में अपना बल लगाने से हो सकता है।
