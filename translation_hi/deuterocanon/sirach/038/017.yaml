base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: hi
  text: मेरे बेटे, शोक को तीव्र कर और विलाप पूरा कर; उसके लिए वैसा ही शोक मना जैसा उसके योग्य है। एक-दो दिन आँसू बहा[a]; फिर अपने दुःख में सांत्वना पा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘आँसुओं के लिए’ है। यूनानी पाठ में ‘बदनामी/निन्दा के कारण’ है, सम्भवतः उचित शोक न मनाने पर होने वाली सामाजिक आलोचना के सन्दर्भ में।
    reason: textual_and_lexical_alternative
  - marker: b
    text: अन्तिम हिब्रू शब्द का सामान्य अर्थ ‘अधर्म’ भी हो सकता है; यहाँ उसका अर्थ ‘पीड़ा’ या ‘दुःख’ सम्भव है। यूनानी पाठ स्पष्ट रूप से ‘दुःख’ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: विलाप को तीखा कर
  rationale: हिफ़ील आज्ञार्थक का मूल बिंब ‘कड़वा करना’ है, पर शोक के साथ इसका भाव विलाप को तीव्र करने का है। ‘तीखा कर’ हिब्रू बिंब और स्वाभाविक हिन्दी के बीच संतुलन रखता है; यूनानी πίκρανον भी इसकी पुष्टि करता है।
- source_word: והתם מספד
  choice: शोकगीत पूरा कर
  rationale: क्रिया औपचारिक मृतक-विलाप को पूरा करने या भली-भाँति निभाने का निर्देश देती है। ‘शोकगीत’ מספד के विशिष्ट अर्थ को व्यक्त करता है।
- source_word: ושית אבלו כיוצא בו
  choice: उसके लिए वैसा ही शोक मना जैसा उसके योग्य है
  rationale: वाक्यांश मृतक के अनुरूप और उसे उचित शोक मनाने की बात करता है। यूनानी κατὰ τὴν ἀξίαν αὐτοῦ इस अर्थ का समर्थन करता है।
- source_word: יום ושנים
  choice: एक-दो दिन
  rationale: यह सीमित अवधि बताने वाला मुहावरा है; आधुनिक हिन्दी में ‘एक-दो दिन’ स्वाभाविक है।
- source_word: בעבור דמעה
  choice: आँसू बहा
  rationale: शाब्दिक रूप ‘आँसू के लिए/कारण’ है, पर सन्दर्भ में स्वाभाविक निर्देश रोने या आँसू बहाने का है।
- source_word: הנחם
  choice: सांत्वना पा
  rationale: आज्ञार्थक का भाव सक्रिय शोक से सांत्वना की ओर बढ़ना है। यह प्रतिकर्मक/निष्क्रिय अर्थ और यूनानी παρακλήθητι दोनों के अनुरूप है।
- source_word: בעבור עון
  choice: अपने दुःख में
  rationale: यह कठिन पद सामान्यतः ‘अधर्म’ भी अर्थ देता है, किन्तु शोक-सन्दर्भ और यूनानी λύπης के आधार पर यहाँ ‘दुःख/पीड़ा’ अधिक सम्भावित है। ‘में’ कारण अथवा परिस्थिति की अस्पष्टता को पूरी तरह कठोर नहीं बनाता।
theological_decisions:
- issue: जीवित हिब्रू पाठ और यूनानी समानांतर का सम्बन्ध
  choice: मुख्यतः हिब्रू से अनुवाद, कठिन अन्तिम पद में यूनानी को अर्थ-साक्ष्य के रूप में ग्रहण किया
  alternative: עון को ‘अधर्म’ अनुवाद करना, या पूरे पद में यूनानी शब्दावली को प्राथमिक बनाना
  rationale: हिब्रू साक्ष्य उपलब्ध और समग्रतः सुसंगत है। यूनानी समानांतर कठिन पद को दुःख/शोक के अर्थ-क्षेत्र में समझने में सहायता देता है, बिना हिब्रू को विस्थापित किए।
- issue: בעבור דמעה और यूनानी χάριν διαβολῆς के बीच पाठगत तनाव
  choice: मुख्य पाठ में यूनानी-साक्ष्य से सम्भावित सामाजिक उद्देश्य ‘बदनामी से बचने के लिए’ रखा, और हिब्रू के प्रत्यक्ष ‘आँसू’ को क्रिया के रूप में व्यक्त किया
  alternative: सिर्फ हिब्रू के अनुसार ‘आँसुओं के लिए एक-दो दिन’ कहना
  rationale: प्राप्त हिब्रू में דמעה ‘आँसू’ है, जबकि यूनानी ‘बदनामी/निन्दा के कारण’ पढ़ता है। दोनों को चुपचाप एक न मानते हुए हिन्दी में सम्भावित आशय दिया गया और पादटिप्पणी में पाठगत अन्तर स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय किन्तु गरिमापूर्ण सम्बोधन रखा गया है। ‘विलाप’, ‘शोकगीत’ और ‘सांत्वना’ सामान्य पाठक के लिए बोधगम्य रहते हुए अन्त्येष्टि-शोक की औपचारिकता व्यक्त करते हैं।
