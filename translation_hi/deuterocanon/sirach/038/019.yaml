base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/019.yaml
  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: hi
  text: अब और उस पर अपना मन लगाए न रहो[a]; उसकी स्मृति को जाने दो[b], और अंत को याद रखो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव है, ‘अब और उसकी ओर अपना हृदय मत लगाओ।’ शोक के प्रसंग में इसका अर्थ है कि मृत व्यक्ति पर मन को लगातार टिकाए न रखो।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसकी स्मृति को छोड़ दो’ अथवा ‘उसकी याद से अपनी पकड़ ढीली कर दो।’ इस वाक्यांश की इब्रानी क्रिया कठिन है; यूनानी समानांतर भी शोक से आगे बढ़ने के भाव का समर्थन करता है।
    reason: alternative_reading
  - marker: c
    text: या, ‘उसका अंत याद रखो’ अथवा ‘अपना अंत याद रखो।’ इब्रानी में केवल ‘अंत को याद रखो’ है, इसलिए संकेत जानबूझकर व्यापक हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב
  choice: उसके लिए अपना मन लगाए मत रहो
  rationale: इब्रानी मुहावरा शाब्दिक रूप से किसी की ओर अपना हृदय लगाने की बात करता है। शोक के प्रसंग में इसका आशय मृत व्यक्ति पर भावनात्मक रूप से टिके न रहने से है; यह हिन्दी रूप हृदय/मन की भाषा और प्रसंगगत अर्थ दोनों को बनाए रखता है।
- source_word: עוד
  choice: अब ... मत रहो
  rationale: यह शब्द पहले से जारी अवस्था को आगे न बढ़ाने का संकेत देता है। हिन्दी में ‘अब ... मत रहो’ स्वाभाविक रूप से ‘और अधिक/अब आगे’ का भाव व्यक्त करता है।
- source_word: פרע זכרו
  choice: उसकी स्मृति को जाने दो
  rationale: यह इब्रानी क्रिया यहाँ कठिन और कुछ अनिश्चित है। प्रसंग तथा यूनानी समानांतर शोक से आगे बढ़ने की ओर संकेत करते हैं; इसलिए पूर्णतः भूल जाने की कठोर आज्ञा के बजाय स्मृति पर अपनी पकड़ ढीली करने का भाव रखा गया है।
- source_word: וזכור אחרית
  choice: और अंत को याद रखो
  rationale: אחרית का अर्थ अंत, अंतिम दशा या परिणाम हो सकता है। संक्षिप्त ‘अंत’ इब्रानी की व्यापकता बनाए रखता है और यह तय नहीं करता कि संकेत मृत व्यक्ति के अंत की ओर है, शोक करने वाले के अपने अंत की ओर, या सामान्यतः मृत्यु की ओर।
theological_decisions:
- issue: ‘अंत’ (אחרית) किसका है
  choice: किसी एक व्यक्ति को निर्दिष्ट किए बिना ‘अंत’
  alternative: ‘उसका अंत याद रखो’ अथवा ‘अपना अंत याद रखो’
  rationale: इब्रानी में संबंधसूचक पद नहीं है। अनुवाद इस अर्थगत और धर्मवैचारिक व्यापकता को खुला रखता है, ताकि पाठ सामान्य मृत्यु, मृत व्यक्ति के अंत या पाठक के अपने अंत—इनमें से किसी एक तक सीमित न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक रूप अपनाया गया है। ‘मन लगाए मत रहो’ बोलचाल में समझ आने योग्य है, पर मूल की हृदय-केंद्रित छवि और लंबे शोक से हटने का आशय भी बचाता है।
