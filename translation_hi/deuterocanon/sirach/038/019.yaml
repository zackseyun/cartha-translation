    issue: The opening phrase uses an awkward construction and a potentially misleading postposition.
    rationale: “उसके लिए” can mean 'for his benefit' rather than 'toward/on him,' and “अपना मन लगाए मत रहो” is less idiomatic than a negative continuative construction with “न रहो.” A small revision improves modern Hindi naturalness and the directional sense of the Hebrew.
