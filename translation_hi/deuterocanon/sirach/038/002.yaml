    reason: textual_variant
  - marker: c
    text: या, “राजा से वह पारिश्रमिक पाता है।” इब्रानी मुहावरा कठिन है; यूनानी में “वह उपहार पाएगा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: परमेश्वर से
  rationale: इब्रानी पाठ में אל है; इसलिए मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है। यूनानी का ‘परमप्रधान’ पादटिप्पणी में दिया गया है।
- source_word: יחכם רופא
  choice: चिकित्सक बुद्धि पाता है
  rationale: प्राप्त इब्रानी का स्वाभाविक अर्थ ‘चिकित्सक बुद्धिमान होता/बुद्धि पाता है’ है, यद्यपि रचना कठिन है और यूनानी समानांतर ‘चंगाई’ पढ़ता है। मुख्य पाठ में इब्रानी के दोनों पद सुरक्षित रखे गए हैं।
- source_word: מאת מלך
  choice: राजा से
  rationale: इब्रानी पदबंध सामान्यतः ‘राजा से’ है; यही यूनानी समानांतर से भी मेल खाता है।
- source_word: ישא משאות
  choice: वह उपहार पाता है
  rationale: इब्रानी मुहावरा कठिन है और शब्दशः बोझ उठाने का संकेत दे सकता है; प्रसंग तथा यूनानी λήμψεται δόμα के आधार पर राजकीय उपहार अथवा पारिश्रमिक ग्रहण करना अभिप्रेत जान पड़ता है।
