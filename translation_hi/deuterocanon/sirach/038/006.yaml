  text: And he gave man understanding[c][b][a], to glory in his might.
translation:
  language: hi
  text: और उसने मनुष्य[a] को समझ दी, ताकि वह गौरव करे[b] उसके पराक्रम पर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” जातिवाचक है; अर्थ “मानवजाति” या “नश्वर मनुष्य” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गौरव करे” का अनुवाद “गर्व करे” या “उल्लसित हो” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “उसके पराक्रम” है; यूनानी समानांतर में “उसके अद्भुत कार्यों में” है। प्रसंग में “उसके” का संकेत संभवतः परमेश्वर की ओर है, यद्यपि व्याकरण की दृष्टि से मनुष्य की ओर संकेत करने की संभावना पूरी तरह समाप्त नहीं होती।
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  choice: और उसने ... दी
  rationale: हिब्रू का कथात्मक भूतकाल और यूनानी ἔδωκεν, दोनों बीते समय में दिए जाने का संकेत करते हैं।
- source_word: לאנוש
  choice: मनुष्य को
  rationale: אֱנוֹשׁ नश्वर मनुष्य को सूचित करता है और यहाँ जातिवाचक, सामूहिक अर्थ रखता है; यूनानी बहुवचन ἀνθρώποις भी समस्त मानवजाति के अर्थ की पुष्टि करता है।
- source_word: בינה
  choice: समझ
  rationale: בינה का निकटतम सामान्य हिन्दी अर्थ 'समझ' है; प्रसंग में विवेक या ज्ञान का भाव भी समाहित है।
- source_word: להתפאר
  choice: गौरव करे
  rationale: हित्पएल रूप में अपने को गौरवान्वित करना, गर्व करना या उल्लसित होना संभव है। 'गौरव करे' ऊँची शैली रखते हुए इस अर्थगत विस्तार को पूरी तरह संकीर्ण नहीं करता।
- source_word: בגבורתו
  choice: उसके पराक्रम पर
  rationale: גְּבוּרָה सीधे तौर पर सामर्थ्य या पराक्रम है। 'पराक्रम' मूल हिब्रू के निकट रहता है और यूनानी समानांतर के अनुसार परमेश्वर के प्रकट अद्भुत कार्यों की ओर भी संकेत कर सकता है, बिना 'कार्य' शब्द जोड़े।
theological_decisions:
- issue: בגבורתו में प्रत्यय 'उसके' का संदर्भ
  choice: मुख्य पाठ में 'उसके' को बनाए रखा गया है; प्रसंग में इसका सबसे स्वाभाविक संदर्भ परमेश्वर है।
  alternative: यह प्रत्यय मनुष्य की अपनी शक्ति या उपलब्धि की ओर भी समझा जा सकता है।
  rationale: आसपास का प्रसंग परमेश्वर को समझ और चंगाई के साधनों का दाता बताता है, और यूनानी 'उसकी अद्भुत बातों/कार्यों में' परमेश्वर की ओर दृढ़ संकेत करता है। फिर भी हिब्रू सर्वनाम स्वयं संदर्भ को स्पष्ट नाम से नहीं बताता, इसलिए वैकल्पिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमामय शैली। 'मनुष्य' मूल के प्रतिनिधिक एकवचन को रखता है, जबकि पादटिप्पणी उसका समावेशी सामूहिक अर्थ स्पष्ट करती है। पादटिप्पणी चिह्न संबंधित पदांशों के बाद क्रमशः लगाए गए हैं।
