  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
translation:
  language: hi
  text: पर वे युग की व्यवस्था को टिकाए रखेंगे[a], और उनकी प्रार्थना उनके शिल्प-कर्म में है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे युग की रचना को दृढ़ करेंगे।’ यूनानी पद κτίσμα αἰῶνος संक्षिप्त और अर्थ की दृष्टि से खुला है; यह समाज की टिकाऊ संरचना या अधिक व्यापक रूप से संसार की स्थापित व्यवस्था की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी विनती उनके शिल्प-कर्म के परिश्रम में है।’ इसका भाव यह हो सकता है कि उनकी प्रार्थना उनके कुशल शिल्प-कर्म से घनिष्ठ रूप से जुड़ी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले पदों में कारीगरों की सार्वजनिक सभा और न्याय-कार्य में अनुपस्थिति के विपरीत उनके आवश्यक योगदान को सामने लाता है।
- source_word: κτίσμα αἰῶνος
  choice: युग की व्यवस्था
  rationale: κτίσμα का मूल अर्थ ‘रची या बनाई हुई वस्तु/संरचना’ है और αἰῶνος का अर्थ ‘युग का’ हो सकता है। प्रसंग में यह कारीगरों द्वारा सँभाली जाने वाली दीर्घस्थायी सामाजिक व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी व्यापक अर्थ खुला रखती है।
- source_word: στηρίσουσιν
  choice: टिकाए रखेंगे
  rationale: στηρίζω में दृढ़ करने, सहारा देने और स्थिर रखने के अर्थ हैं। यहाँ भविष्यत् रूप कारीगरों द्वारा व्यवस्था को निरंतर सहारा देने का भाव प्रकट करता है।
- source_word: ἡ δέησις αὐτῶν
  choice: उनकी प्रार्थना
  rationale: δέησις प्रार्थनापूर्ण विनती या याचना है। ‘प्रार्थना’ आधुनिक हिन्दी में स्पष्ट है और धार्मिक आशय बनाए रखती है।
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: उनके शिल्प के काम में
  rationale: ἐν प्रार्थना को कुशल शिल्प-कर्म के क्षेत्र से जोड़ता है। यह अनुवाद उस संबंध को स्पष्ट किए बिना खुला रखता है कि प्रार्थना काम में व्यक्त होती है, उसके साथ होती है, या उसी से संबंधित है।
theological_decisions:
- issue: ‘उनकी प्रार्थना शिल्प के काम में है’ का आशय
  choice: प्रार्थना को उनके कुशल काम के क्षेत्र से जोड़ा गया है, बिना यह तय किए कि काम स्वयं प्रार्थना है।
  alternative: उनकी विनती अपने काम की सफलता के लिए है; अथवा उनकी प्रार्थना काम करते समय साथ-साथ चलती है।
  rationale: यूनानी δέησις सामान्यतः प्रार्थना या विनती है, जबकि ἐν ἐργασίᾳ τέχνης उसे शिल्प-कर्म से जोड़ता है। मूल वाक्य संबंध की प्रकृति स्पष्ट नहीं करता, इसलिए अनुवाद भी इस धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘युग की व्यवस्था’ और ‘टिकाए रखेंगे’ सामान्य पाठक के लिए स्वाभाविक हैं; दूसरी उपवाक्य की हल्की असामान्यता जानबूझकर रखी गई है ताकि यूनानी मूल की वास्तविक अस्पष्टता मिटे नहीं।
