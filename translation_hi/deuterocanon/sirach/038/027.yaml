  language: en
  yaml_path: translation/deuterocanon/sirach/038/027.yaml
  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: hi
  text: इसी प्रकार हर कारीगर और रूपरेखा बनानेवाला[a], जो रात को भी दिन के समान परिश्रम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पद बहुत संक्षिप्त है: “कारीगर और योजना/रूपरेखा बनानेवाला।” यूनानी समानांतर पाठ में निर्माता अथवा प्रधान कारीगर का उल्लेख है और आगे मुहरों पर नक्काशी करनेवालों तथा काम पूरा करने के लिए उनके जागते रहने का विस्तृत वर्णन मिलता है। मुख्य पाठ इब्रानी का अनुसरण करता है, जबकि कुशल योजना का भाव यूनानी से भी पुष्ट होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: इसी प्रकार
  rationale: यह शब्द पिछले प्रसंग से तुलना जोड़ता है; ‘इसी प्रकार’ उसके संयोजक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עשה חרש
  choice: कारीगर
  rationale: यह संक्षिप्त इब्रानी पद हाथ से कुशल काम करनेवाले शिल्पी का संकेत देता है। यूनानी τέκτων भी इस व्यापक अर्थ का समर्थन करता है; इसलिए किसी एक पेशे, जैसे बढ़ई या लोहार, तक अर्थ सीमित नहीं किया गया।
- source_word: וחשב
  choice: और रूपरेखा बनानेवाला
  rationale: חשב में सोचकर योजना बनाने और कलात्मक नमूना तैयार करने, दोनों का भाव हो सकता है। ‘रूपरेखा बनानेवाला’ इस कुशल रचनात्मक भूमिका को व्यक्त करता है, बिना इसे किसी आधुनिक पेशेवर पद तक सीमित किए।
- source_word: אשר
  choice: जो
  rationale: यह कारीगर का वर्णन करनेवाला संबंधवाचक उपवाक्य आरम्भ करता है।
- source_word: לילה כיום
  choice: रात को भी दिन के समान
  rationale: इब्रानी तुलना को बनाए रखते हुए यह उस श्रम को व्यक्त करता है जो रात में भी दिन की तरह चलता रहता है।
- source_word: יגיע
  choice: परिश्रम करता है
  rationale: क्रिया कठिन, थकानेवाले श्रम का बोध कराती है; ‘परिश्रम करता है’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
