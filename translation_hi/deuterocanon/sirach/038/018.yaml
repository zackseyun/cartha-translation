  yaml_path: translation/deuterocanon/sirach/038/018.yaml
  text: For from grief disaster comes forth[a]; so a sorrowful heart wastes away in sadness.
translation:
  language: hi
  text: क्योंकि शोक से विपत्ति निकलती है[a]; वैसे ही दुखी मन उदासी में घुलता जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में है: “क्योंकि शोक से मृत्यु निकलती है, और हृदय का दुःख शक्ति को झुका देता है।” इब्रानी में “मृत्यु” के स्थान पर “विपत्ति” है; इसलिए मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है और यूनानी पाठांतर यहाँ दिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: शोक से
  rationale: रूप अपने आप में कठिन है, पर यूनानी समानांतर ἀπὸ λύπης और शोक-संदर्भ इसे ‘शोक से’ समझने का प्रबल समर्थन करते हैं।
- source_word: יוצא
  choice: निकलती है
  rationale: यह परिणाम के रूप में किसी बात के प्रकट या उत्पन्न होने की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אסון
  choice: विपत्ति
  rationale: इब्रानी शब्द गंभीर अनिष्ट या विपत्ति को दर्शाता है; यूनानी में ‘मृत्यु’ है, जिसे पाठांतर के रूप में पादटिप्पणी में रखा गया है।
- source_word: רע לבב
  choice: दुखी मन
  rationale: शाब्दिक संरचना ‘मन का बुरा/दुखी होना’ है, पर शोक के प्रसंग और यूनानी ‘हृदय का दुख’ के अनुसार यहाँ नैतिक बुराई नहीं, आंतरिक व्यथा अभिप्रेत है।
- source_word: יכלה
  choice: घुलता जाता है
  rationale: क्रिया चुकने, क्षीण होने या समाप्त होते जाने का भाव देती है; ‘घुलता जाता है’ दुःख से क्रमिक क्षय को सहज हिन्दी में व्यक्त करता है।
- source_word: עצבה
  choice: उदासी में
  rationale: संज्ञा पीड़ा, दुःख या उदासी को दर्शाती है; यहाँ ‘उदासी में’ समान शब्दों की अनावश्यक पुनरावृत्ति से बचते हुए भाव को सुरक्षित रखता है।
- source_word: כן
  choice: वैसे ही
  rationale: यह दोनों अर्धपंक्तियों के बीच अनुरूपता स्थापित करता है और इब्रानी के ‘ऐसा ही/वैसे ही’ भाव को स्पष्ट रखता है।
