  yaml_path: translation/deuterocanon/sirach/038/022.yaml
  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
translation:
  language: hi
  text: मृतक का विश्राम-स्थान ही उसका निवास है[b]; और जब उसका प्राण निकल जाए, तब सांत्वना पाओ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसकी आत्मा निकल जाए।” इब्रानी נפש का अर्थ जीवन, प्राण, आत्मा या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ का आशय बहुत भिन्न है: “याद रख कि उसका न्याय तेरे न्याय के समान है: कल मेरी बारी थी और आज तेरी।” संभवतः यह बचे हुए इब्रानी पाठ से भिन्न पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מושבת
  choice: विश्राम-स्थान
  rationale: यह शब्द ישב धातु से बना है और बैठने या निवास करने के स्थान को सूचित कर सकता है। अंत्येष्टि के प्रसंग में ‘विश्राम-स्थान’ स्वाभाविक है और ‘कब्र’ कहकर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: מתו
  choice: मृतक का
  rationale: शाब्दिक अर्थ ‘उसका मृत जन’ हो सकता है, पर हिन्दी में यह बहुत अस्वाभाविक और संदिग्ध लगेगा। ‘मृतक का’ वाक्य के अंत्येष्टि-संबंधी अर्थ को स्पष्ट और सहज रखता है।
- source_word: שבת זכרו
  choice: ही उसका निवास है
  rationale: प्राप्त इब्रानी पाठ यहाँ संक्षिप्त और पाठगत रूप से कठिन है। उपलब्ध संशोधित विश्लेषण के अनुसार इसे स्मरण करने की आज्ञा मानने के बजाय मृतक के विश्राम-स्थान और निवास का कथन माना गया है; ‘ही’ हिन्दी में उस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: והנחם
  choice: सांत्वना पाओ
  rationale: यह रूप सांत्वना ग्रहण करने या धीरज पाने के आह्वान को व्यक्त करता है। ‘सांत्वना पाओ’ आधुनिक, गरिमापूर्ण और निष्क्रिय/आत्मवाचक भाव के निकट है।
- source_word: עם צאת
  choice: जब … निकल जाए
  rationale: עם को यहाँ कालवाचक और צאת को बाहर जाने या प्रस्थान करने के अर्थ में लिया गया है। हिन्दी में ‘जब … निकल जाए’ मृत्यु के प्रसंग का स्वाभाविक मुहावरा है।
- source_word: נפשו
  choice: उसका प्राण
  rationale: נפש का अर्थ जीवन, प्राण, आत्मा या व्यक्ति हो सकता है। मृत्यु के प्रसंग में ‘प्राण निकलना’ सहज हिन्दी मुहावरा है और किसी विशिष्ट दार्शनिक आत्मा-सिद्धांत को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: मृत्यु के प्रसंग में נפש का अनुवाद
  choice: उसका प्राण निकल जाए
  alternative: उसकी आत्मा निकल जाए
  rationale: इब्रानी נפש अर्थ की दृष्टि से व्यापक है। मुख्य पाठ में ‘प्राण’ स्वाभाविक मृत्यु-मुहावरे को बनाए रखता है, जबकि ‘आत्मा’ को पादटिप्पणी में संभावित विकल्प के रूप में रखा गया है ताकि धर्मवैज्ञानिक तनाव बना रहे।
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ का बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: '“याद रख कि उसका न्याय तेरे न्याय के समान है: कल मेरी बारी थी और आज तेरी।”'
  rationale: सिराख के इस पद के लिए उपलब्ध इब्रानी पाठ प्राथमिक साक्ष्य है, यद्यपि उसका पहला खंड कठिन और कुछ असंगत है। यूनानी पाठ संभवतः भिन्न पाठ-रूप को दर्शाता है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण अंत्येष्टि-सम्बन्धी भाषा रखी गई है। ‘विश्राम-स्थान’ ने ‘कब्र’ से अधिक व्यापक इब्रानी अर्थ बचाया है; ‘प्राण निकलना’ सामान्य हिन्दी मुहावरा है। पहले इब्रानी खंड की पाठगत कठिनाई को बिना काल्पनिक सुधार के अनुवादित किया गया है और भिन्न यूनानी पाठ को पादटिप्पणी में दिया गया है।
