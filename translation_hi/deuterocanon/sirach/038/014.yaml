translation:
  language: hi
  text: क्योंकि उसकी विनती सफल हो सकती है[a], और उसका उपचार जीवन बनाए रखने के लिए है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानी פשרה का अर्थ अनिश्चित है। यूनानी समानांतर अधिक स्पष्ट रूप से कहता है: “वे भी प्रभु से विनती करेंगे कि वह उन्हें राहत और चंगाई में सफलता दे, ताकि वे जीवित रहें।”'
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  choice: उसकी विनती
  rationale: यह इब्रानी शब्द यहाँ कठिन और अनिश्चित है। यूनानी समानांतर में δεηθήσονται (‘वे विनती करेंगे/प्रार्थना करेंगे’) है, इसलिए ‘विनती’ निवेदन का भाव व्यक्त करती है, पर उसे किसी विशेष धार्मिक विधि तक सीमित नहीं करती।
- source_word: יצלח לו
  choice: सफल हो सकती है
  rationale: יצלח का सामान्य अर्थ सफल या फलदायी होना है। ‘हो सकती है’ पाठ की अनिश्चितता और अपेक्षित परिणाम—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ורפאות
  choice: उसका उपचार
  rationale: इब्रानी बहुवचन उपचार या चंगाई के साधनों को सूचित कर सकता है और यूनानी ἴασιν चंगाई की पुष्टि करता है। ‘उपचार’ आधुनिक हिन्दी में स्वाभाविक है और यह खुला रखता है कि संकेत उपचार-क्रिया की ओर है या उससे मिलने वाली चंगाई की ओर।
- source_word: למען מחיה
  choice: जीवन बनाए रखने के लिए
  rationale: यह उद्देश्यसूचक पद जीवन के जारी रहने या बचाए रखे जाने का भाव देता है; यूनानी χάριν ἐμβιώσεως भी निरंतर जीवन की ओर संकेत करता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और अधिक स्पष्ट यूनानी समानांतर के बीच संबंध
  choice: मुख्य वाक्य-विन्यास इब्रानी के अनुसार रखा गया है, जबकि פשרה को ‘विनती’ समझने में यूनानी प्रार्थना-संबंधी पाठ को स्पष्टकारी साक्ष्य माना गया है।
  alternative: ‘क्योंकि उसकी प्रार्थना सफल होगी, और चंगाई जीवन के लिए है।’
  rationale: इब्रानी साक्ष्य संक्षिप्त और विशेषतः פשרה में अस्पष्ट है। निश्चित ‘प्रार्थना’ या निश्चित परिणाम थोपने के बजाय ‘विनती’ और ‘हो सकती है’ मूल की अस्पष्टता तथा यूनानी के सहायक अर्थ—दोनों को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘उसकी’ और ‘उसका उपचार’ में मूल पाठ की संदर्भगत अस्पष्टता जानबूझकर बनाए रखी गई है।
