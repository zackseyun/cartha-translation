  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: hi
  text: परमेश्वर ने धरती से औषधियाँ उत्पन्न की हैं[b][a], और समझदार मनुष्य उनका तिरस्कार नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में कर्ता ‘परमेश्वर’ (אל) है; यूनानी समानांतर में ‘प्रभु’ (Κύριος) है।
    reason: alternative_reading
  - marker: b
    text: ‘उत्पन्न की हैं’ के पीछे का इब्रानी रूप इस हस्तलिखित पाठ-परंपरा में कठिन है; यूनानी समानांतर में ‘सृजन किया है’ का अर्थ है और वह इस समझ का समर्थन करता है कि परमेश्वर धरती से औषधियों को अस्तित्व में लाता है।
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: परमेश्वर
  rationale: इब्रानी אל यहाँ ईश्वर के लिए प्रयुक्त उपाधि है। यूनानी समानांतर में Κύριος (‘प्रभु’) है, पर मुख्य इब्रानी साक्ष्य को प्राथमिकता देते हुए ‘परमेश्वर’ रखा गया है।
- source_word: מארץ
  choice: धरती से
  rationale: מִן + אֶרֶץ औषधियों के भौतिक स्रोत को दर्शाता है; ‘धरती से’ स्वाभाविक हिन्दी है और यूनानी ἐκ γῆς से भी मेल खाता है।
- source_word: מצוציא
  choice: उत्पन्न की हैं
  rationale: इब्रानी रूप पाठ-परंपरा में कठिन है और संभवतः ‘निकालने/उपजाने’ का भाव देता है। ‘उत्पन्न की हैं’ इस भाव को सुरक्षित रखता है, जबकि यूनानी ἔκτισεν इसके पीछे परमेश्वर की सृजनकारी भूमिका की पुष्टि करता है।
- source_word: תרופות
  choice: औषधियाँ
  rationale: यह शब्द उपचार में प्रयुक्त दवाओं या उपचारकारी पदार्थों को सूचित करता है; ‘औषधियाँ’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: גבר מבין
  choice: समझदार मनुष्य
  rationale: גבר का अर्थ ‘मनुष्य/पुरुष’ और מבין का अर्थ समझ-बूझ या विवेक रखने वाला है। ‘समझदार मनुष्य’ प्रतिनिधिक पुल्लिंग और व्यावहारिक विवेक—दोनों को बनाए रखता है।
- source_word: אל ימאס בם
  choice: उनका तिरस्कार नहीं करेगा
  rationale: מאס में अस्वीकार करने और तुच्छ समझने का भाव है। ‘तिरस्कार नहीं करेगा’ उसके मूल्यांकनात्मक बल को बनाए रखता है और सामान्य सत्य के रूप में आए अपूर्ण क्रिया-रूप के अनुकूल है।
theological_decisions:
- issue: इब्रानी אל और यूनानी समानांतर Κύριος में ईश्वरीय उपाधि
  choice: मुख्य पाठ में ‘परमेश्वर’
  alternative: ‘प्रभु’
  rationale: मूल इब्रानी साक्ष्य स्पष्टतः אל देता है, इसलिए हिन्दी मुख्य पाठ में ‘परमेश्वर’ रखा गया है। यूनानी का ‘प्रभु’ पादटिप्पणी में बताया गया है; दोनों पाठों में औषधियों का स्रोत ईश्वर ही है।
- issue: कठिन इब्रानी מצוציא का अर्थ
  choice: ‘उत्पन्न की हैं’
  alternative: ‘सृजी हैं’ या ‘निकाली हैं’
  rationale: इब्रानी रूप की कठिनता को देखते हुए ऐसा पद चुना गया है जो धरती से औषधियों को अस्तित्व में लाने का अर्थ देता है, पर यूनानी के अधिक विशिष्ट ‘सृजा’ को बिना सूचना के इब्रानी पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘औषधियाँ’ चिकित्सा-संदर्भ को स्पष्ट रखता है; ‘समझदार मनुष्य’ मूल के प्रतिनिधिक पुल्लिंग और विवेक के भाव को सुरक्षित रखता है। पादटिप्पणी-चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में रखे गए हैं।
