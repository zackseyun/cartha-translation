  yaml_path: translation/deuterocanon/sirach/038/028.yaml
  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: hi
  text: इसी प्रकार लोहार निहाई के पास बैठकर अनगढ़े लोहे को ध्यान से देखता है; आग की भाप उसका मांस गलाती है, और वह भट्ठी की तपिश से जूझता है।
