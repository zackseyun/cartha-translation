lexical_decisions:
- source_word: χαλκεύς
  choice: लोहार
  rationale: यह धातु का काम करने वाले कारीगर के लिए सामान्य शब्द हो सकता है; निकट संदर्भ में लोहे का स्पष्ट उल्लेख होने के कारण आधुनिक हिन्दी में ‘लोहार’ सबसे स्वाभाविक है।
- source_word: ἐγγὺς ἄκμονος
  choice: निहाई के पास
  rationale: कारीगरी के इस संदर्भ में ἄκμων का मानक और सहज हिन्दी रूप ‘निहाई’ है।
- source_word: καταμανθάνων
  choice: ध्यान से देखता है
  rationale: कृदंत निकट और सावधान निरीक्षण का भाव देता है; यह हिन्दी में स्वाभाविक है और अनावश्यक अकादमिक अर्थ नहीं जोड़ता।
- source_word: ἀργῷ σιδήρῳ
  choice: अनगढ़े लोहे को
  rationale: ἀργός यहाँ निष्क्रिय अथवा अभी तक न गढ़े गए लोहे का संकेत देता है। ‘अनगढ़ा’ उसकी कार्य-पूर्व अवस्था को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀτμὶς πυρός
  choice: आग की भाप
  rationale: ἀτμίς भाप, वाष्प अथवा निकलती हुई गरम साँस-जैसी चीज को दर्शाता है। इसे बाद में आने वाली θέρμη ‘तपिश’ से अलग रखा गया है।
- source_word: τήξει σάρκας αὐτοῦ
  choice: उसके शरीर को गलाती है
  rationale: τήξει का मूल चित्र ‘गलाने’ का है और σάρκας शाब्दिक रूप से ‘मांस’ है। हिन्दी में ‘शरीर को गलाती है’ स्रोत की तीव्र छवि और श्रम से होने वाली शारीरिक क्षति, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν θέρμῃ καμίνου
  choice: भट्ठी की तपिश से
  rationale: धातुकर्म के संदर्भ में κάμινος के लिए ‘भट्ठी’ और θέρμη के लिए ‘तपिश’ सटीक तथा सहज हैं।
- source_word: διαμαχήσεται
  choice: जूझता है
  rationale: क्रिया कठिन और लगातार संघर्ष का भाव देती है; ‘जूझता है’ सैन्य अर्थ को अनावश्यक रूप से प्रबल किए बिना इसे व्यक्त करता है।
