- source_word: φωνὴ σφύρης
  choice: हथौड़े की आवाज़
  rationale: यहाँ φωνή बोली हुई ‘वाणी’ नहीं, बल्कि हथौड़े से उत्पन्न ध्वनि है; सरल और स्वाभाविक हिन्दी में ‘आवाज़’ उपयुक्त है।
- source_word: καινεῖ τὸ οὖς αὐτοῦ
  choice: उसके कान पर चोट करती है
  rationale: इस प्रसंग में क्रिया कठिन है। कार्यशाला के संदर्भ और हथौड़े की बार-बार पड़ती चोटों से उत्पन्न ध्वनि के प्रभाव को व्यक्त करने के लिए यह रूप चुना गया है, जबकि मूल की अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: κατέναντι
  choice: पर लगी रहती हैं
  rationale: शाब्दिक अर्थ ‘सामने’ या ‘आमने-सामने’ है; आँखों के साथ यह कारीगर के लगातार ध्यान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁμοιώματος
  choice: आकार
  rationale: यह उस रूप या नमूने को सूचित करता है जिसके अनुसार पात्र गढ़ा जा रहा है। ‘आकार’ अनावश्यक व्याख्यात्मक विस्तार के बिना इस अर्थ को व्यक्त करता है।
- source_word: σκεύους
  choice: पात्र
  rationale: कारीगरी के इस संदर्भ में σκεῦος किसी बनाए जा रहे पात्र या वस्तु को दर्शाता है; ‘पात्र’ संक्षिप्त और गरिमापूर्ण है।
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: उसकी आँखें
  rationale: मूल के ठोस शारीरिक बिंब को सीधे बनाए रखा गया है।
