  terminology: “अंतिम परिष्करण” is deliberately nontechnical and suitably cautious for the disputed τὸ χάρισμα. The footnote explains that, in this pottery context, it may denote decoration, coating, or finishing. “भट्ठी” fits the ceramic context and covers kiln/furnace appropriately.
