lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: उस पर मन लगाएगा
  rationale: यह यूनानी मुहावरा किसी काम में मन लगाकर जुटने का भाव देता है। हिन्दी में यह स्वाभाविक है और ‘हृदय’ के अत्यधिक शाब्दिक, असहज प्रयोग से बचता है।
- source_word: συντελέσαι
  choice: काम पूरा करे
  rationale: क्रिया कारीगर के प्रयत्न के लक्ष्य—काम को पूर्ण करना—को व्यक्त करती है।
- source_word: τὸ χάρισμα
  choice: सजावट का काम
  rationale: शाब्दिक अर्थ ‘वरदान’ यहाँ कुम्हार के प्रसंग में उपयुक्त नहीं है। शब्द कठिन और संदिग्ध है; प्रसंग के आधार पर इसे पात्र की सजावटी या अंतिम परिष्कृति के रूप में लिया गया है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: रात भर जागकर
  rationale: यह जागते रहकर सावधानी से काम देखने का ठोस भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθαρίσαι
  choice: साफ़ करेगा
  rationale: भट्ठी के संदर्भ में ‘साफ़ करना’ सहज है और अनावश्यक धार्मिक-शुद्धि का भाव नहीं लाता।
- source_word: κάμινον
  choice: भट्ठी
  rationale: कुम्हारी के संदर्भ में सामान्य ‘भट्ठी’ यूनानी शब्द के furnace/kiln दोनों आयामों को हिन्दी में उपयुक्त रूप से व्यक्त करती है।
