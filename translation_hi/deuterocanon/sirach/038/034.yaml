- source_word: πάντες οὗτοι
  choice: इन सबने
  rationale: यह पद पहले बताए गए कारीगरों की ओर संकेत करता है। यूनानी में ‘पुरुष’ जैसा कोई स्पष्ट संज्ञा-पद नहीं है, इसलिए अनावश्यक विस्तार नहीं किया गया।
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: अपने हाथों पर भरोसा रखा है
  rationale: क्रिया और εἰς χεῖρας का संयोजन असामान्य है, पर सक्रिय बहुवचन रूप के अनुसार यह अर्थ संभवतः कारीगरों का अपनी हस्त-कुशलता पर निर्भर होना है। ‘हाथों पर भरोसा’ मूल की मूर्त अभिव्यक्ति को बनाए रखता है; अन्य व्याकरणगत संभावना पादटिप्पणी में दी गई है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह यूनानी के वितरणात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: अपने काम में
  rationale: ἔργον यहाँ प्रत्येक व्यक्ति के काम या पेशे को सूचित करता है; ‘अपने काम में’ स्वाभाविक हिन्दी है और संबंधवाचक अर्थ को रखता है।
- source_word: σοφίζεται
  choice: कुशल होता है
  rationale: क्रिया बुद्धिमान होने या कौशल दिखाने का अर्थ दे सकती है। कारीगरों और उनके काम के संदर्भ में व्यावहारिक कौशल का अर्थ अधिक उपयुक्त है, जबकि वर्तमानकालीन सामान्य कथन को बनाए रखा गया है।
