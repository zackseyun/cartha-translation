base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/011.yaml
  text: Present a memorial offering of soothing aroma[b][a], and enrich the arranged offering with the best of your wealth.
translation:
  language: hi
  text: सुखद सुगंध वाली स्मरण-बलि अर्पित कर,[a] और अपनी संपत्ति के उत्तम अंश से सजाकर रखी हुई चरबी को भरपूर कर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक रूप है, “सुखद स्मरण-बलि निकट ला।” यहाँ “सुखद” बलि की स्वीकार्य सुगंध का संकेत देता है; यूनानी समानांतर स्पष्ट रूप से “सुगंध” और “मैदे का स्मरण-अर्पण” कहता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी का शाब्दिक रूप लगभग यह है, “अपनी संपत्ति के पंखों से सजाकर रखी हुई चरबी को भरपूर कर।” “संपत्ति के पंख” सम्भवतः उसके उत्तम भाग या अपनी सामर्थ्य की पूरी सीमा से देने का मुहावरा है। यूनानी समानांतर का अंतिम भाग बहुत अलग है: “भेंट को समृद्ध कर, मानो तू अस्तित्व में न हो।” मुख्य पाठ में इब्रानी साक्ष्य का अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: अर्पित कर
  rationale: बलिदान के प्रसंग में נגש के इस आज्ञार्थक रूप का अर्थ किसी भेंट को निकट लाना अथवा चढ़ाना है। ‘अर्पित कर’ आधुनिक हिन्दी में स्वाभाविक है और उपासना-संबंधी भाव बनाए रखता है।
- source_word: ניחוח
  choice: सुखद सुगंध वाली
  rationale: बलिदान-संबंधी भाषा में ניחוח स्वीकार्य और सुखद सुगंध का भाव देता है। इब्रानी में ‘सुगंध’ के लिए अलग संज्ञा नहीं है, पर यूनानी εὐωδία इसकी पुष्टि करता है; हिन्दी में यह रूप अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אזכרה
  choice: स्मरण-बलि
  rationale: यह बलि के उस स्मरण-अंश या स्मरण-अर्पण का पारिभाषिक शब्द है जिसे चढ़ाया जाता था। ‘स्मरण-बलि’ सामान्य ‘स्मरण’ की अपेक्षा इसके अनुष्ठानिक अर्थ को स्पष्ट रखता है।
- source_word: ודשן
  choice: भरपूर कर
  rationale: דשן का मूल भाव मोटा, समृद्ध या प्रचुर करना है। ‘भरपूर कर’ उदार मात्रा का अर्थ देता है और हिन्दी में ‘मोटा कर’ की अस्वाभाविकता से बचता है।
- source_word: ערוך
  choice: सजाई हुई चरबी
  rationale: ערוך का अर्थ क्रम से रखा या तैयार किया हुआ है; यहाँ सन्दर्भ वेदी पर व्यवस्थित बलि-अंश का है। ‘चरबी’ सम्भावित ठोस बलिदानी संकेत को बनाए रखती है, यद्यपि यूनानी समानांतर इसे व्यापक रूप से ‘भेंट’ कहता है।
- source_word: בכנפי הוניך
  choice: अपनी संपत्ति के उत्तम अंश से
  rationale: शाब्दिक रूप ‘अपनी संपत्ति के पंखों/छोरों से’ है। כנף यहाँ छोर, सीमा अथवा चुने हुए भाग की ओर संकेत करने वाला मुहावरा जान पड़ता है; हिन्दी रूप उदारता और उत्तमता का सम्भावित आशय स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक रूपक सुरक्षित रखती है।
theological_decisions:
- issue: ज्ञान-साहित्य के प्रसंग में बलिदानी बिंब
  choice: ‘स्मरण-बलि’ और ‘चरबी’ जैसे स्पष्ट अनुष्ठानिक शब्द बनाए रखे गए हैं।
  alternative: इसे सामान्य ‘स्मरण’, ‘भेंट’ या आत्मिक भक्ति के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ बलिदान-संबंधी शब्दावली का प्रयोग करता है और यूनानी समानांतर भी भेंट का अर्थ पुष्ट करता है। इसलिए इसे केवल प्रार्थना या भक्ति में बदल देना पाठ के धार्मिक तनाव और ठोस अनुष्ठानिक स्वरूप को मिटा देता।
- issue: यूनानी समानांतर के भिन्न अंतिम वाक्यांश का मूल्यांकन
  choice: मुख्य पाठ में उच्च-विश्वसनीयता वाले इब्रानी पाठ का अनुसरण किया गया है।
  alternative: यूनानी के अनुसार ‘मानो तू अस्तित्व में न हो’ जैसा अंतिम वाक्यांश लेना।
  rationale: यूनानी अंतिम खंड में पर्याप्त भिन्न है। उपलब्ध इब्रानी साक्ष्य को आधार बनाते हुए यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है, न कि दोनों को मिलाकर एक नया पाठ बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सुबोध एकवचन आज्ञार्थक शैली अपनाई गई है। अनुष्ठानिक शब्दावली को सामान्य आध्यात्मिक भाषा में नहीं बदला गया। ‘सजाई हुई चरबी’ जानबूझकर कुछ ठोस और अपरिचित रखी गई है, क्योंकि मूल इब्रानी की बलिदानी छवि और उसकी व्याख्यात्मक कठिनाई दोनों को पूरी तरह समतल करना उचित नहीं होगा।
