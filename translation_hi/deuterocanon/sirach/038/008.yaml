  text: so that his work may not cease[b][a], and success may come through men.
translation:
  language: hi
  text: 'ताकि उसका काम न रुके, और मनुष्यों[b] से सफलता[a] मिले।


    [a] यहाँ इब्रानी शब्द תושיה का अर्थ निश्चित नहीं है; इसका अर्थ “सुदृढ़ता,” “सफलता” या “प्रभावकारी सहायता” हो सकता है। यूनानी समानांतर पाठ है, “और उससे सारी पृथ्वी पर शान्ति है।”


    [b] इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “मनुष्य-जाति से” है; यहाँ इसका अर्थ केवल पुरुष नहीं, बल्कि सामान्य रूप से सभी मनुष्य हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी शब्द תושיה का अर्थ निश्चित नहीं है; इसका अर्थ “सुदृढ़ता,” “सफलता” या “प्रभावकारी सहायता” हो सकता है। यूनानी समानांतर पाठ है, “और उससे सारी पृथ्वी पर शान्ति है।”
    reason: कठिन इब्रानी शब्द की अर्थ-सीमा और यूनानी वैकल्पिक साक्ष्य को सुरक्षित रखना।
  - marker: b
    text: इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “मनुष्य-जाति से” है; यहाँ इसका अर्थ केवल पुरुष नहीं, बल्कि सामान्य रूप से सभी मनुष्य हैं।
    reason: मूल सामूहिक अभिव्यक्ति के लिंग-समावेशी अर्थ और उसके उद्गम-संबंधी बल को स्पष्ट करना।
lexical_decisions:
- source_word: למען
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का परिचय देता है; “ताकि” आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को बनाए रखता है।
- source_word: לא ישבות
  choice: न रुके
  rationale: שבת यहाँ रुकने या समाप्त होने के अर्थ में है। “न रुके” निरन्तर चलते रहने का भाव संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מעשהו
  choice: उसका काम
  rationale: एकवचन संज्ञा पर पुरुषवाचक प्रत्यय है। प्रसंग में यह औषधि-मिश्रण तैयार करने वाले के कार्य को सूचित करता है; “काम” व्यापक और सहज है।
- source_word: ותושיה
  choice: और सफलता
  rationale: תושיה यहाँ अर्थ की दृष्टि से कठिन है और सुदृढ़ता, सफलता अथवा प्रभावकारी सहायता का संकेत दे सकता है। मुख्य पाठ में “सफलता” प्रसंगानुकूल है, जबकि पादटिप्पणी अनिश्चितता और यूनानी साक्ष्य को सुरक्षित रखती है।
- source_word: מבני אדם
  choice: मनुष्यों के द्वारा
  rationale: शाब्दिक अभिव्यक्ति “आदम की सन्तानों से” है। מן को यहाँ माध्यम या उद्गम के रूप में समझते हुए यह अनुवाद सामान्य मानव समुदाय का भाव देता है, पुरुषों तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: इब्रानी “ותושיה מבני אדם” और यूनानी समानांतर “और उससे पृथ्वी के मुख पर शान्ति है” के बीच सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता देते हुए “और मनुष्यों के द्वारा सफलता मिले” रखा गया है।
  alternative: “और उससे सारी पृथ्वी पर शान्ति है।”
  rationale: इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए वही आधार है। फिर भी תושיה מבני אדם संक्षिप्त और अर्थ की दृष्टि से कठिन है; यूनानी एक भिन्न या व्याख्यात्मक पाठ का साक्ष्य देता है। पादटिप्पणी दोनों के बीच तनाव को बिना कृत्रिम समाधान के स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। “काम” और “न रुके” सहज हैं; कठिन पाठगत प्रश्नों को मुख्य वाक्य बोझिल किए बिना पादटिप्पणियों में रखा गया है।
