base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/023.yaml
  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: hi
  text: शास्त्री की बुद्धि से बुद्धि बढ़ती है, और जो काम-काज की व्यस्तता से मुक्त है[a], वह बुद्धिमान बनेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ है, “जिसके पास काम या व्यवसाय नहीं है।” यहाँ आशय अध्ययन में बाधा डालने वाली काम-काज की व्यस्तताओं से मुक्त होने पर मिलने वाले अवकाश से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अनुवाद में यहाँ मृतक के स्मरण और शोक के विषय में एक भिन्न कथन है; वह इस हिब्रू पाठ का सीधा समानांतर नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: חכמת סופר
  choice: शास्त्री की बुद्धि
  rationale: ‘शास्त्री’ यहाँ केवल लिखने वाले व्यक्ति नहीं, बल्कि ग्रंथों का अध्ययन करने वाले विद्वान की सामाजिक भूमिका को व्यक्त करता है; ‘बुद्धि’ חכמה का सीधा और प्रसंगानुकूल अर्थ है।
- source_word: תרבה חכמה
  choice: से बुद्धि बढ़ती है
  rationale: हिब्रू में शाब्दिक रूप से ‘बुद्धि को बढ़ाती है’ है। हिन्दी में करण-वाक्य ‘से बुद्धि बढ़ती है’ मूल के कारणात्मक भाव और जानबूझकर दोहराए गए ‘बुद्धि’ को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וחסר עסק
  choice: जो काम-काज की व्यस्तता से मुक्त है
  rationale: शाब्दिक अर्थ ‘जिसे काम/व्यवसाय की कमी है’ है, पर प्रसंग में आशय बेरोज़गारी नहीं, बल्कि अध्ययन में बाधा डालने वाली व्यावहारिक व्यस्तताओं से खाली समय मिलना है। ‘काम-काज की व्यस्तता से मुक्त’ इस अर्थ को स्पष्ट रखते हुए עסק की अर्थ-सीमा भी बचाता है।
- source_word: יתחכם
  choice: बुद्धिमान बनेगा
  rationale: हित्पएल रूप यहाँ बुद्धि प्राप्त करने या बुद्धिमान बनने की प्रक्रिया बताता है; इसे केवल बुद्धिमान दिखाई देने के अर्थ में नहीं लिया गया।
theological_decisions:
- issue: काम से मुक्ति और बुद्धि के संबंध को पूर्ण निष्क्रियता की प्रशंसा मानना
  choice: व्यावहारिक व्यस्तता से उपलब्ध अवकाश के रूप में अनुवाद
  alternative: ‘जिसके पास कोई काम नहीं’
  rationale: आस-पास का प्रसंग पेशागत कामों और शास्त्रीय अध्ययन के लिए मिलने वाले अवकाश में अंतर करता है; इसलिए कथन को बेरोज़गारी या श्रम-विरोधी सिद्धांत के रूप में प्रस्तुत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शास्त्री’ विद्वान ग्रंथ-अध्येता की प्राचीन भूमिका को बनाए रखता है। हिब्रू की ‘बुद्धि—बुद्धि’ पुनरुक्ति को अर्थपूर्ण शैलीगत विशेषता मानकर संरक्षित किया गया है; वाक्य को हिन्दी में स्वाभाविक बनाने के लिए ‘से बुद्धि बढ़ती है’ कहा गया है।
