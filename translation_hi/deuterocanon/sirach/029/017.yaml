  yaml_path: translation/deuterocanon/sirach/029/017.yaml
  text: And one who is ungrateful in mind will abandon the one who rescued him[a].
translation:
  language: hi
  text: और जो मन से कृतघ्न है, वह अपने छुड़ानेवाले को छोड़ देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχάριστος
  choice: कृतघ्न
  rationale: यह विशेषण उपकार के प्रति कृतज्ञता के अभाव को व्यक्त करता है; ‘कृतघ्न’ आधुनिक मानक हिन्दी में संक्षिप्त, स्वाभाविक और नैतिक बलयुक्त है।
- source_word: ἐν διανοίᾳ
  choice: मन से
  rationale: यह पद व्यक्ति की भीतरी मनोवृत्ति या सोच को स्पष्ट करता है। ‘मन से’ मूल की आंतरिकता को बनाए रखते हुए हिन्दी में सहज है।
- source_word: ἐγκαταλείψει
  choice: छोड़ देगा
  rationale: भविष्यकालीन क्रिया का अर्थ छोड़ देना, त्याग देना या बेसहारा कर देना है। ‘छोड़ देगा’ यहाँ स्वाभाविक है और बिना अनावश्यक व्याख्या के मूल अर्थ रखता है।
- source_word: ῥυσάμενον
  choice: अपने छुड़ानेवाले को
  rationale: यह ῥύομαι का भूतकालिक कृदंत है और उस व्यक्ति को दर्शाता है जिसने उसे संकट से छुड़ाया। हिन्दी में ‘अपने’ जोड़ने से मूल में निहित संबंध स्पष्ट और स्वाभाविक होता है।
theological_decisions:
- issue: लिंग-सामान्य व्यक्तिवाचक अभिव्यक्ति
  choice: जो मन से कृतघ्न है
  alternative: कृतघ्न मनुष्य
  rationale: यूनानी में कोई स्पष्ट संज्ञा नहीं है; विशेषण व्यक्ति को सामान्य रूप से सूचित करता है। संबंधवाचक हिन्दी रचना मूल की सामान्य प्रतिनिधिक शक्ति को बनाए रखती है और अनावश्यक रूप से पुरुषवाचक संज्ञा नहीं जोड़ती।
- issue: भीतरी मनोवृत्ति का स्पष्ट उल्लेख
  choice: मन से कृतघ्न
  alternative: कृतघ्न
  rationale: ἐν διανοίᾳ को छोड़ देने से मूल में व्यक्त आंतरिक वृत्ति दब जाती। ‘मन से’ उस तनाव को बनाए रखता है कि कृतघ्नता केवल बाहरी व्यवहार नहीं, भीतर की दशा भी है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और नीतिवचन-सदृश रखी गई है। ‘छुड़ानेवाला’ धार्मिक अर्थ तक सीमित नहीं, बल्कि सामान्य संकट से बचाने वाले व्यक्ति के लिए भी सुबोध है।
