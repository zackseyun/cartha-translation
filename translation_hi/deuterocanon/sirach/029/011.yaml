review_pass:
  verdict: revise
  source_fidelity: Greek θὲς is an aorist imperative of ‘put/lay up’; with ‘treasure’ in this wisdom context, ‘संचित कर’ accurately conveys the prudent storing-up sense without adding an explicit reference to almsgiving. The plural ‘आज्ञाओं’ correctly represents ἐντολάς, and ‘परमप्रधान’ appropriately renders the divine title Ὑψίστου. The comparison with gold is retained.
  naturalness: ‘अपने खज़ाने को ... रख’ is grammatically possible but unnatural and semantically underpowered in modern Hindi for the purposeful ‘lay up/store’ sense. ‘अपना खज़ाना ... संचित कर’ is idiomatic, concise, and preserves the imperative address. ‘लाभदायक होगा’ is more natural than saying that the treasure ‘लाभ देगा.’
  terminology: '‘परमप्रधान,’ ‘आज्ञाओं,’ ‘खज़ाना,’ and ‘सोना’ are suitable, dignified modern Hindi biblical terminology. No footnote is required: the Hindi plural faithfully reflects the Greek, and the verse itself does not specify almsgiving.'
  issues:
  - severity: medium
    issue: ‘रख’ does not naturally convey the contextual force of θὲς with ‘treasure.’
    rationale: Although ‘रख’ can render τίθημι in isolation, here it reads like a simple instruction to keep something rather than to lay it up or store it. ‘संचित कर’ conveys the source’s sense in a natural Hindi expression without narrowing the treasure to almsgiving.
  - severity: low
    issue: ‘वह तुझे ... लाभ देगा’ is less idiomatic than a predicative rendering.
    rationale: λυσιτελήσει means ‘will be profitable/advantageous to you.’ ‘वह तेरे लिए ... लाभदायक होगा’ is closer to this construction and more fluent Hindi.
  revised_text: अपना खज़ाना परमप्रधान की आज्ञाओं के अनुसार संचित कर; वह तेरे लिए सोने से भी अधिक लाभदायक होगा।
  revised_footnotes: []
  revision_rationale: The revision replaces the overly literal and awkward ‘रख’ with ‘संचित कर,’ which best communicates the imperative’s treasure-related sense in modern Hindi while retaining the verse’s broad wording. It also improves the final clause’s Hindi idiom and preserves the Greek plural, divine title, comparison, and direct singular address.
