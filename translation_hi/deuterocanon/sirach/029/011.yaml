  yaml_path: translation/deuterocanon/sirach/029/011.yaml
  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: hi
  text: अपना खज़ाना परमप्रधान की आज्ञाओं के अनुसार संचित कर; वह तेरे लिए सोने से भी अधिक लाभदायक होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: रख
  rationale: τίθημι के अओरिस्ट आज्ञार्थक का सीधा अर्थ ‘रख’ है। यह खज़ाने के उचित उपयोग या नियोजन का भाव बनाए रखता है और मूल में स्पष्ट रूप से न कही गई ‘दान दे’ या ‘संचित कर’ जैसी व्याख्या नहीं जोड़ता।
- source_word: τὸν θησαυρόν σου
  choice: अपने खज़ाने को
  rationale: θησαυρός के लिए ‘खज़ाना’ स्वाभाविक है और धन-संपत्ति के साथ-साथ मूल्यवान संचित वस्तु का व्यापक अर्थ बनाए रखता है।
- source_word: κατʼ ἐντολὰς
  choice: आज्ञाओं के अनुसार
  rationale: ἐντολάς बहुवचन है; हिन्दी में बहुवचन ‘आज्ञाओं’ मूल रूप को स्पष्ट और स्वाभाविक ढंग से दर्शाता है।
- source_word: Ὑψίστου
  choice: परमप्रधान की
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि Ὕψιστος का प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: λυσιτελήσει σοι
  choice: वह तुझे ... लाभ देगा
  rationale: क्रिया का अर्थ लाभकारी या फायदेमंद होना है। ‘लाभ देगा’ हिन्दी में सहज है और पद की आर्थिक उपमा को बनाए रखता है।
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: सोने से भी अधिक
  rationale: यह तुलनात्मक अर्थ को सीधे व्यक्त करता है; ‘भी’ तुलना पर स्वाभाविक हिन्दी बल देता है, बिना ‘बेहतर’ जैसी अतिरिक्त मूल्यात्मक व्याख्या जोड़े।
theological_decisions:
- issue: क्या पद को विशेष रूप से दान देने के विषय में स्पष्ट किया जाए
  choice: 'मूल की व्यापक अभिव्यक्ति रखी गई: ‘अपने खज़ाने को परमप्रधान की आज्ञाओं के अनुसार रख।’'
  alternative: ‘दान देकर अपना खज़ाना संचित कर’ जैसा संदर्भ-आधारित अनुवाद
  rationale: आसपास का प्रसंग उधार देने और उदारता से जुड़ा है, पर इस यूनानी वाक्य में दान का स्पष्ट उल्लेख नहीं है। व्यापक शब्दावली मूल की अर्थगत खुलावट और धार्मिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘तुझे’ ज्ञान-साहित्य की सीधी व्यक्तिगत संबोधन-शैली को बनाए रखता है।
