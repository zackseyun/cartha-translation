revisions:
- from: अपने खज़ाने को परमप्रधान की आज्ञाओं के अनुसार रख; वह तुझे सोने से भी अधिक लाभ देगा।
  to: अपना खज़ाना परमप्रधान की आज्ञाओं के अनुसार संचित कर; वह तेरे लिए सोने से भी अधिक लाभदायक होगा।
  rationale: The revision replaces the overly literal and awkward ‘रख’ with ‘संचित कर,’ which best communicates the imperative’s treasure-related sense in modern Hindi while retaining the verse’s broad wording. It also improves the final clause’s Hindi idiom and preserves the Greek plural, divine title, comparison, and direct singular address.
