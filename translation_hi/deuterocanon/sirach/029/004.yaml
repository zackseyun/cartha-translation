  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
translation:
  language: hi
  text: बहुतों ने उधार को मानो अनायास मिला लाभ समझा है, और अपनी सहायता करने वालों को कष्ट दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुतों ने
  rationale: यह अनिश्चित बहुवचन है, जो सामान्य रूप से अनेक लोगों की ओर संकेत करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ὡς εὕρεμα
  choice: मानो हाथ लगा धन
  rationale: εὕρεμα का मूल अर्थ मिली हुई वस्तु या अचानक प्राप्त लाभ है। उधार के प्रसंग में यह उस धन को लौटाने योग्य ऋण के बजाय अनायास मिले लाभ जैसा मानने को दर्शाता है।
- source_word: ἐνόμισαν
  choice: समझा है
  rationale: νομίζω यहाँ किसी वस्तु को किसी रूप में मानने या समझने के अर्थ में है। पूर्ण पक्ष सूक्तिपरक और सामान्य कथन को आधुनिक हिन्दी में स्वाभाविक बनाता है।
- source_word: δάνος
  choice: उधार
  rationale: δάνος उधार दी गई राशि या ऋण को सूचित करता है। इस वाक्य में 'उधार' सामान्य पाठक के लिए सहज और सीधा है।
- source_word: παρέσχον πόνον
  choice: परेशानी खड़ी की है
  rationale: यह पदबंध शाब्दिक रूप से पीड़ा या कष्ट देने को व्यक्त करता है; प्रसंग में 'परेशानी खड़ी करना' उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: जिन्होंने उनकी सहायता की, उन्हीं के लिए
  rationale: कृदन्त उन लोगों को दर्शाता है जिन्होंने उनकी मदद की थी, अर्थात प्रसंगतः उधार देने वाले; अनुवाद यूनानी की सामान्य अभिव्यक्ति को बनाए रखता है और अनावश्यक विशिष्टता नहीं जोड़ता।
