review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies δάνος as ‘उधार’ and preserves the contrast between borrowers’ attitude and the resulting harm to their helpers. However, ‘मानो हाथ लगा धन’ is not idiomatic modern Hindi and is somewhat unclear as an equivalent for ὡς εὕρεμα. The final clause’s ‘उन्हीं के लिए परेशानी खड़ी की है’ shifts the construction toward causing trouble ‘for’ them rather than directly causing them trouble.
  naturalness: A more natural proverbial Hindi rendering uses ‘अनायास मिला लाभ’ for the contextual sense of εὕρεμα and ‘अपनी सहायता करने वालों को कष्ट दिया है’ for παρέσχον πόνον τοῖς βοηθήσασιν αὐτοῖς.
  terminology: ‘उधार’ appropriately renders δάνος. ‘अनायास मिला लाभ’ conveys the contextual force of something found or an unexpected gain without suggesting that the loan was literally discovered. ‘कष्ट दिया’ is a clear, suitably dignified rendering of the Greek expression for causing trouble/pain.
  issues:
  - severity: medium
    issue: ‘मानो हाथ लगा धन’ is awkward and semantically imprecise.
    rationale: Although it aims to express an unexpected find, this phrase is not established natural Hindi and can sound like money physically coming into one’s hand. The Greek describes treating a loan as a ‘find,’ i.e., an unearned or unexpected gain.
  - severity: medium
    issue: The syntax of ‘उन्हीं के लिए परेशानी खड़ी की है’ is less direct than the Greek.
    rationale: The Greek says that borrowers caused trouble to those who helped them. ‘...को कष्ट दिया है’ clearly preserves the recipient of the harm.
  revised_text: बहुतों ने उधार को मानो अनायास मिला लाभ समझा है, और अपनी सहायता करने वालों को कष्ट दिया है।
  revised_footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मानो मिली हुई कोई वस्तु”; अर्थात उन्होंने उधार को लौटाने योग्य धन नहीं, बल्कि अनायास प्राप्त लाभ जैसा समझा।
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural idiom with clear modern Hindi while retaining the source’s image of a loan treated as a find or windfall. It also makes the final clause directly state that the helpers received the trouble, as in the Greek. The footnote preserves the literal lexical alternative and explains its contextual sense.
