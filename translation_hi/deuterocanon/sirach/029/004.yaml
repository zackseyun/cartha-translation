revisions:
- from: बहुतों ने उधार को मानो हाथ लगा धन[a] समझा है, और जिन्होंने उनकी सहायता की, उन्हीं के लिए परेशानी खड़ी की है।
  to: बहुतों ने उधार को मानो अनायास मिला लाभ समझा है, और अपनी सहायता करने वालों को कष्ट दिया है।
  rationale: The revision replaces an unnatural idiom with clear modern Hindi while retaining the source’s image of a loan treated as a find or windfall. It also makes the final clause directly state that the helpers received the trouble, as in the Greek. The footnote preserves the literal lexical alternative and explains its contextual sense.
  reviewer_model: gpt-5.6-terra
