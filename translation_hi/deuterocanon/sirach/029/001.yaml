    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: जो दया करता है
  rationale: यह सामी शैली की अभिव्यक्ति केवल दया महसूस करने नहीं, बल्कि उसे व्यवहार में दिखाने को व्यक्त करती है।
- source_word: δανιεῖ
  choice: उधार देगा
  rationale: यूनानी क्रिया भविष्यत् काल में है और अध्याय के आर्थिक प्रसंग में वास्तविक ऋण देने को दर्शाती है।
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी को
  rationale: नैतिक संदर्भ में πλησίον के लिए ‘पड़ोसी’ सहज और परिचित हिन्दी है; ‘अपने’ सम्बन्ध को स्वाभाविक बनाता है।
- source_word: ὁ ἐπισχύων
  choice: जो ... उसे सहारा देता है
  rationale: ἐπισχύω में बल देने या समर्थन करने का भाव है। ‘सहारा देता है’ आधुनिक हिन्दी में स्वाभाविक है और अगली हस्त-छवि के साथ व्यावहारिक सहायता दर्शाता है।
- source_word: τῇ χειρὶ αὐτοῦ
  choice: अपने हाथ से
  rationale: मूल की साधनवाचक और ठोस छवि सुरक्षित रहती है; इसका आशय व्यक्तिगत, व्यावहारिक सहायता भी हो सकता है।
- source_word: τηρεῖ ἐντολάς
  choice: आज्ञाओं का पालन करता है
  rationale: यह हिन्दी में आज्ञाओं को मानने के धार्मिक-नैतिक भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
