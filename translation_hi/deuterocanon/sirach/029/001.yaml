  choice: आज्ञाओं का पालन करता है
  alternative: आदेशों को मानता है
  rationale: सिराख के ज्ञान-साहित्यिक संदर्भ में यह पद परमेश्वर की आज्ञाओं की पहचानी हुई धार्मिक-नैतिक श्रेणी की ओर संकेत करता है, यद्यपि यूनानी में निश्चित उपपद नहीं है।
