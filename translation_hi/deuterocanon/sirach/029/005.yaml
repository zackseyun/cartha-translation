base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: hi
  text: जब तक वह धन पा नहीं लेता, तब तक वह अपने पड़ोसी का हाथ चूमेगा और अपने पड़ोसी के धन के लिए दबे स्वर में बोलेगा; पर लौटाने का समय आने पर वह टालमटोल करेगा और बदले में बेपरवाही भरी बातें देगा[a] और समय को दोषी ठहराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बदले में देगा’ के लिए प्रयुक्त यूनानी क्रिया सामान्यतः चुकाने या लौटा देने के अर्थ में आती है। यहाँ व्यंग्य यह है कि वह धन के बदले केवल बेपरवाही भरी बातें देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: जब तक वह धन पा नहीं लेता
  rationale: यह खंड ऋण मिलने से पहले उधार लेने वाले के चापलूसी भरे व्यवहार की समय-सीमा बताता है। कर्म मूल में निहित है; प्रसंग के आधार पर ‘धन’ स्पष्ट किया गया है।
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: वह अपने पड़ोसी का हाथ चूमेगा
  rationale: ठोस शारीरिक बिंब और अतिशय विनय बनाए रखी गई है। αὐτοῦ का संदर्भ अगले वाक्यांश के πλησίον से स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον ταπεινώσει φωνήν
  choice: उसके धन के लिए दबे स्वर में बोलेगा
  rationale: ταπεινόω φωνήν का शब्दशः अर्थ ‘स्वर को नीचा करना’ है; ‘दबे स्वर में बोलना’ आधुनिक हिन्दी में विनीत और अधीन भाव से बोलने का स्वाभाविक मुहावरा है।
- source_word: ἐν καιρῷ ἀποδόσεως παρελκύσει χρόνον
  choice: लौटाने का समय आने पर वह टालमटोल करेगा
  rationale: παρελκύσει χρόνον समय खींचने और जानबूझकर विलंब करने का भाव देता है; ‘टालमटोल’ इस व्यवहार को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: बदले में बेपरवाही भरी बातें देगा
  rationale: ἀποδώσει में ऋण चुकाने के स्थान पर केवल बातें ‘लौटाने’ की व्यंग्यात्मक शब्द-क्रीड़ा है। ἀκηδία की लापरवाही, उदासीनता और परवाह न करने की अर्थ-छाया ‘बेपरवाही’ में सुरक्षित है।
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: समय को दोषी ठहराएगा
  rationale: वह अपनी विफलता का दोष समय या परिस्थितियों पर डालता है। यह अनुवाद καιρός की कुछ हद तक खुली अर्थ-सीमा को बनाए रखता है।
