  yaml_path: translation/deuterocanon/sirach/029/022.yaml
  text: Better is the life of a poor man under shelter than splendid food in another's house[a][b].
translation:
  language: hi
  text: कड़ियों की छत[a] के नीचे गरीब का जीवन, पराए घर में बढ़िया पकवानों[b] से अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी δοκῶν को यहाँ δοκός (‘छत की कड़ी, शहतीर’) का बहुवचन संबंधकारक समझा गया है। इसी रूप को δοκέω का कृदंत मानने पर अर्थ ‘प्रतीत होता हुआ’ या ‘समझा जाता हुआ’ हो सकता है, पर इस वाक्य में वह अर्थ कठिन है।
    reason: lexical_ambiguity
  - marker: b
    text: या ‘दूसरों के यहाँ शानदार भोजन’। यूनानी पद ἐν ἀλλοτρίοις का अर्थ अधिक सामान्य रूप से ‘पराई वस्तुओं/स्थानों में’ अथवा ‘दूसरों के बीच’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: अच्छा है
  rationale: यह तुलनात्मक विशेषण नीतिवचन की ‘इससे वह अच्छा है’ संरचना बनाता है; हिन्दी में वाक्य के अंत में ‘से अच्छा है’ स्वाभाविक है।
- source_word: βίος πτωχοῦ
  choice: गरीब का जीवन
  rationale: βίος यहाँ केवल जीविका नहीं, जीवन अथवा जीवन-दशा को सूचित करता है; πτωχοῦ एकवचन संबंधकारक है।
- source_word: ὑπὸ σκέπην δοκῶν
  choice: कड़ियों की छत के नीचे
  rationale: δοκῶν को δοκός (‘कड़ी, शहतीर’) का संबंधकारक बहुवचन मानने पर वाक्यांश का स्वाभाविक अर्थ ‘कड़ियों से बनी छत/ओट के नीचे’ होता है। हिन्दी में ‘कड़ियों की छत के नीचे’ साधारण किंतु सुरक्षित आश्रय का चित्र स्पष्ट रखता है।
- source_word: ἐδέσματα λαμπρά
  choice: बढ़िया पकवान
  rationale: ἐδέσματα तैयार खाद्य या व्यंजन हैं और λαμπρά उनकी शानदार या भव्य गुणवत्ता बताता है; ‘बढ़िया पकवान’ आधुनिक, सहज और अर्थानुकूल है।
- source_word: ἐν ἀλλοτρίοις
  choice: पराए घर में
  rationale: ἀλλότριος का मूल भाव ‘दूसरे का/पराया’ है। भोजन और आश्रय के संदर्भ में ‘पराए घर में’ दूसरों पर निर्भर वैभव का आशय स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी बहुवचन अधिक व्यापक हो सकता है।
