    text: या “प्रवासी” अथवा “वहाँ रहने वाला विदेशी।” यूनानी शब्द πάροικος ऐसे व्यक्ति को दर्शाता है जो उस स्थान पर रहता है, पर घर या समुदाय का पूर्ण सदस्य नहीं माना जाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρελθε
  choice: आगे बढ़ो
  rationale: παρέρχομαι के आज्ञार्थक रूप में यहाँ किसी को आगे बढ़ने या अपनी जगह छोड़ने का रूखा निर्देश है। ‘आगे बढ़ो’ इस सीधे स्वर को बनाए रखता है और यूनानी क्रिया की संभावित दिशात्मक अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: πάροικε
  choice: परदेसी
  rationale: πάροικος ऐसे व्यक्ति को दर्शाता है जो किसी स्थान पर रहता तो है, पर वहाँ का पूर्ण सदस्य नहीं माना जाता। ‘परदेसी’ आधुनिक हिन्दी में उसकी बाहरी सामाजिक स्थिति को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: κόσμησον τράπεζαν
  choice: मेज़ तैयार करो
  rationale: कोस्मेओ यहाँ सजावटी अर्थ में नहीं, बल्कि भोजन के लिए मेज़ व्यवस्थित या तैयार करने के व्यावहारिक अर्थ में है।
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: यदि तुम्हारे हाथ में कुछ हो
  rationale: यह अनुवाद यूनानी की ठोस अभिव्यक्ति ‘तुम्हारे हाथ में’ को बनाए रखते हुए अधिकार या उपलब्ध साधन का भाव भी व्यक्त करता है।
- source_word: ψώμισόν με
  choice: उससे मुझे खिलाओ
  rationale: ψωμίζω का अर्थ भोजन देना या कौर खिलाना है। ‘मुझे खिलाओ’ प्रत्यक्ष आज्ञा और वक्ता की निर्भरता दोनों को सुरक्षित रखता है; ‘उससे’ पहले कही हुई उपलब्ध वस्तु से संबंध स्पष्ट करता है।
