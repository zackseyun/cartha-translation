translation:
  language: hi
  text: “आगे बढ़ो, परदेसी[a]; मेज़ तैयार करो, और यदि तुम्हारे हाथ में कुछ हो, तो उससे मुझे खिलाओ।”
  philosophy: optimal-equivalence
  footnotes:
