    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यह पिछले निर्देश के बाद एक अपवादात्मक या विरोधसूचक बात प्रस्तुत करता है; ‘परन्तु’ उसके बल को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἐπὶ ταπεινῷ
  choice: दीन जन के साथ
  rationale: ταπεινός का अर्थ नीचा, विनम्र, निर्धन या दबा हुआ व्यक्ति हो सकता है। उधार और दान के प्रसंग में ‘दीन जन’ सामाजिक और आर्थिक असहायता को व्यक्त करता है, बिना इसे केवल आन्तरिक विनम्रता तक सीमित किए।
- source_word: μακροθύμησον
  choice: धीरज रखो
  rationale: आज्ञार्थक क्रिया सहनशील और धैर्यवान व्यवहार की माँग करती है; ‘धीरज रखो’ आधुनिक हिन्दी में सहज है।
- source_word: ἐπʼ ἐλεημοσύνην
  choice: दान देने में
  rationale: यहूदी-यूनानी प्रयोग में ἐλεημοσύνη प्रायः जरूरतमंद को दिया जाने वाला दान है। ‘दान देने में’ यहाँ अमूर्त दया के बजाय ठोस सहायता को स्पष्ट करता है।
- source_word: μὴ παρελκύσῃς
  choice: प्रतीक्षा न कराओ
  rationale: क्रिया का अर्थ विलम्ब करना या बात को खींचना हो सकता है। व्यक्ति αὐτόν को कर्म मानते हुए यह अनुवाद उसके इंतजार को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: αὐτόν
  choice: उसे
  rationale: एकवचन सर्वनाम का सम्बन्ध अभी उल्लिखित दीन जन से है; ‘उसे’ हिन्दी में स्वाभाविक रूप से वही सन्दर्भ बनाए रखता है।
