  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: hi
  text: दूसरे के ऋण की जमानत देने ने सही दिशा में बढ़ रहे बहुतों[a] को बरबाद कर दिया और उन्हें समुद्र की लहर की तरह डगमगा दिया; उसने शक्तिशाली पुरुषों को उनके घरों से निकाल दिया, और वे विदेशी राष्ट्रों के बीच भटकते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अर्थ ‘सीधे मार्ग पर चल रहे’ या ‘जिनके कामकाज सुचारु चल रहे थे’ भी हो सकता है।
    reason: κατευθύνοντας में नैतिक-दिशात्मक और समृद्धि-संबंधी दोनों अर्थ-संभावनाएँ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐγγύη
  choice: जमानत लेने
  rationale: यह पद किसी दूसरे व्यक्ति के ऋण के लिए उत्तरदायी होने या सुरक्षा देने को सूचित करता है। ‘जमानत लेने’ आधुनिक हिन्दी में इसका संक्षिप्त और समझने योग्य वित्तीय-कानूनी रूप है।
- source_word: ἀπώλεσεν
  choice: बरबाद कर दिया
  rationale: क्रिया गंभीर हानि या विनाश तक पहुँचा देने को व्यक्त करती है; प्रसंग में जीवन अथवा संपत्ति की बरबादी अभिप्रेत हो सकती है, न कि अनिवार्य रूप से मृत्यु।
- source_word: κατευθύνοντας
  choice: सही दिशा में बढ़ रहे
  rationale: यूनानी कृदंत में सीधे मार्ग पर आगे बढ़ने और कामकाज के सुचारु या सफल होने, दोनों की संभावना है। चुना हुआ रूप मूल बिंब को बनाए रखते हुए इस अर्थ-विस्तार को खुला रखता है।
- source_word: ἐσάλευσεν
  choice: डगमगा दिया
  rationale: यह हिला देने या अस्थिर कर देने का भाव देता है और साथ आने वाले समुद्री लहर के उपमान से स्वाभाविक रूप से जुड़ता है।
- source_word: ὡς κῦμα θαλάσσης
  choice: समुद्र की लहर के समान
  rationale: यूनानी के एकवचन और उसके सजीव उपमान को निकटता से सुरक्षित रखा गया है।
- source_word: ἄνδρας δυνατούς
  choice: शक्तिशाली पुरुषों
  rationale: ἄνδρας स्पष्ट रूप से पुरुषों को और δυνατούς शक्ति या प्रभाव रखने वालों को सूचित करता है; इसलिए लिंग-सूचना को सामान्यीकृत नहीं किया गया।
- source_word: ἀπῴκισεν
  choice: उनके घर-देश से उजाड़ दिया
  rationale: क्रिया किसी को उसके निवास या देश से हटाकर अन्यत्र रहने को विवश करने का भाव रखती है। ‘उजाड़ दिया’ विस्थापन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना औपचारिक राजकीय निर्वासन मान लिए।
- source_word: ἐπλανήθησαν
  choice: भटकते रहे
  rationale: पराए राष्ट्रों के बीच विस्थापन के प्रसंग में यह शारीरिक भटकाव का बोध देता है, न कि आवश्यक रूप से नैतिक भ्रम का।
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: पराए राष्ट्रों में
  rationale: यह अपने राष्ट्र से भिन्न विदेशी लोगों या राष्ट्रों के बीच रहने और भटकने का सामाजिक-भौगोलिक भाव बनाए रखता है।
theological_decisions:
- issue: κατευθύνοντας में नैतिक सीधाई और समृद्धि के बीच अर्थ-संभावना
  choice: सही दिशा में बढ़ रहे
  alternative: जिनका कामकाज फल-फूल रहा था / जो सीधे मार्ग पर चल रहे थे
  rationale: मूल कृदंत को केवल नैतिक धार्मिकता या केवल आर्थिक सफलता तक सीमित न करके उसकी वास्तविक अर्थगत व्यापकता सुरक्षित रखी गई है।
- issue: ἄνδρας δυνατούς में लिंग-सूचना
  choice: शक्तिशाली पुरुषों
  alternative: शक्तिशाली लोगों
  rationale: मूल यूनानी में सामान्य मानव-संज्ञा नहीं, बल्कि स्पष्ट पुल्लिंग ἄνδρας है; अतः उसे तटस्थ नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घर-देश से उजाड़ दिया’ विस्थापन की तीव्रता व्यक्त करता है, जबकि ‘डगमगा दिया’ समुद्री लहर के बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
