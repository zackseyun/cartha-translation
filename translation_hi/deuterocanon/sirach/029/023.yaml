- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: थोड़े में और बहुत में
  rationale: ἐπί के साथ दत्तिव यहाँ उन परिस्थितियों या मात्रा को व्यक्त करता है जिनमें संतोष बनाए रखना है। यह अनुवाद कमी और बहुतायत के विरोध को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εὐδοκίαν
  choice: संतुष्ट
  rationale: εὐδοκία का अर्थ प्रसन्नता, अनुकूल इच्छा या संतोष हो सकता है। ἔχε के साथ इस आज्ञार्थक प्रयोग में यह उपलब्ध मात्रा को प्रसन्न मन से स्वीकार करने की अवस्था बताता है; इसलिए ‘संतुष्ट रहो’ स्वाभाविक हिन्दी है।
- source_word: ἔχε
  choice: रहो
  rationale: यद्यपि ἔχε का शाब्दिक अर्थ ‘रखो’ है, εὐδοκίαν ἔχε का हिन्दी में स्वाभाविक अवस्थासूचक आज्ञार्थ ‘संतुष्ट रहो’ है।
