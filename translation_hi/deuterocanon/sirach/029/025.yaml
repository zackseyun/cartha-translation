translation:
  language: hi
  text: तुम अकृतज्ञ लोगों का आतिथ्य करोगे और उन्हें पीने को दोगे; और इन सबके अलावा तुम कड़वी बातें[a] सुनोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘कड़वी चीज़ें’; ‘बातें’ प्रसंग और स्वाभाविक हिन्दी के लिए जोड़ा गया है। प्राप्त यूनानी पाठ में अंतिम क्रिया व्याकरणतः ‘वह सुनेगा’ है, जबकि इससे पहले ‘तुम’ संबोधन है।
    reason: lexical_and_textual_ambiguity
lexical_decisions:
- source_word: ξενιεῖς (ξενίζω)
  choice: आतिथ्य करोगे
  rationale: यह भविष्यकालीन क्रिया किसी को अतिथि के रूप में ग्रहण करने और उसकी आवभगत करने का अर्थ देती है। ‘आतिथ्य करोगे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के आतिथ्य-संबंधी भाव को बनाए रखता है।
- source_word: ποτιεῖς
  choice: उन्हें पीने को दोगे
  rationale: क्रिया का अर्थ किसी को कुछ पीने के लिए देना है। ‘पीने को दोगे’ पेय का प्रकार निर्धारित किए बिना यूनानी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἀχάριστα
  choice: अकृतज्ञ लोगों का
  rationale: ἀχάριστα कृतघ्नता या धन्यवाद न देने का भाव रखता है। प्रसंग में इसे आतिथ्य पाने वाले अकृतज्ञ लोगों के रूप में समझना सबसे स्वाभाविक है, यद्यपि यूनानी रूप नपुंसकलिंग बहुवचन है और वाक्यांश कुछ असामान्य है।
- source_word: πρὸς ἐπὶ τούτοις
  choice: इन सबके अलावा
  rationale: यह कुछ पुनरुक्त-सा योगात्मक वाक्यांश है, जिसका आशय पहले कही कठिनाइयों के ऊपर एक और कठिनाई जुड़ना है।
- source_word: πικρὰ
  choice: कड़वी बातें
  rationale: विशेषण का शाब्दिक अर्थ ‘कड़वी’ है। ‘सुनोगे’ के साथ हिन्दी में संज्ञा अपेक्षित होने के कारण ‘बातें’ जोड़ा गया है; रूपक की तीक्ष्णता बनी रहती है।
- source_word: ἀκούσει
  choice: तुम … सुनोगे
  rationale: प्राप्त यूनानी पाठ में यह क्रिया व्याकरणतः तीसरे पुरुष एकवचन (‘वह सुनेगा’) है, जबकि पहले की दोनों क्रियाएँ दूसरे पुरुष एकवचन हैं। आशय की निरंतरता के अनुसार हिन्दी में ‘तुम … सुनोगे’ रखा गया है।
