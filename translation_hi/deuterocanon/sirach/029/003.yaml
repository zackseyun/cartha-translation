  text: Keep your word[a], and be faithful to him, and at all times you will find what you need.
translation:
  language: hi
  text: अपनी बात पक्की रखो[a] और उसके प्रति विश्वासयोग्य रहो; हर समय तुम्हें अपनी ज़रूरत की चीज़ मिल जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी बात पक्की रखो और उसे निभाने में विश्वसनीय सिद्ध हो।” यहाँ “उसके” का संकेत किसी व्यक्ति के बजाय कही हुई बात या किए गए समझौते की ओर भी हो सकता है।
    reason: सर्वनाम μετʼ αὐτοῦ का व्यक्तिगत संदर्भ अधिक सीधा है, किंतु उसे वचन या समझौते से जोड़ने की वास्तविक भाषिक संभावना भी बनी रहती है।
lexical_decisions:
- source_word: στερέωσον
  choice: दृढ़ रहो
  rationale: आज्ञार्थक क्रिया का मूल भाव किसी बात को स्थिर या पक्का करना है। ‘अपनी बात पर दृढ़ रहो’ आर्थिक वचनबद्धता के संदर्भ में उसे निभाने का स्वाभाविक हिन्दी भाव देता है।
- source_word: λόγον
  choice: अपनी बात
  rationale: यहाँ λόγος बोले हुए वचन या प्रतिबद्धता को सूचित करता है। ‘अपनी बात’ आधुनिक हिन्दी में वचन निभाने के अर्थ को स्पष्ट रखते हुए मूल की सामान्य शब्दावली बचाती है।
- source_word: πιστώθητι
  choice: विश्वासयोग्य रहो
  rationale: यह रूप अपने को विश्वसनीय या निष्ठावान सिद्ध करने का भाव रखता है। ‘विश्वासयोग्य रहो’ नैतिक विश्वसनीयता को संक्षेप में व्यक्त करता है।
- source_word: μετʼ αὐτοῦ
  choice: उसके प्रति
  rationale: पुल्लिंग सर्वनाम को निकट संदर्भ के दूसरे व्यक्ति से जोड़ना सबसे सीधा पाठ है। हिन्दी में ‘उसके प्रति’ संबंधगत निष्ठा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह पद प्रत्येक समय या अवसर का व्यापक अर्थ देता है।
- source_word: εὑρήσεις
  choice: मिल जाएगी
  rationale: मूलतः अर्थ ‘तुम पाओगे’ है; हिन्दी वाक्य-संरचना में आवश्यकता की वस्तु को कर्ता बनाकर ‘मिल जाएगी’ वही भाव स्वाभाविक रूप से देता है।
- source_word: τὴν χρείαν σου
  choice: अपनी आवश्यकता की वस्तु
  rationale: χρεία आवश्यकता, जरूरत या उपयोग की चीज़ को दर्शा सकता है। यह चयन मूल की संज्ञात्मक अभिव्यक्ति और व्यावहारिक आशय दोनों को बनाए रखता है।
