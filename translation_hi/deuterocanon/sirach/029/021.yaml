lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: जीवन की मूल आवश्यकताएँ
  rationale: शाब्दिक रूप से यह पदबंध ‘जीवन का आरम्भ/आधार’ है; नीतिवचन-जैसे इस प्रसंग में यह जीवन की बुनियादी आवश्यकताओं की ओर संकेत करता है। ‘मूल आवश्यकताएँ’ यूनानी भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὕδωρ
  choice: पानी
  rationale: सामान्य जीवन की बुनियादी वस्तुओं की सूची में ‘पानी’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: ἄρτος
  choice: रोटी
  rationale: यहाँ ठोस अर्थ ‘रोटी’ सूची की संक्षिप्तता और मूल बिंब को बनाए रखता है; व्यापक ‘भोजन’ अधिक व्याख्यात्मक होता।
- source_word: ἱμάτιον
  choice: वस्त्र
  rationale: एकवचन संज्ञा का सामूहिक अर्थ है; ‘वस्त्र’ गरिमापूर्ण और सामान्य हिन्दी में पहनने के कपड़ों को समेटता है।
- source_word: οἶκος
  choice: घर
  rationale: यूनानी शब्द का सीधा अर्थ घर/निवास है। ‘आश्रय’ की अपेक्षा ‘घर’ मूल के ठोस बिंब को सुरक्षित रखता है।
- source_word: καλύπτων
  choice: ढकने वाला
  rationale: वर्तमान कृदन्त घर का विशेषण है; यह अनुवाद उस संबंध और मूल की संक्षिप्त संरचना को स्पष्ट रखता है।
- source_word: ἀσχημοσύνην
  choice: लज्जा
  rationale: शब्द लज्जा, अशोभनीयता अथवा ढकी जाने वाली नग्नता को व्यक्त कर सकता है। मुख्य पाठ में ‘लज्जा’ व्यापक नैतिक-सामाजिक अर्थ बचाता है और अधिक ठोस अर्थ पादटिप्पणी में दिया गया है।
