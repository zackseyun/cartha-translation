  text: Lend to your neighbor in his time of need, and in turn repay your neighbor on time.
translation:
  language: hi
  text: अपने पड़ोसी को उसकी ज़रूरत के समय उधार दो, और बदले में, अपने पड़ोसी को समय पर उधार चुका दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  choice: उधार दो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यहाँ सामान्य सहायता नहीं, ऋण देने का अर्थ है।
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी को / पड़ोसी का
  rationale: πλησίον का सामान्य अर्थ ‘पड़ोसी’ है। दूसरी बार हिन्दी वाक्य-विन्यास के अनुसार संबंधकारक रूप लिया गया है।
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: उसकी ज़रूरत के समय
  rationale: καιρός और χρεία दोनों का आशय रखते हुए सहज आधुनिक हिन्दी में आवश्यकता के अवसर को व्यक्त करता है।
- source_word: πάλιν ἀπόδος
  choice: तुम भी ... चुका दो
  rationale: ἀπόδος यहाँ उधार लौटाने/चुकाने का निर्देश देता है; πάλιν को पारस्परिक प्रत्युत्तर के अर्थ में ‘तुम भी’ से व्यक्त किया गया है।
- source_word: εἰς τὸν καιρόν
  choice: समय पर
  rationale: निर्धारित या उचित समय तक चुकाने का संक्षिप्त, स्वाभाविक हिन्दी रूप; यूनानी पाठ किसी विशेष नियुक्त समय को स्पष्ट नहीं करता।
theological_decisions:
- issue: ऋण देने और लौटाने की पारस्परिक नैतिक जिम्मेदारी
  choice: पहले खंड में ज़रूरतमंद पड़ोसी को उधार देने और दूसरे में स्वयं लिया हुआ उधार समय पर चुकाने का निर्देश रखा गया है।
  alternative: दूसरे खंड को उसी पड़ोसी से ऋण वसूल करने के निर्देश के रूप में प्रस्तुत करना।
  rationale: ἀπόδος सक्रिय आज्ञार्थक ‘लौटा दो/चुका दो’ है; इसलिए पाठ पाठक से अपने पड़ोसी को ऋण लौटाने की अपेक्षा करता है, न कि पड़ोसी से वसूली करने की।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘उधार’ की पुनरावृत्ति संबंध को साफ करती है और ‘समय पर’ यूनानी की संक्षिप्तता बनाए रखता है।
