translation:
  language: hi
  text: 'समझ-बूझ रखनेवाले मनुष्य के लिए ये बातें भारी होती हैं: घरवालों की झिड़की और ऋणदाता का अपमान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα
  choice: भारी
  rationale: यह शब्द अनुभव की पीड़ादायक और कठिन प्रकृति व्यक्त करता है; हिन्दी में ‘भारी’ मूल रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  choice: समझ-बूझ रखनेवाले मनुष्य के लिए
  rationale: φρόνησις व्यावहारिक समझ और विवेक का बोध कराता है; ‘समझ-बूझ’ साधारण पाठक के लिए सहज है और अर्थ को अनावश्यक रूप से धार्मिक नहीं बनाता।
- source_word: ἐπιτίμησις οἰκίας
  choice: घरवालों की झिड़की
  rationale: οἰκία यहाँ घर या गृहस्थी से जुड़े लोगों को सूचित कर सकता है; ‘घरवालों’ संबंध की अस्पष्टता को काफी हद तक बनाए रखता है, जबकि ἐπιτίμησις के लिए ‘झिड़की’ डाँट या भर्त्सना का स्वाभाविक भाव देता है।
- source_word: ὀνειδισμὸς δανιστοῦ
  choice: ऋणदाता का अपमान
  rationale: δανιστής ऋण देनेवाला है और ὀνειδισμός तिरस्कारपूर्ण अपमान या उलाहने को दर्शाता है; ‘अपमान’ व्यापक अर्थ बनाए रखता है।
