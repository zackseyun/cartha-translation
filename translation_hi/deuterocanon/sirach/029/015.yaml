translation:
  language: hi
  text: तुम्हारे लिए ज़मानत देनेवाले के उपकारों को मत भूलो[a], क्योंकि उसने तुम्हारे लिए अपना जीवन दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए ज़मानत देनेवाले के एहसानों को मत भूलो।” यूनानी शब्द उस व्यक्ति को दर्शाता है जो किसी दूसरे के ऋण या दायित्व की ज़मानत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका प्राण” या “उसकी आत्मा।” यहाँ आशय उसके जीवन, अर्थात् तुम्हारी ओर से उठाए गए गंभीर जोखिम, से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: भलाई
  rationale: बहुवचन χάριτας यहाँ ज़मानत देने वाले से मिले उपकारों या भलाई के कामों को सूचित करता है। हिन्दी में सामूहिक अर्थ वाला ‘भलाई’ स्वाभाविक है और इसे धर्मवैज्ञानिक ‘अनुग्रह’ के रूप में पढ़ने से बचाता है।
- source_word: ἐγγύου
  choice: ज़मानत देने वाले की
  rationale: ἐγγύος उस व्यक्ति को दर्शाता है जो किसी दूसरे के ऋण या दायित्व की ज़मानत लेता है। यह आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: μὴ ἐπιλάθῃ
  choice: मत भूलो
  rationale: निषेध का सीधा और स्वाभाविक हिन्दी रूप है; यह मिले हुए उपकार को याद रखने की आज्ञा देता है।
- source_word: ἔδωκεν
  choice: दाँव पर लगा दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर इस वित्तीय-सामाजिक प्रसंग में ज़मानतदार ने स्वयं को जोखिम में डाला। ψυχή के साथ यह हिन्दी मुहावरा आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: ψυχή यहाँ अलग आत्मिक तत्त्व की अपेक्षा व्यक्ति के जीवन अथवा स्वयं उसके जोखिम में पड़ने को दर्शाता है। ‘अपना जीवन’ मूल मुहावरे की गंभीरता बनाए रखता है।
- source_word: ὑπὲρ σοῦ
  choice: तुम्हारे लिए
  rationale: ὑπέρ यहाँ किसी की ओर से या उसके हित में किए गए कार्य को दर्शाता है; ‘तुम्हारे लिए’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ψυχή को ‘प्राण/आत्मा’ या ‘जीवन’ के रूप में प्रस्तुत करना
  choice: अपना जीवन दाँव पर लगा दिया
  alternative: अपना प्राण तुम्हारे लिए दे दिया
  rationale: प्रसंग ज़मानत लेने से उत्पन्न व्यक्तिगत और आर्थिक जोखिम का है, मनुष्य की आत्मा के स्वरूप पर कथन का नहीं। चुना हुआ रूप अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल के शाब्दिक ‘अपना जीवन दे दिया’ को दर्ज करती है।
