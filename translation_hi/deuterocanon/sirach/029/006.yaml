base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: hi
  text: यदि उधार देनेवाला कुछ वसूल कर सके, तो वह बड़ी कठिनाई से आधा ही वापस पाएगा और उसे मानो कोई मिली हुई चीज़ समझेगा[a]; पर यदि नहीं, तो उधार लेनेवाले ने उसे उसके धन से वंचित कर दिया है, और उसने बिना किसी लाभ के उसे अपना शत्रु बना लिया है[b]। उधार लेनेवाला उसे बद्दुआएँ और गालियाँ लौटाएगा, और सम्मान के बदले उसे अपमान देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे एक मिली हुई वस्तु के समान गिनेगा।” भाव यह है कि अपना आधा धन वापस मिलना भी उसे अप्रत्याशित प्राप्ति जैसा लगेगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने उसे मुफ्त में शत्रु नहीं बनाया।” प्रसंग में भाव यह है कि ऋणदाता को धन की हानि के साथ एक शत्रु भी मिला, बिना किसी लाभ के।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: यदि वह सफल भी हुआ
  rationale: ἰσχύω का मूल भाव सामर्थ्य रखने या सफल होने का है। यहाँ ऋण की वसूली के संदर्भ में ‘सफल भी हुआ’ स्वाभाविक है और यह अनावश्यक रूप से नहीं बताता कि सफलता किस उपाय से मिली। ‘भी’ आगे आने वाले ‘आधा ही’ के साथ विडंबना को स्पष्ट करता है।
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: बड़ी मुश्किल से आधा ही वापस पाएगा
  rationale: μόλις कठिनाई और अल्प सफलता, दोनों का संकेत देता है; κομίζω इस प्रसंग में उधार दिया धन वापस पाने के अर्थ में है।
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: उसे अचानक मिला धन मानेगा
  rationale: εὕρεμα का शाब्दिक अर्थ ‘मिली हुई वस्तु’ है। हिंदी में ‘अचानक मिला धन’ उस रूपक को सहज रूप से व्यक्त करता है कि अपना ही आधा धन वापस मिलना अप्रत्याशित लाभ जैसा लगेगा।
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: वह अपने धन से वंचित हो गया
  rationale: ἀποστερέω वंचित करने, हड़प लेने या ठग लेने तक के अर्थ दे सकता है। परिणाम-केंद्रित हिंदी जानबूझकर धोखाधड़ी का आरोप जोड़े बिना ऋणदाता की हानि बताती है।
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: अपना धन गँवाकर उसने उसे शत्रु बना लिया
  rationale: κτάομαι ‘प्राप्त करना/बना लेना’ और οὐ δωρεάν ‘मुफ्त में नहीं’ का भाव देता है। चुना हुआ रूप उस कटु विडंबना को स्पष्ट करता है कि ऋणदाता ने धन खोने की कीमत पर एक शत्रु पाया।
- source_word: κατάρας καὶ λοιδορίας
  choice: बद्दुआओं और गालियों
  rationale: दोनों शब्द शत्रुतापूर्ण वाणी बताते हैं। ‘बद्दुआएँ’ और ‘गालियाँ’ आधुनिक सामान्य हिंदी में क्रमशः शाप और अपमानजनक कटुवचन का भेद बनाए रखते हैं।
- source_word: ἀποδώσει αὐτῷ
  choice: उसका ऋण चुकाएगा
  rationale: 'ἀποδίδωμι लौटाने या चुकाने का अर्थ रखता है। ‘ऋण चुकाएगा’ आर्थिक प्रसंग की विडंबना बनाए रखता है: धन के स्थान पर बद्दुआ और गाली लौटाई जाती है।'
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: सम्मान के बदले ... अपमान
  rationale: δόξα और ἀτιμία यहाँ सामाजिक मान-सम्मान के विपरीत पद हैं। ‘सम्मान/अपमान’ सहज हिंदी में इस विरोध को सटीक बनाए रखते हैं।
theological_decisions:
- issue: असफल ऋण के सामाजिक और नैतिक परिणाम
  choice: पद को ऋणदाता की आर्थिक हानि, उत्पन्न शत्रुता और अपमानजनक प्रत्युत्तर के विषय में व्यावहारिक बुद्धि-वचन के रूप में रखा गया है।
  alternative: इसे सूद के विरुद्ध सिद्धांत, ईश्वरीय दंड की घोषणा, या ऋणी द्वारा सुनियोजित धोखाधड़ी का स्पष्ट आरोप बनाया जा सकता था।
  rationale: यूनानी पाठ सीधे तौर पर धन की आंशिक अथवा पूर्ण हानि, शत्रुता, बद्दुआ, गाली और अपमान की बात करता है। अनुवाद उसके दायरे से बाहर कोई सांप्रदायिक या सैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: οὐ δωρεάν की विडंबना
  choice: इसे धन खोने की कीमत पर शत्रु पाने के रूप में व्यक्त किया गया है।
  alternative: इसे ‘अकारण नहीं’ समझा जा सकता है, जिससे यह भाव निकल सकता है कि शत्रुता का कोई उचित कारण था।
  rationale: ऋण के तत्काल प्रसंग और आर्थिक शब्दावली में ‘मुफ्त में नहीं’ मुख्यतः उस महँगी विडंबना को दर्शाता है कि ऋणदाता को धन की हानि के साथ शत्रुता भी मिली; पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बड़ी मुश्किल से’, ‘अचानक मिला धन’, ‘अपना धन गँवाकर’ और ‘ऋण चुकाएगा’ आर्थिक प्रसंग तथा मूल की कटु विडंबना को स्वाभाविक हिंदी में व्यक्त करते हैं। सर्वनामों की दिशा यूनानी में प्रसंगाधीन है; हिंदी वाक्य-विन्यास ऋणदाता की हानि और दूसरे व्यक्ति से मिली शत्रुता को स्पष्ट करता है, बिना किसी पात्र की नीयत के बारे में अतिरिक्त दावा किए।
