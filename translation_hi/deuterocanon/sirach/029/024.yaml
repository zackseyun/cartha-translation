  yaml_path: translation/deuterocanon/sirach/029/024.yaml
  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: hi
  text: एक घर से दूसरे घर जाना दुखमय जीवन है[a]; और जहाँ वह परदेशी के रूप में रहेगा[b], वहाँ वह अपना मुँह नहीं खोलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “एक घर से दूसरे घर जाना एक दयनीय जीवन है।” यूनानी को अधिक शाब्दिक रूप में ऐसे पढ़ा जा सकता है; आशय अस्थिर होकर अलग-अलग घरों में आश्रय लेने से है।
    reason: lexical_alternative
  - marker: b
    text: “परदेशी के रूप में रहेगा” उस क्रिया का अनुवाद है जिसका अर्थ किसी घर में उसके स्थायी सदस्य के रूप में नहीं, बल्कि बाहरी व्यक्ति की तरह रहना है।
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: दुखमय जीवन
  rationale: यहाँ πονηρά जीवन की नैतिक बुराई से अधिक उसकी कष्टपूर्ण और दयनीय दशा बताता है; ‘दुखमय जीवन’ इस अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: घर-घर भटकना
  rationale: यूनानी पदबंध का शाब्दिक चित्र ‘एक घर से दूसरे घर’ जाने का है। संदर्भ में अस्थिर आश्रय निहित है, इसलिए ‘भटकना’ भाव को स्पष्ट करता है, जबकि घर-घर की छवि बनी रहती है।
- source_word: παροικήσει
  choice: परदेशी बनकर रहेगा
  rationale: παροικέω किसी स्थान पर पूर्ण सदस्य या स्थायी निवासी न होकर बाहरी व्यक्ति की तरह रहने को दर्शाता है। ‘परदेशी बनकर रहेगा’ अस्थायी निवास और सामाजिक परायेपन—दोनों को व्यक्त करता है।
- source_word: οὐκ ἀνοίξει στόμα
  choice: अपना मुँह नहीं खोलेगा
  rationale: मूल का सजीव मुहावरा ज्यों का त्यों रखा गया है; इससे बोलने की स्वतंत्रता या सामाजिक अधिकार के अभाव का संकेत मिलता है, पर उसे व्याख्या के रूप में पाठ में नहीं जोड़ा गया।
