translation:
  language: hi
  text: बहुत-से लोग[a] दुष्टता के कारण मुँह मोड़ गए; उन्हें डर था कि कहीं वे व्यर्थ ही ठगे न जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से लोग बुराई के कारण पीछे हट गए; उन्हें डर था कि कहीं वे बिना किसी लाभ के वंचित न किए जाएँ।”
    reason: ἀπέστρεψαν के लिए ‘पीछे हट गए,’ πονηρίας के लिए ‘बुराई,’ और ἀποστερηθῆναι δωρεάν के लिए ‘बिना किसी लाभ के वंचित न किए जाएँ’ वैकल्पिक, अपेक्षाकृत शाब्दिक अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: अनिश्चित बहुवचन कर्ता को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χάριν
  choice: के कारण
  rationale: सम्बन्धकारक πονηρίας के साथ यह उत्तरसर्ग कारण या आधार बताता है।
- source_word: πονηρίας
  choice: दुष्टता
  rationale: यह नैतिक बुराई का व्यापक अर्थ बनाए रखता है और इसे केवल आर्थिक बेईमानी तक सीमित नहीं करता।
- source_word: ἀπέστρεψαν
  choice: मुँह मोड़ गए
  rationale: सहायता या उधार देने से पीछे हटने के भाव को सहज और प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: ἀποστερηθῆναι
  choice: ठगे जाएँ
  rationale: निष्क्रिय क्रिया का अर्थ किसी देय वस्तु या धन से धोखे द्वारा वंचित किए जाने का है; ऋण के प्रसंग में ‘ठगे जाएँ’ स्वाभाविक है।
- source_word: δωρεὰν
  choice: बेवजह
  rationale: यहाँ क्रियाविशेषण बिना प्रतिफल, बिना उचित कारण, या निरर्थक हानि उठाने का भाव दे सकता है; ‘बेवजह’ उस तनाव को संक्षेप में बनाए रखता है।
- source_word: εὐλαβήθησαν
  choice: उन्हें डर था
  rationale: आर्थिक हानि की आशंका के प्रसंग में सावधानी से उपजे भय को स्पष्ट करता है।
theological_decisions:
- issue: πονηρίας का नैतिक और प्रसंगगत दायरा
  choice: दुष्टता
  alternative: बुराई; बेईमानी
  rationale: ‘दुष्टता’ मूल शब्द के नैतिक बल को बनाए रखती है, जबकि ऋण और धोखे का निकट प्रसंग बेईमानी की ओर संकेत करता है; अनुवाद उस अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: δωρεὰν की अर्थगत अनिश्चितता
  choice: बेवजह
  alternative: व्यर्थ ही; बिना किसी प्रतिफल के
  rationale: यह शब्द निरर्थक, अकारण, अथवा बिना बदले के हानि उठाने का भाव रख सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘मुँह मोड़ गए’ सामाजिक सहायता से पीछे हटने का स्वाभाविक मुहावरा है; ‘ठगे न जाएँ’ आर्थिक प्रसंग को स्पष्ट करता है।
