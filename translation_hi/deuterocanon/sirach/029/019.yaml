lexical_decisions:
- source_word: ἁμαρτωλός
  choice: जो पापी
  rationale: एकवचन संज्ञा का प्रयोग सामान्य व्यक्ति के लिए हुआ है। ‘जो पापी’ आधुनिक हिन्दी में स्वाभाविक है और मूल की नैतिक पहचान को बनाए रखता है।
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: जमानत देने में फँसता है
  rationale: ἐγγύη किसी दूसरे के ऋण या दायित्व की गारंटी लेने को सूचित करता है। ‘फँसता है’ ἐμπίπτω की रूपकात्मक शक्ति और चेतावनी के नकारात्मक भाव को सुरक्षित रखता है।
- source_word: διώκων
  choice: पीछे दौड़ता है
  rationale: यह सक्रिय और उत्सुकतापूर्वक किसी वस्तु को पाने का प्रयत्न दर्शाता है; हिन्दी मुहावरा मूल के प्रबल भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐργολαβίας
  choice: ठेकों
  rationale: शब्द व्यावसायिक ठेकों या अनुबंधित उपक्रमों को सूचित कर सकता है। ‘ठेकों’ से कानूनी-आर्थिक प्रसंग स्पष्ट रहता है, पर अर्थ को किसी एक विशेष पेशे तक सीमित नहीं किया जाता।
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: मुकदमों में फँसेगा
  rationale: κρίσεις का अर्थ न्यायिक कार्यवाही, निर्णय या कानूनी विवाद हो सकता है। जमानत और ठेकों के प्रसंग में ‘मुकदमों’ सबसे स्वाभाविक है, जबकि ‘फँसेगा’ मूल क्रिया की पुनरावृत्ति को बनाए रखता है।
