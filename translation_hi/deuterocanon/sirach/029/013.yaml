translation:
  language: hi
  text: एक मज़बूत ढाल से भी बढ़कर और एक प्रबल भाले से भी बढ़कर, वह[a] तुम्हारी ओर से शत्रु के विरुद्ध लड़ेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इस वाक्य का कर्ता दोहराया नहीं गया है। पिछले पद में जिसकी प्रशंसा की गई है, उसी का यहाँ मानवीकरण करके उसे तुम्हारी ओर से लड़ते हुए दिखाया गया है। संदर्भ के अनुसार इसे ‘तेरी दयालुता’ या ‘तेरी ज़मानत’ जैसे शब्दों से स्पष्ट किया जा सकता है।
    reason: मूल में अप्रकट कर्ता और उसके संभावित संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: ὑπὲρ (ἀσπίδα… δόρυ)
  choice: से भी बढ़कर
  rationale: दोनों सैन्य वस्तुओं के साथ ὑπὲρ तुलनात्मक श्रेष्ठता बताता है; ‘से भी बढ़कर’ हिन्दी में समानांतरता और प्रभाव दोनों बनाए रखता है।
- source_word: ἀσπίδα κράτους
  choice: एक मज़बूत ढाल
  rationale: κράτους गुण-सूचक संबंधकारक है; सहज हिन्दी में इसे ‘मज़बूत’ विशेषण से व्यक्त किया गया है।
- source_word: δόρυ ἀλκῆς
  choice: एक प्रबल भाला
  rationale: ἀλκή सामर्थ्य और युद्ध-बल का भाव देता है; ‘प्रबल’ इस समानांतर वाक्यांश में स्वाभाविक और गरिमापूर्ण है।
- source_word: κατέναντι ἐχθροῦ
  choice: शत्रु से
  rationale: वाक्यांश विरोधी के सामने अथवा विरुद्ध लड़ने का भाव देता है। यूनानी में ἐχθροῦ निश्चित उपपद के बिना है, इसलिए हिन्दी में सामान्य ‘शत्रु’ उपयुक्त है।
- source_word: πολεμήσει
  choice: लड़ेगी
  rationale: भविष्यकालीन क्रिया का सीधा और वर्तमान हिन्दी में स्वाभाविक अनुवाद; स्त्रीलिंग रूप पिछले पद के संभावित स्त्रीलिंग पूर्वपद से व्याकरणिक संबंध रखता है, जबकि उसका नाम यहाँ नहीं जोड़ा गया।
- source_word: ὑπὲρ σοῦ
  choice: तुम्हारी ओर से
  rationale: यहाँ ὑπὲρ लाभार्थक/प्रतिनिधिक अर्थ में है—किसी के पक्ष में या उसकी ओर से लड़ना।
- source_word: implicit subject of πολεμήσει
  choice: वह
  rationale: यूनानी इस पद में कर्ता को दोहराता नहीं है। हिन्दी में ‘वह’ पिछले पद की ओर संकेत करता है, पर मुख्य पाठ में उसका विशिष्ट नाम जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: पिछले पद से समझा जाने वाला अप्रकट कर्ता
  choice: मुख्य पाठ में केवल ‘वह’ रखा गया और उसके साथ टिप्पणी-चिह्न जोड़ा गया।
  alternative: ‘तेरा दान’, ‘तेरी दयालुता’ या ‘तेरी ज़मानत’ को स्पष्ट कर्ता बनाना।
  rationale: यूनानी पद कर्ता को स्पष्ट रूप से फिर नहीं कहता। किसी एक संभावित पूर्वपद को मुख्य पाठ में चुनना मूल की साहित्यिक अस्पष्टता और मानवीकरण को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सैन्य बिंब, दोहरे तुलनात्मक समानांतर और मानवीकरण को बनाए रखते हुए सरल, गरिमापूर्ण शब्दावली अपनाई गई है।
