  register: आधुनिक, गरिमापूर्ण और सीधी नीतिवचनात्मक हिंदी। एकवचन आज्ञार्थक ‘दे’ मूल यूनानी के सीधे संबोधन को बनाए रखता है। ‘चाँदी’ प्राचीन आर्थिक बिंब को सुरक्षित रखती है, जबकि कठिन क्षय-संबंधी क्रिया की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
