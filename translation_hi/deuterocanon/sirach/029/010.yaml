translation:
  language: hi
  text: भाई और मित्र के लिए चाँदी गँवा दे, और उसे पत्थर के नीचे पड़ा-पड़ा खराब होकर बरबाद[a] न होने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे पत्थर के नीचे जंग लगकर बरबाद न होने दे।” यहाँ प्रयुक्त यूनानी क्रिया कठिन और दुर्लभ है। संदर्भ में इसका आशय यह है कि दूसरों की सहायता में लगाने के बजाय छिपाकर रखा धन बिगड़ जाता है या व्यर्थ चला जाता है।
