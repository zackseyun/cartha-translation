lexical_decisions:
- source_word: ἀπόλεσον
  choice: गँवा दे
  rationale: अओरिस्ट आज्ञार्थक यहाँ किसी निकट व्यक्ति की भलाई के लिए धन से स्वेच्छा से हाथ धोने की तीखी, विरोधाभासी बात कहता है। ‘गँवा दे’ इस बलिदानी भाव को बनाए रखता है; ‘खर्च कर दे’ अपेक्षाकृत कमजोर होता।
- source_word: ἀργύριον
  choice: चाँदी
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, जिसका प्रयोग धन के लिए भी होता था। ठोस प्राचीन बिंब और लोकोक्तिपरक शैली बनाए रखने के लिए ‘चाँदी’ रखा गया है।
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: भाई और मित्र के लिए
  rationale: διά के साथ कर्मकारक यहाँ लाभ अथवा निमित्त व्यक्त करता है। यूनानी में स्वत्वसूचक शब्द न होने के कारण ‘अपने’ नहीं जोड़ा गया।
- source_word: μὴ ἰωθῇ
  choice: नष्ट न होने दे
  rationale: यह दुर्लभ और कठिन क्रिया संदर्भ में छिपाकर रखे धन के बिगड़ने, क्षय होने या व्यर्थ जाने की ओर संकेत करती है। मुख्य पाठ में सहज हिंदी के लिए ‘नष्ट’ और पादटिप्पणी में ‘जंग/क्षय’ का वैकल्पिक बिंब दिया गया है।
- source_word: ὑπὸ τὸν λίθον
  choice: पत्थर के नीचे पड़े-पड़े
  rationale: यह धन को छिपाने या जमा करके निष्क्रिय छोड़ देने का ठोस बिंब है। ‘पड़े-पड़े’ हिंदी में उस अनुपयोगी भंडारण का भाव स्वाभाविक रूप से स्पष्ट करता है।
- source_word: εἰς ἀπώλειαν
  choice: नष्ट
  rationale: यह अंतिम परिणाम—हानि, बरबादी या विनाश—बताता है। हिंदी में पिछली कठिन क्रिया के साथ ‘नष्ट होने’ का संयुक्त प्रयोग अर्थ को स्पष्ट और स्वाभाविक रखता है।
