translation:
  language: hi
  text: आज्ञा के कारण निर्धन की सहायता कर, और उसकी आवश्यकता के अनुसार उसे खाली हाथ न लौटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: आज्ञा के कारण
  rationale: χάριν के साथ संबंधकारक ἐντολῆς प्रेरक आधार व्यक्त करता है। यह अनुवाद आज्ञा को इस सहायता का कारण बनाए रखता है और उसे किसी विशेष व्यवस्था-संबंधी आज्ञा के रूप में सीमित नहीं करता।
- source_word: ἀντιλαβοῦ
  choice: सहायता कर
  rationale: मध्यमवाच्य आज्ञार्थक रूप किसी के सहारे के लिए आगे आने या उसका हाथ थामने का भाव रखता है; आधुनिक हिन्दी में ‘सहायता कर’ इसका स्वाभाविक और सक्रिय अर्थ देता है।
- source_word: πένητος
  choice: निर्धन
  rationale: πένης अभावग्रस्त या गरीब व्यक्ति को दर्शाता है। ‘निर्धन’ गरिमापूर्ण, संक्षिप्त और प्रतिनिधिक एकवचन के लिए उपयुक्त है।
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: उसकी आवश्यकता के अनुसार
  rationale: ἔνδεια आवश्यकता, कमी या अभाव है; κατά यहाँ सहायता को उस व्यक्ति की वास्तविक आवश्यकता के अनुरूप रखने का भाव देता है।
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: उसे खाली हाथ न लौटा
  rationale: ἀποστρέφω और κενόν का संयुक्त भाव सहायता दिए बिना वापस कर देना है। ‘खाली हाथ न लौटा’ हिन्दी में ठोस, स्वाभाविक और मूल अर्थ के निकट है।
theological_decisions:
- issue: ‘आज्ञा’ का संदर्भ
  choice: अनिर्दिष्ट किंतु प्रभावशाली नैतिक या ईश्वरीय आज्ञा
  alternative: तोराह की कोई विशिष्ट आज्ञा, अथवा सामान्य मानवीय निर्देश
  rationale: यूनानी एकवचन ἐντολῆς आज्ञा को निश्चित भाव से प्रस्तुत करता है, पर यह नहीं बताता कि कौन-सी आज्ञा है। इसलिए हिन्दी में केवल ‘आज्ञा’ रखकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन आज्ञार्थक शैली मूल यूनानी के सीधे नैतिक आह्वान को बनाए रखती है।
