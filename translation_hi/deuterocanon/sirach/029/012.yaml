  yaml_path: translation/deuterocanon/sirach/029/012.yaml
  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: hi
  text: दान को अपने भंडारों में सँभालकर रखो[a], और वही तुम्हें हर विपत्ति से छुड़ाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दान को अपने भंडार-कक्षों में बंद करके रखो”; यूनानी में शाब्दिक भाव सुरक्षित रूप से बंद कर रखने का है।
    reason: lexical_alternative
  - marker: b
    text: या, “और वही तुम्हें हर कष्ट से छुड़ाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: सँभालकर रखो
  rationale: क्रिया का मूल भाव बंद करके सुरक्षित रखने का है; भंडार के रूपक में ‘सँभालकर रखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए सुरक्षित संचय का अर्थ देता है।
- source_word: ἐλεημοσύνην
  choice: दान
  rationale: हेलेनिस्टिक यहूदी प्रयोग में यह शब्द विशेषतः जरूरतमंदों को दी जाने वाली सहायता या दान को सूचित करता है; ‘दान’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἐν τοῖς ταμείοις σου
  choice: अपने भंडारों में
  rationale: ταμεῖον भंडार-कक्ष, कोठरी या खजाना हो सकता है। ‘भंडारों’ से मूल्यवान वस्तु सुरक्षित जमा करने का रूपक बना रहता है और अनावश्यक स्थापत्य-विशिष्टता नहीं आती।
- source_word: ἐξελεῖταί
  choice: छुड़ाएगा
  rationale: यह क्रिया संकट से बाहर निकालने या बचाने का भाव रखती है। ‘छुड़ाएगा’ इस उद्धारात्मक क्रिया को सहज हिन्दी में व्यक्त करता है, बिना अतिरिक्त धर्मशास्त्रीय अर्थ जोड़े।
- source_word: ἐκ πάσης κακώσεως
  choice: हर विपत्ति से
  rationale: κακώσις कष्ट, दुर्दशा, हानि या बुरे व्यवहार को सूचित कर सकता है। ‘हर विपत्ति’ इस प्रसंग में व्यापक संकट और दुःख का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दान की मानवीकृत रक्षक सामर्थ्य को कैसे व्यक्त किया जाए
  choice: और वही तुम्हें हर विपत्ति से छुड़ाएगा
  alternative: और यह तुम्हें हर बुराई से बचाएगा
  rationale: यूनानी पाठ दान को सीधे रक्षक प्रभाव देता है। अनुवाद इस कथन को किसी बाद की धर्मशास्त्रीय व्याख्या से नरम या सीमित किए बिना बनाए रखता है। ‘वही’ स्त्रीलिंग αὕτη के संकेत को हिन्दी में स्वाभाविक ढंग से पिछले पद ‘दान’ से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सँभालकर रखो’ सुरक्षित संचय के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वही’ मूल पाठ में दान के मानवीकरण और बलाघात को बनाए रखता है।
