  yaml_path: translation/deuterocanon/sirach/029/027.yaml
  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: hi
  text: “हे परदेशी, सम्मान के स्थान से निकल जा,[a] क्योंकि मेरा भाई मेरे यहाँ अतिथि बन आया है, और मुझे ठहरने की जगह चाहिए।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सम्मानित स्थान से”; अधिक शाब्दिक रूप में, “सम्मान के सामने से।” यूनानी पदबंध असामान्य है। सम्भवतः अर्थ यह है कि परदेशी को किसी प्रमुख या सम्मानित स्थान से हटना होगा, ताकि दूसरे अतिथि के लिए जगह बनाई जा सके।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम वाक्यांश का अनुवाद “मुझे आतिथ्य की आवश्यकता है” या “ठहरने की जगह की आवश्यकता है” भी हो सकता है। यूनानी पाठ दूसरे अतिथि को ग्रहण करने से उत्पन्न आवश्यकता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: निकल जा
  rationale: प्रत्यक्ष आज्ञार्थक क्रिया की कठोरता और घर या स्थान छोड़ने का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: πάροικε
  choice: हे परदेशी
  rationale: यह शब्द ऐसे व्यक्ति को सूचित करता है जो स्थानीय या स्थायी निवासी नहीं है। ‘परदेशी’ आधुनिक हिन्दी में उसकी बाहरी और असुरक्षित सामाजिक स्थिति को सहज रूप से व्यक्त करता है।
- source_word: ἀπὸ προσώπου δόξης
  choice: सम्मान के स्थान से
  rationale: यूनानी पदबंध शाब्दिक रूप से असामान्य है। प्रसंग में यह घर के प्रतिष्ठित या सम्मानित स्थान की ओर संकेत करता जान पड़ता है; अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ἐπεξενώταί μοι
  choice: मेरा अतिथि बन गया है
  rationale: पूर्णकालिक रूप वर्तमान परिणामी स्थिति बताता है—भाई को अतिथि के रूप में ग्रहण किया जा चुका है।
- source_word: ὁ ἀδελφός
  choice: मेरा भाई
  rationale: यूनानी में निश्चित लेख है, पर सामाजिक प्रसंग में सम्बन्धवाचक भाव निहित है। ‘भाई’ सगे भाई, निकट संबंधी या समुदाय के भाई की सम्भावना को खुला रखता है।
- source_word: χρεία τῆς ξενίας
  choice: मुझे अतिथि के ठहरने की जगह चाहिए
  rationale: χρεία आवश्यकता और ξενία आतिथ्य अथवा अतिथि-निवास को सूचित करता है। यह अनुवाद प्रसंग की ठोस स्थान-सम्बन्धी आवश्यकता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
