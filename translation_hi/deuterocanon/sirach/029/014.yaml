review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two balanced clauses, the masculine singular proverbial subject, the perfect expression 'having lost shame,' and the final abandonment. However, 'अपने पड़ोसी का जामिन बनेगा' is somewhat less idiomatic and can suggest specifically a bail surety; 'अपने पड़ोसी के लिए ज़मानत देगा' expresses the Greek financial/legal surety sense more naturally.
  naturalness: ‘भला मनुष्य’ and ‘जिसने लज्जा खो दी है’ are clear, modern, and appropriately dignified. Recasting the surety phrase improves ordinary Hindi usage without reducing the legal-economic nuance. ‘उसे’ properly retains the Greek pronoun’s antecedental openness.
  terminology: ‘ज़मानत देना’ is the clearest modern Hindi equivalent for ἐγγυάομαι in this context. ‘लज्जा खो दी है’ faithfully retains the Greek’s completed-loss image; the footnote records the concise alternative ‘निर्लज्ज’.
  issues:
  - severity: low
    issue: ‘अपने पड़ोसी का जामिन बनेगा’ is slightly awkward and may be read narrowly in a criminal-bail setting.
    rationale: The Greek means to act as security/guarantor for the neighbor. ‘अपने पड़ोसी के लिए ज़मानत देगा’ is more idiomatic modern Hindi and preserves this legal-financial sense.
  revised_text: भला मनुष्य अपने पड़ोसी के लिए ज़मानत देगा, पर जिसने लज्जा खो दी है, वह उसे छोड़ देगा।
  revised_footnotes:
