  to: भला मनुष्य अपने पड़ोसी के लिए ज़मानत देगा, पर जिसने लज्जा खो दी है, वह उसे छोड़ देगा।
  rationale: Only the surety idiom has been adjusted for natural modern Hindi. The second clause continues to translate the Greek perfect participial wording directly, while the footnote supplies the close adjectival alternative documented in the English audit trail. The pronoun ‘उसे’ is left unexpanded so that the source text’s referential ambiguity is not resolved interpretively.
