  yaml_path: translation/deuterocanon/sirach/029/014.yaml
  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
translation:
  language: hi
  text: भला मनुष्य अपने पड़ोसी के लिए ज़मानत देगा, पर जिसने लज्जा खो दी है, वह उसे छोड़ देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: भला मनुष्य
  rationale: ἀνήρ पुल्लिंग एकवचन है और ἀγαθός यहाँ नैतिक भलाई व सज्जनता बताता है। ‘भला मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का भाव सुरक्षित रखता है।
- source_word: ἐγγυήσεται
  choice: जामिन बनेगा
  rationale: क्रिया का अर्थ किसी दूसरे के ऋण या दायित्व की जमानत लेना है। ‘जामिन बनेगा’ कानूनी-आर्थिक अर्थ को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी का
  rationale: πλησίον नैतिक-सामाजिक संदर्भ में निकटवर्ती व्यक्ति या पड़ोसी को दर्शाता है। सम्बन्धसूचक हिन्दी रचना में ‘अपने पड़ोसी का जामिन’ स्वाभाविक है।
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: जिसने लज्जा खो दी है
  rationale: पूर्ण कृदंत और αἰσχύνην की मूल छवि को बनाए रखते हुए यह अनुवाद उस व्यक्ति को दर्शाता है जिसने नैतिक संकोच या लज्जा गँवा दी है; इसे केवल ‘निर्लज्ज’ कहकर संक्षिप्त नहीं किया गया।
- source_word: καταλείψει αὐτόν
  choice: वह उसे छोड़ देगा
  rationale: καταλείπω का अर्थ पीछे छोड़ देना या त्याग देना है। ‘छोड़ देगा’ प्रसंग में सम्बन्धगत विश्वासघात को सहज हिन्दी में व्यक्त करता है, जबकि मूल की कुछ व्यापकता भी बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य की उक्ति में पुल्लिंग एकवचन
  choice: भला मनुष्य
  alternative: भला व्यक्ति
  rationale: यूनानी पाठ में ἀνήρ स्पष्टतः पुल्लिंग एकवचन है। ‘मनुष्य’ मूल के पुरुषवाचक रूप को पूरी तरह मिटाए बिना हिन्दी में सामान्य नीतिवचन की गरिमा भी रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जामिन’ सामान्य हिन्दी में जमानत लेने वाले व्यक्ति का सटीक शब्द है। ‘लज्जा खो दी है’ यूनानी अभिव्यक्ति की प्रत्यक्ष छवि को सुरक्षित रखता है।
