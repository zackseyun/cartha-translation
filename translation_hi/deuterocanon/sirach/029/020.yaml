translation:
  language: hi
  text: अपनी सामर्थ्य के अनुसार अपने पड़ोसी की सहायता कर, और सावधान रह कि तू स्वयं न गिर पड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं तू संकट में न पड़ जाए” अथवा “कहीं तू फँस न जाए।” यूनानी पाठ खतरे का स्वरूप स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: सहायता कर
  rationale: मध्यवाच्य आज्ञार्थक रूप सक्रिय रूप से सहारा देने या मदद के लिए आगे आने का भाव रखता है। ‘सहायता कर’ आधुनिक हिन्दी में व्यावहारिक मदद को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: τοῦ πλησίον
  choice: अपने पड़ोसी की
  rationale: नैतिक संदर्भ में πλησίον का मानक अर्थ निकटवर्ती या पड़ोसी मनुष्य है। सम्बन्धकारक रूप हिन्दी में ‘सहायता कर’ के साथ ‘की’ द्वारा व्यक्त किया गया है।
- source_word: κατὰ δύναμίν σου
  choice: अपनी सामर्थ्य के अनुसार
  rationale: κατά के साथ कर्मकारक यहाँ मात्रा या सीमा बताता है। यह अनुवाद सहायता को व्यक्ति की क्षमता के अनुरूप रखने का भाव सुरक्षित रखता है।
- source_word: πρόσεχε σεαυτῷ
  choice: अपने प्रति सावधान रह
  rationale: यह आत्म-सावधानी की चेतावनी है। यह रूप यूनानी के प्रति औपचारिक रूप से निकट रहते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: μὴ ἐμπέσῃς
  choice: कहीं ऐसा न हो कि तू गिर पड़े
  rationale: ἐμπίπτω का मूल भाव ‘गिर पड़ना’ या ‘किसी दशा में पड़ जाना’ है। यूनानी में कोई स्पष्ट पूरक नहीं है, इसलिए मुख्य पाठ खतरे को अनिर्दिष्ट ही रखता है।
theological_decisions:
- issue: μὴ ἐμπέσῃς में चेतावनी का दायरा
  choice: दूसरे की सहायता करते समय स्वयं गिर पड़ने से बचने की सामान्य चेतावनी
  alternative: कहीं तू संकट में न पड़ जाए; कहीं तू फँस न जाए
  rationale: पद उदार सहायता और विवेकपूर्ण आत्म-सावधानी को साथ रखता है। यूनानी खतरे को आर्थिक, नैतिक या किसी अन्य प्रकार तक सीमित नहीं करता, इसलिए अनुवाद भी इस तनाव और व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा उपदेशात्मक स्वर रखा गया है। एकवचन आज्ञार्थक के लिए ‘कर/रह’ और ‘तू’ का प्रयोग मूल की सीधी संबोधन-शैली के अनुरूप है; इसका आशय अपमानजनक नहीं है।
