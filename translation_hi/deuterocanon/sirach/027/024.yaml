translation:
  language: hi
  text: मैंने बहुत-सी बातों से घृणा की है, पर मैं उसके समान नहीं बना; और प्रभु उससे घृणा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: बहुत-सी बातों से
  rationale: नपुंसकलिंग बहुवचन यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बहुत-सी बातों से’ हिन्दी में इसके कर्म को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐμίσησα
  choice: मैंने ... घृणा की है
  rationale: यूनानी एओरिस्ट को यहाँ अनुभव के संचयी भाव और नीतिवचन-सदृश शैली के अनुरूप वर्तमान पूर्ण रूप में व्यक्त किया गया है।
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: मैं उसके समान नहीं बना
  rationale: ὁμοιόω यहाँ नैतिक अर्थ में किसी के समान हो जाने या उसके जैसा बनने को सूचित कर सकता है। यह अनुवाद उस अर्थ को स्पष्ट रखते हुए मूल कथन की कुछ असामान्यता भी बनाए रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: ज्ञान-साहित्य के इस प्रसंग में κύριος परमेश्वर के लिए प्रयुक्त है; ‘प्रभु’ प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: μισήσει αὐτόν
  choice: उससे घृणा करेगा
  rationale: भविष्यकाल और μισέω की कठोरता को सीधे सुरक्षित रखा गया है। हिन्दी में ‘से घृणा करना’ स्वाभाविक पदबंध है।
theological_decisions:
- issue: परमेश्वर के लिए घृणा की भाषा
  choice: प्रभु उससे घृणा करेगा
  alternative: प्रभु उससे बहुत अप्रसन्न होगा
  rationale: मूल में वक्ता और प्रभु—दोनों के लिए एक ही μισέω धातु प्रयुक्त है। ‘घृणा करेगा’ इस शब्दगत पुनरावृत्ति और कथन की धार्मिक तीव्रता को बिना नरम किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’ वाक्य के विरोध को स्वाभाविक बनाता है, जबकि अर्धविराम दोनों मुख्य कथनों के निकट संबंध को बनाए रखता है।
