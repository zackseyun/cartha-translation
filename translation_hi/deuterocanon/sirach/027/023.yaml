  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुँह टेढ़ा करेगा’ और ‘ठोकर का कारण’ जैसी मूल शारीरिक छवियाँ सुरक्षित हैं; जहाँ यूनानी असामान्य या बहुअर्थी है, वहाँ पादटिप्पणी से अस्पष्टता स्पष्ट की गई है।
