base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/023.yaml
  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: hi
  text: तुम्हारी आँखों के सामने वह मीठी बातें करेगा[a] और तुम्हारी बातों की बहुत सराहना करेगा; पर बाद में वह अपना मुँह टेढ़ा करेगा और तुम्हारी बातों के संबंध में ठोकर का कारण बनेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “वह मुँह मीठा करेगा।” यह किसी की बातों में मिठास घोलने, अर्थात मीठा बोलने, की छवि है।
    reason: idiomatic_clarification
  - marker: b
    text: या “तुम्हारी बातों से तुम्हें फँसाएगा” अथवा “तुम्हारी बातों के विषय में आपत्ति पैदा करेगा।” यूनानी σκάνδαλον का अर्थ ठोकर, फंदा, या आपत्ति का कारण हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: तुम्हारी आँखों के सामने
  rationale: यह यूनानी मुहावरा किसी की प्रत्यक्ष उपस्थिति को दर्शाता है; यह अनुवाद उसकी सजीव शारीरिक छवि भी बनाए रखता है।
- source_word: γλυκανεῖ στόμα σου
  choice: वह मीठी बातें करेगा
  rationale: यूनानी पाठ का शब्दशः रूप ‘वह तुम्हारा मुँह मीठा करेगा’ असामान्य है। प्रसंग में मीठी या चापलूसी-भरी वाणी अभिप्रेत जान पड़ती है, इसलिए मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और शाब्दिक रूप पादटिप्पणी में बताया गया है।
- source_word: ἐκθαυμάσει
  choice: बहुत सराहना करेगा
  rationale: क्रिया प्रबल प्रशंसा या विस्मय प्रकट करने का भाव रखती है। प्रसंग में सामने से की जाने वाली प्रशंसा है; ‘बहुत सराहना करेगा’ आधुनिक हिन्दी में स्वाभाविक है और कपट को क्रिया में अनावश्यक रूप से नहीं जोड़ता।
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: वह अपना मुँह टेढ़ा करेगा
  rationale: यह चयन यूनानी की शारीरिक और रूपकात्मक छवि को बनाए रखता है, जिसमें बाद में उसकी वाणी टेढ़ी या विरोधी हो जाती है।
- source_word: ἐν τοῖς λόγοις σου δώσει σκάνδαλον
  choice: तुम्हारी बातों को लेकर ठोकर का कारण खड़ा करेगा
  rationale: ἐν संबंध, क्षेत्र या साधन का बोध करा सकता है, जबकि σκάνδαλον ठोकर, फँसाव या अपराध/आपत्ति का कारण हो सकता है। यह अनुवाद कारण उत्पन्न करने वाले δώσει के बल को बनाए रखते हुए संबंध को अपेक्षाकृत खुला रखता है।
