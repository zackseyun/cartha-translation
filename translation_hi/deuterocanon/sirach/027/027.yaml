  yaml_path: translation/deuterocanon/sirach/027/027.yaml
  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: hi
  text: जो बुराई करता है[a], वह बुराई लुढ़ककर उसी पर आ पड़ेगी, और वह निश्चय ही नहीं जान पाएगा कि वह उस पर कहाँ से आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बुरी बातें” या “बुरे काम।” यूनानी पाठ में बुराई के लुढ़ककर अपने कर्ता पर आ पड़ने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: जो ... करता है
  rationale: लेखयुक्त वर्तमान कृदन्त यहाँ सामान्य और नीतिवचनात्मक अर्थ देता है; यह हिन्दी में हर ऐसे व्यक्ति को स्वाभाविक रूप से समेटता है।
- source_word: πονηρὰ
  choice: बुराई
  rationale: नपुंसकलिंग बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘बुराई’ उसके सामूहिक नैतिक अर्थ को सहज हिन्दी में व्यक्त करती है।
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: वह बुराई लुढ़ककर उसी पर आ पड़ेगी
  rationale: यह अनिष्ट के अपने कर्ता की ओर लुढ़क आने की दिशात्मक छवि को बनाए रखता है। ‘आ पड़ेगी’ εἰς αὐτόν की दिशा और प्रतिकूल प्रभाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ μὴ ἐπιγνῷ
  choice: निश्चय ही नहीं जान पाएगा
  rationale: οὐ μή के प्रबल निषेध को स्पष्ट और मुहावरेदार हिन्दी में सुरक्षित रखा गया है।
- source_word: πόθεν ἧκε αὐτῷ
  choice: वह उस पर कहाँ से आई
  rationale: πόθεν स्रोत को, ἧκε आगमन को, और αὐτῷ व्यक्ति पर आए प्रतिकूल परिणाम को व्यक्त करता है; हिन्दी वाक्य इन तीनों तत्वों को बनाए रखता है।
theological_decisions:
- issue: बुराई का अपने कर्ता पर लौटना
  choice: बुराई के लुढ़ककर उसी व्यक्ति पर आ पड़ने की मूर्त छवि को मुख्य पाठ में रखा गया है।
  alternative: जो बुराई करता है, उसकी बुराई उसी के पास लौट आती है।
  rationale: पद नैतिक प्रतिफल को नीतिवचन के रूप में व्यक्त करता है, पर यूनानी पाठ की ‘लुढ़कने’ वाली छवि को केवल सामान्य परिणाम या अमूर्त प्रतिशोध में बदलना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ‘उसी पर’ प्रतिफल की दिशा पर बल देता है, जबकि ‘निश्चय ही नहीं’ मूल के प्रबल निषेध को सुरक्षित रखता है।
