review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the conditional sequence: active pursuit (διώκῃς), successful attainment (καταλήμψῃ), and the ensuing clothing metaphor (ἐνδύσῃ). It also appropriately preserves the lexical breadth of τὸ δίκαιον in the footnote. However, the Hindi genitive order in “महिमा के पाँव तक लम्बे वस्त्र” can imply that the garment belongs to the feet rather than that it is a glory-garment reaching to the feet. The relation of δόξης to ποδήρη therefore needs clarification.'
  naturalness: “धार्मिकता के पीछे लगे रहोगे” is understandable, though slightly colloquial; it remains acceptable in a modern, dignified wisdom-text register. The needed revision makes the garment image grammatically clear and natural in Hindi.
  terminology: “धार्मिकता” is a viable established rendering for the moral sense intended here, provided the footnote retains “जो उचित है” and “न्याय” as legitimate alternatives. “महिमा” suitably renders δόξα. “पाँव तक लम्बा वस्त्र” correctly conveys the full-length nuance of ποδήρης.
  issues:
  - severity: medium
    issue: Ambiguous modifier placement in the clothing image
    rationale: “महिमा के पाँव तक लम्बे वस्त्र” does not clearly mean “a foot-length garment of glory.” Reordering to “महिमा का पाँव तक लम्बा वस्त्र” preserves both the genitive “of glory” and the length denoted by ποδήρη.
