- from: यदि तुम धार्मिकता[a] के पीछे लगे रहोगे, तो उसे पा लोगे और उसे महिमा के पाँव तक लम्बे वस्त्र के समान पहन लोगे।
  to: यदि तुम धार्मिकता[a] के पीछे लगे रहोगे, तो उसे पा लोगे और उसे महिमा का पाँव तक लम्बा वस्त्र मानकर पहन लोगे।
  rationale: The revision only clarifies the syntax of the final metaphor. “महिमा का पाँव तक लम्बा वस्त्र” makes clear that the full-length garment is characterized by glory, rather than suggesting that “महिमा” modifies “feet.” “मानकर” naturally expresses the Greek construction of putting the attained moral good on as such a garment.
