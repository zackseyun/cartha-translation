  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
translation:
  language: hi
  text: यदि तुम धार्मिकता[a] के पीछे लगे रहोगे, तो उसे पा लोगे और उसे महिमा का पाँव तक लम्बा वस्त्र मानकर पहन लोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो उचित है”; अथवा “न्याय।” यूनानी पद इतना व्यापक है कि उसमें व्यक्तिगत धार्मिकता और न्यायपूर्ण आचरण, दोनों सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: पीछे लगे रहोगे
  rationale: यह क्रिया किसी लक्ष्य का सक्रिय और सतत पीछा करने का भाव रखती है; ‘पीछे लगे रहना’ साधारण आधुनिक हिन्दी में नैतिक प्रयत्न की तीव्रता व्यक्त करता है।
- source_word: τὸ δίκαιον
  choice: धार्मिकता
  rationale: संज्ञीकृत नपुंसकलिंग विशेषण का अर्थ व्यापक रूप से ‘जो उचित/न्यायपूर्ण है’ हो सकता है। ‘धार्मिकता’ व्यक्तिगत सही चरित्र और न्यायपूर्ण आचरण दोनों को समेटती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: καταλήμψῃ
  choice: पा लोगे
  rationale: मूल क्रिया में पकड़ लेने या पीछा करके जा पहुँचने का भाव है। हिन्दी में ‘पा लोगे’ खोजे जा रहे नैतिक लक्ष्य को सफलतापूर्वक प्राप्त करने का स्वाभाविक रूप है।
- source_word: ἐνδύσῃ
  choice: पहन लोगे
  rationale: मध्यवाच्य अर्थ को हिन्दी में स्वाभाविक ढंग से व्यक्त करते हुए वस्त्र का रूपक स्पष्ट रखता है।
- source_word: ποδήρη
  choice: पाँव तक लम्बे वस्त्र
  rationale: यह शब्द पाँव तक पहुँचने वाले पूरे लम्बे परिधान को सूचित करता है। ‘पाँव तक लम्बे वस्त्र’ उस विशेष अर्थ को केवल ‘वस्त्र’ या ‘चोगे’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
- source_word: δόξης
  choice: महिमा के
  rationale: संबंधकारक संरचना को बनाए रखकर ‘महिमा’ की गरिमापूर्ण और संभावित धर्मवैचारिक अनुगूँज सुरक्षित रहती है।
theological_decisions:
- issue: प्रज्ञा-साहित्य के संदर्भ में τὸ δίκαιον का अनुवाद
  choice: धार्मिकता
  alternative: जो उचित है; न्याय
  rationale: यूनानी पद व्यक्तिगत नैतिक सच्चाई और न्यायपूर्ण आचरण दोनों को व्यक्त कर सकता है। वस्त्र के रूपक के साथ ‘धार्मिकता’ सहज बैठती है, पर इसकी वास्तविक व्यापकता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पाँव तक लम्बे वस्त्र’ ποδήρη की विशिष्ट दृश्यात्मकता को सुरक्षित रखता है; वाक्य में पीछा करने, पा लेने और पहन लेने की क्रमिक रूपक-गतिशीलता भी बनाए रखी गई है।
