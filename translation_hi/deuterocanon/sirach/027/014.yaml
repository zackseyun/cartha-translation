translation:
  language: hi
  text: बार-बार शपथ खाने वाले की बात रोंगटे खड़े कर देती है[a], और ऐसे लोगों का झगड़ा कानों को बंद कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द πολυκόρυφου का ठीक अर्थ निश्चित नहीं है। यह बहुत अधिक शपथ खाने या कोसने वाले व्यक्ति को, अथवा अधिक व्यापक अर्थ में ऊँची आवाज़ में उद्दंड या डींग भरी बातें करने वाले को सूचित कर सकता है। मुख्य पाठ में प्रसंग के अनुसार ‘बार-बार शपथ खाने वाले’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: बातें
  rationale: यह बोलने या वाणी के लिए व्यापक शब्द है। ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और सूक्ति की शैली के अनुकूल है।
- source_word: πολυκόρυφου
  choice: बार-बार शपथ खानेवाले
  rationale: यह शब्द दुर्लभ और अर्थ की दृष्टि से कठिन है। प्रसंग में अत्यधिक शपथ खाने या अपशब्द बोलनेवाले व्यक्ति का अर्थ उपयुक्त जान पड़ता है; इसकी अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ὀρθώσει τρίχας
  choice: रोंगटे खड़े कर देती हैं
  rationale: यह यूनानी बिंब भय, घृणा या तीव्र विकर्षण व्यक्त करता है। हिन्दी का यह प्रचलित मुहावरा उसी सजीव चित्र को बनाए रखता है।
- source_word: μάχη
  choice: झगड़ा
  rationale: इस ज्ञान-साहित्यिक और वाणी-संबंधी प्रसंग में यह शब्द वास्तविक युद्ध से अधिक आपसी कलह या तकरार को सूचित करता है।
- source_word: ἐμφραγμὸς ὤτιων
  choice: कान बंद कर देता है
  rationale: शाब्दिक अर्थ ‘कानों का अवरोध/बंद होना’ है। हिन्दी में यह रूप स्वाभाविक ढंग से बताता है कि झगड़ा इतना अप्रिय है कि सुनना असह्य हो जाता है।
- source_word: αὐτῶν
  choice: ऐसे लोगों का
  rationale: यूनानी सर्वनाम बहुवचन है, जबकि पहले पद में व्यक्ति का उल्लेख एकवचन रूप में है। ‘ऐसे लोगों का’ उस व्यक्ति को एक वर्ग के प्रतिनिधि के रूप में लेकर संख्या के इस बदलाव को सहज हिन्दी में व्यक्त करता है।
