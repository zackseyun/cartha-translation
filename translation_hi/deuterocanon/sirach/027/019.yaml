base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/019.yaml
  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: hi
  text: और जैसे तुमने अपने हाथ से पक्षी को छोड़ दिया, वैसे ही तुमने अपने पड़ोसी को जाने दिया; तुम उसे पकड़ नहीं सकोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसका शिकार नहीं करोगे।” यूनानी क्रिया में शिकार करने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: पक्षी
  rationale: यह सामान्य रूप से किसी पक्षी को दर्शाता है; ‘पक्षी’ आधुनिक हिन्दी में स्वाभाविक है और उपमा को स्पष्ट रखता है।
- source_word: ἐκ χειρός σου
  choice: अपने हाथ से
  rationale: यह मूल की ठोस स्थानगत छवि को बनाए रखता है—पक्षी व्यक्ति के हाथ से छोड़ा गया है।
- source_word: ἀπέλυσας
  choice: छोड़ दिया
  rationale: क्रिया का अर्थ मुक्त करना या जाने देना है; यहाँ हाथ से पक्षी छोड़ने की छवि के लिए यह सहज हिन्दी है।
- source_word: ἀφῆκας
  choice: जाने दिया
  rationale: इस संदर्भ में समानांतर ἀπέλυσας और आगे की आखेट-छवि ‘क्षमा किया’ के बजाय छोड़ने या जाने देने का अर्थ समर्थित करती है। हल्का शब्द-भेद हिन्दी में अनावश्यक पुनरुक्ति से बचाता है, जबकि समानता बनी रहती है।
- source_word: τὸν πλησίον
  choice: अपने पड़ोसी
  rationale: ‘पड़ोसी’ निकट सामाजिक संबंध वाले व्यक्ति के लिए प्रचलित और नैतिक अर्थवत्ता रखने वाला हिन्दी समतुल्य है।
- source_word: οὐ θηρεύσεις αὐτόν
  choice: अब तुम उसे फिर नहीं पकड़ सकोगे
  rationale: θηρεύω में शिकार करने की छवि है, पर यहाँ आशय छोड़े गए व्यक्ति को पुनः पा न सकने से है। ‘पकड़ सकोगे’ पक्षी की उपमा और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अब’ और ‘फिर’ प्रसंगगत परिणाम को स्पष्ट करते हैं।
theological_decisions:
- issue: अंतिम क्रिया में आखेट की छवि को प्रत्यक्ष रखना या उसके परिणाम पर बल देना
  choice: अब तुम उसे फिर नहीं पकड़ सकोगे
  alternative: तुम उसका फिर शिकार नहीं कर सकोगे / तुम उसे फिर अपने वश में नहीं कर सकोगे
  rationale: यूनानी θηρεύσεις आखेट का बिंब जगाता है, किंतु कहावत का मुख्य बल संबंध टूटने के बाद व्यक्ति को पुनः न पा सकने पर है। चुना हुआ पाठ बिंब के परिणाम को स्पष्ट रखता है और ऐसा नहीं सुझाता कि पड़ोसी सचमुच शिकार है। पादटिप्पणी मूल की आखेट-छाया सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक रूप। पक्षी और पड़ोसी के बीच मूल समानांतरता बनाए रखी गई है। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
