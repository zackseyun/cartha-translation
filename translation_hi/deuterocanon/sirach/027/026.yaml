  text: The one who digs a pit will fall into it, and the one who sets a snare will be caught in it.
translation:
  language: hi
  text: जो गड्ढा खोदता है, वह उसी में गिरेगा; और जो फंदा लगाता है, वह उसी में पकड़ा जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: जो ... खोदता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को सामान्य और लोकोक्तिपरक हिन्दी में व्यक्त करता है।
- source_word: βόθρον
  choice: गड्ढा
  rationale: खोदे हुए ऐसे गहरे स्थान की छवि बनाए रखता है जिसमें कोई गिर सकता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰς αὐτὸν
  choice: उसी में
  rationale: सर्वनाम का संबंध गड्ढे से है। ‘उसी’ कर्म के कर्ता पर लौट आने वाली लोकोक्तिपरक धार को स्पष्ट करता है, बिना नया आशय जोड़े।
- source_word: ἐμπεσεῖται
  choice: गिरेगा
  rationale: भविष्यकाल और भीतर गिरने का भाव ‘उसी में’ के साथ स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ ἱστῶν
  choice: जो ... लगाता है
  rationale: फंदे के साथ ‘लगाना’ आधुनिक हिन्दी की स्वाभाविक क्रिया है और उसे स्थापित करने का अर्थ देता है।
- source_word: παγίδα
  choice: फंदा
  rationale: ‘जाल’ की तुलना में पकड़ने वाले उपकरण की विशिष्ट और साहित्यिक छवि को अधिक निकटता से बनाए रखता है।
- source_word: ἐν αὐτῇ
  choice: उसी में
  rationale: स्त्रीलिंग यूनानी सर्वनाम παγίδα की ओर लौटता है और पहले उपवाक्य के समानांतर विन्यास को बनाए रखता है।
- source_word: ἁλώσεται
  choice: पकड़ा जाएगा
  rationale: भविष्य निष्क्रिय रूप को फंदे की छवि के अनुरूप सहज हिन्दी में व्यक्त करता है।
