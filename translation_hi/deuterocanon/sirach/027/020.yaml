base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: hi
  text: उसका पीछा मत करो[a], क्योंकि वह बहुत दूर चला गया है और फंदे से छूटे चिकारे[b] के समान बच निकला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके पीछे मत दौड़ो।’ यूनानी क्रिया सामान्य रूप से किसी का पीछा करने के अर्थ में भी आ सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात तेज दौड़ने वाला वन्य पशु जो शिकारी के फंदे से छूट गया हो। ‘चिकारा’ के स्थान पर अधिक सामान्य रूप से ‘हिरन’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... διώξῃς
  choice: पीछा मत करो
  rationale: διώκω का सामान्य अर्थ किसी के पीछे जाना या उसका पीछा करना है। यहाँ ‘सताना’ अर्थ लेने का स्पष्ट आधार नहीं है; इसलिए निषेधात्मक आज्ञा को स्वाभाविक हिन्दी में रखा गया है।
- source_word: αὐτόν
  choice: उसका
  rationale: यूनानी सर्वनाम पुल्लिंग एकवचन है और पिछले प्रसंग में उल्लिखित पुरुष की ओर संकेत करता है। हिन्दी वाक्य-विन्यास में ‘उसका पीछा’ स्वाभाविक है।
- source_word: μακρὰν ἀπέστη
  choice: वह बहुत दूर चला गया है
  rationale: ἀφίστημι यहाँ हट जाने या दूर चले जाने का बोध देता है, जबकि μακράν दूरी पर बल देता है। यह रूप पूर्ण हो चुकी क्रिया और वर्तमान दूरी, दोनों को व्यक्त करता है।
- source_word: ἐξέφυγεν
  choice: बच निकला है
  rationale: क्रिया खतरे या बंधन से सफलतापूर्वक निकल जाने को दर्शाती है। ‘बच निकला’ फंदे वाले रूपक के साथ सहज बैठता है।
- source_word: ὡς δορκὰς
  choice: चिकारे के समान
  rationale: δορκάς गज़ेल या उसी प्रकार के तेज वन्य पशु को दर्शाता है। ‘चिकारा’ आधुनिक हिन्दी में अधिक सटीक पशु-नाम है और तीव्र गति से बच निकलने की छवि बनाए रखता है।
- source_word: ἐκ παγίδος
  choice: फंदे से
  rationale: παγίς शिकार पकड़ने के फंदे या जाल को दर्शाता है। ‘फंदा’ एकवचन और पशु-शिकार की छवि, दोनों को स्पष्ट रखता है।
