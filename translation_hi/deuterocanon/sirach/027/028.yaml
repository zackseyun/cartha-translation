  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: hi
  text: घमंडियों[a] को उपहास और धिक्कार मिलता है, और प्रतिशोध सिंह की तरह उसकी घात लगाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अहंकारियों।”
    reason: lexical_alternative
  - marker: b
    text: या, “प्रतिशोध सिंह की तरह उसकी बाट जोहेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: उपहास
  rationale: यह शब्द हँसी उड़ाने और तिरस्कारपूर्ण व्यवहार का भाव व्यक्त करता है; ‘उपहास’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ὀνειδισμός
  choice: निंदा
  rationale: यह शब्द धिक्कार, अपमान या बदनामी कराने वाले तिरस्कार को दर्शाता है। ‘निंदा’ इस नैतिक और सामाजिक भाव को सरल हिन्दी में व्यक्त करती है।
- source_word: ὑπερηφάνων
  choice: घमंडियों
  rationale: यूनानी बहुवचन घमंडी या अहंकारी लोगों के एक वर्ग को सूचित करता है। ‘घमंडियों’ संक्षिप्त और सामान्य पाठक के लिए सहज है।
- source_word: ἐκδίκησις
  choice: प्रतिशोध
  rationale: यह बदला लेने या किए का दंडात्मक फल मिलने का भाव रखता है। ‘प्रतिशोध’ यूनानी की कठोर चेतावनी को बनाए रखता है और उसके कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐνεδρεύσει
  choice: घात में बैठेगा
  rationale: क्रिया छिपकर अवसर की प्रतीक्षा करने या घात लगाने को दर्शाती है। यह चयन सिंह द्वारा शिकार का पीछा करने की सजीव उपमा सुरक्षित रखता है।
- source_word: αὐτόν
  choice: उसकी
  rationale: यूनानी में कर्मवाचक सर्वनाम एकवचन है, जो बहुवचन वर्ग में से प्रत्येक घमंडी व्यक्ति पर चेतावनी को लागू करता है। हिन्दी में ‘उसकी घात में’ इसी एकवचन संकेत को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: बहुवचन ‘घमंडियों’ के बाद आए एकवचन सर्वनाम को कैसे व्यक्त किया जाए
  choice: एकवचन ‘उसकी’ बनाए रखा गया
  alternative: उनकी / ऐसे व्यक्ति की
  rationale: यूनानी αὐτόν एकवचन है और सामूहिक वर्ग में से एक प्रतिनिधि व्यक्ति पर चेतावनी को केंद्रित करता है। इसे बहुवचन बनाने से स्रोत का रूप बदल जाता।
- issue: ἐκδίκησις को न्याय, दंड या प्रतिशोध में से किस रूप में व्यक्त किया जाए
  choice: प्रतिशोध
  alternative: दंड / न्याय
  rationale: इस प्रसंग में शब्द बदले या प्रतिफल की कठोर चेतावनी देता है। ‘न्याय’ अर्थ को नरम कर सकता है, जबकि ‘दंड’ सिंह की शिकारी उपमा के साथ आने वाले प्रतिशोधात्मक भाव को पूरी तरह नहीं रखता।
- issue: आरंभिक क्रियारहित पदबंध में संबंध का अर्थ
  choice: ‘घमंडियों के लिए’
  alternative: ‘घमंडियों के हैं’ / ‘घमंडियों को मिलते हैं’
  rationale: यूनानी में स्पष्ट क्रिया नहीं है, इसलिए संबंध कुछ हद तक खुला है। ‘के लिए’ उपहास और निंदा को घमंडियों के हिस्से या परिणाम के रूप में बताता है, बिना किसी अतिरिक्त कर्ता को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और नीतिवचन-सदृश रूप अपनाया गया है। ‘उपहास और निंदा’ समानांतर संज्ञाओं को बनाए रखते हैं; ‘सिंह के समान उसकी घात में बैठेगा’ मूल की शिकारी छवि और एकवचन चेतावनी दोनों सुरक्षित रखता है।
