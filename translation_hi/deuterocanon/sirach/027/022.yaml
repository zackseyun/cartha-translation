translation:
  language: hi
  text: जो आँख से इशारा करता है, वह बुराइयाँ रचता है, और कोई उसे उससे दूर नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διανεύων ὀφθαλμῷ
  choice: जो आँख से इशारा करता है
  rationale: क्रिया का अर्थ संकेत करना है; ‘आँख से’ के साथ यह गुप्त नेत्र-संकेत को व्यक्त करता है। ‘आँख मारता है’ अधिक मुहावरेदार है, पर आधुनिक हिन्दी में उसके अन्य भाव भी हो सकते हैं।
- source_word: τεκταίνει
  choice: रचता है
  rationale: मूल क्रिया में बनाने या गढ़ने का भाव है और यहाँ उसका अर्थ सोच-समझकर बुराई की योजना बनाने से है। ‘रचता है’ इस सृजनात्मक तथा षड्यंत्रकारी भाव को संक्षेप में रखता है।
- source_word: κακά
  choice: बुराइयाँ
  rationale: यूनानी बहुवचन व्यापक है। ‘बुराइयाँ’ उसके नैतिक बल और खुले अर्थ-क्षेत्र को बनाए रखता है, जबकि ‘बुरी योजनाएँ’ अर्थ को अधिक संकीर्ण कर देता।
- source_word: οὐδεὶς
  choice: कोई … नहीं
  rationale: यूनानी के सार्वभौमिक नकार का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἀποστήσει
  choice: दूर नहीं करेगा
  rationale: यह कारक क्रिया किसी को किसी बात या मार्ग से अलग करने अथवा विमुख करने का भाव देती है; हिन्दी वाक्य में ‘दूर नहीं करेगा’ उस व्यापकता को बनाए रखता है।
- source_word: ἀπʼ αὐτοῦ
  choice: उनसे
  rationale: यूनानी रूप व्याकरणतः एकवचन है—‘उससे’—पर अर्थ की दृष्टि से निकटतम पूर्वपद बहुवचन ‘बुराइयाँ’ है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘उनसे’ रखा गया है और मूल की असंगति पादटिप्पणी में बताई गई है।
