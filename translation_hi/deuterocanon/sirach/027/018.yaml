  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
translation:
  language: hi
  text: क्योंकि जैसे एक मनुष्य ने अपने शत्रु को नष्ट कर दिया, वैसे ही तुमने अपने पड़ोसी की मित्रता नष्ट कर दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पड़ोसी के साथ मित्रता।” यूनानी संबंधकारक का अर्थ पड़ोसी की मित्रता अथवा पड़ोसी के साथ मित्रता—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और καθώς की तुलना—दोनों को बनाए रखता है तथा हिन्दी में अगले खंड के ‘वैसे ही’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: ἀπώλεσεν … ἀπώλεσας
  choice: नष्ट कर दिया … नष्ट कर दी है
  rationale: दोनों स्थानों पर एक ही प्रबल क्रिया रखकर यूनानी की पुनरावृत्ति और शत्रु के विनाश तथा मित्रता के विनाश के बीच कठोर तुलना सुरक्षित रखी गई है। दूसरे पुरुष वाले खंड में ‘है’ वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: किसी मनुष्य
  rationale: एकवचन के सामान्य, लोकोक्तिपरक अर्थ को व्यक्त करता है; यहाँ पुरुष-लिंग मुख्य विषय नहीं है, इसलिए आधुनिक हिन्दी में ‘किसी मनुष्य’ सहज और स्रोत के निकट है।
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: अपने शत्रु को
  rationale: αὐτοῦ के संबंध को हिन्दी के स्वाभाविक निजवाचक ‘अपने’ से और ἐχθρός को स्पष्ट रूप से ‘शत्रु’ से व्यक्त किया गया है।
- source_word: οὕτως
  choice: वैसे ही
  rationale: पहले खंड के ‘जैसे’ से स्पष्ट तुलना स्थापित करता है।
- source_word: τὴν φιλίαν
  choice: मित्रता
  rationale: φιλία के संबंधात्मक अर्थ को सरल, प्रतिष्ठित और आधुनिक हिन्दी में व्यक्त करता है; ‘नष्ट कर दी’ इसे किसी ठोस संबंध के रूप में प्रस्तुत करता है।
- source_word: τοῦ πλησίον
  choice: अपने पड़ोसी की
  rationale: πλησίον का यहूदी-यूनानी नैतिक संदर्भ में सामान्य अर्थ ‘पड़ोसी’ है। संबंधकारक का निकट रूप ‘की’ रखा गया है, जबकि उसके संभावित संबंधात्मक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: लोकोक्तिपरक कथन में ἄνθρωπος का सामान्य अर्थ
  choice: किसी मनुष्य
  alternative: कोई व्यक्ति
  rationale: स्रोत का एकवचन प्रतिनिधिक रूप बना रहता है, पर हिन्दी में अनावश्यक रूप से जैविक लिंग पर बल नहीं पड़ता।
- issue: संबंध-विनाश की तीव्रता
  choice: मित्रता नष्ट कर दी है
  alternative: मित्रता बिगाड़ दी है
  rationale: दोनों खंडों में ἀπόλλυμι की पुनरावृत्ति जानबूझकर कठोर है। ‘बिगाड़ दी’ इस तुलना और आरोप की तीव्रता को कम कर देती।
- issue: τοῦ πλησίον संबंधकारक की अस्पष्टता
  choice: अपने पड़ोसी की मित्रता
  alternative: अपने पड़ोसी के साथ मित्रता
  rationale: शाब्दिक संबंधकारक को मुख्य पाठ में रखा गया है, पर यूनानी का अर्थ पड़ोसी की ओर से दी गई मित्रता अथवा पड़ोसी के साथ साझा मित्रता—दोनों हो सकता है; इसलिए विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु ज्ञान-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। ‘शत्रु’, ‘पड़ोसी’ और ‘मित्रता’ सामान्य पाठक के लिए स्पष्ट हैं। तुलना की संरचना ‘जैसे … वैसे ही’ से और दोहराई गई प्रबल क्रिया से मूल का अलंकारिक बल सुरक्षित है।
