  yaml_path: translation/deuterocanon/sirach/027/009.yaml
  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: hi
  text: पक्षी अपने जैसे पक्षियों के पास बसेरा करते हैं[a], और सत्य उनके पास लौट आता है जो उसे आचरण में लाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पक्षी अपने जैसे पक्षियों के पास ठहरते हैं।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “सत्य उनके पास लौट आता है जो उसे करते हैं।” यूनानी में सत्य का मानवीकरण किया गया है और उसे व्यवहार में उतारने वालों के पास उसके लौटने की बात कही गई है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: पक्षी
  rationale: यह नपुंसकलिंग बहुवचन सामान्यतः पक्षियों को सूचित करता है; ‘पक्षी’ सहज और पर्याप्त व्यापक हिन्दी है।
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: अपने जैसे पक्षियों के पास
  rationale: यह वाक्यांश समानता और स्वजातीय संगति व्यक्त करता है। हिन्दी में संज्ञा को दोहराने से अभिप्राय स्पष्ट और स्वाभाविक रहता है।
- source_word: καταλύσει
  choice: बसेरा करते हैं
  rationale: क्रिया का अर्थ ठहरना या निवास करना हो सकता है। पक्षियों के संदर्भ में ‘बसेरा करना’ स्वाभाविक है; यूनानी भविष्यकाल को लोकोक्तिपरक सामान्य सत्य के रूप में हिन्दी वर्तमानकाल में व्यक्त किया गया है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: ‘सत्य’ यूनानी संज्ञा की व्यापकता बनाए रखता है और इसे केवल ‘सत्यवादिता’ तक सीमित नहीं करता।
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: जो उसे आचरण में लाते हैं
  rationale: ἐργάζομαι सकर्मक रूप में किसी बात को करना या व्यवहार में उतारना बताता है। यह चयन सत्य के सक्रिय पालन को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπανήξει
  choice: लौट आता है
  rationale: क्रिया फिर आने या वापस लौटने का भाव रखती है। ‘लौट आता है’ सत्य के मानवीकरण और नैतिक पारस्परिकता, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: सत्य का मानवीकरण और नैतिक पारस्परिकता
  choice: सत्य उन लोगों के पास ‘लौट आता है’ जो उसे आचरण में लाते हैं।
  alternative: सत्य उनके पास आता है जो उसे आचरण में लाते हैं।
  rationale: ἐπανήξει केवल आने के बजाय वापस आने का बोध देता है। इसलिए अनुवाद ज्ञान-साहित्य की उस तनावपूर्ण छवि को बनाए रखता है जिसमें सत्य को लौटने वाले कर्ता के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और लोकोक्तिपरक रूप अपनाया गया है। ‘बसेरा करते हैं’ पक्षियों की छवि को स्वाभाविक बनाता है, जबकि ‘आचरण में लाते हैं’ सत्य को सक्रिय रूप से जीने का अर्थ स्पष्ट करता है।
