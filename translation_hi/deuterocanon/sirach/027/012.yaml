  yaml_path: translation/deuterocanon/sirach/027/012.yaml
  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
translation:
  language: hi
  text: निर्बुद्धि लोगों के बीच सही समय की बाट देखो[a], पर समझदार व्यक्ति के साथ निरन्तर बने रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्खों के बीच उचित अवसर की प्रतीक्षा करो, पर विवेकी व्यक्ति के साथ लगातार रहो।”
    reason: ἀσυνέτων के लिए ‘मूर्खों’, καιρός के लिए ‘उचित अवसर’, और ἐνδελέχιζε के लिए ‘लगातार रहो’ समान रूप से सम्भव शब्दार्थ हैं।
lexical_decisions:
- source_word: ἀσυνέτων
  choice: निर्बुद्धि लोगों
  rationale: यह शब्द उन लोगों को दर्शाता है जिनमें समझ-बूझ का अभाव है। ‘निर्बुद्धि’ इसके बौद्धिक और नैतिक दोनों संकेतों को संक्षेप में रखता है और अगले खंड के ‘समझदार’ से स्पष्ट विरोध बनाता है।
- source_word: συντήρησον καιρόν
  choice: सही समय की बाट देखो
  rationale: συντηρέω सावधानी से देखते या प्रतीक्षा करते रहने का, और καιρός उचित अवसर का बोध कराता है। यह हिन्दी अभिव्यक्ति सतर्कता और उपयुक्त समय की प्रतीक्षा—दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: διανοουμένου
  choice: समझदार व्यक्ति
  rationale: διανοέομαι से बना यह रूप ऐसे व्यक्ति का संकेत करता है जो विचार करता और बात को समझता है। ‘समझदार व्यक्ति’ आधुनिक हिन्दी में सहज है तथा मूल के एकवचन को बनाए रखता है।
- source_word: ἐνδελέχιζε
  choice: निरन्तर बने रहो
  rationale: क्रिया लगातार टिके रहने या लगे रहने का भाव देती है। यह अनुवाद अवधि और स्थिरता को सुरक्षित रखता है, बिना यह तय किए कि निरन्तर किया जाने वाला विशिष्ट कार्य क्या है।
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: के बीच ... पर ... के साथ
  rationale: पहला प्रयोग बहुवचन समुदाय के मध्य होने को और दूसरा एक विचारशील व्यक्ति की संगति को दर्शाता है। हिन्दी में ये रूप स्वाभाविक हैं और δέ द्वारा व्यक्त विरोध को ‘पर’ स्पष्ट करता है।
