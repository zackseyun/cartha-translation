lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: सोच सामने आने से पहले
  rationale: λογισμός का अर्थ ‘सोच, विचार, तर्क-विचार’ हो सकता है। इस नीतिवचन में भाव यह है कि किसी की सोच या विवेक प्रकट हुए बिना उसकी प्रशंसा नहीं करनी चाहिए। ‘सामने आने’ से यह व्यावहारिक आशय स्वाभाविक हिन्दी में व्यक्त होता है, जबकि पाद-टिप्पणी मूल की संक्षिप्त और बहुअर्थी अभिव्यक्ति सुरक्षित रखती है।
- source_word: μὴ ἐπαινέσῃς
  choice: प्रशंसा न करो
  rationale: μή के साथ एओरिस्ट सब्जंक्टिव निषेध व्यक्त करता है। ‘प्रशंसा न करो’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ἄνδρα
  choice: किसी मनुष्य की
  rationale: यूनानी एकवचन पुल्लिंग संज्ञा यहाँ नीतिवचन में प्रतिनिधिक रूप से प्रयुक्त है। ‘मनुष्य’ स्रोत के रूप को बनाए रखते हुए सामान्य मानव को सूचित करता है।
- source_word: πειρασμὸς
  choice: परख
  rationale: ज्ञान-साहित्य के इस संदर्भ में शब्द का अर्थ प्रलोभन नहीं, बल्कि जाँच या कसौटी है। हिन्दी में ‘परख’ व्यक्ति के विवेक और चरित्र के मूल्यांकन का भाव सहजता से व्यक्त करती है।
- source_word: ἀνθρώπων
  choice: मनुष्यों की
  rationale: संबंधकारक बहुवचन को निकट रूप से प्रस्तुत करता है और ἄνδρα के साथ मूल की शब्दगत कड़ी बनाए रखता है।
