translation:
  language: hi
  text: यदि वह प्रभु के भय को पूरी लगन से थामे न रहे, तो उसका घर[a] शीघ्र ही नष्ट हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसका घराना शीघ्र ही बरबाद हो जाएगा।’ यूनानी शब्द ‘घर’ से मकान के साथ-साथ किसी का परिवार, घराना या पूरी गृहस्थी भी अभिप्रेत हो सकती है।
    reason: यूनानी οἶκος की वास्तविक अर्थगत व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: यह यूनानी की नकारात्मक शर्त को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν φόβῳ Κυρίου
  choice: प्रभु के भय में
  rationale: यह बुद्धि-साहित्य की स्थापित बाइबिलीय अभिव्यक्ति और उसके धार्मिक महत्व को बनाए रखता है; इसे केवल ‘श्रद्धा’ कहकर सीमित नहीं करता।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यूनानी κύριος का स्वाभाविक और परंपरागत हिन्दी समकक्ष है; यहाँ प्रत्यक्ष हिब्रू ईश्वरीय नाम नहीं है।
- source_word: κρατήσῃ
  choice: दृढ़ ... रहे
  rationale: यह क्रिया यहाँ मजबूती से थामे रहने अथवा स्थिर बने रहने का भाव देती है; हिन्दी वाक्य में ‘दृढ़ रहे’ उसी स्थायित्व को सहजता से व्यक्त करता है।
- source_word: κατὰ σπουδήν
  choice: पूरी लगन से
  rationale: यह गंभीर तत्परता, परिश्रम और मनोयोग के साथ दृढ़ रहने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: यह परिणाम के जल्द घटित होने का अर्थ गरिमापूर्ण और सहज हिन्दी में देता है।
- source_word: καταστραφήσεται
  choice: नष्ट हो जाएगा
  rationale: भविष्यत् कर्मवाच्य का विनाश या पूर्ण पतन का भाव सुरक्षित रहता है और यह भौतिक घर तथा घराने, दोनों के साथ अर्थपूर्ण है।
- source_word: αὐτοῦ ὁ οἶκος
  choice: उसका घर
  rationale: οἶκος में मकान, परिवार, घराना और गृहस्थी की व्यापक संभावनाएँ हैं; ‘घर’ मूल बिंब और उसकी अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु के भय’ का अर्थ
  choice: परंपरागत बाइबिलीय मुहावरे ‘प्रभु के भय में’ को बनाए रखा गया।
  alternative: प्रभु के प्रति श्रद्धा में; प्रभु की भक्ति में
  rationale: ‘भय’ बुद्धि-साहित्य में श्रद्धापूर्ण भय, अधीनता और नैतिक गंभीरता का बहुस्तरीय भाव रखता है। केवल ‘श्रद्धा’ या ‘भक्ति’ कहने से इसका धर्मवैचारिक तनाव संकुचित हो जाता।
- issue: ‘घर’ का दायरा
  choice: मुख्य पाठ में ‘घर’ रखा गया।
  alternative: घराना; परिवार; गृहस्थी
  rationale: यूनानी οἶκος किसी भवन के साथ-साथ परिवार या पूरे घरेलू प्रतिष्ठान को भी सूचित कर सकता है। मुख्य पाठ में व्यापक बिंब रखा गया और विकल्प पादटिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘प्रभु के भय में’ द्वारा बाइबिलीय मुहावरा सुरक्षित है, जबकि ‘पूरी लगन से दृढ़ रहे’ सामान्य पाठक के लिए स्वाभाविक है।
