base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/017.yaml
  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
translation:
  language: hi
  text: मित्र को सँजोकर रखो और उसके प्रति विश्वासयोग्य रहो; पर यदि तुम उसके भेद खोल दोगे, तो फिर निश्चय ही उसके पीछे न जा सकोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर उसके पीछे कदापि मत जाना।” यूनानी वाक्य को परिणाम के कथन के रूप में, अथवा—कम संभावना से—निषेध के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  choice: प्रिय रखो
  rationale: यह आज्ञार्थक क्रिया स्नेहपूर्ण लगाव और आत्मीय निष्ठा व्यक्त करती है; ‘प्रिय रखो’ सामान्य ‘प्रेम करो’ की अपेक्षा इस भाव को अधिक स्पष्ट रखता है।
- source_word: φίλον
  choice: मित्र को
  rationale: यह क्रिया का कर्म है और नीतिवचन की सामान्य, अनिश्चित शैली में ‘मित्र’ स्वाभाविक है।
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: उसके प्रति विश्वासयोग्य रहो
  rationale: मध्य/कर्मवाच्य आज्ञार्थक रूप संबंध में अपने को विश्वसनीय और निष्ठावान सिद्ध करने का भाव देता है; हिन्दी में ‘उसके प्रति’ अधिक स्वाभाविक है।
- source_word: ἀποκαλύψῃς τὰ μυστήρια αὐτοῦ
  choice: उसके भेद खोल दोगे
  rationale: संदर्भ में μυστήρια धार्मिक रहस्यों के बजाय गोपनीय बातों को दर्शाता है; ‘भेद खोलना’ सहज हिन्दी मुहावरा है।
- source_word: οὐ μὴ
  choice: निश्चय ही ... न
  rationale: οὐ μή के प्रबल निषेध को स्वाभाविक हिन्दी में जोर के साथ व्यक्त करता है।
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  choice: उसके पीछे न जा सकोगे
  rationale: मूल के पीछा करने के बिंब को बनाए रखते हुए परिणाम का व्यावहारिक अर्थ व्यक्त करता है—भरोसा टूटने पर मित्रता फिर पाना संभव नहीं होगा।
theological_decisions:
- issue: भेद प्रकट करने के बाद अंतिम उपवाक्य का बल
  choice: 'इसे परिणामसूचक कथन के रूप में अनूदित किया गया है: तुम फिर उसके पीछे न जा सकोगे।'
  alternative: 'इसे निषेध भी समझा जा सकता है: फिर उसके पीछे कदापि मत जाना।'
  rationale: द्वितीय पुरुष संभावनार्थक के साथ οὐ μή सामान्यतः जोरदार भविष्यसूचक निषेध देता है, इसलिए परिणाम का अर्थ अधिक संभावित है; फिर भी निषेधात्मक श्रवण संभव होने के कारण उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त नीतिवचनात्मक शैली, आत्मीय पर गरिमापूर्ण शब्दावली। ‘भेद खोलना’ और ‘पीछे जाना’ मूल के चित्रात्मक भाव को सहज हिन्दी में बनाए रखते हैं।
