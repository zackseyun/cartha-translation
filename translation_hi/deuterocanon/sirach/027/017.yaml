review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two imperatives, the disclosure of confidential matters, and the emphatic negative final clause. However, “प्रिय रखो” is not idiomatic modern Hindi for στέργον. “सँजोकर रखो” naturally conveys cherishing/holding a friend dear without narrowing the sense. The result-oriented “न जा सकोगे” is defensible and retains the audit trail’s preferred consequential reading; the alternative prohibitive hearing remains properly footnoted.
  naturalness: “मित्र को प्रिय रखो” is awkward in contemporary standard Hindi. “मित्र को सँजोकर रखो” is fluent, proverbial, and appropriately warm. The remaining syntax and register are clear and natural.
  terminology: “विश्वासयोग्य रहो” appropriately renders πιστώθητι in this relational context. “भेद खोल दोगे” is an idiomatic rendering of revealing confidential matters (τὰ μυστήρια αὐτοῦ). The footnote accurately preserves the less likely prohibitive reading without imposing it on the main text.
  issues:
  - severity: low
    issue: “प्रिय रखो” is an unnatural collocation in modern standard Hindi.
    rationale: Although it aims to render affectionate attachment, Hindi normally uses expressions such as “सँजोकर रखो” for cherishing a valued relationship. This change improves idiom without altering the source sense.
  revised_text: मित्र को सँजोकर रखो और उसके प्रति विश्वासयोग्य रहो; पर यदि तुम उसके भेद खोल दोगे, तो फिर निश्चय ही उसके पीछे न जा सकोगे।[a]
