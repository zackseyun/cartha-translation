translation:
  language: hi
  text: सिंह शिकार के लिए घात लगाए रहता है; उसी तरह पाप अन्याय करनेवालों की घात लगाए रहते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंह शिकार की ताक में रहता है; उसी तरह पाप उन लोगों की ताक में रहते हैं जो अन्यायपूर्ण काम करते हैं।”
    reason: ἐνεδρεύει के लिए ‘घात लगाए रहना’ के स्थान पर ‘ताक में रहना’ भी संभव है; ἄδικα को संक्षेप में ‘अन्याय’ या अधिक स्पष्ट रूप से ‘अन्यायपूर्ण काम’ कहा जा सकता है।
lexical_decisions:
- source_word: λέων
  choice: सिंह
  rationale: अनिश्चित एकवचन यहाँ नीतिवचन में सामान्य सत्य व्यक्त करता है; हिन्दी में बिना किसी निर्धारक के ‘सिंह’ स्वाभाविक है।
- source_word: θήραν
  choice: शिकार
  rationale: यह शब्द उस जीव को सूचित करता है जिसका आखेट किया जाता है; ‘शिकार’ हिन्दी में लक्ष्य और पकड़े जानेवाले जीव—दोनों का स्वाभाविक बोध कराता है।
- source_word: ἐνεδρεύει
  choice: घात में रहता है
  rationale: क्रिया छिपकर अवसर की प्रतीक्षा करने या घात लगाने का चित्र देती है। यह पद सिंह के लिए स्वाभाविक है और दूसरे खंड में निहित क्रिया को भी स्पष्ट रूप से दोहराने देता है।
- source_word: οὕτως
  choice: उसी तरह
  rationale: यह दोनों खंडों के बीच स्पष्ट उपमा-संबंध बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: बहुवचन का सामूहिक हिन्दी रूप ‘पाप’ मूल की सजीव मानवीकरण-छवि को बनाए रखता है; इसे ‘दुष्परिणाम’ या ‘दंड’ बनाकर व्याख्यायित नहीं किया गया।
- source_word: ἐργαζομένους
  choice: करनेवालों
  rationale: वर्तमान कृदंत सक्रिय या निरंतर आचरण में लगे लोगों को दर्शाता है; ‘करनेवालों’ हिन्दी में यह भाव संक्षेप और सहजता से देता है।
- source_word: ἄδικα
  choice: अन्याय
  rationale: नपुंसकलिंग बहुवचन रूप का अर्थ ‘अन्यायपूर्ण काम’ भी हो सकता है; ‘अन्याय करना’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक आशय सुरक्षित रखता है।
theological_decisions:
- issue: ἁμαρτίαι का मानवीकरण
  choice: पापों को घात में बैठे शिकारी के समान प्रस्तुत करना
  alternative: पापों के परिणाम या उनके लिए मिलनेवाले दंड को घात में बैठा मानना
  rationale: यूनानी पाठ सीधे ‘पाप’ कहता है, ‘परिणाम’ या ‘दंड’ नहीं। इसलिए उसके सजीव और तनावपूर्ण मानवीकरण को बिना व्याख्यात्मक विस्तार के रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। समानांतर रचना तथा शिकारी की छवि को स्पष्ट रखने के लिए दूसरे खंड में यूनानी की निहित क्रिया हिन्दी में दोहराई गई है।
