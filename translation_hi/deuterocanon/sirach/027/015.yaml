  yaml_path: translation/deuterocanon/sirach/027/015.yaml
  text: The quarrel of the proud is bloodshed[a], and their reviling is grievous to hear.
translation:
  language: hi
  text: घमंडियों की लड़ाई रक्तपात है[a], और उनकी गाली-गलौज सुनना कष्टदायक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घमंडियों की लड़ाई लहू बहाना है, और उनकी गाली-गलौज एक बुरी खबर है।” यूनानी शब्दों का यह अधिक शाब्दिक अनुवाद भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: रक्तपात
  rationale: शाब्दिक अर्थ ‘लहू बहाना’ है। ‘रक्तपात’ स्वाभाविक और गरिमापूर्ण हिन्दी में हिंसक परिणाम को संक्षेप में व्यक्त करता है।
- source_word: μάχη
  choice: झगड़ा
  rationale: यह शब्द लड़ाई, संघर्ष या झगड़े का अर्थ दे सकता है। इस नीतिवचन-संदर्भ में ‘झगड़ा’ पारस्परिक टकराव का स्वाभाविक हिन्दी रूप है, जबकि रक्तपात का उल्लेख उसकी हिंसक गंभीरता बनाए रखता है।
- source_word: ὑπερηφάνων
  choice: घमंडियों का
  rationale: सम्बन्धकारक बहुवचन उन लोगों को दर्शाता है जिनका चरित्र घमंड या अहंकार से पहचाना जाता है। ‘घमंडी’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: διαλοιδόρησις
  choice: गाली-गलौज
  rationale: यह संज्ञा अपमानजनक और निंदात्मक वाणी को दर्शाती है। ‘गाली-गलौज’ आधुनिक हिन्दी में मौखिक दुर्व्यवहार का बल स्पष्ट रूप से व्यक्त करती है।
- source_word: ἀκοὴ μοχθηρά
  choice: सुनना कष्टदायक है
  rationale: ἀκοή का अर्थ ‘सुनना’ या ‘समाचार/रिपोर्ट’ और μοχθηρά का अर्थ बुरा, पीड़ादायक या निकृष्ट हो सकता है। यहाँ वाणी के समानांतर ‘सुनना कष्टदायक है’ सहज अर्थ देता है, पर वैकल्पिक औपचारिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: घमंडी लोगों के संघर्ष और वाणी का नैतिक चित्रण
  choice: पद को इस नीतिपरक अवलोकन के रूप में प्रस्तुत किया गया है कि घमंडियों का झगड़ा रक्तपात तक पहुँचता है और उनकी अपमानजनक वाणी सुनने वालों को कष्ट देती है।
  alternative: 'अधिक औपचारिक रूप: ‘घमंडियों की लड़ाई रक्तपात है, और उनकी निंदा एक बुरा समाचार है।’'
  rationale: यूनानी पाठ हिंसक कर्म और हानिकारक वाणी के बीच समानांतरता रखता है। मुख्य अनुवाद संदर्भ में सम्भावित अर्थ को स्वाभाविक हिन्दी में देता है, जबकि ἀκοή की ‘समाचार’ वाली सम्भावना को मिटाता नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। ‘रक्तपात’ औपचारिक नैतिक गंभीरता देता है, जबकि ‘झगड़ा’ और ‘गाली-गलौज’ सामान्य पाठकों के लिए तुरंत बोधगम्य हैं।
