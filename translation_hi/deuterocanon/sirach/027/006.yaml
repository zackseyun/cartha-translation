  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: hi
  text: पेड़ की देखभाल उसके फल से प्रकट होती है; वैसे ही मनुष्य के विचार[a] से उसके मन की प्रवृत्ति प्रकट होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ लगभग ‘किसी व्यक्ति की प्रवृत्ति के अनुसार विचार’ है; वाक्यांश का संबंध कुछ अस्पष्ट है। समानांतर यूनानी पाठ में ‘मनुष्य के हृदय के चिंतन की वाणी’ है। दोनों पाठों से यह भाव निकलता है कि व्यक्ति की अभिव्यक्ति उसकी भीतरी प्रवृत्ति को प्रकट करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: पेड़ की देखभाल
  rationale: शाब्दिक अर्थ ‘पेड़ का काम/सेवा’ है, पर कृषि-संदर्भ और यूनानी γεώργιον ξύλου इसकी देखभाल या खेती का भाव समर्थित करते हैं। सामान्य हिन्दी में ‘पेड़ की देखभाल’ सहज और स्पष्ट है।
- source_word: פֶרִי
  choice: फल
  rationale: यह सामान्य कृषि-संज्ञा है और कहावत के प्रत्यक्ष तथा रूपकात्मक दोनों अर्थों को बनाए रखती है।
- source_word: חֶשְׁבּוֹן
  choice: विचार
  rationale: शब्द का अर्थ गणना, मनन या विचार हो सकता है। यहाँ समानांतर यूनानी पाठ भीतर के चिंतन की बाहरी अभिव्यक्ति की ओर संकेत करता है; ‘विचार’ मूल की मानसिक प्रक्रिया को अनावश्यक रूप से ‘वाणी’ में सीमित नहीं करता।
- source_word: יֵצֶר
  choice: मन की प्रवृत्ति
  rationale: यह भीतर की गढ़ी हुई वृत्ति, झुकाव या अभिप्राय का बोध देता है। ‘मन की प्रवृत्ति’ आधुनिक हिन्दी में स्वाभाविक है और बाद की विशिष्ट धर्मसैद्धांतिक धारणाएँ आरोपित नहीं करती।
- source_word: אֶחָד
  choice: मनुष्य का / उसके
  rationale: इब्रानी में शाब्दिक रूप से ‘एक का’ है और वाक्यांश कुछ असहज है। यूनानी में ‘मनुष्य के हृदय’ है। सामान्य व्यक्ति को सूचित करने के लिए ‘मनुष्य का... उसके’ उपयुक्त है।
theological_decisions:
- issue: मानव-स्वभाव और लिंग-सूचक भाषा
  choice: मनुष्य का... उसके मन की
  alternative: पुरुष का... उसके हृदय की
  rationale: इब्रानी אֶחָד ‘एक/व्यक्ति’ और यूनानी ἀνθρώπου सामान्य मानव का संकेत देते हैं। ‘मनुष्य’ प्रतिनिधिक और लिंग-समावेशी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: חֶשְׁבּוֹן को भीतर का विचार या बाहर की वाणी मानना
  choice: विचार
  alternative: वाणी / कथन
  rationale: इब्रानी ‘गणना/विचार’ का भाव रखता है, जबकि यूनानी λόγος बाहरी कथन का संकेत दे सकता है। मुख्य पाठ में इब्रानी को प्राथमिकता दी गई है और पादटिप्पणी में यूनानी साक्ष्य तथा निहित बाहरी अभिव्यक्ति स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कहावती स्वर रखा गया है। ‘हृदय’ की अपेक्षा ‘मन’ सामान्य पाठक के लिए अधिक स्वाभाविक है और यहाँ आंतरिक विचार-वृत्ति का आशय स्पष्ट करता है।
