base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/005.yaml
  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
translation:
  language: hi
  text: 'कुम्हार के बरतनों को भट्ठी परखती है,

    और उसी प्रकार मनुष्य को उसका सोच-विचार[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विचारों से” अथवा “उसके मनन में”; यूनानी समानांतर पाठ में “उसके मनन में” है।
    reason: इब्रानी חֶשְׁבּוֹן विचार, विवेचन या गणना को सूचित कर सकता है, और यूनानी पाठ स्थानवाचक अभिव्यक्ति देता है।
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: कुम्हार के बरतन
  rationale: रचना-संबंधी इब्रानी पदबंध का स्वाभाविक हिन्दी रूप; इससे कुम्हार और उसके बनाए पात्रों का ठोस बिंब बना रहता है।
- source_word: לְבָעֵר כִּבְשָׁן
  choice: भट्ठी परखती है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ कठिन है, जबकि यूनानी समानांतर स्पष्ट रूप से कहता है कि भट्ठी कुम्हार के पात्रों को परखती है। यह रूप दोनों पाठ-साक्ष्यों और प्रसंग में निहित गुणवत्ता-जाँच के भाव को व्यक्त करता है।
- source_word: וְכָמֹהוּ
  choice: और उसी प्रकार
  rationale: यह पहले और दूसरे चरण के बीच उपमा-संबंध को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक मानवीय अर्थ है। हिन्दी का ‘मनुष्य’ स्रोत की एकवचन संरचना और सामान्य मानवीय संदर्भ—दोनों को बनाए रखता है।
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: उसका सोच-विचार
  rationale: חֶשְׁבּוֹן में विचार, गणना और विवेचन की अर्थ-छायाएँ हैं; यूनानी διαλογισμός भी मनन या विचार-विमर्श की ओर संकेत करता है। ‘सोच-विचार’ साधारण आधुनिक हिन्दी में इस व्यापकता को बनाए रखता है और ‘हिसाब’ जैसे भ्रामक अर्थ से बचता है।
theological_decisions:
- issue: मानव-संबंधी लिंग और प्रतिनिधिक प्रयोग
  choice: मनुष्य
  alternative: पुरुष / व्यक्ति
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है, किन्तु इस ज्ञानोक्ति में सामान्य मानव का प्रतिनिधित्व करता है। ‘मनुष्य’ स्रोत के मानवीय और एकवचन भाव को बिना अनावश्यक रूप से केवल वयस्क पुरुष तक सीमित किए व्यक्त करता है।
- issue: मनुष्य की परख और उसके विचार का संबंध
  choice: उपमा की संक्षिप्तता बनाए रखते हुए ‘मनुष्य को उसका सोच-विचार’
  alternative: मनुष्य की परख उसके सोच-विचार से होती है
  rationale: इब्रानी में दूसरे चरण की क्रिया लुप्त है और पहले चरण से समझी जाती है। चुना हुआ रूप उस काव्यात्मक लोप और इस संभावित अर्थ को बनाए रखता है कि मनुष्य का विचार-विवेक उसे प्रकट भी करता है और परखता भी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञानोक्ति-शैली रखी गई है। ‘बरतन’ और ‘सोच-विचार’ सामान्य पाठक के लिए सहज हैं; पंक्ति-विभाजन मूल के दो समानांतर चरणों को दिखाता है।
