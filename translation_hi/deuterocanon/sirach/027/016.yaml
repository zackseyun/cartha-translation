  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: hi
  text: जो गुप्त बातें[a] प्रकट करता है, वह भरोसा नष्ट कर देता है और अपने प्राण के लिए कभी कोई मित्र नहीं पाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गुप्त बातें’ के लिए ‘रहस्य’ या ‘भरोसे में कही गई बातें’ भी सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने प्राण के लिए’; अर्थात् ऐसा मित्र जो उसके अंतरतम के निकट हो या उसके अपने व्यक्तित्व के अनुकूल हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: जो ... प्रकट करता है
  rationale: संज्ञार्थक वर्तमान कृदन्त सामान्य, लोकोक्तिपरक कथन करता है; यह हिन्दी में स्वाभाविक रूप से उस चरित्रगत आचरण को व्यक्त करता है।
- source_word: μυστήρια
  choice: गुप्त बातें
  rationale: यहाँ प्रसंग निजी और भरोसे में कही गई बातों का है, न कि आवश्यक रूप से धर्मवैज्ञानिक रहस्यों का।
- source_word: ἀπώλεσεν πίστιν
  choice: विश्वास खो देता है
  rationale: इस मैत्री-संबंधी प्रसंग में πίστις का अर्थ पारस्परिक भरोसा है। ἀπόλλυμι का सकर्मक रूप शाब्दिक रूप से 'विश्वास नष्ट कर दिया' भी हो सकता है; हिन्दी मुहावरे में 'विश्वास खो देता है' विश्वासघाती व्यक्ति के परिणाम को सहजता से व्यक्त करता है।
- source_word: οὐ μὴ εὕρῃ
  choice: कभी ... नहीं पाएगा
  rationale: οὐ μή और विधिलिंग भविष्य के विषय में प्रबल निषेध व्यक्त करते हैं; 'कभी नहीं पाएगा' उसका बल बनाए रखता है।
- source_word: φίλον
  choice: कोई मित्र
  rationale: प्रबल निषेध के साथ अनिश्चित एकवचन का स्वाभाविक हिन्दी रूप 'कोई मित्र' है।
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  choice: अपने प्राण के लिए
  rationale: यह कुछ असामान्य यूनानी अभिव्यक्ति स्रोत के ψυχή-बिंब को सुरक्षित रखती है और ऐसे मित्र की ओर संकेत करती है जो व्यक्ति के अंतरतम से निकट या उसके अनुकूल हो।
theological_decisions:
- issue: गैर-धर्मवैज्ञानिक ज्ञान-साहित्य के प्रसंग में πίστις
  choice: विश्वास
  alternative: आस्था; भरोसा; विश्वसनीयता
  rationale: हिन्दी में 'विश्वास' पारस्परिक भरोसे को स्वाभाविक रूप से व्यक्त करता है; इस प्रसंग में इसे सिद्धान्तगत 'आस्था' बनाना अनुचित होगा।
- issue: ἀπώλεσεν πίστιν का संबंधगत अर्थ
  choice: विश्वास खो देता है
  alternative: विश्वास नष्ट कर देता है
  rationale: यूनानी में कर्म πίστιν है और 'नष्ट कर देता है' अधिक रूपगत है, पर सन्दर्भ बताता है कि रहस्य खोलने वाला दूसरों का विश्वास गँवा बैठता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- issue: πρὸς τὴν ψυχὴν αὐτοῦ की अस्पष्टता
  choice: अपने प्राण के लिए
  alternative: अपने अंतरतम का निकट मित्र; अपने अनुकूल मित्र
  rationale: मुख्य पाठ मूल का आत्मा/प्राण-बिंब और उसकी वास्तविक अस्पष्टता बनाए रखता है; पादटिप्पणी संभावित मुहावरेदार आशय बताती है, उसे पाठ में निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण लोकोक्तिपरक शैली में है। ‘प्राण’ मूल के ψυχή-बिंब को बनाए रखने के लिए जानबूझकर कुछ औपचारिक रखा गया है; उसका आशय पादटिप्पणी में स्पष्ट है।
