  yaml_path: translation/deuterocanon/sirach/027/013.yaml
  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
translation:
  language: hi
  text: मूर्खों की बातचीत खीझ दिलाती है[a], और उनकी हँसी पापमय भोग-विलास में होती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्खों की बातचीत झुँझलाहट का कारण है।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी हँसी पापपूर्ण उच्छृंखल मौज-मस्ती में होती है”; σπατάλη आत्मलिप्त अति, ऐश-विलास या उच्छृंखल जीवन का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: बातचीत
  rationale: यह संज्ञा वर्णन, कथन या बातचीत को सूचित कर सकती है। यहाँ मूर्खों की सामान्य बोलचाल के लिए ‘बातचीत’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: μωρῶν
  choice: मूर्खों की
  rationale: यह संबंधकारक बहुवचन है और वक्ताओं की पहचान करता है। ‘मूर्ख’ ज्ञान-साहित्य की नैतिक और बौद्धिक धार को बनाए रखता है।
- source_word: προσόχθισμα
  choice: खीझ दिलाती है
  rationale: यह ऐसी वस्तु या बात को दर्शाता है जो अप्रसन्नता, झुँझलाहट या खीझ उत्पन्न करे। हिंदी में यह प्रयोग संज्ञात्मक यूनानी अभिव्यक्ति का स्वाभाविक अर्थ देता है।
- source_word: γέλως
  choice: हँसी
  rationale: मूल अर्थ ‘हँसी’ है। प्रसंग में अनुचित मौज-मस्ती निहित हो सकती है, पर ‘उपहास’ कहना मूल से अधिक विशिष्ट होगा।
- source_word: ἐν
  choice: में होती है
  rationale: पूर्वसर्ग क्षेत्र या परिवेश को दर्शाता है; यह रूप इस अस्पष्टता को बनाए रखता है कि उनकी हँसी ऐसे भोग-विलास के भीतर घटती है या उसी से जुड़ी है।
- source_word: σπατάλῃ
  choice: भोग-विलास
  rationale: शब्द आत्मलिप्त ऐश, अपव्ययी मौज या उच्छृंखल भोग का भाव रखता है। ‘भोग-विलास’ सामान्य हिंदी में उस अति और नैतिक नकारात्मकता को संप्रेषित करता है।
- source_word: ἁμαρτίας
  choice: पापमय
  rationale: संबंधकारक संज्ञा भोग-विलास के स्वरूप को पाप से जोड़ती है। विशेषणात्मक हिंदी रूप अर्थ को स्पष्ट और सहज रखता है, बिना नैतिक बल घटाए।
theological_decisions:
- issue: ज्ञान-साहित्य की नैतिक शब्दावली
  choice: μωρῶν के लिए ‘मूर्खों’ और ἁμαρτίας के लिए ‘पापमय’
  alternative: ‘नासमझ लोगों’ और ‘गलत आचरण वाला’
  rationale: मूल पाठ नैतिक रूप से तीखी श्रेणियाँ प्रयुक्त करता है। नरम विकल्प पद की नैतिक गंभीरता को अनावश्यक रूप से घटा देंगे।
- issue: हँसी और पापमय भोग-विलास का संबंध
  choice: ‘में होती है’ द्वारा क्षेत्र या परिवेश का संबंध खुला रखा
  alternative: ‘पापमय भोग-विलास से पैदा होती है’ या ‘उसी में होती है’
  rationale: ἐν कारण, पहचान या विशिष्ट अनन्यता को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अनुवाद मूल की संबंधगत अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘भोग-विलास’ में अति और आत्मलिप्तता का नकारात्मक भाव है, जबकि पादटिप्पणी अधिक उच्छृंखल अर्थ की संभावना सुरक्षित रखती है।
