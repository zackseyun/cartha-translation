  yaml_path: translation/deuterocanon/sirach/027/002.yaml
  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
translation:
  language: hi
  text: पत्थरों के जोड़ों के बीच एक खूँटी ठोंक दी जाएगी[a], और बेचने और खरीदने के बीच पाप कुचला जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृढ़ता से जमा दी जाएगी’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का सीधा अर्थ ‘कुचला जाएगा’ है। पहले बिंब की समानांतरता के कारण इसे ‘दबकर फँस जाएगा’ के अर्थ में भी समझा जा सकता है।
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: के बीच
  rationale: दोनों खंडों में दोहराया गया यह पदबंध बीच की स्थिति बताता है; हिन्दी में ‘के बीच’ स्वाभाविक है और यूनानी समानांतरता बनाए रखता है।
- source_word: ἁρμῶν λίθων
  choice: पत्थरों के जोड़ों
  rationale: ἁρμός जुड़ने की जगह या जोड़ को दर्शाता है। पत्थर की चिनाई के संदर्भ में ‘जोड़’ सटीक है और ‘दरार’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: παγήσεται
  choice: गाड़ दी जाएगी
  rationale: πήγνυμι का यह भविष्यत् कर्मवाच्य रूप किसी वस्तु को दृढ़ता से जमा देने या गाड़ने का भाव देता है। ‘गाड़ दी जाएगी’ खूँटी के ठोस बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: πάσσαλος
  choice: खूँटी
  rationale: यह शब्द खूँटे, कीलनुमा खूँटी या दाँव को दर्शा सकता है। पत्थरों के जोड़ों में जमाई जाने वाली वस्तु के लिए ‘खूँटी’ उपयुक्त और सामान्य पाठक के लिए स्पष्ट है।
- source_word: πράσεως
  choice: बेचने
  rationale: यह बेचने की क्रिया को दर्शाता है। क्रियार्थक संज्ञा के रूप में ‘बेचने’ अगले शब्द ‘खरीदने’ के साथ स्वाभाविक जोड़ी बनाता है।
- source_word: ἀγορασμοῦ
  choice: खरीदने
  rationale: यह खरीद या खरीदने की क्रिया को दर्शाता है। ‘बेचने और खरीदने’ से मूल का व्यापारिक विरोध और संक्षिप्त लोकोक्तिपरक रूप बना रहता है।
- source_word: συντριβήσεται
  choice: कुचला जाएगा
  rationale: συντρίβω का सामान्य अर्थ तोड़ना, चूर करना या कुचलना है। संदर्भ में ‘फँस जाएगा’ आकर्षक व्याख्या हो सकती है, पर वह मूल क्रिया की कठोरता और वास्तविक भाषिक तनाव को दबा देती है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: यह नैतिक अपराध या पाप का मानक शब्द है। ‘पाप’ व्यापारिक अनुचितता तक अर्थ को सीमित किए बिना मूल की नैतिक और धार्मिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: व्यापारिक कहावत में ἁμαρτία का नैतिक बल
  choice: पाप
  alternative: व्यापार में गलत काम
  rationale: मूल शब्द व्यापक नैतिक विफलता बताता है। ‘पाप’ उसके धार्मिक-नैतिक बल को बनाए रखता है और उसे केवल बेईमान व्यापार तक सीमित नहीं करता।
- issue: συντριβήσεται और खूँटी के बिंब का संबंध
  choice: कुचला जाएगा
  alternative: फँस जाएगा / दबकर अटक जाएगा
  rationale: यूनानी क्रिया का प्रत्यक्ष अर्थ ‘कुचला/तोड़ा जाएगा’ है, यद्यपि समानांतर बिंब के कारण कुछ अनुवाद इसे बीच में फँसने के अर्थ में समझते हैं। मुख्य पाठ में प्रत्यक्ष अर्थ रखकर और पादटिप्पणी में संदर्भगत विकल्प देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सदृश रखी गई है। ‘खूँटी’, ‘जोड़’, ‘बेचना’ और ‘खरीदना’ सामान्य पाठकों के लिए सहज हैं। दूसरे खंड के असामान्य कर्मवाच्य बिंब को सरल व्याख्या से बदलने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
