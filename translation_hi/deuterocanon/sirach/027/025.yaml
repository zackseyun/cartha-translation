lexical_decisions:
- source_word: ὁ βάλλων λίθον εἰς ὕψος
  choice: जो पत्थर ऊपर की ओर फेंकता है
  rationale: यूनानी कृदन्तीय वाक्यांश और εἰς ὕψος की दिशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ κεφαλὴν αὐτοῦ βάλλει
  choice: वह उसे अपने ही सिर पर फेंकता है
  rationale: कर्म के स्वयं कर्ता पर लौटने की चेतावनी को स्पष्ट रखता है; ‘ही’ αὐτοῦ के आत्म-संबंधी बल को स्वाभाविक ढंग से उभारता है।
- source_word: πληγὴ δολία
  choice: कपटपूर्ण प्रहार
  rationale: πληγή को यहाँ ‘प्रहार’ और δολία को विश्वासघाती या छली स्वभाव सूचित करने वाले ‘कपटपूर्ण’ से व्यक्त किया गया है।
- source_word: διελεῖ τραύματα
  choice: घाव खोल देगा
  rationale: διελεῖ का मूल भाव अलग करने या चीरने का है; घावों के संदर्भ में ‘खोल देगा’ अर्थ को सहज रखता है और यूनानी भविष्यकाल भी बचाता है।
