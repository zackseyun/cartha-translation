translation:
  language: hi
  text: जो धर्मपरायणों के पतन पर आनन्द मनाते हैं, वे फंदे में पकड़े जाएँगे, और पीड़ा उनकी मृत्यु से पहले उन्हें निगल जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παγίδι
  choice: फंदे में
  rationale: दत्तिव एकवचन पकड़ने के साधन या परिस्थिति को दर्शाता है। ‘फंदे में’ आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: ἁλώσονται
  choice: पकड़े जाएँगे
  rationale: भविष्यत् कर्मवाच्य रूप का अर्थ ‘पकड़े जाना’ है; यह फंदे के बिंब के साथ सहज बैठता है।
- source_word: οἱ εὐφραινόμενοι
  choice: जो ... आनन्द मनाते हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त लगातार या विशेषतापूर्ण हर्ष लेने वालों को सूचित करता है।
- source_word: πτώσει
  choice: पतन पर
  rationale: πτῶσις का सीधा अर्थ ‘गिरना’ या ‘पतन’ है; यहाँ ‘पतन’ किसी की दुर्दशा या विनाश पर प्रसन्न होने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὐσεβῶν
  choice: भक्तों
  rationale: εὐσεβής नैतिक-धार्मिक श्रद्धा और भक्ति रखने वालों को दर्शाता है। ‘भक्त’ सरल और गरिमापूर्ण है तथा किसी संकीर्ण पारिभाषिक श्रेणी को आरोपित नहीं करता।
- source_word: ὀδύνη
  choice: पीड़ा
  rationale: यह शब्द शारीरिक दर्द या गहरी मानसिक व्यथा दोनों का संकेत दे सकता है; ‘पीड़ा’ इस व्यापकता को सुरक्षित रखता है।
- source_word: καταναλώσει
  choice: खा जाएगी
  rationale: क्रिया का अर्थ पूरी तरह खपा देना या निगल जाना है। ‘खा जाएगी’ हिन्दी में सजीव उपमा को बनाए रखते हुए पीड़ा की विनाशकारी शक्ति व्यक्त करता है।
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: उनकी मृत्यु से पहले ही
  rationale: मूल कालवाचक वाक्यांश का निकट और स्वाभाविक अनुवाद है; ‘ही’ इस बात को स्पष्ट करता है कि पीड़ा मृत्यु आने की प्रतीक्षा नहीं करेगी।
theological_decisions:
- issue: εὐσεβῶν का नैतिक-धार्मिक अर्थ
  choice: भक्तों
  alternative: धर्मपरायणों / श्रद्धालुओं
  rationale: ‘भक्तों’ से परमेश्वर के प्रति श्रद्धा रखने वाले लोगों का अर्थ सामान्य पाठक को सहज मिलता है। ‘धर्मपरायण’ अधिक औपचारिक है और ‘श्रद्धालु’ अपेक्षाकृत हल्का पड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त ज्ञान-साहित्य शैली और चेतावनी की गरिमा। मूल की दो भविष्यत् क्रियाओं तथा फंदे और खा जाने के सशक्त बिंबों को बनाए रखा गया है।
