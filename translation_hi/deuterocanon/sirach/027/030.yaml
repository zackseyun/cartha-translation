base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/030.yaml
  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: hi
  text: मन में पाला हुआ रोष और क्रोध[a]—ये घृणित बातें हैं, और पापी मनुष्य इन्हें पकड़े रहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिशोधपूर्ण रोष और क्रोध।” Μῆνις गहरे और लंबे समय तक बने रहनेवाले, कभी-कभी प्रतिशोधपूर्ण क्रोध को सूचित कर सकता है, जबकि ὀργή क्रोध के लिए अधिक सामान्य शब्द है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति कठिन है। ἐγκρατής का सामान्य अर्थ आत्मसंयमी या नियंत्रण रखनेवाला हो सकता है; अतः एक वैकल्पिक समझ “वह इन पर नियंत्रण रखनेवाला होगा” है। यहाँ संदर्भ के अनुसार इसका अर्थ इन बुराइयों को न छोड़ना, बल्कि पकड़े रहना समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: मन में पाला हुआ रोष
  rationale: यह शब्द गहरे, लंबे समय तक बने रहनेवाले और कभी-कभी प्रतिशोधपूर्ण क्रोध को सूचित कर सकता है। यह रूप ὀργή से उसका अंतर स्पष्ट करता है।
- source_word: ὀργή
  choice: क्रोध
  rationale: यह क्रोध के लिए सामान्य शब्द है; आधुनिक हिन्दी में ‘क्रोध’ स्वाभाविक और गरिमापूर्ण है।
- source_word: βδελύγματα
  choice: घृणित बातें
  rationale: बहुवचन संज्ञा उन बातों को दर्शाती है जिन्हें नैतिक या धार्मिक रूप से अत्यंत घिनौना माना जाता है। ‘घृणित बातें’ अर्थ की गंभीरता बनाए रखते हुए स्वाभाविक हिन्दी देती है।
- source_word: ἀνὴρ ἁμαρτωλὸς
  choice: पापी मनुष्य
  rationale: ἀνήρ पुल्लिंग एकवचन है और ἁμαρτωλός उसका विशेषण है। ‘पापी मनुष्य’ मूल की व्याकरणिक बनावट और लिंग को बनाए रखता है।
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: इन्हें पकड़े रहेगा
  rationale: ἐγκρατής के साथ संबंधकारक αὐτῶν का प्रयोग कठिन है। नकारात्मक संदर्भ में इसे इन बुराइयों पर पकड़ बनाए रखने, अर्थात उन्हें न छोड़ने, के अर्थ में लिया गया है; पादटिप्पणी शाब्दिक और वैकल्पिक संभावना सुरक्षित रखती है।
theological_decisions:
- issue: ἀνὴρ का मानव-संबंधी और लिंग-संबंधी अनुवाद
  choice: पापी मनुष्य
  alternative: पापी व्यक्ति
  rationale: मूल में संज्ञा स्पष्ट रूप से पुल्लिंग एकवचन है। सम्भव है कि कथन सामान्य मानवीय व्यवहार का वर्णन करता हो, फिर भी अनुवाद ने स्रोत का व्याकरणिक लिंग नहीं मिटाया।
- issue: नकारात्मक नैतिक संदर्भ में ἐγκρατής का अर्थ
  choice: इन्हें पकड़े रहेगा
  alternative: इन पर नियंत्रण रखनेवाला होगा
  rationale: सामान्यतः ἐγκρατής आत्मसंयम या नियंत्रण का भाव दे सकता है, पर यहाँ रोष और क्रोध की निन्दा के संदर्भ में अर्थ सम्भवतः इन बुराइयों को दृढ़ता से थामे रहने का है। कठिनाई को चुपचाप सुलझाने के बजाय पादटिप्पणी में दूसरा सम्भव अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘मन में पाला हुआ रोष’ स्थायी आक्रोश को सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘पकड़े रहेगा’ कठिन यूनानी अभिव्यक्ति का स्वाभाविक किन्तु अत्यधिक व्याख्यात्मक नहीं हुआ रूप है।
