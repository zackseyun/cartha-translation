  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
translation:
  language: hi
  text: धर्मपरायण व्यक्ति की बात सदा बुद्धि से भरी होती है,[a] पर मूर्ख चाँद की तरह बदलता रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मपरायण व्यक्ति की वाणी हर समय बुद्धि से भरी होती है।”
    reason: lexical_alternative
  - marker: b
    text: 'चाँद से यह तुलना सम्भवतः उसकी बदलती कलाओं की ओर संकेत करती है: मूर्ख अस्थिर या चंचल होता है।'
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: बातचीत
  rationale: यह संज्ञा वर्णन, कथन या वार्तालाप को सूचित कर सकती है। इस नीतिवचन में ‘बातचीत’ व्यक्ति की कही जाने वाली बातों के सामान्य और निरंतर स्वरूप को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: εὐσεβοῦς
  choice: भक्त जन की
  rationale: सम्बन्धकारक एकवचन यहाँ संज्ञा के रूप में प्रयुक्त है—‘भक्त/धर्मपरायण व्यक्ति का’। ‘भक्त जन’ धार्मिक निष्ठा का भाव गरिमापूर्ण और सहज आधुनिक हिन्दी में रखता है।
- source_word: διὰ παντός
  choice: सदा
  rationale: यूनानी मुहावरे का अर्थ ‘हर समय’ या ‘निरंतर’ है; ‘सदा’ संक्षिप्त और नीतिवचन की शैली के अनुकूल है।
- source_word: σοφία
  choice: बुद्धि
  rationale: मूल में भाववाचक संज्ञा है। ‘बुद्धि’ उसे विशेषण बनाकर व्याख्यायित किए बिना नीतिवचन की संक्षिप्त शक्ति बनाए रखती है।
- source_word: ἄφρων
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह समझ-बूझ से रहित व्यक्ति के लिए मानक शब्द है; ‘मूर्ख’ इसका सीधा और परिचित हिन्दी समतुल्य है।
- source_word: ἀλλοιοῦται
  choice: बदलता रहता है
  rationale: क्रिया बदलने या भिन्न हो जाने को दर्शाती है। ‘बदलता रहता है’ यहाँ अस्थिरता और बार-बार परिवर्तन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς σελήνη
  choice: चाँद की तरह
  rationale: स्पष्ट उपमा को सहज आधुनिक हिन्दी में रखा गया है; सम्भवतः संकेत चाँद की बदलती कलाओं की ओर है।
