base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/001.yaml
  text: For the sake of gain many have sinned[b][a], and whoever seeks to increase it will turn away his eye.
translation:
  language: hi
  text: लाभ[a] के लिए बहुत-से लोगों ने पाप किया है, और जो उसे बढ़ाने का प्रयास करता है, वह अपनी आँख फेर लेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुनाफ़े के लिए।” यहाँ यूनानी शब्द का आशय संभवतः भौतिक फ़ायदे या लाभ से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह जान-बूझकर आँख फेर लेगा—यह मुहावरा नैतिक समझौता करने या उस बात को अनदेखा करने का संकेत दे सकता है जिसे देखना चाहिए। यूनानी पाठ यह नहीं बताता कि आँख किससे फेरी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: लाभ के लिए
  rationale: χάριν संबंधकारक के साथ कारण या उद्देश्य बताता है। इस नीतिवचन-सदृश संदर्भ में ἀδιαφόρου का आशय भौतिक लाभ या मुनाफ़े से है, विशेषकर अगली पंक्ति में उसे बढ़ाने की इच्छा के कारण।
- source_word: πολλοὶ ἥμαρτον
  choice: बहुतों ने पाप किया है
  rationale: यह सामान्य मानवीय आचरण पर नीतिवचनात्मक कथन है; हिन्दी का पूर्ण वर्तमान उसके सतत प्रासंगिक अनुभव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ζητῶν πληθῦναι
  choice: जो उसे बढ़ाने की कोशिश करता है
  rationale: संज्ञार्थक कृदन्त को सामान्य व्यक्ति के रूप में व्यक्त किया गया है। यूनानी में πληθῦναι का कर्म अनुक्त है; संदर्भ से वह पूर्वोक्त लाभ है, इसलिए 'उसे' जोड़ना हिन्दी में आवश्यक स्पष्टता देता है।
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: वह अपनी आँख फेर लेगा
  rationale: यह अनुवाद यूनानी की एकवचन शारीरिक छवि और उसकी नैतिक अस्पष्टता दोनों बनाए रखता है; पाठ यह नहीं बताता कि आँख किससे फेरी जाती है।
theological_decisions:
- issue: अंतिम उपवाक्य का नैतिक आशय
  choice: आँख फेरने की मूल छवि को मुख्य पाठ में बनाए रखा गया है।
  alternative: वह गलत काम को अनदेखा करेगा / वह अपनी आँखें मूँद लेगा
  rationale: यूनानी पाठ उस वस्तु या बात को निर्दिष्ट नहीं करता जिससे आँख फेरी जाती है। अधिक स्पष्ट व्याख्या नैतिक समझौते का संभावित आशय तो बताएगी, पर स्रोत से अधिक विशिष्ट आरोप जोड़ देगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचनात्मक शैली रखी गई है। 'लाभ' सामान्य पाठक के लिए स्पष्ट है, जबकि 'आँख फेर लेना' स्रोत की छवि और अंतर्निहित नैतिक तनाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
