base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/021.yaml
  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
translation:
  language: hi
  text: क्योंकि घाव पर पट्टी बाँधी जा सकती है, और अपमान के बाद मेल-मिलाप हो सकता है; पर जिसने रहस्य प्रकट किए हैं, उसने आशा छोड़ दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह निराश हो गया है” अथवा “उसके लिए कोई आशा नहीं रही।” यूनानी पाठ यह नहीं बताता कि किस बात की आशा जाती रही; संदर्भ में संभवतः विश्वासघात के बाद भरोसा फिर बहाल होने की आशा अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τραῦμά
  choice: घाव
  rationale: यह ठोस शारीरिक चोट का बिंब बनाए रखता है और अगले संबंधपरक नुकसान के साथ मूल विरोध को स्पष्ट करता है।
- source_word: καταδῆσαι
  choice: पट्टी बाँधी जा सकती है
  rationale: क्रिया घाव को बाँधने या पट्टी करने को व्यक्त करती है; यह हिन्दी में मूल की संभाव्यता और अवैयक्तिक रचना को स्वाभाविक ढंग से रखता है।
- source_word: λοιδορίας
  choice: अपमान
  rationale: यह गाली-गलौज, निंदा या अपमानजनक वाणी का सहज आधुनिक हिन्दी रूप है।
- source_word: διαλλαγή
  choice: मेल-मिलाप
  rationale: यह विवाद के बाद संबंधों की बहाली को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἀποκαλύψας
  choice: जिसने ... प्रकट किए हैं
  rationale: यह रहस्यों को खोल देने की पूरी हो चुकी क्रिया और उसके वर्तमान परिणाम को सुरक्षित रखता है।
- source_word: μυστήρια
  choice: रहस्य
  rationale: इस ज्ञान-साहित्यिक संदर्भ में शब्द गोपनीय बातों को सूचित करता है; ‘रहस्य’ सीधा और स्वाभाविक है।
- source_word: ἀφήλπισεν
  choice: उसने आशा छोड़ दी है
  rationale: यह आशा त्यागने या निराश हो जाने का अर्थ देता है और मूल की तरह यह अनकहा छोड़ता है कि आशा किस बात की है।
theological_decisions:
- issue: अंतिम वाक्यांश ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν का आशय
  choice: रहस्य प्रकट करने वाले ने आशा छोड़ दी है; आशा का विषय मुख्य पाठ में अनिर्दिष्ट रखा गया है।
  alternative: वह स्वयं निराश हो गया है; अथवा उसके लिए कोई आशा नहीं रही।
  rationale: संदर्भ संभवतः टूटे विश्वास या संबंध के फिर बहाल होने की आशा की ओर संकेत करता है, पर यूनानी पाठ इसका कर्म नहीं बताता। इसलिए मुख्य पाठ उस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘मेल-मिलाप’ सामान्य पाठक के लिए सहज है, और अंतिम खंड में मूल की अर्थगत अनिश्चितता जानबूझकर सुरक्षित रखी गई है।
