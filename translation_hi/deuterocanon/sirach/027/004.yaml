translation:
  language: hi
  text: छलनी को झकझोरने पर मैल बचा रह जाता है; उसी तरह मनुष्य की गंदगी उसके विचारों में प्रकट होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: छलनी को झकझोरने पर
  rationale: पूर्वसर्गीय पदबंध को स्वाभाविक हिन्दी में कालगत अर्थ देकर छानने की क्रिया का जीवंत बिंब रखा गया है।
- source_word: διαμενεῖ κοπρία
  choice: मैल बचा रह जाता है
  rationale: διαμενεῖ का स्थायी अर्थ ‘बचा रहना’ है। κοπρία मूलतः गोबर, खाद या गंदा अवशेष हो सकता है; यहाँ छलनी में रह जाने वाले अनुपयोगी मैल के अर्थ में लिया गया है।
- source_word: οὕτως
  choice: उसी तरह
  rationale: पहले बिंब और उसके मानवीय अनुप्रयोग के बीच स्पष्ट तुलनात्मक संबंध व्यक्त करता है।
- source_word: σκύβαλα ἀνθρώπου
  choice: मनुष्य की गंदगी
  rationale: σκύβαλα कूड़ा, मल अथवा निकृष्ट अपशिष्ट को सूचित करता है। ‘गंदगी’ उसकी कठोरता और रूपकात्मक नैतिक संकेत दोनों बनाए रखती है; ἀνθρώπου को प्रतिनिधिक अर्थ में ‘मनुष्य’ कहा गया है।
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: उसके विचार-विमर्श में
  rationale: λογισμός केवल आकस्मिक ‘विचार’ नहीं, सोचने, तर्क करने या परखने की प्रक्रिया भी दर्शा सकता है। ‘विचार-विमर्श’ इस अर्थगत विस्तार और मूल की अस्पष्टता को पर्याप्त रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ἀνθρώπου का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: मनुष्य की
  alternative: किसी व्यक्ति की
  rationale: ‘मनुष्य’ आधुनिक हिन्दी में जातिवाचक और प्रतिनिधिक रूप से स्वाभाविक है तथा यूनानी एकवचन को बनाए रखता है, बिना कथन को केवल पुरुषों तक सीमित किए।
- issue: σκύβαλα का नैतिक अथवा भौतिक अर्थ
  choice: गंदगी
  alternative: कूड़ा / मल
  rationale: पद का अपशिष्ट या मल संबंधी कठोर बिंब रखा गया है, पर पाठ में नैतिक अर्थ स्पष्ट रूप से जोड़कर मूल की रूपकात्मक तनावशीलता को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कहावत-जैसी और गरिमापूर्ण शैली। ‘मैल’ छलनी के बिंब को और ‘गंदगी’ व्यक्ति पर लागू उसके कठोर समानांतर को बनाए रखते हैं।
