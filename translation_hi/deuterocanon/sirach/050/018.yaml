base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/018.yaml
  text: And the song gave forth its voice[a], and over the multitude they set his lamp in order.
translation:
  language: hi
  text: और गीत ने अपना स्वर उठाया[a], और जनसमूह के ऊपर उन्होंने उसका दीपक व्यवस्थित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “भजन गानेवालों ने अपने स्वरों से स्तुति की; और खचाखच भरे भवन में धुन मधुर हो गई।” इससे संकेत मिलता है कि इब्रानी का दूसरा चरण पाठगत रूप से कठिन है या किसी भिन्न पाठ-परम्परा में सुरक्षित हुआ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: गीत ने अपनी आवाज़ उठाई
  rationale: נתן के साथ קול आवाज़ निकालने या उठाने का मुहावरा है। यह अनुवाद इब्रानी के व्यक्तिकरण और संगीतमय भाव—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֲמּוֹן
  choice: जनसमूह
  rationale: המון का अर्थ भीड़ या जनसमूह है। मन्दिर के सामूहिक उपासना-दृश्य में ‘जनसमूह’ सहज और गरिमापूर्ण है।
- source_word: וְעַל
  choice: के ऊपर
  rationale: पूर्वसर्ग का मूल स्थानिक अर्थ ‘पर/ऊपर’ है। कठिन पाठ में अर्थ को अनावश्यक रूप से निश्चित करने के बजाय स्थानिक बिम्ब सुरक्षित रखा गया है।
- source_word: הֶעֱרִיכוּ
  choice: उन्होंने ... सजाया
  rationale: हिफ़ील रूप का अर्थ व्यवस्थित करना, क्रम से लगाना या तैयार करना है। दीपक के साथ ‘सजाया’ हिन्दी में स्वाभाविक है और विधिपूर्वक व्यवस्थित करने का भाव रखता है।
- source_word: נֵרוֹ
  choice: उसका दीपक
  rationale: נר का सामान्य अर्थ ‘दीपक’ है और प्रत्यय पुल्लिंग एकवचन है। उसका संकेत किस व्यक्ति या पूर्ववर्ती विषय की ओर है, यह अनिश्चित है; ‘उसका’ इस अनिश्चितता को बनाए रखता है।
theological_decisions:
- issue: कठिन दूसरे चरण में इब्रानी और यूनानी पाठों का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का सीधा अनुवाद रखा गया है और यूनानी समानांतर पाठ को पादटिप्पणी में दिया गया है।
  alternative: 'मुख्य पाठ यूनानी के अनुसार हो सकता था: “भजन गानेवालों ने अपने स्वरों से स्तुति की; और खचाखच भरे भवन में धुन मधुर हो गई।”'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध है, इसलिए उसे प्राथमिकता दी गई है। फिर भी दूसरा चरण कठिन है और यूनानी परम्परा से पर्याप्त भिन्न है; अतः पाठगत तनाव को छिपाने के बजाय स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सुबोध रूप अपनाया गया है। ‘गीत ने अपनी आवाज़ उठाई’ इब्रानी के काव्यात्मक व्यक्तिकरण को रखता है। कठिन दूसरे चरण को स्पष्ट करने के लिए व्याख्यात्मक विस्तार से बचा गया है।
