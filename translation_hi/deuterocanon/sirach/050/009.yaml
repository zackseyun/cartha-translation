translation:
  language: hi
  text: मानो नक्काशीदार सोने और सुरमे[a] का पात्र, जो बहुमूल्य पत्थरों पर जड़ा हुआ हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द וְאַנְטִיל का अर्थ अनिश्चित है। यह सुरमे (एंटिमनी), किसी सजावटी जड़ाई, या आभूषण का संकेत दे सकता है। यूनानी पाठ अधिक सामान्य रूप से कहता है, “हर प्रकार के बहुमूल्य पत्थर से सजाया हुआ।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी साक्षी इस चित्र को कुछ विस्तार से प्रस्तुत करता है: “मानो सोने का हथौड़े से गढ़ा हुआ पात्र, जो हर प्रकार के बहुमूल्य पत्थर से सजाया गया हो।” इससे इब्रानी में भव्य सजावट का सामान्य भाव पुष्ट होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּכְלִי זָהָב
  choice: मानो ... सोने ... का पात्र
  rationale: כִּי־सदृश उपसर्ग तुलना व्यक्त करता है और כְּלִי किसी पात्र या गढ़ी हुई वस्तु को दर्शाता है। यहाँ ‘पात्र’ काव्यात्मक तथा शिल्पकारी की छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: מְפֻתָּח
  choice: नक्काशी किया हुआ
  rationale: निष्क्रिय कृदन्त धातु पर सजावटी कारीगरी किए जाने का भाव देता है। ‘नक्काशी किया हुआ’ आधुनिक हिन्दी में स्पष्ट है और धातु पर बारीक सजावटी काम की छवि रखता है।
- source_word: וְאַנְטִיל
  choice: और सुरमे का
  rationale: यह इब्रानी शब्द अनिश्चित है। सम्भावित खनिज ‘एंटिमनी’ को साधारण हिन्दी में ‘सुरमा’ कहा जा सकता है; सम्बन्धसूचक ‘का’ सोने और सुरमे से बने या सजाए हुए पात्र का स्वाभाविक अर्थ देता है। अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: הַנֶּאֱחָז
  choice: जड़ा हो
  rationale: निफ़अल कृदन्त पकड़े, लगाए या स्थिर किए जाने का भाव देता है। रत्नकारी के प्रसंग में ‘जड़ा हो’ स्वाभाविक है, यद्यपि वह जोड़ने की तकनीक को कुछ हद तक स्पष्ट करता है।
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: बहुमूल्य रत्नों पर
  rationale: शाब्दिक रूप से यह ‘मनभावने/मूल्यवान पत्थरों पर’ है। यूनानी समानान्तर भी बहुमूल्य पत्थरों का समर्थन करता है। हिन्दी में ‘बहुमूल्य रत्न’ काव्यात्मक और सुबोध है।
