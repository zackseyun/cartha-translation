translation:
  language: hi
  text: वह तुम्हें हृदय की बुद्धि[a] दे, और तुम्हारे बीच शांति हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में “हृदय की बुद्धि” के स्थान पर “हृदय का आनंद” है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी पाठ आशीर्वाद को आगे बढ़ाता है: “और हमारे दिनों में इस्राएल में शांति हो, प्राचीन दिनों के समान।”'
    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  choice: दे
  rationale: आशीर्वाद के प्रसंग में हिब्रू यिक्तोल इच्छा या कामना व्यक्त करता है; ‘दे’ हिन्दी में इस आशीर्वचनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָכֶם
  choice: तुम्हें
  rationale: बहुवचन सम्बोधन और अप्रत्यक्ष कर्म दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָכְמַת לֵבָב
  choice: हृदय की बुद्धि
  rationale: उपलब्ध हिब्रू पाठ को प्रधानता देते हुए उसके मुहावरे और आन्तरिक विवेक के अर्थ को सुरक्षित रखता है; यूनानी समानान्तर पाठ में भिन्न पाठ ‘हृदय का आनन्द’ है।
- source_word: וִיהִי
  choice: हो
  rationale: यहाँ क्रिया आशीर्वाद या कामना का भाव रखती है; ‘हो’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह सामान्य और व्यापक समतुल्य है, जिसमें पारस्परिक मेल तथा कुशल-क्षेम दोनों की अर्थ-छाया रह सकती है।
- source_word: בֵּינֵיכֶם
  choice: तुम्हारे बीच
  rationale: बहुवचन समुदाय के भीतर पारस्परिक शान्ति का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठों के भेद में मुख्य पाठ का चयन
  choice: मुख्य पाठ में उपलब्ध हिब्रू ‘हृदय की बुद्धि’ का अनुसरण
  alternative: यूनानी ‘हृदय का आनन्द’ तथा उसका विस्तार ‘हमारे दिनों में इस्राएल में, प्राचीन दिनों के समान’
  rationale: सिराख का उपलब्ध और उच्च-विश्वसनीयता वाला हिब्रू साक्ष्य मुख्य आधार है। यूनानी पाठ एक वास्तविक वैकल्पिक पाठ और विस्तार सुरक्षित रखता है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। दोनों हिब्रू क्रियाओं का आशीर्वचनात्मक भाव हिन्दी के ‘दे’ और ‘हो’ से व्यक्त किया गया है। पादटिप्पणी-चिह्न उस पदांश के तुरन्त बाद रखे गए हैं जिससे प्रत्येक पाठभेद सम्बन्धित है।
