base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: hi
  text: तब वह नीचे उतरा और उसने इस्राएल की सारी सभा पर अपने हाथ उठाए, ताकि वह अपने होंठों से यहोवा की आशीष दे[a] और यहोवा के नाम में गौरव करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक रूप है, “और यहोवा की आशीष उसके होंठों पर/उसके होंठों से”; यूनानी समानांतर अर्थ स्पष्ट करता है, “अपने होंठों से आशीष देने के लिए।”
    reason: alternative_reading
  - marker: b
    text: या “यहोवा के नाम में गर्व करे” या “यहोवा के नाम में उल्लसित हो।” मूल क्रिया गर्व करने, गौरव मानने या उल्लसित होने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: नीचे उतरा
  rationale: क्रिया नीचे की ओर जाने को व्यक्त करती है; याजक के अनुष्ठान के बाद उतरने के प्रसंग में यह स्वाभाविक और निकट अनुवाद है।
- source_word: וְנָשָׂא יָדָיו
  choice: अपने हाथ उठाए
  rationale: यह आशीष या प्रार्थना के पारंपरिक शारीरिक संकेत को दर्शाने वाला हिब्रू मुहावरा है।
- source_word: עַל כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा पर
  rationale: קהל एकत्र हुए औपचारिक समुदाय को दर्शाता है; 'सभा' आधुनिक हिंदी में स्पष्ट है और 'पर' हाथ उठाने की दिशा तथा आशीष देने के भाव को बनाए रखता है।
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: ताकि वह अपने होंठों से यहोवा की आशीष दे
  rationale: प्राप्त हिब्रू वाक्यांश संक्षिप्त और क्रियारहित है; यूनानी समानांतर δοῦναι ... ἐκ χειλέων αὐτοῦ उद्देश्य का भाव स्पष्ट करता है। 'अपने होंठों से' बोलकर दी गई याजकीय आशीष की मूर्त छवि रखता है।
- source_word: וּבְשֵׁם יְהֹוָה הִתְפָּאֵר
  choice: और यहोवा के नाम पर गर्व करे
  rationale: התפאר और यूनानी καυχᾶσθαι गर्व करने, गौरव मानने या हर्षित अभिमान का भाव दे सकते हैं। 'नाम पर गर्व करे' इस सकारात्मक धार्मिक अर्थ को रखता है, यद्यपि हिंदी में 'महिमा करे' की अपेक्षा मूल का आत्मवाची भाव अधिक स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिंदी बाइबलीय प्रयोग में 'यहोवा' व्यापक रूप से पहचाना जाने वाला व्यक्तिनाम है और मूल में आए चतुरक्षरीय दिव्य नाम को सामान्य उपाधि 'प्रभु' से नहीं बदलता।
- issue: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו में निहित क्रिया
  choice: ताकि वह ... आशीष दे
  alternative: और यहोवा की आशीष उसके होंठों पर थी
  rationale: हिब्रू पाठ स्वयं नामवाची और संक्षिप्त है, जबकि यूनानी समानांतर स्पष्ट उद्देश्यवाचक 'आशीष देने के लिए' पढ़ता है। मुख्य पाठ में यूनानी से समर्थित पूर्ण अर्थ रखा गया है और हिब्रू की वैकल्पिक संरचना पादटिप्पणी में सुरक्षित है।
- issue: הִתְפָּאֵר का धार्मिक भाव
  choice: नाम पर गर्व करे
  alternative: नाम में गौरव करे / नाम का जयजयकार करे
  rationale: मूल क्रिया आत्मवाची गर्व, गौरव या उल्लास का तनाव रखती है। 'गर्व करे' अर्थ को अनावश्यक रूप से केवल स्तुति में नहीं बदलता; संभावित नकारात्मक आधुनिक छाया के कारण विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'सभा', 'आशीष' और 'अपने हाथ उठाए' सार्वजनिक याजकीय अनुष्ठान का बाइबलीय स्वर बनाए रखते हैं। उद्देश्यवाचक संरचना यूनानी समानांतर से ली गई है, जबकि संक्षिप्त हिब्रू रूप पादटिप्पणी में दर्ज है।
