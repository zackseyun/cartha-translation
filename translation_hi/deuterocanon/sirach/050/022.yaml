base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: hi
  text: अब, कृपा करके, यहोवा, इस्राएल के परमेश्वर को धन्य कहो, जो पृथ्वी पर अद्भुत काम करता है, जो मनुष्य को गर्भ से ही महान बनाता है और अपनी इच्छा के अनुसार उसके साथ व्यवहार करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “और अब तुम सब परमेश्वर को धन्य कहो, जो हर जगह महान कार्य करता है, जो गर्भ से ही हमारे जीवन को उन्नत करता है और अपनी दया के अनुसार हमारे साथ व्यवहार करता है।”'
    reason: इब्रानी और यूनानी साक्ष्यों में उल्लेखनीय पाठांतर है। विशेषकर इब्रानी में “अपनी इच्छा के अनुसार उसके साथ” है, जबकि यूनानी में “अपनी दया के अनुसार हमारे साथ” है; अन्य पदबंधों में भी भिन्नताएँ हैं।
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: कृपा करके … को धन्य कहो
  rationale: बहुवचन आज्ञार्थक ‘बारेखू’ के साथ ‘ना’ आग्रह को नम्र और तत्पर बनाता है। परमेश्वर के संदर्भ में ‘धन्य कहो’ आधुनिक हिन्दी में स्पष्ट है और इसका अर्थ परमेश्वर को आशीष देना नहीं, उसकी स्तुति करना है।
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ और संबंधसूचक पदबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: הַמַּפְלִיא לַעֲשׂוֹת בָּאָרֶץ
  choice: जो पृथ्वी पर अद्भुत काम करता है
  rationale: हिफ़ील कृदंत פלא असाधारण और विस्मयकारी कार्य करने का भाव देता है। यहाँ בארץ का व्यापक स्तुति-संदर्भ ‘पृथ्वी पर’ का समर्थन करता है, यद्यपि अन्य संदर्भों में इसका अर्थ ‘देश में’ हो सकता है।
- source_word: הַמְגַדֵּל אָדָם מֵרֶחֶם
  choice: जो मनुष्य को गर्भ से ही महान बनाता है
  rationale: גדל का कारक रूप ‘महान बनाना/ऊँचा उठाना’ है। אדם एकवचन में प्रतिनिधिक मानव को सूचित करता है; ‘मनुष्य’ हिन्दी में इस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है। ‘गर्भ से ही’ मूल बिंब और आरंभ-बिंदु दोनों बनाए रखता है।
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: और अपनी इच्छा के अनुसार उसके साथ व्यवहार करता है
  rationale: शाब्दिक संरचना ‘और उसे अपनी इच्छा के अनुसार करता/बनाता है’ हिन्दी में अस्पष्ट और अस्वाभाविक होगी। ‘उसके साथ व्यवहार करता है’ मनुष्य की ओर परमेश्वर की क्रिया को व्यक्त करता है और ברצונו को ‘अपनी इच्छा के अनुसार’ के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानवजाति / इंसान
  rationale: पाठ एकवचन मानव व्यक्ति की बात करते हुए सामान्य मानवता को समेटता है। ‘मनुष्य’ न तो आशय को केवल किसी खास पुरुष तक सीमित करता है, न एकवचन रूप को बहुवचन में बदलता है।
- issue: इब्रानी और यूनानी में अंतिम कथन का पाठांतर
  choice: अपनी इच्छा के अनुसार उसके साथ व्यवहार करता है
  alternative: अपनी दया के अनुसार हमारे साथ व्यवहार करता है
  rationale: उपलब्ध इब्रानी पाठ ברצונו (‘उसकी इच्छा के अनुसार’) और एकवचन कर्मसूचक रूप रखता है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी में ‘उसकी दया के अनुसार हमारे साथ’ है; इस महत्वपूर्ण धार्मिक और पाठगत भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: इब्रानी में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। लिप्यंतरण ‘यहोवा’ पाठक को नाम और सामान्य उपाधि ‘प्रभु’ के बीच का अंतर देखने देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज रखी गई है। ‘धन्य कहो’ बाइबलीय स्तुति-भाषा को बनाए रखता है, जबकि ‘कृपा करके’ आग्रहसूचक נא को बिना पुरातन शैली के व्यक्त करता है।
