  text: the one who cares for his people against calamity[b][a], and strengthens his city against distress.
translation:
  language: hi
  text: जो अपनी प्रजा को अचानक विपत्ति से बचाने की चिंता करता है,[a] और अपने नगर को संकट के विरुद्ध सुदृढ़ करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अचानक विनाश से’; यूनानी समानांतर में ‘पतन से’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘घेराबंदी के विरुद्ध’; इब्रानी शब्द का अर्थ व्यापक रूप से संकट, दबाव, या विपत्ति हो सकता है, जबकि यूनानी समानांतर विशेष रूप से घेराबंदी की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג
  choice: जो ... रक्षा करता था
  rationale: דאג का कृदन्त निरंतर चिंता और देखभाल व्यक्त करता है। हिन्दी में संकट से जुड़ी अगली पदावली के साथ ‘रक्षा करता था’ इस सक्रिय देखभाल को स्वाभाविक ढंग से व्यक्त करता है। अध्याय के स्तुतिपरक ऐतिहासिक संदर्भ के कारण भूतकाल रखा गया है।
- source_word: לְעַמּוֹ
  choice: अपनी प्रजा की
  rationale: עם सामूहिक जनसमुदाय है। नगर और उसके प्रधान के संदर्भ में ‘प्रजा’ स्वाभाविक है और संबंधवाचक प्रत्यय को ‘अपनी’ से सुरक्षित रखता है।
- source_word: מֵחֶתֶף
  choice: अचानक विपत्ति से
  rationale: חֶתֶף आकस्मिक विनाशकारी आघात या विपत्ति का बोध करा सकता है। ‘अचानक विपत्ति’ उसकी आकस्मिकता को बनाए रखता है; מן को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וּמְחַזֵּק
  choice: और ... दृढ़ करता था
  rationale: पिएल रूप חזק का अर्थ मजबूत या सुदृढ़ करना है। ‘दृढ़ करता था’ व्यापक अर्थ को रखता है और नगर की किलेबंदी को भी समेट सकता है।
- source_word: עִירוֹ
  choice: अपने नगर को
  rationale: עיר का सीधा अर्थ ‘नगर’ है और प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: מִצָּר
  choice: घेराबंदी के विरुद्ध
  rationale: צָר दबाव, संकट या शत्रु को सूचित कर सकता है। नगर को दृढ़ करने के सैन्य संदर्भ और यूनानी समानांतर के घेराबंदी-संबंधी शब्द के कारण ‘घेराबंदी’ मुख्य पाठ में उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में रखा गया है।
