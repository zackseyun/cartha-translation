base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: hi
  text: और देश के सब लोगों[a] ने करुणामय के सामने प्रार्थना में ऊँचे स्वर से पुकारा, जब तक कि उसने वेदी पर सेवा पूरी न कर ली और उसके निर्धारित अनुष्ठान पूरे न हो गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “परमप्रधान प्रभु के लोगों ने करुणामय के सामने प्रार्थना की,” और आगे प्रभु की सेवा/सज्जा तथा उसकी उपासना-विधि के पूरा होने की बात कही गई है।
    reason: textual_variant
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है; उसका अधिक शाब्दिक अनुवाद हो सकता है, “और उसकी विधियाँ उसके पास पहुँचीं।” यूनानी पाठ में इसके स्थान पर प्रभु की सेवा/सज्जा पूरी होने और उनकी उपासना-विधि समाप्त करने की बात है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: ऊँचे स्वर से पुकारा
  rationale: רנן ऊँची, गूँजती पुकार या हर्षध्वनि व्यक्त कर सकता है। प्रार्थना के संदर्भ में यह रूप सामूहिक मुखर विनती को स्पष्ट करता है, पर अनिवार्य रूप से गाने का अर्थ नहीं जोड़ता।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोगों
  rationale: इब्रानी पदबंध को स्वाभाविक हिन्दी में रखते हुए यहाँ एकत्र स्थानीय जनसमुदाय का अर्थ व्यक्त करता है, समस्त मानवजाति का नहीं।
- source_word: בִּתְפִלָּה
  choice: प्रार्थना में
  rationale: पूर्वसर्ग और संज्ञा का सीधा तथा स्वाभाविक अनुवाद, जो सामुदायिक उपासना के प्रसंग के अनुकूल है।
- source_word: לִפְנֵי רַחוּם
  choice: करुणामय के सामने
  rationale: रַחוּם यहाँ बिना किसी स्पष्ट ईश्वरीय नाम के उपाधि है। ‘करुणामय’ हिन्दी में श्रद्धापूर्ण उपाधि के रूप में मूल की संक्षिप्तता बनाए रखता है।
- source_word: עַד כַּלּוֹתוֹ לְשָׁרֵת מִזְבֵּחַ
  choice: जब तक कि उसने वेदी पर सेवा पूरी न कर ली
  rationale: कर्ता याजक है; לשרת का उपासना-संबंधी अर्थ ‘सेवा करना’ है। हिन्दी वाक्य में ‘सेवा पूरी करना’ समाप्ति का भाव सहज रूप से देता है।
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: और उसके निर्धारित अनुष्ठान पूरे न हो गए
  rationale: पदबंध कठिन है। बलिदानी संदर्भ में משפטיו निर्धारित विधियों या अनुष्ठानों की ओर संकेत कर सकता है; यूनानी समानांतर भी उपासना-सेवा की पूर्णता का समर्थन करता है। यह अनुवाद सम्भावित आशय देता है और पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि רַחוּם
  choice: करुणामय
  alternative: दयालु परमेश्वर; दयामय
  rationale: मूल में संज्ञा ‘परमेश्वर’ नहीं जोड़ी गई है, इसलिए विशेषण को संज्ञार्थक श्रद्धापूर्ण उपाधि के रूप में रखा गया है।
- issue: अंतिम उपासना-संबंधी वाक्यांश का कर्ता और अर्थ
  choice: उसके निर्धारित अनुष्ठान पूरे हो गए
  alternative: उसने अपने निर्धारित कर्तव्य पूरे किए; उसकी विधियाँ उसके पास पहुँचीं
  rationale: इब्रानी व्याकरण और अर्थ कठिन हैं तथा यूनानी पाठ अलग रूप देता है। मुख्य पाठ संदर्भानुकूल पूर्णता का भाव रखता है, जबकि पादटिप्पणी वास्तविक पाठांतर और अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज उपासना-संबंधी रजिस्टर। ‘वेदी’, ‘अनुष्ठान’ और ‘करुणामय’ जैसे शब्द धार्मिक प्रसंग को स्पष्ट रखते हैं; वाक्यरचना सामान्य पाठक के लिए सरल रखी गई है।
