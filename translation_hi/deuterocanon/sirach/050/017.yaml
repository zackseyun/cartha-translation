base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/017.yaml
  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: hi
  text: सब लोग एक साथ जल्दी से आए और भूमि पर मुँह के बल गिर पड़े, ताकि वे परमप्रधान के सामने, इस्राएल के पवित्र के सामने दण्डवत् करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: सब लोग
  rationale: शाब्दिक अर्थ ‘सारा प्राणी/समस्त देह’ है, पर इस प्रसंग में यह उपस्थित जनसमुदाय को सूचित करता है; ‘सब लोग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יַחְדָּו נִמְהָרוּ
  choice: एक साथ उतावली से आगे बढ़े
  rationale: יַחְדָּו सामूहिकता और נִמְהָרוּ शीघ्रता/उतावलेपन को व्यक्त करता है; यूनानी κοινῇ κατέσπευσεν भी सामूहिक रूप से शीघ्र बढ़ने की पुष्टि करता है।
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: भूमि पर मुँह के बल गिर पड़े
  rationale: इब्रानी की शारीरिक मुद्रा को स्पष्ट, स्वाभाविक हिन्दी में यथासंभव निकटता से रखा गया है।
- source_word: לְהִשְׁתַּחֲוֹת
  choice: दण्डवत् करें
  rationale: यह शब्द झुककर आराधनापूर्ण प्रणाम करने को दर्शाता है; ‘दण्डवत् करना’ इस मुद्रा और धार्मिक भाव दोनों को संक्षेप में व्यक्त करता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त ‘Most High’ उपाधि का प्रतिष्ठित और अर्थसंगत हिन्दी रूप।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र जन
  rationale: इब्रानी उपाधि को औपचारिक समानता से रखा गया है; इसे किसी अधिक व्याख्यात्मक ईश-नाम में नहीं बदला गया।
theological_decisions:
- issue: עֶלְיוֹן और קְדוֹשׁ יִשְׂרָאֵל के बीच संबंध
  choice: 'दोनों उपाधियों को समानांतर रूप में रखा: ‘परमप्रधान के सामने, इस्राएल के पवित्र जन के सामने’'
  alternative: ‘परमप्रधान, इस्राएल के पवित्र जन के सामने’
  rationale: לִפְנֵי की पुनरावृत्ति दोनों पदों पर बल देती है; अनुवाद में इसे बनाए रखने से मूल की काव्यात्मक समानांतरता और पहचान-संबंधी तनाव सुरक्षित रहता है।
- issue: यूनानी पाठ में अतिरिक्त ईश-उपाधियाँ
  choice: इब्रानी पाठ के अनुसार केवल ‘परमप्रधान’ और ‘इस्राएल का पवित्र जन’ रखा
  alternative: यूनानी के अनुसार ‘अपने प्रभु, सर्वशक्तिमान परमप्रधान परमेश्वर’ जोड़ना
  rationale: विश्वसनीय इब्रानी स्रोत प्राथमिक है; यूनानी विस्तार को मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। वाक्य में सामूहिक तत्परता, भूमि पर गिरने की मुद्रा और आराधनापूर्ण दण्डवत्—तीनों को स्पष्ट रखा गया है।
