review_pass:
  verdict: revise
  source_fidelity: ‘सब लोग’ is a contextually defensible rendering of כָּל־בָּשָׂר, supported by the Greek parallel’s ‘all the people.’ However, ‘आगे बढ़े’ adds a directional action not present in the Hebrew or Greek; the verb conveys hurrying. More importantly, קְדוֹשׁ יִשְׂרָאֵל means ‘the Holy One of Israel,’ not ‘the holy person of Israel’; ‘पवित्र जन’ changes the divine title’s meaning.
  naturalness: The revised sentence is clear, idiomatic modern standard Hindi, retains a dignified public-reading register, and represents the repeated ‘before’ naturally.
  terminology: ‘परमप्रधान’ suitably renders עֶלְיוֹן. ‘इस्राएल के पवित्र’ is retained as a compact titular rendering of ‘the Holy One of Israel,’ avoiding the misleading human sense of ‘पवित्र जन’ and avoiding an unsupported expansion of the Hebrew.
  issues:
  - severity: medium
    issue: ‘उतावली से आगे बढ़े’ introduces ‘आगे बढ़े.’
    rationale: נִמְהָרוּ / κατέσπευσεν denotes hurrying, but neither source specifies movement forward.
  - severity: high
    issue: ‘इस्राएल के पवित्र जन’ mistranslates קְדוֹשׁ יִשְׂרָאֵל.
    rationale: The phrase is a divine title, ‘the Holy One of Israel.’ In Hindi, ‘पवित्र जन’ normally denotes a holy person/saint and obscures the referent.
  revised_text: सब लोग एक साथ जल्दी से आए और भूमि पर मुँह के बल गिर पड़े, ताकि वे परमप्रधान के सामने, इस्राएल के पवित्र के सामने दण्डवत् करें।
  revised_footnotes: []
  revision_rationale: The revision removes an unsupported directional nuance and corrects the rendering of the divine title while preserving the Hebrew’s collective action, prostration, purpose of worship, and repeated ‘before.’
