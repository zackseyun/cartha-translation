  text: और वे दूसरी बार दण्डवत् हुए,[a] उसके सम्मुख से आशीष पाने के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘गिरना’ है; यहाँ उपासना में भूमि पर झुककर प्रणाम करना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ: ‘परमप्रधान की ओर से आशीष को प्रकट करने के लिए।’ यह व्याख्यात्मक पाठ परमप्रधान को आशीष के स्रोत के रूप में स्पष्ट करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁנוּ
  choice: दूसरी बार
  rationale: यह क्रिया किसी कार्य को फिर करने का भाव देती है; שֵׁנִית के साथ हिंदी में स्वाभाविक रूप से ‘दूसरी बार’ इस पुनरावृत्ति को व्यक्त करता है।
- source_word: לִנְפּוֹל
  choice: दण्डवत् हुए
  rationale: शाब्दिक अर्थ ‘गिरना’ है, पर उपासना के इस प्रसंग में इसका आशय भूमि पर झुककर प्रणाम करना है। ‘दण्डवत् हुए’ हिब्रू की देहगत छवि और धार्मिक संदर्भ दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह दूसरी बार किए गए कार्य को स्पष्ट करता है; हिब्रू और यूनानी दोनों इस बात पर बल देते हैं।
- source_word: בְּרָכוֹת
  choice: आशीष
  rationale: रूप की दृष्टि से यह बहुवचन है, किंतु यहाँ सामूहिक अर्थ में एक अनुष्ठानिक आशीष अभिप्रेत हो सकती है; यूनानी समानांतर में भी एकवचन है।
- source_word: לָקַחַת
  choice: पाएँ
  rationale: मूल अर्थ ‘लेना’ है, पर आशीष के प्रसंग में हिंदी का ‘पाना’ ग्रहण करने का स्वाभाविक भाव देता है और बलपूर्वक लेने का संकेत नहीं देता।
- source_word: מִפָּנָיו
  choice: उसके सामने से
  rationale: यह ‘उसके मुख/उपस्थिति के सामने से’ का निकट और स्वाभाविक अनुवाद है तथा सर्वनाम के संदर्भ को मुख्य पाठ में अनिर्णीत रखता है।
theological_decisions:
- issue: מִפָּנָיו में ‘उसके’ का संदर्भ और यूनानी पाठ में परमप्रधान का स्पष्ट उल्लेख
  choice: मुख्य पाठ में हिब्रू-आधारित ‘उसके सामने से’ रखा गया है।
  alternative: ‘परमप्रधान से आशीष पाएँ’
  rationale: उपलब्ध हिब्रू पाठ में तृतीय पुरुष एकवचन सर्वनाम है, संभवतः प्रसंग के पुरोहित की ओर संकेत करता हुआ; यूनानी परंपरा आशीष के अंतिम स्रोत के रूप में परमप्रधान को स्पष्ट करती है। हिब्रू को प्राथमिक रखते हुए इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुकूल रखी गई है। ‘दण्डवत् हुए’ शाब्दिक ‘गिरे’ की अपेक्षा संदर्भ स्पष्ट करता है, जबकि ‘उसके सामने से’ हिब्रू की वास्तविक संदिग्धता बनाए रखता है।
