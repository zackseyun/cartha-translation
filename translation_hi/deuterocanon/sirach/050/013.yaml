  text: and the offerings of Yahweh were in their hands[a], before all the assembly of Israel.
translation:
  language: hi
  text: और उनके हाथों में यहोवा के अग्नि-चढ़ावे[a] थे, इस्राएल की सारी सभा के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘यहोवा के अग्नि-चढ़ावे’ है; यूनानी समानांतर में अधिक व्यापक ‘प्रभु का चढ़ावा’ है।
    reason: इब्रानी पद की बलिदानी विशिष्टता और यूनानी समानांतर के व्यापक पाठ—दोनों को दर्ज करना।
lexical_decisions:
- source_word: וְאִשֵּׁי
  choice: और ... अग्नि-चढ़ावे
  rationale: इब्रानी אִשֵּׁי विशेष रूप से आग पर चढ़ाए जाने वाले बलिदानी चढ़ावों को सूचित करता है। ‘अग्नि-चढ़ावे’ इस विशिष्टता को बनाए रखता है; यूनानी समानांतर का व्यापक पाठ पादटिप्पणी में दिया गया है।
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय परमेश्वर-नाम को हिंदी में परिचित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּיָדָם
  choice: उनके हाथों में ... थे
  rationale: यह ठोस अनुष्ठानिक चित्र को सुरक्षित रखता है कि चढ़ावे उनके हाथों में थे।
- source_word: נֶגֶד
  choice: के सामने
  rationale: सार्वजनिक उपस्थिति और दृश्यता को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל के सामुदायिक और उपासना-संबंधी अर्थ को ‘सभा’ स्वाभाविक तथा गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: बलिदानी पद אִשֵּׁי की विशिष्टता
  choice: यहोवा के अग्नि-चढ़ावे
  alternative: यहोवा के चढ़ावे
  rationale: प्राप्त इब्रानी पाठ आग पर चढ़ाए जाने वाले चढ़ावों का अधिक विशिष्ट संकेत देता है, जबकि यूनानी समानांतर व्यापक ‘चढ़ावा’ कहता है। मुख्य पाठ में उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य की विशिष्टता रखी गई है और यूनानी विकल्प पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण पर सहज धार्मिक भाषा। वाक्य पिछले संदर्भ से जुड़ता है, इसलिए आरंभिक ‘और’ बनाए रखा गया है।
