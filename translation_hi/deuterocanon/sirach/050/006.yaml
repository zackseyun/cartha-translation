  text: Like a shining star from among clouds[a], and like the full moon in the days of the feast.
translation:
  language: hi
  text: बादलों के बीच से चमकते तारे के समान[a], और पर्व के दिनों में पूर्ण चाँद के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “बादल के बीच भोर के तारे के समान।” इब्रानी पाठ अधिक सामान्य रूप से कहता है: “बादलों के बीच से चमकते तारे के समान।”'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: चमकते तारे के समान
  rationale: כְּ तुलना को व्यक्त करता है, כוֹכָב का अर्थ ‘तारा’ है, और אוֹר यहाँ उसकी ज्योति या चमक बताता है। ‘चमकते तारे’ स्वाभाविक हिन्दी में इब्रानी बिंब को निकटता से व्यक्त करता है।
- source_word: מִבֵּין עָבִים
  choice: बादलों के बीच से
  rationale: מן और בין का मेल ‘बीच में से’ या ‘के बीच से’ का भाव देता है; इससे बादलों के बीच से प्रकट होते तारे का बिंब बना रहता है।
- source_word: וּכְיָרֵחַ מָלֵא
  choice: और ... पूर्ण चाँद के समान
  rationale: יָרֵחַ ‘चाँद’ और מָלֵא ‘पूर्ण’ है। हिन्दी में ‘पूर्ण चाँद’ स्पष्ट, काव्यात्मक और सामान्य पाठक के लिए सहज है।
- source_word: בִּימֵי מוֹעֵד
  choice: पर्व के दिनों में
  rationale: מוֹעֵד का अर्थ नियत समय या धार्मिक पर्व हो सकता है। उपासना-संबंधी प्रसंग और पूर्ण चाँद के बिंब में ‘पर्व’ सम्भावित अर्थ को व्यक्त करता है, जबकि किसी खास पर्व का नाम नहीं जोड़ता।
theological_decisions:
- issue: इब्रानी के प्रकाशमान तारे और यूनानी समानांतर के अधिक विशिष्ट ‘भोर के तारे’ में चयन
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘चमकते तारे’ को रखा गया
  alternative: बादल के बीच भोर के तारे के समान
  rationale: उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ में אוֹר प्रकाश या चमक व्यक्त करता है, जबकि यूनानी में ἑωθινός ‘भोर का’ है। इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली रखी गई है। समानांतर उपमाओं को ‘के समान’ से स्पष्ट किया गया है और इब्रानी की दृश्यात्मकता को प्राथमिकता दी गई है।
