base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: hi
  text: उसकी करुणा शिमोन के साथ अटल बनी रहे[a], और वह उसके लिए पीनहास की वाचा[b] को स्थापित करे, जो न तो उससे और न उसके वंश से तब तक मिटेगी, जब तक आकाश बना रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “वह अपनी करुणा हमें सौंपे, और उसके दिनों में हमें छुड़ाए।” यह उपलब्ध हिब्रू पाठ से बहुत भिन्न है, जिसमें शिमोन और पीनहास की वाचा का उल्लेख है।'
    reason: alternative_reading
  - marker: b
    text: “पीनहास की वाचा” गिनती 25:12–13 में वर्णित स्थायी याजकीय वाचा की ओर संकेत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: उसकी करुणा शिमोन के साथ अटल बनी रहे
  rationale: נפעל रूप יֵאָמֵן दृढ़ या विश्वसनीय बने रहने का भाव देता है। חֶסֶד के लिए ‘करुणा’ यूनानी ἔλεος से भी पुष्ट है और वाचागत निष्ठा की छाया को पूरी तरह समाप्त नहीं करती। हिंदी में ‘करुणा विश्वासयोग्य बनी रहे’ की अपेक्षा ‘अटल बनी रहे’ अधिक स्वाभाविक है।
- source_word: וְיָקֶם לוֹ
  choice: और वह उसके लिए … को स्थिर करे
  rationale: हिफ़ील וְיָקֶם वाचा के संदर्भ में स्थापित, कायम या दृढ़ करने का अर्थ देता है; ‘स्थिर करे’ प्रार्थनात्मक शैली और वाचागत निरंतरता दोनों को व्यक्त करता है।
- source_word: בְּרִית פִּינְחָס
  choice: पीनहास की वाचा
  rationale: यह गिनती 25:12–13 में पीनहास से संबद्ध स्थायी याजकीय वाचा की ओर संकेत करता है। संबंधवाचक हिब्रू संरचना को संक्षिप्त और स्वाभाविक हिंदी में रखा गया है।
- source_word: אֲשֶׁר לֹא יִכָּרֵת לוֹ, וּלְזַרְעוֹ
  choice: जो न तो उससे और न उसके वंश से … मिटेगी
  rationale: יִכָּרֵת का शाब्दिक अर्थ ‘काटी जाएगी’ है, पर किसी व्यक्ति और उसके वंश से वाचा के न हटने के अर्थ में ‘मिटेगी’ आधुनिक हिंदी में स्पष्ट है; ‘उससे और उसके वंश से’ दोनों संबंध सुरक्षित रखे गए हैं।
- source_word: כִּימֵי שָׁמָיִם
  choice: जब तक आकाश बना रहेगा
  rationale: शाब्दिक ‘आकाश के दिनों के समान’ दीर्घकालिक स्थायित्व का मुहावरा है। चुना हुआ रूप समयगत अर्थ और आकाश की मूल छवि दोनों बनाए रखता है।
theological_decisions:
- issue: शिमोन और पीनहास की वाचा वाले हिब्रू पाठ का यूनानी समानांतर से संबंध
  choice: मुख्य पाठ में उपलब्ध हिब्रू को प्राथमिकता दी गई है और शिमोन तथा पीनहास की वाचा का उल्लेख रखा गया है।
  alternative: 'यूनानी के अनुसार: ‘वह अपनी करुणा हमें सौंपे, और उसके दिनों में हमें छुड़ाए।’'
  rationale: यहाँ यूनानी पाठ हिब्रू से पर्याप्त भिन्न है और संभवतः अलग Vorlage या स्वतंत्र व्याख्यात्मक परंपरा को दर्शाता है। उपलब्ध हिब्रू मूल-पाठ होने के कारण मुख्य अनुवाद उसी पर आधारित है; अंतर को पादटिप्पणी में पारदर्शी रूप से दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सहज रखी गई है। ‘वाचा’ बाइबलीय covenant के लिए प्रचलित और सटीक शब्द है। नामों को हिब्रू के निकट ‘शिमोन’ और ‘पीनहास’ रूप में लिप्यंतरित किया गया है।
