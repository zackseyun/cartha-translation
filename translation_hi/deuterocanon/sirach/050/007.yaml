translation:
  language: hi
  text: राजा के महल पर चमकते हुए सूर्य के समान[a], और बादल में दिखाई देने वाले इंद्रधनुष के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में ‘राजा के महल’ के स्थान पर ‘परमप्रधान के मंदिर’ है। संभवतः हिब्रू साक्षी ने एक भिन्न पाठ सुरक्षित रखा है, जबकि यूनानी पाठ उपासना-स्थल के प्रसंग को स्पष्ट करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: सूर्य के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है; यह हिन्दी में काव्यात्मक उपमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְשַׁקֶּרֶת
  choice: चमकते
  rationale: यह असामान्य हिब्रू रूप प्रसंग में प्रकाश बिखेरने या दमकने का अर्थ देता है; यूनानी ἐκλάμπων भी ‘चमकने’ के अर्थ की पुष्टि करता है।
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: राजा के महल पर
  rationale: हिब्रू הֵיכַל का अर्थ ‘महल’ या ‘मन्दिर’ हो सकता है। मुख्य पाठ में हिब्रू के ‘राजा’ और उसके सामान्य राजकीय अर्थ को रखा गया है; אֶל को इस प्रकाश-दृश्य में स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है। यूनानी का भिन्न पाठ पादटिप्पणी में दिया गया है।
- source_word: וּכְקֶשֶׁת
  choice: और ... इंद्रधनुष के समान
  rationale: קֶשֶׁת का अर्थ धनुष भी हो सकता है, पर बादल में दिखाई देने के कारण यहाँ स्पष्टतः इंद्रधनुष अभिप्रेत है।
- source_word: נִרְאֲתָה
  choice: दिखाई देते
  rationale: निफ़अल रूप किसी वस्तु के दिखाई देने या प्रकट होने को व्यक्त करता है; ‘दिखाई देते’ आधुनिक हिन्दी में सहज है।
- source_word: בֶעָנָן
  choice: बादल में
  rationale: हिब्रू पाठ एकवचन है, इसलिए यूनानी के बहुवचन के बजाय ‘बादल’ रखा गया है।
theological_decisions:
- issue: हिब्रू ‘राजा का महल/मन्दिर’ और यूनानी ‘परमप्रधान का मन्दिर’
  choice: मुख्य पाठ में ‘राजा के महल’
  alternative: ‘परमप्रधान के मन्दिर’ अथवा ‘राजा के मन्दिर’
  rationale: उपलब्ध हिब्रू को मुख्य आधार मानते हुए הַמֶּלֶךְ को ‘राजा’ और הֵיכַל को उसके सामान्य राजकीय अर्थ ‘महल’ में रखा गया है। फिर भी महायाजकीय प्रसंग और यूनानी समानांतर पाठ धार्मिक स्थल की ओर संकेत करते हैं; इस वास्तविक पाठांतर को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर उपमाओं में ‘के समान’ की पुनरावृत्ति मूल की संरचना को स्पष्ट करती है; ‘इंद्रधनुष’ सामान्य पाठक के लिए קֶשֶׁת का प्रसंगानुकूल अर्थ देता है।
