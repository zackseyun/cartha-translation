base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: hi
  text: जब वह अपने भाइयों के हाथ से बलि के भाग ग्रहण करता था[a] और व्यवस्थाओं के पास खड़ा होता था[b], तब उसके चारों ओर पुत्रों का मुकुट था—मानो लबानोन में देवदार के पौधे; और वे उसे जलधारा के किनारे उगने वाले विलो-वृक्षों की तरह घेरे हुए थे—हारून के सभी पुत्र अपने वैभव में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘अपने भाइयों के हाथ से’ के स्थान पर ‘याजकों के हाथों से’ है। प्रसंग से ये उसके सहयाजक प्रतीत होते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में ‘व्यवस्थाओं के पास/पर’ वाक्यांश कठिन है। यूनानी समानांतर उसे वेदी के अग्निकुंड के पास खड़ा बताता है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  choice: जब वह ... बलि के भाग ग्रहण करता
  rationale: בְּ + infinitive construct को कालवाचक रूप में लिया गया है। נְתָחִים मूलतः काटे हुए भाग हैं; याजकीय प्रसंग में ‘बलि के भाग’ अर्थ स्पष्ट करता है, पर किसी विशिष्ट बलि का अनावश्यक निर्धारण नहीं करता।
- source_word: מִיַּד אֶחָיו
  choice: अपने भाइयों के हाथ से
  rationale: इब्रानी पाठ का प्रत्यक्ष अर्थ सुरक्षित रखा गया है। आगे ‘हारून के सभी पुत्र’ से स्पष्ट होता है कि ये उसके सहयाजक भाई हैं; यूनानी पाठ भी ‘याजकों के हाथों से’ पढ़ता है।
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: अपनी वेदी-व्यवस्था के पास खड़ा होता
  rationale: इब्रानी वाक्यांश कठिन है और מַעֲרָכוֹת में सजाई/क्रमबद्ध व्यवस्था का भाव है। यूनानी समानांतर उसे वेदी की अग्नि-वेदी के पास खड़ा बताता है; इसलिए ‘वेदी-व्यवस्था’ इब्रानी चित्र और उपासना-स्थल दोनों को संक्षेप में व्यक्त करता है।
- source_word: עֲטֶרֶת בָּנִים
  choice: पुत्रों का मुकुट
  rationale: चारों ओर खड़े हारूनी वंशज सम्मानसूचक मुकुट का दृश्य बनाते हैं। ‘पुत्र’ अगले पदबंध ‘हारून के सभी पुत्र’ से भी जुड़ता है।
- source_word: כִּשְׁתִילֵי אֲרָזִים בַּלְּבָנוֹן
  choice: मानो लबानोन में देवदार के पौधे
  rationale: शक्तिशाली नववृद्धि का काव्यात्मक बिंब सीधे रखा गया है। ‘लबानोन’ आधुनिक हिन्दी बाइबलीय नाम-रूप है।
- source_word: בְּעַרְבֵי נָחַל
  choice: नाले के किनारे के मजनुओं की तरह
  rationale: עֲרָבֵי נַחַל जलधारा के पास उगने वाले willow वृक्षों का पारंपरिक पदबंध है। ‘मजनूँ’ हिन्दी में willow के लिए मान्य वृक्षनाम है; पादटिप्पणी सामान्य पाठक के लिए इसे स्पष्ट करती है।
- source_word: כָּל־בְּנֵי אֲהַרֹן בִּכְבוֹדָם
  choice: हारून के सभी पुत्र अपने वैभव में
  rationale: वंशगत याजकीय पहचान और כבוד के सम्मान, गरिमा तथा भव्य रूप—दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘उसके भाइयों’ की याजकीय पहचान
  choice: मुख्य पाठ में ‘अपने भाइयों’ रखा गया
  alternative: ‘याजकों के हाथों से’
  rationale: प्राथमिक इब्रानी साक्ष्य ‘उसके भाइयों’ कहता है, जबकि यूनानी उनके याजक होने को स्पष्ट करता है। मुख्य पाठ इब्रानी को सुरक्षित रखता है और पादटिप्पणी पाठांतर तथा प्रसंग बताती है।
- issue: עַל מַעֲרָכוֹת का कठिन वेदी-संबंधी अर्थ
  choice: ‘अपनी वेदी-व्यवस्था के पास’
  alternative: ‘व्यवस्थाओं पर’; ‘अपनी निर्धारित जगह पर’; ‘वेदी की अग्नि के पास’
  rationale: केवल अत्यधिक शाब्दिक अनुवाद हिन्दी में अस्पष्ट होगा। यूनानी समानांतर वेदी के पास का दृश्य स्पष्ट करता है, किंतु इब्रानी की ‘व्यवस्था/क्रम’ संबंधी शब्दावली भी अनुवाद में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी रखी गई है। याजकीय दृश्य स्पष्ट करने के लिए सीमित प्रसंगगत विस्तार किया गया है, जबकि इब्रानी पाठांतर और कठिन वाक्यांश को पादटिप्पणियों में पारदर्शी बनाया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
