- source_word: מָעוֹן
  choice: निवास
  rationale: मूल शब्द के सामान्य अर्थ 'निवास-स्थान' को वास्तु-संदर्भ में गरिमापूर्ण और सहज हिन्दी में रखता है।
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: जो राजमहल के समान था
  rationale: מלך के साथ היכל का अर्थ यहाँ राजा का महल है; यह रूप तुलना और भव्यता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: मुख्य पाठ में नहीं अपनाया; पाठांतर के रूप में पादटिप्पणी में दिया
  rationale: यूनानी पाठ उपलब्ध इब्रानी से बहुत अलग है और संभवतः भिन्न आधार-पाठ या किसी परंपरा में भ्रष्ट पाठ को दर्शाता है; जहाँ इब्रानी उपलब्ध है वहाँ मुख्य पाठ उसी का अनुसरण करता है।
