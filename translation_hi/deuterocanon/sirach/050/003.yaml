  text: In his days the wall with corner towers was built[b][a], a dwelling like a royal palace.
translation:
  language: hi
  text: उसके दिनों में कोनों वाली दीवार बनाई गई[b][a], एक ऐसा निवास जो राजमहल के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “उसके दिनों में पानी का एक जलाशय छोटा किया गया; उसके चारों ओर की परिधि समुद्र के समान काँसे की थी।” यह संभवतः किसी भिन्न आधार-पाठ या किसी एक पाठ-परंपरा में बिगड़ी हुई पंक्ति की ओर संकेत करता है।'
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से “कोनों की दीवार।” यह कठिन इब्रानी पदबंध कोने के भागों, कोने के बुर्जों या किसी किलेबंद घेरे की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: उसके दिनों में
  rationale: इब्रानी के कालसूचक वाक्यांश को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִבְנָה
  choice: बनाई गई
  rationale: בנה के कर्मवाच्य रूप का सीधा अर्थ है; मूल में पुनर्निर्माण स्पष्ट नहीं है।
- source_word: קִיר / פִּנּוֹת
  choice: कोनोंवाली दीवार
