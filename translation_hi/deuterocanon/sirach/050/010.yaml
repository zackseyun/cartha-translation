translation:
  language: hi
  text: फलते-फूलते जैतून के पेड़ के समान, जैतून के फलों से लदे हुए[a], और अपनी डालियों को सींचने वाले हरे-भरे पेड़ के समान[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दानों से भरा”; यहाँ प्रयुक्त दुर्लभ इब्रानी शब्द सम्भवतः जैतून के फलों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में इसके स्थान पर है, “और बादलों तक ऊँचा उठते सरो के पेड़ के समान।” जहाँ इब्रानी पाठ उपलब्ध है, यहाँ उसी को मुख्य पाठ में अपनाया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  choice: फलते-फूलते जैतून के पेड़ के समान
  rationale: כְּ तुलना सूचित करता है; זַיִת को समानांतर עֵץ और यूनानी ἐλαία के आधार पर पेड़ के अर्थ में लिया गया है। רַעֲנָן की हरियाली, ताजगी और सजीव बढ़त को स्वाभाविक हिन्दी में ‘फलते-फूलते’ व्यक्त करता है।
- source_word: מָלֵא גַרְגַּר
  choice: जैतून के फलों से लदा हो
  rationale: दुर्लभ גַרְגַּר सम्भवतः यहाँ जैतून के फल अथवा दानों को सूचित करता है। ‘फलों से लदा’ काव्यात्मक प्रचुरता को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी समानांतर का καρπούς भी फल का समर्थन करता है।
- source_word: וּכְעֵץ שָׁמֵן
  choice: और रस से भरे पेड़ के समान
  rationale: שָׁמֵן का मूल भाव मोटा, समृद्ध अथवा पुष्ट है और वनस्पति के संदर्भ में भरपूर रस तथा उर्वर बढ़त का बिंब देता है। ‘रस से भरा’ अगले खंड में डालियों को सींचने की छवि से भी स्वाभाविक रूप से जुड़ता है, बिना इसे किसी विशिष्ट वृक्ष-जाति में बदलने के।
- source_word: מְרַוֶּה עָנָף
  choice: जो अपनी डालियों को सींचता हो
  rationale: רוה का हिफ़ील रूप भिगोने, तृप्त करने या भरपूर पानी देने का अर्थ रखता है। एकवचन עָנָף को सामूहिक अर्थ में स्वाभाविक हिन्दी बहुवचन ‘डालियों’ से व्यक्त किया गया है।
