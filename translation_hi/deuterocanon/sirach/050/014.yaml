  text: until he finished ministering at the altar[a], and arranging the offerings of the Most High.
translation:
  language: hi
  text: जब तक वह वेदी पर सेवा और परमप्रधान की व्यवस्थाओं[a] को क्रम से लगाने का कार्य पूरा न कर लेता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में है, “परमप्रधान सर्वशक्तिमान की भेंट को सजाना/व्यवस्थित करना।” इब्रानी अधिक संक्षेप में कहता है, “परमप्रधान की व्यवस्थाओं को क्रम से लगाना।”
    reason: यूनानी पाठ वस्तु को एकवचन ‘भेंट’ के रूप में अधिक स्पष्ट करता है और ‘सर्वशक्तिमान’ उपाधि जोड़ता है, जबकि इब्रानी बहुवचन, व्यापक ‘व्यवस्थाओं’ कहता है।
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: जब तक उसने ... पूरा न कर लिया
  rationale: यह प्रयोग पहले वर्णित कार्यों की समाप्ति का बिंदु बताता है; हिन्दी में यह स्वाभाविक रूप से उसी कालगत अर्थ को व्यक्त करता है।
- source_word: לְשָׁרֵת
  choice: सेवा करना
  rationale: याजकीय प्रसंग में यह वेदी पर की जानेवाली धार्मिक सेवा को दर्शाता है; ‘सेवा करना’ सहज और गरिमापूर्ण है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलिदान और उपासना के प्रसंग में यह मानक हिन्दी पद है।
- source_word: וּלְסַדֵּר
  choice: क्रम से लगाना
  rationale: स्रोत क्रिया का अर्थ वस्तुओं को उचित क्रम में रखना या व्यवस्थित करना है; यह चयन ठोस अनुष्ठानिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעַרְכוֹת
  choice: भेंटों
  rationale: इब्रानी बहुवचन का शाब्दिक अर्थ ‘व्यवस्थाएँ/क्रम से लगाई वस्तुएँ’ हो सकता है और वह यहाँ संक्षिप्त है। वेदी के प्रसंग तथा यूनानी προσφοράν के सहारे ‘भेंटों’ से अनुष्ठानिक आशय स्पष्ट होता है; इब्रानी की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: ज्ञान-साहित्य में परमेश्वर के लिए प्रयुक्त इस उपाधि का यह मानक और परिचित हिन्दी रूप है।
theological_decisions:
- issue: מַעַרְכוֹת को कितना विशिष्ट अनुष्ठानिक अर्थ दिया जाए
  choice: मुख्य पाठ में ‘भेंटों’ रखा और ‘क्रम से लगाना’ द्वारा इब्रानी के व्यवस्था-संबंधी भाव को बनाए रखा
  alternative: ‘परमप्रधान की व्यवस्थाओं को क्रम से लगाना’ अथवा यूनानी के अनुसार ‘परमप्रधान सर्वशक्तिमान की भेंट को सजाना’
  rationale: इब्रानी पाठ प्राथमिक है, पर उसका संक्षिप्त बहुवचन हिन्दी में अकेले ‘व्यवस्थाएँ’ कहने पर अमूर्त और अस्पष्ट लगेगा। वेदी का निकट प्रसंग और यूनानी समानांतर भेंट-संबंधी अर्थ का समर्थन करते हैं। पादटिप्पणी इब्रानी की व्यापक शब्दावली तथा यूनानी के अतिरिक्त ‘सर्वशक्तिमान’ दोनों को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘वेदी पर सेवा करना’ याजकीय संदर्भ बनाए रखता है, और ‘क्रम से लगाना’ अनावश्यक तकनीकी शब्दावली के बिना अनुष्ठानिक व्यवस्था को मूर्त रूप देता है।
