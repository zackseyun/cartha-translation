  text: In his days a reservoir was dug out[b][a], and a conduit like the sea in its abundance.
translation:
  language: hi
  text: उसके दिनों में एक जलाशय खोदा गया, और समुद्र-जैसा विशाल जलमार्ग।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर का पाठ है: “उसी के द्वारा दुहरे भवन की ऊँचाई की नींव डाली गई—मंदिर के घेरे का ऊँचा पुश्ता।” इब्रानी साक्ष्य इसके बजाय जलाशय और जलमार्ग का उल्लेख करता है; दोनों पाठों में महत्वपूर्ण भिन्नता है।'
    reason: alternative_reading
  - marker: b
    text: ‘जलमार्ग’ के लिए प्रयुक्त इब्रानी शब्द अनिश्चित है; इसका अर्थ अधिक सामान्य रूप से ‘नाली’, ‘जलधारा’ या ‘जल-चैनल’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדוֹרוֹ
  choice: उसके दिनों में
  rationale: यह पदबंध महायाजक के कार्यकाल को सूचित करता है; हिन्दी में यह संक्षिप्त, स्वाभाविक और मूल के निकट है।
- source_word: נִכְרָה
  choice: खोदा गया
  rationale: כרה के निफ़अल रूप का स्वाभाविक निष्क्रिय अर्थ खोदे या उत्खनित किए जाने का है।
- source_word: מִקְוֶה
  choice: जलाशय
  rationale: निर्माण-संदर्भ में यह एकत्र या संचित जल के बड़े स्थान को दर्शाता है; ‘जलाशय’ आधुनिक हिन्दी में पर्याप्त व्यापक है।
- source_word: שִׂיחַ
  choice: जलधारा
  rationale: शब्द संदिग्ध है और नाली, जलमार्ग या जलधारा का संकेत दे सकता है। ‘जलधारा’ पठनीय है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כַּיָּם
  choice: समुद्र-सी
  rationale: मूल की स्पष्ट उपमा को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בַּהֲמוֹנוֹ
  choice: प्रचुर
  rationale: המון यहाँ बहुतायत, विशालता या उमड़ते जल का भाव दे सकता है; ‘प्रचुर’ मात्रा के प्रमुख अर्थ को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और भिन्न यूनानी समानांतर में से आधार-पाठ
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी के अनुसार: “उसी के द्वारा दुहरे भवन की ऊँचाई की नींव डाली गई—मन्दिर के घेरे का ऊँचा पुश्ता।”'
  rationale: इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य अनुवाद उसी पर आधारित है। यूनानी पाठ में वास्तविक और महत्वपूर्ण पाठांतर है, जिसे पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘बनाई गई’ इब्रानी में प्रत्यक्ष रूप से नहीं है, पर दूसरे समांतर खंड की स्वाभाविक हिन्दी पूर्णता के लिए जोड़ा गया है; समुद्र की उपमा और शब्दगत अनिश्चितता सुरक्षित रखी गई है।
