base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/026.yaml
  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: hi
  text: सेईर और पलिश्त के निवासी,[a] और वह मूर्ख जाति जो शकेम में रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘सेईर और पलिश्त के निवासी’ के स्थान पर ‘सामरिया के पर्वत पर रहने वाले और पलिश्ती’ है।
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: निवासी
  rationale: यह ישב का संबंधरूप बहुवचन है, जो किसी स्थान में रहने वाले लोगों के लिए संज्ञा के रूप में प्रयुक्त हुआ है; ‘निवासी’ स्वाभाविक और सामूहिक अर्थ को बनाए रखता है।
- source_word: שֵׂעִיר
  choice: सेईर
  rationale: यह स्थान का व्यक्तिवाचक नाम है। इब्रानी में यहाँ ‘पर्वत’ शब्द नहीं है, इसलिए केवल ‘सेईर’ रखा गया है।
- source_word: וּפְלֶשֶׁת
  choice: और पलिश्त
  rationale: इब्रानी रूप लोगों के बजाय भूभाग का नाम बताता है। ‘पलिश्त’ उस क्षेत्र के निवासियों को पहले पद ‘निवासी’ के अधीन समझने देता है।
- source_word: גּוֹי
  choice: जाति
  rationale: גוי किसी जनसमूह या राष्ट्र को दर्शाता है; इस प्राचीन जातीय संदर्भ में ‘जाति’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: यह शब्द केवल बुद्धि की कमी नहीं, बल्कि नैतिक और विवेकगत मूर्खता का निंदात्मक भाव भी रखता है; ‘मूर्ख’ उस व्यापक तीखेपन को बनाए रखता है।
- source_word: הַדָּר
  choice: जो ... रहती है
  rationale: निवास करने के अर्थ वाला कृदन्त यहाँ גוי का विशेषण है; स्त्रीलिंग ‘रहती है’ हिन्दी के ‘जाति’ से स्वाभाविक सामंजस्य रखता है।
- source_word: בִּשְׁכֶם
  choice: शकेम में
  rationale: यह इब्रानी स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण है।
theological_decisions:
- issue: पहले जातीय/भौगोलिक उल्लेख में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी ‘सेईर और पलिश्त के निवासी’ का अनुसरण
  alternative: ‘सामरिया के पर्वत और पलिश्त के निवासी’
  rationale: सिराख के उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी साक्षी में ‘सेईर’ के स्थान पर ‘सामरिया का पर्वत’ है; इस वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली। स्थान-नामों को इब्रानी के अनुसार रखा गया है और यूनानी पाठांतर को स्पष्ट पादटिप्पणी में दिया गया है।
