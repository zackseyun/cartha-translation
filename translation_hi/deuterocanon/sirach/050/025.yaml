  text: With two nations my soul is disgusted[a], and the third is not a people.
translation:
  language: hi
  text: दो जातियों से मेरी आत्मा को घृणा है, और तीसरी जाति कोई प्रजा नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “और तीसरी कोई जाति नहीं है।” यहाँ इब्रानी पाठ में “प्रजा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: दो जातियों से
  rationale: בִּשְׁנֵי के संबंधसूचक प्रयोग को घृणा के लक्ष्य के रूप में स्वाभाविक हिन्दी ‘से’ द्वारा व्यक्त किया गया है। גוֹיִם के लिए ‘जातियाँ’ बाइबलीय संदर्भ में जनसमूहों या राष्ट्रों को सूचित करता है और अगले עָם से शब्दगत भेद भी बनाए रखता है।
- source_word: קָצָה נַפְשִׁי
  choice: मेरी आत्मा को घृणा है
  rationale: यह वाक्यांश गहरी विरक्ति या घृणा व्यक्त करता है। ‘मेरी आत्मा’ से נַפְשִׁי का काव्यात्मक और मानव-अनुभव संबंधी रूप बना रहता है, जबकि ‘को घृणा है’ आधुनिक हिन्दी में सहज है।
- source_word: וְהַשְּׁלִישִׁית
  choice: और तीसरी
  rationale: स्त्रीलिंग क्रमवाचक विशेषण संदर्भ में पहले कही गई ‘जाति’ की ओर संकेत करता है। हिन्दी में ‘तीसरी’ इस लोपित संज्ञा को स्वाभाविक रूप से बनाए रखता है।
- source_word: אִינֶנּוּ עָם
  choice: तो कोई प्रजा ही नहीं है
  rationale: עָם के लिए ‘प्रजा’ चुना गया है ताकि सामूहिक ‘people’ का अर्थ और पहले आए גוֹיִם से भेद सुरक्षित रहे। ‘तो’ और ‘ही’ मूल कथन के तीखे, दर्जा नकारने वाले बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
theological_decisions:
- issue: נַפְשִׁי को साधारण प्रथम-पुरुष कथन में बदलना या ‘मेरी आत्मा’ बनाए रखना
  choice: मुख्य पाठ में ‘मेरी आत्मा’ रखा गया
  alternative: ‘मुझे घृणा है’
  rationale: इब्रानी और यूनानी दोनों में आत्मा का स्पष्ट उल्लेख है। इसे बनाए रखने से काव्यात्मक स्रोत-रूप सुरक्षित रहता है, बिना मनुष्य की प्रकृति के विषय में कोई अतिरिक्त सिद्धान्त आरोपित किए।
- issue: अंतिम खंड में इब्रानी עָם या यूनानी ἔθνος का अनुसरण
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘प्रजा’
  alternative: ‘जाति’
  rationale: इस पद का उपलब्ध इब्रानी पाठ उच्च-विश्वसनीयता वाला प्राथमिक साक्ष्य है। यूनानी का ‘जाति/राष्ट्र’ पाठ महत्त्वपूर्ण विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आत्मा’ स्रोत की काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है; ‘प्रजा’ और ‘जाति’ के भेद से इब्रानी के עָם और גוֹיִם का शब्दगत तनाव बना रहता है।
