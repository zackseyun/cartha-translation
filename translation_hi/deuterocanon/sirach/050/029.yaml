    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: क्योंकि यदि वह इन बातों को करेगा
  rationale: शर्त और पिछले कथन से उसके व्याख्यात्मक संबंध, दोनों को बनाए रखता है। αὐτά पिछली शिक्षाओं की ओर संकेत करता है; इसलिए ‘इन बातों’ स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: πρὸς πάντα ἰσχύσει
  choice: वह हर बात में प्रबल होगा
  rationale: ἰσχύω की सामर्थ्य और प्रभावशीलता तथा πρὸς πάντα के व्यापक दायरे को सहज हिन्दी में व्यक्त करता है। यूनानी पदबंध संक्षिप्त है और ‘सबका सामना करने में समर्थ होगा’ का अर्थ भी संभव है, पर ‘हर बात में प्रबल होगा’ इस अस्पष्टता को अनावश्यक संघर्ष-भाषा में सीमित नहीं करता।
- source_word: φῶς Κυρίου
  choice: प्रभु का प्रकाश
  rationale: प्रकाश के मूल रूपक और Κυρίου के मानक ईश्वरीय संबोधन को सीधे बनाए रखता है।
- source_word: τὸ ἴχνος αὐτοῦ
  choice: उसका पथ
  rationale: ἴχνος का मूल अर्थ पदचिह्न, निशान या पगडंडी है। इस ज्ञान-साहित्यिक प्रसंग में ‘पथ’ जीवन-मार्ग के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक ठोस यूनानी बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: τὸ ἴχνος αὐτοῦ के रूपक का अर्थ
  choice: प्रभु का प्रकाश उस व्यक्ति के जीवन-पथ को दिशा देता या निर्धारित करता है।
  alternative: अधिक शाब्दिक रूप में, प्रभु का प्रकाश उसका ‘पदचिह्न’, ‘निशान’ या ‘पगडंडी’ है; इससे प्रकाश द्वारा छोड़े गए दिखाई देने वाले चिह्न पर बल पड़ सकता है।
  rationale: यूनानी कथन रूपकात्मक और संक्षिप्त है। मुख्य पाठ में ‘पथ’ सुबोध है, पर अधिक ठोस मूल बिंब को पादटिप्पणी में देकर अर्थगत तनाव को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘प्रबल होगा’ मूल क्रिया की सामर्थ्य और सफलता—दोनों संभावनाओं को खुला रखता है।
