    rationale: The source supplied for Sirach 50:8 contains four similes, but the draft translates only the final two. A complete translation must include the blossom/branches/festival-days and lily/watercourses images.
  - severity: high
    issue: The footnote incorrectly says that the Greek has the lily comparison where the Hebrew has the fire comparison.
    rationale: The supplied Hebrew contains both “like a lily by the watercourses” and “like a fire of frankincense upon the grain offering.” The Greek parallel also contains the lily image, but its verse 50:8 ends after the Lebanon image; the fire image belongs to the following Greek verse.
  - severity: low
    issue: “जलते” adds wording not explicit in the Hebrew.
    rationale: The fire-and-frankincense image naturally implies burning, but “लोबान की आग” is both more concise and closer to the source.
