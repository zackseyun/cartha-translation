base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/008.yaml
  text: like a blossom of Lebanon in the days of summer[a], and like a fire of frankincense upon the grain offering.
translation:
  language: hi
  text: उत्सव के दिनों में अपनी डालियों में खिले फूल के समान, और जलधाराओं के किनारों पर लिली के समान; गरमी के दिनों में लबानोन के फूल के समान, और अन्नबलि पर लोबान की आग के समान।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में “वसंत के दिनों में गुलाबों के फूल के समान, जल के निकासों पर लिलियों के समान, और गरमी के दिनों में लबानोन की कोपलों के समान” पढ़ा जाता है। उपलब्ध इब्रानी पाठ में उत्सव के दिनों में डालियों के फूल और अन्नबलि पर लोबान की आग की उपमाएँ भी हैं। यूनानी पाठ में लोबान की आग की उपमा अगले पद में आती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח
  choice: मानो … फूल
  rationale: तुलनासूचक כְּ को ‘मानो’ से व्यक्त किया गया है; פֶּרַח के लिए सहज और काव्यात्मक ‘फूल’ चुना गया है।
- source_word: לְבָנוֹן
  choice: लबानोन का
  rationale: सम्बन्धवाचक रचना को बनाए रखते हुए इसे ‘लबानोन का फूल’ कहा गया है, जो उस प्रदेश की वनस्पति से जुड़ी काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: בִּימֵי קָיִץ
  choice: गरमी के दिनों में
  rationale: यह इब्रानी पदबंध का स्वाभाविक आधुनिक हिन्दी रूप है और ‘दिनों में’ वाली काव्यात्मक लय भी बनाए रखता है।
- source_word: וּכְאֵשׁ לְבוֹנָה
  choice: और मानो … जलते लोबान की आग
  rationale: לְבוֹנָה का विशिष्ट अर्थ ‘लोबान’ रखा गया है। हिन्दी में दृश्य को स्पष्ट और स्वाभाविक बनाने के लिए ‘जलते’ जोड़ा गया है; ‘आग’ इब्रानी की ठोस छवि को सुरक्षित रखता है।
- source_word: עַל הַמִּנְחָה
  choice: अन्नबलि पर
  rationale: मन्दिर और बलिदान के प्रसंग में מִנְחָה के विशिष्ट अर्थ को सामान्य ‘भेंट’ के बजाय स्पष्ट ‘अन्नबलि’ से व्यक्त किया गया है।
theological_decisions:
- issue: उपासना-संबंधी पद מִנְחָה
  choice: अन्नबलि
  alternative: भेंट
  rationale: यह पद मन्दिर की बलिदान-विधि के संदर्भ में है; इसलिए विशिष्ट उपासना-संबंधी अर्थ बनाए रखना उचित है, बिना किसी अतिरिक्त सम्प्रदायगत व्याख्या के।
- issue: इब्रानी और यूनानी पाठ-परम्पराओं का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण
  alternative: यूनानी समानांतर के अनुसार ‘जलधाराओं के निकासों पर सोसन के फूल’
  rationale: दिए गए इब्रानी साक्ष्य को मुख्य आधार बनाया गया है और वास्तविक पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘लबानोन’, ‘लोबान’ और ‘अन्नबलि’ बाइबिलीय प्रसंग के परिचित तथा अर्थ-सटीक शब्द हैं; वाक्य की दोनों तुलनाओं में ‘मानो’ रखकर इब्रानी समानांतरता उभारी गई है।
