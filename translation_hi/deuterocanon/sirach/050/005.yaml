base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/005.yaml
  text: How splendid he was when he looked out from the tent[b][a], when he came out from the house of the curtain.
translation:
  language: hi
  text: तंबू से बाहर देखते समय वह कितना भव्य था, और परदे वाले भवन से निकलते समय भी![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में पहले अर्धवाक्य का पाठ भिन्न है: “लोगों के घूमने/परिक्रमा करने के समय वह कितना महिमान्वित हुआ,” न कि “तंबू से बाहर देखते समय वह कितना भव्य था।”'
    reason: textual_variant
  - marker: b
    text: “परदा” उस आवरण को दर्शाता है जो भीतरी पवित्रस्थान के सामने था; इसका अनुवाद “विभाजक परदा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: वह कितना भव्य दिखाई देता था
  rationale: विस्मयवाचक מַה और נהדר मिलकर प्रभावशाली, शोभायमान रूप पर प्रशंसा व्यक्त करते हैं। ‘भव्य’ दृश्य वैभव और गरिमा दोनों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: בְּהַשְׁגִּיחוֹ
  choice: जब वह ... झाँकता था
  rationale: हिब्रू क्रिया का मूल भाव बाहर की ओर देखने या दिखाई देने का है। ‘झाँकता था’ हिब्रू के सक्रिय अर्थ के निकट रहते हुए महायाजक के तंबू से दृष्टिगोचर होने का दृश्य व्यक्त करता है।
- source_word: מֵאֹהֶל
  choice: तंबू से
  rationale: मूल हिब्रू में सामान्य शब्द ‘तंबू’ है। इसे ‘मंदिर’ या ‘निवास-स्थान’ बनाकर सामंजस्य बैठाने के बजाय विरासत में मिली पवित्र-स्थान की मिश्रित छवि सुरक्षित रखी गई है।
- source_word: וּבְצֵאתוֹ
  choice: और जब वह ... बाहर निकलता था
  rationale: यह दूसरी कालवाचक उपवाक्य-रचना है और पहली पंक्ति के समानांतर है। यह अनुवाद हिब्रू के सीधे अर्थ को सहज हिन्दी में रखता है।
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: परदे के भवन से
  rationale: शब्दशः संरचना ‘परदे का भवन/घर’ है। ‘परदे के भवन से’ असामान्य किंतु समझने योग्य संरचना को बनाए रखता है और ‘परदे के पीछे से’ जैसी अतिरिक्त स्थानगत व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: ‘तंबू’ और ‘परदे के भवन’ की मिश्रित पवित्र-स्थान संबंधी छवि
  choice: दोनों हिब्रू रूपकों को मुख्य पाठ में बनाए रखा गया है।
  alternative: दोनों को ‘मंदिर’ या ‘पवित्रस्थान’ कहकर एकरूप करना।
  rationale: हिब्रू पाठ संभवतः मंदिर की उपासना के भीतर मिलापवाले तंबू की पारंपरिक भाषा का स्मरण कराता है। एक ही स्थापत्य शब्द चुनने से यह तनाव मिट जाता।
- issue: पहले अर्धवाक्य का यूनानी पाठांतर
  choice: विश्वसनीय हिब्रू पाठ को मुख्य पाठ बनाया गया और यूनानी भिन्नता को पादटिप्पणी में रखा गया।
  alternative: यूनानी के अनुसार ‘लोगों के बीच घूमने/परिक्रमा करने में’ अनुवाद करना।
  rationale: दिए गए स्रोत में हिब्रू का विश्वास-स्तर ऊँचा है, पर यूनानी समानांतर वास्तविक पाठभेद का प्रमाण देता है; इसलिए उसे छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मुख्य पाठ में हिब्रू की समानांतर वाक्य-रचना और ‘तंबू/भवन/परदा’ की जानबूझकर मिश्रित पवित्र-स्थान संबंधी शब्दावली सुरक्षित रखी गई है।
