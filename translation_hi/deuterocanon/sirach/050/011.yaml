base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: hi
  text: जब उसने गौरव के वस्त्र धारण किए और वैभव के वस्त्र पहने[a], तब महिमामय वेदी पर चढ़कर उसने पवित्रस्थान के आँगन को अलंकृत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में आगे का भाव है: “जब वह पवित्र वेदी पर चढ़ा, तब उसने पवित्रस्थान के परिधान अथवा उसके घेरे/आँगन को महिमा दी।” इब्रानी पाठ में “महिमामय वेदी” और “पवित्रस्थान का आँगन” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: जब उसने ... धारण किए
  rationale: यह रूप पुरोहित के विधिवत वस्त्र धारण करने का दृश्य प्रस्तुत करता है; ‘धारण किए’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בִּגְדֵי כָבוֹד
  choice: आदर के वस्त्र
  rationale: כָבוֹד में आदर और महिमा दोनों का भाव हो सकता है; ‘आदर के वस्त्र’ इब्रानी संबंध-रचना को बनाए रखता और अगले पदबंध से भेद करता है।
- source_word: וְהִתְלַבְּשׁוֹ בִּגְדֵי תִפְאָרֶת
  choice: और वैभव के वस्त्र पहने
  rationale: तिफ़एरेत सौंदर्य, शोभा और वैभव व्यक्त करता है; ‘वैभव’ इस औपचारिक पुरोहितीय प्रसंग के अनुकूल है।
- source_word: בַּעֲלוֹתוֹ
  choice: तब ... चढ़कर
  rationale: क्रिया वेदी की ओर ऊपर जाने को दर्शाती है; हिन्दी में ‘चढ़कर’ संक्षिप्त और स्वाभाविक है।
- source_word: מִזְבַּח הוֹד
  choice: प्रतापमय वेदी
  rationale: הוֹד प्रताप, ऐश्वर्य या महिमा का बोध कराता है। ‘प्रतापमय’ वेदी के गुण को स्पष्ट करता है और उपलब्ध इब्रानी पाठ का अनुसरण करता है।
- source_word: וַיֶּהְדַּר
  choice: शोभायमान कर दिया
  rationale: הדר का कारक अर्थ सजाना अथवा भव्य बनाना है; यह पदबंध उस प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: पवित्रस्थान का आँगन
  rationale: עֲזֶרֶת मंदिर के घेरे या आँगन को बताता है और מִקְדָּשׁ पवित्रस्थान को; हिन्दी संबंध-रचना स्पष्ट और सहज है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर में वेदी के विशेषण का अंतर
  choice: मुख्य पाठ में इब्रानी מִזְבַּח הוֹד के अनुसार ‘प्रतापमय वेदी’
  alternative: यूनानी के अनुसार ‘पवित्र वेदी’
  rationale: सिराख का उपलब्ध, उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य यहाँ सुसंगत है; अतः मुख्य पाठ उसी को अपनाता है, जबकि यूनानी भिन्नता पादटिप्पणी में सुरक्षित है।
- issue: पवित्रस्थान के आँगन पर पुरोहितीय वस्त्रों का प्रभाव
  choice: ‘उसने ... शोभायमान कर दिया’
  alternative: ‘उसने ... को महिमा दी’
  rationale: इब्रानी क्रिया का सौंदर्यवर्धक/भव्य बनाने वाला अर्थ इस दृश्य में अधिक प्रत्यक्ष है; इससे किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धार्मिक शैली रखी गई है। ‘धारण किए/पहने’ की समानांतरता मूल की काव्यात्मक पुनरुक्ति को बनाए रखती है; कठिन संस्कृतनिष्ठ शब्दावली से यथासंभव बचते हुए ‘प्रतापमय’ और ‘शोभायमान’ जैसे प्रसंगानुकूल शब्द चुने गए हैं।
