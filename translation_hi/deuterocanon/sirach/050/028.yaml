base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/028.yaml
  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो इन बातों पर मनन करता है[a], और जो इन्हें अपने हृदय में रखता है, वह बुद्धिमान हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुखी है वह मनुष्य।” इब्रानी אַשְׁרֵי और यूनानी μακάριος का अनुवाद “सुखी” भी हो सकता है; यहाँ “धन्य” ज्ञान-वचन के गंभीर आशीर्वचन-भाव को अधिक अच्छी तरह बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी ज्ञान-साहित्य का आशीर्वचन-सूत्र है। ‘धन्य है’ केवल भावनात्मक प्रसन्नता से अधिक गहरा अर्थ व्यक्त करता है और यूनानी μακάριος से भी मेल खाता है।
- source_word: אִישׁ
  choice: वह मनुष्य
  rationale: इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ ज्ञान-साहित्य में सामान्य प्रतिनिधि व्यक्ति को सूचित करता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल रूप को बनाए रखता है।
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: इन बातों पर मनन करता है
  rationale: הגה यहाँ विचारपूर्वक चिंतन करने का भाव रखता है। ‘इन बातों पर मनन’ हिन्दी में स्वाभाविक है और पूर्ववर्ती शिक्षाओं की ओर संकेत स्पष्ट करता है।
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: जो इन्हें अपने हृदय में रखता है
  rationale: शाब्दिक हृदय-रूपक को बनाए रखते हुए यह वाक्यांश बातों को गंभीरता से ग्रहण और आत्मसात करने का भाव देता है। ‘इन्हें’ का बहुवचन पूर्ववर्ती ‘इन बातों’ तथा यूनानी αὐτά से पुष्ट है।
- source_word: יֶחְכָּם
  choice: बुद्धिमान हो जाएगा
  rationale: इब्रानी क्रिया बुद्धिमान बनने के परिणाम को व्यक्त करती है। यह अनावश्यक कर्मवाच्य अर्थ जोड़े बिना मूल के भाव को सीधे रखती है।
theological_decisions:
- issue: ज्ञान-वचन में सामान्य पुल्लिंग
  choice: वह मनुष्य
  alternative: वह व्यक्ति / जो कोई
  rationale: मूल אִישׁ पुल्लिंग एकवचन है, पर प्रसंग में प्रतिनिधि सामान्य व्यक्ति का बोध कराता है। मुख्य पाठ मूल व्याकरणिक रूप को स्वाभाविक हिन्दी में बनाए रखता है, बिना अर्थ को केवल पुरुषों तक सीमित घोषित किए।
- issue: इब्रानी को प्राथमिक और यूनानी को सहायक साक्षी मानना
  choice: दूसरे खंड में ‘इन्हें’ द्वारा पहली पंक्ति की ‘इन बातों’ का संदर्भ स्पष्ट करना
  alternative: और अपने हृदय पर रखता हुआ बुद्धिमान हो जाएगा
  rationale: उपलब्ध इब्रानी पाठ प्राथमिक आधार है; यूनानी αὐτά निहित बहुवचन कर्म की पुष्टि करता है। इससे हिन्दी स्पष्ट होती है, पर कोई नया आशय नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘मनन’ और ‘हृदय में रखना’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल के चिंतन और आत्मसात करने के भाव को सुरक्षित रखते हैं।
