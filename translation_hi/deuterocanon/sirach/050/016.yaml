lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: उन्होंने जयघोष किया
  rationale: क्रिया सार्वजनिक और उपासना-संबंधी प्रसंग में ऊँची पुकार या सामूहिक घोष को व्यक्त करती है। ‘जयघोष किया’ उसके समारोहपूर्ण श्रव्य बल को बनाए रखता है, पर किसी वाद्य का उल्लेख नहीं जोड़ता।
- source_word: וַיַּשְׁמִיעוּ
  choice: सुनाया
  rationale: שמע के हिफ़इल रूप का अर्थ ‘सुनने योग्य करना’ या ‘सुनाना’ है। हिंदी में ‘सुनाया’ इस कारक अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קוֹל אַדִּיר
  choice: प्रबल नाद
  rationale: קוֹל का अर्थ ‘स्वर’ या ‘ध्वनि’ दोनों हो सकता है और אַדִּיר उसकी शक्ति या महत्ता बताता है। ‘प्रबल नाद’ उपासना के समारोहपूर्ण प्रसंग के अनुकूल है और इसे केवल बोली हुई वाणी तक सीमित नहीं करता।
- source_word: לְהַזְכִּיר
  choice: स्मरण कराया जाए
  rationale: זכר का हिफ़इल अनंत रूप स्मरण कराने या स्मारक-संबंधी धार्मिक कार्य का भाव रखता है। कर्म का उल्लेख मूल में नहीं है, इसलिए हिंदी में भी यह अनिर्दिष्ट रखा गया है।
- source_word: לִפְנֵי עֶלְיוֹן
  choice: परमप्रधान के सामने
  rationale: עֶלְיוֹן यहाँ परमेश्वर की उपाधि है; ‘परमप्रधान’ उसका प्रतिष्ठित और स्पष्ट हिंदी रूप है। ‘के सामने’ לִפְנֵי और आराधनात्मक उपस्थिति दोनों को सीधे व्यक्त करता है।
theological_decisions:
- issue: उपासना-संबंधी स्मरण का अर्थ
  choice: ताकि परमप्रधान के सामने स्मरण कराया जाए
  alternative: परमप्रधान के सामने स्मारक ठहरने के लिए
  rationale: इब्रानी क्रिया स्मरण कराने का भाव देती है, जबकि यूनानी समानांतर में ‘स्मारक/स्मरण’ की संज्ञात्मक भाषा है। मुख्य पाठ इब्रानी की क्रियात्मक रचना रखता है और पादटिप्पणी धार्मिक-स्मारक अर्थ की वास्तविक संभावना बताती है, बिना यह तय किए कि किसे या क्या स्मरण कराया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुरूप रखी गई है। ‘नाद’ समारोहपूर्ण ध्वनि को व्यक्त करता है; मूल इब्रानी में तुरहियों या हारून के पुत्रों का स्पष्ट उल्लेख न होने के कारण उन्हें अनुवाद में नहीं जोड़ा गया।
