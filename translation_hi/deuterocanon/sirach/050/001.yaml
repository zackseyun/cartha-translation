base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: hi
  text: अपने भाइयों में महान और अपनी प्रजा की शोभा, योहानान का पुत्र शिमोन याजक था।[a] उसके समय में भवन की मरम्मत हुई,[b] और उसके दिनों में मन्दिर को सुदृढ़ किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “ओनियास का पुत्र शिमोन, महायाजक” (शाब्दिक रूप से “महान याजक”)। यहाँ हिब्रू साक्ष्य में है: “योहानान का पुत्र शिमोन याजक।”'
    reason: alternative_reading
  - marker: b
    text: या, “भवन की देखभाल की गई” अथवा “भवन का जीर्णोद्धार हुआ।” हिब्रू क्रिया देखभाल या मरम्मत किए जाने का अर्थ दे सकती है; यूनानी समानांतर विशेष रूप से भवन पर किए गए निर्माण-कार्य की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: अपने भाइयों में महान
  rationale: यह वाक्यांश शाब्दिक रूप से शिमोन की उसके भाइयों के बीच महानता बताता है। इसे समानांतर पदबंध से मिलाकर ‘भाइयों की महिमा’ करना सम्भव है, पर ‘अपने भाइयों में महान’ हिब्रू संरचना और अर्थ को अधिक सीधे सुरक्षित रखता है।
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: और अपनी प्रजा की शोभा
  rationale: תִפְאֶרֶת में शोभा, गौरव और वैभव के अर्थ हैं। ‘शोभा’ यहाँ ऊँची काव्यात्मक प्रशंसा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: योहानान का पुत्र शिमोन
  rationale: नामों को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है; हिन्दी वाक्य-विन्यास के लिए पुत्र-संबंध पहले रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: हिब्रू पाठ में केवल ‘याजक’ है। यूनानी समानांतर में ‘महायाजक’ का आशय हो सकता है, जिसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
- source_word: נִפְקַד הַבָּיִת
  choice: भवन की मरम्मत हुई
  rationale: נפקד का निफ़ाल रूप देखभाल किए जाने या ध्यान दिए जाने को सूचित कर सकता है। मन्दिर-निर्माण के प्रसंग और यूनानी समानांतर के आधार पर ‘मरम्मत हुई’ सम्भावित स्थापत्य अर्थ को स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ मन्दिर-भवन अभिप्रेत है। ‘भवन’ अगले खंड के ‘मन्दिर’ से हिब्रू की शब्दगत भिन्नता बनाए रखता है।
- source_word: חֻזַּק הֵיכָל
  choice: मन्दिर को सुदृढ़ किया गया
  rationale: חֻזַּק का अर्थ मजबूत या दृढ़ किया जाना है। यह अनुवाद निष्क्रिय रूप और निर्माण-संबंधी अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: शिमोन की याजकीय उपाधि
  choice: याजक
  alternative: महायाजक / महान याजक
  rationale: प्राथमिक हिब्रू साक्ष्य הַכֹּהֵן अर्थात ‘याजक’ पढ़ता है, जबकि यूनानी में ἱερεὺς ὁ μέγας है। मुख्य पाठ हिब्रू का अनुसरण करता है और महत्त्वपूर्ण यूनानी भिन्नता पादटिप्पणी में सुरक्षित रखता है।
- issue: גְּדוֹל אֶחָיו का प्रशंसात्मक अर्थ
  choice: अपने भाइयों में महान
  alternative: अपने भाइयों की महिमा
  rationale: पहला विकल्प हिब्रू पदबंध का अधिक सीधा अर्थ देता है और समानांतर प्रशंसात्मक पंक्ति के प्रभाव को भी बनाए रखता है; रूपकात्मक विकल्प को बिना आवश्यकता मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली अपनाई गई है। ‘प्रजा’, ‘याजक’ और ‘मन्दिर’ बाइबिलीय प्रसंग के अनुकूल हैं, पर भाषा को अनावश्यक रूप से पुरातन नहीं बनाया गया।
