base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/027.yaml
  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: hi
  text: समझ की शिक्षा और अभिव्यक्ति-कौशल[a]—शिमोन, येशू का पुत्र, एलआज़ार का पुत्र और सीरा का पुत्र, द्वारा; जिसने अपने हृदय से बुद्धि उंडेल दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का ठीक अर्थ अनिश्चित है। इसका संकेत सुव्यवस्थित वाणी या रचना में कुशलता की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: गेनीज़ा की इब्रानी पांडुलिपि में अंतिम खंड का पाठ कठिन और अनिश्चित है। यूनानी समानांतर में है, “जिसने अपने हृदय से बुद्धि उंडेल दी”; मुख्य पाठ उसी के आधार पर अनूदित है।
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: समझ की शिक्षा
  rationale: מוּסַר में चरित्र-निर्माण करने वाली शिक्षा का भाव है और שֵׂכֶל उस शिक्षा को समझ-बूझ से संबंधित बताता है। आधुनिक हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: और अभिव्यक्ति-कौशल
  rationale: यह कठिन और संभवतः अस्थिर इब्रानी पदबंध है। प्रसंग और यूनानी समानांतर इसे व्यवस्थित या कुशल अभिव्यक्ति से जोड़ते हैं; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְשִׁמְעוֹן
  choice: शिमोन की रचना
  rationale: इस उपसंहार-सदृश वाक्य में לְ को रचना के श्रेय अथवा लेखकत्व के संकेत के रूप में समझना सर्वाधिक स्वाभाविक है।
- source_word: בֶּן יֵשׁוּעַ, בֶּן אֶלְעָזָר בֶּן סִירָא
  choice: जो येशू का पुत्र, एलआज़ार का पौत्र और सीरा का प्रपौत्र था
  rationale: लगातार आए בֶּן को हिन्दी की स्वाभाविक वंशावली-शैली में पुत्र, पौत्र और प्रपौत्र के रूप में स्पष्ट किया गया है।
- source_word: נִיבַּע / ἀνώμβρησεν
  choice: उंडेल दी
  rationale: इब्रानी क्रिया के फूट निकलने या बहने के बिंब और यूनानी ἀνώμβρησεν के प्रचुरता से बरसाने/उंडेलने के भाव को हिन्दी में सजीव रखा गया है।
- source_word: σοφίαν ἀπὸ καρδίας αὐτοῦ
  choice: अपने हृदय से बुद्धि
  rationale: अंतिम इब्रानी खंड कठिन और अनिश्चित है। उपलब्ध यूनानी समानांतर स्पष्ट रूप से ‘अपने हृदय से बुद्धि’ कहता है, इसलिए मुख्य पाठ में उसका सहारा लिया गया और पाठगत स्थिति पादटिप्पणी में बताई गई है।
