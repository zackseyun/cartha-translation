translation:
  language: hi
  text: तब हारून के पुत्र, याजक,[c] हथौड़े से गढ़ी हुई तुरहियों के साथ जयघोष करते थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ अधिक लम्बा समानान्तर वर्णन है: वह अर्घ चढ़ाने के लिए अपना हाथ बढ़ाता है और दाख का रक्त वेदी की नींवों पर उँडेलता है—परमप्रधान, सबके राजा, के लिए मनभावनी सुगन्ध। यहाँ उपलब्ध इब्रानी साक्ष्य में केवल तुरहियों के साथ जयघोष की पंक्ति है।'
    reason: textual_variant
  - marker: b
    text: या, “हथौड़े से गढ़ी हुई तुरहियों से ऊँचा नाद करते थे।” इब्रानी क्रिया ऊँचे जयघोष या संकेत-पुकार को व्यक्त कर सकती है; इस प्रसंग में वह तुरहियों के द्वारा सुनाई जाती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी साक्ष्यों में यहाँ ‘हारून के पुत्र’ और ‘याजक’ पाठों में भिन्नता है; उपलब्ध संयुक्त पाठ में दोनों दिए गए हैं।
    reason: textual_variant
