- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह ‘हारून के वंशज’ की समानाधिकरणीय पहचान है और इब्रानी की स्पष्टता को बनाए रखता है।
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियों से
  rationale: ये मन्दिर की उपासना-विधि में प्रयुक्त धातु की याजकीय तुरहियाँ हैं; ‘से’ साधन का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִקְשֶׁה
  choice: गढ़ी हुई
  rationale: यह धातु को पीटकर या हथौड़े से आकार देने की कारीगरी का तकनीकी संकेत है; ‘गढ़ी हुई’ आधुनिक हिन्दी में स्वाभाविक है और निर्माण-विधि का भाव रखता है।
theological_decisions:
- issue: इब्रानी पंक्ति और यूनानी के अधिक लम्बे समानान्तर पाठ का सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध इब्रानी पंक्ति का ही अनुवाद किया गया है और यूनानी के अतिरिक्त अर्घ तथा दाख के रक्त के विवरण को पादटिप्पणी में रखा गया है।
  alternative: यूनानी पाठ के आधार पर अर्घ चढ़ाने और वेदी पर दाख का रक्त उँडेलने का विवरण मुख्य पाठ में जोड़ना।
  rationale: जहाँ इब्रानी साक्ष्य उपलब्ध है, उसे प्राथमिकता देना उचित है। यूनानी में संरक्षित अतिरिक्त बलिदानी विवरण इस इब्रानी पंक्ति में नहीं है, इसलिए उसे मुख्य पाठ में मिलाना पाठान्तर को चुपचाप सुलझाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज धार्मिक गद्य। ‘हारून के वंशज’ याजकीय वंश को स्पष्ट करता है; ‘याजक’ समानाधिकरण में रखा गया है। ‘गढ़ी हुई तुरहियाँ’ मִקְשֶׁה की धातु-कारीगरी का भाव अत्यधिक तकनीकी भाषा के बिना व्यक्त करती हैं।
