  yaml_path: translation/deuterocanon/sirach/022/026.yaml
  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: hi
  text: और यदि उसके कारण[a] मुझ पर कोई विपत्ति आए, तो जो कोई यह सुनेगा, वह उससे सावधान रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके द्वारा मुझ पर कोई बुरी बात आ पड़े।”
    reason: διά के साथ कर्मकारक को कारणगत ‘उसके कारण’ अथवा साधन/माध्यमगत ‘उसके द्वारा’ समझा जा सकता है; साथ ही κακά का अधिक शाब्दिक रूप ‘कोई बुरी बात’ हो सकता है।
lexical_decisions:
- source_word: κακά
  choice: कोई विपत्ति
  rationale: नपुंसकलिंग बहुवचन यहाँ वक्ता पर आने वाली बुरी घटना, हानि या संकट को सूचित करता है। ‘कोई विपत्ति’ नैतिक बुराई का अर्थ थोपे बिना इस प्रतिकूल परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μοι
  choice: मुझ पर
  rationale: सम्प्रदान कारक उस व्यक्ति को दर्शाता है जो घटना से प्रभावित होता है। ‘विपत्ति आए’ के साथ ‘मुझ पर’ सहज हिन्दी प्रयोग है।
- source_word: συμβήσεται
  choice: आए
  rationale: क्रिया का अर्थ ‘घटित होना’ या ‘आ पड़ना’ है। ‘विपत्ति आए’ आधुनिक हिन्दी में घटना के घटने का भाव स्वाभाविक रूप से रखता है।
- source_word: διʼ αὐτόν
  choice: उसके कारण
  rationale: διά के साथ कर्मकारक कारण अथवा किसी की संलग्नता व्यक्त कर सकता है। ‘उसके कारण’ मुख्य पाठ में कारणगत अर्थ स्पष्ट करता है; ‘उसके द्वारा’ की साधनगत सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πᾶς ὁ ἀκούων
  choice: जो कोई यह सुनेगा
  rationale: विशेष्यवत् प्रयुक्त वर्तमान कृदन्त का आशय हर उस व्यक्ति से है जो इस बात को सुने। हिन्दी में ‘यह’ जोड़ने से सुनने की निहित विषयवस्तु स्पष्ट होती है, जबकि सार्वभौमिक अर्थ बना रहता है।
- source_word: φυλάξεται
  choice: सावधान रहेगा
  rationale: भविष्यत् मध्यम रूप अपने हित में सतर्कता बरतने का भाव देता है। ‘सावधान रहेगा’ हिन्दी में इस आत्मरक्षात्मक सतर्कता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπʼ αὐτοῦ
  choice: उससे
  rationale: ἀπό अलगाव या दूरी का भाव देता है। ‘उससे सावधान रहेगा’ उस व्यक्ति से बचकर रहने की बात स्पष्ट करता है।
theological_decisions:
- issue: πᾶς ὁ ἀκούων में व्याकरणिक पुल्लिंग का व्यापक प्रयोग
  choice: जो कोई यह सुनेगा
  alternative: हर पुरुष जो यह सुनेगा
  rationale: यूनानी पुल्लिंग एकवचन कृदन्त यहाँ किसी भी सुनने वाले व्यक्ति के लिए सामान्य रूप से प्रयुक्त है। ‘जो कोई’ अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित किए बिना उसी व्यापकता को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विपत्ति’ सामान्य पाठक के लिए बोधगम्य है और पद के प्रतिकूल-घटना वाले भाव को बनाए रखता है; ‘सावधान रहेगा’ शाब्दिक आत्मरक्षा की अपेक्षा स्वाभाविक हिन्दी में मध्यम वाच्य की आत्महितकारी सतर्कता व्यक्त करता है।
