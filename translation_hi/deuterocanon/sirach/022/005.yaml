lexical_decisions:
- source_word: πατέρα
  choice: अपने पिता
  rationale: यह καταισχύνει का सीधा कर्म है। यूनानी में संबंधवाचक सर्वनाम नहीं है, पर हिन्दी में ‘अपने पिता’ स्वाभाविक रूप से उसी स्त्री के पिता का संबंध स्पष्ट करता है।
- source_word: ἄνδρα
  choice: पति
  rationale: ‘पिता’ के साथ पारिवारिक सम्मान के संदर्भ में ἀνήρ का सबसे स्वाभाविक अर्थ ‘पति’ है, न कि सामान्यतः ‘पुरुष’।
- source_word: καταισχύνει
  choice: लज्जित करती है
  rationale: क्रिया किसी पर लज्जा या अपमान लाने का भाव रखती है। यह प्रयोग हिन्दी में सहज है और कारक अर्थ बनाए रखता है।
- source_word: ἡ θρασεῖα
  choice: निर्लज्ज स्त्री
  rationale: स्त्रीलिंग विशेषण संज्ञा के रूप में प्रयुक्त है और ऐसी स्त्री को दर्शाता है जो धृष्ट, उद्दंड या निर्लज्ज है। इस नीतिवचन-संदर्भ में इसका भाव प्रशंसनीय साहस नहीं, बल्कि नकारात्मक निर्लज्जता है।
- source_word: ὑπὸ ἀμφοτέρων
  choice: वे दोनों
  rationale: यह पहले बताए गए पिता और पति, दोनों की ओर संकेत करता है। सक्रिय हिन्दी वाक्य में इन्हें कर्ता बनाना अधिक स्वाभाविक है।
- source_word: ἀτιμασθήσεται
  choice: उसका अनादर करेंगे
  rationale: यूनानी भविष्यत् कर्मवाच्य का अर्थ है कि उसे उन दोनों से अनादर प्राप्त होगा। हिन्दी में सक्रिय रचना स्वाभाविक है और भविष्य का भाव सुरक्षित रहता है।
