translation:
  language: hi
  text: मित्र को आश्रय देने में मैं लज्जित न होऊँगा, और उसके सामने मैं कदापि न छिपूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, ‘उसके सामने से मैं कदापि न छिपूँगा’; क्रिया को ‘मैं उसके सामने से किसी भी रीति से छिपाया नहीं जाऊँगा’ भी समझा जा सकता है।
    reason: κρυβῶ के आत्मवाचक और संभावित निष्क्रिय अर्थों की अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: φίλον
  choice: मित्र को
  rationale: यह φίλος का कर्मकारक एकवचन है और यहाँ सामान्य अर्थ में प्रयुक्त है। हिन्दी में बिना स्वामित्वसूचक शब्द के ‘मित्र को’ यूनानी की अनिर्दिष्टता बनाए रखता है।
- source_word: σκεπάσαι
  choice: आश्रय देने में
  rationale: σκεπάζω का मूल भाव ढकना, आश्रय देना या रक्षा करना हो सकता है। प्रसंग में मित्र के पक्ष में सुरक्षात्मक सहारा देने का भाव है; ‘आश्रय देना’ रूपक और नैतिक आशय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: οὐκ αἰσχυνθήσομαι
  choice: मैं लज्जित न होऊँगा
  rationale: भविष्यकालीन रूप का सीधा अर्थ ‘लज्जित होना’ है। यह वाक्य की प्रतिज्ञात्मक शैली और नैतिक संदर्भ के अनुरूप है।
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: उसके सामने से
  rationale: πρόσωπον का शाब्दिक अर्थ ‘मुख’ है, पर ἀπὸ προσώπου एक मुहावरे के रूप में ‘किसी के सामने से’ या ‘उसकी उपस्थिति से’ व्यक्त करता है। ‘उसके सामने से’ शाब्दिक छवि और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: οὐ μὴ κρυβῶ
  choice: मैं कदापि न छिपूँगा
  rationale: οὐ μή के साथ aorist subjunctive प्रबल निषेध व्यक्त करता है। κρυβῶ का रूप निष्क्रिय या आत्मवाचक भाव दे सकता है; हिन्दी ‘न छिपूँगा’ जानबूझकर इस सूक्ष्म द्व्यर्थता को पूरी तरह समाप्त नहीं करता, जबकि ‘कदापि’ निषेध की प्रबलता दर्शाता है।
