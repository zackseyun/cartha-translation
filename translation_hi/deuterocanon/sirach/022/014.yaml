translation:
  language: hi
  text: सीसे से अधिक भारी क्या है? और ऐसे व्यक्ति का नाम “मूर्ख” के सिवा और क्या है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “सीसे से अधिक भारी क्या होगा? और उसका नाम ‘मूर्ख’ के सिवा क्या है?” यूनानी में यह एक संक्षिप्त लोकोक्ति है; मुख्य पाठ स्पष्टता के लिए इसे सहज बनाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: सीसे से अधिक
  rationale: यहाँ ὑπὲρ तुलनात्मक अर्थ देता है; आधुनिक हिन्दी में ‘सीसे से अधिक’ स्वाभाविक है। μόλυβον धातु ‘सीसा’ को दर्शाता है।
- source_word: τί βαρυνθήσεται
  choice: भारी क्या है
  rationale: यूनानी भविष्यत् कर्मवाच्य/मध्यवाच्य रूप इस संक्षिप्त लोकोक्ति में तुलनात्मक गुण व्यक्त करता है। हिन्दी में वर्तमानकालीन प्रश्न लोकोक्तिपरक भाव को स्वाभाविक रूप से रखता है।
- source_word: τί αὐτῷ ὄνομα
  choice: ऐसे व्यक्ति का नाम ... क्या है
  rationale: αὐτῷ व्याकरणतः ‘उसका/उसके लिए’ हो सकता है; अगले शब्द μωρός के पुल्लिंग और प्रसंग से व्यक्ति की ओर संकेत मिलता है। ‘ऐसे व्यक्ति’ हिन्दी में संदर्भ स्पष्ट करता है, बिना उसे किसी विशिष्ट व्यक्ति तक सीमित किए।
- source_word: ἀλλʼ ἢ
  choice: के सिवा और क्या
  rationale: यह पदबंध केवल एक उपयुक्त उत्तर प्रस्तुत करता है; हिन्दी का ‘के सिवा और क्या’ प्रश्न की अलंकारिक शक्ति बनाए रखता है।
- source_word: μωρός
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में μωρός के लिए ‘मूर्ख’ प्रचलित, गरिमापूर्ण और नैतिक-बौद्धिक अर्थवाला हिन्दी पर्याय है।
