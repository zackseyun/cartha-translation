  yaml_path: translation/deuterocanon/sirach/022/006.yaml
  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
translation:
  language: hi
  text: शोक के समय संगीत असमय की बात है,[a] पर कोड़ों की मार और अनुशासन हर समय बुद्धि की बातें हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “असमय का कथन।” यूनानी διήγησις का अर्थ ‘कथन’, ‘वर्णन’ या ‘बात’ हो सकता है; ἄκαιρος का अर्थ ‘असमय’ या ‘अनुचित समय का’ है।
    reason: διήγησις और ἄκαιρος के वैकल्पिक, संदर्भानुकूल अर्थों को दर्शाता है।
  - marker: b
    text: 'यूनानी में अभिव्यक्ति संक्षिप्त है: शाब्दिक रूप से, “कोड़ों की मार और अनुशासन ... बुद्धि के।” इसका अर्थ “बुद्धि की बातें हैं,” “बुद्धि से संबंधित हैं,” या “बुद्धि के अनुसार उचित हैं” भी समझा जा सकता है।'
    reason: σοφίας संबंधकारक में है और वाक्य में अपेक्षित संबंध अध्याहृत है; पादटिप्पणी इस वास्तविक व्याकरणिक अस्पष्टता को बनाए रखती है।
lexical_decisions:
- source_word: μουσικὰ
  choice: संगीत
  rationale: नपुंसकलिंग बहुवचन रूप संगीत या संगीत-प्रस्तुति को व्यापक रूप से दर्शाता है; ‘संगीत’ इसे केवल गायन तक सीमित नहीं करता।
- source_word: ἐν πένθει
  choice: शोक के समय
  rationale: यह पद शोक की परिस्थिति और समय, दोनों को सूचित करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἄκαιρος
  choice: बेसमय
  rationale: इसका मूल भाव उचित समय पर न होना है। ‘बेसमय’ पद के कालगत बल को बनाए रखता है और आगे के ‘हर समय’ से स्पष्ट विरोध बनाता है।
- source_word: διήγησις
  choice: बात
  rationale: शब्द का अर्थ वर्णन, कथन या वार्ता हो सकता है। यहाँ लोकोक्तिपरक वाक्य में ‘बात’ स्वाभाविक है और अर्थ को अनावश्यक रूप से औपचारिक या तकनीकी नहीं बनाती।
- source_word: μάστιγες
  choice: कोड़े की मार
  rationale: बहुवचन शब्द कोड़े या चाबुक से लगाए गए प्रहारों को दर्शाता है। ‘कोड़े की मार’ शारीरिक दंड के स्पष्ट अर्थ को नरम किए बिना सहज हिन्दी देता है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: प्रज्ञा-साहित्य में यह केवल शिक्षा नहीं, बल्कि सुधारने वाला प्रशिक्षण और ताड़ना भी समेटता है; ‘अनुशासन’ इस व्यापक सुधारात्मक अर्थ के उपयुक्त है।
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह सभी अवसरों में लागू होने का सामान्य भाव व्यक्त करता है और ‘बेसमय’ के साथ कालगत विरोध बनाए रखता है।
- source_word: σοφίας
  choice: बुद्धिमानी हैं
  rationale: यूनानी संबंधकारक यहाँ संक्षिप्त और अध्याहृत है। विधेयात्मक हिन्दी इसे लोकोक्तिपरक ढंग से प्रस्तुत करती है, जबकि पादटिप्पणी संभावित संबंधकारक अर्थों को सुरक्षित रखती है।
theological_decisions:
- issue: शारीरिक सुधार को स्वीकार करने वाली लोकोक्ति का नैतिक बल
  choice: शारीरिक पद को स्पष्ट रखते हुए ‘कोड़े की मार’ अनूदित किया गया है और उसे अनुशासन के साथ सुधारात्मक प्रज्ञा-वचन के रूप में प्रस्तुत किया गया है।
  alternative: μάστιγες को रूपक रूप में ‘फटकार’ कहना या शारीरिक अर्थ को नरम करना।
  rationale: यूनानी पाठ शारीरिक प्रहार और अनुशासन को स्पष्ट रूप से साथ रखता है। आधुनिक नैतिक असहजता के कारण मूल शब्द को नरम करना स्रोत में ऐसा अर्थ जोड़ देता जो वहाँ व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘बेसमय’ और ‘हर समय’ मूल के कालगत विरोध को सुनाई देने योग्य बनाते हैं। शारीरिक दंड का अर्थ न तो छिपाया गया है, न व्याख्यात्मक विस्तार से बढ़ाया गया है।
