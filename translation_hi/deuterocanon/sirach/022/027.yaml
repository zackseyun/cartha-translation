base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/027.yaml
  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: hi
  text: कौन मेरे मुँह पर पहरा और मेरे होंठों पर चतुर मुहर लगाएगा, ताकि मैं उसके कारण[a] न गिरूँ और मेरी जीभ मेरा नाश न कर दे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उसके’ का संदर्भ अस्पष्ट है; यह निकटवर्ती स्त्रीलिंग संज्ञाओं, जैसे ‘मुहर’ या ‘जीभ’, में से किसी की ओर संकेत कर सकता है।
    reason: मूल पाठ के स्त्रीलिंग सर्वनाम ἀπʼ αὐτῆς की संदर्भगत अस्पष्टता को बनाए रखते हुए संभावित पूर्वपदों को पाठानुकूल रूप में बताया गया है।
lexical_decisions:
- source_word: φυλακήν
  choice: पहरा
  rationale: यह मुँह की निगरानी और वाणी पर रोक—दोनों का स्वाभाविक और स्पष्ट बिंब बनाए रखता है।
- source_word: σφραγῖδα πανοῦργον
  choice: चतुर मुहर
  rationale: σφραγίς के ठोस बिंब को ‘मुहर’ से सुरक्षित रखा गया है और πανοῦργος की कुशल, सूझ-बूझ वाली शक्ति को ‘चतुर’ से व्यक्त किया गया है; इसे केवल ‘समझदार’ कहकर भाव को नरम नहीं किया गया।
- source_word: πέσω
  choice: गिरूँ
  rationale: मूल के रूपक और उसके नैतिक अर्थ की खुली गुंजाइश को बनाए रखता है।
- source_word: ἀπολέσῃ με
  choice: मेरा नाश न कर दे
  rationale: क्रिया की तीव्रता को बनाए रखता है और इसे केवल ‘मुसीबत में डाल दे’ जैसे हल्के अर्थ में नहीं बदलता।
theological_decisions:
- issue: ἀπʼ αὐτῆς में स्त्रीलिंग सर्वनाम का संदर्भ
  choice: ‘उसके कारण’ रखकर संदर्भ को खुला रखा गया
  alternative: ‘अपनी जीभ के कारण’ या ‘उस मुहर से’
  rationale: यूनानी पाठ में सर्वनाम का संदर्भ पूर्णतः स्पष्ट नहीं है। किसी एक संभावित संदर्भ को मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। ‘मुँह पर पहरा’ और ‘होंठों पर मुहर’ के समानांतर बिंब सुरक्षित हैं; वाक्य सामान्य पाठक के लिए सहज है, जबकि मूल की अस्पष्टता फुटनोट में स्पष्ट की गई है।
