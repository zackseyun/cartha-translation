translation:
  language: hi
  text: विवेकशील मन पर दृढ़ किया गया हृदय, घिसकर चिकनी की गई दीवार की रेतयुक्त सज्जा के समान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी की स्थापत्य-उपमा अत्यंत संक्षिप्त है। ‘रेतयुक्त’ और ‘घिसकर चिकनी की गई’ दीवार-सतह के शब्दों का सटीक तकनीकी अर्थ अनिश्चित है; इसे रेत-आधारित परिष्कार, लेप, या सज्जा भी समझा जा सकता है। उपमा का मुख्य भाव स्थिरता और सुदृढ़, सुगढ़ निर्माण है।
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: हृदय
  rationale: यहाँ शब्द केवल भावनाओं का नहीं, बल्कि विचार और संकल्प के भीतरी केंद्र का बोध कराता है; ‘हृदय’ बाइबलीय रूपक को बनाए रखता है।
- source_word: ἠδρασμένη
  choice: दृढ़ता से टिका
  rationale: कृदंत किसी वस्तु के स्थिर और मजबूती से स्थापित किए जाने की परिणामी अवस्था बताता है।
- source_word: ἐπὶ
  choice: पर
  rationale: यह हृदय की दृढ़ता को समझ-बूझ भरे चिंतन के आधार से जोड़ता है और यूनानी वाक्य की स्थानगत छवि को सुरक्षित रखता है।
- source_word: διανοίας συνέσεως
  choice: समझ-बूझ भरा चिंतन
  rationale: διανοία के विचार/चिंतन और σύνεσις की समझ/विवेक—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: κόσμος
  choice: सज्जा
  rationale: κόσμος का मूल भाव सुव्यवस्था या अलंकरण है; दीवार के संदर्भ में ‘सज्जा’ तैयार की गई बाहरी सतह या अलंकरण दोनों की संभावना खुली रखता है।
- source_word: ψαμμωτός
  choice: रेत-मिश्रित पलस्तर
  rationale: यह दुर्लभ विशेषण रेत से संबंधित है और संभवतः रेतयुक्त लेप या सतही उपचार को दर्शाता है; स्थापत्य संदर्भ में यह हिन्दी अभिव्यक्ति अधिक स्पष्ट है।
- source_word: τοίχου ξυστοῦ
  choice: घिसकर चिकनी की गई दीवार
  rationale: τοῖχος का अर्थ दीवार है, जबकि ξυστός खुरचकर, घिसकर या माँजकर तैयार की गई सतह का संकेत देता है।
