  verdict: revise
  source_fidelity: The draft correctly conveys poverty, steadfast presence in distress, shared satisfaction, and joint participation in an inheritance. However, “अपने पड़ोसी का भरोसा अर्जित करो” changes the Greek μετὰ τοῦ πλησίον (“with your neighbor”) into an object/genitive relationship (“your neighbor’s trust”). The source more naturally calls for establishing or gaining trust in companionship with the neighbor. “समृद्धि” is a permissible contextual interpretation of ἀγαθά but narrows the source’s broader “good things/goods.”
  naturalness: The Hindi is generally modern, clear, and suitably dignified. “निर्धनता में अपने पड़ोसी के साथ भरोसा कायम करो” is both natural and closer to the Greek relationship. “एक साथ तृप्त हो सको” directly represents ὁμοῦ. “विरासत में उसके साथ सहभागी हो सको” is idiomatic Hindi and conveys the compound sense of inheriting jointly.
  terminology: “भरोसा” is contextually appropriate for πίστις in this interpersonal wisdom saying; the note preserves “विश्वास” and “निष्ठा.” “पड़ोसी,” “निर्धनता,” “संकट,” and “विरासत” are suitable modern-standard Hindi equivalents. The footnote anchors should remain on भरोसा and अच्छी वस्तुओं, respectively.
  issues:
  - severity: medium
    issue: The phrase “अपने पड़ोसी का भरोसा अर्जित करो” shifts μετὰ τοῦ πλησίον.
    rationale: μετά with the genitive means “with [one’s] neighbor,” not “the neighbor’s.” Although gaining another person’s trust is related conceptually, it is not what the Greek explicitly says.
  - severity: low
    issue: “समृद्धि” narrows ἐν τοῖς ἀγαθοῖς αὐτοῦ.
    rationale: ἀγαθά can include good things, goods, benefits, or prosperity. “अच्छी वस्तुओं” preserves the source’s breadth in the main text; possible contextual senses can remain in the note.
