- from: निर्धनता में अपने पड़ोसी का भरोसा अर्जित करो[a], ताकि उसकी समृद्धि[b] में तुम भी उसके साथ तृप्त हो सको। संकट के समय उसके साथ बने रहो, ताकि उसकी विरासत तुम भी उसके साथ पा सको।
  to: निर्धनता में अपने पड़ोसी के साथ भरोसा कायम करो[a], ताकि उसकी अच्छी वस्तुओं[b] में तुम उसके साथ एक साथ तृप्त हो सको। संकट के समय उसके साथ बने रहो, ताकि तुम उसकी विरासत में उसके साथ सहभागी हो सको।
  rationale: The revision restores the Greek relational force of μετὰ τοῦ πλησίον by using “अपने पड़ोसी के साथ,” rather than making the neighbor the grammatical possessor of trust. It also retains the semantic breadth of ἀγαθά in the main text, while documenting “समृद्धि” as a viable alternative. The remaining revisions make the shared nature of ὁμοῦ and συνκληρονομήσῃς explicit in natural Hindi without specifying the nature of the inheritance.
