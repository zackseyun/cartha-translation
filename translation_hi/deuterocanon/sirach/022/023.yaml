base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: hi
  text: निर्धनता में अपने पड़ोसी के साथ भरोसा कायम करो[a], ताकि उसकी अच्छी वस्तुओं[b] में तुम उसके साथ एक साथ तृप्त हो सको। संकट के समय उसके साथ बने रहो, ताकि तुम उसकी विरासत में उसके साथ सहभागी हो सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पड़ोसी के साथ विश्वास अथवा निष्ठा का संबंध बनाओ।” यहाँ πίστις का अर्थ पारस्परिक भरोसा, विश्वसनीयता या निष्ठा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी समृद्धि में।” शाब्दिक रूप से, “उसकी अच्छी वस्तुओं में”; इसका अर्थ उसकी संपत्ति, उपलब्ध लाभों या अच्छे दिनों से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: भरोसा अर्जित करो
  rationale: यहाँ मित्रता और पारस्परिक निष्ठा का प्रसंग है, इसलिए πίστις का संबंधपरक अर्थ ‘भरोसा’ अधिक स्वाभाविक है। κτῆσαι के ‘प्राप्त करना/अर्जित करना’ भाव को भी बनाए रखा गया है।
- source_word: ἐν πτωχείᾳ
  choice: निर्धनता में
  rationale: πτωχεία का सीधा अर्थ निर्धनता या गरीबी है। यूनानी पाठ यह स्पष्ट नहीं करता कि निर्धनता किसकी है, इसलिए हिन्दी में भी स्वामित्व नहीं जोड़ा गया।
- source_word: μετὰ τοῦ πλησίον
  choice: अपने पड़ोसी का
  rationale: समूचे वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करने के लिए μετὰ का संबंधपरक भाव ‘पड़ोसी का भरोसा’ के रूप में आया है। πλησίον के लिए स्थापित और व्यापक ‘पड़ोसी’ रखा गया है।
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ
  choice: उसकी समृद्धि में
  rationale: बहुवचन ἀγαθά यहाँ अच्छी वस्तुओं, संपत्ति, लाभ या समृद्ध दशा को सूचित कर सकता है। निर्धनता के साथ विरोध को देखते हुए ‘समृद्धि’ सहज है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ὁμοῦ πλησθῇς
  choice: तुम भी उसके साथ तृप्त हो सको
  rationale: πληρόω के भरने अथवा तृप्त होने के बिंब और ὁμοῦ के ‘साथ’ भाव, दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐν καιρῷ θλίψεως
  choice: संकट के समय
  rationale: θλῖψις के क्लेश, विपत्ति या संकट के अर्थ को सामान्य आधुनिक हिन्दी में ‘संकट’ व्यक्त करता है।
- source_word: διάμενε αὐτῷ
  choice: उसके साथ बने रहो
  rationale: διαμένω निरंतर टिके रहने और निष्ठापूर्वक साथ देने का भाव रखता है; ‘बने रहो’ इसे संक्षेप में व्यक्त करता है।
- source_word: συνκληρονομήσῃς ἐν τῇ κληρονομίᾳ αὐτοῦ
  choice: उसकी विरासत तुम भी उसके साथ पा सको
  rationale: συνκληρονομέω का संयुक्त रूप से विरासत पाने का अर्थ स्पष्ट किया गया है, पर इसे बाद की किसी विशिष्ट धर्मवैज्ञानिक पारिभाषिकता से नहीं जोड़ा गया।
theological_decisions:
- issue: मित्रता के प्रसंग में πίστις का अर्थ
  choice: भरोसा
  alternative: विश्वास; विश्वसनीयता; निष्ठा
  rationale: इस पद में निर्धनता, संकट और पड़ोसी के साथ बने रहने की बात है; अतः अमूर्त या केवल धार्मिक ‘विश्वास’ की अपेक्षा पारस्परिक भरोसा संदर्भानुकूल है। अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- issue: संयुक्त विरासत का स्वरूप
  choice: उसकी विरासत तुम भी उसके साथ पा सको
  alternative: उसकी विरासत में उसके सह-उत्तराधिकारी बन सको
  rationale: यूनानी संयुक्त रूप से विरासत पाने की बात करता है, पर यह पद उस विरासत के स्वरूप को परिभाषित नहीं करता। इसलिए पाठ को सामान्य और खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘निर्धनता’, ‘समृद्धि’, ‘संकट’ और ‘विरासत’ स्रोत के प्रमुख बिंबों को बनाए रखते हैं। पादटिप्पणी [b] को सही पदांश ‘समृद्धि’ पर लगाया गया है; उपलब्ध अंग्रेज़ी परत में उसका चिह्न असंगत स्थान पर था।
