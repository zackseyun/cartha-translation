base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: hi
  text: जैसे भवन में कसकर जोड़ा गया लकड़ी का बंधन भूकंप में अलग नहीं होगा[a], वैसे ही विचारपूर्ण परामर्श पर दृढ़ किया गया हृदय संकट के समय साहस नहीं खोएगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अलग नहीं होगा’ का अनुवाद ‘खुल नहीं जाएगा’ या ‘टूटकर बिखर नहीं जाएगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विचारपूर्ण परामर्श’ के लिए यूनानी पदबंध संक्षिप्त है; अर्थ ‘सोच-विचारकर किया गया निश्चय’ या ‘सोची-समझी योजना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘समय में’ या ‘उस घड़ी में’; प्रसंग किसी परीक्षा या संकट की घड़ी का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: लकड़ी का बंधन
  rationale: ἱμάντωσις किसी बाँधने या कसने वाली पट्टी/व्यवस्था को दर्शाता है और ξυλίνη उसकी सामग्री को लकड़ी बताता है। ‘लकड़ी का बंधन’ संरचनात्मक उपमा को बिना अनावश्यक रूप से उसका रूप निश्चित किए सुरक्षित रखता है।
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: भवन में कसकर जोड़ा गया
  rationale: पूर्ण कृदन्त स्थायी रूप से बाँधे या जड़े होने की दशा बताता है; εἰς οἰκοδομήν उसके भवन की संरचना में सम्मिलित होने को सूचित करता है।
- source_word: ἐν συσσεισμῷ
  choice: भूकंप में
  rationale: संज्ञा तीव्र सामूहिक कंपन को दर्शाती है और इस निर्माण-संबंधी संदर्भ में स्वाभाविक अर्थ ‘भूकंप’ है।
- source_word: οὐ διαλυθήσεται
  choice: अलग नहीं होगा
  rationale: διαλύω यहाँ संरचना के खुल जाने, बिखरने या उसके जोड़ टूट जाने का भाव रखता है। ‘अलग नहीं होगा’ बंधन की उपमा के अनुकूल है।
- source_word: καρδία ἐστηριγμένη
  choice: स्थिर किया गया हृदय
  rationale: καρδία के बाइबलीय हृदय-संबंधी व्यापक अर्थ को बनाए रखा गया है, जबकि ἐστηριγμένη दृढ़ और स्थिर की गई अवस्था व्यक्त करता है।
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: सोच-विचारकर किए गए निश्चय पर
  rationale: संक्षिप्त यूनानी पदबंध में διανόημα का विचार/अभिप्राय और βουλή का विचार-विमर्श/निश्चय दोनों सम्मिलित हैं। यह अनुवाद दोनों पक्षों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν καιρῷ
  choice: संकट के समय
  rationale: शाब्दिक अर्थ ‘समय/अवसर में’ है, पर भूकंप और साहस न खोने का प्रसंग परीक्षा या संकट की घड़ी का संकेत देता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οὐ δειλιάσει
  choice: साहस नहीं खोएगा
  rationale: क्रिया डरपोक या कायर हो जाने, अथवा भय से पीछे हटने का भाव देती है। ‘साहस नहीं खोएगा’ आधुनिक हिन्दी में इस आंतरिक प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: καρδία का मानवशास्त्रीय अर्थ
  choice: हृदय
  alternative: मन; अंतरात्मा
  rationale: यहाँ बौद्धिक विचार के साथ नैतिक संकल्प और साहस भी सम्मिलित हैं। ‘हृदय’ बाइबलीय व्यापकता बनाए रखता है और अर्थ को केवल बुद्धि तक सीमित नहीं करता।
- issue: ἐν καιρῷ में निहित परिस्थिति
  choice: संकट के समय
  alternative: समय पर; उस घड़ी में
  rationale: स्रोत में संकट का संज्ञात्मक उल्लेख नहीं है, पर कंपन और भय न खाने की समानांतर उपमा प्रतिकूल परीक्षा की घड़ी का संकेत करती है। पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, कहावत-सदृश तुलना रखी गई है। ‘बंधन’, ‘हृदय’ और ‘साहस’ जैसे परिचित शब्द मूल की संरचनात्मक और आंतरिक दृढ़ता की समानता बनाए रखते हैं। सभी व्याख्यात्मक विस्तार सीमित रखे गए हैं और वास्तविक शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
