  source_fidelity: 'The Hindi accurately retains the Greek''s terse nominal comparison: mourning associated with a dead person is seven days, whereas the corresponding duration for a fool and an ungodly man is all the days of his life. It does not over-explain the deliberately elliptical second clause or resolve its interpretive tension beyond the source.'
  naturalness: “मृतक के लिए शोक सात दिन तक रहता है” is clear, idiomatic modern Hindi. The verbless ending, “पर मूर्ख और अधर्मी मनुष्य के लिए उसके जीवन के सारे दिन,” is intentionally compressed but remains intelligible as a parallel wisdom saying and appropriately reflects the Greek ellipsis.
  terminology: “शोक” suitably renders πένθος; “मूर्ख” preserves the wisdom-literature force of μωρός; and “अधर्मी” is an appropriate, natural rendering of ἀσεβής. “मनुष्य” and “उसके” preserve the representative masculine-singular form without making an unwarranted doctrinal claim. The footnote accurately explains the generic potential of the Greek masculine forms.
