base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: hi
  text: मृतक के लिए शोक सात दिन तक रहता है; पर मूर्ख और अधर्मी मनुष्य[a] के लिए उसके जीवन के सारे दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख और अधर्मी व्यक्ति।” यूनानी में पुल्लिंग एकवचन रूप हैं, जिनका प्रयोग इस नीति-वचन में सामान्य अर्थ में हो सकता है।
    reason: प्रतिनिधिक पुल्लिंग रूप और उसका स्वाभाविक हिन्दी विकल्प स्पष्ट करना।
lexical_decisions:
- source_word: πένθος
  choice: शोक
  rationale: यह शब्द मृतक के कारण किए जाने वाले मातम या शोक को दर्शाता है। ‘शोक’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: νεκροῦ
  choice: मृतक के लिए
  rationale: यूनानी संबंधकारक एक मृत व्यक्ति को सामान्य रूप से प्रस्तुत करता है। ‘मृतक के लिए’ संक्षिप्त है और शोक के प्रसंग को स्पष्ट रखता है।
- source_word: ἑπτὰ ἡμέραι
  choice: सात दिन तक
  rationale: समयावधि को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
- source_word: μωροῦ
  choice: मूर्ख
  rationale: नीति-साहित्य में यह केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक समझ से रहित व्यक्ति को दर्शाता है; ‘मूर्ख’ इस अर्थ को बनाए रखता है।
- source_word: ἀσεβοῦς
  choice: अधर्मी मनुष्य
  rationale: ἀσεβής परमेश्वर के प्रति श्रद्धाहीन और धर्मविरुद्ध व्यक्ति को दर्शाता है। ‘अधर्मी’ सामान्य हिन्दी में स्पष्ट है; ‘मनुष्य’ यूनानी के प्रतिनिधिक पुल्लिंग एकवचन को व्यक्त करता है।
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: उसके जीवन के सारे दिन
  rationale: यह अनुवाद यूनानी संरचना और पहले खंड के ‘सात दिन’ के साथ तुलना को बनाए रखता है, बिना यह स्पष्ट किए कि दीर्घ शोक किस प्रकार उत्पन्न होता है।
theological_decisions:
- issue: नीति-वचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘अधर्मी मनुष्य’ और ‘उसके जीवन’ के रूप में पुल्लिंग एकवचन बनाए रखा गया है।
  alternative: ‘अधर्मी व्यक्ति ... उसके जीवन’ अथवा बहुवचन रूप
  rationale: यूनानी में μωροῦ, ἀσεβοῦς और αὐτοῦ पुल्लिंग एकवचन हैं, पर नीति-वचन में उनका प्रयोग सामान्य मानवीय श्रेणी के लिए हो सकता है। मुख्य पाठ स्रोत का व्याकरणिक रूप रखता है और पादटिप्पणी उसके सामान्य प्रयोग को स्पष्ट करती है।
- issue: दूसरे खंड की लुप्त क्रिया और अर्थगत तनाव
  choice: ‘पर ... उसके जीवन के सारे दिन’ के रूप में मूल की संक्षिप्त, लुप्त-क्रियात्मक तुलना बनाए रखी गई है।
  alternative: ‘पर मूर्ख और अधर्मी के कारण जीवन भर शोक रहता है’
  rationale: यूनानी दूसरे खंड में क्रिया को दोहराता नहीं और संबंध को स्पष्ट रूप से ‘के कारण’ नहीं कहता। अधिक व्याख्यात्मक अनुवाद वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीति-साहित्य के अनुरूप गरिमापूर्ण रखी गई है। दूसरे खंड की असामान्य संक्षिप्तता जानबूझकर सुरक्षित है, ताकि मूल यूनानी की अर्थगत तीक्ष्णता और अस्पष्टता बनी रहे।
