base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: hi
  text: ऊँघते हुए व्यक्ति को कोई बात सुनाना मूर्ख को सुनाने के समान है[a]; और अंत में वह कहेगा, “वह क्या था?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य की रचना कुछ असहज है और उसमें ‘सुनानेवाला’ (διηγούμενος ... ὁ διηγούμενος) दोहराया गया है। आशय तुलना का है: ऊँघते हुए व्यक्ति को कुछ सुनाना मूर्ख को सुनाने के समान है।'
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος (διηγέομαι)
  choice: कोई बात सुनाना
  rationale: यह क्रिया किसी बात का विस्तार से वर्णन या वृत्तांत सुनाने को दर्शाती है। यूनानी में कर्म व्यक्त नहीं है, इसलिए सहज हिन्दी में व्यापक अभिव्यक्ति ‘कोई बात सुनाना’ रखी गई है।
- source_word: νυστάζοντι
  choice: ऊँघते हुए व्यक्ति को
  rationale: यह शब्द उनींदे होने या झपकी लेने की अवस्था बताता है। ‘ऊँघते हुए’ श्रोता की असावधानी का चित्र स्वाभाविक ढंग से सामने लाता है।
- source_word: μωρῷ
  choice: मूर्ख को
  rationale: ज्ञान-साहित्य में μωρός प्रायः नैतिक और व्यावहारिक विवेक से रहित व्यक्ति को दर्शाता है; ‘मूर्ख’ हिन्दी बाइबलीय ज्ञान-साहित्य में इसका उपयुक्त और परिचित रूप है।
- source_word: ἐπὶ συντελείᾳ
  choice: अंत में
  rationale: यह कथन या वर्णन की समाप्ति को सूचित करता है; ‘अंत में’ संक्षिप्त और स्वाभाविक है।
- source_word: Τί ἐστιν;
  choice: वह क्या था?
  rationale: शाब्दिक रूप ‘यह क्या है?’ हो सकता है, पर प्रसंग में व्यक्ति अभी समाप्त हुई बात के विषय में पूछ रहा है। ‘वह क्या था?’ यूनानी प्रश्न की संक्षिप्तता और श्रोता की अनभिज्ञता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
