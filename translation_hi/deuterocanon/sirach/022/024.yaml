  yaml_path: translation/deuterocanon/sirach/022/024.yaml
  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: hi
  text: आग से पहले भट्ठी की भाप और धुआँ उठते हैं; उसी तरह रक्तपात[a] से पहले गाली-गलौज[b] होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘रक्तों’ है; यह रक्तपात या हिंसक कृत्यों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इसके अन्य अनुवाद ‘अपमान,’ ‘निंदा’ या ‘कटु वचन’ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ πυρὸς
  choice: आग से पहले
  rationale: 'πρό संबंधकारक के साथ समयगत पूर्वता बताता है। इससे उपमा का पहला भाग स्पष्ट रहता है: भाप और धुआँ आग के पहले दिखाई देते हैं।'
- source_word: ἀτμὶς καμίνου
  choice: भट्ठी की भाप
  rationale: ἀτμίς का अर्थ भाप या वाष्प है और καμίνος तीव्र आग वाली भट्ठी को दर्शाता है। यह सहज हिन्दी में मूल बिंब को बनाए रखता है।
- source_word: καπνός
  choice: धुआँ
  rationale: यह यूनानी संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: οὕτως
  choice: उसी तरह
  rationale: यह भौतिक बिंब और नैतिक चेतावनी के बीच स्पष्ट तुलना स्थापित करता है।
- source_word: αἱμάτων
  choice: रक्तपात
  rationale: यूनानी में बहुवचन ‘रक्तों’ का प्रयोग हिंसक रक्तपात के अर्थ में मुहावरेदार है; शाब्दिक ‘रक्तों’ की अपेक्षा ‘रक्तपात’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: λοιδορία
  choice: गाली-गलौज
  rationale: यह शब्द अपमानजनक, निंदात्मक या कटु वाणी को दर्शाता है। ‘गाली-गलौज’ सामान्य पाठक के लिए स्वाभाविक है और हिंसा से पहले बढ़ते मौखिक वैर का भाव व्यक्त करता है।
theological_decisions:
- issue: कटु वाणी से हिंसा की ओर बढ़ने का नैतिक क्रम
  choice: पद को ऐसी नीतिवाणी के रूप में प्रस्तुत किया गया है जिसमें गाली-गलौज रक्तपात से पहले आती है।
  alternative: अपमान अनिवार्य रूप से हत्या का कारण बनता है; अथवा कटु वाणी रक्तपात के साथ-साथ होती है।
  rationale: दोनों खंडों में πρὸ समयगत पूर्वता बताता है। अनुवाद चेतावनी के क्रम को बनाए रखता है, पर यह अतिरिक्त दावा नहीं करता कि हर मौखिक अपमान अनिवार्य रूप से हिंसा उत्पन्न करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भट्ठी की भाप और धुआँ उठते हैं’ हिन्दी में आवश्यक क्रिया जोड़कर यूनानी के संक्षिप्त कथन को स्वाभाविक बनाता है। दोनों ‘से पहले’ मूल में दोहराए गए πρὸ को सुरक्षित रखते हैं।
