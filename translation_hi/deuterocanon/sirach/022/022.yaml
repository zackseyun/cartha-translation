base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: hi
  text: यदि तुम किसी मित्र के विरुद्ध अपना मुँह खोलो, तो मत डरो[a], क्योंकि मेल-मिलाप हो सकता है। पर अपमान, अहंकार, किसी भेद को खोल देने और कपटपूर्ण वार के मामले में ऐसा नहीं होता; इन बातों के कारण हर मित्र दूर भाग जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ “डरना” या “सावधान होना” हो सकता है। यहाँ अगली बात—कि मेल-मिलाप हो सकता है—इस ओर संकेत करती है कि अपराध के बाद भी आशा नहीं छोड़नी चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: किसी मित्र के विरुद्ध
  rationale: ἐπί + कर्मकारक यहाँ मित्र को लक्ष्य बनाकर प्रतिकूल या आहत करने वाली बात कहने का भाव दे सकता है; आगे मेल-मिलाप का उल्लेख इसी अर्थ का समर्थन करता है।
- source_word: ἀνοίξῃς στόμα
  choice: अपना मुँह खोलो
  rationale: यूनानी मुहावरे की ठोस अभिव्यक्ति हिन्दी में भी स्वाभाविक और बोधगम्य है।
- source_word: μὴ εὐλαβηθῇς
  choice: मत डरो
  rationale: क्रिया में डरने या आशंकित होने का अर्थ है। अगला वाक्यांश बताता है कि अपराध के बाद भी मेल-मिलाप की आशा छोड़ी नहीं जानी चाहिए; इस संदर्भगत संकेत को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διαλλαγή
  choice: मेल-मिलाप
  rationale: यह बिगड़े हुए संबंधों के फिर से सुधरने को दर्शाता है और आधुनिक हिन्दी में सहज है।
- source_word: πλὴν
  choice: पर ... के मामले में ऐसा नहीं होता
  rationale: यहाँ शब्द मेल-मिलाप की संभावना से कुछ अपराधों को अपवाद के रूप में अलग करता है।
- source_word: ὀνειδισμοῦ
  choice: अपमान
  rationale: यह तिरस्कारपूर्ण निंदा या बेइज्जती को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπερηφανίας
  choice: अहंकार
  rationale: यह दूसरों के प्रति प्रकट होने वाले दंभी गर्व का उपयुक्त आधुनिक हिन्दी रूप है।
- source_word: μυστηρίου ἀποκαλύψεως
  choice: किसी भेद को खोल देना
  rationale: ज्ञान-साहित्य के इस संदर्भ में μυστήριον किसी गोपनीय बात का द्योतक है, किसी धर्मवैज्ञानिक रहस्य का नहीं।
- source_word: πληγῆς δολίας
  choice: कपटपूर्ण वार
  rationale: यह अभिव्यक्ति छल और चोट दोनों को बनाए रखती है तथा वार को शाब्दिक या रूपकात्मक मानने की गुंजाइश छोड़ती है।
- source_word: ἀποφεύξεται πᾶς φίλος
  choice: हर मित्र दूर भाग जाएगा
  rationale: ἀποφεύξεται केवल बचने की नहीं, संबंध से पूरी तरह हट जाने की तीव्रता रखता है; πᾶς φίλος का वितरणात्मक भाव 'हर मित्र' से व्यक्त होता है।
