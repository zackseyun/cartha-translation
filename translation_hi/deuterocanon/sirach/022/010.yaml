  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: hi
  text: मृतक के लिए अधिक कोमलता से रोओ[a], क्योंकि उसे विश्राम मिल गया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘अधिक मधुरता से’ या ‘अधिक सुखद ढंग से’ भी हो सकता है; इस प्रसंग में इसका भाव संभवतः अधिक कोमलता या संयम से रोने का है।
    reason: यूनानी ἥδιον का मूल अर्थ ‘अधिक मधुर/सुखद ढंग से’ है; पादटिप्पणी इस शाब्दिक अर्थ-छाया को सुरक्षित रखते हुए प्रसंगानुकूल हिन्दी को स्पष्ट करती है।
lexical_decisions:
- source_word: ἥδιον
  choice: अधिक शांत भाव से
  rationale: यह ἡδύς से बना तुलनात्मक क्रियाविशेषण है, जिसका मूल भाव ‘अधिक मधुरता/सुखद ढंग से’ है। शोक के प्रसंग में शाब्दिक हिन्दी भ्रामक होगी; ‘अधिक शांत भाव से’ तुलनात्मक बल रखते हुए संयत या कोमल विलाप का प्रसंगानुकूल अर्थ देता है। मूल शब्द की असामान्य अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- source_word: κλαῦσον
  choice: रोओ
  rationale: κλαίω का एकवचन आज्ञार्थक रूप है। ‘रोओ’ सीधा, स्वाभाविक और आधुनिक हिन्दी रूप है; ‘विलाप करो’ अपेक्षाकृत अधिक औपचारिक और व्याख्यात्मक होता।
- source_word: ἐπὶ νεκρῷ
  choice: मृतक के लिए
  rationale: ἐπί के साथ दत्तिव यहाँ शोक के विषय को सूचित करता है। ‘मृतक के लिए’ स्वाभाविक हिन्दी है और यूनानी एकवचन νεκρῷ को बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध स्पष्ट रखता है।
- source_word: ἀνεπαύσατο
  choice: उसे विश्राम मिल गया है
  rationale: मध्यवाच्य क्रिया का अर्थ विश्राम पाना है। यह हिन्दी में पूर्ण हुई अवस्था को स्वाभाविक ढंग से व्यक्त करता है और दफनाए जाने या परलोक के बारे में कोई अतिरिक्त धारणा नहीं जोड़ता।
theological_decisions:
- issue: मृत्यु को विश्राम के रूप में प्रस्तुत करना
  choice: ‘उसे विश्राम मिल गया है’ कहकर मूल के विश्राम-संबंधी भाव को बनाए रखा गया है, पर उसका धर्मसैद्धांतिक विस्तार नहीं किया गया।
  alternative: ‘वह सो गया है’ अथवा ‘उसे कब्र में सुला दिया गया है’
  rationale: यूनानी पाठ यहाँ मृत्यु को ज्ञान-साहित्य की भाषा में विश्राम बताता है, पर मध्यवर्ती अवस्था, पुनरुत्थान या दफनाने की प्रक्रिया के बारे में स्पष्ट कथन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन आज्ञार्थक ‘रोओ’ तथा एकवचन ‘मृतक’ मूल की व्याकरणिक संरचना का अनुसरण करते हैं। अंतिम अल्पविराम दिए गए स्रोत-अंश के अधूरे वाक्यांश होने को दर्शाता है।
