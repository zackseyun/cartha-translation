- source_word: ζωὴ πονηρά
  choice: बुरा जीवन
  rationale: πονηρά नैतिक बुराई और दुःखदायी या निकृष्ट दशा—दोनों का संकेत दे सकता है। ‘बुरा जीवन’ इस व्यापकता को बनाए रखता है और केवल ‘दुखी’ या केवल ‘दुष्ट’ अर्थ तक सीमित नहीं करता।
