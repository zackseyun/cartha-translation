base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: hi
  text: मूर्ख के साथ बातों को न बढ़ाओ, और किसी नासमझ व्यक्ति के पास न जाओ। उससे बचकर रहो, ताकि तुम्हें कष्ट न उठाना पड़े और उसके झटकने[a] से तुम अशुद्ध न हो जाओ। उससे अलग हट जाओ, तब तुम्हें विश्राम मिलेगा और तुम उसकी मूढ़ता से थकोगे नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है। उसका मूल भाव ‘झटकने’ या ‘झाड़ देने’ का हो सकता है; व्यापक अर्थ में यह मूर्ख के उपद्रवी विस्फोटों या उसके आचरण के दूषित प्रभाव की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος μὴ πληθύνῃς λόγον
  choice: मूर्ख के साथ बहुत बातें न करो
  rationale: ‘बहुत बातें न करो’ यूनानी के शाब्दिक ‘वचन को न बढ़ाओ’ का स्वाभाविक हिन्दी रूप है और नीतिवचन-जैसी संक्षिप्तता बनाए रखता है।
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: किसी समझहीन व्यक्ति के पास न जाओ
  rationale: πορεύου की गतिसूचकता ‘जाओ’ में बनी रहती है, जबकि ἀσύνετος को बौद्धिक क्षमता के तकनीकी आकलन के बजाय समझ-विवेक की कमी बताने वाले ‘समझहीन’ से व्यक्त किया गया है।
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: उससे बचकर रहो
  rationale: यह आत्म-सुरक्षात्मक दूरी की आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κόπον ἔχῃς
  choice: तुम्हें कष्ट न उठाना पड़े
  rationale: κόπος यहाँ परिश्रम के साथ उससे उपजने वाली परेशानी और बोझ का भाव रखता है; ‘कष्ट उठाना’ दोनों को स्वाभाविक रूप से समेटता है।
- source_word: μολυνθῇς
  choice: तुम अशुद्ध न हो जाओ
  rationale: यह क्रिया दूषित या अपवित्र होने का प्रबल भाव रखती है; ‘अशुद्ध’ उसके नैतिक-सामाजिक संकेत को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: उसके झटकने से
  rationale: दुर्लभ संज्ञा में झटकने या झाड़ देने का मूल चित्र है। अपेक्षाकृत प्रत्यक्ष अनुवाद रखा गया है और उसकी अनिश्चित व्यापकता पादटिप्पणी में बताई गई है।
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: उससे अलग हट जाओ
  rationale: यह ἔκκλινον के दिशा बदलकर दूर होने के सजीव भाव को रखता है और पहले दिए आत्म-सुरक्षात्मक निर्देश से पर्याप्त भिन्न है।
- source_word: ἀνάπαυσιν
  choice: विश्राम
  rationale: यह ἀνάπαυσις का सीधा और प्रसंगानुकूल रूप है, जिसमें राहत का भाव भी निहित है।
- source_word: οὐ μὴ ἀκηδιάσῃς ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: तुम उसकी मूढ़ता से नहीं ऊबोगे
  rationale: ἀκηδιάω की थकान, खिन्नता या ऊब की अर्थ-सीमा में ‘ऊबना’ इस पारस्परिक प्रसंग में स्वाभाविक है। ἀπόνοια को ‘मूढ़ता’ कहना उसकी गंभीर विवेकहीनता को रखता है, बिना आधुनिक मानसिक रोग का निदान आरोपित किए।
