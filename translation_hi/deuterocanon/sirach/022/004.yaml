  yaml_path: translation/deuterocanon/sirach/022/004.yaml
  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: hi
  text: समझदार बेटी पति पाएगी[a], पर जो लज्जा का कारण बनती है, वह अपने जनक के लिए दुःख बनती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “पति को विरासत में पाएगी”; यहाँ “पति पाएगी” प्रसंग के मुहावरेदार अर्थ को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θυγάτηρ
  choice: बेटी
  rationale: यह सीधे पारिवारिक संबंध को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: φρονίμη
  choice: समझदार
  rationale: यह व्यावहारिक बुद्धि और अच्छे विवेक का भाव सहज हिन्दी में व्यक्त करता है; ‘बुद्धिमती’ भी संभव है, पर अपेक्षाकृत अधिक साहित्यिक है।
- source_word: κληρονομήσει
  choice: पाएगी
  rationale: क्रिया का शाब्दिक अर्थ ‘विरासत में पाएगी’ है, किंतु ἄνδρα के साथ प्रसंग में इसका भाव विवाह में पति प्राप्त करना है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक रूप पाद-टिप्पणी में बताया गया है।
- source_word: ἄνδρα
  choice: पति
  rationale: इस वैवाहिक प्रसंग में ἀνήρ का अर्थ केवल ‘पुरुष’ नहीं, बल्कि ‘पति’ है।
- source_word: καταισχύνουσα
  choice: जो लज्जा का कारण बनती है
  rationale: 'सक्रिय कृदंत का कारणात्मक बल सुरक्षित रहता है: वह स्वयं केवल लज्जित नहीं है, बल्कि लज्जा या अपमान लाती है।'
- source_word: εἰς λύπην
  choice: दुःख बनती है
  rationale: यह परिणामस्वरूप उत्पन्न दुःख को व्यक्त करता है और हिन्दी में संबंधसूचक वाक्य-विन्यास के साथ स्वाभाविक है।
- source_word: γεννήσαντος
  choice: अपने जनक के लिए
  rationale: यूनानी रूप पुल्लिंग एकवचन है और जन्म देने वाले पुरुष की ओर संकेत करता है। ‘जनक’ इस पुरुष-संदर्भ तथा जन्म देने के भाव को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: γεννήσαντος में माता-पिता का लिंग-सूचक संदर्भ
  choice: अपने जनक के लिए
  alternative: अपने पिता के लिए; उसे जन्म देने वाले के लिए
  rationale: यूनानी कृदंत पुल्लिंग एकवचन है; इसलिए इसे लिंग-निरपेक्ष ‘माता-पिता’ नहीं बनाया गया। ‘जनक’ स्रोत के जन्म देने वाले पुरुष के स्पष्ट संकेत को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘समझदार’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘जनक’ जन्म देने वाले पुरुष के स्रोतगत संकेत को संक्षिप्त और सम्मानजनक ढंग से सुरक्षित रखता है।
