base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/015.yaml
  text: It is easier to carry sand and salt and a lump of iron than a senseless man[a].
translation:
  language: hi
  text: रेत, नमक और लोहे का ढेला उठाना नासमझ मनुष्य को सहने से आसान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख मनुष्य” अथवा “समझ से रहित मनुष्य।”
    reason: ἀσύνετον के अर्थ-क्षेत्र में नासमझी, मूर्खता और समझ के अभाव की निकटवर्ती अर्थ-छायाएँ आती हैं।
lexical_decisions:
- source_word: ἄμμον
  choice: रेत
  rationale: यह ठोस संज्ञा यूनानी में एकवचन है, पर यहाँ पदार्थवाचक अर्थ में प्रयुक्त है; हिन्दी में ‘रेत’ स्वाभाविक है।
- source_word: ἅλα
  choice: नमक
  rationale: यूनानी बहुवचन यहाँ सामूहिक पदार्थवाचक अर्थ रखता है; हिन्दी में ‘नमक’ उपयुक्त है।
- source_word: βῶλον σιδήρου
  choice: लोहे का ढेला
  rationale: βῶλος किसी ढेले या ठोस पिंड को दर्शाता है; ‘लोहे का ढेला’ मूल के भारी, ठोस बोझ के चित्र को बनाए रखता है।
- source_word: εὔκοπον
  choice: आसान
  rationale: ἤ के साथ यह स्पष्ट तुलना बनाता है; हिन्दी वाक्य-विन्यास में ‘...से आसान है’ स्वाभाविक तुलनात्मक रूप है।
- source_word: ὑπενεγκεῖν
  choice: उठाना / सहना
  rationale: क्रिया में उठाने, ढोने और सहने की अर्थ-छायाएँ हैं। वस्तुओं के साथ ‘उठाना’ भौतिक चित्र रखता है, जबकि मनुष्य के साथ ‘सहना’ उसी चित्र का रूपकात्मक विस्तार स्पष्ट करता है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यह एकवचन मानव-संज्ञा है। ‘मनुष्य’ लिंग-रूप की गरिमा बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से केवल पुरुष तक अर्थ सीमित नहीं करता।
- source_word: ἀσύνετον
  choice: नासमझ
  rationale: यह समझ-बूझ के अभाव को दर्शाता है। ‘नासमझ’ आधुनिक हिन्दी में स्वाभाविक है और ‘बुद्धिहीन’ की कठोर या आधुनिक बौद्धिक-क्षमता संबंधी ध्वनि से बचता है।
theological_decisions:
- issue: ἀσύνετον की ज्ञान-साहित्य संबंधी अर्थ-छाया
  choice: नासमझ
  alternative: मूर्ख; समझ से रहित
  rationale: मूल शब्द का केंद्र समझ-बूझ का अभाव है, अनिवार्यतः नैतिक दुष्टता नहीं। ‘नासमझ’ इस तनाव को बिना अधिक कठोर बनाए सुरक्षित रखता है।
- issue: ἄνθρωπον का लिंग-संबंधी अनुवाद
  choice: मनुष्य
  alternative: आदमी; व्यक्ति
  rationale: यूनानी ἄνθρωπος सामान्य मानव के लिए भी प्रयुक्त हो सकता है। इस लोकोक्तिपरक कथन में ‘मनुष्य’ मूल की मानवीय संज्ञा को औपचारिक और व्यापक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। आरंभिक वस्तुओं के साथ भौतिक बोझ का चित्र और अंतिम पद में कठिन व्यक्ति को ‘सहने’ का रूपक दोनों सुरक्षित हैं।
