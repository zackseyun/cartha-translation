translation:
  language: hi
  text: जो पक्षियों पर पत्थर फेंकता है, वह उन्हें भगा देता है[a]; और जो मित्र को उलाहना देता है[b], वह मित्रता तोड़ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें उड़ा देता है।” यूनानी क्रिया का अर्थ खदेड़ना या भागने पर विवश करना है।
    reason: lexical_alternative
  - marker: b
    text: या, “मित्र को ताना देता है” अथवा “मित्र का अपमान करता है।” यूनानी क्रिया में उलाहना, निन्दा या अपमान का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων λίθον ἐπὶ πετεινὰ
  choice: जो पक्षियों पर पत्थर फेंकता है
  rationale: वर्तमान कृदन्त को सार्वकालिक नीतिवचन के रूप में रखा गया है। πετεινά के लिए संदर्भानुकूल ‘पक्षियों’ और ἐπί के लिए क्रिया के साथ स्वाभाविक ‘पर’ चुना गया है।
- source_word: ἀποσοβεῖ αὐτά
  choice: वह उन्हें उड़ा देता है
  rationale: क्रिया का अर्थ खदेड़ना या भागने पर विवश करना है। पक्षियों के संदर्भ में ‘उड़ा देता है’ स्वाभाविक हिन्दी है और कारण बने भय को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: ὁ ὀνειδίζων φίλον
  choice: जो मित्र को ताना देता है
  rationale: ὀνειδίζω में उलाहना, निन्दा, अपमान या तिरस्कारपूर्ण ताना देने का भाव हो सकता है। ‘ताना देता है’ आधुनिक, सहज और संबंध को चोट पहुँचाने वाला भाव व्यक्त करता है।
- source_word: διαλύσει φιλίαν
  choice: वह मित्रता तोड़ देगा
  rationale: भविष्यकालीन διαλύσει संबंध के विघटन का परिणाम बताता है। ‘मित्रता तोड़ देगा’ मूल के बल और आधुनिक हिन्दी की स्वाभाविकता दोनों को बनाए रखता है।
