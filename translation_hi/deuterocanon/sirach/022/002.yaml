  yaml_path: translation/deuterocanon/sirach/022/002.yaml
  text: A lazy man is compared to a lump of dung[a]; everyone who picks it up will shake off his hand.
translation:
  language: hi
  text: आलसी मनुष्य की तुलना मल के एक ढेले से की गई है[a]; जो कोई उसे उठाता है, वह अपना हाथ झटक देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “आलसी मनुष्य को मल के एक ढेले के साथ फेंक दिया गया है,” यदि συνεβλήθη को तुलना के बजाय भौतिक अर्थ में लिया जाए; इस नीतिवचन के प्रसंग में तुलना वाला अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: गोबर के ढेले
  rationale: βολβίτῳ एक गोल ढेले या लोथड़े को और κοπρίων उसकी गोबर की सामग्री को व्यक्त करता है। यह चुनाव मूल की ठोस और जानबूझकर अपमानजनक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συνεβλήθη
  choice: की तुलना ... से की गई है
  rationale: इस नीतिवचन में συμβάλλω का तुलनात्मक अर्थ प्रसंग के अनुकूल है। भौतिक अर्थ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὀκνηρός
  choice: आलसी मनुष्य
  rationale: यह यूनानी विशेषण आलसी, सुस्त या काम से जी चुराने वाले व्यक्ति को दर्शाता है। 'आलसी मनुष्य' आधुनिक हिन्दी में स्पष्ट है और यूनानी के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: जो कोई उसे उठाता है
  rationale: ἀναιρέω यहाँ उठाने या उठा लेने के अर्थ में है। 'उसे' तुलना में आए गोबर के ढेले की ओर संकेत करता है और मूल सर्वनाम की अस्पष्टता को अनावश्यक रूप से व्यक्ति की ओर नहीं मोड़ता।
- source_word: ἐκτινάξει χεῖρα
  choice: वह अपना हाथ झटक देगा
  rationale: ἐκτινάσσω हाथ से लगी गंदगी हटाने के लिए उसे झटकने की सहज क्रिया दर्शाता है। एकवचन 'हाथ' मूल χεῖρα के अनुरूप रखा गया है।
