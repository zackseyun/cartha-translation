  yaml_path: translation/deuterocanon/sirach/022/003.yaml
  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: hi
  text: अनुशासनहीन पुत्र को उत्पन्न करना पिता के लिए लज्जा है[a], और बेटी हानि के लिए होती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक भाव है, ‘अनुशासनहीन [पुल्लिंग संतान] को उत्पन्न करना पिता की लज्जा है।’ पुल्लिंग विशेषण से ‘पुत्र’ निहित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कमी के लिए’ अथवा ‘अपने पिता की हानि के लिए’। यूनानी पद घटने, कम होने या हानि का भाव देता है, पर यहाँ उसका ठीक आशय संक्षिप्त और अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: αἰσχύνη
  choice: लज्जा
  rationale: यह शब्द अपमान या लज्जा का भाव व्यक्त करता है। ‘लज्जा’ कहावत की संक्षिप्तता और सीधी चोट को बनाए रखता है।
- source_word: πατρὸς
  choice: पिता के लिए
  rationale: यूनानी संबंधकारक को हिन्दी में स्वाभाविक अर्थ-संबंध के अनुसार ‘पिता के लिए’ कहा गया है; इससे यह स्पष्ट होता है कि लज्जा पिता को होती है।
- source_word: ἐν γεννήσει
  choice: जन्म
  rationale: यह पद जन्म देने या उत्पन्न करने की घटना को सूचित करता है। ‘जन्म’ आधुनिक हिन्दी में सहज है और अत्यधिक व्याख्या किए बिना मूल भाव रखता है।
- source_word: ἀπαιδεύτου
  choice: अनुशासनहीन पुत्र
  rationale: विशेषण शिक्षा, प्रशिक्षण या अनुशासन से रहित होने का भाव देता है; ज्ञान-साहित्य के नैतिक संदर्भ में ‘अनुशासनहीन’ उपयुक्त है। यूनानी विशेषण पुल्लिंग है, इसलिए निहित संज्ञा को ‘पुत्र’ से स्पष्ट किया गया है।
- source_word: θυγάτηρ
  choice: बेटी
  rationale: यह स्पष्ट स्त्रीलिंग संतान-संज्ञा है। ‘बेटी’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπʼ ἐλαττώσει
  choice: हानि के लिए
  rationale: पद में कमी, घटाव या हानि का संक्षिप्त भाव है। ‘हानि के लिए’ मूल की कठोर और कुछ हद तक अस्पष्ट अभिव्यक्ति को किसी एक सामाजिक या आर्थिक अर्थ तक सीमित नहीं करता।
- source_word: γίνεται
  choice: जन्म लेती है
  rationale: क्रिया सामान्यतः ‘होना/अस्तित्व में आना’ कह सकती है, पर संतान-जन्म के इस संदर्भ में ‘जन्म लेती है’ सहज और सटीक है।
theological_decisions:
- issue: ज्ञान-वचन में संतान के लिंग-विशिष्ट उल्लेख
  choice: ‘पिता’, निहित ‘पुत्र’ और स्पष्ट ‘बेटी’ को लिंग-विशिष्ट रूप में बनाए रखा गया।
  alternative: ‘माता-पिता’ और ‘संतान’ जैसे लिंग-निरपेक्ष शब्दों का प्रयोग।
  rationale: यूनानी पाठ पिता और बेटी को स्पष्टतः कहता है तथा पहले खंड का पुल्लिंग विशेषण पुत्र को इंगित करता है। इन्हें सामान्यीकृत करना मूल की संरचना बदल देता।
- issue: बेटियों के विषय में प्राचीन सामाजिक मूल्यांकन
  choice: कथन की कठोरता को नरम किए बिना सीधे अनुवादित किया गया।
  alternative: इसे पारिवारिक कठिनाई या सामाजिक अपमान की व्याख्यात्मक भाषा में बदलना।
  rationale: पाठ प्राचीन पितृसत्तात्मक सामाजिक दृष्टि को प्रतिबिंबित करता है। अनुवाद का काम उस दृष्टि को छिपाना या उसका समर्थन जोड़ना नहीं, बल्कि मूल कथन को स्पष्ट रूप में प्रस्तुत करना है।
- issue: ἐπʼ ἐλαττώσει का सटीक आशय
  choice: ‘हानि के लिए’ द्वारा मूल की संक्षिप्त अस्पष्टता रखी गई।
  alternative: ‘अपने पिता की हानि के लिए’ या ‘धन की कमी के लिए’ कहना।
  rationale: यूनानी में हानि किसकी है या उसका स्वरूप क्या है, यह स्पष्ट नहीं किया गया; इसलिए मुख्य पाठ में कोई विशिष्ट पूरक नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और कहावत-सदृश रखी गई है। ‘बेटी’ सामान्य पाठक के लिए ‘पुत्री’ से अधिक सहज है, जबकि वाक्य की गरिमा बनी रहती है। मूल पाठ के असुविधाजनक प्राचीन सामाजिक दृष्टिकोण को न तो नरम किया गया है, न विस्तार देकर अधिक कठोर बनाया गया है।
