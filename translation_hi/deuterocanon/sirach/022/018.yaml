base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: hi
  text: ऊँची जगह पर हवा के सामने[a] लगाए गए खूँटे कभी टिक नहीं पाएँगे; उसी तरह मूर्खतापूर्ण विचार पर टिका हुआ भीरु हृदय किसी भी भय के सामने कभी टिक नहीं पाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘हवा की ओर मुँह किए’ या ‘हवा के विरुद्ध’ भी हो सकता है। यूनानी में बिंब ऐसे खूँटों का है जो सीधे हवा के प्रहार के सामने हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यहाँ प्रबल निषेध है: ‘निश्चय ही टिक नहीं पाएगा।’ यही प्रबलता पहले वाक्यांश में भी है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  choice: खूँटे
  rationale: यह बहुवचन नुकीले खूँटों या खंभों को सूचित करता है। ‘खूँटे’ ठोस और स्वाभाविक हिन्दी है तथा हवा के सामने अस्थिर वस्तुओं के बिंब को स्पष्ट रखता है।
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: ऊँची जगह पर लगाए गए
  rationale: वाक्यांश किसी खुली, ऊँची स्थिति में रखे या स्थापित किए जाने का भाव देता है; इसका अर्थ सचमुच हवा में लटकना नहीं है।
- source_word: κατέναντι ἀνέμου
  choice: हवा के सामने
  rationale: κατέναντι का स्थान-संबंधी अर्थ ‘सामने’ या ‘की ओर मुँह किए’ है। यह अनुवाद हवा के सीधे प्रहार के सामने होने का बिंब बनाए रखता है।
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: कभी टिक नहीं पाएँगे / कभी टिक नहीं पाएगा
  rationale: οὐ μή के साथ ὑπομένω भविष्य के विषय में अत्यंत प्रबल निषेध व्यक्त करता है। ‘कभी टिक नहीं पाएगा’ भौतिक बिंब और नैतिक अनुप्रयोग, दोनों में स्वाभाविक है।
- source_word: καρδία δειλή
  choice: भीरु हृदय
  rationale: δειλή भय के सामने साहसहीन या डरने वाले स्वभाव को बताता है। ‘भीरु’ अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है, बिना उससे अधिक नैतिक आरोप जोड़े।
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: मूर्खतापूर्ण विचार पर टिका
  rationale: διανόημα विचार, मनसा या योजना को सूचित कर सकता है। ‘विचार’ इस व्यापकता को बनाए रखता है, और ‘पर टिका’ पहले अर्धवाक्य के अस्थिर सहारे वाले बिंब को आगे बढ़ाता है।
- source_word: παντὸς φόβου
  choice: किसी भी भय
  rationale: 'यहाँ πᾶς का प्रयोग वितरणात्मक है: जो भी भय सामने आए। ‘किसी भी भय’ इस व्यापक असुरक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।'
