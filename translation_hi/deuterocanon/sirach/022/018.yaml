translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘भीरु हृदय’ नीतिवचन की गरिमा बनाए रखता है, जबकि ‘टिक नहीं पाएगा’ भौतिक तुलना और मनोवैज्ञानिक अनुप्रयोग दोनों में सहज है। समानांतर रचना और ‘सामने’ की पुनरावृत्ति मूल यूनानी के रूपक-संबंध को सुरक्षित रखती है।
