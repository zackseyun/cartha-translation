translation:
  language: hi
  text: यदि तुम किसी मित्र के विरुद्ध तलवार खींच लो, तो निराश मत हो, क्योंकि लौटना संभव है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: किसी मित्र के विरुद्ध
  rationale: शत्रुतापूर्ण क्रिया के साथ ἐπί और कर्मकारक दिशा तथा विरोध का भाव देते हैं; हिन्दी में ‘मित्र के विरुद्ध’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐὰν σπάσῃς
  choice: यदि तुम ... खींच लो
  rationale: σπάω का मूल अर्थ खींचना है; तलवार के साथ इसका स्वाभाविक अर्थ तलवार खींचना है। ‘खींच लो’ संभावित, पूर्ण घटना की शर्त को सहज हिन्दी में रखता है।
- source_word: ῥομφαίαν
  choice: तलवार
  rationale: ῥομφαία एक तलवार, प्रायः बड़ी तलवार, को सूचित करता है। केवल ‘तलवार’ कहना अर्थ को सुरक्षित रखता है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: μὴ ἀπελπίσῃς
  choice: निराश मत हो
  rationale: ἀπελπίζω आशा छोड़ देने या निराश होने को व्यक्त करता है; यह चयन निषेधात्मक आज्ञा की संक्षिप्तता और बल बनाए रखता है।
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: क्योंकि लौटने का मार्ग अब भी है
  rationale: ἐπάνοδος का मूल भाव वापसी या लौटना है। हिन्दी में ‘लौटने का मार्ग ... है’ संबंध बहाल होने की संभावना दिखाता है, पर इसे स्पष्टतः ‘मेल-मिलाप’ कहकर अर्थ को सीमित नहीं करता। ‘अब भी’ प्रसंग में गंभीर टूटन के बावजूद शेष संभावना को स्वाभाविक बनाता है।
theological_decisions:
- issue: मित्र के विरुद्ध हिंसक कृत्य के बाद संबंध की बहाली
  choice: ठोस युद्धात्मक चित्र को बनाए रखते हुए कहा गया है कि लौटने का मार्ग अब भी है।
  alternative: ‘वापसी संभव है’ या स्पष्ट रूप से ‘मेल-मिलाप संभव है’; तलवार को गंभीर अपमान का अतिशयोक्तिपूर्ण रूपक मानना भी संभव है।
  rationale: यूनानी पाठ तलवार खींचने की ठोस छवि के बाद केवल ἐπάνοδος, अर्थात वापसी, कहता है। इसलिए अनुवाद संबंध की बहाली की ओर संकेत करता है, लेकिन यह तय नहीं करता कि हिंसा शाब्दिक है या रूपकात्मक, अथवा वापसी पूर्ण मेल-मिलाप ही है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘निराश मत हो’ मूल आज्ञा का बल रखता है, और ‘लौटने का मार्ग’ मूल की वापसी-वाली छवि तथा उसकी अर्थगत खुलावट को सुरक्षित रखता है।
