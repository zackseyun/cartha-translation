  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: hi
  text: मरे हुए व्यक्ति के लिए रोओ[a], क्योंकि प्रकाश लुप्त हो गया है; और मूर्ख के लिए रोओ[b], क्योंकि समझ लुप्त हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रकाश लुप्त हो गया है।” यूनानी पाठ सीधे “जीवन” न कहकर प्रकाश का रूपक बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह कथन लोकोक्तिपरक है: मूर्ख के लिए इसलिए रोने को कहा गया है कि समझ लुप्त हो गई है; यहाँ उसके शारीरिक रूप से मरने की बात स्पष्ट रूप से नहीं कही गई।'
    reason: cultural_note
lexical_decisions:
- source_word: κλαῦσον
  choice: रोओ
  rationale: यह κλαίω का आज्ञार्थक रूप है और शोक में रोने की सीधी, भावपूर्ण क्रिया व्यक्त करता है।
- source_word: νεκρῷ
  choice: मरे हुए व्यक्ति
  rationale: ἐπί के साथ यह शोक के विषय बने मृत व्यक्ति को सूचित करता है। यह रूप सामान्य, लोकोक्तिपरक एकवचन को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἐξέλιπεν
  choice: लुप्त हो गया है / रहित हो गया है
  rationale: ἐκλείπω के मूल भाव—चुक जाना, न रहना या विफल हो जाना—को दोनों खंडों में प्रसंगानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है। यूनानी की पुनरावृत्ति हिन्दी में शब्दशः रखने पर अर्थ कृत्रिम या अस्पष्ट हो जाता।
- source_word: φῶς
  choice: प्रकाश
  rationale: यहाँ जीवन की ओर संकेत करने वाले प्रकाश के रूपक को सीधे ‘जीवन’ कहकर नहीं खोला गया, इसलिए मूल की काव्यात्मक संक्षिप्तता बनी रहती है।
- source_word: μωρῷ
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में μωρός केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि विवेकहीन व्यक्ति की स्थापित श्रेणी को दर्शाता है; ‘मूर्ख’ इस तीखेपन को बनाए रखता है।
- source_word: σύνεσιν
  choice: समझ
  rationale: σύνεσις का अर्थ समझ, सूझ-बूझ या विवेक है। ‘समझ’ सामान्य पाठक के लिए सीधा है और मूर्खता के साथ स्वाभाविक विरोध बनाता है।
theological_decisions:
- issue: मृत्यु के संबंध में φῶς का रूपक
  choice: मुख्य पाठ में ‘प्रकाश’ का रूपक बनाए रखना
  alternative: क्योंकि जीवन जाता रहा है
  rationale: यूनानी पाठ φῶς कहता है, ζωή नहीं। ‘प्रकाश’ रखने से मृत्यु और जीवन के संबंध का संकेत बना रहता है, पर उसे आवश्यकता से अधिक स्पष्ट करके एक ही अर्थ में सीमित नहीं किया जाता।
- issue: μωρός की ज्ञान-साहित्य संबंधी धारणा
  choice: ‘मूर्ख’
  alternative: ‘नासमझ व्यक्ति’
  rationale: ‘मूर्ख’ मूल कथन की धार और ज्ञान-साहित्य की नैतिक-बौद्धिक श्रेणी को बनाए रखता है; नरम विकल्प इस बल को घटा देता।
- issue: ἐξέλιπεν σύνεσιν की व्याकरणिक और अर्थगत कठिनाई
  choice: ‘वह समझ से रहित हो गया है’
  alternative: ‘समझ लुप्त हो गई है’
  rationale: σύνεσιν कर्मकारक रूप में है, इसलिए इसे केवल ‘समझ’ को कर्ता मानकर अनुवाद करना व्याकरणिक तनाव को छिपा सकता है। चुना हुआ रूप मूर्ख के समझ से वंचित होने का भाव व्यक्त करता है, जबकि पादटिप्पणी कथन की लोकोक्तिपरक प्रकृति स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ज्ञान-साहित्य के अनुरूप रखी गई है। अर्धविराम दोनों समानांतर आज्ञाओं को जोड़ता है; ‘रोओ’ और ‘मूर्ख’ मूल कथन की संक्षिप्तता और तीक्ष्णता बनाए रखते हैं।
