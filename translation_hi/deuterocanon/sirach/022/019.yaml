  text: जो आँख में चुभाता है, वह आँसू बहाता है[a]; और जो हृदय में चुभाता है, वह अनुभूति प्रकट करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँसू निकालता है”; यूनानी अभिव्यक्ति का शाब्दिक चित्र आँसुओं को नीचे लाने या गिराने का है।
    reason: lexical_alternative
  - marker: b
    text: या “संवेदना” अथवा “बोध”; यूनानी संज्ञा अनुभूति, संवेदना या ग्रहण-बोध का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  choice: जो … में चुभाता है
  rationale: νύσσω किसी नुकीली वस्तु से चुभाने या कोंचने का बोध देता है। ‘चुभाता है’ दोनों समानांतर उपवाक्यों में स्वाभाविक है और रूपक की ठोस प्रकृति बनाए रखता है।
- source_word: ὀφθαλμόν
  choice: आँख
  rationale: अनिश्चित एकवचन यहाँ सामान्य सत्य व्यक्त करता है; हिन्दी में ‘आँख’ बिना अनावश्यक निर्धारक के स्वाभाविक है।
- source_word: κατάξει δάκρυα
  choice: आँसू बहाता है
  rationale: κατάγω का मूल चित्र आँसुओं को नीचे लाने या गिराने का है। ‘आँसू बहाता है’ आधुनिक हिन्दी में स्वाभाविक रूप से कारण और नीचे बहने, दोनों का संकेत देता है।
- source_word: καρδίαν
  choice: हृदय
  rationale: यहाँ ‘हृदय’ भीतरी मनुष्य और भावनाओं के केंद्र का रूपक है; यह गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: ἐκφαίνει
  choice: प्रकट करता है
  rationale: क्रिया भीतर की वस्तु को सामने लाने या स्पष्ट कर देने का अर्थ रखती है। ‘प्रकट करता है’ इस अर्थ को सीधे सुरक्षित रखता है।
- source_word: αἴσθησιν
  choice: अनुभूति
  rationale: αἴσθησις का अर्थ संवेदना, बोध या भीतरी अनुभूति हो सकता है। हृदय के समानांतर ‘अनुभूति’ भावात्मक और संवेदनात्मक विस्तार को बनाए रखती है, बिना इसे केवल भावना या केवल संज्ञान तक सीमित किए।
