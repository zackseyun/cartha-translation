translation:
  language: hi
  text: आलसी मनुष्य की तुलना एक मैले पत्थर से की गई है[a], और हर कोई उसकी बदनामी पर सीटी बजाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दुर्लभ यूनानी कृदंत का सटीक अर्थ अनिश्चित है, पर उसमें मैला या गंदा होने का नकारात्मक भाव स्पष्ट है। वैकल्पिक अनुवाद: “आलसी मनुष्य की तुलना गंदे या दूषित पत्थर से की गई है।”'
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया उपहास में “फुफकारने” का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ ἠρδαλωμένῳ
  choice: मैल लगे पत्थर से
  rationale: λίθος का स्वाभाविक अर्थ ‘पत्थर’ है। दुर्लभ कृदंत ἠρδαλωμένῳ पत्थर की मैली या दूषित दशा बताता है; ‘मैल लगे’ अर्थ को स्पष्ट रखते हुए हिन्दी में सहज है।
- source_word: συνεβλήθη
  choice: तुलना ... से की गई है
  rationale: इस नीतिवचन के संदर्भ में क्रिया का अर्थ किसी वस्तु के समान ठहराना या उससे तुलना करना है, न कि शाब्दिक रूप से साथ फेंकना। यूनानी अओरिस्ट कर्मवाच्य को हिन्दी में स्वाभाविक पूर्ण कर्मवाच्य से व्यक्त किया गया है।
- source_word: ὀκνηρός
  choice: आलसी मनुष्य
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘आलसी मनुष्य’ आधुनिक हिन्दी में स्पष्ट है और स्रोत के पुल्लिंग रूप को बनाए रखता है।
- source_word: πᾶς
  choice: हर कोई
  rationale: यहाँ शब्द सार्वभौमिक मानवीय प्रतिक्रिया व्यक्त करता है; ‘हर कोई’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐκσυριεῖ
  choice: सीटी बजाएगा
  rationale: क्रिया उपहास या तिरस्कार में सीटी जैसी ध्वनि निकालने का संकेत देती है। मूर्त ध्वनि-बिंब बनाए रखा गया है; ‘फुफकारेगा’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: ἀτιμίᾳ
  choice: अपमान पर
  rationale: ἀτιμία अनादर, अपमान या लज्जाजनक दशा को सूचित करता है। ‘अपमान’ इस सार्वजनिक तिरस्कार के प्रसंग में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: संज्ञा के रूप में प्रयुक्त पुल्लिंग ὀκνηρός
  choice: आलसी मनुष्य
  alternative: आलसी व्यक्ति
  rationale: कथन नीतिवचनात्मक और सामान्य रूप से लागू होने वाला है, फिर भी यूनानी रूप पुल्लिंग एकवचन है। इसलिए अर्थ को संप्रदायगत ढंग से विस्तृत किए बिना स्रोत का व्याकरणिक रूप रखा गया है।
- issue: ἐκσυριεῖ में उपहास की ध्वनि
  choice: सीटी बजाएगा
  alternative: फुफकारेगा
  rationale: स्रोत उपहासपूर्ण सीटी या फुफकार—दोनों का संकेत दे सकता है। मुख्य पाठ में ठोस ध्वनि-बिंब रखा गया है और वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचनात्मक और गरिमापूर्ण शैली रखी गई है। कठिन यूनानी कृदंत और उपहासपूर्ण ध्वनि वाली क्रिया की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
