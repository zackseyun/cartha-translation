  yaml_path: translation/deuterocanon/sirach/022/007.yaml
  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
translation:
  language: hi
  text: मूर्ख को शिक्षा देना ठीकरे को चिपकाने जैसा है[a], और गहरी नींद में सोए व्यक्ति को जगाने जैसा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मूर्ख को सिखाने वाला ठीकरा चिपका रहा है, और गहरी नींद में सोए व्यक्ति को जगा रहा है।” यूनानी में स्पष्ट ‘जैसा है’ के बजाय कृदन्तों के द्वारा ये तुलनाएँ रखी गई हैं।'
    reason: मूल यूनानी की कृदन्तात्मक और कुछ हद तक संक्षिप्त वाक्य-रचना को दिखाने के लिए।
lexical_decisions:
- source_word: συγκολλῶν
  choice: चिपकाने
  rationale: यह कृदन्त किसी वस्तु को जोड़ने या चिपकाने की ठोस क्रिया बताता है। ‘चिपकाने’ से टूटे मिट्टी के पात्र की असंगत या निष्फल मरम्मत का बिंब स्पष्ट रहता है।
- source_word: ὄστρακον
  choice: ठीकरे को
  rationale: ὄστρακον यहाँ मिट्टी के बर्तन के टूटे टुकड़े को सूचित करता है। ‘ठीकरा’ इसका संक्षिप्त, स्वाभाविक और चित्रात्मक हिन्दी पर्याय है; एकवचन यूनानी रूप भी सुरक्षित रहता है।
- source_word: ὁ διδάσκων
  choice: शिक्षा देना
  rationale: संज्ञात्मक कृदन्त का शाब्दिक अर्थ ‘सिखाने वाला’ है। लोकोक्तिपरक वाक्य में ‘शिक्षा देना’ स्वाभाविक हिन्दी है और सामान्य क्रिया का भाव बनाए रखता है।
- source_word: μωρόν
  choice: मूर्ख को
  rationale: ज्ञान-साहित्य में μωρός केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि विवेकहीन व्यक्ति को सूचित करता है। ‘मूर्ख’ इस पारंपरिक नैतिक-बौद्धिक अर्थ को बनाए रखता है।
- source_word: ἐξεγείρων
  choice: जगाने
  rationale: यह कृदन्त नींद से उठाने या जगा देने की क्रिया व्यक्त करता है; ‘जगाने’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: καθεύδοντα
  choice: सोए व्यक्ति को
  rationale: कृदन्त का अर्थ ‘सो रहा व्यक्ति’ है। ‘सोए व्यक्ति’ से मूल का व्यक्तिवाचक और क्रियात्मक भाव दोनों स्पष्ट रहते हैं।
- source_word: ἐκ βαθέος ὕπνου
  choice: गहरी नींद में
  rationale: मूल वाक्यांश का आशय गहरी नींद से जगाना है। हिन्दी में ‘गहरी नींद में सोए व्यक्ति को जगाना’ अधिक स्वाभाविक पदक्रम है और नींद की तीव्रता सुरक्षित रखता है।
