  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय नीतिवचन-शैली रखी गई है। ‘परायों’ सामाजिक दूरी को व्यक्त करता है, पर राष्ट्रीयता का अनावश्यक संकेत नहीं देता। दोनों खंडों में भारीपन और तौल के संबद्ध बिंब को सुरक्षित रखा गया है।
