  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
translation:
  language: hi
  text: परायों के होंठ इन बातों से भारी हो जाएँगे[a], पर बुद्धिमानों के वचन तराज़ू पर ठहरेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों में भारी हो जाएँगे”; यूनानी पदबंध का यह अधिक शाब्दिक अनुवाद भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: तराज़ू का बिंब संकेत करता है कि बुद्धिमानों के वचन नपे-तुले और विवेकपूर्ण होते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: χείλη
  choice: होंठ
  rationale: शाब्दिक बिंब और वाणी के लिए प्रयुक्त लक्षणा—दोनों को बनाए रखता है।
- source_word: ἀλλοτρίων
  choice: परायों के
  rationale: यह अपने समूह से बाहर या अपरिचित लोगों का संकेत देता है; ‘विदेशियों’ से जातीय या राष्ट्रीय अर्थ अनावश्यक रूप से जुड़ सकता है।
- source_word: ἐν τούτοις
  choice: इन बातों से
  rationale: पूर्ववर्ती विषयों की ओर संकेत करता है और βαρυνθήσεται के साथ कारण अथवा साधन का स्वाभाविक हिन्दी भाव देता है; अधिक शाब्दिक ‘इन बातों में’ भी संभव है।
- source_word: βαρυνθήσεται
  choice: भारी हो जाएँगे
  rationale: भविष्यत् कर्मवाच्य के भारी या बोझिल किए जाने के रूपक को सुरक्षित रखता है और अगले खंड के तौलने के बिंब से जुड़ता है।
- source_word: λόγοι
  choice: वचन
  rationale: ज्ञान-साहित्य की गरिमामय, संक्षिप्त शैली में λόγοι का स्वाभाविक समतुल्य है।
- source_word: φρονίμων
  choice: बुद्धिमानों के
  rationale: मूल में विशेषण का संज्ञा के रूप में प्रयोग है और यह विवेकशील अथवा बुद्धिमान लोगों को दर्शाता है।
- source_word: ἐν ζυγῷ
  choice: तराज़ू पर
  rationale: यहाँ ζυγός जुए के बजाय तौलने के तराज़ू का बिंब है; हिन्दी में ‘तराज़ू पर’ स्वाभाविक है।
- source_word: σταθήσονται
  choice: तौले हुए ठहरेंगे
  rationale: मूलतः ‘खड़े होंगे/रखे जाएँगे’ का भाव तराज़ू के संदर्भ में नपे-तुले और स्थिर सिद्ध होने की ओर संकेत करता है; हिन्दी में केवल ‘रखे जाएँगे’ की अपेक्षा यह बिंब अधिक स्पष्ट करता है।
