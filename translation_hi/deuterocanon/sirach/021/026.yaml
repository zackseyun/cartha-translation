  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
translation:
  language: hi
  text: मूर्खों के मुँह में उनका हृदय है, पर बुद्धिमानों का हृदय उनका मुँह है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का दूसरा खंड अत्यंत संक्षिप्त है। इसका एक अधिक व्याख्यात्मक अनुवाद हो सकता है, “पर बुद्धिमानों का मुँह उनके हृदय में है”—अर्थात बुद्धिमान अपनी वाणी को अपने भीतर के विचार और विवेक के अधीन रखते हैं। मुख्य पाठ यूनानी के संक्षिप्त और प्रतिलोम शब्द-क्रम को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν στόματι
  choice: मुँह में
  rationale: 'स्थानसूचक रूपक को यथासंभव सीधे रखा गया है: मूर्ख अपने भीतर की बात बिना रोक-टोक तुरंत बोल देते हैं।'
- source_word: μωρῶν
  choice: मूर्खों
  rationale: ज्ञान-साहित्य की संक्षिप्त, नीतिवचनात्मक शैली में बहुवचन संज्ञा का स्वाभाविक हिन्दी रूप।
- source_word: καρδία
  choice: हृदय
  rationale: यह मनुष्य के भीतरी विचार, इच्छा और स्वभाव को समेटने वाला बाइबलीय रूपक है; केवल भावना तक सीमित नहीं।
- source_word: σοφῶν
  choice: बुद्धिमानों
  rationale: यह σοφῶν का सहज बहुवचन संज्ञात्मक अनुवाद है और नीतिवचन का औपचारिक संतुलन बनाए रखता है।
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: पर बुद्धिमानों का मुँह उनके हृदय में होता है
  rationale: यूनानी का दूसरा खंड संक्षिप्त और व्याकरणतः संबंधसूचक है, जिसमें स्पष्ट क्रिया और दूसरा ἐν निहित समझे जा सकते हैं। हिन्दी में उलटी समानांतरता और अभिप्रेत विरोध—बुद्धिमान वाणी को भीतर के विवेक के अधीन रखते हैं—स्पष्ट करने के लिए यह क्रम चुना गया है।
theological_decisions:
- issue: दूसरे खंड की संक्षिप्त और संभावित रूप से अस्पष्ट रचना
  choice: बुद्धिमानों का मुँह उनके हृदय में होता है
  alternative: बुद्धिमानों का हृदय उनका मुँह होता है
  rationale: पहला विकल्प नीतिवचन की स्वाभाविक प्रतिलोम समानांतरता और अभिप्रेत अर्थ को व्यक्त करता है, जबकि शाब्दिक शब्द-क्रम दूसरा रूप सुझा सकता है। वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘मुँह’ और ‘हृदय’ के ठोस रूपकों को बनाए रखते हुए दूसरे खंड की यूनानी संक्षिप्तता को स्वाभाविक हिन्दी में व्यक्त किया गया है।
