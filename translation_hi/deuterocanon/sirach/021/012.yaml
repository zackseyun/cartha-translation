lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: शिक्षा नहीं पाएगा
  rationale: παιδεύω के भविष्यत् कर्मवाच्य रूप में सिखाने, प्रशिक्षित करने और सुधारात्मक शिक्षा देने का भाव है। हिंदी में “शिक्षा नहीं पाएगा” इस ज्ञान-साहित्यिक संदर्भ में स्वाभाविक है और इसे केवल दंडात्मक अनुशासन या औपचारिक पढ़ाई तक सीमित नहीं करता।
- source_word: ὃς
  choice: जो … वह
  rationale: संबंधवाचक सर्वनाम यहाँ किसी भी सामान्य व्यक्ति को सूचित करता है। हिंदी की स्वाभाविक “जो … वह” रचना यूनानी के सामान्य कथन को स्पष्ट रूप से व्यक्त करती है।
- source_word: οὐκ ἔστιν
  choice: नहीं है
  rationale: यह यूनानी के साधारण निषेधात्मक संयोजक कथन का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: πανοῦργος
  choice: चतुर
  rationale: πανοῦργος संदर्भ के अनुसार चतुर, चालाक, व्यवहार-कुशल या नकारात्मक अर्थ में धूर्त हो सकता है। यहाँ शिक्षा पाने की क्षमता के साथ इसका संबंध होने के कारण “चतुर” अपेक्षाकृत तटस्थ-सकारात्मक अर्थ देता है, जबकि शब्द की अंतर्निहित अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ज्ञान-वचन में πανοῦργος का नैतिक आशय
  choice: इसे अपेक्षाकृत तटस्थ-सकारात्मक अर्थ में “चतुर” अनूदित किया गया है।
  alternative: “चालाक” या “धूर्त”
  rationale: इस पद में यह गुण शिक्षा से लाभ पाने की योग्यता से जुड़ा है। “धूर्त” कहने पर कथन अनावश्यक रूप से यह संकेत देगा कि सीखने के लिए नैतिक कुटिलता चाहिए। फिर भी यूनानी शब्द का संभावित नकारात्मक आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। “शिक्षा पाएगा” सामान्य पाठक के लिए स्वाभाविक है और सुधारात्मक शिक्षण की व्यापक धारणा को बनाए रखता है।
