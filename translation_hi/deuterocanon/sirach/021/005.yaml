  text: The prayer of a poor man goes from his mouth to his ears[b][a], and his judgment comes quickly.
translation:
  language: hi
  text: निर्धन की विनती मुँह से उसके कानों तक पहुँचती है[a], और उसका न्याय शीघ्र आता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “मुँह से उसके कानों तक।” “उसके” से संभवतः परमेश्वर का संकेत है: निर्धन की विनती परमेश्वर के कानों तक पहुँचती है। फिर भी यूनानी में परमेश्वर का नाम स्पष्ट रूप से नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: “उसका न्यायिक निर्णय,” “उसका मामला,” या “उसके मामले का फैसला” भी संभव है। यूनानी शब्द न्याय या निर्धन के पक्ष में दिए जाने वाले निर्णय का संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  choice: विनती
  rationale: यह शब्द गंभीर और आग्रहपूर्ण प्रार्थना या याचना को व्यक्त करता है। “विनती” धार्मिक प्रार्थना और सहायता की पुकार—दोनों भावों को स्वाभाविक हिन्दी में समेटती है।
- source_word: πτωχοῦ
  choice: निर्धन
  rationale: यूनानी शब्द एक गरीब अथवा अभावग्रस्त व्यक्ति को सूचित करता है। “निर्धन” आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: मुँह से उसके कानों तक पहुँचती है
  rationale: मूल का स्थानगत चित्र—“मुँह से ... कानों तक”—सुरक्षित रखा गया है। “पहुँचती है” यूनानी में निहित गति को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि सर्वनाम के संदर्भ की वास्तविक अस्पष्टता पाद-टिप्पणी में बनी रहती है।
- source_word: κρίμα
  choice: मुकदमे का निर्णय
  rationale: κρίμα न्यायिक निर्णय, न्याय अथवा किसी व्यक्ति के मामले में दिए गए फैसले को व्यक्त कर सकता है। “मुकदमे का निर्णय” यहाँ विधिक भाव को स्पष्ट करता है, पर वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: κατὰ σπουδήν
  choice: शीघ्र
  rationale: यह पद तत्परता और बिना विलंब के होने का भाव देता है; “शीघ्र” संक्षिप्त, dignified और सहज हिन्दी है।
- source_word: ἔρχεται
  choice: आता है
  rationale: वर्तमानकालीन क्रिया का सीधा अनुवाद है और निर्णय के तत्काल निकट आने की सजीवता बनाए रखता है।
theological_decisions:
- issue: αὐτοῦ (‘उसके कानों’) का संदर्भ
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम “उसके” रखा गया है; प्रसंग में इसे परमेश्वर के कानों का संकेत समझना सबसे स्वाभाविक है।
  alternative: इसे निकटतम व्यक्त संज्ञा, अर्थात निर्धन व्यक्ति, की ओर संकेत करने वाला माना जा सकता है।
  rationale: दूसरे खंड में शीघ्र आने वाले न्यायिक निर्णय से परमेश्वर का निहित श्रोता और न्यायाधीश होना संभावित है। फिर भी यूनानी पाठ परमेश्वर का नाम स्पष्टतः नहीं देता, इसलिए मुख्य पाठ में उसे जोड़कर अस्पष्टता समाप्त नहीं की गई।
- issue: κρίμα का आशय
  choice: निर्धन के मुकदमे में दिया जाने वाला निर्णय
  alternative: “न्याय” अथवा स्वयं उसका “मामला”
  rationale: न्यायिक अर्थ प्रसंग के अनुकूल है, किंतु यह पद निर्धन के पक्ष में किए गए न्याय को भी सूचित कर सकता है; इसलिए पाद-टिप्पणी में अर्थ-सीमा बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूक्तिपरक रखी गई है। “विनती,” “निर्धन,” और “शीघ्र” सामान्य पाठक के लिए सहज हैं। मुख्य पाठ मूल के संक्षिप्त समानांतर ढाँचे तथा सर्वनाम की वास्तविक अस्पष्टता को सुरक्षित रखता है।
