  text: वाणी में समर्थ मनुष्य दूर से ही पहचाना जाता है[a], पर समझदार जानता है कि वह व्यक्ति कब फिसलता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूर-दूर तक जाना जाता है’; यूनानी पद प्रत्यक्ष रूप से दूर से पहचान लिए जाने या पहले से फैली ख्याति—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ठोकर खाता है’; यूनानी बिंब शारीरिक रूप से फिसलने और लाक्षणिक रूप से भूल करने—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: दूर से ही पहचाना जाता है
  rationale: यह यूनानी पदबंध की संक्षिप्तता बनाए रखता है और प्रत्यक्ष पहचान तथा दूर तक फैली ख्याति—दोनों संभावित भावों के लिए स्थान छोड़ता है।
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: वाणी में समर्थ मनुष्य
  rationale: δυνατός के सामर्थ्य और ἐν γλώσσῃ के वाणी/बोलने संबंधी अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है; पुल्लिंग एकवचन को प्रतिनिधिक रूप में बनाए रखा गया है।
- source_word: ὁ δὲ νοήμων
  choice: पर समझदार
  rationale: νοήμων में समझ-बूझ और विवेक का भाव है। ‘समझदार’ सामान्य आधुनिक हिन्दी में सहज है और वाक्य का विरोध स्पष्ट रखता है।
- source_word: οἶδεν
  choice: जानता है
  rationale: मूल क्रिया के सामान्य अर्थ को बिना ‘पहचानता’ या ‘समझ लेता’ जैसी अतिरिक्त व्याख्या जोड़े प्रस्तुत करता है।
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: कि वह कब फिसलता है
  rationale: ἐν के साथ articular infinitive का कालवाचक भाव ‘कब/जब’ से आता है। ‘फिसलता’ मूल बिंब को बनाए रखता है और शारीरिक ठोकर तथा कथन या आचरण की भूल—दोनों अर्थों के लिए खुला है। ‘वह’ αὐτόν के संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: ‘वह’ द्वारा संदर्भ को खुला रखना
  alternative: ‘वह स्वयं’ कहकर केवल समझदार व्यक्ति की ओर संकेत करना; अथवा ‘वाणी में समर्थ वह मनुष्य’ कहकर पहले व्यक्ति की ओर संकेत करना
  rationale: यूनानी पुल्लिंग सर्वनाम व्याकरणतः infinitive का कर्ता है, पर प्रसंग में उसका पूर्वगामी निर्विवाद रूप से स्पष्ट नहीं है। हिन्दी ‘वह’ इस वास्तविक संदर्भगत तनाव को सुरक्षित रखता है।
- issue: प्रतिनिधिक पुल्लिंग
  choice: ‘मनुष्य’ और पुल्लिंग क्रियारूप
  alternative: पूर्णतः लिंग-निरपेक्ष बहुवचन
  rationale: यूनानी में दोनों संज्ञीकृत पद पुल्लिंग एकवचन हैं। हिन्दी में ‘मनुष्य’ प्रतिनिधिक अर्थ देता है और मूल रूप को अनावश्यक रूप से नहीं बदलता।
