  yaml_path: translation/deuterocanon/sirach/021/021.yaml
  text: Instruction is like a golden ornament to a prudent man[a], and like a bracelet on his right arm.
translation:
  language: hi
  text: समझदार मनुष्य के लिए शिक्षा[a] सोने के आभूषण के समान है, और उसकी दाहिनी बाँह पर कंगन के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासन” अथवा “प्रशिक्षण”; यूनानी शब्द παιδεία में शिक्षा के साथ नैतिक गठन और अनुशासन का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: आभूषण
  rationale: यहाँ κόσμος का अर्थ ‘संसार’ नहीं, बल्कि सजने के लिए पहना जाने वाला आभूषण है; सोने और कंगन की समानांतर उपमा इसकी पुष्टि करती है।
- source_word: χρυσοῦς
  choice: सोने का
  rationale: यह विशेषण आभूषण की सामग्री अथवा उसकी स्वर्णमय प्रकृति बताता है; आधुनिक हिन्दी में ‘सोने का आभूषण’ स्वाभाविक और स्पष्ट है।
- source_word: φρονίμῳ
  choice: समझदार मनुष्य के लिए
  rationale: φρόνιμος व्यावहारिक समझ, विवेक और सूझ-बूझ रखने वाले व्यक्ति को दर्शाता है। दत्तिव रूप को ‘के लिए’ से व्यक्त किया गया है और यूनानी के पुल्लिंग एकवचन को बनाए रखा गया है।
- source_word: παιδεία
  choice: शिक्षा
  rationale: παιδεία में शिक्षा के साथ अनुशासन, प्रशिक्षण और नैतिक गठन का व्यापक भाव हो सकता है। मुख्य पाठ में ‘शिक्षा’ सहज है, जबकि पादटिप्पणी इस अर्थ-विस्तार को सुरक्षित रखती है।
- source_word: χλιδών
  choice: कंगन
  rationale: दाहिनी बाँह पर पहने जाने के उल्लेख के कारण यहाँ बाँह का आभूषण अभिप्रेत है। ‘कंगन’ सामान्य आधुनिक हिन्दी में सर्वाधिक स्पष्ट है।
- source_word: βραχίονι δεξιῷ
  choice: उसकी दाहिनी बाँह पर
  rationale: वाक्यांश आभूषण का स्थान बताता है। हिन्दी में संबंध स्पष्ट और स्वाभाविक करने के लिए ‘उसकी’ जोड़ा गया है।
theological_decisions:
- issue: φρονίμῳ के पुल्लिंग एकवचन का अनुवाद
  choice: समझदार मनुष्य
  alternative: समझदार व्यक्ति
  rationale: यूनानी पाठ में प्रतिनिधि व्यक्ति के लिए व्याकरणिक पुल्लिंग एकवचन है। ‘मनुष्य’ मूल रूप को बनाए रखता है, फिर भी इस ज्ञान-वचन के सामान्य मानवीय प्रयोग को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों उपमाओं की समानांतर संरचना तथा मूल पाठ में शिक्षा के अलंकारिक सौंदर्य और मूल्य का भाव सुरक्षित रखा गया है।
