lexical_decisions:
- source_word: ἐξήγησις
  choice: विवेचन
  rationale: यह शब्द किसी बात को समझाकर प्रस्तुत करने को सूचित करता है। ‘विवेचन’ यूनानी संज्ञा का रूप बनाए रखता है और कहावत के गरिमापूर्ण भाव के अनुकूल है।
- source_word: μωροῦ
  choice: मूर्ख का
  rationale: सम्बन्धकारक रूप ἐξήγησις पर निर्भर है। ‘मूर्ख’ ज्ञान-साहित्य का स्वाभाविक नैतिक-बौद्धिक पद है।
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: मार्ग में पड़े बोझ के समान
  rationale: φορτίον बोझ या भार है और ἐν ὁδῷ का अर्थ मार्ग में/पर है। ‘पड़े’ से रास्ते में बाधक बोझ का ठोस चित्र स्वाभाविक हिन्दी में प्रकट होता है, यद्यपि यह क्रिया यूनानी में निहित है, व्यक्त नहीं।
- source_word: χείλους
  choice: होंठों पर
  rationale: शाब्दिक देहात्मक बिंब को बनाए रखता है और वाणी के लिए प्रचलित ज्ञान-साहित्यिक मुहावरा है।
- source_word: συνετοῦ
  choice: समझदार के
  rationale: यहाँ शब्द उस व्यक्ति को बताता है जिसमें समझ और सही निर्णय-क्षमता है। ‘समझदार’ आधुनिक हिन्दी में सहज है और ‘मूर्ख’ के स्पष्ट प्रतिलोम के रूप में काम करता है।
- source_word: εὑρεθήσεται χάρις
  choice: मनोहरता पाई जाएगी
  rationale: इस प्रसंग में χάρις समझदार व्यक्ति की वाणी के आकर्षक, सुहावने या कृपापूर्ण गुण को बताता है। ‘मनोहरता’ हिन्दी में होंठों पर पाई जाने वाली वाणी की गुणवत्ता के रूप में स्वाभाविक है और इसे अनावश्यक रूप से ईश्वरीय अनुग्रह नहीं बनाता।
