lexical_decisions:
- source_word: μολύνει
  choice: अशुद्ध करता है
  rationale: यह क्रिया नैतिक कलंक और अशुद्धता दोनों का भाव रखती है; ‘अशुद्ध करता है’ इस दोहरे संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὴν ἑαυτοῦ ψυχὴν
  choice: अपने ही प्राण को
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन या स्वयं को सूचित कर सकता है। ‘अपने ही प्राण’ मूल की मानव-संबंधी भाषा और आत्महानि पर बल को सुरक्षित रखता है।
- source_word: ὁ ψιθυρίζων
  choice: चुगली करनेवाला
  rationale: शब्द गुप्त या दबे स्वर में दूसरों के विरुद्ध बातें फैलानेवाले व्यक्ति को दर्शाता है। हिन्दी में ‘चुगली करनेवाला’ इस सामाजिक और नैतिक आशय को ‘फुसफुसानेवाला’ से अधिक स्वाभाविक रूप में व्यक्त करता है, बिना इसे केवल झूठी निन्दा तक सीमित किए।
- source_word: ἐν παροικήσει
  choice: जहाँ वह रहता है, वहाँ
  rationale: παροίκησις निवास, परदेश में रहना, अथवा निवास-समुदाय के क्षेत्र को सूचित कर सकता है। यह अनुवाद स्थान/सामाजिक परिवेश का आशय देता है और अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: μισηθήσεται
  choice: उससे घृणा की जाएगी
  rationale: 'भविष्यत् कर्मवाच्य को सीधे बनाए रखता है: उसके आसपास के लोग उससे घृणा करेंगे।'
