lexical_decisions:
- source_word: πέδαι
  choice: बेड़ियाँ
  rationale: यह यूनानी शब्द विशेष रूप से पैरों में डाले जाने वाले बंधन को दर्शाता है; ‘बेड़ियाँ’ इस ठोस चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ποσὶν
  choice: पैरों में
  rationale: बेड़ियाँ पहनाने के संदर्भ में हिन्दी का स्वाभाविक प्रयोग ‘पैरों में’ है और मूल की शारीरिक छवि सुरक्षित रहती है।
- source_word: ἀνοήτοις
  choice: निर्बुद्धि लोगों
  rationale: शब्द ऐसे लोगों को सूचित करता है जिनमें समझ-बूझ का अभाव है; यह चयन ज्ञान-साहित्य के आशय को व्यक्त करता है और केवल गाली जैसा स्थायी चरित्र-निर्धारण नहीं करता।
- source_word: παιδεία
  choice: शिक्षा
  rationale: यहाँ शब्द शिक्षा, अनुशासन या प्रशिक्षण के अर्थ रख सकता है। ‘शिक्षा’ व्यापक शिक्षणात्मक अर्थ को प्राथमिकता देता है, जबकि रूपक बताता है कि निर्बुद्धि व्यक्ति उसे बंधन जैसा अनुभव करता है।
- source_word: χειροπέδαι
  choice: हथकड़ी
  rationale: यह हाथ को बाँधने वाले बंधन का सुलभ और आधुनिक हिन्दी समतुल्य है।
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: दाहिने हाथ पर
  rationale: मूल पाठ में एकवचन ‘दाहिना हाथ’ स्पष्ट है; चित्र कुछ असामान्य होने पर भी उसे सामान्यीकृत नहीं किया गया।
