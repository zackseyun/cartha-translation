  text: Three things I hated[a], and four I did not love.
translation:
  language: hi
  text: बच्चे, क्या तुमने पाप किया है? फिर ऐसा मत करना, और अपने पिछले पापों के लिए प्रार्थना करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इब्रानी पंक्ति सिराख 21:1 से मेल नहीं खाती; उसका अर्थ है, “तीन बातों से मैंने घृणा की, और चार से मैंने प्रेम नहीं किया।” इसलिए इस पद के लिए यूनानी साक्ष्य का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: हे बच्चे
  rationale: यह संबोधन लिंग को अनावश्यक रूप से निश्चित किए बिना यूनानी के सीधे पुकारने वाले रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἥμαρτες
  choice: क्या तूने पाप किया है?
  rationale: प्रश्न का रूप और पाप के नैतिक-धार्मिक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: μὴ προσθῇς μηκέτι
  choice: फिर ऐसा न करना
  rationale: शाब्दिक अर्थ ‘अब और न जोड़ना’ है; प्रसंग में आशय पाप को न दोहराने से है। यह हिन्दी में संक्षिप्त और स्वाभाविक निषेध है।
- source_word: περὶ τῶν προτέρων σου
  choice: अपने पिछले पापों के विषय में
  rationale: यूनानी में शाब्दिक रूप से ‘अपनी पिछली बातों के विषय में’ है; पहले आए ‘पाप किया’ से ‘पापों’ का लोपित आशय स्पष्ट होता है। ‘के विषय में’ मूल की व्यापकता को ‘क्षमा माँग’ जैसे अधिक व्याख्यात्मक रूप से बेहतर सुरक्षित रखता है।
- source_word: δεήθητι
  choice: प्रार्थना कर
  rationale: आज्ञार्थक क्रिया विनती या प्रार्थना करने को कहती है; यह चयन सरल, वर्तमान और धार्मिक प्रसंग के अनुकूल है।
theological_decisions:
- issue: संदर्भ से असंगत इब्रानी पंक्ति के कारण आधार-पाठ का चयन
  choice: इस पद के लिए दिए गए यूनानी समानांतर साक्ष्य का अनुवाद किया गया है और इब्रानी असंगति को पाद-टिप्पणी में बताया गया है।
  alternative: संलग्न किंतु सिराख 21:1 से असंगत इब्रानी पंक्ति ‘तीन से मैंने घृणा की, और चार से मैंने प्रेम नहीं किया’ का अनुवाद करना।
  rationale: प्रस्तुत इब्रानी पंक्ति इस पद के ज्ञात विषय और दिए गए पद-संदर्भ से मेल नहीं खाती, जबकि यूनानी साक्ष्य सिराख 21:1 का सुसंगत पाठ देता है। इसलिए पद-संदर्भ के प्रति निष्ठा रखते हुए यूनानी को प्रभावी आधार बनाया गया है और पाठगत समस्या छिपाई नहीं गई।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तू’ ज्ञान-साहित्य में गुरु द्वारा बच्चे को किए गए निकट, एकवचन संबोधन को व्यक्त करता है; इसे अपमानसूचक अर्थ में नहीं लिया गया है।
