base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/002.yaml
  text: Flee from sin as from the face of a snake[a]; for if you come near it, it will bite you.[b]
translation:
  language: hi
  text: पाप से ऐसे भागो, जैसे साँप के सामने से[a]; क्योंकि यदि तुम उसके पास जाओ, तो वह तुम्हें डस लेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पाप से ऐसे भागो, जैसे साँप के चेहरे या उपस्थिति से।” यहाँ “साँप” के लिए “सर्प” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: दिए गए स्रोत में काहिरा गनीज़ा से प्राप्त इब्रानी पंक्ति इस पद के यूनानी पाठ से मेल नहीं खाती और संभवतः विस्थापित पाठ या स्रोत-स्थान की त्रुटि है; इसलिए यहाँ अनुवाद यूनानी साक्ष्य के आधार पर किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: भागो
  rationale: यूनानी आज्ञार्थक क्रिया तत्काल और जोरदार ढंग से दूर भागने का भाव देती है; ‘भागो’ उस तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यह ἁμαρτία का मानक, सहज और नैतिक-धार्मिक अर्थ को सुरक्षित रखने वाला हिन्दी पर्याय है।
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: ऐसे ... जैसे साँप के सामने से
  rationale: πρόσωπον के शाब्दिक ‘मुख/चेहरा’ को हिन्दी मुहावरे में ‘सामने’ द्वारा व्यक्त किया गया है, जिससे साँप से आमने-सामने होने का ठोस बिंब बना रहता है।
- source_word: ἐὰν ... προσέλθῃς
  choice: यदि तुम उसके पास जाओगे
  rationale: προσέρχομαι यहाँ निकट जाने या पास पहुँचने का अर्थ देता है; यह रूप आधुनिक हिन्दी में सहज है।
- source_word: δήξεταί
  choice: वह तुम्हें डस लेगा
  rationale: साँप के काटने के लिए ‘डसना’ सटीक और स्वाभाविक हिन्दी क्रिया है तथा मूल रूपक की ठोस चेतावनी सुरक्षित रखती है।
theological_decisions:
- issue: जहाँ उपलब्ध इब्रानी पंक्ति और यूनानी पाठ में तीखा अंतर है, वहाँ मुख्य पाठ का आधार
  choice: इस पद का अनुवाद यूनानी समानांतर पाठ के आधार पर करना
  alternative: 'उपलब्ध कहाना इब्रानी पंक्ति का अनुवाद करना: ‘मदिरा-पान के घरों का अभ्यस्त शासक, जो नगर की ऊँचाइयों पर आसन लगाता है।’'
  rationale: दिया गया इब्रानी पाठ सिराख 21:2 के यूनानी पाठ से मेल नहीं खाता और संभवतः विस्थापित अथवा स्रोत-स्थान संबंधी त्रुटि है। इसलिए इस पद के सुसंगत प्राचीन साक्ष्य के रूप में यूनानी पाठ अपनाया गया है, जबकि पाठगत समस्या को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘डस लेगा’ साँप के रूपक को ‘काटेगा’ की तुलना में अधिक सटीक और जीवंत बनाता है।
