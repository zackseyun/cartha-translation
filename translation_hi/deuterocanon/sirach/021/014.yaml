lexical_decisions:
- source_word: ἔγκατα
  choice: अंतरतम
  rationale: शब्द का शाब्दिक अर्थ शरीर के भीतरी अंग है, पर ज्ञान को ग्रहण और धारण करने के इस नीतिवचनात्मक संदर्भ में यह व्यक्ति के भीतरी अस्तित्व को दर्शाता है। ‘अंतरतम’ उस भीतरी रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μωροῦ
  choice: मूर्ख का
  rationale: यह नैतिक और बौद्धिक रूप से विवेकहीन व्यक्ति को सूचित करता है; ‘मूर्ख’ नीतिवचन की संक्षिप्त और प्रखर शैली बनाए रखता है।
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: टूटे हुए पात्र के समान
  rationale: ἄγγιον किसी पात्र या बरतन का सामान्य शब्द है और συντετριμμένον बुरी तरह टूटे या चकनाचूर किए जाने का बोध देता है। ‘टूटे हुए पात्र’ पदार्थ या प्रकार को अनावश्यक रूप से निश्चित किए बिना मूल बिंब को सुरक्षित रखता है।
- source_word: πᾶσαν γνῶσιν
  choice: किसी भी ज्ञान को
  rationale: 'नकारात्मक वाक्य में πᾶσαν का स्वाभाविक हिन्दी अर्थ ‘किसी भी’ है: आशय यह है कि कोई ज्ञान उसके भीतर टिका नहीं रहता, न कि केवल यह कि वह समस्त ज्ञान को धारण नहीं कर पाता।'
- source_word: οὐ κρατήσει
  choice: थामे नहीं रखेगा
  rationale: κρατέω यहाँ पकड़कर रखने या धारण बनाए रखने का अर्थ देता है। ‘थामे नहीं रखेगा’ ज्ञान को याद रखने की बात कहता है और साथ ही टूटे पात्र के कुछ न रोक पाने वाले बिंब को प्रतिध्वनित करता है।
