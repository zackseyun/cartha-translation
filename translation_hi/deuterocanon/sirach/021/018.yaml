  text: मूर्ख के लिए बुद्धि उजड़े हुए घर[a] के समान है, और समझहीन व्यक्ति का ज्ञान ऐसी बातें हैं जिनकी जाँच नहीं की जा सकती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नष्ट हुआ घर”; यूनानी शब्द में मिटा दिए जाने या लुप्त कर दिए जाने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऐसी बातें जो समझ में नहीं आतीं”; यूनानी पद का बल बातों की दुर्बोधता पर अथवा उनकी सार्थक जाँच-पड़ताल न हो सकने पर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: उजड़ा हुआ घर
  rationale: ἠφανισμένος मिटा दिए जाने, नष्ट हो जाने या उजड़ जाने का भाव रखता है। इस उपमा में “उजड़ा हुआ घर” स्वाभाविक हिन्दी में विनाश और अनुपयोगिता की छवि बनाए रखता है।
- source_word: μωρῷ
  choice: मूर्ख के लिए
  rationale: 'सम्बन्धसूचक दत्तिव को सहज हिन्दी में व्यक्त करता है: मूर्ख के संदर्भ में बुद्धि उजड़े घर जैसी है।'
- source_word: σοφία
  choice: बुद्धि
  rationale: यह σοφία का प्रचलित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: γνῶσις
  choice: ज्ञान
  rationale: σοφία से भिन्न शब्द रखकर मूल के ‘बुद्धि’ और ‘ज्ञान’ के समानांतर भेद को सुरक्षित रखा गया है।
- source_word: ἀσυνέτου
  choice: समझहीन व्यक्ति
  rationale: ἀσύνετος समझ या विवेक के अभाव को दर्शाता है। इसे फिर से केवल ‘मूर्ख’ कहने के बजाय मूल के शब्दगत भेद को बनाए रखा गया है।
- source_word: ἀδιεξέταστοι λόγοι
  choice: ऐसी बातें जिनकी जाँच नहीं की जा सकती
  rationale: यह पद उन बातों का संकेत दे सकता है जिन्हें जाँच-परखकर समझा या अंत तक खोजा नहीं जा सकता। यह अनुवाद मूल की जाँच-पड़ताल की छवि को बनाए रखता है और अस्पष्टता को केवल ‘निरर्थक’ कहकर समाप्त नहीं करता।
