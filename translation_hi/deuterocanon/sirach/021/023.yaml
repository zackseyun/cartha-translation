lexical_decisions:
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह इब्रानी ज्ञान-साहित्य का प्रचलित शब्द है, जो केवल कम बुद्धि नहीं, बल्कि नैतिक और सामाजिक विवेक की कमी भी बताता है।
- source_word: מִפֶּתַח
  choice: द्वार से
  rationale: מִן के साथ פֶּתַח प्रवेश-स्थान से देखने की स्थिति व्यक्त करता है; संक्षिप्त हिन्दी वाक्यांश मूल चित्र को बनाए रखता है।
- source_word: יַבִּיט אֶל בָּיִת
  choice: घर के भीतर झाँकता है
  rationale: הביט אל का मूल अर्थ भीतर या उसकी ओर देखना है; यूनानी παρακύπτει भी ताक-झाँक के असभ्य भाव की पुष्टि करता है।
- source_word: וְכָבוֹד לְאִישׁ
  choice: पर सम्माननीय व्यक्ति
  rationale: इब्रानी पदबंध संक्षिप्त है—शाब्दिक रूप से ‘और मनुष्य के लिए सम्मान’; सन्दर्भ में यह शिष्ट आचरण वाले सम्माननीय व्यक्ति का संकेत देता है। यूनानी समानांतर में ‘शिक्षित/सुसंस्कृत व्यक्ति’ है।
- source_word: בַּחוּץ יַעֲמוֹד
  choice: बाहर खड़ा होकर
  rationale: यह मूल के बाहर ठहरने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और अगले क्रियापद से जुड़ता है।
- source_word: וִידַבֵּר
  choice: बात करता है
  rationale: इब्रानी में बोलने की क्रिया स्पष्ट रूप से मौजूद है; आशय है कि शिष्ट व्यक्ति भीतर झाँकने के बजाय बाहर से अपनी उपस्थिति जताकर बात करता है।
