- from: मूर्ख द्वार से घर के भीतर झाँकता है, पर सम्माननीय व्यक्ति बाहर खड़ा होकर बात करता है।[a]
  to: मूर्ख द्वार पर से घर के भीतर झाँकता है, पर जो व्यक्ति बाहर खड़ा होकर बात करता है, सम्मान उसी का है।[a]
  rationale: The revision restores the Hebrew’s compressed “honor [belongs] to a person” formulation in idiomatic Hindi, instead of interpreting it as “a respectable person.” It retains the explicit Hebrew verb “speak” and the existing, correctly anchored note concerning its absence from the Greek parallel.
  reviewer_model: gpt-5.6-terra
