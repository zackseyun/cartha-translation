review_pass:
  verdict: revise
  source_fidelity: The first clause accurately conveys the intrusive looking from the doorway. In the second clause, however, וְכָבוֹד לְאִישׁ is an elliptical expression meaning more literally that honor belongs to the person who stands outside and speaks; rendering it as “सम्माननीय व्यक्ति” prematurely turns the noun “honor” into an adjective describing the person. A more literal Hindi construction preserves both the Hebrew syntax and its interpretive openness.
  naturalness: The revised wording is natural, concise modern standard Hindi and retains the proverbial contrast. “सम्मान उसी का है” is idiomatic while preserving the Hebrew’s abstract expression.
  terminology: “मूर्ख” appropriately represents the wisdom-literature term אֱוִיל. “द्वार पर से” and “झाँकता है” convey the physical setting and intrusive nuance. “सम्मान” retains כָבוֹד as a noun rather than resolving it as “respectable/well-bred.”
  issues:
  - severity: medium
    issue: The phrase “सम्माननीय व्यक्ति” interprets the elliptical Hebrew noun כָבוֹד as a fixed personal quality.
    rationale: The Hebrew reads, in compressed form, “and honor [is] to a person [who] stands outside and speaks.” The draft’s adjectival rendering is plausible but narrows an intentionally compact expression. Rendering honor as an abstract noun better follows the primary Hebrew witness and does not require choosing between “honorable,” “well-bred,” or the Greek “educated/trained.”
  revised_text: मूर्ख द्वार पर से घर के भीतर झाँकता है, पर जो व्यक्ति बाहर खड़ा होकर बात करता है, सम्मान उसी का है।[a]
