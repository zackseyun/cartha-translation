base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: hi
  text: यदि कोई समझदार मनुष्य बुद्धि की बात[a] सुनता है, तो वह उसकी प्रशंसा करेगा और उसमें कुछ और जोड़ेगा[b]; अपव्ययी मनुष्य ने उसे सुना, और वह उसे अप्रिय लगी[c], और उसने उसे अपनी पीठ के पीछे फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमानी की उक्ति।” यूनानी अभिव्यक्ति किसी एक शब्द से अधिक व्यापक रूप से कही हुई बुद्धिमानी की बात को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “कुछ और जोड़ेगा” का सम्भावित अर्थ है कि वह उस बुद्धि की बात को आगे बढ़ाते हुए उसमें अपनी और सूझ जोड़ेगा।
    reason: lexical_alternative
  - marker: c
    text: यह यूनानी वाक्यांश कठिन है; इसका अनुवाद “उससे अप्रसन्न हुआ” भी हो सकता है। प्रसंग में अगला वाक्यांश दिखाता है कि उसने सुनी हुई बात को तिरस्कार से अलग कर दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: बुद्धि की बात
  rationale: यह पद किसी एक शब्द के बजाय बुद्धि से भरी कही हुई बात या उक्ति को सूचित कर सकता है। यह अनुवाद हिन्दी में स्वाभाविक रहते हुए उसके व्यापक अर्थ को बनाए रखता है।
- source_word: ἐπιστήμων
  choice: समझदार मनुष्य
  rationale: यह शब्द ज्ञान और समझ रखने वाले व्यक्ति को दर्शाता है। यूनानी के प्रतिनिधिक पुल्लिंग एकवचन को भी बनाए रखा गया है।
- source_word: αἰνέσει αὐτόν
  choice: वह उसकी प्रशंसा करेगा
  rationale: क्रिया का सीधा अर्थ प्रशंसा या सराहना करना है; सर्वनाम का आशय सुनी हुई बुद्धि की बात से है।
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: उसमें कुछ और जोड़ेगा
  rationale: यूनानी अभिव्यक्ति का शाब्दिक खुलापन सुरक्षित रखा गया है; सम्भवतः आशय उस बुद्धिमानी की बात को आगे बढ़ाने या उसमें और सूझ जोड़ने से है।
- source_word: ὁ σπαταλῶν
  choice: अपव्ययी मनुष्य
  rationale: कृदन्त ऐसे मनुष्य को दर्शाता है जो फिजूलखर्च, आत्मलिप्त या उच्छृंखल जीवन जीता है। ‘अपव्ययी’ मूल भाव को संक्षेप में रखता है, यद्यपि उसके अर्थ का नैतिक विस्तार अधिक हो सकता है।
- source_word: ἀπῄρεσεν αὐτῷ
  choice: उसे ठुकरा दिया
  rationale: यह पाठगत और अर्थगत रूप से कठिन अभिव्यक्ति है। अगले वाक्यांश में बात को पीठ के पीछे फेंकने की छवि के अनुसार यहाँ नकारात्मक प्रतिक्रिया और अस्वीकार का भाव व्यक्त किया गया है।
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: उसे अपनी पीठ के पीछे फेंक दिया
  rationale: यह अनुवाद यूनानी की सजीव शारीरिक छवि और बात को तिरस्कारपूर्वक त्याग देने के भाव, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: दोनों प्रकार के सुनने वालों के लिए ‘मनुष्य’
  alternative: ‘व्यक्ति’ अथवा बहुवचन रूप
  rationale: यूनानी पाठ दोनों चरित्रों को पुल्लिंग एकवचन में प्रस्तुत करता है। हिन्दी में ‘मनुष्य’ उस प्रतिनिधिक रूप को स्वाभाविक ढंग से बनाए रखता है और कथन को केवल पुरुषों तक सीमित करने की आवश्यकता नहीं दर्शाता।
- issue: कठिन वाक्यांश ἀπῄρεσεν αὐτῷ का अर्थ
  choice: उसे ठुकरा दिया
  alternative: उससे अप्रसन्न हुआ
  rationale: अभिव्यक्ति अनिश्चित है; अगले दृश्यात्मक कार्य से अस्वीकार का अर्थ प्रसंगानुकूल है। वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। पहले खंड के भविष्यकाल और दूसरे खंड के यूनानी भूतकाल को जानबूझकर सुरक्षित रखा गया है। ‘अपव्ययी’ सामान्य पाठक के लिए बोधगम्य है और σπαταλῶν के फिजूलखर्च तथा आत्मलिप्त जीवन के भाव को संक्षेप में व्यक्त करता है।
