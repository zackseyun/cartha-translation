lexical_decisions:
- source_word: ὁ φυλάσσων νόμον
  choice: जो व्यवस्था का पालन करता है
  rationale: वर्तमानकालिक कृदंत का सामान्य और निरंतर भाव स्वाभाविक हिन्दी में व्यक्त होता है। यहाँ νόμος ज्ञात धार्मिक-नैतिक व्यवस्था को सूचित करता है।
- source_word: κατακρατεῖ
  choice: अधिकार रखता है
  rationale: क्रिया का अर्थ पकड़कर रखना, वश में रखना या उस पर प्रभुत्व पाना हो सकता है। ‘अधिकार रखता है’ भीतर के विचार या मन पर संयम का प्रमुख भाव बनाए रखता है।
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: अपने मन पर
  rationale: ἐννόημα विचार, अभिप्राय, मन या समझ को सूचित कर सकता है। ‘मन’ आधुनिक हिन्दी में इस संक्षिप्त यूनानी पदबंध के आंतरिक मानसिक पक्ष को स्वाभाविक ढंग से व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: συντέλεια
  choice: पूर्णता
  rationale: यह शब्द किसी बात के पूर्ण होने या अपने पूरे परिणाम तक पहुँचने को दर्शाता है। ‘पूर्णता’ मूल रूपक को बनाए रखती है और अनावश्यक युगांत-संबंधी अर्थ नहीं जोड़ती।
- source_word: τοῦ φόβου Κυρίου
  choice: प्रभु के भय की
  rationale: यह ज्ञान-साहित्य का प्रचलित पद है और प्रभु के प्रति श्रद्धामय भय को दर्शाता है।
- source_word: σοφία
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में σοφία के लिए ‘बुद्धि’ स्पष्ट, प्रतिष्ठित और सहज हिन्दी पर्याय है।
theological_decisions:
- issue: व्यवस्था के पालन और व्यक्ति की आंतरिक मानसिक शक्ति के बीच संबंध
  choice: व्यवस्था का पालन करने वाला अपने मन पर अधिकार रखता है।
  alternative: वह अपने विचार को दृढ़ता से थामे रहता है; अपने उद्देश्य पर कायम रहता है; या अपनी समझ को सुरक्षित रखता है।
  rationale: यूनानी κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ संक्षिप्त और अर्थ की दृष्टि से व्यापक है। मुख्य पाठ आज्ञापालन से उत्पन्न आत्म-संयम का संभावित अर्थ देता है, जबकि पादटिप्पणी विचार, उद्देश्य और समझ से जुड़े अन्य वास्तविक अर्थों को सुरक्षित रखती है।
- issue: प्रभु के भय और बुद्धि के बीच संबंध
  choice: प्रभु के भय की पूर्णता बुद्धि है।
  alternative: प्रभु के भय की परिणति बुद्धि है।
  rationale: संज्ञात्मक यूनानी वाक्य संबंध को संक्षिप्त रखता है; इसलिए अनुवाद यह तय नहीं करता कि बुद्धि केवल परिणाम है, चरम अवस्था है, या भय की पूर्ण अभिव्यक्ति।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञानोक्ति-शैली रखी गई है। ‘व्यवस्था,’ ‘प्रभु का भय’ और ‘बुद्धि’ जैसे स्थापित बाइबलीय पद सामान्य पाठक के लिए सुबोध हैं।
