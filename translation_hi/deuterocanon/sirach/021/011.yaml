    text: या, “वह अपने विचार को दृढ़ता से थामे रहता है,” “अपने अभिप्राय पर कायम रहता है,” अथवा “अपनी समझ को सुरक्षित रखता है।” यूनानी पदबंध संक्षिप्त है; यहाँ प्रयुक्त शब्द का अर्थ विचार, अभिप्राय, मन, या समझ हो सकता है।
