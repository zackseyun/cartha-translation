translation:
  language: hi
  text: मूर्ख हँसते समय अपनी आवाज़ ऊँची करता है, पर चतुर मनुष्य मुश्किल से ही चुपचाप मुस्कराता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μωρός
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में नैतिक और व्यावहारिक विवेकहीनता के लिए यह स्वाभाविक, कहावत-सुलभ शब्द है।
- source_word: ἐν γέλωτι
  choice: हँसते समय
  rationale: यह हँसी के दौरान ऊँची आवाज़ करने का आशय सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνυψοῖ φωνὴν αὐτοῦ
  choice: अपनी आवाज़ ऊँची करता है
  rationale: मूल के शाब्दिक अर्थ को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: पुल्लिंग एकवचन को रखते हुए हिन्दी में प्रतिनिधिक और गरिमापूर्ण अभिव्यक्ति देता है।
- source_word: πανοῦργος
  choice: चतुर
  rationale: प्रसंग में यह सामाजिक समझ और संयम का सकारात्मक भाव देता है; ‘धूर्त’ अनावश्यक रूप से नकारात्मक होता।
- source_word: μόλις
  choice: मुश्किल से ही
  rationale: क्रिया की अत्यल्पता अथवा कठिनता का भाव रखता है और मूल की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी देता है।
- source_word: ἡσυχῇ
  choice: चुपचाप
  rationale: क्रियाविशेषण रूप में शांति और ध्वनि-संयम व्यक्त करता है, जिससे ऊँची आवाज़ का विरोध स्पष्ट रहता है।
- source_word: μειδιάσει
  choice: मुस्कराता है
  rationale: मंद मुस्कान को ऊँची हँसी से स्पष्ट रूप से अलग करता है; यूनानी भविष्यकाल का हिन्दी कहावत में सामान्य वर्तमान स्वाभाविक है।
