  text: One who hates reproof walks in the track of a sinner, but one who fears the Lord will turn back in his heart.
translation:
  language: hi
  text: जो डाँट से घृणा करता है, वह पापी के पदचिह्नों पर चलता है[a]; पर जो प्रभु का भय मानता है, वह मन ही मन लौट आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “वह पापी के पदचिह्न पर है।” यूनानी के पहले उपवाक्य में क्रिया निहित है; इसलिए मुख्य पाठ में पदचिह्न के बिंब को स्वाभाविक बनाने के लिए “चलता है” जोड़ा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: जो ... घृणा करता है
  rationale: वर्तमान कृदन्त यहाँ संज्ञात्मक है और एक प्रकार के व्यक्ति का सतत स्वभाव बताता है।
- source_word: ἐλεγμὸν
  choice: डाँट
  rationale: यह नैतिक भूल पर दी जाने वाली सुधारात्मक फटकार को साधारण और स्वाभाविक हिन्दी में व्यक्त करता है; ‘सुधार’ सम्भव है, पर यूनानी शब्द के फटकार वाले पक्ष को कम कर देता है।
- source_word: ἐν ἴχνει
  choice: पदचिह्नों पर चलता है
  rationale: ἴχνος पदचिह्न, पगचिह्न या राह को दर्शाता है। यूनानी में स्पष्ट क्रिया नहीं है; हिन्दी में बिंब को स्वाभाविक बनाने के लिए ‘चलता है’ की पूर्ति की गई है।
- source_word: ἁμαρτωλοῦ
  choice: पापी के
  rationale: एकवचन यहाँ किसी विशेष व्यक्ति के बजाय सामान्य प्रकार के व्यक्ति को सूचित करता है।
- source_word: ὁ φοβούμενος Κύριον
  choice: जो प्रभु का भय मानता है
  rationale: संज्ञात्मक कृदन्त का स्वाभाविक हिन्दी रूप है; ‘प्रभु का भय मानना’ बाइबलीय श्रद्धा और जवाबदेही की अभिव्यक्ति को बनाए रखता है।
- source_word: ἐπιστρέψει
  choice: लौट आएगा
  rationale: भविष्यकालीन क्रिया के मूल ‘मुड़ने/लौटने’ के अर्थ को रखा गया है; ‘पश्चाताप करेगा’ अर्थ की सम्भावित दिशा को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: ἐν καρδίᾳ
  choice: अपने मन में
  rationale: καρδία यहाँ आन्तरिक विचार और प्रवृत्ति का केन्द्र है। आधुनिक हिन्दी में ‘मन में’ स्वाभाविक है और आन्तरिकता बनाए रखता है।
theological_decisions:
- issue: Κύριον का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ईश्वर के लिए श्रद्धासूचक ज्ञान-साहित्यिक प्रयोग में ‘प्रभु’ स्वाभाविक और स्थापित है।
- issue: पहले उपवाक्य में निहित क्रिया की पूर्ति
  choice: पापी के पदचिह्नों पर चलता है
  alternative: पापी के पदचिह्नों पर है
  rationale: यूनानी उपवाक्य क्रियाविहीन और संक्षिप्त है। ‘चलता है’ पदचिह्न के मार्ग-बिंब को स्पष्ट करता है, पर इस पूर्ति को पादटिप्पणी में बताया गया है।
- issue: ἐπιστρέψει का आशय
  choice: लौट आएगा
  alternative: पश्चाताप करेगा
  rationale: मूल शब्द के व्यापक और कुछ हद तक अस्पष्ट ‘लौटने’ के अर्थ को सुरक्षित रखा गया है; इसे किसी विशिष्ट धर्मवैज्ञानिक पश्चाताप-सूत्र तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘डाँट’ सामान्य पाठक के लिए सहज है; ‘पदचिह्नों’ से मूल रूपक और ‘अपने मन में’ से आन्तरिक प्रत्यावर्तन का भाव सुरक्षित रहता है।
