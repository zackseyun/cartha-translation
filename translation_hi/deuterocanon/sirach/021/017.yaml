  yaml_path: translation/deuterocanon/sirach/021/017.yaml
  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
translation:
  language: hi
  text: सभा में बुद्धिमान के मुख की खोज की जाएगी[a], और उसके वचनों पर हृदय में विचार किया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभा में बुद्धिमान के मुख की चाह होगी।”
    reason: ζητέω यहाँ खोजने के साथ-साथ किसी की वाणी को चाहने या उसका मूल्य मानने का भाव भी दे सकता है।
  - marker: b
    text: यूनानी में क्रिया तृतीय पुरुष एकवचन है, पर उसका कर्ता स्पष्ट नहीं है। सम्भवतः कोई व्यक्ति, अथवा प्रसंगानुसार सभा का कोई सदस्य, उसके वचनों पर अपने हृदय में विचार करता है।
    reason: मूल पाठ के अप्रकट एकवचन कर्ता और ‘हृदय’ के एकवचन रूप की अस्पष्टता को बिना किसी एक व्याख्या को निश्चित किए स्पष्ट करना।
lexical_decisions:
- source_word: στόμα
  choice: मुख
  rationale: ‘मुख’ यूनानी की ठोस उपमा को बनाए रखता है; यहाँ आशय बुद्धिमान की वाणी से है, पर अनुवाद में उपमा को सीधे ‘वाणी’ बनाकर नहीं खोला गया।
- source_word: φρονίμου
  choice: बुद्धिमान के
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और ‘मुख’ को संबंधकारक रूप में विशेषित करता है।
- source_word: ζητηθήσεται
  choice: खोज की जाएगी
  rationale: भविष्यत् कर्मवाच्य को बनाए रखता है। संदर्भ में इसका भाव ‘चाहा जाएगा’ या ‘माँग होगी’ भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἐν ἐκκλησίᾳ
  choice: सभा में
  rationale: यह ज्ञान-साहित्य में एकत्र समुदाय है; ‘कलीसिया’ बाद का संस्थागत अर्थ ला सकता है।
- source_word: λόγους
  choice: वचनों
  rationale: ‘वचन’ λόγοι का गरिमापूर्ण और स्वाभाविक हिन्दी समतुल्य है तथा कथनों की व्यापकता बनाए रखता है।
- source_word: διανοηθήσεται
  choice: मनन किया जाएगा
  rationale: क्रिया भीतर विचार करने या गंभीरता से ध्यान देने का भाव रखती है। यूनानी में इसका कर्ता स्पष्ट नहीं है; हिन्दी का भाववाचक-कर्मवाच्य रूप उस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: ἐν καρδίᾳ
  choice: हृदय में
  rationale: यूनानी में निश्चयवाचक या संबंधसूचक शब्द नहीं है। ‘हृदय’ बाइबलीय आंतरिक चिंतन की छवि को बनाए रखता है।
theological_decisions:
- issue: φρονίμου का लैंगिक रूप
  choice: बुद्धिमान
  alternative: बुद्धिमान व्यक्ति
  rationale: यूनानी रूप पुल्लिंग एकवचन है; संदर्भ इसे स्पष्ट रूप से सामान्य, लिंग-समावेशी अमूर्तन नहीं बनाता।
- issue: ἐκκλησία का सामुदायिक अर्थ
  choice: सभा
  alternative: समुदाय / कलीसिया
  rationale: यहाँ बाद की ईसाई संस्था का तकनीकी अर्थ आरोपित किए बिना एकत्र समुदाय का अर्थ व्यक्त किया गया है।
- issue: διανοηθήσεται का अप्रकट कर्ता
  choice: हिन्दी में अप्रकट रखा गया
  alternative: ‘सभा उसके वचनों पर मनन करेगी’
  rationale: यूनानी क्रिया एकवचन है, लेकिन कर्ता व्यक्त नहीं है। ‘सभा’ संभावित कर्ता है, पर उसे मुख्य पाठ में निश्चित कर देना मूल की अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की गरिमापूर्ण शास्त्रीय शैली में है। ‘मुख’ और ‘हृदय’ मूल की ठोस बाइबलीय छवियाँ बनाए रखते हैं। दूसरे खंड में भाववाचक-कर्मवाच्य रचना हिन्दी में कुछ औपचारिक है, पर इससे यूनानी के अप्रकट कर्ता को जबरन ‘लोग’ या ‘सभा’ नहीं बनाया गया।
