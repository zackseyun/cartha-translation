  text: The way of sinners is paved with stones[b][a], and at its end is the pit of Hades.
translation:
  language: hi
  text: पापियों का मार्ग पत्थरों से समतल बनाया गया है[a], और उसके अंत में अधोलोक का गड्ढा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्थर बिछाकर बनाया गया है।” यूनानी शब्द मार्ग को बराबर या समतल किए जाने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अधोलोक” से यहाँ मृतकों का लोक अभिप्रेत है; अनुवाद “मृतलोक” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: मार्ग
  rationale: यह शब्द जीवन-आचरण के रूपक और वास्तविक रास्ते के चित्र—दोनों को बनाए रखता है।
- source_word: ἁμαρτωλῶν
  choice: पापियों का
  rationale: संबंधकारक बहुवचन का सीधा और संक्षिप्त अनुवाद है; मूल की नैतिक श्रेणी को कमज़ोर नहीं करता।
- source_word: ὡμαλισμένη
  choice: समतल बनाया गया है
  rationale: कृदंत का मूल भाव किसी रास्ते को बराबर या चिकना करने का है। यह अनुवाद उस अर्थ को स्पष्ट रखता है, जबकि पत्थरों का उल्लेख सड़क की छवि देता है।
- source_word: ἐκ λίθων
  choice: पत्थरों से
  rationale: ἐκ यहाँ उस सामग्री को बताता है जिससे मार्ग समतल या तैयार किया गया है।
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: उसके अंत में
  rationale: यह मार्ग के अंतिम छोर और उसके परिणाम—दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βόθρος
  choice: गड्ढा
  rationale: शब्द का मूल अर्थ गड्ढा या खड्ड है; यहाँ यह मृत्यु की ओर ले जाने वाले भयावह अंत का ठोस चित्र प्रस्तुत करता है।
- source_word: ᾅδου
  choice: अधोलोक का
  rationale: यह यूनानी ᾅδης को मृतकों के लोक के रूप में व्यक्त करता है और इसे बाद की विकसित ‘नरक’ संबंधी धारणा से नहीं मिलाता।
theological_decisions:
- issue: ज्ञान-साहित्य की इस छवि में ᾅδου का अनुवाद
  choice: अधोलोक
  alternative: मृतलोक; कब्र
  rationale: मूल में साधारण कब्र के लिए कोई सामान्य शब्द नहीं, बल्कि ᾅδης है। ‘अधोलोक’ मृतकों के लोक की धारणा को सुरक्षित रखता है और पाठ को दंड के अंतिम नरक के अर्थ में अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सरल रूप अपनाया गया है। ‘मार्ग’ ज्ञान-साहित्य के नैतिक रूपक के अनुकूल है। मूल यूनानी में संयोजक καί सामान्यतः ‘और’ है, पर यहाँ परिणाम के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘पर’ चुना गया है।
