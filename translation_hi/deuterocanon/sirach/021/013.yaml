translation:
  language: hi
  text: बुद्धिमान पुरुष का ज्ञान बाढ़ के समान बढ़ेगा, और उसकी सलाह जीवन के सोते के समान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνῶσις
  choice: ज्ञान
  rationale: ‘ज्ञान’ γνῶσις का सीधा और स्वाभाविक हिन्दी समतुल्य है तथा यहाँ बुद्धि-साहित्य के संदर्भ में उपयुक्त है।
- source_word: σοφοῦ
  choice: बुद्धिमान पुरुष का
  rationale: यूनानी शब्द संबंधकारक, पुल्लिंग, एकवचन है; इसलिए प्रतिनिधिक व्यक्ति के रूप में उसके व्याकरणिक लिंग और वचन को बनाए रखा गया है।
- source_word: ὡς κατακλυσμός
  choice: बाढ़ के समान
  rationale: κατακλυσμός प्रचुर जल-प्लावन या बाढ़ को दर्शाता है; यह हिन्दी में स्पष्ट और सजीव उपमा है।
- source_word: πληθυνθήσεται
  choice: बढ़ेगा
  rationale: यह भविष्यकाल में मात्रा या प्रचुरता की वृद्धि व्यक्त करता है; ‘बढ़ेगा’ स्वाभाविक हिन्दी में वही आशय देता है।
- source_word: βουλή
  choice: सलाह
  rationale: इस ज्ञान-साहित्यिक प्रसंग में βουλή का व्यावहारिक अर्थ विवेकपूर्ण सलाह है; ‘परामर्श’ की अपेक्षा ‘सलाह’ अधिक सहज आधुनिक हिन्दी है।
- source_word: πηγή ζωῆς
  choice: जीवन का सोता
  rationale: πηγή प्राकृतिक जलस्रोत या सोते को दर्शाता है; ‘जीवन का सोता’ मूल रूपक को सजीव और गरिमापूर्ण ढंग से बनाए रखता है।
theological_decisions:
- issue: σοφοῦ के लिंग और वचन का अनुवाद
  choice: बुद्धिमान पुरुष का
  alternative: बुद्धिमान व्यक्ति का / बुद्धिमानों का
  rationale: मूल यूनानी पुल्लिंग एकवचन में एक प्रतिनिधिक बुद्धिमान पुरुष की बात करता है। इसे बहुवचन या लिंग-निरपेक्ष रूप में सामान्यीकृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला अनुवाद। ‘सोता’ प्राकृतिक जीवनदायी स्रोत की मूल छवि को सुरक्षित रखता है।
