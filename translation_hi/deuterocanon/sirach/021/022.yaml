  yaml_path: translation/deuterocanon/sirach/021/022.yaml
  text: A fool’s foot hurries to a house[a], but a man of schemes bows low before the great.
translation:
  language: hi
  text: मूर्ख का पाँव किसी घर की ओर जल्दी बढ़ता है, पर युक्तियाँ बनानेवाला मनुष्य बड़ों के सामने झुकता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘बड़ों’ का अर्थ ‘बहुतों’ भी हो सकता है। यूनानी समानांतर का दूसरा भाग भिन्न है: ‘पर बहुत अनुभवी मनुष्य किसी के सामने लज्जित होगा।’'
    reason: इब्रानी לָרַבִּים की शब्दगत अस्पष्टता और दूसरे चरण में यूनानी समानांतर के वैकल्पिक पाठ को सुरक्षित रखना।
lexical_decisions:
- source_word: רֶגֶל
  choice: पाँव
  rationale: एकवचन इब्रानी बिंब को कहावत की संक्षिप्त शैली में बनाए रखता है; ‘कदम’ कहने से मूल चित्र अनावश्यक रूप से सहज हो जाता।
- source_word: נָבָל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य के नैतिक और बौद्धिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִהֲרָה
  choice: जल्दी बढ़ता है
  rationale: घर की ओर उतावलेपन से जाने का भाव व्यक्त करता है और ‘पाँव’ के साथ हिन्दी में स्वाभाविक है।
- source_word: אֶל בָּיִת
  choice: किसी घर की ओर
  rationale: मूल में घर अनिश्चित है; ‘किसी’ व्यापक कहावती अर्थ को स्पष्ट रखता है, जबकि ‘की ओर’ אֶל की दिशा को दर्शाता है।
- source_word: אִישׁ מְזִימוֹת
  choice: युक्तियाँ रचनेवाला मनुष्य
  rationale: מְזִימוֹת के ‘योजनाओं/युक्तियों’ वाले, नैतिक रूप से कुछ अस्पष्ट अर्थ को बनाए रखता है; इसे सीधे ‘बुद्धिमान’ या ‘षड्यंत्रकारी’ नहीं बनाता।
- source_word: יַכְנִיעַ
  choice: अपने को दीन करता है
  rationale: हिफ़ील रूप में झुकने या स्वयं को नीचा करने का भाव प्रसंगानुकूल प्रतिवर्ती हिन्दी में व्यक्त होता है।
- source_word: לָרַבִּים
  choice: बड़ों के सामने
  rationale: רַבִּים का अर्थ ‘बहुतों’ अथवा ‘बड़े लोगों’ दोनों हो सकता है। सामाजिक आदर के प्रसंग में ‘बड़ों’ सुसंगत है, पर वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दूसरे चरण में इब्रानी और यूनानी पाठों का उल्लेखनीय अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण
  alternative: ‘बहुत अनुभवी मनुष्य किसी के सामने लज्जित होगा।’
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य प्राथमिक है। यूनानी समानांतर पहले चरण में निकट है, किंतु दूसरे चरण में अलग पाठ देता है; इसलिए उसके पाठ को पादटिप्पणी में ईमानदारी से सुरक्षित रखा गया है।
- issue: לָרַבִּים की अर्थगत अस्पष्टता
  choice: बड़ों के सामने
  alternative: बहुतों के सामने
  rationale: इब्रानी शब्द दोनों अर्थ दे सकता है। ‘अपने को दीन करता है’ के साथ सामाजिक रूप से प्रतिष्ठित लोगों का अर्थ अधिक सुसंगत है, फिर भी ‘बहुतों’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कहावत-सदृश हिन्दी। मूल के ‘पाँव’ वाले ठोस बिंब तथा दूसरे चरण की नैतिक अस्पष्टता को बनाए रखा गया है।
