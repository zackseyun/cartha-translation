  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: hi
  text: जो पराए धन से अपना घर बनाता है, वह उस व्यक्ति के समान है जो जाड़े के लिए अपने पत्थर इकट्ठे करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरों की संपत्ति से।” यूनानी पद का अर्थ ऐसे साधनों का उपयोग करना है जो किसी और के हैं।
    reason: lexical_alternative
  - marker: b
    text: “जाड़े के लिए” का अर्थ “तूफानी मौसम के लिए” भी हो सकता है; इससे व्यर्थता का चित्र और तीखा होता है—सुरक्षित घर बनाने के लिए सामग्री बहुत देर से जुटाई जा रही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: जो ... बनाता है
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ सामान्य नीतिवचनात्मक व्यक्ति को सूचित करता है; यह हिंदी में स्वाभाविक और समावेशी रूप है।
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: अपना घर
  rationale: निर्माण और पत्थरों के संदर्भ में οἰκία का प्राथमिक अर्थ भौतिक घर है; ‘अपना’ कर्ता से उसका संबंध स्पष्ट करता है।
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: पराए धन से
  rationale: χρήματα धन, संपत्ति या संसाधन हो सकता है और ἀλλότριος किसी दूसरे के स्वामित्व को दर्शाता है। ‘पराया धन’ संक्षेप में यही भाव देता है, बिना इसे केवल नकद तक सीमित किए।
- source_word: ὡς συνάγων
  choice: उस व्यक्ति के समान है जो ... इकट्ठे करता है
  rationale: ὡς के साथ कृदंत उपमा प्रस्तुत करता है; हिंदी में यह संरचना उपमा को स्पष्ट और स्वाभाविक रखती है।
- source_word: αὐτοῦ τοὺς λίθους
  choice: अपने पत्थर
  rationale: पाठ में αὐτοῦ अधिकार-सूचक है। ‘अपने पत्थर’ उन्हें उपमा के व्यक्ति से जोड़ता है और पाठ की अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
- source_word: εἰς χειμῶνα
  choice: जाड़े के लिए
  rationale: χειμών का अर्थ जाड़ा अथवा तूफानी मौसम हो सकता है। ‘जाड़े के लिए’ मुख्य कालगत चित्र को सहज आधुनिक हिंदी में बनाए रखता है।
