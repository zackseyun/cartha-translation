  text: All lawlessness is like a two-edged sword; for its wound there is no healing.
translation:
  language: hi
  text: हर अधर्म दोधारी तलवार के समान है; उसके घाव का कोई उपचार नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: के समान
  rationale: यह उपमा का संकेत देता है; आधुनिक मानक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: ῥομφαία δίστομος
  choice: दोधारी तलवार
  rationale: δίστομος का शाब्दिक बिंब ‘दो मुँह वाली’ है, पर यहाँ आशय दोनों ओर धार वाली तलवार से है; ‘दोधारी तलवार’ प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: πᾶσα ἀνομία
  choice: हर अधर्म
  rationale: ἀνομία व्यवस्था या विधि के उल्लंघन से जुड़े नैतिक अनाचार को व्यक्त करता है। ‘हर अधर्म’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा πᾶσα का वितरणात्मक बल बनाए रखता है।
- source_word: τῇ πληγῇ αὐτῆς
  choice: उसके घाव का
  rationale: ἴασις के साथ πληγή को ‘घाव’ समझना सबसे संगत है। αὐτῆς को ‘उसके’ के रूप में रखकर मूल की यह अस्पष्टता बनी रहती है कि संकेत अधर्म रूपी तलवार के घाव की ओर है।
- source_word: οὐκ ἔστιν ἴασις
  choice: कोई उपचार नहीं है
  rationale: यह यूनानी कथन की निरपेक्षता को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक ढंग से उपचार या चंगाई के अभाव को व्यक्त करता है।
theological_decisions:
- issue: ἀνομία का नैतिक अर्थ
  choice: अधर्म
  alternative: व्यवस्था-विहीनता / हर व्यवस्था-विरोधी काम
  rationale: ‘अधर्म’ सामान्य हिन्दी पाठक के लिए स्वाभाविक धार्मिक-नैतिक शब्द है और विधि तथा उचित व्यवस्था के उल्लंघन का भाव समेट सकता है। अधिक शाब्दिक ‘व्यवस्था-विहीनता’ यहाँ अस्वाभाविक और अमूर्त लगेगा।
- issue: घाव के उपचार का निरपेक्ष कथन
  choice: उसके घाव का कोई उपचार नहीं है
  alternative: उससे लगा घाव ठीक नहीं होता
  rationale: मूल का कथन प्रबल और निरपेक्ष है। उसे सीमित या व्याख्यायित किए बिना उसी लोकोक्तिपरक तनाव में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली। ‘दोधारी तलवार’ सहज बिंब है, जबकि ‘अधर्म’ नैतिक और विधि-विरोधी अर्थक्षेत्र को सामान्य पाठक के लिए सुबोध रखता है।
