  yaml_path: translation/deuterocanon/sirach/021/024.yaml
  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: hi
  text: दरवाज़े के पास सुनना मनुष्य की अशिष्टता है, पर समझदार मनुष्य अपमान से बोझिल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαιδευσία
  choice: अशिष्टता
  rationale: यह संज्ञा शिक्षा-संस्कार या उचित प्रशिक्षण के अभाव से उपजे असभ्य आचरण को व्यक्त करती है। इस प्रसंग में ‘अशिष्टता’ स्वाभाविक हिन्दी में उसके सामाजिक और नैतिक भाव को संक्षेप में रखती है।
- source_word: ἀνθρώπου
  choice: मनुष्य की
  rationale: पुल्लिंग एकवचन संबंधकारक को ‘मनुष्य की’ के रूप में रखा गया है; हिन्दी में यह सामान्य मानवीय कथन के रूप में स्वाभाविक है।
- source_word: ἀκροᾶσθαι
  choice: सुनना
  rationale: क्रिया का मूल अर्थ ध्यान लगाकर सुनना है। ‘कान लगाकर सुनना’ निहित आशय को मुख्य पाठ में अधिक स्पष्ट कर देता, इसलिए अपेक्षाकृत शाब्दिक ‘सुनना’ रखा गया है।
- source_word: παρὰ θύραν
  choice: दरवाज़े के पास खड़े होकर
  rationale: παρά के साथ द्वार के निकट स्थिति का चित्र है। हिन्दी में केवल ‘दरवाज़े के पास सुनना’ अस्वाभाविक लगता है, इसलिए ‘खड़े होकर’ जोड़कर दृश्य को स्वाभाविक बनाया गया है, बिना छिपकर सुनने की निहित बात को पूर्णतः स्पष्ट किए।
- source_word: φρόνιμος
  choice: समझदार मनुष्य
  rationale: यह शब्द व्यावहारिक बुद्धि और उचित विवेक रखने वाले व्यक्ति को दर्शाता है। ‘समझदार’ आधुनिक सामान्य हिन्दी में सहज और सटीक है।
- source_word: βαρυνθήσεται
  choice: व्यथित होगा
  rationale: शाब्दिक अर्थ ‘भारी किया जाएगा/बोझिल होगा’ है; प्रसंग में यह अपमानजनक व्यवहार से मन पर पड़ने वाले भार को व्यक्त करता है। ‘व्यथित होगा’ हिन्दी में उस प्रतिक्रिया को स्वाभाविक रूप देता है।
- source_word: ἀτιμίᾳ
  choice: ऐसे अपमानजनक आचरण से
  rationale: सम्प्रदान कारक यहाँ कारण या साधन बता सकता है। ‘अपमानजनक आचरण’ पहले खंड में वर्णित अशिष्ट काम से संबंध स्पष्ट करता है, जबकि ἀτιμία के अनादर/लज्जाजनकता के भाव को बनाए रखता है।
theological_decisions:
- issue: ἀτιμίᾳ का संबंध और आशय
  choice: समझदार व्यक्ति पहले खंड में बताए अपमानजनक आचरण से व्यथित होता है
  alternative: समझदार व्यक्ति स्वयं पर आए अपमान या बदनामी से बोझिल होता है
  rationale: यूनानी वाक्य कारण को संक्षेप में रखता है और संबंध कुछ अस्पष्ट है। प्रसंगगत प्रवाह पहले खंड के अशिष्ट कर्म पर प्रतिक्रिया का समर्थन करता है; फिर भी इसे किसी विशिष्ट धार्मिक शिक्षा में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी अपनाई गई है। ‘दरवाज़ा’ तथा ‘समझदार’ जैसे सहज शब्दों के साथ सूक्तिपरक स्वर रखा गया है। मुख्य पाठ में निहित ‘छिपकर सुनने’ के अर्थ को पूरी तरह खोलने के बजाय पादटिप्पणी में बताया गया है।
