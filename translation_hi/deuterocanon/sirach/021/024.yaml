revisions:
- from: दरवाज़े के पास खड़े होकर सुनना[a] मनुष्य की अशिष्टता है, पर समझदार मनुष्य ऐसे अपमानजनक आचरण से व्यथित होगा।
  to: दरवाज़े के पास सुनना मनुष्य की अशिष्टता है, पर समझदार मनुष्य अपमान से बोझिल होगा।
  rationale: The revision removes the unsupported detail “खड़े होकर” and renders the final dative simply as “अपमान से,” preserving the original’s ambiguity about the disgrace or dishonor that burdens the prudent person. The footnote remains appropriate because it explains the contextual implication of listening at a door without placing “छिपकर सुनना” in the main text.
