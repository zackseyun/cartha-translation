review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the first clause’s social impropriety, but adds “खड़े होकर,” which is not expressed by παρὰ θύραν. In the second clause, “ऐसे अपमानजनक आचरण से” makes ἀτιμίᾳ explicitly refer to the preceding conduct; the Greek dative simply says “by/because of disgrace, dishonor,” leaving its precise reference open. The revision removes both additions and retains the burden imagery of βαρυνθήσεται.
  naturalness: The revised wording is concise, proverbial, and natural in modern standard Hindi. “बोझिल होगा” preserves the image of being made heavy without an overly literal or awkward construction.
  terminology: “अशिष्टता” suitably represents ἀπαιδευσία in its sense of ill-bred or undisciplined behavior. “समझदार” is a natural rendering of φρόνιμος. “अपमान” renders ἀτιμία broadly enough to retain the source’s ambiguity, rather than specifying disgraceful conduct.
  issues:
  - severity: medium
    issue: The phrase “खड़े होकर” is added to the first clause.
    rationale: The Greek says only “to listen at/by a door”; it does not state that the person is standing. The addition is unnecessary for idiomatic Hindi and slightly expands the scene.
  - severity: medium
    issue: “ऐसे अपमानजनक आचरण से” over-specifies ἀτιμίᾳ.
    rationale: ἀτιμίᾳ means disgrace, dishonor, or insult. It may be understood contextually, but the Greek does not explicitly identify it as the earlier act of listening at a door. The translation should preserve that compressed reference.
  revised_text: दरवाज़े के पास सुनना मनुष्य की अशिष्टता है, पर समझदार मनुष्य अपमान से बोझिल होगा।
  revised_footnotes:
