  yaml_path: translation/deuterocanon/sirach/021/027.yaml
  text: When the ungodly curses the Adversary[a], he curses his own soul.
translation:
  language: hi
  text: जब अधर्मी विरोधी[a] को शाप देता है, तब वह अपनी ही आत्मा को शाप देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शैतान।” यूनानी में σατανᾶ शब्द है, जो “विरोधी” अर्थ वाले सामी शब्द का लिप्यंतरण है।
    reason: वैकल्पिक पाठ-प्रस्तुति और मूल शब्द की अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: जब ... शाप देता है
  rationale: ἐν के साथ प्रयुक्त सव्यय क्रियार्थक संज्ञा यहाँ समय-सूचक परिस्थिति व्यक्त करती है; आधुनिक हिन्दी में ‘जब ... तब’ इस संबंध को स्वाभाविक और स्पष्ट रूप से रखता है।
- source_word: ἀσεβῆ
  choice: अधर्मी
  rationale: यह रूप क्रियार्थक संज्ञा के कर्ता के रूप में एकवचन सामान्य व्यक्ति को सूचित करता है। ‘अधर्मी’ इसके नैतिक और धार्मिक दोनों आशयों को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν σατανᾶ
  choice: विरोधी[a]
  rationale: σατανᾶς सामी मूल के उस शब्द का लिप्यंतरण है जिसका अर्थ ‘विरोधी’ या ‘अभियोक्ता’ है। ‘विरोधी’ मूल अर्थ को सामने रखता है और इस प्रसंग में बाद के निश्चित व्यक्तिवाचक प्रयोग को अनावश्यक रूप से आरोपित नहीं करता; ‘शैतान’ को पादटिप्पणी में रखा गया है।
- source_word: αὐτὸς
  choice: वह
  rationale: αὐτός पहले कर्ता को फिर ग्रहण करता है और हल्का बल देता है। ‘वह’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है, जबकि ‘अपनी ही’ वाक्य के आत्म-संबंधी बल को स्पष्ट करता है।
- source_word: καταρᾶται
  choice: शाप देता है
  rationale: मूल में एक ही क्रिया दो बार आती है; दोनों स्थानों पर ‘शाप देता है’ रखने से कथन का अलंकारिक समानांतर सुरक्षित रहता है।
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: अपनी ही आत्मा को
  rationale: ψυχή का अर्थ ‘जीवन’, ‘स्वयं’ या ‘आत्मा’ हो सकता है। ‘आत्मा’ इस नीतिवचन का नैतिक-आध्यात्मिक भार बनाए रखता है, और ‘अपनी ही’ ἑαυτοῦ के आत्मवाचक बल को दर्शाता है।
theological_decisions:
- issue: σατανᾶ को उपाधि/सामान्य संज्ञा के रूप में अनूदित किया जाए या व्यक्तिवाचक नाम ‘शैतान’ के रूप में
  choice: विरोधी
  alternative: शैतान
  rationale: यूनानी शब्द सामी ‘विरोधी/अभियोक्ता’ का लिप्यंतरण है। इस ज्ञान-साहित्यिक कथन में उसका सामान्य या उपाधिसूचक अर्थ संभव बना रहता है। इसलिए मुख्य पाठ में अर्थ का अनुवाद किया गया है और पाठकों से परिचित व्यक्तिवाचक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जब ... तब’ से यूनानी की समय-सूचक रचना स्वाभाविक हिन्दी में आती है, और दोनों बार ‘शाप देता है’ रखकर मूल की पुनरुक्ति तथा नीतिवचनात्मक प्रभाव सुरक्षित रखा गया है।
