base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/003.yaml
  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: hi
  text: जो अपने जननांग को पकड़कर पेशाब करता है[a], उसके समान वह है जो अपने साथी के घर अचानक प्रवेश करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह जानबूझकर चौंकानेवाला शारीरिक नीतिवचन है। यहाँ “जननांग” अनूदित शब्द के अन्य अर्थ “बाँह का निचला भाग,” “हाथ भर” या “दासी” हो सकते हैं; लेकिन पेशाब करने के साथ इसके प्रयोग में यौनांग का परोक्ष अर्थ सबसे उपयुक्त जान पड़ता है। इब्रानी पाठ स्त्री का उल्लेख नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ में यहाँ बिल्कुल अलग पंक्ति है: “उसके दाँत सिंह के दाँत हैं, जो मनुष्यों के प्राण नष्ट कर देते हैं।” यह पाठ के एक बहुत भिन्न रूप को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: जो ... पकड़कर
  rationale: אחז का कृदन्त किसी वस्तु को थामने या पकड़ने की ठोस क्रिया बताता है। हिन्दी में संयुक्त रचना “पकड़कर” अगली क्रिया के साथ स्वाभाविक रूप से जुड़ती है।
- source_word: בָּאַמָה
  choice: स्त्री के गुप्तांग
  rationale: אָמָה के सामान्य अर्थ “बाँह/हाथ का निचला भाग” और “हाथ” यहाँ पेशाब करने की अगली क्रिया के साथ सहज नहीं बैठते। प्रसंग में अश्लील शारीरिक अर्थ सबसे उपयुक्त है; “गुप्तांग” बात को स्पष्ट रखता है, पर भद्दी बोलचाल से बचता है। “स्त्री के” अर्थ प्रसंग से ग्रहण किया गया है और इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: וּמַשְׁתִּין מָיִם
  choice: पेशाब करता है
  rationale: इब्रानी मुहावरे का शाब्दिक रूप “पानी का पेशाब करना” है। आधुनिक हिन्दी में “पेशाब करना” स्वाभाविक, स्पष्ट और पर्याप्त रूप से शारीरिक है; “पानी” दोहराना अस्वाभाविक होता।
- source_word: וְהַנִּכְנָס
  choice: उसके समान वह है जो ... घुस जाता है
  rationale: मूल में दोनों कृदन्तीय वाक्यांश וְ से जुड़े हैं और तुलना-सूचक शब्द व्यक्त नहीं है। हिन्दी में नीतिवचन का आशय स्पष्ट करने के लिए तुलना को प्रकट किया गया है। “घुस जाता है” अनचाहे और असभ्य प्रवेश की तीव्रता को “प्रवेश करता है” से अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבֵית חֲבֵרוֹ
  choice: अपने पड़ोसी के घर
  rationale: חבר मित्र, साथी या सामाजिक रूप से निकट दूसरे व्यक्ति को सूचित कर सकता है। “पड़ोसी” इस व्यवहार-संबंधी नीतिवचन में उपयुक्त है और अनावश्यक घनिष्ठता नहीं जोड़ता।
- source_word: פִּתְאוֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण आकस्मिक या अप्रत्याशित ढंग से आने को बताता है। “अचानक” संक्षिप्त है और बिना पूर्व सूचना घुस आने का भाव बनाए रखता है।
- source_word: ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς, ἀναιροῦντες ψυχὰς ἀνθρώπων
  choice: मुख्य पाठ में अनूदित नहीं; केवल पाठांतर की पादटिप्पणी में
  rationale: यूनानी पाठ इब्रानी से विषयवस्तु में बहुत भिन्न है। उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य को मुख्य पाठ बनाया गया है और यूनानी रूप को ईमानदारी से पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: इस पद में इब्रानी और यूनानी पाठों के बीच तीखा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी नीतिवचन का अनुवाद और यूनानी पाठ का पादटिप्पणी में उल्लेख
  alternative: मुख्य पाठ में यूनानी पंक्ति “उसके दाँत सिंह के दाँत हैं...” रखना, या दोनों को मिलाकर सामंजस्यपूर्ण पाठ बनाना
  rationale: यह केवल शब्दों का छोटा अंतर नहीं, बल्कि दो अलग पंक्तियाँ हैं। जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता देना स्रोत-साक्ष्य के अनुरूप है। दोनों को मिलाने से ऐसा पाठ बनता जिसका समर्थन किसी साक्षी से नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण किंतु मूल की जानबूझकर चौंकानेवाली शारीरिक छवि को न छिपाने वाला रूप। तुलना मूल इब्रानी में स्पष्ट चिह्नित नहीं है, पर दो समांतर कृदन्तीय खंडों का नीतिवचनात्मक संबंध स्वाभाविक हिन्दी के लिए “उसके समान” से व्यक्त किया गया है।
