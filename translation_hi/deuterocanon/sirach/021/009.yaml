translation:
  language: hi
  text: व्यवस्था न मानने वालों की सभा सन के इकट्ठे किए हुए रेशों के गट्ठर के समान है, और उनका अन्त आग की ज्वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στιππύον
  choice: सन की छाल के रेशे
  rationale: यह शब्द सन से निकले ज्वलनशील मोटे या बेकार रेशों को दर्शाता है। हिन्दी में केवल तकनीकी शब्द देने के बजाय यह वर्णन मूल वस्तु और उसके शीघ्र जल उठने के भाव को समझने योग्य बनाता है।
- source_word: συνηγμένον
  choice: इकट्ठी की हुई
  rationale: नपुंसकलिंग कर्मवाच्य कृदन्त का सीधा भाव सुरक्षित रखा गया है और इसे रेशों से जोड़ा गया है; मूल यूनानी की संक्षिप्त, समांतर छवि बनी रहती है।
- source_word: συναγωγὴ ἀνόμων
  choice: व्यवस्था न मानने वालों की सभा
  rationale: συναγωγή के सामूहिक अर्थ के लिए ‘सभा’ और ἄνομος के नियम या व्यवस्था की अवहेलना वाले नैतिक अर्थ के लिए ‘व्यवस्था न मानने वाले’ चुना गया है; केवल सामान्य ‘दुष्ट’ कहने से मूल की विशिष्टता घटती।
- source_word: συντέλεια
  choice: अन्त
  rationale: यहाँ शब्द उनके अंतिम परिणाम या नियति को व्यक्त करता है। ‘अन्त’ संक्षिप्त, स्वाभाविक और मूल के अंतिमता-बोध के अनुरूप है।
- source_word: φλὸξ πυρός
  choice: आग की ज्वाला
  rationale: मूल की संज्ञा-रचना और प्रबल दहन-छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἀνόμων को सामान्य नैतिक शब्द से नरम किया जाए
  choice: व्यवस्था न मानने वाले
  alternative: दुष्ट / अधर्मी
  rationale: यूनानी शब्द विशेष रूप से व्यवस्था या नियम की अवहेलना का भाव रखता है। चुना हुआ रूप इस अर्थ को बनाए रखता है, पर किसी विशिष्ट पंथगत धारणा को नहीं जोड़ता।
- issue: आरम्भिक संक्षिप्त यूनानी रचना को रूपक माना जाए या उपमा के रूप में स्पष्ट किया जाए
  choice: ‘के समान है’ के साथ उपमा
  alternative: ‘इकट्ठी की हुई सन की छाल के रेशे—व्यवस्था न मानने वालों की सभा’ जैसी सीधी समानाधिकरण रचना
  rationale: मूल में तुलना अत्यन्त संक्षिप्त है। स्पष्ट उपमा आधुनिक हिन्दी में अर्थ सुगम करती है, जबकि सभा और ज्वलनशील रेशों के बीच मूल संबंध को नहीं बदलती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘सन की छाल के रेशे’ अपरिचित वस्तु को पर्याप्त रूप से खोलता है; पादटिप्पणी मूल यूनानी की संक्षिप्त संरचना और वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
