    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: मरने से पहले
  rationale: इब्रानी कालवाचक वाक्यांश को आधुनिक और सीधी हिन्दी में व्यक्त करता है।
- source_word: הֵיטִב לְאוֹהֵב
  choice: अपने प्रिय का भला कर
  rationale: हिफ़ील आज्ञार्थक का हित करने वाला भाव बनाए रखता है; לְאוֹהֵב को इब्रानी के व्यापक संबंधपरक अर्थ में ‘अपने प्रिय’ कहा गया है, न कि केवल ‘मित्र’।
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: जहाँ तक तेरा हाथ पहुँच सके
  rationale: साधन या सामर्थ्य के अर्थ वाली इब्रानी हस्त-छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है; यूनानी समानांतर भी सामर्थ्य के अर्थ की पुष्टि करता है।
- source_word: תֶּן לוֹ
  choice: उसे दे
  rationale: सरल आज्ञार्थक और स्पष्ट परोक्ष कर्म को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: לְאוֹהֵב / φίλῳ में उपकार पाने वाले व्यक्ति का संबंध
  choice: अपने प्रिय
  alternative: अपने मित्र
  rationale: प्राथमिक इब्रानी पाठ का अर्थ प्रिय या प्रेम-पात्र व्यक्ति के लिए व्यापक है, जबकि यूनानी समानांतर ‘मित्र’ कहता है। मुख्य पाठ इब्रानी की व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा उपदेशात्मक स्वर रखा गया है। एकवचन संबोधन के लिए ‘तेरा’ और आज्ञार्थक ‘कर/दे’ मूल पाठ की प्रत्यक्षता बनाए रखते हैं।
