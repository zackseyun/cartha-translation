  yaml_path: translation/deuterocanon/sirach/014/020.yaml
  text: Blessed is the man who meditates on wisdom[b][a], and who reflects with understanding.
translation:
  language: hi
  text: धन्य है वह मनुष्य[a] जो बुद्धि का मनन करता है[b], और समझ-बूझ पर ध्यान देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘सुखी है वह मनुष्य’ भी हो सकता है। हिब्रू का यह आशीर्वचन-सूत्र केवल मन की प्रसन्नता नहीं, बल्कि समृद्ध और सराहनीय स्थिति भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ में पहले क्रियापद और दूसरे खंड की शब्दावली उल्लेखनीय रूप से भिन्न है: ‘धन्य है वह मनुष्य जो बुद्धि में अपना अंत करेगा, और जो अपनी समझ के साथ विचार-विमर्श करेगा।’'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: हिब्रू आशीर्वचन-सूत्र किसी की सराहनीय और फलती-फूलती दशा घोषित करता है। ‘धन्य है’ ज्ञान-साहित्य की गरिमा और इस घोषणात्मक भाव को बनाए रखता है।
- source_word: אֱנוֹשׁ
  choice: वह मनुष्य
  rationale: यह शब्द एकवचन में मनुष्य को दर्शाता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और हिब्रू के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: בְּחָכְמָה יֶהְגֶּה
  choice: बुद्धि का मनन करता है
  rationale: הגה का अर्थ मन-ही-मन विचार या ध्यान करना है। हिन्दी में ‘का मनन करना’ בְּ को स्वाभाविक ढंग से व्यक्त करता है और चिंतनशील भाव सुरक्षित रखता है।
- source_word: וּבִתְבוּנָה
  choice: और समझ-बूझ पर
  rationale: תבונה विवेकपूर्ण समझ को सूचित करता है। ‘समझ-बूझ’ इसे पहले खंड के ‘बुद्धि’ से संबंधित किंतु अलग शब्द के रूप में रखता है।
- source_word: יִשְׁעֶה
  choice: ध्यान देता है
  rationale: क्रिया में किसी ओर मुड़ने, दृष्टि लगाने या ध्यानपूर्वक विचार करने का भाव हो सकता है। ‘ध्यान देता है’ इस अर्थ-सीमा को अनावश्यक रूप से संकीर्ण किए बिना समानांतर चिंतनशील क्रिया व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-वचन में प्रतिनिधिक एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति
  rationale: हिब्रू אֱנוֹשׁ एकवचन में मानव को प्रस्तुत करता है। ‘मनुष्य’ स्रोत की काव्यात्मक और प्रतिनिधिक शैली को बनाए रखते हुए हिन्दी में सामान्य मानवीय संदर्भ भी व्यक्त करता है।
- issue: आशीर्वचन का भाव
  choice: धन्य है
  alternative: सुखी है
  rationale: ‘धन्य’ केवल भावनात्मक प्रसन्नता नहीं, बल्कि सराहनीय और अनुगृहीत दशा का व्यापक भाव रखता है; फिर भी वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और ज्ञान-साहित्य के अनुकूल रखी गई है। ‘बुद्धि का मनन’ तथा ‘समझ-बूझ पर ध्यान’ दोनों समांतर खंडों को स्वाभाविक हिन्दी में अलग-अलग क्रियात्मक रंग देते हैं।
