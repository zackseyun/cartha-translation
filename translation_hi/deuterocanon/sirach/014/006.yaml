base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/006.yaml
  text: For one who is evil to himself[a], there is none more evil than he; and this is the repayment of his evil.
translation:
  language: hi
  text: जो अपने ही प्रति बुरा है[a], उससे बुरा कोई नहीं; और उसकी बुराई का प्रतिफल उसी को मिलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी: “जो स्वयं को देने से भी कतराता है” या “जो अपने ही प्रति कंजूस है”; अर्थात ऐसी कंजूसी जिसमें मनुष्य स्वयं को भी आवश्यक सुख या भलाई से वंचित रखता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: जो अपने ही प्रति बुरा है
  rationale: इब्रानी पदबंध क्रियारहित है और शाब्दिक अर्थ ‘अपने प्रति/अपने प्राण के प्रति बुरा’ देता है। यह अनुवाद उसकी व्यापक नैतिक भाषा बनाए रखता है; यूनानी पाठ में निहित आत्म-वंचक कंजूसी का अधिक विशिष्ट भाव पादटिप्पणी में दिया गया है।
- source_word: אֵין רַע מִמֶּנּוּ
  choice: उससे बुरा कोई नहीं
  rationale: यह स्वाभाविक हिन्दी में इब्रानी तुलनात्मक कथन को व्यक्त करता और רע की पुनरावृत्ति को ‘बुरा’ शब्द द्वारा बनाए रखता है।
- source_word: תּשְלוּמַת
  choice: प्रतिफल
  rationale: यह शब्द चुकौती या किए हुए का लौटकर मिलने वाला परिणाम दर्शाता है। ‘प्रतिफल’ आधुनिक, गरिमापूर्ण हिन्दी में नैतिक परिणाम का भाव स्पष्ट करता है।
- source_word: רָעָתוֹ
  choice: उसकी बुराई
  rationale: ‘बुराई’ पहले आए רע से शब्दगत संबंध बनाए रखती है और मूल की पुनरावृत्ति को सुरक्षित रखती है।
- source_word: וְעִמּוֹ
  choice: उसी के साथ है
  rationale: यह इब्रानी के ‘और उसके साथ’ को निकटता से व्यक्त करता है तथा परिणाम उसके साथ लगे रहने की संक्षिप्त, किंचित तनावपूर्ण छवि को बिना विस्तार दिए बनाए रखता है।
- source_word: τοῦ βασκαίνοντος ἑαυτόν
  choice: अपने ही प्रति बुरा है
  rationale: यूनानी समानांतर पाठ स्वयं को देने में कुढ़ने या अपने प्रति कंजूस होने का अधिक स्पष्ट भाव देता है। मुख्य पाठ प्राथमिक इब्रानी की व्यापक अभिव्यक्ति पर चलता है और यूनानी अर्थ-संकेत पादटिप्पणी में सुरक्षित है।
