  text: All his works rot away[a], and the work of his hands is dragged along behind him.
translation:
  language: hi
  text: उसके सभी काम सड़-गल जाते हैं[a], और उसके हाथों का काम उसके पीछे खींचा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में है: “हर सड़ने वाला काम नष्ट हो जाता है, और उसे करने वाला उसके साथ चला जाएगा।” इब्रानी में इसके बजाय कहा गया है कि उसके हाथों का काम उसके पीछे खींचा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: उसके सभी काम
  rationale: כָּל की समग्रता और מַעֲשָׂיו के व्यापक अर्थ—किए या बनाए हुए काम—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רָקוֹב יִרְקָבוּ
  choice: सड़कर मिट जाते हैं
  rationale: एक ही मूल से बने शब्दों की इब्रानी पुनरुक्ति क्षय की तीव्रता बताती है। हिन्दी में ‘सड़कर मिट जाते हैं’ इस बल और परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּפֹעַל יָדָיו
  choice: और उसके हाथों का काम
  rationale: פֹעַל को कार्य या उसके उत्पाद के रूप में और יָדָיו की ठोस हस्त-छवि को सीधे सुरक्षित रखता है।
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: उसके पीछे खिंचा चला जाता है
  rationale: נפעל रूप में निहित खींचे जाने की भावना और אַחֲרָיו के ‘उसके पीछे’ अर्थ को बनाए रखते हुए हिन्दी में प्रवाहपूर्ण है।
theological_decisions:
- issue: दूसरे अर्ध-पद में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार काम को उसके पीछे खिंचता हुआ बताया गया है।
  alternative: 'यूनानी: ‘और उसे करने वाला उसके साथ चला जाएगा।’'
  rationale: उपलब्ध इब्रानी पाठ उच्च-विश्वसनीयता वाला और मान्य है, इसलिए उसे प्राथमिकता दी गई है। यूनानी में कर्ता बदलकर काम करने वाला व्यक्ति हो जाता है; इस महत्त्वपूर्ण पाठांतर को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और चित्रात्मक रूप; इब्रानी की क्षय और पीछे खिंचने की छवियों को स्पष्ट रखा गया है।
