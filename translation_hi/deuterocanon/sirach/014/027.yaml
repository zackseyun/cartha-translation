  yaml_path: translation/deuterocanon/sirach/014/027.yaml
  text: He takes refuge in its shade from the heat[a], and he dwells in its shelters.
translation:
  language: hi
  text: वह तपन से बचने के लिए उसकी छाया में शरण लेता है[a], और उसके निवासों में बसेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या यूनानी समानांतर पाठ के अधिक निकट: “वह उसके द्वारा तपन से ढका जाएगा और उसकी महिमा में ठहरेगा।” इब्रानी में “उसके निवासों में” है, जबकि यूनानी में “उसकी महिमा में” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: शरण लेता है
  rationale: חסה का अर्थ सुरक्षा के लिए आश्रय लेना है। इब्रानी कृदन्त यहाँ सामान्य, नीतिपरक वर्तमान भाव देता है।
- source_word: בְּצִלָּהּ
  choice: उसकी छाया में
  rationale: צל का सीधा अर्थ छाया है। स्त्रीलिंग प्रत्यय प्रसंग में व्यक्तिरूप बुद्धि की ओर संकेत करता है, इसलिए हिन्दी में स्वाभाविक ‘उसकी’ रखा गया है।
- source_word: מֵחֹרֶב
  choice: तपन से बचने के लिए
  rationale: חֹרֶב सूखी या झुलसाने वाली गर्मी को सूचित कर सकता है; यूनानी καύματος भी प्रचण्ड ताप की पुष्टि करता है। ‘तपन’ काव्यात्मक और बोधगम्य है।
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: उसके निवासों में
  rationale: מְעוֹנוֹת का मूल अर्थ निवास-स्थान या बसेरे हैं। ‘निवासों’ से इब्रानी का बहुवचन और स्थानवाचक अर्थ सुरक्षित रहता है; इसे केवल ‘आश्रयों’ तक सीमित नहीं किया गया।
- source_word: יִשְׁכֹּן
  choice: बसेगा
  rationale: שכן का अर्थ बसना या निवास करना है। अपूर्ण रूप को भविष्य ‘बसेगा’ से दिखाया गया है, जबकि पहले खण्ड का कृदन्त सामान्य वर्तमान में है।
theological_decisions:
- issue: व्यक्तिरूप बुद्धि के स्त्रीलिंग संकेत
  choice: ‘उसकी छाया’ और ‘उसके निवासों’
  alternative: ‘इसकी छाया’ अथवा लिंग-संकेत से बचने वाली पुनर्रचना
  rationale: इब्रानी के स्त्रीलिंग प्रत्यय प्रसंग की व्यक्तिरूप बुद्धि से जुड़े हैं। हिन्दी में ‘उसकी/उसके’ स्वाभाविक रूप से इस सम्बन्ध को बनाए रखते हैं, बिना कोई अतिरिक्त सिद्धान्त जोड़े।
- issue: सामान्य एकवचन कर्ता
  choice: ‘वह’
  alternative: ‘जो व्यक्ति’
  rationale: इब्रानी में कर्ता एकवचन और सामान्य नीतिवचनात्मक है। ‘वह’ इस शैली को संक्षिप्त और स्वाभाविक रखता है।
- issue: इब्रानी और यूनानी पाठांतर
  choice: मुख्य पाठ में इब्रानी ‘निवासों’ को प्राथमिकता
  alternative: यूनानी के अनुसार ‘उसकी महिमा में ठहरेगा’
  rationale: दिया गया उच्च-विश्वास वाला इब्रानी पाठ प्राथमिक स्रोत है। वास्तविक पाठांतर को पादटिप्पणी में स्पष्ट रखा गया है, मिटाया या मिलाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘तपन’ छाया और झुलसाने वाली गर्मी की काव्यात्मक छवि को बनाए रखता है; ‘निवासों’ इब्रानी शब्द के ठोस बहुवचन अर्थ के अधिक निकट है।
