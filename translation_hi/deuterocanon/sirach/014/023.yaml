base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/023.yaml
  text: One who looks in through her window[a], and at her doorway he will listen.
translation:
  language: hi
  text: जो उसकी खिड़की से भीतर झाँकता है और उसके द्वारों पर ध्यान से सुनता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुपके से सुनता है।” इब्रानी क्रिया ध्यान से, और सम्भवतः छिपकर, सुनने का भाव दे सकती है; यूनानी समानांतर पाठ में “सुनेगा” है।
    reason: शब्दार्थ का विकल्प
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: जो ... भीतर झाँकता है
  rationale: שׁקף के कृदन्त रूप में लगातार या उद्देश्यपूर्ण ढंग से देखने का भाव है। स्थानसूचक בְּעַד חֲלוֹנָה और यूनानी παρακύπτων के साथ ‘भीतर झाँकता है’ आकस्मिक देखने के बजाय खुली जगह से उत्सुकतापूर्वक देखने की छवि व्यक्त करता है।
- source_word: בְּעַד חֲלוֹנָה
  choice: उसकी खिड़की से
  rationale: בְּעַד यहाँ स्थानसूचक अर्थ में ‘के रास्ते/आर-पार’ है। हिन्दी में झाँकने के साथ ‘खिड़की से’ स्वाभाविक है और स्त्रीलिंग संदर्भ को ‘उसकी’ से बनाए रखता है।
- source_word: וְעַל פְּתָחֶיהָ
  choice: और उसके द्वार पर
  rationale: פתח द्वार, प्रवेश या द्वार-मुख को सूचित कर सकता है। मूल इब्रानी का रूप बहुवचन है, पर इस वास्तु-चित्र में हिन्दी का सामूहिक एकवचन ‘द्वार’ स्वाभाविक है; संख्या की यह भिन्नता अनुवाद-संबंधी पादटिप्पणी में दी गई है।
- source_word: יְצוֹתֵת
  choice: ध्यान लगाकर सुनता है
  rationale: यह क्रिया ध्यानपूर्वक, और संभवतः छिपकर, सुनने का बोध देती है। यूनानी ἀκροάσεται सामान्य श्रवण-अर्थ की पुष्टि करता है। ‘ध्यान लगाकर सुनता है’ मूल की तीव्रता रखता है, पर चोरी से सुनने का आशय अनिवार्य नहीं बनाता।
theological_decisions:
- issue: बुद्धि का स्त्री के रूप में मानवीकरण
  choice: स्त्रीलिंग ‘उसकी’ बनाए रखा गया
  alternative: अमूर्त वस्तु मानकर ‘उसके’ या संज्ञा की पुनरावृत्ति
  rationale: निकटवर्ती संदर्भ में बुद्धि को स्त्री और गृहस्वामिनी के रूप में चित्रित किया गया है। स्त्रीलिंग सर्वनाम इब्रानी प्रत्यय और यूनानी αὐτῆς दोनों की छवि को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झाँकता’ वास्तु-रूपक को स्पष्ट करता है; ‘ध्यान लगाकर सुनता’ इब्रानी की तीव्रता को रखता है, जबकि पादटिप्पणी अधिक गोपनीय अर्थ और मूल बहुवचन को दर्ज करती है।
