base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/009.yaml
  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: hi
  text: लोभी[a] की नज़र में उसका हिस्सा कम है, और अपने पड़ोसी का हिस्सा लेकर वह अपना हिस्सा नष्ट कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “... की आँख में उसका हिस्सा थोड़ा है।” यहाँ ‘लोभी’ के लिए प्रयुक्त इब्रानी शब्द इस पांडुलिपि-परंपरा में कठिन है। यूनानी समानांतर में लिखा है, “लोभी की आँख किसी हिस्से से नहीं भरती,” जो इस अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵין
  choice: की नज़र में
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘की आँख में’ है और यह बताता है कि कोई बात किसी व्यक्ति को कैसी लगती है। ‘की नज़र में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए वही भाव रखता है।
- source_word: כּוֹשֵׁל
  choice: लोभी
  rationale: इस पांडुलिपि-परंपरा में इब्रानी रूप कठिन है। यूनानी समानांतर में πλεονέκτου, अर्थात लोभी या लालची व्यक्ति, है; आगे पड़ोसी का भाग लेने की बात भी इसी अर्थ का समर्थन करती है।
- source_word: מְעַט
  choice: बहुत थोड़ा
  rationale: यह केवल भाग के वस्तुतः छोटा होने की बात नहीं, बल्कि लोभी को उसके अपर्याप्त लगने की बात है। यूनानी समानांतर का ‘भाग से नहीं भरती’ वाला कथन इस भाव की पुष्टि करता है।
- source_word: חֶלְקוֹ
  choice: उसका अपना भाग / अपना ही भाग
  rationale: ‘भाग’ नीतिवचन-सदृश शैली के अनुकूल है। ‘अपना’ और ‘ही’ से पहले और अंतिम प्रयोग में व्यक्ति के हिस्से पर बल स्पष्ट होता है, जबकि मूल की पुनरावृत्ति बनी रहती है।
- source_word: וְלוֹקֵחַ
  choice: और ... लेकर
  rationale: कृदंत लोभी के स्वभावगत कार्य को पहली पंक्ति से जोड़ता है। हिन्दी में ‘लेकर’ साधन और परिणाम का संबंध सहज रूप से व्यक्त करता है।
- source_word: חֵלֶק רֵעֵהוּ
  choice: अपने पड़ोसी का भाग
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या सहचर हो सकता है। ‘पड़ोसी’ दूसरे व्यक्ति के अधिकार का उल्लंघन करनेवाले नैतिक पक्ष को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: מְאַבֵּד
  choice: नष्ट कर देता है
  rationale: हिफ़ील रूप सक्रिय और कारक अर्थ देता है—वह अपने भाग को मिटा या बरबाद कर देता है। ‘नष्ट कर देता है’ इस चेतावनी की तीव्रता को बनाए रखता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ को समझने में यूनानी समानांतर का उपयोग
  choice: विषय को ‘लोभी’ मानकर पहली पंक्ति को अतृप्त लालच के कथन के रूप में प्रस्तुत किया गया है।
  alternative: כּוֹשֵׁל को अधिक शाब्दिक रूप से ‘ठोकर खानेवाला’ या ‘असफल व्यक्ति’ माना जा सकता है।
  rationale: इब्रानी रूप संदर्भ में असामान्य और पाठ-परंपरा में कठिन है। यूनानी पाठ स्पष्ट रूप से ‘लोभी की आँख’ कहता है, और इब्रानी की दूसरी पंक्ति में पड़ोसी का भाग लेने का उल्लेख भी लोभ के अर्थ से मेल खाता है। फिर भी इस पाठगत कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘की नज़र में’ इब्रानी के नेत्र-संबंधी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; ‘भाग’ की पुनरावृत्ति मूल के नीतिवचनात्मक प्रभाव को बनाए रखती है।
