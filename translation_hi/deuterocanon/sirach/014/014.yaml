  text: Do not deprive yourself of a good day, and do not let your share in a good desire pass you by.
translation:
  language: hi
  text: अच्छे दिन के सुख से अपने आपको वंचित मत रखो, और किसी अच्छी अभिलाषा में अपना हिस्सा हाथ से मत जाने दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी साक्ष्य में एक कोष्ठकबद्ध वाक्यांश भी है: “और अपने आपको भलाई से वंचित मत रखो।” प्रस्तुत स्रोत में इसका पाठ अनिश्चित है और यह बाद में जोड़ा गया हो सकता है। इसके स्थान पर यूनानी समानांतर का भाव है: “और किसी अच्छी अभिलाषा में अपना हिस्सा हाथ से मत जाने दो।”'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע / μὴ ἀφυστερήσῃς
  choice: अपने आपको वंचित मत रखो
  rationale: इब्रानी में किसी भलाई को रोक रखने और यूनानी में उससे वंचित करने का भाव है। यह प्रयोग दोनों साक्ष्यों के आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִטּוֹבַת יוֹם / ἀπὸ ἀγαθῆς ἡμέρας
  choice: अच्छे दिन के सुख से
  rationale: इब्रानी का शाब्दिक भाव ‘दिन की भलाई’ और यूनानी का ‘अच्छा दिन’ है। ‘अच्छे दिन के सुख’ वर्तमान अवसर की भलाई का आनंद लेने का भाव रखता है, पर इसे केवल भोग-विलास तक सीमित नहीं करता।
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: मुख्य पाठ में नहीं रखा गया
  rationale: प्रस्तुत इब्रानी स्रोत में यह वाक्यांश कोष्ठकों में है, इसकी पाठगत स्थिति अनिश्चित है और यह पहले उपवाक्य की पुनरुक्ति भी हो सकता है। इसकी जानकारी पादटिप्पणी में दी गई है।
- source_word: μερὶς
  choice: अपना हिस्सा
  rationale: यूनानी शब्द किसी को मिलने वाले भाग या हिस्से को सूचित करता है। ‘अपना हिस्सा’ सहज हिन्दी में इस व्यक्तिगत सहभागिता को स्पष्ट करता है।
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: किसी अच्छी अभिलाषा में
  rationale: यह अनुवाद सकारात्मक इच्छा या लालसा के मूल अर्थ को बनाए रखता है और इसे मनमाने ढंग से सुख, धन या भूख के अर्थ में सीमित नहीं करता।
- source_word: μὴ σε παρελθάτω
  choice: हाथ से मत जाने दो
  rationale: यूनानी मुहावरे में किसी अवसर या भाग के पास से निकल जाने का भाव है। हिन्दी का यह मुहावरा उसी अवसर को न चूकने की चेतावनी स्वाभाविक रूप में देता है।
theological_decisions:
- issue: जहाँ इब्रानी पाठ अनिश्चित है वहाँ यूनानी समानांतर का उपयोग
  choice: पहला उपवाक्य सुरक्षित इब्रानी के अनुसार और दूसरा यूनानी समानांतर के अनुसार अनूदित किया गया है
  alternative: कोष्ठकबद्ध इब्रानी वाक्यांश को मुख्य पाठ में शामिल करना
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है, पर प्रस्तुत स्रोत में कोष्ठकबद्ध वाक्यांश अनिश्चित है। यूनानी पाठ सुसंगत दूसरा उपवाक्य देता है; पादटिप्पणी पाठगत अनिश्चितता को पारदर्शी रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामान्य पाठक के लिए सहज, गरिमापूर्ण उपदेशात्मक शैली अपनाई गई है। ‘अच्छी अभिलाषा’ मूल की सकारात्मक किंतु कुछ खुली अर्थ-सीमा को बनाए रखती है।
