translation:
  language: hi
  text: क्या तुम अपना धन किसी दूसरे के लिए और अपनी मेहनत की कमाई चिट्ठी से हिस्सा पानेवालों के लिए नहीं छोड़ जाओगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चिट्ठी/भाग को जाननेवालों के लिए।” यह इब्रानी पदबंध मुहावरेदार है; इसका अर्थ “बँटवारे में हिस्सा पानेवालों” या “चिट्ठी के अनुसार आवंटित हिस्सा पानेवालों” भी हो सकता है। यूनानी समानांतर चिट्ठी द्वारा होनेवाले बँटवारे अथवा आवंटित हिस्से की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में यह रचना उसकी चेतावनी और आग्रह को बनाए रखती है।
- source_word: לְאַחֵר
  choice: किसी दूसरे के लिए
  rationale: इब्रानी में लाभ पानेवाला कोई अन्य व्यक्ति है; यह सहज हिन्दी है और अनावश्यक रूप से कानूनी उत्तराधिकार निर्दिष्ट नहीं करती।
- source_word: תַּעֲזוֹב
  choice: छोड़ जाओगे
  rationale: क्रिया का आशय अपने पीछे छोड़ना है। ‘वसीयत करोगे’ कानूनी अर्थ को आवश्यकता से अधिक स्पष्ट कर देता, जबकि ‘त्याग दोगे’ अनुचित नकारात्मक भाव लाता।
- source_word: חֵילֶךָ
  choice: अपना धन
  rationale: ज्ञान-साहित्य के इस प्रसंग में חַיִל भौतिक साधन या संपत्ति को सूचित करता है; ‘धन’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וִיגִיעֲךָ
  choice: अपनी मेहनत की कमाई
  rationale: यह संज्ञा परिश्रम और उससे प्राप्त वस्तु, दोनों की ओर संकेत कर सकती है। यहाँ जिसे दूसरों के लिए छोड़ा जाता है, उसके लिए ‘मेहनत की कमाई’ स्वाभाविक है और व्यक्तिगत श्रम से संबंध बनाए रखती है।
- source_word: לְיוֹדֵי גוֹרָל
  choice: चिट्ठी डालकर हिस्सा बाँटनेवालों के लिए
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘भाग/चिट्ठी जाननेवालों’ जैसा है और मुहावरेदार है। यूनानी समानांतर κλήρου के बँटवारे की पुष्टि करता है; चुना हुआ अनुवाद चिट्ठी और हिस्से, दोनों बिंबों को सुरक्षित रखता है।
