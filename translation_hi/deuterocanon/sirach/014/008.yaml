  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: hi
  text: दुष्ट है वह मनुष्य जिसकी आँख ईर्ष्या से भरी है[a]; वह अपना मुँह फेर लेता है और लोगों को तुच्छ समझता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी आँख बुरी है।” यूनानी मुहावरा ईर्ष्यालु, कुढ़नेवाली या दूसरे का भला न चाहनेवाली मनोवृत्ति का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “प्राणों”; इसका अनुवाद “आत्माओं” या “व्यक्तियों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: दुष्ट
  rationale: यह विधेय विशेषण उस मनुष्य के नैतिक चरित्र को बताता है; ‘दुष्ट’ साधारण ‘बुरा’ की अपेक्षा यूनानी शब्द की नैतिक गंभीरता को अधिक स्पष्ट रखता है।
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: वह मनुष्य जिसकी आँख ईर्ष्या से भरी है
  rationale: यह स्वाभाविक हिन्दी में आँख की मूल छवि और ईर्ष्यालु अथवा कुढ़नेवाली मनोवृत्ति—दोनों को बनाए रखता है। ‘बुरी आँख’ वाला पारंपरिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀποστρέφων πρόσωπον
  choice: अपना मुँह फेर लेता है
  rationale: यह सहायता या संबंध से इनकार की ठोस शारीरिक छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὑπερορῶν
  choice: तुच्छ समझता है
  rationale: क्रिया में उपेक्षा और अवमानना दोनों का भाव हो सकता है। ‘तुच्छ समझता है’ इस प्रसंग में उसके नैतिक तिरस्कार को स्पष्ट करता है।
- source_word: ψυχάς
  choice: लोगों
  rationale: यहाँ बहुवचन ψυχάς संभवतः अमूर्त या देह से अलग आत्माओं के बजाय जीवित व्यक्तियों को सूचित करता है; ‘लोगों’ से अनावश्यक तकनीकी धर्मवैज्ञानिक अर्थ नहीं जुड़ता।
theological_decisions:
- issue: βασκαίνων ὀφθαλμῷ मुहावरे का अर्थ
  choice: जिसकी आँख ईर्ष्या से भरी है
  alternative: जिसकी आँख बुरी है
  rationale: सिराख के इस नैतिक प्रसंग में मुहावरा ईर्ष्या, कृपणता और दूसरे का भला न चाहने की वृत्ति व्यक्त करता है। फिर भी ‘बुरी आँख’ की सांस्कृतिक और पारंपरिक अनुगूँज वास्तविक है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ψυχάς का मानवीय संदर्भ
  choice: लोगों
  alternative: प्राणों या आत्माओं
  rationale: यूनानी शब्द यहाँ व्यक्तियों अथवा जीवित जनों का संकेत दे सकता है। मुख्य पाठ में ‘लोगों’ रखने से बाद की किसी विशिष्ट आत्मा-संबंधी धारणा को मूल पाठ पर आरोपित नहीं किया जाता, जबकि शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जिसकी आँख ईर्ष्या से भरी है’ सामान्य पाठक के लिए बोधगम्य है और मूल की नेत्र-छवि को भी बचाता है। ‘अपना मुँह फेर लेता है’ तथा ‘तुच्छ समझता है’ समानांतर कृदन्तों को स्वाभाविक हिन्दी क्रियाओं में व्यक्त करते हैं।
