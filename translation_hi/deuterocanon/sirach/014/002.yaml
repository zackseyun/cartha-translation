  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: hi
  text: धन्य है वह मनुष्य जिसे उसकी आत्मा ने दोषी नहीं ठहराया[a], और जिसकी आशा समाप्त नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले खंड का उपलब्ध इब्रानी पाठ कठिन है। यूनानी समानांतर का अर्थ है, “जिसे उसकी आत्मा ने दोषी नहीं ठहराया।” इसके संभावित भाव “जिसे उसकी आत्मा ने धिक्कारा नहीं” या “जिसे उसकी आत्मा ने लज्जित नहीं किया” भी हो सकते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह ज्ञान-साहित्य की आशीर्वचनात्मक शैली को बनाए रखता है और केवल मनोभाव बताने वाले ‘सुखी है’ से अधिक उपयुक्त है।
- source_word: אִישׁ
  choice: वह मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है; ‘मनुष्य’ स्रोत-रूप को रखते हुए आधुनिक हिन्दी में स्वाभाविक और प्रतिनिधिक है।
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: जिसे उसके प्राण ने दोषी नहीं ठहराया
  rationale: उपलब्ध इब्रानी पाठ कठिन है। ‘प्राण’ נַפְשׁוֹ को प्रत्यक्ष रूप से व्यक्त करता है, जबकि ‘दोषी नहीं ठहराया’ यूनानी κατέγνω से स्पष्ट होने वाले न्यायात्मक अर्थ को सुरक्षित रखता है।
- source_word: וְלֹא שָׁבְתָה
  choice: समाप्त नहीं हुई
  rationale: שבת के ‘रुक जाना/समाप्त हो जाना’ अर्थ को वर्तमान हिन्दी में सहज ढंग से व्यक्त करता है।
- source_word: תּוֹחַלְתּוֹ
  choice: आशा
  rationale: यहाँ संज्ञा आशा या अपेक्षा का बोध देती है; ‘आशा’ हिन्दी में स्वाभाविक है और यूनानी ἐλπίς से भी मेल खाती है।
theological_decisions:
- issue: कठिन इब्रानी प्रथम खंड और यूनानी समानांतर के बीच पाठगत निर्णय
  choice: ‘जिसे उसके प्राण ने दोषी नहीं ठहराया’—इब्रानी को आधार रखते हुए क्रिया का अर्थ यूनानी समानांतर से स्पष्ट किया गया।
  alternative: ‘जिसे उसके प्राण ने धिक्कारा नहीं’ अथवा ‘जिसे उसके मन ने लज्जित नहीं किया।’
  rationale: इब्रानी साक्ष्य विद्यमान होने के कारण वही प्राथमिक है, पर उसका क्रियारूप कठिन है। यूनानी κατέγνω एक सुसंगत न्यायात्मक अर्थ देता है; पादटिप्पणी अन्य संभावित भावों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण ज्ञान-साहित्य शैली अपनाई गई है। ‘प्राण’ स्रोत के נֶפֶשׁ को बनाए रखता है; उसे व्याख्यात्मक रूप से ‘विवेक’ या ‘अंतरात्मा’ नहीं बनाया गया।
