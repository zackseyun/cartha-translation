base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: hi
  text: 'हरे-भरे पेड़ पर फूटते पत्तों के समान—एक मुरझाता है और दूसरा अंकुरित होता है—वैसी ही हाड़-माँस की पीढ़ियाँ हैं: एक मरती है और दूसरी जन्म लेती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी גּוֹמֵל का अर्थ यहाँ “दूसरी परिपक्व होती है” या ऐसा ही कुछ भी हो सकता है; पर यूनानी पाठ में “दूसरी जन्म लेती है” है, जो एक के बाद दूसरी पीढ़ी आने की तुलना से मेल खाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: फूटते पत्तों के समान
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अस्पष्ट है; यूनानी φύλλον θάλλον पत्तों के फूटने या लहलहाने की छवि की पुष्टि करता है। यह हिंदी में स्वाभाविक रूप से वनस्पति-वृद्धि का बिंब बनाए रखता है।
- source_word: עֵץ רַעֲנָן
  choice: हरे-भरे पेड़
  rationale: רַעֲנָן ताजगी, हरियाली और भरपूर वृद्धि का बोध देता है; यूनानी δασέος घने पत्तों वाले पेड़ की ओर संकेत करता है।
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: एक मुरझाता है और दूसरा अंकुरित होता है
  rationale: נוֹבֵל का अर्थ मुरझाना और צוֹמֵחַ का अर्थ उगना या अंकुरित होना है। यह शब्दावली पौधे के मूल रूपक को स्पष्ट रखती है।
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: वैसी ही हाड़-माँस की पीढ़ियाँ हैं
  rationale: כֵּן तुलना को आगे बढ़ाता है और דּוֹרוֹת पीढ़ियों के क्रम को व्यक्त करता है। बָּשָׂר וָדָם मनुष्य की नश्वरता का सामी मुहावरा है; 'हाड़-माँस' आधुनिक हिंदी का निकट और सहज मानव-संबंधी मुहावरा है।
- source_word: אֶחַד גֹּוֵעַ
  choice: एक मरती है
  rationale: גֹּוֵעַ प्राण छोड़ने या मरने को दर्शाता है। हिंदी में 'पीढ़ियाँ' के साथ स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: וְאֶחַד גּוֹמֵל
  choice: दूसरी जन्म लेती है
  rationale: इब्रानी גּוֹמֵל के अर्थ में परिपक्व होना या बढ़ना संभव है, किंतु यूनानी γεννᾶται स्पष्ट रूप से जन्म लेने का पाठ देता है और पीढ़ियों के क्रम से अच्छी तरह मेल खाता है।
theological_decisions:
- issue: בשר ודם का मानवशास्त्रीय मुहावरा
  choice: '''हाड़-माँस'' के रूप में मूर्त मुहावरा बनाए रखा'
  alternative: '''मनुष्यजाति'' या ''मनुष्यों की पीढ़ियाँ'''
  rationale: अमूर्त सामान्यीकरण के बजाय मूल की देहधारी और नश्वर मानवीय छवि को बनाए रखा गया है।
- issue: וְאֶחַד גּוֹמֵל की पाठगत अस्पष्टता
  choice: मुख्य पाठ में 'दूसरी जन्म लेती है', साथ में पादटिप्पणी
  alternative: '''दूसरी परिपक्व होती है'' या ''दूसरी बढ़ती है'''
  rationale: यूनानी साक्षी जन्म का स्पष्ट समर्थन करती है, पर इब्रानी की वास्तविक अर्थ-संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पेड़ और पत्तों का समानांतर बिंब स्पष्ट रखा गया है; पीढ़ियों के लिए हिंदी व्याकरणानुसार स्त्रीलिंग क्रियाएँ प्रयुक्त हुई हैं।
