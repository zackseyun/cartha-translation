base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/025.yaml
  text: He pitches his tent beside her[b][a], and he lodges in a good dwelling-place.
translation:
  language: hi
  text: वह अपना तंबू उसके पास[a] तानता है और एक अच्छे बसेरे में रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके हाथ के पास/पर”; यह निकटता बताने वाला प्रयोग है। यूनानी पाठ में भी “उसके हाथों के पास” जैसा वाक्यांश है।
    reason: lexical_alternative
  - marker: b
    text: या, “और एक सुखद निवास में बसता है।” हिब्रानी वाक्यांश बहुत संक्षिप्त है; यूनानी समानांतर अच्छे ठहरने के स्थान का भाव देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹטֶה אָהֳלוֹ
  choice: अपना तंबू … तानता है
  rationale: נטה का अर्थ मूलतः फैलाना या तानना है; אהל के साथ यह तंबू लगाने या तानने का स्वाभाविक मुहावरा है। ठोस तंबू-चित्र को बनाए रखा गया है।
- source_word: עַל יָדָהּ
  choice: उसके पास
  rationale: शाब्दिक रूप से ‘उसके हाथ के पास/पर’ है, पर यहाँ यह निकटता बताने वाला हिब्रानी प्रयोग है। आधुनिक हिन्दी में ‘उसके पास’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; शाब्दिक चित्र पादटिप्पणी में रखा गया है।
- source_word: וְשָׁכַן
  choice: रहता है
  rationale: שכן का सामान्य अर्थ रहना या बसना है। तंबू और बसेरे के संदर्भ में ‘रहता है’ स्वाभाविक है और स्थायी निवास का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: שֹׁכֶן טוֹב
  choice: एक अच्छे बसेरे में
  rationale: हिब्रानी पदबंध संक्षिप्त और कुछ असामान्य है, जिसका आशय ‘अच्छा निवास/बसेरा’ जान पड़ता है। यूनानी समानांतर भी अच्छे ठहरने के स्थान की ओर संकेत करता है। ‘बसेरा’ तंबू और ठहरने की छवि बनाए रखता है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: स्त्रीलिंग संकेत को ‘उसके’ में बनाए रखा गया है, जिसका संदर्भ प्रसंग में स्त्री-रूप में चित्रित बुद्धि है।
  alternative: बुद्धि को निर्जीव मानकर ऐसा रूप देना जिससे स्त्रीलिंग मानवीकरण लुप्त हो जाए।
  rationale: हिब्रानी प्रत्यय स्त्रीलिंग है और आसपास का प्रसंग बुद्धि को स्त्री के रूप में प्रस्तुत करता है; इस साहित्यिक और धर्मवैचारिक तनाव को समतल नहीं किया गया।
- issue: निवास-रूपक को कितना सहज बनाया जाए
  choice: तंबू और बसेरे की ठोस छवियाँ बनाए रखी गई हैं।
  alternative: ‘वह बुद्धि के निकट रहता और सुख पाता है’ जैसा अमूर्त भावानुवाद।
  rationale: मूल पाठ निकटता को तंबू तानने और रहने की दृश्य भाषा में व्यक्त करता है; रूपक को हटाना मूल की अभिव्यक्ति को अनावश्यक रूप से समझा देना होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तंबू तानता है’ और ‘बसेरे में रहता है’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि मूल की ठोस निवास-छवि और उसकी संक्षिप्त अस्पष्टता पादटिप्पणियों सहित सुरक्षित रहती है।
