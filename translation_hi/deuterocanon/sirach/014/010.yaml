- source_word: תָּעִיט / φθονερὸς
  choice: कृपण होता है
  rationale: इब्रानी रूप कठिन है, पर प्रसंग और यूनानी समानांतर भोजन के विषय में अनुदार या कंजूस होने का भाव देते हैं।
- source_word: לָחֶם / ἄρτος
  choice: रोटी
  rationale: इब्रानी और यूनानी दोनों में ठोस शब्द ‘रोटी’ है; यह सामान्य भोजन का भी प्रतिनिधित्व कर सकता है, पर मूल बिंब बनाए रखना उचित है।
- source_word: מְהוּמָה / ἐνλεπής
  choice: कंजूसी छाई रहती है
  rationale: इब्रानी पाठ कठिन और अर्थ की दृष्टि से कुछ अनिश्चित है। यूनानी समानांतर मेज़ पर कमी, तंगी या कृपणता का समर्थन करता है; हिन्दी वाक्यांश उस नैतिक और सामाजिक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֻׁלְחָנוֹ / τράπεζα αὐτοῦ
  choice: उसकी मेज़
  rationale: मूल की उस छवि को सीधे बनाए रखता है जिसमें मेज़ प्रबंध और अतिथि-सत्कार का स्थान है।
