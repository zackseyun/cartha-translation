    reason: lexical_alternative
  - marker: b
    text: इस खंड का इब्रानी पाठ और अर्थ कुछ कठिन है। यूनानी समानांतर उसकी मेज़ पर “कंजूसी,” “तंगी” या “कमी” के भाव का समर्थन करता है।
    reason: alternative_reading
