  text: He sets his nest in her foliage[a], and lodges among her branches.
translation:
  language: hi
  text: वह उसकी पत्तियों में अपना घोंसला बसाता है[a], और उसकी डालियों में रात बिताता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “वह अपनी संतानों को उसके आश्रय में रखेगा, और उसकी डालियों के नीचे रात बिताएगा।” इब्रानी पाठ में “अपना घोंसला” और “उसकी पत्तियों में” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים קִנּוֹ
  choice: अपना घोंसला बनाता है
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ और קֵן का अर्थ ‘घोंसला’ है। हिंदी में घोंसले के साथ ‘बनाता है’ स्वाभाविक है और उसे वहाँ स्थापित करने की ठोस छवि बनाए रखता है।
- source_word: בְעָפְיָהּ
  choice: उसके पत्तों के बीच
  rationale: यह शब्द वृक्ष की पत्तियों या पर्णसमूह को दर्शाता है। ‘पत्तों के बीच’ साधारण आधुनिक हिंदी में सहज है और स्त्रीलिंग प्रत्यय को ‘उसके’ द्वारा बनाए रखता है।
- source_word: וּבַעֲנָפֶיהָ
  choice: उसकी डालियों में
  rationale: עָנָף का अर्थ डाली/शाखा है। यहाँ בְּ को ‘में’ कहना वृक्ष के भीतर आश्रय लेने की इब्रानी छवि को सुरक्षित रखता है; यूनानी पाठ का ‘नीचे’ मुख्य पाठ में नहीं अपनाया गया।
- source_word: יִתְלוֹנָן
  choice: रात बिताता है
  rationale: यह क्रिया रात ठहरने या बसेरा करने का बोध देती है। ‘रात बिताता है’ अर्थ को ‘रहता है’ की अपेक्षा अधिक सटीक और सामान्य हिंदी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी बेन सीरा और यूनानी समानांतर पाठ के भिन्न रूप
  choice: मुख्य पाठ में इब्रानी के ‘अपना घोंसला’, ‘उसके पत्तों के बीच’ और ‘उसकी डालियों में’ का अनुसरण किया गया है।
  alternative: 'यूनानी समानांतर: ‘वह अपनी संतानों को उसकी छाया में रखेगा, और उसकी डालियों के नीचे रात बिताएगा।’'
  rationale: इस पद का उपलब्ध इब्रानी पाठ स्पष्ट, सुसंगत और वृक्ष-संबंधी रूपक के अनुकूल है, इसलिए वही मुख्य आधार है। यूनानी की सार्थक भिन्नता को पाठ में मिलाकर तनाव मिटाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और चित्रात्मक रूप अपनाया गया है। ज्ञान के स्त्रीलिंग वृक्ष-रूपक के संदर्भ में ‘उसके/उसकी’ रखा गया है; हिंदी में ये रूप स्वामित्व वाली वस्तु के लिंग-वचन से मेल खाते हैं।
