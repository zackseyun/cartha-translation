base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: hi
  text: जब तक तुम्हारे पास सामर्थ्य है, अपने को तरोताज़ा कर लो; याद रखो कि अधोलोक में कोई आनंद नहीं। मृत्यु देर नहीं करती, और अधोलोक का विधान तुम्हें बताया नहीं गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “याद रखो कि मृत्यु देर नहीं करेगी, और हेडीस की वाचा तुम्हें दिखाई नहीं गई।” इब्रानी में है: “अधोलोक का विधान तुम्हें बताया नहीं गया है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ
  choice: जब तक तुम्हारे पास सामर्थ्य है
  rationale: यह कठिन इब्रानी पदबंध शाब्दिक रूप से ‘तुम्हारे हाथ की सामर्थ्य के अनुसार’ जैसा है। संदर्भ में यह वर्तमान क्षमता या साधन रहते हुए कार्य करने की बात कहता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उसी आशय को व्यक्त करता है।
- source_word: הִדָּשֵׁן
  choice: अपने को तरोताज़ा कर लो
  rationale: דשן समृद्ध, पुष्ट या सुखपूर्वक तृप्त किए जाने का भाव दे सकता है। मृत्यु की याद दिलाने वाले इस ज्ञान-साहित्यिक संदर्भ में ‘तरोताज़ा कर लो’ जीवन में उपलब्ध सुख और तृप्ति ग्रहण करने का भाव सहज रूप से देता है, बिना शाब्दिक ‘मोटा करने’ के अस्वाभाविक अर्थ के।
- source_word: זְכוֹר
  choice: याद रखो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप, जो ज्ञानोपदेश की शैली के अनुकूल है।
- source_word: בִשְׁאוֹל
  choice: अधोलोक में
  rationale: שְׁאוֹל मृतकों के लोक को सूचित करता है। ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए बोधगम्य है और इसे केवल ‘कब्र’ या बाद की ‘नरक’ संबंधी धारणाओं तक सीमित नहीं करता।
- source_word: תַּעֲנוּג
  choice: आनंद
  rationale: संज्ञा का अर्थ सुख, मनोविनोद या आनंद है; यहाँ जीवन के आनंद और मृत्यु के लोक के बीच विरोध के लिए ‘आनंद’ स्वाभाविक है।
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: मृत्यु देर नहीं करती
  rationale: क्रिया का अर्थ विलंब करना या ठहरना है। यह रूप इब्रानी के सामान्य, सार्वकालिक कथन को संक्षिप्त और स्पष्ट हिन्दी में रखता है; यूनानी समानांतर भी इसी अर्थ का समर्थन करता है।
- source_word: וְחֹק לִשְׁאוֹל
  choice: अधोलोक का विधान
  rationale: חֹק किसी ठहराए हुए नियम, विधि या विधान को दर्शाता है। לִשְׁאוֹל संबंधसूचक अर्थ में अधोलोक से जुड़ा विधान हो सकता है; ‘अधोलोक का विधान’ मूल की संक्षिप्तता और संभावित अर्थ-तनाव को बनाए रखता है।
- source_word: לֹא הֻגַּד לָךְ
  choice: तुम्हें बताया नहीं गया है
  rationale: נגד के कर्मवाच्य रूप का सीधा अर्थ ‘बताया/ज्ञात कराया जाना’ है। चुना हुआ रूप स्पष्ट, स्वाभाविक और मूल के निष्क्रिय वाक्य-विन्यास के निकट है।
theological_decisions:
- issue: שְׁאוֹל / ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतलोक; हेडीस; नरक
  rationale: यहाँ प्राचीन इब्रानी ज्ञान-साहित्य में मृतकों के लोक का उल्लेख है। ‘अधोलोक’ उस अवधारणा को बोधगम्य हिन्दी में रखता है और बाद की विशिष्ट ‘नरक’ संबंधी धर्मवैज्ञानिक धारणा आरोपित नहीं करता।
- issue: חֹק לִשְׁאוֹל की संबंधगत अस्पष्टता
  choice: अधोलोक का विधान
  alternative: अधोलोक के लिए विधान; अधोलोक की वाचा
  rationale: इब्रानी חֹק ‘विधान/ठहराया नियम’ कहता है, जबकि यूनानी में ‘हेडीस की वाचा’ है। मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता दी गई है और यूनानी भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण ज्ञानोपदेशात्मक शैली में रखी गई है। ‘तरोताज़ा कर लो’ बोलचाल में समझ आने वाला है, पर संदर्भ की गंभीरता को भंग नहीं करता। ‘अधोलोक’ को दोनों स्थानों पर समान रखा गया है ताकि प्राचीन मृतलोक की धारणा स्पष्ट रहे और ‘नरक’ जैसी बाद की विशिष्टता न जोड़ी जाए।
