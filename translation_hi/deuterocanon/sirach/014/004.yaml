translation:
  language: hi
  text: 'जो अपने आप को वंचित रखता है, वह दूसरे के लिए बटोरता है,

    और कोई पराया[a] उसकी संपत्ति का सुख भोगेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “पराया” एकवचन है; यूनानी समानांतर पाठ में “दूसरे लोग” बहुवचन है।
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: अपने आप को वंचित रखता है
  rationale: מנע का अर्थ रोकना या वंचित रखना है, और לְנַפְשׁוֹ यहाँ स्ववाचक अर्थ देता है। यह अनुवाद आत्मा शब्द का अनावश्यक शाब्दिक प्रयोग किए बिना अपने लिए उपलब्ध वस्तुओं से स्वयं को वंचित रखने का भाव व्यक्त करता है।
- source_word: יִקְבֹּץ לְאַחֵר
  choice: दूसरे के लिए बटोरता है
  rationale: קבץ का मूल अर्थ इकट्ठा करना या बटोरना है। हिन्दी में यह उस विडंबना को सहज रूप से दिखाता है कि संचय का लाभ अंततः किसी और को मिलेगा।
- source_word: וּבְטוֹבָתוֹ
  choice: उसकी संपत्ति पर
  rationale: טובה यहाँ ठोस अर्थ में उसकी अच्छी वस्तुओं या धन-संपत्ति को सूचित करता है; यूनानी बहुवचन ἀγαθοῖς भी इस अर्थ का समर्थन करता है। 'संपत्ति पर' हिन्दी में मौज करने के साथ स्वाभाविक बैठता है।
- source_word: יִתְבַּעְבֵּעַ
  choice: मौज करेगा
  rationale: यह दुर्लभ रूप भरपूर और भोगपूर्ण आनंद लेने का भाव देता है। यूनानी τρυφήσουσιν भी विलास या सुखभोग का संकेत करता है; 'मौज करेगा' वर्तमान हिन्दी में स्पष्ट और प्रभावी है।
- source_word: זָר
  choice: कोई पराया
  rationale: इब्रानी शब्द एकवचन है और ऐसे व्यक्ति को दर्शाता है जो संचय करने वाले का अपना नहीं है। 'कोई पराया' उस एकवचन और संबंधगत दूरी, दोनों को बनाए रखता है।
