translation:
  language: hi
  text: जो उसके मार्गों पर अपना मन लगाता है और उसकी अंतर्दृष्टियों पर विचार करता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “और वह उसकी गुप्त बातों में समझ प्राप्त करेगा,” या “उसके रहस्यों में।” इब्रानी में “उसकी अंतर्दृष्टियाँ/समझ” है, जिसका अनुसरण मुख्य पाठ में किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  choice: जो … लगाता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदन्त का अर्थ ‘वह जो रखता/लगाता है’ है। हिन्दी में ‘जो … लगाता है’ स्वाभाविक ढंग से इसी एकवचन कर्ता को व्यक्त करता है।
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: उसके मार्गों पर अपना मन
  rationale: शाब्दिक अर्थ ‘उसके मार्गों पर अपना हृदय’ है। आधुनिक हिन्दी में ‘मन लगाना’ विचार, इच्छा और समर्पित ध्यान—इन सबको स्वाभाविक रूप से व्यक्त करता है; ‘मार्गों’ से मूल का बहुवचन बना रहता है।
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: और उसकी सूझ-बूझ पर
  rationale: תבונותיה का अर्थ उसकी समझ, विवेक या अंतर्दृष्टियाँ है। ‘सूझ-बूझ’ सहज आधुनिक हिन्दी में बौद्धिक और व्यावहारिक समझ दोनों व्यक्त करती है। यूनानी समानांतर का ‘गुप्त बातें/रहस्य’ मुख्य पाठ में न लेकर पादटिप्पणी में रखा गया है।
- source_word: יִתְבּוֹנָן
  choice: मनन करता है
  rationale: हित्पोलेल रूप ध्यानपूर्वक विचारने और समझने का भाव देता है। ‘मनन करता है’ इस चिंतनशील अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: ‘उसके/उसकी’ के द्वारा उसी व्यक्तिक संदर्भ को बनाए रखा गया
  alternative: बुद्धि को निर्जीव भाव मानकर केवल ‘इसकी’ कहना
  rationale: इब्रानी और यूनानी दोनों में बुद्धि स्त्रीलिंग व्यक्तित्व के रूप में प्रस्तुत है। हिन्दी के संबंधवाचक सर्वनाम में लिंग स्वामी से नहीं, अगली संज्ञा से प्रकट होता है, इसलिए ‘उसके मार्गों’ और ‘उसकी सूझ-बूझ’ स्वाभाविक रहते हुए संदर्भ को नहीं मिटाते।
- issue: कर्ता का पुल्लिंग एकवचन रूप
  choice: जो … लगाता है … करता है
  alternative: जो कोई … लगाता/लगाती है
  rationale: इब्रानी में कर्ता पुल्लिंग एकवचन कृदन्त है। हिन्दी क्रियाओं के पुल्लिंग एकवचन रूप से स्रोत का व्याकरणिक रूप स्पष्ट रखा गया है, बिना अतिरिक्त सार्वभौमिक भाषा जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन लगाता है’ और ‘मनन करता है’ में हल्की पुनरुक्ति स्वीकार की गई है, क्योंकि पहला वाक्यांश समर्पित ध्यान और दूसरा चिंतनशील विचार व्यक्त करता है।
