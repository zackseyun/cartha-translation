base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/022.yaml
  text: Go out after her in search[a], and lurk at all her entrances.
translation:
  language: hi
  text: उसकी खोज में उसके पीछे निकल, और उसके हर प्रवेश-द्वार पर घात लगाए रह।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ इब्रानी क्रिया का अर्थ “निगाह रख” भी हो सकता है; यूनानी पाठ में “घात लगाए रह” का बिंब है।
    reason: दुर्लभ क्रिया की शब्दार्थगत अनिश्चितता और यूनानी समानांतर के अधिक तीखे रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: לָצֵאת
  choice: निकल
  rationale: יצא के infinitive रूप को प्रसंग और यूनानी समानांतर के आदेशात्मक बल के अनुसार स्वाभाविक हिन्दी आज्ञार्थक रूप में रखा गया है।
- source_word: אַחֲרֶיהָ
  choice: उसके पीछे
  rationale: स्त्रीलिंग एकवचन प्रत्यय को बनाए रखता है, जो प्रसंग में व्यक्तिरूप दी गई बुद्धि की ओर संकेत करता है, और पीछा करने का बिंब भी सुरक्षित रखता है।
- source_word: בְחֵקֶר
  choice: उसकी खोज में
  rationale: חקר खोज, छानबीन या अन्वेषण का भाव देता है; यह चयन आधुनिक हिन्दी में स्वाभाविक है और यूनानी ὡς ἰχνευτής के खोजी/पदचिह्न ढूँढ़ने वाले भाव से मेल खाता है।
- source_word: מְבוֹאֶיהָ
  choice: उसके हर प्रवेश-द्वार
  rationale: מבוא के ठोस स्थानवाचक अर्थ ‘प्रवेश’ को बनाए रखता है; यूनानी εἴσοδοι भी इसी अर्थ की पुष्टि करता है।
- source_word: יְרַצֵּד
  choice: घात लगाए रह
  rationale: यह दुर्लभ क्रिया प्रतीक्षा करते हुए ताकने या घात लगाने का तीखा बिंब देती है; यूनानी ἐνέδρευε इस अर्थ का समर्थन करता है। ‘रह’ सतत और धैर्यपूर्ण निगरानी का भाव व्यक्त करता है।
theological_decisions:
- issue: बुद्धि का स्त्रीरूप में व्यक्तिकरण
  choice: स्त्रीलिंग संकेत को ‘उसकी/उसके’ द्वारा प्रसंगानुसार बनाए रखना
  alternative: सर्वनाम के स्थान पर हर बार ‘बुद्धि’ कहना
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन हैं। सर्वनामात्मक रूप साहित्यिक व्यक्तिकरण को बनाए रखता है और पाठ में कोई अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ता।
- issue: अंतिम निगरानी-बिंब की तीव्रता
  choice: मुख्य पाठ में ‘घात लगाए रह’
  alternative: ‘निगाह रख’ या ‘चौकसी कर’
  rationale: दुर्लभ इब्रानी क्रिया और यूनानी समानांतर दोनों घात लगाकर प्रतीक्षा करने का प्रबल बिंब सुझाते हैं। नरम विकल्प सम्भव अर्थ को बताता है, पर मूल रूपक की तीव्रता घटा देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और आदेशात्मक शैली रखी गई है। ‘प्रवेश-द्वार’ ठोस स्थान-बिंब को और ‘घात लगाए रह’ मूल की तीव्र खोज तथा प्रतीक्षा को सुरक्षित रखते हैं।
