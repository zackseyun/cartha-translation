base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: hi
  text: भाई को दो, उदारता दिखाओ और अपने आपको सुख दो,[a] क्योंकि शिओल[b] में सुख की खोज नहीं की जा सकती। और जो भी काम करना अच्छा हो, उसे परमेश्वर के सामने करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “दो और लो, और अपने प्राण को छलो।” यह एक कठिन वाक्यांश है, जो संभवतः अपने लिए सुख भोगने की ओर संकेत करता है; इब्रानी पाठ अधिक स्पष्ट रूप से कहता है, “अपने आपको सुख दो।”
    reason: alternative_reading
  - marker: b
    text: ‘शिओल’ मृतकों का लोक है; इसके अन्य संभावित अनुवाद ‘कब्र’ या ‘अधोलोक’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: भाई को दो
  rationale: इब्रानी में अक्षरशः ‘भाई को दो’ है। ‘भाई’ पारिवारिक और सामुदायिक संबंध की ठोस छवि को बनाए रखता है; इसे ‘किसी दूसरे को’ कहने से मूल की विशिष्टता मिट जाती।
- source_word: וְחֹנֵן
  choice: उदारता दिखाओ
  rationale: חנן का अर्थ कृपा या अनुग्रह दिखाना है। देने के प्रसंग में ‘उदारता दिखाओ’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल आर्थिक लेन-देन तक सीमित नहीं करता।
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: अपने आपको सुख दो
  rationale: פנק में किसी को सुख-सुविधा या कोमलता से रखने का भाव है और נַפְשֶׁךָ यहाँ स्वयं व्यक्ति को सूचित करता है। यह अनुवाद आत्म-आनंद के आशय को रखता है, पर हिन्दी में ‘अपने आपको लाड़-प्यार दो’ जैसी अस्वाभाविक अभिव्यक्ति से बचता है।
- source_word: בִּשְׁאוֹל
  choice: शिओल
  rationale: यह मृतकों के लोक के लिए प्राचीन इब्रानी पद है। लिप्यंतरण इसे केवल ‘कब्र’ या बाद की विकसित ‘नरक’ की धारणा में सीमित करने से बचाता है; अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: לְבַקֵּשׁ תַּעֲנוּג
  choice: सुख की खोज
  rationale: בקש खोजने और תענוג सुख या आनंद को व्यक्त करता है। ‘सुख की खोज’ इब्रानी रचना और यूनानी ζητῆσαι τρυφήν, दोनों के अनुरूप है।
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: जो भी काम करना अच्छा हो
  rationale: יפה यहाँ केवल सौंदर्य नहीं, बल्कि अच्छा, उचित या शोभनीय होने का नैतिक भाव देता है। यह हिन्दी अभिव्यक्ति उस व्यापकता को सहज रूप में रखती है।
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: उसे परमेश्वर के सामने करो
  rationale: लִפְנֵי का अक्षरशः अर्थ ‘के सामने’ है और यह परमेश्वर की उपस्थिति तथा दृष्टि, दोनों की संभावना बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अर्थ
  choice: शिओल
  alternative: कब्र; मृतकों का लोक; अधोलोक
  rationale: मूल पद को लिप्यंतरित करने से इसे केवल दफनाने की जगह या दंड के किसी बाद के सिद्धांत के रूप में निश्चित नहीं किया जाता। पाद-टिप्पणी पाठक को इसके प्राचीन अर्थ-क्षेत्र से परिचित कराती है।
- issue: स्वयं को सुख देने वाली आज्ञा में इब्रानी और यूनानी पाठ का संबंध
  choice: अपने आपको सुख दो
  alternative: अपने प्राण को छलो; अपना आनंद करो; अपने आपको लाड़-प्यार दो
  rationale: विद्यमान इब्रानी פנק स्पष्ट रूप से अपने साथ सुखद या विलासपूर्ण व्यवहार का संकेत देता है और मुख्य पाठ का आधार है। यूनानी का कठिन ‘अपने प्राण को छलो’ अलग शब्दावली को सुरक्षित रखता है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। वाक्यरचना मूल के क्रम के निकट है, पर हिन्दी में पठनीय बनाई गई है। ‘शिओल’ जैसे सांस्कृतिक-धार्मिक पद को सरल पर्याय से समतल करने के बजाय पाद-टिप्पणी सहित सुरक्षित रखा गया है।
