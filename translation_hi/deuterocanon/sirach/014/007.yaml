  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
translation:
  language: hi
  text: यदि वह भलाई करे भी, तो वह उसे विस्मृति में करता है[a], और अंत में अपनी बुराई प्रकट कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूल से करता है’ अथवा ‘मानो इसे भुला दिया गया हो’; यूनानी पद का शाब्दिक अर्थ ‘विस्मृति में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: करे भी
  rationale: καὶ ἐάν का संक्षिप्त रूप यहाँ रियायती शर्त व्यक्त करता है; ‘करे भी’ आधुनिक हिन्दी में ‘चाहे करे’ या ‘यदि करे भी’ का स्वाभाविक भाव देता है।
- source_word: εὖ ποιῇ
  choice: भलाई करे
  rationale: εὖ ποιέω का अर्थ अच्छा करना, भलाई करना या हितकारी कार्य करना है; ‘भलाई करे’ संक्षिप्त और सहज है।
- source_word: ἐν λήθῃ
  choice: विस्मृति में
  rationale: यह यूनानी पद शाब्दिक रूप से ‘विस्मृति में’ है। अभिव्यक्ति असामान्य और अर्थ की दृष्टि से खुली है, इसलिए मुख्य पाठ में उसकी रूपकात्मक अस्पष्टता बनाए रखी गई है।
- source_word: ποιεῖ
  choice: उसे ... करता है
  rationale: दोहराया गया ποιέω पहले खंड की ‘भलाई’ की ओर संकेत करता है; हिन्दी में ‘उसे’ जोड़ने से संबंध स्पष्ट रहता है।
- source_word: ἐπʼ ἐσχάτων
  choice: अन्त में
  rationale: यह काल-सूचक मुहावरा अन्ततः या आखिर में होने का भाव देता है; ‘अन्त में’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐκφαίνει
  choice: प्रकट कर देता है
  rationale: क्रिया का अर्थ सामने लाना या प्रकट करना है; ‘प्रकट कर देता है’ अन्ततः उजागर हो जाने के भाव को स्पष्ट करता है।
- source_word: τὴν κακίαν αὐτοῦ
  choice: अपनी बुराई
  rationale: κακία बुराई, दुष्टता या दुर्भावना को सूचित कर सकता है; ‘बुराई’ अनावश्यक रूप से अर्थ को केवल दुर्भावना तक सीमित नहीं करती।
