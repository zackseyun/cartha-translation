base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/011.yaml
  text: My son[a], if you have the means, treat yourself well; and if you have anything, do good to yourself.
translation:
  language: hi
  text: मेरे बेटे,[a] यदि तुम्हारे पास साधन हों, तो अपने साथ अच्छा व्यवहार करो; और यदि तुम्हारे पास कुछ हो, तो अपना भला करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ में आत्म-हित से संबंधित दो उपवाक्य हैं। यूनानी समानांतर में इसके स्थान पर या इसके साथ यह उपवाक्य मिलता है: “और प्रभु को योग्य भेंटें चढ़ाओ।” यह उपलब्ध इब्रानी में नहीं है और संभवतः पाठ का अधिक विस्तृत या भिन्न रूप सुरक्षित रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: इब्रानी में यह स्पष्ट रूप से पुल्लिंग एकवचन संबोधन है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के लिंग-संकेत के अनुरूप है।
- source_word: אִם יֵשׁ לְךָ
  choice: यदि तुम्हारे पास साधन हों / यदि तुम्हारे पास कुछ हो
  rationale: इब्रानी अस्तित्ववाचक रचना यहाँ अधिकार या उपलब्ध संसाधनों को व्यक्त करती है। पहली बार प्रसंगानुसार ‘साधन’ और दूसरी बार अधिक सामान्य ‘कुछ’ रखने से मूल की पुनरावृत्ति और सूक्ष्म भिन्नता दोनों बनी रहती हैं।
- source_word: שָׁרֵית נַפְשֶׁךָ
  choice: अपने जी को सुख दो
  rationale: यह संक्षिप्त और कुछ कठिन इब्रानी पद उपलब्ध साधनों से स्वयं को संतोष या सुख देने की ओर संकेत करता है। ‘जी’ נֶפֶשׁ के आत्मपरक और इच्छात्मक रंग को सहज हिन्दी में व्यक्त करता है, बिना इसे केवल भौतिक विलास तक सीमित किए।
- source_word: הֵיטִיב לָךְ
  choice: अपना भला करो
  rationale: हिफ़ील יטב और לָךְ का आत्मपरक भाव सीधे और गरिमापूर्ण हिन्दी में व्यक्त होता है; इससे ‘अपने साथ अच्छा व्यवहार करो’ जैसी बोझिल अभिव्यक्ति से बचा गया है।
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: प्रभु को योग्य भेंटें चढ़ाओ
  rationale: यह यूनानी समानांतर में संरक्षित पाठ का स्पष्ट हिन्दी रूप है, पर उपलब्ध इब्रानी में न होने के कारण इसे मुख्य पाठ में जोड़ने के बजाय पाठांतर के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: उपलब्ध इब्रानी में अनुपस्थित यूनानी भेंट-विषयक उपवाक्य
  choice: मुख्य पाठ में उपलब्ध इब्रानी के दोनों उपवाक्य रखना और यूनानी पाठांतर को पादटिप्पणी में बताना
  alternative: दूसरे इब्रानी उपवाक्य के स्थान पर ‘और प्रभु को योग्य भेंटें चढ़ाओ’ रखना
  rationale: प्राप्त इब्रानी पाठ उच्च विश्वसनीयता से प्रमाणित है और उसमें आत्म-हित संबंधी दो उपवाक्य हैं। यूनानी एक भिन्न या अधिक विस्तृत रूप सुरक्षित रख सकता है; उसे मुख्य पाठ में मिलाने से दोनों साक्ष्यों का संकर पाठ बन जाएगा। पादटिप्पणी वास्तविक पाठगत तनाव को पारदर्शी ढंग से बनाए रखती है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यूनानी पाठ के बलिदानी संदर्भ में κύριος परमेश्वर को सूचित करता है; ‘प्रभु’ इसका मानक, स्पष्ट और गैर-सांप्रदायिक हिन्दी रूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने जी को सुख दो’ सामान्य पाठक के लिए स्वाभाविक है और कठिन इब्रानी पद में निहित आत्म-संतोष के भाव को बचाता है। अर्धविराम मूल के दो समानांतर उपवाक्यों को स्पष्ट करता है।
