base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/005.yaml
  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: hi
  text: जो अपना ही अहित करता है, वह किसका भला करेगा? वह अपनी भलाई का आनंद नहीं लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह अपनी भलाई को नहीं देखेगा।” यहाँ इब्रानी मुहावरे का सम्भावित अर्थ है कि वह अपने कल्याण, समृद्धि, या अपने पास की भली वस्तुओं का अनुभव या आनंद नहीं लेगा; यूनानी समानांतर में है, “वह अपनी संपत्ति से आनंदित नहीं होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: अपने ही साथ बुरा करता है
  rationale: इब्रानी पदबंध का आशय अपने प्रति बुरा या हानिकारक व्यवहार करना है। यहाँ נֶפֶשׁ का अर्थ तकनीकी रूप से ‘आत्मा’ नहीं, बल्कि स्वयं व्यक्ति है; इसलिए यह सहज हिन्दी नैतिक विरोध को बनाए रखती है।
- source_word: לְמִי יֵיטִיב
  choice: वह किसके साथ भलाई करेगा?
  rationale: हिफ़ईल क्रिया יֵיטִיב का अर्थ ‘भलाई करना’ या ‘लाभ पहुँचाना’ है। प्रश्न की अलंकारिक धार और पहले खंड के ‘बुरा’ के साथ विरोध बनाए रखा गया है।
- source_word: וְלֹא יִרְאֶה
  choice: सुख नहीं पाएगा
  rationale: शाब्दिक अर्थ ‘नहीं देखेगा’ है, पर यहाँ ‘देखना’ किसी भलाई का अनुभव करने या उससे आनंद पाने का मुहावरा है। यूनानी समानांतर भी ‘आनंदित नहीं होगा’ कहकर इसी अर्थ की पुष्टि करता है।
- source_word: בְּטוֹבָתוֹ
  choice: अपनी अच्छी वस्तुओं का
  rationale: טוֹבָה भलाई, समृद्धि या अच्छी वस्तुओं को सूचित कर सकता है। यूनानी में संपत्ति का संकेत है, किंतु इब्रानी अधिक व्यापक है; ‘अच्छी वस्तुएँ’ उस व्यापकता को सुरक्षित रखता है।
