base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/001.yaml
  text: Happy is the man whose mouth has not caused him to stumble[b][a], and whose heart has not condemned him.
translation:
  language: hi
  text: सुखी है वह मनुष्य, जिसकी वाणी ने उसे ठोकर नहीं खिलाई[a], और जिसके हृदय ने उसे दोषी नहीं ठहराया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस खंड का इब्रानी पाठ कठिन है; उसका शाब्दिक रूप लगभग ‘जिसके मुँह ने उसे नहीं छोड़ा’ है। यूनानी समानांतर का अर्थ है, ‘जो अपने मुँह से नहीं फिसला,’ अर्थात जो अपनी वाणी के कारण ठोकर नहीं खाया।
    reason: alternative_reading
  - marker: b
    text: इस खंड का इब्रानी पाठ भी अनिश्चित है। यूनानी समानांतर में है, ‘जो पाप के दुःख में बेधा नहीं गया।’
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: सुखी है
  rationale: यह इब्रानी ज्ञान-साहित्य की मंगलोक्ति है, जो प्रशंसनीय और वांछनीय दशा बताती है। आधुनिक हिन्दी में ‘सुखी है’ इसका अर्थ सहज रूप से पहुँचाता है; ‘धन्य है’ भी संभव है, पर वह यहाँ आवश्यकता से अधिक धार्मिक आभा दे सकता है।
- source_word: אֱנוֹשׁ
  choice: वह मनुष्य
  rationale: यह शब्द सामान्य मानव के लिए प्रयुक्त है। प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखते हुए ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: जिसका मुँह उसके लिए ठोकर का कारण नहीं बना
  rationale: प्राप्त इब्रानी का शाब्दिक रूप लगभग ‘उसके मुँह ने उसे नहीं छोड़ा’ है और कठिन है। यूनानी समानांतर ‘अपने मुँह से नहीं फिसला’ संभावित आशय को वाणी के कारण नैतिक ठोकर खाने के रूप में स्पष्ट करता है। हिन्दी वाक्य इस आशय को व्यक्त करता है, पर कठिन पाठ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: וְלֹא אָבַח עָלָיו דִּין לִבּוֹ
  choice: और जिसके हृदय ने उसे दोषी नहीं ठहराया
  rationale: इब्रानी क्रिया असामान्य अथवा पाठगत रूप से अनिश्चित है; ‘उसके हृदय का न्याय’ अंतर्मन के आरोप या प्रतिकूल निर्णय की ओर संकेत करता है। ‘हृदय ने उसे दोषी नहीं ठहराया’ न्यायिक बारीकी को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: मंगलोक्ति का स्वर
  choice: सुखी है वह मनुष्य
  alternative: धन्य है वह मनुष्य
  rationale: पद ज्ञान-साहित्य में नैतिक रूप से वांछनीय दशा की घोषणा करता है और किसी स्पष्ट दैवी कर्ता का उल्लेख नहीं करता। इसलिए ‘सुखी’ चुना गया, बिना इस कथन के नैतिक भार को कम किए।
- issue: कठिन इब्रानी पाठ में यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ में संभावित अर्थ, और पादटिप्पणियों में पाठगत कठिनाई
  alternative: इब्रानी का अत्यंत शाब्दिक पर अस्पष्ट अनुवाद
  rationale: दोनों खंडों का इब्रानी पाठ कठिन है। इब्रानी को प्राथमिक रखते हुए यूनानी समानांतर से संभावित अर्थ की पुष्टि की गई है; जहाँ यूनानी में ‘पाप के दुःख’ का अतिरिक्त रूप मिलता है, उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
- issue: हृदय और अंतःकरण
  choice: हृदय ने उसे दोषी नहीं ठहराया
  alternative: उसके विवेक ने उसे नहीं धिक्कारा
  rationale: ‘विवेक’ अर्थ को स्पष्ट करता, पर इब्रानी के ‘हृदय’ और ‘न्याय’ दोनों रूपकों को समतल कर देता। चुना हुआ अनुवाद आंतरिक न्याय की धारणा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘मुँह’, ‘हृदय’ और ‘दोषी ठहराना’ मूल के शारीरिक तथा न्यायिक रूपकों को बनाए रखते हैं; कठिन पाठ को बिना छिपाए पादटिप्पणियों में समझाया गया है।
