base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/024.yaml
  text: He who camps around her house and drives his tent peg into her wall—[a]
translation:
  language: hi
  text: जो उसके घर के चारों ओर डेरा डालता है और अपनी खूँटियाँ उसकी दीवार में गाड़ता है—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके घर के पास ठहरता है और उसकी दीवारों में एक खूँटा गाड़ता है।” यूनानी समानान्तर पाठ में “चारों ओर” के स्थान पर “निकट” है और “खूँटियाँ/दीवार” के स्थान पर एकवचन “खूँटा” तथा बहुवचन “दीवारें” हैं।
    reason: इब्रानी और यूनानी समानान्तर पाठों के बीच स्थान-सूचक शब्द तथा वचन के भेद को सटीक रूप से स्पष्ट करना।
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: जो…डेरा डालता
  rationale: חנה का मूल अर्थ डेरा डालना या पड़ाव करना है। कृदन्त रूप किसी व्यक्ति के लाक्षणिक या निरन्तर आचरण को व्यक्त करता है।
- source_word: סְבִיבוֹת
  choice: चारों ओर
  rationale: इब्रानी शब्द केवल निकटता नहीं, बल्कि आसपास होने का सजीव चित्र देता है। यूनानी समानान्तर पाठ में ‘बहुत पास’ है, जिसे पाद-टिप्पणी में बताया गया है।
- source_word: בֵּיתָהּ
  choice: उसके घर
  rationale: स्त्रीलिंग प्रत्यय का स्वाभाविक अनुवाद है। प्रसंग में ‘उसके’ का संकेत मानवीकृत बुद्धि की ओर है।
- source_word: וְהֵבִיא
  choice: गाड़ता
  rationale: क्रिया का सामान्य अर्थ ‘लाना’ है, पर खूँटियों और डेरे के प्रसंग में अभिप्रेत क्रिया उन्हें टिकाना या गाड़ना है; यूनानी πήξει भी ‘स्थिर करेगा/गाड़ेगा’ का समर्थन करता है।
- source_word: יְתֵדָיו
  choice: अपनी खूँटियाँ
  rationale: इब्रानी रूप बहुवचन और स्वत्वसूचक है—‘उसकी खूँटियाँ’। डेरा डालने के बिम्ब में ‘खूँटियाँ’ स्वाभाविक हिन्दी है; यूनानी में एकवचन है, इसलिए पाठ की भिन्नता पाद-टिप्पणी में दी गई है।
- source_word: בְּקִירָהּ
  choice: उसकी दीवार में
  rationale: בְּ उपसर्ग और קיר का औपचारिक अर्थ ‘दीवार में’ है। असामान्य पर सजीव बिम्ब को सरल बनाकर ‘दीवार के पास’ नहीं किया गया।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम का संकेत
  choice: ‘उसके’ को प्रसंग में मानवीकृत बुद्धि का संकेत माना गया है।
  alternative: किसी सामान्य स्त्री या घर की स्वामिनी का संकेत।
  rationale: आस-पास के पद बुद्धि को खोजने और उसके निकट रहने की बात करते हैं; अतः घर का बिम्ब उसी मानवीकरण को आगे बढ़ाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘डेरा डालता’ और ‘खूँटियाँ…गाड़ता’ मूल के ठोस शिविर-बिम्ब को बनाए रखते हैं। अन्त का दीर्घ विराम-चिह्न इस पद के अगले विचार से जुड़े होने का संकेत देता है।
