translation:
  language: hi
  text: कंजूस व्यक्ति को धन शोभा नहीं देता, और बुरी नज़र वाले व्यक्ति को सोना शोभा नहीं देता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुरी नज़र वाला’ हिब्रू मुहावरा है; इसका आशय कृपण, ईर्ष्यालु, या दूसरों के प्रति दुर्भाव रखने वाले व्यक्ति से हो सकता है।
    reason: हिब्रू मुहावरे की बहुअर्थता बनाए रखते हुए हिन्दी के संभावित लोक-विश्वास संबंधी अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: לֵב קָטֹן
  choice: छोटे मन वाला
  rationale: शाब्दिक बिंब ‘छोटा हृदय’ है; हिन्दी में ‘छोटे मन वाला’ कृपणता और संकीर्ण उदारता का स्वाभाविक संकेत देता है, बिना अर्थ को किसी एक व्याख्या तक सीमित किए।
- source_word: לֹא נָאוֶה
  choice: शोभा नहीं देता
  rationale: नָאוֶה उपयुक्त, सुहावना या शोभनीय होने का भाव रखता है; यह हिन्दी अभिव्यक्ति नैतिक अनुपयुक्तता और विडंबना दोनों बनाए रखती है।
- source_word: רַע עַיִן
  choice: बुरी नज़र वाला
  rationale: हिब्रू का शाब्दिक मुहावरा सुरक्षित रखा गया है; संदर्भ में यह कृपण या ईर्ष्यालु व्यक्ति का संकेत कर सकता है, पर अनुवाद उस बहुअर्थता को नहीं मिटाता।
- source_word: חָרוּץ
  choice: सोना
  rationale: यहाँ संज्ञा के रूप में חָרוּץ बहुमूल्य धातु, विशेषतः सोने, को दर्शाता है। इसे सामान्य ‘धन-संपत्ति’ कहने के बजाय ठोस शब्द ‘सोना’ स्रोत की शब्दावली और पहली पंक्ति से उसका काव्यात्मक संबंध बनाए रखता है।
theological_decisions:
- issue: ‘बुरी नज़र’ मुहावरे का अर्थ
  choice: बुरी नज़र वाला
  alternative: कृपण मनुष्य
  rationale: शाब्दिक हिब्रू बिंब को बनाए रखने से कृपणता, ईर्ष्या और दुर्भावना की संभावित अर्थ-छायाएँ खुली रहती हैं; किसी एक नैतिक व्याख्या को मूल पाठ से अधिक निश्चित नहीं किया गया।
translation_notes:
