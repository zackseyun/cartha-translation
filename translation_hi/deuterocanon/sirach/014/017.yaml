base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/017.yaml
  text: All flesh wears out like a garment[a], and the everlasting decree is, “Dying, they shall die.”
translation:
  language: hi
  text: 'समस्त देह वस्त्र के समान जीर्ण हो जाती है; और चिरस्थायी विधान यह है: “मरणशील मर जाते हैं।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम हिब्रानी पदबंध अत्यंत संक्षिप्त और व्याकरण की दृष्टि से कठिन है; शब्दशः उसका अर्थ लगभग “प्राण छोड़ता हुआ—वे प्राण छोड़ते हैं/छोड़ेंगे” है। यह मृत्यु की सार्वभौमिकता की पुनरुक्तिपूर्ण अभिव्यक्ति है। यूनानी समानांतर इसे मृत्यु के युगों पुराने विधान के रूप में स्पष्ट करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: समस्त देह
  rationale: בשר का मूल अर्थ ‘देह/मांस’ है और यहाँ यह सभी नश्वर प्राणियों के लिए सामूहिक रूप से प्रयुक्त है। ‘समस्त देह’ हिब्रानी के ठोस मुहावरे और यूनानी πᾶσα σὰρξ दोनों को बनाए रखता है।
- source_word: כַּבֶּגֶד
  choice: वस्त्र के समान
  rationale: בגד सामान्यतः वस्त्र है; यह तुलना किसी ऐसी वस्तु से है जो समय के साथ पुरानी और क्षीण हो जाती है।
- source_word: יִבְלֶה
  choice: पुरानी पड़ जाती है
  rationale: בלה का अर्थ उपयोग या समय से पुराना अथवा जीर्ण होना है। देह के स्त्रीलिंग हिंदी रूप के साथ यह स्वाभाविक है और यूनानी παλαιοῦται के ‘पुराना होना’ अर्थ के निकट है।
- source_word: וְחֹק עוֹלָם
  choice: और सनातन विधान
  rationale: וְ को सीधे ‘और’ रखा गया है। חק किसी स्थिर नियम या विधान को और עולם यहाँ चिरस्थायी अथवा युगों से चले आ रहे स्वरूप को व्यक्त करता है।
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: प्राण छोड़ते हुए वे प्राण छोड़ देंगे
  rationale: यह कठिन, संक्षिप्त हिब्रानी पदबंध גוע की पुनरावृत्ति और तीसरे पुरुष बहुवचन को बचाता है। इसे सरल करके केवल ‘वे मरेंगे’ कहने से मूल की असामान्य तीव्रता और अस्पष्टता मिट जाती।
theological_decisions:
- issue: कठिन अंतिम उपवाक्य में सार्वभौमिक मृत्यु के विधान और हिब्रानी की असामान्य व्याकरणिक अभिव्यक्ति को कैसे रखा जाए
  choice: “प्राण छोड़ते हुए वे प्राण छोड़ देंगे।”
  alternative: “निश्चय ही वे मरेंगे” अथवा “मरनेवाले मरेंगे”
  rationale: यूनानी समानांतर आदिकालीन मृत्यु-विधान के अर्थ की पुष्टि करता है, पर हिब्रानी में दूसरा पुरुष नहीं, बल्कि तीसरे पुरुष बहुवचन के साथ גוע की पुनरावृत्ति है। मुख्य पाठ उसी तनाव को यथासंभव बनाए रखता है; पादटिप्पणी पाठक को उसके आशय और यूनानी समानांतर से अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘समस्त देह’ और अंतिम पुनरुक्ति मूल के काव्यात्मक तथा कुछ असामान्य रूप को जानबूझकर सुरक्षित रखते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
