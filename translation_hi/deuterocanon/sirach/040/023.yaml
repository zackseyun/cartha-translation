  yaml_path: translation/deuterocanon/sirach/040/023.yaml
  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: hi
  text: साथी और मित्र कुछ समय के लिए साथ रहते हैं,[a] पर उन दोनों से बढ़कर समझदार पत्नी[b] होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उचित समय पर मिलते हैं।” इब्रानी पदबंध और यूनानी समानांतर में समय का भाव है; इसका अर्थ सीमित अवधि या अनुकूल/उचित अवसर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “स्त्री” भी हो सकता है; यूनानी समानांतर वैवाहिक अर्थ की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עמית
  choice: साथी
  rationale: यह निकट सहयोगी या संग रहने वाले व्यक्ति का बोध कराता है; आधुनिक हिन्दी में ‘साथी’ स्वाभाविक है और רע से कुछ भिन्न भी रहता है।
- source_word: רע
  choice: मित्र
  rationale: עמית के साथ युग्म में इसे ‘मित्र’ कहना दोनों निकट सामाजिक संबंधों के सूक्ष्म भेद को बनाए रखता है।
- source_word: לעת
  choice: कुछ समय तक
  rationale: इब्रानी पदबंध में सीमित अवधि या किसी उपयुक्त अवसर—दोनों की संभावना है। मुख्य पाठ में अवधि का अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ינהגו
  choice: साथ निभाते हैं
  rationale: נהג के इस संदर्भगत भाव को शब्दशः ‘अपने को चलाते हैं’ कहना हिन्दी में अस्वाभाविक होगा। ‘साथ निभाते हैं’ संबंधों के कुछ समय तक चलने का भाव सहज रूप से व्यक्त करता है, बिना स्थायित्व का दावा किए।
- source_word: ומשניהם
  choice: पर उन दोनों से बढ़कर
  rationale: वाक्य-संरचना और यूनानी ὑπὲρ ἀμφότερα मिलकर श्रेष्ठता की तुलना सूचित करते हैं। ‘उन दोनों से बढ़कर’ इस तुलना को स्पष्ट रखता है।
- source_word: אשה
  choice: पत्नी
  rationale: इब्रानी शब्द ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है। यूनानी समानांतर में वैवाहिक संदर्भ अधिक स्पष्ट है, इसलिए मुख्य पाठ में ‘पत्नी’ चुना गया है; व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: משכלת
  choice: समझदार
  rationale: यह व्यावहारिक बुद्धि, सूझ-बूझ और विवेक से काम लेने वाली स्त्री का संकेत देता है। ‘समझदार’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: אשה को सामान्य अर्थ ‘स्त्री’ में लिया जाए या वैवाहिक अर्थ ‘पत्नी’ में
  choice: पत्नी
  alternative: स्त्री
  rationale: इब्रानी अकेले दोनों अर्थों की अनुमति देता है, पर यूनानी समानांतर वैवाहिक संबंध की ओर संकेत करता है। यह संदर्भगत-शाब्दिक निर्णय है, किसी संप्रदायगत मत का आरोपण नहीं।
- issue: לעת को सीमित अवधि माना जाए या उचित अवसर
  choice: कुछ समय तक
  alternative: समय आने पर / उचित अवसर पर
  rationale: इब्रानी לעת और यूनानी εἰς καιρόν दोनों समय-संबंधी अर्थ रखते हैं। संदर्भ में अस्थायित्व को मुख्य पाठ में रखा गया है, जबकि अवसरगत अर्थ को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साथ निभाते हैं’ शब्दशः अनुवाद के बजाय हिन्दी का स्वाभाविक संबंधपरक मुहावरा है। दोनों वास्तविक पाठगत अस्पष्टताओं को क्रमशः [a] और [b] में सुरक्षित रखा गया है।
