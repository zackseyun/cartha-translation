translation:
  language: hi
  text: ऊँचे सिंहासन पर बैठे हुए व्यक्ति से लेकर धूल और राख में लौटने वाले व्यक्ति तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מיושב
  choice: बैठे हुए व्यक्ति से
  rationale: מ उपसर्ग आरम्भ-बिंदु ‘से’ बताता है, और יושב कृदन्त रूप में बैठे हुए व्यक्ति को दर्शाता है।
- source_word: כסא
  choice: सिंहासन
  rationale: राजकीय और प्रतिष्ठित प्रसंग में כסא का स्वाभाविक अर्थ ‘सिंहासन’ है; यूनानी θρόνος भी इसकी पुष्टि करता है।
- source_word: לגבה
  choice: ऊँचे
  rationale: यह सिंहासन की ऊँचाई या प्रतिष्ठा का संकेत देता है; ‘ऊँचे’ दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: עד
  choice: लेकर … तक
  rationale: यह ‘से … तक’ की सीमा-संरचना का दूसरा सिरा है, न कि मुख्यतः समयसूचक ‘जब तक’।
- source_word: לשוב
  choice: लौटने वाले
  rationale: यह मनुष्य के धूल और राख में लौटने को सीमा के दूसरे सिरे के रूप में व्यक्त करता है और मूल की क्रियात्मकता बनाए रखता है।
- source_word: עפר ואפר
  choice: धूल और राख
  rationale: यह बाइबलीय युग्म नश्वरता, दीनता और मानवीय दुर्बलता व्यक्त करता है।
theological_decisions:
- issue: मानवीय प्रतिष्ठा और नश्वरता की पूरी सीमा व्यक्त करते समय इब्रानी पाठ को प्राथमिक रखना
  choice: ‘ऊँचे सिंहासन पर बैठे हुए व्यक्ति से लेकर धूल और राख में लौटने वाले व्यक्ति तक’ के रूप में इब्रानी का सीधा अनुवाद
  alternative: ‘महिमा के सिंहासन पर बैठे हुए व्यक्ति से लेकर मिट्टी और राख में दीन किए गए व्यक्ति तक’
  rationale: इब्रानी उपलब्ध प्राथमिक साक्ष्य है और संक्षेप में सर्वोच्च पद से मनुष्य के नश्वर अंत तक का विरोध दिखाता है। यूनानी पाठ ‘महिमा’ और ‘दीन किए गए’ को स्पष्ट करता है, पर ये विस्तार इब्रानी में प्रत्यक्ष नहीं हैं; इसलिए उन्हें मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट भाषा। ‘व्यक्ति’ की पुनरावृत्ति ‘से … तक’ की दोनों सीमाओं को साफ करती है; ‘धूल और राख’ पारंपरिक बाइबलीय प्रतिध्वनि बनाए रखता है।
