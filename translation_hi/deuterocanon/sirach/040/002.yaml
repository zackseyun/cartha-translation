translation:
  language: hi
  text: अपनी माँ के गर्भ से उसके निकलने के दिन से लेकर सभी जीवितों की माता के पास उसके लौटने के दिन तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ, “सभी जीवितों की माता के पास।” यह काव्यात्मक अभिव्यक्ति संभवतः धरती की ओर संकेत करती है, जो सबकी समान माता है और जिसके पास मनुष्य मृत्यु में लौटता है। यूनानी समानांतर पाठ मृत्यु का संदर्भ स्पष्ट करता है: “मृत्यु का दिन।”'
    reason: मूल इब्रानी रूपक का संभावित आशय स्पष्ट करना और यूनानी समानांतर पाठ की साक्षी बताना।
lexical_decisions:
- source_word: מיום
  choice: जिस दिन … उस दिन से
  rationale: מן के साथ יום समयावधि का आरंभ बताता है। यह रचना हिन्दी में स्वाभाविक रहते हुए ‘उस दिन से’ का स्पष्ट अर्थ देती है।
- source_word: צאתו
  choice: वह … निकलता है
  rationale: יצא का मूल ठोस अर्थ ‘निकलना’ है। जन्म कहने के बजाय गर्भ से निकलने का इब्रानी बिंब सुरक्षित रखा गया है।
- source_word: מרחם אמו
  choice: अपनी माँ के गर्भ से
  rationale: यह इब्रानी पदबंध का सीधा और आधुनिक हिन्दी में स्वाभाविक अनुवाद है; ‘गर्भ’ जन्म के शारीरिक बिंब को बनाए रखता है।
- source_word: עד יום
  choice: उस दिन तक जब
  rationale: यह उसी समयावधि की अंतिम सीमा बताता है और हिन्दी वाक्य में सहज रूप से अगले क्रियापद से जुड़ता है।
- source_word: שובו
  choice: वह … लौटता है
  rationale: שוב का अर्थ ‘लौटना’ है। क्रियात्मक अनुवाद आरंभ के ‘निकलता है’ के साथ समानांतरता बनाए रखता है।
- source_word: אל אם כל חי
  choice: सभी जीवितों की माता के पास
  rationale: मूल इब्रानी के मातृरूपक को ‘धरती’ या ‘मृत्यु’ जैसी व्याख्यात्मक अभिव्यक्ति से बदलने के बजाय सुरक्षित रखा गया है। אל के लिए ‘के पास’ हिन्दी में लौटने के गंतव्य को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘सभी जीवितों की माता’ के रूप में मृत्यु का काव्यात्मक संकेत
  choice: मुख्य पाठ में इब्रानी मातृरूपक को बनाए रखा गया है।
  alternative: ‘धरती के पास’ या ‘मृत्यु की ओर’
  rationale: प्राथमिक इब्रानी साक्ष्य रूपकात्मक है और उसे स्पष्ट व्याख्या से बदलना उसके साहित्यिक तनाव को मिटा देगा। यूनानी समानांतर पाठ ‘मृत्यु के दिन’ का स्पष्ट उल्लेख करके मृत्यु-संबंधी अर्थ की पुष्टि करता है, जिसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोहराए गए ‘जिस दिन/उस दिन’ से इब्रानी की आरंभ और अंत वाली समय-संरचना स्पष्ट होती है, जबकि ‘सभी जीवितों की माता’ जानबूझकर काव्यात्मक और कुछ हद तक रहस्यपूर्ण रखा गया है।
