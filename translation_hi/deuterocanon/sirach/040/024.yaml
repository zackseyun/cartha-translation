  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: hi
  text: भाई और साथी संकट के समय काम आते हैं, पर धार्मिकता[a] उन दोनों से बढ़कर छुड़ाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “और दान/दया उन दोनों से बढ़कर छुड़ाती है।” इब्रानी साक्ष्य में यहाँ “धार्मिकता” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אח
  choice: भाई
  rationale: इब्रानी शब्द का सीधा अर्थ ‘भाई’ है; सहभागी के साथ इसका समानांतर प्रयोग ठोस पारिवारिक संबंध को बनाए रखने का समर्थन करता है।
- source_word: ושותף
  choice: और सहभागी
  rationale: שותף किसी के साथ भाग या सहभागिता रखने वाले व्यक्ति को दर्शाता है। ‘सहभागी’ आधुनिक और गरिमापूर्ण है तथा अस्पष्ट रूप से केवल व्यावसायिक साझेदारी का बोध नहीं कराता।
- source_word: לעת צרה
  choice: संकट के समय काम आते हैं
  rationale: शाब्दिक रूप से ‘संकट के समय के लिए’ है। हिन्दी में विधेय को स्वाभाविक और निहित उपयोगिता को स्पष्ट करने के लिए ‘काम आते हैं’ रखा गया है।
- source_word: ומשניהם
  choice: उन दोनों से बढ़कर
  rationale: यह तुलना भाई और सहभागी, दोनों से श्रेष्ठ प्रभाव व्यक्त करती है।
- source_word: צדק
  choice: धार्मिकता
  rationale: विद्यमान इब्रानी पाठ का सामान्य अर्थ ‘धार्मिकता’ या ‘न्याय’ है। यहाँ व्यापक नैतिक गुण के कारण ‘धार्मिकता’ उपयुक्त है; यूनानी पाठ का भिन्न अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מצלת
  choice: छुड़ाती है
  rationale: क्रिया संकट या खतरे से बचाने अथवा निकालने का अर्थ देती है। ‘छुड़ाती है’ इस उद्धारकारी भाव को सहज हिन्दी में रखता है।
theological_decisions:
- issue: इब्रानी צדק और यूनानी ἐλεημοσύνη के बीच पाठांतर
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘धार्मिकता’
  alternative: यूनानी समानांतर के अनुसार ‘दान/दया’
  rationale: यहाँ उपलब्ध इब्रानी साक्ष्य को मुख्य आधार बनाया गया है। यूनानी पाठ नैतिक बल को दान अथवा दया की ओर मोड़ता है; इस अर्थपूर्ण भिन्नता को चुपचाप मिटाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ज्ञान-साहित्य के अनुरूप संक्षिप्त, सहज और गरिमापूर्ण शैली। ‘काम आते हैं’ ने इब्रानी के संक्षिप्त संबंधसूचक वाक्य को स्वाभाविक हिन्दी दी है।
