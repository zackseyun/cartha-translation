  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: hi
  text: जो कुछ धरती से है, वह धरती में लौट जाता है[a], और जो कुछ ऊपर से है, वह ऊपर ही लौट जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “और जो जल से है, वह समुद्र में लौट जाता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: जो कुछ
  rationale: यह व्यापक, अनिर्दिष्ट समष्टिवाचक अर्थ देता है और इसे केवल मनुष्यों तक सीमित नहीं करता।
- source_word: מארץ אל ארץ
  choice: धरती से ... धरती में
  rationale: यह उत्पत्ति और उसी स्थान में वापसी की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ישוב
  choice: लौट जाता है
  rationale: שוב का सामान्य अर्थ ‘लौटना’ है; वर्तमान प्रसंग में यह वापसी का भाव स्पष्ट करता है।
- source_word: ואשר
  choice: और जो कुछ
  rationale: समानांतरता व्यापक और सृष्टिगत है, इसलिए इसे व्यक्तिवाचक ‘जो कोई’ के बजाय वस्तु-वाचक और व्यापक रूप में रखा गया है।
- source_word: ממרום אל מרום
  choice: ऊपर से ... ऊपर ही
  rationale: מרום की ऊर्ध्व दिशा और पुनरुक्ति सुरक्षित रहती है, जबकि ‘स्वर्ग’ जैसा अधिक निश्चित अर्थ आरोपित नहीं होता।
theological_decisions:
- issue: इब्रानी दूसरे चरण और यूनानी समानांतर पाठ में भिन्नता
  choice: 'मुख्य पाठ में इब्रानी: ‘और जो कुछ ऊपर से है, वह ऊपर ही लौट जाता है।’'
  alternative: 'यूनानी: ‘और जो जल से है, वह समुद्र में लौट जाता है।’'
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिक रखा गया है। उसका कथन संक्षिप्त और रहस्यमय है, इसलिए उसे स्पष्ट करने के नाम पर यूनानी पाठ से प्रतिस्थापित नहीं किया गया; महत्वपूर्ण यूनानी पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज पर गरिमापूर्ण शैली। इब्रानी की व्यापकता और दूसरे चरण की वास्तविक अस्पष्टता बनाए रखी गई है।
