  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: hi
  text: फिर वह युद्ध की तैयारी करता है[a] और जाग उठता है; कोई भय नहीं है, और वह विश्राम पाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का अधिक शाब्दिक भाव है, “फिर वह युद्ध की व्यवस्था करता है।” यूनानी समानांतर पाठ उल्लेखनीय रूप से भिन्न है; उसका अर्थ लगभग यह है, “अपने छुटकारे के समय वह जाग उठा और यह देखकर चकित हुआ कि कोई भय नहीं था।” जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ मुख्य पाठ उसी को प्राथमिकता देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עוד
  choice: फिर
  rationale: यह शब्द यहाँ कष्टपूर्ण अनुभव की पुनरावृत्ति दिखाता है; आधुनिक हिन्दी में “फिर” स्वाभाविक और संक्षिप्त है।
- source_word: עורך מלחמה
  choice: युद्ध की तैयारी करता है
  rationale: ערך का मूल भाव व्यवस्थित करने या पंक्तिबद्ध करने का है, विशेषतः युद्ध के लिए। हिन्दी में “युद्ध की तैयारी करता है” इस प्रसंग में स्वाभाविक रहते हुए उस भाव को व्यक्त करता है।
- source_word: והקיץ
  choice: और जाग उठता है
  rationale: קיץ नींद से जागने को दर्शाता है। “जाग उठता है” स्वप्न-सदृश युद्ध से जागने की ओर हुए अचानक परिवर्तन को स्पष्ट करता है।
- source_word: ואימה אין
  choice: भय नहीं रहता
  rationale: इब्रानी वाक्यांश संक्षिप्त और क्रियारहित है। यह अनुवाद उसके सीधे अर्थ को स्वाभाविक हिन्दी में रखता है और यह नहीं बताता कि भय पहले वास्तविक था या केवल स्वप्न में।
- source_word: ומצא מנוח
  choice: और उसे विश्राम मिलता है
  rationale: מנוח का अर्थ विश्राम या चैन है। हिन्दी में “उसे विश्राम मिलता है” मूल के ‘विश्राम पाने’ के भाव को सहज ढंग से व्यक्त करता है।
