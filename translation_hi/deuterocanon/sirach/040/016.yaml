lexical_decisions:
- source_word: כקרדמות
  choice: झाड़ियाँ
  rationale: यह दुर्लभ और अनिश्चित वनस्पति-संज्ञा है। यूनानी समानांतर जल के पास उगने और शीघ्र उखाड़े जाने की छवि देता है; इसलिए किसी निश्चित प्रजाति का दावा किए बिना कमजोर झाड़ीदार वनस्पति का सामान्य शब्द चुना गया।
- source_word: על מטעי נחל
  choice: नाले के किनारे की रोपाई में
  rationale: מטעי का अर्थ रोपाई/लगाए हुए पौधे और נחל का अर्थ नाला, जलधारा या वादी है। यह अनुवाद जलमार्ग के पास लगाई गई वनस्पति की कृषि-संबंधी छवि बनाए रखता है।
- source_word: מפני כל מטר
  choice: हर वर्षा के सामने
  rationale: מפני का शाब्दिक भाव ‘सामने’ है और प्रसंग में वर्षा के प्रभाव का सामना करना निहित हो सकता है। कारण और कालक्रम के बीच मूल की हल्की अस्पष्टता को पूरी तरह समाप्त नहीं किया गया।
- source_word: נדעכו
  choice: मुरझा जाती हैं
  rationale: क्रिया बुझने, मंद पड़ने या क्षीण होकर समाप्त होने का भाव देती है। वनस्पति के संदर्भ में ‘मुरझा जाती हैं’ स्वाभाविक है और नष्ट होने की छवि रखता है।
