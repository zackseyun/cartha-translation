base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: hi
  text: हर मनुष्य के हिस्से में बड़ा परिश्रम ठहराया गया है, और आदम की संतानों पर भारी बोझ है[a]—जिस दिन वे अपनी माता के गर्भ से निकलते हैं, उस दिन से लेकर उस दिन तक जब वे सबकी माता में दफ़नाए जाते हैं।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में ‘आदम की संतानों पर भारी जूआ’ है। उपलब्ध इब्रानी यहाँ अधिक संक्षिप्त है; मुख्य पाठ में ‘भारी बोझ’ उसी भाव को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: जन्म से दफ़न तक का यह अंश पूर्णतर यूनानी समानांतर में मिलता है; उपलब्ध इब्रानी साक्ष्य में इस पद का वाक्य इससे छोटा है।
    reason: alternative_reading
  - marker: c
    text: ‘सबकी माता’ से आशय पृथ्वी है, जिसमें अंततः सब मनुष्यों को दफ़नाया जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: עסק גדול
  choice: बड़ा परिश्रम
  rationale: यह इब्रानी पदबंध श्रमसाध्य, थका देने वाले काम या जीवन की बड़ी परेशानी को दर्शाता है। ‘बड़ा परिश्रम’ आधुनिक हिन्दी में उसके श्रम और कठिनाई—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है; यूनानी Ἀσχολία μεγάλη भी इसी अर्थ की पुष्टि करता है।
- source_word: חלק אל
  choice: हर मनुष्य के हिस्से में … आया है
  rationale: प्राप्त इब्रानी पाठ संक्षिप्त और कठिन है, पर חלק में ‘भाग/हिस्सा’ का भाव स्पष्ट है। यूनानी ‘हर मनुष्य के लिए रचा गया है’ कहता है। चुना हुआ रूप मनुष्य को मिले जीवन-भाग का भाव रखता है, पर अस्पष्ट इब्रानी में किसी कर्ता का नाम जबरन नहीं जोड़ता।
- source_word: ועל כבד
  choice: भारी बोझ
  rationale: इब्रानी वाक्यांश संक्षिप्त और दीर्घवृत्तीय है। यूनानी में स्पष्ट रूप से ζυγὸς βαρύς, अर्थात ‘भारी जूआ’, है। मुख्य पाठ में ‘भारी बोझ’ अर्थ को सहज हिन्दी में रखता है, जबकि रूपक को पादटिप्पणी में बताया गया है।
- source_word: על בני אדם
  choice: आदम की संतानों पर
  rationale: בני אדם का शाब्दिक और सांस्कृतिक रूप ‘आदम की संतानें’ है। इससे समस्त मानवजाति का आशय भी स्पष्ट रहता है और स्रोत का आदमिक संकेत भी नष्ट नहीं होता।
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: जिस दिन वे अपनी माता के गर्भ से निकलते हैं, उस दिन से
  rationale: यह यूनानी समानांतर में सुरक्षित पूर्णतर काल-वाक्य है। अनुवाद जन्म को केवल सारांशित करने के बजाय स्रोत की गर्भ से निकलने वाली सजीव अभिव्यक्ति को रखता है।
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: उस दिन तक जब वे सबकी माता में दफ़नाए जाते हैं
  rationale: यूनानी पाठ दफ़नाए जाने को स्पष्ट रूप से कहता है। ‘सबकी माता’ पृथ्वी का रूपक है; उसे मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: छोटे इब्रानी साक्ष्य के साथ पूर्णतर यूनानी समानांतर का उपयोग
  choice: आरम्भिक कथन को इब्रानी के आधार पर और जन्म से दफ़न तक की सीमा को यूनानी समानांतर के आधार पर अनूदित किया गया।
  alternative: केवल उपलब्ध छोटे इब्रानी वाक्य का अनुवाद करना और यूनानी विस्तार को मुख्य पाठ से बाहर रखना।
  rationale: सिराख के लिए इब्रानी प्राथमिक साक्ष्य है, पर यूनानी समानांतर वास्तविक पाठ-साक्ष्य के रूप में पूर्णतर वाक्य सुरक्षित रखता है। पादटिप्पणी पाठकों को इस साक्ष्य-अंतर के विषय में स्पष्ट रूप से बताती है।
- issue: בני אדם / υἱοὺς Ἀδάμ का मानवशास्त्रीय संकेत
  choice: आदम की संतानें
  alternative: मनुष्यजाति; मनुष्य के बेटे
  rationale: यह रूप सभी मनुष्यों को समेटता है और स्रोत में उपस्थित आदम-संबंधी संकेत भी बनाए रखता है; किसी अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष को नहीं जोड़ता।
- issue: ‘सबकी माता’ के रूपक की व्याख्या
  choice: रूपक को मुख्य पाठ में बनाए रखा और पादटिप्पणी में पृथ्वी के रूप में समझाया।
  alternative: मुख्य पाठ में सीधे ‘पृथ्वी’ लिखना।
  rationale: स्रोत की काव्यात्मक छवि को मिटाए बिना आधुनिक पाठक के लिए उसका अभिप्राय स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दफ़नाए’ और ‘आदम की संतानों’ जैसे परिचित शब्द स्रोत की ठोस छवियों को बनाए रखते हैं; कठिन पाठ-साक्ष्य और यूनानी विस्तार को पादटिप्पणियों में पारदर्शी बनाया गया है।
