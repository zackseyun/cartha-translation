base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/014.yaml
  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: hi
  text: जब वह अपने हाथ खोलेगा, तब वह आनन्दित होगा[a][b]; इसी प्रकार अपराध करने वाले अचानक सदा के लिए मिट जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहला इब्रानी खंड अत्यन्त कठिन है और उसका मोटा अर्थ लोगों तथा ‘लूटने’ से जुड़ा हो सकता है। यूनानी पाठ है, “जब वह अपने हाथ खोलता है, तब वह आनन्दित होता है।”
    reason: alternative_reading
  - marker: b
    text: मसादा पांडुलिपि में यहाँ केवल खंडित पाठ बचा है। पहले खंड में काहाना के काहिरा गनीज़ा-आधारित इब्रानी पाठ और यूनानी पाठ के बीच बड़ा अंतर है; यूनानी में ‘आनन्दित होता है’ एकवचन में है।
    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: जब वह अपने हाथ खोलता है
  rationale: इब्रानी पदबंध कठिन और सम्भवतः पाठगत रूप से विकृत है; यूनानी समानान्तर स्पष्टतः हाथ खोलने की बात करता है। यह हिन्दी अनुवाद उस अर्थ को स्वाभाविक ढंग से व्यक्त करता है और कर्ता की अनिश्चित पहचान को सर्वनाम में बनाए रखता है।
- source_word: עם עם / εὐφρανθήσεται
  choice: तब वे आनन्दित होते हैं
  rationale: उपलब्ध इब्रानी पाठ अस्पष्ट है और लूटने से जुड़ा कोई भिन्न अर्थ दे सकता है, जबकि यूनानी में ‘आनन्दित होना’ है। मुख्य पाठ में स्पष्ट यूनानी साक्ष्य लिया गया है और इब्रानी कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है। यूनानी क्रिया एकवचन है, पर प्रसंग और प्राप्त परामर्श-पाठ के अनुसार हिन्दी में बहुवचन सर्वनाम रखा गया है; इस असंगति को पाठगत टिप्पणी में पारदर्शी बनाया गया है।
- source_word: כי / οὕτως
  choice: इसी प्रकार
  rationale: इब्रानी כי का अर्थ ‘क्योंकि/निश्चय ही’ हो सकता है, जबकि यूनानी οὕτως ‘इस प्रकार’ कहता है। ‘इसी प्रकार’ यूनानी समानान्तर के संबंधसूचक बल को रखता है और अनावश्यक विरोधसूचक ‘परन्तु’ नहीं जोड़ता।
- source_word: פתאם
  choice: अचानक
  rationale: इब्रानी शब्द का सीधा अर्थ ‘अचानक’ या ‘एकाएक’ है; इसे चेतावनी की तीक्ष्णता बनाए रखने के लिए स्पष्ट रूप से रखा गया है।
- source_word: לנצח
  choice: सदा के लिए
  rationale: यह इब्रानी पद स्थायित्व और अंतिमता व्यक्त करता है। ‘सदा के लिए’ आधुनिक हिन्दी में सहज है और अर्थ को ‘पूरी तरह’ तक सीमित नहीं करता।
- source_word: יתם / ἐκλείψουσιν
  choice: मिट जाएँगे
  rationale: इब्रानी और यूनानी दोनों समाप्त हो जाने या बने न रहने का भाव देते हैं। ‘मिट जाएँगे’ स्वाभाविक हिन्दी है और हिंसक विनाश की अनावश्यक व्याख्या किए बिना अंतिम लोप का भाव रखता है।
- source_word: οἱ παραβαίνοντες
  choice: अपराध करनेवाले
  rationale: यूनानी में उन लोगों का स्पष्ट उल्लेख है जो सीमा या आज्ञा का उल्लंघन करते हैं। ‘अपराध करनेवाले’ सामान्य पाठक के लिए स्पष्ट है और किसी विशेष धार्मिक व्यवस्था को अनकहे रूप में नहीं जोड़ता।
theological_decisions:
- issue: कठिन इब्रानी पाठ के स्थान पर यूनानी समानान्तर का उपयोग
  choice: पहले खंड में स्पष्ट यूनानी अर्थ के आधार पर ‘जब वह अपने हाथ खोलता है, तब वे आनन्दित होते हैं’ रखा गया है; दूसरे खंड में इब्रानी के ‘अचानक’ और ‘सदा के लिए’ को यूनानी के ‘अपराध करनेवालों’ के साथ रखा गया है।
  alternative: इब्रानी की ओर अधिक झुका पुनर्निर्माण पहले खंड में लोगों और लूटने का चित्र दे सकता है।
  rationale: सिराख के सुरक्षित इब्रानी पाठ को प्राथमिकता है, पर यहाँ पहला खंड अत्यन्त कठिन है और यूनानी से बहुत भिन्न है। इसलिए मुख्य पाठ में यूनानी को वास्तविक पाठ-साक्ष्य के रूप में अपनाया गया है, जबकि भिन्न इब्रानी सम्भावना को पादटिप्पणी में स्पष्ट किया गया है।
- issue: दोनों खंडों के बीच संबंध
  choice: ‘इसी प्रकार’
  alternative: ‘परन्तु’ अथवा ‘क्योंकि’
  rationale: यूनानी οὕτως तुलना या परिणाम का संबंध बनाता है, जबकि इब्रानी כי कारण या बलसूचक अर्थ दे सकता है। ‘इसी प्रकार’ उपलब्ध स्पष्ट यूनानी संरचना को रखता है; पादटिप्पणी पाठगत अस्थिरता से पाठक को अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आनन्दित’ और ‘सदा के लिए मिट जाएँगे’ साहित्यिक गंभीरता रखते हुए भी प्रचलित हैं। अस्पष्ट कर्ता को ‘वह/वे’ के रूप में जस का तस रखा गया है; उसकी पहचान अनुमान से निर्धारित नहीं की गई।
