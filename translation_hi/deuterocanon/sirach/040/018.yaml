  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: hi
  text: दाखमधु और नशीला पेय जीवन को मधुर बनाते हैं, पर इन दोनों से बढ़कर है खज़ाना पा लेना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अधिक शाब्दिक रूप है: “दाखमधु और नशीला पेय जीवन को मधुर बनाते हैं, और इन दोनों से परे खज़ाना पाना।” यूनानी समानांतर भी तुलनात्मक अर्थ, “दोनों से बढ़कर,” का समर्थन करता है।'
    reason: इब्रानी संबंधसूचक वाक्यांश ומשניהם को प्रसंग और यूनानी समानांतर के आधार पर तुलनात्मक रूप में प्रस्तुत किया गया है।
lexical_decisions:
- source_word: חיי
  choice: जीवन को
  rationale: यहाँ इब्रानी रचना शाब्दिक रूप से कठिन है; יין ושכר और ימתקו के साथ इसका स्वाभाविक आशय इन पेयों द्वारा जीवन के मधुर या सुखद होने से है। ‘जीवन को’ मूल संज्ञा को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट अर्थ देता है।
- source_word: יין
  choice: दाखमधु
  rationale: यह अंगूर से बने मद्य के लिए सामान्य इब्रानी शब्द है। ‘दाखमधु’ इसे अगले व्यापक मद्यवाचक शब्द से अलग रखता है और गरिमापूर्ण हिन्दी में सुबोध है।
- source_word: ושכר
  choice: और नशीला पेय
  rationale: שכר सामान्यतः दाखमधु से भिन्न मादक पेय को दर्शाता है। ‘नशीला पेय’ किसी एक प्रकार, जैसे बीयर, को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ימתקו
  choice: मधुर बनाते हैं
  rationale: מתק का मूल भाव ‘मीठा/मधुर होना या बनाना’ है। जीवन के संदर्भ में यह वाक्यांश मूल बिंब को सुरक्षित रखते हुए सुखद बनाने का भाव व्यक्त करता है।
- source_word: ומשניהם
  choice: पर इन दोनों से बढ़कर
  rationale: उपसर्ग מן यहाँ तुलना का भाव दे सकता है; यूनानी समानांतर ὑπὲρ ἀμφότερα (‘दोनों से ऊपर/बढ़कर’) इसकी पुष्टि करता है। हिन्दी में ‘पर’ विरोधात्मक तुलना को स्वाभाविक बनाता है।
- source_word: מוצא
  choice: पा लेना
  rationale: यह מצא से बना रूप है और ‘पाना/ढूँढ़ निकालना’ व्यक्त करता है। यहाँ क्रियार्थक संज्ञा के रूप में ‘पा लेना’ सहज हिन्दी है; यूनानी भी ‘पानेवाला’ अर्थ का समर्थन करता है।
- source_word: אוצר
  choice: खज़ाना
  rationale: संदर्भ में इसका अर्थ मूल्यवान निधि है, भंडारगृह नहीं। यूनानी θησαυρόν भी इसी अर्थ का समर्थन करता है।
