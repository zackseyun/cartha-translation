base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: hi
  text: धन और बल हृदय को ऊँचा उठाते हैं, और परमेश्वर का भय उन दोनों से बढ़कर है। परमेश्वर के भय में कोई कमी नहीं होती, और उसके साथ किसी सहारे की खोज करने की आवश्यकता नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חיל
  choice: धन
  rationale: כח (‘बल’) के साथ युग्म में חיל का अर्थ भौतिक साधन या धन है; यूनानी χρήματα भी इसी अर्थ की पुष्टि करता है।
- source_word: כח
  choice: बल
  rationale: यह इब्रानी כח और यूनानी ἰσχύς का सीधा, स्वाभाविक और व्यापक हिन्दी समतुल्य है।
- source_word: יגדלו לב
  choice: मन को ऊँचा उठाते हैं
  rationale: शाब्दिक रूपक को बनाए रखता है और इसे केवल साहस या घमण्ड मानकर अस्पष्टता को समाप्त नहीं करता। हिन्दी में ‘हृदय को बड़ा करते हैं’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: ומשניהם
  choice: परन्तु ... उन दोनों से बढ़कर
  rationale: इब्रानी वाव को प्रसंगानुसार विरोधात्मक ‘परन्तु’ से व्यक्त किया गया है, जबकि מן के तुलनात्मक भाव को ‘उन दोनों से बढ़कर’ स्पष्ट रूप से दर्शाता है।
- source_word: יראת אלהים
  choice: परमेश्वर का भय
  rationale: אלהים का ठीक प्रतिनिधित्व करता है और ज्ञान-साहित्य के इस मुख्य मुहावरे में भय, श्रद्धा और आज्ञाकारिता के धर्मवैचारिक तनाव को बनाए रखता है।
- source_word: מחסור
  choice: घटी
  rationale: ‘कोई घटी नहीं होती’ अभाव या कमी की दशा को संक्षिप्त और प्रतिष्ठित हिन्दी में व्यक्त करता है; यूनानी ἐλάττωσις भी कमी या न्यूनता का संकेत देता है।
- source_word: ואין לבקש עמה משען
  choice: और उसके साथ किसी सहारे की खोज करने की आवश्यकता नहीं है
  rationale: עמה (‘उसके साथ’) और משען (‘सहारा’) दोनों को स्पष्ट रखकर परमेश्वर के भय के साथ किसी अतिरिक्त आधार की आवश्यकता न होने का भाव व्यक्त करता है।
theological_decisions:
- issue: יראת אלהים का अनुवाद
  choice: परमेश्वर का भय
  alternative: परमेश्वर के प्रति श्रद्धा
  rationale: ‘भय’ मूल बाइबलीय मुहावरे का पूरा भार बनाए रखता है; केवल ‘श्रद्धा’ कहने से विस्मय, पवित्र भय और आज्ञाकारिता के बीच का तनाव अनावश्यक रूप से नरम पड़ सकता है।
- issue: ומשניהם का संबंध
  choice: परमेश्वर का भय उन दोनों से बढ़कर है
  alternative: और परमेश्वर का भय उन दोनों से है
  rationale: इब्रानी पाठ अत्यन्त संक्षिप्त है, पर प्रसंग और यूनानी ὑπὲρ ἀμφότερα तुलनात्मक श्रेष्ठता का समर्थन करते हैं। ‘बढ़कर’ तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘मन को ऊँचा उठाते हैं’ मूल रूपक की सकारात्मक आत्मविश्वास और नकारात्मक घमण्ड—दोनों संभावनाएँ खुली रखता है।
