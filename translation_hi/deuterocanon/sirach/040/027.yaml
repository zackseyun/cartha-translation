  yaml_path: translation/deuterocanon/sirach/040/027.yaml
  text: The fear of God is like a garden of blessing[b][a], and it shelters more than any glory.
translation:
  language: hi
  text: परमेश्वर का भय आशीषमय अदन के समान है[a], और वह हर महिमा से बढ़कर आश्रय देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आशीष का अदन।” यूनानी समानांतर पाठ में “आशीष का स्वर्गोपवन” है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम संक्षिप्त इब्रानी वाक्यांश कठिन है। यूनानी समानांतर पाठ में “और उन्होंने उसे हर महिमा से बढ़कर ढक लिया” पढ़ा जाता है; यह सुरक्षात्मक आवरण के भाव का समर्थन करता है, यद्यपि उसका व्याकरण इब्रानी पंक्ति से भिन्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: परमेश्वर का भय
  rationale: उपलब्ध इब्रानी पाठ में אֱלֹהִים ‘परमेश्वर’ है। ‘भय’ बाइबलीय मुहावरे और उसमें निहित श्रद्धामय विस्मय—दोनों को सुरक्षित रखता है; इसे केवल ‘श्रद्धा’ कर देना अर्थ को अनावश्यक रूप से नरम करता।
- source_word: כְּעֵדֶן בְּרָכָה
  choice: आशीषों से भरे अदन के समान
  rationale: इब्रानी עדן सीधे अदन का संकेत देता है और यूनानी παράδεισος इसकी वाटिका/स्वर्गोपवन की छवि की पुष्टि करता है। ‘अदन’ को बनाए रखने से मूल संकेत सुरक्षित रहता है, जबकि ‘आशीषों से भरे’ आधुनिक हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: וְעַל כָּל כָּבוֹד
  choice: हर महिमा से बढ़कर
  rationale: על को यूनानी ὑπὲρ के समर्थन से तुलनात्मक अर्थ में लिया गया है। यह हिन्दी में तुलना को स्पष्ट रखते हुए ‘महिमा’ के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: חָפְתָה
  choice: वह … छाया देता है
  rationale: क्रिया आवरण या संरक्षण की छवि व्यक्त करती है; यूनानी ἐκάλυψαν αὐτόν भी ढकने की धारणा की पुष्टि करता है। ‘छाया देता है’ हिन्दी में सुरक्षात्मक आवरण का स्वाभाविक रूप है और इब्रानी की संक्षिप्तता के कारण अस्पष्ट कर्म को जबरन नहीं जोड़ता।
theological_decisions:
- issue: मुख्य पाठ में ईश्वरीय संबोधन
  choice: परमेश्वर
  alternative: प्रभु
  rationale: यहाँ विद्यमान इब्रानी साक्ष्य אֱלֹהִים पढ़ता है, इसलिए उसी को प्राथमिकता दी गई है। यूनानी में Κυρίου ‘प्रभु’ है, पर वह इस स्थान पर सहायक समानांतर साक्ष्य है।
- issue: अंतिम उपवाक्य में संरक्षण की छवि
  choice: हर महिमा से बढ़कर छाया देता है
  alternative: हर महिमा से बढ़कर उसे ढकता है
  rationale: पंक्ति का संक्षिप्त इब्रानी वाक्य-विन्यास कठिन है। अनुवाद आवरण को संरक्षण के रूप में व्यक्त करता है, पर ऐसा स्पष्ट पुरुषवाचक कर्म नहीं जोड़ता जो दिए हुए इब्रानी पाठ में व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘परमेश्वर का भय’ पारंपरिक बाइबलीय पदबंध के रूप में रखा गया है; ‘अदन’ मूल इब्रानी छवि को सामने रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
