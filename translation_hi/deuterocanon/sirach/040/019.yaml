base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/019.yaml
  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
translation:
  language: hi
  text: पशुओं की संतान और रोपण नाम को फलाते-फूलाते हैं, पर इन दोनों से बढ़कर मनभावनी पत्नी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में इस पद का रूप भिन्न है: “सन्तान और नगर का निर्माण नाम को स्थिर करते हैं, पर दोनों से बढ़कर निष्कलंक पत्नी मानी जाती है।” उपलब्ध इब्रानी पाठ में पद 19 है: “पशुओं की संतान और रोपण नाम को फलाते-फूलाते हैं, पर इन दोनों से बढ़कर मनभावनी पत्नी है।”'
    reason: textual_variant
lexical_decisions:
- source_word: שגר
  choice: पशु-धन
  rationale: यह शब्द पशुओं की संतान या झुंड की बढ़ोतरी को सूचित करता है। सामान्य हिन्दी में ‘पशु-धन’ समृद्धि और वंश-वृद्धि, दोनों के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נטע
  choice: लगाया हुआ बाग
  rationale: נטע का मूल अर्थ लगाया गया पौधा या रोपण है; यहाँ संपत्ति और स्थायी प्रतिष्ठा के समानांतर ‘लगाया हुआ बाग’ अधिक सहज और ठोस हिन्दी है।
- source_word: יפריחו שם
  choice: नाम को फलने-फूलने देते हैं
  rationale: शाब्दिक चित्र ‘नाम को पुष्पित करना’ है। ‘नाम को फलने-फूलने देना’ उस चित्र और स्थायी प्रतिष्ठा के अर्थ, दोनों को बनाए रखता है।
- source_word: ומשניהם
  choice: पर इन दोनों से बढ़कर
  rationale: מן के तुलनात्मक प्रयोग को प्रसंग के अनुसार स्पष्ट किया गया है; यूनानी ὑπὲρ ἀμφότερα भी इसी तुलनात्मक अर्थ का समर्थन करता है।
- source_word: אשה נחשקת
  choice: मनभावनी पत्नी
  rationale: נחשקת का अर्थ चाही गई, प्रिय या वांछनीय है। वैवाहिक ज्ञान-वचन के संदर्भ में ‘मनभावनी पत्नी’ सहज है और शब्द को नैतिक निर्दोषता के अर्थ में नहीं बदलता।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच उल्लेखनीय अंतर
  choice: मुख्य पाठ में पद-संख्या (יט) के बाद सुरक्षित इब्रानी पंक्ति का अनुवाद
  alternative: 'यूनानी के अनुसार: ‘सन्तान और नगर का निर्माण नाम को स्थिर करते हैं, पर दोनों से बढ़कर निष्कलंक पत्नी मानी जाती है।’'
  rationale: दिए गए उच्च-विश्वसनीयता वाले इब्रानी पाठ में पद 19 का चिह्न שגר ונטע वाली पंक्ति से पहले है और वह पंक्ति अर्थपूर्ण है। इसलिए मुख्य पाठ उसका अनुसरण करता है। यूनानी का भिन्न पाठ महत्वपूर्ण है और पाद-टिप्पणी में पूर्ण रूप से बताया गया है, बिना दोनों पाठों को कृत्रिम रूप से मिलाए।
- issue: אשה נחשקת के नैतिक अर्थ की सीमा
  choice: ‘मनभावनी पत्नी’
  alternative: ‘निष्कलंक पत्नी’
  rationale: ‘निष्कलंक’ यूनानी ἄμωμος का अर्थ है, इब्रानी נחשקת का नहीं। मुख्य इब्रानी पाठ में इच्छा/प्रियता का भाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नाम को फलने-फूलने देना’ इब्रानी काव्य-चित्र को बनाए रखता है। इब्रानी और यूनानी साक्ष्यों को मिलाकर एक नया पाठ बनाने के बजाय मुख्य पाठ और पाद-टिप्पणी में अलग-अलग सुरक्षित रखा गया है।
