base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: hi
  text: थोड़ी ही देर के लिए, मानो क्षण-भर, वह व्यर्थ ही शांत होता है; फिर अपने हृदय के आतंक से काँप उठता है[a]—मानो कोई अपने पीछा करने वाले से भाग रहा हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ में इसके बाद कुछ पंक्ति-विभाजनों में ‘अपनी आत्मा के दर्शन से’ जैसे अतिरिक्त शब्द मिलते हैं। यूनानी समानांतर में ‘नींद में, पहरे के दिन के समान’ कहकर विचार का विस्तार किया गया है। मुख्य अनुवाद दोनों परंपराओं के सबसे स्पष्ट साझा भाव का अनुसरण करता है: विश्राम थोड़ी देर का है और भीतर का आतंक शीघ्र लौट आता है।'
    reason: alternative_reading
  - marker: b
    text: पद का उत्तरार्ध इब्रानी में कठिन है। काहाना द्वारा संपादित काहिरा गनीज़ा पाठ सोनेवाले की तुलना पीछा करने वाले से भाग रहे व्यक्ति से करता है; यूनानी समानांतर में इसी प्रकार ‘मानो युद्ध के सामने से बच निकला हो’ है।
    reason: textual_variant
lexical_decisions:
- source_word: מעט
  choice: थोड़ी ही देर के लिए
  rationale: यहाँ מעט समय की अल्पता बताता है; ‘ही’ विश्राम की अत्यंत छोटी अवधि पर स्वाभाविक हिन्दी में बल देता है।
- source_word: לריק
  choice: व्यर्थ ही
  rationale: यह संक्षिप्त शांति निष्फल है और वास्तविक राहत नहीं देती; ‘व्यर्थ ही’ इस अर्थ को सहज रूप में व्यक्त करता है।
- source_word: כרגע
  choice: मानो एक क्षण भर
  rationale: כ की तुलनात्मक शक्ति और רגע की क्षणिकता दोनों को बनाए रखता है।
- source_word: ישקוט
  choice: वह ... शांत होता है
  rationale: क्रिया शांति अथवा विश्राम की दशा बताती है; ‘शांत होता है’ निकटार्थी और आधुनिक हिन्दी है।
- source_word: בהלות לבו
  choice: अपने हृदय के आतंक
  rationale: בהלות अचानक भय अथवा आतंक का बोध कराता है और לבו उसका भीतरी स्रोत बताता है।
- source_word: נרעש
  choice: काँप उठता है
  rationale: यह रूप तीव्र विचलन या थरथराहट व्यक्त करता है; ‘काँप उठता है’ मानसिक और शारीरिक दोनों प्रतिक्रिया समेटता है।
- source_word: כשריד בורח מפני רודף
  choice: मानो कोई पीछा करनेवाले के सामने से भाग रहा हो
  rationale: पाठ कठिन है, पर पीछा किए जा रहे व्यक्ति की आतंकित उड़ान का मुख्य चित्र स्पष्ट है; अनिश्चित ‘शेष बचे व्यक्ति’ के अर्थ को मुख्य पाठ में थोपे बिना उपमा सुरक्षित रखी गई है।
