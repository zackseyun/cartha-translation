base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/028.yaml
  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
translation:
  language: hi
  text: मेरे बच्चे[a], भीख पर निर्भर जीवन[b] मत जीना; भीख माँगने से मर जाना[c] अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे बच्चे” यूनानी पाठ में है; उपलब्ध इब्रानी पंक्ति में यह संबोधन नहीं मिलता।
    reason: textual_variant
  - marker: b
    text: यहाँ का इब्रानी पद מכי מתן कठिन है। यूनानी समानांतर इसका आशय भीख माँगकर या दान पर निर्भर होकर जीना बताता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में यहाँ शाब्दिक रूप से “इकट्ठा किया जाना” है, जो मृत्यु के लिए प्रयुक्त मुहावरा है। पंक्ति का अंतिम इब्रानी शब्द भी अस्पष्ट है; यूनानी पाठ अर्थ को स्पष्ट करता है: “भीख माँगने से मर जाना अच्छा है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: חיי
  choice: जीवन
  rationale: यह रचना-रूप किसी विशेष ढंग या दशा में जीने को दर्शाता है; हिन्दी में ‘जीवन’ स्वाभाविक है।
- source_word: מכי מתן
  choice: भीख पर निर्भर
  rationale: इब्रानी पद कठिन और अनिश्चित है। यूनानी समानांतर में ἐπαίτησις ‘भीख माँगना/भिक्षावृत्ति’ है; ‘भीख पर निर्भर’ उस आशय को व्यक्ति की स्थायी पहचान बनाने के बजाय जीवन की दशा के रूप में व्यक्त करता है।
- source_word: אל תחי
  choice: मत जीना
  rationale: חיה के निषेधात्मक आदेश का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: טוב
  choice: अच्छा है
  rationale: यहाँ तुलनात्मक अर्थ है, जिसकी पुष्टि यूनानी κρεῖσσον करता है; हिन्दी वाक्य में ‘से ... अच्छा है’ वही तुलना स्पष्ट करता है।
- source_word: נאסף
  choice: मर जाना
  rationale: शाब्दिक अर्थ ‘इकट्ठा किया जाना’ है, पर इब्रानी में यह मृत्यु का मुहावरा है; यूनानी ἀποθανεῖν भी अर्थ को स्पष्ट रूप से ‘मरना’ बताता है।
- source_word: כמסתולל
  choice: भीख माँगने से
  rationale: इब्रानी रूप अस्पष्ट है, किंतु यूनानी ἐπαιτεῖν स्पष्ट रूप से ‘भीख माँगना’ देता है। तुलनात्मक संरचना के लिए हिन्दी में ‘से’ स्वाभाविक है।
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: यूनानी में संबोधन है, यद्यपि उपलब्ध इब्रानी पंक्ति में नहीं। ‘मेरे बच्चे’ ज्ञान-साहित्य के आत्मीय उपदेशात्मक स्वर को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: भीख माँगने और मृत्यु के बीच कठोर तुलना
  choice: तुलना को बिना नरम किए रखा गया
  alternative: इसे केवल गरीबी से सावधान करने वाले सामान्य कथन के रूप में ढालना
  rationale: इब्रानी और यूनानी दोनों में कथन जानबूझकर तीखा है। अनुवाद उसका नैतिक या धर्मवैज्ञानिक तनाव शांत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय किंतु गरिमापूर्ण उपदेशात्मक शैली रखी गई है। ‘भिखारी का जीवन’ के बजाय ‘भीख पर निर्भर जीवन’ चुना गया, ताकि मूल का जीवन-दशा वाला आशय स्वाभाविक ढंग से आए और अनावश्यक रूप से व्यक्ति पर स्थायी लेबल न लगे।
