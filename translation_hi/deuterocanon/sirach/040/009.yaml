translation:
  language: hi
  text: महामारी और रक्तपात, कलह और तलवार, विनाश और बरबादी, विपत्ति और मृत्यु।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דבר
  choice: महामारी
  rationale: यहाँ संज्ञाओं की विपत्तियों वाली सूची में ‘महामारी’ स्वाभाविक और सटीक अर्थ देता है।
- source_word: דם
  choice: रक्तपात
  rationale: शाब्दिक अर्थ ‘खून’ है, पर विपत्तियों की सूची में हिंसक रक्तपात अभिप्रेत है; हिन्दी में ‘रक्तपात’ इसे संक्षेप में व्यक्त करता है।
- source_word: חרחר
  choice: कलह
  rationale: इस दुर्लभ रूप को यूनानी समानांतर ἔρις (‘झगड़ा/कलह’) का समर्थन प्राप्त है; ‘कलह’ प्रसंग और युग्मबद्ध शैली के अनुकूल है।
- source_word: חרב
  choice: तलवार
  rationale: प्रत्यक्ष और पारंपरिक अर्थ को बनाए रखा गया है।
- source_word: שד
  choice: विनाश
  rationale: लूट से उत्पन्न उजाड़ अथवा विध्वंस का भाव; सूची में ‘विनाश’ सहज है।
- source_word: שבר
  choice: बरबादी
  rationale: टूटन, ध्वंस या विपत्ति का अर्थ; שד के साथ निकटार्थी युग्म को स्वाभाविक हिन्दी में रखा गया है।
- source_word: רעה
  choice: विपत्ति
  rationale: यह शब्द ‘बुराई’ या ‘दुर्दशा/विपत्ति’ दोनों अर्थ दे सकता है; विपत्तियों की इस सूची में ‘विपत्ति’ अधिक संदर्भसंगत है।
- source_word: מות
  choice: मृत्यु
  rationale: मूल का सीधा अर्थ।
theological_decisions:
- issue: רעה का नैतिक या आपदात्मक अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: आसपास के सभी पद रोग, हिंसा, विध्वंस और मृत्यु जैसी मानव-दुर्दशाओं को गिनाते हैं; इसलिए यहाँ नैतिक ‘बुराई’ के बजाय आपदात्मक ‘विपत्ति’ चुनी गई, जबकि शब्द की व्यापक अर्थ-संभावना को निर्णय में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक सूची-रचना रखी गई है। चार समांतर युग्मों और मूल के क्रम को सुरक्षित रखा गया है।
