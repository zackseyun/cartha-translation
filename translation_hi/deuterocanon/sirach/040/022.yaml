  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
translation:
  language: hi
  text: 'सुंदरता और रूप[a] आँख को भाते हैं,

    पर उन दोनों से बढ़कर खेत की हरियाली[b] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रूप/आकृति’ है; यूनानी समानांतर में ‘लावण्य’ है। इसलिए आरंभिक पदबंध का अनुवाद ‘लावण्य और सुंदरता आँख को भाते हैं’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक अर्थ ‘खेत के अंकुर/उगती वनस्पतियाँ’ है। यूनानी समानांतर ‘बीज या फसल की हरी बढ़वार’ कहता है, जिससे कटे हुए उत्पाद के बजाय खेत की ताज़ी हरियाली का भाव पुष्ट होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  choice: सुंदरता
  rationale: यह संज्ञा सुंदरता या आकर्षकता को व्यक्त करती है; आधुनिक हिन्दी में ‘सुंदरता’ इसका स्वाभाविक और स्पष्ट पर्याय है।
- source_word: ותאר
  choice: रूप-सौष्ठव
  rationale: इब्रानी תאר का मूल अर्थ रूप, आकृति या बाहरी स्वरूप है। ‘रूप-सौष्ठव’ आकर्षक गठन और रूप दोनों को व्यक्त करता है; यूनानी समानांतर का ‘लावण्य’ वाला भाव पादटिप्पणी में रखा गया है।
- source_word: יחמידו עין
  choice: आँख को भाते हैं
  rationale: חמד चाहने, वांछनीय लगने या आनंद देने का भाव रखता है। ‘आँख को भाते हैं’ दृश्य आकर्षण को सहज हिन्दी में व्यक्त करता है, बिना इसे अनुचित लालसा का अर्थ दिए।
- source_word: ומשניהם
  choice: पर उन दोनों से बढ़कर
  rationale: इब्रानी पदबंध में दोनों की तुलना का भाव है, जिसे यूनानी ὑπὲρ ἀμφότερα स्पष्ट रूप से पुष्ट करता है। ‘से बढ़कर’ इस तुलनात्मक बल को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: צמחי שדה
  choice: खेत की हरियाली
  rationale: צמחי खेत में उगने वाले अंकुरों, पौधों या वनस्पति-वृद्धि को दर्शाता है। यूनानी χλόην σπόρου ताज़ी हरी फसल या अंकुरित बढ़वार की पुष्टि करता है; ‘खेत की हरियाली’ कटे हुए उत्पाद के बजाय उसी जीवंत दृश्य को व्यक्त करती है।
