base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/020.yaml
  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: hi
  text: दाखमधु और मदिरा मन को आनन्दित करते हैं, पर दोनों से बढ़कर प्रेमियों का प्रेम है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יין
  choice: दाखमधु
  rationale: यह सामान्यतः अंगूर से बनी मदिरा को सूचित करता है; ‘दाखमधु’ आधुनिक हिन्दी में काव्यात्मक-गरिमामय और स्पष्ट है।
- source_word: ושכר
  choice: और मदिरा
  rationale: שכר नशीले पेय, प्रायः अधिक मादक पेय, को दर्शाता है। ‘मदिरा’ यहाँ पहले शब्द से यथासंभव भेद रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יעליצו לב
  choice: मन को आनन्दित करते हैं
  rationale: हिब्रू बहुवचन क्रिया और לב के भाव-केंद्र अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אהבת דודים
  choice: प्रेमियों का प्रेम
  rationale: דודים का अर्थ प्रेमी/प्रियजन अथवा प्रेम-संबंधी स्नेह हो सकता है। यह चयन हिब्रू की मानवीय और संभवतः रूमानी अभिव्यक्ति को बिना यूनानी पाठ के ‘बुद्धि-प्रेम’ से बदलने के सुरक्षित रखता है।
theological_decisions:
- issue: हिब्रू और यूनानी समानांतर पाठ में अंतिम पदबंध का अंतर
  choice: हिब्रू के ‘प्रेमियों का प्रेम’ का अनुसरण
  alternative: यूनानी के अनुसार ‘बुद्धि से प्रेम’
  rationale: दिए गए हिब्रू स्रोत की विश्वसनीयता उच्च है और वह लक्ष्य मूल-पाठ है; यूनानी यहाँ स्पष्ट रूप से अलग पाठ-परंपरा का साक्ष्य देता है, इसलिए उसे मुख्य पाठ में मिलाकर तनाव को समाप्त नहीं किया गया।
- issue: मदिरा के उल्लेख का नैतिक स्वर
  choice: वचन के तुलनात्मक कथन को सीधे प्रस्तुत किया
  alternative: मदिरापान के पक्ष या विरोध में व्याख्यात्मक शब्द जोड़ना
  rationale: मूल पंक्ति आनन्द और प्रेम की तुलना करती है; उसमें कोई अतिरिक्त नैतिक निषेध या अनुमोदन जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर संरचना और ‘दोनों से बढ़कर’ की तुलनात्मक शक्ति सुरक्षित है। ‘प्रेमियों का प्रेम’ जानबूझकर मूल की अर्थगत खुलावट बनाए रखता है।
