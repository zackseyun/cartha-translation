base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/008.yaml
  text: And with all flesh their anxiety is with them[a], and their wealth drives away their sleep.
translation:
  language: hi
  text: और सब प्राणियों की चिंता उनके साथ रहती है[a], और उनकी धन-संपत्ति उनकी नींद उड़ा देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “सब प्राणियों के साथ, मनुष्य से पशु तक; और पापियों पर, इनकी अपेक्षा सात गुना अधिक।” यहाँ प्रयुक्त उपलब्ध इब्रानी पंक्ति में यह विस्तृत शब्दावली नहीं है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: और सब प्राणियों के साथ
  rationale: בשר सामूहिक अर्थ में देहधारी जीवों को सूचित करता है। यूनानी समानांतर मनुष्य से पशु तक का विस्तार देकर इस व्यापक अर्थ की पुष्टि करता है; आधुनिक हिन्दी में ‘सब प्राणी’ स्वाभाविक और स्पष्ट है।
- source_word: דאגתם עמם
  choice: उनकी चिंता लगी रहती है
  rationale: דאגה व्याकुल चिंता है और עמם का मूल भाव ‘उनके साथ’ है। ‘लगी रहती है’ चिंता के निरंतर साथ रहने की छवि को सहज हिन्दी में बनाए रखता है।
- source_word: ועשרם
  choice: और उनकी धन-संपत्ति
  rationale: עשר का अर्थ धन या समृद्धि है। ‘धन-संपत्ति’ possessions और wealth के ठोस अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מניד שנתם
  choice: उनकी नींद उड़ा देती है
  rationale: यह पद नींद को हटा देने या विचलित करने का चित्र देता है। ‘नींद उड़ा देना’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और मूल की सजीवता को बनाए रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और अधिक विस्तृत यूनानी समानांतर के बीच पाठांतर
  choice: मुख्य पाठ उपलब्ध इब्रानी पंक्ति पर आधारित है; यूनानी विस्तार पादटिप्पणी में रखा गया है।
  alternative: मुख्य पाठ में ‘मनुष्य से पशु तक, और पापियों पर इनसे सात गुना अधिक’ जोड़ना।
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिक आधार माना गया है। यूनानी पाठ महत्वपूर्ण साक्षी है, पर उसका अतिरिक्त खंड इस इब्रानी पंक्ति में नहीं मिलता; अतः उसे मुख्य पाठ में मिलाए बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब प्राणी’ शाब्दिक ‘सब शरीर’ की अपेक्षा सामूहिक अर्थ को स्वाभाविक हिन्दी में देता है; ‘नींद उड़ा देती है’ मूल बिंब की तीव्रता बनाए रखता है।
