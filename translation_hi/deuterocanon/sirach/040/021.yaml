  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: hi
  text: बाँसुरी और वीणा गीत को मधुर बनाती हैं, पर उन दोनों से बढ़कर है निर्मल वाणी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “उन दोनों से बढ़कर मधुर वाणी है,” या “मनभावनी बात।”'
    reason: इब्रानी ‘निर्मल वाणी’ और यूनानी ‘मधुर/मनभावनी वाणी’ के बीच अर्थभेद को सुरक्षित रखना।
lexical_decisions:
- source_word: חליל
  choice: बाँसुरी
  rationale: यह इब्रानी शब्द फूँककर बजाए जाने वाले वाद्य को दर्शाता है। आधुनिक हिन्दी में ‘बाँसुरी’ इसका सबसे सहज और स्पष्ट समतुल्य है; यूनानी αὐλός भी वायु-वाद्य की पुष्टि करता है।
- source_word: נבל
  choice: वीणा
  rationale: यह तार वाला झंकारकर बजाया जाने वाला वाद्य है। ‘वीणा’ हिन्दी पाठकों के लिए स्वाभाविक बाइबिलीय वाद्य-नाम है और यूनानी ψαλτήριον से भी मेल खाता है।
- source_word: יעריבו
  choice: मधुर बनाती हैं
  rationale: ערב का भाव सुखद या मधुर बनाने का है। यह अनुवाद क्रिया के कारक अर्थ को बनाए रखता है।
- source_word: שיר
  choice: गीत
  rationale: शब्द का सीधा अर्थ गीत या गायन है; यहाँ वाद्यों के साथ ‘गीत’ स्वाभाविक है।
- source_word: ומשניהם
  choice: पर उन दोनों से बढ़कर
  rationale: शाब्दिक भाव ‘उन दोनों से परे/अधिक’ है। ‘बढ़कर’ तुलना और मूल्यांकन को स्पष्ट रखते हुए किसी अनावश्यक व्याख्या को नहीं जोड़ता।
- source_word: לשון
  choice: वाणी
  rationale: शाब्दिक अर्थ ‘जीभ’ है, पर यहाँ यह वाणी या बोलने की क्षमता का लाक्षणिक संकेत है। आधुनिक हिन्दी में ‘निर्मल वाणी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ברה
  choice: निर्मल
  rationale: इब्रानी विशेषण का अर्थ शुद्ध, स्वच्छ या निर्मल है। ‘निर्मल’ उसकी नैतिक और गुणात्मक धार को बनाए रखता है; यूनानी का ‘मधुर/मनभावनी’ पाठ फुटनोट में दिया गया है।
theological_decisions:
- issue: अंतिम पदबंध में इब्रानी और यूनानी का अर्थभेद
  choice: निर्मल वाणी
  alternative: मधुर वाणी / मनभावनी बात
  rationale: उपलब्ध इब्रानी לשון ברה को प्राथमिक मानते हुए ‘निर्मल वाणी’ चुना गया है। यूनानी γλῶσσα ἡδεῖα ‘मधुर/मनभावनी वाणी’ कहता है; यह सार्थक वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘वाणी’ लाक्षणिक ‘जीभ’ की अपेक्षा अधिक स्वाभाविक है, जबकि मूल भाव बना रहता है।
