  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: hi
  text: हर उपहार[b] और हर अन्याय मिटा दिया जाएगा, पर विश्वास[a] सदा स्थिर रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्यता सदा स्थिर रहेगी।” यूनानी शब्द का अर्थ “विश्वास” या “विश्वासयोग्यता” दोनों हो सकता है; मुख्य पाठ में πίστις का परियोजना-निर्धारित सामान्य अनुवाद दिया गया है।
    reason: alternative_reading
  - marker: b
    text: मसादा से प्राप्त पुराने इब्रानी साक्ष्य में संभवतः यहाँ “उपहार” के बजाय “ऋण” से संबंधित पाठ है। मुख्य पाठ निर्धारित यूनानी पाठ के δῶρον (“उपहार”) का अनुसरण करता है, पर इब्रानी साक्ष्य एक प्राचीन पाठांतर की ओर संकेत करता है।
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: हर
  rationale: एकवचन संज्ञाओं के साथ इसका वितरणात्मक अर्थ है; इसलिए दोनों पदों के साथ ‘हर’ दोहराना हिन्दी में आशय स्पष्ट करता है।
- source_word: δῶρον
  choice: उपहार
  rationale: यूनानी शब्द का सामान्य अर्थ ‘उपहार’ है। ‘घूस’ कहना प्रसंग से अधिक अर्थ जोड़ता, जबकि ‘भेंट’ धार्मिक चढ़ावे का अनावश्यक संकेत दे सकती है।
- source_word: ἀδικία
  choice: अन्याय
  rationale: यह शब्द नैतिक और सामाजिक गलतता को व्यक्त करता है; ‘अन्याय’ उस व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξαλειφθήσεται
  choice: मिटा दिया जाएगा
  rationale: यह मिटाने या लोप कर देने की छवि को सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πίστις
  choice: विश्वास
  rationale: मुख्य पाठ में परियोजना का निर्धारित सामान्य अनुवाद रखा गया है; इस प्रसंग में ‘विश्वासयोग्यता’ भी संभव है, जिसे पादटिप्पणी में दिया गया है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह यूनानी मुहावरे की चिरस्थायित्व की धारणा को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: στήσεται
  choice: स्थिर रहेगा
  rationale: यह ‘खड़े रहने’ की दृढ़ता और टिके रहने—दोनों भावों को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: πίστις विश्वास या विश्वासयोग्यता दोनों को सूचित कर सकता है। मुख्य पाठ में निर्धारित सामान्य रूप ‘विश्वास’ रखा गया है, पर प्रसंगानुकूल वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। विरोध को स्पष्ट करने के लिए यूनानी καί को दूसरे खंड में ‘पर’ से व्यक्त किया गया है।
