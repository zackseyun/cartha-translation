  terminology: “पगड़ी,” “मुकुट,” and “ओढ़े” are suitable. “खाल का वस्त्र” better preserves the source’s noncommittal עור imagery than “चमड़े का वस्त्र.” The variant note accurately reflects the Greek-Hebrew divergence; its anchor is moved to the first clothing description, where the divergence begins.
