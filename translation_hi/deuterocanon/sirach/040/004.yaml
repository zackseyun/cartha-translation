translation:
  language: hi
  text: छोटी पगड़ी और फूलों का मुकुट पहनने हुए व्यक्ति से लेकर खाल का वस्त्र ओढ़े हुए व्यक्ति तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “नील-बैंगनी वस्त्र और मुकुट पहनने वाले से लेकर मोटे सन का वस्त्र पहने हुए व्यक्ति तक।” इब्रानी और यूनानी साक्ष्यों में वस्त्रों का विशेष चित्रण अलग है, पर दोनों सामाजिक स्तरों की वही व्यापकता व्यक्त करते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: מעוטה צניף
  choice: छोटी पगड़ी
  rationale: מעוטה को צניף के साथ विशेषणात्मक रूप में लेकर सिर पर लपेटे जाने वाले छोटे या साधारण आवरण का अर्थ दिया गया है। आधुनिक हिन्दी में ‘पगड़ी’ संक्षिप्त और स्वाभाविक है।
- source_word: וציץ
  choice: और फूलों वाला मुकुट
  rationale: ציץ का अर्थ फूल/खिला हुआ अलंकार और विस्तार से मस्तक का आभूषण या मुकुट हो सकता है। यूनानी στέφανον भी मुकुट/माला का समर्थन करता है; यह अनुवाद दोनों संकेतों को बनाए रखता है।
- source_word: ועד
  choice: से लेकर … तक
  rationale: यह सामाजिक या भौतिक विस्तार की दूसरी सीमा बताता है। पिछले पद से जुड़ी संरचना को हिन्दी में स्वाभाविक बनाने के लिए ‘से लेकर … तक’ प्रयोग किया गया है।
- source_word: עוטה
  choice: ओढ़े
  rationale: यह कृदन्त किसी वस्त्र से ढके या लिपटे होने को दर्शाता है। ‘ओढ़े’ हिन्दी में वस्त्र के साथ सहज और चित्रात्मक है।
- source_word: שמלת עור
  choice: चमड़े का वस्त्र
  rationale: शाब्दिक अर्थ ‘खाल/चमड़े का वस्त्र’ है। ‘चमड़े का वस्त्र’ सामान्य पाठक के लिए स्वाभाविक है और यह तय नहीं करता कि वह कच्ची खाल थी या विशेष प्रकार से तैयार चमड़ा।
