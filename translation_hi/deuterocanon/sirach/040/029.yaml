base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: hi
  text: जो मनुष्य दूसरे की मेज़ की ओर ताकता रहता है, उसका जीवन जीवन कहलाने योग्य नहीं है[a]। वह दूसरे के स्वादिष्ट भोजन से अपने को दूषित करता है; पर जो मनुष्य अपने भीतर के संयम को समझता है, वह सावधान रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘दूसरे की मेज़’ है; यूनानी में भी ‘किसी दूसरे की मेज़’ है। आशय किसी अन्य व्यक्ति के भोजन पर निर्भर रहने से है, अनिवार्य रूप से किसी विदेशी जाति से नहीं।
    reason: lexical_alternative
  - marker: b
    text: अंतिम पंक्ति का इब्रानी कठिन है; उसका शाब्दिक रूप लगभग ‘अंतर्भागों का भेद जानने वाला मनुष्य’ है। यूनानी इसे ‘ज्ञानी और शिक्षित मनुष्य अपने को बचाए रखेगा’ के अर्थ में समझता है। इसलिए अनुवाद में भीतरी अनुशासन और विवेकपूर्ण सावधानी का भाव लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח
  choice: जो मनुष्य ... की ओर ताकता रहता है
  rationale: इब्रानी में पुल्लिंग एकवचन प्रतिनिधि व्यक्ति के रूप में है। कृदंत משגיח लगातार या आशाभरी दृष्टि से देखने का चित्र देता है; इसलिए ‘ताकता रहता है’ निर्भरता का निहित भाव भी बनाए रखता है।
- source_word: שלחן זר
  choice: दूसरे की मेज़
  rationale: זר का अर्थ यहाँ ‘किसी दूसरे का’ है, न कि अनिवार्य रूप से किसी विदेशी जाति का। यूनानी ἀλλοτρίαν भी दूसरे के स्वामित्व वाली मेज़ का समर्थन करता है।
- source_word: אין חייו למנות חיים
  choice: उसका जीवन जीवन में गिने जाने योग्य नहीं है
  rationale: यह अपेक्षाकृत औपचारिक अभिव्यक्ति इब्रानी में ‘जीवन’ की पुनरुक्ति और उसके तीखे मूल्यांकन—दोनों को सुरक्षित रखती है।
- source_word: מעוג לנפש מטעמו
  choice: वह दूसरे के स्वादिष्ट भोजन से अपनी भूख को अशुद्ध करता है
  rationale: इब्रानी कठिन है। भोजन के प्रसंग में נפש को ‘भूख’ कहना स्वाभाविक है; यूनानी समानांतर में दूसरे के व्यंजनों से अपने प्राण/स्वयं को दूषित करने का भाव है। ‘स्वादिष्ट भोजन’ מטעמו और यूनानी ἐδέσμασιν के भोज्य-पदार्थों के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לאיש יודע סוד מעים
  choice: जो मनुष्य अपने भीतर के संयम को समझता है, वह सावधान रहेगा
  rationale: इब्रानी का शाब्दिक चित्र ‘अंतर्भागों का भेद जानने वाला मनुष्य’ अस्पष्ट है। ‘अपने भीतर का संयम’ शरीर के भीतरी चित्र को आंशिक रूप से बनाए रखते हुए आत्म-संयम का प्रसंगगत अर्थ देता है; ‘सावधान रहेगा’ के लिए यूनानी φυλάξεται स्पष्ट सहारा देता है।
theological_decisions:
- issue: निर्भरता, अशुद्धता और आत्म-संयम के संबंध को कितना स्पष्ट किया जाए
  choice: पद के नैतिक विरोध को रखा गया, पर ‘अशुद्ध’ को धार्मिक/अनुष्ठानिक अशुद्धता के रूप में नहीं समझाया गया।
  alternative: इसे सीधे आत्मिक पाप या अनुष्ठानिक अशुद्धता कहना।
  rationale: इब्रानी और यूनानी यहाँ दूसरे के भोजन पर अपमानजनक निर्भरता और विवेकी आत्म-संयम का विरोध रखते हैं; कोई विशिष्ट अनुष्ठानिक या सांप्रदायिक अर्थ आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘मेज़ की ओर ताकता रहता है’ सामान्य पाठक के लिए स्पष्ट है और मूल चित्र को बनाए रखता है। ‘जीवन जीवन में गिने जाने योग्य नहीं’ जानबूझकर कुछ औपचारिक है ताकि इब्रानी की शब्द-पुनरुक्ति न मिटे।
