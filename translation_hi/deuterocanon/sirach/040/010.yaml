base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/010.yaml
  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: hi
  text: दुष्ट के लिए बुराई रची गई, और उसी के कारण विनाश समाप्त हो जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में अंतिम खंड है: “और उन्हीं के कारण जलप्रलय आया।” यह उपलब्ध हिब्रू के अंतिम खंड से काफी अलग पाठ दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: दुष्ट के लिए
  rationale: על संबंध, उद्देश्य या विरोध का भाव दे सकता है—‘के लिए’, ‘पर’ या ‘के विरुद्ध’। यहाँ ‘दुष्ट के लिए’ हिब्रू की व्यापकता बनाए रखता है। एकवचन רשע को सामान्य या सामूहिक अर्थ में ‘दुष्ट’ रखा गया है।
- source_word: נבראה רעה
  choice: बुराई रची गई
  rationale: רעה नैतिक बुराई और विपत्ति—दोनों का बोध करा सकता है। ‘बुराई’ अधिक व्यापक और औपचारिक रूप से निकट है; ‘विपत्ति’ संभव है, पर अर्थ को केवल दंडात्मक आपदा तक सीमित कर देती है।
- source_word: ובעבור
  choice: और उसी के कारण
  rationale: בעבור का सामान्य अर्थ ‘के कारण/के चलते’ है। हिब्रू वाक्य संक्षिप्त है; ‘उसी’ पहले आए ‘दुष्ट’ की ओर संकेत को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: תמוש כלה
  choice: विनाश समाप्त हो जाएगा
  rationale: מוש का अर्थ हटना, दूर होना या समाप्त होना हो सकता है, और כלה यहाँ ‘अंत/विनाश’ के रूप में समझा गया है। यह अनुवाद कठिन एवं संक्षिप्त हिब्रू को बिना ‘केवल पूरा होने पर’ जैसी अतिरिक्त धारणा जोड़े स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: רעה को नैतिक ‘बुराई’ या दंडात्मक ‘विपत्ति’ के रूप में प्रस्तुत करना
  choice: बुराई
  alternative: विपत्ति / आपदा
  rationale: हिब्रू शब्द जानबूझकर व्यापक है। ‘बुराई’ उस अर्थगत तनाव को बनाए रखती है, जबकि ‘विपत्ति’ उसे केवल भोगी जाने वाली आपदा तक सीमित कर सकती है।
- issue: हिब्रू की अंतिम उपवाक्य और यूनानी पाठ में जलप्रलय के उल्लेख के बीच अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू का अनुवाद; यूनानी पाठांतर पादटिप्पणी में
  alternative: और उन्हीं के कारण जलप्रलय आया
  rationale: जहाँ हिब्रू उपलब्ध है वहाँ उसी को प्राथमिकता दी गई है। यूनानी समानांतर का अंतिम खंड भौतिक रूप से अलग पाठ प्रस्तुत करता है, इसलिए उसे छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘रची गई’ सृष्टि-संबंधी क्रिया को बनाए रखता है; कठिन अंतिम खंड को अनावश्यक व्याख्यात्मक विस्तार के बिना प्रस्तुत किया गया है।
