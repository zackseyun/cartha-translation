translation:
  language: hi
  text: निर्लज्ज मनुष्य को[a] भीख माँगना[b] मीठा लगता है, पर यही उसके भीतर आग की तरह जलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ लगभग ‘दृढ़/प्रबल प्राणवाले मनुष्य को’ है; यूनानी समानांतर पाठ में ‘निर्लज्ज व्यक्ति के मुँह में’ है, जो यहाँ ‘निर्लज्ज मनुष्य’ अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या ‘माँगना’ अथवा ‘याचना करना’। यूनानी समानांतर पाठ अधिक विशेष रूप से भीख माँगने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: निर्लज्ज मनुष्य को
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ लगभग ‘दृढ़/प्रबल प्राणवाले मनुष्य को’ हो सकता है, पर यहाँ उसका आशय स्पष्ट नहीं है। यूनानी समानांतर पाठ ἀναιδοῦς (‘निर्लज्ज व्यक्ति’) इस संदर्भ में ढिठाई या निर्लज्जता का नकारात्मक भाव पुष्ट करता है।
- source_word: תמתיק שאלה
  choice: भीख माँगना मीठा लगता है
  rationale: שאלה का सामान्य अर्थ ‘माँगना/याचना’ है; यूनानी ἐπαίτησις इसे विशेष रूप से भीख माँगने के अर्थ में स्पष्ट करता है। ‘मीठा लगता है’ इब्रानी मिठास के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ובקרבו
  choice: पर उसके भीतर
  rationale: קרב भीतरी अंगों अथवा अंतर्मन को सूचित कर सकता है। ‘उसके भीतर’ शारीरिक और आंतरिक दोनों संकेतों को खुला रखता है; प्रसंगगत विरोध के कारण संयोजक ו को ‘पर’ कहा गया है।
- source_word: תבער כמו אש
  choice: वह आग की तरह जलता है
  rationale: स्त्रीलिंग क्रिया का संकेत संभवतः माँगने/भीख माँगने की दशा या क्रिया की ओर है। हिन्दी में ‘वह’ इस संदर्भ को बनाए रखता है और उपमा को बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
theological_decisions:
- issue: לאיש עוז נפש के कठिन इब्रानी पदबंध की व्याख्या
  choice: नैतिक निर्लज्जता या ढिठाई
  alternative: दृढ़ मनुष्य; प्रबल आत्मावाला मनुष्य
  rationale: इब्रानी को अलग से देखने पर सकारात्मक दृढ़ता का अर्थ संभव है, किंतु यूनानी समानांतर पाठ स्पष्ट रूप से ‘निर्लज्ज व्यक्ति’ कहता है और कहावत के नकारात्मक संदर्भ से मेल खाता है। इब्रानी की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मीठा लगता है’ और ‘आग की तरह जलता है’ मूल के तीखे विरोध और रूपक को बनाए रखते हैं; कठिन इब्रानी पाठ को मुख्य अनुवाद में यूनानी समानांतर के सहारे प्रस्तुत कर वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
