  yaml_path: translation/deuterocanon/sirach/040/013.yaml
  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: hi
  text: बल से बल की ओर[a], सदानीरा नाले के समान, और प्रचण्ड जलधारा के पाट से, ध्वनियों के प्रचण्ड निनाद के साथ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “अन्यायियों का धन नदी के समान सूख जाएगा, और वर्षा में बड़ी गर्जना के समान गूँजेगा।” यह उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ-रूप को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: इस पंक्ति का इब्रानी पाठ कठिन है, और इस पद का मसादा-खंड इतना अधूरा है कि शब्दों का ठीक रूप निश्चित नहीं किया जा सकता। अनुवाद काहिरा गनीज़ा के इब्रानी पाठ का अनुसरण करता है और यूनानी समानांतर पाठ को भी ध्यान में रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: מחיל אל חיל
  choice: बल से बल की ओर
  rationale: חיל का अर्थ बल, सामर्थ्य, धन या सेना हो सकता है। वर्तमान इब्रानी पाठ की जलधारा-संबंधी उपमाओं के बीच ‘बल से बल की ओर’ उमड़ती हुई शक्ति का भाव रखता है और पाठ की संक्षिप्त, कुछ कठिन अभिव्यक्ति को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: נחל איתן
  choice: सदानीरा नाला
  rationale: נחל प्रायः वादी, बरसाती नाला या जलधारा के पाट को सूचित करता है, जबकि איתן यहाँ स्थायी या निरंतर बहने का भाव देता है। ‘सदानीरा नाला’ इब्रानी भू-दृश्य और स्थायी प्रवाह—दोनों को संक्षेप में व्यक्त करता है।
- source_word: אפיק אדיר
  choice: प्रचण्ड जल-पाट
  rationale: אפיק का अर्थ जलधारा का पाट, नाला या घाटी हो सकता है और אדיר का अर्थ प्रबल या प्रचण्ड है। ‘जल-पाट’ ठोस स्थलाकृतिक बिंब को बनाए रखता है।
- source_word: בחזיז קולות
  choice: ध्वनियों की गड़गड़ाहट के साथ
  rationale: यह दुर्लभ और कठिन पदबंध है। קולות ध्वनियाँ, आवाज़ें या गर्जन सूचित कर सकता है। चुना हुआ रूप श्रव्य प्रचण्डता को व्यक्त करता है, पर इब्रानी से अधिक निश्चित रूप से ‘बिजली’ या ‘गरज’ नहीं जोड़ता।
