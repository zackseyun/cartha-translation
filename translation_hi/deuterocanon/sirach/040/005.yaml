base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: hi
  text: फिर भी ईर्ष्या, चिंता और भय, और मृत्यु का आतंक बहुत कलह भड़काते हैं[a]; और जब वह अपने बिछौने पर विश्राम करता है, तब रात की नींद उसकी दुर्दशा बदल देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बहुत कलह भड़काते हैं’ वाला इब्रानी वाक्यांश संक्षिप्त और कुछ अनिश्चित है। यूनानी समानांतर में क्रोध और कलह जैसी अतिरिक्त व्याकुलताओं का अधिक स्पष्ट उल्लेख है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसका संकट बदल देती है।’ यहाँ इब्रानी शब्द का आशय संभवतः नैतिक बुराई नहीं, बल्कि पीड़ित व्यक्ति की दुःखपूर्ण दशा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קנאה
  choice: ईर्ष्या
  rationale: यहाँ चिंता और भय के साथ एक पीड़ादायक मनोभाव का वर्णन है; इसलिए नकारात्मक अर्थ ‘ईर्ष्या’ उपयुक्त है।
- source_word: דאגה
  choice: चिंता
  rationale: यह शब्द व्याकुल करने वाली चिंता को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: פחד
  choice: भय
  rationale: यह मूल इब्रानी का सीधा और गरिमापूर्ण अनुवाद है, जो तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: אימת מות
  choice: मृत्यु का आतंक
  rationale: אימה की तीव्रता को रखते हुए यह पदबंध आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תחרה ורב
  choice: बहुत कलह भड़काते हैं
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अनिश्चित है। यह अनुवाद प्रचुर संघर्ष या उत्तेजना के संभावित भाव को व्यक्त करता है; यूनानी समानांतर में क्रोध और कलह की स्पष्ट सूची भी इस अर्थ का समर्थन करती है।
- source_word: ועת נוחו
  choice: और जब वह ... विश्राम करता है
  rationale: यह עת के समय-संबंधी भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: על משכבו
  choice: अपने बिछौने पर
  rationale: משכב का सीधा अर्थ लेटने का स्थान या बिछौना है; ‘अपने’ हिन्दी में संबंध को सहज बनाता है।
- source_word: שינת לילה
  choice: रात की नींद
  rationale: यह इब्रानी संबंधसूचक रचना को संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी में सुरक्षित रखता है।
- source_word: תשנה
  choice: बदल देती है
  rationale: क्रिया का मूल अर्थ ‘बदलना’ है और यूनानी ἀλλοιοῖ भी इसकी पुष्टि करता है।
- source_word: רעתו
  choice: उसकी दुर्दशा
  rationale: संदर्भ में רעה नैतिक बुराई के बजाय व्यक्ति की पीड़ित दशा को सूचित करता है; ‘दुर्दशा’ इस अर्थ को स्पष्ट रखती है।
theological_decisions:
- issue: कठिन इब्रानी पद תחרה ורב की व्याख्या में यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ को उपलब्ध इब्रानी पर आधारित रखते हुए इसे ‘बहुत कलह भड़काते हैं’ अनूदित किया गया।
  alternative: यूनानी सूची के अनुसार ‘क्रोध और कलह’ को मुख्य पाठ में अलग-अलग जोड़ना, अथवा इब्रानी का अधिक शाब्दिक पर अस्पष्ट अनुवाद देना।
  rationale: उपलब्ध इब्रानी प्राथमिक साक्ष्य है, पर यह पद संक्षिप्त और कठिन है। यूनानी समानांतर संभावित अर्थ स्पष्ट करता है, किंतु उसकी विस्तृत सूची को मुख्य पाठ में आयात नहीं किया गया।
- issue: רעתו का नैतिक या दुःख-संबंधी अर्थ
  choice: इसे ‘उसकी दुर्दशा’ कहा गया, अर्थात पीड़ित अवस्था।
  alternative: ‘उसकी बुराई’ या ‘उसका संकट’।
  rationale: रात्रि की अशांत नींद और मानवीय कष्ट के प्रसंग में यह नैतिक दुष्टता नहीं, बल्कि दुःख या संकट की दशा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और हल्की काव्यात्मक लय रखी गई है। कठिन इब्रानी को अत्यधिक स्पष्ट करके उसकी वास्तविक अनिश्चितता मिटाई नहीं गई; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
