translation:
  language: hi
  text: सोना और चाँदी पाँव को स्थिर करते हैं[a], पर उन दोनों से बढ़कर अच्छी सलाह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, “सोना और चाँदी पाँव को स्थिर करते हैं, और उन दोनों से बढ़कर अच्छी सलाह है।” यूनानी समानांतर में भी सोने और चाँदी द्वारा “पाँव को स्थिर करने” का यही चित्र मिलता है।
    reason: मूल इब्रानी मुहावरे के ठोस चित्र और तुलनात्मक वाक्य-विन्यास को स्पष्ट करना।
lexical_decisions:
- source_word: זהב וכסף
  choice: सोना और चाँदी
  rationale: इब्रानी में धन के दो ठोस रूपों की सीधी जोड़ी है; हिन्दी में इसे स्वाभाविक और अक्षरनिष्ठ ढंग से रखा गया है।
- source_word: יעמידו רגל
  choice: पाँव को स्थिर करते हैं
  rationale: शाब्दिक चित्र पाँव को खड़ा करने या टिकाने का है, जिसका आशय स्थिरता और सुरक्षित आधार देना है। यूनानी समानांतर भी इसी पाँव वाले चित्र की पुष्टि करता है।
- source_word: ומשניהם
  choice: पर उन दोनों से बढ़कर
  rationale: इब्रानी का संक्षिप्त पदबंध शाब्दिक रूप से ‘और उन दोनों से/उन दोनों के परे’ है। प्रसंग में यह सोने और चाँदी की तुलना में सलाह की श्रेष्ठता बताता है; ‘पर ... से बढ़कर’ आधुनिक हिन्दी में उस तुलना को स्पष्ट रखता है।
- source_word: עצה טובה
  choice: अच्छी सलाह
  rationale: עצה का अर्थ सलाह या परामर्श और טובה का सीधा अर्थ अच्छी है। यह चयन मूल शब्दावली के निकट रहते हुए साधारण आधुनिक हिन्दी में स्वाभाविक है।
