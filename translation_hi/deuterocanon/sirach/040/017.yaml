  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
translation:
  language: hi
  text: भलाई कभी नहीं डगमगाएगी[b][a], और धार्मिकता सदा स्थिर रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “अनुग्रह आशीषों में एक उद्यान के समान है, और दान सदा बना रहेगा।” इसके विपरीत, हिब्रू साक्ष्य में “भलाई ... और धार्मिकता ...” है।'
    reason: alternative_reading
  - marker: b
    text: मसादा की हिब्रू पांडुलिपि यहाँ काहिरा गनीज़ा के पाठ से भिन्न पाठ सुरक्षित रखती है; किंतु बचा हुआ अंश इतना खंडित है कि उसके आधार पर पूरे वाक्य का अनुवाद निश्चित रूप से नहीं किया जा सकता।
    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  choice: करुणा
  rationale: हिब्रू חסד में दया, भलाई और निष्ठावान प्रेम का व्यापक भाव है। यहाँ वाचा का स्पष्ट संदर्भ न होने के कारण नैतिक सद्गुण को सहज ढंग से व्यक्त करने के लिए ‘करुणा’ चुना गया है।
- source_word: לעולם לא ימוט
  choice: कभी नहीं डगमगाएगी
  rationale: ימוט अस्थिर होने, हिलने या डगमगाने का बिंब देता है। ‘कभी नहीं डगमगाएगी’ स्थायी दृढ़ता के इस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וצדקה
  choice: धार्मिकता
  rationale: צדקה का अर्थ धार्मिकता या न्याय हो सकता है और बाद के प्रयोग में यह दान से भी जुड़ता है। उपलब्ध हिब्रू पाठ को प्राथमिकता देते हुए ‘धार्मिकता’ रखा गया है; यूनानी समानांतर का ‘दान’ वाला पाठ पाद-टिप्पणी में दिया गया है।
- source_word: לעד תכון
  choice: सदा स्थिर रहेगी
  rationale: תכון स्थापित, दृढ़ या स्थिर रहने का अर्थ देता है। यह चयन पहले खंड के दृढ़ता वाले बिंब के समानांतर स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: काहिरा के हिब्रू पाठ और यूनानी समानांतर के बीच अंतर
  choice: मुख्य पाठ में हिब्रू के अनुसार ‘धार्मिकता सदा स्थिर रहेगी’
  alternative: 'यूनानी परंपरा: ‘दान सदा बना रहेगा’'
  rationale: जहाँ विश्वसनीय हिब्रू पाठ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ का उल्लेखनीय भिन्न रूप पाठक के लिए पाद-टिप्पणी में सुरक्षित रखा गया है, ताकि पाठगत और धर्मवैचारिक तनाव छिपाया न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर दोनों खंडों में स्थायित्व और दृढ़ता का काव्यात्मक बिंब सुरक्षित है।
