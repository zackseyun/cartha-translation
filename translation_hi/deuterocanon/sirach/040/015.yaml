base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: hi
  text: हिंसा से उपजी संतान दण्ड से न बचेगी,[a] क्योंकि भक्तिहीन की जड़ नुकीली चट्टान पर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “भक्तिहीनों की संतान शाखाएँ नहीं बढ़ाएगी, और अशुद्ध जड़ें तीखी कटी चट्टान पर होंगी।” यह भ्रष्ट वृद्धि की छवि का समर्थन करता है, पर उपलब्ध हिब्रू पाठ से अलग है।'
    reason: alternative_reading
  - marker: b
    text: अन्तिम हिब्रू पदबंध कठिन है। उसका शाब्दिक चित्र चट्टान के “दाँत” का है—अर्थात चट्टान का नुकीला उभार या कगार।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר מחמס
  choice: हिंसा से उपजी संतान
  rationale: נוצר को संदर्भ और यूनानी ἔκγονα के आधार पर ‘जो उत्पन्न हुआ/संतान’ समझा गया है। מחמס में חמס का मुख्य अर्थ हिंसा और अन्याय है; ‘हिंसा से उपजी’ स्रोत-संबंध और उत्पत्ति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לא ינקה
  choice: दण्ड से न बचेगी
  rationale: नकार के साथ נקה निर्दोष ठहरने, छूट जाने या दण्ड से बच निकलने का न्यायिक भाव देता है। यह हिन्दी में स्पष्ट और सहज है।
- source_word: שרש חנף
  choice: भक्तिहीन की जड़
  rationale: שרש एकवचन ‘जड़’ है। חנף यहाँ केवल सामाजिक पाखंड नहीं, बल्कि धार्मिक-म नैतिक अधर्म या भक्तिहीनता सूचित करता है; इसलिए ‘भक्तिहीन’ चुना गया है।
- source_word: על שן תלע
  choice: नुकीली चट्टान पर
  rationale: कठिन पदबंध में שן का शाब्दिक अर्थ ‘दाँत’ है, जो चट्टान की नुकीली धार या उभार का रूपक हो सकता है। यूनानी ἐπ’ ἀκροτόμου πέτρας भी तीखी कटी चट्टान की छवि की पुष्टि करता है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठ में पहले अर्धपद का अंतर
  choice: मुख्य पाठ में हिब्रू के अनुसार हिंसा से उपजी संतान का दण्ड से न बचना
  alternative: यूनानी के अनुसार भक्तिहीनों की संतान की शाखाएँ न बढ़ना
  rationale: उपलब्ध हिब्रू साक्ष्य को प्राथमिकता दी गई है। यूनानी पाठ भ्रष्ट वृद्धि और अस्थिर जड़ की समान व्यापक छवि देता है, पर उसकी अलग शब्दावली को मुख्य पाठ में मिलाकर तनाव मिटाया नहीं गया; उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य की शैली रखी गई है। ‘भक्तिहीन’ धार्मिक-म नैतिक अर्थ को साधारण पाठक के लिए स्पष्ट रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में क्रमशः [a] और [b] के रूप में दिए गए हैं।
