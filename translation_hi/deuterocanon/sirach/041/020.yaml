  text: Be ashamed of refusing a request[a], and of turning away the face of your neighbor.
translation:
  language: hi
  text: किसी की माँग पूरी करने से इनकार करने पर और अपने पड़ोसी से मुँह फेर लेने पर लज्जित हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानी पाठ अनिश्चित है और यूनानी पाठ से बहुत भिन्न है। यूनानी का लगभग अर्थ है: “मौन के विषय में अभिवादन करने से, और संगिनी अथवा वेश्या स्त्री को देखने से।” मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है, पर दोनों पाठों का अंतर महत्त्वपूर्ण है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: इनकार करने पर
  rationale: מן के साथ מנע का भाव किसी वस्तु को रोक रखने या देने से इनकार करने का है। प्रसंग में सहज हिन्दी के लिए ‘इनकार करने’ चुना गया है।
- source_word: מתת שאלה
  choice: किसी की माँग पूरी करने से
  rationale: 'पाठ कठिन है: מתת का सामान्य अर्थ ‘देना/भेंट’ और שאלה का अर्थ ‘माँग/निवेदन’ है। संयुक्त वाक्यांश का स्वाभाविक आशय माँगी हुई वस्तु देने या माँग पूरी करने से है; अनिश्चितता पादटिप्पणी में बताई गई है।'
- source_word: מהשב
  choice: मुँह फेर लेने पर
  rationale: השיב का मूल भाव लौटाना या दूसरी ओर मोड़ना है। अगले पद को ‘चेहरा’ मानकर हिन्दी मुहावरे ‘मुँह फेर लेना’ से सामाजिक अस्वीकार का भाव स्पष्ट होता है।
- source_word: אפי רעך
  choice: अपने पड़ोसी से मुँह
  rationale: प्रेषित इब्रानी रूप असामान्य और संभवतः पाठगत रूप से अस्थिर है। उपलब्ध परामर्श-पाठ के ‘अपने पड़ोसी का चेहरा फेरना’ वाले आशय को स्वाभाविक हिन्दी में ‘अपने पड़ोसी से मुँह फेर लेना’ कहा गया है।
- source_word: רעך
  choice: अपने पड़ोसी
  rationale: רע का अर्थ पड़ोसी, साथी या सहमनुष्य हो सकता है। ‘पड़ोसी’ इसके नैतिक-सामाजिक अर्थ को बनाए रखता है और बाइबिलीय हिन्दी में परिचित है।
theological_decisions:
- issue: इब्रानी पंक्ति की पाठगत और अर्थगत अनिश्चितता तथा यूनानी समानांतर से उसका बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य के संभावित आशय—माँग ठुकराने और पड़ोसी से मुँह फेरने—का अनुसरण किया गया है।
  alternative: 'यूनानी पाठ का लगभग अर्थ है: ‘मौन के विषय में अभिवादन करने से, और संगिनी/वेश्या स्त्री को देखने से।’'
  rationale: मूल-भाषा की प्राथमिकता के अनुसार विद्यमान इब्रानी साक्ष्य मुख्य पाठ का आधार है, पर यूनानी पाठ का तीखा अंतर छिपाया नहीं गया। पादटिप्पणी पाठक को इस अस्थिरता से अवगत कराती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘मुँह फेर लेना’ शाब्दिक संरचना की अपेक्षा स्वाभाविक हिन्दी मुहावरा है; पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
