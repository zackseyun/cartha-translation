  yaml_path: translation/deuterocanon/sirach/041/017.yaml
  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: hi
  text: यौन अनैतिकता के विषय में पिता और माता के सामने लज्जित हो, और झूठ बोलने के विषय में आसन पर बैठे शासक[a] के सामने लज्जित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बैठे हुए शासक” है, संभवतः अधिकार के आसन पर आसीन शासक। यूनानी समानांतर में “प्रधान और सामर्थी अधिकारी” है।
    reason: alternative_reading
lexical_decisions:
- source_word: בוש
  choice: लज्जित हो
  rationale: आज्ञार्थक क्रिया नैतिक संकोच और लज्जा रखने का आह्वान करती है; यह हिन्दी में स्वाभाविक ढंग से उपदेशात्मक बल बनाए रखती है।
- source_word: מאב ואם
  choice: पिता और माता के सामने
  rationale: בוש के बाद מן उस व्यक्ति को सूचित करता है जिसके सामने लज्जा अनुभव की जाए; यूनानी समानांतर भी इसी संबंधपरक अर्थ की पुष्टि करता है।
- source_word: אל זנות
  choice: व्यभिचार के विषय में
  rationale: זנות अवैध यौन आचरण की व्यापक श्रेणी है। 'व्यभिचार' गरिमापूर्ण और सामान्यतः बोधगम्य है, यद्यपि इसे केवल वैवाहिक बेवफाई तक सीमित नहीं समझना चाहिए।
- source_word: מנשיא יושב
  choice: आसन पर बैठे शासक
  rationale: यह चयन इब्रानी के 'बैठे हुए शासक' की प्रतिमा को बचाता है; बैठना यहाँ अधिकार के आसन पर आसीन होने का संकेत हो सकता है।
- source_word: אל כחש
  choice: झूठ के विषय में
  rationale: כחש झूठ या छल को सूचित करता है; नैतिक उपदेश के इस संदर्भ में 'झूठ' सीधा और स्पष्ट है।
