  terminology: Replace व्यभिचार with यौन अनैतिकता to retain the broader semantic range without importing a specifically marital limitation. झूठ बोलने is a natural rendering of כחש in this context. The ruler terminology and footnote appropriately preserve the Hebrew/Greek variation.
  issues:
