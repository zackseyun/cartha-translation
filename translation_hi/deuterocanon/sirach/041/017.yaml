  source_fidelity: The draft accurately reflects the two ethical admonitions and preserves the Hebrew image of a ruler who is sitting/occupying office. However, व्यभिचार commonly denotes adultery in modern Hindi and is narrower than זנות, which denotes illicit sexual conduct more broadly.
