    issue: व्यभिचार is too narrow for זנות.
    rationale: In current standard Hindi, व्यभिचार usually means adultery or marital infidelity, whereas the Hebrew זנות and Greek πορνεία denote a wider category of sexual misconduct.
  - severity: low
    issue: The second coordinated clause lacks an explicit imperative.
    rationale: Hindi can permit ellipsis, but repeating लज्जित हो maintains the source's parallel ethical injunction and improves readability.
