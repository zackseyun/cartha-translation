base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: hi
  text: 'लज्जा के विषय में शिक्षा: हे पुत्रो, सुनो,[a] और मेरे निर्णयों के अनुसार लज्जित होओ। हर प्रकार की लज्जा बनाए रखना उचित नहीं, और हर अपमान चुनने योग्य नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “इसलिए मेरे वचन के कारण लज्जित होओ; क्योंकि हर लज्जा को बनाए रखना अच्छा नहीं, और विश्वास में हर बात सबके द्वारा स्वीकार नहीं की जाती।” इसका अंतिम खंड उपलब्ध इब्रानी पाठ से उल्लेखनीय रूप से भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מוסר
  choice: शिक्षा
  rationale: ज्ञान-साहित्य में यह शब्द चरित्र गढ़ने वाली शिक्षा या अनुशासन को दर्शाता है; यहाँ पुत्रों को संबोधित उपदेश के आरम्भ में ‘शिक्षा’ स्वाभाविक है।
- source_word: בשת
  choice: लज्जा
  rationale: यह लज्जा और अपमान के अर्थ-क्षेत्र का व्यापक शब्द है; प्रसंग में नैतिक रूप से उचित और अनुचित लज्जा का भेद किया गया है।
- source_word: שמעו בנים
  choice: हे पुत्रो, सुनो
  rationale: इब्रानी का स्पष्ट पुल्लिंग बहुवचन संबोधन और ज्ञान-गुरु की वाणी सुरक्षित रहती है; हिंदी में संबोधन के साथ यह रूप गरिमापूर्ण और सहज है।
- source_word: והכלמו
  choice: लज्जा मानो
  rationale: आज्ञार्थक भाव है—उचित प्रसंग में लज्जित होने की शिक्षा। ‘लज्जा मानो’ वर्तमान हिंदी में नैतिक चेतना का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: על משפטי
  choice: मेरे निर्णयों के अनुसार
  rationale: इब्रानी משפטי को ‘निर्णयों’ के रूप में रखते हुए על का मानदंड-सूचक अर्थ व्यक्त किया गया है; यूनानी में ‘मेरे वचन पर’ भिन्न पाठ है।
- source_word: לא כל בשת נאה לשמור
  choice: हर प्रकार की लज्जा बनाए रखना उचित नहीं
  rationale: נאה के उचित/शोभनीय और לשמור के बनाए रखने या सुरक्षित रखने के भाव को प्राकृतिक हिंदी में रखा गया है।
- source_word: ולא כל הכלם נבחר
  choice: और हर अपमान को चुनना श्रेष्ठ नहीं
  rationale: הכלם के अपमान/लज्जा और נבחר के चुने या वरीय माने जाने के अर्थ को बनाए रखता है, बिना नैतिक तनाव को किसी एक व्याख्या में सीमित किए।
theological_decisions:
- issue: בנים का लिंग-सूचक संबोधन
  choice: पुत्रो
  alternative: बच्चो / संतानो
  rationale: मूल इब्रानी में स्पष्ट रूप से ‘पुत्र’ का पुल्लिंग बहुवचन है और यह ज्ञान-शिक्षक की पारंपरिक संबोधन-शैली का अंग है।
- issue: इब्रानी और यूनानी के अंतिम खंडों में पाठांतर
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी का अनुसरण
  alternative: 'यूनानी के अनुसार: ‘क्योंकि हर लज्जा को बनाए रखना अच्छा नहीं, और विश्वास में हर बात सबके द्वारा स्वीकार नहीं की जाती।’'
  rationale: इब्रानी पाठ यहाँ उपलब्ध और प्रमाणित है; यूनानी का अंतिम वाक्यांश उल्लेखनीय रूप से भिन्न है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में पारदर्शी ढंग से दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। ‘लज्जा’ नैतिक संकोच के लिए और ‘अपमान’ दूसरे इब्रानी रूप के अर्थ-भेद को दर्शाने के लिए प्रयुक्त है। मुख्य पाठ इब्रानी को प्राथमिकता देता है और यूनानी पाठांतर पादटिप्पणी में सुरक्षित है।
