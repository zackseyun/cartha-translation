base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/013.yaml
  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: hi
  text: जीवन की भलाई गिने-चुने दिनों की है, पर नाम[a] की भलाई अनगिनत दिनों की है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नाम” का अर्थ केवल किसी व्यक्ति का निजी नाम नहीं, बल्कि उसकी प्रतिष्ठा और सम्मानपूर्ण स्मृति भी है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ: “और अच्छा नाम सदा बना रहेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: טובת
  choice: सुख
  rationale: यहाँ טובת जीवन और नाम से मिलने वाले ‘भलेपन/लाभ’ को व्यक्त करता है। ‘सुख’ दोनों अर्धपंक्तियों में स्वाभाविक रहते हुए हिब्रू की समानांतर रचना बनाए रखता है।
- source_word: חי
  choice: जीवन
  rationale: संदर्भ में इसे भाववाचक ‘जीवन’ समझना उचित है; यूनानी ζωῆς भी इसकी पुष्टि करता है।
- source_word: ימי מספר
  choice: गिने-चुने दिनों का
  rationale: हिब्रू का शाब्दिक भाव ‘गिनती के दिन’ है, अर्थात सीमित अवधि। यह आधुनिक हिन्दी में स्पष्ट है और अगले अर्धांश के ‘अनगिनत दिनों’ से सीधा विरोध बनाता है।
- source_word: שם
  choice: अच्छा नाम
  rationale: ‘नाम’ की हिब्रू छवि को बनाए रखा गया है; यहाँ इसका अर्थ केवल व्यक्तिगत नाम नहीं, बल्कि प्रतिष्ठा और सम्मानपूर्ण स्मृति भी है।
- source_word: ימי אין מספר
  choice: अनगिनत दिनों तक रहता है
  rationale: हिब्रू का भाव ‘जिन दिनों की कोई गिनती नहीं’ है। ‘अनगिनत दिनों तक’ उस रूपक को बनाए रखता है; ‘रहता है’ हिन्दी में वाक्य को स्वाभाविक बनाता है और यूनानी समानांतर के διαμενεῖ से भी संगत है।
theological_decisions:
- issue: हिब्रू मुहावरे और यूनानी व्याख्यात्मक विस्तार का संबंध
  choice: मुख्य पाठ में सीमित जीवनकाल और अच्छे नाम की अगणित अवधि के बीच हिब्रू विरोध को रखा गया है।
  alternative: अच्छा नाम सदा बना रहेगा।
  rationale: उपलब्ध हिब्रू पाठ स्पष्ट और प्राथमिक है। यूनानी समानांतर दूसरे अर्धांश का अर्थ ‘सदा बना रहेगा’ कहकर अधिक स्पष्ट करता है; इसलिए उसे वैकल्पिक पाठ के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘गिने-चुने’ और ‘अनगिनत’ मूल हिब्रू के गिनती-आधारित विरोध को सहज ढंग से व्यक्त करते हैं। सभी पादटिप्पणी-चिह्न संबंधित पदों के बाद लगाए गए हैं।
