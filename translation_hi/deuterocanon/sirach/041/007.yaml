base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/007.yaml
  text: The children of a wicked father are cursed[a], for because of him they are a disgrace.
translation:
  language: hi
  text: दुष्ट पिता को उसकी संतान कोसती है[a], क्योंकि उसके कारण वह अपमानित होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“कोसती है” का अर्थ “शाप देती है” भी हो सकता है। यूनानी समानांतर का भाव है: “अधर्मी पिता की संतान उसकी भर्त्सना करती है, क्योंकि उसके कारण वे अपमानित किए जाएँगे।”'
    reason: इब्रानी יקוב में शाप देने का तीखा भाव है, जबकि यूनानी समानांतर सामाजिक भर्त्सना पर अधिक बल देता है।
lexical_decisions:
- source_word: אב רשע
  choice: दुष्ट पिता
  rationale: इब्रानी पद एकवचन और स्पष्टतः पितृवाचक है। רשע नैतिक दुष्टता या दोष को व्यक्त करता है; इसलिए सामान्य और स्वाभाविक हिन्दी में “दुष्ट पिता” उपयुक्त है।
- source_word: יקוב
  choice: कोसेगी
  rationale: נקב का यहाँ शाप देने या कोसने का सक्रिय अर्थ है। वाक्यक्रम में ילד को उत्तरवर्ती कर्ता मानना इब्रानी व्याकरण के अनुकूल है, और यूनानी समानांतर भी संतान द्वारा पिता को धिक्कारने की दिशा में संकेत करता है।
- source_word: ילד
  choice: उसकी संतान
  rationale: इब्रानी में यह रूप एकवचन होते हुए सामूहिक अर्थ रख सकता है। “संतान” उसी सामूहिकता को बनाए रखता है और पिता से संबंध भी स्पष्ट करता है।
- source_word: כי בגללו
  choice: क्योंकि उसी के कारण
  rationale: यह कारणसूचक पद पिता को संतान की बदनामी का कारण बताता है। “उसी” उस पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לחרפה
  choice: वह बदनामी सहती है
  rationale: חרפה सार्वजनिक निंदा, अपमान या बदनामी को सूचित करता है। शाब्दिक “अपमान के लिए” की अपेक्षा यह हिन्दी में स्वाभाविक है और सामाजिक लज्जा का भाव बनाए रखता है।
theological_decisions:
- issue: יקוב को सक्रिय “संतान पिता को कोसेगी” मानना या निष्क्रिय “संतान शापित होगी” मानना
  choice: दुष्ट पिता को उसकी संतान कोसेगी
  alternative: दुष्ट पिता की संतान शापित होगी
  rationale: 'इब्रानी में ילד को क्रिया के बाद आने वाला कर्ता मानने पर सक्रिय पाठ व्याकरणतः सीधा है: “संतान दुष्ट पिता को कोसेगी।” यूनानी समानांतर में भी संतान द्वारा अधर्मी पिता की भर्त्सना का भाव मिलता है। इसलिए स्रोत-साक्ष्य को प्राथमिकता देते हुए सक्रिय अर्थ मुख्य पाठ में रखा गया है; क्रिया के शाप/भर्त्सना-संबंधी अर्थभेद को पादटिप्पणी में सुरक्षित किया गया है।'
- issue: לחרפה की संक्षिप्त इब्रानी रचना में काल और वाच्य
  choice: वह बदनामी सहती है
  alternative: वह अपमान का कारण बनती है / वे अपमानित किए जाएँगे
  rationale: इब्रानी में केवल उद्देश्य या परिणामसूचक संज्ञापद है और काल स्पष्ट नहीं है। नीतिवचन-सदृश सामान्य कथन के लिए वर्तमानकालीन हिन्दी चुनी गई है। यूनानी भविष्यकालीन निष्क्रिय रूप देता है, जिसे निर्णायक बनाकर इब्रानी की संक्षिप्तता को नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। “संतान” सामूहिक अर्थ देता है; स्त्रीलिंग सर्वनाम उसी शब्द के व्याकरणिक लिंग का अनुसरण करता है।
