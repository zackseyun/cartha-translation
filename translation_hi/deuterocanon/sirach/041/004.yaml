base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: hi
  text: यह परमेश्वर की ओर से सब नश्वर प्राणियों का भाग है[a]; फिर तू परमप्रधान के विधान को क्यों ठुकराता है?[b] चाहे दस वर्ष, चाहे सौ वर्ष, चाहे हज़ार वर्ष[c]—अधोलोक में जीवन की कोई ताड़ना नहीं है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘परमेश्वर की ओर से’ है; यूनानी पाठ में ‘प्रभु की ओर से’ है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी पाठ में ‘परमप्रधान की व्यवस्था’ प्रतीत होता है, जबकि यूनानी में ‘परमप्रधान की प्रसन्न इच्छा’ है। यहाँ ‘विधान’ संदर्भ में उसके ठहराए हुए निर्णय का भाव व्यक्त करता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में संख्याओं का क्रम कठिन है और वह संभवतः ‘हज़ार वर्ष, सौ और दस’ पढ़ता है; यूनानी में ‘चाहे दस, चाहे सौ, चाहे हज़ार वर्ष’ है।
    reason: textual_variant
  - marker: d
    text: इब्रानी में ‘शिओल’ और यूनानी में ‘हेडीस’ है; यहाँ दोनों के लिए ‘अधोलोक’ प्रयुक्त हुआ है। अंतिम वाक्यांश दोनों पाठों में संक्षिप्त है और इब्रानी में विशेष रूप से कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זה חלק כל בשר
  choice: यह ... सब प्राणियों का भाग है
  rationale: חלק का मूल अर्थ ‘भाग/हिस्सा’ है। כל בשר का शाब्दिक रूप ‘सब देह’ है, पर यहाँ आशय समस्त नश्वर प्राणियों से है; ‘सब प्राणियों’ से हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: מאל
  choice: परमेश्वर की ओर से
  rationale: उपलब्ध इब्रानी पाठ में ‘परमेश्वर से/की ओर से’ है; इसलिए यूनानी के ‘प्रभु की ओर से’ के बजाय इसे मुख्य पाठ में रखा गया है।
- source_word: תמאס
  choice: ठुकराता है
  rationale: מאס का अर्थ अस्वीकार करना या तुच्छ जानकर ठुकराना है। ‘ठुकराना’ प्रश्न की तीव्रता और आधुनिक हिन्दी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: परमप्रधान के विधान को
  rationale: इब्रानी में ‘परमप्रधान की व्यवस्था’ और यूनानी में ‘परमप्रधान की प्रसन्न इच्छा’ है। संदर्भ में ‘विधान’ उस दैवी ठहराव को व्यक्त करता है, पर पाठांतर पादटिप्पणी में सुरक्षित हैं।
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: चाहे दस वर्ष हों, चाहे सौ, चाहे हज़ार
  rationale: इब्रानी संख्या-क्रम कठिन और संभवतः विकृत है; यूनानी में स्पष्ट रूप से दस, सौ और हज़ार का आरोही क्रम है। मुख्य पाठ में स्पष्ट यूनानी क्रम अपनाया गया और इब्रानी कठिनाई पादटिप्पणी में दी गई है।
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγμὸς ζωῆς
  choice: अधोलोक में जीवन के विषय में कोई उलाहना नहीं होता
  rationale: इब्रानी पंक्ति कठिन है, जबकि यूनानी ‘अधोलोक में जीवन का कोई उलाहना/धिक्कार नहीं’ का समर्थन करता है। ‘जीवन के विषय में’ संबंध की वास्तविक अस्पष्टता को खुला रखता है और ‘उलाहना’ ἔλεγμος/תוכחות की ताड़ना या भर्त्सना का भाव देता है।
theological_decisions:
- issue: שאול / ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: शिओल; हेडीस; कब्र
  rationale: ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए बोधगम्य है और मृतकों के लोक की प्राचीन धारणा को केवल ‘कब्र’ तक सीमित नहीं करता। पादटिप्पणी इब्रानी और यूनानी शब्दों को स्पष्ट करती है।
- issue: इब्रानी ‘व्यवस्था’ और यूनानी ‘प्रसन्न इच्छा’ के बीच तनाव
  choice: विधान
  alternative: परमप्रधान की व्यवस्था; परमप्रधान की प्रसन्न इच्छा
  rationale: ‘विधान’ मृत्यु के दैवी ठहराव के संदर्भ में दोनों साक्ष्यों के अर्थ-क्षेत्र को आंशिक रूप से समेटता है, बिना किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को निर्णायक बनाए; दोनों पाठांतर पादटिप्पणी में दिए गए हैं।
- issue: अधोलोक में ‘जीवन के उलाहने’ का कठिन वाक्यांश
  choice: जीवन के विषय में कोई उलाहना नहीं होता
  alternative: जीवन का कोई उलाहना नहीं; जीवन के लिए कोई ताड़ना नहीं
  rationale: संबंधसूचक अर्थ पाठ में अस्पष्ट है। ‘के विषय में’ इस तनाव को हल किए बिना पठनीय हिन्दी देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन के लिए ‘तू’ मूल के सीधे, व्यक्तिगत प्रश्न को बनाए रखता है। पाठगत कठिनाइयों को सहज बनाने के बजाय पादटिप्पणियों में पारदर्शी रूप से दर्ज किया गया है।
