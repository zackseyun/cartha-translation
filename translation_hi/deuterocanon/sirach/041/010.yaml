translation:
  language: hi
  text: सब कुछ शून्य से शून्य में लौट जाता है[a]; वैसे ही अधर्मी व्यक्ति व्यर्थता से व्यर्थता की ओर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “जो कुछ पृथ्वी से है, वह पृथ्वी में चला जाता है; वैसे ही अधर्मी लोग शाप से विनाश की ओर जाते हैं।” यूनानी पाठ इस पद के बचे हुए इब्रानी पाठ से काफी भिन्न रूप दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כל מאפס אל אפס ישוב
  choice: जो कुछ शून्य से आता है, वह शून्य में लौट जाता है
  rationale: इब्रानी में शाब्दिक रूप से ‘सब/जो कुछ शून्य से, शून्य को लौटेगा’ है। हिन्दी में पूर्ण और स्वाभाविक वाक्य बनाने के लिए निहित गति को ‘आता है’ से व्यक्त किया गया है; ‘शून्य’ אפס की न-अस्तित्व/कुछ न होने की तीक्ष्ण छवि और उसकी पुनरावृत्ति बनाए रखता है।
- source_word: כן
  choice: वैसे ही
  rationale: यह दोनों अर्धपंक्तियों के बीच तुलना को स्पष्ट और स्वाभाविक हिन्दी में जोड़ता है।
- source_word: חנף
  choice: भक्तिहीन मनुष्य
  rationale: यह शब्द यहाँ केवल दिखावटी कपट तक सीमित नहीं, बल्कि ईश्वर के प्रति श्रद्धाहीन या अधर्मी व्यक्ति को सूचित कर सकता है। यूनानी ἀσεβεῖς भी इस व्यापक धार्मिक-नैतिक अर्थ का समर्थन करता है। एकवचन इब्रानी रूप को बनाए रखा गया है।
- source_word: מתהו אל תהו
  choice: व्यर्थता से व्यर्थता की ओर
  rationale: תהו में रिक्तता, उजाड़पन, अव्यवस्था या निष्फलता के अर्थ संभव हैं। यहाँ ‘व्यर्थता’ कहावत-सदृश नैतिक संदर्भ में निष्फलता को व्यक्त करती है और मूल की पुनरावृत्ति बनाए रखती है।
- source_word: ישוב
  choice: लौट जाता है
  rationale: שוב का सामान्य अर्थ ‘लौटना’ है। सामान्य सत्य व्यक्त करने के लिए आधुनिक हिन्दी का वर्तमानकालीन रूप चुना गया है।
theological_decisions:
- issue: חנף का अर्थ
  choice: भक्तिहीन मनुष्य
  alternative: कपटी; अधर्मी; नास्तिक
  rationale: ‘कपटी’ अर्थ को अनावश्यक रूप से संकरा कर देता, जबकि इब्रानी ज्ञान-साहित्य और यूनानी समानांतर दोनों व्यापक ईश्वर-विरोधी या श्रद्धाहीन भाव की अनुमति देते हैं। ‘नास्तिक’ बौद्धिक मत का आधुनिक अर्थ ला सकता है, इसलिए उसे नहीं चुना गया।
- issue: इब्रानी और यूनानी पाठों का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और पादटिप्पणी में भिन्न यूनानी पाठ
  alternative: मुख्य पाठ में यूनानी ‘मिट्टी से मिट्टी’ पाठ अपनाना या दोनों को मिला देना
  rationale: यहाँ उपलब्ध इब्रानी उच्च-विश्वसनीयता वाला प्राथमिक साक्ष्य है। यूनानी पाठ महत्वपूर्ण रूप से भिन्न है, इसलिए उसे मिलाकर अंतर मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תהו की अर्थगत व्यापकता
  choice: व्यर्थता
  alternative: रिक्तता; शून्यता; अव्यवस्था
  rationale: ‘व्यर्थता’ नैतिक निष्फलता को स्वाभाविक हिन्दी में व्यक्त करती है, पर इब्रानी शब्द की अन्य संभावनाओं को निर्णायक रूप से नकारती नहीं; इसी कारण व्याख्या में ब्रह्मांडीय ‘अव्यवस्था’ नहीं थोपी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली रखी गई है। ‘शून्य’ और ‘व्यर्थता’ को अलग रखकर אפס और תהו का अंतर तथा प्रत्येक की मूल पुनरावृत्ति सुरक्षित की गई है।
