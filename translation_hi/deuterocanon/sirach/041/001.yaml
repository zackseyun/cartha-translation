base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: hi
  text: हे मृत्यु, उस मनुष्य के लिए तेरी याद कितनी कड़वी है, जो अपनी संपत्ति में चैन से रहता है[a], जो निश्चिंत है, हर बात में सफल है, और अब भी सुख भोगने में समर्थ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अर्थ कुछ अनिश्चित है; इसका अनुवाद ‘अपने ठिकाने पर चैन से’ भी हो सकता है। यूनानी समानांतर पाठ में है, ‘जो अपनी संपत्ति के बीच शांति से रहता है।’
    reason: textual_variant
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘सुख ग्रहण करने की शक्ति’ है; यूनानी समानांतर पाठ अधिक विशिष्ट रूप से ‘भोजन ग्रहण करने की शक्ति’ कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: तेरी याद ... कितनी कड़वी है
  rationale: इब्रानी זכרך और यूनानी μνημόσυνον दोनों मृत्यु की ‘याद’ या ‘स्मरण’ की ओर संकेत करते हैं। सीधे संबोधन और चिंतनशील भाव को बनाए रखने के लिए ‘तेरी याद’ चुना गया।
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: उस मनुष्य के लिए ... जो अपनी स्थिति में निश्चिंत रहता है
  rationale: इब्रानी מכונתו का आशय उसकी स्थापित स्थिति या आधार से हो सकता है, जबकि यूनानी समानांतर पाठ उसके पास जो कुछ है उसमें शांति से रहने का भाव देता है। ‘अपनी स्थिति में निश्चिंत’ इब्रानी रूप को प्राथमिक रखते हुए सुरक्षा और संतोष का भाव व्यक्त करता है।
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: जो शांत है
  rationale: इब्रानी שליו शांति, चैन और चिंता से मुक्त अवस्था बताता है; यूनानी में भी अविचलित या निर्विघ्न होने का भाव है। ‘शांत’ सहज और गरिमापूर्ण है।
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: हर बात में सफल है
  rationale: दोनों स्रोत सर्वांगीण सफलता या उन्नति व्यक्त करते हैं। ‘हर बात में सफल’ आधुनिक हिन्दी में स्वाभाविक है और בכל की व्यापकता बनाए रखता है।
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: जिसमें अब भी सुख भोगने की शक्ति है
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘सुख/आनंद ग्रहण करने की शक्ति’ कहता है। यूनानी इसे अधिक विशिष्ट रूप से भोजन ग्रहण करने की शक्ति बताता है। मुख्य पाठ में इब्रानी की व्यापक और वास्तविक अस्पष्टता सुरक्षित रखी गई है तथा यूनानी पाठ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: איש के पुल्लिंग एकवचन का अनुवाद
  choice: उस मनुष्य के लिए
  alternative: उस व्यक्ति के लिए
  rationale: मूल पाठ प्रतिनिधिक पुल्लिंग एकवचन का प्रयोग करता है। हिन्दी में ‘मनुष्य’ इस रूप को बनाए रखते हुए सामान्य मानवीय संदर्भ में स्वाभाविक है।
- issue: अनिश्चित इब्रानी पदबंध में यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ में इब्रानी को प्राथमिक रखते हुए ‘अपनी स्थिति में निश्चिंत’ और ‘सुख भोगने’ का अनुवाद
  alternative: यूनानी के आधार पर ‘अपनी संपत्ति में चैन से’ और ‘भोजन ग्रहण करने’ का अनुवाद
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है। यूनानी पाठ अस्पष्ट स्थानों को समझने में सहायक है, पर जहाँ दोनों में वास्तविक अंतर है वहाँ उसे चुपचाप मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और काव्यात्मक संबोधन रखा गया है। ‘हे मृत्यु’ मूल के नाटकीय संबोधन को बनाए रखता है; वाक्य को साधारण पाठक के लिए प्रवाहपूर्ण बनाने हेतु डैश का प्रयोग किया गया है।
