base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/005.yaml
  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
translation:
  language: hi
  text: तिरस्कृत व्यक्ति की संतान बुरी चीज़ है[a][c], और मूर्ख की संतान दुष्ट के आतंक में है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले खंड का इब्रानी पाठ कठिन है। यूनानी समानान्तर का आशय लगभग यह है: “पापियों की संतान घृणित संतान होती है।”'
    reason: alternative_reading
  - marker: b
    text: 'दूसरे खंड में यूनानी समानान्तर अधिक भिन्न है; उसका आशय लगभग यह है: “और वे अधर्मियों की बस्तियों में संगति करते हैं।”'
    reason: alternative_reading
  - marker: c
    text: इस स्थान का प्राचीन मसादा साक्ष्य खंडित है; इस पद के मुख्य पठनीय शब्द काहिरा गनीज़ा की इब्रानी पांडुलिपियों से मिलते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: संतान
  rationale: यह शब्द वंशज या संतान को सूचित करता है। आधुनिक हिन्दी में “संतान” स्वाभाविक है और किसी निश्चित आयु या पीढ़ी तक अर्थ को सीमित नहीं करता।
- source_word: נמאס
  choice: तिरस्कृत व्यक्ति की
  rationale: निष्क्रिय विशेषण का अर्थ ‘जिसे तुच्छ या अस्वीकार्य समझा गया हो’ है। सम्बन्धसूचक रूप पहले खंड में संतान के उद्गम को व्यक्त करता है।
- source_word: דבר רעים
  choice: बुरी चीज़ है
  rationale: इब्रानी पद कठिन और सम्भवतः पाठगत रूप से अस्थिर है। דבר को ‘वस्तु/बात’ मानकर यह अनुवाद कठोर नकारात्मक मूल्यांकन को बनाए रखता है, पर अधिक अनुमानपूर्ण पुनर्निर्माण नहीं करता।
- source_word: נכד
  choice: संतान
  rationale: यद्यपि इसका अर्थ ‘पोता’ भी हो सकता है, נין के काव्यात्मक समानान्तर में यह व्यापक रूप से वंश या संतान का बोध कराता है।
- source_word: אויל
  choice: मूर्ख
  rationale: यह ज्ञान-साहित्य का नैतिक शब्द है; “मूर्ख” केवल बौद्धिक कमी नहीं, बल्कि विवेकहीन जीवन-चर्या का भाव भी रखता है।
- source_word: במגור
  choice: आतंक में
  rationale: מגור भय, दहशत या आतंक को व्यक्त करता है। “आतंक में है” इब्रानी की अवस्थासूचक रचना के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: רשע
  choice: दुष्ट
  rationale: एकवचन रूप किसी दुष्ट व्यक्ति अथवा सामूहिक नैतिक वर्ग की ओर संकेत कर सकता है। हिन्दी “दुष्ट” इस सम्भव अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और भिन्न यूनानी समानान्तर के बीच पाठाधार
  choice: मुख्य अनुवाद विद्यमान काहाना-सम्पादित काहिरा गनीज़ा इब्रानी पाठ पर आधारित है; यूनानी को अर्थ और स्वर की जाँच के लिए लिया गया है।
  alternative: 'यूनानी-प्रधान अनुवाद: “पापियों की संतान घृणित संतान होती है, और वे अधर्मियों की बस्तियों में संगति करते हैं।”'
  rationale: इब्रानी पाठ उपलब्ध होने के कारण उसे प्राथमिकता दी गई है। यूनानी पाठ दोनों खंडों में, विशेषकर दूसरे में, पर्याप्त भिन्न है; इसलिए उसे चुपचाप मुख्य पाठ में मिलाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज ज्ञान-साहित्यिक स्तर रखा गया है। पद के कठोर मूल्यांकन को नरम नहीं किया गया, और इब्रानी की पाठगत कठिनाई तथा यूनानी की भिन्नता पादटिप्पणियों में सुरक्षित रखी गई है।
