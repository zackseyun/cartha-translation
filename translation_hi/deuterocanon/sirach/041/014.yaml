  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
translation:
  language: hi
  text: छिपी हुई बुद्धि और गुप्त रखा हुआ खजाना—इन दोनों से क्या लाभ है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इन दोनों में क्या लाभ है?” हिन्दी में “इन दोनों से” इस अलंकारिक प्रश्न का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ इसके आरम्भ में यह पंक्ति जोड़ता है: “हे बच्चो, शान्ति से शिक्षा को थामे रखो,” और उसके बाद “छिपी हुई बुद्धि और अदृश्य खजाना…” आता है। मुख्य अनुवाद के लिए प्रयुक्त इब्रानी साक्ष्य छिपी हुई बुद्धि वाली पंक्ति से आरम्भ होता है।'
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: बुद्धि
  rationale: यहाँ इब्रानी शब्द मूल्यवान समझ या विवेक को दर्शाता है; यूनानी σοφία भी इसी अर्थ की पुष्टि करता है।
- source_word: טמונה
  choice: छिपी हुई
  rationale: यह कृदंत किसी वस्तु के छिपाकर रखे जाने का भाव देता है। ‘छिपी हुई’ सहज है और ‘गड़ी हुई’ जैसा अनावश्यक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: אוצר
  choice: खजाना
  rationale: समानांतर पंक्ति में आशय संग्रह-स्थान से अधिक मूल्यवान संचित वस्तु से है; यूनानी θησαυρός भी इसका समर्थन करता है।
- source_word: מוסתר
  choice: गुप्त रखा हुआ
  rationale: यह अनदेखा या छिपाकर रखा हुआ होने का भाव व्यक्त करता है और पहले खंड के ‘छिपी हुई’ की यांत्रिक पुनरावृत्ति से बचते हुए काव्यात्मक समानांतरता बनाए रखता है।
- source_word: מה תועלה
  choice: क्या लाभ है
  rationale: यह व्यावहारिक उपयोग या फायदे के विषय में अलंकारिक प्रश्न है; ‘क्या लाभ है’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בשתיהם
  choice: इन दोनों से
  rationale: इब्रानी और यूनानी दोनों वस्तुओं को एक साथ इंगित करते हैं। हिन्दी में ‘इन दोनों से क्या लाभ है?’ स्वाभाविक रूप से यह भाव प्रकट करता है कि छिपाकर रखने पर दोनों निष्फल हैं।
