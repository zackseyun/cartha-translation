review_pass:
  verdict: revise
  source_fidelity: The draft follows the supplied English audit trail, but its second colon does not represent the extant Hebrew closely. וריש is most straightforwardly read as “poverty” (ריש), followed by עם זרעו תמיד, “with his offspring continually.” The Greek parallel instead has enduring reproach and a perishing inheritance; it should remain an alternative reading in a note rather than replace the Hebrew wording in the main text.
  naturalness: The proposed revision is natural modern standard Hindi while retaining the deliberately compact, proverbial structure of the Hebrew. “उसके वंशजों के साथ दरिद्रता सदा रहती है” is clearer and more idiomatic than attaching “बनी रहती है” to “बदनामी.”
  terminology: “अन्याय की संतान” adequately preserves the singular “child/son of injustice,” and “बुराई का शासन” renders ממשלת רע. “दरिद्रता” is the appropriate primary rendering for ריש; the Greek “निंदा/अपमान” belongs in the footnote.
  issues:
  - severity: high
    issue: The main text renders וריש as “बदनामी.”
    rationale: In the surviving Hebrew, ריש ordinarily means poverty/need. The Greek parallel’s ὄνειδος (“reproach”) explains the prior wording but should not displace the Hebrew primary witness without an explicit textual decision.
  - severity: medium
    issue: The note characterizes the Hebrew second colon only as pointing to lasting disgrace.
    rationale: This obscures the substantial divergence between the Hebrew reading of enduring poverty and the Greek reading of enduring reproach. The note should state the Greek alternative accurately and briefly.
  revised_text: अन्याय की संतान से बुराई का शासन होता है, और उसके वंशजों के साथ दरिद्रता सदा रहती है।[a]
