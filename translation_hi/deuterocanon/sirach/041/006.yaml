base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/006.yaml
  text: The dominion of evil is from the child of injustice, and disgrace is always with his offspring.
translation:
  language: hi
  text: अन्याय की संतान से बुराई का शासन होता है, और उसके वंशजों के साथ दरिद्रता सदा रहती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “पापी संतानों की विरासत नष्ट हो जाएगी, और उनके वंशजों के साथ निंदा बनी रहेगी।” इब्रानी पाठ में यहाँ “दरिद्रता उसके वंशजों के साथ सदा रहती है” पढ़ा जाता है; दोनों पाठों में इस खंड का शब्दांकन भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: अन्याय की संतान से
  rationale: מ־ का अर्थ ‘से’ और בן का अर्थ ‘संतान’ रखा गया है। עול यहाँ अन्याय या दुष्कर्म को सूचित करता है। यह अनुवाद इब्रानी की एकवचन संरचना और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: ממשלת רע
  choice: बुराई का शासन
  rationale: ממשלה शासन या प्रभुत्व है और רע यहाँ संज्ञा के रूप में ‘बुराई’ हो सकता है। ‘बुराई का शासन’ इब्रानी पदक्रम के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: וריש עם
  choice: और बदनामी
  rationale: प्राप्त इब्रानी पाठ इस स्थान पर कठिन और अनिश्चित है। यूनानी समानांतर का ὄνειδος सार्वजनिक निंदा या अपमान का भाव स्पष्ट करता है; आधुनिक हिन्दी में ‘बदनामी’ उस भाव को सहज रूप से व्यक्त करती है।
- source_word: זרעו
  choice: उसके वंश
  rationale: זרע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ आशय संतान या वंशजों से है। ‘वंश’ संक्षिप्त, स्वाभाविक और पीढ़ियों तक चलने वाले परिणाम के अनुकूल है।
- source_word: תמיד
  choice: सदा बनी रहती है
  rationale: תמיד निरंतरता को व्यक्त करता है। हिन्दी में विधेय के साथ ‘सदा बनी रहती है’ अधिक स्वाभाविक है और स्थायी बदनामी का भाव सुरक्षित रखता है।
theological_decisions:
- issue: कठिन इब्रानी दूसरे खंड और यूनानी समानांतर का संबंध
  choice: जहाँ इब्रानी स्पष्ट है वहाँ उसकी संरचना को प्रधान रखा गया है, और कठिन दूसरे खंड को स्थायी बदनामी के अर्थ में प्रस्तुत किया गया है।
  alternative: 'यूनानी के अनुसार पूरा वाक्य इस प्रकार देना: ‘पापियों की संतानों की विरासत नष्ट हो जाएगी, और उनके वंश के साथ निंदा बनी रहेगी।’'
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है, पर दूसरे खंड का पाठ कठिन है। यूनानी समानांतर उस खंड में वंशजों से जुड़ी स्थायी निंदा का अर्थ पुष्ट करता है, इसलिए उससे अर्थ स्पष्ट किया गया है, इब्रानी को पूरी तरह प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अन्याय की संतान’ मूल की असामान्य पर अर्थपूर्ण छवि को सुरक्षित रखता है; ‘बदनामी’ सामान्य पाठक के लिए ‘निंदा’ या ‘कलंक’ की अपेक्षा अधिक सीधा है।
