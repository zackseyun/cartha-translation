translation:
  language: hi
  text: अपनी मृत्यु की नियति से मत डर[a]; याद रख कि तुझसे पहले के और तेरे बाद के लोग भी तेरे साथ हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का शाब्दिक रूप लगभग ‘मृत्यु से—तेरा ठहराया हुआ विधान/नियत भाग’ है; यूनानी पाठ में ‘मृत्यु के निर्णय से’ है। मुख्य पाठ दोनों साक्ष्यों में निहित नियत मृत्यु का भाव व्यक्त करता है।
    reason: alternative_reading
  - marker: b
    text: ‘तेरे साथ हैं’ का आशय है कि पहले के और बाद के लोग भी मृत्यु की यही दशा साझा करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אל תפחד
  choice: मत डर
  rationale: निषेधात्मक इब्रानी आज्ञा का यह स्वाभाविक, संक्षिप्त और गंभीर हिन्दी रूप है।
- source_word: ממות חקיך
  choice: अपनी मृत्यु के ठहराए हुए विधान से
  rationale: 'इब्रानी पदबंध संक्षिप्त है: מות ‘मृत्यु’ और חק ‘ठहराया हुआ विधान, नियत भाग’ का भाव देता है; यूनानी κρίμα θανάτου ‘मृत्यु का निर्णय’ इसकी पुष्टि करता है। यह अनुवाद निजी संबोधन और नियत मृत्यु—दोनों भावों को रखता है।'
- source_word: זכור
  choice: याद रख
  rationale: आज्ञार्थक क्रिया का आधुनिक, सहज और गरिमापूर्ण हिन्दी रूप।
- source_word: ראשנים ואחרנים
  choice: जो तुझसे पहले थे और जो तेरे बाद होंगे
  rationale: ‘पहले वालों और बाद वालों’ के कालगत विरोध को स्पष्ट करता है, पर ‘पीढ़ियाँ’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עמך
  choice: वे भी तेरे साथ हैं
  rationale: इब्रानी का शाब्दिक ‘तेरे साथ’ सुरक्षित है; प्रसंग में यह सभी मनुष्यों की समान मृत्यु-दशा की ओर संकेत करता है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ממות חקיך में भय के विषय को कैसे व्यक्त किया जाए
  choice: अपनी मृत्यु के ठहराए हुए विधान से मत डर
  alternative: मृत्यु से मत डर / मृत्यु के निर्णय से मत डर / अपने नियत अंत से मत डर
  rationale: उपलब्ध इब्रानी को प्रधान रखते हुए חק के ‘नियत विधान/भाग’ को व्यक्त किया गया है; यूनानी समानांतर का ‘निर्णय’ संकुचित इब्रानी पदबंध को स्पष्ट करता है। इस प्रकार अनुवाद न केवल सामान्य मृत्यु, न केवल न्यायिक दंड—बल्कि मृत्यु की ठहराई हुई नियति का तनाव बनाए रखता है।
