base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/009.yaml
  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: hi
  text: यदि तुम गिर पड़ोगे, तो संसार को आनन्द होगा;[a] और यदि तुम मरोगे, तो तुम्हारा अन्त शाप में होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ का अर्थ कठिन है; इसका अनुवाद “तो सदा आनन्द होगा” भी हो सकता है। यूनानी पाठ में है: “यदि तुम जन्मोगे, तो शाप के लिए जन्मोगे; और यदि तुम मरोगे, तो शाप तुम्हारे भाग में आएगा।”'
    reason: इब्रानी की शाब्दिक/अर्थगत अस्पष्टता और यूनानी समानांतर के महत्वपूर्ण पाठांतर को दर्ज करना।
lexical_decisions:
- source_word: תכשלו
  choice: तुम गिर पड़ोगे
  rationale: मूल क्रिया का सामान्य अर्थ ठोकर खाना, लड़खड़ाना या गिर पड़ना है; प्रसंग में नैतिक या विनाशकारी पतन का संकेत खुला रखा गया है।
- source_word: לשמחת עולם
  choice: तो संसार को आनन्द होगा
  rationale: ל־ को परिणाम/कारण के भाव में और עולם को यहाँ ‘संसार’ के अर्थ में लिया गया है। इससे कठिन इब्रानी पाठ का स्वाभाविक हिन्दी रूप बनता है, बिना उसे यूनानी समानांतर के अनुसार बदलने के।
- source_word: לקללה
  choice: तुम्हारा अन्त शाप में होगा
  rationale: शाब्दिक ‘शाप के लिए’ हिन्दी में अस्पष्ट और अस्वाभाविक है; यह रूप मृत्यु के साथ जुड़े शापित परिणाम को व्यक्त करता है, पर शाप का कर्ता या सटीक स्वरूप तय नहीं करता।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच महत्वपूर्ण अंतर
  choice: मुख्य पाठ में प्रमाणित इब्रानी पाठ का अनुवाद किया गया है
  alternative: 'यूनानी के अनुसार: ‘यदि तुम जन्मोगे, तो शाप के लिए जन्मोगे; और यदि मरोगे, तो शाप तुम्हारे भाग में आएगा।’'
  rationale: दिए गए इब्रानी स्रोत की विश्वसनीयता उच्च बताई गई है और उसमें पद 9 का स्पष्ट चिह्न है। इसलिए यूनानी के अधिक सुगम, पर भिन्न, पाठ को मुख्य पाठ पर आरोपित करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: עולם का अर्थ
  choice: संसार
  alternative: सदा का/अनन्त
  rationale: वाक्य में ‘संसार को आनन्द’ अर्थपूर्ण प्रतिपक्ष देता है; फिर भी शब्द में ‘अनन्त काल’ का अर्थ संभव है, इसलिए पादटिप्पणी में वैकल्पिक समझ बताई गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। कठिन इब्रानी को मुख्य पाठ में दबाया नहीं गया; पाठांतर और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
