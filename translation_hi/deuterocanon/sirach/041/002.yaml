base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: hi
  text: हे मृत्यु, तेरा निर्णय—तेरे विधान—उस मनुष्य के लिए कितना उचित है जो अभावग्रस्त और शक्तिहीन है, जो हर बात में ठोकर खाता है, अवज्ञाकारी है और अपनी आशा खो चुका है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חקיך
  choice: तेरा निर्णय
  rationale: इब्रानी शब्द का मूल अर्थ ‘तेरे विधान/नियम’ है, जबकि यूनानी समानांतर में एकवचन ‘निर्णय’ है। मृत्यु द्वारा सुनाए या लागू किए गए परिणाम के संदर्भ में ‘निर्णय’ स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
- source_word: איש אונים וחסר עצמה
  choice: जो अभावग्रस्त और शक्तिहीन है
  rationale: ‘חסר עצמה’ स्पष्टतः शक्ति की कमी बताता है। पहले पद की इब्रानी अभिव्यक्ति कठिन है; यूनानी ἐπιδεομένῳ ‘ज़रूरतमंद/अभावग्रस्त’ का समर्थन करता है।
- source_word: כושל ינקש בכל
  choice: जो हर बात में ठोकर खाता है
  rationale: כושל गिरने या लड़खड़ाने वाले व्यक्ति को और ינקש फँसने को सूचित कर सकता है। हिंदी में ‘हर बात में ठोकर खाता है’ व्यक्ति की निरंतर विफलता और उलझन दोनों को सहज रूप से व्यक्त करता है।
- source_word: סורב
  choice: अवज्ञाकारी
  rationale: यह शब्द हठपूर्वक न मानने या विरोध करने का भाव रखता है; यूनानी ἀπειθοῦντι भी अवज्ञा का समर्थन करता है। ‘अवज्ञाकारी’ नैतिक भाव को बनाए रखता है, पर किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता।
- source_word: אובד תקוה
  choice: अपनी आशा खो चुका है
  rationale: इब्रानी का सीधा और स्वाभाविक अर्थ; यूनानी ἀπολωλεκότι ὑπομονήν में ‘धैर्य/सहनशीलता खोना’ है, पर इब्रानी यहाँ स्पष्टतः ‘आशा’ कहता है।
theological_decisions:
- issue: मृत्यु के ‘निर्णय’ का मानवीकरण
  choice: मृत्यु को सीधे संबोधित करते हुए ‘तेरा निर्णय’ बनाए रखा गया
  alternative: ‘तेरा आना’ या ‘मृत्यु का दंड’
  rationale: मूल पाठ मृत्यु को संबोधित कर उसके חק/κρίμα की बात करता है। इसे केवल ‘आना’ कहना रूपक को मिटा देता, और ‘दंड’ कहना अनावश्यक रूप से दंडात्मक धर्मवैज्ञानिक अर्थ जोड़ता।
- issue: ‘अवज्ञाकारी’ व्यक्ति के प्रति मृत्यु की उपयुक्तता
  choice: गुणों की सूची को बिना कारणात्मक या नैतिक स्पष्टीकरण जोड़े रखा गया
  alternative: अवज्ञा के दंड के रूप में मृत्यु को स्पष्ट करना
  rationale: पद स्वयं यह नहीं कहता कि मृत्यु उसकी अवज्ञा का दंड है; इसलिए उस संभावित संबंध को खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘हे मृत्यु’ काव्यात्मक प्रत्यक्ष संबोधन को बनाए रखता है। वाक्य की सूची-संरचना मूल के संचित दुःख और निराशा के भाव को सुरक्षित रखती है।
