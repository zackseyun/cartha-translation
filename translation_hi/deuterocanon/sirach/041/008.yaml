translation:
  language: hi
  text: हाय[a] तुम पर, हे दुष्ट मनुष्यो, जिन्होंने परमप्रधान की व्यवस्था[b] को त्याग दिया है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में “परमप्रधान परमेश्वर की व्यवस्था” है; मुख्य इब्रानी साक्ष्य में केवल “परमप्रधान की व्यवस्था” है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द תורה का अनुवाद “शिक्षा” या “उपदेश” भी किया जा सकता है; यहाँ वाचा-संबंधी अर्थ और यूनानी νόμος के आधार पर “व्यवस्था” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוי / οὐαί
  choice: हाय
  rationale: यह शोक और धिक्कार—दोनों का प्रबल भविष्यद्वक्ताई उद्गार है; आधुनिक हिन्दी में ‘हाय’ इस तनाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: לכם / ὑμῖν
  choice: तुम पर
  rationale: हिन्दी में ‘तुम पर हाय’ संबोधित व्यक्तियों पर आनेवाले संकट या दण्ड की घोषणा को सहजता से व्यक्त करता है।
- source_word: אנשי רשע / ἄνδρες ἀσεβεῖς
  choice: दुष्ट मनुष्यो
  rationale: इब्रानी पदबंध का सीधा अर्थ दुष्ट पुरुष/मनुष्य है। सम्बोधन रूप ‘मनुष्यो’ स्रोत के पुल्लिंग बहुवचन को बनाए रखता है, जबकि ‘दुष्ट’ इब्रानी नैतिक अर्थ को प्राथमिकता देता है।
- source_word: עזבתם / ἐγκατελίπετε
  choice: त्याग दिया है
  rationale: यह जानबूझकर छोड़ देने और निष्ठा तोड़ने का नैतिक बल व्यक्त करता है तथा आधुनिक हिन्दी में स्पष्ट है।
- source_word: תורת / νόμον
  choice: व्यवस्था
  rationale: תורה का अर्थ शिक्षा या उपदेश भी हो सकता है, पर यहाँ वाचा-संबंधी अर्थ और यूनानी νόμος ‘व्यवस्था’ का समर्थन करते हैं।
- source_word: עליון / θεοῦ Ὑψίστου
  choice: परमप्रधान
  rationale: इब्रानी में केवल दिव्य उपाधि ‘परमप्रधान’ है; ‘परमप्रधान परमेश्वर’ जोड़ने के बजाय प्राथमिक साक्ष्य की संक्षिप्तता रखी गई है।
theological_decisions:
- issue: इब्रानी עליון और यूनानी θεοῦ Ὑψίστου में दिव्य उपाधि
  choice: परमप्रधान
  alternative: परमप्रधान परमेश्वर
  rationale: मुख्य इब्रानी साक्ष्य में ‘परमेश्वर’ अलग से नहीं है। यूनानी में स्पष्ट किया गया ‘परमेश्वर’ अर्थतः निहित हो सकता है, पर उसे मुख्य पाठ में जोड़ने के बजाय पाठांतर-सूचना में रखा गया है।
- issue: תורת का अर्थ-क्षेत्र
  choice: व्यवस्था
  alternative: शिक्षा / उपदेश
  rationale: वाचा-संबंधी प्रसंग और यूनानी νόμος ‘व्यवस्था’ का समर्थन करते हैं, फिर भी इब्रानी शब्द का व्यापक शिक्षात्मक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष सम्बोधन वाली रखी गई है। ‘हे … मनुष्यो’ स्रोत के पुल्लिंग बहुवचन को दर्शाता है। विस्मयादिबोधक चिह्न मूल के तीखे धिक्कारसूचक स्वर को हिन्दी में व्यक्त करता है।
