translation:
  language: hi
  text: मित्र के संबंध में अपमानजनक बातों के कारण, और किसी भाई को भेंट देने के बाद उसे उलाहना देने से लज्जित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מאוהב
  choice: मित्र के सामने
  rationale: אוהב यहाँ ‘प्रेम करनेवाला’ के व्यापक अर्थ से बढ़कर सामाजिक संबंध में ‘मित्र’ को सूचित करता है। מן को इस लज्जा-सूची के प्रसंग में उस व्यक्ति के सामने किए गए अनुचित आचरण से जोड़कर व्यक्त किया गया है।
- source_word: על דברי חרפה
  choice: अपमानजनक बातें कहने से
  rationale: דברי חרפה अपमान, निन्दा या तिरस्कार से भरे वचनों को दर्शाता है। हिन्दी में क्रियात्मक रूप वाक्य को स्वाभाविक बनाता है, जबकि कथन की नैतिक गंभीरता बनी रहती है।
- source_word: ומאחרי מתת
  choice: और ... भेंट देने के बाद
  rationale: מאחרי समयगत उत्तरकाल को और מתת भेंट अथवा देने के कार्य को सूचित करता है। ‘भेंट देने के बाद’ दोनों अर्थों को सहज हिन्दी में जोड़ता है।
- source_word: אח
  choice: किसी भाई को
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है; ज्ञान-साहित्य में इसका आशय सहोदर से अधिक व्यापक भी हो सकता है, पर पाठ की संबंधपरक विशिष्टता सुरक्षित रखी गई है।
- source_word: מנאץ
  choice: उसे ताना मारने से
  rationale: यह रूप तिरस्कारपूर्वक धिक्कारने या दी हुई वस्तु का उलाहना देने का भाव रखता है। यूनानी ὀνείδιζε भी उलाहना/ताना देने की पुष्टि करता है; इसलिए उपहार के बाद किए जाने वाले अपमान को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: खंडित और अत्यंत संक्षिप्त इब्रानी पंक्ति में निहित आदेश
  choice: आस-पास की लज्जा-सूची से ‘लज्जित हो’ को स्पष्ट रूप से रखा गया और यूनानी समानांतर से दूसरी पंक्ति का निषेधात्मक आशय ग्रहण किया गया।
  alternative: इब्रानी की अधूरी रचना को ज्यों का त्यों रखते हुए बिना मुख्य क्रिया का खंड-वाक्य देना।
  rationale: उपलब्ध इब्रानी प्राथमिक आधार है, पर उसकी वाक्यरचना संक्षिप्त और संदिग्ध है। व्यापक प्रसंग तथा यूनानी समानांतर यह स्पष्ट करते हैं कि ये ऐसे आचरण हैं जिनसे लज्जित होना चाहिए। इससे कोई सांप्रदायिक या विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘लज्जित हो’ को सूची के व्यापक प्रसंग से पूरा किया गया है; ‘ताना मारना’ उपहार देने के बाद उलाहना देकर अपमानित करने का स्वाभाविक हिन्दी भाव देता है।
