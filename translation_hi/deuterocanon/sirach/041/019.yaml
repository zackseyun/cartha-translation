    reason: lexical_alternative
  - marker: b
    text: दूसरे खंड का हिब्रू संक्षिप्त और कुछ अनिश्चित है। यूनानी समानांतर अधिक स्पष्ट रूप से ‘रोटियों पर कोहनी गाड़ने’ की बात करता है; इसी से ‘रोटी पर कोहनी टिकाने’ अनुवाद को समर्थन मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: מהפר
  choice: तोड़ने से
  rationale: हिब्रू मूल का अर्थ किसी बाध्यकारी शपथ या वाचा को तोड़ना, भंग करना या निष्फल करना है। इस लज्जा-सूची में ‘तोड़ना’ स्वाभाविक और नैतिक बलयुक्त है।
- source_word: אלה
  choice: शपथ
  rationale: אלה शाप-संलग्न शपथ या अभिशपथ को सूचित कर सकता है; यहाँ ברית के साथ होने के कारण ‘शपथ’ सबसे स्वाभाविक है, जबकि उसकी शाप-संबंधी अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: וברית
  choice: और वाचा
  rationale: ברית का सामान्य औपचारिक अर्थ ‘वाचा’ है, जो संबंधपरक और बाध्यकारी प्रतिज्ञा को बनाए रखता है।
- source_word: ממטה
  choice: टिकाने से
  rationale: हिब्रू पद कठिन है, पर यूनानी समानांतर में कोहनी को रोटियों पर ‘गाड़ने/जमाने’ का चित्र है। ‘टिकाने’ से मेज़ पर कोहनी का भार रखने का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: אציל
  choice: कोहनी
  rationale: אציל बाँह के जोड़, विशेषकर कोहनी, को दर्शाता है; यूनानी ἀγκών इसकी पुष्टि करता है।
- source_word: אל לחם
  choice: रोटी पर
  rationale: हिब्रू संबंध कुछ असामान्य है, पर यूनानी ἐπ᾿ ἄρτους ‘रोटियों पर’ का समर्थन करता है। हिन्दी में सामूहिक/भोज्य अर्थ वाली एकवचन ‘रोटी’ स्वाभाविक है और चित्र को अनावश्यक रूप से नहीं खोलती।
