  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। मुख्य तुलनात्मक वाक्य सहज हिंदी में है, जबकि कठिन अंतिम इब्रानी पदबंध की वास्तविक अस्पष्टता को खंडात्मक रूप में सुरक्षित रखा गया है; उसे किसी सुनिश्चित उपदेशात्मक कथन में नहीं बदला गया।
