  yaml_path: translation/deuterocanon/sirach/041/015.yaml
  text: Better is a man who hides his folly than a man who hides his wisdom[b][a]; instruction is shame.
translation:
  language: hi
  text: अपनी मूर्खता छिपानेवाला मनुष्य, अपनी बुद्धि छिपानेवाले मनुष्य से अच्छा है[b]; लज्जा की शिक्षा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अंतिम पदबंध कठिन है; उसका शाब्दिक अर्थ लगभग “लज्जा की शिक्षा/ताड़ना” है। यूनानी पाठ में यह पदबंध नहीं है और वहाँ वाक्य “अपनी बुद्धि छिपानेवाले मनुष्य से” पर समाप्त होता है।
    reason: textual_variant
  - marker: b
    text: इब्रानी में एकवचन पुल्लिंग “आदमी” है, जिसका प्रयोग यहाँ सामान्य रूप से किसी भी मनुष्य के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב ... מאיש
  choice: … मनुष्य से अच्छा है
  rationale: טוב के साथ מן तुलना व्यक्त करता है। हिंदी में ‘से अच्छा है’ इस नीतिवचन की तुलनात्मक संरचना को स्वाभाविक और स्पष्ट रूप से रखता है; यूनानी κρείσσων … ἤ भी इसी तुलना की पुष्टि करता है।
- source_word: איש
  choice: मनुष्य
  rationale: इब्रानी का पुल्लिंग एकवचन איש यहाँ प्रतिनिधिक रूप में प्रयुक्त है। ‘मनुष्य’ हिंदी में स्रोत की एकवचन मानवीय संज्ञा और उसके सामान्य अर्थ—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מצפין
  choice: छिपानेवाला
  rationale: दोनों बार आया कृदंत किसी बात को छिपाकर रखनेवाले व्यक्ति को दर्शाता है। एक ही शब्दावली की पुनरावृत्ति मूल वाक्य की संतुलित संरचना बनाए रखती है।
- source_word: אולתו
  choice: अपनी मूर्खता
  rationale: ‘मूर्खता’ ज्ञान-साहित्य में אולת का सामान्य और गरिमापूर्ण हिंदी समतुल्य है। संबंधसूचक प्रत्यय को स्वाभाविक हिंदी में ‘अपनी’ से व्यक्त किया गया है।
- source_word: חכמתו
  choice: अपनी बुद्धि
  rationale: חכמה का यहाँ सीधा अर्थ बुद्धि/प्रज्ञा है। ‘बुद्धि’ सामान्य आधुनिक हिंदी में सहज है और मूर्खता के साथ स्पष्ट विरोध बनाती है।
- source_word: מוסר בשת
  choice: लज्जा की शिक्षा
  rationale: कठिन और संभवतः खंडित पदबंध को बिना अनुमान से क्रियायुक्त पूर्ण वाक्य बनाए, संज्ञात्मक पदबंध के रूप में रखा गया है। מוסר में शिक्षा/अनुशासन और בשת में लज्जा का भाव है।
