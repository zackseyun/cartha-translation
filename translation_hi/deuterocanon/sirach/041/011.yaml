  text: A man's body is vanity[a], but a gracious name will not be cut off.
translation:
  language: hi
  text: मनुष्य की देह क्षणभंगुर है, पर दयालुता का नाम मिटेगा नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में दूसरा खंड भिन्न है: “पापियों का नाम अच्छे रूप में मिटाया नहीं जाएगा” (या “पापियों का नाम सदा के लिए मिटाया नहीं जाएगा”)। इब्रानी साक्ष्य में है: “दयालुता का नाम काटा नहीं जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  choice: क्षणभंगुर
  rationale: यह शब्द साँस या वाष्प की तरह अस्थिरता और नश्वरता का बोध कराता है। इस सूक्तिपरक वाक्य में ‘क्षणभंगुर’ आधुनिक हिन्दी में आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אדם
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधिक मनुष्य की बात है; ‘मनुष्य’ हिन्दी में एकवचन और सार्वभौमिक दोनों अर्थ सहज रूप से रखता है।
- source_word: בגויתו
  choice: अपनी देह में
  rationale: גויה का अर्थ देह अथवा शव हो सकता है। प्रसंग और यूनानी समानांतर का σώμασιν यहाँ जीवित मनुष्य की ‘देह’ के अर्थ का समर्थन करते हैं; ‘शव’ मृत्यु को अनावश्यक रूप से स्पष्ट कर देता।
- source_word: אך
  choice: पर
  rationale: यह देह की क्षणभंगुरता और अच्छे नाम के टिके रहने के बीच विरोध दर्शाता है।
- source_word: שם חסד
  choice: दयालुता से कमाया हुआ नाम
  rationale: शाब्दिक संरचना ‘दयालुता का नाम’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकती है। यह अभिव्यक्ति חסד को मानवीय दयालुता और שם को उससे बनी प्रतिष्ठा के रूप में व्यक्त करती है, पर अर्थ को केवल ‘प्रतिष्ठा’ तक सीमित नहीं करती।
- source_word: לא יכרת
  choice: कभी मिटेगा नहीं
  rationale: כרת का मूल बिंब ‘काट दिया जाना’ है, पर नाम के विषय में हिन्दी का स्वाभाविक मुहावरा ‘मिटना’ है। ‘कभी’ निषेध के स्थायी बल को स्पष्ट करता है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी पाठ और यूनानी समानांतर के बीच महत्त्वपूर्ण पाठांतर
  choice: 'मुख्य पाठ में इब्रानी अर्थ: दयालुता से कमाया हुआ नाम नहीं मिटेगा'
  alternative: 'यूनानी समानांतर का आशय: ‘पापियों का नाम अच्छे रूप में नहीं मिटाया जाएगा’ अथवा ‘सदा के लिए नहीं मिटाया जाएगा’'
  rationale: उपलब्ध और उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य प्राथमिक है। यूनानी पाठ अलग, नकारात्मक कथन देता है; इस वास्तविक पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया है, न कि मुख्य पाठ में मिलाकर सुलझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सूक्तिपरक और सामान्य पाठकों के लिए सहज रूप। ‘क्षणभंगुर’ हבל की नश्वरता को व्यक्त करता है; ‘दयालुता से कमाया हुआ नाम’ שם חסד का स्वाभाविक किंतु स्रोत-संगत निर्वचन है।
