translation:
  language: hi
  text: किसी दूसरे पुरुष की पत्नी के चेहरे पर नज़र गड़ाने से[a], और उसकी दासी के निकट जाने से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद ‘पराई स्त्री’, ‘अजनबी स्त्री’ या ‘विदेशी स्त्री’ भी हो सकता है; समानांतर यूनानी पाठ में ‘विवाहित स्त्री’ है, जो यहाँ ‘किसी दूसरे पुरुष की पत्नी’ अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מהביט
  choice: नज़र गड़ाने
  rationale: הביט का मूल अर्थ ‘देखना’ है; यहाँ लज्जाजनक आचरणों की सूची और यूनानी κατανοήσεως के निकट निरीक्षण के भाव को देखते हुए यह अनैतिक, लगातार देखने का संकेत देता है।
- source_word: אל פני
  choice: के चेहरे पर
  rationale: इब्रानी वाक्यांश का शाब्दिक अर्थ ‘के मुख/चेहरे की ओर’ है। ‘चेहरे पर’ ठोस बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זרה
  choice: किसी दूसरे पुरुष की पत्नी
  rationale: זרה का अर्थ ‘पराई/अपरिचित/विदेशी स्त्री’ हो सकता है, पर ज्ञान-साहित्य में यह निषिद्ध स्त्री का संकेत दे सकता है। समानांतर यूनानी पाठ γυναικὸς ὑπάνδρου स्पष्ट रूप से ‘विवाहित स्त्री’ कहता है; इसलिए प्रसंग में ‘किसी दूसरे पुरुष की पत्नी’ उपयुक्त है।
- source_word: ומהתקרב
  choice: और ... के निकट जाने से
  rationale: קרב का अर्थ पास या निकट जाना है। यह अनावश्यक व्याख्या जोड़े बिना शारीरिक निकटता और प्रसंगगत अनुचितता दोनों को बनाए रखता है।
- source_word: שפחתה
  choice: उसकी दासी
  rationale: שפחה स्त्री दास या घरेलू सेविका को दर्शाता है। ‘दासी’ संक्षिप्त, प्रतिष्ठित और ऐतिहासिक सामाजिक स्थिति के अनुकूल है।
theological_decisions:
- issue: זרה का अर्थ और यूनानी समानांतर का संबंध
  choice: किसी दूसरे पुरुष की पत्नी
  alternative: पराई स्त्री; अपरिचित स्त्री; विदेशी स्त्री; विवाहित स्त्री
  rationale: इब्रानी शब्द अपने आप में व्यापक और कुछ हद तक अस्पष्ट है, जबकि यूनानी समानांतर उसे विवाहित स्त्री के रूप में समझता है। मुख्य पाठ में प्रसंगानुकूल विशिष्ट अर्थ लिया गया है और इब्रानी की वास्तविक व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद मूल सूची के वाक्यखंड की संरचना बनाए रखता है; ‘नज़र गड़ाने’ से अनुचित दृष्टि का भाव आता है, और ‘दासी’ प्राचीन घरेलू अधीनस्थ की सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
