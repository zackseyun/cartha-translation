  language: en
  yaml_path: translation/deuterocanon/sirach/041/012.yaml
  text: Be concerned for your name, for it will go with you more than a thousand stores of wisdom.
translation:
  language: hi
  text: अपने नाम की चिंता कर, क्योंकि वह तेरे साथ जाएगा—बुद्धि के हजारों भंडारों से भी बढ़कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इस वाक्य का भाव है: “क्योंकि वह तेरे लिए सोने के एक हजार बड़े खजानों से अधिक समय तक बना रहेगा।”'
    reason: हिब्रू के ‘बुद्धि के हजारों भंडार’ और यूनानी के ‘सोने के एक हजार बड़े खजाने’ के बीच महत्त्वपूर्ण पाठांतर को पारदर्शी बनाना।
lexical_decisions:
- source_word: פחד על שם
  choice: अपने नाम की चिंता कर
  rationale: פחד על का भाव यहाँ भयभीत होने के बजाय किसी बात के लिए सजग या चिंतित रहने का है। שם को अस्पष्टता बनाए रखते हुए ‘नाम’ रखा गया है; संदर्भ में इसमें प्रतिष्ठा का भाव भी हो सकता है।
- source_word: ילוך
  choice: तेरे साथ जाएगा
  rationale: यह रूप साथ चलने या जाने का भाव देता है। अनुवाद हिब्रू की ठोस और व्यक्तिगत अभिव्यक्ति को बनाए रखता है।
- source_word: מאלפי אוצרות חכמה
  choice: बुद्धि के हजारों भंडारों से भी बढ़कर
  rationale: מאלפי बहुवचन ‘हजारों से’ और אוצרות חכמה का शाब्दिक भाव ‘बुद्धि के भंडार’ है। ‘से भी बढ़कर’ तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘नाम’ को ‘प्रतिष्ठा’ के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘नाम’ रखा गया
  alternative: अपनी प्रतिष्ठा की चिंता कर
  rationale: हिब्रू שם का मूल रूपक और उसकी व्यापक अर्थ-सीमा सुरक्षित रखी गई है; पाठक प्रतिष्ठा का निहितार्थ समझ सकता है, पर अनुवाद उसे एक ही अर्थ तक सीमित नहीं करता।
- issue: हिब्रू और यूनानी पाठ में भिन्नता
  choice: मुख्य पाठ में प्रमाणित हिब्रू ‘बुद्धि’ का अनुसरण किया गया
  alternative: सोने के एक हजार बड़े खजानों से बढ़कर
  rationale: दिया गया हिब्रू स्रोत उच्च विश्वसनीयता वाला प्राथमिक आधार है। यूनानी समानांतर का महत्त्वपूर्ण पाठांतर पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, ज्ञान-साहित्य के अनुरूप और गरिमापूर्ण शैली। एकवचन आज्ञार्थक संबोधन तथा ‘तेरे’ का प्रयोग मूल के व्यक्तिगत संबोधन और पारंपरिक धर्मग्रंथीय लय को बनाए रखता है।
