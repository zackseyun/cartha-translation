base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/018.yaml
  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: hi
  text: स्वामी और स्वामिनी के सामने झूठ से लज्जित हो[a]; सभा और लोगों के सामने अपराध से; साथी और मित्र के सामने विश्वासघात से[b]; और जिस स्थान में तू रहता है[c], वहाँ चोरी से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘स्वामी और स्वामिनी’ है; यूनानी समानांतर में ‘न्यायाधीश और शासक’ है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: इब्रानी מעל का अर्थ ‘अपराध’, ‘निष्ठाभंग’ या ‘भरोसे का उल्लंघन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी वाक्यांश कठिन है; उसका शाब्दिक रूप लगभग ‘उस स्थान से/में जहाँ तू रहता है, पराए के विषय में’ है। यूनानी समानांतर ‘चोरी’ की ओर संकेत करता है, जिसे मुख्य पाठ में अपनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  choice: स्वामी और स्वामिनी के सामने
  rationale: उपलब्ध इब्रानी पाठ में दोनों संज्ञाएँ ‘स्वामी और स्वामिनी’ हैं। लज्जा-सूची के इस प्रसंग में מ־ को स्वाभाविक हिन्दी में ‘के सामने’ कहा गया है।
- source_word: על שקר
  choice: झूठ बोलने से
  rationale: שקר संज्ञा रूप में ‘झूठ’ है; हिन्दी में ‘झूठ बोलने से लज्जित हो’ सूची के आशय को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: מעדה ועם
  choice: सभा और लोगों के सामने
  rationale: עדה का सामान्य अर्थ सभा या समुदाय है। ‘सभा’ व्यापक और गैर-सांप्रदायिक है; עם को यहाँ सामूहिक अर्थ में ‘लोगों’ कहा गया है।
- source_word: על פשע
  choice: अपराध करने से
  rationale: פשע गंभीर उल्लंघन या अपराध को दर्शाता है। ‘अपराध’ नैतिक भार बनाए रखते हुए आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: מחבר ורע
  choice: साथी और मित्र के सामने
  rationale: दोनों शब्द निकट सामाजिक संबंधों को सूचित करते हैं; ‘साथी और मित्र’ उनकी समानांतरता बनाए रखता है।
- source_word: על מעל
  choice: विश्वासघात करने से
  rationale: מעל का अर्थ अनुचित आचरण के साथ भरोसा तोड़ना या निष्ठा भंग करना भी हो सकता है। सामाजिक संदर्भ में ‘विश्वासघात’ इसकी विशिष्टता को सामान्य ‘बुराई’ से बेहतर बचाता है।
- source_word: וממקום תגור
  choice: और जहाँ तू परदेशी होकर रहता है, वहाँ
  rationale: גור में अस्थायी या परदेशी निवास का भाव हो सकता है। यह अनुवाद उस भाव को रखता है, यद्यपि अंतिम इब्रानी वाक्यांश कठिन है।
- source_word: על זר
  choice: चोरी करने से
  rationale: זר अकेले सामान्यतः ‘पराया/अजनबी’ की ओर संकेत करता है और पाठ कठिन है। यूनानी समानांतर ‘चोरी’ का समर्थन करता है; इसलिए मुख्य पाठ में संभावित आशय रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
