  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण उपदेशात्मक शैली रखी गई है। प्राचीन भोज-मुद्रा को मुख्य पाठ में स्पष्ट किया गया है और נבחר की वास्तविक अर्थगत अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
