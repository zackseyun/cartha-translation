  text: Recline like a well-bred man[a], and do not gobble[c][b], lest you become disgusting.
translation:
  language: hi
  text: किसी शिष्ट व्यक्ति की तरह भोजन के लिए टेक लगाकर बैठो[a], और लालच से मत खाओ, कहीं ऐसा न हो कि तुम घृणा के पात्र बनो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी विशिष्ट व्यक्ति की तरह।” इब्रानी पदबंध का भाव कुछ अनिश्चित है, पर प्रसंग में आशय भोजन के समय शिष्ट और संयमित आचरण से है। प्राचीन भूमध्यसागरीय समाज में औपचारिक भोज के समय टेक लगाकर बैठना प्रचलित था।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: स्वीट के यूनानी पाठ में इस स्थान पर इस इब्रानी पंक्ति के अनुरूप पंक्ति नहीं है; इसलिए यहाँ पद-परंपरा में स्रोत-स्तर की असंगति है। यह अनुवाद उपलब्ध इब्रानी पाठ पर आधारित है।
    reason: textual_variant
lexical_decisions:
- source_word: הסב
  choice: भोजन के लिए टेक लगाकर बैठो
  rationale: भोज के प्रसंग में यह क्रिया मेज़ पर टेक लगाकर भोजन करने की प्राचीन मुद्रा को सूचित करती है; केवल ‘बैठो’ कहने से यह सांस्कृतिक अर्थ खो जाता।
- source_word: כאיש אשר נבחר
  choice: किसी शिष्ट व्यक्ति की तरह
  rationale: शाब्दिक अर्थ ‘चुने हुए/विशिष्ट व्यक्ति की तरह’ हो सकता है, पर भोजन-शिष्टाचार के संदर्भ में यह सभ्य और परिष्कृत आचरण बताता है। ‘शिष्ट’ स्वाभाविक हिन्दी में वही सामाजिक-नैतिक भाव व्यक्त करता है।
- source_word: תעט
  choice: लालच से मत खाओ
  rationale: यहाँ क्रिया असभ्य ढंग से जल्दी या पेटूपन से खाने की चेतावनी देती है। ‘लालच से मत खाओ’ सामान्य हिन्दी में स्पष्ट है और अनावश्यक कर्म नहीं जोड़ता।
- source_word: תגעל
  choice: तुम घृणित लगो
  rationale: रूप का आशय ऐसा आचरण करके दूसरों की घृणा का पात्र बनने से है। ‘घृणित लगो’ सामाजिक परिणाम को स्वाभाविक हिन्दी में रखता है, जबकि सम्भावित मध्यवाची भाव को अत्यधिक निश्चित नहीं करता।
