  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: hi
  text: भले ही तुम बहुत-से लोगों के बीच बैठे हो,[b] अपने साथी से पहले भोजन लेने के लिए हाथ मत बढ़ाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, मेज़ पर किसी दूसरे व्यक्ति से पहले भोजन न लो।
    reason: cultural_note
  - marker: b
    text: स्वीट के यूनानी समानांतर पाठ में यहाँ बहुत भिन्न पंक्ति है, जिसका अर्थ है कि ‘अधर्मियों के उपहास अनुग्रह पाने के लिए नहीं हैं।’ इसलिए इस पद के मुख्य पाठ में इब्रानी साक्ष्य का अनुसरण किया गया है और यूनानी पाठ को भिन्न पाठ-परंपरा के रूप में ध्यान में रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: और यदि
  rationale: इब्रानी संयोजक और शर्तसूचक पद को स्वाभाविक हिन्दी में रखता है; प्रसंग में यह पहले निर्देश से जुड़ी हुई परिस्थिति बताता है।
- source_word: בין רבים
  choice: बहुत-से लोगों के बीच
  rationale: बड़े सामाजिक समूह में बैठने का सीधा अर्थ सुरक्षित रहता है, बिना इसे अनावश्यक रूप से ‘भीड़’ कहे।
- source_word: ישבת
  choice: बैठे हो
  rationale: इब्रानी पूर्ण रूप यहाँ सामान्य शर्त की वर्तमान परिस्थिति व्यक्त करता है; आधुनिक हिन्दी में यह रूप स्वाभाविक है।
- source_word: לפני
  choice: से पहले
  rationale: यहाँ स्थान की अपेक्षा क्रम या प्राथमिकता का भाव है—दूसरे व्यक्ति से पहले कार्य करना।
- source_word: רע
  choice: अपने साथी
  rationale: ज्ञान-साहित्य और भोजन-संगति के प्रसंग में רע सहभोजी या साथ बैठे व्यक्ति को सूचित करता है; ‘साथी’ हिन्दी में व्यापक और स्वाभाविक है।
- source_word: אל תושיט יד
  choice: भोजन लेने के लिए हाथ मत बढ़ाओ
  rationale: ‘हाथ मत बढ़ाओ’ मूल बिंब को सुरक्षित रखता है; ‘भोजन लेने के लिए’ निहित भोज-संदर्भ को स्पष्ट करता है, जिसे सांस्कृतिक टिप्पणी भी समझाती है।
