  text: Years of life come from a sound stomach; one rises in the morning, and his life is with him.
translation:
  language: hi
  text: स्वस्थ पेट से जीवन के वर्ष मिलते हैं; मनुष्य सुबह उठता है, और उसका प्राण उसके साथ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שנות חיים
  choice: जीवन के वर्ष
  rationale: इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: קרב
  choice: पेट
  rationale: इस प्रसंग में शब्द शरीर के भीतर के भाग, विशेषतः पेट, को दर्शाता है; ‘अन्तःकरण’ यहाँ अनुपयुक्त होगा।
- source_word: תולל
  choice: स्वस्थ
  rationale: शब्दरूप दुर्लभ और पाठ कुछ कठिन है; उपलब्ध इब्रानी पाठ तथा परामर्श-पाठ के आधार पर अच्छे या ठीक स्वास्थ्य की अवस्था व्यक्त की गई है, पर अर्थ को अनावश्यक रूप से विस्तृत नहीं किया गया।
- source_word: נפשו אתו
  choice: उसका प्राण उसके साथ रहता है
  rationale: ‘נפש’ की मूर्त और कुछ रहस्यमय अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘वह तरोताज़ा रहता है’ कहकर अर्थ-संकुचित नहीं किया गया।
theological_decisions:
- issue: ‘प्राण उसके साथ’ की अभिव्यक्ति
  choice: मूल की शाब्दिक छवि बनाए रखी गई
  alternative: वह जीवित/तरोताज़ा रहता है
  rationale: इब्रानी कथन जीवन, चेतना या स्फूर्ति में से किसी एक अर्थ को स्पष्ट रूप से नहीं चुनता; इसलिए उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: यूनानी समानांतर का भारी पाठांतर
  choice: प्रमुख, उच्च-विश्वसनीयता वाले इब्रानी पाठ का अनुवाद किया गया
  alternative: गरीबों की जीवनदायी रोटी और उसे छीनने वाले के विषय में यूनानी पाठ
  rationale: दिया गया यूनानी पाठ इब्रानी से पूर्णतः भिन्न कथन प्रस्तुत करता है और सम्भवतः पद-संख्या या पाठ-परंपरा के असंगत स्थान से जुड़ा है; अतः उसे मुख्य हिन्दी पाठ में मिश्रित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘उसका प्राण उसके साथ रहता है’ जानबूझकर मूल की असामान्य छवि और अर्थगत तनाव को सुरक्षित रखता है।
