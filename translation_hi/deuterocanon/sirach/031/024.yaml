  text: Pain and sleepless wandering[a], and retching and choking[c][b], and a turned face with a foolish man.
translation:
  language: hi
  text: पीड़ा और नींद का उड़ जाना,[a] उबकाई और गला घुटना,[b] और मूर्ख मनुष्य के साथ बिगड़ा हुआ चेहरा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पंक्ति का हिब्रू पाठ कठिन है, विशेषकर बीच में दिए गए लक्षण और ‘बिगड़ा हुआ चेहरा’ वाक्यांश। इस पद का यूनानी पाठ पूरी तरह भिन्न है; इससे पाठ-परंपरा में बड़ा अंतर दिखाई देता है।
    reason: textual_variant
  - marker: b
    text: या ‘उलटी और गला घुटना।’ हिब्रू रूप अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: या ‘फिरा हुआ चेहरा’ अथवा ‘विकृत मुख-मुद्रा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  choice: पीड़ा
  rationale: यह संज्ञा शारीरिक दर्द या कष्ट को व्यक्त करती है; लक्षणों की इस सूची में ‘पीड़ा’ स्वाभाविक और सटीक है।
- source_word: ונדד ישנה
  choice: नींद का उड़ जाना
  rationale: शाब्दिक चित्र नींद के भटकने या दूर हो जाने का है। आधुनिक हिन्दी में ‘नींद का उड़ जाना’ उसी चित्र को स्वाभाविक ढंग से व्यक्त करता है और अनिद्रा अथवा बेचैन जागरण की गुंजाइश बनाए रखता है।
- source_word: ומער
  choice: उबकाई
  rationale: रूप कठिन है, पर प्रसंग उदर-संबंधी विकार का संकेत देता है। ‘उबकाई’ वास्तविक वमन को अनिवार्य माने बिना रetching की शारीरिक तीव्रता व्यक्त करती है।
- source_word: ותשניק
  choice: गला घुटना
  rationale: यह शब्द घुटने या अवरोध से जुड़ी जड़ से है। लक्षणों की सूची में ‘गला घुटना’ सहज हिन्दी है।
- source_word: ופני הפוכות
  choice: बिगड़ा हुआ चेहरा
  rationale: शाब्दिक अर्थ पलटा या बदला हुआ मुख है। ‘बिगड़ा हुआ चेहरा’ विकृत अथवा फिरा हुआ चेहरा—दोनों संभावनाओं के निकट रहता है, जबकि अनिश्चित मुहावरे को अत्यधिक स्पष्ट नहीं करता।
- source_word: עם איש כסיל
  choice: मूर्ख मनुष्य के साथ
  rationale: यह सीधे हिब्रू एकवचन को प्रस्तुत करता है और ज्ञान-साहित्य में כסיל की नैतिक-बौद्धिक श्रेणी को ‘मूर्ख’ से व्यक्त करता है।
