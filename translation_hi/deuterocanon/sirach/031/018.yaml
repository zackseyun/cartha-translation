base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/018.yaml
  text: Know your neighbor as yourself[a], and in everything you hate[c][b], be considerate.
translation:
  language: hi
  text: अपने पड़ोसी को अपने समान[b] जानो[a], और जिस-जिस बात से तुम घृणा करते हो, उस पर भली-भाँति विचार करो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ इब्रानी से बहुत भिन्न है। उसका लगभग अर्थ है, “वह किस पर ध्यान देता है? और उसका सहारा कौन है?” जहाँ इब्रानी पाठ उपलब्ध है, यहाँ उसी को प्राथमिक माना गया है।
    reason: textual_variant
  - marker: b
    text: या “अपने ही समान।” इब्रानी נפש का अर्थ “प्राण,” “जीवन” या “स्वयं” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम खंड का भाव यह भी हो सकता है: “और जो कुछ तुम्हें अप्रिय है, उस पर सावधानी से विचार करो”—अर्थात जो व्यवहार तुम अपने साथ नहीं चाहते, उसे नैतिक कसौटी बनाओ।'
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  choice: जानो
  rationale: यह ידע का आज्ञार्थक रूप है। ‘जानो’ मूल क्रिया के निकट रहते हुए यहाँ केवल तथ्यगत ज्ञान नहीं, बल्कि दूसरे व्यक्ति को समझने और उसका ध्यान रखने का नैतिक भाव भी व्यक्त कर सकता है।
- source_word: רעך
  choice: अपने पड़ोसी को
  rationale: רע सामाजिक निकटता के किसी साथी या दूसरे व्यक्ति को सूचित करता है। ‘पड़ोसी’ बाइबलीय नैतिक भाषा में स्वाभाविक है, यद्यपि इसका अर्थ केवल पास रहने वाला व्यक्ति नहीं है।
- source_word: כנפשך
  choice: अपने समान
  rationale: נפש का अर्थ ‘प्राण’, ‘जीवन’ या ‘स्वयं’ हो सकता है। इस नैतिक तुलना में ‘अपने समान’ सहज हिन्दी है और व्यक्ति के अपने ही अस्तित्व का भाव बनाए रखता है।
- source_word: ובכל ששנאת
  choice: और जिस-जिस बात से तुम घृणा करते हो
  rationale: यह व्यापक रूप से उन सभी बातों की ओर संकेत करता है जो संबोधित व्यक्ति को अप्रिय या घृणित हैं। ‘जिस-जिस बात’ Hebrew के वितरक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: התבונן
  choice: उस पर भली-भाँति विचार करो
  rationale: התבונן विचारपूर्वक ध्यान देने और विवेक से परखने की आज्ञा है। यह अनुवाद मूल के मननशील नैतिक आग्रह को बिना कोई अप्रकट कर्म जोड़ने के व्यक्त करता है।
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: मुख्य पाठ में नहीं अपनाया; केवल पाठ-साक्ष्य के रूप में दर्ज किया
  rationale: यूनानी समानांतर इब्रानी से बहुत भिन्न है और संभवतः अलग पाठ-रूप या पद-विन्यास दर्शाता है। जहाँ इब्रानी उपलब्ध है, मुख्य अनुवाद उसी का अनुसरण करता है।
theological_decisions:
- issue: प्रसिद्ध आज्ञा ‘अपने पड़ोसी से अपने समान प्रेम करो’ के साथ संभावित सामंजस्य
  choice: इब्रानी के ज्ञान/पहचान वाले शब्द को ‘जानो’ के रूप में रखा
  alternative: अपने पड़ोसी से अपने समान प्रेम करो
  rationale: यहाँ इब्रानी पाठ ידע का रूप प्रयोग करता है, ‘प्रेम करना’ नहीं। इसलिए अधिक परिचित बाइबलीय सूत्र को इस पद में आरोपित नहीं किया गया।
- issue: अंतिम खंड में निहित नैतिक कसौटी
  choice: स्पष्ट कथन तक सीमित रहकर ‘उस पर भली-भाँति विचार करो’
  alternative: जो बात तुम्हें अपने लिए बुरी लगती है, वह दूसरे के साथ मत करो
  rationale: ऐसी निषेधात्मक नैतिक कसौटी संदर्भ से समझी जा सकती है, पर इब्रानी में ‘मत करो’ स्पष्ट रूप से नहीं है। मुख्य पाठ मूल की संक्षिप्तता और संभावित निहितार्थ दोनों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जानो’ मूल इब्रानी के निकट है; ‘भली-भाँति विचार करो’ התבונן की विचारशील गंभीरता व्यक्त करता है। पद को अधिक परिचित ‘प्रेम करो’ वाली आज्ञा से जानबूझकर नहीं मिलाया गया।
