base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
translation:
  language: hi
  text: बहुत-से लोग सोने के कारण बरबाद हुए, और मोतियों[a] पर भरोसा करने के कारण भी। वे विपत्ति से बच निकलने का उपाय न पा सके, और न प्रकोप के दिन छुटकारा पा सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘मोती’ या अधिक व्यापक रूप से ‘बहुमूल्य रत्न’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “यदि वह परमप्रधान की ओर से न्याय के समय न भेजा जाए, तो उन पर अपना मन न लगा।” मुख्य अनुवाद उपलब्ध इब्रानी पाठ का अनुसरण करता है, जो चेतावनी देता है कि धन पर भरोसा विपत्ति से बचने या प्रकोप के दिन छुटकारा पाने में सहायक नहीं होता।'
    reason: textual_variant
lexical_decisions:
- source_word: חבולי
  choice: बरबाद हुए
  rationale: शब्द का मूल भाव घायल या क्षतिग्रस्त होने का है; धन के संदर्भ में ‘बरबाद हुए’ नैतिक और व्यावहारिक पतन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הבוטח על פנינים
  choice: मोतियों पर भरोसा करने वाले का भी यही हाल हुआ
  rationale: इब्रानी बहुवचन कथन से एकवचन कृदंत की ओर मुड़ता है और दूसरी उपवाक्य-रचना संक्षिप्त है। ‘भी यही हाल हुआ’ पहले कथन में निहित क्रिया को स्पष्ट करते हुए इस संख्या-परिवर्तन को बनाए रखता है।
- source_word: פנינים
  choice: मोती
  rationale: यह प्रचलित और संभव अर्थ है, यद्यपि शब्द व्यापक रूप से बहुमूल्य रत्नों को भी सूचित कर सकता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: להנצל מרעה
  choice: बुराई से बचने का मार्ग
  rationale: רעה नैतिक बुराई, हानि या विपत्ति का बोध करा सकता है। ‘बुराई’ इसकी व्यापकता बनाए रखता है, और ‘बचने का मार्ग न पा सके’ מצאו להנצל की हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: להושע
  choice: उद्धार हुआ
  rationale: यह बचाए या छुड़ाए जाने का भाव देता है। यहाँ ‘उद्धार’ न्याय के गंभीर प्रसंग के अनुकूल है, पर इसे किसी बाद की विशिष्ट धर्मसैद्धांतिक परिभाषा तक सीमित नहीं करता।
- source_word: ביום עברה
  choice: प्रकोप के दिन
  rationale: עברה तीव्र क्रोध अथवा रोष को दर्शाता है और यहाँ न्याय के समय की ओर संकेत करता है; ‘प्रकोप’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण किया गया है और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
  alternative: 'यूनानी के अनुसार: “यदि वह परमप्रधान की ओर से निरीक्षण के समय न भेजा जाए, तो उन पर अपना मन न लगा।”'
  rationale: इस पद का इब्रानी साक्ष्य उपलब्ध और उच्च विश्वास वाला है, इसलिए वही मुख्य आधार है। फिर भी यूनानी साक्ष्य बिल्कुल भिन्न वाक्य देता है; पाठगत तनाव को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: धन पर भरोसा और न्याय के दिन उद्धार
  choice: पाठ को इस चेतावनी के रूप में रखा गया है कि बहुमूल्य धन पर भरोसा बुराई से बचाव या प्रकोप के दिन उद्धार सुनिश्चित नहीं करता।
  alternative: इसे केवल सांसारिक आर्थिक हानि तक सीमित समझना।
  rationale: ‘प्रकोप के दिन’ न्याय का गंभीर आयाम रखता है, पर पाठ यह निश्चित नहीं करता कि वह किसी एक विशिष्ट अंतिम-काल संबंधी सिद्धांत का तकनीकी नाम है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। इब्रानी की संक्षिप्त दूसरी उपवाक्य-रचना को ‘भी यही हाल हुआ’ से स्वाभाविक बनाया गया है, जबकि एकवचन से बहुवचन की गति और पाठगत अस्पष्टता को यथासंभव बनाए रखा गया है।
