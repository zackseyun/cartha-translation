  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: hi
  text: 'यदि तुम पर दबाव डाला भी जाए[b], तो स्वादिष्ट व्यंजनों के लिए धीरज से प्रतीक्षा करो, और इससे तुम्हें चैन मिलेगा।[a]


    [a] यूनानी समानांतर पाठ में है, “एक व्यक्ति प्रार्थना करता है और दूसरा शाप देता है—स्वामी किसकी आवाज़ सुनेगा?” यह यहाँ उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ-परंपरा को दर्शाता है।


    [b] इस पद का इब्रानी पाठ अनिश्चित है और यूनानी साक्ष्य से बहुत अलग है। “तुम पर दबाव डाला भी जाए” एक कठिन इब्रानी रूप का अनुवाद है, जिसका अर्थ “तुम्हें विवश किया जाए” या “तुम दबाव में हो” भी हो सकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “एक व्यक्ति प्रार्थना करता है और दूसरा शाप देता है—स्वामी किसकी आवाज़ सुनेगा?” यह यहाँ उपलब्ध इब्रानी पाठ से बहुत भिन्न पाठ-परंपरा को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: इस पद का इब्रानी पाठ अनिश्चित है और यूनानी साक्ष्य से बहुत अलग है। “तुम पर दबाव डाला भी जाए” एक कठिन इब्रानी रूप का अनुवाद है, जिसका अर्थ “तुम्हें विवश किया जाए” या “तुम दबाव में हो” भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: यदि ... भी
  rationale: וגם और אם के संयोजन की रियायती-शर्तसूचक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נאנסתה
  choice: तुम पर दबाव भी डाला जाए
  rationale: אנס से विवशता या दबाव का अर्थ सुरक्षित रहता है; भोजन के प्रसंग में अनावश्यक यौन अर्थ नहीं आता, और कठिन इब्रानी रूप की व्यापकता बनी रहती है।
- source_word: במטעמים
  choice: स्वादिष्ट व्यंजनों के लिए
  rationale: מטעמים स्वादिष्ट, रुचिकर या चुनिंदा पकवानों को दर्शाता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: קוה קוה
  choice: धीरज से प्रतीक्षा करो
  rationale: दोहराए गए रूप का बल स्वाभाविक हिन्दी में लगातार और धैर्यपूर्ण प्रतीक्षा द्वारा व्यक्त किया गया है, बिना कृत्रिम शब्द-दोहराव के।
- source_word: וינוח לך
  choice: और इससे तुम्हें चैन मिलेगा
  rationale: נוח के विश्राम या सहजता के भाव और לך के लाभार्थक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; अस्पष्ट कर्ता को “इससे” द्वारा बहुत कठोरता से निर्धारित नहीं किया गया।
theological_decisions:
- issue: इब्रानी मुख्य पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और पादटिप्पणी में पूरा यूनानी वैकल्पिक पाठ
  alternative: “एक व्यक्ति प्रार्थना करता है और दूसरा शाप देता है—स्वामी किसकी आवाज़ सुनेगा?”
  rationale: सिराख का इब्रानी पाठ उपलब्ध होने पर उसे प्राथमिकता दी गई है, पर यूनानी साक्ष्य एक मामूली पाठांतर नहीं बल्कि बिल्कुल अलग वचन देता है; इसलिए अंतर को स्पष्ट रूप से सुरक्षित रखा गया है।
- issue: נאנסתה के कठिन और अनिश्चित अर्थ का निर्वचन
  choice: तुम पर दबाव भी डाला जाए
  alternative: तुम्हें विवश किया जाए; तुम दबाव में हो
  rationale: यह चयन भोजन-संबंधी प्रसंग में दबाव या विवशता का अर्थ देता है और पाठ की अनिश्चितता को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में सहज “तुम”; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। इब्रानी की पुनरुक्ति को हिन्दी में “धीरज से” द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
