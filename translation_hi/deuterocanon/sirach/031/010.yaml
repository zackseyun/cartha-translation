base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: hi
  text: कौन है वह[a] जो उससे लिपटा रहा, और उसे शांति मिली, और यह उसके लिए गौरव का कारण बना? क्योंकि उसके जीवन में भरपूर शांति होने से यह तुम्हारे लिए गौरव की बात होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी पाठ कठिन है और यूनानी पाठ से साफ़ मेल नहीं खाता। यहाँ मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का निकट अनुवाद है।
    reason: textual_difficulty
  - marker: b
    text: 'यूनानी पाठ में एक बहुत भिन्न वाक्य मिलता है: “जिसकी थोड़े में परीक्षा नहीं हुई, वह थोड़ा जानता है।” यह संभवतः किसी दूसरे पाठ-रूप को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  choice: कौन है वह
  rationale: इब्रानी के आलंकारिक पहचान-प्रश्न को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שנדבק בו
  choice: जो उससे लिपटा रहा
  rationale: דבק का मूल भाव ‘लिपटे रहना/दृढ़ता से जुड़े रहना’ है। ‘उससे’ मूल पाठ के अस्पष्ट सर्वनाम को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
- source_word: והיה לו שלום
  choice: और उसे शांति मिली
  rationale: שלום को उसके सामान्य अर्थ ‘शांति/कुशलता’ में रखा गया है; ‘सिद्ध हो गया’ कहना स्रोत में निहित अर्थ से आगे जाता।
- source_word: והיה לו תפארה
  choice: और यह उसके लिए गौरव का कारण बना
  rationale: תפארה के गौरव, सम्मान या प्रशंसा के भाव को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: כי ברבות שלום חייו
  choice: क्योंकि उसके जीवन में भरपूर शांति होने से
  rationale: कठिन इब्रानी वाक्यांश को यथासंभव उसके उपलब्ध शब्दों—बहुतायत, शांति और जीवन—के निकट रखते हुए पठनीय बनाया गया है।
- source_word: יהיה לך לתפארת
  choice: यह तुम्हारे लिए गौरव की बात होगी
  rationale: द्वितीय पुरुष ‘तुम्हारे लिए’ और भावी रूप दोनों को सुरक्षित रखता है, भले ही पहले के तृतीय पुरुष से इसका संबंध पाठगत रूप से कठिन हो।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी के अनुसार: ‘जिसकी थोड़े में परीक्षा नहीं हुई, वह थोड़ा जानता है।’'
  rationale: दिया गया इब्रानी पाठ पूर्ण है और उच्च विश्वसनीयता के साथ प्रस्तुत है, यद्यपि कठिन तथा यूनानी से असंगत है। इसलिए मुख्य पाठ इब्रानी को अनुसरता है और वास्तविक यूनानी भिन्नता पादटिप्पणी में पारदर्शी रूप से दी जाती है।
- issue: अस्पष्ट सर्वनाम בו का संदर्भ
  choice: ‘उससे’ कहकर अस्पष्टता बनाए रखना
  alternative: इसे धन, सोना अथवा किसी परीक्षा से स्पष्ट रूप से जोड़ना
  rationale: निकटवर्ती प्रसंग संभव संदर्भ सुझा सकता है, पर इस पद के इब्रानी रूप में उसका स्पष्ट नाम नहीं है; अनुवाद में उसे जोड़ना अनिश्चितता को अनुचित रूप से समाप्त करता।
- issue: תפארה का भाव
  choice: गौरव
  alternative: घमंड करने का आधार
  rationale: ‘गौरव’ मूल शब्द के सम्मान/महिमा संबंधी अर्थ को तटस्थ ढंग से रखता है और नैतिक रूप से नकारात्मक ‘घमंड’ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल इब्रानी की असामान्यता—विशेषकर अस्पष्ट ‘उससे’, शांति की पुनरावृत्ति और ‘उसके’ से ‘तुम्हारे’ की ओर परिवर्तन—को सहज व्याख्या से मिटाने के बजाय यथासंभव सुरक्षित रखा गया है।
