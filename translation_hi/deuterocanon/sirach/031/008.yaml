base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/008.yaml
  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो निर्दोष पाया गया है,[a] और जो धन के पीछे भटका नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का यूनानी समानांतर पाठ बचे हुए हिब्रू पाठ से बहुत भिन्न है। यहाँ अनुवाद हिब्रू का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: दूसरे उपवाक्य का हिब्रू पाठ कठिन है। इसका अर्थ यह भी हो सकता है, “जिसे धन ने पथभ्रष्ट नहीं किया है,” या “जो धन के मामले में सही मार्ग से नहीं हटा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: धन्य है
  rationale: यह हिब्रू ज्ञान-साहित्य में आशीर्वचन का प्रचलित सूत्र है; ‘धन्य’ उसके गरिमापूर्ण और वस्तुनिष्ठ भाव को बनाए रखता है।
- source_word: איש
  choice: वह मनुष्य
  rationale: मूल पाठ पुल्लिंग एकवचन में है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और स्रोत के रूप को बनाए रखता है।
- source_word: נמצא
  choice: पाया गया है
  rationale: हिब्रू के कर्मवाच्य अर्थ और जाँच में ऐसा सिद्ध होने के भाव को सीधे व्यक्त करता है।
- source_word: תמים
  choice: निर्दोष
  rationale: यहाँ नैतिक खराई और निष्कलंक आचरण अभिप्रेत है, पापरहित पूर्णता नहीं।
- source_word: ויחר ממון
  choice: धन के पीछे
  rationale: प्राप्त हिब्रू कठिन है। संदर्भ में इसे धन के संबंध में अथवा धन के पीछे जाने के अर्थ में लेना संभावित है; यह रूप अनिश्चितता को अत्यधिक पुनर्निर्माण के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לא נלוז
  choice: भटका नहीं है
  rationale: यह सही मार्ग से हटने का नैतिक बिंब बनाए रखता है और धन के कारण अथवा धन की खोज में पथभ्रष्ट होने का संभावित अर्थ देता है।
theological_decisions:
- issue: धन से संबंधित दूसरे उपवाक्य का कठिन हिब्रू पाठ
  choice: जो धन के पीछे भटका नहीं है
  alternative: जिसे धन ने पथभ्रष्ट नहीं किया है; जो धन के मामले में सही मार्ग से नहीं हटा है
  rationale: हिब्रू में ‘धन’ और ‘नहीं भटका’ स्पष्ट हैं, पर उनके बीच का व्याकरणिक संबंध कठिन है। चुना हुआ पाठ मूल के मुख्य तत्वों को रखता है और किसी एक कारणात्मक व्याख्या को निश्चित नहीं बनाता।
- issue: हिब्रू और यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू का अनुसरण
  alternative: यूनानी के अनुसार व्यवस्था और विश्वासयोग्य मुख में बुद्धि की पूर्णता का कथन
  rationale: दिया गया यूनानी पाठ हिब्रू से बहुत अलग है। चूँकि हिब्रू साक्ष्य उपलब्ध और उच्च विश्वास वाला है, अनुवाद उसी पर आधारित है; पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन्य’, ‘निर्दोष’ और ‘भटका’ ज्ञान-साहित्य के नैतिक स्वर को बनाए रखते हैं; कठिन पाठ को मुख्य वाक्य में स्वाभाविक बनाया गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
