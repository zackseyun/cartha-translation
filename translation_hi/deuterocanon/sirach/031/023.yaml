  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
translation:
  language: hi
  text: क्या थोड़ा-सा समझदार मनुष्य के लिए पर्याप्त नहीं है? वह अपने बिस्तर पर हाँफता नहीं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हाँफता नहीं’ वाला पद कुछ अनिश्चित है; उपलब्ध इब्रानी पाठ कठिन है, पर प्रसंग का आशय यह प्रतीत होता है कि संयम से खाने वाला बिस्तर पर शारीरिक व्याकुलता नहीं सहता।
    reason: textual_variant
  - marker: b
    text: स्रोत-सामग्री में इस पद के साथ दिया गया यूनानी समानांतर इब्रानी पंक्ति से मेल नहीं खाता और संभवतः किसी दूसरे पद का पाठ है। इसलिए अनुवाद में इब्रानी को मुख्य साक्ष्य माना गया है, साथ ही उसकी अनिश्चितता भी बताई गई है।
    reason: textual_variant
lexical_decisions:
- source_word: הלא
  choice: क्या ... नहीं?
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं?’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: די
  choice: पर्याप्त
  rationale: यह शब्द पर्याप्तता का भाव देता है; यहाँ ‘पर्याप्त’ सटीक और सहज है।
- source_word: אנוש
  choice: मनुष्य
  rationale: यह नश्वर मानव या व्यक्ति को सूचित करता है; एकवचन नीतिवचनात्मक रूप को ‘मनुष्य’ सुरक्षित रखता है।
- source_word: נבון
  choice: समझदार
  rationale: यह व्यावहारिक समझ और विवेक पर बल देता है; भोजन में संयम के प्रसंग में ‘समझदार’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מזער
  choice: थोड़ा-सा
  rationale: यह अल्प मात्रा को सूचित करता है और ‘पर्याप्त’ के साथ सहज हिन्दी बनाता है।
- source_word: יצועיו
  choice: अपने बिस्तर पर
  rationale: शब्द शय्या या बिछौने को सूचित करता है; इस प्रसंग में ‘बिस्तर’ सामान्य पाठक के लिए सबसे स्पष्ट है।
- source_word: לא ישיק
  choice: वह हाँफता नहीं
  rationale: इब्रानी पद कठिन और कुछ अनिश्चित है। ‘हाँफता नहीं’ शारीरिक व्याकुलता को व्यक्त करता है, पर उलटी, घुटन या किसी अन्य विशिष्ट लक्षण को अनावश्यक रूप से निश्चित नहीं करता।
