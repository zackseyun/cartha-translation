  yaml_path: translation/deuterocanon/sirach/031/015.yaml
  text: An evil eye hates God[b][a], and he created nothing worse than it.
translation:
  language: hi
  text: बुरी आँख वाला व्यक्ति परमेश्वर से घृणा करता है,[a] और उससे बुरा कुछ भी नहीं रचा गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बुरी आँख’; यह इब्रानी मुहावरा कंजूस, ईर्ष्यालु, या दूसरों की भलाई से कुढ़ने वाले व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी का अंतिम खंड संक्षिप्त है। उसमें क्रिया सक्रिय रूप में है, पर कर्ता स्पष्ट नहीं किया गया; ‘उससे’ व्यक्ति अथवा उसकी बुरी प्रवृत्ति की ओर संकेत कर सकता है। यूनानी समानांतर में इसके स्थान पर एक सर्वथा भिन्न वाक्य है: ‘क्योंकि उनकी आशा उनका उद्धार करने वाले पर है।’'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: बुरी आँख वाला
  rationale: इब्रानी मुहावरे का ठोस चित्र बनाए रखते हुए इसे स्वाभाविक हिन्दी व्यक्ति-संज्ञा के रूप में दिया गया है; इसका आशय कंजूस, ईर्ष्यालु या दूसरों की भलाई से कुढ़ने वाले व्यक्ति से हो सकता है।
- source_word: שונא
  choice: घृणा करता है
  rationale: क्रिया का सीधा अर्थ ‘घृणा करना’ है और उपलब्ध इब्रानी वाक्य-विन्यास में ‘बुरी आँख वाला’ इसका स्वाभाविक कर्ता है।
- source_word: אל
  choice: परमेश्वर
  rationale: ज्ञान-साहित्य में אל यहाँ ईश्वर के लिए प्रयुक्त पद है; आधुनिक गरिमापूर्ण हिन्दी में ‘परमेश्वर’ स्पष्ट है।
- source_word: ורע ממנו לא ברא
  choice: और उसने उससे बुरा कुछ नहीं रचा
  rationale: संक्षिप्त इब्रानी खंड में ברא सृष्टि की भाषा है। ‘उसने’ का संभावित कर्ता परमेश्वर है, जबकि ‘उससे’ का संदर्भ बुरी आँख वाले व्यक्ति अथवा उस प्रवृत्ति की ओर खुला रहता है।
theological_decisions:
- issue: पहले खंड का कर्ता और यूनानी समानांतर से तीखा पाठांतर
  choice: उपलब्ध इब्रानी पाठ को आधार बनाकर ‘बुरी आँख वाला परमेश्वर से घृणा करता है’
  alternative: 'यूनानी पाठ: ‘क्योंकि उनकी आशा उनका उद्धार करने वाले पर है’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वही प्राथमिक साक्ष्य है। यूनानी वाक्य निकट अनुवाद नहीं बल्कि एक सर्वथा भिन्न पाठ-रूप दर्शाता है, इसलिए उसे पाद-टिप्पणी में दर्ज किया गया है।
- issue: दूसरे खंड में निहित कर्ता और सर्वनाम का संदर्भ
  choice: ‘उसने उससे बुरा कुछ नहीं रचा’—परमेश्वर को संभावित कर्ता रखते हुए तुलना का संदर्भ खुला रखा गया
  alternative: ‘और उससे बुरा कोई रचा नहीं गया’
  rationale: इब्रानी में कर्ता व्यक्त नहीं है और ממנו का संदर्भ व्यक्ति या प्रवृत्ति, दोनों की ओर समझा जा सकता है। सक्रिय हिन्दी मूल के सृष्टि-संबंधी बल को बनाए रखती है, जबकि पाद-टिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘बुरी आँख वाला’ मूल इब्रानी बिंब को बचाता है और पाद-टिप्पणी मुहावरे का अर्थ स्पष्ट करती है। मुख्य पाठ में इब्रानी की सर्वनामगत अस्पष्टता को अनावश्यक रूप से पूरी तरह नहीं सुलझाया गया है।
