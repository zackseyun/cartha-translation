- source_word: שקר עשיר
  choice: धनी मनुष्य की अनिद्रा
  rationale: प्राप्त इब्रानी पाठ का यह पदबंध कठिन है। निकट संदर्भ और दूसरी पंक्ति में नींद के चले जाने को देखते हुए ‘अनिद्रा’ अर्थ-संगत है; ‘धनी मनुष्य’ עשיר के एकवचन व्यक्तिवाचक प्रकार को बनाए रखता है।
- source_word: ימחה שארו
  choice: उसके शरीर को क्षीण कर देती है
  rationale: שארו का शारीरिक अर्थ यहाँ समानांतरता में उपयुक्त है। ‘क्षीण कर देती है’ धीरे-धीरे शारीरिक ह्रास का स्वाभाविक हिन्दी बोध देता है।
- source_word: דאגת מחיה
  choice: जीविका की चिंता
  rationale: דאגה व्याकुल चिंता और מחיה जीवन-निर्वाह के साधनों को सूचित करता है; यह संक्षिप्त और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: תפריע נומה
  choice: नींद उड़ा देती है
  rationale: यह हिन्दी मुहावरा नींद को बाधित करके दूर कर देने का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
