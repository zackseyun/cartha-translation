translation:
  language: hi
  text: मेरे बेटे, सुन और मेरी बातें स्वीकार कर; मेरा उपहास न कर, और अंत में तू मेरी बातें पाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक अलग कथन है: जो मनुष्य अपने पापों के लिए उपवास करके फिर वही काम करता है, उसकी प्रार्थना कौन सुनेगा, और उसके दीन होने से क्या लाभ हुआ?'
    reason: इस पद पर इब्रानी और यूनानी पाठ-परम्पराओं के बड़े अन्तर को पाठक के सामने स्पष्ट रखना।
lexical_decisions:
- source_word: שמע
  choice: सुन
  rationale: यह सीधे संबोधन में ध्यान देकर सुनने की आज्ञा है।
- source_word: וקח אמרי
  choice: और मेरी बातें मान
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर वचनों के साथ इसका स्वाभाविक आशय उन्हें स्वीकार करना और मानना है।
- source_word: תלעיז עליי
  choice: मेरे विरुद्ध बुरा न बोल
  rationale: הלעיז על का अर्थ किसी के विरुद्ध अपमानजनक या निन्दात्मक बात कहना है; यह ‘अस्वीकार करना’ मात्र से अधिक विशिष्ट है।
- source_word: תמצא דברי
  choice: तू मेरी बातों को समझेगा
  rationale: शाब्दिक रूप ‘तू मेरी बातें पाएगा’ हिन्दी में अस्पष्ट और अस्वाभाविक है। यहाँ ‘पाना’ का आशय अन्ततः उनकी सच्चाई या सार को जान लेने से है; ‘समझेगा’ इसे बिना ‘सत्य’ जैसे अतिरिक्त शब्द जोड़े व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों का बड़ा अन्तर
  choice: मुख्य पाठ में प्रमाणित इब्रानी पाठ का अनुवाद
  alternative: यूनानी समानान्तर पाठ, जिसमें पापों के लिए उपवास करके फिर वही काम करने वाले व्यक्ति की प्रार्थना पर प्रश्न है
  rationale: दिया गया इब्रानी स्रोत उच्च विश्वास वाला है और इस परियोजना में मूल-भाषा स्रोत से पहले अनुवाद करना अपेक्षित है। यूनानी पाठ सम्भवतः भिन्न पाठ-परम्परा या पद-संख्या को दर्शाता है, इसलिए उसे मुख्य पाठ में मिलाया नहीं गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; पिता-सदृश प्रत्यक्ष संबोधन के कारण एकवचन ‘तू’ रखा गया है। ‘बुरा न बोल’ इब्रानी की निन्दात्मक वाणी को स्पष्ट करता है, जबकि अन्तिम वाक्य की संक्षिप्तता और हल्का अर्थगत तनाव सुरक्षित रखा गया है।
