base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/005.yaml
  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: hi
  text: जो धन के पीछे दौड़ता है, वह दण्ड से नहीं बचेगा[a][b]; और जो लाभ से प्रेम करता है, वह उसी के कारण भटक जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बचे हुए इब्रानी पाठ में धन के पीछे दौड़ने और लाभ से प्रेम करने के विषय में यह नीतिवचन है। इसके विपरीत, इस पद का यूनानी पाठ कहता है: “भविष्य-कथन, शकुन और स्वप्न व्यर्थ हैं; प्रसव-पीड़ा से तड़पती स्त्री के समान हृदय कल्पनाएँ करता है।” जान पड़ता है कि यह एक बहुत भिन्न पाठ-परम्परा को दर्शाता है।'
    reason: textual_variant
  - marker: b
    text: “धन” के स्थान पर “सोना” या “सम्पत्ति” भी सम्भव है; इब्रानी शब्द विशेष रूप से भौतिक सम्पदा का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: “लाभ” के स्थान पर “मूल्य” या “भुगतान” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רודף
  choice: पीछे दौड़ता है
  rationale: इब्रानी कृदन्त लगातार और सक्रिय रूप से किसी वस्तु का पीछा करने का भाव देता है। यह हिन्दी प्रयोग उस प्रबल लालसा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חרוץ
  choice: धन
  rationale: यह शब्द यहाँ सोने अथवा भौतिक सम्पत्ति का बोध करा सकता है। समानान्तर पंक्ति के מחיר को देखते हुए व्यापक और सहज शब्द ‘धन’ चुना गया है।
- source_word: לא ינקה
  choice: दण्ड से नहीं बचेगा
  rationale: इस इब्रानी मुहावरे का अर्थ निर्दोष ठहरना अथवा दण्ड से बच निकलना हो सकता है। प्रसंग में परिणाम को स्पष्ट करने के लिए ‘दण्ड से नहीं बचेगा’ उपयुक्त है।
- source_word: אוהב
  choice: जो ... प्रेम करता है
  rationale: कृदन्त को सामान्य व्यक्ति के लिए संबंधवाचक रचना में दिया गया है, जिससे दोनों पंक्तियों की नीतिवचनात्मक शैली बनी रहती है।
- source_word: מחיר
  choice: लाभ
  rationale: शब्द का मूल अर्थ ‘मूल्य’ या ‘भुगतान’ भी हो सकता है, पर यहाँ आर्थिक लाभ से आसक्ति का भाव प्रसंगानुकूल है।
- source_word: בו
  choice: उसी के कारण
  rationale: 'पूर्वसर्ग को कारणसूचक माना गया है: जिस लाभ से व्यक्ति प्रेम करता है, वही उसके भटकने का कारण बनता है।'
- source_word: ישגה
  choice: भटक जाएगा
  rationale: क्रिया भूल करने या सही मार्ग से हट जाने का अर्थ देती है। ‘भटक जाएगा’ नैतिक और व्यावहारिक दोनों अर्थों को खुला रखता है।
theological_decisions:
- issue: इब्रानी पाठ और अत्यन्त भिन्न यूनानी समानान्तर पाठ में चयन
  choice: उपलब्ध इब्रानी पाठ का अनुवाद किया गया है और यूनानी पाठ का बड़ा अन्तर पादटिप्पणी में बताया गया है।
  alternative: 'यूनानी पाठ के अनुसार: ‘भविष्य-कथन, शकुन और स्वप्न व्यर्थ हैं; प्रसव-पीड़ा से तड़पती स्त्री के समान हृदय कल्पनाएँ करता है।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए उसे आधार बनाया गया है। फिर भी यूनानी में कोई छोटा पाठभेद नहीं, बल्कि सर्वथा अलग कथन है; अतः दोनों को मिलाए बिना इस अन्तर को स्पष्ट रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। दोनों अर्ध-पंक्तियों की समानान्तर रचना सुरक्षित है और आर्थिक लालसा के नैतिक परिणाम को बिना अतिरिक्त साम्प्रदायिक व्याख्या के व्यक्त किया गया है।
