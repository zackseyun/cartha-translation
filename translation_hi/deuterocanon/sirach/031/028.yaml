  text: In all your deeds be modest[a], and no disaster will touch you.
translation:
  language: hi
  text: अपने सभी कामों में मर्यादा[a] रखो, और कोई विपत्ति तुम्हें छू न सकेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यहाँ एक बहुत भिन्न पाठ मिलता है: “एक बनाता है और दूसरा ढा देता है; इससे उन्हें परिश्रम के सिवा क्या लाभ हुआ?” इस पद का अनुवाद उपलब्ध इब्रानी पाठ से किया गया है, जो यूनानी पाठ-परंपरा से बहुत अलग है।'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: अपने सब कामों में
  rationale: यह पदबंध व्यक्ति के समस्त आचरण और कार्यों के क्षेत्र को समेटता है। ‘कामों’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ नैतिक आचरण का भाव भी ग्रहण कर सकता है।
- source_word: היה צנוע
  choice: विनम्र रहो
  rationale: צנוע में विनय, मर्यादा और संयमित व्यवहार का भाव है। ‘विनम्र’ सहज और गरिमापूर्ण हिन्दी में इस सामाजिक-नैतिक अर्थ को व्यक्त करता है; इसे केवल आंतरिक दीनता या आत्म-संयम तक सीमित नहीं करता।
- source_word: אסון
  choice: विपत्ति
  rationale: אסון गंभीर अनिष्ट, संकट या दुर्घटना को सूचित करता है। ‘विपत्ति’ व्यापक है और किसी एक प्रकार की हानि को अनावश्यक रूप से निर्दिष्ट नहीं करती।
- source_word: לא יגע בך
  choice: तुम्हें छू न सकेगी
  rationale: यह अनुवाद נגע के ‘छूना/पहुँचना’ वाले चित्र को बनाए रखता है। हिन्दी में ‘छू न सकेगी’ हानि के व्यक्ति तक न पहुँचने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἷς οἰκοδομῶν καὶ εἷς καθαιρῶν, τί ὠφέλησαν πλεῖον ἢ κόπους;
  choice: मुख्य पाठ में नहीं; पाठांतर के रूप में पादटिप्पणी में
  rationale: यूनानी पाठ उपलब्ध इब्रानी से मूलतः भिन्न पाठ-परंपरा दर्शाता है। उपलब्ध इब्रानी को मुख्य पाठ में रखते हुए इस महत्त्वपूर्ण भिन्नता को पादटिप्पणी में सुरक्षित रखना उचित है।
theological_decisions:
- issue: विनम्र आचरण और विपत्ति से सुरक्षा के बीच कथन का संबंध
  choice: इसे ज्ञान-साहित्य की प्रत्यक्ष प्रतिज्ञा-जैसी उक्ति के रूप में बनाए रखा गया है
  alternative: इसे सामान्य संभावना बनाना, जैसे ‘विपत्ति की आशंका कम होगी’
  rationale: इब्रानी में स्पष्ट निषेध और अपूर्ण क्रिया है; पाठ की नैतिक-प्रतिफल संबंधी तीव्रता को नरम करना व्याख्यात्मक हस्तक्षेप होता। ‘सकेगी’ हिन्दी में कथन को स्वाभाविक बनाता है, पर उसके आश्वासन को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त ज्ञानोक्ति की शैली, सामान्य पाठक के लिए सहज और फिर भी गरिमापूर्ण। पादटिप्पणी-चिह्न को उसी शब्द के बाद रखा गया है जहाँ प्रमुख पाठांतर की सूचना प्रासंगिक होती है।
