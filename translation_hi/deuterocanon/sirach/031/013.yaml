    text: शाब्दिक रूप से, ‘उस पर अपना गला मत खोलो।’ इब्रानी मुहावरा किसी समृद्ध मेज़ पर लालच या पेटूपन न दिखाने की चेतावनी देता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के लिए दिया गया यूनानी समानांतर इब्रानी पाठ से मेल नहीं खाता और सम्भवतः इस संदर्भ में गलत जुड़ गया है; इसलिए अनुवाद इब्रानी साक्ष्य पर आधारित है।
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: हे मेरे बेटे
  rationale: सम्बोधन में प्रथम पुरुष एकवचन प्रत्यय है; यह ज्ञान-साहित्य की आत्मीय, पितृवत् शिक्षा-शैली को बनाए रखता है।
- source_word: אם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; ‘यदि’ मूल की सशर्तता को स्पष्ट रखता है।
- source_word: על שלחן גדול
  choice: किसी शानदार मेज़ पर
  rationale: ישב के साथ על का स्वाभाविक हिन्दी रूप ‘मेज़ पर बैठना’ है। גדול यहाँ केवल भौतिक आकार नहीं, वैभव या प्रतिष्ठा भी सूचित कर सकता है; ‘शानदार’ भोज की समृद्धि और सामाजिक महत्त्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ישבת
  choice: बैठो
  rationale: रूप भूतकालिक है, पर शर्तसूचक नीतिवचन में सामान्य सम्भाव्य परिस्थिति बताता है; हिन्दी में ‘यदि ... बैठो’ स्वाभाविक है।
- source_word: אל תפתח
  choice: मत खोलो
  rationale: निषेध और क्रिया की सीधी छवि को सुरक्षित रखा गया है।
- source_word: גרנך
  choice: अपना गला
  rationale: גרון का शाब्दिक अर्थ ‘गला’ है। यहाँ यह लालची या पेटू ढंग से खाने की चेतावनी देने वाला मुहावरा है; मुख्य पाठ में मूल की सजीव छवि रखी गई है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
