  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: hi
  text: यह कौन है? आओ, उसे धन्य कहें[a], क्योंकि उसने अपने लोगों के बीच अद्भुत कार्य किए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी समानांतर पाठ काफ़ी भिन्न है: “एक शिक्षित व्यक्ति ने बहुत-सी बातें जानी हैं, और बहुत अनुभव रखने वाला समझदारी की बातें बताएगा।” सम्भवतः यह किसी भिन्न पाठ-रूप या पद-विन्यास को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: यह कौन है?
  rationale: यह आलंकारिक प्रश्न किसी अनुकरणीय व्यक्ति को सामने लाता है और זה के संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ונאשרנו
  choice: आओ, हम उसे धन्य कहें
  rationale: אשר का अर्थ यहाँ किसी को धन्य या सुखी घोषित करना है। प्रथम-पुरुष प्रेरणार्थक भाव को ‘आओ, हम’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כי
  choice: क्योंकि
  rationale: यह उस व्यक्ति को धन्य कहने का कारण प्रस्तुत करता है।
- source_word: הפליא לעשות
  choice: अद्भुत काम किए हैं
  rationale: हिफ़ील הפליא और לעשות का संयुक्त प्रयोग असाधारण या आश्चर्यजनक कार्य करने का भाव देता है; यह अनुवाद उस ऊँचे भाव को बिना किसी विशिष्ट कार्य का अनुमान लगाए सुरक्षित रखता है।
- source_word: בעמו
  choice: अपने लोगों के बीच
  rationale: ב के स्थानगत/समुदायगत अर्थ को बनाए रखता है और ‘अपने लोगों के लिए’ कहकर उपकार का ऐसा अर्थ नहीं जोड़ता जो हिब्रू में स्पष्ट नहीं है।
theological_decisions:
- issue: हिब्रू पाठ और दिए गए यूनानी समानांतर पाठ के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू को आधार बनाया गया है और यूनानी भिन्नता को पादटिप्पणी में रखा गया है।
  alternative: “एक शिक्षित मनुष्य ने बहुत-सी बातें जानी हैं, और बहुत अनुभव रखने वाला समझ का वर्णन करेगा।”
  rationale: उपलब्ध हिब्रू पंक्ति पूर्ण और अर्थपूर्ण है, जबकि यूनानी पाठ उसका निकट अनुवाद नहीं है; वह किसी भिन्न पाठ-रूप या पद-विन्यास को दर्शा सकता है। इसलिए अंतर को छिपाए बिना हिब्रू को प्राथमिक रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘धन्य कहें’ शास्त्रीय भाव बनाए रखता है, जबकि ‘आओ, हम’ सामूहिक आह्वान को सहज बनाता है।
