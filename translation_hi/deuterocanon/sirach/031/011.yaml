base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: hi
  text: कौन धन के द्वारा परखा गया और खरा पाया गया? यह उसके लिए गौरव की बात हो[a]। कौन भटक सकता था, फिर भी नहीं भटका[b], और बुराई कर सकता था, फिर भी उसने ऐसा करना नहीं चाहा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहली पंक्ति का इब्रानी पाठ कठिन है। प्राप्त पाठ का अधिक शाब्दिक अर्थ संभवतः “किसने उसे आशीष दी, और वह अपने जीवन में पूर्ण हुआ?” हो सकता है; पर प्रसंग परीक्षा में खरी उतरी निष्ठा के अर्थ का समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: या “कौन राह से हट सकता था, फिर भी नहीं हटा, और हानि कर सकता था, फिर भी उसने वैसा करने की सहमति नहीं दी?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מי ברכו וישלם בחייו
  choice: कौन धन के द्वारा परखा गया और खरा पाया गया?
  rationale: इब्रानी पाठ कठिन और संभवतः विकृत है। निकटवर्ती प्रसंग धन के बीच मनुष्य की निष्ठा की परीक्षा से संबंधित है; इसलिए निहित विषय ‘धन’ को स्पष्ट करते हुए परीक्षा और नैतिक खराई का अर्थ लिया गया है, पर पाठगत कठिनाई पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: הוא לך לתפארת
  choice: यह उसके लिए गौरव की बात हो
  rationale: प्रेषित इब्रानी में सर्वनाम अस्थिर है। यह अनुवाद ऐसे व्यक्ति की सिद्ध निष्ठा को सम्मान का कारण बताता है और संदिग्ध सर्वनाम पर आवश्यकता से अधिक निर्णय नहीं करता।
- source_word: מי יוכל לסור ולא סר
  choice: कौन भटक सकता था, फिर भी नहीं भटका
  rationale: סור का मूल अर्थ ‘मुड़ जाना/हट जाना’ है। नैतिक संदर्भ में ‘भटकना’ स्वाभाविक हिन्दी है और मूल रूपक को ‘अपराध करना’ की अपेक्षा अधिक निकटता से बचाए रखता है।
- source_word: ולהרע רעה ולא אבה
  choice: और बुराई कर सकता था, फिर भी उसने ऐसा करना नहीं चाहा
  rationale: להרע רעה नैतिक बुराई करने को व्यक्त करता है और אבה इच्छा अथवा सहमति को। हिन्दी वाक्य आचरण और भीतर की अस्वीकृति, दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: पाठगत रूप से अस्थिर इब्रानी पंक्ति और भिन्न यूनानी समानांतर का उपयोग
  choice: विद्यमान इब्रानी की प्रश्नात्मक संरचना को आधार बनाकर, निकटवर्ती धन-संबंधी प्रसंग से ‘परखा गया और खरा पाया गया’ का अर्थ ग्रहण किया गया।
  alternative: ברכו को अधिक शाब्दिक रूप में ‘किसने उसे आशीष दी’ पढ़ना, अथवा यूनानी पाठ के अनुसार भटके हुए व्यक्ति द्वारा धूर्तता बढ़ाने का कथन करना।
  rationale: इब्रानी साक्ष्य को प्राथमिकता दी गई है, किंतु उसकी वास्तविक कठिनाई छिपाई नहीं गई। यूनानी समानांतर इस पंक्ति से इतना भिन्न है कि उसे चुपचाप मूल पाठ के स्थान पर रखना उचित नहीं होगा।
- issue: नैतिक सामर्थ्य और वास्तविक संयम के बीच तनाव
  choice: ‘कर सकता था, फिर भी नहीं...’ की संरचना रखी गई।
  alternative: व्यक्ति को केवल निष्पाप या स्वभावतः बुराई से असमर्थ बताना।
  rationale: पद का बल अवसर या सामर्थ्य होते हुए भी जानबूझकर बुराई से हटने पर है; अनुवाद इस नैतिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और प्रश्नात्मक विन्यास अपनाया गया है। ‘खरा पाया गया’ सामान्य पाठक के लिए परीक्षा में सिद्ध नैतिक अखंडता को स्वाभाविक ढंग से व्यक्त करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
