translation:
  language: hi
  text: वह जिस स्थान की ओर देखे, वहाँ अपना हाथ बढ़ाओ[a], और उसके साथ पात्र में हाथ मत डालो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ-परंपरा में यहाँ लिखा है, “प्रभु का भय मानने वाले का प्राण धन्य है।” काहिरा गनीज़ा में सुरक्षित इब्रानी साक्ष्य भोजन के शिष्टाचार से जुड़ी एक अलग पंक्ति देता है; इस स्थान पर पाठ-परंपरा अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: מקום יביט
  choice: जिस स्थान पर वह देख रहा हो
  rationale: מקום का मूल अर्थ ‘स्थान’ है और יביט ‘वह देखता है।’ भोजन के प्रसंग में यह उस जगह या हिस्से की ओर संकेत करता है जिस पर दूसरे भोजन करने वाले की दृष्टि है; अनुवाद ठोस शब्दावली और प्रसंगगत अर्थ दोनों बनाए रखता है।
- source_word: תושיט יד
  choice: वहाँ अपना हाथ बढ़ा
  rationale: यह हाथ आगे बढ़ाने का सीधा मुहावरा है। ‘अपना हाथ बढ़ा’ आधुनिक हिन्दी में स्वाभाविक है और मूल की क्रिया को निकटता से व्यक्त करता है।
- source_word: אל תחד
  choice: हाथ न डाल
  rationale: संयुक्त इब्रानी पाठ में यह रूप पाठगत रूप से कठिन है। भोजन-संदर्भ में इसका व्यावहारिक आशय दूसरे व्यक्ति के साथ एक ही समय पात्र की ओर हाथ बढ़ाने से रोकना है; ‘हाथ न डाल’ इस आशय को बिना अनिश्चित रूप की अतिव्याख्या किए व्यक्त करता है।
- source_word: עמו
  choice: उसके साथ ही
  rationale: עמו दूसरे भोजन करने वाले के साथ एक ही समय क्रिया करने का बोध देता है। ‘साथ ही’ उस समकालिकता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בטנא
  choice: थाली में
  rationale: मूल संज्ञा टोकरी या पात्र को सूचित कर सकती है। यहाँ साझा भोजन-पात्र के संदर्भ में ‘थाली’ साधारण हिन्दी पाठक के लिए स्वाभाविक है और भोजन के परिवेश को स्पष्ट रखती है।
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: उपलब्ध यूनानी पाठ इब्रानी पंक्ति से पूर्णतः भिन्न है और संभवतः दूसरी पाठ-परंपरा या पद-क्रम को दर्शाता है। चूँकि इस पद का इब्रानी साक्ष्य उपलब्ध है, मुख्य पाठ उसका अनुसरण करता है और यूनानी पाठ को महत्वपूर्ण वैकल्पिक पाठ के रूप में पाद-टिप्पणी में रखता है।
theological_decisions:
- issue: इस पद की उपलब्ध इब्रानी और यूनानी पाठ-परंपराओं में गंभीर अंतर
  choice: मुख्य पाठ में भोजन-शिष्टाचार संबंधी उपलब्ध इब्रानी पंक्ति का अनुसरण और यूनानी पाठ का पाद-टिप्पणी में उल्लेख
  alternative: “प्रभु का भय मानने वाले का प्राण धन्य है।”
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। फिर भी यूनानी पाठ केवल छोटा पाठांतर नहीं, बल्कि बिल्कुल अलग वाक्य है; इसलिए पाठगत अनिश्चितता और धार्मिक अर्थ के अंतर को छिपाने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘थाली में हाथ डालना’ भोजन-संदर्भ का स्वाभाविक हिन्दी प्रयोग है। पुल्लिंग एकवचन ‘वह/उसके’ मूल इब्रानी के अनुरूप सुरक्षित है।
