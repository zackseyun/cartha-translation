base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/007.yaml
  text: For it is a stumbling block to a fool[a], and every simpleton is ensnared by it.
translation:
  language: hi
  text: क्योंकि वह मूर्ख के लिए ठोकर का कारण है,[a] और हर भोला व्यक्ति उसमें फँस जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “क्योंकि सपनों ने बहुतों को भटका दिया है, और उन पर आशा रखनेवाले गिर पड़े हैं।” यहाँ इब्रानी और यूनानी पाठ-साक्ष्यों में बहुत बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  choice: ठोकर का कारण
  rationale: यह संज्ञा ऐसी वस्तु या बाधा को दर्शाती है जिससे कोई ठोकर खाता या विनाश की ओर जाता है। ‘ठोकर का कारण’ मूल रूपक और नैतिक संकट—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: אויל
  choice: मूर्ख
  rationale: यह ज्ञान-साहित्य का प्रचलित शब्द है, जो बौद्धिक कमी के साथ नैतिक विवेकहीनता भी व्यक्त करता है।
- source_word: פותה
  choice: भोला मनुष्य
  rationale: यह शब्द ऐसे अनुभवहीन और आसानी से बहकाए जाने वाले व्यक्ति को दर्शाता है। ‘भोला मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और केवल बुद्धि की कमी कहने के बजाय उसकी सरलता और असावधानी का भाव देता है।
- source_word: יוקש
  choice: फंदे में फँस जाता है
  rationale: निष्क्रिय क्रिया किसी जाल या फंदे में पकड़े जाने का चित्र प्रस्तुत करती है। यह हिन्दी प्रयोग उस रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: בו
  choice: उसके
  rationale: सर्वनाम पूर्वसंदर्भित वस्तु की ओर संकेत करता है। ‘उसके फंदे में’ हिन्दी में स्वाभाविक ढंग से साधन या कारण का संबंध व्यक्त करता है, यद्यपि मूल में ‘फंदा’ संज्ञा प्रत्यक्ष रूप से नहीं है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद किया गया है और यूनानी पाठ को पाद-टिप्पणी में रखा गया है।
  alternative: “क्योंकि सपनों ने बहुतों को भटका दिया है, और उन पर आशा रखनेवाले गिर पड़े हैं।”
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी जाती है। यहाँ यूनानी समानांतर पंक्ति केवल छोटे शब्दांतर के बजाय सर्वथा भिन्न कथन देती है; इसलिए इस पाठगत तनाव को पाद-टिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘ठोकर का कारण’ और ‘फंदे में फँस जाना’ मूल के दो ठोस संकट-रूपकों को बनाए रखते हैं।
