  yaml_path: translation/deuterocanon/sirach/031/020.yaml
  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: hi
  text: जान लो कि तुम्हारा पड़ोसी तुम्हारे जैसा ही एक आदमी है[a][b], और जो कुछ तुम्हारे सामने रखा गया है, उसे खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक समावेशी रूप में: “तुम्हारा पड़ोसी तुम्हारे जैसा ही एक मनुष्य है।” इब्रानी में शाब्दिक रूप से “तुम्हारे जैसा एक आदमी” है।'
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ यूनानी पाठ-साक्ष्य बहुत भिन्न है: “प्राण को ऊँचा उठाने वाला और आँखों को प्रकाश देने वाला, चंगाई, जीवन और आशीष देने वाला।” ऐसा जान पड़ता है कि इब्रानी और यूनानी में इस पद के अलग-अलग रूप सुरक्षित हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: जान लो
  rationale: ידע के आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; यह उपदेशात्मक बल बनाए रखता है।
- source_word: רעך
  choice: तुम्हारा पड़ोसी
  rationale: רֵעַ का अर्थ मित्र, साथी या पड़ोसी हो सकता है। यहाँ अपने समान दूसरे व्यक्ति के प्रति सामाजिक-नैतिक संबंध व्यक्त करने के लिए ‘पड़ोसी’ उपयुक्त है।
- source_word: איש כמוך
  choice: तुम्हारे समान एक आदमी
  rationale: इब्रानी में איש पुल्लिंग एकवचन है और शाब्दिक अर्थ ‘तुम्हारे समान एक आदमी’ है। यह अभिव्यक्ति तुलना को स्पष्ट रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ואכול
  choice: और … खाओ
  rationale: संयोजक के साथ आए सरल आज्ञार्थक रूप को रखा गया है; ‘इसलिए’ जैसा अधिक स्पष्ट निष्कर्ष-सूचक भाव नहीं जोड़ा गया।
- source_word: דבר
  choice: जो कुछ
  rationale: इस वाक्यांश में דָּבָר का आशय सामने रखी वस्तु, अर्थात भोजन, से है। ‘जो कुछ’ हिन्दी में सहज है और ‘वस्तु’ जैसे कृत्रिम शब्द से बचता है।
- source_word: ששם לפניך
  choice: तुम्हारे सामने रखा गया है
  rationale: यह भोजन परोसे जाने का स्वाभाविक मुहावरा है और इब्रानी के मेज़-संदर्भ को स्पष्ट किए बिना सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: איש כמוך में लिंग-सूचक अभिव्यक्ति
  choice: मुख्य पाठ में ‘तुम्हारे समान एक आदमी’
  alternative: ‘तुम्हारे समान एक मनुष्य’ या ‘तुम्हारे जैसा ही एक व्यक्ति’
  rationale: इब्रानी איש पुल्लिंग संज्ञा है, इसलिए मुख्य पाठ उसके रूप को मिटाता नहीं है। फिर भी यह कहावत व्यापक रूप से लागू होती है; अधिक समावेशी अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी पाठ: ‘प्राण को ऊँचा उठाता और आँखों को ज्योति देता हुआ, चंगाई, जीवन और आशीष देता है।’'
  rationale: यहाँ उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी साक्ष्य निकट शब्दांतर नहीं, बल्कि स्पष्टतः भिन्न वाक्य सुरक्षित रखता है; इसलिए दोनों को मिलाने के बजाय यूनानी रूप को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जान लो’ उपदेशात्मक स्वर देता है; ‘सामने रखा गया है’ भोजन परोसे जाने के प्रसंग में स्वाभाविक हिन्दी है।
