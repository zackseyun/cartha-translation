base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/012.yaml
  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: hi
  text: इसलिए उसकी भलाई को दृढ़ता से थामे रहो[b], और सभा उसकी प्रशंसा का बखान करेगी। रोटी अनुशासन है[c], और दाखमधु उसके साथ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इससे बिल्कुल भिन्न वाचन है: “अपने भटकने में मैंने बहुत-सी बातें देखी हैं, और मेरी समझ मेरे शब्दों से बढ़कर है।” यहाँ हिब्रू और यूनानी पाठ-साक्ष्य में भारी अंतर है।'
    reason: textual_variant
  - marker: b
    text: “भलाई” का अनुवाद “उदारता” या “उपकार” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश का पाठ और अर्थ कठिन है। “अनुशासन” का अनुवाद “शिक्षा” या “सुधार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: על כן
  choice: इसलिए
  rationale: यह पूर्ववर्ती प्रसंग से निष्कर्ष निकालने वाला स्वाभाविक हिन्दी संबंधबोधक है।
- source_word: חזק
  choice: दृढ़ता से थामे रहो
  rationale: आज्ञार्थक रूप में ‘दृढ़ हो’ अथवा ‘मज़बूती से पकड़ो’ का भाव है; טובו के साथ यह चयन मूल उपदेशात्मक अर्थ को सहज हिन्दी में रखता है।
- source_word: טובו
  choice: उसकी भलाई
  rationale: טוב में भलाई और उपकार/उदारता दोनों का भाव संभव है। ‘भलाई’ व्यापक अर्थ को मुख्य पाठ में सुरक्षित रखती है, जबकि भोज-संदर्भ में उदारता की छाया पादटिप्पणी में बताई गई है।
- source_word: ותהלתו
  choice: उसकी प्रशंसा
  rationale: यह संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יספר קהל
  choice: सभा … का बखान करेगी
  rationale: יספר का अर्थ कहना, सुनाना या वर्णन करना और קהל का अर्थ एकत्र समुदाय/सभा है। ‘बखान करेगी’ सार्वजनिक रूप से प्रशंसा सुनाने का भाव व्यक्त करता है।
- source_word: מוסר לחם
  choice: रोटी अनुशासन है
  rationale: מוסר में अनुशासन, शिक्षा और सुधार का अर्थ हो सकता है। हिब्रू वाक्य अत्यंत संक्षिप्त और कठिन है; अपेक्षाकृत औपचारिक रूप उसकी अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: ויין יחדו
  choice: और दाखमधु उसके साथ है
  rationale: יחדו का मूल भाव ‘साथ’ या ‘एक साथ’ है। ‘उसके साथ’ रोटी और दाखमधु की संगति को न्यूनतम व्याख्या के साथ व्यक्त करता है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठों में अत्यधिक भिन्नता
  choice: मुख्य पाठ जीवित हिब्रू साक्ष्य के अनुसार अनूदित किया गया है और यूनानी पाठ को पाठांतर की पादटिप्पणी में दिया गया है।
  alternative: 'केवल यूनानी पाठ का अनुवाद: “अपने भटकने में मैंने बहुत-सी बातें देखी हैं, और मेरी समझ मेरे शब्दों से बढ़कर है।”'
  rationale: दोनों साक्ष्य इतने अलग हैं कि उन्हें मिलाकर एक कृत्रिम पाठ बनाना उचित नहीं। हिब्रू उपलब्ध होने के कारण वह मुख्य आधार है, पर यूनानी साक्ष्य को स्पष्ट रूप से सुरक्षित रखना आवश्यक है।
- issue: מוסר का अर्थ
  choice: अनुशासन
  alternative: शिक्षा; सुधार
  rationale: ‘अनुशासन’ शब्द शिक्षा और सुधार से जुड़े मूल के कठोर तथा उपदेशात्मक बल को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और औपचारिक शैली रखी गई है। ‘दाखमधु’ बाइबिलीय संदर्भ में परिचित है। अंतिम वाक्य की असामान्यता मूल हिब्रू की वास्तविक कठिनाई को सुरक्षित रखने के लिए जानबूझकर पूरी तरह सहज नहीं बनाई गई।
