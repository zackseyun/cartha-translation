base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/021.yaml
  text: Be the first to stop[a], for the sake of good manners, and do not be a glutton[b], lest you be despised.
translation:
  language: hi
  text: शिष्टाचार[a] के लिए सबसे पहले खाना बंद करो, और पेटू मत बनो, कहीं ऐसा न हो कि तुम घृणा के पात्र न बनो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी מוסר का अर्थ प्रायः ‘अनुशासन’ या ‘शिक्षा’ होता है; यहाँ भोजन के समय के व्यवहार के प्रसंग में इसका आशय सम्भवतः ‘शिष्टाचार’ है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद का इब्रानी पाठ उपलब्ध है, पर दिए गए स्रोत-सामग्री में पाठ-संबंधी बड़ा असंगत मेल चिह्नित है: साथ दिया गया यूनानी समानांतर इस इब्रानी पंक्ति के अनुरूप नहीं है। इसलिए अनुवाद में इब्रानी साक्ष्य को प्राथमिक माना गया है और इस विसंगति को यहाँ दर्ज किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: חדל
  choice: खाना बंद करो
  rationale: आज्ञार्थक क्रिया का मूल अर्थ ‘रुकना/बंद करना’ है। भोज के प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘खाना’ जोड़ा गया है।
- source_word: ראשון
  choice: सबसे पहले
  rationale: यह क्रिया-विशेषणात्मक रूप से दूसरों से पहले रुकने और संयम दिखाने का निर्देश देता है।
- source_word: בעבור מוסר
  choice: शिष्टाचार के कारण
  rationale: בעבור हेतु या प्रेरणा बताता है। מוסר का सामान्य अर्थ ‘अनुशासन’ या ‘शिक्षा’ है, पर भोजन-संबंधी प्रसंग में ‘शिष्टाचार’ स्वाभाविक सामाजिक भाव व्यक्त करता है।
- source_word: גרגרן
  choice: पेटू
  rationale: यह लोभ से बहुत खाने वाले व्यक्ति को दर्शाता है। ‘पेटू’ सामान्य आधुनिक हिन्दी में संक्षिप्त और नैतिक चेतावनी के अनुकूल है।
- source_word: פן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित नकारात्मक परिणाम प्रस्तुत करने वाला चेतावनी-सूचक अव्यय है।
- source_word: תמאס
  choice: तुम घृणा के पात्र बन जाओ
  rationale: מאס का अर्थ ठुकराना, तुच्छ समझना या घृणा करना हो सकता है। इस प्रसंग में यह उस सामाजिक विरक्ति को व्यक्त करता है जो पेटूपन से उत्पन्न होती है।
