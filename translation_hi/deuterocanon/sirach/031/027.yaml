review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew is represented accurately: ''if they press you to eat ... withdraw from the meal setting ... you will find rest.'' The brackets and the major divergence of the supplied Greek parallel are properly retained and documented. However, ''भोज से उठ जाओ'' specifies standing up, whereas סור means to turn aside, depart, or withdraw; this slight added physical detail can be avoided.'
  naturalness: The draft is generally clear modern Hindi. 'तुम पर ... ज़ोर डालें' is understandable but less idiomatic than 'तुम्हें ... खाने के लिए मजबूर करें/दबाव डालें'; 'दबाव डालें' best preserves insistent pressure without implying actual compulsion. 'सुख-चैन' naturally conveys נחת's ease/rest in this context.
  terminology: ‘भोज’ suitably renders the communal/reclining meal setting, and ‘मज़दूर की मज़दूरी रोकता है’ accurately conveys the Greek variant. ‘रक्त बहानेवाला’ is understandable, but ‘रक्त बहाता है’ is more direct and idiomatic for the Greek participial claim.
  issues:
  - severity: low
    issue: ‘भोज से उठ जाओ’ adds the specific action of rising.
    rationale: The Hebrew imperative סור calls for turning away or withdrawing from the meal company; it does not explicitly say to stand up. ‘भोज से हट जाओ’ retains the intended departure without added detail.
  - severity: low
    issue: ‘तुम पर खाने के लिए ज़ोर डालें’ is slightly awkward collocation.
    rationale: In modern standard Hindi, ‘तुम्हें खाने के लिए दबाव डालें’ is smoother while preserving the Hebrew sense of insistent urging.
  revised_text: '[और यदि वे तुम्हें खाने के लिए दबाव डालें[a], तो भोज से हट जाओ,] और तुम्हें सुख-चैन मिलेगा।'
