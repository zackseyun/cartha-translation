base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/027.yaml
  text: '[And if they press you to eat[a], leave the banquet,] and you will find rest.'
translation:
  language: hi
  text: '[और यदि वे तुम्हें खाने के लिए दबाव डालें[a], तो भोज से हट जाओ,] और तुम्हें सुख-चैन मिलेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ है: “[और यदि वे तुम्हें खाने के लिए दबाव डालें, तो भोज से हट जाओ,] और तुम्हें सुख-चैन मिलेगा।” लेकिन यहाँ दिया गया यूनानी समानांतर पाठ इसके बजाय कहता है: “और जो मज़दूर की मज़दूरी रोकता है, वह रक्त बहाता है।” यह पाठों के बीच बड़े अंतर या पदों के भिन्न क्रम का संकेत देता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ואם
  choice: और यदि
  rationale: वाव सहित शर्तसूचक संयोजन को स्वाभाविक हिन्दी में रखा गया है।
- source_word: יפצירו בך
  choice: वे तुम पर ... ज़ोर डालें
  rationale: क्रिया आग्रह से बढ़कर दबाव डालने या लगातार ज़ोर देने का भाव रखती है; ‘तुम पर ज़ोर डालें’ सामाजिक दबाव को स्पष्ट करता है।
- source_word: לאכול
  choice: खाने के लिए
  rationale: אכל के क्रियार्थक रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: סור מן הסבה
  choice: भोज से उठ जाओ
  rationale: סור अलग हो जाने या हटने की आज्ञा है, और הסבה पंगत/टेक लगाकर किए जाने वाले सामूहिक भोजन को सूचित करता है। ‘भोज से उठ जाओ’ प्रसंग को सहज हिन्दी में व्यक्त करता है।
- source_word: ותמצא נחת
  choice: और तुम्हें चैन मिलेगा
  rationale: נחת यहाँ विश्राम, राहत या सुकून का भाव देता है; ‘चैन’ सामाजिक दबाव से हटकर मिलने वाली राहत को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी अंश कोष्ठकित है और यूनानी समानांतर पाठ से इसका बड़ा अंतर है
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ में अनूदित कर उसके कोष्ठक बनाए रखे गए हैं, और यूनानी असंगति को पादटिप्पणी में बताया गया है।
  alternative: 'यूनानी समानांतर: ‘और जो मज़दूर की मज़दूरी रोकता है, वह रक्त बहानेवाला है।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। फिर भी यूनानी पाठ समान अर्थ नहीं देता और संभवतः भिन्न पाठ-परंपरा या पद-क्रम को दर्शाता है; इसलिए अनिश्चितता को छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल पाठ के वर्ग कोष्ठक सुरक्षित रखे गए हैं। ‘भोज से उठ जाओ’ भोजन-संगति से हटने का अर्थ देता है, जबकि ‘चैन’ נחת के विश्राम/राहत भाव को बोलचाल से अत्यधिक निकट हुए बिना स्पष्ट करता है।
