  yaml_path: translation/deuterocanon/sirach/031/030.yaml
  text: Listen, my son, and do not despise me; in the end you will grasp my words.
translation:
  language: hi
  text: मेरे बेटे, सुन और मेरा तिरस्कार न कर; अंत में तू मेरी बातों को समझ लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए दिया गया यूनानी समानांतर एक बिल्कुल भिन्न कथन प्रस्तुत करता है: “जो शव के संपर्क से शुद्धि के लिए स्नान करता है और फिर उसे छूता है, उसे अपने स्नान से क्या लाभ हुआ?” यह पद-क्रम या पाठ-परंपरा में किसी बड़ी असंगति का संकेत देता है; मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: सुन
  rationale: आज्ञार्थक रूप attentive hearing का आह्वान करता है; ‘सुन’ स्वाभाविक है और ‘आज्ञा मान’ की अपेक्षा कम व्याख्यात्मक।
- source_word: בני
  choice: हे मेरे बेटे
  rationale: इब्रानी में पुल्लिंग एकवचन सम्बोधन है; यह उसे स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: תבוז
  choice: तिरस्कार न कर
  rationale: בזה का भाव किसी को नीचा या घृणा की दृष्टि से मानना है; ‘तिरस्कार’ उपदेशात्मक लहजे के अनुकूल है।
- source_word: ובאחרית
  choice: अन्त में
  rationale: यह आगे चलकर प्राप्त होने वाले परिणाम की ओर संकेत करता है; हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति।
- source_word: תשיג
  choice: समझ लेगा
  rationale: मूल क्रिया का आधारभूत भाव ‘पहुँचना/प्राप्त करना’ है, पर ‘मेरी बातों’ के साथ सन्दर्भगत अर्थ उन्हें अंततः समझ पाना है। ‘समझ लेगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אמרי
  choice: मेरी बातों
  rationale: אמרים कथनों या बोले हुए शब्दों को दर्शाता है; ‘मेरी बातों’ सामान्य आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: इब्रानी मुख्य पाठ और दिए गए यूनानी समानांतर के बीच पूर्ण भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी बेन सीरा का अनुवाद
  alternative: 'यूनानी: ‘जो मरे हुए व्यक्ति के कारण स्नान करता है और फिर उसे छूता है, उसे अपने स्नान से क्या लाभ हुआ?’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पंक्ति निकट पाठांतर नहीं, बल्कि एक अलग कथन है; इसलिए भिन्नता को पादटिप्पणी में पारदर्शी रूप से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष गुरु-पुत्र सम्बोधन और गरिमापूर्ण उपदेशात्मक लहजा। ‘तू’ मूल के एकवचन निकट सम्बोधन को सुरक्षित रखता है; भाषा को अनावश्यक रूप से पुरातन नहीं बनाया गया।
