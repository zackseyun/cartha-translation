  text: A rich man labors to gather wealth[a], and when he rests[b], he receives enjoyment.
translation:
  language: hi
  text: धनवान धन बटोरने के लिए परिश्रम करता है, और जब वह विश्राम करता है, तो सुख पाता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुख पाता है’ का अधिक शाब्दिक रूप ‘सुख/आनंद प्राप्त करता है’ है; ‘विलास पाता है’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध यूनानी समानांतर इस पद के इब्रानी पाठ से मेल नहीं खाता। इसलिए यहाँ इब्रानी साक्ष्य को प्रधान माना गया है; पाठ-परंपरा में अस्थिरता बनी हुई है।
    reason: textual_variant
lexical_decisions:
- source_word: עמלי
  choice: परिश्रम करता है
  rationale: यह עמל के श्रम करने के अर्थ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; ‘कठिन परिश्रम करता है’ मूल से अधिक तीव्र होता।
- source_word: עשיר
  choice: धनवान
  rationale: इब्रानी में एकवचन धनी व्यक्ति है। हिन्दी में ‘धनवान’ लिंग-संगत एकवचन अर्थ को संक्षेप में बनाए रखता है।
- source_word: לקבץ
  choice: बटोरने के लिए
  rationale: यह infinitive ‘इकट्ठा करने/संचित करने’ का प्रयोजन व्यक्त करता है और धन के संदर्भ में सहज हिन्दी है।
- source_word: הון
  choice: धन
  rationale: הון का सामान्य अर्थ धन-संपत्ति है; ‘धन’ यहाँ स्पष्ट, स्वाभाविक और अनावश्यक विस्तार से रहित है।
- source_word: ינוח
  choice: जब वह विश्राम करता है
  rationale: נוח का सीधा अर्थ विश्राम करना है। कालगत संबंध को ‘जब’ से व्यक्त किया गया है, जैसा वाक्य-संदर्भ अपेक्षित करता है।
- source_word: לקבל תענוג
  choice: सुख पाता है
  rationale: शाब्दिक संरचना ‘सुख/आनंद प्राप्त करना’ है। ‘सुख पाता है’ हिन्दी में स्वाभाविक रहते हुए לקבל के ‘पाने’ और תענוג के ‘सुख’—दोनों को सुरक्षित रखता है; ‘विलास का आनंद लेता है’ अधिक ठोस और व्याख्यात्मक होता।
theological_decisions:
- issue: धनवान के श्रम और बाद के सुख के बीच संबंध
  choice: वाक्य को वर्णनात्मक रूप में रखा गया है
  alternative: इसे धन या विलास की स्पष्ट निंदा अथवा प्रशंसा के रूप में प्रस्तुत करना
  rationale: इस पद की इब्रानी पंक्ति स्वयं नैतिक निर्णय स्पष्ट नहीं करती; इसलिए अनुवाद उस तनाव को बिना सांप्रदायिक या उपदेशात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘परिश्रम करता है’, ‘धन बटोरने’ और ‘सुख पाता है’ से मूल की समानांतर क्रियात्मक संरचना तथा उसका संयमित स्वर सुरक्षित रखा गया है।
