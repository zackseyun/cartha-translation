base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/014.yaml
  text: Do not say[a], “It is enough for him”[b]; remember that an evil eye is evil.
translation:
  language: hi
  text: मत कह, “उसके लिए काफ़ी है”; याद रख कि बुरी आँख[a] बुरी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुरी आँख’ एक इब्रानी मुहावरा है, जो प्रायः कंजूस, कुढ़ने वाले या ईर्ष्यालु स्वभाव को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इस संदर्भ के लिए दिया गया यूनानी समानांतर पाठ है, ‘जो प्रभु का भय मानते हैं, उनकी आत्मा जीवित रहेगी।’ यह यहाँ के इब्रानी पाठ से मेल नहीं खाता और संभवतः किसी भिन्न पाठ-संरेखण या पद-संख्या को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: यह मत कह
  rationale: निषेधात्मक आज्ञा को सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ספוק עליו
  choice: उसके लिए इतना काफ़ी है
  rationale: ספוק पर्याप्तता या भरपूरी का भाव देता है और עליו यहाँ किसी दूसरे व्यक्ति के लिए होने का संकेत करता है। ‘इतना’ भोजन अथवा बाँटने के प्रसंग में हिन्दी वाक्य को स्वाभाविक बनाता है, पर मात्रा को विशेष रूप से निर्धारित नहीं करता।
- source_word: זכור
  choice: याद रख
  rationale: एकवचन आज्ञार्थक रूप और उपदेश की सीधी शैली सुरक्षित रखी गई है।
- source_word: רעה עין רעה
  choice: बुरी आँख बुरी होती है
  rationale: मूल की ठोस उपमा और רעה की पुनरावृत्ति दोनों सुरक्षित हैं। मुहावरे को मुख्य पाठ में खोलकर केवल ‘कंजूसी’ या ‘ईर्ष्या’ नहीं किया गया, क्योंकि उसके अर्थ में कृपण, कुढ़ने वाला और ईर्ष्यालु भाव सम्मिलित हो सकते हैं।
theological_decisions:
- issue: ‘बुरी आँख’ के इब्रानी मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘बुरी आँख’ बनाए रखा गया
  alternative: कंजूस स्वभाव; कुढ़ने वाली दृष्टि; ईर्ष्या
  rationale: इब्रानी कथन जानबूझकर ठोस और लोकोक्तिपरक है। मुहावरे को बनाए रखने से स्रोत की भाषा और अर्थगत विस्तार सुरक्षित रहता है; पाद-टिप्पणी उसका सामान्य आशय स्पष्ट करती है।
- issue: इब्रानी पाठ और दिए गए यूनानी समानांतर का गंभीर अंतर
  choice: उपलब्ध इब्रानी पाठ को आधार बनाया गया और अंतर को पाद-टिप्पणी में बताया गया
  alternative: यूनानी समानांतर ‘प्रभु का भय मानने वालों की आत्मा जीवित रहेगी’ का अनुवाद करना
  rationale: इस पद के लिए विश्वसनीय इब्रानी पाठ उपलब्ध है और परियोजना-नीति के अनुसार उसे प्राथमिकता दी गई है। यूनानी पंक्ति इब्रानी कथन से मेल नहीं खाती और संभवतः अलग पाठ-संरेखण या पद-संख्या को दर्शाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘काफ़ी’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘बुरी आँख बुरी होती है’ मूल की संक्षिप्त, लोकोक्तिपरक पुनरावृत्ति को जानबूझकर बनाए रखता है।
