  text: A poor man labors until his strength is spent, and if he rests, he is still in need.
translation:
  language: hi
  text: गरीब अपनी शक्ति चुक जाने तक मेहनत करता है, और यदि वह विश्राम करे, तो भी वह अभाव में रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पांडुलिपियों में पाठांतर हैं। एक पाठ-रूप में ‘घर/गृहस्थी की कमी’ और ‘वह ज़रूरतमंद होगा’ है; दूसरे में ‘अपनी शक्ति चुक जाने तक’ और ‘उसे विश्राम नहीं मिलता’ है। मुख्य पाठ इन इब्रानी पाठ-रूपों के ‘शक्ति चुक जाने’ और ‘ज़रूरतमंद’ वाले पाठों का अनुसरण करता है। यूनानी समानांतर का पाठ इस पद से बहुत भिन्न है।
    reason: इब्रानी साक्ष्य के दोनों स्थानों पर मौजूद पाठांतरों और मुख्य पाठ के मिश्रित पाठ-आधार को स्पष्ट करना, तथा असंगत यूनानी समानांतर का संक्षिप्त उल्लेख बनाए रखना।
lexical_decisions:
- source_word: עמל עני / יגע עני
  choice: गरीब ... मेहनत करता है
  rationale: दोनों इब्रानी पाठ-रूपों में कठिन परिश्रम का भाव है; ‘मेहनत करता है’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: לחסר כחו
  choice: अपनी शक्ति चुक जाने तक
  rationale: शाब्दिक अर्थ ‘अपनी शक्ति घटाने/समाप्त करने के लिए’ है; हिन्दी में यह प्रयोग परिश्रम से शक्ति क्षीण हो जाने का भाव स्पष्ट करता है।
- source_word: יהיה צריך
  choice: वह अभाव में रहता है
  rationale: צריך यहाँ आवश्यकता या तंगी में होने का भाव देता है; ‘अभाव में रहता है’ गरीबी की निरंतर विवशता को सहज हिन्दी में व्यक्त करता है।
- source_word: ינוח
  choice: विश्राम करे
  rationale: मूल क्रिया נוח के सामान्य अर्थ ‘आराम/विश्राम करना’ को सीधे रखा गया है।
theological_decisions:
- issue: इब्रानी पाठ-रूपों के अंतिम वाक्य में अंतर
  choice: मुख्य पाठ में ‘तो भी वह अभाव में रहता है’
  alternative: ‘तो भी उसे चैन नहीं मिलता’
  rationale: प्रस्तुत इब्रानी साक्ष्य में יהיה צריך (‘वह जरूरतमंद होगा’) और לא נחה לו (‘उसके लिए विश्राम नहीं’) दोनों पाठ हैं। मुख्य अनुवाद पहले पाठ और प्रमाणित अंग्रेज़ी परामर्श-पाठ के अनुरूप है; दूसरे पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। गरीबी, श्रम और निरंतर अभाव के तनाव को बिना किसी सांप्रदायिक व्याख्या के बनाए रखा गया है।
