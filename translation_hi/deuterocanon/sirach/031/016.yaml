  text: For because of every matter the eye trembles[a], and from the face tears will flow.
translation:
  language: hi
  text: क्योंकि हर बात से आँख काँपती है[a], और चेहरे से आँसू बहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध इब्रानी पाठ यूनानी परंपरा से बहुत भिन्न है। यूनानी पाठ में है: “जो प्रभु का भय रखता है, वह निश्चय ही न घबराएगा और न कायर होगा, क्योंकि वही उसकी आशा है।” मुख्य पाठ उपलब्ध इब्रानी साक्ष्य के अनुसार है।'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: यह कठिन और संक्षिप्त इब्रानी पंक्ति आरम्भ में कारणसूचक संबंध व्यक्त करती जान पड़ती है। हिन्दी में दोहरे कारणसूचक शब्दों की अपेक्षा अकेला ‘क्योंकि’ स्वाभाविक है और अस्पष्ट वाक्य-संबंध को अनावश्यक रूप से नहीं सुलझाता।
- source_word: מפני כל דבר
  choice: हर बात से
  rationale: מפני का अर्थ ‘के कारण/के सामने’ और דבר का अर्थ ‘बात, विषय, वस्तु या वचन’ हो सकता है। ‘हर बात से’ इस सामान्य और कहावत-जैसे कथन में व्यापक अर्थ बनाए रखता है।
- source_word: תזוע עין
  choice: आँख काँप उठती है
  rationale: זוע काँपने या हिलने का बोध देता है। एकवचन ‘आँख’ इब्रानी के सजीव शारीरिक बिंब को सुरक्षित रखता है; ‘उठती है’ आधुनिक हिन्दी में क्रिया को स्वाभाविक बनाता है।
- source_word: ומפנים
  choice: और चेहरे से
  rationale: פנים का मूल अर्थ ‘चेहरा’ है। अधिक मुहावरेदार ‘आँखों से’ लिखने के बजाय स्रोत के असामान्य बिंब को बनाए रखा गया है।
- source_word: דמעה תדמע
  choice: आँसू बहेंगे
  rationale: संज्ञा और उसी मूल की क्रिया का इब्रानी प्रयोग रोने की तीव्रता व्यक्त करता है। शाब्दिक पुनरुक्ति हिन्दी में अस्वाभाविक होती, इसलिए ‘आँसू बहेंगे’ अर्थ और भाव दोनों को पठनीय रूप में देता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परंपराओं में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी पाठ: “जो प्रभु का भय मानता है, वह निश्चय ही नहीं घबराएगा और न कायर बनेगा, क्योंकि वही उसकी आशा है।”'
  rationale: इस स्थान पर उपलब्ध इब्रानी और यूनानी पाठ समान कथन के निकट रूप नहीं हैं। परियोजना के सिद्धांत के अनुसार उपलब्ध इब्रानी को मुख्य पाठ बनाया गया है और यूनानी के अत्यंत भिन्न पाठ को पादटिप्पणी में ईमानदारी से सुरक्षित रखा गया है; दोनों को मिलाकर किसी एक अर्थ में नहीं ढाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सापेक्ष अनुवाद। इब्रानी की कठिन, कहावत-जैसी संरचना और ‘आँख’ तथा ‘चेहरे’ के असामान्य शारीरिक बिंब सुरक्षित रखे गए हैं; यूनानी पाठ से सामंजस्य बैठाने का प्रयास नहीं किया गया।
