base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/026.yaml
  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: hi
  text: जीवन के वर्ष विवेकी मनुष्य के साथ हैं; वह भोर तक ठहरेगा, और उसका जीवन उसके साथ है[a]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द נפש का अर्थ प्रसंग के अनुसार ‘जीवन,’ ‘स्वयं’ या ‘प्राण’ हो सकता है। इसलिए इसका अनुवाद ‘और उसका प्राण उसके साथ है’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ इब्रानी से बहुत भिन्न है। उसका लगभग अर्थ है, “जो अपने पड़ोसी की जीविका छीनता है, वह उसकी हत्या करता है।” संभवतः यह किसी अलग पाठ-रूप को दर्शाता है; इसलिए मुख्य अनुवाद उपलब्ध इब्रानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: जीवन के वर्ष
  rationale: यह इब्रानी संबंधवाचक पदबंध का औपचारिक और स्वाभाविक हिन्दी रूप है। इसे ‘लंबी आयु’ नहीं किया गया, क्योंकि वह निहित अर्थ को स्पष्ट प्रतिज्ञा में बदल देता।
- source_word: איש נבון
  choice: विवेकी मनुष्य
  rationale: נבון का बल सामान्य बुद्धिमत्ता से अधिक समझ-बूझ और परख पर है; ‘विवेकी’ इस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ילין עד בקר
  choice: वह भोर तक रात बिताएगा
  rationale: क्रिया לין/לון रात ठहरने या रात बिताने का बोध देती है। ‘रात बिताएगा’ हिन्दी में स्वाभाविक है और रात्रिकालीन अर्थ को बनाए रखता है।
- source_word: ונפשו עמו
  choice: और उसका जीवन उसके साथ रहेगा
  rationale: נפש यहाँ जीवन, स्वयं या प्राण का बोध दे सकता है। प्रसंग में जीवित और सुरक्षित बने रहने का अर्थ सबसे उपयुक्त है, पर वैकल्पिक ‘प्राण’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: φονεύων τὸν πλησίον ὁ ἀφαιρούμενος συμβίωσιν
  choice: मुख्य पाठ में नहीं अपनाया गया; पाठांतर के रूप में पाद-टिप्पणी में दिया गया
  rationale: यूनानी समानांतर उपलब्ध इब्रानी पाठ से बहुत भिन्न है और संभवतः अलग पाठ-रूप को दर्शाता है। उपलब्ध इब्रानी साक्ष्य को मुख्य आधार बनाया गया है।
theological_decisions:
- issue: נפש का मानव-स्वरूप संबंधी अर्थ
  choice: जीवन
  alternative: प्राण/आत्मा
  rationale: इब्रानी נפש का अर्थक्षेत्र हिन्दी के धर्मवैचारिक शब्द ‘आत्मा’ से व्यापक है। यहाँ कथन जीवित बने रहने की ओर संकेत करता है; इसलिए किसी विशिष्ट द्वैतवादी मानव-विज्ञान को आरोपित नहीं किया गया।
- issue: इब्रानी और यूनानी साक्ष्यों का तीव्र अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण
  alternative: यूनानी पाठ का अनुवाद मुख्य पाठ के रूप में करना
  rationale: इस पद के लिए इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है। यूनानी अंतर को दबाने के बजाय पाद-टिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। मूल इब्रानी की कुछ असामान्य संरचना—विशेषकर ‘जीवन के वर्ष ... के साथ’—को अर्थ बढ़ाए बिना यथासंभव सुरक्षित रखा गया है।
