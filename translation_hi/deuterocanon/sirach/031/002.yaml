translation:
  language: hi
  text: जो छाया को पकड़ने का प्रयत्न करता और हवा का पीछा करता है, वैसा ही वह है जो सपनों से चिपका रहता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहाना में इस स्थान से जुड़ा उपलब्ध इब्रानी साक्ष्य इससे बहुत भिन्न पाठ देता है: “एक दुष्ट विश्वासपात्र बदनामी फैलाएगा, और भेद छिपाने वाला अपने प्राण के समान मित्र है।” इब्रानी और यूनानी पाठ इस पद-संदर्भ पर मेल नहीं खाते; इसलिए 31:2 के मुख्य पाठ में यूनानी साक्ष्य का अनुसरण किया गया है।'
    reason: textual_variant
  - marker: b
    text: या, “जो सपनों पर ध्यान देता है”; अथवा, “जो सपनों को थामे रहता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: जो… वैसा ही
  rationale: यूनानी उपमा की तुलना को स्वाभाविक हिन्दी संरचना में व्यक्त करता है।
- source_word: δρασσόμενος
  choice: पकड़ने की कोशिश करता है
  rationale: यह कृदन्त किसी चीज़ को मुट्ठी में लेने या पकड़ने का भाव देता है; छाया के संदर्भ में ‘कोशिश’ जोड़ने से क्रिया की निष्फलता स्पष्ट होती है, बिना चित्र को बदले।
- source_word: σκιᾶς
  choice: छाया
  rationale: यह शब्द का सीधा अर्थ है और किसी अमूर्त, पकड़ में न आने वाली वस्तु का चित्र बनाए रखता है।
- source_word: διώκων
  choice: पीछा करने
  rationale: लगातार किसी के पीछे दौड़ने या उसका अनुसरण करने की सक्रिय क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἄνεμον
  choice: हवा
  rationale: मूल के अगोचर और पकड़ में न आने वाले लक्ष्य का चित्र सुरक्षित रहता है।
- source_word: ὁ ἐπέχων
  choice: जो…से चिपका रहता है
  rationale: क्रिया का अर्थ थामे रहना या ध्यान लगाए रखना हो सकता है। इस उपमा में ‘चिपका रहता है’ सपनों पर अनुचित पकड़ या निर्भरता का भाव देता है, पर अन्य अर्थ की संभावना फुटनोट में रखी गई है।
- source_word: ἐνυπνίοις
  choice: सपनों
  rationale: बहुवचन का सरल और स्वाभाविक हिन्दी रूप; ‘स्वप्न-दर्शन’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: इब्रानी और यूनानी साक्ष्यों के बीच पद-स्तरीय बड़ा अंतर
  choice: मुख्य पाठ में छाया पकड़ने और हवा का पीछा करने वाली यूनानी उपमा का अनुवाद
  alternative: 'काहाना में इस स्थान से जोड़ा गया इब्रानी पाठ: ‘एक विश्वासयोग्य बुरा व्यक्ति बदनामी भड़काएगा, और भेद छिपाने वाला अपने प्राण के समान मित्र है।’'
  rationale: दिया गया इब्रानी साक्ष्य यूनानी सिराख 31:2 की विषयवस्तु से मेल नहीं खाता और संभवतः पाठ-स्थानांतरण या भिन्न पाठ-परंपरा दर्शाता है। इसलिए इस संदर्भ-क्रम में यूनानी को मुख्य अनुवाद का आधार बनाया गया है और इब्रानी भिन्नता को स्पष्ट फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और चित्रात्मक शैली रखी गई है। ‘छाया को पकड़ने’ और ‘हवा का पीछा करने’ की समानांतर उपमा सुरक्षित है। पाठ-साक्ष्य की अनिश्चितता को मुख्य पाठ में सुलझा हुआ मानने के बजाय फुटनोट में स्पष्ट किया गया है।
