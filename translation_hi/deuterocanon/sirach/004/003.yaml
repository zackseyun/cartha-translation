base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/003.yaml
  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: hi
  text: गरीब के अंतरमन को कड़वा न करो[a], और ज़रूरतमंद के हृदय को पीड़ा न दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘गरीब के भीतरी अंग’; यह उसके गहरे आंतरिक भावों का बिंब है। यूनानी समानांतर में ‘हृदय’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: कड़वा न करो
  rationale: यहाँ חמר का भाव कड़वा या कठोर कर देने का है। ‘कड़वा न करो’ इब्रानी बिंब और भावनात्मक चोट, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְעֵי
  choice: अंतरमन
  rationale: शाब्दिक अर्थ ‘भीतरी अंग’ है, पर यह गहरी भावनाओं के केंद्र का बिंब है। हिन्दी में ‘अंतरमन’ ठोस इब्रानी मुहावरे के आशय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है; पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: דָךְ
  choice: गरीब
  rationale: शब्द दबे-कुचले, निर्बल या निर्धन व्यक्ति को सूचित कर सकता है। इस ज्ञान-साहित्यिक संदर्भ में ‘गरीब’ सर्वाधिक सहज है और सामाजिक असुरक्षा का भाव रखता है।
- source_word: קֶרֶב
  choice: हृदय
  rationale: मूल अर्थ ‘भीतर’ या ‘अंतर्भाग’ है, पर यहाँ समानांतर पंक्ति में आंतरिक भावनात्मक जीवन अभिप्रेत है। ‘हृदय’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: עָנִי
  choice: ज़रूरतमंद
  rationale: यह गरीब, पीड़ित या दीन व्यक्ति को दर्शा सकता है। ‘ज़रूरतमंद’ पहली पंक्ति के ‘गरीब’ से अर्थगत समानता रखते हुए अनावश्यक पुनरावृत्ति से बचता है।
- source_word: תַּכְאִיב
  choice: पीड़ा न दो
  rationale: כאב के कारक रूप का सीधा अर्थ पीड़ा पहुँचाना है। ‘पीड़ा न दो’ हिन्दी में संक्षिप्त, स्वाभाविक और मूल की ठोस शक्ति के अनुरूप है।
theological_decisions:
- issue: इब्रानी मानव-शरीर संबंधी मुहावरे को बनाए रखना या दोनों पंक्तियों को एक ही आधुनिक रूपक में ढालना
  choice: पहली पंक्ति में ‘अंतरमन’ और दूसरी में ‘हृदय’ रखकर दोनों इब्रानी पदों का अंतर बनाए रखा गया है; पादटिप्पणी में पहले पद का शाब्दिक बिंब दिया गया है।
  alternative: दोनों पंक्तियों में ‘हृदय’ या दोनों में ‘अंतरमन’ कहा जा सकता था।
  rationale: מְעֵי और קֶרֶב निकटार्थी हैं, पर एक ही शब्द नहीं। अलग हिन्दी अभिव्यक्तियाँ काव्यात्मक समानांतरता को सपाट किए बिना आंतरिक भावनात्मक जीवन का आशय स्पष्ट करती हैं। यूनानी समानांतर का ‘हृदय’ इस भावार्थ की पुष्टि करता है, पर पूरे इब्रानी बिंब को प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘अंतरमन’ भावार्थ को स्वाभाविक रखता है, जबकि पादटिप्पणी मूल इब्रानी के ठोस शारीरिक बिंब को सुरक्षित करती है।
