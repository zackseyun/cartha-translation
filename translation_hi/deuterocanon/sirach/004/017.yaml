base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: hi
  text: और जब तक उसका हृदय मुझसे भर न जाए[a], तब तक मैं लौटकर उसे सुखी करूँगी[b] और उसे अपने रहस्य प्रकट करूँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “जब तक वह उस पर भरोसा न करे,” अथवा “जब तक वह अपना प्राण उसे न सौंप दे”; आगे यह भी है कि बुद्धि “अपनी विधियों के द्वारा उसे परखेगी।” यह बुद्धि के अनुकूल होकर लौटने से पहले उसकी परीक्षा का अधिक विस्तृत पाठ दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: या “उसे धन्य करूँगी” अथवा “उसे सुखी घोषित करूँगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: और जब तक ... तब तक
  rationale: यह पद समय की सीमा बताता है। हिन्दी में ‘जब तक...तब तक’ स्वाभाविक है और इब्रानी संयोजक तथा कालगत अर्थ दोनों को सुरक्षित रखता है।
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: उसका हृदय मुझसे भर न जाए
  rationale: इब्रानी का सीधा बिंब ‘उसका हृदय मुझसे भर जाए’ है। सन्दर्भ में बुद्धि स्त्रीरूप में स्वयं बोल रही है; इसलिए यूनानी के भरोसे के भाव को मुख्य पाठ में रखकर इस बिंब को व्याख्यायित नहीं किया गया।
- source_word: אָשׁוּב
  choice: मैं लौटकर
  rationale: שוב का सामान्य अर्थ लौटना या फिर मुड़ना है। ‘लौटकर’ अगले अनुग्रहकारी कार्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: उसे सुखी करूँगी
  rationale: क्रिया किसी को सुखी या धन्य करने अथवा सुखी घोषित करने का भाव रखती है। ‘सुखी करूँगी’ आधुनिक हिन्दी में स्पष्ट है और आवश्यकता से अधिक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: וְגָלִיתִי לוֹ
  choice: उस पर प्रकट करूँगी
  rationale: גלה का अर्थ खोलना या प्रकट करना है। रहस्य किसी ‘पर प्रकट करना’ स्वाभाविक हिन्दी मुहावरा है।
- source_word: מִסְתָּרִי
  choice: अपने रहस्य
  rationale: यह पद छिपी या गुप्त बातों को सूचित करता है। ‘रहस्य’ संक्षिप्त, गरिमापूर्ण और सहज है।
theological_decisions:
- issue: इब्रानी पंक्ति और अधिक विस्तृत यूनानी समानांतर पाठ का सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद किया गया है; यूनानी के भरोसे, भय और परीक्षा वाले अतिरिक्त अंश को पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में यूनानी के अनुसार बुद्धि द्वारा भरोसा करने और अपनी विधियों में परखने का विस्तृत कथन जोड़ना।
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता दी जानी चाहिए। यूनानी पाठ व्यापक प्रसंग को स्पष्ट करता है, पर उसके अतिरिक्त वाक्यांशों को उपलब्ध इब्रानी में चुपचाप नहीं मिलाना चाहिए।
- issue: व्यक्तिरूप बुद्धि के वक्ता का लिंग
  choice: ‘करूँगी’ द्वारा स्त्रीलिंग वक्ता रखा गया है।
  alternative: लिंग-निरपेक्ष या पुल्लिंग क्रियारूप।
  rationale: पूर्ववर्ती प्रसंग में बोलने वाली व्यक्तिरूप बुद्धि है, जो इब्रानी और यूनानी परम्परा में स्त्रीलिंग है; हिन्दी क्रिया में यह स्वाभाविक रूप से व्यक्त होता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु बाइबिलीय गरिमा बनाए रखती है। ‘हृदय मुझसे भर जाए’ की मूल रूपकात्मक और कुछ हद तक रहस्यमय भाषा को सरल व्याख्या में नहीं बदला गया। स्त्रीलिंग क्रियाएँ व्यक्तिरूप बुद्धि को वक्ता के रूप में स्पष्ट करती हैं।
