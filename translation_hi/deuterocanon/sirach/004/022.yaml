translation:
  language: hi
  text: अपने ही विरुद्ध पक्षपात मत कर, और अपनी ठोकरों में ठोकर मत खा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: पक्षपात न कर
  rationale: नשא פנים का शाब्दिक अर्थ ‘मुख उठाना’ है, पर यह इब्रानी मुहावरा पक्षपात या विशेष रियायत करने के अर्थ में आता है; यूनानी समानांतर भी इसी मुहावरे की पुष्टि करता है।
- source_word: עַל נַפְשֶׁךָ
  choice: अपने ही विरुद्ध
  rationale: נפש यहाँ व्यक्ति के अपने आप या अपने जीवन को सूचित करता है। על और यूनानी κατά के आधार पर ‘अपने ही विरुद्ध’ मूल कथन के जानबूझकर रखे गए विरोधाभास को सुरक्षित रखता है।
- source_word: וְאַל תִּכָּשֵׁל
  choice: और ... ठोकर न खा
  rationale: प्राप्त इब्रानी पाठ में כשל का सीधा अर्थ ‘ठोकर खाना’ या ‘गिर पड़ना’ है। इसलिए मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है; यूनानी में पाया जाने वाला ‘लज्जित न हो’ पादटिप्पणी में दिया गया है।
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: अपनी ठोकरों के कारण
  rationale: מכשול बाधा, ठोकर या गिरने के कारण को व्यक्त कर सकता है। इब्रानी में बहुवचन प्रत्यय स्पष्ट है; ‘अपनी ठोकरों के कारण’ उसकी पुनरुक्ति और संभावित व्यापकता को बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी में दूसरी पंक्ति का अंतर
  choice: मुख्य पाठ में इब्रानी ‘ठोकर न खा’ को रखा गया
  alternative: यूनानी के अनुसार ‘लज्जित न हो, नहीं तो तू गिर पड़ेगा’
  rationale: दिया गया इब्रानी पाठ उच्च विश्वसनीयता वाला प्राथमिक स्रोत है और व्याकरणतः स्पष्ट रूप से כשל से जुड़ा है। भिन्न यूनानी पाठ अर्थपूर्ण है, पर उसे मुख्य पाठ में रखकर इब्रानी को चुपचाप बदलना उचित नहीं; अतः उसे पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त एकवचन निषेधात्मक शैली अपनाई गई है। ‘ठोकर’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि वह इब्रानी כשל/מכשול के शब्द-संबंध को प्रकट करती है।
