  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
translation:
  language: hi
  text: और परमेश्वर तुम्हें “पुत्र” कहेगा,[a] वह तुम पर अनुग्रह करेगा और तुम्हें गर्त से बचाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “और तुम परमप्रधान के पुत्र के समान होगे, और वह तुम्हारी माता से भी बढ़कर तुमसे प्रेम करेगा।” इसके विपरीत इब्रानी साक्ष्य में है: “और परमेश्वर तुम्हें ‘पुत्र’ कहेगा, वह तुम पर अनुग्रह करेगा और तुम्हें गर्त से बचाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: और परमेश्वर
  rationale: यहाँ אֵל सामान्य व्यक्तिगत ईश्वरीय पदनाम है। “परमेश्वर” आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक है और यूनानी समानांतर के “परमप्रधान” से भी संगत है।
- source_word: יִקְרָאֲךָ בֵּן
  choice: तुम्हें “पुत्र” कहेगा
  rationale: इब्रानी में शाब्दिक रूप से “तुम्हें पुत्र कहेगा” है। उद्धरण-चिह्न विधेयात्मक संबोधन को स्पष्ट करते हैं; “अपना पुत्र” नहीं जोड़ा गया, क्योंकि मूल में स्वत्ववाचक शब्द नहीं है।
- source_word: וְיָחְנְךָ
  choice: वह तुम पर अनुग्रह करेगा
  rationale: חנן का मूल भाव कृपा या अनुग्रह दिखाना है। यह चयन दया मात्र की अपेक्षा ईश्वर की कृपापूर्ण पहल को सुरक्षित रखता है।
- source_word: וְיַצִּילְךָ
  choice: तुम्हें ... से बचाएगा
  rationale: נצל का अर्थ छुड़ाना या बचाना है। “बचाएगा” सहज आधुनिक हिन्दी है और अगले पदबंध में संकट के स्रोत को खुला रखता है।
- source_word: מִשָׁחַת
  choice: गर्त से
  rationale: שחת का अर्थ गर्त, कब्र अथवा विनाश हो सकता है। “गर्त” मृत्यु-संबंधी गहराई की छवि को बनाए रखता है, पर इसे केवल कब्र या अंतिम विनाश के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: धर्मी सेवक के लिए ईश्वरीय पुत्रत्व की भाषा
  choice: परमेश्वर तुम्हें “पुत्र” कहेगा
  alternative: तुम परमप्रधान के पुत्र के समान होगे
  rationale: उपलब्ध इब्रानी साक्ष्य सीधे कहता है कि परमेश्वर संबोधित व्यक्ति को “पुत्र” कहेगा, जबकि यूनानी में तुलना, “पुत्र के समान,” है। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखता है, बिना बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। “पुत्र” मूल के एकवचन पुल्लिंग को सुरक्षित रखता है; “अनुग्रह” बाइबलीय गरिमा बनाए रखते हुए प्रचलित है। “गर्त” जानबूझकर अर्थगत व्यापकता रखता है ताकि שחת को केवल कब्र, मृत्यु या विनाश में सीमित न किया जाए।
