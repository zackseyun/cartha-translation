base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/021.yaml
  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
translation:
  language: hi
  text: क्योंकि ऐसी लज्जा भी होती है जो पाप का दोष लाती है,[a] और ऐसी लज्जा भी होती है जो सम्मान और कृपा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “अधर्म का भार उठाती है”; यूनानी पाठ के अनुसार, “पाप लाती है” या “पाप की ओर ले जाती है।”
    reason: इब्रानी מַשְׂאֵת עָוֹן संक्षिप्त और अर्थ की दृष्टि से कठिन है; पादटिप्पणी इब्रानी तथा यूनानी से सम्भव अर्थों को सुरक्षित रखती है।
  - marker: b
    text: या “महिमा और अनुग्रह।”
    reason: כָּבוֹד और חֵן के वैकल्पिक, अधिक उन्नत अर्थों को दर्ज किया गया है।
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: लज्जा
  rationale: यह शब्द नैतिक और सामाजिक दोनों प्रकार की शर्म को व्यक्त करता है। ‘लज्जा’ आधुनिक हिन्दी में स्वाभाविक है और दोनों खंडों में एक ही शब्द बनाए रखती है।
- source_word: מַשְׂאֵת עָוֹן
  choice: पाप-दोष लाती है
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। यह अनुवाद עָוֹן के पाप तथा उससे जुड़े दोष—दोनों पहलुओं को रखता है और यूनानी समानांतर के परिणामसूचक भाव से भी मेल खाता है। अधिक शाब्दिक इब्रानी और यूनानी विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כָּבוֹד
  choice: सम्मान
  rationale: כָּבוֹד का अर्थ सम्मान या महिमा हो सकता है। इस नैतिक-सामाजिक विरोध में ‘सम्मान’ सहज और स्पष्ट है।
- source_word: חֵן
  choice: कृपा
  rationale: חֵן स्वीकृति, कृपादृष्टि या अनुग्रह का भाव रखता है। ‘कृपा’ संक्षिप्त और प्रचलित है; वैकल्पिक उन्नत शब्द पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: מַשְׂאֵת עָוֹן का अर्थ
  choice: लज्जा का एक प्रकार पाप-दोष का कारण बनता है
  alternative: ‘अधर्म का भार उठाती है’ अथवा यूनानी के अनुसार ‘पाप लाती है/पाप की ओर ले जाती है’
  rationale: जीवित इब्रानी पाठ को प्राथमिक रखते हुए उसके संक्षिप्त पदबंध को हिन्दी में बोधगम्य बनाया गया है। यूनानी समानांतर नकारात्मक परिणाम की पुष्टि करता है, पर इब्रानी में दोष वहन करने की सम्भावना को पादटिप्पणी में छोड़ा गया है।
- issue: दूसरी लज्जा को सम्मान और कृपा से जोड़ना
  choice: 'स्रोत की सीधी विधेयात्मक रचना बनाए रखी गई: ‘जो सम्मान और कृपा है’'
  alternative: ‘जो सम्मान और कृपा दिलाती है’
  rationale: स्रोत यह स्पष्ट नहीं करता कि लज्जा स्वयं सम्मान और कृपा है या उन्हें उत्पन्न करती है। इसलिए कारणसूचक विस्तार जोड़कर तनाव को चुपचाप नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर रचना ‘ऐसी लज्जा भी होती है’ दोनों प्रकार की लज्जा का स्पष्ट विरोध दिखाती है। ‘पाप-दोष’ कठिन इब्रानी पदबंध के नैतिक कर्म और उससे उत्पन्न दोष—दोनों अर्थों को सामान्य पाठक के लिए समेटता है।
