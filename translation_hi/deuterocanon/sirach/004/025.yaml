    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: विरोध न करो
  rationale: इस इब्रानी क्रिया में इनकार करने, अड़ने या प्रतिरोध करने का भाव है। ‘विरोध न करो’ आधुनिक हिन्दी में स्वाभाविक है और अगले आदेश ‘दीन बनो’ के विपरीत मानवीय मुद्रा को स्पष्ट रखता है।
- source_word: עִם הָאֵל
  choice: परमेश्वर का
  rationale: אֵל सामान्य ईश्वरीय उपाधि है। हिन्दी में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है; עִם को क्रिया के साथ मुहावरेदार ढंग से ‘परमेश्वर का विरोध’ में व्यक्त किया गया है।
- source_word: וְאֶל אֱלֹהִים
  choice: बल्कि परमेश्वर के सामने
  rationale: וְ यहाँ दो विपरीत मुद्राओं को जोड़ता है, इसलिए हिन्दी में ‘बल्कि’ संबंध को स्पष्ट करता है। אֶל का दिशात्मक भाव ‘के सामने’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הִכָּנֵעַ
  choice: दीन बनो
  rationale: इस रूप में स्वयं को नम्र करने अथवा अधीन होने का भाव है। ‘दीन बनो’ संक्षिप्त, सहज और गरिमापूर्ण है तथा केवल बाहरी आज्ञापालन के बजाय आंतरिक नम्रता भी व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में उल्लेखनीय अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है।
  alternative: “सत्य का विरोध न करो, और अपनी अशिक्षा पर लज्जित हो।”
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी पाठ संभवतः भिन्न मूलपाठ या पाठ-विकास को दर्शाता है; इसलिए उसके महत्वपूर्ण वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। ‘विरोध’ और ‘दीन’ के द्वारा इब्रानी की विरोधी मुद्राएँ—परमेश्वर के विरुद्ध अड़ना और उनके सामने नम्र होना—संक्षेप में व्यक्त होती हैं।
