review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the Hebrew’s broader reference to a person in need and a person crushed/dejected in inner being, rather than narrowing the first clause to hunger. Its rendering of the difficult verb as “दुःखी न कर” is appropriately restrained and is supported by the Greek parallel’s sense, “do not grieve.” Adding “और अधिक” makes explicit the contextual force of not worsening an already distressed person’s condition without materially narrowing the Hebrew.
  naturalness: The syntax is clear and modern. “और दुःखी न कर” is slightly incomplete idiomatically in this context; “और अधिक दुःखी न कर” is more natural and accurately conveys aggravation of existing need. “मन से कुचले हुए व्यक्ति” is understandable, but “मन से कुचले व्यक्ति” is smoother while retaining the metaphor.
  terminology: “अभावग्रस्त व्यक्ति” suitably represents the needy/distressed נפש without introducing doctrinal implications of “आत्मा.” “अनदेखी न कर” naturally conveys the reflexive sense of deliberately disregarding or hiding oneself from someone. The footnote accurately identifies the Greek as a parallel and preserves its distinct wording.
  issues:
  - severity: low
    issue: The first prohibition lacks the adverb “अधिक.”
    rationale: Because the person is already characterized as needy/distressed, “और अधिक दुःखी न कर” better expresses the warning against exacerbating that state and reads more idiomatically in Hindi.
  - severity: low
    issue: “मन से कुचले हुए व्यक्ति” is somewhat heavier than necessary.
    rationale: “मन से कुचले व्यक्ति” is more concise and natural while retaining the Hebrew image of a person crushed in their inner being.
  - severity: low
    issue: The footnote says “भूखे प्राणी.”
    rationale: For Greek ἄνδρα in the second clause and for natural Hindi register, “भूखे व्यक्ति” is preferable to “भूखे प्राणी”; it also avoids an unnecessarily nonhuman-sounding word in this context.
  revised_text: अभावग्रस्त व्यक्ति को और अधिक दुःखी न कर[a], और मन से कुचले व्यक्ति की अनदेखी न कर।
