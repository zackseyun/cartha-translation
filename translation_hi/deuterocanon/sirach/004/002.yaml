  text: अभावग्रस्त व्यक्ति को और अधिक दुःखी न कर[a], और मन से कुचले व्यक्ति की अनदेखी न कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “भूखे व्यक्ति को दुःखी न कर, और किसी मनुष्य को उसके संकट में न भड़का।” इब्रानी पाठ अधिक व्यापक है—वह अभावग्रस्त और मन से कुचले व्यक्ति की बात करता है—इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: अभावग्रस्त व्यक्ति
  rationale: חֲסֵרָה अभाव या आवश्यकता की दशा बताता है, जबकि דֹּוֶוה पीड़ा या दुर्बलता का भाव जोड़ता है। ‘अभावग्रस्त व्यक्ति’ इब्रानी की व्यापकता बनाए रखता है और इसे केवल शारीरिक भूख तक सीमित नहीं करता।
- source_word: אַל תָּפוּחַ
  choice: और दुःखी न कर
  rationale: यह कठिन क्रियारूप पहले से संकट में पड़े व्यक्ति की पीड़ा बढ़ाने की मनाही करता है। यूनानी λυπήσῃς भी ‘दुःखी करना’ का समर्थन करता है; इसलिए अनिश्चित व्युत्पत्ति के बीच यह संयत और स्रोत-संगत अनुवाद है।
- source_word: וְאַל תִּתְעַלֵּם
  choice: अनदेखी न कर
  rationale: עלם का हित्पएल रूप अपने को छिपाने या जानबूझकर ध्यान न देने का भाव रखता है। आधुनिक हिन्दी में ‘अनदेखी न कर’ इस मुहावरे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: मन से कुचला हुआ व्यक्ति
  rationale: מְדֻכְדַּךְ टूटे, दबे या अत्यंत हताश व्यक्ति को सूचित करता है। ‘मन से कुचला हुआ’ मूल रूपक की तीव्रता बचाता है, जबकि נֶפֶשׁ को यहाँ पूरे व्यक्ति की आंतरिक दशा के रूप में व्यक्त करता है।
