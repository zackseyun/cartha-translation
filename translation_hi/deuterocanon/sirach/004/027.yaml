  yaml_path: translation/deuterocanon/sirach/004/027.yaml
  text: Do not abase yourself before a fool[b][a], and do not show partiality before rulers.
translation:
  language: hi
  text: किसी मूर्ख के सामने अपने आपको अपमानित मत करो[a], और शासकों के सामने पक्षपात मत करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक चित्र है, “अपने आपको किसी मूर्ख के लिए मत बिछाओ।” यूनानी समानांतर इसे किसी मूर्ख व्यक्ति के सामने अपने आपको नीचा करने के अर्थ में स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: दूसरे चरण का इब्रानी रूप अकेले देखने पर कम स्पष्ट है और उसका अर्थ “शासकों के सामने भरोसा मत करो” भी लिया जा सकता है। यूनानी समानांतर में शाब्दिक रूप से “किसी शासक का चेहरा स्वीकार मत करो” है, अर्थात उसका पक्ष मत लो; यह “पक्षपात मत करो” अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: अपने आपको नीचा मत गिराओ
  rationale: יצע का मूल चित्र किसी वस्तु को फैलाने या बिछाने का है, और נפש यहाँ पूरे व्यक्ति या ‘स्वयं’ को सूचित करता है। यूनानी समानांतर भी अपने आपको किसी के नीचे बिछा देने के रूपक की पुष्टि करता है। आधुनिक हिन्दी में ‘अपने आपको नीचा गिराना’ इस आत्म-अपमान के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְנָבָל
  choice: किसी मूर्ख के सामने
  rationale: נבל केवल कम बुद्धि वाले व्यक्ति के बजाय नैतिक अर्थ में मूर्ख या निकृष्ट व्यक्ति को सूचित करता है। ‘मूर्ख’ सीधा और सामान्य हिन्दी विकल्प है; ‘के सामने’ सामाजिक मुद्रा और यूनानी समानांतर के अनुरूप है।
- source_word: וְאַל תַּאֲמֵן
  choice: पक्षपात मत करो
  rationale: इब्रानी रूप अकेले देखने पर ‘भरोसा मत करो’ जैसा भी समझा जा सकता है, पर यूनानी समानांतर ‘किसी शासक का मुँह ग्रहण न करना’ अर्थात उसका पक्ष न लेना पढ़ता है। इसलिए ‘पक्षपात मत करो’ संभावित सामाजिक-न्यायिक आशय को स्पष्ट करता है।
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: शासकों के सामने
  rationale: מושלים अधिकार चलाने वालों को सूचित करता है। ‘शासक’ व्यापक और सहज हिन्दी शब्द है, जबकि ‘के सामने’ לפני के उपस्थिति-संबंधी भाव को बनाए रखता है।
theological_decisions:
- issue: दूसरे चरण में इब्रानी תַּאֲמֵן और यूनानी समानांतर के बीच अर्थगत अस्पष्टता
  choice: इसे शासकों के सामने पक्षपात करने की मनाही के रूप में प्रस्तुत किया गया है।
  alternative: ‘शासकों के सामने भरोसा मत करो’ या ‘शासकों के आगे दब्बू मत बनो।’
  rationale: इब्रानी पाठ प्राथमिक है, किंतु यहाँ उसका रूप अलग से देखने पर कम पारदर्शी है। उपलब्ध यूनानी समानांतर ‘शासक का मुँह ग्रहण करने’ की मनाही देता है और पक्षपात का सामाजिक-न्यायिक अर्थ समर्थित करता है। फिर भी पाठ की वास्तविक अस्पष्टता को पादटिप्पणी में खुलकर रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘अपने आपको नीचा मत गिराओ’ मूल रूपक का अर्थ सहज हिन्दी में देता है, जबकि पादटिप्पणी बिछाने के शाब्दिक चित्र को सुरक्षित रखती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
