  yaml_path: translation/deuterocanon/sirach/004/011.yaml
  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
translation:
  language: hi
  text: बुद्धि ने अपने बच्चों को शिक्षा दी है, और वह उन सबके पक्ष में गवाही देती है जो उसके विषय में समझ रखते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “बुद्धि अपने पुत्रों को ऊँचा उठाती है और उसे खोजनेवालों को थाम लेती है।” उपलब्ध इब्रानी पाठ में है: “बुद्धि ने अपने बच्चों को शिक्षा दी है और वह उन सबके पक्ष में गवाही देती है जो उसके विषय में समझ रखते हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: חָכְמוֹת
  choice: बुद्धि
  rationale: रूप बहुवचन-जैसा है, पर यहाँ यह स्त्रीलिंग में व्यक्तित्व धारण की हुई ‘बुद्धि’ के लिए प्रयुक्त है; यूनानी समानांतर भी एकवचन स्त्रीलिंग है।
- source_word: לִמְּדָה
  choice: शिक्षा दी है
  rationale: למד का अर्थ ‘सिखाना/शिक्षा देना’ है। सिद्ध वर्तमान प्रभाव वाले कथन के लिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: בָנֶיהָ
  choice: अपने बच्चों को
  rationale: בנים का अर्थ प्रसंगानुसार ‘पुत्र’ या व्यापक रूप से ‘बच्चे’ हो सकता है। मातृरूप में चित्रित बुद्धि के अनुयायियों के लिए ‘बच्चों’ से आशय अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं होता।
- source_word: וְתָעִיד
  choice: गवाही देती है
  rationale: क्रिया का मूल भाव ‘साक्षी होना/गवाही देना’ है। यह न्यायिक साक्ष्य की छाया को बनाए रखता है; यूनानी पाठ यहाँ भिन्न है।
- source_word: לְכָל
  choice: उन सबके पक्ष में
  rationale: ל का अर्थ प्रसंग में ‘के लिए/के पक्ष में’ समझा गया है। ‘पक्ष में’ हिन्दी में अनुकूल गवाही का भाव स्पष्ट और स्वाभाविक बनाता है।
- source_word: מְבִינִים בָּהּ
  choice: जो उसके विषय में समझ रखते हैं
  rationale: בין का कृदन्त विवेक या समझ रखनेवालों को दर्शाता है, और בָּהּ बुद्धि के संबंध में उनकी समझ बताता है। यह शाब्दिक ‘उसमें’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: बुद्धि का स्त्रीरूप व्यक्तिकरण
  choice: ‘बुद्धि’ के लिए स्त्रीलिंग ‘वह’ और उसके बच्चे
  alternative: बुद्धि को केवल निर्जीव अमूर्त गुण मानकर व्यक्तिकरण हटा देना
  rationale: इब्रानी व्याकरण और काव्यात्मक चित्रण बुद्धि को स्त्रीरूप व्यक्ति के रूप में प्रस्तुत करते हैं; इसे बनाए रखना पाठ की साहित्यिक और धर्मवैचारिक बनावट की रक्षा करता है।
- issue: इब्रानी और यूनानी के दूसरे खंड में भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुवाद
  alternative: यूनानी के अनुसार ‘उसे खोजनेवालों को थाम लेती है’
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है; पर्याप्त भिन्न यूनानी पाठ को पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। ‘बुद्धि’ सामान्य पाठक के लिए परिचित है और मूल के स्त्रीरूप व्यक्तिकरण को स्वाभाविक रूप से बनाए रखती है।
