base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/005.yaml
  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: hi
  text: जो कड़वे मन से और अपने प्राण की पीड़ा में पुकारता है[a]—उसकी चट्टान उसकी पुकार सुनेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “विनती करने वाले से अपनी आँखें न फेरो, और किसी मनुष्य को तुम्हें शाप देने का अवसर न दो।” इसके विपरीत, उपलब्ध इब्रानी साक्ष्य इस बात पर बल देता है कि पीड़ित व्यक्ति की पुकार उसकी चट्टान सुनेगी।'
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: जो ... पुकार रहा है
  rationale: इब्रानी कृदन्त किसी व्यक्ति को पुकारने की सक्रिय अवस्था में दिखाता है; यह रूप उस सजीवता को बनाए रखता है।
- source_word: מַר רוּחַ
  choice: मन की कड़वाहट में
  rationale: शाब्दिक अर्थ ‘आत्मा/मन में कड़वा’ है। आधुनिक हिन्दी में यह गहरी भीतरी व्यथा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: अपनी आत्मा की पीड़ा में
  rationale: נפש यहाँ व्यक्ति के भीतरी स्व को सूचित करता है। ‘आत्मा’ गहरी व्यक्तिगत पीड़ा को बनाए रखता है, बिना किसी बाद की व्यवस्थित मानव-विज्ञान संबंधी धारणा को आरोपित किए।
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: उसकी पुकार की आवाज़
  rationale: इब्रानी की श्रव्य छवि—‘उसकी पुकार की आवाज़ पर’—को हिन्दी में निकट और बोधगम्य रूप में रखा गया है।
- source_word: צוּרוֹ
  choice: उसका चट्टान
  rationale: यह परमेश्वर के लिए प्रयुक्त अर्थपूर्ण इब्रानी रूपक ‘उसकी चट्टान’ है; इसे ‘परमेश्वर’ या ‘रक्षक’ कहकर सपाट नहीं किया गया। असामान्य पुल्लिंग व्याकरण इस बात का संकेत भी देता है कि यह सामान्य पत्थर नहीं, एक दैवी उपाधि है।
- source_word: יִשְׁמַע
  choice: सुनेगा
  rationale: 'चेतावनी-सदृश प्रसंग में yiqtol का भावी/परिणामी बल उपयुक्त है: पीड़ित की पुकार उसका चट्टान सुनेगा।'
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है; यूनानी के भिन्न पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी के आधार पर मुख्य पाठ में यह आज्ञा जोड़ना: ‘विनती करनेवाले से अपनी आँख न फेर।’'
  rationale: प्रदत्त इब्रानी पंक्ति में निषेधात्मक आज्ञा नहीं है और उसका दूसरा खंड पीड़ित की पुकार सुननेवाले ‘चट्टान’ पर केंद्रित है। यूनानी पाठ प्रसंग के लिए महत्त्वपूर्ण है, पर उसे मुख्य इब्रानी पाठ में मिलाने से वास्तविक पाठांतर छिप जाएगा।
- issue: נפש का अर्थ
  choice: आत्मा
  alternative: प्राण, स्वयं, भीतरी अस्तित्व
  rationale: ‘पीड़ा’ और ‘मन की कड़वाहट’ के साथ यह शब्द गहरी आंतरिक व्यथा बताता है। ‘आत्मा’ इस गहराई को बनाए रखता है, पर यहाँ उससे किसी विशिष्ट सांप्रदायिक मानव-विज्ञान को सिद्ध नहीं किया जाता।
- issue: צוּרוֹ में दैवी रूपक
  choice: उसका चट्टान
  alternative: उसका परमेश्वर, उसका रक्षक, उसका सृजनहार
  rationale: ‘चट्टान’ दैवी दृढ़ता और आश्रय का अर्थपूर्ण रूपक है। इसे सामान्यीकृत करने के बजाय मूल तनाव और चित्रात्मकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्यांश खंडित-सा है, क्योंकि उपलब्ध इब्रानी भी ‘जो पुकार रहा है...’ से आरम्भ होता है; इसे कृत्रिम आज्ञा जोड़कर पूर्ण नहीं किया गया। ‘चट्टान’ को दैवी उपाधि के रूप में सुरक्षित रखा गया है।
