  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: hi
  text: क्योंकि यदि वह अपने मन की कड़वाहट में तुम्हारे विरुद्ध पुकार उठे, तो उसका रचयिता उसकी विनती सुनेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध कैरो गनीज़ा का इब्रानी वाक्य इस पद के यूनानी पाठ से मेल नहीं खाता; इसलिए मुख्य अनुवाद यूनानी साक्ष्य पर आधारित है।
    reason: textual_variant
  - marker: b
    text: या, “तुम्हारे विरुद्ध न्याय की दुहाई दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  choice: तुम्हारे विरुद्ध पुकार उठे
  rationale: यह पद पीड़ित व्यक्ति की संबोधित व्यक्ति के विरुद्ध की गई तीखी अपील को व्यक्त करता है। यह अनुवाद क्रिया की प्रतिकूल दिशा बनाए रखता है, पर मुख्य पाठ में सीधे ‘शाप देना’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: अपने मन की कड़वाहट में
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन और गहरे भाव को दर्शाता है। आधुनिक हिन्दी में ‘मन की कड़वाहट’ स्वाभाविक है और वाक्य की भावनात्मक तथा नैतिक तीव्रता बनाए रखती है।
- source_word: δέησις
  choice: विनती
  rationale: ‘विनती’ सहज आधुनिक हिन्दी में सहायता के लिए की गई गंभीर और तात्कालिक प्रार्थना को व्यक्त करती है; यह केवल सामान्य ‘प्रार्थना’ की अपेक्षा प्रसंग की अपीलात्मक ध्वनि को बेहतर रखती है।
- source_word: ἐπακούσεται
  choice: सुनेगा
  rationale: क्रिया अनुकूलतापूर्वक सुनने का संकेत देती है। ‘सुनेगा’ निहित प्रत्युत्तर को बनाए रखता है, पर उसे स्पष्ट रूप से ‘उत्तर देगा’ कहकर अधिक अनुवाद नहीं करता।
- source_word: ὁ ποιήσας αὐτόν
  choice: उसका रचयिता
  rationale: यह संक्षिप्त अभिव्यक्ति परमेश्वर को उस पीड़ित व्यक्ति के बनाने वाले के रूप में प्रस्तुत करती है और मूल की सृष्टिकर्ता-संबंधी बात को स्पष्ट रखती है।
theological_decisions:
- issue: इस पद में असंगत इब्रानी साक्ष्य और यूनानी समानांतर पाठ के बीच प्राथमिक पाठ का चयन
  choice: मुख्य अनुवाद यूनानी समानांतर पाठ से किया गया है और पाठांतर को पादटिप्पणी में बताया गया है।
  alternative: 'दिए गए कैरो गनीज़ा के इब्रानी वाक्य का अनुवाद करना: ‘सभा के लिए अपने प्राण से प्रेम रख, और अधिकारी के सामने अपना सिर और भी झुका।’'
  rationale: प्रस्तुत इब्रानी पंक्ति इस पद के यूनानी पाठ और निकटवर्ती प्रसंग से मेल नहीं खाती तथा संभवतः किसी दूसरे स्थान की है। इसलिए इस पद के लिए सुसंगत यूनानी साक्ष्य को आधार बनाना और स्रोत-संबंधी अनिश्चितता को स्पष्ट करना अधिक विश्वसनीय है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘मन की कड़वाहट’, ‘विनती’ और ‘रचयिता’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की भावनात्मक और धार्मिक गंभीरता भी बनी रहती है।
