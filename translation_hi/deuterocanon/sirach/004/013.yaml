base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/013.yaml
  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: hi
  text: जो उसे दृढ़ता से थामे रहते हैं, वे यहोवा से सम्मान पाएँगे[a], और यहोवा की आशीष के साथ उन पर कृपा की जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “जो उसे दृढ़ता से थामे रहता है, वह महिमा का उत्तराधिकारी होगा, और जहाँ कहीं वह प्रवेश करता है, प्रभु वहाँ आशीष देगा।” इब्रानी पाठ में है: “वे यहोवा से सम्मान पाएँगे” और “यहोवा की आशीष के साथ उन पर कृपा की जाएगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: जो उससे दृढ़ता से जुड़े रहते हैं
  rationale: תמך का मूल भाव थामना, सहारा देना या दृढ़ता से पकड़े रहना है। व्यक्तिरूप में प्रस्तुत बुद्धि के संदर्भ में यह अनुवाद निष्ठापूर्ण लगाव व्यक्त करता है; यूनानी κρατῶν भी दृढ़ता से थामने के भाव का समर्थन करता है।
- source_word: יִמְצְאוּ כָבוֹד
  choice: सम्मान पाएँगे
  rationale: יִמְצְאוּ का सीधा अर्थ 'पाएँगे/खोज पाएँगे' और כָבוֹד का यहाँ स्वाभाविक अर्थ 'सम्मान' है। हिंदी में 'सम्मान पाएँगे' मूल भाव को सहज रूप से व्यक्त करता है।
- source_word: מֵיהֹוָה
  choice: यहोवा से
  rationale: מִן स्रोत को सूचित करता है और יהוה परमेश्वर का विशिष्ट नाम है; इसलिए 'यहोवा से'।
- source_word: וְיֻחַנּוּ
  choice: उन पर अनुग्रह किया जाएगा
  rationale: חנן का पुअल रूप निष्क्रिय अर्थ रखता है—किसी पर कृपा या अनुग्रह किया जाना। यह अभिव्यक्ति निष्क्रियता को सुरक्षित रखती है और कर्ता को मूल से अधिक स्पष्ट नहीं करती।
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: यहोवा की आशीष के साथ
  rationale: בְּ का अर्थ यहाँ साहचर्य या साधन दोनों हो सकता है। 'के साथ' इस संभावित व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरीय विशिष्ट नाम יהוה है। 'यहोवा' हिंदी में प्रचलित नामरूप है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: अनुग्रह के कर्ता की पहचान
  choice: निष्क्रिय वाक्य—'उन पर अनुग्रह किया जाएगा'
  alternative: यहोवा उन पर अनुग्रह करेगा
  rationale: וְיֻחַנּוּ निष्क्रिय है। यद्यपि संदर्भ कर्ता के रूप में यहोवा की ओर संकेत करता है, अनुवाद मूल की व्याकरणिक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली। व्यक्तिरूप स्त्रीलिंग बुद्धि के लिए 'उससे' रखा गया है। 'सम्मान' सामाजिक और ईश्वरीय प्रतिष्ठा के संदर्भ में स्वाभाविक है; यूनानी के भिन्न पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
