  yaml_path: translation/deuterocanon/sirach/004/019.yaml
  text: If he turns away from me[a], I will cast him off and hand him over to plunderers.
translation:
  language: hi
  text: यदि वह मेरे पीछे चलना छोड़ दे[a], तो मैं उसे त्याग दूँगी और उसे लुटेरों के हवाले कर दूँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यदि वह भटक जाए, तो वह उसे छोड़ देगी और उसे उसके पतन के हाथों में सौंप देगी।” यह संभवतः किसी भिन्न आधार-पाठ या व्याख्यात्मक अनुवाद को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר מֵאַחֲרַי
  choice: मेरे पीछे चलना छोड़ दे
  rationale: शाब्दिक रूप से ‘मेरे पीछे से हट जाए’; यह इब्रानी मुहावरे में किसी का अनुसरण छोड़ने को व्यक्त करता है। आधुनिक हिन्दी में यह स्वाभाविक है और केवल भौतिक दूरी का अर्थ लेने से बचाता है।
- source_word: אַשׁלִיכֶנּוּ
  choice: मैं उसे त्याग दूँगी
  rationale: मूल क्रिया का ठोस अर्थ ‘फेंक देना’ है, पर यहाँ संबंध और संरक्षण वापस लेने के संदर्भ में ‘त्याग दूँगी’ उसका बल स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग वक्ता संदर्भ में बुद्धि है।
- source_word: וְאַסְגִּירֶנּוּ
  choice: और उसे ... के हवाले कर दूँगी
  rationale: यह किसी को दूसरे के अधिकार या वश में सौंप देने का causative भाव व्यक्त करता है; ‘के हवाले कर देना’ आधुनिक हिन्दी का स्पष्ट समतुल्य है।
- source_word: לַשֹׁדְדִים
  choice: लुटेरों
  rationale: इब्रानी संज्ञा लूटने वालों या आक्रमणकारी लुटेरों को दर्शाती है। ‘लुटेरों’ साधारण पाठक के लिए सीधा और सटीक है।
theological_decisions:
- issue: इब्रानी और यूनानी समानांतर पाठ में अंतर
  choice: मुख्य पाठ में इब्रानी ‘लुटेरों के हवाले’ का अनुसरण
  alternative: ‘उसके पतन के हाथों में सौंप देगी’ अथवा ‘उसे उसके विनाश के हवाले कर देगी’
  rationale: यहाँ उपलब्ध और उच्च-विश्वसनीयता वाला इब्रानी पाठ לַשֹׁדְדִים स्पष्ट रूप से ‘लुटेरों को’ कहता है। यूनानी पाठ संभवतः किसी अलग आधार-पाठ या व्याख्यात्मक अनुवाद को दर्शाता है; इसलिए उसका पाठ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: वक्ता का लिंग
  choice: स्त्रीलिंग प्रथम पुरुष—‘दूँगी’
  alternative: लिंग-तटस्थ या पुल्लिंग अभिव्यक्ति
  rationale: आस-पास के प्रसंग में बोलने वाली व्यक्तित्व-रूप में प्रस्तुत ‘बुद्धि’ है, जो इब्रानी में स्त्रीलिंग है। हिन्दी में प्रथम पुरुष भविष्यकाल लिंग व्यक्त करता है, इसलिए स्त्रीलिंग संदर्भानुकूल है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे पीछे चलना छोड़ दे’ इब्रानी मुहावरे को स्पष्ट करता है; ‘त्याग दूँगी’ और ‘हवाले कर दूँगी’ मूल की कठोरता तथा परिणाम दोनों बनाए रखते हैं।
