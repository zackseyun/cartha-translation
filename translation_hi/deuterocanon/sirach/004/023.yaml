translation:
  language: hi
  text: संसार में कोई बात कहने से मत रुको,[a] और अपनी बुद्धि मत छिपाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “उद्धार के समय किसी वचन को मत रोको।” ‘उद्धार’ का अनुवाद ‘छुटकारा’ भी हो सकता है। इब्रानी साक्ष्य में इसके बजाय “संसार में” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: मत रुको
  rationale: מנע का अर्थ रोकना या पीछे रखना है। ‘कहने से मत रुको’ निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דִּבֵּר
  choice: कोई बात कहने
  rationale: यह रूप वचन या बात कहने की ओर संकेत करता है। हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है, जबकि मूल का भाषण-संबंधी अर्थ बना रहता है।
- source_word: בָּעוֹלָם
  choice: संसार में
  rationale: उपलब्ध इब्रानी पाठ का असामान्य लेकिन स्पष्ट शब्दशः अर्थ ‘संसार में’ है। ‘ठीक समय पर’ कहना यूनानी समानांतर को मुख्य पाठ में मिला देता और वास्तविक पाठांतर को छिपा देता।
- source_word: וְאַל תַּצְפִּין
  choice: और ... मत छिपाओ
  rationale: צפן के causative रूप में छिपाने या गुप्त रखने का भाव है। ‘मत छिपाओ’ सरल, वर्तमान और सटीक है।
- source_word: אֶת חָכְמָתֶךָ
  choice: अपनी बुद्धि
  rationale: חכמה के लिए ‘बुद्धि’ स्वाभाविक हिन्दी बाइबलीय शब्द है; संबंधसूचक प्रत्यय को ‘अपनी’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: पहले उपवाक्य में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी ‘संसार में’ का अनुसरण
  alternative: 'यूनानी: ‘उद्धार के समय किसी वचन को मत रोको’'
  rationale: सिराख का उपलब्ध और उच्च-विश्वसनीयता वाला इब्रानी साक्ष्य प्राथमिक है। चूँकि यूनानी पाठ अर्थ की दृष्टि से काफी भिन्न है, उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल और गरिमापूर्ण रखी गई है। असामान्य इब्रानी पदबंध ‘संसार में’ को जानबूझकर सुरक्षित रखा गया है और यूनानी पाठांतर को पादटिप्पणी में दिया गया है।
