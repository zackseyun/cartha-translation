translation:
  language: hi
  text: यदि वह भटक जाए और उससे दूर हो जाए[a], तो वह उसे बन्धनों में बाँध देगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदावली कठिन है और इसमें दो विचलन-सूचक क्रियात्मक तत्व हैं। इसका अर्थ ‘यदि वह मुड़ जाए और दूर हो जाए’ भी हो सकता है। ‘उससे’ का संकेत प्रसंग में मानवीकृत बुद्धि की ओर समझा गया है; वह इब्रानी में स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में ‘उसे बन्धनों में बाँध देगी’ को ‘मैं उसे बेड़ियों में बाँध दूँगी’ भी समझा जा सकता है। यूनानी समानान्तर पाठ यहाँ बहुत भिन्न है: “तब वह फिर सीधे उसके पास आएगी, उसे आनन्दित करेगी और उस पर अपनी छिपी बातें प्रकट करेगी।” सम्भवतः यह सिराख के किसी भिन्न पाठ-रूप को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; ‘यदि’ इब्रानी की शर्त को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָסוּר
  choice: वह मार्ग से हट जाए
  rationale: סור का अर्थ मुड़ना, हटना या मार्ग से भटकना हो सकता है। ‘मार्ग से हटना’ ज्ञान-साहित्य की पथ-सम्बन्धी छवि को व्यक्त करता है, बिना किसी विशेष पाप को जोड़ने के।
- source_word: וּנְטוֹתֵיהוּ
  choice: मुख्य पाठ में ‘मार्ग से हट जाए’ के साथ समाहित
  rationale: यह रूप पाठगत और व्याकरणिक रूप से कठिन है। अलग, निश्चित अर्थ थोपने के बजाय इसे पहले क्रियापद के विचलन-संबंधी भाव में समाहित किया गया है; कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: וַאֲסַרְתִיהוּ
  choice: वह उसे … बाँध देगी
  rationale: सन्दर्भ में मानवीकृत बुद्धि स्त्रीलिंग कर्ता है। फिर भी इब्रानी रूप को ‘मैं उसे बाँध दूँगी’ भी समझा जा सकता है; यह विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בָאֲסוּרִים
  choice: बन्धनों में
  rationale: אֲסוּרִים बन्धन या बेड़ियाँ दर्शाता है। ‘बन्धनों में’ व्यापक अर्थ रखता है और अनावश्यक रूप से धातु की जंजीरों को निर्दिष्ट नहीं करता।
theological_decisions:
- issue: दूसरे उपवाक्य का कर्ता
  choice: 'मानवीकृत बुद्धि: ‘वह उसे … बाँध देगी’'
  alternative: 'प्रथम पुरुष में बुद्धि का कथन: ‘मैं उसे बाँध दूँगी’'
  rationale: आसपास के प्रसंग में बुद्धि स्त्रीलिंग व्यक्ति के रूप में कार्य करती है, इसलिए तीसरे पुरुष का पाठ साहित्यिक प्रवाह के अनुकूल है। इब्रानी रूप की सम्भावित प्रथम-पुरुष व्याख्या को पादटिप्पणी में रखा गया है।
- issue: इब्रानी और यूनानी पाठों का बड़ा अन्तर
  choice: मुख्य अनुवाद जीवित इब्रानी पाठ पर आधारित है
  alternative: यूनानी के अनुसार बुद्धि के लौटने, आनन्दित करने और अपने रहस्य प्रकट करने का पाठ
  rationale: इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वास वाला है। यूनानी सम्भवतः सिराख के किसी भिन्न पाठ-रूप को दर्शाता है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में पूरा बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य रखा गया है। ‘मार्ग से हट जाए’ सामान्य पाठक के लिए स्वाभाविक है और मूल की पथ-छवि को बनाए रखता है। ‘बन्धनों’ औपचारिक किंतु प्रचलित शब्द है; यह ‘बेड़ियों’ से अधिक व्यापक है।
