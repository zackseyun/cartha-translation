base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/014.yaml
  text: Those who minister to her minister to the Holy One[a], and God loves those who love her dwelling.
translation:
  language: hi
  text: जो उसकी सेवा करते हैं, वे पवित्र की सेवा करते हैं[a]; और परमेश्वर उन लोगों से प्रेम करता है जो उसके निवास-स्थान से प्रेम करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पवित्र” के लिए इब्रानी अभिव्यक्ति संक्षिप्त है; इसका अर्थ “पवित्र जन,” “पवित्रता,” या “पवित्र स्थान” भी समझा जा सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: 'यूनानी पाठ: “और प्रभु उन लोगों से प्रेम करता है जो उससे प्रेम करते हैं।” इब्रानी पाठ यहाँ कठिन है और उसमें उसके घर/निवास का उल्लेख प्रतीत होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: सेवा करते हैं
  rationale: שרת पवित्र या आधिकारिक सेवा और परिचर्या को व्यक्त करता है। आधुनिक हिन्दी में “सेवा करना” स्वाभाविक है और यहाँ साधारण सहायता के बजाय समर्पित, पवित्र सेवा का भाव प्रसंग से स्पष्ट रहता है।
- source_word: קֹדֶשׁ
  choice: पवित्र जन
  rationale: इब्रानी पदबंध संक्षिप्त और अर्थ की दृष्टि से खुला है। यूनानी समानांतर के ἁγίῳ के साथ पढ़ने पर यह किसी पवित्र व्यक्ति, विशेषतः परमेश्वर, की ओर संकेत कर सकता है। “पवित्र जन” उस व्यक्तिगत संकेत को रखता है, पर पद को सीधे “परमेश्वर” बनाकर अनिश्चितता समाप्त नहीं करता।
- source_word: וֵאלֹהִים
  choice: और परमेश्वर
  rationale: इब्रानी पाठ में स्पष्ट रूप से אֱלֹהִים है; इसलिए यूनानी परंपरा के “प्रभु” के बजाय “परमेश्वर” रखा गया है।
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: उन लोगों से प्रेम करता है जो उसके निवास से प्रेम करते हैं
  rationale: उपलब्ध इब्रानी पाठ कठिन और आंशिक रूप से संपादकीय पुनर्निर्माण पर आधारित है, फिर भी उसमें घर/निवास की भाषा दिखाई देती है। मुख्य पाठ उसे स्वाभाविक हिन्दी में सुरक्षित रखता है; सरल यूनानी पाठ को पादटिप्पणी में दिया गया है।
- source_word: אָהֵב
  choice: प्रेम करता है
  rationale: אהב का सामान्य और स्वाभाविक हिन्दी प्रतिरूप है। इससे स्रोत में प्रेम की पुनरावृत्ति भी बनी रहती है।
theological_decisions:
- issue: पहले खंड में קֹדֶשׁ का आशय
  choice: पवित्र जन
  alternative: पवित्रता; पवित्र स्थान
  rationale: इब्रानी अभिव्यक्ति एलिप्टिकल है और यूनानी भी “पवित्र [जन/वस्तु]” कहता है। व्यक्तिगत अनुवाद प्रसंग और समानांतर से समर्थित है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे खंड में ईश्वरीय उपाधि
  choice: परमेश्वर
  alternative: प्रभु
  rationale: मुख्य इब्रानी साक्ष्य אֱלֹהִים पढ़ता है, जबकि यूनानी ὁ κύριος पढ़ता है। मूल इब्रानी साक्ष्य को प्राथमिकता दी गई है।
- issue: दूसरे खंड में परमेश्वर के प्रेम का कर्म
  choice: जो उसके निवास से प्रेम करते हैं
  alternative: जो उससे प्रेम करते हैं
  rationale: इब्रानी साक्ष्य कठिन होते हुए भी निवास/घर की भाषा सुरक्षित रखता है। यूनानी पाठ सरल है और संभवतः भिन्न मूलपाठ या सरलीकरण को दर्शाता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग “उसकी/उसके” का संकेत प्रसंग में व्यक्तित्व-प्राप्त प्रज्ञा की ओर है। “सेवा” की पुनरावृत्ति इब्रानी की शब्दगत समरूपता को बनाए रखती है।
