base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: hi
  text: हे मेरे बेटे, गरीब की ज़िंदगी[a] का मज़ाक मत उड़ाना, और गरीब तथा मन से दुखी व्यक्ति[b] को पीड़ा मत देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “गरीब को उसके जीवन से वंचित मत करना”; इसका अर्थ “गरीब को उसकी आजीविका से वंचित मत करना” भी हो सकता है।'
    reason: हिब्रू और यूनानी की वैकल्पिक प्राचीन पाठ-परंपरा
  - marker: b
    text: हिब्रू शब्द नֶפֶשׁ का अर्थ ‘मन’ के अतिरिक्त ‘जीवन,’ ‘व्यक्ति,’ या ‘स्वयं’ भी हो सकता है।
    reason: शाब्दिक वैकल्पिक अर्थ
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: यह बुद्धि-साहित्य में प्रयुक्त प्रत्यक्ष पुल्लिंग एकवचन संबोधन है; हिन्दी में स्वाभाविक और स्रोत के लिंग-संकेत के अनुरूप है।
- source_word: אַל תִּלְעַג
  choice: मज़ाक मत उड़ाना
  rationale: क्रिया उपहास या तिरस्कार करने को दर्शाती है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक निषेध है।
- source_word: לְחַיֵּי עָנִי
  choice: गरीब की ज़िंदगी का
  rationale: हिब्रू में गरीब के जीवन/जीवन-दशा का उल्लेख है। 'ज़िंदगी' मूल की व्यापकता बनाए रखती है, जबकि यूनानी पाठ आजीविका या जीवन से वंचित करने की वैकल्पिक समझ देता है।
- source_word: וְאַל תַּדְאִיב
  choice: पीड़ा मत देना
  rationale: यह क्रिया दुःख, शोक या पीड़ा पहुँचाने का बोध देती है; 'पीड़ा मत देना' भावनात्मक हानि सहित व्यापक अर्थ व्यक्त करता है।
- source_word: נֶפֶשׁ
  choice: व्यक्ति / मन
  rationale: यहाँ נֶפֶשׁ व्यक्ति, जीवन या भीतरी अस्तित्व को सूचित कर सकता है। 'मन से दुखी व्यक्ति' हिन्दी में मुहावरेदार ढंग से उस पूरे पीड़ित व्यक्ति और उसकी आंतरिक दशा दोनों को व्यक्त करता है।
- source_word: עָנֵי וּמַר נָפֶשׁ
  choice: गरीब और मन से दुखी व्यक्ति
  rationale: वाक्यांश गरीब व्यक्ति को 'मन का कड़वा/व्यथित' बताता है। शाब्दिक 'कड़वी आत्मा' के बजाय यह स्वाभाविक हिन्दी में गहरे आंतरिक दुःख को व्यक्त करता है।
theological_decisions:
- issue: पहले उपवाक्य में हिब्रू और यूनानी पाठों का संबंध
  choice: मुख्य पाठ में उपलब्ध हिब्रू के अनुसार 'गरीब की ज़िंदगी का मज़ाक मत उड़ाना'
  alternative: यूनानी के अनुसार 'गरीब को उसके जीवन/आजीविका से वंचित मत करना'
  rationale: हिब्रू पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए वह मुख्य पाठ का आधार है। यूनानी समानांतर सामाजिक और आर्थिक हानि की भिन्न प्राचीन पाठ-परंपरा सुरक्षित रखता है, जिसे पादटिप्पणी में दिया गया है।
- issue: बुद्धि-साहित्य के संबोधन का लिंग
  choice: हे मेरे बेटे
  alternative: हे मेरे बच्चे
  rationale: मूल में पुल्लिंग एकवचन 'पुत्र' है। व्यापक लागू होने की संभावना के बावजूद मूल संबोधन को तटस्थ नहीं किया गया।
- issue: נֶפֶשׁ का अर्थ
  choice: मुख्य पाठ में 'मन से दुखी व्यक्ति'
  alternative: '''दुखी आत्मा'' या ''व्यथित प्राण'''
  rationale: यह शब्द केवल किसी पृथक आध्यात्मिक तत्व को अनिवार्यतः नहीं दर्शाता, बल्कि व्यक्ति, जीवन या भीतरी अस्तित्व को भी सूचित करता है। इसलिए हिन्दी में व्यक्ति और उसकी आंतरिक व्यथा दोनों को सामने रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'मज़ाक मत उड़ाना' और 'पीड़ा मत देना' बोलचाल में स्पष्ट हैं, जबकि 'हे मेरे बेटे' बुद्धि-उपदेश की साहित्यिक शैली बनाए रखता है।
