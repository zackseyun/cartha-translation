base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/004.yaml
  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: hi
  text: अपने गरीब व्यक्ति को दान देने से मना मत कर,[a] और निर्धन की विनती को तुच्छ मत समझ; न उसे तुझे शाप देने का अवसर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “संकट में पड़े विनती करने वाले को मना मत कर, और गरीब से अपना मुँह मत फेर।” यूनानी साक्ष्य छोटा है और उसमें तुझे शाप देने का अवसर देने से संबंधित अंतिम उपवाक्य नहीं है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: देने से मना मत कर
  rationale: מנע का मूल भाव रोक रखना या देने से इनकार करना है। आधुनिक हिन्दी में यह पदबंध प्रसंग के अनुरूप और स्वाभाविक है।
- source_word: מַתָּן
  choice: दान
  rationale: संज्ञा का अर्थ भेंट या दिया जाने वाला उपहार है। निर्धन की सहायता के प्रसंग में ‘दान’ स्वाभाविक है, पर इसे तकनीकी धार्मिक ‘भिक्षादान’ तक सीमित नहीं करता।
- source_word: מִמִּסְכֵּנֶךָ
  choice: अपने गरीब को
  rationale: हिब्रू के द्वितीय पुरुष प्रत्यय ‘तुम्हारे/अपने’ को बनाए रखा गया है, जो संबोधित व्यक्ति की जिम्मेदारी में आने वाले गरीब व्यक्ति का संकेत देता है। पुल्लिंग रूप यहाँ प्रतिनिधिक है।
- source_word: וְלֹא תִבְזֶה
  choice: तुच्छ मत समझ
  rationale: בזה का अर्थ किसी को या उसकी बात को नगण्य अथवा घृणा योग्य मानना है। ‘तुच्छ मत समझ’ सामान्य आधुनिक हिन्दी में स्पष्ट और नैतिक बल वाला है।
- source_word: שְׁאֵלוֹת דָּל
  choice: निर्धन की विनती
  rationale: שאלות अनुरोधों या याचनाओं को और דל गरीब या दीन व्यक्ति को दर्शाता है। ‘विनती’ आग्रहपूर्ण निवेदन का भाव संक्षेप में व्यक्त करती है।
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: न उसे … कारण दे
  rationale: शाब्दिक अर्थ ‘उसे स्थान मत दे’ है; इस प्रसंग में हिन्दी का ‘कारण देना’ किसी कार्य के लिए आधार या अवसर देने का स्वाभाविक समतुल्य है।
- source_word: לְקַלְלֶךָ
  choice: तुम्हें शाप देने
  rationale: קלל यहाँ शाप देने का अर्थ रखता है। सीधा अनुवाद गरीब व्यक्ति द्वारा अन्याय के प्रत्युत्तर में शाप की संभावना को सुरक्षित रखता है।
theological_decisions:
- issue: पूर्ण हिब्रू पाठ और छोटे यूनानी समानांतर पाठ में अंतर
  choice: मुख्य पाठ में उपलब्ध पूर्ण हिब्रू साक्ष्य का अनुवाद किया गया है, जिसमें शाप देने का कारण न देने वाली अंतिम उपवाक्य भी है।
  alternative: 'यूनानी समानांतर के अनुसार: “संकट में पड़े विनती करने वाले को मना मत कर, और गरीब से अपना मुँह मत फेर।”'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध और विश्वसनीय है, वह प्राथमिक स्रोत है। यूनानी साक्ष्य विषय की पुष्टि करता है, पर छोटा है और अंतिम उपवाक्य नहीं रखता; इसलिए उसके अंतर को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष निषेधात्मक शैली अपनाई गई है। ‘गरीब’ और ‘निर्धन’ का संयोजन हिब्रू के दो निकटार्थक शब्दों का हल्का भेद बनाए रखता है; ‘अपने गरीब’ कुछ असामान्य होते हुए भी मूल के संबंधसूचक प्रत्यय और उत्तरदायित्व के भाव को सुरक्षित रखता है।
