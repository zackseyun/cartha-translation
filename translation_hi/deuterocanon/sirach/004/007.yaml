  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “सभा में अपने आपको प्रिय बना, और किसी बड़े व्यक्ति के सामने अपना सिर नीचा कर।” यह उपलब्ध इब्रानी से काफ़ी भिन्न पाठ-रूप दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט ... אָזְנֶךָ
  choice: कान लगा
  rationale: נטה के आदेशात्मक रूप और אָזְנֶךָ को मिलाकर बने ‘कान झुकाने’ के मुहावरे का आशय ध्यानपूर्वक सुनना है। ‘कान लगा’ आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब भी बनाए रखता है।
- source_word: לֶעָנִי
  choice: दीन जन की ओर
  rationale: עָנִי निर्धन, पीड़ित या सामाजिक रूप से असहाय व्यक्ति को सूचित कर सकता है। ‘दीन जन’ इस अर्थ-व्याप्ति को केवल आर्थिक निर्धनता तक सीमित नहीं करता।
- source_word: וַהֲשִׁיבֵהוּ
  choice: उसे ... उत्तर दे
  rationale: यहाँ שוב का हिफ़ील रूप सुनने के समानांतर संवादात्मक प्रत्युत्तर का अर्थ देता है; इसलिए ‘उत्तर दे’ प्रसंगानुकूल है।
- source_word: שָׁלוֹם
  choice: शान्तिपूर्वक
  rationale: שלום यहाँ क्रिया-विशेषणवत् है और शान्ति तथा सद्भाव से उत्तर देने का भाव व्यक्त करता है।
- source_word: בַּעֲנָוָה
  choice: नम्रता से
  rationale: עֲנָוָה नम्रता या दीनता की मनोवृत्ति को व्यक्त करता है। ‘नम्रता से’ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और अत्यन्त भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी का सीधा अनुवाद
  alternative: 'यूनानी: “सभा का प्रिय बन, और किसी बड़े व्यक्ति के सामने अपना सिर झुका।”'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वसनीयता वाला है। यूनानी पाठ छोटी शब्दगत भिन्नता नहीं, बल्कि मूलतः अलग पाठ-रूप दर्शाता है; इसलिए उसे पादटिप्पणी में पारदर्शी ढंग से दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन अनौपचारिक आदेश-शैली मूल इब्रानी के एकवचन आदेशों को दर्शाती है। भाषा सरल और गरिमापूर्ण रखी गई है।
