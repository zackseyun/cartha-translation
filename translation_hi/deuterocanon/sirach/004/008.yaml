  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: hi
  text: पीड़ित को उसे सताने वालों से छुड़ा[a], और निष्पक्षता से न्याय करते समय अपने मन को अधीर न होने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “गरीब की ओर अपना कान झुका, और नम्रता से उसे शांतिपूर्वक उत्तर दे।” इसके विपरीत, यहाँ उपलब्ध इब्रानी पाठ पीड़ित को छुड़ाने और निष्पक्षता से न्याय करते समय अधीर न होने की बात करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: छुड़ा
  rationale: यह आज्ञार्थक क्रिया सक्रिय हस्तक्षेप करके किसी को संकट या अत्याचार से मुक्त कराने को कहती है; ‘छुड़ा’ सामाजिक न्याय के इस संदर्भ में स्वाभाविक और तात्कालिक है।
- source_word: מוּצָק
  choice: सताए हुए व्यक्ति
  rationale: निष्क्रिय रूप दबाव, पीड़ा या दुर्व्यवहार सह रहे व्यक्ति को सूचित करता है। यह हिन्दी में स्पष्ट है और पीड़ित की स्थिति को व्यक्त करता है।
- source_word: מִמְּצִיקָיו
  choice: उसके सतानेवालों से
  rationale: यह उसी दबाव अथवा उत्पीड़न वाले शब्द-मूल से निकला है और पीड़ा पहुँचानेवालों को दर्शाता है। ‘सतानेवालों’ से मूल की शब्दगत संगति भी बनी रहती है।
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: अपने मन को अधीर न होने दे
  rationale: קוץ में अधीरता, खीझ या विरक्ति का भाव हो सकता है। न्याय करते समय भीतर उठनेवाली अधीरता को रोकने का अर्थ संदर्भ में उपयुक्त है; ‘मन’ हिन्दी में आंतरिक भाव-वृत्ति का स्वाभाविक संकेत है।
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: ठीक न्याय करते समय
  rationale: इस पदबंध में न्यायिक कार्य और सीधाई/उचितता दोनों हैं। क्रियात्मक हिन्दी अनुवाद व्यावहारिक उपदेश को स्पष्ट रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में उल्लेखनीय भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया है।
  alternative: “गरीब की ओर अपना कान झुका, और नम्रता से उसे शांतिपूर्वक उत्तर दे।”
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध है और परियोजना की नीति के अनुसार वही प्राथमिक है। यूनानी परंपरा शब्दों और बल दोनों में काफी भिन्न है, इसलिए उसे पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सीधे संबोधन वाला नीति-वचनात्मक रूप अपनाया गया है। ‘सताए हुए व्यक्ति/सतानेवालों’ से इब्रानी शब्द-मूल की निकटता सुनाई देती है, जबकि ‘ठीक न्याय’ सामान्य पाठक के लिए न्याय की उचित और निष्पक्ष प्रकृति स्पष्ट करता है।
