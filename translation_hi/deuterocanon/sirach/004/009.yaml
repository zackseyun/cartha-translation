  text: Be like a father to orphans[a], and in place of a husband to widows.
translation:
  language: hi
  text: अनाथों के लिए पिता के समान बनो[a], और विधवाओं के लिए पति के स्थान पर बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इससे बहुत भिन्न पाठ है: “जिसके साथ अन्याय हो रहा है, उसे अन्यायी के हाथ से छुड़ाओ, और न्याय करते समय साहस मत खोओ।” संभवतः यह इस पद के किसी दूसरे पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: पिता के समान बनो
  rationale: הֱיֵה आज्ञार्थक है और כְ तुलना दर्शाता है। यह अनुवाद स्वाभाविक हिन्दी में उपमा को बनाए रखता है, बिना संबोधित व्यक्ति को शाब्दिक रूप से पिता ठहराए।
- source_word: לִיתוֹמִים
  choice: अनाथों के लिए
  rationale: יְתוֹמִים पिता या माता-पिता से वंचित बच्चों को दर्शाता है। आधुनिक हिन्दी में ‘अनाथों’ स्पष्ट और सहज है; ‘के लिए’ उनकी ओर से संरक्षण और देखभाल करने का भाव देता है।
- source_word: וּתְמוּר
  choice: स्थान लो
  rationale: תמור प्रतिस्थापन या किसी के स्थान पर कार्य करने का भाव रखता है। ‘स्थान लो’ संक्षिप्त, स्वाभाविक और संबंधपरक जिम्मेदारी को व्यक्त करता है।
- source_word: בַּעַל
  choice: पति
  rationale: विधवाओं के संदर्भ में בעל का अर्थ ‘पति’ है, न कि सामान्यतः स्वामी या मालिक।
- source_word: לְאַלְמָנוֹת
  choice: विधवाओं के लिए
  rationale: אַלְמָנוֹת का सीधा अर्थ ‘विधवाएँ’ है। ‘के लिए’ उनके हित में सहारा और संरक्षण देने का आशय स्पष्ट करता है।
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος
  choice: मुख्य पाठ में ग्रहण नहीं किया
  rationale: यूनानी पाठ उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ से बहुत भिन्न है और संभवतः पद के किसी दूसरे पाठ-रूप का साक्षी है। इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: सिराख 4:9 के उपलब्ध इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: 'मुख्य पाठ में इब्रानी उपदेश: अनाथों के लिए पिता-समान बनना और विधवाओं के लिए पति का स्थान लेना'
  alternative: 'यूनानी पाठ: “जिसके साथ अन्याय हो रहा है, उसे अन्यायी के हाथ से छुड़ाओ, और न्याय करते समय साहस मत खोओ।”'
  rationale: जहाँ सिराख का इब्रानी पाठ सुरक्षित, उच्च-विश्वसनीयता वाला और पुष्ट है, वहाँ उसे प्राथमिकता दी गई है। फिर भी यूनानी पाठ वास्तविक और महत्वपूर्ण भिन्न पाठ-परंपरा का साक्षी है, इसलिए उसे छिपाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और आज्ञार्थक रूप अपनाया गया है। ‘पिता के समान’ इब्रानी उपमा को स्पष्ट रखता है और ‘पति का स्थान लो’ प्रतिस्थापन तथा संरक्षण—दोनों का भाव व्यक्त करता है।
