base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/012.yaml
  text: Those who love her love life[a], and those who seek her will obtain favor from Yahweh.
translation:
  language: hi
  text: जो उससे प्रेम करते हैं, वे जीवन से प्रेम करते हैं; और जो उसे खोजते हैं, वे यहोवा की कृपा पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में दूसरा अर्धपद है: “और जो भोर में उसकी खोज करते हैं, वे आनंद से भर जाएँगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: जो उससे प्रेम करते हैं
  rationale: सक्रिय कृदन्त के साथ स्त्रीलिंग एकवचन प्रत्यय संदर्भ में बुद्धि की ओर संकेत करता है; यह हिन्दी में स्वाभाविक संबंधवाचक रचना है।
- source_word: אָהֲבוּ חַיִּים
  choice: वे जीवन से प्रेम करते हैं
  rationale: सूक्तिपरक कथन में पूर्ण रूप सामान्य वर्तमान अर्थ रखता है; 'जीवन से प्रेम' मूल अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וּמְבַקְשֶׁיהָ
  choice: और जो उसे खोजते हैं
  rationale: בקש का सीधा अर्थ 'खोजना/ढूँढ़ना' है। इब्रानी में परिश्रमपूर्वक या भोर में खोजने का स्पष्ट क्रियाविशेषण नहीं है, इसलिए कोई तीव्रता नहीं जोड़ी गई।
- source_word: יָפִיקוּ
  choice: पाएँगे
  rationale: रצון के साथ यहाँ क्रिया का अर्थ प्राप्त करना है; 'पाएँगे' संक्षिप्त और स्वाभाविक है।
- source_word: רָצוֹן
  choice: कृपा
  rationale: ईश्वर से मिलने वाले अनुकूल भाव या स्वीकृति के लिए 'कृपा' सामान्य, गरिमापूर्ण हिन्दी है।
- source_word: מֵיהֹוָה
  choice: यहोवा की
  rationale: מִן स्रोत को दर्शाता है; हिन्दी में 'यहोवा की कृपा पाएँगे' स्वाभाविक रूप से 'यहोवा से कृपा प्राप्त करेंगे' का अर्थ देता है और नाम को प्रत्यक्ष रूप में रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी के दूसरे अर्धपद में भिन्नता
  choice: 'इब्रानी पाठ के अनुसार: ''वे यहोवा की कृपा पाएँगे'''
  alternative: 'यूनानी समानांतर: ''वे आनंद से भर जाएँगे'''
  rationale: उपलब्ध, स्पष्ट और उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य को मुख्य पाठ बनाया गया है; यूनानी की वास्तविक वैकल्पिक परंपरा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: स्त्रीलिंग सर्वनाम का संदर्भ
  choice: '''उससे/उसे'' को बनाए रखा गया है, जो प्रसंग में बुद्धि की ओर संकेत करता है'
  alternative: हर बार 'बुद्धि' नाम को दोहराना
  rationale: मूल इब्रानी स्त्रीलिंग प्रत्ययों का प्रयोग करता है। सर्वनाम बनाए रखने से पाठ की काव्यात्मक संबद्धता और मूल की संरचना सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, सूक्तिपरक और गरिमापूर्ण शैली। इब्रानी की दो समानांतर संबंधवाचक रचनाएँ बनाए रखी गई हैं। पादटिप्पणी चिह्न पूरे पद के अंत में रखा गया है क्योंकि वैकल्पिक यूनानी पाठ दूसरे अर्धपद से संबंधित है।
