base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/020.yaml
  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: hi
  text: मेरे बेटे, उचित समय का ध्यान रखो[a] और बुराई से सावधान रहो[b]; और अपनी आत्मा के विषय में लज्जित न हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘समय’ के साथ הָמוֹן शब्द भी है, जिसका सामान्य अर्थ ‘भीड़’, ‘धन-संपत्ति’ या ‘कोलाहल’ हो सकता है; इसलिए यह वाक्यांश कठिन है। यूनानी समानांतर में केवल ‘समय को संभालकर रखो/उसका पालन करो’ जैसा अर्थ मिलता है; संदर्भ में उसका अर्थ उचित समय का ध्यान रखना समझा गया है।
    reason: textual_variant
  - marker: b
    text: या, ‘अपने आपको बुराई से बचाए रखो।’ इब्रानी को अधिक शाब्दिक रूप से ‘बुराई से डरो’ भी समझा जा सकता है, जबकि यूनानी समानांतर स्पष्टतः बुराई से चौकस रहने का भाव देता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपने विषय में लज्जित न हो’ अथवा ‘अपने जीवन के विषय में लज्जित न हो।’ इब्रानी נֶפֶשׁ और यूनानी ψυχή का अर्थ संदर्भानुसार ‘आत्मा’, ‘स्वयं’ या ‘जीवन’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: पुंल्लिंग एकवचन में प्रत्यक्ष संबोधन है। यह इब्रानी रूप और ज्ञान-साहित्य की पिता-पुत्र शिक्षण शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: उचित समय का ध्यान रखो
  rationale: प्रेषित इब्रानी में הָמוֹן के कारण वाक्यांश कठिन है। यूनानी समानांतर Συντήρησον καιρὸν स्पष्टतः उपयुक्त अवसर/समय को पहचानने और उसका ध्यान रखने का भाव देता है; इसलिए अनिश्चितता को पादटिप्पणी में रखते हुए यही सर्वाधिक सुसंगत अर्थ चुना गया है।
- source_word: וּפְחַד מִרָע
  choice: और बुराई से सावधान रहो
  rationale: इब्रानी का शाब्दिक स्वरूप ‘बुराई से डरो’ जैसा हो सकता है, किंतु यूनानी φύλαξαι ἀπὸ πονηροῦ बुराई से चौकस रहने या स्वयं को बचाने का समर्थन करता है। ‘सावधान रहो’ दोनों साक्ष्यों के बीच स्वाभाविक और संयत हिन्दी है।
- source_word: נַפְשְׁךָ
  choice: अपने प्राण के विषय में
  rationale: נֶפֶשׁ का अर्थ संदर्भानुसार प्राण, जीवन या स्वयं हो सकता है। ‘प्राण’ मूल की मानवीय और आंतरिक गहराई बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אַל תֵּבוֹשׁ
  choice: लज्जित न हो
  rationale: בושׁ के निषेधात्मक आज्ञार्थ का सीधा, गरिमापूर्ण और आधुनिक हिन्दी रूप।
theological_decisions:
- issue: נֶפֶשׁ / ψυχή की मानव-स्वरूप संबंधी अर्थ-छाया
  choice: अपने प्राण के विषय में
  alternative: अपने विषय में; अपने जीवन के विषय में
  rationale: ‘प्राण’ पाठ की आंतरिक और नैतिक गंभीरता को सुरक्षित रखता है, पर इसे किसी व्यवस्थित द्वैतवादी मानव-विज्ञान में सीमित नहीं करता। मूल शब्द की वास्तविक बहुअर्थकता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। ‘हे मेरे बेटे’ ज्ञान-साहित्य के प्रत्यक्ष संबोधन को बनाए रखता है। कठिन इब्रानी वाक्यांश को मुख्य पाठ में पठनीय बनाया गया है, किंतु उसकी पाठगत अनिश्चितता और נֶפֶשׁ की अर्थगत व्यापकता पादटिप्पणियों में स्पष्ट रूप से सुरक्षित हैं।
