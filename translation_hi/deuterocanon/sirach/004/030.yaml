review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the extant Hebrew rather than the sharply divergent Greek parallel. ‘दो ज़बानों वाला’ appropriately renders the idiomatic and elliptical בַּעַל שְׁתַּיִם in light of the following reference to the tongue. The second clause, however, is more directly and naturally represented as not habituating one’s tongue to such speech.
  naturalness: ‘दो ज़बानों वाला न कहलाना’ is understandable but less idiomatic as an admonition than ‘दो ज़बानों वाला मत कहलाना.’ ‘अपनी जीभ को इसकी आदत न डालना’ is grammatically possible, but ‘उसे ऐसी बातों की आदत मत डालना’ more clearly supplies the antecedent and avoids the slightly awkward abstract ‘इसकी.’
  terminology: ‘जीभ’ preserves the Hebrew image well. ‘दो ज़बानों वाला’ retains the source’s figurative ambiguity without prematurely narrowing it to ‘कपटपूर्ण.’ The Greek textual-variant note is warranted; ‘मनमानी कल्पनाएँ’ is not an especially exact rendering of φαντασιοκοπῶν, and ‘डींगें हाँकते हुए’ better reflects boastful/fanciful conduct while retaining some uncertainty.
  issues:
  - severity: low
    issue: Imperative phrasing
    rationale: 'Modern Hindi prohibitions normally use ‘मत’ with the infinitive: ‘मत कहलाना,’ rather than bare ‘न कहलाना.’'
  - severity: medium
    issue: Reference of ‘इसकी’ is unclear
    rationale: The pronoun has no explicit Hindi antecedent and may momentarily seem to refer to being called rather than to the implied kind of double speech. ‘ऐसी बातों की’ supplies the implicit object conservatively.
  - severity: low
    issue: Greek footnote wording
    rationale: ‘मनमानी कल्पनाएँ न करो’ overstates the verbal nuance as a deliberate act of imagining. ‘डींगें हाँकते हुए’ is a more idiomatic rendering of the Greek participial expression, though the note should continue to identify it as a parallel textual form.
  revised_text: दो ज़बानों वाला मत कहलाना[a][b], और अपनी जीभ को ऐसी बातों की आदत मत डालना।
