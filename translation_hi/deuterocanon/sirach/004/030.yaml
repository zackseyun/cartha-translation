    text: 'यूनानी समानांतर पाठ है: ‘अपने घर में सिंह के समान न बनो, और अपने सेवकों के बीच डींगें हाँकते हुए न रहो।’ यह उपलब्ध इब्रानी पाठ से बहुत भिन्न है और सम्भवतः किसी अलग पाठ-रूप या व्याख्यात्मक परम्परा को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: न कहलाना
  rationale: निफ़अल रूप का निष्क्रिय अर्थ ‘कहलाना’ है; निषेधात्मक ज्ञानोपदेश के लिए यह स्वाभाविक और संक्षिप्त है।
- source_word: בַּעַל שְׁתַּיִם
  choice: दो ज़बानों वाला
  rationale: शाब्दिक अर्थ ‘दो [वस्तुओं] का स्वामी/धारक’ है। अगली पंक्ति में ‘जीभ’ आने से यह कपटपूर्ण या परस्पर-विरोधी वाणी का मुहावरा प्रतीत होता है। ‘दो ज़बानों वाला’ मूल रूपक और उसकी कुछ अस्पष्टता दोनों बचाता है।
- source_word: לְשׁוֹנְךָ
  choice: अपनी जीभ को
  rationale: ‘जीभ’ को वाणी के नैतिक साधन के रूप में प्रस्तुत करने वाला इब्रानी बिंब सुरक्षित रखा गया है।
- source_word: אַל תַּרְגֵּל
  choice: आदत न डालना
  rationale: रגל यहाँ अभ्यस्त करने का भाव देता है। आधुनिक हिन्दी में ‘आदत डालना’ ‘प्रशिक्षित करना’ की अपेक्षा इस संदर्भ में अधिक स्वाभाविक है।
- source_word: וְאֶל
  choice: और ... इसकी
  rationale: इब्रानी पूर्वसर्ग का सम्बन्ध पूर्वोक्त दोहरी वाणी से समझा गया है; हिन्दी में ‘इसकी’ उस निहित विषय को स्पष्ट करता है, बिना उसके स्वरूप को अधिक निश्चित किए।
