base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/028.yaml
  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: hi
  text: किसी अन्यायी न्यायाधीश के साथ मत बैठो,[a] क्योंकि उसके साथ तुम उसकी इच्छा के अनुसार न्याय करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “सत्य के लिए मृत्यु तक संघर्ष करो, और प्रभु परमेश्वर तुम्हारे लिए लड़ेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: मत बैठो
  rationale: इब्रानी क्रिया का सीधा अर्थ ‘बैठना’ है; यहाँ यह किसी न्यायिक विचार-विमर्श में साथ देने या सहभागी होने का भाव भी रखती है।
- source_word: שׁוֹפֵט עַוָּל
  choice: अन्यायी न्यायी
  rationale: שׁוֹפֵט न्याय करने वाले व्यक्ति को और עַוָּל उसके अन्यायपूर्ण चरित्र को बताता है। ‘न्यायी’ कानूनी संदर्भ को स्पष्ट रखता है।
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: उसकी इच्छा के अनुसार
  rationale: यह वाक्यांश न्याय के किसी निष्पक्ष मानदंड के बजाय उस अन्यायी न्यायी की इच्छा द्वारा नियंत्रित होने को व्यक्त करता है।
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: उसके साथ तुम ... न्याय करोगे
  rationale: תִּשְׁפּוֹט द्वितीय पुरुष एकवचन क्रिया है, इसलिए उसका स्पष्ट अर्थ ‘तुम न्याय करोगे’ है; עִמּוֹ का अर्थ ‘उसके साथ’ है। अनुवाद इस व्याकरणिक तनाव को सामान्यीकृत निष्क्रिय वाक्य में नहीं बदलता।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: “सत्य के लिए मृत्यु तक संघर्ष करो, और प्रभु परमेश्वर तुम्हारे लिए लड़ेगा।”'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी परंपरा का अर्थ सर्वथा भिन्न है; अतः उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरे उपवाक्य का कर्ता
  choice: 'द्वितीय पुरुष को स्पष्ट रखा: ‘तुम ... न्याय करोगे’'
  alternative: ‘उसके साथ न्याय उसकी इच्छा के अनुसार होगा’
  rationale: इब्रानी תִּשְׁפּוֹט स्पष्टतः द्वितीय पुरुष एकवचन है। इसे निष्क्रिय या निर्वैयक्तिक बनाने से पाठ में निहित पाठक की सहभागिता और नैतिक चेतावनी मंद पड़ जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-समीपी शैली। ‘न्यायी’ औपचारिक कानूनी पद है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
