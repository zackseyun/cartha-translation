base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/024.yaml
  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: hi
  text: क्योंकि वाणी में बुद्धि प्रकट होती है, और जीभ से दिए गए उत्तर में समझ प्रकट होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “और जीभ के कथन में शिक्षा।” इब्रानी साक्ष्य में है: “और जीभ के उत्तर में समझ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: वाणी से
  rationale: यहाँ אֹמֶר का अर्थ कही हुई बात या बोलना है। ‘वाणी से’ सहज हिन्दी में उस माध्यम को व्यक्त करता है जिसके द्वारा बुद्धि पहचानी जाती है, और इसे किसी एक कहावत तक सीमित नहीं करता।
- source_word: נוֹדַעַת
  choice: पहचानी जाती है
  rationale: 'ידע के निफ़अल रूप का निष्क्रिय भाव सुरक्षित रहता है: किसी व्यक्ति की बुद्धि उसकी वाणी से पहचान में आती है।'
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה के लिए यह प्रचलित, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: וּתְבוּנָה
  choice: और समझ
  rationale: תְּבוּנָה विवेकपूर्ण समझ या सूझ को दर्शाता है। ‘समझ’ सामान्य पाठक के लिए स्वाभाविक है और ‘बुद्धि’ के साथ समानांतरता बनाए रखता है।
- source_word: בְּמַעֲנֵה
  choice: उत्तर से
  rationale: מַעֲנֶה का ठोस अर्थ उत्तर या प्रत्युत्तर है। ‘उत्तर से’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी पाठ का अनुसरण करता है।
- source_word: לָשׁוֹן
  choice: जीभ के
  rationale: मूल पाठ के शारीरिक रूपक ‘जीभ’ को बनाए रखा गया है; इसे केवल ‘भाषा’ या ‘बात’ बनाकर समतल नहीं किया गया।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी ‘जीभ के उत्तर से समझ’ का अनुसरण
  alternative: 'यूनानी समानांतर: ‘जीभ के कथन में शिक्षा’'
  rationale: उपलब्ध इब्रानी साक्ष्य उच्च-विश्वसनीय और सत्यापित है, इसलिए मुख्य पाठ में תְּבוּנָה और מַעֲנֶה को प्राथमिकता दी गई है। यूनानी παιδεία और ῥῆμα वाला भिन्न पाठ वास्तविक पाठ-परंपरा के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। दूसरे खंड में इब्रानी की समानांतर, संक्षिप्त रचना को हिन्दी में स्पष्ट करने के लिए ‘प्रकट होती है’ जोड़ा गया है।
