base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/015.yaml
  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: hi
  text: जो मेरी बात सुनता है, वह सच्चाई से न्याय करेगा,[a] और जो मेरी ओर ध्यान देता है, वह मेरे भीतरी कक्षों में निश्चिंत होकर निवास करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “जो उसकी आज्ञा मानेगा, वह राष्ट्रों का न्याय करेगा।” उपलब्ध हिब्रू पाठ यहाँ “सच्चाई से न्याय करेगा” कहता है; मुख्य पाठ हिब्रू का अनुसरण करता है।'
    reason: alternative_reading
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “मेरे भीतरी कक्षों में” है—यह बुद्धि को एक स्त्री के रूप में चित्रित करता है, जो ध्यान से सुनने वाले को अपने घर में स्थान देती है। अंतिम हिब्रू पदबंध कठिन है; “निश्चिंत होकर” का भाव यूनानी समानांतर से स्पष्ट होता है।
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: जो मेरी सुनता है
  rationale: שמע सुनने के साथ आज्ञापालन का भाव भी रख सकता है। यह सहज हिन्दी प्रयोग श्रवण-चित्र को बनाए रखते हुए उत्तरदायी सुनने का संकेत देता है।
- source_word: יִשׁפֹּט אֱמֶת
  choice: सच्चाई से न्याय करेगा
  rationale: शाब्दिक अर्थ ‘सत्य का न्याय करेगा’ है; यहाँ אֱמֶת क्रियाविशेषण-सदृश रूप से निष्पक्ष और सही न्याय का भाव देता है। ‘सच्चाई से’ मूल के ‘सत्य’ को भी बनाए रखता है।
- source_word: וּמַאֲזִין לִי
  choice: और जो मेरी ओर कान लगाता है
  rationale: מאזין ध्यानपूर्वक सुनने पर बल देता है। ‘कान लगाता है’ पहले खंड की पुनरुक्ति किए बिना समानांतर श्रवण-चित्र को सुरक्षित रखता है।
- source_word: יִיחַן
  choice: बसेगा
  rationale: यह कठिन रूप पड़ाव डालने, ठहरने या निवास करने का अर्थ दे सकता है; यूनानी κατασκηνώσει भी निवास/डेरा डालने का समर्थन करता है। ‘बसेगा’ स्वाभाविक हिन्दी में स्थिर निवास का भाव देता है।
- source_word: בַּחֲדָרַי
  choice: मेरे भीतरी कक्षों में
  rationale: חדר भीतरी कमरे या कक्ष को सूचित करता है। यह बुद्धि के स्त्रीरूप व्यक्तित्व और उसके घरेलू आतिथ्य के रूपक को बनाए रखता है।
- source_word: מִבָּיִת
  choice: निश्चिंत होकर
  rationale: हिब्रू वाक्यांश यहाँ पाठगत और वाक्यगत रूप से कठिन है। यूनानी πεποιθώς ‘विश्वास/निश्चिंतता के साथ’ सुरक्षित निवास का आशय सुझाता है; इसलिए इसे स्पष्टतः परंपरागत समानांतर से प्रकाशित अर्थ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: पहले खंड में हिब्रू और यूनानी का अंतर
  choice: मुख्य पाठ में हिब्रू के अनुसार ‘सच्चाई से न्याय करेगा’
  alternative: 'यूनानी: ‘राष्ट्रों का न्याय करेगा’'
  rationale: उपलब्ध हिब्रू साक्ष्य को प्राथमिक रखा गया है। यूनानी का भिन्न कर्म ‘राष्ट्रों’ मुख्य पाठ में नहीं मिलाया गया, बल्कि पाठांतर टिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम कठिन पदबंध מִבָּיִת
  choice: यूनानी समानांतर की सहायता से ‘निश्चिंत होकर बसेगा’
  alternative: 'अधिक शाब्दिक किंतु अस्पष्ट: ‘घर से/घर के भीतर मेरे कक्षों में बसेगा’; यूनानीमुखी: ‘निश्चिंत होकर डेरा डालेगा’'
  rationale: हिब्रू का अंतिम पदबंध असहज और अनिश्चित है। चुना गया पाठ निवास के हिब्रू चित्र को बनाए रखता है और निश्चिंतता का भाव यूनानी समानांतर से ग्रहण करता है; इस आधार को पादटिप्पणी में पारदर्शी बनाया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मेरी सुनता है’ और ‘कान लगाता है’ से हिब्रू समानांतरता तथा ध्यानपूर्वक सुनने का भाव रखा गया है। ‘भीतरी कक्ष’ घरेलू रूपक को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
