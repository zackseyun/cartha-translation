base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/026.yaml
  text: Do not be ashamed to turn back from iniquity, and do not stand before the current of a river.
translation:
  language: hi
  text: अधर्म से लौटने में लज्जित न हो, और नदी की धारा के सामने खड़ा न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “अपने पापों को स्वीकार करने में लज्जित न हो, और नदी की धारा पर बल न लगा।” पहले खंड में हिब्रू और यूनानी अलग हैं और दूसरे में भी थोड़ा अंतर है। मुख्य पाठ उपलब्ध हिब्रू का अनुसरण करता है और नदी की छवि स्पष्ट करने के लिए यूनानी से सहायता लेता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: लज्जित न हो
  rationale: בוש का सामान्य अर्थ लज्जित होना है। यह चयन निषेध की सीधी और गरिमापूर्ण अभिव्यक्ति करता है।
- source_word: לָשׁוּב
  choice: लौटने
  rationale: שוב का मूल अर्थ लौटना या वापस मुड़ना है। यहाँ यह नैतिक परिवर्तन का संकेत देता है, पर अनुवाद इसे तकनीकी धार्मिक शब्द ‘पश्चाताप’ में नहीं बदलता।
- source_word: מֵעָוֹן
  choice: अधर्म से
  rationale: עָוֹן पापपूर्ण कृत्य, अधर्म या दोष को व्यक्त कर सकता है। ‘अधर्म’ नैतिक गंभीरता को बनाए रखता है और מִן के ‘से’ भाव के साथ स्वाभाविक है।
- source_word: וְאַל תַּעֲמוֹד
  choice: और ... खड़ा न हो
  rationale: עמד का सीधा अर्थ खड़ा होना है। पुल्लिंग एकवचन संबोधन को हिन्दी में स्वाभाविक आज्ञार्थक रूप में रखा गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: לפני का मूल अर्थ सामने या सम्मुख है। यह बहती धारा का सामना करने की खतरनाक छवि को सुरक्षित रखता है।
- source_word: שִׁבֹּלֶת
  choice: नदी की धारा
  rationale: यहाँ שִׁבֹּלֶת का अर्थ बहाव या धारा समझा गया है; यूनानी समानांतर का ῥοῦν ποταμοῦ (‘नदी का प्रवाह’) इस अर्थ की पुष्टि करता है और असामान्य हिब्रू छवि को स्पष्ट करता है।
theological_decisions:
- issue: שוב को स्पष्ट धार्मिक शब्दावली में प्रस्तुत करना
  choice: अधर्म से लौटने
  alternative: पाप से पश्चाताप करने
  rationale: हिब्रू में लौटने की छवि है, जबकि यूनानी में पापों को स्वीकार करने की बात आती है। मुख्य पाठ हिब्रू की छवि को बनाए रखता है और उसे किसी अधिक तकनीकी प्रायश्चित्त-सूत्र में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘लज्जित’ और ‘अधर्म’ नैतिक गंभीरता बनाए रखते हैं; ‘लौटने’ से हिब्रू रूपक सुरक्षित रहता है।
