  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: hi
  text: अपनी वाणी में घमंडी न बनो[a], और अपने काम में ढीले और लापरवाह न रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यह कहावत अलग रूप में है: “लेने के लिए तुम्हारा हाथ आगे बढ़ा हुआ न हो और लौटाते समय पीछे खिंचा हुआ न हो।”'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: घमंडी
  rationale: यह शब्द ऊँचा समझने, अकड़ या अहंकार का भाव व्यक्त करता है। आधुनिक हिन्दी में “घमंडी” स्पष्ट, स्वाभाविक और नैतिक चेतावनी के अनुरूप है।
- source_word: בִּלְשׁוֹנֶךָ
  choice: अपनी वाणी में
  rationale: शाब्दिक अर्थ “अपनी जीभ में” है, पर यहाँ आशय बोलने के ढंग से है। “अपनी वाणी में” मूल बिंब के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: רָפוּי
  choice: ढीले
  rationale: इसका भाव शिथिलता, सुस्ती या दृढ़ता की कमी है। काम के संदर्भ में “ढीले” सहज और सटीक है।
- source_word: רָשִׁישׁ
  choice: लापरवाह
  rationale: यह दुर्लभ शब्द संदर्भ में काम के प्रति असावधानी या तत्परता की कमी बताता है। “लापरवाह” पहले विशेषण से अलग रहते हुए इब्रानी की दोहरी निंदा को बनाए रखता है।
- source_word: בִּמְלַאכְתֶּךָ
  choice: अपने काम में
  rationale: यह संज्ञा काम, कार्य या व्यवसाय को व्यापक रूप से दर्शाती है। “अपने काम में” साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν, καὶ ἐν τῷ ἀποδιδόναι συνεσταλμένη
  choice: मुख्य पाठ के बजाय पाठांतर के रूप में पादटिप्पणी में
  rationale: यूनानी पाठ इस पद को एक अलग कहावत के रूप में सुरक्षित रखता है। उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ को मुख्य आधार बनाया गया है और यूनानी रूप को पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिराख 4:31 के उपलब्ध इब्रानी और यूनानी रूपों में पर्याप्त अंतर
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ में अनूदित करना
  alternative: 'यूनानी रूप का अनुवाद मुख्य पाठ में देना: “लेने के लिए तुम्हारा हाथ आगे बढ़ा हुआ न हो और लौटाते समय पीछे खिंचा हुआ न हो।”'
  rationale: इस स्थान पर इब्रानी पाठ सुरक्षित है और उसकी विश्वसनीयता उच्च मानी गई है, इसलिए वही मुख्य पाठ का आधार है। यूनानी रूप केवल शैलीगत भिन्नता नहीं, बल्कि एक अलग नैतिक कथन है; अतः दोनों को मिलाने के बजाय यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक रखी गई है। “वाणी” बोलचाल से कुछ अधिक गरिमापूर्ण है, पर सामान्य पाठक के लिए सहज है; “ढीले और लापरवाह” इब्रानी के दो निकटार्थी विशेषणों को अलग-अलग बनाए रखते हैं।
