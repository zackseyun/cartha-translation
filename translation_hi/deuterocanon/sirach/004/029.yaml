  text: Contend for righteousness until death[b][a], and Yahweh will fight for you.
translation:
  language: hi
  text: धार्मिकता के लिए मृत्यु तक संघर्ष करो[a][b], और याहवे तुम्हारे लिए लड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय के लिए मृत्यु तक संघर्ष करो।” हिब्रू צֶדֶק का अर्थ ‘धार्मिकता’ या ‘न्याय’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में यहाँ एक भिन्न वाक्य है: “अपनी बोली में कठोर न बनो, और अपने कामों में सुस्त और ढीले न पड़ो।” मुख्य पाठ में काहिरा जेनिज़ा का हिब्रू पाठ अपनाया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: मृत्यु तक
  rationale: यह वाक्यांश संघर्ष में दृढ़ बने रहने की चरम सीमा बताता है। यह सहज और संक्षिप्त है तथा अनिवार्य रूप से शहादत का अर्थ नहीं जोड़ता।
- source_word: הִנָּצֵה
  choice: संघर्ष करो
  rationale: आज्ञार्थक क्रिया का भाव किसी बात के लिए डटकर जूझने या विवाद करने का है। ‘संघर्ष करो’ हिंदी में स्वाभाविक है और अगले खंड के ‘लड़ेंगे’ से जुड़ी युद्ध-संबंधी छवि को बनाए रखता है।
- source_word: עַל הַצֶּדֶק
  choice: धार्मिकता के लिए
  rationale: צֶדֶק में नैतिक धार्मिकता और न्याय, दोनों अर्थ समाहित हो सकते हैं। ज्ञान-साहित्य के इस उपदेश में व्यापक नैतिक अर्थ के लिए ‘धार्मिकता’ मुख्य पाठ में रखा गया है और ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וַיהֹוָה
  choice: और याहवे
  rationale: हिब्रू पाठ में परमेश्वर का विशिष्ट नाम יהוה सीधे प्रयुक्त है; इसलिए उसे ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: נִלְחָם לָךְ
  choice: तुम्हारे लिए लड़ेंगे
  rationale: क्रियारूप औपचारिक रूप से कृदंत है, पर आज्ञा के बाद यह आश्वासन या परिणाम का भाव देता है। हिंदी में भविष्यकाल उस संबंध को स्पष्ट करता है और मूल समानांतरता बचाता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल हिब्रू में चतुरक्षरीय निजी नाम है। उसका लिप्यंतरण पाठ की विशिष्टता को बनाए रखता है, जबकि ‘प्रभु’ नाम को उपाधि में बदल देता।
- issue: צֶדֶק का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ शब्द व्यापक नैतिक सहीपन को सूचित कर सकता है, पर न्याय का अर्थ भी वास्तविक है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: נִלְחָם का कालगत भाव
  choice: लड़ेंगे
  alternative: लड़ते हैं
  rationale: कृदंत को आज्ञार्थक पहले खंड के प्रत्युत्तर में आश्वासन के रूप में समझा गया है। सामान्य वर्तमान अर्थ संभव है, लेकिन भविष्यकाल हिंदी में संदर्भगत परिणाम को अधिक स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन संबोधन के लिए सम्मानसूचक ‘तुम’ और उसके अनुरूप बहुवचन क्रियारूप ‘लड़ेंगे’ प्रयुक्त है। मुख्य पाठ हिब्रू साक्ष्य का अनुसरण करता है; अत्यंत भिन्न यूनानी समानांतर को पादटिप्पणी में दर्ज किया गया है।
