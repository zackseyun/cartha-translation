  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: hi
  text: क्योंकि मैं उसके साथ अपरिचिता-सी बनकर चलूँगी, और पहले उसे परीक्षाओं से परखूँगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-परंपरा में यहाँ है: “यदि वह उस पर भरोसा करे, तो वह उसे विरासत में पाएगा, और उसके वंशज उसे अपने अधिकार में रखेंगे।” उपलब्ध हिब्रू पाठ इसके बजाय कहता है कि बुद्धि उसके साथ अपने को अपरिचित-सा दिखाते हुए चलेगी और उसे परीक्षाओं से परखेगी।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: हिब्रू कारणसूचक संयोजक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְהִתְנַכֵּר
  choice: अनजान बनकर
  rationale: התנכר का अर्थ अपने को अपरिचित या पराया दिखाना है। यह 'भेष बदलकर' से कम विशिष्ट है और मूल की संभावित अर्थ-सीमा को सुरक्षित रखता है।
- source_word: אֵלֵךְ עִמּוֹ
  choice: मैं ... उसके साथ चलूँगी
  rationale: क्रिया का प्रथम पुरुष रूप ज्यों का त्यों रखा गया है; प्रसंग में वक्ता व्यक्तिरूप में प्रस्तुत बुद्धि है, इसलिए हिन्दी में स्त्रीलिंग रखा गया।
- source_word: וּלְפָנִים
  choice: और आरम्भ में
  rationale: यहाँ לפנים को कालवाची, अर्थात पहले या आरम्भ में, समझना प्रसंग में स्वाभाविक है।
- source_word: אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: परीक्षाओं के द्वारा उसे परखूँगी
  rationale: בחר का सामान्य अर्थ 'चुनना' है, पर ניסיונות के साथ इस कठिन पाठ में 'जाँचना/परखना' प्रसंगानुकूल है; बहुवचन ניסיונות को 'परीक्षाओं' से सुरक्षित रखा गया।
theological_decisions:
- issue: हिब्रू और यूनानी पाठों में मौलिक भिन्नता
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वास वाले हिब्रू साक्ष्य का अनुवाद
  alternative: यदि वह उस पर भरोसा करे, तो वह उसे विरासत में पाएगा, और उसके वंशज उसे अपने अधिकार में रखेंगे।
  rationale: दिए गए मूल-भाषा स्रोत में हिब्रू पाठ उपलब्ध है और नवीनतम स्रोत-संगत संशोधन भी उसी को प्राथमिक मानता है। यूनानी पाठ एक अलग पाठ-परंपरा को दर्शाता है; उसे पादटिप्पणी में स्पष्ट रखा गया है ताकि भिन्नता छिपे नहीं।
- issue: व्यक्तिरूप बुद्धि की वाणी में लिंग
  choice: प्रथम पुरुष क्रियाओं में स्त्रीलिंग—चलूँगी, परखूँगी
  alternative: लिंग-अस्पष्ट या पुल्लिंग अभिव्यक्ति
  rationale: आसपास के प्रसंग में वक्ता व्यक्तिरूप में स्त्रीलिंग बुद्धि है; हिन्दी व्याकरण में यह लिंग प्रकट करना आवश्यक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। 'अनजान बनकर' जानबूझकर ऐसा रूप है जो अपरिचित या पराया-सा व्यवहार करने का भाव देता है, पर मूल से अधिक विशिष्ट 'भेष बदलने' का अर्थ आरोपित नहीं करता।
