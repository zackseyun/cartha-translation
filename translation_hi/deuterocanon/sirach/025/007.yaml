base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/007.yaml
  text: The crown of the aged is much experience[a], and their boast is the fear of the Lord.
translation:
  language: hi
  text: 'वृद्धों का मुकुट बहुत अनुभव[a] है,

    और जिस बात पर वे गर्व करते हैं, वह प्रभु का भय है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विस्तृत अनुभव’ अथवा ‘दीर्घ अनुभव।’ यूनानी शब्द πολυπειρία समय के साथ अर्जित बहुत और विस्तृत अनुभव पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  choice: मुकुट
  rationale: यह सम्मान के चिह्न के रूप में मुकुट या माला को दर्शाता है। रूपक को स्पष्ट और गरिमापूर्ण बनाए रखने के लिए ‘मुकुट’ चुना गया है।
- source_word: γερόντων
  choice: वृद्धों
  rationale: यह आयु में बड़े लोगों को सूचित करता है। ‘वृद्धों’ से आयु-संबंधी अर्थ बना रहता है और किसी आधिकारिक पद का भाव नहीं जुड़ता।
- source_word: πολυπειρία
  choice: व्यापक अनुभव
  rationale: यह शब्द समय के साथ अर्जित बहुतायत और विविध अनुभव को दर्शाता है। ‘व्यापक अनुभव’ आधुनिक हिन्दी में स्वाभाविक है और अनुभव की विस्तृति पर बल देता है।
- source_word: καύχημα
  choice: गौरव
  rationale: यह शब्द गर्व करने की बात अथवा गौरव के आधार को सूचित कर सकता है। ‘गौरव’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा यहाँ नकारात्मक आत्मश्लाघा का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: φόβος Κυρίου
  choice: प्रभु का भय
  rationale: ज्ञान-साहित्य की इस स्थापित अभिव्यक्ति में परमेश्वर के प्रति श्रद्धायुक्त भय निहित है। ‘भय’ को ‘श्रद्धा’ बनाकर नरम नहीं किया गया, ताकि मूल की धार्मिक तनावपूर्ण व्यापकता बनी रहे।
theological_decisions:
- issue: φόβος Κυρίου में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में Κυρίου है; इसलिए अनुवाद सीधे यूनानी साक्ष्य पर आधारित ‘प्रभु’ रखता है। यद्यपि यह वाक्यांश इब्रानी ज्ञान-परंपरा की उस भाषा की प्रतिध्वनि करता है जिसमें परमेश्वर का नाम हो सकता है, यहाँ उसे पाठ में आयात नहीं किया गया।
- issue: καύχημα का सकारात्मक अथवा नकारात्मक भाव
  choice: गौरव
  alternative: घमंड / गर्व करने का आधार
  rationale: संदर्भ इसे प्रशंसनीय आधार के रूप में प्रस्तुत करता है। ‘गौरव’ उस सकारात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल शब्द की ‘जिस पर कोई गर्व करे’ वाली धारणा भी बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक ज्ञान-वचन की शैली रखी गई है। दोनों समांतर पंक्तियों की संज्ञात्मक संरचना और मूल का सम्मानसूचक रूपक सुरक्षित है।
