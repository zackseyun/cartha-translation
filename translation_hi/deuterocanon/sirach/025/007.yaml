  to: 'वृद्धों का मुकुट बहुत अनुभव[a] है,

    और जिस बात पर वे गर्व करते हैं, वह प्रभु का भय है।'
  rationale: The revision gives πολυπειρία its primary quantitative sense (‘बहुत अनुभव’) and renders καύχημα as the basis or object of boasting rather than the more general ‘गौरव.’ It retains the source’s parallel wisdom-saying form, the honor imagery of ‘मुकुट,’ and the theological phrase ‘प्रभु का भय.’
  reviewer_model: gpt-5.6-terra
