base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/011.yaml
  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: hi
  text: समझदार पत्नी का पति सुखी है, और वह बैल और गधे को एक साथ जोतकर हल नहीं चलाता।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह चित्र संभवतः व्यवस्थाविवरण 22:10 की ओर संकेत करता है, जहाँ बैल और गधे को एक साथ जोतकर हल चलाने से मना किया गया है। यहाँ यह बेमेल जोड़ी के लिए कहावत के रूप में प्रयुक्त हुआ जान पड़ता है।
    reason: cross_reference
  - marker: b
    text: 'यूनानी पाठ बिल्कुल भिन्न है: “जिसने बुद्धि पाई है, वह कितना महान है! परन्तु प्रभु का भय माननेवाले से बढ़कर कोई नहीं है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: सुखी है
  rationale: यह इब्रानी ज्ञान-साहित्य का मंगल-वचन सूत्र है, जो किसी की सराहनीय और वांछनीय दशा बताता है। ‘सुखी है’ आधुनिक हिन्दी में स्वाभाविक है और शब्द में अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: בַעַל אִשָּׁה
  choice: पत्नी का पति
  rationale: शाब्दिक रूप से स्वामित्व का आभास देने वाली अभिव्यक्ति यहाँ ‘पति’ के अर्थ में प्रचलित इब्रानी मुहावरा है; हिन्दी में इसे संबंधसूचक और सहज रूप में रखा गया है।
- source_word: מַשְׂכָּלֶת
  choice: समझदार
  rationale: यह शब्द व्यावहारिक बुद्धि, विवेक और उचित आचरण की क्षमता व्यक्त करता है। ‘समझदार’ साधारण आधुनिक हिन्दी में इसी व्यापक भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: חוֹרֵשׁ
  choice: हल चलाता
  rationale: इब्रानी कृदन्त खेत जोतने की क्रिया बताता है। ‘हल चलाना’ हिन्दी में इसका सीधा और प्रचलित कृषि-संबंधी रूप है।
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: बैल और गधे को एक साथ जोतकर
  rationale: ‘एक साथ’ יַחְדָּו को सुरक्षित रखता है। हिन्दी में हल चलाने के संदर्भ में ‘जोतकर’ आवश्यक संबंध स्पष्ट करता है और व्यवस्थाविवरण 22:10 के संकेत को सहज बनाता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया है और यूनानी पाठ को वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
  alternative: 'यूनानी: “जिसने बुद्धि पाई है, वह कितना महान है! परन्तु प्रभु का भय माननेवाले से बढ़कर कोई नहीं है।”'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए वही मुख्य आधार है। यूनानी परंपरा का कथन बिल्कुल भिन्न है; दोनों को मिलाने के बजाय पाठगत तनाव को स्पष्ट रूप से बनाए रखना स्रोत-साक्ष्य के प्रति अधिक ईमानदार है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समझदार’ व्यावहारिक विवेक को सामान्य पाठक के लिए स्पष्ट करता है। दूसरे खंड की कहावत को मूल इब्रानी के निकट रखते हुए ‘जोतकर’ जोड़ा गया है, ताकि हिन्दी में कृषि-चित्र स्वाभाविक रहे।
