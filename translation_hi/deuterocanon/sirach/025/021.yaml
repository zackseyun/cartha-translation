translation:
  language: hi
  text: किसी स्त्री की सुंदरता पर मत रीझो, और उसके पास जो कुछ है उसके कारण उसकी चाह मत करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “और किसी स्त्री की अभिलाषा मत करो।” इब्रानी पाठ में उसके पास जो कुछ है, उसके कारण उसकी चाह करने से रोकने वाला अतिरिक्त पदबंध है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיֹפִי
  choice: सुंदरता पर मत रीझो
  rationale: इब्रानी में शाब्दिक रूप से ‘सुंदरता पर/के कारण मत गिरो’ है। हिंदी में ‘रीझना’ सुंदरता से आकृष्ट और वशीभूत हो जाने की चेतावनी को स्वाभाविक ढंग से व्यक्त करता है और मूल रूपक का भाव बनाए रखता है।
- source_word: אִשָּׁה
  choice: किसी स्त्री
  rationale: यहाँ न तो संबंधसूचक शब्द है, न विवाह का स्पष्ट संदर्भ; इसलिए व्यापक अर्थ ‘स्त्री’ उपयुक्त है, ‘पत्नी’ नहीं। ‘किसी’ अनिश्चित संदर्भ को सहज हिंदी में स्पष्ट करता है।
- source_word: וְעַל יֵש לָהּ
  choice: और उसके पास जो कुछ है उसका
  rationale: यह संक्षिप्त इब्रानी पदबंध उसके पास की वस्तु, संपत्ति या लाभ की ओर संकेत करता है। अनिर्दिष्टता बनाए रखने के लिए इसे केवल ‘धन’ या ‘संपत्ति’ तक सीमित नहीं किया गया।
- source_word: לֹא תַּחְמוֹד
  choice: लालच मत करो
  rationale: חמד का अर्थ किसी वांछनीय वस्तु की प्रबल या लोभपूर्ण इच्छा करना हो सकता है। इस वाक्य में उसके पास की चीज़ों के संदर्भ के कारण ‘लालच करना’ स्वाभाविक है और इसे केवल कामुक अभिलाषा तक सीमित नहीं करता।
theological_decisions:
- issue: इब्रानी पाठ की विशिष्ट दूसरी पंक्ति और यूनानी समानांतर के सामान्य पाठ में अंतर
  choice: 'मुख्य पाठ में उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ का अनुसरण: ‘उसके पास जो कुछ है उसका लालच मत करो।’'
  alternative: 'यूनानी समानांतर: ‘किसी स्त्री की अभिलाषा मत करो।’'
  rationale: इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वसनीयता वाला है तथा इच्छा के कारण/विषय को अधिक स्पष्ट करता है। यूनानी पाठ में यह विशिष्टता नहीं है, इसलिए उसके पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है, न कि दोनों को मिलाकर तनाव मिटाया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सीधी चेतावनी के लिए बहुवचन/आदरार्थक आज्ञार्थक रूप। भाषा सहज और गरिमापूर्ण रखी गई है। ‘रीझो’ आकर्षण में पड़ने का भाव देता है, जबकि ‘लालच’ दूसरी पंक्ति की संपत्ति-केंद्रित इब्रानी अभिव्यक्ति को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
