translation:
  language: hi
  text: वृद्धों की बुद्धि कितनी सुंदर है, और सम्मानित लोगों में समझ और परामर्श!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ὡραία
  choice: कितनी शोभनीय है
  rationale: विस्मयवाचक ὡς और ὡραία प्रशंसात्मक उद्गार व्यक्त करते हैं। ‘कितनी शोभनीय’ सौंदर्य और उपयुक्तता, दोनों की छाया को स्वाभाविक हिन्दी में रखता है।
- source_word: γερόντων
  choice: वृद्धों में
  rationale: यह वृद्ध व्यक्तियों को सूचित करता है; ‘वृद्धों’ आयु-संदर्भ को बनाए रखता है और पदाधिकारी ‘पुरनियों’ का अनावश्यक अर्थ नहीं जोड़ता। यूनानी में संबंधकारक है, पर समानांतर पद δεδοξασμένοις के अनुरूप हिन्दी में ‘में’ स्वाभाविक है।
- source_word: σοφία
  choice: बुद्धि
  rationale: सिराख के ज्ञान-साहित्यिक संदर्भ में σοφία के लिए ‘बुद्धि’ प्रतिष्ठित, सहज और गरिमापूर्ण हिन्दी पद है।
- source_word: δεδοξασμένοις
  choice: सम्मानित लोगों में
  rationale: पूर्ण कृदन्त उन लोगों की स्थायी सम्मानित अवस्था बताता है। ‘सम्मानित’ स्पष्ट है और यहाँ अनुपयुक्त धार्मिक अर्थ वाला ‘महिमान्वित’ नहीं लाता।
- source_word: διανόημα
  choice: सूझ-बूझ
  rationale: यह विचार करने की क्षमता अथवा उससे उपजी समझ को दर्शाता है। ‘सूझ-बूझ’ βουλή से अलग रहते हुए व्यावहारिक समझ का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: βουλή
  choice: मंत्रणा
  rationale: यह सोच-विचार से दी गई सलाह या विवेकपूर्ण परामर्श को दर्शाता है। ‘मंत्रणा’ पद्य के गरिमापूर्ण ज्ञान-साहित्यिक स्तर के अनुकूल है।
theological_decisions:
- issue: γερόντων का लिंग और संदर्भ
  choice: ‘वृद्धों’—सामान्य रूप से वृद्ध व्यक्तियों के लिए
  alternative: ‘वृद्ध पुरुषों’ अथवा पदाधिकारी अर्थ में ‘पुरनियों’
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर यह उक्ति आयु से जुड़ी सामान्य प्रज्ञा की प्रशंसा करती है। हिन्दी का ‘वृद्धों’ स्रोत के व्याकरण को सहज रूप में रखता है, बिना इसे कलीसियाई पद या केवल पुरुषों तक स्पष्ट रूप से सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, विस्मयवाचक और गरिमापूर्ण ज्ञान-साहित्यिक रूप। दोनों समानांतर खंडों को ‘में’ से जोड़ा गया है, जिससे यूनानी का संबंध और काव्यात्मक संतुलन स्वाभाविक हिन्दी में व्यक्त होता है।
