translation:
  language: hi
  text: मैं दुष्ट स्त्री[a] के साथ रहने के बजाय सिंह और अजदहे के साथ रहना पसंद करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट पत्नी।” यूनानी γυνή का अर्थ संदर्भ के अनुसार “स्त्री” या “पत्नी” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῆσαι
  choice: के साथ रहना
  rationale: συνοικέω एक ही निवास में साथ रहने का बोध देता है। यह सहज हिन्दी घरेलू सहनिवास का अर्थ रखती है, बिना अनावश्यक वैवाहिक या यौन संकेत जोड़े।
- source_word: λέοντι
  choice: सिंह
  rationale: दत्तिव एकवचन λέων का सीधा अनुवाद; एकवचन से नीतिवचन का सजीव चित्र बना रहता है।
- source_word: δράκοντι
  choice: अजगर
  rationale: δράκων बड़े सर्प या ड्रैगन-सदृश प्राणी को दर्शा सकता है। आधुनिक हिन्दी में ‘अजगर’ स्वाभाविक, भयावह सर्प-चित्र देता है और ‘ड्रैगन’ जैसे आयातित शब्द से बचता है।
- source_word: εὐδόκησα
  choice: अधिक पसंद किया होता
  rationale: ἤ के साथ यह तुलनात्मक रचना वरीयता व्यक्त करती है। हिन्दी में यह रूप कथन की ‘इसके बजाय’ वाली शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐνοικῆσαι
  choice: घर में रहूँ
  rationale: ἐνοικέω निवास करने या भीतर रहने का अर्थ देता है। ‘घर में रहूँ’ घरेलू संदर्भ को स्पष्ट और सहज रखता है।
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: किसी दुष्ट स्त्री के साथ
  rationale: γυνή का अर्थ संदर्भानुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यूनानी में स्पष्ट संबंधसूचक शब्द न होने के कारण मुख्य पाठ में ‘स्त्री’ रखा गया है; πονηρά की नैतिक तीव्रता के लिए ‘दुष्ट’ उपयुक्त है।
theological_decisions:
- issue: γυνή का अनुवाद ‘स्त्री’ किया जाए या ‘पत्नी’
  choice: स्त्री
  alternative: पत्नी
  rationale: मूल यूनानी दोनों अर्थों की अनुमति देता है। घरेलू क्रियाएँ ‘पत्नी’ को संदर्भगत रूप से संभव बनाती हैं, पर स्पष्ट वैवाहिक चिह्न के अभाव में मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। ‘अजगर’ बड़े भयावह सर्प की छवि देता है; ‘किसी’ हिन्दी में अनिश्चितता को स्वाभाविक बनाता है।
