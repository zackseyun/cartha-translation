base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: hi
  text: बुरी पत्नी अपने पति के लिए कोढ़[a] है; वह उसे अपने घर से निकाल दे[b][c], तब वह अपने कोढ़ से चंगा हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צָרַעַת को परंपरागत रूप से ‘कोढ़’ कहा गया है। बाइबलीय प्रयोग में यह आधुनिक हैन्सन रोग तक सीमित नहीं, बल्कि गंभीर त्वचा-रोगों की एक व्यापक श्रेणी को सूचित कर सकता है।
    reason: cultural_note
  - marker: b
    text: या, ‘वह उसे तलाक दे दे।’ इब्रानी में अधिक शाब्दिक अर्थ है, ‘वह उसे अपने घर से निकाल दे’; इससे अलगाव का संकेत मिल सकता है, पर उसकी कानूनी रीति स्पष्ट नहीं की गई है।
    reason: alternative_reading
  - marker: c
    text: 'यूनानी समानांतर पाठ बहुत भिन्न है: ‘पानी को निकलने का रास्ता मत दो, और दुष्ट पत्नी को अधिकार न दो।’ यहाँ मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: बुरी पत्नी
  rationale: पति के स्पष्ट उल्लेख के कारण אִשָּׁה यहाँ सामान्यतः ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है। ‘बुरी’ רָעָה के व्यापक नैतिक और व्यवहारिक अर्थ को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: बाइबलीय צָרַעַת आधुनिक हैन्सन रोग तक सीमित नहीं, बल्कि गंभीर त्वचा-संबंधी रोगों की व्यापक प्राचीन श्रेणी है। ‘चर्मरोग’ आधुनिक हिन्दी पाठक को भ्रामक चिकित्सकीय समानता से बचाता है; रूपक की तीव्रता को पाद-टिप्पणी स्पष्ट करती है।
- source_word: לְבַעֲלָהּ
  choice: अपने पति के लिए
  rationale: वैवाहिक संदर्भ में בעל का अर्थ ‘पति’ है। हिन्दी में ‘के लिए’ इस विधेयात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  choice: वह उसे अपने घर से निकाल दे
  rationale: גרש का ठोस अर्थ निकालना या खदेड़ना है, और ‘अपने घर से’ इसे पुष्ट करता है। यह अनुवाद कानूनी ‘तलाक’ को मूल से अधिक स्पष्ट बनाकर नहीं थोपता।
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  choice: और अपने चर्मरोग से चंगा हो जाएगा
  rationale: רפא का अर्थ चंगा होना है। पिछले निर्देश के बाद यह परिणामसूचक भाव देता है। ‘अपने चर्मरोग’ की पुनरावृत्ति मूल के रूपक और अलंकारिक समरूपता को बनाए रखती है।
theological_decisions:
- issue: क्या יְגַרְשֶׁנָּה को कानूनी तलाक के रूप में अनूदित किया जाए या घर से निकाले जाने के ठोस कार्य के रूप में
  choice: 'घर से निकाले जाने का ठोस कथन: ‘वह उसे अपने घर से निकाल दे’'
  alternative: ‘वह उसे तलाक दे दे’
  rationale: इब्रानी क्रिया גרש और उसके साथ מִבֵּיתוֹ (‘अपने घर से’) ठोस निष्कासन बताते हैं; कानूनी रूप का स्पष्ट उल्लेख नहीं है। इसलिए पाठ में संभावित वैवाहिक अलगाव का तनाव सुरक्षित रखा गया है, पर उसे निश्चित कानूनी तलाक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। ‘कोढ़’ के बजाय ‘चर्मरोग’ चुना गया है ताकि आधुनिक रोग-निदान का भ्रामक संकेत न हो; पारंपरिक शब्द और प्राचीन अर्थ-सीमा पाद-टिप्पणी में दिए गए हैं। कठोर पितृसत्तात्मक कथन को नरम या विस्तृत नहीं किया गया, बल्कि मूल की असुविधाजनक तीव्रता और अस्पष्ट कानूनी निहितार्थ सुरक्षित रखे गए हैं।
