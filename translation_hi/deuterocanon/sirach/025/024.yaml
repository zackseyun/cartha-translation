base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/024.yaml
  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
translation:
  language: hi
  text: स्त्री से पाप का आरम्भ है[b], और उसी के कारण हम सब मरते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसी के कारण हम सब मर गए/नष्ट हो गए।” इब्रानी क्रिया को पूर्ण हुई घटना के रूप में भी समझा जा सकता है; यूनानी समानांतर में “हम सब मरते हैं” है, जो मुख्य पाठ के वर्तमान, सार्वभौमिक अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति सम्भवतः आदि-पतन के वृत्तान्त की स्त्री की ओर संकेत करती है; पद इसे संक्षेप में कहता है और स्वयं इसकी विस्तृत धर्मवैज्ञानिक व्याख्या नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: स्त्री से
  rationale: מִן स्रोत या उद्गम व्यक्त करता है और אִשָּׁה का अर्थ यहाँ ‘स्त्री’ है, न कि विशेष रूप से ‘पत्नी’। यूनानी ἀπὸ γυναικός भी इसी स्रोत-संबंधी अर्थ का समर्थन करता है।
- source_word: תְחִלַת עָוֹן
  choice: पाप का आरम्भ
  rationale: תְחִלָּה का अर्थ आरम्भ है; עָוֹן यहाँ यूनानी ἁμαρτίας के अनुरूप व्यापक नैतिक अर्थ में ‘पाप’ है। इब्रानी की संक्षिप्त, क्रियारहित रचना को हिन्दी में स्वाभाविक ढंग से रखा गया है।
- source_word: וּבִגְלָלָהּ
  choice: और उसी के कारण
  rationale: בגלל स्पष्ट कारणसूचक है। ‘उसी के कारण’ स्त्रीलिंग प्रत्यय और उसके बल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָוַעְנוּ
  choice: हम ... मरते हैं
  rationale: גוע का अर्थ मरना या प्राण छोड़ना है। इब्रानी रूप पूर्ण हुई क्रिया भी व्यक्त कर सकता है, पर यूनानी वर्तमान ἀποθνήσκομεν और कथन की सार्वभौमिक, लोकोक्तिपरक प्रकृति मुख्य पाठ में वर्तमानकाल का समर्थन करती है; वैकल्पिक भूतकाल पादटिप्पणी में सुरक्षित है।
- source_word: יַחַד
  choice: सब एक साथ
  rationale: יַחַד का मूल अर्थ ‘एक साथ’ है। ‘सब’ यूनानी πάντες और सामूहिक सार्वभौमिकता को, जबकि ‘एक साथ’ इब्रानी शब्द के प्रत्यक्ष अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: पाप और मृत्यु के आरम्भ को एक स्त्री से जोड़ने वाली व्यापक, लिंग-विशिष्ट उक्ति
  choice: ‘स्त्री से पाप का आरम्भ है’ को बिना नरम किए बनाए रखा गया।
  alternative: इसे सामान्य मानवता के विषय में लिंग-निरपेक्ष कथन बनाना, या मुख्य पाठ में हव्वा का नाम जोड़ना।
  rationale: इब्रानी और यूनानी दोनों एकवचन ‘स्त्री’ कहते हैं। यह सम्भवतः आदि-पतन की स्त्री की ओर संकेत करता है, पर पद स्वयं उसका नाम नहीं लेता और न विस्तृत धर्मवैज्ञानिक व्याख्या देता है; इसलिए न शब्दावली को निष्प्रभावी किया गया, न संकेत को मुख्य पाठ में स्पष्ट सिद्धान्त बना दिया गया।
- issue: גָוַעְנוּ का काल और मृत्यु की सार्वभौमिकता
  choice: मुख्य पाठ में ‘हम सब एक साथ मरते हैं’।
  alternative: ‘हम सब एक साथ मर गए/नष्ट हुए।’
  rationale: इब्रानी पूर्ण क्रिया भूत या पूर्ण हुई घटना का बोध करा सकती है, जबकि यूनानी समानांतर वर्तमानकाल में ‘हम सब मरते हैं’ कहता है। मुख्य पाठ सार्वभौमिक वर्तमान अर्थ रखता है और वास्तविक कालगत अस्पष्टता को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। ‘आरम्भ’ औपचारिक किंतु सामान्य बोधगम्य शब्द है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित कथनों के तुरंत बाद दिए गए हैं।
