base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: hi
  text: प्रभु का भय हर वस्तु से बढ़कर है[a]; जो उसे दृढ़ता से थामे रहता है[b], उसकी तुलना किससे की जाएगी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का भय सब वस्तुओं से ऊपर है।” यूनानी शब्दावली सभी वस्तुओं पर उसकी श्रेष्ठता व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो उसे अपने अधिकार में रखता है।” यहाँ प्रयुक्त क्रिया दृढ़ता से थामे रहने के साथ-साथ किसी वस्तु को अपने पास रखने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: प्रभु का भय
  rationale: यह यूनानी पद का सीधा और ज्ञान-साहित्य में स्थापित अनुवाद है। ‘भय’ को केवल ‘श्रद्धा’ बनाकर मूल पद के अर्थ और उसके धर्मवैचारिक तनाव को हल्का नहीं किया गया।
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: हर वस्तु से बढ़कर है
  rationale: ὑπὲρ πᾶν और ὑπερέβαλεν मिलकर सब पर श्रेष्ठता का प्रबल भाव देते हैं। सूक्तिपरक सामान्य सत्य के लिए यूनानी भूतकालीन रूप को हिन्दी में स्वाभाविक वर्तमान काल से व्यक्त किया गया है।
- source_word: ὁ κρατῶν αὐτοῦ
  choice: जो उसे दृढ़ता से थामे रहता है
  rationale: κρατέω में मजबूती से पकड़े रखने और अपने पास बनाए रखने, दोनों का भाव हो सकता है। यह अनुवाद दृढ़ और निरंतर धारण करने का भाव सुरक्षित रखता है।
- source_word: τίνι ὁμοιωθήσεται
  choice: उसकी तुलना किससे की जाएगी?
  rationale: यह भविष्यत् कर्मवाच्य में पूछा गया आलंकारिक प्रश्न है। हिन्दी रूप यूनानी की तुलना और कर्मवाच्यता दोनों को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में ‘भय’ को नरम करके केवल ‘श्रद्धा’ कहना या नहीं
  choice: प्रभु का भय
  alternative: प्रभु के प्रति श्रद्धा
  rationale: φόβος का मूल अर्थ और ‘प्रभु का भय’ की स्थापित धर्मवैचारिक अभिव्यक्ति सुरक्षित रखी गई है; उसके अर्थ को चुपचाप संकुचित नहीं किया गया।
- issue: ὑπερέβαλεν के काल का हिन्दी में निरूपण
  choice: बढ़कर है
  alternative: बढ़कर निकला / सबसे आगे बढ़ गया
  rationale: कथन एक सार्वकालिक ज्ञान-सूक्ति है, इसलिए वर्तमान काल हिन्दी में उसके सामान्य सत्य का भाव अधिक ठीक और स्वाभाविक रूप से देता है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन का निरूपण
  choice: जो उसे दृढ़ता से थामे रहता है … उसकी
  alternative: जो व्यक्ति उसे दृढ़ता से थामे रहता है … उस व्यक्ति की
  rationale: यूनानी का पुल्लिंग एकवचन सहभागी रूप हिन्दी में एकवचन संबंधवाचक रचना से सुरक्षित है, जबकि अनावश्यक रूप से ‘पुरुष’ जोड़कर अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूक्तिपरक शैली रखी गई है। ‘प्रभु का भय’ जैसे प्रमुख बाइबिलीय पद को बनाए रखते हुए वाक्य को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
