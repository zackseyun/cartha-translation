base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/008.yaml
  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: hi
  text: धन्य है वह जिसकी जीभ नहीं फिसली,[a] और जिसने अपने से अधिक तुच्छ व्यक्ति की सेवा नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इसके स्थान पर है: “वह मनुष्य जो अपनी संतानों से प्रसन्न होता है और जीवित रहते हुए अपने शत्रुओं का पतन देखता है।” यहाँ हिब्रू साक्षी यूनानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: हिब्रू का ज्ञान-साहित्य संबंधी यह सूत्र किसी व्यक्ति की सुखद और सराहनीय दशा बताता है। ‘धन्य है’ हिंदी में स्वाभाविक, गरिमापूर्ण और इस शैली से परिचित अभिव्यक्ति है।
- source_word: נִכְשַׁל
  choice: नहीं लड़खड़ाया
  rationale: मूल क्रिया का ठोस अर्थ ‘लड़खड़ाना/ठोकर खाना’ है। जीभ के साथ यह बोलने में चूक या अपराध का संकेत देती है; रूपक को बनाए रखने से अर्थ को अनावश्यक रूप से केवल ‘पाप करना’ तक सीमित नहीं किया गया।
- source_word: בִּלְשׁוֹנוֹ
  choice: अपनी जीभ से
  rationale: यह अनुवाद हिब्रू की मूर्त अभिव्यक्ति और वाणी पर उसके नैतिक बल को सुरक्षित रखता है। ‘अपनी बातों में’ अधिक व्याख्यात्मक होता।
- source_word: עֹבֵד
  choice: सेवा नहीं की
  rationale: मूल का व्यापक अर्थ किसी के अधीन सेवा करना है। ‘गुलामी नहीं की’ बंधुआ अवस्था को जरूरत से अधिक निश्चित करता, जबकि ‘काम नहीं किया’ आधुनिक रोजगार का संकुचित भाव देता।
- source_word: נִקְלֶה
  choice: अधिक तुच्छ व्यक्ति
  rationale: शब्द ऐसे व्यक्ति को सूचित करता है जिसे नीच, अपमाननीय या कम आदर योग्य समझा जाता है। ‘तुच्छ’ प्राचीन सामाजिक-सम्मान के भाव को संक्षेप में व्यक्त करता है; ‘व्यक्ति’ हिंदी में आवश्यक अर्थ स्पष्ट करता है।
- source_word: מִמֶּנּוּ
  choice: अपने से अधिक
  rationale: पूर्वसर्ग यहाँ तुलना व्यक्त करता है। यह रूप हिंदी में स्वाभाविक ढंग से उसी व्यक्ति के साथ तुलनात्मक संबंध बनाए रखता है।
theological_decisions:
- issue: इस पद में हिब्रू और यूनानी पाठ का बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू साक्षी का अनुवाद रखा गया है और यूनानी पाठ को पादटिप्पणी में दिया गया है।
  alternative: 'यूनानी: “वह मनुष्य जो अपनी संतानों से आनन्दित होता है और जीवित रहते हुए अपने शत्रुओं का पतन देखता है।”'
  rationale: हिब्रू और यूनानी इस स्थान पर मूलतः अलग कथन देते हैं। सिराख के उपलब्ध हिब्रू साक्ष्य को मुख्य स्थान देना उचित है, पर यूनानी की महत्वपूर्ण वैकल्पिक पाठ-परंपरा को छिपाने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में ज्ञान-साहित्य के अनुरूप गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जीभ से लड़खड़ाना’ मूल रूपक को सुरक्षित रखता है। दूसरे खंड में सामाजिक अधीनता और अपमान के भाव को बिना दासत्व की कानूनी स्थिति आरोपित किए व्यक्त किया गया है।
