base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/003.yaml
  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
translation:
  language: hi
  text: एक घमंडी निर्धन व्यक्ति, एक झूठ बोलने वाला धनी व्यक्ति[a], और एक व्यभिचार करने वाला और समझ-बूझ से रहित वृद्ध पुरुष[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी מְכַחֵשׁ का अर्थ ‘छल करने वाला’ या ‘इनकार करने वाला’ भी हो सकता है; यूनानी समानांतर में ‘झूठा’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘समझ-बूझ से रहित’ का अनुवाद ‘ज्ञान से रहित’ या ‘विवेक की कमी वाला’ भी किया जा सकता है; यूनानी पाठ भी समझ में कमी का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: एक घमंडी निर्धन
  rationale: דַּל किसी निर्धन या दीन व्यक्ति को और גֵּאֶה घमंड या अकड़ को व्यक्त करता है। संक्षिप्त संज्ञात्मक रूप मूल की सूचीबद्ध शैली बनाए रखता है।
- source_word: וְעָשִׁיר מְכַחֵשׁ
  choice: एक झूठ बोलने वाला धनी
  rationale: עָשִׁיר का अर्थ धनी है। כחש का कृदंत झूठ बोलने, छल करने या इनकार करने का भाव दे सकता है; यूनानी ψεύστην ‘झूठा’ यहाँ ‘झूठ बोलने वाला’ अर्थ की पुष्टि करता है।
- source_word: וְזָקֵן מְנָאֵף
  choice: एक ऐसा बूढ़ा जो व्यभिचार करता है
  rationale: זָקֵן यहाँ पदाधिकारी ‘प्राचीन’ नहीं, बल्कि वृद्ध पुरुष है। מְנָאֵף व्यभिचार करने वाले को दर्शाता है; क्रियात्मक हिन्दी अभिव्यक्ति स्पष्ट और स्वाभाविक है।
- source_word: וַחֲסַר דַּעַת
  choice: और समझ से रहित है
  rationale: इस वाक्यांश का शाब्दिक भाव ज्ञान या समझ की कमी है। यूनानी ἐλαττούμενον συνέσει भी समझ में कमी का संकेत देता है; ‘समझ से रहित’ मूल की नैतिक-बौद्धिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: ‘major_mismatch’ चिह्नित पद में इब्रानी पाठ और विस्तृत यूनानी समानांतर का संबंध
  choice: उपलब्ध इब्रानी पंक्ति का सीधे अनुवाद किया गया और संदिग्ध शब्दों के अर्थ की पुष्टि के लिए यूनानी पाठ का उपयोग किया गया।
  alternative: 'यूनानी पाठ का आरंभिक वाक्य भी जोड़ना: ‘तीन प्रकार के लोगों से मेरा मन घृणा करता है...’'
  rationale: इब्रानी पाठ इस पद में तीन व्यक्तियों की सूची देता है, जबकि यूनानी में सूची का परिचय भी है। परियोजना की स्रोत-प्राथमिकता के अनुसार सुरक्षित इब्रानी को आधार बनाया गया; यूनानी को अर्थ-साक्ष्य के रूप में लिया गया, उससे अनुपस्थित सामग्री नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। इब्रानी के पुल्लिंग एकवचन रूपों के अनुरूप ‘निर्धन’, ‘धनी’ और ‘बूढ़ा’ प्रयुक्त हैं। ‘बूढ़ा’ सामान्य आधुनिक शब्द है और यहाँ आयु बताता है, धार्मिक पद नहीं।
