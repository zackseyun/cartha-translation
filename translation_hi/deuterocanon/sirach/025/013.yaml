base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/013.yaml
  text: Any wound[a], but not like a wound of the heart; any evil, but not like the evil of a woman.
translation:
  language: hi
  text: कोई भी घाव हो, हृदय के घाव जैसा नहीं; कोई भी बुराई हो, स्त्री की बुराई जैसी नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भी विपत्ति हो, स्त्री से होने वाली विपत्ति जैसी नहीं”; इब्रानी רָעָה का अर्थ “बुराई,” “विपत्ति” या “हानि” हो सकता है, और אִשָּׁה का अर्थ प्रसंग के अनुसार “पत्नी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: हर
  rationale: दोनों पंक्तियों में इसका प्रयोग व्यापक और वितरणात्मक है। हिन्दी कहावत-सदृश शैली में ‘हर’ स्वाभाविक है और सार्वभौमिक दायरा बनाए रखता है।
- source_word: מַכָּה
  choice: घाव
  rationale: यह शब्द प्रहार और उससे हुए घाव दोनों को सूचित कर सकता है। ‘हृदय’ के साथ ‘घाव’ शारीरिक और भीतरी पीड़ा, दोनों की छवि बनाए रखता है; यूनानी πληγή भी इसका समर्थन करता है।
- source_word: הַלֵּב
  choice: हृदय
  rationale: मूल रूपक को यथावत रखा गया है। इब्रानी में यह भीतरी मनुष्य या अंतर्मन का भी संकेत दे सकता है, पर उसका विस्तार करना अनावश्यक व्याख्या होता।
- source_word: רָעָה
  choice: बुराई
  rationale: शब्द में नैतिक बुराई के साथ विपत्ति, हानि या दुःख का अर्थ भी संभव है। यूनानी πονηρία नैतिक अर्थ की ओर झुकता है, इसलिए मुख्य पाठ में ‘बुराई’ रखा गया और व्यापक वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- source_word: אִשָּׁה
  choice: स्त्री
  rationale: बिना किसी स्वत्वसूचक या स्पष्ट वैवाहिक संकेत के इसका सीधा अर्थ ‘स्त्री’ है; प्रसंग में ‘पत्नी’ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא כְ
  choice: पर ... नहीं
  rationale: इब्रानी की तुलनात्मक निषेध-रचना का आशय है कि सामान्य श्रेणी की कोई चीज उस विशेष उदाहरण जैसी नहीं। हिन्दी में ‘सहा जा सकता है, पर ... नहीं’ इस प्रबल विरोध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अंतिम पंक्ति की स्त्री-विरोधी प्रतीत होने वाली कठोरता
  choice: मुख्य पाठ में ‘स्त्री की बुराई’ को सीधे बनाए रखना
  alternative: स्त्री से हुई विपत्ति / पत्नी से हुआ अहित
  rationale: मूल पाठ का कथन स्पष्टतः कठोर और तुलनात्मक है; अनुवाद में उसे चुपचाप नरम करना उचित नहीं। फिर भी רָעָה और אִשָּׁה की वास्तविक अर्थगत व्यापकता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कहावत-सदृश लय रखी गई है। इब्रानी की अत्यंत संक्षिप्त तुलना को सहज हिन्दी बनाने के लिए ‘सहा जा सकता है/सह ली जा सकती है’ जोड़ा गया है; इससे निहित श्रेष्ठतासूचक तुलना स्पष्ट होती है, जबकि मूल का कठोर तनाव और अर्थगत अस्पष्टता बनी रहती है।
