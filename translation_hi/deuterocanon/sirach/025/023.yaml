  language: en
  yaml_path: translation/deuterocanon/sirach/025/023.yaml
  text: 'Slack hands and failing knees: a wife who does not bless her husband[a].'
translation:
  language: hi
  text: शिथिल हाथ और डगमगाते घुटने—वह पत्नी जो अपने पति को धन्य नहीं कहती।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने पति को धन्य नहीं मानती।” इब्रानी क्रिया का अर्थ “अपने पति को सुखी या भाग्यशाली नहीं बनाती” भी हो सकता है। यूनानी समानांतर में है, “जो अपने पति को धन्य नहीं मानती।”
    reason: תְאַשֵּׁר के ‘धन्य/भाग्यशाली कहना या मानना’ के प्रमुख अर्थ तथा ‘सुखी/भाग्यशाली बनाना’ की संभावित कारणवाचक अर्थ-छाया को सुरक्षित रखना।
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: शिथिल हाथ
  rationale: यह पदबंध हाथों के ढीले पड़ने या निर्बल होने की ठोस शारीरिक छवि देता है। ‘शिथिल’ उस छवि को बनाए रखता है और इसे केवल नैतिक ढिलाई के अर्थ में सीमित नहीं करता।
- source_word: וְכִשְׁלוֹן בִּרְכַּיִם
  choice: और लड़खड़ाते घुटने
  rationale: כִשְׁלוֹן का संबंध ठोकर खाने या चूकने से है; घुटनों के साथ यह उनके जवाब देने या डगमगाने का चित्र प्रस्तुत करता है। ‘लड़खड़ाते’ आधुनिक हिन्दी में स्वाभाविक है और शारीरिक रूपक को सुरक्षित रखता है।
- source_word: אִשָּׁה
  choice: ऐसी पत्नी
  rationale: अकेले यह शब्द ‘स्त्री’ भी हो सकता है, पर בַּעֲלָהּ (‘उसका पति’) वैवाहिक संदर्भ स्पष्ट करता है। ‘ऐसी’ पहले आए दोनों शारीरिक बिंबों और पत्नी के बीच उक्तिगत तुलना को स्वाभाविक बनाता है।
- source_word: לֹא תְאַשֵּׁר
  choice: धन्य नहीं करती
  rationale: אשר के पिएल रूप में किसी को धन्य या भाग्यशाली कहना, मानना अथवा बनाना निहित हो सकता है। ‘धन्य नहीं करती’ मूल की अर्थगत व्यापकता और आशीष-संबंधी शब्दावली को बनाए रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בַּעֲלָהּ
  choice: अपने पति को
  rationale: वैवाहिक संदर्भ में בַּעַל का अर्थ ‘पति’ है। हिन्दी में ‘अपने’ कर्ता और पति के संबंध को स्वाभाविक तथा स्पष्ट करता है।
theological_decisions:
- issue: इब्रानी पाठ और विस्तृत यूनानी समानांतर के बीच संबंध
  choice: उच्च-विश्वसनीयता वाले उपलब्ध इब्रानी पाठ को मुख्य आधार बनाकर उसी पंक्ति का अनुवाद किया गया है; यूनानी पाठ से केवल शारीरिक बिंब और उक्तिगत संरचना की पुष्टि ली गई है।
  alternative: यूनानी समानांतर की अतिरिक्त सामग्री—दीन हृदय, उदास मुख, हृदय का घाव और ‘दुष्ट पत्नी’—को भी इस पद में सम्मिलित करना।
  rationale: प्रस्तुत इब्रानी साक्ष्य इस पंक्ति के लिए उपलब्ध और उच्च-विश्वसनीयता वाला है। यूनानी में अतिरिक्त सामग्री है, पर उसे इब्रानी पंक्ति में जोड़ना स्रोत-साक्ष्य की सीमाओं को मिटा देगा।
- issue: תְאַשֵּׁר के अर्थ की बहुअर्थकता
  choice: मुख्य पाठ में ‘धन्य नहीं करती’ रखकर अर्थगत तनाव सुरक्षित रखा गया है।
  alternative: केवल ‘सुखी नहीं बनाती’ या केवल ‘धन्य नहीं मानती’ लिखकर एक अर्थ निश्चित कर देना।
  rationale: इब्रानी रूप किसी को धन्य/भाग्यशाली कहना या मानना और संभवतः उसे सुखी/भाग्यशाली बनाना—दोनों दिशाओं की अनुमति देता है; यूनानी समानांतर ‘धन्य नहीं मानती/कहती’ का समर्थन करता है। इसलिए किसी एक अर्थ को चुपचाप निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘शिथिल’ और ‘धन्य’ साहित्यिक किंतु सामान्यतः बोधगम्य शब्द हैं। डैश मूल की संक्षिप्त समतुल्यात्मक संरचना को स्पष्ट करता है, बिना संबंध को विस्तार से समझाकर तय किए।
