translation:
  language: hi
  text: यदि वह तुम्हारे निर्देश के अनुसार नहीं चलती,[a] तो उसे अपनी देह से काटकर अलग कर दो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘तुम्हारे हाथ के अनुसार’; यह किसी के निर्देशन या अधिकार के अधीन चलने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी देह से काटकर अलग कर दो’ निर्णायक अलगाव का शारीरिक बिंब है; यहाँ तलाक के लिए कोई स्पष्ट तकनीकी शब्द नहीं आया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: यदि ... नहीं
  rationale: यह सीधे रूप में शर्त रखता है और यूनानी वाक्य की कठोर, स्पष्ट संरचना बनाए रखता है।
- source_word: πορεύεται
  choice: चलती
  rationale: मूल क्रिया का अर्थ ‘जाना/चलना’ है; ‘चलती’ व्यवहार का संकेत भी देता है और ठोस गतिशील बिंब को सुरक्षित रखता है।
- source_word: κατὰ χεῖρά σου
  choice: तुम्हारे हाथ के अनुसार
  rationale: यह जानबूझकर मूल के ‘हाथ’ वाले मुहावरे को बनाए रखता है; पादटिप्पणी बताती है कि आशय निर्देशन या अधिकार के अनुसार चलने से है।
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: अपने शरीर से
  rationale: यूनानी में शाब्दिक रूप से ‘तुम्हारे मांसों से’ है, पर आधुनिक हिन्दी में ‘अपने शरीर से’ स्वाभाविक है और घनिष्ठ शारीरिक/वैवाहिक एकता का बिंब बनाए रखता है।
- source_word: ἀπότεμε
  choice: काटकर अलग कर दो
  rationale: आज्ञार्थक क्रिया निर्णायक रूप से काट देने या अलग करने को व्यक्त करती है; यह हिन्दी में स्वाभाविक रहते हुए मूल की तीखी शारीरिक उपमा सुरक्षित रखती है।
- source_word: αὐτήν
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम तत्काल संदर्भ की स्त्री अथवा पत्नी की ओर संकेत करता है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में आज्ञा का नैतिक और वैवाहिक बल
  choice: कठोर शारीरिक बिंब सहित निर्णायक अलगाव की आज्ञा को बनाए रखना
  alternative: इसे स्पष्ट कानूनी शब्दावली में ‘उसे तलाक दे दो’ कहना
  rationale: यूनानी पाठ तलाक के लिए कोई स्पष्ट तकनीकी कानूनी पद नहीं प्रयोग करता, बल्कि ‘अपने शरीर से काटकर अलग कर दो’ का बिंब देता है। इसलिए अनुवाद को न तो उसकी कठोरता कम करनी चाहिए, न उसे किसी एक कानूनी अर्थ तक सीमित करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर और स्पष्ट शैली। ‘तुम्हारे हाथ के अनुसार’ मूल की वास्तविक अस्पष्टता और रूपक को रखता है, जबकि पादटिप्पणी उसका मुहावरेदार आशय समझाती है। ‘शरीर’ आधुनिक पाठक के लिए ‘मांस’ से अधिक स्वाभाविक है, और ‘काटकर अलग कर दो’ मूल आज्ञा की तीव्रता को बिना कानूनी अर्थ थोपे बनाए रखता है।
