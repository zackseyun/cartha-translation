base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: hi
  text: धन्य है वह पुरुष जो समझदार पत्नी के साथ रहता है,[a] जिसकी ज़बान नहीं फिसली,[b] और जिसने ऐसे व्यक्ति की सेवा नहीं की जो उसके योग्य नहीं था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवेकी पत्नी” अथवा “बुद्धिमान पत्नी”; यूनानी शब्द व्यावहारिक समझ-बूझ रखने वाली पत्नी का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जीभ के संबंध में नहीं फिसला”; यह बोलने में ठोकर या चूक न करने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “जो ऐसे व्यक्ति का दास नहीं बना जो उसके योग्य नहीं था”; यूनानी क्रिया सेवा करने के साथ-साथ दासत्व में रहने का अर्थ भी दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह ज्ञान-साहित्य की आशीर्वचन-शैली को बनाए रखता है; ‘सुखी’ की अपेक्षा केवल मनोदशा का बोध नहीं कराता।
- source_word: συνοικῶν
  choice: के साथ रहता है
  rationale: यह एक ही घर में साथ रहने का स्वाभाविक आधुनिक हिन्दी रूप है; γυναικὶ के साथ वैवाहिक संदर्भ स्पष्ट होता है।
- source_word: γυναικὶ συνετῇ
  choice: समझदार पत्नी
  rationale: यहाँ γυνή का अर्थ वैवाहिक सहवास के कारण ‘पत्नी’ है, और συνετή व्यावहारिक समझ-बूझ को व्यक्त करता है।
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: अपनी जीभ से नहीं फिसला
  rationale: यह यूनानी की शारीरिक रूपक-भाषा को सुरक्षित रखता है और वाणी की चूक को अनावश्यक रूप से ‘पाप’ नहीं कहता।
- source_word: ἐδούλευσεν
  choice: सेवा नहीं की
  rationale: δουλεύω दासत्व या अधीन सेवा दोनों का अर्थ दे सकता है; संदर्भ में ‘सेवा की’ कम अतिनिर्धारित है, जबकि अधिक प्रबल अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀναξίῳ αὐτοῦ
  choice: अपने अयोग्य व्यक्ति
  rationale: यह αὐτοῦ के संबंध और ἀναξίῳ के मूल्यांकन को निकटता से व्यक्त करता है, बिना ‘हीन’ जैसे अधिक कठोर पदानुक्रमिक शब्द के।
theological_decisions:
- issue: ज्ञान-वचन में पुल्लिंग एकवचन
  choice: वह पुरुष
  alternative: वह व्यक्ति
  rationale: यूनानी में कर्ता स्पष्ट रूप से पुल्लिंग एकवचन है और पत्नी का उल्लेख भी पुरुष पति के संदर्भ की पुष्टि करता है।
- issue: δουλεύω का अर्थ
  choice: सेवा नहीं की
  alternative: दास नहीं बना / दासत्व में नहीं रहा
  rationale: क्रिया में दासत्व का प्रबल अर्थ संभव है, पर इस वाक्य में बंधुआ स्थिति स्पष्ट नहीं की गई; इसलिए मुख्य पाठ में कम अतिनिर्धारित रूप और पादटिप्पणी में विकल्प दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण ज्ञान-साहित्यिक शैली में रखी गई है। ‘धन्य’ आशीर्वचन का स्वर बनाए रखता है। रूपकों और सामाजिक मूल्यांकन की असुविधाजनक धार को बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया है।
