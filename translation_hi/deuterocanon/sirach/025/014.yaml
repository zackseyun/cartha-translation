  yaml_path: translation/deuterocanon/sirach/025/014.yaml
  text: Any wound[a], but not the wound of those who hate; and any vengeance[b], but not the vengeance of enemies.
translation:
  language: hi
  text: कोई भी चोट[a], लेकिन बैर रखने वालों से लगी चोट नहीं; और कोई भी प्रतिशोध[b], लेकिन शत्रुओं का प्रतिशोध नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भी विपत्ति, लेकिन बैर रखने वालों से लाई हुई विपत्ति नहीं।” ‘चोट’ के लिए प्रयुक्त यूनानी संज्ञा का व्यापक अर्थ हानि, कष्ट या विपत्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यह एक क्रियारहित, संक्षिप्त कहावत है; शब्दशः इसकी रचना है, “कोई भी चोट ... लेकिन बैर रखने वालों से लगी चोट नहीं; और कोई भी प्रतिशोध ... लेकिन शत्रुओं का प्रतिशोध नहीं।” भाव यह है कि ऐसी शत्रुता से होने वाली हानि दूसरी हानियों से अधिक दुःखद होती है।
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: कोई भी
  rationale: यहाँ शब्द का प्रयोग वितरणात्मक और निहित तुलनात्मक अर्थ में है—ऐसी विशेष हानि की अपेक्षा कोई भी दूसरी हानि। हिन्दी की कहावत-जैसी संक्षिप्त शैली में ‘कोई भी’ स्वाभाविक है।
- source_word: ἐπαγωγήν
  choice: चोट
  rationale: यह कठिन संज्ञा किसी पर लाई गई हानि, विपत्ति या आक्रमण का बोध करा सकती है। ‘चोट’ शारीरिक और लाक्षणिक दोनों प्रकार की पीड़ा के लिए पर्याप्त खुली रहते हुए पद की संक्षिप्त, कहावत-जैसी तीव्रता को बनाए रखती है।
- source_word: μισούντων
  choice: बैर रखने वालों
  rationale: यह संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त है। ‘बैर रखने वालों’ सक्रिय और स्थायी शत्रुता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘घृणा करने वालों’ की अपेक्षा प्रसंग में अधिक मुहावरेदार है।
- source_word: ἐκδίκησιν
  choice: प्रतिशोध
  rationale: यह बदले के रूप में किए गए दण्ड या प्रत्युत्तर को सूचित करता है। ‘प्रतिशोध’ पद की गंभीरता और समानांतर रचना बनाए रखता है।
- source_word: ἐχθρῶν
  choice: शत्रुओं
  rationale: यह सम्बन्धकारक बहुवचन का सीधा और मानक हिन्दी रूप है तथा स्रोत में निहित पारस्परिक विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: क्रियारहित, संक्षिप्त तुलनात्मक कहावत की व्याख्या
  choice: 'पद को निहित वरीयता के रूप में रखा गया है: बैर रखने वालों की चोट या शत्रुओं के प्रतिशोध की अपेक्षा कोई भी दूसरी चोट अथवा प्रतिशोध सहनीय है।'
  alternative: 'इसे विस्मयात्मक कथन बनाया जा सकता है: ‘बैर रखने वाले की चोट जैसी कोई चोट नहीं, और शत्रुओं के प्रतिशोध जैसा कोई प्रतिशोध नहीं।’'
  rationale: यूनानी पाठ में क्रिया नहीं है और πᾶσαν ... καὶ μὴ ... की पुनरावृत्ति संक्षिप्त कहावत के रूप में तुलनात्मक अर्थ देती है। मुख्य पाठ उस संक्षिप्तता और वास्तविक अस्पष्टता को बनाए रखता है; व्याख्यात्मक विस्तार पादटिप्पणी में दिया गया है।
- issue: ἐπαγωγή का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘चोट’ रखा गया है।
  alternative: ‘विपत्ति’, ‘कष्ट’ या ‘आक्रमण’।
  rationale: शब्द व्यापक हानि या विपत्ति का अर्थ भी दे सकता है। ‘चोट’ ठोस और लाक्षणिक दोनों अर्थों के लिए खुला है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कहावत-जैसी संक्षिप्त रखी गई है। समानांतर पद-विन्यास और स्रोत की क्रियारहित शैली को यथासंभव सुरक्षित रखा गया है; अस्पष्ट शब्द ἐπαγωγή का व्यापक अर्थ पादटिप्पणी में दिया गया है।
