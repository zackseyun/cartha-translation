lexical_decisions:
- source_word: ἐν νεότητι
  choice: अपनी जवानी में
  rationale: यह जीवन की एक अवस्था को सूचित करने वाला कालवाचक पद है। यह स्वाभाविक हिन्दी है और अंत के ‘अपने बुढ़ापे में’ के साथ संतुलन रखता है।
- source_word: οὐ συναγίοχας
  choice: तुमने ... इकट्ठा नहीं किया
  rationale: प्रेषित यूनानी क्रियारूप असामान्य और संभवतः पाठगत रूप से दूषित है; फिर भी इसका संभावित अर्थ συνάγω शब्द-परिवार के आधार पर ‘इकट्ठा करना’ समझा जाता है। यह अनुवाद किसी विशेष वस्तु को जोड़े बिना व्यापक लोकोक्तिपरक अर्थ बनाए रखता है।
- source_word: πῶς ἂν εὕροις
  choice: कैसे पाओगे
  rationale: प्रश्नवाचक और संभाव्य भाव हिन्दी के इस स्वाभाविक आलंकारिक प्रश्न में सुरक्षित रहता है।
- source_word: ἐν τῷ γήρᾳ σου
  choice: अपने बुढ़ापे में
  rationale: γήρας जीवन की वृद्धावस्था को दर्शाता है। यह पद यूनानी संरचना का अनुसरण करता और ‘अपनी जवानी में’ के समानांतर आता है।
theological_decisions:
- issue: ‘इकट्ठा करने’ और ‘पाने’ की वस्तु का अनिर्दिष्ट रहना
  choice: कर्म को निहित ही रखा गया; ‘बुद्धि’, ‘धन’ या ‘रसद’ नहीं जोड़ी गई।
  alternative: संदर्भ के आधार पर ‘बुद्धि’, या लोकोक्तिपरक अर्थ में ‘रसद’ जोड़ना।
  rationale: यूनानी पाठ में कर्म व्यक्त नहीं है। इस लोप को बनाए रखने से कथन की व्यापकता और वास्तविक अस्पष्टता सुरक्षित रहती है।
- issue: सυναγίοχας के असामान्य रूप से उत्पन्न पाठगत अनिश्चितता
  choice: संभावित अर्थ ‘इकट्ठा करना’ मुख्य पाठ में दिया और अनिश्चितता पादटिप्पणी में बताई गई।
  alternative: ‘संग्रह करना’ या ‘जमा करना’, अथवा बिना टिप्पणी के निश्चित अर्थ देना।
  rationale: दिए गए साक्षी में क्रियारूप मानक नहीं है और स्रोत का सत्यापन ‘major_mismatch’ बताता है। इसलिए संभावित अर्थ देना उचित है, पर पाठगत कठिनाई छिपाना नहीं।
