  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
translation:
  language: hi
  text: साँप के सिर से बढ़कर कोई सिर नहीं[a], और शत्रु के क्रोध से बढ़कर कोई क्रोध नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साँप के विष जैसा कोई विष नहीं।” यूनानी में ‘सिर’ शब्द दोनों बार आता है और दूसरे प्रयोग में वह साँप के सिर के लिए है; इसलिए मुख्य पाठ व्याख्यात्मक भावार्थ के बजाय मूल बिंब को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: सिर
  rationale: यूनानी पाठ में दोनों बार ठोस संज्ञा ‘सिर’ है। ‘विष’ अर्थ की व्याख्यात्मक संभावना है, पर मुख्य पाठ मूल बिंब को बनाए रखता है।
- source_word: ὄφις
  choice: साँप
  rationale: आधुनिक मानक हिन्दी में यह सहज और स्पष्ट शब्द है; ‘सर्प’ अधिक साहित्यिक या पारंपरिक लगता है।
- source_word: θυμός
  choice: क्रोध
  rationale: यहाँ शब्द तीव्र विरोधी रोष को व्यक्त करता है। ‘क्रोध’ स्वाभाविक, गरिमापूर्ण और नीतिवचन-सदृश समानांतरता के अनुकूल है।
- source_word: ἐχθρός
  choice: शत्रु
  rationale: यह यूनानी शब्द के संबंधपरक और विरोधी अर्थ को स्पष्ट रूप से व्यक्त करता है तथा पद की गरिमा बनाए रखता है।
- source_word: ὑπέρ
  choice: से बढ़कर
  rationale: इस तुलनात्मक रचना में शब्द का अर्थ किसी से श्रेष्ठ या अधिक होना है। ‘से बढ़कर’ हिन्दी में स्वाभाविक ढंग से मूल तुलना को सुरक्षित रखता है।
