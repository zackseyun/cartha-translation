  text: For because of her there is reproach and shame[a], when a wife supports her husband.
translation:
  language: hi
  text: क्योंकि जब पत्नी अपने पति का भरण-पोषण करती है, तब निंदा और लज्जा होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछली बात का कारण बताता है; ‘क्योंकि’ हिब्रू संयोजक की व्याख्यात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַעֲדָהּ
  choice: उसके कारण
  rationale: यहाँ पूर्वसर्ग और स्त्रीलिंग प्रत्यय कारण या अवसर बताते हैं; इसलिए ‘उसके कारण’ उपयुक्त है।
- source_word: חֶרְפָּה וּבֹשֶׁת
  choice: अपमान और लज्जा
  rationale: यह युग्म सामाजिक तिरस्कार और उससे उपजने वाली लज्जा—दोनों को अलग-अलग बनाए रखता है।
- source_word: אִשָּׁה
  choice: पत्नी
  rationale: अगला पदबंध ‘उसका पति’ वैवाहिक संदर्भ स्पष्ट करता है, इसलिए सामान्य ‘स्त्री’ के बजाय ‘पत्नी’ अधिक सटीक है।
- source_word: מְכַלְכֶּלֶת
  choice: भरण-पोषण करती है
  rationale: כלכל का आशय आवश्यक वस्तुएँ उपलब्ध कराकर जीविका चलाना या आर्थिक रूप से संभालना है; यूनानी समानांतर ἐπιχορηγῇ भी सामग्री उपलब्ध कराने का भाव रखता है।
- source_word: אֶת בַּעֲלָהּ
  choice: अपने पति का
  rationale: यहाँ בעל वैवाहिक संबंध में ‘पति’ है; हिन्दी में कर्ता की ओर लौटने वाला ‘अपने’ संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: प्राचीन पितृसत्तात्मक सामाजिक मूल्यांकन को अनुवाद में स्पष्ट करना या नरम करना
  choice: मूल पाठ के ‘अपमान और लज्जा’ वाले कथन को बिना संपादकीय टिप्पणी के बनाए रखा गया है।
  alternative: ऐतिहासिक सामाजिक मान्यता समझाने वाला वाक्य जोड़ना, या कथन को नरम करना।
  rationale: अनुवाद को स्रोत की असहज सामाजिक धारणा छिपानी नहीं चाहिए, पर मूल से अधिक निंदा भी नहीं जोड़नी चाहिए।
- issue: אִשָּׁה का अर्थ ‘पत्नी’ या सामान्य ‘स्त्री’
  choice: पत्नी
  alternative: स्त्री
  rationale: ‘अपने पति’ वाला वाक्यांश यहाँ वैवाहिक अर्थ निश्चित करता है।
- issue: अंतिम खंड का पहले खंड से संबंध
  choice: ‘जब’ के द्वारा परिस्थिति के रूप में जोड़ा गया है।
  alternative: 'इसे केवल समानाधिकरण के रूप में रखना: ‘अपने पति का भरण-पोषण करने वाली पत्नी।’'
  rationale: हिब्रू में स्पष्ट क्रियात्मक संयोजक नहीं है, पर प्रसंग में अंतिम खंड उस स्थिति को बताता है जिसमें अपमान और लज्जा कही गई है। ‘जब’ हिन्दी में संबंध को स्पष्ट करता है, जबकि कारणात्मक दावे को अनावश्यक रूप से तीखा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अपमान और लज्जा’ प्राचीन सम्मान-लज्जा की सामाजिक भाषा को बनाए रखता है। वाक्य उस मूल्यांकन का समर्थन करने वाली आधुनिक टिप्पणी नहीं जोड़ता।
