  text: 'तीन बातें हैं जिनसे मेरी आत्मा ने घृणा की है[a], और उनके जीवन से मुझे बहुत क्लेश होता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी का पाठ यहाँ बिल्कुल भिन्न है: “भाइयों की एकता, पड़ोसियों की मित्रता, और परस्पर मेल से रहनेवाले पति-पत्नी।” इस स्थान पर इब्रानी और यूनानी संभवतः दो अलग पाठ-रूपों को दर्शाते हैं।'
    reason: alternative_reading
