  rationale: स्त्रीलिंग संख्या और बहुवचन संकेत आगामी सूची का परिचय देते हैं; हिन्दी में ‘बातें’ जोड़ने से वाक्य स्वाभाविक और स्पष्ट रहता है।
- source_word: שָׂנְאָה נַפְשִׁי
  choice: जिनसे मेरी आत्मा ने घृणा की है
  rationale: ‘मेरी आत्मा’ मूल की भावात्मक तीव्रता बनाए रखता है, और पूर्ण क्रिया वर्तमान तक बनी हुई घृणा को व्यक्त करती है।
- source_word: וְצַר לִי מְאֹד
  choice: मुझे बहुत क्लेश होता है
  rationale: यह आधुनिक, गरिमापूर्ण हिन्दी में वक्ता की तीव्र व्यथा और खिन्नता व्यक्त करता है।
- source_word: בְּחַיֵּיהֶם
  choice: उनके जीवन के कारण
  rationale: मूलतः ‘उनके जीवन में/उनके जीवनों से’; ‘के कारण’ सम्बन्ध को स्वाभाविक हिन्दी में रखता है, बिना इसे अधिक व्याख्यात्मक ‘जीवन-ढंग’ तक सीमित किए।
theological_decisions:
- issue: सिराख 25:2 में इब्रानी और यूनानी पाठों का तीखा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी को आधार बनाया गया है और यूनानी पाठ को पादटिप्पणी में पूरा बताया गया है।
  alternative: 'यूनानी: ‘भाइयों की एकता, पड़ोसियों की मित्रता, और परस्पर मेल से रहनेवाले पति-पत्नी।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वह प्राथमिक स्रोत है; फिर भी यूनानी एक सर्वथा भिन्न पाठ-रूप प्रस्तुत करता है, इसलिए पाठगत तनाव को छिपाने के बजाय स्पष्ट किया गया है।
