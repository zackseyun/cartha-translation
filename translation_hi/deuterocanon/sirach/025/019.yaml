base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/019.yaml
  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
translation:
  language: hi
  text: हर बुराई स्त्री की बुराई की तुलना में छोटी है[a]; पापी का भाग उस पर आ पड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बुराई स्त्री की बुराई के सामने मामूली है।” हिब्रू और यूनानी दोनों में तुलना है; हिन्दी में इसे एक से अधिक स्वाभाविक ढंग से कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम खंड को अभिशाप या कामना—“आ पड़े”—के बजाय साधारण भविष्यवाणी—“आ पड़ेगा”—के रूप में भी समझा जा सकता है। यूनानी समानांतर इच्छासूचक अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט
  choice: छोटी
  rationale: यहाँ शब्द तुलनात्मक अल्पता व्यक्त करता है—दूसरी बुराई स्त्री की बुराई के सामने छोटी ठहरती है। यह यूनानी μικρά के भी अनुरूप है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द नैतिक बुराई, हानि या विपत्ति का व्यापक अर्थ रख सकता है। ‘बुराई’ मूल की कठोरता और अर्थ-विस्तार बनाए रखता है।
- source_word: כְרָעַת
  choice: की बुराई की तुलना में
  rationale: उपसर्ग כְּ यहाँ तुलना सूचित करता है। हिन्दी में यह पदबंध तुलना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִשָּׁה
  choice: स्त्री
  rationale: मूल में बिना किसी विशेषण के एकवचन ‘स्त्री’ है; इसे ‘पत्नी’ कहना अनावश्यक रूप से अर्थ सीमित करता। स्रोत की कठोर, लिंग-विशिष्ट भाषा को नरम नहीं किया गया।
- source_word: גוֹרַל
  choice: भाग
  rationale: शब्द मूलतः चिट्ठी द्वारा मिले हिस्से और विस्तार से किसी के नियत भाग को दर्शाता है। ‘भाग’ हिन्दी में इस आवंटित हिस्से या दशा के भाव को सहज रखता है।
- source_word: חוֹטֵא
  choice: पापी
  rationale: कृदन्त संज्ञा सामान्य रूप से पाप करने वाले व्यक्ति को दर्शाती है; ‘पापी’ इसका संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: יִפּוֹל עָלֶיהָ
  choice: उस पर आ पड़े
  rationale: हिब्रू yiqtol को यहाँ इच्छासूचक रूप में समझा जा सकता है; यूनानी optative भी इसका समर्थन करता है। ‘आ पड़े’ अभिशाप अथवा कामना का बल व्यक्त करता है।
theological_decisions:
- issue: अंतिम क्रिया-खंड का भाव
  choice: 'इच्छा या अभिशाप: ‘पापी का भाग उस पर आ पड़े’'
  alternative: 'भविष्यवाणी: ‘पापी का भाग उस पर आ पड़ेगा’'
  rationale: हिब्रू yiqtol का विध्यर्थक प्रयोग संभव है और यूनानी समानांतर में optative रूप इच्छासूचक अर्थ का प्रबल समर्थन करता है।
- issue: लिंग-सूचक भाषा
  choice: ‘स्त्री’ को एकवचन में बनाए रखा
  alternative: ‘पत्नी’ अथवा बहुवचन ‘स्त्रियाँ’
  rationale: हिब्रू אִשָּׁה और यूनानी γυναικός एकवचन ‘स्त्री’ कहते हैं। कथन सांस्कृतिक रूप से कठोर है, फिर भी अनुवाद में उसे न नरम किया गया है, न ‘पत्नी’ तक सीमित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ज्ञान-साहित्य के अनुरूप संक्षिप्त और गरिमापूर्ण रखी गई है। मूल के कठोर स्त्री-विषयक कथन को न बढ़ाया गया है, न नरम किया गया है।
