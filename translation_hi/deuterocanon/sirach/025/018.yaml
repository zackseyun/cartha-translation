  text: Her husband sits among his companions[a], and without sense he groans.
translation:
  language: hi
  text: उसका पति अपने साथियों के बीच बैठता है[a], और बिना समझे कराहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “उसका पति अपने साथियों के बीच टेक लगाकर बैठेगा, और सुनकर उसने कड़वाहट से कराहा।” विशेषकर पद के दूसरे भाग में यह उपलब्ध इब्रानी पाठ से उल्लेखनीय रूप से भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: उसका पति
  rationale: इस प्रसंग में 3 स्त्रीलिंग एकवचन प्रत्यय के साथ בַּעַל विवाहित स्त्री के पति को सूचित करता है; ‘पति’ स्वाभाविक और सटीक है।
- source_word: בֵּין רֵעִים
  choice: अपने साथियों के बीच
  rationale: רֵעִים मित्रों या साथियों को सूचित करता है। यहाँ सामाजिक परिवेश के लिए ‘साथियों’ सहज है; ‘अपने’ हिन्दी में संबंध स्पष्ट करता है और यूनानी समानांतर से भी मेल खाता है।
- source_word: יֵשֵׁב
  choice: बैठता है
  rationale: इब्रानी क्रिया का सीधा अर्थ ‘बैठना’ है। यूनानी में भोज के समय टेक लगाकर बैठने का भाव है, पर मुख्य पाठ इब्रानी का अनुसरण करता है।
- source_word: וּבְלֹא טַעֲמוֹ
  choice: बिना समझे
  rationale: טַעַם यहाँ शाब्दिक ‘स्वाद’ नहीं, बल्कि समझ, विवेक या कारण-बोध का द्योतक है। ‘बिना समझे’ अर्थ की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: יִתְאַנָּח
  choice: कराहता है
  rationale: यह रूप सुनाई देने वाले दुःख या व्यथा को व्यक्त करता है; ‘कराहता है’ सामान्य ‘आह भरता है’ की अपेक्षा इसकी तीव्रता बेहतर रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में भिन्नता
  choice: 'मुख्य पाठ उपलब्ध इब्रानी का अनुसरण करता है: पति साथियों के बीच बैठता है और बिना समझे कराहता है।'
  alternative: 'यूनानी समानांतर: ‘उसका पति अपने साथी/साथियों के बीच टेक लगाकर बैठेगा, और सुनकर वह फूट-फूटकर कराहा।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। दूसरे अर्धपद में यूनानी का अर्थ उल्लेखनीय रूप से अलग है, अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली रखी गई है। इब्रानी की वाक्य-संरचना और अर्थगत तनाव को यथासंभव बनाए रखते हुए यूनानी पाठांतर को पादटिप्पणी में दिया गया है।
