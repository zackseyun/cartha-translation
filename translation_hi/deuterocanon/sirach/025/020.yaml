base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/020.yaml
  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: hi
  text: जैसे बूढ़े व्यक्ति के पैरों के नीचे रेतीली चढ़ाई[a] होती है, वैसे ही तीखी ज़बानवाली पत्नी[b] एक सौम्य पुरुष के लिए होती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी חוּץ यहाँ कठिन है; यूनानी समानांतर में ‘रेतीली’ है, जो सम्भवतः इस बिंब का आशय सुरक्षित रखता है—बूढ़े व्यक्ति के पैरों के नीचे अस्थिर रेत वाली चढ़ाई।
    reason: textual_variant
  - marker: b
    text: या, “बहुत बोलनेवाली पत्नी।” इब्रानी मुहावरे का शाब्दिक अर्थ “जीभ वाली पत्नी” है; यूनानी शब्द ऐसी स्त्री का अर्थ दे सकता है जो बहुत बोलती है या अपनी जीभ चलाती है।
    reason: lexical_alternative
  - marker: c
    text: या, “शांत पुरुष।” इब्रानी शब्द का मूल अर्थ “कोमल” या “नरम” है; यूनानी समानांतर “शांत” या “शांतिप्रिय” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה
  choice: जैसे ... चढ़ाई
  rationale: עלה से बना यह संज्ञा-रूप ऊपर चढ़ने के मार्ग या चढ़ाई को दर्शाता है; यूनानी ἀνάβασις भी इसी अर्थ की पुष्टि करता है।
- source_word: חוּץ
  choice: रेतीली
  rationale: इब्रानी शब्द यहाँ कठिन और संभवतः पाठगत रूप से अनिश्चित है। यूनानी समानांतर का ἀμμώδης स्पष्टतः ‘रेतीली’ है और बूढ़े व्यक्ति के लिए अस्थिर पाँव वाली चढ़ाई के बिंब को सार्थक बनाता है।
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: किसी बूढ़े व्यक्ति के पैरों तले
  rationale: יָשִׁישׁ वृद्ध व्यक्ति को सूचित करता है, किसी पदाधिकारी ‘प्राचीन’ को नहीं। ‘पैरों तले’ कठिन और अस्थिर आधार का स्वाभाविक हिन्दी बिंब देता है।
- source_word: אֵשֶׁת לָשׁוֹן
  choice: कटु बोलनेवाली पत्नी
  rationale: शाब्दिक अर्थ ‘जीभ वाली पत्नी’ है। यूनानी γλωσσώδης बहुत बोलने या जीभ चलानेवाली स्त्री को दर्शा सकता है; नकारात्मक उपमा के कारण ‘कटु बोलनेवाली’ हानिकारक वाणी का भाव सहज हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְאִישׁ רַךְ
  choice: किसी नम्र पुरुष के लिए
  rationale: רַךְ का मूल भाव कोमल या नरम है; व्यक्ति के चरित्र में यह नम्रता या मृदुता बता सकता है। यूनानी ἡσύχῳ ‘शांत/शांतिप्रिय’ अर्थ का समर्थन करता है। ‘नम्र’ कायरता का अनावश्यक भाव जोड़े बिना विरोध को बनाए रखता है।
theological_decisions:
- issue: नीतिवचन में लिंग-सूचक शब्दों का अनुवाद
  choice: पत्नी ... पुरुष
  alternative: जीवन-साथी ... व्यक्ति; स्त्री ... पति
  rationale: इब्रानी में אֵשֶׁת और אִישׁ तथा यूनानी में γυνή और ἀνήρ स्पष्ट रूप से लिंग-सूचक एकवचन शब्द हैं। इसलिए कहावत के मूल सामाजिक रूप को लिंग-निरपेक्ष बनाए बिना रखा गया है।
- issue: אֵשֶׁת לָשׁוֹן की नकारात्मक वाणी का स्वरूप
  choice: कटु बोलनेवाली
  alternative: बहुत बोलनेवाली; जीभ चलानेवाली
  rationale: इब्रानी मुहावरा वास्तविक अस्पष्टता रखता है और यूनानी मुख्यतः वाचालता की ओर संकेत कर सकता है। प्रसंग नकारात्मक है, इसलिए मुख्य पाठ में स्वाभाविक ‘कटु बोलनेवाली’ रखा गया, पर वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘रेतीली चढ़ाई’ दृश्य बिंब को स्पष्ट करती है, ‘पैरों तले’ सहज मुहावरा है, और पाठगत तथा अर्थगत अनिश्चितताओं को तीन पादटिप्पणियों में सुरक्षित रखा गया है।
