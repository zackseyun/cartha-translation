base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/005.yaml
  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: hi
  text: यदि तुमने अपनी जवानी में उन्हें नहीं चाहा[a], तो अपने बुढ़ापे में उन्हें कैसे प्राप्त करोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘उन्हें’ का पूर्वपद नहीं बताया गया है। यूनानी समानांतर वृद्धावस्था में विवेक और सलाह को समझने की प्रशंसा करता है; इसलिए यह संभवतः बुद्धि से जुड़े गुणों या उपलब्धियों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह सीधे रूप में शर्त प्रस्तुत करता है।
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: अपनी जवानी में
  rationale: हिब्रू का बहुवचन रूप जीवन की युवावस्था को सूचित करता है; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: לֹא חֲפַצְתָּם
  choice: तुमने उनकी अभिलाषा नहीं की
  rationale: חפץ का मूल अर्थ इच्छा करना, चाहना या प्रसन्न होना है। ‘अभिलाषा करना’ सक्रिय खोज का अर्थ जोड़े बिना मूल भाव को निकटता से व्यक्त करता है और बहुवचन कर्म को बनाए रखता है।
- source_word: אֵיךְ
  choice: कैसे
  rationale: यह आगे की संभावना पर प्रश्न उठाने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: תַּשִּׁיגֵם
  choice: उन्हें कैसे प्राप्त करोगे
  rationale: השיג का अर्थ पहुँच पाना या प्राप्त करना है; भविष्यकालीन रूप को ‘करोगे’ से रखा गया है।
- source_word: בְּזִקְנוֹתֶיךָ
  choice: अपने बुढ़ापे में
  rationale: यह वृद्धावस्था की अवधि को सूचित करता है और ‘जवानी’ के साथ स्पष्ट विरोध बनाता है।
theological_decisions:
- issue: बहुवचन कर्म-प्रत्यय ‘उन्हें’ का अनिर्दिष्ट पूर्वपद
  choice: मुख्य पाठ में ‘उन्हें/उनकी’ रखकर कर्म को अनिर्दिष्ट रखा गया है।
  alternative: ‘बुद्धि’ या ‘बुद्धि से जुड़े गुण’ स्पष्ट रूप से जोड़ना।
  rationale: हिब्रू में केवल बहुवचन प्रत्यय है और उसका पूर्वपद इस पद में नहीं दिया गया। यूनानी समानांतर न्याय-विवेक और सम्मति समझने की ओर संकेत करता है, पर मुख्य पाठ में उसे स्पष्ट रूप से जोड़ना मूल की सार्थक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक शैली। ‘अभिलाषा’ सामान्य बोलचाल से कुछ ऊँचा शब्द है, पर חפץ के ‘इच्छा करना/चाहना’ भाव को सटीक और स्वाभाविक ढंग से रखता है।
