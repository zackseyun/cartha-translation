translation:
  language: hi
  text: 'तीन बातों में मैं सुन्दर बनी[a], और प्रभु और मनुष्यों के सामने सुन्दर होकर उठ खड़ी हुई[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे सुन्दर बनाया गया”; यूनानी निष्क्रिय रूप सुन्दर हो जाने की परिणामी अवस्था अथवा वक्ता पर किए गए कार्य—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं सुन्दर होकर खड़ी हुई”; यूनानी में उठने या सामने खड़े होने का ठोस बिम्ब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: तीन बातों में
  rationale: ἐν के क्षेत्र अथवा सम्बन्ध-सूचक अर्थ को रखते हुए यह आगे आने वाली तीन बातों की सूची का स्वाभाविक परिचय देता है।
- source_word: ὡραιώθην
  choice: मैं सुन्दर बनी
  rationale: यह अओरिस्ट निष्क्रिय रूप सुन्दर बनाए जाने अथवा सुन्दर हो जाने—दोनों की ध्वनि दे सकता है। हिन्दी में ‘सुन्दर बनी’ परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है और कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀνέστην
  choice: उठ खड़ी हुई
  rationale: ἀνίστημι के ठोस उठने या खड़े होने के बिम्ब को बचाया गया है; इसे केवल ‘दिखाई दी’ कहना मूल की मूर्त भाषा को अमूर्त कर देता।
- source_word: ὡραία
  choice: सुन्दर होकर
  rationale: यह ὡραιώθην के सौन्दर्य-विषय को दोहराता है। स्त्रीलिंग रूप वक्ता के व्याकरणिक स्त्रीलिंग को हिन्दी में भी व्यक्त करता है।
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: प्रभु और मनुष्यों के सामने
  rationale: ἔναντι की उपस्थिति अथवा दृष्टि के सामने होने की धारणा को सीधे व्यक्त करता है। ἀνθρώπων यहाँ सामान्य रूप से मानवों को सूचित करता है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: इस पद का उपलब्ध मूल साक्ष्य यूनानी है और κύριος सामान्यतः ‘प्रभु’ है; यहाँ किसी प्रत्यक्ष इब्रानी परमेश्वर-नाम को मान लेना उचित नहीं।
- issue: ἀνθρώπων का अनुवाद
  choice: मनुष्यों
  alternative: लोगों
  rationale: ‘मनुष्यों’ यूनानी के सामान्य मानव-संज्ञा अर्थ को स्पष्ट रखता है और इसे केवल पुरुषों तक सीमित नहीं करता।
- issue: वक्ता का स्त्रीलिंग
  choice: बनी…उठ खड़ी हुई
  alternative: सुन्दर बनाया गया…खड़ा हुआ
  rationale: ὡραία का यूनानी स्त्रीलिंग वक्ता को स्त्रीलिंग रूप में प्रस्तुत करता है; हिन्दी में इसे बनाए रखना मूल के व्याकरण और सम्भावित व्यक्तिकरण दोनों का सम्मान करता है, बिना वक्ता की पहचान को इस एक पद में और निश्चित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। मूल के सौन्दर्य-विषय, स्त्रीलिंग वक्ता और उठकर खड़े होने के बिम्ब को बनाए रखा गया है। पद के अन्त में पूर्णविराम रखा गया है, क्योंकि प्रस्तुत यूनानी अंश अपने आप में कथन पूरा करता है, यद्यपि आगे की सूची से इसका निकट सम्बन्ध है।
