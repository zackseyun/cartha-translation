  yaml_path: translation/deuterocanon/sirach/025/017.yaml
  text: A woman's evil darkens a man's appearance[b][a], and makes his face gloomy like a bear.
translation:
  language: hi
  text: स्त्री की बुराई पुरुष का रूप काला कर देती है[a] और उसके चेहरे को भालू के समान मलिन कर देती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द אִשָּׁה का अर्थ ‘पत्नी’ भी हो सकता है; इसलिए यह पंक्ति विशेष रूप से पति-पत्नी के घरेलू संदर्भ में भी समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर पाठ पढ़ता है, ‘और उसके चेहरे को टाट जैसा काला कर देती है।’ यह उपलब्ध हिब्रू के ‘भालू के समान’ बिंब से भिन्न है; यूनानी पाठ में सर्वनाम भी स्त्रीवाचक हैं, जबकि हिब्रू में पुरुषवाचक हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: बुराई
  rationale: यह संज्ञा नैतिक बुराई या हानिकारकता बताती है; ‘बुराई’ हिन्दी में संक्षिप्त और लोकोक्तिपरक है।
- source_word: אִשָּׁה
  choice: स्त्री की
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। स्पष्ट संबंधसूचक चिह्न न होने से मुख्य पाठ में व्यापक अर्थ ‘स्त्री’ रखा गया है और ‘पत्नी’ की संभावना पादटिप्पणी में दी गई है।
- source_word: יַשְׁחִיר מַרְאֶה אִישׁ
  choice: पुरुष का रूप काला कर देती है
  rationale: हिब्रू क्रिया का कारक अर्थ ‘काला/अँधेरा कर देना’ है और מַרְאֶה दृश्य रूप को सूचित करता है; यह अनुवाद मूल बिंब को बनाए रखता है।
- source_word: וְיַקְדִיר פָּנָיו
  choice: उसके चेहरे को ... उदास बना देती है
  rationale: קדַר अँधेरा, मलिन या शोकाकुल होने का भाव दे सकता है। पहले खंड के ‘काला’ से अनावश्यक पुनरावृत्ति बचाते हुए ‘उदास’ भावात्मक छाया को व्यक्त करता है।
- source_word: לְדוֹב
  choice: भालू-सा
  rationale: प्राप्त हिब्रू पाठ स्पष्टतः ‘भालू’ पढ़ता है; इसलिए यूनानी के भिन्न ‘टाट’ बिंब के बजाय मुख्य पाठ में हिब्रू को प्राथमिकता दी गई है।
theological_decisions:
- issue: लिंग-विशिष्ट नीतिवचन
  choice: स्त्री की बुराई पुरुष का रूप काला कर देती है
  alternative: पत्नी की बुराई उसके पति का रूप काला कर देती है
  rationale: हिब्रू में אִשָּׁה और אִישׁ स्पष्ट लिंग-सूचक शब्द हैं। मुख्य पाठ उनकी लिंग-विशिष्टता बनाए रखता है, पर אִשָּׁה के ‘पत्नी’ अर्थ को निश्चित नहीं मानता।
- issue: हिब्रू और यूनानी में भिन्न बिंब
  choice: भालू-सा
  alternative: टाट के समान
  rationale: मुख्य आधार उपलब्ध हिब्रू पाठ है, जिसमें לְדוֹב ‘भालू-सा’ है। यूनानी समानांतर अलग सर्वनामों के साथ ‘उसके चेहरे को टाट के समान अँधेरा करती है’ पढ़ता है; इसे पाठांतर के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश रूप। ‘रूप काला कर देती है’ मूल दृश्य बिंब रखता है, जबकि ‘उदास’ קדַר के मलिन/शोकपूर्ण भाव को सहज हिन्दी में व्यक्त करता है।
