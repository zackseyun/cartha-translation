base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/001.yaml
  text: Do not be jealous of the wife in your bosom[c][b][a], lest you teach against yourself an evil lesson.
translation:
  language: hi
  text: अपनी छाती से लगी पत्नी से ईर्ष्या मत कर,[a][b] कहीं ऐसा न हो कि तू अपने ही विरुद्ध बुरी शिक्षा दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ईर्ष्या मत कर’ का अर्थ यहाँ पत्नी के प्रति संदेहपूर्ण जलन न रखना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तेरी छाती/गोद की पत्नी’; यह हिब्रू मुहावरा अपनी अत्यंत घनिष्ठ पत्नी के लिए है।
    reason: cultural_note
  - marker: c
    text: 'हिब्रू में शाब्दिक रूप से लगभग, ‘कहीं तू अपने ही विरुद्ध बुराई न सिखाए’; सिखाने का कर्म अनुक्त है। यूनानी समानांतर में ‘बुरी शिक्षा’ है। इसे इस अर्थ में भी समझा गया है: ‘कहीं तू स्वयं बुराई न सीख ले।’'
    reason: textual_and_semantic_ambiguity
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: ईर्ष्या मत कर
  rationale: קנא वैवाहिक संदर्भ में ईर्ष्या या संदेहपूर्ण जलन को व्यक्त करता है। ‘ईर्ष्या मत कर’ सामान्य आधुनिक हिन्दी में स्वाभाविक है; केवल ‘डाह मत कर’ यहाँ कम स्पष्ट होता।
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: अपनी अंकशायिनी पत्नी
  rationale: חיק का शाब्दिक अर्थ गोद या वक्ष है और यह घनिष्ठ पत्नी के लिए मुहावरा है। ‘अंकशायिनी पत्नी’ मूल बिंब और वैवाहिक निकटता को संक्षेप में सुरक्षित रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी देता है; आधुनिक हिन्दी में ‘कहीं ऐसा न हो कि’ इसका स्वाभाविक समतुल्य है।
- source_word: תִּלְמַד עָלֶיךָ
  choice: तू अपने ही विरुद्ध उसे ... सीख दे
  rationale: स्वरांकित हिब्रू और यूनानी δίδαξῃς दोनों ‘सिखाने’ का समर्थन करते हैं। עליך का प्रतिकूल भाव ‘अपने ही विरुद्ध’ से रखा गया है। हिन्दी में सीख पाने वाले कर्म को स्पष्ट करने के लिए ‘उसे’ जोड़ा गया है, जिसका संकेत पत्नी के निकट संदर्भ से मिलता है।
- source_word: רָעָה
  choice: बुरी सीख
  rationale: हिब्रू में केवल ‘बुराई/बुरा’ है, जबकि यूनानी समानांतर में ‘बुरी शिक्षा/अनुशासन’ है। ‘बुरी सीख’ למד के साथ स्वाभाविक हिन्दी बनाती और दोनों साक्ष्यों को साथ रखती है।
theological_decisions:
- issue: चेतावनी का आशय
  choice: पति की ईर्ष्या पत्नी को बुरा आचरण सिखाकर अंततः उसी के विरुद्ध पड़ सकती है
  alternative: पति स्वयं अपने लिए बुराई सीखता है
  rationale: हिब्रू क्रिया का स्वरूप और यूनानी समानांतर ‘सिखाना’ सुझाते हैं, यद्यपि संक्षिप्त हिब्रू वाक्य में कर्म अनकहा है। इसलिए अनुवाद प्रमुख अर्थ देता है और पादटिप्पणी में अस्पष्टता बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और चेतावनीपरक है। ‘अंकशायिनी’ सामान्य बोलचाल से कुछ ऊँचा साहित्यिक शब्द है, पर मूल के अंतरंग ‘वक्ष/गोद’ वाले बिंब को अशिष्टता के बिना सुरक्षित रखता है। संबोधन में एकवचन ‘तू’ ज्ञान-साहित्य की प्रत्यक्ष उपदेशात्मक शैली के अनुरूप है।
