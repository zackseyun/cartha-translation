  yaml_path: translation/deuterocanon/sirach/009/002.yaml
  text: Do not give your soul to a woman[b][a], to let her tread on your heights.
translation:
  language: hi
  text: अपना प्राण किसी स्त्री को मत सौंप[a], कि वह तेरी ऊँचाइयों पर पाँव रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रियारूप कठिन है और उसका एक संभावित पाठ ‘ईर्ष्या मत कर’ हो सकता है; यूनानी में है, ‘अपना प्राण किसी स्त्री को मत दे।’
    reason: alternative_reading
  - marker: b
    text: ‘तेरी ऊँचाइयाँ’ पद, प्रतिष्ठा या सामर्थ्य का रूपक हो सकता है। यूनानी में है, ‘तेरी सामर्थ्य पर पाँव रखे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: मत सौंप
  rationale: मसोराई रूप कठिन है और उसे ‘ईर्ष्या मत कर’ समझा जा सकता है, पर यूनानी समानांतर μὴ δῷς (‘मत दे’) स्वयं को किसी के अधीन सौंपने का अर्थ पुष्ट करता है। ‘मत सौंप’ हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַפְשְׁךָ
  choice: अपना प्राण
  rationale: נפש व्यक्ति के प्राण, जीवन या संपूर्ण अस्तित्व को सूचित कर सकता है। ‘प्राण’ मूल बिंब को बनाए रखता है और यहाँ केवल अमूर्त ‘आत्मा’ का संकीर्ण धार्मिक अर्थ आरोपित नहीं करता।
- source_word: לְאִשָּׁה
  choice: किसी स्त्री को
  rationale: इब्रानी אשה का अर्थ ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है, पर यहाँ कोई स्वत्वसूचक चिह्न नहीं है। इसलिए ‘स्त्री’ कम प्रतिबंधक विकल्प है; ‘किसी’ हिन्दी में अनिश्चितता को स्वाभाविक बनाता है।
- source_word: לְהַדְרִיכָהּ
  choice: कि वह … पाँव रखे
  rationale: प्रेषित इब्रानी रूप चलाने या पाँव रखवाने का संकेत दे सकता है; यूनानी ἐπιβῆναι स्पष्ट रूप से ऊपर चढ़ने या पाँव रखने के ठोस बिंब का समर्थन करता है।
- source_word: עַל בָּמוֹתֶיךָ
  choice: तेरी ऊँचाइयों पर
  rationale: במותיך का शाब्दिक अर्थ ‘तेरी ऊँचाइयाँ/ऊँचे स्थान’ है। इसे मुख्य पाठ में बनाए रखने से इब्रानी रूपक सुरक्षित रहता है; यूनानी का ‘तेरी सामर्थ्य पर’ वाला अर्थ टिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या पद को प्रभुत्व के विषय में आधुनिक अमूर्त कथन बनाकर स्पष्ट किया जाए या स्रोत का तनावपूर्ण रूपक रखा जाए
  choice: ‘प्राण सौंपना’ और ‘ऊँचाइयों पर पाँव रखना’—दोनों ठोस बिंब सुरक्षित रखे गए हैं।
  alternative: अपने आपको किसी स्त्री के अधीन मत कर, नहीं तो वह तुझ पर अधिकार कर लेगी।
  rationale: यह ज्ञान-साहित्य की चेतावनी है, विवाह या स्त्री-पुरुष के स्वभाव पर व्यवस्थित सिद्धांत नहीं। रूपक को बनाए रखने से अनावश्यक रूप से अधिक व्यापक या कठोर दावा आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-वचन शैली रखी गई है। एकवचन ‘तेरी’ मूल के एकवचन संबोधन को दर्शाता है। ‘आत्मा’ के बजाय ‘प्राण’ चुना गया है ताकि נפש को अनावश्यक रूप से किसी विशिष्ट दार्शनिक या सांप्रदायिक अर्थ तक सीमित न किया जाए।
