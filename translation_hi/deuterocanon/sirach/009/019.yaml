translation:
  language: hi
  text: जान लो कि तुम फंदों के बीच कदम रखोगे और जाल तक चलते-फिरोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी पाठ है, “जान लो कि तुम फंदों के बीच कदम रखोगे और जाल तक चलते-फिरोगे।” यूनानी परंपरा में यह पद बहुत भिन्न है: “अपने नगर में बातूनी व्यक्ति से डरते हैं, और जो अपनी बातों में उतावला है, उससे घृणा की जाएगी।” यहाँ अनुवाद में उपलब्ध इब्रानी पाठ को मुख्य साक्षी माना गया है, साथ ही यूनानी पाठ के इस अंतर को दर्ज किया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: जान लो
  rationale: ידע का आज्ञार्थक रूप है। ‘जान लो’ इब्रानी उपदेश की संक्षिप्त और सीधी शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בֵין פַּחִים
  choice: फंदों के बीच
  rationale: פַּח छिपे हुए फंदे या जाल को दर्शाता है; בֵין के साथ बहुवचन का अर्थ अनेक खतरों के बीच चलना है।
- source_word: תִּצְעָד
  choice: कदम रखोगे
  rationale: צעד का अर्थ कदम रखना या बढ़ाना है। यह सामान्य ‘चलोगे’ की अपेक्षा संकटपूर्ण भूमि पर पैर रखने के बिंब को अधिक स्पष्ट रखता है।
- source_word: וְעַד רֶשֶׁת
  choice: और जाल तक
  rationale: עַד का मूल स्थानिक अर्थ ‘तक’ है और רֶשֶׁת वास्तविक जाल है। वाक्यांश असामान्य होते हुए भी स्रोत की ठोस छवि और जाल के निकट पहुँचने की अस्पष्टता को सुरक्षित रखता है।
- source_word: תִּתְהַלָּךְ
  choice: चलते-फिरोगे
  rationale: הלך के हित्पएल रूप में निरंतर या इधर-उधर चलने का भाव हो सकता है; ‘चलते-फिरोगे’ उस विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘फंदों’ और ‘जाल’ के अलग-अलग बिंब सुरक्षित हैं; ‘जाल तक’ जानबूझकर रखा गया है ताकि इब्रानी עַד की स्थानिक अभिव्यक्ति को अनावश्यक रूप से ‘पास’ में न बदला जाए।
