  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
translation:
  language: hi
  text: उसके पति के साथ भोजन मत करना[a], और उसके साथ नशे में मत बैठना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “पापी की महिमा से ईर्ष्या मत करना, क्योंकि तुम नहीं जानते कि उसका अंत कैसा होगा।” यहाँ उपलब्ध इब्रानी पाठ यूनानी परंपरा से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: उसके पति के साथ
  rationale: בעל के स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय का इस प्रसंग में स्वाभाविक अर्थ ‘उसका पति’ है; עִם संगति को दर्शाता है।
- source_word: אַל תִּטְעָם
  choice: भोजन न करना
  rationale: क्रिया का मूल अर्थ ‘चखना’ है, पर किसी व्यक्ति के साथ प्रयुक्त होने पर यहाँ साझा भोजन करना अभिप्रेत है। यह शाब्दिक अर्थ और सामाजिक भोजन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַל תָּסֵב
  choice: और न ... बैठना
  rationale: סבב का यह रूप मेज़ पर बैठने अथवा टेक लगाकर बैठने को सूचित कर सकता है। सामान्य पाठक के लिए ‘बैठना’ स्वाभाविक है और अनावश्यक सांस्कृतिक विशिष्टता नहीं जोड़ता।
- source_word: עִמּוֹ שִׁכּוֹר
  choice: उसके साथ नशे में
  rationale: עִמּוֹ पति की ओर संकेत करता है। שִׁכּוֹר मदहोशी की अवस्था बताता है; हिन्दी में ‘नशे में’ इस अवस्था को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यह व्याकरणतः किस व्यक्ति पर लागू है, उसमें कुछ अस्पष्टता बनी रहती है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी पाठ: “पापी की महिमा से ईर्ष्या न करना, क्योंकि तुम नहीं जानते कि उसका पतन कैसा होगा।”'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी परंपरा का अत्यंत भिन्न पाठ पाठांतर-संबंधी पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שִׁכּוֹר का संबंध
  choice: ‘नशे में’ को क्रिया-परिस्थिति के रूप में रखना
  alternative: ‘जब वह नशे में हो’ अथवा ‘नशेड़ी के रूप में’
  rationale: इब्रानी का संक्षिप्त विन्यास यह पूरी तरह स्पष्ट नहीं करता कि नशे की अवस्था केवल पति की है, संबोधित व्यक्ति की है, या पूरी संगति की। हिन्दी में अनिर्दिष्ट रचना रखकर इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण निषेधात्मक शैली। ‘भोजन करना’ सामाजिक भोजन के भाव को व्यक्त करता है, और ‘नशे में बैठना’ इब्रानी की संक्षिप्तता तथा संभावित अस्पष्टता को बनाए रखता है।
