base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/005.yaml
  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
translation:
  language: hi
  text: जो तुम्हारी आँखों को दिखाई देता है, उसके कारण अपने को नीचा न गिराओ; और उसके घर के पीछे पड़कर उजड़ न जाओ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “किसी कुँवारी को ध्यान से न निहारो, कहीं ऐसा न हो कि उससे जुड़ी फटकारों या दंडों के कारण तुम ठोकर खाओ।” इस पद में इब्रानी और यूनानी पाठों में पर्याप्त अंतर है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी “उसके घर के पीछे” कठिन है। इसका आशय उसके घर-परिवार के पीछे लगना, या उससे संबंध रखने के कारण उजड़ना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: अपने को नीचा न गिराओ
  rationale: हित्पएल का आत्मवाचक भाव बनाए रखते हुए यह चुनाव स्वयं को अपमानित, अधम या नैतिक रूप से गिराने की चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: जो तुम्हारी आँखें देखें, उससे
  rationale: शाब्दिक अर्थ ‘तुम्हारी आँखों के दृश्य/दिखाई देने के कारण’ है। हिन्दी में यह रूप दृश्य आकर्षण से बहकने की बात स्पष्ट करता है, पर मूल की नेत्र-दृष्टि संबंधी अभिव्यक्ति भी बनाए रखता है।
- source_word: וּלְשׁוֹמֵם
  choice: बरबाद न हो जाओ
  rationale: שמם उजड़ने, विनष्ट होने, स्तब्ध रह जाने या भयाक्रांत होने का भाव दे सकता है। प्रसंग में ‘बरबाद’ चेतावनी की तीव्रता और व्यक्ति पर आने वाले विनाश—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲחַר בֵּיתָהּ
  choice: उसके घर के पीछे पड़कर
  rationale: इब्रानी का शाब्दिक रूप ‘उसके घर के पीछे’ कठिन और संक्षिप्त है। ‘पीछे पड़कर’ संभावित पीछा या उसके घर-परिवार के चक्कर में पड़ने का संकेत देता है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: इब्रानी पाठ और उससे बहुत भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी को आधार बनाना और यूनानी पाठ को पादटिप्पणी में देना
  alternative: 'यूनानी के अनुसार: ‘किसी कुँवारी को ध्यान से न निहारो, कहीं ऐसा न हो कि उससे जुड़े दंडों/निन्दाओं के कारण तुम ठोकर खाओ।’'
  rationale: सिराख का विद्यमान इब्रानी साक्ष्य प्राथमिक है, लेकिन यूनानी में केवल शैलीगत नहीं बल्कि सारभूत भिन्नता है। इसलिए उसे छिपाने या दोनों को मिलाने के बजाय स्पष्ट रूप से पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘अपने को नीचा गिराना’ आत्मवाचक नैतिक चेतावनी व्यक्त करता है, जबकि ‘बरबाद हो जाना’ שמם की प्रबल विनाशात्मक छाया को साधारण पाठक के लिए स्वाभाविक रूप देता है। कठिन इब्रानी वाक्यांश को मुख्य पाठ में अत्यधिक शाब्दिक और अस्वाभाविक बनाने के बजाय संभावित अर्थ के साथ प्रस्तुत किया गया है, और वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
