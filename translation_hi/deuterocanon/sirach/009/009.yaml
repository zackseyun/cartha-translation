  yaml_path: translation/deuterocanon/sirach/009/009.yaml
  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: hi
  text: मनभावनी स्त्री से अपनी आँखें फेर ले[a], और उस सुंदरता को न निहार जो तेरी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “किसी दूसरे पुरुष की पत्नी के साथ बिलकुल भी न बैठ, और उसके साथ दाखरस न पी; कहीं ऐसा न हो कि तेरा मन उसकी ओर मुड़ जाए और तू अपनी आत्मा के द्वारा विनाश में फिसल पड़े।” यहाँ इब्रानी साक्ष्य अधिक संक्षिप्त और सामान्य है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: अपनी आँखें फेर ले
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘आँख छिपा लेना’ है, पर यहाँ इसका स्वाभाविक अर्थ अपनी दृष्टि हटा लेना है।
- source_word: אֵשֶׁת חֵן
  choice: मनभावनी स्त्री
  rationale: חֵן आकर्षण, मनोहरता या कृपा-सौंदर्य का भाव रखता है। ‘मनभावनी’ इसे अगली पंक्ति के स्पष्ट ‘सुंदरता’ से अलग रखते हुए सहज हिन्दी में व्यक्त करता है।
- source_word: תַּבִּיט
  choice: न निहार
  rationale: यह केवल एक क्षण देखने के बजाय ध्यान लगाकर या लगातार देखने की मनाही व्यक्त करता है।
- source_word: יֹפִי
  choice: सुंदरता
  rationale: यह इब्रानी संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לֹא לָךְ
  choice: जो तेरे लिए नहीं है
  rationale: इब्रानी पदबंध संक्षिप्त है और ‘तेरी नहीं’ तथा ‘तेरे लिए नहीं’ दोनों अर्थ दे सकता है। यह चयन स्वामित्व का कठोर दावा किए बिना नैतिक सीमा को व्यक्त करता है और मूल की कुछ अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: संक्षिप्त इब्रानी पाठ और विस्तृत यूनानी समानांतर का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुसरण करना और यूनानी विस्तार को पादटिप्पणी में देना
  alternative: यूनानी के अनुसार किसी दूसरे पुरुष की पत्नी के साथ बैठने और दाखमधु पीने की विस्तृत मनाही को मुख्य पाठ में रखना
  rationale: यहाँ इब्रानी साक्ष्य उपलब्ध, स्पष्ट और अधिक सामान्य है। यूनानी समानांतर विवाहित स्त्री के प्रसंग को स्पष्ट करता है, किंतु उस विस्तार को इब्रानी मुख्य पाठ में मिलाना मूल पाठों के वास्तविक अंतर को मिटा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन संबोधन में ‘तेरे/ले’ रखा गया है, जो इस ज्ञानोपदेश की सीधी व्यक्तिगत चेतावनी को बनाए रखता है।
