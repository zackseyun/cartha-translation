base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/007.yaml
  text: Do not gaze at a virgin[b][a], lest you be ensnared by the penalties concerning her.
translation:
  language: hi
  text: किसी कुँवारी को टकटकी लगाकर मत देखो,[a] कहीं ऐसा न हो कि तुम उससे जुड़े दंडों में फँस जाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “नगर की गलियों में इधर-उधर मत देखो, और उसके सुनसान स्थानों में मत भटको।” उपलब्ध इब्रानी और यूनानी पाठ-साक्ष्य यहाँ एक-दूसरे से बहुत भिन्न हैं।'
    reason: alternative_reading
  - marker: b
    text: या “कहीं ऐसा न हो कि तुम उससे संबंधित दंडों के कारण फँस जाओ।” इब्रानी वाक्यांश संक्षिप्त है और संभवतः उससे संबंध रखने के परिणामों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: किसी कुँवारी को
  rationale: בְּתוּלָה सामान्यतः कुँवारी अथवा अविवाहित युवती को दर्शाता है। ‘कुँवारी’ मूल की विशिष्टता बनाए रखता है।
- source_word: אַל תִּתְבּוֹנֵן
  choice: टकटकी लगाकर मत देखो
  rationale: हित्पोलेल रूप ध्यानपूर्वक या देर तक देखते रहने का भाव देता है, केवल आकस्मिक दृष्टि डालने का नहीं।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह संभावित अनिष्ट परिणाम की चेतावनी प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִּוָּקֵש
  choice: फंदे में फँस जाओ
  rationale: संदर्भ में क्रिया पकड़े या फँसाए जाने का भाव देती है; ‘फंदे में फँसना’ ज्ञान-साहित्य की चेतावनी की चित्रात्मक शक्ति को व्यक्त करता है।
- source_word: בַּעֲנָשֶׁיהָ
  choice: उससे जुड़े दंडों के
  rationale: עֹנֶשׁ दंड अथवा दंडात्मक परिणाम को दर्शाता है और स्त्रीलिंग प्रत्यय ‘उसके/उससे जुड़े’ का संकेत देता है। यह चयन इस संक्षिप्त इब्रानी वाक्यांश का संबंध अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μὴ περιβλέπου ἐν ῥύμαις πόλεως, καὶ ἐν ταῖς ἐρήμοις αὐτῆς μὴ πλανῶ
  choice: मुख्य अनुवाद को अतिव्याख्यायित करने से रोकने हेतु तुलनात्मक पाठ
  rationale: यूनानी पाठ नगर की गलियों और सुनसान स्थानों की बात करता है और उपलब्ध इब्रानी से बहुत भिन्न है। इसलिए मुख्य पाठ इब्रानी से अनूदित है और यूनानी पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: उपलब्ध इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में इब्रानी का अनुवाद और पादटिप्पणी में यूनानी वैकल्पिक पाठ
  alternative: यूनानी पाठ को मुख्य पाठ बनाना, अथवा दोनों पाठों को मिलाकर सामान्यीकृत चेतावनी बनाना
  rationale: इब्रानी साक्ष्य उच्च-विश्वास वाला है; दोनों परंपराओं को मिलाने से वास्तविक पाठांतर छिप जाएगा।
- issue: स्त्रीलिंग प्रत्यय सहित ‘दंडों’ का अस्पष्ट संबंध
  choice: ‘उससे जुड़े दंडों’ द्वारा संबंध की अस्पष्टता बनाए रखना
  alternative: ‘उसके दंड’ कहना, जिससे यह अर्थ निकल सकता है कि दंड केवल उसी स्त्री को मिलता है
  rationale: इब्रानी वाक्यांश संक्षिप्त है और संभवतः उससे संबंध रखने के दंडात्मक परिणामों की ओर संकेत करता है; अनुवाद को इससे अधिक निश्चित नहीं होना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज भाषा रखी गई है। ‘टकटकी लगाकर’ दीर्घ और उद्देश्यपूर्ण दृष्टि को स्पष्ट करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न क्रमशः [a] और [b] उपस्थित हैं।
