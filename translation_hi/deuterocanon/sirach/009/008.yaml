base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/008.yaml
  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
translation:
  language: hi
  text: अपने-आपको किसी वेश्या को मत सौंपो, कहीं ऐसा न हो कि तुम अपनी विरासत गँवा बैठो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “सुन्दर स्त्री से अपनी आँख फेर ले और पराई स्त्री की सुन्दरता को ध्यान से मत निहार; क्योंकि स्त्री की सुन्दरता के कारण बहुत-से लोग भटक गए हैं, और उसी से प्रेम आग के समान भड़क उठता है।” यहाँ यूनानी साक्षी उपलब्ध हिब्रू पाठ से काफी अधिक विस्तृत और भिन्न है।'
    reason: alternative_reading
  - marker: b
    text: “विरासत” से पैतृक संपत्ति, जायदाद या विरासत में मिला भाग अभिप्रेत हो सकता है। हिब्रू क्रिया में उसे अपने से दूर कर देने या परिणामतः गँवा देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: मत सौंपो
  rationale: निषेधात्मक आज्ञा के साथ נתן का मूल अर्थ ‘देना’ है; इस संदर्भ में ‘सौंपना’ अपने को किसी के वश में कर देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְזוֹנָה
  choice: किसी वेश्या को
  rationale: זוֹנָה का विशिष्ट अर्थ वेश्या है। यह आधुनिक हिन्दी में स्पष्ट और मूल से अधिक व्यापक नैतिक श्रेणी बनाए बिना सटीक है।
- source_word: נַפְשְׁךָ
  choice: अपना आप
  rationale: נפש यहाँ केवल अमूर्त ‘आत्मा’ नहीं, बल्कि संपूर्ण व्यक्ति या स्वयं को सूचित करता है। ‘अपना आप’ इस समग्र और आत्मसमर्पणकारी अर्थ को बनाए रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: פן किसी अवांछित परिणाम की चेतावनी देता है; यह हिन्दी प्रयोग उसके आशंकासूचक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָּסֵב
  choice: गँवा बैठो
  rationale: इस रूप का सटीक सूक्ष्म अर्थ अनिश्चित है, पर संदर्भ में अपनी संपत्ति या पैतृक भाग को मोड़ देने, हाथ से निकल जाने देने या खो देने का परिणाम है। ‘गँवा बैठो’ चेतावनी को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अनिश्चितता बताती है।
- source_word: נַחֲלָתֶךָ
  choice: अपनी विरासत
  rationale: נחלה विरासत, पैतृक संपत्ति या मिला हुआ भाग हो सकता है। ‘विरासत’ इस अर्थ-व्याप्ति को सर्वाधिक संक्षेप में सुरक्षित रखती है।
theological_decisions:
- issue: जीवित हिब्रू पाठ और उससे काफी भिन्न तथा अधिक विस्तृत यूनानी पाठ के बीच चुनाव
  choice: मुख्य पाठ में उपलब्ध हिब्रू साक्ष्य का अनुवाद
  alternative: 'यूनानी पाठ को मुख्य बनाना: ‘सुन्दर स्त्री से अपनी आँख फेर ले...’'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी साक्षी संभवतः अलग या विस्तृत पाठ-परंपरा दर्शाता है; इसलिए उसे मुख्य पंक्ति में मिलाकर दोनों पाठों का तनाव मिटाने के बजाय पादटिप्पणी में पूरा बताया गया है।
- issue: विरासत खोने की क्रिया का अर्थ
  choice: गँवा बैठो
  alternative: मोड़ दो / अपने से दूर कर दो
  rationale: हिब्रू क्रिया में ‘मोड़ने’ या ‘हटा देने’ का आधारभूत भाव संभव है, किंतु यहाँ परिणामतः विरासत हाथ से निकलने की चेतावनी है। सहज हिन्दी चुनी गई है और शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वेश्या’ सटीक और प्रचलित है; ‘अपना आप ... मत सौंपो’ मूल के נפש और נתן की संयुक्त अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है। मुख्य पाठ संक्षिप्त हिब्रू चेतावनी का अनुसरण करता है, जबकि पाठांतर और क्रियार्थ की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
