translation:
  language: hi
  text: किसी ऐसे मनुष्य से बहुत दूर रहो, जिसे मार डालने का अधिकार है, और तुम्हें मृत्यु का भय नहीं सताएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
