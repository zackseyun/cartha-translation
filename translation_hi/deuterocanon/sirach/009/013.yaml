    text: 'उपलब्ध इब्रानी साक्ष्य में यहाँ एक भिन्न कहावत है: “किसी पुराने मित्र को मत छोड़ो, क्योंकि नया मित्र उसके समान नहीं होगा।” मुख्य पाठ यूनानी परंपरा के अनुसार है।'
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: बहुत दूर रहो
  rationale: यह आज्ञा जान-बूझकर दूरी बनाए रखने को कहती है; यह हिंदी में स्वाभाविक और बलयुक्त है।
- source_word: ἀπὸ ἀνθρώπου
  choice: जिस मनुष्य ... उससे
  rationale: यूनानी में एकवचन व्यक्ति का उल्लेख है; संबंधवाचक रचना हिंदी में सहज है।
- source_word: ὃς ἔχει ἐξουσίαν τοῦ φονεῦσαι
  choice: जिस मनुष्य को मार डालने का अधिकार है
  rationale: ἐξουσία सामाजिक या वैधानिक अधिकार/सत्ता को सूचित कर सकता है, जबकि φονεῦσαι प्राण लेने की क्रिया बताता है; 'अधिकार' और 'मार डालने' से दोनों तत्व सुरक्षित रहते हैं।
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς φόβον θανάτου
  choice: तब तुम्हें मृत्यु के भय की आशंका नहीं रहेगी
  rationale: ὑποπτεύω का शाब्दिक क्षेत्र संदेह या आशंका करना है। यह अनुवाद 'भय' को केवल क्रिया में समाहित करने के बजाय मूल पदबंध φόβον θανάτου को स्पष्ट रखता है।
theological_decisions:
- issue: विद्यमान इब्रानी पाठ और यूनानी परंपरा में पूर्णतः भिन्न कथन
  choice: मुख्य पाठ में इस पद से संबद्ध यूनानी पाठ का अनुवाद
  alternative: किसी पुराने मित्र को मत छोड़ो, क्योंकि नया मित्र उसके समान नहीं होगा।
  rationale: दिए गए स्रोत में इब्रानी साक्ष्य को इस संदर्भ के लिए major_mismatch चिह्नित किया गया है, जबकि यूनानी पाठ स्पष्टतः सिराख 9:13 के रूप में संबद्ध है। पाठ-भेद को छिपाने के बजाय इब्रानी कथन पादटिप्पणी में पूरा दिया गया है।
