base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: hi
  text: पुराने मित्र को मत छोड़ो, क्योंकि नया मित्र उसके बराबर नहीं होता। नया मित्र नए दाखरस के समान है—जब वह पुराना हो जाएगा, तब तुम उसे आनंद से पियोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिया गया इब्रानी वाक्य किसी दूसरे कथन का प्रतीत होता है और सिराख 9:10 से मेल नहीं खाता; इसलिए इस पद का अनुवाद यूनानी पाठ-साक्ष्य के आधार पर किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: मत छोड़ो
  rationale: यह संबंध तोड़ देने या साथ छोड़ देने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φίλον ἀρχαῖον
  choice: पुराने मित्र
  rationale: यहाँ ἀρχαῖον का अर्थ प्राचीन नहीं, बल्कि बहुत समय से बने हुए संबंध से है; ‘पुराना मित्र’ आगे के ‘नए मित्र’ के साथ स्पष्ट विरोध भी बनाए रखता है।
- source_word: πρόσφατος
  choice: नया मित्र
  rationale: पुराने मित्र और नई दाखमधु के साथ तुलना के कारण सामान्य ‘नया’ सबसे उपयुक्त है।
- source_word: οὐκ ἔστιν ἔφισος αὐτῷ
  choice: उसके बराबर नहीं होता
  rationale: यह यूनानी पदबंध की तुलनात्मक शक्ति को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: οἶνος νέος φίλος νέος
  choice: नया मित्र नई दाखमधु के समान है
  rationale: यूनानी में संक्षिप्त लोकोक्तिपरक समानाधिकरण है; हिन्दी में ‘के समान है’ जोड़ने से निहित उपमा स्पष्ट और स्वाभाविक बनती है।
- source_word: ἐὰν παλαιωθῇ
  choice: जब वह पुरानी हो जाएगी
  rationale: कहावत के सामान्य भाव में शर्त परिणाम की अपेक्षा समय-संबंधी अर्थ देती है; स्त्रीलिंग ‘वह’ का निकटतम संदर्भ दाखमधु है।
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: तुम उसे आनन्द से पियोगे
  rationale: यह भविष्यकाल और εὐφροσύνη के हर्षपूर्ण भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस पद के लिए प्राथमिक पाठ-साक्ष्य का चयन
  choice: दिए गए यूनानी समानांतर साक्ष्य से अनुवाद
  alternative: दिए गए असंगत इब्रानी वाक्य को सिराख 9:10 मानकर अनुवाद करना
  rationale: प्रदत्त इब्रानी पंक्ति स्त्री के सौन्दर्य से विनाश के विषय में है और इस पद की यूनानी विषयवस्तु से मेल नहीं खाती। यूनानी साक्ष्य सिराख 9:10 की संगत और सुविदित पाठ-वस्तु देता है; इसलिए स्रोत-अनिश्चितता को पादटिप्पणी में स्पष्ट करते हुए उसी का अनुसरण किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और लोकोक्तिपरक शैली। ‘दाखमधु’ से मदिरा और दाख के संबंध को स्पष्ट रखा गया है।
