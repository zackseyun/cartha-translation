base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/014.yaml
  text: New wine[a], a new friend; when it grows old[b], you may drink it with pleasure.
translation:
  language: hi
  text: नया दाखरस[a], नया मित्र; जब वह पुराना हो जाए, बाद में शायद तुम उसे पियोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का इब्रानी पाठ कहावत-जैसा है, पर उसका अंतिम खंड पाठगत रूप से कठिन है। उपलब्ध यूनानी समानांतर इससे बहुत भिन्न है: उसमें फंदों के बीच से गुजरने और नगर की प्राचीरों पर चलने की चेतावनी दी गई है। यहाँ उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया है।'
    reason: textual_variant
  - marker: b
    text: 'अधिक शब्दशः: “नया दाखरस, नया मित्र; और पुराना—बाद में शायद तुम उसे पियोगे।” आशय संभवतः यह है कि मित्रता भी दाखरस की तरह समय के साथ परिपक्व होती है; फिर भी इब्रानी के अंतिम शब्दरूप का सर्वनामिक संकेत अनिश्चित है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: नई दाखमधु
  rationale: יַיִן का अर्थ दाखमधु और חָדָשׁ का अर्थ नया है। स्त्रीलिंग ‘नई’ मानक हिन्दी में ‘दाखमधु’ के साथ स्वाभाविक है और कहावत में पुरानी होने की छवि बनाए रखता है।
- source_word: אוֹהֵב חָדָשׁ
  choice: नया मित्र
  rationale: प्राप्त इब्रानी पाठ संक्षिप्त और व्याकरण की दृष्टि से कठिन है। कहावत की समानांतर रचना में इसे संज्ञात्मक रूप से ‘नया मित्र’ समझना सबसे संगत है।
- source_word: וְיָשָׁן
  choice: जब वह पुराना हो जाए
  rationale: יָשָׁן का मूल अर्थ ‘पुराना’ है। ‘हो जाए’ समय के साथ परिपक्व होने की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि सर्वनाम की संदर्भगत द्व्यर्थता को बनाए रखता है।
- source_word: אַחַר אוּלַי
  choice: तब शायद
  rationale: शब्दशः अर्थ ‘बाद में, शायद’ है। ‘तब शायद’ इब्रानी की कालगत और संभावनात्मक अनिश्चितता दोनों को सुरक्षित रखता है।
- source_word: תִּשְׁתֶּינוּ
  choice: तुम उसे आनंद से पियोगे
  rationale: क्रिया का आशय पीने से है, पर प्राप्त रूप का सर्वनामिक प्रत्यय कठिन या विकृत प्रतीत होता है। सन्दर्भ वृद्ध दाखमधु का आनंद लेने की ओर संकेत करता है; इसलिए भाव स्पष्ट किया गया है, और पाठगत कठिनाई पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: उपलब्ध इब्रानी कहावत का अनुवाद
  alternative: फंदों और नगर की प्राचीरों के बीच चलने की यूनानी चेतावनी का अनुवाद
  rationale: इस स्थान पर इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। दिए गए यूनानी समानांतर में पूरी तरह भिन्न पाठ है; इस भिन्नता को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: दाखमधु और मित्र के बीच तुलना का संबंध
  choice: ‘के समान’ जोड़कर संक्षिप्त उपमा को स्पष्ट करना
  alternative: 'खंडित शब्दशः रूप: ‘नई दाखमधु, नया मित्र’'
  rationale: इब्रानी कथन अंडाकार और कहावत-जैसा है। ‘के समान’ कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता, बल्कि निहित तुलना को साधारण हिन्दी में बोधगम्य बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कहावती स्वर रखा गया है। ‘दाखमधु’ बाइबलीय सन्दर्भ में स्पष्ट है; ‘मदिरा’ की अपेक्षा यह मूल की अंगूरी दाखमधु को अधिक ठीक व्यक्त करता है। मुख्य पाठ में इब्रानी की ‘शायद’ वाली अनिश्चितता और सर्वनाम ‘वह/उसे’ की संभावित संदर्भ-द्व्यर्थता सुरक्षित रखी गई है।
