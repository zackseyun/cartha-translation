translation:
  language: hi
  text: और यदि तुम निकट जाओ, तो दोषी न ठहरोगे—कहीं ऐसा न हो कि वह तुम्हारा प्राण ले ले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में यहाँ एक सर्वथा भिन्न उक्ति है: “कारीगरों के हाथों में किसी कृति की प्रशंसा होगी, और प्रजा का शासक अपनी वाणी में बुद्धिमान होता है।” उपलब्ध काहाना हिब्रू पाठ और यूनानी पाठ में गहरा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם קָרַבְתָּ
  choice: और यदि तुम निकट जाओ
  rationale: קָרַבְתָּ का मूल अर्थ किसी व्यक्ति या वस्तु के निकट जाना है। शर्तसूचक אִם को स्पष्ट रखते हुए हिन्दी में स्वाभाविक शर्त-वाक्य बनाया गया है।
- source_word: לֹא תֶאְשָׁם
  choice: तो दोषी न ठहरोगे
  rationale: אָשַׁם दोषी होने या दोषी ठहरने का भाव देता है। हिब्रू रूप को निषेधात्मक आज्ञा में बदलने के बजाय उसके सामान्य अपूर्ण/भावी कथन का रूप सुरक्षित रखा गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंका या अवांछित परिणाम प्रकट करने वाला सामान्य हिन्दी प्रयोग है और פֶּן की चेतावनीपूर्ण शक्ति बनाए रखता है।
- source_word: תִּקַּח אֶת נִשְׁמָתֶךָ
  choice: वह तुम्हारा प्राण ले ले
  rationale: תִּקַּח को प्रसंग में स्त्रीलिंग एकवचन कर्ता के रूप में समझा गया है; हिब्रू पंक्ति कर्ता का नाम नहीं बताती, इसलिए हिन्दी में केवल ‘वह’ रखा गया है। נְשָׁמָה यहाँ जीवन/प्राण के अर्थ में है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठ-साक्ष्यों में तीव्र भिन्नता
  choice: उपलब्ध उच्च-विश्वास वाले हिब्रू पाठ को मुख्य पाठ बनाया गया है।
  alternative: 'यूनानी पाठ का अनुवाद मुख्य पाठ बनाया जा सकता है: ‘कारीगरों के हाथों में किसी कृति की प्रशंसा होगी, और प्रजा का शासक अपनी वाणी में बुद्धिमान होता है।’'
  rationale: निर्देशानुसार मूल-भाषा के उपलब्ध हिब्रू साक्ष्य को प्राथमिकता दी गई है। दोनों साक्ष्य एक ही कथन के छोटे पाठांतर नहीं, बल्कि सर्वथा भिन्न उक्तियाँ देते हैं; इसलिए यूनानी को चुपचाप मिलाने के बजाय पादटिप्पणी में पूरा वैकल्पिक पाठ दिया गया है।
- issue: תִּקַּח के कर्ता की अस्पष्टता
  choice: स्त्रीलिंग ‘वह’ रखा गया है, पर उसकी पहचान नहीं जोड़ी गई।
  alternative: इसे द्वितीय पुरुष मानकर ‘कहीं तुम अपना प्राण न ले लो’ अनुवाद किया जा सकता है।
  rationale: व्यंजनात्मक रूप द्वितीय पुरुष पुल्लिंग एकवचन अथवा तृतीय पुरुष स्त्रीलिंग एकवचन हो सकता है। वाक्य के अर्थ में दूसरे व्यक्ति द्वारा जीवन ले लिए जाने की चेतावनी अधिक संगत है, किंतु उस व्यक्ति की पहचान हिब्रू पंक्ति में नहीं है; अतः अनावश्यक स्पष्टीकरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली रखी गई है। ‘प्राण ले ले’ सामान्य पाठक के लिए स्पष्ट है और נְשָׁמָה के जीवन-संबंधी अर्थ को व्यक्त करता है। हिब्रू में अज्ञात स्त्रीलिंग कर्ता को व्याख्यात्मक संज्ञा देकर निश्चित नहीं किया गया।
