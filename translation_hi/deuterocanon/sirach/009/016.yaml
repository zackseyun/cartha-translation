translation:
  language: hi
  text: तुम्हारा विचार-विमर्श समझदार लोगों के साथ हो, और तुम्हारी सारी बातचीत परमप्रधान की व्यवस्था के अनुसार हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वर्तमान काहिरा गनीज़ा के इब्रानी पाठ में इसके स्थान पर लिखा है: “फलते-फूलते उद्दंड व्यक्ति से ईर्ष्या न करना; याद रखो कि मृत्यु तक वह दण्ड से नहीं बचेगा।” यहाँ इब्रानी साक्ष्य किसी भिन्न या विस्थापित पंक्ति को दर्शाता जान पड़ता है; इसलिए मुख्य पाठ में यूनानी का अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: समझदार लोगों के साथ
  rationale: συνετοί ऐसे लोगों को दर्शाता है जिनमें समझ और विवेक है। यह अनुवाद लिंग का अनावश्यक निर्धारण किए बिना आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔστω ὁ διαλογισμός σου
  choice: तुम्हारा विचार-विमर्श ... हो
  rationale: διαλογισμός विचार, मनन या विचार-विमर्श को व्यक्त कर सकता है। साथ रहने वाले समझदार लोगों के संदर्भ में ‘विचार-विमर्श’ सामूहिक चिंतन का स्वाभाविक अर्थ देता है और ἔστω की आज्ञार्थक शक्ति बनाए रखता है।
- source_word: πᾶσα διήγησίς σου
  choice: तुम्हारी सारी बातचीत
  rationale: διήγησις कथन, वार्तालाप या प्रवचन को सूचित कर सकता है। ‘सारी बातचीत’ सामान्य वाणी के व्यापक आशय को सहज हिन्दी में व्यक्त करती है।
- source_word: ἐν νόμῳ Ὑψίστου
  choice: परमप्रधान की व्यवस्था के अनुसार
  rationale: Ὑψίστου के ईश्वरीय उपनाम के लिए ‘परमप्रधान’ और νόμος के लिए ‘व्यवस्था’ प्रचलित बाइबलीय पद हैं। यूनानी ἐν का अक्षरशः ‘में’ हिन्दी में अस्वाभाविक होता; ‘के अनुसार’ यह भाव स्पष्ट करता है कि बातचीत परमप्रधान की शिक्षा से नियंत्रित हो।
theological_decisions:
- issue: परस्पर भिन्न इब्रानी और यूनानी पाठों में मुख्य पाठ का चयन
  choice: मुख्य पाठ में यूनानी पंक्ति का अनुवाद और पादटिप्पणी में वर्तमान काहिरा गनीज़ा इब्रानी पाठ
  alternative: 'मुख्य पाठ में इब्रानी पंक्ति का अनुवाद: ‘फलते-फूलते उद्दंड व्यक्ति से ईर्ष्या न करना; याद रखो कि मृत्यु तक वह दण्ड से नहीं बचेगा।’'
  rationale: दिया गया इब्रानी पाठ इस पद के यूनानी पाठ से पूरी तरह भिन्न है और स्रोत-साक्ष्य में ‘major_mismatch’ चिह्नित है; सम्भव है कि वह किसी भिन्न या विस्थापित पंक्ति को सुरक्षित रखता हो। पद-संदर्भ से संगत यूनानी को मुख्य पाठ बनाते हुए इब्रानी साक्ष्य को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखना पाठगत तनाव को छिपाता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और लिंग-समावेशी रूप अपनाया गया है। ‘परमप्रधान’ और ‘व्यवस्था’ परिचित बाइबलीय शब्दावली रखते हैं; वाक्यरचना उपदेशात्मक है, पर अत्यधिक संस्कृतनिष्ठ नहीं।
