base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
translation:
  language: hi
  text: अपनी सामर्थ्य के अनुसार मित्र बना लो[a], और बुद्धिमानों की संगति करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी सामर्थ्य से मित्र प्राप्त करो।” इब्रानी में सामर्थ्य का अर्थ क्षमता या साधन भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है; यूनानी समानांतर अधिक विशिष्ट रूप से कहता है, “बुद्धिमानों से परामर्श करो।”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: अपनी सामर्थ्य के अनुसार
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘अपनी शक्ति में/से’ कहता है, पर यहाँ सामर्थ्य, क्षमता या साधनों की सीमा के अनुसार कार्य करने का भाव स्वाभाविक है; यूनानी κατὰ τὴν ἰσχύν σου भी इसी अर्थ का समर्थन करता है।
- source_word: קְנֵה
  choice: बना लो
  rationale: קנה का मूल अर्थ ‘प्राप्त करना/अर्जित करना’ है। मित्र के संदर्भ में आधुनिक हिन्दी में ‘मित्र बना लो’ संबंधपरक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और व्यापारिक खरीद का भ्रामक संकेत नहीं देता।
- source_word: רֵעֶךָ
  choice: मित्र
  rationale: רֵעַ का अर्थ मित्र, साथी या पड़ोसी हो सकता है। इस सूक्ति के संबंधपरक संदर्भ में ‘मित्र’ सर्वाधिक उपयुक्त है।
- source_word: וְעִם חֲכָמִים
  choice: और बुद्धिमानों की
  rationale: חֲכָמִים बुद्धिमान लोगों के वर्ग को दर्शाता है; ‘बुद्धिमानों’ से अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं होता।
- source_word: תִּסְתַּיָּד
  choice: संगति करो
  rationale: यह इब्रानी रूप दुर्लभ और अर्थ की दृष्टि से अनिश्चित है। संदर्भ में बुद्धिमानों से जुड़ने या उनके साथ रहने का व्यापक भाव सुरक्षित रखा गया है; यूनानी का अधिक विशिष्ट ‘परामर्श करो’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: חֲכָמִים का व्याकरणिक पुल्लिंग बहुवचन
  choice: बुद्धिमानों
  alternative: बुद्धिमान पुरुषों
  rationale: यहाँ शब्द किसी केवल-पुरुष समूह को स्पष्ट रूप से नहीं, बल्कि बुद्धिमान व्यक्तियों के सामान्य वर्ग को दर्शाता है; अतः हिन्दी में प्रतिनिधिक और स्वाभाविक रूप रखा गया है।
- issue: दुर्लभ क्रिया תִּסְתַּיָּד का अर्थ
  choice: संगति करो
  alternative: परामर्श करो
  rationale: इब्रानी की वास्तविक अनिश्चितता को किसी संकीर्ण अर्थ से हल नहीं किया गया। मुख्य पाठ व्यापक संबंधपरक भाव रखता है, जबकि यूनानी समानांतर का विशिष्ट अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण सूक्तिपरक रूप। ‘मित्र बना लो’ संबंध के संदर्भ में ‘अर्जित करो’ से अधिक स्वाभाविक है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
