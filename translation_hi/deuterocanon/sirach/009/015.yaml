  text: Do not envy a wicked man[a], for you do not know what his day will be.
translation:
  language: hi
  text: किसी दुष्ट मनुष्य से ईर्ष्या मत करो[a], क्योंकि तुम नहीं जानते कि उसका दिन कैसा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में यहाँ एक भिन्न उक्ति है: “अपनी सामर्थ्य के अनुसार अपने पड़ोसियों पर ध्यान दो, और बुद्धिमानों से परामर्श करो।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: ईर्ष्या मत करो
  rationale: निषेध के साथ קנא यहाँ किसी दूसरे व्यक्ति से ईर्ष्या करने का स्वाभाविक अर्थ देता है। यह हिन्दी में संक्षिप्त और सहज है।
- source_word: בְּאִישׁ רָשָׁע
  choice: किसी दुष्ट मनुष्य से
  rationale: אישׁ एकवचन और पुल्लिंग है, जबकि רשע ज्ञान-साहित्य में नैतिक दुष्टता बताता है। 'दुष्ट मनुष्य' स्रोत की व्याकरणिक और नैतिक विशिष्टता बनाए रखता है।
- source_word: כִּי לֹא תֵּדֵע
  choice: क्योंकि तुम नहीं जानते
  rationale: כִּי निषेध का कारण देता है; 'क्योंकि' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מַה יּוֹמוֹ
  choice: उसका दिन कैसा होगा
  rationale: इब्रानी का शाब्दिक रूप 'उसका दिन क्या/कैसा होगा' संक्षिप्त और अर्थ की दृष्टि से खुला है। यह अनुवाद 'दिन' की छवि और मूल अस्पष्टता को बनाए रखता है तथा 'क्या लाएगा' या 'उसका अंत' जैसी अतिरिक्त धारणाएँ नहीं जोड़ता।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में अंतर
  choice: उपलब्ध इब्रानी पाठ को मुख्य पाठ में अनूदित करना और यूनानी के भिन्न कथन को पाद-टिप्पणी में देना
  alternative: “अपनी सामर्थ्य के अनुसार अपने पड़ोसियों पर ध्यान दो, और बुद्धिमानों से परामर्श करो।”
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वास वाला है। यूनानी पंक्ति इसका निकट अनुवाद नहीं, बल्कि एक बिलकुल अलग उक्ति है; इसलिए उसे मुख्य पाठ में मिलाने के बजाय पाठांतर के रूप में स्पष्ट करना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञानोक्ति। 'उसका दिन कैसा होगा' मूल इब्रानी की असामान्य संक्षिप्तता और संभावित परिणाम के बारे में उसकी खुली हुई अभिव्यक्ति को सुरक्षित रखता है।
