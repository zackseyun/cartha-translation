translation:
  language: hi
  text: वेश्या की संगति मत करना, कहीं ऐसा न हो कि तुम उसकी लुभावनी चालों में फँस जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम हिब्रू पद का अर्थ कठिन है। इसका शाब्दिक संबंध ‘लेने’ या ‘प्राप्त करने’ से हो सकता है; यूनानी समानांतर में ‘उसकी चालों/उपायों में’ है। इसलिए यहाँ ‘उसकी लुभावनी चालों में’ अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם זוֹנָה
  choice: वेश्या की संगति
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर निषेध के इस संदर्भ में यह साथ रहने या मेल-जोल रखने का भाव देता है। זוֹנָה के लिए आधुनिक और स्पष्ट हिन्दी शब्द ‘वेश्या’ चुना गया है।
- source_word: אַל תִּסְתַּיֵּד
  choice: मत करना
  rationale: दुर्लभ हिब्रू क्रिया को עִם זוֹנָה के साथ मिलाकर ‘संगति मत करना’ के रूप में व्यक्त किया गया है। यूनानी समानांतर भी लगातार साथ रहने या मेल-जोल बढ़ाने से मना करता है।
- source_word: פֶּן תִּלָּכֵד
  choice: कहीं ऐसा न हो कि तुम … फँस जाओ
  rationale: פֶּן अनिष्टकारी परिणाम की आशंका प्रकट करता है और תִּלָּכֵד जाल में पकड़े जाने का बिंब रखता है। यह हिन्दी रूप दोनों भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּלִקְחֹתֶיהָ
  choice: उसकी लुभावनी चालों में
  rationale: हिब्रू पद कठिन और अर्थ की दृष्टि से अनिश्चित है। यूनानी ἐν τοῖς ἐπιχειρήμασιν αὐτῆς ‘उसके उपायों/चालों में’ का समर्थन करता है; प्रसंग में ‘लुभावनी चालों’ से प्रलोभन और युक्ति दोनों भाव बने रहते हैं।
theological_decisions:
- issue: कठिन अंतिम हिब्रू पद की व्याख्या में यूनानी समानांतर का उपयोग
  choice: हिब्रू को मुख्य आधार रखते हुए ‘उसकी लुभावनी चालों में’
  alternative: ‘उसकी कमाई से’, ‘उसके फंदों में’, या ‘उसकी योजनाओं में’
  rationale: हिब्रू पाठ उपलब्ध होने के कारण वही प्राथमिक है, किंतु בְּלִקְחֹתֶיהָ का सटीक अर्थ अनिश्चित है। यूनानी समानांतर युक्तियों या प्रयासों का अर्थ सुझाता है। चुना हुआ पाठ संदर्भगत चेतावनी को स्पष्ट करता है, जबकि पादटिप्पणी अनिश्चितता को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संगति मत करना’ निरंतर मेल-जोल की चेतावनी देता है, और ‘फँस जाओ’ मूल के जाल में पकड़े जाने वाले बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
