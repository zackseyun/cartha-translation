    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: के पास मत जाना
  rationale: निषेधात्मक इब्रानी अभिव्यक्ति निकट जाने या संबंध बढ़ाने से रोकती है। यह आधुनिक हिन्दी में स्वाभाविक है और यूनानी समानांतर के आशय से भी मेल खाती है।
- source_word: אִשָּׁה זָרָה
  choice: पराई स्त्री
  rationale: शाब्दिक अर्थ ‘पराई/विदेशी स्त्री’ है, पर ज्ञान-साहित्य में यह प्रायः उचित वैवाहिक या नैतिक सीमाओं से बाहर की स्त्री को सूचित करता है। ‘पराई स्त्री’ मूल की अस्पष्टता को ‘व्यभिचारिणी’ या ‘वेश्या’ जैसे अधिक विशिष्ट शब्दों से संकुचित नहीं करती।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अनचाहे परिणाम की चेतावनी प्रस्तुत करता है और हिन्दी में स्पष्ट तथा लोकोक्तिपरक है।
- source_word: תִּפּוֹל בִּמְצוּדֹתֶיהָ
  choice: तुम उसके फंदों में फँस जाओ
  rationale: मूल में शाब्दिक रूप से ‘उसके फंदों में गिरो’ है। हिन्दी में ‘फंदों में फँसना’ इसी शिकार-संबंधी रूपक को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: ‘पराई स्त्री’ का ज्ञान-साहित्य संबंधी अर्थ
  choice: मुख्य पाठ में ‘पराई स्त्री’ रखकर नैतिक और वैवाहिक सीमा से बाहर होने का संकेत देना
  alternative: विदेशी स्त्री; अनैतिक स्त्री; वेश्या
  rationale: इब्रानी זָרָה केवल जातीय विदेशिता तक सीमित नहीं है, जबकि यूनानी समानांतर अनुचित यौन-संबंध की दिशा में संकेत करता है। ‘पराई स्त्री’ दोनों संभावनाओं को खुला रखती है और मूल से अधिक विशिष्ट आरोप नहीं लगाती।
