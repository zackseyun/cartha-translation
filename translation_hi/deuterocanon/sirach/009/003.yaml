  verdict: approve
  source_fidelity: “पराई स्त्री के पास मत जाना” faithfully renders אַל תִּקְרַב אֶל אִשָּׁה זָרָה. “पराई” appropriately retains the Hebrew term’s contextual breadth—someone outside proper relational bounds—without limiting it to ethnicity or making the unsupported specific claim that she is a prostitute. “कहीं ऐसा न हो कि तुम उसके फंदों में फँस जाओ” naturally conveys the warning introduced by פֶּן and preserves the trap/snares imagery of בִּמְצוּדֹתֶיהָ. Although Hebrew literally says “fall,” “फंदों में फँस जाना” is an idiomatic Hindi preservation of the intended metaphor, supported by the Greek parallel.
  naturalness: The Hindi is modern, clear, concise, and suitably proverbial in register. “कहीं ऐसा न हो कि” is natural for a cautionary consequence, and the second-person singular/plural-neutral “तुम” is appropriate here.
  terminology: “पराई स्त्री” is the best main-text choice among the available Hindi options. It avoids the misleadingly ethnic-only sense that “विदेशी स्त्री” may carry while not over-interpreting the phrase as “अनैतिक स्त्री” or “वेश्या.” The footnote responsibly records “विदेशी स्त्री” and explains the wisdom-literature context and Greek parallel. The footnote anchor is correctly placed immediately after the relevant expression.
