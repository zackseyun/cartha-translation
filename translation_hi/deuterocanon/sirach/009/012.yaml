  text: Lest your heart turn aside to them, and in blood you be brought down to the Pit.
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम्हारा मन उसकी ओर झुक जाए, और तुम रक्तपात[a] में गर्त की ओर झुक जाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खून में”; इसका अर्थ रक्तपात या रक्त-दोष भी हो सकता है।
    reason: हिब्रू बहुवचन דמים की अर्थ-सीमा को स्पष्ट करता है और ‘में’ के खुले संबंध को बनाए रखता है।
  - marker: b
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “दुष्टों की समृद्धि से प्रसन्न न हो; याद रख कि वे अधोलोक तक निर्दोष नहीं ठहरेंगे।”'
    reason: प्रमुख प्राचीन समानांतर पाठ हिब्रू से उल्लेखनीय रूप से अलग है; पाठगत पारदर्शिता के लिए इसे दर्ज करना आवश्यक है।
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: उसकी ओर
  rationale: हिब्रू रूप स्त्रीलिंग एकवचन है। संदर्भ अस्पष्ट होने पर भी उसके वचन और संकेत को बदलकर बहुवचन नहीं किया गया।
- source_word: לֵב
  choice: तुम्हारा मन
  rationale: हिब्रू में शाब्दिक अर्थ ‘हृदय’ है; यहाँ इच्छा और आंतरिक झुकाव के अर्थ में आधुनिक हिन्दी का ‘मन’ स्वाभाविक है।
- source_word: וּבְדָמִים
  choice: और रक्तपात के कारण
  rationale: דמים का शाब्दिक रूप ‘खून/रक्त’ का बहुवचन है और यह प्रायः रक्तपात या रक्त-दोष को सूचित करता है; कारणसूचक अर्थ इस चेतावनी के प्रवाह में स्वाभाविक है।
- source_word: שָׁחַת
  choice: विनाश का गर्त
  rationale: शब्द ‘गड्ढा’, ‘गर्त’ या ‘विनाश’ का बोध करा सकता है। संयुक्त अभिव्यक्ति स्थान और विनाश—दोनों अर्थछायाएँ बचाती है।
- source_word: תִּטֶּה
  choice: मुड़ जाओ
  rationale: यह क्रिया झुकने या मुड़ने का सक्रिय भाव रखती है; इसलिए हिब्रू के अनुसार कर्ता को सक्रिय रखा गया है, न कि अंग्रेज़ी परामर्श-पाठ की तरह निष्क्रिय ‘गिरा दिए जाओ’।
theological_decisions:
- issue: שחת को अंतिम दण्ड या मृतकों के लोक के रूप में निश्चित करना
  choice: विनाश का गर्त
  alternative: अधोलोक
  rationale: हिब्रू शब्द अपने आप में किसी एक विकसित परलोक-सिद्धान्त को अनिवार्य नहीं करता; अनुवाद उसकी स्थानगत और विनाशकारी अस्पष्टता को बनाए रखता है।
- issue: אֵלֶיהָ के स्त्रीलिंग एकवचन को बहुवचन बनाना
  choice: उसकी ओर
  alternative: उनकी ओर
  rationale: उपलब्ध हिब्रू पाठ स्पष्ट रूप से स्त्रीलिंग एकवचन है। अस्पष्ट पूर्वपद के कारण मूल व्याकरण को बदलना उचित नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘मन’, ‘रक्तपात’ और ‘विनाश का गर्त’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि हिब्रू की चेतावनी, पुनरुक्त गति और अर्थगत तनाव सुरक्षित रहते हैं।
