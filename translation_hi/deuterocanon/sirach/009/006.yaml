  yaml_path: translation/deuterocanon/sirach/009/006.yaml
  text: Do not associate with singing women[a], lest they burn you with their mouths.
translation:
  language: hi
  text: गाने वाली स्त्रियों की संगति मत करना[a], कहीं ऐसा न हो कि वे अपने मुँह से तुम्हें जला दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “अपना प्राण वेश्याओं को न देना, कहीं ऐसा न हो कि तुम अपनी विरासत खो बैठो।” जहाँ हिब्रू में “गाने वाली स्त्रियों” और उनके “मुँह” से जलाए जाने की बात है, वहाँ यूनानी पाठ यौन-संबंधी नैतिक चेतावनी को स्पष्ट रूप से व्यक्त करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: गानेवाली स्त्रियों की
  rationale: עִם संगति का सम्बन्ध बताता है और מְנַגְּנוֹת स्त्रीलिंग बहुवचन में संगीत प्रस्तुत करनेवाली स्त्रियों को दर्शाता है। ‘गानेवाली स्त्रियाँ’ हिब्रू की ठोस छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַל תִּדְמוֹךְ
  choice: संगति न करना
  rationale: निषेध के साथ आया यह कुछ दुर्लभ क्रियारूप निकट मेल-जोल या सम्बन्ध रखने की चेतावनी देता है। ‘संगति न करना’ सम्भावित सामाजिक और घनिष्ठ दोनों अर्थों को खुला रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित नकारात्मक परिणाम को व्यक्त करने का स्वाभाविक हिन्दी रूप है।
- source_word: יִשְׂרְפֻךָ
  choice: वे ... तुम्हें जला डालें
  rationale: क्रिया का कर्ता पूर्ववर्ती स्त्रीलिंग बहुवचन संज्ञा है। सक्रिय हिन्दी हिब्रू की व्याकरणिक संरचना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है, जबकि जलाने का रूपक अक्षुण्ण रहता है।
- source_word: בְּפִיפִיֹתָם
  choice: अपने मुँह से
  rationale: यह असामान्य रूप ‘मुँह’ से सम्बन्धित है और साधन का भाव देता है। इसे ‘बातों’ या ‘गीतों’ के रूप में स्पष्ट कर देना हिब्रू की सजीव और कुछ रहस्यमय छवि को अनावश्यक रूप से सीमित कर देता।
theological_decisions:
- issue: हिब्रू और यूनानी पाठ-साक्ष्यों में अन्तर
  choice: मुख्य पाठ में उपलब्ध हिब्रू का अनुवाद किया गया है और यूनानी पाठ को पाद-टिप्पणी में रखा गया है।
  alternative: “अपना प्राण वेश्याओं को न देना, कहीं ऐसा न हो कि तुम अपनी विरासत खो बैठो।”
  rationale: यहाँ हिब्रू पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए वही प्राथमिक है। यूनानी पाठ यौन-नैतिक चेतावनी को स्पष्ट करता है, पर उसके शब्द और परिणाम हिब्रू से इतने अलग हैं कि उसे मुख्य पाठ में मिलाना वास्तविक पाठान्तर को छिपा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘गानेवाली स्त्रियाँ’ और ‘अपने मुँह से ... जला डालें’ हिब्रू की ठोस उपमाओं को बनाए रखते हैं; ‘संगति न करना’ दुर्लभ क्रिया के सामाजिक अथवा घनिष्ठ सम्बन्ध—दोनों सम्भव अर्थों को समय से पहले निश्चित नहीं करता।
