translation:
  language: hi
  text: मार डालने की शक्ति रखने वाले मनुष्य से दूर रहो[a], और मृत्यु के आतंक से मत डरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में यहाँ एक बहुत भिन्न उक्ति है: “धर्मी पुरुष तुम्हारे साथ भोजन करने वाले हों, और तुम्हारा गर्व प्रभु के भय में हो।” मुख्य पाठ इस पद के उपलब्ध हिब्रू पाठ का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק
  choice: दूर रहो
  rationale: यह רחק का आज्ञार्थक रूप है और जान-बूझकर दूरी बनाए रखने का निर्देश देता है। ‘दूर रहो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מֵאִישׁ
  choice: मनुष्य से
  rationale: אישׁ एकवचन पुल्लिंग है। ‘मनुष्य’ यहाँ किसी अमूर्त सत्ता के बजाय एक पुरुष व्यक्ति को सूचित करता है और हिन्दी में गरिमापूर्ण व सहज है।
- source_word: שַׁלִּיט לַהֲרוֹג
  choice: मार डालने की शक्ति रखनेवाले
  rationale: שַׁלִּיט अधिकार या शक्ति रखनेवाले को बताता है, और לַהֲרוֹג उस शक्ति का लक्ष्य—मार डालना—स्पष्ट करता है। यह अनुवाद किसी औपचारिक शासकीय पद का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: לַהֲרוֹג
  choice: मार डालने
  rationale: हिब्रू क्रिया सीधे हत्या या प्राण लेने को व्यक्त करती है। ‘मार डालना’ हिन्दी में सीधा है और न्यायिक दंड का अतिरिक्त भाव नहीं जोड़ता।
- source_word: וְאַל תִּפְחַד
  choice: और ... मत डरो
  rationale: यह सीधा निषेधात्मक आदेश है। ‘मत डरो’ वर्तमान मानक हिन्दी में स्वाभाविक है।
- source_word: פַּחֲדֵי מַוֶת
  choice: मृत्यु के आतंक
  rationale: बहुवचन रचना का अर्थ मृत्यु से जुड़े भय या आतंक हैं। हिन्दी में ‘मृत्यु के आतंक’ तीव्रता बनाए रखता है और अत्यधिक शाब्दिक, अस्वाभाविक बहुवचन से बचता है।
theological_decisions:
- issue: हिब्रू और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू पाठ का अनुवाद
  alternative: 'यूनानी: “धर्मी पुरुष तुम्हारे साथ भोजन करनेवाले हों, और तुम्हारा गर्व प्रभु के भय में हो।”'
  rationale: इस पद का हिब्रू पाठ उपलब्ध और उच्च-विश्वास वाला है, इसलिए वही मुख्य पाठ का आधार है। यूनानी साक्ष्य कोई छोटा पाठांतर नहीं, बल्कि बिल्कुल अलग उक्ति देता है; पारदर्शिता के लिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। हिब्रू की दो परस्पर तनावपूर्ण आज्ञाओं—घातक शक्ति वाले व्यक्ति से दूरी और मृत्यु के आतंक से निर्भयता—को बिना व्याख्यात्मक समानीकरण के बनाए रखा गया है।
