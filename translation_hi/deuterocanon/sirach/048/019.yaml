translation:
  language: hi
  text: तब उनका घमंडी हृदय पिघल गया[a], और वे प्रसव करती स्त्री की तरह तड़पने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “तब उनका हृदय और उनके हाथ काँप उठे, और वे प्रसव करती स्त्रियों के समान प्रसव-वेदना में थे।” मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है; यूनानी पाठ को समानांतर पाठ के रूप में देखा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נמוגו
  choice: पिघल गया
  rationale: इब्रानी क्रिया साहस या दृढ़ता के पिघल जाने का सजीव बिंब देती है। हिन्दी में ‘मन ... पिघल गया’ भय के कारण भीतर से टूट जाने का भाव बनाए रखता है।
- source_word: בגאון לבם
  choice: उनका मन अपने घमंड में
  rationale: גאון में घमंड, ऊँचाई या उभार का भाव हो सकता है। संक्षिप्त और कुछ अस्पष्ट इब्रानी पदबंध को निकटता से रखते हुए यह अनुवाद उनके गर्वपूर्ण आत्मविश्वास के ढहने का संकेत देता है।
- source_word: ויחילו
  choice: पीड़ा से तड़पने लगे
  rationale: क्रिया काँपने, ऐंठने या प्रसव-वेदना सहने का अर्थ दे सकती है। अगले उपमान के साथ ‘पीड़ा से तड़पने लगे’ शारीरिक व्याकुलता व्यक्त करता है और अनावश्यक शब्दशः पुनरावृत्ति से बचता है।
- source_word: כיולדה
  choice: प्रसव करती स्त्री के समान
  rationale: एकवचन स्त्रीलिंग रूप प्रसव कर रही स्त्री की ओर संकेत करता है। यह चयन उपमान को स्पष्ट, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: τότε ἐσαλεύθησαν καρδία καὶ χεῖρες αὐτῶν
  choice: तब उनका मन ... पिघल गया
  rationale: यूनानी समानांतर में ‘उनका हृदय और उनके हाथ काँप उठे’ है, जो भय और अस्थिरता के अर्थ की पुष्टि करता है; फिर भी मुख्य पाठ प्राथमिक इब्रानी साक्ष्य का अनुसरण करता है।
