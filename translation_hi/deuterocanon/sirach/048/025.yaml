translation:
  language: hi
  text: उसने अनन्त काल तक की होनेवाली बातों और छिपी हुई बातों को उनके आने से पहले प्रकट किया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सदा तक” अथवा “युग के अन्त तक।” इब्रानी और यूनानी दोनों में अत्यन्त विस्तृत भावी कालावधि का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “छिपी हुई बातें” का अनुवाद “गुप्त बातें” या “ढकी हुई बातें” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  choice: अनन्त काल तक
  rationale: इब्रानी पदबंध में ‘तक’ और ‘युग/अनन्त काल’ का मेल है; यूनानी समानांतर भी इसी विस्तृत भावी कालावधि का समर्थन करता है। यह अभिव्यक्ति काव्यात्मक व्यापकता बनाए रखती है।
- source_word: הגיד
  choice: घोषित कीं / बता दीं
  rationale: क्रिया का मूल अर्थ बताना या प्रकट करना है। पहले खंड में ‘घोषित कीं’ भविष्यवाणी के गरिमापूर्ण संदर्भ के अनुकूल है; दूसरे खंड में स्वाभाविक हिन्दी के लिए ‘बता दीं’ रखा गया है।
- source_word: נהיות
  choice: होनेवाली बातें
  rationale: यह आनेवाली घटनाओं या भविष्य में घटनेवाली बातों को सूचित करता है; यूनानी τὰ ἐσόμενα भी इस अर्थ की पुष्टि करता है।
- source_word: ונסתרות
  choice: और छिपी हुई बातें
  rationale: यह उन बातों को दर्शाता है जो छिपी या गुप्त हैं। ‘छिपी हुई बातें’ सामान्य आधुनिक हिन्दी में स्पष्ट है और यूनानी τὰ ἀπόκρυφα के अनुरूप है।
- source_word: לפני בואן
  choice: उनके घटित होने से पहले
  rationale: शाब्दिक अर्थ ‘उनके आने से पहले’ है। घटनाओं और बातों के संदर्भ में ‘घटित होने से पहले’ अधिक स्वाभाविक हिन्दी है और यूनानी समानांतर से भी मेल खाता है।
theological_decisions:
- issue: भविष्यसूचक ज्ञान की कालगत सीमा
  choice: अनन्त काल तक होनेवाली बातें
  alternative: सदा के लिए होनेवाली बातें / युग के अन्त तक होनेवाली बातें
  rationale: मूल पाठ भविष्य के विषय में अत्यन्त व्यापक दावा करता है, पर उसके दार्शनिक या सिद्धान्तगत विस्तार को स्पष्ट नहीं करता। चुनी हुई अभिव्यक्ति उस व्यापकता और अंतर्निहित अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यवाणी के संदर्भ के अनुकूल शैली रखी गई है। दोनों मुख्य खंडों के समानांतर ढाँचे को बनाए रखते हुए हिन्दी की स्वाभाविकता के लिए הגיד को क्रमशः ‘घोषित कीं’ और ‘बता दीं’ से व्यक्त किया गया है।
