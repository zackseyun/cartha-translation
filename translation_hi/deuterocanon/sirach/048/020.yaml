translation:
  language: hi
  text: तब उन्होंने परमप्रधान परमेश्वर को पुकारा[a] और उसकी ओर अपने हाथ फैलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ आगे कहता है, “और स्वर्ग से पवित्र परमेश्वर ने शीघ्र उनकी सुन ली और यशायाह के द्वारा उन्हें बचाया।”
    reason: alternative_reading
lexical_decisions:
- source_word: ויקראו
  choice: उन्होंने…पुकारा
  rationale: यहाँ קרא का अर्थ प्रार्थना में परमेश्वर को पुकारना है; हिन्दी में ‘पुकारा’ स्वाभाविक है और निवेदन की तीव्रता भी व्यक्त करता है।
- source_word: אל אל עליון
  choice: परमप्रधान परमेश्वर को
  rationale: पहला אל सामान्य अर्थ में ‘परमेश्वर’ है और עליון उसका दैवी विशेषण ‘परमप्रधान’; हिन्दी शब्दक्रम में यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: ויפרשו
  choice: फैलाए
  rationale: פרש यहाँ प्रार्थना की मुद्रा में हाथ फैलाने को दर्शाता है।
- source_word: כפים
  choice: अपने हाथ
  rationale: כפים का शाब्दिक अर्थ ‘हथेलियाँ’ हो सकता है, पर प्रार्थना की इस मुद्रा के लिए आधुनिक हिन्दी में ‘हाथ’ अधिक स्वाभाविक है; संबंधवाचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: אליו
  choice: उसकी ओर
  rationale: पूर्वसर्ग दिशा को व्यक्त करता है; ‘उसकी ओर’ हाथ फैलाने की भौतिक और प्रार्थनात्मक दिशा दोनों को बनाए रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर के अधिक विस्तृत पाठ का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी वाक्यांश का ही अनुवाद
  alternative: 'यूनानी पाठ की अगली पंक्ति को मुख्य पाठ में जोड़ना: ‘और पवित्र जन ने स्वर्ग से शीघ्र उनकी सुनी और यशायाह के हाथ से उन्हें छुड़ाया।’'
  rationale: प्राप्त इब्रानी साक्ष्य यहाँ मुख्य आधार है। यूनानी पाठ अर्थ की पुष्टि करता है, पर उसकी अतिरिक्त सामग्री इब्रानी वाक्यांश में नहीं है; इसलिए उसे बिना संकेत मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘परमप्रधान परमेश्वर’ दैवी उपाधि को स्पष्ट रखता है और ‘हाथ फैलाए’ प्रार्थना की मूल मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
