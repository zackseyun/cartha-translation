  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
translation:
  language: hi
  text: तब आग के समान एक नबी उठा,[a] और उसके वचन धधकती भट्ठी के समान थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “तब नबी एलियाह आग के समान उठा।” इब्रानी में केवल “एक नबी उठा” है, यद्यपि प्रसंग स्पष्ट रूप से एलियाह का है।
    reason: alternative_reading
  - marker: b
    text: यूनानी समानांतर पाठ में है, “और उसका वचन मशाल के समान जलता था”; इब्रानी में है, “और उसके वचन धधकती भट्ठी के समान थे।”
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: तब
  rationale: यह पदबंध यहाँ पूर्व प्रसंग से आगे बढ़ते हुए कथात्मक संक्रमण को व्यक्त करता है; आधुनिक हिन्दी में “तब” स्वाभाविक है और अनावश्यक रूप से किसी समय-सीमा को निश्चित नहीं करता।
- source_word: קם
  choice: उठा
  rationale: नबी के प्रकट होकर सक्रिय होने के लिए “उठा” संक्षिप्त, गरिमापूर्ण और मूल क्रिया के निकट है।
- source_word: נביא
  choice: एक नबी
  rationale: इब्रानी पाठ में एलियाह का नाम नहीं है और संज्ञा अनिश्चित रूप में है; इसलिए नाम को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: כאש
  choice: आग के समान
  rationale: यह मूल उपमा को सीधे और काव्यात्मक ढंग से सुरक्षित रखता है।
- source_word: ודבריו
  choice: और उसके वचन
  rationale: इब्रानी में बहुवचन स्पष्ट है; “वचन” सामान्य हिन्दी में गरिमापूर्ण रहते हुए कथनों की बहुलता व्यक्त करता है।
- source_word: כתנור בוער
  choice: धधकती भट्ठी के समान थे
  rationale: תנור के प्रचंड ताप वाले बिंब के लिए “भट्ठी” उपयुक्त है और בוער का सजीव अर्थ “धधकती” व्यक्त करता है।
theological_decisions:
- issue: क्या मुख्य पाठ में नबी की पहचान एलियाह के रूप में स्पष्ट की जाए
  choice: इब्रानी के अनुसार केवल “एक नबी” रखा गया।
  alternative: “तब नबी एलियाह आग के समान उठा।”
  rationale: उपलब्ध इब्रानी पाठ नाम नहीं देता, जबकि यूनानी समानांतर पाठ एलियाह का नाम स्पष्ट करता है। मूल इब्रानी को मुख्य आधार बनाते हुए नाम नहीं जोड़ा गया, पर पाठांतर पादटिप्पणी में सुरक्षित है।
- issue: दूसरे चरण में इब्रानी और यूनानी के भिन्न बिंबों में से किसे रखा जाए
  choice: इब्रानी का बहुवचन “वचन” और “धधकती भट्ठी” का बिंब रखा गया।
  alternative: “और उसका वचन मशाल के समान जलता था।”
  rationale: इब्रानी पाठ उपलब्ध और प्राथमिक है; यूनानी में संख्या तथा बिंब दोनों अलग हैं। इस वास्तविक पाठांतर को समरूप करने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। “नबी” और “वचन” सामान्य बाइबलीय शब्दावली हैं; “धधकती भट्ठी” इब्रानी बिंब की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करती है।
