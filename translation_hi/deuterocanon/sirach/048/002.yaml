translation:
  language: hi
  text: उसने उनके भोजन का सहारा तोड़ दिया[a], और अपने उत्साह में उनकी संख्या घटा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में मुहावरा है, “रोटी की लाठी,” अर्थात भोजन या खाद्य-आपूर्ति का सहारा; यूनानी समानांतर पाठ में है, “उसने उन पर अकाल भेजा।”
    reason: इब्रानी रूपक और यूनानी अर्थपरक समानांतर को सुरक्षित रखना।
lexical_decisions:
- source_word: וישבר
  choice: उसने ... तोड़ दिया
  rationale: שבר का सीधा अर्थ ‘तोड़ना’ है। इससे इब्रानी रूपक बना रहता है और एकवचन कर्ता एलिय्याह के कार्यों का वर्णन जारी रखता है।
- source_word: מטה לחם
  choice: भोजन का सहारा
  rationale: शाब्दिक रूप ‘रोटी की लाठी’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होगा। ‘भोजन का सहारा’ मूल रूपक और जीविका/खाद्य-आपूर्ति, दोनों अर्थों को रखता है; यूनानी λιμόν अकाल के भाव की पुष्टि करता है।
- source_word: ובקנאתו
  choice: और अपने जोश में
  rationale: קנאה यहाँ परमेश्वर के लिए एलिय्याह के प्रबल उत्साह या जोश को सूचित करता है। ‘ईर्ष्या’ इस प्रसंग में भ्रामक होगी। ב को सहज हिन्दी में ‘में’ से व्यक्त किया गया है।
- source_word: המעיטם
  choice: उनकी संख्या घटा दी
  rationale: מעט के हिफ़ील रूप का अर्थ छोटा/कम करना या संख्या घटाना है। यह चयन इब्रानी के फलसूचक भाव तथा यूनानी ὠλιγοποίησεν (‘कम कर दिया’) को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λιμόν
  choice: अकाल
  rationale: यूनानी समानांतर पाठ इब्रानी मुहावरे को ‘अकाल’ के रूप में स्पष्ट करता है; इसे मुख्य पाठ के रूपक का अर्थ बताने वाली पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: इब्रानी मुहावरे को शाब्दिक रखा जाए या अर्थ खोलकर अनूदित किया जाए
  choice: मुख्य पाठ में ‘भोजन का सहारा’ द्वारा रूपक और उसका सामान्य अर्थ दोनों बनाए रखना, तथा पादटिप्पणी में खाद्य-आपूर्ति और यूनानी ‘अकाल’ को स्पष्ट करना।
  alternative: ‘उसने उन पर अकाल डाला’ या ‘उसने उनकी खाद्य-आपूर्ति रोक दी।’
  rationale: इब्रानी प्राथमिक साक्ष्य है और उसमें ठोस रूपक है; यूनानी उसका अकाल-संबंधी अर्थ पुष्ट करता है। चयन मूल छवि को पूरी तरह मिटाए बिना आधुनिक हिन्दी में समझ आने योग्य है।
- issue: קנאה को ‘जोश’ या ‘ईर्ष्या’ कहना
  choice: जोश
  alternative: ईर्ष्या / जलन
  rationale: प्रसंग में यह एलिय्याह के धार्मिक उत्साह को व्यक्त करता है; ‘ईर्ष्या’ अनपेक्षित नैतिक अर्थ जोड़ सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप। ‘भोजन का सहारा’ शाब्दिक ‘रोटी की लाठी’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है, जबकि पादटिप्पणी मूल अभिव्यक्ति को दर्ज करती है।
