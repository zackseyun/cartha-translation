translation:
  language: hi
  text: अपने जीवनकाल में उसने अद्भुत कार्य किए, और उसकी मृत्यु में उसके कार्य विस्मयकारी थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी के अधिक निकट: “और उसके अंत में उसके कार्य विस्मयकारी थे।” इब्रानी में “उसकी मृत्यु में” है; अंतिम उपवाक्य का इब्रानी रूप कुछ कठिन है, पर यूनानी उसके अंत अथवा मृत्यु से संबद्ध विस्मयकारी कार्यों के अर्थ की पुष्टि करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  choice: अपने जीवनकाल में
  rationale: בְּ का प्रयोग यहाँ कालवाचक है। ‘अपने जीवनकाल में’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी ἐν ζωῇ αὐτοῦ से भी मेल खाता है।
- source_word: עשה נפלאות
  choice: उसने अद्भुत काम किए
  rationale: עשה सामान्य क्रिया ‘करना’ है और נפלאות असाधारण, विस्मयकारी कार्यों को दर्शाता है। यह अनुवाद सरलता और आश्चर्य—दोनों भाव बनाए रखता है।
- source_word: ובמותו
  choice: और अपनी मृत्यु में भी
  rationale: यह इब्रानी के ‘और उसकी मृत्यु में’ को निकटता से सुरक्षित रखता है। ‘भी’ जीवन और मृत्यु के बीच निहित जोर को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल मृत्यु के बाद की घटना तक सीमित किए।
- source_word: תמהי מעשה
  choice: उसके काम आश्चर्यजनक थे
  rationale: इब्रानी रूप תמהי कुछ कठिन है, पर यूनानी θαυμάσια अर्थ को ‘आश्चर्यजनक’ के रूप में पुष्ट करता है। מעשה रूपतः एकवचन जैसा है, किंतु सामूहिक अर्थ रख सकता है; यूनानी बहुवचन भी ‘काम’ का समर्थन करता है।
theological_decisions:
- issue: कठिन इब्रानी अंतिम उपवाक्य और यूनानी समानांतर का संबंध
  choice: इब्रानी को प्राथमिक रखते हुए ‘अपनी मृत्यु में’ रखा गया और यूनानी से अंतिम उपवाक्य का आश्चर्यकारी अर्थ पुष्ट किया गया।
  alternative: यूनानी का अधिक निकट अनुसरण करते हुए ‘अपने अंत समय में उसके काम अद्भुत थे।’
  rationale: उपलब्ध इब्रानी साक्ष्य में मृत्यु का स्पष्ट उल्लेख है, जबकि यूनानी ἐν τελευτῇ ‘अंत/अवसान में’ पढ़ता है। मुख्य पाठ इब्रानी की विशिष्टता बचाता है और पादटिप्पणी वास्तविक पाठांतर बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘अपनी मृत्यु में’ जानबूझकर कुछ असामान्य रखा गया है ताकि इब्रानी की वास्तविक अभिव्यक्ति और उसका तनाव मिट न जाए; पादटिप्पणी यूनानी विकल्प स्पष्ट करती है।
