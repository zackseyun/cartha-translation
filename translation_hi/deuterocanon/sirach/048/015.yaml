base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: hi
  text: फिर भी, इन सब बातों के बावजूद लोग नहीं लौटे[a], और उन्होंने अपने पाप करना नहीं छोड़ा, जब तक कि वे अपने देश से उखाड़ नहीं दिए गए और सारी पृथ्वी पर तितर-बितर नहीं हो गए[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों ने पश्चात्ताप नहीं किया।” इब्रानी में शाब्दिक रूप से “लोग नहीं लौटे” है, जबकि यूनानी समानांतर स्पष्ट रूप से “पश्चात्ताप नहीं किया” कहता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर देश में तितर-बितर हो गए।” इब्रानी का वाक्यांश “सारी पृथ्वी/भूमि में” अनेक देशों में व्यापक बिखराव को सूचित कर सकता है।
    reason: alternative_reading
  - marker: c
    text: 'यूनानी समानांतर यहाँ उपलब्ध इब्रानी पाठ से आगे कहता है: “और लोग बहुत थोड़े रह गए, और दाऊद के घराने का एक शासक रह गया।” मुख्य पाठ उपलब्ध इब्रानी को प्राथमिक मानता है।'
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  choice: फिर भी, इस सबके बाद
  rationale: यह पद पिछले प्रसंग के बावजूद लोगों की हठधर्मिता दिखाता है। यह अनुवाद विरोधसूचक भाव और पूर्ववर्ती घटनाओं से संबंध, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לא שב העם
  choice: लोग नहीं लौटे
  rationale: שוב का मूल बिंब लौटने या फिरने का है; यहाँ इसका नैतिक अर्थ है। मुख्य पाठ में ‘नहीं लौटे’ इब्रानी बिंब को बनाए रखता है, और पादटिप्पणी पश्चात्ताप के अर्थ को स्पष्ट करती है।
- source_word: ולא חדלו מחטאתם
  choice: उन्होंने अपने पापों से मुँह नहीं मोड़ा
  rationale: शाब्दिक अर्थ ‘अपने पापों से नहीं रुके’ है। वर्तमान हिन्दी में ‘पापों से मुँह मोड़ना’ पाप छोड़ने का आशय स्वाभाविक और गंभीर ढंग से व्यक्त करता है तथा पहले खंड की नैतिक वापसी से भी जुड़ता है।
- source_word: עד אשר נסחו מארצם
  choice: जब तक कि वे अपने देश से उखाड़ नहीं दिए गए
  rationale: נסח बलपूर्वक हटाए या उखाड़े जाने का संकेत देता है। ‘उखाड़ नहीं दिए गए’ निर्वासन की कठोरता और इब्रानी की सजीव छवि दोनों को बनाए रखता है।
- source_word: ויפוצו בכל הארץ
  choice: सारी पृथ्वी पर तितर-बितर नहीं हो गए
  rationale: פוץ बिखेरने या तितर-बितर करने को दर्शाता है। בכל הארץ निर्वासन के प्रसंग में व्यापक भूभाग या अनेक देशों में फैलाव का अर्थ दे सकता है; ‘सारी पृथ्वी पर’ मुख्य व्यापक अर्थ रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: לא שב में नैतिक वापसी और यूनानी μετενόησεν में स्पष्ट पश्चात्ताप
  choice: नहीं लौटे
  alternative: पश्चात्ताप नहीं किया
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता देते हुए שוב की लौटने वाली छवि रखी गई है। यूनानी समानांतर इसके नैतिक-पश्चात्ताप संबंधी अर्थ की पुष्टि करता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: בכל הארץ में ארץ का विस्तार
  choice: सारी पृथ्वी पर
  alternative: हर देश में
  rationale: निर्वासन के प्रसंग में वाक्यांश व्यापक बिखराव बताता है, पर ‘पृथ्वी’ और ‘देशों’ दोनों की अर्थ-संभावना वास्तविक है। मुख्य पाठ व्यापक अर्थ देता है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- issue: यूनानी समानांतर का इब्रानी से आगे जारी रहना
  choice: मुख्य पाठ को उपलब्ध इब्रानी पर समाप्त किया गया
  alternative: 'यूनानी का अतिरिक्त वाक्य जोड़ना: ‘और लोग बहुत थोड़े रह गए, और दाऊद के घराने में एक शासक रह गया’'
  rationale: दिए गए इब्रानी साक्ष्य में अतिरिक्त यूनानी खंड नहीं है। मूल-भाषा की प्राथमिकता के अनुसार उसे मुख्य पाठ में नहीं जोड़ा गया, पर महत्वपूर्ण पाठांतर के रूप में पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के अनुकूल शैली। ‘लोग’ सामूहिक עם के लिए स्वाभाविक है; ‘उखाड़ दिए गए’ निर्वासन की शक्ति बनाए रखता है। मुख्य पाठ में इब्रानी की लौटने वाली छवि और ארץ की अर्थगत व्यापकता को अनावश्यक रूप से सिद्धान्तगत ढंग से सीमित नहीं किया गया।
