base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/016.yaml
  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: hi
  text: यहूदा के लिए केवल एक छोटा-सा अवशेष बचा रहा, और दाऊद के घराने के लिए एक शासक। उनमें से कुछ ने वही किया जो सही था, पर कुछ ने विश्वासघात को बहुत बढ़ाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है, “कुछ ने पापों को बहुत बढ़ाया।” इब्रानी पाठ अधिक तीखा है: “कुछ ने विश्वासघात को बहुत बढ़ाया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וישאר ליהודה מזער
  choice: यहूदा के लिए केवल थोड़ा-सा बचा रहा
  rationale: निफ़अल क्रिया के निष्क्रिय भाव और ל के संबंधसूचक प्रयोग को रखा गया है। מזער का अर्थ बहुत छोटी बची हुई मात्रा या अंश है; हिन्दी में किसी निश्चित समूह को जोड़कर अस्पष्टता मिटाने के बजाय ‘थोड़ा-सा’ रखा गया है।
- source_word: בית דוד
  choice: दाऊद का घराना
  rationale: यह राजवंश का बाइबिलीय मुहावरा है; ‘घराना’ आधुनिक हिन्दी में वंशगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קצין
  choice: एक शासक
  rationale: शब्द अधिकार रखने वाले प्रधान या शासक को दर्शाता है; इससे ‘राजा’ या ‘राजकुमार’ जैसा अधिक विशिष्ट पद आरोपित नहीं होता।
- source_word: עשו יושר
  choice: वही किया जो सही था
  rationale: यह עשה और יושר के नैतिक मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הפליאו מעל
  choice: घोर विश्वासघात किया
  rationale: הפליאו यहाँ तीव्रता या अति को और מעל निष्ठा भंग अथवा विश्वासघात को दर्शाता है। यह हिन्दी अभिव्यक्ति अस्वाभाविक ‘विश्वासघात बढ़ाया’ से बचते हुए दोनों भावों को रखती है।
theological_decisions:
- issue: राजाओं के इतिहास के सारांश में מעל का धार्मिक और नैतिक बल
  choice: विश्वासघात
  alternative: धर्मत्याग; पाप
  rationale: इब्रानी מעל केवल सामान्य पाप से अधिक, निष्ठा या वाचा भंग का संकेत दे सकता है। ‘विश्वासघात’ इस तीखे भाव को रखता है, पर केवल औपचारिक धर्म-परिवर्तन का अर्थ आरोपित नहीं करता। यूनानी समानांतर के व्यापक ‘पाप’ पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले वाक्य की संक्षिप्त, कुछ हद तक खंडित इब्रानी संरचना को अनावश्यक ऐतिहासिक व्याख्या जोड़कर पूरा नहीं किया गया।
