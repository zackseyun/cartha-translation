  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: hi
  text: हिजकिय्याह ने अपने नगर को किलेबंद किया और उसके भीतर पानी पहुँचाया। उसने चट्टानों को काँसे के समान काटा[a] और पहाड़ों में एक जलाशय बाँध दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ ‘काँसे के समान’ का कठिन तुलनात्मक वाक्यांश है। यूनानी पाठ में इसके स्थान पर ‘लोहे से’ चट्टान काटने का उल्लेख है।
    reason: textual_variant
  - marker: b
    text: अंतिम हिब्रू वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। इसका अर्थ ‘उसने पहाड़ों में जलाशयों को रोक दिया’ भी हो सकता है; यूनानी पाठ अधिक सामान्य रूप से पानी के सोते या जल-सुविधाएँ बनाने की बात करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: חזק עירו
  choice: अपने नगर को दृढ़ किया
  rationale: नगर के प्रसंग में क्रिया सुरक्षा और किलेबंदी द्वारा मजबूत करने का भाव देती है; यह सरल और स्रोत के निकट है।
- source_word: בהטות אל תוכה מים
  choice: उसके भीतर पानी पहुँचाया
  rationale: हिब्रू में पानी को नगर के अंदर की ओर मोड़ने या ले आने का ठोस भाव है।
- source_word: ויחצב כנחשת צורים
  choice: उसने काँसे के समान चट्टानें काटीं
  rationale: मुख्य पाठ हिब्रू כנחשת को उसके स्वाभाविक तुलनात्मक अर्थ में सुरक्षित रखता है; वाक्यांश कठिन है और यूनानी पाठ औजार के रूप में लोहे का उल्लेख करता है, इसलिए भिन्न पाठ पादटिप्पणी में दिया गया है।
- source_word: ויחסום הרים מקוה
  choice: पहाड़ों में एक जलाशय को बाँध दिया
  rationale: संक्षिप्त हिब्रू वाक्यांश में חסם का रोकने/बाँधने और מקוה का संचित जल अथवा जलाशय का भाव है; वचन और संबंध में कुछ अनिश्चितता बनी हुई है।
