base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: hi
  text: क्योंकि हिजकिय्याह ने भला किया[a] और दाऊद के मार्गों पर दृढ़ रहा, जैसा कि यशायाह नबी ने उसे आज्ञा दी थी—यशायाह नबी, जो नबियों में प्रशंसित था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “प्रभु को प्रसन्न करने वाला काम किया।” उपलब्ध इब्रानी पाठ में केवल “भला किया” है।'
    reason: alternative_reading
  - marker: b
    text: इसके स्थान पर यूनानी पाठ यशायाह को “महान नबी और अपने दर्शन में विश्वासयोग्य” बताता है। इब्रानी पाठ में “नबियों में प्रशंसित” है।
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: यह पद पिछले प्रसंग के समर्थन में व्याख्यात्मक कारण प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עשה ... את הטוב
  choice: भला किया
  rationale: इब्रानी का शाब्दिक अर्थ ‘भलाई/अच्छाई को किया’ है। ‘भला किया’ संक्षिप्त, सहज और नैतिक मूल्यांकन को सुरक्षित रखने वाला हिन्दी प्रयोग है; यूनानी के ‘प्रभु को प्रसन्न करने वाला काम’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ויחזק
  choice: दृढ़ रहा
  rationale: חזק यहाँ अकर्मक अथवा आत्मवाचक अर्थ दे सकता है। ‘दृढ़ रहा’ किसी अनुपस्थित कर्म को जोड़े बिना आचरण में स्थिरता व्यक्त करता है।
- source_word: בדרכי דוד
  choice: दाऊद के मार्गों पर
  rationale: यह किसी पूर्वज के आचरण का अनुसरण करने का पारंपरिक बाइबलीय मुहावरा है; ‘मार्गों पर’ आधुनिक हिन्दी में भी स्पष्ट है।
- source_word: כאשר צוהו
  choice: जैसा ... ने उसे आज्ञा दी थी
  rationale: צוה की प्रबल आज्ञार्थकता को ‘आज्ञा दी’ सुरक्षित रखता है और इब्रानी के अनुसार हिजकिय्याह को उसका कर्म मानता है।
- source_word: ישעיה הנביא
  choice: यशायाह नबी
  rationale: यह इब्रानी पदक्रम का निकट और हिन्दी में स्वाभाविक रूप है।
- source_word: המהלל בנביאים
  choice: वह नबियों में प्रशंसित था
  rationale: यह उपलब्ध इब्रानी के कर्मवाच्य और संक्षिप्त विशेषणात्मक कथन को स्पष्ट हिन्दी में व्यक्त करता है, जबकि यूनानी की भिन्न उपाधि को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या यूनानी पाठ के ‘प्रभु को प्रसन्न करने वाला’ को मुख्य पाठ में शामिल किया जाए
  choice: मुख्य पाठ में नहीं जोड़ा; उपलब्ध इब्रानी के अनुसार ‘भला किया’ रखा
  alternative: ‘प्रभु को प्रसन्न करने वाला काम किया’
  rationale: इस पद का इब्रानी पाठ उपलब्ध है और उसमें ‘प्रभु को’ नहीं है। यूनानी का महत्वपूर्ण पाठांतर पादटिप्पणी में सुरक्षित रखा गया है।
- issue: यशायाह के अंतिम वर्णन में इब्रानी और यूनानी के अंतर को कैसे प्रस्तुत किया जाए
  choice: इब्रानी के अनुसार ‘नबियों में प्रशंसित’
  alternative: ‘महान और अपने दर्शन में विश्वासयोग्य’
  rationale: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया है; materially भिन्न यूनानी साक्ष्य को दबाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘भला किया’, ‘दृढ़ रहा’ और ‘मार्गों पर’ जैसे पद स्रोत के बाइबलीय स्वर को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठता से बचते हैं। डैश अंतिम विशेषणात्मक कथन को यशायाह से स्वाभाविक रूप से जोड़ता है।
