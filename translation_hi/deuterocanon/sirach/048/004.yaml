translation:
  language: hi
  text: हे एलियाह, आप कितने विस्मयकारी हैं![a] और आपके समान कौन गर्व कर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “हे एलियाह, अपने चमत्कारों में आप कितने महिमान्वित हुए! और आपके समान कौन गर्व कर सकता है?” इब्रानी में अधिक शाब्दिक रूप से “आप कितने विस्मयकारी हैं” है, जिसका यहाँ अनुसरण किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: कितने विस्मयकारी
  rationale: विस्मयकारी आधुनिक हिन्दी में श्रद्धामिश्रित भय और आश्चर्य का भाव व्यक्त करता है; यह נורא को केवल ‘महिमामय’ बनाकर उसके भय-विस्मय के तत्व को मिटाता नहीं।
- source_word: אתה
  choice: आप ... हैं
  rationale: इब्रानी का क्रियारहित विस्मयवाचक वाक्य वर्तमान भाव रखता है। एलियाह को आदरपूर्वक संबोधित करने के लिए ‘आप’ स्वाभाविक है।
- source_word: אליהו
  choice: एलियाह
  rationale: इब्रानी नाम אֵלִיָּהוּ का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ואשר כמוך יתפאר
  choice: और आपके समान कौन गर्व कर सकता है?
  rationale: प्रेषित इब्रानी में אשר असामान्य है, पर यूनानी समानांतर और प्रसंग इसे आलंकारिक प्रश्न के रूप में पुष्ट करते हैं। יתפאר के लिए ‘गर्व कर सकता है’ सहज आधुनिक हिन्दी है और सामर्थ्यसूचक प्रश्न की ध्वनि बनाए रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर के पहले खंड में अंतर
  choice: इब्रानी נורא के अनुसार ‘विस्मयकारी’ का अनुवाद
  alternative: यूनानी के अनुसार ‘अपने अद्भुत कामों के कारण आप कितने महिमान्वित हुए’
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिक रखा गया है। यूनानी पाठ दूसरे खंड के आलंकारिक प्रश्न की पुष्टि करता है, पर पहले खंड में इब्रानी की भय-विस्मययुक्त विशिष्टता को बदलने का पर्याप्त कारण नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आप’ आदरसूचक संबोधन है; ‘विस्मयकारी’ श्रद्धा, आश्चर्य और भय के संयुक्त भाव को सँभालता है।
