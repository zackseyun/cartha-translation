base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: hi
  text: एलिय्याह भंडार में छिपा दिया गया था[a], और एलीशा उसकी आत्मा से भर गया। उसके मुँह से निकलने वाले हर वचन में दुगुने चिन्ह और बहुत-से अद्भुत काम थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “एलिय्याह, जो बवंडर में ढक लिया गया था।” इब्रानी साक्ष्य में इसके स्थान पर “एलिय्याह भंडार में छिपा दिया गया था” है।
    reason: textual_variant
  - marker: b
    text: इब्रानी वाक्य संक्षिप्त है। “दुगुने” का संबंध चिन्हों से है और यह एलीशा के “दुगुने भाग” की ओर संकेत कर सकता है; इसका अनुवाद “दो गुने चिन्ह” या “दुगुना भाग” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: भंडार में छिपा दिया गया था
  rationale: इब्रानी साक्ष्य के אוצר का सीधा अर्थ ‘भंडार’ या ‘कोषागार’ है। पाठ की रहस्यमयता को बनाए रखते हुए इब्रानी को मुख्य पाठ में प्राथमिकता दी गई है।
- source_word: ונמלא רוחו אלישע
  choice: एलीशा उसकी आत्मा से भर गया
  rationale: प्रत्यय का स्वाभाविक पूर्वपद एलिय्याह है; यूनानी समानांतर भी ‘उसकी आत्मा’ का समर्थन करता है। ‘आत्मा’ को इस प्रकार रखा गया है कि पाठ से अधिक स्पष्ट ईश्वरीय अर्थ आरोपित न हो।
- source_word: פי שנים
  choice: दुगुने
  rationale: यह पद शाब्दिक रूप से ‘दो गुना’ दर्शाता है और संभवतः एलीशा के दुगुने भाग की ओर संकेत करता है। संक्षिप्त इब्रानी वाक्य की अनिश्चितता को पूरी तरह खोले बिना ‘दुगुने’ रखा गया है।
- source_word: אותות הרבה
  choice: चिन्ह
  rationale: אותות के लिए ‘चिन्ह’ बाइबलीय प्रयोग के अनुरूप है और अगले शब्द מופתים से उसका भेद बनाए रखता है। यहाँ הרבה को संयुक्त वाक्यांश में ‘बहुत-से अद्भुत काम’ से जोड़ा गया है; इब्रानी की संक्षिप्त संरचना के कारण विराम-विन्यास अनिश्चित है।
- source_word: ומופתים
  choice: बहुत-से अद्भुत काम
  rationale: מופתים के लिए सहज आधुनिक हिन्दी में ‘अद्भुत काम’ चुना गया है। ‘चिन्ह और अद्भुत काम’ परिचित बाइबलीय युग्म को सुरक्षित रखता है।
- source_word: כל מוצא פיהו
  choice: उसके मुँह से ... निकले
  rationale: शाब्दिक चित्र ‘उसके मुँह से निकलने वाली हर बात’ का है। हिन्दी में यह रूप वचन और उससे जुड़े चिन्हों तथा अद्भुत कामों के संबंध को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: आरंभिक उपवाक्य में इब्रानी और यूनानी का अंतर
  choice: 'मुख्य पाठ में इब्रानी: ‘भंडार में छिपा दिया गया था’'
  alternative: 'यूनानी: ‘बवंडर में ढक लिया गया था’'
  rationale: जहाँ इब्रानी उपलब्ध है वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ प्राचीन और सार्थक भिन्न पाठ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘उसकी आत्मा’ का संदर्भ
  choice: एलिय्याह की आत्मा
  alternative: अधिक स्पष्ट रूप से परमेश्वर का आत्मा
  rationale: इब्रानी प्रत्यय तथा यूनानी αὐτοῦ का सबसे स्वाभाविक संदर्भ एलिय्याह है। बड़े अक्षर जैसी हिन्दी में अनुपलब्ध भेद-प्रणाली के बदले वाक्य को बिना अतिरिक्त doctrinal स्पष्टीकरण के रखा गया है।
- issue: פי שנים का आशय
  choice: चिन्हों की दुगुनी मात्रा
  alternative: ‘दुगुना भाग’ अथवा क्रियात्मक अर्थ ‘उसने दुगुने किए’
  rationale: पद संक्षिप्त और अंडाकार है। ‘दुगुने चिन्ह’ तत्काल प्रसंग को व्यक्त करता है और एलीशा के दुगुने भाग की संभावित प्रतिध्वनि भी रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप। ‘भंडार’ जानबूझकर कुछ रहस्यमय रखा गया है क्योंकि इब्रानी पाठ स्वयं ऐसा है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘एलिय्याह’ और ‘एलीशा’ अपनाए गए हैं।
