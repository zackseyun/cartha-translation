  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आकाश को रोक दिया’ मूल बिंब को बनाए रखता है और ‘वर्षा’ जैसी प्रसंगगत बात को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
