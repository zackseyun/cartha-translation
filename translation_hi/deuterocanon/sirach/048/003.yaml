translation:
  language: hi
  text: अपने वचन से उसने आकाश को रोक दिया[a], और तीन बार आग उतारी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “प्रभु के वचन से उसने आकाश बंद कर दिया।” इस स्थान पर इब्रानी पाठ अधिक संक्षिप्त और कुछ कठिन है; इसलिए मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है, जबकि यूनानी का अधिक स्पष्ट रूप इस पादटिप्पणी में दिया गया है।'
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: “तीन आगें।” सम्भवतः आशय यह है कि उसने तीन अवसरों पर आग उतारी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר
  choice: अपने वचन से
  rationale: ב के करणवाचक प्रयोग और דבר के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। सन्दर्भ में कर्ता एलिय्याह है; यूनानी पाठ इसे स्पष्ट रूप से ‘प्रभु के वचन से’ कहता है, पर मुख्य पाठ उपलब्ध इब्रानी साक्ष्य की संक्षिप्तता बनाए रखता है।
- source_word: אל
  choice: अपने
  rationale: प्रेषित इब्रानी में בדבר אל कठिन और सम्भवतः पाठगत रूप से अनिश्चित है। सन्दर्भ के आधार पर इसे एलिय्याह के बोले हुए वचन की ओर संकेत मानकर ‘अपने’ किया गया है; ‘प्रभु’ को मुख्य पाठ में जोड़ने के बजाय यूनानी पाठ का रूप पादटिप्पणी में दिया गया है।
- source_word: עצר
  choice: रोक दिया
  rationale: क्रिया का अर्थ रोकना, बन्द करना या थामे रखना है। एलिय्याह के प्रसंग में आकाश से वर्षा रुकना निहित है, किन्तु इब्रानी में यहाँ ‘वर्षा’ स्पष्टतः नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: שמים
  choice: आकाश
  rationale: इब्रानी שמים रूप की दृष्टि से बहुवचन है, पर आधुनिक हिन्दी में इस प्रसंग के लिए ‘आकाश’ स्वाभाविक है और वर्षा के स्रोत के रूप में नभ का बिंब बनाए रखता है।
- source_word: ויורד
  choice: और … उतारी
  rationale: 'यहाँ क्रिया का भाव कारणवाचक है: एलिय्याह ने आग को नीचे आने दिया या बुलाया। ‘आग उतारी’ हिन्दी में संक्षिप्त रहते हुए इस कारणवाचक अर्थ को व्यक्त करता है।'
- source_word: שלוש אשות
  choice: तीन बार आग
  rationale: शाब्दिक रूप ‘तीन आगें’ है, पर यूनानी τρὶς πῦρ और प्रसंग तीन अवसरों पर आग उतरने का संकेत देते हैं। ‘तीन बार आग’ इस आशय को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: क्या यूनानी समानांतर पाठ के आधार पर आरम्भ में ‘प्रभु’ स्पष्ट रूप से जोड़ा जाए
  choice: मुख्य पाठ में इब्रानी-केंद्रित ‘अपने वचन से’ रखा गया
  alternative: ‘प्रभु के वचन से उसने आकाश बन्द कर दिया’
  rationale: सिराख के इस पद के लिए उपलब्ध इब्रानी साक्ष्य प्राथमिक है, यद्यपि उसका वाक्यांश संक्षिप्त और कुछ कठिन है। यूनानी पाठ Κυρίου जोड़कर दैवी स्रोत स्पष्ट करता है। इस विस्तार को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखना स्रोतगत अनिश्चितता और धार्मिक तनाव दोनों को पारदर्शी बनाता है।
