base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/011.yaml
  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: hi
  text: धन्य है वह जिसने तुझे देखा और मर गया[a], और धन्य है तू, क्योंकि तू निश्चय ही जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “धन्य हैं वे जिन्होंने तुझे देखा और वे जो प्रेम से सुशोभित हैं, क्योंकि हम भी जीवित रहेंगे।” इसके विपरीत, इब्रानी साक्ष्य में है: “और धन्य है तू, क्योंकि तू निश्चय ही जीवित रहेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: धन्य है
  rationale: इब्रानी का यह आनंद-वचन किसी की सौभाग्यपूर्ण और प्रशंसनीय दशा व्यक्त करता है। ‘धन्य’ गरिमापूर्ण, स्वाभाविक और बाइबलीय संदर्भ में स्पष्ट है।
- source_word: ראך
  choice: जिसने तुझे देखा
  rationale: यह ראה का पूर्ण रूप है, जिसमें द्वितीय पुरुष एकवचन कर्म-प्रत्यय है। सरल भूतकाल और एलिय्याह को प्रत्यक्ष संबोधन सुरक्षित रखा गया है।
- source_word: ומת
  choice: और मर गया
  rationale: संयोजक और पूर्ण क्रिया को सीधे अनूदित किया गया है; ‘यद्यपि’ या ‘फिर’ जोड़कर निहित संबंध को व्याख्यायित नहीं किया गया।
- source_word: ואשריך
  choice: और धन्य है तू
  rationale: द्वितीय पुरुष प्रत्यय के कारण यह एलिय्याह को संबोधित एक नया आनंद-वचन है। यह रूप दोनों खंडों की समानांतरता बनाए रखता है।
- source_word: כי
  choice: क्योंकि
  rationale: यह दूसरे आनंद-वचन का कारण प्रस्तुत करता है। ‘क्योंकि’ आधुनिक हिन्दी में इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: חיה תחיה
  choice: तू निश्चय ही जीवित रहेगा
  rationale: धात्वर्थक निरपेक्ष रूप के साथ सीमित क्रिया क्रिया-भाव पर बल देती है; ‘निश्चय ही’ उस इब्रानी बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और यूनानी समानांतर पाठ को पादटिप्पणी में सुरक्षित रखना
  alternative: 'यूनानी: ‘धन्य हैं वे जिन्होंने तुझे देखा और वे जो प्रेम से सुशोभित हैं, क्योंकि हम भी जीवित रहेंगे।’'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है। फिर भी यूनानी पाठ का दूसरा भाग उल्लेखनीय रूप से भिन्न है, इसलिए पाठांतर को चुपचाप समतल करने के बजाय पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। एलिय्याह के सीधे संबोधन और पद की समानांतर आनंद-वचन संरचना को बनाए रखने के लिए ‘तू/तुझे’ रखा गया है; यह यहाँ अपमानसूचक नहीं, बल्कि प्राचीन काव्यात्मक प्रत्यक्ष संबोधन है।
