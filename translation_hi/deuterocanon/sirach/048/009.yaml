translation:
  language: hi
  text: जो आँधी में स्वर्ग की ओर उठा लिया गया[a], और आग की टुकड़ियों में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “जो आग के तूफ़ान में, अग्निमय घोड़ों के रथ पर उठा लिया गया।” यह विस्तृत पाठ 2 राजा 2:11 में एलिय्याह के उठाए जाने के संकेत को अधिक स्पष्ट करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הנלקח
  choice: जो ... उठा लिया गया
  rationale: לקח का निष्क्रिय कृदंत एलिय्याह के प्रसंग में ऊपर उठा लिए जाने को व्यक्त करता है; यूनानी ἀναλημφθείς भी इसी आरोहण-अर्थ की पुष्टि करता है।
- source_word: בסערה
  choice: आँधी में
  rationale: סערה का अर्थ आँधी, तूफ़ान या प्रचंड झंझा है। यहाँ 'आँधी' स्वाभाविक हिन्दी है और 2 राजा 2:11 की शब्दावली को यांत्रिक रूप से आरोपित नहीं करती।
- source_word: מעלה
  choice: स्वर्ग की ओर
  rationale: कठिन रूप מעלה यहाँ ऊपर अथवा स्वर्ग की दिशा का संकेत देता है। 'स्वर्ग की ओर' दिशात्मक अर्थ को व्यक्त करता है, पर गंतव्य तक पहुँचने की बात को अनावश्यक रूप से निश्चित नहीं बनाता।
- source_word: ובגדודי אש
  choice: और आग की सेनाओं के बीच
  rationale: גדודים सामान्यतः दलों, टुकड़ियों या सेनाओं को दर्शाता है, रथों को नहीं। 'सेनाओं' से सामूहिक और क्रमबद्ध अग्निमय समूहों का बिंब बना रहता है।
- source_word: שמים
  choice: स्वर्ग
  rationale: שמים रूपतः बहुवचन है, किंतु आधुनिक मानक हिन्दी में इस आरोहण-संदर्भ में 'स्वर्ग' अधिक स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: क्या इब्रानी पाठ को 2 राजा 2:11 और विस्तृत यूनानी पाठ के अनुसार स्पष्ट बनाया जाए
  choice: मुख्य पाठ में उपलब्ध इब्रानी का कम स्पष्ट बिंब—'स्वर्ग की ओर ... आग की सेनाओं के बीच'—रखा गया।
  alternative: “जो आग की आँधी में, अग्निमय घोड़ों के रथ पर उठा लिया गया।”
  rationale: उपलब्ध इब्रानी को प्राथमिकता दी गई है; उसमें रथ या घोड़ों का स्पष्ट उल्लेख नहीं है। यूनानी का विस्तृत पाठ वास्तविक पाठांतर के रूप में पादटिप्पणी में रखा गया है, जिससे एलिय्याह-संबंधी संकेत स्पष्ट हो जाता है और पाठ-साक्ष्यों का तनाव भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। 'आग की सेनाएँ' असामान्य किंतु जानबूझकर संरक्षित इब्रानी बिंब है; इसे परिचित 'आग के रथ' में समरस नहीं किया गया।
