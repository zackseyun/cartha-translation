base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: hi
  text: अपने जीवनकाल में वह किसी के सामने नहीं काँपा, और कोई मनुष्य उसकी आत्मा पर अधिकार न कर सका। कोई बात उसके लिए अत्यन्त अद्भुत न थी[b], और उसके नीचे उसका शरीर रचा गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इब्रानी पाठ कठिन है और सम्भवतः उसमें पाठगत समस्या है। यूनानी पाठ में है, “और निद्रा में उसके शरीर ने भविष्यवाणी की।”
    reason: textual_variant
  - marker: b
    text: या “कोई वचन उसके लिए अत्यन्त अद्भुत न था।” इब्रानी शब्द का अर्थ “वचन” या “बात/विषय” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מימיו
  choice: अपने जीवनकाल में
  rationale: यह कालसूचक मुहावरा उसके जीवन के दिनों को दर्शाता है; आधुनिक हिन्दी में ‘अपने जीवनकाल में’ स्वाभाविक और स्पष्ट है।
- source_word: לא זע מכל
  choice: वह किसी के सामने नहीं काँपा
  rationale: זע काँपने या विचलित होने का भाव देता है। प्रसंग में यह निडरता व्यक्त करता है, पर ‘किसी’ में व्यक्ति या परिस्थिति की सम्भावित व्यापकता पूरी तरह समाप्त नहीं होती।
- source_word: ולא משל ברוחו כל בשר
  choice: कोई मनुष्य उसकी आत्मा पर अधिकार न कर सका
  rationale: כל בשר का शाब्दिक अर्थ ‘समस्त देह’ है, पर यह मनुष्यों या नश्वर प्राणियों के लिए इब्रानी मुहावरा है। ‘अधिकार न कर सका’ משל ברוחו की प्रभुता की धारणा व्यक्त करता है।
- source_word: כל דבר לא נפלא ממנו
  choice: कोई बात उसके लिए अत्यन्त अद्भुत न थी
  rationale: דבר का अर्थ ‘वचन’ या ‘बात/विषय’ दोनों हो सकता है। ‘बात’ हिन्दी में व्यापक अर्थ को स्वाभाविक रूप से रखती है, जबकि נפלא की अद्भुत अथवा असाधारण होने की छवि भी बनी रहती है।
- source_word: ומתחתיו נברא בשרו
  choice: और उसके नीचे उसका शरीर रचा गया
  rationale: यह उपलब्ध इब्रानी पाठ का निकट अनुवाद है, यद्यपि वाक्य कठिन और सम्भवतः पाठगत रूप से विकृत है। अस्पष्ट इब्रानी को चुपचाप यूनानी पाठ से बदलने के बजाय मुख्य पाठ में रखा गया है और स्पष्ट यूनानी पाठांतर पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: कठिन अंतिम उपवाक्य में इब्रानी और यूनानी पाठ का चयन
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी का निकट अनुवाद: ‘और उसके नीचे उसका शरीर रचा गया।’'
  alternative: 'यूनानी समानांतर पाठ: ‘और निद्रा में उसके शरीर ने भविष्यवाणी की।’'
  rationale: उपलब्ध इब्रानी यहाँ व्याकरणतः अनुवादयोग्य है, पर अर्थ की दृष्टि से कठिन और सम्भवतः दूषित है। यूनानी पाठ प्रसंग में एलीशा की मृत्यु के बाद की सामर्थ्य से मेल खाता स्पष्ट पाठ देता है। मुख्य पाठ इब्रानी साक्ष्य को प्राथमिकता देता है और पादटिप्पणी वास्तविक पाठांतर तथा अनिश्चितता को स्पष्ट करती है।
- issue: דבר के अर्थ की व्यापकता
  choice: ‘बात’
  alternative: ‘वचन’
  rationale: इब्रानी शब्द दोनों अर्थ दे सकता है। ‘बात’ इस कथन को केवल बोले हुए वचन तक सीमित नहीं करती; पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘आत्मा पर अधिकार’ मूल इब्रानी की प्रभुता-संबंधी छवि रखता है। अंतिम वाक्य की असहजता मूल पाठ की वास्तविक कठिनाई को दर्शाती है; उसे व्याख्यात्मक सहजता के लिए छिपाया नहीं गया।
