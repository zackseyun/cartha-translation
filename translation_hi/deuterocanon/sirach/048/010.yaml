translation:
  language: hi
  text: जो नियत समय के लिए लिखित रूप में ठहराया गया था[a], कि वह परमेश्वर के भड़कते क्रोध से पहले रोष को शांत करे, पिताओं के हृदयों को पुत्रों की ओर फेरे[b], और इस्राएल[c] के गोत्रों को फिर से स्थापित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का आरंभिक वाक्यांश कठिन है और शाब्दिक रूप से ‘जो लिखा गया/लिखित है, समय के लिए तैयार या ठहराया गया’ जैसा है। यूनानी में भी नियत समयों के लिए दर्ज किए जाने का भाव है, और उसमें ‘डाँटों/फटकारों में’ का एक अतिरिक्त कठिन पद है।
    reason: मूल-पाठ की अस्पष्टता
  - marker: b
    text: हिब्रू में ‘पिताओं ... पुत्रों’ बहुवचन में है; यूनानी में ‘पिता ... पुत्र’ एकवचन में है।
    reason: पाठांतर
  - marker: c
    text: हिब्रू में ‘इस्राएल के गोत्र’ है; यूनानी में ‘याकूब के गोत्र’ है।
    reason: पाठांतर
lexical_decisions:
- source_word: הכתוב נכון לעת
  choice: जिसके विषय में नियत समय के लिए लिखा गया था
  rationale: हिब्रू הכתוב का सामान्य अर्थ ‘लिखा गया’ है, जबकि נכון לעת किसी नियत समय के लिए तैयार या ठहराए जाने की ओर संकेत करता है। यह अनुवाद कठिन मूल वाक्यांश की दोनों छवियों को यथासंभव बनाए रखता है; यूनानी समानांतर भी दर्ज किए जाने और भावी नियत अवसरों की ओर संकेत करता है।
- source_word: להשבית אף לפני חרון אל
  choice: परमेश्वर का भड़कता क्रोध आने से पहले रोष को शांत करे
  rationale: להשבית का मूल भाव किसी चीज़ को रोकना या समाप्त करना है; אף ‘रोष’ और חרון אל ‘परमेश्वर का भड़कता क्रोध’ है। ‘शांत करे’ स्वाभाविक हिन्दी में क्रोध को थामने का भाव देता है, जबकि परमेश्वर का स्पष्ट उल्लेख हिब्रू के अनुसार रखा गया है।
- source_word: להשיב לב אבות על בנים
  choice: पिताओं के हृदय पुत्रों की ओर फेरे
  rationale: हिब्रू में ‘पिताओं’ और ‘पुत्रों’ दोनों का बहुवचन है। ‘हृदय फेरना’ मूल भविष्यद्वक्तापरक मुहावरे को बनाए रखता है और उसे केवल ‘मेल-मिलाप कराना’ कहकर व्याख्यायित नहीं करता।
- source_word: ולהכין שבטי ישראל
  choice: इस्राएल के गोत्रों को फिर से स्थापित करे
  rationale: להכין का अर्थ तैयार करना, स्थिर करना या सुव्यवस्थित करना हो सकता है। प्रसंग में पुनर्स्थापना का भाव स्वाभाविक है; ‘इस्राएल’ उपलब्ध हिब्रू पाठ का अनुसरण करता है।
theological_decisions:
- issue: कठिन आरंभिक वाक्यांश में लिखे जाने और नियुक्त किए जाने का संबंध
  choice: ‘जिसके विषय में नियत समय के लिए लिखा गया था’ के द्वारा लिखित भविष्यवाणी और नियत समय—दोनों संकेत सुरक्षित रखे गए।
  alternative: ‘जो नियत समय के लिए नियुक्त किया गया था’
  rationale: हिब्रू הכתוב को केवल ‘नियुक्त’ कहना उसके प्रत्यक्ष ‘लिखा हुआ’ भाव को मिटा देता, जबकि केवल शाब्दिक रूप से ‘लिखा गया’ कहना נכון לעת के नियोजन-संबंधी संकेत को कमजोर कर सकता था।
- issue: एलिय्याह से जुड़ी भविष्यद्वक्तापरक पुनर्स्थापना की भाषा
  choice: ‘हृदय ... की ओर फेरे’ मुहावरा ज्यों का त्यों रखा गया।
  alternative: ‘पिताओं और पुत्रों में मेल-मिलाप कराए’
  rationale: मूल मुहावरा संबंधों के परिवर्तन का संकेत देता है, पर उसकी पूरी प्रकृति स्पष्ट नहीं करता। इसलिए व्याख्यात्मक विस्तार से बचते हुए धार्मिक और अंतर्पाठीय तनाव सुरक्षित रखा गया है।
- issue: इस्राएल के गोत्रों की क्रिया का अर्थ
  choice: ‘फिर से स्थापित करे’
  alternative: ‘तैयार करे’ या ‘सुव्यवस्थित करे’
  rationale: हिब्रू क्रिया अर्थ की कुछ व्यापकता रखती है और यूनानी समानांतर स्थापित करने का समर्थन करता है। ‘फिर से स्थापित’ एलिय्याह-संबंधी पुनर्स्थापना के प्रसंग में उपयुक्त है, किंतु किसी विशिष्ट सांप्रदायिक योजना को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और भविष्यद्वक्तापरक शैली रखी गई है। ‘रोष’, ‘हृदय फेरना’ और ‘गोत्र’ जैसे बाइबिलीय पद सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की शैली और अंतर्पाठीय प्रतिध्वनि को सुरक्षित रखते हैं।
