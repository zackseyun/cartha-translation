  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: hi
  text: उसके दिनों में सन्हेरीब चढ़ आया और उसने रबशाके को भेजा। उसने सिय्योन के विरुद्ध अपना हाथ बढ़ाया और अपने घमंड में परमेश्वर की निन्दा की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “और उसने अपने अहंकार में डींग मारी।” इब्रानी साक्ष्य इसके स्थान पर परमेश्वर की निन्दा करने की बात कहता है, जिसका अनुसरण मुख्य पाठ में किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: चढ़ आया
  rationale: यह सैन्य चढ़ाई के संदर्भ में ‘ऊपर आना/चढ़ आना’ व्यक्त करता है और इब्रानी की दिशात्मकता बनाए रखता है।
- source_word: וישלח
  choice: भेजा
  rationale: सरल और स्वाभाविक रूप से किसी प्रतिनिधि को रवाना करने का अर्थ देता है।
- source_word: רבשקה
  choice: रबशाके
  rationale: अश्शूरी पदवी का प्रचलित बाइबलीय लिप्यंतरण रखा गया है; स्रोत में निश्चित उपपद नहीं है।
- source_word: ויט ידו
  choice: अपना हाथ बढ़ाया
  rationale: इब्रानी मुहावरा यहाँ शत्रुतापूर्ण कार्रवाई या धमकी का भाव रखता है; शाब्दिक चित्र भी सुरक्षित रहता है।
- source_word: על ציון
  choice: सिय्योन के विरुद्ध
  rationale: शत्रुतापूर्ण संदर्भ में על का स्वाभाविक हिन्दी अर्थ ‘के विरुद्ध’ है।
- source_word: ויגדף אל
  choice: परमेश्वर की निन्दा की
  rationale: גדף अपमानजनक और ईशनिन्दात्मक वाणी बताता है; אל को यहाँ ‘परमेश्वर’ के रूप में समझना इब्रानी वाक्य का सुसंगत पाठ है।
- source_word: בגאונו
  choice: अपने घमंड में
  rationale: גאון यहाँ आत्मोन्नति और अहंकार का नकारात्मक भाव देता है; ‘घमंड’ सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: इब्रानी के ‘परमेश्वर की निन्दा की’ और यूनानी के ‘अपने अहंकार में डींग मारी’ के बीच पाठांतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य के अनुसार परमेश्वर की निन्दा का स्पष्ट भाव रखा गया है।
  alternative: अपने अहंकार में डींग मारी
  rationale: सिराख के उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है, पर यूनानी समानांतर का उल्लेखनीय भिन्न अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: אל का अर्थ
  choice: इसे ‘परमेश्वर’ संज्ञा मानकर גדף का कर्म समझा गया है।
  alternative: इसे संबंधसूचक या अपूर्ण अभिव्यक्ति मानकर निन्दा का कर्म अनकहा छोड़ा जा सकता है।
  rationale: ‘परमेश्वर की निन्दा की’ इब्रानी शब्दों का सीधा और प्रसंगानुकूल पाठ है, हालांकि रूपात्मक अस्पष्टता को निर्णय-सूची में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; ऐतिहासिक नामों के लिए प्रचलित बाइबलीय रूप ‘सन्हेरीब’, ‘रबशाके’ और ‘सिय्योन’ रखे गए हैं।
