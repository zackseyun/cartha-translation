    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח גבורה
  choice: सामर्थ्य की आत्मा से
  rationale: בְּ यहाँ साधन या प्रभाव-क्षेत्र का बोध करा सकता है। यह अनुवाद इब्रानी के ‘सामर्थ्य की आत्मा’ को प्राथमिकता देता है और भविष्यदर्शी सामर्थ्य का संकेत बनाए रखता है, बिना यह निश्चित किए कि ‘आत्मा’ स्पष्ट रूप से परमेश्वर का आत्मा ही है।
- source_word: חזה
  choice: उसने देखा
  rationale: क्रिया का अर्थ ‘देखना’ है और प्रसंग में यह भविष्यदर्शी दर्शन को सूचित करती है। सरल ‘देखा’ मूल रूपक को बनाए रखता है।
- source_word: אחרית
  choice: अन्त
  rationale: शब्द अन्त, अंतिम परिणाम या आनेवाले समय को सूचित कर सकता है। ‘अन्त’ इब्रानी की संक्षिप्तता और यूनानी ‘अन्तिम बातें’ से संबंध दोनों को सुरक्षित रखता है।
- source_word: וינחם
  choice: और ... सांत्वना दी
  rationale: यहाँ נחם का अर्थ पछताना नहीं, बल्कि शोकित लोगों को ढाढ़स और सांत्वना देना है।
- source_word: אבלי ציון
  choice: सिय्योन के शोक मनानेवालों
  rationale: 'इब्रानी संबंध-रचना को जानबूझकर कुछ खुला रखा गया है: ये सिय्योन के लिए शोक करनेवाले अथवा सिय्योन से संबद्ध शोकित लोग हो सकते हैं। यूनानी का स्थानवाचक अर्थ पाद-टिप्पणी में दिया गया है।'
theological_decisions:
- issue: ‘सामर्थ्य की आत्मा’ में भविष्यदर्शी प्रेरणा का स्वरूप
  choice: सामर्थ्य की आत्मा से
  alternative: महान आत्मा में
  rationale: इब्रानी पाठ ‘सामर्थ्य’ कहता है, जबकि यूनानी समानांतर ‘महान’ कहता है। मुख्य पाठ इब्रानी को मानता है, पर यूनानी पाठांतर को पाद-टिप्पणी में सुरक्षित रखता है। ‘आत्मा’ को स्पष्ट रूप से पवित्र आत्मा कहकर उस पहचान को पाठ में आरोपित नहीं किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। वाक्य की काव्यात्मक संक्षिप्तता बनाए रखी गई है। ‘अन्त’ और ‘सिय्योन के शोक मनानेवालों’ की वास्तविक अर्थगत व्यापकता को मुख्य पाठ तथा पाद-टिप्पणियों में सुरक्षित रखा गया है।
