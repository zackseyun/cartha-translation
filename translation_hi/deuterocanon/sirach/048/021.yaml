  text: He struck the camp of Assyria[a], and threw it into confusion with a plague.
translation:
  language: hi
  text: उसने अश्शूर की छावनी पर प्रहार किया[a] और महामारी से उसमें खलबली मचा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उसने अश्शूरियों की छावनी पर प्रहार किया, और उसके दूत ने उन्हें नष्ट कर दिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ויך
  choice: उसने ... प्रहार किया
  rationale: हिब्रू נכה का सीधा और प्रभावशाली अर्थ ‘प्रहार करना’ है; यह आधुनिक, गरिमापूर्ण हिन्दी है और अनावश्यक रूप से पूर्ण विनाश का भाव नहीं जोड़ता।
- source_word: מחנה אשור
  choice: अश्शूर की छावनी
  rationale: यह हिब्रू संबंधवाचक संरचना ‘अश्शूर की छावनी’ का स्वाभाविक हिन्दी रूप है; ‘अश्शूरी छावनी’ भी संभव है, पर चुना हुआ रूप मूल संरचना के अधिक निकट है।
- source_word: ויהמם
  choice: उसमें खलबली मचा दी
  rationale: המם यहाँ भय, घबराहट या अव्यवस्था उत्पन्न करने का कारक भाव देता है। ‘खलबली मचा दी’ सहज हिन्दी में इस अर्थ को व्यक्त करता है और एकवचन ‘छावनी’ को संदर्भित करता है।
- source_word: במגפה
  choice: महामारी से
  rationale: מגפה विपत्ति, महामारी या घातक प्रकोप को सूचित करता है; करणवाचक ב के लिए ‘से’ स्वाभाविक है। यहाँ ‘महामारी’ आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: दूसरे खंड में हिब्रू और यूनानी पाठ का अंतर
  choice: 'हिब्रू के अनुसार: ‘महामारी से उसमें खलबली मचा दी’'
  alternative: 'यूनानी के अनुसार: ‘उसके दूत ने उन्हें नष्ट कर दिया’'
  rationale: उपलब्ध उच्च-विश्वसनीयता वाले हिब्रू पाठ को मुख्य पाठ में प्राथमिकता दी गई है। यूनानी परंपरा विनाश को परमेश्वर के दूत से स्पष्ट रूप से जोड़ती है; इस वास्तविक पाठांतर और उसके धर्मवैचारिक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘खलबली’ सामान्य पाठकों के लिए बोधगम्य है, जबकि ‘प्रहार किया’ मूल की शक्ति बनाए रखता है।
