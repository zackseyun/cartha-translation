base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/008.yaml
  text: You made heard at Sinai rebukes[a], and at Horeb judgments of vengeance.
translation:
  language: hi
  text: तूने सीनै में फटकारें सुनाईं[a], और होरेब में प्रतिशोध के न्याय-निर्णय सुनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ यहाँ बहुत भिन्न है। उसका आशय है: “प्रतिफल के लिए राजाओं का अभिषेक करनेवाला, और उसके बाद भविष्यद्वक्ताओं को उत्तराधिकारी के रूप में अभिषेक करनेवाला।” इब्रानी और यूनानी पाठ संभवतः इस पद के अलग-अलग पाठरूपों को दर्शाते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  choice: सुनाईं
  rationale: यह שמע के हिफ़ील रूप का कारक अर्थ व्यक्त करता है—‘सुनवाना/सुनाना।’ स्वाभाविक हिन्दी में ‘फटकारें सुनाईं’ मूल की संक्षिप्तता और बल दोनों बनाए रखता है।
- source_word: בסיני
  choice: सीनै में
  rationale: स्थानवाचक ב का सहज हिन्दी रूप ‘में’ है; ‘सीनै’ प्रचलित हिन्दी बाइबलीय नाम है।
- source_word: תוכחות
  choice: फटकारें
  rationale: यह शब्द कड़ी ताड़ना या सुधारात्मक उलाहने को दर्शाता है; ‘फटकारें’ आधुनिक और बलयुक्त समतुल्य है।
- source_word: ובחורב
  choice: और होरेब में
  rationale: संयोजक ו और स्थानवाचक ב दोनों को सीधे और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: משפטי
  choice: न्याय
  rationale: משפט के बहुवचन संयोगरूप का अर्थ यहाँ न्यायिक निर्णय या दंडात्मक न्याय है। हिन्दी में ‘प्रतिशोध के न्याय’ मूल संयोग-संबंध को बनाए रखता है।
- source_word: נקם
  choice: प्रतिशोध
  rationale: נקם का सीधा अर्थ बदला, प्रतिशोध या दंडात्मक प्रत्युत्तर है। ‘प्रतिशोध’ गरिमापूर्ण है और संदर्भ के न्यायिक बल को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा पाठांतर
  choice: 'मुख्य पाठ उपलब्ध इब्रानी के अनुसार है: सीनै में फटकारें सुनाना और होरेब में प्रतिशोध के न्याय सुनाना।'
  alternative: 'यूनानी पाठ का आशय है: “प्रतिफल देने के लिए राजाओं का अभिषेक करनेवाला, और उसके बाद उत्तराधिकारी भविष्यद्वक्ताओं का।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध और विश्वसनीय है, वह मुख्य आधार है। यूनानी पाठ यहाँ केवल अनुवादगत भिन्नता नहीं, बल्कि एक अलग पाठरूप दर्शाता है; इसलिए उसे पादटिप्पणी में पारदर्शी रूप से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। एकवचन संबोधन ‘तूने’ प्रसंगगत प्रत्यक्ष संबोधन को बनाए रखता है। ‘सीनै’ और ‘होरेब’ प्रचलित बाइबलीय रूप हैं।
