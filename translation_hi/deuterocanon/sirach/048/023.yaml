  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: hi
  text: उसके दिनों में सूर्य ठहर गया[b], और राजा की आयु बढ़ा दी गई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात राजा की आयु बढ़ाई गई; आसपास के प्रसंग में राजा हिजकिय्याह है।
    reason: cross_reference
  - marker: b
    text: यूनानी पाठ का कठिन वाक्यांश ‘उसने सूर्य को रोक दिया’ या ‘सूर्य रोक दिया गया’ भी समझा जा सकता है; यह हिब्रू के ‘सूर्य ठहर गया’ के समानांतर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד
  choice: ठहर गया
  rationale: हिब्रू क्रिया का मूल अर्थ ‘खड़ा हुआ/ठहरा’ है; सूर्य के संदर्भ में ‘ठहर गया’ उसके मार्ग में रुकने का स्वाभाविक और स्रोत-सन्निकट हिन्दी रूप है।
- source_word: השמש
  choice: सूर्य
  rationale: निश्चित पद ‘सूर्य’ का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: ונוסף
  choice: बढ़ा दी गई
  rationale: शाब्दिक अर्थ ‘जोड़ी गई’ है, पर ‘आयु’ के साथ हिन्दी में ‘बढ़ा दी गई’ स्वाभाविक है और निष्क्रिय भाव बनाए रखता है।
- source_word: חיי
  choice: आयु
  rationale: यहाँ जीवन की अवधि अभिप्रेत है; हिन्दी में ‘राजा की आयु’ हिब्रू संबंध-रचना का स्पष्ट और मुहावरेदार रूप है।
- source_word: המלך
  choice: राजा
  rationale: मूल में नाम के स्थान पर निश्चित उपाधि ‘राजा’ है; इसलिए मुख्य पाठ में हिजकिय्याह का नाम नहीं जोड़ा गया।
theological_decisions:
- issue: मुख्य पाठ में राजा की पहचान हिजकिय्याह के रूप में स्पष्ट करना
  choice: मूल के अनुसार केवल ‘राजा’ रखना
  alternative: ‘राजा हिजकिय्याह’ या ‘हिजकिय्याह’
  rationale: पद स्वयं केवल ‘राजा’ कहता है और आसपास का प्रसंग उसकी पहचान बताता है; नाम जोड़ने से मूल से अधिक व्याख्या मुख्य पाठ में आ जाती।
- issue: राजा के जीवन में ‘जोड़े जाने’ को कैसे व्यक्त किया जाए
  choice: ‘आयु बढ़ा दी गई’
  alternative: ‘राजा के जीवन में और दिन जोड़ दिए गए’
  rationale: चुना हुआ रूप अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, निष्क्रियता को सुरक्षित रखता है, और कर्ता को वहाँ स्पष्ट नहीं करता जहाँ हिब्रू उसे अनकहा छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली। ‘ठहर गया’ हिब्रू बिंब को बनाए रखता है, जबकि ‘आयु बढ़ा दी गई’ हिन्दी में शाब्दिक ‘जीवन जोड़ा गया’ की अपेक्षा अधिक स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
