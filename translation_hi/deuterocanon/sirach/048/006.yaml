translation:
  language: hi
  text: जिसने राजाओं को विनाश में उतार दिया,[a][c] और प्रतिष्ठित लोगों को उनके बिस्तरों से उतार दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गड्ढे में’; इब्रानी שחת का अर्थ गड्ढा, कब्र, बरबादी या विनाश हो सकता है। यूनानी समानांतर पाठ में ‘विनाश में’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रतिष्ठित लोगों’ का अनुवाद ‘कुलीनों’ या ‘सम्मानित लोगों’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह पंक्ति सम्भवतः राजाओं और ऊँचे पद वालों पर एलिय्याह द्वारा सुनाए गए न्यायों की ओर संकेत करती है, जिनमें बिस्तर पर पड़ा एक राजा भी था; तुलना करें 2 राजाओं 1।
    reason: cross_reference
lexical_decisions:
- source_word: המוריד
  choice: जिसने ... उतार दिया
  rationale: ירד के हिफ़ील कृदन्त का कारणवाचक अर्थ है—नीचे उतारना या पतन कराना। यह प्रयोग वास्तविक अधोगमन और रूपकात्मक पराजय, दोनों की गुंजाइश रखता है; यूनानी καταγαγών भी इसका समर्थन करता है।
- source_word: מלכים
  choice: राजाओं
  rationale: इब्रानी में स्पष्ट रूप से ‘राजा’ हैं; इसे सामान्य ‘शासक’ करना अनावश्यक विस्तार होता।
- source_word: על שחת
  choice: विनाश में
  rationale: שחת का अर्थ गड्ढा, कब्र, बरबादी या विनाश हो सकता है। यहाँ ‘विनाश में’ परिणाम और नीचे गिराए जाने की छवि दोनों रखता है; यूनानी εἰς ἀπώλειαν भी ‘विनाश’ का समर्थन करता है।
- source_word: ונכבדים
  choice: और प्रतिष्ठित लोगों को
  rationale: כבד से बना यह रूप सम्मान, महत्त्व या ऊँचे पद वाले व्यक्तियों को बताता है। ‘प्रतिष्ठित लोग’ अर्थ को वंशानुगत कुलीनता तक सीमित नहीं करता और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ממטותם
  choice: उनके बिस्तरों से
  rationale: מטות का सीधा अर्थ बिस्तर या शय्या है। ‘बिस्तरों’ आधुनिक और सहज है तथा सम्भावित कथात्मक संकेत को मुख्य पाठ में स्पष्ट किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: क्या दूसरे अर्धपद को सामान्य सामाजिक उलटफेर माना जाए या बिस्तर पर पड़े राजा पर एलिय्याह के न्याय का संकेत
  choice: ठोस वाक्यांश ‘प्रतिष्ठित लोगों को उनके बिस्तरों से’ बनाए रखा गया है।
  alternative: ‘प्रतिष्ठित लोगों को उनकी रोग-शय्याओं से’ जैसे अधिक व्याख्यात्मक अनुवाद का उपयोग।
  rationale: इब्रानी और यूनानी दोनों केवल बिस्तर/शय्या की ठोस छवि देते हैं। 2 राजा 1 की ओर सम्भावित संकेत उपयोगी है, पर बीमारी को मुख्य पाठ में जोड़ना मूल से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त काव्यात्मक शैली रखी गई है। ‘विनाश में उतार दिया’ सामान्य गद्य से कुछ अधिक चित्रात्मक है, पर मूल की नीचे उतारने की छवि और उसके रूपकात्मक अर्थ दोनों सुरक्षित रखता है।
