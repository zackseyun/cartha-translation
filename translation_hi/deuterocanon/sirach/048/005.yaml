    reason: textual_variant
lexical_decisions:
- source_word: המקים
  choice: जिसने…उठा खड़ा किया
  rationale: קום के हिफ़ील कृदंत का अर्थ यहाँ एलियाह द्वारा मृत व्यक्ति को फिर जीवित करना है। यह अभिव्यक्ति क्रिया की सजीवता बनाए रखती है, पर बाद की पुनरुत्थान-संबंधी धर्मवैज्ञानिक शब्दावली को अनावश्यक रूप से नहीं थोपती।
- source_word: גוע
  choice: मरे हुए व्यक्ति को
  rationale: यह शब्द उस एक व्यक्ति को सूचित करता है जिसकी मृत्यु हो चुकी थी। हिंदी में यह ‘शव’ की अपेक्षा काव्यात्मक स्तुति के प्रसंग में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ממות
  choice: मृत्यु…से
  rationale: מן का वियोगात्मक अर्थ सीधे ‘से’ द्वारा व्यक्त होता है और इब्रानी की संक्षिप्तता बनी रहती है।
- source_word: ומשאול
  choice: और अधोलोक से
  rationale: שאול मृतकों के लोक को सूचित करता है। ‘अधोलोक’ आधुनिक हिंदी पाठक के लिए बोधगम्य है और इसे केवल ‘कब्र’ तक सीमित नहीं करता; यूनानी ᾅδου भी इसी अर्थ की पुष्टि करता है।
- source_word: כרצון יהוה
  choice: याहवे की इच्छा से
  rationale: इब्रानी पाठ का अर्थ ‘याहवे की इच्छा के अनुसार/से’ है। सहज हिंदी में ‘की इच्छा से’ दैवी अनुमति और सामर्थ्य के भाव को संक्षेप में व्यक्त करता है।
- source_word: יהוה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिंदी में प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: पद के अंत में दैवी अभिकरण का सूत्र
  choice: याहवे की इच्छा से
  alternative: परमप्रधान के वचन से
  rationale: प्राथमिक इब्रानी साक्ष्य כרצון יהוה पढ़ता है, जबकि यूनानी समानांतर पाठ ἐν λόγῳ Ὑψίστου पढ़ता है। मुख्य पाठ में इब्रानी को अपनाया गया और अर्थपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। इब्रानी की काव्यात्मक संक्षिप्तता को स्वाभाविक हिंदी वाक्य-विन्यास में व्यक्त किया गया है।
