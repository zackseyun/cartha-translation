translation:
  language: hi
  text: जिसने प्रतिशोध के कार्यों के लिए एक व्यक्ति का अभिषेक किया[b][a], और अपने स्थान पर उत्तराधिकारी होने के लिए एक नबी का अभिषेक किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “जिसने सीनै में फटकार, और होरेब में प्रतिशोध के न्यायादेश सुने।” यहाँ उपलब्ध हिब्रू पाठ यूनानी परंपरा से उल्लेखनीय रूप से भिन्न है।'
    reason: alternative_reading
  - marker: b
    text: इस संयुक्त जनीज़ा हिब्रू पाठ में “प्रतिशोध के कार्यों के लिए एक व्यक्ति” के पीछे का शब्द-विन्यास कुछ कठिन है; अनुवाद प्रसंग में उसके संभावित आशय का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: המושח
  choice: जिसने…अभिषेक किया
  rationale: इसे משח से निकला संबंधवाचक/कृदन्त रूप मानकर पिछले पद में एलिय्याह के वर्णन की निरंतरता के रूप में लिया गया है। हिन्दी में पूर्ण और स्वाभाविक संबंधवाचक वाक्यांश के लिए ‘जिसने’ जोड़ा गया है।
- source_word: מלא תשלומות
  choice: प्रतिशोध का बदला चुकाने के लिए एक जन
  rationale: संयुक्त जनीज़ा पाठ में यह पदबंध कठिन और कुछ अनिश्चित है। תשלומות में प्रतिदान, बदला या दण्डात्मक प्रतिफल का भाव है; प्रसंग में अभिषिक्त व्यक्ति न्याय-दण्ड का साधन है। מלא को यहाँ किसी व्यक्ति की ओर संकेत करता मानकर ‘एक जन’ कहा गया है और अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: ונביא
  choice: और…एक नबी को
  rationale: हिब्रू में निश्चित उपपद नहीं है, इसलिए ‘एक नबी’ स्वाभाविक है; प्रसंग में संकेत एलीशा की ओर है, पर मुख्य पाठ में उसका नाम नहीं जोड़ा गया।
- source_word: תחליף תחתיך
  choice: अपने स्थान पर…उत्तराधिकारी बनाया
  rationale: חלף और תחתיך का संयुक्त भाव किसी भूमिका में स्थान लेने या उत्तराधिकार का है। ‘अपने स्थान पर’ हिब्रू बिंब को बनाए रखता है, जबकि ‘उत्तराधिकारी बनाया’ वर्तमान हिन्दी में वाक्य का आशय स्पष्ट करता है।
theological_decisions:
- issue: सराख 48:7 के उपलब्ध हिब्रू पाठ और यूनानी समानांतर पाठ में उल्लेखनीय भिन्नता
  choice: मुख्य पाठ में हिब्रू साक्ष्य का अनुसरण करते हुए एलिय्याह द्वारा दण्ड के साधन का अभिषेक और अपने स्थान पर नबी को उत्तराधिकारी बनाने का वर्णन रखा गया है।
  alternative: 'यूनानी: ‘जिसने सीनै में फटकार सुनी, और होरेब में प्रतिशोध के न्याय-वचन।’'
  rationale: जहाँ हिब्रू उपलब्ध है, उसे प्राथमिक माना गया है। यूनानी परंपरा यहाँ पर्याप्त रूप से भिन्न है और धर्मवैज्ञानिक रूप से भी महत्त्वपूर्ण है, इसलिए उसे चुपचाप मिलाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रतिशोध का बदला चुकाना’ दण्डात्मक प्रतिफल के भाव को बनाए रखता है; पाठगत कठिनाई और यूनानी भिन्न पाठ को अलग-अलग पाद-टिप्पणियों में स्पष्ट किया गया है।
