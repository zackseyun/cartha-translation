translation:
  language: hi
  text: और जो अपनी माता का आदर करता है, वह खज़ाना जमा करनेवाले के समान है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: आदर करता है
  rationale: इस ज्ञान-साहित्य के संदर्भ में यह क्रिया माता को उचित सम्मान देने का भाव व्यक्त करती है; ‘आदर करता है’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक उपासना-संबंधी अर्थ से बचती है।
- source_word: ἀποθησαυρίζων
  choice: धन संचित करता है
  rationale: यह यूनानी कृदन्त किसी खजाने या मूल्यवान वस्तु को जमा करने का ठोस रूपक रखता है। ‘धन संचित करता है’ उस रूपक को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: μητέρα αὐτοῦ
  choice: अपनी माता
  rationale: यूनानी पद एकवचन में है और कर्ता की माता को सूचित करता है। हिन्दी में ‘अपनी माता’ संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὡς
  choice: मानो
  rationale: यह तुलना का सूचक है। यूनानी में स्पष्ट मुख्य क्रिया न होने के कारण ‘वह मानो’ जोड़ने से हिन्दी वाक्य पूर्ण होता है और उपमा सुरक्षित रहती है।
theological_decisions:
- issue: माता के आदर से जुड़ा प्रतिफल-रूपक
  choice: ‘धन संचित करता है’ की उपमा को खुला रखा गया है।
  alternative: इसे सांसारिक समृद्धि, स्वर्गीय प्रतिफल या सामान्य नैतिक लाभ के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ धन के स्वरूप या स्थान को नहीं बताता; इसलिए अनुवाद किसी विशेष प्रतिफल-सिद्धान्त को आरोपित नहीं करता।
