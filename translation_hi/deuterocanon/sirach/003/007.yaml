    text: या ‘मानो वे उसके प्रभु हों’; यूनानी शब्द पूर्ण अधिकार रखने वाले व्यक्तियों को दर्शाता है। यहाँ जन्म देने वालों के प्रति सम्मान के दायित्व को प्रबल उपमा से व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  choice: स्वामियों
  rationale: δεσπότης अधिकार रखने वाले व्यक्ति को दर्शाता है। यहाँ ‘स्वामियों’ माता-पिता के प्रति अधीन सेवा की प्रबल उपमा को बनाए रखता है, जबकि ‘मालिकों’ में स्वामित्व का भाव अनावश्यक रूप से प्रमुख हो सकता है।
- source_word: δουλεύσει
  choice: सेवा करेगा
  rationale: δουλεύω अधीन रहकर सेवा करने का अर्थ देता है। ‘सेवा करेगा’ स्वाभाविक आधुनिक हिन्दी है, और ‘स्वामियों के समान’ इस सेवा की प्रबलता को स्पष्ट रखता है।
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: अपने जन्मदाताओं की
  rationale: γεννήσασιν का शाब्दिक संकेत उसे जन्म देने वालों की ओर है। ‘जन्मदाताओं’ मूल की स्पष्ट वंशगत अभिव्यक्ति बनाए रखता है और सामान्य ‘माता-पिता’ की अपेक्षा यूनानी के अधिक निकट है।
theological_decisions:
- issue: संतान के दायित्व की उपमा की प्रबलता
  choice: जन्मदाताओं की सेवा ‘स्वामियों के समान’ करने की स्पष्ट उपमा बनाए रखी गई।
  alternative: वह अपने माता-पिता की आज्ञापूर्वक सेवा करेगा।
  rationale: यूनानी पाठ δεσπόταις और δουλεύσει के द्वारा जानबूझकर अधीनता की प्रबल छवि प्रस्तुत करता है। इसे केवल आदर या सामान्य देखभाल तक नरम करना स्रोत के नैतिक बल को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जन्मदाताओं’ मूल यूनानी की अभिव्यक्ति को सुरक्षित रखता है; ‘स्वामियों’ प्रबल अधिकार-संबंधी तुलना को बिना स्वामित्व का अनावश्यक अर्थ थोपे व्यक्त करता है।
