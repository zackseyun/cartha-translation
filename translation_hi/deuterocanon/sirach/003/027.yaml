  yaml_path: translation/deuterocanon/sirach/003/027.yaml
  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: hi
  text: आँख की पुतली[a] के बिना प्रकाश नहीं होता, और ज्ञान के बिना बुद्धि नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध यूनानी पाठ में यहाँ एक भिन्न कथन है: “कठोर हृदय पीड़ाओं से दब जाएगा, और पापी पाप पर पाप बढ़ाता जाएगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: के बिना
  rationale: यह अभाव को व्यक्त करता है और दोनों समानांतर वाक्यांशों में सहज, संक्षिप्त हिन्दी देता है।
- source_word: אִישׁוֹן
  choice: आँख की पुतली
  rationale: प्रकाश के संदर्भ में इसका आशय आँख की पुतली है। केवल ‘पुतली’ की अपेक्षा ‘आँख की पुतली’ सामान्य पाठक के लिए तुरंत स्पष्ट है।
- source_word: יֶחְסַר / תֶּחְסַר
  choice: की कमी होती है
  rationale: חסר के ‘कम होना/अभाव होना’ अर्थ को दोनों खंडों में एक ही रूप देकर इब्रानी की पुनरावृत्ति और संतुलन सुरक्षित रखा गया है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: यह मूल शब्द का सीधा अर्थ है और आँख की पुतली के ठोस बिंब के अनुकूल है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: यह शब्द का सामान्य अर्थ है और इसे ‘बुद्धि’ से अलग रखते हुए इब्रानी के वैचारिक भेद को बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: ज्ञान-साहित्य के संदर्भ में यह חָכְמָה का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
theological_decisions:
- issue: सिराख 3:27 के उपलब्ध इब्रानी और यूनानी पाठों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी कथन का अनुवाद किया गया है और यूनानी के भिन्न कथन को पाद-टिप्पणी में रखा गया है।
  alternative: 'यूनानी: “कठोर हृदय दुखों से दब जाएगा, और पापी पाप पर पाप बढ़ाता जाएगा।”'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वास-स्तर का है, इसलिए उसे प्राथमिकता दी गई है। यूनानी पाठ मामूली पाठांतर नहीं, बल्कि एक अलग सूक्ति देता है; अतः पाठकीय पारदर्शिता के लिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कहावत-जैसे समानांतर ढाँचे में रखी गई है। ‘की कमी होती है’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि इब्रानी के दोनों रूपों יֶחְסַר/תֶּחְסַר का संतुलन और अर्थ स्पष्ट रहे।
