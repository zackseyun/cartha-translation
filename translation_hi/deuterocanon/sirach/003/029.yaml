  yaml_path: translation/deuterocanon/sirach/003/029.yaml
  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: hi
  text: बुद्धिमान का हृदय बुद्धिमानों की सूक्तियों को[a] समझता है, और ध्यान देने वाला कान बुद्धि में आनन्द पाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूक्तियाँ’ का अनुवाद ‘नीतिवचन’ या ‘दृष्टान्त’ भी हो सकता है; यूनानी समानान्तर में एकवचन ‘दृष्टान्त’ है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानान्तर की दूसरी पंक्ति भिन्न है; उसका आशय लगभग यह है: ‘और सुनने वाले का कान किसी बुद्धिमान की अभिलाषा है।’ यहाँ मुख्य पाठ उपलब्ध हिब्रानी का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: बुद्धिमान का हृदय
  rationale: यह हिब्रानी रूपक बनाए रखता है; यहाँ ‘हृदय’ विचार और समझ की आन्तरिक क्षमता को दर्शाता है, केवल भावनाओं को नहीं।
- source_word: יָבִין
  choice: समझता है
  rationale: क्रिया בין यहाँ ज्ञानपूर्ण कथनों का अर्थ ग्रहण करने को व्यक्त करती है।
- source_word: מִשְׁלֵי חֲכָמִים
  choice: बुद्धिमानों की सूक्तियाँ
  rationale: מָשָׁל के अर्थ-क्षेत्र में सूक्ति, नीतिवचन और दृष्टान्त आते हैं। ‘सूक्तियाँ’ ज्ञान-साहित्य के संक्षिप्त शिक्षाप्रद कथनों को स्वाभाविक हिन्दी में व्यक्त करता है और अर्थ को केवल किसी एक साहित्यिक विधा तक सीमित नहीं करता।
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: ध्यान से सुनने वाला कान
  rationale: यह मूल का ठोस ‘कान’ रूपक रखते हुए קשב के सक्रिय, सावधान श्रवण का भाव स्पष्ट करता है।
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: बुद्धि से आनन्दित होता है
  rationale: שמח आनन्दित होने का भाव देता है। हिन्दी में ‘बुद्धि से आनन्दित’ हिब्रानी לְ के सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे अत्यधिक निश्चित किए।
theological_decisions:
- issue: यूनानी समानान्तर में दूसरी पंक्ति का भिन्न पाठ
  choice: मुख्य पाठ में उपलब्ध हिब्रानी ‘ध्यान से सुनने वाला कान बुद्धि से आनन्दित होता है’ का अनुसरण
  alternative: यूनानी के अनुसार लगभग ‘सुनने वाला कान बुद्धिमान की अभिलाषा है’
  rationale: दिए गए कार्य में उच्च-विश्वसनीयता वाला हिब्रानी पाठ प्राथमिक स्रोत है। वास्तविक पाठान्तर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज ज्ञान-साहित्यिक स्वर रखा गया है। ‘हृदय’ और ‘कान’ जैसे मूल हिब्रानी बिम्ब सुरक्षित हैं। ‘सूक्तियाँ’ साहित्यिक है, पर सामान्य पाठक के लिए बोधगम्य है; विकल्प पादटिप्पणी में दिए गए हैं।
