  yaml_path: translation/deuterocanon/sirach/003/024.yaml
  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
translation:
  language: hi
  text: क्योंकि मनुष्यों[a] की अटकलें[b] बहुत हैं, और बुरी कल्पनाएँ भटका देती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य की संतानें’ है; यह मनुष्यमात्र के लिए प्रयुक्त सामान्य अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त दुर्लभ इब्रानी शब्द का अर्थ ‘विचार,’ ‘तर्क,’ ‘धारणाएँ’ या ‘अनुमान’ भी हो सकता है। यूनानी समानांतर पाठ में ‘धारणा/मत’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत हैं
  rationale: यह बहुलता बताने वाला सामान्य विशेषण है; हिन्दी में विधेय के रूप में ‘बहुत हैं’ स्वाभाविक है।
- source_word: עֶשְׁתּוֹנֵי
  choice: अटकलें
  rationale: यह दुर्लभ और कुछ हद तक अनिश्चित इब्रानी शब्द है। प्रसंग और यूनानी ὑπόλημψις इसे मन में बनाई गई धारणाओं या अनुमानों के अर्थ में रखते हैं; ‘अटकलें’ चेतावनी के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: इब्रानी का शाब्दिक मुहावरा ‘मनुष्य की संतानें’ समस्त मानवजाति के लिए प्रयुक्त है। ‘मनुष्यों’ उसी सामूहिक अर्थ को स्पष्ट और सहज हिन्दी में देता है।
- source_word: דִמְיוֹנוֹת
  choice: कल्पनाएँ
  rationale: यह मन में गढ़ी हुई बातों या धारणाओं को सूचित करता है। ‘कल्पनाएँ’ अगले विशेषण ‘बुरी’ के साथ अर्थ को स्पष्ट रखता है।
- source_word: רָעוֹת
  choice: बुरी
  rationale: इब्रानी और यूनानी समानांतर दोनों नकारात्मक, संभवतः नैतिक, अर्थ रखते हैं; हिन्दी में ‘बुरी’ सरल और पर्याप्त रूप से गंभीर है।
- source_word: מַתְעוֹת
  choice: भटका देती हैं
  rationale: यह कारक क्रिया है—कल्पनाएँ सक्रिय रूप से गलत राह पर ले जाती हैं। कर्म का स्पष्ट उल्लेख मूल में नहीं है, इसलिए हिन्दी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: בְּנֵי אָדָם का मानवजाति-सूचक मुहावरा
  choice: मनुष्यों
  alternative: मनुष्य की संतानों
  rationale: यहाँ पदबंध कोई मसीही उपाधि नहीं, बल्कि मनुष्यमात्र के लिए सामान्य सामी मुहावरा है। सहज सामूहिक रूप अर्थ को सुरक्षित रखता है, जबकि पादटिप्पणी शाब्दिक बनावट बताती है।
- issue: מַתְעוֹת का अनिर्दिष्ट कर्म
  choice: भटका देती हैं
  alternative: उन्हें भटका देती हैं
  rationale: इब्रानी पंक्ति में क्रिया का कर्म व्यक्त नहीं है। अनिर्दिष्ट रूप कथन को सामान्य रखता और मूल की संक्षिप्तता तथा अस्पष्टता को बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, ज्ञान-साहित्य के अनुरूप और गरिमापूर्ण वाक्य। ‘अटकलें’ दुर्लभ शब्द की अनिश्चितता और स्वयं गढ़ी धारणाओं के चेतावनीपूर्ण भाव को व्यक्त करता है; पादटिप्पणी अन्य संभावित अर्थ सुरक्षित रखती है।
