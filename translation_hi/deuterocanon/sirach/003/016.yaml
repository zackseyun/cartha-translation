base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/016.yaml
  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: hi
  text: क्योंकि जो अपने पिता को तुच्छ समझता है, वह उद्दंड है[a]; और जो अपनी माता को शाप देता है, वह अपने सृष्टिकर्ता को क्रोधित करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धृष्टता से काम करता है।” यूनानी समानांतर पाठ में है, “ईशनिंदक है।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ इस अर्धवाक्य को भिन्न रूप में देता है: “जो अपनी माता को क्रोधित करता है, वह प्रभु द्वारा शापित है।” इब्रानी में है कि अपनी माता को शाप देने वाला अपने सृष्टिकर्ता को क्रोधित करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵזִיד
  choice: उद्दंड है
  rationale: यह शब्द घमंडी और धृष्ट आचरण का बोध कराता है। ‘उद्दंड’ आधुनिक हिन्दी में इसकी नैतिक कठोरता को स्वाभाविक ढंग से व्यक्त करता है, बिना यूनानी पाठ के अधिक विशिष्ट ‘ईशनिंदक’ अर्थ को मूल इब्रानी पर थोपे।
- source_word: בּוֹזֶה
  choice: तुच्छ समझता है
  rationale: בזה का अर्थ किसी को हेय या घृणा के योग्य मानना है। ‘तुच्छ समझता है’ स्पष्ट और सहज हिन्दी है तथा माता-पिता के सम्मान के प्रसंग के अनुकूल है।
- source_word: אָבִיו
  choice: अपने पिता को
  rationale: इब्रानी में संबंधसूचक प्रत्यय स्पष्ट है; हिन्दी में कर्ता के साथ स्वाभाविक संबंध दिखाने के लिए ‘अपने’ रखा गया है।
- source_word: מַכְעִיס
  choice: क्रोधित करता है
  rationale: כעס का हिफ़ील कृदंत किसी को क्रोध दिलाने या उकसाने का कारक अर्थ रखता है। वाक्य-विन्यास में इसका कर्म ‘अपने सृष्टिकर्ता को’ है।
- source_word: בּוֹרְאוֹ
  choice: अपने सृष्टिकर्ता को
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसके सृष्टिकर्ता’ है। यहाँ यह מַכְעִיס का कर्म है, इसलिए हिन्दी में ‘अपने सृष्टिकर्ता को क्रोधित करता है’ किया गया है।
- source_word: מְקַלֵּל
  choice: शाप देता है
  rationale: यह קלל का पिएल कृदंत है और यहाँ सक्रिय अर्थ ‘शाप देने वाला’ रखता है। निकटवर्ती אִמּוֹ इसका कर्म है; अतः इसे कर्मवाच्य ‘शापित है’ नहीं बनाया गया।
- source_word: אִמּוֹ
  choice: अपनी माता को
  rationale: इब्रानी संबंधसूचक प्रत्यय को बनाए रखते हुए और हिन्दी में कर्ता के साथ संबंध स्वाभाविक बनाने के लिए ‘अपनी’ रखा गया है।
theological_decisions:
- issue: दूसरे अर्धवाक्य में इब्रानी शब्दों का कर्ता-कर्म संबंध
  choice: जो अपनी माता को शाप देता है, वह अपने सृष्टिकर्ता को क्रोधित करता है
  alternative: जो अपनी माता को क्रोधित करता है, वह अपने सृष्टिकर्ता द्वारा शापित है
  rationale: 'इब्रानी का क्रम ומכעיס בוראו מקלל אמו दो समानार्थक कृदंतीय पदों को जोड़ता है: ‘अपनी माता को शाप देने वाला’ अपने ‘सृष्टिकर्ता को क्रोधित करता है।’ בוראו स्वाभाविक रूप से מַכְעִיס का कर्म और אמו מְקַלֵּל का कर्म है। यूनानी पाठ अलग संरचना प्रस्तुत करता है, पर विद्यमान उच्च-विश्वास वाले इब्रानी साक्ष्य को मुख्य पाठ में प्राथमिकता दी गई है।'
- issue: מֵזִיד को यूनानी βλάσφημος के प्रकाश में कितनी तीव्रता से व्यक्त किया जाए
  choice: उद्दंड है
  alternative: ईशनिंदक है
  rationale: इब्रानी शब्द घमंडी धृष्टता या उद्दंडता बताता है, जबकि यूनानी पाठ इसे अधिक विशिष्ट धार्मिक आरोप ‘ईशनिंदक’ के रूप में तीव्र करता है। मुख्य पाठ में इब्रानी का व्यापक अर्थ रखा गया और यूनानी भिन्नता पादटिप्पणी में दी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पिता’, ‘माता’ और ‘सृष्टिकर्ता’ औपचारिक-बाइबिलीय गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास सहज हिन्दी का है।
