base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: hi
  text: जो अद्भुत बातें तुम्हारी पहुँच से परे हैं, उनकी खोज न करो[a]; और जो तुमसे छिपी हैं, उनकी छानबीन न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, यूनानी समानांतर के अधिक निकट: “जो तुमसे अधिक कठिन है, उसे मत खोजो; और जो तुमसे अधिक शक्तिशाली है, उसकी जाँच मत करो।” इब्रानी पाठ अत्यन्त अद्भुत और छिपी हुई बातों पर बल देता है; यूनानी पाठ उन बातों पर जो मनुष्य की क्षमता से बढ़कर हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת מִמְּךָ
  choice: जो अद्भुत बातें तुम्हारी पहुँच से परे हैं
  rationale: פְּלָאוֹת असाधारण या विस्मयकारी बातों को दर्शाता है। מִמְּךָ यहाँ ऐसी बातों की ओर संकेत करता है जो व्यक्ति की उचित पहुँच या क्षमता से बाहर हैं। यह अनुवाद इब्रानी के ‘अद्भुत’ बिंब और प्रसंगगत सीमा—दोनों को बनाए रखता है।
- source_word: אַל תִּדְרוֹשׁ
  choice: उनकी खोज न करो
  rationale: דרש का अर्थ खोज करना, पूछताछ करना या जानने का प्रयत्न करना हो सकता है। ‘खोज न करो’ संक्षिप्त, स्वाभाविक और निषेधात्मक आज्ञा के अनुरूप है।
- source_word: וּמְכֻסֶּה מִמְּךָ
  choice: जो तुमसे छिपी हैं
  rationale: כסה से बना रूप ढकी या छिपी हुई बात को दर्शाता है। ‘तुमसे छिपी’ इब्रानी समानांतरता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אַל תַּחְקוֹר
  choice: उनकी छानबीन न करो
  rationale: חקר गहराई से जाँचने, खोज निकालने या तह तक पहुँचने का भाव रखता है। ‘छानबीन’ पहले खंड के ‘खोज’ की अपेक्षा अधिक गहन जाँच का संकेत देती है।
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: यूनानी समानांतर के आधार पर ‘तुम्हारी पहुँच से परे’ के अर्थ की पुष्टि
  rationale: यूनानी पाठ शब्दशः इब्रानी से भिन्न है, पर कठिन या सामर्थ्य से बढ़कर बातों की जाँच न करने की चेतावनी देता है। इसलिए वह मानवीय क्षमता की सीमा के अर्थ का समर्थन करता है।
theological_decisions:
- issue: क्या यह पद हर प्रकार के धार्मिक या दैवी रहस्यों के अध्ययन को रोकता है, अथवा मनुष्य की उचित पहुँच से परे बातों के पीछे पड़ने से सावधान करता है?
  choice: इसे अपनी उचित पहुँच या उपलब्ध प्रकाशन से परे बातों की खोज के विरुद्ध ज्ञान-साहित्य की चेतावनी के रूप में रखा गया है।
  alternative: इसे समस्त धर्मवैज्ञानिक जाँच पर पूर्ण प्रतिबंध, या केवल घमंडी अटकलबाज़ी के विरुद्ध चेतावनी माना जा सकता है।
  rationale: इब्रानी में ‘अद्भुत’ और ‘छिपी’ बातें तथा यूनानी में व्यक्ति से अधिक कठिन या शक्तिशाली बातें मानव सीमा पर बल देती हैं। अनुवाद नम्रता की चेतावनी को व्यक्त करता है, पर हर प्रकार की जाँच को निषिद्ध घोषित करके तनाव का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ज्ञान-साहित्य की शैली अपनाई गई है। ‘अद्भुत बातें’, ‘खोज’ और ‘छानबीन’ इब्रानी समानांतरता तथा दोनों क्रियाओं की बढ़ती गहनता को स्पष्ट रखते हैं।
