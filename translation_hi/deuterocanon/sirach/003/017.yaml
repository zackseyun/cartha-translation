  yaml_path: translation/deuterocanon/sirach/003/017.yaml
  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: hi
  text: हे मेरे पुत्र[a], अपनी समृद्धि में नम्रता से चल, और तू भेंट देनेवाले से भी अधिक प्रिय होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “हे संतान, अपने काम नम्रता से कर, और किसी स्वीकार्य व्यक्ति द्वारा प्रेम किया जाएगा।” इसके विपरीत इब्रानी साक्ष्य में है: “हे मेरे पुत्र, अपनी समृद्धि में नम्रता से चल, और तू भेंट देनेवाले से भी अधिक प्रिय होगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: पुल्लिंग एकवचन संज्ञा और प्रथम पुरुष प्रत्यय वाले सीधे संबोधन को सुरक्षित रखता है; यूनानी समानांतर में अधिक सामान्य अर्थ वाला ‘संतान’ है।
- source_word: בְּעָשְׁרְךָ
  choice: अपनी समृद्धि में
  rationale: עֹשֶׁר धन-संपन्नता या समृद्धि की अवस्था बताता है। ‘समृद्धि’ केवल धनराशि तक अर्थ को सीमित किए बिना मूल भाव रखता है।
- source_word: הִתְהַלֵּךְ
  choice: चल
  rationale: הלך के हित्पएल आज्ञार्थक का जीवन-व्यवहार संबंधी रूपक सुरक्षित रहता है और हिन्दी बाइबलीय गद्य में सुबोध है।
- source_word: בַּעֲנָוָה
  choice: नम्रता से
  rationale: ענוה का नैतिक अर्थ नम्रता/दीनता है; ‘नम्रता से’ आधुनिक हिन्दी में सहज है।
- source_word: וְתֵאָהֵב
  choice: और तू ... प्रिय होगा
  rationale: निफ़अल अपूर्ण रूप निष्क्रिय परिणाम व्यक्त करता है—संबोधित व्यक्ति दूसरों का प्रिय होगा।
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: भेंट देनेवाले से भी अधिक
  rationale: तुलनात्मक מן और कृदंतीय पदबंध दोनों को स्पष्ट तथा संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और भिन्न यूनानी समानांतर के बीच पाठ-चयन
  choice: 'मुख्य पाठ में इब्रानी साक्ष्य का अनुसरण: समृद्धि में नम्रता से चलना और भेंट देनेवाले से अधिक प्रिय होना।'
  alternative: 'यूनानी के अनुसार: ‘हे संतान, अपने काम नम्रता से कर, और किसी स्वीकार्य व्यक्ति द्वारा प्रेम किया जाएगा।’'
  rationale: यहाँ इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए वही मुख्य पाठ का आधार है। यूनानी में दोनों अर्धपंक्तियाँ उल्लेखनीय रूप से भिन्न हैं; इस वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज उपदेशात्मक शैली। एकवचन आत्मीय संबोधन के लिए ‘तू’ रखा गया है, जो ‘मेरे पुत्र’ के पारिवारिक संबोधन और इब्रानी एकवचन रूपों से मेल खाता है। ‘चल’ मूल जीवन-मार्ग रूपक को बनाए रखता है।
