  yaml_path: translation/deuterocanon/sirach/003/011.yaml
  text: For a man's honor is the honor of his father, and one who dishonors his mother multiplies sin.
translation:
  language: hi
  text: मनुष्य का सम्मान उसके पिता का सम्मान है, और जो अपनी माता का अपमान करता है,[a] वह पाप बढ़ाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपनी माता को शाप देता है।” इब्रानी क्रिया का यह अधिक विशिष्ट अर्थ हो सकता है; पर यहाँ सम्मान और अपमान का समानांतर भाव तथा यूनानी साक्ष्य व्यापक अर्थ “अपमान करता है” का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ है: “क्योंकि मनुष्य का गौरव उसके पिता के सम्मान से आता है, और अपमानित माता उसकी सन्तानों के लिए बदनामी है।” इसकी दूसरी पंक्ति उपलब्ध इब्रानी पाठ से कुछ भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: सम्मान
  rationale: इस नीतिपरक और पारिवारिक संदर्भ में यह शब्द बाहरी वैभव से अधिक सामाजिक मान-सम्मान और प्रतिष्ठा को व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में शब्द पुल्लिंग एकवचन है और यहाँ कहावत में प्रतिनिधि व्यक्ति के अर्थ में प्रयुक्त है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और पुरुषवाचक स्रोत-रूप को अनावश्यक रूप से जैविक ‘पुरुष’ तक सीमित नहीं करता।
- source_word: כִּבּוּד אָבִיו
  choice: उसके पिता का सम्मान
  rationale: इब्रानी कथन संक्षिप्त और समानाधिकरणात्मक है। यह अनुवाद पुत्र के सम्मान और पिता के सम्मान के बीच निकट पहचान को बनाए रखता है; यूनानी पाठ में मिलने वाले ‘पिता के सम्मान से’ अर्थ को मुख्य पाठ में थोपता नहीं।
- source_word: וּמַרְבֶּה
  choice: बढ़ाता है
  rationale: हिफ़ील रूप किसी वस्तु में वृद्धि करने का सक्रिय भाव देता है। ‘बढ़ाता है’ सहज हिन्दी में इसी कारक अर्थ को व्यक्त करता है।
- source_word: חֵטְא
  choice: पाप
  rationale: यह संज्ञा नैतिक अपराध या पाप को दर्शाती है; इस उपदेशात्मक संदर्भ में ‘पाप’ सबसे सीधा और पारदर्शी विकल्प है।
- source_word: מְקַלֵּל אִמּוֹ
  choice: अपनी माता का अपमान करता है
  rationale: पिएल रूप का विशिष्ट अर्थ ‘शाप देना’ हो सकता है, पर वह तिरस्कार या अनादर करना भी व्यक्त कर सकता है। पहली पंक्ति के सम्मान-विषय और यूनानी समानांतर के अपमान/बदनामी वाले भाव के कारण व्यापक अर्थ ‘अपमान करता है’ मुख्य पाठ में उपयुक्त है; संकीर्ण विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: कहावत के कर्ता का लिंग
  choice: मनुष्य का सम्मान
  alternative: पुरुष का सम्मान / व्यक्ति का सम्मान
  rationale: אִישׁ पुल्लिंग एकवचन है, पर यहाँ कहावत में प्रतिनिधि अर्थ रखता है। ‘मनुष्य’ स्रोत के मानव-संदर्भ को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- issue: माता के प्रति מְקַלֵּל का अर्थ
  choice: अपनी माता का अपमान करता है
  alternative: अपनी माता को शाप देता है
  rationale: सम्मान और अपमान का समानांतर संबंध तथा यूनानी साक्ष्य व्यापक अनादर के अर्थ का समर्थन करते हैं। फिर भी ‘शाप देना’ वास्तविक शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में दिया गया है।
- issue: पहली और दूसरी पंक्ति का संबंध
  choice: इब्रानी के समानाधिकरणात्मक कथन को मुख्य पाठ में रखना
  alternative: मनुष्य का सम्मान उसके पिता के सम्मान से आता है
  rationale: प्राप्त इब्रानी पाठ में ‘से’ का स्पष्ट चिह्न नहीं है, जबकि यूनानी पाठ व्युत्पत्ति का संबंध दिखाता है। मुख्य पाठ इब्रानी की संक्षिप्तता और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन-सदृश शैली अपनाई गई है। ‘माता’ और ‘पिता’ औपचारिक किंतु सामान्य पाठकों के लिए सहज हैं। इब्रानी मुख्य स्रोत को प्रधानता दी गई है और यूनानी भिन्नता पादटिप्पणी में रखी गई है।
