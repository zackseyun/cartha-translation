lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: अपनी बड़ाई मत खोजो
  rationale: निषेध के साथ प्रयुक्त כבד के हित्पाएल रूप में अपने लिए आदर या प्रतिष्ठा पाने का भाव है। यह अनुवाद उस आत्मवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे केवल ‘डींग मारने’ तक सीमित नहीं करता।
- source_word: בְּקְלוֹן אָבִיךָ
  choice: अपने पिता के अपमान में
  rationale: קָלוֹן का अर्थ अपमान, लज्जा या अनादर है। בְּ संबंध या साधन—दोनों का संकेत दे सकता है; मुख्य पाठ में ‘में’ रखकर इब्रानी संरचना और उसकी अस्पष्टता को यथासंभव बनाए रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: यह तुम्हारे लिए सम्मान की बात नहीं है
  rationale: כָבוֹד यहाँ सम्मान, गौरव या प्रतिष्ठा का सूचक है। यह रूप मूल की संज्ञात्मक संरचना और नैतिक निष्कर्ष दोनों को सहज हिन्दी में रखता है।
