  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: hi
  text: धधकती आग को पानी बुझा देता है; उसी प्रकार दान[a] पाप का प्रायश्चित करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नेकी”; हिब्रू शब्द का अर्थ “धार्मिकता” भी हो सकता है, पर यूनानी समानांतर में “दान” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “पापों” (बहुवचन) है; हिब्रू का “पाप” यहाँ सामान्य या सामूहिक अर्थ में हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: धधकती आग
  rationale: यह पदबंध तीव्रता से जलती हुई आग का चित्र प्रस्तुत करता है; यूनानी φλογιζόμενον भी इसी अर्थ की पुष्टि करता है।
- source_word: יכבו מים
  choice: पानी बुझा देता है
  rationale: हिब्रू में क्रिया बहुवचन है और מים रूप की दृष्टि से बहुवचन है, पर हिन्दी में ‘पानी’ सामूहिक एकवचन और ‘बुझा देता है’ स्वाभाविक प्रयोग है।
- source_word: כן
  choice: उसी प्रकार
  rationale: यह दोनों अर्धपंक्तियों के बीच स्पष्ट उपमा-संबंध बनाए रखता है और हिन्दी में लोकोक्तिपरक शैली देता है।
- source_word: צדקה
  choice: दान
  rationale: צדקה का व्यापक अर्थ ‘धार्मिकता/नेकी’ भी हो सकता है, पर यहाँ यूनानी ἐλεημοσύνη और प्रसंग जरूरतमंद को दान देने का ठोस अर्थ समर्थित करते हैं। ‘दान’ आधुनिक हिन्दी में ‘भिक्षादान’ से अधिक सहज है।
- source_word: תכפר
  choice: प्रायश्चित करता है
  rationale: पिएल रूप כפר पाप के लिए प्रायश्चित करने का अर्थ देता है; यूनानी ἐξιλάσεται भी यही प्रायश्चित-संबंधी बल रखता है। इसे कमजोर करके ‘भरपाई करता है’ नहीं किया गया।
- source_word: חטאת
  choice: पाप
  rationale: यहाँ अर्थ पाप अथवा दोष है, पापबलि नहीं। हिब्रू एकवचन को जातिवाचक रूप में रखा गया है।
theological_decisions:
- issue: दान और पाप के प्रायश्चित का संबंध
  choice: ‘दान पाप का प्रायश्चित करता है’
  alternative: ‘धार्मिकता पाप का प्रायश्चित करती है’
  rationale: हिब्रू צדקה दोनों अर्थों की संभावना रखता है, किंतु यूनानी समानांतर विशेष रूप से दान/करुणा-दान का संकेत देता है। कथन के धार्मिक तनाव को नरम किए बिना मूल प्रायश्चित-भाषा सुरक्षित रखी गई है।
- issue: पाप का वचन
  choice: हिब्रू के अनुसार एकवचन ‘पाप’
  alternative: यूनानी के अनुसार बहुवचन ‘पापों’
  rationale: हिब्रू पाठ को प्राथमिकता दी गई है; हिन्दी में एकवचन ‘पाप’ को सामान्य या सामूहिक अर्थ में समझा जा सकता है, जबकि यूनानी पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक वाक्य। ‘धधकती आग’ ठोस बिंब को बनाए रखता है; ‘दान’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी हिब्रू की अर्थ-व्याप्ति सुरक्षित रखती है।
