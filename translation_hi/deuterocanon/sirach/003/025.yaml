base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/025.yaml
  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
translation:
  language: hi
  text: भारी मन का अन्त विनाशकारी होगा[b][a], और जो अच्छी वस्तुओं से प्रेम करता है, वह उन्हीं के द्वारा संचालित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “कठोर हृदय अन्त में पीड़ित होगा।” इब्रानी का शाब्दिक अर्थ है: “भारी मन अपने अन्त में दुर्गन्धित हो जाएगा।”'
    reason: alternative_reading
  - marker: b
    text: या “सड़ जाएगा” अथवा “दुर्गन्धित हो जाएगा”—इब्रानी क्रिया का मूल अर्थ सड़ना या दुर्गन्धित होना है; यहाँ यह विनाशकारी परिणाम व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: भारी मन
  rationale: इब्रानी का शाब्दिक अर्थ ‘भारी हृदय/मन’ है। आधुनिक हिन्दी में ‘भारी मन’ स्वाभाविक है और यूनानी समानांतर के ‘कठोर हृदय’ को मुख्य पाठ में मिलाए बिना मूल बिंब बनाए रखता है।
- source_word: תִּבְאַשׁ
  choice: विनाश होगा
  rationale: क्रिया का मूल अर्थ ‘दुर्गन्धित होना/सड़ना’ है, पर यहाँ אַחֲרִיתוֹ के साथ यह बुरे और विनाशकारी परिणाम को सूचित करती है। अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אַחֲרִיתוֹ
  choice: का अन्त
  rationale: यह शब्द अन्तिम दशा या परिणाम को दर्शाता है। ‘का अन्त’ इब्रानी संरचना के निकट रहते हुए हिन्दी में कथन का चेतावनीपूर्ण भाव बनाए रखता है।
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: और जो अच्छी वस्तुओं से प्रेम करता है
  rationale: טוֹבוֹת व्यापक है और अच्छी वस्तुओं, लाभों या सुखद बातों की ओर संकेत कर सकता है। ‘अच्छी वस्तुएँ’ इस अर्थगत खुलेपन को बनाए रखती हैं।
- source_word: יִנְהַג בָּהֶם
  choice: वह उन्हीं के द्वारा चलाया जाएगा
  rationale: נהג का सामान्य अर्थ चलाना, ले जाना या मार्ग दिखाना है। निष्क्रिय हिन्दी रचना यह तनाव बनाए रखती है कि जिन अच्छी वस्तुओं से व्यक्ति प्रेम करता है, वही उसकी दिशा निर्धारित करती हैं।
theological_decisions:
- issue: इब्रानी ‘भारी मन’ और यूनानी समानांतर ‘कठोर हृदय’
  choice: मुख्य पाठ में ‘भारी मन’
  alternative: कठोर हृदय
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिक रखा गया है। यूनानी पाठ संभवतः भिन्न मूलपाठ या व्याख्यात्मक अनुवाद को दर्शाता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: लोकोक्तिपरक सामान्य कर्ता
  choice: ‘जो ... करता है’
  alternative: ‘वह पुरुष जो ...’
  rationale: इब्रानी कथन सामान्य मानवीय विषय के बारे में है, केवल पुरुष के बारे में नहीं। आधुनिक हिन्दी की संबंधवाचक रचना इस सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। ‘हृदय’ की अपेक्षा ‘मन’ सामान्य हिन्दी में आन्तरिक नैतिक-मानसिक अवस्था को अधिक स्वाभाविक ढंग से व्यक्त करता है। पादटिप्पणी-चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में रखे गए हैं।
