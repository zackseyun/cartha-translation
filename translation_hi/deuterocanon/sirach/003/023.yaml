base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/023.yaml
  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: hi
  text: जो तुम्हारी पहुँच से परे है, उसकी छानबीन मत करो[a], क्योंकि तुम्हें तुम्हारी क्षमता से बढ़कर बातें दिखा दी गई हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने से बड़ी बातों की खोजबीन मत करो।” इब्रानी क्रिया का अर्थ निश्चित नहीं है; यूनानी समानांतर में है, “अपने बहुत-से कामों में अति-जिज्ञासु मत बनो।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी को इस प्रकार भी पढ़ा जा सकता है: “क्योंकि तुमने अपनी क्षमता से बढ़कर बहुत-सी बातें देखी हैं”; पर यूनानी समानांतर निष्क्रिय अर्थ, “तुम्हें दिखाया गया है,” का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: जो बातें तुम्हारी समझ से परे हैं
  rationale: यह वाक्यांश उन विषयों की ओर संकेत करता है जो मनुष्य की उचित सीमा या क्षमता से बाहर हैं। ‘समझ से परे’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगानुसार बौद्धिक सीमा को स्पष्ट करता है।
- source_word: אַל תַּמֵּר
  choice: उनकी छानबीन मत करो
  rationale: इब्रानी क्रिया कठिन है, पर यूनानी μὴ περιεργάζου सीमा से बाहर जाकर जिज्ञासापूर्वक खोजबीन करने के विरुद्ध चेतावनी की पुष्टि करती है। ‘छानबीन मत करो’ सक्रिय अन्वेषण का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: רַב מִמְּךָ
  choice: जो तुम्हारे लिए बहुत बड़ी हैं
  rationale: यह मनुष्य की माप या सामर्थ्य से बढ़कर बातों को दर्शाता है। ‘तुम्हारे लिए बहुत बड़ी’ तुलनात्मक भाव और मानवीय सीमा दोनों बनाए रखता है।
- source_word: הָרְאֵיתָ
  choice: वे तुम्हें दिखाई जा चुकी हैं
  rationale: इब्रानी रूप सक्रिय अर्थ ‘तुमने देखी हैं’ की अनुमति दे सकता है, किंतु यूनानी ὑπεδείχθη σοι निष्क्रिय अर्थ का प्रबल समर्थन करता है। यह चयन उस वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखते हुए मुख्य वाक्य को सुसंगत बनाता है।
theological_decisions:
- issue: הָרְאֵיתָ का वाच्य और यूनानी समानांतर से उसका संबंध
  choice: 'निष्क्रिय अर्थ: ‘वे तुम्हें दिखाई जा चुकी हैं’'
  alternative: 'सक्रिय अर्थ: ‘तुमने अपनी सीमा से परे बहुत-सी बातें देखी हैं’'
  rationale: उपलब्ध इब्रानी रूप सक्रिय रूप में समझा जा सकता है, पर यूनानी समानांतर स्पष्टतः निष्क्रिय भाव देता है। निष्क्रिय पाठ मानवीय सीमाओं और पहले से मिले प्रकाशन के बीच की नीतिपरक तनावपूर्ण संगति बनाए रखता है, बिना किसी बाद की विशिष्ट धर्मसैद्धांतिक व्याख्या को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘छानबीन’ अतिजिज्ञासापूर्ण खोज का भाव देता है, जबकि दोनों पादटिप्पणियाँ इब्रानी की वास्तविक शाब्दिक और वाच्यगत अनिश्चितता को सुरक्षित रखती हैं।
