translation:
  language: hi
  text: जिस बात की आज्ञा तुम्हें दी गई है, उसी पर मनन करो[a]; छिपी हुई बातों से तुम्हारा कोई काम नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अर्थ हो सकता है: “जिसके लिए तुम्हें अनुमति दी गई है” या “जिसके लिए तुम्हें अधिकृत किया गया है”; यूनानी समानांतर में: “जिस बात की आज्ञा तुम्हें दी गई है।”'
    reason: इब्रानी और यूनानी पाठों के बीच वैकल्पिक पाठ/अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ
  choice: जिस बात की आज्ञा तुम्हें दी गई है
  rationale: בַּמֶּה विचार की विषय-वस्तु बताता है। הוּרְשֵׁיתָ अपने आप में ‘जिसकी अनुमति/जिसका अधिकार तुम्हें दिया गया’ का अर्थ दे सकता है, जबकि यूनानी समानांतर προσετάγη स्पष्ट रूप से ‘आज्ञा दी गई’ पढ़ता है। मुख्य पाठ यूनानी से समर्थित दायित्व के भाव को रखता है और इब्रानी भिन्नता को पादटिप्पणी में सुरक्षित करता है।
- source_word: הִתְבּוֹנֵן
  choice: मनन करो
  rationale: यह क्रिया किसी विषय पर ध्यानपूर्वक विचार करने का निर्देश देती है। ‘मनन करो’ ज्ञान-साहित्य के प्रसंग में स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: וְאֵין לְךָ עֵסֶק
  choice: तुम्हारा कोई काम नहीं
  rationale: इब्रानी मुहावरा बताता है कि वह विषय संबोधित व्यक्ति के उचित सरोकार या कार्य-क्षेत्र में नहीं है। यह हिन्दी अभिव्यक्ति निषेधात्मक बल को सहज रूप में बनाए रखती है।
- source_word: בְּנִסְתָּרוֹת
  choice: छिपी हुई बातों से
  rationale: यह बहुवचन उन विषयों की ओर संकेत करता है जो मनुष्य से छिपे हैं। ‘रहस्य’ बाद की विशिष्ट धर्मवैज्ञानिक धारणाएँ जगा सकता है, इसलिए अधिक सीधा रूप चुना गया है।
theological_decisions:
- issue: इब्रानी הוּרְשֵׁיתָ और यूनानी προσετάγη के बीच अर्थांतर
  choice: मुख्य पाठ में ‘आज्ञा तुम्हें दी गई है’
  alternative: ‘जिसकी अनुमति तुम्हें दी गई है’ अथवा ‘जो तुम्हें सौंपा गया है’
  rationale: उपलब्ध इब्रानी पाठ अनुमति या अधिकार दिए जाने की ओर झुकता है, पर यूनानी समानांतर स्पष्ट आदेश का भाव देता है। स्रोत में दर्ज मामूली असंगति को देखते हुए मुख्य पाठ में यूनानी-समर्थित अर्थ रखा गया है और वास्तविक इब्रानी विकल्प पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ज्ञान-साहित्यिक शैली। ‘उसी पर’ निर्देशित विषय की सीमा पर बल देता है; ‘तुम्हारा कोई काम नहीं’ मूल इब्रानी मुहावरे की चेतावनी को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
