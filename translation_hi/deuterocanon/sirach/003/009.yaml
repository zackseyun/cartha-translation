  yaml_path: translation/deuterocanon/sirach/003/009.yaml
  text: A father's blessing establishes roots[a], but a mother's curse uproots a plant.
translation:
  language: hi
  text: पिता का आशीर्वाद जड़ जमाता है[a], पर माँ का शाप पौधा उखाड़ देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “क्योंकि पिता का आशीर्वाद बच्चों के घरों को दृढ़ करता है, पर माँ का शाप नींवों को उखाड़ देता है।” इब्रानी साक्ष्य में इसके स्थान पर कृषि-बिंब—“जड़” और “पौधा”—है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: पिता का आशीर्वाद
  rationale: यह स्वाभाविक हिन्दी में इब्रानी की संबंधवाचक रचना और पिता द्वारा दिए गए आशीर्वाद, दोनों को स्पष्ट रखता है।
- source_word: תְּיַסֵּד
  choice: दृढ़ करता है
  rationale: יסד का अर्थ नींव डालना या स्थिर स्थापित करना है। जड़ों के साथ ‘दृढ़ करता है’ हिन्दी में स्वाभाविक है और स्थायित्व का भाव सुरक्षित रखता है।
- source_word: שֹׁרֶשׁ
  choice: जड़ें
  rationale: इब्रानी में कृषि-बिंब स्पष्ट है। हिन्दी में बहुवचन ‘जड़ें’ यहाँ सामूहिक अर्थ को सहजता से व्यक्त करता है।
- source_word: וְקִלְלַת אֵם
  choice: पर माँ का शाप
  rationale: וְ को विरोधसूचक ‘पर’ कहना दोनों पंक्तियों के स्पष्ट प्रतिलोम समानांतर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּנְתּשׁ
  choice: उखाड़ देता है
  rationale: इस संदर्भ में क्रिया जमीन से खींचकर निकालने का भाव देती है; यह कृषि-बिंब को सजीव और स्पष्ट रखती है।
- source_word: נֶטַע
  choice: लगाया हुआ पौधा
  rationale: शब्द किसी रोपी गई वस्तु या पौधे को दर्शाता है। ‘लगाया हुआ पौधा’ रोपण के भाव को स्पष्ट करते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: इब्रानी और यूनानी में भिन्न मुख्य बिंब
  choice: इब्रानी का कृषि-बिंब—‘जड़ें ... लगाया हुआ पौधा’—मुख्य पाठ में रखा गया।
  alternative: यूनानी के अनुसार ‘पिता का आशीर्वाद बच्चों के घरों को दृढ़ करता है, पर माँ का शाप नींवें उखाड़ देता है।’
  rationale: उपलब्ध इब्रानी पाठ उच्च-विश्वसनीय, सुसंगत और स्पष्ट है, इसलिए वही मुख्य आधार है। यूनानी का अलग वास्तु-बिंब पाठांतर या व्याख्यात्मक रूपांतरण के रूप में पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। पिता और माँ की समांतरता तथा आशीर्वाद और शाप का विरोध स्पष्ट रखा गया है।
