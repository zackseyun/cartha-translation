  yaml_path: translation/deuterocanon/sirach/003/031.yaml
  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: hi
  text: भलाई करनेवाला अपने चाल-चलन के कारण धन्य कहलाएगा[a], और जब वह लड़खड़ाएगा, तब उसे सहारा मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “उपकारों का बदला चुकानेवाला आगे आनेवाली बातों को स्मरण रखता है।” यूनानी का पहला चरण उपलब्ध इब्रानी पाठ से काफी भिन्न है, यद्यपि दोनों के दूसरे चरण में गिरने के समय सहारा मिलने की बात है।'
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  choice: भलाई करनेवाला
  rationale: यह इब्रानी के एकवचन कृदंत का स्वाभाविक और संक्षिप्त हिन्दी रूप है; यह प्रतिनिधिक अर्थ को बनाए रखता है और अनावश्यक रूप से केवल वयस्क पुरुष तक अर्थ सीमित नहीं करता।
- source_word: יקראנו
  choice: धन्य कहलाएगा
  rationale: शाब्दिक रूप 'उसे पुकारेगा/कहेगा' है, पर संदर्भ में उसके आचरण के कारण सार्वजनिक सराहना या धन्य ठहराया जाना निहित है।
- source_word: בדרכיו
  choice: अपने चाल-चलन के कारण
  rationale: '''उसके मार्गों में/के द्वारा'' का ज्ञान-साहित्यिक अर्थ उसके जीवन-व्यवहार से है। ''चाल-चलन'' रूपक का अर्थ स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।'
- source_word: בעת מוטו
  choice: जब वह लड़खड़ाएगा
  rationale: מוט में डगमगाने, फिसलने या गिरने का भाव है। यह रूपक को रखता है और अंतिम विनाश का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ימצא משען
  choice: उसे सहारा मिलेगा
  rationale: משען ऐसी वस्तु या सहायता है जिस पर टिका जा सके। हिन्दी में यह स्वाभाविक निष्प्रयोजक रूप मूल के 'वह सहारा पाएगा' का अर्थ ठीक से देता है।
theological_decisions:
- issue: ज्ञान-वचन में पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: भलाई करनेवाला
  alternative: भलाई करनेवाला पुरुष
  rationale: इब्रानी रूप पुल्लिंग एकवचन है, किंतु यहाँ वह प्रतिनिधिक सामान्य कथन है। हिन्दी का '-वाला' रूप एकवचन संरचना बनाए रखता है, जबकि 'पुरुष' जोड़ना मूल से अधिक अर्थ सीमित कर सकता है।
- issue: पहले चरण में इब्रानी और यूनानी पाठ का पर्याप्त अंतर
  choice: मुख्य पाठ में विद्यमान इब्रानी को प्राथमिकता
  alternative: 'यूनानी के अनुसार: ''उपकारों का बदला चुकानेवाला आगे की बात स्मरण रखता है'''
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वास वाला है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। भिन्न यूनानी साक्ष्य को पाठ-टिप्पणी में सुरक्षित रखा गया है; दूसरे चरण में दोनों साक्ष्य संकट के समय सहारा मिलने पर सहमत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और ज्ञान-साहित्य के लिए उपयुक्त रखी गई है। 'चाल-चलन' सामान्य पाठक के लिए 'मार्गों' के व्यवहारगत अर्थ को स्पष्ट करता है।
