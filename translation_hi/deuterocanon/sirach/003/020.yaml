base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/020.yaml
  text: For the mercies of God are many[b][a], and to the humble he reveals his secret.
translation:
  language: hi
  text: क्योंकि परमेश्वर की दयाएँ बहुत हैं,[a] और वह नम्र लोगों को अपना भेद प्रकट करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्योंकि प्रभु का प्रभुत्व महान है, और नम्र लोगों के द्वारा उसकी महिमा की जाती है।” यहाँ इब्रानी साक्ष्य यूनानी पाठ से पर्याप्त रूप से भिन्न है।'
    reason: alternative_reading
  - marker: b
    text: या, “उसकी गुप्त सम्मति।” इब्रानी शब्द केवल छिपी हुई जानकारी ही नहीं, बल्कि घनिष्ठ विश्वास में साझा की गई गोपनीय सम्मति भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי
  choice: दया के काम अनेक हैं
  rationale: रַחֲמֵי का बहुवचन परमेश्वर की बार-बार और बहुतायत से प्रकट होने वाली करुणा को व्यक्त करता है। आधुनिक हिन्दी में केवल ‘दयाएँ’ की अपेक्षा ‘दया के काम’ अधिक स्वाभाविक है, जबकि बहुवचन का ठोस भाव बना रहता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी पाठ में स्पष्ट रूप से ‘परमेश्वर’ है; मुख्य पाठ उसी का अनुसरण करता है, न कि यूनानी समानांतर के ‘प्रभु’ का।
- source_word: וְלַעֲנָוִים
  choice: नम्र लोगों पर
  rationale: עֲנָוִים के नैतिक और सामाजिक भाव के लिए ‘नम्र लोग’ आधुनिक हिन्दी में सहज और व्यापक है। इब्रानी לְ को ‘पर’ से व्यक्त करना ‘भेद प्रकट करना’ के साथ स्वाभाविक हिन्दी मुहावरा बनाता है।
- source_word: יְגַלֶּה
  choice: प्रकट करता है
  rationale: यह क्रिया किसी छिपी या गोपनीय बात को खोलकर बताने का भाव रखती है; ‘प्रकट करता है’ हिन्दी में स्वाभाविक और अर्थ-संगत है।
- source_word: סוֹדוֹ
  choice: अपना भेद
  rationale: סוֹד का अर्थ गुप्त बात के साथ-साथ घनिष्ठ रूप से साझा की गई गोपनीय सम्मति भी हो सकता है। ‘भेद’ संक्षिप्त और गरिमापूर्ण मुख्य-पाठ विकल्प है; ‘गुप्त सम्मति’ की संभावना पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: इब्रानी बेन सीरा पाठ और यूनानी समानांतर के बीच पर्याप्त भिन्नता
  choice: 'मुख्य पाठ में इब्रानी का अनुसरण: परमेश्वर की दया के काम अनेक हैं और वह नम्र लोगों पर अपना भेद प्रकट करता है।'
  alternative: 'यूनानी समानांतर: “क्योंकि प्रभु का प्रभुत्व महान है, और नम्र लोग उसकी महिमा करते हैं।”'
  rationale: इस पद का उपलब्ध इब्रानी साक्ष्य उच्च-विश्वसनीयता वाला है, इसलिए वही मुख्य पाठ का आधार है। यूनानी परंपरा पूरे पद का अलग अर्थ प्रस्तुत करती है; इस वास्तविक पाठांतर को चुपचाप मिलाने के बजाय पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘दया के काम’ ने इब्रानी बहुवचन को स्वाभाविक हिन्दी में व्यक्त किया है; ‘भेद’ के व्यापक अर्थ को पाद-टिप्पणी स्पष्ट करती है।
