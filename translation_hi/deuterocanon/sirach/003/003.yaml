base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: hi
  text: जो अपने पिता का आदर करता है, उसके पाप का प्रायश्चित होता है[a]; और जो अपनी माता का आदर करता है, वह खज़ाना जमा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके पाप’ (एकवचन) और कर्मवाच्य क्रिया है। यूनानी समानांतर का अर्थ है, ‘वह पापों का प्रायश्चित करेगा’; वहाँ ‘पाप’ बहुवचन है। इब्रानी का एकवचन सामूहिक अर्थ में भी हो सकता है।
    reason: पाठगत और व्याकरणिक विकल्प को स्पष्ट करना
  - marker: b
    text: अर्थात प्रतिफल को खज़ाने की तरह संचित करता है; इसका अनुवाद ‘खज़ाना बटोरता है’ भी हो सकता है।
    reason: रूपक और शाब्दिक विकल्प को स्पष्ट करना
lexical_decisions:
- source_word: מְכַבֵּד
  choice: आदर करता है
  rationale: पिएल कृदंत यहाँ पिता या माता को उनका उचित सम्मान देने का भाव व्यक्त करता है। ‘आदर करता है’ आधुनिक हिन्दी में स्वाभाविक है और केवल मन के भाव से अधिक, व्यवहार में सम्मान देने का अर्थ रखता है।
- source_word: אָב / אִמּוֹ
  choice: अपने पिता / अपनी माता
  rationale: इब्रानी पाठ पिता और माता का अलग-अलग उल्लेख करता है। हिन्दी में कर्ता से संबंध स्पष्ट और स्वाभाविक करने के लिए ‘अपने/अपनी’ रखा गया है।
- source_word: תְּכֻפַּר חַטָּאתוֹ
  choice: उसके पाप का प्रायश्चित होता है
  rationale: इब्रानी में क्रिया कर्मवाच्य है और ‘पाप’ व्याकरणतः एकवचन है। यह अनुवाद प्रायश्चित के स्पष्ट धार्मिक अर्थ और उसे करने वाले की अनिर्दिष्टता—दोनों को बनाए रखता है।
- source_word: וְגוֹנֵז אוֹצָר
  choice: वह खज़ाना जमा करता है
  rationale: גנז का अर्थ मूल्यवान वस्तु को संचित करके रखना और אוצר का अर्थ खज़ाना है। ‘खज़ाना जमा करता है’ प्रतिफल को सुरक्षित धन की तरह संचित करने का रूपक स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में प्रायश्चित की भाषा
  choice: ‘उसके पाप का प्रायश्चित होता है’ के रूप में स्पष्ट प्रायश्चित-संबंधी भाषा बनाए रखना
  alternative: ‘उसका पाप ढक जाता है’ या ‘उसे क्षमा मिलती है’
  rationale: इब्रानी כפר और यूनानी समानांतर ἐξιλάσεται दोनों पाप के प्रायश्चित का ठोस भाव रखते हैं। कर्मवाच्य हिन्दी इब्रानी की यह अनिर्दिष्टता भी बचाती है कि प्रायश्चित का कर्ता कौन है; पद को किसी बाद की विशिष्ट धर्मवैज्ञानिक व्यवस्था में नहीं बाँधा गया है।
- issue: ‘पाप’ का एकवचन या सामूहिक बहुवचन
  choice: मुख्य पाठ में इब्रानी के अनुसार एकवचन ‘पाप’
  alternative: यूनानी समानांतर के अनुसार ‘पापों’
  rationale: इब्रानी חַטָּאתוֹ एकवचन है, जबकि यूनानी में बहुवचन है। एकवचन सामूहिक अर्थ भी रख सकता है; इसलिए मुख्य पाठ स्रोत की व्याकरणिक संख्या रखता है और पाठांतर को पादटिप्पणी में बताता है।
- issue: पिता और माता के लिंग-विशिष्ट उल्लेख
  choice: ‘पिता’ और ‘माता’ दोनों को अलग-अलग रखना
  alternative: दोनों को मिलाकर ‘माता-पिता’ कहना
  rationale: मूल पाठ दोनों को समानांतर पंक्तियों में अलग-अलग नाम देता है और प्रत्येक के साथ अलग प्रतिफल जोड़ता है; संयुक्त रूप इस संरचना को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘प्रायश्चित’ धार्मिक भार को सुरक्षित रखता है, जबकि वाक्य की कर्मवाच्य रचना इब्रानी की वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाती। अर्धविराम दोनों समानांतर कथनों का निकट संबंध दिखाता है।
