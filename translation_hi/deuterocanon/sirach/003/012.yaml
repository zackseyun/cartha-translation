base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/012.yaml
  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: hi
  text: हे मेरे बेटे[a], अपने पिता का आदर करने में दृढ़ रह, और उसे अपने जीवन भर न छोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “हे बच्चे, अपने पिता के बुढ़ापे में उसे सहारा दे, और उसके जीवनकाल में उसे दुःखी न कर।”'
    reason: महत्वपूर्ण प्राचीन वैकल्पिक पाठ, जो हिब्रू से शब्दार्थ और बलाघात में भिन्न है।
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय के साथ पुल्लिंग एकवचन संबोधन है। ‘हे मेरे बेटे’ हिब्रू ज्ञान-साहित्य की आत्मीय, शिक्षाप्रद संबोधन-शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִתְחַזֵּק
  choice: दृढ़ रह
  rationale: हित्पाएल आज्ञार्थक रूप स्वयं को मजबूत करने या दृढ़ बने रहने का भाव देता है। ‘दृढ़ रह’ प्रसंग में स्वाभाविक है और सम्मान करते रहने की निरंतरता व्यक्त करता है।
- source_word: בִּכִבּוּד אָבִיךָ
  choice: अपने पिता का आदर करने में
  rationale: בְּ उपसर्ग के साथ כִּבּוּד आदर करने के क्षेत्र या व्यवहार को दर्शाता है। यह अनुवाद हिब्रू संरचना का भाव रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: और ... उसे न छोड़ना
  rationale: עזב का अर्थ छोड़ना, त्याग देना या बेसहारा छोड़ देना हो सकता है। ‘न छोड़ना’ मूल की व्यापकता बनाए रखता है और पारिवारिक दायित्व के प्रसंग में उपेक्षा या परित्याग का नैतिक भाव भी संप्रेषित करता है।
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन भर
  rationale: यह हिब्रू मुहावरे ‘तेरे जीवन के सब दिन’ का स्वाभाविक और स्पष्ट हिन्दी रूप है, जो आजीवन अवधि को व्यक्त करता है।
theological_decisions:
- issue: हिब्रू और यूनानी समानांतर पाठ के केंद्रीय उपदेश में अंतर
  choice: 'मुख्य पाठ में हिब्रू का अनुसरण: पिता का आदर करने में दृढ़ रहना और उसे न छोड़ना।'
  alternative: 'यूनानी के अनुसार: पिता के बुढ़ापे में उसे सहारा देना और उसके जीवनकाल में उसे दुःखी न करना।'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध और स्पष्ट है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ बुढ़ापे में सहायता और पिता को दुःखी न करने की बात स्पष्ट करता है; यह महत्वपूर्ण प्राचीन भिन्न पाठ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में मिलाकर अंतर को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एक पिता-सदृश शिक्षक के सीधे संबोधन के कारण एकवचन अनौपचारिक आज्ञार्थक ‘रह/छोड़ना’ रखा गया है। ‘दृढ़ रह’ हिब्रू रूपक को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी भिन्नता पादटिप्पणी में पूर्ण रूप से दी गई है।
