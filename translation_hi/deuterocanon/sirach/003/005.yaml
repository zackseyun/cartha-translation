base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: hi
  text: जो अपने पिता का आदर करता है, वह अपने पुत्र के कारण आनन्दित होगा[a], और उसकी प्रार्थना सुनी जाएगी और उसका उत्तर दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में इब्रानी के एकवचन “अपने पुत्र के कारण” के स्थान पर “सन्तानों के द्वारा आनन्दित होगा” है।
    reason: alternative_reading
  - marker: b
    text: यूनानी समानांतर के अन्त में केवल “सुनी जाएगी” है; इब्रानी साक्ष्य में “और उसका उत्तर दिया जाएगा” भी है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: आदर करता है
  rationale: पिएल कृदंत यहाँ उचित मान और सम्मान देने का भाव व्यक्त करता है; आधुनिक हिन्दी में “आदर करना” स्वाभाविक और नैतिक बल से युक्त है।
- source_word: אָבִיו
  choice: अपने पिता का
  rationale: इब्रानी पाठ स्पष्ट रूप से “उसके पिता” कहता है; हिन्दी में कर्ता से संबंध दिखाने के लिए “अपने पिता” स्वाभाविक है।
- source_word: יִשְׂמַח
  choice: आनन्दित होगा
  rationale: यह क्रिया आनन्द या हर्ष प्रकट करने को दर्शाती है; भविष्यकाल नीतिवचन-सदृश परिणाम को बनाए रखता है।
- source_word: בִּבְנוֹ
  choice: अपने पुत्र के कारण
  rationale: इब्रानी में एकवचन “उसके पुत्र में/के द्वारा” है। “के कारण” हिन्दी में प्रसन्नता के संदर्भ को स्वाभाविक बनाता है और एकवचन को सुरक्षित रखता है।
- source_word: וּתְפִלָתוֹ
  choice: और उसकी प्रार्थना
  rationale: תְּפִלָּה का सामान्य और सीधा हिन्दी समतुल्य “प्रार्थना” है।
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: सुनी जाएगी और उसका उत्तर दिया जाएगा
  rationale: इब्रानी की दोनों क्रियाओं को सुरक्षित रखते हुए हिन्दी में प्रार्थना को व्याकरणिक केंद्र बनाना स्वाभाविक है; इससे अनकहे कर्ता को स्पष्ट रूप से नहीं जोड़ा जाता।
theological_decisions:
- issue: पिता का आदर करने से जुड़ा प्रतिफल
  choice: इसे नीतिवचन-सदृश परिणाम के रूप में रखा गया और प्रार्थना सुनने वाले का नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: “परमेश्वर उसकी प्रार्थना सुनेगा और उत्तर देगा” कहना।
  rationale: पाठ में ईश्वरीय कर्ता निहित है, पर उसका नाम नहीं दिया गया; अनुवाद वही अस्पष्टता बनाए रखता है।
- issue: पुत्र या सन्तान
  choice: मुख्य पाठ में इब्रानी एकवचन के अनुसार “पुत्र” रखा गया।
  alternative: यूनानी समानांतर के अनुसार “सन्तानों” कहना।
  rationale: उच्च-विश्वसनीयता वाले इब्रानी आधार-पाठ को प्राथमिकता दी गई है और यूनानी पाठांतर को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और नीतिवचन-सदृश रूप अपनाया गया है। “आनन्दित होगा” औपचारिक गरिमा रखता है, जबकि वाक्य-संरचना सामान्य पाठकों के लिए स्पष्ट है।
