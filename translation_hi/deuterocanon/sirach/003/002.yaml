  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: hi
  text: क्योंकि यहोवा ने संतानों के सामने पिता को आदर दिया, और माता के अधिकार[a] को उसकी संतानों[b] पर स्थापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “माता के हक़ को।” इब्रानी מִשְׁפָּט का अर्थ “न्याय,” “निर्णय,” या विधिसम्मत “अधिकार/दावा” हो सकता है; यहाँ आशय परिवार में माता की उचित अधिकारपूर्ण स्थिति से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर पाठ में दूसरी पंक्ति में “पुत्रों” है, जबकि उपलब्ध इब्रानी पाठ में “उसकी संतान” है। अनुवाद में इब्रानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के विशिष्ट नाम को आधुनिक हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כִּבֵּד
  choice: आदर दिया
  rationale: पिएल रूप का सामान्य अर्थ सम्मान देना है; ‘आदर दिया’ पारिवारिक संदर्भ में स्वाभाविक और सटीक है।
- source_word: לִפְנֵי הַבָּנִים
  choice: संतानों के सामने
  rationale: לִפְנֵי के मूल स्थानिक-सम्बन्धात्मक बिंब ‘सामने/उपस्थिति में’ को बनाए रखता है और बिना आवश्यकता इसे ‘संतानों से बढ़कर’ नहीं बनाता।
- source_word: וּמִשְׁפַּט הָאֵם
  choice: माता के अधिकार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय से अधिक माता के उचित दावे या पारिवारिक अधिकार को दर्शाता है; ‘अधिकार’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: קִיֵּם
  choice: दृढ़ किया
  rationale: क्रिया का अर्थ स्थिर, पुष्ट या कायम करना है; ‘दृढ़ किया’ इब्रानी अर्थ और यूनानी ἐστερέωσεν दोनों के निकट है।
- source_word: עַל יְלָדֶיהָ
  choice: उसकी संतान पर
  rationale: עַל अधिकार-सम्बन्ध को और स्त्रीलिंग प्रत्यय माता की अपनी संतान को सूचित करता है; ‘संतान’ सामूहिक हिन्दी संज्ञा के रूप में स्वाभाविक है।
theological_decisions:
- issue: पिता और माता के पृथक उल्लेख को बनाए रखना
  choice: पिता … माता के अधिकार … उसकी संतान
  alternative: माता-पिता … उनका अधिकार
  rationale: मूल पाठ पिता और माता को अलग-अलग समानांतर पंक्तियों में रखता है; सामूहिक शब्द प्रयोग इस संरचना और लिंग-सटीकता को मिटा देता।
- issue: מִשְׁפַּט הָאֵם की सामाजिक-विधिक शक्ति
  choice: माता के अधिकार
  alternative: माता के हक़ / माता के न्याय
  rationale: ‘अधिकार’ उचित पारिवारिक दावे और मान्य स्थिति को व्यक्त करता है, पर किसी बाद की साम्प्रदायिक अधिकार-व्यवस्था को पाठ में नहीं जोड़ता।
- issue: לִפְנֵי में निहित सम्बन्ध
  choice: संतानों के सामने
  alternative: संतानों से बढ़कर / संतानों के ऊपर
  rationale: मूल इब्रानी ‘सामने’ या ‘उपस्थिति में’ कह सकता है, जबकि यूनानी समानांतर सम्बन्धात्मक प्रतिष्ठा का संकेत देता है। मुख्य पाठ मूल बिंब को बचाता है और श्रेष्ठता की अधिक स्पष्ट व्याख्या नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संतान’ का प्रयोग सामूहिक अर्थ में है। वाक्य की नीतिवचन-सदृश समानांतरता तथा इब्रानी की सम्भावित अर्थगत खुली जगह को यथासम्भव सुरक्षित रखा गया है।
