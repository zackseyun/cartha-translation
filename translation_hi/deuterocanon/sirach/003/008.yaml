base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/008.yaml
  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: hi
  text: हे मेरे पुत्र[a], वचन और कर्म से अपने पिता का आदर कर, ताकि सभी आशीषें तुझ तक पहुँचें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “ताकि उसकी ओर से आशीष तुझ पर आए,” जिससे पिता आशीष के स्रोत के रूप में अधिक स्पष्ट दिखाई देता है।'
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: इब्रानी में पुरुषवाचक एकवचन सम्बोधन है; इसलिए उसे लिंग-निरपेक्ष बनाए बिना स्वाभाविक हिन्दी सम्बोधन में रखा गया है।
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: अपनी बातों और कामों से
  rationale: यह अनुवाद वाणी और व्यवहार—दोनों के द्वारा आदर दिखाने का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है और मूल की संक्षिप्त जोड़ी को बनाए रखता है।
- source_word: כַּבֵּד
  choice: आदर कर
  rationale: माता-पिता के प्रति कर्तव्य के प्रसंग में כבד का आशय उचित सम्मान देना है; ‘आदर कर’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: אָבִיךָ
  choice: अपने पिता का
  rationale: मूल के सीधे कर्म और द्वितीय पुरुष एकवचन सम्बन्ध को यथावत व्यक्त करता है।
- source_word: עֲבוּר
  choice: ताकि
  rationale: यहाँ यह उद्देश्य अथवा परिणाम प्रस्तुत करता है; ‘ताकि’ दोनों के बीच की सम्भावित अर्थ-छाया को स्वाभाविक रूप से रखता है।
- source_word: יַשִׂיגוּךָ
  choice: तुझ तक पहुँचें
  rationale: क्रिया का मूल बिम्ब ‘पहुँचना/जा पकड़ना’ है। ‘तुझ तक पहुँचें’ उस बिम्ब को बनाए रखते हुए आशीषों के सन्दर्भ में स्वाभाविक है।
- source_word: כֹּל בְּרָכוֹת
  choice: सभी आशीषें
  rationale: इब्रानी में बहुवचन के साथ ‘सब’ है; ‘सभी आशीषें’ उसके व्यापक और बहुवचन अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञात आशीषों का स्रोत
  choice: मुख्य पाठ में आशीषों का स्रोत अनिर्दिष्ट रखा गया है।
  alternative: यूनानी समानांतर पाठ के अनुसार आशीष को पिता की ओर से आया हुआ स्पष्ट करना।
  rationale: उपलब्ध इब्रानी पाठ केवल यह कहता है कि सभी आशीषें पुत्र तक पहुँचें; वह स्रोत नहीं बताता। इसलिए मुख्य पाठ इस खुलापन को बनाए रखता है, जबकि यूनानी पाठ का भेद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे मेरे पुत्र’ ज्ञान-साहित्य के व्यक्तिगत सम्बोधन को और ‘आदर कर’ पुत्र को दिए गए पुरुषवाचक एकवचन आदेश को सुरक्षित रखता है।
