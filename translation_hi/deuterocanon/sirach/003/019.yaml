translation:
  language: hi
  text: बहुत-से लोग ऊँचे और प्रतिष्ठित हैं, पर रहस्य नम्र लोगों[a] को प्रकट किए जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विनम्र लोगों” अथवा “मृदु स्वभाव के लोगों।” यूनानी शब्द πραέσιν मृदु, विनम्र या नम्र स्वभाव के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त अनिश्चित बहुवचन है। हिन्दी में “बहुत-से लोग” स्वाभाविक है और सूक्तिपरक कथन को स्पष्ट रखता है।
- source_word: ὑψηλοὶ
  choice: ऊँचे पदवाले
  rationale: मूल अर्थ “ऊँचे” है; यहाँ ἐπίδοξοι के साथ इसका संबंध सामाजिक ऊँचाई या प्रतिष्ठित स्थिति से है। “ऊँचे पदवाले” आधुनिक हिन्दी में आशय स्पष्ट करता है, बिना नैतिक निंदा जोड़े।
- source_word: ἐπίδοξοι
  choice: प्रतिष्ठित
  rationale: यह शब्द लोकसम्मान, ख्याति या विशिष्ट प्रतिष्ठा का भाव देता है। “प्रतिष्ठित” संक्षिप्त और स्वाभाविक हिन्दी विकल्प है।
- source_word: πραέσιν
  choice: नम्र लोगों
  rationale: πραΰς के इस बहुवचन रूप में कोमलता, मृदुता और अहंकाररहित स्वभाव का भाव हो सकता है। “नम्र” ऊँचे पद और प्रतिष्ठा के साथ निहित विरोध को बनाए रखते हुए हिन्दी में सहज है।
- source_word: ἀποκαλύπτεται
  choice: प्रकट किए जाते हैं
  rationale: मूल में वर्तमानकालीन कर्मवाच्य है और प्रकट करनेवाले का उल्लेख नहीं है। हिन्दी में रहस्य के बहुवचन के अनुसार कर्मवाच्य बहुवचन रखा गया है।
- source_word: μυστήρια
  choice: रहस्य
  rationale: यह बहुवचन संज्ञा छिपी या गुप्त बातों को सूचित करती है। “रहस्य” मूल की गंभीरता और खुली अर्थ-सीमा को बनाए रखता है।
theological_decisions:
- issue: πραέσιν का अनुवाद नम्र, दीन या कोमल स्वभाव के रूप में करना
  choice: नम्र लोगों
  alternative: दीन लोगों; कोमल स्वभाव के लोगों
  rationale: यहाँ उन लोगों का चित्र है जो मृदु और स्वयं को न उभारनेवाले हैं। “नम्र” इस स्वभाव को संक्षेप में व्यक्त करता है और सामाजिक रूप से ऊँचे तथा प्रतिष्ठित लोगों के साथ पद का विरोध भी बनाए रखता है। अन्य संभावनाएँ पादटिप्पणी में दी गई हैं ताकि यूनानी शब्द की अर्थ-सीमा संकुचित न हो।
- issue: रहस्य प्रकट करनेवाले की पहचान
  choice: कर्मवाच्य को बनाए रखा गया और कर्ता का नाम नहीं जोड़ा गया
  alternative: “परमेश्वर नम्र लोगों पर रहस्य प्रकट करता है”
  rationale: मूल यूनानी पाठ प्रकट करनेवाले को स्पष्ट नहीं करता। परमेश्वर को कर्ता मानना संदर्भतः संभव हो सकता है, पर उसे मुख्य पाठ में जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सूक्तिपरक रूप अपनाया गया है। “ऊँचे पदवाले” सामाजिक ऊँचाई को स्पष्ट करता है; “नम्र” सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की मृदुता और अहंकाररहित स्वभाव की अर्थ-सीमा को बनाए रखता है।
