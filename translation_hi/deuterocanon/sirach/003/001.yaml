  yaml_path: translation/deuterocanon/sirach/003/001.yaml
  text: Listen[a], children, to a father's instruction, and do so that you may live.
translation:
  language: hi
  text: हे बच्चो, पिता की शिक्षा सुनो[a] और उसके अनुसार चलो, ताकि तुम जीवित रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “हे बच्चो, मेरी सुनो—मैं पिता हूँ—और ऐसा करो, ताकि तुम उद्धार पाओ।” इब्रानी पाठ अधिक सामान्य रूप से “पिता की शिक्षा” और “तुम जीवित रहो” कहता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया है। ‘सुनो’ ध्यानपूर्वक सुनने का आह्वान बनाए रखता है; आगे की आज्ञा से पालन का भाव भी स्पष्ट हो जाता है।
- source_word: בָנִים
  choice: हे बच्चो
  rationale: शाब्दिक रूप से पुल्लिंग बहुवचन होने पर भी ज्ञान-साहित्य में यह संतानों अथवा शिष्यों के सामान्य संबोधन के रूप में प्रयुक्त है। ‘हे बच्चो’ स्वाभाविक और समावेशी संबोधन है।
- source_word: מִשְׁפַט
  choice: शिक्षा
  rationale: यहाँ अर्थ न्यायिक निर्णय नहीं, बल्कि पिता का अधिकारपूर्ण निर्देश है; इसलिए ‘शिक्षा’ प्रसंगानुकूल और सहज है।
- source_word: אָב
  choice: पिता की
  rationale: इब्रानी में कोई संबंधसूचक सर्वनाम नहीं है। हिंदी में ‘पिता की’ सामान्य कथन को स्वाभाविक रखते हुए यूनानी का ‘मेरी/अपने पिता की’ मुख्य पाठ में नहीं जोड़ता।
- source_word: וַעֲשׂוּ
  choice: और उसके अनुसार चलो
  rationale: עשה का मूल अर्थ ‘करना’ है। हिंदी में केवल ‘और करो’ अस्पष्ट होगा; ‘उसके अनुसार चलो’ उस शिक्षा को व्यवहार में लाने का आशय स्पष्ट करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम बताने वाले पद का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: תִּחְיוּ
  choice: तुम जीवित रहो
  rationale: חיה का सीधा अर्थ ‘जीवित रहना’ है। यूनानी में ‘उद्धार पाओ’ है, जिसे पाठांतर के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: इब्रानी और यूनानी में पिता के आत्म-संदर्भ का अंतर
  choice: मुख्य पाठ में इब्रानी के सामान्य ‘पिता की शिक्षा’ का अनुसरण
  alternative: यूनानी के अनुसार ‘मुझ पिता की सुनो’ अथवा ‘अपने पिता की सुनो’
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है और उसमें प्रथम पुरुष या संबंधसूचक सर्वनाम नहीं है; यूनानी पाठांतर पादटिप्पणी में सुरक्षित है।
- issue: परिणाम-वाक्य में ‘जीवित रहो’ बनाम ‘उद्धार पाओ’
  choice: इब्रानी के अनुसार ‘तुम जीवित रहो’
  alternative: यूनानी के अनुसार ‘तुम उद्धार पाओ’
  rationale: इब्रानी תחיו स्पष्ट रूप से जीवन का बोध कराता है। यूनानी σωθῆτε एक सार्थक वैकल्पिक साक्ष्य है, इसलिए उसे बिना समरस किए पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे बच्चो’ ज्ञान-साहित्य के संबोधन को व्यक्त करता है; ‘उसके अनुसार चलो’ शाब्दिक ‘करो’ के आशय को स्वाभाविक हिंदी में स्पष्ट करता है।
