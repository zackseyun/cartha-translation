base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/015.yaml
  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: hi
  text: संकट के दिन वह तुम्हारे हित में स्मरण की जाएगी; जैसे पाले पर गरमी पड़ती है[a], वैसे ही तुम्हारे पाप मिट जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ के अधिक निकट: “जैसे पाले पर सुहावना मौसम होता है, वैसे ही तुम्हारे पाप घुल जाएँगे।” हिब्रू में “पाले पर गरमी” है, जबकि समानांतर यूनानी पाठ में “पाले पर सुहावना मौसम” है। दोनों में पाले के लुप्त होने का चित्र है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: צָרָה संकट, विपत्ति या क्लेश को दर्शाता है। यह चयन हिब्रू की गंभीरता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִּזָּכֵר לָךְ
  choice: वह तुम्हारे हित में स्मरण की जाएगी
  rationale: स्त्रीलिंग एकवचन क्रिया संभवतः निकटवर्ती संदर्भ में माता-पिता के प्रति किए गए कर्तव्य या धार्मिक आचरण की ओर संकेत करती है। לָךְ को लाभसूचक अर्थ में लिया गया है; अस्पष्ट पूर्ववर्ती संकेत को 'वह' द्वारा सुरक्षित रखा गया है।
- source_word: כְּחֹם עַל כְּפוֹר
  choice: जैसे पाले पर गरमी पड़ती है
  rationale: हिब्रू חֹם का अर्थ गरमी और כְּפוֹר का अर्थ पाला है। 'पड़ती है' जोड़ने से हिन्दी में चित्र स्वाभाविक बनता है, जबकि मूल उपमा बनी रहती है।
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: वैसे ही तुम्हारे पाप मिट जाएँगे
  rationale: לְהַשְׁבִּית का मूल भाव समाप्त करना या हटा देना है, और עָוֹן पाप के साथ दोष का भाव भी रख सकता है। 'मिट जाएँगे' निष्कासन को व्यक्त करता है और पाले के लुप्त होने की उपमा से भी मेल खाता है।
theological_decisions:
- issue: क्या यह पद सत्कर्म द्वारा यांत्रिक ढंग से पाप-क्षमा कमाने की शिक्षा देता है, या वाचा-संबंधी प्रज्ञा की भाषा में धर्ममय आचरण के परमेश्वर के सामने स्मरण किए जाने की बात कहता है?
  choice: 'पाठ के दोनों कथनों को यथावत रखा गया है: वह कार्य व्यक्ति के हित में स्मरण किया जाएगा और उसके पाप मिट जाएँगे।'
  alternative: इसे या तो प्रत्यक्ष प्रायश्चित्त के कठोर सिद्धांत के रूप में, या केवल सामान्य ईश्वरीय सहायता के रूप में स्पष्ट करना।
  rationale: हिब्रू इन दोनों बातों को जोड़ता है, पर उनके संबंध का व्यवस्थित धर्मवैज्ञानिक स्पष्टीकरण नहीं देता। अनुवाद इस तनाव को बिना किसी संप्रदायगत निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'वह' मूल के स्त्रीलिंग एकवचन संदर्भ की वास्तविक अस्पष्टता बनाए रखता है; 'तुम्हारे हित में' लाभसूचक दातृकार्थ को स्पष्ट करता है।
