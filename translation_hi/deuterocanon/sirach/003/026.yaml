  yaml_path: translation/deuterocanon/sirach/003/026.yaml
  text: A heavy heart multiplies its pains[b][a], and one who behaves recklessly adds sin upon sin.
translation:
  language: hi
  text: भारी मन की पीड़ाएँ बढ़ती हैं,[a] और जो लापरवाही से आचरण करता है, वह अपराध पर अपराध जोड़ता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “कठोर हृदय अन्त में पीड़ित होगा,” और “कठोर हृदय अन्त में बोझ से दब जाएगा।”'
    reason: alternative_reading
  - marker: b
    text: “लापरवाही से आचरण करता है” के लिए प्रयुक्त इब्रानी शब्द कठिन है; उसका अर्थ उन्मत्त या बेलगाम ढंग से व्यवहार करना, अपने को धोखा देना, या घमंड से डींग मारना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: भारी मन
  rationale: इब्रानी पदबंध का शाब्दिक बिंब ‘भारी हृदय’ है, जो बोझिलता, जड़ता या हठ का संकेत दे सकता है। स्वाभाविक आधुनिक हिन्दी में ‘भारी मन’ इस बिंब को बनाए रखता है; यूनानी पाठ का ‘कठोर हृदय’ पाठांतर टिप्पणी में दिया गया है।
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: अपने दुख बढ़ाता है
  rationale: क्रिया और संज्ञा मिलकर दुखों या पीड़ाओं के बढ़ने का भाव देते हैं। ‘अपने दुख बढ़ाता है’ हिन्दी में सहज है और हृदय/मन की दशा के परिणाम को स्पष्ट रखता है।
- source_word: וּמִתְהוֹלֵל
  choice: जो उतावलेपन से आचरण करता है
  rationale: यह रूप कठिन और बहुअर्थी है; इसमें उन्मत्त, लापरवाह, आत्म-मुग्ध या डींगपूर्ण व्यवहार का संकेत हो सकता है। ‘उतावलेपन से आचरण’ अविवेकी और बेलगाम व्यवहार का व्यापक नैतिक भाव देता है, बिना किसी एक अनिश्चित अर्थ को निर्णायक बनाए।
- source_word: מוֹסִיף
  choice: जोड़ता है
  rationale: सहभागी रूप का सीधा अर्थ ‘जोड़ता है’ या ‘बढ़ाता जाता है’ है। यहाँ ‘जोड़ता है’ अगले पदबंध की संचयी छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָוֹן עַל עָוֹן
  choice: पाप पर पाप
  rationale: עָוֹן पाप, अधर्म या दोष का अर्थ दे सकता है। इस नैतिक प्रसंग में ‘पाप पर पाप’ स्पष्ट है और मूल की परत-दर-परत जुड़ने वाली अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी साक्ष्यों में प्रथम खंड का अंतर
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ ‘भारी मन अपने दुख बढ़ाता है’ का अनुसरण किया गया है।
  alternative: 'यूनानी पाठ में: ‘कठोर हृदय अन्त में पीड़ित होगा’ और ‘कठोर हृदय अन्त में बोझ से दब जाएगा।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। फिर भी यूनानी समानांतर पाठ वास्तविक और उल्लेखनीय रूप से भिन्न साक्ष्य है; इसलिए उसे चुपचाप मिलाने के बजाय टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भारी मन’ इब्रानी बिंब को स्वाभाविक हिन्दी में बचाता है। दोनों टिप्पणियों के चिह्न मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
