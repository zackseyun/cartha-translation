base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/028.yaml
  text: Do not hurry to heal the wound of a scoffer[a], for there is no healing for it, for they were planted from an evil planting.
translation:
  language: hi
  text: उपहास करनेवाले[a] के घाव को चंगा करने में जल्दबाज़ी न कर, क्योंकि उसका कोई उपचार नहीं है; क्योंकि वे बुरी रोपाई से रोपे गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्योंकि दुष्टता का एक पौधा उसमें जड़ पकड़ चुका है।” इब्रानी का अंतिम उपवाक्य पाठ की दृष्टि से कठिन है और उसमें बहुवचन रूप दिखाई देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: जल्दबाज़ी न कर
  rationale: רוץ का मूल अर्थ ‘दौड़ना’ है, पर यहाँ निषेध में इसका आशय किसी काम को उतावली में करने से है। यह हिंदी में स्वाभाविक रहते हुए मूल भाव को बनाए रखता है।
- source_word: לְרַפְּאוֹת מַכַּת
  choice: घाव को चंगा करने में
  rationale: רפא और מכה मिलकर उपचार तथा घाव का चिकित्सकीय रूपक बनाते हैं। ‘चंगा करना’ अगले पद ‘उपचार’ के साथ अर्थगत संबंध बनाए रखता है।
- source_word: לֵץ
  choice: उपहास करनेवाला
  rationale: ज्ञान-साहित्य में לץ उस व्यक्ति को दर्शाता है जो घमंड और तिरस्कार से दूसरों का उपहास करता तथा सुधार का विरोध करता है। ‘उपहास करनेवाला’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: אֵין לָהּ רְפוּאָה
  choice: उसका कोई उपचार नहीं है
  rationale: यह वाक्य घाव की असाध्यता व्यक्त करता है। स्त्रीलिंग सर्वनाम לָהּ का निकटतम संदर्भ מַכַּת (‘घाव’) है; हिंदी में ‘उसका’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִנֶּטַע רַע
  choice: बुरी रोपाई से
  rationale: נֶטַע पौधे, रोपण या रोपी हुई वस्तु को सूचित कर सकता है। ‘बुरी रोपाई’ मूल के वनस्पति और उत्पत्ति-संबंधी रूपक को बिना अधिक स्पष्ट किए सुरक्षित रखती है।
- source_word: נִטְעוֹ
  choice: वे ... रोपे गए हैं
  rationale: प्रेषित इब्रानी का अंतिम रूप बहुवचन समझा गया है और पहले आए एकवचन पदों से मेल नहीं खाता। अनुवाद इस कठिनाई को चुपचाप एकवचन में सामान्य नहीं करता।
theological_decisions:
- issue: अंतिम उपवाक्य में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी-आधारित बहुवचन ‘वे ... रोपे गए हैं’ रखा गया है।
  alternative: क्योंकि दुष्टता का एक पौधा उसमें जड़ पकड़ चुका है।
  rationale: जहाँ इब्रानी उपलब्ध है वहाँ उसे प्राथमिकता दी गई है, किंतु उसका अंतिम उपवाक्य व्याकरण की दृष्टि से कठिन है। यूनानी समानांतर एकवचन में उपहास करनेवाले के भीतर दुष्टता के पौधे के जड़ पकड़ने की बात करता है। मुख्य पाठ इब्रानी कठिनाई को बनाए रखता है और पादटिप्पणी यूनानी साक्ष्य को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है। ‘उपहास करनेवाला’, ‘घाव’, ‘चंगा करना’ और ‘उपचार’ सामान्य पाठक के लिए स्पष्ट हैं; अंतिम वाक्यांश की कुछ अस्वाभाविकता मूल इब्रानी की वास्तविक पाठगत कठिनाई को ईमानदारी से सुरक्षित रखने के लिए रखी गई है।
