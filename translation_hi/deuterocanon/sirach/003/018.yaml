translation:
  language: hi
  text: तुम्हारी जितनी भी बड़ाई हो, उसमें अपने आपको विनम्र रखो[a], और परमेश्वर के सामने तुम्हें दया मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “तुम जितने बड़े हो, उतना ही अपने आप को नम्र करो।”'
    reason: इब्रानी की संक्षिप्त अभिव्यक्ति के साथ प्राचीन यूनानी समानांतर का अधिक स्पष्ट तुलनात्मक रूप बताना।
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: अपने आप को छोटा बनाओ
  rationale: इब्रानी वाक्यांश का अर्थ स्वयं को छोटा या विनम्र करना है। ‘अपने आप को’ यहाँ נַפְשְךָ (‘अपने प्राण/स्वयं’) का स्वाभाविक हिन्दी रूप है।
- source_word: מִכָּל גְּדוּלָה
  choice: अपनी हर बड़ाई में
  rationale: इब्रानी पाठ को प्राथमिकता देते हुए ‘हर बड़ाई’ की अभिव्यक्ति बनाए रखी गई है। संबंधबोधक מִן की यहाँ कुछ अस्पष्टता है; इसलिए यूनानी समानांतर की तुलनात्मक व्याख्या को मुख्य पाठ में चुपचाप नहीं मिलाया गया।
- source_word: רַחֲמִים
  choice: दया
  rationale: बहुवचन रूप करुणा/दयालु अनुग्रह का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘दया पाओगे’ स्वाभाविक और अर्थ-संगत है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: सामान्य ईश्वर-संज्ञा के लिए आधुनिक मानक हिन्दी का गरिमापूर्ण और स्पष्ट शब्द।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर के बीच अभिव्यक्ति का अंतर
  choice: मुख्य पाठ में इब्रानी ‘अपनी हर बड़ाई में अपने आप को छोटा बनाओ’ रखा गया।
  alternative: 'यूनानी के अनुसार: ‘तुम जितने बड़े हो, उतना ही अपने आप को नम्र करो।’'
  rationale: दिया गया इब्रानी स्रोत उच्च विश्वसनीयता और सत्यापित सहमति वाला है, इसलिए उसे प्राथमिक आधार बनाया गया। यूनानी अर्थ की उपयोगी व्याख्या देता है, पर इब्रानी की वास्तविक संरचना को प्रतिस्थापित नहीं करना चाहिए।
- issue: רַחֲמִים का अनुवाद
  choice: दया
  alternative: अनुग्रह
  rationale: इब्रानी शब्द मुख्यतः करुणा और दया का बोध कराता है। यूनानी χάριν ‘अनुग्रह/कृपा’ की ओर संकेत करता है, पर मुख्य पाठ में इब्रानी अर्थ को प्राथमिकता दी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छोटा बनाओ’ इब्रानी रूपक को बनाए रखता है, जबकि पादटिप्पणी सामान्य पाठक के लिए उसके विनम्रता-संबंधी आशय को स्पष्ट करती है।
