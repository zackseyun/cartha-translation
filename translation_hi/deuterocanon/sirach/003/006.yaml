base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/006.yaml
  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: hi
  text: जो अपने पिता का आदर करता है, उसके दिन बहुत होंगे; और जो अपनी माता का आदर करता है, उसे परमेश्वर से प्रतिफल मिलता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “और जो प्रभु की आज्ञा मानता है, वह अपनी माता को विश्राम देगा।” दूसरे खंड में इब्रानी और यूनानी पाठों के बीच पर्याप्त अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: आदर करता है
  rationale: माता-पिता को उचित सम्मान देने के नैतिक अर्थ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय को हिन्दी की सामान्य निजवाचक अभिव्यक्ति में सुरक्षित रखता है।
- source_word: יִרְבּוּ יָמָיו
  choice: उसके दिन बहुत होंगे
  rationale: शाब्दिक बिंब ‘उसके दिन बहुत होंगे’ को बनाए रखता है और इसे केवल ‘वह दीर्घायु होगा’ कहकर समतल नहीं करता।
- source_word: וּגְמוּל אֱלֹהִים עַל
  choice: वह परमेश्वर का प्रतिदान चुकाता है
  rationale: प्रेषित इब्रानी वाक्यांश संक्षिप्त और कुछ कठिन है। यह रूप माता का आदर करने को परमेश्वर के प्रति प्रतिदान चुकाने के रूप में प्रस्तुत करता है, बिना इसे यूनानी वैकल्पिक पाठ से बदलने के।
- source_word: אִמּוֹ
  choice: अपनी माता
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय को पहले खंड के समान स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी पाठ और यूनानी समानांतर पाठ का पर्याप्त अंतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता दी गई: माता का आदर करना परमेश्वर का प्रतिदान चुकाना कहा गया है।'
  alternative: 'यूनानी: ‘और जो प्रभु की आज्ञा मानता है, वह अपनी माता को विश्राम देगा।’'
  rationale: इब्रानी पाठ यहाँ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य अनुवाद उसी पर आधारित है। महत्वपूर्ण यूनानी भिन्नता को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘उसके दिन बहुत होंगे’ इब्रानी बिंब को बनाए रखता है। ‘प्रतिदान चुकाता है’ जानबूझकर कुछ औपचारिक है, क्योंकि मूल इब्रानी भी संक्षिप्त और असामान्य है।
