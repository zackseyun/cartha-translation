base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/014.yaml
  text: A father's righteousness will not be wiped away[a], and in place of sins it will be planted.
translation:
  language: hi
  text: पिता की धार्मिकता मिटाई नहीं जाएगी[a], और पापों के बदले वह रोपी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “क्योंकि पिता का दान भुलाया नहीं जाएगा, और पापों के बदले वह तेरे लिए फिर से बनाया जाएगा।” यूनानी पाठ की शब्दावली कुछ भिन्न है, विशेषकर “दान” और “तेरे लिए फिर से बनाया जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: पिता की धार्मिकता
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘पिता की धार्मिकता’ है। यह व्यापक नैतिक शब्दावली और संबंधवाचक अस्पष्टता को बनाए रखता है; संदर्भ में इसका संकेत पिता के प्रति किए गए धर्मपूर्ण व्यवहार की ओर हो सकता है, पर अनुवाद इसे अनिवार्य रूप से उसी अर्थ तक सीमित नहीं करता।
- source_word: לֹא תִּמָּחֶה
  choice: मिटाई नहीं जाएगी
  rationale: נמחה का भाव किसी लेखे या स्मृति से मिटा दिए जाने का है। ‘मिटाई नहीं जाएगी’ इस रूपक को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וּתְמוּר
  choice: और ... के बदले
  rationale: תמור विनिमय या प्रतिस्थापन का भाव व्यक्त करता है। ‘के बदले’ उस प्रबल संबंध को बनाए रखता है, पर उसके धार्मिक तंत्र की अतिरिक्त व्याख्या नहीं करता।
- source_word: חַטָּאת
  choice: पापों
  rationale: इस ज्ञान-साहित्यिक संदर्भ में इसका अर्थ नैतिक अपराध है, न कि ‘पापबलि’। यूनानी समानांतर का बहुवचन भी ‘पापों’ का समर्थन करता है।
- source_word: הִיא תְּנַתֵּעַ
  choice: वह रोपी जाएगी
  rationale: क्रिया נטע (‘रोपना’) से है और स्त्रीलिंग सर्वनाम ‘धार्मिकता’ की ओर लौटता है। इब्रानी के रोपने के रूपक को मुख्य पाठ में रखा गया है; यूनानी का ‘बनाया जाएगा’ पाठांतर टिप्पणी में दिया गया है। इब्रानी में ‘तेरे लिए’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: क्या यह पद धार्मिकता को पापों की भरपाई करने वाला पुण्य बताता है
  choice: ‘पापों के बदले’ की प्रतिस्थापन-संबंधी भाषा को बिना किसी बाद की प्रायश्चित्त-व्यवस्था में बाँधे यथावत रखा गया है।
  alternative: इसे पापों के बावजूद अनुकूल स्मरण, पापों का प्रायश्चित्त, या पाप के बाद पुनर्स्थापना के रूप में स्पष्ट किया जा सकता था।
  rationale: बेन सीरा नैतिक प्रतिफल की प्रबल भाषा प्रयोग करता है। अनुवाद न तो इसे केवल स्मरण तक सीमित करता है, न इससे कोई पूर्ण विकसित पारिभाषिक प्रायश्चित्त-सिद्धान्त बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘धार्मिकता’, ‘मिटाई’ और ‘रोपी’ मूल इब्रानी के नैतिक, लेखा-संबंधी और कृषि-संबंधी बिंबों को बनाए रखते हैं।
