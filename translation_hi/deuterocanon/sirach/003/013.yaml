base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/013.yaml
  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: hi
  text: यदि किसी मनुष्य में समझ की कमी हो,[a] तो उसके प्रति धैर्य रखो,[b] और उसके जीवन भर उसे लज्जित न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में अंतिम वाक्यांश है, “अपनी सारी शक्ति से उसका अनादर न करो।” इब्रानी में है, “उसके जीवन भर उसे लज्जित न करो।” मुख्य पाठ इस पद के प्राथमिक इब्रानी साक्षी का अनुसरण करता है; यूनानी पाठ किसी भिन्न आधार-पाठ या व्याख्यात्मक रूप को दर्शा सकता है।
    reason: textual_variant
  - marker: b
    text: या “उसके प्रति सहनशील रहो” अथवा “उसे रियायत दो।” इब्रानी पदबंध का भाव यूनानी समानांतर पाठ में धैर्यपूर्वक सहने के आह्वान के रूप में स्पष्ट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: यदि ... भी
  rationale: संदर्भ में यह साधारण जोड़ नहीं, बल्कि रियायती भाव व्यक्त करता है; यूनानी κἂν भी ‘यदि ... भी’ का समर्थन करता है।
- source_word: אִישׁ
  choice: किसी मनुष्य
  rationale: इब्रानी एकवचन पुल्लिंग रूप को बनाए रखते हुए यह हिन्दी में सामान्य प्रतिनिधिक अर्थ भी स्वाभाविक रूप से देता है।
- source_word: יֶחְסַר מַדָּעוֹ
  choice: उसकी समझ घट जाए
  rationale: इब्रानी में ज्ञान या समझ की कमी का भाव है। इस प्रसंग में वृद्ध पिता की मानसिक क्षमता कम होने का संकेत है; यूनानी σύνεσιν भी समझ-बूझ की ओर इंगित करता है।
- source_word: עֲזָב לוֹ
  choice: उसके साथ धीरज रखो
  rationale: क्रिया का मूल भाव छोड़ देने या छूट देने का हो सकता है, जबकि यूनानी συγγνώμην ἔχε इसे सहनशीलता और रियायत के आह्वान के रूप में स्पष्ट करता है।
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: उसे लज्जित न करो
  rationale: תַּכְלִים का अर्थ लज्जित या अपमानित करना है। ‘लज्जित न करो’ सीधा, स्वाभाविक और संबंधपरक चोट को व्यक्त करने वाला अनुवाद है।
- source_word: כָּל יְמֵי חַיָיו
  choice: उसके जीवन भर
  rationale: यह इब्रानी वाक्यांश का स्वाभाविक और अर्थनिष्ठ आधुनिक हिन्दी रूप है।
