review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal ἕως clause, the judicial force of κρίνῃ τὴν κρίσιν, the reference to his people, and the instrumental/associative sense of ἐν τῷ ἐλέει αὐτοῦ. However, the repeated negative subjunctive forms “न करे” make the Hindi read as a negated condition rather than the positive endpoint expressed by the Greek.
  naturalness: “जब तक ... न करे” is not appropriate here in this sentence fragment, since the Greek means “until he does,” not “until he does not.” Removing “न” yields clear, idiomatic Hindi. “मुकदमे का फैसला” is understandable, but “मामले का निर्णय” is slightly less narrowly legal and better retains the Greek phrase’s open judicial nuance.
  terminology: “प्रजा,” “दया,” and “आनन्दित करे” suit a dignified modern Hindi scripture register. The note should retain the Greek wordplay and the alternatives of deciding a case and rendering justice, without making the vindicatory sense the sole meaning.
  issues:
  - severity: high
    issue: Negation in the main text and footnote alternatives
    rationale: The forms “न करे” negate the acts of judging and gladdening. The Greek has positive subjunctive verbs after ἕως, so the Hindi must read “करे.”
  - severity: low
    issue: “मुकदमे” narrows the judicial expression
    rationale: κρίνῃ τὴν κρίσιν can denote deciding a case or rendering judgment/justice. “मामले का निर्णय” is natural Hindi while allowing the wider sense to remain visible in the footnote.
  revised_text: जब तक वह अपनी प्रजा के मामले का निर्णय करे और अपनी दया से उन्हें आनन्दित करे।[a]
