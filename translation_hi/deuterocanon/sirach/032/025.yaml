lexical_decisions:
- source_word: ἕως
  choice: जब तक
  rationale: यह समय की उस सीमा को दर्शाता है जहाँ पूर्ववर्ती कार्य समाप्त होता है; हिन्दी में ‘जब तक’ स्वाभाविक समतुल्य है।
- source_word: κρίνῃ τὴν κρίσιν
  choice: मुकदमे का फैसला करे
  rationale: यूनानी में क्रिया और संज्ञा की पुनरुक्ति न्यायिक निर्णय देने का मुहावरा हो सकती है। हिन्दी में शाब्दिक ‘न्याय का न्याय करे’ अस्वाभाविक है, इसलिए अर्थ और न्यायिक स्वर बनाए रखने के लिए यह रूप चुना गया है।
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: अपनी प्रजा के
  rationale: सम्बन्धकारक रचना को निकटता से सुरक्षित रखता है और यह खुला छोड़ता है कि मामला प्रजा से सम्बन्धित है या उसके पक्ष में। ‘प्रजा’ सामूहिक और गरिमापूर्ण है।
- source_word: εὐφράνει
  choice: आनन्दित करे
  rationale: क्रिया का सकर्मक अर्थ है—वह उन्हें आनन्द का अनुभव कराता है।
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: अपनी दया से
  rationale: ἐν यहाँ साधन अथवा माध्यम का भाव दे सकता है; ‘दया से’ आधुनिक हिन्दी में स्वाभाविक है और उसी अर्थ को व्यक्त करता है।
theological_decisions:
- issue: κρίνῃ τὴν κρίσιν में न्यायिक भाव
  choice: अपनी प्रजा के मुकदमे का फैसला करे
  alternative: अपनी प्रजा को न्याय दिलाए; अपनी प्रजा के विषय में न्याय करे
  rationale: यूनानी वाक्यांश निर्णय, न्याय-निष्पादन या प्रजा के पक्ष में न्याय—इनमें से किसी भाव पर बल दे सकता है। मुख्य पाठ न्यायिक मुहावरे को स्वाभाविक हिन्दी में रखता है, जबकि टिप्पणी अन्य सम्भव अर्थों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘मुकदमे का फैसला’ न्यायिक मुहावरे को स्वाभाविक बनाता है; सम्भावित पक्षसमर्थक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
