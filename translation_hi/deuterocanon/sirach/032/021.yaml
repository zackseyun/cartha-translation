translation:
  language: hi
  text: ठोकर खिलाने वाले रास्ते पर भरोसा न रखो[a], और अपने अंत के विषय में सावधान रहो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी מחתף का अर्थ अनिश्चित है। इसका आशय शायद ठोकर या गिरावट कराने वाले रास्ते से है; अनुवाद ‘फिसलन भरा रास्ता’ या ‘धोखेभरा रास्ता’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: स्रोत के साथ दिया गया यूनानी समानांतर पाठ किसी दूसरे पद का जान पड़ता है; जहाँ वह उपलब्ध इब्रानी पाठ से मेल नहीं खाता, वहाँ उसका अनुसरण नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: भरोसा न रखो
  rationale: בטח का सामान्य अर्थ भरोसा करना या किसी पर निर्भर होना है; निषेधात्मक आज्ञा का सीधा चेतावनी-स्वर रखा गया है।
- source_word: בדרך
  choice: रास्ते पर
  rationale: דרך वास्तविक मार्ग और जीवन-आचरण, दोनों का बिंब हो सकता है; ‘रास्ता’ इस द्विअर्थी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מחתף
  choice: ठोकर खिलानेवाले
  rationale: यह कठिन और अनिश्चित शब्द सम्भवतः ठोकर, फिसलन या गिरावट करानेवाली चीज़ बताता है। यह चयन सम्भावित कारणात्मक अर्थ को रखता है, पर अधिक विशिष्ट ‘फिसलन भरा’ या नैतिक अर्थ वाला ‘विश्वासघाती’ नहीं थोपता।
- source_word: ובאחריתך
  choice: और अपने अंत के विषय में
  rationale: אחרית पर लगे द्वितीय पुरुष एकवचन प्रत्यय को ‘अपने’ से सुरक्षित रखा गया है। ‘अंत’ परिणाम, भावी दशा या जीवन के अंतिम समय की वास्तविक अस्पष्टता बनाए रखता है।
- source_word: השמר
  choice: सावधान रहो
  rationale: निफ़अल आज्ञार्थक रूप स्वयं की रक्षा करने, चौकन्ना रहने या सावधान होने की चेतावनी देता है; ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
