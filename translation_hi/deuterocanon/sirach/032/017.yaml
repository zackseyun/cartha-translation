base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: hi
  text: बुद्धिमान पुरुष फटकार की ओर झुकेगा[a], पर बहकाया हुआ व्यक्ति अपनी चाह के पीछे खिंचा चला जाएगा। बुद्धिमान पुरुष क्रोध नहीं छिपाएगा, पर उपहास करने वाला अपनी जीभ पर पहरा नहीं देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में है: “वह अनाथ की विनती की उपेक्षा नहीं करेगा, न विधवा की, जब वह अपनी शिकायत उँडेलती है।” इस पद पर सुरक्षित इब्रानी पाठ यूनानी पाठ से बहुत अलग है।'
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם
  choice: समझदार पुरुष
  rationale: इब्रानी पद व्याकरण की दृष्टि से पुल्लिंग एकवचन है और नीतिवचन की शैली में प्रयुक्त हुआ है। ‘समझदार पुरुष’ उसके रूप और ज्ञान-साहित्य के भाव, दोनों को बनाए रखता है।
- source_word: יטה תוכחות
  choice: डाँट की ओर झुकेगा
  rationale: יטה में झुकने या मुड़ने का चित्र है, और תוכחות सुधारने वाली डाँट या फटकार को दर्शाता है। यह अनुवाद रूपक और सुधारात्मक बल दोनों को सुरक्षित रखता है।
- source_word: ואחר צרכו ימשך
  choice: अपने मन की चाह के पीछे खिंचा चला जाएगा
  rationale: צרכו आवश्यकता, इच्छा या अपने अनुकूल बात को सूचित कर सकता है, जबकि ימשך पीछे खिंचे चले जाने का भाव देता है। यह अभिव्यक्ति मूल की कुछ अस्पष्टता रखते हुए स्वाभाविक हिन्दी देती है।
- source_word: נפתה
  choice: भोला
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो आसानी से बहकाया या धोखा दिया जा सकता है। ‘भोला’ यहाँ उसकी असावधानी और बहकने की प्रवृत्ति को संक्षेप में व्यक्त करता है।
- source_word: לא יכסה כחמה
  choice: क्रोध नहीं छिपाएगा
  rationale: संरक्षित इब्रानी पाठ कठिन है, पर इसका सीधा अर्थ क्रोध को न ढकना या न छिपाना है। अनुवाद इसी कठिन कथन को बिना उसका आशय धार्मिक या नैतिक रूप से तय किए बनाए रखता है।
- source_word: לץ
  choice: ठट्ठा करने वाला
  rationale: לץ ज्ञान-साहित्य में उद्दंड उपहास करने वाले व्यक्ति के लिए स्थापित शब्द है। यह हिन्दी पद उसके व्यवहार और नैतिक स्वर को स्पष्ट करता है।
- source_word: לא ישמר לשונו
  choice: अपनी जीभ पर पहरा नहीं देगा
  rationale: यह वाणी को नियंत्रित रखने की इब्रानी छवि को स्वाभाविक हिन्दी मुहावरे में निकटता से व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में व्यापक भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ के दोनों कथनों का अनुवाद किया गया है और यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'यूनानी साक्षी: “वह अनाथ की विनती की उपेक्षा नहीं करेगा, न विधवा की, जब वह अपनी शिकायत उँडेलती है।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। इस पद में यूनानी पाठ कोई छोटी शब्दगत भिन्नता नहीं, बल्कि पूरी तरह अलग कथन देता है; इसलिए उसे महत्वपूर्ण वैकल्पिक पाठ के रूप में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु ज्ञान-साहित्य के गरिमापूर्ण और सूत्रात्मक स्वर को रखा गया है। कठिन इब्रानी वाक्य ‘क्रोध नहीं छिपाएगा’ को व्याख्या द्वारा सहज या धर्मशास्त्रीय रूप से सुलझाने के बजाय उसकी तनावपूर्ण प्रत्यक्षता सहित प्रस्तुत किया गया है।
