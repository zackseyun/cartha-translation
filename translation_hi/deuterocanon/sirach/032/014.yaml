base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/014.yaml
  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
translation:
  language: hi
  text: जो परमेश्वर को प्रसन्न करने वाली बातों की खोज करता है, वह शिक्षा ग्रहण करेगा[a]; और जो भोर ही से उसे खोजता है, उसे अपनी प्रार्थना में उत्तर मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी परंपरा में है: “घूस मत चढ़ा, क्योंकि वह उसे स्वीकार नहीं करेगा।” यहाँ उपलब्ध इब्रानी पाठ यूनानी से बहुत भिन्न है।'
    reason: textual_variant
lexical_decisions:
- source_word: דורש חפצי אל
  choice: जो परमेश्वर को प्रसन्न करने वाली बातों की खोज करता है
  rationale: इब्रानी पदबंध संक्षिप्त है और शाब्दिक रूप से परमेश्वर की रुचि या इच्छा की वस्तुओं की खोज को व्यक्त करता है। यह हिंदी रूप उसके आशय को स्वाभाविक ढंग से रखता है, बिना उसे केवल किसी विशेष धर्मवैज्ञानिक धारणा तक सीमित किए।
- source_word: יקח לקח
  choice: शिक्षा ग्रहण करेगा
  rationale: शाब्दिक भाव ‘शिक्षा लेना’ है। ‘शिक्षा ग्रहण करेगा’ ज्ञान-साहित्य के गरिमापूर्ण संदर्भ में स्वाभाविक है और शिक्षा को स्वीकार करने का भाव बनाए रखता है।
- source_word: ומשחרהו
  choice: और जो भोर ही से उसे खोजता है
  rationale: שחר में तड़के खोजने और तत्परता से खोजने, दोनों की छाया हो सकती है। ‘भोर ही से’ समय-संबंधी चित्र को सुरक्षित रखता है; ‘उसे’ का संभावित संदर्भ परमेश्वर है।
- source_word: ישיג מענה / ויענהו בתפלתו
  choice: उसे अपनी प्रार्थना में उत्तर मिलेगा
  rationale: प्राप्त इब्रानी रूपों में ‘उत्तर पाना’ और ‘उसकी प्रार्थना में उत्तर देना’ जैसे निकट भाव मिलते हैं। यह अनुवाद उत्तर और प्रार्थना के संबंध को स्पष्ट रखता है, पर उत्तर मिलने की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: यूनानी परंपरा का अर्थ है, ‘घूस मत चढ़ा, क्योंकि वह उसे स्वीकार नहीं करेगा।’ उपलब्ध इब्रानी साक्ष्य यहाँ पर्याप्त और सर्वथा भिन्न है, इसलिए इब्रानी को मुख्य पाठ में रखा गया और यूनानी पाठांतर को पाद-टिप्पणी में सुरक्षित किया गया।
theological_decisions:
- issue: उपलब्ध इब्रानी और यूनानी पाठ-परंपराओं के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और यूनानी पाठ का पाद-टिप्पणी में उल्लेख
  alternative: 'यूनानी के अनुसार अनुवाद: ‘घूस मत चढ़ा, क्योंकि वह उसे स्वीकार नहीं करेगा।’'
  rationale: इस पद में दोनों परंपराओं का अर्थ मूलतः अलग है। इब्रानी स्रोत उपलब्ध होने के कारण वह मुख्य पाठ का आधार है; किंतु यूनानी पाठ व्याख्या को पूरी तरह बदल देता है, इसलिए उसे छिपाने के बजाय स्पष्ट पाठांतर के रूप में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, ज्ञान-साहित्य के अनुरूप गरिमापूर्ण किंतु सहज रखी गई है। ‘भोर ही से’ मूल के समय-संबंधी बिंब को बचाता है और साथ ही तत्पर खोज का संकेत देता है।
