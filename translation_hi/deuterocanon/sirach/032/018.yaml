base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/018.yaml
  text: A wise man will not take a bribe[c][b][a], but a proud scoffer will not keep the law.
translation:
  language: hi
  text: बुद्धिमान पुरुष रिश्वत नहीं लेता,[c] परन्तु अभिमानी उपहासक[a] व्यवस्था[b] का पालन नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध זד ולץ को दो अलग चरित्र-संज्ञाओं, अर्थात् “अभिमानी और उपहासक,” के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “शिक्षा”; इब्रानी תורה अधिकारपूर्ण शिक्षा को भी सूचित कर सकता है, केवल विधिक व्यवस्था को नहीं।
    reason: lexical_alternative
  - marker: c
    text: यहाँ उपलब्ध यूनानी समानांतर पाठ इस इब्रानी पंक्ति से मेल नहीं खाता; इसलिए अनुवाद मुख्यतः उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  choice: बुद्धिमान पुरुष
  rationale: इब्रानी पदबंध स्पष्ट रूप से पुल्लिंग एकवचन है और नीतिवचनात्मक चरित्र-चित्रण करता है; यह हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: לא יקח
  choice: नहीं लेगा
  rationale: यहाँ अपूर्ण क्रिया-रूप किसी बुद्धिमान व्यक्ति के स्वभावगत आचरण को व्यक्त करता है; हिन्दी का भविष्यत् रूप इस नीतिवचनात्मक दृढ़ता को सहजता से प्रकट करता है।
- source_word: שחד
  choice: रिश्वत
  rationale: यह अनुचित लाभ अथवा पक्षपात कराने के लिए दिए गए धन या उपहार का सामान्य इब्रानी शब्द है; ‘रिश्वत’ इसका सीधा आधुनिक हिन्दी समतुल्य है।
- source_word: זד ולץ
  choice: अभिमानी उपहास करनेवाला
  rationale: 'दोनों चरित्र-संज्ञाओं को मुख्य पाठ में एक संयुक्त वर्णन के रूप में रखा गया है: זד के घमंडी/उद्दण्ड भाव और לץ के तिरस्कारपूर्ण उपहास—दोनों सुरक्षित रहते हैं। इन्हें दो अलग व्यक्तियों के रूप में पढ़ना भी सम्भव है, जिसे पादटिप्पणी में रखा गया है।'
- source_word: לא ישמור
  choice: पालन नहीं करेगा
  rationale: שמר जब תורה के साथ आता है तो उसका अर्थ केवल रक्षा करना नहीं, बल्कि मानना और उसके अनुसार चलना होता है; ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תורה
  choice: व्यवस्था
  rationale: यह शब्द अधिकारपूर्ण शिक्षा अथवा विधि—दोनों का बोध करा सकता है। मुख्य पाठ में ‘व्यवस्था’ नैतिक आज्ञा के पालन का भाव स्पष्ट करता है, जबकि व्यापक अर्थ ‘शिक्षा’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ज्ञान-साहित्य के सन्दर्भ में תורה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा अथवा उपदेश
  rationale: पद नैतिक सत्यनिष्ठा की तुलना उद्दण्ड अवज्ञा से करता है। ‘व्यवस्था’ अधिकारपूर्ण नैतिक विधान का भाव व्यक्त करती है, पर इब्रानी תורה केवल विधिक संहिता तक सीमित न होकर शिक्षा भी हो सकती है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: זד ולץ को एक संयुक्त चरित्र या दो चरित्रों के रूप में पढ़ना
  choice: 'एक संयुक्त चरित्र: ‘अभिमानी उपहास करनेवाला’'
  alternative: 'दो चरित्र: ‘अभिमानी और उपहास करनेवाला’'
  rationale: इब्रानी में दोनों शब्दों के बीच संयोजक नहीं है, इसलिए संयुक्त विशेषणात्मक अर्थ सम्भव और प्रवाहपूर्ण है; फिर भी दो समानांतर चरित्र-संज्ञाओं की व्याख्या वास्तविक सम्भावना है और उसे पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उपहास करनेवाला’ ज्ञान-साहित्य में तिरस्कारपूर्ण उपहास करने वाले चरित्र को व्यक्त करता है; ‘पालन करना’ תורה के प्रति व्यवहारगत आज्ञाकारिता को स्वाभाविक हिन्दी में सामने लाता है।
