base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/015.yaml
  text: Whoever seeks the law will grasp it[b][a], but the one who plays the hypocrite will be caught by it.
translation:
  language: hi
  text: जो व्यवस्था की खोज करता है, वह उसे पा लेगा; पर जो ढोंग करता है[a], वह उसी में फँस जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द ומתלהלה का अर्थ अनिश्चित है; इसका आशय ‘दिखावा करने वाला’, ‘अपने को धोखा देने वाला’ या इसी प्रकार का कोई असच्चा व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद का यूनानी पाठ बहुत भिन्न है: “और अन्यायपूर्ण बलिदान में लगे न रहो, क्योंकि प्रभु न्यायी है और उसके यहाँ किसी का पक्षपात नहीं होता।” हिब्रू और यूनानी साक्षी यहाँ पाठ के अलग-अलग रूपों को प्रतिबिम्बित करते जान पड़ते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: דורש
  choice: खोज करता है
  rationale: דרש का कृदन्त सक्रिय और गंभीर खोज या अनुसरण को व्यक्त करता है; ‘खोज करता है’ इसे केवल औपचारिक अध्ययन तक सीमित नहीं करता।
- source_word: תורה
  choice: व्यवस्था
  rationale: यहाँ תורה सामान्य शिक्षा भी सूचित कर सकता है, पर बेन सीरा के यहूदी ज्ञान-साहित्यिक संदर्भ में परमेश्वर की अधिकारपूर्ण तोराह/व्यवस्था का भाव प्रबल है।
- source_word: יפיקנה
  choice: उसे पा लेगा
  rationale: הפיק यहाँ खोजी हुई वस्तु को प्राप्त करने या हासिल करने का भाव देता है। ‘पा लेगा’ स्वाभाविक हिन्दी में प्राप्ति को व्यक्त करता है और इसे केवल बौद्धिक समझ तक सीमित नहीं करता।
- source_word: ומתלהלה
  choice: जो ढोंग करता है
  rationale: यह कठिन और अनिश्चित रूप किसी असच्चे, दिखावटी या आत्म-छल में पड़े व्यक्ति की ओर संकेत कर सकता है। ‘ढोंग करता है’ सच्चे खोजी के विपरीत उसकी निष्कपटता की कमी को व्यक्त करता है, जबकि पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: יוקש
  choice: फँस जाएगा
  rationale: निष्क्रिय क्रिया का सीधा अर्थ फन्दे में पड़ना या पकड़ा जाना है; ‘फँस जाएगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בו
  choice: उसी में
  rationale: 'सर्वनाम का निकटतम पूर्वपद ‘व्यवस्था’ है। ‘उसी में’ हिब्रू के स्थानवाचक/साधनवाचक खुलेपन को बनाए रखता है: वह व्यवस्था के संबंध में अथवा उसी के द्वारा फँसता है।'
theological_decisions:
- issue: תורה को सामान्य ‘शिक्षा’ या विशिष्ट ‘व्यवस्था’ के रूप में प्रस्तुत करना
  choice: व्यवस्था
  alternative: शिक्षा; उपदेश; तोराह
  rationale: हिब्रू साक्ष्य को प्राथमिक रखते हुए ‘व्यवस्था’ इस यहूदी ज्ञान-साहित्यिक संदर्भ में תורה के दैवी और अधिकारपूर्ण स्वर को सुरक्षित रखती है, यद्यपि शब्द में व्यापक ‘शिक्षा’ का भाव भी संभव है।
- issue: कठिन शब्द ומתלהלה का अर्थ
  choice: जो ढोंग करता है
  alternative: दिखावा करने वाला; अपने को धोखा देने वाला; उच्छृंखल व्यक्ति
  rationale: यह रूप शाब्दिक रूप से अनिश्चित है और यूनानी समानांतर इसे स्पष्ट नहीं करता, क्योंकि वहाँ पाठ ही भिन्न है। मुख्य पाठ में असच्चे आचरण का संभावित भाव रखा गया है और पादटिप्पणी में अन्य संभावनाएँ दी गई हैं।
- issue: בו में व्यवस्था के द्वारा या व्यवस्था में फँसने का संबंध
  choice: उसी में
  alternative: उसी के द्वारा; उसके कारण
  rationale: ‘उसी में’ हिब्रू की वास्तविक अस्पष्टता को अनावश्यक रूप से कारणात्मक अर्थ में नहीं बाँधता और विरोधी समानांतरता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यवस्था’ धार्मिक-साहित्यिक भार को सुरक्षित रखती है; ‘पा लेगा’ और ‘फँस जाएगा’ साधारण पाठक के लिए स्पष्ट हैं। कठिन हिब्रू और यूनानी पाठांतर को मुख्य पाठ में जबरन सुलझाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
