    reason: textual_variant
lexical_decisions:
- source_word: דבר
  choice: बोलो
  rationale: यह דבר का आज्ञार्थक रूप है। ‘बोलो’ सीधी आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נער
  choice: हे युवक
  rationale: इब्रानी संज्ञा पुल्लिंग एकवचन है और सामान्यतः किसी युवा पुरुष को सूचित करती है। संबोधन को स्पष्ट करने के लिए ‘हे युवक’ रखा गया है।
- source_word: אם צריך אתה
  choice: यदि तुम्हारे लिए बोलना आवश्यक हो
  rationale: वाक्यांश आवश्यकता या उचित अवसर का बोध कराता है। ‘बोलना’ प्रसंग से पूरा किया गया है, जिससे हिन्दी स्वाभाविक रहती है और द्वितीय पुरुष का संकेत भी बना रहता है।
- source_word: בחזק
  choice: संयम से
  rationale: इस स्थान पर इब्रानी पाठ कठिन और अर्थ अनिश्चित है। सभा में युवा व्यक्ति के नपे-तुले बोलने के प्रसंग के अनुसार ‘संयम से’ संभावित आशय देता है, पर अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: פעמים ושלש
  choice: दो या तीन बार
  rationale: शाब्दिक रूप से यह ‘दो बार और तीन बार’ है तथा सीमित पुनरावृत्ति का संकेत देता है। ‘दो या तीन बार’ निकट और स्वाभाविक हिन्दी है।
- source_word: אם ישאלך
  choice: यदि तुमसे पूछा जाए
  rationale: यह शर्तसूचक वाक्यांश है। कर्मवाच्य हिन्दी अनिर्दिष्ट प्रश्नकर्ता को बिना जोड़े मूल अर्थ बनाए रखती है।
