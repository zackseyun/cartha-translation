  text: युवक, यदि तुम्हें बोलना आवश्यक हो, तो संयम से[a] बोलो; और यदि तुमसे पूछा जाए, तो दो या तीन बार ही बोलो।
  philosophy: optimal-equivalence
  footnotes:
