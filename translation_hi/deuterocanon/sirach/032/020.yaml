  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: hi
  text: बाधाओं से भरे मार्ग पर मत चलो[a][b], और एक ही रुकावट से दो बार ठोकर मत खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘מוקשות का मार्ग’ है। यह शब्द फंदों, जालों या ठोकर दिलाने वाली बाधाओं का संकेत दे सकता है; यहाँ ‘बाधाओं से भरे’ अगले खंड में ठोकर खाने के विचार के अनुरूप है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में यहाँ एक बिल्कुल भिन्न वाक्य है: ‘जो प्रसन्नता से सेवा करता है, वह स्वीकार किया जाएगा, और उसकी विनती बादलों तक पहुँचेगी।’ मुख्य पाठ सुरक्षित इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: मार्ग पर
  rationale: דרך का अर्थ ‘मार्ग, रास्ता’ है। ‘मार्ग’ वास्तविक रास्ते और जीवन-आचरण, दोनों के रूपक को बनाए रखता है।
- source_word: מוקשות
  choice: बाधाओं से भरे
  rationale: यह शब्द फंदों, जालों या ठोकर का कारण बनने वाली वस्तुओं का संकेत दे सकता है। अगले खंड में ठोकर खाने का उल्लेख होने के कारण ‘बाधाओं से भरे’ समानांतरता को स्वाभाविक रूप से व्यक्त करता है, पर छिपे हुए फंदों के अर्थ तक सीमित नहीं करता।
- source_word: אל תלך
  choice: मत चलो
  rationale: הלך का सामान्य अर्थ ‘चलना/जाना’ है। ‘मत चलो’ ज्ञान-साहित्य में जीवन-आचरण के रूपक और मार्ग की प्रतिमा, दोनों को सुरक्षित रखता है।
- source_word: ואל תתקל
  choice: और … ठोकर मत खाओ
  rationale: यह क्रिया इस प्रसंग में किसी अवरोध से उलझकर ठोकर खाने या संकट में पड़ने को व्यक्त करती है। हिंदी में ‘ठोकर खाना’ ठोस और रूपकात्मक दोनों अर्थों में स्वाभाविक है।
- source_word: בנגף
  choice: एक ही रुकावट से
  rationale: נגף किसी आघात या ठोकर का कारण बनने वाली वस्तु को सूचित कर सकता है। एकवचन संज्ञा के साथ ‘दो बार’ आने से हिंदी में ‘एक ही रुकावट से’ पुनरावृत्ति का आशय स्पष्ट होता है, यद्यपि ‘ही’ मूल में अलग शब्द के रूप में नहीं है।
- source_word: פעמים
  choice: दो बार
  rationale: यहाँ פעמים का सीधा क्रियाविशेषणीय अर्थ ‘दो बार’ है।
