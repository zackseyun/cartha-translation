base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: hi
  text: दुष्टों की राह पर भरोसा मत रखो, और अपने रास्तों पर सावधान रहो।[a] अपने सभी मार्गों में अपनी रक्षा करो, क्योंकि जो कोई इन बातों को करता है, वह आज्ञा का पालन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: काहाना के हिब्रू पाठ में “दुष्टों की राह पर भरोसा मत रखो, और अपने रास्तों पर सावधान रहो” पद-संख्या से पहले आता है। सिराख 32:22 के दिए गए यूनानी समानांतर से इसका मेल नहीं है; इसलिए संभव है कि यह इस पद का भाग न होकर पास के किसी पद की सामग्री हो।
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: दुष्टों की राह पर भरोसा मत रखो
  rationale: निषेध और דרך के मार्ग-रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; רשעים का बहुवचन ‘दुष्टों’ के रूप में सुरक्षित है।
- source_word: ובארחותיך הזהר
  choice: और अपने रास्तों पर सावधान रहो
  rationale: ארחותיך को आचरण के रास्तों के रूप में और הזהר को व्यावहारिक चेतावनी के रूप में प्रस्तुत करता है।
- source_word: בכל דרכיך
  choice: अपने सभी मार्गों में
  rationale: हिब्रू के व्यापक अर्थ—जीवन और आचरण के समस्त मार्ग—को रूपक सहित बनाए रखता है।
- source_word: שמור נפשך
  choice: अपनी रक्षा करो
  rationale: נפש यहाँ केवल अमूर्त ‘आत्मा’ नहीं, बल्कि स्वयं व्यक्ति या जीवन को सूचित करती है; इसलिए यह सहज और संदर्भानुकूल है।
- source_word: כי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले उपदेश का कारण बताने वाले वाक्य के रूप में जोड़ता है।
- source_word: כל עושה אלה
  choice: जो कोई ये काम करता है
  rationale: कृदन्त पदबंध के सामान्य और सर्वसमावेशी भाव को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שומר מצוה
  choice: आज्ञा का पालन करता है
  rationale: שמר के आज्ञाकारिता-संबंधी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और מצוה के एकवचन को ‘आज्ञा’ के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में מצוה का दायरा
  choice: आज्ञा
  alternative: कोई आज्ञा; व्यवस्था की आज्ञा
  rationale: मूल पाठ किसी विशेष आज्ञा या पूरी तोराह को स्पष्ट रूप से निर्दिष्ट नहीं करता। अतः एकवचन रखा गया है, पर ऐसा धर्मवैज्ञानिक विस्तार नहीं जोड़ा गया जो पाठ में नहीं है।
- issue: נפש का अर्थ
  choice: स्वयं व्यक्ति की रक्षा
  alternative: अपनी आत्मा की रक्षा; अपने जीवन की रक्षा
  rationale: यहाँ नैतिक सावधानी के प्रसंग में נפש पूरे व्यक्ति या जीवन को सूचित कर सकता है। ‘अपनी रक्षा करो’ इस अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘राह/रास्ते/मार्ग’ हिब्रू के निकटवर्ती मार्ग-संबंधी शब्दों को स्वाभाविक हिन्दी में अलग-अलग रखते हैं। पाठ-साक्ष्य की अनिश्चितता को मुख्य पाठ से अंश हटाकर नहीं, बल्कि [a] टिप्पणी द्वारा स्पष्ट किया गया है।
