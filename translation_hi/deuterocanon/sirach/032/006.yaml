base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: hi
  text: जैसे शुद्ध सोने की जड़ाइयाँ और पन्ने की मुहर[a], वैसे ही नए दाखरस की मधुरता के साथ भजन का स्वर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हरितमणि की मुहर।” ברקת नामक रत्न की ठीक पहचान अनिश्चित है; “बेरिल” एक प्रचलित विद्वत्परक विकल्प है।
    reason: lexical_alternative
  - marker: b
    text: दिए गए यूनानी समानांतर में है, “प्रभु के सामने खाली हाथ दिखाई न दो।” यह संभवतः अलग पाठ-परंपरा या पद-क्रम को दर्शाता है। मुख्य अनुवाद उपलब्ध इब्रानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: מלואות פז
  choice: शुद्ध सोने की जड़ाइयाँ
  rationale: פז उत्तम या शुद्ध सोना है, और מלואות यहाँ आभूषण में जड़ी हुई सजावटी बनावट का संकेत देता है। ‘जड़ाइयाँ’ काव्यात्मक आभूषण-बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חותם ברקת
  choice: पन्ने की मुहर
  rationale: חותם का अर्थ मुहर या मुद्रांक है। ברקת किसी बहुमूल्य हरे रत्न का नाम है, जिसकी ठीक पहचान अनिश्चित है; ‘पन्ना’ हिन्दी में पारंपरिक और सहज विकल्प है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: קול מזמור
  choice: भजन का स्वर
  rationale: קול स्वर/ध्वनि और מזמור वाद्य-संगत गीत या भजन को दर्शाता है। ‘भजन का स्वर’ मूल की संक्षिप्त, धार्मिक-काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: על נועם תירוש
  choice: नई दाखमधु की मधुरता के साथ
  rationale: תירוש नई दाखमधु है और נועם मनोहरता या मधुरता। על का संबंध यहाँ कुछ अस्पष्ट है; ‘के साथ’ भोज के प्रसंग में संगति व्यक्त करता है, बिना अर्थ को आवश्यकता से अधिक निश्चित किए।
theological_decisions:
- issue: इब्रानी पाठ और भिन्न यूनानी समानांतर में चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी काव्य-पंक्ति का अनुवाद
  alternative: 'यूनानी समानांतर: ‘प्रभु के सामने खाली हाथ दिखाई न देना।’'
  rationale: उपलब्ध इब्रानी साक्ष्य पूर्ण और उच्च विश्वसनीयता वाला है, जबकि दिया गया यूनानी पाठ अर्थ की दृष्टि से इस पंक्ति के समानांतर नहीं है और अलग पाठ-परंपरा या पद-क्रम को दर्शाता है। इसलिए मुख्य अनुवाद इब्रानी का अनुसरण करता है और अंतर को पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप। ‘दाखमधु’ भोज-संदर्भ और प्राचीन पेय का संकेत स्पष्ट रखता है। मूल के संक्षिप्त उपमा-विन्यास और על की संबंधगत अस्पष्टता को यथासंभव बनाए रखा गया है।
