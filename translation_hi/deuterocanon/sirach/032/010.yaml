  yaml_path: translation/deuterocanon/sirach/032/010.yaml
  text: Before hail[a], lightning flashes forth; and before shame[b], favor goes forth.
translation:
  language: hi
  text: ओलों से पहले बिजली चमकती है; और लज्जा से पहले अनुग्रह[a] प्रकट होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कृपा,” “अनुकूलता,” अथवा “मनोहरता”; इब्रानी חֵן के ये अर्थ भी संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद का यूनानी समानांतर पाठ बहुत भिन्न है: “भली दृष्टि से प्रभु की महिमा कर, और अपने हाथों की पहली उपज को कम न कर।” मुख्य पाठ यहाँ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי
  choice: से पहले
  rationale: दोनों अर्धपंक्तियों में समय अथवा क्रम की पूर्वता व्यक्त होती है; हिन्दी में ‘से पहले’ इसका सहज और सीधा रूप है।
- source_word: בָרָד
  choice: ओले पड़ना
  rationale: בָרָד का सामान्य अर्थ ‘ओले’ है। वाक्य में प्राकृतिक हिन्दी के लिए क्रियात्मक पदबंध ‘ओले पड़ने’ का प्रयोग किया गया है।
- source_word: יִנְצַח
  choice: चमक उठती है / प्रकट होती है
  rationale: यहाँ क्रिया को ‘विजयी होना’ नहीं, बल्कि पहले निकलने या दिखाई देने के संदर्भगत अर्थ में लिया गया है। बिजली के साथ ‘चमक उठती है’ और कृपादृष्टि के साथ ‘प्रकट होती है’ हिन्दी के स्वाभाविक सहप्रयोग हैं, जबकि दोनों जगह पूर्व-प्रकटन का समान भाव बना रहता है।
- source_word: בָּרָק
  choice: बिजली
  rationale: मौसम-संबंधी इस शब्द का मानक और सामान्य हिन्दी रूप ‘बिजली’ है।
- source_word: בוֹשׁ
  choice: लज्जा
  rationale: शब्द लज्जा या अपमान की दशा सूचित करता है। ‘लज्जा’ मूल की संक्षिप्त, नीतिवचन-सदृश अभिव्यक्ति को बनाए रखता है।
- source_word: חֵן
  choice: कृपादृष्टि
  rationale: חֵן के ‘कृपा, अनुग्रह, मनोहरता अथवा किसी की दृष्टि में अनुकूलता’ जैसे अर्थ हो सकते हैं। ‘कृपादृष्टि’ यहाँ सामाजिक अनुकूलता को व्यक्त करती है और अनावश्यक रूप से उद्धार-सिद्धांत का अर्थ नहीं जोड़ती।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में חֵן का अनुवाद
  choice: कृपादृष्टि
  alternative: कृपा / अनुग्रह / मनोहरता
  rationale: यह प्रसंग स्पष्ट रूप से उद्धार-सिद्धांत की चर्चा नहीं करता। ‘कृपादृष्टि’ अनुकूल स्वीकृति का अर्थ सुरक्षित रखती है, जबकि टिप्पणी में अन्य वास्तविक अर्थ-संभावनाएँ दी गई हैं।
- issue: इब्रानी और यूनानी पाठों में पर्याप्त भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण
  alternative: 'यूनानी पाठ: ‘भली दृष्टि से प्रभु की महिमा कर, और अपने हाथों की पहिली उपज को कम न कर।’'
  rationale: प्रदान किया गया इब्रानी पाठ उच्च-विश्वसनीयता वाला मुख्य मूल-पाठ साक्ष्य है। यूनानी समानांतर काफी अलग पाठ प्रस्तुत करता है, इसलिए उसे मिलाकर अस्पष्ट नया पाठ बनाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश रखी गई है। पहले अर्धवाक्य में प्राकृतिक दृश्य के कारण ‘चमक उठती है’ और दूसरे में अमूर्त संज्ञा के कारण ‘प्रकट होती है’ चुना गया है। अर्धविराम दोनों समानांतर पंक्तियों का संतुलन स्पष्ट करता है।
