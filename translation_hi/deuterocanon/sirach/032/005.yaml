base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/005.yaml
  text: Like a gold ornament set with onyx and sapphire[c][b][a], so are beautiful words at a banquet of wine.
translation:
  language: hi
  text: जैसे सोने का आभूषण, जिसमें सुलेमानी पत्थर[a] और नीलम[b] जड़े हों, वैसे ही मदिरा-भोज में सुंदर वचन शोभा देते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुलेमानी पत्थर’ अनूदित इब्रानी रत्न-नाम की ठीक पहचान निश्चित नहीं है; इसके लिए अन्य रत्नों के नाम भी प्रस्तावित किए गए हैं।
    reason: lexical_alternative
  - marker: b
    text: प्राचीन ग्रंथों में ‘नीलम’ कहलाने वाला पत्थर आधुनिक नीलम से ठीक-ठीक समान न भी हो सकता है; कुछ विद्वान इसे लाजवर्द मानते हैं।
    reason: lexical_alternative
  - marker: c
    text: इस पद के लिए दिया गया यूनानी समानांतर पाठ यहाँ के इब्रानी शब्दों से मेल नहीं खाता और संभवतः किसी भिन्न पाठ-संरेखण को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: כרביד
  choice: जैसे सोने का आभूषण
  rationale: רביד गले में पहने जाने वाले आभूषण या हार को सूचित करता है। ‘आभूषण’ मूल बिंब को बनाए रखता है, पर उसके ठीक रूप को अनावश्यक रूप से निश्चित नहीं करता; כ उपमा को व्यक्त करता है।
- source_word: נפך
  choice: सुलेमानी पत्थर
  rationale: इस प्राचीन रत्न की आधुनिक पहचान अनिश्चित है। ‘सुलेमानी पत्थर’ अंग्रेज़ी परामर्श-पाठ के ‘onyx’ का स्वाभाविक हिन्दी रूप है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ספיר
  choice: नीलम
  rationale: ספיר का पारंपरिक अनुवाद ‘नीलम’ है, यद्यपि प्राचीन संदर्भ में इससे लाजवर्द अभिप्रेत हो सकता है। इस अंतर को पादटिप्पणी में बताया गया है।
- source_word: כך נאים
  choice: वैसे ही ... शोभा देती हैं
  rationale: यह पद आकर्षकता और अवसर के अनुकूल होने—दोनों का भाव रखता है। ‘शोभा देती हैं’ आभूषण से जुड़ी उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דברים יפים
  choice: सुंदर बातें
  rationale: मूल में वाणी की सुंदरता और उत्कृष्टता पर बल है। ‘सुंदर बातें’ आभूषण के सौंदर्य से की गई तुलना को सीधे व्यक्त करती हैं।
- source_word: על משתה היין
  choice: दाखमधु की दावत में
  rationale: משתה היין दाखमधु से युक्त भोज या दावत है। यह अनुवाद सामाजिक प्रसंग और दाखमधु के स्पष्ट उल्लेख—दोनों को बनाए रखता है।
theological_decisions:
- issue: इब्रानी और दिए गए यूनानी समानांतर पाठ का संरेखण
  choice: इस पद का अनुवाद उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी बेन सीरा पाठ से किया गया है।
  alternative: दिए गए यूनानी पाठ का अनुसरण करना, जिसमें बुराई और अन्याय से दूर होने की बात है।
  rationale: इब्रानी पाठ पूर्ण, सुसंगत और इस संदर्भ के अनुकूल है, जबकि दिया गया यूनानी समानांतर अर्थ की दृष्टि से इससे मेल नहीं खाता और संभवतः किसी दूसरे पद या भिन्न पाठ-संरेखण को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘दाखमधु’ भोज के प्राचीन परिवेश को स्पष्ट करता है, और ‘शोभा देती हैं’ आभूषण तथा उपयुक्त वाणी के बीच की सौंदर्यात्मक तुलना को स्वाभाविक बनाता है।
