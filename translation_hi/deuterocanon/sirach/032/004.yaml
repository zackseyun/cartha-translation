  text: Like a seal on a bag of gold is a song to God at a banquet of wine[a][b].
translation:
  language: hi
  text: सोने की थैली पर मुहर के समान, दाखमधु के भोज में परमेश्वर का गीत है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के लिए गीत।” इब्रानी पद संक्षिप्त है; इसका अर्थ परमेश्वर से संबंधित गीत या परमेश्वर को संबोधित गीत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद-खंड की पिछली इब्रानी पंक्तियों का पाठ-परंपरा में निश्चित करना कठिन है। यह अंतिम उपमा सबसे स्पष्ट अंश है और इसका अनुवाद उपलब्ध इब्रानी पाठ से सीधे किया गया है; तुलना के लिए यूनानी पाठ को भी ध्यान में रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: मुहर के समान
  rationale: उपसर्ग כ तुलना प्रकट करता है। חותם का सामान्य और स्वाभाविक हिन्दी अर्थ ‘मुहर’ है; ‘मुद्रिका’ अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: על כיס זהב
  choice: सोने की थैली पर लगी
  rationale: כיס बहुमूल्य वस्तुएँ या धन रखने की थैली है। हिन्दी में ‘सोने की थैली’ ठोस बिंब को सहजता से बनाए रखता है; ‘लगी’ जोड़ने से मुहर और थैली का संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: שיר
  choice: गाया गया गीत
  rationale: שיר एकवचन में ठोस रूप से ‘गीत’ है। ‘गाया गया’ हिन्दी वाक्य में भोज के प्रसंग को स्वाभाविक बनाता है और संज्ञा के आशय से आगे कोई विशेष विधागत अर्थ नहीं जोड़ता।
- source_word: אל
  choice: परमेश्वर के लिए
  rationale: संक्षिप्त पद שיר אל में गीत और परमेश्वर के बीच संबंध अस्पष्ट है। ‘परमेश्वर के लिए’ संभावित दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक संबंध फुटनोट में रखा गया है।
- source_word: על משתה היין
  choice: दाखमधु के भोज में
  rationale: משתה भोज, विशेषकर पीने के भोज, को दर्शाता है और היין उसे दाखमधु से विशिष्ट करता है। प्रसंग में על का मुहावरेदार हिन्दी रूप ‘में’ है।
theological_decisions:
- issue: संक्षिप्त इब्रानी पद שיר אל
  choice: परमेश्वर के लिए गाया गया गीत
  alternative: परमेश्वर का गीत
  rationale: इब्रानी पद यह पूरी तरह निश्चित नहीं करता कि गीत परमेश्वर को संबोधित है या सामान्य रूप से उनसे संबंधित। मुख्य पाठ दिशात्मक अर्थ देता है, और फुटनोट वैकल्पिक संबंध को सुरक्षित रखता है; इस प्रकार कोई संकीर्ण उपासना-संबंधी निष्कर्ष आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और नीतिवचन-सदृश विन्यास रखा गया है। ‘दाखमधु’ बाइबलीय प्रसंग में परिचित तथा ‘मदिरा’ से अधिक विशिष्ट है। तुलना की इब्रानी शब्द-व्यवस्था को हिन्दी में यथासंभव बनाए रखते हुए ‘लगी’ और ‘गाया गया’ से वाक्य को स्वाभाविक बनाया गया है।
