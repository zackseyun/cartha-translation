base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/024.yaml
  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: hi
  text: जो व्यवस्था का पालन करता है, वह अपने जीवन की रक्षा करता है[a]; और जो यहोवा पर भरोसा रखता है, वह लज्जित न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का यूनानी समानांतर पाठ बहुत भिन्न है: “जब तक वह मनुष्य को उसके कामों के अनुसार और मनुष्यों के कार्यों को उनके विचारों के अनुसार प्रतिफल न दे।” मुख्य पाठ यहाँ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: נוצר
  choice: पालन करता है
  rationale: नצר का मूल अर्थ रक्षा करना या सँभालकर रखना है; व्यवस्था के साथ ‘पालन करना’ स्वाभाविक हिन्दी है और सावधानी से मानने का भाव व्यक्त करता है।
- source_word: תורה
  choice: व्यवस्था
  rationale: यहाँ תורה परमेश्वर की वाचा-संबंधी शिक्षा और नियम को दर्शाती है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में इस धार्मिक-कानूनी अर्थ को संक्षेप में व्यक्त करती है।
- source_word: שומר נפשו
  choice: अपने जीवन की रक्षा करता है
  rationale: נפש यहाँ अलग अमूर्त ‘आत्मा’ की अपेक्षा व्यक्ति के जीवन को सूचित करता है। यह अनुवाद शומר की रक्षक-छवि को भी बनाए रखता है।
- source_word: ובוטח ביהוה
  choice: और जो यहोवा पर भरोसा रखता है
  rationale: בטח के लिए ‘भरोसा रखना’ सहज और सटीक है। सहभागी रूप को सामान्य कथन के रूप में ‘जो…रखता है’ किया गया है।
- source_word: לא יבוש
  choice: वह लज्जित न होगा
  rationale: בוש असफल आशा के कारण लज्जित या निराश होने का भाव रखता है। ‘लज्जित न होगा’ परिचित बाइबलीय मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: हिन्दी में ‘यहोवा’ चार अक्षरों वाले इब्रानी निजी नाम को स्पष्ट रूप से प्रस्तुत करता है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: इब्रानी और यूनानी पाठों के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखना
  alternative: 'यूनानी: ‘जब तक वह मनुष्य को उसके कामों के अनुसार और मनुष्यों के कार्यों को उनके विचारों के अनुसार प्रतिफल न दे।’'
  rationale: इस स्थान पर इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, जबकि यूनानी में एक बिल्कुल अलग कथन है। दोनों को मिलाने से वास्तविक पाठांतर मिट जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबलीय शैली रखी गई है। ‘अपने जीवन की रक्षा’ सामान्य पाठक के लिए स्पष्ट है, जबकि इब्रानी समानांतरता और अर्थ भी सुरक्षित रहता है।
