  text: When it is time to depart, do not linger; go home and do what pleases you.
translation:
  language: hi
  text: विदा होने का समय आए तो देर न करो; अपने घर जाओ और अपनी इच्छा पूरी करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בעת מפקד
  choice: विदा होने का समय आए तो
  rationale: संदर्भ में מפקד सभा या भोज से विदा होने के नियत समय को सूचित करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אל תתאחר
  choice: देर न करो
  rationale: क्रिया का सीधा निषेधात्मक अर्थ ‘विलंब न करना’ है।
- source_word: פטר לביתך
  choice: अपने घर जाओ
  rationale: פטר यहाँ स्वयं को सभा से अलग करके घर की ओर चले जाने के अर्थ में है; शाब्दिक ‘अपने को मुक्त करो’ हिन्दी में अस्वाभाविक होता।
- source_word: ושלם רצון
  choice: और अपनी इच्छा पूरी करो
  rationale: שלם का अर्थ ‘पूरा करना’ और רצון का अर्थ ‘इच्छा/अभिलाषा’ लिया गया है। कर्ता से जुड़े स्वाभाविक अर्थ को ‘अपनी’ से व्यक्त किया गया, यद्यपि इब्रानी में संबंधसूचक सर्वनाम स्पष्ट नहीं है।
theological_decisions:
- issue: רצון किसकी इच्छा को दर्शाता है
  choice: अपनी इच्छा
  alternative: जो प्रसन्न करता है वह करो / इच्छा पूरी करो
  rationale: निकट संदर्भ में घर लौटने वाले व्यक्ति को निर्देश दिया जा रहा है, इसलिए उसकी अपनी इच्छा सबसे स्वाभाविक आशय है; फिर भी इसे किसी विशेष धार्मिक कर्तव्य या परमेश्वर की इच्छा के रूप में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। स्रोत-पाठ में पद-संख्या (יא) के बाद आने वाले वाक्य को ही सिराख 32:11 माना गया है; उससे पहले का मेज़ पर कम बोलने वाला वाक्य पिछले पद का अंश है।
