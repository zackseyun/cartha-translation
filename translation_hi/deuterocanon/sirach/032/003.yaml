base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/003.yaml
  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
translation:
  language: hi
  text: हे बुज़ुर्ग, बोलिए, क्योंकि यह आपके लिए उचित है; पर समझ-बूझ के साथ संयम बरतिए[a], और गीत को मत रोकिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध והצנע שכל संक्षिप्त और कुछ अस्पष्ट है। इसका अर्थ ‘समझ के साथ संयम बरतो,’ ‘बुद्धि में विनम्र रहो,’ या ‘विवेकपूर्ण संकोच दिखाओ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ यहाँ बहुत भिन्न है: “मैदा चढ़ाने वाला उपकार का बदला चुकाता है।” यह इस पद की एक अलग पाठ-परंपरा का संकेत देता है।'
    reason: textual_variant
lexical_decisions:
- source_word: מלל
  choice: बोलिए
  rationale: यह ‘बोलना’ अर्थ देने वाली आज्ञार्थक क्रिया है। आदरसूचक रूप भोज के प्रसंग और संबोधित बुज़ुर्ग की गरिमा के अनुकूल है।
- source_word: שב
  choice: हे बुज़ुर्ग
  rationale: यहाँ किसी आयु और सम्मान में बड़े व्यक्ति को संबोधित किया गया है। ‘बुज़ुर्ग’ आधुनिक हिन्दी में आयु के साथ आदर का भाव भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: כי הוא לך
  choice: क्योंकि यह आपके लिए उचित है
  rationale: शाब्दिक रूप से यह वस्तु किसी की होने का भाव दे सकता है, पर प्रसंग में बोलने का अधिकार और सामाजिक उपयुक्तता अभिप्रेत है।
- source_word: והצנא שכל
  choice: पर समझ-बूझ के साथ संयम बरतिए
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अनिश्चित है। अनुवाद में שכל को ‘समझ-बूझ’ और क्रिया के संभावित संयम/संकोच के भाव को ‘संयम बरतिए’ से व्यक्त किया गया है; ‘पर’ पिछले कथन को संतुलित करता है।
- source_word: ואל תמנע שיר
  choice: और गीत में बाधा न डालिए
  rationale: מנע का अर्थ रोकना, वंचित करना या बाधा डालना हो सकता है। यह रूप भोज में चल रहे गान को अनावश्यक रूप से न रोकने का स्वाभाविक हिन्दी निर्देश देता है।
theological_decisions:
- issue: ज्ञान-भोज के प्रसंग में שב का सामाजिक संबोधन
  choice: हे बुज़ुर्ग
  alternative: हे वृद्ध पुरुष
  rationale: ‘बुज़ुर्ग’ संबोधित व्यक्ति की पुरुष-वाचक प्रसंगगत पहचान के साथ सम्मानसूचक सामाजिक अर्थ बनाए रखता है और हिन्दी में ‘वृद्ध पुरुष’ की अपेक्षा अधिक स्वाभाविक है।
- issue: והצנא שכל में बोलने और संयम के बीच संबंध
  choice: पर समझ-बूझ के साथ संयम बरतिए
  alternative: और बुद्धि में विनम्र रहिए
  rationale: मूल पदबंध की अनिश्चितता को पूर्णतः किसी एक नैतिक व्याख्या में नहीं बाँधा गया। चुना हुआ पाठ विवेकपूर्ण, नपे-तुले बोलने का संभावित भाव रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और गरिमापूर्ण रखी गई है। ‘बोलिए,’ ‘बरतिए’ और ‘डालिए’ के समान आदरसूचक रूप भोज में सम्मानित बुज़ुर्ग को दिए निर्देश के स्वर को बनाए रखते हैं।
