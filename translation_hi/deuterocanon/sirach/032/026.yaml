  yaml_path: translation/deuterocanon/sirach/032/026.yaml
  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: hi
  text: उसके संकट के समय दया मनोहर होती है[b][a], जैसे वर्षा न होने के समय वर्षा के बादल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संकट के समय दया उपयुक्त होती है।” विशेषण सुंदरता, सुखदता या अवसरानुकूल होने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उसके संकट” है; यहाँ पुल्लिंग एकवचन सर्वनाम ज्ञान-साहित्य के सामान्य प्रतिनिधिक अर्थ में प्रयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: मनोहर
  rationale: यह विशेषण सुंदरता, सुखदता या अवसरानुकूल उपयुक्तता व्यक्त कर सकता है। ‘मनोहर’ दया के स्वागतयोग्य और सुंदर होने का भाव बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἔλεος
  choice: दया
  rationale: यह करुणापूर्ण सहायता या दया को दर्शाता है; ‘दया’ आधुनिक हिन्दी में सीधा, गंभीर और सहज शब्द है।
- source_word: ἐν καιρῷ
  choice: के समय
  rationale: यह किसी विशेष या उपयुक्त अवसर को चिह्नित करता है और पद के दोनों भागों में समय-संबंधी समानांतरता बनाए रखता है।
- source_word: θλίψεως
  choice: संकट
  rationale: मूल शब्द दबाव, क्लेश या विपत्ति का व्यापक भाव रखता है। ‘संकट’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यूनानी में पुल्लिंग एकवचन सर्वनाम है, जो ज्ञान-साहित्य में प्रतिनिधिक या सामान्य अर्थ में प्रयुक्त हुआ है; ‘उसके’ मूल व्याकरणिक रूप को सुरक्षित रखता है।
- source_word: νεφέλαι ὑετοῦ
  choice: वर्षा के बादल
  rationale: यह वर्णनात्मक संबंध है—वर्षा लाने या उससे जुड़े बादल। ‘वर्षा के बादल’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ἀβροχίας
  choice: वर्षा न होने के समय
  rationale: संज्ञा का अर्थ वर्षा का अभाव है। यह अनुवाद मूल अभिव्यक्ति और दोनों अर्धपदों में ‘समय’ की पुनरावृत्ति को बनाए रखता है; ‘सूखे’ की अपेक्षा कम व्याख्यात्मक है।
theological_decisions:
- issue: ज्ञान-साहित्य में αὐτοῦ का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: मुख्य पाठ में ‘उसके’
  alternative: ‘किसी के’ या ‘मनुष्य के’
  rationale: यूनानी पाठ पुल्लिंग एकवचन रूप रखता है। ‘उसके’ मूल की व्याकरणिक विशेषता को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रयोग सामान्य प्रतिनिधिक अर्थ में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनोहर’ काव्यात्मक उपमा के अनुरूप है, और ‘वर्षा न होने के समय’ मूल की दोहराई गई कालगत संरचना को सुरक्षित रखता है।
