  text: Before hail, lightning flashes forth; and before a modest man, favor goes before him.
translation:
  language: hi
  text: ओलों से पहले बिजली चमकती है; और विनम्र जन[b] के आगे कृपा प्रकट होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध यूनानी साक्ष्य में इसके स्थान पर लिखा है: “धर्मी मनुष्य का बलिदान स्वीकार्य है, और उसका स्मरण भुलाया न जाएगा।” यह भिन्न पाठ-परंपरा या पद-संरेखण को दर्शाता है।'
    reason: textual_variant
  - marker: b
    text: या “दीन जन” अथवा “दबा-कुचला जन।” हिब्रू शब्द विनम्र व्यक्ति या नीचा किए गए व्यक्ति—दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: से पहले / के आगे
  rationale: दोनों अर्धपंक्तियों में पूर्वता का भाव है; मौसम के चित्र में कालगत ‘से पहले’ और व्यक्ति के संबंध में स्वाभाविक हिन्दी ‘के आगे’ प्रयुक्त है।
- source_word: בָרָד
  choice: ओले
  rationale: यह संज्ञा मौसम-संबंधी ‘ओले’ का सामान्य अर्थ रखती है।
- source_word: יִנְצַח
  choice: चमक उठती है / पहले ही प्रकट हो जाती है
  rationale: इस संदर्भ में क्रिया कठिन है। समानांतर रचना और बिजली के ओलों से पहले दिखाई देने के चित्र के आधार पर इसे पहले प्रकट होने के अर्थ में लिया गया है; दोनों अर्धपंक्तियों में स्वाभाविक हिन्दी के लिए अभिव्यक्ति थोड़ी अलग रखी गई है।
- source_word: בָּרָק
  choice: बिजली
  rationale: यह शब्द सामान्यतः आकाशीय बिजली को दर्शाता है और ओलों के साथ मौसम-संबंधी चित्र बनाता है।
- source_word: דַכָּא
  choice: विनम्र जन
  rationale: शब्द विनम्र या दीन व्यक्ति को, और कभी-कभी दबे-कुचले व्यक्ति को भी दर्शा सकता है। यहाँ ज्ञान-साहित्य के सामाजिक संदर्भ में ‘विनम्र जन’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חֵן
  choice: कृपा
  rationale: ज्ञान-साहित्य और सामाजिक संदर्भ में यह अनुकूलता, स्वीकार्यता या कृपापूर्ण व्यवहार का भाव व्यक्त करता है।
theological_decisions:
- issue: जीवित हिब्रू पाठ और उससे सर्वथा भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में काहाना के उपलब्ध हिब्रू कथन का अनुवाद
  alternative: ‘धर्मी मनुष्य का बलिदान स्वीकार्य है, और उसका स्मरण भुलाया न जाएगा।’
  rationale: सिराख का हिब्रू पाठ जहाँ उपलब्ध है वहाँ उसे प्राथमिकता दी गई है। दिया गया यूनानी पाठ इस हिब्रू कथन से मेल नहीं खाता और भिन्न पाठ-परंपरा या पद-संरेखण का संकेत देता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखते हुए कठिन हिब्रू क्रिया का अर्थ संदर्भानुसार ‘पहले प्रकट होना’ लिया गया है; उसकी अनिश्चितता को निर्णय-टिप्पणी में स्पष्ट किया गया है।
