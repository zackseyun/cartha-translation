base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/023.yaml
  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
translation:
  language: hi
  text: अपने सब कामों में अपने आप पर निगाह रखो[a], क्योंकि जो ऐसा करता है, वह आज्ञा का पालन करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आत्मा की रक्षा करो” अथवा “अपने जीवन की रक्षा करो”; हिब्रू शब्द नेफ़ेश का अर्थ ‘स्वयं’, ‘आत्मा’ या ‘जीवन’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह एक आज्ञा का पालन करता है।” एकवचन ‘आज्ञा’ यहाँ सामान्य अर्थ में भी समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: अपने सब कामों में
  rationale: यह वाक्यांश व्यक्ति के सभी कार्यों और आचरण के क्षेत्र को समग्र रूप से दर्शाता है। ‘कामों’ आधुनिक हिन्दी में सहज है और नैतिक संदर्भ में भी उपयुक्त है।
- source_word: שמור
  choice: निगाह रखो
  rationale: आज्ञार्थक שמר यहाँ सतर्क रहकर रक्षा करने या ध्यान रखने का भाव देता है। ‘अपने आप पर निगाह रखो’ हिन्दी में व्यावहारिक आत्म-सावधानी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נפשך
  choice: अपने आप पर
  rationale: נפש का अर्थ यहाँ केवल अभौतिक ‘आत्मा’ नहीं, बल्कि व्यक्ति स्वयं या उसका जीवन भी हो सकता है। इसलिए ‘अपने आप पर’ पूरे व्यक्ति के प्रति सावधानी का भाव देता है और संकुचित मानवशास्त्रीय अर्थ आरोपित नहीं करता।
- source_word: כי
  choice: क्योंकि
  rationale: यह पहले उपदेश का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: עושה זה
  choice: जो ऐसा करता है
  rationale: हिब्रू कृदन्तीय रचना का सामान्य मानवीय आशय है। यह रूप हिन्दी में स्वाभाविक है और अनावश्यक रूप से पुरुष-विशेष तक कथन को सीमित नहीं करता।
- source_word: שומר מצוה
  choice: आज्ञा का पालन करता है
  rationale: שמר का मूल भाव ‘रखना/मानना’ है, पर आज्ञा के साथ हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है। एकवचन מצוה को ‘आज्ञा’ रखा गया है, जबकि उसकी सामान्य या किसी विशिष्ट आज्ञा की ओर संकेत करने वाली अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נפש का अर्थ
  choice: अपने आप पर
  alternative: अपनी आत्मा की रक्षा करो; अपने जीवन की रक्षा करो
  rationale: ज्ञान-साहित्य के इस नैतिक उपदेश में נפש पूरे व्यक्ति, प्राण या जीवन को सूचित कर सकता है। मुख्य पाठ व्यावहारिक आत्म-सावधानी व्यक्त करता है, जबकि पाद-टिप्पणी मूल शब्द की व्यापकता सुरक्षित रखती है।
- issue: מצוה के एकवचन का आशय
  choice: आज्ञा
  alternative: एक आज्ञा; वह आज्ञा
  rationale: हिब्रू में शब्द एकवचन है और बिना निश्चित उपपद के है; इसका प्रयोग सामान्य अर्थ में भी हो सकता है। मुख्य पाठ ‘आज्ञा’ रखता है और पाद-टिप्पणी संभावित सामान्य अर्थ स्पष्ट करती है।
- issue: עושה זה में सामान्य मानवीय संदर्भ
  choice: जो ऐसा करता है
  alternative: ऐसा करने वाला
  rationale: हिब्रू का पुल्लिंग एकवचन यहाँ प्रतिनिधिक और सामान्य है। हिन्दी का ‘जो’ इसे स्वाभाविक रूप से सभी मनुष्यों पर लागू रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘अपने आप पर निगाह रखो’ सामान्य पाठक के लिए सहज आत्म-सावधानी व्यक्त करता है; ‘आज्ञा का पालन’ धार्मिक-नैतिक संदर्भ में स्वाभाविक हिन्दी है। उपलब्ध यूनानी समानांतर का पाठ इस हिब्रू पद से मेल नहीं खाता, इसलिए उच्च-विश्वसनीयता वाले हिब्रू पाठ को आधार बनाया गया है।
