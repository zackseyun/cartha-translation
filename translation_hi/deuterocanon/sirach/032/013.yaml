  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। ‘धन्य कहो’, ‘रचयिता’ और ‘कृपा’ बाइबलीय स्वर बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी है। इब्रानी की वास्तविक कठिनाइयों को मुख्य पाठ में अतिनिश्चित बनाकर नहीं सुलझाया गया; आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
