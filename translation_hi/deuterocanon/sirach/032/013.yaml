base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: hi
  text: इन सब बातों के लिए अपने रचयिता को धन्य कहो[a], जो अपनी भलाई से तुम्हें तृप्त करता है। जो परमेश्वर को खोजता है, वह कृपा की आशा रखेगा[b]; पर जो अपने को धोखा देता है, वह उसी में फँस जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का इब्रानी साक्ष्य यूनानी पाठ से बहुत भिन्न है। यूनानी में है: “क्योंकि प्रभु प्रतिफल देने वाला है, और वह तुम्हें सात गुना प्रतिफल देगा।”'
    reason: textual_variant
  - marker: b
    text: दूसरी पंक्ति का इब्रानी कठिन है। “परमेश्वर को खोजता है” उपलब्ध शब्दों का सीधा पाठ है; संदर्भ के आधार पर इसे “व्यवस्था” या “ईश्वरीय शिक्षा को खोजता है” भी समझा गया है। “कृपा की आशा रखेगा” का अर्थ “कृपा पाएगा” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: “जो अपने को धोखा देता है” के पीछे का इब्रानी शब्द अनिश्चित है; संभावित अर्थों में “कपटी,” “डींग मारने वाला” और “उपहास करने वाला” भी हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך
  choice: धन्य कहो
  rationale: आज्ञार्थक क्रिया परमेश्वर के उपकारों के प्रत्युत्तर में उसे धन्य कहने या उसकी स्तुति करने का आह्वान करती है। यह हिन्दी में बाइबलीय गरिमा और सकर्मक रचना दोनों बनाए रखती है।
- source_word: עושך
  choice: अपने रचयिता
  rationale: शब्दशः अर्थ ‘तुम्हें बनाने वाला’ है। ‘रचयिता’ व्यक्तिगत प्रत्यय को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: המרוך מטובתו
  choice: जो अपनी भलाई से तुम्हें तृप्त करता है
  rationale: संयुक्त इब्रानी पाठ यहाँ कुछ अनिश्चित है, पर आशय रचयिता द्वारा अपनी भलाई से भरपूर प्रदान करने का है। ‘तृप्त करता है’ इस लाभकारी परिपूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דורש אל
  choice: जो परमेश्वर को खोजता है
  rationale: דורש सक्रिय खोज को दर्शाता है। उपलब्ध पाठ में אל का सीधा और न्यूनतम संशोधन वाला अर्थ ‘परमेश्वर’ है; ‘व्यवस्था’ संदर्भगत अनुमान है, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- source_word: יקוה רצון
  choice: कृपा की आशा रखेगा
  rationale: क्रिया का सामान्य अर्थ ‘आशा रखना/अपेक्षा करना’ है और רצון यहाँ कृपा, स्वीकृति या अनुग्रह को सूचित कर सकता है। अनिश्चित पाठ में परिणामसूचक ‘प्राप्त करेगा’ की अपेक्षा यह अधिक रूपगत निकटता रखता है।
- source_word: ומתלהלה
  choice: जो अपने को धोखा देता है
  rationale: यह दुर्लभ या दूषित रूप है। आत्म-भ्रम का अर्थ नैतिक विरोध को बनाए रखता है और ‘कपटी’ जैसे अधिक निश्चित धार्मिक-नैतिक आरोप को पाठ पर थोपने से बचता है।
- source_word: יוקש בו
  choice: वह उसी में फँस जाएगा
  rationale: יקש का अर्थ फंदे में पड़ना है। ‘उसी में’ इब्रानी के पुल्लिंग एकवचन सर्वनाम को जानबूझकर अस्पष्ट रखता है, ताकि उसका संकेत परमेश्वर, कृपा या खोजी गई वस्तु की ओर समझा जा सके।
theological_decisions:
- issue: जीवित इब्रानी साक्ष्य और अत्यंत भिन्न यूनानी पाठ में चुनाव
  choice: मुख्य पाठ में काहाना के संयुक्त काहिरा गनीज़ा इब्रानी साक्ष्य का अनुवाद किया गया और यूनानी पाठ को पाठांतर की पादटिप्पणी में रखा गया।
  alternative: 'केवल यूनानी पाठ का अनुवाद: ‘क्योंकि प्रभु प्रतिफल देने वाला है, और वह तुम्हें सात गुना प्रतिफल देगा।’'
  rationale: परियोजना के अनुसार जहाँ सिराख का इब्रानी उपलब्ध है वहाँ उसे प्राथमिकता दी जाती है। दोनों परंपराओं का अंतर अर्थ की दृष्टि से बड़ा है, इसलिए यूनानी साक्ष्य को छिपाने के बजाय स्पष्ट पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אל की व्याख्या
  choice: ‘परमेश्वर’
  alternative: ‘व्यवस्था’ अथवा ‘ईश्वरीय शिक्षा’
  rationale: प्रेषित इब्रानी में אל का सबसे प्रत्यक्ष संज्ञार्थ ‘परमेश्वर’ है। ‘व्यवस्था’ अर्थपूर्ण संदर्भगत पुनर्निर्माण है, पर शब्द में स्पष्ट रूप से उपस्थित नहीं; अतः उसे पादटिप्पणी में विकल्प के रूप में रखा गया है।
- issue: ומתלהלה का नैतिक अर्थ
  choice: ‘जो अपने को धोखा देता है’
  alternative: ‘कपटी’, ‘डींग मारने वाला’ या ‘उपहास करने वाला’
  rationale: रूप अनिश्चित है। आत्म-भ्रम वाला अनुवाद विरोधी समानांतरता को बनाए रखते हुए किसी एक संप्रदायगत या अत्यधिक निश्चित नैतिक श्रेणी को आरोपित नहीं करता।
