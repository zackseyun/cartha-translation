base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/019.yaml
  text: Do nothing without counsel[a], and after your deeds[b], do not be regretful.
translation:
  language: hi
  text: बिना सलाह के कोई काम मत करो; और काम कर चुकने के बाद पछताओ मत।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “खिन्न या क्रोधित मत हो।” इब्रानी शब्द काम करने के बाद उद्विग्न हो जाने का भाव भी दे सकता है; यहाँ प्रसंगानुसार मुख्य पाठ में “पछताओ मत” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ उपलब्ध यूनानी समानांतर पाठ इस पद के इब्रानी शब्दों से मेल नहीं खाता; इसलिए अनुवाद में उपलब्ध इब्रानी साक्ष्य को प्राथमिक आधार बनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: בלא עצה
  choice: बिना सलाह के
  rationale: यह पदबंध शाब्दिक रूप से ‘बिना सलाह/परामर्श के’ है। ‘बिना सलाह के’ आधुनिक हिन्दी में स्वाभाविक है और दूसरों से परामर्श लेने तथा सोच-विचार करने—दोनों का भाव समेट सकता है।
- source_word: אל תפעל דבר
  choice: कोई काम मत करो
  rationale: निषेध के साथ דבר का व्यापक अर्थ ‘कुछ भी/कोई काम’ है। यह अनुवाद आज्ञा के पूरे विस्तार को सहज हिन्दी में व्यक्त करता है।
- source_word: ואחר מעשיך
  choice: और काम कर चुकने के बाद
  rationale: इब्रानी का शाब्दिक अर्थ ‘और अपने कामों के बाद’ है। हिन्दी में पूर्ण क्रिया वाला यह रूप कार्य और उसके बाद की प्रतिक्रिया का क्रम स्पष्ट रखता है।
- source_word: אל תתקצף
  choice: पछताओ मत
  rationale: קצף का यह रूप खिन्न, उद्विग्न या क्रोधित होने का अर्थ दे सकता है। इस ज्ञान-साहित्यिक संदर्भ में सोच-समझकर किए काम पर बाद में पछताने का व्यावहारिक भाव मुख्य पाठ में स्वाभाविक रूप से व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सलाह’ सामान्य पाठक के लिए सहज है, जबकि वाक्य की संक्षिप्त निषेधात्मक शैली इब्रानी ज्ञान-वचन का प्रभाव बनाए रखती है।
