  register: भाषा आधुनिक मानक हिन्दी में सम्मानपूर्ण और सहज रखी गई है। ‘प्रधान’, ‘प्रतिष्ठित’ और ‘स्थान ग्रहण करो’ गरिमापूर्ण हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्पष्ट है। प्राचीन भोज की अपरिचित मुद्रा को मुख्य पाठ और पादटिप्पणी दोनों में समझने योग्य बनाया गया है।
