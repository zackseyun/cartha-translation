base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: hi
  text: यदि तुम्हें सभा का प्रधान बनाया जाए, तो न अपने को ऊँचा उठाओ, न प्रतिष्ठित लोगों के बीच सबसे आगे बैठो।[a] उनके बीच उन्हीं में से एक के समान रहो। उनका ध्यान रखो,[b] और फिर भोज में टेक लगाकर बैठो;[c] जो कुछ आवश्यक है उसे तैयार करो,[d] और तब अपना स्थान ग्रहण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भ के ये दोनों वाक्य काहाना के इब्रानी संस्करण में कोष्ठकों में रखे गए हैं, जो इस पाठ की अनिश्चितता दिखाता है। आसपास का प्रसंग भोज में प्रधान की भूमिका का समर्थन करता है, यद्यपि यूनानी समानांतर पाठ का शब्दांकन काफी भिन्न है।
    reason: textual_variant
  - marker: b
    text: या, ‘उनकी चिंता करो।’ इब्रानी क्रिया मन की चिंता और व्यावहारिक देखभाल—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: प्राचीन औपचारिक भोजों में लोग मेज़ के पास टेक लगाकर लेटते थे।
    reason: cultural_note
  - marker: d
    text: यहाँ का इब्रानी पाठ कठिन है; सम्भावित अर्थ है कि प्रधान अपने बैठने से पहले अतिथियों या भोज के लिए आवश्यक प्रबन्ध पूरा करे।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ראש נבחרת
  choice: यदि तुम सभा के प्रधान चुने गए हो
  rationale: इब्रानी पदबंध सभा या समूह के लिए चुने गए प्रधान को सूचित करता है। भोज का प्रसंग सम्भव है, पर मुख्य पाठ में ‘सभा’ रखकर भूमिका को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: אל תתרומם
  choice: अपने आपको ऊँचा न उठाओ
  rationale: यह आत्मोन्नति या स्वयं को दूसरों से बड़ा मानने का भाव सीधे बनाए रखता है।
- source_word: ובראש גדולים אל תשב
  choice: प्रतिष्ठित लोगों के बीच प्रमुख स्थान पर न बैठो
  rationale: शाब्दिक ‘बड़े लोगों के सिर पर’ के बजाय यह स्वाभाविक हिन्दी में सम्मानित जनों के बीच सर्वोच्च आसन लेने से मना करने का भाव व्यक्त करता है।
- source_word: היה להם כאחד מהם
  choice: उनके साथ उन्हीं में से एक के समान रहो
  rationale: यह सामाजिक निकटता और नम्रता—दोनों को व्यक्त करता है, बिना प्रधान की भूमिका को मिटाए।
- source_word: דאג להם
  choice: उनकी देखभाल करो
  rationale: क्रिया में उनके लिए चिंता करने के साथ व्यावहारिक रूप से उनकी आवश्यकताओं का ध्यान रखने का भाव भी आ सकता है।
- source_word: תסב
  choice: भोजन के लिए लेटो
  rationale: प्राचीन औपचारिक भोज में लोग मेज़ के पास टेक लगाकर लेटते थे; यह अनुवाद उस सांस्कृतिक मुद्रा को स्पष्ट करता है।
- source_word: הכן מרכם
  choice: जो कुछ आवश्यक है उसे तैयार करो
  rationale: प्रेषित इब्रानी पाठ कठिन और अर्थ की दृष्टि से अनिश्चित है। प्रसंग के अनुसार अतिथियों या भोज की आवश्यक तैयारी का सामान्य अर्थ दिया गया है, पर झूठी सटीकता से बचा गया है।
- source_word: תרבץ
  choice: अपना स्थान ग्रहण करो
  rationale: क्रिया का मूल भाव लेटने या टिककर स्थान लेने का है। पहले प्रयुक्त भोज-मुद्रा की अनावश्यक पुनरावृत्ति से बचते हुए क्रम का अर्थ सुरक्षित रखा गया है।
