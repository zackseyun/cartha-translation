base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/016.yaml
  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
translation:
  language: hi
  text: जो याहवे का भय मानता है, वह न्याय को समझेगा[a], और भोर होते ही[b] अपने हृदय से बुद्धि की बातें निकालेगा।[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी साक्षियों में पाठांतर है: कुछ में “न्याय को समझेगा,” और कुछ में “उसके न्याय को समझेंगे” है।'
    reason: alternative_reading
  - marker: b
    text: “भोर होते ही” के लिए प्रयुक्त इब्रानी शब्द अनिश्चित है; इसका अर्थ “बहुत सवेरे” या अधिक सामान्य रूप से भोर अथवा गोधूलि का समय भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'एक अन्य इब्रानी पंक्ति है: “याहवे का भय माननेवाले उसके न्याय को समझेंगे, और बहुत बुद्धि के साथ वे उसे अपने हृदय से निकालेंगे।”'
    reason: textual_variant
  - marker: d
    text: इस पद का उपलब्ध यूनानी समानांतर बहुत भिन्न शब्दावली प्रस्तुत करता है, जो यहाँ एक अलग पाठ-परंपरा का संकेत है।
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  choice: जो याहवे का भय मानता है
  rationale: पहले इब्रानी पाठ में कर्ता एकवचन है, जबकि वैकल्पिक पंक्ति में बहुवचन है। प्रतिनिधिक एकवचन हिन्दी में स्वाभाविक है और मुख्य पाठ के रूप को सुरक्षित रखता है। יהוה को परियोजना के निर्देशानुसार ‘याहवे’ लिखा गया है।
- source_word: יבין / יבינו
  choice: समझेगा
  rationale: בין का मूल भाव समझना या परखना है। ‘समझेगा’ आधुनिक हिन्दी में स्पष्ट है और ज्ञान-साहित्य के प्रसंग के अनुकूल है।
- source_word: משפט / משפטו
  choice: न्याय
  rationale: पांडुलिपियों में ‘न्याय’ और ‘उसका न्याय’ दोनों पाठ मिलते हैं। मुख्य पाठ में अप्रत्यय रूप रखा गया है और दूसरे पाठ को पाद-टिप्पणी में बताया गया है।
- source_word: מנשף
  choice: भोर होते ही
  rationale: נשף भोर या संध्या के धुँधले समय को सूचित कर सकता है। यहाँ ‘भोर होते ही’ आरंभिक समय का स्वाभाविक हिन्दी बोध देता है, जबकि अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: יוציא
  choice: निकालेगा
  rationale: हिफ़ील रूप का भाव किसी वस्तु को बाहर लाना है। ‘अपने हृदय से … निकालेगा’ मूल रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ובחכמות רבות / ותחבולום
  choice: बुद्धि की बातें
  rationale: साक्षियों में इस अंश का पाठ कठिन और अस्थिर है। ‘बुद्धि की बातें’ ज्ञान को हृदय से अभिव्यक्त करने का संभावित अर्थ देता है; वैकल्पिक ‘बहुत बुद्धि के साथ’ वाला पाठ पाद-टिप्पणी में रखा गया है।
- source_word: מלבם
  choice: अपने हृदय से
  rationale: वैकल्पिक इब्रानी पंक्ति में बहुवचन प्रत्यय है, पर मुख्य वाक्य के प्रतिनिधिक एकवचन के अनुरूप हिन्दी में एकवचन किया गया है। ‘हृदय’ इब्रानी मानव-धारणा और रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: टेट्राग्राम को परियोजना के निर्धारित रूप ‘याहवे’ में लिप्यंतरित किया गया है; इसे उपाधि से नहीं बदला गया।
- issue: भिन्न यूनानी समानांतर के सामने आधार-पाठ
  choice: उपलब्ध इब्रानी पाठ को आधार बनाना और यूनानी भिन्नता को पाद-टिप्पणी में बताना
  alternative: यूनानी पाठ का अनुवाद करना या दोनों परंपराओं को मिलाना
  rationale: इस पद के लिए इब्रानी पाठ उपलब्ध है और इसलिए वही प्राथमिक है। यूनानी समानांतर का आशय बहुत भिन्न है; उसे इब्रानी के साथ मिलाने से किसी भी पाठ-परंपरा का सही प्रतिनिधित्व नहीं होगा।
- issue: משפט और משפטו के बीच पाठांतर
  choice: मुख्य पाठ में ‘न्याय’
  alternative: ‘उसका न्याय’
  rationale: दोनों इब्रानी पाठ प्रमाणित हैं। अप्रत्यय रूप को मुख्य पाठ में रखते हुए प्रत्यययुक्त रूप को टिप्पणी में देने से वास्तविक पाठगत तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भय मानना,’ ‘न्याय’ और ‘हृदय’ जैसे बाइबलीय शब्द मूल इब्रानी की वैचारिक बनावट बनाए रखते हैं। कठिन पाठ को बिना मिलाए मुख्य पाठ और पाद-टिप्पणियों में अलग-अलग प्रस्तुत किया गया है।
