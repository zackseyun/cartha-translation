  text: And fulfill your desire in the fear of God[a], and not with any lack.
translation:
  language: hi
  text: परमेश्वर के भय में अपनी इच्छा पूरी कर, और किसी भी चीज़ की कमी में नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “परमप्रधान को उसके दिए हुए के अनुसार दे, और उदार मन से, जितना तेरे हाथ में हो उसके अनुसार।” इस पद का यूनानी साक्ष्य उपलब्ध इब्रानी पाठ से बहुत भिन्न रूप प्रस्तुत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: पूरी कर
  rationale: पिएल के आज्ञार्थक/उपदेशात्मक भाव में यह किसी बात को पूर्ण करने या पूरा करने का अर्थ देता है; רצון के साथ ‘अपनी इच्छा पूरी कर’ स्वाभाविक है।
- source_word: רצון
  choice: अपनी इच्छा
  rationale: यह शब्द इच्छा, अभिलाषा, प्रसन्नता या अनुग्रह का अर्थ दे सकता है। यहाँ उपदेशात्मक संदर्भ में ‘अपनी इच्छा’ व्यक्तिगत भाव को बनाए रखता है, यद्यपि वाक्य का आशय कुछ संक्षिप्त और अस्पष्ट है।
- source_word: ביראת אל
  choice: परमेश्वर का भय मानते हुए
  rationale: ב को परिस्थितिसूचक ढंग से व्यक्त किया गया है। यह इब्रानी ज्ञान-साहित्य के श्रद्धापूर्ण ‘परमेश्वर के भय’ को सहज आधुनिक हिन्दी में रखता है।
- source_word: אל
  choice: परमेश्वर
  rationale: यहाँ אל सामान्य ईश्वरीय पदनाम है; ‘परमेश्वर’ गरिमापूर्ण और स्पष्ट हिन्दी रूप है।
- source_word: ולא בחסר כל
  choice: और किसी बात की कमी के साथ नहीं
  rationale: חסר कमी या अभाव दर्शाता है और כל इसे व्यापक बनाता है। इब्रानी वाक्यांश संक्षिप्त और कुछ असहज है, इसलिए अनुवाद उसकी अस्पष्टता को बिना अनुमान से सुलझाए निकटता से रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में पर्याप्त भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ का अनुसरण करना और यूनानी रूप को पादटिप्पणी में देना
  alternative: ‘परमप्रधान को उसके दिए हुए के अनुसार दे, और प्रसन्न मन से उतना दे जितना तेरा हाथ जुटा सके।’
  rationale: सीराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वास वाला है। यूनानी साक्ष्य बिल्कुल भिन्न उपदेश देता है; इसलिए दोनों को मिलाकर कृत्रिम सामंजस्य बनाने के बजाय इब्रानी को मुख्य पाठ और यूनानी को वास्तविक वैकल्पिक पाठ के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘परमेश्वर का भय मानते हुए’ ने पारंपरिक ज्ञान-साहित्य की अवधारणा को स्वाभाविक हिन्दी में रखा है। अंतिम उपवाक्य की इब्रानी संक्षिप्तता और अस्पष्टता जानबूझकर पूरी तरह नहीं सुलझाई गई।
