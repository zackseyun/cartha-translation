  yaml_path: translation/deuterocanon/sirach/032/002.yaml
  text: so that you may rejoice in their honor[b][a], and receive a reward for your instruction.
translation:
  language: hi
  text: ताकि तुम उनके सम्मान में आनन्दित हो सको, और अपनी शिक्षा के लिए प्रतिफल पाओ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में यहाँ बहुत भिन्न पाठ है: “जो आज्ञाओं पर ध्यान देता है, वह मेलबलि चढ़ाता है।” मुख्य पाठ उपलब्ध हिब्रू साक्ष्य का अनुसरण करता है, क्योंकि जहाँ सिराख का हिब्रू पाठ सुरक्षित है, वहाँ वही प्राथमिक स्रोत है।'
    reason: alternative_reading
  - marker: b
    text: “शिक्षा” के लिए प्रयुक्त हिब्रू शब्द का अनुवाद “अनुशासन,” “सुधार,” या “सुव्यवस्था” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम प्रकट करता है; आधुनिक हिन्दी में ‘ताकि’ स्वाभाविक और सटीक है।
- source_word: תשמח
  choice: आनन्दित हो सको
  rationale: שמח आनन्दित होने या हर्ष मनाने का भाव देता है; यह रूप सम्भावना और प्रयोजन दोनों को सहज रूप से व्यक्त करता है।
- source_word: בכבודם
  choice: उनके सम्मान में
  rationale: כבוד का अर्थ ‘सम्मान’ या ‘महिमा’ हो सकता है। यह अनुवाद इस अस्पष्टता को खुला रखता है कि सम्मान उनका अपना है या उन्हें दिया गया है।
- source_word: ועל
  choice: और ... के लिए
  rationale: दूसरे उपवाक्य को उस आधार या कारण से जोड़ता है जिसके कारण प्रतिफल मिलता है।
- source_word: מוסר
  choice: शिक्षा
  rationale: מוסר में शिक्षा, अनुशासन, सुधार और सुव्यवस्था के अर्थ सम्भव हैं। भोज-सन्दर्भ और ज्ञान-साहित्य की शैली में ‘शिक्षा’ सहज है और दण्डात्मक अर्थ को अनावश्यक रूप से प्रमुख नहीं बनाती।
- source_word: תשא
  choice: पाओ
  rationale: נשא का मूल अर्थ उठाना या ढोना है, पर שכר के साथ इसका मुहावरेदार अर्थ प्रतिफल प्राप्त करना है।
- source_word: שכר
  choice: प्रतिफल
  rationale: यह पारिश्रमिक या पुरस्कार को सूचित करता है; ‘प्रतिफल’ ज्ञान-साहित्य के नैतिक प्रसंग के अनुकूल है।
theological_decisions:
- issue: हिब्रू पाठ को प्रधान मानना और भिन्न यूनानी समानांतर को सुरक्षित रखना
  choice: मुख्य पाठ में उपलब्ध हिब्रू भोज-सन्दर्भ का सीधा अनुवाद
  alternative: 'यूनानी के अनुसार: ‘जो आज्ञाओं पर ध्यान देता है, वह मेलबलि चढ़ाता है।’'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है वहाँ वही प्राथमिक स्रोत है। यूनानी पाठ यहाँ बहुत भिन्न है, इसलिए उसे मुख्य पाठ में मिलाकर तनाव मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘आनन्दित,’ ‘सम्मान,’ और ‘प्रतिफल’ ज्ञान-साहित्य की ऊँची शैली बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
