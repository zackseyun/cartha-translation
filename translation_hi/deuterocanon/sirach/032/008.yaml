translation:
  language: hi
  text: बहुत कुछ जानते हुए भी संक्षेप में बोलो[a], और उस व्यक्ति के समान बनो जो जानता है और साथ ही चुप रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ अत्यंत संक्षिप्त है और उसका पहला खंड कुछ अस्पष्ट है। उसमें ‘थोड़ा’ और ‘बहुत’ शब्द आते हैं; अनुवाद संदर्भ के अनुसार बहुत जानने पर भी कम बोलने का संभावित आशय व्यक्त करता है। इब्रानी में आगे ‘जानने वाले और साथ ही चुप रहने वाले के समान बनो’ है। स्वेट के यूनानी पाठ में इस पद के स्थान पर भिन्न वाक्य है, इसलिए यहाँ इब्रानी को मुख्य पाठ माना गया है।
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  choice: बहुत कुछ जानते हुए भी थोड़े में कहो
  rationale: इब्रानी पाठ अत्यंत संक्षिप्त और संभवतः लुप्तपदीय है। מעט और הרבה के विरोध तथा अगले खंड में ज्ञान के साथ मौन रखने की शिक्षा को ध्यान में रखते हुए यह अनुवाद संयमित, संक्षिप्त वाणी का संभावित आशय व्यक्त करता है।
- source_word: ודמה
  choice: और ऐसे बनो जैसे
  rationale: דמה के ‘समान होना/बनना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और उपदेशात्मक प्रवाह बनाए रखता है।
- source_word: ליודע
  choice: कोई जानकार
  rationale: 'דמה के बाद ל को तुलनात्मक अर्थ में समझा गया है: ‘उस व्यक्ति के समान जो जानता है।’ ‘जानकार’ सामान्य और संक्षिप्त हिन्दी है।'
- source_word: ומחריש יחדו
  choice: होकर भी चुप रहता है
  rationale: מחריש का अर्थ मौन रहना है और יחדו ज्ञान तथा मौन के एक साथ होने पर बल देता है। हिन्दी में ‘होकर भी’ इस तनाव को सहज रूप से प्रकट करता है, यद्यपि ‘भी’ संदर्भगत व्याख्या है।
