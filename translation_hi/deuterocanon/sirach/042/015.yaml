base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: hi
  text: मैं परमेश्वर के कार्यों को स्मरण करूँगा[a], और जो मैंने देखा है उसे सुनाऊँगा। परमेश्वर के वचन के अनुसार उसकी इच्छा पूरी होती है, और उसका कार्य उसकी इच्छा पूरी करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “मैं प्रभु के कार्यों को स्मरण करूँगा, और जो मैंने देखा है उसे सुनाऊँगा; प्रभु के वचनों में उसके कार्य हैं।” इब्रानी की अंतिम पंक्ति कठिन है; इसलिए मुख्य पाठ शब्दशः अस्पष्ट रूप देने के बजाय उसका संभावित आशय प्रस्तुत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: मैं ... स्मरण करूँगा
  rationale: אזכור भविष्य/संकल्पसूचक प्रथम पुरुष रूप है। נא यहाँ विनती से अधिक कथन के आरम्भ को कोमल बल देता है; हिन्दी में अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: מעשי אל
  choice: परमेश्वर के कार्यों
  rationale: מעשי का अर्थ ‘कार्य/कर्म’ और אל का अर्थ ‘परमेश्वर’ है। ‘कार्य’ स्तुतिपरक प्रसंग में स्वाभाविक है और इब्रानी ईश्वरीय उपाधि को बनाए रखता है।
- source_word: וזה חזיתי ואספרה
  choice: और जो मैंने देखा है उसे सुनाऊँगा
  rationale: इब्रानी वाक्य संक्षिप्त है; यूनानी समानांतर भी ‘जो मैंने देखा’ का समर्थन करता है। ‘सुनाऊँगा’ ואספרה के वर्णन करने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: באומר אלהים
  choice: परमेश्वर के वचन पर
  rationale: शाब्दिक संरचना ‘परमेश्वर के कहने में/पर’ कठिन है। यह चयन दैवी कथन के कारक या अवसरसूचक भाव को रखता है और यूनानी पाठ में वचनों के उल्लेख से भी संगत है।
- source_word: רצונו
  choice: उसकी इच्छा
  rationale: רצון का मूल अर्थ इच्छा, अनुग्रह या प्रसन्नता हो सकता है। यहाँ ‘इच्छा’ पहले प्रयोग में सीधा और प्रसंगानुकूल है।
- source_word: ופועל רצונו לקחו
  choice: और उसका कार्य उसकी अभिलाषा को सिद्ध करता है
  rationale: यह इब्रानी उपवाक्य पाठगत और व्याकरणिक रूप से कठिन है। यह अनुवाद संभावित आशय—परमेश्वर का कार्य उसके चाहने को पूरा करता है—को स्पष्ट हिन्दी में देता है, पर वैकल्पिक यूनानी पाठ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: אל और यूनानी Κυρίου में ईश्वरीय उपाधि
  choice: परमेश्वर
  alternative: प्रभु
  rationale: उपलब्ध प्राथमिक इब्रानी साक्ष्य में אל है, इसलिए मुख्य पाठ ‘परमेश्वर’ रखता है। यूनानी ‘प्रभु’ को पादटिप्पणी में दर्ज किया गया है।
- issue: कठिन अंतिम पंक्ति का अर्थ
  choice: परमेश्वर के वचन पर उसकी इच्छा पूरी होती है, और उसका कार्य उसकी अभिलाषा को सिद्ध करता है
  alternative: 'यूनानी के निकट: ‘प्रभु के वचनों में उसके कार्य हैं’'
  rationale: इब्रानी पंक्ति का संप्रेषित रूप कठिन है। मुख्य पाठ उसके संभावित आशय को व्यक्त करता है, जबकि भिन्न यूनानी साक्ष्य को छिपाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘स्मरण करूँगा’, ‘वचन’ और ‘सिद्ध करता है’ स्तुतिपरक प्रसंग के अनुकूल हैं, पर भाषा सामान्य पाठक के लिए बोधगम्य बनी रहती है।
