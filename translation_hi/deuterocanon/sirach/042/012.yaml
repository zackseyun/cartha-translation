base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/012.yaml
  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
translation:
  language: hi
  text: किसी भी पुरुष को अपना सौंदर्य न दिखाओ,[a] और स्त्रियों के घर में उनके बीच न बैठो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप है, “हर नर को अपना रूप/सौंदर्य न दो।” यूनानी समानांतर में है, “हर व्यक्ति/पुरुष को उसकी सुंदरता में न देखो,” जो इस पंक्ति की भिन्न समझ को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: गनीज़ा के इब्रानी पाठ में अंतिम क्रिया अनिश्चित है। यूनानी समानांतर ‘स्त्रियों के बीच साथ न बैठो/संगति न करो’ अर्थ का समर्थन करता है। इब्रानी में ‘स्त्रियों का घर’ भी स्पष्ट रूप से आया है।
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: किसी भी पुरुष को
  rationale: इब्रानी का शाब्दिक अर्थ ‘हर नर को’ है। आधुनिक हिन्दी में मनुष्य के संदर्भ में ‘किसी भी पुरुष को’ स्वाभाविक है और मूल की लिंग-विशिष्टता बनाए रखता है।
- source_word: אל תתן תאר
  choice: अपना सौंदर्य न दिखाओ
  rationale: תאר रूप, आकृति या सौंदर्य को सूचित करता है। ‘सौंदर्य न दिखाओ’ प्रसंगानुकूल मुहावरेदार हिन्दी है; यूनानी ἐν κάλλει भी सौंदर्य के अर्थ की पुष्टि करता है।
- source_word: ובית נשים
  choice: स्त्रियों के घर में
  rationale: यह इब्रानी पदबंध ‘स्त्रियों का घर/स्त्रियों के घर में’ का स्थानीय भाव रखता है। इसे पाठ में रखने से कठिन इब्रानी साक्ष्य लुप्त नहीं होता, जबकि अगला पदांश यूनानी के आधार पर बैठने की क्रिया स्पष्ट करता है।
- source_word: אל תסתויד
  choice: उनके बीच न बैठो
  rationale: गनीज़ा पाठ में क्रिया का रूप और अर्थ अनिश्चित है। यूनानी συνέδρευε साथ बैठने या संगति करने का स्पष्ट संकेत देता है; ‘उनके बीच न बैठो’ उसी ठोस भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य की चेतावनी में लिंग-विशिष्ट भाषा
  choice: ‘पुरुष’ और ‘स्त्रियाँ’ को स्पष्ट रूप से बनाए रखा गया
  alternative: लिंग-निरपेक्ष ‘लोग’ जैसे शब्दों का प्रयोग
  rationale: इब्रानी में זכר और נשים स्पष्टतः लिंग-विशिष्ट हैं; उन्हें निरपेक्ष करने से मूल चेतावनी की संरचना बदल जाती।
- issue: कठिन इब्रानी पाठ और यूनानी समानांतर का संबंध
  choice: इब्रानी को आधार रखते हुए अस्पष्ट अंतिम क्रिया को यूनानी से स्पष्ट किया गया
  alternative: अस्पष्ट इब्रानी का अत्यंत शाब्दिक अनुवाद करना या पूरी पंक्ति में यूनानी को प्रधान बनाना
  rationale: इब्रानी साक्ष्य उपलब्ध और प्राथमिक है, पर अंतिम क्रिया अनिश्चित है। यूनानी समानांतर ‘बीच में साथ बैठने’ का समर्थित अर्थ देता है, इसलिए दोनों साक्ष्यों को पारदर्शी रूप से साथ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। ‘सौंदर्य न दिखाओ’ सहज हिन्दी है; दूसरी पंक्ति में कठिन इब्रानी स्थान-सूचक पदबंध और यूनानी से समर्थित बैठने की क्रिया—दोनों सुरक्षित रखे गए हैं।
