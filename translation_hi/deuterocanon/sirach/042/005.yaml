- source_word: ממחיר ממכר תגר
  choice: बिक्री के माल के दाम के विषय में
  rationale: हिब्रू पदबंध संक्षिप्त और कुछ कठिन है, पर מחיר मूल्य/दाम तथा ממכר और תגר व्यापारिक बिक्री के क्षेत्र की ओर संकेत करते हैं। यह अनुवाद अनावश्यक व्यापारी-स्वामित्व जोड़े बिना वाणिज्यिक अर्थ सुरक्षित रखता है।
