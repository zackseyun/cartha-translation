  text: For from a garment comes a moth, and from a woman a woman’s wickedness.
translation:
  language: hi
  text: क्योंकि वस्त्र से पतंगा निकलता है, और स्त्री से स्त्री की दुष्टता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और स्त्री से, स्त्री की बुराई।” इब्रानी कथन संक्षिप्त और सूक्तिपरक है; यूनानी में भी “स्त्री से स्त्री की दुष्टता” है। “पतंगा” यहाँ विशेष रूप से वस्त्र को हानि पहुँचाने वाले कपड़ा-पतंगे को सूचित करता है।'
    reason: शाब्दिक विकल्प और עש की विशिष्ट अर्थ-सीमा स्पष्ट करना
lexical_decisions:
- source_word: בגד
  choice: वस्त्र
  rationale: यह शब्द सामान्य रूप से पहनने के कपड़े या वस्त्र को दर्शाता है; एकवचन और यूनानी ἱμάτιον के अनुरूप ‘वस्त्र’ स्वाभाविक तथा गरिमापूर्ण है।
- source_word: יצא
  choice: निकलता है
  rationale: मूल क्रिया का अर्थ ‘बाहर निकलना/निकल आना’ है। ‘निकलता है’ सूक्तिपरक चित्र को सीधे बनाए रखता है।
- source_word: עש
  choice: कीड़ा
  rationale: यह वस्त्र को नष्ट करने वाले पतंगे अथवा उसके कीड़े के लिए प्रयुक्त है। सामान्य हिन्दी में वस्त्र से ‘कीड़ा निकलना’ स्वाभाविक है; पादटिप्पणी अधिक विशिष्ट ‘कपड़ा-कीट’ बताती है।
- source_word: אשה
  choice: स्त्री
  rationale: इब्रानी शब्द ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर यहाँ सामान्य सूक्ति और यूनानी γυνή व्यापक अर्थ ‘स्त्री’ का समर्थन करते हैं।
- source_word: רעת אשה
  choice: स्त्री की दुष्टता
  rationale: इब्रानी संबंध-वाक्यांश को सीधे रखा गया है। ‘दुष्टता’ नैतिक अर्थ को व्यक्त करती है और मूल कथन की तीक्ष्णता को कम नहीं करती।
theological_decisions:
- issue: स्त्री के विषय में कठोर सूक्तिपरक कथन
  choice: ‘स्त्री से स्त्री की दुष्टता’ के सीधे और तीखे शब्दों को बनाए रखा गया।
  alternative: ‘स्त्री से बुराई आती है’ अथवा ‘पत्नी से पत्नी की दुष्टता’
  rationale: इब्रानी और यूनानी दोनों स्त्री-केंद्रित कठोर कथन का समर्थन करते हैं। अनुवाद इसे नरम नहीं करता और न इसे मूल पद से आगे बढ़ाकर कोई व्यापक धर्मसिद्धान्त बनाता है।
- issue: दूसरे खंड में क्रिया का लोप
  choice: इब्रानी की संक्षिप्त समानांतर रचना के अनुरूप दूसरे खंड में ‘निकलती है’ नहीं जोड़ा गया।
  alternative: ‘और स्त्री से स्त्री की दुष्टता निकलती है’
  rationale: मूल इब्रानी में केवल पहले खंड में יצא है; दूसरे खंड की क्रिया निहित है। हिन्दी में संक्षिप्त पदबंध मूल की सूक्तिपरक कठोरता और वास्तविक वाक्यगत संक्षिप्तता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सूक्तिपरक रूप। मूल की समानांतर संरचना, कठोरता और दूसरे खंड की वाक्यगत संक्षिप्तता सुरक्षित रखी गई है।
