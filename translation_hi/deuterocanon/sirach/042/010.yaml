base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: hi
  text: उसकी कुँवारी अवस्था में[a], कहीं वह बहकाई न जाए; और अपने पति के घर में, कहीं वह भटक न जाए। अपने पिता के घर में, कहीं वह गर्भवती न हो जाए; और अपने पति के घर में[b], कहीं वह बाँझ न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ “कहीं वह अपवित्र न हो जाए” है, जहाँ इब्रानी में “कहीं वह बहकाई न जाए” है; इससे यौन-संदर्भ अधिक स्पष्ट होता है।
    reason: alternative_reading
  - marker: b
    text: अंतिम इब्रानी शब्द का अधिक शाब्दिक अर्थ “कहीं वह रोक दी जाए” हो सकता है, पर यूनानी समानांतर “कहीं वह बाँझ न हो जाए” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  choice: उसके कुँवारेपन में
  rationale: यह इब्रानी संज्ञा कुँवारी अवस्था को व्यक्त करती है और यूनानी ἐν παρθενίᾳ से भी मेल खाती है। हिंदी में यह मूल की संज्ञात्मक अभिव्यक्ति को बनाए रखती है।
- source_word: פן תפתה
  choice: कहीं वह बहकाई न जाए
  rationale: इब्रानी रूप यहाँ निष्क्रिय अर्थ देता है। प्रसंग में यौन प्रलोभन निहित है, पर ‘बहकाई’ मूल की कुछ व्यापकता और अस्पष्टता बचाए रखता है।
- source_word: ובבית בעלה ... בבית אישה
  choice: और उसके पति के घर में ... और उसके पति के घर में
  rationale: בעל और איש दोनों इस वैवाहिक प्रसंग में पति को सूचित करते हैं। समान हिंदी अभिव्यक्ति दोनों घरेलू स्थितियों को स्वाभाविक और स्पष्ट बनाती है।
- source_word: לא תשטה
  choice: कहीं वह भटक न जाए
  rationale: क्रिया का अर्थ मार्ग से हटना या चूकना हो सकता है। ‘भटकना’ नैतिक अथवा यौन विचलन की संभावना को बनाए रखता है, बिना सीधे व्यभिचार निर्धारित किए।
- source_word: בבית אביה
  choice: उसके पिता के घर में
  rationale: विवाह से पहले के पैतृक घर का सीधा और स्वाभाविक हिंदी रूप।
- source_word: פן תהרה
  choice: कहीं वह गर्भवती न हो जाए
  rationale: क्रिया गर्भ धारण करने अथवा गर्भवती होने को सूचित करती है। आधुनिक हिंदी में यह साफ और सहज है।
- source_word: פן תעצר
  choice: कहीं वह बाँझ न रह जाए
  rationale: इब्रानी का अधिक शाब्दिक अर्थ ‘रोक दी जाए’ हो सकता है, लेकिन प्रजनन-संबंधी प्रसंग और यूनानी στειρώσῃ ‘बाँझ हो’ इस अर्थ का प्रबल समर्थन करते हैं।
theological_decisions:
- issue: इब्रानी मुख्य पाठ और यूनानी समानांतर में हल्का अंतर
  choice: विद्यमान इब्रानी को आधार बनाकर अनुवाद किया गया और अंतिम कठिन क्रिया के अर्थ की पुष्टि के लिए यूनानी समानांतर का उपयोग किया गया।
  alternative: यूनानी के अधिक निकट पहले खंड को ‘कहीं वह अपवित्र न हो जाए’ और वैवाहिक खंड को ‘कहीं वह उल्लंघन न करे’ कहा जा सकता है।
  rationale: इब्रानी पाठ सुसंगत और पर्याप्त है; यूनानी यौन संदर्भ की पुष्टि करता है और विशेषतः अंतिम क्रिया को बाँझपन के अर्थ में समझने में सहायता देता है, पर इब्रानी की शब्दगत विशिष्टता को जहाँ संभव है बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक वाक्यांश को पिछले पद से जुड़ी चेतावनी समझकर स्वाभाविक हिंदी हेतु ‘उसकी चिंता कर’ जोड़ा गया है; पद के चार आशंकासूचक खंडों की समांतरता सुरक्षित रखी गई है।
