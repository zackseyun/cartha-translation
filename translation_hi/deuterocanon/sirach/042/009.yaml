base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: hi
  text: बेटी अपने पिता के लिए एक छिपा हुआ झूठ है[a], और उसकी चिंता पिता की नींद उड़ा देती है—उसकी जवानी में यह डर कि कहीं उसकी उम्र न ढल जाए[b], और जब वह कुँवारी हो, यह डर कि कहीं उसका विवाह न हो पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव “छिपा हुआ झूठ” है; यूनानी समानांतर पाठ में “छिपी हुई अनिद्रा” है, जो पिता की भीतर-ही-भीतर बनी रहने वाली चिंता की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ इब्रानी का अर्थ अनिश्चित है। यूनानी समानांतर पाठ जवानी ढलने या विवाह योग्य आयु बीतने का भाव देता है।
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: बेटी अपने पिता के लिए
  rationale: यह पिता-बेटी के संबंध को व्यक्त करने वाले इब्रानी संबंधसूचक प्रयोग को स्वाभाविक हिन्दी में रखता है।
- source_word: מטמנת שקר
  choice: छिपा हुआ झूठ
  rationale: दुर्बोध इब्रानी पदबंध में ‘छिपी हुई वस्तु’ और ‘झूठ’ दोनों भाव सुरक्षित रहते हैं। यूनानी पाठ का ‘छिपी हुई अनिद्रा’ अधिक सहज है, पर मुख्य पाठ में विद्यमान इब्रानी की कठिनता को मिटाया नहीं गया।
- source_word: דאגה תפריע שנתו
  choice: उसकी चिंता पिता की नींद उड़ा देती है
  rationale: ‘चिंता’ निरंतर व्याकुलता को और हिन्दी मुहावरा ‘नींद उड़ा देना’ नींद से वंचित होने को स्वाभाविक रूप से व्यक्त करता है; ‘पिता’ दोहराने से सर्वनाम का संदर्भ स्पष्ट होता है।
- source_word: בנעוריה
  choice: उसकी जवानी में
  rationale: कालसूचक इब्रानी वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: פן תגור
  choice: कहीं उसकी उम्र न ढल जाए
  rationale: इब्रानी पाठ का अर्थ अनिश्चित है; यूनानी παρακμάσῃ जवानी या विवाह योग्य आयु के ढलने की ओर संकेत करता है। यह अनुवाद उसी संभावित अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ובתוליה
  choice: उसके कुँवारेपन में
  rationale: यह स्त्री की अविवाहित/कुँवारी अवस्था के स्पष्ट सांस्कृतिक अर्थ को बनाए रखता है।
- source_word: פן לא תנשא
  choice: कहीं उसका विवाह न हो पाए
  rationale: इब्रानी के निष्क्रिय भाव ‘उसका विवाह न किया जाए/न हो’ को सहज आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: מטמנת שקר के कठिन इब्रानी पाठ और यूनानी ἀπόκρυφος ἀγρυπνία के बीच संबंध
  choice: मुख्य पाठ में ‘छिपा हुआ झूठ’ रखकर इब्रानी की अस्पष्टता सुरक्षित की गई।
  alternative: ‘छिपी हुई अनिद्रा’ अथवा ‘छिपी हुई चिंता’
  rationale: विद्यमान इब्रानी साक्ष्य को प्राथमिकता दी गई है, जबकि यूनानी पाठ को पाठगत कठिनाई समझाने के लिए पादटिप्पणी में दिया गया है; इस प्रकार किसी एक सहज अर्थ को चुपचाप निर्णायक नहीं बनाया गया।
- issue: פן תגור का अनिश्चित अर्थ
  choice: ‘कहीं उसकी उम्र न ढल जाए’
  alternative: ‘कहीं वह अविवाहित न रह जाए’
  rationale: यूनानी समानांतर पाठ में जवानी के ढलने का भाव मिलता है। मुख्य अनुवाद उसी को व्यक्त करता है, जबकि पादटिप्पणी पाठगत अनिश्चितता बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की प्राचीन सामाजिक दृष्टि को न तो आधुनिक बनाया गया है, न अनुमोदनात्मक भाषा जोड़कर तीखा किया गया है। इब्रानी की वास्तविक पाठगत कठिनाइयाँ पादटिप्पणियों में स्पष्ट हैं।
