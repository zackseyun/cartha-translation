base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: hi
  text: भोले व्यक्ति और मूर्ख को अनुशासित करने के विषय में,[a] और उस बूढ़े के विषय में जो फिर लौटता और यौन अनैतिकता के संबंध में सलाह लेता है—सचमुच सावधान रहो,[b] और हर जीवित व्यक्ति के सामने मर्यादाशील बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में इस खंड के आगे है: “और अत्यन्त बूढ़े व्यक्ति के विषय में, जिसका न्याय जवानों के साथ किया जाता है,” न कि “उस बूढ़े के विषय में जो फिर लौटता और यौन अनैतिकता के संबंध में सलाह लेता है।” इस खंड में हिब्रू और यूनानी पाठों में पर्याप्त अंतर है।'
    reason: alternative_reading
  - marker: b
    text: 'यूनानी समानांतर पाठ के अधिक निकट अर्थ: “और तुम सचमुच शिक्षित और हर जीवित व्यक्ति के सामने परखे हुए ठहरोगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: अनुशासन देने
  rationale: यह शब्द सुधारने वाली शिक्षा और अनुशासन दोनों का भाव रखता है; यहाँ על के बाद विषयसूचक वाक्यांश में क्रियात्मक हिंदी अधिक स्वाभाविक है।
- source_word: פותה
  choice: भोले
  rationale: यह ऐसे अनुभवहीन और आसानी से बहकाए जा सकने वाले व्यक्ति को सूचित करता है; ‘भोला’ आधुनिक हिंदी में इस भाव को सहज रूप से व्यक्त करता है।
- source_word: כסיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में नैतिक और बौद्धिक मूर्खता के लिए यह मानक, स्पष्ट हिंदी शब्द है।
- source_word: ושב
  choice: फिर लौटता
  rationale: मूल के लौटने अथवा पुराने आचरण में पड़ने के रूपक को बनाए रखता है, बिना उसके सटीक आशय को अनावश्यक रूप से निश्चित किए।
- source_word: ישיש
  choice: बूढ़े
  rationale: यह अधिक आयु के पुरुष का सीधा और सामान्य हिंदी वर्णन है।
- source_word: נוטל עצה
  choice: सलाह लेता है
  rationale: हिब्रू मुहावरे ‘सलाह लेना’ का स्वाभाविक और निकट हिंदी रूप।
- source_word: בזנות
  choice: व्यभिचार के मामले में
  rationale: זנות अवैध यौन आचरण की व्यापक श्रेणी बता सकता है; यह चयन केवल वेश्यावृत्ति तक अर्थ सीमित नहीं करता।
- source_word: זהיר
  choice: सावधान रहो
  rationale: यह सतर्कता और नैतिक चौकसी की आज्ञा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: באמת
  choice: सचमुच
  rationale: यह आग्रह की प्रामाणिकता और तीव्रता को बनाए रखता है।
- source_word: צנוע
  choice: मर्यादाशील
  rationale: यह लज्जाशीलता, संयम और शिष्ट आचरण के संयुक्त सामाजिक-नैतिक भाव को आधुनिक गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: לפני כל חי
  choice: हर जीवित व्यक्ति के सामने
  rationale: मूल की सार्वभौमिक व्याप्ति को रखते हुए हिंदी में ‘व्यक्ति’ सामाजिक संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: कठिन मध्य खंड में हिब्रू और यूनानी पाठ का पर्याप्त अंतर
  choice: 'मुख्य पाठ में उपलब्ध हिब्रू का अनुसरण: बूढ़ा फिर लौटता और व्यभिचार के मामले में सलाह लेता है।'
  alternative: 'यूनानी के अनुसार: अत्यन्त बूढ़ा व्यक्ति जवानों के साथ न्याय के लिए खड़ा किया जाता है।'
  rationale: सिराख का हिब्रू पाठ यहाँ उपलब्ध और उच्च विश्वास वाला है, इसलिए वही मुख्य आधार है; पर्याप्त रूप से भिन्न यूनानी पाठ को पाठक से छिपाने के बजाय पादटिप्पणी में रखा गया है।
- issue: समापन उपदेश का अर्थ
  choice: हिब्रू के अनुसार सतर्क और मर्यादाशील रहने की आज्ञा।
  alternative: यूनानी के अनुसार सचमुच शिक्षित और सबके सामने परखा हुआ होना।
  rationale: मुख्य पाठ हिब्रू זהיר और צנוע को प्राथमिकता देता है; यूनानी भिन्न अर्थ देता है, इसलिए वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। आरंभ के विषयसूचक खंडों को ‘के विषय में’ से जोड़ा गया है और मुख्य हिब्रू पाठ की असामान्य संरचना तथा अस्पष्टता को अत्यधिक व्याख्यायित नहीं किया गया।
