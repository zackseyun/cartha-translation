translation:
  language: hi
  text: तराज़ू और बाट में हेराफेरी के विषय में,[a] और माप और बाट के मानकों—एपा और पत्थर के बाट—के विषय में।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ का अर्थ अधिक निकटता से “तराज़ू और बाटों की शुद्धता के विषय में” है, न कि “हेराफेरी के विषय में।” यहाँ प्राप्त इब्रानी पाठ कठिन है और यूनानी से ठीक मेल नहीं खाता।
    reason: alternative_reading
  - marker: b
    text: यूनानी के दूसरे खंड में “बहुत और थोड़ा प्राप्त करने के विषय में” या “बड़ी और छोटी मात्राओं के विषय में” है; यह उस इब्रानी पाठ से काफी भिन्न है जिसमें एपा और पत्थर के बाट का उल्लेख है।
    reason: textual_variant
  - marker: c
    text: एपा सूखी वस्तुओं को मापने की एक प्राचीन इकाई थी। “पत्थर का बाट” तौलने में मानक भार के रूप में इस्तेमाल किया जाने वाला पत्थर था।
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  choice: हेराफेरी
  rationale: प्राप्त इब्रानी पाठ में यह शब्द कठिन है। तराज़ू और तुला के व्यापारिक संदर्भ में “हेराफेरी” संभावित व्यावहारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि यूनानी पाठ की भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מאזנים
  choice: तराज़ू
  rationale: तौलने के उपकरण के लिए यह सामान्य और सहज आधुनिक हिन्दी शब्द है।
- source_word: פלס
  choice: तुला
  rationale: तौल और संतुलन के संदर्भ में यह शब्द उपयुक्त है और מאזנים के साथ आए दो निकटवर्ती पदों का भेद कुछ हद तक बनाए रखता है।
- source_word: תמחות
  choice: मापों
  rationale: इब्रानी रूप पाठगत रूप से कठिन है; एपा और पत्थर के बाट के साथ इसका संबंध देखकर व्यापक अर्थ “मापों” रखा गया है, ताकि अनिश्चित पाठ को अत्यधिक विशिष्ट न बनाया जाए।
- source_word: איפה
  choice: एपा
  rationale: यह प्राचीन सूखी वस्तुओं की विशिष्ट माप-इकाई है; लिप्यंतरण स्रोत के सांस्कृतिक पद को सुरक्षित रखता है।
- source_word: אבן
  choice: पत्थर का बाट
  rationale: व्यापारिक तौल के संदर्भ में אבן उस पत्थर को सूचित करता है जिसे मानक बाट के रूप में उपयोग किया जाता था; हिन्दी में अर्थ स्पष्ट करने के लिए “पत्थर का बाट” कहा गया है।
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: तराज़ू और बाटों की शुद्धता के विषय में
  rationale: यूनानी समानांतर पाठ “हेराफेरी” के बजाय तौल की शुद्धता या ठीकपन पर बल देता है। मुख्य पाठ उपलब्ध इब्रानी की संभावित दिशा का अनुसरण करता है और यूनानी अर्थ पादटिप्पणी में देता है।
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: बहुत और थोड़ा प्राप्त करने के विषय में
  rationale: यूनानी का दूसरा खंड इब्रानी में आए एपा और पत्थर के बाट से काफी भिन्न है; इसलिए इसे मुख्य पाठ में मिलाए बिना पाठांतर के रूप में दर्ज किया गया है।
