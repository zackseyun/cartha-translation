base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/014.yaml
  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: hi
  text: स्त्री की भलाई से पुरुष की दुष्टता भली है,[a] और जो स्त्री लज्जा लाती है, वह निंदा का पात्र बनती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अंतिम खंड कठिन और कुछ अस्पष्ट है। यूनानी समानांतर का अधिक सीधा अर्थ है, “और लज्जा लानेवाली स्त्री निंदा की ओर ले जाती है”; इससे यहाँ दिए गए भाव को समर्थन मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב ... מטוב
  choice: से ... भली है
  rationale: यहाँ מן तुलनात्मक अर्थ देता है; यूनानी κρείσσων ... ἢ भी इसी तुलना की पुष्टि करता है। हिंदी में ‘से ... भली है’ कहावत की संक्षिप्त और स्वाभाविक शैली बनाए रखता है।
- source_word: רוע
  choice: दुष्टता
  rationale: यह शब्द नैतिक बुराई का बोध कराता है। ‘दुष्टता’ सामान्य ‘बुराई’ की अपेक्षा उसके नैतिक बल को अधिक स्पष्ट रखता है।
- source_word: איש
  choice: पुरुष
  rationale: इब्रानी में यह एकवचन और लिंग-विशिष्ट है तथा אשה के साथ सीधा विरोध बनाता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: אשה
  choice: स्त्री
  rationale: दोनों स्थानों पर सामान्य अर्थ ‘स्त्री’ है। संदर्भ अनिवार्य रूप से ‘पत्नी’ की माँग नहीं करता।
- source_word: מטוב אשה
  choice: स्त्री की भलाई से
  rationale: इब्रानी पाठ पुरुष की दुष्टता की तुलना स्त्री की भलाई से करता है। यह अनुवाद उस असहज किंतु स्पष्ट तुलना को नरम किए बिना सुरक्षित रखता है।
- source_word: מחרפת
  choice: जो स्त्री लज्जा लाती है
  rationale: कृदंत का सक्रिय भाव है—ऐसी स्त्री जो लज्जा या अपमान लाती है। संबंधवाचक उपवाक्य आधुनिक हिंदी में अर्थ को सहज बनाता है।
- source_word: תביע
  choice: बनती है
  rationale: इब्रानी रूप और पूरा अंतिम खंड कठिन है। यूनानी समानांतर परिणामस्वरूप निंदा की ओर संकेत करता है; ‘बनती है’ संभावित परिणामी अर्थ को व्यक्त करता है, बिना अनिश्चित क्रिया का अत्यधिक विशिष्ट अर्थ ठहराए।
- source_word: חרפת
  choice: निंदा का पात्र
  rationale: חרפה निंदा, अपमान या कलंक को दर्शाता है। ‘निंदा का पात्र’ हिंदी में किसी व्यक्ति के स्वयं निंदा का विषय बन जाने का स्वाभाविक रूप है।
theological_decisions:
- issue: पुरुष और स्त्री के बारे में नैतिक रूप से असहज तुलना
  choice: मूल पाठ के लिंग-विशिष्ट विरोध—‘पुरुष’ और ‘स्त्री’—को बिना नरम किए बनाए रखा गया।
  alternative: इसे सभी लोगों पर लागू होनेवाली लिंग-निरपेक्ष कहावत के रूप में प्रस्तुत करना।
  rationale: इब्रानी איש और אשה को सीधे आमने-सामने रखता है। अनुवाद का कार्य इस प्राचीन कहावत की भाषा को पारदर्शी रूप से प्रस्तुत करना है, न कि उसमें मौन रूप से नैतिक या सांप्रदायिक सुधार करना।
- issue: कठिन अंतिम खंड में प्राथमिक पाठ और समानांतर साक्ष्य
  choice: इब्रानी को प्राथमिक रखा गया और अस्पष्ट परिणामी अर्थ समझने के लिए यूनानी समानांतर का सीमित सहारा लिया गया।
  alternative: ‘और एक घर में स्त्री को निंदा के लिए ढूँढ़ा जाता है’ अथवा ‘लज्जाजनक स्त्री निंदा लाती है।’
  rationale: विशेषकर תביע और अंतिम खंड की रचना अस्पष्ट है। यूनानी पाठ लज्जा लानेवाली स्त्री और निंदा के बीच संबंध की पुष्टि करता है, पर इब्रानी की कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, कहावत-जैसी और गरिमापूर्ण शैली रखी गई है। ‘भली है’ मूल की तुलनात्मक सूक्ति का स्वर देता है; लिंग-विशिष्ट तथा असहज कथन को न तो सामान्यीकृत किया गया है, न नरम। मुख्य पाठ का [a] चिह्न संबंधित पाठगत कठिनाई की पादटिप्पणी से मेल खाता है।
