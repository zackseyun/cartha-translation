base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: hi
  text: अपनी कुँवारी बेटी पर कड़ी निगरानी रख, कहीं वह तुझे बदनाम न कर दे[a]—नगर में निंदा का विषय और लोगों के बीच शाप का पात्र न बना दे[b]—और तुझे फाटक पर की सभा में न बैठा दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, ‘तेरे लिए बदनामी का नाम बना दे’; इसका अर्थ ‘बुरा नाम’ या ‘लज्जाजनक प्रतिष्ठा’ भी हो सकता है। यूनानी समानांतर सार्वजनिक उपहास का भाव और स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: 'मसादा की इब्रानी प्रति में यहाँ छोटा पाठ मिलता है: ‘बेटी पर पहरा रख; नगर में निंदा और लोगों की सभा…’; काहाना के काहिरा गनीज़ा-आधारित पाठ में वाक्य अधिक पूर्ण है।'
    reason: textual_variant
  - marker: c
    text: अंतिम इब्रानी पदबंध कठिन है। शाब्दिक रूप से यह ‘फाटक के जमाव/झुंड में’ बैठाने की बात करता है। नगर का फाटक सार्वजनिक सभा और न्याय का स्थान था। यूनानी समानांतर भी भीड़ के सामने लज्जित होने की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: בני ... החזק משמר
  choice: कड़ा पहरा रख
  rationale: इस वाक्य-विन्यास में आदेश बेटी पर सुदृढ़ निगरानी स्थापित रखने का है। ‘कड़ा पहरा रख’ आधुनिक हिन्दी में स्वाभाविक है और החזק की तीव्रता को बनाए रखता है।
- source_word: על בתולתך
  choice: अपनी कुँवारी बेटी पर
  rationale: בתולה का कौमार्य-संबंधी अर्थ यहाँ सामाजिक संदर्भ का अंग है; ‘कुँवारी बेटी’ उसे सीधे और सहज ढंग से व्यक्त करता है।
- source_word: פן תעשה לך שם סרה
  choice: कहीं वह तेरा नाम बदनाम न कर दे
  rationale: שם סרה खराब या लज्जाजनक प्रतिष्ठा की ओर संकेत करता है। यह प्रयोग हिन्दी में अर्थ को स्वाभाविक रखता है, जबकि टिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: דבת עיר
  choice: नगर में निंदा
  rationale: דבה बुरी चर्चा, अपवाद या निंदा हो सकता है। ‘नगर में निंदा’ सार्वजनिक बदनामी का भाव रखता है और हलके मुहावरे से बचता है।
- source_word: וקללת עם
  choice: लोगों के बीच शाप का पात्र
  rationale: यह सामुदायिक धिक्कार या शाप का निशाना बनने का भाव व्यक्त करता है; हिन्दी में केवल ‘शाप’ कहने की अपेक्षा ‘शाप का पात्र’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: והושיבתך בעדר שער
  choice: और तुझे फाटक पर जुटी सभा में न बैठा दे
  rationale: והושיבתך का कारक अर्थ ‘बैठा दे’ से सुरक्षित है। עדר שער कठिन पदबंध है; ‘फाटक पर जुटी सभा’ उसके सार्वजनिक जमाव और नगर-फाटक के नागरिक संदर्भ को व्यक्त करता है, पर कठिनाई को पादटिप्पणी में खुला रखता है।
theological_decisions:
- issue: कठिन अंतिम पदबंध के लिए इब्रानी और यूनानी साक्ष्य का संबंध
  choice: इब्रानी पाठ को आधार बनाकर ‘फाटक पर जुटी सभा’ अनूदित किया गया है।
  alternative: यूनानी के अनुसार अधिक स्पष्ट रूप से ‘बहुतों की भीड़ के सामने तुझे लज्जित करे’ अनूदित किया जा सकता है।
  rationale: उपलब्ध इब्रानी प्राथमिक साक्ष्य है। यूनानी समानांतर सार्वजनिक लज्जा के संदर्भ की पुष्टि करता है, पर उसके ‘शत्रुओं’ और ‘बहुतों की भीड़’ जैसे विस्तार मुख्य पाठ में नहीं जोड़े गए।
- issue: पारिवारिक सम्मान और बेटी की निगरानी की प्राचीन सामाजिक धारणा
  choice: पाठ की कठोर और असहज सामाजिक धारणा को बिना अनुमोदन या नरमी के यथावत प्रस्तुत किया गया है।
  alternative: आधुनिक संवेदनशीलता के अनुसार आदेश को सामान्य अभिभावकीय देखभाल के रूप में नरम किया जा सकता था।
  rationale: अनुवाद का काम स्रोत की ऐतिहासिक नैतिक-सामाजिक तनावशीलता को मिटाना नहीं है; इसलिए बेटी, कौमार्य, निगरानी और पिता की सार्वजनिक प्रतिष्ठा के संबंध को स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कड़ा पहरा’, ‘नगर में निंदा’ और ‘शाप का पात्र’ सामान्य पाठक के लिए बोधगम्य हैं। प्राचीन पितृसत्तात्मक संदर्भ को न तो आधुनिक बनाया गया है, न उसका समर्थन करने वाली अतिरिक्त भाषा जोड़ी गई है।
