translation:
  language: hi
  text: कोई भी विचार उससे छूटा नहीं है, और कोई भी बात उसकी नज़र से बच नहीं पाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שכל
  choice: विचार
  rationale: यहाँ שכל का अर्थ मन में उत्पन्न समझ, विचार या अभिप्राय है। यूनानी समानांतर διανόημα भी ‘विचार’ का समर्थन करता है; इससे वाक्य स्वाभाविक रहता है और ज्ञान-संबंधी अर्थ सुरक्षित रहता है।
- source_word: דבר
  choice: बात
  rationale: דבר में ‘शब्द’, ‘बात’ और ‘विषय/घटना’ की अर्थ-व्याप्ति है। यूनानी λόγος ‘बात/वचन’ का समर्थन करता है। हिन्दी में ‘बात’ इस व्यापकता को ‘शब्द’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: לא נעדר ממנו
  choice: उससे छूटा नहीं है
  rationale: शाब्दिक भाव ‘उसके लिए/उससे अनुपस्थित नहीं हुआ’ है। आधुनिक हिन्दी में ‘उससे छूटा नहीं’ सर्वज्ञता के संदर्भ को सहज ढंग से व्यक्त करता है।
- source_word: לא חלפו
  choice: बचकर नहीं निकली
  rationale: חלף का मूल भाव गुजर जाने या निकल जाने का है। ‘बचकर नहीं निकली’ उस चित्रात्मकता और ‘उसकी जानकारी से नहीं छूटी’ के आशय दोनों को रखता है।
theological_decisions:
- issue: ईश्वरीय सर्वज्ञता की अभिव्यक्ति
  choice: 'दोनों समानांतर खंडों को पूर्ण निषेध के रूप में रखा गया है: कोई विचार नहीं छूटा और कोई बात बचकर नहीं निकली।'
  alternative: इसे व्याख्यात्मक रूप से ‘वह सब कुछ जानता है’ कहा जा सकता था।
  rationale: मूल की काव्यात्मक समानांतरता और ज्ञान की व्यापकता को बिना किसी अतिरिक्त धर्मवैज्ञानिक परिभाषा के सुरक्षित रखना उचित है।
- issue: שכל की संभावित अस्पष्टता
  choice: ‘विचार’
  alternative: ‘समझ’ या ‘बुद्धि’
  rationale: ‘समझ की कोई कमी उसे नहीं है’ सम्भव है, किंतु यूनानी διανόημα और अगली पंक्ति के ‘बात’ के साथ ‘विचार’ अधिक स्वाभाविक रूप से उन सभी वस्तुओं को दर्शाता है जो उससे छिपी नहीं हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। समानांतर वाक्यरचना और मूल का व्यापक ज्ञान-संबंधी दावा बनाए रखा गया है।
