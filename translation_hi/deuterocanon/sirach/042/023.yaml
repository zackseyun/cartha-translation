base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/023.yaml
  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: hi
  text: ये सब जीवित हैं और सदा बने रहते हैं; हर आवश्यकता में सब आज्ञा मानते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ छपा काहिरा गनीज़ा-आधारित इब्रानी पाठ एक भिन्न पंक्ति देता है, जिसका लगभग अर्थ है: “और कौन देखकर तृप्त हो सकता है? आकाश की ऊँचाई का निर्मल वैभव।” यह पंक्ति निकटवर्ती प्रसंग से यहाँ आ गई प्रतीत होती है। मसादा के पुराने साक्ष्य और यूनानी परंपरा मुख्य पाठ में दिए अर्थ का समर्थन करते हैं।'
    reason: textual_variant
  - marker: b
    text: “हर आवश्यकता में” का अनुवाद “हर प्रयोजन के लिए” या “सभी आवश्यकताओं में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: ये सब
  rationale: यूनानी पाठ का संकेतवाचक बल बनाए रखता है और संदर्भ में अभी वर्णित सृष्ट वस्तुओं की ओर स्वाभाविक ढंग से संकेत करता है।
- source_word: ζῇ / חי
  choice: जीवित रहते हैं
  rationale: सृष्ट वस्तुओं में निरंतर जीवन होने के कथन को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μένει εἰς τὸν αἰῶνα / קים לעד
  choice: सदा बने रहते हैं
  rationale: निरंतर स्थायित्व का अर्थ स्वाभाविक हिन्दी में देता है, बिना इसे विनाश-असम्भवता जैसे अधिक विशिष्ट दावे में बदलने के।
- source_word: ἐν πάσαις χρείαις / ולכל צריך
  choice: हर आवश्यकता में
  rationale: χρεία के ‘आवश्यकता’, ‘प्रयोजन’ और ‘उपयोग’ के अर्थ-क्षेत्र को पर्याप्त खुला रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὑπακούει
  choice: आज्ञा मानते हैं
  rationale: सृष्टि के व्यवस्थित प्रत्युत्तर और अधीनता को सीधी, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: और कौन देखकर तृप्त हो सकता है? आकाश की ऊँचाई का निर्मल वैभव
  rationale: काहाना के काहिरा गनीज़ा-आधारित इब्रानी पाठ का लगभग शाब्दिक अर्थ मुख्य पाठ के बजाय पाठांतर-संबंधी पादटिप्पणी में सुरक्षित किया गया है, क्योंकि यह पंक्ति संदर्भ में विस्थापित प्रतीत होती है।
theological_decisions:
- issue: काहिरा गनीज़ा के उपलब्ध इब्रानी पाठ और यूनानी समानांतर तथा पुराने मसादा साक्ष्य के बीच पाठगत असंगति
  choice: 'मुख्य पाठ में यूनानी परंपरा द्वारा सुरक्षित और मसादा साक्ष्य से समर्थित सुसंगत अर्थ रखा गया है: “ये सब जीवित रहते और सदा बने रहते हैं; हर आवश्यकता में सब आज्ञा मानते हैं।”'
  alternative: 'काहिरा गनीज़ा-आधारित इब्रानी पंक्ति का अनुवाद: “और कौन देखकर तृप्त हो सकता है? आकाश की ऊँचाई का निर्मल वैभव।”'
  rationale: मुद्रित इब्रानी पंक्ति निकटवर्ती प्रसंग से विस्थापित जान पड़ती है, जबकि यूनानी पाठ इस पद के संदर्भ में सुसंगत है और पुराने मसादा साक्ष्य से भी समर्थित है। पाठगत तनाव को छिपाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। “ये सब” तत्काल पूर्ववर्ती सृष्ट वस्तुओं की ओर संकेत करता है। पाठगत अनिश्चितता मुख्य पाठ में दबाई नहीं गई, बल्कि स्पष्ट पादटिप्पणी में रखी गई है।
