translation:
  language: hi
  text: पट्टेदार[a], स्वामी और अतिथि के हिसाब के विषय में, और विरासत तथा संपत्ति[b] के बँटवारे के विषय में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “साझेदार के हिसाब और यात्रियों के विषय में, साझेदारों को विरासत देने के विषय में।” यह कई स्थानों पर भिन्न आधार-पाठ को दर्शाता है। मुख्य अनुवाद उपलब्ध हिब्रू पाठ का अनुसरण करता है।'
    reason: alternative_reading
  - marker: b
    text: अंतिम हिब्रू शब्द अत्यंत संक्षिप्त है और यहाँ उसका अर्थ कुछ अनिश्चित है; पद के कानूनी-आर्थिक संदर्भ के अनुसार उसका अनुवाद “संपत्ति” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: על חשבון
  choice: हिसाब के विषय में
  rationale: यह पदबंध आर्थिक लेखे या हिसाब-किताब के विषय को प्रस्तुत करता है; आधुनिक हिन्दी में ‘हिसाब’ स्वाभाविक और स्पष्ट है।
- source_word: חוכר
  choice: पट्टेदार
  rationale: यह उस व्यक्ति को दर्शाता है जो भूमि या संपत्ति पट्टे पर लेता है; ‘पट्टेदार’ कानूनी-आर्थिक संदर्भ को ‘किसान’ से अधिक ठीक रखता है।
- source_word: אדון
  choice: स्वामी
  rationale: सामाजिक या संविदात्मक संबंध में अधिकार रखने वाले व्यक्ति का बोध कराता है; ‘प्रभु’ यहाँ अनावश्यक धार्मिक अर्थ ला सकता था।
- source_word: אורח
  choice: अतिथि
  rationale: हिब्रू शब्द अतिथि या यात्री दोनों का अर्थ दे सकता है; मुख्य हिब्रू पाठ के निकट रहते हुए ‘अतिथि’ चुना गया है, जबकि यूनानी पाठ यात्रियों की ओर संकेत करता है।
- source_word: מחלקות
  choice: बँटवारे
  rationale: यह बाँटने या हिस्से निर्धारित करने की क्रिया को दर्शाता है और विरासत के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: נחלה
  choice: विरासत
  rationale: पारिवारिक या कानूनी रूप से प्राप्त संपत्ति के लिए यह स्पष्ट आधुनिक हिन्दी शब्द है।
- source_word: ויש
  choice: तथा संपत्ति
  rationale: अंतिम हिब्रू शब्द संक्षिप्त और संदर्भ में कुछ अनिश्चित है; कानूनी-आर्थिक प्रसंग में ‘संपत्ति’ संभावित आशय को स्पष्ट रखते हुए प्रस्तुत करता है।
