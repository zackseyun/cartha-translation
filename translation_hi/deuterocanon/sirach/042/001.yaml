  text: Do not be ashamed of these things, and do not show partiality and sin.
translation:
  language: hi
  text: पर इन बातों पर लज्जित न हो[a], और पक्षपात न कर[b] और पाप न कर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सेप्टुआजिन्ट के यूनानी समानांतर पाठ में यहाँ शब्दावली काफी भिन्न और अधिक विस्तृत है; उसमें लज्जा, सुनी-सुनाई बात, और गुप्त वचनों को प्रकट करने से संबंधित कई विशेष बातें गिनाई गई हैं। मुख्य अनुवाद काहिरा जेनिज़ा में सुरक्षित हिब्रू पाठ का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: या, “किसी का पक्ष न ले।” हिब्रू मुहावरे का शाब्दिक अर्थ है “चेहरा न उठा।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश बहुत संक्षिप्त है और शाब्दिक रूप से “और पाप कर” है। इसे “और इस तरह पाप न कर” या “कहीं पाप न कर बैठे” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  choice: पर इन बातों के विषय में
  rationale: אך यहाँ पिछले प्रसंग से सीमित विरोध या बल का संकेत देता है, और על אלה लज्जा के विषय को बताता है। यह रूप हिब्रू के दोनों तत्वों को सहज आधुनिक हिन्दी में रखता है।
- source_word: אל תבוש
  choice: लज्जित न हो
  rationale: בוש सामाजिक या नैतिक लज्जा का बोध कराता है; ‘लज्जित’ केवल क्षणिक झेंप की अपेक्षा उस अर्थ को अधिक ठीक व्यक्त करता है।
- source_word: ואל תשא פנים
  choice: और पक्षपात न कर
  rationale: नासא פנים का शाब्दिक अर्थ ‘चेहरा उठाना’ है, पर यह हिब्रू मुहावरा किसी के प्रति अनुचित पक्ष दिखाने के अर्थ में आता है। ‘पक्षपात’ स्पष्ट, स्वाभाविक और नैतिक आशय के अनुरूप है।
- source_word: וחטא
  choice: और पाप न कर
  rationale: हिब्रू में अंतिम पद अत्यंत संक्षिप्त है—शाब्दिक रूप से ‘और पाप कर’। हिन्दी में पूर्व निषेध को समन्वित क्रिया तक दोहराकर वाक्य को स्पष्ट रखा गया है, जबकि उसके ठीक तार्किक संबंध को मुख्य पाठ में अधिक नहीं खोला गया।
theological_decisions:
- issue: ‘और पाप’ का ‘पक्षपात न कर’ से संबंध
  choice: इसे समन्वित निषेध के रूप में ‘और पाप न कर’ रखा गया, ताकि हिब्रू की संक्षिप्तता बनी रहे।
  alternative: ‘पक्षपात करके पाप न कर’ अथवा ‘कहीं पक्षपात करके पाप न कर बैठे।’
  rationale: हिब्रू यह स्पष्ट नहीं करता कि पाप पक्षपात का परिणाम है, उसका उद्देश्य है, या उसी निषेध के अधीन दूसरी समन्वित क्रिया। मुख्य पाठ किसी एक संबंध को निर्णायक रूप से नहीं थोपता; पादटिप्पणी संभावित अधिक स्पष्ट अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और उपदेशात्मक है। ‘लज्जित’ और ‘पक्षपात’ गरिमापूर्ण होते हुए भी सामान्य पाठक के लिए सहज हैं। सभी पाठालोचनात्मक और अर्थगत संकेत क्रमशः [a], [b], [c] के रूप में मुख्य पाठ में दिए गए हैं।
