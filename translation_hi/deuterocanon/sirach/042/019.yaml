base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/019.yaml
  text: He declares the changes that are coming[b][a], and reveals the search of hidden things.
translation:
  language: hi
  text: वह घटित होने वाले परिवर्तनों को प्रकट करता है[b][a], और छिपी बातों की खोज को उजागर करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर: “वह बीती हुई और आने वाली बातें बताता है, और छिपी बातों के चिह्न प्रकट करता है।” यह उपलब्ध इब्रानी की अपेक्षा काल-संबंधी अर्थ को अधिक विस्तार से व्यक्त करता है।'
    reason: alternative_reading
  - marker: b
    text: इस अंश की मसादा-पांडुलिपि खंडित है और इस पद को इतने पर्याप्त रूप में सुरक्षित नहीं रखती कि यहाँ काहिरा गनीज़ा के पाठ के स्थान पर उसका उपयोग किया जा सके।
    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  choice: प्रकट करता है
  rationale: यह क्रिया किसी बात को ज्ञात कराने, बताने या घोषित करने का भाव रखती है। ‘प्रकट करता है’ ज्ञान-विषयक प्रसंग में स्वाभाविक है और यूनानी समानांतर के ‘बता देता है/घोषित करता है’ अर्थ से भी मेल खाता है।
- source_word: חליפות
  choice: परिवर्तनों
  rationale: यह संज्ञा बदलावों, अदल-बदल या क्रमिक परिवर्तनों को सूचित कर सकती है। ‘परिवर्तनों’ से अर्थ व्यापक रहता है और यूनानी समानांतर में व्यक्त कालगत क्रम के साथ भी संगत है।
- source_word: נהיות
  choice: घटित होने वाले
  rationale: היה से बना यह रूप उन बातों की ओर संकेत करता है जो अस्तित्व में आती या घटित होती हैं। ‘घटित होने वाले’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बनने/होने के भाव को बनाए रखता है।
- source_word: ומגלה
  choice: और … उजागर करता है
  rationale: גלה का मूल भाव ढकी हुई बात को खोलना या प्रकट करना है। ‘उजागर करता है’ पहले खंड के ‘प्रकट करता है’ से अनावश्यक पुनरावृत्ति भी टालता है।
- source_word: חקר
  choice: खोज
  rationale: यह शब्द खोज, छानबीन या गहन जाँच को सूचित करता है। ‘खोज’ सरल आधुनिक हिन्दी है और इब्रानी की संज्ञात्मक रचना को बनाए रखता है; इसे ‘गहराई’ कहने से पाठ में निहित अन्वेषण का भाव कम हो सकता था।
- source_word: נסתרות
  choice: छिपी बातें
  rationale: यह बहुवचन रूप छिपी या गुप्त वस्तुओं/बातों को सूचित करता है। ‘छिपी बातें’ सहज और अर्थ की दृष्टि से व्यापक है।
theological_decisions:
- issue: इब्रानी पाठ और अधिक विस्तृत यूनानी समानांतर का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी को आधार बनाया गया है; यूनानी के स्पष्ट ‘बीती और आने वाली बातें’ को मुख्य पाठ में नहीं जोड़ा गया।
  alternative: वह बीती हुई और आने वाली बातें बताता है, और छिपी बातों के चिह्न प्रकट करता है।
  rationale: यहाँ इब्रानी पाठ उपलब्ध और विश्वसनीय है, इसलिए उसे प्राथमिकता दी गई है। यूनानी समानांतर कालगत परिवर्तन की समझ की पुष्टि करता है, पर उसका ‘बीती हुई और आने वाली’ तथा ‘चिह्न’ वाला विस्तार इब्रानी में स्पष्ट नहीं है; अतः उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण रखी गई है। ‘घटित होने वाले परिवर्तन’ इब्रानी के होने/अस्तित्व में आने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘छिपी बातों की खोज’ मूल की कुछ असामान्य संज्ञात्मक रचना और अर्थगत तनाव को बिना चुपचाप ‘गहराइयों’ में बदल दिए सुरक्षित रखता है।
