base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/016.yaml
  text: The sun rises and shines on everything revealed[b][a], and the glory of the Lord is over all his works.
translation:
  language: hi
  text: सूरज उदय होता है और दिखाई देनेवाली हर वस्तु पर चमकता है[a][b], और प्रभु की महिमा उसके सभी कार्यों पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक भाव है, “जो कुछ प्रकट या दिखाई देता है, उस सब पर।” यूनानी समानांतर का भाव कुछ ऐसा है, “प्रकाश देता हुआ वह सब कुछ देखता है।”
    reason: alternative_reading
  - marker: b
    text: मसादा से मिली अधिक प्राचीन हिब्रू प्रति में इस पंक्ति के शब्द काहिरा गनीज़ा के उस पाठ से भिन्न जान पड़ते हैं जिस पर मुख्य अनुवाद आधारित है।
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: सूरज
  rationale: यह आकाशीय पिंड के लिए सामान्य और स्वाभाविक आधुनिक हिन्दी शब्द है; काव्यात्मक गरिमा भी बनी रहती है।
- source_word: זורחת
  choice: उदय होकर चमकता है
  rationale: זרח के कृदन्त में उगने और प्रकाशमान होने—दोनों का भाव हो सकता है। यह अनुवाद दोनों अर्थों को संक्षेप में रखता है; यूनानी समानांतर भी प्रकाश देने के भाव की पुष्टि करता है।
- source_word: על כל נגלתה
  choice: जो कुछ दिखाई देता है, उस सब पर
  rationale: נגלתה का आशय प्रकट, खुला हुआ या दृश्य हो सकता है। ‘दिखाई देता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दृश्य/प्रकट होने का भाव सुरक्षित रखता है।
- source_word: כבוד
  choice: महिमा
  rationale: परमेश्वर के संदर्भ में כבוד के गौरव, वैभव और प्रभाव को व्यक्त करने वाला प्रचलित तथा धर्मवैचारिक रूप से तटस्थ शब्द है।
- source_word: ה׳
  choice: प्रभु
  rationale: हिब्रू पांडुलिपि में संक्षिप्त दिव्य नाम/उपाधि है। ‘प्रभु’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- source_word: מעשיו
  choice: उसके सभी कार्यों
  rationale: यह परमेश्वर के किए हुए कामों और उसकी रचनाओं—दोनों को समेटने वाला व्यापक और संक्षिप्त अनुवाद है।
theological_decisions:
- issue: ה׳ का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: स्रोत में पूरा दिव्य नाम नहीं, बल्कि संक्षिप्त संकेत है। ‘प्रभु’ इस पाठ-रूप और सिराख की परंपरा के अनुरूप है तथा मूल से अधिक विशिष्टता नहीं जोड़ता।
- issue: पहले खंड में हिब्रू और यूनानी के बीच अंतर
  choice: हिब्रू को आधार बनाकर ‘जो कुछ दिखाई देता है, उस सब पर उदय होकर चमकता है’
  alternative: ‘प्रकाश देता हुआ सूरज सब कुछ देखता है’
  rationale: हिब्रू पाठ ‘दृश्य/प्रकट सब पर’ को प्राथमिकता देता है, जबकि यूनानी में प्रकाश देने और सब पर दृष्टि डालने का भाव है। मुख्य पाठ हिब्रू का अनुसरण करता है और भिन्न यूनानी अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- issue: प्रभु की महिमा और उसके कार्यों का संबंध
  choice: ‘उसके सभी कार्यों पर है’
  alternative: ‘उसके सभी कार्य उसकी महिमा से भरे हैं’
  rationale: हिब्रू על ‘पर’ कहता है, जबकि यूनानी में कार्य के उसकी महिमा से भरे होने का भाव मिलता है। मुख्य अनुवाद हिब्रू संबंध को बिना विस्तार या धर्मवैचारिक समाधान के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उदय होकर चमकता है’ हिब्रू क्रिया की भोर और प्रकाश—दोनों संभावित छवियों को रखता है। पादटिप्पणी चिह्न मुख्य पाठ में वर्णानुक्रम से [a][b] दिए गए हैं।
