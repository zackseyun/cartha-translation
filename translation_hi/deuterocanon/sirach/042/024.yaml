  yaml_path: translation/deuterocanon/sirach/042/024.yaml
  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
translation:
  language: hi
  text: सभी वस्तुएँ जोड़ों में हैं[a], एक-दूसरे के सामने, और उसने कुछ भी अधूरा नहीं बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अंश का मसादा से प्राप्त इब्रानी साक्ष्य भी इस भाव का समर्थन करता है कि कुछ भी त्रुटिपूर्ण या अधूरा नहीं बनाया गया, यद्यपि इन पंक्तियों के आसपास इब्रानी पाठ खंडित है और उसकी क्रम-व्यवस्था भिन्न है।
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  choice: सभी वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ है; यह सृष्टि की समस्त वस्तुओं को समेटता है और सूक्तिपरक शैली बनाए रखता है।
- source_word: δισσὰ
  choice: जोड़ों में हैं
  rationale: यह शब्द द्वित्व या जोड़ी होने का भाव देता है। यह अनुवाद किसी वस्तु की केवल नकल बनने का अर्थ दिए बिना उसकी युग्मात्मक व्यवस्था व्यक्त करता है।
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: एक दूसरी के सामने
  rationale: यूनानी पदबंध आमने-सामने रखे जाने, अनुरूपता या विरोध—इनसे जुड़ा संबंध व्यक्त करता है। यह रूप उस संबंध को स्वाभाविक हिन्दी में रखता है और उसे केवल शत्रुतापूर्ण विरोध तक सीमित नहीं करता।
- source_word: οὐκ ἐποίησεν
  choice: उसने ... नहीं बनाया
  rationale: क्रिया का कर्ता यूनानी में अंतर्निहित है; निकटवर्ती संदर्भ में वह परमेश्वर है। हिन्दी में सर्वनाम स्पष्ट करना स्वाभाविक है।
- source_word: οὐδὲν ἐκλιπόν
  choice: कुछ भी अधूरा नहीं
  rationale: ἐκλιπόν में छूटे हुए, घटे हुए या अपूर्ण होने का भाव हो सकता है। 'अधूरा' सृष्टि में किसी आवश्यक बात की कमी न होने का अर्थ सहजता से देता है, बिना कमी के स्वरूप को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: ἐποίησεν का अंतर्निहित कर्ता
  choice: '''उसने'' लिखा गया है, जिसका संदर्भ परमेश्वर से है।'
  alternative: 'भाववाच्य रूप: ''कुछ भी अधूरा नहीं बनाया गया।'''
  rationale: मूल यूनानी में कर्ता व्यक्त नहीं है, पर आसपास का प्रसंग परमेश्वर के व्यवस्थित सृजन-कर्म की चर्चा करता है। सर्वनाम जोड़ना हिन्दी में स्पष्टता देता है और प्रसंग से बाहर कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: सृष्ट वस्तुओं की युग्मात्मकता का संबंध
  choice: '''एक दूसरी के सामने'' द्वारा संबंध को खुला रखा गया है।'
  alternative: '''एक दूसरी के विपरीत''।'
  rationale: κατέναντι में विरोध के साथ आमने-सामने होने या अनुरूप संगति का भाव भी संभव है। केवल 'विपरीत' कहने से अर्थ अनावश्यक रूप से संकुचित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली। 'वस्तुएँ' व्यापक πάντα को व्यक्त करता है; 'एक दूसरी के सामने' मूल की संबंधपरक अस्पष्टता को सुरक्षित रखता है।
