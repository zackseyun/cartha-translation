  yaml_path: translation/deuterocanon/sirach/042/018.yaml
  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: hi
  text: वह अथाह गहराई और हृदय को भली-भाँति जाँचता है[b], और उनके सारे खुले हुए पहलू समझता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “और उसने उनकी हर युक्ति (या चाल) पर विचार किया।” इब्रानी में “उनकी सारी अनावृत बातें” है—अर्थात वह सब जो उसके सामने खुला पड़ा है।'
    reason: alternative_reading
  - marker: b
    text: 'मसादा की इब्रानी प्रति में आरम्भ का संक्षिप्त पाठ है: “अथाह गहराई और हृदय को उसने जाँचा”; काहिरा गनीज़ा का पाठ आगे “उनकी सारी अनावृत बातें” वाला खंड भी रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: תהום
  choice: अथाह गहराई
  rationale: यह शब्द आदिम अथवा अगाध गहराई को दर्शाता है। ‘अथाह गहराई’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी ἄβυσσον से पुष्ट गहनता के भाव को बनाए रखता है।
- source_word: לב
  choice: हृदय
  rationale: यह मनुष्य के भीतरी व्यक्तित्व, विचार और अभिप्राय का द्योतक है। ‘हृदय’ मूल रूपक और यूनानी καρδίαν, दोनों के अनुरूप है।
- source_word: חקר
  choice: भली-भाँति जाँचता है
  rationale: क्रिया गहराई से खोजने या परखने का भाव देती है। वर्तमान काल इसे परमेश्वर के ज्ञान के बारे में सामान्य, सतत सत्य के रूप में व्यक्त करता है।
- source_word: מערומיהם
  choice: उनकी सारी अनावृत बातें
  rationale: इब्रानी रूप का शाब्दिक संबंध नग्नता अथवा खुली हुई दशा से है। ‘अनावृत बातें’ उस असामान्य बिंब को पठनीय हिन्दी में बनाए रखता है, बिना उसे केवल ‘रहस्य’ बनाकर अर्थ को चुपचाप सीमित किए। यूनानी की भिन्न ‘युक्तियों/चालों’ वाली परंपरा पादटिप्पणी में दी गई है।
- source_word: יתבונן
  choice: समझता है
  rationale: हित्पोलेल रूप ध्यानपूर्वक विचार करने, परखने और समझने का भाव रखता है; यहाँ ‘समझता है’ उसका संज्ञानात्मक बल सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानी पंक्ति में कर्ता परमेश्वर है, पर उसका नाम स्पष्ट रूप से नहीं दिया गया
  choice: मुख्य पाठ में ‘वह’ रखा गया
  alternative: मुख्य पाठ में ‘प्रभु’ जोड़ना
  rationale: संदर्भ से दिव्य कर्ता स्पष्ट है और यूनानी समानांतर में आगे ‘प्रभु’ आता है, पर इस इब्रानी पंक्ति में नाम नहीं है। सर्वनाम मूल पाठ की अंतर्निहितता को सुरक्षित रखता है।
- issue: מערומיהם के अर्थ की असामान्यता और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी बिंब ‘अनावृत बातें’ रखा गया
  alternative: ‘उनके सारे रहस्य’ अथवा यूनानी के अनुसार ‘उनकी हर युक्ति’
  rationale: प्राथमिक इब्रानी साक्ष्य को वरीयता देते हुए उसके खुलापन/नग्नता के बिंब को सुरक्षित रखा गया है; यूनानी की वास्तविक वैकल्पिक परंपरा को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अथाह गहराई’ और ‘हृदय’ मूल बिंबों को रखते हैं; ‘अनावृत बातें’ जानबूझकर कुछ असामान्य है, ताकि इब्रानी की अर्थगत विशेषता बनी रहे, जबकि पादटिप्पणी उसका आशय और यूनानी विकल्प स्पष्ट करती है।
