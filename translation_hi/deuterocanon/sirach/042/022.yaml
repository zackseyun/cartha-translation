base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/022.yaml
  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: hi
  text: वह जीवित है और सदा स्थिर रहता है; उसकी भलाई एक से दूसरे तक फैलती जाती है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ हिब्रू अभिव्यक्ति संक्षिप्त और कुछ अनिश्चित है। यूनानी समानांतर पाठ एक भिन्न और अधिक विस्तृत रूप सुरक्षित रखता है: “न उसमें कुछ जोड़ा गया, न कुछ घटाया गया, और उसे किसी सलाहकार की आवश्यकता नहीं पड़ी। उसके सभी कार्य कितने मनोहर हैं, और वे देखने में चिनगारी के समान हैं!”'
    reason: textual_variant
  - marker: b
    text: या, “उसकी भलाई एक पर दूसरी तरह से गुजरती है” अथवा “उसकी भलाई एक से दूसरे की ओर बढ़ती है।” हिब्रू पदबंध संक्षिप्त है और उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: वह
  rationale: आसपास के स्तुतिगान में संकेत परमेश्वर की ओर है, इसलिए पुरुषवाचक सर्वनाम स्वाभाविक है।
- source_word: חי
  choice: जीवित है
  rationale: यह रूप निरंतर जीवन का भाव देता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: ועומד
  choice: और स्थिर रहता है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खड़ा रहना’ है, पर यहाँ निरंतर बने रहने का भाव है; ‘स्थिर रहता है’ ठोस बिंब और स्थायित्व दोनों को व्यक्त करता है।
- source_word: לעד
  choice: सदा
  rationale: अनंत अथवा निरंतर काल के लिए संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी अभिव्यक्ति।
- source_word: זה על זה
  choice: एक से दूसरे तक
  rationale: हिब्रू पदबंध संक्षिप्त और अनिश्चित है। यह चयन विभिन्न वस्तुओं के बीच क्रम या विस्तार का भाव रखता है, बिना अर्थ को अत्यधिक निश्चित किए।
- source_word: חלף
  choice: पहुँचती है
  rationale: क्रिया में आगे जाने, पार होने या क्रम से आने का भाव हो सकता है। ‘पहुँचती है’ हिन्दी में गति का भाव बनाए रखता है, जबकि पादटिप्पणी अन्य संभावनाएँ बताती है।
- source_word: טובו
  choice: उसकी भलाई
  rationale: טוב का सीधा अर्थ भलाई या कल्याणकारी सद्गुण है। ‘भलाई’ सामान्य पाठक के लिए स्पष्ट है और ‘सुंदरता’ जैसे अधिक व्याख्यात्मक अर्थ से बचती है।
theological_decisions:
- issue: विद्यमान हिब्रू पंक्ति और अधिक विस्तृत यूनानी समानांतर पाठ का संबंध
  choice: मुख्य पाठ में विद्यमान हिब्रू को आधार बनाया गया और यूनानी पाठांतर को पादटिप्पणी में दिया गया।
  alternative: हिब्रू के स्थान पर यूनानी पाठ ग्रहण करना अथवा दोनों को मिलाकर एक समन्वित पाठ बनाना।
  rationale: जहाँ सिराख का हिब्रू उपलब्ध है, वह प्राथमिक स्रोत है। यूनानी पाठ संभवतः भिन्न या विस्तृत पाठ-परंपरा को दर्शाता है, इसलिए उसे मुख्य पाठ का स्थान दिए बिना पाठक के सामने रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य। हिब्रू की संक्षिप्तता और अनिश्चितता को मुख्य पाठ में सहज रूप दिया गया है तथा वास्तविक पाठगत और शब्दार्थगत विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
