translation:
  language: hi
  text: एक वस्तु दूसरी की अच्छी बातों को सुदृढ़ करती है[a], और उसकी[b] महिमा को देखते हुए कौन तृप्त हो सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “एक वस्तु दूसरी की अच्छी बातों को दृढ़ करती है।” यूनानी क्रिया का अर्थ “दृढ़ करना” या “बल देना” हो सकता है; यहाँ सृष्टि की वस्तुओं के परस्पर मेल और सहयोग का भाव है।'
    reason: lexical_alternative
  - marker: b
    text: “उसकी” का सबसे संभावित संकेत परमेश्वर की ओर है; इसे सृष्टि में प्रकट वैभव के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: एक वस्तु दूसरी की
  rationale: यूनानी पदबंध संक्षिप्त और संबंधसूचक है। सृष्टि की परस्पर व्यवस्थित वस्तुओं के संदर्भ में ‘वस्तु’ जोड़ने से हिन्दी स्पष्ट और स्वाभाविक रहती है।
- source_word: ἐστερέωσεν
  choice: पुष्ट करती है
  rationale: क्रिया का मूल अर्थ ‘दृढ़ करना’ या ‘बल देना’ है। ‘पुष्ट करती है’ उस अर्थ को बनाए रखते हुए वस्तुओं की परस्पर सहायक और पूरक भूमिका भी व्यक्त करता है।
- source_word: τὰ ἀγαθά
  choice: अच्छाइयों
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण व्यापक रूप से अच्छी विशेषताओं, गुणों या लाभों को दर्शाता है; ‘अच्छाइयों’ उस व्यापकता को बनाए रखता है।
- source_word: τίς πλησθήσεται
  choice: कौन तृप्त हो सकता है
  rationale: शाब्दिक अर्थ ‘कौन भर जाएगा’ है, पर यहाँ आलंकारिक प्रश्न में ‘तृप्त होना’ स्वाभाविक हिन्दी है और कभी पर्याप्त न होने का भाव देता है।
- source_word: ὁρῶν
  choice: देखते-देखते
  rationale: वर्तमान कृदंत लगातार निहारने की क्रिया बताता है; ‘देखते-देखते’ उसकी निरंतरता को सहज हिन्दी में व्यक्त करता है।
- source_word: δόξαν αὐτοῦ
  choice: उसकी महिमा
  rationale: δόξα प्रकट वैभव या महिमा को सूचित करता है। निकटवर्ती सृष्टि-वर्णन में सर्वनाम का सर्वाधिक स्वाभाविक संदर्भ परमेश्वर है, जबकि व्याकरणतः सृष्टि के वैभव का संकेत भी संभव है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसकी’ से परमेश्वर अभिप्रेत
  alternative: सृष्टि में दिखाई देने वाला वैभव
  rationale: आसपास का स्तुतिगान सृष्टि के सुव्यवस्थित कार्यों द्वारा सृष्टिकर्ता की महिमा प्रकट करता है। इसलिए परमेश्वर सबसे स्वाभाविक संदर्भ है, पर वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक प्रश्नवाचक शैली रखी गई है। ‘पुष्ट करती है’ मूल क्रिया के दृढ़ करने वाले अर्थ और संदर्भगत परस्पर पूरकता, दोनों को संतुलित करता है।
