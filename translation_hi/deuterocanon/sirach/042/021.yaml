base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: hi
  text: उसने अपनी बुद्धि के सामर्थ्यशाली कार्यों को सुव्यवस्थित किया है; वह अनादिकाल से अद्वितीय है।[a] न उसमें कुछ जोड़ा जाता है, न उससे कुछ घटाया जाता है;[b] और उसे किसी समझदार व्यक्ति की आवश्यकता नहीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अद्वितीय’ का शाब्दिक इब्रानी रूप ‘वह एक है’ है। यूनानी समानांतर काल को ‘युग से पहले और युग तक’ विस्तृत करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उससे कुछ घटाया जाता है’ के पीछे का इब्रानी पद कठिन है। संभावित भाव यह है कि परमेश्वर में न कुछ जोड़ा जा सकता है, न उससे कुछ कम किया जा सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘समझदार व्यक्ति’ का शाब्दिक अर्थ ‘समझनेवाला’ या ‘विवेकी’ है; प्रसंग में ‘सलाहकार’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  choice: अपनी बुद्धि के सामर्थ्यशाली कार्यों को
  rationale: इब्रानी रचना संक्षिप्त है और उसका अर्थ ‘उसकी बुद्धि का सामर्थ्य’ भी हो सकता है। यूनानी समानांतर में बहुवचन τὰ μεγαλεῖα (‘महान कार्य’) है; इसलिए यह अनुवाद परमेश्वर की बुद्धि के प्रभावशाली प्रगटीकरणों को व्यक्त करता है।
- source_word: תכן
  choice: सुव्यवस्थित किया है
  rationale: क्रिया में मापने, निर्धारित करने और व्यवस्थित करने के अर्थ आते हैं। यूनानी ἐκόσμησεν भी सजाने अथवा क्रम में रखने का समर्थन करता है।
- source_word: אחד הוא
  choice: वह ... अद्वितीय है
  rationale: शाब्दिक रूप ‘वह एक है’ है। प्रसंग में उसकी अनुपमता और अकेली विशिष्टता पर बल है; ‘अद्वितीय’ आधुनिक हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: מעולם
  choice: अनादिकाल से
  rationale: इब्रानी का अर्थ ‘प्राचीनकाल से’ अथवा ‘अनादिकाल से’ हो सकता है। यूनानी समानांतर ‘युग से पहले और युग तक’ कहकर कालातीत अस्तित्व की ओर संकेत करता है।
- source_word: לא נוסף ולא נאצל
  choice: न उसमें कुछ जोड़ा जाता है, न उससे कुछ घटाया जाता है
  rationale: पहला पद वृद्धि अथवा कुछ जोड़े जाने का निषेध करता है। दूसरा पद कठिन है, पर युग्म का संभावित आशय है कि परमेश्वर में न कुछ जोड़ा जा सकता है, न उससे कुछ कम किया जा सकता है। निष्क्रिय रचना इब्रानी के रूप के निकट रहती है।
- source_word: לכל מבין
  choice: किसी समझदार व्यक्ति की
  rationale: शाब्दिक अर्थ ‘किसी भी समझनेवाले/विवेकी की’ है। ‘समझदार व्यक्ति’ मूल की अस्पष्टता को बनाए रखता है; प्रसंग में ऐसा व्यक्ति सलाहकार की भूमिका निभा सकता है।
theological_decisions:
- issue: אחד הוא में परमेश्वर की एकता अथवा अद्वितीयता
  choice: अद्वितीय है
  alternative: एक है
  rationale: ‘एक है’ अधिक शाब्दिक है, पर हिन्दी में यह केवल संख्या का कथन लग सकता है। प्रसंग परमेश्वर की अनुपमता पर बल देता है; फिर भी पादटिप्पणी शाब्दिक रूप को स्पष्ट करती है और धर्मवैज्ञानिक तनाव को छिपाती नहीं।
- issue: מעולם का कालगत बल
  choice: अनादिकाल से
  alternative: प्राचीनकाल से
  rationale: इब्रानी दोनों अर्थों की अनुमति दे सकता है, किंतु यूनानी समानांतर अस्तित्व को युग से पहले और युग तक फैलाता है। ‘अनादिकाल से’ संयुक्त पाठ-साक्ष्य को संक्षेप में व्यक्त करता है।
- issue: לא נוסף ולא נאצל में परमेश्वर की अपरिवर्तनशीलता
  choice: न उसमें कुछ जोड़ा जाता है, न उससे कुछ घटाया जाता है
  alternative: वह न बढ़ता है, न घटता है
  rationale: चुना हुआ रूप कठिन इब्रानी की निष्क्रिय/additive संरचना के अधिक निकट है और उसे किसी व्यवस्थित धर्मसिद्धान्त की भाषा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘सुव्यवस्थित’, ‘अनादिकाल’ और ‘अद्वितीय’ पाठ की काव्यात्मक तथा धर्मवैज्ञानिक गंभीरता बनाए रखते हैं। कठिन इब्रानी पदों को पादटिप्पणियों में स्पष्ट किया गया है, और हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
