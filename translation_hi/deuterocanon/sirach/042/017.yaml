base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: hi
  text: परमेश्वर के पवित्र जन प्रभु के अद्भुत कामों का पूरा वर्णन नहीं कर सके हैं।[a] परमेश्वर ने अपनी सेनाओं को सामर्थ्य दी है कि वे उसकी महिमा के सामने दृढ़ रहें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसादा-पांडुलिपि में सम्भवतः ‘समझ न सके’ है, जबकि काहिरा गनीज़ा-पाठ में ‘समर्थ न हुए/पर्याप्त न हुए’ है। यूनानी पाठ ‘पूरा वर्णन न कर सके’ वाले अर्थ का समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: 'दूसरे वाक्यांश के इब्रानी साक्ष्यों में भिन्नता है। काहिरा गनीज़ा-पाठ में ‘परमेश्वर ने अपनी सेनाओं को सामर्थ्य दी’ है; मसादा-पाठ में सम्भवतः ‘प्रभु ने अपनी ज्योतियों/दीप्तिमानों में दृढ़ किया’ है। यूनानी में है: ‘जिन्हें सर्वशक्तिमान प्रभु ने स्थापित किया, ताकि सब कुछ उसकी महिमा में दृढ़ किया जाए।’'
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו
  choice: पूरा वर्णन नहीं कर सके हैं
  rationale: मुख्य इब्रानी पाठ में क्षमता या पर्याप्तता की कमी का भाव है। ‘पूरा वर्णन नहीं कर सके’ आधुनिक हिन्दी में इस भाव को स्वाभाविक ढंग से व्यक्त करता है और यूनानी समानांतर के ‘पूरी तरह बयान करना’ वाले अर्थ से भी मेल खाता है।
- source_word: קדושי אל
  choice: परमेश्वर के पवित्र जन
  rationale: यह अभिव्यक्ति पवित्र प्राणियों या जनों—दोनों की सम्भावना खुली रखती है; ‘संत’ से जुड़ी बाद की सांप्रदायिक ध्वनियों से बचती है।
- source_word: לספר נפלאות ה׳
  choice: प्रभु के अद्भुत कामों का पूरा वर्णन
  rationale: לספר का अर्थ बताना या वर्णन करना और נפלאות का अर्थ अद्भुत कार्य या चमत्कार हैं। ‘अद्भुत काम’ दिव्य कृत्यों का भाव स्पष्ट करता है; ‘पूरा’ לא הספיקו के प्रसंगगत आशय को सामने लाता है।
- source_word: אמץ אלהים
  choice: परमेश्वर ने … सामर्थ्य दी है
  rationale: אמץ यहाँ मजबूत करने या दृढ़ करने का भाव देता है। हिन्दी में ‘सामर्थ्य दी’ अगले उद्देश्यवाचक खंड के साथ स्वाभाविक है।
- source_word: צבאיו
  choice: अपनी सेनाओं
  rationale: צבאיו का सामान्य अर्थ ‘उसकी सेनाएँ/दल’ है। यह अनुवाद स्वर्गीय सेनाओं की सम्भावना को बनाए रखता है, पर उसे पाठ से अधिक स्पष्ट नहीं करता।
- source_word: להתחזק לפני כבודו
  choice: कि वे उसकी महिमा के सामने दृढ़ रहें
  rationale: התפעל रूप आत्मदृढ़ता या स्थिर रहने का भाव दे सकता है। ‘दृढ़ रहें’ हिन्दी में स्वाभाविक है और यूनानी समानांतर के स्थिर किए जाने के भाव से भी संगत है।
theological_decisions:
- issue: दोनों खंडों में भिन्न ईश्वरीय उपाधियाँ
  choice: पहले खंड में ‘प्रभु’, दूसरे में ‘परमेश्वर’
  alternative: दोनों खंडों में ‘प्रभु’ अथवा दोनों में ‘परमेश्वर’
  rationale: मुख्य इब्रानी पाठ पहले खंड में יהוה और दूसरे में אלהים रखता है। इन्हें अलग-अलग रखना उपलब्ध मुख्य पाठ का पारदर्शी अनुसरण करता है, जबकि पाठांतर पादटिप्पणी में दिया गया है।
- issue: קדושי אל का संदर्भ
  choice: ‘पवित्र जन’, बिना यह निश्चित किए कि वे मनुष्य हैं या स्वर्गीय प्राणी
  alternative: ‘संत’ या ‘पवित्र स्वर्गदूत’
  rationale: संदर्भ स्वर्गीय प्राणियों की ओर संकेत कर सकता है, पर पद स्वयं पहचान को निर्णायक रूप से सीमित नहीं करता। इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और पाठयोग्य रूप अपनाया गया है। ‘पवित्र जन’ और ‘सेनाएँ’ मूल की सम्भावित व्यापकता बनाए रखते हैं; पाठांतरों को मुख्य पाठ में मिलाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
