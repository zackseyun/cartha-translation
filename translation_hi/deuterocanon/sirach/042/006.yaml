  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
translation:
  language: hi
  text: दुष्ट पत्नी के लिए मुहर लगाना अच्छा है; और जहाँ बहुत-से हाथ पहुँचते हों, वहाँ ताला लगा दो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त इब्रानी पाठ में शाब्दिक रूप से “ढीले” या “निर्बल हाथ” है; यूनानी समानांतर में “बहुत-से हाथ” है। यहाँ यूनानी से समर्थित अर्थ लिया गया है।
    reason: textual_variant
  - marker: b
    text: प्राप्त इब्रानी क्रिया “खोल दो” या “तुम खोलोगे” जैसी दिखती है; यूनानी समानांतर में “बंद कर दो” है। प्रसंग के अनुसार मुख्य पाठ में “ताला लगा दो” रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  choice: दुष्ट पत्नी
  rationale: אשה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। घरेलू प्रबंधन के प्रसंग में ‘पत्नी’ अधिक उपयुक्त है; רעה के नैतिक और व्यवहारगत बल को ‘दुष्ट’ व्यक्त करता है।
- source_word: חותם חסם
  choice: मुहर लगाना अच्छा है
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अस्पष्ट है। यूनानी καλὸν σφραγίς से ‘मुहर ... अच्छी है’ का भाव स्पष्ट होता है; हिन्दी में क्रियात्मक रूप स्वाभाविक है और सुरक्षित बंद करने का आशय रखता है।
- source_word: ומקום
  choice: और जहाँ
  rationale: स्थानसूचक संक्रमण को सरल, स्वाभाविक हिन्दी में व्यक्त किया गया है; यूनानी ὅπου भी इसी अर्थ का समर्थन करता है।
- source_word: ידים רפות
  choice: बहुत-से हाथ पहुँचते हों
  rationale: प्राप्त इब्रानी पाठ का शाब्दिक अर्थ ‘ढीले/निर्बल हाथ’ है, पर यूनानी χεῖρες πολλαί ‘बहुत-से हाथ’ पढ़ता है। वस्तुओं तक अनेक लोगों की पहुँच और उन्हें सुरक्षित रखने वाली कहावत के संदर्भ में यूनानी-साक्ष्य से समर्थित अर्थ मुख्य पाठ में लिया गया है और इब्रानी पाठ-पठन पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תפתח
  choice: ताला लगा दो
  rationale: प्राप्त इब्रानी रूप ‘खोलोगे/खोल दो’ प्रतीत होता है, पर यह प्रसंग से टकराता है; यूनानी κλεῖσον स्पष्ट रूप से ‘बंद कर दो/ताला लगा दो’ कहता है। कहावत के सुरक्षा-संबंधी आशय को देखते हुए समानांतर पाठ का अर्थ अपनाया गया है।
theological_decisions:
- issue: אשה को ‘पत्नी’ या ‘स्त्री’ के रूप में प्रस्तुत करना
  choice: पत्नी
  alternative: स्त्री
  rationale: इब्रानी और यूनानी दोनों शब्द दोनों अर्थ दे सकते हैं। घरेलू-संपत्ति और सुरक्षा के प्रसंग में ‘पत्नी’ कथन को उसके संभावित वैवाहिक संदर्भ तक सीमित रखता है और उसे सभी स्त्रियों के विषय में व्यापक दावा नहीं बनाता। कठिन स्वर को मिटाया नहीं गया है।
- issue: अस्पष्ट इब्रानी के बजाय यूनानी समानांतर से सुरक्षा-संबंधी अर्थ लेना
  choice: ‘बहुत-से हाथ’ और ‘ताला लगा दो’
  alternative: ‘ढीले/निर्बल हाथ’ और ‘खोल दो’
  rationale: इब्रानी शब्दरूपों को पादटिप्पणियों में स्पष्ट रूप से रखा गया है, किंतु उनका संयुक्त शाब्दिक अर्थ कहावत में असंगत प्रतीत होता है। प्राचीन यूनानी समानांतर एक सुसंगत पाठ देता है; अतः मुख्य पाठ में वही लिया गया है, बिना पाठांतर को छिपाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कहावत-जैसी संक्षिप्त हिन्दी। ‘बहुत-से हाथ पहुँचते हों’ साझा पहुँच का भाव स्वाभाविक रूप से स्पष्ट करता है। पाठ के स्त्री-विषयक कठिन स्वर को न तो नरम किया गया है, न ‘स्त्री’ कहकर अनावश्यक रूप से व्यापक बनाया गया है।
