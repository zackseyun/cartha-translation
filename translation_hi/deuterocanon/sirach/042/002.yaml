translation:
  language: hi
  text: परमप्रधान की व्यवस्था और विधि के विषय में[a], और एक ऐसे न्याय के विषय में, जो दुष्ट को धर्मी ठहराता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में “विधि” के स्थान पर “वाचा” है। इब्रानी पाठ यहाँ कुछ संक्षिप्त है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी को “उस व्यक्ति के विषय में जो दुष्ट को धर्मी ठहराता है” भी समझा जा सकता है। “धर्मी ठहराता है” का अर्थ यहाँ न्यायिक रूप से “धर्मी घोषित करता है” या “सही ठहराता है” भी हो सकता है; यूनानी समानांतर में “उस न्याय के विषय में जो अधर्मी को धर्मी ठहराए” है।
    reason: lexical_and_textual_alternative
lexical_decisions:
- source_word: תורת עליון
  choice: परमप्रधान की व्यवस्था
  rationale: תורה का अर्थ ‘शिक्षा’ भी हो सकता है, पर חוק के साथ इस विधिक संदर्भ में ‘व्यवस्था’ स्वाभाविक है; עליון को ‘परमप्रधान’ से व्यक्त किया गया है।
- source_word: חוק
  choice: विधि
  rationale: חוק किसी निर्धारित नियम, विधान या अध्यादेश को दर्शाता है। ‘विधि’ कानूनी भाव बनाए रखते हुए ‘व्यवस्था’ से इसका भेद भी रखती है।
- source_word: מצדיק / להצדיק
  choice: धर्मी ठहराता है
  rationale: צדק के हिफ़ील रूप का यहाँ न्यायालय-संबंधी अर्थ है—किसी को धर्मी या सही घोषित करना। यह अनुवाद मूल की धार्मिक और विधिक प्रतिध्वनि को बिना किसी बाद की विशिष्ट धर्म-सैद्धांतिक व्याख्या थोपे बनाए रखता है।
- source_word: רשע
  choice: दुष्ट
  rationale: רשע न्यायिक और नैतिक संदर्भ में दोषी या दुष्ट व्यक्ति को सूचित करता है; यूनानी ἀσεβῆ भी इसी सामान्य अर्थ का समर्थन करता है।
- source_word: ועל
  choice: के विषय में
  rationale: दोहराया गया על उन विषयों की सूची को आगे बढ़ाता है जिनसे लजाना नहीं चाहिए; ‘के विषय में’ आधुनिक मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: צדק/δικαιόω की न्यायिक भाषा
  choice: दुष्ट को धर्मी ठहराता है
  alternative: दुष्ट को निर्दोष घोषित करता है / दुष्ट को सही ठहराता है
  rationale: ‘धर्मी ठहराता है’ मूल के न्यायिक अर्थ और उसकी धर्म-संबंधी प्रतिध्वनि दोनों को सुरक्षित रखता है। ‘निर्दोष घोषित करता है’ अधिक सहज न्यायालयी हिन्दी है, पर צדק के ‘धर्मी’ पक्ष को कुछ कम कर देता है।
- issue: מצדיק का कर्ता अथवा अमूर्त ‘न्याय’ के रूप में पाठ
  choice: उस न्याय के विषय में जो…
  alternative: उस व्यक्ति के विषय में जो दुष्ट को धर्मी ठहराता है
  rationale: प्राप्त इब्रानी पाठ संक्षिप्त और कुछ असामान्य है; यूनानी समानांतर κρίματος (‘न्याय/निर्णय’) पढ़ता है। मुख्य पाठ में यूनानी से पुष्ट न्यायिक अभिप्राय रखा गया है, जबकि इब्रानी की संभावित कर्तृवाचक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यह पद पिछले वाक्य से जुड़ी विषय-सूची का अंश है, इसलिए आरम्भ में ‘के विषय में’ वाली खंडात्मक संरचना जानबूझकर सुरक्षित रखी गई है।
