  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: hi
  text: जिस किसी स्थान के लिए तुम कुछ नियत करो[a], उसकी गिनती अपने हाथ से रखो; और हर देना-लेना लिखित रूप में हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी वाक्य बहुत संक्षिप्त है। यूनानी समानांतर का अर्थ है, “जो कुछ तुम सौंपो, उसे गिनती और तौल के अनुसार सौंपो; और हर देना और लेना लिखित रूप में हो।” इससे सावधानीपूर्वक और लिखित हिसाब रखने का भाव स्पष्ट होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום תפקד
  choice: जिस किसी स्थान के लिए तुम कुछ ठहराओ
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है। על מקום को स्थान-संबंधी अर्थ में और תפקד को ‘ठहराना/सौंपना’ के व्यापक अर्थ में रखा गया है; ‘कुछ’ हिन्दी में वाक्य को स्वाभाविक बनाता है, जबकि पादटिप्पणी यूनानी समानांतर का अधिक स्पष्ट लेन-देन संबंधी पाठ देती है।
- source_word: יד תספור
  choice: उसका हिसाब अपने हाथ से रखो
  rationale: शाब्दिक चित्र ‘तुम्हारा हाथ गिने’ व्यक्तिगत और सावधान लेखे पर बल देता है। ‘अपने हाथ से’ उस ठोस चित्र को बनाए रखता है और ‘हिसाब रखो’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: ומתת ולקח
  choice: देना-लेना
  rationale: यह युग्म दोनों दिशाओं के लेन-देन को दर्शाता है। संक्षिप्त ‘देना-लेना’ सामान्य, स्वाभाविक और व्यापक है।
- source_word: הכל בכתב
  choice: सब लिखित रूप में हो
  rationale: כתב लिखित अभिलेख या दस्तावेज़ीकरण की माँग करता है। यह रूप मूल की संक्षिप्तता और आदेशात्मक भाव को बनाए रखता है।
