  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
translation:
  language: hi
  text: क्या यूसुफ के समान कोई पुरुष जन्मा था?[a] और उसकी देह की भी सुधि ली गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “पर यूसुफ एक पुरुष बना, अपने भाइयों का अगुआ, प्रजा का सहारा, और उसकी हड्डियों की देखभाल की गई।” यहाँ उपलब्ध इब्रानी पाठ इससे छोटा है और उसके पहले खंड का वाक्य-विन्यास कठिन है; उसे यहाँ प्रश्न के रूप में समझा गया है।'
    reason: alternative_reading
  - marker: b
    text: “उसकी देह की सुधि ली गई” संभवतः बाद में यूसुफ के अवशेषों को आदर देने और उन्हें दफ़नाने की ओर संकेत करता है; निर्गमन 13:19 और यहोशू 24:32 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: यूसुफ के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है—‘के समान/जैसा’। इब्रानी वाक्य संक्षिप्त और कुछ हद तक अध्याहृत है; यह अनुवाद तुलना को यथावत रखता है।
- source_word: אם נולד גבר
  choice: एक पुरुष जन्मा था
  rationale: प्राप्त इब्रानी पाठ कुछ असामान्य और आकस्मिक है। נולד גבר का सीधा अर्थ ‘एक पुरुष जन्मा’ है; इसलिए यूनानी पाठ की विस्तृत प्रशंसा को मुख्य पाठ में जोड़े बिना संक्षिप्त इब्रानी रूप रखा गया है।
- source_word: גבר
  choice: पुरुष
  rationale: גבר में सामर्थ्य या पुरुषत्व का भाव हो सकता है, पर यहाँ सामान्य ‘पुरुष’ पर्याप्त और स्रोत के निकट है; ‘वीर’ या ‘महापुरुष’ कहना अर्थ को अनावश्यक रूप से बढ़ाता।
- source_word: גויתו
  choice: उसकी देह
  rationale: גויה देह, विशेषतः मृत देह, के लिए प्रयुक्त हो सकता है। ‘देह’ इब्रानी शब्द को सुरक्षित रखता है, जबकि यूनानी समानांतर में अधिक विशिष्ट ‘हड्डियाँ’ है।
- source_word: נפקדה
  choice: देखभाल की गई
  rationale: פקד के इस कर्मवाच्य रूप में सुधि लेने, ध्यान देने या देखभाल करने का भाव संभव है। प्रसंग में यह यूसुफ की मृत्यु के बाद उसके अवशेषों के सम्मानपूर्वक दफनाए जाने की ओर संकेत करता है।
theological_decisions:
- issue: संक्षिप्त इब्रानी पाठ और विस्तृत यूनानी समानांतर में से मुख्य पाठ का आधार
  choice: मुख्य पाठ में उपलब्ध इब्रानी शब्दों का अनुवाद किया गया और यूनानी विस्तार को पादटिप्पणी में रखा गया।
  alternative: 'मुख्य पाठ में यूनानी का विस्तृत रूप देना: ‘पर यूसुफ एक पुरुष बना, अपने भाइयों का अगुआ, प्रजा का सहारा, और उसकी हड्डियों की देखभाल की गई।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ उसे प्राथमिकता देना उचित है। यूनानी समानांतर अर्थ और पाठ-परंपरा का महत्वपूर्ण साक्ष्य है, पर उसकी अतिरिक्त प्रशंसात्मक पंक्तियाँ इब्रानी मुख्य पाठ में चुपचाप नहीं जोड़ी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली रखी गई है। ‘देह’ मूल के निकट तथा सम्मानसूचक है; ‘देखभाल की गई’ פקד के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
