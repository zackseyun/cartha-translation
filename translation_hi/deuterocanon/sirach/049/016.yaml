  text: Shem and Seth were honored, and above every living thing was Adam’s glory.
translation:
  language: hi
  text: शेम, शेत और एनोश[a] का आदर के साथ स्मरण किया गया, और उनकी महिमा हर जीवित प्राणी से बढ़कर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में एनोश का नाम नहीं है और दूसरे वाक्य में आदम का उल्लेख है। यहाँ इब्रानी पाठ के अनुसार एनोश और “उनकी महिमा” का अनुवाद किया गया है।
    reason: इब्रानी और यूनानी पाठों के बीच के महत्वपूर्ण भेद को पारदर्शी रखता है, बिना यूनानी पाठ के आधार पर इब्रानी मुख्य पाठ में आदम को जोड़ने के।
lexical_decisions:
- source_word: נפקדו
  choice: आदर के साथ स्मरण किए गए
  rationale: निफ़अल रूप का मूल भाव ‘स्मरण किया जाना/गिना जाना’ है; प्रसंग में यह सम्मानपूर्ण स्मरण को व्यक्त करता है, इसलिए केवल ‘सम्मानित हुए’ की अपेक्षा स्रोत का स्मरण-वाला भाव भी रखा गया है।
- source_word: כל חי
  choice: हर जीवित प्राणी
  rationale: इब्रानी पद का स्वाभाविक और व्यापक अर्थ ‘हर जीवित प्राणी’ है।
- source_word: תפארת
  choice: महिमा
  rationale: यह शब्द वैभव, गौरव या महिमा का बोध कराता है; यहाँ व्यक्तियों की विशिष्ट प्रतिष्ठा के संदर्भ में ‘महिमा’ उपयुक्त है।
theological_decisions:
- issue: इब्रानी में एनोश का समावेश
  choice: शेम, शेत और एनोश
  alternative: शेम और शेत
  rationale: प्रस्तुत उच्च-विश्वसनीयता वाले इब्रानी पाठ में ואנוש स्पष्ट रूप से है, यद्यपि यूनानी समानांतर और अंग्रेज़ी परामर्श-पाठ में एनोश नहीं है। मूल-भाषा साक्ष्य को प्राथमिकता देते हुए नाम बनाए रखा गया है।
- issue: अंतिम पद में आदम का उल्लेख
  choice: आदम की महिमा
  alternative: उनके लोगों की महिमा / उनके साथ महिमा
  rationale: प्रस्तुत इब्रानी व्यंजन-पाठ का अंतिम शब्द עמם कठिन है, पर प्रसंग तथा यूनानी समानांतर स्पष्ट रूप से आदम का समर्थन करते हैं। पाठगत अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली अपनाई गई है। तीनों नामों को प्रचलित हिन्दी बाइबिलीय रूप में रखा गया है और इब्रानी की सम्मानपूर्ण स्मृति तथा तुलनात्मक महिमा—दोनों भाव सुरक्षित रखे गए हैं।
