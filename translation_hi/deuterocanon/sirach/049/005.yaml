  text: And they gave their horn backward[b][a], and their glory to a foolish foreign nation.
translation:
  language: hi
  text: और उन्होंने अपना सींग[b] दूसरों को[a] दे दिया, और अपनी महिमा एक मूर्ख विदेशी राष्ट्र को दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू पाठ में यहाँ एक असामान्य शब्द है, जिसका शाब्दिक अर्थ ‘पीछे की ओर’ हो सकता है, और क्रिया एकवचन है (‘उसने दिया’)। यूनानी समानांतर पढ़ता है: ‘उन्होंने अपना सींग दूसरों को दे दिया।’'
    reason: textual_variant
  - marker: b
    text: '‘सींग’ सामर्थ्य या प्रभुत्व का रूपक है; वैकल्पिक अनुवाद: ‘उनकी शक्ति।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: और उसने…दे दी
  rationale: हिब्रू रूप एकवचन पुल्लिंग है, अर्थात् ‘और उसने दिया।’ कर्ता इस पद में स्पष्ट नहीं है, इसलिए अनुवाद में भी उसकी पहचान नहीं जोड़ी गई।
- source_word: קרנם
  choice: उनका सींग
  rationale: קֶרֶן का शाब्दिक अर्थ ‘सींग’ है और यहाँ यह सामर्थ्य या प्रभुत्व का बाइबिलीय रूपक है। यूनानी κέρας भी इसी रूपक की पुष्टि करता है।
- source_word: לאחור
  choice: पीछे कर दिया
  rationale: प्राप्त हिब्रू पाठ का स्वाभाविक शाब्दिक अर्थ ‘पीछे’ है, यद्यपि इस स्थान पर उसका प्रयोग असामान्य है। मुख्य पाठ हिब्रू को दर्शाता है और यूनानी के ‘दूसरों को’ पाठ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: כבודם
  choice: उनकी महिमा
  rationale: כָּבוֹד सम्मान, वैभव या महिमा को व्यक्त कर सकता है। ‘महिमा’ काव्यात्मक गरिमा बनाए रखती है और यूनानी δόξα से भी मेल खाती है।
- source_word: גוי נבל נכרי
  choice: एक मूर्ख विदेशी जाति
  rationale: גוי सामूहिक राष्ट्र या जाति को, נבל नैतिक अर्थवाली मूर्खता को, और נכרי विदेशीपन को व्यक्त करता है। यह संयोजन मूल के कठोर मूल्यांकन को बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: ‘सींग’ का सामर्थ्य-संबंधी रूपक
  choice: रूपक को मुख्य पाठ में ‘सींग’ के रूप में बनाए रखा गया।
  alternative: उनकी शक्ति / उनका सामर्थ्य
  rationale: मूल हिब्रू और यूनानी दोनों सींग की छवि रखते हैं। इसे केवल ‘शक्ति’ कहने से काव्यात्मक और बाइबिलीय रूपक समतल हो जाता।
- issue: לאחור का पाठगत असामान्यपन
  choice: मुख्य पाठ में हिब्रू के अनुसार ‘पीछे’ रखा गया और यूनानी पाठ पादटिप्पणी में दिया गया।
  alternative: उन्होंने अपना सींग दूसरों को दे दिया
  rationale: हिब्रू साक्ष्य उच्च विश्वसनीयता के साथ उपलब्ध है, पर यह अभिव्यक्ति असामान्य है; यूनानी समानांतर ‘दूसरों को’ पढ़ता है और क्रिया को बहुवचन करता है। किसी एक साक्ष्य से तनाव मिटाने के बजाय दोनों को स्पष्ट रूप से प्रस्तुत किया गया।
- issue: वचन में कर्ता की पहचान
  choice: हिब्रू के एकवचन ‘उसने’ को रखा गया, पर कर्ता की पहचान नहीं बताई गई।
  alternative: उन्होंने
  rationale: हिब्रू ויתן एकवचन है, जबकि यूनानी ἔδωκαν बहुवचन है। मुख्य पाठ में हिब्रू को प्राथमिकता देना और अंतर को पादटिप्पणी में बताना वास्तविक पाठगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर पद की काव्यात्मक गरिमा और संक्षिप्त समानांतर रचना बनाए रखी गई है। ‘विदेशी जाति’ सामान्य पाठक के लिए बोधगम्य है और ‘सींग’ के कठिन रूपक को पादटिप्पणी द्वारा स्पष्ट किया गया है।
