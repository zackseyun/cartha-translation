base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/002.yaml
  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
translation:
  language: hi
  text: क्योंकि उसने हमारे भटक जाने पर हम पर दया की,[a] और व्यर्थता की घिनौनी बातों को दूर कर दिया।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर के अधिक निकट अर्थ हो सकता है: “लोगों के लौटने में वह सफल हुआ,” या “लोगों के मन फिराने के समय उसका मार्ग प्रशस्त हुआ।” इब्रानी में “हमारा भटक जाना” है, जबकि यूनानी में अधिक सकारात्मक “लौटना/मन फिराना” पाया जाता है।'
    reason: alternative_reading
  - marker: b
    text: “व्यर्थता की घिनौनी बातें” सम्भवतः मूर्तिपूजा से जुड़ी घिनौनी वस्तुओं या प्रथाओं की ओर संकेत करती हैं; इब्रानी में “व्यर्थता” मूर्तियों के लिए तिरस्कारपूर्ण शब्द भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी समानांतर में “अधर्म की घिनौनी बातें” हैं, जो इब्रानी “व्यर्थता की घिनौनी बातों” से भिन्न है।
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: हम पर दया की
  rationale: इब्रानी रूप कठिन है और इसके अर्थ पर अनिश्चितता है। प्रसंग योशियाह के सुधारों का है; इसलिए यह अनुवाद लोगों की दशा के प्रति उसकी करुणापूर्ण प्रतिक्रिया व्यक्त करता है, पर किसी अधिक अटकलपूर्ण पुनर्निर्माण को निश्चित नहीं बनाता।
- source_word: על משובתינו
  choice: हमारे भटक जाने पर
  rationale: משובה सामान्यतः विमुख होने, पीछे हटने या धर्मत्याग की ओर संकेत करता है और प्रत्यय प्रथम पुरुष बहुवचन है। ‘हमारे भटक जाने’ से नकारात्मक इब्रानी अर्थ स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: וישבת
  choice: दूर कर दिया
  rationale: यह क्रिया यहाँ आपत्तिजनक वस्तुओं या प्रथाओं को समाप्त करने अथवा हटाने का भाव देती है। ‘दूर कर दिया’ हिन्दी में सहज है और कर्म के अनुकूल है।
- source_word: תועבות
  choice: घिनौनी बातें
  rationale: शब्द में धार्मिक और नैतिक रूप से अत्यन्त घृणित वस्तुओं या प्रथाओं का प्रबल भाव है। ‘घिनौनी बातें’ सामान्य पाठक के लिए स्पष्ट है और केवल भौतिक वस्तुओं तक अर्थ सीमित नहीं करता।
- source_word: הבל
  choice: व्यर्थता
  rationale: הבל का मूल भाव भाप, शून्यता, व्यर्थता या निस्सारता है और यह मूर्तियों के लिए तिरस्कारपूर्ण संकेत भी हो सकता है। ‘व्यर्थता’ स्रोत की रूपकात्मक व्यापकता बनाए रखती है; ‘मूर्तियाँ’ जैसा संकुचन मुख्य पाठ में नहीं किया गया।
theological_decisions:
- issue: क्या משובה को यूनानी ἐπιστροφή के अनुसार सकारात्मक ‘लौटना/मन फिराना’ माना जाए
  choice: मुख्य पाठ में इब्रानी-आधारित नकारात्मक अर्थ ‘हमारे भटक जाने’ को रखा गया
  alternative: ‘लोगों के लौटने में उसने उन्हें सही मार्ग दिखाया’ अथवा ‘लोगों के मन फिराने में’
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है, जबकि यूनानी पाठ की सकारात्मक ‘वापसी’ वाली समझ को पाठांतर के रूप में सुरक्षित रखा गया है। इससे वास्तविक पाठगत और धर्मवैचारिक तनाव मिटाया नहीं जाता।
- issue: क्या הבל का अर्थ स्पष्ट रूप से ‘मूर्तियाँ’ किया जाए
  choice: ‘व्यर्थता’
  alternative: ‘मूर्तियों’ या ‘निकम्मी वस्तुओं’
  rationale: मूर्तिपूजा-विरोधी संकेत सम्भावित है, पर इब्रानी शब्द स्वयं अधिक व्यापक और रूपकात्मक है। इसलिए मुख्य पाठ स्रोत की छवि बनाए रखता है।
- issue: यूनानी ἀνομίας को मुख्य पाठ में लिया जाए या नहीं
  choice: इब्रानी הבל के अनुसार ‘व्यर्थता’ रखा गया
  alternative: ‘अधर्म की घिनौनी बातों’
  rationale: यूनानी समानांतर ‘अधर्म’ पढ़ता है, पर उपलब्ध इब्रानी ‘व्यर्थता’ है। पाठांतर को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। कठिन इब्रानी נחל को प्रवाहपूर्ण ढंग से व्यक्त करते हुए उसकी अनिश्चितता टिप्पणी में स्वीकार की गई है। मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है और यूनानी भिन्नताओं को पादटिप्पणियों में सुरक्षित रखता है।
