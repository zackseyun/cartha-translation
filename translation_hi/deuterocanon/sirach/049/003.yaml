  text: He directed his heart to God[b][a], and in days of violence he showed loyalty.
translation:
  language: hi
  text: उसने अपना हृदय परमेश्वर की ओर लगाया[a], और हिंसा के दिनों में निष्ठा दिखाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “परमेश्वर की ओर” के स्थान पर “प्रभु की ओर” है।
    reason: alternative_reading
  - marker: b
    text: या “दयालुता दिखाई”; यूनानी इस वाक्यांश को अधिक स्पष्ट रूप से “भक्ति में दृढ़ रहा” कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם ... לבו
  choice: उसने अपना हृदय ... की ओर लगाया
  rationale: संयुक्त इब्रानी पाठ में क्रिया का रूप कुछ अनिश्चित है, पर यूनानी κατεύθυνεν (‘सीधा किया/लगाया’) इस अर्थ का समर्थन करता है कि उसने अपने हृदय को परमेश्वर की ओर उन्मुख किया। यह हिन्दी में स्वाभाविक है और ‘हृदय’ की बाइबलीय छवि बनाए रखता है।
- source_word: אל אל
  choice: परमेश्वर की ओर
  rationale: इब्रानी में ‘परमेश्वर की ओर’ है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है; यूनानी का ‘प्रभु की ओर’ पादटिप्पणी में दिया गया है।
- source_word: לבו
  choice: अपना हृदय
  rationale: ‘हृदय’ मनुष्य के भीतरी संकल्प और रुझान के लिए प्रचलित बाइबलीय शब्द है; इसे केवल ‘मन’ बनाकर इसका अर्थ संकुचित नहीं किया गया।
- source_word: ובימי חמס
  choice: हिंसा के दिनों में
  rationale: חמס हिंसा, अन्याय या दुष्टता का बोध करा सकता है। ‘हिंसा के दिनों में’ इब्रानी के सामाजिक और नैतिक बल को स्पष्ट तथा संक्षिप्त रूप में बनाए रखता है।
- source_word: עשה חסד
  choice: निष्ठा दिखाई
  rationale: חסד में कृपा, भलाई और अटल निष्ठा के परस्पर जुड़े अर्थ हैं। ‘निष्ठा दिखाई’ प्रसंग में स्वाभाविक है, पर यह तय नहीं करता कि निष्ठा केवल परमेश्वर के प्रति थी या लोगों के प्रति दयालु आचरण में भी प्रकट हुई।
theological_decisions:
- issue: अंतिम वाक्यांश को पारस्परिक दया मानें या परमेश्वर के प्रति भक्ति
  choice: निष्ठा दिखाई
  alternative: दयालुता दिखाई; भक्ति को दृढ़ किया
  rationale: इब्रानी עשה חסד का शाब्दिक भाव ‘חסד किया’ है, जो दयालुता या निष्ठा दोनों व्यक्त कर सकता है; यूनानी इसे अधिक स्पष्ट धार्मिक अर्थ में ‘भक्ति को दृढ़ किया’ कहता है। मुख्य पाठ ‘निष्ठा’ द्वारा इस तनाव को खुला रखता है और यूनानी की व्याख्या को पादटिप्पणी में दर्ज करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘हृदय’ और ‘निष्ठा’ जैसे बाइबलीय तथा नैतिक शब्दों को बनाए रखते हुए पाठ-साक्ष्यों के बीच का अंतर पादटिप्पणियों में सुरक्षित रखा गया है।
