base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: hi
  text: दाऊद, हिजकिय्याह और योशिय्याह को छोड़कर बाकी सभी ने भ्रष्ट आचरण किया; यहूदा के राजाओं ने परमप्रधान की व्यवस्था को त्याग दिया, यहाँ तक कि उनका अंत हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अंतिम पद बहुत संक्षिप्त है—शाब्दिक रूप से, ‘समाप्ति/अंत तक।’ यूनानी में इसका अर्थ ‘यहूदा के राजाओं का अंत हो गया’ या ‘वे विफल हो गए’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: को छोड़कर
  rationale: दोनों स्रोतों में अपवाद का भाव है; आधुनिक हिन्दी में यह तीन धर्मनिष्ठ राजाओं को सामान्य निन्दा से स्पष्ट रूप से अलग करता है।
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: भ्रष्ट आचरण किया
  rationale: इब्रानी मूल भ्रष्ट करने या बिगाड़ने का भाव रखता है, जबकि यूनानी अपराध करने का; चुना हुआ अनुवाद नैतिक दोष को बनाए रखते हुए किसी एक प्रकार के पाप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ויעזבו / κατέλιπον
  choice: त्याग दिया
  rationale: यह जानबूझकर परमप्रधान की व्यवस्था से विमुख होने का दोषपूर्ण भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: परमप्रधान की व्यवस्था
  rationale: राजकीय और वाचागत सन्दर्भ में תורה तथा यूनानी νόμος के लिए 'व्यवस्था' उपयुक्त है; 'परमप्रधान' ईश्वरीय उपाधि को सुरक्षित रखता है।
- source_word: מלכי יהודה
  choice: यहूदा के राजा
  rationale: यह ऐतिहासिक अभिधान का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: עד תמם / ἐξέλιπον
  choice: और अन्ततः उनका अन्त हो गया
  rationale: इब्रानी पद अत्यन्त संक्षिप्त है और यूनानी राजाओं के समाप्त हो जाने या विफल होने का भाव देता है। यह रूप परिणाम को व्यक्त करता है, पर उसके ठीक स्वरूप को निश्चित नहीं करता।
theological_decisions:
- issue: עד תמם की संक्षिप्त अन्तिम उक्ति और यूनानी ἐξέλιπον का सम्बन्ध
  choice: 'इसे राजाओं के व्यवस्था त्यागने के परिणाम के रूप में अनूदित किया गया है: ''और अन्ततः उनका अन्त हो गया।'''
  alternative: '''यहूदा के राजा मिट गए/विफल हो गए'' को अलग स्वतंत्र उपवाक्य मानना; अथवा अधिक शब्दशः ''उनके समाप्त होने तक'' कहना।'
  rationale: इब्रानी की अस्पष्ट संक्षिप्तता और यूनानी की व्याख्यात्मक समानता, दोनों का ध्यान रखते हुए यह अनुवाद चेतावनीपूर्ण परिणाम बनाए रखता है, किन्तु यह निर्धारित नहीं करता कि 'अन्त' से मृत्यु, राजवंश का लोप, या राज्य का पतन अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय पर सामान्य पाठक के लिए सहज। राजाओं के नाम प्रचलित हिन्दी बाइबलीय रूपों में रखे गए हैं। मुख्य पाठ में इब्रानी को प्राथमिकता दी गई है और अस्पष्ट अन्तिम पद के लिए यूनानी समानान्तर को सहायक साक्ष्य माना गया है।
