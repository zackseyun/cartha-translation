  yaml_path: translation/deuterocanon/sirach/049/011.yaml
  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: hi
  text: हम जरुब्बाबेल की प्रशंसा कैसे करें?[a] वह दाहिने हाथ पर मुहर-अँगूठी के समान था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम जरुब्बाबेल को कितना महान बताएँ?” यूनानी समानांतर पाठ में “महान बताएँ” का भाव है, जबकि इब्रानी शब्द “प्रशंसा करें” या “गुणगान करें” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाहिने हाथ पर एक मुहर के समान” या “मुहर-अँगूठी के समान।” यह बिंब सम्मान और विशेष महत्त्व का संकेत देता जान पड़ता है; हाग्गै 2:23 में मुहर-अँगूठी के बिंब की तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: हम ... की प्रशंसा कैसे करें?
  rationale: इब्रानी प्रश्नवाचक शब्द और इच्छार्थक रूप मिलकर अलंकारिक प्रशंसा व्यक्त करते हैं। यह अनुवाद प्रश्न का रूप और उसमें निहित आदर दोनों बनाए रखता है; यूनानी समानांतर पाठ का μεγαλύνωμεν अर्थ को ‘महान बताएँ’ की ओर भी खोलता है।
- source_word: זרבבל
  choice: जरुब्बाबेल
  rationale: व्यक्तिनाम को आधुनिक हिन्दी बाइबलीय प्रचलन के अनुरूप लिप्यंतरित किया गया है।
- source_word: על יד ימין
  choice: दाहिने हाथ की
  rationale: इब्रानी पदबंध का अर्थ दाहिना हाथ है, जिसकी पुष्टि यूनानी ἐπὶ δεξιᾶς χειρός से होती है। अँगूठी के साथ हिन्दी में ‘दाहिने हाथ की’ स्वाभाविक है और स्थान-संबंधी बिंब को बनाए रखता है।
- source_word: כחותם
  choice: मुहरदार अँगूठी के समान
  rationale: חותם मुहर अथवा मुहर लगाने वाली अँगूठी को दर्शा सकता है। हाथ के प्रसंग में ‘मुहरदार अँगूठी’ मूर्त और स्वाभाविक हिन्दी है तथा केवल अमूर्त ‘मुहर’ कहने से अधिक स्पष्ट रूप से मूल बिंब को पहुँचाती है।
theological_decisions:
- issue: जरुब्बाबेल की तुलना दाहिने हाथ की मुहर से
  choice: रूपक को सीधे ‘दाहिने हाथ की मुहरदार अँगूठी’ के रूप में रखा गया है।
  alternative: ‘वह दाहिने हाथ पर एक मुहर के समान था।’
  rationale: यह बिंब सम्मान, चुनाव और बहुमूल्यता का संकेत दे सकता है और हाग्गै 2:23 की स्मृति जगाता है, पर पद स्वयं इन अर्थों की व्याख्या नहीं करता। इसलिए मुख्य पाठ में रूपक को बिना धर्मवैज्ञानिक विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। अलंकारिक प्रश्न और मुहरदार अँगूठी का मूल बिंब ज्यों का त्यों रखा गया है; व्याख्यात्मक अर्थ मुख्य पाठ में नहीं जोड़े गए।
