base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: hi
  text: और बारह नबियों की हड्डियाँ जहाँ पड़ी हैं, वहीं से फिर फलें-फूलें[a]। उन्होंने याकूब को चंगा किया[b] और विश्वासपूर्ण आशा में उसे ऊँचा उठाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद कठिन है; उसका शाब्दिक अर्थ लगभग ‘उनके नीचे से’ है। यूनानी पाठ में है, ‘उनके स्थान से।’
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में ‘याकूब को सांत्वना दी’ है; इब्रानी में ‘याकूब को चंगा किया’ है।
    reason: alternative_reading
  - marker: c
    text: अंतिम पंक्ति के पाठों में अंतर है। इब्रानी का अर्थ ‘विश्वासपूर्ण आशा में उसे ऊँचा उठाया’ हो सकता है; यूनानी में है, ‘आशा के विश्वास में उन्हें छुड़ाया।’
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  choice: बारह नबी
  rationale: दोनों साक्षी शाब्दिक रूप से ‘बारह नबियों’ को कहते हैं। बाद का प्रचलित पद ‘छोटे नबी’ मूल में नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: עצמתם / τὰ ὀστᾶ
  choice: उनकी हड्डियाँ
  rationale: इब्रानी और यूनानी दोनों में ठोस अर्थ ‘हड्डियाँ’ है; ‘अवशेष’ कहने से मूल बिंब मंद पड़ जाता।
- source_word: פרחת / ἀναθάλοι
  choice: फिर फलें-फूलें
  rationale: दोनों पाठ अंकुरित होने या पुनः पुष्पित होने का बिंब देते हैं। ‘फिर फलें-फूलें’ हिन्दी में स्वाभाविक है और पुनर्जीवित सम्मान का भाव बनाए रखता है।
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  choice: जहाँ पड़ी हैं, वहीं से
  rationale: इब्रानी पद कठिन है और शाब्दिक रूप से ‘उनके नीचे से’ जैसा है; यूनानी में ‘उनके स्थान से’ है। दफ़न-संदर्भ में यह चयन अर्थ को स्वाभाविक रखता है, जबकि पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: החלימו / παρεκάλεσεν
  choice: चंगा किया
  rationale: इब्रानी क्रिया का सामान्य अर्थ ‘चंगा करना/स्वस्थ करना’ है। यूनानी का ‘सांत्वना दी’ वाला पाठ महत्त्वपूर्ण विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: יעקב
  choice: याकूब
  rationale: मूल में व्यक्तिवाचक नाम ‘याकूब’ है, यद्यपि यहाँ उससे सामूहिक रूप से इस्राएल की प्रजा भी अभिप्रेत हो सकती है।
- source_word: וישגבהו
  choice: उसे ऊँचा उठाया
  rationale: प्रस्तुत इब्रानी पाठ की क्रिया और एकवचन कर्मवाचक प्रत्यय का सीधा प्रतिनिधित्व करता है। यूनानी का ‘उन्हें छुड़ाया’ भिन्न पाठ है और पादटिप्पणी में रखा गया है।
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  choice: विश्वासपूर्ण आशा में
  rationale: यह संक्षिप्त और कुछ हद तक अस्पष्ट संबंध विश्वास/विश्वासयोग्यता और आशा को निकटता से जोड़ता है। हिन्दी अभिव्यक्ति इस संबंध को सहज बनाती है, पर उसे ‘विश्वास और आशा’ जैसे दो अलग गुणों में नहीं बाँटती।
theological_decisions:
- issue: महत्त्वपूर्ण इब्रानी-यूनानी भिन्नता के बीच आधार-पाठ का चयन
  choice: 'जहाँ इब्रानी उपलब्ध है वहाँ मुख्य पाठ को इब्रानी-प्रधान रखा गया: ‘चंगा किया’ और ‘उसे ऊँचा उठाया।’'
  alternative: 'यूनानी के अनुसार: ‘याकूब को सांत्वना दी और आशा के विश्वास में उन्हें छुड़ाया।’'
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिकता देना उचित है। फिर भी यूनानी पाठ वास्तविक और अर्थपूर्ण भिन्नता दिखाता है, इसलिए उसे चुपचाप मिलाने के बजाय पादटिप्पणियों में स्पष्ट रखा गया है।
- issue: याकूब का एकवचन और सामूहिक अर्थ
  choice: इब्रानी के एकवचन ‘उसे’ को बनाए रखा गया।
  alternative: यूनानी बहुवचन ‘उन्हें’ लेकर याकूब को इस्राएल की प्रजा का सामूहिक नाम समझा जा सकता है।
  rationale: मुख्य पाठ इब्रानी व्याकरण को दर्शाता है, जबकि सामूहिक अर्थ और यूनानी बहुवचन की संभावना पादटिप्पणी में सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पाठयोग्य रूप अपनाया गया है। ‘छोटे नबी’ जैसे बाद के तकनीकी पद से बचते हुए मूल का ‘बारह नबी’ रखा गया है। काव्यात्मक हड्डियों के फलने-फूलने का बिंब सुरक्षित है और साक्षियों की वास्तविक असहमति पादटिप्पणियों में स्पष्ट की गई है।
