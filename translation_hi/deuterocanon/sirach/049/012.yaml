base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: hi
  text: 'इसी प्रकार, यहोसादाक का पुत्र यहोशूआ[a]: उनके दिनों में उन्होंने एक पवित्र मन्दिर ऊँचा उठाया, जो चिरस्थायी महिमा के लिए स्थापित किया गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू संस्करण में नाम के बाद कोष्ठकों में यह पाठ भी दिया गया है: ‘जिसने संकट में एक वेदी खड़ी की।’ यह उपवाक्य पाठगत रूप से अनिश्चित है और यूनानी समानांतर में नहीं मिलता।'
    reason: textual_variant
lexical_decisions:
- source_word: גם יהושע בן יהוצדק
  choice: इसी प्रकार यहोसादाक के पुत्र यहोशू ने भी
  rationale: גם इस स्मरण-क्रम में एक और आदरणीय व्यक्ति को जोड़ता है। हिन्दी में ‘इसी प्रकार … भी’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है। नामों को हिब्रू रूप के निकट रखा गया है।
- source_word: אשר במצוק הקימו מזבח
  choice: संकट के समय एक वेदी खड़ी की
  rationale: מצוק यहाँ तंगी या संकट की दशा बताता है; הקימו का मूल भाव किसी वस्तु को खड़ा या स्थापित करना है। यह पूरा उपवाक्य हिब्रू संस्करण में कोष्ठकबद्ध और पाठगत रूप से अनिश्चित है, इसलिए उसकी स्थिति पादटिप्पणी में स्पष्ट की गई है।
- source_word: וירימו
  choice: उन्होंने … ऊँचा उठाया
  rationale: क्रिया का शाब्दिक भाव ‘उठाना/ऊँचा करना’ है। मन्दिर के संदर्भ में यह निर्माण का संकेत देता है, पर अनुवाद मूल की ऊर्ध्वगामी छवि को भी बनाए रखता है।
- source_word: היכל קדש
  choice: एक पवित्र मन्दिर
  rationale: היכל का संदर्भगत अर्थ ‘मन्दिर’ है और קדש उसकी पवित्रता बताता है। हिब्रू में निश्चित उपपद न होने के कारण ‘एक’ उपयुक्त है।
- source_word: ומכונן
  choice: जो … दृढ़ता से स्थापित था
  rationale: यह रूप किसी ऐसी वस्तु की दशा बताता है जिसे स्थिर या सुदृढ़ रूप से कायम किया गया हो। यह हिन्दी में मन्दिर से स्पष्ट रूप से जुड़ता है और टिकाऊ स्थापना का भाव बचाता है।
- source_word: לכבוד עולם
  choice: सदा की महिमा के लिए
  rationale: כבוד को ‘महिमा’ और עולם को प्रसंगानुसार निरन्तर या चिरस्थायी अवधि के रूप में प्रस्तुत किया गया है। यह गरिमापूर्ण होने के साथ सामान्य हिन्दी में बोधगम्य है।
theological_decisions:
- issue: वेदी वाले कोष्ठकबद्ध हिब्रू उपवाक्य की पाठगत स्थिति
  choice: उपवाक्य को मुख्य पाठ में रखा गया है, पर [a] द्वारा उसकी अनिश्चित स्थिति स्पष्ट की गई है।
  alternative: उपवाक्य को मुख्य पाठ से हटाकर केवल पादटिप्पणी में देना।
  rationale: यह उपवाक्य उपलब्ध हिब्रू संस्करण में सुरक्षित है, यद्यपि संपादकीय कोष्ठकों में है; यूनानी समानांतर में यह नहीं मिलता। इसे चुपचाप हटाने के बजाय पाठ में रखते हुए उसकी अनिश्चितता बताना वास्तविक पाठगत तनाव को पारदर्शी रूप से सुरक्षित रखता है।
- issue: हिब्रू बहुवचन क्रिया וירימו का कर्ता
  choice: ‘उन्होंने’ के द्वारा बहुवचन को बनाए रखा गया है।
  alternative: यहोशू को एकवचन कर्ता मानकर ‘उसने’ करना।
  rationale: प्राप्त हिब्रू पाठ में क्रिया बहुवचन है और यूनानी समानांतर भी बहुवचन समूह की ओर संकेत करता है। इसलिए कर्ता को कृत्रिम रूप से एकवचन नहीं बनाया गया।
- issue: מכונן का सम्बन्ध और वाच्य
  choice: इसे मन्दिर से संबंधित परिणामकारी निष्क्रिय दशा—‘दृढ़ता से स्थापित था’—के रूप में व्यक्त किया गया है।
  alternative: इसे स्वतंत्र सक्रिय क्रिया ‘उन्होंने स्थापित किया’ के रूप में पढ़ना।
  rationale: हिब्रू रूप स्थापित या सुदृढ़ अवस्था का संकेत देता है; यूनानी का ‘तैयार किया हुआ’ भी परिणामकारी दशा का समर्थन करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मन्दिर’, ‘वेदी’, ‘महिमा’ और ‘स्थापित’ जैसे परिचित धार्मिक शब्द प्रयुक्त हुए हैं। बहुवचन ‘उन्होंने’ मूल हिब्रू की व्याकरणिक अस्पष्टता को बिना कृत्रिम समाधान के बनाए रखता है।
