base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: hi
  text: योशियाह का नाम सुगंध-द्रव्यों से मिले हुए धूप के समान है[a], जो सुगंध बनाने वाले की कारीगरी से तैयार की गई है; उसकी स्मृति तालू को मधु के समान मीठी लगती है, और दाखमधु की दावत में संगीत के समान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “योशियाह की स्मृति उस मिश्रित धूप के समान है, जिसे सुगंध बनाने वाले ने तैयार किया है; हर मुख में वह मधु के समान मीठी होगी, और दाखमधु की दावत में संगीत के समान।” इब्रानी पाठ पहले खंड में “नाम” पर बल देता है, जबकि यूनानी “स्मृति” पर।'
    reason: alternative_reading
  - marker: b
    text: या “दाखमधु की दावत में गीत के समान।” इब्रानी शब्द מזמור का अर्थ “गीत” भी हो सकता है; यूनानी समानांतर पाठ व्यापक अर्थ में “संगीत” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: नाम
  rationale: इब्रानी शब्द का सामान्य और प्रत्यक्ष अर्थ ‘नाम’ है। यूनानी पाठ में ‘स्मृति’ है, किंतु यहाँ प्राथमिक इब्रानी साक्ष्य को मुख्य पाठ में रखा गया है; अगले खंड का ‘उसकी स्मृति’ याद की गई ख्याति का भाव स्पष्ट करता है।
- source_word: כקטורת סמים
  choice: सुगंध-द्रव्यों से मिले हुए धूप के समान
  rationale: קטורת का अर्थ धूप और סמים का अर्थ सुगंधित द्रव्य/मसाले हैं। यह अनुवाद मिश्रित सुगंधित धूप का चित्र सुरक्षित रखता है और यूनानी σύνθεσιν θυμιάματος से भी मेल खाता है।
- source_word: וממלה מעשה רוקח
  choice: जिसे सुगंध बनानेवाले ने तैयार किया हो
  rationale: इब्रानी रूप וממלה कठिन है, पर מעשה רוקח और यूनानी ἐσκευασμένον के संदर्भ में तैयार या मिश्रित किए जाने का भाव है। यह हिंदी में स्वाभाविक ढंग से उस धूप को कुशल कारीगर द्वारा तैयार वस्तु बताता है।
- source_word: בחך
  choice: तालू को
  rationale: חך का शाब्दिक अर्थ ‘तालू’ है। इसे बनाए रखने से इब्रानी का स्वाद-संबंधी चित्र अधिक सटीक रहता है; यूनानी का ‘हर मुख में’ पाठांतर पादटिप्पणी में दिया गया है।
- source_word: כדבש ימתיק זכרו
  choice: उसकी स्मृति ... मधु के समान मीठी लगती है
  rationale: זכרו ‘उसकी स्मृति’ है और ימתיק यहाँ सूक्तिपरक/वर्णनात्मक भाव में मिठास प्रकट करता है। ‘मीठी लगती है’ आधुनिक हिंदी में स्वाद के रूपक को स्वाभाविक रखता है, बिना अनावश्यक भविष्यकाल थोपे।
- source_word: וכמזמור
  choice: संगीत के समान
  rationale: מזמור गीत या वाद्य-संगत गीत हो सकता है, जबकि यूनानी μουσικά व्यापक रूप से संगीत को दर्शाता है। भोज के उत्सवी संदर्भ में ‘संगीत’ दोनों साक्ष्यों के अर्थ-क्षेत्र को समेटता है; ‘गीत’ विकल्प पादटिप्पणी में रखा गया है।
- source_word: על משתה היין
  choice: दाखमधु के भोज में
  rationale: משתה भोज/दावत है और היין दाखमधु को निर्दिष्ट करता है। यह अभिव्यक्ति अर्थनिष्ठ, गरिमापूर्ण और हिंदी में सुबोध है।
