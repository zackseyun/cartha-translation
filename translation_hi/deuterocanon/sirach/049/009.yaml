translation:
  language: hi
  text: उसने अय्यूब का भी उल्लेख किया[a], जो धार्मिकता के सभी मार्गों को कायम रखता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ काफी भिन्न है: “क्योंकि उसने वर्षा में शत्रुओं को स्मरण किया और मार्गों को सीधा करनेवालों का भला किया।” इब्रानी साक्ष्य में अय्यूब और धार्मिकता के सभी मार्गों को कायम रखने का पाठ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם הזכיר
  choice: उसने … का भी उल्लेख किया
  rationale: ‘भी’ וגם की योगात्मक शक्ति को व्यक्त करता है, और ‘उल्लेख किया’ הזכיר का सीधा तथा स्वाभाविक हिन्दी अनुवाद है।
- source_word: את איוב
  choice: अय्यूब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबिलीय रूप।
- source_word: ומכלכל
  choice: जो … बनाए रखता था
  rationale: כלכל में सँभालने, कायम रखने या व्यवस्थित करने का भाव हो सकता है। सम्बन्धवाचक वाक्य हिन्दी में अय्यूब के निरन्तर धर्ममय आचरण का भाव स्वाभाविक ढंग से व्यक्त करता है, पर क्रिया की व्यापक अर्थ-सम्भावना को अत्यधिक संकीर्ण नहीं करता।
- source_word: כל דרכי צדק
  choice: धार्मिकता के सभी मार्गों
  rationale: ‘मार्ग’ मूल रूपक को और ‘धार्मिकता’ צדק के नैतिक अर्थ को सुरक्षित रखता है; ‘सभी’ כל को स्पष्ट करता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में उल्लेखनीय भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य के अनुसार अय्यूब और धार्मिकता के मार्गों वाला पाठ रखा गया है।
  alternative: यूनानी समानांतर पाठ में शत्रुओं को वर्षा में स्मरण करने और सीधे मार्ग बनानेवालों का भला करने की बात है।
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध और विश्वसनीय है, उसे प्राथमिकता दी जाती है; यूनानी परम्परा की वास्तविक भिन्नता को पादटिप्पणी में बिना समरस किए सुरक्षित रखा गया है।
- issue: ומכלכל का कर्ता और आशय
  choice: 'इसे अय्यूब का वर्णन करनेवाले सम्बन्धवाचक वाक्य के रूप में प्रस्तुत किया गया है: ‘जो … बनाए रखता था।’'
  alternative: ‘और [वह] धार्मिकता के सभी मार्गों को सँभालता था’ अथवा ‘जो धार्मिकता के सभी मार्गों पर कायम रहा।’
  rationale: इब्रानी वाक्य-विन्यास अय्यूब के वर्णन को सहज समर्थन देता है, जबकि ‘बनाए रखता था’ मूल क्रिया के sustaining/maintaining भाव और ‘मार्गों’ को उसके कर्म के रूप में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। ‘धार्मिकता के मार्ग’ मूल इब्रानी रूपक और नैतिक तनाव को सुरक्षित रखता है।
