  text: Ezekiel saw a vision[a], and described the kinds of the chariot.
translation:
  language: hi
  text: और यहेजकेल ने एक दर्शन देखा और रथ के विभिन्न रूपों का वर्णन किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यहेजकेल ने महिमा का वह दर्शन देखा, जो उसे करूबों के रथ पर दिखाया गया था।” इब्रानी पाठ छोटा है, और “रथ के विभिन्न रूपों” वाले शब्द संभवतः संक्षिप्त या पाठ की दृष्टि से अनिश्चित हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: और यहेजकेल
  rationale: ו संयोजक है और חזקאל नबी का नाम; हिन्दी बाइबल परंपरा में प्रचलित रूप ‘यहेजकेल’ रखा गया है।
- source_word: ראה מראה
  choice: एक दर्शन देखा
  rationale: नबूवत के प्रसंग में מראה का अर्थ केवल दृश्य या रूप नहीं, बल्कि दर्शन है; यूनानी ὅρασιν भी इसकी पुष्टि करता है।
- source_word: ויגד
  choice: वर्णन किया
  rationale: हिफ़ील रूप का मूल अर्थ बताना या प्रकट करना है; रथ के रूपों के संदर्भ में ‘वर्णन किया’ स्वाभाविक हिन्दी है।
- source_word: זני
  choice: विभिन्न रूपों
  rationale: प्राप्त इब्रानी पाठ का अर्थ ‘प्रकार/भेद’ है, पर प्रसंग में यह असामान्य और संभवतः संक्षिप्त पाठ है। ‘विभिन्न रूपों’ मूल की बहुविधता को बचाते हुए हिन्दी में बोधगम्य है।
- source_word: מרכבה
  choice: रथ
  rationale: शब्द का सीधा अर्थ रथ है। मुख्य पाठ में ‘करूबों का’ या ‘सिंहासन-रथ’ नहीं जोड़ा गया, क्योंकि ये बातें केवल विस्तृत यूनानी समानांतर में स्पष्ट हैं।
theological_decisions:
- issue: क्या यूनानी समानांतर के आधार पर परमेश्वर की महिमा और करूबों का उल्लेख मुख्य पाठ में जोड़ा जाए
  choice: मुख्य पाठ में उपलब्ध इब्रानी का संक्षिप्त रूप रखा गया है।
  alternative: “यहेजकेल ने महिमा का वह दर्शन देखा, जो उसे करूबों के रथ पर दिखाया गया था।”
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है। यूनानी पाठ दर्शन का संदर्भ स्पष्ट करता है, पर इब्रानी में न पाए जाने वाले ‘महिमा’ और ‘करूबों’ को मुख्य पाठ में जोड़ना उचित नहीं; इसलिए पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘दर्शन’ और ‘रथ’ जैसे परिचित बाइबलीय शब्द बनाए रखे गए हैं, जबकि कठिन זני को बिना अत्यधिक व्याख्या जोड़े ‘विभिन्न रूपों’ के रूप में व्यक्त किया गया है।
