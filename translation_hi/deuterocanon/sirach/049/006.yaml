base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: hi
  text: उन्होंने पवित्र नगर को आग लगा दी और उसकी सड़कों[a] को उजाड़ दिया। यह यिर्मयाह के हाथ से हुआ[b], क्योंकि उन्होंने उसे सताया था, और वह गर्भ से ही नबी के रूप में रचा गया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उसके मार्गों/रास्तों’ है; नगर के संदर्भ में इसका अर्थ उसकी सड़कें है।
    reason: lexical_alternative
  - marker: b
    text: ‘यिर्मयाह के हाथ से’ मूल इब्रानी का संक्षिप्त और अस्पष्ट मुहावरा है। इसका अर्थ ‘यिर्मयाह के माध्यम से’ या ‘यिर्मयाह के संबंध में’ भी समझा जा सकता है, संभवतः उसकी नबूवत और चेतावनी के संदर्भ में।
    reason: alternative_reading
  - marker: c
    text: यह पंक्ति यिर्मयाह की गर्भ से ही हुई बुलाहट की प्रतिध्वनि है; यिर्मयाह 1:5 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ויציתו
  choice: आग लगा दी
  rationale: नगर के संदर्भ में यह क्रिया आग लगाने या जला देने का बोध कराती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: קרית קדש
  choice: पवित्र नगर
  rationale: इब्रानी समास का सीधा और स्वाभाविक अर्थ ‘पवित्र नगर’ है। यूनानी समानांतर पाठ थोड़ा भिन्न है, इसलिए यहाँ प्राथमिक इब्रानी साक्ष्य का अनुसरण किया गया है।
- source_word: וישמו
  choice: उजाड़ दिया
  rationale: क्रिया विनाश करके निर्जन या उजाड़ बना देने का भाव रखती है।
- source_word: ארחתיה
  choice: उसकी सड़कें
  rationale: मूल शब्द का शाब्दिक अर्थ ‘मार्ग/रास्ते’ हो सकता है, पर नगर के संदर्भ में ‘सड़कें’ स्वाभाविक अर्थ व्यक्त करता है; यूनानी ὁδοὺς भी इसका समर्थन करता है।
- source_word: ביד ירמיהו
  choice: यिर्मयाह के हाथ से
  rationale: मूल के संक्षिप्त और कठिन मुहावरे को मुख्य पाठ में सुरक्षित रखा गया है, ताकि उसकी वास्तविक अस्पष्टता न मिटे।
- source_word: כי ענוהו
  choice: क्योंकि उन्होंने उसे सताया था
  rationale: यहाँ क्रिया यिर्मयाह के साथ कठोर और अन्यायपूर्ण व्यवहार का अर्थ देती है; ‘सताया’ स्पष्ट है और उत्पीड़न के तरीके को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מרחם נוצר נביא
  choice: गर्भ ही से नबी होने के लिए रचा गया था
  rationale: यह अनुवाद गर्भ से ही यिर्मयाह की नबूवत के लिए रचना/नियुक्ति का भाव बनाए रखता है और यिर्मयाह 1:5 की प्रतिध्वनि को व्यक्त करता है।
- source_word: ירמיהו
  choice: यिर्मयाह
  rationale: इब्रानी नाम का आधुनिक हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ביד ירמיהו का नगर के विनाश और यिर्मयाह के उत्पीड़न से संबंध
  choice: मुख्य पाठ में ‘यिर्मयाह के हाथ से’ रखकर संक्षिप्त मूल वाक्य-विन्यास को सुरक्षित रखा गया है।
  alternative: ‘यिर्मयाह के माध्यम से’, ‘यिर्मयाह के संबंध में’, या अधिक व्याख्यात्मक रूप से ‘जैसा यिर्मयाह ने पहले कहा था’।
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और अस्पष्ट है, और यूनानी समानांतर भी ‘यिर्मयाह के हाथ में/से’ जैसा रूप रखता है। किसी एक व्याख्या को मुख्य पाठ में निश्चित कर देना स्रोत में उपस्थित तनाव को मिटा देता।
- issue: מרחם נוצר נביא में गर्भ से नबी होने का भाव
  choice: ‘गर्भ ही से नबी होने के लिए रचा गया था’
  alternative: ‘गर्भ में नबी के रूप में गढ़ा गया था’ या ‘गर्भ से ही नबी नियुक्त किया गया था’।
  rationale: ‘रचा गया’ मूल के गठन-संबंधी भाव को रखता है, जबकि ‘नबी होने के लिए’ यिर्मयाह की जन्मपूर्व नबीगत बुलाहट की प्रतिध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कठिन इब्रानी मुहावरे को मुख्य पाठ में जानबूझकर सुरक्षित रखा गया है और उसकी संभावित व्याख्याएँ पाद-टिप्पणी में दी गई हैं।
