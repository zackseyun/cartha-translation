base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/014.yaml
  text: Few have been created on earth like Enoch, and he too was taken from the earth.
translation:
  language: hi
  text: धरती पर हनोक जैसे बहुत कम मनुष्य रचे गए हैं,[b] और वह भी धरती से ले लिया गया।[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का अंतिम शब्द यहाँ कठिन है। यूनानी समानांतर पाठ में “धरती से” है, जिसका अनुसरण मुख्य पाठ में किया गया है।
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ अधिक प्रबल रूप से कहता है, “धरती पर हनोक जैसा एक भी नहीं रचा गया।” इब्रानी साक्ष्य में पूर्ण निषेध के बजाय “बहुत कम” है।
    reason: alternative_reading
  - marker: c
    text: या, “ऊपर उठा लिया गया।” यह भाषा हनोक के परमेश्वर द्वारा ले लिए जाने की परंपरा की याद दिलाती है (तुलना करें उत्पत्ति 5:24)।
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: बहुत कम लोग
  rationale: इब्रानी शब्द का अर्थ ‘थोड़े’ या ‘बहुत कम’ है। यूनानी पाठ के पूर्ण निषेध ‘एक भी नहीं’ के बजाय इब्रानी साक्ष्य की मात्रा-सूचक अभिव्यक्ति रखी गई है।
- source_word: נוצרו
  choice: रचे गए हैं
  rationale: यह बहुवचन कर्मवाच्य रूप मनुष्यों के रचे या बनाए जाने की ओर संकेत करता है। ‘रचे गए हैं’ दैवी कर्ता को अनावश्यक रूप से स्पष्ट किए बिना मूल का कर्मवाच्य भाव बनाए रखता है।
- source_word: על הארץ
  choice: धरती पर
  rationale: यह स्थान-सूचक वाक्यांश आधुनिक हिन्दी में स्वाभाविक रूप से ‘धरती पर’ व्यक्त होता है।
- source_word: כחנוך
  choice: हनोक जैसे
  rationale: उपसर्ग כ तुलना दर्शाता है; हिन्दी में ‘हनोक जैसे’ सहज और स्पष्ट है।
- source_word: וגם הוא
  choice: और वह भी
  rationale: यह मूल के योगात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נלקח
  choice: उठा लिया गया
  rationale: לקח का कर्मवाच्य रूप हनोक के परमेश्वर द्वारा ले लिए जाने की परंपरा की ओर संकेत करता है। ‘उठा लिया गया’ इस संकेत को रखता है, पर गंतव्य को स्पष्ट नहीं करता।
- source_word: פנים
  choice: धरती से
  rationale: अंतिम इब्रानी शब्द इस संदर्भ में कठिन और संभवतः पाठगत रूप से विकृत है। समानांतर यूनानी पाठ स्पष्ट रूप से ‘धरती से’ पढ़ता है; मुख्य पाठ में वही अर्थ लिया गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: हनोक के उठा लिए जाने को कितना स्पष्ट किया जाए
  choice: धरती से उठा लिया गया
  alternative: ऊपर उठा लिया गया / परमेश्वर की उपस्थिति में ले लिया गया
  rationale: वचन हनोक के असाधारण रूप से ले लिए जाने की परंपरा की ओर संकेत करता है, पर यह स्वयं गंतव्य या प्रक्रिया का विस्तार नहीं करता। इसलिए यूनानी समानांतर से समर्थित संयत वाक्यांश रखा गया है और अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘रचे गए हैं’ मूल के कर्मवाच्य तथा संभावित दैवी कर्ता को बनाए रखता है; ‘धरती’ की पुनरावृत्ति मूल और यूनानी समानांतर के स्थान-सूचक बल को स्पष्ट करती है।
