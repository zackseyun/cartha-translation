base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/007.yaml
  text: to uproot and to tear down and to destroy[a], to overthrow[b]; and likewise to build and to plant and to raise high.
translation:
  language: hi
  text: उखाड़ने, ढा देने, नष्ट करने और गिरा देने के लिए[b]; और उसी प्रकार बनाने, रोपने और ऊँचा उठाने के लिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ के अंत में एक अतिरिक्त सकारात्मक क्रिया है, जिसका अर्थ सम्भवतः ‘ऊँचा उठाना’, ‘ऊँचे स्थान पर रखना’ या ‘सुरक्षित करना’ है। यूनानी समानांतर पाठ यहाँ छोटा है और ‘बनाने और रोपने’ पर समाप्त हो जाता है।
    reason: textual_variant
  - marker: b
    text: यह पंक्ति जानबूझकर यिर्मयाह 1:10 में दी गई भविष्यवक्ता की नियुक्ति को प्रतिध्वनित करती है, यद्यपि सिराख के इब्रानी शब्द उससे पूरी तरह समान नहीं हैं।
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: उखाड़ने
  rationale: נתש का अर्थ जड़ से निकालना है। ‘उखाड़ने’ से यह ठोस अर्थ और यिर्मयाह के आह्वान की प्रतिध्वनि दोनों स्वाभाविक हिन्दी में बनी रहती हैं।
- source_word: לנתוץ
  choice: ढा देने
  rationale: נתץ प्रायः किसी निर्माण को गिराने या ध्वस्त करने के लिए आता है। ‘ढा देने’ में इसका ठोस और प्रबल भाव सुरक्षित है।
- source_word: ולהאביד
  choice: नष्ट करने
  rationale: हिफ़ील रूप में אבד किसी को विनाश की ओर ले जाने या नष्ट कर देने का अर्थ देता है। ‘नष्ट करने’ इसका सीधा और सहज अनुवाद है।
- source_word: להרוס
  choice: गिरा देने
  rationale: הרס में तोड़ने, ढहाने या बरबाद करने का भाव है। पिछले क्रियापद से अनावश्यक शब्दशः पुनरावृत्ति किए बिना ‘गिरा देने’ विनाशकारी क्रम को बनाए रखता है।
- source_word: וכן
  choice: और उसी प्रकार
  rationale: וכן विनाशकारी क्रियाओं के बाद आने वाले सकारात्मक, समानांतर भाग को स्पष्ट रूप से जोड़ता है।
- source_word: לבנות
  choice: बनाने
  rationale: Hebrew में सामान्य अर्थ ‘बनाना’ है; ‘फिर से बनाना’ कहने पर मूल में निहित न होने वाला अर्थ जुड़ जाता।
- source_word: לנטע
  choice: रोपने
  rationale: נטע का मानक अर्थ पौधा लगाना या रोपना है। ‘रोपने’ से भविष्यवाणी-संबंधी ‘बनाने और रोपने’ की जोड़ी भी बनी रहती है।
- source_word: ולהשגיב
  choice: ऊँचा उठाने
  rationale: שגב के इस कारक रूप में ऊँचा करने, ऊँचे स्थान पर रखने अथवा सुरक्षित करने का अर्थ हो सकता है। ‘ऊँचा उठाने’ से अर्थ की व्यापकता बनी रहती है और किसी एक संकुचित व्याख्या को अनिवार्य नहीं किया जाता।
theological_decisions:
- issue: यिर्मयाह की भविष्यवाणी-संबंधी नियुक्ति की अंतरपाठीय प्रतिध्वनि
  choice: क्रियाओं के क्रम और लय को सुरक्षित रखते हुए उपलब्ध इब्रानी पाठ का अनुसरण किया गया है।
  alternative: पंक्ति को हिन्दी में यिर्मयाह 1:10 के शब्दों के और अधिक अनुरूप बना देना।
  rationale: यह पंक्ति स्पष्ट रूप से यिर्मयाह 1:10 की नियुक्ति-भाषा को प्रतिध्वनित करती है, परन्तु सिराख का इब्रानी पाठ शब्दशः समान नहीं है। इसलिए संकेत को सुरक्षित रखा गया है, पाठों को कृत्रिम रूप से एकरूप नहीं किया गया।
- issue: अंतिम क्रिया ולהשגיב और यूनानी का छोटा पाठ
  choice: इब्रानी की अंतिम क्रिया को ‘ऊँचा उठाने’ के रूप में मुख्य पाठ में रखा गया है और यूनानी पाठांतर को पादटिप्पणी में बताया गया है।
  alternative: यूनानी के अनुसार ‘रोपने’ पर पंक्ति समाप्त करना, अथवा अंतिम क्रिया को अधिक विशिष्ट रूप से ‘सुरक्षित करने’ या ‘महिमा देने’ के रूप में अनुवाद करना।
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य प्राथमिक है। फिर भी यूनानी समानांतर में अंतिम क्रिया नहीं है और इब्रानी शब्द में कुछ अर्थगत खुलापन है; इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है और टिप्पणी वैकल्पिक साक्ष्य तथा अर्थ-सीमा को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमामय और लयात्मक रखी गई है। समानांतर क्रियाओं के लिए ‘-ने के लिए’ की रचना अपनाई गई है, ताकि इब्रानी के उद्देश्यसूचक infinitive क्रम का प्रवाह बना रहे। ‘उखाड़ने/रोपने’ और ‘ढा देने/बनाने’ के विरोधी जोड़ों को स्पष्ट रखा गया है।
