base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/013.yaml
  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: hi
  text: नहेमायाह की स्मृति[b] सम्मानित हो, जिसने हमारे खंडहरों को फिर खड़ा किया,[a] हमारी तबाही को चंगा किया, और फाटक तथा बेड़े लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “जिसने हमारे लिए गिरी हुई दीवारें खड़ी कीं, फाटक और बेड़े लगाए, और हमारे निवास-स्थानों को फिर बनाया।” इब्रानी पाठ अधिक व्यापक रूप से “हमारे खंडहरों” और “हमारी तबाही” की बात करता है तथा उसे सुधारने के लिए चंगा करने का रूपक प्रयोग करता है।'
    reason: alternative_reading
  - marker: b
    text: आरंभिक वाक्यांश नहेमायाह की स्मृति के लिए आदर की मंगलकामना है; यह केवल इतना नहीं कहता कि उसे याद किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יאדר זכרו
  choice: उसकी स्मृति सम्मानित हो
  rationale: यह केवल स्मरण किए जाने का कथन नहीं, बल्कि नहेमायाह की स्मृति के आदर की मंगलकामना है। हिंदी में यह वाक्य उस आशीर्वादात्मक भाव को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: המקים
  choice: फिर खड़ा किया
  rationale: हिफ़ील रूप गिरी या नष्ट हुई वस्तु को उठाने अथवा पुनः स्थापित करने का भाव देता है। ‘फिर खड़ा किया’ पुनर्स्थापन की छवि बनाए रखता है और यूनानी समानांतर से भी मेल खाता है।
- source_word: חרבתינו
  choice: हमारे खंडहरों
  rationale: इब्रानी शब्द व्यापक रूप से उजड़े या ध्वस्त स्थानों को दर्शाता है; इसलिए यूनानी के अधिक विशिष्ट ‘गिरी हुई दीवारों’ को मुख्य पाठ में नहीं थोपा गया।
- source_word: וירפא
  choice: चंगा किया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘चंगा करना’ है। इसे बनाए रखने से नगर के विनाश को घाव मानने वाला सजीव रूपक सुरक्षित रहता है।
- source_word: הריסתינו
  choice: हमारे उजड़े हुए स्थानों
  rationale: यह अभिव्यक्ति ढहाए या तोड़े गए स्थानों का बोध कराती है। ‘उजड़े हुए स्थान’ पूर्ववर्ती ‘खंडहरों’ से पर्याप्त भेद रखते हुए आधुनिक हिंदी में स्वाभाविक है।
- source_word: ויצב
  choice: लगाए
  rationale: फाटकों और उन्हें सुरक्षित करने वाले बेड़ों को उनके स्थान पर स्थापित करने के संदर्भ में ‘लगाए’ सहज और सटीक हिंदी है।
- source_word: דלתים ובריח
  choice: फाटक तथा बेड़े
  rationale: नगर-दीवार के प्रसंग में דלתים फाटक के पल्लों और בריח उन्हें बंद रखने वाले आड़े मजबूत बेड़े को सूचित करता है। यह अनुवाद शब्दार्थ और ऐतिहासिक संदर्भ दोनों स्पष्ट करता है।
