  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: hi
  text: उसे अपने पास खड़ा मत करना[a], कहीं ऐसा न हो कि वह तुम्हें धकेलकर हटा दे और तुम्हारी जगह खड़ा हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “साँप से डसे गए सपेरे पर कौन दया करेगा, और उन सब पर जो जंगली पशुओं के पास जाते हैं?” इस स्थान पर यूनानी साक्ष्य का पाठ बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: उसे … खड़ा न करना
  rationale: עמד के हिफ़ील रूप का अर्थ किसी को खड़ा करना या किसी स्थान पर नियुक्त करना है। यह अनुवाद कारणवाचक भाव को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: אֶצְלֶךָ
  choice: अपने पास
  rationale: אצל निकटता दर्शाता है। ‘अपने पास’ स्थानिक निकटता के साथ किसी को अपने निकट स्थान या प्रभाव देने का भाव भी व्यक्त कर सकता है।
- source_word: לָמָּה
  choice: कहीं ऐसा न हो कि
  rationale: शाब्दिक रूप से यह ‘क्यों?’ है, पर इस चेतावनी में यह टाले जाने वाले परिणाम का परिचय देता है। हिन्दी में ‘कहीं ऐसा न हो कि’ उस चेतावनी-भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֶהְדָּפְךָ
  choice: वह तुम्हें धकेलकर हटा दे
  rationale: הדף का अर्थ धकेलना, पीछे हटाना या निकाल देना है। अगले वाक्यांश में उसके स्थान लेने की बात होने के कारण यहाँ विस्थापित करने का भाव स्पष्ट है।
- source_word: וְיַעֲמֹד תַּחְתֶּיךָ
  choice: और तुम्हारी जगह खड़ा हो जाए
  rationale: עמד का ‘खड़ा होना’ और תחת का ‘नीचे’ अथवा ‘के स्थान पर’—दोनों भाव इस प्रसंग में प्रतिस्थापन की ओर संकेत करते हैं। यह हिन्दी वाक्य खड़े होने की मूल छवि और स्थान लेने के अर्थ, दोनों को बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में अत्यधिक भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद करना
  alternative: 'यूनानी पाठ को मुख्य पाठ बनाना: ‘साँप से डसे गए सपेरे पर कौन दया करेगा, और उन सब पर जो जंगली पशुओं के पास जाते हैं?’'
  rationale: इस पद के लिए उपलब्ध काहाना-संपादित काहिरा गनीज़ा इब्रानी पाठ को प्राथमिक रखा गया है। यूनानी पाठ एक बिल्कुल अलग कथन देता है; इसलिए उसे इब्रानी में मिलाने या उससे इब्रानी को बदलने के बजाय वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תַּחְתֶּיךָ का स्थानिक और प्रतिस्थापन-संबंधी तनाव
  choice: ‘तुम्हारी जगह’ के साथ ‘खड़ा हो जाए’ की स्थानिक छवि बनाए रखना
  alternative: ‘तुम्हारे नीचे खड़ा हो जाए’
  rationale: ‘तुम्हारे नीचे’ हिन्दी में इस प्रसंग में अस्पष्ट और भ्रामक हो सकता है। समानांतर क्रियाओं—तुम्हें हटाना और स्वयं खड़ा होना—से किसी का स्थान ले लेने का अर्थ निकलता है, जबकि ‘खड़ा हो जाए’ मूल स्थानिक रूपक को बचाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, चेतावनीपूर्ण और गरिमापूर्ण शैली अपनाई गई है। ‘अपने पास खड़ा न करना’ कारणवाचक इब्रानी रूप को सहज हिन्दी में रखता है; ‘धकेलकर हटा दे’ विस्थापन को स्पष्ट करता है।
