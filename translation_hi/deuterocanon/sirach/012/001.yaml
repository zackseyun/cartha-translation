translation:
  language: hi
  text: यदि तुम भलाई करो, तो जान लो कि तुम किसका भला कर रहे हो; और तुम्हारी भलाई के लिए आशा होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ यह भी हो सकता है, “तुम्हारे कल्याण की आशा होगी।” यूनानी पाठ में अधिक स्पष्ट रूप से है, “और तुम्हारे भले कामों के लिए धन्यवाद मिलेगा।”
    reason: इब्रानी לְטוֹבָתָךְ की अर्थगत अस्पष्टता और यूनानी समानांतर की वैकल्पिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: אִם תֵּטִיב
  choice: यदि तुम भलाई करो
  rationale: शर्तसूचक אִם को ‘यदि’ और היטיב को ‘भलाई करना’ से व्यक्त किया गया है। यह इब्रानी अर्थ तथा यूनानी समानांतर—दोनों के निकट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תֵּדַע לְמִי תֵטִיב
  choice: तो जान लो कि किसके साथ भलाई कर रहे हो
  rationale: תֵּדַע का प्रसंगगत आज्ञार्थ ‘जान लो’ से स्पष्ट होता है। हिन्दी में ‘किसके साथ भलाई करना’ लाभ पाने वाले व्यक्ति को स्वाभाविक ढंग से व्यक्त करता है, जबकि मूल की पुनरुक्ति भी बनी रहती है।
- source_word: וִיהִי תִקְוָה
  choice: और … आशा रहेगी
  rationale: וִיהִי में संभावित परिणामसूचक भविष्य और हल्का इच्छार्थ दोनों हो सकते हैं। ‘आशा रहेगी’ परिणाम को व्यक्त करता है और अनावश्यक निश्चितता नहीं जोड़ता।
- source_word: לְטוֹבָתָךְ
  choice: तुम्हारी भलाई के लिए
  rationale: טוֹבָה का अर्थ यहाँ किए गए भले काम, भलाई अथवा स्वयं कर्ता के हित से जुड़ सकता है। ‘तुम्हारी भलाई’ हिन्दी में इसी अर्थगत खुलापन को बनाए रखती है; अधिक स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: अंतिम वाक्यांश לְטוֹבָתָךְ का आशय
  choice: तुम्हारी भलाई के लिए आशा रहेगी
  alternative: तुम्हारे कल्याण की आशा रहेगी; अथवा यूनानी के अनुसार, तुम्हारे भले कामों के लिए धन्यवाद मिलेगा
  rationale: इब्रानी पाठ ‘भलाई’ को किए गए उपकार या उपकारी के हित—दोनों से जोड़ने की गुंजाइश देता है, जबकि यूनानी समानांतर प्रतिफल अथवा कृतज्ञता की ओर संकेत करता है। मुख्य पाठ व्यापक इब्रानी अभिव्यक्ति को रखता है और भिन्न अर्थों को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और शिक्षापरक स्वर रखा गया है। ‘तुम’ सामान्य पाठक के लिए सहज है; वाक्य की पुनरुक्ति मूल इब्रानी ज्ञान-साहित्य की चेतावनीपूर्ण शैली को बनाए रखती है।
