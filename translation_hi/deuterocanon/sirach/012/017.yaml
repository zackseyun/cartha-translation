base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/017.yaml
  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
translation:
  language: hi
  text: ऐसा ही वह व्यक्ति है जो धृष्ट मनुष्य की संगति करता है और उसके पापों में लोटता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य यहाँ बहुत भिन्न है: “यदि विपत्ति तुम पर आ पड़े, तो तुम उसे वहाँ तुमसे पहले पाओगे; और सहायता करनेवाले के समान वह तुम्हारी एड़ी में अड़ंगा डालेगा।” इसके विपरीत, काहिरा गनीज़ा में सुरक्षित इब्रानी पाठ धृष्ट मनुष्य की संगति करने और उसके पापों में लोटने की बात कहता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: ऐसा ही वह है
  rationale: यह पिछले कथन से तुलना या उसके अनुप्रयोग को सूक्तिपरक ढंग से जोड़ता है।
- source_word: חוֹבֵר אֶל
  choice: की संगति करता
  rationale: חבר का भाव किसी से जुड़ने या मेल-जोल रखने का है; आधुनिक हिन्दी में ‘संगति करना’ सामाजिक और नैतिक जुड़ाव दोनों व्यक्त करता है।
- source_word: אִישׁ זָדוֹן
  choice: धृष्ट मनुष्य
  rationale: זָדוֹן में घमंडी, उद्दंड और जान-बूझकर मर्यादा लाँघने का भाव है; ‘धृष्ट’ इसे संक्षेप और स्वाभाविक हिन्दी में रखता है, जबकि איש की पुल्लिंग एकवचनता बनी रहती है।
- source_word: וּמִתְגֹלֵל
  choice: और ... लोटता है
  rationale: גלל के हित्पएल रूप में अपने को लुढ़काने या लोटने का सजीव बिंब है। ‘लोटता है’ उस बिंब को बचाता है और पाप में गहरे संलिप्त होने का आशय भी देता है।
- source_word: בַּעֲוֹנֹתָיו
  choice: उसके पापों में
  rationale: עון यहाँ पाप या अधर्म को सूचित करता है। प्रत्यय का स्वाभाविक संदर्भ धृष्ट मनुष्य है, इसलिए ‘उसके’ रखा गया है।
theological_decisions:
- issue: इब्रानी पाठ और बहुत भिन्न यूनानी समानांतर पाठ का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: “यदि विपत्ति तुम पर आ पड़े, तो तुम उसे अपने से पहले वहाँ पाओगे; और सहायता करनेवाले के समान वह तुम्हारी एड़ी अड़ा देगा।”'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए वह मुख्य आधार है। यूनानी साक्ष्य अर्थ की दृष्टि से काफी अलग है और व्याख्या को प्रभावित करता है; अतः उसे वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूक्तिपरक रखी गई है। ‘धृष्ट’ नैतिक अहंकार और उद्दंडता को व्यक्त करता है; ‘पापों में लोटता है’ मूल इब्रानी के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
