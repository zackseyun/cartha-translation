base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: hi
  text: उसके साथ ऐसे रहो, मानो वह भेद खोलनेवाला हो[a], और वह तुम्हें बरबाद करने का उपाय न पाएगा; और ईर्ष्या का परिणाम जान लो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो वह कोई भेद खोल रहा हो।” आशय संभवतः यह है कि ऐसे व्यक्ति से उसी सावधानी के साथ व्यवहार करो जैसे किसी गोपनीय बात को प्रकट कर देनेवाले से।
    reason: lexical_alternative
  - marker: b
    text: या, “डाह का अंत जान लो।” इब्रानी में शाब्दिक रूप से “ईर्ष्या/डाह का अंत” है। यूनानी समानांतर इस चेतावनी को अधिक विस्तार से प्रस्तुत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: उसके साथ ऐसे रहो
  rationale: היה के साथ ל किसी व्यक्ति के प्रति अपनाए जाने वाले व्यवहार या रुख को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए इब्रानी आज्ञा की सीधाई बनाए रखता है।
- source_word: כִּמְגַלֶּה רָז
  choice: मानो वह भेद खोलनेवाला हो
  rationale: מְגַלֶּה का अर्थ ‘खोलने/प्रकट करनेवाला’ और רָז का अर्थ ‘भेद/रहस्य’ है। उपमा को बनाए रखा गया है और संदर्भगत सावधानी को बिना अतिरिक्त व्याख्या के व्यक्त किया गया है।
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: और वह तुम्हें बरबाद करने का उपाय न पाएगा
  rationale: יִמְצָא का मूल अर्थ ‘पाएगा’ है; हिन्दी में infinitive के साथ ‘उपाय’ जोड़ने से वाक्य स्वाभाविक बनता है। שחת के हिफ़ील रूप के लिए ‘बरबाद करना’ चुना गया है, जो शारीरिक विनाश तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְדַע אַחֲרִית קִנְאָה
  choice: और ईर्ष्या का परिणाम जान लो
  rationale: וְדַע स्पष्ट आज्ञार्थक है। אַחֲרִית यहाँ अंततः होने वाले परिणाम को दर्शाता है, और קִנְאָה के लिए इस शत्रुतापूर्ण संबंध के संदर्भ में ‘ईर्ष्या’ उपयुक्त है।
theological_decisions:
- issue: इब्रानी पाठ की संक्षिप्त आज्ञा और यूनानी समानांतर के विस्तृत चेतावनी-पाठ में अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का सीधा अनुवाद
  alternative: यूनानी के अनुसार शत्रु को अपने पास या दाहिनी ओर न बैठाने और उसके द्वारा स्थान हथिया लेने की विस्तृत चेतावनी
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिक रखा गया है। यूनानी पाठ चेतावनी के व्यावहारिक आशय की पुष्टि करता है, पर उसकी विस्तृत सामग्री को इब्रानी मुख्य पाठ में नहीं मिलाया गया।
- issue: קִנְאָה का अर्थ
  choice: ईर्ष्या
  alternative: डाह
  rationale: शब्द ईर्ष्या, डाह या उत्साह का अर्थ दे सकता है। यहाँ हानि पहुँचाने वाले शत्रु के संदर्भ में ‘ईर्ष्या’ सबसे सहज है, जबकि ‘डाह’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चेतावनीपूर्ण लहजा रखा गया है। ‘भेद खोलनेवाला’ सामान्य पाठक के लिए बोधगम्य है और मूल उपमा को सुरक्षित रखता है; ‘बरबाद’ interpersonal harm की व्यापकता व्यक्त करता है।
