    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: उसका भला नहीं होता
  rationale: इब्रानी का शाब्दिक अर्थ ‘कोई भलाई नहीं है’ है। हिन्दी में यह पद-विन्यास स्वाभाविक ढंग से उस व्यक्ति के लिए भलाई या लाभ के अभाव को व्यक्त करता है; यूनानी οὐκ ἔστιν ἀγαθὰ भी इसी मूल अर्थ की पुष्टि करता है।
- source_word: לִמְנֹחַ רָשָׁע
  choice: जो दुष्टता में लगा रहता है
  rationale: इब्रानी पद कठिन और पाठगत रूप से कुछ अनिश्चित है; उसका अत्यधिक शाब्दिक अनुवाद ‘दुष्ट को विश्राम करने के लिए’ जैसा हो सकता है, जो प्रसंग में अस्पष्ट है। यूनानी τῷ ἐνδελεχίζοντι εἰς κακὰ निरंतर बुराई में लगे रहने का अर्थ समर्थित करता है।
- source_word: וְגַם
  choice: और उसका भी नहीं
  rationale: मूल का योगसूचक ‘और भी’ हिन्दी में पहले निषेध के साथ इस रूप में स्वाभाविक है और दोनों प्रकार के व्यक्तियों पर एक ही कथन लागू करता है।
- source_word: צְדָקָה
  choice: दया
  rationale: इस उत्तरकालीन इब्रानी संदर्भ में शब्द धार्मिकता के साथ दान या परोपकार का अर्थ भी रख सकता है। यूनानी ἐλεημοσύνην विशेष रूप से दान-दया की ओर संकेत करता है; इसलिए मुख्य पाठ में सहज और व्यापक ‘दया’ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לֹא עָשָׂה
  choice: नहीं करता
  rationale: इब्रानी में शाब्दिक रूप से ‘नहीं किया’ है, पर नीतिवचन-सदृश सामान्य कथन के लिए हिन्दी का सामान्य वर्तमानकाल उपयुक्त है। ‘दया करना’ स्वाभाविक हिन्दी प्रयोग है और यूनानी के ‘नहीं देता/प्रदान करता’ से संगत है।
theological_decisions:
- issue: इस ज्ञान-साहित्यिक संदर्भ में צְדָקָה का अर्थ
  choice: नैतिक दया अथवा परोपकार
  alternative: धार्मिकता; दान देना
  rationale: इब्रानी शब्द में ‘धार्मिकता’ का अर्थ संभव है, पर यूनानी समांतर उसे दान-दया के रूप में समझता है। मुख्य पाठ में ‘दया’ रखने से अमूर्त धर्मशास्त्रीय अर्थ आरोपित नहीं होता, जबकि पादटिप्पणी वास्तविक शाब्दिक और पाठ-परंपरागत विकल्पों को बनाए रखती है।
- issue: לִמְנֹחַ רָשָׁע की कठिन शब्दावली
  choice: दुष्टता में लगे रहने की क्रिया
  alternative: दुष्ट व्यक्ति के लिए; दुष्टता में टिक जाने वाला
  rationale: इब्रानी रूप अकेले निर्णायक नहीं है। यूनानी समांतर निरंतर बुराई करने का स्पष्ट प्रमाण देता है, इसलिए प्रवृत्ति की निरंतरता व्यक्त की गई है और अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली रखी गई है। ‘दुष्टता में लगा रहता है’ निरंतर आचरण को सामान्य पाठक के लिए स्पष्ट करता है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
