translation:
  language: hi
  text: क्योंकि परमेश्वर[a] भी बुरे लोगों[b] से घृणा करता है, और दुष्टों[c] से बदला लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “परमेश्वर”; यूनानी में “परमप्रधान।”
    reason: textual_variant
  - marker: b
    text: यूनानी में “पापियों।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “दुष्टों”; यूनानी में “भक्तिहीनों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל / ὁ ὕψιστος
  choice: परमेश्वर
  rationale: मुख्य इब्रानी पाठ का אֵל सामान्यतः ‘परमेश्वर’ है। यूनानी समानांतर में विशिष्ट उपाधि ‘परमप्रधान’ है; उसे पाठ-भेद की टिप्पणी में सुरक्षित रखा गया है।
- source_word: שֹׂנֵא / ἐμίσησεν
  choice: घृणा करता है
  rationale: इब्रानी कृदंत स्थायी या सामान्य स्वभाव व्यक्त कर सकता है और क्रिया का प्रबल अर्थ ‘घृणा करना’ है। यह यूनानी ἐμίσησεν की शक्ति को भी बनाए रखता है।
- source_word: רָעִים / ἁμαρτωλούς
  choice: बुरे लोगों
  rationale: इब्रानी का शाब्दिक अर्थ ‘बुरे जन’ है। सरल आधुनिक हिन्दी में ‘बुरे लोगों’ से यही अर्थ स्वाभाविक रूप से आता है; यूनानी में ‘पापियों’ का भिन्न पाठ है।
- source_word: לָרְשָׁעִים / τοῖς ἀσεβέσιν
  choice: दुष्टों
  rationale: इब्रानी רְשָׁעִים के लिए ‘दुष्टों’ सटीक और स्वाभाविक है। यूनानी ‘भक्तिहीनों’ की ओर झुकता है, जिसे टिप्पणी में दर्ज किया गया है।
- source_word: יָשִׁיב נָקָם / ἀποδώσει ἐκδίκησιν
  choice: बदला लेगा
  rationale: इब्रानी वाक्यांश का आशय प्रतिकार या प्रतिशोध चुकाना है। ‘बदला लेगा’ हिन्दी में सीधा, प्रबल और सहज है तथा भाव को नरम नहीं करता।
theological_decisions:
- issue: इब्रानी और यूनानी में ईश्वरीय उपाधि का अंतर
  choice: परमेश्वर
  alternative: परमप्रधान
  rationale: उच्च-विश्वसनीयता वाले इब्रानी मुख्य पाठ को प्राथमिकता दी गई है; यूनानी परंपरा की अधिक विशिष्ट उपाधि को पादटिप्पणी में स्पष्ट किया गया है।
- issue: परमेश्वर द्वारा बुरे लोगों से घृणा और प्रतिशोध की प्रबल भाषा
  choice: घृणा करता है; बदला लेगा
  alternative: अस्वीकार करता है; दंड देगा
  rationale: मूल इब्रानी और यूनानी दोनों की प्रबल न्याय-संबंधी भाषा को किसी धर्मवैज्ञानिक असुविधा के कारण नरम नहीं किया गया।
