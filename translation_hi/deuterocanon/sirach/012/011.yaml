  text: Even if he listens to you and walks gently, give your heart to be afraid of him.[a]
translation:
  language: hi
  text: यदि वह तुम्हारी बात सुने और शांत ढंग से चले, तब भी मन में रखो कि उससे डरना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “अपने प्राण को चौकस रखो और उससे बचकर रहो”; इससे आत्मरक्षा की चेतावनी मौजूदा हिब्रू पाठ की अपेक्षा अधिक स्पष्ट हो जाती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  choice: तुम्हारी बात माने
  rationale: שמע के साथ ל का अर्थ किसी की बात सुनना और प्रसंगानुसार मानना हो सकता है। यहाँ शत्रु के दबे हुए व्यवहार की चेतावनी है, इसलिए यह स्वाभाविक हिन्दी में दोनों भावों को समेटता है।
- source_word: וִיהַלֵּךְ בְּנַחַת
  choice: नम्रता से चले
  rationale: הלך בנחת शांत, दबे या नम्र ढंग से चलने अथवा व्यवहार करने का भाव देता है। ‘चले’ मूल रूपक को बनाए रखता है; यूनानी समानांतर भी झुकी हुई, दीन मुद्रा का संकेत देता है।
- source_word: תֵּן לִבְּךָ
  choice: अपना मन लगाओ
  rationale: शाब्दिक रूप से ‘अपना हृदय दो’; हिन्दी मुहावरे में ‘अपना मन लगाओ’ जानबूझकर ध्यान केंद्रित करने की आज्ञा को निकटता और सहजता से व्यक्त करता है।
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  choice: उससे डरते रहने पर
  rationale: ירא का मूल अर्थ डरना है। प्रसंग में यह सतर्क भय है, पर मुख्य पाठ में ‘सावधान रहो’ कहने से यूनानी φύλαξαι का स्पष्ट रक्षात्मक अर्थ हिब्रू पर आरोपित हो जाता; इसलिए भय-शब्द सुरक्षित रखा गया है।
