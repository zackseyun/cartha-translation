base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/014.yaml
  text: Do not seat him at your right hand[a], lest he seek your seat.
translation:
  language: hi
  text: उसे अपने दाहिनी ओर न बैठाओ[a], कहीं ऐसा न हो कि वह तुम्हारा आसन पाने की कोशिश करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे अपनी दाहिनी ओर न बैठाओ, नहीं तो वह तुम्हारी जगह पाने की कोशिश करेगा।” इब्रानी में “तुम्हारा आसन” केवल बैठने की जगह ही नहीं, बल्कि तुम्हारे पद या हैसियत का संकेत भी हो सकता है।
    reason: शाब्दिक विकल्प और ‘आसन’ के संभावित सामाजिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: אַל
  choice: न बैठाओ
  rationale: אַל निषेधात्मक आज्ञा को व्यक्त करता है; हिन्दी में क्रिया के साथ ‘न’ स्वाभाविक और स्पष्ट है।
- source_word: תּוֹשִׁיבֵהוּ
  choice: उसे … बैठाओ
  rationale: ישׁב के हिफ़ील रूप में किसी को बैठाने का कारक अर्थ है, जिसे ‘बैठाओ’ सीधे बनाए रखता है।
- source_word: לִימִינֶךָ
  choice: अपने दाहिने
  rationale: शाब्दिक अर्थ ‘तुम्हारे दाहिने’ है और प्रसंग में निकटता या सम्मान का स्थान सूचित हो सकता है; यह रूप बिना अतिरिक्त व्याख्या के दोनों को खुला रखता है।
- source_word: לָמָּה
  choice: कहीं ऐसा न हो कि
  rationale: यहाँ לָמָּה का शाब्दिक प्रश्नार्थक रूप प्रसंग में अनचाहे परिणाम की चेतावनी देता है; हिन्दी में ‘कहीं ऐसा न हो कि’ उस चेतावनी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְבַקֵּשׁ
  choice: पाने की कोशिश करे
  rationale: בקש खोजने, चाहने या प्राप्त करने का प्रयत्न करने को व्यक्त कर सकता है; यहाँ किसी दूसरे का आसन हथियाने की अभिलाषा के संदर्भ में यह सहज है।
- source_word: מוֹשָׁבֶךָ
  choice: तुम्हारा आसन
  rationale: מוֹשָׁב का ठोस अर्थ बैठने का स्थान है, पर यह पद या हैसियत का संकेत भी दे सकता है; ‘आसन’ इस रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी पाठ और भिन्न वाक्य-विन्यास वाले यूनानी समानांतर का संबंध
  choice: विद्यमान और उच्च-विश्वसनीयता वाले इब्रानी पाठ का सीधे अनुवाद किया गया है।
  alternative: यूनानी समानांतर के आधार पर पापी के साथ संगति की व्यापक चेतावनी को मुख्य पाठ में स्पष्ट किया जा सकता था।
  rationale: इब्रानी साक्ष्य स्पष्ट है और इस पद में दाहिनी ओर बैठाने तथा अपना आसन चाहने की ठोस छवि देता है। यूनानी पाठ प्रसंग की नैतिक चेतावनी की पुष्टि करता है, पर उसे इब्रानी वाक्य के स्थान पर नहीं रखा गया।
- issue: ‘आसन’ का शाब्दिक या सामाजिक अर्थ
  choice: मुख्य पाठ में ‘आसन’ रखकर शाब्दिक बैठने की छवि और पद/हैसियत के संकेत दोनों को सुरक्षित रखा गया है।
  alternative: ‘तुम्हारी जगह’ या ‘तुम्हारा पद’ कहकर सामाजिक अर्थ को स्पष्ट किया जा सकता था।
  rationale: एक ही अर्थ चुनने से मूल की अर्थगत व्यापकता घट जाती; पादटिप्पणी पाठक को संभावित सामाजिक आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण चेतावनी। ‘अपने दाहिने’ सम्मान और निकटता की मूल छवि बनाए रखता है; ‘आसन’ ठोस तथा रूपकात्मक दोनों अर्थों के लिए चुना गया है।
