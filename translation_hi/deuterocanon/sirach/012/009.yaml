  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
translation:
  language: hi
  text: मनुष्य की खुशहाली में शत्रु भी मित्र-सा बन जाता है[a], पर उसकी विपत्ति में मित्र भी दूर हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शत्रु भी मित्र बन जाता है।” इब्रानी רֵעַ का अर्थ “मित्र” या “साथी” हो सकता है। मुख्य पाठ में “मित्र-सा” कहने से कहावत की विडंबना बनी रहती है और सच्ची मित्रता हो जाने का अर्थ अनिवार्य नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: मनुष्य की खुशहाली में
  rationale: טוֹבָה यहाँ अनुकूल दशा या समृद्ध अवस्था को सूचित करता है। 'खुशहाली' सामान्य आधुनिक हिन्दी में स्वाभाविक है और आगे की 'विपत्ति' के साथ स्पष्ट विरोध बनाती है; אִישׁ की एकवचन, प्रतिनिधिक संरचना भी बनी रहती है।
- source_word: שׂוֹנֵא
  choice: शत्रु
  rationale: शाब्दिक अर्थ 'घृणा करने वाला' है, पर संबंधपरक संदर्भ में 'शत्रु' अधिक स्वाभाविक है और यूनानी ἐχθροί से भी पुष्ट होता है।
- source_word: רֵעַ
  choice: मित्र-सा बन जाता है
  rationale: पहली पंक्ति में רֵעַ मित्र या साथी का भाव रखता है। 'मित्र-सा' कहने से कहावत की विडंबना बनी रहती है और वास्तविक मेल-मिलाप का दावा नहीं किया जाता; दूसरी पंक्ति के 'मित्र' के साथ मूल शब्द-खेल भी सुनाई देता है।
- source_word: וּבְרָעָתוֹ
  choice: पर उसकी विपत्ति में
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, प्रतिकूल परिस्थिति है। 'विपत्ति' खुशहाली के साथ सटीक और स्वाभाविक विरोध प्रस्तुत करती है। संयोजक ו को हिन्दी में विरोधसूचक 'पर' से व्यक्त किया गया है।
- source_word: בּוֹדֵד
  choice: दूर हो जाता है
  rationale: यह रूप अलग या पृथक हो जाने की दशा व्यक्त करता है। संबंधों के संदर्भ में 'दूर हो जाता है' सहज हिन्दी है और यूनानी διαχωρισθήσεται के पृथक्करण के भाव से मेल खाता है।
