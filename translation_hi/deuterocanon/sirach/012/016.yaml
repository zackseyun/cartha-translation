base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: hi
  text: साँप के काटे हुए सपेरे पर कौन दया करेगा, या उस व्यक्ति पर जो दाँतोंवाले हिंसक पशु[a] के पास जाता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘दाँत का’ या ‘दाँतोंवाला पशु’ है, अर्थात एक खतरनाक हिंसक पशु।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में यहाँ काफी भिन्न वचन है: शत्रु अपने होंठों से मीठी बातें करता है, पर मन में तुम्हें गड्ढे में गिराने की योजना बनाता है; वह आँखों से आँसू बहाता है, पर अवसर मिलने पर रक्त से तृप्त नहीं होता। चूँकि इस पद का इब्रानी पाठ उपलब्ध है और उपलब्ध इब्रानी सिराख के लिए वही प्राथमिक साक्षी है, मुख्य पाठ यहाँ इब्रानी का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: מִי יוּחַן
  choice: कौन दया करेगा
  rationale: प्रश्नवाचक מִי और חנן से बने रूप का मेल एक अलंकारिक प्रश्न बनाता है। ‘कौन दया करेगा’ आधुनिक हिन्दी में स्वाभाविक है और करुणा किए जाने का भाव बनाए रखता है।
- source_word: חוֹבֵר נָשׁוּךְ
  choice: साँप के काटे हुए सपेरे
  rationale: חוֹבֵר यहाँ मंत्र या सम्मोहन से साँप को वश में करनेवाले व्यक्ति को सूचित करता है, और נָשׁוּךְ निष्क्रिय कृदंत है, अर्थात ‘काटा हुआ’। हिन्दी में यह पदबंध दोनों भावों को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וְכָל הַקָּרֵב
  choice: या उस व्यक्ति पर जो ... के पास जाता है
  rationale: शाब्दिक रूप ‘और हर वह जो निकट आता है’ है। अलंकारिक प्रश्न में समानांतर दूसरे उदाहरण को हिन्दी में ‘या’ से जोड़ना अधिक स्वाभाविक है; ‘उस व्यक्ति’ כָּל को सामान्य अर्थ में व्यक्त करता है।
- source_word: אֶל חַיַּת שֵׁן
  choice: दाँतोंवाले हिंसक पशु के पास
  rationale: इब्रानी का शाब्दिक अर्थ ‘दाँत का/दाँतोंवाला पशु’ है। ‘हिंसक’ संदर्भगत खतरे को स्पष्ट करता है, जबकि ‘दाँतोंवाले’ मूल की विशिष्ट छवि को बनाए रखता है।
