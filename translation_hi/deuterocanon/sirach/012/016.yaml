translation_notes:
  register: भाषा आधुनिक, सहज और नीतिवचन-सदृश रखी गई है। ‘सपेरा’ सामान्य हिन्दी पाठक के लिए חוֹבֵר का सीधा और परिचित रूप है। मूल की ‘दाँतोंवाले पशु’ वाली छवि को मुख्य पाठ में रखा गया है और अर्थ-स्पष्टीकरण के लिए ‘हिंसक’ जोड़ा गया है।
