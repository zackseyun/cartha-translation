base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/007.yaml
  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: hi
  text: भले व्यक्ति को दे, और पापी की सहायता न कर।[a] गरीब का आदर कर, और किसी पराए को न दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘बुराई से रोक रख’ या संभवतः ‘बुरे व्यक्ति से सहायता रोक रख’ है। यूनानी समानांतर में है, ‘पापी की सहायता न कर।’
    reason: मֵרָע की अमूर्त अथवा व्यक्तिगत व्याख्या और यूनानी समानांतर को सुरक्षित रखता है।
  - marker: b
    text: या, ‘किसी बाहरी को’ अथवा ‘किसी विदेशी को।’ हिब्रू शब्द का अर्थ उस व्यक्ति से हो सकता है जो समुदाय या उचित दायरे के बाहर हो।
    reason: לְזֵר के व्यापक सामाजिक अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: भले मनुष्य को दे
  rationale: לַטּוֹב का शाब्दिक अर्थ ‘भले को’ है; यूनानी समानांतर भी व्यक्तिगत संदर्भ की पुष्टि करता है। हिन्दी में ‘भले मनुष्य’ स्पष्ट और स्वाभाविक है।
- source_word: וּמְנַע מֵרָע
  choice: और बुरे मनुष्य से रोक रख
  rationale: מנע का मूल भाव किसी वस्तु को रोक रखना है। מֵרָע व्याकरणतः ‘बुराई से’ या ‘बुरे मनुष्य से’ हो सकता है; पहले खंड के व्यक्तिगत ‘भले मनुष्य’ के समांतर यहाँ व्यक्तिगत अर्थ रखा गया है, पर ‘पापी की सहायता न कर’ जैसी यूनानी-आधारित व्याख्या मुख्य पाठ पर नहीं थोपी गई।
- source_word: הֹקֵיר מָךְ
  choice: दीन जन का आदर कर
  rationale: הֹקֵיר का अर्थ आदर देना या मूल्यवान समझना है। מָךְ निर्धन, निर्बल अथवा निम्न दशा वाले व्यक्ति को सूचित करता है; ‘दीन जन’ इस अर्थ-विस्तार को केवल आर्थिक निर्धनता तक सीमित नहीं करता।
- source_word: וְאַל תִּתֵּן לְזֵר
  choice: और किसी पराए को न दे
  rationale: זָר का अर्थ पराया, बाहरी या विदेशी हो सकता है। ‘पराया’ जातीय अर्थ को अनावश्यक रूप से निश्चित किए बिना सामाजिक दूरी का व्यापक भाव बनाए रखता है।
theological_decisions:
- issue: מֵרָע को अमूर्त ‘बुराई’ मानें या व्यक्तिगत ‘बुरे मनुष्य’
  choice: मुख्य पाठ में ‘बुरे मनुष्य’
  alternative: ‘बुराई से रोक रख’; यूनानी के अनुसार ‘पापी की सहायता न कर’
  rationale: लַטּוֹב के व्यक्तिगत समानांतर और यूनानी τοῦ ἁμαρτωλοῦ से व्यक्तिगत संदर्भ समर्थित है। फिर भी हिब्रू की क्रिया ‘रोक रखना’ को बनाए रखा गया है, ताकि सहायता न करने की व्याख्या को अनावश्यक रूप से निश्चित न किया जाए।
- issue: לְזֵר का सामाजिक अथवा जातीय दायरा
  choice: ‘किसी पराए को’
  alternative: ‘किसी बाहरी को’ या ‘किसी विदेशी को’
  rationale: हिब्रू शब्द का दायरा व्यापक है; ‘पराया’ किसी विशेष जातीय या वाचा-संबंधी पहचान को पाठ में आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त ज्ञान-साहित्यीय आज्ञार्थक शैली। ‘दीन जन’ गरिमामय और सामान्यतः बोधगम्य है; ‘पराया’ मूल शब्द की व्यापकता बनाए रखता है।
