base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/008.yaml
  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
translation:
  language: hi
  text: सुख-समृद्धि में मित्र की पहचान नहीं होती[a], और विपत्ति में शत्रु छिपा नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक भाव है, “सुख में प्रेम करनेवाला/मित्र जाना नहीं जाता, और विपत्ति में घृणा करनेवाला/शत्रु छिपा नहीं रहता।” यूनानी समानांतर पाठ के पहले खंड में भिन्न शब्दावली है, जिसका मोटा अर्थ है, “अच्छी वस्तुओं में मित्र का बदला/प्रतिफल नहीं दिया जाएगा।” यहाँ उपलब्ध हिब्रू पाठ को प्राथमिक माना गया है; उससे सुख और विपत्ति के बीच संतुलित विरोध वाली सूक्ति बनती है।
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: मित्र
  rationale: यह कृदंत शाब्दिक रूप से ‘प्रेम करनेवाला’ है, पर इस ज्ञान-सूक्ति में मित्रता निभानेवाले व्यक्ति को दर्शाता है; यूनानी φίλος भी ‘मित्र’ अर्थ का समर्थन करता है।
- source_word: לֹא יִוָּדַע
  choice: पहचान नहीं होती
  rationale: ידע का निफ़अल रूप ‘जाना या पहचाना जाना’ व्यक्त करता है। यहाँ आशय यह है कि अनुकूल परिस्थितियाँ सच्चे मित्र को प्रकट नहीं करतीं; ‘पहचान नहीं होती’ आधुनिक हिन्दी में इस भाव को स्वाभाविक ढंग से रखता है।
- source_word: בַּטּוֹבָה
  choice: सुख-समृद्धि में
  rationale: शाब्दिक ‘भलाई में’ यहाँ अनुकूल दशा या अच्छे समय का संकेत है। ‘सुख-समृद्धि’ विपत्ति के साथ स्पष्ट और स्वाभाविक विरोध बनाता है।
- source_word: וְלֹא יְכֻסֶּה
  choice: छिपा नहीं रहता
  rationale: כסה का पुअल रूप ‘ढका या छिपाया जाना’ है। हिन्दी में ‘छिपा नहीं रहता’ यह भाव देता है कि विपत्ति शत्रुता को उजागर कर देती है।
- source_word: בְרָעָה
  choice: विपत्ति में
  rationale: यहाँ רעה नैतिक बुराई नहीं, बल्कि संकट या प्रतिकूल परिस्थिति को दर्शाता है।
- source_word: שׂוֹנֵא
  choice: शत्रु
  rationale: यह कृदंत शाब्दिक रूप से ‘घृणा करनेवाला’ है, पर सूक्ति में विरोधी या शत्रु व्यक्ति के अर्थ में प्रयुक्त है; यूनानी ἐχθρός इसकी पुष्टि करता है।
