base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/005.yaml
  text: Do not give him your bread[b][a], lest by it he set himself against you.
translation:
  language: hi
  text: उसे अपनी रोटी मत देना,[a] कहीं ऐसा न हो कि वह उस रोटी के सहारे तुम्हारे विरुद्ध खड़ा हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रोटी के पात्र/सामान’ जैसा एक कठिन पदबंध है; यूनानी समानांतर ‘रोटी’ या ‘भोजन’ के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘कहीं ऐसा न हो कि उनके द्वारा वह तुम पर प्रभुत्व जमाए।’ यूनानी समानांतर में अधिकार या प्रभुत्व पा लेने का भाव अधिक प्रबल है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: रोटी
  rationale: इब्रानी पदबंध शाब्दिक रूप से कठिन है और संभवतः ‘रोटी के पात्र/सामान’ जैसा रूप देता है। यूनानी समानांतर में ‘रोटियाँ’ हैं और संदर्भ भोजन देने का है; इसलिए ठोस बिंब बनाए रखते हुए स्वाभाविक हिन्दी ‘रोटी’ चुना गया।
- source_word: אַל תִּתֵּן לוֹ
  choice: उसे ... मत देना
  rationale: निषेधात्मक आज्ञा का सीधा और आधुनिक हिन्दी रूप।
- source_word: לָמָּה
  choice: कहीं ऐसा न हो कि
  rationale: प्राप्त इब्रानी में सामान्य अर्थ ‘क्यों’ वाक्य को कठिन बनाता है। यूनानी ἵνα μὴ स्पष्ट रूप से आशंकित परिणाम, अर्थात ‘कहीं ऐसा न हो’, दर्शाता है।
- source_word: בָם
  choice: उसी के सहारे
  rationale: इब्रानी में सर्वनाम बहुवचन ‘उनके द्वारा’ है, जो आरंभ के कठिन बहुवचन पदबंध से मेल खाता है। हिन्दी मुख्य पाठ में ‘रोटी’ एकवचन द्रव्यवाचक होने के कारण एकवचन रखा गया और साधन का भाव ‘के सहारे’ से व्यक्त किया गया।
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: वह तुम्हारे विरुद्ध खड़ा हो जाए
  rationale: इब्रानी क्रिया विरोध या सामना करने का भाव देती प्रतीत होती है। यह अनुवाद उस शत्रुतापूर्ण भाव को बचाता है, जबकि यूनानी के अधिक प्रबल ‘तुम पर प्रभुत्व जमाए’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और यूनानी समानांतर का संबंध
  choice: मुख्यतः इब्रानी का अनुसरण करते हुए, לָמָּה की चेतावनीसूचक शक्ति और अंतिम खंड के शत्रुतापूर्ण परिणाम को यूनानी समानांतर से स्पष्ट किया गया।
  alternative: 'यूनानी की ओर अधिक झुका अनुवाद: ‘उसकी रोटी रोक रखो और उसे मत दो, कहीं ऐसा न हो कि उनके द्वारा वह तुम पर प्रभुत्व जमाए।’'
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है, पर उसका वाक्य-विन्यास यहाँ कठिन है और स्रोत में मामूली असंगति चिह्नित है। यूनानी समानांतर आशय स्पष्ट करता है, पर उसे इब्रानी का पूर्ण प्रतिस्थापन नहीं बनाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘रोटी’ मूल के ठोस बिंब को बनाए रखती है; ‘उसी के सहारे’ उपहार को विरोध का साधन बनाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
