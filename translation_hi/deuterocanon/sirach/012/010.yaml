translation:
  language: hi
  text: अपने शत्रु पर कभी भरोसा न करो, क्योंकि जैसे काँसा ज़ंग खाता है, वैसे ही उसकी बुराई भी ज़ंग खाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू की दूसरी पंक्ति संक्षिप्त और कुछ कठिन है। यूनानी पाठ का अर्थ है: “जैसे काँसा ज़ंग खाता है, वैसे ही उसकी बुराई भी ज़ंग खाती है।”'
    reason: पाठगत कठिनाई और यूनानी समानांतर के सहारे लिए गए अर्थ को पारदर्शी बनाना।
lexical_decisions:
- source_word: אַל תַּאֲמִין
  choice: भरोसा न करो
  rationale: निषेधात्मक आज्ञा को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשׂוֹנֵא
  choice: अपने शत्रु पर
  rationale: शाब्दिक अर्थ ‘शत्रु/द्वेष रखने वाला’ है; यूनानी समानांतर में ‘तेरा शत्रु’ होने के कारण सम्बन्धसूचक ‘अपने’ स्वाभाविक है।
- source_word: לָעַד
  choice: कभी
  rationale: सन्दर्भ में इसका आशय स्थायी निषेध, अर्थात किसी भी समय भरोसा न करना है; ‘सदा के लिए’ हिन्दी में विपरीत अर्थ का भ्रम पैदा कर सकता है।
- source_word: כנחשת
  choice: जैसे काँसे पर
  rationale: נחשת ताँबे या काँसे की मिश्रधातु का संकेत दे सकता है; यूनानी χαλκός और परामर्श-पाठ के अनुरूप ‘काँसा’ चुना गया।
- source_word: רועו יחליא
  choice: उसकी बुराई पर भी [ज़ंग] चढ़ता है
  rationale: हिब्रू वाक्यांश संक्षिप्त और कुछ असामान्य है; इसे धातु के क्षरण वाले रूपक से जोड़ते हुए उसकी विचित्रता को मिटाए बिना हिन्दी में रखा गया।
theological_decisions:
- issue: क्या कथन शत्रु के कभी न सुधरने का निरपेक्ष धर्मवैज्ञानिक दावा है?
  choice: पद को व्यावहारिक सावधानी की सूक्ति के रूप में सीधे अनूदित किया गया।
  alternative: इसे इस दावे के रूप में विस्तार देना कि शत्रु का स्वभाव अनिवार्य रूप से कभी नहीं बदल सकता।
  rationale: मूल पाठ भरोसा न करने की चेतावनी देता है, पर पश्चात्ताप, क्षमा या व्यक्ति के बदलने के विषय में कोई स्पष्ट सिद्धान्त प्रस्तुत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञार्थक शैली सीधी, गम्भीर और सामान्य पाठक के लिए सुबोध रखी गई है। रूपक की असामान्यता को व्याख्यात्मक विस्तार देकर समाप्त नहीं किया गया।
