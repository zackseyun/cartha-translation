  text: Afterward you will understand my words[a], and for my sister you will sigh.
translation:
  language: hi
  text: बाद में तुम मेरी बातें समझोगे, और मेरी बहन के लिए आह भरोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानी पाठ कठिन है, विशेषकर वह पदबंध जिसका अनुवाद ‘मेरी बहन के लिए’ किया गया है। इसके बजाय यूनानी साक्षी में है: ‘वह एक घड़ी तक तुम्हारे साथ रहेगा, और यदि तुम मुड़ जाओ, तो वह टिका न रहेगा।’ यह बहुत भिन्न पाठ या व्याख्या को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: बाद में
  rationale: यह पदबंध समय के बाद के बिंदु की ओर संकेत करता है। ‘बाद में’ स्वाभाविक हिंदी है और यह तय नहीं करता कि अर्थ केवल ‘फिर’ है या ‘बहुत देर हो जाने पर।’
- source_word: תַּשִּׂיג
  choice: समझोगे
  rationale: נשׂג का मूल अर्थ ‘पहुँचना/जा पकड़ना’ है; ‘मेरी बातें’ के साथ इसका स्वाभाविक भाव उन बातों की समझ तक पहुँचना है। ‘समझोगे’ आधुनिक हिंदी में अर्थ स्पष्ट करता है, जबकि विलंबित बोध का भाव बनाए रखता है।
- source_word: אֲמָרַי
  choice: मेरी बातें
  rationale: प्रथम पुरुष प्रत्यय सहित बहुवचन का सीधा और सहज अनुवाद; ‘मेरे वचन’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक।
- source_word: וּלְאַחְוָתִי
  choice: मेरी बहन के लिए
  rationale: इब्रानी रूप कठिन है और बहन, नातेदारी या संगति से संबंधित संज्ञा की ओर संकेत कर सकता है। प्रेषित व्यंजन-पाठ का सबसे सीधा अर्थ ‘मेरी बहन’ है; इसलिए कठिनाई को सुधारे बिना मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: תִּתְאַנָּח
  choice: आह भरोगे
  rationale: क्रिया आह भरने या कराहने को व्यक्त करती है। ‘आह भरोगे’ सहज हिंदी है और भाव को अनावश्यक रूप से ‘विलाप’ जितना तीव्र नहीं बनाता।
theological_decisions:
- issue: भिन्न यूनानी समानांतर के बावजूद इब्रानी पाठ को प्राथमिकता
  choice: मुख्य पाठ उपलब्ध इब्रानी का अनुसरण करता है; यूनानी के पर्याप्त भिन्न पाठ को पादटिप्पणी में दिया गया है।
  alternative: 'यूनानी के आधार पर अनुवाद करना: ‘वह एक घड़ी तक तुम्हारे साथ रहेगा, और यदि तुम मुड़ जाओ, तो वह टिका न रहेगा।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। यहाँ यूनानी पाठ उल्लेखनीय रूप से भिन्न है, इसलिए उसे मुख्य पाठ की जगह दिए बिना पाठक के सामने स्पष्ट रूप से रखा गया है।
- issue: अर्थ की दृष्टि से अनिश्चित इब्रानी पदबंध
  choice: मुख्य पाठ में शाब्दिक और कठिन ‘मेरी बहन के लिए’ बनाए रखना
  alternative: इसे ‘मेरी संगति के लिए’ या ‘मेरे संबंधी के लिए’ जैसे अनुमानित अर्थ से सहज बनाना
  rationale: इब्रानी का अर्थ अनिश्चित है। किसी अनुमान को निर्विवाद अर्थ बनाकर प्रस्तुत करने के बजाय वास्तविक पाठगत कठिनाई को सुरक्षित रखना अधिक पारदर्शी है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली रखी गई है। ‘मेरी बहन के लिए’ असहज लग सकता है, पर मूल इब्रानी की वास्तविक कठिनाई और अस्पष्टता को जानबूझकर सुरक्षित रखा गया है; पादटिप्पणी भिन्न यूनानी साक्ष्य बताती है।
