translation:
  language: hi
  text: वह तब तक आगे नहीं बढ़ेगा, जब तक उसके भीतर आग न भड़क उठे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “वह अपना सिर हिलाएगा और अपने हाथों से ताली बजाएगा; वह बहुत कुछ फुसफुसाएगा और अपने चेहरे का भाव बदल देगा।” यह विस्तृत पाठ सम्भवतः उस शत्रुतापूर्ण व्यवहार की व्याख्या करता है जिसे इब्रानी में बहुत संक्षेप में कहा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: वह आगे नहीं बढ़ेगा
  rationale: עבר का मूल अर्थ ‘गुज़रना/आगे बढ़ना’ है। यह अनुवाद इब्रानी के मुहावरे को बनाए रखते हुए उस व्यक्ति के न टलने या अपनी हरकत जारी रखने का भाव व्यक्त करता है।
- source_word: עַד
  choice: तब तक ... जब तक
  rationale: यह पद विरोधी गतिविधि की समय-सीमा बताता है; आधुनिक हिन्दी में ‘तब तक ... जब तक’ स्वाभाविक है।
- source_word: תִּבְעַר
  choice: न भड़क उठे
  rationale: क्रिया स्त्रीलिंग एकवचन है और उसका स्वाभाविक कर्ता אֵשׁ (‘आग’) है। ‘भड़क उठे’ आग के जलने और तीव्र होने, दोनों भावों को सहज हिन्दी में रखता है।
- source_word: בּוֹ
  choice: उसके भीतर
  rationale: पूर्वसर्ग और सर्वनाम का सीधा अर्थ ‘उसमें’ है। व्यक्ति के लिए ‘उसके भीतर’ अधिक स्वाभाविक है और इब्रानी की अस्पष्ट रूपकात्मकता को बनाए रखता है।
- source_word: אֵשׁ
  choice: आग
  rationale: यहाँ आग क्रिया का कर्ता है। हिन्दी में बिना अनिश्चित उपपद के ‘आग’ स्वाभाविक और रूपक के अनुकूल है।
theological_decisions:
- issue: संक्षिप्त और कुछ हद तक दुरूह इब्रानी पाठ के स्थान पर विस्तृत यूनानी समानांतर को अपनाना या न अपनाना
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद किया गया और यूनानी पाठ को पादटिप्पणी में रखा गया।
  alternative: ‘वह अपना सिर हिलाएगा और अपने हाथों से ताली बजाएगा; वह बहुत कुछ फुसफुसाएगा और अपने चेहरे का भाव बदल देगा।’
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य यहाँ प्राथमिक है। यूनानी पाठ काफी अलग और अधिक विस्तृत है; वह किसी विस्तृत आधार-पाठ या व्याख्यात्मक विस्तार को दर्शा सकता है। इसलिए उसे मुख्य पाठ की जगह दिए बिना पाठक के लिए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आगे नहीं बढ़ेगा’ इब्रानी עבר की गति-संबंधी छवि को बचाता है, जबकि ‘उसके भीतर आग’ की वास्तविक रूपकात्मक अस्पष्टता को बिना सिद्धान्तगत व्याख्या के यथावत रखता है।
