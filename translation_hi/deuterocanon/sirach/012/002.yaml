base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/002.yaml
  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: hi
  text: धर्मी का भला कर, और तुझे प्रतिफल मिलेगा—यदि उससे नहीं, तो यहोवा से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में अंतिम वाक्यांश है, “यदि उससे नहीं, तो परमप्रधान से”; हिब्रू साक्ष्य में “यहोवा से” है।
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: भलाई कर
  rationale: हिफ़ील आज्ञार्थक यहाँ किसी दूसरे के हित में सक्रिय रूप से अच्छा करने को कहता है। ‘भलाई कर’ स्वाभाविक और मूल के निकट है।
- source_word: לַצַּדִּיק
  choice: धर्मी के साथ
  rationale: צַדִּיק नैतिक और धार्मिक दृष्टि से सीधे व्यक्ति को दर्शाता है। ‘धर्मी’ हिब्रू के अधिक निकट है; ‘के साथ भलाई कर’ आधुनिक हिन्दी में सहज है।
- source_word: תִּמְצָא
  choice: तुझे ... मिलेगा
  rationale: शाब्दिक अर्थ ‘तू पाएगा’ है। प्रतिफल के संदर्भ में ‘तुझे मिलेगा’ वही परिणाम सहज हिन्दी में व्यक्त करता है।
- source_word: תַשְׁלוּמַת
  choice: प्रतिफल
  rationale: यह शब्द किए गए कार्य के बदले मिलने वाले प्रत्युत्तर या भुगतान को दर्शाता है। ‘प्रतिफल’ गरिमापूर्ण और स्पष्ट है तथा केवल आर्थिक भुगतान तक सीमित नहीं करता।
- source_word: אִם לֹא מִמֶּנוּ
  choice: यदि उससे नहीं
  rationale: हिब्रू में पुल्लिंग एकवचन प्रत्यय है, जो उसी धर्मी व्यक्ति की ओर संकेत करता है। ‘उससे’ उस एकवचन संबंध को बनाए रखता है।
- source_word: מֵיְהֹוָה
  choice: यहोवा से
  rationale: मुख्य हिब्रू साक्ष्य में परमेश्वर का व्यक्तिगत नाम יהוה है। उसे ‘यहोवा’ के रूप में स्पष्टतः प्रस्तुत किया गया है; यूनानी पाठ का भिन्न शीर्षक पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम खंड में हिब्रू और यूनानी साक्ष्यों के बीच ईश्वरीय नाम/उपाधि का अंतर
  choice: यहोवा से
  alternative: परमप्रधान से
  rationale: विद्यमान हिब्रू इस पद का प्राथमिक स्रोत है और उसमें מֵיְהֹוָה है। यूनानी का παρὰ Ὑψίστου अर्थपूर्ण पाठांतर है, इसलिए उसे चुपचाप समरूप करने के बजाय पादटिप्पणी में दिया गया है।
- issue: धर्मी व्यक्ति के लिए एकवचन निर्देश
  choice: उससे
  alternative: उस व्यक्ति से
  rationale: हिब्रू का पुल्लिंग एकवचन प्रत्यय और यूनानी का एकवचन αὐτοῦ दोनों एक ही व्यक्ति की ओर संकेत करते हैं। हिन्दी ‘उससे’ संख्या को बनाए रखते हुए अनावश्यक लिंग-प्रदर्शन से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण शैली रखी गई है। एकवचन अनौपचारिक आज्ञार्थक ‘कर’ मूल हिब्रू की सीधी आज्ञा को व्यक्त करता है।
