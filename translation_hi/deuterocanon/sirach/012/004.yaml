base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/004.yaml
  text: Give to the godly, and do not support the sinner.[a]
translation:
  language: hi
  text: संकट के समय दुगुनी बुराई उसे आ घेरेगी; हर भलाई में भी वह उस तक जा पहुँचेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पंक्ति कठिन है। पहले खंड में ‘बुराई’ किसे घेरेगी, यह कर्म लुप्त है; दूसरे खंड में ‘उस तक’ पुल्लिंग एकवचन है। ‘हर भलाई में’ का सटीक संबंध भी अनिश्चित है। यूनानी पाठ बहुत भिन्न है: “धर्मी को दो, और पापी की सहायता न करो।”'
    reason: इब्रानी के लुप्त कर्म और कठिन दूसरे खंड को स्पष्ट करता है, तथा महत्वपूर्ण यूनानी पाठांतर को बिना उसे मुख्य पाठ में मिलाए सुरक्षित रखता है।
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: दुगुनी
  rationale: यह इब्रानी मुहावरा किसी मात्रा के दो गुना होने का अर्थ देता है।
- source_word: רָעָה תַּשִּׂיג
  choice: बुराई तुम्हें आ घेरेगी
  rationale: תשיג का मूल अर्थ ‘पकड़ लेना/जा पहुँचना’ है। इब्रानी में कर्म स्पष्ट नहीं है; संदर्भ के आधार पर ‘तुम्हें’ जोड़ा गया है।
- source_word: בְּעֵת צֹרֶךְ
  choice: संकट की घड़ी में
  rationale: צֹרֶךְ यहाँ अभाव, कठिनाई या संकट की अवस्था बताता है; सहज हिन्दी में ‘संकट की घड़ी’ उपयुक्त है।
- source_word: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו
  choice: हर उस भलाई के बदले जो तुम उसे पहुँचाओगे
  rationale: हिफ़ील रूप תַּגִּיעַ को ‘उस तक पहुँचाना’ समझा गया है। בְּכָל को प्रसंगानुसार प्रतिफल-संबंधी ‘हर ... के बदले’ के रूप में व्यक्त किया गया है, यद्यपि वाक्यांश कठिन है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी परंपरा में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी: ‘धर्मी को दो, और पापी की सहायता न करो।’'
  rationale: निर्देश के अनुसार मूल-भाषा के दिए गए इब्रानी स्रोत को प्राथमिकता दी गई है। वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है, न कि यूनानी अर्थ को मुख्य पाठ में मिला दिया गया है।
- issue: अव्यक्त कर्म
  choice: ‘तुम्हें’ को स्पष्टता के लिए जोड़ा
  alternative: ‘दुगुनी बुराई आ घेरेगी’
  rationale: इब्रानी में किसे बुराई आ घेरेगी, यह व्यक्त नहीं है। दूसरे पुरुष के अगले क्रियापद और प्रसंग से ‘तुम्हें’ संभावित है, पर इस अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कठिन इब्रानी वाक्य-विन्यास को पठनीय बनाया गया है, जबकि उसकी अनिश्चितता और यूनानी पाठांतर पादटिप्पणी में संरक्षित हैं।
