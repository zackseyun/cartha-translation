  text: I have seen many things in my wandering, and my understanding is more than my words.[b][a]
translation:
  language: hi
  text: मैंने अपने भटकने में बहुत कुछ देखा है,[b] और मेरी समझ मेरे शब्दों से बढ़कर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: काहिरा गनीज़ा की यहाँ दी गई इब्रानी पंक्ति इस पद के अर्थ से मेल नहीं खाती और संभवतः कहीं और से विस्थापित सामग्री है; इसलिए अनुवाद सिराख 34:11 के यूनानी पाठ-साक्ष्य का अनुसरण करता है।
    reason: textual_variant
  - marker: b
    text: ‘अपने भटकने में’ का अनुवाद ‘अपनी भूल में,’ ‘अपनी यात्राओं में,’ या ‘राह से भटकते हुए’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ ἑόρακα
  choice: मैंने बहुत कुछ देखा है
  rationale: यूनानी साक्ष्य का यह प्रथम-पुरुष कथन पूर्ण अनुभव का भाव देता है; हिन्दी में ‘देखा है’ स्वाभाविक है और ‘बहुत कुछ’ बहुविध अनुभवों को स्पष्ट करता है।
- source_word: ἐν τῇ ἀποπλανήσει μου
  choice: अपने भटकने में
  rationale: ἀποπλάνησις में भटकने, फिरने अथवा राह से चूकने की अर्थ-छाया हो सकती है। ‘भटकने’ अनुभव और संभावित च्युत होने—दोनों की अस्पष्टता को बिना अनावश्यक नैतिक निर्णय के बनाए रखता है।
- source_word: πλείονα τῶν λόγων μου
  choice: मेरे शब्दों से बढ़कर
  rationale: यूनानी का संक्षिप्त तुलनात्मक वाक्यांश समझ को व्यक्त किए गए शब्दों से अधिक बताता है। यह हिन्दी रूप मूल तुलना को सुरक्षित रखते हुए सहज है।
- source_word: σύνεσίς μου
  choice: मेरी समझ
  rationale: σύνεσις ज्ञान-साहित्य में समझ या विवेक को दर्शाता है; ‘समझ’ आधुनिक सामान्य हिन्दी में सबसे सीधा और व्यापक रूप से बोधगम्य विकल्प है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों के बीच मूलभूत असंगति
  choice: इस पद का अनुवाद उपलब्ध यूनानी समानांतर पाठ से करना और इब्रानी पाठ की असंगति को पादटिप्पणी में बताना
  alternative: उपलब्ध काहाना इब्रानी पंक्ति का अनुवाद करना, जो किसी दूसरे प्रसंग की विस्थापित सामग्री प्रतीत होती है
  rationale: दी गई इब्रानी पंक्ति का अर्थ सिराख 34:11 के यूनानी पाठ और अपेक्षित प्रसंग से मेल नहीं खाता तथा स्रोत ने स्वयं इसे major_mismatch चिह्नित किया है। इसलिए इस पद के लिए सुसंगत यूनानी साक्ष्य का अनुसरण किया गया है, जबकि पाठगत समस्या को खुलकर दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘भटकने’ मूल यूनानी की यात्रा, विचलन और भूल से जुड़ी अर्थगत अस्पष्टता को बचाता है। पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
