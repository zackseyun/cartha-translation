  yaml_path: translation/deuterocanon/sirach/034/008.yaml
  text: Without falsehood the law will be fulfilled[b][a], and wisdom is perfection for a faithful mouth.
translation:
  language: hi
  text: झूठ के बिना व्यवस्था पूरी होगी, और बुद्धि विश्वासयोग्य मुख में पूर्णता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्य मुख के लिए बुद्धि पूर्णता है।” अंतिम उपवाक्य का यूनानी वाक्य-विन्यास अत्यंत संक्षिप्त है और दत्तिव पदबंध का संबंध थोड़ा भिन्न ढंग से भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इस पद का अंतिम उपवाक्य वाक्य-विन्यास की दृष्टि से कठिन है। यह अनुवाद उपलब्ध यूनानी शब्दों का अनुसरण करता है, पर उनके सटीक संबंध के विषय में आवश्यकता से अधिक निश्चितता का दावा नहीं करता।
    reason: textual_variant
lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: झूठ के बिना
  rationale: ἄνευ के साथ संबंधकारक ψεύδους अभाव को व्यक्त करता है। ‘झूठ के बिना’ सरल और सीधा है तथा नैतिक अर्थ को बनाए रखता है।
- source_word: συντελεσθήσεται
  choice: पूरी होगी
  rationale: यह συντελέω का भविष्यत् कर्मवाच्य रूप है और किसी बात के पूर्ण किए जाने या अपने लक्ष्य तक पहुँचने का भाव देता है। व्यवस्था के साथ ‘पूरी होगी’ स्वाभाविक है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: νόμος का सीधा और पारंपरिक बाइबिलीय हिन्दी समतुल्य ‘व्यवस्था’ है। ‘शिक्षा’ संभव है, पर यहाँ यूनानी शब्द के विधि-संबंधी अर्थ को खुला रखना उचित है।
- source_word: σοφία
  choice: बुद्धि
  rationale: σοφία के लिए ‘बुद्धि’ आधुनिक हिन्दी में स्वाभाविक और बाइबिलीय ज्ञान-साहित्य के अनुकूल है।
- source_word: στόματι πιστῷ
  choice: विश्वासयोग्य मुख में
  rationale: στόματι πιστῷ दत्तिव पदबंध है। ‘विश्वासयोग्य मुख में’ मुख के मूल रूपक और ‘में’ वाले संभावित दत्तिव संबंध को बनाए रखता है, यद्यपि यूनानी वाक्य-विन्यास संक्षिप्त है।
- source_word: τελείωσις
  choice: पूर्णता
  rationale: τελείωσις पूर्ण किए जाने, सिद्धि या पूर्णता का बोध कराता है। ‘पूर्णता’ सूत्रात्मक कथन में उपयुक्त है और ‘समापन’ की अपेक्षा गुणात्मक अर्थ को भी बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में νόμος का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: मूल यूनानी में νόμος स्पष्ट है। ‘शिक्षा’ संदर्भगत संभावना है, किंतु उससे अर्थ अनावश्यक रूप से संकुचित हो सकता है; इसलिए अधिक पारदर्शी ‘व्यवस्था’ रखा गया है।
- issue: στόματι πιστῷ का वाक्यगत संबंध
  choice: ‘विश्वासयोग्य मुख में’ के रूप में प्रस्तुत
  alternative: ‘विश्वासयोग्य मुख के लिए’ अथवा ‘विश्वासयोग्य मुख को’
  rationale: दत्तिव का संबंध संक्षिप्त और कुछ अस्पष्ट है। मुख्य पाठ ‘में’ को अपनाता है, जबकि टिप्पणी अन्य संभव संबंध को सुरक्षित रखती है और निश्चितता का अति-दावा नहीं करती।
- issue: τελείωσις का अर्थ
  choice: पूर्णता
  alternative: पूर्ति अथवा सिद्धि
  rationale: शब्द किसी बात को पूर्ण दशा तक पहुँचाने या पूर्णता का संकेत दे सकता है। ‘पूर्णता’ मूल कथन के तनाव को बनाए रखती है और इसे केवल किसी क्रिया के समाप्त होने तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक रखी गई है। ‘विश्वासयोग्य मुख’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर यह मूल यूनानी के ‘मुख’ रूपक और उसकी वास्तविक वाक्यगत कठिनाई को सुरक्षित रखता है।
