translation:
  language: hi
  text: एक प्रार्थना करता है और दूसरा शाप देता है—स्वामी किसकी आवाज़ सुनेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχόμενος
  choice: प्रार्थना करता है
  rationale: यहाँ कृदन्त का स्वाभाविक हिन्दी रूप है और निकटवर्ती καταρώμενος के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: καταρώμενος
  choice: शाप देता है
  rationale: यूनानी क्रिया का सीधा और सामान्य अर्थ व्यक्त करता है; इसे केवल बुरा कहने या निंदा करने तक सीमित नहीं करता।
- source_word: τίνος φωνῆς
  choice: किसकी आवाज़
  rationale: सम्बन्धवाचक τίνος और संज्ञा φωνῆς दोनों को स्पष्ट रखते हुए मूल प्रश्न की व्यक्ति-केंद्रित अस्पष्टता सुरक्षित रखता है।
- source_word: εἰσακούσεται
  choice: सुनेगा
  rationale: सन्दर्भ में इसका आशय ध्यान देकर सुनना है; सरल हिन्दी में प्रश्न का बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: δεσπότης के अधिकार और प्रभुत्व-सूचक अर्थ को बनाए रखता है तथा इसे अलग यूनानी उपाधि κύριος के साथ अनावश्यक रूप से एक नहीं करता।
theological_decisions:
- issue: ὁ δεσπότης के लिए ईश्वरीय संबोधन
  choice: स्वामी
  alternative: प्रभु
  rationale: मूल पाठ यहाँ δεσπότης कहता है। “स्वामी” उसके शाब्दिक अधिकार-सूचक भाव को सुरक्षित रखता है, जबकि सन्दर्भ से उसका ईश्वर के लिए प्रयोग स्पष्ट है।
- issue: प्रश्न का लक्ष्य
  choice: किसकी आवाज़
  alternative: कौन-सी आवाज़
  rationale: यूनानी τίνος स्वामित्व/सम्बन्ध का प्रश्न करता है—अर्थात दोनों व्यक्तियों में किसकी आवाज़। यह अनुवाद उस भेद को बिना यह तय किए बनाए रखता है कि स्वामी वास्तव में किसकी सुनेगा।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर रचना “एक…और दूसरा…” से यूनानी वाक्य का विरोध स्पष्ट होता है; प्रश्न के उत्तर को जानबूझकर अनिर्णीत रखा गया है।
