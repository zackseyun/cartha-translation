  text: He does not show partiality to the poor[a], and he hears the plea of the oppressed.
translation:
  language: hi
  text: वह निर्धन के साथ पक्षपात नहीं करता[a], और सताए हुए की विनती सुनता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में है: “जो प्रभु का भय मानते हैं, उनकी आत्मा जीवित रहेगी, क्योंकि उनकी आशा उन्हें बचानेवाले पर है।” यहाँ यूनानी पाठ उपलब्ध हिब्रू से पर्याप्त रूप से भिन्न पाठ-रूप दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: לא ישא פנים אל דל
  choice: वह निर्धन के साथ पक्षपात नहीं करता
  rationale: नשא פנים एक मुहावरा है जिसका अर्थ पक्षपात या विशेष कृपा दिखाना है। ‘के साथ पक्षपात’ आधुनिक हिन्दी में स्वाभाविक है और हिब्रू אל को अनावश्यक रूप से ‘विरुद्ध’ बनाकर अर्थ स्पष्ट नहीं करता।
- source_word: דל
  choice: निर्धन
  rationale: דל आर्थिक अभाव के साथ सामाजिक निर्बलता भी सूचित कर सकता है। ‘निर्धन’ यहाँ सीधा और गरिमापूर्ण है; समानांतर पंक्ति उसकी असहाय दशा को आगे स्पष्ट करती है।
- source_word: ותחנוני
  choice: और ... की विनती
  rationale: תחנונים सहायता या दया के लिए की गई गिड़गिड़ाहट अथवा प्रार्थना है। सामूहिक/तीव्रतासूचक रूप को स्वाभाविक हिन्दी में ‘विनती’ कहा गया है।
- source_word: מצוק
  choice: सताए हुए
  rationale: מצוק दबाव, संकट या उत्पीड़न में पड़े व्यक्ति को दर्शाता है। ‘सताए हुए’ सामाजिक उत्पीड़न का भाव रखता है और ‘निर्धन’ के समानांतर सहज बैठता है।
- source_word: ישמע
  choice: सुनता है
  rationale: ज्ञान-साहित्य के सामान्य सत्य में हिब्रू अपूर्ण क्रिया को अभ्यस्त वर्तमान के रूप में लेना उचित है।
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται, ἡ γὰρ ἐλπὶς αὐτῶν ἐπὶ τὸν σώζοντα αὐτούς
  choice: मुख्य पाठ में नहीं अपनाया गया
  rationale: यूनानी साक्षी उपलब्ध हिब्रू से मूलतः भिन्न पाठ प्रस्तुत करती है। जहाँ हिब्रू उपलब्ध है वहाँ उसे मुख्य पाठ का आधार बनाया गया है और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: उपलब्ध हिब्रू और यूनानी साक्षियों का पर्याप्त पाठांतर
  choice: मुख्य पाठ में काहाना के काहिरा गनीज़ा-आधारित हिब्रू पाठ का अनुसरण; यूनानी पाठ पादटिप्पणी में
  alternative: “जो प्रभु का भय मानते हैं, उनकी आत्मा जीवित रहेगी, क्योंकि उनकी आशा उन्हें बचानेवाले पर है।”
  rationale: इस पद पर यूनानी पाठ हिब्रू का निकट अनुवाद नहीं, बल्कि एक पर्याप्त भिन्न पाठ-रूप है। जीवित हिब्रू साक्ष्य को प्राथमिकता देते हुए महत्वपूर्ण यूनानी पाठांतर को पारदर्शिता के लिए दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। न्याय-संबंधी मुहावरे को स्वाभाविक हिन्दी में रखा गया है और पाठांतर को बिना मिलाए पादटिप्पणी में सुरक्षित किया गया है।
