- source_word: τὴν καρδίαν σου
  choice: अपना मन
  rationale: यहाँ καρδία भीतरी ध्यान, भरोसे और झुकाव को दर्शाता है। आधुनिक हिन्दी में ‘मन’ इस मुहावरे को ‘हृदय’ से अधिक स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: ἐν ἐπισκοπῇ का अर्थ
  choice: मुख्य पाठ में ‘दर्शन के रूप में’, साथ में व्यापक अर्थों की पादटिप्पणी
  alternative: ‘निरीक्षण में’, ‘देखरेख में’, या ‘भेंट के समय’
  rationale: यूनानी पद दैवी भेंट, निरीक्षण या देखरेख के लिए खुला है। हिन्दी में केवल ‘निरीक्षण में’ कहना अस्पष्ट और कृत्रिम होता; ‘दर्शन’ प्रसंग में समझने योग्य है, जबकि पादटिप्पणी अन्य वास्तविक संभावनाएँ बनाए रखती है।
- issue: स्वप्न के दैवी स्रोत की संभावना
  choice: शर्त को वास्तविक संभावना के रूप में बनाए रखना
  alternative: सभी स्वप्नों को बिना अपवाद अविश्वसनीय बताना
  rationale: वचन स्वप्नों पर भरोसा करने से रोकता है, पर परमप्रधान की ओर से भेजे जाने की शर्त रखता है; अनुवाद इस तनाव को समाप्त नहीं करता।
