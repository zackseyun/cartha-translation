  choice: भेजा गया हो
  rationale: यह अप्रत्यक्ष भूतकालिक कर्मवाच्य संभावनार्थक रूप को हिन्दी की शर्तसूचक रचना में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἐπισκοπῇ
