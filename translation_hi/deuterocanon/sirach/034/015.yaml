  text: Judge your neighbor's feelings by your own, and think carefully about every matter.[a]
translation:
  language: hi
  text: अपने ही अनुभव से अपने पड़ोसी की दशा समझो, और हर मामले पर सोच-विचार करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहाना के काहिरा गनीज़ा पर आधारित इब्रानी साक्षी में यहाँ बहुत भिन्न पाठ है: “क्या गाल पर आँसू नहीं ढलकता, और उसके विद्रोहियों पर आह नहीं उठती?” इस पद की पाठ-परंपरा अनिश्चित है; मुख्य पाठ यूनानी पाठ का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: समझो
  rationale: आज्ञार्थक क्रिया विचारपूर्वक समझने या पहचानने का भाव देती है; ‘समझो’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक न्यायिक अर्थ से बचती है।
- source_word: τὰ τοῦ πλησίον
  choice: अपने पड़ोसी की दशा
  rationale: यूनानी पद व्यापक रूप से पड़ोसी से संबंधित बातों या उसकी स्थिति को दर्शाता है। ‘दशा’ इस व्यापकता को रखता है और केवल भावनाओं तक अर्थ को सीमित नहीं करता।
- source_word: ἐκ σεαυτοῦ
  choice: अपने ही अनुभव से
  rationale: इसका आशय स्वयं को आधार बनाकर दूसरे की स्थिति समझना है। ‘अनुभव’ निहित अर्थ को सहज हिन्दी में स्पष्ट करता है।
- source_word: ἐπὶ παντὶ πράγματι
  choice: हर मामले पर
  rationale: यह पद प्रत्येक विषय या व्यवहारगत मामले के संबंध में विचार करने की बात कहता है।
- source_word: διανοοῦ
  choice: सोच-विचार करो
  rationale: आज्ञार्थक रूप सावधान और मन लगाकर विचार करने का निर्देश देता है; यह हिन्दी प्रयोग उसके सतत चिंतनात्मक बल को व्यक्त करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी साक्षी और यूनानी समानांतर पाठ के बीच बड़ा पाठांतर
  choice: मुख्य पाठ में सुसंगत यूनानी पाठ का अनुवाद, और इब्रानी पाठ को पादटिप्पणी में सुरक्षित रखना
  alternative: 'इब्रानी पंक्ति का अनुवाद: ‘क्या आँसू गाल पर नहीं बहता, और उसके उजाड़नेवालों/विद्रोहियों के कारण आह नहीं निकलती?’'
  rationale: दिया गया इब्रानी पाठ इस पद के यूनानी पाठ और उसके ज्ञान-साहित्य संबंधी संदर्भ से बिल्कुल अलग है तथा स्रोत में इसे major_mismatch कहा गया है। यूनानी पाठ एक पूर्ण और सुसंगत उपदेश देता है; फिर भी इब्रानी साक्षी महत्वपूर्ण है, इसलिए उसका पाठांतर स्पष्ट रूप से पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पड़ोसी’ नैतिक निकटस्थ व्यक्ति के पारंपरिक अर्थ को बनाए रखता है; ‘दशा’ यूनानी पद की व्यापकता बचाता है, जबकि ‘अपने ही अनुभव से’ आत्म-सादृश्य द्वारा समझने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
