base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: hi
  text: 'परमेश्वर भी विलम्ब न करेगा[a];

    वह योद्धा के समान निकल पड़ेगा और अपने को न रोकेगा,


    जब तक वह निर्दयी की कमर कुचल न दे

    और राष्ट्रों पर प्रतिशोध न ले;


    जब तक वह अहंकार का राजदंड हटा न दे

    और दुष्टों का राजदंड पूरी तरह काट न डाले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए उपलब्ध यूनानी साक्ष्य में इसके स्थान पर यह पाठ है: “प्राण को ऊँचा उठाता, आँखों को प्रकाश देता, और चंगाई, जीवन और आशीष देता है।” यह वर्तमान इब्रानी पाठ से अत्यन्त भिन्न पाठ-परंपरा को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: גם אל
  choice: परमेश्वर भी
  rationale: גם के बलाघात को ‘भी’ से व्यक्त किया गया है। प्रसंगगत सूक्ष्म अर्थ ‘यहाँ तक कि’ या ‘निश्चय ही’ भी हो सकता है, पर मुख्य पाठ में सहज और निकट रूप रखा गया है।
- source_word: לא יתמהמה
  choice: देर न करेगा
  rationale: क्रिया का अर्थ विलम्ब करना या ठहर जाना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כגבור יצא
  choice: योद्धा के समान निकल पड़ेगा
  rationale: न्याय और संघर्ष की पृष्ठभूमि में גבור को ‘योद्धा’ कहना उसके सामरिक भाव को बनाए रखता है; ‘निकल पड़ेगा’ निर्णायक प्रस्थान दर्शाता है।
- source_word: לא יתאפק
  choice: अपने को न रोकेगा
  rationale: यह आत्म-संयम या स्वयं को रोकने का भाव सीधे व्यक्त करता है।
- source_word: ימחץ
  choice: कुचल न दे
  rationale: מחץ की प्रबल और हिंसक न्याय-छवि को बिना नरम किए व्यक्त करता है।
- source_word: מתני אכזרי
  choice: निर्दयी की कमर
  rationale: מתנים का ठोस शारीरिक बिंब ‘कमर’ से सुरक्षित रहता है; אכזרי को एक सामान्यीकृत एकवचन ‘निर्दयी’ माना गया है।
- source_word: לגוים ישיב נקם
  choice: राष्ट्रों पर प्रतिशोध न ले
  rationale: शाब्दिक ‘प्रतिशोध लौटाना’ हिन्दी में असहज है। ‘प्रतिशोध लेना’ प्रत्युपकारात्मक न्याय का भाव स्वाभाविक रूप से देता है, और ‘पर’ राष्ट्रों को न्याय के लक्ष्य के रूप में स्पष्ट करता है।
- source_word: יוריש
  choice: हटा न दे
  rationale: हिफ़ील रूप किसी को अधिकार या स्थान से वंचित करने का भाव रखता है। राजदंड के साथ ‘हटा देना’ शासन-सत्ता को दूर करने का स्वाभाविक हिन्दी रूप है।
- source_word: שבט זדון
  choice: अहंकार का राजदंड
  rationale: שבט यहाँ शासन का चिह्न हो सकता है और זדון उद्दंड अहंकार को दर्शाता है; ‘राजदंड’ दमनकारी सत्ता की छवि बनाए रखता है।
- source_word: מטה רשע
  choice: दुष्ट की लाठी
  rationale: מטה के लिए ‘लाठी’ रखकर समानांतर सत्ता-बिंब बना रहता है, जबकि שבט के ‘राजदंड’ की हूबहू पुनरावृत्ति नहीं होती; רשע को व्यक्तिवाचक ‘दुष्ट’ समझा गया है।
- source_word: גדוע יגדע
  choice: पूरी तरह काट न डाले
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया की पुनरुक्ति से आए बल को ‘पूरी तरह’ और ‘डाले’ व्यक्त करते हैं।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परंपराओं में गंभीर भिन्नता
  choice: मुख्य पाठ जीवित इब्रानी साक्ष्य के अनुसार अनूदित किया गया है।
  alternative: 'यूनानी पाठ का अर्थ है: ‘प्राण को ऊँचा उठाता, आँखों को प्रकाश देता, और चंगाई, जीवन और आशीष देता है।’'
  rationale: परियोजना के सिद्धांत के अनुसार उपलब्ध इब्रानी पाठ प्राथमिक है। यूनानी साक्ष्य इसका निकट अनुवाद नहीं, बल्कि सारतः भिन्न पाठ है; इसलिए दोनों को मिलाने के बजाय यूनानी रूप को पाठांतर-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता और इब्रानी की तीव्र न्याय-छवियाँ सुरक्षित हैं; अस्वाभाविक शाब्दिक मुहावरों को अर्थ-समान स्वाभाविक हिन्दी में बदला गया है।
