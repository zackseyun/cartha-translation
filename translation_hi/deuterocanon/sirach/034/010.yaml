  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: hi
  text: जिसे परखा नहीं गया है, वह बहुत कम जानता है; पर जो भटका हुआ है[b], उसकी चालाकी बढ़ती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध इब्रानी पंक्ति इस पद के यूनानी पाठ से मेल नहीं खाती; इसलिए अनुवाद में यहाँ यूनानी साक्ष्य का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: या “जो मार्ग से भटक गया है” अथवा “जो बहकाया गया है”; यूनानी शब्द वास्तविक भटकने या आलंकारिक विचलन—दोनों का भाव दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: जिस मनुष्य की परीक्षा नहीं हुई
  rationale: यूनानी क्रिया परीक्षा, परखे जाने और अनुभव प्राप्त करने के भाव समेटती है। यह अनुवाद अनुभव की अंतर्ध्वनि को बनाए रखते हुए मूल के कर्मवाच्य रूप के निकट रहता है।
- source_word: ὀλίγα οἶδεν
  choice: वह थोड़ा ही जानता है
  rationale: यह सीमित ज्ञान व्यक्त करने वाले यूनानी मुहावरे का सहज आधुनिक हिन्दी रूप है।
- source_word: ὁ δὲ πεπλανημένος
  choice: पर जो भटका है
  rationale: πλανάω का अर्थ भटकना, मार्ग से हटना अथवा बहकाया जाना हो सकता है। ‘भटका है’ यात्रा और आलंकारिक विचलन—दोनों संभावनाएँ खुली रखता है।
- source_word: πληθυνεῖ
  choice: बढ़ाता है
  rationale: यह ‘बढ़ाना’ या ‘बहुत करना’ के सीधे क्रियार्थ को व्यक्त करता है।
- source_word: πανουργίαν
  choice: चतुराई
  rationale: πανουργία व्यावहारिक सूझ-बूझ से लेकर नकारात्मक धूर्तता तक अर्थ दे सकता है। ‘चतुराई’ इस संदर्भ में उस द्विअर्थी धार को अपेक्षाकृत सुरक्षित रखती है; विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: प्रस्तुत इब्रानी पाठ और इस पद के यूनानी साक्ष्य में मूलभूत असंगति
  choice: इस पद का अनुवाद यूनानी समानांतर साक्ष्य से किया गया और इब्रानी असंगति को पादटिप्पणी में बताया गया
  alternative: प्रस्तुत इब्रानी पंक्ति का इसी पद के रूप में अनुवाद करना
  rationale: प्रस्तुत इब्रानी पंक्ति (‘उसे उसकी देन के अनुसार दे...’) सिराख 34:10 के यूनानी पाठ से मेल नहीं खाती और संभवतः किसी अन्य स्थान की है। अतः असंबद्ध इब्रानी पंक्ति को इस पद पर थोपने के बजाय यूनानी साक्ष्य का अनुसरण करना तथा पाठांतर को स्पष्ट करना अधिक पारदर्शी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। ‘मनुष्य’ सामान्यवाचक एकवचन को दर्शाता है। मुख्य पाठ में जानबूझकर ऐसी शब्दावली चुनी गई है जो अनुभव से उपजी समझ और नैतिक रूप से संदिग्ध चालाकी के बीच यूनानी पाठ के तनाव को पूरी तरह समाप्त न करे।
