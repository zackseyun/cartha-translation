base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: hi
  text: भविष्य-कथन, शकुन-विचार[b] और स्वप्न व्यर्थ हैं; प्रसव-वेदना से गुजरती स्त्री की तरह हृदय कल्पनाएँ गढ़ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध कराई गई इब्रानी पंक्ति का अर्थ है, “उदार दृष्टि से निर्धन को दे, और उसे देते समय क्रोधित न हो।” वह संभवतः किसी दूसरे पद या असंगत पाठ-साक्षी को दर्शाती है। यहाँ अनुवाद यूनानी पाठ के आधार पर किया गया है।
    reason: textual_variant
  - marker: b
    text: या “शकुनों की व्याख्या।” यूनानी शब्द संकेतों को भावी घटनाओं का सूचक मानकर उनकी व्याख्या करने की प्रथा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: भविष्य-कथन
  rationale: यह यूनानी शब्द भविष्य जानने के लिए की जाने वाली दैवी या गूढ़ प्रथाओं को सूचित करता है। ‘भविष्य-कथन’ आधुनिक पाठक के लिए स्पष्ट है और किसी एक विशेष विधि तक अर्थ को सीमित नहीं करता।
- source_word: οἰωνισμοί
  choice: शकुन-विचार
  rationale: शब्द संकेतों को शुभ-अशुभ या भावी घटनाओं के सूचक मानकर उनकी व्याख्या करने की क्रिया को दर्शाता है। ‘शकुन-विचार’ केवल शकुनों के अस्तित्व के बजाय उन्हें पढ़ने की प्रथा को व्यक्त करता है।
- source_word: ἐνύπνια
  choice: स्वप्न
  rationale: यह स्वप्न अथवा निद्रा में दिखाई देने वाले दृश्य का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: μάταιά
  choice: व्यर्थ
  rationale: यह उनकी निष्फलता और अविश्वसनीयता व्यक्त करता है; ‘व्यर्थ’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: καρδία
  choice: हृदय
  rationale: बाइबलीय प्रयोग में यह विचार और अनुभूति के भीतरी केंद्र को दर्शाता है। ‘हृदय’ स्रोत-रूपक और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: φαντάζεται
  choice: कल्पनाएँ करता है
  rationale: क्रिया मन में दृश्य या आभास गढ़ने का भाव देती है। बहुवचन ‘कल्पनाएँ’ मुहावरेदार हिन्दी बनाता है और इसे सीधे मानसिक भ्रम घोषित करके अर्थ को नहीं बढ़ाता।
- source_word: ὡς ὠδινούσης
  choice: प्रसव-वेदना में पड़ी स्त्री के समान
  rationale: स्त्रीलिंग कृदन्त प्रसव-पीड़ा से गुजरती स्त्री की उपमा देता है। यह रूप उपमा को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: उपलब्ध इब्रानी पंक्ति और सिराख 34:5 के यूनानी पाठ में गंभीर असंगति
  choice: मुख्य पाठ का अनुवाद इस पद के सुसंगत यूनानी साक्ष्य से किया गया है और इब्रानी असंगति को पादटिप्पणी में स्पष्ट किया गया है।
  alternative: 'दी गई इब्रानी पंक्ति का अनुवाद: ‘उदार दृष्टि से निर्धन को दे, और उसे देते समय क्रोधित न हो।’'
  rationale: दी गई इब्रानी पंक्ति इस पद के यूनानी कथ्य से अर्थतः असंबद्ध है और स्रोत में ‘major_mismatch’ के रूप में चिह्नित है। इसलिए पद-संदर्भ से मेल खाने वाले यूनानी साक्ष्य को आधार बनाना और पाठगत समस्या को खुले रूप में बताना अधिक उत्तरदायी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण बाइबलीय शैली रखी गई है। तकनीकी ‘भविष्य-कथन’ और ‘शकुन-विचार’ को सामान्य पाठक के लिए स्पष्ट रखा गया है; ‘हृदय’ स्रोत की बाइबलीय मानवशास्त्रीय उपमा को सुरक्षित रखता है।
