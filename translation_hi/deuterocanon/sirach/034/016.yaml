translation:
  language: hi
  text: उसने कृपा के चिह्न रख दिए[a], और पुकार ने बादल को शीघ्र चलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “और उसका सहारा कौन है?” उपलब्ध इब्रानी से यूनानी पाठ बहुत अलग है; इससे संकेत मिलता है कि यहाँ पाठ का रूप काफी भिन्न रहा होगा।'
    reason: textual_variant
lexical_decisions:
- source_word: תמרורי
  choice: चिह्न
  rationale: यह शब्द दिखाई देने वाले संकेतों या निशानों को सूचित करता है। ‘चिह्न’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से इसे शकुन नहीं बनाता।
- source_word: רצון
  choice: कृपा
  rationale: यहाँ רצון का अर्थ अनुकूलता या सद्भाव है। ‘कृपा’ संक्षिप्त और सहज है, यद्यपि मूल में ‘स्वीकृति’ या ‘प्रसन्नता’ की छाया भी संभव है।
- source_word: הניחה
  choice: रख दिए
  rationale: क्रिया का ठोस भाव किसी वस्तु को रखने या स्थापित करने का है। ‘रख दिए’ हिन्दी में स्वाभाविक रहते हुए उस क्रियात्मक बल को बनाए रखता है।
- source_word: וצעקה
  choice: और एक पुकार से
  rationale: צעקה को संज्ञा ‘पुकार’ माना गया है। करणवाचक ‘से’ अगली संक्षिप्त और कठिन पंक्ति के संभावित प्रेरक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ענן
  choice: बादल
  rationale: एकवचन संज्ञा का सीधा और ठोस अनुवाद ‘बादल’ है; हिन्दी में यहाँ अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: חשתה
  choice: शीघ्र बढ़ चला
  rationale: मूल धातु शीघ्रता का भाव देती है। वाक्य-विन्यास कठिन है, इसलिए यह चयन बादल की तीव्र गति को व्यक्त करता है, बिना उसकी दिशा या गंतव्य जोड़ने के।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों के बीच गंभीर भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी को आधार बनाया गया और यूनानी के बहुत भिन्न पाठ को पादटिप्पणी में सुरक्षित रखा गया।
  alternative: “और उसका सहारा कौन है?”
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है वहाँ उसे प्राथमिकता दी गई है, पर यूनानी समानांतर संभवतः किसी भिन्न इब्रानी आधार-पाठ या पाठ-परंपरा को दर्शाता है। अर्थ पर इसका बड़ा प्रभाव होने के कारण इस भिन्नता को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी की संक्षिप्त काव्यात्मकता को बनाए रखते हुए दूसरी पंक्ति को स्वाभाविक हिन्दी में रखा गया है। ‘उसने’ मूल क्रिया के कर्ता का लिंग हिन्दी में खुला रखता है।
