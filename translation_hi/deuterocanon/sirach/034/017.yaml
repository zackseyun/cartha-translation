base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: hi
  text: गरीब की पुकार बादल को पार कर जाती है; और जब तक वह परमेश्वर तक नहीं पहुँचती, विश्राम नहीं करती। वह तब तक नहीं रुकती, जब तक परमेश्वर ध्यान न दे और धर्मी न्यायाधीश न्याय न करे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायिक निर्णय करे।” हिब्रू मुहावरे का शाब्दिक अर्थ “न्याय करे” है।
    reason: lexical_alternative
  - marker: b
    text: 'स्वीट के यूनानी पाठ में यहाँ बहुत भिन्न पाठ है: “प्रभु की आँखें उससे प्रेम करने वालों पर हैं ...” उपलब्ध हिब्रू पाठ ऊपर दिए अनुवाद के अनुसार है; इसलिए स्रोत-पाठ के स्तर पर यह पद अनिश्चित है।'
    reason: textual_variant
lexical_decisions:
- source_word: שועת דל
  choice: गरीब की पुकार
  rationale: שועה संकट में सहायता के लिए उठी पुकार है, और דל गरीब, दीन या सामाजिक रूप से निर्बल व्यक्ति को दर्शाता है। ‘गरीब की पुकार’ सहज और तात्कालिकता से भरपूर है।
- source_word: ענן חלפה
  choice: बादल को पार कर जाती है
  rationale: हिब्रू में पुकार के बादल की बाधा पार करने की सजीव छवि है। यह अनुवाद उस गति और रूपक को बनाए रखता है।
- source_word: ועד תגיע לא תנוח
  choice: जब तक वह परमेश्वर तक नहीं पहुँचती, विश्राम नहीं करती
  rationale: स्त्रीलिंग क्रियाएँ ‘पुकार’ की ओर संकेत करती हैं। लक्ष्य हिब्रू में अप्रकट है, पर अगली पंक्ति में परमेश्वर स्पष्ट है; हिन्दी में स्पष्टता के लिए उसे व्यक्त किया गया है। ‘विश्राम नहीं करती’ मूल रूपक को बनाए रखता है।
- source_word: לא תמוש
  choice: वह तब तक नहीं रुकती
  rationale: מוש का मूल भाव हटना या टलना है; पुकार के संदर्भ में ‘नहीं रुकती’ उसकी निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יפקוד אל
  choice: जब तक परमेश्वर उसकी सुधि न ले
  rationale: פקד का अर्थ ध्यान देना, सुधि लेना, भेंट करना या हस्तक्षेप करना हो सकता है। ‘सुधि लेना’ उत्तरदायी ध्यान को व्यक्त करता है, पर कार्रवाई का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ושופט צדק
  choice: और धर्मी न्यायी
  rationale: यह पदबंध परमेश्वर को धार्मिकता से युक्त न्यायी के रूप में बताता है। ‘धर्मी न्यायी’ संक्षिप्त, गरिमापूर्ण और न्यायिक भाव वाला है।
- source_word: יעשה משפט
  choice: न्याय न करे
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘न्याय करना’ है। हिन्दी में यही स्वाभाविक है और משפט के न्याय तथा न्यायिक निर्णय—दोनों संभावित भावों को खुला रखता है।
theological_decisions:
- issue: ‘जब तक वह पहुँचे’ में अप्रकट लक्ष्य
  choice: ‘परमेश्वर तक’ स्पष्ट किया गया
  alternative: 'लक्ष्य अप्रकट रखा जाए: ‘जब तक वह नहीं पहुँचती’'
  rationale: हिब्रू में लक्ष्य नहीं कहा गया, किंतु अगली पंक्ति परमेश्वर को स्पष्ट करती है। हिन्दी में लक्ष्य व्यक्त करने से अर्थ सहज होता है और कोई नया धार्मिक दावा नहीं जुड़ता।
- issue: משפט का अनुवाद
  choice: मुख्य पाठ में ‘न्याय करे’
  alternative: ‘न्यायिक निर्णय दे’
  rationale: ‘न्याय करे’ हिब्रू मुहावरे के निकट है और न्यायपूर्ण कार्य तथा न्यायिक निर्णय के बीच की वास्तविक अर्थगत व्यापकता बनाए रखता है।
- issue: यूनानी और हिब्रू पाठ का बड़ा अंतर
  choice: उपलब्ध हिब्रू पाठ को मुख्य पाठ बनाया गया और भिन्न यूनानी पाठ को पादटिप्पणी में दर्ज किया गया
  alternative: यूनानी पाठ को मुख्य पाठ बनाया जाए
  rationale: दिए गए हिब्रू स्रोत का प्रमाण उच्च-विश्वसनीयता वाला है, पर स्रोत-स्तर की अनिश्चितता छिपाई नहीं जानी चाहिए; इसलिए यूनानी भिन्नता स्पष्ट रूप से नोट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और काव्यात्मक है। ‘सुधि लेना’ वर्तमान पाठकों के लिए बोधगम्य रहते हुए פקד की व्यापकता बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
