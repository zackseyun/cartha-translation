  yaml_path: translation/deuterocanon/sirach/034/022.yaml
  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: hi
  text: ज़रूरतमंदों की रोटी गरीबों का जीवन है; जो उसे उनसे छीन लेता है, वह रक्तपात का दोषी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रक्तों का मनुष्य”; अर्थात् “खूनी मनुष्य” या “हत्यारा” भी सम्भव है।
    reason: मूल यूनानी मुहावरे और उसके अधिक व्याख्यात्मक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἄρτος
  choice: रोटी
  rationale: मूल यूनानी की ठोस छवि बनाए रखते हुए ‘रोटी’ सहज रूप से मूलभूत भोजन और जीविका का द्योतक है।
- source_word: ἐπιδεομένων
  choice: ज़रूरतमंदों की
  rationale: यह कृदंत उन लोगों को सूचित करता है जिन्हें जीवन की आवश्यक वस्तुओं की कमी है; संबंधकारक रूप को हिन्दी में स्वाभाविक रूप से रखा गया है।
- source_word: ζωὴ πτωχῶν
  choice: गरीबों का जीवन
  rationale: यह अनुवाद यूनानी की संक्षिप्त संबंधकारक रचना और इस बात के तीखे कथन को बनाए रखता है कि रोटी गरीबों का जीवन टिकाए रखती है।
- source_word: ὁ ἀποστερῶν αὐτὴν
  choice: जो उसे उनसे छीन लेता है
  rationale: ἀποστερέω किसी को उसकी आवश्यक या देय वस्तु से वंचित करने, रोक रखने या छीन लेने का अर्थ देता है। ‘उसे’ रोटी की ओर और ‘उनसे’ ज़रूरतमंद गरीबों की ओर संकेत करता है।
- source_word: ἄνθρωπος αἱμάτων
  choice: रक्तपात का दोषी मनुष्य
  rationale: यूनानी का शाब्दिक अर्थ ‘रक्तों का मनुष्य’ है, जो सम्भवतः सामी मुहावरे की छाया रखता है। हिन्दी में ‘रक्तपात का दोषी मनुष्य’ उसकी रक्तदोष संबंधी नैतिक शक्ति को स्पष्ट रखते हुए सीधे ‘हत्यारा’ कहने से बचता है।
theological_decisions:
- issue: जीविका छीनने वाले को ἄνθρωπος αἱμάτων कहना
  choice: रक्तपात का दोषी मनुष्य
  alternative: हत्यारा; खूनी मनुष्य; रक्त का मनुष्य
  rationale: यह कथन गरीब से जीवनदायी भोजन छीनने को रक्तदोष से जोड़ता है। मुख्य पाठ में ऐसा रूप चुना गया है जो इस कठोर नैतिक समानता को बनाए रखता है, पर इसे संकीर्ण कानूनी अर्थ में हत्या का आरोप बनाकर निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘रोटी’ की ठोस छवि तथा अंतिम पद की रक्तदोष-संबंधी तीव्रता दोनों सुरक्षित रखी गई हैं।
