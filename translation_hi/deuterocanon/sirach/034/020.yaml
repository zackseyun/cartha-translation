  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
translation:
  language: hi
  text: यहोवा की कृपा संकट के समय मनोहर है[a]—जैसे सूखे के समय वर्षा का बादल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “परमप्रधान भक्तिहीनों की भेंटों से प्रसन्न नहीं होता, और न बहुत-से बलिदान पापों के लिए उसे प्रसन्न करते हैं।” इस पद में इब्रानी और यूनानी पाठ-परंपराएँ एक-दूसरे से बहुत भिन्न हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: कितनी मनोहर है
  rationale: यह विशेषण सुंदरता और प्रसंगानुकूल सुखदता, दोनों का भाव दे सकता है। विस्मयात्मक हिन्दी अभिव्यक्ति संकट में मिली करुणा की मनोहर उपयुक्तता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: חסד
  choice: करुणा
  rationale: यहाँ शब्द संकट में प्रकट होने वाली कृपालु भलाई का बोध देता है। ‘करुणा’ सामान्य पाठक के लिए सहज है और केवल किसी औपचारिक वाचा-संबंधी अर्थ तक सीमित नहीं करती।
- source_word: יהוה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा स्पष्ट रखा गया है।
- source_word: בזמן מצוקה
  choice: संकट के समय
  rationale: यह वाक्यांश दबाव, विपत्ति या कठिन परिस्थिति के समय को दर्शाता है; ‘संकट के समय’ संक्षिप्त, स्वाभाविक और गंभीर है।
- source_word: כעב חזיזים
  choice: जैसे ... वर्षा का बादल
  rationale: חזיזים वर्षा/बिजली से जुड़े तूफ़ानी बादल का संकेत देता है। अगले पदांश में सूखे के संदर्भ को देखते हुए हिन्दी में ‘वर्षा का बादल’ जीवनदायी राहत की उपमा को स्पष्ट करता है, बिना अनावश्यक भयावहता जोड़े।
- source_word: בעת בצרת
  choice: सूखे के समय
  rationale: यह पाठ शुष्कता या सूखे की दशा का बोध देता है; ‘सूखे के समय’ कृषि-संबंधी उपमा को सहज और स्पष्ट रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-परंपराओं में इस पद का बड़ा अंतर
  choice: उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ को मुख्य पाठ बनाया गया है।
  alternative: 'यूनानी: “परमप्रधान भक्तिहीनों की भेंटों से प्रसन्न नहीं होता, और न बहुत-से बलिदानों से पापों के लिए प्रायश्चित होता है।”'
  rationale: इस स्थान पर इब्रानी पाठ पूर्ण और सुसंगत है, इसलिए वह मुख्य अनुवाद का आधार है। यूनानी साक्ष्य सर्वथा भिन्न है और उसे पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक ज्ञान-साहित्य वाला स्वर रखा गया है। समानांतर पदांशों को दीर्घ विराम से जोड़ा गया है और पाठांतर का चिह्न मुख्य पाठ में उपस्थित है।
