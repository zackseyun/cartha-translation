  yaml_path: translation/deuterocanon/sirach/034/001.yaml
  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: hi
  text: खोखली और झूठी आशाएँ विवेकहीन पुरुष के लिए हैं, और स्वप्न मूर्खों को पंख लगा देते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεναὶ
  choice: खोखली
  rationale: यह आशाओं के सारहीन और निष्फल होने का बिंब बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ψευδεῖς
  choice: झूठी
  rationale: यह शब्द आशाओं के असत्य होने का सीधा अर्थ देता है; ‘भ्रामक’ सक्रिय छल का अतिरिक्त भाव ला सकता है।
- source_word: ἐλπίδες
  choice: आशाएँ
  rationale: यह यूनानी शब्द का सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: ἀσυνέτῳ ἀνδρί
  choice: विवेकहीन पुरुष
  rationale: ‘विवेकहीन’ समझ-बूझ और सही परख की कमी व्यक्त करता है, जबकि ‘पुरुष’ यूनानी के एकवचन पुल्लिंग रूप को बनाए रखता है।
- source_word: ἐνύπνια
  choice: स्वप्न
  rationale: यह ‘सपनों’ की अपेक्षा कुछ अधिक गरिमापूर्ण होते हुए भी सामान्य आधुनिक हिन्दी में सुबोध है।
- source_word: ἀναπτεροῦσιν
  choice: पंख लगा देते हैं
  rationale: यह क्रिया के उड़ान संबंधी सजीव रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἄφρονας
  choice: मूर्खों
  rationale: यह प्रज्ञा-साहित्य में उस व्यक्ति के लिए स्वाभाविक शब्द है जिसमें उचित समझ और निर्णय का अभाव है; इससे पहले आए ‘विवेकहीन’ से शब्दगत भेद भी बना रहता है।
theological_decisions:
- issue: ज्ञान-साहित्य की उक्ति में ἀνδρί का पुल्लिंग एकवचन
  choice: पुरुष
  alternative: व्यक्ति
  rationale: यह उक्ति सामान्य रूप से लागू हो सकती है, फिर भी स्रोत में प्रयुक्त पुल्लिंग संज्ञा को बनाए रखना पाठ के व्याकरणिक रूप के अधिक निकट है और किसी विशिष्ट धर्मसैद्धांतिक अर्थ को नहीं जोड़ता।
- issue: ἀναπτεροῦσιν का रूपक
  choice: पंख लगा देते हैं
  alternative: बहका ले जाते हैं
  rationale: मूल पाठ स्वप्नों द्वारा मूर्खों को पंख दिए जाने का खुला रूपक रखता है। ‘बहका ले जाते हैं’ उसका संभावित आशय स्पष्ट कर देता, पर मूल की काव्यात्मक अस्पष्टता घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। पहले खंड के यूनानी संबंधवाचक दत्तिव को स्वाभाविक हिन्दी में ‘पुरुष ... आशाएँ रखता है’ के रूप में व्यक्त किया गया है। दूसरे खंड का उड़ान-संबंधी रूपक ज्यों का त्यों सुरक्षित है।
