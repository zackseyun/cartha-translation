review_pass:
  verdict: revise
  source_fidelity: 'The first clause is a predicate with a dative beneficiary/reference: empty and false hopes are for a man without understanding. The draft''s “विवेकहीन पुरुष ... आशाएँ रखता है” turns this into an active assertion that he entertains or possesses such hopes, a modest but unnecessary shift in the Greek''s syntax and emphasis. The second clause accurately retains the plural ‘dreams,’ the distinct term for fools, and the wing-giving metaphor.'
  naturalness: “खोखली और झूठी आशाएँ” and “स्वप्न मूर्खों को पंख लगा देते हैं” are clear, modern, and proverb-like. Recasting the first clause with “के लिए” both preserves the predicate relation and reads naturally enough in a wisdom saying.
  terminology: “विवेकहीन” suitably distinguishes ἀσύνετος from “मूर्खों” for ἄφρων. “पुरुष” retains the source's singular masculine proverbial form without adding doctrinal content. “स्वप्न” is appropriate and suitably elevated but still current.
  issues:
  - severity: medium
    issue: The first clause makes the senseless man the active subject who ‘keeps/has’ empty and false hopes.
    rationale: Greek κεναὶ καὶ ψευδεῖς ἐλπίδες ἀσυνέτῳ ἀνδρί is predicative (‘empty and false hopes are for a man without understanding’). The active Hindi wording can be inferred from the proverb but is not what the source explicitly says.
  revised_text: खोखली और झूठी आशाएँ विवेकहीन पुरुष के लिए हैं, और स्वप्न मूर्खों को पंख लगा देते हैं।
