    text: या, “अधिक मात्रा में पी गई अंगूरी मदिरा आत्मा के लिए कड़वाहट है, उकसावे और ठोकर के साथ।” अन्तिम दो संज्ञाओं में क्रमशः चिढ़/उत्तेजना और ठोकर/पतन का भाव हो सकता है।
