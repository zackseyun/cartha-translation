lexical_decisions:
- source_word: πικρία
  choice: कड़वाहट
  rationale: यह यूनानी संज्ञा के रूपकात्मक अर्थ को बनाए रखता है और इसे केवल शोक या मन में पाले गए रोष तक सीमित नहीं करता।
- source_word: ψυχῆς
  choice: प्राण की
  rationale: सम्बन्धकारक रचना और मनुष्य के भीतरी जीवन/व्यक्तित्व की भाषा को निकटता से सुरक्षित रखता है; यहाँ 'प्राण' स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: οἶνος
  choice: दाखमधु
  rationale: यह विशेष रूप से अंगूरी मदिरा का उल्लेख है; इसे सामान्यतः 'शराब' या 'मदिरा' कहकर व्यापक नहीं किया गया।
- source_word: πινόμενος πολὺς
  choice: बहुत अधिक पी गई
  rationale: कृदन्तीय पदबंध दाखमधु के बड़ी मात्रा में सेवन को बताता है। यह अनुवाद दाखमधु मात्र के बजाय अति-सेवन पर चेतावनी को स्पष्ट करता है।
- source_word: ἐν ἐρεθισμῷ
  choice: चिढ़ के साथ
  rationale: ἐρεθισμός में चिढ़, उत्तेजना या उकसावे का भाव हो सकता है। 'चिढ़' इस संक्षिप्त और कुछ हद तक अस्पष्ट भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀντιπτώματι
  choice: पतन
  rationale: शब्द ठोकर खाने, टकराकर गिरने या विनाशकारी गिरावट का संकेत दे सकता है। 'पतन' सूक्ति के परिणामी और तीव्र चेतावनी-भाव को बनाए रखता है।
