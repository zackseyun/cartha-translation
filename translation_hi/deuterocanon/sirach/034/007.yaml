    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: बहुतों को
  rationale: यह ἐπλάνησεν का कर्म है और अनिश्चित मानवीय बहुवचन को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπλάνησεν
  choice: भटका दिया है
  rationale: क्रिया किसी को मार्ग से भटका देने या गुमराह करने का भाव रखती है; यह चयन मूल रूपक को बनाए रखते हुए कहावत-सदृश सामान्य चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἐνύπνια
  choice: सपनों ने
  rationale: ἐνύπνια का सामान्य और स्पष्ट हिन्दी रूप 'सपने' है; यहाँ कर्ता होने के कारण परसर्ग सहित 'सपनों ने' प्रयुक्त है।
- source_word: ἐξέπεσαν
  choice: गिर पड़े हैं
  rationale: मूल क्रिया के पतन-संबंधी रूपक को सुरक्षित रखा गया है, बिना यह तय किए कि आशय केवल असफलता, विनाश या विश्वास से पतन है।
- source_word: ἐλπίζοντες
  choice: आशा रखनेवाले
  rationale: वर्तमान कृदन्त को व्यक्ति-सूचक रूप में प्रस्तुत किया गया है; यह उन लोगों को दर्शाता है जो सपनों को अपनी आशा का आधार बनाते हैं।
- source_word: ἐπʼ αὐτοῖς
  choice: उन पर
  rationale: सर्वनाम सपनों की ओर लौटता है। 'उन पर आशा रखना' आधार या भरोसे का भाव बनाए रखता है और यूनानी ἐπί की संरचना से निकट है।
theological_decisions:
- issue: सपनों के विषय में चेतावनी का स्वरूप
  choice: पद बताता है कि सपनों ने बहुतों को भटकाया है और उन पर आशा रखनेवाले पतित हुए हैं।
  alternative: इसे बिना किसी अपवाद के हर सपने की निन्दा, या केवल झूठी स्वप्न-व्याख्या की निन्दा माना जा सकता है।
  rationale: यूनानी पाठ सपनों से हुए भटकाव और उन पर आशा रखने के परिणाम को सीधे कहता है। अनुवाद चेतावनी को बनाए रखता है, पर यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि प्रत्येक स्वप्न अनिवार्यतः झूठा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और लोकोक्तिपरक शैली रखी गई है। 'भटका दिया है' तथा 'गिर पड़े हैं' मूल यूनानी के रूपकों को सहज हिन्दी में सुरक्षित रखते हैं।
