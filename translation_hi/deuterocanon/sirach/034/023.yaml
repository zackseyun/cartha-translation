base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/023.yaml
  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: hi
  text: जो किसी पड़ोसी की जीविका[a] छीन लेता है, वह उसकी हत्या करता है[b]; और जो मज़दूर की मज़दूरी रोक लेता है, वह रक्त बहाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप में: ‘जीवन-निर्वाह का साधन।’ यूनानी शब्द का अर्थ उन साधनों से है जिनसे व्यक्ति अपना जीवन चलाता है।'
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ यह नहीं कहता कि ऐसा व्यक्ति ‘हत्यारे के समान’ है, बल्कि नैतिक समानता को सीधे व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: φονεύων τὸν πλησίον
  choice: वह उसकी हत्या करता है
  rationale: φονεύω यहाँ अन्यायपूर्ण ढंग से जान लेने के अर्थ में है। यूनानी वाक्य इसे केवल उपमा के रूप में नहीं, बल्कि प्रत्यक्ष नैतिक कथन के रूप में रखता है। ‘उसकी’ का संकेत उस पड़ोसी की ओर है जिसकी जीविका छीनी गई है।
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: जो किसी पड़ोसी की जीविका छीन लेता है
  rationale: ἀφαιρέω का अर्थ ‘छीन लेना/वंचित करना’ और συμβίωσις का प्रसंगानुसार अर्थ जीवन-निर्वाह का साधन है। ‘जीविका’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा अगले खंड की मज़दूरी से अर्थगत संबंध बनाए रखती है।
- source_word: ἐκχέων αἷμα
  choice: वह रक्त बहाता है
  rationale: यह रक्तपात और उसके नैतिक दोष का प्रबल बाइबिलीय मुहावरा है। शाब्दिक छवि बनाए रखने से कथन की तीव्रता सुरक्षित रहती है।
- source_word: ὁ ἀποστερῶν
  choice: जो ... रोक लेता है
  rationale: ἀποστερέω में वंचित करने, हड़पने या अनुचित रूप से रोक रखने का भाव है। मज़दूरी के साथ ‘रोक लेना’ स्पष्ट और सहज हिन्दी है।
- source_word: μισθὸν μισθωτοῦ
  choice: मज़दूर की मज़दूरी
  rationale: μισθός वेतन या मज़दूरी और μισθωτός भाड़े पर काम करने वाला श्रमिक है। ‘मज़दूर की मज़दूरी’ सामान्य पाठक के लिए स्वाभाविक है और मूल सामाजिक-आर्थिक संदर्भ को बनाए रखती है।
theological_decisions:
- issue: आर्थिक वंचना को हत्या और रक्तपात के समान प्रत्यक्ष नैतिक दोष ठहराना
  choice: ‘वह उसकी हत्या करता है’ और ‘वह रक्त बहाता है’ के रूप में सीधा कथन
  alternative: ‘वह मानो उसकी हत्या करता है’ या ‘वह रक्त बहाने वाले के समान है’
  rationale: यूनानी पाठ में तुलना-सूचक शब्द नहीं है; दोनों कृदंत पद प्रत्यक्ष समानता स्थापित करते हैं। इसे उपमा बनाकर नरम करना मूल की तीखी नैतिक चुनौती को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और कहावत-सदृश शैली रखी गई है। ‘जीविका’, ‘मज़दूर की मज़दूरी’ और ‘रक्त बहाता है’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल यूनानी की तीखी समानांतर संरचना और नैतिक तनाव सुरक्षित रहते हैं।
