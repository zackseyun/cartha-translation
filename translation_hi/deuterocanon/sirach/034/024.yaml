  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: hi
  text: एक बनाता है और दूसरा ढा देता है—उन्हें परिश्रम के सिवा क्या लाभ हुआ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें परिश्रम से अधिक क्या लाभ हुआ?” यूनानी में प्रश्न है कि जब एक का बनाया हुआ दूसरा ढा देता है, तो परिश्रम के अतिरिक्त उन्हें क्या लाभ मिला।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῶν
  choice: बनाता है
  rationale: वर्तमान कृदन्त यहाँ सामान्य, कहावत-जैसा कथन करता है। ‘बनाता है’ निर्माण के ठोस बिंब को सहज आधुनिक हिन्दी में रखता है।
- source_word: καθαιρῶν
  choice: ढा देता है
  rationale: यहाँ καθαιρέω का अर्थ किसी बनी हुई वस्तु को गिराना या नष्ट करना है। ‘ढा देता है’ पहले खंड के निर्माण-बिंब का स्वाभाविक प्रतिलोम है।
- source_word: τί ὠφέλησαν
  choice: उन्हें ... क्या लाभ हुआ
  rationale: ὠφελέω का अओरिस्ट परिणामी लाभ के विषय में प्रश्न करता है। बहुवचन क्रिया को ध्यान में रखते हुए ‘उन्हें’ दोनों कर्ताओं की ओर संकेत करता है और प्रश्न की आलंकारिक धार बनाए रखता है।
- source_word: πλεῖον ἢ
  choice: के सिवा
  rationale: इस संदर्भ में तुलना का आशय है कि सारे विरोधी श्रम का परिणाम श्रम के अतिरिक्त कुछ नहीं। ‘के सिवा’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: κόπους
  choice: परिश्रम
  rationale: κόπος थकाने वाले श्रम, कठिन परिश्रम या उससे उपजी परेशानी को सूचित करता है। ‘परिश्रम’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
theological_decisions:
- issue: कहावत में संज्ञारहित एकवचन कर्ता
  choice: एक ... और दूसरा ...
  alternative: एक व्यक्ति ... और दूसरा व्यक्ति ...
  rationale: यूनानी में संज्ञा के बिना दो एकवचन कृदन्त हैं। ‘एक...दूसरा...’ सामान्य मानवीय संदर्भ और संक्षिप्त कहावत-जैसी शैली को बनाए रखता है तथा अनावश्यक रूप से लिंग निर्दिष्ट नहीं करता।
- issue: आलंकारिक प्रश्न का बल
  choice: उन्हें परिश्रम के सिवा क्या लाभ हुआ?
  alternative: उन्हें परिश्रम से अधिक क्या लाभ हुआ?
  rationale: 'वचन विरोधी कार्यों की निष्फलता दिखाता है: एक का बनाया हुआ दूसरे के ढाने से निष्फल हो जाता है। मुख्य पाठ स्वाभाविक हिन्दी में यही तीखापन रखता है, जबकि तुलना की अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।'
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण और कहावत-जैसी शैली अपनाई गई है। ‘बनाता है/ढा देता है’ का समानांतर विन्यास मूल के ठोस विरोध को स्पष्ट रखता है।
