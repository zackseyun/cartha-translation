translation:
  language: hi
  text: उचित समय पर और संतुलित मात्रा में पिया गया दाखरस हृदय का उल्लास और मन का आनंद है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उचित समय पर, पर्याप्त मात्रा में पिया गया दाखरस।” यूनानी विशेषण का अधिक शाब्दिक अर्थ “पर्याप्त” या “जितना काफ़ी हो उतना” हो सकता है; यहाँ संभवतः आशय अति के बजाय संतुलित सेवन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: उल्लास
  rationale: यह शब्द उमंग से भरे हर्ष को व्यक्त करता है; ‘उल्लास’ काव्यात्मक समानांतरता और सकारात्मक भाव दोनों बनाए रखता है।
- source_word: καρδίας
  choice: हृदय का
  rationale: सम्बन्धकारक रचना को सीधे रखते हुए यह ψυχῆς के साथ पद्यात्मक समानांतरता बनाए रखता है।
- source_word: εὐφροσύνη
  choice: आनन्द
  rationale: यह प्रसन्नता और हर्ष का बोध कराता है; ‘आनन्द’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ψυχῆς
  choice: प्राण का
  rationale: यहाँ ψυχή व्यक्ति के भीतरी जीवन का संकेत देता है। ‘प्राण’ ‘हृदय’ के साथ स्वाभाविक काव्यात्मक युग्म बनाता है और केवल किसी दार्शनिक ‘आत्मा’ तक अर्थ को सीमित नहीं करता।
- source_word: οἶνος
  choice: दाखमधु
  rationale: मूल में स्पष्टतः अंगूरी मदिरा है; ‘दाखमधु’ हिन्दी बाइबलीय शैली में सटीक, गरिमापूर्ण और बोधगम्य है।
- source_word: πινόμενος
  choice: पिया गया
  rationale: वर्तमान कर्मवाच्य कृदन्त को हिन्दी में विशेषणात्मक रूप से सहज ढंग से व्यक्त करता है।
- source_word: ἐν καιρῷ
  choice: उचित समय पर
  rationale: καιρός केवल काल नहीं, बल्कि उपयुक्त अवसर का बोध कराता है।
- source_word: αὐτάρκης
  choice: संतुलित मात्रा में
  rationale: शब्द का मूल भाव पर्याप्तता या जितना काफ़ी हो उतना है। प्रसंग में यह अति के विपरीत मापी हुई मात्रा की ओर संकेत करता है, पर वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दाखमधु के सम्बन्ध में αὐτάρκης का नैतिक बल
  choice: पद को उपयुक्त समय और संतुलित मात्रा में सेवन की प्रशंसा के रूप में प्रस्तुत किया गया है।
  alternative: विशेषण को अधिक शाब्दिक रूप से ‘पर्याप्त’ या ‘जितना काफ़ी हो उतना’ समझा जा सकता है।
  rationale: ἐν καιρῷ समय की उपयुक्तता बताता है और αὐτάρκης सम्भवतः मात्रा की पर्याप्तता। मुख्य पाठ नैतिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक रूप। ‘हृदय का उल्लास’ और ‘प्राण का आनन्द’ मूल की समानांतर काव्य-रचना को बनाए रखते हैं।
