translation:
  language: hi
  text: स्वप्न-दर्शन ऐसा है—एक के सामने दूसरा, जैसे चेहरे के सामने चेहरे की प्रतिकृति।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वप्नों का दर्शन—यह उसके सामने, जैसे चेहरे के सामने चेहरे की प्रतिकृति।” यूनानी वाक्य अत्यंत संक्षिप्त और कुछ अध्याहारयुक्त है। “एक के सामने दूसरा” का आशय आमने-सामने रखी हुई वस्तुओं का संबंध, अनुरूपता, या प्रतिबिंब हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: स्वप्न-दर्शन
  rationale: यह संक्षिप्त समास दर्शन और स्वप्न के घनिष्ठ संबंध को बनाए रखता है और यूनानी पदबंध को अनावश्यक रूप से नहीं खोलता।
- source_word: τοῦτο κατὰ τούτου
  choice: यह उस सामने वाले के समान होता है
  rationale: यूनानी वाक्यांश अत्यंत संक्षिप्त और अध्याहारयुक्त है। हिन्दी में यह चयन आमने-सामने रखी वस्तुओं के साम्य या अनुरूपता का संकेत देता है, जबकि ठीक अगले चेहरे वाले बिंब से संबंध भी बनाए रखता है।
- source_word: κατέναντι προσώπου
  choice: एक चेहरे के सामने
  rationale: κατέναντι की सामने अथवा सम्मुख होने की स्थानिक शक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ὁμοίωμα προσώπου
  choice: उसी चेहरे की प्रतिमा
  rationale: ‘प्रतिमा’ समान रूप या प्रतिबिंब-सदृश छवि का अर्थ देती है, पहचान की पूर्ण एकता का नहीं। ‘उसी’ हिन्दी में सामने वाले चेहरे से उसका संबंध स्पष्ट करता है, जो यूनानी संरचना में निहित है।
theological_decisions:
- issue: स्वप्नों के विषय में इस सूक्ति का आशय
  choice: मुख्य पाठ स्वप्न-दर्शन को सामने के चेहरे की प्रतिमा के समान प्रस्तुत करता है—अर्थात अनुरूपता का बिंब देता है, पर उसे स्वयं वास्तविकता नहीं कहता।
  alternative: इसे अधिक ढीले रूप में ‘स्वप्न एक वस्तु को दूसरी में प्रतिबिंबित करते हैं’ या ‘स्वप्न प्रतिबिंबों के समान हैं’ समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग स्वप्नों पर भरोसा करने के प्रति सावधान करता है, किंतु यूनानी स्वयं संक्षिप्त और अस्पष्ट है। इसलिए अनुवाद समानता का रूपक बनाए रखता है और कोई अधिक प्रबल दार्शनिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूक्तिपरक रखी गई है। मूल यूनानी की कठिन संक्षिप्तता को पूरी तरह सपाट करने के बजाय पठनीय हिन्दी और वास्तविक अस्पष्टता के बीच संतुलन रखा गया है।
