translation:
  language: hi
  text: मदहोशी मूर्ख मनुष्य के क्रोध को बढ़ाकर ठोकर का कारण बना देती है, शक्ति घटाती और घाव उत्पन्न करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληθύνει
  choice: इतना बढ़ा देती है
  rationale: क्रिया वृद्धि कराने का भाव व्यक्त करती है; ‘इतना बढ़ा देती है कि’ हिन्दी में εἰς के परिणामसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μέθη
  choice: मदहोशी
  rationale: यह केवल पीने की क्रिया नहीं, बल्कि नशे की अवस्था को बताता है; ‘मदहोशी’ आधुनिक और सहज हिन्दी है।
- source_word: θυμὸν
  choice: क्रोध
  rationale: इस प्रसंग में θυμός का प्रमुख अर्थ उग्र क्रोध है।
- source_word: ἄφρονος
  choice: मूर्ख मनुष्य के
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और ज्ञान-साहित्य के प्रतिनिधि मानवीय प्रकार को व्यक्त करता है।
- source_word: εἰς πρόσκομμα
  choice: कि वह ठोकर खाए
  rationale: πρόσκομμα के ठोकर या पतन के बिंब को बनाए रखते हुए εἰς का परिणामसूचक भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐλαττῶν ἰσχὺν
  choice: शक्ति घटाती
  rationale: वर्तमान कृदन्त मदहोशी के साथ चलने वाले प्रभाव को बताता है; ἰσχύς का सीधा अर्थ ‘शक्ति’ है।
- source_word: προσποιοῦν τραύματα
  choice: घाव उत्पन्न करती है
  rationale: प्रयोग अतिरिक्त हानिकारक परिणाम उत्पन्न करने का भाव देता है और τραύματα के ठोस अर्थ ‘घाव’ को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में प्रतिनिधि पुल्लिंग
  choice: ἄφρονος का अनुवाद ‘मूर्ख मनुष्य के’
  alternative: ‘मूर्ख के’ या ‘मूर्ख व्यक्ति के’
  rationale: मूल यूनानी के पुल्लिंग एकवचन रूप को बनाए रखा गया है, जबकि कथन का प्रतिनिधि ज्ञानसूत्रात्मक स्वर भी स्पष्ट रहता है।
- issue: εἰς πρόσκομμα का संबंध
  choice: 'क्रोध बढ़ने का परिणाम: ‘कि वह ठोकर खाए’'
  alternative: ‘ठोकर का कारण बन जाता है’ अथवा ‘पतन तक’
  rationale: वाक्यरचना में कुछ अस्पष्टता है कि ठोकर को सीधे बढ़े हुए क्रोध का परिणाम माना जाए या πρόσκομμα को अवरोध/पतन का नाम दिया जाए; मुख्य पाठ ठोकर के बिंब और परिणामसूचक दिशा दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और ज्ञान-साहित्य के चेतावनीपूर्ण स्वर के अनुरूप रखी गई है। दूसरे खंड में ‘वह’ का संकेत मदहोशी की ओर है।
