base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/014.yaml
  text: One who fears the Lord will not be shaken, and will not be afraid, for he is his hope.
translation:
  language: hi
  text: जो प्रभु का भय मानता है, वह न घबराएगा, न साहस खोएगा, क्योंकि प्रभु ही उसकी आशा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए उपलब्ध कराया गया काहिरा गनीज़ा का इब्रानी वाक्य है: “वह अनाथ की पुकार की उपेक्षा नहीं करेगा, न विधवा की, जब वह बार-बार अपनी शिकायत करती है।” यह यहाँ के यूनानी पाठ से मेल नहीं खाता और संभवतः स्रोत-सामग्री में किसी दूसरी पद-पंक्ति से जुड़ गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος Κύριον
  choice: जो प्रभु का भय मानता है
  rationale: यूनानी पदबंध सामान्य प्रतिनिधि एकवचन में है। ‘प्रभु का भय मानता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए श्रद्धामिश्रित भय का पारंपरिक बाइबलीय अर्थ बनाए रखता है।
- source_word: οὐ μὴ πτοηθῇ
  choice: वह न घबराएगा
  rationale: πτοέω भय से चौंकने या व्याकुल हो उठने का भाव देता है। ‘न घबराएगा’ इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ μὴ δειλιάσῃ
  choice: न साहस छोड़ेगा
  rationale: δειλιάω केवल डर महसूस करने से अधिक, भय के कारण साहस खोने का अर्थ दे सकता है। यह अनुवाद पहले खंड की अनावश्यक पुनरावृत्ति से भी बचता है।
- source_word: ὅτι αὐτὸς ἐλπὶς αὐτοῦ
  choice: क्योंकि प्रभु ही उसकी आशा है
  rationale: यूनानी αὐτός का संदर्भ प्रभु से है और उसका बलवाचक भाव ‘ही’ से व्यक्त किया गया है। सर्वनाम की जगह ‘प्रभु’ दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: दिए गए इब्रानी पाठ और सिराख 34:14 के यूनानी पाठ के बीच बड़ा असामंजस्य
  choice: मुख्य पाठ में सिराख 34:14 का यूनानी पाठ अनूदित किया गया
  alternative: 'दिए गए इब्रानी वाक्य का अनुवाद: ‘वह अनाथ की पुकार की उपेक्षा नहीं करेगा, न विधवा की, जब वह बार-बार अपनी व्यथा कहे।’'
  rationale: दिया गया काहाना-संकलित इब्रानी वाक्य अर्थ की दृष्टि से यूनानी सिराख 34:14 से मेल नहीं खाता और स्रोत-सामग्री में पद-पंक्ति के असंगत जुड़ाव का संकेत देता है। पद की पहचान के लिए सुसंगत यूनानी साक्ष्य को मुख्य पाठ बनाया गया है और इब्रानी पाठ को पारदर्शिता हेतु पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘प्रभु का भय मानना’ बाइबलीय ज्ञान-साहित्य की स्थापित अभिव्यक्ति है; ‘न घबराएगा, न साहस छोड़ेगा’ यूनानी के निकटवर्ती पर अलग-अलग दोनों भय-सूचक क्रियापदों का भेद बनाए रखता है।
