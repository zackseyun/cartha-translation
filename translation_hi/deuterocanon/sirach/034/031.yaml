    issue: “निंदा की कोई बात” is not the most precise equivalent for λόγον ὀνειδισμοῦ.
    rationale: The Greek concerns a reproachful or insulting statement said to the person. “निंदा” may instead imply criticism or disparagement, including speech about a person.
  - severity: medium
    issue: “माँग करके उसे दुःखी मत करो” is idiomatically under-specified.
    rationale: Although it reflects the lexical breadth of ἀπαίτησις, the wording can sound like ordinary asking rather than burdening someone with a demand. “माँग रखकर” retains the broad, non-financially-specific sense while reading more naturally.
