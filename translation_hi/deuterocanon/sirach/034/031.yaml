base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: hi
  text: दाखमधु के भोज में अपने पड़ोसी को मत फटकारो, और उसके आनंद के समय उसे तुच्छ न समझो। उससे उलाहना देने वाली कोई बात मत कहो, और उस पर माँग रखकर उसे दुःखी मत करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुकाने के लिए दबाव डालकर उसे दुःखी मत करो।” यूनानी शब्द किसी माँग या वसूली को सूचित कर सकता है और प्रायः देय राशि वसूलने के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: दाखमधु के भोज में
  rationale: यह पदबंध दाखमधु पीने से युक्त सामूहिक भोज को दर्शाता है। यह अनुवाद यूनानी के निकट रहते हुए आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐλέγξῃς
  choice: फटकारो
  rationale: इस पारस्परिक नीतिवचन-संदर्भ में क्रिया का अर्थ दोष प्रकट करने की अपेक्षा किसी को डाँटना या उसकी भर्त्सना करना है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: यह नैतिक संबंध-सूचक शब्द का प्रचलित हिन्दी रूप है, यद्यपि प्रसंग में वह साथ भोज करने वाले व्यक्ति या परिचित को भी सूचित कर सकता है।
- source_word: ἐξουδενώσῃς
  choice: तुच्छ न समझो
  rationale: क्रिया किसी को नगण्य मानने या उसके साथ तिरस्कार का व्यवहार करने का भाव रखती है। यह रूप मूल अर्थ को बिना उसे अनिवार्य रूप से सार्वजनिक अपमान बना दिए सुरक्षित रखता है।
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: उसके आनंद के समय
  rationale: यह व्यक्ति की उत्सवपूर्ण प्रसन्नता की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λόγον ὀνειδισμοῦ
  choice: निंदा की कोई बात
  rationale: यह सम्बन्धकारक पदबंध के अर्थ को बनाए रखता है और अपमानजनक अथवा उलाहने भरे कथन का गरिमापूर्ण, सहज हिन्दी रूप देता है।
- source_word: θλίψῃς
  choice: दुःखी मत करो
  rationale: क्रिया दबाने, कष्ट देने या व्यथित करने का अर्थ रखती है। यहाँ सामाजिक और व्यावहारिक दबाव से उत्पन्न कष्ट अभिप्रेत हो सकता है।
- source_word: ἐν ἀπαιτήσει
  choice: माँग करके
  rationale: संज्ञा का अर्थ माँग, वसूली या देय वस्तु की माँग हो सकता है। मुख्य पाठ व्यापक अर्थ रखता है; ऋण-वसूली की सम्भावना पादटिप्पणी में दी गई है।
