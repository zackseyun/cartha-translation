  language: en
  yaml_path: translation/deuterocanon/sirach/034/009.yaml
  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
translation:
  language: hi
  text: जिस मनुष्य ने शिक्षा पाई है,[b] वह बहुत-सी बातें जानता है; और जिसे बहुत अनुभव है, वह समझ की बातें विस्तार से बताएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के लिए दिया गया इब्रानी साक्ष्य इससे काफी भिन्न है। उसका लगभग अर्थ है: “अपने सब कामों में प्रसन्न मुख दिखा, और आनन्द से पवित्र वस्तु का दशमांश दे।” यह पंक्ति सिराख 34:9 के प्रसंग से मेल नहीं खाती; इसलिए मुख्य पाठ यहाँ यूनानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
  - marker: b
    text: या, “प्रशिक्षित मनुष्य।” यूनानी शब्द का यह भी स्वाभाविक अर्थ है। निकटवर्ती प्रसंग यात्रा और अनुभव से मिलने वाली शिक्षा का उल्लेख करता है, पर इस पद में शब्द का सीधा अर्थ ‘शिक्षित’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: यूनानी में पुल्लिंग एकवचन है, पर यहाँ कथन नीतिवचन की तरह सामान्य अर्थ में है। ‘मनुष्य’ स्रोत की मानवीय संज्ञा और सामान्य प्रयोग—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: πεπαιδευμένος
  choice: जिसने यात्राओं से शिक्षा पाई है
  rationale: शब्द का सामान्य अर्थ ‘शिक्षित/प्रशिक्षित’ हो सकता है। निकटवर्ती प्रसंग और अगली पंक्ति के ‘बहुत अनुभव’ के साथ उसका संबंध यात्रा से मिली शिक्षा की ओर संकेत करता है; इस व्याख्यात्मक चुनाव को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔγνω πολλά
  choice: वह बहुत-सी बातें जानता है
  rationale: यह सीधा, स्वाभाविक और नीतिवचन-सुलभ हिन्दी रूप है, जो बहुत कुछ जान लेने के भाव को व्यक्त करता है।
- source_word: ὁ πολυπειρῶν
  choice: जिसे बहुत अनुभव है
  rationale: यह अभिव्यक्ति व्यापक और विविध अनुभव रखने वाले व्यक्ति को दर्शाती है; चुना हुआ रूप आधुनिक हिन्दी में सहज है।
- source_word: ἐκδιηγήσεται
  choice: विस्तार से बताएगा
  rationale: क्रिया किसी बात को पूरा खोलकर कहने या वर्णित करने का भाव रखती है। ‘विस्तार से बताएगा’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: σύνεσιν
  choice: समझ की बातें
  rationale: ‘समझ’ ज्ञान-साहित्य का सुबोध शब्द है। क्रिया के साथ स्वाभाविक हिन्दी के लिए इसे ‘समझ की बातें’ कहा गया है, बिना इसे किसी संकीर्ण सिद्धान्तगत अर्थ में बाँधे।
theological_decisions:
- issue: दिए गए इब्रानी पाठ और सिराख 34:9 के यूनानी समानांतर पाठ में मूलभूत असंगति
  choice: मुख्य पाठ का अनुवाद यूनानी समानांतर पाठ से किया गया है और भिन्न इब्रानी पंक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
  alternative: 'दिए गए इब्रानी पाठ का अनुवाद मुख्य पाठ में करना: ‘अपने सब कामों में प्रसन्न मुख दिखा, और आनन्द से पवित्र वस्तु का दशमांश दे।’'
  rationale: दिया गया इब्रानी पाठ इस पद के ज्ञात प्रसंग और अर्थ से मेल नहीं खाता, जबकि यूनानी पाठ सिराख 34:9 के प्रसंग और संरचना से मेल खाता है। इसलिए पाठ-साक्ष्य की अनिश्चितता छिपाए बिना यूनानी को यहाँ कार्यकारी स्रोत माना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट नीतिवचन-शैली अपनाई गई है। ‘यात्राओं से शिक्षा पाई है’ प्रसंगगत अर्थ को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प को सुरक्षित रखती है। दोनों पाठ-साक्ष्यों की असंगति को स्पष्ट रूप से बताया गया है।
