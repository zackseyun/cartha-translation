  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: hi
  text: दाखमधु मनुष्य के लिए जीवन के समान है, यदि तुम उसे उचित मात्रा में पियो। जो दाखमधु से क्षीण होता हो[a], उसके लिए जीवन क्या है? क्योंकि दाखमधु भी मनुष्यों के आनन्द के लिए रचा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “जिसे दाखमधु कम मिलता हो।” यूनानी पदबंध संक्षिप्त है। मुख्य पाठ में इसका अर्थ दाखमधु से क्षीण या हानि उठाने वाला व्यक्ति लिया गया है; इसे दाखमधु की कमी से वंचित व्यक्ति भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: जीवन के समान
  rationale: ἴσον के तुलनात्मक भाव को निकटता से रखता है और हिन्दी में स्वाभाविक तथा अर्थपूर्ण है।
- source_word: οἶνος
  choice: दाखमधु
  rationale: यह मदिरा के सामान्य अर्थ को रखते हुए बाइबलीय साहित्य के अनुरूप गरिमापूर्ण और समझ में आने वाला शब्द है।
- source_word: ἀνθρώπῳ
  choice: मनुष्य के लिए
  rationale: एकवचन दत्तिव यहाँ सामान्य मानव का बोध कराता है; यह अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: ἐὰν πίνῃς αὐτὸν
  choice: यदि तुम उसे ... पियो
  rationale: यूनानी के द्वितीय पुरुष एकवचन और नीतिवचन-जैसे सीधे संबोधन को सुरक्षित रखता है।
- source_word: μέτρῳ αὐτοῦ
  choice: उचित मात्रा में
  rationale: शाब्दिक ‘उसकी मात्रा में’ हिन्दी में अस्वाभाविक है; ‘उचित मात्रा में’ माप और संयम दोनों का प्रसंगगत भाव स्पष्ट करता है।
- source_word: τίς ζωὴ
  choice: उसके लिए जीवन कैसा है?
  rationale: संक्षिप्त आलंकारिक प्रश्न को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: जिसे दाखमधु कम मिले
  rationale: ἐλασσουμένῳ को ‘कम होना/वंचित होना’ और οἴνῳ को जिस विषय में कमी है उसके रूप में समझता है। यूनानी वाक्यांश अत्यंत संक्षिप्त है, इसलिए दूसरी सम्भव व्याख्या पादटिप्पणी में दी गई है।
- source_word: ἔκτισται
  choice: रचा गया है
  rationale: यूनानी पूर्ण निष्क्रिय रूप के सृष्ट वस्तु होने के भाव को सुरक्षित रखता है।
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: मनुष्यों के आनन्द के लिए
  rationale: उद्देश्यसूचक εἰς और εὐφροσύνη के आनन्द/हर्ष के अर्थ को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दाखमधु का सृष्टिगत उद्देश्य और मात्रा की सीमा
  choice: वह मनुष्यों के आनन्द के लिए रचा गया है, पर उसे उचित मात्रा में पीना चाहिए
  alternative: पद को या तो पूर्ण मद्यनिषेध अथवा असीमित सेवन का समर्थन मानना
  rationale: मूल पाठ दाखमधु के सकारात्मक सृष्टिगत उद्देश्य और उसके मापे हुए सेवन—दोनों को साथ रखता है; अनुवाद इस तनाव को किसी साम्प्रदायिक निष्कर्ष से हल नहीं करता।
- issue: ἐλασσουμένῳ οἴνῳ की व्याख्या
  choice: दाखमधु की कमी वाला व्यक्ति
  alternative: दाखमधु से क्षीण अथवा हानि उठाने वाला व्यक्ति
  rationale: दत्तिव οἴνῳ को कमी के क्षेत्र के रूप में पढ़ना वाक्य के अगले कथन—दाखमधु आनन्द के लिए रचा गया—से सहज जुड़ता है, पर व्याकरणिक संक्षिप्तता के कारण हानि वाली व्याख्या भी सम्भव है और पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ के अनुकूल है; ‘उचित मात्रा’ शाब्दिक कठोरता से बचते हुए μέτρον का संयमित माप व्यक्त करता है। पादटिप्पणी-चिह्न [a] उसी विवादित वाक्यांश के बाद रखा गया है।
