  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
translation:
  language: hi
  text: जो गरीबों की सम्पत्ति में से बलि चढ़ाता है, वह मानो किसी पुत्र को उसके पिता के सामने मार डालता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “गरीबों की सम्पत्ति में से बलि चढ़ाने वाला, उसके पिता के सामने पुत्र को मार डालने वाला है।” यूनानी में यह एक संक्षिप्त लोकोक्तिपरक तुलना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύων
  choice: मानो ... मार डालता है
  rationale: यह कृदन्त बलि के लिए वध करने या मार डालने का अर्थ देता है। हिन्दी में निहित तुलना को स्पष्ट करने के लिए ‘मानो’ जोड़ा गया है, जबकि ‘मार डालता है’ मूल के चौंकाने वाले हिंसक बिंब को बनाए रखता है।
- source_word: υἱὸν
  choice: किसी पुत्र को
  rationale: यूनानी में स्वत्वसूचक शब्द नहीं है; इसलिए ‘अपने पुत्र’ नहीं जोड़ा गया। ‘पुत्र’ υἱός का सटीक अर्थ रखता है।
- source_word: ἔναντι
  choice: के सामने
  rationale: यह पिता की प्रत्यक्ष उपस्थिति का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: उसके पिता के
  rationale: सर्वनाम का सबसे स्वाभाविक सम्बन्ध पुत्र से है। ‘उसके पिता’ मूल की सम्भावित स्पष्टता को रखता है, बिना यह कहे कि वह बलि चढ़ाने वाले का पुत्र है।
- source_word: ὁ προσάγων θυσίαν
  choice: जो ... बलि चढ़ाता है
  rationale: यह सामान्य आधुनिक हिन्दी में बलि प्रस्तुत करने की धार्मिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ χρημάτων πενήτων
  choice: गरीबों की सम्पत्ति में से
  rationale: χρήματα धन, माल या सम्पत्ति को सूचित कर सकता है; ‘सम्पत्ति’ केवल नकद तक अर्थ सीमित नहीं करती। πενήτων बहुवचन है, इसलिए ‘गरीबों की’ रखा गया है।
theological_decisions:
- issue: अन्याय से प्राप्त सम्पत्ति की बलि और पुत्र-वध के बीच तुलना
  choice: 'तुलना को ‘मानो’ के द्वारा स्पष्ट किया गया है: गरीबों की सम्पत्ति से बलि चढ़ाना पिता के सामने किसी पुत्र को मार डालने के समान है।'
  alternative: 'अधिक शब्दशः और संकुचित रूप: ‘गरीबों की सम्पत्ति में से बलि चढ़ाने वाला, उसके पिता के सामने पुत्र को मार डालने वाला है।’'
  rationale: यूनानी वाक्य लोकोक्तिपरक और संक्षिप्त है। हिन्दी में ‘मानो’ निहित तुलना स्पष्ट करता है, पर मूल की नैतिक तीव्रता या धर्मवैचारिक तनाव को कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘सम्पत्ति’ अर्थ को धन से आगे अन्य वस्तुओं तक खुला रखती है; ‘मार डालता है’ मूल के कठोर नैतिक बिंब को सुरक्षित रखता है।
