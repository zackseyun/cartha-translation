translation:
  language: hi
  text: जो छाया को पकड़ने और हवा के पीछे दौड़ने की कोशिश करता है, वैसा ही वह है जो सपनों पर भरोसा करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सपनों को पकड़े रहता है” अथवा “जो सपनों पर ध्यान देता है।” यूनानी क्रिया किसी चीज़ को थामे रहने, उस पर निर्भर होने या उस पर ध्यान देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος σκιᾶς
  choice: छाया को पकड़ने की कोशिश करता है
  rationale: δρασσόμενος हाथ से थामने या पकड़ लेने का भाव देता है। हिंदी में ‘पकड़ने की कोशिश’ छाया को पकड़ने की निष्फलता स्वाभाविक रूप से व्यक्त करती है।
- source_word: διώκων ἄνεμον
  choice: हवा के पीछे दौड़ने
  rationale: यह चयन यूनानी रूपक को बनाए रखता है और निष्फल प्रयास का भाव साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: ὁ ἐπέχων
  choice: जो ... पर भरोसा करता है
  rationale: ἐπέχω यहाँ किसी बात पर ध्यान टिकाने, उसे थामे रहने या उस पर निर्भर होने का अर्थ दे सकता है। प्रसंग में ‘भरोसा करता है’ उपमा के नकारात्मक आशय को स्वाभाविक ढंग से व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐνυπνίοις
  choice: सपनों
  rationale: बहुवचन ἐνυπνίοις नींद में देखे गए सपनों या स्वप्न-दर्शनों को सूचित करता है; ‘सपनों’ इसका सबसे सहज और व्यापक हिंदी रूप है।
theological_decisions:
- issue: ὁ ἐπέχων ἐνυπνίοις का अर्थगत बल
  choice: जो सपनों पर भरोसा करता है
  alternative: जो सपनों को पकड़े रहता है; जो सपनों पर ध्यान देता है
  rationale: यूनानी क्रिया में थामे रहने, निर्भर होने और ध्यान देने की अर्थ-सीमा है। मुख्य पाठ में ‘भरोसा करता है’ इस पद की निष्फलता दर्शाने वाली उपमा के साथ सहज बैठता है, पर अस्पष्टता को पादटिप्पणी में बनाए रखा गया है; इससे सपनों के विषय में कोई अतिरिक्त सांप्रदायिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर उपमा को सुरक्षित रखते हुए शाब्दिक चित्र और उसका निष्फलता का भाव दोनों स्पष्ट किए गए हैं।
