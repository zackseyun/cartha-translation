base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: hi
  text: जब तक वह मनुष्य को उसके कर्म का बदला न दे, और हर व्यक्ति को उसकी युक्ति के अनुसार प्रतिफल न दे;[a] जब तक वह अपनी प्रजा का मुकदमा न लड़े और अपने उद्धार से उन्हें आनन्दित न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'सिराख 34:19 का उपलब्ध यूनानी पाठ इसके स्थान पर कहता है: “जो अन्यायपूर्ण रीति से बलिदान चढ़ाता है, उसकी भेंट दोषयुक्त होती है; और अधर्मियों की भेंटें स्वीकार्य नहीं हैं।” यहाँ बचा हुआ हिब्रू पाठ यूनानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: जब तक
  rationale: दोनों खंडों में यह पहले से चली आ रही स्थिति की समय-सीमा बताता है; ‘जब तक’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: ישיב לאנוש פעלו
  choice: वह मनुष्य को उसके कर्म का बदला न दे
  rationale: שוב का यहाँ प्रतिदान या बदला चुकाने का भाव है, और פעלו नैतिक कर्म को सूचित करता है।
- source_word: וגמול אדם כמזימתו
  choice: और हर व्यक्ति को उसकी युक्ति के अनुसार प्रतिफल न दे
  rationale: गुंथे हुए हिब्रू वाक्यांश का आशय व्यक्ति को उसकी योजना या युक्ति के अनुरूप प्रतिफल मिलना है। ‘युक्ति’ מזמה के संभावित नैतिक रूप से नकारात्मक भाव को खुला रखती है।
- source_word: יריב ריב עמו
  choice: वह अपनी प्रजा का मुकदमा न लड़े
  rationale: यह सजातीय क्रिया-संज्ञा रचना न्यायिक अर्थ रखती है—किसी का पक्ष लेकर उसका मुकदमा लड़ना।
- source_word: ושמחם
  choice: उन्हें आनन्दित न करे
  rationale: हिब्रू क्रिया का कारक भाव, ‘उन्हें आनन्दित करना’, स्पष्ट रखा गया है।
- source_word: בישועתו
  choice: अपने उद्धार से
  rationale: ישועה का अर्थ उद्धार, छुटकारा या विजय हो सकता है; ‘उद्धार’ व्यापक धार्मिक और बचाव-संबंधी अर्थ को बनाए रखता है।
theological_decisions:
- issue: उपलब्ध हिब्रू पाठ और यूनानी पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध हिब्रू साक्ष्य का अनुवाद किया गया और यूनानी पाठांतर को पादटिप्पणी में दिया गया।
  alternative: 'यूनानी पाठ का अनुवाद मुख्य पाठ में रखना: ‘जो अन्याय से प्राप्त वस्तु का बलिदान चढ़ाता है, वह दोषयुक्त भेंट चढ़ाता है; और अधर्मियों के दान स्वीकार नहीं किए जाते।’'
  rationale: जहाँ सिराख का हिब्रू पाठ उपलब्ध है, वही प्राथमिक स्रोत है। फिर भी यूनानी साक्ष्य पूर्णतः भिन्न है, इसलिए पाठगत तनाव को छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। न्यायिक बिंब के लिए ‘मुकदमा लड़े’, नैतिक प्रतिदान के लिए ‘कर्म का बदला’ और धार्मिक उद्धार के लिए ‘उद्धार’ चुना गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
