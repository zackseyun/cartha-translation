  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: hi
  text: भट्ठी डुबाई हुई धातु की कठोरता को परखती है[a]; वैसे ही दाखमधु घमंडियों के कलह में हृदयों को परखता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहली पंक्ति का यूनानी पाठ कठिन है। ‘डुबाई हुई धातु की कठोरता’ का अर्थ अधिक विशेष रूप से ‘बुझाकर कठोर की गई धार’ या अधिक व्यापक रूप से ‘डुबोई गई धातु-कृति’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘घमंडियों की लड़ाई में।’ यूनानी शब्द युद्ध, लड़ाई या संघर्ष का अर्थ दे सकता है; यहाँ उसे अधिक व्यापक अर्थ में ‘कलह’ कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: भट्ठी
  rationale: यह शब्द तीव्र ताप वाली भट्ठी को दर्शाता है; धातु को परखने के प्रसंग में ‘भट्ठी’ स्वाभाविक और स्पष्ट है।
- source_word: δοκιμάζει
  choice: परखती है
  rationale: क्रिया किसी वस्तु के गुण या असलियत की जाँच करने का भाव रखती है; ‘परखना’ इस मूल्यांकनकारी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: στόμωμα
  choice: धातु की कठोरता
  rationale: शब्द धार, कठोरीकरण अथवा धातु के कड़ेपन का संकेत दे सकता है। प्रसंग धातुकर्म का है, पर सटीक तकनीकी अर्थ अनिश्चित है; इसलिए मुख्य पाठ में व्यापक और बोधगम्य अभिव्यक्ति रखी गई है।
- source_word: ἐν βαφῇ
  choice: डुबाई हुई
  rationale: मूल पद का आधारभूत अर्थ डुबाना है और धातुकर्म में यह बुझाकर कठोर करने की क्रिया का संकेत हो सकता है। ‘डुबाई हुई’ मूल बिंब को बचाते हुए तकनीकी अर्थ को निर्णायक रूप से नहीं थोपता।
- source_word: οὕτως
  choice: वैसे ही
  rationale: यह दोनों पंक्तियों के बीच तुलना को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οἶνος
  choice: दाखमधु
  rationale: यह यूनानी ‘दाखरस/वाइन’ का सटीक, गरिमापूर्ण और बाइबिलीय प्रसंग में परिचित हिन्दी समतुल्य है।
- source_word: καρδίας
  choice: हृदयों
  rationale: बहुवचन को बनाए रखते हुए ‘हृदय’ व्यक्ति के भीतरी स्वभाव और चरित्र का पारंपरिक बाइबिलीय बिंब सुरक्षित रखता है।
- source_word: ἐν μάχῃ
  choice: कलह में
  rationale: μάχη युद्ध, लड़ाई या व्यापक संघर्ष को सूचित कर सकता है। यहाँ ‘कलह’ सामाजिक टकराव का स्वाभाविक अर्थ देता है, जबकि वैकल्पिक सैन्य अर्थ पादटिप्पणी में रखा गया है।
- source_word: ὑπερηφάνων
  choice: घमंडियों के
  rationale: यह नैतिक रूप से निंदित अभिमान रखने वालों को दर्शाता है; ‘घमंडी’ आधुनिक हिन्दी में सीधा और स्पष्ट है।
theological_decisions:
- issue: στόμωμα ἐν βαφῇ वाले कठिन प्रथम खंड की व्याख्या
  choice: धातुकर्म का व्यापक बिंब—भट्ठी डुबाई हुई धातु की कठोरता को परखती है
  alternative: भट्ठी बुझाकर कठोर की गई धार को परखती है; अथवा भट्ठी डुबोई गई धातु-कृति को परखती है
  rationale: यह मुख्यतः शब्दार्थ और पाठ-व्याख्या की कठिनाई है, कोई सिद्धान्तगत निष्कर्ष नहीं। अनिश्चित यूनानी पद को अत्यधिक विशिष्ट ‘तलवार की धार’ आदि बनाना उचित नहीं; व्यापक धातुकर्म-बिंब तुलना के आशय—उत्तेजक परिस्थिति में भीतरी चरित्र की परख—को सुरक्षित रखता है।
- issue: ἐν μάχῃ ὑπερηφάνων का संबंध और अर्थ
  choice: घमंडियों के कलह में
  alternative: घमंडियों की लड़ाई में
  rationale: सम्बन्धवाचक रूप को उन्हीं लोगों के संघर्ष से जोड़ा गया है जिन्हें घमंडी कहा गया है। ‘कलह’ सामाजिक संघर्ष की सम्भावना रखता है, पर मूल के अधिक प्रत्यक्ष ‘लड़ाई’ अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। वाक्य की सूक्तिपरक समानता बनाए रखी गई है। कठिन धातुकर्म-संबंधी पद को मुख्य पाठ में समझने योग्य रखा गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
