  text: For he is a God of justice[a], and with him there is no partiality.
translation:
  language: hi
  text: क्योंकि वह न्यायी परमेश्वर है[a], और उसके यहाँ कोई पक्षपात नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'स्वीट के संस्करण में इस पद के लिए दिया गया यूनानी पाठ एक अलग वाक्य पढ़ता है: “मैं अनेक बार मृत्यु तक संकट में पड़ा, और इन बातों के कारण बचाया गया।” इससे यहाँ पाठ या पद-क्रम की विसंगति का संकेत मिलता है। यह अनुवाद उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण बताता है और इब्रानी के कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אלהי משפט
  choice: न्याय का परमेश्वर
  rationale: रचना-संबंधी पदबंध परमेश्वर के न्यायी चरित्र को व्यक्त करता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: משפט
  choice: न्याय
  rationale: इस संदर्भ में शब्द परमेश्वर के निष्पक्ष नैतिक और न्यायिक चरित्र को दर्शाता है, केवल किसी न्यायादेश को नहीं।
- source_word: אין עמו
  choice: उसके यहाँ ... नहीं है
  rationale: यह मुहावरा परमेश्वर की उपस्थिति और व्यवहार में किसी चीज़ के न होने को सहज हिन्दी में व्यक्त करता है।
- source_word: משוא פנים
  choice: पक्षपात
  rationale: यह किसी व्यक्ति की हैसियत या पहचान देखकर अनुचित अनुग्रह करने के इब्रानी मुहावरे का प्रचलित और सटीक हिन्दी रूप है।
theological_decisions:
- issue: משפט को परमेश्वर के चरित्र के कथन में कैसे व्यक्त किया जाए
  choice: न्याय
  alternative: न्याय-दण्ड / फैसला
  rationale: यहाँ कथन परमेश्वर के न्यायी स्वभाव पर आधारित है; ‘न्याय’ नैतिक और न्यायिक दोनों बलों को सुरक्षित रखता है।
- issue: असंबद्ध यूनानी समानांतर के बावजूद इब्रानी संदर्भ को बनाए रखना
  choice: उपलब्ध इब्रानी साक्ष्य का अनुवाद करके पाठांतर-संबंधी विसंगति को पादटिप्पणी में बताना
  alternative: उपलब्ध यूनानी वाक्य का अनुवाद करना या दोनों पाठों को मिलाना
  rationale: इस स्थान पर जीवित इब्रानी साक्ष्य मुख्य आधार है, जबकि दिया गया यूनानी समानांतर एक अलग वाक्य प्रस्तुत करता है। दोनों को मिलाने के बजाय विसंगति को स्पष्ट रूप से दर्ज करना पाठ-साक्ष्य के प्रति ईमानदार है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परमेश्वर’ और ‘पक्षपात’ जैसे परिचित शब्द न्यायिक तथा धर्मवैचारिक आशय को बिना सांप्रदायिक विस्तार के व्यक्त करते हैं।
