  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: hi
  text: अशुद्ध से क्या शुद्ध किया जाएगा? और झूठ से क्या सच साबित होगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और झूठ से क्या सत्य होगा?” यूनानी क्रिया का अर्थ “सच बोलना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: से
  rationale: दोनों उपवाक्यों में स्रोत या उद्गम का बोध कराता है; हिन्दी में ‘से’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀκαθάρτου
  choice: अशुद्ध
  rationale: यह एक विशेषण है जिसका संज्ञा के रूप में सामान्य अर्थ में प्रयोग हुआ है। ‘अशुद्ध’ मूल की व्यापकता बनाए रखता है और किसी विशेष वस्तु को अनावश्यक रूप से नहीं जोड़ता।
- source_word: τί
  choice: क्या
  rationale: यह निर्जीव या सामान्य परिणाम के विषय में आलंकारिक प्रश्न पूछता है; ‘क्या’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: καθαρισθήσεται
  choice: शुद्ध किया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप को स्पष्ट रखता है और अशुद्ध स्रोत से शुद्ध परिणाम की असंगति को व्यक्त करता है।
- source_word: ψευδοῦς
  choice: झूठ
  rationale: संज्ञा के रूप में प्रयुक्त यह शब्द असत्य या झूठ को दर्शाता है। ‘झूठ’ आधुनिक हिन्दी में स्वाभाविक है और किसी एक कथन तक अर्थ को अनिवार्य रूप से सीमित नहीं करता।
- source_word: ἀληθεύσει
  choice: सच साबित होगा
  rationale: क्रिया के ‘सत्य होना/सत्य सिद्ध होना’ वाले अर्थ को ग्रहण करता है और पहले उपवाक्य के परिणामपरक समानांतर को बनाए रखता है; अन्य संभव अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: नीतिवचन-सदृश समानांतरता में ἀληθεύσει का अर्थ
  choice: 'परिणाम अथवा प्रमाण का भाव: ‘सच साबित होगा’'
  alternative: 'वचन के भाव में: ‘सच बोलेगा’; अथवा स्थिति के भाव में: ‘सत्य होगा’'
  rationale: दोनों आलंकारिक प्रश्न अशुद्ध या झूठे स्रोत से शुद्ध अथवा सच्चा परिणाम निकलने की असंगति पर केंद्रित हैं। फिर भी यूनानी क्रिया की वास्तविक बहुअर्थकता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सदृश रखी गई है। ‘अशुद्ध’ और ‘झूठ’ को सामान्य स्रोतों के रूप में प्रस्तुत किया गया है; किसी विशेष धार्मिक या अनुष्ठानिक संदर्भ को नहीं जोड़ा गया। पादटिप्पणी का चिह्न दूसरी पंक्ति की बहुअर्थी यूनानी क्रिया के बाद रखा गया है।
