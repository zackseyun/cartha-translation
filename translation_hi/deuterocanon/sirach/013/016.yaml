base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/016.yaml
  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: hi
  text: भेड़िए और मेमने में कैसी संगति हो सकती है? वैसे ही दुष्ट मनुष्य और धर्मी मनुष्य में,[b] और इसी प्रकार धनी मनुष्य और दीन बना दिया गया मनुष्य में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “धनी मनुष्य और दीन बना दिया गया मनुष्य में।” अंतिम अभिव्यक्ति कुछ अनिश्चित है; इसका अर्थ सामाजिक रूप से नीचा या विपन्न कर दिया गया व्यक्ति हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ है: “हर प्राणी अपनी जाति के अनुसार इकट्ठा होता है, और मनुष्य अपने समान व्यक्ति से जुड़ जाएगा।” यह कहावत के एक भिन्न रूप को दर्शाता है और समान स्वभाव या स्थिति वाले लोगों के परस्पर मेल-जोल के सामान्य विषय का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: कैसी संगति हो सकती है
  rationale: חבר के निष्क्रिय रूप में जुड़ने या मेल-जोल रखने का भाव है। प्रश्नवाचक वाक्य असंगति पर बल देता है; ‘कैसी संगति हो सकती है’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: זְאֵב אֶל כֶּבֶשׂ
  choice: भेड़िए और मेमने में
  rationale: दोनों पशु-शब्दों का सीधा अनुवाद है। शिकारी और असहाय शिकार का विरोध स्पष्ट रखने के लिए כֶּבֶשׂ को ‘मेमना’ किया गया है।
- source_word: רָשָׁע לַצַּדִיק
  choice: दुष्ट मनुष्य और धर्मी मनुष्य में
  rationale: दोनों विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक पुल्लिंग एकवचन हैं। हिन्दी में ‘मनुष्य’ जोड़ने से समानांतरता और संबंध स्पष्ट रहता है।
- source_word: עָשִׁיר
  choice: धनी मनुष्य
  rationale: यह संज्ञा के रूप में प्रयुक्त पुल्लिंग एकवचन है और कहावत में सामान्य प्रकार के व्यक्ति को दर्शाता है।
- source_word: אִישׁ נֶאֱצָל
  choice: दीन बनाए गए मनुष्य
  rationale: अंतिम पद कठिन और कुछ अनिश्चित है। ‘दीन बनाए गए’ सामाजिक या आर्थिक रूप से नीचे कर दिए जाने का निष्क्रिय भाव बनाए रखता है और इसे केवल ‘गरीब’ तक सीमित नहीं करता।
theological_decisions:
- issue: ज्ञान-साहित्य की कहावत में प्रतिनिधिक पुल्लिंग
  choice: दुष्ट मनुष्य / धर्मी मनुष्य / धनी मनुष्य / दीन बनाए गए मनुष्य
  alternative: दुष्ट व्यक्ति / धर्मी व्यक्ति / धनी व्यक्ति / दीन व्यक्ति
  rationale: इब्रानी में पुल्लिंग एकवचन रूप हैं। हिन्दी में ‘मनुष्य’ स्रोत की प्रतिनिधिक पुल्लिंग रचना को बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- issue: इब्रानी मुख्य पाठ और भिन्न यूनानी समानांतर
  choice: मुख्य पाठ में इब्रानी की भेड़िए-मेमने वाली कहावत
  alternative: 'यूनानी पाठ: ‘हर प्राणी अपनी जाति के अनुसार इकट्ठा होता है, और मनुष्य अपने समान व्यक्ति से जुड़ जाएगा।’'
  rationale: उपलब्ध इब्रानी पाठ उच्च विश्वसनीयता वाला मुख्य साक्ष्य है। यूनानी में कथन का रूप पर्याप्त भिन्न है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और कहावत-सदृश रूप अपनाया गया है। ‘संगति’ धार्मिक और सामान्य दोनों संदर्भों में समझ में आने वाला शब्द है। अंतिम कठिन इब्रानी पद की अनिश्चितता मुख्य पाठ और पादटिप्पणी, दोनों में सुरक्षित रखी गई है।
