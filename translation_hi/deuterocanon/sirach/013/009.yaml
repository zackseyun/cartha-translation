translation:
  language: hi
  text: जब कोई प्रभावशाली व्यक्ति तुम्हें अपने पास बुलाए[a], तो कुछ दूरी बनाए रखो; तब वह तुम्हें और पास बुलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश बहुत संक्षिप्त है और अधिक शाब्दिक रूप से इसका अर्थ यह भी हो सकता है: “किसी प्रभावशाली व्यक्ति के निकट जा; दूर रह।” यूनानी समानांतर यहाँ अपनाए गए अर्थ का समर्थन करता है: जब कोई शक्तिशाली व्यक्ति तुम्हें बुलाए, तो संयम से पीछे रहो, और वह तुम्हें और निकट बुलाएगा।'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב
  choice: अपने पास बुलाए
  rationale: इब्रानी रूप संक्षिप्त है और इसे आज्ञार्थक ‘निकट जा’ भी समझा जा सकता है; यूनानी समानांतर का προσκαλεσαμένου σε किसी शक्तिशाली व्यक्ति द्वारा बुलाए जाने का अर्थ पुष्ट करता है। हिंदी में ‘अपने पास बुलाए’ इस प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָדִיב
  choice: प्रभावशाली व्यक्ति
  rationale: इस ज्ञान-साहित्यिक प्रसंग में शब्द ऊँचे सामाजिक पद और सामर्थ्य वाले व्यक्ति को सूचित करता है। ‘प्रभावशाली व्यक्ति’ राजकीय पद को अनावश्यक रूप से निश्चित किए बिना सामाजिक शक्ति का भाव देता है; यूनानी δυνάστης भी इसी ओर संकेत करता है।
- source_word: הֱיֶה רָחוֹק
  choice: कुछ दूरी बनाए रखो
  rationale: शाब्दिक अर्थ ‘दूर रहो’ है। यहाँ आशय शक्तिशाली व्यक्ति के सामने संकोचपूर्ण संयम बरतने से है; यह हिंदी प्रयोग उस सावधानी को सहज और स्पष्ट रखता है।
- source_word: וּכְדֵי כֵן
  choice: तब
  rationale: यह संयम के परिणाम को बताता है। यूनानी τόσῳ μᾶλλον में तीव्रतर परिणाम का भाव है, जिसे अगले वाक्यांश के ‘और पास’ में व्यक्त किया गया है।
- source_word: יַגִּישֶׁךָ
  choice: वह तुम्हें और पास बुलाएगा
  rationale: नגשׁ का यह रूप कर्म-प्रत्यय सहित किसी को निकट कराने का भाव देता है। ‘और पास बुलाएगा’ यूनानी समानांतर के पुनः/अधिक आग्रह से बुलाने के भाव और सूक्ति के तुलनात्मक परिणाम दोनों को व्यक्त करता है।
