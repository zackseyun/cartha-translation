base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: hi
  text: एक निर्धन डगमगाता है; वह बोलता है, और लोग चिल्लाते हैं, “दूर हटो, दूर हटो!”[a] परन्तु एक समझदार व्यक्ति बोलता है, और उसके लिए कोई स्थान नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“दूर हटो, दूर हटो!” के रूप में अनूदित इब्रानी वाक्यांश अत्यन्त संक्षिप्त और मुहावरेदार है। इसमें बार-बार झिड़कने या तिरस्कारपूर्वक दूर करने की पुकार का भाव है। यूनानी समानान्तर पाठ इस अर्थ को विस्तार से बताता है: जब दीन व्यक्ति चूकता है, तो लोग उसे फटकारते हैं।'
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी बात को सुनवाई नहीं मिलती।” मूलतः, “उसके लिए कोई स्थान नहीं है”; अर्थात उसकी समझदारी की बात को समाज में जगह या स्वीकृति नहीं मिलती।
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: एक निर्धन
  rationale: यह शब्द आर्थिक अभाव के साथ सामाजिक निर्बलता या निम्न स्थिति भी व्यक्त कर सकता है। एकवचन नीतिवचनात्मक रूप बनाए रखा गया है।
- source_word: נָמוֹט
  choice: डगमगाता है
  rationale: क्रिया फिसलने, डगमगाने या अस्थिर होने का बोध देती है; यह नैतिक भूल और परिस्थितिजन्य विफलता में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: גָּע גָּע יִשֶּׂא
  choice: लोग चिल्लाते हैं, “हटो, हटो!”
  rationale: दुहराया हुआ संक्षिप्त उद्गार तिरस्कारपूर्ण ढंग से दूर करने या झिड़कने का भाव देता है। कर्ता को सहज हिन्दी के लिए अनिश्चित बहुवचन ‘लोग’ से व्यक्त किया गया है।
- source_word: מַשְׂכִּיל
  choice: एक समझदार व्यक्ति
  rationale: यहाँ अंतर्दृष्टि और समझ रखने वाले व्यक्ति का भाव है; ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक है और केवल विद्वत्ता का अर्थ नहीं देता।
- source_word: וְאֵין לוֹ מָקוֹם
  choice: उसके लिए कोई स्थान नहीं होता
  rationale: मूल का स्थान-संबंधी रूपक सुरक्षित रखा गया है; प्रसंग में इसका आशय उसकी बात को सुनवाई, स्वीकृति या सामाजिक अवसर न मिलना हो सकता है।
