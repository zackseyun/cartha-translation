translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सहज हिन्दी। एकवचन अनौपचारिक संबोधन के अनुरूप ‘तुम्हें/तुम्हारी’ रखा गया है। ‘बेझिझक’ प्रसंगगत अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी मूल की वास्तविक शाब्दिक और अर्थगत गुंजाइश सुरक्षित रखती है।
