base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: hi
  text: उसके साथ बेझिझक मत होना[a], और उसकी बहुत-सी बातों पर विश्वास मत करना; क्योंकि बहुत बातें करके वह तुम्हें परखता है, और तुम्हारे साथ हँसते हुए तुम्हारी टोह लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने खुलकर बोलने की छूट मत लेना।” इब्रानी में शाब्दिक भाव “उसके साथ स्वतंत्रता” है; इसका आशय असावधान अपनापन या उसके सामने बहुत खुलकर बोलना हो सकता है। यूनानी समानांतर भी स्वतंत्र रूप से बोलने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: भरोसा न करना
  rationale: निषेध स्पष्ट है; आधुनिक हिन्दी में यह स्वाभाविक रूप से विश्वास या आश्वस्तता रखने से मना करता है।
- source_word: לְחֹפֶשׁ עִמּוֹ
  choice: उसके साथ बेझिझक होने पर
  rationale: חֹפֶשׁ का मूल भाव स्वतंत्रता है; इस प्रसंग में עִמּוֹ के साथ यह असावधान निकटता या खुलकर बोलने की छूट को सूचित करता है। यूनानी ἰσηγορεῖσθαι भी स्वतंत्र या बराबरी से बोलने की दिशा में संकेत करता है।
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: और उसकी बहुत-सी बातों पर विश्वास न करना
  rationale: अधिक बोलने की मात्रा और उन बातों को सच मान लेने के विरुद्ध चेतावनी—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: כִּי מַרְבִּית שִׂיחוֹ נִסּיוֹן
  choice: क्योंकि बहुत बातें करके वह तुम्हें परखता है
  rationale: इब्रानी वाक्यांश संक्षिप्त है, जबकि यूनानी समानांतर πειράσει σε संबोधन के व्यक्ति को परखे जाने की पुष्टि करता है। क्रियात्मक अनुवाद हिन्दी में स्पष्ट है।
- source_word: וְשֹׂחֵק לְךָ
  choice: और तुम्हारे साथ हँसते हुए
  rationale: ऊपरी मित्रता और साथ-साथ चल रही जाँच के तनाव को सुरक्षित रखता है; לְךָ प्रसंग में ‘तुम्हारे साथ/तुम पर’ की गुंजाइश रखता है।
- source_word: וַחֲקָרֶךָ
  choice: तुम्हारी टोह लेता है
  rationale: חקר की खोजने, जाँचने और भीतर की बात जानने की धारणा को अन्तरव्यक्तिगत तथा छिपी हुई पड़ताल के प्रसंग में स्वाभाविक हिन्दी देता है।
