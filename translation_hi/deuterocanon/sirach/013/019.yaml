translation:
  language: hi
  text: विनम्रता घमंड को घृणित लगती है[a], और निर्धन धनी को घृणित लगता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में है: “जंगल में जंगली गधे सिंहों का शिकार हैं; उसी प्रकार निर्धन धनियों के चरागाह हैं।” यहाँ उपलब्ध इब्रानी पाठ इसके बजाय कहता है: “विनम्रता घमंड को घृणित लगती है, और निर्धन धनी को घृणित लगता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित लगती है / घृणित लगता है
  rationale: सम्बन्धसूचक इब्रानी रचना का अर्थ है कि एक वस्तु या व्यक्ति दूसरे को अत्यन्त अप्रिय अथवा घृणित लगता है। यह रूप प्रबल वितृष्णा बनाए रखता है, पर अनावश्यक रूप से कर्मकाण्डीय अर्थ नहीं जोड़ता।
- source_word: גַּאֲוָה
  choice: घमण्ड
  rationale: यहाँ संज्ञा अहंकार या दर्प को दर्शाती है। आधुनिक सामान्य हिन्दी में ‘घमण्ड’ सहज है और दीनता के साथ नैतिक विरोध स्पष्ट रखता है।
- source_word: עֲנָוָה
  choice: दीनता
  rationale: इब्रानी अमूर्त संज्ञा नम्र या दीन अवस्था अथवा स्वभाव को व्यक्त करती है। ‘दीनता’ इस पद में सामाजिक और चारित्रिक दोनों आयाम खुला रखती है; केवल कोमलता का अर्थ नहीं देती।
- source_word: עָשִׁיר
  choice: धनी
  rationale: इब्रानी में एकवचन प्रतिनिधिक है और सामान्य सामाजिक सत्य व्यक्त करता है। हिन्दी में बिना अनिश्चित उपपद के ‘धनी’ ऐसा प्रतिनिधिक अर्थ स्वाभाविक रूप से देता है।
- source_word: אֶבְיוֹן
  choice: निर्धन
  rationale: शब्द गरीब या जरूरतमंद व्यक्ति को दर्शाता है। ‘निर्धन’ विपरीत पद ‘धनी’ के साथ स्पष्ट और गरिमापूर्ण सामाजिक विरोध बनाता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और उससे बहुत भिन्न यूनानी समानान्तर पाठ में से मुख्य पाठ का चुनाव
  choice: 'उपलब्ध इब्रानी का सीधा अनुवाद: ‘दीनता घमण्ड को घृणित लगती है, और निर्धन धनी को घृणित लगता है।’'
  alternative: 'यूनानी साक्षी का भाव: ‘जंगल में जंगली गधे सिंहों का शिकार हैं; उसी प्रकार निर्धन धनियों की चराई हैं।’'
  rationale: इस स्थान पर इब्रानी पाठ उपलब्ध, स्पष्ट और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी साक्षी एक अत्यन्त भिन्न कहावत देता है; इस महत्त्वपूर्ण पाठभेद को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कहावत-जैसी और गरिमापूर्ण शैली रखी गई है। दोनों खण्डों की समान रचना को यथासम्भव बनाए रखा गया है; ‘को … लगता/लगती है’ से इब्रानी सम्बन्धसूचक बल स्वाभाविक हिन्दी में व्यक्त होता है।
