base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/017.yaml
  text: What peace can there be between a hyena and a dog? What peace can there be between a rich man and a poor man?[a]
translation:
  language: hi
  text: लकड़बग्घे और कुत्ते के बीच कैसी शांति हो सकती है? धनी मनुष्य और निर्धन मनुष्य के बीच कैसी शांति हो सकती है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ है: “भेड़िया मेमने के साथ क्या साझा करेगा? उसी प्रकार पापी धर्मपरायण मनुष्य के साथ क्या साझा करेगा?” इसके विपरीत, इब्रानी साक्ष्य में “लकड़बग्घा ... कुत्ता” और “धनी मनुष्य ... निर्धन मनुष्य” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: कैसी ... हो सकती है
  rationale: यहाँ शब्दशः ‘कहाँ से’ एक आलंकारिक प्रश्न है, जो शान्तिपूर्ण सम्बन्ध की असम्भावना व्यक्त करता है; आधुनिक हिन्दी में ‘कैसी ... हो सकती है?’ इसका स्वाभाविक बल बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह शब्द शान्तिपूर्ण सम्बन्ध या मेल को दर्शाता है; ‘शान्ति’ सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: צָבוּעַ
  choice: लकड़बग्घा
  rationale: उत्तर-बाइबलीय और बेन सीरा की इब्रानी में यह सामान्यतः लकड़बग्घे का द्योतक है। उपलब्ध इब्रानी साक्ष्य को यूनानी के ‘भेड़िये’ पर प्राथमिकता दी गई है।
- source_word: כָּלֶב
  choice: कुत्ता
  rationale: यह इसका सीधा हिन्दी समतुल्य है।
- source_word: עָשִׁיר
  choice: धनी मनुष्य
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और רָשׁ के समानान्तर सामाजिक विरोध प्रस्तुत करता है।
- source_word: רָשׁ
  choice: निर्धन मनुष्य
  rationale: यह गरीब या अभावग्रस्त व्यक्ति को सूचित करता है; ‘निर्धन मनुष्य’ पुल्लिंग एकवचन और कहावत के सामाजिक विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानान्तर में बिम्ब तथा अर्थ का अन्तर
  choice: मुख्य पाठ में इब्रानी का ‘लकड़बग्घा ... कुत्ता’ और ‘धनी ... निर्धन’ रखा गया है।
  alternative: 'यूनानी: ‘भेड़िया मेमने के साथ क्या साझा करेगा? उसी प्रकार पापी का भक्त मनुष्य से क्या मेल?’'
  rationale: जहाँ बेन सीरा का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी पाठ वास्तविक और अर्थपूर्ण वैकल्पिक परम्परा को सुरक्षित रखता है, जो सामाजिक-आर्थिक विरोध को नैतिक विरोध में बदल देता है; इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है।
