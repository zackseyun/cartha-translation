    reason: textual_variant
lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: उसे तुमसे काम है
  rationale: यह स्वाभाविक हिन्दी में उस इब्रानी प्रयोग को व्यक्त करता है जिसमें सामने वाले व्यक्ति से आवश्यकता या स्वार्थ जुड़ा है। इब्रानी में शर्त स्पष्ट नहीं है, इसलिए मुख्य पाठ में ‘यदि’ नहीं जोड़ा गया।
- source_word: וְהָשִׁיעַ לָךְ
  choice: इसलिए वह तुम्हें बहकाएगा
  rationale: इब्रानी रूप कठिन है, पर प्रसंग में मित्रवत व्यवहार के द्वारा छलने का भाव उपयुक्त है। ‘इसलिए’ हिन्दी में पहले खंड से इसका स्वाभाविक संबंध दिखाता है; यूनानी समानांतर इससे भी ठोस रूप में व्यक्ति को खाली कर देने या उसका शोषण करने की बात कहता है।
- source_word: וְשׁוֹחֵק לְךָ
  choice: वह तुम्हारी ओर मुस्कराएगा
  rationale: שׂחק का अर्थ हँसना या खेलना भी हो सकता है, लेकिन छलपूर्ण मित्रता के इस प्रसंग में ‘मुस्कराएगा’ बाहरी अपनापन सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהִבְטִיחֶךָ
  choice: तुम्हें भरोसा दिलाएगा
  rationale: בטח के कारक रूप का अर्थ किसी को सुरक्षित या आश्वस्त अनुभव कराना है। ‘भरोसा दिलाएगा’ आधुनिक हिन्दी में इस भाव को स्पष्ट और सहज रूप से रखता है।
- source_word: ἀποκενώσει σε
  choice: तुम्हें पूरी तरह खाली कर देगा
  rationale: यूनानी समानांतर का शाब्दिक अर्थ व्यक्ति को ‘खाली कर देना’ है, अर्थात उसके साधन चूस लेना या उसका शोषण करना। इसे पाठांतर के रूप में पादटिप्पणी में रखा गया है।
