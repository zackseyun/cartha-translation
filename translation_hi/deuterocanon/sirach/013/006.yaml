translation:
  language: hi
  text: उसे तुमसे काम है, और वह तुम्हें बहकाएगा[a]; वह तुम्हारी ओर मुस्कराएगा और तुम्हें भरोसा दिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
