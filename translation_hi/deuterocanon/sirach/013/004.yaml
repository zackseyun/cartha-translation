base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/004.yaml
  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
translation:
  language: hi
  text: यदि तुम उसके काम के हो[a], तो वह तुमसे काम लेगा; और यदि तुम गिर पड़ो, तो वह तुम पर दया नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी परंपरा में है: “धनी अन्याय करता है और और भी धमकाता है; निर्धन के साथ अन्याय होता है और उसे विनती भी करनी पड़ती है।” यहाँ सुरक्षित इब्रानी पाठ एक अलग चेतावनी देता है: शक्तिशाली व्यक्ति, जब तुम उसके लिए उपयोगी हो, तुमसे काम लेता है; पर तुम्हारे गिरने पर दया नहीं करता।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: यदि तुम उसके काम के हो
  rationale: כשר यहाँ नैतिक भलाई नहीं, बल्कि किसी के लिए उपयुक्त या लाभकारी होने का भाव देता है। हिंदी मुहावरा ‘उसके काम के’ इस व्यावहारिक उपयोगिता और प्रसंग में निहित स्वार्थपूर्ण संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַעֲבֹד בָּךְ
  choice: वह तुमसे काम लेगा
  rationale: शाब्दिक भाव ‘तुम्हारे द्वारा/तुम पर काम करेगा’ है। ‘तुमसे काम लेगा’ सहज हिंदी में किसी व्यक्ति को अपने प्रयोजन के लिए इस्तेमाल करने का भाव रखता है, पर ‘शोषण करेगा’ जितना व्याख्यात्मक रूप से प्रबल नहीं है।
- source_word: וְאִם תִּכְרַע
  choice: और यदि तुम गिर पड़ो
  rationale: כרע का अर्थ झुकना, घुटने टेकना या गिर पड़ना हो सकता है। यहाँ ‘गिर पड़ो’ शारीरिक पतन और दुर्बल या दीन दशा में पहुँचने—दोनों संभावनाओं को खुला रखता है; केवल स्वेच्छा से ‘झुकने’ का अर्थ आरोपित नहीं करता।
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: वह तुम पर दया नहीं करेगा
  rationale: חמל में दया करना और दया के कारण छोड़ देना, दोनों भाव हैं। ‘दया नहीं करेगा’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है तथा भावनात्मक कठोरता और व्यावहारिक निर्दयता दोनों को समेटता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और उससे बहुत भिन्न यूनानी परंपरा में आधार-पाठ का चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का सीधा अनुवाद
  alternative: 'यूनानी के अनुसार: ‘धनी अन्याय करता है और ऊपर से क्रोध भी दिखाता है; निर्धन के साथ अन्याय होता है और ऊपर से उसे विनती भी करनी पड़ती है।’'
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है। यूनानी पाठ सामाजिक शक्ति और अन्याय का समान व्यापक संदर्भ दिखाता है, किंतु उसके शब्द और वाक्यरचना इब्रानी से इतने भिन्न हैं कि उसे मुख्य पाठ में मिलाना उचित नहीं; इसलिए उसे पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘उसके काम के’ और ‘तुमसे काम लेगा’ सामान्य पाठक के लिए सहज हैं तथा मूल की प्रत्यक्ष द्वितीय-पुरुष चेतावनी और उसमें निहित शोषणात्मक तनाव को बनाए रखते हैं।
