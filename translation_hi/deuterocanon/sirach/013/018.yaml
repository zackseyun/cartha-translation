base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/018.yaml
  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
translation:
  language: hi
  text: मरुभूमि के जंगली पशु सिंह का भोजन हैं[b]; उसी प्रकार निर्धन धनी के लिए चरागाह हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “लकड़बग्घे और कुत्ते में कैसी शांति? और धनी और निर्धन में कैसी शांति?” यूनानी समानांतर में एक अलग नीतिवचन है, पर धनी और निर्धन के बीच वैमनस्य का वही सामाजिक संकेत मिलता है।'
    reason: alternative_reading
  - marker: b
    text: या संभवतः “मरुभूमि के जंगली गधे,” यदि इब्रानी शब्द को वन्य पशुओं के सामान्य अर्थ के बजाय उसके संकरे अर्थ में लिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל
  choice: भोजन
  rationale: संज्ञा का अर्थ वह वस्तु है जो खाई जाती है। ‘भोजन’ शिकारी बिंब को बनाए रखता है और ‘शिकार’ की अपेक्षा मूल के अधिक निकट है।
- source_word: אֲרִי
  choice: सिंह
  rationale: इस पशु-संज्ञा का सामान्य और स्पष्ट हिन्दी रूप।
- source_word: פִּרְאֵי מִדְבָּר
  choice: जंगल के वन्य पशु
  rationale: पदबंध खुले निर्जन प्रदेश के जंगली जीवों को सामूहिक रूप से व्यक्त कर सकता है। आधुनिक हिन्दी में ‘जंगल के वन्य पशु’ सहज है; ‘जंगली गधे’ की संकरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: כֵּן
  choice: उसी प्रकार
  rationale: नीतिवचन की उपमा को स्वाभाविक और स्पष्ट ढंग से जोड़ता है।
- source_word: מַרְעִית
  choice: चरागाह
  rationale: 'शाब्दिक चरने की जगह का बिंब सुरक्षित रखा गया है: निर्धन वे हैं जिनसे धनी अपना लाभ उठाते या जिन पर पलते हैं। इसे ‘शिकार’ कहने से मूल रूपक बदल जाता।'
- source_word: עָשִׁיר
  choice: धनी
  rationale: एकवचन रूप यहाँ किसी प्रतिनिधि धनी व्यक्ति को सूचित करता है; हिन्दी में वर्गगत तुलना के भीतर ‘धनी’ यह सामान्य अर्थ स्वाभाविक रूप से देता है।
- source_word: דַּלִּים
  choice: निर्धन
  rationale: बहुवचन संज्ञा आर्थिक और सामाजिक रूप से अभावग्रस्त लोगों को दर्शाती है; यूनानी समानांतर भी निर्धनता के अर्थ की पुष्टि करता है।
theological_decisions:
- issue: प्राप्त इब्रानी पाठ और यूनानी समानांतर के बीच भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी नीतिवचन का अनुवाद
  alternative: “लकड़बग्घे और कुत्ते में कैसी शान्ति? और धनी और निर्धन में कैसी शान्ति?”
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी में अलग पशु-बिंब और ‘शान्ति’ का प्रश्न है, पर सामाजिक वैमनस्य का मूल आशय मिलता-जुलता है; अतः उसे वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। ‘चरागाह’ का कुछ कठोर रूपक जानबूझकर सुरक्षित है, क्योंकि मूल इब्रानी धनी द्वारा निर्धनों पर पलने या उनका उपभोग करने का तनावपूर्ण चित्र प्रस्तुत करता है।
