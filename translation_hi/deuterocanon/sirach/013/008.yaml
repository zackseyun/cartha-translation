base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/008.yaml
  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: hi
  text: सावधान रहो, बहुत धृष्ट मत बनो,[a] और जो समझ नहीं रखते, उनके समान मत बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “ध्यान रखो कि कहीं तुम्हें भटका न दिया जाए, और अपने आनंद में तुम्हें अपमानित न किया जाए।” इस पद में इब्रानी और यूनानी पाठों के बीच पर्याप्त अंतर है।'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: सावधान रहो
  rationale: निफ़ाल आज्ञार्थक रूप यहाँ चेतावनी देता है। ‘सावधान रहो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इस चेतावनी का बल बनाए रखता है।
- source_word: אַל תִּרְהַב מְאֹד
  choice: बहुत ढीठ मत बनो
  rationale: רהב यहाँ हद से बढ़कर साहस दिखाने, धृष्ट होने या उद्दंड आत्मविश्वास रखने का भाव दे सकता है। ‘ढीठ’ अनुचित और अति आत्मविश्वासी व्यवहार का संकेत देता है, जबकि ‘बहुत’ מְאֹד को व्यक्त करता है; फिर भी अर्थ की व्यापकता के कारण पाठांतर की सूचना दी गई है।
- source_word: וְאַל תִּדְמֶה
  choice: जैसे मत बनो
  rationale: דמה का आशय यहाँ ‘समान होना/बनना’ है। ‘जैसे मत बनो’ चेतावनी के इच्छापरक भाव को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: नासमझ लोगों
  rationale: यह पदबंध शाब्दिक रूप से ‘ज्ञान/समझ से रहित लोगों’ को दर्शाता है। ‘नासमझ लोगों’ से ज्ञान-साहित्य के नैतिक-बौद्धिक संदर्भ में अर्थ सहज रहता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ के दोनों खंडों में पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी का अनुवाद और पादटिप्पणी में यूनानी पाठांतर
  alternative: 'यूनानी: ‘ध्यान रखो कि कहीं तुम भटका न दिए जाओ, और अपने आनंद में नीचा न किए जाओ।’'
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए मुख्य पाठ उसी पर आधारित है। यूनानी पाठ केवल शैलीगत नहीं, बल्कि अर्थ की दृष्टि से काफी भिन्न है; अतः पाठगत अनिश्चितता को छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त ज्ञानोक्तिपरक चेतावनी का लहजा। ‘ढीठ’ साधारण पाठक के लिए सहज है और अत्यधिक धृष्टता का भाव देता है। पादटिप्पणी-चिह्न [a] उसी खंड के बाद रखा गया है जहाँ से यूनानी पाठ का स्पष्ट अंतर आरम्भ होता है।
