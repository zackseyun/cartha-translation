translation:
  language: hi
  text: हर प्राणी अपने ही प्रकार के प्राणियों के साथ रहता है[a], और मनुष्य अपने ही प्रकार के लोगों से जुड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “हर जीव अपने समान से प्रेम करता है, और हर मनुष्य अपने पड़ोसी से।” इब्रानी मुख्य पाठ अपने ही प्रकार के साथ रहने और जुड़ने पर बल देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מִין
  choice: प्रकार
  rationale: यह शब्द किसी वर्ग या जाति-समान समूह को दर्शाता है। ‘प्रकार’ आधुनिक हिन्दी में स्वाभाविक है और इस नीतिवचन में बार-बार आने वाले समानता के भाव को बनाए रखता है।
- source_word: כָּל בָּשָׂר
  choice: हर प्रकार का प्राणी
  rationale: शाब्दिक अर्थ ‘सब मांस’ है, पर यहाँ सजीव प्राणियों की व्यापक श्रेणी अभिप्रेत है। यूनानी समानांतर का πᾶν ζῷον भी इसी अर्थ की पुष्टि करता है। हिन्दी में ‘प्राणी’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶצְלוֹ
  choice: अपने ही प्रकार के साथ रहता है
  rationale: इब्रानी का पहला उपवाक्य संक्षिप्त और लुप्तपदीय है। दूसरे उपवाक्य तथा यूनानी समानांतर के प्रकाश में यह अपने समान प्राणियों के साथ रहने या मेल रखने का भाव देता है; अनुवाद इस संबंध को स्पष्ट करता है, पर ‘प्रेम करता है’ नहीं जोड़ता।
- source_word: יְחֻבַּר
  choice: जुड़ता है
  rationale: חבר का निष्क्रिय रूप जोड़े जाने या संगति में आने का भाव देता है। हिन्दी में ‘जुड़ता है’ कथन को सहज रखते हुए मूल संबंध-वाचक अर्थ को सुरक्षित रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन शब्द सामान्य रूप से मानव को दर्शाता है। ‘मनुष्य’ स्रोत के प्रतिनिधिक एकवचन और नीतिवचन की गरिमा दोनों को बनाए रखता है।
theological_decisions:
- issue: संक्षिप्त इब्रानी प्रथम उपवाक्य और अधिक स्पष्ट यूनानी समानांतर के बीच पाठ-निर्णय
  choice: मुख्य अनुवाद इब्रानी के ‘प्रकार’ और अपने समान वर्ग से संबंध रखने के भाव पर आधारित है।
  alternative: हर जीव अपने समान जीव से प्रेम करता है, और हर मनुष्य अपने पड़ोसी से।
  rationale: इब्रानी पाठ उपलब्ध और उच्च विश्वसनीयता वाला है, इसलिए उसे मुख्य आधार बनाया गया है। यूनानी पाठ संक्षिप्त इब्रानी वाक्य का आशय समझने में सहायक है, लेकिन उसके ‘प्रेम’ और ‘पड़ोसी’ शब्दों को मुख्य पाठ में लाने से इब्रानी की विशिष्ट शब्दावली मिट जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और नीतिवचन के अनुरूप गरिमापूर्ण रखी गई है। ‘हर प्रकार का प्राणी’ शाब्दिक ‘हर प्रकार का मांस’ की अस्वाभाविकता से बचते हुए उसके सजीव-प्राणी संबंधी आशय को व्यक्त करता है।
