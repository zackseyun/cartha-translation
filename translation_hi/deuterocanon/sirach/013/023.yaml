  text: When a rich man speaks[a], everyone falls silent, and they lift up his sense to the clouds.
translation:
  language: hi
  text: जब कोई धनी व्यक्ति बोलता है, तो सब चुप हो जाते हैं, और उसकी समझ को बादलों तक उठा देते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “और उसके वचन को बादलों तक उठा देते हैं।” इब्रानी पाठ में “उसकी समझ” है, जिसे यहाँ प्राथमिक साक्ष्य मानकर अपनाया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר דּוֹבֵר
  choice: जब कोई धनी व्यक्ति बोलता है
  rationale: एकवचन रूप यहाँ सामान्य, नीतिवचनात्मक कथन है; ‘कोई धनी व्यक्ति’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּל נִסְכָּתוּ
  choice: तो सब चुप हो जाते हैं
  rationale: यूनानी समानांतर भी मौन हो जाने का अर्थ पुष्ट करता है; ‘सब चुप हो जाते हैं’ सहज और स्पष्ट हिन्दी है।
- source_word: שִׂכְלוֹ
  choice: उसकी समझ
  rationale: שׂכל का अर्थ समझ या सूझ-बूझ है। ‘समझ’ मूल की मूल्यांकनात्मक और संभावित व्यंग्यात्मक छाया को बनाए रखती है।
- source_word: עַד עָב יַגִּיעוּ
  choice: बादलों तक उठा देते हैं
  rationale: यह अत्यधिक प्रशंसा का सजीव रूपक है। हिन्दी में बहुवचन ‘बादलों’ स्वाभाविक है और यूनानी समानांतर से भी मेल खाता है।
