translation:
  language: hi
  text: यदि तुम्हारे पास कुछ है[a], तो वह तुमसे मीठी बातें करेगा; वह तुम्हें कंगाल कर देगा, और उसे इसका कोई दुःख नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “यदि तुम उपयोगी हो, तो वह तुमसे काम लेगा; और यदि तुम्हें कमी हो, तो वह तुम्हें छोड़ देगा।” यह उपलब्ध इब्रानी पाठ से काफी भिन्न पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: यदि तुम्हारे पास कुछ है
  rationale: प्रेषित इब्रानी पदबंध कठिन है, पर संदर्भ में इसका संकेत साधन-संपन्न होने या दूसरे के लिए उपयोगी होने की ओर है। यह अनुवाद इब्रानी के संभावित संपत्ति-संबंधी भाव को रखता है और यूनानी पाठ के ‘उपयोगी’ होने के भाव को अनावश्यक रूप से मुख्य पाठ में नहीं मिलाता।
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: वह तुमसे मीठी बातें करेगा
  rationale: शाब्दिक भाव ‘वह तुम्हारे साथ अपने शब्द अच्छे करेगा’ है। आधुनिक हिन्दी में ‘मीठी बातें करेगा’ प्रसन्न करने या स्वार्थवश लुभाने वाली वाणी का स्वाभाविक और संदर्भानुकूल रूप है।
- source_word: וִירֹשֶׁשְׁךָ
  choice: वह तुम्हें कंगाल कर देगा
  rationale: क्रिया किसी को निर्धन या साधनहीन कर देने का अर्थ देती है। ‘कंगाल कर देगा’ शोषण के परिणाम को स्पष्ट और सशक्त ढंग से व्यक्त करता है, बिना ‘लूटना’ जैसी अधिक विशिष्ट विधि जोड़ने के।
- source_word: וְלֹא יִכְאַב לוֹ
  choice: उसे इसका कोई दुःख नहीं होगा
  rationale: शाब्दिक रूप से ‘उसे पीड़ा नहीं होगी’। हिन्दी में यह रूप उस शोषक की निर्दयता और अपने किए पर दुःख न होने का भाव स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: काहिरा गनीज़ा के इब्रानी पाठ और भिन्न यूनानी समानांतर पाठ में चुनाव
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया है और यूनानी पाठ का वास्तविक अंतर पादटिप्पणी में सुरक्षित रखा गया है।
  alternative: 'मुख्य पाठ यूनानी के अनुसार हो सकता था: ‘यदि तुम उपयोगी हो, तो वह तुमसे काम लेगा; और यदि तुम्हारे पास कमी हो, तो वह तुम्हें छोड़ देगा।’'
  rationale: इस पद के लिए इब्रानी पाठ उपलब्ध है, इसलिए उसे प्राथमिकता दी गई है। चूँकि यूनानी पाठ केवल शैलीगत नहीं बल्कि वस्तुगत रूप से भिन्न पाठ प्रस्तुत करता है, उसे दबाने या इब्रानी में मिलाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मीठी बातें’ स्वार्थपूर्ण चापलूसी का स्वाभाविक हिन्दी संकेत है, जबकि ‘कंगाल कर देगा’ मूल की आर्थिक तबाही को साधारण पाठक के लिए स्पष्ट करता है।
