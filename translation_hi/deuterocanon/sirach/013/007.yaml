base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: hi
  text: जब तक तुम उसके काम के हो, वह तुमसे खिलवाड़ करेगा[a]; दो-तीन बार वह तुम्हारी बढ़-चढ़कर प्रशंसा करेगा। फिर वह तुम्हें देखकर आगे निकल जाएगा[b], और तुम्हारी ओर सिर हिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ किसी का उपहास करना, उससे खिलवाड़ करना, या उसे खेल की वस्तु समझना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस खंड का हिब्रू कठिन है। ‘आगे निकल जाएगा’ हिब्रू में पार/आगे बढ़ने की छवि को रखता है। यूनानी पाठ विचार को विस्तार से इस प्रकार व्यक्त करता है: वह तुम्हें देखेगा और तुम्हें छोड़ देगा।'
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: जब तक तुम उसके काम आओगे
  rationale: यह अवधि और उपयोगिता दोनों व्यक्त करता है। यूनानी समानांतर में उसके द्वारा तुम्हारी आवश्यकता होने का भाव है; संदर्भ में धनी व्यक्ति अपने लाभ तक संबंध रखता है।
- source_word: יְהָתֵל בָּךְ
  choice: वह तुम्हें खिलौना बनाए रखेगा
  rationale: התל का रूप उपहास करने, किसी से खेल करने या उसे खिलौना समझने की अर्थ-सीमा रखता है। यह चयन शोषण और तिरस्कार दोनों को समेटता है, पर सीधे छल का अर्थ अनिवार्य नहीं बनाता।
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: दो-तीन बार
  rationale: हिब्रू की संख्यात्मक अभिव्यक्ति का सहज आधुनिक हिन्दी रूप, जिसमें सीमित किंतु बार-बार होने का भाव सुरक्षित है।
- source_word: יַעֲרִיצֶךָ
  choice: तुम्हारी बढ़-चढ़कर प्रशंसा करेगा
  rationale: शब्द सम्मान या प्रशंसा का बोध दे सकता है, पर प्रसंग स्वार्थपूर्ण और अस्थायी आदर का है। यह वाक्यांश कपटपूर्ण चापलूसी का संकेत देता है, बिना मूल की सम्मान-संबंधी छाया खोए।
- source_word: וּבְכֵן
  choice: फिर
  rationale: यह अस्थायी कृपा से बाद की उपेक्षा की ओर स्पष्ट और स्वाभाविक संक्रमण करता है।
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: वह तुम्हें देखकर ऐसे निकल जाएगा मानो तुम्हें जानता ही न हो
  rationale: हिब्रू कठिन है; עבר से गुजर जाने या आगे निकलने का भाव संभव है। यूनानी समानांतर ‘तुम्हें देखेगा और छोड़ देगा’ कहता है। अनुवाद उपेक्षापूर्वक पास से निकल जाने की छवि देता है; ‘मानो तुम्हें जानता ही न हो’ उसका प्रसंगगत आशय स्पष्ट करता है और पादटिप्पणी अनिश्चितता बताती है।
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: तुम्हारी ओर सिर हिलाएगा
  rationale: मूल में सिर हिलाने की क्रिया है और यूनानी समानांतर भी इसी संकेत की पुष्टि करता है। संदर्भ इसे तिरस्कार या उपेक्षा का संकेत बनाता है, किंतु मुख्य पाठ संकेत को स्वयं बोलने देता है।
