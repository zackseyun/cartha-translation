base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/012.yaml
  text: A cruel man will give a stumbling block and will not spare[b][a]; against the life of many he plots a plot.
translation:
  language: hi
  text: निर्दयी मनुष्य ठोकर का कारण बनेगा और दया नहीं करेगा।[a] वह बहुतों के जीवन के विरुद्ध षड्यंत्र रचता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में इस अंश का रूप बहुत भिन्न है: “जो बातों को नहीं मानता, वह निर्दयी है; और वह पीड़ा पहुँचाने और बन्धनों में डालने से निश्चय ही नहीं हिचकेगा।” यूनानी समानांतर पाठ निर्दयतापूर्ण हानि के सामान्य भाव का समर्थन करता है, पर मुख्य अनुवाद उपलब्ध इब्रानी पाठ पर आधारित है।'
    reason: textual_variant
  - marker: b
    text: इसे अधिक भावानुसार “वह बहुतों के जीवन के विरुद्ध चाल चलता है” भी कहा जा सकता है। इब्रानी में बल देने के लिए एक ही मूल से बने शब्द दोहराए गए हैं; शाब्दिक रूप से, “वह षड्यंत्र का षड्यंत्र रचता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: निर्दयी मनुष्य
  rationale: यह शब्द क्रूर अथवा निर्मम व्यक्ति को सूचित करता है। ‘निर्दयी मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के एकवचन प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: יִתֵּן כֹּשֶׂל
  choice: ठोकर का कारण बनेगा
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ कठिन है; उसका शाब्दिक भाव ‘ठोकर देना’ है। चुना हुआ अनुवाद हानि पहुँचाकर गिराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יַחְמוֹל
  choice: और दया नहीं करेगा
  rationale: חמל का अर्थ किसी पर तरस खाना अथवा उसे छोड़ देना है। ‘दया नहीं करेगा’ दोनों के सामान्य भाव को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: बहुतों के प्राण के विरुद्ध
  rationale: נפש यहाँ अमूर्त ‘आत्मा’ के बजाय जीवन या प्राण का बोध कराता है। इब्रानी में ‘प्राण’ एकवचन है और ‘बहुतों’ से संबंधित है; अनुवाद ने इस सामूहिक एकवचन को बनाए रखा है। על को शत्रुतापूर्ण आशय के कारण ‘के विरुद्ध’ कहा गया है।
- source_word: קוֹשֵׂר קָשֶר
  choice: वह षड्यंत्र रचता है
  rationale: इब्रानी में एक ही धातु से बने शब्दों की पुनरुक्ति है, जिसका भाव दृढ़तापूर्वक षड्यंत्र रचना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और पुनरुक्ति को पादटिप्पणी में बताया गया है।
