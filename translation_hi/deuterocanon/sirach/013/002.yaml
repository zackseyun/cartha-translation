translation:
  language: hi
  text: जो तुमसे भारी है, उसे मत उठाओ; और जो तुमसे अधिक धनी है, उससे मेल-जोल मत रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: जो तुमसे भारी है
  rationale: इब्रानी तुलना को स्वाभाविक हिन्दी में रखते हुए शारीरिक बोझ और रूपकात्मक भार—दोनों की सम्भावना सुरक्षित रहती है।
- source_word: מַה תִּשָּׂא
  choice: उसे मत उठाओ
  rationale: प्रश्नवाचक इब्रानी रूप यहाँ निषेधात्मक अलंकार है; यूनानी समानांतर भी स्पष्ट निषेध देता है।
- source_word: תִּתְחַבָּר
  choice: मेल-जोल मत रखो
  rationale: क्रिया का अर्थ किसी के साथ जुड़ना या संगति करना है; सामान्य आधुनिक हिन्दी में सामाजिक सम्बन्ध का आशय स्पष्ट किया गया है।
- source_word: עָשִׁיר מִמְּךָ
  choice: जो तुमसे अधिक धनी है
  rationale: तुलनात्मक अर्थ और आर्थिक-सामाजिक असमानता दोनों सीधे सुरक्षित हैं।
theological_decisions:
- issue: पद की सीमा
  choice: केवल आरम्भिक दो उपवाक्य लिए गए
  alternative: इब्रानी संकलित पाठ में इसके बाद आए मिट्टी के पात्र और धनी-निर्धन सम्बन्ध वाले वाक्य भी जोड़ना
  rationale: दिए गए यूनानी Sirach 13:2 और अंग्रेज़ी परामर्श-पाठ इसी संक्षिप्त पद-सीमा की पुष्टि करते हैं; इब्रानी प्रस्तुति में आगे का पाठ सम्भवतः अगले पद या पाठ-संयोजन से सम्बद्ध है।
- issue: धनी व्यक्ति से सम्बन्ध का कथन
  choice: सावधानीसूचक निषेध को बिना धार्मिक या नैतिक अपवाद जोड़े रखा
  alternative: इसे सभी धनी लोगों की सार्वभौमिक निन्दा या केवल दुष्ट धनियों के निषेध के रूप में स्पष्ट करना
  rationale: मूल पाठ ऐसी अतिरिक्त योग्यता नहीं देता; उसकी तीखी सामाजिक चेतावनी और तनाव को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली। ‘मेल-जोल’ सामान्य पाठक के लिए सहज है और ‘संगति’ की अपेक्षा कम धार्मिक-पारिभाषिक है।
