translation:
  language: hi
  text: मनुष्य का हृदय उसके चेहरे को बदल देता है—चाहे चेहरा अच्छा हो या बुरा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ यहाँ उल्लेखनीय रूप से भिन्न है। उसका आशय लगभग यह है कि जिस हृदय में भलाई है, उसका चिह्न प्रसन्न चेहरा है; इसके बाद परिश्रम से दृष्टांत खोजने के विषय में एक कठिन वाक्यांश आता है। चूँकि इस पद का इब्रानी पाठ उपलब्ध और प्राथमिक है, मुख्य पाठ उसी का अनुसरण करता है। यूनानी पाठ भीतरी दशा और बाहरी मुखभाव के सामान्य संबंध की पुष्टि तो करता है, पर ठीक यही शब्दावली नहीं देता।
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी ज्ञान-साहित्य में यह मनुष्य के भीतरी व्यक्तित्व, विचार और मनोभाव का केंद्र है। ‘हृदय’ मूल बिंब और भीतर-बाहर के विरोध को बनाए रखता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यहाँ एकवचन मानव-संज्ञा प्रतिनिधिक अर्थ में है। ‘मनुष्य’ आधुनिक मानक हिन्दी में स्वाभाविक है और अनावश्यक रूप से केवल पुरुष तक अर्थ को सीमित नहीं करता।
- source_word: יְשַׁנֵּא
  choice: बदल देता है
  rationale: क्रिया का सीधा अर्थ ‘बदलना’ या ‘परिवर्तित करना’ है; यहाँ भीतरी दशा के चेहरे पर पड़ने वाले प्रभाव को व्यक्त करती है।
- source_word: פָנָיו
  choice: उसके चेहरे को
  rationale: मूल का शाब्दिक और ठोस अर्थ ‘उसका चेहरा’ है। इसे ‘रूप’ या ‘भाव-भंगिमा’ कहकर व्यापक करना आवश्यक नहीं है।
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: चाहे अच्छे के लिए, चाहे बुरे के लिए
  rationale: दोहराई गई इब्रानी संरचना दो विपरीत परिणामों पर बल देती है। ‘अच्छे…बुरे’ संदर्भ में स्वाभाविक है और רָע को अनिवार्यतः नैतिक ‘बुराई’ मानकर तनाव को समाप्त नहीं करता।
