base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/024.yaml
  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
translation:
  language: hi
  text: जब कोई निर्धन बोलता है, तो लोग कहते हैं, “यह कौन है?” और यदि वह ठोकर खाता है, तो वे भी[a] उसे धक्का देकर गिरा देते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “वे भी उसे धक्का देते हैं” है; आशय यह हो सकता है कि उसके ठोकर खाने पर सहायता करने के बजाय दूसरे लोग भी उसके पतन में हाथ बँटाते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ यहाँ बहुत भिन्न है: “वह धन अच्छा है जिसमें पाप नहीं, और भक्त के मुँह में गरीबी बुरी है।” मुख्य अनुवाद उपलब्ध हिब्रू पाठ का अनुसरण करता है; यूनानी पाठ एक समानांतर पाठ-परंपरा को दर्शाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: कोई निर्धन
  rationale: यह शब्द गरीब, निर्बल या सामाजिक रूप से निम्न व्यक्ति को दर्शाता है। “कोई निर्धन” एकवचन और कहावत के सामान्य भाव—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דּוֹבֵר
  choice: बोलता है
  rationale: कृदन्त यहाँ सामान्य और बार-बार देखी जाने वाली स्थिति व्यक्त करता है; “बोलता है” आधुनिक हिन्दी में सहज है।
- source_word: מִי זֶה
  choice: यह कौन है?
  rationale: यह प्रश्न जानकारी माँगने के बजाय तिरस्कार प्रकट करता है। सीधा प्रश्न उस अपमानजनक लहजे को सुरक्षित रखता है।
- source_word: נִתְקַל
  choice: ठोकर खाता है
  rationale: क्रिया शाब्दिक ठोकर खाने के साथ विफल होने या संकट में पड़ने का रूपक भी व्यक्त कर सकती है; यह हिन्दी दोनों अर्थों की गुंजाइश रखती है।
- source_word: גַּם הֵם
  choice: वे भी
  rationale: हिब्रू का सीधा अर्थ “वे भी” है। इसे “और अधिक” जैसे तीव्रतावाचक अर्थ में बदलने के बजाय मूल की वास्तविक अस्पष्टता और सामाजिक सहभागिता का भाव रखा गया है।
- source_word: יֶהְדֳּפוּהוּ
  choice: उसे धक्का देकर गिरा देते हैं
  rationale: הדף का अर्थ धक्का देना, परे हटाना या खदेड़ना हो सकता है। ठोकर खाने के संदर्भ में यह चुनाव उस व्यक्ति के पतन को और बढ़ाने की ठोस छवि को स्वाभाविक हिन्दी में प्रकट करता है।
