  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
translation:
  language: hi
  text: धनी आदमी बोलता है[a], और उसके समर्थक बहुत हैं; उसके भद्दे शब्द भी सुंदर बना दिए जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ बहुत भिन्न है: “धनी आदमी डगमगाता है, तो मित्र उसे सँभालते हैं; पर विनम्र व्यक्ति गिरता है, तो मित्र भी उसे दूर धकेल देते हैं।” यहाँ इब्रानी पाठ इसके बजाय इस बात पर बल देता है कि धनी आदमी की बात को अनुकूल दृष्टि से देखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी आदमी
  rationale: एकवचन यहाँ नीतिवचन की शैली में एक प्रतिनिधि व्यक्ति को दर्शाता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: מְדַבֵּר
  choice: बोलता है
  rationale: सामान्य वर्तमान काल नीतिवचन के सार्वकालिक सामाजिक अवलोकन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעוֹזְרָיו רַבִּים
  choice: तो उसके समर्थक बहुत होते हैं
  rationale: शाब्दिक अर्थ ‘उसके सहायक बहुत हैं’ है; प्रसंग में ‘समर्थक’ धन के कारण उसके पक्ष में खड़े होने वालों का सामाजिक भाव स्पष्ट करता है।
- source_word: דְבָרָיו
  choice: उसके ... शब्दों को
  rationale: बहुवचन संज्ञा का ठोस रूप बनाए रखता है और कथन के विषय को स्पष्ट करता है।
- source_word: מְכוֹעֲרִין
  choice: भद्दे
  rationale: यह शब्द कुरूप या आपत्तिजनक होने का भाव रखता है; ‘भद्दे’ हिन्दी में शब्दों के लिए स्वाभाविक है और आगे के ‘सुन्दर’ के साथ विरोध बनाए रखता है।
- source_word: מְיוּפִּין
  choice: सुन्दर बना दिया जाता है
  rationale: 'निष्क्रिय/कारक भाव बनाए रखता है: दूसरे लोग धनी व्यक्ति के बुरे कथनों को आकर्षक या प्रशंसनीय रूप देते हैं।'
