  text: All flesh loves its own kind[a], and every person the one like himself.
translation:
  language: hi
  text: हर प्राणी अपने ही प्रकार के प्राणियों से प्रेम करता है, और हर मनुष्य अपने जैसे व्यक्ति से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “और हर मनुष्य अपने पड़ोसी से।” इब्रानी का अधिक शाब्दिक अर्थ है: “उसके समान व्यक्ति से।”'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: हर प्राणी
  rationale: शाब्दिक अर्थ ‘समस्त देह’ है, पर इस नीतिवचन में यह जीवधारियों के लिए व्यापक सामूहिक अभिव्यक्ति है। आधुनिक हिन्दी में ‘हर प्राणी’ स्वाभाविक है और यूनानी समानांतर πᾶν ζῷον से भी संगत है।
- source_word: יֶאֱהַב
  choice: प्रेम करता है
  rationale: अपूर्ण क्रिया यहाँ सार्वकालिक नीतिवचनात्मक कथन व्यक्त करती है, इसलिए हिन्दी का सामान्य वर्तमान काल उपयुक्त है।
- source_word: מִינוֹ
  choice: अपनी जाति
  rationale: מִין का अर्थ प्रकार, जाति या प्रजाति हो सकता है। ‘अपनी जाति’ यहाँ समान प्रकार के प्राणियों का स्वाभाविक और संक्षिप्त बोध कराता है।
- source_word: וְכָל אָדָם
  choice: और हर मनुष्य
  rationale: אָדָם यहाँ सामान्य रूप से किसी भी मानव के लिए है; ‘हर मनुष्य’ आधुनिक, गरिमापूर्ण और लिंग-समावेशी सामान्य अभिव्यक्ति है।
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: अपने जैसे व्यक्ति से
  rationale: इब्रानी का अर्थ ‘उससे मिलता-जुलता/उसके जैसा जन’ है। हिन्दी में क्रिया ‘प्रेम करता है’ के साथ ‘से’ जोड़कर अर्थ स्वाभाविक रूप से व्यक्त होता है और समानता का बल सुरक्षित रहता है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी ‘अपने जैसे व्यक्ति’ का अनुसरण
  alternative: ‘अपने पड़ोसी से’
  rationale: उपलब्ध इब्रानी पाठ स्पष्ट रूप से समानता पर बल देता है और यहाँ प्राथमिक स्रोत है। यूनानी प्राचीन साक्षी ‘उसके पड़ोसी’ पढ़ता है, जिससे सामाजिक निकटता का अलग अर्थ उभरता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण नीतिवचनात्मक हिन्दी। ‘हर प्राणी’ शाब्दिक ‘समस्त देह’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है; दोनों खंडों की समानांतर रचना बनाए रखी गई है।
