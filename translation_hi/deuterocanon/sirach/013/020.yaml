base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/020.yaml
  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: hi
  text: धनी लड़खड़ाए, तो मित्र उसे सहारा देता है; पर निर्धन लड़खड़ाए, तो उसे एक मित्र से दूसरे मित्र के पास खदेड़ दिया जाता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे मित्र से मित्र के पास धकेल दिया जाता है।” इब्रानी से संकेत मिलता है कि निर्धन को सच्चा सहारा देने के बजाय बार-बार दूसरे के पास भेज दिया जाता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ यहाँ काफी भिन्न है: “दीनता घमंडी के लिए घृणित है, और निर्धन धनी के लिए घृणित है।” जहाँ इस पद का इब्रानी पाठ उपलब्ध है, यहाँ उसी को मुख्य आधार बनाया गया है।'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी
  rationale: एकवचन संज्ञा यहाँ नीतिवचन की शैली में सामान्य प्रकार के व्यक्ति को दर्शाती है; ‘धनी’ सहज और संक्षिप्त है।
- source_word: מוּט / נָמוֹט
  choice: लड़खड़ाए
  rationale: दोनों रूप अस्थिर होने या डगमगाने का भाव देते हैं, न कि अनिवार्य रूप से पूरी तरह गिर जाने का। एक ही अनुवाद से इब्रानी समानांतरता बनी रहती है।
- source_word: נִסְמָךְ
  choice: उसे सहारा देता है
  rationale: सמך का यह रूप सहारा पाए जाने का भाव रखता है। हिन्दी में कर्तृवाच्य वाक्य-विन्यास अधिक स्वाभाविक है और अगले מֵרֵעַ को सहारा देने वाले मित्र के रूप में स्पष्ट करता है।
- source_word: מֵרֵעַ
  choice: मित्र
  rationale: רֵעַ के लिए ‘मित्र’ सामान्य और प्रसंगानुकूल है; यहाँ מן सहारे के स्रोत अथवा माध्यम को सूचित करता है।
- source_word: דַל
  choice: निर्धन
  rationale: דַל आर्थिक रूप से गरीब या सामाजिक रूप से कमजोर व्यक्ति को दर्शा सकता है। धनी के प्रत्यक्ष सामाजिक-आर्थिक विरोध में ‘निर्धन’ उपयुक्त है।
- source_word: נִדְחָה
  choice: धकेल दिया जाता है
  rationale: शब्द में परे हटाए या खदेड़े जाने का निष्क्रिय भाव है। यह ‘सहारा’ के विपरीत व्यवहार को ठोस रूप में व्यक्त करता है।
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: एक मित्र से दूसरे मित्र के पास
  rationale: यह इब्रानी गति और बार-बार दूसरे के पास भेजे जाने की धारणा को बनाए रखता है, मानो कोई भी वास्तविक सहारा न देता हो।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी समानांतर: ‘दीनता घमण्डी के लिए घृणित है, और निर्धन धनी के लिए घृणित है।’'
  rationale: दिए गए उच्च-विश्वसनीयता वाले इब्रानी साक्ष्य को मूल पाठ माना गया है; वास्तविक पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है, न कि दोनों पाठों को मिलाकर।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ‘धनी/निर्धन’, ‘लड़खड़ाए’ और ‘सहारा’ सामान्य पाठक के लिए स्पष्ट हैं; निष्क्रिय ‘धकेल दिया जाता है’ मूल के सामाजिक तिरस्कार और उसके अनिर्दिष्ट कर्ता दोनों को बनाए रखता है।
