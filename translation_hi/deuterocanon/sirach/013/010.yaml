base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/010.yaml
  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
translation:
  language: hi
  text: पास मत जाओ,[a] कहीं ऐसा न हो कि तुम्हें दूर कर दिया जाए; और दूर मत रहो,[b] कहीं ऐसा न हो कि तुमसे घृणा की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहला खंड प्रेषित इब्रानी पाठ में कठिन है। यूनानी समानांतर इस अर्थ का समर्थन करता है कि पास आने पर व्यक्ति को ठुकराकर दूर कर दिया जाए।
    reason: textual_variant
  - marker: b
    text: यूनानी में दूसरे खंड का परिणाम ‘कहीं तुम्हें भुला न दिया जाए’ या ‘तुम्हारी उपेक्षा न की जाए’ है, जबकि उपलब्ध इब्रानी पाठ में ‘कहीं तुमसे घृणा न की जाए’ है। मुख्य पाठ इब्रानी का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: बहुत पास मत जाओ
  rationale: קרב निकट आने को व्यक्त करता है। प्रसंग के संतुलित सामाजिक परामर्श में ‘बहुत पास’ स्वाभाविक हिन्दी है और अगले खंड के ‘बहुत दूर’ के साथ स्पष्ट समानांतर बनाता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: दोनों खंडों में פן की चेतावनी और आशंकित परिणाम को सहज, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּתְרַחֵק
  choice: तुम्हें दूर कर दिया जाए
  rationale: प्रेषित इब्रानी पाठ का यह रूप कठिन है; मूल רחק दूरी का भाव रखता है, जबकि यूनानी समानांतर ἀπωσθῇς किसी को ठुकराकर दूर किए जाने का समर्थन करता है। कर्मवाच्य हिन्दी संभावित अभिप्राय को स्पष्ट करती है।
- source_word: וְאַל תִּתְרַחֵק
  choice: और बहुत दूर भी मत रहो
  rationale: दूसरे खंड में רחק स्पष्ट रूप से स्वयं दूरी बनाए रखने का निषेध है। ‘भी’ दोनों अतियों के बीच संतुलन को स्वाभाविक बनाता है।
- source_word: תִּשָּׂנֵא
  choice: तुमसे घृणा की जाए
  rationale: שנא का सामान्य अर्थ ‘घृणा करना’ है। कर्मवाच्य रूप इब्रानी क्रिया के भाव को सुरक्षित रखता है; यूनानी का भिन्न, नरम पाठ पाद-टिप्पणी में दिया गया है।
