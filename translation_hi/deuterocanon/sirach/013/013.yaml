translation:
  language: hi
  text: सावधान रहो और चौकस रहो; हिंसक लोगों के साथ मत चलो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “क्योंकि तुम अपने पतन के साथ चल रहे हो,” या “अपने गिरने के साथ चल रहे हो।” इसके विपरीत, इब्रानी साक्ष्य में है: “हिंसक लोगों के साथ मत चलो।”'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: सावधान रहो
  rationale: निफ़अल आज्ञार्थक रूप स्वयं की रक्षा करने और चौकन्ने रहने का भाव देता है; ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וֶהְיֵה זָהִיר
  choice: और पूरी सतर्कता बरतो
  rationale: זָהִיר सावधानी और सतर्कता व्यक्त करता है। यूनानी समानांतर का σφοδρῶς चेतावनी की तीव्रता की पुष्टि करता है; यह अनुवाद उस बल को स्वाभाविक हिन्दी में रखता है।
- source_word: וְאַל תִּתְהַלֵּךְ עִם
  choice: के साथ मत चलो
  rationale: הלך का हित्पअेल रूप साथ चलने और संगति रखने, दोनों का बिंब बनाए रखता है; इसे केवल ‘संगति मत करो’ कहकर रूपक को समाप्त नहीं किया गया।
- source_word: אַנְשֵׁי חָמָס
  choice: हिंसक लोगों
  rationale: חָמָס हिंसा, क्रूर अन्याय या उत्पीड़क दुष्टता का बोध करा सकता है। ‘हिंसक लोगों’ यहाँ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठों का अंतर
  choice: प्राप्त इब्रानी पाठ ‘हिंसक लोगों के साथ मत चलो’ को मुख्य पाठ में रखा गया।
  alternative: 'यूनानी: ‘क्योंकि तुम अपने पतन के साथ चल रहे हो’ अथवा ‘अपने गिरने की ओर चल रहे हो।’'
  rationale: इस पद का उपलब्ध इब्रानी साक्ष्य सुसंगत और प्राथमिक है। यूनानी पाठ उल्लेखनीय रूप से भिन्न है, इसलिए उसे पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है, न कि चुपचाप मुख्य पाठ में मिला दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। अर्धविराम दो संबद्ध चेतावनियों को अलग करता है, और ‘साथ चलो’ इब्रानी के चलने-संगति रखने वाले रूपक को बनाए रखता है।
