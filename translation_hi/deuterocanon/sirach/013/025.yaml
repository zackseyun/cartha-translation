base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/025.yaml
  text: Wealth is good if there is no iniquity[b][a], and poverty is bad according to the mouth of arrogance.
translation:
  language: hi
  text: यदि अधर्म न हो, तो धन अच्छा है; और गरीबी घमंड के अनुसार[a] बुरी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक वाक्यांश है, “घमंड के मुँह के अनुसार।” इसका अर्थ कठिन है; सम्भवतः आशय “घमंडियों की राय या निर्णय में” है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर में एक बहुत भिन्न पाठ है: “मनुष्य का हृदय उसका चेहरा बदल देता है, चाहे भलाई के लिए, चाहे बुराई के लिए।”'
    reason: textual_variant
lexical_decisions:
- source_word: טוֹב הָעֹשֶׂר
  choice: धन अच्छा है
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में इब्रानी कहावत की मूल्यांकनात्मक भाषा और शब्दक्रम को निकटता से व्यक्त करता है।
- source_word: אִם אֵין עָוֹן
  choice: यदि अधर्म न हो
  rationale: אִם शर्त को और אֵין के अभाव-बोध को बनाए रखा गया है। עָוֹן के नैतिक भार के लिए ‘अधर्म’ चुना गया है; यह यहाँ केवल आर्थिक कठिनाई या कानूनी दोष नहीं, बल्कि नैतिक बुराई का संकेत देता है।
- source_word: וְרַע הָעוֹנִי
  choice: पर ... गरीबी बुरी है
  rationale: טוֹב और רַע का विरोध ‘अच्छा’ और ‘बुरी’ से स्पष्ट रहता है। संयोजक וְ को प्रसंगानुसार विरोधसूचक ‘पर’ बनाया गया है, जो हिन्दी कहावत में स्वाभाविक है।
- source_word: עַל פִּי זָדוֹן
  choice: घमंडियों की दृष्टि में
  rationale: शाब्दिक अर्थ ‘घमंड के मुँह के अनुसार’ कठिन और सम्भवतः पाठगत रूप से अनिश्चित है। यह चयन उस सम्भावित अर्थ को व्यक्त करता है कि गरीबी को अहंकारी लोगों की राय या निर्णय में बुरा कहा जाता है, जबकि कठिन शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: זָדוֹן
  choice: घमंडियों
  rationale: זָדוֹן सामान्यतः घमंड, धृष्टता या उद्दंडता दर्शाता है। वाक्यांश עַל פִּי के साथ यहाँ गुण को ऐसे लोगों के रूप में व्यक्त करना सहज हिन्दी अर्थ देता है, पर इसकी अनिश्चितता पाद-टिप्पणी में बताई गई है।
theological_decisions:
- issue: भिन्न यूनानी समानांतर के बजाय उपलब्ध इब्रानी पाठ का उपयोग
  choice: धन, अधर्म और गरीबी वाली उपलब्ध इब्रानी कहावत को मुख्य पाठ बनाया गया है।
  alternative: 'यूनानी पाठ: ‘मनुष्य का हृदय उसका चेहरा बदल देता है, चाहे भलाई के लिए, चाहे बुराई के लिए।’'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। यूनानी समानांतर अर्थ और विषय दोनों में पर्याप्त रूप से भिन्न है, इसलिए उसे मुख्य पाठ में मिलाना उचित नहीं; पाठांतर को पाद-टिप्पणी में रखा गया है।
- issue: धन और गरीबी के नैतिक मूल्यांकन का स्वरूप
  choice: धन की अच्छाई को अधर्म के अभाव से सशर्त रखा गया है और गरीबी की बुराई को घमंडियों की दृष्टि से जोड़ा गया है।
  alternative: धन को अपने-आप अच्छा और गरीबी को अपने-आप बुरा बताना।
  rationale: इब्रानी के शर्तसूचक אִם और कठिन עַל פִּי זָדוֹן को अनदेखा करने से कथन निरपेक्ष बन जाता। अनुवाद मूल की नैतिक शर्त और सामाजिक दृष्टिकोण के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सदृश रखी गई है। ‘धन’, ‘अधर्म’, ‘गरीबी’ और ‘घमंडी’ सामान्य पाठकों के लिए स्पष्ट हैं, जबकि स्रोत की पाठगत और अर्थगत अनिश्चितताएँ पाद-टिप्पणियों में सुरक्षित हैं।
