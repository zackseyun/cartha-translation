base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/001.yaml
  text: Whoever touches pitch will have his hand stick to it[a], and whoever associates with a scoffer will learn his way.
translation:
  language: hi
  text: जो तारकोल छूता है, उसका हाथ उससे चिपक जाएगा; और जो उपहास करनेवाले की संगति करता है, वह उसका तौर-तरीका सीख लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ: “जो तारकोल छूता है, वह दूषित हो जाएगा; और जो घमण्डी व्यक्ति के साथ मेल-जोल रखता है, वह उसके समान हो जाएगा।” इसके विपरीत, इब्रानी साक्ष्य में “उपहास करनेवाला” और “उसका तौर-तरीका सीख लेगा” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  choice: जो तारकोल छूता है
  rationale: इब्रानी कृदंत सामान्य नीतिवचनात्मक कर्ता को व्यक्त करता है। ‘तारकोल’ उस काले, चिपचिपे पदार्थ के ठोस बिंब को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: תִּדְבַּק יָדוֹ
  choice: उसका हाथ उससे चिपक जाएगा
  rationale: यह इब्रानी के शाब्दिक अर्थ—हाथ का उस पदार्थ से चिपकना—को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है; यूनानी के अधिक व्याख्यात्मक ‘अशुद्ध हो जाएगा’ को मुख्य पाठ में नहीं अपनाता।
- source_word: וְחוֹבֵר אֶל
  choice: और जो ... की संगति करता है
  rationale: क्रिया किसी से जुड़ने अथवा मेल-जोल रखने का भाव देती है। ‘संगति करता है’ सम्बन्ध और निरन्तर प्रभाव, दोनों को सहजता से व्यक्त करता है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: इब्रानी ज्ञान-साहित्य में यह शब्द उपहास करनेवाले अथवा निन्दक व्यक्ति का संकेत देता है। यह उपलब्ध इब्रानी पाठ पर आधारित है, जबकि यूनानी समानान्तर पाठ में ‘घमण्डी’ है।
- source_word: יִלְמַד דַּרְכּוֹ
  choice: वह उसकी चाल सीख लेगा
  rationale: ‘चाल’ यहाँ जीवन-व्यवहार या आचरण का स्वाभाविक हिन्दी रूप है। यह इब्रानी के ‘उसका मार्ग सीखेगा’ को बनाए रखता है और यूनानी के ‘उसके समान हो जाएगा’ में विलीन नहीं करता।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानान्तर पाठ के बीच भिन्नता
  choice: मुख्य पाठ में उपलब्ध इब्रानी के ‘ठट्ठा करनेवाला’ और ‘उसकी चाल सीख लेगा’ को अपनाया गया।
  alternative: 'यूनानी समानान्तर: ‘जो तारकोल छूता है, वह अशुद्ध हो जाएगा; और जो घमण्डी के साथ मेल-जोल रखता है, वह उसके समान हो जाएगा।’'
  rationale: जहाँ बेन सीरा का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। यूनानी पाठ उसी नैतिक चेतावनी को दूसरी सूक्ष्मताओं—अशुद्धता, घमण्ड और समान हो जाने—के साथ प्रस्तुत करता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ठोस बिंब को स्पष्ट रखने के लिए ‘तारकोल’ और नैतिक आचरण के अर्थ में ‘चाल’ चुना गया है।
