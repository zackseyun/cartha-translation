base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/003.yaml
  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: hi
  text: यदि कोई धनी गलत काम करता है[a], तो वह अकड़ दिखाता है; पर यदि कोई निर्धन गलत काम करता है, तो वह दया की विनती करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ बहुत भिन्न है: “मिट्टी के बर्तन का देग से क्या मेल? यह टकराएगा और यह चकनाचूर हो जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी
  rationale: इब्रानी शब्द का सीधा और स्वाभाविक हिन्दी अर्थ; यह דַּל के साथ सामाजिक-विरोध प्रस्तुत करता है।
- source_word: יְעַוֶּה
  choice: गलत काम करता है
  rationale: यह अभिव्यक्ति नैतिक रूप से गलत या टेढ़ा आचरण करने का व्यापक अर्थ बनाए रखती है और किसी अधिक विशिष्ट अपराध को पाठ में नहीं जोड़ती।
- source_word: יִתְנַוֶּה
  choice: अकड़ दिखाता है
  rationale: संदर्भ में घमंडी या उद्धत व्यवहार का भाव है। यह आधुनिक हिन्दी में स्वाभाविक है और धनी व्यक्ति की दंभपूर्ण प्रतिक्रिया को व्यक्त करता है।
- source_word: דַּל
  choice: निर्धन
  rationale: यहाँ आर्थिक और सामाजिक रूप से कमजोर व्यक्ति अभिप्रेत है; औपचारिक किंतु सामान्य आधुनिक हिन्दी में 'निर्धन' उपयुक्त है।
- source_word: יִתְחַנָּן
  choice: दया की विनती करता है
  rationale: हितपएल रूप अनुग्रह या दया के लिए गिड़गिड़ाने/विनती करने का भाव देता है; चुना हुआ वाक्यांश गरिमापूर्ण और सुबोध है।
- source_word: הוּא
  choice: वह / वही
  rationale: दोनों खंडों में आए स्पष्ट सर्वनाम के बलाघात को रखा गया है; दूसरे खंड में 'वही' विरोध को अधिक साफ करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में अत्यधिक भिन्नता
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी कथन—धनी और निर्धन के विपरीत व्यवहार—का अनुवाद किया गया है।
  alternative: 'यूनानी पाठ का पात्रों वाला दृष्टांत: “मिट्टी के बर्तन का देग से क्या मेल? एक उससे टकराएगा और दूसरा चकनाचूर हो जाएगा।”'
  rationale: प्रदत्त इब्रानी पाठ पूर्ण और अर्थपूर्ण है तथा मूल-भाषा स्रोत के रूप में उच्च विश्वसनीयता से चिह्नित है। यूनानी पाठ कोई साधारण शब्दांतर नहीं, बल्कि पूर्णतः अलग कथन है; इसलिए दोनों को मिलाकर कृत्रिम पाठ बनाने के बजाय यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कहावत-जैसी रखी गई है। 'अकड़ दिखाता है' बोलचाल में सुबोध है, पर अनौपचारिक नहीं; समानांतर वाक्य-रचना धनी और निर्धन के बीच तीखा विरोध बनाए रखती है।
