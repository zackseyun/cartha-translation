  rationale: दोनों उपवाक्यों में यह प्रहार को सूचित करता है; ‘मार’ शारीरिक और वाचिक प्रहार के समानांतर रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μάστιγος
  choice: कोड़े की
  rationale: सम्बन्धकारक प्रहार के साधन को बताता है; ‘कोड़े की मार’ ठोस बिंब को स्पष्ट और संक्षिप्त रखता है।
- source_word: ποιεῖ
  choice: पड़ते हैं
  rationale: शाब्दिक अर्थ ‘बनाता है’ है, पर निशानों के साथ ‘पड़ते हैं’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और कथन के सामान्य वर्तमान भाव को रखता है।
- source_word: μώλωπας
  choice: चोट के निशान
  rationale: यह प्रहार से पड़े सूजे हुए निशानों अथवा नील को सूचित कर सकता है; व्यापक हिन्दी अभिव्यक्ति मूल अर्थ-क्षेत्र को सुरक्षित रखती है।
- source_word: γλώσσης
  choice: जीभ की
  rationale: मूल का ठोस रूपक बनाए रखा गया है; यहाँ जीभ हानिकारक वाणी का द्योतक है।
- source_word: συγκλάσει
  choice: तोड़ देती है
  rationale: यूनानी भविष्यकाल यहाँ सूक्तिपरक परिणाम व्यक्त करता है; हिन्दी में सामान्य वर्तमान ‘तोड़ देती है’ समानांतरता और प्रहार की तीव्रता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀστᾶ
  choice: हड्डियाँ
  rationale: बहुवचन संज्ञा को सीधे रखा गया है, जिससे अतिशयोक्तिपूर्ण रूपक की शक्ति बनी रहती है।
