    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: देख
  rationale: यह ध्यान खींचने वाली संक्षिप्त आज्ञा है; ‘देख’ यूनानी की सीधी और प्रभावशाली शैली बनाए रखता है।
- source_word: περίφραξον
  choice: चारों ओर ... बाड़ लगा
  rationale: क्रिया का अर्थ किसी वस्तु को घेरना या उसके चारों ओर बाड़ लगाना है; यह चयन सुरक्षा की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ κτῆμά σου
  choice: अपनी संपत्ति
  rationale: κτῆμα किसी व्यक्ति के अधिकार में मौजूद संपत्ति या माल को सूचित करता है; ‘संपत्ति’ पर्याप्त व्यापक और आधुनिक है।
- source_word: ἀκάνθαις
  choice: काँटों की
  rationale: करण कारक का भाव बताता है कि घेरा काँटों से बनाया जाए; ‘काँटों की बाड़’ हिन्दी में ठोस और सहज चित्र प्रस्तुत करती है।
- source_word: τὸ ἀργύριόν σου
  choice: अपनी चाँदी
  rationale: यद्यपि चाँदी मुद्रा का संकेत भी दे सकती है, मूल पाठ धातु का स्पष्ट उल्लेख करता है और सोने के साथ समानांतरता बनाता है।
- source_word: καὶ τὸ χρυσίον
  choice: और अपना सोना
  rationale: मूल में सोने का स्पष्ट उल्लेख है; इसे ‘धन’ कहने से बहुमूल्य धातुओं की ठोस जोड़ी धुँधली हो जाती।
- source_word: κατάδησον
  choice: बाँधकर सुरक्षित रख
  rationale: क्रिया कसकर बाँधने का भाव रखती है। यह अनुवाद शाब्दिक चित्र और अभिप्रेत सावधानी, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
