  yaml_path: translation/deuterocanon/sirach/028/022.yaml
  text: It will never overpower the godly[a], and they will not be burned in its flame.
translation:
  language: hi
  text: वह भक्तों पर कभी प्रबल न होगी[a], और वे उसकी ज्वाला में न जलेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह भक्तों को कभी अपने वश में न करेगी।’ यूनानी क्रिया का अर्थ पकड़ लेना, वश में करना या किसी के विरुद्ध प्रबल होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: कभी ... न होगी
  rationale: οὐ μή के साथ एओरिस्ट सब्जंक्टिव का प्रबल भविष्यकालीन निषेध आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: κρατήσῃ
  choice: प्रबल ... होगी
  rationale: κρατέω यहाँ पकड़ लेने, वश में करने या किसी पर विजय पाने का अर्थ दे सकता है। विनाशकारी जिह्वा और आग के प्रसंग में ‘प्रबल होना’ विरोधी शक्ति की विजय को व्यक्त करता है और मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: εὐσεβῶν
  choice: भक्तों
  rationale: εὐσεβής उन लोगों को सूचित करता है जो परमेश्वर के प्रति श्रद्धा और भक्ति रखते हैं। ‘भक्त’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: φλογί
  choice: ज्वाला
  rationale: φλόξ सामान्य आग के बजाय विशेष रूप से लौ या ज्वाला को दर्शाता है; ‘ज्वाला’ मूल बिंब की सजीवता और विशिष्टता बनाए रखती है।
- source_word: καήσονται
  choice: जलेंगे
  rationale: भविष्यकालीन कर्मवाच्य का आशय आग से जलाए जाने या जलने का कष्ट सहने से है। हिन्दी में ‘ज्वाला में न जलेंगे’ इसे स्वाभाविक ढंग से व्यक्त करता है, बिना ‘भस्म होंगे’ जैसी अतिरिक्त पूर्ण विनाश की धारणा जोड़े।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὐτῆς का संदर्भ
  choice: ‘उसकी’ रखा गया है, जिसका संदर्भ निकटवर्ती प्रसंग में आग के रूप में चित्रित विनाशकारी जिह्वा से है।
  alternative: इसे किसी अधिक निरपेक्ष विनाशकारी शक्ति की ओर संकेत मानकर ‘उसकी’ ही समझा जा सकता है; संदर्भित संज्ञा को पद में स्पष्ट रूप से जोड़ना भी संभव है।
  rationale: मूल यूनानी स्त्रीलिंग सर्वनाम का संदर्भ प्रसंग से ग्रहण किया जाता है। ‘उसकी ज्वाला’ रूपक और हल्की व्यक्तिकरण-सम्भावना दोनों को बनाए रखता है तथा अनावश्यक व्याख्यात्मक संज्ञा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण शैली अपनाई गई है। ‘वह’ और ‘उसकी’ पिछले प्रसंग की विनाशकारी जिह्वा/आग की छवि को आगे बढ़ाते हैं; मूल की संदर्भगत अस्पष्टता को स्पष्ट संज्ञा जोड़कर समाप्त नहीं किया गया।
