base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: hi
  text: धन्य है वह, जो उससे सुरक्षित रखा गया है[a], जो उसके प्रकोप में से होकर नहीं गुज़रा, जिसने उसका जुआ नहीं खींचा, और जिसे उसकी बेड़ियों में नहीं बाँधा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इस पूरे पद के सर्वनाम स्त्रीलिंग हैं और पिछले प्रसंग में वर्णित विनाशकारी जीभ अथवा वाणी की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह ज्ञान-साहित्य की आशीर्वचनात्मक शैली को बनाए रखता है; ‘सुखी’ से अधिक व्यापक और ‘भाग्यवान’ से कम संयोगपरक है।
- source_word: σκεπασθεὶς
  choice: सुरक्षित रखा गया
  rationale: निष्क्रिय कृदंत में किसी खतरे से ढके अथवा बचाकर रखे जाने का भाव है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रूप से सुरक्षा का आशय देती है।
- source_word: ἀπʼ αὐτῆς
  choice: उससे
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ पिछले प्रसंग की विनाशकारी जीभ/वाणी से है। हिन्दी में ‘उससे’ स्वाभाविक है और संदर्भ को खुला रखते हुए संबंध बनाए रखता है।
- source_word: διῆλθεν
  choice: में से होकर नहीं गुज़रा
  rationale: यह किसी तीव्र अनुभव के बीच से होकर जाने की मूल स्थानिक छवि को सुरक्षित रखता है।
- source_word: θυμῷ
  choice: प्रकोप
  rationale: यह तीव्र और विनाशकारी क्रोध को व्यक्त करता है तथा ‘क्रोध’ की अपेक्षा प्रसंग की उग्रता को अधिक स्पष्ट रखता है।
- source_word: εἵλκυσεν
  choice: नहीं खींचा
  rationale: मूल क्रिया के खींचने के प्रत्यक्ष अर्थ को बनाए रखता है और जुए की दासता-संबंधी छवि की व्याख्या करके उसे सपाट नहीं करता।
- source_word: ζυγὸν
  choice: जुआ
  rationale: यह मूल ठोस रूपक है, जो अधीनता, बोझ और बंधन—तीनों भावों को वहन करता है।
- source_word: δεσμοῖς
  choice: बेड़ियों
  rationale: यह बंधनों की सजीव और सहज हिन्दी छवि है तथा जुए के साथ दासता का रूपक बनाए रखती है।
- source_word: ἐδέθη
  choice: नहीं बाँधा गया
  rationale: निष्क्रिय रूप और वास्तविक तथा रूपकात्मक बंधन—दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: पूरे पद में स्त्रीलिंग सर्वनामों का संदर्भ
  choice: सर्वनामों को ‘उससे/उसके/उसकी’ के रूप में रखा गया है और पादटिप्पणी में उन्हें पिछले प्रसंग की विनाशकारी जीभ अथवा वाणी से जोड़ा गया है।
  alternative: हर स्थान पर संज्ञा को दोहराकर ‘विनाशकारी जीभ से ... उस जीभ का प्रकोप ...’ कहना।
  rationale: यूनानी पाठ संदर्भ को सर्वनाम द्वारा बनाए रखता है और विनाशकारी जीभ का मानवीकरण करता है। हिन्दी सर्वनाम स्वाभाविक रूप से इसे बनाए रखते हैं; संज्ञा दोहराने से मूल की संकेतात्मकता और काव्यात्मक तनाव घट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धन्य’, ‘प्रकोप’, ‘जुआ’ और ‘बेड़ियाँ’ ज्ञान-साहित्य की गंभीरता तथा मूल बंधन-रूपक को बनाए रखते हैं।
