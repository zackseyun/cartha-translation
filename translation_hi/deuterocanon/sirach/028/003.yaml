translation:
  language: hi
  text: एक व्यक्ति दूसरे व्यक्ति के विरुद्ध क्रोध रखता है और प्रभु से चंगाई माँगता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस संदर्भ के लिए दिया गया इब्रानी साक्ष्य कहता है, “मैंने सब कुछ तराजू में तौला, और भूसी से हल्का कुछ नहीं पाया,” जो यहाँ के प्रसंग से मेल नहीं खाता। इसलिए अनुवाद सिराख 28:3 के यूनानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος ἀνθρώπῳ
  choice: एक मनुष्य दूसरे मनुष्य के प्रति
  rationale: यूनानी में दोनों पद एकवचन हैं और सामान्य मानवीय उदाहरण प्रस्तुत करते हैं। यह अनुवाद उस प्रतिनिधिक एकवचन को बनाए रखते हुए हिन्दी में संबंध को स्पष्ट करता है।
- source_word: συντηρεῖ ὀργήν
  choice: क्रोध पालता है
  rationale: συντηρεῖ में क्रोध को लगातार बनाए रखने या पकड़े रहने का भाव है। ‘क्रोध पालता है’ स्वाभाविक हिन्दी में उस टिके हुए रोष को व्यक्त करता है।
- source_word: παρὰ Κυρίου
  choice: प्रभु से
  rationale: παρά यहाँ चंगाई के स्रोत को बताता है; इसलिए ‘प्रभु से’ संक्षिप्त और स्वाभाविक है।
- source_word: ζητεῖ ἴασιν
  choice: चंगाई माँगता है
  rationale: ζητεῖ का आशय यहाँ प्रभु से पाने की याचना करना है, और ἴασις के व्यापक उपचार या पुनर्स्थापन के भाव को ‘चंगाई’ बनाए रखता है।
theological_decisions:
- issue: दिए गए इब्रानी पाठ और इस संदर्भ से मेल खाने वाले यूनानी साक्ष्य के बीच पाठगत असंगति
  choice: मुख्य पाठ का अनुवाद यूनानी समानांतर साक्ष्य से किया गया है।
  alternative: 'दिए गए इब्रानी का शाब्दिक अनुवाद: ‘मैंने सब कुछ तराजू के पलड़े में तौला, और भूसी से हल्का कुछ नहीं पाया।’'
  rationale: दिया गया इब्रानी वाक्य सिराख 28:3 के क्षमा और क्रोध-विषयक संदर्भ से मेल नहीं खाता और संभवतः किसी दूसरे कथन से संबंधित है। यूनानी पाठ इस पद और इसके प्रसंग से संगत है; अतः असंगति को पादटिप्पणी में स्पष्ट करते हुए उसी का अनुवाद किया गया है।
- issue: प्रश्न का धार्मिक और नैतिक तनाव
  choice: वाक्य को प्रश्नवाचक ही रखा गया है।
  alternative: इसे विस्मयादिबोधक या सीधे निषेधात्मक कथन के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ क्षमा न करने वाले व्यक्ति द्वारा प्रभु से चंगाई माँगने की विडंबना को अलंकारिक प्रश्न के रूप में रखता है; अनुवाद उस तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रोध पालता है’ निरंतर रोष का स्वाभाविक हिन्दी मुहावरा है, जबकि ‘चंगाई’ शारीरिक उपचार से आगे नैतिक या संबंधपरक पुनर्स्थापन की संभावित व्यापकता भी बनाए रखती है।
