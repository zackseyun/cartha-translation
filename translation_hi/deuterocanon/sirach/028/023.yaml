base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: hi
  text: जो प्रभु को त्याग देते हैं, वे उसमें जा पड़ेंगे[a]। वह उनके बीच भड़क उठेगी[b] और कदापि न बुझेगी; वह सिंह के समान उन पर भेजी जाएगी, और तेंदुए[c] के समान उन्हें विनष्ट कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसमें’ पिछले प्रसंग में वर्णित विनाशकारी जीभ और उसकी हानिकारक वाणी की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: या, ‘वह उनके भीतर भड़क उठेगी।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘पैंथर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: जो प्रभु को त्याग देते हैं
  rationale: καταλείπω यहाँ प्रभु को छोड़ने या त्यागने का भाव रखता है। ‘त्याग देते हैं’ धार्मिक निष्ठा से विमुख होने का अर्थ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: वे उसमें जा पड़ेंगे
  rationale: यह ‘उसमें पड़ने’ का सीधा अर्थ सुरक्षित रखता है। स्त्रीलिंग सर्वनाम का पूर्वपद पिछले प्रसंग में वर्णित विनाशकारी जीभ या हानिकारक वाणी है; उसे मुख्य पाठ में स्पष्ट करके जोड़ना इस पद के शब्दों से आगे जाता।
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: वह उनके बीच भड़क उठेगी
  rationale: ἐκκαίω के प्रज्वलित होने और तीव्रता से जलने के भाव को ‘भड़क उठेगी’ व्यक्त करता है। ἐν αὐτοῖς को ‘उनके बीच’ रखा गया है, जबकि ‘उनके भीतर’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: οὐ μὴ σβεσθῇ
  choice: कदापि न बुझेगी
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कदापि नहीं’ संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: उन पर भेजी जाएगी
  rationale: भविष्यत् कर्मवाच्य और विरोधी दिशा में प्रयुक्त ἐπί दोनों सुरक्षित हैं। ‘छोड़ दी जाएगी’ अधिक व्याख्यात्मक होता।
- source_word: ὡς λέων
  choice: सिंह के समान
  rationale: यह उपमा का औपचारिक, सहज और परिचित हिन्दी रूप है।
- source_word: ὡς πάρδαλις
  choice: तेंदुए के समान
  rationale: पάρδαλις के लिए आधुनिक हिन्दी में ‘तेंदुआ’ सबसे पहचाना और प्राणिवैज्ञानिक रूप से उपयुक्त सामान्य शब्द है; ‘पैंथर’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: λυμανεῖται
  choice: उन्हें विनष्ट कर देगी
  rationale: क्रिया हिंसक हानि, बरबादी या विध्वंस का बोध कराती है। ‘विनष्ट कर देगी’ पशु-उपमा की तीव्रता बनाए रखती है, पर अर्थ को केवल नोचने या काटने तक सीमित नहीं करती।
theological_decisions:
- issue: αὐτήν और आगे निहित स्त्रीलिंग कर्ता का संदर्भ
  choice: सर्वनामों को ‘उसमें/वह’ रखकर पिछले प्रसंग की विनाशकारी जीभ या हानिकारक वाणी की ओर संकेत बनाए रखा गया है।
  alternative: मुख्य पाठ में हर बार ‘जीभ’ जोड़ना, अथवा इसे केवल अमूर्त ‘विनाशकारी शक्ति’ के रूप में स्पष्ट करना।
  rationale: यूनानी पद पूर्वपद को दोहराता नहीं है। हिन्दी में स्त्रीलिंग ‘वह’ पिछले प्रसंग से संबंध बनाए रखता है, जबकि मुख्य पाठ में ‘जीभ’ जोड़ना अनावश्यक स्पष्टता और व्याख्या लाता।
- issue: ἐν αὐτοῖς का स्थानगत या आंतरिक अर्थ
  choice: ‘उनके बीच’
  alternative: ‘उनके भीतर’
  rationale: दोनों अर्थ व्याकरणतः सम्भव हैं। मुख्य पाठ में फैलती हुई विनाशकारी आग की छवि के अनुकूल ‘बीच’ रखा गया है, और अधिक आंतरिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर बाइबलीय गरिमा बनाए रखने के लिए ‘प्रभु’, ‘कदापि’ और ‘विनष्ट’ जैसे स्पष्ट औपचारिक शब्द चुने गए हैं। मूल की आग और हिंस्र पशु वाली मिली-जुली उपमाओं को समतल या पुनर्व्याख्यायित नहीं किया गया।
