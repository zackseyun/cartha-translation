  text: Take care lest you slip by it, lest you fall before one lying in wait.
translation:
  language: hi
  text: सावधान रहो कि कहीं तुम उसके कारण[a] फिसल न जाओ और घात लगाए बैठे व्यक्ति के सामने गिर न पड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसमें”; यह संभवतः पिछले प्रसंग में वर्णित जीभ की ओर संकेत करता है।
    reason: ἐν αὐτῇ के स्थानगत शाब्दिक अर्थ और कारण/साधन के रूप में मुख्य-पाठीय अनुवाद—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: πρόσεχε
  choice: सावधान रहो
  rationale: यह वर्तमान काल की आज्ञा निरंतर चौकसी का भाव देती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐν αὐτῇ
  choice: उसके कारण
  rationale: ग्रीक पदबंध का शाब्दिक अर्थ ‘उसमें’ है, पर ἐν साधन अथवा कारण भी व्यक्त कर सकता है। स्त्रीलिंग सर्वनाम निकटवर्ती प्रसंग की ‘जीभ’ की ओर संकेत करता है; हिन्दी में ‘उसके कारण’ फिसलने के आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐνεδρεύοντος
  choice: घात लगाए बैठे व्यक्ति
  rationale: कृदन्त उस व्यक्ति को दर्शाता है जो छिपकर अवसर की प्रतीक्षा कर रहा है; यह अनुवाद उस सक्रिय, शत्रुतापूर्ण भाव को बनाए रखता है।
- source_word: κατέναντι
  choice: के सामने
  rationale: स्थान अथवा उपस्थिति का सीधा अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὐτῇ का स्पष्ट संदर्भ
  choice: मुख्य पाठ में संज्ञा दोहराने के बजाय ‘उसके’ रखा गया
  alternative: ‘जीभ के कारण’
  rationale: स्रोत में सर्वनाम है और उसका संदर्भ पूर्ववर्ती प्रसंग से ग्रहण किया जाता है। ‘जीभ’ जोड़ने से अर्थ स्पष्ट होता, पर मूल की संदर्भगत सूक्ष्मता और संभावित अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर निषेध-वाक्यों ‘फिसल न जाओ’ और ‘गिर न पड़ो’ से यूनानी वाक्य की चेतावनीपूर्ण लय बनी रहती है।
