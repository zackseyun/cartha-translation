  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: hi
  text: आज्ञाओं को याद रखो, और अपने पड़ोसी पर क्रोध न करो; परमप्रधान की वाचा को याद रखो, और अज्ञान को अनदेखा कर दो।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “अज्ञान को जाने दो” या “अज्ञान को नज़रअंदाज़ करो।” संदर्भ में इसका संकेत अज्ञान से हुई भूल की ओर हो सकता है।
    reason: पάριδε ἄγνοιαν के ‘अनदेखा/जाने दो’ अर्थ को दर्शाता है और ‘अज्ञान’ को किसी विशिष्ट भूल या अपराध के रूप में सीमित किए बिना प्रसंगगत संभावना स्पष्ट करता है।
lexical_decisions:
- source_word: μνήσθητι
  choice: याद रखो
  rationale: यह सक्रिय स्मरण का आदेश है। यही क्रिया लोप के द्वारा ‘परमप्रधान की वाचा’ पर भी लागू होती है, इसलिए हिन्दी में स्पष्टता के लिए इसे दूसरी बार रखा गया है।
- source_word: ἐντολῶν
  choice: आज्ञाओं
  rationale: यह धार्मिक और नैतिक आदेशों का भाव स्वाभाविक रूप से व्यक्त करता है; यूनानी में ‘व्यवस्था की’ जैसा कोई विशेषण नहीं है।
- source_word: μὴ μηνίσῃς
  choice: क्रोध न करो
  rationale: निषेधात्मक रचना के साथ μηνίω क्रोध रखने या करने का अर्थ देता है। यह सहज आधुनिक हिन्दी है और मूल से अधिक तीव्र अर्थ नहीं जोड़ती।
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी पर
  rationale: नैतिक संदर्भ में πλησίον का अर्थ ‘पड़ोसी’ है; ‘अपने’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: διαθήκην Ὑψίστου
  choice: परमप्रधान की वाचा
  rationale: διαθήκη का बाइबलीय अर्थ ‘वाचा’ है। संबंधकारक को ‘परमप्रधान की’ रखकर ‘के साथ’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ी गई।
- source_word: πάριδε
  choice: अनदेखा कर दो
  rationale: यहाँ क्रिया का अर्थ किसी बात को जाने देना, उस पर ध्यान न देना या उसे अनदेखा करना है; यह सहनशीलता के आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄγνοιαν
  choice: अनजाने में हुई भूल
  rationale: शाब्दिक अर्थ ‘अज्ञान’ है, पर प्रसंग में इससे अज्ञानवश हुई भूल या अपराध अभिप्रेत प्रतीत होता है। यह चयन नैतिक संदर्भ को हिन्दी में स्पष्ट करता है, जबकि अंतर्निहित अनजानेपन को बनाए रखता है।
theological_decisions:
- issue: दूसरे कर्म के साथ क्रिया का लोप
  choice: ‘परमप्रधान की वाचा’ से पहले ‘याद रखो’ को दोहराया गया।
  alternative: दूसरे पदबंध को बिना व्यक्त क्रिया के छोड़ना।
  rationale: यूनानी में आरंभिक आदेश की क्रिया दूसरे कर्म के साथ निहित है। हिन्दी में उसे दोहराने से वाक्य स्पष्ट और स्वाभाविक बनता है, बिना नया अर्थ जोड़े।
- issue: ἄγνοιαν का नैतिक आशय
  choice: ‘अनजाने में हुई भूल’
  alternative: ‘अज्ञान’
  rationale: मूल संज्ञा में अज्ञान का अर्थ है, पर इस क्षमा और क्रोध-विरति के संदर्भ में अज्ञानवश हुई भूल या अपराध की संभावना प्रबल है। अनुवाद उस प्रसंगगत अर्थ को व्यक्त करता है, पर जानबूझकर किए अपराध का विचार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन अनौपचारिक-गरिमापूर्ण आज्ञार्थक में है। ‘परमप्रधान’ और ‘वाचा’ बाइबलीय धार्मिक गरिमा बनाए रखते हैं, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
