base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/002.yaml
  text: Forgive your neighbor the wrong he has done, and then, when you pray, your sins will be released[a].[b]
translation:
  language: hi
  text: अपने पड़ोसी के अपराध को क्षमा कर; तब, जब तू प्रार्थना करेगा, तेरे पापों का बंधन खोल दिया जाएगा[a]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “तेरे पाप खोले जाएँगे।” यहाँ ‘पापों का बंधन खोल दिया जाएगा’ उस रूपक को स्पष्ट करता है; “तेरे पाप क्षमा किए जाएँगे” एक संभावित व्याख्यात्मक विकल्प है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ उपलब्ध इब्रानी पाठ सिराख 28:2 के अर्थ से मेल नहीं खाता और संभवतः किसी दूसरे प्रसंग की सामग्री है। इसलिए इस पद का अनुवाद यूनानी समानांतर पाठ के आधार पर किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: क्षमा कर
  rationale: यह आज्ञार्थक क्रिया अपराध को छोड़ देने या क्षमा करने का भाव रखती है; पारस्परिक अन्याय के प्रसंग में ‘क्षमा कर’ स्वाभाविक और सटीक है।
- source_word: ἀδίκημα
  choice: किए हुए अन्याय
  rationale: यह किसी के द्वारा किए गए अन्याय, अपराध या हानि को दर्शाता है। ‘किए हुए अन्याय’ कर्ता और पीड़ित के संबंध को स्पष्ट रखता है।
- source_word: τῷ πλησίον σου
  choice: अपने पड़ोसी
  rationale: नैतिक संदर्भ में πλησίον का पारंपरिक और सहज हिन्दी समतुल्य ‘पड़ोसी’ है।
- source_word: δεηθέντος σου
  choice: तेरे प्रार्थना करने पर
  rationale: यह प्रार्थना या विनती किए जाने के समय को व्यक्त करने वाला genitive absolute है; यह रूप समय-संबंध को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: तेरे पाप खोल दिए जाएँगे
  rationale: λυθήσονται का मूल बिंब ‘खोले जाने’ या ‘बंधन से मुक्त किए जाने’ का है। ‘खोल दिए जाएँगे’ उस रूपक को सुरक्षित रखता है, यद्यपि ‘क्षमा किए जाएँगे’ अर्थगत विकल्प है।
theological_decisions:
- issue: इस पद के लिए प्राथमिक स्रोत-पाठ
  choice: सिराख 28:2 के लिए यूनानी समानांतर पाठ का अनुवाद किया गया है।
  alternative: दिए गए इब्रानी पाठ को इसी पद का पाठ मानकर अनुवाद करना।
  rationale: दिया गया इब्रानी पाठ अर्थ की दृष्टि से सिराख 28:2 से मेल नहीं खाता और किसी अन्य प्रसंग की सामग्री प्रतीत होता है। यूनानी पाठ पारंपरिक पद-संख्या और क्षमा-विषयक संदर्भ से सुसंगत है; इसलिए पाठगत समस्या को टिप्पणी में स्पष्ट करते हुए उसे आधार बनाया गया है।
- issue: पापों के संबंध में λυθήσονται का रूपक
  choice: ‘खोल दिए जाएँगे’ कहकर मूल रूपक सुरक्षित रखा गया है।
  alternative: ‘क्षमा किए जाएँगे’ कहकर निहित अर्थ स्पष्ट करना।
  rationale: यूनानी क्रिया सामान्य ‘क्षमा करना’ वाली क्रिया के बजाय खोलने या मुक्त करने का बिंब रखती है। अनुवाद इस विशिष्टता को बनाए रखता है और विकल्प को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन आज्ञा और संबोधन को ‘अपने/तेरे’ से बनाए रखा गया है। ‘खोल दिए जाएँगे’ जानबूझकर कुछ असामान्य रखा गया है ताकि यूनानी मूल का बंधन खोलने वाला रूपक न मिटे।
