translation:
  language: hi
  text: वह स्वयं तो नश्वर मनुष्य है, फिर भी क्रोध बनाए रखता है; फिर उसके पापों का प्रायश्चित कौन करेगा?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ बचा हुआ इब्रानी पाठ कठिन है और काहिरा गनीज़ा की परंपरा में संभवतः विकृत या अत्यंत संक्षिप्त है। यूनानी पाठ का अर्थ है: “वह स्वयं तो नश्वर मनुष्य है, फिर भी क्रोध बनाए रखता है; उसके पापों का प्रायश्चित कौन करेगा?” अनुवाद उसी पुनर्प्राप्त अर्थ का अनुसरण करता है।'
    reason: textual_variant
  - marker: b
    text: या, “मन में रोष बनाए रखता है।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके पाप कौन क्षमा करेगा?” यूनानी क्रिया अधिक विशेष रूप से प्रायश्चित या पाप-परिहार का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: यूनानी समानांतर से पुनर्प्राप्त अर्थ
  rationale: काहाना के मिश्रित काहिरा गनीज़ा-पाठ का यह इब्रानी वाक्य इस संदर्भ में कठिन और संभवतः भ्रष्ट अथवा अत्यधिक लुप्तार्थक है। इसलिए मुख्य अनुवाद स्पष्ट यूनानी समानांतर के पुनर्प्राप्त अर्थ का अनुसरण करता है, जबकि इब्रानी समस्या को पादटिप्पणी में बताया गया है।
- source_word: αὐτὸς σὰρξ ὢν
  choice: वह स्वयं देहधारी होकर भी
  rationale: ‘देहधारी’ मनुष्य की देहधर्मिता और नश्वर दुर्बलता को व्यक्त करता है, बिना इसे ‘पापी स्वभाव’ जैसे तकनीकी धर्मवैज्ञानिक अर्थ में बदलने के। ‘भी’ वाक्य के नैतिक विरोधाभास को स्वाभाविक हिन्दी में उभारता है।
- source_word: διατηρεῖ μῆνιν
  choice: क्रोध पालता है
  rationale: यह लगातार क्रोध या रोष बनाए रखने का भाव देता है। ‘क्रोध पालना’ आधुनिक हिन्दी में स्वाभाविक है और दीर्घकाल तक रोष पकड़े रहने का अर्थ सुरक्षित रखता है।
- source_word: τίς ἐξιλάσεται
  choice: प्रायश्चित कौन करेगा
  rationale: ἐξιλάσκομαι केवल क्षमा करने के बजाय पाप के प्रायश्चित अथवा परिहार का अधिक विशिष्ट भाव रखता है।
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: उसके पापों का
  rationale: ἁμαρτίαι का मानक और संदर्भानुकूल अनुवाद ‘पाप’ है; ‘प्रायश्चित करना’ के साथ सम्बन्धकारक प्रयोग स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में σάρξ
  choice: देहधारी
  alternative: नश्वर मनुष्य; केवल देह
  rationale: यहाँ शब्द मानवीय देहधर्मिता और दुर्बलता बताता है, किसी विकसित तकनीकी ‘पापी स्वभाव’ की धारणा को नहीं।
- issue: ἐξιλάσεται में प्रायश्चित की भाषा
  choice: प्रायश्चित करेगा
  alternative: क्षमा करेगा; पापों का परिहार करेगा
  rationale: ‘प्रायश्चित’ यूनानी क्रिया के धार्मिक आयाम को बनाए रखता है और इस तनाव को खुला छोड़ता है कि क्रोध पकड़े रहने वाले मनुष्य के पापों का प्रायश्चित कौन करेगा।
- issue: कठिन इब्रानी पाठ और स्पष्ट यूनानी समानांतर
  choice: मुख्य पाठ में यूनानी से पुनर्प्राप्त अर्थ, पादटिप्पणी में पाठगत कठिनाई
  alternative: 'अस्पष्ट इब्रानी का शाब्दिक अनुवाद: ‘और दूल्हे से हल्का/सहज, अतिथि अतिथि को भीतर लाता है’'
  rationale: उपलब्ध इब्रानी इस पद के संदर्भ में सुसंगत अर्थ नहीं देता, जबकि प्राचीन यूनानी पूर्ण और प्रसंगानुकूल वाक्य सुरक्षित रखता है। पाठगत स्थिति को छिपाए बिना पठनीय अनुवाद देना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘देहधारी’ बाइबलीय ठोसपन बनाए रखता है; ‘क्रोध पालता है’ दीर्घकालिक रोष को स्वाभाविक ढंग से व्यक्त करता है। पादटिप्पणी-चिह्न पाठ में क्रमशः [a][b][c] रखे गए हैं।
