translation:
  language: hi
  text: उसके सामने एक अंगारा था; उसने उस पर फूँक मारी[a], और वह भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ में है: “यदि तुम चिंगारी पर फूँक मारोगे, तो वह भड़क उठेगी; और यदि तुम उस पर थूकोगे, तो वह बुझ जाएगी; और दोनों ही तुम्हारे मुँह से निकलते हैं।” हिब्रू पाठ छोटा है और कहता है: “उसके सामने एक अंगारा था; उसने उस पर फूँक मारी, और वह भड़क उठा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: था
  rationale: यहाँ हिब्रू क्रिया अस्तित्व या उपस्थिति बताती है; हिन्दी में ‘एक अंगारा था’ इसका सहज और सीधा रूप है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: पुल्लिंग एकवचन प्रत्यय को बनाए रखते हुए यह वाक्यांश स्थान का स्वाभाविक हिन्दी बोध देता है।
- source_word: גַחֶלֶת
  choice: अंगारा
  rationale: גַחֶלֶת जलते या दहकते कोयले को दर्शाता है; आधुनिक हिन्दी में ‘अंगारा’ इस अग्निमय बिंब को ‘कोयला’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: נָפַח בָּה
  choice: उस पर फूँक मारी
  rationale: क्रिया का मूल अर्थ फूँकना है और आग सुलगाने के प्रसंग में ‘उस पर फूँक मारी’ स्वाभाविक हिन्दी है।
- source_word: וּבָעֲרָה
  choice: और वह भड़क उठा
  rationale: בער जलने या प्रज्वलित होने को बताता है; फूँक के परिणामस्वरूप आग तेज होने का आरंभिक भाव ‘भड़क उठा’ में सुरक्षित रहता है।
- source_word: ἐὰν φυσήσῃς σπινθῆρα ἐκκαήσεται
  choice: मुख्य पाठ में नहीं अपनाया; पादटिप्पणी में दिया
  rationale: यूनानी समानांतर पाठ द्वितीय पुरुष, ‘चिंगारी’ और एक विस्तृत विपरीत क्रिया प्रस्तुत करता है। उपलब्ध हिब्रू पाठ को मुख्य आधार रखते हुए यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
