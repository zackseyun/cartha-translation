  yaml_path: translation/deuterocanon/sirach/028/020.yaml
  text: For her yoke is an iron yoke[a], and her bonds are bronze bonds.
translation:
  language: hi
  text: क्योंकि उसका[a] जुआ लोहे का जुआ है, और उसके बन्धन काँसे के बन्धन हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ स्त्रीलिंग सर्वनाम है, जो प्रसंग में मानवीकृत हानिकारक जीभ या वाणी की ओर संकेत करता है; इसे अधिक अमूर्त अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: जुआ
  rationale: यह शब्द मूलतः पशुओं पर रखा जाने वाला जुआ दर्शाता है। यहाँ दमनकारी नियन्त्रण का ठोस रूपक महत्त्वपूर्ण है, इसलिए सामान्य शब्द ‘बोझ’ के बजाय ‘जुआ’ रखा गया है।
- source_word: σιδηροῦς
  choice: लोहे का
  rationale: विशेषण का सीधा अर्थ ‘लोहे का बना हुआ’ है; ‘लोहे का’ यूनानी कथन की संक्षिप्त और प्रभावशाली शैली बनाए रखता है।
- source_word: δεσμοί
  choice: बन्धन
  rationale: यह शब्द बाँधने वाली वस्तुओं या रोक को दर्शाता है। ‘बन्धन’ स्रोत की व्यापकता बनाए रखता है; ‘ज़ंजीरें’ या ‘बेड़ियाँ’ उससे अधिक विशिष्ट होते।
- source_word: χαλκεῖοι
  choice: काँसे के
  rationale: यह विशेषण काँसे अथवा ताँबे से बनी वस्तु को दर्शाता है। इस प्रसंग में मजबूत धातु के बन्धनों के लिए ‘काँसे के’ स्वाभाविक और बाइबिलीय छवि के अनुरूप है।
- source_word: αὐτῆς
  choice: उसका / उसके
  rationale: यूनानी में सर्वनाम स्त्रीलिंग है और प्रसंग में हानिकारक जीभ या वाणी की ओर संकेत करता है। हिन्दी में सम्बन्धसूचक रूप का लिंग सम्बन्धित वस्तु (‘जुआ’, ‘बन्धन’) के अनुसार बदलता है, इसलिए स्त्रीलिंग मानवीकरण सर्वनाम के रूप से स्पष्ट नहीं हो सकता।
theological_decisions:
- issue: स्त्रीलिंग मानवीकरण को बनाए रखना
  choice: ‘उसका/उसके’ द्वारा प्रसंग की मानवीकृत हानिकारक जीभ की ओर संकेत
  alternative: इन शब्दों को किसी अमूर्त वस्तु के लिए सामान्य सम्बन्धसूचक सर्वनाम मानना
  rationale: यूनानी αὐτῆς स्त्रीलिंग पूर्वपद को दोहराता है और विनाशकारी जीभ या वाणी को दमनकारी शक्ति के रूप में चित्रित करता है। हिन्दी में ‘उसका/उसके’ स्वाभाविक है, पर इसका व्याकरणिक रूप पूर्वपद के स्त्रीलिंग को प्रत्यक्ष नहीं दिखाता; इसलिए इस वास्तविक अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली रखी गई है। ‘जुआ’ और ‘बन्धन’ मूल की समानान्तर ठोस छवियों तथा दोहराव को सुरक्षित रखते हैं।
