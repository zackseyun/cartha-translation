translation:
  language: hi
  text: उसकी मृत्यु एक बुरी मृत्यु है, और उसका अधोलोक अधिक लाभदायक है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “उसका अधोलोक अधिक लाभदायक है।” प्रसंग के आधार पर इसका अर्थ यह भी समझा जा सकता है: “अधोलोक उससे बेहतर है।” “उसकी/उसका” पिछले प्रसंग की स्त्रीलिंग पूर्ववर्ती संज्ञा, संभवतः जीभ या निंदात्मक वाणी, की ओर संकेत करता है।'
    reason: यूनानी αὐτῆς का प्रत्यक्ष व्याकरणिक संबंध ‘उसका अधोलोक’ है; तुलना प्रसंग से निकली एक संभावित व्याख्या है।
lexical_decisions:
- source_word: θάνατος πονηρὸς ὁ θάνατος αὐτῆς
  choice: उसकी मृत्यु एक बुरी मृत्यु है
  rationale: मूल में θάνατος की पुनरावृत्ति तीखे बल और समानांतरता के लिए हुई है; हिन्दी में ‘मृत्यु’ को दोनों बार रखकर इसे सुरक्षित रखा गया है। πονηρός यहाँ विनाशकारी और भयावह गुण बताता है; ‘बुरी’ इसकी व्यापक अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता। स्त्रीलिंग αὐτῆς को ‘उसकी’ से व्यक्त किया गया है, जिसका संबंध पिछले प्रसंग की स्त्रीलिंग पूर्ववर्ती संज्ञा—संभवतः जीभ या निंदात्मक वाणी—से है।
- source_word: λυσιτελὴς μᾶλλον
  choice: उससे तो … भी बेहतर
  rationale: λυσιτελής का मूल भाव लाभदायक या श्रेयस्कर होना है और μᾶλλον तुलना को प्रबल करता है। इस कठोर तुलना को सामान्य आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘उससे तो … भी बेहतर’ चुना गया है।
- source_word: ᾅδης
  choice: अधोलोक
  rationale: यह यूनानी ᾅδης के लिए पारदर्शी हिन्दी पद है और मृतकों के लोक का संकेत देता है। यह इसे केवल भौतिक ‘कब्र’ या बाद की धर्मवैज्ञानिक धारणा वाले ‘नरक’ के समान नहीं ठहराता।
theological_decisions:
- issue: ᾅδης का अर्थ
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; हेडीस
  rationale: ‘अधोलोक’ यूनानी पद की प्राचीन मृतक-लोक संबंधी धारणा को संक्षेप में बनाए रखता है और इसे नरक-दंड की बाद की विशिष्ट धारणा में नहीं बदलता।
- issue: दूसरे αὐτῆς का वाक्यगत संबंध
  choice: तुलना के रूप में—‘उससे तो अधोलोक भी बेहतर है’
  alternative: अधिकार-संबंध के रूप में—‘उसका अधोलोक अधिक लाभदायक है’
  rationale: शब्दक्रम दोनों समझों की गुंजाइश देता है, पर λυσιτελής μᾶλλον के साथ तुलना वाला अर्थ प्रसंग और हिन्दी में अधिक स्पष्ट तथा स्वाभाविक है। वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘बुरी मृत्यु’ जानबूझकर कुछ कठोर है, क्योंकि वह मूल यूनानी की पुनरावृत्ति और तीखेपन को बनाए रखती है। ‘अधोलोक’ को धर्मवैज्ञानिक रूप से अधिक विशिष्ट ‘नरक’ पर प्राथमिकता दी गई है।
