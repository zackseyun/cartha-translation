lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: तीसरी जीभ
  rationale: यूनानी पद का शाब्दिक और चित्रात्मक रूप बनाए रखा गया है। प्रसंग में यह ऐसी निंदात्मक या फूट डालने वाली वाणी का संकेत हो सकता है जो तीसरे पक्ष के रूप में लोगों के बीच आ जाती है; इस अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: γυναῖκας ἀνδρείας
  choice: वीर स्त्रियों
  rationale: ἀνδρείας यहाँ साहस, सामर्थ्य या दृढ़ता का बोध कराता है। ‘वीर स्त्रियाँ’ स्वाभाविक, संक्षिप्त और लिंग-संदर्भ के अनुरूप है।
- source_word: ἐξέβαλεν
  choice: निकाल बाहर किया
  rationale: क्रिया का अर्थ बाहर निकालना या खदेड़ देना है। यह अनुवाद मूल की प्रबल सामाजिक क्रिया को सुरक्षित रखता है।
- source_word: ἐστέρεσεν
  choice: वंचित कर दिया
  rationale: यह क्रिया किसी वस्तु से रहित या वंचित कर देने का अर्थ देती है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: τῶν πόνων αὐτῶν
  choice: उनके परिश्रम
  rationale: मूल में πόνων का सीधा अर्थ ‘परिश्रमों/कठिन श्रम’ है। ‘उनके परिश्रम से वंचित’ मूल की अभिव्यक्ति और उसकी संभावित व्यापकता को बनाए रखता है, बिना ‘फल’ को पाठ में जोड़ने के।
