base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/004.yaml
  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: hi
  text: वह अपने ही जैसे मनुष्य पर दया नहीं करता[a], फिर भी अपने पापों के लिए विनती करता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध काहाना इब्रानी पाठ की पंक्ति इस पद से मेल नहीं खाती; इसलिए यहाँ यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: या, “और क्या वह अपने पापों के विषय में प्रार्थना करता है?” प्रसंग में आशय संभवतः अपने पापों की क्षमा माँगना है, पर यूनानी पाठ अपेक्षित परिणाम को स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: अपने ही जैसे मनुष्य पर
  rationale: उपलब्ध इब्रानी पंक्ति इस पद से मेल नहीं खाती, इसलिए यूनानी समानांतर पाठ लिया गया है। यह अभिव्यक्ति अपने समान एक अन्य मनुष्य की ओर संकेत करती है।
- source_word: οὐκ ἔχει ἔλεος
  choice: दया नहीं करता
  rationale: ἔλεος का इस नैतिक संदर्भ में स्वाभाविक अर्थ ‘दया’ है। हिन्दी में ‘दया नहीं करता’ मूल भाव को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: फिर भी अपने पापों के लिए विनती करता है?
  rationale: δεῖται का अर्थ माँगना, विनती करना या प्रार्थना करना हो सकता है। यूनानी पाठ विनती का अपेक्षित परिणाम स्पष्ट नहीं करता, इसलिए मुख्य पाठ में इस निहितार्थ को खुला रखा गया है; ‘फिर भी’ अलंकारिक विरोध को व्यक्त करता है।
theological_decisions:
- issue: इस पद के लिए प्राथमिक पाठ का चयन
  choice: इस पद का अनुवाद यूनानी साक्ष्य से करना और इब्रानी पाठ की असंगति को टिप्पणी में बताना
  alternative: दिए गए इब्रानी वाक्य का अनुवाद करना, यद्यपि वह इस पद और प्रसंग से मेल नहीं खाता
  rationale: दिया गया इब्रानी वाक्य सिराख 28:4 के विषय और ज्ञात प्रसंग से असंबद्ध है, जबकि यूनानी पाठ प्रतिशोध, दया और पापों की क्षमा के प्रसंग से मेल खाता है। इसलिए पाठगत अनिश्चितता को छिपाए बिना यूनानी साक्ष्य का अनुसरण किया गया है।
- issue: विनती के आशय को स्पष्ट करना
  choice: मुख्य पाठ में ‘अपने पापों के लिए विनती करता है’ रखकर परिणाम को अनिर्धारित रहने देना
  alternative: ‘अपने पापों की क्षमा माँगता है’ कहकर निहित आशय को स्पष्ट करना
  rationale: प्रसंग में क्षमा माँगना संभावित आशय है, पर यूनानी वाक्य केवल पापों के विषय में विनती करने की बात कहता है। मूल की वास्तविक अस्पष्टता बचाने के लिए अधिक शाब्दिक अभिव्यक्ति चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और अलंकारिक प्रश्न की धार बनाए रखने वाला अनुवाद। ‘मनुष्य’ प्रतिनिधिक एकवचन को सुरक्षित रखता है; ‘अपने ही जैसे’ नैतिक समानता पर बल देता है।
