  language: en
  yaml_path: translation/deuterocanon/sirach/028/001.yaml
  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
translation:
  language: hi
  text: जो बदला लेता है, वह प्रभु से बदला पाएगा, और अपने पापों को निश्चय ही सँभालकर रखेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध कराई गई इब्रानी पंक्ति का अर्थ है, ‘कल की विपत्ति से मत घबरा, क्योंकि तू नहीं जानता कि एक दिन क्या उत्पन्न करेगा।’ यह यहाँ के यूनानी सिराख-पाठ से मेल नहीं खाती और सम्भवतः किसी दूसरे पद या पाठ-संचरण की असंगति को दर्शाती है। इसलिए अनुवाद में सिराख 28:1 के यूनानी साक्ष्य का अनुसरण किया गया है।
    reason: textual_variant
  - marker: b
    text: या, ‘और वह अपने पापों को जमा करके रखेगा।’ यूनानी में बल देने के लिए एक ही क्रिया दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: जो बदला लेता है
  rationale: यूनानी कृदन्त को सामान्य और आदतन अर्थ वाले स्वाभाविक हिन्दी वाक्यांश में व्यक्त किया गया है।
- source_word: παρὰ Κυρίου
  choice: प्रभु से
  rationale: सम्बन्धबोधक παρά के सम्बन्धकारक रूप से यहाँ स्रोत का भाव निकलता है; κύριος के लिए मानक और गरिमापूर्ण ‘प्रभु’ रखा गया है।
- source_word: εὑρήσει ἐκδίκησιν
  choice: बदला पाएगा
  rationale: ἐκδικῶν और ἐκδίκησιν का शब्दगत सम्बन्ध हिन्दी में ‘बदला’ दोहराकर बनाए रखा गया है; ‘पाएगा’ εὑρήσει के अर्थ को सहज ढंग से व्यक्त करता है।
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: उसके पापों को
  rationale: ἁμαρτίαι के नैतिक और धार्मिक बल को सामान्य हिन्दी शब्द ‘पाप’ से सुरक्षित रखा गया है।
- source_word: διατηρῶν διατηρήσει
  choice: निश्चय ही सँभालकर रखेगा
  rationale: यूनानी में एक ही क्रिया की पुनरावृत्ति से आया बल ‘निश्चय ही’ द्वारा व्यक्त किया गया है। ‘सँभालकर रखना’ पापों को उसके विरुद्ध सुरक्षित रखे जाने का भाव देता है, केवल मन में याद करने का नहीं।
theological_decisions:
- issue: उपलब्ध इब्रानी पंक्ति और यूनानी साक्ष्य में पाठगत असंगति
  choice: इस पद के लिए यूनानी सिराख-पाठ का अनुवाद
  alternative: ‘कल की विपत्ति से मत घबरा, क्योंकि तू नहीं जानता कि एक दिन क्या उत्पन्न करेगा।’
  rationale: दी गई इब्रानी पंक्ति सिराख 28:1 की विषयवस्तु से मेल नहीं खाती और नीतिवचन 27:1 के समान प्रतीत होती है। इसलिए इस स्थान पर वास्तविक सिराख 28:1 को सुरक्षित रखने वाले यूनानी साक्ष्य का अनुसरण किया गया है और असंगति को पादटिप्पणी में स्पष्ट किया गया है।
- issue: διατηρῶν διατηρήσει में निहित कर्ता
  choice: दूसरे उपवाक्य में ‘प्रभु’ को कर्ता के रूप में स्पष्ट करना
  alternative: ‘और वह उसके पापों को निश्चय ही सँभालकर रखेगा,’ जिसमें ‘वह’ का पूर्वपद कुछ अस्पष्ट रह सकता है
  rationale: यूनानी में निहित कर्ता निकटतम स्पष्ट कर्ता ‘प्रभु’ की ओर संकेत करता है और प्रसंग यह बताता है कि प्रतिशोध लेने वाले के पाप उसके विरुद्ध रखे जाते हैं। हिन्दी में दो अलग व्यक्तियों के लिए ‘वह/उसके’ रखने से अनावश्यक भ्रम होता, इसलिए कर्ता स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है—सरल, गरिमापूर्ण और मौखिक पठन के योग्य। ‘बदला’ की पुनरावृत्ति मूल यूनानी के शब्द-साम्य को सुनाई देती है, जबकि ‘निश्चय ही’ मूल की क्रियात्मक पुनरावृत्ति का बल व्यक्त करता है।
