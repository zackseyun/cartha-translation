  language: hi
  text: झगड़े से दूर रहो, और तुम पाप कम करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόσχου
  choice: दूर रहो
  rationale: यह आदेश जान-बूझकर किसी बात से अलग रहने या उसमें न पड़ने को कहता है। ‘दूर रहो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: μάχης
  choice: झगड़े
  rationale: μάχη लड़ाई, विवाद या कलह का अर्थ दे सकता है। इस ज्ञान-साहित्यिक संदर्भ में ‘झगड़ा’ पारस्परिक विवाद को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है और इसे केवल शारीरिक युद्ध तक सीमित नहीं करता।
- source_word: ἐλαττώσεις
  choice: घटाओगे
  rationale: भविष्यकालीन क्रिया झगड़े से दूर रहने के परिणाम को व्यक्त करती है। ‘घटाओगे’ मूल के सक्रिय और संक्षिप्त कथन को बनाए रखता है।
- source_word: ἁμαρτίας
  choice: अपने पापों को
  rationale: बहुवचन को ‘पापों’ से सुरक्षित रखा गया है। हिन्दी में कर्म-संबंध स्पष्ट और स्वाभाविक करने के लिए ‘अपने’ जोड़ा गया है; आशय व्यक्ति द्वारा किए जाने वाले पापों की संख्या घटने से है।
theological_decisions:
- issue: क्या पद पापों की क्षमा या पाप करने की घटनाओं में कमी की बात करता है?
  choice: पापों को घटाना
  alternative: पापों की क्षमा पाना
  rationale: ग्रीक ἐλαττώσεις का अर्थ ‘कम करना/घटाना’ है, क्षमा पाना नहीं। इसलिए नैतिक परिणाम—कम पाप करना—को रखा गया है और क्षमा का धार्मिक अर्थ आरोपित नहीं किया गया।
