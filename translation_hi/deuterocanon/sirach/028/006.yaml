base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/006.yaml
  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: hi
  text: अंत को स्मरण में रखो[a] और शत्रुता करना छोड़ दो; क्षय और मृत्यु को स्मरण में रखो[b], और आज्ञाओं में स्थिर रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘अंतिम बातें’ है। इसका संकेत किसी व्यक्ति के जीवन के अंत या उसके अंतिम परिणाम की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ उपलब्ध कराया गया इब्रानी साक्ष्य एक अलग कथन देता है, जिसका आशय लगभग यह है: ‘…वह सुनने से पहले बात का उत्तर देता है।’ इसलिए यह इस पद का सीधा पाठान्तर न होकर स्रोत-स्थान की असंगति जान पड़ता है।'
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: स्मरण रखो
  rationale: यह यूनानी आज्ञार्थक क्रिया का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: τὰ ἔσχατα
  choice: अन्त
  rationale: शाब्दिक अर्थ ‘अन्तिम बातें’ है; ‘अन्त’ व्यक्ति के जीवन के अन्त या अन्तिम परिणाम—दोनों की सम्भावना खुली रखता है।
- source_word: παῦσαι ἐχθραίνων
  choice: शत्रुता करना छोड़ दो
  rationale: यह चलती हुई शत्रुतापूर्ण प्रवृत्ति या व्यवहार को रोकने की आज्ञा व्यक्त करता है और इसे केवल मन के ‘द्वेष’ तक सीमित नहीं करता।
- source_word: καταφθοράν
  choice: क्षय
  rationale: मृत्यु के साथ प्रयुक्त होने पर यह नाशशीलता और गलने-बिगड़ने का भाव देता है; ‘भ्रष्टता’ यहाँ अनावश्यक नैतिक अर्थ ला सकती है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: यूनानी संज्ञा का मानक और स्पष्ट हिन्दी रूप।
- source_word: ἔμμενε
  choice: दृढ़ बने रहो
  rationale: यह केवल किसी स्थान में रहने के बजाय निरन्तर निष्ठापूर्वक टिके रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐντολαῖς
  choice: आज्ञाओं पर
  rationale: मूल में परमेश्वर का स्पष्ट सम्बन्धसूचक पद नहीं जोड़ा गया है; ‘आज्ञाओं’ से धार्मिक-नैतिक आशय बना रहता है। हिन्दी में ‘आज्ञाओं पर दृढ़ बने रहो’ स्वाभाविक है।
theological_decisions:
- issue: इस पद के लिए प्राथमिक पाठ-साक्ष्य का चयन
  choice: इस स्थान पर यूनानी समानान्तर पाठ का अनुवाद किया गया है और दिए गए इब्रानी पाठ के असंगत होने की सूचना पादटिप्पणी में रखी गई है।
  alternative: 'दिए गए इब्रानी वाक्य का सीधे अनुवाद किया जाए: ‘और पथिक से भी हल्का वह है, जो सुनने से पहले बात का उत्तर देता है।’'
  rationale: दिया गया इब्रानी वाक्य सिराख 28:6 के यूनानी पाठ से अर्थ की दृष्टि से मेल नहीं खाता और सम्भवतः स्रोत-स्थान की त्रुटि से किसी दूसरे कथन से लिया गया है। इसलिए इस पद का सुसंगत यूनानी साक्ष्य अपनाया गया है, पर पाठगत अनिश्चितता छिपाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली रखी गई है। ‘शत्रुता करना’ व्यवहार और मनोभाव दोनों को समेटता है; ‘दृढ़ बने रहो’ आज्ञाओं के प्रति निरन्तर निष्ठा को सहज रूप से व्यक्त करता है।
