lexical_decisions:
- source_word: γλῶσσα
  choice: जीभ
  rationale: यूनानी शब्द का मूल अर्थ ‘जीभ’ है और यहाँ यह वाणी के लिए रूपक है। ‘जीभ’ रखने से असामान्य कहावत-सदृश बिंब सुरक्षित रहता है।
- source_word: τρίτη
  choice: तीसरी
  rationale: विशेषण का सीधा अर्थ क्रमवाचक ‘तीसरी’ है। मुहावरे की व्याख्या मुख्य पाठ में आरोपित न करके मूल की अस्पष्टता बनाए रखी गई है।
- source_word: ἐσάλευσεν
  choice: डगमगा दिया
  rationale: क्रिया हिलाने, विचलित करने या अस्थिर कर देने का भाव देती है। ‘डगमगा दिया’ ठोस बिंब और सामाजिक प्रभाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διέστησεν
  choice: तितर-बितर कर दिया
  rationale: क्रिया अलग करने या दूर कर देने का अर्थ रखती है; अगले पदबंध के साथ यह लोगों के विभिन्न जाति-समुदायों में बिखर जाने का भाव देती है।
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: एक जाति से दूसरी जाति में
  rationale: यह पदबंध अलग-अलग लोगों या राष्ट्रों के बीच विस्थापन दिखाता है। ‘जाति’ यहाँ जनसमुदाय/राष्ट्र के अर्थ में है और ἔθνος की पुनरावृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: γλῶσσα τρίτη मुहावरे की व्याख्या
  choice: मुख्य पाठ में शाब्दिक बिंब ‘तीसरी जीभ’ रखा गया।
  alternative: निन्दा करने वाली जीभ; दोगली जीभ; फूट डालने वाली वाणी
  rationale: दिया गया यूनानी पाठ शाब्दिक रूप से ‘तीसरी जीभ’ कहता है। अर्थ को किसी एक व्याख्या तक सीमित न करके मूल की वास्तविक अस्पष्टता मुख्य पाठ में सुरक्षित रखी गई और संभावित अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। असामान्य यूनानी मुहावरे को स्पष्ट करने के बजाय उसकी अर्थगत अनिश्चितता बनाए रखी गई है।
