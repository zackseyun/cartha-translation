    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: जो उस पर ध्यान देता है
  rationale: संज्ञा-सदृश वर्तमान कृदंत किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जो उस पूर्वोक्त वस्तु की ओर ध्यान लगाता है। αὐτῇ का स्त्रीलिंग रूप उसके पूर्वपद के व्याकरणिक लिंग के कारण है; हिन्दी में “उस पर” संदर्भ को स्वाभाविक रूप से बनाए रखता है और उसे किसी स्त्री व्यक्ति के रूप में नहीं ठहराता।
- source_word: οὐ μὴ εὑρῇ
  choice: कभी ... नहीं पाएगा
  rationale: οὐ μή और विधिलिंग का मेल प्रबल निषेध व्यक्त करता है। “कभी ... नहीं” उस बल को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἀνάπαυσιν
  choice: विश्राम
  rationale: यह शब्द विश्राम, राहत या चैन का भाव रखता है। “विश्राम” सीधा, गरिमापूर्ण और इस ज्ञान-साहित्यिक प्रसंग के अनुकूल है।
- source_word: οὐδὲ κατασκηνώσει
  choice: और न ... रह सकेगा
  rationale: मूल क्रिया का शाब्दिक चित्र डेरा डालने या निवास करने का है, पर यहाँ आशय स्थिर होकर रहने से है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक चित्र पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: μεθʼ ἡσυχίας
  choice: शांति से
  rationale: ἡσυχία निस्तब्धता, चैन और अशांतिरहित अवस्था को व्यक्त करता है। “शांति से” इस भाव को सहज और संक्षिप्त हिन्दी में पहुँचाता है।
