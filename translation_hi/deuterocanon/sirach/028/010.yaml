  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: hi
  text: आग के ईंधन के अनुसार वह भड़क उठेगी; मनुष्य की शक्ति के अनुसार उसका क्रोध होगा; और अपने धन के अनुसार वह अपना रोष बढ़ाएगा, और संघर्ष की दृढ़ता के अनुसार वह भड़क उठेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम खंड का अर्थ यह भी समझा जा सकता है: “संघर्ष जितना तीव्र होगा, वह उतना ही भड़क उठेगा।” यूनानी शब्द στερέωσις का अधिक शाब्दिक भाव “दृढ़ता” या “जमाव” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕλην
  choice: ईंधन-सामग्री
  rationale: आग के संदर्भ में ὕλη उस जलने वाली सामग्री को सूचित करता है जो आग को पोषण देती है। ‘ईंधन-सामग्री’ अर्थ को स्पष्ट रखते हुए इसे केवल ‘लकड़ी’ तक सीमित नहीं करता।
- source_word: ἐκκαυθήσεται
  choice: भड़क उठती है / भड़क उठता है
  rationale: भविष्यत् कर्मवाच्य का अर्थ आग पकड़ने या प्रबल रूप से जल उठने का है। हिन्दी में ‘भड़क उठना’ अग्नि-रूपक को बनाए रखता है और अन्तिम खंड में संघर्ष के तीव्र होने का संकेत भी देता है।
- source_word: ἰσχὺν
  choice: शक्ति
  rationale: ἰσχύς सामर्थ्य या बल को व्यक्त करता है; सूक्तिपरक तुलना में ‘शक्ति’ सहज और व्यापक है।
- source_word: ἀνθρώπου
  choice: मनुष्य
  rationale: ἀνθρώπου यहाँ जातिवाचक एकवचन है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के सामान्य मानवीय संदर्भ को सुरक्षित रखता है।
- source_word: θυμός
  choice: क्रोध
  rationale: θυμός उग्र या आवेगपूर्ण क्रोध को सूचित कर सकता है। ‘क्रोध’ गरिमापूर्ण और सामान्य हिन्दी है; निकटवर्ती ὀργή से कुछ भेद रखने के लिए वहाँ ‘रोष’ चुना गया है।
- source_word: πλοῦτον
  choice: धन
  rationale: πλοῦτος भौतिक संपदा और उससे मिलने वाले साधनों को सूचित करता है। ‘धन’ संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: ἀνυψώσει
  choice: बढ़ता है
  rationale: शाब्दिक अर्थ ‘ऊँचा उठाना’ है, पर यहाँ क्रोध की वृद्धि या तीव्रता अभिप्रेत है। हिन्दी में ‘रोष उठाता है’ अस्वाभाविक होता; ‘बढ़ता है’ कारण-संबंध को सहज रूप देता है।
- source_word: ὀργήν
  choice: रोष
  rationale: ὀργή क्रोध या आक्रोश को दर्शाता है। ‘रोष’ चुनने से θυμός के लिए प्रयुक्त ‘क्रोध’ के साथ मूल का निकट अर्थ-संबंध भी रहता है और शब्दगत भेद भी दिखाई देता है।
- source_word: στερέωσιν
  choice: दृढ़ता
  rationale: στερέωσις का मूल भाव दृढ़ता, स्थिरता या जमाव है। ‘संघर्ष की दृढ़ता’ कुछ असामान्य होते हुए भी मूल की वास्तविक अस्पष्टता और संघर्ष के जमे हुए या अडिग होने की छवि को बचाता है।
- source_word: μάχης
  choice: संघर्ष
  rationale: μάχη लड़ाई, झगड़े या संघर्ष को कह सकता है। इस ज्ञान-साहित्यीय संदर्भ में ‘संघर्ष’ अनावश्यक सैन्य अर्थ से बचते हुए व्यापक पारस्परिक टकराव को व्यक्त करता है।
theological_decisions:
- issue: ἀνθρώπου के जातिवाचक एकवचन का रूप
  choice: मनुष्य
  alternative: पुरुष / व्यक्ति
  rationale: यूनानी शब्द यहाँ सामान्य मानव का बोध कराता है। हिन्दी ‘मनुष्य’ एकवचन और सूक्तिपरक रूप को बनाए रखते हुए अनावश्यक रूप से केवल पुरुष तक अर्थ सीमित नहीं करता।
- issue: θυμός और ὀργή के बीच शब्दगत भेद
  choice: θυμός = ‘क्रोध’; ὀργή = ‘रोष’
  alternative: दोनों के लिए ‘क्रोध’
  rationale: दोनों शब्दों के अर्थ पर्याप्त रूप से एक-दूसरे से मिलते हैं, फिर भी मूल में दो अलग शब्द हैं। हिन्दी में हल्का शब्दगत भेद इस तथ्य को दिखाता है, बिना कोई कठोर धर्मवैज्ञानिक अंतर आरोपित किए।
- issue: अन्तिम खंड में στερέωσις की अस्पष्टता
  choice: संघर्ष की दृढ़ता
  alternative: संघर्ष की तीव्रता
  rationale: ‘तीव्रता’ संदर्भगत अर्थ को अधिक सहज बनाती, लेकिन στερέωσις की दृढ़ता या जमाव वाली छवि को व्याख्यात्मक रूप से सीमित कर देती। मुख्य पाठ मूल की तनावपूर्ण अभिव्यक्ति रखता है और पादटिप्पणी सम्भावित आशय बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूक्तिपरक हिन्दी अपनाई गई है। समानांतर वाक्यरचना को यथासंभव सुरक्षित रखा गया है। ὕλη और στερέωσις की कठिन अभिव्यक्तियों को अत्यधिक सरल नहीं किया गया; विशेषतः अन्तिम खंड की वास्तविक अस्पष्टता पादटिप्पणी सहित बनाए रखी गई है।
