base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/013.yaml
  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: hi
  text: कानाफूसी करनेवालों और दोहरी ज़बान वालों को शाप दो[a], क्योंकि उन्होंने शांति से रहनेवाले बहुत-से लोगों को नष्ट कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राप्त इब्रानी पाठ कठिन है और अधिक शाब्दिक रूप से ऐसा जान पड़ता है: “उस पर थूको, और वह बुझ जाएगी; [वे दोनों तुम्हारे मुँह से निकलते हैं]।” इसके विपरीत यूनानी समानांतर पाठ में है: “कानाफूसी करनेवालों और दोहरी ज़बान वालों को शाप दो।” प्रसंग में अधिक स्पष्ट अर्थ देने के कारण मुख्य पाठ यूनानी के अनुसार है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  choice: कानाफूसी करनेवाले
  rationale: यह यूनानी शब्द गुप्त रूप से हानिकारक बातें फैलानेवाले व्यक्ति को दर्शाता है। ‘कानाफूसी करनेवाला’ उसके बिंब को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: δίγλωσσον
  choice: दोहरी ज़बानवाले
  rationale: यह चयन यूनानी के ‘दो ज़बान वाला’ रूपक को बनाए रखता है और कपटपूर्ण, अलग-अलग लोगों से अलग-अलग बात कहने का भाव व्यक्त करता है।
- source_word: καταράσθε
  choice: शाप दो
  rationale: यूनानी आज्ञार्थक क्रिया का सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: εἰρηνεύοντας
  choice: शांति से रहनेवाले
  rationale: यह कृदंत उन लोगों को दर्शाता है जो शांति की अवस्था में रह रहे थे; चयन उसके क्रियात्मक भाव को बनाए रखता है।
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: उस पर थूको, और वह बुझ जाएगी
  rationale: प्राप्त इब्रानी का शाब्दिक अर्थ यही है। चूँकि यह यूनानी पाठ से बहुत भिन्न है और संदर्भ के बिना कठिन है, इसे मुख्य पाठ के बजाय पाठांतर-संबंधी पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: '[וּשְׁנֵיהֶם מִפִּיךָ הֵם]'
  choice: '[वे दोनों तुम्हारे मुँह से हैं]'
  rationale: कोष्ठकित इब्रानी वाक्यांश का निकट अनुवाद है; उसकी पाठगत अनिश्चितता दिखाने के लिए कोष्ठक बनाए रखे गए हैं।
theological_decisions:
- issue: प्राप्त इब्रानी और यूनानी समानांतर पाठ के बीच तीव्र भिन्नता
  choice: मुख्य पाठ में यूनानी का वचन-विनाश के विरुद्ध स्पष्ट उपदेश रखा गया है और प्राप्त इब्रानी को पादटिप्पणी में दिया गया है।
  alternative: 'मुख्य पाठ में इब्रानी का अधिक शाब्दिक अनुवाद: ‘उस पर थूको, और वह बुझ जाएगी; [वे दोनों तुम्हारे मुँह से हैं]।’'
  rationale: प्राप्त इब्रानी कठिन है और उसका अंतिम अंश कोष्ठकित तथा अनिश्चित है, जबकि यूनानी पाठ प्रसंग में सुसंगत पूर्ण वाक्य देता है। फिर भी इब्रानी को छिपाया या यूनानी से मिलाने का प्रयास नहीं किया गया; वास्तविक पाठगत तनाव पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘कानाफूसी करनेवाले’ और ‘दोहरी ज़बानवाले’ वाणी के दोनों यूनानी रूपकों को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखते हैं।
