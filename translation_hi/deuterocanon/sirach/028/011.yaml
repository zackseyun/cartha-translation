translation:
  language: hi
  text: जल्दबाज़ी में बढ़ाया गया झगड़ा आग भड़काता है, और उतावली में की गई लड़ाई खून बहाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρις κατασπευδομένη
  choice: जल्दबाज़ी में बढ़ाया गया झगड़ा
  rationale: ἔρις का स्वाभाविक अर्थ ‘झगड़ा/विवाद’ है; κατασπευδομένη में जल्दबाज़ी से आगे बढ़ाए जाने का भाव है, जिसे हिन्दी में स्पष्ट और सहज रखा गया है।
- source_word: ἐκκαίει πῦρ
  choice: आग भड़काता है
  rationale: ἐκκαίω केवल आग जलाने नहीं, उसे भड़का देने का सशक्त भाव देता है।
- source_word: μάχη κατασπεύδουσα
  choice: उतावली में की गई लड़ाई
  rationale: μάχη को ‘लड़ाई’ और वर्तमान कृदन्त κατασπεύδουσα को उतावले ढंग से आरम्भ या आगे बढ़ने वाली क्रिया के रूप में व्यक्त किया गया है।
- source_word: ἐκχέει αἷμα
  choice: खून बहाती है
  rationale: यूनानी मुहावरे ‘रक्त उँडेलती है’ का आधुनिक और स्वाभाविक हिन्दी रूप, हिंसक परिणाम को यथावत रखता है।
