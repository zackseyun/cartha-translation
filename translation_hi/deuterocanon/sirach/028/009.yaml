base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/009.yaml
  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
translation:
  language: hi
  text: क्योंकि क्रोधी मनुष्य झगड़े को भड़का देगा[a], और पापी मनुष्य मित्रों में खलबली मचा देगा; वह मेल कराने वालों के बीच बदनामी की बात डाल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्रोधी’ का अर्थ ‘तुनकमिज़ाज’ भी हो सकता है। यूनानी शब्द ऐसे व्यक्ति को दर्शाता है जो क्रोधी स्वभाव का हो।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “मेल कराने वालों के बीच निंदा या बदनामी की बात डालता है।” “मेल कराने वालों” का अनुवाद “शांति बनाए रखने वालों” भी किया जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμώδης
  choice: क्रोधी
  rationale: यह विशेषण ऐसे व्यक्ति को बताता है जिसका स्वभाव क्रोधी या तुनकमिज़ाज है। ‘क्रोधी’ संक्षिप्त, स्वाभाविक और चरित्रगत प्रवृत्ति को व्यक्त करता है।
- source_word: ἐκκαύσει μάχην
  choice: झगड़े को भड़का देगा
  rationale: ἐκκαίω में आग भड़काने का रूपक है, जबकि μάχη यहाँ व्यापक आपसी झगड़े या संघर्ष को दर्शाता है। यह अनुवाद रूपक और भाव दोनों रखता है।
- source_word: ἁμαρτωλός
  choice: पापी
  rationale: यह व्यक्ति के पापमय चरित्र का विशेषणात्मक वर्णन है और पहले खंड के ‘क्रोधी मनुष्य’ के समानांतर बैठता है।
- source_word: ταράξει φίλους
  choice: मित्रों में खलबली मचा देगा
  rationale: ταράσσω अशांत करने, उलझन या खलबली पैदा करने को दर्शाता है। ‘मित्रों में’ से यह स्वाभाविक हिंदी अर्थ निकलता है कि वह मित्रों के संबंधों को अस्त-व्यस्त करता है।
- source_word: εἰρηνευόντων
  choice: मेल कराने वालों
  rationale: वर्तमान कृदंत को शांति या मेल स्थापित करने में लगे लोगों के रूप में समझा गया है; यह उसके सक्रिय क्रियात्मक बल को बनाए रखता है।
- source_word: ἐκβάλλει διαβολήν
  choice: बदनामी की बात डाल देगा
  rationale: διαβολή निंदात्मक या बदनाम करने वाली बात है और ἐκβάλλει डालने या फेंकने की सजीव छवि देता है। हिंदी में यह चयन मेल-मिलाप के बीच ऐसी बात डालकर विघ्न उत्पन्न करने की छवि बनाए रखता है।
- source_word: ἄνθρωπος / ἀνήρ
  choice: मनुष्य
  rationale: दोनों यूनानी पुल्लिंग एकवचन संज्ञाएँ नीतिवचन की प्रतिनिधिक शैली में हैं। ‘मनुष्य’ स्रोत की एकवचन मानवीय अभिव्यक्ति रखते हुए आधुनिक हिंदी में स्वाभाविक है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक पुल्लिंग भाषा
  choice: दोनों समानांतर खंडों में ‘मनुष्य’
  alternative: ‘व्यक्ति’ अथवा स्पष्ट रूप से ‘पुरुष’
  rationale: यूनानी पाठ पुल्लिंग एकवचन रूपों का उपयोग करता है, पर कथन सामान्य मानवीय आचरण के विषय में है। ‘मनुष्य’ स्रोत-रूप और प्रतिनिधिक अर्थ दोनों को सहजता से व्यक्त करता है।
- issue: εἰρηνευόντων का क्रियात्मक अर्थ
  choice: मेल कराने वालों
  alternative: शांति से रहने वालों
  rationale: कृदंत का अर्थ शांति स्थापित करना अथवा शांति से रहना दोनों हो सकता है। संदर्भ में मेल कराने में लगी मंडली के बीच बदनामी की बात डालने का अर्थ सुसंगत है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। भविष्यकालीन यूनानी क्रियाओं को ‘भड़का देगा’, ‘मचा देगा’ और ‘डाल देगा’ से बनाए रखा गया है। दूसरे और तीसरे खंड के एक ही कर्ता को हिंदी में स्पष्ट करने के लिए तीसरे खंड में ‘वह’ जोड़ा गया है।
