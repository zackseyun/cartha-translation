lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह बहुवचन विशेषण की मात्रा को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔπεσαν
  choice: गिरे हैं
  rationale: मूल क्रिया ‘गिरना’ है; पूर्णतासूचक हिन्दी रूप नीतिवचन-जैसे सार्वकालिक कथन के अनुकूल है और ‘मारे गए’ जैसी व्याख्यात्मक विशिष्टता से बचता है।
- source_word: ἐν στόματι μαχαίρας
  choice: तलवार के मुँह से
  rationale: यूनानी का सजीव शाब्दिक बिंब सुरक्षित रहता है और आगे आने वाली ‘जीभ’ के साथ अलंकारिक संबंध बना रहता है; सामान्य मुहावरे में इसका आशय तलवार की धार है।
- source_word: καὶ οὐχ ὡς
  choice: पर उतने नहीं, जितने
  rationale: तुलनात्मक वाक्यांश में संख्या/परिमाण निहित समझा जा सकता है। यह हिन्दी में स्पष्ट और सहज है, जबकि यूनानी में तुलना संक्षिप्त रूप में व्यक्त हुई है।
- source_word: οἱ πεπτωκότες
  choice: गिरे हैं
  rationale: पूर्ण कृदंत को पहले खंड की ‘गिरे हैं’ क्रिया दोहराकर स्वाभाविक हिन्दी तुलना में व्यक्त किया गया है।
- source_word: διὰ γλῶσσαν
  choice: जीभ के कारण
  rationale: διά के कारणसूचक अर्थ को स्पष्ट करता है और विनाशकारी वाणी के लिए मूल का ठोस ‘जीभ’ बिंब बनाए रखता है।
theological_decisions:
- issue: तलवार और जीभ के बीच रूपकात्मक विरोध
  choice: ‘तलवार का मुँह’ और ‘जीभ’—दोनों ठोस बिंब सुरक्षित रखे गए हैं।
  alternative: ‘तलवार की धार’ और ‘बातों/वाणी के कारण’ कहना।
  rationale: 'यह कोई संप्रदायगत सिद्धांत नहीं, बल्कि पद की ज्ञान-साहित्य संबंधी धार है: शारीरिक हथियार की तुलना विनाशकारी वाणी से होती है। शाब्दिक बिंब रखने से यूनानी का शब्दालंकार और तनाव अधिक स्पष्ट रहता है।'
- issue: οὐχ ὡς में तुलना का स्वरूप
  choice: इसे संख्या की तुलना के रूप में ‘उतने नहीं, जितने’ कहा गया है।
  alternative: अधिक शाब्दिक और अस्पष्ट रूप में ‘पर उन लोगों के समान नहीं जो जीभ के कारण गिरे हैं’ कहना।
  rationale: संदर्भ में पहला ‘बहुत-से’ तुलना का परिमाण उपलब्ध कराता है; हिन्दी में केवल ‘समान नहीं’ कहने से तुलना का आशय भ्रामक हो सकता है। फिर भी यह विस्तार मूल में निहित है, प्रत्यक्षतः दोहराया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तलवार के मुँह’ का असामान्य किंतु समझने योग्य रूप जानबूझकर रखा गया है; पादटिप्पणी उसका मुहावरेदार अर्थ स्पष्ट करती है। तुलना को सहज हिन्दी के लिए ‘उतने नहीं, जितने’ संरचना में व्यक्त किया गया है।
