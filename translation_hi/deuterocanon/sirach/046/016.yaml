base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: hi
  text: उसने भी परमेश्वर को पुकारा, जब उसके शत्रुओं ने उसे चारों ओर से घेर लिया था[a]; जब उसने दूध-पला मेमना चढ़ाया[b], तब याहवे स्वर्ग से गरजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस वाक्यांश का ठीक रूप कठिन है; यूनानी समानांतर पाठ “जब उसके शत्रुओं ने उसे चारों ओर से दबाया/घेरा” अर्थ का समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: या, “दूध पीता मेमना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: परमेश्वर को पुकारा
  rationale: קרא אל प्रार्थना या संकट में सहायता के लिए पुकारने का सामान्य मुहावरा है। हिंदी में “परमेश्वर को पुकारा” स्वाभाविक है और निवेदन का भाव बनाए रखता है।
- source_word: כאפכה לו אויביו מסביב
  choice: जब उसके शत्रुओं ने उसे चारों ओर से घेर लिया था
  rationale: प्राप्त इब्रानी रूप कठिन है, पर यूनानी समानांतर पाठ शत्रुओं द्वारा चारों ओर से दबाए या घेरे जाने के अर्थ का समर्थन करता है। यह अनुवाद उसी संभावित अर्थ को स्पष्ट, स्वाभाविक हिंदी में रखता है।
- source_word: בעלתו
  choice: जब उसने ... चढ़ाया
  rationale: इब्रानी रूप कुछ असामान्य है, जबकि यूनानी προσφορά बलिदानी भेंट के प्रसंग की पुष्टि करता है। “चढ़ाया” हिंदी में बलिदान अर्पित करने का संक्षिप्त और स्वाभाविक शब्द है।
- source_word: טלה חלב
  choice: दूध-पला मेमना
  rationale: यह पदबंध दूध पर पलने वाले छोटे मेमने को दर्शाता है। “दूध-पला मेमना” ठोस, सहज और आधुनिक हिंदी है; “दूध पीता मेमना” भी संभव है।
- source_word: וירעם משמים יהוה
  choice: तब याहवे स्वर्ग से गरजा
  rationale: רעם यहाँ गर्जन या बादल की गड़गड़ाहट जैसी दिव्य प्रतिक्रिया व्यक्त करता है। “स्वर्ग से गरजा” इस सजीव बिंब को बनाए रखता है, और तब वाक्य के घटनाक्रम को स्वाभाविक बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। “याहवे” उस व्यक्तिगत वाचा-नाम को उपाधि “प्रभु” में बदलने के बजाय सुरक्षित रखता है और “यहोवा” की अपेक्षा संभावित प्राचीन उच्चारण के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर गरिमापूर्ण बाइबिलीय लहजा रखा गया है। कठिन इब्रानी को मुख्य पाठ में सहज अर्थ के साथ प्रस्तुत कर पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
