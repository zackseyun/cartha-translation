base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: hi
  text: इसलिए उन दोनों को भी छह लाख पैदल सैनिकों में से वर्षों तक बचाए रखा गया[a], ताकि वे उन्हें उनकी विरासत में—दूध और मधु बहने वाले देश में—ले जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “वर्षों में” है, जिसका अर्थ कठिन है; सम्भवतः आशय है कि उन दोनों को वर्षों तक या वृद्धावस्था तक सुरक्षित रखा गया। यूनानी समानांतर में अधिक सरलता से लिखा है, “वे दोनों बच गए।”
    reason: textual_variant
  - marker: b
    text: “ताकि वे उन्हें उनकी विरासत में—दूध और मधु बहने वाले देश में—ले जाएँ” वाला अंश यूनानी समानांतर में है; उपलब्ध इब्रानी साक्ष्य यहाँ छोटा है। यूनानी सम्भवतः पद का पूर्णतर रूप सुरक्षित रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: इसलिए
  rationale: यह पिछले कथन—क्रोध को फेरने और बुरी निंदा को रोकने—से परिणाम का संबंध स्पष्ट करता है।
- source_word: גם הם
  choice: उन दोनों को भी
  rationale: इब्रानी में संदर्भित व्यक्तियों की ओर संकेत है; यूनानी का καὶ αὐτοὶ δύο स्पष्ट रूप से उनकी संख्या दो बताता है। यहाँ यहोशू और कालेब अभिप्रेत हैं, पर नाम जोड़ना अनावश्यक व्याख्या होता।
- source_word: בשנים נאצלו
  choice: वर्षों तक बचाए रखा गया
  rationale: इब्रानी वाक्यांश कठिन है। यह अनुवाद वर्षों के दौरान सुरक्षित रखे जाने का संभावित भाव देता है और अस्पष्टता को पादटिप्पणी में बनाए रखता है; यूनानी में इसके स्थान पर सरलतः दोनों के बचाए जाने की बात है।
- source_word: משש מאות אלף רגלי
  choice: छः लाख पैदल चलनेवालों में से
  rationale: רגלי का मूल अर्थ पैदल चलनेवाले लोगों से है। प्रसंग युद्धयोग्य पुरुषों का हो सकता है, पर हिन्दी में ‘पैदल सैनिक’ इस्राएल की पूरी गिनी हुई मंडली को अनावश्यक रूप से सैन्य वर्ग तक सीमित कर सकता है।
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: ताकि वे उन्हें उनकी विरासत में ... ले जाएँ
  rationale: यह यूनानी समानांतर में सुरक्षित पूर्णतर वाक्यांश है। ‘विरासत’ प्रतिज्ञात देश के वाचागत भाव को बनाए रखती है।
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: दूध और मधु बहनेवाले देश में
  rationale: यह यूनानी पाठ का सीधा और हिन्दी बाइबलीय प्रयोग में सहज रूप है।
theological_decisions:
- issue: जीवित इब्रानी साक्ष्य छोटा और בשנים נאצלו कठिन है, जबकि यूनानी समानांतर में पूर्णतर कथन है।
  choice: मुख्य पाठ में कठिन इब्रानी पद का सावधान अर्थ रखा गया और यूनानी से विरासत तथा दूध-मधु वाले देश का अगला अंश सम्मिलित किया गया।
  alternative: केवल उपलब्ध इब्रानी का अनुवाद करके वाक्य को ‘छः लाख पैदल चलनेवालों में से’ पर समाप्त करना; अथवा यूनानी के अनुसार केवल ‘वे दोनों बच गए’ कहना।
  rationale: इब्रानी को प्राथमिकता देते हुए उसकी वास्तविक कठिनाई छिपाई नहीं गई; साथ ही यूनानी समानांतर सम्भवतः लुप्त पूर्णतर पाठ को सुरक्षित रखता है और प्रसंग से मेल खाता है।
- issue: कौन किसे विरासत में ले गया
  choice: यूनानी बहुवचन के अनुसार ‘वे उन्हें ... ले जाएँ’ रखा गया।
  alternative: केवल यहोशू को अगुवा मानकर एकवचन अर्थ देना।
  rationale: पाठ दोनों बचे हुए व्यक्तियों को व्याकरणिक कर्ता बनाता है; किसी एक के पक्ष में इसे चुपचाप बदलना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘छः लाख’ पारंपरिक बाइबलीय संख्या-शैली के अनुरूप है। कठिन इब्रानी को अत्यधिक शाब्दिक और अस्पष्ट ‘वर्षों में बचाए गए’ न बनाकर ‘वर्षों तक बचाए रखा गया’ किया गया है, जबकि पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट है।
