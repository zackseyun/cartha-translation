  text: How glorious he was when he stretched out his hand[a], when he brandished a spear against a city.
translation:
  language: hi
  text: जब उसने अपना हाथ बढ़ाया[a] और नगर के विरुद्ध भाला लहराया, तब वह कितना गौरवशाली था!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “जब उसने अपने हाथ उठाए ... और नगरों के विरुद्ध तलवार चलाई।” इब्रानी साक्षी में “नगर के विरुद्ध भाला लहराया” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  choice: वह कितना प्रतापी था
  rationale: यह विस्मयात्मक पद यहोशू के युद्ध-संबंधी गौरव और प्रभाव की प्रशंसा करता है। “प्रतापी” आधुनिक, गरिमापूर्ण हिन्दी में इस प्रशंसात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בנטותו יד
  choice: जब उसने अपना हाथ बढ़ाया
  rationale: क्रिया-रूप कार्य के समय या परिस्थिति को बताता है। “हाथ बढ़ाया” इब्रानी शारीरिक संकेत को बनाए रखता है; यूनानी समानांतर में हाथ उठाने का भाव है।
- source_word: בהניפו כידון
  choice: भाला लहराया
  rationale: הניף उठाकर लहराने या भाँजने का बोध देता है, और כידון भाले अथवा बरछे जैसे हथियार का नाम है। “भाला लहराया” सजीव और सहज हिन्दी है तथा हथियार के प्रकार को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: על עיר
  choice: नगर के विरुद्ध
  rationale: युद्ध के प्रसंग में על विरोधी दिशा या आक्रमण को व्यक्त करता है। “के विरुद्ध” इस भाव को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
theological_decisions:
- issue: इब्रानी और यूनानी में हथियार तथा वचन-संख्या का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार “नगर के विरुद्ध भाला”
  alternative: यूनानी समानांतर के अनुसार “नगरों के विरुद्ध तलवार”
  rationale: उपलब्ध इब्रानी पाठ उच्च विश्वसनीयता वाला और अर्थ की दृष्टि से संगत है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी भिन्नता को पाठ-साक्ष्य के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- issue: प्रशंसात्मक पद का भाव
  choice: “वह कितना प्रतापी था”
  alternative: “वह कितना महिमामय था” या “वह कितना भव्य था”
  rationale: “प्रतापी” युद्ध में यहोशू के गौरव की प्रशंसा को व्यक्त करता है, पर पाठ में उससे अधिक कोई विशेष धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। विस्मयात्मक रचना को हिन्दी में स्वाभाविक बनाने के लिए मुख्य प्रशंसात्मक वाक्यांश को अंत में रखा गया है।
