base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: hi
  text: और प्रभु ने कालेब को सामर्थ्य दिया, और वह सामर्थ्य बुढ़ापे तक उसमें बनी रही, ताकि वह देश के पर्वतीय भागों पर चढ़े और उसके वंश ने भूमि को अपने उत्तराधिकार में ले लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध इब्रानी पाठ में कर्ता केवल “उसने” है और अंतिम दो उपवाक्य नहीं हैं; यूनानी समानांतर में “प्रभु ने” तथा “ताकि वह ... उसके वंश ने ...” पढ़ा जाता है।
    reason: इब्रानी और यूनानी पाठ-साक्ष्य के अंतर को स्पष्ट करना आवश्यक है; मुख्य पाठ पूर्ण पद के लिए यूनानी समानांतर का अनुसरण करता है।
lexical_decisions:
- source_word: עָצְמָה (עצמה)
  choice: सामर्थ्य
  rationale: यहाँ शब्द शक्ति या दृढ़ सामर्थ्य का बोध कराता है; ‘सामर्थ्य’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: עַד שֵׂיבָה (ועד שיבה)
  choice: बुढ़ापे तक
  rationale: इब्रानी पद का सीधा और स्वाभाविक हिन्दी रूप, जो दीर्घकाल तक बने रहने पर बल देता है।
- source_word: ὕψος τῆς γῆς
  choice: देश के ऊँचे भाग
  rationale: यूनानी में भूभाग की ऊँचाई अभिप्रेत है; ‘ऊँचे भाग’ अनावश्यक रूप से किसी विशिष्ट पर्वत की पहचान नहीं करता।
- source_word: τὸ σπέρμα αὐτοῦ
  choice: उसके वंश
  rationale: ‘बीज’ यहाँ सामूहिक अर्थ में भावी संतान या वंश को दर्शाता है; हिन्दी में ‘वंश’ स्वाभाविक है।
- source_word: κατέσχεν κληρονομίαν
  choice: विरासत पर अधिकार कर लिया
  rationale: क्रिया दृढ़ता से अपने अधिकार में लेने का अर्थ देती है; यह अनुवाद भूमि-विरासत के भाव को बनाए रखता है।
theological_decisions:
- issue: सामर्थ्य देने वाले कर्ता की पहचान
  choice: मुख्य पाठ में ‘उसने’ रखकर इब्रानी की सर्वनामगत अभिव्यक्ति सुरक्षित रखी गई
  alternative: यूनानी के अनुसार ‘प्रभु ने’
  rationale: प्रदत्त इब्रानी पाठ में कर्ता सर्वनाम से व्यक्त है, जबकि यूनानी समानांतर उसे स्पष्ट रूप से ‘प्रभु’ कहता है। मुख्य पाठ इब्रानी की अभिव्यक्ति को नहीं खोलता; पाठांतर टिप्पणी में दिया गया है।
- issue: अंतिम दो उपवाक्यों का पाठाधार
  choice: पूर्ण पद के लिए यूनानी समानांतर के आधार पर उन्हें मुख्य पाठ में रखा गया
  alternative: केवल उपलब्ध इब्रानी अंश पर पद समाप्त करना
  rationale: प्रदत्त इब्रानी साक्ष्य में ये उपवाक्य नहीं हैं, पर पूर्ण प्राचीन यूनानी पाठ उन्हें सुरक्षित रखता है और अंग्रेज़ी परामर्श पाठ भी उन्हें सम्मिलित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘वह सामर्थ्य’ दोहराने से हिन्दी में सर्वनाम का संदर्भ स्पष्ट होता है। ‘जिससे’ उद्देश्य और परिणाम के बीच यूनानी रचना की हल्की अर्थगत खुलावट बनाए रखता है।
