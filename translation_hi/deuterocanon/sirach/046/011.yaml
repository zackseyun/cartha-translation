base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: hi
  text: और न्यायियों को भी, हर एक को उसके नाम से—वे सभी जिनका मन नहीं भटका[a] और जो परमेश्वर से नहीं फिरे[b]—उनकी स्मृति धन्य हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “हर वह जिसने अपना मन नहीं उठाया।” यूनानी समानांतर में है, “जिनका मन नहीं भटका,” जो संभवतः यहाँ अभिप्रेत अर्थ को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में है, “प्रभु से नहीं फिरे।” यहाँ इब्रानी साक्ष्य में “परमेश्वर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: और न्यायी भी
  rationale: यहाँ ‘न्यायी’ इस्राएल के न्यायियों के युग के अगुओं को सूचित करता है; यूनानी οἱ κριταί भी इसी अर्थ की पुष्टि करता है। ‘भी’ पूर्ववर्ती प्रसंग से संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: איש בשמו
  choice: हर एक अपने-अपने नाम से
  rationale: यह मुहावरा न्यायियों को केवल समूह के रूप में नहीं, बल्कि अलग-अलग नाम से स्मरण किए जाने पर बल देता है।
- source_word: כל אשר לא נשא לבו
  choice: वे सभी, जिनका मन नहीं भटका
  rationale: प्राप्त इब्रानी का शाब्दिक अर्थ ‘जिन्होंने अपना मन नहीं उठाया’ है और वह गर्व की ओर संकेत कर सकता है; किंतु यूनानी समानांतर ‘जिनका हृदय व्यभिचार की तरह भटक नहीं गया’ पढ़ता है। निकटवर्ती वाक्यांश भी परमेश्वर के प्रति निष्ठा की बात करता है, इसलिए मुख्य पाठ में सहज किंतु संयत ‘मन नहीं भटका’ रखा गया है और इब्रानी रूप पादटिप्पणी में सुरक्षित है।
- source_word: ולא נסוג מאחרי אל
  choice: और जिन्होंने परमेश्वर से मुँह नहीं मोड़ा
  rationale: נסוג מאחרי का भाव परमेश्वर के पीछे चलने से हटना या उससे फिर जाना है। ‘मुँह नहीं मोड़ा’ आधुनिक हिंदी में इसी आशय को स्वाभाविक रूप से व्यक्त करता है। इब्रानी אל के अनुसार ‘परमेश्वर’ मुख्य पाठ में रखा गया है।
- source_word: יהי זכרם לברכה
  choice: उनका स्मरण आशीष का कारण हो
  rationale: यह इब्रानी कामनासूचक मुहावरे ‘उनका स्मरण आशीष के लिए हो’ का स्वाभाविक और गरिमापूर्ण हिंदी रूप है, जो स्मरण और आशीष के संबंध को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय संबोधन
  choice: परमेश्वर
  alternative: प्रभु
  rationale: प्राथमिक इब्रानी साक्ष्य में אל, ‘परमेश्वर,’ है; यूनानी समानांतर में Κυρίου, ‘प्रभु,’ है। इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठांतर पादटिप्पणी में दिया गया है।
- issue: मन से संबंधित वाक्यांश का आशय
  choice: जिनका मन नहीं भटका
  alternative: जिन्होंने अपना मन ऊँचा नहीं किया
  rationale: इब्रानी रूप गर्व का अर्थ दे सकता है, जबकि यूनानी समानांतर वाचा से भटकने या अविश्वासयोग्य होने का संकेत देता है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है, पर वास्तविक पाठगत तनाव को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामूहिक स्मरण के अनुकूल शैली रखी गई है। ‘न्यायी’ ऐतिहासिक पदनाम के रूप में प्रयुक्त है; पाठगत अस्पष्टता और इब्रानी–यूनानी भिन्नता पादटिप्पणियों में स्पष्ट की गई है।
