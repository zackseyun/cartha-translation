  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: hi
  text: क्या उसके हाथ से सूर्य ठहर नहीं गया था[a], और एक दिन दो दिनों के समान था[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह यहोशू की विजय की उस परंपरा की ओर संकेत है जिसमें सूर्य की गति रुक गई थी; यहोशू 10:12–14 देखें।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, “एक दिन दो के समान था”; इब्रानी में “दिनों” शब्द प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הלא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न सहमति की अपेक्षा करता है; हिन्दी में ‘क्या ... नहीं’ उसके प्रश्नात्मक और बलात्मक भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: בידו
  choice: उसके हाथ से
  rationale: इब्रानी मुहावरा साधन अथवा कर्तृत्व व्यक्त करता है। यह अनुवाद उसकी ठोस ‘हाथ’ वाली छवि और कर्तृत्व—दोनों को सुरक्षित रखता है।
- source_word: עמד השמש
  choice: सूर्य ठहर गया था
  rationale: עמד का मूल अर्थ ‘खड़ा होना/ठहरना’ है; सूर्य के प्रसंग में इसका आशय उसकी गति रुकने से है। ‘ठहर गया’ हिन्दी में स्वाभाविक है और यूनानी समानांतर से भी संगत है।
- source_word: יום אחד
  choice: एक दिन
  rationale: इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: כשנים היה
  choice: दो दिनों के समान हो गया था
  rationale: इब्रानी में शाब्दिक रूप से ‘दो के समान था/हो गया’ है और ‘दिनों’ का अर्थ प्रसंग से समझा जाता है। हिन्दी में संज्ञा दोहराना स्पष्टता और स्वाभाविकता के लिए आवश्यक है; היה को यहाँ स्थिति के घटित होने के अर्थ में ‘हो गया था’ कहा गया है।
theological_decisions:
- issue: यहोशू और सूर्य से संबंधित चमत्कार की भाषा
  choice: कथन को स्तुतिपरक कविता के भीतर चमत्कार की सीधी अभिव्यक्ति के रूप में रखा गया है।
  alternative: इसे केवल सैनिक विजय अथवा अधिक समय मिलने की काव्यात्मक अतिशयोक्ति मानना।
  rationale: इब्रानी पाठ सूर्य के ठहरने और एक दिन के दो दिनों के समान होने की बात सीधे कहता है; अनुवाद इस दावे को रूपक बनाकर नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। अलंकारिक प्रश्न, ‘हाथ’ की ठोस छवि और चमत्कार के सीधे दावे को सुरक्षित रखा गया है।
