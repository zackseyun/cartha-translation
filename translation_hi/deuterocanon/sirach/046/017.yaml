base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/017.yaml
  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: hi
  text: प्रचंड गर्जना में उसकी वाणी सुनाई दी[a]; शत्रु के अगुए दबा दिए गए[b], और पलिश्तियों के सभी शासक[c] नष्ट हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अर्थ कुछ अनिश्चित है, पर उसका भाव ‘प्रचंड ध्वनि/गर्जना में’ है। यूनानी समानांतर अधिक स्पष्ट रूप से कहता है कि प्रभु स्वर्ग से गरजा और उसने बड़े नाद के साथ अपनी वाणी सुनाई।
    reason: alternative_reading
  - marker: b
    text: या, ‘शत्रु की चौकियाँ’; इब्रानी शब्द नियुक्त अधिकारियों अथवा सैनिक चौकियों—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘पलिश्तियों के सभी सरदार।’ यह पलिश्ती शासकों की वह उपाधि है जो 1 शमूएल में भी मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: प्रचंड गर्जना के बीच
  rationale: इब्रानी पदबंध का रूप और सटीक अर्थ कुछ कठिन है, पर वह किसी अत्यन्त प्रबल ध्वनि की ओर संकेत करता है। यूनानी समानांतर में प्रभु के स्वर्ग से गरजने और बड़े नाद के साथ अपनी वाणी सुनाने का उल्लेख है। ‘गर्जना’ इस प्रसंगगत संकेत को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि पादटिप्पणी इब्रानी और यूनानी के अंतर को सुरक्षित रखती है।
- source_word: נשמע קולו
  choice: उसकी वाणी सुनाई दी
  rationale: यह इब्रानी के कर्मवाच्य विन्यास को सहज हिन्दी में बनाए रखता है। ‘वाणी’ प्रसंग में परमेश्वर की सुनाई देने वाली आवाज़ को व्यक्त करती है।
- source_word: ויכנע
  choice: दबा दिए गए
  rationale: क्रिया का आशय नीचा करने या वश में करने का है। कर्मवाच्य अनुवाद सैन्य प्रसंग के अनुकूल है और इब्रानी में निहित कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נציבי צר
  choice: शत्रु के अगुए
  rationale: נציב किसी नियुक्त अधिकारी, अगुए अथवा सैनिक चौकी का सूचक हो सकता है। अगले खंड में पलिश्ती शासकों के उल्लेख के कारण यहाँ व्यक्तिवाचक अर्थ ‘अगुए’ काव्यात्मक समानता में अधिक उपयुक्त है; दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: ויאבד
  choice: नष्ट हो गए
  rationale: बिना स्वरचिह्नों वाला रूप विनाश या मिट जाने का भाव देता है। यहाँ अकर्मक हिन्दी अभिव्यक्ति शासकों के परिणाम पर ध्यान रखती है और कर्ता को अनावश्यक रूप से निर्धारित नहीं करती।
- source_word: סרני פלשתים
  choice: पलिश्तियों के सभी शासक
  rationale: סרנים पलिश्ती शासकों की परिचित उपाधि है। ‘शासक’ आधुनिक हिन्दी में स्पष्ट है और सामंती अर्थछाया से बचता है।
theological_decisions:
- issue: ‘उसकी वाणी’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम को बनाए रखा गया है; प्रसंग और यूनानी समानांतर के अनुसार यह परमेश्वर की वाणी है।
  alternative: इसे शमूएल की प्रार्थना या कार्य के माध्यम से सुनाई देने वाली वाणी से अधिक परोक्ष रूप में जोड़ा जा सकता है।
  rationale: यूनानी समानांतर स्पष्ट रूप से प्रभु के स्वर्ग से गरजने की बात करता है, जबकि इब्रानी केवल ‘उसकी वाणी’ कहता है। इसलिए मुख्य पाठ इब्रानी की सर्वनामगत संक्षिप्तता बचाता है और पादटिप्पणी यूनानी साक्ष्य स्पष्ट करती है।
- issue: ויכנע में निहित कर्ता
  choice: ‘दबा दिए गए’ कर्मवाच्य रखा गया है।
  alternative: ‘उसने शत्रु के अगुओं को दबा दिया,’ जिसमें कर्ता परमेश्वर या प्रसंगानुसार शमूएल समझा जा सकता है।
  rationale: इब्रानी क्रिया का रूप सक्रिय कर्ता का संकेत दे सकता है, किंतु इस खंड में उसका स्पष्ट नाम नहीं है। कर्मवाच्य हिन्दी मूल परिणाम को व्यक्त करते हुए कर्ता के संबंध में वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रचंड गर्जना’, ‘अगुए’ और ‘शासक’ काव्यात्मक-सैन्य प्रसंग को स्पष्ट रखते हैं। अर्धविराम इब्रानी के प्रथम श्रव्य दृश्य और उसके बाद बताए गए सैन्य परिणामों के बीच संबंध दिखाता है।
