base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/018.yaml
  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: hi
  text: और अपने बिछौने पर विश्राम करते समय, उसने यहोवा और उसके अभिषिक्त जन[a] को साक्षी ठहराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अभिषिक्त जन” के लिए प्रयुक्त शब्द उसी मूल से है जिससे “मसीह” शब्द है। यहाँ यह विशेष रूप से शमूएल के समय के यहोवा-अभिषिक्त शासक की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद का यूनानी पाठ बहुत भिन्न है। उसमें लिखा है कि उसने “सोर के सरदारों और पलिश्तियों के सभी शासकों को कुचल दिया।” यह इब्रानी और यूनानी पाठ-परंपराओं के बीच एक बड़ा पाठांतर है।
    reason: textual_variant
lexical_decisions:
- source_word: ועת נוחו
  choice: और जब वह ... विश्राम कर रहा था
  rationale: यह पदबंध विश्राम के समय को बताता है। अपूर्णतासूचक हिन्दी अभिव्यक्ति उस अंतिम विश्राम की ओर संकेत बनाए रखती है, पर मुख्य पाठ में इसे सीधे ‘मृत्यु’ नहीं कहती।
- source_word: על משכבו
  choice: अपने बिछौने पर
  rationale: משכב का सामान्य अर्थ लेटने का स्थान या बिछौना है। ‘मृत्युशय्या’ कहना प्रसंग की व्याख्या को मूल शब्द में जोड़ देता।
- source_word: העיד
  choice: के सामने गवाही दी
  rationale: עוד के हिफ़ील रूप में गवाही देने, चेताने या साक्षी ठहराने का अर्थ हो सकता है। यहाँ स्वीकृत पाठ-पठन के अनुसार ‘के सामने गवाही दी’ चुना गया है, जबकि क्रिया की न्यायिक-साक्ष्य संबंधी शक्ति बनी रहती है।
- source_word: יהוה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को आधुनिक हिन्दी में प्रचलित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: ומשיחו
  choice: और उसके अभिषिक्त जन
  rationale: משיח का मूल अर्थ ‘अभिषिक्त जन’ है। इससे ऐतिहासिक शासक की संभावित ओर संकेत बना रहता है और बाद की विशिष्ट मसीही पहचान को अनावश्यक रूप से आरोपित नहीं किया जाता।
theological_decisions:
- issue: ומשיחו का संदर्भ
  choice: उसके अभिषिक्त जन
  alternative: उसके मसीह; उसके राजा
  rationale: इब्रानी में उपाधि प्रयुक्त है, व्यक्ति का नाम नहीं। ‘अभिषिक्त जन’ शब्दार्थ और ऐतिहासिक अस्पष्टता दोनों को सुरक्षित रखता है; प्रसंग में यह संभवतः शमूएल के समय के यहोवा-अभिषिक्त शासक को दर्शाता है।
- issue: העיד के साथ यहोवा और अभिषिक्त जन की भूमिका
  choice: उनके सामने गवाही दी
  alternative: उन्हें साक्षी ठहराया
  rationale: क्रिया दोनों अर्थ-छायाएँ ग्रहण कर सकती है। मुख्य पाठ में गवाही देने वाला अर्थ चुना गया है, पर ऐसा कोई अतिरिक्त कथन नहीं जोड़ा गया कि गवाही की विषयवस्तु क्या थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बिछौना’ मूल के ठोस अर्थ को सुरक्षित रखता है, और ‘अभिषिक्त जन’ ऐतिहासिक तथा धर्मवैज्ञानिक तनाव को बिना समयपूर्व समाधान के प्रस्तुत करता है।
