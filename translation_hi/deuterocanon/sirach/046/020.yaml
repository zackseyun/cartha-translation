  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: hi
  text: और सभी जीवित लोगों की दृष्टि में—यहाँ तक कि उसकी मृत्यु के बाद भी उसे खोजा गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में इसका विस्तृत रूप है: “उसके सो जाने के बाद उसने भविष्यवाणी की और राजा को उसके अंत के विषय में बताया; उसने भविष्यवाणी में धरती से अपनी आवाज़ उठाई, लोगों की अधर्मता मिटाने के लिए।” इससे संभवतः स्पष्ट होता है कि इब्रानी में “उसे खोजा गया” का संकेत मृत्यु के बाद शमूएल से परामर्श किए जाने की ओर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני
  choice: और ... की दृष्टि में
  rationale: इब्रानी मुहावरे का सार्वजनिक मान-सम्मान या मूल्यांकन से जुड़ा भाव बनाए रखता है; पद के आरम्भ का संयोजक ו भी सुरक्षित है।
- source_word: כל חי
  choice: सभी जीवित लोगों
  rationale: शाब्दिक अर्थ व्यापक है, पर प्रसंग में मनुष्यों की ओर संकेत है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וגם
  choice: यहाँ तक कि ... भी
  rationale: 'संयोजन के साथ आने वाले चरम बल को व्यक्त करता है: मृत्यु के बाद भी।'
- source_word: אחרי מותו
  choice: उसकी मृत्यु के बाद
  rationale: मूल कालवाचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: נדרש
  choice: उसे खोजा गया
  rationale: דרש के निफ़अल रूप में ‘खोजा जाना’ और ‘परामर्श के लिए पूछा जाना’ दोनों की संभावना है। मुख्य पाठ में ‘खोजा गया’ मूल की संक्षिप्तता और कुछ अस्पष्टता बनाए रखता है; यूनानी समानांतर से मिलने वाला विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: शमूएल की मृत्यु के बाद हुई गतिविधि को कितना स्पष्ट किया जाए
  choice: इब्रानी के संक्षिप्त कथन ‘उसकी मृत्यु के बाद भी उसे खोजा गया’ को मुख्य पाठ में रखना
  alternative: यूनानी के अनुसार स्पष्ट रूप से कहना कि सो जाने के बाद उसने भविष्यवाणी की, राजा को उसका अंत बताया और धरती से अपनी आवाज़ उठाई
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी परंपरा कथन का अर्थ विस्तार से बताती है, पर उन विवरणों को मुख्य पाठ में जोड़ना इब्रानी साक्ष्य से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल बाइबलीय गद्य। आरम्भिक ‘और’ को इसलिए रखा गया है कि उपलब्ध इब्रानी पाठ स्वयं पिछले कथन से जुड़ा हुआ खंड प्रतीत होता है।
