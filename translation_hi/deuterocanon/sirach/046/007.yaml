base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: hi
  text: और[a] उसने, क्योंकि वह परमेश्वर का पूरी रीति से अनुसरण करता रहा, मूसा के दिनों में निष्ठा दिखाई[b]; वह और यपुन्ने का पुत्र कालेब सभा के विद्रोह के विरुद्ध दृढ़ खड़े हुए, ताकि लोगों को पाप से रोकें और दुष्ट बड़बड़ाहट को दबाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ का अंतिम पदबंध संक्षिप्त और कुछ अनिश्चित है: ‘सभा के विद्रोह में दृढ़ खड़े होना।’ यूनानी पाठ अधिक विस्तार से कहता है: ‘शत्रु के विरुद्ध खड़े होना, लोगों को पाप से रोकना और दुष्ट बड़बड़ाहट को दबाना।’'
    reason: textual_variant
  - marker: b
    text: या, ‘दया दिखाई।’ इब्रानी और यूनानी शब्दों में ‘दया’ का अर्थ भी हो सकता है, पर यहाँ प्रसंग विश्वासयोग्य, निष्ठावान कार्य का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מלא אחרי אל
  choice: पूरी तरह परमेश्वर के पीछे चला
  rationale: इब्रानी मुहावरे में पूरे मन से अनुसरण करने का भाव है। यह रूप उसके चित्रात्मक स्वर और यहोशू-कालेब की बाइबलीय विशेषता दोनों को बनाए रखता है।
- source_word: עשה חסד
  choice: निष्ठा दिखाई
  rationale: חסד और यूनानी ἔλεος में दया का अर्थ संभव है, पर यहाँ मूसा के समय विश्वासयोग्य और वफादार आचरण का प्रसंग है; इसलिए ‘निष्ठा’ अधिक उपयुक्त है।
- source_word: להתיצב
  choice: दृढ़ खड़े होकर
  rationale: यह क्रिया केवल खड़े होने के बजाय विरोध के सामने अटल रहने और निर्णायक पक्ष लेने का भाव देती है।
- source_word: בפרע קהל
  choice: सभा के विद्रोह के विरुद्ध
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अनिश्चित है। ‘सभा के विद्रोह के विरुद्ध’ सामुदायिक अव्यवस्था या विद्रोह के सामने प्रतिरोध का संभावित अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κωλῦσαι λαὸν ἀπὸ ἁμαρτίας
  choice: लोगों को पाप से रोकने
  rationale: यह यूनानी समानांतर में सुरक्षित उद्देश्य-वाक्य है और सरल, सीधा अनुवाद प्रस्तुत करता है।
- source_word: κοπάσαι γογγυσμὸν πονηρίας
  choice: दुष्ट कुड़कुड़ाहट को शांत करने
  rationale: ‘कुड़कुड़ाहट’ जंगल में लोगों की शिकायत और बड़बड़ाहट की पृष्ठभूमि को स्वाभाविक हिन्दी में व्यक्त करती है; ‘दुष्ट’ मूल की नैतिक विशेषता बनाए रखता है।
theological_decisions:
- issue: संक्षिप्त इब्रानी पाठ के साथ विस्तृत यूनानी समानांतर का उपयोग
  choice: इब्रानी को मुख्य आधार रखते हुए यूनानी में सुरक्षित दोनों उद्देश्य-वाक्य मुख्य पाठ में सम्मिलित किए गए हैं।
  alternative: 'केवल उपलब्ध इब्रानी पर आधारित छोटा पाठ: ‘और क्योंकि वह पूरी तरह परमेश्वर के पीछे चला, उसने मूसा के दिनों में निष्ठा दिखाई—उसने और यपुन्ने के पुत्र कालेब ने—जब सभा विद्रोह कर उठी तब दृढ़ खड़े होकर।’'
  rationale: इब्रानी साक्ष्य यहाँ संक्षिप्त और ‘minor_mismatch’ के रूप में चिह्नित है, जबकि यूनानी संभवतः अधिक पूर्ण पाठ सुरक्षित रखता है। पादटिप्पणी इस पाठगत स्थिति को पारदर्शी बनाती है।
- issue: חסד / ἔλεος का अर्थ
  choice: निष्ठा दिखाई
  alternative: दया दिखाई
  rationale: दोनों मूल शब्द दया का अर्थ दे सकते हैं, किंतु यहाँ यहोशू और कालेब के विश्वासयोग्य आचरण पर बल है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर अपनाया गया है। ‘परमेश्वर के पीछे चला’ मूल इब्रानी मुहावरे की छवि बचाता है। मुख्य पाठ में [a] और अर्थ-विकल्प के लिए अपेक्षित [b] दोनों चिह्न होने चाहिए; इसलिए प्रकाशित पाठ में ‘निष्ठा दिखाई[b]’ पढ़ा जाए।
