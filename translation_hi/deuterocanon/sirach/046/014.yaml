  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
translation:
  language: hi
  text: याहवे की आज्ञा से उसने सभा को आदेश दिया[a], और याकूब के परमेश्वर ने उसकी सुधि ली[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त इब्रानी पाठ में है, ‘उसने सभा को आदेश दिया’; यूनानी समानांतर में है, ‘उसने सभा का न्याय किया।’
    reason: alternative_reading
  - marker: b
    text: इब्रानी में क्रिया का कर्म स्पष्ट नहीं है; इसका अनुवाद ‘याकूब की सुधि ली’ या ‘याकूब पर ध्यान दिया’ भी हो सकता है। यूनानी समानांतर में ‘प्रभु ने याकूब की सुधि ली’ है।
    reason: lexical_and_textual_ambiguity
lexical_decisions:
- source_word: במצות יהוה
  choice: याहवे की आज्ञा से
  rationale: ב को यहाँ साधन अथवा मानक बताने वाला मानकर स्वाभाविक हिन्दी में ‘की आज्ञा से’ किया गया है; יהוה को व्यक्तिवाचक दिव्य नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: צוה
  choice: आदेश दिया
  rationale: प्राप्त इब्रानी पाठ में צוה का सामान्य अर्थ ‘आज्ञा देना/आदेश देना’ है। यूनानी समानांतर के ‘न्याय किया’ को पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עדה
  choice: सभा
  rationale: עדה इकट्ठे हुए समुदाय को दर्शाता है; ‘सभा’ आधुनिक, संक्षिप्त और प्रसंगानुकूल है।
- source_word: ויפקד
  choice: सुधि ली
  rationale: פקד का अर्थ ध्यान देना, खोज-खबर लेना या किसी के पक्ष में हस्तक्षेप करना हो सकता है। ‘सुधि ली’ अनुकूल भाव को बनाए रखते हुए किसी विशेष प्रकार के हस्तक्षेप को निश्चित नहीं करती।
- source_word: אלהי יעקב
  choice: याकूब के परमेश्वर
  rationale: यह प्रचलित दिव्य उपाधि है और इसे सीधे रूप में अनूदित किया गया है।
theological_decisions:
- issue: इब्रानी צוה और यूनानी ἔκρινεν के बीच पाठगत अंतर
  choice: मुख्य पाठ में ‘सभा को आदेश दिया’
  alternative: ‘सभा का न्याय किया’
  rationale: विश्वसनीय और उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है। फिर भी यूनानी पाठ शमूएल की न्यायी भूमिका के प्रसंग में सार्थक है, इसलिए उसे पादटिप्पणी में स्पष्ट रूप से रखा गया है।
- issue: ויפקד का अनिर्दिष्ट कर्म
  choice: प्रसंग के आधार पर ‘उसकी सुधि ली’
  alternative: ‘याकूब की सुधि ली’ अथवा बिना स्पष्ट कर्म के ‘सुधि ली’
  rationale: इब्रानी क्रिया के साथ स्पष्ट कर्म नहीं है, जबकि यूनानी समानांतर ‘याकूब’ को कर्म बनाता है। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए शमूएल की ओर संकेत करता ‘उसकी’ जोड़ा गया है, और पाठगत अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘आदेश दिया’ इब्रानी पाठ की औपचारिक निकटता बनाए रखता है, जबकि ‘सुधि ली’ פקד की व्यापक और अनुकूल अर्थ-छाया को सहज हिन्दी में व्यक्त करता है।
