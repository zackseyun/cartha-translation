base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/015.yaml
  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: hi
  text: उसके मुँह की विश्वसनीयता के कारण द्रष्टा के रूप में उससे परामर्श किया गया[a][b], और अपने वचन के द्वारा वह विश्वासयोग्य चरवाहा सिद्ध हुआ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मुँह की विश्वासयोग्यता में”; इब्रानी पद उसकी वाणी की भरोसेमंदी की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “द्रष्टा” के स्थान पर “भविष्यद्वक्ता” है।
    reason: alternative_reading
  - marker: c
    text: दूसरी पंक्ति का इब्रानी वाक्य-विन्यास संक्षिप्त है; इसका अर्थ यह भी हो सकता है कि अपने वचन के कारण वह विश्वासयोग्य चरवाहे के रूप में पहचाना गया।
    reason: textual_variant
lexical_decisions:
- source_word: באמונת פיו
  choice: उसके मुँह की विश्वसनीयता के कारण
  rationale: אֱמוּנָה यहाँ आंतरिक विश्वास से अधिक वाणी की विश्वसनीयता और भरोसेमंदी बताता है। ‘मुँह’ को रखकर इब्रानी मुहावरा और अगली पंक्ति के ‘वचन’ के साथ समानांतरता सुरक्षित रहती है।
- source_word: דרוש
  choice: उससे परामर्श किया गया
  rationale: דרש का यह रूप किसी व्यक्ति से पूछने, उसकी खोज करने या उससे परामर्श लेने का भाव देता है। प्रसंग में ‘परामर्श किया गया’ स्वाभाविक हिंदी है और शमूएल की द्रष्टा की भूमिका स्पष्ट करता है।
- source_word: חזה
  choice: द्रष्टा
  rationale: इब्रानी पद विशिष्ट रूप से दर्शन देखने वाले ‘seer’ को सूचित करता है; यूनानी का ‘भविष्यद्वक्ता’ व्यापक व्याख्यात्मक समतुल्य है।
- source_word: בדברו
  choice: अपने वचन के द्वारा
  rationale: ב उपसर्ग को साधनवाचक रूप में समझना यहाँ स्वाभाविक है। ‘वचन’ पहली पंक्ति के ‘मुँह’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: נאמן
  choice: विश्वासयोग्य ... सिद्ध हुआ
  rationale: נאמן का अर्थ विश्वासयोग्य या भरोसेमंद है। संक्षिप्त इब्रानी वाक्य-विन्यास में ‘सिद्ध हुआ’ निहित पहचान/प्रमाणित होने का भाव स्वाभाविक रूप से व्यक्त करता है और यूनानी समानांतर से भी पुष्ट होता है।
- source_word: רועה
  choice: चरवाहा
  rationale: मूल रूपक को अक्षुण्ण रखा गया है; यहाँ नेतृत्व का अर्थ निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट करके अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: אמונה का अर्थ
  choice: विश्वसनीयता
  alternative: विश्वास; विश्वासयोग्यता
  rationale: ‘उसके मुँह’ के साथ यह उसकी वाणी की भरोसेमंदी का गुण अधिक स्वाभाविक रूप से दर्शाता है, न कि केवल उसका आंतरिक विश्वास।
- issue: חזה और यूनानी προφήτης
  choice: द्रष्टा
  alternative: भविष्यद्वक्ता
  rationale: उपलब्ध इब्रानी साक्ष्य को प्राथमिकता देते हुए अधिक विशिष्ट पद मुख्य पाठ में रखा गया है; यूनानी पाठांतर पादटिप्पणी में सुरक्षित है।
- issue: दूसरी पंक्ति का संक्षिप्त वाक्य-विन्यास
  choice: वह विश्वासयोग्य चरवाहा सिद्ध हुआ
  alternative: एक विश्वासयोग्य चरवाहा जाना गया; चरवाहा विश्वासयोग्य था
  rationale: इब्रानी में क्रिया/सम्बन्ध संक्षिप्त है। चुना हुआ पाठ अर्थ को पठनीय बनाता है, जबकि पादटिप्पणी वास्तविक अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। ‘द्रष्टा’, ‘वचन’ और ‘चरवाहा’ मूल के विशिष्ट धार्मिक-काव्यात्मक पदों और रूपक को बनाए रखते हैं; अस्वाभाविक शाब्दिकता से बचने के लिए דרוש को ‘परामर्श किया गया’ और נאמן को ‘सिद्ध हुआ’ के साथ व्यक्त किया गया है।
