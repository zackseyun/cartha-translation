base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: hi
  text: “मैंने किससे छुड़ौती और कोई छिपी हुई वस्तु ली है?”[a] और किसी ने उसके विरुद्ध उत्तर नहीं दिया।[b] अपने अंत के समय तक भी वह याहवे की दृष्टि में विश्वासयोग्य पाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ अत्यंत संक्षिप्त है। כפר का अर्थ ‘छुड़ौती’ या ‘प्रतिपूर्ति की रकम’ है, पर इस न्यायिक संदर्भ में इसे ‘रिश्वत’ भी समझा जा सकता है। ‘छिपी हुई वस्तु’ के लिए प्रयुक्त शब्द का निर्माण भी संक्षिप्त और कुछ अस्पष्ट है। यूनानी साक्षी अधिक सामान्य रूप से कहता है, “मैंने किसी मनुष्य से धन—जूते तक—नहीं लिया।”
    reason: वैकल्पिक पाठ और अर्थगत अस्पष्टता
  - marker: b
    text: “उसके विरुद्ध उत्तर नहीं दिया” का अर्थ “उस पर किसी ने आरोप नहीं लगाया” या “उसके विरुद्ध कोई गवाही नहीं दी” भी हो सकता है।
    reason: न्यायिक अर्थ की वैकल्पिक व्याख्या
lexical_decisions:
- source_word: וגם עד עת קצו
  choice: अपने अंत के समय तक भी
  rationale: यह इब्रानी पदबंध का स्वाभाविक और निकट अनुवाद है; यूनानी का ‘अनन्त निद्रा के समय से पहले’ वाला विस्तृत पाठ मुख्य पाठ में नहीं अपनाया गया।
- source_word: נכון נמצא
  choice: विश्वासयोग्य पाया गया
  rationale: נכון में दृढ़, स्थिर और भरोसेमंद होने का भाव है। शमूएल की सत्यनिष्ठा के संदर्भ में ‘विश्वासयोग्य’ नैतिक विश्वसनीयता को सहज हिन्दी में व्यक्त करता है।
- source_word: בעיני יהוה
  choice: याहवे की दृष्टि में
  rationale: इब्रानी मुहावरे को स्वाभाविक हिन्दी में रखते हुए יהוה के व्यक्तिगत वाचा-नाम को ‘याहवे’ लिखा गया है।
- source_word: כפר
  choice: रिश्वत
  rationale: כפר का मूल अर्थ प्रतिपूर्ति अथवा छुड़ौती की रकम हो सकता है, पर शमूएल की न्यायिक सत्यनिष्ठा और अनुचित लाभ के संदर्भ में ‘रिश्वत’ सर्वाधिक स्वाभाविक है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ונעלם
  choice: और उसे छिपाया
  rationale: क्रिया में छिपाने या बात दबाने का भाव है; ‘उसे छिपाया’ इब्रानी की संक्षिप्तता बनाए रखता है।
- source_word: ממי לקחתי
  choice: मैंने किससे ... ली
  rationale: प्रश्नवाचक कथन को हिन्दी में स्वाभाविक क्रम दिया गया है और पूर्ववर्ती כפר को कर्म के रूप में स्पष्ट रखा गया है।
- source_word: וכל אדם לא ענה בו
  choice: और कोई भी उसके विरुद्ध उत्तर न दे सका
  rationale: ענה בו को शाब्दिक ‘उसके विरुद्ध उत्तर देना’ के निकट रखा गया है; प्रसंग में इसका अर्थ आरोप लगाना या गवाही देना भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है; उसका नामरूप बनाए रखने के लिए ‘याहवे’ चुना गया है।
- issue: शमूएल के कथन और उसकी सत्यनिष्ठा का संबंध
  choice: उसके प्रश्न को उसकी सत्यनिष्ठा की गवाही के रूप में प्रस्तुत किया गया, बिना अतिरिक्त धर्मसैद्धांतिक विस्तार के
  alternative: इसे स्पष्ट कानूनी आत्म-पक्षसमर्थन बनाना या यूनानी पाठ के अनुसार सामान्य धन और जूतियों तक विस्तार देना
  rationale: पद शमूएल की विश्वसनीयता को अनुचित लाभ न लेने के उसके दावे से जोड़ता है; अनुवाद इस संबंध को रखता है, पर मूल से आगे कोई सिद्धांत नहीं जोड़ता।
- issue: खण्डों का क्रम
  choice: अंत तक विश्वासयोग्य पाए जाने का कथन पहले, फिर उद्धृत प्रश्न
  alternative: पांडुलिपि में दिखाई देने वाले सतही क्रम के अनुसार प्रश्न पहले रखना
  rationale: उपलब्ध इब्रानी प्रस्तुति में पद-संख्या खण्डों के बीच आती है और स्रोत में मामूली असंगति दर्ज है। अर्थगत एकता तथा समानांतर साक्ष्य के अनुरूप वह क्रम रखा गया है जिसमें अंतिम समय तक की गवाही के बाद शमूएल का कथन आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘विश्वासयोग्य’, ‘दृष्टि में’ और ‘उत्तर न दे सका’ जैसे पद मूल इब्रानी के स्वरूप के निकट हैं, जबकि वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
