base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/012.yaml
  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: hi
  text: उनकी हड्डियाँ सोसन के फूल के समान खिलें[a][b], और उनका नाम उनके पुत्रों में नया हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “सोसन के समान।” इस फूल को कभी-कभी अधिक सामान्य रूप से “फूल” या “गुलाब” भी कहा गया है, पर “सोसन” अधिक संभावित अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी समानांतर में “उनके स्थान से” शब्द “उनकी हड्डियाँ खिलें” के बाद आते हैं; उपलब्ध इब्रानी पाठ में ये शब्द नहीं हैं।
    reason: alternative_reading
  - marker: c
    text: या, “उनका नाम उनके पुत्रों के द्वारा आगे चलता रहे।” इब्रानी क्रिया नवीकरण या उत्तराधिकार—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה
  choice: खिलें
  rationale: פרח का मूल अर्थ कली फूटना या फूल खिलना है। ‘खिलें’ वनस्पति-संबंधी सजीव बिंब को बनाए रखता है और प्रसंग की कामनासूचक अभिव्यक्ति के अनुरूप है।
- source_word: עצמותם
  choice: उनकी हड्डियाँ
  rationale: इब्रानी का ठोस और शाब्दिक अर्थ ‘उनकी हड्डियाँ’ है; इसे सामान्य ‘अवशेष’ बनाकर नरम नहीं किया गया। यूनानी समानांतर भी यही अर्थ देता है।
- source_word: כשושנה
  choice: सोसन के फूल के समान
  rationale: שושנה के लिए ‘सोसन’ सबसे संभावित पुष्पार्थ है। ‘फूल’ जोड़ने से आधुनिक हिन्दी के सामान्य पाठक के लिए अपेक्षाकृत अपरिचित नाम स्पष्ट होता है, जबकि मूल उपमा बनी रहती है।
- source_word: ושמם
  choice: और उनका नाम
  rationale: ‘नाम’ इब्रानी मुहावरे की स्मृति और प्रतिष्ठा—दोनों संभावनाएँ सुरक्षित रखता है; इसलिए इसे केवल ‘यश’ या ‘कीर्ति’ नहीं बनाया गया।
- source_word: תחליף
  choice: नया होता रहे
  rationale: חלף यहाँ नवीकरण, उत्तराधिकार या आगे चलते रहने का भाव दे सकता है। यह चयन नाम के अगली पीढ़ी में जीवित रहने का अर्थ व्यक्त करता है, पर क्रिया की बहुअर्थकता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לבניהם
  choice: उनके पुत्रों में
  rationale: בניהם स्पष्ट रूप से ‘उनके पुत्रों’ कहता है। ‘में’ उस इब्रानी भाव को सहज हिन्दी में रखता है जिसमें पूर्वजों का नाम वंशजों में बना रहता है।
theological_decisions:
- issue: वंशजों के लिए लिंग-विशिष्ट शब्द
  choice: पुत्रों
  alternative: संतानों / वंशजों
  rationale: इब्रानी में पुल्लिंग बहुवचन ‘पुत्र’ स्पष्ट है। पाठ को व्यापक बनाकर स्रोत की विशिष्टता मिटाने के बजाय इसे बनाए रखा गया है।
- issue: हड्डियों के खिलने का बिंब
  choice: उनकी हड्डियाँ सोसन के फूल के समान खिलें
  alternative: उनकी हड्डियाँ अपने स्थान से सोसन के समान खिलें
  rationale: उपलब्ध इब्रानी में पुष्प-बिंब है, पर ‘अपने स्थान से’ नहीं है; वह यूनानी समानांतर में मिलता है। इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया और इस पंक्ति को शारीरिक पुनरुत्थान की निश्चित शिक्षा के रूप में भी नहीं खोला गया।
- issue: नाम का पुत्रों में नवीकरण
  choice: उनका नाम उनके पुत्रों में नया होता रहे
  alternative: उनका नाम उनके पुत्रों के द्वारा आगे चलता रहे
  rationale: मुख्य पाठ में नवीकरण का बिंब रखा गया है, जबकि उत्तराधिकार या नाम के आगे चलने का संभव अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सोसन’ अपेक्षाकृत साहित्यिक पुष्पनाम है, इसलिए मुख्य पाठ में ‘के फूल’ और पादटिप्पणी में उसका स्पष्टीकरण दिया गया है। कामनासूचक ‘खिलें’ और निरंतरता-सूचक ‘नया होता रहे’ पद्यात्मक समानता तथा स्मृति के भाव को बनाए रखते हैं।
