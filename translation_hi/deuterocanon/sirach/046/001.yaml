base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: hi
  text: नून का पुत्र यहोशू पराक्रमी योद्धा था, भविष्यवाणी में मूसा का सेवक[a]; वह अपने समय में उसके चुने हुओं के लिए महान उद्धार[b] होने के लिए गढ़ा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “भविष्यवाणियों में मूसा का उत्तराधिकारी”; वह उपलब्ध हिब्रू की अपेक्षा यहोशू के उत्तराधिकार-संबंध को अधिक स्पष्ट करता है।
    reason: alternative_reading
  - marker: b
    text: “महान उद्धार” का अनुवाद “महान छुटकारा” या “महान विजय” भी हो सकता है; हिब्रू תשועה और यूनानी σωτηρία सैनिक विजय तथा व्यापक बचाव—दोनों अर्थ रख सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: पराक्रमी योद्धा
  rationale: हिब्रू पदबंध वीरता और युद्ध-सामर्थ्य दोनों व्यक्त करता है; यूनानी समानांतर भी युद्ध का अर्थ स्पष्ट करता है।
- source_word: משרת משה
  choice: मूसा का सेवक
  rationale: משרת किसी आधिकारिक सहायक या परिचारक को सूचित करता है। ‘सेवक’ सहज हिन्दी है और यहाँ किसी बाद की कलीसियाई पदवी का संकेत नहीं देता।
- source_word: בנבואה
  choice: भविष्यवाणी में
  rationale: हिब्रू अभिव्यक्ति संक्षिप्त और कुछ असामान्य है। शाब्दिक रूप बनाए रखने से यह अनिर्णीत रहता है कि आशय भविष्यवाणी के क्षेत्र, कार्य या पद से है।
- source_word: אשר נוצר
  choice: गढ़ा गया था
  rationale: निष्क्रिय हिब्रू रूप का मूल अर्थ ‘रचा/गढ़ा गया’ है और इसमें किसी उद्देश्य के लिए तैयार किए जाने का भाव हो सकता है; इसे केवल ‘नियुक्त’ कहना अर्थ को अधिक निश्चित कर देता।
- source_word: להיות בימיו
  choice: अपने दिनों में ... बनने को
  rationale: यह रूप काल-संबंधी तत्व को सुरक्षित रखते हुए हिन्दी में उद्देश्यसूचक वाक्य-विन्यास देता है।
- source_word: תשועה גדולה
  choice: महान उद्धार
  rationale: תשועה बचाव, विजय और व्यापक उद्धार का बोध करा सकता है। ‘उद्धार’ इसकी व्यापकता बनाए रखता है, जबकि पादटिप्पणी सैनिक संदर्भ बताती है।
- source_word: לבחיריו
  choice: उसके चुने हुओं के लिए
  rationale: सर्वनाम का संदर्भ संभवतः परमेश्वर है, पर निकट संदर्भ में व्याकरणिक अस्पष्टता बनी रहती है। ‘उसके’ उस अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: भविष्यवाणी के संबंध में यहोशू और मूसा का रिश्ता
  choice: मुख्य पाठ में ‘भविष्यवाणी में मूसा का सेवक’
  alternative: ‘भविष्यवाणियों में मूसा का उत्तराधिकारी’
  rationale: यूनानी पाठ उत्तराधिकार को स्पष्ट करता है, किंतु उपलब्ध हिब्रू משרת משה בנבואה कहता है। इसलिए मुख्य पाठ हिब्रू की संक्षिप्त और खुली अभिव्यक्ति को बनाए रखता है।
- issue: תשועה का अर्थ-क्षेत्र
  choice: ‘उद्धार’
  alternative: ‘छुटकारा’ या ‘विजय’
  rationale: सैनिक प्रसंग के बावजूद हिब्रू और यूनानी दोनों शब्द युद्ध-विजय से व्यापक अर्थ रख सकते हैं; ‘उद्धार’ इस अर्थगत तनाव को सुरक्षित रखता है।
- issue: נוצר में दैवी तैयारी या नियुक्ति
  choice: ‘गढ़ा गया था’
  alternative: ‘नियुक्त किया गया था’
  rationale: हिब्रू का रूप निर्माण या उद्देश्यपूर्ण तैयारी का संकेत देता है। ‘नियुक्त’ अधिक सहज है, पर स्रोत के रूपक को अनावश्यक रूप से प्रशासनिक बना देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गढ़ा गया था’ कुछ औपचारिक है, पर यह हिब्रू נוצר की निर्माण-विषयक छवि को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
