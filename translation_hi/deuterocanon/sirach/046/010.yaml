  yaml_path: translation/deuterocanon/sirach/046/010.yaml
  text: so that all the offspring of Jacob may know that it is good to fully follow Yahweh[a][b].
translation:
  language: hi
  text: ताकि याकूब के सभी वंशज[a] जानें कि पूरी तरह याहवे के पीछे चलना भला है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में “याकूब के सभी वंशज” के स्थान पर “इस्राएल के सभी पुत्र” है।
    reason: alternative_reading
  - marker: b
    text: “पूरी तरह पीछे चलना” वाला इब्रानी प्रयोग कुछ असामान्य है; यूनानी समानांतर “प्रभु के पीछे जाना/चलना” अर्थ का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  choice: ताकि ... जानें
  rationale: למען उद्देश्य या परिणाम प्रकट करता है और דעת यहाँ ‘जानना’ के अर्थ में है; यह हिन्दी में स्वाभाविक रूप से प्रयोजनवाचक उपवाक्य बनाता है।
- source_word: כל זרע יעקב
  choice: याकूब के सभी वंशज
  rationale: זרע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ सामूहिक रूप से वंशज अभिप्रेत हैं। ‘याकूब’ को प्राथमिक इब्रानी साक्ष्य के अनुसार रखा गया है।
- source_word: כי טוב
  choice: कि ... भला है
  rationale: यह उस ज्ञान की विषय-वस्तु बताता है जिसे याकूब के वंशज जानें। ‘भला है’ नैतिक और मूल्यांकनात्मक भाव को संक्षेप में बनाए रखता है।
- source_word: למלא אחרי
  choice: के पीछे पूरी तरह चलना
  rationale: מלא पूर्णता का भाव देता है और אחרי पीछे चलने का। असामान्य इब्रानी प्रयोग तथा यूनानी समानांतर, दोनों को ध्यान में रखकर दिशा और पूर्ण समर्पण के रूपक को बिना अमूर्त व्याख्या में बदलकर रखा गया है।
- source_word: יהוה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: इब्रानी ‘याकूब के सभी वंशज’ और यूनानी ‘इस्राएल के सभी पुत्र’ में पाठांतर
  choice: याकूब के सभी वंशज
  alternative: इस्राएल के सभी पुत्र
  rationale: इस पद के उपलब्ध प्राथमिक इब्रानी साक्ष्य को मुख्य पाठ में अपनाया गया है; अर्थपूर्ण यूनानी पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: למלא אחרי में आज्ञाकारिता/अनुसरण का कठिन मुहावरा
  choice: याहवे के पीछे पूरी तरह चलना
  alternative: प्रभु के पीछे चलना; याहवे का पूरी निष्ठा से अनुसरण करना
  rationale: यह रूप इब्रानी के ‘पूर्णता’ और ‘पीछे’ दोनों घटकों को बनाए रखता है। यूनानी समानांतर भी ‘प्रभु के पीछे जाना/चलना’ अर्थ का समर्थन करता है; इसलिए इसे केवल ‘आज्ञापालन करना’ कहकर रूपक को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘वंशज’ सामूहिक पारिवारिक अर्थ को स्पष्ट करता है, और ‘पीछे पूरी तरह चलना’ मूल रूपक तथा उसकी कुछ असामान्यता दोनों को सुरक्षित रखता है।
