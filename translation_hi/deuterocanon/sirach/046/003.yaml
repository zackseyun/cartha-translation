base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/003.yaml
  text: Who could stand before him? For he fought the wars of Yahweh[a].
translation:
  language: hi
  text: उसके सामने कौन ठहर सकता था? क्योंकि उसने याहवे के युद्धों को लड़ा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ भिन्न है: लगभग, “उससे पहले कौन इस प्रकार खड़ा हुआ? क्योंकि प्रभु ने स्वयं शत्रुओं को उसके विरुद्ध चढ़ा लाया।” मुख्य पाठ इब्रानी साक्ष्य का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא
  choice: कौन
  rationale: यह आलंकारिक प्रश्न है। हिन्दी में केवल ‘कौन’ कहना स्वाभाविक है और इब्रानी की प्रश्नात्मक शक्ति बनाए रखता है।
- source_word: לפניו יתיצב
  choice: उसके सामने टिक सकता था
  rationale: शाब्दिक अर्थ ‘उसके सामने खड़ा होता’ है, पर प्रसंग में इसका भाव किसी का सामना करने या उसके विरुद्ध टिकने की सामर्थ्य है। सम्भावनार्थक हिन्दी आलंकारिक प्रश्न को स्पष्ट करती है।
- source_word: כי
  choice: क्योंकि
  rationale: यह पहले प्रश्न का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מלחמות
  choice: युद्ध
  rationale: बहुवचन संज्ञा व्यापक युद्धों को सूचित करती है; ‘लड़ाइयाँ’ सम्भव है, पर ‘युद्ध’ अधिक गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: יהוה
  choice: याहवे
  rationale: मूल इब्रानी में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण इसे सामान्य उपाधि ‘प्रभु’ में बदलने से बचाता है।
- source_word: נלחם
  choice: उसने … लड़े
  rationale: पूर्ण क्रिया का सीधा भूतकालीन अनुवाद है और युद्ध करने की क्रिया को बिना विस्तार के बनाए रखता है।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ इब्रानी पाठ में चार अक्षरों वाला दिव्य नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और नाम तथा उपाधि के बीच भेद बनाए रखता है।
- issue: युद्धों का कर्ता
  choice: ‘उसने’ का संकेत यहोशू की ओर रखा गया है
  alternative: स्वयं याहवे को युद्ध करने वाला समझना
  rationale: इब्रानी वाक्य की निकटतम और प्रसंगानुकूल रचना में पुरुषवाचक कर्ता यहोशू है, जो याहवे के युद्ध लड़ता है। यूनानी समानांतर में वाक्य अलग है और याहवे द्वारा शत्रुओं को लाने की बात आती है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘टिक सकता था’ इब्रानी मुहावरे का विरोध में दृढ़ खड़े रहने वाला भाव व्यक्त करता है; यूनानी पाठ का उल्लेख केवल पाठांतर के रूप में पादटिप्पणी में है।
