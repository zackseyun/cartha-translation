base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
translation:
  language: hi
  text: उसने शत्रु राष्ट्र पर विनाश दे मारा, और जब वे भाग रहे थे, तब उसने उन सबका नाश कर दिया, ताकि हर राष्ट्र हेरम[a] को पहचान ले, क्योंकि यहोवा उनके युद्ध पर निगाह रखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू शब्द חרם (हेरम) ऐसी वस्तु या जनता के लिए प्रयुक्त होता है जिसे ईश्वरीय न्याय के अधीन विनाश के लिए समर्पित कर दिया गया हो। अन्य सम्भव अनुवाद: “ताकि हर राष्ट्र उनके पूर्ण विनाश को जान ले।”'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ उल्लेखनीय रूप से भिन्न है: उसमें एक राष्ट्र पर युद्ध लाने और “विरोध करनेवालों” को नष्ट करने की बात है; वह यह भी कहता है कि उसका युद्ध प्रभु के सामने था और वह सामर्थी के पीछे चलता रहा।'
    reason: alternative_reading
lexical_decisions:
- source_word: השליך
  choice: दे मारा
  rationale: क्रिया के बलपूर्वक फेंकने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; कर्म के रूप में निहित विनाश को प्रसंग से स्पष्ट किया गया है।
- source_word: גוי אויב
  choice: शत्रु जाति
  rationale: सामूहिक और राष्ट्रीय अर्थ को बनाए रखता है तथा आधुनिक हिन्दी में संक्षिप्त है।
- source_word: ובנוסם
  choice: जब वे भाग रहे थे
  rationale: भागते समय की परिस्थितिजन्य और कालिक भावना को स्पष्ट रूप से व्यक्त करता है।
- source_word: האביד כולם
  choice: उसने उन सबका नाश कर दिया
  rationale: हिफ़ील रूप के कारण कराने/नष्ट करने का भाव और כולם की सम्पूर्णता दोनों सुरक्षित रहते हैं।
- source_word: חרם
  choice: उनके संहार के लिए अर्पित होने
  rationale: वाचा-युद्ध के इस गहन शब्द में समर्पण और विनाश दोनों जुड़े हैं; हिन्दी वाक्य में अर्थ खोलते हुए इसकी धार्मिक तनावपूर्णता बचाई गई है।
- source_word: כי צופה
  choice: क्योंकि ... दृष्टि रखता है
  rationale: देखने, निगरानी करने और युद्ध पर ध्यान रखने के अर्थों को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יהוה
  choice: यहोवा
  rationale: हिब्रू के व्यक्तिगत दिव्य नाम को सीधे दर्शाता है, न कि उसे सामान्य उपाधि में बदलता है।
- source_word: מלחמתם
  choice: उनके युद्ध
  rationale: बहुवचन प्रत्यय के संदर्भ को अनिर्धारित रखते हुए मूल का 'उनका युद्ध' भाव सुरक्षित रखता है।
theological_decisions:
- issue: संक्षिप्त और कठिन पदबंध חרם का अर्थ
  choice: मुख्य पाठ में “उनके संहार के लिए अर्पित होने” रखा गया है।
  alternative: “उनका पूर्ण विनाश” या तकनीकी रूप से “उनका हेरम”
  rationale: חרם केवल सामान्य विनाश नहीं, बल्कि ईश्वरीय न्याय के अधीन विनाश के लिए अलग किए जाने का वाचा-युद्ध संबंधी भाव रखता है। व्याख्यात्मक फुटनोट इसके विशेष अर्थ को स्पष्ट करता है।
- issue: हिब्रू और यूनानी साक्ष्यों का अंतर
  choice: मुख्य पाठ विद्यमान हिब्रू का अनुसरण करता है और यूनानी पाठांतर फुटनोट में दिया गया है।
  alternative: यूनानी के आधार पर युद्ध लाने, विरोधियों को नष्ट करने और प्रभु के सामने युद्ध होने का अनुवाद
  rationale: जहाँ हिब्रू उपलब्ध है, उसे प्राथमिक साक्ष्य माना गया है; फिर भी यूनानी का उल्लेखनीय भिन्न पाठ पाठक से छिपाया नहीं गया।
- issue: מלחמתם में सर्वनाम का संदर्भ
  choice: “उनके युद्ध” द्वारा अस्पष्टता बनाए रखी गई है।
  alternative: “इस्राएल के युद्ध” या “शत्रुओं के युद्ध”
  rationale: हिब्रू प्रत्यय का संदर्भ इस संक्षिप्त पाठ में पूरी तरह स्पष्ट नहीं है; अनुवाद ने किसी एक पक्ष को मौन रूप से निर्धारित नहीं किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। युद्ध-वर्णन की तीव्रता को औपचारिक “नाश कर दिया” से व्यक्त किया गया है। कठिन धार्मिक पद חרם को पूरी तरह सपाट किए बिना अर्थपूर्ण हिन्दी में खोला गया है; दोनों फुटनोट-चिह्न मुख्य पाठ में उपस्थित हैं।
