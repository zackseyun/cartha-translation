base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: hi
  text: क्योंकि जब उसके शत्रुओं ने उसे चारों ओर से दबाया, तब उसने परमप्रधान परमेश्वर को पुकारा; और परमप्रधान परमेश्वर ने ओलों और बर्फ़ के पत्थरों से उसे उत्तर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ का अर्थ है: “महान प्रभु ने उसकी/उनकी सुन ली—ओलों के पत्थरों और प्रबल सामर्थ्य के साथ।” यहाँ इब्रानी पाठ को प्राथमिकता दी गई है, पर यूनानी पाठ तूफ़ान में परमेश्वर के सामर्थ्यपूर्ण प्रकट होने का अधिक विस्तृत वर्णन देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: को पुकारा
  rationale: यह इब्रानी मुहावरा सहायता के लिए किसी को पुकारने या उसका आह्वान करने का भाव रखता है; यूनानी ἐπεκαλέσατο भी इसका समर्थन करता है।
- source_word: אל עליון
  choice: परमप्रधान परमेश्वर
  rationale: यह स्वाभाविक और गरिमापूर्ण हिन्दी में इब्रानी ईश्वरीय उपाधि का अर्थ व्यक्त करता है। पद में इसकी पुनरावृत्ति दोनों स्थानों पर रखी गई है।
- source_word: כאכפה לו אויביו מסביב
  choice: जब उसके शत्रुओं ने उसे चारों ओर से दबाया
  rationale: दुर्लभ या अनिश्चित क्रियारूप के साथ यूनानी समानांतर चारों ओर से पड़ने वाले शत्रुतापूर्ण दबाव और संकट की ओर संकेत करता है।
- source_word: ויענהו
  choice: उसे उत्तर दिया
  rationale: इब्रानी ענה का सीधा अर्थ यहाँ उत्तर देना है; यूनानी पाठ अनुकूल रीति से सुनने का निकटवर्ती भाव देता है।
- source_word: באבני ברד
  choice: ओलों से
  rationale: ב־ को साधनवाचक समझते हुए तूफ़ानी न्याय के माध्यम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ואَلגביש
  choice: और बर्फ़ के पत्थरों से
  rationale: दुर्लभ אלגביש को ברד से अलग रखते हुए उसकी बर्फ़ीले पत्थरों की छवि बचाई गई है, यद्यपि दोनों शब्द ओलावृष्टि से संबंधित हो सकते हैं।
theological_decisions:
- issue: ईश्वरीय उपाधि की पुनरावृत्ति
  choice: दोनों उपवाक्यों में “परमप्रधान परमेश्वर”
  alternative: दूसरे उपवाक्य में केवल “परमप्रधान”
  rationale: इब्रानी אל עליון को दोहराता है। पुनरावृत्ति से उसी परमेश्वर पर बल पड़ता है जिसे पुकारा गया और जिसने उत्तर दिया; इसे संक्षिप्त करके हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। “बर्फ़ के पत्थर” दुर्लभ इब्रानी शब्द की विशिष्ट छवि को बनाए रखता है; फुटनोट यूनानी पाठ की वास्तविक भिन्नता को बिना मुख्य पाठ में मिलाए दर्ज करता है।
