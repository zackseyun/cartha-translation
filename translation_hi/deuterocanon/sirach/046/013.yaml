base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: hi
  text: अपने लोगों का प्रिय और अपने रचयिता को भानेवाला, अपनी माता के गर्भ से ही माँगा हुआ—शमूएल भविष्यवाणी में याहवे का नाज़ीर था; वह न्याय करता और पुरोहित के रूप में सेवा करता था। परमेश्वर के वचन से उसने राज्य की स्थापना की और लोगों पर शासकों का अभिषेक किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “अपने प्रभु का प्रिय शमूएल, प्रभु का भविष्यद्वक्ता, उसने राज्य की स्थापना की और उसकी प्रजा पर शासकों का अभिषेक किया।” इब्रानी साक्ष्य इसके बजाय उसे “भविष्यवाणी में याहवे का नाज़ीर” कहता है और यह भी जोड़ता है कि वह न्याय करता तथा पुरोहित के रूप में सेवा करता था।'
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  choice: अपने लोगों का प्रिय और अपने रचयिता को भानेवाला
  rationale: इब्रानी पाठ के दो समानांतर विशेषण-वाक्यांशों को स्वाभाविक हिन्दी में रखा गया है। עושהו का आशय ‘उसे बनानेवाला’ है, इसलिए ‘रचयिता’ चुना गया।
- source_word: המשואל מבטן אמו
  choice: अपनी माता के गर्भ से ही माँगा हुआ
  rationale: המשואל में ‘माँगा गया’ का भाव और शमूएल के नाम से जुड़ी शब्द-क्रीड़ा है। ‘गर्भ से ही’ उसके जन्म से पहले माँगे जाने का संकेत सुरक्षित रखता है।
- source_word: נזיר יהוה
  choice: याहवे का नाज़ीर
  rationale: נזיר विशेष रूप से परमेश्वर को समर्पित नाज़ीर को सूचित करता है; सामान्य ‘समर्पित जन’ की अपेक्षा ‘नाज़ीर’ इसका विशिष्ट धार्मिक अर्थ बचाता है। יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिखा गया है।
- source_word: בנבואה
  choice: भविष्यवाणी में
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक अर्थ-संभावनापूर्ण है। ‘भविष्यवाणी में’ उसकी बनावट को सुरक्षित रखता है, जबकि यूनानी समानांतर इसे ‘प्रभु का भविष्यद्वक्ता’ समझता है।
- source_word: שופט ומכהן
  choice: वह न्याय करता और पुरोहित के रूप में सेवा करता था
  rationale: שופט न्यायिक-शासकीय कार्य और מכהן पुरोहितीय सेवा को व्यक्त करता है। क्रियात्मक अनुवाद दोनों भूमिकाओं को केवल पदनाम बना देने से बचाता है।
- source_word: בדבר אל הכין ממלכת
  choice: परमेश्वर के वचन से उसने राजसत्ता स्थापित की
  rationale: בדבר אל दैवी वचन अथवा अधिकार के माध्यम को और הכין स्थापना या दृढ़ीकरण को व्यक्त करता है। ‘राजसत्ता’ यहाँ किसी भौगोलिक राज्य से अधिक राजतंत्रीय व्यवस्था के अर्थ को स्पष्ट करती है।
- source_word: וימשח נגידים על עם
  choice: उसकी प्रजा पर शासकों का अभिषेक किया
  rationale: נגידים राजनीतिक अगुओं या शासकों को दर्शाता है और על עם का स्वाभाविक अर्थ प्रजा पर अधिकार है। ‘उसकी’ को यूनानी समानांतर स्पष्ट रूप से समर्थन देता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल इब्रानी में वाचा का व्यक्तिगत दिव्य नाम יהוה है। ‘याहवे’ उस नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय स्पष्ट रूप से सुरक्षित रखता है।
- issue: नाज़ीर और भविष्यवाणी के बीच संबंध
  choice: भविष्यवाणी में याहवे का नाज़ीर
  alternative: याहवे का भविष्यद्वक्ता
  rationale: मुख्य पाठ इब्रानी נזיר और בנבואה दोनों को बनाए रखता है; यूनानी का सरल ‘प्रभु का भविष्यद्वक्ता’ वैकल्पिक पाठ के रूप में पादटिप्पणी में दिया गया है।
- issue: शमूएल की पुरोहितीय सेवा
  choice: पुरोहित के रूप में सेवा करता था
  alternative: पुरोहित था
  rationale: इब्रानी מכהן गतिविधि या सेवा को व्यक्त करता है। यह अनुवाद पद की प्रकृति के बारे में पाठ से अधिक निश्चित दावा किए बिना पुरोहितीय कार्य को स्वीकार करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नाज़ीर’ तकनीकी धार्मिक शब्द होने के कारण सुरक्षित रखा गया है; वाक्य-विन्यास को हिन्दी में स्पष्ट करने के लिए अर्धविराम लगाया गया है।
