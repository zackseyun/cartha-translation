translation:
  language: hi
  text: महिमा का वैभव और सामर्थ्य की प्रशंसा,[a] आँखों का आनंद और सुंदरता की परिपूर्णता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “सम्मान का गौरव, सामर्थ्य का कार्य, और आँखों को लुभाने वाले सजे हुए आभूषण।” यहाँ हिब्रू पाठ के शब्द उल्लेखनीय रूप से भिन्न हैं, यद्यपि दोनों पाठ महायाजक के आभूषणों का अत्यंत प्रशंसापूर्ण वर्णन करते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: वैभव
  rationale: הוד महिमा, प्रताप या वैभव का बोध कराता है। ‘वैभव’ काव्यात्मक गरिमा बनाए रखता है और अगले כבוד से अर्थगत भेद भी रखता है।
- source_word: כבוד
  choice: महिमा
  rationale: כבוד का सामान्य अर्थ ‘महिमा’ या ‘सम्मान’ है। यहाँ ऊँची काव्यात्मक शैली में ‘महिमा’ स्वाभाविक है।
- source_word: ותהלת עז
  choice: और सामर्थ्य की प्रशंसा
  rationale: תהלה का अर्थ ‘प्रशंसा’ और עז का ‘सामर्थ्य/पराक्रम’ है। यह अनुवाद संक्षिप्त हिब्रू रचना के निकट रहते हुए हिन्दी में बोधगम्य है।
- source_word: מחמד עין
  choice: आँखों का आनंद
  rationale: מחמד किसी मनोहर या वांछनीय वस्तु को दर्शाता है; עין के साथ यह दृश्य आनंद का भाव देता है।
- source_word: ומכלל יופי
  choice: और सुंदरता की परिपूर्णता
  rationale: מכלל यहाँ पूर्णता या चरम रूप का संकेत दे सकता है। ‘सुंदरता की परिपूर्णता’ इस स्तुतिपरक वर्णन को निकटता से व्यक्त करता है।
theological_decisions:
- issue: हिब्रू पाठ और यूनानी समानांतर के उल्लेखनीय शब्दगत अंतर
  choice: मुख्य पाठ में उपलब्ध, सुसंगत हिब्रू साक्ष्य का अनुवाद
  alternative: 'यूनानी से प्रभावित पाठ: ‘सम्मान का गौरव, सामर्थ्य का कार्य, आँखों को लुभाने वाले आभूषण’'
  rationale: सिराख का हिब्रू पाठ यहाँ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी समानांतर समान स्तुतिपरक आशय रखता है, पर शब्दशः भिन्न है; इस अंतर को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और काव्यात्मक शैली रखी गई है। पद की खंडात्मक स्तुतिपरक संरचना को बिना अनावश्यक क्रिया जोड़कर सुरक्षित रखा गया है।
