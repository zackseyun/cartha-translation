base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/016.yaml
  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: hi
  text: उसकी सेवा करने और उसके लिए याजकीय सेवा करने, और उसके नाम से उसकी प्रजा को आशीर्वाद देने के लिए। उसने सब जीवित प्राणियों में से उसे चुना, ताकि वह होमबलियाँ और चर्बी के भाग चढ़ाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ अधिक विस्तृत है: “प्रभु को अर्पण चढ़ाने, स्मरण के लिए धूप और मनभावनी सुगंध चढ़ाने, और तेरी प्रजा के लिए प्रायश्चित करने के लिए।” यहाँ इब्रानी साक्ष्य संक्षिप्त है।'
    reason: textual_variant
lexical_decisions:
- source_word: לשרת
  choice: सेवा करने
  rationale: यहाँ क्रिया पवित्र उपासना से जुड़ी सेवा को व्यक्त करती है; सरल हिंदी ‘सेवा करने’ प्रसंग में यह धार्मिक अर्थ स्वाभाविक रूप से देती है।
- source_word: ולכהן לו
  choice: उसके लिए याजक का काम करने
  rationale: כהן विशेष रूप से याजकीय कार्य करने को सूचित करता है। यह अनुवाद पद और कार्य दोनों को स्पष्ट रखता है।
- source_word: ולברך את עמו בשמו
  choice: उसके नाम से उसकी प्रजा को आशीर्वाद देने
  rationale: ‘उसके नाम से’ इब्रानी अभिव्यक्ति के उपासना-संबंधी और प्रतिनिधिक भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ויבחר בו מכל חי
  choice: उसने सब जीवित प्राणियों में से उसे चुना
  rationale: מכל חי का शाब्दिक विस्तार ‘सब जीवितों में से’ है; ‘सब जीवित प्राणियों में से’ इसकी व्यापकता को बिना केवल मनुष्यों तक सीमित किए सुरक्षित रखता है।
- source_word: להגיש
  choice: चढ़ाए
  rationale: बलिदान के प्रसंग में यह क्रिया वेदी के निकट लाकर अर्पित करने का अर्थ देती है; हिंदी में ‘चढ़ाए’ संक्षिप्त और स्वाभाविक धार्मिक पद है।
- source_word: עלה
  choice: होमबलियाँ
  rationale: עלה पूर्णतः जलाए जाने वाले बलिदान का मानक पद है। बहुवचन हिंदी में सामूहिक और बार-बार किए जाने वाले याजकीय कार्य को सहज रूप से व्यक्त करता है।
- source_word: וחלבים
  choice: चरबी के भाग
  rationale: बहुवचन शब्द बलिदान में वेदी पर चढ़ाए जाने वाले निर्धारित चरबीदार अंशों को दर्शाता है, केवल सामान्य ‘चरबी’ को नहीं।
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: मुख्य पाठ में नहीं जोड़ा; अधिक विस्तृत यूनानी समानांतर पाठ पादटिप्पणी में दिया
  rationale: उपलब्ध इब्रानी पाठ संक्षिप्त है, जबकि यूनानी में धूप, स्मरण, सुगंध और प्रायश्चित का अतिरिक्त वर्णन है। दोनों को मिलाकर एक पाठ बनाने के बजाय वास्तविक पाठांतर स्पष्ट किया गया है।
theological_decisions:
- issue: प्रमुख पाठांतर में संक्षिप्त इब्रानी पाठ और अधिक विस्तृत यूनानी पाठ का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया और यूनानी विस्तार को पादटिप्पणी में सुरक्षित रखा।
  alternative: अधिक विस्तृत यूनानी पाठ को मुख्य पाठ में रखना, अथवा इब्रानी और यूनानी को मिलाकर संयुक्त पाठ बनाना।
  rationale: जहाँ इब्रानी साक्ष्य उपलब्ध है वहाँ उसे आधार बनाना स्रोत-सम्मत है; साथ ही यूनानी पाठ के महत्वपूर्ण बलिदान और प्रायश्चित-संबंधी विस्तार को छिपाना उचित नहीं। पादटिप्पणी दोनों साक्ष्यों के बीच तनाव को ईमानदारी से बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘याजक’, ‘होमबलियाँ’ और ‘प्रायश्चित’ जैसे प्रचलित बाइबलीय पद तकनीकी धार्मिक अर्थ की आवश्यकता के कारण बनाए रखे गए हैं। आरंभिक उद्देश्यसूचक वाक्यांश स्रोत में पूर्ववर्ती संदर्भ से जुड़ा है, इसलिए उसकी खंडात्मक संरचना को अनावश्यक रूप से पूर्ण वाक्य में नहीं बदला गया।
