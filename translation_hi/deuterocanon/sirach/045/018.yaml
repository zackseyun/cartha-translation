base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: hi
  text: पराये लोग उस पर क्रोधित हो उठे[a], और निर्जन प्रदेश में उससे ईर्ष्या करने लगे—दातान और अबीराम के साथी तथा कोरह का दल, रोष और क्रोध में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध हिब्रू साक्ष्य संक्षिप्त है: “पराये लोग उस पर क्रोधित हो उठे, और निर्जन प्रदेश में उससे ईर्ष्या करने लगे।” यूनानी समानांतर आगे दातान और अबीराम के साथियों तथा कोरह के दल का स्पष्ट उल्लेख करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: उस पर क्रोधित हो उठे
  rationale: हिब्रू חרה עם ב किसी के विरुद्ध क्रोध भड़कने को व्यक्त करता है। यह हिंदी प्रयोग स्वाभाविक है और क्रोध के उठने का भाव बनाए रखता है।
- source_word: זרים
  choice: पराये लोग
  rationale: शाब्दिक अर्थ ‘अजनबी/बाहरी लोग’ है। यहाँ विद्रोही इस्राएली अभिप्रेत होने के कारण ‘विदेशी’ भ्रामक होता; ‘पराये लोग’ उनकी अनधिकृत और विरोधी स्थिति को खुला रखता है।
- source_word: ויקנאו בו
  choice: उससे ईर्ष्या करने लगे
  rationale: קנא ईर्ष्या अथवा जोश का अर्थ दे सकता है। हारून के विरुद्ध प्रतिद्वंद्विता के इस प्रसंग में ‘ईर्ष्या’ सर्वाधिक स्वाभाविक है, जबकि मूल की अर्थगत संभावना पूरी तरह समाप्त नहीं होती।
- source_word: במדבר
  choice: निर्जन प्रदेश में
  rationale: במדבר निर्जन या मरुस्थलीय प्रदेश को दर्शाता है। यह वर्तमान हिंदी में सहज है और निर्गमन-कालीन परिवेश को व्यक्त करता है।
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: दातान और अबीराम के साथी
  rationale: यूनानी वाक्यांश उन लोगों को दर्शाता है जो दातान और अबीराम से जुड़े थे। ‘साथी’ संक्षिप्त और स्वाभाविक है।
- source_word: ἡ συναγωγὴ Κόρε
  choice: कोरह का दल
  rationale: यहाँ συναγωγή विद्रोही समूह या मंडली है। ‘दल’ प्रसंगानुकूल है और आधुनिक धार्मिक संस्था का अनावश्यक संकेत नहीं देता।
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: रोष और क्रोध से भरे हुए
  rationale: यूनानी दोहरे पद की तीव्रता को स्पष्ट, गरिमापूर्ण हिंदी में बनाए रखता है।
theological_decisions:
- issue: प्रमुख पाठांतर में संक्षिप्त हिब्रू साक्ष्य और विस्तृत यूनानी समानांतर का उपयोग
  choice: मुख्य पाठ में हिब्रू के दोनों उपवाक्य रखकर यूनानी में सुरक्षित विद्रोहियों की पहचान और उनकी तीव्र मनोदशा को डैश के बाद जोड़ा गया है।
  alternative: 'केवल हिब्रू का अनुवाद: ‘पराये लोग उस पर क्रोधित हो उठे, और निर्जन प्रदेश में उससे ईर्ष्या करने लगे।’'
  rationale: उपलब्ध हिब्रू साक्ष्य प्राथमिक है, पर यूनानी समानांतर दातान, अबीराम और कोरह के दल की स्पष्ट पहचान सुरक्षित रखता है। दोनों साक्ष्यों को पारदर्शी ढंग से प्रस्तुत करने और पाठगत अनिश्चितता न छिपाने के लिए विस्तृत सामग्री मुख्य पाठ में तथा अंतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। व्यक्तिनामों के रूप ‘दातान’, ‘अबीराम’ और ‘कोरह’ अपनाए गए हैं।
