  text: His grain offering shall be burned up whole[a], every day, twice a day.
translation:
  language: hi
  text: उसकी अन्नबलि पूरी तरह जलाकर चढ़ाई जाएगी[a]—हर दिन नियमित रूप से दो बार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “उसके बलिदान पूरी तरह भस्म किए जाएँगे, नियमित रूप से, दिन में दो बार।” इब्रानी साक्ष्य अधिक विशिष्ट है: “उसकी अन्नबलि।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מנחתו
  choice: उसकी अन्नबलि
  rationale: याजकीय बलिदान-संदर्भ में מִנְחָה विशेष रूप से अन्नबलि को दर्शाता है; एकवचन और संबंधसूचक प्रत्यय दोनों सुरक्षित रखे गए हैं।
- source_word: כליל תקטר
  choice: पूरी तरह जलाकर चढ़ाई जाएगी
  rationale: כליל पूर्ण उपभोग को और קטר वेदी पर जलाकर धुएँ के रूप में चढ़ाने की क्रिया को व्यक्त करता है। यह रूप अन्नबलि को गलती से ‘होमबलि’ कहे बिना दोनों अर्थों को स्वाभाविक हिन्दी में रखता है।
- source_word: בכל יום
  choice: हर दिन
  rationale: समय-सूचक इब्रानी पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: צמיד פעמים
  choice: दिन में दो बार
  rationale: पाठ नियमित निरंतरता के साथ दो बार होने की बात कहता है; यूनानी ἐνδελεχῶς δίς भी नियमित रूप से दो बार का समर्थन करता है। ‘हर दिन’ के साथ यह हिन्दी में स्पष्ट और सहज है।
- source_word: θυσίαι αὐτοῦ
  choice: उसकी अन्नबलि
  rationale: यूनानी समानांतर का व्यापक अर्थ ‘उसके बलिदान’ है, पर उपलब्ध इब्रानी מנחתו अधिक विशिष्ट है और यहाँ प्राथमिक रखा गया है।
theological_decisions:
- issue: याजकीय संदर्भ में भेंट की विशिष्टता
  choice: इब्रानी के अनुसार ‘अन्नबलि’
  alternative: यूनानी के अनुसार ‘उसके बलिदान’
  rationale: उपलब्ध इब्रानी साक्ष्य भेंट को מנחה कहकर विशिष्ट बनाता है। यूनानी पाठ व्यापक है, इसलिए उसके भिन्न पाठ को पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण याजकीय भाषा। ‘जलाकर चढ़ाई जाएगी’ वेदी पर धुएँ में चढ़ाने का भाव रखता है, जबकि ‘पूरी तरह’ समूची भेंट के उपभोग को स्पष्ट करता है।
