base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/024.yaml
  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
translation:
  language: hi
  text: इसलिए उसने उसके लिए भी एक विधि—पवित्रस्थान को बनाए रखने के लिए सदा की वाचा—ठहराई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “इसलिए उसके लिए शांति की वाचा ठहराई गई, ताकि वह पवित्र वस्तुओं का संरक्षक और उसकी प्रजा के लिए रक्षक हो, और याजकपद की महिमा सदा उसके और उसके वंश की हो।” यहाँ इब्रानी पाठ छोटा है और पवित्रस्थान को बनाए रखने के लिए एक विधि तथा सदा की वाचा पर ध्यान देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: इसलिए
  rationale: यह पिछले प्रसंग में पीनहास के कार्य के परिणाम को स्पष्ट रूप से व्यक्त करता है।
- source_word: גם לו
  choice: उसके लिए भी
  rationale: इब्रानी में पीनहास को विशेष रूप से दिया गया एक अतिरिक्त विधान सूचित होता है; यह वाक्यांश उस बल को बनाए रखता है।
- source_word: הכין
  choice: ठहराई
  rationale: मूल क्रिया का अर्थ तैयार करना या स्थापित करना हो सकता है; विधि और वाचा के कानूनी-संधिपरक संदर्भ में ‘ठहराई’ स्वाभाविक और उपयुक्त है।
- source_word: חק
  choice: एक विधि
  rationale: यह किसी स्थिर विधान या निर्धारित व्यवस्था को सूचित करता है; ‘विधि’ उसके कानूनी-संधिपरक भाव को बनाए रखती है।
- source_word: ברית עולם
  choice: सदा की वाचा
  rationale: यह स्थायी वाचा की प्रचलित बाइबलीय अभिव्यक्ति है और עולם की निरंतरता को सहज हिन्दी में व्यक्त करती है।
- source_word: לכלכל
  choice: देखरेख करने के लिए
  rationale: क्रिया में संभालने, बनाए रखने या प्रबंध करने का भाव है; पवित्रस्थान के संदर्भ में ‘देखरेख’ निरंतर उत्तरदायित्व को स्वाभाविक हिन्दी में व्यक्त करती है, बिना यूनानी विस्तार को मुख्य पाठ में मिलाए।
- source_word: מקדש
  choice: पवित्रस्थान
  rationale: यह पवित्र परिसर के लिए पर्याप्त व्यापक है और इसे केवल बाद के मंदिर-भवन तक सीमित नहीं करता।
theological_decisions:
- issue: वाचा की प्रतिज्ञा के विषय में इब्रानी और यूनानी पाठों का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ—‘एक विधि…पवित्रस्थान की देखरेख करने के लिए सदा की वाचा’—का अनुवाद किया गया है।
  alternative: यूनानी पाठ में ‘शांति की वाचा’, पवित्र वस्तुओं और प्रजा की रखवाली, तथा पीनहास और उसके वंश के लिए सदा के याजकपद की महिमा का विस्तृत उल्लेख है।
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, मुख्य अनुवाद उसी पर आधारित है। यूनानी समानांतर पाठ अर्थ की दृष्टि से महत्त्वपूर्ण और अधिक विस्तृत है, इसलिए उसे पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘विधि’, ‘वाचा’ और ‘पवित्रस्थान’ बाइबलीय-कानूनी भाव बनाए रखते हैं; डैश विधि और सदा की वाचा के निकट संबंध को स्पष्ट करता है, पर उनकी सटीक व्याकरणिक संबद्धता को आवश्यकता से अधिक निश्चित नहीं करता।
