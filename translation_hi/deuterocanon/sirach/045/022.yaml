base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/022.yaml
  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: hi
  text: परन्तु उनकी भूमि में उसे कोई विरासत नहीं मिलेगी, और उनके बीच उसे विरासत का कोई भाग नहीं दिया जाएगा; इस्राएल के पुत्रों के बीच यहोवा को चढ़ाई जाने वाली भेंटें उसका भाग और उसकी विरासत हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में है, “क्योंकि वह स्वयं तुम्हारा भाग और विरासत है।” यह वर्तमान इब्रानी पाठ से भिन्न रूप को दर्शाता है, जिसमें है, “यहोवा को चढ़ाई जाने वाली भेंटें उसका भाग और उसकी विरासत हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: परन्तु
  rationale: पिछले प्रसंग में हारून और उसके वंश को मिले अनुदान के विपरीत भूमि की विरासत न मिलने का विरोध स्पष्ट करता है।
- source_word: בארצם
  choice: उनके देश में
  rationale: इससे इस्राएलियों की भूमि अभिप्रेत है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक है, जबकि विरासत का भाव आगे स्पष्ट बना रहता है।
- source_word: לא ינחל
  choice: उसे कोई विरासत नहीं मिलेगी
  rationale: एकवचन क्रिया हारून अथवा उसके द्वारा प्रतिनिधित्व किए गए याजकीय वंश को सामूहिक रूप से संदर्भित करती है और נחל का विरासत-संबंधी अर्थ बनाए रखती है।
- source_word: לא יחלק נחלה
  choice: उसे विरासत का कोई भाग नहीं दिया जाएगा
  rationale: संदर्भ में भाव यह है कि इस्राएल के बीच उसे भूमि का निर्धारित हिस्सा नहीं मिलेगा; यह यूनानी समानांतर के ‘उसके लिए कोई भाग नहीं’ से भी पुष्ट होता है।
- source_word: אשי יהוה
  choice: यहोवा को चढ़ाई गई भेंटें
  rationale: אשי अग्नि द्वारा चढ़ाई जाने वाली बलियों या भेंटों को सूचित करता है। यह सहज हिन्दी में उनके बलिदानी स्वरूप को पर्याप्त रूप से व्यक्त करता है, जबकि पाठभेद पादटिप्पणी में सुरक्षित है।
- source_word: חלקו ונחלתו
  choice: उसका भाग और उसकी विरासत
  rationale: यह आवंटित अधिकार और याजकीय निर्वाह को बताने वाली विधिक-धार्मिक शब्द-जोड़ी को सुरक्षित रखता है।
- source_word: בתוך בני ישראל
  choice: इस्राएल के पुत्रों के बीच
  rationale: यह בני ישראל की औपचारिक और स्रोत-निकट अभिव्यक्ति है तथा पूरे इस्राएली समुदाय को सामूहिक रूप से दर्शाती है।
theological_decisions:
- issue: अंतिम उपवाक्य में इब्रानी पाठ ‘यहोवा की भेंटें उसका भाग और उसकी विरासत हैं’ और यूनानी समानांतर ‘क्योंकि वह स्वयं तुम्हारा भाग, विरासत है’ में अंतर।
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण करते हुए याजकीय भाग को यहोवा को चढ़ाई गई भेंटें बताया गया है।
  alternative: 'यूनानी समानांतर के अनुसार: ‘क्योंकि वह स्वयं तुम्हारा भाग और विरासत है।’'
  rationale: जहाँ बेन सीरा का इब्रानी पाठ उपलब्ध है, उसे प्राथमिक मानना उचित है। यूनानी पाठ संभवतः भिन्न Vorlage या पंचग्रन्थीय विरासत-भाषा से सामंजस्य को दर्शाता है। अर्थगत और धर्मवैज्ञानिक अंतर को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। भूमि-विरासत और याजकीय भाग की पुनरुक्ति स्रोत के विधिक-धार्मिक बल को बनाए रखने के लिए सुरक्षित रखी गई है।
