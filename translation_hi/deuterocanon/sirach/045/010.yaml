base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/010.yaml
  text: holy garments of gold[a], blue, and purple, the work of a designer; a breastpiece of judgment, an ephod and a sash, and scarlet yarn[b], the work of a weaver.
translation:
  language: hi
  text: सोने, नीले और बैंगनी रंग के पवित्र वस्त्र, कुशल कारीगरी से बने हुए; न्याय की छाती-पट्टी[a], एपोद और कमरबंद, और जुलाहे की कारीगरी का लाल रंग का सूत[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “न्याय की छाती-पट्टी” निर्गमन में महायाजक की निर्णय-संबंधी छाती-पट्टी के लिए प्रयुक्त याजकीय पदावली की प्रतिध्वनि है।
    reason: cross_reference
  - marker: b
    text: या “किरमिजी सूत”; इब्रानी पद שני תולעת याजकीय वस्त्रों में प्रयुक्त लाल या गहरे लाल रंग की वस्त्र-सामग्री को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בגדי קודש
  choice: पवित्र वस्त्र
  rationale: यह सीधा संबंधवाचक पद है और याजकीय, उपासना-संबंधी पवित्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זהב תכלת, וארגמן
  choice: सोने, नीले और बैंगनी रंग के
  rationale: सूची में सोना और बहुमूल्य रंगीन सामग्री हैं। תכלת के लिए ‘नीला’ पठनीय है, जबकि ‘बैंगनी’ ארגמן को अलग रखता है। ‘रंग के’ जोड़ने से हिन्दी में रंग-सूची स्पष्ट होती है, यद्यपि सोना सामग्री भी है।
- source_word: מעשה חשב
  choice: कुशल कारीगरी से बने हुए
  rationale: यह पवित्रस्थान के वस्त्रों की योजनाबद्ध, कलात्मक और संभवतः नमूनेदार बुनावट को सूचित करता है; किसी एक तकनीक को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: חשן משפט
  choice: न्याय की छाती-पट्टी
  rationale: निर्गमन की पारिभाषिक याजकीय अभिव्यक्ति की प्रतिध्वनि रखते हुए वस्तु और משפט के न्याय/निर्णय-संबंधी अर्थ को सुरक्षित रखा गया है।
- source_word: אפוד
  choice: एपोद
  rationale: इस विशिष्ट याजकीय परिधान का कोई सटीक और संक्षिप्त हिन्दी पर्याय नहीं है, इसलिए लिप्यंतरण उचित है।
- source_word: ואזור
  choice: कमरबंद
  rationale: आधुनिक हिन्दी में कमर पर बाँधे जाने वाले याजकीय वस्त्र के लिए स्पष्ट और स्वाभाविक शब्द।
- source_word: ושני תולעת
  choice: लाल रंग का सूत
  rationale: यह गहरे लाल/किरमिजी वस्त्र-सामग्री का पारिभाषिक पद है। मुख्य पाठ में सहज हिन्दी रखी गई है और रंग की संभावित बारीकी पादटिप्पणी में दी गई है।
- source_word: מעשה אורג
  choice: जुलाहे का काम
  rationale: पद स्पष्ट रूप से बुनने वाले कारीगर का उल्लेख करता है; इससे पहले आए व्यापक कलात्मक शिल्प और यहाँ की वास्तविक बुनाई का भेद बना रहता है।
theological_decisions:
- issue: हारूनी महायाजक के वस्त्रों की पारिभाषिक शब्दावली
  choice: जहाँ सटीक सामान्य हिन्दी उपलब्ध है वहाँ अर्थानुवाद, और אפוד के लिए ‘एपोद’ का लिप्यंतरण
  alternative: सभी वस्तुओं का वर्णनात्मक अनुवाद करना अथवा सभी पारिभाषिक शब्दों का लिप्यंतरण करना
  rationale: यह पद्धति निर्गमन की याजकीय शब्दावली से संबंध बनाए रखती है, फिर भी सामान्य पाठक के लिए सूची को समझने योग्य बनाती है।
- issue: משפט का अर्थ
  choice: ‘न्याय की छाती-पट्टी’ के रूप में वास्तविक अस्पष्टता बनाए रखना
  alternative: ‘निर्णय की छाती-पट्टी’ या किसी विशिष्ट देववाणी-विधि के रूप में स्पष्ट करना
  rationale: משפט न्याय, निर्णय या निर्णय दिलाने की क्रिया से संबंधित हो सकता है। ‘न्याय’ स्रोत की पारंपरिक प्रतिध्वनि और अर्थगत तनाव को बिना अधिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सूची-जैसी इब्रानी संरचना को अर्धविराम और दीर्घ विराम से सँभाला गया है। तकनीकी ‘एपोद’ को बनाए रखते हुए अन्य वस्तुओं के लिए सहज हिन्दी अपनाई गई है।
