base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: hi
  text: उसने उस पर वैभव रखा और अपनी महिमा से उसकी सेवा की; उसने जंगली बैल के सींगों से उसकी कमर बाँधी[a] और उसे घंटियाँ पहनाईं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जंगली बैल की ऊँची शक्ति से।” इब्रानी पदबंध कठिन है; यह वास्तविक सींगों के अलंकरण के बजाय सामर्थ्य का रूपक भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ: “उसने उसके लिए सदा की वाचा ठहराई और उसे प्रजा का याजकपद दिया; उसने साज-सज्जा के द्वारा उसे आशीष दी और उसकी कमर पर महिमा का वस्त्र बाँधा।” यहाँ इब्रानी साक्ष्य यूनानी से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: वैभव
  rationale: यह शब्द दिखाई देने वाली गरिमा और भव्यता को व्यक्त करता है। ‘वैभव’ अभिषेक और याजकीय परिधान के प्रसंग में स्वाभाविक है तथा अगले शब्द כבוד से इसे अलग रखता है।
- source_word: וישרתהו
  choice: उसकी सेवा की
  rationale: שרת का मूल अर्थ ‘सेवा करना’ या ‘परिचर्या करना’ है। यहाँ परमेश्वर का हारून की सेवा करना असामान्य कथन है, पर अनुवाद उस वास्तविक कठिनाई को मिटाता नहीं है।
- source_word: בכבודו
  choice: अपनी महिमा से
  rationale: प्रत्यय को सुरक्षित रखते हुए इसे कर्ता की महिमा के रूप में व्यक्त किया गया है। ‘महिमा’ याजकीय प्रतिष्ठापन के ऊँचे भाव के अनुकूल है।
- source_word: ויאזרהו
  choice: उसकी कमर बाँधी
  rationale: אזר वस्त्र अथवा पटुके से कमर बाँधने के लिए प्रयुक्त होता है। यह हिंदी में समारोहपूर्वक पहनाने की क्रिया को स्पष्ट करता है।
- source_word: בתועפות ראם
  choice: जंगली बैल के सींगों से
  rationale: ראם जंगली बैल है और תועפות का अर्थ यहाँ ‘सींग’ हो सकता है। ठोस परिधान-बिंब को मुख्य पाठ में रखा गया है, जबकि ‘ऊँची शक्ति’ का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וילבישהו פעמונים
  choice: उसे घंटियाँ पहनाईं
  rationale: פעמונים का अर्थ घंटियाँ है और यह याजकीय वस्त्रों की याद दिलाता है। हिंदी में ‘घंटियाँ पहनाईं’ शाब्दिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है और यूनानी पाठ को पादटिप्पणी में पूरा प्रस्तुत करता है।
  alternative: 'यूनानी के अनुसार: ‘उसने उसके लिए सदा की वाचा ठहराई और उसे प्रजा का याजकपद दिया; उसने साज-सज्जा के द्वारा उसे आशीष दी और उसकी कमर पर महिमा का वस्त्र बाँधा।’'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक है, किंतु यूनानी साक्ष्य एक वास्तविक और बहुत अलग पाठ-परंपरा को सुरक्षित रखता है। दोनों को मिलाकर अंतर मिटाने के बजाय उसे स्पष्ट रूप से बताया गया है।
- issue: परमेश्वर द्वारा हारून की ‘सेवा’ किए जाने का असामान्य कथन
  choice: इब्रानी क्रिया को सीधे ‘उसकी सेवा की’ अनूदित किया गया है।
  alternative: ‘उसे सुशोभित किया’ या ‘उसकी परिचर्या की’
  rationale: असामान्य धर्मवैचारिक तनाव इब्रानी में ही उपस्थित है। अधिक सहज वाक्य बनाने के लिए इसे चुपचाप बदलना उचित नहीं; भिन्न यूनानी कथन अलग से पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वैभव’, ‘महिमा’ और ‘याजकपद’ प्रसंगानुकूल ऊँचे शब्द हैं, जबकि वाक्य-विन्यास सरल है। इब्रानी की असामान्य ‘सेवा’ वाली अभिव्यक्ति तथा जंगली बैल के सींगों की संदिग्ध छवि को सहज बनाने के नाम पर हटाया नहीं गया है।
