base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: hi
  text: उसने उसे पूर्ण शोभा का परिधान पहनाया[a], और महिमा और सामर्थ्य से विभूषित किया—जाँघिए, अंगरखे और चोगे से; और उसके चारों ओर घंटियाँ लगाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध इब्रानी और यूनानी पाठों में यहाँ याजकीय वस्त्रों के विवरण अलग-अलग हैं। इब्रानी में “जाँघिए, अंगरखे और चोगा … घंटियाँ” है, जबकि यूनानी में क्रम भिन्न है और उसमें एपोद भी आता है।
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו
  choice: उसने उसे ... वस्त्र पहनाया
  rationale: हिफ़ईल रूप का अर्थ किसी को पहनाना है। यह प्रयोग याजकीय परिधान के औपचारिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כליל תפארת
  choice: पूर्ण शोभा का वस्त्र
  rationale: כליל पूर्णता या समग्रता और תפארת शोभा, वैभव या महिमा को व्यक्त करता है। वस्त्र पहनाने के प्रसंग में यह संक्षिप्त, उन्नत पदबंध अर्थ और बिंब दोनों सुरक्षित रखता है।
- source_word: ויפארהו
  choice: विभूषित किया
  rationale: פאר यहाँ परिधानों द्वारा शोभायमान और सम्मानित करने का भाव रखता है; ‘विभूषित’ ठोस सज्जा और गरिमा दोनों व्यक्त करता है।
- source_word: בכבוד ועוז
  choice: महिमा और सामर्थ्य से
  rationale: כבוד का अर्थ महिमा/सम्मान और עוז का सामर्थ्य/बल है। यह युग्म मूल की गरिमा और शक्ति को निकटता से रखता है।
- source_word: מכנסים
  choice: जाँघिए
  rationale: यह याजकीय निचला परिधान है। ‘जाँघिए’ आधुनिक हिन्दी में ‘जाँघों को ढकने वाले वस्त्र’ का ठोस अर्थ देता है और अस्पष्ट ‘अधोवस्त्र’ से अधिक सटीक है।
- source_word: כתנות
  choice: अंगरखे
  rationale: כתנת प्राचीन लंबा कुर्तानुमा परिधान है। बहुवचन को रखते हुए ‘अंगरखे’ सामान्य पाठक के लिए समझने योग्य है।
- source_word: ומעיל
  choice: और चोगे से
  rationale: מעיל ऊपरी, चोगानुमा वस्त्र को सूचित करता है। ‘चोगा’ सहज आधुनिक हिन्दी है और याजकीय प्रसंग में उपयुक्त है।
- source_word: ויקיפהו פעמונים
  choice: उसके चारों ओर घंटियाँ लगाईं
  rationale: क्रिया चारों ओर घेरने का भाव देती है। हिन्दी में घंटियों को व्यक्ति के चारों ओर ‘लगाना’ वस्त्र के घेरे पर उनकी व्यवस्था का स्वाभाविक चित्र प्रस्तुत करता है, बिना ‘सोने की’ जैसी अनुपस्थित सूचना जोड़े।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर में याजकीय वस्त्रों की सूची का अंतर
  choice: मुख्य पाठ में उपलब्ध और सुसंगत इब्रानी सूची—जाँघिए, अंगरखे, चोगा और घंटियाँ—का अनुवाद किया गया।
  alternative: यूनानी क्रम के अनुसार जाँघिए, पाँव तक का वस्त्र और एपोद का उल्लेख किया जा सकता था।
  rationale: सिराख के उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है। यूनानी पाठ समारोहगत परिधान और पदबंध के उन्नत भाव की पुष्टि करता है, पर उसकी अलग सूची को इब्रानी मुख्य पाठ में मिलाया नहीं गया; पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘पूर्ण शोभा’ मूल के संक्षिप्त और उन्नत כליל תפארת को बनाए रखता है; ‘जाँघिए’, ‘अंगरखे’ और ‘चोगा’ प्राचीन वस्त्रों के लिए ठोस तथा अपेक्षाकृत सहज शब्द हैं।
