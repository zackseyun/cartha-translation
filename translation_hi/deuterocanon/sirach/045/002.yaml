translation:
  language: hi
  text: परमेश्वर ने उसका सम्मान किया[a] और उसे ऊँचाइयों में सुदृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ अधिक विस्तार से कहता है, “उसने उसे पवित्र जनों की महिमा के तुल्य बनाया, और शत्रुओं के आतंक के बीच उसे महान किया।” इसके विपरीत इब्रानी साक्ष्य में है, “परमेश्वर ने उसका सम्मान किया और उसे ऊँचाइयों में सुदृढ़ किया।”
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: उसे सम्मान दिया
  rationale: כבד के पिएल रूप का अर्थ यहाँ किसी को आदर या महिमा देना है। ‘सम्मान दिया’ सहज आधुनिक हिन्दी है और ‘महिमामंडित किया’ की अपेक्षा मूल अर्थ को अनावश्यक रूप से अधिक प्रबल नहीं बनाता।
- source_word: אלהים
  choice: परमेश्वर
  rationale: संदर्भ में אלהים एकवचन दिव्य कर्ता है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: ויאמצהו
  choice: उसे सामर्थी बनाया
  rationale: אמץ का कारक अर्थ ‘बलवान या दृढ़ बनाना’ है। ‘सामर्थी बनाया’ इस कारक भाव को स्पष्ट रखता है और केवल प्रोत्साहन देने तक अर्थ को सीमित नहीं करता।
- source_word: במרומים
  choice: ऊँचे स्थानों में
  rationale: מרומים ऊँचाइयों या ऊँचे स्थानों को सूचित करता है। यह अनुवाद स्थान-संबंधी ऊँचाई की छवि बनाए रखता है और यह तय नहीं करता कि आशय स्वर्गीय ऊँचाई है या प्रतिष्ठित पद।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बीच बड़े अंतर का निर्वाह
  choice: 'मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ का अनुसरण: ‘और ऊँचे स्थानों में उसे सामर्थी बनाया।’'
  alternative: 'यूनानी पाठ: ‘उसने उसे पवित्र जनों की महिमा के समान बनाया, और शत्रुओं के आतंक के बीच उसे महान किया।’'
  rationale: जहाँ सिराख का इब्रानी पाठ सुरक्षित है, वहाँ उसे प्राथमिकता दी गई है। यूनानी पाठ का अंतर इतना महत्वपूर्ण है कि उसे पाठांतर की पाद-टिप्पणी में स्पष्ट रूप से रखा गया है, न कि मुख्य पाठ में मिलाकर असली तनाव मिटाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ऊँचे स्थानों में’ मूल की स्थानगत और संभावित रूपकात्मक अस्पष्टता को सुरक्षित रखता है।
