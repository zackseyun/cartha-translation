base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: hi
  text: पवित्र परमेश्वर ने लेवी के गोत्र से हारून को ऊँचा उठाया[a] और उसे सदा के लिए विधान ठहराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर में है: “उसने हारून को, अपने समान पवित्र, अपने भाई को, जो लेवी के गोत्र से था, ऊँचा उठाया।” उपलब्ध इब्रानी में ‘पवित्र’ को क्रिया के कर्ता के रूप में पढ़ा जा सकता है; इसलिए मुख्य पाठ में ‘पवित्र परमेश्वर’ है।'
    reason: alternative_reading
  - marker: b
    text: या “स्थायी विधान” या “चिरस्थायी विधि।” यह संक्षिप्त इब्रानी अभिव्यक्ति संभवतः हारून की स्थायी याजकीय नियुक्ति की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: ऊँचा उठाया
  rationale: रום के हिफ़ील रूप का अर्थ ‘ऊँचा उठाना/महान करना’ है। यह याजकीय सम्मान के प्रसंग और यूनानी ὕψωσεν, दोनों के अनुकूल है।
- source_word: קדוש
  choice: पवित्र परमेश्वर
  rationale: उद्धृत इब्रानी वाक्य-विन्यास में קדוש, את אהרן से पहले आकर क्रिया के कर्ता के रूप में सबसे स्वाभाविक है; इसलिए इसे परमेश्वर के विशेषणात्मक नाम ‘पवित्र परमेश्वर’ के रूप में लिया गया है। केवल ‘पवित्र’ या ‘पवित्र जन’ आधुनिक हिन्दी में अस्पष्ट अथवा भ्रामक होता।
- source_word: את אהרן
  choice: हारून को
  rationale: את निश्चित कर्म का चिह्न है और אהרן व्यक्ति का नाम है।
- source_word: למטה לוי
  choice: लेवी के गोत्र के
  rationale: מַטֶּה वंशावली के प्रसंग में ‘गोत्र’ है। यहाँ ל संबंध अथवा संबद्धता बताता है; यूनानी समानांतर का ἐκ φυλῆς Λευεί भी हारून की लेवी-गोत्रीय पहचान की पुष्टि करता है।
- source_word: וישימהו
  choice: और उसे … ठहराया
  rationale: שׂים का अर्थ रखना, स्थापित करना या ठहराना हो सकता है। ‘ठहराया’ नियुक्ति/स्थापना का भाव देता है, पर पाठ में न आए ‘याजकीय पद’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: לחק עולם
  choice: सदा की विधि
  rationale: חֹק का अर्थ विधि/विधान और עוֹלָם का अर्थ यहाँ स्थायी अथवा चिरस्थायी अवधि है। इब्रानी अभिव्यक्ति की संक्षिप्त कानूनी-वाचायी भाषा को बनाए रखा गया है।
- source_word: ἅγιον ὅμοιον αὐτῷ ἀδελφὸν αὐτοῦ
  choice: अपने समान पवित्र, अपने भाई हारून को (पादटिप्पणी में)
  rationale: यूनानी समानांतर में यह सामग्री स्पष्ट है, पर उपलब्ध इब्रानी में קדוש अधिक स्वाभाविक रूप से कर्ता है और ‘अपने समान’ तथा ‘अपने भाई’ नहीं हैं। अतः दोनों पाठ-परंपराओं को मिलाकर एक नया मुख्य पाठ बनाने के बजाय यूनानी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: קדוש का कर्ता होना या हारून का विशेषण होना
  choice: इब्रानी के आधार पर ‘पवित्र परमेश्वर’ को कर्ता माना गया।
  alternative: यूनानी के अनुसार हारून को ‘उसके समान पवित्र’ कहा जाए और क्रिया का कर्ता केवल निहित ‘उसने’ रहे।
  rationale: इब्रानी में את हारून को स्पष्ट कर्म बनाता है और उससे पहले का קדוש कर्ता के स्थान पर है। यूनानी एक वास्तविक भिन्न पाठ प्रस्तुत करता है; उसे पादटिप्पणी में दिया गया है ताकि भिन्नता दबाई न जाए।
- issue: לחק עולם का संस्थागत आशय
  choice: ‘उसे सदा की विधि ठहराया’—मूल की संक्षिप्त कानूनी अभिव्यक्ति बनाए रखी गई।
  alternative: ‘उसे सदा के लिए याजकीय पद पर नियुक्त किया।’
  rationale: प्रसंग स्थायी याजकीय नियुक्ति की ओर संकेत करता है, पर ‘याजकीय पद’ इस पंक्ति में प्रत्यक्ष नहीं है। अधिक स्पष्ट विकल्प अर्थ खोलता है, किंतु मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। ‘सदा की विधि ठहराया’ कुछ संक्षिप्त और असामान्य है, क्योंकि मूल इब्रानी भी जानबूझकर सघन कानूनी भाषा रखता है। पाठ-साक्ष्यों के बड़े अंतर को मुख्य पाठ में कृत्रिम रूप से मिलाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
