base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/013.yaml
  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: hi
  text: उससे पहले ऐसे वस्त्र कभी नहीं थे[a], और कोई पराया उन्हें कभी नहीं पहनेगा; केवल उसके पुत्र और उसके वंशज ही, पीढ़ी-दर-पीढ़ी, उन्हें पहनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का उत्तरार्ध इब्रानी में कठिन है। उसका लगभग शाब्दिक अर्थ हो सकता है: “उसने उसे और उसके पुत्रों को वैसा ही सौंपा/उनके लिए उसकी पुष्टि की, और इसी प्रकार उसके पुत्रों को उनकी पीढ़ियों के लिए।” यूनानी समानांतर अर्थ को इस प्रकार स्पष्ट करता है कि कोई पराया इन्हें नहीं पहनेगा—केवल हारून के पुत्र और उसके वंशज।'
    reason: alternative_reading
lexical_decisions:
- source_word: לפניו
  choice: उससे पहले
  rationale: यहाँ पदबंध स्वाभाविक रूप से हारून से पहले के समय को सूचित करता है; यूनानी πρὸ αὐτοῦ भी इसी अर्थ का समर्थन करता है।
- source_word: לא היה כן
  choice: ऐसे ... कभी नहीं हुए थे
  rationale: यह इब्रानी मुहावरा पहले कभी ऐसी तुलनीय वस्तुओं के न होने को व्यक्त करता है।
- source_word: כן / ὡραῖα (contextual referent)
  choice: ऐसे वस्त्र
  rationale: इब्रानी में वस्तु निहित है और निकटवर्ती प्रसंग महायाजकीय वस्त्रों का है। 'ऐसे वस्त्र' अनावश्यक वर्णन जोड़े बिना संदर्भ स्पष्ट करता है।
- source_word: זר / ἀλλογενής
  choice: कोई पराया
  rationale: यह अधिकृत याजकीय वंश से बाहर के व्यक्ति को दर्शाता है। 'पराया' आधुनिक हिन्दी में इस वंशगत बहिष्करण को संक्षेप में व्यक्त करता है।
- source_word: לעולם
  choice: कभी नहीं
  rationale: नकारात्मक वाक्य में यह स्थायी निषेध का स्वाभाविक हिन्दी रूप है।
- source_word: ילבשם
  choice: उन्हें ... पहनेगा
  rationale: לבש वस्त्र पहनने को व्यक्त करता है और सर्वनाम का बहुवचन संदर्भ वस्त्रों से है।
- source_word: האמין לו ולבניו כזה
  choice: केवल उसके पुत्र ... ही उन्हें पहनेंगे
  rationale: प्राप्त इब्रानी पाठ कठिन है और शाब्दिक रूप से 'उसने उसे और उसके पुत्रों को वैसा ही सौंपा/विश्वसनीय ठहराया' जैसा अर्थ दे सकता है। मुख्य पाठ में यूनानी समानांतर का स्पष्ट अपवाद-वाक्य लिया गया है, जबकि इब्रानी कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: וכן בניו לדורותם / τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: पीढ़ी-दर-पीढ़ी उसके वंशज
  rationale: यह वंशानुगत निरंतरता को सहज हिन्दी में व्यक्त करता है और इब्रानी לדורותם के पीढ़ीगत बल को बनाए रखता है।
theological_decisions:
- issue: महायाजकीय वस्त्रों का हारून के वंश तक सीमित होना
  choice: मुख्य पाठ में वस्त्र पहनने का अधिकार केवल उसके पुत्रों और वंशजों तक सीमित बताया गया है।
  alternative: कठिन इब्रानी खंड को हारून और उसके पुत्रों को किसी वस्तु के सौंपे जाने या उनके लिए उसकी पुष्टि किए जाने के कथन के रूप में पढ़ा जा सकता है।
  rationale: वंशगत विशिष्टता आसपास के प्रसंग और यूनानी समानांतर से स्पष्ट होती है, पर इब्रानी पाठ की वास्तविक अनिश्चितता को पादटिप्पणी में रखा गया है, ताकि उसे चुपचाप हल न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। 'ऐसे वस्त्र' से प्रसंगगत वस्तु स्पष्ट की गई है, जबकि 'सुन्दर' जैसा विशेषण नहीं जोड़ा गया क्योंकि वह उपलब्ध इब्रानी में प्रत्यक्ष नहीं है। इब्रानी पाठ की कठिनाई और यूनानी समानांतर का सहारा पादटिप्पणी में स्पष्ट किया गया है।
