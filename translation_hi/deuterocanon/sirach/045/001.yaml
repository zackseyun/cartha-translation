  text: Beloved by God and men was Moses[c][b][a], whose memory is for blessing.
translation:
  language: hi
  text: परमेश्वर और मनुष्यों[a] के प्रिय मूसा[b], जिनकी स्मृति धन्य रहे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य’; यूनानी समानांतर पाठ में अधिक व्यापक शब्द है, जिसका अर्थ ‘लोग’ या ‘मानवजाति’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी समानांतर पाठ इससे पहले यह अतिरिक्त कथन देता है कि परमेश्वर ने ‘उसमें से दया से भरा एक पुरुष निकाला, जो सब प्राणियों की दृष्टि में अनुग्रह पाता था।’ ये शब्द उपलब्ध इब्रानी पाठ में नहीं हैं।
    reason: textual_variant
  - marker: c
