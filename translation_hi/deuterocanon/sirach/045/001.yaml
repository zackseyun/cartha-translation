    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  choice: प्रिय
  rationale: यह इब्रानी के निष्क्रिय/विशेषणात्मक अर्थ ‘जिससे प्रेम किया गया, प्रिय’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; यूनानी ἠγαπημένον भी इसकी पुष्टि करता है।
- source_word: אלהים
  choice: परमेश्वर
  rationale: मूसा के इस संदर्भ में यह इस्राएल के परमेश्वर के लिए है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: ואנשים
  choice: और मनुष्यों के
  rationale: इब्रानी אנשים का शाब्दिक अर्थ ‘मनुष्य/लोग’ है। ‘मनुष्यों’ मूल के बहुवचन मानवीय संदर्भ को बनाए रखता है और यूनानी ἀνθρώπων के व्यापक अर्थ से भी मेल खाता है।
- source_word: משה
  choice: मूसा
  rationale: इस नाम का प्रचलित मानक हिन्दी रूप।
- source_word: זכרו
  choice: उनकी स्मृति
  rationale: प्रत्यययुक्त संज्ञा का स्वाभाविक हिन्दी रूप; आदरसूचक ‘उनकी’ मूसा के सम्मानपूर्ण उल्लेख के अनुकूल है।
- source_word: לטובה
  choice: आशीष के लिए बनी रहे
  rationale: शाब्दिक रूप ‘भलाई के लिए’ है, पर स्मरण-सूत्र में यह शुभ अथवा आशीषपूर्ण स्मृति की कामना व्यक्त करता है। यूनानी ‘आशीषों में’ इस मुहावरेदार अर्थ का समर्थन करता है।
theological_decisions:
- issue: इब्रानी पाठ बनाम यूनानी का अधिक लंबा समानांतर पाठ
  choice: मुख्य पाठ में उपलब्ध इब्रानी वाक्य का ही अनुवाद किया गया है।
  alternative: यूनानी से ‘उसमें से दया का एक पुरुष निकाला, जो सब प्राणियों की दृष्टि में अनुग्रह पाता था’ जोड़ना।
  rationale: दिया गया इब्रानी साक्ष्य मुख्य आधार है और उसमें यूनानी की अतिरिक्त पंक्तियाँ नहीं हैं। पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में मिलाया नहीं गया।
- issue: זכרו לטובה का अर्थ
  choice: ‘उनकी स्मृति आशीष के लिए बनी रहे’
  alternative: ‘उनकी स्मृति भलाई के लिए है’
  rationale: चुना गया रूप इब्रानी स्मरण-सूत्र की शुभकामनात्मक शक्ति और यूनानी ‘जिसका स्मारक आशीषों में है’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे किसी विशिष्ट धार्मिक सिद्धांत में सीमित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्रिय’ सम्मानसूचक भाव रखता है; ‘बनी रहे’ स्मरण-सूत्र के कामनात्मक आशय को सहज हिन्दी में सामने लाता है। सभी पाठांतर और शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
