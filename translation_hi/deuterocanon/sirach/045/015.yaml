base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: hi
  text: मूसा ने उसे याजक-पद पर नियुक्त किया[a] और पवित्र तेल से उसका अभिषेक किया। उसके लिए और उसके वंश के लिए यह सदा की वाचा ठहरी, जितने दिन आकाश बना रहेगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसका हाथ भर दिया’; यह किसी को याजकीय पद पर स्थापित करने का मुहावरा है। यूनानी में भी ‘हाथों को भर दिया’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘आकाश के दिनों के समान’; यह मुहावरा दीर्घस्थायी अवधि व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: 'उपलब्ध इब्रानी पाठ यहाँ समाप्त हो जाता है, पर यूनानी समानांतर आगे कहता है: ‘कि वह उसकी सेवा करे, याजक का कार्य करे, और उसके नाम से उसकी प्रजा को आशीष दे।’ मुख्य अनुवाद प्राथमिक साक्षी के रूप में उपलब्ध इब्रानी पाठ का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא משה את ידו
  choice: मूसा ने उसे याजक-पद पर नियुक्त किया
  rationale: इब्रानी में शाब्दिक अर्थ ‘मूसा ने उसका हाथ भर दिया’ है, पर यह किसी को याजकीय पद पर विधिवत स्थापित करने का पारिभाषिक मुहावरा है। ‘याजक-पद पर नियुक्त किया’ आधुनिक हिन्दी में उसका आशय स्पष्ट करता है; यूनानी समानांतर भी ‘हाथों को भर दिया’ पढ़ता है।
- source_word: וימשחהו
  choice: उसका अभिषेक किया
  rationale: משח अनुष्ठान के रूप में तेल लगाने अर्थात अभिषेक करने को सीधे व्यक्त करता है; यूनानी ἔχρισεν भी इसी अर्थ की पुष्टि करता है।
- source_word: בשמן הקדש
  choice: पवित्र तेल से
  rationale: यह पदबंध अनुष्ठान में प्रयुक्त पवित्र तेल को दर्शाता है। हिन्दी में यह संक्षिप्त, स्वाभाविक और मूल के अनुरूप है।
- source_word: ברית עולם
  choice: सदा की वाचा
  rationale: यह पदबंध स्थायी और निरंतर रहनेवाली वाचा को व्यक्त करता है। ‘सदा की वाचा’ बाइबलीय गरिमा रखते हुए सामान्य आधुनिक हिन्दी में बोधगम्य है।
- source_word: ולזרעו
  choice: और उसके वंश के लिए
  rationale: זרע यहाँ सामूहिक अर्थ में आनेवाली संतति को दर्शाता है। ‘वंश’ इस निरंतर वंशगत आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כימי שמים
  choice: जब तक आकाश बना रहे
  rationale: शाब्दिक पदबंध ‘आकाश के दिनों के समान’ दीर्घ, स्थायी अवधि का मुहावरा है। चुना हुआ रूप कालगत आशय और आकाश की मूल बिंबात्मकता दोनों बनाए रखता है।
theological_decisions:
- issue: याजकीय संदर्भ में वाचा की प्रतिज्ञा का विस्तार
  choice: वाचा को उसके और उसके वंश के लिए स्थायी रूप में कहा गया है, ठीक उतना ही जितना पद कहता है।
  alternative: इसे या तो निरपेक्ष रूप से कभी समाप्त न होनेवाले याजकत्व की विस्तृत सैद्धान्तिक घोषणा मानना, या केवल उसके अपने जीवनकाल तक सीमित करना।
  rationale: इब्रानी और यूनानी दोनों वाचा को उस व्यक्ति तथा उसके वंश से जोड़कर दीर्घकालिक भाषा में रखते हैं। अनुवाद इस बल को सुरक्षित रखता है, पर मूल से आगे कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: ‘हाथ भरना’ याजकीय मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘याजक-पद पर नियुक्त किया’ और शाब्दिक रूप पादटिप्पणी में।
  alternative: ‘उसका हाथ भर दिया’ अथवा केवल ‘उसे अभिषिक्त किया’।
  rationale: शाब्दिक हिन्दी अस्पष्ट होगी, जबकि इसे केवल अभिषेक कहना अगले अलग क्रियापद के साथ मूल के दो अनुष्ठानिक कार्यों का भेद मिटा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘याजक-पद’, ‘अभिषेक’ और ‘वाचा’ प्रसंग के तकनीकी-बाइबलीय शब्द हैं; अस्पष्ट शाब्दिक मुहावरे को मुख्य पाठ में स्पष्ट किया गया है और मूल रूप पादटिप्पणी में सुरक्षित रखा गया है।
