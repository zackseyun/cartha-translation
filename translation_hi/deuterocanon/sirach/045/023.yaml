base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: hi
  text: और एलआज़ार के पुत्र पीनहास ने भी वीरता में तीसरा स्थान विरासत में पाया,[a] क्योंकि वह सबके परमेश्वर के लिए जोश से भर उठा और अपने लोगों के लिए दरार में खड़ा हुआ।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “महिमा में तीसरा” है, जबकि उपलब्ध इब्रानी पाठ में “वीरता में तीसरा स्थान विरासत में पाया” है। यहाँ इब्रानी पाठ का अनुसरण किया गया है; यूनानी पाठ सम्मान के क्रम की एक उल्लेखनीय वैकल्पिक बारीकी प्रस्तुत करता है।
    reason: textual_variant
  - marker: b
    text: “दरार में खड़ा होना” एक इब्रानी मुहावरा है, जिसका अर्थ सामुदायिक संकट के समय रक्षा या मध्यस्थता के लिए आगे आना है।
    reason: cultural_note
  - marker: c
    text: यूनानी पाठ आगे जोड़ता है, “और उसने इस्राएल के लिए प्रायश्चित किया”; उपलब्ध इब्रानी पाठ में ये शब्द नहीं हैं।
    reason: textual_variant
lexical_decisions:
- source_word: נחל שלישי
  choice: तीसरा स्थान पाया
  rationale: נחל का मूल भाव विरासत में पाने या प्राप्त करने का है, पर यहाँ याजकीय महापुरुषों की प्रशंसा के क्रम में पद अथवा सम्मान का स्थान अभिप्रेत है। सरल हिन्दी में “तीसरा स्थान पाया” इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בגבורה
  choice: वीरता में
  rationale: גבורה सामर्थ्य, पराक्रम या वीरता को सूचित करता है। पीनहास के साहसी कार्य के प्रसंग में “वीरता” आधुनिक हिन्दी में सटीक और सहज है; यूनानी पाठ का “महिमा में” पादटिप्पणी में रखा गया है।
- source_word: בקנאו
  choice: क्योंकि उसने ... उत्साह दिखाया
  rationale: ב के साथ यह रूप कारण अथवा अवसर व्यक्त कर सकता है। यहाँ सम्मान पाने और उत्साहपूर्ण कार्य के बीच स्वाभाविक कारण-संबंध है, यद्यपि वाक्य को अनावश्यक रूप से अधिक निर्णायक नहीं बनाया गया।
- source_word: לאלוה כל
  choice: सबके परमेश्वर के लिए
  rationale: यह इब्रानी के विशिष्ट पदनाम “सबके परमेश्वर” को सुरक्षित रखता है और उसे किसी अधिक परिचित, पर भिन्न, उपाधि से नहीं बदलता।
- source_word: ויעמוד בפרץ
  choice: दरार में खड़ा हुआ
  rationale: यह सामुदायिक संकट के समय रक्षा या मध्यस्थता के लिए आगे आने का इब्रानी रूपक है। शाब्दिक बिंब को पाठ में रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עמו
  choice: अपनी प्रजा के लिए
  rationale: “दरार में खड़ा होना” के साथ “के लिए” जोड़ना हिन्दी में उसके प्रतिनिधिक और रक्षात्मक कार्य को स्पष्ट करता है। प्रजा से आशय इस्राएल है।
theological_decisions:
- issue: पीनहास के उत्साह और उसके सम्मानित स्थान का संबंध
  choice: उसका स्थान उसके परमेश्वर के लिए उत्साह और प्रजा की ओर से संकट में खड़े होने के कारण प्रस्तुत किया गया है।
  alternative: इसे प्रबल कारण-संबंध के बिना केवल उसके गुणों का वर्णन भी समझा जा सकता है।
  rationale: בקנאו में कारणात्मक अथवा अवसरसूचक दोनों संभावनाएँ हैं। प्रसंग कारणात्मक अर्थ का समर्थन करता है, पर अनुवाद मूल कथन से आगे जाकर प्रतिफल का कोई विस्तृत धर्मवैज्ञानिक सिद्धान्त नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “वीरता,” “सबके परमेश्वर,” और “दरार में खड़ा हुआ” से इब्रानी की संक्षिप्तता तथा रूपक सुरक्षित हैं; कठिन मुहावरे और पाठांतर पादटिप्पणियों में स्पष्ट किए गए हैं।
