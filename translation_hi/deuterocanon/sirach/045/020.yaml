  text: And he added honor to Aaron[a], and gave him his inheritance.
translation:
  language: hi
  text: उसने हारून का सम्मान और बढ़ाया[a] और उसे उसकी विरासत दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ आगे कहता है: “पहिलौठों के प्रथम फल उसने उन्हें बाँट दिए; उसने प्रमुख जनों के लिए भरपूर रोटी तैयार की।” यहाँ उपलब्ध इब्रानी पाठ यूनानी से छोटा है।'
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  choice: और बढ़ाया
  rationale: हिफ़ील रूप यहाँ किसी सम्मान को और बढ़ाने का भाव देता है; यह सहज हिन्दी है और यूनानी προσέθηκεν से भी मेल खाता है।
- source_word: לאהרן
  choice: हारून का
  rationale: हिन्दी बाइबलीय परंपरा के मानक नाम-रूप ‘हारून’ का प्रयोग किया गया है; हिन्दी वाक्य-विन्यास में כבודו के साथ संबंधसूचक रचना स्वाभाविक है।
- source_word: כבודו
  choice: सम्मान
  rationale: כבוד यहाँ हारून की प्रतिष्ठित याजकीय हैसियत को सूचित करता है; ‘सम्मान’ आधुनिक हिन्दी में स्वाभाविक है और ‘महिमा’ की अपेक्षा प्रसंग के अधिक अनुकूल है।
- source_word: ויתן לו
  choice: और उसे ... दी
  rationale: נתן का सरल, सीधा अर्थ ‘देना’ रखा गया है; ‘उसे’ अप्रत्यक्ष कर्म को स्पष्ट करता है।
- source_word: נחלתו
  choice: उसकी विरासत
  rationale: נחלה विरासत अथवा नियत भाग दोनों को सूचित कर सकता है। ‘विरासत’ वाचा-संबंधी अनुगूँज बनाए रखती है, जबकि याजकीय हिस्से का आशय भी संभव रहने देती है।
theological_decisions:
- issue: हारून की ‘विरासत’ का स्वरूप
  choice: उसकी विरासत
  alternative: उसका ठहराया हुआ भाग
  rationale: यह संभवतः हारून को दिया गया याजकीय हिस्सा है, अनिवार्यतः भूमि-संपत्ति नहीं। ‘विरासत’ मूल की व्यापक धार्मिक अनुगूँज और अर्थगत तनाव को बिना सीमित किए सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबलीय शैली रखी गई है। ‘सम्मान और बढ़ाया’ मूल क्रिया की वृद्धि-संबंधी छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
