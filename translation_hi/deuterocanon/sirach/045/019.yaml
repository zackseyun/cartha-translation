base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: hi
  text: याहवे ने यह देखा और क्रोधित हुआ; उसने अपने धधकते क्रोध में उनका अंत कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ अधिक विस्तृत है: “वे प्रचंड क्रोध में समाप्त कर दिए गए; उसने उनके बीच अद्भुत काम किए, ताकि अपनी ज्वाला की आग में उन्हें भस्म कर दे।” इब्रानी पाठ यहाँ छोटा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וירא יהוה
  choice: याहवे ने यह देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: ויתאנף
  choice: और क्रोधित हुआ
  rationale: אנף का यह रूप तीव्र क्रोध प्रकट होने को बताता है। ‘क्रोधित हुआ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा मूल से अधिक तीव्रता नहीं जोड़ता।
- source_word: ויכלם
  choice: उसने ... उनका अंत कर दिया
  rationale: यह रूप यहाँ दंडस्वरूप विनाश का बोध कराता है। समानांतर यूनानी पाठ का συνετελέσθησαν (‘उनका अंत हो गया’) इस अर्थ की पुष्टि करता है, जबकि हिन्दी वाक्य में परमेश्वर को कर्ता बनाए रखना इब्रानी व्याकरण के अनुरूप है।
- source_word: בחרון אפו
  choice: अपने धधकते क्रोध में
  rationale: חרון אף तीव्र, जलते हुए क्रोध का इब्रानी मुहावरा है। ‘धधकता क्रोध’ उसके अग्निमय रूपक और प्रबलता दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: प्रभु
  rationale: इब्रानी पाठ में चार-अक्षरी व्यक्तिगत नाम יהוה स्पष्ट रूप से आया है; इसलिए उसे उपाधि में बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- issue: इब्रानी और विस्तृत यूनानी पाठ के बीच अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी के छोटे पाठ का अनुवाद
  alternative: यूनानी विस्तार के चिह्नों और ज्वाला की आग का विवरण मुख्य पाठ में जोड़ना
  rationale: इस स्थान पर इब्रानी पाठ उपलब्ध और स्पष्टतः छोटा है। यूनानी समानांतर विनाश के अर्थ को पुष्ट करता है, पर उसकी अतिरिक्त बातें इब्रानी मुख्य पाठ में आयात नहीं की गईं।
- issue: पद-सीमा
  choice: (יט) के बाद के शब्दों को सिराख 45:19 माना गया
  alternative: दातान, अबीराम और कोरह की मंडली वाला पूर्ववर्ती खंड भी पद 19 में शामिल करना
  rationale: दिए गए इब्रानी साक्ष्य में पद-संख्या (יט) ‘וירא יהוה’ से ठीक पहले है, और यूनानी 45:19 भी न्याय-वर्णन से आरंभ होता है। इसलिए संख्या से पहले का खंड पिछले पद का अंत माना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम इब्रानी की क्रमिक क्रियाओं में दर्शन और दंड के बीच स्वाभाविक संबंध दिखाता है। दिए गए स्रोत में (יט) से पहले दातान, अबीराम और कोरह का उल्लेख पिछले पद का अंश है, इसलिए उसे मुख्य अनुवाद में शामिल नहीं किया गया।
