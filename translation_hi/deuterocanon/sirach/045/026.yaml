base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/026.yaml
  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: hi
  text: और अब[a], कृपया यहोवा को, जो भला है, धन्य कहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ है: “और अब, कृपया यहोवा को, जो भला है, धन्य कहो।” इसके स्थान पर यूनानी साक्षी का पाठ बहुत भिन्न है: “वह तुम्हारे हृदय में बुद्धि दे, ताकि तुम धार्मिकता से उसकी प्रजा का न्याय करो, जिससे उनकी अच्छी वस्तुएँ न मिटें और उनकी महिमा उनकी पीढ़ियों तक बनी रहे।”'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह समय-सूचक और कथन को जोड़ने वाला पद है; ‘और अब’ इब्रानी के संयोजक बल को बनाए रखता है।
- source_word: בָּרֲכוּ־נָא
  choice: कृपया ... को धन्य कहो
  rationale: बहुवचन आज्ञार्थक रूप के साथ נָא विनम्र आग्रह व्यक्त करता है। हिन्दी में परमेश्वर को ‘धन्य कहो’ स्वाभाविक रूप से स्तुति/आशीर्वचन का भाव देता है और ‘कृपया’ आग्रह को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में सीधे चार-अक्षरीय दिव्य नाम YHWH है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को उपाधि से अलग बनाए रखता है।
- source_word: הַטּוֹב
  choice: जो भला है
  rationale: निश्चयवाचक विशेषण यहाँ दिव्य नाम के साथ गुणवाचक/संज्ञात्मक प्रयोग में है। ‘जो भला है’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δόῃ ὑμῖν σοφίαν ...
  choice: मुख्य पाठ में ग्रहण नहीं किया गया
  rationale: यूनानी साक्षी का पाठ उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ से अत्यंत भिन्न है। इसलिए मुख्य पाठ इब्रानी पर आधारित है और यूनानी पाठ को महत्वपूर्ण पाठांतर के रूप में पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में उपाधि नहीं, बल्कि YHWH नाम स्वयं आया है। ‘यहोवा’ हिन्दी पाठक के लिए पहचाना हुआ नामरूप है और मूल की नामात्मकता बनाए रखता है।
- issue: इब्रानी और यूनानी साक्षियों का संबंध
  choice: मुख्य पाठ में उपलब्ध इब्रानी उपदेश; यूनानी पाठ पादटिप्पणी में
  alternative: यूनानी आशीर्वचन को मुख्य पाठ बनाना या दोनों पाठों को मिला देना
  rationale: इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए उसे प्राथमिकता दी गई है। यूनानी का बहुत भिन्न पाठ पारदर्शिता के लिए पूरा सार्थक पाठांतर बनकर पादटिप्पणी में रखा गया है।
- issue: הַטּוֹב की व्याख्या
  choice: जो भला है
  alternative: भले जन / भले यहोवा
  rationale: यह अनुवाद विशेषण के गुणवाचक बल को बनाए रखता है, पर उसे अलग उपाधि या अतिरिक्त धार्मिक पदवी नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘धन्य कहो’ को ‘आशीष दो’ पर वरीयता दी गई, क्योंकि परमेश्वर की ओर संबोधित בָּרַךְ यहाँ स्तुति/धन्य-वचन का भाव रखता है। बहुवचन आज्ञा हिन्दी के रूप में संदर्भतः सामान्य सामूहिक संबोधन बनी रहती है।
