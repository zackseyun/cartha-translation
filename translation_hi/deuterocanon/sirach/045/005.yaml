base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: hi
  text: उसने उसे अपनी वाणी सुनने दी और उसे घने अंधकार में अपने पास ले आया। उसने उसके हाथ में आज्ञा[a]—जीवन और समझ की व्यवस्था—सौंपी, ताकि वह याकूब को अपने विधि-विधान और इस्राएल को अपनी साक्षियाँ और न्याय-विधान सिखाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘आज्ञा’ के स्थान पर ‘आज्ञाएँ’ है।
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में है, ‘ताकि वह याकूब को वाचा और इस्राएल को उसके न्याय-विधान सिखाए’; इब्रानी में ‘अपने विधि-विधान ... अपनी साक्षियाँ और न्याय-विधान’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: उसने उसे अपनी वाणी सुनाई
  rationale: שמע के हिफ़ील रूप का कारक अर्थ ‘सुनाना/सुनने देना’ है। ‘अपनी वाणी सुनाई’ आधुनिक हिन्दी में स्वाभाविक है और यह बनाए रखता है कि परमेश्वर ने मूसा को अपनी वाणी सुनने दी।
- source_word: ויגישהו לערפל
  choice: उसे घने अंधकारमय बादल के पास ले गया
  rationale: נגש के हिफ़ील का अर्थ ‘निकट लाना’ है और ערפל सीनै पर ईश्वरीय प्रकटता से जुड़ा घना अंधकार अथवा काला बादल सूचित करता है। ‘के पास ले गया’ निकट लाने के भाव को रखता है; ‘घना अंधकारमय बादल’ दृश्य की दोनों विशेषताएँ व्यक्त करता है।
- source_word: מצוה
  choice: एक आज्ञा
  rationale: इब्रानी में शब्द एकवचन है, इसलिए यूनानी के बहुवचन के बजाय मुख्य पाठ में एकवचन रखा गया है। हिन्दी में ‘एक आज्ञा’ अनिश्चित एकवचन को सहज रूप से व्यक्त करता है।
- source_word: תורת חיים ותבונה
  choice: जीवन और समझ की व्यवस्था
  rationale: सीनै और आज्ञा के प्रसंग में תורה के लिए ‘व्यवस्था’ उपयुक्त है। תבונה का अर्थ समझ अथवा विवेक है; ‘समझ’ मूल इब्रानी के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ללמד ביעקב חוקיו
  choice: ताकि वह याकूब को उसके विधि-विधान सिखाए
  rationale: क्रियार्थक रूप उद्देश्य बताता है। יעקב के साथ ב को हिन्दी में शिक्षण के कर्म के रूप में स्वाभाविक ढंग से व्यक्त किया गया है। חוקים के स्थिर नियमों का भाव ‘विधि-विधान’ से आता है।
- source_word: ועדותיו ומשפטיו לישראל
  choice: और इस्राएल को उसकी साक्षियाँ और न्याय-विधान
  rationale: עדותיו का शाब्दिक वाचा-संबंधी अर्थ ‘उसकी साक्षियाँ’ रखा गया है; משפטיו के न्यायिक अर्थ को ‘न्याय-विधान’ व्यक्त करता है। यूनानी का भिन्न पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ערפל की ईशप्रकाशन-संबंधी छवि
  choice: घना अंधकारमय बादल
  alternative: घना अंधकार; धुँधलका
  rationale: यह सीनै पर परमेश्वर की प्रकटता के छिपे और भयप्रद परिवेश को दर्शाता है। अनुवाद अंधकार तथा बादल—दोनों संभावित छवियों को साथ रखता है, बिना उनकी प्रकृति का अतिरिक्त धर्मवैज्ञानिक निर्धारण किए।
- issue: इब्रानी और यूनानी में विधिक शब्दावली का अंतर
  choice: एक आज्ञा ... उसकी साक्षियाँ और न्याय-विधान
  alternative: आज्ञाएँ ... वाचा और न्याय-विधान
  rationale: जहाँ उच्च-विश्वसनीयता वाला इब्रानी पाठ उपलब्ध है, मुख्य पाठ उसका अनुसरण करता है। यूनानी के वास्तविक पाठांतर—बहुवचन ‘आज्ञाएँ’ और ‘वाचा’—को पादटिप्पणियों में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु बाइबलीय गरिमा बनाए रखने के लिए ‘वाणी’, ‘व्यवस्था’, ‘विधि-विधान’, ‘साक्षियाँ’ और ‘न्याय-विधान’ जैसे पद रखे गए हैं। वाक्य सामान्य पाठक के लिए प्रवाहपूर्ण है और इब्रानी की विधिक समानांतरता को यथासंभव सुरक्षित रखता है।
