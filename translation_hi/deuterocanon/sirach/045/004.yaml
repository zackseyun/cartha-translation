  yaml_path: translation/deuterocanon/sirach/045/004.yaml
  text: In his faithfulness and humility[a], he chose him from all flesh.
translation:
  language: hi
  text: उसकी विश्वासयोग्यता और नम्रता के कारण,[a] उसने उसे समस्त प्राणियों में से चुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “उसके विश्वास और नम्रता में उसने उसे पवित्र ठहराया; उसने उसे समस्त प्राणियों में से चुना।” हिब्रू साक्ष्य में यूनानी का स्पष्ट वाक्यांश “उसने उसे पवित्र ठहराया” नहीं है; यूनानी के अनुसार “विश्वासयोग्यता” के स्थान पर “विश्वास” भी अनुवाद किया जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: उसकी विश्वासयोग्यता के कारण
  rationale: אֱמוּנָה विश्वास या विश्वासयोग्यता दोनों का बोध करा सकता है। यहाँ नम्रता के साथ मूसा के चरित्र की प्रशंसा हो रही है, इसलिए ‘विश्वासयोग्यता’ स्वाभाविक है। उपसर्ग ב को प्रसंगानुसार कारणसूचक ‘के कारण’ के रूप में व्यक्त किया गया है।
- source_word: ובענותו
  choice: और नम्रता
  rationale: עֲנָוָה नम्रता, दीनता या मृदुता का बोध कराता है। आधुनिक मानक हिन्दी में ‘नम्रता’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: בחר בו
  choice: उसने उसे चुन लिया
  rationale: בחר ב־ का मुहावरेदार अर्थ किसी को चुनना है। हिन्दी में ‘उसे चुन लिया’ इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מכל בשר
  choice: सभी मनुष्यों में से
  rationale: शाब्दिक अर्थ ‘समस्त देह में से’ है, पर यहाँ בשר नश्वर मानवजाति के लिए प्रयुक्त है। ‘सभी मनुष्यों में से’ हिन्दी में अर्थ को स्पष्ट रखते हुए सार्वभौमिक दायरा सुरक्षित रखता है।
theological_decisions:
- issue: אמונה / πίστις का अर्थ
  choice: विश्वासयोग्यता
  alternative: विश्वास
  rationale: हिब्रू पाठ प्राथमिक है और नम्रता के साथ एक प्रशंसनीय चारित्रिक गुण का वर्णन करता है। फिर भी यूनानी πίστις ‘विश्वास’ का समर्थन कर सकता है; इसलिए इस वैकल्पिक अर्थ को पाद-टिप्पणी में रखा गया है।
- issue: यूनानी समानांतर में अतिरिक्त क्रिया ἡγίασεν
  choice: मुख्य पाठ में ‘उसने उसे पवित्र ठहराया’ को शामिल नहीं किया गया
  alternative: ‘उसने उसे पवित्र ठहराया; उसने उसे... चुन लिया’
  rationale: प्रमाणित हिब्रू पाठ में यह स्पष्ट क्रिया नहीं है। उसे मुख्य पाठ में जोड़ना हिब्रू साक्ष्य का विस्तार होता; यूनानी पाठांतर को पाद-टिप्पणी में पूरा बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘सभी मनुष्यों में से’ को शाब्दिक ‘समस्त देह में से’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक माना गया है।
