base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/011.yaml
  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: hi
  text: वक्षपट पर बहुमूल्य रत्न थे, जो मुहर की तरह खुदे हुए और जड़ावों में जड़े थे[a]—प्रत्येक बहुमूल्य रत्न स्मरणार्थ था, और उस पर इस्राएल के पुत्रों की संख्या के अनुसार लेख खुदा हुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में स्पष्ट रूप से “सोने की जड़ाई में” कहा गया है; यहाँ इब्रानी पाठ केवल जड़ावों का संकेत देता है।
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में “इस्राएल के गोत्रों की संख्या के अनुसार” है। इब्रानी पाठ-साक्ष्य में “इस्राएल के पुत्रों” है, जो संभवतः रत्नों पर अंकित गोत्रों के नामों की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: बहुमूल्य रत्न
  rationale: यह इब्रानी पद अत्यधिक मूल्यवान और मनोहर पत्थरों को दर्शाता है; याजकीय परिधान के प्रसंग में ‘बहुमूल्य रत्न’ स्वाभाविक और सटीक है। यूनानी πολυτελέσιν भी ‘बहुमूल्य’ अर्थ का समर्थन करता है।
- source_word: החשן
  choice: वक्षपट
  rationale: याजकीय परिधान में חשן महायाजक के सीने पर पहने जाने वाले रत्नजटित पट को दर्शाता है। ‘वक्षपट’ इसे युद्ध-कवच समझे जाने से बचाता है।
- source_word: פתוחי חותם
  choice: मुहर की तरह खुदे हुए
  rationale: यह मुहर या मुद्रिका पर की जाने वाली नक्काशी जैसी खुदाई बताता है। यूनानी γλύμματος σφραγῖδος भी इसी अर्थ की पुष्टि करता है।
- source_word: במלואים
  choice: जड़ावों में जड़े थे
  rationale: रत्नों के प्रसंग में यह पद उन जड़ावों या खाँचों की ओर संकेत करता है जिनमें रत्न लगाए गए थे। इब्रानी में सोने का स्पष्ट उल्लेख नहीं है, इसलिए मुख्य पाठ में ‘सोने’ को नहीं जोड़ा गया।
- source_word: לזכרון
  choice: स्मरण के लिए
  rationale: यह पद साधारण याद के साथ उपासना-संबंधी स्मारक भाव भी रखता है। ‘स्मरण के लिए’ अर्थ को स्पष्ट रखता है, बिना उसका विस्तार किए।
- source_word: בכתב חרות
  choice: लेख खुदा था
  rationale: इब्रानी में लिखित अक्षरों को खोदकर अंकित करने का भाव है। यह हिंदी में लेख और उत्कीर्णन दोनों को संक्षेप में व्यक्त करता है।
- source_word: למספר בני ישראל
  choice: इस्राएल के पुत्रों की संख्या के अनुसार
  rationale: उपलब्ध इब्रानी साक्ष्य में ‘इस्राएल के पुत्र’ है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी में ‘इस्राएल के गोत्र’ है, जिसे पाठांतर के रूप में टिप्पणी में रखा गया है।
theological_decisions:
- issue: खुदे हुए रत्नों का स्मारक-संबंधी अभिप्राय
  choice: प्रत्येक रत्न इस्राएल के पुत्रों का स्मरण कराने वाला था और उनकी संख्या के अनुसार खुदा था।
  alternative: इसे केवल बहुमूल्य कारीगरी का वर्णन माना जा सकता है, या यूनानी के अनुसार सीधे इस्राएल के गोत्रों से जोड़ा जा सकता है।
  rationale: इब्रानी לזכרון और यूनानी εἰς μνημόσυνον दोनों स्मरण के अभिप्राय को स्पष्ट करते हैं। फिर भी ‘पुत्रों’ और ‘गोत्रों’ के पाठांतर को मुख्य पाठ में मिलाकर तनाव समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वक्षपट’ याजकीय परिधान का तकनीकी किंतु स्पष्ट शब्द है। ‘जड़ावों में जड़े’ हिंदी की स्वाभाविक पुनरुक्ति है, जो पत्थरों की माउंटिंग को साफ़ व्यक्त करती है।
