base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/017.yaml
  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: hi
  text: और उसने उसे अपनी आज्ञाएँ दीं[a] और विधि तथा न्याय के विषय में उसे अधिकार दिया, ताकि वह याकूब को उसकी साक्षियों की शिक्षा दे और इस्राएल को उसकी व्यवस्था से ज्योति दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इस पद का इब्रानी पाठ संक्षिप्त है: “और उसने उसे अपनी आज्ञाएँ दीं और विधि तथा न्याय के विषय में उसे अधिकार दिया।” इसके बाद के शब्द—“ताकि वह याकूब को उसकी साक्षियों की शिक्षा दे और इस्राएल को उसकी व्यवस्था से ज्योति दे”—यूनानी पाठ में सुरक्षित हैं और यहाँ शामिल किए गए हैं, क्योंकि इब्रानी पंक्ति संक्षिप्त हुई प्रतीत होती है।'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: और उसने उसे अपनी आज्ञाएँ दीं
  rationale: נתן का सीधा अर्थ ‘देना’ रखा गया है; ‘आज्ञाएँ’ מצות के वाचा-संबंधी और विधिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। आरम्भिक ו को ‘और’ से दर्शाया गया है।
- source_word: וימשילהו
  choice: और ... उसे अधिकार दिया
  rationale: हिफ़ील रूप यहाँ किसी को शासन या अधिकार सौंपने का भाव देता है। याजकीय-विधिक प्रसंग में ‘अधिकार दिया’ राजपद का अनावश्यक संकेत दिए बिना प्रत्यायोजित अधिकार व्यक्त करता है।
- source_word: בחוק ומשפט
  choice: विधि तथा न्याय के विषय में
  rationale: חוק ומשפט विधिक-वाचा संबंधी युग्म है। संक्षिप्त इब्रानी पूर्वसर्ग ב को हिन्दी में स्वाभाविक रूप से ‘के विषय में’ कहा गया है, जिससे इसी विधिक क्षेत्र में मिले अधिकार का अर्थ निकलता है।
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: ताकि वह याकूब को उसकी साक्षियाँ सिखाए
  rationale: यूनानी समानांतर में सुरक्षित उद्देश्य-वाक्य को सम्मिलित किया गया है। ‘साक्षियाँ’ μαρτύρια की वाचा-विधिक शब्दावली और उसके गवाही-संबंधी रूपक को बनाए रखता है।
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: और उसकी व्यवस्था के द्वारा इस्राएल को प्रकाश दे
  rationale: ‘व्यवस्था’ νόμος के धार्मिक-विधिक अर्थ को व्यक्त करता है और ‘प्रकाश दे’ φωτίζω के रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है। ‘के द्वारा’ यूनानी ἐν के साधनार्थक भाव को स्पष्ट करता है।
theological_decisions:
- issue: मौजूदा इब्रानी पाठ से अनुपस्थित यूनानी उद्देश्य-वाक्यों का उपयोग
  choice: याकूब को सिखाने और इस्राएल को प्रकाश देने वाले यूनानी-समर्थित वाक्यांश मुख्य पाठ में शामिल किए गए।
  alternative: 'केवल मौजूदा इब्रानी का अनुवाद: ‘और उसने उसे अपनी आज्ञाएँ दीं और विधि तथा न्याय के विषय में उसे अधिकार दिया।’'
  rationale: काहाना का संयुक्त काहिरा गनीज़ा इब्रानी पाठ यहाँ छोटा है और स्रोत को ‘major_mismatch’ चिह्नित किया गया है। यूनानी साक्षी एक सुसंगत, प्रसंगानुकूल विस्तार सुरक्षित रखता है। पाठ-साक्ष्य की स्थिति पादटिप्पणी में स्पष्ट की गई है।
- issue: सर्वनामों के संदर्भ को नामों से स्पष्ट करना
  choice: मूल के समान ‘उसने’, ‘उसे’ और ‘उसकी’ रखा गया।
  alternative: स्पष्टता के लिए ‘परमेश्वर’ और ‘हारून’ नाम जोड़ना।
  rationale: इस एक पद के मूल पाठ में नाम नहीं हैं। नाम जोड़ने से संदर्भ स्पष्ट होता, पर वह अनुवाद के भीतर व्याख्यात्मक विस्तार भी होता; इसलिए मूल की सर्वनाम-संरचना और संभावित संदर्भगत तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी रखी गई है। ‘विधि’, ‘न्याय’, ‘साक्षियाँ’ और ‘व्यवस्था’ से मूल की वाचा-विधिक शैली बनी रहती है; वाक्य को अत्यधिक संस्कृतनिष्ठ बनाने से बचाया गया है।
