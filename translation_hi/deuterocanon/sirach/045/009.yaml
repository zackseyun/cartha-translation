translation:
  language: hi
  text: और चारों ओर बहुत-से अनार[a], ताकि उसके कदमों के साथ ध्वनि उत्पन्न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ अधिक विस्तृत है: “और उसने उसे अनारों और चारों ओर बहुत-सी सोने की घंटियों से घेर दिया, ताकि उसके कदमों पर सुनाई देने वाली ध्वनि हो…” यहाँ उपलब्ध इब्रानी पाठ छोटा है और केवल अनारों तथा उसके कदमों के साथ होने वाली ध्वनि का उल्लेख करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: और ... अनार
  rationale: इब्रानी में ठोस संज्ञा ‘अनार’ है; संदर्भ में ये महायाजक के वस्त्र पर बने अनाराकार अलंकरण हैं, पर मुख्य पाठ में उस व्याख्या को जोड़ने के बजाय मूल बिंब रखा गया है।
- source_word: המון סביב
  choice: चारों ओर बहुत-से
  rationale: המון बहुलता और סביב चारों ओर की स्थिति व्यक्त करता है। यह हिन्दी पदक्रम दोनों अर्थों को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: לתת נעינה
  choice: ताकि ... मधुर ध्वनि हो
  rationale: לתת यहाँ उद्देश्य बताता है। दुर्लभ נעינה संगीतमय ध्वनि की ओर संकेत करता है; ‘मधुर ध्वनि’ उस भाव को रखता है, पर इब्रानी में अनुपस्थित ‘घंटियाँ’ मुख्य पाठ में नहीं जोड़ता।
- source_word: בצעדיו
  choice: उसके कदमों के साथ
  rationale: ב यहाँ चलने के साथ उत्पन्न होने वाली ध्वनि का संबंध बताता है। आधुनिक हिन्दी में ‘कदमों के साथ’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: संक्षिप्त इब्रानी पाठ और विस्तृत यूनानी समानांतर पाठ के बीच अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी शब्दावली का अनुसरण किया गया है और विस्तृत यूनानी पाठ को पाद-टिप्पणी में दिया गया है।
  alternative: ‘और उसने उसे अनारों और चारों ओर बहुत-सी सोने की घंटियों से घेर दिया, ताकि उसके कदमों पर सुनाई देने वाली ध्वनि हो…’
  rationale: उपलब्ध इब्रानी साक्ष्य में केवल अनार और कदमों के साथ होने वाली ध्वनि का उल्लेख है। यूनानी में घंटियों, मन्दिर में सुनाई देने वाली ध्वनि और स्मरण का विस्तृत पाठ है। इस अंतर को चुपचाप मिलाने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में है। पद एक पूर्ववर्ती वाक्य का क्रम जारी रखता है, इसलिए आरम्भ का ‘और’ बनाए रखा गया है। ‘मधुर ध्वनि’ संगीतमय अर्थ को व्यक्त करता है, जबकि ‘घंटियाँ’ केवल यूनानी पाठ की पाद-टिप्पणी में रखी गई हैं।
