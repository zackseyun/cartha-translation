base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/003.yaml
  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: hi
  text: उसके वचन से चिह्न शीघ्र प्रकट हुए[a], और उसने राजा के सामने उसे सामर्थी बनाया[b]। उसने उसे लोगों के विषय में आज्ञाएँ दीं, और उसे अपनी महिमा दिखाई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ है, “उसके वचनों से उसने चिह्नों को रोक दिया,” न कि “चिह्न शीघ्र प्रकट हुए।”
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में “उसने राजाओं के सामने उसे महिमान्वित किया” है; इब्रानी में “राजा के सामने उसे सामर्थी बनाया” है।
    reason: textual_variant
  - marker: c
    text: यहाँ इब्रानी पाठ कठिन है और जैसा लिखा है उसका अर्थ “उन्होंने उसकी महिमा देखी” हो सकता है; यूनानी पाठ “उसने उसे अपनी महिमा दिखाई” का समर्थन करता है, जिसे मुख्य पाठ में अपनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: उसके वचन पर
  rationale: ב־ को यहाँ अवसर/साधन के अर्थ में लिया गया है। हिन्दी में एकवचन ‘वचन’ स्वाभाविक है और इब्रानी पद का आशय बनाए रखता है।
- source_word: האותות
  choice: चिह्न
  rationale: אותות का सीधा और व्यापक अर्थ ‘चिह्न’ है; ‘चमत्कार’ कहने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- source_word: מהרו
  choice: शीघ्र प्रकट हुए
  rationale: क्रिया में शीघ्रता का भाव है। ‘चिह्न शीघ्र हुए’ अस्वाभाविक होता, इसलिए प्रसंगानुकूल ‘शीघ्र प्रकट हुए’ चुना गया।
- source_word: ויחזקהו
  choice: उसने ... उसे सामर्थी बनाया
  rationale: हिफ़ील חזק का अर्थ ‘बलवान/सामर्थी बनाना’ है। यह इब्रानी पाठ को यूनानी के ‘महिमान्वित किया’ पर प्राथमिकता देता है।
- source_word: לפני מלך
  choice: राजा के सामने
  rationale: इब्रानी में מלך एकवचन और अनिश्चित है; हिन्दी में बिना परिमाणवाचक शब्द के ‘राजा के सामने’ अधिक स्वाभाविक है और अनावश्यक रूप से ‘उस राजा’ नहीं बनाता।
- source_word: ויצוהו אל העם
  choice: उसने लोगों के विषय में उसे आज्ञा दी
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है। कठिन संबंधसूचक אל को प्रसंग में ‘लोगों के विषय में’ समझना सहज है और यूनानी समानांतर भी इसी दिशा का समर्थन करता है।
- source_word: ויראו את כבודו
  choice: और उसे अपनी महिमा दिखाई
  rationale: प्रेषित इब्रानी रूप शाब्दिक रूप से ‘और उन्होंने उसकी महिमा देखी’ का संकेत दे सकता है, किंतु वाक्य कठिन है। यूनानी पाठ ‘उसने उसे अपनी महिमा दिखाई’ का स्पष्ट समर्थन करता है; पाठभेद पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: इब्रानी और यूनानी में बड़े पाठांतर
  choice: जहाँ इब्रानी स्पष्ट है वहाँ उसे मुख्य पाठ में रखा गया; अंतिम खंड में कठिन इब्रानी के स्थान पर यूनानी-समर्थित अर्थ लिया गया।
  alternative: पूरे पद को यूनानी के अनुसार अनूदित करना, अथवा अंतिम खंड में ‘उन्होंने उसकी महिमा देखी’ रखना।
  rationale: उपलब्ध इब्रानी साक्ष्य प्राथमिक है, पर अंतिम खंड का संप्रेषित रूप कठिन है। यूनानी समानांतर संभावित मूल अर्थ को स्पष्ट करता है; सभी महत्वपूर्ण भेद पादटिप्पणियों में दिए गए हैं।
- issue: कर्ता-सर्वनामों की पहचान
  choice: संदर्भानुसार परमेश्वर कर्ता और मूसा कर्म है, पर नाम मुख्य पाठ में नहीं जोड़े गए।
  alternative: स्पष्टता के लिए ‘परमेश्वर’ और ‘मूसा’ नाम जोड़ना।
  rationale: मूल पद सर्वनामों का प्रयोग करता है। नाम जोड़ने से अस्पष्टता मिट जाती, इसलिए मूल की शैली और तनाव बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और पाठनयोग्य रूप। ‘चिह्न’, ‘सामर्थी’ और ‘महिमा’ जैसे पारंपरिक बाइबिलीय शब्द रखे गए हैं, पर वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
