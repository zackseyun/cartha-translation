base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: hi
  text: 'और उसकी वाचा यिशै के पुत्र, यहूदा के गोत्र के दाऊद के साथ थी: राजा की विरासत केवल एक पुत्र को, पीढ़ी-दर-पीढ़ी, मिलती है, पर हारून की विरासत उसकी संतति को भी मिलती है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का उपलब्ध इब्रानी साक्ष्य छोटा और संकुचित प्रतीत होता है; उसमें उसके और उसकी संतति के लिए सदा की महायाजकी का उल्लेख है। यूनानी समानांतर पूरा विरोध सुरक्षित रखता है: राजा की विरासत एक ही वंश-रेखा में केवल एक पुत्र को पीढ़ी-दर-पीढ़ी मिलती है, जबकि हारून की विरासत उसकी संतति को मिलती है।'
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: और उसकी वाचा दाऊद के साथ भी थी
  rationale: וגם के ‘और/भी’ दोनों भावों तथा בריתו के संबंधवाचक प्रत्यय को बनाए रखा गया है। ‘उसकी’ का संदर्भ प्रसंगानुसार परमेश्वर से है, पर मुख्य पाठ में उसे स्पष्ट करके वास्तविक अस्पष्टता नहीं हटाई गई।
- source_word: בן ישי למטה יהודה
  choice: जो यिशै का पुत्र और यहूदा के गोत्र से था
  rationale: בן ישי को सामान्य पितृनाम के रूप में और מטה को वंशावली-संदर्भ में ‘गोत्र’ के रूप में प्रस्तुत किया गया है। हिंदी में संबंध स्पष्ट करने के लिए ‘जो...था’ जोड़ा गया है।
- source_word: κληρονομία βασιλέως
  choice: राजा की विरासत
  rationale: κληρονομία का सीधा अर्थ ‘विरासत’ रखा गया है और ‘राजा’ की ठोस संज्ञा बनाए रखी गई है, जिससे आगे हारून के साथ समानांतरता बनी रहती है।
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: केवल पुत्र से पुत्र को
  rationale: यूनानी में सुरक्षित एकल वंशानुक्रम और μόνου की विशिष्टता को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: पर हारून की विरासत उसकी संतति को भी मिलती है
  rationale: यूनानी के संतुलित विरोध को ‘पर’ से व्यक्त किया गया है। σπέρμα का वंशगत अर्थ ‘संतति’ से दिया गया है; ‘भी’ καί का भाव रखता है।
theological_decisions:
- issue: संक्षिप्त/असंगत इब्रानी साक्ष्य और विस्तृत यूनानी समानांतर का उपयोग
  choice: जहाँ इब्रानी उपलब्ध है वहाँ उसके वाक्यांश को आधार बनाया गया है, और राजकीय तथा हारूनी विरासत का पूरा विरोध यूनानी समानांतर से लिया गया है।
  alternative: केवल उपलब्ध इब्रानी का अनुवाद करना, जिससे वचन छोटा और अचानक समाप्त होता; अथवा पूरे वचन में केवल यूनानी का अनुसरण करना।
  rationale: दिए गए इब्रानी साक्ष्य को major_mismatch चिह्नित किया गया है और वह संकुचित प्रतीत होता है। यूनानी पाठ पूर्ण समानांतर संरचना सुरक्षित रखता है; इसलिए दोनों साक्ष्यों का उपयोग पाठगत तनाव को टिप्पणी में खुला रखते हुए किया गया है।
- issue: ‘उसकी वाचा’ में संबंधवाचक सर्वनाम का संदर्भ
  choice: ‘उसकी वाचा’ रखा गया है।
  alternative: ‘परमेश्वर की वाचा’ लिखकर संदर्भ स्पष्ट करना।
  rationale: इब्रानी בריתו में संदर्भ प्रसंग से समझा जाता है। मुख्य पाठ में ‘परमेश्वर’ जोड़ना निहित अर्थ को स्पष्ट तो करता, पर मूल की व्याकरणिक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वाचा’, ‘गोत्र’, ‘विरासत’ और ‘संतति’ जैसे परिचित बाइबिलीय शब्द प्रयुक्त हुए हैं। वाक्य की समानांतर संरचना राजकीय उत्तराधिकार और हारूनी याजकत्व के बीच पाठगत विरोध को स्पष्ट रखती है।
