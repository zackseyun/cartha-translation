base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: hi
  text: पवित्र वस्तुओं में से उत्तम रोटी उसने उसे दी[a]; वे याहवे के अग्नि-अर्पणों में से खाएँगे[b]। उपस्थिति की रोटी[c] उसका भाग है—उसके और उसके वंश के लिए एक दान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “पवित्र वस्तुओं का प्रथम अंश उसने उसे रोटी के रूप में दिया।” इब्रानी वाक्य बहुत संक्षिप्त है; यूनानी समानांतर पाठ इसे याहवे की बलियों के रूप में व्यापक करता है।'
    reason: lexical_alternative
  - marker: b
    text: “अग्नि-अर्पण” आग पर चढ़ाए जाने वाले बलि-अर्पणों के लिए प्रयुक्त इब्रानी शब्द है; याजक उनमें से अपना नियत खाद्य भाग खाते थे।
    reason: lexical_alternative
  - marker: c
    text: “उपस्थिति की रोटी” वह पवित्र रोटी थी जो परमेश्वर के सामने रखी जाती थी; इसे परंपरागत रूप से “भेंट की रोटी” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ראשית קדש
  choice: पवित्र वस्तुओं में से उत्तम
  rationale: ראשית यहाँ पवित्र वस्तुओं के प्रथम अथवा श्रेष्ठ अंश का संकेत देता है। संदर्भ याजकों को मिलने वाले पवित्र भाग का है; इसलिए ‘उत्तम’ प्राथमिकता और श्रेष्ठता, दोनों की संभावित छाया बनाए रखता है।
- source_word: לחם
  choice: रोटी
  rationale: इब्रानी पाठ में स्पष्ट रूप से ‘रोटी’ है। यूनानी समानांतर पाठ अर्थ को बलियों तक विस्तृत करता है, पर उपलब्ध इब्रानी साक्ष्य को प्रधान रखते हुए ‘रोटी’ रखा गया है।
- source_word: אשי יהוה
  choice: याहवे के अग्नि-अर्पण
  rationale: אשי बलिवेदी की आग पर चढ़ाए जाने वाले अर्पणों के लिए पारिभाषिक शब्द है। ‘अग्नि-अर्पण’ उसके उपासना-संबंधी अर्थ को बनाए रखता है, जबकि ‘में से खाएँगे’ स्पष्ट करता है कि याजकों को इन अर्पणों का खाद्य भाग मिलता था।
- source_word: יאכלון
  choice: वे ... खाएँगे
  rationale: बहुवचन क्रिया हारून के साथ उसके याजकीय वंश को भी सम्मिलित करती है। भविष्यत् रूप विधिक रूप से दिए गए स्थायी अधिकार की ध्वनि रखता है।
- source_word: לחם פנים
  choice: उपस्थिति की रोटी
  rationale: यह परमेश्वर के सामने रखी जाने वाली पवित्र रोटी का पारिभाषिक नाम है। ‘उपस्थिति की रोटी’ इब्रानी अभिव्यक्ति के निकट और अर्थ की दृष्टि से पारदर्शी है।
- source_word: חלקו
  choice: उसका भाग
  rationale: यह किसी को नियत किए गए हिस्से या अधिकार का बोध कराता है।
- source_word: ומתנה לו ולזרעו
  choice: उसके और उसके वंश के लिए एक वरदान
  rationale: מתנה प्रदत्त दान या अनुदान है और זרעו यहाँ हारून की याजकीय वंश-परंपरा को सूचित करता है। ‘वंश’ इस सामूहिक और निरंतर अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी में चार-अक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: याजकीय पवित्र अंशों की शब्दावली
  choice: अग्नि-अर्पण / उपस्थिति की रोटी
  alternative: भोजन-अर्पण / भेंट की रोटी
  rationale: चुने हुए शब्द मूल इब्रानी के बलि और पवित्रस्थान-संबंधी अर्थ को बनाए रखते हैं। पाठ यह नहीं बताता कि हारून का अधिकार बलि की समूची वस्तु पर था; ‘में से’ याजकों को मिलने वाले खाद्य भाग को स्वाभाविक ढंग से व्यक्त करता है।
- issue: ראשית का अर्थ
  choice: उत्तम
  alternative: प्रथम / पहिला फल
  rationale: शब्द में प्रथम और श्रेष्ठ, दोनों अर्थ संभव हैं। प्रसंग में नियत श्रेष्ठ पवित्र भाग अधिक स्वाभाविक है, पर वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी रखी गई है। बलि-विधान की पारिभाषिकता बचाने के लिए ‘अग्नि-अर्पण’ और ‘उपस्थिति की रोटी’ प्रयुक्त हुए हैं। इब्रानी की संक्षिप्तता को अत्यधिक स्पष्ट करके उसकी संभावित अर्थ-छायाओं को बंद नहीं किया गया है।
