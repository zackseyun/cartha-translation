base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: hi
  text: 'दो बातों के कारण मेरा हृदय दुःखी है, और तीसरी बात पर मुझ पर क्रोध आ पड़ा है: निर्धनता के कारण अभाव में पड़ा हुआ योद्धा; विवेकी पुरुष, यदि उनके साथ कूड़े की तरह व्यवहार किया जाए[a]; और वह जो धार्मिकता से फिरकर पाप की ओर जाता है—प्रभु उसे तलवार के लिए तैयार करेगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यदि उन्हें कचरे के समान फेंक दिया जाए’ अथवा ‘गोबर के समान समझा जाए’; यूनानी क्रिया त्याज्य कूड़े के शब्द से बनी है और अपमानपूर्वक गिराए जाने का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम एकवचन ‘उसे’ का सबसे स्वाभाविक सम्बन्ध उस व्यक्ति से है जो धार्मिकता से फिरकर पाप की ओर जाता है; फिर भी यूनानी सूची की वाक्य-रचना संक्षिप्त है, इसलिए न्याय के इस कथन को पूरी उक्ति के सार के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ λελύπηται ἡ καρδία μου
  choice: दो बातों से मेरा हृदय दुःखी है
  rationale: ἐπί के साथ कारणसूचक भाव और λυπέω के पूर्णकाल से बनी वर्तमान दुःख की अवस्था—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θυμός μοι ἐπῆλθεν
  choice: मुझ पर क्रोध छा गया है
  rationale: क्रोध के वक्ता पर आ पड़ने के सजीव भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: ऐसा योद्धा जो निर्धनता के कारण अभाव में पड़ गया हो
  rationale: ὑστερέω के कमी या अभाव में होने और ἔνδεια के निर्धनता-सूचक कारण, दोनों को बिना अनावश्यक अर्थ-विस्तार के व्यक्त करता है।
- source_word: ἄνδρες συνετοὶ
  choice: समझदार पुरुष
  rationale: संज्ञा के पुल्लिंग बहुवचन और συνετός के समझ-बूझ तथा विवेक के अर्थ को सुरक्षित रखता है।
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: यदि उन्हें कूड़े के समान तुच्छ समझा जाए
  rationale: σκύβαλον से जुड़े कूड़े या त्याज्य वस्तु के बिंब तथा अपमानजनक व्यवहार, दोनों को गरिमापूर्ण किन्तु प्रभावी हिन्दी में रखता है।
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: वह जो धार्मिकता से फिरकर पाप की ओर जाता है
  rationale: ἐπανάγω के पीछे लौटने के भाव और धार्मिकता से पाप की ओर प्रतिगमन को स्पष्ट रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: सिराख के यूनानी पाठ में परमेश्वर के लिए κύριος का मानक, स्वाभाविक हिन्दी रूप।
- source_word: ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: उसे तलवार के लिए तैयार करेगा
  rationale: दैवी न्याय द्वारा तलवार के लिए नियत किए जाने के अशुभ भाव को यूनानी संरचना के निकट रखते हुए व्यक्त करता है।
theological_decisions:
- issue: अन्तिम एकवचन सर्वनाम αὐτόν का सम्बन्ध
  choice: मुख्य पाठ में इसे ठीक पहले आए उस व्यक्ति से जोड़ा गया है जो धार्मिकता से पाप की ओर फिरता है।
  alternative: इसे पूरी सूची पर निष्कर्षात्मक न्याय-वचन के रूप में भी सुना जा सकता है।
  rationale: एकवचन सर्वनाम निकटतम एकवचन कृदन्तीय पद की ओर सबसे स्वाभाविक रूप से संकेत करता है, पर यूनानी वाक्य-संरचना संक्षिप्त और कुछ असमतल है; इसलिए वैकल्पिक सम्भावना पादटिप्पणी में रखी गई है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ पाप के साथ विरोध नैतिक और धर्मपरायण आचरण का है, इसलिए ‘धार्मिकता’ प्रसंगानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘कूड़े के समान तुच्छ समझा जाए’ मूल के कठोर बिंब को बनाए रखता है, जबकि मुख्य पाठ में अनावश्यक रूप से अशिष्ट भाषा से बचता है। अर्धविराम तीन शिकायतों को अलग करते हैं और डैश अन्तिम न्याय-वचन के आकस्मिक संक्रमण को सुरक्षित रखता है।
