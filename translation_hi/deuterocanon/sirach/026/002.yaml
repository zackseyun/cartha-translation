  text: A capable wife gladdens her husband, and he will spend his years in pleasantness.
translation:
  language: hi
  text: समर्थ पत्नी अपने पति को प्रसन्न करती है, और वह अपने जीवन के वर्ष सुखपूर्वक[a] बिताएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “और वह अपने जीवन के वर्ष शांति से पूरे करेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: समर्थ पत्नी
  rationale: यह इब्रानी पद शक्ति, योग्यता, प्रतिष्ठा और उत्कृष्टता का व्यापक भाव रखता है। आधुनिक हिन्दी में “समर्थ पत्नी” उसकी व्यावहारिक क्षमता और गुणों को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल युद्ध-संबंधी वीरता या संकीर्ण नैतिक अर्थ तक सीमित किए।
- source_word: תְּדַּשֵּׁן
  choice: आनंदित करती है
  rationale: क्रिया का शाब्दिक चित्र पुष्ट या समृद्ध करने का है और प्रसंग में फलते-फूलते कल्याण का बोध देता है। यूनानी εὐφραίνει भी प्रसन्न करने का समर्थन करता है; इसलिए “आनंदित करती है” सहज हिन्दी में उसके अनुभवगत परिणाम को व्यक्त करता है।
- source_word: לְבַעֲלָהּ
  choice: अपने पति को
  rationale: यहाँ בַּעַל का अर्थ स्पष्ट रूप से “पति” है। हिन्दी में संबंध स्पष्ट करने के लिए “अपने पति को” स्वाभाविक है।
- source_word: וּשְׁנֵי חַיָּיו
  choice: अपने जीवन के वर्ष
  rationale: यह इब्रानी पद का निकट और स्पष्ट रूप है तथा केवल “वर्ष” की अपेक्षा जीवनकाल का संदर्भ सहजता से बताता है।
- source_word: יְבַלֶּה
  choice: बिताएगा
  rationale: प्रसंग में क्रिया समय या जीवन व्यतीत करने को दर्शाती है; “बिताएगा” आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
- source_word: בַנְעִימִים
  choice: सुखपूर्वक
  rationale: इब्रानी में मनोहर, सुखद या आनंदमय परिस्थितियों का भाव है। “सुखपूर्वक” उस भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है; यूनानी का भिन्न पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम पदबंध में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार “सुखपूर्वक”
  alternative: शांति से
  rationale: जहाँ सिराख का विश्वसनीय इब्रानी पाठ उपलब्ध है, उसे मुख्य आधार बनाया गया है। यूनानी में “शांति से” है, जो किसी पाठांतर या व्याख्यात्मक अनुवाद का प्रतिनिधित्व कर सकता है; इसलिए उसे पारदर्शिता हेतु पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “समर्थ” मूल पद के व्यापक गुणात्मक अर्थ को बनाए रखता है, जबकि “आनंदित करती है” शाब्दिक समृद्धि के बिंब का प्रसंगानुकूल परिणाम व्यक्त करता है।
