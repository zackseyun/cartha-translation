  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: hi
  text: नगर में बदनामी फैलाना,[a] भीड़ का जमावड़ा, और झूठा आरोप—ये सब मृत्यु से भी अधिक बुरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में यह एक संक्षिप्त सूची है, जिसमें सम्बन्धकारक पदों का ठीक सम्बन्ध खुला छोड़ा गया है: शाब्दिक रूप से, “नगर की/में बदनामी” और “भीड़ की सभा।” अनुवाद ने पहले पद को सहज हिन्दी में स्पष्ट किया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολὴν
  choice: बदनामी फैलाना
  rationale: यह संज्ञा निंदात्मक आरोप या बदनाम करने का भाव रखती है। हिन्दी में क्रियात्मक पदबंध सूची के भीतर स्वाभाविक और स्पष्ट है।
- source_word: πόλεως
  choice: नगर में
  rationale: सम्बन्धकारक यहाँ संक्षिप्त और अर्थ की दृष्टि से अनिर्दिष्ट है। 'नगर में' इसे नागरिक जीवन के भीतर घटने वाली बदनामी के रूप में सहजता से व्यक्त करता है, जबकि 'नगर की' अधिक अस्पष्ट होता।
- source_word: ἐκκλησίαν
  choice: जमावड़ा
  rationale: यहाँ अर्थ एकत्र हुई सभा का है, किसी विशेष धार्मिक कलीसिया का नहीं। ὄχλου के साथ 'भीड़ का जमावड़ा' नकारात्मक सामाजिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὄχλου
  choice: भीड़ का
  rationale: ὄχλος का मूल अर्थ भीड़ या जनसमूह है। प्रसंग में अव्यवस्थित समूह का नकारात्मक संकेत है, जिसे 'भीड़' पर्याप्त रूप से बनाए रखता है; 'उपद्रवी भीड़' मूल से अधिक स्पष्टता जोड़ता।
- source_word: καταψευσμόν
  choice: झूठा आरोप
  rationale: यह शब्द किसी के विरुद्ध झूठ बोलने या झूठा दोष लगाने को सूचित करता है। 'झूठा आरोप' पहले पद से भेद भी बनाए रखता है।
- source_word: ὑπὲρ θάνατον
  choice: मृत्यु से भी अधिक
  rationale: यह तुलना मृत्यु से बढ़कर होने का भाव देती है। 'से भी अधिक' आधुनिक हिन्दी में उस तुलनात्मक बल को स्पष्ट करता है।
- source_word: πάντα
  choice: ये सब
  rationale: नपुंसकलिंग बहुवचन पिछले तीनों विषयों का समाहार करता है; हिन्दी में 'ये सब' इसका स्वाभाविक संकेत है।
- source_word: μοχθηρά
  choice: बुरे हैं
  rationale: विशेषण का अर्थ बुरा, दुष्ट या कष्टदायक हो सकता है। ὑπὲρ θάνατον के साथ 'मृत्यु से भी अधिक बुरे हैं' तुलना को स्पष्ट और सामान्य हिन्दी में रखता है।
