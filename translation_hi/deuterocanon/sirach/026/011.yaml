  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: hi
  text: बेटी पर बिना ढील दिए कड़ा पहरा रखो, कहीं ऐसा न हो कि वह अपने लिए छूट पाकर उसका उपयोग करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ संक्षिप्त है। ‘उसका’ पहले कही गई ‘छूट’ की ओर संकेत करता है। ‘छूट’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘ढील’, ‘राहत’ या ‘बंधन से स्वतंत्रता’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ θυγατρὶ
  choice: बेटी पर
  rationale: ἐπί के साथ दत्तिव यहाँ निगरानी के विषय को दर्शाता है; हिन्दी में ‘बेटी पर ... पहरा’ स्वाभाविक है।
- source_word: ἀδιατρέπτως
  choice: बिना ढील दिए
  rationale: यह क्रिया-विशेषण पहरा दृढ़ करने की रीति बताता है—अटल या अविचल रूप से। इसे बेटी के स्वभाव का विशेषण (‘हठी बेटी’) बनाना यूनानी व्याकरण की अपेक्षा कम सीधा है।
- source_word: στερέωσον φυλακήν
  choice: कड़ा पहरा रखो
  rationale: शाब्दिक अर्थ ‘पहरे को दृढ़ करो’ है। ‘कड़ा पहरा रखो’ φυλακήν के निगरानी-बोध और στερέωσον की दृढ़ता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα μὴ
  choice: कहीं ऐसा न हो कि
  rationale: नकारात्मक उद्देश्य अथवा आशंकित परिणाम को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὑροῦσα ἄνεσιν ἑαυτῇ
  choice: वह अपने लिए छूट पाकर
  rationale: ἄνεσις का अर्थ ढील, राहत या बंधन से स्वतंत्रता हो सकता है। पहरे के संदर्भ में ‘छूट’ इस अर्थ-क्षेत्र को संक्षेप में सुरक्षित रखता है; ἑαυτῇ को ‘अपने लिए’ से व्यक्त किया गया है।
- source_word: χρήσηται
  choice: उसका उपयोग करे
  rationale: χράομαι का सीधा अर्थ ‘उपयोग करना’ है। ‘उसका’ का संकेत पहले कही गई ‘छूट’ की ओर है, जैसा यूनानी की संक्षिप्त रचना में निहित है।
