lexical_decisions:
- source_word: λύχνος
  choice: दीपक
  rationale: यह शब्द प्रकाश की अमूर्त धारणा नहीं, बल्कि जलाए जाने वाले ठोस दीपक को दर्शाता है; इसलिए काव्यात्मक बिंब सुरक्षित रहता है।
- source_word: ἐκλάμπων
  choice: उज्ज्वल चमकता हुआ
  rationale: क्रिया साधारण प्रकाश देने से अधिक प्रखर चमकने का भाव रखती है। यह हिन्दी में स्वाभाविक रहते हुए उसकी तीव्रता व्यक्त करता है।
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: पवित्र दीपाधार पर
  rationale: ἐπί यहाँ स्थान-संबंध व्यक्त करता है। ἁγίας के धार्मिक अथवा समर्पित होने के भाव को सामान्य विशेषण में बदलने के बजाय ‘पवित्र’ रखा गया है।
- source_word: κάλλος προσώπου
  choice: मुख की सुंदरता
  rationale: यह सीधा अनुवाद मूल के ठोस चित्र और दोनों पदों के काव्यात्मक समानांतर को बनाए रखता है।
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: सुदृढ़ कद-काठी पर
  rationale: ἡλικία का अर्थ आयु के साथ-साथ शारीरिक डील-डौल या कद भी हो सकता है, और στασίμῃ स्थिरता अथवा दृढ़ता का भाव देता है। दीपाधार और देह के समानांतर बिंब में ‘सुदृढ़ कद-काठी’ सहज और संदर्भानुकूल है; आयु वाला अर्थ पादटिप्पणी में सुरक्षित है।
