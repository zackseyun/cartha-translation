- source_word: γυνὴ ἀντίζηλος
  choice: ईर्ष्या करने वाली पत्नी
  rationale: ἀντίζηλος ईर्ष्या और प्रतिद्वंद्विता दोनों का बोध करा सकता है। संदर्भ में ‘ईर्ष्या करने वाली पत्नी’ व्यापक अर्थ रखता है और बहुपत्नी-व्यवस्था को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπὶ γυναικί
  choice: दूसरी स्त्री से
  rationale: संक्षिप्त यूनानी पदबंध किसी स्त्री के प्रति विरोधी ईर्ष्या या प्रतिद्वंद्विता बताता है। ‘दूसरी स्त्री से’ संबंध को स्पष्ट करता है, पर उसे दूसरी पत्नी तक सीमित नहीं करता।
- source_word: μάστιξ γλώσσης
  choice: उसकी जीभ ऐसा कोड़ा है
  rationale: शाब्दिक ‘जीभ का कोड़ा’ हिन्दी में अस्वाभाविक हो सकता है। यह रूपांतरण कटु और चोट पहुँचाने वाली वाणी का मूल सजीव रूपक बनाए रखता है।
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: जो सब पर पड़ता है
  rationale: यूनानी पद कठिन है और शाब्दिक रूप से सबके साथ सहभागी होने या सब तक पहुँचने का भाव देता है। संदर्भ में यह जीभ के कोड़े का बिना भेद सबको चोट पहुँचाना स्वाभाविक रूप से व्यक्त करता है; अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
