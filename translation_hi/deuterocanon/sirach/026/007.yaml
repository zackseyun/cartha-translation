- source_word: ἄλγος καρδίας
  choice: हृदय की पीड़ा
  rationale: यह यूनानी भावनात्मक आंतरिक वेदना को व्यक्त करता है; ‘हृदय की पीड़ा’ उसके रूपक और गंभीरता दोनों को बनाए रखता है।
