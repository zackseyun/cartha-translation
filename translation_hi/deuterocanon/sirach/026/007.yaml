  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: hi
  text: किसी दूसरी स्त्री के प्रति ईर्ष्यालु पत्नी हृदय की पीड़ा और शोक है,[a] और जीभ का ऐसा कोड़ा है जो सबसे संबंध रखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरी पत्नी की प्रतिद्वंद्वी पत्नी।” यूनानी पद ईर्ष्या अथवा प्रतिद्वंद्विता, और संभवतः दूसरी पत्नी के साथ होड़, दोनों का संकेत दे सकता है; किंतु कथन संक्षिप्त है और सामान्य रूप से किसी दूसरी स्त्री के प्रति ईर्ष्या भी बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन है। यूनानी में शाब्दिक रूप से “जीभ का कोड़ा, जो सबके साथ सहभागी/संबद्ध होता है” कहा गया है; आशय ऐसी वाणी हो सकता है जो बिना भेद सब पर प्रहार करती है या सब तक पहुँचती है।
    reason: alternative_reading
