base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/017.yaml
  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
translation:
  language: hi
  text: जैसे प्रभु की ऊँचाइयों में सूर्य उदय होता है, वैसे ही उसके घर की सज्जा में भली पत्नी का सौन्दर्य है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सज्जा’ के स्थान पर ‘सुव्यवस्था’ या ‘शोभा’ भी सम्भव है; यूनानी शब्द में व्यवस्थित विन्यास और अलंकरण—दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘भली पत्नी’ का अनुवाद ‘भली स्त्री’ भी हो सकता है, पर यहाँ घर का प्रसंग ‘पत्नी’ के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: उदय होता सूर्य
  rationale: यह कृदन्तीय पद सूर्य के उदित होने का सजीव और गतिशील बिम्ब प्रस्तुत करता है।
- source_word: ἐν ὑψίστοις Κυρίου
  choice: प्रभु की ऊँचाइयों में
  rationale: बहुवचन ὑψίστοις और Κυρίου के सम्बन्धकारक रूप को सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है; इसे केवल ‘आकाश’ कहकर अर्थ सीमित नहीं किया गया।
- source_word: κάλλος
  choice: सौन्दर्य
  rationale: यह κάλλος का सीधा, गरिमापूर्ण और प्रसंगानुकूल समानार्थी है।
- source_word: ἀγαθῆς γυναικός
  choice: भली पत्नी
  rationale: γυνή का अर्थ स्त्री या पत्नी हो सकता है, पर घर के प्रसंग में ‘पत्नी’ अधिक सम्भावित है; ἀγαθή के लिए ‘भली’ उसके व्यापक सकारात्मक भाव को बनाए रखता है।
- source_word: ἐν κόσμῳ
  choice: शोभा में
  rationale: κόσμος में सुव्यवस्था, सज्जा और उनसे उत्पन्न शोभा के परस्पर जुड़े भाव हैं। ‘शोभा’ यहाँ स्वाभाविक है, जबकि पादटिप्पणी उसकी वास्तविक शाब्दिक व्यापकता बताती है।
- source_word: οἰκίας αὐτοῦ
  choice: उसके घर की
  rationale: यूनानी αὐτοῦ पुल्लिंग एकवचन है; इसलिए स्रोत का लैंगिक संकेत बनाए रखा गया है।
theological_decisions:
- issue: घर-परिवार से जुड़ी लैंगिक भाषा
  choice: भली पत्नी ... उसके घर
  alternative: भली स्त्री ... घर-परिवार; अथवा भली पत्नी ... उसके घर-परिवार
  rationale: γυναικός अपने आप में ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है, किन्तु οἰκίας के वैवाहिक-घरेलू प्रसंग में ‘पत्नी’ अधिक स्वाभाविक है। αὐτοῦ के पुल्लिंग संकेत को लिंग-निरपेक्ष बनाकर हटाया नहीं गया।
- issue: κόσμος की अर्थगत व्यापकता
  choice: शोभा
  alternative: सज्जा; सुव्यवस्था
  rationale: शब्द में व्यवस्था और अलंकरण दोनों के भाव हो सकते हैं। मुख्य पाठ में सहज हिन्दी चुनी गई है और विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यमय, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। तुलना की यूनानी संरचना को बनाए रखते हुए शब्दक्रम को हिन्दी के अनुकूल किया गया है।
