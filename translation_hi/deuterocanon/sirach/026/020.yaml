lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: दो बातों से
  rationale: ἐπί के साथ दत्तिव यहाँ दुःख के कारण या अवसर को व्यक्त करता है। ‘दो बातों से’ आधुनिक हिन्दी में स्वाभाविक है और गणनात्मक रचना बनाए रखता है।
- source_word: λελύπηται
  choice: दुःखी है
  rationale: पूर्णकालिक मध्य/कर्मवाच्य रूप वर्तमान में बनी हुई दुःख की अवस्था बताता है; ‘दुःखी है’ इस स्थितिपरक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ καρδία μου
  choice: मेरा हृदय
  rationale: शाब्दिक रूप यहाँ स्वाभाविक बाइबिलीय हिन्दी है और भावनाओं के केंद्र का संकेत बनाए रखता है।
- source_word: ἐπὶ τῷ τρίτῳ
  choice: तीसरी पर
  rationale: यह पहले खंड की रचना को दोहराते हुए दो से तीसरी बात तक की चरम प्रगति को सुरक्षित रखता है। स्त्रीलिंग ‘तीसरी’ का आशय पूर्वोक्त ‘बात’ से है।
- source_word: θυμός
  choice: क्रोध
  rationale: θυμός प्रबल क्रोध या रोष को दर्शा सकता है। ‘क्रोध’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है, जबकि अधिक तीव्र विकल्प मूल अर्थ को अनावश्यक रूप से बढ़ा सकते हैं।
- source_word: μοι ἐπῆλθεν
  choice: मुझे … आ गया
  rationale: यह मुहावरा वक्ता पर क्रोध के आ पड़ने या उसे घेर लेने का भाव देता है। ‘मुझे क्रोध आ गया’ हिन्दी का स्वाभाविक मुहावरा है और इस बात को अनिर्णीत रखता है कि क्रोध बाहर से आया या भीतर उठा।
