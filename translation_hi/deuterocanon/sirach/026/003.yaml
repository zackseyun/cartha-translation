base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/003.yaml
  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: hi
  text: अच्छी पत्नी अच्छा उपहार है; वह परमेश्वर का भय माननेवाले की गोद में दी जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “वह प्रभु का भय माननेवालों के भाग में दी जाएगी।” इब्रानी में “परमेश्वर का भय माननेवाले की गोद में” है, जो अधिक आत्मीय बिंब प्रस्तुत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: अच्छी पत्नी
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; वैवाहिक प्रसंग में ‘पत्नी’ अधिक स्वाभाविक है।
- source_word: מַתָּנָה טוֹבָה
  choice: एक अच्छा उपहार
  rationale: यह अनुवाद ‘अच्छी/अच्छा’ की इब्रानी पुनरुक्ति और सूक्तिपरक संक्षिप्तता को बनाए रखता है।
- source_word: בְּחֵיק
  choice: की गोद में
  rationale: חֵיק का ठोस अर्थ गोद या वक्षस्थल है। ‘गोद में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए निकटता और आत्मीय संबंध का इब्रानी बिंब सुरक्षित रखता है।
- source_word: יֵרֵא אֱלֹהִים
  choice: परमेश्वर का भय माननेवाले
  rationale: यह इब्रानी के एकवचन ‘परमेश्वर से डरने/उसका भय माननेवाला’ को बिना अनावश्यक रूप से ‘पुरुष’ जोड़ने के व्यक्त करता है।
- source_word: תִּנָּתֵן
  choice: वह दी जाएगी
  rationale: निफ़अल अपूर्ण क्रिया का निष्क्रिय भविष्यकालीन भाव रखा गया है और स्त्रीलिंग कर्ता को स्पष्ट किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में ईश्वरीय संबोधन
  choice: परमेश्वर
  alternative: प्रभु
  rationale: प्राथमिक इब्रानी पाठ में אֱלֹהִים (‘परमेश्वर’) है, जबकि यूनानी समानांतर पाठ में Κύριον (‘प्रभु’) है; इसलिए मुख्य पाठ इब्रानी का अनुसरण करता है।
- issue: पत्नी का ‘दिया जाना’
  choice: निष्क्रिय वाक्य को यथावत रखा गया
  alternative: परमेश्वर उसे देगा
  rationale: इब्रानी में देनेवाले का स्पष्ट उल्लेख नहीं है। प्रसंग परमेश्वर की व्यवस्था का संकेत दे सकता है, पर मुख्य पाठ में परमेश्वर को प्रत्यक्ष कर्ता बनाना अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और संक्षिप्त सूक्तिपरक शैली रखी गई है। ‘गोद में’ ठोस इब्रानी बिंब को बचाता है; पदचिह्न [a] संबंधित वाक्य के अंत में दिया गया है।
