base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/013.yaml
  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: hi
  text: जैसे प्यासा राहगीर अपना मुँह खोलता है, वैसे ही वह अपना मुँह खोलेगी[a] और पास के हर पानी से पीएगी; वह हर खूँटे के सामने बैठ जाएगी[b], और हर तीर के सामने अपना तरकश खोल देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह रूपक संभवतः यौन संबंधों में भेदभाव न करने की ओर संकेत करता है—जो अवसर निकट हो, उसे स्वीकार कर लेना।
    reason: cultural_note
  - marker: b
    text: यूनानी में “खूँटा” और आगे “तीर” तथा “तरकश” के शब्द शाब्दिक रूप में रखे गए हैं। अंतिम बिंब का ठीक आशय विवादित है, पर वह पद के यौन रूपक को आगे बढ़ाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: प्यासा राहगीर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में मार्ग पर चलने वाले प्यासे व्यक्ति का बिंब बनाए रखता है।
- source_word: τὸ στόμα ἀνοίγει
  choice: अपना मुँह खोलता है / अपना मुँह खोलती है
  rationale: यूनानी की सरल, ठोस क्रिया को बिना अनावश्यक तीव्रता जोड़े रखा गया है; उपमा के व्याकरणिक पुरुष और संदर्भगत स्त्री-विषय के अनुसार रूप बदला गया है।
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς
  choice: पास के हर जलस्रोत से
  rationale: शाब्दिक 'हर पास के पानी' की अपेक्षा 'जलस्रोत' हिन्दी में अधिक स्वाभाविक है और निकट उपलब्ध किसी भी पानी से पीने की अविवेकी तत्परता को बनाए रखता है।
- source_word: πίεται
  choice: पीती है
  rationale: यूनानी भविष्य रूप यहाँ आचरण की सामान्य प्रवृत्ति व्यक्त कर सकता है; हिन्दी में वर्तमान सामान्य रूप उपमा और चरित्र-वर्णन को अधिक स्वाभाविक बनाता है।
- source_word: κατέναντι παντὸς πασσάλου
  choice: हर खूँटे के सामने
  rationale: πάσσαλος का ठोस अर्थ खूँटा/कीला है। 'खूँटा' ग्रामीण और तंबू-संबंधी बिंब को स्पष्ट रखता है तथा यौन रूपक को अनुवाद में खोलकर नहीं बताता।
- source_word: καθίσεται
  choice: बैठ जाएगी
  rationale: भविष्य मध्यम का अर्थ अपने को बैठाना या बैठ जाना है; हिन्दी का यह रूप क्रिया और भविष्य दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔναντι βέλους
  choice: हर तीर के सामने
  rationale: βέλους एकवचन है, पर παντός वितरणात्मक अर्थ में 'हर' को उचित ठहराता है। कठिन रूपक को स्पष्ट व्याख्यात्मक वाक्य में बदलने के बजाय निकट अनुवाद रखा गया है।
- source_word: φαρέτραν
  choice: तरकश
  rationale: φαρέτρα का सामान्य अर्थ तीर रखने का तरकश है। हिन्दी का सटीक और परिचित शब्द मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य की चेतावनी में यौन रूपक
  choice: जल, खूँटे, तीर और तरकश के ठोस बिंबों को बनाए रखना
  alternative: पद को सीधे यौन स्वच्छंदता या व्यभिचार के कथन के रूप में भावानुवाद करना
  rationale: यूनानी पाठ स्पष्ट व्याख्या के बजाय सजीव और कुछ हद तक कठिन रूपक देता है। ठोस शब्दावली बचाने से वास्तविक अस्पष्टता और अलंकारिक तनाव सुरक्षित रहता है; सांस्कृतिक अर्थ पादटिप्पणी में बताया जा सकता है।
- issue: मुख्य स्त्री-विषय का स्पष्ट उल्लेख
  choice: उपमा के बाद 'वह' और स्त्रीलिंग क्रियारूपों का प्रयोग
  alternative: हर उपवाक्य में विषय को निहित छोड़ना या लिंग-निरपेक्ष रूप अपनाना
  rationale: आसपास का प्रसंग स्त्री-विषय को स्पष्ट करता है। हिन्दी में स्त्रीलिंग क्रियारूप संदर्भगत अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
- issue: πίεται के भविष्यकाल का हिन्दी रूप
  choice: सामान्य वर्तमान 'पीती है'
  alternative: शाब्दिक भविष्य 'पीएगी'
  rationale: यहाँ भविष्य रूप चरित्रगत या अभ्यस्त आचरण को चित्रित करता प्रतीत होता है। हिन्दी में उपमा के साथ सामान्य वर्तमान अधिक सहज है; अगले अधिक दृश्यात्मक कार्यों में भविष्य रूप बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। कठिन यौन रूपक को मूल के ठोस बिंबों सहित रखा गया है और अर्थ को मुख्य पाठ में अत्यधिक स्पष्ट नहीं किया गया। 'जलस्रोत' पठनीयता के लिए चुना गया है; 'खूँटा', 'तीर' और 'तरकश' मूल की जानबूझकर चौंकाने वाली छवि को बचाते हैं।
