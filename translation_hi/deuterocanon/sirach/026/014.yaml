translation:
  language: hi
  text: पत्नी का सौम्य स्वभाव उसके पति को आनंदित करेगा, और उसकी समझ उसके पति की हड्डियों को पुष्ट करेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी समझ उसके पति की हड्डियों को मोटा करेगी”; यह पत्नी की बुद्धिमत्ता से मिलने वाली पुष्टि और जीवनी-शक्ति का शारीरिक रूपक है।
    reason: मूल यूनानी के असामान्य शारीरिक रूपक और πιανεῖ के अधिक शाब्दिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: χάρις
  choice: शालीनता
  rationale: यहाँ χάρις उद्धार-संबंधी ‘अनुग्रह’ नहीं, बल्कि पत्नी के मनभावन, सौम्य और गरिमापूर्ण गुण को व्यक्त करता है। ‘शालीनता’ इस नैतिक-सौंदर्यात्मक भाव को स्वाभाविक हिन्दी में रखती है और इसे केवल शारीरिक आकर्षण तक सीमित नहीं करती।
- source_word: γυναικός
  choice: पत्नी की
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर उसी वाक्य में ‘उसके पति’ आने के कारण यहाँ ‘पत्नी’ संदर्भानुकूल है।
- source_word: τέρψει
  choice: आनंदित करेगी
  rationale: τέρπω का भाव प्रसन्न या आनंदित करने का है। भविष्यकालीन यूनानी क्रिया को हिन्दी में भी भविष्यकाल से व्यक्त किया गया है।
- source_word: ἐπιστήμη
  choice: समझ
  rationale: यह शब्द ज्ञान, समझ या व्यावहारिक सूझ को सूचित कर सकता है। घरेलू प्रज्ञा के इस संदर्भ में ‘समझ’ केवल सूचना नहीं, विवेकपूर्ण बोध भी व्यक्त करती है।
- source_word: πιανεῖ
  choice: पुष्ट करेगी
  rationale: πιαίνω का मूल भाव मोटा, भरापूरा या पुष्ट करना है। ‘पुष्ट करेगी’ हिन्दी में स्वाभाविक रहते हुए मूल के पोषण और सामर्थ्य वाले शारीरिक रूपक को बनाए रखता है।
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: उसकी हड्डियों को
  rationale: ‘हड्डियों’ का सीधा अनुवाद मूल के शारीरिक रूपक को सुरक्षित रखता है; यहाँ यह पूरे शरीर और आंतरिक जीवनी-शक्ति की दृढ़ता की ओर संकेत करता है।
