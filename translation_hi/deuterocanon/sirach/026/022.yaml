  text: One who turns back from righteousness to sin—the Lord will prepare him for the sword[a].
translation:
  language: hi
  text: जो धार्मिकता से मुड़कर पाप की ओर जाता है—प्रभु उसे तलवार के लिए तैयार करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो धार्मिकता से पाप की ओर लौटता है।” यूनानी कृदंत का अधिक शाब्दिक अर्थ ‘वापस ले जाना’ या ‘लौटाना’ भी हो सकता है; पर यहाँ भाव धार्मिकता का मार्ग छोड़कर पाप की ओर फिरने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανάγων
  choice: फिरकर ... की ओर जाता है
  rationale: क्रिया का मूल अर्थ वापस लाना या लौटना हो सकता है; यहाँ ἀπό और ἐπί के साथ यह धार्मिकता छोड़कर पाप की ओर लौटने का नैतिक भाव व्यक्त करती है। हिंदी में यह प्रयोग स्वाभाविक है और कर्तृवाच्य तथा संभावित आत्मवाचक अर्थ के बीच की सीमा को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ इसका विरोध पाप से है, इसलिए व्यक्तिगत नैतिक-सदाचार के अर्थ में ‘धार्मिकता’ उपयुक्त है; ‘न्याय’ इस संदर्भ में संकरा होता।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: नैतिक और धार्मिक संदर्भ में यह सीधा, मानक हिंदी प्रतिशब्द है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: बाइबिलीय ज्ञान-साहित्य में यह पद परमेश्वर की ओर संकेत करता है; ‘प्रभु’ आधुनिक हिंदी में प्रतिष्ठित और स्वाभाविक रूप है।
- source_word: ἑτοιμάσει
  choice: तैयार करेगा
  rationale: भविष्यकालीन क्रिया के ‘तैयार करना’ अर्थ को सीधे बनाए रखता है और न्याय की प्रक्रिया के बारे में अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: εἰς ῥομφαίαν
  choice: तलवार के लिए
  rationale: यह यूनानी पूर्वसर्गीय वाक्यांश और न्याय की तलवार वाली छवि को सुरक्षित रखता है, बिना उसे स्पष्टतः वध या मृत्यु कहकर विस्तृत किए।
theological_decisions:
- issue: ‘प्रभु उसे तलवार के लिए तैयार करेगा’ में ईश्वरीय न्याय का स्वरूप
  choice: धार्मिकता से पाप की ओर लौटने वाले पर प्रभु के न्याय का प्रत्यक्ष कथन
  alternative: इसे प्रत्यक्ष दंडात्मक कार्रवाई के बजाय सामान्य दैवी परिणाम के रूप में समझना
  rationale: यूनानी पाठ में ‘प्रभु’ स्पष्ट कर्ता है और भविष्यकालीन क्रिया उसी की सक्रियता बताती है। अनुवाद इस तनाव को बनाए रखता है, पर न्याय के ढंग या अंतिम परिणाम को पाठ से आगे जाकर निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की संक्षिप्त न्यायोक्ति-शैली और तलवार की मूल छवि सुरक्षित हैं। मुख्य पाठ में पाद-टिप्पणी चिह्न [a] सम्मिलित है।
