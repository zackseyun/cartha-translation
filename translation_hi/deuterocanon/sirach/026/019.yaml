- source_word: πόδες ὡραῖοι
  choice: सुंदर पाँव
  rationale: πόδες का सीधा अर्थ ‘पाँव’ है; ὡραῖοι यहाँ उनकी सुंदरता या मनोहरता बताता है। अस्पष्ट रूपक को ‘चाल’ या ‘टाँगें’ बनाकर स्पष्ट नहीं किया गया।
- source_word: ἐπὶ στέρνοις
  choice: छाती पर
  rationale: στέρνον छाती या वक्ष-प्रदेश को दर्शाता है। यूनानी बहुवचन को स्वाभाविक हिन्दी में सामूहिक एकवचन ‘छाती’ से व्यक्त किया गया है।
- source_word: εὐσταθοῦς
  choice: किसी सुस्थिर जन की
  rationale: यह संबंधकारक विशेषण ‘स्थिर, दृढ़, अच्छी तरह टिका हुआ’ अर्थ देता है और यहाँ संज्ञा की तरह प्रयुक्त जान पड़ता है। ‘सुस्थिर जन’ मूल की लिंग-संबंधी और संदर्भगत अस्पष्टता को बनाए रखते हुए स्थिरता का भाव देता है।
