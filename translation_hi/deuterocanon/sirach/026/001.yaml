base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/001.yaml
  text: Happy is the husband of a good wife[a], and the number of his days is doubled.
translation:
  language: hi
  text: अच्छी पत्नी का पति धन्य है[a], और उसके दिनों की संख्या दुगुनी हो जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुखी है” अथवा “भाग्यशाली है।”
    reason: אַשְׁרֵי के ‘धन्य, सुखी, भाग्यशाली’ अर्थों की वास्तविक शाब्दिक व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: अच्छी पत्नी
  rationale: इब्रानी पदबंध का सीधा अर्थ ‘अच्छी स्त्री/पत्नी’ है। בַעֲלָהּ के वैवाहिक संदर्भ में ‘पत्नी’ स्वाभाविक है; ‘अच्छी’ नैतिक और व्यावहारिक प्रशंसा की व्यापकता बनाए रखता है।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह ज्ञान-साहित्य में किसी की सुखद और सराहनीय दशा बताने वाला उद्गार है। आधुनिक हिन्दी में ‘धन्य है’ इसकी गरिमापूर्ण सूक्तिपरक शैली को बनाए रखता है; ‘सुखी है’ और ‘भाग्यशाली है’ भी सम्भव अर्थ हैं।
- source_word: בַעֲלָהּ
  choice: पति
  rationale: शब्द का शाब्दिक अर्थ ‘उसका पति/स्वामी’ हो सकता है, पर यहाँ वैवाहिक संबंध स्पष्ट है। ‘पति’ आधुनिक हिन्दी में स्वाभाविक है और ‘स्वामी’ से उत्पन्न भ्रामक अधिकार-संबंधी अर्थ से बचता है।
- source_word: וּמִסְפַּר יָמָיו
  choice: और उसके दिनों की संख्या
  rationale: यह इब्रानी अभिव्यक्ति को निकटता से रखता है और यूनानी समानांतर ‘उसके दिनों की संख्या’ से भी पुष्ट होता है। ‘जीवन’ कहने की अपेक्षा मूल सूक्तिपरक बिंब सुरक्षित रहता है।
- source_word: כִּפְלַיִם
  choice: दुगुनी हो जाती है
  rationale: इब्रानी का अर्थ ‘दुगुना/दोहरा’ है। यह सहज हिन्दी में मूल कथन की दीर्घायु अथवा जीवन की परिपूर्णता संबंधी सूक्तिपरक तीव्रता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के मंगल-वचन में אַשְׁרֵי का अनुवाद
  choice: धन्य है
  alternative: सुखी है; भाग्यशाली है
  rationale: पद किसी व्यक्ति की सराहनीय और ईर्ष्या योग्य सुखद दशा घोषित करता है, पर यह स्पष्ट रूप से नहीं कहता कि परमेश्वर ने सीधे यह दशा प्रदान की है। ‘धन्य है’ पारंपरिक सूक्तिपरक गरिमा रखता है, जबकि पादटिप्पणी अर्थ की अन्य सम्भावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली। वाक्य-संरचना मूल इब्रानी के निकट है, पर ‘अच्छी पत्नी का पति’ और ‘दुगुनी हो जाती है’ स्वाभाविक हिन्दी बनाए रखते हैं।
