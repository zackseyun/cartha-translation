  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘मुख’ की अपेक्षा ‘चेहरा’ चुना गया है, क्योंकि यह वर्तमान हिन्दी में अधिक स्वाभाविक है।
