  yaml_path: translation/deuterocanon/sirach/026/004.yaml
  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
translation:
  language: hi
  text: चाहे कोई धनी हो या गरीब,[a] अच्छे हृदय वाले का चेहरा हर समय प्रसन्न रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “धनी और गरीब का हृदय अच्छा; हर समय चेहरा प्रसन्न।” यूनानी वाक्य बहुत संक्षिप्त है और उसमें क्रिया नहीं दी गई है; मुख्य पाठ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।'
    reason: यूनानी की संक्षिप्त और व्याकरणिक रूप से अस्पष्ट संरचना को सुरक्षित रखना।
lexical_decisions:
- source_word: πλουσίου … καὶ πτωχοῦ
  choice: चाहे कोई धनी हो या गरीब
  rationale: दोनों संबंधकारक रूप सामाजिक-आर्थिक विरोध को व्यक्त करते हैं। हिन्दी में ‘चाहे…या…’ इस संक्षिप्त यूनानी संरचना का स्वाभाविक और स्पष्ट रूप है।
- source_word: καρδία ἀγαθή
  choice: अच्छे हृदय वाले
  rationale: शाब्दिक अर्थ ‘अच्छा हृदय’ है। हिन्दी में इसे व्यक्ति के गुण के रूप में व्यक्त करने से हृदय और चेहरे के बीच का संबंध स्वाभाविक बनता है, बिना ‘हृदय’ की ठोस छवि खोए।
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह काल-सूचक पद निरंतर या सभी अवसरों पर लागू होने का भाव देता है; ‘हर समय’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: πρόσωπον ἱλαρόν
  choice: चेहरा … प्रसन्न रहता है
  rationale: πρόσωπον का मूल अर्थ ‘चेहरा’ और ἱλαρόν का अर्थ ‘प्रसन्न/हँसमुख’ है। ‘प्रसन्न चेहरा’ की ठोस बाहरी अभिव्यक्ति को हिन्दी वाक्य में विधेय रूप से रखा गया है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ δέ हल्के संक्रमण का चिह्न हो सकता है, आवश्यक रूप से विरोधसूचक नहीं। पद को अकेले पढ़ने पर ‘परन्तु’ जोड़ना अनावश्यक रूप से प्रबल विरोध उत्पन्न करता।
