  text: दुष्ट पत्नी डगमगाता हुआ बैलों का जुआ है[a]; जो उसे पकड़ता है, वह बिच्छू को पकड़ने वाले के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद βοοζύγιον σαλευόμενον कठिन और अत्यंत रूपकात्मक है। सम्भवतः इसका संकेत ऐसे बैल-जुए की ओर है जो हिलता-डोलता या अस्थिर हो; यह दुष्ट पत्नी के विघटनकारी बोझ की छवि प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: बैलों का जुआ
  rationale: यह संयुक्त शब्द बैलों और उन्हें जोतने वाले जुए की ठोस कृषि-छवि प्रस्तुत करता है। हिन्दी में ‘बैलों का जुआ’ स्वाभाविक है और रूपक को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखता है।
- source_word: σαλευόμενον
  choice: डगमगाता हुआ
  rationale: कृदन्त हिलने, डोलने या अस्थिर होने का भाव देता है। ‘डगमगाता हुआ’ दृश्य अस्थिरता को स्पष्ट और सजीव रखता है।
- source_word: γυνὴ πονηρά
  choice: दुष्ट पत्नी
  rationale: घरेलू ज्ञान-साहित्य के इस प्रसंग में γυνή का अर्थ ‘पत्नी’ उपयुक्त है, और πονηρά की प्रबल नैतिक नकारात्मकता को ‘दुष्ट’ व्यक्त करता है।
- source_word: ὁ κρατῶν αὐτῆς
  choice: जो उसे पकड़ता है
  rationale: κρατέω पकड़ने, थामने या वश में रखने का अर्थ दे सकता है। आगे बिच्छू पकड़ने की उपमा के कारण यहाँ स्पर्शात्मक अर्थ ‘पकड़ता है’ सबसे निकट है, जबकि ‘वश में करता है’ अनावश्यक व्याख्या जोड़ता।
- source_word: δρασσόμενος
  choice: मुट्ठी में पकड़ता है
  rationale: यह क्रिया हाथ से कसकर पकड़ने की क्रिया दर्शाती है। ‘मुट्ठी में पकड़ता है’ हिन्दी में खतरे की छवि को सजीव करता है, यद्यपि मूल में ‘मुट्ठी’ अलग संज्ञा के रूप में नहीं है।
- source_word: σκορπίου
  choice: बिच्छू
  rationale: यह सामान्य प्राणीवाचक शब्द है; हिन्दी में ‘बिच्छू’ इसका सीधा और स्वाभाविक समतुल्य है।
