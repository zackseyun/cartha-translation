translation:
  language: hi
  text: मदहोश पत्नी बड़े क्रोध का कारण होती है, और वह अपनी लज्जा नहीं छिपाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνὴ μέθυσος
  choice: मदहोश पत्नी
  rationale: γυνή का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है; इस ज्ञान-साहित्यिक घरेलू संदर्भ में ‘पत्नी’ उपयुक्त है। μέθυσος नशे में रहने या धुत होने का बोध देता है, जिसे स्वाभाविक हिन्दी में ‘मदहोश’ कहा गया है।
- source_word: ὀργὴ μεγάλη
  choice: भारी क्रोध का कारण
  rationale: यूनानी में शब्दशः ‘बड़ा/भारी क्रोध’ है और क्रिया निहित है। हिन्दी में केवल ‘भारी क्रोध है’ अस्वाभाविक होता; ‘का कारण’ जोड़कर कथन का अर्थ स्वाभाविक रूप में व्यक्त किया गया है, बिना क्रोध किस व्यक्ति का है यह तय किए।
- source_word: ἀσχημοσύνην
  choice: लज्जाजनक दशा
  rationale: यह शब्द लज्जा, अशोभनीयता या अपमानजनक आचरण/स्थिति का संकेत दे सकता है। ‘लज्जाजनक दशा’ इस व्यापकता को बनाए रखता है और इसे केवल नग्नता या किसी खास अनैतिक कृत्य तक सीमित नहीं करता।
- source_word: οὐ συγκαλύψει
  choice: नहीं छिपाएगी
  rationale: συγκαλύπτω का अर्थ ढकना या छिपाना है। यहाँ रूपकात्मक अर्थ में अपनी लज्जाजनक दशा को छिपा न पाने या न छिपाने का भाव है; यूनानी भविष्यकाल को हिन्दी भविष्यकाल में रखा गया है।
