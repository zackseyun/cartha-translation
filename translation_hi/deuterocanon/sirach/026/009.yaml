  source_fidelity: The draft accurately identifies γυνὴ μέθυσος as a drunken wife in this domestic context and retains the future force of οὐ συγκαλύψει. However, ἀσχημοσύνη is more directly rendered by “लज्जा” here; “लज्जाजनक दशा” makes the phrase more interpretive than necessary.
