  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
translation:
  language: hi
  text: आकर्षण पर आकर्षण है लज्जाशील स्त्री[a], और आत्मसंयमी व्यक्ति के योग्य कोई भी तराजू नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनोहरता पर मनोहरता है लज्जाशील स्त्री।” यूनानी अभिव्यक्ति संक्षिप्त है। χάρις का अर्थ “आकर्षण” या “मनोहरता” हो सकता है, और αἰσχυντηρά का अधिक शाब्दिक अर्थ “संकोची” या “शीलवती” है।
    reason: χάρις और αἰσχυντηρά के वैकल्पिक, अधिक शाब्दिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: आकर्षण पर आकर्षण
  rationale: यहाँ χάρις स्त्री के मनोहर गुण या आकर्षण को व्यक्त करता है; दोहराव और ἐπί के साथ संचयात्मक बल को बनाए रखा गया है, और अनावश्यक धर्मवैज्ञानिक अर्थ से बचा गया है।
- source_word: γυνὴ
  choice: स्त्री
  rationale: प्रसंग में वैवाहिक संबंध स्पष्ट नहीं है, इसलिए व्यापक अर्थ ‘स्त्री’ चुना गया है, न कि ‘पत्नी’।
- source_word: αἰσχυντηρά
  choice: लज्जाशील
  rationale: यह शब्द उचित लज्जा, संकोच और शील के प्रशंसनीय गुण को दर्शाता है; आधुनिक हिन्दी में ‘लज्जाशील’ इसका सकारात्मक नैतिक भाव बनाए रखता है।
- source_word: σταθμός
  choice: तराजू
  rationale: शब्द तौलने के साधन या मान को सूचित करता है; ‘तराजू’ मूल्य के रूपक को ठोस और सहज रखता है।
- source_word: πᾶς ἄξιος
  choice: योग्य कोई भी ... नहीं
  rationale: यूनानी वाक्य की संक्षिप्त और असामान्य संरचना—‘कोई तराजू योग्य नहीं’—को बिना ‘मूल्य तौलने’ का निहितार्थ मुख्य पाठ में जोड़कर निकटता से रखा गया है।
- source_word: ἐγκρατοῦς ψυχῆς
  choice: संयमी प्राण
  rationale: ἐγκρατής आत्मसंयम या अपने ऊपर अधिकार को और ψυχή जीवित अंतःसत्ता/प्राण को दर्शाता है; यह चयन नैतिक बल और मूल संज्ञा दोनों को बनाए रखता है।
theological_decisions:
- issue: αἰσχυντηρά को सद्गुण के रूप में व्यक्त करना
  choice: लज्जाशील
  alternative: संकोची; शीलवती
  rationale: पंक्ति अपमान या दोषपूर्ण शर्म नहीं, बल्कि उचित लज्जा और शील की प्रशंसा करती है। ‘लज्जाशील’ इस तनाव को आधुनिक, सम्मानपूर्ण हिन्दी में सुरक्षित रखता है।
- issue: दूसरे उपवाक्य के मूल्य-रूपक की संक्षिप्तता
  choice: संयमी प्राण के योग्य कोई भी तराजू नहीं है
  alternative: कोई तराजू संयमी प्राण का मूल्य नहीं तौल सकता
  rationale: वैकल्पिक रूप अर्थ को सहज बनाता है, पर मूल में ‘मूल्य’ और ‘तौल सकता’ प्रत्यक्ष नहीं हैं। चुना हुआ पाठ वास्तविक यूनानी संक्षिप्तता और उसके खुले रूपक को सुरक्षित रखता है।
- issue: χάρις का अर्थ
  choice: आकर्षण
  alternative: अनुग्रह; मनोहरता
  rationale: इस ज्ञान-साहित्यिक स्त्री-वर्णन में शब्द का आशय मनभावन गुण या आकर्षण है। ‘अनुग्रह’ धर्मवैज्ञानिक अर्थ का अनावश्यक संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक शैली अपनाई गई है। ‘प्राण’ मूल ψυχή को निकटता से रखता है; ‘तराजू’ तौल और अतुलनीय मूल्य के रूपक को बनाए रखता है।
