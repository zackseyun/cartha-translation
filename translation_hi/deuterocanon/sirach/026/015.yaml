  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
translation:
  language: hi
  text: शांत स्वभाव वाली पत्नी प्रभु की देन है, और अनुशासित आत्मा का कोई समतुल्य नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुशिक्षित आत्मा के लिए कोई समतुल्य नहीं है।” यूनानी πεπαιδευμένης में शिक्षा या प्रशिक्षण के साथ-साथ अनुशासन का भाव भी हो सकता है।
    reason: πεπαιδευμένης के ‘सुशिक्षित/प्रशिक्षित’ अर्थ और ἀντάλλαγμα के ‘समतुल्य’ अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: δόσις
  choice: देन
  rationale: यहाँ शब्द देने की क्रिया नहीं, बल्कि प्रभु से प्राप्त उपहार को दर्शाता है; हिन्दी में ‘देन’ इस स्रोत-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Κυρίου
  choice: प्रभु की
  rationale: सम्बन्धकारक रूप स्रोत को बताता है—यह पत्नी प्रभु से मिली देन है।
- source_word: γυνὴ
  choice: पत्नी
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर इस प्रसंग का विषय वैवाहिक जीवन है।
- source_word: σιγηρά
  choice: शांत स्वभाव वाली
  rationale: यह केवल न बोलने वाली नहीं, बल्कि वाणी और व्यवहार में शांत तथा संयमी होने का सकारात्मक भाव देता है।
- source_word: ἀντάλλαγμα
  choice: बराबरी ... कर सकती
  rationale: शब्द का मूल भाव बदले में दी जाने वाली समतुल्य वस्तु है; हिन्दी मुहावरे में यह रचना अतुलनीय मूल्य को स्पष्ट करती है।
- source_word: πεπαιδευμένης
  choice: अनुशासित
  rationale: παιδεύω से बना यह रूप शिक्षा, प्रशिक्षण और चरित्र-निर्माण—तीनों का भाव रख सकता है; ‘अनुशासित’ नीतिवचन के नैतिक संदर्भ को प्रमुखता देता है।
- source_word: ψυχῆς
  choice: आत्मा
  rationale: यहाँ ψυχή व्यक्ति के भीतरी स्वभाव और चरित्र को सूचित करता है; ‘आत्मा’ मूल पाठ का गरिमापूर्ण नैतिक-आध्यात्मिक भाव बनाए रखता है।
theological_decisions:
- issue: πεπαιδευμένης ψυχῆς का आशय और पहली पंक्ति की पत्नी से उसका संबंध
  choice: इसे ‘अनुशासित आत्मा’ के रूप में रखा गया है और समानांतर कथन के कारण यह पत्नी के भीतरी, गढ़े हुए चरित्र की प्रशंसा करता है।
  alternative: ‘सुशिक्षित आत्मा’ या ‘प्रशिक्षित मन’; व्याकरण की दृष्टि से दूसरी पंक्ति सामान्य रूप से किसी भी ऐसे व्यक्ति पर भी लागू हो सकती है।
  rationale: यूनानी पाठ दूसरी पंक्ति में ‘पत्नी’ को दोहराता नहीं है। इसलिए अनुवाद समानांतरता को स्वाभाविक रहने देता है, पर अर्थ को केवल औपचारिक शिक्षा या किसी विशिष्ट धर्मवैज्ञानिक धारणा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; नीतिवचन के अनुरूप संक्षिप्त और गरिमापूर्ण शैली। ‘शांत स्वभाव वाली’ को ‘चुप रहने वाली’ पर प्राथमिकता दी गई है, ताकि पूर्ण मौन का अनावश्यक अर्थ न निकले।
