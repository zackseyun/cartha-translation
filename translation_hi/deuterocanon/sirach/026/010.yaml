  yaml_path: translation/deuterocanon/sirach/026/010.yaml
  text: A woman's sexual immorality is known by the lifting of her eyes[b][a], and by her eyelids.
translation:
  language: hi
  text: स्त्री की यौन अनैतिकता उसकी आँखों की चंचलता[a] और उसकी पलकों[b] से पहचानी जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँखें उठाने,” “आँखों के भटकाव” अथवा “अभिमानी दृष्टि।” यूनानी अभिव्यक्ति कठिन है और ऊपर उठी हुई, इधर-उधर घूमती या संकेतपूर्ण दृष्टि की ओर इशारा कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसकी पलकों में।” सम्भवतः आशय आँखों के हाव-भाव या दृष्टि से प्रकट होने वाली बात से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορνεία
  choice: यौन अनैतिकता
  rationale: यह शब्द अवैध या अनैतिक यौन आचरण का व्यापक अर्थ रखता है। यह अनुवाद अर्थ को केवल वेश्यावृत्ति या किसी एक प्रकार के व्यभिचार तक सीमित नहीं करता।
- source_word: γυναικὸς
  choice: स्त्री की
  rationale: सम्बन्धकारक रूप को स्वाभाविक हिन्दी में अधिकार-सूचक ढंग से रखा गया है; यहाँ कथन किसी एक विशेष स्त्री के बजाय सामान्य नीतिवचन के रूप में है।
- source_word: ἐν
  choice: से
  rationale: यहाँ ἐν उन बाहरी संकेतों का क्षेत्र बताता है जिनसे बात पहचानी जाती है। हिन्दी में साधन या संकेत के अर्थ में ‘से’ अधिक स्वाभाविक है।
- source_word: μετεωρισμοῖς
  choice: चंचलता
  rationale: शब्द में ऊपर उठने, अस्थिर होने या इधर-उधर घूमने का भाव हो सकता है। आँखों के साथ ‘चंचलता’ इस कठिन अभिव्यक्ति की गतिशीलता बचाती है, जबकि उसके भाव को केवल घमंड या लुभावनी दृष्टि तक सीमित नहीं करती।
- source_word: ὀφθαλμῶν
  choice: आँखों की
  rationale: यूनानी पाठ की स्पष्ट शारीरिक छवि को बनाए रखा गया है और इसे μετεωρισμοῖς के साथ स्वाभाविक हिन्दी सम्बन्ध में रखा गया है।
- source_word: βλεφάροις
  choice: पलकों
  rationale: मूल शब्द विशेष रूप से पलकों को दर्शाता है। सम्भव है कि यह आँखों के हाव-भाव का लाक्षणिक संकेत हो, फिर भी ठोस मूल छवि को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: γνωσθήσεται
  choice: पहचानी जाती है
  rationale: यूनानी भविष्यत् कर्मवाच्य यहाँ सामान्य नीतिवचन का बल रख सकता है। हिन्दी का सामान्य वर्तमान काल उस सार्वकालिक कथन को स्वाभाविक ढंग से व्यक्त करता है और कर्मवाच्य भाव बनाए रखता है।
