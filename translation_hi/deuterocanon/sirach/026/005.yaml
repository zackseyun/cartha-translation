    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: तीन बातों से
  rationale: ἀπό यहाँ भय के कारण का परिचय देता है। हिन्दी में गिनती के साथ निहित संज्ञा स्पष्ट करने के लिए ‘बातों’ जोड़ा गया है, पर आगे आने वाले संदर्भों को अधिक निश्चित नहीं किया गया।
- source_word: εὐλαβήθη
  choice: भयभीत हुआ
  rationale: यहाँ क्रिया श्रद्धामिश्रित आदर के बजाय आशंका या भय व्यक्त करती है; सामाजिक संकटों की आगामी सूची इसी अर्थ का समर्थन करती है।
- source_word: ἡ καρδία μου
  choice: मेरा हृदय
  rationale: मूल का शारीरिक-मानवीय बिंब सुरक्षित रखा गया है। ‘हृदय’ भीतरी प्रतिक्रिया के केंद्र के रूप में हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: चौथे मुख के सामने
  rationale: πρόσωπον का मूल अर्थ ‘मुख/चेहरा’ है, पर इसका अर्थ ‘व्यक्ति’ भी हो सकता है। असामान्य बिंब को मुख्य पाठ में रखा गया है और संभावित अर्थों को पादटिप्पणी में बताया गया है।
- source_word: ἐδεήθην
  choice: मैंने विनती की
  rationale: δέομαι विनती, याचना या प्रार्थना करने को व्यक्त कर सकता है। यूनानी वाक्य में विनती का संबोधन स्पष्ट नहीं है, इसलिए ‘विनती की’ उस अस्पष्टता को बनाए रखता है और परमेश्वर को अनकहे रूप में नहीं जोड़ता।
theological_decisions:
- issue: ἐπὶ τῷ τετάρτῳ προσώπῳ की असामान्य अभिव्यक्ति
  choice: मुख के बिंब को मुख्य पाठ में बनाए रखना
  alternative: चौथे व्यक्ति के विषय में; चौथी बात के कारण
  rationale: मूल में πρόσωπον स्पष्ट रूप से आया है, किंतु संदर्भ में यह किसी व्यक्ति या गिनाई गई चौथी परिस्थिति की ओर संकेत कर सकता है। मुख्य पाठ में बिंब और पादटिप्पणी में विकल्प रखना वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखता है।
- issue: ἐδεήθην में विनती का संबोधन
  choice: संबोधन को अनिर्दिष्ट रखना
  alternative: मैंने परमेश्वर से प्रार्थना की
  rationale: क्रिया प्रार्थना के अर्थ में प्रयुक्त हो सकती है, पर इस वाक्य में परमेश्वर का नाम या अन्य संबोधन नहीं है। इसलिए उसे पाठ में जोड़ना मूल से अधिक स्पष्टता देना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। ‘हृदय’ मूल बिंब को बनाए रखता है; ‘भयभीत हुआ’ और ‘विनती की’ साधारण पाठक के लिए स्पष्ट हैं। असामान्य ‘चौथे मुख’ को व्याख्यात्मक रूप से समतल करने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
