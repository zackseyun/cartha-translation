translation:
  language: hi
  text: निर्लज्ज आँख से अपने आप को बचा[a], और यदि वह[b] तेरे विरुद्ध पाप करे, तो अचंभित मत होना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक रूप लगभग ‘निर्लज्ज आँख के पीछे/से अपने को बचा’ है। यह पूर्वसर्गीय वाक्यांश कठिन और संभवतः मुहावरेदार है; यहाँ उसका संभावित आशय दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ ‘वह’ के लिए कोई स्पष्ट सर्वनाम नहीं है। स्त्रीलिंग कर्ता आस-पास के प्रसंग से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω
  choice: से
  rationale: ὀπίσω का मूल अर्थ ‘पीछे’ या ‘के पीछे’ है, पर यहाँ φύλαξαι के साथ इसका प्रयोग कठिन और संभवतः मुहावरेदार है। हिन्दी में ‘से अपने को बचा’ सुरक्षात्मक दूरी का संभावित भाव स्वाभाविक रूप से व्यक्त करता है; शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀναιδοῦς
  choice: निर्लज्ज
  rationale: यह शब्द लज्जा या संकोच के अभाव और ढिठाई का बोध कराता है। ‘निर्लज्ज’ आधुनिक हिन्दी में स्पष्ट है और मूल के नैतिक-सामाजिक भाव को बनाए रखता है।
- source_word: ὀφθαλμοῦ
  choice: आँख
  rationale: मूल में ठोस संज्ञा ‘आँख’ है। ‘निगाह’ अधिक मुहावरेदार हो सकती थी, पर ‘आँख’ मूल बिंब को सुरक्षित रखती है।
- source_word: φύλαξαι
  choice: अपने को बचा
  rationale: यह आदेशात्मक क्रिया सावधान रहने और अपनी रक्षा करने का भाव देती है। ‘अपने को बचा’ हिन्दी में संक्षिप्त, स्वाभाविक और प्रत्यक्ष है।
- source_word: μὴ θαυμάσῃς
  choice: अचंभा न करना
  rationale: चेतावनी के इस प्रसंग में क्रिया का आशय किसी घटना पर चकित न होने से है। यह पदबंध मूल आदेश को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है। ‘यदि’ संभाव्यता को बनाए रखता है और घटना को अनिवार्य मानकर नहीं चलता।
- source_word: εἰς σέ
  choice: तेरे विरुद्ध
  rationale: πλημμελέω के साथ यह उस व्यक्ति को सूचित करता है जिसके प्रति अपराध किया गया है। ‘तेरे विरुद्ध’ इस संबंधपरक अपराध को स्पष्ट करता है।
- source_word: πλημμελήσῃ
  choice: पाप करे
  rationale: क्रिया अनुचित काम, अपराध या पाप करने का अर्थ दे सकती है। ‘पाप करे’ इसके नैतिक भार को बनाए रखता है, जबकि ‘गलत करे’ अपेक्षाकृत हल्का पड़ता।
theological_decisions:
- issue: दूसरे उपवाक्य में कर्ता का लिंग और पहचान मूल यूनानी में स्पष्ट रूप से व्यक्त नहीं है
  choice: मुख्य पाठ में संदर्भानुसार स्त्रीलिंग ‘वह’ रखा गया और पादटिप्पणी में इसकी व्याख्या की गई।
  alternative: ‘यदि ऐसा व्यक्ति तेरे विरुद्ध पाप करे’ अथवा कर्ता को अस्पष्ट रखने वाली रचना।
  rationale: आस-पास का साहित्यिक प्रसंग एक दुराचारी स्त्री/पत्नी के विषय में है, इसलिए स्त्रीलिंग कर्ता संदर्भसम्मत है; फिर भी यूनानी क्रिया में स्वतंत्र सर्वनाम नहीं है, अतः इस व्याख्यात्मक पूर्ति को पारदर्शी बनाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ज्ञान-साहित्य के प्रत्यक्ष संबोधन को बनाए रखने के लिए एकवचन ‘तेरे’ और आदेशात्मक ‘बचा/करना’ का प्रयोग किया गया है। मूल के ठोस ‘आँख’ बिंब और कठिन संबंधसूचक वाक्यांश की अनिश्चितता को पादटिप्पणी सहित सुरक्षित रखा गया है।
