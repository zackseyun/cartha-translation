  yaml_path: translation/deuterocanon/sirach/026/029.yaml
  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
translation:
  language: hi
  text: व्यापारी मुश्किल से ही गलत काम से बच पाएगा[a], और दुकानदार[b] पाप से धर्मी नहीं ठहराया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गलत काम से शायद ही बच निकलेगा।” यूनानी क्रिया का अर्थ किसी बात से बच निकलना या अपने को उससे छुड़ा लेना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दुकानदार” के लिए प्रयुक्त यूनानी शब्द छोटे स्तर के खुदरा विक्रेता को दर्शाता है और कभी-कभी उसमें नकारात्मक सामाजिक भाव भी जुड़ा होता था।
    reason: cultural_note
lexical_decisions:
- source_word: Μόλις
  choice: मुश्किल से ही
  rationale: यह यूनानी क्रियाविशेषण किसी बात के बड़ी कठिनाई से या लगभग न हो पाने का भाव देता है; यह हिन्दी में सूक्ति का जोर स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐξελεῖται
  choice: बच पाएगा
  rationale: मध्यवाच्य रूप और ἀπό के साथ यह किसी बुराई से बच निकलने या स्वयं को उससे अलग रखने का भाव देता है। ‘बच पाएगा’ सम्भावना और कठिनाई दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἔμπορος
  choice: व्यापारी
  rationale: यह व्यापार में लगे व्यक्ति के लिए सामान्य और तटस्थ हिन्दी शब्द है।
- source_word: πλημμελείας
  choice: गलत काम
  rationale: मूल शब्द दोष, अपराध या अनुचित आचरण का व्यापक नैतिक अर्थ रखता है। ‘गलत काम’ इसे केवल व्यापारिक बेईमानी तक सीमित नहीं करता।
- source_word: δικαιωθήσεται
  choice: निर्दोष ठहराया जाएगा
  rationale: निष्क्रिय क्रिया का न्यायिक-घोषणात्मक बल इस प्रसंग में ‘निर्दोष ठहराया जाएगा’ से स्पष्ट होता है, बिना किसी बाद की विशिष्ट धर्मवैज्ञानिक व्यवस्था को आरोपित किए।
- source_word: κάπηλος
  choice: दुकानदार
  rationale: यह छोटे स्तर पर सामान बेचने वाले खुदरा विक्रेता के लिए सहज आधुनिक हिन्दी है; मूल में सम्भव सामाजिक नकारात्मकता को टिप्पणी में बताया गया है, संज्ञा में आरोपित नहीं किया गया।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यह स्पष्ट नैतिक-धार्मिक दोष का मानक शब्द है, इसलिए इसे हल्का करके केवल ‘गलती’ नहीं किया गया।
theological_decisions:
- issue: ज्ञान-साहित्य के प्रसंग में δικαιωθήσεται का अर्थ
  choice: निर्दोष ठहराया जाएगा
  alternative: धर्मी ठहराया जाएगा
  rationale: यहाँ क्रिया का घोषणात्मक और न्यायिक भाव बनाए रखना आवश्यक है, पर पद को किसी विशिष्ट बाद की धर्मवैज्ञानिक शिक्षा का तकनीकी कथन नहीं बनाना चाहिए। ‘निर्दोष ठहराया जाएगा’ इस प्रसंग में अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूक्तिपरक चेतावनी की कठोरता बनी रहती है, जबकि व्यापार से जुड़े दोनों यूनानी पदों का अंतर ‘व्यापारी’ और ‘दुकानदार’ से व्यक्त किया गया है।
