base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/024.yaml
  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
translation:
  language: hi
  text: निर्दोषों के मार्ग सीधे हैं; पर परायों के लिए वे विनाशकारी बन जाते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है: “व्यवस्थाहीन लोगों के लिए ठोकरें।” संभवतः यूनानी पाठ इब्रानी के “परायों” को परमेश्वर के मार्ग से अलग लोगों के अर्थ में समझाता है।'
    reason: alternative_reading
  - marker: b
    text: अंतिम इब्रानी क्रिया का अर्थ कठिन और अनिश्चित है। “विनाशकारी बन जाते हैं” का भाव यूनानी समानांतर के “ठोकरें” से निर्देशित है।
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  choice: मार्ग
  rationale: बहुवचन ‘राहों/मार्गों’ का बोध देता है और यहाँ जीवन-चाल के रूपक को बनाए रखता है। हिन्दी में सामूहिक अर्थ वाला ‘मार्ग’ स्वाभाविक है।
- source_word: תמים
  choice: निर्दोष लोगों
  rationale: इस शब्द का अर्थ निष्कलंक, खरा या सीधा-सच्चा हो सकता है। ‘निर्दोष’ उसके नैतिक अर्थ को रखता है, जबकि यूनानी समानांतर के ‘पवित्र/भक्त’ अर्थ को मुख्य पाठ में नहीं मिलाता।
- source_word: יישרו
  choice: सीधे किए जाते हैं
  rationale: ישר से बना यह रूप मार्गों के सीधे अथवा सुगम किए जाने का भाव देता है। यह अनुवाद क्रियात्मक बल को बनाए रखता है।
- source_word: כן
  choice: पर
  rationale: शाब्दिक अर्थ प्रायः ‘ऐसे ही/इस प्रकार’ है, किंतु यहाँ समानांतर वाक्यखंड स्पष्ट विरोध प्रस्तुत करते हैं; ‘पर’ उस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לזרים
  choice: परायों के लिए
  rationale: זר का मूल अर्थ पराया, बाहरी या अजनबी है। ‘परायों’ से इब्रानी की अस्पष्टता बनी रहती है और उन्हें मुख्य पाठ में ही ‘व्यवस्थाहीन’ नहीं ठहराया जाता।
- source_word: יסתוללו
  choice: विनाशकारी बन जाते हैं
  rationale: यह अंतिम इब्रानी क्रिया दुर्लभ और अर्थ की दृष्टि से कठिन है। यूनानी समानांतर का ‘ठोकर के कारण’ वाला अर्थ बाधा और पतन की दिशा दिखाता है; ‘विनाशकारी’ नकारात्मक परिणाम को व्यक्त करता है, पर सटीक व्युत्पत्ति का दावा नहीं करता।
theological_decisions:
- issue: इब्रानी ‘पराये’ और यूनानी ‘व्यवस्थाहीन’ के बीच अंतर
  choice: मुख्य पाठ में इब्रानी पर आधारित ‘परायों’ रखा गया
  alternative: व्यवस्थाहीन लोगों के लिए
  rationale: उपलब्ध और उच्च-विश्वसनीयता वाले इब्रानी पाठ को प्राथमिकता दी गई है। यूनानी संभवतः उन ‘परायों’ की नैतिक व्याख्या करता है जो परमेश्वर के मार्ग से अलग हैं; उस व्याख्या को मुख्य पाठ में समाहित करने के बजाय पाद-टिप्पणी में रखा गया है।
- issue: कठिन अंतिम इब्रानी क्रिया का अर्थ
  choice: विनाशकारी बन जाते हैं
  alternative: ठोकर के कारण बन जाते हैं
  rationale: इब्रानी क्रिया का सटीक अर्थ अनिश्चित है। मुख्य पाठ व्यापक नकारात्मक परिणाम व्यक्त करता है, जबकि यूनानी की अधिक विशिष्ट व्याख्या पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘मार्ग’ के जीवन-चाल संबंधी रूपक तथा ‘परायों’ की वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
