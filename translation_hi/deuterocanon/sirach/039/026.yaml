base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: hi
  text: 'मानव जीवन के लिए मुख्य आवश्यकताएँ हैं: पानी, आग, लोहा और नमक; गेहूँ का महीन आटा[a], दूध और शहद; अंगूर का रक्त[b], तेल और वस्त्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: काहिरा गनीज़ा के इब्रानी पाठ में यहाँ की शब्दावली कुछ कठिन है; यूनानी समानांतर पाठ ‘गेहूँ का महीन आटा’ के अर्थ का समर्थन करता है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक इब्रानी ‘अंगूर का रक्त’ है। इसका संकेत अंगूर से बने पेय की ओर हो सकता है, जिसमें दाखरस भी सम्मिलित है; यहाँ मूल बिंब को सुरक्षित रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: मनुष्य के जीवन की मूल आवश्यकताएँ
  rationale: ראש यहाँ समयगत ‘आरम्भ’ नहीं, बल्कि जीवन के लिए प्रधान या बुनियादी वस्तुओं को सूचित करता है। यह अनुवाद इब्रानी मुहावरे और यूनानी समानांतर ἀρχὴ πάσης χρείας का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: מים, ואש וברזל ומלח
  choice: पानी, आग, लोहा और नमक
  rationale: सूची की ठोस वस्तुओं का सीधा और आधुनिक हिन्दी रूप।
- source_word: חלב חטה
  choice: गेहूँ का मैदा
  rationale: प्राप्त इब्रानी पाठ कठिन है; यूनानी σεμίδαλις πυρός महीन गेहूँ के आटे का समर्थन करता है। ‘मैदा’ सामान्य पाठक के लिए महीन गेहूँ के आटे का सहज नाम है।
- source_word: חלב ודבש
  choice: दूध और मधु
  rationale: संदर्भ तथा यूनानी γάλα καὶ μέλι क्रमशः ‘दूध’ और ‘मधु’ की पुष्टि करते हैं। ‘मधु’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है।
- source_word: דם עינב
  choice: अंगूर का रक्त
  rationale: इब्रानी की सजीव उपमा और यूनानी αἷμα σταφυλῆς दोनों को सुरक्षित रखता है तथा इसे केवल दाखरस या अंगूर के रस के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יצהר
  choice: तेल
  rationale: शब्द सामान्यतः ताजा तेल, प्रायः जैतून का तेल, सूचित करता है; पर पद में स्पष्ट न की गई विशिष्टता जोड़े बिना ‘तेल’ पर्याप्त है।
- source_word: בגד
  choice: वस्त्र
  rationale: इब्रानी एकवचन का सामूहिक भाव है; हिन्दी में ‘वस्त्र’ इस आवश्यकता को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: אדם का सामान्य मानव-संदर्भ
  choice: मनुष्य के जीवन
  alternative: पुरुष के जीवन / आदमी के जीवन
  rationale: यहाँ אדם पूरी मानवजाति के सामान्य जीवन को सूचित करता है, किसी पुरुष-विशेष को नहीं। ‘मनुष्य’ अर्थ-सटीक और आधुनिक मानक हिन्दी है।
- issue: דם עינב की पेय-संबंधी व्याख्या
  choice: अंगूर का रक्त
  alternative: अंगूर का रस / दाखरस
  rationale: मूल की काव्यात्मक अभिव्यक्ति यह खुला छोड़ती है कि संकेत व्यापक अंगूरी पेय की ओर है या विशेषतः दाखरस की ओर; अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण सूची-विन्यास रखा गया है। ‘मूल आवश्यकताएँ’ ראש के मुहावरेदार अर्थ को स्पष्ट करता है; ‘अंगूर का रक्त’ मूल की काव्यात्मकता और अर्थगत खुलापन बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
