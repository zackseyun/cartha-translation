translation:
  language: hi
  text: यह मत कहो[a], “यह उससे बुरा है,” क्योंकि सब कुछ अपने समय पर अच्छा सिद्ध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ यहाँ कुछ कठिन है। अधिक शाब्दिक अनुवाद संभवतः “यह बुरा है—यह क्या है?” होगा; यूनानी समानांतर अर्थ को “यह उससे बुरा है” के रूप में स्पष्ट करता है।
    reason: textual_variant
lexical_decisions:
- source_word: אל לאמר
  choice: यह मत कहो
  rationale: निषेधवाचक אל और לאמר को स्वाभाविक आधुनिक हिन्दी में नकारात्मक आज्ञा के रूप में व्यक्त किया गया है।
- source_word: זה רע מה זה
  choice: यह उससे बुरा है
  rationale: प्राप्त इब्रानी वाक्यांश कठिन है, पर यूनानी समानांतर Τοῦτο τούτου πονηρότερον स्पष्ट तुलनात्मक अर्थ देता है; इसलिए इब्रानी की कठिनता छिपाए बिना मुख्य पाठ में संभावित आशय रखा गया है।
- source_word: הכל
  choice: हर वस्तु
  rationale: यह व्यापक अर्थ को बनाए रखता है और हिन्दी में सृष्ट वस्तुओं के संदर्भ में स्वाभाविक है।
- source_word: בעתו
  choice: अपने समय पर
  rationale: सर्वनाम-प्रत्यय सहित काल-संबंधी अर्थ को सीधा और सहज रूप दिया गया है।
- source_word: יגביר
  choice: उत्तम सिद्ध होगी
  rationale: इब्रानी क्रिया इस प्रसंग में कठिन है; यूनानी εὐδοκιμηθήσεται के सहारे सकारात्मक मूल्यांकन—उत्तम या मान्य सिद्ध होने—का अर्थ लिया गया है, न कि केवल बलपूर्वक प्रबल होने का।
theological_decisions:
- issue: कठिन इब्रानी पाठ और यूनानी समानांतर के बीच संबंध
  choice: किसी वस्तु को दूसरी से बुरा घोषित न करने की मनाही, और प्रत्येक वस्तु के उचित समय पर उत्तम सिद्ध होने की बात
  alternative: “यह बुरा है—यह क्या है?” और “हर वस्तु अपने समय पर प्रबल होगी”
  rationale: इब्रानी प्राथमिक साक्ष्य है, किंतु उसका वाक्य-विन्यास और अंतिम क्रिया यहाँ कठिन हैं। प्राचीन यूनानी समानांतर तुलनात्मक तथा सकारात्मक मूल्यांकन का अर्थ स्पष्ट करता है। पादटिप्पणी पाठगत अनिश्चितता को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “उत्तम सिद्ध होगी” मूल्यांकनात्मक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक पाठगत कठिनाई को सुरक्षित रखती है।
