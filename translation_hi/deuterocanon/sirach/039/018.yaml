  yaml_path: translation/deuterocanon/sirach/039/018.yaml
  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: hi
  text: जो वह चाहता है, वह सफल होता है[a], और उसके उद्धार में कोई बाधा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जो उसे भाता है, वह फलता-फूलता है।” यूनानी समानांतर पाठ है: “उसकी आज्ञा से हर शुभ इच्छा पूरी होती है, और कोई ऐसा नहीं जो उसके उद्धार को कम कर सके।”'
    reason: תאות רצונו के अधिक शाब्दिक/वैकल्पिक अर्थ तथा यूनानी समानांतर पाठ को दर्शाने के लिए।
lexical_decisions:
- source_word: תאות רצונו
  choice: उसकी इच्छा की अभिलाषा
  rationale: इब्रानी रचना को निकटता से रखते हुए תאוה के ‘अभिलाषा/जो चाहा गया है’ और רצון के ‘इच्छा/प्रसन्नता’ दोनों पक्षों को सुरक्षित रखता है। अधिक स्वाभाविक विकल्प ‘जो वह चाहता है’ है, पर वह मूल की संज्ञात्मक रचना को कुछ समतल कर देता है।
- source_word: יצליח
  choice: सफल होती है
  rationale: צלח के हिफ़ील रूप का अर्थ सफल होना या फलना-फूलना है; यहाँ ‘सफल होती है’ परमेश्वर की इच्छा के प्रभावी रूप से सिद्ध होने को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: מעצור
  choice: बाधा
  rationale: यह शब्द रोक, अवरोध या बाधा को सूचित करता है। ‘बाधा’ इब्रानी के निराकार कथन को बनाए रखता है, जबकि यूनानी में व्यक्ति-केंद्रित ‘कोई घटाने वाला नहीं’ मिलता है।
- source_word: תשועתו
  choice: उसके उद्धार
  rationale: תשועה और समानांतर यूनानी σωτήριον दोनों उद्धार या छुटकारे को व्यक्त कर सकते हैं। ‘उद्धार’ इसकी व्यापक बाइबलीय गंभीरता बनाए रखता है, बिना इसे किसी संकीर्ण सिद्धान्तगत अर्थ तक सीमित किए।
theological_decisions:
- issue: תשועתו को संकीर्ण आत्मिक मोक्ष के रूप में समझना या व्यापक बचाव/उद्धार के रूप में
  choice: उसके उद्धार
  alternative: उसके छुटकारे; उसके बचाने के कार्य
  rationale: यह पद परमेश्वर की अजेय बचाने वाली सामर्थ्य की सामान्य बात करता है। ‘उद्धार’ मूल शब्द का धार्मिक भार बनाए रखता है, पर संदर्भ से अधिक विशिष्ट सिद्धान्त आरोपित नहीं करता।
- issue: परमेश्वर की इच्छा के प्रभावी होने को नियतिवादी भाषा में तीखा करना
  choice: सफल होती है
  alternative: अवश्य पूरी होती है
  rationale: मूल יצליח सफलता या सिद्धि बताता है; ‘अवश्य’ जोड़ने से कथन मूल से अधिक निरपेक्ष और व्याख्यात्मक हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त शैली। ‘उसकी इच्छा की अभिलाषा’ जानबूझकर कुछ औपचारिक है ताकि इब्रानी संज्ञात्मक रचना और उसकी वास्तविक अस्पष्टता बनी रहे; पादटिप्पणी अधिक स्वाभाविक वैकल्पिक अर्थ देती है।
