  yaml_path: translation/deuterocanon/sirach/039/014.yaml
  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: hi
  text: अपनी आवाज़ें ऊँची करो और मिलकर याहवे को धन्य कहो; उसके सभी कामों के लिए उसे धन्यवाद दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “और लोबान के समान सुगंध फैलाओ, सोसन के समान खिलो; सुगंध फैलाओ और स्तुति का गीत गाओ।” यह अधिक विस्तृत पाठ उपलब्ध हिब्रू पंक्ति से भिन्न पाठ-रूप को दर्शाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הרימו קולכם
  choice: अपनी आवाज़ें ऊँची करो
  rationale: बहुवचन आज्ञा और सामूहिक आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। हिब्रू में ‘आवाज़’ व्याकरणतः एकवचन है, पर बहुवचन संबोधन के कारण हिन्दी में ‘आवाज़ें’ अधिक सहज और स्पष्ट है।
- source_word: וברכו יחדו
  choice: और मिलकर उसे धन्य कहो
  rationale: ברך के आराधनात्मक अर्थ ‘धन्य कहना’ को सुरक्षित रखा गया है और יחדו का सामुदायिक भाव ‘मिलकर’ से व्यक्त हुआ है। हिन्दी में कर्म के बिना ‘धन्य कहो’ अधूरा लगता, इसलिए प्रसंग से स्पष्ट ‘उसे’ जोड़ा गया है।
- source_word: והודו
  choice: उसका धन्यवाद करो
  rationale: आराधना के संदर्भ में ידה का हिफ़ील रूप कृतज्ञता प्रकट करने का अर्थ देता है; ‘धन्यवाद करो’ इस भाव को ‘स्तुति करो’ से अधिक स्पष्ट रूप में रखता है।
- source_word: ליהוה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; उसे उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: על כל מעשיו
  choice: उसके सभी कामों के लिए
  rationale: מעשים के ठोस संज्ञात्मक अर्थ ‘कामों/कार्यों’ को बनाए रखता है और על को इस धन्यवाद-संदर्भ में ‘के लिए’ से स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: हिब्रू में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ मूल नाम को पारदर्शी ढंग से प्रस्तुत करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: हिब्रू और यूनानी पाठ-रूपों में पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले हिब्रू पाठ का अनुसरण और यूनानी पाठ-रूप को पादटिप्पणी में देना
  alternative: यूनानी के अधिक विस्तृत काव्यात्मक पाठ को मुख्य पाठ बनाना
  rationale: हिब्रू पंक्ति अपने आप में सुसंगत है और परियोजना में प्राथमिक मूल-भाषा साक्ष्य है। यूनानी समानांतर एक अलग और अधिक विस्तृत पाठ-परंपरा को दर्शाता है, इसलिए उसे छिपाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ברכו में निहित कर्म
  choice: प्रसंगानुसार ‘उसे’ जोड़ना
  alternative: कर्म को अनकहा छोड़कर ‘मिलकर धन्य कहो’
  rationale: हिब्रू में कर्म अनकहा है, पर अगले खंड में याहवे स्पष्ट रूप से आराधना के लक्ष्य हैं। आधुनिक हिन्दी में कर्मरहित वाक्य अस्वाभाविक और अस्पष्ट होता; ‘उसे’ जोड़ना अर्थ को संप्रदायगत ढंग से सीमित किए बिना स्वाभाविकता देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना के लिए उपयुक्त रखी गई है। ‘धन्य कहो’ ने ברך की बाइबिलीय अभिव्यक्ति को सुरक्षित रखा है, जबकि ‘धन्यवाद करो’ ידה में निहित कृतज्ञता को स्पष्ट करता है।
