base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/003.yaml
  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
translation:
  language: hi
  text: वह नीतिवचनों की गूढ़ बातों को खोज निकालेगा[a], और दृष्टान्तों की पहेलियों में लगा रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नीतिवचनों की छिपी हुई बातों को।” यूनानी शब्द उन बातों को दर्शा सकता है जो छिपी हुई या अस्पष्ट हों, केवल उनके ‘गूढ़ अर्थ’ को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “दृष्टान्तों की पहेलियों के बीच अपना समय बिताएगा।” यूनानी क्रिया किसी क्षेत्र में विचरने, उससे संगति रखने या उसमें लगे रहने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  choice: गूढ़ बातों
  rationale: यह नपुंसकलिंग बहुवचन संज्ञात्मक रूप उन बातों को दर्शाता है जो छिपी हुई या समझने में कठिन हैं। “गूढ़ बातें” अर्थ को केवल किसी एक छिपे हुए ‘अर्थ’ तक सीमित नहीं करता।
- source_word: παροιμιῶν
  choice: नीतिवचनों की
  rationale: παροιμία यहाँ ज्ञानपरक लोकोक्ति या सूक्ति को दर्शाता है; “नीतिवचन” इस साहित्यिक संदर्भ में स्वाभाविक और पहचाना हुआ शब्द है।
- source_word: ἐκζητήσει
  choice: खोज निकालेगा
  rationale: ἐκζητέω में मन लगाकर और पूरी तरह खोजने का भाव है; “खोज निकालेगा” इस प्रबल खोज को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν αἰνίγμασι
  choice: पहेलियों में
  rationale: αἴνιγμα अस्पष्ट, सांकेतिक या पहेली-जैसी अभिव्यक्ति है। ἐν उस क्षेत्र को बताता है जिसमें व्यक्ति लगा रहता है।
- source_word: παραβολῶν
  choice: दृष्टान्तों की
  rationale: παραβολή तुलना, रूपक या दृष्टान्त को सूचित कर सकता है। “दृष्टान्त” इस व्यापक साहित्यिक प्रयोग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀναστραφήσεται
  choice: लगा रहेगा
  rationale: यहाँ क्रिया किसी क्षेत्र में विचरने, उससे जुड़े रहने या उसमें समय लगाने का भाव देती है; “लगा रहेगा” निरन्तर संलग्नता को सरल आधुनिक हिन्दी में व्यक्त करता है।
