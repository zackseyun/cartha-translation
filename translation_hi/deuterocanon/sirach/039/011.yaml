  yaml_path: translation/deuterocanon/sirach/039/011.yaml
  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: hi
  text: यदि वह दृढ़ बना रहे, तो वह ऐसा नाम छोड़ जाएगा जो हज़ार लोगों के नाम से बढ़कर होगा[a]; और यदि वह विश्राम पाए[b], तो वह ऐसे कार्य करता रहता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक रूप लगभग ‘हज़ार से बढ़कर नाम छोड़ेगा’ है। सम्भवतः आशय यह है कि उसका नाम हज़ार अन्य लोगों के नाम से बढ़कर होगा।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘विश्राम पाए’ का अर्थ मृत्यु को प्राप्त होना भी हो सकता है, यद्यपि इस अभिव्यक्ति में सामान्य विश्राम का व्यापक अर्थ भी बना रहता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में ‘उन्हें’ एक अनिश्चित बहुवचन सर्वनाम है। इसका संकेत सम्भवतः उसके कार्यों या प्रभावों की ओर है; ‘ऐसे कार्य’ हिन्दी में इसे समझने योग्य बनाने के लिए जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: यदि वह दृढ़ बना रहे
  rationale: ἐμμένω में बने रहने, लगे रहने और दृढ़तापूर्वक जारी रखने का भाव है। यह अनुवाद उसके स्थायित्व और दृढ़ता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὄνομα καταλείψει
  choice: वह ऐसा नाम छोड़ जाएगा
  rationale: यूनानी मुहावरा शाब्दिक रूप से पीछे ‘नाम’ छोड़ने की बात करता है, अर्थात स्थायी ख्याति या स्मृति। ‘नाम’ को बनाए रखने से बाइबिलीय मुहावरा सुरक्षित रहता है।
- source_word: ἢ χίλιοι
  choice: जो हज़ार लोगों के नाम से बढ़कर होगा
  rationale: प्रेषित यूनानी पाठ का ἢ χίλιοι शाब्दिक रूप से कठिन है। यहाँ ἢ को तुलनात्मक ‘से’ मानकर संभावित आशय व्यक्त किया गया है कि उस व्यक्ति की ख्याति हज़ार अन्य लोगों की ख्याति से बढ़कर होगी; कठिनाई को पादटिप्पणी में दर्ज किया गया है।
- source_word: ἐὰν ἀναπαύσηται
  choice: यदि वह विश्राम पाए
  rationale: ἀναπαύομαι विश्राम करने या विश्राम पाने को दर्शाता है और प्रसंग में मृत्यु की ओर भी संकेत कर सकता है। ‘विश्राम पाए’ दोनों संभावनाएँ खुली रखता है।
- source_word: ἐμποιεῖ
  choice: तो भी वह ... पूरा करता है
  rationale: ἐμποιέω का अर्थ उत्पन्न करना, कार्यान्वित करना या घटित करना हो सकता है। ‘पूरा करता है’ यहाँ उसके कार्यों या प्रभावों के जारी रहने का स्वाभाविक भाव देता है; ‘तो भी’ प्रसंगगत विरोध को स्पष्ट करता है।
- source_word: αὐτά
  choice: उन्हें
  rationale: यूनानी सर्वनाम बहुवचन और संदर्भ की दृष्टि से अनिश्चित है। ‘उन्हें’ इस अनिश्चितता को बनाए रखता है और किसी विशिष्ट पूर्वपद को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: ἀναπαύσηται में मृत्यु का संभावित संकेत
  choice: ‘विश्राम पाए’ कहना, न कि स्पष्ट रूप से ‘मर जाए’
  alternative: यदि वह मर जाए
  rationale: पद संभवतः ज्ञानी की मृत्यु के बाद भी उसके प्रभाव के जारी रहने की ओर संकेत करता है, पर यूनानी क्रिया सामान्यतः ‘विश्राम’ कहती है। इसलिए अनुवाद इस अर्थगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘नाम छोड़ जाएगा’ जैसे बाइबिलीय मुहावरे को बनाए रखते हुए कठिन तुलनात्मक वाक्यांश को मुख्य पाठ में समझने योग्य बनाया गया है और उसकी शाब्दिक असामान्यता पादटिप्पणी में सुरक्षित रखी गई है।
