translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। मूल की क्रमिक रचना—स्थान लेना, मनन करना, और लिखकर छोड़ना—बनाए रखी गई है; अनिर्दिष्ट कर्म के लिए हिन्दी में आवश्यक ‘उसे’ जोड़ा गया है।
