  terminology: No theological terminology is involved. The Greek note should render ἐστηρίχθην as 'मैं स्थापित किया गया' or 'मैं दृढ़ किया गया'; 'मुझे सामर्थ्य दी गई' adds a less direct interpretive nuance and is best avoided.
