  text: Therefore from the beginning I took my stand[a], and I considered, and I set it down in writing.
translation:
  language: hi
  text: इसलिए आरम्भ ही से मैंने अपना स्थान ग्रहण किया[a], और मनन किया, और उसे लिखकर छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ “मैं स्थापित किया गया” या “मैं दृढ़ किया गया” है, जबकि इब्रानी में “मैंने अपना स्थान ग्रहण किया” है। मुख्य पाठ यहाँ प्राथमिक साक्षी के रूप में इब्रानी का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: על כן
  choice: इसलिए
  rationale: यह पद पिछले विचार से निकले निष्कर्ष को व्यक्त करता है; आधुनिक हिन्दी में ‘इसलिए’ स्वाभाविक और स्पष्ट है।
- source_word: מראש
  choice: आरम्भ ही से
  rationale: इब्रानी पद आरम्भिक बिंदु से समयगत संबंध बताता है; यूनानी ἐξ ἀρχῆς भी इसी अर्थ की पुष्टि करता है। ‘ही’ आरम्भ से ही किए गए संकल्प पर स्वाभाविक बल देता है।
- source_word: התיצבתי
  choice: मैंने अपना स्थान लिया
  rationale: יצב के हित्पएल रूप में स्वयं को किसी स्थान पर खड़ा करने या अपना स्थान लेने का भाव है। यह इब्रानी की कर्तृक और जानबूझकर की गई क्रिया को बनाए रखता है।
- source_word: והתבוננתי
  choice: मैंने मनन किया
  rationale: यह क्रिया ध्यानपूर्वक विचार करने और समझने का भाव देती है; ‘मनन किया’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ובכתב הנחתי
  choice: उसे लिखित रूप में रख छोड़ा
  rationale: यह अनिर्दिष्ट विचार-वस्तु को लिखकर सुरक्षित छोड़ देने का भाव रखता है। ‘रख छोड़ा’ इब्रानी הנחתי और यूनानी ἀφῆκα में निहित छोड़ने/सुरक्षित रखने की छाया को बनाए रखता है।
