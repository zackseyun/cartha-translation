base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: hi
  text: वह अपने हृदय को इस बात में लगाएगा कि वह भोर को उठकर अपने बनानेवाले प्रभु की ओर उन्मुख हो[a]; वह परमप्रधान के सामने विनती करेगा। वह प्रार्थना में अपना मुँह खोलेगा और अपने पापों के विषय में विनती करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोर ही से अपने बनानेवाले प्रभु को खोजे।” यूनानी क्रिया का मूल अर्थ भोर में उठना है, पर प्रसंग में वह उत्सुकता से भोर ही से खोजने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: अपने हृदय को इस बात में लगाएगा
  rationale: यह प्रयोग मनुष्य के भीतरी संकल्प और सचेत समर्पण को व्यक्त करता है। ‘हृदय लगाएगा’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी वाक्य की प्रयोजनपरकता बनाए रखता है।
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: भोर को उठकर प्रभु की ओर उन्मुख हो
  rationale: ὀρθρίσαι का मूल भाव भोर में उठना है, जबकि πρὸς दिशा या अभिमुखता बताता है। इस अनुवाद में दोनों तत्व स्पष्ट रहते हैं और ‘प्रभु को भोर में खोजे’ जैसी संभावित प्रासंगिक व्याख्या मुख्य पाठ में आरोपित नहीं होती।
- source_word: τὸν ποιήσαντα αὐτόν
  choice: अपने बनानेवाले
  rationale: कर्तृवाचक कृदन्त प्रभु को उस व्यक्ति को बनानेवाले के रूप में पहचानता है। यह हिन्दी में संक्षिप्त और पारदर्शी है; ‘सृष्टिकर्ता’ से अधिक निकटता से मूल पदबंध का अनुसरण करता है।
- source_word: ἔναντι Ὑψίστου
  choice: परमप्रधान के सामने
  rationale: ἔναντι उपस्थिति अथवा सम्मुख होने का भाव रखता है। ‘के सामने’ स्थानिक-श्रद्धापूर्ण रूपक को बनाए रखता है, और ‘परमप्रधान’ Ὕψιστος का प्रचलित धार्मिक अनुवाद है।
- source_word: δεηθήσεται
  choice: विनती करेगा
  rationale: यह क्रिया सामान्य प्रार्थना से अधिक निवेदन या याचना का भाव देती है। दोनों स्थानों पर एक ही अनुवाद रखने से मूल की पुनरावृत्ति सुरक्षित रहती है।
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: प्रार्थना में अपना मुँह खोलेगा
  rationale: मूल की सजीव अभिव्यक्ति और समानांतर रचना को बनाए रखा गया है; इसे केवल ‘प्रार्थना करेगा’ कहकर सपाट नहीं किया गया।
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: अपने पापों के विषय में
  rationale: περί यहाँ विनती की विषयवस्तु बताता है। यह अनुवाद क्षमा, प्रायश्चित या अंगीकार को स्पष्ट रूप से जोड़ने के बजाय मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ संदर्भ परमेश्वर का है और ‘प्रभु’ आधुनिक हिन्दी बाइबलीय प्रयोग में श्रद्धापूर्ण तथा स्वाभाविक है।
- issue: पापों के संबंध में की गई विनती का आशय
  choice: अपने पापों के विषय में विनती करेगा
  alternative: अपने पापों की क्षमा के लिए विनती करेगा
  rationale: यूनानी पाठ विनती को पापों से संबंधित बताता है, पर उसके विशिष्ट उद्देश्य को क्षमा, अंगीकार या प्रायश्चित के रूप में निर्धारित नहीं करता। मुख्य पाठ उसी theological openness को सुरक्षित रखता है।
- issue: ὀρθρίσαι में खोजने का संभावित निहितार्थ
  choice: भोर को उठकर ... उन्मुख हो
  alternative: भोर ही से प्रभु को खोजे
  rationale: क्रिया का प्रत्यक्ष अर्थ भोर में उठना है; संदर्भ में तत्पर खोज या आराधना का भाव संभव है, पर ‘खोजना’ स्पष्ट कर्म के रूप में उपस्थित नहीं है। इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय लगाना’, ‘उन्मुख होना’, ‘विनती करना’ और ‘प्रार्थना में अपना मुँह खोलना’ मूल की औपचारिकता तथा काव्यात्मक समानांतरता को बनाए रखते हैं।
