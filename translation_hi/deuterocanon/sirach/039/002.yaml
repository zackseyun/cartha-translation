translation:
  language: hi
  text: वह प्रसिद्ध पुरुषों के वृत्तांत सँजोकर रखेगा और दृष्टांतों के घुमावों में प्रवेश करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: वृत्तांत
  rationale: यह बहुवचन संज्ञा कथनों या विवरणों को सूचित करती है; ‘वृत्तांत’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: प्रसिद्ध पुरुषों के
  rationale: ὀνομαστός का अर्थ नामी या विख्यात है, और ἀνδρῶν यहाँ विशिष्ट पुरुषों को संदर्भित करता है।
- source_word: συντηρήσει
  choice: सँजोकर रखेगा
  rationale: क्रिया में ध्यानपूर्वक सुरक्षित रखने और स्मरण में बनाए रखने का भाव है; यह हिन्दी अभिव्यक्ति दोनों पक्षों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: στροφαῖς
  choice: घुमावों
  rationale: शब्द का मूल बिंब मोड़ या घुमाव है और प्रसंग में दृष्टांतों की जटिल पेचीदगियों की ओर संकेत करता है; ठोस रूपक को बनाए रखा गया है।
- source_word: παραβολῶν
  choice: दृष्टांतों के
  rationale: ज्ञान-साहित्य के संदर्भ में παραβολή के लिए प्रचलित और उपयुक्त हिन्दी शब्द ‘दृष्टांत’ है।
- source_word: συνεισελεύσεται
  choice: प्रवेश करेगा
  rationale: यौगिक क्रिया भीतर जाने या किसी विषय में उतरने का भाव देती है; ‘प्रवेश करेगा’ स्रोत के रूपक को बनाए रखता है।
