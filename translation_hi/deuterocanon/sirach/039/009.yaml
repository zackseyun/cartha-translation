base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: hi
  text: बहुत-से लोग उसकी समझ की प्रशंसा करेंगे; वह सदा के लिए मिटाई नहीं जाएगी। उसका स्मरण कभी समाप्त नहीं होगा, और उसका नाम पीढ़ी-दर-पीढ़ी[a] जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पीढ़ियों की पीढ़ियों तक।” यह यूनानी अभिव्यक्ति लगातार आने वाली अनेक पीढ़ियों तक बने रहने का मुहावरा है।
    reason: मूल मुहावरे का अधिक शाब्दिक रूप और उसकी अवधि स्पष्ट करना।
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: प्रशंसा करेंगे
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह मौखिक सराहना का भाव रखता है।
- source_word: σύνεσιν
  choice: समझ
  rationale: यहाँ विवेकपूर्ण समझ या अंतर्दृष्टि का भाव है; ‘समझ’ आधुनिक पाठक के लिए सहज है और ज्ञान-साहित्य के प्रसंग में उपयुक्त है।
- source_word: ἕως τοῦ αἰῶνος
  choice: सदा के लिए
  rationale: यह मुहावरा स्थायी बने रहने का भाव देता है; हिन्दी में ‘सदा के लिए’ स्पष्ट और स्वाभाविक है।
- source_word: ἐξαλειφθήσεται
  choice: मिटाई नहीं जाएगी
  rationale: क्रिया मिटा देने या लोप कर देने की ठोस छवि रखती है; कर्मवाच्य रूप यूनानी संरचना को सुरक्षित रखता है।
- source_word: μνημόσυνον
  choice: स्मरण
  rationale: समानांतर पद ‘उसका नाम ... जीवित रहेगा’ के कारण यहाँ किसी भौतिक स्मारक से अधिक व्यक्ति की बनी रहने वाली याद अभिप्रेत है।
- source_word: οὐκ ἀποστήσεται
  choice: कभी समाप्त नहीं होगा
  rationale: शाब्दिक ‘दूर नहीं होगा’ हिन्दी में स्मरण के साथ असहज है; यह रूप स्मरण के न मिटने का आशय स्वाभाविक ढंग से व्यक्त करता है, जबकि स्थायित्व का बल बनाए रखता है।
- source_word: ὄνομα
  choice: नाम
  rationale: मूल शब्द का सीधा अनुवाद; प्रसंग में नाम प्रतिष्ठा और स्थायी ख्याति का भी संकेत देता है।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: नाम के ‘जीने’ का मानवीकरण सुरक्षित रखा गया है।
- source_word: εἰς γενεὰς γενεῶν
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली अनेक पीढ़ियों तक बने रहने का सामी-शैली का गहन मुहावरा है; ‘पीढ़ी-दर-पीढ़ी’ उसका स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: स्थायी ख्याति से जुड़ी काव्यात्मक छवियों की शाब्दिकता
  choice: समझ के मिटाए न जाने, स्मरण के समाप्त न होने और नाम के जीवित रहने की अलग-अलग छवियाँ बनाए रखी गईं।
  alternative: उसकी विरासत सदा बनी रहेगी।
  rationale: अमूर्त ‘विरासत’ में समेट देने से मूल की काव्यात्मक समानांतरता और ज्ञान-साहित्य का तनाव घट जाता; चुना गया रूप किसी अतिरिक्त धर्मसिद्धान्त को जोड़े बिना मूल छवियों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ज्ञान-साहित्यिक लहजा। काव्यात्मक समानांतरता और ‘नाम के जीवित रहने’ का मानवीकरण सुरक्षित रखा गया है; अस्वाभाविक शाब्दिक हिन्दी से बचते हुए मूल अर्थ के निकट रहा गया है।
