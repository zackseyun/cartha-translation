base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/004.yaml
  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: hi
  text: वह प्रतिष्ठित पुरुषों के बीच सेवा करेगा और किसी शासक के सामने उपस्थित होगा। वह विदेशी राष्ट्रों की भूमि से होकर यात्रा करेगा, क्योंकि उसने मनुष्यों के बीच भले और बुरे को परखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसने मनुष्यों के बीच भले और बुरे का अनुभव किया है।” यूनानी क्रिया का अर्थ आज़माकर परखना या अनुभव से जानना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: बड़े-बड़े लोगों के बीच
  rationale: ἀνὰ μέσον का स्वाभाविक अर्थ ‘के बीच’ है और μεγιστάνων ऊँचे पद अथवा प्रतिष्ठा वाले प्रभावशाली व्यक्तियों को सूचित करता है। ‘बड़े-बड़े लोग’ आधुनिक हिन्दी में सामाजिक प्रतिष्ठा का अर्थ सहज रूप से देता है।
- source_word: ὑπηρετήσει
  choice: सेवा करेगा
  rationale: यह क्रिया सेवा या परिचर्या करने को सूचित करती है। ‘सेवा करेगा’ दरबारी अथवा आधिकारिक संदर्भ के लिए पर्याप्त व्यापक है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: किसी शासक के सामने उपस्थित होगा
  rationale: ἡγούμενος नेतृत्व या शासन करने वाले व्यक्ति को दर्शाता है और ὀφθήσεται का शाब्दिक भाव ‘दिखाई देगा’ है। संयुक्त वाक्यांश के लिए ‘सामने उपस्थित होगा’ शासक से भेंट या दरबार में पहुँचने का स्वाभाविक हिन्दी रूप है।
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν
  choice: पराए राष्ट्रों की धरती
  rationale: ἀλλοτρίων में अपने से भिन्न अथवा पराए होने का भाव है और ἐθνῶν बहुवचन में राष्ट्रों/जातियों को दर्शाता है। ‘पराए राष्ट्रों की धरती’ स्रोत की बाहरी भू-राजनीतिक दृष्टि और बहुवचन दोनों को बनाए रखता है।
- source_word: διελεύσεται
  choice: से होकर यात्रा करेगा
  rationale: क्रिया किसी क्षेत्र को पार करने या उसमें से होकर जाने को सूचित करती है। यह चयन हिन्दी में यात्रा के भाव को स्पष्ट और सहज बनाता है।
- source_word: ἐπείρασεν
  choice: अनुभव किया है
  rationale: πειράω जाँचने, आज़माने और अनुभव से जानने—इन अर्थों को समेट सकता है। यहाँ ज्ञानी की यात्राओं और मानवीय जीवन से प्राप्त व्यावहारिक जानकारी के संदर्भ में ‘अनुभव किया है’ स्वाभाविक है; परीक्षण का वैकल्पिक सक्रिय भाव पाद-टिप्पणी में सुरक्षित है।
- source_word: ἀγαθὰ καὶ κακὰ
  choice: भले और बुरे
  rationale: यह व्यापक नैतिक और अनुभवात्मक विरोधी युग्म है। ‘भले और बुरे’ इसे केवल सुख-दुःख या समृद्धि-विपत्ति तक सीमित नहीं करता।
- source_word: ἐν ἀνθρώποις
  choice: मनुष्यों के बीच
  rationale: यह वाक्यांश मानव समाज के भीतर होने का भाव देता है। ‘मनुष्यों’ में यूनानी के सामान्य मानव-संदर्भ को स्वाभाविक आधुनिक हिन्दी में रखा गया है, बिना इसे केवल पुरुषों तक सीमित किए।
theological_decisions:
- issue: μεγιστάνων और ἀνθρώποις में व्याकरणिक पुल्लिंग तथा सामान्य मानव-संदर्भ
  choice: ‘बड़े-बड़े लोगों’ और ‘मनुष्यों’ का प्रयोग
  alternative: ‘महान पुरुषों’ और ‘पुरुषों’ का प्रयोग
  rationale: इन यूनानी बहुवचनों का संदर्भ क्रमशः प्रतिष्ठित व्यक्तियों और सामान्य मानव समाज से है; पद में केवल जैविक पुरुषों को लक्ष्य करने का स्पष्ट संकेत नहीं है। आधुनिक हिन्दी में ‘लोग’ और ‘मनुष्य’ स्रोत के सामाजिक और सार्वमानवीय अर्थ को अधिक ठीक तथा स्वाभाविक रूप में व्यक्त करते हैं।
- issue: ἐπείρασεν का परीक्षण बनाम अनुभव
  choice: मुख्य पाठ में ‘अनुभव किया है’
  alternative: ‘परख की है’ या ‘आज़माया है’
  rationale: क्रिया परीक्षण और अनुभव दोनों का अर्थ दे सकती है। यात्रा तथा लोगों के बीच अर्जित ज्ञान के प्रसंग में अनुभव का अर्थ प्रबल है, पर सक्रिय रूप से परखने की वास्तविक शाब्दिक संभावना पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उपस्थित होगा’ दरबारी संदर्भ को स्वाभाविक बनाता है, जबकि ‘पराए राष्ट्रों की धरती’ मूल के बहुवचन और बाहरीपन के भाव को सुरक्षित रखता है।
