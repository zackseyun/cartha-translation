base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: hi
  text: न्याय के लिए सृजे गए आत्मिक प्राणी[a] हैं; वे अपने क्रोध में पहाड़ों को हटा देते हैं। प्रकोप के समय वे अपना पराक्रम दिखाते हैं[b] और खुले मैदान से आँधी उठा देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय-दंड के लिए सृजी गई हवाएँ।” इब्रानी רוחות और यूनानी πνεύματα दोनों का अर्थ “आत्माएँ/आत्मिक प्राणी” या “हवाएँ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद का उत्तरार्ध काहाना के काहिरा गनीज़ा-आधारित इब्रानी संस्करण में कोष्ठकों में है, जो कुछ पाठगत अनिश्चितता दिखाता है; यूनानी पाठ इस विस्तृत भाव को शामिल करने का समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: आत्मिक प्राणी
  rationale: רוחות का अर्थ ‘आत्माएँ’ या ‘हवाएँ’ दोनों हो सकता है। यहाँ सृजे जाने और न्याय के साधन के रूप में कार्य करने की भाषा कुछ हद तक व्यक्तित्वयुक्त शक्तियों की ओर संकेत करती है; ‘आत्मिक प्राणी’ आधुनिक हिन्दी में इसे स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: למשפט
  choice: न्याय के लिए
  rationale: यह उद्देश्य बताता है और दंडात्मक कार्य को समेटते हुए भी अर्थ को केवल ‘दंड’ तक सीमित नहीं करता।
- source_word: נוצרו
  choice: सृजे गए
  rationale: निफ़अल रूप का निष्क्रिय अर्थ ‘रचे/सृजे गए’ है; यूनानी ἔκτισται भी इसकी पुष्टि करता है और सृष्टिकर्ता को निहित रहने देता है।
- source_word: ובאפם
  choice: अपने क्रोध में
  rationale: אף यहाँ प्रचलित मुहावरे के अनुसार ‘क्रोध’ है; यूनानी θυμός भी यही अर्थ समर्थित करता है।
- source_word: הרים יעתיקו
  choice: पहाड़ों को हटा देते हैं
  rationale: יעתיקו पहाड़ों को उनके स्थान से खिसकाने या हटाने की प्रबल छवि देता है; ‘हटा देते हैं’ उस चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בעת זעם
  choice: प्रकोप के समय
  rationale: זעם दैवी या दंडात्मक रोष को दर्शाता है; ‘प्रकोप’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: גבורתם יראו
  choice: वे अपना पराक्रम दिखाते हैं
  rationale: वाक्यांश उनकी शक्ति के प्रकट या प्रदर्शित होने को बताता है; यह कर्तृवाच्य हिन्दी में सहज है।
- source_word: וסער מן שדה יעוררו
  choice: खुले मैदान से आँधी उठा देते हैं
  rationale: סער तूफ़ान/आँधी और יעוררו उसे जगाने या उठाने को दर्शाता है। שדה का मूल अर्थ मैदान या खुला देश है; ‘खुला मैदान’ अनावश्यक रूप से ‘उजाड़’ का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: רוחות/πνεύματα को हवाएँ माना जाए या व्यक्तित्वयुक्त आत्मिक शक्तियाँ
  choice: मुख्य पाठ में ‘आत्मिक प्राणी’
  alternative: ‘न्याय-दंड के लिए सृजी गई हवाएँ’
  rationale: इब्रानी और यूनानी दोनों शब्दार्थों की अनुमति देते हैं। सृजे जाने, क्रोध करने और पराक्रम दिखाने की भाषा व्यक्तित्वयुक्त अर्थ का समर्थन करती है, पर आँधी की छवि मौसम-संबंधी अर्थ को जीवित रखती है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: काहाना संस्करण में कोष्ठकबद्ध उत्तरार्ध को शामिल करना
  choice: मुख्य पाठ में शामिल किया गया
  alternative: केवल पहले दो उपवाक्यों का अनुवाद
  rationale: इब्रानी संपादित पाठ इस अंश को अनिश्चितता के संकेत के साथ देता है, जबकि यूनानी समान विस्तृत सामग्री की गवाही देता है। अतः अंश को रखते हुए पाठगत अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आत्मिक प्राणी’ से रוחות का व्यक्तित्वयुक्त अर्थ स्पष्ट किया गया है, और ‘खुले मैदान’ से שדה का ठोस भौगोलिक चित्र सुरक्षित रखा गया है।
