  yaml_path: translation/deuterocanon/sirach/039/008.yaml
  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: hi
  text: वह स्वयं अपने उपदेश की शिक्षा को स्पष्ट करता है,[a] और प्रभु की वाचा की व्यवस्था पर गर्व करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने उपदेश के अनुशासन को प्रकाश में लाता है।” यूनानी शब्दों में चरित्र-निर्माणकारी अनुशासन और किसी बात को प्रत्यक्ष करने के भाव भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रभु की वाचा की व्यवस्था पर गौरव करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: सर्वनाम का बल बनाए रखता है और सामान्य हिन्दी में स्वाभाविक है।
- source_word: ἐκφαίνει
  choice: स्पष्ट करता है
  rationale: किसी बात को प्रकाश में लाने या प्रत्यक्ष और बोधगम्य बनाने का भाव व्यक्त करता है।
- source_word: παιδείαν
  choice: सीख
  rationale: यहाँ शिक्षा से मिलने वाले शिक्षण और चरित्र-निर्माणकारी अनुशासन, दोनों की संभावना रखता है; मुख्य पाठ में सरल 'सीख' स्वाभाविक है।
- source_word: διδασκαλίας
  choice: शिक्षा
  rationale: शिक्षण के सामान्य अर्थ को रखता है और अनावश्यक रूप से तकनीकी या सांप्रदायिक नहीं बनता।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: यहूदी प्रज्ञा-साहित्य के संदर्भ में νόμος के धार्मिक और तोराही अर्थ को व्यक्त करने वाला प्रचलित बाइबलीय हिन्दी शब्द है।
- source_word: διαθήκης
  choice: वाचा
  rationale: प्रभु के साथ संबंधित धार्मिक संबंध और प्रतिज्ञाबद्ध व्यवस्था के लिए मानक तथा सटीक बाइबलीय शब्द है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος का प्रतिष्ठित, स्पष्ट और धार्मिक संदर्भ के अनुकूल हिन्दी रूप।
- source_word: καυχήσεται
  choice: गर्व करेगा
  rationale: भविष्यकालीन आत्मगौरव या उल्लास का सीधा आधुनिक हिन्दी रूप; प्रसंग में सकारात्मक अर्थ संभव है।
theological_decisions:
- issue: ἐν νόμῳ διαθήκης Κυρίου में 'व्यवस्था' और 'वाचा' का संबंध
  choice: प्रभु की वाचा की व्यवस्था पर
  alternative: प्रभु की व्यवस्था—अर्थात उसकी वाचा—पर
  rationale: सम्बन्धकारक διαθήκης को νόμῳ का विशेषक मानते हुए यूनानी की सघन रचना और उसकी वास्तविक अस्पष्टता यथासंभव रखी गई है; समानाधिकरण को मुख्य पाठ में निश्चित नहीं किया गया।
- issue: καυχήσεται का मूल्यगत भाव
  choice: गर्व करेगा
  alternative: गौरव करेगा
  rationale: यूनानी क्रिया घमंड, गर्व या उल्लासपूर्ण गौरव—इन अर्थों को ग्रहण कर सकती है। मुख्य पाठ सीधा lexical अर्थ रखता है और टिप्पणी सकारात्मक 'गौरव' की संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। 'शिक्षा की सीख' यूनानी παιδείαν διδασκαλίας की निकटवर्ती शैक्षिक संज्ञाओं को अलग रखते हुए हल्की पुनरुक्ति स्वीकार करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध वाक्यांशों के बाद दिए गए हैं।
