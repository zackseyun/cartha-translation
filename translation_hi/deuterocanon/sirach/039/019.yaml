  yaml_path: translation/deuterocanon/sirach/039/019.yaml
  text: The deeds of all flesh are before him[b][a], and nothing is hidden from before his eyes.
translation:
  language: hi
  text: हर प्राणी के कर्म उसके सामने हैं,[a] और उसकी आँखों से कुछ भी छिपा नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘समस्त देह’; इसका अर्थ ‘हर जीवित प्राणी’ या सन्दर्भानुसार ‘सारी मानवजाति’ भी हो सकता है। यूनानी समानांतर पाठ में भी ‘समस्त देह’ है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पाठ में: ‘और उसकी आँखों से छिपना सम्भव नहीं है,’ जो असम्भवता को इब्रानी से कुछ अधिक स्पष्ट करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: कर्म
  rationale: एकवचन रचना यहाँ सामूहिक अर्थ देती है—सभी प्राणियों के किए हुए काम। ‘कर्म’ स्वाभाविक और गरिमापूर्ण है तथा यूनानी ἔργα से भी मेल खाता है।
- source_word: כל בשר
  choice: हर प्राणी
  rationale: शाब्दिक अर्थ ‘समस्त देह’ है, पर आधुनिक हिन्दी में वह अस्वाभाविक और अस्पष्ट लगेगा। ‘हर प्राणी’ इब्रानी मुहावरे की व्यापकता बनाए रखता है और इसे केवल मनुष्यों तक सीमित नहीं करता।
- source_word: נגדו
  choice: उसके सामने
  rationale: यह किसी की उपस्थिति या दृष्टि के सामने होने का भाव व्यक्त करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: אין נסתר
  choice: कुछ भी छिपा नहीं है
  rationale: यह इब्रानी के सीधे कथन को सुरक्षित रखता है। यूनानी समानांतर पाठ छिप सकने की असम्भवता को कुछ अधिक स्पष्ट करता है।
- source_word: מנגד עיניו
  choice: उसकी आँखों से
  rationale: यह मूल के दृष्टि-संबंधी ठोस बिंब को बनाए रखते हुए हिन्दी में सहज अभिव्यक्ति देता है।
theological_decisions:
- issue: ईश्वर की दृष्टि में ‘כל בשר’ का दायरा
  choice: ‘हर प्राणी’ कहकर व्यापक अर्थ बनाए रखा गया है।
  alternative: ‘सभी मनुष्य’ या शाब्दिक ‘समस्त देह’
  rationale: इब्रानी और यूनानी दोनों का मुहावरा व्यापक है। इसे केवल मानवजाति तक सीमित करना पाठ की वास्तविक अर्थ-संभावना को अनावश्यक रूप से सुलझा देता।
- issue: ईश्वरीय दृष्टि से छिपने का कथन
  choice: इब्रानी के अनुसार ‘कुछ भी छिपा नहीं है।’
  alternative: यूनानी के अनुसार ‘छिपना सम्भव नहीं है।’
  rationale: मुख्य पाठ उच्च-विश्वसनीयता वाले इब्रानी स्रोत का सीधा अर्थ रखता है, जबकि यूनानी की अधिक स्पष्ट असम्भवता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘हर प्राणी’ मूल मुहावरे की व्यापकता को प्राकृतिक हिन्दी में व्यक्त करता है; ‘आँखों’ का ठोस बिंब सुरक्षित रखा गया है।
