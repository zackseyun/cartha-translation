  yaml_path: translation/deuterocanon/sirach/039/021.yaml
  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: hi
  text: यह न कहना चाहिए[a], “यह क्यों, और वह क्यों?” क्योंकि हर वस्तु अपने समय पर प्रबल होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “यह क्या है? यह किसलिए है? क्योंकि सभी वस्तुएँ आवश्यकताओं की पूर्ति के लिए रची गई हैं।” इब्रानी पाठ के अंतिम खंड में है: “क्योंकि हर वस्तु अपने समय पर प्रबल होगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  choice: यह न कहना चाहिए
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘कहना नहीं है’ जैसा है; सामान्य निषेध को आधुनिक और स्वाभाविक हिन्दी में ‘यह न कहना चाहिए’ व्यक्त करता है।
- source_word: זה למה זה
  choice: “यह क्यों, और वह क्यों?”
  rationale: दोहराए गए זה और למה की प्रश्नात्मक तथा शिकायतपूर्ण ध्वनि को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כי
  choice: क्योंकि
  rationale: यह निषेध के पीछे का कारण प्रस्तुत करने वाला सीधा कारणबोधक संयोजक है।
- source_word: הכל
  choice: हर वस्तु
  rationale: सन्दर्भ में समस्त वस्तुओं या परिस्थितियों का व्यापक अर्थ है; ‘हर वस्तु’ अगले एकवचन ‘अपने समय’ के साथ भी सहज बैठता है।
- source_word: בעתו
  choice: अपने समय पर
  rationale: प्रत्यय सहित एकवचन रूप प्रत्येक वस्तु के उचित या नियत समय की ओर संकेत करता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: יגבר
  choice: प्रबल होगी
  rationale: גבר का मूल भाव बलवान होना या प्रबल होना है। ‘प्रबल होगी’ इस बल-संबंधी अर्थ को बनाए रखता है, बिना इसे ‘सफल होगी’ या ‘उपयोगी सिद्ध होगी’ जैसी अधिक व्याख्यात्मक भाषा में बदलने के।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का महत्वपूर्ण अंतर
  choice: 'मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिकता: “क्योंकि हर वस्तु अपने समय पर प्रबल होगी।”'
  alternative: “क्योंकि सभी वस्तुएँ उनकी आवश्यकता/उपयोग के लिए रची गई हैं।”
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य अनुवाद उसी का अनुसरण करता है। यूनानी समानांतर पाठ सृष्टि और उपयोगिता पर बल देता है, जो इब्रानी के समय और प्रबलता वाले कथन से अर्थ की दृष्टि से पर्याप्त भिन्न है; अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘प्रबल होगी’ को जानबूझकर बनाए रखा गया है ताकि इब्रानी גבר की शक्ति-संबंधी अस्पष्टता और तनाव सुरक्षित रहे।
