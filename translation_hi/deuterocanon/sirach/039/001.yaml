  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: hi
  text: किन्तु उस व्यक्ति की बात अलग है, जो अपने आपको समर्पित करता है[a] और परमप्रधान की व्यवस्था पर मनन करता है। वह सभी प्राचीनों की सारी बुद्धि को खोजेगा और भविष्यवाणियों में व्यस्त रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “अपना प्राण सौंपता है”; यहाँ इसका भाव अपने पूरे आपको समर्पित करना है।
    reason: lexical_alternative
  - marker: b
    text: या “भविष्यसूचक लेखों के अध्ययन में व्यस्त रहेगा”; यूनानी में शब्दशः “भविष्यवाणियों में व्यस्त रहेगा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν τοῦ
  choice: किन्तु उस व्यक्ति की बात अलग है
  rationale: यह पद पिछले प्रसंग के कारीगरों से विद्वान व्यक्ति का विरोध दिखाता है। यूनानी में Πλὴν के बाद संबंधकारक कृदन्त है; शब्दशः संरचना हिन्दी में अस्वाभाविक होती, इसलिए विरोध और अपवाद दोनों को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: अपने आपको समर्पित करता है
  rationale: वाक्यांश का शब्दशः अर्थ अपना प्राण/स्वयं सौंपना है। यहाँ ψυχή पूरे व्यक्ति के लिए मुहावरेदार ढंग से प्रयुक्त है; अनिर्दिष्ट कर्म को अनावश्यक रूप से स्पष्ट किए बिना आत्मसमर्पण का प्रबल भाव रखा गया है।
- source_word: διανοουμένου ἐν νόμῳ Ὑψίστου
  choice: परमप्रधान की व्यवस्था पर मनन करता है
  rationale: διανοέομαι विचारपूर्वक मानसिक संलग्नता बताता है, जिसके लिए ज्ञान-साहित्य के प्रसंग में ‘मनन’ उपयुक्त है। Ὑψίστος परमेश्वर की उपाधि के रूप में ‘परमप्रधान’ किया गया है।
- source_word: σοφίαν πάντων ἀρχαίων
  choice: सभी प्राचीन ज्ञानियों की बुद्धि
  rationale: ἀρχαῖοι पुराने समय के लोगों को सूचित करता है। केवल ‘प्राचीनों’ की अपेक्षा ‘प्राचीन ज्ञानियों’ से हिन्दी में आशय स्पष्ट और प्रसंगानुकूल होता है, जबकि उनकी बुद्धि खोजने का मूल भाव बना रहता है।
- source_word: ἐκζητήσει
  choice: खोजेगा
  rationale: संयुक्त क्रिया लगन और उद्देश्यपूर्ण खोज का भाव रखती है। हिन्दी की ‘खोजना’ इस प्रसंग में जाँच-पड़ताल सहित तलाश का स्वाभाविक अर्थ देती है।
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: भविष्यवाणियों में लगा रहेगा
  rationale: ἀσχολέομαι किसी कार्य में व्यस्त या संलग्न रहने को बताता है। ‘लगा रहेगा’ निरन्तर संलग्नता व्यक्त करता है और προφητεῖαι का सीधा अर्थ ‘भविष्यवाणियाँ’ बनाए रखता है।
theological_decisions:
- issue: समर्पण के अनकहे कर्म का संदर्भ
  choice: 'कर्म को अनकहा रखा गया: ‘अपने आपको समर्पित करता है’'
  alternative: ‘व्यवस्था के अध्ययन में अपने आपको लगा देता है’ या ‘इस काम के लिए अपने आपको समर्पित करता है’
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि वह अपने आपको किसे या किस कार्य को सौंपता है। आसपास का प्रसंग ज्ञान और व्यवस्था के अध्ययन की ओर संकेत करता है, पर उसे मुख्य पाठ में जोड़ना मूल की अपेक्षा अधिक विशिष्ट होता।
- issue: προφητείαις का आशय
  choice: भविष्यवाणियों
  alternative: भविष्यसूचक लेखों
  rationale: मूल शब्द भविष्यवाणियों को सीधे सूचित करता है; यहाँ लिखित भविष्यसूचक ग्रन्थ अभिप्रेत हो सकते हैं, पर पाठ स्वयं उस माध्यम को स्पष्ट नहीं करता। इसलिए व्यापक अर्थ मुख्य पाठ में और सम्भावित अर्थ टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज ज्ञान-साहित्यीय स्तर रखा गया है। ‘व्यवस्था’, ‘परमप्रधान’, ‘मनन’ और ‘भविष्यवाणियाँ’ जैसे स्थापित बाइबलीय शब्द सामान्य पाठक के लिए समझने योग्य हैं।
