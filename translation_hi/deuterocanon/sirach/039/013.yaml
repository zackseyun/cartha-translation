  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: hi
  text: मेरी सुनो, हे पवित्र पुत्रो[a], और खेत की जलधारा के किनारे उगते गुलाब की तरह अंकुरित होओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र पुत्रो’ का अनुवाद ‘भक्त पुत्रो’ भी हो सकता है। विशेषण ऐसे लोगों को सूचित कर सकता है जो भक्तिपूर्ण या धर्मनिष्ठ आचरण करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘खेत की जलधारा के पास उगने वाले गुलाब की तरह पल्लवित होओ।’ मूल में पौधे की बढ़त का उपदेशात्मक चित्र है; क्रिया को ‘अंकुरित होओ’ या ‘पल्लवित होओ’ कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσακούσατέ
  choice: मेरी सुनो
  rationale: आज्ञार्थक क्रिया ध्यान देकर सुनने की सीधी पुकार व्यक्त करती है। ‘मेरी सुनो’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: υἱοὶ
  choice: पुत्रो
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन सम्बोधन है; ‘पुत्रो’ उसके रूप को बनाए रखता है।
- source_word: ὅσιοι
  choice: पवित्र
  rationale: यह शब्द धार्मिक निष्ठा, भक्तिपरायणता या पवित्र आचरण का बोध करा सकता है। ‘पवित्र’ पद की ऊँची धार्मिक शैली को संक्षेप में बनाए रखता है।
- source_word: βλαστήσατε
  choice: अंकुरित होओ
  rationale: यह आज्ञार्थक क्रिया वनस्पति की नई बढ़त फूटने का चित्र प्रस्तुत करती है। ‘अंकुरित होओ’ उस चित्र को ‘खिलो’ की अपेक्षा अधिक ठीक रूप से रखता है।
- source_word: ῥόδον
  choice: गुलाब
  rationale: यूनानी संज्ञा का सामान्य और स्वाभाविक हिन्दी अर्थ ‘गुलाब’ है।
- source_word: φυόμενον
  choice: उगता है
  rationale: कृदन्त गुलाब के बढ़ने की जारी अवस्था बताता है; हिन्दी में सापेक्ष उपवाक्य ‘जो…उगता है’ स्पष्ट और स्वाभाविक है।
- source_word: ἐπὶ ῥεύματος ἀγροῦ
  choice: खेत की जलधारा के किनारे
  rationale: ἐπί यहाँ बहते पानी के पास होने का स्थानिक चित्र देता है, और ἀγροῦ उस जलधारा को खेत या खुले ग्रामीण भूभाग से जोड़ता है। यह हिन्दी रूप सम्बन्ध को बनाए रखते हुए सहज दृश्य प्रस्तुत करता है।
theological_decisions:
- issue: सम्बोधन υἱοὶ ὅσιοι
  choice: पवित्र पुत्रो
  alternative: भक्त पुत्रो / पवित्र सन्तानो
  rationale: मूल में पुल्लिंग बहुवचन ‘पुत्र’ है, इसलिए उसे लिंग-निरपेक्ष नहीं किया गया। ὅσιοι में पवित्रता और भक्तिपरायणता दोनों की छाया हो सकती है; मुख्य पाठ में ‘पवित्र’ और पादटिप्पणी में ‘भक्त’ विकल्प देकर इस अर्थ-व्याप्ति को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे’ से प्रत्यक्ष सम्बोधन स्पष्ट होता है। वनस्पति-वृद्धि का मूल रूपक और ‘पुत्रो’ का पुल्लिंग रूप सुरक्षित रखा गया है; कठिन यूनानी सम्बन्ध-वाक्यांश को बिना अनावश्यक विस्तार के ‘खेत की जलधारा’ कहा गया है।
