  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: hi
  text: 'आशीषें नील नदी के समान उमड़ पड़ीं[a],

    और नदी के समान संसार को सींच गईं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में बहुवचन ‘आशीषें’ है; यूनानी समानांतर पाठ में एकवचन ‘उसकी आशीष’ है।
    reason: alternative_reading
  - marker: b
    text: 'या, “संसार को भरपूर भिगो गईं।” यूनानी समानांतर पाठ है: “और बाढ़ के समान उसने सूखी भूमि को सराबोर कर दिया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: आशीषें
  rationale: इब्रानी शब्द बहुवचन है। इसलिए मुख्य पाठ में बहुवचन रखा गया है, यद्यपि यूनानी समानांतर पाठ में एकवचन ‘उसकी आशीष’ मिलता है।
- source_word: כיאור
  choice: नील नदी के समान
  rationale: इब्रानी יְאֹר सामान्यतः नील नदी को सूचित करता है; विशिष्ट नाम रखने से उसकी वार्षिक बाढ़ और प्रचुर जल की छवि बनी रहती है।
- source_word: הציפה
  choice: उमड़ पड़ीं
  rationale: क्रिया में उमड़ने, बह निकलने या बाढ़ की तरह फैलने का भाव है। यह अभिव्यक्ति नील नदी की छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: וכנהר
  choice: और नदी के समान
  rationale: यह दूसरी जल-उपमा को सीधे बनाए रखता है और पहले खंड के समानांतर पद-विन्यास को सुरक्षित रखता है।
- source_word: תבל
  choice: संसार
  rationale: תבל का अर्थ प्रायः बसा हुआ जगत या संसार है। ‘संसार’ इसके व्यापक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: ריותה
  choice: सींच दिया
  rationale: यह रूप पानी से तृप्त करने, भरपूर भिगोने या सराबोर करने का भाव देता है। ‘सींच दिया’ आशीष की जीवनदायी छवि को रखता है, जबकि अधिक प्रबल ‘भिगो दिया/सराबोर कर दिया’ को पादटिप्पणी में दर्शाया गया है।
theological_decisions:
- issue: ‘आशीष’ की वचन-संख्या
  choice: इब्रानी के अनुसार बहुवचन ‘आशीषें’
  alternative: यूनानी समानांतर पाठ के अनुसार एकवचन ‘उसकी आशीष’
  rationale: उच्च-विश्वास वाले इब्रानी मूल पाठ को प्राथमिकता दी गई है। यूनानी पाठ का वास्तविक पाठांतर पादटिप्पणी में सुरक्षित है; इस प्रकार किसी एक साक्ष्य को चुपचाप समाप्त नहीं किया गया।
- issue: आशीष देने वाले का स्पष्ट नाम
  choice: मुख्य पाठ में ‘उसकी’ या ‘परमेश्वर की’ नहीं जोड़ा गया
  alternative: यूनानी के अनुसार ‘उसकी आशीष’, अथवा संदर्भ स्पष्ट करने के लिए ‘परमेश्वर की आशीष’
  rationale: प्रस्तुत इब्रानी पंक्ति में सर्वनाम-सूचक प्रत्यय नहीं है। इसलिए मुख्य पाठ में ऐसा संदर्भ नहीं जोड़ा गया जो इस पंक्ति में प्रत्यक्ष रूप से उपस्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए दोनों पंक्तियों में ‘के समान’ रखा गया है। ‘उमड़ पड़ीं’ प्रचुरता और बाढ़ की गति व्यक्त करता है, जबकि ‘सींच दिया’ साधारण पाठक के लिए स्पष्ट रहते हुए ריותה के जल से तृप्त करने वाले भाव को सामने लाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
