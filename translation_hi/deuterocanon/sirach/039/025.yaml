translation:
  language: hi
  text: भले लोगों के लिए भलाई आरम्भ से ही नियत भाग है; उसी प्रकार[a] दुष्टों के लिए भलाई और बुराई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर: “भले लोगों के लिए अच्छी वस्तुएँ आरम्भ से रची गईं; उसी प्रकार पापियों के लिए बुरी वस्तुएँ।” यहाँ संरक्षित हिब्रू पाठ अधिक पूर्ण रूप में कहता है, “दुष्टों के लिए भलाई और बुराई।”'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: भलाई
  rationale: यहाँ טוב संज्ञा के रूप में व्यापक रूप से अच्छी या हितकारी वस्तु को दर्शाता है। ‘भलाई’ पद्य की संक्षिप्तता और טוב ורע के विरोध को बनाए रखता है।
- source_word: חלק
  choice: भाग ठहराई गई है
  rationale: חלק मूलतः ‘भाग’ या ‘हिस्सा’ है। क्रियारहित हिब्रू वाक्य को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘भाग ठहराई गई है’ उसके नियत हिस्से के भाव को स्पष्ट करता है।
- source_word: מראש
  choice: आरम्भ से ही
  rationale: מראש का स्वाभाविक अर्थ ‘आरम्भ से’ है; ‘ही’ मूल के कालगत बल को सहज हिन्दी में उभारता है।
- source_word: לרעים
  choice: दुष्टों के लिए
  rationale: רעים यहाँ नैतिक रूप से बुरे व्यक्तियों के लिए है। ‘दुष्टों’ ज्ञान-साहित्य के नैतिक विरोध को स्वाभाविक ढंग से व्यक्त करता है; यूनानी समानांतर में ‘पापियों’ का प्रयोग इसी व्यक्तिगत नैतिक अर्थ की पुष्टि करता है।
- source_word: טוב ורע
  choice: भलाई और बुराई
  rationale: यह चयन मूल की व्यापक और तीखी विरोधी जोड़ी को बिना उसे केवल समृद्धि-विपत्ति जैसे संकुचित अर्थ में बाँधे सुरक्षित रखता है।
theological_decisions:
- issue: अन्तिम उपवाक्य का यूनानी समानांतर से सम्बन्ध
  choice: हिब्रू पाठ के अनुसार दुष्टों के लिए भलाई और बुराई दोनों कही गई हैं।
  alternative: यूनानी समानांतर में केवल ‘पापियों के लिए बुरी वस्तुएँ’ कहा गया है।
  rationale: इस पद का प्राथमिक उपलब्ध साक्ष्य हिब्रू है, जिसमें स्पष्ट रूप से טוב ורע, ‘भलाई और बुराई’, दोनों हैं। यूनानी पाठ महत्त्वपूर्ण समानांतर साक्ष्य है, पर वह संरक्षित हिब्रू की अधिक पूर्ण अभिव्यक्ति को विस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘भले मनुष्य’ और ‘दुष्टों’ का नैतिक विरोध स्पष्ट है, जबकि ‘भलाई और बुराई’ मूल हिब्रू की अर्थगत व्यापकता तथा तनाव को बनाए रखता है।
