base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/029.yaml
  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: hi
  text: आग और ओले[a], अकाल और महामारी—ये भी न्याय के लिए रचे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “ये सब प्रतिशोध के लिए रचे गए” या “दण्ड के लिए रचे गए।” इब्रानी में “न्याय के लिए” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  choice: आग
  rationale: इब्रानी संज्ञा का सीधा और स्वाभाविक हिन्दी अर्थ; यूनानी πῦρ भी इसकी पुष्टि करता है।
- source_word: ברד
  choice: ओले
  rationale: मौसम-संबंधी विपत्ति के लिए आधुनिक हिन्दी का स्वाभाविक बहुवचन; यूनानी χάλαζα से भी पुष्टि होती है।
- source_word: רעב
  choice: अकाल
  rationale: विपत्तियों की इस सूची में यह निजी भूख नहीं, व्यापक खाद्य-संकट को दर्शाता है; यूनानी λιμός भी इसी अर्थ का समर्थन करता है।
- source_word: דבר
  choice: महामारी
  rationale: इब्रानी में इसका अर्थ घातक संक्रामक विपत्ति या मरी है। 'महामारी' आधुनिक पाठक के लिए स्पष्ट है और यूनानी के व्यापक 'मृत्यु' अर्थ में इसे विलीन नहीं करती।
- source_word: גם אלה
  choice: ये भी
  rationale: वाक्यांश का योगात्मक बल सरल और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: למשפט
  choice: न्याय के लिए
  rationale: משפט के न्यायिक अर्थ को बनाए रखता है और उसे केवल 'दण्ड' तक सीमित नहीं करता।
- source_word: נוצרו
  choice: रचे गए
  rationale: निष्क्रिय बहुवचन और सृष्टिकर्ता की निहित क्रिया दोनों को व्यक्त करता है; हिन्दी में सृष्टि के प्रसंग के अनुकूल और गरिमापूर्ण है।
theological_decisions:
- issue: अंतिम उपवाक्य में इब्रानी और यूनानी पाठ की अर्थ-छाया
  choice: मुख्य पाठ में इब्रानी के अनुसार 'न्याय के लिए'
  alternative: यूनानी के अनुसार 'प्रतिशोध के लिए' या 'दण्ड देने के लिए'
  rationale: उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ में למשפט है, जिसका व्यापक न्यायिक अर्थ है। यूनानी ἐκδίκησιν इसे दण्डात्मक प्रतिफल की ओर अधिक स्पष्ट करता है। इसलिए इब्रानी मुख्य पाठ का आधार है और यूनानी भिन्नता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। 'ओले' और 'महामारी' बोलचाल में समझ आने वाले हैं, जबकि 'न्याय के लिए रचे गए' मूल की धार्मिक और न्यायिक अर्थ-व्याप्ति को बनाए रखता है।
