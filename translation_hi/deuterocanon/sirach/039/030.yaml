base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: hi
  text: जंगली पशुओं के दाँत, बिच्छू और विषैले साँप,[a] और दुष्टों का विनाश[b] करने के लिए बदला लेने वाली तलवार—ये सब अपने-अपने प्रयोजन के लिए रचे गए हैं; वे भंडार में रखे हैं और नियत समय पर बुलाए जाएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐस्प” अथवा “एडर”; हिब्रू शब्द एक विषैले साँप को दर्शाता है, पर उसकी ठीक प्रजाति निश्चित नहीं है। यूनानी समानांतर पाठ में भी वाइपर/साँप के लिए सामान्य शब्द है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “नष्ट करने”; इस क्रिया में अधिक प्रबल अर्थ, “समूल नष्ट करने” या “विनाश के लिए अर्पित करने,” का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “वे भंडार में हैं और नियत समय पर तैनात किए जाएँगे।” अंतिम वाक्यांश हिब्रू में संक्षिप्त है; भाव यह है कि ये शक्तियाँ अपने उपयोग के समय तक सुरक्षित रखी जाती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: जंगली पशुओं के दाँत
  rationale: हिब्रू में शाब्दिक क्रम ‘जंगली पशु का दाँत’ है, पर שן यहाँ सामूहिक अर्थ रखता है। यूनानी बहुवचन भी ‘दाँत’ का समर्थन करता है।
- source_word: עקרב
  choice: बिच्छू
  rationale: सूची में जातिवाचक सामूहिक संज्ञा के रूप में स्वाभाविक आधुनिक हिन्दी।
- source_word: פתן
  choice: विषैले साँप
  rationale: सटीक सर्प-प्रजाति अनिश्चित है। यह चयन विषधर होने का भाव स्पष्ट रखता है और किसी संकीर्ण आधुनिक प्रजाति-नाम का दावा नहीं करता।
- source_word: חרב נקמות
  choice: बदला लेने वाली तलवार
  rationale: यह हिब्रू के सक्रिय प्रतिशोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी का कृदन्त भी सक्रिय अर्थ का समर्थन करता है।
- source_word: להחרים
  choice: विनाश करने के लिए
  rationale: क्रिया का मूल भाव नष्ट करना है; इसमें ‘समूल नष्ट करना’ अथवा ‘विनाश के लिए अर्पित करना’ जैसा अधिक प्रबल अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רשעים
  choice: दुष्टों
  rationale: नैतिक रूप से दोषी लोगों के लिए मानक और सहज हिन्दी समतुल्य।
- source_word: לצורכם
  choice: अपने-अपने प्रयोजन के लिए
  rationale: वाक्यांश इन विनाशकारी साधनों के निर्धारित कार्य या आवश्यकता की ओर संकेत करता है। ‘अपने-अपने’ सूची की प्रत्येक वस्तु से संबंध स्पष्ट करता है, बिना प्रयोजन को अधिक विशिष्ट बनाए।
- source_word: נבראו
  choice: रचे गए हैं
  rationale: हिब्रू के सृष्टि-संबंधी निष्क्रिय भाव को स्पष्ट रखता है और इन हानिकारक शक्तियों के सृजित व्यवस्था में होने के कथन को नरम नहीं करता।
- source_word: באוצר
  choice: भंडार में रखे हैं
  rationale: אוצר के ठोस ‘भंडार/भंडारगृह’ रूपक को बनाए रखता है।
- source_word: ולעת יפקדו
  choice: और नियत समय पर बुलाए जाएँगे
  rationale: פקד यहाँ कार्य के लिए बुलाए, तैनात या उपस्थित किए जाने का भाव देता है। भविष्यकाल हिब्रू रूप के अनुरूप है।
theological_decisions:
- issue: हानिकारक जीवों और विनाशकारी तलवार का सृजन तथा नियत समय पर उपयोग
  choice: पाठ के स्पष्ट दावे को रखा गया है कि ये सब रचे गए हैं, भंडार में रखे हैं और नियत समय पर बुलाए जाएँगे।
  alternative: भाषा को केवल प्राकृतिक अवलोकन बनाना, या ‘रचे गए’ को नरम करके ‘अस्तित्व में आए’ कहना।
  rationale: हिब्रू विनाशकारी साधनों को सृजन, प्रयोजन और भावी तैनाती से जोड़ता है। अनुवाद इस धार्मिक तनाव को न तो कम करता है, न उसकी व्याख्या करके उसे सुलझाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और पाठयोग्य रूप अपनाया गया है। ‘बदला लेने वाली तलवार’ सक्रिय अर्थ को बनाए रखती है; ‘प्रतिशोध की तलवार’ अधिक औपचारिक विकल्प होता। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
