  text: So also his wrath will dispossess nations, and he will turn their drink into brine.
translation:
  language: hi
  text: इसी प्रकार उसका कोप राष्ट्रों को बेदखल कर देगा[a], और वह उनके पेय को खारे पानी में बदल देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “उसका कोप राष्ट्रों को विरासत में लेगा।” इब्रानी को यहाँ न्याय के प्रसंग में “राष्ट्रों को बेदखल कर देगा” समझा गया है।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में “जल” है; इब्रानी शब्द का अर्थ अधिक व्यापक रूप से “पेय” या “पीने की वस्तु” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: इसी प्रकार
  rationale: यह पिछले संदर्भ के अनुरूप समान या परिणामी कार्य का संकेत देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: זעמו
  choice: उसका कोप
  rationale: यहाँ संज्ञा प्रबल दैवी क्रोध और न्याय को व्यक्त करती है; ‘कोप’ गरिमापूर्ण होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
- source_word: גוים
  choice: राष्ट्रों
  rationale: न्याय के इस प्रसंग में यह גוים का सीधा और तटस्थ अनुवाद है; ‘गैर-यहूदी’ जैसी बाद की धार्मिक श्रेणी इसमें नहीं जोड़ी गई।
- source_word: יוריש
  choice: बेदखल कर देगा
  rationale: ירש का हिफ़ील रूप किसी को उसके अधिकार या स्थान से वंचित करने का अर्थ दे सकता है। कोप और न्याय के संदर्भ में यही अर्थ सबसे संगत है, यद्यपि यूनानी पाठ एक भिन्न अर्थ सुरक्षित रखता है।
- source_word: ויהפך
  choice: बदल देगा
  rationale: क्रमिक अपूर्ण क्रिया को भविष्यकालीन न्यायकारी कार्य के रूप में प्रस्तुत किया गया है; हिन्दी में ‘बदल देगा’ स्वाभाविक है।
- source_word: למלח
  choice: खारे पानी में
  rationale: शाब्दिक ‘नमक में’ की अपेक्षा प्रसंग पीने योग्य द्रव के लवणयुक्त और अनुपयोगी हो जाने का है; ‘खारा पानी’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: משקה
  choice: उनके पेय
  rationale: इब्रानी शब्द का अर्थ व्यापक रूप से पेय अथवा पीने की वस्तु है। ‘उनके’ को राष्ट्रों के साथ संबंध स्पष्ट करने के लिए संदर्भानुसार जोड़ा गया है; यूनानी का अधिक विशिष्ट ‘जल’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יוריש को ‘बेदखल करेगा’ समझें या यूनानी के अनुसार ‘विरासत में पाएगा’
  choice: उसका कोप राष्ट्रों को बेदखल कर देगा
  alternative: उसका कोप राष्ट्रों को विरासत में पाएगा
  rationale: उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है। न्याय के समानांतर कथन में ‘बेदखल करना’ अर्थपूर्ण है; फिर भी यूनानी की वास्तविक वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
- issue: משקה को सामान्य ‘पेय’ कहें या विशेष रूप से ‘जल’
  choice: उनके पेय
  alternative: उनके जल
  rationale: इब्रानी शब्द ‘पेय’ के व्यापक अर्थ का समर्थन करता है, जबकि यूनानी में ‘जल’ है। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी विकल्प को पादटिप्पणी में बताता है।
- issue: दूसरे खंड में क्रिया का कर्ता
  choice: व्याकरणिक रूप से ‘उसका कोप’ को दोनों क्रियाओं का कर्ता रहने देना
  alternative: ‘वह उनके पेय को…’ अर्थात परमेश्वर को स्पष्ट कर्ता बनाना
  rationale: इब्रानी में ‘उसका कोप’ के बाद दोनों क्रियाएँ एकवचन पुल्लिंग हैं; हिन्दी वाक्य में उसी कर्ता को जारी रखने से मूल की संरचना और उसकी सजीव अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली रखी गई है। ‘कोप’ न्याय की गंभीरता व्यक्त करता है, जबकि ‘बेदखल’ और ‘खारा पानी’ सामान्य पाठकों के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
