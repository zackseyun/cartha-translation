translation:
  language: hi
  text: राष्ट्र उसकी बुद्धि का बखान करेंगे, और सभा[a] उसकी प्रशंसा का उद्घोष करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मंडली।” यूनानी शब्द ἐκκλησία का अर्थ एकत्र हुआ समुदाय या सभा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσονται
  choice: वर्णन करेंगे
  rationale: यह क्रिया विस्तार से सुनाने या बयान करने का भाव देती है; ‘वर्णन करेंगे’ सार्वजनिक रूप से उसकी बुद्धि का बखान किए जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔθνη
  choice: राष्ट्र
  rationale: यहाँ शब्द व्यापक रूप से राष्ट्रों या जनसमुदायों को सूचित करता है। ‘राष्ट्र’ किसी विशेष यहूदी–गैर-यहूदी विरोध को अनावश्यक रूप से नहीं जोड़ता।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: सिराख में यह नैतिक और बौद्धिक प्रज्ञा का स्थापित अर्थ रखता है; ‘बुद्धि’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐξαγγελεῖ
  choice: घोषणा करेगी
  rationale: क्रिया सार्वजनिक रूप से घोषित करने या प्रकट करने का भाव रखती है; ‘घोषणा करेगी’ दूसरे खंड के सार्वजनिक साक्ष्य को बनाए रखता है।
- source_word: ἐκκλησία
  choice: सभा
  rationale: इस पूर्व-ईसाई यहूदी संदर्भ में इसका अर्थ एकत्र समुदाय या सभा है, न कि विशेष रूप से बाद की ईसाई कलीसिया।
- source_word: ἔπαινον
  choice: प्रशंसा
  rationale: यह शब्द प्रशंसा या सराहना को सूचित करता है और ‘घोषणा करेगी’ के साथ स्वाभाविक बैठता है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: यूनानी एकवचन पुल्लिंग सर्वनाम संदर्भ में वर्णित बुद्धिमान पुरुष की ओर संकेत करता है; हिन्दी का ‘उसकी’ उसी एकवचन संदर्भ को बनाए रखता है।
theological_decisions:
- issue: पूर्व-ईसाई यहूदी ज्ञान-साहित्य में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मण्डली; कलीसिया
  rationale: ‘सभा’ एकत्र समुदाय का अर्थ सुरक्षित रखता है और पाठ में बाद की ईसाई संस्था का काल-विपर्ययात्मक संकेत नहीं लाता।
- issue: αὐτοῦ का लिंग और वचन
  choice: उसकी
  alternative: उनकी
  rationale: यूनानी सर्वनाम एकवचन पुल्लिंग है और प्रसंग के बुद्धिमान पुरुष को दर्शाता है; इसे बहुवचन या लिंग-निरपेक्ष बनाना स्रोत की विशिष्टता घटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों यूनानी खंडों की समानांतर सार्वजनिक घोषणा का भाव बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘wisdom’ के बाद था, पर पादटिप्पणी ἐκκλησία से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘सभा’ के बाद रखा गया है।
