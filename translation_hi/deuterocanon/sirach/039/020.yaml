  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: hi
  text: युगानुयुग वह देखता है,[a] और उसके लिए कोई भी बात इतनी अद्भुत या इतनी शक्तिशाली नहीं कि वह उसकी सामर्थ्य से परे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “एक युग से दूसरे युग तक उसने देखा, और उसके सामने कुछ भी अद्भुत नहीं है”; उसमें इब्रानी के अतिरिक्त शब्द “या इतनी शक्तिशाली” नहीं हैं।
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: युगानुयुग
  rationale: यह इब्रानी मुहावरे के विस्तृत काल-बोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; इसका अर्थ ‘एक युग से दूसरे युग तक’ अथवा ‘अनादि से अनन्त तक’ हो सकता है।
- source_word: יביט
  choice: वह देखता है
  rationale: क्रिया ध्यानपूर्वक देखने या निहारने का भाव रखती है। इब्रानी अपूर्ण रूप को ज्ञान-साहित्य के सामान्य, नित्य कथन के रूप में वर्तमान काल में रखा गया है।
- source_word: נפלא
  choice: अत्यन्त अद्भुत
  rationale: यह असाधारण या सामर्थ्य से परे बात का संकेत देता है। नकारात्मक वाक्य में ‘कुछ भी ... अत्यन्त अद्भुत नहीं’ यह भाव रखता है कि कोई बात उसकी समझ या सामर्थ्य से परे नहीं।
- source_word: חזק
  choice: अत्यन्त शक्तिशाली
  rationale: इब्रानी पाठ में शक्ति का दूसरा विशेषण स्पष्ट है, इसलिए यूनानी समानांतर में अनुपस्थित होने पर भी इसे सुरक्षित रखा गया है।
- source_word: ממנו
  choice: उसके लिए
  rationale: इस वाक्य-संरचना में यह स्वाभाविक हिन्दी है और बताती है कि न कोई अद्भुत बात और न कोई शक्ति उसके सामर्थ्य से परे है; अधिक शाब्दिक ‘उससे’ तुलना का अनचाहा अर्थ दे सकता है।
theological_decisions:
- issue: इब्रानी और यूनानी में कर्ता नाम से व्यक्त नहीं है
  choice: ‘वह’ रखा गया है, जिसका संदर्भ प्रसंग में परमेश्वर है
  alternative: ‘परमेश्वर’ को स्पष्ट रूप से दोहराना
  rationale: मूल क्रिया में कर्ता निहित है और निकटवर्ती प्रसंग उसे परमेश्वर से जोड़ता है। ‘वह’ मूल की संक्षिप्तता बनाए रखता है और अतिरिक्त शब्द नहीं जोड़ता।
- issue: נפלא וחזק के संबंध की व्याख्या
  choice: दोनों विशेषणों को समानांतर रखते हुए ‘न तो ... न ...’
  alternative: इन्हें मिलाकर ‘कोई भी अद्भुत या कठिन काम उसके लिए असम्भव नहीं’
  rationale: समानांतर अनुवाद इब्रानी के दो अलग पदों—अद्भुत और शक्तिशाली—को सुरक्षित रखता है और ‘असम्भव’ जैसी व्याख्यात्मक संज्ञा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘युगानुयुग’ शास्त्रीय ऊँचाई बनाए रखते हुए प्रचलित है। ‘अत्यन्त’ दोनों विशेषणों के साथ निहित ‘उसके लिए सीमा से परे’ का भाव व्यक्त करता है।
