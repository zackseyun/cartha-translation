  text: All these things are for good to the good[a]; so also for the wicked they are turned to harm.
translation:
  language: hi
  text: ये सभी चीज़ें भले लोगों का भला करती हैं[a]; उसी प्रकार दुष्टों के लिए वे हानि में बदल जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में “धर्मपरायण लोगों के लिए” है; इब्रानी में “भले लोगों के लिए” है।
    reason: alternative_reading
lexical_decisions:
- source_word: כל אלה
  choice: ये सभी चीज़ें
  rationale: इब्रानी संकेतवाचक पदबंध की व्यापकता और निकट संदर्भ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לטובים ייטיבו
  choice: भले लोगों का भला करती हैं
  rationale: טובים को व्यक्तियों के लिए ‘भले लोग’ और ייטיבו को लाभकारी परिणाम बताने वाले ‘भला करती हैं’ के रूप में प्रस्तुत करता है; इससे इब्रानी का शब्द-संबंध भी सुनाई देता है।
- source_word: כן
  choice: उसी प्रकार
  rationale: दोनों अर्ध-पंक्तियों के अनुरूप विरोधात्मक समानांतर को स्पष्ट करता है।
- source_word: לרעים
  choice: दुष्टों के लिए
  rationale: इब्रानी רעים का नैतिक अर्थ बनाए रखता है; यूनानी ‘पापियों’ से अधिक विशिष्ट अर्थ मुख्य पाठ में नहीं लाता।
- source_word: לרעה נהפכו
  choice: वे हानि में बदल जाती हैं
  rationale: רעה को संदर्भानुसार हानिकारक परिणाम और נהפכו को परिवर्तन के रूप में व्यक्त करता है, बिना यह तय किए कि परिवर्तन किसके द्वारा किया जाता है।
theological_decisions:
- issue: पहली अर्ध-पंक्ति में लाभ पाने वालों का नैतिक-धार्मिक वर्णन
  choice: भले लोग
  alternative: भक्त जन / धर्मपरायण लोग
  rationale: उपलब्ध इब्रानी में טובים, ‘भले लोग’, है; यूनानी समानांतर εὐσεβέσιν, ‘भक्त/धर्मपरायण’, पढ़ता है। मूल इब्रानी को मुख्य पाठ में प्राथमिकता दी गई है और यूनानी भिन्नता पादटिप्पणी में रखी गई है।
- issue: दूसरी अर्ध-पंक्ति में प्रतिकूल परिणाम
  choice: हानि में बदल जाती हैं
  alternative: बुराई बन जाती हैं / विपत्ति में बदल जाती हैं
  rationale: רעה में बुराई, विपत्ति या हानि की अर्थ-सीमा है। यहाँ उन्हीं चीज़ों के अलग परिणाम की बात होने के कारण ‘हानि’ स्वाभाविक है, जबकि ‘बदल जाती हैं’ इब्रानी क्रिया की तनावपूर्ण परिवर्तन-छवि बचाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘भला करती हैं’ में इब्रानी טובים/ייטיבו का शब्दगत प्रतिध्वनि स्वाभाविक ढंग से सुरक्षित है; मुख्य पाठ इब्रानी को प्राथमिकता देता है और यूनानी का अधिक धार्मिक रूप पादटिप्पणी में दर्ज है।
