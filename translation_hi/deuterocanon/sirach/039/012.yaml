- source_word: ἐκλογήσομαι
  choice: मैं अपने लिए चुनूँगा
  rationale: Future middle रूप जान-बूझकर स्वयं चयन करने का भाव रखता है। यद्यपि संदर्भ में चुनी हुई बातें प्रस्तुत करने का आशय संभव है, यूनानी क्रिया में ‘शिक्षा देना’ प्रत्यक्ष रूप से नहीं है।
- source_word: διχομηνία
  choice: पूर्णिमा का चाँद
  rationale: शब्द का शाब्दिक संबंध महीने के मध्य से है और यहाँ पूर्ण चन्द्रमा की छवि द्वारा परिपूर्णता व्यक्त होती है।
- source_word: ἐπληρώθην
  choice: मैं भर गया
  rationale: Aorist passive ‘भर दिया गया/भर गया’ का अर्थ देता है; ‘भर गया’ हिन्दी में स्वाभाविक रहते हुए प्राप्त परिपूर्णता का भाव सुरक्षित रखता है।
