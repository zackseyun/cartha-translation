base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/017.yaml
  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: hi
  text: उसके वचन से जल ढेर की तरह खड़ा हो जाता है, और उसके मुख की उक्ति से जल के भंडार स्थापित हो जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ यहाँ संक्षेप में कहता है, “और उसके मुख की उक्ति पर उसका भंडार”; यूनानी साक्षी में “जल के भंडार” है, जिसे अर्थ स्पष्ट करने के लिए यहाँ अपनाया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: उसके वचन पर
  rationale: उपसर्ग ב साधन (‘उसके वचन से’) या अवसर (‘उसके वचन पर’) दोनों का बोध करा सकता है। ‘उसके वचन पर’ संक्षिप्त काव्यात्मक अभिव्यक्ति रखते हुए आज्ञा मिलते ही होने वाली क्रिया और वचन की सामर्थ्य—दोनों को स्थान देता है।
- source_word: יעריך
  choice: इकट्ठा हो जाता है
  rationale: ערך का मूल अर्थ व्यवस्थित करना या क्रम में लगाना है। जल और ‘ढेर’ की उपमा के संदर्भ में इसका दृश्य परिणाम जल का एकत्र होकर ढेर-सा खड़ा होना है। हिन्दी में ‘इकट्ठा हो जाता है’ इसी चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כנד מים
  choice: जल ढेर के समान
  rationale: נד यहाँ एकत्र किए हुए ढेर या राशि को दर्शाता है, विशेषकर उस जल को जो मानो खड़ा कर दिया गया हो। यूनानी समानांतर भी ‘जल का ढेर’ वाले चित्र का समर्थन करता है।
- source_word: ובמוצא פיו
  choice: और उसके मुख से निकले वचन पर
  rationale: מוצא का शाब्दिक भाव ‘निकलना’ है और यहाँ मुख से निकली उक्ति का संकेत है। यह अनुवाद हिब्रू की ठोस भाषा और पहले चरण के साथ उसकी समानांतरता बनाए रखता है।
- source_word: אוצרו
  choice: जल के भंडार
  rationale: प्राप्त हिब्रू पाठ संक्षेप में ‘उसका भंडार’ कहता है, जबकि यूनानी साक्षी स्पष्ट रूप से ‘जल के भंडार’ पढ़ता है। संदर्भ की स्पष्टता के लिए यूनानी पाठ की बहुवचन अभिव्यक्ति मुख्य पाठ में ली गई है और पाठांतर को पादटिप्पणी में बताया गया है।
- source_word: ἔστη … καὶ … ἀποδοχεῖα ὑδάτων
  choice: इकट्ठा हो जाता है … और … भंडार भी खड़े हो जाते हैं
  rationale: यूनानी में दूसरे चरण का क्रियापद पहले चरण से समझा जाता है। हिन्दी में ‘भी खड़े हो जाते हैं’ जोड़कर उसी काव्यात्मक लोप को स्पष्ट और स्वाभाविक बनाया गया है; इसे नए स्वतंत्र विचार के रूप में नहीं जोड़ा गया।
theological_decisions:
- issue: ‘उसके वचन’, ‘उसके मुख’ और भंडार से जुड़े सर्वनाम का संदर्भ
  choice: निहित संदर्भ परमेश्वर है, पर पद में ‘परमेश्वर’ नाम जोड़कर स्पष्ट नहीं किया गया।
  alternative: पद को अपने आप में सृष्टि का अनिर्दिष्ट वर्णन मानना।
  rationale: सिराख 39 के निकटवर्ती सृष्टिकर्ता-विषयक स्तुतिगान में ये सर्वनाम स्वाभाविक रूप से परमेश्वर की ओर संकेत करते हैं। सर्वनामों को यथावत रखने से संदर्भगत अर्थ बना रहता है और मूल से अतिरिक्त धर्मवैचारिक स्पष्टता नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप रखा गया है। ‘वचन’, ‘मुख’ और ‘भंडार’ मूल की समानांतर संरचना और सृष्टि-वर्णन की ऊँची शैली को बनाए रखते हैं; कठिन शाब्दिकता से बचने के लिए ערך को प्रसंगानुसार ‘इकट्ठा हो जाता है’ कहा गया है।
