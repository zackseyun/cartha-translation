  yaml_path: translation/deuterocanon/sirach/039/016.yaml
  text: All the works of God are good[a], and for every need he provides in its time.
translation:
  language: hi
  text: परमेश्वर के सभी कार्य अच्छे हैं[a], और वह हर आवश्यकता के लिए सही समय पर पर्याप्त व्यवस्था करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “प्रभु के सभी कार्य बहुत अच्छे हैं, और हर आदेश अपने समय पर पूरा होगा।” इब्रानी साक्ष्य में इसके बजाय “परमेश्वर के कार्य” और हर आवश्यकता के लिए पर्याप्त व्यवस्था की बात है। मुख्य पाठ उपलब्ध इब्रानी का अनुसरण करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: परमेश्वर के कार्य
  rationale: מעשי का अर्थ परमेश्वर के किए हुए काम या उसकी रचनाएँ व्यापक रूप से हो सकता है। 'कार्य' इस व्यापकता और संक्षिप्तता को बनाए रखता है; אל का सीधा अनुवाद 'परमेश्वर' है।
- source_word: כלם טובים
  choice: सभी ... अच्छे हैं
  rationale: כלם पूर्ण समग्रता पर बल देता है, और טובים का सीधा, व्यापक मूल्यांकन 'अच्छे' है। इब्रानी में यूनानी σφόδρα ('बहुत') के अनुरूप कोई शब्द नहीं है।
- source_word: לכל צורך
  choice: हर आवश्यकता के लिए
  rationale: צורך यहाँ आवश्यकता या ज़रूरत को दर्शाता है। 'हर आवश्यकता के लिए' वर्तमान मानक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: בעתו
  choice: उसके समय पर
  rationale: प्रत्यय को खुला रखते हुए यह वाक्यांश प्रत्येक आवश्यकता से जुड़े उपयुक्त समय की ओर संकेत करता है और इब्रानी की संक्षिप्तता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: יספיק
  choice: वह ... पर्याप्त देता है
  rationale: ספק का हिफ़ील रूप पर्याप्त मात्रा में उपलब्ध कराने का भाव रखता है। एकवचन क्रिया का अंतर्निहित कर्ता प्रसंगानुसार परमेश्वर है; 'पर्याप्त देता है' आपूर्ति और पर्याप्तता दोनों को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि
  choice: परमेश्वर
  alternative: प्रभु
  rationale: इब्रानी पाठ में אל है, इसलिए मुख्य पाठ 'परमेश्वर' रखता है। यूनानी समानांतर में Κυρίου ('प्रभु') है, पर उपलब्ध इब्रानी साक्ष्य को प्राथमिकता दी गई है।
- issue: दूसरे खंड में कर्ता
  choice: अंतर्निहित कर्ता परमेश्वर को 'वह' से व्यक्त किया गया
  alternative: 'निर्वैयक्तिक रूप: ''पर्याप्त होता है'''
  rationale: יספיק एकवचन क्रिया है और प्रसंग परमेश्वर के कार्यों का है। हिन्दी में 'वह' जोड़ना अर्थ को स्वाभाविक बनाता है, यद्यपि इब्रानी में कर्ता स्पष्ट संज्ञा के रूप में नहीं दोहराया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संक्षिप्त रूप अपनाया गया है। 'कार्य' व्यापक अर्थ रखता है, जबकि 'पर्याप्त देता है' יספיק में निहित आपूर्ति और पर्याप्तता दोनों को सामने लाता है।
