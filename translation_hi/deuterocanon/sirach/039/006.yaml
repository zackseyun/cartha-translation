  yaml_path: translation/deuterocanon/sirach/039/006.yaml
  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: hi
  text: यदि महान प्रभु चाहे, तो वह समझ की आत्मा से भर जाएगा; वह स्वयं ज्ञान की बातें वर्षा की तरह बरसाएगा[a], और प्रार्थना में प्रभु को धन्यवाद देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्ञान की बातें बरसाएगा।” यूनानी क्रिया में वर्षा की छवि है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रभु के सामने अंगीकार करेगा” अथवा “प्रभु का अंगीकार करेगा।” यूनानी क्रिया के ये अर्थ भी हो सकते हैं, यद्यपि यहाँ प्रार्थना का संदर्भ “धन्यवाद देगा” के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν Κύριος ὁ μέγας θελήσῃ
  choice: यदि महान प्रभु चाहे
  rationale: ἐὰν के साथ संभावनार्थक क्रिया एक वास्तविक शर्त व्यक्त करती है। ‘चाहे’ θελήσῃ की इच्छासूचक शक्ति को स्वाभाविक आधुनिक हिन्दी में रखता है; Κύριος ὁ μέγας का सीधा और गरिमापूर्ण रूप ‘महान प्रभु’ है।
- source_word: πνεύματι συνέσεως ἐμπλησθήσεται
  choice: वह समझ की आत्मा से भर जाएगा
  rationale: भविष्यत् कर्मवाच्य ‘भर जाएगा’ से सुरक्षित रहता है। συνέσεως के लिए ‘समझ’ साधारण पाठक के लिए स्पष्ट है, और πνεύματι की गुणात्मक अनिश्चितता को ‘समझ की आत्मा’ बनाए रखता है।
- source_word: ἀνομβρήσει ῥήματα σοφίας αὐτός
  choice: वह स्वयं ज्ञान की बातें वर्षा के समान बरसाएगा
  rationale: दुर्लभ क्रिया ἀνομβρήσει की वर्षा-वाली सजीव छवि को रखा गया है। ‘ज्ञान की बातें’ ῥήματα σοφίας का स्वाभाविक हिन्दी रूप है, और ‘स्वयं’ αὐτός के बलाघात को व्यक्त करता है।
- source_word: ἐν προσευχῇ
  choice: प्रार्थना में
  rationale: यह ἐν के स्थान/क्षेत्र अथवा रीति-संबंधी अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξομολογήσεται Κυρίῳ
  choice: प्रभु को धन्यवाद देगा
  rationale: प्रार्थना के संदर्भ में ἐξομολογέομαι का धन्यवाद या स्तुति का अर्थ सबसे स्वाभाविक है; फिर भी इसके ‘अंगीकार करना/स्वीकार करना’ अर्थ को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: प्रार्थना में ἐξομολογήσεται का आशय
  choice: प्रभु को धन्यवाद देना
  alternative: प्रभु के सामने अंगीकार करना अथवा प्रभु को स्वीकार करना
  rationale: निकट संदर्भ ज्ञान के उमड़ने और प्रार्थना का है, इसलिए धन्यवाद का अर्थ उपयुक्त है। फिर भी यूनानी क्रिया बहुअर्थी है; अतः पश्चात्ताप या पाप-अंगीकार को मुख्य पाठ में आयात किए बिना वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वर्षा की मूल रूपक-छवि तथा ἐξομολογήσεται की वास्तविक अर्थगत बहुलता सुरक्षित रखी गई है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी मुख्य पाठ में [a] वर्षा-रूपक के बाद और [b] ‘धन्यवाद देगा’ के बाद सही स्थान पर रखे गए हैं।
