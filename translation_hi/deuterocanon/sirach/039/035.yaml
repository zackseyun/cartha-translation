  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: hi
  text: अब पूरे मन से आनन्द का गीत गाओ और पवित्र परमेश्वर[a] के नाम को धन्य कहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ में है: “प्रभु के नाम को धन्य कहो।” इब्रानी साक्ष्य में “पवित्र [जन]” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  choice: अब
  rationale: यह समय और प्रवचन के मोड़ को दिखाने वाला शब्द है; प्राथमिक इब्रानी पाठ में संयोजक नहीं है, इसलिए केवल ‘अब’ रखा गया है।
- source_word: בכל לב
  choice: पूरे मन से
  rationale: यह सम्पूर्ण हृदय से किए गए कार्य का स्वाभाविक हिन्दी मुहावरा है; ‘मन’ सामान्य आधुनिक हिन्दी में भीतरी समर्पण को सहजता से व्यक्त करता है।
- source_word: הרנינו
  choice: आनन्द का गीत गाओ
  rationale: רנן का आदेशात्मक रूप मुखर और उल्लासपूर्ण स्तुति का भाव रखता है; यह अनुवाद आनन्द और गायन, दोनों को व्यक्त करता है।
- source_word: וברכו
  choice: और … को धन्य कहो
  rationale: ईश्वर के नाम के सम्बन्ध में ברך की पारम्परिक आशीर्वादात्मक भाषा को बनाए रखता है और इसे केवल सामान्य ‘स्तुति करो’ में विलीन नहीं करता।
- source_word: את שם
  choice: नाम को
  rationale: इब्रानी के प्रत्यक्ष कर्म ‘नाम’ को स्पष्ट रखता है; यहाँ नाम ईश्वर के व्यक्तित्व और प्रतिष्ठा का श्रद्धापूर्ण संकेत है।
- source_word: הקדוש
  choice: पवित्र जन
  rationale: प्राथमिक इब्रानी साक्ष्य के संज्ञात्मक विशेषण ‘पवित्र [जन]’ को दर्शाता है और यूनानी पाठ के ‘प्रभु’ को मुख्य पाठ में नहीं मिलाता।
theological_decisions:
- issue: 'अन्तिम उपवाक्य में ईश्वरीय उपाधि: इब्रानी הקדוש बनाम यूनानी Κυρίου'
  choice: पवित्र जन
  alternative: प्रभु
  rationale: उपलब्ध इब्रानी पाठ प्राथमिक है और उसमें ‘पवित्र [जन]’ है। यूनानी समानान्तर में ‘प्रभु’ है; इस महत्त्वपूर्ण उपाधि-भेद को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के योग्य रखी गई है। बहुवचन आज्ञाओं को हिन्दी में सामान्य बहुवचन ‘गाओ/कहो’ से व्यक्त किया गया है। ‘पवित्र जन’ थोड़ी असामान्य किंतु समझने योग्य पदवी है, जो इब्रानी की वास्तविक शब्दावली को सुरक्षित रखती है।
