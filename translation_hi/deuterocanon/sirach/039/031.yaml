  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: hi
  text: उसकी आज्ञा पर वे आनन्दित होते हैं[b], और अपने नियत क्रम में उसके वचन[a] के विरुद्ध विद्रोह नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘उसके मुँह’ है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ इस पंक्ति को विस्तार देता है: ‘वे पृथ्वी पर आवश्यकताओं के लिए तैयार किए जाएँगे, और अपने समयों में किसी वचन का उल्लंघन नहीं करेंगे।’ इससे सृष्ट वस्तुओं के अपने नियत क्रम में कार्य करने का भाव पुष्ट होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: उसकी आज्ञा पर
  rationale: ב के साथ צוה का infinitive construct यहाँ समय-परिस्थिति का भाव देता है। यूनानी ἐν τῇ ἐντολῇ αὐτοῦ भी उसकी आज्ञा के संबंध में यही अर्थ समर्थित करता है।
- source_word: ישישו
  choice: वे आनन्दित होते हैं
  rationale: שושׂ/שישׂ हर्षित या उल्लसित होने को व्यक्त करता है। संदर्भ में सृष्ट वस्तुओं को मानवीय रूप देकर उनकी आज्ञाकारिता दिखाई गई है।
- source_word: ובחקם
  choice: अपने ठहराए हुए विधान के अनुसार
  rationale: חק का अर्थ निश्चित विधान, निर्धारित सीमा या ठहराई हुई व्यवस्था हो सकता है। यह अनुवाद उस नियत व्यवस्था को व्यक्त करता है जिसमें सृष्ट वस्तुएँ अपना कार्य करती हैं, और शब्द की विधि-संबंधी छाया भी बनाए रखता है।
- source_word: לא ימרו פיו
  choice: उसके वचन से विद्रोह नहीं करते
  rationale: מרה विद्रोह या अवज्ञा करना है। פיו का शाब्दिक अर्थ ‘उसका मुँह’ है, पर यहाँ उससे निकला हुआ कथन अभिप्रेत है; इसलिए ‘उसका वचन’ स्वाभाविक हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के बोलने के लिए मानवरूपी भाषा
  choice: उसके वचन
  alternative: उसके मुँह
  rationale: इब्रानी में शाब्दिक रूप से ‘उसका मुँह’ है, पर आशय उसके बोले हुए वचन से है। मुख्य पाठ में ‘वचन’ पठनीयता रखता है, जबकि पादटिप्पणी स्रोत की मानवरूपी अभिव्यक्ति दर्ज करती है।
- issue: सृष्ट वस्तुओं की नियत व्यवस्था
  choice: अपने ठहराए हुए विधान के अनुसार
  alternative: अपने नियत क्रम में
  rationale: חק में ‘विधान’ और ‘निश्चित व्यवस्था’ दोनों भाव संभव हैं। चुना हुआ रूप किसी विशिष्ट धर्मशास्त्रीय तंत्र को आरोपित किए बिना इस अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप। ‘आनन्दित’, ‘विधान’ और ‘विद्रोह’ स्रोत की काव्यात्मक तथा व्यक्तिकरण वाली शैली को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
