base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/015.yaml
  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: hi
  text: वीणा[a] और तरह-तरह के वाद्यों के संगीत के साथ, तुम इस प्रकार हर्षध्वनि के साथ कहो।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वीणा” के स्थान पर “प्राचीन तंत्री वाद्य” भी समझा जा सकता है; हिब्रू में जिस वाद्य का नाम है, उसका ठीक आधुनिक समकक्ष निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “हर्षध्वनि/ऊँची पुकार के साथ”; हिब्रू शब्द हर्षध्वनि, जयघोष और कुछ प्रसंगों में तुरही-जैसी ध्वनि भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी समानांतर पाठ इससे काफी विस्तृत है: उसमें सब कामों के लिए प्रभु को धन्य कहने, उसके नाम की महिमा करने और उसकी स्तुति करने का स्पष्ट आह्वान है। उपलब्ध हिब्रू साक्ष्य यहाँ केवल वाद्य-संगीत और हर्षध्वनि से जुड़ा अंश सुरक्षित रखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: संगीत के साथ
  rationale: इस संगीतमय प्रसंग में यह शब्द सेवा, गायन अथवा संगीत-प्रस्तुति का भाव दे सकता है। सहज हिन्दी में “संगीत के साथ” वाद्य-संगति का अर्थ स्पष्ट करता है, पर इसे केवल मौखिक गीत तक सीमित नहीं करता।
- source_word: נבל
  choice: वीणा
  rationale: यह प्राचीन तंत्री वाद्य का नाम है। उसका ठीक आधुनिक समकक्ष अनिश्चित है; “वीणा” हिन्दी पाठकों के लिए सुबोध और गरिमापूर्ण सामान्य नाम है।
- source_word: כלי מינים
  choice: तरह-तरह के वाद्य
  rationale: शाब्दिक भाव “भिन्न-भिन्न प्रकार के उपकरण/वाद्य” है। संगीत के संदर्भ में यह स्वाभाविक हिन्दी रूप मूल की विविधता को बनाए रखता है।
- source_word: וכן
  choice: इस प्रकार
  rationale: 'यह आगे कही जाने वाली बात की रीति बताता है: “और इस प्रकार/ऐसे।”'
- source_word: תאמרו
  choice: तुम ... कहो
  rationale: हिब्रू क्रिया बहुवचन है और प्रसंग में आह्वान के रूप में स्वाभाविक रूप से आज्ञार्थक “कहो” बनती है।
- source_word: בתרועה
  choice: जयघोष करते हुए
  rationale: תרועה ऊँची हर्षध्वनि, सामूहिक जयघोष अथवा कभी तुरही-जैसी ध्वनि को सूचित कर सकता है। स्तुति के संगीतमय संदर्भ में “जयघोष” उपयुक्त है, जबकि संभावित व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: हिब्रू साक्ष्य और अधिक विस्तृत यूनानी समानांतर के बीच बड़ा पाठांतर
  choice: संरक्षित हिब्रू पंक्ति का ही अनुवाद करना और यूनानी के अतिरिक्त उपवाक्यों को मुख्य पाठ में न जोड़ना
  alternative: यूनानी के अनुसार प्रभु को धन्य कहने और उसके नाम की महिमा करने का विस्तृत आह्वान जोड़ना
  rationale: बेन सीरा का उपलब्ध हिब्रू पाठ प्राथमिक साक्ष्य है। यूनानी समानांतर स्तुति का संदर्भ पुष्ट करता है, पर उसके अतिरिक्त शब्द हिब्रू पंक्ति में नहीं हैं; उन्हें जोड़ने से वास्तविक पाठांतर छिप जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, सामूहिक उपासना के अनुकूल और गरिमापूर्ण शैली रखी गई है। “संगीत के साथ” कृत्रिम “सेवा के साथ” की अपेक्षा प्रसंगानुकूल है; “जयघोष” में स्तुतिपरक संदर्भ झलकता है, पर पादटिप्पणी मूल शब्द की व्यापकता बनाए रखती है।
