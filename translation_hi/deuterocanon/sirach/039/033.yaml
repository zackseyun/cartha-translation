  text: The works of God are all good[a], and for every need he provides in its time.
translation:
  language: hi
  text: परमेश्वर के सभी कार्य अच्छे हैं[a], और वह हर आवश्यकता को उसके समय पर पूरा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “प्रभु के सभी कार्य अच्छे हैं।” यहाँ हिब्रू पाठ में “प्रभु” के बजाय “परमेश्वर” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה אל
  choice: परमेश्वर के कार्य
  rationale: מעשה यहाँ כלם के साथ सामूहिक अर्थ में परमेश्वर के कार्यों को दर्शाता है। אל का सीधा अर्थ यहाँ ‘परमेश्वर’ है; यूनानी समानांतर के ‘प्रभु’ को मुख्य पाठ में नहीं अपनाया गया।
- source_word: טובים
  choice: अच्छे
  rationale: यह טובים का सीधा और व्यापक हिन्दी समतुल्य है तथा कथन को केवल ‘लाभदायक’ अर्थ तक सीमित नहीं करता।
- source_word: לכל צורך
  choice: हर आवश्यकता के लिए
  rationale: צורך का सामान्य अर्थ आवश्यकता या ज़रूरत है; यह यूनानी χρείαν से भी पुष्ट होता है।
- source_word: בעתו
  choice: उसके समय पर
  rationale: सर्वनामिक प्रत्यय का संबंध सबसे स्वाभाविक रूप से अभी उल्लिखित प्रत्येक आवश्यकता या अवसर से है। यह अनुवाद उस संबंध को खुला रखता है और ‘ठीक समय पर’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: יספיק
  choice: प्रबंध करता है
  rationale: हिब्रू क्रिया पर्याप्त करने या पर्याप्त रूप से उपलब्ध कराने का भाव रखती है। यहाँ अपूर्ण रूप को सामान्य वर्तमान कथन समझना प्रसंगानुकूल है; परमेश्वर निहित कर्ता है।
theological_decisions:
- issue: पहले खंड में ईश्वरीय उपाधि
  choice: मुख्य पाठ में ‘परमेश्वर’
  alternative: ‘प्रभु’
  rationale: उपलब्ध प्राथमिक हिब्रू पाठ में אל है, जबकि यूनानी समानांतर में Κυρίου है। इसलिए मुख्य पाठ हिब्रू का अनुसरण करता है और यूनानी पाठांतर पादटिप्पणी में सुरक्षित रखा गया है।
- issue: יספיק का काल और कर्ता
  choice: सामान्य वर्तमान में परमेश्वर को निहित कर्ता मानकर ‘वह ... प्रबंध करता है’
  alternative: ‘वह ... प्रबंध करेगा’ या ‘वह पर्याप्त होगा’
  rationale: हिब्रू अपूर्ण रूप सामान्य या बारंबार सत्य व्यक्त कर सकता है। समानांतर यूनानी χορηγήσει सक्रिय रूप से उपलब्ध कराने का समर्थन करता है, जबकि कर्ता को परमेश्वर समझना पिछले खंड से स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘कार्य’, ‘आवश्यकता’ और ‘प्रबंध करता है’ औपचारिकता तथा स्वाभाविकता के बीच संतुलन रखते हैं।
