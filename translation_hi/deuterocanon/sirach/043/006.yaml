  yaml_path: translation/deuterocanon/sirach/043/006.yaml
  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
translation:
  language: hi
  text: चन्द्रमा भी बार-बार लौटने वाले समयों को चिह्नित करता है[a][c]; वह अंत का शासक[b] और सदा रहने वाला चिन्ह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “चन्द्रमा सब बातों के लिए अपने नियत समय पर है—समयों का प्रकाशन और सदा का चिन्ह।” इसके विपरीत इब्रानी में “बार-बार लौटने वाले समय” और “अंत का शासक” है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “अंत का शासक” बहुत संक्षिप्त अभिव्यक्ति है। इसका संकेत महीने की समाप्ति या किसी निश्चित सीमा पर चन्द्रमा के शासन की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'मसादा में इस पद का पाठ यहाँ प्रस्तुत काहिरा गनीज़ा के इब्रानी पाठ से अलग है। मसादा के बचे हुए अंश में है: “क्योंकि महान प्रभु ने उसे बनाया।”'
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: भी
  rationale: यह चन्द्रमा को पहले वर्णित आकाशीय ज्योतियों की शृंखला में जोड़ता है और इब्रानी के योगसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ירח
  choice: चन्द्रमा
  rationale: यह शब्द स्पष्ट रूप से चन्द्रमा को दर्शाता है; ‘चन्द्रमा’ आधुनिक मानक हिन्दी में गरिमापूर्ण और सर्वबोध्य है।
- source_word: עתות שבות
  choice: बार-बार लौटने वाले समयों
  rationale: עתות का अर्थ समय या ऋतुएँ और שבות का भाव लौटने अथवा पुनरावृत्ति का है। यह अनुवाद चन्द्रमा की कालगणनात्मक भूमिका रखते हुए केवल ऋतुओं तक अर्थ को सीमित नहीं करता।
- source_word: ממשלת
  choice: शासक
  rationale: यह संज्ञा शासन या प्रभुत्व का भाव व्यक्त करती है। ‘शासक’ आकाशीय पिंड के काव्यात्मक मानवीकरण को बनाए रखता है।
- source_word: קץ
  choice: अंत
  rationale: इब्रानी शब्द का सीधा अर्थ अंत, सीमा या पूर्णता हो सकता है। ‘अंत’ मूल की संक्षिप्तता और संदर्भगत अस्पष्टता को सुरक्षित रखता है।
- source_word: ואות עולם
  choice: और सदा बना रहने वाला चिन्ह
  rationale: אות का अर्थ ‘चिन्ह’ है और עולם यहाँ स्थायी अथवा अनंत अवधि का बोध देता है। यह हिन्दी में सहज रहते हुए इब्रानी अर्थ को निकटता से व्यक्त करता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ के छोटे अंतर में प्राथमिकता
  choice: मुख्य पाठ में उपलब्ध इब्रानी को प्राथमिक मानना और कालगणनात्मक अर्थ की पुष्टि के लिए यूनानी समानांतर पाठ से परामर्श लेना
  alternative: 'यूनानी के अधिक निकट अनुवाद करना: ‘चन्द्रमा हर बात में अपने नियत समय के लिए है—समयों का प्रकाशन और युग का चिन्ह।’'
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, वहाँ वही प्राथमिक स्रोत है। यूनानी पाठ समयों के प्रकाशन पर बल देता है, जबकि इब्रानी लौटने वाले समयों और ‘अंत के शासक’ की बात करता है; इसलिए मुख्य अनुवाद इब्रानी की विशिष्ट और कुछ हद तक अस्पष्ट अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘बार-बार लौटने वाले समय’ व्यापक कालगणनात्मक अर्थ बनाए रखता है, और ‘अंत का शासक’ की मूल अस्पष्टता को व्याख्यात्मक विस्तार से नहीं मिटाया गया।
