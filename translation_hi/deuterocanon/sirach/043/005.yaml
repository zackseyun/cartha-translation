base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/005.yaml
  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: hi
  text: क्योंकि महान है प्रभु, जिसने उसे बनाया[a]; और अपने वचन से वह उसकी गति तेज़ करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मसादा की हिब्रू प्रति में केवल पहला चरण सुरक्षित है—‘क्योंकि महान है प्रभु, जिसने उसे बनाया।’ काहिरा गनीज़ा का अगला चरण कठिन है; यूनानी समानांतर उसके अर्थ का समर्थन इस प्रकार करता है: ‘अपने वचन से वह उसकी गति तेज़ करता है।’ दूसरा सम्भव, अधिक अक्षरशः पाठ है: ‘अपने वचनों से उसका बलवान प्रबल होता है।’'
    reason: textual_variant
lexical_decisions:
- source_word: גדול
  choice: महान
  rationale: यह प्रभु के लिए विधेय विशेषण है; ‘महान’ स्तुतिपरक संदर्भ में सीधा, स्वाभाविक और गरिमापूर्ण है।
- source_word: ה׳
  choice: प्रभु
  rationale: यह परमेश्वर के नाम का श्रद्धासूचक संक्षेप है; हिन्दी में ‘प्रभु’ स्वाभाविक धार्मिक संबोधन है।
- source_word: עושהו
  choice: जिसने उसे बनाया
  rationale: प्रत्यय का संदर्भ प्रसंग में वर्णित आकाशीय पिंड से है; सम्बन्धवाचक उपवाक्य हिन्दी में स्पष्ट और सहज है।
- source_word: בדבריו
  choice: अपने वचन से
  rationale: यह साधनसूचक भाव को व्यक्त करता है। एकवचन ‘वचन’ हिन्दी में दैवी आदेश की सामर्थ्य को स्वाभाविक ढंग से बताता है, यद्यपि शाब्दिक रूप से ‘अपने वचनों से’ भी सम्भव है।
- source_word: ינצח
  choice: वह ... तेज़ करता है
  rationale: हिब्रू पाठ कठिन है; यूनानी κατέσπευσεν ‘उसने शीघ्र किया’ गति बढ़ाने के अर्थ का समर्थन करता है।
- source_word: אביריו
  choice: उसकी गति
  rationale: हिब्रू रूप प्रसंग में समस्यापूर्ण है; यूनानी πορείαν ‘यात्रा/गति-पथ’ के आधार पर आकाशीय पिंड की चाल का अर्थ लिया गया है, बिना आधुनिक तकनीकी ‘कक्षा’ आरोपित किए।
theological_decisions:
- issue: परमेश्वर के नाम का अनुवाद
  choice: प्रभु
  alternative: याहवे
  rationale: हिब्रू में ה׳ परमेश्वर के नाम का श्रद्धासूचक संक्षेप है; ‘प्रभु’ हिन्दी में स्थापित और गरिमापूर्ण रूप है।
- issue: पाठ की दृष्टि से कठिन दूसरे चरण में हिब्रू और यूनानी का उपयोग
  choice: हिब्रू को आधार बनाकर यूनानी समानांतर से स्पष्ट अर्थ ‘अपने वचन से वह उसकी गति तेज़ करता है’
  alternative: 'हिब्रू का अधिक अक्षरशः किन्तु अस्पष्ट अर्थ: ‘अपने वचनों से उसका बलवान प्रबल होता है’'
  rationale: प्राप्त हिब्रू दूसरा चरण कठिन और संदिग्ध है, जबकि यूनानी समानांतर गति शीघ्र करने का सुसंगत खगोलीय अर्थ देता है। इस अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्तुतिपरक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। कठिन पाठ को मुख्य वाक्य में सहज रूप दिया गया है और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
