base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/017.yaml
  text: At the flash he shakes out snow[a], and like locusts it settles where it stays.
translation:
  language: hi
  text: चमक पड़ते ही वह अपनी बर्फ को झाड़कर बिखेर देता है[a], और वह टिड्डियों के समान अपने निवास-स्थान में बस जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह हिब्रू पाठ कठिन है और यूनानी समानांतर से बहुत भिन्न है। यूनानी पाठ में इसके स्थान पर उसकी गर्जना की ध्वनि, पृथ्वी, और उत्तरी हवा के तूफ़ान तथा पवन के बवंडर का वर्णन है। मसादा का हिब्रू पाठ भी यहाँ भिन्न है और जहाँ काहिरा गनीज़ा के पाठ में “चमक पड़ते ही” है, वहाँ आंशिक रूप से “गर्जना की ध्वनि” पढ़ता है।
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: चमक के साथ
  rationale: רשף का अर्थ चमक, ज्वाला या बिजली जैसी कौंध हो सकता है। मौसम के प्रसंग में यह अनुवाद हिब्रू की संक्षिप्तता बनाए रखता है और इसे अनावश्यक रूप से केवल ‘बिजली’ तक सीमित नहीं करता।
- source_word: יניף
  choice: झाड़कर बिखेरता है
  rationale: נוף/הניף का मूल भाव हिलाने, लहराने या उड़ाने का है। बर्फ के साथ ‘झाड़कर बिखेरता है’ स्वाभाविक हिन्दी में उसके उड़ाकर फैलाए जाने का चित्र व्यक्त करता है।
- source_word: שלגו
  choice: अपनी बर्फ
  rationale: हिब्रू रूप में तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय है, इसलिए ‘अपनी बर्फ’ मूल पाठ में निहित ईश्वरीय स्वामित्व को सुरक्षित रखता है।
- source_word: וכארבה
  choice: और वह टिड्डियों के समान
  rationale: ארבה टिड्डी या सामूहिक अर्थ में टिड्डियों को दर्शाता है। बहती और उतरकर छा जाने वाली बर्फ की तुलना को ‘टिड्डियों के समान’ स्पष्ट तथा निकट रूप में बनाए रखा गया है।
- source_word: ישכון
  choice: टिक जाती है
  rationale: שכן का अर्थ बसना, ठहरना या निवास करना है। बर्फ के लिए ‘टिक जाती है’ उसके गिरकर ठहर जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דירתו
  choice: अपने बसेरे में
  rationale: דירה का अर्थ निवास या बसेरा है और प्रत्यय ‘उसका/अपना’ दर्शाता है। कुछ असामान्य काव्यात्मकता बनाए रखने के लिए इसे सपाट अर्थानुवाद में विलीन नहीं किया गया।
theological_decisions:
- issue: भिन्न यूनानी समानांतर के स्थान पर उपलब्ध हिब्रू पाठ का उपयोग
  choice: मुख्य पाठ में काहाना के काहिरा गनीज़ा-आधारित हिब्रू पाठ का अनुवाद किया गया है।
  alternative: यूनानी पाठ के आधार पर उसकी गर्जना की ध्वनि, पृथ्वी और उत्तरी हवा के तूफ़ान का वर्णन।
  rationale: सिराख का हिब्रू साक्ष्य यहाँ उपलब्ध है, इसलिए उसे प्राथमिकता दी गई है। फिर भी यूनानी पाठ का अर्थ बहुत भिन्न है; इस पाठगत तनाव को पादटिप्पणी में स्पष्ट रखा गया है, न कि चुपचाप सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। ‘बसेरा’ मूल के निवास-रूपक को बचाता है, जबकि ‘झाड़कर बिखेरता है’ हिमपात की गति को स्वाभाविक ढंग से व्यक्त करता है।
