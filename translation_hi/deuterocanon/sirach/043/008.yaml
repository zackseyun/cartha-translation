base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: hi
  text: महीने-दर-महीने वह नया हो जाता है[a]—अपने बदलते रूप में वह कितना विस्मयकारी है! ऊँचाइयों का वाद्य, स्वर्गिक सेना का एक उपकरण[b][c]; आकाश के विस्तार में उसकी दीप्ति है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर का भाव है: “वह अपने नाम के अनुसार मास है, और परिवर्तन में अद्भुत रीति से बढ़ता है।” यह उपलब्ध इब्रानी “महीने-दर-महीने वह नया हो जाता है” से भिन्न पाठ या व्याख्या दर्शाता है।'
    reason: alternative_reading
  - marker: b
    text: इस अर्ध-पद का इब्रानी पाठ कठिन और संभवतः पाठगत रूप से अनिश्चित है। मसादा की पांडुलिपि में काहिरा गनीज़ा के पाठ से संबंधित, किंतु भिन्न शब्दावली मिलती है। सामान्य आशय यह है कि चंद्रमा स्वर्गिक सेना से संबद्ध है और आकाश में चमकता है।
    reason: textual_variant
  - marker: c
    text: या “ऊँचाइयों की वीणा।” इब्रानी पद असामान्य है और संभवतः रूपकात्मक है; उसका सटीक संबंध और अर्थ निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: महीने-दर-महीने वह अपने को नया करता है
  rationale: इब्रानी में חדש धातु की पुनरावृत्ति और מתחדש का आत्मवाचक भाव सुरक्षित रखा गया है। בחדשו को चंद्रमा के संदर्भ में स्वाभाविक कालगत मुहावरे ‘महीने-दर-महीने’ के रूप में व्यक्त किया गया है।
- source_word: מה נורא בהשתנותו
  choice: अपने बदलते रूप में वह कितना विस्मयकारी है
  rationale: נורא भय और श्रद्धामिश्रित विस्मय जगाने वाला है; सृष्टि-वर्णन में ‘विस्मयकारी’ उसका गरिमापूर्ण भाव देता है। השתנותו चंद्रमा की कलाओं के साथ होने वाले रूप-परिवर्तन की ओर संकेत करता है।
- source_word: כלי צבא
  choice: स्वर्गिक सेना का एक साधन
  rationale: כלי का अर्थ पात्र, उपकरण, साधन या हथियार हो सकता है और צבא सेना या गण को दर्शाता है। खगोलीय संदर्भ में ‘साधन’ सैन्य हथियार का अनावश्यक अर्थ आरोपित किए बिना रूपक की व्यापकता बनाए रखता है; ‘स्वर्गिक’ अगले מרום से जुड़ी ऊँचाई की धारणा को सहज हिन्दी में स्पष्ट करता है।
- source_word: נבלי מרום
  choice: ऊँचाई पर स्थित
  rationale: यह पद असामान्य और संभवतः पाठगत रूप से अनिश्चित है। मुख्य पाठ में इसे ऊर्ध्व आकाशीय स्थिति के रूप में न्यूनतम अर्थ देते हुए रखा गया है; ‘ऊँचाइयों की वीणा’ वाला अधिक शाब्दिक किंतु संदर्भ में कठिन विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מרצף רקיע מזהירתו
  choice: आकाश के विस्तार से उसकी दीप्ति चमकती है
  rationale: רקיע को आधुनिक पाठक के लिए ‘आकाश का विस्तार’ कहा गया है। कठिन और अंडाकार इब्रानी वाक्य को हिन्दी में पठनीय बनाने के लिए ‘चमकती है’ जोड़ा गया है, जबकि प्रकाश/दीप्ति का मूल बिंब सुरक्षित है।
theological_decisions:
- issue: आंशिक रूप से कठिन काव्य-पंक्ति में इब्रानी और यूनानी साक्ष्य का प्रयोग
  choice: जहाँ इब्रानी पाठ उपलब्ध है वहाँ उसे मुख्य आधार बनाया गया है; यूनानी समानांतर के भिन्न पाठ को पादटिप्पणी में रखा गया है।
  alternative: 'पहले खंड को यूनानी के अनुसार प्रस्तुत करना: ‘अपने नाम के अनुसार वह मास है और बदलते हुए अद्भुत रीति से बढ़ता है।’'
  rationale: बेन सीरा का उपलब्ध इब्रानी पाठ प्राथमिक साक्ष्य है। यूनानी पाठ पहले खंड में भिन्न शब्दावली या व्याख्या दर्शाता है, पर इब्रानी חדש की पुनरावृत्ति स्पष्ट है।
- issue: दूसरे अर्ध-पद की पाठगत और रूपकात्मक अनिश्चितता
  choice: सामान्य खगोलीय आशय को मुख्य पाठ में संयत रूप से व्यक्त किया गया और प्रमुख पाठगत/शाब्दिक विकल्प पादटिप्पणियों में सुरक्षित रखे गए।
  alternative: इसे निश्चित रूप से ‘ऊँचाइयों की वीणा’ या सैन्य ‘हथियार’ कहना।
  rationale: इब्रानी की वाक्य-रचना और נבלי מרום का अर्थ अनिश्चित है। किसी एक रूपक को निर्णायक बनाना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘महीने-दर-महीने’, ‘बदलते रूप’ और ‘आकाश का विस्तार’ स्वाभाविक हिन्दी देते हैं; कठिन दूसरे अर्ध-पद की अस्पष्टता पादटिप्पणियों द्वारा खुली रखी गई है।
