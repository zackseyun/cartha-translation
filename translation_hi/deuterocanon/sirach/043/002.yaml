base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/002.yaml
  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
translation:
  language: hi
  text: सूरज[a] अपने रूप और ताप में प्रकट होता है[b][c]—प्रभु के कार्य कितने विस्मयकारी हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर का अर्थ है: “सूरज, अपने उदय पर दिखाई देकर घोषणा करता है—एक अद्भुत साधन, परमप्रधान की कृति।” इब्रानी पाठ इसके बजाय सूरज के दिखाई देनेवाले रूप और उसके ताप पर बल देता है।'
    reason: alternative_reading
  - marker: b
    text: “अपने रूप और ताप में प्रकट होता है” के पीछे इब्रानी शब्दावली संक्षिप्त और कुछ कठिन है। आशय संभवतः यह है कि सूरज का दिखाई देना और उसका ताप प्रभु के विस्मयकारी कार्यों को प्रकट करते हैं।
    reason: lexical_alternative
  - marker: c
    text: मसादा की पांडुलिपि में इस स्थान की पंक्ति केवल खंडित रूप में बची है; मुख्य अनुवाद में काहिरा गनीज़ा की पांडुलिपियों से प्राप्त अधिक पूर्ण इब्रानी पाठ लिया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: सूरज
  rationale: खगोलीय पिंड के लिए सहज और सर्वसाधारण आधुनिक हिन्दी शब्द।
- source_word: מביע
  choice: प्रकट होता है
  rationale: इब्रानी कृदंत कुछ कठिन है; यह दृश्य अभिव्यक्ति या प्रकट होने का भाव दे सकता है। यूनानी समानांतर भी दिखाई देने और घोषणा करने की ओर संकेत करता है।
- source_word: בצורתו
  choice: अपने रूप में
  rationale: צורה दृश्य रूप या आकृति को सूचित करता है; यह अनुवाद इब्रानी के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: וחמה
  choice: और तपता है
  rationale: प्राप्त इब्रानी पाठ संक्षिप्त और कुछ असहज है, पर संभवतः सूरज की गर्मी व्यक्त करता है। क्रियात्मक हिन्दी मूल के आशय को बिना विस्तृत व्याख्या के स्पष्ट करती है।
- source_word: מה נורא
  choice: कितने विस्मयकारी हैं
  rationale: נורא भय-मिश्रित विस्मय जगाने का भाव रखता है। 'विस्मयकारी' आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: מעשי ה׳
  choice: प्रभु के कार्य
  rationale: מעשי बहुवचन है, इसलिए 'कार्य' का बहुवचनार्थक प्रयोग किया गया है; ה׳ को श्रद्धासूचक संक्षिप्त ईश्वरीय नाम मानकर 'प्रभु' किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम के संक्षिप्त रूप ה׳ का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: इब्रानी में श्रद्धासूचक संक्षिप्त रूप है। 'प्रभु' पाठ की धार्मिक गरिमा बनाए रखता है और किसी संप्रदाय-विशिष्ट उच्चारण को आरोपित नहीं करता।
- issue: सूरज के वर्णन को सृष्टिकर्ता के कार्यों से जोड़ना
  choice: बहुवचन 'प्रभु के कार्य' को यथावत रखा
  alternative: एकवचन 'परमप्रधान का कार्य', जैसा यूनानी समानांतर में है
  rationale: मुख्य इब्रानी साक्ष्य מעשי का बहुवचन देता है; यूनानी भिन्न पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक गद्य। इब्रानी की संक्षिप्तता और कठिनता को मुख्य पाठ में अत्यधिक सपाट किए बिना रखा गया है; पाठांतर और व्याख्यात्मक सहायता पादटिप्पणियों में दी गई है।
