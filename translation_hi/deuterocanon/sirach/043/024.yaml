  yaml_path: translation/deuterocanon/sirach/043/024.yaml
  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
translation:
  language: hi
  text: जो समुद्र में उतरते हैं[b], वे उसके सुदूर छोर का वर्णन करते हैं[a]; जब हमारे कान यह सुनते हैं, तो हम स्तब्ध रह जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में इब्रानी ‘उसके सुदूर छोर’ के स्थान पर ‘उसके खतरे’ है। मुख्य पाठ उपलब्ध इब्रानी साक्ष्य का अनुसरण करता है; यूनानी पाठ समुद्र के संकट पर केंद्रित व्याख्यात्मक या वैकल्पिक पाठ सुरक्षित रखता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘जो समुद्र में उतरते हैं’ है; यह समुद्री यात्रियों या नाविकों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יורדי הים
  choice: जो समुद्र में उतरते हैं
  rationale: यह इब्रानी मुहावरे की ठोस छवि को बनाए रखता है और नाविकों अथवा समुद्री यात्रियों का स्वाभाविक अर्थ देता है। यूनानी समानांतर पाठ भी समुद्र में यात्रा करने का अर्थ पुष्ट करता है।
- source_word: יספרו
  choice: वर्णन करते हैं
  rationale: क्रिया किसी देखी या अनुभव की हुई बात को बताने अथवा विस्तार से सुनाने का भाव रखती है।
- source_word: קצהו
  choice: उसके सुदूर छोर
  rationale: इब्रानी शब्द का मूल अर्थ अंत, सीमा या छोर है; प्रसंग में यह समुद्र के दूरस्थ विस्तार को सूचित करता है। बहुवचन-सदृश हिन्दी अभिव्यक्ति विशाल समुद्र के दूर-दराज़ भागों को स्वाभाविक रूप से व्यक्त करती है, जबकि पाठगत आधार इब्रानी ही रहता है।
- source_word: לשמע אזנינו
  choice: जब हमारे कान यह सुनते हैं
  rationale: यह इब्रानी के शाब्दिक और बलयुक्त वाक्यांश ‘हमारे कानों के सुनने पर’ की श्रवण-संबंधी छवि बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: נשתומם
  choice: हम स्तब्ध रह जाते हैं
  rationale: क्रिया आश्चर्य से अवाक् या स्तंभित हो जाने का प्रबल भाव देती है। ‘स्तब्ध’ विस्मय को व्यक्त करता है, पर भय को अनावश्यक रूप से निश्चित नहीं करता।
