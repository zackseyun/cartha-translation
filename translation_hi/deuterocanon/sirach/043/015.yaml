    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  choice: अपने सामर्थ्य से
  rationale: בְּ साधन का भाव व्यक्त करता है और כח यहाँ परमेश्वर के सामर्थ्य को दर्शाता है; यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: יתן
  choice: देता है
  rationale: נתן का सीधा अर्थ ‘देना’ है; यहाँ बादल को बल प्रदान करने का भाव है।
- source_word: לענן
  choice: बादल को
  rationale: हिब्रू पाठ में संज्ञा एकवचन है। हिंदी में एकवचन ‘बादल’ सामूहिक अर्थ भी स्वाभाविक रूप से व्यक्त कर सकता है।
- source_word: עז
  choice: बल
  rationale: עז का अर्थ शक्ति या बल है; ‘बल देता है’ हिंदी में संक्षिप्त और सहज संयोजन है।
- source_word: להשליך
  choice: ताकि वह … बरसाए
  rationale: לְ वाला infinitive उद्देश्य या परिणाम बता सकता है। मौसम के प्रसंग में शाब्दिक ‘फेंके’ की अपेक्षा ‘ओले बरसाए’ हिंदी में स्वाभाविक है, जबकि नीचे गिराने की क्रिया बनी रहती है।
- source_word: אבני אלגביש
  choice: ओले
  rationale: यह पद शाब्दिक रूप से ‘ओलों के पत्थर’ जैसा है; आधुनिक हिंदी में ‘ओले’ उसी ठोस मौसम-संबंधी चित्र का स्वाभाविक समतुल्य है।
