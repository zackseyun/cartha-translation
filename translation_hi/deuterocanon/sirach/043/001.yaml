translation:
  language: hi
  text: ऊँचाइयों की शोभा है निर्मल आकाश-मंडल—महिमा के दर्शन में आकाश का स्वरूप।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के साथ दिया गया इब्रानी पाठ इसके यूनानी पाठ से विषय-वस्तु में मेल नहीं खाता; यहाँ सिराख 43:1 के यूनानी पाठ के अनुसार अनुवाद किया गया है। इब्रानी पांडुलिपियों की पाठ-स्थिति खंडित और मिश्रित है।
    reason: उपलब्ध इब्रानी स्रोत और संदर्भ-संगत यूनानी साक्ष्य के बीच महत्वपूर्ण पाठगत असंगति को पाठक से छिपाया नहीं जाना चाहिए।
lexical_decisions:
- source_word: γαύριαμα ὕψους
  choice: ऊँचाई का गौरव
  rationale: ग्रीक पदबंध ऊँचाई/ऊर्ध्वलोक की शोभा और गौरव व्यक्त करता है; सहज हिन्दी में उसकी काव्यात्मक गरिमा रखी गई है।
- source_word: στερέωμα καθαριότητος
  choice: निर्मल आकाश-मंडल
  rationale: στερέωμα के लिए ‘आकाश-मंडल’ आधुनिक पाठक के लिए स्वाभाविक है और दृढ़/विस्तृत नभ की प्राचीन धारणा को संकेतित करता है; καθαριότητος की निर्मलता ‘निर्मल’ से व्यक्त हुई है।
- source_word: εἶδος οὐρανοῦ
  choice: आकाश का स्वरूप
  rationale: εἶδος रूप, दृश्य या स्वरूप हो सकता है; ‘स्वरूप’ दृश्य वैभव को बनाए रखते हुए अनावश्यक व्याख्या से बचता है।
- source_word: ἐν ὁράματι δόξης
  choice: महिमा के दर्शन में
  rationale: ὅραμα का अर्थ दृश्य या दर्शन और δόξα का अर्थ महिमा है; यह अनुवाद मूल की संक्षिप्त काव्यात्मक अस्पष्टता सुरक्षित रखता है।
theological_decisions:
- issue: पद के आधार-पाठ का चयन
  choice: इस संदर्भ से मेल खाने वाले यूनानी समानांतर को मुख्य आधार बनाया गया
  alternative: दिए गए मिश्रित इब्रानी पाठ का सीधे अनुवाद करना
  rationale: प्रस्तुत इब्रानी पाठ की सामग्री सिराख 43:1 के प्रचलित यूनानी पाठ और दिए गए अंग्रेज़ी परामर्श-पाठ से मेल नहीं खाती तथा संभवतः किसी अन्य प्रसंग की पंक्तियाँ समेटती है। संदर्भगत पद की पहचान बचाने के लिए यूनानी साक्ष्य अपनाया गया और पाठगत समस्या को पादटिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आकाश-मंडल’ प्राचीन ब्रह्मांड-वर्णन को व्यक्त करता है, पर किसी आधुनिक वैज्ञानिक धारणा को पाठ में आरोपित नहीं करता।
