  yaml_path: translation/deuterocanon/sirach/043/030.yaml
  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: hi
  text: प्रभु की महिमा करते हुए, अपनी आवाज़ उतनी ऊँची करो जितनी तुमसे हो सके, क्योंकि अभी और भी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में है, “क्योंकि वह और भी बढ़कर है,” जो स्पष्ट करता है कि प्रभु सारी स्तुति से परे है। इब्रानी अधिक संक्षिप्त है: “क्योंकि अभी और भी है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי ה׳
  choice: प्रभु की महिमा का बखान करनेवालो
  rationale: גדל का बहुवचन कृदन्त यहाँ प्रभु को महान ठहराने या उसकी महिमा का गुणगान करनेवालों को संबोधित करता है। यह हिन्दी रूप उस स्तुतिपरक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הרימו קול
  choice: अपना स्वर ऊँचा करो
  rationale: यह वाक्यांश आवाज़ उठाने का ठोस बिंब बनाए रखता है और हिन्दी में मुखर स्तुति के आह्वान के रूप में स्वाभाविक है।
- source_word: בכל תוכלו
  choice: जितना तुमसे हो सके उतना
  rationale: यह व्यक्ति की पूरी सामर्थ्य और उसकी सीमा—दोनों को व्यक्त करता है; यूनानी समानान्तर भी इसी अर्थ की पुष्टि करता है।
- source_word: כי יש עוד
  choice: क्योंकि अभी और भी है
  rationale: 'इब्रानी का संक्षिप्त और कुछ हद तक अध्याहारयुक्त कथन जानबूझकर खुला रखा गया है: पूरी सामर्थ्य से स्तुति करने पर भी कहने को और शेष है।'
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर की स्तुति से परे महानता को कितना स्पष्ट किया जाए
  choice: क्योंकि अभी और भी है
  alternative: क्योंकि वह इससे भी बढ़कर है
  rationale: उपलब्ध इब्रानी पाठ संक्षिप्त और अस्पष्टता लिए हुए है, जबकि यूनानी उस निहित अर्थ को स्पष्ट करता है कि प्रभु हर स्तुति से बढ़कर है। मुख्य पाठ इब्रानी की संक्षिप्तता बनाए रखता है और यूनानी पाठ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सहज स्तुतिपरक संबोधन। ‘महिमा का बखान’ कृत्रिम शाब्दिक अनुवाद से बचते हुए मूल के ‘महान ठहराने’ के भाव को बनाए रखता है।
