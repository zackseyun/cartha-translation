  yaml_path: translation/deuterocanon/sirach/043/031.yaml
  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: hi
  text: किसने उसे देखा है और उसका वर्णन कर सकता है? और कौन उसका गुणगान उसके वास्तविक स्वरूप के अनुरूप कर सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इब्रानी पाठ यहाँ भिन्न है और संभवतः इस स्थान से मेल नहीं खाता। उसका शाब्दिक अर्थ है: “ऊँचाइयाँ अपनी शक्ति फिर से पाती हैं और थकती नहीं, क्योंकि तुम उनकी खोजबीन नहीं कर सकते।” इसके बजाय यूनानी पाठ में है: “किसने उसे देखा है और उसका वर्णन कर सकता है? और कौन उसका गुणगान उसके वास्तविक स्वरूप के अनुरूप कर सकता है?” मुख्य पाठ यूनानी का अनुसरण करता है, क्योंकि वह प्रसंग से स्वाभाविक रूप से मेल खाता है।'
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: किसने उसे देखा है
  rationale: यूनानी पूर्णकाल का स्वाभाविक और स्पष्ट हिन्दी रूप; यहाँ परमेश्वर के प्रत्यक्ष ज्ञान की मानवीय सीमा पर बल है।
- source_word: ἐκδιηγήσεται
  choice: उसका पूरा वर्णन कर सकता है
  rationale: क्रिया विस्तार से बताने या पूर्णतः वर्णन करने का भाव रखती है; ‘पूरा’ उसकी अर्थ-तीव्रता को व्यक्त करता है।
- source_word: μεγαλυνεῖ
  choice: उसकी महिमा ... कर सकता है
  rationale: उपासना-संबंधी प्रसंग में यह परमेश्वर को महान बताने और उसकी महिमा का गुणगान करने का स्वाभाविक हिन्दी रूप है।
- source_word: καθὼς ἐστιν
  choice: वैसी ... जैसा वह है
  rationale: यह परमेश्वर के वास्तविक स्वरूप के अनुरूप उसकी महिमा व्यक्त कर पाने की असमर्थता को संक्षेप में बनाए रखता है।
- source_word: מרומים החליפו כח ואל תלאו, כי לא תחקרו
  choice: मुख्य पाठ में नहीं अपनाया गया; पादटिप्पणी में शाब्दिक अर्थ दिया गया
  rationale: उपलब्ध इब्रानी पंक्ति संदर्भ से असंगत या दूसरे स्थान की प्रतीत होती है; संगत यूनानी साक्ष्य मुख्य पाठ का आधार बनाया गया है, पर इब्रानी पाठ को पारदर्शिता से सुरक्षित रखा गया है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ में असंगति
  choice: मुख्य पाठ में परमेश्वर की अगम्य महानता से जुड़ा यूनानी आलंकारिक प्रश्न
  alternative: ‘ऊँचे स्थान अपनी शक्ति नई करते हैं और थकते नहीं, क्योंकि तुम उनकी थाह नहीं पा सकोगे।’
  rationale: दिया गया इब्रानी साक्ष्य इस स्थान पर असंगत चिह्नित है और निकटवर्ती प्रसंग से सहजता से नहीं जुड़ता। यूनानी पाठ परमेश्वर की महानता की स्तुति के प्रसंग में अर्थपूर्ण है। पाठगत तनाव को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘उसका पूरा वर्णन’ यूनानी क्रिया की विस्तारपूर्ण अभिव्यक्ति को रखता है, और ‘उसकी महिमा करना’ धार्मिक प्रसंग में स्वाभाविक है।
