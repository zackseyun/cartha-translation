  yaml_path: translation/deuterocanon/sirach/043/011.yaml
  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: hi
  text: इंद्रधनुष को देखो और उसके बनानेवाले को धन्य कहो[a], क्योंकि वह वैभव में अत्यन्त भव्य है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘धनुष’; यहाँ आकाश का धनुष, अर्थात् इंद्रधनुष।
    reason: lexical_alternative
  - marker: b
    text: मसादा की पांडुलिपि यहाँ महिमा या वैभव के भाव का समर्थन करनेवाली समान-मूल शब्दावली रखती है।
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: देखो
  rationale: आज्ञार्थक क्रिया प्रत्यक्ष ध्यान देने का आह्वान करती है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: קשת
  choice: इंद्रधनुष
  rationale: मूल शब्द का शाब्दिक अर्थ ‘धनुष’ है, पर इस आकाशीय संदर्भ में इंद्रधनुष अभिप्रेत है; यूनानी समानांतर भी इसकी पुष्टि करता है।
- source_word: וברך
  choice: और ... धन्य कहो
  rationale: ברך का मूल अर्थ ‘धन्य कहना/आशीष देना’ है। यहाँ बनानेवाले के प्रति श्रद्धापूर्ण प्रशंसा व्यक्त होती है; यह रूप स्रोत की शब्दावली को ‘स्तुति करो’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: עושיה
  choice: उसके बनानेवाले को
  rationale: प्रत्यय इंद्रधनुष की ओर संकेत करता है। यह अभिव्यक्ति कर्तृवाचक हिब्रू रूप को स्पष्ट और सहज हिन्दी में रखती है, बिना परमेश्वर का नाम मूल से अधिक स्पष्ट किए।
- source_word: כי
  choice: क्योंकि
  rationale: यह बनानेवाले को धन्य कहने का कारण प्रस्तुत करता है।
- source_word: מאד
  choice: अत्यन्त
  rationale: तीव्रता को बनाए रखते हुए काव्यात्मक और गरिमापूर्ण हिन्दी देता है।
- source_word: נאדרה
  choice: भव्य है
  rationale: אדר से निकला रूप महिमा, प्रताप और भव्यता का भाव देता है; ‘भव्य’ दृश्य वैभव के संदर्भ में स्वाभाविक है।
- source_word: בהוד
  choice: वैभव में
  rationale: הוד महिमा, वैभव या तेज को सूचित करता है। ‘वैभव में’ हिब्रू की व्यापक अर्थ-सीमा रखता है; यूनानी समानांतर में दृश्य चमक का संकेत मिलता है।
theological_decisions:
- issue: धन्य कहे जानेवाले की पहचान
  choice: ‘उसके बनानेवाले’ कहकर मूल का अप्रत्यक्ष संकेत बनाए रखा गया है।
  alternative: ‘उसको बनानेवाले परमेश्वर को’
  rationale: हिब्रू में परमेश्वर का नाम स्पष्ट रूप से नहीं है। अनुवाद निहित संदर्भ को अनावश्यक रूप से विस्तृत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, श्रद्धापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘अत्यन्त भव्य’ और ‘वैभव’ मूल की महिमामय ध्वनि को बनाए रखते हैं।
