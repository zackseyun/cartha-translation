base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/025.yaml
  text: There are the wonders of his marvelous works[a], every kind of living thing, and the great sea-creatures.
translation:
  language: hi
  text: वहाँ उसके अद्भुत कार्य के आश्चर्य हैं—हर प्रकार के जीव-जंतु और विशाल समुद्री जीव।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अंतिम पद कठिन है; उसका शाब्दिक अर्थ “और महान/सामर्थी [वस्तुएँ या जीव]” हो सकता है। यूनानी समानांतर में “समुद्री महाकाय जीवों की सृष्टि” है, जो सम्भवतः अभिप्रेत अर्थ को सुरक्षित रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שם
  choice: वहाँ ... हैं
  rationale: यह इब्रानी स्थानवाचक शब्द है; क्रियारहित वाक्य को स्वाभाविक हिन्दी में अस्तित्वसूचक ‘वहाँ ... हैं’ से व्यक्त किया गया है।
- source_word: פלאות תמהי מעשהו
  choice: उसके आश्चर्यजनक कार्यों के अद्भुत दृश्य
  rationale: פלאות और תמהי दोनों विस्मय का भाव देते हैं, जबकि מעשהו परमेश्वर के कार्य की ओर संकेत करता है। यह रूप पुनरुक्ति के भाव को बनाए रखते हुए हिन्दी में सुबोध है।
- source_word: מין כל חי
  choice: हर प्रकार के जीव-जंतु
  rationale: מין का अर्थ प्रकार/जाति और כל חי का अर्थ समस्त जीवधारी है; ‘हर प्रकार के जीव-जंतु’ समुद्री संदर्भ में स्वाभाविक और व्यापक है।
- source_word: וגבורות רבה
  choice: विशाल समुद्री जीव
  rationale: प्राप्त इब्रानी पद कठिन है और अपने आप में महान/सामर्थी वस्तुओं या जीवों का संकेत दे सकता है। यूनानी समानांतर κτίσις κητῶν समुद्री महाकाय जीवों की ओर स्पष्ट संकेत करता है; प्रसंग भी समुद्र का है।
theological_decisions:
- issue: कठिन इब्रानी अंतिम पद को यूनानी समानांतर से स्पष्ट करना
  choice: विशाल समुद्री जीव
  alternative: महान सामर्थी जीव; बहुत-सी सामर्थ्यपूर्ण वस्तुएँ
  rationale: इब्रानी पाठ की अस्पष्टता के बीच यूनानी समानांतर ‘समुद्री महाकाय जीवों की सृष्टि’ पढ़ता है। समुद्री प्रसंग के कारण मुख्य पाठ में यह अर्थ अपनाया गया है, पर पाठगत कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और समुद्र-वर्णन के प्रसंगानुकूल रखी गई है। ‘समुद्री जीव’ यूनानी समानांतर से स्पष्ट किए गए अर्थ को व्यक्त करता है, जबकि पादटिप्पणी इब्रानी की वास्तविक अनिश्चितता बताती है।
