  to: वहाँ उसके अद्भुत कार्य के आश्चर्य हैं—हर प्रकार के जीव-जंतु और विशाल समुद्री जीव।[a]
  rationale: Revised the first phrase to remove the unsupported “दृश्य,” retain the singular sense of “his work,” and express the Hebrew’s wonder terminology directly in idiomatic modern Hindi. The final phrase continues to follow the Greek parallel’s likely contextual sense, with the Hebrew uncertainty clearly retained in the footnote.
