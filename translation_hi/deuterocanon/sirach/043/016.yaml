base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/016.yaml
  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: hi
  text: उसकी गर्जना की ध्वनि से पृथ्वी तड़प उठती है[b]; उत्तर के उग्र झोंके आँधी और तूफ़ान हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “उसके प्रकट होने पर पहाड़ हिलेंगे; उसकी इच्छा से दक्षिणी हवा चलती है।” यह उपलब्ध इब्रानी पाठ से बहुत भिन्न है, जिसकी दूसरी पंक्ति उत्तर के उग्र झोंकों को आँधी और तूफ़ान बताती है।'
    reason: alternative_reading
  - marker: b
    text: “तड़प उठती है” के लिए प्रयुक्त इब्रानी क्रिया का अनुवाद “थरथराती है,” “काँप उठती है,” या “ऐंठती है” भी हो सकता है; इसमें झटकेदार, तीव्र गति का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קול רעמו
  choice: उसकी गर्जन की आवाज़
  rationale: यह पदबंध परमेश्वर से संबद्ध मेघ-गर्जन की सुनाई देने वाली ध्वनि को दर्शाता है। ‘गर्जन की आवाज़’ आधुनिक हिन्दी में स्वाभाविक है और ईश्वरीय संबंधसूचक प्रत्यय को बनाए रखता है।
- source_word: יחיל
  choice: काँप उठती है
  rationale: חול/חיל ऐंठन, थरथराने या प्रसव-जैसी व्याकुल गति का बोध करा सकता है। ‘काँप उठती है’ आकस्मिक और तीव्र गति को सहज हिन्दी में व्यक्त करता है; अधिक शारीरिक बिंब वाले विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ארצו
  choice: पृथ्वी
  rationale: शाब्दिक रूप से ‘उसकी पृथ्वी/भूमि’ संभव है, पर सृष्टि-वर्णन के इस व्यापक संदर्भ में ‘पृथ्वी’ स्वाभाविक है और ‘भूमि’ के संभावित स्थानीय अर्थ से बचाता है।
- source_word: זלעפות צפון
  choice: उत्तर की प्रचण्ड बयार
  rationale: זלעפות उग्र झोंकों या प्रचण्ड वायु का संकेत देता है और צפון दिशा अथवा उत्तर से आने वाली हवा को। ‘प्रचण्ड बयार’ हिंसक वायु को स्पष्ट करती है, बिना गर्मी के अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: סופה וסערה
  choice: आँधी और तूफ़ान
  rationale: दोनों शब्द तीव्र तूफ़ानी मौसम के निकटार्थी हैं। हिन्दी में ‘आँधी और तूफ़ान’ उनका काव्यात्मक संचय और कुछ अर्थगत भेद बनाए रखता है।
theological_decisions:
- issue: मौसम-संबंधी बिंब में ईश्वरीय संबंधसूचक प्रत्यय
  choice: רעמו में ‘उसकी गर्जन’ रखा गया, पर ארצו को केवल ‘पृथ्वी’ अनूदित किया गया।
  alternative: ‘उसकी गर्जन की आवाज़ से उसकी पृथ्वी काँप उठती है’ अथवा ‘उसकी भूमि काँपती है।’
  rationale: गर्जन का परमेश्वर से संबंध पद के ईश्वर-केंद्रित भाव के लिए महत्त्वपूर्ण है। ‘उसकी पृथ्वी’ हिन्दी में अनावश्यक पुनरुक्ति लगेगी, जबकि ‘उसकी भूमि’ अर्थ को किसी सीमित भूभाग तक संकुचित कर सकती है।
- issue: इब्रानी और यूनानी पाठों के बीच बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी पाठ के अनुसार उत्तर की प्रचण्ड बयार, आँधी और तूफ़ान का वर्णन रखा गया।
  alternative: 'यूनानी पाठ: ‘उसके प्रकट होने पर पहाड़ हिलाए जाएँगे; उसकी इच्छा से दक्षिणी हवा चलती है।’'
  rationale: यहाँ इब्रानी पाठ उपलब्ध और उच्च-विश्वास वाला प्राथमिक साक्ष्य है। यूनानी समानांतर पाठ का अंतर इतना बड़ा है कि उसे पादटिप्पणी में सुरक्षित रखना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बयार’ सामान्य पाठक के लिए बोधगम्य रहते हुए पद की काव्यात्मकता बनाए रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
