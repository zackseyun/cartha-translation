base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/029.yaml
  text: The Lord is exceedingly awesome[a], and his words are wondrous.
translation:
  language: hi
  text: प्रभु अत्यन्त भय और विस्मय जगाने वाले हैं, और उनके वचन अद्भुत हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर पाठ में है, “और उनका प्रभुत्व अद्भुत है” (या “उनका शासन अद्भुत है”); यह उपलब्ध इब्रानी पाठ “और उनके वचन अद्भुत हैं” से भिन्न है।
    reason: alternative_reading
lexical_decisions:
- source_word: נורא
  choice: भय और विस्मय जगानेवाले
  rationale: यह इब्रानी विशेषण ירא मूल से है और ऐसे भय को व्यक्त करता है जिसमें श्रद्धापूर्ण विस्मय भी सम्मिलित है। केवल ‘भयावह’ नकारात्मक धमकी का भाव दे सकता है, जबकि यह अभिव्यक्ति दोनों पक्षों को स्वाभाविक हिन्दी में सुरक्षित रखती है। यूनानी φοβερός भी भय-विस्मय के इस अर्थ का समर्थन करता है।
- source_word: ה׳
  choice: प्रभु
  rationale: यह संक्षिप्त रूप परमेश्वर के नाम का प्रतिनिधित्व करता है। हिन्दी में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित संबोधन है; यूनानी समानांतर का Κύριος भी इसी शीर्षक का समर्थन करता है।
- source_word: מאד מאד
  choice: अत्यन्त
  rationale: מאד की पुनरावृत्ति प्रबल तीव्रता व्यक्त करती है। हिन्दी में ‘अत्यन्त’ इस बल को सहज और गरिमापूर्ण ढंग से व्यक्त करता है; यांत्रिक पुनरावृत्ति ‘बहुत, बहुत’ यहाँ कम स्वाभाविक होती।
- source_word: ונפלאות
  choice: और ... अद्भुत हैं
  rationale: פלא से बना यह रूप असाधारण और आश्चर्यजनक होने का भाव देता है। इब्रानी वाक्य में क्रिया निहित है, इसलिए हिन्दी में ‘हैं’ जोड़ा गया है।
- source_word: דבריו
  choice: उनके वचन
  rationale: इसका सीधा अर्थ ‘उनके शब्द/वचन’ है। ‘वचन’ इस धार्मिक-काव्यात्मक प्रसंग में स्वाभाविक है और उपलब्ध इब्रानी पाठ को प्राथमिकता देता है, जबकि यूनानी का भिन्न पाठ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ה׳ के रूप में आए परमेश्वर के नाम/उपाधि का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यहाँ संक्षिप्त इब्रानी रूप और समानांतर यूनानी Κύριος दोनों उपाधि-सदृश अनुवाद का समर्थन करते हैं। ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पाठ को किसी विशिष्ट सम्प्रदायगत प्रयोग से नहीं बाँधता।
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: उनके वचन अद्भुत हैं
  alternative: उनका प्रभुत्व अद्भुत है
  rationale: उपलब्ध इब्रानी साक्ष्य स्पष्ट रूप से דבריו, ‘उनके वचन’, पढ़ता है और इसलिए मुख्य पाठ में उसी को रखा गया है। यूनानी δυναστεία, ‘प्रभुत्व/सत्ता’, एक सार्थक प्राचीन भिन्न पाठ है, जिसे अस्पष्टता मिटाए बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘भय और विस्मय जगानेवाले’ ने נורא में निहित श्रद्धापूर्ण भय और आश्चर्य दोनों को सुरक्षित रखा है; ‘अत्यन्त’ ने दोहराए गए מאד מאד की तीव्रता को स्वाभाविक हिन्दी में व्यक्त किया है।
