  yaml_path: translation/deuterocanon/sirach/043/021.yaml
  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
translation:
  language: hi
  text: 'वह सूखे[b] से पहाड़ों की उपज झुलसा देता है,

    और वनस्पतियों से भरे चरागाह को ज्वाला से जला देता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर का पाठ अधिक सामान्य रूप में है: “वह पहाड़ों को भस्म कर देगा और निर्जन प्रदेश को जला देगा, और हरी घास को आग के समान बुझा देगा।” इस अनुवाद का आधार बना इब्रानी पाठ अधिक संक्षिप्त है और उसकी बिंब-योजना भिन्न है।'
    reason: alternative_reading
  - marker: b
    text: यहाँ ‘सूखे’ अनूदित इब्रानी शब्द का शाब्दिक भाव ‘सूखापन’ भी हो सकता है; इसलिए “सूखेपन से” एक अधिक शाब्दिक विकल्प है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יבול
  choice: उपज
  rationale: यह शब्द भूमि से उत्पन्न होने वाली पैदावार या वनस्पति को दर्शाता है; ‘उपज’ पहाड़ी वनस्पति के लिए पर्याप्त व्यापक और स्वाभाविक है।
- source_word: הרים
  choice: पहाड़ों
  rationale: इब्रानी का सीधा अर्थ ‘पहाड़’ है और यूनानी समानांतर भी इसी अर्थ का समर्थन करता है।
- source_word: בחרב
  choice: सूखे से
  rationale: חֹרֶב सूखापन या सूखा दर्शाता है। विनाशकारी प्राकृतिक शक्ति के इस संदर्भ में ‘सूखे से’ आधुनिक हिन्दी में अधिक सहज है, जबकि ‘सूखेपन से’ अधिक शाब्दिक विकल्प है।
- source_word: ישיק
  choice: झुलसा देता है
  rationale: क्रिया यहाँ विनाशकारी दाह या झुलसाने का भाव देती है। ‘झुलसा देता है’ पहले चरण में वास्तविक आग का अर्थ अनिवार्य किए बिना दूसरे चरण की ज्वाला-संबंधी छवि के साथ काव्यात्मक समानता बनाए रखता है।
- source_word: נוה
  choice: चरागाह
  rationale: वनस्पतियों के संदर्भ में यह मानव निवास के बजाय चरने की भूमि या हरित मैदान को दर्शाता है।
- source_word: צמחים
  choice: वनस्पतियों
  rationale: यह उगने वाले पौधों के लिए बहुवचन संज्ञा है; ‘वनस्पतियों’ काव्यात्मक संदर्भ में स्पष्ट और गरिमापूर्ण है।
- source_word: בלהבה
  choice: ज्वाला से
  rationale: पूर्वसर्ग सहित यह पद यहाँ साधन का भाव देता है; ‘ज्वाला से’ मूल की संक्षिप्त और प्रबल अग्नि-छवि को सुरक्षित रखता है।
