base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/012.yaml
  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: hi
  text: इंद्रधनुष ने अपनी महिमा में नियत सीमा को घेर लिया[a][c], और परमेश्वर के हाथ ने उसे उसकी ऊँचाई तक तान दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू חוק का सामान्य अर्थ ‘नियत सीमा,’ ‘विधि’ या ‘ठहराई हुई व्यवस्था’ है; यहाँ इसे आकाशीय संदर्भ में ‘नियत सीमा’ अनुवादित किया गया है। यूनानी समानांतर में ‘आकाश’ है: ‘उसने महिमा के घेरे से आकाश को घेर लिया।’'
    reason: alternative_reading
  - marker: b
    text: हिब्रू में ‘परमेश्वर का हाथ’ एकवचन है; यूनानी समानांतर में ‘परमप्रधान के हाथ’ बहुवचन हैं और वे ‘उसे’ तानते हैं।
    reason: textual_variant
  - marker: c
    text: मसादा पांडुलिपि में यहाँ केवल ‘…अपनी महिमा में/से’ जैसा अंश बचा है; मुख्य पाठ की पूरी पंक्ति काहाना के काहिरा गनीज़ा-आधारित हिब्रू पाठ से ली गई है।
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: क्षितिज
  rationale: חוק का मूल अर्थ ‘ठहराई हुई सीमा/नियत व्यवस्था’ है। इस आकाशीय काव्य-संदर्भ में यह दिखाई देने वाली नियत सीमा, अर्थात् क्षितिज, को सूचित कर सकता है। ‘क्षितिज’ हिन्दी में स्वाभाविक है, जबकि पाठ की शाब्दिक कठिनाई और यूनानी भिन्नता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הקיפה
  choice: चारों ओर घेर लिया
  rationale: क्रिया का अर्थ किसी वस्तु के चारों ओर जाना या उसे घेरना है। स्त्रीलिंग कर्ता संदर्भ में पिछले पद के इंद्रधनुष की ओर संकेत करता जान पड़ता है; हिन्दी में उसका सर्वनाम ‘उसने’ रखा गया है।
- source_word: בכבודה
  choice: अपनी महिमा से
  rationale: स्त्रीलिंग एकवचन प्रत्यय सबसे स्वाभाविक रूप से निहित स्त्रीलिंग कर्ता, संभवतः इंद्रधनुष, से जुड़ता है। करणसूचक ‘से’ उसके महिमामय घेराव को सहज हिन्दी में व्यक्त करता है।
- source_word: ויד אל
  choice: और परमेश्वर के हाथ ने
  rationale: हिब्रू में ‘हाथ’ एकवचन है और אל यहाँ स्तुतिपरक संदर्भ में ‘परमेश्वर’ है। यूनानी का बहुवचन ‘परमप्रधान के हाथ’ पादटिप्पणी में दिया गया है।
- source_word: נטתה
  choice: उसे … तान दिया
  rationale: נטה का अर्थ फैलाना या तानना है। स्त्रीलिंग क्रिया ‘हाथ’ के साथ मेल खाती है, और यूनानी समानांतर में व्यक्त कर्मवाचक सर्वनाम उस निहित कर्म को स्पष्ट करने में सहायक है।
- source_word: בגבה
  choice: ऊँचाई में
  rationale: גבה/גובה ऊँचाई या उच्चता को सूचित कर सकता है। ‘ऊँचाई में’ स्थानिक और काव्यात्मक अर्थ को सुरक्षित रखता है तथा इसे अनिवार्य रूप से ‘उसकी महिमा’ बनाकर धार्मिक अर्थ नहीं थोपता।
theological_decisions:
- issue: हिब्रू पाठ और यूनानी समानांतर के बीच भिन्नता
  choice: मुख्य पाठ में उपलब्ध हिब्रू के חוק, एकवचन ‘परमेश्वर का हाथ,’ और उसके काव्यात्मक वाक्य-विन्यास का अनुसरण किया गया है।
  alternative: ‘उसने महिमा के घेरे से आकाश को घेर लिया, और परमप्रधान के हाथों ने उसे तान दिया।’
  rationale: सिराख के इस पद के लिए उपलब्ध हिब्रू प्राथमिक साक्ष्य है। यूनानी ब्रह्मांडीय आशय की पुष्टि करता है, पर ‘आकाश’ और बहुवचन ‘हाथों’ को मुख्य पाठ में लाने के लिए हिब्रू को विस्थापित नहीं किया गया; वास्तविक भिन्नताएँ पादटिप्पणियों में दी गई हैं।
- issue: महिमा किसकी है
  choice: בכבודה को निहित स्त्रीलिंग कर्ता—संदर्भतः इंद्रधनुष—की ‘अपनी महिमा’ समझा गया है।
  alternative: ‘उसकी [परमेश्वर की] महिमा में’
  rationale: हिब्रू प्रत्यय स्त्रीलिंग एकवचन है, इसलिए उसे परमेश्वर के पुल्लिंग सर्वनाम के रूप में प्रस्तुत करना व्याकरणिक तनाव को मिटा देता। आसपास का संदर्भ इंद्रधनुष को संभावित कर्ता बनाता है, यद्यपि पद में उसका नाम दोहराया नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘चारों ओर घेर लिया’ सामान्य पाठक के लिए स्पष्ट है; ‘तान दिया’ सृष्टि-वर्णन की सजीव छवि रखता है। सर्वनामों को हिब्रू के लिंग-संकेतों के अनुसार रखा गया है और अनावश्यक सम्प्रदायगत व्याख्या से बचा गया है।
