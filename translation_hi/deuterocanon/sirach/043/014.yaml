  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
translation:
  language: hi
  text: इस कारण उसने एक भंडार बनाया[a][b], और बादलों को पक्षियों के समान उड़ा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी व्यंजनों के अनुसार यहाँ “उसने एक भंडार बनाया” पढ़ा जाता है; यूनानी समानांतर में “भंडार खोल दिए गए” है, जो संभवतः इस स्थान का अभिप्रेत अर्थ सुरक्षित रखता है।
    reason: textual_variant
  - marker: b
    text: मसादा की पांडुलिपि में यह पद स्पष्ट रूप से सुरक्षित नहीं है। यहाँ काहिरा जनीज़ा का इब्रानी मुख्य साक्षी है, और यूनानी पाठ का उपयोग मिलान के लिए किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: למען
  choice: इसी कारण
  rationale: यहाँ यूनानी διὰ τοῦτο की पुष्टि के अनुसार पदबंध प्रयोजन के बजाय कारण या परिणाम की कड़ी व्यक्त करता है।
- source_word: ברא אוצר
  choice: भंडार खोल दिए गए
  rationale: इब्रानी व्यंजनों को यथावत् पढ़ने पर अर्थ ‘उसने एक भंडार रचा’ हो सकता है, पर यूनानी समानांतर ‘भंडार खोल दिए गए’ पढ़ता है; मौसम के काव्यात्मक चित्र में यही अर्थ अधिक संगत है। पाठगत अंतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ויעף עבים
  choice: बादल ... उड़ चले
  rationale: यह सहज हिन्दी में बादलों की तीव्र उड़ान का सजीव चित्र बनाए रखता है और यूनानी के उड़ निकलने के भाव से मेल खाता है; इब्रानी को कारक रूप में ‘उसने बादलों को उड़ाया’ भी समझा जा सकता है।
- source_word: כצפרים
  choice: पक्षियों के समान
  rationale: यह मूल उपमा को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी में ज्यों का त्यों रखता है।
theological_decisions:
- issue: अनिश्चित इब्रानी क्रिया के साथ यूनानी समानांतर का उपयोग
  choice: ‘भंडार खोल दिए गए’
  alternative: ‘उसने एक भंडार रचा’
  rationale: काहाना के मिश्रित इब्रानी पाठ के व्यंजन ברא ‘रचा’ का अर्थ दे सकते हैं, जबकि यूनानी पाठ स्पष्ट रूप से ‘खोले गए’ कहता है। तूफान और आकाशीय भंडारों के प्रसंग में यूनानी द्वारा संरक्षित अर्थ अधिक संगत जान पड़ता है, पर इब्रानी पाठ को पादटिप्पणी में स्पष्ट किया गया है; इस प्रकार वास्तविक पाठगत तनाव मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘भंडार’ आकाशीय वर्षा-भंडारों की प्राचीन काव्यात्मक छवि को बनाए रखता है। निष्क्रिय ‘खोल दिए गए’ यूनानी साक्ष्य का रूप सुरक्षित रखता है और कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
