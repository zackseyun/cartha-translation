base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/009.yaml
  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
translation:
  language: hi
  text: आकाश का सौंदर्य और तारों का वैभव—उसका प्रकाश परमेश्वर की ऊँचाइयों में चमकता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मसादा की हिब्रू प्रति में आरम्भ का पाठ कुछ भिन्न है: “…आकाश का सौंदर्य और एक तारे का वैभव”; काहिरा गनीज़ा का पाठ “आकाश का सौंदर्य और तारों का वैभव” अर्थ देता है। मुख्य पाठ गनीज़ा के हिब्रू पाठ का अनुसरण करता है; यूनानी समानांतर भी सामूहिक अर्थ का समर्थन करता है।'
    reason: textual_variant
  - marker: b
    text: 'यूनानी समानांतर का अर्थ है: “आकाश का सौंदर्य, तारों की महिमा, प्रकाश देने वाला आभूषण; ऊँचाइयों में प्रभु।” यह आकाशीय ज्योतियों को चमकते आभूषण के रूप में प्रस्तुत करता है, जबकि मुख्य पाठ उपलब्ध हिब्रू शब्दों का अनुसरण करता है। हिब्रू में ‘उसका प्रकाश’ व्याकरणिक रूप से एकवचन है; मुख्य पाठ में यह एकवचन रखा गया है, यद्यपि ‘तारों’ का अर्थ सामूहिक है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: सौन्दर्य
  rationale: यहाँ शब्द आकाश के मनोहर और प्रभावशाली रूप को व्यक्त करता है; आधुनिक हिन्दी में ‘सौन्दर्य’ स्वाभाविक और काव्यात्मक है।
- source_word: שמים
  choice: आकाश
  rationale: हिब्रू का रूप बहुवचन है, पर हिन्दी में इस अर्थ में ‘आकाश’ स्वाभाविक सामूहिक संज्ञा है और ऊँचे काव्यात्मक भाव को बनाए रखता है।
- source_word: הדר
  choice: वैभव
  rationale: यह गरिमामय शोभा और भव्यता को व्यक्त करता है तथा תואר के लिए प्रयुक्त ‘सौन्दर्य’ से अर्थगत भेद बनाए रखता है।
- source_word: כוכב
  choice: तारों
  rationale: यद्यपि उपलब्ध हिब्रू पाठ में शब्द एकवचन रूप में है, यूनानी समानांतर बहुवचन है और प्रसंग सामूहिक अर्थ का समर्थन करता है।
- source_word: ואורו
  choice: उनका प्रकाश
  rationale: हिब्रू प्रत्यय एकवचन है, पर उसे तारों के सामूहिक प्रकाश से जोड़कर हिन्दी में ‘उनका’ कहना अधिक स्वाभाविक है; इस व्याकरणिक तनाव को टिप्पणी में स्पष्ट किया गया है।
- source_word: מזהיר
  choice: चमकता है
  rationale: कृदन्त उज्ज्वल प्रकाश देने या चमकने का भाव रखता है; ‘चमकता है’ बिना अनावश्यक तीव्रता जोड़े सहज हिन्दी देता है।
- source_word: במרומי אל
  choice: परमेश्वर की ऊँचाइयों में
  rationale: यह אל के स्पष्ट ईश्वरीय उल्लेख और उससे सम्बद्ध ऊँचे स्थानों—दोनों को बनाए रखता है।
theological_decisions:
- issue: במרומי אל में אל का अनुवाद
  choice: परमेश्वर
  alternative: सर्वोच्च स्थानों में; शक्तिमान की ऊँचाइयों में
  rationale: हिब्रू में ईश्वर का स्पष्ट उल्लेख है। ‘परमेश्वर’ आधुनिक हिन्दी में पारदर्शी और स्वाभाविक है तथा पाठ में कोई सम्प्रदायगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘सौन्दर्य’ और ‘वैभव’ समानार्थी होते हुए भी मूल के दो अलग शब्दों का भेद बनाए रखते हैं।
