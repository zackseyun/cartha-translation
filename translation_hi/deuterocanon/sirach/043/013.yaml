base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/013.yaml
  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: hi
  text: अपनी सामर्थ्य से वह बिजली का मार्ग निर्धारित करता है[b], और ऊँचाई पर चमकों को प्रबल करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “अपनी आज्ञा से वह हिम को रोक देता है, और अपने न्याय की बिजलियों को शीघ्र भेजता है।” इस पंक्ति में इब्रानी और यूनानी पाठों में पर्याप्त अंतर है।'
    reason: alternative_reading
  - marker: b
    text: 'यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ और अर्थ की दृष्टि से अनिश्चित है; इसके संभावित अर्थ हैं: “रेखा खींचता है,” “दिशा देता है,” या “नियुक्त करता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורתו
  choice: अपनी सामर्थ्य से
  rationale: संज्ञा का अर्थ शक्ति या सामर्थ्य है; प्रसंग में यह साधनवाचक है—परमेश्वर अपनी सामर्थ्य के द्वारा यह कार्य करता है।
- source_word: תתוה
  choice: मार्ग ठहराता है
  rationale: यह क्रिया यहाँ दुर्लभ और अर्थ की दृष्टि से अनिश्चित है; इसमें रेखा खींचने, मार्ग निर्धारित करने या दिशा देने का भाव हो सकता है। ‘मार्ग ठहराता है’ मूल बिंब और दैवी नियंत्रण, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ברק
  choice: बिजली
  rationale: यह बिजली या उसकी कौंध के लिए सामान्य इब्रानी शब्द है।
- source_word: ותנצח
  choice: प्रबल करता है
  rationale: נצח में प्रबल या श्रेष्ठ होने का भाव है। समानांतर रचना में इसे कारणवाचक रूप में लेना स्वाभाविक है, यद्यपि व्याकरणतः ‘वे प्रबल होती हैं’ भी संभव है।
- source_word: זיקות
  choice: चमकती लपटों
  rationale: शब्द चिंगारियों, अग्निमय चमकों या बिजली की कौंधों का संकेत दे सकता है। ‘चमकती लपटें’ बरק के समानांतर काव्यात्मक चित्र को रखती हैं और अत्यधिक विशिष्ट नहीं बनतीं।
- source_word: במרום
  choice: ऊँचाई में
  rationale: शाब्दिक अर्थ ‘ऊँचाई में’ या ‘ऊपर’ है। यह रूप मूल के स्थानवाचक और काव्यात्मक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और उससे पर्याप्त भिन्न यूनानी समानांतर पाठ में चयन
  choice: मुख्य पाठ में काहाना के संकलित इब्रानी पाठ का अनुसरण किया गया है और यूनानी पाठ को पादटिप्पणी में रखा गया है।
  alternative: ‘अपनी आज्ञा से वह हिम को रोक देता है, और अपने न्याय की बिजलियों को शीघ्र भेजता है।’
  rationale: इस पद के लिए इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वास वाला है, इसलिए वही मुख्य आधार है। फिर भी यूनानी पाठ का अंतर इतना बड़ा है कि पाठक को उससे अवगत कराना आवश्यक है।
- issue: ותנצח का कर्ता और वाच्य
  choice: ‘वह ... प्रबल करता है’—परमेश्वर को निहित कर्ता मानते हुए कारणवाचक अनुवाद।
  alternative: ‘और चमकती लपटें ऊँचाई में प्रबल होती हैं।’
  rationale: पूर्वार्ध के दैवी कर्ता और पंक्ति के समानांतर भाव के कारण कारणवाचक अनुवाद संदर्भ में उपयुक्त है, पर मूल की संभावित व्याकरणिक अस्पष्टता को निर्णय में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए बोधगम्य भाषा। ‘मार्ग ठहराता है’ दुर्लभ इब्रानी क्रिया की वास्तविक अनिश्चितता को पूरी तरह मिटाए बिना स्वाभाविक हिन्दी देता है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
