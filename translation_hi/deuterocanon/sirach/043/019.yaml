  text: He spreads frost like salt[c][b][a], and it sprouts like palm shoots.
translation:
  language: hi
  text: वह पाले को नमक की तरह फैलाता है,[a][c] और वह खजूर के अंकुरों की तरह फूट निकलता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कहाना के इब्रानी पाठ का अधिक शाब्दिक अर्थ लगभग ‘पाले की धुंध नमक के समान ठहरती है’ है; यूनानी समानांतर में है, ‘वह पृथ्वी पर नमक के समान पाला उँडेलता है।’ पाठ अनिश्चित है, इसलिए अनुवाद दोनों में साझा भाव प्रस्तुत करता है।
    reason: textual_variant
  - marker: b
    text: अन्तिम चित्र का अनुवाद ‘और वह खजूर के फूलों के समान खिलता है’ भी हो सकता है। यूनानी समानांतर के अनुसार यह जमकर बनी नुकीली बर्फीली आकृतियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद के इस भाग में मसादा-पाण्डुलिपि का पाठ कहाना द्वारा प्रस्तुत काहिरा गनीज़ा-पाठ से भिन्न है; इससे यहाँ इब्रानी पाठ-परम्परा में विक्षोभ का संकेत मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: אד
  choice: वह
  rationale: प्राप्त इब्रानी में इसका सामान्य अर्थ ‘धुंध/वाष्प’ है, पर पाठ यहाँ अस्थिर प्रतीत होता है। यूनानी समानांतर और प्रसंग परमेश्वर को मौसम संबंधी क्रिया का कर्ता बताते हैं, इसलिए निहित कर्ता ‘वह’ रखा गया है।
- source_word: כפור
  choice: पाला
  rationale: כפור का अर्थ पाला अथवा तुषार है। आधुनिक मानक हिन्दी में ‘पाला’ सहज और स्पष्ट है।
- source_word: כמלח
  choice: नमक के समान
  rationale: यह उपमा पाले के फैलाव या उसके सफेद रूप की तुलना नमक से करती है।
- source_word: ישכון
  choice: फैला देता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘बसना/ठहरना’ है; मौसम के इस चित्र में ‘फैला देता है’ स्वाभाविक हिन्दी देता है और संशोधित परामर्श-पाठ के अनुरूप है, यद्यपि पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ויציץ
  choice: फूट निकलता है
  rationale: צוץ का अर्थ अंकुरित होना या खिलना है। ‘फूट निकलता है’ वनस्पति-रूपक को बनाए रखता है।
- source_word: כתמר
  choice: खजूर के
  rationale: תמר खजूर अथवा खजूर का पेड़ है; हिन्दी में ‘खजूर’ संक्षिप्त और परिचित है।
- source_word: ציצים
  choice: अंकुरों
  rationale: यह शब्द फूलों, कलियों या उभरे हुए नुकीले आकारों को सूचित कर सकता है। ‘अंकुरों’ से पौधे का रूपक बना रहता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: आरम्भ में निहित कर्ता या संज्ञा
  choice: निहित ईश्वरीय कर्ता के रूप में ‘वह’
  alternative: 'कहाना-पाठ का अधिक शाब्दिक रूप: ‘पाले की धुंध नमक के समान ठहरती है’; अथवा यूनानी के निकट: ‘वह पृथ्वी पर नमक के समान पाला उँडेलता है।’'
  rationale: इब्रानी पाठ में विक्षोभ के संकेत हैं और यूनानी समानांतर स्पष्टतः परमेश्वर की क्रिया का वर्णन करता है। आसपास का स्तुतिगान भी मौसम पर परमेश्वर के शासन को विषय बनाता है। फिर भी अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: काव्यात्मक किन्तु सहज आधुनिक मानक हिन्दी। ‘पाला’, ‘नमक’, ‘खजूर के अंकुर’ जैसे सामान्य शब्द रखे गए हैं। मुख्य पाठ प्रवाहपूर्ण है, जबकि वास्तविक पाठगत और चित्रात्मक अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
