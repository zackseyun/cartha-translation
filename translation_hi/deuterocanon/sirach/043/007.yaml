base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: hi
  text: उन्हीं से नियत समय और विधान से ठहराए हुए काल आते हैं[b], और उसका चाहा हुआ कार्य अपने चक्र में होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरे अर्ध-पद का इब्रानी पाठ कठिन है। काहिरा गनीज़ा का पाठ लगभग यह कहता है, “और चाही हुई वस्तु/कार्य ... अपने चक्र में।” यूनानी समानांतर में है, “चन्द्रमा से पर्व का चिह्न मिलता है—वह ज्योति जो पूर्णता के समय घटती जाती है।”
    reason: alternative_reading
  - marker: b
    text: मसादा-पाण्डुलिपि में यहाँ है, “क्योंकि महान है प्रभु जिसने उसे बनाया,” जबकि काहिरा गनीज़ा का पाठ भिन्न और अधिक कठिन है।
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: उन्हीं से ... आते हैं
  rationale: ב का मूल अर्थ ‘में/से/के द्वारा’ हो सकता है। इस संक्षिप्त काव्य-पंक्ति में खगोलीय पिंडों से पंचांग के समय निर्धारित होने का भाव है; ‘उन्हीं से’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מועד
  choice: नियत समय
  rationale: מועד नियत समय अथवा पर्व दोनों को सूचित कर सकता है। זמני के साथ यहाँ व्यापक पंचांगीय अर्थ उपयुक्त है, जबकि यूनानी समानांतर में पर्व का संकेत मिलता है।
- source_word: וזמני חוק
  choice: विधान से ठहराए हुए काल
  rationale: זמנים समयों या कालों को और חוק निर्धारित विधान अथवा नियम को व्यक्त करता है। यह अनुवाद कालक्रम के नियत और नियमबद्ध होने—दोनों भावों को रखता है।
- source_word: וחפץ עשיו
  choice: उसका चाहा हुआ कार्य
  rationale: पाठ कठिन और रूपात्मक रूप से अस्पष्ट है। חפץ में इच्छा या चाह का भाव है; ‘उसका चाहा हुआ कार्य’ सृष्टिकर्ता की मंशा का संभावित अर्थ देता है, पर कठिन इब्रानी को अत्यधिक निश्चित नहीं बनाता।
- source_word: בתקופתו
  choice: अपने चक्र में
  rationale: תקופה घूमने, परिभ्रमण या ऋतु-चक्र का बोध कराता है। खगोलीय प्रसंग में ‘चक्र’ इसकी आवर्ती गति और पंचांगीय भूमिका को व्यक्त करता है।
theological_decisions:
- issue: दूसरे अर्ध-पद का कर्ता और धर्मवैचारिक बल
  choice: इसे सृष्टिकर्ता द्वारा चाहे गए कार्य के अपने चक्र में घटित होने का सामान्य कथन रखा गया है।
  alternative: यूनानी के अनुसार यह विशेषतः चन्द्रमा के पर्व का चिह्न होने और पूर्णता की ओर घटने का कथन हो सकता है; मसादा-पाठ में ‘क्योंकि महान है प्रभु जिसने उसे बनाया’ मिलता है।
  rationale: काहिरा गनीज़ा का इब्रानी पाठ कठिन है और यूनानी तथा मसादा साक्ष्य अलग रूप दिखाते हैं। मुख्य पाठ उपलब्ध इब्रानी के संभावित आशय को रखता है, जबकि पादटिप्पणियाँ अनिश्चितता और पाठांतर स्पष्ट करती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध काव्यात्मक गद्य। ‘पर्व’ को मुख्य पाठ में अनिवार्य नहीं किया गया, क्योंकि इब्रानी מועד का अर्थ व्यापक ‘नियत समय’ भी है। पाठगत कठिनाई को मुख्य पाठ में कृत्रिम रूप से नहीं सुलझाया गया और दोनों आवश्यक पादटिप्पणी-चिह्न पाठ में रखे गए हैं।
