base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
translation:
  language: hi
  text: ताप फैलाने के काम में धौंकी हुई भट्ठी के समान[a], सूर्य पहाड़ों को तीन गुना झुलसा देता है[b]; वह अग्निमय वाष्प फूँकता और किरणें चमकाता हुआ आँखों को धुँधला कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी पाठ कुछ स्थानों पर कठिन है और हर अंश में यूनानी पाठ से ठीक मेल नहीं खाता। अनुवाद में उपलब्ध इब्रानी को प्राथमिक माना गया है और कुछ संक्षिप्त या अनिश्चित वाक्यांशों को स्पष्ट करने के लिए यूनानी समानांतर का सहारा लिया गया है।
    reason: textual_variant
  - marker: b
    text: “तीन गुना” यूनानी साक्षी (τριπλασίως) में स्पष्ट है, पर उपलब्ध इब्रानी पंक्ति में यह पद साफ़ तौर पर सुरक्षित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: כור נפוח / κάμινον φυσῶν
  choice: धौंकी जाती भट्ठी
  rationale: इब्रानी पद में धौंककर प्रचंड की गई भट्ठी का बिंब है, जिसकी पुष्टि यूनानी समानांतर भी करता है। यह अनुवाद उस क्रिया और ताप—दोनों को बनाए रखता है।
- source_word: מחם מצוק / ἐν ἔργοις καύματος
  choice: ताप के काम में
  rationale: इब्रानी पद कठिन और संक्षिप्त है; यूनानी में भी ‘ताप के कार्यों में’ जैसा असामान्य वाक्यांश है। इसलिए अस्पष्टता को पूरी तरह सरल करके मिटाने के बजाय अपेक्षाकृत औपचारिक अभिव्यक्ति रखी गई है।
- source_word: ידליק הרים / ἐκκαίων ὄρη
  choice: पहाड़ों को ... झुलसा देता है
  rationale: मूल क्रिया जलाने या सुलगाने का बोध देती है। सूर्य के संदर्भ में ‘झुलसा देता है’ स्वाभाविक है और पहाड़ों के सचमुच आग पकड़ने का अनावश्यक अर्थ नहीं देता।
- source_word: τριπλασίως
  choice: तीन गुना
  rationale: यह तीव्रतासूचक शब्द यूनानी साक्षी में स्पष्ट है, यद्यपि उपलब्ध इब्रानी पंक्ति में साफ़ तौर पर सुरक्षित नहीं है। इसे पाठ में रखा गया और पाठांतर-संबंधी टिप्पणी जोड़ी गई।
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  choice: आग-सी तपती भाप फूँकता
  rationale: यूनानी वाक्यांश सूर्य से निकलती अग्निमय वाष्प का सजीव चित्र प्रस्तुत करता है। ‘आग-सी तपती भाप’ आधुनिक हिन्दी में बोधगम्य रहते हुए उस बिंब को सुरक्षित रखती है।
- source_word: לשאון מאור תגמר נושבת / καὶ ἐκλάμπων ἀκτῖνας
  choice: किरणें चमकाता हुआ
  rationale: इब्रानी खंड पाठगत रूप से कठिन है; यूनानी समानांतर स्पष्ट रूप से किरणें चमकाने की बात करता है। यह चयन उसी स्पष्ट साक्ष्य का अनुसरण करता है, बिना इब्रानी की कठिनाई छिपाए।
- source_word: ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  choice: आँखों को धुँधला कर देता है
  rationale: इब्रानी में ज्योति द्वारा आँख जलने या प्रभावित होने का अधिक तीखा बिंब है, जबकि यूनानी ‘आँखों को धुँधला करता है’ कहता है। चयन दृष्टि पर प्रखर प्रकाश के प्रभाव को व्यक्त करता है, पर पूर्ण अंधता का अर्थ नहीं जोड़ता।
