  yaml_path: translation/deuterocanon/sirach/043/010.yaml
  text: At his word the decree stands[b][a], and they do not fail in their watches.
translation:
  language: hi
  text: उसके वचन पर विधान स्थिर रहता है[a], और वे अपने पहरों में शिथिल नहीं पड़ते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसादा का इब्रानी पाठ है, “प्रभु के वचन पर विधान स्थिर रहता है,” और इस प्रकार दिव्य कर्ता को स्पष्ट करता है।
    reason: textual_variant
  - marker: b
    text: या, “वे अपने नियुक्त स्थानों पर निर्बल नहीं पड़ते।” यहाँ इब्रानी क्रिया अनिश्चित है; यूनानी समानांतर पाठ ढीले या निर्बल न पड़ने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר
  choice: उसके वचन से
  rationale: בְּ के साधन अथवा अवसर-सूचक अर्थ और דבר के ‘वचन’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। प्रसंग में संकेत परमेश्वर की ओर है, पर मुख्य पाठ में ‘प्रभु’ नाम जोड़ने के बजाय मूल की संक्षिप्तता रखी गई है।
- source_word: יעמד
  choice: स्थिर रहता है
  rationale: עמד का मूल भाव खड़े रहने, टिके रहने या कायम रहने का है। ब्रह्मांडीय व्यवस्था के संदर्भ में ‘स्थिर रहता है’ स्पष्ट और गरिमापूर्ण है।
- source_word: חק
  choice: निर्धारित विधान
  rationale: חק यहाँ केवल कानूनी नियम नहीं, बल्कि ठहराई हुई ब्रह्मांडीय व्यवस्था या आदेश को सूचित करता है। ‘निर्धारित विधान’ उसके नियत और प्रामाणिक दोनों पहलुओं को रखता है।
- source_word: ולא ישח
  choice: और वे ... शिथिल नहीं पड़ते
  rationale: इब्रानी क्रिया का पाठ और अर्थ कुछ अनिश्चित है। यूनानी ἐκλυθῶσιν और मसादा के समानांतर पाठ से थकने, ढीले पड़ने या चूकने से इनकार का भाव मिलता है; ‘शिथिल नहीं पड़ते’ इस अर्थ को सहज हिन्दी में रखता है।
- source_word: באשמרותם
  choice: अपने पहरों में
  rationale: אשמרותם नियुक्त पहरों, निगरानी-अवधियों या स्थानों का बिंब देता है। ‘अपने पहरों में’ आकाशीय पिंडों की नियत सेवाओं अथवा क्रमों का चित्र बनाए रखता है।
theological_decisions:
- issue: मुख्य पाठ में परमेश्वर का स्पष्ट नाम दिया जाए या संकेतात्मक सर्वनाम रखा जाए
  choice: ‘उसके वचन से’ कहकर संकेतात्मक दिव्य संदर्भ रखना
  alternative: ‘प्रभु के वचन से निर्धारित विधान स्थिर रहता है’
  rationale: प्रस्तुत काहाना पाठ और उसके पाठ-संबंधी विवरण में दिव्य संदर्भ की अभिव्यक्ति मसादा के स्पष्ट ‘प्रभु’ वाले पाठ से कम सुनिश्चित मानी गई है। इसलिए मुख्य पाठ में परमेश्वर का नाम जोड़कर अनिश्चितता समाप्त नहीं की गई; स्पष्ट वैकल्पिक पाठ पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘वचन’, ‘विधान’ और ‘पहरे’ मूल के अधिकार, स्थिर ब्रह्मांडीय क्रम और नियुक्त सेवा के बिंबों को सुरक्षित रखते हैं।
