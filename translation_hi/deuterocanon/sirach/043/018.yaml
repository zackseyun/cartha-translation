base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/018.yaml
  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
translation:
  language: hi
  text: हिम का रूप[a] आँखों को चकाचौंध कर देता है, और उसके गिरने पर[b] हृदय चकित हो उठता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘श्वेतता’ भी हो सकता है, पर यूनानी समानांतर और मौसम का प्रसंग यहाँ ‘हिम’ का प्रबल समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ शाब्दिक रूप से ‘उसकी वर्षा/बौछार’ जैसा कठिन पाठ है; यूनानी समानांतर इसे हिम के गिरने या उसके अवक्षेपण के रूप में समझने का समर्थन करता है।
    reason: textual_variant
  - marker: c
    text: मसादा की इब्रानी पांडुलिपि में इस खंड की निकटवर्ती पंक्ति भिन्न रूप में—‘और वह दृश्य हृदय को चकित करता है’—मिलती है; इससे संकेत मिलता है कि इब्रानी साक्षियों में इन काव्य-पंक्तियों का क्रम कुछ अस्थिर था।
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: रूप
  rationale: यह संज्ञा किसी वस्तु के दिखाई देने वाले रूप या स्वरूप को व्यक्त करती है। यहाँ मौसम-संबंधी दृश्य के संदर्भ में ‘रूप’ स्वाभाविक है और यूनानी समानांतर में निहित सौंदर्य का भाव भी समेट सकता है।
- source_word: לבנה
  choice: हिम
  rationale: शब्द का अर्थ ‘श्वेतता’ भी हो सकता है, पर यूनानी समानांतर में स्पष्ट रूप से ‘हिम’ है और प्रसंग भी मौसमी घटनाओं का है। ‘हिम’ काव्यात्मक गरिमा बनाए रखते हुए सामान्य आधुनिक हिन्दी में बोधगम्य है।
- source_word: יגהה עינים
  choice: आँखों को चकाचौंध कर देता है
  rationale: इब्रानी क्रिया चमक या दीप्ति से आँखों पर पड़ने वाले प्रभाव को दर्शाती है। यह प्रयोग हिम की तीखी उज्ज्वलता और उससे उत्पन्न विस्मय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ממטרו
  choice: उसके गिरने पर
  rationale: प्राप्त इब्रानी पाठ में वर्षा या बौछार से जुड़ा रूप है, जो हिम के संदर्भ में कठिन है। यूनानी समानांतर भी उसके अवक्षेपण की ओर संकेत करता है; इसलिए ‘गिरने पर’ पाठ की मौसमी छवि को बिना ‘वर्षा’ थोपे व्यक्त करता है।
- source_word: יהמה לב
  choice: हृदय चकित हो उठता है
  rationale: क्रिया में गर्जना, उद्वेलन या भीतर मचने वाली हलचल का भाव है। यूनानी समानांतर विस्मय की पुष्टि करता है। ‘चकित हो उठता है’ उस आकस्मिक भीतरी प्रतिक्रिया को पठनीय हिन्दी में रखता है, यद्यपि ‘उद्वेलित हो उठता है’ भी संभव है।
