  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘हिम’ मौसम-वर्णन के लिए संक्षिप्त और साहित्यिक है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट रखा गया है।
