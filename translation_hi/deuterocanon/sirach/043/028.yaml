base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/028.yaml
  text: Let us still magnify him[a], for we cannot search him out; and he is greater than all his works.
translation:
  language: hi
  text: हम उसकी बड़ाई और भी करें[a], क्योंकि हम उसकी थाह नहीं पा सकते; वह अपने सभी कार्यों से भी महान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक अर्थ है, “हम और भी बड़ाई करें, क्योंकि हम थाह नहीं पा सकते।” इब्रानी में न तो बड़ाई करने का कर्म और न ही थाह पाने का कर्म स्पष्ट कहा गया है; प्रसंग और यूनानी समानांतर पाठ परमेश्वर की ओर संकेत करते हैं।
    reason: इब्रानी क्रियाओं के निहित कर्म और संभावित शाब्दिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: נגדלה עוד
  choice: आओ, हम उसकी महिमा का वर्णन और भी करें
  rationale: नגדלה प्रथम पुरुष बहुवचन का आग्रहसूचक रूप है और עוד निरंतरता अथवा वृद्धि बताता है। यह अनुवाद आधुनिक हिन्दी में स्वाभाविक रहते हुए परमेश्वर की महानता का और अधिक वर्णन करने के आह्वान को व्यक्त करता है; इब्रानी में कर्म स्पष्ट नहीं है, इसलिए इसे पादटिप्पणी में बताया गया है।
- source_word: כי לא נחקור
  choice: क्योंकि हम उसकी थाह नहीं पा सकते
  rationale: חקר का अर्थ खोज-बीन करके पूरी तरह जान लेना या गहराई तक पहुँच पाना है। ‘थाह नहीं पा सकते’ इस बिंब और मानवीय सीमा दोनों को स्वाभाविक हिन्दी में बनाए रखता है। इब्रानी में कर्म निहित है, पर प्रसंग और यूनानी समानांतर पाठ परमेश्वर की ओर संकेत करते हैं।
- source_word: והוא גדול מכל מעשיו
  choice: वह अपने सभी कार्यों से बढ़कर महान है
  rationale: מכל के कारण तुलना का भाव है, इसलिए केवल ‘महान है’ के बजाय ‘से बढ़कर महान है’ उचित है। מעשיו को ‘उसके कार्य’ कहना इस सृष्टि-वर्णन में उसकी बनाई हुई वस्तुओं और कृत्यों दोनों को समेटता है।
theological_decisions:
- issue: לא נחקור में निहित कर्म
  choice: ‘उसकी थाह नहीं पा सकते’ में परमेश्वर को निहित कर्म माना गया है।
  alternative: वाक्य को निरपेक्ष रखा जा सकता था—‘हम पूरी तरह खोज नहीं सकते’—या कर्म को ‘उसकी महानता’ माना जा सकता था।
  rationale: इब्रानी कर्म को स्पष्ट नहीं करता, इसलिए पादटिप्पणी उस अस्पष्टता को सुरक्षित रखती है। फिर भी निकट प्रसंग और यूनानी समानांतर पाठ में परमेश्वर ही स्पष्ट आशय है; सुबोध हिन्दी के लिए सर्वनाम देना आवश्यक है।
- issue: परमेश्वर और उसके कार्यों की तुलना
  choice: ‘अपने सभी कार्यों से बढ़कर महान’
  alternative: ‘अपने सभी कार्यों से महान’
  rationale: इब्रानी מכל מעשיו और यूनानी παρὰ πάντα τὰ ἔργα αὐτοῦ दोनों तुलनात्मक अर्थ का समर्थन करते हैं। यह कथन परमेश्वर को उसकी सृष्टि के समान नहीं ठहराता, बल्कि उससे बढ़कर बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘थाह पाना’ खोजकर पूर्णतः जान लेने के मूल बिंब को बनाए रखता है; ‘से बढ़कर महान’ तुलनात्मक बल को स्पष्ट करता है।
