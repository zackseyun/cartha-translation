  text: Many such wonders exist[b][a], but I have seen only a few of his works.
translation:
  language: hi
  text: ऐसे आश्चर्य बहुत हैं[a], पर उसके कामों में से मैंने थोड़े ही देखे हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “इनसे बड़ी बहुत-सी छिपी हुई बातें हैं।” उपलब्ध हिब्रू पाठ अधिक संक्षिप्त है: “ऐसे आश्चर्य बहुत हैं।”'
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में “हमने उसके कामों में से थोड़े ही देखे हैं,” जबकि उपलब्ध हिब्रू पाठ में “मैंने” है।
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: बहुत हैं
  rationale: यहाँ רוב मात्रा की प्रचुरता बताता है; यूनानी πολλὰ भी इसी अर्थ की पुष्टि करता है। हिंदी में ‘बहुत हैं’ स्वाभाविक और स्पष्ट है।
- source_word: נפלאות
  choice: आश्चर्य
  rationale: यह शब्द विस्मय उत्पन्न करनेवाले असाधारण कामों या वस्तुओं को दर्शाता है। ‘आश्चर्य’ स्तुतिपरक संदर्भ के अनुकूल है।
- source_word: כאלה
  choice: ऐसे
  rationale: यह पिछले वर्णित सृष्टिगत चमत्कारों की ओर संकेत करता है और ‘इन जैसे’ का स्वाभाविक हिंदी रूप है।
- source_word: מעט
  choice: थोड़े ही
  rationale: यह परमेश्वर के समस्त कामों में से देखे गए कामों की सीमित संख्या बताता है; ‘ही’ प्रतिबंधात्मक बल स्पष्ट करता है।
- source_word: ראיתי
  choice: मैंने ... देखे हैं
  rationale: हिब्रू का प्रथम पुरुष एकवचन पूर्ण रूप अब तक के अनुभव के रूप में स्वाभाविक हिंदी पूर्णकाल में व्यक्त किया गया है।
- source_word: ממעשיו
  choice: उसके कामों में से
  rationale: 'מן यहाँ अंशसूचक है: वक्ता ने उसके सभी कामों में से केवल थोड़े देखे हैं। यह रूप उस अर्थ को स्पष्ट रखता है।'
theological_decisions:
- issue: क्या यूनानी पाठ के ‘छिपी हुई और इनसे बड़ी बातें’ को मुख्य पाठ में लिया जाए
  choice: मुख्य पाठ में उपलब्ध हिब्रू का संक्षिप्त वाक्य ‘ऐसे आश्चर्य बहुत हैं’ रखा गया है।
  alternative: इनसे बड़ी बहुत-सी छिपी हुई बातें हैं।
  rationale: हिब्रू साक्ष्य उपलब्ध और प्राथमिक है तथा उसमें ‘छिपी हुई’ या ‘इनसे बड़ी’ स्पष्टतः नहीं है। यूनानी का विस्तृत पाठ महत्त्वपूर्ण है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: 'वक्ता का वचन: हिब्रू एकवचन बनाम यूनानी बहुवचन'
  choice: ‘मैंने ... देखे हैं’
  alternative: ‘हमने ... देखे हैं’
  rationale: उपलब्ध हिब्रू में ראיתי प्रथम पुरुष एकवचन है। यूनानी बहुवचन को पाठांतर के रूप में पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और स्तुतिपरक रूप अपनाया गया है। ‘उसके’ का संकेत प्रसंगानुसार परमेश्वर की ओर है; मूल में नाम दोहराया नहीं गया, इसलिए अनावश्यक स्पष्टता नहीं जोड़ी गई।
