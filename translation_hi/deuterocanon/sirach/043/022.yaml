  text: 'A healing for all: a massing cloud of dew[c][b][a], driving back the scorching heat.'
translation:
  language: hi
  text: सबके लिए आरोग्य है—ओस का घना बादल,[c][b][a] जो झुलसाती गर्मी को दूर करके ताज़गी देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ओस का घना बादल’ वाला इब्रानी वाक्यांश कठिन है। यूनानी समानांतर में ‘कुहरा, ओस’ है; इसलिए यहाँ तूफानी या वर्षा-मेघ की अपेक्षा ठंडक देने वाली नमी का भाव अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: ‘ताज़गी देता है’ का अधिक शाब्दिक रूप ‘सरस/समृद्ध करता है’ या ‘भरपूर नमी देता है’ हो सकता है।
    reason: alternative_reading
  - marker: c
    text: इस अंश के लिए मसादा की पुस्तक-पट्टी खंडित है और इस पद का कोई स्पष्ट वैकल्पिक पाठ नहीं देती। अनुवाद काहिरा गनीज़ा के इब्रानी पाठ पर आधारित है और यूनानी समानांतर को सहायक साक्ष्य के रूप में देखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  choice: सबके लिए आरोग्य है
  rationale: מרפא का मूल अर्थ ‘आरोग्य/उपचार’ है और כל का व्यापक अर्थ ‘सब’ है। विधेयात्मक वाक्यांश इब्रानी की संक्षिप्त काव्यात्मक शैली को स्वाभाविक हिन्दी में रखता है।
- source_word: מערף ענן טל
  choice: ओस टपकाता बादल
  rationale: इब्रानी वाक्यांश कठिन है, पर ענן ‘बादल’ और טל ‘ओस’ स्पष्ट हैं। מערף को नमी टपकाने/बरसाने के भाव में लिया गया है; यूनानी समानांतर का ‘कुहरा, ओस’ भी शीतल नमी की ओर संकेत करता है।
- source_word: פורע
  choice: दूर करके
  rationale: שרב के साथ प्रसंगानुकूल अर्थ झुलसाती गरमी को हटाना या पीछे धकेलना है। यूनानी समानांतर भी गरमी से राहत के प्रभाव का समर्थन करता है।
- source_word: לדשן
  choice: ताज़गी देता है
  rationale: דשן का संबंध समृद्ध, पुष्ट या सरस करने से है। मौसम के इस प्रसंग में ‘ताज़गी देता है’ उस पुनर्जीवित करने वाले परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שרב
  choice: झुलसाती गरमी
  rationale: שרב सूखी, तपाने वाली गरमी, कभी-कभी लू, को दर्शाता है। ‘झुलसाती गरमी’ स्पष्ट है और काव्यात्मक संदर्भ में स्वाभाविक बैठता है।
