base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
translation:
  language: hi
  text: 'हम ऐसी और भी बहुत-सी बातें कहें, तब भी अंत तक नहीं पहुँचेंगे[a]; और बात का निष्कर्ष यह है: सब कुछ वही है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इब्रानी में इसी प्रकार की और बातें जोड़ने का भाव है। यूनानी समानांतर का अर्थ है, “हम बहुत कुछ कहेंगे, फिर भी अंत तक नहीं पहुँचेंगे।”
    reason: alternative_reading
  - marker: b
    text: 'या, “वही सब कुछ है।” इब्रानी अत्यंत संक्षिप्त है, और यूनानी समानांतर में व्यक्तिगत कर्ता पर बल है: “वह स्वयं ही सब कुछ है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוד כאלה לא נוסף
  choice: हम ऐसी और भी बहुत-सी बातें कहें, तब भी अंत तक नहीं पहुँचेंगे
  rationale: इब्रानी पाठ अत्यंत संक्षिप्त और कुछ असहज है तथा उसमें इसी प्रकार की और बातें जोड़ने का भाव है। यूनानी समानांतर स्पष्ट करता है कि बहुत कुछ कहने पर भी विषय के अंत तक नहीं पहुँचा जा सकता। हिन्दी में यह रूप दोनों साक्ष्यों का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וקץ דבר
  choice: और बात का निष्कर्ष यह है
  rationale: קץ का अर्थ ‘अंत/निष्कर्ष’ और דבר का अर्थ ‘बात/वचन/विषय’ हो सकता है। स्तुति के समापन में ‘बात का निष्कर्ष’ संक्षिप्त और सहज है।
- source_word: הוא הכל
  choice: सर्वस्व वही है
  rationale: इब्रानी वाक्यांश का क्रम संक्षिप्त और बलपूर्ण है; यूनानी αὐτός भी व्यक्तिगत कर्ता की पुष्टि करता है। ‘सर्वस्व वही है’ इस समग्रता के दावे और उसकी धर्मवैचारिक तीव्रता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का धर्मवैचारिक बल
  choice: सर्वस्व वही है
  alternative: वही सब कुछ है
  rationale: पाठ सृष्टि-वर्णन के बाद परमेश्वर के विषय में एक संक्षिप्त, व्यापक उद्घोष करता है। अनुवाद इसे ‘सब कुछ उसी से है’ जैसे व्याख्यात्मक कथन में नहीं बदलता, बल्कि मूल की वास्तविक अर्थगत और धर्मवैचारिक खिंचाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्तुतिपरक शैली रखी गई है। ‘सर्वस्व’ समापन की संक्षिप्त गंभीरता बनाए रखता है; पादटिप्पणियाँ इब्रानी की संक्षिप्तता और यूनानी समानांतर की स्पष्टता बताती हैं।
