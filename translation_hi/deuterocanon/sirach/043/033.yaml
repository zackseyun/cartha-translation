base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: hi
  text: प्रभु ने सब कुछ बनाया, और जो उसका भय मानते हैं[a], उन्हें उसने बुद्धि दी। प्राचीन पूर्वजों की स्तुति[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी समानांतर में यहाँ ‘भक्त जनों को’ है।
    reason: alternative_reading
  - marker: b
    text: यह अंतिम पदबंध यूनानी समानांतर में नहीं है। सम्भव है कि यह अगले खंड, ‘प्राचीन पूर्वजों की स्तुति’, का शीर्षक हो या वहाँ से यहाँ आ गया हो।
    reason: textual_variant
lexical_decisions:
- source_word: את הכל
  choice: सब कुछ
  rationale: यह כל के व्यापक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी πάντα से भी मेल खाता है।
- source_word: עשה
  choice: बनाया
  rationale: सृष्टि-सदृश इस सार-वाक्य में עשה का स्वाभाविक अर्थ ‘बनाया’ है।
- source_word: ה'
  choice: प्रभु
  rationale: हिब्रू संक्षेप परमेश्वर के दिव्य नाम का आदरसूचक संकेत है; ‘प्रभु’ पठनीय उपाधि है और यूनानी ὁ κύριος के अनुरूप भी है।
- source_word: ליראיו
  choice: जो उसका भय मानते हैं
  rationale: यह हिब्रू के शाब्दिक धार्मिक मुहावरे को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है; यूनानी इसे ‘भक्त जनों’ के रूप में व्यक्त करता है।
- source_word: נתן
  choice: उसने ... दी
  rationale: हिब्रू के पूर्ण क्रियारूप और यूनानी ἔδωκεν के अनुरूप सामान्य भूतकाल रखा गया है।
- source_word: חכמה
  choice: बुद्धि
  rationale: बेन सीरा में यह प्रमुख धार्मिक शब्द है; ‘बुद्धि’ उसका प्रचलित और सुसंगत हिन्दी रूप है।
- source_word: שבח אבות עולם
  choice: पुरातन पूर्वजों की स्तुति
  rationale: हिब्रू पदबंध में कोई स्पष्ट क्रिया नहीं है; इसलिए ‘स्तुति सदा बनी रहती है’ जैसा कथन जोड़ने के बजाय संज्ञात्मक रूप रखा गया है, जो अगले खंड के शीर्षक होने की सम्भावना भी खुली रखता है।
theological_decisions:
- issue: हिब्रू ה' का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमप्रभु
  rationale: यह दिव्य नाम के आदरसूचक संकेत को एक स्वाभाविक उपाधि से व्यक्त करता है और यूनानी समानांतर के ‘प्रभु’ से मेल रखता है, बिना किसी सम्प्रदाय-विशेष की शैली थोपे।
- issue: अंतिम पदबंध שבח אבות עולם को मुख्य पाठ में रखना
  choice: इसे संज्ञात्मक वाक्यांश ‘पुरातन पूर्वजों की स्तुति’ के रूप में रखा गया
  alternative: इसे अगले खंड से आया हुआ पाठ मानकर मुख्य पाठ से हटाना
  rationale: प्राप्त हिब्रू साक्ष्य में यह पदबंध मौजूद है, इसलिए उसे चुपचाप हटाया नहीं गया। साथ ही उसमें क्रिया जोड़कर अर्थ निश्चित नहीं किया गया; पादटिप्पणी यूनानी की छोटी पाठ-परंपरा और सम्भावित शीर्षकीय संबंध बताती है।
- issue: ליראיו और यूनानी εὐσεβέσιν के बीच भेद
  choice: जो उसका भय मानते हैं
  alternative: भक्त जनों को
  rationale: प्राथमिक हिब्रू पाठ का विशिष्ट ‘भय मानना’ मुहावरा सुरक्षित रखा गया है; यूनानी वैकल्पिक अर्थ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘भय मानना’ बाइबिलीय धार्मिक मुहावरे को सुरक्षित रखता है, जबकि वाक्यरचना साधारण पाठकों के लिए स्पष्ट है। अंतिम हिब्रू पदबंध को बिना निहित क्रिया जोड़े रखा गया है ताकि उसकी पाठगत अनिश्चितता बनी रहे।
