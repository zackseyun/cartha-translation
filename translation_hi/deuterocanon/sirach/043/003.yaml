base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/003.yaml
  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
translation:
  language: hi
  text: उसके प्रचण्ड चमकने पर संसार उबल उठता है[b], और उसकी तलवार के सामने कौन टिक सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘उसकी तलवार के सामने’ है; यूनानी समानांतर पाठ में ‘उसके ताप के सामने कौन खड़ा रह सकेगा?’ है। मुख्य पाठ में हिब्रू रूपक रखा गया है।
    reason: alternative_reading
  - marker: b
    text: इस स्थान पर पुराना मसादा साक्ष्य खंडित है। यहाँ मुख्य शब्दावली काहाना के काहिरा गनीज़ा-आधारित हिब्रू पाठ से ली गई है और यूनानी पाठ से उसकी तुलना की गई है।
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: उसके प्रचण्ड चमकने पर
  rationale: हिब्रू צהר से निकला रूप तेज चमकने या धधकते प्रकाश की ओर संकेत करता है। ‘प्रचण्ड’ सूर्य के तीखे प्रकाश और प्रसंगगत ताप को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि यूनानी के ‘दोपहर में’ को मुख्य पाठ में नहीं अपनाता।
- source_word: ירתיח
  choice: उबल उठता है
  rationale: רתח का मूल बिंब उबलने या खौलने का है। यह अत्यधिक गर्मी की सजीवता को ‘गरम करता है’ की अपेक्षा अधिक ठीक रखता है।
- source_word: תבל
  choice: संसार
  rationale: תבל प्रायः बसे हुए जगत या पृथ्वी-संसार को दर्शाता है। ‘संसार’ आधुनिक हिन्दी में स्वाभाविक और इस व्यापक काव्यात्मक अर्थ के अनुकूल है।
- source_word: חרבו
  choice: उसकी तलवार
  rationale: हिब्रू में शाब्दिक रूप से ‘उसकी तलवार’ है, जो सूर्य की काटती और विनाशकारी तपन का प्रबल रूपक है। यूनानी इसे ‘ताप/दाह’ के रूप में स्पष्ट करता है, पर मुख्य पाठ हिब्रू रूपक को बनाए रखता है।
- source_word: מי יתכלכל
  choice: कौन टिक सकता है?
  rationale: यह प्रयोग अपने को सँभाले रखने, डटे रहने या सह पाने का भाव देता है। ‘कौन टिक सकता है?’ सहज हिन्दी है और यूनानी ‘कौन सामना कर सकेगा/खड़ा रह सकेगा?’ से भी मेल खाता है।
