translation:
  language: hi
  text: अपनी योजना से उसने गहरे जल को शांत किया[a] और उसमें द्वीप रोप दिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पाठ कठिन है। यूनानी समानांतर का शाब्दिक अर्थ है, “अपने विचार से उसने अथाह गहराई को शांत किया और उसे रोपा।” उसका अंतिम सर्वनामिक पद अस्पष्ट है; फिर भी वह गहराई को शांत करने के अर्थ से मेल खाता है।
    reason: textual_variant
  - marker: b
    text: या “तटवर्ती भूभाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: अपनी योजना से
  rationale: מחשבה विचार, अभिप्राय या योजना को व्यक्त कर सकता है। सृष्टि-संबंधी इस प्रसंग में “योजना” प्रभावकारी उद्देश्य का स्वाभाविक बोध कराती है; यूनानी λογισμῷ भी सोच-विचार या अभिकल्पना की ओर संकेत करता है।
- source_word: משיק
  choice: शांत किया
  rationale: इब्रानी रूप कठिन है, पर यूनानी ἐκόπασεν का अर्थ ‘शांत किया/थमाया’ है। “शांत किया” आधुनिक हिन्दी में सहज रहते हुए समुद्र को वश में करने का चित्र बनाए रखता है।
- source_word: רבה / בתהום
  choice: अथाह सागर
  rationale: इब्रानी पाठ इस स्थान पर अनिश्चित है, जबकि यूनानी में ἄβυσσον ‘अथाह गहराई/महासागर’ है। “अथाह सागर” काव्यात्मक, सुबोध और सृष्टि-वर्णन के अनुकूल है।
- source_word: ויט
  choice: रोप दिए
  rationale: इब्रानी में स्थापित करने या लगाने का भाव हो सकता है और यूनानी ἐφύτευσεν स्पष्टतः ‘रोपा’ कहता है। यह विकल्प द्वीपों को जलराशि में स्थिर करने का सजीव रूपक सुरक्षित रखता है।
- source_word: איים
  choice: द्वीप
  rationale: איים का अर्थ ‘द्वीप’ या ‘तटवर्ती प्रदेश’ हो सकता है। अथाह सागर के भीतर स्थापित भूभागों के संदर्भ में “द्वीप” अधिक ठोस और स्वाभाविक है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: कठिन इब्रानी पाठ और अधिक स्पष्ट यूनानी समानांतर पाठ के बीच पाठ-संबंधी तनाव
  choice: 'उपलब्ध इब्रानी को आधार रखते हुए अस्पष्ट क्रिया और समुद्री बिंब को यूनानी समानांतर से स्पष्ट किया गया: “अपनी योजना से उसने अथाह सागर को शांत किया और उसमें द्वीप रोप दिए।”'
  alternative: “अपने विचार से उसने अथाह गहराई को थमा दिया और उसमें तटवर्ती प्रदेश स्थापित किए।”
  rationale: सिराख का विद्यमान इब्रानी पाठ प्राथमिक है, पर इस पद का शब्द-विन्यास कठिन और कुछ हद तक अनिश्चित है। इसलिए यूनानी साक्ष्य का उपयोग अर्थ को स्थिर करने के लिए किया गया है, और पाठ की अनिश्चितता को पादटिप्पणी में खुलकर बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज रखी गई है। “अथाह सागर” बाइबलीय सृष्टि-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है और “रोप दिए” मूल रूपक को जानबूझकर बनाए रखता है।
