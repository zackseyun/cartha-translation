  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: hi
  text: उसी के लिए दूत सफल होता है[a], और उसके वचन से दूत उसकी इच्छा पूरी करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूत’ का अर्थ ‘स्वर्गदूत’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ है: “और उसके वचन से सब कुछ व्यवस्थित है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  choice: उसी के लिए
  rationale: למען में प्रयोजन अथवा किसी के हित/उद्देश्य का भाव है। संदर्भ में सर्वनाम परमेश्वर की ओर लौटता है; ‘उसी के लिए’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יצלח
  choice: सफल होता है
  rationale: צלח का अर्थ सफल होना या अपने कार्य में सिद्ध होना है। ‘सफल होता है’ आधुनिक हिन्दी में सहज है और अनावश्यक रूप से समृद्धि का अर्थ नहीं जोड़ता।
- source_word: מלאך
  choice: दूत
  rationale: מלאך मनुष्य-दूत या स्वर्गदूत, दोनों को सूचित कर सकता है। ‘दूत’ मूल की अस्पष्टता को यथासंभव सुरक्षित रखता है; दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ובדבריו
  choice: और उसके वचन से
  rationale: ב यहाँ साधन का बोध कराता है। ‘वचन से’ बताता है कि आदेश अथवा कथन कार्य-सिद्धि का माध्यम है।
- source_word: יפעל
  choice: वह ... पूरी करता है
  rationale: פעל का अर्थ करना, कार्यान्वित करना या सिद्ध करना है। רצון के साथ ‘इच्छा पूरी करता है’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: רצון
  choice: उसकी इच्छा
  rationale: רצון इच्छा, अभिलाषा या प्रसन्नता को सूचित कर सकता है। यहाँ ‘इच्छा’ दैवी उद्देश्य का सीधा और संप्रदाय-निरपेक्ष अनुवाद है।
theological_decisions:
- issue: क्या מלאך को विशेष रूप से ‘स्वर्गदूत’ कहा जाए
  choice: मुख्य पाठ में ‘दूत’
  alternative: ‘स्वर्गदूत’
  rationale: इब्रानी शब्द दोनों अर्थों की अनुमति देता है और निकट संदर्भ किसी एक को निर्णायक नहीं बनाता। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और विशेष अर्थ पादटिप्पणी में देता है।
- issue: यूनानी समानांतर के व्यापक पाठ को मुख्य पाठ में लेना
  choice: इब्रानी के एकवचन कर्ता और ‘उसकी इच्छा’ को बनाए रखा
  alternative: ‘और उसके वचन से सब वस्तुएँ सुव्यवस्थित रहती हैं’
  rationale: प्राथमिक इब्रानी साक्ष्य יפעל רצון पढ़ता है, जबकि यूनानी में ‘सब कुछ’ व्यवस्थित/एक साथ स्थित होने की अलग परंपरा है। इस भिन्नता को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। मूल इब्रानी की शब्दगत अस्पष्टता तथा यूनानी पाठांतर को पादटिप्पणियों में स्पष्ट किया गया है।
