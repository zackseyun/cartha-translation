base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: hi
  text: उत्तर-पवन की ठंड लौट आती है; सड़न के समान[a] वह अपने सोते को जमा देती है। हर ठहरे हुए जल पर वह छा जाती है[b], और जलाशय छाती का बख़्तर पहन लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में ‘सड़न के समान’ पढ़ा जाता है, जो एक कठिन बिंब है। यूनानी समानांतर में अधिक स्पष्ट भाव है: ‘जल से बर्फ/क्रिस्टल जम जाता है।’ मुख्य पाठ उपलब्ध हिब्रू पाठ को रखता है।'
    reason: alternative_reading
  - marker: b
    text: इस खंड का हिब्रू शब्दांकन कठिन है। यूनानी समानांतर का भाव है कि बर्फ हर एकत्र जलराशि पर टिक जाती है।
    reason: textual_variant
lexical_decisions:
- source_word: צינת רוח צפון
  choice: उत्तर-पवन की ठंड
  rationale: मौसम के संदर्भ में רוּחַ का अर्थ ‘पवन’ है; צינת ठंडक को सूचित करता है। यह पदबंध हिब्रू की संबंध-रचना को स्वाभाविक हिन्दी में रखता है।
- source_word: ישיב
  choice: लौट आती है
  rationale: क्रिया का मूल भाव लौटने या वापस आने का है। स्त्रीलिंग ‘ठंड’ को कर्ता मानकर यह अनुवाद किसी अनुल्लिखित कर्म को नहीं जोड़ता।
- source_word: וכרקב
  choice: सड़न के समान
  rationale: उपलब्ध हिब्रू पाठ का सामान्य अर्थ ‘सड़न/क्षय के समान’ है, यद्यपि यहाँ बिंब कठिन है। मुख्य पाठ में प्राथमिक हिब्रू साक्ष्य सुरक्षित रखा गया है।
- source_word: יקפיא מקורו
  choice: वह अपने सोते को जमा देती है
  rationale: יקפיא जमाने की क्रिया है और מקורו का अर्थ ‘उसका सोता/स्रोत’ हो सकता है। ‘सोता’ जल-संबंधी बिंब को बनाए रखता है।
- source_word: על כל מעמד מים
  choice: हर ठहरे हुए जल पर
  rationale: מעמד מים स्थिर या एक स्थान पर इकट्ठे जल को सूचित करता है। यह हिन्दी में संक्षिप्त और सहज है।
- source_word: יקרים
  choice: वह छा जाती है
  rationale: हिब्रू रूप कठिन और संभवतः दुर्लभ या पाठगत रूप से विकृत है। यूनानी समानांतर बर्फ के एकत्र जल पर टिकने/फैलने का समर्थन करता है; ‘छा जाती है’ दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וכשריון ילבש מקוה
  choice: जलाशय कवच के समान छाती का बख़्तर पहन लेता है
  rationale: מקוה एकत्र जल या जलाशय है; ילבש वस्त्र पहनने का रूपक रखता है; שריון विशेषतः धड़ की रक्षा करने वाला बख़्तर हो सकता है।
