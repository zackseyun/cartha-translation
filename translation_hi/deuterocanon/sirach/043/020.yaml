  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। कठिन हिब्रू बिंब ‘सड़न के समान’ को स्पष्ट किए बिना सुरक्षित रखा गया है; पाठगत कठिनाई के लिए संक्षिप्त पादटिप्पणी दी गई है।
