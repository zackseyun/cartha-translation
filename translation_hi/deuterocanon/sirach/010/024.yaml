base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/024.yaml
  text: A ruler[a], a governor, and a judge are honored, but none is greater than one who fears God.
translation:
  language: hi
  text: अगुआ, शासक और न्यायाधीश सम्मान पाते हैं,[a] पर परमेश्वर का भय माननेवाले से बड़ा कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में यहाँ बहुत भिन्न पाठ है: “स्वतंत्र लोग बुद्धिमान दास की सेवा करेंगे, और समझदार मनुष्य शिकायत नहीं करेगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  choice: प्रधान
  rationale: यह शब्द दूसरों पर नियुक्त अधिकारी या अगुआ को दर्शाता है। ‘प्रधान’ अधिकार और प्रतिष्ठा दोनों व्यक्त करता है तथा ‘शासक’ से सूची में भिन्न बना रहता है।
- source_word: מוֹשֶׁל
  choice: शासक
  rationale: यह शासन करनेवाले व्यक्ति का सामान्य और स्वाभाविक हिन्दी पद है; पहले पद से अर्थगत निकटता रखते हुए भी तीन पदों की सूची को स्पष्ट रखता है।
- source_word: שׁוֹפֵט
  choice: न्यायी
  rationale: न्यायिक पद के लिए प्रचलित बाइबलीय हिन्दी शब्द है और यहाँ पदाधिकारी का बोध कराता है।
- source_word: נִכְבָּדוּ
  choice: आदर पाते हैं
  rationale: निफ़अल बहुवचन का भाव है कि इन पदाधिकारियों को सम्मानित या प्रतिष्ठित माना जाता है। ‘आदर पाते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְאֵין גָּדוֹל
  choice: पर ... से बड़ा कोई नहीं
  rationale: संयोजक यहाँ पहले कथन के साथ तुलना और विरोध प्रकट करता है; यह रूप इब्रानी की श्रेष्ठतासूचक तुलना को सहज हिन्दी में रखता है।
- source_word: מִיְּרֵא אֱלֹהִים
  choice: परमेश्वर का भय माननेवाले से
  rationale: ‘परमेश्वर का भय मानना’ श्रद्धापूर्ण भक्ति का प्रमुख बाइबलीय मुहावरा है। इसे केवल ‘आदर करना’ कहने से उसका धार्मिक और नैतिक भार घट जाएगा।
theological_decisions:
- issue: विद्यमान इब्रानी पाठ और अत्यंत भिन्न यूनानी पाठ में चयन
  choice: मुख्य पाठ में विद्यमान इब्रानी पाठ का अनुवाद
  alternative: 'यूनानी पाठ: “स्वतंत्र लोग बुद्धिमान दास की सेवा करेंगे, और समझदार मनुष्य शिकायत नहीं करेगा।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध और पर्याप्त रूप से सुनिश्चित है, वहाँ वह प्राथमिक स्रोत है। यूनानी साक्षी यहाँ मामूली शब्दांतर नहीं, बल्कि एक अलग उक्ति देता है; इसलिए उसे पाठ में मिलाने के बजाय पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर का भय मानना’ बाइबलीय मुहावरे के रूप में सुरक्षित है। पादटिप्पणी-चिह्न पहले खंड के अंत में रखा गया है ताकि स्पष्ट हो कि यूनानी साक्षी पूरे कथन के स्थान पर भिन्न उक्ति देता है।
