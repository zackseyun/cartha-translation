base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/011.yaml
  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: hi
  text: मनुष्य के मरने पर उसे विरासत में सड़न के कीड़े और कृमि, जूँ[a] और रेंगने वाले जीव मिलेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद ‘छोटे कीट’ या संभवतः ‘मच्छर’ भी किया जा सकता है; ठीक किस कीट का उल्लेख है, यह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर पाठ में सूची अधिक व्यापक है: “वह रेंगने वाले जीव और पशु, कृमि विरासत में पाएगा।” यह इब्रानी पाठ की जीव-सूची से भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: के मरने पर
  rationale: पूर्वसर्ग सहित infinitive construct यहाँ कालवाचक है; यह हिन्दी में स्वाभाविक रूप से ‘के मरने पर’ व्यक्त होता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ किसी मानव व्यक्ति को प्रतिनिधि और सामान्य अर्थ में दर्शाती है; ‘मनुष्य’ आधुनिक हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से रखता है।
- source_word: יִנְחַל
  choice: उसे विरासत में ... मिलेंगे
  rationale: क्रिया का अर्थ ‘विरासत पाना’ है। हिन्दी की स्वाभाविक वाक्य-रचना में दत्तिवाचक ‘उसे’ और ‘विरासत में मिलेंगे’ मूल अर्थ को स्पष्ट रखते हैं।
- source_word: רִמָּה
  choice: सड़न के कीड़े
  rationale: यह शब्द विशेषतः शव या सड़े पदार्थ में पाए जाने वाले कीड़ों को सूचित करता है। यह अनुवाद मृत्यु के प्रसंग को रखते हुए अगले शब्द ‘कृमि’ से कुछ भेद भी बनाए रखता है।
- source_word: וְתוֹלֵעָה
  choice: और कृमि
  rationale: यह सामान्यतः कृमि या कीड़े को दर्शाता है। ‘कृमि’ पहले पद से संबंधित किंतु अलग अभिव्यक्ति देकर इब्रानी युग्म को सुरक्षित रखता है।
- source_word: כִּנִּים
  choice: जूँ
  rationale: यह छोटे परजीवी या झुंड में पाए जाने वाले कीटों का नाम हो सकता है; ‘जूँ’ एक संभावित और प्रसंगानुकूल अर्थ है, पर सटीक कीट अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: וָרֶמֶשׂ
  choice: और रेंगने वाले जीव
  rationale: רֶמֶשׂ छोटे रेंगने या सरकने वाले जीवों का व्यापक नाम है; यह हिन्दी अभिव्यक्ति उसकी व्यापकता को बनाए रखती है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: एक पुरुष
  rationale: कहावत किसी एक मानव को सामान्य, प्रतिनिधिक अर्थ में प्रस्तुत करती है। हिन्दी में ‘मनुष्य’ मूल के मानव-संदर्भ और एकवचन वाक्य-रचना दोनों को बनाए रखता है, बिना कथन को केवल पुरुषों तक सीमित किए।
- issue: इब्रानी पाठ की प्रधानता और यूनानी समानांतर का भिन्न पाठ
  choice: इब्रानी की जीव-सूची का सीधा अनुवाद
  alternative: वह रेंगने वाले जीव और पशु, कृमि विरासत में पाएगा
  rationale: पूर्ण इब्रानी साक्ष्य उपलब्ध और उच्च-विश्वसनीय है, इसलिए वही आधार है। यूनानी पाठ सामान्य आशय की पुष्टि करता है, पर जीवों की सूची में भिन्न है; उस भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कहावती शैली रखी गई है। ‘विरासत’ मूल क्रिया की विडंबना और मृत्यु के बाद शरीर की दशा के बीच तनाव को बनाए रखती है; कथन को व्याख्यात्मक धार्मिक भाषा से नहीं बढ़ाया गया है।
