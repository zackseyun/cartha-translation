base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/028.yaml
  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: hi
  text: जो अपने ही प्राण के विरुद्ध पाप करता है, उसे कौन धर्मी ठहराएगा?[a] और जो अपने ही जीवन का अनादर करता है, उसका आदर कौन करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'काहिरा गनीज़ा में सुरक्षित इब्रानी पाठ यहाँ यूनानी से बहुत भिन्न और कठिन है। उसका अनुमानित अर्थ है: “मेरे बेटे, नम्रता में अपना आदर कर; और वह तुझे विवेक तथा खोया हुआ सम्मान देगा।” अंतिम खंड का कर्ता और सटीक संबंध अनिश्चित है। इस स्थान पर इब्रानी साक्ष्य पाठगत रूप से अस्थिर प्रतीत होने के कारण मुख्य पाठ यूनानी का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα
  choice: जो ... पाप करता है
  rationale: वर्तमान कृदन्त को सामान्य आचरण के रूप में स्वाभाविक हिन्दी में रखा गया है। उपलब्ध इब्रानी पाठ अत्यन्त कठिन और यूनानी से भिन्न है, इसलिए मुख्य पाठ में सुसंगत यूनानी समानान्तर का अनुसरण किया गया है।
- source_word: εἰς τὴν ψυχὴν αὐτοῦ
  choice: अपने ही प्राण के विरुद्ध
  rationale: ψυχή और अगले खंड के ζωή के बीच का शब्दगत भेद बनाए रखने के लिए ψυχή को ‘प्राण’ और ζωή को ‘जीवन’ किया गया है; εἰς यहाँ स्वयं के विरुद्ध किए गए पाप का भाव देता है।
- source_word: τίς δικαιώσει
  choice: उसे कौन निर्दोष ठहराएगा
  rationale: δικαιόω का नैतिक-न्यायिक भाव व्यक्त होता है—ऐसे व्यक्ति को कौन सही या निर्दोष घोषित कर सकता है। ‘धर्मी ठहराएगा’ संभव है, पर इस ज्ञान-साहित्यिक संदर्भ में ‘निर्दोष ठहराएगा’ अधिक सहज है।
- source_word: δοξάσει
  choice: उसका आदर कौन करेगा
  rationale: यहाँ δοξάζω सामाजिक सम्मान के अर्थ में है; ‘महिमा देगा’ संदर्भ से अधिक ऊँचा और अस्वाभाविक लगता।
- source_word: τὸν ἀτιμάζοντα
  choice: जो ... अनादर करता है
  rationale: ἀτιμάζω को δοξάζω के स्पष्ट विलोम के रूप में अनूदित किया गया है।
- source_word: τὴν ζωὴν αὐτοῦ
  choice: अपने ही जीवन का
  rationale: ζωή का सीधा और स्वाभाविक अर्थ ‘जीवन’ है; ‘अपने ही’ आत्म-संदर्भ पर बल बनाए रखता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानान्तर के बीच गहरा पाठांतर
  choice: मुख्य पाठ में यूनानी के सुसंगत द्विपदीय अर्थ का अनुवाद
  alternative: 'इब्रानी का अत्यन्त अनिश्चित अनुमानित अर्थ: “मेरे बेटे, नम्रता से अपना आदर कर, और वह तुझे समझ तथा खोया हुआ सम्मान देगा।”'
  rationale: दिया गया इब्रानी पाठ व्याकरण और अर्थ की दृष्टि से कठिन है तथा यूनानी से मूलतः भिन्न जान पड़ता है। यूनानी पाठ एक स्पष्ट, संतुलित कथन सुरक्षित रखता है। पाठगत अनिश्चितता छिपाने के बजाय इब्रानी रूप को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘प्राण’ और ‘जीवन’ द्वारा यूनानी ψυχή/ζωή का भेद रखा गया है। प्रश्नात्मक समानान्तरता और आदर/अनादर का विरोध भी सुरक्षित है।
