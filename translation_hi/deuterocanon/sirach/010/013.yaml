  yaml_path: translation/deuterocanon/sirach/010/013.yaml
  text: For the hope of arrogance is sin[a], and its source pours out wickedness.
translation:
  language: hi
  text: क्योंकि घमंड की आशा पाप है[a], और उसका सोता दुष्टता उगलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “क्योंकि घमंड का आरम्भ पाप है, और जो उसे थामे रहता है वह घृणित कर्म उगलेगा।” यूनानी पाठ का पहला खंड उल्लेखनीय रूप से भिन्न है और दूसरे खंड में भी अतिरिक्त बात है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  choice: आशा
  rationale: इब्रानी शब्द का सामान्य अर्थ ‘आशा’ अथवा ‘जिस पर भरोसा रखा जाए’ है। यूनानी पाठ का ‘आरम्भ’ एक महत्त्वपूर्ण वैकल्पिक पाठ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: זָדוֹן
  choice: घमंड
  rationale: यह शब्द अहंकारी और धृष्ट मनोवृत्ति व्यक्त करता है। आधुनिक हिन्दी में ‘घमंड’ स्पष्ट, स्वाभाविक और नैतिक अर्थ में सटीक है।
- source_word: חֵטְא
  choice: पाप
  rationale: इब्रानी संज्ञा का सीधा और प्रचलित हिन्दी समतुल्य; यूनानी समानांतर भी इसकी पुष्टि करता है।
- source_word: מְקוֹרָהּ
  choice: उसका सोता
  rationale: ‘सोता’ मूल जल-स्रोत रूपक को बनाए रखता है और अगले क्रियापद ‘उंडेलता है’ के साथ स्वाभाविक बिंब बनाता है। स्त्रीलिंग प्रत्यय का संकेत ‘घमंड’ की ओर समझा गया है।
- source_word: יַבִּיעַ
  choice: उंडेलता है
  rationale: क्रिया किसी सोते से उमड़ने या बह निकलने का भाव देती है। ‘उंडेलता है’ स्रोत के रूपक और प्रचुर निर्गमन दोनों को व्यक्त करता है।
- source_word: זִמָּה
  choice: दुष्टता
  rationale: यह दुष्ट मंशा, कुकर्म या नैतिक भ्रष्टता का व्यापक अर्थ रख सकता है। ‘दुष्टता’ इसे केवल यौन पाप तक सीमित नहीं करती।
theological_decisions:
- issue: पद के आरम्भ में इब्रानी מִקְוֵה और यूनानी ἀρχή का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘घमंड की आशा पाप है’
  alternative: ‘घमंड का आरम्भ पाप है’
  rationale: इस पद का इब्रानी पाठ उपलब्ध और उच्च-विश्वसनीयता वाला है, इसलिए मुख्य पाठ में उसे प्राथमिकता दी गई है। यूनानी परंपरा अर्थ की दृष्टि से उल्लेखनीय रूप से भिन्न है और दूसरे खंड को भी अलग ढंग से प्रस्तुत करती है; अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सोता…उंडेलता है’ द्वारा इब्रानी का जल-स्रोत रूपक संरक्षित है; ‘आशा’ की कुछ असामान्य पर अर्थपूर्ण अभिव्यक्ति को यूनानी पाठ के आधार पर सहज बनाकर बदलने के बजाय ज्यों का त्यों रखा गया है।
