translation:
  language: hi
  text: किसी प्रजा का शासक जैसा होता है, उसके अधिकारी भी वैसे ही होते हैं; और किसी नगर का प्रधान जैसा होता है, उसके निवासी भी वैसे ही होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשׁוֹפֵט עַם
  choice: जैसा किसी प्रजा का न्यायी
  rationale: כְּ तुलनात्मक लोकोक्ति की रचना करता है; שׁוֹפֵט न्याय करने वाले के साथ शासक का अर्थ भी रखता है। “न्यायी” मूल पद की न्यायिक-शासकीय व्यापकता बनाए रखता है, और अनिश्चित עַם के लिए “किसी प्रजा” सामान्य, लोकोक्तिपरक अर्थ देता है।
- source_word: מְלִיצָיו
  choice: उसके अधिकारी
  rationale: מֵלִיץ का मूल अर्थ दुभाषिया या प्रवक्ता हो सकता है, पर यहाँ शासन-संबंधी समानांतरता में शासक से जुड़े पदाधिकारियों का अर्थ अधिक स्वाभाविक है। “अधिकारी” अनावश्यक रूप से किसी विशिष्ट दरबारी पद को निर्धारित नहीं करता।
- source_word: וּכְרֹאשׁ עִיר
  choice: और जैसा किसी नगर का प्रधान
  rationale: רֹאשׁ का शाब्दिक अर्थ “सिर” और रूपक अर्थ “मुखिया/प्रधान” है। आधुनिक हिन्दी में “नगर का प्रधान” मूल शासकीय रूपक का स्वाभाविक अर्थ संप्रेषित करता है।
- source_word: יוֹשְׁבָיו
  choice: उसके निवासी
  rationale: יֹשְׁבִים किसी स्थान में रहने वालों को दर्शाता है। “निवासी” संक्षिप्त और वर्तमान मानक हिन्दी है; सर्वनाम नगर की ओर संकेत करता है।
theological_decisions:
- issue: उपलब्ध इब्रानी पाठ और यूनानी समानांतर पाठ के बीच पर्याप्त अंतर
  choice: मुख्य पाठ में उपलब्ध, उच्च-विश्वसनीयता वाले इब्रानी कथन का अनुवाद
  alternative: 'यूनानी: “अनुशासनहीन राजा अपनी प्रजा का नाश करेगा, और शासकों की समझ-बूझ से नगर बसाया जाएगा।”'
  rationale: सिराख का इब्रानी पाठ यहाँ उपलब्ध और प्रमाणित है, इसलिए वही मुख्य पाठ का आधार है। यूनानी पाठ केवल शब्दगत भिन्नता नहीं, बल्कि पद का उल्लेखनीय अलग रूप प्रस्तुत करता है; अतः उसे महत्त्वपूर्ण वैकल्पिक पाठ के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक रूप। दोनों अर्धपंक्तियों में “जैसा…वैसे ही…” की समानांतर रचना बनाए रखी गई है। “प्रजा,” “न्यायी,” “अधिकारी,” और “प्रधान” शासन-संदर्भ को स्पष्ट रखते हैं, पर किसी विशिष्ट राजनीतिक या सांप्रदायिक व्याख्या को आरोपित नहीं करते।
