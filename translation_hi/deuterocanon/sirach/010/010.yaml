  text: A slight illness makes a physician turn pale[a]; a king today[b], and tomorrow he falls.
translation:
  language: hi
  text: ज़रा-सी बीमारी चिकित्सक को पीला कर देती है[a]; आज वह राजा है, और कल गिर पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रंग-छवि ‘पीला कर देना’ है, अर्थात बीमारी से चेहरे का रंग बदल जाना या पीला पड़ जाना।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी समानांतर में है: ‘आज राजा है, और कल मर जाएगा,’ जो हिब्रू के ‘गिर पड़ेगा’ को विशेष रूप से मृत्यु के अर्थ में समझता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶץ
  choice: ज़रा-सी
  rationale: यह शब्द बहुत थोड़ी मात्रा या मामूली अंश को दर्शाता है। ‘ज़रा-सी’ आधुनिक हिन्दी में स्वाभाविक है और इस विडंबना को उभारता है कि मामूली बीमारी भी चिकित्सक पर असर डालती है।
- source_word: מַחֲלָה
  choice: बीमारी
  rationale: यह रोग या अस्वस्थता का सामान्य शब्द है; ‘बीमारी’ सहज और व्यापक आधुनिक हिन्दी है।
- source_word: יַצְהִיב
  choice: पीला कर देती है
  rationale: हिब्रू क्रिया पीला पड़ने या पीला कर देने की रंग-छवि रखती है। इसे केवल ‘फीका’ कहने के बजाय रंग-संबंधी मूल बिंब बनाए रखा गया है।
- source_word: רוֹפֵא
  choice: चिकित्सक
  rationale: इसका अर्थ उपचार करने वाला व्यक्ति है। ‘चिकित्सक’ गरिमापूर्ण, आधुनिक और ज्ञान-साहित्य के अनुरूप है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: मानक और सीधा राजकीय पदनाम।
- source_word: הַיּוֹם
  choice: आज
  rationale: वर्तमान प्रतिष्ठा को अगले दिन की दशा के विपरीत रखता है।
- source_word: וּמָחָר
  choice: और कल
  rationale: संयोजक और कालवाचक शब्द को सीधे रखते हुए वाक्य-सन्निधि से तीखा विरोध प्रकट होने दिया गया है।
- source_word: יִפּוֹל
  choice: गिर पड़ेगा
  rationale: हिब्रू का मूल अर्थ ‘गिरना’ है और यह पतन अथवा मृत्यु दोनों की ओर संकेत कर सकता है। हिन्दी में ‘गिर पड़ेगा’ उस व्यापक बिंब को बनाए रखता है।
theological_decisions:
- issue: राजा के भावी परिणाम को विशेष रूप से मृत्यु कहना या व्यापक रूप से पतन रहने देना
  choice: गिर पड़ेगा
  alternative: मर जाएगा / उसका अंत हो जाएगा
  rationale: प्राथमिक हिब्रू पाठ יִפּוֹל अर्थात ‘गिरेगा’ कहता है, जो मृत्यु को समाहित कर सकता है, पर उसी तक सीमित नहीं है। यूनानी समानांतर इसे मृत्यु या अंत के रूप में अधिक विशिष्ट करता है; इसलिए मुख्य पाठ में हिब्रू की व्यापकता रखी गई और यूनानी अर्थ को पाद-टिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले खंड में हिब्रू की रंग-छवि को स्पष्ट रूप से बचाया गया है। दूसरे खंड में ‘आज वह राजा है’ हिन्दी में आवश्यक कर्ता जोड़ता है, जबकि ‘गिर पड़ेगा’ हिब्रू की मृत्यु और व्यापक पतन के बीच की वास्तविक अर्थगत खुली संभावना को बनाए रखता है।
