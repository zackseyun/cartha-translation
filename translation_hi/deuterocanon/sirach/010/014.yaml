  text: Therefore God filled his heart and struck him[b][a], and struck him down completely.
translation:
  language: hi
  text: इसलिए परमेश्वर ने उसका हृदय भर दिया और उसे मारा[b][a]; उसने उसे पूरी तरह मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन है; उसका शब्दशः भाव लगभग यह है: “इसलिए परमेश्वर ने उसका हृदय भर दिया, मारा।” यूनानी पाठ है: “इसलिए प्रभु ने विपत्तियों/दंडों को असाधारण बना दिया और उन्हें पूरी तरह नष्ट कर दिया।”'
    reason: textual_variant
  - marker: b
    text: यूनानी पाठ में “प्रभु” है, जबकि उपलब्ध इब्रानी पाठ में “परमेश्वर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकलने वाले परिणाम को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी संयोजक है।
- source_word: מִלֵּא לִבּוֹ
  choice: उसका हृदय भर दिया
  rationale: इब्रानी का निकट और जानबूझकर कुछ कठिन रूप रखा गया है, क्योंकि किस वस्तु या भाव से हृदय भरा गया, यह पाठ में व्यक्त नहीं है। किसी पूरक भाव को जोड़ना अनिश्चितता को अनुचित रूप से सुलझा देता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुसरण किया गया है; यूनानी में ‘प्रभु’ है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נָגַע
  choice: मारा
  rationale: दंड के प्रसंग में यह क्रिया केवल तटस्थ ‘छुआ’ नहीं, बल्कि प्रहार या पीड़ा देने का अर्थ रख सकती है। कठिन इब्रानी वाक्य-संरचना को यथासंभव सुरक्षित रखा गया है।
- source_word: וַיַּכֵּהוּ
  choice: उसने उसे ... मिटा दिया
  rationale: नכה का मूल भाव प्रहार करना है; עַד כַּלֵּה के साथ यहाँ विनाशकारी परिणाम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עַד כַּלֵּה
  choice: पूरी तरह
  rationale: यह पूर्ण अंत अथवा सर्वथा विनाश का बोध कराता है; यूनानी εἰς τέλος भी पूर्णता की पुष्टि करता है।
theological_decisions:
- issue: इब्रानी और यूनानी में भिन्न ईश्वरीय उपाधि
  choice: परमेश्वर
  alternative: प्रभु
  rationale: सिराख के उपलब्ध इब्रानी पाठ को मुख्य आधार बनाया गया है। यूनानी पाठ की भिन्न उपाधि को सामंजस्य में मिलाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- issue: कठिन और संभवतः असंगत इब्रानी प्रथम खंड
  choice: ‘उसका हृदय भर दिया और उसे मारा’ के रूप में अपेक्षाकृत औपचारिक अनुवाद
  alternative: ‘प्रभु ने विपत्तियों/दंडों को असाधारण बना दिया’—यूनानी पाठ
  rationale: इब्रानी में पूरक कर्म स्पष्ट नहीं है और यूनानी एक अलग या विस्तृत पाठ दर्शाता है। मुख्य पाठ में अनुमानित ‘भय’ या ‘पीड़ा’ जोड़ने के बजाय कठिनता बनाए रखी गई है और पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। मुख्य पाठ इब्रानी की वास्तविक कठिनता को कुछ हद तक बनाए रखता है; पादटिप्पणियाँ यूनानी पाठांतर और ईश्वरीय उपाधि की भिन्नता स्पष्ट करती हैं।
