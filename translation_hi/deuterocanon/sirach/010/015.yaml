translation:
  language: hi
  text: परमेश्वर ने घमंडियों के सिंहासन उलट दिए और उनके स्थान पर नम्र लोगों को बैठाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: घमंडियों के सिंहासन
  rationale: इब्रानी में כִּסֵּא रूपतः एकवचन है, पर גֵאִים बहुवचन है; सामूहिक अर्थ और यूनानी समानांतर θρόνους के बहुवचन को ध्यान में रखते हुए स्वाभाविक हिन्दी में बहुवचन रखा गया।
- source_word: הָפַך
  choice: उलट दिए
  rationale: क्रिया का मूल अर्थ पलटना या उलट देना है; यह सत्ता के पतन की सशक्त छवि को बनाए रखता है।
- source_word: עֲנָוִים
  choice: नम्र लोगों
  rationale: यह शब्द दीन, विनम्र या नम्र जनों को सूचित कर सकता है; यहाँ घमंडियों के स्पष्ट विरोध में 'नम्र' सबसे सीधा और स्वाभाविक है।
- source_word: תַּחְתָּם
  choice: उनके स्थान पर
  rationale: शाब्दिक अर्थ 'उनके नीचे/बदले में' है; राजसत्ता के संदर्भ में इसका भाव उनके स्थान पर बैठाने का है।
theological_decisions:
- issue: सत्ता के परिवर्तन में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने ... उलट दिए और ... बैठाया
  alternative: सिंहासन उलट गए और नम्र लोग बैठ गए
  rationale: इब्रानी दोनों कार्यों का स्पष्ट कर्ता परमेश्वर को बनाता है; कर्मवाच्य अनुवाद उस कथन को दुर्बल कर देता।
- issue: सिंहासन का वचन
  choice: बहुवचन 'सिंहासन'
  alternative: एकवचन 'सिंहासन'
  rationale: इब्रानी का रूप एकवचन है, किंतु बहुवचन स्वामियों के साथ यह सामूहिक हो सकता है; प्राचीन यूनानी समानांतर भी बहुवचन देता है। इसीलिए सन्दर्भगत बहुवचन चुना गया, बिना किसी अतिरिक्त सांप्रदायिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। इब्रानी की समानांतर क्रियात्मक संरचना को बनाए रखा गया है।
