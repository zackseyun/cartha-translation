base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/007.yaml
  text: Pride is hateful to the Lord and to men[a], and from both comes oppressive wrongdoing.
translation:
  language: hi
  text: घमण्ड प्रभु और मनुष्यों—दोनों को घृणित है, और अत्याचार दोनों के विरुद्ध अपराध है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का दूसरा उपवाक्य अत्यंत संक्षिप्त है; उसका अधिक शाब्दिक रूप ‘और उन दोनों से/उन दोनों की ओर से अत्याचार का अपराध’ हो सकता है। यूनानी पाठ का अर्थ लगभग यह है: ‘और वह दोनों के विरुद्ध अन्याय करेगा।’'
    reason: पाठ की वास्तविक व्याकरणिक अस्पष्टता और यूनानी समानांतर को सुरक्षित रखना।
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: घृणित है
  rationale: यह रूप घृणा का पात्र होने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘घृणित’ नैतिक तीव्रता को स्वाभाविक रूप से बनाए रखता है।
- source_word: לְאָדוֹן
  choice: प्रभु को
  rationale: אדון का अर्थ ‘स्वामी’ भी हो सकता है, पर ज्ञान-साहित्य का प्रसंग और यूनानी Κυρίου यहाँ परमेश्वर को सूचित करते हैं।
- source_word: וַאֲנָשִׁים
  choice: मनुष्यों को
  rationale: यह प्रतिनिधिक बहुवचन है; ‘मनुष्य’ आधुनिक हिन्दी में मानव समुदाय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גַּאֲוָה
  choice: घमण्ड
  rationale: यह आत्मोन्नति और अहंकारी गर्व के नकारात्मक नैतिक अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וּמִשְּׁנֵיהֶם
  choice: दोनों के विरुद्ध
  rationale: शाब्दिक रूप से ‘उन दोनों से/उन दोनों की ओर से’ संभव है, किंतु संक्षिप्त इब्रानी वाक्य में यह पहले उल्लिखित प्रभु और मनुष्यों के संबंध में अपराध का संकेत देता प्रतीत होता है। अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מַעַל עֹשֶׁק
  choice: अत्याचार ... अपराध
  rationale: מעל विश्वासघाती अपराध या उल्लंघन और עשק दमन/शोषण दर्शाता है। यह रूप दोनों संज्ञाओं का नैतिक और सामाजिक बल बनाए रखता है।
theological_decisions:
- issue: אֲדוֹן का संदर्भ
  choice: प्रभु अर्थात परमेश्वर
  alternative: मानवीय स्वामी
  rationale: यूनानी समानांतर Κυρίου और ज्ञान-साहित्य का प्रसंग ईश्वरीय संदर्भ का समर्थन करते हैं।
- issue: दूसरे उपवाक्य का संबंध
  choice: अत्याचार प्रभु और मनुष्यों दोनों के विरुद्ध अपराध है
  alternative: दोनों से अत्याचारपूर्ण अपराध निकलता है
  rationale: इब्रानी וּמִשְּׁנֵיהֶם מַעַל עֹשֶׁק अत्यंत संक्षिप्त और कुछ अस्पष्ट है। ‘दोनों के विरुद्ध’ पहले उपवाक्य के दो पक्षों से अर्थपूर्ण संबंध बनाता है और परमेश्वर को अत्याचार का स्रोत बताने जैसी कठिनता से बचता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण ज्ञान-वचन शैली। ‘घमण्ड’, ‘अत्याचार’ और ‘अपराध’ सामान्य पाठक के लिए सहज हैं। मुख्य पाठ में डैश ‘प्रभु और मनुष्यों—दोनों’ से ‘दोनों’ का संदर्भ स्पष्ट किया गया है।
