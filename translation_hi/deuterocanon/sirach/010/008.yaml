  text: Kingship passes from nation to nation because of violence and arrogance[a].
translation:
  language: hi
  text: राजसत्ता एक राष्ट्र से दूसरे राष्ट्र के हाथ में चली जाती है, हिंसा और घमण्ड के कारण।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी परम्परा: “राजसत्ता एक राष्ट्र से दूसरे राष्ट्र को सौंप दी जाती है, अन्याय, अत्याचार और धन के कारण।”'
    reason: textual_variant
lexical_decisions:
- source_word: מַלְכוּת
  choice: राजसत्ता
  rationale: यहाँ शब्द किसी भौगोलिक राज्य से अधिक राजकीय शासन या प्रभुत्व का बोध कराता है; आधुनिक हिन्दी में ‘राजसत्ता’ इस अमूर्त राजनीतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִגּוֹי אֶל גּוֹי
  choice: एक राष्ट्र से दूसरे राष्ट्र के हाथ में
  rationale: גוי का यहाँ राजनीतिक समुदाय या राष्ट्र अर्थ है। ‘के हाथ में’ जोड़ने से हिन्दी में सत्ता के हस्तांतरण का आशय स्पष्ट और स्वाभाविक होता है।
- source_word: תִּסֹּב
  choice: चली जाती है
  rationale: क्रिया का मूल भाव मुड़ने या एक ओर से दूसरी ओर जाने का है; इस प्रसंग में यह राजसत्ता के हस्तांतरण को दर्शाती है। ‘हाथ में चली जाती है’ हिन्दी का सहज प्रयोग है और कर्मवाच्य जैसा कठोर नहीं लगता।
- source_word: בִּגְלַל
  choice: के कारण
  rationale: यह कारण बताने वाला संबंधबोधक है; ‘के कारण’ स्पष्ट, सामान्य और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: חֲמַס
  choice: हिंसा
  rationale: इब्रानी शब्द हिंसा, हिंसक अन्याय या उत्पीड़न को सूचित कर सकता है। मूल पाठ को प्राथमिकता देते हुए ‘हिंसा’ उसका सबसे सीधा हिन्दी समतुल्य है।
- source_word: גַּאֲוָה
  choice: घमण्ड
  rationale: यह नैतिक दोष के रूप में गर्व, दर्प या अहंकार को दर्शाता है। ‘घमण्ड’ साधारण आधुनिक पाठक के लिए स्पष्ट है और ‘हिंसा’ के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: कारणों की इब्रानी और यूनानी सूचियों में अंतर
  choice: मुख्य पाठ में इब्रानी के दो कारण—‘हिंसा और घमण्ड’—रखे गए हैं।
  alternative: यूनानी परम्परा में ‘अन्याय, अत्याचार और धन’ तीन कारण हैं।
  rationale: उपलब्ध इब्रानी पाठ उच्च-विश्वसनीयता वाला और सत्यापित है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी पाठ की विस्तृत और भिन्न सूची वास्तविक पाठांतर है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और नीतिवचन-सदृश रखी गई है। ‘राजसत्ता’ राजनीतिक शासन के अमूर्त अर्थ को व्यक्त करता है; ‘एक राष्ट्र से दूसरे राष्ट्र के हाथ में चली जाती है’ औपचारिकता और सहज पठनीयता के बीच संतुलन रखता है।
