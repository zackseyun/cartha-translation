  text: God erased the traces of nations[b][a], and their root to the very ground.
translation:
  language: hi
  text: परमेश्वर ने राष्ट्रों के पदचिह्न मिटा दिए, और उनकी जड़ धरती की सबसे निचली तह तक मिटा दी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “प्रभु ने राष्ट्रों की जड़ें उखाड़ दीं और उनके स्थान पर दीन लोगों को रोप दिया।” इब्रानी साक्ष्य इसके बजाय राष्ट्रों के “पदचिह्न” मिटाने और उनकी “जड़” को धरती की सबसे निचली तह तक मिटा देने की बात करता है।'
    reason: alternative_reading
  - marker: b
    text: “सबसे निचली तह” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है। इसका अर्थ जमीन की गहराई, सबसे निचला तल या आधार हो सकता है; प्रसंग में भाव पूरी तरह जड़ मिटा देने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  choice: पदचिह्न
  rationale: यह शब्द एड़ी, कदम या उनके निशान से जुड़ा है। ‘पदचिह्न’ इब्रानी के ठोस बिंब को बनाए रखता है और यहाँ राष्ट्रों के हर निशान को मिटा देने का भाव देता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ अर्थ विभिन्न जातीय-राजनीतिक समुदायों या राष्ट्रों का है; ‘अन्यजातियों’ कहने से बाद की धार्मिक श्रेणी अनावश्यक रूप से आ सकती है।
- source_word: טִמְטֵם
  choice: मिटा दिए / मिटा दी
  rationale: क्रिया पूरी तरह मिटाने या नामोनिशान दूर करने का भाव रखती है। हिन्दी में लिंग के अनुसार इसे दोनों कर्मों के साथ दोहराना वाक्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी पाठ में सामान्य ईश्वरीय पद אֱלֹהִים है; इसलिए यूनानी के ‘प्रभु’ से सामंजस्य नहीं किया गया।
- source_word: וְשָׁרְשָׁם
  choice: और उनकी जड़
  rationale: इब्रानी में ‘जड़’ एकवचन में सामूहिक अर्थ रखती है। एकवचन बनाए रखने से स्रोत का रूप और पूर्ण विनाश का बिंब दोनों सुरक्षित रहते हैं।
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: धरती की सबसे निचली तह तक
  rationale: यह दुर्लभ अभिव्यक्ति जमीन की चरम गहराई या तल तक पहुँचने का भाव देती है। यह अनिश्चित शब्द को अत्यधिक विशिष्ट ‘आधारशिला’ मानने के बजाय गहराई और समग्रता को व्यक्त करती है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों के बिंबों में अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी के ‘पदचिह्न’, ‘परमेश्वर’ और जड़ को धरती की गहराई तक मिटाने वाले बिंब को रखा गया।
  alternative: 'यूनानी पाठ: ‘प्रभु ने राष्ट्रों की जड़ें उखाड़ दीं और उनके स्थान पर दीन लोगों को रोप दिया।’'
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य प्राथमिक है। यूनानी पाठ समान न्याय-विषय की पुष्टि करता है, पर उसकी दूसरी पंक्ति और शब्दावली स्पष्ट रूप से भिन्न है; इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भाषा रखी गई है। ‘पदचिह्न’ और ‘जड़’ जैसे ठोस इब्रानी बिंब सुरक्षित हैं। क्रिया की पुनरावृत्ति हिन्दी में स्पष्टता के लिए की गई है, जबकि दुर्लभ अंतिम शब्द की अनिश्चितता पादटिप्पणी में बताई गई है।
