  yaml_path: translation/deuterocanon/sirach/010/018.yaml
  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: hi
  text: घमण्ड और ढिठाई मनुष्य को शोभा नहीं देते[a], स्त्री से जन्मे जन को तो और भी नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानान्तर पाठ: “अहंकार मनुष्यों के लिए रचा नहीं गया, न क्रोधपूर्ण रोष स्त्रियों से जन्मे लोगों के लिए।” इसके विपरीत, इब्रानी साक्ष्य में “घमण्ड और ढिठाई ... स्त्री से जन्मे जन को तो और भी नहीं” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: शोभा नहीं देते
  rationale: इब्रानी पद उपयुक्त या शोभनीय होने का भाव व्यक्त करता है। हिन्दी में यह प्रयोग स्वाभाविक ढंग से नैतिक अनुपयुक्तता दर्शाता है और यूनानी पाठ के ‘रचा नहीं गया’ को मुख्य पाठ में नहीं लाता।
- source_word: לֶאֱנוֹשׁ
  choice: मनुष्य को
  rationale: אֱנוֹשׁ यहाँ नश्वर मानव को सूचित करता है; ‘मनुष्य’ प्रतिनिधिक एकवचन और सार्वभौमिक अर्थ दोनों बनाए रखता है।
- source_word: זָדוֹן
  choice: घमण्ड
  rationale: यह शब्द अभिमानी और धृष्ट आत्मोन्नति का बोध कराता है। ‘घमण्ड’ साधारण आधुनिक हिन्दी में स्पष्ट है और अगले शब्द से अलग भी रहता है।
- source_word: וְעַזוּת
  choice: ढिठाई
  rationale: यह निर्लज्ज दुस्साहस या उद्दण्ड कठोरता को व्यक्त करता है। ‘ढिठाई’ उसके बाहरी, निर्लज्ज व्यवहारगत पक्ष को स्वाभाविक हिन्दी में सामने लाती है।
- source_word: אַף
  choice: तो और भी नहीं
  rationale: यहाँ אַף अगले वाक्यांश में कथन को उत्कर्ष देता है। ‘तो और भी नहीं’ हिन्दी में ‘much less’ का स्वाभाविक तुलनात्मक बल व्यक्त करता है।
- source_word: לִילוּד אִשָּׁה
  choice: स्त्री से जन्मे जन को
  rationale: यह इब्रानी अभिव्यक्ति जन्म, नश्वरता और मानवीय सीमितता पर बल देती है। यह अनुवाद किसी विशेष पुरुष की अपेक्षा मानव-संतान के व्यापक संकेत को बनाए रखता है।
theological_decisions:
- issue: इब्रानी मुख्य पाठ और यूनानी समानान्तर पाठ का सम्बन्ध
  choice: मुख्य पाठ में इब्रानी के ‘शोभा नहीं देते’ और ‘ढिठाई’ का अनुवाद
  alternative: ‘अहंकार मनुष्यों के लिए रचा नहीं गया, न क्रोधपूर्ण रोष स्त्रियों से जन्मे लोगों के लिए।’
  rationale: उपलब्ध इब्रानी साक्ष्य उच्च-विश्वसनीय और सत्यापित है, इसलिए उसे प्राथमिकता दी गई है। यूनानी में विधेय और दूसरे दुर्गुण दोनों भिन्न हैं; इस महत्वपूर्ण भिन्नता को पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में मिलाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और नीतिवचन-सदृश लहजा रखा गया है। ‘मनुष्य’ तथा ‘स्त्री से जन्मे जन’ मूल की नश्वर मानवता की ओर संकेत करने वाली अभिव्यक्ति को बनाए रखते हैं।
