base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/022.yaml
  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: hi
  text: प्रवासी, बाहरी, परदेशी और निर्धन व्यक्ति—इनका गौरव परमेश्वर का भय मानना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “किसी बुद्धिमान निर्धन व्यक्ति का अपमान करना उचित नहीं, और किसी पापी मनुष्य की महिमा करना शोभा नहीं देता।” यहाँ इब्रानी और यूनानी पाठों में बहुत बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: प्रवासी
  rationale: यह शब्द ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो किसी समुदाय के बीच आकर रहता है; ‘प्रवासी’ इस स्थायी या अर्ध-स्थायी निवास के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְזָר
  choice: बाहरी
  rationale: זָר सामान्य सामाजिक, पारिवारिक या सामुदायिक दायरे से बाहर के व्यक्ति को सूचित करता है। ‘बाहरी’ इसे अगले נָכְרִי से अलग रखता है।
- source_word: נָכְרִי
  choice: परदेशी
  rationale: यह दूसरे देश या जातीय समुदाय से आए व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक पाठक के लिए स्पष्ट है और ‘बाहरी’ से अर्थगत भेद बनाए रखता है।
- source_word: וָרָשׁ
  choice: और निर्धन व्यक्ति
  rationale: רָשׁ का अर्थ गरीब या साधनहीन व्यक्ति है। ‘निर्धन व्यक्ति’ मूल के एकवचन और गरिमापूर्ण शैली दोनों को बनाए रखता है।
- source_word: תִּפְאֶרֶת
  choice: गौरव
  rationale: इस संज्ञा में शोभा, महिमा और सम्मान का भाव है; यहाँ ‘गौरव’ बताता है कि सामाजिक रूप से उपेक्षित व्यक्ति को वास्तविक प्रतिष्ठा किससे मिलती है।
- source_word: יִרְאַת אֱלֹהִים
  choice: परमेश्वर का भय मानना
  rationale: यह प्रज्ञा-साहित्य का प्रचलित पद है, जिसका आशय श्रद्धामय भय और भक्तिपूर्ण आदर है। क्रियात्मक हिन्दी ‘भय मानना’ पारंपरिक अर्थ और स्वाभाविक अभिव्यक्ति दोनों बनाए रखती है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद किया गया और यूनानी पाठ को पाद-टिप्पणी में रखा गया।
  alternative: 'यूनानी: “किसी बुद्धिमान निर्धन व्यक्ति का अपमान करना उचित नहीं, और किसी पापी मनुष्य की महिमा करना शोभा नहीं देता।”'
  rationale: सीराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी जानी चाहिए। फिर भी यूनानी पाठ का अर्थ पूरी तरह भिन्न होने के कारण उसे छिपाने के बजाय स्पष्ट रूप से पाद-टिप्पणी में देना आवश्यक है।
- issue: יִרְאַת אֱלֹהִים में ‘भय’ और ‘श्रद्धा’ का संबंध
  choice: ‘परमेश्वर का भय मानना’
  alternative: ‘परमेश्वर के प्रति श्रद्धा’
  rationale: ‘भय’ मूल शब्द की तीव्रता और प्रज्ञा-परंपरा की स्थापित धार्मिक अभिव्यक्ति को सुरक्षित रखता है; केवल ‘श्रद्धा’ कहने से मूल की अर्थगत व्यापकता घट सकती थी।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रवासी’, ‘बाहरी’ और ‘परदेशी’ के द्वारा मूल इब्रानी के तीन निकटवर्ती, पर अलग सामाजिक पदों का भेद यथासंभव सुरक्षित रखा गया है।
