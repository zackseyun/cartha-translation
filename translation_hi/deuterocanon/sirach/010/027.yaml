  text: Better is one who works and has abundant wealth than one who honors himself and lacks food[a].
translation:
  language: hi
  text: काम करने और बहुत धन रखनेवाला व्यक्ति उस व्यक्ति से बेहतर है जो अपनी बड़ाई करता है और भोजन से वंचित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्ष्य में है: “हे पुत्र, नम्रता से अपने प्राण का गौरव कर और उसकी योग्यता के अनुसार उसका सम्मान कर।” यहाँ इब्रानी और यूनानी पाठों में बहुत बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: बेहतर है
  rationale: नीतिवचन की तुलनात्मक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עוֹבֵד
  choice: काम करनेवाला
  rationale: यहाँ עבד का अर्थ श्रम या काम करना है; ‘दास’ या ‘सेवक’ कहने से अनावश्यक सामाजिक अर्थ जुड़ सकता है।
- source_word: וְיוֹתֵר הוֹן
  choice: और बहुत धन रखनेवाला
  rationale: इब्रानी पदबंध संक्षिप्त है; יותר और הון मिलकर धन की प्रचुरता का संकेत देते हैं। यह अनुवाद आर्थिक विपुलता और आगे आनेवाली अभाव की स्थिति के विरोध को स्पष्ट रखता है।
- source_word: מִמִּתְכַּבֵּד
  choice: जो अपना ही सम्मान करता है
  rationale: हित्पएल रूप आत्म-सम्मान या आत्म-महिमा का भाव देता है, न कि केवल दूसरों से सम्मान पाने का।
- source_word: וַחֲסַר
  choice: पर ... से वंचित है
  rationale: शाब्दिक संयोजक ‘और’ है, किंतु हिन्दी में विरोध को स्पष्ट और स्वाभाविक बनाने के लिए ‘पर’ उपयुक्त है।
- source_word: מַתָּן
  choice: भोजन
  rationale: शब्द का रूप ‘दान/उपहार’ का अर्थ भी सुझा सकता है, पर धन और अभाव के इस नीतिवचनात्मक संदर्भ में मूल आवश्यक आहार या जीविका अधिक संगत है।
theological_decisions:
- issue: सिराख 10:27 में इब्रानी और यूनानी पाठों का बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी साक्ष्य: “मेरे बच्चे, नम्रता के साथ अपने प्राण को महिमा दे और उसकी योग्यता के अनुसार उसे सम्मान दे।”'
  rationale: सिराख का इब्रानी पाठ जहाँ उपलब्ध है, वहाँ उसे प्राथमिकता दी गई है; फिर भी यूनानी पाठ का अर्थ पूरी तरह भिन्न होने के कारण उसे महत्वपूर्ण वैकल्पिक पाठ के रूप में पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन के अनुरूप संक्षिप्त रखी गई है। ‘अपना ही सम्मान करता है’ आत्म-महत्त्व के भाव को सीधे व्यक्त करता है, जबकि पाद-टिप्पणी पाठ-परंपराओं के गंभीर अंतर को स्पष्ट करती है।
