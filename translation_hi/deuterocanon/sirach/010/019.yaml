base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/019.yaml
  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: hi
  text: 'किस प्रकार की संतान आदरणीय है? मनुष्य की संतान।[a]

    किस प्रकार की संतान आदरणीय है? वे जो परमेश्वर का भय मानते हैं।[b]

    किस प्रकार की संतान आदरणीय है? वे जो आज्ञा का पालन करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर की अंतिम पंक्ति है: “किस प्रकार की संतान अनादरणीय है? मनुष्य की संतान।” इसके स्थान पर इब्रानी पाठ में है: “किस प्रकार की संतान आदरणीय है? वे जो आज्ञा का पालन करते हैं।”'
    reason: textual_variant
  - marker: b
    text: यूनानी में “वे जो प्रभु का भय मानते हैं” है; इब्रानी में “वे जो परमेश्वर का भय मानते हैं” है।
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: संतान
  rationale: यह शब्द यहाँ सामूहिक अर्थ में संतति या वंशजों को दर्शाता है। ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है और तीनों पंक्तियों में दोहराए गए मूल शब्द को बनाए रखता है; ‘बीज’ अत्यधिक शाब्दिक और ‘वंश’ अपेक्षाकृत संकीर्ण वंशावलीगत अर्थ दे सकता है।
- source_word: נִכְבָּד / ἔντιμον
  choice: आदरणीय
  rationale: मूल शब्द सम्मान और प्रतिष्ठा के योग्य होने का भाव रखता है। ‘आदरणीय’ इस नीतिवचनात्मक संदर्भ में स्वाभाविक है और कुलीन जन्म का भ्रामक संकेत नहीं देता।
- source_word: מַה / ποῖον
  choice: किस प्रकार की
  rationale: प्रश्न किसी विशेष व्यक्ति की पहचान नहीं, बल्कि एक नैतिक श्रेणी पूछता है। ‘किस प्रकार की’ इस वर्गीकरणात्मक बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: मनुष्य की
  rationale: यह अभिव्यक्ति समस्त मानवता के सामान्य अर्थ को व्यक्त करती है, न कि केवल पुरुष को। ‘मनुष्य की संतान’ मूल के संबंधवाचक रूप को बनाए रखती है।
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: वे जो परमेश्वर का भय मानते हैं
  rationale: मुख्य पाठ उपलब्ध इब्रानी ‘परमेश्वर का भय मानने वाला’ का अनुसरण करता है। बहुवचन ‘वे जो’ सामूहिक ‘संतान’ को स्वाभाविक हिन्दी में खोलता है।
- source_word: שׂוֹמֵר מִצְוָה
  choice: वे जो आज्ञा का पालन करते हैं
  rationale: ‘पालन करना’ שׁמר के आज्ञापालन-संबंधी भाव को वर्तमान हिन्दी में स्पष्ट करता है। ‘आज्ञा’ का एकवचन मूल इब्रानी מִצְוָה के एकवचन को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी में अंतिम पंक्ति का प्रमुख पाठांतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी के अनुसार ‘वे जो आज्ञा का पालन करते हैं’
  alternative: 'यूनानी: ‘किस प्रकार की संतान अनादरणीय है? मनुष्य की संतान।’'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत है और यहाँ तीसरी सकारात्मक उक्ति देता है। यूनानी का विरोधात्मक अंतिम वाक्य अर्थ की दृष्टि से महत्वपूर्ण है, इसलिए उसे पादटिप्पणी में स्पष्ट रूप से रखा गया है।
- issue: इब्रानी אֱלֹהִים और यूनानी κύριον में ईश-नाम का पाठांतर
  choice: मुख्य पाठ में ‘परमेश्वर’
  alternative: यूनानी के अनुसार ‘प्रभु’
  rationale: उपलब्ध इब्रानी पाठ ‘परमेश्वर’ पढ़ता है; यूनानी समानांतर ‘प्रभु’ देता है। मुख्य पाठ इब्रानी का अनुसरण करता है और यूनानी पाठ को पादटिप्पणी में सुरक्षित रखता है।
- issue: दूसरी और तीसरी पंक्ति में प्रश्नसूचक संरचना का विस्तार
  choice: तीनों उक्तियों में ‘किस प्रकार की संतान आदरणीय है?’ की पुनरावृत्ति
  alternative: 'दूसरी और तीसरी पंक्ति को नाममात्र कथन मानना: ‘आदरणीय संतान वह है जो...’'
  rationale: इब्रानी में दूसरी और तीसरी पंक्ति संक्षिप्त/अध्याहृत हैं, जबकि पहली पंक्ति का प्रश्नवाचक ढाँचा और यूनानी समानांतर दूसरी उक्ति में उसी प्रश्न की पुनरावृत्ति दिखाते हैं। हिन्दी में प्रश्न को दोहराने से नीतिवचन की अलंकारिक समानता स्पष्ट होती है, बिना उत्तर की विषयवस्तु बदले।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु नीतिवचन के अनुरूप गरिमापूर्ण और संक्षिप्त रखी गई है। ‘संतान’, ‘आदरणीय’, ‘परमेश्वर का भय मानना’ और ‘आज्ञा का पालन करना’ सामान्य पाठकों के लिए बोधगम्य हैं तथा मूल की तीनfold पुनरावृत्ति को बनाए रखते हैं।
