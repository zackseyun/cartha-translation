  yaml_path: translation/deuterocanon/sirach/010/009.yaml
  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
translation:
  language: hi
  text: धूल और राख क्यों घमंड करे,[a] जबकि अपने जीवन में उसका शरीर ऊँचा उठाया जाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में पद का अन्तिम खण्ड कठिन है। यूनानी समानान्तर पाठ है, “क्योंकि जीवन में मैंने उसकी अंतड़ियाँ बाहर फेंक दीं,” जो मनुष्य के शरीर के क्षय और उसकी नश्वरता पर बल देता है। सम्भव है कि हिब्रू भी शरीर के अपमान या नश्वरता की ओर संकेत करता हो।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יִּגְאֶה
  choice: क्यों घमण्ड करे
  rationale: प्रश्नवाचक מַה यहाँ फटकार का भाव देता है, और גאה आत्म-उन्नति तथा घमण्ड को व्यक्त करता है। हिन्दी में यह संयोजन स्वाभाविक और अर्थ-सटीक है।
- source_word: עָפָר וָאֵפֶר
  choice: धूल और राख
  rationale: यह मनुष्य की क्षुद्रता और नश्वरता का स्थापित बाइबलीय युग्म है।
- source_word: אֲשֶׁר בְּחַיָּיו
  choice: जबकि उसके जीवन में
  rationale: अन्तिम उपवाक्य कठिन है। 'जबकि' परिस्थितिजन्य या विरोधाभासी सम्बन्ध बनाए रखता है और अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: יוּרַם
  choice: ऊँचा उठाया जाता है
  rationale: रום के हौफ़अल रूप का निष्क्रिय अर्थ सुरक्षित रहता है और पहले खण्ड की ऊँचा होने की छवि भी बनी रहती है।
- source_word: גִּוְיוֹ
  choice: उसका शरीर
  rationale: यह शब्द शरीर अथवा शव का बोध करा सकता है। यहाँ 'शरीर' सबसे कम व्याख्यात्मक विकल्प है; पाठान्तर की कठिनाई पादटिप्पणी में दी गई है।
theological_decisions:
- issue: कठिन अन्तिम उपवाक्य में हिब्रू और यूनानी साक्ष्य का सम्बन्ध
  choice: मुख्य पाठ में उपलब्ध हिब्रू को आधार बनाकर उसके अस्पष्ट रूप को बनाए रखना
  alternative: 'यूनानी के अनुसार अनुवाद करना: ‘क्योंकि जीवन में मैंने उसकी अंतड़ियाँ बाहर फेंक दीं’'
  rationale: हिब्रू पाठ उपलब्ध है, इसलिए उसे प्राथमिकता दी गई है; पर उसका अन्तिम खण्ड कठिन और यूनानी से बहुत भिन्न है। यूनानी साक्ष्य को पादटिप्पणी में देकर शारीरिक क्षय और नश्वरता की सम्भावित पृष्ठभूमि सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘घमण्ड करे’ आलंकारिक आत्म-उन्नति को सहज हिन्दी में व्यक्त करता है; कठिन पाठ को मुख्य वाक्य में सुलझाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
