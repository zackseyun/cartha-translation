  text: In the hand of God is the rule of every man, and before the lawgiver he sets his splendor.
translation:
  language: hi
  text: हर पुरुष का शासन परमेश्वर के हाथ में है, और वह विधानकर्ता के सामने अपना वैभव[b] रखता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ है: “पृथ्वी का अधिकार प्रभु के हाथ में है, और उचित समय पर वह उसके ऊपर एक उपयोगी व्यक्ति को उठाएगा।” यूनानी पाठ की दूसरी पंक्ति बहुत भिन्न है और संभवतः किसी भिन्न इब्रानी मूल-पाठ या बाद की व्याख्यात्मक परंपरा को दर्शाती है।'
    reason: alternative_reading
  - marker: b
    text: या “अपना प्रताप,” “अपनी महिमा,” अथवा “अपना सम्मान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह इब्रानी रूपक नियंत्रण या अधिकार को व्यक्त करता है। हिन्दी में ‘के हाथ में’ रूपक और अर्थ दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी पाठ में אֱלֹהִים है, YHWH नहीं; इसलिए इसे ‘प्रभु’ के बजाय ‘परमेश्वर’ किया गया है।
- source_word: מֶמְשֶׁלֶת
  choice: शासन
  rationale: इस संज्ञा का अर्थ शासन करने की शक्ति, प्रभुत्व या अधिकार है। प्रसंग में ‘शासन’ संक्षिप्त और स्वाभाविक है।
- source_word: כָּל גֶּבֶר
  choice: हर पुरुष
  rationale: גֶּבֶר यहाँ व्याकरणिक और अर्थगत रूप से पुरुषवाचक है; ‘हर पुरुष’ मूल की विशिष्टता को बनाए रखता है।
- source_word: מְחוֹקֵק
  choice: विधानकर्ता
  rationale: यह शब्द उस व्यक्ति को दर्शाता है जो विधि ठहराता या आदेश देता है। ‘विधानकर्ता’ मूल के ‘lawgiver/legislator’ अर्थ को गरिमापूर्ण और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: יָשִׁית
  choice: रखता है
  rationale: שׂים का मूल अर्थ रखना, स्थापित करना या ठहराना है। ‘रखता है’ यहाँ अनावश्यक व्याख्या जोड़े बिना क्रिया का सीधा अर्थ देता है।
- source_word: הוֹדוֹ
  choice: उसका वैभव
  rationale: הוֹד वैभव, प्रताप, महिमा या सम्मान को दर्शा सकता है। ‘वैभव’ ऊँचे राजकीय भाव को बनाए रखता है और प्रत्यय के लिए ‘उसका’ मूल की सर्वनामगत अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की प्रभुता और मानवीय राजनीतिक शासन का संबंध
  choice: पद यह कहता है कि प्रत्येक पुरुष का शासन परमेश्वर के हाथ में है, पर यह स्पष्ट नहीं करता कि परमेश्वर हर शासक को किस रीति से नियुक्त करता है।
  alternative: यूनानी समानांतर के आधार पर इसे पृथ्वी पर प्रभु के अधिकार और उचित समय पर उपयोगी शासक को उठाने के अधिक विशिष्ट कथन के रूप में पढ़ना।
  rationale: प्राथमिक इब्रानी पाठ मानवीय शासन पर परमेश्वर के नियंत्रण की पुष्टि करता है, किंतु नियुक्ति की प्रक्रिया का विस्तृत सिद्धांत नहीं देता। इसलिए उससे अधिक विशिष्ट धर्मवैचारिक निष्कर्ष अनुवाद में नहीं जोड़ा गया।
- issue: दूसरी पंक्ति में सर्वनामों के संदर्भ
  choice: ‘वह उसका वैभव’ द्वारा कर्ता और संबंधसूचक सर्वनाम की मूल अस्पष्टता को बनाए रखा गया है।
  alternative: सर्वनामों को स्पष्ट करके परमेश्वर, प्रत्येक पुरुष या विधानकर्ता में से किसी एक को निश्चित संदर्भ देना।
  rationale: संक्षिप्त इब्रानी वाक्य में संदर्भ पूरी तरह स्पष्ट नहीं है। किसी एक व्याख्या को मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए बोधगम्य स्तर रखा गया है। ‘के हाथ में’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है। ‘विधानकर्ता’ राजनीतिक-विधायी प्रसंग को व्यक्त करता है। दूसरी पंक्ति की सर्वनामगत अस्पष्टता जानबूझकर नहीं सुलझाई गई है।
