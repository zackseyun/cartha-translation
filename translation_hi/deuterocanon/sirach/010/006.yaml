base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/006.yaml
  text: For any offense[a], do not repay your neighbor with evil, and do not walk in the way of pride.
translation:
  language: hi
  text: किसी भी अपराध के लिए[a] अपने पड़ोसी को बुराई न लौटाओ, और घमंड की राह पर मत चलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “किसी भी अन्याय पर अपने पड़ोसी पर क्रोधित मत हो,” जो बुराई लौटाने के बजाय क्रोध या वैमनस्य पर बल देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: किसी भी अपराध के कारण
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘हर/किसी भी अपराध में या उसके कारण’ है। निषेधात्मक वाक्य में यह रूप स्वाभाविक हिन्दी में उस सार्वभौमिक भाव को बनाए रखता है कि कोई भी अपराध प्रतिशोध का आधार न बने।
- source_word: אַל תְּשַׁלֵּם רַע
  choice: बुराई का बदला मत दो
  rationale: पिएल रूप תְּשַׁלֵּם यहाँ प्रतिदान या बदला देने का भाव रखता है। यह अनुवाद इब्रानी में निहित प्रतिशोध की धारणा को स्पष्ट रखता है, जबकि यूनानी पाठ क्रोध या वैमनस्य पर बल देता है।
- source_word: לְרֵעַ
  choice: अपने पड़ोसी को
  rationale: רֵעַ निकट संबंध वाले व्यक्ति, साथी या पड़ोसी को सूचित कर सकता है। ‘अपने पड़ोसी’ सामान्य पाठक के लिए परिचित है और यूनानी τῷ πλησίον से भी मेल खाता है।
- source_word: וְאַל תִּהֲלַךְ
  choice: और ... मत चलो
  rationale: הלך का मूल अर्थ ‘चलना’ है और ज्ञान-साहित्य में यह आचरण का रूपक भी है। हिन्दी में ‘राह पर चलना’ इस रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: घमण्ड की राह पर
  rationale: דֶּרֶךְ जीवन या आचरण की राह का रूपक है, और גַּאֲוָה घमण्ड, अहंकार या दर्प को व्यक्त करता है। यह चयन संक्षिप्त, गरिमापूर्ण और सहज है।
theological_decisions:
- issue: पहले निषेध में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में इब्रानी के अनुसार प्रतिशोधात्मक बुराई का निषेध रखा गया है।
  alternative: 'यूनानी के अनुसार: ‘किसी भी अन्याय के कारण अपने पड़ोसी से क्रोधित/रुष्ट मत हो।’'
  rationale: उपलब्ध उच्च-विश्वसनीयता वाला इब्रानी पाठ स्पष्ट रूप से बुराई का बदला देने से रोकता है, इसलिए वही मुख्य पाठ का आधार है। यूनानी पाठ उससे संबंधित किंतु भिन्न रूप से क्रोध या वैमनस्य पर बल देता है; इस अंतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यीय शैली अपनाई गई है। ‘घमण्ड की राह पर चलना’ मूल इब्रानी रूपक को सहज हिन्दी में बनाए रखता है।
