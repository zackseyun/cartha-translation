  yaml_path: translation/deuterocanon/sirach/010/023.yaml
  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
translation:
  language: hi
  text: समझदार निर्धन को तुच्छ नहीं समझना चाहिए,[a] और ऊँचा उठाए गए अन्यायी का सम्मान नहीं करना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-परंपरा में यहाँ बहुत भिन्न वचन मिलता है: “एक महान व्यक्ति, न्यायाधीश और शासक का सम्मान होगा, पर उनमें से कोई भी प्रभु का भय मानने वाले से बड़ा नहीं है।” मुख्य पाठ के पीछे का इब्रानी साक्ष्य इसके बजाय यह नैतिक शिक्षा देता है कि समझदार निर्धन को तुच्छ न समझें और ऊँचा उठाए गए अन्यायी का सम्मान न करें।'
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: तुच्छ न समझना चाहिए
  rationale: אֵין के साथ infinitive यहाँ सूक्तिपरक निषेध या अनुचितता व्यक्त करता है। हिंदी में ‘न ... चाहिए’ इस ज्ञान-साहित्यिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דַּל
  choice: निर्धन
  rationale: דַּל आर्थिक अभाव, दुर्बलता या निम्न सामाजिक स्थिति वाले व्यक्ति को दर्शा सकता है। यहाँ सम्मान और सामाजिक प्रतिष्ठा के विरोध में ‘निर्धन’ सटीक और सहज है।
- source_word: מַשְׁכִּיל
  choice: समझदार
  rationale: מַשְׁכִּיל समझ-बूझ और विवेक रखने वाले व्यक्ति को दर्शाता है। ‘समझदार’ आधुनिक हिंदी में स्वाभाविक है और गरीबी तथा वास्तविक समझ के बीच निहित विरोध को बनाए रखता है।
- source_word: לְכַבֵּד
  choice: सम्मान करना
  rationale: पिएल रूप में כבד का सामान्य अर्थ आदर या सम्मान देना है। ‘सम्मान करना’ हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: עַוָּל
  choice: अन्यायी
  rationale: עַוָּל अन्याय या अधर्म करने वाले व्यक्ति को दर्शाता है। ‘अन्यायी’ उसके नैतिक चरित्र को व्यक्त करता है, बिना अर्थ को अनावश्यक रूप से बढ़ाए।
- source_word: אֲשֶׁר הוּרָם
  choice: ऊँचे पद पर पहुँचाए गए
  rationale: निष्क्रिय क्रिया सामाजिक रूप से ऊपर उठाए या प्रतिष्ठित किए जाने की ओर संकेत करती है। ‘ऊँचे पद पर पहुँचाए गए’ हिंदी में इस निष्क्रियता और दर्जे की उन्नति दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: इब्रानी पाठ और अत्यंत भिन्न यूनानी पाठ-परंपरा के बीच चयन
  choice: मुख्य पाठ में उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी कथन का सीधा अनुवाद किया गया है।
  alternative: 'यूनानी परंपरा: “एक महान व्यक्ति, न्यायी और शासक का सम्मान होगा, पर उनमें से कोई भी प्रभु का भय मानने वाले से बड़ा नहीं है।”'
  rationale: इस स्थान पर उपलब्ध इब्रानी साक्ष्य को मुख्य आधार बनाया गया है। फिर भी यूनानी पाठ का अर्थ बिल्कुल भिन्न है, इसलिए इस महत्वपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है, न कि चुपचाप समन्वित या निरस्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘समझदार निर्धन’ सामाजिक स्थिति और समझ के विरोध को संक्षेप में बनाए रखता है; दूसरे खंड की समानांतर निषेधात्मक रचना भी सुरक्षित है।
