  text: He swept them from the earth and uprooted them[a], and he made their memory cease from the earth.
translation:
  language: hi
  text: उसने उन्हें धरती से बुहार दिया[a] और उखाड़ फेंका, और धरती से उनकी स्मृति मिटा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू וְסִחָם का अर्थ निश्चित नहीं है; यूनानी समानांतर पाठ उन्हें हटा देने या पूरी तरह मिटा देने के अर्थ का समर्थन करता है। वैकल्पिक अनुवाद: “उसने उन्हें धरती से मिटा दिया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: उसने उन्हें ... बुहारकर
  rationale: यह हिब्रू रूप कठिन और कुछ अनिश्चित है। यूनानी समानांतर पाठ पूर्ण विनाश या हटा दिए जाने के अर्थ की पुष्टि करता है। ‘बुहारकर’ मूल की सजीवता बनाए रखते हुए बलपूर्वक हटाने का भाव देता है।
- source_word: מֵאֶרֶץ
  choice: धरती से
  rationale: אֶרֶץ का अर्थ ‘देश’ या ‘धरती’ हो सकता है। दोनों पंक्तियों में व्यापक उन्मूलन का भाव और यूनानी γῆ ‘धरती’ के समर्थन के कारण ‘धरती’ चुना गया है।
- source_word: וַיִּתְּשֵׁם
  choice: उखाड़ फेंका
  rationale: נתשׁ जड़ से खींच निकालने या उखाड़ने का बिंब देता है। ‘उखाड़ फेंका’ आधुनिक हिन्दी में सम्पूर्ण और बलपूर्वक निष्कासन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּשְׁבֵּת
  choice: मिटा दी
  rationale: שׁבת के हिफ़ील रूप का अर्थ किसी चीज़ को समाप्त कर देना है। ‘स्मृति’ के साथ ‘मिटा दी’ स्वाभाविक हिन्दी है और स्मरण के पूरी तरह समाप्त होने का भाव रखता है।
- source_word: זִכְרָם
  choice: उनकी स्मृति
  rationale: ‘स्मृति’ आधुनिक, गरिमापूर्ण और सहज शब्द है; यहाँ यह उनके याद किए जाने या उनके शेष नाम के मिट जाने को व्यक्त करता है।
