base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/029.yaml
  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: hi
  text: जो अपने आप को दोषी ठहराता है, उसे कौन निर्दोष ठहराएगा?[a] और जो अपना ही अनादर करता है, उसका आदर कौन करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ-साक्ष्य में है: “निर्धन मनुष्य अपने ज्ञान के कारण आदर पाता है, और धनी मनुष्य अपने धन के कारण आदर पाता है।” यहाँ इब्रानी और यूनानी पाठों में मूलतः अलग-अलग कथन सुरक्षित हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: दोषी ठहराता है
  rationale: רשע के हिफ़ील रूप का न्यायिक अर्थ ‘दोषी ठहराना’ है। नַפְשׁוֹ के साथ यह अपने ही विरुद्ध ऐसा निर्णय देने का भाव रखता है।
- source_word: נַפְשׁוֹ
  choice: अपने आप को / अपना ही
  rationale: נפש यहाँ दोनों खंडों में प्रतिवाचक अर्थ में ‘स्वयं’ को सूचित करता है। ‘प्राण’ या ‘आत्मा’ हिंदी में अनावश्यक रूप से आध्यात्मिक अर्थ जोड़ सकता है।
- source_word: יַצְדִיקֶנּוּ
  choice: उसे निर्दोष ठहराएगा
  rationale: צדק के हिफ़ील का न्यायिक भाव सुरक्षित रखते हुए यह आधुनिक हिंदी में स्वाभाविक है और पहले खंड के ‘दोषी ठहराता’ के साथ स्पष्ट विरोध बनाता है।
- source_word: יְכַבֵּד
  choice: आदर करेगा
  rationale: כבד के पिएल का सामान्य अर्थ ‘आदर करना’ है; यह सामाजिक प्रतिष्ठा के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מַקְלֶה
  choice: अनादर करता है
  rationale: קלל से बना यह रूप किसी को हल्का समझने अथवा उसका अनादर करने का भाव देता है। ‘अनादर’ יְכַבֵּד के साथ सीधा और प्रभावी विरोध बनाए रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी वचन का अनुवाद
  alternative: 'यूनानी: “निर्धन मनुष्य अपने ज्ञान के कारण आदर पाता है, और धनी मनुष्य अपने धन के कारण आदर पाता है।”'
  rationale: इस स्थान पर इब्रानी पाठ उपलब्ध और उच्च विश्वास वाला है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। यूनानी में पूर्णतः भिन्न कहावत है; उसे समन्वित करने के बजाय महत्वपूर्ण वैकल्पिक पाठ-परंपरा के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। दोनों प्रश्नों का न्यायिक और सामाजिक समानांतरपन ‘दोषी/निर्दोष’ तथा ‘अनादर/आदर’ के विरोधों से सुरक्षित रखा गया है।
