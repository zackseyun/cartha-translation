base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/020.yaml
  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: hi
  text: किस प्रकार की संतान तुच्छ है? आज्ञा का उल्लंघन करनेवाले की संतान।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “आज्ञाओं का उल्लंघन करनेवाले लोग” (बहुवचन); इससे कठिन इब्रानी वाक्य-विन्यास स्पष्ट होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: संतान
  rationale: यहाँ זֶרַע वंश या संतान के सामूहिक अर्थ में है; ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है और एकवचन-सामूहिक भाव बनाए रखता है।
- source_word: נִקְלֶה
  choice: तुच्छ
  rationale: यह शब्द नीचा, अनादृत या कम मान का समझे जाने का भाव देता है; यूनानी ἄτιμον के ‘सम्मानरहित’ भाव से भी मेल खाता है।
- source_word: מַה
  choice: किस प्रकार की
  rationale: प्रश्न किसी विशिष्ट व्यक्ति की पहचान नहीं, बल्कि अलंकारिक वर्गीकरण करता है; इसलिए यह हिन्दी में प्रश्न का आशय स्पष्ट करता है।
- source_word: לֶאֱנוֹשׁ
  choice: करनेवाले की
  rationale: प्राप्त इब्रानी वाक्यांश कठिन है। मानव-संदर्भ को अगले पदबंध और यूनानी समानांतर की सहायता से स्वाभाविक हिन्दी संबंधवाचक रूप में व्यक्त किया गया है।
- source_word: עוֹבֵר
  choice: उल्लंघन करनेवाले
  rationale: מִצְוָה के साथ यह कृदंत आज्ञा को तोड़ने या उसका उल्लंघन करनेवाले व्यक्ति को दर्शाता है।
- source_word: מִצְוָה
  choice: आज्ञा
  rationale: इब्रानी का एकवचन सुरक्षित रखा गया है। ‘आज्ञा’ हिन्दी में धार्मिक और नैतिक-विधिक संदर्भ के लिए स्वाभाविक है।
theological_decisions:
- issue: दूसरे खंड में इब्रानी और यूनानी पाठ का अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी के एकवचन ‘आज्ञा’ को रखा गया और कठिन वाक्य-विन्यास को यूनानी समानांतर की सहायता से स्पष्ट किया गया।
  alternative: ‘आज्ञाओं का उल्लंघन करनेवाले लोग’—यूनानी बहुवचन का अधिक निकट अनुवाद।
  rationale: सिराख के उपलब्ध इब्रानी पाठ को प्राथमिकता दी गई है, पर उसकी कठिन संरचना को यूनानी पाठ से जाँचा गया है। पाठांतर को टिप्पणी में खुलकर बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। ‘करनेवाले’ को प्रचलित संयुक्त वर्तनी में रखा गया है।
