  text: The beginning of a man's pride is defiance[a], and his heart turns away from his Maker.
translation:
  language: hi
  text: मनुष्य के घमण्ड का आरम्भ ढिठाई है[a], और उसका हृदय अपने रचनेवाले से फिर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “मनुष्य के घमण्ड का आरम्भ उसका प्रभु से फिर जाना है, और उसका हृदय अपने रचनेवाले से दूर हो गया है।” पहले खंड में इब्रानी पाठ अधिक संक्षिप्त है; यहाँ मुख्य पाठ का अनुवाद इब्रानी साक्ष्य से किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: का आरम्भ
  rationale: रचना की नीतिवचन-जैसी संरचना बनाए रखते हुए इसका सीधा अर्थ ‘आरम्भ’ व्यक्त किया गया है।
- source_word: גְּאוֹן
  choice: घमण्ड
  rationale: यहाँ शब्द मनुष्य के नकारात्मक आत्म-अभिमान को दर्शाता है; ‘घमण्ड’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אָדָם
  choice: मनुष्य के
  rationale: इब्रानी एकवचन का आशय सामान्य मानव से है; ‘मनुष्य’ प्रतिनिधिक एकवचन और सार्वभौमिक अर्थ दोनों को बनाए रखता है।
- source_word: מוּעָז
  choice: ढिठाई
  rationale: यह शब्द उद्दण्ड, धृष्ट आत्म-दृढ़ता का भाव रखता है। ‘ढिठाई’ उस नैतिक नकारात्मकता को व्यक्त करती है, पर उस प्रभु को कर्म के रूप में नहीं जोड़ती जिसका इब्रानी में स्पष्ट उल्लेख नहीं है।
- source_word: וּמֵעֹשֶׂהוּ
  choice: अपने रचनेवाले से
  rationale: शाब्दिक अर्थ ‘उसके बनानेवाले से’ है। ‘रचनेवाला’ परमेश्वर के लिए सहज, गरिमापूर्ण हिन्दी है।
- source_word: יָסוּר לִבּוֹ
  choice: उसका हृदय ... फिर जाता है
  rationale: סור का अर्थ मुड़ना या दूर हो जाना है; यह हिन्दी प्रयोग हृदय के संबंध-विच्छेद की इब्रानी छवि बनाए रखता है।
theological_decisions:
- issue: क्या यूनानी समानांतर के अनुसार ढिठाई का लक्ष्य ‘प्रभु’ स्पष्ट किया जाए
  choice: मुख्य पाठ में इब्रानी का संक्षिप्त ‘ढिठाई’ रखा गया है; दूसरे खंड में रचनेवाले से विमुखता उसका परमेश्वर-संबंधी आशय स्पष्ट करती है।
  alternative: मनुष्य के घमण्ड का आरम्भ प्रभु से फिर जाना है, और उसका हृदय अपने रचनेवाले से दूर हो गया है।
  rationale: प्राथमिक इब्रानी साक्ष्य पहले खंड में प्रभु का स्पष्ट उल्लेख नहीं करता। यूनानी पाठ इस आशय को विस्तार देता है, इसलिए उसे मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और नीतिवचन-सदृश लहजा रखा गया है। ‘रचनेवाले’ की वर्तनी पाठ को प्रवाहपूर्ण रखती है; अनुवाद न तो यूनानी विस्तार को इब्रानी में मिला देता है, न इब्रानी की नैतिक तीक्ष्णता को कम करता है।
