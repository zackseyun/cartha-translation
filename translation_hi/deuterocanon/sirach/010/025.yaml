  text: Do not act wisely in doing your work, and do not boast in a time of distress.[a]
translation:
  language: hi
  text: अपना काम करते समय चतुराई मत दिखाओ, और संकट के समय डींग मत मारो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'उपलब्ध इब्रानी साक्षी यहाँ बहुत भिन्न है: “एक समझदार दास ऊँचा उठाया गया है, और एक मूर्ख दास शिकायत नहीं करेगा।” अंतिम इब्रानी क्रिया का अर्थ अनिश्चित है; इसमें ‘शिकायत करना’, ‘कुड़कुड़ाना’ या संभवतः ‘बहाना ढूँढ़ना’ का भाव हो सकता है।'
    reason: 'पाठांतर: इब्रानी साक्षी यूनानी आधार-पाठ से पर्याप्त रूप से भिन्न है; साथ ही अंतिम इब्रानी क्रिया की शब्दार्थगत अनिश्चितता।'
lexical_decisions:
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द अधीन स्वामित्व वाले दास या सेवक को दर्शा सकता है। यहाँ सामाजिक स्थिति का स्पष्ट अंतर बनाए रखने के लिए ‘दास’ चुना गया है।
- source_word: מַשְׂכּיל
  choice: समझदार
  rationale: यह कृदंत सूझ-बूझ और विवेक से काम लेने वाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘समझदार’ स्वाभाविक और स्पष्ट है।
- source_word: הוּרָם
  choice: ऊँचा उठाया गया है
  rationale: यह רום का होफ़अल पूर्ण रूप है और किसी दूसरे द्वारा ऊँचा किए जाने या प्रतिष्ठित किए जाने का भाव रखता है। हिन्दी पूर्ण भाव मूल रूप को बनाए रखता है।
- source_word: סָכָל
  choice: मूर्ख
  rationale: यह विवेकहीन या मूर्ख व्यक्ति के लिए सामान्य नकारात्मक शब्द है।
- source_word: לֹא יִתְאוֹנֵן
  choice: शिकायत नहीं करेगा
  rationale: व्यंजनात्मक रूप और संदर्भ ‘शिकायत करना/कुड़कुड़ाना’ अर्थ की अनुमति देते हैं, यद्यपि अंतिम क्रिया का सटीक अर्थ अनिश्चित है; इसलिए अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ उपलब्ध उच्च-विश्वसनीयता वाले इब्रानी पाठ का अनुवाद करता है।
  alternative: 'यूनानी पाठ में उपदेश है: ‘अपना काम करते समय अपने को बुद्धिमान न दिखा, और अपने संकट के समय डींग न मार।’'
  rationale: दोनों साक्ष्यों को मिलाकर कृत्रिम पाठ बनाने के बजाय मूल-भाषा के रूप में दिए गए उपलब्ध इब्रानी साक्ष्य को मुख्य पाठ में रखा गया है और पर्याप्त भिन्न यूनानी पाठ को पादटिप्पणी में सुरक्षित किया गया है। यह पाठालोचनात्मक अंतर है, कोई धर्मसिद्धान्तगत समाधान नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दास’ प्राचीन सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है। दोनों उपवाक्यों को ‘और’ से जोड़ा गया है, क्योंकि इब्रानी में साधारण संयोजक וְ है; अनावश्यक रूप से विरोधसूचक ‘परन्तु’ नहीं जोड़ा गया।
