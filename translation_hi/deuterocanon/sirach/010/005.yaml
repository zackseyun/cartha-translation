base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/005.yaml
  text: In the hand of God is the rule of the world[a], and in due time he will raise up over it the right man.
translation:
  language: hi
  text: संसार पर शासन परमेश्वर के हाथ में है,[a] और नियत समय पर एक पुरुष संसार पर अधिकार में खड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “मनुष्य की सफलता प्रभु के हाथ में है, और वह शास्त्री के मुख पर अपनी महिमा रखेगा।” यहाँ यूनानी परंपरा उपलब्ध इब्रानी पाठ से बहुत भिन्न है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: परमेश्वर के हाथ में
  rationale: यह इब्रानी रूपक नियंत्रण और अधिकार को व्यक्त करता है; हिन्दी में ‘हाथ में’ स्वाभाविक रहते हुए मूल बिंब को बनाए रखता है।
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: संसार पर शासन
  rationale: מֶמְשֶׁלֶת शासकीय अधिकार या शासन को और תֵּבֵל बसे हुए संसार को दर्शाता है। हिन्दी वाक्य-विन्यास में ‘संसार पर शासन’ स्पष्ट और स्वाभाविक है।
- source_word: וְאִישׁ
  choice: एक पुरुष को
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है और प्रसंग में किसी व्यक्तिगत शासक का संकेत देता है। ‘पुरुष’ मूल के लैंगिक संकेत को सुरक्षित रखता है; ‘योग्य’ जैसा विशेषण मूल में स्पष्ट रूप से नहीं है।
- source_word: לְעֵת
  choice: उचित समय पर
  rationale: यह पद किसी नियत या उपयुक्त अवसर का भाव देता है। ‘उचित समय पर’ आधुनिक हिन्दी में स्वाभाविक है और केवल अनिश्चित ‘किसी समय’ से अधिक सटीक है।
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: उसके ऊपर ... खड़ा करेगा
  rationale: हिफ़ील रूप का मूल अर्थ किसी को खड़ा करना या स्थापित करना है। शासन के प्रसंग में यह नियुक्ति का संकेत देता है, पर ‘खड़ा करेगा’ मूल रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठों में उल्लेखनीय अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य का अनुवाद
  alternative: 'यूनानी परंपरा: ‘मनुष्य की सफलता प्रभु के हाथ में है, और वह शास्त्री के मुख पर अपनी महिमा रखेगा।’'
  rationale: इब्रानी पाठ उपलब्ध, उच्च-विश्वसनीय और प्रमाणित है; इसलिए उसे प्राथमिक रखा गया है। भिन्न यूनानी परंपरा को पाठांतर के रूप में पादटिप्पणी में पूरा बताया गया है।
- issue: אִישׁ का लैंगिक और प्रसंगगत अर्थ
  choice: एक पुरुष
  alternative: एक व्यक्ति; योग्य पुरुष
  rationale: मूल शब्द पुल्लिंग एकवचन है। ‘एक व्यक्ति’ लैंगिक संकेत को मंद करता, जबकि ‘योग्य’ मूल में निहित होने पर भी स्पष्ट विशेषण नहीं है; अतः अधिक औपचारिक और अनिर्णायक रूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर के हाथ में’ और ‘खड़ा करेगा’ मूल इब्रानी रूपकों को बचाते हैं; वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘शासन’ के साथ ‘संसार पर’ रखा गया है।
