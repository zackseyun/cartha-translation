base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/002.yaml
  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: hi
  text: असंयमी राजा नगर को उजाड़ देता है, पर उसके शासकों की सूझ-बूझ से नगर आबाद रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “नगर अपने शासकों की समझ से बसाया हुआ है।” यूनानी समानांतर इस विचार को इस प्रकार कहता है कि नगर के निवासी अपने अगुए के अनुरूप होते हैं।'
    reason: इब्रानी के कर्मवाच्य נוֹשֶׁבֶת और यूनानी समानांतर की भिन्न अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: מֶלֶךְ פָּרוּעַ
  choice: असंयमी राजा
  rationale: מֶלֶךְ का सामान्य अर्थ ‘राजा’ है। פָּרוּעַ में बंधन या आत्म-संयम के अभाव का भाव है; ‘असंयमी’ इस नैतिक-शासकीय आशय को ‘अराजक’ या ‘निरंकुश’ की अपेक्षा कम अतिव्याख्यायित करता है।
- source_word: יַשְׁחִית עִיר
  choice: नगर को उजाड़ देता है
  rationale: שחת विनाश या बरबादी कराने को व्यक्त करता है। शासन-संबंधी इस लोकोक्ति में ‘उजाड़ देता है’ नगर की सामाजिक और राजनीतिक दुर्दशा को स्वाभाविक हिन्दी में प्रकट करता है, बिना पूर्ण भौतिक विनाश को अनिवार्य बनाए।
- source_word: וְעִיר נוֹשֶׁבֶת
  choice: पर ... नगर आबाद रहता है
  rationale: נוֹשֶׁבֶת का अर्थ ‘बसाया हुआ/आबाद होना’ है। ‘आबाद रहता है’ आधुनिक हिन्दी में नगर के बसे और फलते रहने की स्थिति को सहज रूप से व्यक्त करता है। וְ को यहाँ दोनों शासकीय परिणामों के अर्थगत विरोध के कारण ‘पर’ किया गया है।
- source_word: בְּשֶׂכֶל שָׂרֶיהָ
  choice: उसके शासकों की सूझ-बूझ से
  rationale: שֶׂכֶל विवेक, समझ या व्यावहारिक सूझ-बूझ को दर्शाता है; בְּ साधन/कारण का भाव देता है। שָׂרֶיהָ बहुवचन में नगर के प्रधानों या अधिकारियों को सूचित करता है, इसलिए ‘शासकों’ चुना गया है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर में कथन का रूप
  choice: मुख्य पाठ में इब्रानी के दोनों उपवाक्यों और उसके नेतृत्व-परिणाम संबंध को सीधे रखना
  alternative: 'यूनानी के अनुसार अनुवाद करना: ‘जैसा नगर का अगुआ, वैसे ही उसके सब निवासी’'
  rationale: उपलब्ध इब्रानी साक्ष्य यहाँ प्राथमिक और आश्वस्त है। यूनानी समानांतर नेतृत्व और नगरवासियों के पारस्परिक संबंध की पुष्टि करता है, पर उसका वाक्य-विन्यास इब्रानी से अलग है; इसलिए उसे मुख्य पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। ‘असंयमी’, ‘सूझ-बूझ’ और ‘आबाद रहता है’ सामान्य पाठक के लिए सहज हैं, जबकि इब्रानी की शासकीय और नागरिक छवियाँ बनी रहती हैं।
