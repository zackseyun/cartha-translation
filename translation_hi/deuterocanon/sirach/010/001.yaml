  text: A wise judge sets his people in order[a], and the rule of one who understands is well arranged.
translation:
  language: hi
  text: जनता का न्यायाधीश अपनी जनता को सुव्यवस्थित करता है[a], और समझदार व्यक्ति का शासन सुव्यवस्थित होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अनुवाद “स्थापित करता है” या “नींव डालता है” भी हो सकता है। यूनानी समानांतर में “शिक्षित करेगा” है और उसके आरम्भ में “बुद्धिमान न्यायाधीश” है।
    reason: इब्रानी क्रिया के वैकल्पिक अर्थ और यूनानी समानांतर के पाठभेद को सुरक्षित रखना।
lexical_decisions:
- source_word: שׁוֹפֵט עַם
  choice: किसी जनसमुदाय का न्यायी
  rationale: इब्रानी में שׁוֹפֵט का सामान्य अर्थ न्याय करने वाला अथवा शासकीय अधिकारी है, और עַם उसके कार्य-क्षेत्र—जनसमुदाय—को बताता है। यूनानी κριτής भी ‘न्यायी’ का समर्थन करता है। इब्रानी में ‘बुद्धिमान’ विशेषण नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יוֹסֵד
  choice: सुव्यवस्थित करता है
  rationale: क्रिया का मूल भाव स्थापित करना या नींव डालना हो सकता है; यहाँ लोगों को शासन के अधीन स्थिर और व्यवस्थित करने का भाव दूसरे चरण के סְדוּרָה और यूनानी समानांतर से पुष्ट होता है।
- source_word: עַמּוֹ
  choice: अपने लोगों को
  rationale: प्रत्यय स्पष्ट रूप से ‘उसके/अपने’ का अर्थ देता है। आधुनिक हिन्दी में कर्ता से संबंध दिखाने के लिए ‘अपने’ स्वाभाविक है।
- source_word: מֶמְשֶׁלֶת
  choice: शासन
  rationale: यह संज्ञा शासन करने की सत्ता अथवा व्यवस्था को दर्शाती है। ‘शासन’ हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: מֵבִין
  choice: समझ-बूझ रखने वाले
  rationale: यह कृदंत विवेक या समझ रखने वाले व्यक्ति को दर्शाता है। यह अनुवाद व्यक्ति-सूचक अर्थ बनाए रखता है और अनावश्यक रूप से लिंग निर्दिष्ट नहीं करता।
- source_word: סְדוּרָה
  choice: सुव्यवस्थित रहता है
  rationale: शब्द का अर्थ क्रमबद्ध या ठीक ढंग से व्यवस्थित होना है। ‘रहता है’ हिन्दी में सामान्य कथन का स्वाभाविक रूप है; यूनानी τεταγμένη ἔσται भी व्यवस्थित शासन की पुष्टि करता है।
