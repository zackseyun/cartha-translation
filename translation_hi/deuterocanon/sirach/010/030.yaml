base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/030.yaml
  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: hi
  text: एक निर्धन व्यक्ति है, जो अपनी समझ-बूझ के कारण सम्मानित है[a]; और एक ऐसा व्यक्ति भी है, जो अपनी धन-संपत्ति के कारण सम्मानित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “पर जो गरीबी में सम्मानित है, वह धन में कितना अधिक सम्मानित होगा? और जो धन में सम्मानहीन है, वह गरीबी में कितना अधिक सम्मानहीन होगा?” यहाँ इब्रानी और यूनानी पाठों में बहुत बड़ा अंतर है।'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: निर्धन व्यक्ति
  rationale: यह शब्द निर्धन या साधनहीन व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘निर्धन व्यक्ति’ प्रतिनिधिक पुल्लिंग की अपेक्षा अधिक स्वाभाविक और समावेशी है, जबकि एकवचन बना रहता है।
- source_word: נִכְבָּד
  choice: सम्मानित होता है
  rationale: निफ़अल रूप यहाँ किसी के आदर या प्रतिष्ठा पाने की अवस्था बताता है। ‘सम्मानित होता है’ दोनों अर्ध-पंक्तियों में सामाजिक मान का भाव स्पष्ट रखता है।
- source_word: בִּגְלַל
  choice: के कारण
  rationale: यह संबंधकारक पद कारण या आधार व्यक्त करता है; ‘के कारण’ सहज आधुनिक हिन्दी है।
- source_word: שִׂכְלוֹ
  choice: अपनी समझ-बूझ
  rationale: שכל समझ, विवेक और व्यावहारिक सूझ का अर्थ दे सकता है। ‘समझ-बूझ’ साधारण पाठक के लिए सहज है और इसे व्यापक धार्मिक पद ‘बुद्धि/ज्ञान’ से अनावश्यक रूप से नहीं मिलाता।
- source_word: עָשְׁרוֹ
  choice: अपनी धन-संपत्ति
  rationale: यह संज्ञा भौतिक धन या समृद्धि को दर्शाती है। ‘धन-संपत्ति’ सामाजिक और भौतिक अर्थ को स्पष्ट करती है।
- source_word: יֵשׁ ... וְיֵשׁ
  choice: एक ... होता है, और एक ... होता है
  rationale: हिन्दी में यह रचना इब्रानी के दो समानांतर उदाहरणों को स्वाभाविक और सूक्तिपरक ढंग से प्रस्तुत करती है।
theological_decisions:
- issue: इब्रानी पाठ और यूनानी समानांतर पाठ में बड़ा अंतर
  choice: मुख्य पाठ में उपलब्ध इब्रानी साक्ष्य के अनुसार दो सम्मानित व्यक्तियों का विरोध रखा गया है—एक समझ-बूझ के कारण और दूसरा धन-संपत्ति के कारण।
  alternative: यूनानी पाठ गरीबी में सम्मानित और धन में असम्मानित व्यक्ति के विषय में ‘कितना अधिक’ वाले दो अलंकारिक प्रश्न देता है।
  rationale: सिराख का उपलब्ध इब्रानी साक्ष्य मुख्य आधार है। फिर भी यूनानी पाठ का अर्थ बहुत भिन्न है, इसलिए पाठगत तनाव को छिपाने के बजाय पादटिप्पणी में पूरा वैकल्पिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शब्दावली। समानांतर वाक्य-विन्यास और सामाजिक सम्मान बनाम संपत्ति का तनाव सुरक्षित रखा गया है।
