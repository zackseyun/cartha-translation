base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/026.yaml
  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: hi
  text: अपनी इच्छा साधने के लिए बहुत चतुराई न दिखाओ,[a] और अपनी आवश्यकता के समय अपनी बड़ाई न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी साक्षी में यहाँ बहुत भिन्न पाठ है: “हर काम में मेहनत करनेवाला उस व्यक्ति से बेहतर है जो अपनी बड़ाई करता फिरता है और जिसके पास रोटी नहीं है।” काहिरा गनीज़ा में सुरक्षित इब्रानी पाठ अपनी इच्छा साधने के लिए चतुराई दिखाने और आवश्यकता के समय अपनी बड़ाई करने के विरुद्ध चेतावनी देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: अपने को बहुत बुद्धिमान न समझो
  rationale: हित्पएल रूप अपने को बुद्धिमान दिखाने या मानने का भाव देता है। यह अनुवाद आत्म-प्रदर्शित, स्वार्थसाधक चतुराई के विरुद्ध चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲבוֹד חֶפְצֶךָ
  choice: अपनी इच्छा पूरी करने के लिए
  rationale: शाब्दिक अर्थ ‘अपनी इच्छा की सेवा करने के लिए’ है, पर हिन्दी में ‘इच्छा पूरी करना’ अधिक स्वाभाविक है और स्वार्थ-साधन का आशय बनाए रखता है।
- source_word: וְאַל תִּתְכַּבֵּד
  choice: स्वयं को महत्त्व न दो
  rationale: כבד का हित्पएल आत्म-सम्मान बढ़ाने, अपने को महत्त्वपूर्ण बनाने या अपनी महिमा करने का भाव रखता है। चुना हुआ रूप स्पष्ट और आधुनिक है, पर आत्म-बड़ाई की चेतावनी को अति-विशिष्ट नहीं बनाता।
- source_word: בְּמוֹעֵד צָרְכֶּךָ
  choice: अपनी आवश्यकता के समय
  rationale: מוֹעֵד यहाँ समय या अवसर और צֹרֶךְ आवश्यकता या अभाव को दर्शाता है। यूनानी पाठ में रोटी के अभाव का उल्लेख अंतिम पदबंध के भौतिक जरूरत से जुड़े होने की पुष्टि करता है।
theological_decisions:
- issue: प्राप्त इब्रानी पाठ और यूनानी साक्षी के बीच बड़ा पाठांतर
  choice: मुख्य पाठ का अनुवाद उपलब्ध इब्रानी से किया गया है; अंतिम पदबंध में ‘आवश्यकता’ का अर्थ यूनानी साक्षी से भी पुष्ट होता है।
  alternative: “हर बात में काम करनेवाला उस व्यक्ति से बेहतर है जो डींग मारता फिरता है और जिसके पास रोटी नहीं है।”
  rationale: जहाँ सिराख का इब्रानी पाठ उपलब्ध है, उसे प्राथमिकता दी गई है। फिर भी यूनानी पाठ का अर्थ काफी भिन्न है, इसलिए दोनों को चुपचाप मिलाने के बजाय वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष निषेधात्मक शैली रखी गई है। ‘अपने को बहुत बुद्धिमान न समझो’ बनावटी या स्वार्थपूर्ण बुद्धिमानी का भाव देता है; ‘स्वयं को महत्त्व न दो’ आत्म-बड़ाई का भाव रखते हुए किसी विशिष्ट धार्मिक व्याख्या को आरोपित नहीं करता।
