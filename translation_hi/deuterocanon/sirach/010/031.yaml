translation:
  language: hi
  text: अपने धन में वह कितना सम्मानित है[a], और अपनी गरीबी में कितना तुच्छ समझा जाता है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ का क्रम और बल अलग है: “पर जो गरीबी में सम्मानित है—धन में कितना अधिक [सम्मानित]! और जो धन में सम्मानहीन है—गरीबी में कितना अधिक [सम्मानहीन]!” यहाँ मुख्य पाठ के लिए इब्रानी साक्ष्य को प्राथमिक माना गया है और यूनानी को संगति-जाँच के लिए उपयोग किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: सम्मानित
  rationale: כבד के निफ़अल रूप का अर्थ यहाँ सामाजिक रूप से आदर या प्रतिष्ठा पाना है; ‘सम्मानित’ स्वाभाविक और सटीक प्रतिरूप है।
- source_word: בְּעָשְׁרוֹ
  choice: अपने धन में
  rationale: בְּ परिस्थिति या अवस्था दर्शा सकता है। ‘अपने धन में’ इब्रानी संरचना को बनाए रखता है और कारण का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֵיכָכָה
  choice: कितना
  rationale: यह परिमाण व्यक्त करने वाला विस्मयात्मक अथवा प्रश्नात्मक अव्यय है। ‘कितना’ उसके आलंकारिक विस्मय को बिना ‘कितना अधिक’ जोड़कर व्याख्यायित किए व्यक्त करता है।
- source_word: וְנִקְלֶה
  choice: और ... तुच्छ समझा जाता है
  rationale: קלה के निफ़अल रूप में कम मूल्यवान मानने या तिरस्कार करने का निष्क्रिय भाव है। यह चयन ‘सम्मानित’ के साथ स्पष्ट सामाजिक विरोध बनाता है।
- source_word: בְּעָנְיוֹ
  choice: अपनी गरीबी में
  rationale: यहाँ भी בְּ परिस्थिति या अवस्था व्यक्त करता है; यह अनुवाद इब्रानी समानांतरता को सुरक्षित रखते हुए ‘गरीबी के कारण’ को अनिवार्य अर्थ नहीं बनाता।
