  text: Among brothers their chief is honored[a], and one who fears God among his people.
translation:
  language: hi
  text: भाइयों के बीच उनका प्रधान सम्मानित होता है[a], और अपने लोगों के बीच परमेश्वर का भय माननेवाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी समानांतर पाठ: “धनी, प्रतिष्ठित और निर्धन—उनका गर्व प्रभु का भय है।” यहाँ इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर है; मुख्य पाठ उपलब्ध इब्रानी के अनुसार है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: भाइयों के बीच
  rationale: בֵּין यहाँ किसी समूह के भीतर सामाजिक स्थिति बताता है; אַחִים का व्याकरणिक रूप पुल्लिंग बहुवचन है, इसलिए इसे विस्तार दिए बिना ‘भाइयों’ रखा गया है।
- source_word: רֹאשָׁם
  choice: उनका प्रधान
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर सामाजिक संदर्भ में यह प्रधान या अगुआ को सूचित करता है। ‘प्रधान’ आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: נִכְבָּד
  choice: सम्मानित होता है
  rationale: כבד के निफ़अल रूप में यहाँ सम्मान या प्रतिष्ठा पाने का भाव है; ‘सम्मानित होता है’ इस सामाजिक अर्थ को स्पष्ट रखता है।
- source_word: וִירֵא אֱלֹהִים
  choice: और ... परमेश्वर का भय माननेवाला
  rationale: इब्रानी पदबंध एकवचन में चरित्र का वर्णन करता है। ‘परमेश्वर का भय माननेवाला’ पारंपरिक धार्मिक अर्थ और कथन की संक्षिप्तता दोनों बनाए रखता है।
- source_word: בְּעַמּוֹ
  choice: अपने लोगों के बीच
  rationale: בְּ यहाँ समूह के भीतर स्थिति प्रकट करता है। प्रत्यय को कर्ता-संबंधी समझते हुए ‘अपने लोगों’ रखा गया है, जिससे हिन्दी स्वाभाविक रहती है और पहले खंड के साथ समानांतरता बनी रहती है।
theological_decisions:
- issue: इब्रानी और यूनानी पाठ-साक्ष्यों में बड़ा अंतर
  choice: मुख्य पाठ उपलब्ध इब्रानी के अनुसार रखा गया है और यूनानी पाठ को पाद-टिप्पणी में दिया गया है।
  alternative: 'यूनानी: “धनी, प्रतिष्ठित और निर्धन—उनका गर्व प्रभु का भय है।”'
  rationale: सिराख का उपलब्ध इब्रानी पाठ प्राथमिक स्रोत-साक्ष्य है। यूनानी समानांतर पाठ अर्थ और संरचना में पर्याप्त रूप से भिन्न है; इसलिए अंतर को मिटाने के बजाय पारदर्शिता से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त, नीतिवचन-सदृश और गरिमापूर्ण रखी गई है। दूसरे खंड में इब्रानी की संक्षिप्त, क्रियारहित संरचना को हिन्दी में भी यथासंभव बनाए रखा गया है, ताकि पाठ में निहित संबंध को अनावश्यक रूप से निश्चित न किया जाए।
