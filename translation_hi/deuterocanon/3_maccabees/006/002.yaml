base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/002.yaml
  text: O King[a], mighty in power, Most High, almighty God, governing all creation with mercies[b],
translation:
  language: hi
  text: हे महान सामर्थ्य वाले राजा, हे परमप्रधान, हे सर्वशक्तिमान परमेश्वर, जो अपनी भरपूर करुणा से सारी सृष्टि[a] का संचालन करता है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समूची सृष्टि’।
    reason: lexical_alternative
  - marker: b
    text: ‘भरपूर करुणा से’ का अनुवाद ‘करुणामय कार्यों के द्वारा’ या ‘करुणापूर्वक’ भी हो सकता है। यूनानी में ‘करुणा’ बहुवचन में है, जो परमेश्वर के करुणामय कार्यों या उसकी प्रचुर करुणा पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: सम्बोधन कारक और प्रार्थना के उदात्त, प्रत्यक्ष आह्वान को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: μεγαλοκράτωρ
  choice: महान सामर्थ्य वाले
  rationale: यह संयुक्त विशेषण महान शक्ति और प्रभुत्व पर बल देता है। यह रूप अर्थ को स्पष्ट रखता है और ‘महापराक्रमी’ से जुड़ी मुख्यतः युद्ध-संबंधी छाया से बचता है।
- source_word: ὕψιστε
  choice: हे परमप्रधान
  rationale: ईश्वर के इस सर्वोच्चता-सूचक सम्बोधन का प्रचलित और गरिमापूर्ण बाइबिलीय हिन्दी रूप है।
- source_word: παντοκράτωρ
  choice: हे सर्वशक्तिमान
  rationale: ईश्वरीय उपाधि का संक्षिप्त और स्थापित हिन्दी रूप; सार्वभौम सामर्थ्य का भाव बनाए रखता है।
- source_word: δέε
  choice: परमेश्वर
  rationale: दिए गए पाठ और उसके सत्यापन में इसे ईश्वर के प्रत्यक्ष सम्बोधन के रूप में समझा गया है; ‘परमेश्वर’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: τὴν πᾶσαν ... κτίσιν
  choice: सारी सृष्टि
  rationale: सम्पूर्ण सृजित जगत के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διακυβερνῶν
  choice: संचालन करता है
  rationale: मूल क्रिया में दिशा देने, नाव खेने या शासनपूर्वक चलाने का बिंब है; ‘संचालन’ सृष्टि पर सतत ईश्वरीय निर्देशन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν οἰκτιρμοῖς
  choice: अपनी भरपूर करुणा से
  rationale: यूनानी बहुवचन करुणा की प्रचुरता अथवा करुणामय कार्यों की ओर संकेत कर सकता है। यह चयन उस बल को पठनीय हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वास्तविक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: प्रत्यक्ष सम्बोधन में एक के बाद एक ईश्वरीय उपाधियाँ
  choice: 'सभी उपाधियों को अलग-अलग सुरक्षित रखना: ‘हे राजा, महान सामर्थ्य वाले, हे परमप्रधान, हे सर्वशक्तिमान परमेश्वर’'
  alternative: उपाधियों को मिलाकर या घटाकर अधिक संक्षिप्त वाक्य बनाना
  rationale: यूनानी प्रार्थना जानबूझकर सम्मानसूचक उपाधियों का संचय करती है। उन्हें बनाए रखने से ईश्वरीय सर्वोच्चता और सामर्थ्य का आलंकारिक तथा धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: παντοκράτωρ का अर्थ
  choice: सर्वशक्तिमान
  alternative: सबका शासक
  rationale: ‘सबका शासक’ व्युत्पत्तिगत रूप से सम्भव है, पर ‘सर्वशक्तिमान’ हिन्दी का स्थापित बाइबिलीय ईश्वरीय शीर्षक है और यहाँ की उपाधिमाला में स्वाभाविक बैठता है।
- issue: ἐν οἰκτιρμοῖς के बहुवचन का निर्वाह
  choice: भरपूर करुणा से
  alternative: करुणाओं से; करुणामय कार्यों के द्वारा
  rationale: मूल का बहुवचन करुणा की बहुतायत या उसके कार्यों को उभार सकता है। मुख्य पाठ में सहजता रखते हुए ‘भरपूर’ से प्रचुरता व्यक्त की गई है और विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण है। सम्बोधन की पुनरावृत्ति मूल यूनानी की उपाधिमाला को सुनने योग्य बनाती है। वाक्य आगे जारी रहने के कारण अंत में अल्पविराम रखा गया है।
