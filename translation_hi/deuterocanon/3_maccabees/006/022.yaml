    reason: lexical_alternative
lexical_decisions:
- source_word: μετεστράφη
  choice: बदल गया
  rationale: निष्क्रिय भाव में क्रोध के उलटकर दूसरी मनोदशा बन जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ ὀργή
  choice: क्रोध
  rationale: ὀργή का मानक और प्रसंगानुकूल हिन्दी रूप; ‘कोप’ की अपेक्षा अधिक सहज है।
- source_word: εἰς οἶκτον καὶ δάκρυα
  choice: करुणा और आँसुओं में
  rationale: οἶκτος का सामान्य अर्थ दया/करुणा है; ‘करुणा’ दुःखमिश्रित सहानुभूति को व्यक्त करती है और δάκρυα का सीधा अर्थ ‘आँसू’ है।
- source_word: ὑπὲρ τῶν
  choice: उन लोगों के लिए
  rationale: ὑπέρ यहाँ राजा की करुणा के विषय को बताता है; पुंल्लिंग बहुवचन कृदन्त μεμηχανευμένων के कारण इसे व्यक्तियों के रूप में लेना व्याकरणतः संभव और निकटवर्ती कथा-संदर्भ में उपयुक्त है।
- source_word: ἔμπροσθεν αὐτῷ
  choice: उसके सामने पहले
  rationale: ἔμπροσθεν में स्थानगत ‘उसके सामने’ का भाव रखा गया है; प्रसंग में पूर्व घटना का संकेत देने के लिए ‘पहले’ भी व्यक्त किया गया है।
- source_word: μεμηχανευμένων
  choice: जिनके विरुद्ध … षड्यंत्र रचा गया था
  rationale: μηχανάομαι के सिद्ध पूर्ण मध्य/कर्मवाच्य कृदन्त को पीड़ित व्यक्तियों से जोड़कर ‘विरुद्ध षड्यंत्र रचा गया था’ किया गया है; इससे यूनानी के पुंल्लिंग बहुवचन रूप और पूर्ववर्ती उत्पीड़न का संदर्भ दोनों स्पष्ट होते हैं।
