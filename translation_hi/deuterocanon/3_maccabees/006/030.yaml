base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: hi
  text: तब राजा ने राजस्व के अधिकारी को नगर में बुलाकर आदेश दिया कि यहूदियों को सात दिन तक दाखमधु और भोज के लिए उपयुक्त अन्य सामग्री उपलब्ध कराई जाए। उसने निश्चय किया कि जिस स्थान पर उन्होंने अपने विनाश का सामना करने की अपेक्षा की थी, उसी स्थान पर वे पूरे आनंद के साथ अपने उद्धार[a] का उत्सव मनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने छुटकारे का उत्सव।” यूनानी शब्द उद्धार या छुटकारे, दोनों का अर्थ दे सकता है; यहाँ प्रसंग विनाश से बचाए जाने के आनंद का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: राजस्व के अधिकारी
  rationale: यह पद आय अथवा राजस्व की देखरेख करने वाले प्रशासनिक अधिकारी को दर्शाता है; यह अनुवाद किसी अनिश्चित विशिष्ट पदनाम को थोपे बिना अर्थ स्पष्ट करता है।
- source_word: προσκαλεσάμενος
  choice: बुलाकर
  rationale: कृदंत मुख्य आदेश से पहले हुई क्रिया बताता है; ‘बुलाकर’ हिन्दी में क्रम को सहज रूप से व्यक्त करता है।
- source_word: οἴνους
  choice: दाखमधु
  rationale: यूनानी में बहुवचन है, पर यहाँ पेय-सामग्री के रूप में सामूहिक अर्थ है; हिन्दी में एकवचन द्रव्यवाचक प्रयोग स्वाभाविक है।
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: भोज के लिए उपयुक्त अन्य सामग्री
  rationale: वाक्यांश उत्सवी खाने-पीने के लिए आवश्यक सामग्री को सूचित करता है; यह चयन अर्थ और उत्सव के प्रसंग दोनों को बनाए रखता है।
- source_word: χορηγεῖν
  choice: उपलब्ध कराई जाए
  rationale: राजकीय आदेश के अधीन प्रबंध करके देने का भाव है; कर्मवाच्य हिन्दी में मूल वाक्य-संबंध को स्वाभाविक ढंग से रखता है।
- source_word: κρίνας
  choice: उसने निश्चय किया
  rationale: यह राजा के सोच-विचारकर किए गए निर्णय को बताता है; ‘निश्चय किया’ न्यायिक अर्थ को अनावश्यक रूप से प्रबल किए बिना दृढ़ता व्यक्त करता है।
- source_word: ἔδοξαν
  choice: उन्होंने ... आशा की थी
  rationale: संदर्भ में यहूदियों की पूर्व धारणा अथवा अपेक्षा का भाव है। विनाश के साथ हिन्दी में ‘आशा’ कुछ असामान्य लग सकती है, पर यहाँ इसका पुराना तटस्थ अर्थ ‘अपेक्षा’ है; फिर भी अधिक स्पष्ट विकल्प ‘उम्मीद की थी’ हो सकता है।
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: अपने विनाश का सामना करने
  rationale: शाब्दिक ‘विनाश ग्रहण करने’ हिन्दी में अस्वाभाविक है; ‘विनाश का सामना करने’ आसन्न घातक परिणाम का भाव सुरक्षित रखता है।
- source_word: σωτήρια ἀγαγεῖν
  choice: अपने उद्धार का उत्सव मनाएँ
  rationale: वाक्यांश बचाए जाने के उपलक्ष्य में उत्सव मनाने को दर्शाता है। ‘उद्धार’ यूनानी शब्द की बचाव/मुक्ति और व्यापक salvation दोनों संभावनाएँ बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: पूरे आनंद के साथ
  rationale: यह उत्सव के भरपूर हर्ष को तीव्र करता है; चुना हुआ रूप आधुनिक और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: द्वितीयकानूनी ऐतिहासिक प्रसंग में σωτήρια का अनुवाद
  choice: उद्धार
  alternative: छुटकारा
  rationale: तात्कालिक संदर्भ मृत्यु के संकट से बचाए जाने और उसके उत्सव का है। ‘उद्धार’ मूल शब्द की व्यापक बचाने वाली शक्ति को सुरक्षित रखता है, पर पादटिप्पणी बताती है कि यहाँ मुख्य संकेत विनाश से छुटकारे का है; इससे व्यवस्थित धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से सीमित या आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। प्रशासनिक पद को सामान्य रूप में रखा गया है। ‘दाखमधु’ बाइबलीय गरिमा बनाए रखता है, और वाक्य की पुनरुक्ति ‘जिस स्थान... उसी स्थान’ मूल यूनानी के बलाघात को सुरक्षित रखती है।
