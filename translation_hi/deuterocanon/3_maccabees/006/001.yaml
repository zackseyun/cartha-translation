base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/001.yaml
  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: hi
  text: 'देश के यहूदियों में एलियाज़र नाम का एक प्रतिष्ठित व्यक्ति था। वह वृद्धावस्था को पहुँच चुका था और जीवन के हर सद्गुण से सुशोभित था। उसने अपने आस-पास के बुज़ुर्गों को शांत किया ताकि वे पवित्र परमेश्वर को पुकारें,[a] और फिर उसने इस प्रकार प्रार्थना की:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उसने अपने आस-पास के बुज़ुर्गों को शांत किया, पवित्र परमेश्वर को पुकारा और इस प्रकार प्रार्थना की।”
    reason: यूनानी वाक्य-विन्यास में यह अस्पष्टता है कि ‘पुकारने’ का कर्ता बुज़ुर्ग हैं या एलियाज़र।
lexical_decisions:
- source_word: ἐπίσημος
  choice: प्रतिष्ठित
  rationale: यह शब्द किसी समूह में विशिष्ट, उल्लेखनीय या सम्मानित व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘प्रतिष्ठित’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχὼς
  choice: वृद्धावस्था को पहुँच चुका था
  rationale: यूनानी वाक्यांश का अर्थ है कि वह पहले ही जीवन की वृद्ध अवस्था प्राप्त कर चुका था; यह अनुवाद मुहावरेदार हिन्दी में उसी भाव को व्यक्त करता है।
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: जीवन के हर सद्गुण से सुशोभित था
  rationale: κεκοσμημένος का अलंकारिक भाव ‘सुशोभित’ में बना रहता है, जबकि ἀρετή को नैतिक उत्कृष्टता के अर्थ में ‘सद्गुण’ कहा गया है।
- source_word: καταστείλας
  choice: शांत किया
  rationale: संदर्भ में इसका अर्थ आस-पास के बुज़ुर्गों को संयत या शांत करना है; ‘शांत किया’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐπικαλεῖσθαι
  choice: पुकारें
  rationale: प्रार्थना में परमेश्वर का आह्वान करने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पवित्र परमेश्वर को पुकारने वाले का कर्ता
  choice: 'मुख्य पाठ में बुज़ुर्गों को कर्ता माना गया: ‘ताकि वे ... पुकारें’'
  alternative: एलियाज़र ने बुज़ुर्गों को शांत किया, फिर स्वयं पवित्र परमेश्वर को पुकारा
  rationale: καταστείλας के बाद आए accusative πρεσβυτέρους और infinitive ἐπικαλεῖσθαι को accusative-and-infinitive रचना के रूप में लेना संभव है, जिसमें बुज़ुर्ग पुकारने वाले हैं। फिर भी वाक्य-संरचना दूसरे अर्थ की भी अनुमति देती है, इसलिए विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ὁ ἅγιος θεός का अनुवाद
  choice: पवित्र परमेश्वर
  alternative: पवित्र ईश्वर
  rationale: ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय गद्य में सामान्य, गरिमापूर्ण और किसी विशिष्ट सम्प्रदाय तक सीमित न होने वाला पद है; निश्चित विशेषण सहित यूनानी अभिव्यक्ति को सीधे रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, पर अर्थ-संबंध और प्रार्थना की भूमिका सुरक्षित रखी गई है। नाम Ἐλεάζαρος को प्रचलित हिन्दी रूप ‘एलियाज़र’ दिया गया है।
