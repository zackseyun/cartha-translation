    text: यूनानी शब्द φίλοι का अर्थ केवल निजी मित्र ही नहीं, बल्कि राजकीय सहयोगी या दरबारी भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने … सुनी
  rationale: एओरिस्ट कृदंत मुख्य क्रिया की समयगत परिस्थिति बताता है; यह हिंदी में स्वाभाविक रूप से ‘जब उसने’ से व्यक्त होता है।
- source_word: κραυγῆς
  choice: पुकार
  rationale: κραυγή ऊँची या व्याकुल पुकार को दर्शाता है; ‘पुकार’ संदर्भानुकूल, स्पष्ट और गरिमापूर्ण है।
- source_word: συνιδὼν
  choice: देखा
  rationale: क्रिया देखने के साथ स्थिति को पहचानने का भाव भी रख सकती है; संदर्भ में ‘देखा’ पर्याप्त है।
- source_word: πρηνεῖς
  choice: मुँह के बल पड़ा
  rationale: πρηνής का मूल अर्थ औंधा या मुँह के बल पड़ा होना है; यह ‘दण्डवत’ जैसे संभावित धार्मिक आशय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἅπαντας
  choice: उन सबको
  rationale: यह पहले से संदर्भित पूरे समूह को स्पष्ट रूप से इंगित करता है।
- source_word: εἰς τὴν ἀπώλειαν
  choice: विनाश के लिए
  rationale: εἰς यहाँ आसन्न विनाश की ओर नियति या अभिमुखता व्यक्त करता है; ‘विनाश के लिए’ मूल की संक्षिप्त गंभीरता बनाए रखता है।
- source_word: δακρύσας
  choice: रो पड़ा
  rationale: शाब्दिक भाव आँसू बहाने का है; ‘रो पड़ा’ हिंदी कथा में भाव की आकस्मिकता और स्वाभाविकता व्यक्त करता है।
- source_word: μετʼ ὀργῆς
  choice: क्रोध में
  rationale: यह आँसू बहाने और धमकाने के साथ उपस्थित क्रोध को बिना उसके संबंध को अत्यधिक निश्चित किए व्यक्त करता है।
- source_word: τοῖς φίλοις
  choice: अपने मित्रों
  rationale: मूल अर्थ ‘मित्र’ है, जबकि राजदरबार में यह राजकीय सहयोगियों या दरबारियों की पदवी भी हो सकती है; मुख्य पाठ निकट अर्थ रखता है और टिप्पणी सांस्कृतिक संकेत स्पष्ट करती है।
- source_word: διηπείλει
  choice: धमकाते हुए
  rationale: इम्परफेक्ट क्रिया जारी या बार-बार दी जा रही धमकी का संकेत दे सकती है; हिंदी का यह रूप उस प्रवाह को स्वाभाविक ढंग से बनाए रखता है।
- source_word: λέγων
  choice: कहने लगा
  rationale: यह अगले पद के प्रत्यक्ष कथन की भूमिका है; ‘कहने लगा’ हिंदी में कथा को आगे जोड़ता है।
