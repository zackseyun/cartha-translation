  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
translation:
  language: hi
  text: क्योंकि जब उसने पुकार सुनी और विनाश के लिए मुँह के बल पड़े हुए उन सबको देखा, तब उसने क्रोध से आँसू बहाए और अपने मित्रों[a] को धमकाते हुए कहा,
  philosophy: optimal-equivalence
  footnotes:
