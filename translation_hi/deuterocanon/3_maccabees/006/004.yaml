  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर अपनाया गया है। ‘हे पिता’, ‘अधर्ममय दुस्साहस’ और ‘दया का प्रकाश’ मूल की औपचारिकता तथा काव्यात्मक बिंब रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है। अंतिम अल्पविराम रखा गया है क्योंकि मूल पद आगे चलने वाली प्रार्थना का आश्रित अंश है।
