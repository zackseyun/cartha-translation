  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: hi
  text: हे पिता, आपने फ़िरौन को—जो पहले इस मिस्र का शासक था और धृष्टतापूर्ण कामों में बढ़ता जाता था[a], तथा अधर्ममय दुस्साहस और डींग मारनेवाली वाणी से फूल उठा था—उसकी घमंडी सेना समेत समुद्र में डुबोकर नष्ट कर दिया[b], और इस्राएल के लोगों पर दया का प्रकाश चमकाया[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध कठिन है; इसका अनुवाद ‘धृष्टता के कामों को बढ़ाता जाता था’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘आपने उन्हें समुद्र-निगला हुआ नष्ट कर दिया’; यह फ़िरौन और उसकी सेना के समुद्र में समा जाने का बिंब है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘इस्राएल के लोगों पर दया का प्रकाश चमकाया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: हे पिता
  rationale: प्रार्थना में प्रत्यक्ष संबोधन है; ‘हे पिता’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: जो पहले इसी मिस्र का शासक था
  rationale: πρὶν के ‘पहले’ और ταύτης के संकेतात्मक बल को बनाए रखते हुए δυνάστης को अनावश्यक रूप से ‘तानाशाह’ नहीं बनाया गया।
- source_word: πληθύνοντα θράμασιν
  choice: धृष्टतापूर्ण कामों में बढ़ता जाता था
  rationale: कठिन यूनानी पदबंध में उद्दंड अथवा दुस्साहसी आचरण की बढ़ती अधिकता व्यक्त होती है; हिन्दी अनुवाद इस अस्पष्टता को अत्यधिक विशिष्ट किए बिना संप्रेषित करता है।
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: अधर्ममय दुस्साहस ... से फूल उठा था
  rationale: ἐπαρθέντα के ऊपर उठने अथवा घमंड से फूलने के रूपक और ἀνόμῳ θράσει के नैतिक रूप से दूषित दुस्साहस, दोनों को रखा गया है।
- source_word: γλώσσῃ μεγαληγόμονι
  choice: डींग मारनेवाली वाणी
  rationale: यह चयन घमंड भरे, बढ़-चढ़कर बोलने वाले भाषण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: उसकी घमंडी सेना समेत
  rationale: στρατιά का सामान्य अर्थ ‘सेना’ और ὑπερηφάνῳ का अहंकारी भाव स्पष्ट रूप से सुरक्षित है।
- source_word: ποντοβρόχους ἀπώλεσας
  choice: समुद्र में निगलवाकर नष्ट कर दिया
  rationale: दुर्लभ संयुक्त विशेषण में समुद्र द्वारा निगले जाने का सजीव बिंब है; ‘निगलवाकर’ विनाश को परमेश्वर की क्रिया से जोड़ते हुए समुद्र को निकट साधन के रूप में रखता है।
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: अपनी दया का प्रकाश चमकाया
  rationale: दया को केवल ‘दिखाया’ कहकर प्रकाश के मूल रूपक को समतल नहीं किया गया। ‘अपनी’ हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए निहित रूप से जोड़ा गया है।
- source_word: Ἰσραὴλ γένει
  choice: इस्राएल के लोगों पर
  rationale: γένος यहाँ समुदाय अथवा लोगों को सूचित करता है; यह रूप आधुनिक जातीय अर्थछाया से बचते हुए स्वाभाविक है।
theological_decisions:
- issue: फ़िरौन पर न्याय और इस्राएल पर दया का एक ही विस्तृत प्रार्थनात्मक संबोधन में विरोधाभास
  choice: दोनों दिव्य क्रियाओं को एक प्रवाहमान वाक्य में रखा गया और विनाश तथा प्रकाश—दोनों बिंब सुरक्षित रखे गए।
  alternative: वाक्य को अलग-अलग कथनों में बाँटना या ‘दया का प्रकाश’ को केवल ‘दया की’ कहना।
  rationale: यूनानी वाक्य की वाक्पटु संरचना अहंकारी उत्पीड़क पर न्याय और इस्राएल पर दया को आमने-सामने रखती है; इसे बनाए रखने से धर्मवैचारिक तनाव स्वयं पाठ में बोलता है।
- issue: ἐπαρθέντα में ऊँचा उठने और अहंकारी हो जाने के बीच अर्थछाया
  choice: ‘फूल उठा था’
  alternative: ‘ऊँचा उठाया गया था’ या ‘घमंडी हो गया था’
  rationale: ‘फूल उठा’ आत्म-अभिमान का रूपक बनाए रखता है और यह संकेत नहीं देता कि परमेश्वर ने उसे सम्मानपूर्वक ऊँचा किया था।
