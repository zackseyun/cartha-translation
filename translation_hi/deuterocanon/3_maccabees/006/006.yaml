base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: hi
  text: तूने बाबुल प्रदेश में उन तीन साथियों को बचाया, जिन्होंने व्यर्थ वस्तुओं[a] की उपासना न करने के लिए स्वेच्छा से अपने प्राण आग के हवाले कर दिए थे; तूने धधकती भट्ठी को शीतल करके उन सबको बाल भर की हानि के बिना[b] बचा लिया और उनके सभी विरोधियों पर ज्वाला भेजी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “व्यर्थ वस्तुओं” से आशय झूठी उपास्य-वस्तुएँ हैं; इसका अनुवाद “रिक्त वस्तुएँ” या अधिक व्याख्यात्मक रूप में “मूर्तियाँ” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “बाल तक”; अर्थात उनके एक बाल की भी हानि नहीं हुई।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑταίρους
  choice: साथियों
  rationale: यह यूनानी शब्द सहयोगी या साथी को सूचित करता है। ‘साथियों’ से तीन यहूदी युवकों की ओर संकेत बना रहता है, पर मूल से अधिक स्पष्ट पहचान नहीं जोड़ी जाती।
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: स्वेच्छा से अपने प्राण आग को सौंप दिए थे
  rationale: ‘स्वेच्छा से’ αὐθαιρέτως को और ‘अपने प्राण’ τὴν ψυχήν को इस मृत्यु-संकट के प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है; ‘आग को सौंपना’ यूनानी दत्तिव के साथ देने की छवि बनाए रखता है।
- source_word: τοῖς κενοῖς
  choice: खोखली वस्तुओं
  rationale: मूल में सामान्य ‘मूर्तियाँ’ शब्द नहीं, बल्कि ‘रिक्त/व्यर्थ वस्तुएँ’ है। ‘खोखली वस्तुएँ’ असत्य उपास्य-वस्तुओं की निष्फलता पर मूल के कटाक्ष को सहज हिन्दी में बनाए रखता है।
- source_word: διάπυρον ... κάμινον
  choice: धधकती भट्ठी
  rationale: यह अत्यन्त तपती, अग्निमय भट्ठी का स्वाभाविक और सजीव हिन्दी रूप है।
- source_word: δροσίσας
  choice: शीतल करके
  rationale: कृदन्त का अर्थ ठंडा या ओस-जैसी शीतलता प्रदान करना है; ‘शीतल करके’ मुख्य बचाव-क्रिया से पहले हुए ईश्वरीय कार्य को व्यक्त करता है।
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: उन सबको बाल भर की हानि के बिना बचा लिया
  rationale: ‘बाल तक’ वाला मूल मुहावरा पूर्ण और अक्षत बचाव को दर्शाता है। यह हिन्दी रूप उसकी ठोस छवि और अर्थ दोनों को सुरक्षित रखता है।
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: उनके सभी विरोधियों पर ज्वाला भेजी
  rationale: ‘ज्वाला’ φλόγα और ‘विरोधियों’ ὑπεναντίοις का सीधा अर्थ देता है; वाक्य में समन्वित क्रिया हिन्दी प्रवाह के अनुकूल है।
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: बाबुल प्रदेश में
  rationale: यह घटना का भौगोलिक स्थान बताता है। ‘बाबुल प्रदेश’ आधुनिक हिन्दी पाठक के लिए ‘बेबीलोनिया’ से अधिक सुबोध है और क्षेत्र का भाव रखता है।
theological_decisions:
- issue: भट्ठी में तीन युवकों की कथा की ओर संकेत
  choice: मूल के अनुसार केवल ‘तीन साथियों’ कहना
  alternative: उनके नाम जोड़ना या उन्हें स्पष्टतः ‘तीन युवक’ कहना
  rationale: यूनानी पाठ पाठक की परिचित कथा-स्मृति पर निर्भर करता है; नाम या अतिरिक्त पहचान जोड़ना अनावश्यक सामंजस्य होगा।
- issue: τοῖς κενοῖς का धार्मिक आशय
  choice: ‘खोखली वस्तुओं’ के रूप में अपेक्षाकृत शाब्दिक अनुवाद
  alternative: ‘मूर्तियों’ या ‘झूठे देवताओं’ का व्याख्यात्मक अनुवाद
  rationale: संदर्भ में आशय झूठी उपास्य-वस्तुएँ हैं, किन्तु मूल उन्हें उनकी रिक्तता और निष्फलता के आधार पर वर्णित करता है। पाठ में वह तनाव रखा गया है और पादटिप्पणी में संकेत स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ईश्वर को संबोधित करने के लिए एकवचन ‘तू’ चुना गया है, जो बाइबिलीय प्रार्थना में निकटता और प्रत्यक्ष संबोधन व्यक्त करता है। वाक्य की दीर्घ संरचना मूल यूनानी प्रार्थना-वाक्य के क्रम को बनाए रखते हुए हिन्दी में अर्धविराम से स्पष्ट की गई है।
