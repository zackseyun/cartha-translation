base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: hi
  text: व्यर्थ सोच वाले लोग[b] तेरे प्रियजनों के विनाश पर व्यर्थ वस्तुओं[a] की बड़ाई न करें और यह न कहें, “उनके परमेश्वर ने भी उन्हें नहीं छुड़ाया[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मी वस्तुओं” अथवा “मूर्तियों।” यूनानी में शाब्दिक अर्थ “व्यर्थ वस्तुएँ” है और संभवतः इसमें विवादात्मक तिरस्कार का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “व्यर्थ-बुद्धि वाले।” यूनानी में यहाँ और “व्यर्थ वस्तुओं” में जानबूझकर एक ही मूल से बना शब्द-साम्य है।
    reason: lexical_alternative
  - marker: c
    text: या “बचाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: स्तुति न करें
  rationale: μή के साथ तृतीय-पुरुष आज्ञार्थक को प्रार्थनात्मक निषेध के रूप में रखा गया है। ‘स्तुति न करें’ εὐλογέω का स्वाभाविक हिन्दी रूप है और विरोधियों को सीधे संबोधित करने के बजाय परमेश्वर से की गई विनती का भाव बनाए रखता है।
- source_word: τοῖς ματαίοις
  choice: व्यर्थ वस्तुओं
  rationale: नपुंसकलिंग बहुवचन विशेषण का संज्ञात्मक प्रयोग ऐसी वस्तुओं के लिए है जो व्यर्थ या खोखली हैं। ‘मूर्तियों’ कहना संभव है, पर यूनानी पाठ जितना स्पष्ट करता है उससे अधिक विशिष्ट अर्थ होता; ‘व्यर्थ’ साथ आने वाले ματαιόφρονες के साथ शब्द-साम्य भी बनाए रखता है।
- source_word: οἱ ματαιόφρονες
  choice: व्यर्थ-बुद्धि वाले लोग
  rationale: यह संयुक्त शब्द उन लोगों को बताता है जिनकी सोच व्यर्थ या खोखली है। यह रूप आधुनिक पाठक के लिए बोधगम्य रहते हुए τοῖς ματαίοις के साथ जानबूझकर किए गए शब्द-साम्य को बचाता है।
- source_word: ἐπὶ τῇ ... ἀπωλείᾳ
  choice: विनाश पर
  rationale: ἐπί और संबंधकारक यहाँ स्तुति या उल्लास के अवसर अथवा आधार को व्यक्त करते हैं; ‘विनाश पर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τῶν ἠγαπημένων σου
  choice: तेरे प्रिय जनों
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त परमेश्वर के प्रेम के पात्र लोगों को सूचित करता है। ‘प्रिय जन’ उस संबंध को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: उनके परमेश्वर ने भी उन्हें नहीं छुड़ाया
  rationale: οὐδέ का ‘भी ... नहीं’ और ἐρύσατο का ‘छुड़ाया’ स्पष्ट आधुनिक हिन्दी में मूल कथन का बल बनाए रखते हैं।
theological_decisions:
- issue: क्या ματαίοις को विशेष रूप से मूर्तियों के अर्थ में लिया जाए या सामान्यतः व्यर्थ वस्तुओं के अर्थ में
  choice: 'सामान्य अर्थ: ‘व्यर्थ वस्तुओं’'
  alternative: ‘मूर्तियों’ अथवा ‘निकम्मी वस्तुओं’
  rationale: यहूदी विवादात्मक भाषा में μάταια मूर्तियों की ओर संकेत कर सकता है, पर इस पद में मूर्तियों का स्पष्ट नाम नहीं है। व्यापक अनुवाद संभावित संकेत को खुला रखता और पाठ से अधिक संकीर्ण धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘व्यर्थ-बुद्धि’ हल्का संयुक्त रूप है, जिसका उद्देश्य यूनानी शब्द-साम्य को हिन्दी में यथासंभव बनाए रखना है; ‘तेरे’ प्रत्यक्ष ईश-संबोधन के पारंपरिक किंतु आज भी बोधगम्य एकवचन रूप को दर्शाता है।
