  yaml_path: translation/deuterocanon/3_maccabees/006/029.yaml
  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
translation:
  language: hi
  text: उसने ये बातें कहीं; लेकिन वे क्षण भर में[a] मुक्त किए जाने के बाद अपने पवित्र उद्धारकर्ता परमेश्वर[b] को धन्य कह रहे थे, क्योंकि वे अभी-अभी मृत्यु से बच निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुरंत’ अथवा ‘बहुत थोड़े समय में।’ यूनानी मुहावरा अत्यंत छोटे समयांतराल को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने पवित्र परमेश्वर और उद्धारकर्ता।’ यूनानी पदबंध को परमेश्वर के लिए जुड़ी हुई उपाधियों के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: कहीं
  rationale: यहाँ क्रिया का अर्थ पिछली बातों को कह देना या व्यक्त करना है; ‘कहीं’ आधुनिक हिन्दी में स्वाभाविक है और कथात्मक संदर्भ के अनुकूल है।
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: क्षण भर में
  rationale: यह यूनानी मुहावरा अत्यंत थोड़े समय, लगभग तत्काल, को व्यक्त करता है।
- source_word: λυθέντες
  choice: बंधन से मुक्त होकर
  rationale: निष्क्रिय कृदंत उनके छुड़ाए जाने को दर्शाता है; संदर्भ में निहित बंधन को स्पष्ट करने से हिन्दी स्वाभाविक रहती है।
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: अपने पवित्र उद्धारकर्ता परमेश्वर
  rationale: यह पदबंध परमेश्वर के लिए जुड़े हुए विशेषणों और उपाधियों को एक साथ रखता है; अनुवाद उसी सघन संबंध को बनाए रखता है।
- source_word: ηὐλόγουν
  choice: धन्य कहने लगे
  rationale: क्रिया का मूल अर्थ आशीर्वाद देना या धन्य कहना है; यह चयन केवल ‘स्तुति करना’ कहने की अपेक्षा बाइबलीय अर्थ को अधिक निकटता से रखता है।
- source_word: ἄρτι
  choice: अभी-अभी
  rationale: यह उनके मृत्यु से बच निकलने की तात्कालिकता को व्यक्त करता है।
- source_word: τὸν θάνατον ἐκπεφυγότες
  choice: मृत्यु से बच निकले थे
  rationale: पूर्ण कृदंत एक पूरी हो चुकी मुक्ति और उसके वर्तमान परिणाम को दर्शाता है; हिन्दी में यह रूप दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए σωτῆρα का अनुवाद
  choice: उद्धारकर्ता
  alternative: छुड़ानेवाला
  rationale: ‘उद्धारकर्ता’ σωτήρ का सामान्य और धर्मवैचारिक भार वाला हिन्दी समतुल्य है, जबकि इस प्रसंग में वास्तविक संकट से छुड़ाने का भाव भी बना रहता है।
- issue: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν में उपाधियों का संबंध
  choice: अपने पवित्र उद्धारकर्ता परमेश्वर
  alternative: अपने पवित्र परमेश्वर और उद्धारकर्ता
  rationale: यूनानी पदों को एक सघन उपाधि-समूह के रूप में पढ़ा जा सकता है; मुख्य पाठ इस संरचना को सुरक्षित रखता है, जबकि पादटिप्पणी दूसरी संभव व्याख्या बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘धन्य कहने लगे’ बाइबलीय भाव बनाए रखता है; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए अंतिम कृदंत को कारणवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
