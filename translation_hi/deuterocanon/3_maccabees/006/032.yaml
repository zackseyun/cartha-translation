base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: hi
  text: और जब उन्होंने विलाप का अपना अत्यन्त शोकपूर्ण गीत समाप्त किया, तब उन्होंने अपने पुरखों का गीत छेड़ दिया और इस्राएल के उद्धारकर्ता तथा अद्भुत काम करनेवाले परमेश्वर की स्तुति करने लगे। फिर शोक की हर पुकार और चीत्कार को दूर करके वे शान्तिपूर्ण आनन्द के चिन्ह के रूप में नृत्य-दल[a] बनाने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे गायक-मंडलियाँ बनाने लगे।” यूनानी शब्द χορούς नृत्य-दलों या गायक-मंडलियों—दोनों को सूचित कर सकता है; यहाँ उत्सव का प्रसंग नृत्य-दलों के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλήξαντες
  choice: जब उन्होंने ... समाप्त किया
