- source_word: ἀνέλαβον ᾠδὴν πάτριον
  choice: अपने पुरखों का गीत छेड़ दिया
  rationale: ἀνέλαβον गीत आरम्भ करने का भाव देता है और πάτριον पैतृक अथवा पूर्वजों से चली आई परम्परा को सूचित करता है।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह बचाने अथवा छुड़ानेवाले के अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τερατοποιὸν
  choice: अद्भुत काम करनेवाले
  rationale: परमेश्वर को आश्चर्यकर्म करनेवाले के रूप में बताता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
- source_word: οἰμωγὴν ... καὶ κωκυτὸν
  choice: शोक की हर पुकार और चीत्कार
  rationale: दोनों शब्द दुःख की श्रव्य अभिव्यक्तियाँ हैं; हिन्दी में उनकी तीव्रता और भिन्नता बनी रहती है।
- source_word: ἀπωσάμενοι
  choice: दूर करके
  rationale: शोकपूर्ण अभिव्यक्तियों को निर्णायक रूप से त्याग देने का भाव सहज हिन्दी में देता है।
- source_word: χοροὺς συνίσταντο
  choice: नृत्य-दल बनाने लगे
  rationale: χορός नृत्य-मंडली या गायक-मंडली दोनों हो सकता है; उत्सवी प्रसंग नृत्य का समर्थन करता है, जबकि ‘दल’ सामूहिक अर्थ बनाए रखता है।
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: शांतिमय आनन्द के चिन्ह के रूप में
  rationale: σημεῖον, εὐφροσύνη और εἰρηνικός के क्रमशः चिन्ह, आनन्द और शान्तिपूर्ण गुण को सुरक्षित रखता है।
theological_decisions:
- issue: ‘इस्राएल के उद्धारकर्ता तथा अद्भुत काम करनेवाले’ का संदर्भ
  choice: दोनों उपाधियाँ परमेश्वर के लिए रखी गई हैं।
  alternative: उपाधियों को किसी अन्य उद्धारकर्ता अथवा मध्यस्थ से जोड़ना।
  rationale: यूनानी पदबंध में θεόν के साथ τὸν Ἰσραὴλ σωτῆρα καὶ τερατοποιὸν स्पष्ट समानाधिकरण में है; इसलिए बिना किसी अतिरिक्त साम्प्रदायिक व्याख्या के ये उपाधियाँ सीधे परमेश्वर के लिए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘पुरखों का गीत’ पैतृक परम्परा का भाव रखता है; ‘परमेश्वर’ doxological संदर्भ के अनुकूल है। यूनानी पाठ में πάτριον ‘गीत’ को विशेषित करता है, इसलिए अंग्रेज़ी परामर्श-पाठ की पहली पादटिप्पणी में दिखी स्थानगत असंगति को नहीं अपनाया गया।
