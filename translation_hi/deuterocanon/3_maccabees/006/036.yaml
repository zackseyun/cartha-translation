base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: hi
  text: और इन बातों के विषय में एक साझा विधान ठहराकर उन्होंने अपने पूरे परदेशवासी समुदाय के लिए पीढ़ी-दर-पीढ़ी यह निश्चय किया कि पहले बताए गए दिनों को आनन्द के दिनों के रूप में मनाया जाए—मद्यपान और पेटूपन के लिए नहीं, बल्कि उस छुटकारे के कारण जो उन्हें देवताओं[a] के द्वारा मिला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से “देवताओं के द्वारा” है। यहूदी संदर्भ में आशय सम्भवतः एक परमेश्वर द्वारा दिए गए छुटकारे से है; बहुवचन रूप हस्तांतरित पाठ या किसी भाषिक प्रयोग को प्रतिबिम्बित कर सकता है।
    reason: मूल यूनानी के असामान्य बहुवचन और उसके एकेश्वरवादी संदर्भ को पारदर्शी रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: κοινὸν ... θεσμὸν
  choice: एक साझा विधान
  rationale: यह पदबंध पूरे समुदाय द्वारा स्वीकार किए गए औपचारिक और स्थायी नियम को व्यक्त करता है; ‘साझा विधान’ उसके सामुदायिक तथा विधिक दोनों भावों को बनाए रखता है।
- source_word: ὁρισάμενοι
  choice: ठहराया
  rationale: यहाँ क्रिया किसी बात को औपचारिक रूप से निर्धारित या स्थापित करने का भाव देती है; ‘ठहराया’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν
  choice: परदेश में बसे उनके पूरे समुदाय में
  rationale: παροικία यहाँ परदेश में रहने वाले समुदाय को सूचित करता है। यह अनुवाद केवल ‘समुदाय’ कहने की अपेक्षा उसके प्रवासी/परदेशी संदर्भ को भी व्यक्त करता है।
- source_word: εἰς γενεάς
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह आगे आने वाली पीढ़ियों तक निरन्तर पालन का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: τὰς προειρημένας ἡμέρας ἄγειν ... εὐφροσύνους
  choice: पहले बताए गए दिनों को आनन्द के दिनों के रूप में मनाया जाए
  rationale: दिनों के साथ ἄγειν का अर्थ उत्सवपूर्वक पालन करना है, और εὐφροσύνους उन दिनों के आनन्दपूर्ण स्वरूप को बताता है।
- source_word: πότου ... καὶ λιχνείας
  choice: पीने और खाने में अति करने
  rationale: πότος मदिरापान/पीने और λιχνεία भोजन की लालसा या अतिभोग को दर्शाता है। यह रूप सामान्य पाठक के लिए स्पष्ट है और नैतिक विरोध को व्यक्त करता है।
- source_word: σωτηρίας
  choice: छुटकारे
  rationale: इस ऐतिहासिक प्रसंग में शब्द ठोस संकट से बचाए जाने का संकेत देता है; ‘छुटकारा’ धार्मिक अर्थभार को रखते हुए घटना-सापेक्ष अर्थ स्पष्ट करता है।
- source_word: τῆς διὰ θεῶν γενομένης αὐτοῖς
  choice: जो उन्हें देवताओं के द्वारा मिला था
  rationale: प्राप्त यूनानी पाठ में θεῶν व्याकरणतः बहुवचन है। मूल-पाठ की वास्तविक असामान्यता और धार्मिक तनाव को मुख्य पाठ में बनाए रखा गया है, न कि उसे चुपचाप एकवचन बनाया गया है।
theological_decisions:
- issue: यहूदी कथानक में διὰ θεῶν का बहुवचन
  choice: देवताओं के द्वारा
  alternative: परमेश्वर के द्वारा
  rationale: Swete के दिए हुए यूनानी पाठ में θεῶν स्पष्ट रूप से बहुवचन है। यद्यपि यहूदी संदर्भ में आशय एक परमेश्वर से मिले छुटकारे का हो सकता है, एकवचन कर देना पाठ की असामान्यता को सुलझा देता। इसलिए बहुवचन मुख्य पाठ में रखा गया और संदर्भगत कठिनाई पादटिप्पणी में बताई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। ‘परदेश में बसे ... समुदाय’ से ऐतिहासिक प्रवासी संदर्भ स्पष्ट किया गया है। वाक्य को पठनीय बनाने के लिए यूनानी की लम्बी संरचना दो वाक्यों में बाँटी गई है; अर्थगत सम्बन्ध बनाए रखा गया है।
