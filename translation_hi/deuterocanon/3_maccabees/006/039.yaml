  yaml_path: translation/deuterocanon/3_maccabees/006/039.yaml
  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: hi
  text: इन सबमें भी, सब पर प्रभुता रखनेवाले ने अपनी दया को महिमापूर्वक प्रकट करके उन्हें एक साथ सकुशल[a] बचा लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘बिना ठोकर खाए’ या ‘बिना गिरे’ है; यहाँ आशय संभवतः यह है कि वे बिना हानि के बचा लिए गए।
    reason: lexical_alternative
  - marker: b
    text: ‘एक साथ’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘एक मन होकर’ या ‘एकमत होकर’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς καὶ
  choice: इन सबमें भी
  rationale: संबंधवाचक वाक्यांश पिछली घटनाओं या परिस्थितियों की ओर संकेत करता है। ‘इन सबमें भी’ संबंध को बनाए रखता है, पर उसके पूर्वपद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μεγαλοδόξως
  choice: बड़ी महिमा के साथ
  rationale: यह क्रियाविशेषण दया के प्रकट किए जाने की महिमामय रीति बताता है और कथन की ऊँची शैली को बनाए रखता है।
- source_word: ἐπιφάνας
  choice: प्रकट करके
  rationale: ἔλεος इसके कर्म के रूप में आया है, इसलिए यहाँ ‘दिखाई देकर’ की अपेक्षा ‘प्रकट करके’ स्वाभाविक और अर्थानुकूल है। कृदंत को पूर्वकालिक/सहायक क्रिया के रूप में रखा गया है।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: अपनी दया
  rationale: ἔλεος के लिए ‘दया’ प्रचलित बाइबलीय और सहज हिन्दी है; आत्मवाचक ‘अपनी’ हिन्दी वाक्य में कर्ता परमेश्वर की ओर स्पष्ट रूप से लौटता है।
- source_word: ὁ τῶν πάντων δυνάστης
  choice: सब पर प्रभुता रखनेवाला
  rationale: δυνάστης शासन और सामर्थ्य से युक्त अधिकारी को दर्शाता है। यह अनुवाद पदवी का अर्थ रखता है, पर इसे παντοκράτωρ जैसे किसी भिन्न पारंपरिक ईश्वरीय नाम में नहीं बदलता।
- source_word: ἀπταίστους
  choice: सकुशल
  rationale: शब्दशः अर्थ ‘बिना ठोकर खाए/बिना गिरे’ है; उद्धार के इस प्रसंग में यह सुरक्षित और अहानिकर बच निकलने का भाव देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: ἐρρύσατο
  choice: बचा लिया
  rationale: क्रिया संकट या खतरे से छुड़ाने का अर्थ देती है। ‘बचा लिया’ आधुनिक हिन्दी में स्पष्ट और कथात्मक रूप से स्वाभाविक है।
- source_word: ὁμοθυμαδόν
  choice: उन सबको एक साथ
  rationale: यह क्रियाविशेषण सामूहिकता और संभवतः एकमतता—दोनों का भाव दे सकता है। यहाँ कर्म ‘उन्हें’ के साथ सामूहिक उद्धार का अर्थ अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय पदवी ὁ τῶν πάντων δυνάστης का अनुवाद
  choice: सब पर प्रभुता रखनेवाला
  alternative: सर्वशक्तिमान; सबका शासक
  rationale: मूल में δυνάστης है, παντοκράτωρ नहीं। इसलिए शासन-सामर्थ्य का भाव रखा गया है, पर पाठ से अधिक विशिष्ट पारंपरिक पदवी आरोपित नहीं की गई।
- issue: ἀπταίστους में उद्धार की दशा
  choice: सकुशल
  alternative: बिना ठोकर खाए; बिना गिरे
  rationale: प्रसंग में यह उनके अहानिकर बचाए जाने को व्यक्त करता है। फिर भी मूल की ठोकर/गिरने की छवि को पादटिप्पणी में रखा गया है ताकि अर्थ की संभावित रूपकात्मक धार समाप्त न हो।
- issue: ὁμοθυμαδόν की सामूहिकता अथवा एकमतता
  choice: एक साथ
  alternative: एक मन होकर; एकमत होकर
  rationale: वाक्य-विन्यास में यह उन सबके सामूहिक रूप से बचाए जाने को सहजता से व्यक्त करता है, किंतु यूनानी शब्द एकमतता भी सूचित कर सकता है; यह विकल्प पादटिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य में ईश्वरीय पदवी को अर्थपूर्ण वर्णन के रूप में दिया गया है। ‘सकुशल’ मुख्य अर्थ को स्वाभाविक बनाता है, जबकि मूल बिंब और ὁμοθυμαδόν की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित हैं।
