translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यूनानी वाक्य की दो मुख्य क्रियाओं को हिन्दी में दो वाक्यों में बाँटा गया है ताकि समय-संबंध स्पष्ट रहे। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘feasted’ के बाद था, पर उसकी विषयवस्तु ἐντυχία (‘निवेदन’) से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न को ‘निवेदन’ के बाद रखा गया है।
