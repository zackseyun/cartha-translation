  yaml_path: translation/deuterocanon/3_maccabees/006/040.yaml
  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
translation:
  language: hi
  text: और वे सब राजा की व्यवस्था में चौदहवें दिन तक भोज करते रहे। उसी दिन उन्होंने अपनी रिहाई के विषय में निवेदन[a] भी किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी रिहाई के लिए औपचारिक याचिका प्रस्तुत की।” यूनानी पद किसी उच्च अधिकारी से किए गए औपचारिक निवेदन या अपील को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: भोज करते रहे
  rationale: यह क्रिया उत्सवपूर्ण भोज का आनंद लेने का भाव देती है; ‘भोज करते रहे’ निरंतरता और ठोस क्रिया, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάνθʼ
  choice: वे सब
  rationale: यहाँ इसका सामूहिक अर्थ है और ‘वे सब’ हिन्दी में सहज रूप से सभी संबंधित लोगों को समेटता है।
- source_word: ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: राजा की ओर से किए गए प्रबंध पर
  rationale: यह पद बताता है कि भोज के लिए आवश्यक व्यवस्था या खर्च राजा उपलब्ध करा रहा था; यह अनुवाद साधन या प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: चौदहवें दिन तक
  rationale: स्त्रीलिंग क्रमवाचक संख्या से प्रसंगानुसार ‘दिन’ समझा जाता है; स्पष्टता के लिए इसे हिन्दी में व्यक्त किया गया है।
- source_word: ἐν ᾗ
  choice: उसी दिन
  rationale: संबंधवाचक पद चौदहवें दिन की ओर संकेत करता है; ‘उसी दिन’ औपचारिक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: निवेदन किया
  rationale: ἐντυχία किसी उच्च अधिकारी के सामने औपचारिक विनती, याचिका या अपील को सूचित कर सकता है; ‘निवेदन किया’ इस औपचारिकता को बनाए रखता है, पर किसी प्रत्यक्ष भेंट को निश्चित नहीं मानता।
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: अपनी रिहाई के विषय में
  rationale: ἀπόλυσις यहाँ बंधन या रोक से मुक्त किए जाने को दर्शाता है, और περί का निकट अर्थ ‘के विषय में’ से सुरक्षित रहता है।
