base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: hi
  text: सभी राष्ट्रों को दिखाया जाए कि, हे प्रभु, आप हमारे साथ हैं और आपने हमसे अपना मुख नहीं फेरा है। परन्तु जैसा आपने कहा था, “उनके शत्रुओं के देश में रहते हुए भी मैंने उनकी उपेक्षा नहीं की,”[a] वैसे ही इसे पूरा कीजिए[b], हे प्रभु।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन उस वाचा-संबंधी भाषा की प्रतिध्वनि है जिसमें परमेश्वर अपने लोगों को उनके शत्रुओं के देश में भी न ठुकराने की प्रतिज्ञा करते हैं। ‘उपेक्षा नहीं की’ का अनुवाद ‘अनदेखा नहीं किया’ भी हो सकता है।
    reason: cross_reference
  - marker: b
    text: या, “इसे पूर्णता तक पहुँचाइए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: दिखाया जाए
  rationale: अओरिस्ट कर्मवाच्य आज्ञार्थक की प्रार्थनात्मक शक्ति और कर्मवाच्य रूप को सहज हिन्दी में बनाए रखता है।
- source_word: πᾶσιν ἔθνεσιν
  choice: सभी राष्ट्रों को
  rationale: यहाँ ἔθνη व्यापक रूप से राष्ट्रों या लोगों को सूचित करता है; ‘राष्ट्र’ आधुनिक हिन्दी में स्पष्ट है और ‘जातियों’ से उत्पन्न जाति-व्यवस्था संबंधी भ्रम से बचाता है।
- source_word: μεθʼ ἡμῶν εἶ
  choice: आप हमारे साथ हैं
  rationale: परमेश्वर की उपस्थिति से जुड़ी वाचा-संबंधी भाषा का सीधा और स्वाभाविक अनुवाद।
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: आपने हमसे अपना मुख नहीं फेरा है
  rationale: मूल यूनानी में ‘मुख’ स्पष्ट है; इसे बनाए रखने से अनुग्रह या विमुखता का बाइबलीय रूपक सुरक्षित रहता है।
- source_word: ὑπεριδον
  choice: मैंने उनकी उपेक्षा नहीं की
  rationale: क्रिया का आशय शत्रुओं के देश में भी लोगों को अनदेखा या त्याग न देना है। ‘उपेक्षा’ तिरस्कार का अनावश्यक रूप से अधिक प्रबल भाव जोड़े बिना अर्थ व्यक्त करती है।
- source_word: ἐπίτελεσον
  choice: इसे पूरा कीजिए
  rationale: आज्ञार्थक क्रिया परमेश्वर से अपने कहे हुए वचन को कार्यरूप में पूर्ण करने की विनती करती है। हिन्दी में कर्म को सर्वनाम से व्यक्त करना स्वाभाविक है, यद्यपि यूनानी में वह अंतर्निहित है।
- source_word: καθὼς εἶπας
  choice: जैसा आपने कहा था
  rationale: यह पूर्व में कहे गए ईश्वरीय वचन का सीधा उद्धरण प्रस्तुत करता है और καθώς की तुलनात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: κύριε का अनुवाद
  choice: हे प्रभु
  alternative: हे स्वामी
  rationale: प्रार्थना में κύριος परमेश्वर की उपाधि है; ‘प्रभु’ उसका प्रचलित, गरिमापूर्ण और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी अनुवाद है।
- issue: निर्वासन-संबंधी अंतर्निहित शास्त्रीय उद्धरण
  choice: सीधे कथन के रूप में उद्धरण-चिह्नों सहित
  alternative: बिना उद्धरण-चिह्नों के परोक्ष कथन
  rationale: εἶπας के बाद यूनानी पाठ सीधे ईश्वरीय वचन को रखता है। सीधा उद्धरण वाचा-संबंधी प्रतिज्ञा की प्रतिध्वनि को सुरक्षित रखता है, पर उसके आशय को पाठ से अधिक निश्चित नहीं करता।
- issue: οὕτως ἐπίτελεσον में अंतर्निहित कर्म
  choice: उसी प्रकार इसे पूरा कीजिए
  alternative: उसी प्रकार पूरा कीजिए
  rationale: यूनानी में कर्म स्पष्ट संज्ञा के रूप में नहीं है; हिन्दी में ‘इसे’ जोड़ना व्याकरणतः स्वाभाविक है और उसे पूर्वोक्त वचन या कार्य से जोड़ता है, बिना यह निश्चित किए कि उसका विस्तार क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ और ‘कीजिए’ प्रयुक्त हैं। ‘राष्ट्र’ को ‘जाति’ पर वरीयता दी गई है ताकि आधुनिक हिन्दी में जाति-व्यवस्था का अनपेक्षित अर्थ न आए।
