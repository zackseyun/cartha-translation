  text: And they rose up[a], and filled the force of their adversaries with confusion and cowardice[b], and bound them with immovable fetters.
translation:
  language: hi
  text: और वे उनके विरुद्ध खड़े हो गए[a], और उन्होंने अपने विरोधियों की सेना को घबराहट और कायरता से भर दिया[b], और उन्हें अचल बेड़ियों में जकड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उनका सामना किया”; यूनानी क्रिया का अर्थ विरोध करना या किसी के विरुद्ध डटकर खड़ा होना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्होंने विरोधियों की सेना को घबराहट और कायरता से भर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: उनके विरुद्ध खड़े हो गए
  rationale: क्रिया ἀνθίστημι का मूल भाव किसी के विरुद्ध खड़े होने या उसका सामना करने का है। यह चयन प्रतिरोध का अर्थ स्पष्ट रखता है और केवल शारीरिक रूप से उठ खड़े होने का अर्थ नहीं थोपता।
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: अपने विरोधियों की सेना
  rationale: इस सैनिक प्रसंग में δύναμις अमूर्त शक्ति के बजाय विरोधी सैन्य दल को सूचित करता है; इसलिए सहज हिन्दी में ‘सेना’ उपयुक्त है। ὑπεναντίων के लिए ‘विरोधियों’ मूल के तटस्थ विरोधात्मक भाव को बनाए रखता है।
- source_word: ταραχῆς καὶ δειλίας
  choice: घबराहट और कायरता
  rationale: ταραχή की अव्यवस्था तथा व्याकुलता को ‘घबराहट’ और δειλία की भीरुता को ‘कायरता’ व्यक्त करती है। ‘आतंक’ कहना δειλία को आवश्यकता से अधिक तीव्र बना सकता था।
- source_word: ἀκινήτοις πέδαις
  choice: अचल बेड़ियों
  rationale: πέδαι पैरों को बाँधने वाली बेड़ियों का चित्र प्रस्तुत करता है और ἀκινήτοις उनकी अटल, न हट सकने वाली दशा पर बल देता है। ‘अचल बेड़ियाँ’ उस असामान्य किंतु प्रभावशाली रूपक को सुरक्षित रखता है।
- source_word: ἔδησαν
  choice: जकड़ दिया
  rationale: δέω का अर्थ बाँधना है; बेड़ियों के साथ ‘जकड़ दिया’ आधुनिक हिन्दी में स्वाभाविक है और बंधन की दृढ़ता व्यक्त करता है।
