base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: hi
  text: तूने अश्शूरियों के दमनकारी राजा सन्हेरीब[a] को—जो अपनी अनगिनत सेनाओं के कारण अहंकार से फूल उठा था, भाले के बल पर सारी धरती को पहले ही अपने हाथ के अधीन कर चुका था[b], और तेरे पवित्र नगर के विरुद्ध अभिमान से उठ खड़ा हुआ था, डींग और ढिठाई से कठोर बातें बोलता था—तूने ही, हे अधिपति[c], चूर कर दिया, और बहुत-से राष्ट्रों के सामने अपना सामर्थ्य प्रत्यक्ष करते हुए दिखाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दमनकारी’ के स्थान पर ‘कठोर’ या ‘भयावह’ भी संभव है; यूनानी विशेषण किसी बोझिल, कठोर या भयावह व्यक्ति का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “भाले से सारी धरती को पहले ही अपने हाथ के अधीन कर लिया था।”'
    reason: lexical_alternative
  - marker: c
    text: यहाँ यूनानी संबोधन देस्पोतेस है, जिसका अर्थ अधिकार रखने वाला “अधिपति” या “स्वामी” है; यह सामान्यतः “प्रभु” अनूदित होने वाले क्यूरियोस से भिन्न शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: अनगिनत सेनाओं
  rationale: सैन्य प्रसंग में δυνάμεις का अर्थ सैनिक बल या सेनाएँ है; ἀναρίθμητος उनकी गणना से परे विशाल संख्या बताता है।
- source_word: γαυρωθέντα
  choice: घमंड करता था
  rationale: यह कृदंत सैन्य शक्ति के कारण उपजे अहंकार को व्यक्त करता है; वर्तमान हिंदी में यह सहज और स्पष्ट है।
- source_word: βαρὺν
  choice: दमनकारी
  rationale: राजा के विशेषण के रूप में βαρύς यहाँ बोझिल, कठोर या उत्पीड़क होने का भाव दे सकता है। 'दमनकारी' उस शत्रुतापूर्ण चरित्र को व्यक्त करता है, जबकि पाठ की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
- source_word: δόρατι
  choice: भाले के बल पर
  rationale: यह ठोस युद्ध-चित्र को बनाए रखता है और हिंदी में साधन के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑποχείριον
  choice: अपने हाथ के अधीन
  rationale: यूनानी मुहावरे की 'हाथ के नीचे' वाली छवि और अधीनता, दोनों सुरक्षित रहते हैं।
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  choice: तेरे पवित्र नगर के विरुद्ध अभिमान से उठ खड़ा होकर
  rationale: μετεωρίζω में ऊपर उठने और घमंड करने, दोनों की छाया है; ἐπί यहाँ विरोध की दिशा दिखाता है।
- source_word: βαρέα λαλοῦντα
  choice: कठोर बातें बोलता था
  rationale: वाक्यांश अहंकारी और दुस्साहसी वचन का संकेत देता है, पर उनकी सामग्री को स्पष्ट नहीं करता; अनुवाद भी उसे अनिर्दिष्ट रखता है।
- source_word: κόμπῳ καὶ θράσει
  choice: डींग और ढिठाई से
  rationale: यह जोड़ी शेखी और निर्लज्ज दुस्साहस को स्वाभाविक आधुनिक हिंदी में व्यक्त करती है।
- source_word: ἔθραυσας
  choice: चूर कर दिया
  rationale: क्रिया निर्णायक रूप से तोड़ डालने या परास्त करने की प्रबल छवि रखती है।
- source_word: ἔκδηλον δεικνὺς τὸ σὸν κράτος
  choice: अपना सामर्थ्य प्रत्यक्ष कर दिया
  rationale: यह परमेश्वर की प्रकट और सार्वजनिक शक्ति को बताता है; हिंदी में मुख्य क्रिया से जुड़ा परिणाम स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: दैवी संबोधन δέσποτα
  choice: हे अधिपति
  alternative: हे प्रभु / हे स्वामी
  rationale: δेसπότης को सामान्य κύριος से अलग रखते हुए 'अधिपति' अधिकार और स्वामित्व का भाव देता है तथा प्रार्थना की गरिमा बनाए रखता है।
- issue: सन्हेरीब के यरूशलेम-विरोधी अभियान का ऐतिहासिक संकेत
  choice: केवल यूनानी पाठ में उपस्थित संकेत का सीधा अनुवाद
  alternative: राजाओं या यशायाह से विनाश अथवा छुटकारे का अतिरिक्त विवरण जोड़ना
  rationale: पद घटना की ओर संकेत करता है, पर समानांतर वृत्तांतों के विवरण नहीं देता; इसलिए कोई अतिरिक्त ऐतिहासिक या धर्मवैज्ञानिक सूचना नहीं जोड़ी गई।
- issue: ἔκδηλον δεικνὺς की क्रियात्मक संगति
  choice: चूर करने के परिणामस्वरूप सामर्थ्य को प्रत्यक्ष करना
  alternative: इसे एक पूर्णतः स्वतंत्र नई घटना बनाना
  rationale: यूनानी वर्तमान कृदंत मुख्य क्रिया ἔθραυσας से जुड़ा है; हिंदी में 'और ... प्रत्यक्ष कर दिया' उसी निकट संबंध को स्वाभाविक ढंग से रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर प्रार्थना के अनुरूप गरिमापूर्ण रखी गई है। 'तू/तेरा' का प्रयोग निकट और पारंपरिक दैवी संबोधन के रूप में किया गया है, अनादर के लिए नहीं। आरंभ और मुख्य क्रिया के पास 'तूने' की पुनरावृत्ति यूनानी के जोरदार σὺ ... σύ को दर्शाती है।
