  text: और यहूदी, जैसा कि हम पहले कह चुके हैं, पहले बताए गए गायन-दल को संगठित करके, भोज-उत्सव मनाते हुए हर्षपूर्ण धन्यवाद-स्तुतियों और भजनों के साथ समय बिताते रहे।
