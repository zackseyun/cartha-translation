lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: और यहूदी
  rationale: यहाँ Ἰουδαῖοι मिस्र में रहने वाले यहूदी धार्मिक-जातीय समुदाय को सूचित करता है; इसलिए भौगोलिक अर्थ वाले ‘यहूदिया के लोग’ की अपेक्षा ‘यहूदी’ अधिक स्पष्ट है।
- source_word: καθὼς προειρήκαμεν
  choice: जैसा हम पहले कह चुके हैं
  rationale: यह कथावाचक के पहले दिए गए विवरण की ओर संकेत करता है और यूनानी पूर्णकालीन भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συστησάμενοι
  choice: संगठित करके
  rationale: यह कृदन्त किसी समूह को एकत्र और व्यवस्थित करने की क्रिया बताता है; ‘संगठित करके’ χορόν के साथ स्वाभाविक है।
- source_word: τὸν προειρημένον χορὸν
  choice: पहले बताए गए गायन-दल
  rationale: χορός गायन, और कभी नृत्य, करने वाले सामूहिक दल को सूचित कर सकता है। भजनों वाले उपासना-संदर्भ में ‘गायन-दल’ सहज है, जबकि पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: μετʼ εὐωχίας
  choice: उत्सव-भोज करते हुए
  rationale: εὐωχία आनंदपूर्ण दावत या भोज सहित उत्सवी उल्लास को व्यक्त करता है; यह रूप हिन्दी में गतिविधि और उत्सव दोनों को स्पष्ट करता है।
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: हर्षपूर्ण धन्यवाद
  rationale: यहूदी-यूनानी आराधना-संदर्भ में ἐξομολόγησις प्रायः पाप-स्वीकार के बजाय परमेश्वर के प्रति धन्यवाद या स्तुति है; ἱλαραῖς उसके आनंदपूर्ण स्वर को दर्शाता है।
- source_word: καὶ ψαλμοῖς
  choice: और भजनों
  rationale: ψαλμοί के लिए ‘भजन’ सटीक, प्रचलित और आराधनात्मक संदर्भ में स्वाभाविक हिन्दी शब्द है।
- source_word: διῆγον
  choice: समय बिताते रहे
  rationale: अपूर्ण भूतकाल चलती हुई या समय तक जारी गतिविधि को दर्शाता है; ‘बिताते रहे’ इस कालगत भाव को सुरक्षित रखता है।
