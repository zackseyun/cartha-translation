base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: hi
  text: तब जिन लोगों का पहले तिरस्कार होता था और जो अधोलोक[a] के निकट थे—बल्कि उस पर पाँव रख चुके थे[b]—उन्होंने कटु और पीने में कठिन नियति के बदले छुटकारा दिलाने वाला मद्य-भोज[c] आयोजित किया। आनंद से भरकर उन्होंने उस स्थान को, जो उनके पतन और कब्र बनने के लिए तैयार किया गया था, भोज के लिए बिछाए गए आसनों में बाँट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृत्यु के निकट” अथवा “कब्र के निकट”; यूनानी में शाब्दिक रूप से “अधोलोक के निकट” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति का शाब्दिक अर्थ है कि वे अधोलोक पर “पाँव रख चुके थे”; यह इस बात की सजीव छवि है कि वे मानो मृतलोक में पहुँच ही चुके थे।
    reason: cultural_note
  - marker: c
    text: यहाँ अनूदित “मद्य-भोज” शब्द का अर्थ अधिक व्यापक रूप से उत्सवी भोज या पीने का उत्सव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: जिन लोगों का पहले तिरस्कार होता था
  rationale: यह सार्वजनिक निंदा और अपमान की अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πλησίον τοῦ ᾅδου
  choice: अधोलोक के निकट
  rationale: ᾅδης को केवल ‘मृत्यु’ या ‘कब्र’ में समतल किए बिना मृतकों के लोक की यूनानी छवि बनाए रखता है।
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: उस पर पाँव रख चुके थे
  rationale: 'पूर्ण कृदन्त की सजीव छवि बनाए रखता है: वे मानो अधोलोक पर पहुँच ही चुके थे।'
- source_word: μόρου
  choice: विनाश
  rationale: संदर्भ में μόρος आसन्न घातक अंत या दुर्दशा को सूचित करता है; ‘विनाश’ हिन्दी में इस गंभीर आशय को स्पष्ट रखता है।
- source_word: πικροῦ καὶ δυσαπότικου
  choice: कड़वे और पीने में कठिन
  rationale: पीने की उपमा सुरक्षित रहती है, जो आगे आने वाले κῶθων के मद्य-भोज से जानबूझकर जुड़ती है।
- source_word: κῶθωνα σωτήριον
  choice: छुटकारा दिलाने वाला मद्य-भोज
  rationale: κῶθων के सामूहिक उत्सवी पान के अर्थ और σωτήριον के संकट से बचाए जाने वाले आशय, दोनों को प्रकट करता है।
- source_word: συστησάμενοι
  choice: आयोजित किया
  rationale: अपने लिए उत्सवपूर्ण आयोजन करने के मध्यम-वाच्य भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον ἡτοιμασμένον
  choice: जो उनके पतन और कब्र बनने के लिए तैयार किया गया था
  rationale: स्थान के उनके विनाश और दफनाए जाने के लिए नियत होने की दोहरी भयावह छवि बनाए रखता है।
- source_word: κλισίας κατεμέρισαν
  choice: भोज में लेटने के स्थानों में बाँट दिया
  rationale: प्राचीन भोज में टेक लगाकर या लेटकर खाने की व्यवस्था को दर्शाता है और उस घातक स्थान के भोज-स्थल में बदलने की विडंबना सुरक्षित रखता है।
- source_word: πλήρεις χαρμονῆς
  choice: आनंद से भरकर
  rationale: उनकी दशा में आए उलटाव और उल्लास को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृत्यु / कब्र
  rationale: मूल पाठ मृतकों के लोक के लिए ᾅδης शब्द का स्पष्ट प्रयोग करता है। ‘अधोलोक’ उस छवि को बनाए रखता है, जबकि पाद-टिप्पणी उसके प्रसंगगत अर्थ को स्पष्ट करती है और किसी संकीर्ण परलोक-सिद्धांत को आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अधोलोक’, ‘पीने में कठिन’ और ‘भोज में लेटने के स्थान’ जैसे पद मूल यूनानी की असामान्य लेकिन महत्वपूर्ण छवियों को जानबूझकर सुरक्षित रखते हैं; पाद-टिप्पणियाँ आवश्यक सांस्कृतिक और शब्दार्थगत स्पष्टीकरण देती हैं।
