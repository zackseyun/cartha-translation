base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: hi
  text: और अब, हे उद्दंडता से घृणा करने वाले, दया से भरपूर, सबके न्यायाधीश, इस्राएल-वंश के पवित्र जनों के सामने शीघ्र प्रकट हो[a]; वे घृणित और व्यवस्थाहीन जातियों[c] के हाथों अपमानजनक अत्याचार सह रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आपको दिखा’; यहाँ आशय केवल आने से नहीं, बल्कि दिखाई देने योग्य हस्तक्षेप से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया में उद्दंड, अपमानित करनेवाले दुर्व्यवहार या अत्याचार का भाव है; इसका अनुवाद ‘उनके साथ घोर दुर्व्यवहार किया जा रहा है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘जातियाँ’ से आशय गैर-इस्राएली जनसमूहों से है; प्रसंगानुसार ‘अन्यजातियाँ’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μισόβρι
  choice: उद्दंडता से घृणा करनेवाले
  rationale: यह दुर्लभ संबोधन ὕβρις से जुड़ी उद्दंडता, घमंड और अपमानजनक अत्याचार से घृणा करनेवाले को दर्शाता है। ‘उद्दंडता’ इस व्यापक नैतिक भाव को स्वाभाविक हिन्दी में रखती है।
- source_word: πολυέλεε
  choice: दया से भरपूर
  rationale: यह यौगिक शब्द दया की प्रचुरता बताता है। ‘दया से भरपूर’ आधुनिक, सहज और संबोधन में स्वाभाविक है।
- source_word: τῶν ὅλων δίκαστα
  choice: सबके न्यायी
  rationale: मूल वाक्यांश का सार्वभौमिक विस्तार बनाए रखते हुए यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τάχος
  choice: शीघ्र
  rationale: यह क्रियाविशेषण तत्काल प्रत्यक्ष हस्तक्षेप की विनती करता है; ‘शीघ्र’ प्रार्थनात्मक गरिमा और तात्कालिकता दोनों रखता है।
- source_word: ἐπιφάνηθι
  choice: प्रकट हो
  rationale: प्रार्थना के प्रसंग में यह दिखाई देने योग्य उपस्थिति और उद्धारकारी हस्तक्षेप का आग्रह है। ‘प्रकट हो’ सीधे अर्थ को रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: विशेषण यहाँ संज्ञा के रूप में परमेश्वर के लिए अलग किए गए लोगों को दर्शाता है। ‘पवित्र जन’ बाद की किसी विशिष्ट धार्मिक पदवी को आरोपित नहीं करता।
- source_word: Ἰσραὴλ γένους
  choice: इस्राएल के वंश के
  rationale: γένος में वंश, कुल और जातीय समुदाय का भाव है। ‘वंश’ उसके वंशगत बल को बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: घृणित और व्यवस्थाहीन जातियों के हाथों
  rationale: दोनों तीखे विशेषण सुरक्षित रखे गए हैं। ἔθνη यहाँ गैर-इस्राएली जनसमूहों के लिए है; ‘जातियाँ’ उस सामूहिक अर्थ को रखता है।
- source_word: ὑβριζομένοις
  choice: अपमानजनक अत्याचार सह रहे हैं
  rationale: क्रिया सामान्य दुर्व्यवहार से अधिक उद्दंड, अपमानित करनेवाले उत्पीड़न का संकेत दे सकती है। यह चयन उस प्रबल अर्थ को पठनीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के लिए वाचागत पद τοῖς ἁγίοις
  choice: पवित्र जनों
  alternative: संतों; तेरे पवित्र लोगों
  rationale: पद इस प्रसंग में उत्पीड़ित इस्राएली समुदाय को परमेश्वर के लिए अलग किए गए लोगों के रूप में संबोधित करता है। ‘पवित्र जन’ अर्थ को सुरक्षित रखता है, पर बाद की कलीसियाई पदवी या मूल में निहित न होनेवाले ‘तेरे’ को नहीं जोड़ता।
- issue: γένος के जातीय-वंशगत अर्थ का निर्वाह
  choice: इस्राएल के वंश के
  alternative: इस्राएल के लोगों में से; इस्राएल-कुल के
  rationale: यूनानी पाठ वंश और समुदाय दोनों का संकेत देता है। ‘वंश’ इस आयाम को केवल धार्मिक पहचान में सीमित किए बिना व्यक्त करता है।
- issue: ἔθνη का प्रसंगगत संदर्भ
  choice: जातियाँ
  alternative: अन्यजातियाँ; राष्ट्र
  rationale: यहाँ शब्द गैर-इस्राएली उत्पीड़क जनसमूहों को दर्शाता है। मुख्य पाठ में तटस्थ ‘जातियाँ’ रखा गया है और प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है, ताकि कोई बाद की सांप्रदायिक धारणा न जोड़ी जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण रखी गई है। दुर्लभ संबोधन को समझने योग्य वाक्यांश में खोला गया है; मूल की तीखी निंदा और उत्पीड़न की गंभीरता को नरम नहीं किया गया।
