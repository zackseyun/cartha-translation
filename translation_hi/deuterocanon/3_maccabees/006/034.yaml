  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: hi
  text: और वे लोग, जो पहले उन्हें विनाश के लिए और पक्षियों का आहार बनने के लिए नियत मानते थे[a], और जिन्होंने आनन्द से उनका पंजीकरण किया था, गहरी आहें भरने लगे; उन्होंने अपने ऊपर लज्जा ओढ़ ली, और उनकी आग उगलती धृष्टता पूरे जोर से बुझा दी गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियत मानते थे’ के लिए प्रयुक्त यूनानी कृदन्त स्वीटे के पाठ में पाठगत और वाक्यगत दृष्टि से कठिन है। फिर भी पूरे उपवाक्य का आशय स्पष्ट है कि ये लोग पहले यहूदियों को विनाश और पक्षियों का आहार बनने के लिए नियत मानते थे।
    reason: textual_variant
  - marker: b
    text: या, ‘उनका अग्निमय दुस्साहस।’ यूनानी रूपक बहुत सजीव है और इस प्रसंग में स्पष्ट रूप से नकारात्मक है। ‘बुझा दिया गया’ आग के रूपक को बनाए रखता है; यूनानी क्रिया का रूप निष्क्रिय है।
    reason: lexical_alternative
