  yaml_path: translation/deuterocanon/3_maccabees/006/041.yaml
  text: 'And when the king agreed with them[a], he wrote them the following letter to the generals in each city[b], magnanimously setting out the full account:'
translation:
  language: hi
  text: 'तब राजा ने उनकी बात मान ली और उन्हें नीचे दिया हुआ यह पत्र[a] लिखा, जो हर नगर के सेनापतियों[b] के नाम था; उसमें उसने उदारतापूर्वक पूरी बात विस्तार से रखी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “नीचे लिखा हुआ पत्र” या “संलग्न पत्र।”'
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द στρατηγοί का अनुवाद “सैन्य अधिकारियों” या, कुछ प्रशासनिक संदर्भों में, “राज्यपालों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συναινέσας
  choice: उनकी बात मान ली
  rationale: यह συναινέω के सहमत होने या सहमति देने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पूर्ववर्ती प्रस्ताव की ओर संकेत बनाए रखता है।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: राजकीय पदवी का सीधा और मानक हिन्दी रूप।
- source_word: ἔγραψεν αὐτοῖς
  choice: उनके लिए ... लिखी
  rationale: द्वितीय αὐτοῖς को लाभार्थक अर्थ में लिया गया है; पत्र वास्तव में नगर-नगर के अधिकारियों को संबोधित है, इसलिए ‘उनके लिए’ हिन्दी में संबंध को अधिक स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: नीचे दी गई चिट्ठी
  rationale: ὑπογεγραμμένην का शाब्दिक भाव ‘नीचे लिखी हुई’ है; आगामी पत्र का परिचय देते समय ‘नीचे दी गई’ स्वाभाविक है। ‘चिट्ठी’ सामान्य पाठक के लिए सहज है और राजकीय पत्र के संदर्भ में भी उपयुक्त है।
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: हर नगर के सेनापतियों के नाम
  rationale: κατὰ πόλιν का वितरणात्मक अर्थ ‘हर नगर में’ है और πρὸς पत्र के संबोधन को दिखाता है। στρατηγοί का मूल सैन्य अर्थ ‘सेनापति’ से सुरक्षित रहता है।
- source_word: μεγαλοψύχως
  choice: उदार मन से
  rationale: यह शब्द उदारता, उच्च-मनस्कता और विशालहृदयता का भाव देता है; ‘उदार मन से’ आधुनिक हिन्दी में गरिमापूर्ण किंतु सहज है।
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: जिसमें ... पूरी बात विस्तारपूर्वक रखी
  rationale: संक्षिप्त यूनानी पदबंध पत्र की विस्तृत या पूर्ण विषयवस्तु की ओर संकेत करता है। यह हिन्दी रूप उसकी पूर्णता और विस्तार दोनों को बिना अस्वाभाविक शाब्दिकता के व्यक्त करता है।
