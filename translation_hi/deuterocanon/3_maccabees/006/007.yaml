base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: hi
  text: तू दानिय्येल को सकुशल प्रकाश में ले आया—उसे ईर्ष्या से उपजे बदनाम करने वाले आरोपों के कारण भूमि पर[a] सिंहों के सामने जंगली पशुओं का आहार बनने के लिए फेंक दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ एक कठिन पदबंध है, जिसका शाब्दिक अर्थ ‘भूमि पर’ है। इसे दानिय्येल की कथा के अनुसार ‘सिंहों की मांद में’ बनाकर सरल नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: ईर्ष्या से उपजे झूठे आरोपों के कारण
  rationale: διαβολαῖς दुर्भावनापूर्ण आरोप या निंदा को और φθόνου उनके स्रोत अथवा स्वभाव के रूप में ईर्ष्या को व्यक्त करता है। यह रूप instrumental dative का कारणात्मक भाव स्वाभाविक हिन्दी में रखता है।
- source_word: λέουσι
  choice: सिंहों के आगे
  rationale: सम्प्रदान बहुवचन बताता है कि दानिय्येल सिंहों के हवाले किया गया था; ‘के आगे’ हिन्दी में इस सौंपे जाने के भाव को सहज रूप से व्यक्त करता है।
- source_word: κατὰ γῆς
  choice: भूमि पर
  rationale: पाठ का कठिन स्थान ज्यों का त्यों स्थान-सूचक अर्थ में रखा गया है; इसे दानिय्येल की कथा से मिलाने के लिए ‘मांद में’ नहीं बनाया गया।
- source_word: ῥιφέντα
  choice: फेंक दिया गया था
  rationale: ῥίπτω की हिंसक निष्क्रिय क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θηρσὶ βορὰν
  choice: जंगली पशुओं का आहार बनने के लिए
  rationale: βορά भोजन अथवा शिकार और θηρσί जंगली पशुओं को सूचित करता है; यह अनुवाद विनाश के अभिप्राय को स्पष्ट रखता है।
- source_word: εἰς φῶς ἀνήγαγες
  choice: उजाले में ऊपर ले आया
  rationale: ‘ऊपर लाने’ और ‘उजाले में’ की मूल छवि दोनों को सुरक्षित रखता है, जबकि उद्धार का आशय भी समझ में आता है।
- source_word: ἀσινῆ
  choice: सकुशल
  rationale: अहानिकर या बिना चोट के बच निकलने का अर्थ संक्षिप्त, स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: सिंहों से दानिय्येल के छुटकारे की ओर संकेत
  choice: परमेश्वर को सीधे संबोधित करते हुए दानिय्येल के बचाव का वर्णन किया गया है, पर यूनानी पाठ से बाहर की कथा-वस्तु नहीं जोड़ी गई।
  alternative: ‘सिंहों की मांद’ जोड़कर दानिय्येल की प्रसिद्ध कथा के अनुरूप विस्तार करना।
  rationale: यूनानी पाठ दानिय्येल, सिंहों और उसके सकुशल उजाले में लाए जाने का स्पष्ट उल्लेख करता है, पर मांद का नहीं।
- issue: कठिन पदबंध κατὰ γῆς
  choice: ‘भूमि पर’ के रूप में सुरक्षित रखा गया।
  alternative: इसे दूषित मानकर छोड़ देना या ‘गड्ढे/मांद में’ कर देना।
  rationale: प्राप्त यूनानी पाठ की कठिनता को चुपचाप सुधारने या दूसरी कथा के अनुसार सामंजस्य बैठाने के बजाय ईमानदारी से बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक एकवचन संबोधन ‘तू’ रखा गया है। वाक्य को स्वाभाविक बनाने के लिए मुख्य उद्धार-कथन पहले और परिस्थितिजन्य विवरण बाद में रखा गया है।
