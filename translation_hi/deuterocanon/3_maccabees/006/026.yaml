  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: hi
  text: किसने उन लोगों को इतनी अन्यायपूर्ण रीति से क्रूरताओं से घेर दिया है, जो आरम्भ से ही हमारे प्रति सद्भाव रखने में हर प्रकार से सब जातियों से बढ़कर रहे हैं,[a] और जिन्होंने मनुष्यों के बीच आने वाले भयंकरतम खतरों में बार-बार अपने को सिद्ध किया है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आरम्भ से ही हमारे प्रति सद्भाव रखने में हर प्रकार से सब जातियों से अलग रहे हैं।” यूनानी क्रिया का अर्थ “भिन्न होना” अथवा इस संदर्भ में “बढ़कर होना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्यों के बीच आने वाले भयंकरतम खतरे” वाला यूनानी वाक्यांश कठिन है। इसका आशय मानवीय जीवन में आने वाले सबसे गंभीर खतरों से, अथवा मनुष्यों द्वारा सहे जाने वाले खतरों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: किसने
  rationale: यह आलंकारिक प्रश्न का स्वाभाविक और सीधा हिन्दी आरम्भ है।
- source_word: τοὺς ἐξ ἀρχῆς
  choice: उन लोगों को, जो आरम्भ से ही
  rationale: संज्ञार्थक यूनानी पदसमूह और उसके दीर्घकालिक समय-बोध को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: हमारे प्रति सद्भाव में
  rationale: εὔνοια के अनुकूलता, शुभेच्छा और सद्भाव के भाव को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: हर प्रकार से सब जातियों से बढ़कर रहे हैं
  rationale: संदर्भ में διαφέρω के ‘श्रेष्ठ होना/बढ़कर होना’ अर्थ को ग्रहण करता है, जबकि पादटिप्पणी उसके ‘भिन्न होना’ अर्थ की वास्तविक संभावना सुरक्षित रखती है।
- source_word: τοὺς ... ἐπιδειγμένους
  choice: जिन्होंने ... अपने को सिद्ध किया है
  rationale: मध्यवाच्य कृदन्त के आत्म-संदर्भित भाव को स्वाभाविक हिन्दी में व्यक्त करता है और केवल बाहरी प्रदर्शन का अर्थ नहीं देता।
- source_word: χειρίστους ... κινδύνους
  choice: भयंकरतम खतरों
  rationale: χειρίστους की अतिशयोक्तिपूर्ण तीव्रता को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: πλεονάκις
  choice: बार-बार
  rationale: पुनरावृत्ति के अर्थ को सामान्य पाठक के लिए सहज ढंग से व्यक्त करता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों के बीच आने वाले
  rationale: कठिन संबंधकारक पद को मानवीय जीवन या व्यवहार में उपस्थित खतरों के रूप में समझता है; इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: οὕτως ἀθέσμως
  choice: इतनी अधर्मपूर्ण रीति से
  rationale: ἀθέσμως के विधि, प्रथा और उचित मर्यादा के उल्लंघन वाले नैतिक बल को ‘गैरकानूनी’ तक सीमित किए बिना व्यक्त करता है।
- source_word: περιέβαλεν αἰκίαις
  choice: क्रूरताओं से घेर दिया है
  rationale: περιβάλλω की ‘चारों ओर घेरना’ छवि और αἰκίαις के बहुवचन अत्याचार/दुर्व्यवहार को सुरक्षित रखता है।
