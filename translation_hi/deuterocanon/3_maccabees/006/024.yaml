base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: hi
  text: तुमने राजाओं की मर्यादा भी लाँघ दी है और क्रूरता में अत्याचारियों को भी पीछे छोड़ दिया है। अब तुम मुझे ही—अपने उपकारी को—राजसत्ता और जीवन[a], दोनों से वंचित करने का प्रयास कर रहे हो और छिपकर ऐसी योजनाएँ बना रहे हो जो राज्य के हित में नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजसत्ता और आत्मा/श्वास से।’ यूनानी शब्द πνεῦμα का अर्थ ‘आत्मा,’ ‘श्वास,’ अथवा विस्तारित अर्थ में ‘जीवन’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: तुमने राजाओं की मर्यादा भी लाँघ दी है
  rationale: परिपूर्ण काल और παρα- उपसर्ग राजकीय आचरण की उचित सीमा से आगे निकल जाने का तीखा आरोप व्यक्त करते हैं। यह अनुवाद केवल ‘राज करना’ नहीं, बल्कि राजाओं के अनुरूप मर्यादा का उल्लंघन सामने लाता है।
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: क्रूरता में अत्याचारियों को भी पीछे छोड़ दिया है
  rationale: तुलनात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ὠμότης की कठोरता और निर्दयता ‘क्रूरता’ में स्पष्ट है।
- source_word: ἐμὲ αὐτὸν
  choice: मुझे ही
  rationale: आत्मवाचक बलाघात को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: अपने उपकारी को
  rationale: εὐεργέτης के व्यक्तिगत और सार्वजनिक, दोनों आशयों के लिए ‘उपकारी’ संक्षिप्त और प्रतिष्ठित पद है।
- source_word: τῆς ἀρχῆς
  choice: राजसत्ता
  rationale: यहाँ ἀρχή शासकीय पद अथवा अधिकार को सूचित करता है; ‘राजसत्ता’ राजनीतिक संदर्भ को स्पष्ट रखता है।
- source_word: τοῦ πνεύματος
  choice: जीवन
  rationale: राजसत्ता से हटाने और गुप्त षड्यंत्र के संदर्भ में πνεῦμα सांस अथवा जीवन-शक्ति के विस्तारित अर्थ में जीवन को सूचित करता है। मूल शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: μεθιστᾶν
  choice: वंचित करने
  rationale: एक ही हिन्दी क्रिया राजसत्ता और जीवन दोनों के साथ स्वाभाविक रूप से जुड़ती है और हटाने अथवा छीन लेने का भाव देती है।
- source_word: λάθρα μηχανώμενοι
  choice: छिपकर ... योजनाएँ बना रहे हो
  rationale: गुप्त और उद्देश्यपूर्ण षड्यंत्रकारी गतिविधि को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: ऐसी योजनाएँ ... जो राज्य के हित में नहीं हैं
  rationale: नकारात्मक मूल अभिव्यक्ति को ‘हानिकारक’ बनाकर तीव्र किए बिना राज्य के हित के प्रतिकूल बात को ज्यों का त्यों रखता है।
theological_decisions:
- issue: आरोप में πνεῦμα का अर्थ
  choice: ‘जीवन’
  alternative: ‘आत्मा’ अथवा ‘सांस’
  rationale: राजनीतिक सत्ता से हटाने और गुप्त षड्यंत्र के निकट संदर्भ में हत्या का प्रयास सबसे स्वाभाविक आशय है। फिर भी πνεῦμα की वास्तविक शब्दार्थगत व्यापकता को पादटिप्पणी में रखा गया है; यह मानव-स्वभाव के विषय में कोई सिद्धान्तगत निर्णय नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय आरोप की गरिमा और तीक्ष्णता बनाए रखती है। ‘मुझे ही’ मूल के बलाघात को सहज ढंग से व्यक्त करता है; डैश द्वारा ‘अपने उपकारी को’ की व्याख्यात्मक स्थिति स्पष्ट होती है।
