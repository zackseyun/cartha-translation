  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: hi
  text: और जब यहूदियों ने यह देखा, तो उन्होंने स्वर्ग की ओर ऊँचे स्वर से पुकारा। इससे पास के आँगन भी उनकी पुकार के साथ गूँज उठे[a], जिससे पूरे शिविर में बेकाबू दहशत फैल गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पास के घिरे हुए स्थान भी साथ-साथ गूँजने लगे।”
    reason: αὐλῶνας का अर्थ आँगन, अहाता या घिरा हुआ खुला स्थान हो सकता है; συνηχήσαντας साथ ध्वनित होने या प्रतिध्वनित होने पर बल देता है।
  - marker: b
    text: या, “पूरे शिविर में ऐसी घबराहट फैल गई जिसे रोका नहीं जा सकता था।”
    reason: πτοή भय, दहशत या अचानक फैली घबराहट का अर्थ दे सकता है, और ἀκατάσχετον उसके अनियंत्रित या न रोके जा सकने पर बल देता है।
lexical_decisions:
- source_word: θεωρήσαντες
  choice: जब … ने यह देखा
  rationale: कालवाचक एओरिस्ट कृदंत को स्वाभाविक हिन्दी में परिस्थिति बताने वाले उपवाक्य के रूप में व्यक्त किया गया है। यूनानी में कर्म व्यक्त नहीं है; हिन्दी में प्रसंगगत ‘यह’ आवश्यक स्पष्टता देता है।
- source_word: μέγα
  choice: ऊँचे स्वर से
  rationale: यहाँ μέγα क्रियाविशेषण की तरह ἀνέκραξαν की तीव्रता बताता है; ‘ऊँचे स्वर से’ आधुनिक हिन्दी में सहज है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग की ओर
  rationale: दिशा का अर्थ सुरक्षित रखा गया है और ‘परमेश्वर’ जोड़कर निहित धार्मिक आशय को स्पष्ट कथन में नहीं बदला गया।
- source_word: ἀνέκραξαν
  choice: पुकारा
  rationale: यह तीव्र स्वर में पुकार उठने का भाव देता है और केवल क्रोधपूर्ण चिल्लाहट का अनावश्यक संकेत नहीं करता।
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: पास के आँगन
  rationale: παρακειμένους निकट या सटे हुए स्थानों को और αὐλῶνας आँगनों अथवा घिरे हुए खुले स्थानों को सूचित करता है।
- source_word: συνηχήσαντας
  choice: उनकी पुकार से गूँज उठे
  rationale: साथ-साथ ध्वनित होने या प्रतिध्वनित होने का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀκατάσχετον πτοήν
  choice: बेकाबू दहशत
  rationale: ἀκατάσχετος के न रोके जा सकने और πτοή के भय, आतंक या घबराहट—दोनों भावों को संक्षेप में सुरक्षित रखता है।
- source_word: ποιῆσαι
  choice: फैला दी
  rationale: परिणामवाचक infinitive के कारणकारी अर्थ को हिन्दी में सहज ढंग से व्यक्त करता है।
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: पूरे शिविर में
  rationale: समूचे सैन्य पड़ाव में भय फैलने का स्थानगत अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ‘स्वर्ग की ओर’ का निहित धार्मिक आशय
  choice: ‘स्वर्ग की ओर’ रखा गया
  alternative: ‘परमेश्वर को’ या ‘परमेश्वर की ओर’
  rationale: प्रसंग में यह परमेश्वर से सहायता की पुकार हो सकती है, पर यूनानी पाठ प्रत्यक्ष रूप से ‘स्वर्ग’ कहता है; इसलिए परमेश्वर को स्पष्ट कर्म बनाकर अंतर्निहित अर्थ का समाधान नहीं किया गया।
- issue: दहशत उत्पन्न करने वाला कर्ता
  choice: गूँजते हुए पास के आँगनों को व्याकरणिक कारण के रूप में रखा गया
  alternative: यहूदियों की पुकार ने पूरे शिविर में दहशत फैला दी
  rationale: यूनानी वाक्य में τοὺς … αὐλῶνας, συνηχήσαντας infinitive ποιῆσαι का कर्ता है। हिन्दी को स्वाभाविक रखते हुए इस असामान्य चित्रात्मक संरचना को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शिविर’, ‘स्वर्ग की ओर’ और ‘ऊँचे स्वर से पुकारा’ औपचारिकता तथा पठनीयता के बीच संतुलन रखते हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न अपने संबंधित शब्दसमूहों के साथ दिए गए हैं।
