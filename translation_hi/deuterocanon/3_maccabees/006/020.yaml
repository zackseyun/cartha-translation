    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: थरथराने लगा
  rationale: यह शब्द शरीर में भय से उठने वाली कंपकंपी या सिहरन दर्शाता है; यह सहज हिन्दी में शारीरिक प्रतिक्रिया को स्पष्ट रखता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यूनानी पाठ स्पष्टतः राजा के शरीर का उल्लेख करता है और उसकी प्रतिक्रिया के भौतिक स्वरूप पर बल देता है।
- source_word: λήθη
  choice: विस्मृति
  rationale: मूल अर्थ ‘भूल’ या ‘विस्मृति’ है। मुख्य पाठ में इसी असामान्य रूपक को बनाए रखा गया है, जबकि पादटिप्पणी प्रसंगगत मानसिक भ्रम की संभावना बताती है।
- source_word: θράσος
  choice: दुस्साहस
  rationale: प्रसंग में यह निष्पक्ष साहस नहीं, बल्कि राजा की धृष्ट और अहंकारी निर्भीकता है; ‘दुस्साहस’ इस नकारात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βαρύθυμον
  choice: कठोर मन के
  rationale: यौगिक विशेषण भारी, उदास, अड़ियल अथवा कठोर मनोदशा का संकेत दे सकता है। ‘कठोर मन के’ प्रसंग में राजा की दमनकारी और हठी प्रवृत्ति को व्यक्त करता है, बिना अर्थ को केवल क्रोध तक सीमित किए।
- source_word: ἔλαβεν
  choice: दबोच लिया
  rationale: क्रिया का मूल अर्थ ‘पकड़ लिया’ है और इसका कर्ता λήθη है। ‘दबोच लिया’ उस आकस्मिक पकड़ तथा राजा के दुस्साहस के निष्प्रभावी हो जाने—दोनों को सजीव और स्वाभाविक ढंग से रखता है।
