  text: Then the greatly glorious, almighty, and true God, revealing his holy face, opened the gates of heaven, from which two glorious angels of fearful appearance came down, visible to everyone except the Jews,
translation:
  language: hi
  text: तब परम महिमामय, सर्वशक्तिमान और सच्चे परमेश्वर ने अपना पवित्र मुख[a] प्रकट करके स्वर्ग के फाटक खोल दिए। उनमें से महिमा से विभूषित और भयावह रूप वाले दो स्वर्गदूत नीचे उतरे। वे यहूदियों को छोड़कर सबको दिखाई दे रहे थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी पवित्र उपस्थिति’; शाब्दिक अर्थ ‘अपना पवित्र मुख’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: परम महिमामय
  rationale: यह संयुक्त विशेषण महान और उत्कट महिमा व्यक्त करता है। ‘परम महिमामय’ उसके बल और ऊँचे साहित्यिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: परमेश्वर के लिए यह प्रचलित और स्वाभाविक हिन्दी पर्याय है; इसमें समस्त सामर्थ्य और प्रभुता का भाव निहित है।
- source_word: ἀληθινὸς θεός
  choice: सच्चे परमेश्वर
  rationale: यह ἀληθινός की विरोधात्मक धार्मिक शक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐπιφάνας
  choice: प्रकट करके
  rationale: कृदन्त का अर्थ प्रकट या दृश्य करना है; कर्म ‘अपना पवित्र मुख’ होने के कारण यह प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: अपना पवित्र मुख
  rationale: πρόσωπον का ठोस मूल अर्थ ‘मुख’ है। इसे मुख्य पाठ में रखने से यूनानी का मानवरूपी बिंब सुरक्षित रहता है।
- source_word: ἠνέῳξε τὰς οὐρανίους πύλας
  choice: स्वर्ग के फाटक खोल दिए
  rationale: οὐρανίους का आशय स्वर्गीय है; हिन्दी में ‘स्वर्ग के फाटक’ स्वाभाविक रहते हुए मूल चित्र को स्पष्ट रूप से व्यक्त करता है।
- source_word: δεδοξασμένοι
  choice: महिमा से विभूषित
  rationale: पूर्ण कृदन्त इन स्वर्गदूतों के महिमान्वित किए हुए या महिमा से युक्त होने का भाव देता है। यह केवल सामान्य विशेषण ‘महिमामय’ की अपेक्षा रूपगत अर्थ को बेहतर सुरक्षित रखता है।
- source_word: φοβεροειδεῖς
  choice: भयावह रूप वाले
  rationale: यह संयुक्त शब्द ऐसा बाहरी रूप बताता है जो भय उत्पन्न करता है; चुना हुआ वाक्यांश स्पष्ट और गरिमापूर्ण है।
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: वे यहूदियों को छोड़कर सबको दिखाई दे रहे थे
  rationale: संदर्भ में φανεροί दृश्य होने को बताता है। वाक्यांश अपवाद को ठीक उसी प्रकार बनाए रखता है, बिना उसका कारण समझाए।
theological_decisions:
- issue: परमेश्वर के लिए τὸ ἅγιον αὐτοῦ πρόσωπον की मानवरूपी भाषा
  choice: अपना पवित्र मुख
  alternative: अपनी पवित्र उपस्थिति
  rationale: यूनानी में ठोस रूप से ‘मुख’ है। धार्मिक तनाव को नरम करने के बजाय मुख्य पाठ में वही बिंब रखा गया है; संभावित अर्थ ‘उपस्थिति’ पादटिप्पणी में दिया गया है।
- issue: यहूदियों को दृश्यता से अलग बताने वाला खंड
  choice: यहूदियों को छोड़कर सबको दिखाई दे रहे थे
  alternative: यहूदियों के सिवा सबके सामने प्रकट थे
  rationale: मूल पाठ स्पष्ट रूप से यह अपवाद बताता है। अनुवाद न तो इसे नरम करता है, न इसका कारण जोड़ता है।
- issue: δεδοξασμένοι में स्वर्गदूतों की महिमा की अवस्था
  choice: महिमा से विभूषित
  alternative: महिमामय
  rationale: पूर्ण कृदन्त को अवस्था या प्राप्त विभूषण के रूप में व्यक्त किया गया है, पर इससे किसी विशिष्ट उत्तरकालीन महिमाकरण-सिद्धान्त को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘परम महिमामय’, ‘सर्वशक्तिमान’, ‘स्वर्ग के फाटक’ और ‘स्वर्गदूत’ जैसे परिचित धार्मिक पद प्रयोग किए गए हैं। यूनानी वाक्य के अंतिम अल्पविराम को बनाए रखा गया है, क्योंकि पद आगे के कथन से जुड़ता है।
