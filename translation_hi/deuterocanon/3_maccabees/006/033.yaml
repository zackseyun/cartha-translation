  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: hi
  text: इसी प्रकार राजा ने भी इन घटनाओं के उपलक्ष्य में एक भव्य भोज[a] आयोजित किया और उनके उस आश्चर्यजनक छुटकारे[b] के लिए, जो हो चुका था, स्वर्ग को निरन्तर बहुत धन्यवाद देता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक विशाल और वैभवपूर्ण भोज”; यूनानी में शाब्दिक रूप से “भारी भोज” है, जो यहाँ बड़े या भरपूर भोज का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “आश्चर्यजनक उद्धार”; इस कथा में “छुटकारा” तत्काल संकट से बचाए जाने के अर्थ को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले प्रसंग के समानांतर कार्य को सूचित करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: περὶ τούτων
  choice: इन घटनाओं के उपलक्ष्य में
  rationale: भोज के प्रसंग में यह पद उन पहले वर्णित घटनाओं को भोज का अवसर या कारण बताता है।
- source_word: συμπόσιον βαρὺ
  choice: एक भव्य भोज
  rationale: शाब्दिक अर्थ ‘भारी भोज’ अस्वाभाविक होगा; यहाँ βαρύς भोज की विशालता या वैभव को व्यक्त करता है।
- source_word: ἀδιαλείπτως
  choice: निरन्तर
  rationale: यह धन्यवाद देने की लगातार या बार-बार होती क्रिया को बनाए रखता है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग को
  rationale: यूनानी पाठ स्पष्टतः ‘स्वर्ग’ कहता है; इसे ‘परमेश्वर को’ बनाकर निहित आशय को स्पष्टतः आरोपित नहीं किया गया।
- source_word: ἀνθωμολογεῖτο
  choice: धन्यवाद देता रहा
  rationale: इस उद्धार-प्रसंग में क्रिया कृतज्ञतापूर्ण स्वीकार या धन्यवाद को सूचित करती है; अपूर्ण भूतकाल की निरन्तरता ‘देता रहा’ से व्यक्त होती है।
- source_word: μεγαλομερῶς
  choice: बड़े भाव से
  rationale: यह धन्यवाद देने के ढंग की प्रबलता और उदात्तता व्यक्त करता है, जबकि हिन्दी को सहज रखता है।
- source_word: παραδόξῳ
  choice: आश्चर्यजनक
  rationale: यह अपेक्षा से परे और विस्मयकारी घटना का अर्थ स्पष्ट करता है।
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: उनके उस आश्चर्यजनक छुटकारे के लिए, जो हो चुका था
  rationale: σωτηρία को तात्कालिक ऐतिहासिक बचाव के अर्थ में ‘छुटकारा’ कहा गया है और γενηθείσῃ से घटना के घटित हो चुकने का भाव सुरक्षित है।
theological_decisions:
- issue: कथात्मक बचाव के प्रसंग में σωτηρία का अनुवाद
  choice: छुटकारा
  alternative: उद्धार
  rationale: यहाँ लोगों को तत्काल ऐतिहासिक संकट से बचाए जाने का वर्णन है। ‘छुटकारा’ उस अर्थ को स्पष्ट करता है और बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को अनावश्यक रूप से आरोपित नहीं करता।
- issue: εἰς οὐρανόν का आशय
  choice: स्वर्ग को
  alternative: परमेश्वर को
  rationale: ‘स्वर्ग’ सम्भवतः परमेश्वर के लिए आदरसूचक लक्षणा है, पर मूल पाठ सीधे ‘परमेश्वर’ नहीं कहता; इसलिए उसकी अभिव्यक्ति और संयम सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। वाक्य में यूनानी अपूर्ण भूतकाल की निरन्तरता और पूर्ण हो चुके छुटकारे—दोनों को अलग-अलग स्पष्ट किया गया है।
