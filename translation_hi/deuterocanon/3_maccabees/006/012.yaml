    rationale: ‘हम पर दया कर—हम पर, जिन्हें…’ unnecessarily repeats the object of mercy, while the final comparison is left detached from the action it qualifies.
  - severity: low
    issue: ‘हिंसा’ narrows ὕβρις slightly
    rationale: ὕβρις denotes insolent outrage or abusive treatment and can include violence; ‘अत्याचार’ expresses the broader contextual sense without requiring physical violence alone.
