  verdict: revise
  source_fidelity: The draft accurately preserves the divine vocatives, the distinction between might and dominion, the urgent imperative, removal from life, and the noncommittal comparison/manner expressed by ἐν ἐπιβούλων τρόπῳ. ‘उद्दण्ड हिंसा’ is defensible in context, though ‘अत्याचार’ is slightly less restrictive and more idiomatic for ὕβρις. The revision retains the source’s ambiguity rather than specifying an accusation or legal pretext.
  naturalness: The duplicate ‘हम पर’ after the dash is awkward, and the sentence-final ‘षड्यन्त्रकारियों के समान’ is syntactically detached. Reordering it next to the passive action makes clear that the people are being treated/removed like plotters. ‘अविवेकपूर्ण ढंग से’ is a natural modern-Hindi equivalent for ἀλόγιστον.
  terminology: ‘सामर्थ्य’ and ‘प्रभुता’ suitably distinguish ἀλκή and δυναστεία. ‘हे अथक, हे सनातन’ retains two vocative epithets without adding ‘परमेश्वर.’ ‘अधर्मी’ remains acceptable for ἄνομοι. Standardizing षड्यंत्र with a bindu improves modern orthographic consistency.
  issues:
