base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: hi
  text: परन्तु हे अथक[a], हे सनातन, तू, जिसके पास समस्त सामर्थ्य और प्रभुता है, अब हमारी ओर दृष्टि कर। हम पर दया कर, जिन्हें अधर्मियों के उद्दण्ड अत्याचार के कारण षड्यंत्रकारियों के समान[c] अविवेकपूर्ण ढंग से जीवन से हटाया जा रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे कभी न रुकनेवाले।’
    reason: ἀπάναυε के ‘न थकने’ और ‘न रुकने’ दोनों सम्भव भावों को सुरक्षित रखना।
  - marker: b
    text: शाब्दिक अर्थ ‘जीवन से हटाया जाना’ है; प्रसंग में आशय मार डाले जाने से है।
    reason: मूल रूपक और प्रसंगगत मृत्यु-अर्थ दोनों स्पष्ट करना।
  - marker: c
    text: या ‘हमारे साथ षड्यंत्रकारियों जैसा व्यवहार करके।’
    reason: ἐν ἐπιβούλων τρόπῳ में तुलना और व्यवहार की रीति के बीच विद्यमान सम्भावित अस्पष्टता दिखाना।
lexical_decisions:
- source_word: ἀλκήν
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति और पराक्रम का बोध कराता है। ‘सामर्थ्य’ प्रार्थना की गरिमा बनाए रखता है और δυναστείαν के लिए प्रयुक्त ‘प्रभुता’ से अर्थगत भेद भी रखता है।
- source_word: δυναστείαν
  choice: प्रभुता
  rationale: यह केवल शारीरिक शक्ति नहीं, बल्कि शासनाधिकार या प्रभुसत्ता का संकेत देता है।
- source_word: ἀπάναυε
  choice: हे अथक
  rationale: सम्बोधन रूप को बनाए रखते हुए परमेश्वर के न थकने या न रुकने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: αἰώνιε
  choice: हे सनातन
  rationale: यह भी प्रत्यक्ष सम्बोधन है। ‘सनातन’ अनन्त अस्तित्व का भाव गरिमापूर्ण और सहज हिन्दी में देता है।
- source_word: ἐπίδε
  choice: अब हमारी ओर दृष्टि कर
  rationale: आज्ञार्थक क्रिया की तात्कालिक और विनतीपूर्ण शक्ति को रखा गया है; ‘हमारी ओर’ अगली विनती से स्पष्ट निहित कर्म को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθʼ ὕβριν
  choice: उद्दण्ड हिंसा के कारण
  rationale: ὕβρις में घमण्डपूर्ण उद्दण्डता के साथ अपमानजनक या हिंसक अत्याचार का भाव भी है।
- source_word: ἀνόμων
  choice: अधर्मियों
  rationale: यह उन उत्पीड़कों को सूचित करता है जो व्यवस्था और न्याय की अवहेलना करते हैं; ‘अधर्मी’ प्रचलित और प्रसंगानुकूल है।
- source_word: ἀλόγιστον
  choice: विवेकहीन ढंग से
  rationale: क्रियाविशेषणात्मक प्रयोग कार्रवाई की असंगत, अविवेकी प्रकृति बताता है; यह केवल आकस्मिकता या वैधानिक निर्दोषता तक अर्थ को सीमित नहीं करता।
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: जीवन से हटाया जा रहा है
  rationale: यूनानी में जीवन या जीवित रहने की दशा से हटाए जाने का चित्र है। प्रसंग में इसका अर्थ मृत्यु के घाट उतारा जाना है, पर मुख्य पाठ स्रोत की अभिव्यक्ति बनाए रखता है।
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: षड्यन्त्रकारियों के समान
  rationale: ἐπίβουλος षड्यन्त्र रचने या हानि की योजना बनानेवाले व्यक्ति को सूचित करता है। हिन्दी वाक्यांश तुलना को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी व्यवहार या रीति सम्बन्धी सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: ἀπάναυε और αἰώνιε के ईश्वरीय सम्बोधन
  choice: दोनों को अलग-अलग प्रत्यक्ष सम्बोधन—‘हे अथक, हे सनातन’—के रूप में रखा गया है।
  alternative: ἀπάναυε को ἐπίδε के साथ क्रियाविशेषण मानना, या दोनों को मिलाकर ‘हे अथक और सनातन परमेश्वर’ कहना।
  rationale: यूनानी में दोनों सम्बोधन रूप आज्ञार्थक क्रिया से पहले समानान्तर खड़े हैं। अलग सम्बोधन उनकी काव्यात्मक और धर्मवैचारिक गहनता बनाए रखते हैं तथा पाठ में न आए ‘परमेश्वर’ को मुख्य पाठ में नहीं जोड़ते।
- issue: ἐκ τοῦ ζῆν μεθισταμένους का आशय
  choice: ‘जीवन से हटाया जा रहा है’ कहकर मृत्यु का सामना करने का भाव स्रोत की छवि सहित रखा गया है।
  alternative: ‘मार डाला जा रहा है’ या ‘जीवितों में से निकाला जा रहा है।’
  rationale: प्रसंग में हत्या का संकट स्पष्ट है, फिर भी यूनानी सीधे ‘मारना’ नहीं कहता, बल्कि जीवन से हटाए जाने की अभिव्यक्ति प्रयुक्त करता है।
- issue: ἐν ἐπιβούλων τρόπῳ की सम्बन्धगत अस्पष्टता
  choice: मुख्य पाठ में ‘षड्यन्त्रकारियों के समान’ रखा गया है और पादटिप्पणी में व्यवहारगत अर्थ दिया गया है।
  alternative: ‘हमारे साथ ऐसा व्यवहार किया जा रहा है मानो हम षड्यन्त्रकारी हों’ या ‘षड्यन्त्रकारियों की रीति से।’
  rationale: यूनानी वाक्यांश रीति, तुलना या आरोपित हैसियत की ओर संकेत कर सकता है। अनुवाद प्रसंग में स्वाभाविक तुलना देता है, पर सम्भावित व्यवहारगत अर्थ को निर्णायक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर को एकवचन आत्मीय-गंभीर ‘तू’ से सम्बोधित किया गया है, जो बाइबिलीय प्रार्थना में स्वाभाविक है। ‘सामर्थ्य/प्रभुता’ और ‘अथक/सनातन’ जैसे युग्म स्रोत के समानान्तर पदों का भेद बनाए रखते हैं; कठिन शाब्दिक अभिव्यक्तियों को मुख्य पाठ में यथासम्भव सुरक्षित रखते हुए पादटिप्पणियों से स्पष्ट किया गया है।
