    text: या ‘याकूब के लोग’; यूनानी γένος किसी वंश, कुल अथवा एक ही पूर्वज से निकले लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  choice: दुबक जाएँ
  rationale: यह भय से सिकुड़ने या पीछे हटने का भाव व्यक्त करता है; ‘दुबक जाएँ’ आधुनिक हिन्दी में भय और अधीनता दोनों को स्वाभाविक रूप से दर्शाता है।
- source_word: ἔθνη
  choice: जातियाँ
  rationale: यहाँ आसपास के सामूहिक जनसमूहों या राष्ट्रों का उल्लेख है; ‘जातियाँ’ बाइबलीय प्रार्थना-शैली में व्यापक अर्थ बनाए रखता है और यहूदी-अन्यजाति भेद को अनावश्यक रूप से प्रमुख नहीं करता।
- source_word: σὴν δύναμιν ἀνίκητον
  choice: आपकी अजेय सामर्थ्य
  rationale: δύναμις शक्ति या सामर्थ्य और ἀνίκητος जिसे जीता न जा सके का बोध देता है; यह पदबंध संक्षिप्त, गरिमापूर्ण और स्रोत के निकट है।
- source_word: σήμερον
  choice: आज
  rationale: समयवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἔντιμε
  choice: हे आदरणीय
  rationale: यह सम्मानसूचक विशेषण का संबोधन रूप है। असामान्य संबोधन को ‘प्रभु’ जैसे अनुपस्थित ईश्वरीय पदनाम से बदलने के बजाय यथावत रखा गया है।
- source_word: δυνάμεις ἔχων
  choice: क्योंकि आपके पास ... सामर्थ्य है
  rationale: शाब्दिक रूप से ‘सामर्थ्य रखते हुए’। हिन्दी में यह कारणसूचक संबंध स्वाभाविक करता है, यद्यपि यूनानी कृदंत का संबंध कुछ हद तक खुला है।
- source_word: ἐπὶ σωτηρίαν
  choice: के उद्धार की
  rationale: यह उद्धार या बचाव की दिशा अथवा प्रयोजन को व्यक्त करता है और σωτηρία के संज्ञात्मक रूप को बनाए रखता है।
- source_word: Ἰακὼβ γένους
  choice: याकूब के वंश
  rationale: γένος साझा पूर्वज से निकले वंश, कुल या लोगों को सूचित कर सकता है। ‘वंश’ वंशगत सामूहिकता को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ἔντιμε द्वारा परमेश्वर को संबोधन
  choice: हे आदरणीय
  alternative: हे पूजनीय; हे प्रतिष्ठित
  rationale: यूनानी पाठ सामान्य ईश्वरीय उपाधि के बजाय सम्मानसूचक विशेषण से सीधा संबोधन करता है। अनुवाद इस असामान्यता को किसी अनुपस्थित पदवी से सामान्यीकृत नहीं करता।
- issue: Ἰακὼβ γένους की सामूहिक पहचान
  choice: याकूब के वंश
  alternative: याकूब के लोग
  rationale: ‘वंश’ मूल के वंशावली-संबंधी भाव को सुरक्षित रखता है, जबकि पादटिप्पणी γένος के व्यापक सामूहिक अर्थ की वास्तविक संभावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘दुबक जाएँ’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘अजेय सामर्थ्य’ मूल की ऊँची शैली को बनाए रखता है।
