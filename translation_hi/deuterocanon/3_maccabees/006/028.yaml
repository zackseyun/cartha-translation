base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: hi
  text: सर्वशक्तिमान, स्वर्गीय, जीवित परमेश्वर के पुत्रों[a] को रिहा कर दो, जिसने हमारे पूर्वजों के समय से अब तक हमारे कामकाज को महिमा सहित निर्बाध स्थिरता प्रदान करता आया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘पुत्रों’ है; भाव की दृष्टि से ‘संतानों’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘निर्बाध स्थिरता’ का अनुवाद ‘बिना रुकावट की सुरक्षा’ या ‘अविचल समृद्धि’ भी हो सकता है। यूनानी अभिव्यक्ति हमारे मामलों में स्थिर और अबाध कल्याण पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσατε
  choice: छोड़ दो
  rationale: बहुवचन आज्ञार्थक क्रिया तत्काल रिहाई की माँग करती है; ‘छोड़ दो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: τοὺς υἱοὺς
  choice: पुत्रों
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है; इसलिए इसे लिंग-निरपेक्ष किए बिना सुरक्षित रखा गया है।
- source_word: τοῦ παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह स्थापित बाइबलीय ईश्वरीय उपाधि है और παντοκράτωρ की व्यापक सत्ता तथा सामर्थ्य को व्यक्त करती है।
- source_word: ἐπουρανίου
  choice: स्वर्गीय
  rationale: परमेश्वर का विशेषण होने के कारण ‘स्वर्गीय’ संक्षिप्त, स्वाभाविक और मूल की विशेषण-शृंखला के अनुरूप है।
- source_word: θεοῦ ζῶντος
  choice: जीवित परमेश्वर
  rationale: यह प्रचलित बाइबलीय पदबंध है और मूल के धार्मिक बल को बनाए रखता है।
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: हमारे पूर्वजों के समय से अब तक
  rationale: यूनानी की संक्षिप्त कालगत अभिव्यक्ति को स्वाभाविक हिन्दी में स्पष्ट किया गया है, जिससे अतीत से वर्तमान तक की निरंतरता बनी रहती है।
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: निर्बाध स्थिरता
  rationale: ἀπαραπόδιστον रुकावट न होने और εὐστάθεια दृढ़, सुव्यवस्थित स्थायित्व का भाव देता है; यह संयोजन दोनों को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: μετὰ δόξης
  choice: महिमा सहित
  rationale: मूल के पूर्वसर्गीय पदबंध को औपचारिक और गरिमापूर्ण रूप में बनाए रखा गया है; ‘सम्मान सहित’ भी प्रसंगानुकूल संभव है।
- source_word: προφέρει
  choice: प्रदान की है
  rationale: यहाँ क्रिया परमेश्वर द्वारा निरंतर लाभकारी स्थिरता पहुँचाने का भाव देती है; पूर्णकालिक हिन्दी रूप पूर्वजों के समय से वर्तमान तक के परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: हमारे कामकाज को
  rationale: πράγματα व्यापक रूप से मामलों, गतिविधियों या सार्वजनिक कामकाज को सूचित करता है; ‘कामकाज’ इसे केवल ‘राज्य’ तक सीमित नहीं करता।
theological_decisions:
- issue: παντοκράτορος ἐπουρανίου θεοῦ ζῶντος में ईश्वरीय विशेषणों की शृंखला
  choice: सर्वशक्तिमान, स्वर्गीय, जीवित परमेश्वर
  alternative: सर्वशक्तिमान स्वर्गीय और जीवित परमेश्वर
  rationale: अल्पविरामों वाली रचना मूल यूनानी में विशेषणों के क्रम और पृथक बल को बनाए रखती है, फिर भी हिन्दी में समझने योग्य है।
- issue: υἱοὺς का लिंग-सूचक अर्थ
  choice: पुत्रों
  alternative: संतानों
  rationale: मूल में ‘पुत्र’ का स्पष्ट पुल्लिंग शब्द है और प्रसंग उसे लिंग-निरपेक्ष बनाने की माँग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ईश्वरीय उपाधियों की मूल शृंखला और ‘पुत्रों’ का लिंग-सूचक अर्थ सुरक्षित रखा गया है; ‘कामकाज’ चुना गया है ताकि अर्थ को अनावश्यक रूप से केवल राज्य या शासन तक सीमित न किया जाए।
