    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: पलट पड़े
  rationale: कर्ता ‘पशु’ हैं और ἐπί के बाद लक्ष्य आता है; इसलिए यह प्रयोग दिशा बदलकर आक्रमण करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ θηρία
  choice: वे पशु
  rationale: θηρία खतरनाक बड़े पशुओं के लिए प्रयुक्त है; प्रसंग में हाथियों की ओर संकेत है, पर यूनानी पद को अनावश्यक रूप से विशिष्ट किए बिना ‘पशु’ रखा गया है।
- source_word: ἐπὶ
  choice: पर
  rationale: गति और आगे वर्णित हिंसक कार्रवाई के संदर्भ में यह लक्ष्य के विरुद्ध मुड़ने को दर्शाता है; ‘पर पलट पड़े’ हिन्दी में शत्रुतापूर्ण दिशा-परिवर्तन स्पष्ट करता है।
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: अपने पीछे चल रही सशस्त्र टुकड़ियों
  rationale: सυνεπομένας में साथ-साथ चलने अथवा पीछे चलने, दोनों का भाव संभव है। मुख्य पाठ में दृश्य की स्वाभाविकता के लिए ‘पीछे चल रही’ रखा गया है और विकल्प पादटिप्पणी में सुरक्षित है। ‘सशस्त्र टुकड़ियाँ’ ἔνοπλοι δυνάμεις का सहज सैन्य अर्थ देता है।
- source_word: κατεπάτουν
  choice: रौंदते ... गए
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती कार्रवाई दर्शाता है; ‘रौंदते गए’ उस निरंतरता और क्रिया की तीव्रता को बनाए रखता है।
- source_word: ὠλέθρευον
  choice: नष्ट करते गए
  rationale: ὀλεθρεύω विनाश करने का प्रबल अर्थ रखता है। ‘नष्ट करते गए’ इसकी व्यापक और घातक तीव्रता तथा अपूर्ण भूतकाल की निरंतरता दोनों व्यक्त करता है।
