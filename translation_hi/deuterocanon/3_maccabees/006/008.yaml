  yaml_path: translation/deuterocanon/3_maccabees/006/008.yaml
  text: and Jonah[a], who was wasting away in the belly of the sea-fed monster, you brought forth unharmed in abundance to all his own people, Father[b],
translation:
  language: hi
  text: और योना[a] को, जो गहरे समुद्र में पले-बढ़े विशाल जल-जीव के पेट में क्षीण हो रहे थे, तूने बिना चोट के उदारतापूर्वक बाहर निकालकर उसके सभी अपनों के सामने प्रकट किया, हे पिता![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ कोई बड़ा समुद्री जीव या समुद्री दैत्य हो सकता है; इसे ‘बड़ी मछली’ भी कहा जा सकता है। ‘व्हेल’ उससे अधिक विशिष्ट है जितना यूनानी शब्द अनिवार्य करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘उदारतापूर्वक’ के लिए आया यूनानी रूप वाक्य में असामान्य है; उसका भाव ‘भरपूर रीति से’ या संभवतः ‘खुले रूप से’ भी समझा जा सकता है। ‘बिना चोट के’ का अधिक शाब्दिक अर्थ ‘बिना निशान के’ है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: βυθοτρεφοῦς
  choice: गहरे समुद्र में पलनेवाले
  rationale: यह संयुक्त शब्द गहराई/अथाह समुद्र और पोषण या पलने का बिंब जोड़ता है। हिंदी में यह प्रयोग उस जीव को समुद्र की गहराइयों में पलनेवाला बताता है और मूल बिंब को स्वाभाविक ढंग से रखता है।
- source_word: κήτους
  choice: विशाल जल-जीव
  rationale: κῆτος किसी बड़े समुद्री जीव या समुद्री दैत्य को सूचित कर सकता है। ‘विशाल जल-जीव’ उसके आकार और व्यापक अर्थ को रखता है, पर उसे अनावश्यक रूप से ‘व्हेल’ या केवल ‘मछली’ नहीं बनाता।
- source_word: τηκόμενον
  choice: घुलते जा रहे
  rationale: τήκω का मूल बिंब गलने, घुलने या क्षीण होते जाने का है। ‘घुलते जा रहे’ संकट की तीव्रता और यूनानी रूपक दोनों को बनाए रखता है।
- source_word: ἀφθόνῳ
  choice: उदारतापूर्वक
  rationale: रूप का वाक्यगत संबंध असामान्य है; ἄφθονος में बिना रोक, बिना कृपणता या भरपूरी का भाव हो सकता है। ‘उदारतापूर्वक’ इस भाव को रखता है, जबकि टिप्पणी में अनिश्चितता बताई गई है।
- source_word: ἀσήμαντον
  choice: बिना किसी चोट के
  rationale: शाब्दिक अर्थ ‘बिना निशान के’ है और प्रसंग में चोट या हानि से अछूता रहने का परिणाम व्यक्त करता है।
- source_word: πᾶσιν οἰκείοις
  choice: उसके सभी अपनों के सामने
  rationale: οἰκεῖοι उसके अपने लोगों, घराने या निकट संबंधियों को सूचित करता है। ἀναδείξας के साथ दत्तिव को उन लोगों के सामने प्रकट किए जाने के अर्थ में लिया गया है।
- source_word: ἀναδείξας
  choice: प्रकट कर दिया
  rationale: क्रिया का अर्थ सामने लाना, दिखाना या प्रकट करना है। यह योना के बचाए जाने और उसके अपनों को दिखाई देने—दोनों को समेटता है।
- source_word: πάτερ
  choice: हे पिता
  rationale: यह परमेश्वर के लिए सीधा संबोधन है; ‘हे’ हिंदी में संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
theological_decisions:
- issue: योना के जीव का नाम
  choice: विशाल जल-जीव
  alternative: बड़ी मछली; समुद्री दैत्य; व्हेल
  rationale: यूनानी κῆτος किसी बड़े समुद्री जीव के लिए व्यापक शब्द है। ‘व्हेल’ कहना मूल से अधिक विशिष्ट होता, जबकि ‘विशाल जल-जीव’ स्रोत की व्यापकता को बनाए रखता है।
- issue: ἀφθόνῳ का असामान्य वाक्यगत अर्थ
  choice: उदारतापूर्वक
  alternative: भरपूर रीति से; खुले रूप से
  rationale: यूनानी रूप का संबंध और आशय पूरी तरह स्पष्ट नहीं है। मुख्य पाठ में बिना रोक या कृपणता के भाव को रखा गया है और पाद-टिप्पणी में अन्य संभावनाएँ दी गई हैं, ताकि अस्पष्टता दबाई न जाए।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण प्रार्थना-रजिस्टर रखा गया है। ‘तूने’ निकट, प्रत्यक्ष ईश-संबोधन के अनुरूप है। वाक्य को पिछले और अगले पदों से जुड़ी लंबी प्रार्थना का खंड मानते हुए आरंभ ‘और’ से किया गया है; अंतिम विस्मयादिबोधक संबोधन की तीव्रता दिखाता है।
