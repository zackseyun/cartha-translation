base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: hi
  text: उनके लिए प्रतियाँ पखोन की पच्चीसवीं तारीख से एपिफी की चौथी तारीख तक[a], चालीस दिनों के दौरान, तैयार की गईं[b]; और उन्होंने उनके विनाश के लिए एपिफी की पाँचवीं तारीख से सातवीं तारीख तक के तीन दिन निर्धारित किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पखोन और एपिफी मिस्री महीनों के नाम हैं, जिनका उपयोग इस वृत्तांत की प्रशासनिक तिथियों में हुआ है।
    reason: cultural_note
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया लिखित प्रतियाँ बनाने या आधिकारिक दस्तावेज़ तैयार करने का संकेत दे सकती है; इस पद में यह स्पष्ट नहीं किया गया कि किस वस्तु की प्रतियाँ बनाई गईं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: प्रतियाँ ... तैयार की गईं
  rationale: यूनानी क्रिया का निष्क्रिय रूप लिखित प्रतियाँ बनाने या आधिकारिक दस्तावेज़ तैयार करने का बोध दे सकता है। यह अनुवाद दस्तावेज़ी संदर्भ बनाए रखता है, पर उस वस्तु को निश्चित नहीं करता जिसे मूल पाठ ने स्पष्ट नहीं कहा।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: सम्प्रदान कारक सर्वनाम को सरल रूप में रखा गया है; संदर्भ में यह उन यहूदियों की ओर संकेत करता है जिनकी चर्चा हो रही है।
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: पखोन की पच्चीसवीं तारीख से
  rationale: πέμπτης ... καὶ εἰκάδος पच्चीसवें दिन को व्यक्त करने का यूनानी ढंग है; हिन्दी में स्वाभाविक तारीख-रूप अपनाया गया है।
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: एपिफी की चौथी तारीख तक
  rationale: मिस्री महीने के नाम को लिप्यंतरित करते हुए तिथि-सीमा स्पष्ट रखी गई है।
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: चालीस दिनों के दौरान
  rationale: यह पदबंध अवधि बताता है। चुना हुआ रूप अनावश्यक गणनात्मक व्याख्या जोड़े बिना समयावधि व्यक्त करता है।
- source_word: συνίστανται
  choice: उन्होंने ... निर्धारित किए
  rationale: प्रशासनिक संदर्भ में क्रिया किसी योजना या समय को तय करने का बोध देती है। हिन्दी में 'निर्धारित किए' औपचारिक और स्वाभाविक है।
- source_word: τὴν ἀπώλειαν
  choice: उनके विनाश
  rationale: यहाँ ἀπώλεια साधारण हानि नहीं, बल्कि नियोजित नाश को सूचित करता है; 'विनाश' उस गंभीरता को बिना विस्तार जोड़े व्यक्त करता है।
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  choice: एपिफी की पाँचवीं तारीख से सातवीं तारीख तक
  rationale: तिथि-सीमा को आधुनिक हिन्दी में स्पष्ट और क्रमबद्ध ढंग से प्रस्तुत किया गया है।
- source_word: ἡμέραις τρισίν
  choice: तीन दिन
  rationale: सम्प्रदान कारक यहाँ निर्धारित समयावधि बताता है; वाक्य-विन्यास में 'तीन दिन निर्धारित किए' इसी अर्थ को सहज रूप से व्यक्त करता है।
