  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: hi
  text: अब्राहम के वंश पर, पवित्र किए गए याकूब[a] की संतानों पर, तेरे पवित्र किए हुए भाग की प्रजा पर दृष्टि कर, जो पराए देश में परदेशियों की तरह अन्यायपूर्वक नाश हो रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब की पवित्र की गई संतानों पर।” यूनानी वाक्यांश संक्षिप्त है; “पवित्र किए गए” का संबंध याकूब के बजाय उसकी संतानों से भी माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: दृष्टि कर
  rationale: प्रार्थना में परमेश्वर से ध्यान देने और हस्तक्षेप करने की गरिमापूर्ण विनती व्यक्त करता है।
- source_word: σπέρμα
  choice: वंश
  rationale: सामूहिक एकवचन का भाव रखते हुए अब्राहम के वंशजों के लिए स्वाभाविक हिन्दी है।
- source_word: ἡγιασμένου
  choice: पवित्र किए गए
  rationale: पूर्ण निष्क्रिय कृदंत का क्रियात्मक बल बनाए रखता है; मुख्य पाठ में इसे याकूब से जोड़ा गया है।
- source_word: τέκνα Ἰακώβ
  choice: याकूब की संतानें
  rationale: τέκνα को लिंग-सीमित किए बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: μερίδος ἡγιασμένης σου
  choice: अपने पवित्र किए हुए निज-भाग
  rationale: μερίς को परमेश्वर के अपने भाग या हिस्से के रूप में रखता है और ἡγιασμένης की निष्क्रिय क्रियात्मक छाया बचाता है।
- source_word: λαὸν
  choice: अपनी प्रजा
  rationale: वाचा-संबंधी प्रसंग में λαός के लिए स्पष्ट और प्रतिष्ठित हिन्दी।
- source_word: ἐν ξένῃ γῇ
  choice: पराए देश में
  rationale: विदेशी भूमि में होने की स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ξένως
  choice: परदेशियों की तरह
  rationale: क्रियाविशेषण को प्रसंगानुसार उनकी परायी और असुरक्षित दशा के रूप में स्पष्ट करता है।
- source_word: ἀδίκως
  choice: अन्यायपूर्वक
  rationale: उनके विरुद्ध हो रहे नैतिक अन्याय को बिना विस्तार जोड़े व्यक्त करता है।
- source_word: ἀπολλύμενον
  choice: नाश हो रही है
  rationale: वर्तमान कृदंत की जारी विनाश-प्रक्रिया को दर्शाता है और एकवचन सामूहिक 'प्रजा' से मेल खाता है।
theological_decisions:
- issue: ἐφ’ ἡγιασμένου τέκνα Ἰακώβ में ἡγιασμένου का संबंध
  choice: 'मुख्य पाठ में इसे याकूब से जोड़ा: ''पवित्र किए गए याकूब की संतानों'''
  alternative: '''याकूब की पवित्र की गई संतानों'''
  rationale: यूनानी वाक्यांश संक्षिप्त और वाक्य-विन्यास की दृष्टि से असहज है। याकूब से संबंध शब्दक्रम और पुल्लिंग एकवचन रूप के अनुकूल है, पर संतानों से भावगत संबंध भी संभव है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: μερίδος ἡγιασμένης σου λαὸν का संबंध
  choice: '''अपने पवित्र किए हुए निज-भाग, अपनी प्रजा'''
  alternative: '''अपनी पवित्र की हुई भागरूपी प्रजा'''
  rationale: μερίδος और λαόν के समानाधिकरण को स्पष्ट रखते हुए परमेश्वर की प्रजा को उसका अपना पवित्र भाग बताया गया है; 'निज-भाग' अधिकार और वाचा-संबंध का संकेत देता है, पर 'विरासत' जैसी अतिरिक्त धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली। 'दृष्टि कर' ऊँचे किंतु बोधगम्य संबोधन को बनाए रखता है। 'निज-भाग' सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर μερίς के परमेश्वर के अपने हिस्से वाले अर्थ को संक्षेप में सुरक्षित रखता है।
