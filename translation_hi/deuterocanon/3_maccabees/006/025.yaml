  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: hi
  text: किसने उन लोगों को, जो हमारे देश और घर के गढ़ों को विश्वास के साथ अपने अधिकार में रखते थे,[a] वहाँ से हटाकर, उनमें से हर एक को बिना कारण यहाँ इकट्ठा किया?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विश्वास के साथ’ यूनानी ἐν πίστει का अपेक्षाकृत शाब्दिक अनुवाद है। इसका अर्थ ‘निष्ठापूर्वक,’ ‘भरोसे में,’ या सम्भवतः ‘सुरक्षित रूप से’ भी हो सकता है; इस प्रसंग में पद का सम्बन्ध और अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य-विन्यास कठिन है। मुख्य पाठ में एक सम्भव अर्थ लिया गया है कि ये लोग देश और घर के गढ़ों को अपने अधिकार में रखते थे और वहाँ से हटाए गए। यह भी सम्भव है कि आशय लोगों को देश और घर के सुरक्षित स्थानों से हटाकर यहाँ इकट्ठा किए जाने का हो।
    reason: textual_difficulty
lexical_decisions:
- source_word: τίς
  choice: किसने
  rationale: यह प्रश्नवाचक सर्वनाम एक अलंकारिक प्रश्न आरम्भ करता है; हिन्दी में कर्ता के रूप में ‘किसने’ स्वाभाविक है।
- source_word: τοὺς κρατήσαντας ... τὰ ... ὀχυρώματα
  choice: उन लोगों को, जो ... गढ़ों को ... अपने अधिकार में रखते थे
  rationale: κρατέω का अर्थ यहाँ गढ़ों को थामे रखना, नियंत्रित करना या उन पर अधिकार बनाए रखना है। इस वाक्य-विन्यास में τὰ ... ὀχυρώματα क्रिया का कर्म है; इसलिए इसे ‘जहाँ उन्होंने हमें थाम रखा था’ नहीं बनाया गया।
- source_word: ἡμῶν ... τὰ τῆς χώρας ὀχυρώματα
  choice: हमारे देश के गढ़ों
  rationale: ὀχυρώματα सुदृढ़ या किलेबंद स्थान हैं और χώρα देश/प्रदेश है। ἡμῶν को इस वाक्यांश के साथ ग्रहण करके स्वाभाविक हिन्दी में ‘हमारे देश के गढ़ों’ कहा गया है।
- source_word: ἐν πίστει
  choice: निष्ठापूर्वक
  rationale: इस गैर-सैद्धान्तिक प्रसंग में यह पद सम्भवतः विश्वासयोग्य या निष्ठावान ढंग से गढ़ों को अपने अधिकार में रखने का भाव देता है। यूनानी की कठिनता और ‘विश्वास/भरोसे के साथ’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τῆς οἰκίας ἀποστήσας
  choice: उनके घर से दूर किया
  rationale: ἀποστήσας अलग या दूर करने को व्यक्त करता है, और सम्बन्धकारक τῆς οἰκίας को अपादानात्मक अर्थ में ‘घर से’ लिया गया है। यूनानी में οἰκία एकवचन है, जो सामूहिक रूप से घर या गृहस्थ जीवन का संकेत दे सकता है।
- source_word: ἕκαστον
  choice: उनमें से हर एक को
  rationale: वितरणात्मक एकवचन का व्यक्तिगत बल बनाए रखा गया है और उसका सम्बन्ध पहले उल्लिखित लोगों से स्पष्ट किया गया है।
- source_word: ἀλόγως
  choice: अकारण
  rationale: यह क्रिया-विशेषण विवेकहीन, अनुचित या बिना उचित कारण के किए गए काम को दर्शाता है; ‘अकारण’ प्रश्न में निहित नैतिक विरोध को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἤθροισεν ἐνθάδε
  choice: यहाँ इकट्ठा कर दिया
  rationale: ἀθροίζω का अर्थ इकट्ठा या एकत्र करना और ἐνθάδε का अर्थ ‘यहाँ’ है। ‘कर दिया’ पूर्ण हुई कार्रवाई को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: असामान्य, गैर-सैद्धान्तिक प्रसंग में πίστις का अर्थ
  choice: निष्ठापूर्वक
  alternative: विश्वास के साथ; भरोसे में; विश्वासयोग्य ढंग से
  rationale: यहाँ ἐν πίστει गढ़ों को अपने अधिकार में रखने की रीति बताता प्रतीत होता है, न कि उद्धारकारी विश्वास पर कोई सैद्धान्तिक कथन। ‘निष्ठापूर्वक’ प्रसंगानुकूल है, जबकि मूल शब्द की अर्थगत व्यापकता पादटिप्पणी में रखी गई है।
- issue: कठिन यूनानी वाक्य-विन्यास में κρατήσαντας और ὀχυρώματα का सम्बन्ध
  choice: लोग हमारे देश के गढ़ों को अपने अधिकार में रखते थे
  alternative: वे सुरक्षित स्थान जहाँ लोगों को थामे रखा गया था
  rationale: व्याकरण की दृष्टि से कर्मकारक τὰ ... ὀχυρώματα, कर्मकारक कृदन्त τοὺς κρατήσαντας की क्रिया का कर्म है। इसलिए लोगों को गढ़ों पर अधिकार रखनेवाले बताया गया है; कठिन समग्र विन्यास की सूचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘गढ़’, ‘अपने अधिकार में रखना’, ‘घर से दूर करना’ और ‘अकारण’ मूल बिंब तथा अलंकारिक प्रश्न का बल बनाए रखते हैं। कठिन यूनानी को मुख्य पाठ में अत्यधिक शाब्दिक और अस्वाभाविक बनाने के बजाय अर्थ-संगत वाक्य दिया गया है, और वास्तविक अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
