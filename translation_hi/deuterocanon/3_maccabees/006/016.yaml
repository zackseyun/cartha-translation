- source_word: λήγοντος ἄρτι
  choice: समाप्त ही कर रहा था
  rationale: संबंधकारक स्वतंत्र वाक्यांश और ἄρτι उस ठीक समय की समकालिकता व्यक्त करते हैं जब प्रार्थना अंत पर थी।
- source_word: προσευχῆς
  choice: प्रार्थना
  rationale: इस प्रसंग में προσευχή का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: παρῆγεν
  choice: की ओर बढ़ा
  rationale: παράγω यहाँ किसी स्थान के पास, उससे होकर, या उसके क्रम में आगे बढ़ने का भाव देता है; हिन्दी में यह राजकीय जुलूस की गति स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ τὸν ἱππόδρομον
  choice: घुड़दौड़ के मैदान की ओर
  rationale: κατά के स्थानीय प्रयोग की सटीक दिशा कुछ खुली है; यह अनुवाद गति को मैदान से जोड़ता है, पर भीतर से या किनारे-किनारे जाने का अनावश्यक निर्धारण नहीं करता।
- source_word: θηρίοις
  choice: हिंसक पशुओं
  rationale: कथा में ये प्राणदंड के लिए लाए गए खतरनाक पशु हैं; 'हिंसक पशु' सामान्य पाठक के लिए θηρίον की भयावहता स्पष्ट करता है।
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: अपनी सारी सेना के धमकी-भरे कोलाहल
  rationale: φρύαγμα में गरजते, उन्मत्त या डींगपूर्ण शोर की सजीव छवि है, जबकि δύναμις यहाँ सैन्य बल है; यह पदबंध शोर और धमकी दोनों को सुरक्षित रखता है।
