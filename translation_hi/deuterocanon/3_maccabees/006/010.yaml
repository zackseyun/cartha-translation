base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: hi
  text: पर यदि निर्वासन में हमारा जीवन-व्यवहार अधार्मिकता में लिप्त हो गया है, तो हमें शत्रुओं के हाथ से छुड़ाकर, हे स्वामी[b], जिस मृत्यु को तू चुने, उसी से हमें नष्ट कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘हे सर्वाधिपति’; यहाँ यूनानी संबोधन δέσποτα है, κύριος नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: ईश्वर के प्रति अनादर
  rationale: यह पद धार्मिक और नैतिक अभक्ति का बोध कराता है। ‘ईश्वर के प्रति अनादर’ इसके ईश्वर-संबंधी अर्थ को स्पष्ट रखता है और सामान्य ‘दुष्टता’ से अधिक सटीक है।
- source_word: κατὰ τὴν ἀποικίαν
  choice: निर्वासन में
  rationale: ἀποικία का शाब्दिक अर्थ बस्ती या उपनिवेश भी हो सकता है, पर इस प्रार्थना के संदर्भ में यह अपनी मातृभूमि से दूर बसे समुदाय की निर्वासित दशा को सूचित करता है।
- source_word: ὁ βίος ἡμῶν
  choice: हमारा जीवन-व्यवहार
  rationale: βίος यहाँ केवल जीवित रहने की दशा नहीं, बल्कि जीने के ढंग और आचरण को दर्शाता है।
- source_word: ἐνέσχηκται
  choice: लिप्त हो गया है
  rationale: पूर्णकालिक रूप ऐसी स्थिति बताता है जिसमें जीवन-व्यवहार अधार्मिकता में पड़कर उससे जुड़ गया है; ‘लिप्त’ इस नैतिक संलग्नता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ῥυσάμενος
  choice: छुड़ाकर
  rationale: अओरिस्ट कृदंत मुख्य आज्ञा से पहले होने वाले छुटकारे को दर्शाता है।
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: शत्रुओं के हाथ से
  rationale: यह किसी की शक्ति या अधिकार से छुड़ाए जाने का बाइबलीय मुहावरा है, जो हिन्दी में भी स्पष्ट है।
- source_word: ᾧ προαιρῇ ... μόρῳ
  choice: जिस मृत्यु को तू चुने, उसी से
  rationale: सम्बन्धवाचक दत्तिव और μόρῳ को साथ रखकर मृत्यु के प्रकार के विषय में परमेश्वर की इच्छा या चुनाव व्यक्त किया गया है।
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: δέσποτα पूर्ण अधिकार रखने वाले स्वामी के लिए संबोधन है और κύριος से भिन्न शब्द है; ‘स्वामी’ इस भेद को बनाए रखता है।
- source_word: ἀπόλεσον ἡμᾶς
  choice: हमें नष्ट कर दे
  rationale: आज्ञार्थक क्रिया की कठोरता को कम किए बिना मूल निवेदन को सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀποικία का प्रवासी/निर्वासित समुदाय के संदर्भ में अर्थ
  choice: निर्वासन में
  alternative: हमारी बस्ती में / उपनिवेश में
  rationale: राजनीतिक उपनिवेश का आधुनिक अर्थ भ्रामक हो सकता है। संदर्भ मातृभूमि से दूर रह रहे समुदाय का है, पर पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
- issue: δέσποτα को परमेश्वर के संबोधन के रूप में प्रस्तुत करना
  choice: हे स्वामी
  alternative: हे प्रभु / हे सर्वाधिपति
  rationale: मूल में κύριος नहीं, δέσποτα है। इसलिए परिचित ‘प्रभु’ के स्थान पर ‘स्वामी’ मूल शब्द के अधिकार-संबंधी बल और शब्दगत भेद को अधिक स्पष्ट रखता है।
- issue: शत्रुओं से छुटकारे के बाद परमेश्वर से मृत्यु की याचना
  choice: मूल की कठोर और तनावपूर्ण याचना को ज्यों का त्यों रखना
  alternative: इसे केवल दंड या विनाश के सामान्य रूपक के रूप में नरम करना
  rationale: वक्ता पहले शत्रुओं के हाथ से छुटकारा और फिर, दोषी पाए जाने पर, परमेश्वर द्वारा चुनी मृत्यु माँगता है। इस धर्मवैचारिक तनाव को व्याख्या द्वारा कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना-सुलभ रखी गई है। परमेश्वर के लिए निकट और प्रचलित एकवचन संबोधन ‘तू’ अपनाया गया है। ‘जीवन-व्यवहार’ βίος के आचरणगत अर्थ को व्यक्त करता है, जबकि ‘लिप्त हो गया है’ पूर्णकालिक नैतिक संलग्नता को बनाए रखता है।
