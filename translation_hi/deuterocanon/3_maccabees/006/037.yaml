  text: और वे राजा के पास गए और अपने घरों को लौटने के लिए अपनी रिहाई माँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέτυχον
  choice: पास जाकर विनती की
  rationale: यह क्रिया किसी से मिलने या उसके पास पहुँचने के साथ निवेदन करने का भाव भी रख सकती है। अगले कृदंत αἰτούμενοι के साथ मिलकर यहाँ राजा के सामने जाकर विनती करने का स्वाभाविक अर्थ बनता है।
- source_word: τῷ βασιλεῖ
  choice: राजा के पास
  rationale: सम्प्रदान कारक यहाँ उस व्यक्ति को बताता है जिसके सामने वे पहुँचे और जिससे निवेदन किया।
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: उन्हें ... लौट जाने की अनुमति दी जाए
  rationale: ἀπόλυσις का मूल भाव छोड़ दिए जाने या विदा किए जाने का है। प्रसंग में स्वाभाविक हिन्दी इसे घर लौटने की अनुमति के रूप में व्यक्त करती है, बिना व्यापक कानूनी मुक्ति का अर्थ जोड़े।
- source_word: εἰς τὰ ἴδια
  choice: अपने घर
  rationale: यूनानी मुहावरा अपने स्थान, घर, या अपनी वस्तुओं की ओर लौटने का संकेत दे सकता है; इस प्रसंग में 'अपने घर' सबसे स्वाभाविक है।
- source_word: αἰτούμενοι
  choice: विनती की कि
  rationale: यह कृदंत उनके राजा के पास जाने का उद्देश्य और उनकी माँग की विषयवस्तु बताता है। 'विनती की कि' आदरपूर्ण निवेदन का भाव स्पष्ट करता है।
