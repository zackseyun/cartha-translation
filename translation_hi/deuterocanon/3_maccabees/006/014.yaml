lexical_decisions:
- source_word: ἱκετεύει
  choice: विनती करती है
  rationale: यह क्रिया अत्यन्त आग्रहपूर्ण प्रार्थना या याचना व्यक्त करती है। ‘विनती करती है’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी में इसकी तीव्रता बनाए रखती है।
- source_word: τὸ πᾶν πλῆθος
  choice: पूरी भीड़
  rationale: यह पदसमूह एकत्र समूह की समग्रता पर बल देता है। ‘पूरी भीड़’ हिन्दी में स्वाभाविक रहते हुए πᾶν की व्यापकता और πλῆθος के सामूहिक भाव को व्यक्त करता है।
- source_word: τῶν νηπίων
  choice: नन्हे बच्चों
  rationale: νήπιοι बहुत छोटे बच्चों, यहाँ तक कि शिशुओं, को भी सूचित कर सकता है। ‘नन्हे बच्चे’ आयु-सीमा को अनावश्यक रूप से संकीर्ण किए बिना मूल के करुण भाव को बनाए रखता है।
- source_word: οἱ τούτων γονεῖς
  choice: उनके माता-पिता
  rationale: τούτων का संकेत पहले आए नन्हे बच्चों की ओर है। ‘उनके माता-पिता’ इस सम्बन्ध को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: μετὰ δακρύων
  choice: आँसू बहाते हुए
  rationale: मूल वाक्यांश आँसुओं के साथ की गई विनती का चित्र प्रस्तुत करता है। ‘आँसू बहाते हुए’ वर्तमान हिन्दी में ‘आँसुओं के साथ’ की अपेक्षा अधिक स्वाभाविक और समान रूप से सजीव है।
