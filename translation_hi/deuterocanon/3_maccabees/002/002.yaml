  yaml_path: translation/deuterocanon/3_maccabees/002/002.yaml
  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: hi
  text: क्योंकि तू ही वह है जिसने सब कुछ रचा है और जो सब पर प्रभुता रखता है; तू एक धर्मी शासक[a] है, और तू उन लोगों का न्याय करता है जो उद्दंडता और घमंड से कुछ भी करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायी शासक।” यूनानी शब्द δίκαιος का अर्थ “धर्मी” या “न्यायी,” और δυνάστης का अर्थ “शासक” या “सत्ताधारी” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: क्योंकि तू ही है
  rationale: γάρ प्रार्थना के तर्क को पिछले कथन से जोड़ता है, इसलिए ‘क्योंकि’ उपयुक्त है; स्पष्ट σὺ के बल को ‘ही’ से व्यक्त किया गया है।
- source_word: ὁ κτίσας τὰ πάντα
  choice: जिसने सब कुछ रचा
  rationale: संज्ञात्मक कृदंत की क्रियात्मक शक्ति बनी रहती है और τὰ πάντα की व्यापकता ‘सब कुछ’ से स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: जो समस्त सृष्टि पर प्रभुता रखता है
  rationale: ἐπικρατέω सक्रिय अधिकार और अधिपत्य दर्शाता है। ‘समस्त सृष्टि’ τῶν ὅλων को सृष्ट वस्तुओं की समग्रता के रूप में स्पष्ट करता है, जबकि ‘प्रभुता रखता है’ शासन-संबंधी अर्थ बनाए रखता है।
- source_word: δυνάστης
  choice: शासक
  rationale: यह शब्द अधिकार या प्रभुत्व रखनेवाले व्यक्ति को सूचित करता है। ‘शासक’ आधुनिक और सहज है तथा ‘सामर्थी’ की अपेक्षा शासन का भाव अधिक स्पष्ट रखता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यहाँ यह परमेश्वर के शासन और न्याय में उसके नैतिक चरित्र को दर्शाता है। ‘धर्मी’ अर्थ की व्यापकता बनाए रखता है; ‘न्यायी’ भी संभव है।
- source_word: τοὺς ὕβρει καὶ ἀγερωχίᾳ τι πράσσοντας
  choice: उन लोगों को जो उद्दंडता और घमंड से कोई काम करते हैं
  rationale: τι की अनिश्चितता ‘कोई काम’ से सुरक्षित रहती है। ὕβρις का अपमानजनक दुस्साहस ‘उद्दंडता’ और ἀγερωχία का अहंकारी भाव ‘घमंड’ से व्यक्त होता है।
- source_word: κρίνεις
  choice: न्याय करता है
  rationale: κρίνω का मूल न्यायिक अर्थ सुरक्षित रहता है और ‘दोषी ठहराता है’ जैसा अधिक निश्चित परिणाम पाठ में नहीं जोड़ा जाता।
theological_decisions:
- issue: परमेश्वर के शासन और न्याय के संदर्भ में δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ परमेश्वर के नैतिक चरित्र की व्यापकता को बनाए रखता है, जबकि अगले वाक्यांश में ‘न्याय करता है’ न्यायिक पक्ष को पहले ही स्पष्ट कर देता है। पादटिप्पणी वैध वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल यूनानी के प्रत्यक्ष संबोधन और हिन्दी की पारंपरिक भक्तिपरक निकटता को बनाए रखता है। वाक्य विन्यास को सहज रखते हुए सृष्टि, सार्वभौम प्रभुता और न्याय—तीनों भाव अलग और स्पष्ट रखे गए हैं।
