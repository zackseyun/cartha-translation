  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: hi
  text: 'और ऐसा न हो कि वह सब लोगों को घृणित दिखाई दे, उसने लिखित रूप में यह भी जोड़ दिया: “परन्तु यदि उनमें से कुछ लोग अनुष्ठानों में दीक्षित हुए लोगों[a] के बीच रहना चुनें, तो वह उन्हें अलेक्ज़ान्द्रिया-वासियों के समान नागरिक बना देता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रहस्य-अनुष्ठानों में दीक्षित हुए लोगों के बीच।” यूनानी में धार्मिक अनुष्ठानों में दीक्षा पाने से संबंधित शब्दावली प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: घृणित
  rationale: φαίνηται के साथ यह दूसरों की दृष्टि में घृणा का पात्र दिखाई देने का भाव व्यक्त करता है; ‘घृणित दिखाई दे’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल सक्रिय शत्रुता तक सीमित नहीं करता।
- source_word: ὑπέγραψεν
  choice: लिखित रूप में यह भी जोड़ दिया
  rationale: राजकीय आदेश के प्रसंग में यह किसी लिखित उपबंध को जोड़ने का संकेत देता है; यह अनुवाद दस्तावेज़ी अर्थ को स्पष्ट रखता है।
- source_word: προαιρῶνται
  choice: चुनें
  rationale: यह जान-बूझकर किए गए चुनाव या प्राथमिकता को दर्शाता है; ‘चुनें’ संक्षिप्त और सहज है।
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: अनुष्ठानों में दीक्षित हुए लोगों के बीच
  rationale: τελεταί और μεμυημένοι धार्मिक अनुष्ठान तथा उनमें दीक्षा पाने की भाषा है। यह रूप उस पंथ-संबंधी अर्थ को बनाए रखता है, पर किसी विशिष्ट उत्तरकालीन धार्मिक व्यवस्था को आरोपित नहीं करता।
- source_word: ἀναστρέφεσθαι
  choice: के बीच रहना
  rationale: इस प्रसंग में क्रिया जीवन बिताने, आचरण करने और किसी समुदाय के साथ संगति रखने के व्यापक भाव को समेटती है; हिन्दी में ‘के बीच रहना’ स्वाभाविक है और सामुदायिक संबंध को व्यक्त करता है।
- source_word: ἰσοπολίτας
  choice: समान नागरिक
  rationale: यह नागरिक स्तर और अधिकारों की समानता का कानूनी-राजनीतिक भाव रखता है।
- source_word: Ἀλεξανδρεῦσι
  choice: अलेक्ज़ान्द्रिया-वासियों के समान
  rationale: दत्तिव रूप तुलना व्यक्त करता है; जिन लोगों की चर्चा है, उन्हें अलेक्ज़ान्द्रिया के नागरिकों के बराबर दर्जा दिया जाता है।
- source_word: ποιεῖ
  choice: बना देता है
  rationale: उद्धृत आदेश के वर्तमानकालीन कानूनी प्रभाव को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यूनानी धार्मिक दीक्षा की शब्दावली
  choice: अनुष्ठानों में दीक्षित
  alternative: रहस्य-अनुष्ठानों में दीक्षित
  rationale: मूल यूनानी स्पष्ट रूप से धार्मिक अनुष्ठानों में दीक्षा का संकेत देता है। मुख्य पाठ में ‘अनुष्ठानों में दीक्षित’ इस अर्थ को बनाए रखता है, जबकि ‘रहस्य-अनुष्ठान’ की अधिक तकनीकी सम्भावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय आदेश के अनुरूप गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली। उद्धरण में यूनानी वर्तमानकाल का कानूनी प्रभाव बनाए रखा गया है। पादटिप्पणी-चिह्न उसी वाक्यांश पर रखा गया है जिससे उसका शाब्दिक संबंध है।
