  yaml_path: translation/deuterocanon/3_maccabees/002/031.yaml
  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: hi
  text: पर कुछ लोगों ने नगर की भक्ति के आधारों[a] को हल्के में तुच्छ जानकर अपने आपको आसानी से सौंप दिया, मानो राजा के साथ होनेवाले मेल-जोल से वे बड़ी प्रतिष्ठा के भागी होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नगर की भक्ति के सहारों” अथवा “नगर के भक्तिपूर्ण आचारों के आधारों।” यूनानी में आधार या सहारा बतानेवाला रूपक प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: कुछ लोगों
  rationale: यह अनिश्चित बहुवचन नगर के लोगों में से एक समूह की ओर संकेत करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐπιπολαίως
  choice: हल्के में लेकर
  rationale: यह उथले और असावधान रवैये को व्यक्त करता है, बिना उनके उद्देश्य को आवश्यकता से अधिक निश्चित किए।
- source_word: στυγοῦντες
  choice: तुच्छ जाना
  rationale: क्रिया में घृणा या तीव्र अस्वीकार का भाव है; ἐπιπολαίως के साथ यहाँ अवमाननापूर्ण ठुकराव को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐπιβάθρας
  choice: आधारों
  rationale: मूल शब्द आधार, टेक या सीढ़ी का अर्थ दे सकता है। यहाँ रूपक रूप में नगर की धार्मिक भक्ति को सहारा देनेवाली बातों का संकेत है; 'आधारों' रूपक को बनाए रखता है।
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: नगर की भक्ति के
  rationale: εὐσέβεια धार्मिक श्रद्धा और भक्तिपूर्ण आचरण को सूचित करता है। 'नगर की भक्ति' नागरिक-धार्मिक संदर्भ को संक्षेप में बनाए रखता है।
- source_word: εὐχερῶς
  choice: सहज ही
  rationale: यह तत्परता और बिना हिचक के किए गए आत्मसमर्पण, दोनों का भाव देता है।
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: अपने आप को ... सौंप दिया
  rationale: 'प्रतिबिंबात्मक अर्थ स्पष्ट है: उन्होंने स्वेच्छा से स्वयं को सौंपा।'
- source_word: κοινωνήσοντες
  choice: भागी होंगे
  rationale: भावी सहभागिता की अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐκλείας
  choice: प्रतिष्ठा
  rationale: यह अच्छी ख्याति या सार्वजनिक सम्मान का अर्थ देता है; 'प्रतिष्ठा' अनावश्यक धर्मवैज्ञानिक अर्थ जोड़े बिना उस भाव को व्यक्त करता है।
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: राजा के साथ होनेवाले भावी मेल-जोल से
  rationale: सυναναστροφή सामाजिक संगति या संपर्क को सूचित करता है और ἐσομένης उसके भावी होने को दर्शाता है; 'मेल-जोल' निकट मित्रता का अतिरिक्त अर्थ जोड़े बिना दोनों बातों को रखता है।
theological_decisions:
- issue: नागरिक-धार्मिक संदर्भ में εὐσεβείας का अनुवाद
  choice: नगर की भक्ति
  alternative: नगर का धर्म; नगर के भक्तिपूर्ण आचार
  rationale: '''भक्ति'' धार्मिक श्रद्धा और आचरण के नैतिक-धार्मिक भाव को बनाए रखता है और इसे केवल संस्था के अर्थ में सीमित नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। मूल के रूपक और भावी राजकीय संगति से प्रतिष्ठा पाने की विडंबनापूर्ण अपेक्षा को बनाए रखा गया है।
