  text: wipe away our sins[a], and scatter our errors[c][b], and let your mercy shine forth at this hour.
translation:
  language: hi
  text: हमारे पापों को मिटा दे[a], हमारी भूलों को तितर-बितर कर दे[b], और इस घड़ी अपनी दया प्रकट कर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे पापों को पोंछ डाल।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी शब्द का अर्थ ‘मूर्खताएँ’, ‘विवेकहीन चूकें’ या ‘भूलें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपनी दया को प्रकाशमान कर’; यूनानी क्रिया में प्रकट करने और चमक उठने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάλειψον
  choice: मिटा दे
  rationale: यह क्रिया पोंछकर हटाने या लेख मिटा देने का बिंब रखती है। ‘मिटा दे’ आधुनिक हिन्दी में स्वाभाविक है और पापों के पूर्ण निष्कासन का भाव बनाए रखती है।
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: हमारे पापों को
  rationale: ἁμαρτία के नैतिक और धार्मिक अर्थ के लिए ‘पाप’ मानक तथा प्रसंगानुकूल शब्द है।
- source_word: διασκέδασον
  choice: तितर-बितर कर दे
  rationale: क्रिया का मूल अर्थ बिखेरना या छिन्न-भिन्न करना है। ‘तितर-बितर कर दे’ यूनानी रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: हमारी भूलों को
  rationale: दुर्लभ संज्ञा ἀμβλακία भूल, मूर्खता या विवेकहीन चूक का संकेत दे सकती है। ‘भूलों’ से इसे ‘पापों’ से अलग रखा गया है, पर अर्थ को केवल बौद्धिक त्रुटि तक सीमित न मानने के लिए पादटिप्पणी दी गई है।
- source_word: ἐπίφανον
  choice: प्रकट कर
  rationale: ἐπιφαίνω यहाँ दया को दिखाई देने या प्रकट होने देने की प्रार्थना व्यक्त करता है। ‘प्रकट कर’ सहज हिन्दी है; प्रकाशमान होने का संभावित बिंब पादटिप्पणी में सुरक्षित है।
- source_word: τὸ ἔλεός σου
  choice: अपनी दया
  rationale: ἔλεος के लिए ‘दया’ क्षमा और करुणा दोनों से जुड़ा मानक धार्मिक शब्द है।
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: इस घड़ी
  rationale: यह पद वर्तमान संकट के निश्चित और तात्कालिक समय को दर्शाता है। ‘इस घड़ी’ प्रार्थना की गरिमा और तात्कालिकता दोनों बनाए रखता है।
theological_decisions:
- issue: ‘पापों’ और ἀμβλακίας के बीच संबंध
  choice: दूसरे पद को अलग रखते हुए ‘भूलों’ के रूप में अनूदित किया गया है।
  alternative: दोनों को व्यापक रूप से ‘पापों’ या ‘अपराधों’ के समानार्थी रूप में देना; अथवा ἀμβλακίας को अधिक तीखे ढंग से ‘मूर्खताओं’ कहना।
  rationale: यूनानी पाठ दो भिन्न संज्ञाओं का प्रयोग करता है। ‘पापों’ और ‘भूलों’ का भेद प्रार्थना की संचयी स्वीकारोक्ति को बनाए रखता है, बिना किसी कठोर पारिभाषिक धर्मवैज्ञानिक अंतर को आरोपित किए।
- issue: दिव्य दया के ‘प्रकट होने’ का स्वरूप
  choice: आज्ञार्थक वाक्य ‘अपनी दया प्रकट कर’ रखा गया है।
  alternative: ‘अपनी दया को चमकने दे’ या ‘अपनी दया दिखा।’
  rationale: यूनानी क्रिया में प्रकट होने और प्रकाशमान होने दोनों की छटा संभव है। मुख्य पाठ स्वाभाविक हिन्दी चुनता है और प्रकाश-बिंब को पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, विनयपूर्ण और प्रार्थनात्मक रखी गई है। एकवचन निकट संबोधन के आज्ञार्थक रूप—‘मिटा दे’, ‘कर दे’, ‘प्रकट कर’—मूल यूनानी प्रार्थना की सीधी और अत्यावश्यक पुकार को व्यक्त करते हैं। ‘इस घड़ी’ औपचारिकता और तात्कालिकता का संतुलन रखता है।
