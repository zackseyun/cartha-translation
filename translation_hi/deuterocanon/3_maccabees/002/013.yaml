  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: hi
  text: परन्तु हमारी दुर्दशा में यह धृष्ट और अपवित्र मनुष्य उस पवित्र स्थान का घोर अपमान करने पर तुला है, जो पृथ्वी पर आपकी महिमा के नाम से प्रतिष्ठित किया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पृथ्वी पर आपकी महिमा के नाम से निर्दिष्ट किया गया है।”
    reason: ἀναδεδειγμένον का अर्थ ‘प्रतिष्ठित’ के साथ ‘नियुक्त/निर्दिष्ट’ या सार्वजनिक रूप से चिह्नित किया गया भी हो सकता है।
lexical_decisions:
- source_word: καταπτώσει
  choice: पतन के समय
  rationale: यह संज्ञा गिरने, ढहने या दुर्दशा में पड़ने का भाव रखती है। संदर्भ में समुदाय की दीन अवस्था अभिप्रेत है; ‘पतन’ उसकी गंभीरता बनाए रखता है।
- source_word: θρασὺς
  choice: धृष्ट
  rationale: यहाँ साहस प्रशंसनीय नहीं, बल्कि निर्लज्ज दुस्साहस है। ‘धृष्ट’ इस नकारात्मक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: βέβηλος
  choice: अपवित्र
  rationale: शब्द पवित्र वस्तुओं के प्रति अनादर और पवित्रता से बाहर होने का भाव देता है। आगे आने वाले ‘पवित्र स्थान’ के साथ इसका विरोध भी बना रहता है।
- source_word: ἐπιτηδεύει
  choice: तुला है
  rationale: क्रिया किसी काम को उद्देश्यपूर्वक करने में लगे होने या उस पर आमादा होने का संकेत देती है। ‘तुला है’ सतत और जानबूझकर किए जा रहे प्रयत्न को व्यक्त करता है।
- source_word: καθυβρίσαι
  choice: घोर अपमान करने
  rationale: यह प्रबल क्रिया उद्दंडतापूर्ण अपमान या दुर्व्यवहार बताती है। ‘घोर अपमान’ उसकी तीव्रता को साधारण ‘अपमान’ से अधिक स्पष्ट करता है।
- source_word: ἀναδεδειγμένον
  choice: प्रतिष्ठित किया गया है
  rationale: पूर्ण कृदन्त किसी स्थान को नियुक्त, निर्दिष्ट या सार्वजनिक रूप से मान्य ठहराए जाने का भाव दे सकता है। ‘प्रतिष्ठित’ धार्मिक संदर्भ में स्वाभाविक है और केवल प्रशासनिक नियुक्ति तक अर्थ को सीमित नहीं करता।
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: आपकी महिमा के नाम से
  rationale: संक्षिप्त यूनानी दत्तिव वाक्यांश की ‘नाम’ और ‘महिमा’ दोनों संज्ञाएँ सुरक्षित रखी गई हैं; इसे केवल ‘आपके महिमामय नाम’ में नहीं समेटा गया।
- source_word: ἅγιον τόπον
  choice: पवित्र स्थान
  rationale: यह मंदिर की ओर संकेत करता है, पर यूनानी में यहाँ भीतरी गर्भगृह के लिए कोई अधिक तकनीकी पद नहीं है। इसलिए व्यापक और सीधा ‘पवित्र स्थान’ रखा गया है।
theological_decisions:
- issue: पवित्र स्थान का संदर्भ
  choice: ‘पृथ्वी पर पवित्र स्थान’ को व्यापक रूप में रखा गया है, जो संदर्भ में यरूशलेम के मंदिर की ओर संकेत करता है।
  alternative: इसे विशेष रूप से ‘पवित्रस्थान’ या मंदिर के भीतरी भाग के रूप में अनूदित करना।
  rationale: यूनानी पाठ ἅγιον τόπον कहता है, कोई संकीर्ण तकनीकी मंदिर-पद नहीं। अतः अनुवाद संदर्भगत मंदिर-संकेत बनाए रखते हुए किसी खास कक्ष तक अर्थ को सीमित नहीं करता।
- issue: ἀναδεδειγμένον और परमेश्वर के नाम का संबंध
  choice: ‘आपकी महिमा के नाम से प्रतिष्ठित किया गया है’
  alternative: ‘आपकी महिमा के नाम से चिह्नित किया गया है’ या ‘प्रकट किया गया है’
  rationale: क्रिया नियुक्ति, निर्दिष्ट किए जाने और सार्वजनिक रूप से प्रकट/मान्य किए जाने के बीच अर्थ-क्षेत्र रखती है। मुख्य पाठ में स्वाभाविक ‘प्रतिष्ठित’ और पादटिप्पणी में ‘चिह्नित’ देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ‘धृष्ट’, ‘अपवित्र’, ‘घोर अपमान’ और ‘तुला है’ मूल के तीखे नैतिक भाव को सहज भाषा में व्यक्त करते हैं; वाक्य को अनावश्यक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचाया गया है।
