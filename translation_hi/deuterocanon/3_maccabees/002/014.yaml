translation:
  language: hi
  text: क्योंकि तेरा निवास-स्थान तो स्वर्ग का स्वर्ग[a] है, जो मनुष्यों की पहुँच से परे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गों का स्वर्ग” अथवा “सर्वोच्च स्वर्ग।” यूनानी में सर्वोच्च स्वर्ग के लिए एक सामी अभिव्यक्ति सुरक्षित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: निवास-स्थान
  rationale: यह संज्ञा रहने के स्थान को दर्शाती है। ‘निवास-स्थान’ मूल के ठोस स्थानवाचक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: स्वर्ग का स्वर्ग
  rationale: यह अनुवाद यूनानी में सुरक्षित सामी श्रेष्ठतासूचक अभिव्यक्ति के असामान्य रूप को बनाए रखता है। अधिक सहज अर्थ ‘स्वर्गों का स्वर्ग’ या ‘सर्वोच्च स्वर्ग’ हो सकता है, जिसे पादटिप्पणी में दिया गया है।
- source_word: ἀνέφικτος
  choice: पहुँच से परे
  rationale: विशेषण का अर्थ है जिसे पाया या जिस तक पहुँचा न जा सके। ‘पहुँच से परे’ आधुनिक हिन्दी में स्पष्ट है और मानवीय अगम्यता का भाव सुरक्षित रखता है।
- source_word: ἀνθρώποις
  choice: मनुष्यों की
  rationale: यूनानी बहुवचन समस्त मानवजाति को सामान्य रूप से सूचित करता है, न कि केवल पुरुषों को; इसलिए ‘मनुष्यों’ अर्थ की परिधि को ठीक व्यक्त करता है।
theological_decisions:
- issue: οὐρανὸς τοῦ οὐρανοῦ में सामी श्रेष्ठतासूचक अभिव्यक्ति
  choice: स्वर्ग का स्वर्ग
  alternative: स्वर्गों का स्वर्ग; सर्वोच्च स्वर्ग
  rationale: मुख्य पाठ में स्रोत की विशिष्ट और धर्मवैचारिक रूप से अनुगूँजपूर्ण अभिव्यक्ति रखी गई है; पादटिप्पणी उसके सम्भावित अर्थ को स्पष्ट करती है, बिना उसे केवल व्याख्यात्मक रूप में सीमित किए।
- issue: ἀνθρώποις का सामान्य मानव-सूचक अर्थ
  choice: मनुष्यों की पहुँच से परे
  alternative: लोगों की पहुँच से परे
  rationale: यहाँ शब्द पूरी मानवजाति के लिए प्रयुक्त है। ‘मनुष्यों’ से स्रोत का मानव-सूचक अर्थ स्पष्ट और सटीक रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरा’ प्रार्थना में परमेश्वर को सीधे सम्बोधित करने वाले एकवचन रूप को सुरक्षित रखता है; ‘तो’ यूनानी μέν के हल्के बल को व्यक्त करता है।
