  register: भाषा आधुनिक मानक हिंदी में है, पर कथात्मक गरिमा बनाए रखती है। ‘धृष्टता पर उतर आया’, ‘जगह-जगह’ और ‘पूरा ज़ोर लगाकर’ सामान्य पाठक के लिए सहज हैं। वाक्य की लंबी यूनानी संरचना को अर्धविराम से स्पष्ट किया गया है।
