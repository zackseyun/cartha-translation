base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: hi
  text: वह न केवल निर्लज्ज दुराचारों से भीतर तक भड़क उठा, बल्कि इतनी धृष्टता पर उतर आया कि जगह-जगह[b] निंदात्मक बातें[a] फैलाई जाने लगीं; और उसके बहुत-से मित्र, राजा के उद्देश्य की ओर पूरा ज़ोर लगाते हुए, स्वयं भी उसकी इच्छा के अनुसार चलने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपमानजनक बातें’ अथवा ‘बदनामी की बातें’। यूनानी शब्द व्यापक रूप से बुरी, अपमानजनक या मानहानिकारक बातों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इलाकों में’ अथवा ‘स्थानीय स्थानों में’। यूनानी पद विभिन्न स्थानों या क्षेत्रों का संकेत दे सकता है, पर उसकी सटीक भौगोलिक सीमा स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: भीतर तक भड़क उठा
  rationale: क्रिया का मूल बिंब काटे या कचोटे जाने का है; यहाँ वह दुराचार से भीतर ही भीतर प्रेरित और उत्तेजित होने का भाव देती है। हिंदी में यह चयन उस तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: निर्लज्ज दुराचारों
  rationale: यह पदबंध लज्जाहीन, बेलगाम और नैतिक रूप से घोर आचरण को बहुवचन में व्यक्त करता है। ‘दुराचारों’ अर्थ को केवल यौन आचरण तक अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: इतनी धृष्टता पर उतर आया
  rationale: यह मुहावरा बढ़ते-बढ़ते अत्यधिक दुस्साहस या उद्दंडता तक पहुँचने का भाव देता है; हिंदी अभिव्यक्ति गति और नैतिक निंदा दोनों बनाए रखती है।
- source_word: δυσφημίας
  choice: बदनामी की बातें
  rationale: शब्द अपमानजनक, निंदात्मक या मानहानिकारक कथनों का संकेत दे सकता है। यह सहज हिंदी है और धार्मिक ‘ईशनिंदा’ का अनावश्यक विशिष्टीकरण नहीं करती।
- source_word: ἐν τοῖς τόποις
  choice: जगह-जगह
  rationale: यूनानी पद सामान्य रूप से विभिन्न स्थानों या इलाकों की ओर संकेत करता है। ‘जगह-जगह’ स्वाभाविक हिंदी में व्यापक स्थानीय प्रसार का भाव रखता है, बिना ठीक प्रशासनिक सीमा तय किए।
- source_word: συνίστασθαι
  choice: खड़ी की जाने लगीं
  rationale: संदर्भ में यह निंदात्मक बातों को संगठित ढंग से उत्पन्न या प्रचलित किए जाने का भाव देता है। कर्मवाच्य रूप यूनानी infinitive की संरचना और उकसावे के भाव को सुरक्षित रखता है।
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: राजा के उद्देश्य को आगे बढ़ाने में पूरा ज़ोर लगाकर
  rationale: ἐντείνοντας में खिंचाव, प्रयास और किसी दिशा में शक्ति लगाने का भाव है। यह अनुवाद मित्रों की सक्रिय और उत्सुक सहभागिता व्यक्त करता है, किंतु उन्हें उद्देश्य का स्वतंत्र रचयिता नहीं बनाता।
- source_word: θελήσει
  choice: इच्छा
  rationale: यह उस शासक की चाह या संकल्प को दर्शाता है जिसका वे अनुसरण करते हैं। ‘इच्छा’ वर्तमान हिंदी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: शासक के आचरण का नैतिक वर्णन
  choice: ‘निर्लज्ज दुराचारों’ जैसे प्रबल नैतिक शब्द बनाए रखे गए।
  alternative: ‘अनैतिक व्यवहार’ जैसा नरम और सामान्य अनुवाद।
  rationale: यूनानी पाठ अत्यंत कठोर नैतिक निंदा करता है; उसे नरम करना उचित नहीं, पर बाद की किसी विशिष्ट धर्मशास्त्रीय श्रेणी को जोड़ना भी उचित नहीं।
- issue: अंतिम सर्वनाम का पूर्वपद
  choice: ‘उसी की इच्छा’ को राजा की इच्छा माना गया।
  alternative: ἐκείνου को किसी दूसरे, अप्रकट व्यक्ति से जोड़ना।
  rationale: निकटतम स्पष्ट पुरुष-संदर्भ राजा है और वाक्य का प्रवाह उसी के उद्देश्य तथा इच्छा के बीच संबंध बनाता है। ‘उसी’ इस संबंध को स्पष्ट करता है, फिर भी अतिरिक्त नाम नहीं जोड़ता।
- issue: राजा के मित्रों की भूमिका
  choice: उन्हें राजा के उद्देश्य को आगे बढ़ाने में पूरा ज़ोर लगाते और उसकी इच्छा का अनुसरण करते दिखाया गया।
  alternative: उन्हें केवल निष्क्रिय रूप से राजा के पक्ष में झुकता हुआ या स्वयं राजा को उकसाता हुआ बताना।
  rationale: ἐντείνοντας सक्रिय प्रयास दर्शाता है, पर इसकी दिशा-संबंधी संरचना कुछ लचीली है। चुना हुआ रूप सक्रिय सहयोग को व्यक्त करता है और आवश्यकता से अधिक कारणात्मक अर्थ नहीं थोपता।
