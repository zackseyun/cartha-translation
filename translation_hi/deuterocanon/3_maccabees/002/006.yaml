  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: hi
  text: और जब उसने रथों और लोगों की भारी भीड़ के साथ उसका पीछा किया,[a] तब तूने उसे समुद्र की गहराइयों में डुबो दिया; पर जिन्होंने तुझ पर भरोसा रखा था, उन्हें तूने, जो सारी सृष्टि पर शासन करता है,[b] सुरक्षित पार पहुँचा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह पद निर्गमन की घटना की ओर संकेत करता है: मिस्री पीछा करने वाला समुद्र में डुबो दिया गया, जबकि परमेश्वर के लोगों को सुरक्षित पार पहुँचाया गया।'
    reason: cross_reference
  - marker: b
    text: या, “सारी सृष्टि का अधिपति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδιώξαντα
  choice: पीछा करने लगा
  rationale: यह कृदंत शत्रुतापूर्ण और सक्रिय पीछा करने को व्यक्त करता है। हिन्दी में यह स्वाभाविक है और निर्गमन के संकेत को बिना नाम जोड़े बनाए रखता है।
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: रथों और लोगों की भारी भीड़ के साथ
  rationale: ἅρμασιν का सीधा अर्थ ‘रथों’ है और ὄχλων πλήθει बड़ी जन-भीड़ या विशाल समूह को दर्शाता है। यह रूप संख्या और सामूहिक बल दोनों को सहज हिन्दी में रखता है।
- source_word: ἐπέκλυσας
  choice: डुबो दिया
  rationale: क्रिया जल से ढक देने या अभिभूत कर देने का बोध कराती है। समुद्र के प्रसंग में ‘डुबो दिया’ स्पष्ट, स्वाभाविक और प्रभावपूर्ण है।
- source_word: βάθει θαλάσσης
  choice: समुद्र की गहराई में
  rationale: यह पद स्थान अथवा साधन दोनों की छाया रख सकता है; हिन्दी रूप मुख्यतः स्थान को व्यक्त करता है और समुद्र की विनाशकारी गहराई का भाव भी बनाए रखता है।
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: जिन्होंने तुझ पर भरोसा रखा था
  rationale: मूल वाक्यांश किसी पर अपना विश्वास टिकाने का अर्थ देता है। ‘भरोसा रखा था’ व्यक्तिगत निर्भरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: जो सारी सृष्टि पर प्रभुता रखता है
  rationale: δυναστεύω शासन या अधिकार चलाने को दर्शाता है। ‘प्रभुता रखता है’ सार्वभौम अधिकार का धार्मिक भार बनाए रखता है, जबकि पादटिप्पणी अधिक सीधा विकल्प देती है।
- source_word: σώους διεκόμισας
  choice: सुरक्षित पार पहुँचा दिया
  rationale: σώους अहानिकर या सुरक्षित रहने और διακομίζω पार ले जाने का संयुक्त भाव देता है। यह अनुवाद उद्धार और पारगमन दोनों को स्पष्ट करता है।
theological_decisions:
- issue: ऐतिहासिक-बाइबलीय संकेत की पहचान
  choice: मुख्य पाठ में पात्रों के नाम जोड़े बिना सर्वनामों को बनाए रखा गया है।
  alternative: ‘फ़िरौन’ और ‘इस्राएलियों’ को मुख्य पाठ में स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ इस पद में नाम नहीं देता। निर्गमन का संकेत स्पष्ट है, पर नाम जोड़ना मूल की अंतर्निहितता को समाप्त कर देता; इसलिए उसे पादटिप्पणी में समझाया गया है।
- issue: परमेश्वर की सार्वभौम प्रभुता
  choice: ‘जो सारी सृष्टि पर प्रभुता रखता है’
  alternative: ‘जो सारी सृष्टि पर शासन करता है’
  rationale: यह पद परमेश्वर के समस्त सृष्टि पर अधिकार को व्यक्त करता है। चुना हुआ रूप धार्मिक गरिमा बनाए रखता है, जबकि वैकल्पिक सहज रूप पादटिप्पणी में दिया गया है।
- issue: समुद्र की गहराई वाले पद का व्याकरणिक संबंध
  choice: ‘समुद्र की गहराई में’—स्थानवाचक रूप
  alternative: ‘समुद्र की गहराई के द्वारा’—करणवाचक रूप
  rationale: यूनानी कारक स्थान और साधन के बीच कुछ लचीलापन रखता है। हिन्दी में स्थानवाचक रूप अधिक स्वाभाविक है और प्रसंग के अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए ‘तू’ मूल के एकवचन संबोधन और हिन्दी की पारंपरिक भक्तिपरक निकटता को दर्शाता है; पात्रों के नाम मूल पाठ से बाहर होने के कारण मुख्य पाठ में नहीं जोड़े गए।
