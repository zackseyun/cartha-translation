review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the threefold sequence in the Greek: present suffering (καταπονούμεθα), subjection to enemies (ὑπετάγημεν), and a condition of weakness/abandonment (παρείμεθα ἐν ἀδυναμίαις). The causal force of διὰ and the unexpanded divine address ἅγιε Βασιλεῦ are also preserved. However, the final Hindi clause, “निर्बल अवस्था में पड़े हैं,” can primarily suggest physically lying down and does not clearly convey the passive ‘left/abandoned’ nuance of παρείμεθα.'
  naturalness: The register is generally natural and appropriately prayerful. “परन्तु अब देख, हे पवित्र राजा!” is acceptable in elevated direct address. A small adjustment to the final clause makes the meaning clearer in modern Hindi without altering the parallel structure.
  terminology: “पवित्र राजा,” “पापों,” “शत्रुओं के अधीन,” and “निर्बल अवस्था” are suitable and do not introduce theological interpretation beyond the source.
  issues:
  - severity: low
    issue: The final clause can be read as describing posture rather than abandonment in weakness.
    rationale: παρείμεθα carries the sense of being left or abandoned, and ἐν ἀδυναμίαις specifies the resulting state of weakness. “छोड़ दिए गए हैं” makes this source nuance explicit and is idiomatic Hindi.
