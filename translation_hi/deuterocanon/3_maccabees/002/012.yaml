lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: परन्तु अब देख
  rationale: ἰδού की ध्यान आकर्षित करने वाली शक्ति और δὲ के विरोधात्मक संक्रमण को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἅγιε Βασιλεῦ
  choice: हे पवित्र राजा
  rationale: प्रत्यक्ष सम्बोधन और दोनों शब्दों के रूप को निकटता से सुरक्षित रखता है।
- source_word: καταπονούμεθα
  choice: हम सताए जा रहे हैं
  rationale: क्रिया यहाँ कष्ट पहुँचाए जाने और दबाए जाने का भाव देती है; कर्मवाच्य रूप भी सुरक्षित है।
- source_word: ὑπετάγημεν τοῖς ἐχθροῖς ἡμῶν
  choice: हम अपने शत्रुओं के अधीन कर दिए गए हैं
  rationale: ὑποτάσσω के अधीन किए जाने के अर्थ और कर्मवाच्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: निर्बल अवस्था में पड़े हैं
  rationale: παρίημι के ढीले या असहाय छोड़ दिए जाने और ἀδυναμίαις की निर्बलता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पाप और वर्तमान दुर्दशा के बीच कारण-संबंध
  choice: ‘हमारे बहुत-से और बड़े पापों के कारण’ के रूप में स्पष्ट कारण-संबंध रखा गया
  alternative: इसे केवल सामान्य विपत्ति या नैतिक टिप्पणी के रूप में नरम करना
  rationale: यूनानी διὰ के साथ कर्मकारक सीधे कारण बताता है; प्रार्थना की सामूहिक स्वीकारोक्ति को कम नहीं किया गया।
- issue: ‘पवित्र राजा’ की पहचान
  choice: उपाधि को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: ‘पवित्र परमेश्वर और राजा’ अथवा किसी विशिष्ट ईश-नाम का प्रयोग
  rationale: मूल पाठ केवल ἅγιε Βασιλεῦ कहता है; अनुवाद में उससे अधिक पहचान जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक, गरिमापूर्ण और सहज बोधगम्य स्तर रखा गया है। ईश्वर के सीधे सम्बोधन में पारंपरिक एकवचन ‘देख’ मूल के सम्बोधन से मेल खाता है; शेष वाक्य में सामूहिक स्वीकारोक्ति और तीन समानांतर विपत्तियाँ सुरक्षित हैं।
