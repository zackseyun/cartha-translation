  text: परन्तु अब देख, हे पवित्र राजा! हमारे बहुत-से और बड़े पापों के कारण हम सताए जा रहे हैं; हम अपने शत्रुओं के अधीन कर दिए गए हैं और निर्बल अवस्था में छोड़ दिए गए हैं।
