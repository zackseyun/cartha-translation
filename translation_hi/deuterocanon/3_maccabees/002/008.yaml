base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: hi
  text: हे राजा, आपने असीम और अपरिमेय पृथ्वी की सृष्टि की, इस नगर को चुना और इस स्थान को अपने नाम के लिए पवित्र किया—आप, जिन्हें किसी भी वस्तु की आवश्यकता नहीं है[b]—और महिमामय प्रकटन[a] के द्वारा इसे गौरवान्वित किया, इसे अपने महान और आदरणीय नाम की महिमा के लिए स्थापित करके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘महिमामय दर्शन में’ या ‘भव्य प्रकटन के द्वारा’ भी हो सकता है। यूनानी पद किसी दिखाई देनेवाले दिव्य प्रकटन की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस खंड की यूनानी वाक्यरचना कठिन है। यहाँ इसका अर्थ संबोधन के रूप में लिया गया है: ‘आप, जिन्हें किसी भी वस्तु की आवश्यकता नहीं है।’ कुछ व्याख्याएँ इसे ‘हे सबके परमेश्वर, जिन्हें किसी वस्तु की आवश्यकता नहीं है’ के अर्थ में समझती हैं।'
    reason: alternative_reading
lexical_decisions:
