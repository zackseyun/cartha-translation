- source_word: κτίσας τὴν ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: असीम और अथाह पृथ्वी की सृष्टि की
  rationale: दोनों विशेषण सृष्टि के अपरिमित विस्तार पर बल देते हैं; ब्रह्मांडीय संदर्भ में γῆ का स्वाभाविक अर्थ ‘पृथ्वी’ है।
- source_word: ἐξελέξω
  choice: चुना
  rationale: नगर के परमेश्वर द्वारा चयन को सरल, स्वाभाविक और धर्मशास्त्रीय तकनीकी अर्थ जोड़े बिना व्यक्त करता है।
- source_word: ἡγίασας τὸν τόπον τοῦτον
  choice: इस स्थान को ... पवित्र किया
  rationale: ἁγιάζω के पवित्र करने अथवा अलग ठहराने के मूल भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς σὸν ὄνομα
  choice: अपने नाम के लिए
  rationale: स्थान के परमेश्वर के नाम हेतु समर्पित किए जाने का उद्देश्य सुरक्षित रहता है।
- source_word: ἀπροσδεεῖ
  choice: जिसे किसी भी वस्तु की आवश्यकता नहीं है
  rationale: परमेश्वर की निरपेक्ष अभावहीनता को अमूर्त पारिभाषिक शब्द के बजाय स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: παρεδόξασας
  choice: गौरवान्वित किया
  rationale: क्रिया में निहित महिमा और विशेष सम्मान के प्रबल भाव को बनाए रखता है।
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: अपनी महिमामय प्रकटता के द्वारा
  rationale: ἐπιφάνεια के दृश्य अथवा दिव्य प्रकटन के भाव और ἐν के साधनात्मक अर्थ, दोनों को सुरक्षित रखता है।
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: इसे ... स्थापित किया
  rationale: स्रोत की संक्षिप्त संज्ञात्मक रचना को स्वाभाविक हिन्दी क्रिया में व्यक्त करता है, बिना यह तय किए कि नगर या पवित्र स्थान में से कौन मुख्य अभिप्रेत है।
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: अपने महान और आदरणीय नाम की महिमा के लिए
  rationale: πρός का उद्देश्यसूचक अर्थ तथा ‘महिमा’, ‘महान’, ‘आदरणीय’ और ‘नाम’ की प्रमुख शब्दावली बनाए रखता है।
theological_decisions:
- issue: σοὶ τῷ τῶν ἁπάντων ἀπροσδεεῖ की कठिन वाक्यरचना
  choice: ‘अपने लिए, जिसे किसी भी वस्तु की आवश्यकता नहीं है’
  alternative: ‘हे सबके परमेश्वर, यद्यपि आपको किसी वस्तु की आवश्यकता नहीं है’
  rationale: यूनानी में ‘परमेश्वर’ शब्द स्पष्ट रूप से नहीं है और τῶν ἁπάντων को ἀπροσδεεῖ के साथ ‘किसी भी वस्तु की आवश्यकता न होना’ समझा जा सकता है। मुख्य पाठ इस निकटतर व्याकरणिक संबंध को रखता है और कठिनाई को पादटिप्पणी में बताता है।
- issue: ἐπιφανείᾳ का आशय
  choice: ‘प्रकटता’
  alternative: ‘दर्शन’ अथवा ‘तेजस्वी प्रकटन’
  rationale: शब्द संभवतः दृश्य दिव्य प्रकटन का संकेत देता है, पर मुख्य पाठ उस घटना के स्वरूप को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय प्रार्थना-शैली रखी गई है। आदरसूचक ‘आप’ का प्रयोग किया गया है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि सृष्टि, चयन, पवित्रीकरण, दिव्य प्रकटन और नाम की महिमा की तार्किक क्रमबद्धता सुरक्षित है।
