translation:
  language: hi
  text: इसलिए उसके मित्र और अंगरक्षक उस पर आ पड़ी कड़ी ताड़ना[a] को देखकर भयभीत हो गए कि कहीं उसका जीवन भी साथ न छोड़ दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर आई तीव्र विपत्ति।” यूनानी शब्द ताड़ना या सुधारात्मक दंड का संकेत दे सकता है, पर इस दशा की ठीक-ठीक प्रकृति नहीं बताता।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कहीं जीना भी समाप्त न हो जाए।” अर्थात उन्हें डर था कि वह मर न जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से परिणाम निकालने वाला संबंधसूचक शब्द है; ‘इसलिए’ उसके कारणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φίλοι
  choice: मित्र
  rationale: मूल अर्थ ‘मित्र’ है। राजदरबार के संदर्भ में ये निकट दरबारी भी हो सकते हैं, पर पाठ स्वयं अधिक विशिष्ट पद की माँग नहीं करता।
- source_word: σωματοφύλακες
  choice: अंगरक्षक
  rationale: यह राजा की व्यक्तिगत सुरक्षा करने वालों के लिए स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: ὀξεῖαν ... εὔθυναν
  choice: कठोर दंड-यातना
  rationale: εὔθυναν यहाँ स्त्रीलिंग एकवचन कर्मकारक संज्ञा है, जिसका विशेषण ὀξεῖαν है; अतः इसका अर्थ कोई ‘सुधारने’ की क्रिया नहीं, बल्कि उस पर आई कठोर ताड़ना, दंड या विपत्ति है। ‘दंड-यातना’ न्यायिक/अनुशासनात्मक भाव और तीव्र पीड़ा, दोनों को बनाए रखता है।
- source_word: καταλαβοῦσαν αὐτόν
  choice: उस पर आ पड़ी
  rationale: कृदंत किसी दशा के उसे आ घेरने या पकड़ लेने का भाव देता है; ‘उस पर आ पड़ी’ स्वाभाविक हिन्दी में उसी अचानक आगमन को व्यक्त करता है।
- source_word: φοβούμενοι
  choice: डरने लगे
  rationale: मूल में यह कृदंत है। हिन्दी में पूर्ण और सुबोध वाक्य बनाने के लिए इसे मुख्य क्रिया के रूप में व्यक्त किया गया है, जबकि उनका भय यथावत रहता है।
- source_word: μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: कि कहीं उसका जीवन भी साथ न छोड़ दे
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से जीवन के चूक जाने या समाप्त हो जाने की आशंका बताती है। यह हिन्दी रूप मृत्यु की आशंका को स्पष्ट रखते हुए मूल बिंब को भी बचाता है।
