  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज वर्णनात्मक रजिस्टर रखा गया है। अंग्रेज़ी परामर्श-पाठ के विपरीत, εὔθυναν को क्रिया (‘मामला सुधारना’) नहीं माना गया, क्योंकि τὴν और ὀξεῖαν के साथ इसका रूप स्त्रीलिंग एकवचन कर्मकारक संज्ञा का है।
