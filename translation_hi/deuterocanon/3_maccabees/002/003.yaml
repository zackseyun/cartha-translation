  yaml_path: translation/deuterocanon/3_maccabees/002/003.yaml
  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: hi
  text: तूने प्राचीन काल के उन लोगों को, जिन्होंने अन्याय किया था—और जिनमें अपने बल और दुस्साहस[a] पर भरोसा रखनेवाले विशालकाय लोग भी थे—उन पर अपार जल[b] लाकर नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धृष्टता” अथवा “निर्भीकता”; यूनानी शब्द प्रसंग के अनुसार साहस या अहंकार-भरे दुस्साहस का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपार जल” है; यहाँ संकेत प्रलय के प्रचंड जल की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: पुराने समय के उन लोगों को
  rationale: यह पदबंध स्थान में आगे होने के बजाय पहले के युग के लोगों की ओर संकेत करता है।
- source_word: ἀδικίαν ποιήσαντας
  choice: जिन्होंने अधर्म किया था
  rationale: यह यूनानी कृदंत-पदबंध अन्याय या दुष्टता करने का अर्थ देता है; “अधर्म किया” नैतिक व्यापकता बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: γίγαντες
  choice: विशालकाय लोग
  rationale: मूल शब्द का सामान्य अर्थ giants है। “विशालकाय लोग” इसे स्पष्ट रखता है और “दैत्य” से जुड़ी अनावश्यक भारतीय पौराणिक छाया से बचता है।
- source_word: ῥώμῃ
  choice: बल
  rationale: यहाँ शारीरिक या प्रभावकारी सामर्थ्य का भाव है; “बल” संक्षिप्त और स्वाभाविक है।
- source_word: θράσει
  choice: दुस्साहस
  rationale: दुष्ट लोगों और न्याय के प्रसंग में शब्द का नकारात्मक भाव संभावित है। फिर भी इसकी अर्थगत व्यापकता को पादटिप्पणी में “धृष्टता” और “निर्भीकता” द्वारा सुरक्षित रखा गया है।
- source_word: πεποιθότες
  choice: भरोसा रखनेवाले
  rationale: पूर्ण कृदंत स्थिर या जमे हुए आत्मविश्वास को व्यक्त करता है; यह हिन्दी प्रयोग उस निरंतर भरोसे को सहज ढंग से बताता है।
- source_word: διέφθειρας
  choice: नष्ट कर दिया
  rationale: क्रिया निर्णायक विनाश को दर्शाती है और परमेश्वर द्वारा किए गए बीते न्याय के लिए उपयुक्त है।
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: उन पर अपार जल लाकर
  rationale: कृदंत विनाश का साधन बताता है। “अपार जल” मूल के “अमाप जल” को स्वाभाविक हिन्दी में रखता है, जबकि “प्रलय” की व्याख्या मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: प्रलय के समय न्याय पाए लोगों में γίγαντες की पहचान
  choice: “विशालकाय लोग” को स्पष्ट रूप से बनाए रखा और जल की प्रलय-संबंधी छवि को मूल शब्दावली में रहने दिया।
  alternative: “वीर पुरुष” कहना, अथवा ἀμέτρητον ὕδωρ का सीधा अनुवाद “प्रलय” करना।
  rationale: पद प्राचीन प्रलय के न्याय की ओर संकेत करता है, पर यूनानी पाठ स्वयं “विशालकाय लोग” और “अपार जल” कहता है। इसलिए उत्पत्ति की भाषा से अतिरिक्त सामंजस्य बैठाए बिना मूल की विशिष्ट शब्दावली सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रार्थना में परमेश्वर के एकवचन निकट संबोधन के अनुरूप “तूने” रखा गया है। लंबे यूनानी वाक्य की अंतःस्थ सूचना को डैशों से अलग किया गया है ताकि संबंध स्पष्ट रहे।
