lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: पैरों तले रौंदा / रौंदे जाते हैं
  rationale: दोनों रूपों में एक ही यूनानी क्रिया καταπατέω है। ‘रौंदना’ उसके ठोस अर्थ और पद में उपस्थित प्रभावशाली पुनरावृत्ति को बनाए रखता है; पहले प्रयोग में ‘पैरों तले’ जोड़ने से बिंब स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: τὸν οἶκον
  choice: भवन
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है। यहाँ संकेत मन्दिर की ओर है, फिर भी ‘भवन’ मूल शब्द की ठोस छवि को बनाए रखता है और हिन्दी में पवित्र उपासना-स्थल के लिए गरिमापूर्ण है।
- source_word: τοῦ ἁγιασμοῦ
  choice: पवित्रता के
  rationale: ἁγιασμός पवित्रता, पवित्रीकरण या समर्पण का भाव व्यक्त कर सकता है। इस मन्दिर-सन्दर्भ में ‘पवित्रता’ स्वाभाविक है और यूनानी की भाववाचक संज्ञा को भी बनाए रखता है।
- source_word: ὡς
  choice: जैसे
  rationale: यह तुलना आरम्भ करता है; ‘जैसे’ आधुनिक हिन्दी में सीधा और स्वाभाविक तुलनात्मक संयोजक है।
- source_word: οἱ οἶκοι
  choice: घर
  rationale: बहुवचन οἶκοι के लिए ‘घर’ सामान्य और स्पष्ट है। पहले पवित्र οἶκος के लिए ‘भवन’ और यहाँ आवासों के लिए ‘घर’ कहना हिन्दी में अर्थभेद को स्वाभाविक रूप से प्रकट करता है।
- source_word: τῶν προσολυμίων
  choice: यरूशलेम-निवासियों के
  rationale: यह रूप यरूशलेम के निवासियों को सूचित करता है। ‘यरूशलेम-निवासी’ संक्षिप्त और स्पष्ट है तथा नगर को नहीं, उसके लोगों को सम्बन्धसूचक बनाता है।
theological_decisions:
- issue: पवित्र οἶκος को शाब्दिक ‘घर/भवन’ कहा जाए या व्याख्यात्मक रूप से ‘मन्दिर’
  choice: पवित्रता का भवन
  alternative: पवित्र मन्दिर; पवित्रस्थान
  rationale: यूनानी पाठ οἶκος (‘घर/भवन’) के साथ ἁγιασμός की सम्बन्धकारक रचना रखता है। ‘भवन’ उस रचना और रौंदे जाने की ठोस छवि को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि अभिप्राय मन्दिर से है।
- issue: ἁγιασμός के भाव को ‘पवित्रता’, ‘पवित्रीकरण’ या ‘समर्पण’ के रूप में व्यक्त करना
  choice: पवित्रता
  alternative: पवित्रीकरण; पवित्र समर्पण
  rationale: ‘पवित्रता’ इस उपासना-स्थल के सन्दर्भ में सहज है और मूल की भाववाचक संज्ञा को बनाए रखता है। ‘पवित्रीकरण’ प्रक्रिया का अर्थ अधिक उभार सकता है, जिसे यहाँ निश्चित रूप से थोपना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और प्रार्थनात्मक स्वीकारोक्ति के अनुरूप गरिमापूर्ण रखी गई है। ‘पैरों तले रौंदा’ ठोस यूनानी बिंब को व्यक्त करता है, और सक्रिय तथा कर्मवाच्य रूपों में मूल क्रिया की पुनरावृत्ति सुरक्षित है।
