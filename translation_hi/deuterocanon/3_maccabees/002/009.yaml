  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: hi
  text: और इस्राएल के घराने से प्रेम रखते हुए तूने यह प्रतिज्ञा की थी कि यदि हम विमुख हो जाएँ[a] और संकट हमें आ घेरे, और हम अपने स्थान[b] पर आकर विनती करें, तो तू हमारी विनती सुनेगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम धर्मत्याग करें”; यूनानी शब्द का अर्थ विमुखता, फिर जाना, या धर्मत्याग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात सम्भवतः वह पवित्र स्थान या मंदिर जिसका उल्लेख प्रसंग में है; यूनानी पाठ यहाँ केवल “अपने स्थान” कहता है।
    reason: contextual_clarification
  - marker: c
    text: 'यूनानी पाठ में यहाँ परमेश्वर को संबोधित करते हुए द्वितीय पुरुष है: “तूने प्रतिज्ञा की ... तू सुनेगा।”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπῶν
  choice: प्रेम रखते हुए
  rationale: वर्तमान कृदंत का भाव बनाए रखते हुए इसे स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे स्पष्ट कारणवाचक ‘क्योंकि’ में नहीं बदला गया।
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: इस्राएल के घराने
  rationale: यह प्रचलित बाइबलीय सामूहिक अभिव्यक्ति है और οἶκος को केवल ‘लोगों’ में समतल नहीं करती।
- source_word: ἐπηγγείλω
  choice: तूने यह प्रतिज्ञा की थी
  rationale: रूप द्वितीय पुरुष एकवचन है; प्रार्थना में परमेश्वर को संबोधित करने वाला ‘तू’ हिन्दी में इसे स्पष्ट करता है।
- source_word: ἀποστροφή
  choice: हम विमुख हो जाएँ
  rationale: संज्ञा के ‘मुड़ जाने/विमुखता’ के भाव को सहज हिन्दी में क्रियात्मक रूप दिया गया है, बिना मुख्य पाठ में तकनीकी शब्द ‘धर्मत्याग’ थोपे।
- source_word: στενοχωρία
  choice: संकट
  rationale: यह घोर कठिनाई या क्लेश का स्पष्ट, सामान्य आधुनिक हिन्दी रूप है।
- source_word: καταλάβῃ
  choice: आ घेरे
  rationale: क्रिया का किसी विपत्ति द्वारा आ पकड़ने या घेर लेने का बल सुरक्षित रहता है।
- source_word: τὸν τόπον ἡμῶν
  choice: अपने स्थान
  rationale: यूनानी में केवल ‘हमारा/अपना स्थान’ है; सम्भावित मंदिर-संदर्भ को मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
- source_word: δεηθῶμεν
  choice: विनती करें
  rationale: यह सामान्य प्रार्थना से अधिक याचनापरक प्रार्थना को व्यक्त करता है और δεήσεως के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: εἰσακούσῃ τῆς δεήσεως ἡμῶν
  choice: तू हमारी विनती सुनेगा
  rationale: εἰσακούσῃ को प्रसंग और रूप के अनुसार भविष्यत् मध्यम द्वितीय पुरुष एकवचन माना गया है; इसका अर्थ अनुकूल होकर सुनना है।
theological_decisions:
- issue: वक्ता-संदर्भ और पुरुष
  choice: ‘तूने ... तू ... सुनेगा’ के रूप में परमेश्वर से प्रत्यक्ष संबोधन
  alternative: ‘मैंने ... मैं सुनूँगा’ के रूप में प्रत्यक्ष ईश्वरीय वचन
  rationale: दिए गए यूनानी पाठ में ἐπηγγείλω और प्रसंगगत εἰσακούσῃ द्वितीय पुरुष एकवचन को समर्थित करते हैं। अतः अंग्रेज़ी परामर्श-पाठ में आया प्रथम पुरुष मूल-पाठ से पुष्ट नहीं है; प्रार्थना-संदर्भ का द्वितीय पुरुष बनाए रखा गया है।
- issue: ἀποστροφή का धार्मिक बल
  choice: विमुख हो जाएँ
  alternative: धर्मत्याग करें
  rationale: शब्द मुड़ जाने, विमुखता या दलबदल तक का अर्थ दे सकता है, पर यहाँ तकनीकी धार्मिक पद को अनिवार्य मानना उचित नहीं।
- issue: ‘अपने स्थान’ की पहचान
  choice: स्थान को अनिर्दिष्ट रखा गया
  alternative: मंदिर या पवित्रस्थान
  rationale: प्रसंग मंदिर की ओर संकेत कर सकता है, किन्तु इस पद में τόπος स्वयं इतना विशिष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। परमेश्वर के लिए ‘तू’ रखा गया है, क्योंकि यह पारंपरिक प्रार्थना-संबोधन है और यूनानी एकवचन द्वितीय पुरुष को स्पष्ट करता है। वाक्य की शर्तीय रचना तथा मूल पाठ की संभावित अस्पष्टताएँ बनाए रखी गई हैं।
