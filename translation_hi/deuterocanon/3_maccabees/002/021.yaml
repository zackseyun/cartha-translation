theological_decisions:
- issue: परमेश्वर के लिए προπάτωρ की असामान्य पैतृक उपाधि
  choice: आदि-पिता
  alternative: पूर्वज; पुरखा; आदि-पूर्वज
  rationale: मूल पाठ परमेश्वर के लिए एक असामान्य पूर्वज-संबंधी उपाधि प्रयोग करता है। ‘आदि-पिता’ हिन्दी में गरिमापूर्ण रहते हुए उस संबंध को व्यक्त करता है, पर उसे जैविक या पौराणिक अर्थ में स्पष्ट नहीं करता।
- issue: ἅγιος ἐν ἁγίοις का व्यक्तिवाचक या स्थानवाचक अर्थ
  choice: पवित्र जनों के बीच पवित्र
  alternative: पवित्र स्थानों में पवित्र; पवित्रस्थान में पवित्र
  rationale: व्यक्तिवाचक अर्थ इस वाक्य में परमेश्वर की उपाधियों की शृंखला के साथ बेहतर मेल खाता है। फिर भी यूनानी में नपुंसकलिंग बहुवचन का स्थानवाचक अर्थ वास्तव में संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘आदि-पिता’ की असामान्यता मूल उपाधि की असामान्यता को दर्शाती है। डैश से लंबी कर्ता-उपाधि को स्पष्ट रखा गया है, और वास्तविक यूनानी द्विअर्थकता पादटिप्पणी में संरक्षित है।
