  alternative: ‘हमें दंड न दे’
  rationale: ἐκδικέω में न्यायपूर्ण प्रतिशोध या दंड—दोनों की अर्थछाया संभव है। मुख्य पाठ में अधिक औपचारिक समतुल्यता रखी गई है और सहज विकल्प पादटिप्पणी में दिया गया है।
