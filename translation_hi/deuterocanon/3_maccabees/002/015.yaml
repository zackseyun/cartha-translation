  text: But since you were pleased to display your glory among your people Israel[a], you have sanctified this place.
translation:
  language: hi
  text: परन्तु चूँकि तुझे अपनी प्रजा इस्राएल के बीच अपनी महिमा प्रकट करना भाया[a], तूने इस स्थान को पवित्र ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “तू अपनी प्रजा इस्राएल के बीच अपनी महिमा से प्रसन्न हुआ।” यूनानी वाक्य में ‘अपनी महिमा’ संज्ञा के रूप में है और उसका सटीक संबंध संक्षिप्त तथा कुछ अस्पष्ट है; मुख्य पाठ प्रसंगानुसार महिमा के प्रकट होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: मूल यूनानी में ‘अपनी महिमा’ संज्ञा के रूप में है और वाक्यांश का संबंध कुछ अस्पष्ट है; इस वैकल्पिक अधिक शाब्दिक अर्थ को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले कथन से विरोध या मोड़ दिखाता है; प्रार्थना की गरिमापूर्ण शैली में ‘परन्तु’ स्वाभाविक है।
- source_word: ἐπεὶ
  choice: चूँकि
  rationale: यह यहाँ निवेदन का कारण प्रस्तुत करता है; इसलिए कारणवाचक अर्थ को स्पष्ट रखा गया है।
- source_word: εὐδόκησας
  choice: तुझे ... भाया
  rationale: यह परमेश्वर की प्रसन्नता और अनुकूल इच्छा दोनों व्यक्त करता है तथा आधुनिक हिन्दी में सहज है।
- source_word: τὴν δόξαν σου
  choice: अपनी महिमा प्रकट करना
  rationale: यूनानी में संज्ञा ‘तेरी महिमा’ है, पर प्रसंग में लोगों के बीच उस महिमा के प्रकट होने का भाव संभावित है। मुख्य पाठ इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: अपनी प्रजा इस्राएल के बीच
  rationale: यहाँ ἐν उस समुदाय या क्षेत्र को सूचित करता है जिसमें परमेश्वर की महिमा प्रकट होती है; ‘के बीच’ स्वाभाविक हिन्दी है।
- source_word: ἡγίασας
  choice: पवित्र ठहराया
  rationale: यह स्थान को पवित्र उपयोग के लिए अलग किए जाने का भाव स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸν τόπον τοῦτον
  choice: इस स्थान को
  rationale: यह संदर्भित पवित्र स्थान का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: इस्राएल के बीच परमेश्वर की महिमा संबंधी वाक्यांश
  choice: अपनी महिमा प्रकट करना
  alternative: अपनी प्रजा इस्राएल के बीच अपनी महिमा से प्रसन्न हुआ
  rationale: यूनानी रचना संक्षिप्त है और शाब्दिक रूप में ‘अपनी महिमा’ को εὐδόκησας का कर्म बनाती है। मुख्य पाठ संभावित भाव—इस्राएल के बीच महिमा का प्रकटीकरण—को सहज हिन्दी में देता है, पर मूल की वास्तविक अस्पष्टता को पाद-टिप्पणी में बनाए रखता है।
- issue: ἡγίασας का पूर्णतामूलक भाव
  choice: पवित्र ठहराया
  alternative: पवित्र किया है
  rationale: यूनानी अओरिस्ट पूर्ण हुई क्रिया बताता है; हिन्दी में ‘पवित्र ठहराया’ स्थान को पवित्र उपयोग के लिए अलग करने की क्रिया को बिना अनावश्यक सांप्रदायिक अर्थ जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए निकटवर्ती एकवचन ‘तू/तुझे/अपनी’ प्रयोग किया गया है, जो बाइबिलीय प्रार्थना में आत्मीयता और प्रत्यक्ष संबोधन बनाए रखता है। भाषा सामान्य पाठक के लिए स्पष्ट है; ‘पवित्र ठहराया’ धार्मिक अर्थ की शुद्धता रखते हुए सहज बना रहता है।
