base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: hi
  text: पर उनमें से अधिकांश ने उदात्त साहस के साथ हिम्मत बाँधी और परमेश्वर के प्रति अपनी भक्ति से नहीं हटे। वे जीवित रहने के लिए अपनी संपत्ति का विनिमय करते हुए निर्भयता से अपने आपको नामांकन की सूचियों से बचा लेने में समर्थ समझते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे निर्भयता से अपने आपको नामांकन की सूचियों से बच निकलने योग्य समझते थे।” यूनानी ἐτιμῶντο ἑαυτούς में अपने विषय में मूल्यांकन का भाव है; इसे सामर्थ्य का आकलन या ‘योग्य/सम्मानित समझना’—दोनों रूपों में समझा गया है। ‘नामांकन की सूचियाँ’ आसपास के प्रसंग में राजकीय उत्पीड़न के लिए प्रयुक्त आधिकारिक पंजीकरण-अभिलेख हैं।
    reason: ἐτιμῶντο ἑαυτούς के व्याख्यात्मक विकल्प और ἀπογραφαί की प्रसंगगत प्रशासनिक संज्ञा।
lexical_decisions:
- source_word: πλεῖστοι
  choice: अधिकतर
  rationale: यह रूप यहाँ समूह के बड़े भाग को सूचित करता है; ‘अधिकतर’ सहज हिन्दी में बहुमत का भाव रखता है।
- source_word: γενναίᾳ ψυχῇ
  choice: उदात्त मन से
  rationale: यह पद उनकी भीतरी नैतिक दृढ़ता और साहस का वर्णन करता है; यहाँ ψυχή को पारिभाषिक ‘आत्मा’ कहना आवश्यक नहीं है।
- source_word: ἐνίσχυσαν
  choice: साहस बटोरा
  rationale: सताव के दबाव में नैतिक रूप से दृढ़ होने का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: परमेश्वर के प्रति अपनी भक्ति नहीं छोड़ी
  rationale: διίστημι अलग होने या हट जाने का प्रबल भाव देता है, और इस यहूदी धार्मिक संदर्भ में εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को दर्शाता है।
- source_word: τὰ χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: जीवित रहने के बदले अपनी संपत्ति देकर भी
  rationale: χρήματα केवल नकद धन नहीं, संपत्ति को भी समेटता है; वाक्यांश जीवन बचाने के लिए उसे विनिमय में देने का भाव रखता है। ‘भी’ यह स्पष्ट करता है कि संपत्ति देना स्वयं भक्ति त्यागना नहीं था।
- source_word: ἀδέως
  choice: निर्भय होकर
  rationale: क्रियाविशेषण भय से मुक्त साहस और निडरता व्यक्त करता है।
- source_word: ἐτιμῶντο ἑαυτοὺς
  choice: अपने आपको … योग्य समझा
  rationale: मध्यवाच्य रूप आत्म-मूल्यांकन का भाव रखता है; अनुवाद τιμάω के सम्मान अथवा मूल्य आँकने के अर्थ को बनाए रखता है।
- source_word: ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  choice: नाम-दर्ज की सूचियों से बच निकलने
  rationale: ῥύομαι बचाने, छुड़ाने या बच निकलने का अर्थ देता है; ἀπογραφαί प्रसंग में आधिकारिक नामांकन-अभिलेख हैं।
theological_decisions:
- issue: यहूदी सताव के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर के प्रति अपनी भक्ति
  alternative: धर्मपरायणता / श्रद्धा
  rationale: यह पद सामान्य सदाचार नहीं, दबाव में परमेश्वर के प्रति धार्मिक निष्ठा को दर्शाता है। स्पष्ट हिन्दी वाक्यांश इसी संबंधपरक अर्थ को सामने रखता है और किसी बाद की सांप्रदायिक शब्दावली को नहीं जोड़ता।
- issue: ἐτιμῶντο में आत्म-मूल्यांकन का भाव
  choice: अपने आपको … योग्य समझा
  alternative: अपने आपको … बचा सकने वाला समझा
  rationale: τιμάω के मूल्य या सम्मान आँकने वाले भाव को बनाए रखा गया है, यद्यपि क्षमता-केंद्रित अर्थ भी संभव माना जा सकता है; इस तनाव को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज रखी गई है। ‘नाम-दर्ज की सूचियाँ’ प्रशासनिक ἀπογραφαί को सामान्य पाठक के लिए स्पष्ट करती हैं। मुख्य पाठ में केवल एक पादटिप्पणी-चिह्न [a] है और उसके अनुरूप पादटिप्पणी दी गई है।
