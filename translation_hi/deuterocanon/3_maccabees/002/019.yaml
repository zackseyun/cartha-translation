  yaml_path: translation/deuterocanon/3_maccabees/002/019.yaml
  text: Let your mercies quickly come before us[a]; and put praise in the mouth of those who have fallen and whose souls are crushed[b], having made peace for us.
translation:
  language: hi
  text: तेरी करुणाएँ शीघ्र ही हमसे पहले पहुँचें[a]; और हमारे लिए शांति स्थापित करके, जो गिरे हुए और भीतर से कुचले हुए हैं उनके मुँह में स्तुतियाँ भर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तेरी करुणाएँ शीघ्र ही हमारे आगे चलें’ भी हो सकता है। यूनानी क्रिया का अर्थ पहले पहुँचना या आगे चलना हो सकता है—अर्थात आवश्यकता उत्पन्न होने से पहले ही सहायता करना।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: ‘गिरे हुओं और अपने प्राणों में कुचले हुओं के मुँह में स्तुतियाँ दे।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: हमसे पहले पहुँचें
  rationale: क्रिया में पहले पहुँचने, आगे निकलने या आवश्यकता को पहले से पूरा करने का भाव है। यह रूप प्रार्थना के संदर्भ में स्वाभाविक है और मूल की दिशात्मक अस्पष्टता को पादटिप्पणी में बनाए रखता है।
- source_word: οἰκτιρμοί
  choice: करुणाएँ
  rationale: बहुवचन को बनाए रखते हुए यह परमेश्वर की दया और करुणामय कार्यों का स्वाभाविक हिन्दी बोध देता है।
- source_word: αἰνέσεις
  choice: स्तुति
  rationale: यूनानी में बहुवचन है, पर हिन्दी में ‘स्तुति’ सामूहिक भाववाचक संज्ञा के रूप में अधिक स्वाभाविक है और मुँह में स्तुति देने की छवि को बनाए रखती है।
- source_word: καταπεπτωκότων
  choice: गिरे हुओं
  rationale: पूर्णकालिक कृदन्त गिर जाने के परिणामस्वरूप बनी दीन अवस्था दिखाता है। यह शारीरिक रूप से गिरने और विपत्ति में पड़े होने—दोनों संभावित भावों को खुला रखता है।
- source_word: συντετριμμένων τὰς ψυχάς
  choice: जिनका अंतर्मन कुचल गया है
  rationale: शाब्दिक ‘जिनके प्राण/आत्माएँ कुचल गई हैं’ आधुनिक हिन्दी में कठोर और संभावित रूप से भ्रामक है। ‘अंतर्मन’ ψυχή के भीतरी जीवन और गहरी मानसिक-भावात्मक टूटन को व्यक्त करता है, बिना किसी तकनीकी मानवशास्त्रीय सिद्धान्त को थोपे।
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: हमारे लिए शांति स्थापित करके
  rationale: अओरिस्ट कृदन्त को पूर्णतासूचक पूर्वकालिक क्रिया के रूप में रखा गया है। ‘शांति स्थापित करना’ केवल भावना देने के बजाय वास्तविक शांतिपूर्ण स्थिति बनाने के ποιέω-वाले भाव को संप्रेषित करता है।
theological_decisions:
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: अंतर्मन
  alternative: आत्मा; प्राण
  rationale: यहाँ शब्द कुचली हुई आंतरिक अवस्था बताता है। ‘अंतर्मन’ उस अनुभव को स्पष्ट करता है और देह से पृथक आत्मा के किसी विशेष सिद्धान्त को अनावश्यक रूप से सामने नहीं लाता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: ποιήσας और मुख्य आज्ञार्थक क्रिया का संबंध
  choice: शांति स्थापित करके स्तुति भर देना
  alternative: स्तुति भर दे और हमारे लिए शांति स्थापित कर
  rationale: यूनानी में ‘शांति बनाना’ स्वतंत्र आज्ञा नहीं, बल्कि अओरिस्ट कृदन्त है। हिन्दी का ‘करके’ इस व्याकरणिक संबंध और संभावित साधन/पूर्वता को स्वतंत्र आदेश में बदले बिना बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘तेरी’ मूल के एकवचन संबोधन के अनुरूप है। वाक्य को हिन्दी में सुबोध बनाने के लिए कृदन्तीय खंड को मुख्य निवेदन से पहले रखा गया है; मूल की गिरने, भीतर से कुचले जाने और परमेश्वर द्वारा स्तुति देने की छवियाँ सुरक्षित हैं।
