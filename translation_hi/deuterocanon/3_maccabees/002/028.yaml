  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and servant status[c][b], and let those who object be taken by force and put to death.
translation:
  language: hi
  text: जो कोई बलि न चढ़ाए, उसे उनके पवित्र स्थानों में प्रवेश न करने दिया जाए[a]; बल्कि सभी यहूदियों को पंजीकरण और दासों की स्थिति के अधीन कर दिया जाए[b], और जो इसका विरोध करें, उन्हें बलपूर्वक ले जाकर मार डाला जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके पवित्र अनुष्ठानों में भाग लेने”; यूनानी पद पवित्र स्थानों के साथ-साथ पवित्र अनुष्ठानों या वस्तुओं को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पंजीकरण विशेष रूप से राजकीय नियंत्रण या कर-वसूली के लिए किया गया नामांकन हो सकता है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “जीवित रहने से हटा दिया जाए”—अर्थात मार डाला जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: जो कोई बलि न चढ़ाए, उसे ... न करने दिया जाए
  rationale: आज्ञापरक विधान की निषेधात्मक शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और वर्तमान कृदन्त द्वारा पहचाने गए वर्ग—बलि न चढ़ाने वालों—को बनाए रखता है।
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: उनके पवित्र स्थानों में प्रवेश
  rationale: εἰσιέναι स्थान में प्रवेश का बोध कराता है; τὰ ἱερά यहाँ पवित्र परिसरों/स्थानाओं का संकेत दे सकता है। अन्य संभव अर्थ को पादटिप्पणी में रखा गया है।
- source_word: λαογραφίαν
  choice: सरकारी पंजीकरण में दर्ज
  rationale: जनता के प्रशासनिक नामांकन का आशय स्पष्ट करता है, पर इसे निश्चित रूप से कर-जनगणना नहीं ठहराता।
- source_word: οἰκετικὴν διάθεσιν
  choice: दासों की स्थिति
  rationale: घरेलू दासों जैसी थोपी गई कानूनी-सामाजिक दशा को स्पष्ट और गंभीर रूप में व्यक्त करता है, बिना इसे केवल सामान्य सेवा बनाकर नरम किए।
- source_word: ἀχθῆναι
  choice: पहुँचा दिया जाए
  rationale: निष्क्रिय क्रिया ἄγω द्वारा किसी थोपी हुई दशा में लाए जाने का भाव सुरक्षित रहता है।
- source_word: τοὺς δὲ ἀντιλέγοντας
  choice: जो इसका विरोध करें
  rationale: ἀντιλέγω के प्रतिवाद या प्रतिरोध के व्यापक अर्थ को रखता है; केवल मौखिक आपत्ति तक सीमित नहीं करता।
- source_word: βίᾳ φερομένους
  choice: बलपूर्वक पकड़कर
  rationale: हिंसापूर्वक ले जाए जाने या जबरन गिरफ्त में लिए जाने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: मार डाला जाए
  rationale: शाब्दिक रूप से ‘जीवित रहने से हटा देना’ मृत्यु-दंड का व्यंजक है; मुख्य पाठ में स्पष्ट अर्थ दिया गया और मूल मुहावरा पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: οἰκετικὴν διάθεσιν में थोपी गई सामाजिक स्थिति
  choice: दासों की स्थिति
  alternative: दासवत दशा; घरेलू दासता
  rationale: पद का दमनकारी और दास-संबंधी बल बनाए रखता है, पर यूनानी से अधिक संकीर्ण संस्थागत विवरण आरोपित नहीं करता।
- issue: τὰ ἱερά का स्थानवाचक या संस्कार/पवित्र-वस्तु संबंधी अर्थ
  choice: पवित्र स्थान
  alternative: पवित्र अनुष्ठान; पवित्र वस्तुएँ
  rationale: ‘प्रवेश करना’ के साथ स्थानवाचक अर्थ संदर्भ में सबसे स्वाभाविक है, किंतु वास्तविक शब्दार्थगत बहुअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: राजकीय आदेश के अनुरूप औपचारिक और कठोर शैली रखी गई है, पर वाक्य आधुनिक मानक हिन्दी में सहज है। ‘सरकारी पंजीकरण’ प्रशासनिक संदर्भ स्पष्ट करता है; ‘दासों की स्थिति’ मूल की दमनकारी सामाजिक शक्ति बनाए रखता है।
