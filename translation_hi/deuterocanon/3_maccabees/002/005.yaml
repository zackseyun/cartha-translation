  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: hi
  text: तूने उस ढीठ फ़िरौन को[a], जिसने तेरी पवित्र प्रजा, इस्राएल को दास बना लिया था, अनेक और तरह-तरह के दण्डों से उसकी परीक्षा लेकर अपनी सामर्थ्य प्रकट की; इन्हीं दण्डों के द्वारा तूने अपना महान पराक्रम प्रकट किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘धृष्ट फ़िरौन’ या ‘दुस्साहसी फ़िरौन’ भी हो सकता है। यूनानी शब्द में निर्भीकता के साथ उद्दण्डता का नकारात्मक भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: ढीठ
  rationale: यह शब्द दुस्साहसी निर्भीकता के साथ धृष्टता या उद्दण्डता का नकारात्मक भाव भी रख सकता है। ‘ढीठ’ आधुनिक हिन्दी में इस निन्दात्मक भाव को संक्षेप में व्यक्त करता है।
- source_word: καταδουλωσάμενον
  choice: दास बना लिया था
  rationale: कृदन्त फ़िरौन के पहले किए गए कार्य को बताता है। यह अनुवाद दासता को स्पष्ट रखता है और हिन्दी में पूर्वकालिक सम्बन्ध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: तेरी पवित्र प्रजा इस्राएल
  rationale: ‘प्रजा’ और ‘पवित्र’ दोनों अर्थ स्पष्ट रखे गए हैं और ‘इस्राएल’ उसी प्रजा की पहचान के रूप में आता है।
- source_word: ποικίλαις καὶ πολλαῖς
  choice: अनेक और तरह-तरह के
  rationale: दोनों विशेषणों को बनाए रखा गया है, ताकि मूल यूनानी की बलाघाती पुनरुक्ति न मिटे।
- source_word: δοκιμάσας
  choice: परखकर
  rationale: क्रिया में जाँचने या कसौटी पर रखने का अर्थ है। दण्डों के प्रसंग में भी इसे केवल ‘दण्ड देकर’ नहीं बनाया गया, जिससे मूल की सम्भावित अर्थ-तनाव बनी रहती है।
- source_word: τιμωρίαις
  choice: दण्डों
  rationale: निर्गमन-सन्दर्भ में यह परमेश्वर के दण्डात्मक कार्यों को सूचित करता है; ‘दण्ड’ सीधा और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: ἐγνώρισας
  choice: प्रकट की/प्रकट किया
  rationale: 'दोनों occurrences में एक ही मूल भाव रखा गया है: परमेश्वर ने अपनी सामर्थ्य और पराक्रम को प्रत्यक्ष रूप से ज्ञात कराया। हिन्दी में लिंग के अनुसार क्रिया-रूप बदला है।'
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यह प्रभावकारी ईश्वरीय शक्ति को व्यक्त करता है और धार्मिक-साहित्यिक हिन्दी में सहज है।
- source_word: κράτος
  choice: पराक्रम
  rationale: δύναμις से शब्दगत भेद बनाए रखते हुए बलशाली प्रभुत्व और महाबल का भाव व्यक्त करता है।
- source_word: ἐφʼ αἷς
  choice: इन्हीं दण्डों के द्वारा
  rationale: स्त्रीलिंग बहुवचन सम्बन्धवाचक पद का स्वाभाविक पूर्वपद ‘दण्ड’ है; हिन्दी में उसे दोहराने से संकेत स्पष्ट रहता है।
theological_decisions:
- issue: दोहराए गए ἐγνώρισας का कर्ता और अर्थ
  choice: दोनों बार परमेश्वर कर्ता है और अपनी सामर्थ्य/पराक्रम प्रकट करता है।
  alternative: पहले प्रयोग को केवल ‘तूने जाना’ या दूसरे अर्थ में लेना।
  rationale: प्रार्थना में निर्गमन की घटनाओं द्वारा परमेश्वर की शक्ति के सार्वजनिक प्रकटीकरण का वर्णन है। समान क्रिया को समान अर्थ में रखना यूनानी पुनरावृत्ति और प्रसंग दोनों के अनुकूल है।
- issue: θρασὺν का नैतिक भाव
  choice: ढीठ
  alternative: साहसी; घमण्डी; धृष्ट
  rationale: सिर्फ ‘साहसी’ नकारात्मक भाव को दबा सकता है, जबकि ‘घमण्डी’ किसी एक आन्तरिक प्रेरणा को अधिक निश्चित कर देता है। ‘ढीठ’ दुस्साहस और उद्दण्डता को बिना अतिरिक्त धर्मवैचारिक व्याख्या के व्यक्त करता है।
- issue: δοκιμάσας और दण्डों का सम्बन्ध
  choice: दण्डों से परखकर
  alternative: दण्ड देकर; यातना देकर
  rationale: मूल में ‘परखने’ की क्रिया और ‘दण्डों’ का साधन दोनों उपस्थित हैं। अनुवाद दोनों को रखता है और दण्ड को केवल प्रतिशोध मानकर अर्थ सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक एकवचन ‘तू/तेरी’ के साथ रखी गई है। शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘सामर्थ्य’ और ‘पराक्रम’ के द्वारा यूनानी δύναμις और κράτος का अलंकारिक भेद सुरक्षित रखा गया है।
