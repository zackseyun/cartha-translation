  rationale: आग के स्पष्ट उल्लेख के कारण यहाँ सामान्य चिह्न लगाने के बजाय शरीर को दागने का आशय है।
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: डायोनिसुस के प्रतीक, आइवी के पत्ते
  rationale: παράσημον विशिष्ट पहचान-चिह्न या प्रतीक है और κισσόφυλλον आइवी का पत्ता; अनुवाद डायोनिसुस से उसके उपासना-संबंधी प्रतीक का स्पष्ट संबंध बनाए रखता है।
- source_word: προκαταχωρίσαι
  choice: दर्ज किया जाए
  rationale: यह किसी व्यक्ति को आधिकारिक सूची या प्रशासनिक श्रेणी में प्रविष्ट करने का बोध कराता है।
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: पहले से घटाई गई अधिकार-स्थिति
  rationale: वाक्यांश संक्षिप्त और कठिन है। συνεσταλμένην में घटाए या सीमित किए जाने का भाव है, जबकि αὐθεντία अधिकार, हैसियत या स्थिति का संकेत दे सकता है; इसलिए मुख्य पाठ में इसकी अस्पष्टता को यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: डायोनिसुस से संबद्ध उपासना-चिह्न द्वारा दागना
  choice: डायोनिसुस और आइवी के पत्ते का स्पष्ट उल्लेख बनाए रखा गया।
  alternative: इसे सामान्य रूप से ‘मूर्तिपूजक चिह्न’ कहना।
  rationale: यूनानी पाठ देवता और उसके विशिष्ट प्रतीक, दोनों को नाम से बताता है; सामान्यीकृत अनुवाद ऐतिहासिक और धार्मिक बल को घटा देता।
- issue: प्रशासनिक वाक्यांश προσυνεσταλμένην αὐθεντίαν की अस्पष्टता
  choice: ‘पहले से घटाई गई अधिकार-स्थिति’
  alternative: ‘सीमित नागरिक हैसियत’ या ‘घटाई गई कानूनी स्थिति’
  rationale: नागरिक या कानूनी अर्थ संदर्भ में संभव है, पर यूनानी पाठ उसे इतना स्पष्ट नहीं करता। अतः मुख्य पाठ में अधिक औपचारिक और अनिश्चित अभिव्यक्ति रखकर संभावित अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, औपचारिक राजकीय आदेश के अनुरूप और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अधिकार-स्थिति’ जानबूझकर कुछ संक्षिप्त और असामान्य है, क्योंकि मूल यूनानी प्रशासनिक पदबंध स्वयं अस्पष्ट है; पादटिप्पणी उसके संभावित सामाजिक-कानूनी अर्थ स्पष्ट करती है।
