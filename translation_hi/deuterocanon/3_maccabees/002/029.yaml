- source_word: ἀπογραφομένους
  choice: पंजीकरण करानेवालों
  rationale: मध्य/कर्मवाच्य कृदंत स्वयं पंजीकरण कराने या पंजीकृत किए जाने—दोनों का बोध करा सकता है। प्रशासनिक संदर्भ में यह चयन स्वाभाविक है, और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
