translation:
  language: hi
  text: और यह कि पंजीकरण करानेवालों[a] के शरीर पर डायोनिसुस के आइवी-पत्ते के प्रतीक-चिह्न से आग द्वारा दागा जाए[b], और उन्हें उस सीमित अधिकार-स्थिति में दर्ज किया जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘पंजीकृत किए जा रहे लोग’ या ‘नाम लिखवानेवाले’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: आइवी का पत्ता डायोनिसुस से जुड़ा उपासना-संबंधी प्रतीक था; शरीर पर दागा गया यह चिह्न लोगों की पहचान उसके पंथ से संबद्ध होने के रूप में कराता था।
    reason: cultural_note
