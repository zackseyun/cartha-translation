  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: hi
  text: और वे सहायता मिलने की आशा में बने रहे; वे अपने बीच से अलग हो रहे लोगों से घृणा करते थे, उन्हें राष्ट्र के शत्रु मानते थे, और उन्हें साझे मेल-जोल और सहायता[a] से वंचित कर देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उपयोगी सेवाओं या लाभों से।
    reason: εὐχρηστία का अर्थ सहायता के साथ-साथ उपयोगी सेवा, उपयोगिता, या लाभ भी हो सकता है।
lexical_decisions:
- source_word: εὐέλπιδές ... καθιστήκεισαν
  choice: आशा बनाए हुए थे
  rationale: यह पदबंध उनकी बनी हुई आशापूर्ण अवस्था को व्यक्त करता है; हिन्दी में यह सहज है और यूनानी पूर्णकालिक अवस्था के भाव को बनाए रखता है।
- source_word: ἀντιλήμψεως
  choice: सहायता
  rationale: यहाँ संज्ञा का अर्थ मदद या सहारा है; संदर्भ में सामान्य और स्पष्ट ‘सहायता’ उपयुक्त है।
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: अपने बीच से अलग हो जानेवालों
  rationale: ἀποχωρέω अलग हटने या चले जाने को दर्शाता है; वाक्य धार्मिक या राजनीतिक धर्मत्याग का ऐसा विशिष्ट अर्थ नहीं देता जिसे अनुवाद में जोड़ना चाहिए।
- source_word: ἐβδελύσσοντο
  choice: घृणा करते थे
  rationale: क्रिया तीव्र वितृष्णा और घृणा व्यक्त करती है; आधुनिक हिन्दी में ‘घृणा’ इसकी शक्ति को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τοῦ ἔθνους
  choice: राष्ट्र
  rationale: ἔθνος यहाँ सामूहिक जातीय-राष्ट्रीय समुदाय को सूचित करता है; ‘राष्ट्र’ इस न्यायिक-सामुदायिक आरोप के अनुकूल है।
- source_word: τῆς κοινῆς συναναστροφῆς
  choice: सामूहिक मेल-जोल
  rationale: संज्ञा साझा सामाजिक संगति और व्यवहार को दर्शाती है; ‘मेल-जोल’ साधारण पाठक के लिए स्वाभाविक है।
- source_word: εὐχρηστίας
  choice: पारस्परिक सहायता
  rationale: शब्द उपयोगिता, उपयोगी सेवा या सहायक लाभ का भाव रख सकता है; सामाजिक बहिष्कार के संदर्भ में ‘पारस्परिक सहायता’ अर्थ को स्पष्ट रखते हुए अतिविशिष्ट नहीं बनाता।
theological_decisions:
- issue: समुदाय से हटनेवालों की पहचान
  choice: अलग हो जानेवाले
  alternative: धर्मत्यागी
  rationale: यूनानी पाठ केवल उनके बीच से हटने की बात कहता है। ‘धर्मत्यागी’ कहना धर्मशास्त्रीय निष्कर्ष को मूल पाठ में जोड़ देता।
- issue: ἀντιλήμψεως में सहायता का स्रोत
  choice: सहायता पाने की आशा
  alternative: परमेश्वर से सहायता पाने की आशा
  rationale: निकट संदर्भ में सहायता का स्रोत समझा जा सकता है, पर इस पद में स्पष्ट रूप से नामित नहीं है; इसलिए अनुवाद उसे अनकहा रखता है।
