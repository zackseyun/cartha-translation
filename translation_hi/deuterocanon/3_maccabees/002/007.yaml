lexical_decisions:
- source_word: οἱ καὶ
  choice: उन्होंने भी
  rationale: यह पहले उल्लेख किए गए समूह को फिर से सामने लाता है और καί के समावेशी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συνιδόντες
  choice: देखकर
  rationale: अओरिस्ट कृदन्त यहाँ मुख्य क्रिया से पहले या उसके प्रसंग में हुए देखने-पहचानने को व्यक्त करता है; ‘देखकर’ हिन्दी में इस कृदन्तीय संबंध को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: ἔργα σῆς χειρός
  choice: आपके हाथ के कामों
  rationale: ‘काम’ ἔργα का सीधा और सहज अर्थ है, और ‘आपके हाथ’ दिव्य कार्य-शक्ति के मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἤνεσάν σε
  choice: आपकी स्तुति की
  rationale: αἰνέω के आराधनात्मक अर्थ के लिए ‘स्तुति करना’ प्रतिष्ठित, स्पष्ट और गरिमापूर्ण हिन्दी है; ‘आपकी’ प्रत्यक्ष सम्बोधन को बनाए रखता है।
- source_word: τὸν παντοκράτορα
  choice: सर्वशक्तिमान
  rationale: यह παντοκράτωρ का प्रचलित और अर्थानुकूल हिन्दी दैवी उपाधि-रूप है, जो परमेश्वर के सर्वव्यापी सामर्थ्य को व्यक्त करता है।
theological_decisions:
- issue: दैवी उपाधि παντοκράτωρ का अनुवाद
  choice: सर्वशक्तिमान
  alternative: सब पर शासन करने वाले
  rationale: ‘सर्वशक्तिमान’ मूल उपाधि के सामर्थ्य-केंद्रित भाव का स्थापित हिन्दी समतुल्य है और अतिरिक्त सम्प्रदायगत व्याख्या नहीं जोड़ता।
- issue: परमेश्वर के लिए सम्बोधन का स्तर
  choice: आपके / आपकी
  alternative: तेरे / तेरी
  rationale: आधुनिक मानक हिन्दी में ‘आप’ आदरपूर्ण, सहज और सार्वजनिक पाठ के अनुकूल है; इससे मूल के द्वितीय पुरुष एकवचन सम्बोधन का आशय नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनामय है। वाक्य में ‘सर्वशक्तिमान’ को सम्बोधन के रूप में रखकर यूनानी τὸν παντοκράτορα की समानाधिकरणीय भूमिका सुरक्षित की गई है।
