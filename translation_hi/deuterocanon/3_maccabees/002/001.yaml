base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: hi
  text: हे प्रभु, हे प्रभु, स्वर्गों के राजा और सारी सृष्टि के स्वामी, पवित्र जनों में पवित्र[a], एकमात्र शासक, सर्वशक्तिमान, हम पर ध्यान दे, क्योंकि हम एक अधर्मी और अपवित्र व्यक्ति[b] के हाथों दबाए जा रहे हैं, जो अपनी धृष्टता और बल के घमंड में फूला हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जनों के बीच पवित्र।” यूनानी वाक्यांश संक्षिप्त और उपासनात्मक है; “में” का अर्थ यहाँ “के बीच” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “व्यक्ति” शब्द स्पष्ट रूप से नहीं है, पर एकवचन वर्णन एक ही विरोधी व्यक्ति की ओर संकेत करता है; सहज हिन्दी के लिए यह शब्द जोड़ा गया है।
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε, Κύριε
  choice: हे प्रभु, हे प्रभु
  rationale: दिव्य संबोधन और उसकी प्रार्थनात्मक पुनरुक्ति को यथावत रखा गया है।
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: स्वर्गों के राजा
  rationale: यूनानी बहुवचन τῶν οὐρανῶν को हिन्दी में भी बहुवचन के रूप में सुरक्षित रखा गया है।
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: सारी सृष्टि के स्वामी
  rationale: δέσποτα में निहित अधिकार और स्वामित्व का भाव ‘स्वामी’ से स्वाभाविक तथा स्पष्ट रूप में व्यक्त होता है।
- source_word: ἅγιε ἐν ἁγίοις
  choice: पवित्र जनों में पवित्र
  rationale: संक्षिप्त, उपासनात्मक अभिव्यक्ति को रखा गया है; ἐν का अर्थ यहाँ ‘में’ या ‘के बीच’ हो सकता है।
- source_word: μόναρχε
  choice: एकमात्र शासक
  rationale: यह परमेश्वर के अद्वितीय और अकेले शासन पर बल देता है; आधुनिक राजनीतिक अर्थ वाले ‘सम्राट’ से बचा गया है।
- source_word: παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: यह प्रचलित और अर्थपूर्ण दिव्य उपाधि है, जो सामर्थ्य और सार्वभौम अधिकार दोनों का भार वहन करती है।
- source_word: πρόσχες ἡμῖν
  choice: हमारी ओर ध्यान दे
  rationale: याचना के आदेशात्मक बल को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: καταπονουμένοις
  choice: दबाए जा रहे हैं
  rationale: यह सताव और कठोर दबाव में पीड़ित किए जाने का भाव स्पष्ट करता है।
- source_word: ἀνοσίου καὶ βεβήλου
  choice: अधर्मी और अपवित्र
  rationale: दोनों विशेषणों के नैतिक-धार्मिक भेद को अलग-अलग हिन्दी शब्दों में सुरक्षित रखा गया है।
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: अपनी धृष्टता और बल के घमंड में फूला हुआ
  rationale: πεφρυασμένου की फूले हुए अभिमान की सजीव छवि और θράσει के उद्दंड साहस को व्यक्त किया गया है।
theological_decisions:
- issue: एक के बाद एक आने वाली दिव्य उपाधियाँ
  choice: प्रभु, स्वर्गों के राजा, सारी सृष्टि के स्वामी, पवित्र जनों में पवित्र, एकमात्र शासक और सर्वशक्तिमान—सभी को अलग रखा गया है।
  alternative: कई उपाधियों को मिलाकर कम हिन्दी उपाधियों में प्रस्तुत करना।
  rationale: मूल प्रार्थना में उपाधियों का संचय आलंकारिक और धर्मवैचारिक बल उत्पन्न करता है; उन्हें अलग रखने से κύριος, δεσπότης, μόναρχος और παντοκράτωρ की विशिष्टताएँ नहीं मिटतीं।
- issue: ἅγιε ἐν ἁγίοις में ἐν का संबंध
  choice: ‘पवित्र जनों में पवित्र’
  alternative: ‘पवित्र जनों के बीच पवित्र’ अथवा ‘पवित्र जनों में वास करनेवाले पवित्र’
  rationale: मूल वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ उस संक्षिप्तता को रखता है और टिप्पणी निकट वैकल्पिक अर्थ बताती है, बिना किसी विशेष धर्मवैज्ञानिक व्याख्या को आरोपित किए।
- issue: एकवचन विरोधी व्यक्ति का स्पष्ट उल्लेख
  choice: ‘व्यक्ति’ को स्पष्टता के लिए जोड़ा गया है।
  alternative: विशेषणों को संज्ञा की तरह रखकर ‘एक अधर्मी और अपवित्र के हाथों’ कहना।
  rationale: यूनानी में ‘मनुष्य’ या ‘व्यक्ति’ के लिए अलग संज्ञा नहीं है, पर एकवचन कृदंत एक ही शत्रुतापूर्ण व्यक्ति की ओर संकेत करता है; हिन्दी में ‘व्यक्ति’ जोड़ने से अर्थ स्वाभाविक होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। संबोधनों की पुनरावृत्ति तथा दिव्य उपाधियों की क्रमिक संरचना सुरक्षित है। लम्बे यूनानी वाक्य को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर अर्थ-संबंध बनाए रखा गया है।
