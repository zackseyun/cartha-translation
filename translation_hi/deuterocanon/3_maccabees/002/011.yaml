    text: या ‘बड़ी बुराइयों’ अथवा ‘बड़े संकटों।’ यहाँ यूनानी शब्द नैतिक बुराई के साथ-साथ गंभीर हानि या विपत्ति को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: क्योंकि जब
  rationale: यह पद प्रार्थना में पिछले कथन के समर्थन का आधार देता है। ‘क्योंकि जब’ हिन्दी में कारणसूचक संबंध और आगे आने वाली परिस्थिति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πλεονάκις
  choice: बार-बार
  rationale: यह क्रियाविशेषण घटना की पुनरावृत्ति बताता है; ‘बार-बार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: θλιβέντων
  choice: दुःख में डाले गए
  rationale: θλίβω का कर्मवाच्य रूप दबाव, क्लेश या उत्पीड़न सहने का व्यापक अर्थ रखता है। यह अनुवाद पीड़ा को सामान्य रखता है और किसी एक प्रकार के उत्पीड़न तक अर्थ को सीमित नहीं करता।
- source_word: τῶν πατέρων ἡμῶν
  choice: हमारे पुरखे
  rationale: πατέρων पूर्वकालीन पिताओं अथवा पुरुष पूर्वजों को दर्शाता है। ‘पुरखे’ आधुनिक हिन्दी में सहज है और मूल की पुरुषवाची पैतृक अभिव्यक्ति को ‘पूर्वज’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: ἐβοήθησας αὐτοῖς
  choice: तूने ... उनकी सहायता की
  rationale: βοηθέω का सीधा अर्थ सहायता करना या मदद के लिए आना है। यह सरल हिन्दी मूल क्रिया का स्पष्ट अर्थ देती है।
- source_word: ἐν τῇ ταπεινώσει
  choice: उनकी दीन दशा में
  rationale: ταπείνωσις नीचा किए जाने, अपमानित अवस्था या दीन दशा को व्यक्त कर सकता है। ‘दीन दशा’ इस अर्थ-व्याप्ति को बनाए रखता है और पहले प्रयुक्त दुःख से अनावश्यक पुनरुक्ति से बचता है।
- source_word: ἐρρύσω
  choice: छुड़ाया
  rationale: ῥύομαι संकट या हानि से बचाने अथवा छुड़ाने को दर्शाता है। ‘छुड़ाया’ प्राकृतिक हिन्दी है और व्यापक धर्मशास्त्रीय अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐκ μεγάλων κακῶν
  choice: बड़ी विपत्तियों से
  rationale: κακά यहाँ नैतिक बुराइयों के साथ-साथ गंभीर हानियों, संकटों या विपत्तियों का अर्थ भी दे सकता है। ऐतिहासिक उद्धार के प्रसंग में ‘विपत्तियों’ से आशय सहजता से समझ आता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पैतृक पुरुषवाची भाषा
  choice: हमारे पुरखे
  alternative: हमारे पूर्वज
  rationale: मूल में πατέρων स्पष्ट रूप से ‘पिताओं/पुरखों’ का शब्द है। ‘पुरखे’ हिन्दी में स्वाभाविक रहते हुए स्रोत की पुरुषवाची पैतृक भाषा को बनाए रखता है; अधिक समावेशी ‘पूर्वज’ को पादटिप्पणी में दिया गया है।
- issue: ऐतिहासिक छुटकारे के प्रसंग में κακῶν का अर्थ
  choice: बड़ी विपत्तियों
  alternative: बड़ी बुराइयों
  rationale: κακά नैतिक बुराई तक सीमित नहीं है और हानिकारक संकटों या आपदाओं का भी संकेत कर सकता है। इस प्रार्थना में ‘विपत्तियों’ प्रसंगानुकूल है, पर मूल की व्यापकता के कारण शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- issue: ταπείνωσις की अर्थ-व्याप्ति
  choice: दीन दशा
  alternative: अपमानित अवस्था
  rationale: शब्द नीचा किए जाने और दीन अवस्था दोनों को समेट सकता है। ‘दीन दशा’ इस अस्पष्टता को अपेक्षाकृत खुला रखता है और यह निश्चित नहीं करता कि केवल सार्वजनिक अपमान ही अभिप्रेत था।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और प्रार्थनात्मक गरिमा वाली रखी गई है। परमेश्वर को सीधे संबोधित करने के लिए पारंपरिक एकवचन ‘तूने’ चुना गया है। ‘पुरखे’ सामान्य पाठक के लिए ‘पितरों’ से अधिक सहज है, और ‘दीन दशा’ मूल की नीचा किए जाने तथा अभावग्रस्त अवस्था की अर्थ-व्याप्ति को खुला रखता है।
