  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: hi
  text: क्योंकि तूने हमारे पुरखों की बार-बार सहायता की, जब वे कष्ट में पड़े और दीन दशा में थे, और उन्हें बड़ी विपत्तियों[b] से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
