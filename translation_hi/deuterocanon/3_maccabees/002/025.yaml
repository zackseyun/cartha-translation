lexical_decisions:
- source_word: Διακομισθεὶς
  choice: जब वह मिस्र पहुँचा दिया गया
  rationale: यह भूतकालिक कर्मवाच्य कृदन्त किसी स्थान तक पहुँचाए या ले जाए जाने को बताता है। ‘पहुँचा दिया गया’ कर्मवाच्य अर्थ रखता है और यात्रा का साधन निश्चित नहीं करता।
- source_word: ἐπαύξων
  choice: बढ़ाता गया
  rationale: वर्तमान कृदन्त लगातार बढ़ती हुई प्रक्रिया दिखाता है; ‘बढ़ाता गया’ इस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κακίας
  choice: दुष्टता
  rationale: यहाँ शब्द व्यापक नैतिक बुराई या भ्रष्ट आचरण को दर्शाता है, केवल किसी एक दुर्भावनापूर्ण कार्य को नहीं।
- source_word: προαποδεδειγμένων
  choice: पहले बताए गए
  rationale: यह उन व्यक्तियों की ओर संकेत करता है जिनका वर्णन कथा में पहले हो चुका है।
- source_word: συνποτῶν
  choice: मदिरा-संगियों
  rationale: शाब्दिक अर्थ साथ बैठकर पीने वालों का है। यह चयन दरबारी मद्य-संगति और उसके नकारात्मक नैतिक संदर्भ को बनाए रखता है।
- source_word: ἑταίρων
  choice: साथियों
  rationale: यह व्यापक रूप से संगियों या सहयोगियों के लिए प्रयुक्त है; ‘साथियों’ से वास्तविक आत्मीय मित्रता अनावश्यक रूप से नहीं जोड़ी जाती।
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: जो हर प्रकार की धार्मिकता से दूर हो चुके थे
  rationale: पूर्ण कर्मवाच्य कृदन्त एक स्थापित दशा बताता है। ‘हर प्रकार की धार्मिकता’ παντὸς δικαίου की व्यापक नैतिक धारणा रखता है, जबकि ‘दूर हो चुके थे’ स्थायी अलगाव का भाव देता है।
