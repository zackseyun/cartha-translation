  text: पर जब वह मिस्र ले जाया गया[a], तो वह उन पहले बताए गए मदिरा-संगियों[b] और साथियों के द्वारा—जो हर उस बात से अलग हो चुके थे जो सही है[c]—अपनी दुष्टता बढ़ाता गया,
