  footnotes:
  - marker: a
    text: या ‘मिस्र पहुँचाया गया।’ यूनानी कृदन्त उसके मिस्र स्थानांतरित किए जाने पर बल देता है, यात्रा के साधन पर नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘साथ पीने वाले’ है; यहाँ केवल सामान्य मित्र नहीं, बल्कि भ्रष्ट मद्य-संगति में रहने वाले साथी अभिप्रेत हैं।
    reason: cultural_note
