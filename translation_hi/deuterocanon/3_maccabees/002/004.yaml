base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/004.yaml
  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: hi
  text: तूने सदोम के लोगों को—जो अहंकार करते थे और अपनी बुराइयों के कारण कुख्यात हो गए थे[a]—आग और गन्धक से भस्म कर दिया और बाद में आनेवालों के लिए उन्हें एक उदाहरण बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध यहाँ संक्षिप्त और कठिन है। ἀδήλους का सामान्य शाब्दिक अर्थ ‘अप्रकट’ या ‘अज्ञात’ है; प्रसंग में सम्भावित आशय है कि वे अपनी बुराइयों के कारण प्रकट रूप से बदनाम हो गए थे।
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: जो अहंकार करते थे
  rationale: यूनानी पदबंध का शाब्दिक भाव ‘अहंकार करना/बरतना’ है। यह रूप स्वाभाविक आधुनिक हिन्दी में उनके लगातार अहंकारी आचरण को व्यक्त करता है।
- source_word: Σοδομίτας
  choice: सदोम के लोगों को
  rationale: यह जातिवाचक शब्द सदोम के निवासियों को सूचित करता है। ‘सदोम के लोग’ आधुनिक हिन्दी में स्पष्ट है और बाद में विकसित किसी विशेष अर्थ को अनावश्यक रूप से नहीं लाता।
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: अपनी बुराइयों के कारण कुख्यात हो गए थे
  rationale: प्राप्त यूनानी पदबंध संक्षिप्त और कठिन है; ἀδήλους का सामान्य अर्थ ‘अप्रकट/अज्ञात’ होता है, जो इस प्रसंग में सहज नहीं बैठता। चुना हुआ अनुवाद सम्भावित प्रसंगगत आशय—उनकी बुराइयों का सबके सामने प्रकट और बदनाम हो जाना—को स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी स्रोत की कठिनाई सुरक्षित रखती है।
- source_word: πυρὶ καὶ θείῳ
  choice: आग और गन्धक से
  rationale: θείον का सीधा अर्थ गन्धक है। यह हिन्दी में स्पष्ट है और सदोम के दण्ड की पारम्परिक छवि भी बनाए रखता है।
- source_word: κατέφλεξας
  choice: भस्म कर दिया
  rationale: क्रिया तीव्र और पूर्ण रूप से जलाकर नष्ट करने का भाव रखती है; ‘भस्म कर दिया’ इसे संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: παράδειγμα
  choice: एक उदाहरण
  rationale: मूल शब्द का केन्द्रीय अर्थ उदाहरण या दृष्टान्त है। प्रसंग स्वयं इसे चेतावनी देनेवाला उदाहरण बनाता है, इसलिए ‘चेतावनी’ जोड़ना आवश्यक नहीं।
- source_word: τοῖς ἐπιγινομένοις
  choice: बाद में आनेवालों के लिए
  rationale: यह बाद में उत्पन्न होने या आनेवाले लोगों को सूचित करता है। अनुवाद कालगत अर्थ बनाए रखता है और इसे अनावश्यक रूप से केवल ‘पीढ़ियों’ तक सीमित नहीं करता।
theological_decisions:
- issue: सदोम के विनाश का वर्णन बाद की विशिष्ट व्याख्याएँ जोड़े बिना करना
  choice: पद में स्पष्ट अहंकार और बुराइयों को ही दण्ड की पृष्ठभूमि के रूप में रखा गया है
  alternative: ‘सदोम के लोगों’ में बाद के सांस्कृतिक या धर्मशास्त्रीय अर्थ निहित करना अथवा उनके पाप को पद की भाषा से आगे विशेष रूप से परिभाषित करना
  rationale: इस पद की यूनानी भाषा अहंकार और बुराइयों का सामान्य उल्लेख करती है; अनुवाद उसी सीमा में रहता है।
- issue: πυρὶ καὶ θείῳ के न्याय-सूचक सूत्र का आधुनिक हिन्दी रूप
  choice: आग और गन्धक
  alternative: परम्परागत या अलंकृत पर्याय द्वारा सूत्र को अधिक पुरातन बनाना
  rationale: ‘गन्धक’ मूल का सीधा, वर्तमान और समझने योग्य अर्थ है तथा न्याय की गंभीरता को कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक सम्बोधन के अनुरूप ‘तूने’ रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘सदोम के लोग’ किसी बाद के विशेष अर्थ की अपेक्षा मूल जातिवाचक संकेत को स्पष्ट करता है।
