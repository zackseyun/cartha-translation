translation:
  language: hi
  text: उसने उस जाति के विरुद्ध निंदा फैलाने का सार्वजनिक रूप से निश्चय किया; फिर राज-प्रांगण[a] के पास के बुर्ज पर एक स्मारक-शिला[b] खड़ी करके उस पर एक लेख अंकित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राज-प्रांगण’ के लिए यूनानी शब्द का अर्थ ‘दरबार का आँगन’, ‘महल का प्रांगण’ या कोई घिरा हुआ आँगन भी हो सकता है; यहाँ ठीक किस स्थापत्य स्थान का उल्लेख है, यह निश्चित नहीं है।
    reason: cultural_note
  - marker: b
    text: ‘स्मारक-शिला’ का अनुवाद ‘पत्थर का स्तंभ’ या ‘शिलापट्ट’ भी किया जा सकता है। यूनानी शब्द ऐसे खड़े किए गए पत्थर को सूचित करता है जिस पर लेख अंकित किया जा सके।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο δημοσίᾳ
  choice: बात सार्वजनिक रूप से सामने रखी
  rationale: προέθετο का मध्यवाच्य रूप किसी मंशा या योजना को सामने रखने का भाव देता है, और δημοσίᾳ उसके सार्वजनिक स्वरूप को स्पष्ट करता है। यह अनुवाद इसे न तो औपचारिक आज्ञा बनाता है, न केवल निजी निश्चय।
- source_word: διαδοῦναι ψόγον
  choice: बदनाम करने
  rationale: διαδοῦναι में व्यापक रूप से फैलाने और ψόγος में निंदा, अपयश या कलंक का भाव है। सहज हिन्दी में ‘बदनाम करने’ से लक्षित सार्वजनिक अपयश का संयुक्त भाव व्यक्त होता है।
- source_word: ἔθνους
  choice: जाति
  rationale: यहाँ ἔθνος यहूदी समुदाय को एक सामूहिक जातीय जनसमूह के रूप में सूचित करता है। ‘जाति’ इस ऐतिहासिक संदर्भ में ‘राष्ट्र’ की आधुनिक राजनीतिक ध्वनि से बचती है।
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: राज-प्रांगण के पास वाले बुर्ज पर
  rationale: πύργος के लिए ‘बुर्ज’ स्थापत्य संदर्भ में स्वाभाविक है। κατὰ τὴν αὐλήν का स्थान-संबंध ‘के पास वाला’ से व्यक्त किया गया है; αὐλή की सटीक स्थापत्य पहचान फुटनोट में खुली रखी गई है।
- source_word: στήλην ἀναστήσας
  choice: एक शिलापट्ट खड़ा करके
  rationale: στήλη एक खड़ा किया जाने वाला, लेख के योग्य पत्थर का स्मारक या पट्ट था। ‘शिलापट्ट’ सामान्य पाठक के लिए तकनीकी ‘स्तंभिका’ से अधिक स्पष्ट है, और ἀναστήσας का पूर्वकालिक भाव ‘खड़ा करके’ से आता है।
- source_word: ἐκόλαψεν γραφὴν
  choice: उस पर एक लेख खुदवाया
  rationale: ἐκόλαψεν काटकर अंकित करने को और γραφή यहाँ अभिलेखित लेख को दर्शाता है। हिन्दी में शासकीय कर्ता के संदर्भ में ‘खुदवाया’ स्वाभाविक कारक प्रयोग है; ‘उस पर’ शिलापट्ट से संबंध स्पष्ट करता है।
