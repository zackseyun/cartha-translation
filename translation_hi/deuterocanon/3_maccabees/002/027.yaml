translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘बुर्ज’, ‘राज-प्रांगण’ और ‘शिलापट्ट’ ऐतिहासिक स्थापत्य तथा अभिलेखीय संदर्भ को स्पष्ट रखते हैं। दोनों फुटनोट चिह्न मुख्य पाठ में अपने संबंधित पदों के तुरंत बाद दिए गए हैं।
