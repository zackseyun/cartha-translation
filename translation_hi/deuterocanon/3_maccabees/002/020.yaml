lexical_decisions:
- source_word: Ἐνταῦθα
  choice: तभी
  rationale: यह पद प्रसंग के उसी निर्णायक बिंदु की ओर संकेत करता है। हिन्दी में ‘तभी’ स्थान और घटनाक्रम के संगम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ πάντων ἐπόπτης θεὸς
  choice: सब पर दृष्टि रखनेवाले परमेश्वर
  rationale: ἐπόπτης का अर्थ देखने और निगरानी रखनेवाला है। यह रूप ईश्वरीय सतर्क देखरेख को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προπάτωρ
  choice: पूर्वज
  rationale: शब्द का मूल अर्थ पूर्वज या पुरखा है। असामान्य ईश्वरीय उपाधि को ‘हमारे पितरों का परमेश्वर’ जैसे अधिक परिचित सूत्र में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ἅγιος ἐν ἁγίοις
  choice: पवित्र जनों के बीच पवित्र
  rationale: व्यक्तिवाचक अर्थ वाक्य-संरचना के अनुकूल है, पर ἐν ἁγίοις का पवित्र स्थानों अथवा वस्तुओं से संबंधित अर्थ भी संभव है; उसे पादटिप्पणी में रखा गया है।
- source_word: εὐθέσμου λιτανείας
  choice: विधिसम्मत विनती
  rationale: εὔθεσμος व्यवस्था, नियम या उचित रीति के अनुरूप होने का भाव देता है, और λιτανεία प्रार्थनापूर्ण विनती है।
- source_word: ἐμάστιξεν
  choice: दंड का कोड़ा लगाया
  rationale: क्रिया का शाब्दिक बिंब कोड़े मारने का है और यहाँ कठोर ईश्वरीय दंड सूचित होता है। यह अनुवाद बिंब और आशय दोनों स्पष्ट रखता है।
- source_word: ὕβρει καὶ θράσει
  choice: धृष्टता और दुस्साहस
  rationale: ὕβρις अपमानजनक अहंकारी अतिक्रमण और θράσος नकारात्मक अर्थ में उतावले साहस या दुस्साहस को दर्शाते हैं।
- source_word: μεγάλως ἐπηρμένον
  choice: बहुत फूल उठा था
  rationale: ऊँचा उठाए जाने के रूपक का यहाँ अभिमान से फूल उठने का अर्थ है; हिन्दी मुहावरा उसी चित्र को स्वाभाविक रूप में रखता है।
theological_decisions:
- issue: परमेश्वर के लिए προπάτωρ की असामान्य उपाधि
  choice: पूर्वज
  alternative: हमारे पितरों का परमेश्वर
  rationale: यूनानी पाठ θεὸς καὶ προπάτωρ कहता है। परिचित धार्मिक सूत्र जोड़ने से मूल की असामान्यता मिट जाती, इसलिए प्रत्यक्ष उपाधि सुरक्षित रखी गई है।
- issue: ἅγιος ἐν ἁγίοις का अर्थ
  choice: पवित्र जनों के बीच पवित्र
  alternative: पवित्र स्थानों अथवा पवित्र वस्तुओं में पवित्र
  rationale: निकटतम वाक्य-संरचना इसे परमेश्वर का व्यक्तिगत वर्णन मानने देती है, किंतु यूनानी बहुवचन नपुंसकलिंग भी समझा जा सकता है। वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
