  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: hi
  text: 'परन्तु ऐसा न हो कि वह सबके प्रति शत्रुता रखकर सबकी दृष्टि में घृणित बन जाए, उसने यह लिखित आदेश जारी किया: “परन्तु यदि उनमें से कुछ लोग अनुष्ठानों के अनुसार दीक्षित व्यक्तियों[a] के बीच रहना-सहना चुनें, तो वह उन्हें सिकन्दरिया के नागरिकों के समान नागरिकता प्रदान करता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रहस्य-अनुष्ठानों के अनुसार दीक्षित व्यक्तियों के बीच।” यूनानी वाक्यांश पंथीय दीक्षा की भाषा का प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: परन्तु ऐसा न हो कि
  rationale: δέ के विरोधसूचक प्रवाह और ἵνα की प्रयोजनात्मक भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς πᾶσιν
  choice: सबके प्रति … सबका
  rationale: सम्बन्धवाचक दत्तिव और सार्वभौमिक दायरे को स्पष्ट करता है।
- source_word: ἐχθόμενος ... ἐχθαίνηται
  choice: सबके प्रति शत्रुता रखकर सबका घृणित बन जाए
  rationale: दोनों सजातीय यूनानी रूपों में निहित सक्रिय शत्रुता और उसके फलस्वरूप घृणा का पात्र बनने का तनाव तथा शब्द-साम्य यथासम्भव बनाए रखता है।
- source_word: ὑπέγραψεν
  choice: यह लिखित आदेश जारी किया
  rationale: प्रसंग में क्रिया किसी आधिकारिक लिखित आदेश की विषयवस्तु प्रस्तुत करती है; केवल ‘लिखा’ प्रशासनिक अर्थ को पर्याप्त रूप से नहीं दर्शाता।
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: परन्तु यदि उनमें से कुछ लोग … चुनें
  rationale: προαιρῶνται के सोच-समझकर चुनाव करने के भाव और δέ को सुरक्षित रखता है। अनिश्चित बहुवचन τινες के लिए ‘कुछ लोग’ स्वाभाविक है।
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: अनुष्ठानों में दीक्षित लोगों के बीच
  rationale: τελεταί और μεμυημένοις की पंथीय दीक्षा-संबंधी भाषा को स्पष्ट रखता है, पर मुख्य पाठ में अनावश्यक रूप से अधिक तकनीकी शब्द नहीं जोड़ता।
- source_word: ἀναστρέφεσθαι
  choice: जीवन बिताना
  rationale: यह क्रिया रहन-सहन, आचरण और संगति के व्यापक सामाजिक अर्थ को सहज हिन्दी में व्यक्त करती है।
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: वह उन्हें सिकन्दरिया के नागरिकों के समान नागरिक बनाता है
  rationale: ἰσοπολίτας के समान नागरिक दर्जे को और आदेश के भीतर यूनानी वर्तमानकाल ποιεῖ को औपचारिक घोषणा के रूप में बनाए रखता है।
theological_decisions:
- issue: पंथीय दीक्षा की भाषा का आशय
  choice: मुख्य पाठ में ‘अनुष्ठानों में दीक्षित’
  alternative: ‘रहस्य-अनुष्ठानों में दीक्षित’
  rationale: यूनानी शब्द रहस्य-पंथों की दीक्षा का संकेत दे सकते हैं, पर केवल ‘रहस्य’ कहना अपेक्षा से अधिक तकनीकी व्याख्या थोप सकता है। इसलिए मुख्य पाठ व्यापक पंथीय अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का औपचारिक किन्तु सुबोध गद्य। आरम्भिक शब्द-साम्य में शत्रुता करने और घृणित बनने—दोनों पक्ष सुरक्षित रखे गए हैं। आदेश के उद्धरण में मूल का तृतीय पुरुष और वर्तमानकाल जानबूझकर बनाए रखा गया है।
