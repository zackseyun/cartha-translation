translation:
  language: hi
  text: और भीड़ पहले की तरह इन लोगों के साथ लगी रहकर विनती करती रही; पर राजा के आस-पास के बुज़ुर्ग अनेक प्रकार से उसके घमंडी मन को उस षड्यंत्र से हटाने का प्रयत्न करते रहे, जिसे उसने सोच रखा था।
