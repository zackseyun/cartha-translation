lexical_decisions:
- source_word: ἀνεστρέφετο
  choice: साथ लगी रहकर
  rationale: यह अपूर्णकालीन क्रिया निरंतर बने रहने या व्यवहार करते रहने का भाव देती है; प्रसंग में भीड़ का उन लोगों के साथ बने रहकर विनती करते रहना अभिप्रेत है।
- source_word: πρεσβύτεροι
  choice: बुज़ुर्ग
  rationale: मूल शब्द का सीधा अर्थ ‘बुज़ुर्ग/वरिष्ठ जन’ है। ‘सलाहकार’ कहना उनकी भूमिका को अधिक निश्चित कर देता, जबकि यूनानी पाठ ऐसा स्पष्ट नहीं करता।
- source_word: ἀγέρωχον
  choice: घमंडी
  rationale: यह शब्द अहंकारी और उद्धत मनोभाव को व्यक्त करता है; ‘घमंडी’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐπιβουλῆς
  choice: षड्यंत्र
  rationale: यह किसी के विरुद्ध सोची गई हानिकारक चाल या योजना का संकेत देता है; ‘षड्यंत्र’ उस प्रतिकूल आशय को बनाए रखता है।
