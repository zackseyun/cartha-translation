  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘धार्मिक रीति-व्यवस्था’ νόμιμα के विधि और प्रथा दोनों पक्षों को सामान्य पाठक के लिए व्यक्त करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
