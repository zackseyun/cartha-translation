base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: hi
  text: पर द्रिमुलुस का पुत्र कहलाने वाला दोसिथियुस[a], जो जन्म से यहूदी था, पर बाद में अपने धार्मिक रीति-रिवाज बदलकर अपने पुरखों की मान्यताओं से दूर हो गया था, उसे साथ ले जाते हुए तंबू में किसी अप्रसिद्ध व्यक्ति[b] को लिटा दिया; और ऐसा हुआ कि उस व्यक्ति को उस व्यक्ति का दंड भुगतना पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोसिथियुस, जो द्रिमुलुस का पुत्र कहलाता था।” यूनानी वाक्यांश संभवतः उसे द्रिमुलुस के पुत्र के रूप में पहचानता है।
    reason: lexical_alternative
  - marker: b
    text: या, “किसी गुमनाम व्यक्ति” अथवा “किसी अनजान व्यक्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: द्रिमुलुस का पुत्र कहलाने वाला दोसिथियुस
  rationale: यूनानी में λεγόμενος के साथ संबंधकारक Δριμύλου संभवतः पितृनाम से पहचान देता है। हिन्दी में ‘का पुत्र कहलाने वाला’ इस अर्थ को स्पष्ट रखते हुए कथन की हल्की अनिश्चितता भी बचाता है।
- source_word: τὸ γένος Ἰουδαῖος
  choice: जन्म से यहूदी
  rationale: यह पद वंशगत या जातीय उद्गम बताता है; ‘जन्म से’ आधुनिक हिन्दी में स्वाभाविक है और उसकी बाद की धार्मिक विमुखता से उचित विरोध बनाता है।
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: अपनी धार्मिक रीति-व्यवस्था बदल ली
  rationale: τὰ νόμιμα केवल सामान्य रीति-रिवाज नहीं, बल्कि समुदाय की विधि-सम्मत धार्मिक प्रथाएँ भी दर्शाता है। ‘धार्मिक रीति-व्यवस्था’ इस संयुक्त अर्थ को संप्रेषित करती है।
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: अपने पुरखों की मान्यताओं से दूर हो गया
  rationale: ἀπαλλοτριόω अलग या पराया हो जाने का भाव देता है, जबकि πατρίων δογμάτων विरासत में मिली शिक्षाओं अथवा मान्यताओं को सूचित करता है। यह चयन स्वाभाविक हिन्दी में नैतिक-धार्मिक दूरी बनाए रखता है।
- source_word: ἄσημόν τινα
  choice: किसी गुमनाम व्यक्ति
  rationale: ἄσημος ऐसे व्यक्ति को बता सकता है जो अप्रसिद्ध, अज्ञात या सामाजिक प्रतिष्ठा से रहित हो। ‘गुमनाम’ कथानक में उसकी पहचानहीनता को व्यक्त करता है; अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: अपने स्थान पर ... को तंबू में लिटा दिया
  rationale: κατακλίνω का मूल अर्थ लिटाना या विश्राम के लिए रखना है। ‘अपने स्थान पर’ यूनानी में प्रत्यक्ष नहीं है, पर अगले वाक्यांश में दूसरे व्यक्ति द्वारा उसका दंड पाने से निहित प्रतिस्थापन स्पष्ट होता है।
- source_word: ὃν συνέβη κομίսασθαι τὴν ἐκείνου κόλασιν
  choice: ऐसा हुआ कि उस व्यक्ति को उसी के लिए ठहराया गया दंड भुगतना पड़ा
  rationale: συνέβη आकस्मिक परिणाम को, κομίսασθαι दंड प्राप्त करने या भोगने को, और ἐκείνου उस दंड का दोसिथियुस से संबंध बताता है। हिन्दी में संदर्भसूचक ‘उसी’ दोसिथियुस की ओर लौटता है।
theological_decisions:
- issue: दोसिथियुस का पैतृक यहूदी आचरण और मान्यताएँ त्यागना
  choice: उसने अपनी धार्मिक रीति-व्यवस्था बदल ली और अपने पुरखों की मान्यताओं से दूर हो गया
  alternative: उसने विधि-विधानों को बदल दिया और पूर्वजों की शिक्षाओं से पराया हो गया
  rationale: अनुवाद यूनानी पाठ की नकारात्मक नैतिक-धार्मिक विशेषता को बनाए रखता है, लेकिन ‘धर्मत्याग’ जैसा बाद का तकनीकी पद जोड़कर उसकी स्थिति को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: दंड किसके लिए था
  choice: उसी के लिए ठहराया गया दंड
  alternative: उसका दंड
  rationale: ἐκείνου व्याकरणतः दोसिथियुस से संबंधित दंड बताता है; ‘के लिए ठहराया गया’ संदर्भगत आशय को स्पष्ट करता है कि स्थानापन्न व्यक्ति ने वह दंड भोगा, पर दंड के विधिक या दैवी स्रोत को निर्धारित नहीं करता।
