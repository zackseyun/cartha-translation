- source_word: κακῶς
  choice: गलत ढंग से
  rationale: यह τερατεύεσθαι को नकारात्मक अर्थ देता है। ‘गलत ढंग से’ विकृति का भाव रखता है, पर ‘दुष्टतापूर्वक’ जैसा अधिक नैतिक अर्थ नहीं जोड़ता।
- source_word: αὐτὸ τοῦτο
  choice: इसी बात को
  rationale: यूनानी पदबंध का बल हिन्दी में ‘इसी’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: τερατεύεσθαι
  choice: कोई अनहोनी बात बनाकर पेश किया जा रहा था
  rationale: क्रिया किसी बात को अद्भुत, अपशकुन-सदृश या विकराल घटना के रूप में प्रस्तुत करने का भाव रख सकती है। यह अनुवाद निष्क्रिय अर्थ और सनसनीखेज/अपशकुनपूर्ण प्रस्तुति दोनों को पठनीय हिन्दी में रखता है।
