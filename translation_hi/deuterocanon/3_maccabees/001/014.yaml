- source_word: ἀπρονοήτως
  choice: बिना सोचे-विचारे
  rationale: यह क्रियाविशेषण पूर्वविचार या सावधानी के अभाव को व्यक्त करता है; यह सहज आधुनिक हिन्दी है और अनावश्यक रूप से कठोर नैतिक दोष नहीं जोड़ता।
- source_word: ἔφη
  choice: कहा
