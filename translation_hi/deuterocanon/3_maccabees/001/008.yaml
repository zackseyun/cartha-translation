base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: hi
  text: परन्तु जब यहूदियों ने बुज़ुर्गों की परिषद्[a] और बुज़ुर्गों की ओर से उसके पास ऐसे लोगों को भेजा जो उसका अभिवादन करें, अतिथि-सत्कार के उपहार[b] ले जाएँ और जो कुछ हुआ था उस पर प्रसन्नता व्यक्त करें, तो ऐसा हुआ कि वह यथाशीघ्र उनके पास आने के लिए और भी अधिक उत्सुक हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुज़ुर्गों की परिषद्’ का अनुवाद ‘वृद्ध-परिषद्’ भी किया जा सकता है। यूनानी शब्द γερουσία बुज़ुर्गों की एक संस्थागत परिषद् को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अतिथि-सत्कार के उपहार’ ऐसे उपहार थे जो किसी अतिथि के स्वागत या सम्मान से जुड़े होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: भेजा
  rationale: सम्बन्धकारक निरपेक्ष रचना मुख्य घटना से पहले यहूदियों द्वारा दूत भेजे जाने को दर्शाती है; ‘भेजा’ स्वाभाविक हिन्दी है।
- source_word: γερουσίας
  choice: वृद्ध-परिषद्
  rationale: यह शब्द बुज़ुर्गों की एक संस्थागत शासी परिषद् को सूचित करता है; यह अनुवाद उसे सामान्य बुज़ुर्गों से अलग रखते हुए अर्थ स्पष्ट करता है।
- source_word: πρεσβυτέρων
  choice: बुज़ुर्गों
  rationale: मूल में यह γερουσία से अलग पद है; इसलिए दोनों को एक में नहीं मिलाया गया। ‘बुज़ुर्ग’ आधुनिक हिन्दी में सामाजिक अथवा सामुदायिक वरिष्ठ जनों के लिए सहज है।
- source_word: τοὺς ἀσπασομένους αὐτὸν
  choice: ऐसे लोगों को ... जो उसका अभिवादन करें
  rationale: कृदन्त भेजे गए व्यक्तियों और उनके उद्देश्य को बताता है; ‘अभिवादन करें’ ἀσπάζομαι का मूल भाव रखता है।
- source_word: ξένια
  choice: अतिथि-सत्कार के उपहार
  rationale: यह सामान्य भेंटों से अधिक, अतिथि के स्वागत या सम्मान से जुड़े उपहारों को सूचित करता है।
- source_word: κομιοῦντας
  choice: ले जाएँ
  rationale: दूत राजा के पास उपहार लेकर जा रहे हैं; हिन्दी में गन्तव्य के दृष्टिकोण से ‘ले जाएँ’ स्वाभाविक है।
- source_word: ἐπὶ τοῖς συμβεβηκόσιν
  choice: जो कुछ हुआ था उस पर
  rationale: यह हाल की घटनाओं का सामान्य उल्लेख है; अनुवाद उनकी प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: χαρησομένους
  choice: आनन्द प्रकट करें
  rationale: सन्दर्भ में दूत राजा के साथ हुई घटनाओं पर प्रसन्नता व्यक्त करने जा रहे हैं; यह उद्देश्यसूचक कृदन्त का भाव स्पष्ट करता है।
- source_word: συνέβη
  choice: तो
  rationale: यूनानी का निर्वैयक्तिक परिणाम-सूचक प्रयोग हिन्दी में मुख्य परिणाम की स्वाभाविक ‘तो’ रचना से व्यक्त किया गया है; ‘ऐसा हुआ कि’ की कृत्रिमता से बचा गया।
- source_word: μᾶλλον ... προθυμηθῆναι
  choice: और भी अधिक उत्सुक हो गया
  rationale: μᾶλλον की तुलनात्मक तीव्रता और προθυμέομαι की तत्पर इच्छा दोनों सुरक्षित हैं।
- source_word: ὡς τάχιστα
  choice: यथाशीघ्र
  rationale: यह मुहावरा शीघ्रतम सम्भव समय का भाव देता है; ‘यथाशीघ्र’ संक्षिप्त, गरिमापूर्ण और प्रचलित है।
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: उनके पास आने के लिए
  rationale: यह उनके पास पहुँचने या उपस्थित होने की गति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
