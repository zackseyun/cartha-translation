base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: hi
  text: पर जब कुछ लोगों ने कहा कि ऐसा नहीं किया जाना चाहिए[a], क्योंकि गैर-यहूदी तक भीतर प्रवेश नहीं करते, न ही सभी याजक, बल्कि केवल वह महायाजक जो सबके ऊपर है—और वह भी वर्ष में केवल एक बार—तब भी वह बिल्कुल नहीं माना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा करना उचित नहीं है।” यूनानी अभिव्यक्ति इस कार्य के अनुपयुक्त या अनुचित होने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: ऐसा नहीं किया जाना चाहिए
  rationale: καθήκειν औचित्य और उपयुक्तता का भाव व्यक्त करता है; निष्क्रिय हिंदी रचना प्रसंग में प्रस्तावित कार्य को स्पष्ट और स्वाभाविक ढंग से दर्शाती है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदी
  rationale: मंदिर-प्रवेश के इस प्रसंग में ἔθνη का संकेत यहूदियों से भिन्न लोगों की ओर है; ‘गैर-यहूदी’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: εἰσιέναι
  choice: भीतर प्रवेश नहीं करते
  rationale: क्रिया किसी स्थान के भीतर जाने को व्यक्त करती है; ‘भीतर प्रवेश करना’ मंदिर के संदर्भ में स्वाभाविक है और कोई अतिरिक्त वैधानिक भाव नहीं जोड़ता।
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: न सभी याजक
  rationale: यह वाक्यांश सभी याजकों और केवल महायाजक के बीच मूल सामूहिक विरोध को बनाए रखता है।
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: केवल वह महायाजक जो सबके ऊपर है
  rationale: προηγουμένῳ πάντων के नेतृत्व अथवा प्रधानता के भाव को सरल संबंधवाचक उपवाक्य में रखा गया है, जबकि ἀρχιερεύς का मानक अनुवाद ‘महायाजक’ है।
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: वर्ष में केवल एक बार
  rationale: यह वार्षिक प्रवेश की स्पष्ट सीमा को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: οὐδαμῶς ἐπείθετο
  choice: वह किसी भी तरह नहीं माना
  rationale: यह πείθομαι के ‘मानना/समझाए जाने पर सहमत होना’ और οὐδαμῶς के प्रबल निषेध, दोनों को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: मंदिर में प्रवेश पर धार्मिक प्रतिबंध
  choice: 'आपत्ति को प्रवेश के क्रमिक प्रतिबंध के रूप में रखा गया है: गैर-यहूदी नहीं, सभी याजक भी नहीं, बल्कि केवल महायाजक और वह भी वर्ष में एक बार।'
  alternative: इसे सामान्य वैधता या व्यवस्था का प्रश्न बताना, बिना याजकीय पदानुक्रम को स्पष्ट रखे।
  rationale: यूनानी पाठ स्वयं औचित्य की आपत्ति को पवित्र स्थान में सीमित प्रवेश से आधार देता है; अनुवाद इस क्रम को सुरक्षित रखता है और बाद की कोई धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए स्पष्ट रखी गई है। ‘गैर-यहूदी’ पारंपरिक लेकिन कम सहज ‘अन्यजाति’ की अपेक्षा अधिक प्रत्यक्ष है; ‘याजक’ और ‘महायाजक’ मंदिर-संबंधी पदों के मानक हिंदी रूप हैं।
