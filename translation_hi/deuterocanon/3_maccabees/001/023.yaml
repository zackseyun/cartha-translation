  text: परन्तु जब उन्होंने हथियारों की ओर झपट पड़ने[b] और पूर्वजों से मिली व्यवस्था के लिए[c] साहसपूर्वक मर जाने की पुकार लगाई, तो उन्होंने उस स्थान पर भारी उपद्रव मचा दिया; और बड़ी कठिनाई से वृद्ध जनों और वरिष्ठों के द्वारा—[a]
