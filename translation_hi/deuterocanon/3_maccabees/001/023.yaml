- source_word: φωνήσαντες
  choice: पुकार लगाई
  rationale: यह क्रिया ऊँची और तात्कालिक सामूहिक पुकार को व्यक्त करती है; हिंदी में ‘पुकार लगाई’ स्वाभाविक है।
- source_word: τὴν ὁρμὴν ... ποιήσασθαι
  choice: झपट पड़ने
  rationale: ὁρμή आकस्मिक और तीव्र बढ़ने या धावा करने का भाव रखता है। ‘झपट पड़ने’ उस आवेग को रखता है, पर पूर्ण सैन्य आक्रमण का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐπὶ τὰ ὅπλα
  choice: हथियारों की ओर
  rationale: ἐπί यहाँ हथियारों की दिशा में बढ़ने, संभवतः उन्हें लेने, का संकेत देता है। मुख्य पाठ दिशा को व्यक्त करता है और उद्देश्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: θαρραλέως
  choice: साहसपूर्वक
  rationale: यह मृत्यु का सामना करने में दृढ़ साहस को व्यक्त करता है और प्रसंग की गरिमा के अनुकूल है।
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: पूर्वजों से मिली व्यवस्था के लिए
  rationale: वाक्यांश विरासत में मिली यहूदी व्यवस्था के प्रति निष्ठा के कारण मरने का भाव देता है। ‘के लिए’ स्वाभाविक हिंदी है; ग्रीक की संक्षिप्त और कुछ अस्पष्ट संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τελευτᾷν
  choice: मर जाने
  rationale: क्रिया का सीधा अर्थ जीवन का अंत होना है; यह सरल और अर्थगत रूप से निष्पक्ष अनुवाद है।
- source_word: ἱκανὴν ... τραχύτητα
  choice: भारी उपद्रव
  rationale: τραχύτης का शाब्दिक भाव कठोरता या उग्रता है, पर यहाँ घटनास्थल पर हुए गंभीर उपद्रव या अशांति का बोध होता है।
- source_word: μόλις
  choice: बड़ी कठिनाई से
  rationale: यह बताता है कि आगे की कार्रवाई मुश्किल से संपन्न हुई; उपलब्ध अंश अधूरा होने के कारण उसका परिणाम नहीं जोड़ा गया।
- source_word: γεραιῶν
  choice: वृद्ध जनों
  rationale: यह आयु में वृद्ध लोगों को दर्शाता है और अगले शब्द πρεσβυτέρων से अलग रखा गया है।
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: यह वरिष्ठ या मान्य अगुओं के लिए प्रयुक्त पद हो सकता है। ‘प्राचीनों’ पारंपरिक धार्मिक पदनाम को रखता है और ‘वृद्ध जनों’ से भेद बनाए रखता है।
theological_decisions:
- issue: πατρῷος νόμος का अनुवाद
  choice: पूर्वजों से मिली व्यवस्था
  alternative: पैतृक व्यवस्था / पूर्वजों की व्यवस्था
  rationale: यह विरासत में मिली यहूदी व्यवस्था और उसके साथ सामुदायिक निष्ठा को व्यक्त करता है, बिना किसी बाद की सांप्रदायिक शब्दावली को आरोपित किए।
- issue: ὑπὸ τοῦ πατρῴου νόμου में संबंध
  choice: व्यवस्था के लिए मरना
  alternative: व्यवस्था के अधीन मरना / व्यवस्था के कारण मरना
  rationale: प्रसंग में व्यवस्था के प्रति निष्ठा के कारण साहस से मरने का भाव सर्वाधिक स्वाभाविक है, पर ग्रीक पूर्वसर्ग का संबंध संक्षिप्त और अस्पष्ट है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: उपलब्ध ग्रीक पाठ का वाक्य के बीच समाप्त होना
  choice: अपूर्णता को डैश और पादटिप्पणी सहित बनाए रखना
  alternative: दूसरे संस्करणों के आधार पर वाक्य पूरा करना
  rationale: प्रस्तुत स्रोत ‘वृद्ध जनों और प्राचीनों के द्वारा’ पर रुक जाता है। स्रोत में न दिए गए शब्द जोड़ने के बजाय अनुवाद उसकी अपूर्णता को ईमानदारी से दिखाता है।
