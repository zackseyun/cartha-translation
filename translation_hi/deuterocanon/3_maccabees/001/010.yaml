  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: hi
  text: और पवित्र परिसर[a] की सुव्यवस्था देखकर चकित होने के बाद, उसने मन्दिर में प्रवेश करने की योजना बनाने पर विचार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ दो अलग शब्द हैं: ἱερόν समूचे पवित्र परिसर के लिए और ναός मन्दिर की मुख्य पवित्र इमारत के लिए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: चकित होने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई प्रतिक्रिया दिखाता है; यह आश्चर्य का भाव रखता है, पर अत्यधिक भावनात्मक आघात नहीं जोड़ता।
- source_word: εὐταξίαν
  choice: सुव्यवस्था
  rationale: यह शब्द अच्छी और उचित व्यवस्था का सकारात्मक भाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἱεροῦ
  choice: पवित्र परिसर
  rationale: ἱερόν यहाँ समूचे पवित्र मन्दिर-परिसर को सूचित करता है और आगे आए ναός से इसका भेद बनाए रखना आवश्यक है।
- source_word: ἐνεθυμήθη
  choice: विचार किया
  rationale: यह भीतर-ही-भीतर सोचने या मन में विचार करने का अर्थ देता है; इसे दृढ़ निश्चय के रूप में कठोर नहीं किया गया।
- source_word: βουλεύσασθαι
  choice: योजना बनाने
  rationale: मध्यवाच्य अनन्त क्रिया विचार-विमर्श और उद्देश्यपूर्ण योजना का संकेत देती है; इसे केवल सीधे प्रवेश का विचार कहकर लोप नहीं किया गया।
- source_word: ναὸν
  choice: मन्दिर
  rationale: ναός मन्दिर की मुख्य पवित्र इमारत को सूचित करता है; इससे पहले के व्यापक ἱερόν से भेद रहता है।
- source_word: εἰσελθεῖν
  choice: भीतर प्रवेश करने
  rationale: गति और अन्दर जाने के अर्थ को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में ἱερόν और ναός का भेद
  choice: ἱερόν के लिए ‘पवित्र परिसर’ और ναός के लिए ‘मन्दिर’
  alternative: दोनों के लिए ‘मन्दिर’
  rationale: यूनानी पाठ निकट क्रम में दो अलग पवित्र-स्थान-संज्ञाएँ प्रयोग करता है। भेद बनाए रखने से यह स्पष्ट होता है कि उसने पहले पूरे पवित्र परिसर की व्यवस्था देखी और फिर मन्दिर की मुख्य इमारत में प्रवेश करने की योजना पर विचार किया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘विचार किया’ और ‘योजना बनाने’ दोनों रखे गए हैं ताकि ἐνεθυμήθη तथा βουλεύσασθαι की दोहरी विचार-प्रक्रिया मिट न जाए। ‘मन्दिर’ की वर्तनी अपनाई गई है।
