base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: hi
  text: जब युद्ध भीषण हो गया और परिस्थितियाँ अन्तियोखुस के पक्ष में अधिक प्रबल होती जा रही थीं, तब अरसिनोए सैनिकों के बीच गई। अपने बाल खोले हुए, उसने करुणा और आँसुओं के साथ उनसे बहुत आग्रह किया कि वे साहसपूर्वक अपनी और अपने बच्चों तथा पत्नियों की सहायता करें। उसने वादा किया कि यदि वे जीत गए, तो वह हर एक को सोने की दो मीनाएँ[a] देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मीना प्राचीन काल में भार और मुद्रा की एक इकाई थी; यहाँ प्रत्येक सैनिक को जीतने पर सोने की दो मीनाएँ देने का वादा किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ... καρτερᾶς μάχης
  choice: जब युद्ध भीषण हो गया
  rationale: Genitive absolute को पृष्ठभूमि-परिस्थिति के रूप में रखा गया है; καρτερά युद्ध की कठोरता और तीव्रता बताता है।
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: परिस्थितियाँ अन्तियोखुस के पक्ष में अधिक प्रबल होती जा रही थीं
  rationale: πράγματα की व्यापकता को ‘परिस्थितियाँ’ से और μᾶλλον तथा ἐρρωμένων के तुलनात्मक-प्रबल भाव को ‘अधिक प्रबल’ से व्यक्त किया गया है।
- source_word: ἐπιπορευσαμένη τὰς δυνάμεις
  choice: सैनिकों के बीच गई
  rationale: यह सेना या सैनिक दलों के बीच होकर जाने का भाव देता है; यूनानी पाठ पुनरावृत्ति को निश्चित रूप से व्यक्त नहीं करता।
- source_word: ἱκανῶς ... παρεκάλει
  choice: बहुत आग्रह किया
  rationale: यहाँ ἱκανῶς निवेदन की तीव्रता को बल देता है; आधुनिक हिन्दी में ‘बहुत आग्रह किया’ स्वाभाविक है।
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: करुणा और आँसुओं के साथ
  rationale: οἶκτος के करुणा अथवा दयनीय विनती के भाव को अनावश्यक रूप से एक अर्थ तक सीमित किए बिना रखा गया है।
- source_word: τοὺς πλοκάμους λελυμένη
  choice: अपने बाल खोले हुए
  rationale: खुले हुए केशों की शोक अथवा विनती-सूचक मुद्रा को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: वे साहसपूर्वक अपनी और अपने बच्चों तथा पत्नियों की रक्षा करें
  rationale: युद्ध के प्रसंग में βοηθεῖν का सहायता या बचाव के लिए आगे आने का अर्थ है; ‘रक्षा करें’ हिन्दी में इस मार्शल अपील को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐπαγγελλομένη δώσειν νικήσασιν
  choice: उसने वादा किया कि यदि वे जीत गए, तो वह ... देगी
  rationale: Aorist participle νικήσασιν को विजय पूरी होने पर लागू होने वाली शर्त के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἑκάστῳ δύο μνᾶς χρυσίου
  choice: हर एक को सोने की दो मीनाएँ
  rationale: ἑκάστῳ का वितरणात्मक अर्थ ‘हर एक’ से रखा गया है और प्राचीन इकाई μνᾶ को अनुमानित आधुनिक मूल्य में बदलने के बजाय लिप्यंतरित किया गया है।
