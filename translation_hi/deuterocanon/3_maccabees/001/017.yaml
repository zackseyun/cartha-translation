lexical_decisions:
- source_word: οἱ κατὰ τὴν πόλιν ἀπολειπόμενοι
  choice: नगर में पीछे रह गए लोग
  rationale: यह पदबंध ἀπολειπόμενοι के कर्मवाच्य भाव को बनाए रखता है और स्वाभाविक आधुनिक हिन्दी में नगर में रह गए लोगों को दर्शाता है।
- source_word: ταραχθέντες
  choice: घबरा उठे
  rationale: यह अनिष्टकारी घटनाओं से उत्पन्न व्याकुलता और अचानक हुई हलचल को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξεπήδησαν
  choice: बाहर दौड़ पड़े
  rationale: क्रिया में निहित अचानक और तेज़ी से बाहर निकलने का भाव इस अभिव्यक्ति में सुरक्षित रहता है।
- source_word: ἄδηλον τιθέμενοι τὸ γινόμενον
  choice: उन्हें स्पष्ट नहीं था कि क्या हो रहा है
  rationale: यह यूनानी पदबंध के उस भाव को सहज हिन्दी में व्यक्त करता है कि घट रही घटना उनके लिए अस्पष्ट और अनिश्चित थी; इसे पूर्ण अज्ञान के अधिक प्रबल कथन में नहीं बदला गया है।
