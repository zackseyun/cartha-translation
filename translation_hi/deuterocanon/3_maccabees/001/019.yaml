  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: hi
  text: हमने पवित्रता के भवन[a] को पैरों तले रौंदा, जैसे घृणित वस्तुओं[b] के भवन रौंदे जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र भवन” अथवा “पवित्रस्थान।” यूनानी में शाब्दिक रूप से “पवित्रता का भवन” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त दुर्लभ यूनानी शब्द का अर्थ “घृणित वस्तुएँ,” “शापित वस्तुएँ” अथवा “विनाश के लिए ठहराई गई वस्तुएँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: हमने ... पैरों तले रौंदा
  rationale: यह क्रिया रौंदने या पैरों तले कुचलने का सजीव और प्रबल बिंब रखती है; केवल ‘अपवित्र किया’ कहना उसके ठोस चित्र को खो देता।
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: पवित्रता के भवन
  rationale: οἶκος का मूल अर्थ ‘भवन/घर’ है और ἁγιασμός यहाँ उसकी पवित्र, समर्पित प्रकृति बताता है। यह अनुवाद यूनानी अभिव्यक्ति की असामान्य गरिमा बनाए रखता है; संदर्भ में इससे मंदिर अथवा पवित्रस्थान अभिप्रेत है।
- source_word: ὡς
  choice: वैसे ही ... जैसे
  rationale: यह तुलना को हिंदी में स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: καταπατοῦνται
  choice: रौंदे जाते हैं
  rationale: वर्तमान कर्मवाच्य रूप सामान्य व्यवहार का भाव बनाए रखता है और पहली क्रिया के साथ शब्दगत समानता भी सुरक्षित करता है।
- source_word: προσολοθρευμάτων
  choice: विनाश के लिए ठहराई गई घृणित वस्तुओं
  rationale: यह अत्यंत दुर्लभ शब्द घृणित अथवा शापित वस्तुओं और विनाश के लिए नियत वस्तुओं—दोनों अर्थ-छायाओं की ओर संकेत कर सकता है। संयुक्त अभिव्यक्ति उस अनिश्चितता को मुख्य पाठ में यथासंभव सुरक्षित रखती है।
theological_decisions:
- issue: पवित्र भवन की पहचान कितनी स्पष्ट की जाए
  choice: पवित्रता के भवन
  alternative: मंदिर; पवित्र भवन; पवित्रस्थान
  rationale: यूनानी पाठ सीधे ‘मंदिर’ नहीं कहता, बल्कि ‘पवित्रता के भवन’ जैसी श्रद्धापूर्ण अभिव्यक्ति रखता है। इसे बनाए रखने से अपवित्रीकरण का आलंकारिक तनाव सुरक्षित रहता है।
- issue: दुर्लभ शब्द προσολοθρευμάτων का अर्थ
  choice: विनाश के लिए ठहराई गई घृणित वस्तुओं
  alternative: घृणित वस्तुओं; शापित वस्तुओं; विनाश के लिए अर्पित वस्तुओं
  rationale: शब्द दुर्लभ है और उसका सटीक अर्थ अनिश्चित है। चुना गया रूप घृणा और विनाश के लिए नियत होने की दोनों संभावित अर्थ-छायाएँ रखता है, बिना उसे किसी विशिष्ट धार्मिक तकनीकी अर्थ तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पैरों तले रौंदा’ मूल के ठोस बिंब को उभारता है। ‘पवित्रता के भवन’ जानबूझकर कुछ औपचारिक है, क्योंकि मूल यूनानी भी साधारण ‘मंदिर’ के बजाय असामान्य श्रद्धापूर्ण पदबंध रखता है।
