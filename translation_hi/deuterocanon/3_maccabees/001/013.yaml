lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: पूछने लगा
  rationale: πυνθάνομαι का अपूर्णकाल सूचना पाने के लिए पूछने की चलती हुई क्रिया को दर्शाता है; ‘पूछने लगा’ प्रसंग में स्वाभाविक और कथात्मक है।
- source_word: διὰ τίνα αἰτίαν
  choice: क्यों
  rationale: यूनानी पदबंध का अर्थ ‘किस कारण’ है; आधुनिक हिन्दी में ‘क्यों’ वही प्रश्न संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτὸν εἰσερχόμενον
  choice: उसे ... प्रवेश करने से
  rationale: कृदंत αὐτόν से जुड़ा है और κωλύω के साथ उस व्यक्ति को प्रवेश करने से रोकने का भाव देता है। सर्वनाम की संदर्भगत अस्पष्टता बनाए रखी गई है।
- source_word: πᾶν τέμενος
  choice: किसी भी पवित्र परिसर
  rationale: τέμενος किसी देवता के लिए अलग किए गए पवित्र घेरे या स्थान को दर्शा सकता है, केवल मंदिर-भवन को नहीं। निषेधात्मक वाक्य में πᾶν को ‘किसी भी’ कहना स्वाभाविक है; ‘हर’ वाली वितरणात्मक संभावना पादटिप्पणी में रखी गई है।
- source_word: οὐθεὶς ἐκώλυσεν
  choice: किसी ने ... नहीं रोका
  rationale: κωλύω का सीधा अर्थ रोकना या बाधा देना है; हिन्दी की निषेधात्मक रचना यूनानी οὐθείς को सहज रूप से व्यक्त करती है।
- source_word: τῶν παρόντων
  choice: वहाँ उपस्थित लोगों में से
  rationale: संबंधकारक यहाँ अंशसूचक है—उपस्थित समूह में से एक भी व्यक्ति नहीं। ‘वहाँ’ हिन्दी में उपस्थित होने के स्थानगत भाव को स्पष्ट करता है, बिना कोई नया विशिष्ट स्थान जोड़े।
