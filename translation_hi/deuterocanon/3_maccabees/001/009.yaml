  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। कृदंतों की लंबी यूनानी शृंखला को हिन्दी में दो उपवाक्यों में व्यवस्थित किया गया है, पर घटनाक्रम, कर्मवाच्यता और पद की वाक्यगत अपूर्णता दर्शाने वाला अंतिम अल्पविराम सुरक्षित रखा गया है।
