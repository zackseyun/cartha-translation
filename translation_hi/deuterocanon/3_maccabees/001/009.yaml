  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: hi
  text: फिर, यरूशलेम पहुँचाए जाने के बाद, उसने विश्वासयोग्य[a] परमेश्वर को बलि चढ़ाई और धन्यवाद दिया तथा उस स्थान के लिए कुछ और किया[c]। और जब वह उस स्थान[b] पर पहुँचा, तो उसकी गरिमा और धर्मपरायणता से अभिभूत हो गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासपात्र’। यूनानी विशेषण का अर्थ विश्वासयोग्य अथवा भरोसे के योग्य हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यरूशलेम का पवित्र स्थल, सम्भवतः मन्दिर-परिसर। यूनानी पाठ केवल ‘स्थान’ कहता है।
    reason: cultural_note
  - marker: c
    text: यूनानी में यह वाक्यांश अनिश्चित है; उस स्थान के लिए किए गए अतिरिक्त कार्य का स्वरूप नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διακομισθεὶς
  choice: पहुँचाए जाने के बाद
  rationale: यह कर्मवाच्य कृदंत किसी के द्वारा एक स्थान से दूसरे स्थान तक ले जाए जाने का भाव रखता है; केवल ‘पहुँचने’ की अपेक्षा यह उस कर्मवाच्यता को सुरक्षित रखता है, पर यात्रा का साधन नहीं जोड़ता।
- source_word: θύσας
  choice: बलि चढ़ाई
  rationale: यह यज्ञीय अथवा बलिदानी क्रिया को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ πιστῷ θεῷ
  choice: विश्वासयोग्य परमेश्वर
  rationale: πιστός का सीधा अर्थ ‘विश्वासयोग्य’ या ‘विश्वासपात्र’ है। यह चुनाव ‘सच्चा परमेश्वर’ जैसे अधिक व्याख्यात्मक रूप से बचता है।
- source_word: χάριτας ἀποδιδοὺς
  choice: धन्यवाद दिया
  rationale: यूनानी मुहावरे का आशय धन्यवाद लौटाने या अर्पित करने से है; हिन्दी में ‘धन्यवाद दिया’ सहज और स्पष्ट है।
- source_word: τῶν ἑξῆς τι
  choice: कुछ और
  rationale: τι की अनिश्चितता और ἑξῆς के आगे या अतिरिक्त कार्य के भाव को बनाए रखता है, बिना उस कार्य की पहचान निश्चित किए।
- source_word: τῷ τόπῳ ποιήσας
  choice: उस स्थान के लिए ... किया
  rationale: मूल अभिव्यक्ति व्यापक है और कार्य का स्वरूप नहीं बताती। ‘के लिए’ सम्प्रदान कारक के संभावित हितार्थक संबंध को सुरक्षित रखता है।
- source_word: τὸν τόπον
  choice: उस स्थान
  rationale: संदर्भ यरूशलेम के पवित्र स्थल की ओर संकेत करता है, पर यूनानी पाठ केवल ‘स्थान’ कहता है; इसलिए मुख्य पाठ में अधिक विशिष्ट ‘मन्दिर’ नहीं जोड़ा गया।
- source_word: τῇ σπουδαιότητι
  choice: वहाँ की गरिमा
  rationale: σπουδαιότης गंभीर महत्त्व, प्रतिष्ठा या गरिमा व्यक्त कर सकता है। इस प्रसंग में ‘गरिमा’ स्थल की प्रभावशाली गंभीरता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: εὐσεβείᾳ
  choice: भक्तिभाव
  rationale: εὐσέβεια धार्मिक श्रद्धा, भक्ति या धर्मपरायणता का बोध कराता है। स्थल के वातावरण के संदर्भ में ‘भक्तिभाव’ स्वाभाविक है और इसे केवल भौतिक वैभव नहीं बनाता।
- source_word: καταπληγείς
  choice: विस्मय से भर गया
  rationale: क्रिया गहरे रूप से प्रभावित या अभिभूत होने का भाव देती है; यह रूप धार्मिक संदर्भ में केवल ‘चकित हुआ’ से अधिक उपयुक्त है।
theological_decisions:
- issue: परमेश्वर के लिए πιστῷ का अनुवाद
  choice: विश्वासयोग्य परमेश्वर
  alternative: विश्वासपात्र परमेश्वर; सच्चा परमेश्वर
  rationale: मूल विशेषण को सीधे व्यक्त किया गया है और उसे ‘सच्चा’ बनाकर अधिक व्यापक धर्मवैचारिक दावा नहीं जोड़ा गया।
- issue: ‘स्थान’ का संदर्भ
  choice: उस स्थान
  alternative: मन्दिर; पवित्रस्थान
  rationale: प्रसंग सम्भवतः यरूशलेम के मन्दिर-परिसर का है, किन्तु मूल में τόπος अर्थात ‘स्थान’ ही है; इसलिए मुख्य पाठ उसकी अस्पष्टता बनाए रखता है।
- issue: εὐσεβείᾳ का स्थल से संबंध
  choice: वहाँ का भक्तिभाव
  alternative: वहाँ की श्रद्धा; वहाँ की धर्मपरायणता; वहाँ की पवित्रता
  rationale: मूल में धार्मिक भक्ति या श्रद्धा का गुण है। ‘भक्तिभाव’ उस धार्मिक वातावरण को व्यक्त करता है, जबकि ‘पवित्रता’ मूल शब्द को अनावश्यक रूप से एक अलग धर्मवैचारिक गुण में बदल सकती है।
