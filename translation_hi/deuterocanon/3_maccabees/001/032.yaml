base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: hi
  text: परन्तु उनमें से अधिकतर ने उदात्त मन से साहस बाँधा और परमेश्वर-भक्ति से विमुख नहीं हुए। उन्होंने जीवित रहने के लिए अपनी संपत्ति तक जीवन के बदले दे दी और निडर होकर अपने आपको उन पंजीकरणों से छुड़ाने का प्रयत्न किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ ἐτιμῶντο वाला वाक्यांश कठिन है। इसका अर्थ यह भी हो सकता है कि उन्होंने अपने आपको पंजीकरणों से छुड़ाना उचित या मूल्यवान समझा। ‘पंजीकरणों’ से आशय उन पर थोपी गई आधिकारिक नाम-दर्ज करने की प्रक्रिया है, आवश्यक रूप से आधुनिक अर्थ की जनगणना नहीं।
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: परन्तु उनमें से अधिकतर
  rationale: यह पदबंध बहुसंख्यक लोगों को दर्शाता है; δέ का अनुवाद प्रसंगगत विरोध दिखाने के लिए ‘परन्तु’ किया गया है।
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: उदात्त मन से साहस बाँधा
  rationale: γενναῖος में उदात्तता और वीरता दोनों का भाव है, जबकि ψυχή यहाँ आन्तरिक मनोभाव को सूचित करता है; ἐνίσχυσαν का प्रसंगगत अर्थ साहस ग्रहण करना है।
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति से विमुख नहीं हुए
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को व्यक्त करता है; ‘परमेश्वर-भक्ति’ आधुनिक हिन्दी में ‘धर्मपरायणता’ की अपेक्षा इसका लक्ष्य अधिक स्पष्ट करता है।
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: जीवित रहने के लिए अपनी सम्पत्ति तक दे रहे थे
  rationale: χρήματα सम्पत्ति या धन-साधनों को और περὶ τοῦ ζῇν जीवन अथवा जीवित बचने को सूचित करता है। τε के बल को ‘तक’ से व्यक्त किया गया है। ‘दे रहे थे’ विनिमय के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀδέως
  choice: निडर होकर
  rationale: क्रियाविशेषण निर्भयता और साहस का भाव देता है।
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι
  choice: अपने आपको ... छुड़ाने का प्रयत्न कर रहे थे
  rationale: प्रेषित यूनानी पाठ में ἐτιμῶντο कठिन है। यह अनुवाद बच निकलने के सक्रिय प्रयास का सम्भावित आशय देता है, पर अनिश्चितता को पाद-टिप्पणी में स्पष्ट करता है।
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: उन पंजीकरणों से
  rationale: बहुवचन ἀπογραφῶν को बनाए रखा गया है। ‘पंजीकरण’ आधिकारिक नाम-दर्ज करने की प्रक्रिया को बताता है और आधुनिक जनगणना का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: यहूदी उत्पीड़न के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: धर्मपरायणता; भक्ति; श्रद्धापूर्ण निष्ठा
  rationale: इस प्रसंग में शब्द परमेश्वर और पैतृक धार्मिक आचरण के प्रति निष्ठा दर्शाता है। चुना हुआ रूप धार्मिक लक्ष्य स्पष्ट करता है, पर किसी बाद की सम्प्रदायगत धारणा को नहीं जोड़ता।
- issue: ἐτιμῶντο वाले कठिन वाक्यांश का निरूपण
  choice: छुड़ाने का प्रयत्न कर रहे थे
  alternative: छुड़ाना उचित समझते थे; छुड़ाने को मूल्यवान मानते थे
  rationale: मूल रूप का सामान्य अर्थ ‘सम्मान देना/मूल्यवान मानना’ है, पर यहाँ infinitive के साथ वाक्य कठिन है। मुख्य पाठ में सम्भावित व्यावहारिक आशय रखा गया है और पाठगत कठिनाई पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘उदात्त मन’, ‘परमेश्वर-भक्ति’ और ‘निडर होकर’ मूल के नैतिक-धार्मिक स्वर को रखते हैं। बहुवचन ‘पंजीकरणों’ को यूनानी बहुवचन के अनुरूप सुरक्षित रखा गया है।
