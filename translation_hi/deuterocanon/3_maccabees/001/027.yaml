  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: hi
  text: इसलिए जब उसके आस-पास के लोगों ने ये बातें देखीं, तो वे हमारे लोगों[a] के साथ मिलकर सारी सामर्थ्य रखनेवाले को पुकारने लगे कि वह मौजूदा परिस्थिति[b] में सहायता करे और उस अधर्मपूर्ण और अहंकारी कृत्य की अनदेखी न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हमारे अपनों के साथ’; यूनानी में यह स्पष्ट नहीं किया गया है कि किन लोगों की बात है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वहाँ उपस्थित लोगों की सहायता करे’; यूनानी वाक्यांश मौजूदा परिस्थिति अथवा उपस्थित व्यक्तियों, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: उसके आस-पास के लोग
  rationale: यह यूनानी पद शाब्दिक रूप से उसके आस-पास रहनेवालों को दर्शाता है। यह संभवतः राजा के साथियों या सेवकों की ओर संकेत करता है, पर अनुवाद उनके पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: θεωροῦντες
  choice: ये बातें देखकर
  rationale: कृदंत देखने या ध्यान से अवलोकन करने को व्यक्त करता है और यहाँ आगे की प्रतिक्रिया की परिस्थिति बताता है।
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: पुकारना शुरू किया
  rationale: यूनानी मुहावरा किसी कार्य की ओर मुड़ने या प्रवृत्त होने को बताता है। परमेश्वर से सहायता माँगने के संदर्भ में 'पुकारना शुरू किया' सहज और अर्थानुकूल है।
- source_word: σὺν τοῖς ἡμετέροις
  choice: हमारे लोगों के साथ मिलकर
  rationale: शाब्दिक अर्थ 'हमारे अपनों के साथ' है। कथावाचक के प्रथम-पुरुष बहुवचन के संदर्भ में 'हमारे लोगों' से समुदाय का संकेत सहज रूप में स्पष्ट होता है।
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: जिसके पास सारी सामर्थ्य है
  rationale: मूल पाठ परमेश्वर का वर्णन उसकी समस्त सामर्थ्य के आधार पर करता है; यह अनुवाद उसे किसी ऐसे स्थिर धार्मिक पदनाम में नहीं बदलता जो यहाँ स्पष्ट रूप से प्रयुक्त नहीं हुआ।
- source_word: τοῖς παροῦσιν
  choice: मौजूदा परिस्थिति में
  rationale: दत्तिव बहुवचन का अर्थ सामने उपस्थित परिस्थितियाँ या मौजूदा मामले हो सकता है। प्रसंग में संकट की वर्तमान स्थिति अधिक उपयुक्त है, यद्यपि उपस्थित व्यक्तियों का अर्थ व्याकरणतः संभव है।
- source_word: ἐπαμῦναι
  choice: सहायता करे
  rationale: क्रिया सहायता देने या रक्षा करने को व्यक्त करती है; यहाँ 'सहायता करे' संक्षिप्त और स्वाभाविक है।
- source_word: μὴ περιιδεῖν
  choice: अनदेखी न करे
  rationale: क्रिया का आशय किसी बात को देखते हुए भी छोड़ देना, उपेक्षित करना या नज़रअंदाज़ करना है।
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: उस अधर्मपूर्ण और घमंड भरे काम
  rationale: यह पद नियम-विरुद्ध या अधर्मपूर्ण तथा अहंकारी कृत्य का वर्णन करता है। चुनी हुई भाषा आधुनिक पाठक के लिए स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: τὸν πὰν κράτος ἔχοντα में परमेश्वर का वर्णन
  choice: जिसके पास सारी सामर्थ्य है
  alternative: सर्वशक्तिमान
  rationale: यूनानी पाठ यहाँ एक वर्णनात्मक वाक्यांश देता है, कोई निश्चित उपाधि नहीं। इसलिए अनुवाद उसकी वर्णनात्मक शक्ति बनाए रखता है।
- issue: σὺν τοῖς ἡμετέροις का संदर्भ
  choice: हमारे लोगों के साथ मिलकर
  alternative: हमारे अपनों के साथ
  rationale: मूल में संज्ञा निहित है। कथावाचक की सामुदायिक पहचान के अनुसार 'हमारे लोगों' स्वाभाविक है, जबकि पादटिप्पणी मूल की संक्षिप्तता सुरक्षित रखती है।
- issue: τοῖς παροῦσιν की व्याकरणिक अस्पष्टता
  choice: मौजूदा परिस्थिति में
  alternative: वहाँ उपस्थित लोगों की सहायता करे
  rationale: नपुंसक अर्थ में यह वाक्यांश वर्तमान मामलों या परिस्थितियों को सूचित कर सकता है, जो संकट के प्रसंग में उपयुक्त है; फिर भी व्यक्तियों की ओर संकेत करने की संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक कथन-शैली रखी गई है। ‘पुकारना’ प्रार्थनापूर्ण निवेदन को सामान्य पाठक के लिए स्पष्ट करता है। अस्पष्ट यूनानी पदों के मुख्य अर्थ पाठ में और वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
