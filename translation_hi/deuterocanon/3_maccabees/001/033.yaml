base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: hi
  text: उन्हें सहायता प्राप्त करने की शिक्षा दी गई थी[a]। जो लोग उनसे अलग हो जाते थे, उनसे वे घृणा करते थे, उन्हें राष्ट्र के शत्रु मानते थे और सामान्य मेल-जोल तथा उपयोगी सहभागिता से वंचित रखते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सहायता” का अनुवाद “मदद” या “सहारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सामान्य मेल-जोल तथा उपयोगी सहभागिता” का आशय दैनिक सामाजिक संबंधों और सामुदायिक जीवन में लाभकारी भागीदारी से बाहर रखना है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς … καθηστήκεισαν
  choice: उन्हें … शिक्षा दी गई थी
  rationale: यह संयुक्त पद पूर्व में दी गई शिक्षा या प्रशिक्षण से बनी हुई अवस्था व्यक्त करता है। हिंदी में यह रूप स्वाभाविक है और ग्रीक के पूर्वकालिक भाव को बनाए रखता है।
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: सहायता प्राप्त करने
  rationale: ἀντίληψις सहायता, सहारा या मदद को और τεύγχανω प्राप्त करने को दर्शाता है; संदर्भ किसी एक विशेष प्रकार की सहायता को निश्चित नहीं करता।
- source_word: ἀποχωροῦντας ἐξ αὐτῶν
  choice: जो लोग उनसे अलग हो जाते थे
  rationale: यह पद केवल स्थान छोड़ने से अधिक, समूह से संबंध तोड़कर अलग होने का भाव रखता है।
- source_word: ἐβδελύσσοντο
  choice: घृणा करते थे
  rationale: क्रिया तीव्र वितृष्णा या घोर नापसंदगी व्यक्त करती है; ‘घृणा’ आधुनिक हिंदी में स्पष्ट और पर्याप्त रूप से प्रबल है।
- source_word: πολεμίους τοῦ ἔθνους
  choice: अपने राष्ट्र का शत्रु
  rationale: ἔθνος यहाँ सामूहिक यहूदी समुदाय को सूचित करता है। ‘राष्ट्र’ इसके सामाजिक-राजनीतिक बल को बनाए रखता है; ‘अपने’ हिंदी में संबंध स्पष्ट करता है।
- source_word: κοινῆς συναναστροφῆς
  choice: सामान्य मेल-जोल
  rationale: यह अभिव्यक्ति दैनिक साझा सामाजिक संबंध और संपर्क को दर्शाती है; ‘मेल-जोल’ साधारण पाठक के लिए स्वाभाविक है और धार्मिक ‘संगति’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: εὐχρηστίας
  choice: उपयोगी सहभागिता
  rationale: शब्द का मूल भाव उपयोगिता या लाभकारी व्यवहार है। संदर्भ में यह सामुदायिक जीवन में लाभकारी भागीदारी की ओर संकेत करता है, पर उसका ठीक दायरा संक्षिप्त और कुछ अस्पष्ट है।
- source_word: ἐστέροῦν
  choice: वंचित रखते थे
  rationale: क्रिया किसी वस्तु या अवसर से वंचित करने का अर्थ देती है और सामाजिक बहिष्कार की निरंतर कार्रवाई को व्यक्त करती है।
theological_decisions:
- issue: ἔθνος द्वारा व्यक्त सामुदायिक पहचान
  choice: राष्ट्र
  alternative: जाति; लोग; समुदाय
  rationale: यहाँ आरोप सामूहिक यहूदी पहचान के प्रति शत्रुता का है। ‘राष्ट्र’ मूल के सामुदायिक और राजनीतिक आयाम को बनाए रखता है, जबकि आधुनिक हिंदी में ‘जाति’ भ्रामक सामाजिक अर्थ ला सकती है।
- issue: κοινῆς συναναστροφῆς καὶ εὐχρηστίας में सामाजिक बहिष्कार
  choice: सामान्य मेल-जोल तथा उपयोगी सहभागिता
  alternative: साझी संगति और व्यावहारिक लाभ; सामान्य सामाजिक संपर्क और उपयोगिता
  rationale: अनुवाद सामान्य सामाजिक संबंध और सामुदायिक जीवन में लाभकारी भागीदारी—दोनों को व्यक्त करता है, पर εὐχρηστία के कठिन और संक्षिप्त अर्थ को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य-विन्यास को हिंदी की स्वाभाविक लय के अनुसार दो वाक्यों में बाँटा गया है। ‘संगति’ जैसे संभावित धार्मिक पारिभाषिक शब्द से बचकर सामान्य सामाजिक अर्थ रखा गया है।
