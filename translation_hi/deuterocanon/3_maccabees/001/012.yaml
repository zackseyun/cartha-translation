  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’ धार्मिक विधान के अर्थ को सुरक्षित रखता है, जबकि अंतिम यूनानी वाक्य की वास्तविक अपूर्णता को मुख्य पाठ और पादटिप्पणी दोनों में दर्शाया गया है।
