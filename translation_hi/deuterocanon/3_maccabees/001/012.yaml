base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: hi
  text: और व्यवस्था पढ़कर सुनाई जाने पर भी वह इस बात पर ज़ोर देना नहीं छोड़ता था कि उसे भीतर जाना चाहिए। वह कहता था, “यदि वे इस सम्मान से वंचित किए गए हैं, तो मेरे साथ ऐसा नहीं होना चाहिए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे इससे वंचित नहीं किया जाना चाहिए।” अंत में यूनानी वाक्य अपूर्ण है; उसका शाब्दिक भाव है, “पर मेरे विषय में ऐसा नहीं होना चाहिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: व्यवस्था
  rationale: संदर्भ में νόμος उस यहूदी धार्मिक विधान को सूचित करता है जिसका उल्लेख उसके सामने किया गया था; ‘व्यवस्था’ इसकी औपचारिक और धार्मिक शक्ति बनाए रखती है।
- source_word: παραναγνωσθέντος
  choice: पढ़कर सुनाई जाने पर
  rationale: यह रूप किसी के सामने या सार्वजनिक रूप से पढ़े जाने का भाव देता है; यह हिंदी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: οὐδ᾽ ὣς ... ἀπέλειπεν
  choice: पर भी ... नहीं छोड़ता था
  rationale: यह विरोध के बावजूद जारी रहने का भाव व्यक्त करता है, और अपूर्ण भूतकाल उसकी लगातार ज़िद को दर्शाता है।
- source_word: προφερόμενος
  choice: इस बात पर ज़ोर देना
  rationale: संदर्भ में वह अपना दावा लगातार आगे रख रहा था; यह वाक्यांश उस आग्रह को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: कि उसे भीतर जाना चाहिए
  rationale: δεῖ आवश्यकता या उचितता बताता है; ‘चाहिए’ उसके दावे को बिना अनावश्यक रूप से कठोर बनाए सुरक्षित रखता है।
- source_word: ἐστέρηνται ταύτης τῆς τιμῆς
  choice: इस सम्मान से वंचित किए गए हैं
  rationale: यह अनुवाद पूर्ण निष्क्रिय क्रिया तथा τιμή के सम्मान या विशेष प्रतिष्ठा के भाव, दोनों को बनाए रखता है।
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: तो मेरे साथ ऐसा नहीं होना चाहिए
  rationale: यूनानी वाक्यांश जानबूझकर अपूर्ण है; हिंदी में यह रूप पहले कही गई वंचना की ओर संकेत करते हुए उसकी संक्षिप्तता और अर्थगत तनाव को यथासंभव सुरक्षित रखता है।
