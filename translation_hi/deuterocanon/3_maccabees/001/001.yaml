- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: अन्तियोकुस द्वारा छीने जा रहे थे
  rationale: ἀφαίρεσις प्रदेशों को छीनने या अपने अधिकार में लेने को दर्शाता है और γινομένην चल रही प्रक्रिया को व्यक्त करता है।
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: उसके अधीन प्रदेश
  rationale: यह फिलोपातोर के नियंत्रण या शासन में रहे भूभागों का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
