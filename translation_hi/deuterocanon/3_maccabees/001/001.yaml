- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: अपनी बहन अरसिनोए को साथ लिया
  rationale: संबंध और साथ ले जाने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἐξώρμησεν μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: राफिया के आसपास के क्षेत्र तक निकल पड़ा
  rationale: ἐξορμάω अभियान पर निकलने का भाव रखता है, जबकि κατὰ Ῥαφίαν राफिया के आसपास के इलाके को सूचित करता है।
- source_word: οἱ περὶ Ἀντίοχον
  choice: अन्तियोकुस के लोगों
  rationale: यह यूनानी मुहावरा अन्तियोकुस के साथ के दल या सैन्यबल को बताता है और सम्भवतः स्वयं अन्तियोकुस को भी सम्मिलित करता है।
