base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: hi
  text: फिलोपातोर ने लौटकर आए लोगों से यह जानकर कि उसके अधीन प्रदेश अन्तियोकुस द्वारा छीने जा रहे थे, अपनी समस्त पैदल और घुड़सवार सेना को आदेश दिया, अपनी बहन अरसिनोए को साथ लिया और राफिया के आसपास के क्षेत्र तक निकल पड़ा, जहाँ अन्तियोकुस के लोगों[a] ने पड़ाव डाल रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अन्तियोकुस के आसपास के लोग’; यह यूनानी मुहावरा अन्तियोकुस के दल या सेना को दर्शाता है और इसमें स्वयं अन्तियोकुस भी सम्मिलित हो सकता है।
    reason: lexical_alternative
