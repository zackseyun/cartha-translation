translation:
  language: hi
  text: यह करने और पवित्र स्थलों को भेंटें बाँटने के बाद, उसने अपने अधीन लोगों का हौसला बढ़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: यह करने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई कार्रवाई बताता है; ‘यह करने के बाद’ क्रम को स्वाभाविक और स्पष्ट रखता है। δὲ यहाँ हल्का संक्रमण देता है, जिसे हिन्दी वाक्य-प्रवाह में अलग संयोजक के बिना व्यक्त किया गया है।
- source_word: τοῖς τεμένεσι
  choice: पवित्र स्थलों को
  rationale: τέμενος किसी देवता के लिए अलग किए गए पवित्र स्थान या परिसर को दर्शाता है; ‘पवित्र स्थल’ इसे केवल मंदिर-भवन तक सीमित नहीं करता।
- source_word: δωρεὰς ἀπονείμας
  choice: भेंटें बाँटने के बाद
  rationale: δωρεά सामान्यतः उपहार या दान है और ἀπονέμω बाँटने अथवा आवंटित करने का भाव देता है। ‘भेंटें’ धार्मिक स्थलों के संदर्भ में स्वाभाविक है, पर इसे अनिवार्यतः बलिदानी चढ़ावा नहीं बनाता।
- source_word: εὐθαρσεῖς
  choice: हौसला बढ़ाया
  rationale: शब्द अच्छे मनोबल, साहस या आश्वस्त दशा को दर्शाता है। κατέστησεν के साथ हिन्दी में ‘हौसला बढ़ाया’ परिणामकारी भाव को सहज रूप से व्यक्त करता है।
- source_word: τοὺς ὑποτεταγμένους
  choice: अपने अधीन लोगों
  rationale: पूर्ण निष्क्रिय कृदंत उन लोगों को सूचित करता है जो उसके अधिकार के अधीन रखे गए थे। यह अनुवाद राजनीतिक अर्थ को बनाए रखते हुए अनावश्यक रूप से कठोर ‘वशीभूत’ से बचता है।
- source_word: κατέστησεν
  choice: बढ़ाया
  rationale: इस विधेयात्मक रचना में καθίστημι किसी को एक दशा में लाने का अर्थ देता है; हिन्दी मुहावरे ‘हौसला बढ़ाया’ में यह कारक भाव समाहित है।
