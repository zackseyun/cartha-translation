  yaml_path: translation/deuterocanon/3_maccabees/001/015.yaml
  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: hi
  text: क्योंकि आपका निवासस्थान सर्वोच्च स्वर्ग[a] है, जहाँ मनुष्य नहीं पहुँच सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “स्वर्ग का स्वर्ग”; यह सामी शैली की अभिव्यक्ति सर्वोच्च स्वर्ग को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: निवासस्थान
  rationale: यह संज्ञा रहने के स्थान को सूचित करती है; ‘निवासस्थान’ ठोस स्थानवाचक अर्थ और प्रार्थना की गरिमा दोनों बनाए रखता है।
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: सर्वोच्च स्वर्ग
  rationale: यूनानी में यह सामी शैली की अभिव्यक्ति शाब्दिक रूप से ‘स्वर्ग का स्वर्ग’ है और सर्वोच्च स्वर्ग का बोध कराती है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है तथा शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἀνέφικτος
  choice: जहाँ ... नहीं पहुँच सकते
  rationale: विशेषण का अर्थ अगम्य अथवा पहुँच से परे है। सम्बन्धवाचक उपवाक्य हिन्दी में स्पष्ट करता है कि मनुष्य परमेश्वर के इस निवासस्थान तक नहीं पहुँच सकते।
- source_word: ἀνθρώποις
  choice: मनुष्य
  rationale: यह शब्द यहाँ समस्त मानवजाति के लिए प्रयुक्त है, केवल पुरुषों के लिए नहीं; ‘मनुष्य’ स्रोत के सामान्य मानवीय अर्थ को ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: οὐρανὸς τοῦ οὐρανοῦ का सामी श्रेष्ठतासूचक प्रयोग
  choice: सर्वोच्च स्वर्ग
  alternative: स्वर्ग का स्वर्ग
  rationale: ‘सर्वोच्च स्वर्ग’ हिन्दी में अभिप्रेत श्रेष्ठतासूचक अर्थ स्वाभाविक रूप से देता है, जबकि शाब्दिक संरचना को पादटिप्पणी में रखा गया है; इससे परमेश्वर की पारलौकिकता का संकेत बना रहता है।
- issue: ἀνθρώποις का सामान्य मानवीय अर्थ
  choice: मनुष्य
  alternative: मनुष्यों के लिए अगम्य
  rationale: सन्दर्भ में शब्द सभी मनुष्यों को समेटता है। हिन्दी ‘मनुष्य’ बिना किसी लैंगिक संकुचन के यही अर्थ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ‘आपका’ आदरसूचक सम्बोधन है। वाक्य को सहज बनाने के लिए ἀνέφικτος ἀνθρώποις को ‘जहाँ मनुष्य नहीं पहुँच सकते’ के रूप में व्यक्त किया गया है।
