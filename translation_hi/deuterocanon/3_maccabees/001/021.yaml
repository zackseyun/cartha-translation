translation:
  language: hi
  text: इस उद्देश्य के लिए इकट्ठा किए गए लोगों की विनती[a] उन लोगों के विषय में अनेक प्रकार की थी, जिन्हें वह अपवित्र ढंग से[b] सौंप रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिड़गिड़ाहट’ अथवा ‘अनुनय’।
    reason: lexical_alternative
  - marker: b
    text: ‘अपवित्र ढंग से’ का अनुवाद ‘अधर्मपूर्वक’ या ‘दुष्टतापूर्वक’ भी हो सकता है; मूल शब्द इस कार्य के नैतिक और संभवतः धार्मिक रूप से निंदनीय होने पर बल देता है।
    reason: lexical_alternative
