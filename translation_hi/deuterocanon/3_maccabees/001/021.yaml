- source_word: ποικίλη
  choice: अनेक प्रकार की
  rationale: यह विशेषण विनती के विविध रूपों या ढंगों को व्यक्त करता है; यह स्वाभाविक हिन्दी में यूनानी की बहुविधता बनाए रखता है।
- source_word: δέησις
  choice: विनती
  rationale: यह शब्द गंभीर और आग्रहपूर्ण निवेदन का बोध कराता है। ‘विनती’ सार्वजनिक सामूहिक अनुरोध के संदर्भ में सहज है और इसे अनिवार्य रूप से परमेश्वर से की गई प्रार्थना नहीं ठहराता।
- source_word: συλλεγέντων
  choice: इकट्ठे हुए
  rationale: अओरिस्ट कर्मवाच्य कृदंत का स्वाभाविक हिन्दी रूप; इससे यह अनिर्णीत रहता है कि वे स्वयं इकट्ठे हुए थे या इकट्ठे किए गए थे।
- source_word: εἰς τοῦτο
  choice: इस उद्देश्य से
  rationale: यह संक्षिप्त प्रयोजनसूचक पदबंध है और निकटवर्ती संदर्भ से मिलने वाले उद्देश्य से अधिक कुछ नहीं जोड़ता।
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: उन लोगों के विषय में, जिन्हें ... सौंप रहा था
  rationale: ἐπί के साथ चतुर्थी को यहाँ विनती के विषय या अवसर के रूप में लिया गया है। ‘के विषय में’ मूल की अस्पष्टता बनाए रखता है कि विनती उन लोगों के बारे में थी या उनकी ओर से।
- source_word: ἀνοσίως
  choice: अपवित्र रीति से
  rationale: यह क्रियाविशेषण ऐसे आचरण को दर्शाता है जो उचित या पवित्र बात का उल्लंघन करता है। ‘अपवित्र रीति से’ इसके नैतिक और धार्मिक आक्रोश दोनों को सुरक्षित रखता है।
- source_word: κατεγχειρουμένοις
  choice: सौंप रहा था
  rationale: क्रिया किसी को दूसरे के हाथ में देने या उसके अधिकार में कर देने का संकेत करती है। ‘सौंप रहा था’ चल रही बाध्यकारी कार्रवाई को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπʼ ἐκείνου
  choice: वह ... रहा था
  rationale: यूनानी कर्मवाच्य कर्ता को हिन्दी में स्वाभाविक कर्तृवाच्य रूप दिया गया है; ‘वह’ पूर्वोक्त पुरुष की ओर संकेत करता है।
