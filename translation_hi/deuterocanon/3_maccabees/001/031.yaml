translation:
  language: hi
  text: परन्तु कुछ लोगों ने नगर की धर्मनिष्ठा के आधारों[a] को लापरवाही से तुच्छ जाना और अपने आपको सहज ही सौंप दिया, मानो राजा के साथ होनेवाली संगति[b] से वे किसी बड़ी प्रतिष्ठा के सहभागी बनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नगर की धर्मनिष्ठा के सहारों’। यूनानी में सहारा देनेवाली संरचनाओं का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजा के साथ भावी मेल-जोल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: कुछ लोगों ने
  rationale: यह अनिश्चित बहुवचन नगरवासियों में से एक वर्ग को सूचित करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐπιπολαίως
  choice: लापरवाही से
  rationale: यह उथले, असावधान या बिना गंभीर विचार के किए गए व्यवहार को व्यक्त करता है; ‘लापरवाही से’ प्रसंग में सहज है।
- source_word: στυγοῦντες
  choice: तुच्छ जाना
  rationale: मूल क्रिया घृणा या तीव्र नापसंदगी व्यक्त कर सकती है, पर ἐπιπολαίως के साथ यहाँ अवमाननापूर्ण अस्वीकार का भाव उपयुक्त है।
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: नगर की धर्मनिष्ठा के आधारों
  rationale: ἐπιβάθρας सहारा देनेवाली संरचनाओं का रूपक है; ‘आधारों’ से रूपक और उसका धार्मिक-सामुदायिक आशय दोनों बने रहते हैं।
- source_word: εὐσεβείας
  choice: धर्मनिष्ठा
  rationale: हेलेनिस्टिक यहूदी संदर्भ में यह श्रद्धापूर्ण धार्मिक निष्ठा को सूचित करता है; ‘धर्मनिष्ठा’ बाद की किसी विशिष्ट साम्प्रदायिक शब्दावली को आरोपित नहीं करती।
- source_word: εὐχερῶς
  choice: सहज ही
  rationale: यह बिना प्रतिरोध के तत्परता या आसानी से स्वयं को सौंप देने का भाव व्यक्त करता है।
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: अपने आपको ... सौंप दिया
  rationale: प्रतिबिंबात्मक भाव से उनका स्वेच्छापूर्वक अपने आपको दे देना सुरक्षित रहता है।
- source_word: ὡς
  choice: मानो
  rationale: यह वस्तुगत परिणाम नहीं, बल्कि उनकी धारणा या अपेक्षा प्रस्तुत करता है।
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: किसी बड़ी प्रतिष्ठा
  rationale: εὐκλεία अच्छी ख्याति, यश या सामाजिक सम्मान है; ‘प्रतिष्ठा’ इस सम्मान-केंद्रित संदर्भ में स्वाभाविक है और धार्मिक ‘महिमा’ का अनावश्यक रंग नहीं लाती।
- source_word: κοινωνήσοντες
  choice: भागी होंगे
  rationale: भविष्य की अपेक्षित सहभागिता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: राजा के साथ होनेवाली संगति से
  rationale: सामाजिक मेल-जोल या संबंध के व्यापक अर्थ को बनाए रखता है और ἐσομένης के भावी पहलू को ‘होनेवाली’ से व्यक्त करता है।
theological_decisions:
- issue: हेलेनिस्टिक यहूदी नागरिक-धार्मिक संदर्भ में εὐσέβεια का अनुवाद
  choice: धर्मनिष्ठा
  alternative: भक्ति; धार्मिक श्रद्धा; धर्म
  rationale: यहाँ शब्द नगर में स्थापित श्रद्धापूर्ण धार्मिक निष्ठा और उसे संभालनेवाली व्यवस्थाओं की ओर संकेत करता है। ‘धर्मनिष्ठा’ धार्मिक गंभीरता को बनाए रखती है, पर इसे किसी बाद की विशिष्ट ईसाई पारिभाषिकता तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप। वाक्य की नैतिक आलोचना को बनाए रखते हुए शब्दावली को असाम्प्रदायिक रखा गया है; ‘आधार’ और ‘संगति’ के विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
