base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: hi
  text: परन्तु थियोदोतुस नाम के एक व्यक्ति ने उस षड्यंत्र को अंजाम देने की ठानी। उसने टॉलेमी के उन हथियारों में से सबसे अच्छे हथियार लिए जो उसे पहले से सौंपे गए थे। फिर रात में उसे टॉलेमी के तंबू तक पहुँचाया गया, ताकि वह स्वयं उसे मार डाले[a] और इस प्रकार युद्ध समाप्त कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अकेले ही उसे मार डाले।” यूनानी शब्द μόνος इस बात पर बल दे सकता है कि थियोदोतुस स्वयं हत्या करना चाहता था।
    reason: यूनानी μόνος के बलाघात में वास्तविक अस्पष्टता है; यह मुख्यतः कर्ता के स्वयं या अकेले हत्या करने पर बल देता प्रतीत होता है।
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: षड्यंत्र को अंजाम देने
  rationale: यहाँ ἐκπληρῶσαι किसी शत्रुतापूर्ण योजना को कार्यान्वित करने के अर्थ में है। ‘अंजाम देना’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की नकारात्मकता बनाए रखता है।
- source_word: διανοηθείς
  choice: ठानी
  rationale: कृदन्त सोच-विचारकर बनाए गए दृढ़ इरादे को दर्शाता है; ‘ठानी’ संक्षिप्त, स्वाभाविक और उद्देश्यपूर्ण निर्णय को व्यक्त करता है।
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: टॉलेमी की सेना के उन हथियारों में से सबसे अच्छे हथियार ... जो उसे पहले से सौंपे गए थे
  rationale: यह रूप हथियारों के टॉलेमी-पक्ष से संबंधित होने, उनके पहले से थियोदोतुस को दिए जाने और उनमें से उत्तम हथियार चुने जाने—तीनों बातों को स्पष्ट रखता है।
- source_word: διεκομίσθη νύκτωρ
  choice: रात में उसे ... पहुँचाया गया
  rationale: यूनानी क्रिया कर्मवाच्य है और संकेत करती है कि उसे वहाँ ले जाया गया; इसलिए केवल ‘वह गया’ कहने के बजाय कर्मवाच्य रखा गया है।
- source_word: σκηνήν
  choice: तंबू
  rationale: सैनिक छावनी के प्रसंग में यह सीधा और स्वाभाविक अर्थ है।
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: ताकि वह स्वयं उसे मार डाले
  rationale: ὡς के साथ infinitive उद्देश्य व्यक्त करता है। μόνος का सबसे स्वाभाविक संबंध कर्ता थियोदोतुस से है, इसलिए ‘स्वयं’ चुना गया है; सम्भव वैकल्पिक बलाघात पादटिप्पणी में रखा गया है।
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: और इस प्रकार युद्ध समाप्त कर दे
  rationale: हत्या द्वारा युद्ध का अंत करने के अभिप्रेत साधन और परिणाम को सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कथात्मक प्रवाह के लिए लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, जबकि क्रियाओं का क्रम और कर्मवाच्य अर्थ सुरक्षित रखा गया है।
