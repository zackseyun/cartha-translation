  rationale: θρασυνθέντες साहसी या निर्भीक हो उठने को व्यक्त करता है। περὶ τῶν πολιτῶν यह अस्पष्ट छोड़ता है कि साहस नागरिकों से संबंधित मामले में था या उनकी ओर से; मुख्य पाठ निकट अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὐκ ἠνείχοντο
  choice: इसे और सह न सके
  rationale: अपूर्णकालीन रूप किसी जारी स्थिति को सहन न कर पाने या अब और बर्दाश्त न करने का भाव देता है।
- source_word: τέλεον
  choice: पूरी तरह
  rationale: यह क्रियाविशेषण ἐπικειμένου को तीव्र करता है और दबाव की पूर्णता या प्रबलता दर्शाता है।
- source_word: αὐτοῦ ἐπικειμένου
  choice: क्योंकि वह ... दबाव डाल रहा था
  rationale: जननात्मक निरपेक्ष रचना को कारणसूचक उपवाक्य बनाया गया है। ἐπίκειμαι यहाँ जोर डालने, आग्रह करने या दबाव बनाए रखने का अर्थ देता है; यूनानी में अनुक्त कर्म को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν
  choice: अपने इरादे को पूरा करने
  rationale: πρόθεσις यहाँ ठहराए हुए इरादे या योजना का द्योतक है; 'इरादा' प्रसंगानुकूल है और किसी विशेष धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
- source_word: διανοουμένου
  choice: ठान चुका था
  rationale: यह कृदन्त सोची-समझी और दृढ़ मंशा व्यक्त करता है; हिन्दी में यह चल रहे दबाव के साथ उस संकल्प को स्वाभाविक ढंग से सामने लाता है।
