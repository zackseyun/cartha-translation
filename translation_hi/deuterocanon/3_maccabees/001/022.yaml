  text: इनके साथ-साथ, नागरिकों के संबंध में साहसी हो उठे लोग[a] भी इसे अब और सह न सके, जब वह पूरी तरह दबाव डाल रहा था और अपने इरादे को पूरा करने का इरादा रखता था।
  philosophy: optimal-equivalence
