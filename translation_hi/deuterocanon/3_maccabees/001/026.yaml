translation:
  language: hi
  text: परन्तु दुस्साहस से भरकर और तब तक सबको विदा कर देने के बाद, वह अब आगे बढ़ रहा था, यह सोचते हुए कि जिस बात का पहले उल्लेख हो चुका था, उसे पूरा कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  choice: दुस्साहस से भरकर
  rationale: यह प्रयोग उसके बढ़े हुए साहस या धृष्टता को व्यक्त करता है। प्रसंग की नकारात्मक छाया बनाए रखने के लिए केवल ‘साहस पाकर’ की अपेक्षा ‘दुस्साहस’ अधिक उपयुक्त है, पर इसे सीधे ‘ढीठ’ कहकर अर्थ को अनावश्यक रूप से कठोर नहीं किया गया।
- source_word: πάντας παραπέμψας
  choice: सबको विदा कर देने के बाद
  rationale: πάντας को कर्म मानते हुए παραπέμψας यहाँ साथ के सभी लोगों को हटा देने या विदा कर देने का भाव देता है। ‘विदा कर देना’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἤδη ... ἤδη
  choice: तब तक ... अब
  rationale: यूनानी में ἤδη की पुनरावृत्ति है। हिन्दी में यांत्रिक रूप से दो बार ‘अब’ कहने के बजाय ‘तब तक’ और ‘अब’ से क्रम तथा तात्कालिकता दोनों बनाए गए हैं।
- source_word: πρόσβασιν ... ἐποιεῖτο
  choice: आगे बढ़ने लगा था
  rationale: शाब्दिक ‘पहुँच/निकट जाने की क्रिया कर रहा था’ हिन्दी में अस्वाभाविक है। यह पद उस निषिद्ध स्थान की ओर उसके बढ़ते हुए कदम को बताता है; अपूर्ण भूतकाल की प्रगतिशीलता ‘बढ़ने लगा था’ में व्यक्त होती है।
- source_word: τέλος ἐπιθήσειν
  choice: पूरा कर देगा
  rationale: यह मुहावरा किसी काम या इरादे को अंजाम तक पहुँचाने का अर्थ देता है, न कि उसे रोक देने का। ‘पूरा कर देगा’ स्पष्ट और स्वाभाविक है।
- source_word: τῷ προειρημένῳ
  choice: जिस बात का पहले उल्लेख हो चुका था
  rationale: यूनानी कृदंत संज्ञा के रूप में पहले कही या उल्लिखित बात की ओर संकेत करता है। ‘योजना’ जैसा अधिक विशिष्ट शब्द जोड़े बिना संदर्भगत अनिश्चितता सुरक्षित रखी गई है।
- source_word: δοκῶν
  choice: यह सोचते हुए कि
  rationale: यह उसके अपने अनुमान या मनोभाव को व्यक्त करता है। ‘यह सोचते हुए कि’ उसके अपेक्षित परिणाम को कथाकार की निश्चित घोषणा बनाने से बचाता है।
