lexical_decisions:
- source_word: κατακρατήσας
  choice: काबू पा लेने के बाद
  rationale: यह भूतकालिक कृदन्त किसी विरोधी योजना पर अधिकार या बढ़त पा लेने का भाव व्यक्त करता है। यह अनुवाद क्रियाओं का क्रम बनाए रखता है और यह तय नहीं करता कि षड्यंत्र को किस प्रकार विफल किया गया।
- source_word: ἐπιβουλῆς
  choice: षड्यंत्र
  rationale: ἐπιβουλή किसी के विरुद्ध रची गई योजना या घातपूर्ण चाल को दर्शाता है। इस प्रसंग में ‘षड्यंत्र’ स्वाभाविक और संक्षिप्त है, यद्यपि ‘कुचक्र’ भी सम्भव है।
- source_word: ἔκρινεν
  choice: उसने निश्चय किया
  rationale: पूरक क्रिया के साथ κρίνω यहाँ न्यायिक निर्णय नहीं, बल्कि किसी कार्य को करने का निश्चय व्यक्त करता है।
- source_word: τὰς πλησίον πόλεις
  choice: आस-पास के नगरों
  rationale: πλησίον स्थानिक निकटता बताता है; ‘आस-पास के नगर’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἐπελθὼν
  choice: जाकर
  rationale: कृदन्त नगरों की ओर जाने की सहगामी क्रिया बताता है। ‘जाकर’ यूनानी वाक्य की क्रियात्मक कड़ी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παρακαλέσαι
  choice: वहाँ के लोगों को प्रोत्साहित करे
  rationale: παρακαλέω का अर्थ प्रसंगानुसार प्रोत्साहित करना, आग्रह करना या समझाना हो सकता है। नगरों से आशय वहाँ के लोगों से है; इसे हिन्दी में स्पष्ट किया गया है।
