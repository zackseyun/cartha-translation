base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/029.yaml
  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: hi
  text: क्योंकि ऐसा प्रतीत होता था कि न केवल लोग, बल्कि दीवारें और सारी धरती भी गूँज रही थीं[a]—उस समय सब लोग उस स्थान[b] के अपवित्रीकरण के बदले मृत्यु को चुन रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ ‘प्रतिध्वनित हो रही थीं’ या ‘ध्वनि से गूँज रही थीं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में ‘उस स्थान’ से पवित्र परिसर, सम्भवतः मन्दिर का क्षेत्र, अभिप्रेत है; पर यूनानी पाठ यहाँ अधिक विशिष्ट शब्द ‘मन्दिर’ का प्रयोग नहीं करता।
    reason: cross_reference
  - marker: c
    text: शाब्दिक रूप से भाव है, ‘उस स्थान के अपवित्रीकरण के बदले मृत्यु का विनिमय कर रहे थे।’ यूनानी अभिव्यक्ति असामान्य और रूपकात्मक है; इसे ‘मृत्यु को स्वीकार कर रहे थे’ या ‘मृत्यु के हवाले किए जा रहे थे’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: क्योंकि ऐसा जान पड़ता था
  rationale: यूनानी का निर्वैयक्तिक वाक्य-विन्यास किसी दृश्य या अनुभूति के आभास को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए γὰρ का कारणसूचक बल भी रखता है।
- source_word: τοὺς ἀνθρώπους
  choice: लोग
  rationale: संदर्भ में यह एकत्र मनुष्यों के समूह को सूचित करता है; ‘मनुष्य’ की अपेक्षा ‘लोग’ अधिक स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: τὰ τείχη καὶ τὸ πᾶν ἔδαφος
  choice: दीवारें और सारी भूमि
  rationale: भौतिक परिवेश के भी ध्वनि से भर उठने की अतिशयोक्तिपूर्ण छवि को निकटता से बनाए रखता है।
- source_word: ἠχεῖν
  choice: गूँज रही थीं
  rationale: क्रिया प्रतिध्वनित या गूँजती ध्वनि बताती है; हिन्दी में यह लोगों, दीवारों और भूमि से उठती प्रतीत होने वाली ध्वनि को सहज रूप से व्यक्त करती है।
- source_word: ἅτε δὴ
  choice: आखिर
  rationale: यह अगले खंड को पहले कथन की व्याख्या या कारण के रूप में प्रस्तुत करता है; डैश के साथ ‘आखिर’ आधुनिक हिन्दी में उस व्याख्यात्मक बल को स्वाभाविक बनाता है।
- source_word: τῶν πάντων
  choice: सब
  rationale: यूनानी रूप व्यापक है और व्याकरणतः ‘सब लोगों’ अथवा अधिक सामान्य ‘सब’ का भाव दे सकता है। हिन्दी ‘सब’ संदर्भ में लोगों की ओर संकेत करता है, पर अनावश्यक रूप से संज्ञा जोड़कर अभिव्यक्ति को संकीर्ण नहीं करता।
- source_word: θάνατον ἀλλασσομένων ἀντὶ τῆς ... βεβηλώσεως
  choice: अपवित्र करने के बजाय मृत्यु स्वीकार कर रहे थे
  rationale: 'यूनानी अभिव्यक्ति असामान्य और विनिमय/प्रतिस्थापन की रूपकात्मक भाषा है: मृत्यु को अपवित्रीकरण के स्थान पर लेना। ‘मृत्यु स्वीकार करना’ हिन्दी में अर्थगम्य है, जबकि पादटिप्पणी मूल रूपक की असामान्यता दर्ज करती है।'
- source_word: τοῦ τόπου
  choice: उस स्थान
  rationale: मूल में विशिष्ट ‘मन्दिर’ नहीं, बल्कि व्यापक ‘स्थान’ है; संकेतवाचक ‘उस’ प्रसंग में पहले से पहचाने गए पवित्र परिसर की ओर इंगित करता है।
- source_word: βεβηλώσεως
  choice: अपवित्र करने
  rationale: यह किसी पवित्र स्थान की पवित्रता भंग करने को व्यक्त करता है। क्रियात्मक हिन्दी इस वाक्य में संज्ञात्मक ‘अपवित्रीकरण’ से अधिक सहज है।
theological_decisions:
- issue: τοῦ τόπου का संदर्भ
  choice: उस स्थान
  alternative: मन्दिर / पवित्र स्थान
  rationale: प्रसंग सम्भवतः पवित्र मन्दिर-परिसर की ओर संकेत करता है, पर यूनानी पाठ स्वयं केवल ‘स्थान’ कहता है। अधिक विशिष्ट धार्मिक पद जोड़ने के बजाय वही व्यापकता मुख्य पाठ में रखी गई है।
- issue: τῶν πάντων और ἀλλασσομένων का आशय
  choice: सब ... मृत्यु स्वीकार कर रहे थे
  alternative: सब कुछ मृत्यु में बदला जा रहा था / सब मृत्यु के हवाले किए जा रहे थे
  rationale: विनिमय-सूचक क्रिया और ἀντί-वाक्यांश स्वेच्छा से अपवित्रीकरण के बजाय मृत्यु लेने का प्रबल अर्थ देते हैं। फिर भी यूनानी संरचना असामान्य है, इसलिए वैकल्पिक निष्क्रिय समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अपवित्रीकरण’ जैसे भारी संज्ञात्मक रूप के स्थान पर ‘अपवित्र करने’ और असहज शाब्दिक ‘मृत्यु का विनिमय’ के स्थान पर मुख्य पाठ में ‘मृत्यु स्वीकार’ रखा गया है; मूल की असामान्य रूपकात्मकता पादटिप्पणी में संरक्षित है।
