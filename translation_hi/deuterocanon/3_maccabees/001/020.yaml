base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: hi
  text: इनके अतिरिक्त माताएँ और धाइयाँ[a] भी अपने नवजात बच्चों को—कुछ घरों में और कुछ गलियों में—छोड़कर, पीछे मुड़े बिना सर्वोच्च पवित्रस्थान[b] में इकट्ठी होती चली गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूध पिलानेवाली धाइयाँ”; यूनानी शब्द विशेष रूप से शिशुओं को दूध पिलानेवाली स्त्रियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परम ऊँचा मंदिर” अथवा “अत्यंत महिमामय पवित्रस्थान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νεογνὰ τῶν τέκνων
  choice: नवजात बच्चों
  rationale: यह पद बहुत छोटे, हाल ही में जन्मे बच्चों को सूचित करता है; ‘नवजात बच्चों’ से अर्थ और प्रसंग की करुणा दोनों स्पष्ट रहते हैं।
- source_word: τιθηνοὶ
  choice: धाइयाँ
  rationale: यूनानी शब्द शिशुओं की देखभाल करनेवाली स्त्रियों, और विशेष रूप से दूध पिलानेवाली धाइयों, के लिए प्रयुक्त हो सकता है। ‘धाइयाँ’ संक्षिप्त और प्रसंगानुकूल है; अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: παραλείπουσαι
  choice: छोड़कर
  rationale: कृदंत का मूल भाव पीछे छोड़ना है; ‘छोड़कर’ अनावश्यक नैतिक आरोप जोड़े बिना जल्दबाजी में किए गए कार्य को व्यक्त करता है।
- source_word: ἄλλως καὶ ἄλλως … αἱ μὲν … αἱ δὲ
  choice: कुछ घरों में और कुछ गलियों में
  rationale: अगले वितरणात्मक वाक्यांश सामान्य अभिव्यक्ति को स्पष्ट करते हैं; यह हिन्दी में स्वाभाविक रूप से उसी भेद को सामने रखता है।
- source_word: ἀγυιὰς
  choice: गलियों
  rationale: यह नगर के सार्वजनिक मार्गों या सड़कों का द्योतक है; ‘गलियों’ से स्थानीय नगरीय परिवेश स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἀνεπιστρέπτως
  choice: पीछे मुड़े बिना
  rationale: यह लौटकर न देखने या न मुड़ने की छवि और पवित्रस्थान की ओर उनके एकनिष्ठ बढ़ने को सुरक्षित रखता है।
- source_word: πανυπέρτατον
  choice: सर्वोच्च
  rationale: यह तीव्रतम श्रेष्ठतासूचक रूप है; ‘सर्वोच्च’ उसकी ऊँचाई और महिमा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: शब्द मंदिर या उसके पवित्र परिसर का अर्थ दे सकता है; ‘पवित्रस्थान’ वास्तु-संबंधी सीमा को जरूरत से अधिक निश्चित किए बिना धार्मिक गंतव्य को व्यक्त करता है।
- source_word: ἠθροίζοντο
  choice: इकट्ठी होती चली गईं
  rationale: अपूर्ण काल चलती हुई सामूहिक प्रक्रिया को दर्शाता है; यह हिन्दी पदबंध उस निरंतरता को बनाए रखता है।
theological_decisions:
- issue: πανυπέρτατον ἱερὸν का अनुवाद
  choice: सर्वोच्च पवित्रस्थान
  alternative: परम ऊँचा मंदिर; अत्यंत महिमामय पवित्रस्थान
  rationale: यह ऊँची उपासना-संबंधी भाषा है, पर वाक्यांश को परमेश्वर की किसी निश्चित उपाधि के रूप में लेना आवश्यक नहीं। चुना हुआ अनुवाद तीव्र श्रेष्ठतासूचक बल को बनाए रखते हुए किसी अतिरिक्त सिद्धान्तगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। स्त्रीलिंग बहुवचन क्रिया विषय ‘माताएँ और धाइयाँ’ के अनुरूप रखी गई है। डैश से यह स्पष्ट किया गया है कि ‘कुछ घरों में और कुछ गलियों में’ नवजात बच्चों को छोड़ने के अलग-अलग स्थान बताता है।
