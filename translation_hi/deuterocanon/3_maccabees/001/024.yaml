  rationale: यह वाक्य के मुख्य क्रियापद से जुड़ा भूतकालिक कृदन्त है। संदर्भ में यह दिशा बदलने या वापस मुड़ने का भाव देता है, पर कर्तृवाच्य और कर्मवाच्य के बीच का अंतर पूरी तरह निश्चित नहीं करता।
- source_word: παρῆσαν
  choice: फिर ... आ गए
  rationale: πάρειμι यहाँ ἐπὶ और कर्मकारक के साथ किसी दशा या स्थिति में पहुँचने का भाव देता है। ‘फिर ... आ गए’ पहले वाली स्थिति पुनः ग्रहण करने का संकेत स्वाभाविक हिन्दी में देता है।
- source_word: στάσιν
  choice: मुद्रा
  rationale: στάσις शारीरिक खड़े होने की अवस्था, स्थिति या दशा को व्यक्त कर सकता है। ‘मुद्रा’ प्रार्थना की देहगत स्थिति को सामने रखती है, जबकि व्यापक ‘दशा’ भी सम्भव है।
- source_word: δεήσεως
  choice: विनती
  rationale: δέησις सामान्य प्रार्थना से अधिक आग्रहपूर्ण याचना या गुहार का बोध कराता है। ‘विनती’ आधुनिक, सहज और गरिमापूर्ण हिन्दी में यह भाव बनाए रखती है।
- source_word: ἐπὶ τὴν αὐτὴν ... στάσιν
  choice: उसी मुद्रा में
  rationale: यह पदबंध पहले की विनतीपूर्ण स्थिति या मुद्रा को पुनः ग्रहण करने का संकेत देता है। ‘उसी मुद्रा में’ उसके शारीरिक पक्ष को बनाए रखता है, बिना व्यापक अर्थ को पाठ से बाहर किए।
