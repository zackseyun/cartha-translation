  yaml_path: translation/deuterocanon/3_maccabees/001/016.yaml
  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: hi
  text: परन्तु, क्योंकि तू अपनी प्रजा इस्राएल के बीच अपनी महिमा रखने से प्रसन्न हुआ, इसलिए तूने इस स्थान को पवित्र किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध या मोड़ को स्पष्ट करता है और प्रार्थना की गरिमापूर्ण शैली के अनुकूल है।
- source_word: ἐπεὶ
  choice: क्योंकि ... इसलिए
  rationale: यहाँ पद कारण और उसके परिणाम का संबंध व्यक्त करता है; हिन्दी में ‘क्योंकि ... इसलिए’ इसे स्वाभाविक और स्पष्ट बनाता है।
- source_word: εὐδόκησας
  choice: तूने ... रखना उचित समझा
  rationale: यह परमेश्वर की प्रसन्न इच्छा और अनुकूल निर्णय, दोनों को व्यक्त करता है; केवल ‘प्रसन्न हुआ’ की अपेक्षा वाक्य में अधिक स्वाभाविक है।
- source_word: τὴν δόξαν σου
  choice: अपनी महिमा
  rationale: पवित्र संदर्भ में δόξα परमेश्वर की दिव्य महिमा को दर्शाता है; ‘महिमा’ इसका मानक और सटीक हिन्दी प्रतिशब्द है।
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: अपनी प्रजा इस्राएल के बीच
  rationale: व्यक्तियों के समुदाय के संदर्भ में ἐν का स्वाभाविक हिन्दी रूप ‘के बीच’ है और मूल अर्थ को सुरक्षित रखता है।
- source_word: ἡγίασας
  choice: तूने ... पवित्र किया
  rationale: ἁγιάζω किसी वस्तु या स्थान को पवित्र ठहराने अथवा अलग करने को व्यक्त करता है; ‘पवित्र किया’ आधुनिक पाठकों के लिए स्पष्ट है और धार्मिक अर्थ बनाए रखता है।
- source_word: τὸν τόπον τοῦτον
  choice: इस स्थान को
  rationale: τόπος का सीधा अर्थ ‘स्थान’ है; ‘पवित्रस्थान’ या ‘मन्दिर’ कहना मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: स्थान के लिए प्रयुक्त पवित्रता-संबंधी धार्मिक भाषा
  choice: इस स्थान को पवित्र किया
  alternative: इस स्थान का अभिषेक किया / इस स्थान को समर्पित किया
  rationale: मूल यूनानी क्रिया स्पष्टतः पवित्र किए जाने का भाव रखती है। ‘पवित्र किया’ उस धार्मिक श्रेणी को सुरक्षित रखता है और ‘अभिषेक’ जैसी अधिक विशिष्ट क्रिया नहीं जोड़ता।
- issue: परमेश्वर की महिमा का इस्राएल में होना
  choice: अपनी महिमा को अपनी प्रजा इस्राएल के बीच रखना उचित समझा
  alternative: अपनी प्रजा इस्राएल में अपनी महिमा प्रकट करने से प्रसन्न हुआ
  rationale: मूल में ‘प्रकट करने’ की क्रिया नहीं है। चुना हुआ रूप स्थानगत अर्थ और परमेश्वर की प्रसन्न इच्छा दोनों बचाता है, बिना यह निश्चित किए कि महिमा की उपस्थिति किस ढंग से हुई।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर को सम्बोधन में एकवचन ‘तू’ रखा गया है, जो बाइबिलीय प्रार्थना में निकटता और प्रत्यक्ष सम्बोधन व्यक्त करता है। वाक्य को सहज बनाने के लिए कारण-परिणाम की रचना ‘क्योंकि ... इसलिए’ प्रयोग की गई है।
