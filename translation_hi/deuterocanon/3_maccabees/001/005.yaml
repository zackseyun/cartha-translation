- source_word: δοριαλώτους
  choice: युद्धबंदी
  rationale: यह सैन्य पद शाब्दिक रूप से ‘भाले से पकड़े गए’ व्यक्तियों को दर्शाता है; आधुनिक हिन्दी में ‘युद्धबंदी’ इसका सहज समतुल्य है, और शाब्दिक बिंब पादटिप्पणी में दिया गया है।
- source_word: συλλημφθῆναι
  choice: बना लिए गए
  rationale: ‘युद्धबंदी’ के साथ ‘बना लिए गए’ स्वाभाविक हिन्दी है और पकड़े जाने के निष्क्रिय भाव को व्यक्त करता है।
