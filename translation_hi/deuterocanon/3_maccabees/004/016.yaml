base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: hi
  text: और राजा, अत्यन्त आनन्द से निरन्तर भरा हुआ, सभी मूर्तियों के सामने[a] भोजों का आयोजन करता था। उसका मन सत्य से बहुत दूर था और उसका मुख अपवित्र था; वह उन बहरी वस्तुओं की प्रशंसा करता था, जो न बोल सकती थीं, न उनकी सहायता कर सकती थीं; परन्तु परमेश्वर[b] के विरुद्ध अनुचित बातें बोलता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभी मूर्तियों के सम्मान में’।
    reason: lexical_alternative
  - marker: b
    text: स्रोत संस्करण के यूनानी पाठ में ‘परमेश्वर’ शब्द को वर्ग कोष्ठकों में रखा गया है, जो इस पाठ के विषय में अनिश्चितता दर्शाता है; वाक्य का भाव परमेश्वर के विरुद्ध अनुचित बातें बोलने का है।
    reason: textual_variant
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς
  choice: अत्यन्त और निरन्तर
  rationale: दोनों क्रियाविशेषण क्रमशः आनन्द की तीव्रता और उसकी लगातार बनी रहने वाली अवस्था व्यक्त करते हैं।
- source_word: συμπόσια
  choice: भोज
  rationale: यह उत्सवी सामूहिक भोजन अथवा मद्यपान-समारोह का सूचक है; राजकीय और उपासना-संबंधी प्रसंग में ‘भोज’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: सभी मूर्तियों के सामने
  rationale: यह ἐπί के स्थान-संबंधी मूल भाव के निकट रहता है और मूर्ति-पूजा के परिवेश को बिना अनावश्यक व्याख्या जोड़े व्यक्त करता है। ‘सभी मूर्तियों के सम्मान में’ भी प्रसंगानुकूल सम्भव है।
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: उसका मन सत्य से बहुत दूर था
  rationale: φρήν यहाँ भीतरी सोच या मनोवृत्ति का द्योतक है; हिन्दी में स्वतंत्र उपवाक्य मूल वर्णन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: βεβήλῳ στόματι
  choice: उसका मुख अपवित्र था
  rationale: βεβήλος धार्मिक दृष्टि से अपवित्र या अनादरपूर्ण होने का भाव रखता है; ‘अपवित्र मुख’ मूल रूपक को बनाए रखता है।
- source_word: κωφὰ
  choice: बहरी वस्तुओं
  rationale: यूनानी में विशेषण नपुंसकलिंग बहुवचन है और संज्ञा निहित है। ‘वस्तुओं’ के साथ ‘बहरी’ मूल की तिरस्कारपूर्ण अभिव्यक्ति को सुरक्षित रखता है।
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: जो उनसे बोलने या उनकी सहायता करने में असमर्थ थीं
  rationale: ‘उनसे/उनकी’ αὐτοῖς के बहुवचन संकेत को बनाए रखता है और मूर्तियों की बोलने तथा सहायता करने की असमर्थता स्पष्ट करता है, बिना उसके संदर्भ को आवश्यकता से अधिक निश्चित किए।
- source_word: εἰς δὲ [τὸν θεὸν] τὶ μὴ καθήκοντα λαλῶν
  choice: परन्तु परमेश्वर के विरुद्ध अनुचित बातें बोलता था
  rationale: विरोधी प्रसंग में εἰς को ‘के विरुद्ध’ कहना मूर्तियों की प्रशंसा और परमेश्वर के प्रति अनुचित वाणी के बीच का स्पष्ट विरोध सुरक्षित रखता है।
theological_decisions:
- issue: मूर्तियों की प्रशंसा के विपरीत परमेश्वर के प्रति राजा की वाणी
  choice: परन्तु परमेश्वर के विरुद्ध अनुचित बातें बोलता था
  alternative: परन्तु परमेश्वर के विषय में अशोभनीय बातें बोलता था
  rationale: εἰς के साथ λαλῶν इस विरोधी प्रसंग में परमेश्वर के विरुद्ध कही गई बातों का भाव दे सकता है। चुना हुआ पाठ इस वैरपूर्ण दिशा को व्यक्त करता है, जबकि पादटिप्पणी मुद्रित यूनानी पाठ में ‘परमेश्वर’ की पाठगत अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। लम्बे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘बहरी वस्तुओं’ की असामान्य किन्तु जानबूझकर की गई अभिव्यक्ति मूल यूनानी की मूर्तियों के प्रति तिरस्कारपूर्ण नपुंसकलिंग भाषा को सुरक्षित रखती है।
