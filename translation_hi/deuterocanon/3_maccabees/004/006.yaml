base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: hi
  text: और वे युवतियाँ, जो अभी-अभी वैवाहिक जीवन की साझेदारी के लिए विवाह-कक्ष[a] में प्रवेश कर चुकी थीं, आनन्द के बदले विलाप करने लगीं। उनके सुगन्धित तेल से भीगे बाल धूल से सने हुए थे, और उन्हें सिर खुले हुए[b] ले जाया जा रहा था। वे सब मिलकर विवाह-गीतों के बदले शोकगीत गाने लगीं, मानो विदेशियों के दुर्व्यवहार से चीर डाली गई हों[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवाह-शय्या”; यूनानी पद विवाह-कक्ष या विवाह-शय्या, दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अनावृत्त” या “सिर खुला हुआ” है; इस प्रसंग में यह सार्वजनिक अपमान का संकेत है।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद “विदेशियों द्वारा किए गए दुर्व्यवहार से” भी हो सकता है; यूनानी भाषा दूसरी जाति के लोगों से जुड़े दुर्व्यवहार पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτι
  choice: अभी-अभी
  rationale: हाल ही में संपन्न हुए प्रवेश का तात्कालिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς βίου κοινωνίαν
  choice: वैवाहिक जीवन की साझेदारी के लिए
  rationale: κοινωνία के साझा जीवन और सहभागिता के भाव को विवाह-संदर्भ सहित स्पष्ट रखता है।
- source_word: γαμικὸν ... παστὸν
  choice: विवाह-कक्ष
  rationale: पद विवाह-कक्ष अथवा विवाह-शय्या दोनों का संकेत दे सकता है; मुख्य पाठ में व्यापक और प्रसंगानुकूल अर्थ चुना गया है।
- source_word: νεάνιδες
  choice: युवतियाँ
  rationale: आयु और लिंग का सीधा अनुवाद है; 'नववधुएँ' कहकर मूल से अधिक व्याख्या नहीं जोड़ी गई।
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: आनन्द के बदले विलाप करने लगीं
  rationale: आनन्द और शोक के तीखे उलटाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μυροβρεχῆ ... κόμην
  choice: सुगन्धित तेल से भीगे बाल
  rationale: μύρον को किसी एक विशेष द्रव्य, जैसे गन्धरस, तक सीमित किए बिना सुगन्धित अभिषेक-तेल का भाव देता है।
- source_word: πεφυρμέναι
  choice: धूल से सने
  rationale: सजाए हुए बालों के धूल से मलिन किए जाने का दृश्य स्पष्ट और स्वाभाविक रूप में देता है।
- source_word: ἀκαλύπτως
  choice: बिना घूँघट
  rationale: सिर या मुख का आवरण हटे होने के सार्वजनिक अपमान को भारतीय पाठक के लिए सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ἀγόμεναι
  choice: ले जाया जा रहा था
  rationale: निष्क्रिय और बाध्यकारी गति को बिना अनावश्यक हिंसा जोड़े व्यक्त करता है।
- source_word: θρῆνον
  choice: शोकगीत
  rationale: विवाह-गीतों के विपरीत सामूहिक मातमी गान का स्पष्ट हिन्दी रूप है।
- source_word: ὑμεναίων
  choice: विवाह-गीतों
  rationale: विवाह अवसर पर गाए जाने वाले गीतों का आधुनिक और स्पष्ट अनुवाद है।
- source_word: ὁμοθυμαδόν
  choice: सब एक साथ
  rationale: सामूहिक एकभावता को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὡς ἐσπαραγμέναι αἰκίαις ἀλλοεθνεῖσιν
  choice: मानो दूसरी जाति के लोगों के दुर्व्यवहार से चीर डाली गई हों
  rationale: ὡς की उपमा, σπαράσσω की हिंसक छवि और ἀλλοεθνής के परजातीय भाव को बनाए रखता है; कारक-संबंध की हल्की अस्पष्टता पादटिप्पणी में दी गई है।
