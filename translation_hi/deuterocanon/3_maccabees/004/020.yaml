translation:
  language: hi
  text: और वे प्रमाण के साथ यह दावा कर रहे थे कि उनके पास का पपीरस और वे लिखने की नरकट की कलमें, जिनका वे उपयोग कर रहे थे, पहले ही खत्म हो गए थे।
