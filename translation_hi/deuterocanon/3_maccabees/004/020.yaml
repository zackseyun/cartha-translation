lexical_decisions:
- source_word: λεγόντων
  choice: कह रहे थे
  rationale: यह संबंधकारक बहुवचन वर्तमान कृदंत है, जो प्रसंग में जारी कथन को आगे बढ़ाता है। ‘कह रहे थे’ स्वाभाविक है; दावे की पुष्टि का बल अगले पदबंध ‘प्रमाण देकर’ से स्पष्ट होता है।
- source_word: μετὰ ἀποδείξεως
  choice: प्रमाण देकर
  rationale: ἀπόδειξις प्रमाण या पुष्ट प्रदर्शन का अर्थ देता है। यह रूप हिन्दी में स्वाभाविक ढंग से बताता है कि उनका कथन प्रमाण-सहित था।
- source_word: τὴν χαρτηρίαν
  choice: पपीरस
  rationale: यह प्राचीन पपीरस-आधारित लेखन-सामग्री को सूचित करता है। ‘कागज़’ की अपेक्षा ‘पपीरस’ ऐतिहासिक संदर्भ को अधिक ठीक रखता है।
- source_word: τοὺς γραφικοὺς καλάμους
  choice: लिखने की नरकटों
  rationale: यूनानी का शाब्दिक अर्थ ‘लिखने की नरकटें’ है। मुख्य पाठ स्रोत की ठोस छवि बनाए रखता है और अधिक प्रचलित अर्थ ‘नरकट की कलमें’ पाद-टिप्पणी में दिया गया है।
- source_word: ἐν οἷς ἐχρῶντο
  choice: जिन ... का वे उपयोग कर रहे थे
  rationale: अपूर्णकालीन क्रिया अतीत में जारी उपयोग को दर्शाती है। हिन्दी संरचना में सर्वनाम का संबंध पपीरस और लिखने की नरकटों दोनों से रखा गया है।
- source_word: ἐκλελοιπέναι
  choice: अब तक समाप्त हो चुके थे
  rationale: पूर्णकालीन infinitive उस समय तक पूरी हो चुकी कमी या समाप्ति को व्यक्त करता है। ‘अब तक’ यूनानी में निहित ἤδη का कालगत बल देता है।
