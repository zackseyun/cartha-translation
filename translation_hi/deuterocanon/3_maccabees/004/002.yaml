  choice: ऐसा शोक जिसे शब्दों में व्यक्त नहीं किया जा सकता था
  rationale: ἄλεκτον उस शोक की अवर्णनीयता बताता है। यह स्वाभाविक आधुनिक हिन्दी में यूनानी पद की प्रबलता बनाए रखता है।
- source_word: πανόδυρτος ... βοή
  choice: चारों ओर विलाप की पुकार
  rationale: दुर्लभ और प्रबल πανόδυρτος को कृत्रिम यौगिक शब्द से नहीं, बल्कि व्यापक विलाप का भाव देने वाले सहज पद से व्यक्त किया गया है।
- source_word: μετὰ δακρύων
  choice: आँसुओं के साथ
  rationale: यूनानी पूर्वसर्गीय पद का सीधा और स्पष्ट अर्थ सुरक्षित रखा गया है।
- source_word: στεναγμοῖς πεπυρωμένης ... τῆς καρδίας
  choice: उनका हृदय ... कराहों में जल रहा था
  rationale: πεπυρωμένης की अग्नि-छवि और στεναγμοῖς की सुनाई देने वाली पीड़ा दोनों को बनाए रखा गया है।
- source_word: πάντοθεν
  choice: हर ओर से
  rationale: यह पीड़ा के चारों ओर से घेर लेने और उसकी पूर्ण तीव्रता को व्यक्त करता है।
- source_word: ὀλοφυρομένων
  choice: वे ... विलाप कर रहे थे
  rationale: मध्यवाच्य कृदन्त को स्पष्ट हिन्दी कर्ता के साथ सक्रिय और स्वाभाविक रूप में रखा गया है।
- source_word: ἀπροσδόκητον ἐξαίφνης
  choice: अचानक और अप्रत्याशित रूप से
  rationale: दोनों निकटार्थक यूनानी अभिव्यक्तियों को अलग रखा गया है, ताकि मूल की भावात्मक पुनरुक्ति न मिटे।
- source_word: ἐπικριθεῖσαν
  choice: निर्णय ... सुनाया गया था
  rationale: शब्द के न्यायिक या आधिकारिक निर्णय वाले भाव को सुलभ हिन्दी में व्यक्त करता है; 'उनके विरुद्ध' hostile दिशा को स्पष्ट रखता है।
- source_word: ὀλεθρίαν
  choice: विनाश
  rationale: यह विनाशकारी विपत्ति या सर्वनाश के मूल भाव को संक्षेप और गरिमा से व्यक्त करता है।
