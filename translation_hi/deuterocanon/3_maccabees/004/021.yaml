translation:
  language: hi
  text: पर यह स्वर्ग से यहूदियों की सहायता करनेवाले की देखरेख का अजेय प्रभाव था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्ग से आनेवाली उस देखरेख का अजेय प्रभाव, जो यहूदियों की सहायता करनेवाले की है।’
    reason: ‘स्वर्ग से’ का संबंध वाक्य में ‘देखरेख’ के साथ भी समझा जा सकता है; मुख्य पाठ में इसे निकटवर्ती सहायता करने की क्रिया से जोड़ा गया है।
lexical_decisions:
- source_word: ἐνέργεια
  choice: कार्य
  rationale: यह संज्ञा सक्रिय प्रभाव या क्रियाशीलता को दर्शाती है। ‘कार्य’ सहज हिन्दी है और इसे अनावश्यक रूप से ‘चमत्कार’ नहीं बनाता।
- source_word: προνοίας
  choice: देखरेख
  rationale: यहाँ शब्द स्वर्ग से आनेवाली संरक्षणकारी और प्रबंधकारी देखभाल का भाव देता है। ‘देखरेख’ सामान्य पाठक के लिए स्वाभाविक है और ‘ईश्वरीय विधान’ कहकर निहित कर्ता को समय से पहले स्पष्ट नहीं करता।
- source_word: τοῦ βοηθοῦντος
  choice: सहायता करनेवाले की
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत की अप्रत्यक्ष शैली सुरक्षित रखी गई है; परमेश्वर का नाम मूल यूनानी में प्रत्यक्ष रूप से नहीं दिया गया।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: इस प्रसंग में यह मिस्र में रहनेवाले यहूदी जातीय-धार्मिक समुदाय को सूचित करता है, केवल यहूदिया के निवासियों को नहीं।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से होनेवाली
  rationale: यह वाक्यांश देखरेख के स्वर्गीय स्रोत को सीधे व्यक्त करता है और ‘आकाश’ के भौतिक अर्थ से बचता है।
- source_word: ἀνίκητον
  choice: जिसे पराजित नहीं किया जा सकता था
  rationale: यह स्वाभाविक हिन्दी में उस कार्य की अजेयता और उस पर विजय न पा सकने का पूर्ण बल व्यक्त करता है।
theological_decisions:
- issue: ‘यहूदियों की सहायता करनेवाले’ का अभिप्राय
  choice: परमेश्वर का निहित संकेत रखते हुए उसका नाम प्रत्यक्ष रूप से नहीं जोड़ा गया।
  alternative: ‘परमेश्वर, जो स्वर्ग से यहूदियों की सहायता करता है’
  rationale: यूनानी पाठ परमेश्वर का नाम लेने के बजाय संज्ञात्मक कृदंत का प्रयोग करता है। अनुवाद उसी अप्रत्यक्षता को बचाता है, जबकि प्रसंग में दिव्य अभिप्राय समझ में आता है।
- issue: ἐξ οὐρανοῦ का संबंध
  choice: इसे ‘देखरेख’ के स्वर्गीय स्रोत से जोड़ा गया।
  alternative: 'इसे ‘सहायता करनेवाले’ की क्रिया से जोड़ना: ‘जो स्वर्ग से यहूदियों की सहायता करता है’'
  rationale: यूनानी शब्दक्रम दोनों संबंधों की कुछ गुंजाइश देता है। मुख्य पाठ निकटवर्ती ‘देखरेख’ से संबंध दिखाता है और पादटिप्पणी वैकल्पिक संबंध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘परमेश्वर’ को स्पष्ट रूप से जोड़ने से बचकर मूल की अप्रत्यक्ष धार्मिक अभिव्यक्ति तथा ‘स्वर्ग से’ के व्याकरणिक संबंध की वास्तविक अस्पष्टता बनाए रखी गई है।
