lexical_decisions:
- source_word: δέσμιοι
  choice: कैदियों के रूप में
  rationale: यह शब्द बँधे या बंदी बनाए गए लोगों को दर्शाता है; आरंभिक विधेयात्मक बल को बनाए रखने के लिए ‘कैदियों के रूप में’ चुना गया।
- source_word: δημοσίᾳ
  choice: सबके सामने
  rationale: संदर्भ में क्रिया-विशेषण का अर्थ सार्वजनिक रूप से, खुलेआम है; ‘सबके सामने’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: जहाज़ में चढ़ाए जाने तक
  rationale: ἐμβολή भीतर डालने या पहुँचाने की क्रिया को व्यक्त करता है; यहाँ आशय उन्हें जहाज़ के भीतर चढ़ाए जाने से है। यह अनुवाद हिंसक ‘ठूँसने’ का अर्थ मुख्य पाठ में अनिवार्य नहीं बनाता, पर पादटिप्पणी में उस शाब्दिक संभावना को सुरक्षित रखता है।
- source_word: εἵλκοντο
  choice: घसीटते हुए ... ले जाया गया
  rationale: अपूर्ण भूतकाल का कर्मवाच्य रूप जारी रहने वाली जबरन गति दर्शाता है। हिन्दी में ‘घसीटते हुए ले जाया गया’ उस प्रक्रिया और दिशा, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ βίας
  choice: बलपूर्वक
  rationale: यह वाक्यांश जबरदस्ती और हिंसक बाध्यता को दर्शाता है; ‘बलपूर्वक’ संक्षिप्त, सटीक और गरिमापूर्ण है।
