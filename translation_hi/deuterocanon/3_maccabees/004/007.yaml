  verdict: revise
  source_fidelity: 'The draft conveys all principal Greek elements, but its construction “घसीटते हुए ... ले जाया गया” is syntactically less precise: it can blur the passive sense of εἵλκοντο. A direct passive progressive better represents the ongoing forcible dragging.'
  naturalness: “सबके सामने” is understandable, but “सार्वजनिक रूप से” more directly and neutrally expresses δημοσίᾳ. The revised sentence is idiomatic modern standard Hindi and clearly preserves the sequence of being dragged until being placed aboard.
  terminology: “कैदियों के रूप में,” “बलपूर्वक,” and “जहाज़ में चढ़ा दिया गया” suitably render δέσμιοι, μετὰ βίας, and the contextual force of ἐμβολή. The footnote retains the possible more forceful nuance without making it mandatory in the main text.
  issues:
  - severity: medium
    issue: The phrase “घसीटते हुए ... ले जाया गया” weakens the direct passive-progressive force of εἵλκοντο.
    rationale: The Greek states that they themselves were being dragged. “उन्हें ... घसीटा जाता रहा” expresses this unambiguously and preserves the imperfect's ongoing action.
  - severity: low
    issue: “सबके सामने” is slightly more specific than the adverb δημοσίᾳ.
    rationale: “सार्वजनिक रूप से” retains the sense of public/open action without necessarily implying an assembled group of onlookers.
  revised_text: और कैदियों के रूप में उन्हें सार्वजनिक रूप से बलपूर्वक घसीटा जाता रहा, जब तक कि उन्हें जहाज़ में चढ़ा न दिया गया[a]।
