translation:
  language: hi
  text: किन्तु उनके विरुद्ध उन्हें और भी कठोरता से राज़ी कर लिया गया[a], क्योंकि यह आरोप था कि बच निकलने की योजना के लिए उन्हें रिश्वत दी गई थी; और यह स्पष्ट हो गया कि वह इस बात से आश्वस्त हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी वाक्य-विन्यास संक्षिप्त और कुछ असहज है। अंतिम खंड का अनुवाद यह भी हो सकता है: “और यह बात सामने आई कि वह इस विषय में आश्वस्त हो गया था।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείσθησαν
  choice: उन्हें ... मना लिया गया
  rationale: अओरिस्ट कर्मवाच्य का भाव बनाए रखा गया है और मनाने वाले को, यूनानी की तरह, अनकहा छोड़ा गया है।
- source_word: αὐτοῖς
  choice: उनके विरुद्ध
  rationale: संदर्भ में यह संप्रदान कारक उस पक्ष की ओर संकेत करता है जिसके विरुद्ध अधिकारियों की धारणा या कार्रवाई बनी; इसलिए प्रतिकूल अर्थ स्वाभाविक है।
- source_word: σκληρότερον
  choice: और भी कठोर रुख अपनाने के लिए
  rationale: तुलनात्मक क्रियाविशेषण की कठोरता और बढ़ोतरी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल दंड या क्रूरता तक सीमित किए।
- source_word: δεδωροκημένοις
  choice: उन्हें घूस दी गई थी
  rationale: पूर्ण कर्मवाच्य कृदन्त आरोप को व्यक्त करता है कि वे धन देकर अपने पक्ष में किए गए थे; हिन्दी में कर्मवाच्य इस रूप को सुरक्षित रखता है।
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: बच निकलने की योजना के लिए
  rationale: μηχανή को यहाँ युक्ति या षड्यंत्रात्मक योजना और ἐκφυγή को बच निकलना समझते हुए आरोपात्मक स्वर बनाए रखा गया है।
- source_word: συνεβῆ σαφῶς
  choice: परिणाम यह हुआ
  rationale: संकुचित और कुछ असहज यूनानी रचना को पठनीय हिन्दी दी गई है; σαφῶς की स्पष्टता अगले वाक्यांश में ‘पूरा विश्वास’ से भी परिलक्षित होती है।
- source_word: πιστωθῆναι
  choice: उसे ... पूरा विश्वास हो गया
  rationale: πιστόω के कर्मवाच्य भाव को किसी बात के विषय में निश्चित या आश्वस्त हो जाने के रूप में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में एकवचन αὐτόν का संदर्भ
  choice: उसे
  alternative: किसी पूर्वोक्त व्यक्ति का नाम जोड़ना
  rationale: इस पद में उस पुरुष की पहचान स्पष्ट नहीं की गई है; इसलिए स्रोत की संदर्भगत अस्पष्टता बनाए रखी गई है।
