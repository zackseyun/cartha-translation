  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। प्रशासनिक या न्यायिक आरोप का स्वर बनाए रखते हुए अत्यधिक शाब्दिक और अस्वाभाविक वाक्य-विन्यास से बचा गया है।
