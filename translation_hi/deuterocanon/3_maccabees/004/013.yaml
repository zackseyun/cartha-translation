translation:
  language: hi
  text: क्रोध से भरकर उसने आदेश दिया कि इन लोगों के साथ भी ठीक उसी तरह, पूरी सावधानी से, व्यवहार किया जाए जैसा उन लोगों के साथ किया गया था, और इन्हें दिया जाने वाला दंड उन लोगों के दंड से किसी भी प्रकार कम न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοργισθείς
  choice: क्रोध से भरकर
  rationale: यह रूप तीव्र क्रोध की अवस्था व्यक्त करता है। ‘क्रोध से भरकर’ आधुनिक हिन्दी में स्वाभाविक है और मूल की तीव्रता बनाए रखता है।
- source_word: προσέταξεν
  choice: उसने आदेश दिया
  rationale: यह अधिकारपूर्वक आदेश देने का सामान्य अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ τούτοις ὁμοῦ
  choice: इन लोगों के साथ भी
  rationale: τούτοις वर्तमान समूह की ओर संकेत करता है और καί का योगात्मक बल ‘भी’ से व्यक्त होता है।
- source_word: τὸν αὐτὸν τρόπων
  choice: ठीक वैसा ही
  rationale: यूनानी पदबंध रूप की दृष्टि से असहज है, पर आशय पिछले समूह के समान व्यवहार या समान रीति अपनाने का है। सहज हिन्दी में ‘ठीक वैसा ही’ इस समानता को बनाए रखता है।
- source_word: ἐπιμελῶς
  choice: सावधानीपूर्वक
  rationale: यह कार्य को ध्यान और तत्परता से पूरा करने का भाव देता है; दंड के प्रसंग में इसमें पूरी तरह कार्यान्वित करने की छाया भी है।
- source_word: ὡς ἐκείνοις ποιῆσαι
  choice: जैसा उन लोगों के साथ किया गया था
  rationale: तुलनात्मक संरचना वर्तमान समूह के साथ वही किए जाने को कहती है जो पहले वाले समूह के साथ हुआ था। कर्मवाच्य हिन्दी में प्रसंग स्वाभाविक रहता है।
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: किसी भी तरह कम न हो
  rationale: दोहरी अभिव्यक्ति किसी प्रकार भी पीछे न रहने या न्यून न होने पर जोर देती है।
- source_word: τῆς ἐκείνων τιμωρίας
  choice: उन लोगों के दंड से
  rationale: τιμωρία यहाँ दंडात्मक व्यवहार को सूचित करता है और ἐκείνων पहले उल्लेखित समूह की ओर लौटता है।
