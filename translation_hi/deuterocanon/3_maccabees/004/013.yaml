  verdict: revise
  source_fidelity: The draft accurately conveys the ruler's intense anger, his command that the present group receive the same treatment as the earlier group, and the emphatic requirement that their punishment not be reduced in any respect. A small revision makes the final comparison explicitly apply to the punishment imposed on the present group and more clearly reflects the careful execution expressed by ἐπιμελῶς.
  naturalness: The current Hindi is generally natural, but “उनका दंड” can momentarily have an unclear antecedent, and “ठीक वैसा ही किया जाए” leaves the implied action somewhat elliptical. Supplying “व्यवहार किया जाए” and “इन्हें दिया जाने वाला दंड” improves clarity without adding meaning.
  terminology: “क्रोध से भरकर,” “आदेश दिया,” and “दंड” are suitable modern-standard Hindi narrative and legal-punitive terms. “पूरी सावधानी से” naturally conveys the contextually thorough force of ἐπιμελῶς.
  issues:
  - severity: low
    issue: Ambiguous possessive in “उनका दंड”
    rationale: The possessive may briefly be read as referring to either group. The Greek explicitly compares the present group's treatment with the earlier group's punishment; “इन्हें दिया जाने वाला दंड” makes this relationship clear.
  - severity: low
    issue: The implied action in “ठीक वैसा ही किया जाए” is underspecified in Hindi
    rationale: Although understandable, adding “व्यवहार किया जाए” yields an idiomatic Hindi construction and directly represents the Greek sense of treating this group as the prior group was treated.
  revised_text: क्रोध से भरकर उसने आदेश दिया कि इन लोगों के साथ भी ठीक उसी तरह, पूरी सावधानी से, व्यवहार किया जाए जैसा उन लोगों के साथ किया गया था, और इन्हें दिया जाने वाला दंड उन लोगों के दंड से किसी भी प्रकार कम न हो।
