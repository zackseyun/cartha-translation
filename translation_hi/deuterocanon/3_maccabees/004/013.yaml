translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक रूप अपनाया गया है। मूल यूनानी की असहज संरचना को मुख्य पाठ में स्पष्ट किया गया है, जबकि उसके संभावित अधिक शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
