  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: hi
  text: इसलिए इन लोगों का पंजीकरण[a] अत्यंत कड़ी तत्परता और उत्साहपूर्ण अतिरिक्त प्रयास के साथ, सूर्योदय से सूर्यास्त तक[b], किया जाता रहा; फिर भी चालीस दिनों तक यह काम पूरा न हो सका।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नामांकन” अथवा “सरकारी सूची में नाम दर्ज करना”; यूनानी शब्द किसी आधिकारिक प्रशासनिक सूचीकरण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सूरज के उदयों से उसके अस्तों तक”; यह दिन भर लगातार काम करने का मुहावरा है।
    reason: cultural_note
  - marker: c
    text: यूनानी अभिव्यक्ति का अर्थ है कि चालीस दिनों की अवधि में भी यह प्रक्रिया पूरी नहीं हुई।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: पंजीकरण
  rationale: यह शब्द किसी आधिकारिक प्रशासनिक सूची में नाम दर्ज करने की प्रक्रिया बताता है। ‘पंजीकरण’ इस अर्थ को स्पष्ट रखता है और ‘जनगणना’ की अपेक्षा कम विशिष्ट है।
- source_word: πικρᾶς σπουδῆς
  choice: बड़ी कठोर तत्परता
  rationale: σπουδή में शीघ्रता, तत्परता और गंभीर प्रयास के भाव हैं, जबकि πικρά इस दमनकारी प्रक्रिया की कठोरता और कष्टदायक तीव्रता प्रकट करता है।
- source_word: φιλοτίμου προσθεσίας
  choice: उत्साही परिश्रम
  rationale: दुर्लभ पदबंध अतिरिक्त, जोशीले और प्रतिष्ठा-प्रेरित प्रयास की ओर संकेत करता है। ‘उत्साही परिश्रम’ स्वाभाविक हिन्दी में उसकी तीव्रता रखता है, पर अधिकारियों की मनोवृत्ति के बारे में अनावश्यक नकारात्मक निष्कर्ष नहीं जोड़ता।
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: सूर्योदय से सूर्यास्त तक
  rationale: यहाँ अभिव्यक्ति भौगोलिक दिशा नहीं, बल्कि दिन भर लगातार किए गए काम का समयसूचक मुहावरा है।
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος
  choice: यह काम पूरा न हो सका
  rationale: यूनानी पदबंध का आशय है कि प्रक्रिया अपने अंत या पूर्णता तक नहीं पहुँची। हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: ἐπὶ ἡμέρας τεσσεράκοντα
  choice: चालीस दिनों तक
  rationale: यह अवधि बताता है, जिसके दौरान पंजीकरण अधूरा रहा।
