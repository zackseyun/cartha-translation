- source_word: γόων
  choice: विलाप
  rationale: यह दुःख की मुखर अभिव्यक्ति को दर्शाता है और ‘शोक’ के साथ अर्थपूर्ण युग्म बनाता है।
- source_word: ἐπʼ αὐτοῖς
  choice: उनके लिए
  rationale: पूर्वसर्ग यहाँ शोक के व्यक्तियों या उसके कारण को सूचित करता है; ‘उनके लिए’ हिन्दी में शोक के विषय को सहजता से व्यक्त करता है।
- source_word: οὐκ ἐνεπιπλῶντο
