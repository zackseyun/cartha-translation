  rationale: अपूर्ण भूतकालीन कर्मवाच्य भरते जाने या भरे होने का चित्र देता है; नकारात्मक आलंकारिक प्रश्न को हिन्दी में स्वाभाविक बनाने के लिए संभावनार्थक रूप अपनाया गया है।
