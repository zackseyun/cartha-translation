base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: hi
  text: और उनके संबंधी, यौवन की पूरी उमंग में होते हुए भी, फूलों के हारों के बदले अपने गलों में फंदे डाले हुए, विवाह-उत्सवों के शेष दिन भोज और युवावस्था की निश्चिंतता के बदले विलाप में बिताते रहे, और अधोलोक को पहले ही अपने पैरों के पास पड़ा हुआ देखते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγγενεῖς
  choice: संबंधी
  rationale: यह व्यापक और स्वाभाविक शब्द रक्त या पारिवारिक संबंध रखने वालों को दर्शाता है और केवल पुरुष संबंधियों तक अर्थ को सीमित नहीं करता।
- source_word: βρόχους
  choice: फंदे
  rationale: यह केवल रस्सियों या डोरियों का नहीं, गले में कसने वाले फंदों का भयावह बिंब है; इससे विवाह के फूलों के हारों के साथ तीखा विरोध सुरक्षित रहता है।
- source_word: ὡς ἀντὶ στεφέων
  choice: फूलों के हारों के बदले
  rationale: विवाह के उत्सवी संदर्भ में στεφάνοι के लिए 'फूलों के हार' स्वाभाविक हिन्दी है और विडंबनापूर्ण अदला-बदली को स्पष्ट रखता है।
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: अपने गलों में फंदे लपेटे हुए थे
  rationale: यह गलों को घेरे हुए फंदों की ठोस शारीरिक छवि को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: यौवन की पूरी उमंग में होते हुए भी
  rationale: वाक्यांश युवावस्था की परिपक्व शक्ति और उत्कर्ष पर बल देता है; 'होते हुए भी' आगे के शोकपूर्ण विरोध को स्वाभाविक बनाता है।
- source_word: εὐωχίας
  choice: भोज
  rationale: विवाह के प्रसंग में यह उत्सवी खाने-पीने और दावत को सूचित करता है; 'भोज' संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी है।
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: युवावस्था की निश्चिंतता
  rationale: यहाँ अर्थ युवावस्था के बेफिक्र आराम या उल्लास का है; यह चयन नैतिक आलस्य का अनावश्यक आरोप लगाए बिना विरोध को बनाए रखता है।
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: अपने विवाह-उत्सवों के शेष दिन
  rationale: γάμοι यहाँ विवाह की अमूर्त अवस्था से अधिक कई दिनों तक चलने वाले विवाह-उत्सवों को दर्शाता है।
- source_word: ἐν θρήνοις διῆγον
  choice: विलाप में बिताए
  rationale: यह समय बिताने की यूनानी अभिव्यक्ति और मुखर शोक-विलाप, दोनों को संक्षेप में व्यक्त करता है।
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: अधोलोक को पहले ही अपने पैरों के पास पड़ा देख रहे थे
  rationale: यह Ἅιδης को सामान्य 'मृत्यु' में समतल किए बिना मृतकों के लोक की सजीव छवि और निकट आते विनाश, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἅδην का अनुवाद
  choice: अधोलोक
  alternative: मृत्यु; कब्र
  rationale: यूनानी पाठ स्पष्ट रूप से Ἅιδης का प्रयोग करता है। 'अधोलोक' मृतकों के लोक की छवि को बनाए रखता है और इसे अंतिम दंड के किसी अधिक विशिष्ट सिद्धांत के साथ नहीं मिलाता; 'मृत्यु' या 'कब्र' प्रसंगानुकूल व्याख्यात्मक विकल्प हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि हार और फंदे, भोज और विलाप, तथा यौवन और आसन्न मृत्यु के मूल विरोध सुरक्षित रखे गए हैं।
