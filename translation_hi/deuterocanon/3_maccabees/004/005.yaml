translation:
  language: hi
  text: क्योंकि एक वृद्ध पुरुष को ले जाया जा रहा था—उसका सिर सफेद बालों से भरा था और बुढ़ापे से पैरों में आई शिथिलता के कारण वह झुका हुआ था। गिर पड़ने के हिंसक आवेग में, हर प्रकार की मर्यादा की परवाह किए बिना, वह तेज़ चाल अपनाए हुए था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγετο
  choice: ले जाया जा रहा था
  rationale: अपूर्णकालीन कर्मवाच्य रूप दृश्य में जारी क्रिया को व्यक्त करता है। यह अनुवाद बलपूर्वक आगे बढ़ाए जाने की संभावना बनाए रखता है, पर कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: γέρων πλήρης πολιᾶς
  choice: एक वृद्ध… उसके बाल पूरी तरह सफेद हो चुके थे
  rationale: γέρων यहाँ किसी पदाधिकारी नहीं, वृद्ध पुरुष को दर्शाता है; πλήρης πολιᾶς उसकी वृद्धावस्था के प्रत्यक्ष चिह्न, सफेद बालों, पर बल देता है।
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  choice: बुढ़ापे के कारण पैरों में आई शिथिलता
  rationale: νωθρίτης में सुस्ती, जड़ता और दुर्बलता का भाव है। शारीरिक संदर्भ में ‘शिथिलता’ इस अर्थ-क्षेत्र को संक्षेप में सुरक्षित रखता है।
- source_word: ἐπικύφων
  choice: वह झुका हुआ था
  rationale: यह कृदंत वृद्ध की आगे को झुकी या कुबड़ी देह-मुद्रा का स्पष्ट चित्र देता है।
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: हिंसक धक्कों से गिराते-पड़ाते हुए
  rationale: यूनानी पदबंध संक्षिप्त और कठिन है, पर इसमें हिंसक आवेग तथा गिरने या उलट दिए जाने का भाव है। हिंदी में यह अभिव्यक्ति उस कठोर व्यवहार को स्वाभाविक ढंग से चित्रित करती है, जबकि टिप्पणी में अनिश्चितता स्पष्ट की गई है।
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: किसी भी मर्यादा का तनिक विचार किए बिना
  rationale: αἰδώς लज्जा, संकोच, सम्मान या उचित मर्यादा का बोध करा सकता है। यहाँ वृद्ध के प्रति हर प्रकार की शालीनता और सम्मान की उपेक्षा संदर्भ के अनुकूल है; ἁπάσης की व्यापकता ‘किसी भी… तनिक’ से बनी रहती है।
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: तेज़ गति से चलने को विवश किया जा रहा था
  rationale: यह वाक्यांश वृद्ध की दशा के विपरीत उस पर थोपी गई अस्वाभाविक तेज़ चाल का भाव देता है। व्याकरणिक रूप को अधिक शब्दशः ‘तेज़ यात्रा का सहारा लेते हुए’ भी समझा जा सकता है, इसलिए विकल्प टिप्पणी में सुरक्षित है।
