base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: hi
  text: क्योंकि नगर-नगर के सेनानायक निर्दयी मन की कटुता के साथ एकमत होकर उन्हें बाहर भेज रहे थे[a], यहाँ तक कि उन असाधारण दंडों के अतिरिक्त, उनके शत्रुओं में से भी कुछ लोग साझी मानवीय करुणा को अपनी आँखों के सामने देखकर और उनके जीवन के अनिश्चित अंत पर विचार करके, उनके अत्यंत दयनीय निर्वासन पर रो पड़ते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें निकाल रहे थे’ अथवा ‘उन्हें निर्वासित कर रहे थे।’ यूनानी क्रिया का शाब्दिक अर्थ ‘बाहर भेजना’ है, लेकिन प्रसंग में यह बलपूर्वक हटाया जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: निर्दय मन की कटुता से
  rationale: यह अभिव्यक्ति भीतर की निर्मम और कठोर मनोवृत्ति बताती है। ‘मन’ ψυχή के भावगत अर्थ को और ‘निर्दय’ ἄνοικτος को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ κατὰ πόλιν στρατηγοί
  choice: नगर-नगर के सेनानायक
  rationale: στρατηγός सैन्य अथवा नागरिक अधिकार रखनेवाले अधिकारी के लिए प्रयुक्त हो सकता है। ‘सेनानायक’ मूल पद के निकट है, जबकि ‘नगर-नगर के’ उनके स्थानीय अधिकार-क्षेत्र को बनाए रखता है।
- source_word: ὁμοθυμαδόν
  choice: एकमत होकर
  rationale: यह क्रिया-विशेषण सामूहिक सहमति और समन्वित कार्रवाई पर बल देता है; केवल ‘एक साथ’ की अपेक्षा ‘एकमत होकर’ यह अर्थ अधिक स्पष्ट रखता है।
- source_word: ἐξαπεστέλλοντο
  choice: उन्हें वहाँ से भेज रहे थे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बाहर/दूर भेजना’ है। अपूर्ण भूतकाल निरंतर चल रही कार्रवाई बताता है; प्रसंग में यह बलपूर्वक निष्कासन है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: उन असाधारण दंडों के अतिरिक्त
  rationale: ἐπί को यहाँ योगात्मक अर्थ में लिया गया है और ἐξάλλοις को ऐसे दंडों के रूप में जो सामान्य सीमा से बाहर, अत्यधिक या असाधारण थे।
- source_word: τὸν κοινὸν ἔλεον
  choice: वही करुणा ... जो सभी मनुष्यों को समान रूप से द्रवित करती है
  rationale: κοινός यहाँ सामान्य मानवीय सहभागिता की ओर संकेत करता है। हिन्दी वाक्यांश का विस्तार इस कठिन यूनानी अभिव्यक्ति को बोधगम्य बनाता है, बिना इसे किसी विशिष्ट धार्मिक धारणा में बदलने के।
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: उनके जीवन के अनिश्चित अंत
  rationale: ἄδηλος अनदेखे या अनिश्चित को और καταστροφή पलटाव, विनाश अथवा अंत को व्यक्त कर सकता है। प्रसंग में निर्वासितों की अज्ञात लेकिन संकटपूर्ण परिणति अभिप्रेत है; ‘अनिश्चित अंत’ इस अस्पष्टता को बनाए रखता है।
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: उनके अत्यंत दयनीय निर्वासन
  rationale: ἐξαποστολή पहले प्रयुक्त ‘भेजने’ वाली क्रिया का संज्ञा-रूप है, पर प्रसंग में यह बलपूर्वक देश-निकाला है। ‘निर्वासन’ हिन्दी में इस वास्तविकता को स्वाभाविक रूप से व्यक्त करता है और ‘अत्यंत दयनीय’ δυσάθλιος की तीव्रता रखता है।
