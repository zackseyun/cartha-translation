    rationale: τὸν κοινὸν ἔλεον denotes common/shared pity or compassion; the Greek does not identify it as a visible scene, nor does it say that all humans were equally moved by it.
  - severity: low
    issue: “उन्हें वहाँ से भेज रहे थे” introduces “वहाँ से.”
