base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: hi
  text: जब उन्हें नीचे ‘स्केदिया’ कहलाने वाले स्थान तक लाया गया और जलमार्ग की यात्रा पूरी हो गई—जैसा राजा ने आदेश दिया था—तब उसने उन्हें नगर के सामने स्थित घुड़दौड़ के मैदान[a] में डेरा डालने का आदेश दिया। वह एक खुला स्थान था, जो उन्हें सबके सामने उदाहरण बनाने के लिए अत्यंत उपयुक्त था और नगर में नीचे की ओर आने वाले सभी लोगों तथा वहाँ से देहात की यात्रा पर भेजे जाने वालों की पूरी दृष्टि में था। इसका उद्देश्य यह था कि वे न तो उसकी सेनाओं के संपर्क में आएँ और न ही उन्हें किसी घिरे हुए अहाते के योग्य समझा जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का लिप्यंतरण ‘हिप्पोड्रोम’ है; यह विशेष रूप से घोड़ों की दौड़ के लिए बने मैदान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का संभावित आशय यह है कि उन्हें राजा की सेनाओं से अलग रखा जाए और रहने या सुरक्षा के लिए उचित घिरा हुआ परिसर भी न दिया जाए। यूनानी वाक्यरचना कुछ कठिन है।
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: Πότιον δὲ
  choice: जब … तब
  rationale: आरंभिक रूप पाठगत दृष्टि से कठिन है; इसके बाद आए संबंधवाचक कृदंतों के साथ स्वाभाविक हिन्दी कालवाचक रचना अपनाई गई है, बिना किसी अधिक विशिष्ट अर्थ को निश्चित किए।
- source_word: τὴν λεγομένην Σχεδίαν
  choice: ‘स्केदिया’ कहलाने वाले स्थान
  rationale: स्थाननाम को देवनागरी में लिप्यंतरित किया गया और λεγομένην का अर्थ स्पष्ट रखा गया है।
- source_word: ἀχθέντων
  choice: नीचे … लाया गया
  rationale: कर्मवाच्य में ले जाए जाने का अर्थ तथा संदर्भ में निहित दिशासूचक भाव दोनों सुरक्षित रखे गए हैं।
- source_word: τὸ παράπλου περαθέντος
  choice: जलमार्ग की यात्रा पूरी हो गई
  rationale: παράπλους जल या तट के सहारे की गई यात्रा को सूचित करता है और περαθέντος उसके पूरा होने को।
- source_word: δεδογματισμένον
  choice: आदेश दिया था
  rationale: पूर्ण कर्मवाच्य रूप राजा के पहले से किए गए आधिकारिक निर्णय या आदेश को दर्शाता है; आधुनिक हिन्दी में ‘आदेश’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἱπποδρόμῳ
  choice: घुड़दौड़ के मैदान
  rationale: ऐतिहासिक यूनानी स्थल का कार्य सामान्य हिन्दी पाठक के लिए सीधे स्पष्ट होता है; ‘हिप्पोड्रोम’ को पादटिप्पणी में दिया गया है।
- source_word: παρεμβαλεῖν
  choice: डेरा डालने
  rationale: क्रिया किसी समूह को शिविर में ठहराने या डेरा डलवाने का भाव रखती है।
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: एक खुला स्थान
  rationale: यूनानी वाक्यांश कठिन है, पर संदर्भ इसे सुरक्षित घिरे हुए स्थान के विपरीत एक खुले और उजागर परिसर के रूप में प्रस्तुत करता है।
- source_word: πρὸς παραδειγματισμὸν
  choice: सबके सामने उदाहरण बनाने
  rationale: यह सार्वजनिक अपमान या दंड के द्वारा दूसरों के लिए उदाहरण बनाने का भाव व्यक्त करता है; हिन्दी में दोनों पहलू निहित रहते हैं।
- source_word: ἄγαν εὐκαιροτάτῳ
  choice: अत्यंत उपयुक्त
  rationale: ἄγαν और अतिशयोक्तिपरक रूप द्वारा व्यक्त प्रबल उपयुक्तता को बनाए रखा गया है।
- source_word: καταπορευομένοις
  choice: नीचे की ओर आने वाले
  rationale: κατα- में निहित दिशासूचक ‘नीचे’ को सुरक्षित रखा गया है, यद्यपि हिन्दी में यह स्थानगत विवरण कुछ असामान्य सुनाई देता है।
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: यात्रा पर भेजे जाने वालों
  rationale: कर्मवाच्य ‘भेजे जाने’ और घर या नगर से बाहर यात्रा करने—दोनों भाव रखे गए हैं।
- source_word: τὸ σύνολον καταξιῶσαι περιβόλῳ
  choice: न ही उन्हें किसी घिरे हुए अहाते के योग्य समझा जाए
  rationale: τὸ σύνολον का पूर्ण निषेध ‘न ही’ से व्यक्त है; καταξιῶσαι और περιβόλῳ के कठिन संबंध को अधिक स्पष्ट किए बिना मूल की अपमानजनक धारणा बनाए रखी गई है।
