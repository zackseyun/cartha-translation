  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है। ‘स्केदिया’ का लिप्यंतरण किया गया है, जबकि ἱππόδρομος का अर्थ मुख्य पाठ में सामान्य पाठक के लिए स्पष्ट किया गया है। मूल में विद्यमान दिशासूचक ‘नीचे’ और अंतिम वाक्यांश की अनिश्चितता को मिटाया नहीं गया है।
