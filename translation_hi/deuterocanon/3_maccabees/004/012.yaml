  text: जब यह हुआ, तब यह सुनकर कि उसके स्वजातीय लोग नगर से छिपकर बाहर निकल रहे थे और अपने भाइयों की दुर्दशा[a] के कारण अधिक बार चुपके से खिसक रहे थे[c][b],
