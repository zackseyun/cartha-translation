lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: जब यह हुआ, तब
  rationale: यह पदबंध समय-सूचक संक्रमण है। δέ को यहाँ प्रबल विरोध के रूप में नहीं, बल्कि स्वाभाविक कथात्मक जोड़ के रूप में व्यक्त किया गया है।
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: एओरिस्ट कृदंत को हिन्दी में स्वाभाविक पूर्वकालिक क्रिया के रूप में रखा गया है। यूनानी में कर्ता संदर्भ से समझा जाता है, इसलिए हिन्दी में भी उसे स्पष्ट नाम देकर नहीं जोड़ा गया।
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: नगर के उसके स्वजातीय लोग
  rationale: ὁμοεθνεῖς समान जातीय या राष्ट्रीय समुदाय के लोगों को दर्शाता है। ‘स्वजातीय’ इस सामुदायिक संबंध को संक्षेप और गरिमा के साथ व्यक्त करता है; ‘उसके’ संदर्भगत संबंध को स्पष्ट करता है।
- source_word: κρυβῇ ἐκπορευομένους
  choice: छिपकर बाहर निकल रहे थे
  rationale: κρυβῇ क्रियाविशेषण रूप में गुप्त ढंग से निकलने का भाव देता है, और ἐκπορευομένους जारी गतिविधि का वर्णन करता है।
- source_word: πυκνότερον
  choice: अधिक बार
  rationale: इस प्रसंग में तुलनात्मक क्रियाविशेषण का सर्वाधिक स्वाभाविक अर्थ बढ़ती आवृत्ति है, न कि भौतिक घनत्व।
- source_word: ὑποδιδράσκειν
  choice: बचकर भाग रहे थे
  rationale: यह क्रिया चोरी-छिपे खिसकने या बच निकलने का भाव रखती है। हिन्दी पदबंध पलायन और गुप्तता दोनों का संकेत देता है।
- source_word: τὴν ἰχθεῖ τῶν ἀδελφῶν ταλαιπωρίαν
  choice: अपने भाइयों की दुर्दशा के कारण
  rationale: पाठ में ἰχθεῖ कठिन और संदिग्ध है। पूरे उपवाक्य और प्रसंग से भाइयों के कष्ट को गुप्त पलायन का कारण समझना सबसे संगत है; इसीलिए अर्थ को सहज हिन्दी में व्यक्त किया गया है और कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: τῶν ἀδελφῶν
  choice: अपने भाइयों
  rationale: ‘भाइयों’ मूल के संबंध और सामुदायिक एकजुटता के भाव को बनाए रखता है; ‘अपने’ हिन्दी में उनका संबंध स्वाभाविक रूप से स्पष्ट करता है।
