- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: क्योंकि ... स्थिति असंभव हो गई थी
  rationale: ὡς का सम्भावित कारणवाचक बल ‘क्योंकि’ से और καθεστῶτος की परिणत अवस्था ‘हो गई थी’ से व्यक्त की गई है; निहित विषय को ‘स्थिति’ कहकर स्पष्ट किया गया है।
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
