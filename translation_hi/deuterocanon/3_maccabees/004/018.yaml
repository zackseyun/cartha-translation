  rationale: ἐπ᾽ Αἴγυπτον अधिकार अथवा नियुक्ति का संकेत देता है; ‘मिस्र पर नियुक्त’ केवल भौगोलिक उपस्थिति कहने से अधिक सटीक है, और στρατηγοῖς के लिए ‘सेनापति’ उपयुक्त है।
