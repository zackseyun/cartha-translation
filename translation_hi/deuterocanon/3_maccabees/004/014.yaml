  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: hi
  text: और यह भी कि सारे जनसमुदाय को नाम-नाम से दर्ज किया जाए[a]—पहले से बताई गई, उनके काम के अनुरूप थोड़े समय की सेवा[b] के लिए नहीं, बल्कि आदेशित क्रूरताओं से उन्हें यातना देकर एक ही दिन के भीतर उनका पूरी तरह नाश कर दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् एक-एक व्यक्ति को नाम सहित दर्ज किया जाए।
    reason: lexical_alternative
  - marker: b
    text: पहले बताए गए उद्देश्य से संबंधित यूनानी पदबंध कठिन है। संभवतः थोड़े समय की श्रम-सेवा को पंजीकरण का बहाना बताया गया था, जबकि वास्तविक योजना पूरे समुदाय का नाश करना थी।
    reason: textual_or_cultural_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: नाम दर्ज किए जाएँ
  rationale: यह क्रिया आधिकारिक पंजीकरण या सूची में नाम लिखने का बोध कराती है; आधुनिक हिन्दी में यह प्रशासनिक अर्थ स्वाभाविक ढंग से व्यक्त होता है।
- source_word: πᾶν τὸ φῦλον
  choice: पूरे जनसमुदाय
  rationale: संदर्भ में यह एक गोत्र मात्र नहीं, बल्कि समूचे यहूदी लोगों को सामूहिक रूप से दर्शाता है। ‘जनसमुदाय’ आधुनिक राष्ट्र-राज्य या जाति-व्यवस्था का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἐξ ὀνόματος
  choice: लोगों के नाम
  rationale: वाक्यांश का बल व्यक्तियों को नाम सहित दर्ज करने पर है। हिन्दी में बहुवचन ‘लोगों के नाम दर्ज किए जाएँ’ यह वितरणात्मक अर्थ सहज रूप से देता है।
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην
  choice: पहले से बताई गई ... थोड़े समय की
  rationale: यह पहले घोषित या सूचित किए गए अल्पकालिक उद्देश्य और वास्तविक विनाशकारी योजना के बीच विरोध दिखाता है। मूल पदबंध कठिन है, इसलिए अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: उनके काम के अनुरूप ... सेवा
  rationale: λατρεία यहाँ सेवा को और τῶν ἔργων κατὰ τρόπον काम या निर्धारित कार्य के अनुरूप सेवा को सूचित करता है; धार्मिक उपासना का अर्थ इस संदर्भ में उपयुक्त नहीं है।
- source_word: στρεβλούμεντας
  choice: उन्हें यातना देकर
  rationale: क्रिया का अर्थ मरोड़कर या यातना-यंत्र पर चढ़ाकर सताना हो सकता है। ‘यातना देकर’ अर्थ को स्पष्ट रखता है, पर किसी ऐसे विशिष्ट उपकरण का उल्लेख नहीं करता जिसे पाठ निश्चित नहीं करता।
- source_word: παρηγγελμέναις αἰκίαις
  choice: आदेश दिए गए अत्याचारों से
  rationale: दत्तिव पदबंध उन क्रूर अत्याचारों को दर्शाता है जिन्हें आधिकारिक रूप से करने का आदेश दिया गया था।
- source_word: τὸ τέλος ἀφανίσαι
  choice: पूरी तरह नाश कर दिया जाए
  rationale: ἀφανίσαι मिटा देने या नष्ट करने का और τὸ τέλος पूर्णता का बल देता है; संयुक्त अनुवाद संपूर्ण विनाश व्यक्त करता है।
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: एक ही दिन के भीतर
  rationale: वाक्यांश विनाश को एक दिन की सीमित अवधि या नियत अवसर में पूरा करने की बात कहता है। यह हिन्दी रूप समय की तीव्र संकुचितता को स्वाभाविक ढंग से व्यक्त करता है।
