  yaml_path: translation/deuterocanon/3_maccabees/004/017.yaml
  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
translation:
  language: hi
  text: परन्तु पहले बताया गया समय बीत जाने के बाद, लिपिकों ने राजा को सूचना दी कि यहूदियों की अनगिनत संख्या के कारण अब उनका पंजीकरण[a] करना सम्भव नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदियों की जनगणना’। यूनानी शब्द ἀπογραφή का अर्थ पंजीकरण, नामांकन या जनगणना हो सकता है; यहाँ व्यापक प्रशासनिक अर्थ के कारण ‘पंजीकरण’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: परन्तु ... बीत जाने के बाद
  rationale: μετά समयगत क्रम को और δέ हल्के संक्रमण अथवा विरोध को व्यक्त करता है; हिन्दी में यह संयोजन कथा के मोड़ को स्वाभाविक रूप से दिखाता है।
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: पहले बताया गया समय
  rationale: προειρημένον पहले कही गई बात की ओर लौटता है और διάστημα समय की अवधि को दर्शाता है। ‘समय बीत जाने के बाद’ हिन्दी में पूरे पद का सहज अर्थ देता है।
- source_word: προσηγγέλλον
  choice: सूचना दी
  rationale: यह राजकीय अधिकारियों द्वारा राजा को औपचारिक रूप से बताने का भाव देता है। यूनानी अपूर्णकाल जारी या बार-बार की गई सूचना का संकेत दे सकता है, पर इस प्रसंग में हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: οἱ γραμματεῖς
  choice: लिपिकों
  rationale: यहाँ γραμματεῖς प्रशासनिक लेखा और अभिलेख रखने वाले अधिकारी हैं; ‘लिपिक’ आधुनिक हिन्दी में इस भूमिका को ‘शास्त्री’ की धार्मिक छाया के बिना स्पष्ट करता है।
- source_word: μηκέτι ἰσχύειν
  choice: अब ... सम्भव नहीं था
  rationale: μηκέτι ‘अब और नहीं’ तथा ἰσχύειν यहाँ सामर्थ्य या व्यावहारिक सम्भवता व्यक्त करता है।
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: यहूदियों का पंजीकरण करना
  rationale: ἀπογραφή पंजीकरण, नामांकन या जनगणना को सूचित कर सकता है। ‘पंजीकरण’ व्यापक प्रशासनिक अर्थ को सुरक्षित रखता है, जबकि ποιεῖσθαι कार्य को सम्पन्न करने का भाव देता है।
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: यहूदियों की अनगिनत संख्या के कारण
  rationale: διά कारण बताता है; ἀμέτρητον और πληθύς मिलकर इतनी बड़ी संख्या का भाव देते हैं जिसे गिना न जा सके। ‘अनगिनत संख्या’ इस अतिशयोक्तिपूर्ण बल को सरल हिन्दी में बनाए रखती है।
