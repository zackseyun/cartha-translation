base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: hi
  text: जहाँ-जहाँ यह राजाज्ञा पहुँची, वहाँ गैर-यहूदी लोगों के बीच सार्वजनिक भोज[a] का आयोजन हुआ, जिसमें ऊँचे स्वर और आनन्द की धूम थी। मानो उनके विरुद्ध वह बैर, जो बहुत पहले से उन लोगों के मन में उछल रहा था[b], अब बेधड़क खुलकर प्रकट हो रहा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सार्वजनिक भोज’ का अर्थ ऐसा उत्सवी भोज भी हो सकता है जिसका खर्च सार्वजनिक कोष से उठाया गया हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी शब्द असामान्य और सजीव है; उसमें बैर के पहले से ही मन में ‘उछलने’ या ‘कुलाँचे भरने’ का भाव है। इसका आशय भीतर पहले से सक्रिय शत्रुता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντῃ δὲ ὅπου προσέπιπτεν
  choice: जहाँ-जहाँ ... पहुँची
  rationale: यह स्वाभाविक हिन्दी में आज्ञा के प्रत्येक स्थान तक पहुँचने और वहाँ हुई प्रतिक्रिया के व्यापक दायरे को व्यक्त करता है।
- source_word: πρόσταγμα
  choice: राजाज्ञा
  rationale: प्रसंग में यह राजकीय आदेश है; ‘राजाज्ञा’ औपचारिकता और शासकीय अधिकार दोनों को स्पष्ट करती है।
- source_word: δημοτελὴς ... εὐωχία
  choice: सार्वजनिक भोज
  rationale: εὐωχία उत्सवी भोज को सूचित करता है और δημοτελής उसके सार्वजनिक अथवा नगर-व्यापी स्वरूप को; आर्थिक अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदी लोगों के बीच
  rationale: इस यहूदी कथानक में ἔθνη सामान्यतः यहूदियों से भिन्न जनसमुदाय को दर्शाता है। यह हिन्दी में ‘अन्यजातियों’ की अपेक्षा अधिक सहज और स्पष्ट है।
- source_word: μετὰ ἀλαλαγμῶν καὶ χαρᾶς
  choice: ऊँचे स्वर और आनन्द की धूम थी
  rationale: ἀλαλαγμός ऊँची सामूहिक पुकार या शोर को दर्शाता है। यह रूप उत्सव के कोलाहल को व्यक्त करता है, पर उसे केवल जयकार या युद्धघोष नहीं ठहराता।
- source_word: προκατεσκιρωμένης
  choice: बहुत पहले से ... उछल रहा था
  rationale: कठिन और सजीव कृदन्त में पहले से उछलने या कुलाँचे भरने का बिंब है। ‘उछल रहा था’ उस रूपक को बनाए रखता है और उसे केवल ‘पनप रहा था’ कहकर सपाट नहीं करता।
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: अब बेधड़क खुलकर प्रकट हो रहा हो
  rationale: παρρησία की निर्भीक खुली अभिव्यक्ति और ἐκφαίνω के भीतर छिपी बात के बाहर दिखाई देने—दोनों भावों को साथ रखा गया है।
theological_decisions:
- issue: τοῖς ἔθνεσιν का सामुदायिक अर्थ
  choice: गैर-यहूदी लोगों के बीच
  alternative: राष्ट्रों के बीच
  rationale: कथा का यहूदी और गैर-यहूदी समुदायों के बीच का विरोध इस अर्थ का समर्थन करता है, फिर भी इसे कोई धार्मिक पदवी या सम्प्रदायगत संज्ञा नहीं बनाया गया।
- issue: बैर के पूर्व से सक्रिय होने का रूपक
  choice: मन में उछल रहा था
  alternative: मन में पनप रहा था
  rationale: मूल के असामान्य, तनावपूर्ण बिंब को सुरक्षित रखा गया है; अधिक सामान्य विकल्प मूल की सजीवता को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘राजाज्ञा’ कथात्मक औपचारिकता बनाए रखती है; ‘आनन्द की धूम’ सामूहिक उत्सव का स्वाभाविक हिन्दी चित्र देती है। सर्वनामों को मूल के अनुरूप रखा गया है, ताकि पाठ में जिनके विरुद्ध बैर था उनकी पहचान संदर्भ से हो और अनावश्यक व्याख्यात्मक नाम न जोड़ा जाए।
