  yaml_path: translation/deuterocanon/3_maccabees/005/022.yaml
  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: hi
  text: और उन्होंने रात का समय सोने में उतना नहीं बिताया, जितना उन लोगों का, जो दयनीय प्रतीत होते थे, उपहास करने के हर प्रकार के उपाय गढ़ने में[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन दयनीय प्रतीत होने वाले लोगों के लिए हर प्रकार के उपहास गढ़ने में।” ‘प्रतीत होते थे’ दयनीयता को वर्णनकर्ता का निश्चित निर्णय न बनाकर देखने वालों की दृष्टि में उपस्थित रूप के तौर पर रखता है।
    reason: δοκοῦσιν के दृष्टिकोण-सूचक भाव तथा τοῖς ταλαιπώροις के साथ दत्तिव के संभव संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: κατεχρίζαντο
  choice: बिताया
  rationale: रात के समय को किसी कार्य में लगाने या गुज़ारने का भाव यहाँ स्वाभाविक हिन्दी में ‘बिताया’ से व्यक्त होता है।
- source_word: οὐχ οὕτως ... ὡς
  choice: उतना नहीं ... जितना
  rationale: यह तुलनात्मक विरोध को स्पष्ट रखते हुए यूनानी रचना का स्वाभाविक हिन्दी समतुल्य है।
- source_word: εἰς ὕπνον
  choice: सोने में
  rationale: यह बताता है कि रात का समय किस काम में लगाया गया; ‘सोने में’ सरल और स्वाभाविक है।
- source_word: παντοίως
  choice: हर तरह से
  rationale: क्रियाविशेषण का व्यापक भाव सुरक्षित रहता है और इसे केवल उपहास के प्रकारों तक सीमित नहीं किया जाता।
- source_word: μηχανᾶσθαι
  choice: युक्तियाँ सोचने में
  rationale: यह जानबूझकर उपाय गढ़ने या योजना बनाने का भाव व्यक्त करता है, बिना अनावश्यक रूप से षड्यंत्र का अधिक प्रबल अर्थ जोड़े।
- source_word: τοῖς ταλαιπώροις
  choice: उन बेचारे लोगों का
  rationale: संदर्भ में ये उपहास के पीड़ित हैं। हिन्दी में ‘उपहास करना’ के साथ संबंधकारक स्वाभाविक है; ‘बेचारे’ उनकी दयनीय समझी गई दशा और तिरस्कारपूर्ण दृष्टि दोनों को वहन कर सकता है।
- source_word: δοκοῦσιν
  choice: समझे गए
  rationale: मुख्य पाठ की स्वाभाविकता के लिए यह भाव ‘बेचारे’ में निहित है; पादटिप्पणी स्पष्ट करती है कि दयनीयता देखने वालों की दृष्टि से है।
- source_word: ἐμπαιγμούς
  choice: उपहास
  rationale: यह हँसी उड़ाने, तिरस्कार और अपमानजनक खिल्ली के सामूहिक भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
