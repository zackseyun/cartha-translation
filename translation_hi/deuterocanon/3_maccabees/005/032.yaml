  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: hi
  text: फिर भी, यदि एकत्र होने से उत्पन्न स्नेह और आवश्यकता के कारण ऐसा न होता, तो इनके बदले तुम जीवन से वंचित कर दिए जाते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: फिर भी, यदि ... न होता
  rationale: καίπερ का रियायती भाव और εἰ μή की निषेधात्मक शर्त, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διὰ
  choice: के कारण
  rationale: Accusative के साथ διὰ यहाँ कारण या आधार बताता है।
- source_word: τὴν τῆς συστροφῆς στοργὴν
  choice: साथ रहने से उपजे स्नेह
  rationale: στοργή स्नेह या आत्मीय लगाव है; συστροφή का अर्थ साथ रहना, मेल-जोल या एकत्र होना हो सकता है। प्रसंग में ‘साथ रहने से उपजा स्नेह’ सम्बन्धगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे औपचारिक सभा मानने के।
- source_word: καὶ τῆς χρείας
  choice: और तुम्हारी उपयोगिता
  rationale: χρεία आवश्यकता, उपयोग या उपयोगिता का बोध करा सकता है। यहाँ सम्बोधित व्यक्ति को जीवित छोड़ने के आधार के रूप में ‘उपयोगिता’ प्रसंगानुकूल है; अन्तर्निहित सम्बन्धसूचक भाव को हिन्दी में ‘तुम्हारी’ से स्पष्ट किया गया है।
- source_word: τὸ ζῆν
  choice: जीवन
  rationale: Articular infinitive का आशय जीवित रहना है; ‘जीवन से वंचित’ हिन्दी में स्वाभाविक और मूल के गंभीर भाव के अनुरूप है।
- source_word: ἀντὶ τούτων
  choice: इनके बदले
  rationale: ἀντί प्रतिस्थापन या बदले का भाव रखता है। ‘इनके’ यूनानी संकेतवाचक की अस्पष्टता को बनाए रखता है और ‘चीज़ों’ या ‘लोगों’ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐστερήθης
  choice: वंचित कर दिए जाते
  rationale: Passive रूप और जीवन छीन लिए जाने की कठोरता, दोनों सुरक्षित रहते हैं।
