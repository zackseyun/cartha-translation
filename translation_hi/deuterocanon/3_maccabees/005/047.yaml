base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: hi
  text: पर वह अपने अधर्मी मन को प्रचंड क्रोध से भरकर, पूरा जोर लगाते हुए उन हिंसक पशुओं के साथ बाहर झपटा। वह संवेदनहीन हृदय[a] और अपनी आँखों की पुतलियों[b] से उन लोगों का कष्टपूर्ण और दयनीय विनाश देखना चाहता था, जिन्हें पहले से चिह्नित किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “न बिंधे हुए हृदय से।” सम्भवतः आशय ऐसे हृदय से है जिसे दया या करुणा छू न सकी हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी आँखों की पुतलियों से।” यह अभिव्यक्ति इस बात पर जोर देती है कि वह इसे स्वयं और प्रत्यक्ष रूप से देखना चाहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας δυσσεβῆ φρένα
  choice: अपने अधर्मी मन को प्रचंड क्रोध से भरकर
  rationale: यूनानी वाक्यांश में δυσσεβῆ φρένα γεμίσας का स्वाभाविक संबंध है—उसने अपने अधर्मी मन को भारी क्रोध से भर लिया। ‘प्रचंड क्रोध’ βαρείᾳ की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παντὶ τῷ βάρει
  choice: पूरा जोर लगाते हुए
  rationale: शाब्दिक अर्थ ‘पूरे भार के साथ’ है, पर प्रसंग में यह पूरे वेग या बल से आगे बढ़ने का भाव देता है।
- source_word: σὺν τοῖς θηρίοις
  choice: उन हिंसक पशुओं के साथ
  rationale: θηρία यहाँ दंड देने के लिए तैयार किए गए खतरनाक पशुओं को दर्शाता है; ‘हिंसक पशु’ इस भयावह संदर्भ को स्पष्ट रखता है।
- source_word: ἐξώρμησε
  choice: बाहर झपटा
  rationale: क्रिया अचानक और जोरदार ढंग से बाहर निकलने का बोध कराती है; ‘बाहर झपटा’ उसकी गति और हिंसक आवेग दोनों बनाए रखता है।
- source_word: ἀτρώτῳ καρδίᾳ
  choice: संवेदनहीन हृदय
  rationale: ἀτρώτος का शाब्दिक अर्थ ‘न बिंधा हुआ’ या ‘अघायल’ है। यहाँ आशय ऐसे हृदय से है जिसे करुणा छू न सके; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: κόραις ὀφθαλμῶν
  choice: अपनी आँखों की पुतलियों से
  rationale: यह यूनानी अभिव्यक्ति प्रत्यक्ष और व्यक्तिगत रूप से देखने पर जोर देती है। शाब्दिक बिंब को हिन्दी में सुरक्षित रखा गया है।
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν
  choice: कष्टपूर्ण और दयनीय विनाश
  rationale: दोनों विशेषण विपत्ति की पीड़ा और दयनीयता को अलग-अलग बनाए रखते हैं, बिना उन्हें एक ही सामान्य विशेषण में मिला देने के।
- source_word: τῶν προσεσημαμμένων
  choice: जिन्हें पहले से चिह्नित किया गया था
  rationale: पूर्ण कृदंत पहले किए जा चुके चिह्नांकन या नामांकन को दर्शाता है; ‘पहले से’ उस पूर्व स्थिति को स्पष्ट करता है।
theological_decisions:
- issue: δυσσεβῆ का नैतिक-धार्मिक अर्थ
  choice: अधर्मी
  alternative: दुष्ट / भक्तिहीन
  rationale: δυσσεβής केवल सामान्य दुष्टता नहीं, बल्कि ईश्वर के प्रति अनादर या अधर्म का भाव भी रखता है। ‘अधर्मी’ इस धार्मिक आयाम को बिना अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखता है।
- issue: ἀτρώτῳ καρδίᾳ में करुणा से अप्रभावित रहने का भाव
  choice: मुख्य पाठ में ‘संवेदनहीन हृदय’, पादटिप्पणी में शाब्दिक बिंब
  alternative: न बिंधे हुए हृदय / अघायल हृदय
  rationale: शाब्दिक रूप हिन्दी में अस्पष्ट या भ्रामक हो सकता है। ‘संवेदनहीन’ प्रसंगगत अर्थ देता है, जबकि पादटिप्पणी मूल की वास्तविक रूपकात्मक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। हिंसक गति, धार्मिक रूप से अधर्मी मानसिकता और विनाश को स्वयं देखने की क्रूर इच्छा को स्पष्ट रखा गया है। मूल यूनानी के असामान्य हृदय और दृष्टि-संबंधी बिंबों को मुख्य पाठ तथा पादटिप्पणियों के संतुलन से सुरक्षित किया गया है।
