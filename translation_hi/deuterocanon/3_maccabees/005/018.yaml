lexical_decisions:
- source_word: ἐπὶ πλεῖον δὲ προσκοπτούσης τῆς ὁμιλίας
  choice: पर जब बातचीत और भी लंबी खिंचने लगी
  rationale: प्रसंग में यह वाक्यांश बातचीत के बढ़ते जाने और उसमें बाधा या अप्रिय विलंब का भाव देता है। ‘लंबी खिंचने लगी’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν Ἕρμωνα προσκαλεσάμενος
  choice: हेरमोन को बुलवाया
  rationale: मध्यमवाच्य कृदन्त और राजकीय प्रसंग से आशय है कि राजा ने हेरमोन को अपने सामने बुलाया; ‘बुलवाया’ अधिकारपूर्ण आदेश का भाव रखता है।
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: कड़वी धमकी देते हुए
  rationale: यह अभिव्यक्ति पूछताछ के शत्रुतापूर्ण और कटु ढंग को सुरक्षित रखती है तथा यूनानी एकवचन ‘धमकी’ के निकट रहती है।
- source_word: τίνος ἕνεκεν αἰτίας
  choice: किस कारण
  rationale: यूनानी में कारण पर बल है; ‘किस कारण’ उस बल को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἰάθησαν
  choice: जीवित बच गए थे
  rationale: क्रिया का सामान्य अर्थ ‘चंगे किए गए’ है, पर यहाँ रोगमुक्ति नहीं बल्कि विनाश से बचे रहने की बात है। इसलिए प्रसंगानुकूल अर्थ चुना गया है, जबकि शाब्दिक कठिनाई पादटिप्पणी में दी गई है।
- source_word: τὴν περιοῦσαν ἡμέραν περιβεβιωκότες
  choice: नियत दिन बीत जाने पर भी जीवित बच गए थे
  rationale: संक्षिप्त और कठिन यूनानी वाक्यांश को उस दिन की सीमा पार कर जीवित रहने के रूप में समझा गया है जो उनके विनाश के लिए ठहराया गया था।
