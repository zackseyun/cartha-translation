  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: hi
  text: पर जब बातचीत और भी लंबी खिंचने लगी, तब राजा ने हेरमोन को बुलवाया और कटु धमकी देते हुए उससे पूछा कि किस कारण यहूदी नियत दिन बीत जाने पर भी जीवित बच गए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से संभव अनुवाद: “यहूदी चंगे किए गए/बचा लिए गए थे, उस शेष दिन से भी आगे जीवित रहने के बाद।” यूनानी वाक्य-विन्यास संक्षिप्त और कुछ कठिन है; यहाँ आशय उस नियत दिन के बीत जाने पर भी उनके जीवित रहने से लिया गया है।'
