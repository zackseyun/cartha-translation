translation:
  language: hi
  text: और नगर भर के जनसमूह उस सबसे दयनीय दृश्य[a] को देखने के लिए इकट्ठे हो चुके थे और बड़ी आतुरता से सुबह की प्रतीक्षा कर रहे थे।
  philosophy: optimal-equivalence
