    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πλήθη
  choice: भीड़
  rationale: बहुवचन πλήθη नगर के बहुत-से लोगों के जनसमूहों को सूचित करता है। हिन्दी में सामूहिक अर्थ वाला ‘भीड़’ स्वाभाविक है और अनेक लोगों के जुटने का भाव रखता है।
- source_word: κατὰ τὴν πόλιν
  choice: नगर भर की
  rationale: κατά यहाँ नगर के विभिन्न भागों में फैले जनसमूह का वितरण सूचित करता है; ‘नगर भर की’ इस व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: συνῄθροιστο
  choice: इकट्ठी हो रही थी
  rationale: इस अपूर्णकालीन रूप में जारी प्रक्रिया का भाव है; इसलिए ‘हो रही थी’ केवल पूर्ण हो चुके जमाव के बजाय निरन्तर एकत्र होने को दर्शाता है।
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: उस अत्यन्त करुणाजनक दृश्य के लिए
  rationale: οἰκτρότατην करुणा जगाने वाली चरम दशा व्यक्त करता है, जबकि θεωρία देखे जाने वाले दृश्य अथवा उसे देखने की क्रिया—दोनों का अर्थ दे सकता है। मुख्य पाठ में ‘दृश्य’ स्वाभाविक है और पादटिप्पणी दूसरी सम्भावना सुरक्षित रखती है।
- source_word: προσδοκῶντα
  choice: प्रतीक्षा कर रही थी
  rationale: कृदन्त आने वाले समय की अपेक्षा और प्रतीक्षा व्यक्त करता है; ‘प्रतीक्षा’ सुबह के साथ सहज बैठता है।
- source_word: τὴν πρωίαν
  choice: सुबह
  rationale: यह सामान्यतः प्रातःकाल को सूचित करता है; ‘सुबह’ वर्तमान मानक हिन्दी में सीधा और स्वाभाविक है तथा इसे अनावश्यक रूप से ठीक भोर तक सीमित नहीं करता।
- source_word: μετὰ σπουδῆς
  choice: बड़ी उत्सुकता से
  rationale: यह पद तत्परता, लगन या आतुरता का भाव देता है। यहाँ ‘बड़ी उत्सुकता से’ भीड़ की तीव्र प्रतीक्षा को व्यक्त करता है, बिना उसे नैतिक स्वीकृति का रंग दिए।
