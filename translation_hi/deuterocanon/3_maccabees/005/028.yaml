base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/028.yaml
  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: hi
  text: पर यह उस परमेश्वर की कार्यवाही थी, जो सब पर प्रभुता रखता है और जिसने उन लोगों के मन में विस्मृति डाल दी थी, जिन्होंने पहले उसके विरुद्ध षड्यंत्र रचा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “उसके विरुद्ध” एकवचन है। प्रसंग में इसका संदर्भ परमेश्वर हो सकता है; लक्षित यहूदी समुदाय के लिए सामूहिक अर्थ भी संभव समझा गया है।
    reason: मूल सर्वनाम के एकवचन रूप और उसके संदर्भ की व्याख्यात्मक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐνέργεια
  choice: कार्य
  rationale: यह शब्द परमेश्वर की सक्रिय और प्रभावकारी क्रिया को दर्शाता है। ‘कार्य’ आधुनिक हिन्दी में सहज है और केवल निष्क्रिय परिणाम का भाव नहीं देता।
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: सब पर प्रभुता रखने वाले परमेश्वर का
  rationale: δεσποτεύω सार्वभौम अधिकार और शासन व्यक्त करता है। ‘प्रभुता रखने वाला’ उसके व्यापक अधिकार को गरिमापूर्ण और स्पष्ट हिन्दी में रखता है।
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: उन लोगों के, जिन्होंने पहले उनके विरुद्ध षड्यंत्र रचा था
  rationale: μηχανάομαι यहाँ हानि पहुँचाने की योजना या षड्यंत्र रचने का भाव देता है। αὐτῷ व्याकरणतः एकवचन है, पर प्रसंग में लक्षित यहूदी समुदाय सामूहिक रूप से समझा जा सकता है; हिन्दी ‘उनके’ इस संदर्भगत सामूहिक अर्थ को रखता है, और पाठ-टिप्पणी मूल की एकवचनता बताती है।
- source_word: λήθην
  choice: भूल
  rationale: λήθη का अर्थ भूल या विस्मृति है। ‘भूल’ साधारण आधुनिक पाठक के लिए स्वाभाविक है और यहाँ डाली गई मानसिक विस्मृति का अर्थ देता है।
- source_word: κατὰ διάνοιαν
  choice: मन में
  rationale: διάνοια मन, विचार या समझ की आंतरिक क्षमता को सूचित करता है। इस वाक्य में ‘मन में’ सबसे स्वाभाविक हिन्दी रूप है।
- source_word: ἐντεθεικότος
  choice: डाल दी थी
  rationale: ἐντίθημι का मूल चित्र किसी वस्तु को भीतर रखने या डालने का है। यह रूप परमेश्वर की प्रत्यक्ष क्रिया को बनाए रखता है और उसे केवल अनुमति देने तक सीमित नहीं करता।
theological_decisions:
- issue: विरोधियों की मानसिक दशा में परमेश्वर की भूमिका
  choice: परमेश्वर ने स्वयं उनके मन में भूल डाल दी
  alternative: परमेश्वर ने केवल उन्हें भूलने दिया या अप्रत्यक्ष रूप से भ्रम उत्पन्न किया
  rationale: ἐνέργεια और ἐντεθεικότος दोनों प्रत्यक्ष दैवी क्रिया व्यक्त करते हैं। अनुवाद इस कठिन धार्मिक तनाव को नरम किए बिना रखता है।
- issue: αὐτῷ का संदर्भ
  choice: प्रसंगानुसार लक्षित यहूदी लोगों के लिए सामूहिक ‘उनके’
  alternative: मूल के व्याकरणिक एकवचन के अनुसार ‘उसके’, सम्भवतः किसी एक प्रतिनिधि व्यक्ति या एक सामूहिक इकाई के लिए
  rationale: यूनानी सर्वनाम एकवचन है, जबकि कथा में षड्यंत्र का लक्ष्य यहूदी समुदाय है। मुख्य पाठ सामूहिक संदर्भ स्पष्ट करता है और पाद-टिप्पणी वास्तविक व्याकरणिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रभुता’ ऊँचे कथात्मक स्वर को बनाए रखता है, जबकि ‘मन में भूल डाल दी’ मूल के ठोस चित्र और प्रत्यक्ष दैवी कर्तृत्व को स्वाभाविक हिन्दी में व्यक्त करता है।
