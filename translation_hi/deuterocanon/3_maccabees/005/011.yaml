  yaml_path: translation/deuterocanon/3_maccabees/005/011.yaml
  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: hi
  text: परन्तु समय की युगों पुरानी व्यवस्था[a], जो रात और दिन में सुंदरता से आती रहती है और जिसे वह उन सबको अनुग्रह से देता है जिन्हें वह स्वयं चाहता है, उसने राजा पर नींद का एक अंश भेज दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समय की युगों पुरानी सृष्टि।” यूनानी पदबंध काव्यात्मक और संक्षिप्त है; यह रात और दिन में प्रकट होनेवाली समय की बहुत पहले से स्थापित सृजित व्यवस्था का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राजा के पास/की ओर नींद का एक अंश भेज दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... κτίσμα χρόνου
  choice: समय की ... व्यवस्था
  rationale: κτίσμα का मूल अर्थ ‘रची हुई वस्तु/सृष्टि’ है, पर यहाँ रात और दिन में प्रकट होनेवाली समय की स्थापित रचना या व्यवस्था अभिप्रेत है। मुख्य पाठ में ‘व्यवस्था’ स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀπʼ αἰῶνος
  choice: युगों पुरानी
  rationale: यह दीर्घ प्राचीनता व्यक्त करता है। ‘अनादि’ या ‘सनातन’ कहने से ऐसा अधिक प्रबल तात्त्विक दावा हो सकता है जो यूनानी वाक्यांश में आवश्यक नहीं।
- source_word: καλὸν
  choice: सुंदर ढंग से
  rationale: καλός यहाँ समय के रात-दिन के लयात्मक क्रम की सुंदरता या सुचारुता बताता है; ‘सुंदर’ काव्यात्मक बल बनाए रखता है।
- source_word: ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: रात और दिन में ... आती रहती है
  rationale: ἐπιβάλλω में ‘आ पड़ना/आना’ का बिंब है। यह अनुवाद रात-दिन के बार-बार आने को व्यक्त करता है, बिना यूनानी की काव्यात्मक संक्षिप्तता को किसी तकनीकी अर्थ में सीमित किए।
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν
  choice: सबको ... नींद प्रदान करनेवाले की ओर से
  rationale: χαρίζομαι उदारतापूर्वक प्रदान करने का भाव रखता है। प्रसंग से निहित कर्म ‘नींद’ स्पष्ट किया गया है; ‘की ओर से’ ὑπό के कर्तृभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: οἷς ἂν αὐτὸς θελήσῃ
  choice: जिसे वह स्वयं चाहे
  rationale: वाक्यांश प्रदान करनेवाले की स्वतंत्र इच्छा व्यक्त करता है और ‘स्वयं’ αὐτός के बलाघात को बनाए रखता है।
- source_word: ὕπνον μέρος
  choice: नींद का एक अंश
  rationale: μέρος का ठोस अर्थ ‘अंश/भाग’ सुरक्षित रखा गया है, यद्यपि सहज अर्थ ‘कुछ नींद’ है।
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: राजा पर ... भेज दिया
  rationale: ἀπέστειλεν का ‘भेजना’ बनाए रखा गया है; नींद के साथ εἰς को हिन्दी में स्वाभाविक रूप से ‘राजा पर’ कहा गया है।
theological_decisions:
- issue: τοῦ χαριζομένου में परमेश्वर का अप्रत्यक्ष उल्लेख
  choice: नींद प्रदान करनेवाले
  alternative: परमेश्वर, जो नींद प्रदान करता है
  rationale: प्रसंग में संकेत परमेश्वर की ओर है, पर मूल पाठ यहाँ उसका नाम या कोई उपाधि नहीं देता। इसलिए संकेत स्पष्ट रखा गया है, पर नाम जोड़कर अर्थ को अधिक निश्चित नहीं किया गया।
- issue: ἀπʼ αἰῶνος की कालगत शक्ति
  choice: युगों पुरानी
  alternative: अनादि
  rationale: यह चयन प्राचीनता और दीर्घकालिक स्थिरता व्यक्त करता है, पर समय की व्यवस्था के बारे में अनिवार्य रूप से metaphysical अनादित्व का दावा नहीं करता।
- issue: नींद दिए जाने में दैवी इच्छा
  choice: जिसे वह स्वयं चाहे
  alternative: जिन्हें वह उचित समझे
  rationale: मूल में θέλω इच्छा/चाह को सीधे व्यक्त करता है। ‘उचित समझे’ दैवी विवेक का अतिरिक्त व्याख्यात्मक भाव जोड़ देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर पद की काव्यात्मक और कुछ असामान्य वाक्य-रचना को पूरी तरह समतल नहीं किया गया। ‘युगों पुरानी व्यवस्था’, ‘सुंदर ढंग से आती रहती है’ और ‘नींद का एक अंश’ मूल के चित्रात्मक स्वर को बनाए रखते हैं।
