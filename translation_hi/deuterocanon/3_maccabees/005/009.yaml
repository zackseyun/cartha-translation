- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: प्रार्थना के प्रसंग में οὐρανός का अर्थ ‘आकाश’ से अधिक उपयुक्त रूप से ‘स्वर्ग’ है। ‘की ओर’ हिन्दी में चढ़ती हुई विनती की दिशा स्वाभाविक ढंग से बताता है।
- source_word: τούτων
  choice: उनकी
  rationale: सम्बन्धकारक संकेतवाचक सर्वनाम पहले उल्लिखित लोगों की ओर लौटता है; हिन्दी में इसका सहज रूप ‘उनकी’ है।
- source_word: μὲν οὖν
  choice: इस प्रकार
  rationale: यह कण-समूह पूर्ववर्ती कथन से संक्रमण और परिणामसूचक निरंतरता जोड़ता है। ‘इस प्रकार’ कथावाहक सम्बन्ध को गरिमापूर्ण और सहज हिन्दी में रखता है।
