- source_word: λιτανία
  choice: विनती
  rationale: यह शब्द प्रार्थनापूर्वक की गई याचना या गुहार को दर्शाता है। ‘विनती’ आधुनिक हिन्दी में इसके आग्रहपूर्ण भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करती है।
- source_word: ἐκτενῶς
  choice: बड़े आग्रह के साथ
  rationale: यह क्रिया-विशेषण तीव्रता, तत्परता या विस्तार/अवधि का बोध करा सकता है। मुख्य पाठ में प्रार्थना की तीव्रता व्यक्त की गई है और अवधि-संबंधी सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀνέβαινεν
  choice: उठ रही थी
