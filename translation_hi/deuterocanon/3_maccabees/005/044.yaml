  text: Then the friends and relatives[a], overjoyed, having regained confidence, stationed the forces in the most suitable places of the city for guard duty.
translation:
  language: hi
  text: तब मित्र और संबंधी, बहुत आनन्दित होकर और विश्वास के साथ[a], अलग-अलग हो गए और नगर की चौकसी के लिए सैन्य-दलों को नगर के सबसे उपयुक्त स्थानों पर तैनात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मविश्वास के साथ” अथवा “निष्ठापूर्वक।” यूनानी में शाब्दिक अर्थ “विश्वास के साथ” है; यह उनके भरोसे/आत्मविश्वास को या उनके काम करने के निष्ठापूर्ण ढंग को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιχαρεῖς
  choice: बहुत आनन्दित होकर
  rationale: यह शब्द प्रबल आनन्द व्यक्त करता है; यह हिन्दी में सहज रहते हुए उसकी तीव्रता बनाए रखता है।
- source_word: ἀναλύσαντες
  choice: वहाँ से निकल गए
  rationale: इस प्रसंग में कृदन्त का अर्थ सभा या उस स्थान से चले जाना/विदा होना है। यह अनिश्चित संदर्भ में अनावश्यक रूप से ‘तितर-बितर होने’ का भाव नहीं जोड़ता।
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: मित्र और संबंधी
  rationale: दोनों सामाजिक समूहों को सीधे, आधुनिक और सहज हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: μετὰ πίστεως
  choice: विश्वास के साथ
  rationale: πίστις के मूल अर्थ को स्पष्ट रूप से सुरक्षित रखा गया है; प्रसंग में ‘आत्मविश्वास के साथ’ या ‘निष्ठापूर्वक’ भी संभव हैं, जिन्हें टिप्पणी में रखा गया है।
- source_word: διέτασσον
  choice: तैनात करने लगे
  rationale: सैन्य-दलों और निर्दिष्ट स्थानों के साथ यह क्रिया व्यवस्थित नियुक्ति/तैनाती बताती है; अपूर्णकाल की प्रवाहमान क्रिया को ‘करने लगे’ से व्यक्त किया गया है।
- source_word: τὰς δυνάμεις
  choice: सैन्य-दलों
  rationale: बहुवचन δυνάμεις यहाँ सुरक्षा या सैन्य बलों को सूचित करता है; ‘सैन्य-दल’ प्रसंग को स्पष्ट करता है, पर उन्हें केवल पहरेदारों तक सीमित नहीं करता।
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: सबसे उपयुक्त स्थानों पर
  rationale: यह अतिशयोक्तिपूर्ण विशेषण उन स्थानों की विशेष अनुकूलता दर्शाता है; ‘रणनीतिक’ कहना यूनानी से अधिक तकनीकी होता।
- source_word: πρὸς τὴν τήρησιν
  choice: चौकसी के लिए
  rationale: उद्देश्य पहरा देने, निगरानी रखने या रक्षा करने का है; ‘चौकसी’ आधुनिक हिन्दी में इस व्यापक सुरक्षा-भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: μετὰ πίστεως में πίστις का अर्थ
  choice: विश्वास के साथ
  alternative: आत्मविश्वास के साथ; निष्ठापूर्वक
  rationale: मुख्य पाठ में πίστις की स्पष्ट शब्दावली और संभव धार्मिक अनुगूँज सुरक्षित है। फिर भी कथात्मक प्रसंग आत्मविश्वास अथवा निष्ठापूर्ण ढंग का संकेत दे सकता है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य प्रसंग को स्पष्ट करने के लिए ‘सैन्य-दल’ और सुरक्षा के उद्देश्य के लिए ‘चौकसी’ चुना गया है।
