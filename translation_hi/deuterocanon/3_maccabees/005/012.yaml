  yaml_path: translation/deuterocanon/3_maccabees/005/012.yaml
  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: hi
  text: और अधिपति[a] के कार्य से वह अत्यन्त सुखद और गहरी तंद्रा[b] से अभिभूत हो गया; वह अपने विधि-विरुद्ध उद्देश्य में बहुत बुरी तरह विफल हुआ और अपने अटल निश्चय को लेकर बहुत निराश हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधिपति’ यूनानी δεσπότης का अनुवाद है, जो पूर्ण अधिकार रखने वाले ‘स्वामी’ को भी दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी में ‘अत्यन्त सुखद और गहरी’ के साथ तंद्रा या निद्रा की संज्ञा स्पष्ट रूप से नहीं दी गई है; यह असामान्य रूपक अधिपति के कार्य से उसके अभिभूत और निष्क्रिय हो जाने का चित्र प्रस्तुत करता है। वैकल्पिक अनुवाद: ‘अधिपति की अत्यन्त मधुर और गहरी कार्यशीलता ने उसे वश में कर लिया।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστῳ
  choice: अत्यन्त सुखद
  rationale: यह ἡδύς का उत्कृष्टतम रूप है। ‘अत्यन्त सुखद’ असामान्य सकारात्मक बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: βαθεῖ
  choice: गहरी
  rationale: मूल अर्थ ‘गहरा’ है; यहाँ उस दशा की प्रबलता और गहनता व्यक्त होती है।
- source_word: κατεσχέθη
  choice: वश में हो गया
  rationale: κατέχω के कर्मवाच्य रूप में पकड़े जाने, रोक दिए जाने या अभिभूत होने का भाव है। प्रसंग में यह दिव्य हस्तक्षेप के कारण उसके निष्क्रिय हो जाने को व्यक्त करता है।
- source_word: ἐνεργείᾳ
  choice: प्रभावशाली क्रिया
  rationale: ἐνέργεια किसी सक्रिय और परिणामकारी कार्य को सूचित करता है। ‘प्रभावशाली क्रिया’ क्रिया और उसकी कारगर शक्ति दोनों को व्यक्त करती है।
- source_word: δεσπότου
  choice: अधिपति
  rationale: δεσπότης पूर्ण अधिकार रखने वाले स्वामी का पद है। ‘अधिपति’ इसके सार्वभौम अधिकार के भाव को रखता है और κύριος के सामान्य अनुवाद से भेद भी बनाए रखता है।
- source_word: ἀθέσμου
  choice: विधि-विरुद्ध
  rationale: यह स्थापित विधि, मर्यादा या नैतिक व्यवस्था के विरुद्ध बात को दर्शाता है। ‘विधि-विरुद्ध’ यहाँ उद्देश्य की अवैध और अनुचित प्रकृति व्यक्त करता है।
- source_word: προθέσεως
  choice: उद्देश्य
  rationale: यह पहले से ठहराए गए इरादे या अभिप्राय को सूचित करता है।
- source_word: πολὺ διεσφαλμένος
  choice: बुरी तरह विफल हो गया
  rationale: διασφάλλω मार्ग से च्युत करने या किसी प्रयास को असफल कर देने का भाव रखता है; प्रसंग में उसकी योजना के नाकाम होने की बात है।
- source_word: ἀμεταθέτου
  choice: अटल
  rationale: जिसे बदला या हटाया न जा सके। ‘अटल’ हिन्दी में उसके दृढ़ और हठपूर्ण निश्चय का स्वाभाविक वर्णन है।
- source_word: λογισμοῦ
  choice: निश्चय
  rationale: यद्यपि शब्द का अर्थ विचार या तर्क भी हो सकता है, यहाँ समानांतर रचना में यह उसके दृढ़ संकल्प को दर्शाता है।
- source_word: μεγάλως διεψευσμένος
  choice: घोर निराशा हाथ लगी
  rationale: कर्मवाच्य प्रयोग अपेक्षा के झूठा सिद्ध होने या निराश हो जाने को दर्शाता है। यह हिन्दी अभिव्यक्ति परिणाम को स्वाभाविक ढंग से बताती है।
theological_decisions:
- issue: δεσπότου को परमेश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: अधिपति
  alternative: स्वामी; प्रभु
  rationale: मूल में κύριος नहीं बल्कि δεσπότης है, जो पूर्ण अधिकार पर बल देता है। ‘अधिपति’ इस भेद और अधिकार के भाव को सुरक्षित रखता है।
- issue: दिव्य हस्तक्षेप और मानवीय योजना के संबंध को व्यक्त करना
  choice: अधिपति की प्रभावशाली क्रिया से उसकी योजना विफल हुई
  alternative: उसकी दशा को केवल प्राकृतिक तंद्रा मानना
  rationale: वाक्य स्पष्ट रूप से घटना का कारण अधिपति की ἐνέργεια को बताता है; इसलिए दिव्य कारण को अस्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘तंद्रा’ प्रसंग की गहरी, सुखद अचेत दशा को सहज हिन्दी में व्यक्त करती है, जबकि पादटिप्पणी मूल यूनानी की व्याकरणिक और रूपकीय असामान्यता को सुरक्षित रखती है।
