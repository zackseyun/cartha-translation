  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: hi
  text: परन्तु यहूदी, जो बेड़ियों में चारों ओर से जकड़े रहने की विवशता के कारण राष्ट्रों की दृष्टि में हर प्रकार की सुरक्षा से वंचित जान पड़ते थे,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों को ऐसा दिखाई देता था कि उनके पास किसी प्रकार की ओट या सुरक्षा नहीं थी।”
    reason: शब्दार्थ और वाक्य-विन्यास का वैकल्पिक अनुवाद; σκέπη में ‘ओट/आश्रय’ का भाव और δοκοῦντες εἶναι में प्रेक्षकों की धारणा निहित है।
lexical_decisions:
- source_word: σκέπης
  choice: सुरक्षा
  rationale: σκέπη का अर्थ ओट, आश्रय या सुरक्षा हो सकता है। यहाँ शत्रुतापूर्ण राष्ट्रों के सामने असहाय दिखाई देने के संदर्भ में ‘सुरक्षा’ स्वाभाविक और व्यापक है।
- source_word: ἔρημοι
  choice: से वंचित
  rationale: सम्बन्धकारक πάσης σκέπης के साथ ἔρημοι किसी वस्तु के अभाव की दशा व्यक्त करता है; ‘से वंचित’ इसे स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: δοκοῦντες εἶναι
  choice: जान पड़ते थे
  rationale: यह वाक्यांश वास्तविक दशा का निरपेक्ष दावा नहीं, बल्कि देखने वालों की धारणा बताता है; ‘जान पड़ते थे’ उस भेद को बनाए रखता है।
- source_word: τοῖς ἔθνεσιν
  choice: दूसरे राष्ट्रों की दृष्टि में
  rationale: यहाँ सम्प्रदान कारक दृष्टिकोण सूचित करता है। ‘दूसरे राष्ट्रों की दृष्टि में’ आधुनिक हिन्दी में स्पष्ट है और ἔθνη को आसपास के गैर-यहूदी जनसमूहों के रूप में व्यक्त करता है।
- source_word: ἀνάγκην
  choice: विवशता
  rationale: ἀνάγκη आवश्यकता, बाध्यता या विवशकारी संकट दर्शा सकता है। बेड़ियों के प्रसंग में ‘विवशता’ उसके दबावपूर्ण अर्थ को ‘आवश्यकता’ से अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: चारों ओर से बेड़ियों में जकड़ देने वाली
  rationale: यह रूप आसपास से घेर लेने और बन्धन में रखने, दोनों चित्रों को संक्षिप्त तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: δεσμῶν
  choice: बेड़ियों
  rationale: δεσμοί बन्धन, जंजीरें या बेड़ियाँ हो सकता है। बन्दी बनाए जाने के भौतिक प्रसंग में ‘बेड़ियाँ’ सजीव और सटीक है।
