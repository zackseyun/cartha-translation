base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: hi
  text: और यहूदी, राजा की ओर से आई बात सुनकर, उस प्रकट हुए परमेश्वर—प्रभु, शासन करने वालों के राजा[a]—की स्तुति कर रहे थे, क्योंकि उन्हें उसी से यह सहायता मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “राजाओं का राजा।” यूनानी में शाब्दिक अर्थ “शासन करने वालों के राजा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: राजा की ओर से आई बात
  rationale: यह वाक्यांश राजा से आए संदेश या मामले को सूचित करता है। ‘बात’ मूल की व्यापकता बनाए रखती है और इसे अनावश्यक रूप से औपचारिक आज्ञा नहीं बनाती।
- source_word: ἀκούσαντες
  choice: सुनकर
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी में व्यक्त करता है और स्तुति से पहले सुनने की क्रिया को बनाए रखता है।
- source_word: ἐπιφανῆ
  choice: प्रत्यक्ष रूप से प्रकट हुए
  rationale: यहाँ विशेषण परमेश्वर के कार्य द्वारा स्पष्ट रूप से प्रकट होने पर बल देता है; इस अभिव्यक्ति से केवल ‘महिमामय’ कहने की अपेक्षा वह भाव अधिक स्पष्ट रहता है।
- source_word: θεὸν Κύριον
  choice: परमेश्वर—प्रभु
  rationale: दोनों दैवी पदों को समानाधिकरण के रूप में बनाए रखता है और κύριος का श्रद्धापूर्ण अनुवाद ‘प्रभु’ करता है।
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: शासन करने वालों के राजा
  rationale: मूल में ‘राजाओं’ की संज्ञा नहीं, बल्कि ‘शासन करने वालों’ का कृदन्त है। मुख्य पाठ उस भेद को सुरक्षित रखता है; परिचित मुहावरेदार रूप पादटिप्पणी में दिया गया है।
- source_word: ᾔνουν
  choice: स्तुति की
  rationale: हिन्दी में प्रसंग की मुख्य भूतकालीन क्रिया को स्वाभाविक रूप देता है; यूनानी अपूर्ण भूतकाल स्तुति की जारी क्रिया का संकेत दे सकता है, पर ‘स्तुति करते रहे’ यहाँ अनावश्यक रूप से अवधि पर अधिक बल देता।
- source_word: τῆσδε τῆς βοηθείας
  choice: यह सहायता
  rationale: βοήθεια का सीधा अर्थ सहायता है; ‘छुटकारा’ मूल से अधिक व्याख्यात्मक होता।
- source_word: τετευχότες
  choice: उन्हें ... मिली थी
  rationale: पूर्ण कृदन्त से प्राप्त सहायता की पूर्ण और परिणामकारी अवस्था व्यक्त होती है; स्वाभाविक हिन्दी में ‘मिली थी’ वही संबंध स्पष्ट करता है।
theological_decisions:
- issue: दैवी पद-श्रृंखला में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण उपाधि है; ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक है और दैवी पद को सुरक्षित रखता है।
- issue: Βασιλέα τῶν βασιλευόντων को पारंपरिक पद ‘राजाओं का राजा’ बनाना या कृदन्तीय रूप बनाए रखना
  choice: शासन करने वालों के राजा
  alternative: राजाओं का राजा
  rationale: यूनानी पाठ में βασιλευόντων का अर्थ शाब्दिक रूप से ‘शासन करने वालों’ है। परिचित धार्मिक सूत्र को चुपचाप आरोपित करने के बजाय मुख्य पाठ मूल संरचना रखता है और मुहावरेदार विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली। दैवी उपाधियों की शृंखला को डैश से स्पष्ट किया गया है। मुख्य पाठ में यूनानी कृदन्त की विशिष्टता रखी गई है और परिचित पारंपरिक रूप पादटिप्पणी में दिया गया है।
