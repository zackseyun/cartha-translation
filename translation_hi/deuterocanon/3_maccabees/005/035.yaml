  terminology: ‘परमेश्वर,’ ‘प्रभु,’ and ‘शासन करने वालों के राजा’ are suitable. The footnote correctly identifies the idiomatic alternative ‘राजाओं का राजा’ while retaining the Greek participial distinction in the main text.
