lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: हाथियों का अधिकारी
  rationale: यह यौगिक पद हाथियों के प्रभारी या कमांडर के लिए है। ‘हाथियों का अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और विशिष्ट दायित्व को बनाए रखता है।
- source_word: τὸ προσταγὲν
  choice: दिए गए आदेश
  rationale: नपुंसकलिंग कृदन्तीय अभिव्यक्ति का शाब्दिक अर्थ ‘जो आज्ञा दी गई थी’ है; ‘दिए गए आदेश’ उसी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀραρότως
  choice: ठीक-ठीक
  rationale: यह क्रियाविशेषण दृढ़, समुचित या सटीक रीति से कार्य करने का भाव दे सकता है। आदेश के पालन के संदर्भ में ‘ठीक-ठीक’ उसके सावधान और पूर्ण अनुपालन को व्यक्त करता है।
- source_word: συνετέλει
  choice: पूरा कर रहा था
  rationale: क्रिया किसी सौंपे हुए कार्य को अंजाम देने या पूर्ण करने को दर्शाती है। अपूर्ण भूतकाल के रूप को ‘कर रहा था’ से सुरक्षित रखा गया है।
- source_word: Ἕρμων
  choice: हेरमोन
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में सीधा और प्रचलन-संगत लिप्यंतरण।
- source_word: δὲ
  choice: परन्तु
  rationale: यह संयोजक प्रसंग में हल्का विरोध या कथा की अगली गति दिखाता है; ‘परन्तु’ विरोधी संबंध को स्पष्ट रखता है।
