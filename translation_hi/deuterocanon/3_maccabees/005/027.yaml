base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/027.yaml
  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: hi
  text: पर जब उसने इसे स्वीकार किया और इस विधि-विरुद्ध परिणाम[a] पर चकित रह गया, तो हर बात से अनजान होकर वह बार-बार पूछने लगा कि जो आदेश[b] दिया गया था, क्या वह सचमुच उसके लिए तत्परता से पूरा किया जा चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विधि-विरुद्ध निष्कर्ष’; यूनानी शब्द का शाब्दिक अर्थ ‘प्रस्थान’ भी हो सकता है, पर इस प्रसंग में ‘परिणाम’ अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: ‘जो आदेश दिया गया था’ का अनुवाद ‘जो लिखकर निर्धारित किया गया था’ या ‘जारी किया गया आदेश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: उसने इसे स्वीकार किया
  rationale: ἀποδέχομαι के मध्यवाच्य रूप में ग्रहण करने या स्वीकार करने का भाव है। प्रसंग स्पष्ट न होने के कारण कर्म को केवल ‘इसे’ रखा गया है और औपचारिक अनुमोदन का अर्थ नहीं जोड़ा गया।
- source_word: καταπλαγέντος
  choice: चकित रह गया
  rationale: यह अभिभूत कर देने वाले आश्चर्य को व्यक्त करता है; यह सहज आधुनिक हिन्दी में निष्क्रिय प्रभाव और नाटकीयता दोनों बनाए रखता है।
- source_word: ἀνόμῳ ἐξόδῳ
  choice: विधिविरुद्ध परिणाम
  rationale: ἄνομος का अर्थ विधिविरुद्ध है, जबकि ἔξοδος यहाँ प्रसंगानुसार परिणाम या घटनाक्रम के निष्कर्ष को दर्शा सकता है। शाब्दिक ‘प्रस्थान’ इस प्रसंग में अस्पष्ट है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κατὰ πάντα
  choice: हर तरह से
  rationale: यह ‘सभी बातों में’ या ‘पूरी तरह’ का व्यापक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγνωσίᾳ κεκρατημένος
  choice: अनभिज्ञता के वश में होकर
  rationale: κρατέω का पूर्ण निष्क्रिय कृदन्त किसी के नियंत्रण में होने का प्रबल भाव देता है; ‘वश में’ उस बल को बनाए रखता है, जबकि ἀγνωσία को अनभिज्ञता के रूप में खुला रखा गया है।
- source_word: ἐπυνθάνετο
  choice: बार-बार पूछने लगा
  rationale: अपूर्ण काल जारी या दोहराई गई पूछताछ सूचित करता है; हिन्दी में ‘बार-बार पूछने लगा’ इस पहलू को स्पष्ट करता है।
- source_word: τὸ διαγραμμένον
  choice: जो आदेश दिया गया था
  rationale: διαγράφω का पूर्ण कृदन्त लिखकर निर्धारित की गई बात या राजकीय आदेश का संकेत दे सकता है। दरबारी प्रसंग में ‘आदेश’ स्वाभाविक है; लिखित स्वरूप की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἔτι
  choice: सचमुच
  rationale: यहाँ ἔτι को प्रश्न में वास्तविक पूर्ति पर बल देने वाला माना गया है; ‘अब भी’ या ‘अभी तक’ का कालगत अर्थ भी संभव है, पर प्रसंग में कम स्वाभाविक है।
- source_word: μετὰ σπουδῆς
  choice: तत्परता से
  rationale: σπουδή में शीघ्रता, गंभीरता और लगन का सम्मिलित भाव हो सकता है; ‘तत्परता’ इसे केवल गति तक सीमित नहीं करती।
- source_word: τετέλεσται
  choice: पूरा कर दिया गया है
  rationale: τελέω का पूर्ण निष्क्रिय रूप पूर्ण किए जाने और वर्तमान परिणामी अवस्था का संकेत देता है। हिन्दी का पूर्ण वर्तमान ‘कर दिया गया है’ उस पक्ष को बनाए रखता है।
