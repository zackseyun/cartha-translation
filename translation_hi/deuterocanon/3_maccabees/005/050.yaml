lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: फिर भी ... यह भी
  rationale: संयोजकों के प्रबल संक्रमणात्मक भाव को स्वाभाविक आधुनिक हिन्दी में रखा गया है; ‘यह भी’ καί का भाव व्यक्त करता है।
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: पहले उन्हें ... सहायता मिली थी
  rationale: ἀντιλήψεις सहायता अथवा सहायक हस्तक्षेपों को सूचित करता है। बहुवचन और घटनात्मक अर्थ को पादटिप्पणी में स्पष्ट रखते हुए मुख्य पाठ में सहज सामूहिक ‘सहायता’ रखा गया है।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यूनानी अभिव्यक्ति का सीधा रूप रखा गया है; परमेश्वर का नाम जोड़कर निहित कर्ता को स्पष्ट नहीं किया गया।
- source_word: συνιδόντες
  choice: जब उन्होंने ... समझा
  rationale: क्रिया केवल देखने से बढ़कर पूर्व घटनाओं को पहचानने या उनका बोध होने का अर्थ दे सकती है; ‘समझा’ इस प्रसंग में स्वाभाविक है।
- source_word: πρηνεῖς ... ῥίψαντες ἑαυτούς
  choice: मुँह के बल गिर पड़े
  rationale: प्रणत मुद्रा और स्वयं को भूमि पर डाल देने की तीव्र क्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁμοθυμαδόν
  choice: सब एक साथ
  rationale: सामूहिक और एकमत क्रिया का स्पष्ट आधुनिक रूप।
- source_word: τὰ νήπια
  choice: दूध पीते शिशुओं
  rationale: स्तनों के तत्काल संदर्भ से νήπια यहाँ स्तनपान करने वाले बहुत छोटे बच्चों को सूचित करता है।
- source_word: χωρίσαντες τῶν μαστῶν
  choice: स्तनों से अलग कर दिया
  rationale: मूल की शाब्दिक संरचना और उसकी कठोरता बनाए रखी गई है; ‘माताओं के’ अथवा ‘खींचकर’ जैसे स्रोत में निहित न होने वाले शब्द नहीं जोड़े गए।
theological_decisions:
- issue: स्वर्गीय सहायता को स्पष्ट रूप से परमेश्वर का हस्तक्षेप कहना या न कहना
  choice: स्वर्ग से
  alternative: परमेश्वर से / स्वर्ग में प्रभु से
  rationale: यूनानी पाठ केवल ἐξ οὐρανοῦ कहता है। दिव्य सहायता का संकेत स्पष्ट है, पर अनुवाद में ऐसा दिव्य नाम या पद नहीं जोड़ा गया जो मूल में नहीं है।
