- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: पेय की प्रचुर मात्रा से
  rationale: यह पेय की उदार अथवा प्रचुर आपूर्ति को हाथियों के उग्र होने का साधन बताता है।
- source_word: εἰσαγαγεῖν
  choice: भीतर लाया जाए
  rationale: हाथियों को नियत स्थान में ले आने का प्रेरणार्थक भाव सुरक्षित है।
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: यहूदियों का विनाश करने के लिए
  rationale: ग्रीक वाक्यांश शाब्दिक रूप से ‘यहूदियों के विनाश/मृत्यु से भेंट के लिए’ है, पर प्रसंग में हाथियों को यहूदियों को मारने के साधन के रूप में लाए जाने का आशय है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया और शाब्दिक संकुचन पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: τοῦ μόρου का हिंसक प्रसंग में अर्थ
  choice: यहूदियों का विनाश करने के लिए
  alternative: यहूदियों की मृत्यु से भेंट कराने के लिए
  rationale: μόρος ‘नियत मृत्यु’, ‘विनाश’ या ‘मृत्यु’ व्यक्त कर सकता है। प्रसंग इच्छित सामूहिक हत्या को स्पष्ट करता है, इसलिए मुख्य पाठ में ‘विनाश’ चुना गया; फिर भी ग्रीक की असामान्य ‘भेंट’ वाली अभिव्यक्ति और ‘मृत्यु’ का विकल्प पादटिप्पणी में दिया गया है।
