  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: hi
  text: उसने आदेश दिया कि आने वाले दिन तक सभी हाथियों को—जिनकी संख्या पाँच सौ थी—भरपूर मात्रा में लोबान और बहुत-सी बिना मिलावट की मदिरा दी जाए, और पेय की प्रचुर आपूर्ति से उन्हें उग्र बना दिए जाने के बाद यहूदियों का विनाश करने के लिए[a] उन्हें लाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदियों के विनाश से भेंट के लिए”; इसका अनुवाद “यहूदियों की मृत्यु से भेंट के लिए” भी हो सकता है। यह यूनानी मुहावरा उनके अभिप्रेत विनाश को व्यक्त करता है।
    reason: ग्रीक πρὸς συνάντησιν τοῦ μόρου की शाब्दिक रचना और μόρος के ‘विनाश/मृत्यु’ अर्थ-विकल्प को सुरक्षित रखना।
