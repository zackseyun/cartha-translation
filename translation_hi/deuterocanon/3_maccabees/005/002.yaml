- source_word: ὄντας τὸν ἀριθμὸν πεντακοσίους
  choice: जिनकी संख्या पाँच सौ थी
  rationale: व्याख्यात्मक कृदन्त वाक्यांश को स्पष्ट और प्रवाहपूर्ण हिन्दी उपवाक्य में प्रस्तुत किया गया है।
- source_word: ἀγριωθέντας
  choice: उनके उग्र हो जाने पर
