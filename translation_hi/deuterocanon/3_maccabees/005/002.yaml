  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे यूनानी वाक्य को अर्थ-संबंध बनाए रखते हुए दो क्रमिक खंडों में व्यवस्थित किया गया है। ‘दाखमधु’, ‘लोबान’ और ‘उग्र’ जैसे शब्द बाइबलीय संदर्भ के अनुकूल हैं, पर अत्यधिक पुरातन नहीं।
