- source_word: δαψιλέσι δράκεσι λιβανωτοῦ
  choice: भरपूर मुट्ठियों में लोबान
  rationale: δράξ मूलतः मुट्ठी या मुट्ठीभर मात्रा को दर्शाता है और δαψιλής उसकी भरपूर मात्रा पर बल देता है। हिन्दी में इस ठोस मात्रात्मक चित्र को बनाए रखा गया है, यद्यपि हाथियों को लोबान पिलाने का आशय उसे पेय में दिए जाने से है।
- source_word: οἴνῳ πλείονι ἀκράτῳ
