lexical_decisions:
- source_word: ὡς δὲ
  choice: पर जब
  rationale: यह पदबंध कथा में परिवर्तन के साथ समय-संबंध व्यक्त करता है; ‘पर जब’ दोनों पक्षों को स्वाभाविक हिन्दी में रखता है।
- source_word: τῶν ἐλεφάντων ἐξιόντων ἐπὶ πύλην
  choice: हाथियों को फाटक की ओर निकलते हुए
  rationale: ἐξιόντων बाहर निकलने की गति और ἐπὶ πύλην फाटक की दिशा बताता है; ‘की ओर’ पहुँच जाने या आक्रमण का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: उनके पीछे आती सशस्त्र सेना
  rationale: ἑπομένης हाथियों के पीछे चलने का क्रम स्पष्ट करता है; ‘सशस्त्र सेना’ ἐνόπλου δυνάμεως का सहज सैन्य अर्थ देता है।
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: भीड़ के आगे बढ़ने
  rationale: πορεία यहाँ भीड़ की गति या कूच को दर्शाता है; ‘आगे बढ़ने’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य अनुशासन का अतिरिक्त संकेत नहीं देता।
- source_word: κονιορτόν
  choice: उठी धूल
  rationale: स्रोत में संज्ञा ‘धूल’ है; हिन्दी में कारणवाचक संबंध स्पष्ट और स्वाभाविक करने के लिए ‘से उठी धूल’ कहा गया है।
- source_word: βαρυχῆ θόρυβον
  choice: भारी गूँज वाला कोलाहल
  rationale: βαρυχής ध्वनि के भारीपन या गहरे अनुनाद को और θόρυβος शोर/कोलाहल को व्यक्त करता है; यह अनुवाद दोनों अर्थ-तत्त्वों को बनाए रखता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: इस प्रसंग में यह शब्द मिस्र में रहने वाले यहूदी जातीय-धार्मिक समुदाय को सूचित करता है, केवल यहूदिया के निवासियों को नहीं।
