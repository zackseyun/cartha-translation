  text: पर जब यहूदियों ने हाथियों को फाटक की ओर निकलते हुए देखा, और उनके पीछे आती सशस्त्र सेना तथा भीड़ के आगे बढ़ने से उठी धूल देखी, और भारी गूँज वाला कोलाहल[a] सुना,
  philosophy: optimal-equivalence
