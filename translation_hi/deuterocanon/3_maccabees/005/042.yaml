base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: hi
  text: 'इसलिए राजा[a]—जो हर प्रकार से फ़ालारिस जैसा था—विवेकहीनता से भर गया। यहूदियों की देखरेख के संबंध में उसके मन में जो परिवर्तन हो रहे थे[c], उन्हें उसने कुछ भी महत्त्व नहीं दिया। उसने दृढ़तापूर्वक ऐसी शपथ ठानी जो पूरी हो ही नहीं सकती थी: वह बिना देर किए इन लोगों को जंगली पशुओं से घुटनों और पैरों में बुरी तरह नुचवाकर अधोलोक[b] भेज देगा,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: फ़ालारिस अत्यधिक क्रूरता के लिए कुख्यात एक प्राचीन शासक था। यहाँ राजा की तुलना उसी से की गई है।
    reason: cultural_note
  - marker: b
    text: अर्थात् ‘मृतकों का लोक’; यूनानी में ‘हेडीज़’। इसे यहाँ ‘नरक’ नहीं कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: मूल यूनानी में शाब्दिक रूप से ‘आत्मा के परिवर्तन’ है, अर्थात् उसके भीतर होने वाले मन या हृदय के बदलाव।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: इसलिए
  rationale: यह पिछले वृत्तांत से निकलने वाले परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: राजा—जो हर प्रकार से फ़ालारिस जैसा था
  rationale: मूल में फ़ालारिस के साथ स्पष्ट साहित्यिक तुलना है; केवल ‘क्रूर राजा’ कहने से ऐतिहासिक संकेत खो जाता।
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: विवेकहीनता से भर गया
  rationale: ἀλογιστία में तर्कहीनता और मूर्खतापूर्ण अविवेक, दोनों का भाव है; यह हिन्दी पदबंध मानसिक और नैतिक बल बनाए रखता है।
- source_word: τὰς γινομένας ... μεταβολὰς τῆς ψυχῆς
  choice: उसके भीतर मन के जो परिवर्तन हो रहे थे
  rationale: ψυχή का शाब्दिक अर्थ ‘प्राण/आत्मा’ हो सकता है, पर यहाँ आंतरिक मनोदशा या हृदय-परिवर्तन का अर्थ है। ‘मन के परिवर्तन’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की आंतरिकता को बनाए रखता है।
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: यहूदियों की देखरेख के लिए
  rationale: ἐπισκοπή में निरीक्षण, देखरेख या सुध लेने की अर्थ-सीमा है। ‘देखरेख’ जानबूझकर इतना व्यापक है कि वाक्यांश को केवल प्रशासनिक निरीक्षण या सीधे संरक्षण तक सीमित न करे।
- source_word: παρ' οὐδὲν ἡγούμενος
  choice: उन्हें उसने कुछ भी महत्त्व नहीं दिया
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है, जिसका अर्थ किसी बात को नगण्य समझना है।
- source_word: ἀτελέστατον ... ὅρκον
  choice: ऐसी शपथ ... जो पूरी हो ही नहीं सकती थी
  rationale: ἀτελέστατον में पूरा न होने या निष्फल रहने का प्रबल भाव है। यह अनुवाद कथात्मक विडंबना को व्यक्त करता है, बिना इसे ‘पूर्णतम’ का उलटा अर्थ दिए।
- source_word: βεβαίως ὅρκον ὁρισάμενος
  choice: दृढ़तापूर्वक ... शपथ ठानी
  rationale: ὁρίζομαι संकल्पपूर्वक निश्चित करने और βεβαίως दृढ़ता का भाव देता है; ‘शपथ ठानी’ हिन्दी में इस निश्चय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνυπερθέτως
  choice: बिना देर किए
  rationale: इसका अर्थ स्थगित या विलंबित किए बिना है।
- source_word: πέμψειν εἰς ἅιδην
  choice: अधोलोक भेज देगा
  rationale: ἅιδης मृतकों के लोक को सूचित करता है। ‘अधोलोक’ यूनानी कल्पना को बनाए रखता है और ‘नरक’ से जुड़ी बाद की दंड-संबंधी धारणाएँ आरोपित नहीं करता।
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: पशुओं से घुटनों और पैरों में बुरी तरह नुचवाकर
  rationale: αἰκίζω निर्दयतापूर्वक दुर्व्यवहार करने, विकृत करने या अंगों को नोचने का भाव देता है; यह रूप हिंसा और निर्दिष्ट अंगों दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ἅιδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; कब्र; नरक
  rationale: ‘अधोलोक’ मूल यूनानी संसार-कल्पना के निकट है। ‘नरक’ दंड के विषय में ऐसा निश्चित धर्मवैज्ञानिक अर्थ जोड़ सकता है जो यहाँ स्पष्ट नहीं है, जबकि ‘कब्र’ स्थानगत कल्पना को अत्यधिक सीमित कर देता है।
- issue: यहूदियों के संबंध में ἐπισκοπή का आशय
  choice: देखरेख
  alternative: निरीक्षण; सुध लेना; संरक्षण
  rationale: संदर्भ में राजा के भीतर के परिवर्तन यहूदियों के हित या उनकी ओर ध्यान से जुड़े हैं, पर यूनानी शब्द स्वयं निरीक्षण, ध्यान और देखरेख के बीच खुला है। इसलिए अधिक निश्चित ‘संरक्षण’ थोपने के बजाय व्यापक शब्द चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। लंबे यूनानी वाक्य को स्पष्टता के लिए छोटे वाक्यों में बाँटा गया है, पर अंतिम अल्पविराम रखा गया है क्योंकि पद आगे आने वाले वाक्य में जारी रहता है। फ़ालारिस का नाम और अधोलोक की सांस्कृतिक छवि सुरक्षित रखी गई है।
