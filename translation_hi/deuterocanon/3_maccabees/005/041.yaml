  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: hi
  text: इसी कारण उस प्रतीक्षा[a] से नगर में खलबली मची हुई है; और जमावड़ों[b] से भरता जा रहा नगर पहले ही बार-बार[c] लूटे जाने के खतरे में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उस प्रत्याशा से” या “उस अनिश्चित प्रतीक्षा से”; यूनानी शब्द प्रतीक्षा या आनेवाली बात की प्रत्याशा की अवस्था को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “भीड़ों से” या “एकत्र समूहों से।”
    reason: lexical_alternative
  - marker: c
    text: अथवा, “अक्सर” या “कई बार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: इसी कारण
  rationale: यह पद पिछले प्रसंग की परिस्थितियों का कारणात्मक परिणाम बताता है; ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक और निकट अर्थ देता है।
- source_word: ἡ πόλις
  choice: नगर
  rationale: यूनानी शब्द सीधे नगर को सूचित करता है, यद्यपि उसके निवासी भी आशय में शामिल हैं; ‘नगर’ मूल बिंब को बनाए रखता है।
- source_word: διὰ τὴν προσδοκίαν
  choice: उस प्रतीक्षा से
  rationale: προσδοκία का मूल अर्थ प्रतीक्षा या प्रत्याशा है। ‘उस’ इसे पिछले प्रसंग से जोड़ता है और मूल की व्यापकता को किसी निश्चित भाव—जैसे भय—तक सीमित नहीं करता।
- source_word: ὀχλεῖ
  choice: खलबली मची हुई है
  rationale: यहाँ क्रिया नगर के व्याकुल या हलचल में होने का भाव देती है। यह वाक्यांश नागरिक अशांति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πληθύνουσα
  choice: भरता जा रहा
  rationale: वर्तमान कृदन्त बढ़ती हुई स्थिति को दर्शाता है; जमावड़ों के साथ ‘भरता जा रहा’ हिन्दी में स्वाभाविक रूप से उस वृद्धि को व्यक्त करता है।
- source_word: συστροφαῖς
  choice: जमावड़ों से
  rationale: शब्द एकत्र हुए समूहों, भीड़ों या सामूहिक जमावों को सूचित कर सकता है। ‘जमावड़ों’ में सामूहिक एकत्रीकरण का भाव रहता है, पर यह उन्हें अनिवार्य रूप से हिंसक भीड़ नहीं ठहराता।
- source_word: ἤδη
  choice: पहले ही
  rationale: यह बताता है कि खतरा केवल भविष्य का नहीं, वर्तमान में विकसित हो चुका है।
- source_word: κινδυνεύει
  choice: खतरे में है
  rationale: यह क्रिया जोखिम या संकट में होने का सामान्य अर्थ रखती है; चुना हुआ रूप सरल और सटीक है।
- source_word: πολλακὶς
  choice: बार-बार
  rationale: यूनानी क्रियाविशेषण ‘कई बार’ या ‘अक्सर’ का अर्थ देता है। ‘बार-बार’ दोहराए जाने वाले खतरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαρπασθῆναι
  choice: लूटे जाने
  rationale: कर्मवाच्य अनंत क्रिया नगर के लूट या लूटपाट का शिकार होने के ठोस खतरे को व्यक्त करती है।
