translation:
  language: hi
  text: तब राजा ने उन्हीं नियमों[a] के अनुसार पूरे भोज की व्यवस्था करके उनसे आनंद में मग्न होने का आग्रह किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हीं कानूनों।’ यूनानी νόμοι का अर्थ कानून, नियम या प्रचलित व्यवस्थाएँ हो सकता है; यहाँ भोज का प्रसंग व्यावहारिक नियमों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  choice: तब उन्हीं नियमों के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को ‘के अनुसार’ से व्यक्त किया गया है। νόμοι का मूल अर्थ ‘कानून’ भी हो सकता है, पर भोज की व्यवस्था के प्रसंग में ‘नियम’ अधिक स्वाभाविक है; αὐτούς के लिए ‘उन्हीं’ रखा गया है। δέ को प्रसंगगत क्रमसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: ὁ βασιλεὺς συστησάμενος πᾶν τὸ συμπόσιον
  choice: राजा ने पूरे भोज की व्यवस्था करके
  rationale: सहायक कृदंत συστησάμενος राजा द्वारा पहले भोज को व्यवस्थित करने की क्रिया बताता है; इसलिए ‘व्यवस्था करके’ स्वाभाविक और क्रम-संगत है। πᾶν और συμπόσιον को ‘पूरे भोज’ से व्यक्त किया गया है।
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: आनंद मनाने
  rationale: यह पद आनंद की ओर मुड़ने या आनंदमय अवस्था में आने का भाव देता है। हिन्दी में ‘आनंद मनाने’ प्रसंगानुकूल और सहज है, यद्यपि ‘आनंद की ओर मुड़ने’ का रूपक अनुवाद में स्पष्ट रूप से नहीं रखा गया।
- source_word: παρεκάλει
  choice: आग्रह किया
  rationale: παρακαλέω यहाँ उत्सव में सम्मिलित लोगों को प्रोत्साहित या प्रेरित करने का भाव रखता है। ‘आग्रह किया’ उसके बल को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है; निहित कर्म को ‘उनसे’ के रूप में स्पष्ट किया गया है।
