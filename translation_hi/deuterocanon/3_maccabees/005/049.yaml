base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: hi
  text: उस घड़ी को अपने जीवन का अंतिम निर्णायक मोड़ और अपनी अत्यंत दुःखद प्रतीक्षा[a] का अंत मानकर, वे करुणा और विलाप से भर गए। वे एक-दूसरे को बार-बार चूमते, अपने संबंधियों से लिपटते और उनकी गर्दनों से जा लगते थे[b]—माता-पिता अपने बच्चों से और माताएँ अपनी जवान बेटियों[c] से। कुछ दूसरी स्त्रियाँ नवजात शिशुओं को अपनी छाती से लगाए थीं, जो अंतिम बार दूध पी रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी अत्यंत दुःखद आशंका का अंत।” यूनानी शब्द προσδοκία किसी आने वाली बात की अपेक्षा, आशंका या उसकी प्रतीक्षा को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “गर्दनों पर गिर पड़ते थे।” यह शोक या स्नेह में किसी से लिपट जाने का यूनानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, “युवतियों।” यहाँ परिवार के सदस्यों की जोड़ियों का प्रसंग होने के कारण “जवान बेटियों” अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: अपने जीवन का अंतिम निर्णायक मोड़
  rationale: ῥοπή में झुकाव, पलड़ा बदलने या निर्णायक मोड़ का बिंब है। ‘अंतिम निर्णायक मोड़’ आसन्न मृत्यु के भाव को स्पष्ट रखते हुए इस बिंब को बचाता है।
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: अपनी अत्यंत दुःखद प्रतीक्षा का अंत
  rationale: προσδοκία अपेक्षा, आशंका या प्रतीक्षा को सूचित कर सकता है। प्रसंग में वे आने वाली मृत्यु की प्रतीक्षा कर रहे हैं, इसलिए ‘दुःखद प्रतीक्षा’ स्वाभाविक है और मूल की अनिश्चितता को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: करुणा और विलाप से भर गए
  rationale: οἶκτος की करुणा और γόοι के शोकपूर्ण विलाप को अलग-अलग रखा गया है; हिंदी में भावावस्था के परिवर्तन को स्वाभाविक ढंग से व्यक्त करने के लिए ‘से भर गए’ चुना गया है।
- source_word: κατεφίλουν
  choice: बार-बार चूमते
  rationale: अपूर्ण काल और क्रिया की तीव्रता निरंतर या पुनरावृत्त विदाई-चुंबनों का संकेत देती है।
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: अपने संबंधियों से लिपटते
  rationale: यह चयन शारीरिक आलिंगन और निकट परिजनों से भावनात्मक रूप से चिपके रहने, दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: उनकी गर्दनों से जा लगते थे
  rationale: शाब्दिक बिंब को बनाए रखते हुए यूनानी मुहावरे का भाव—शोक या प्रेम में किसी से लिपट जाना—स्वाभाविक हिंदी में दिया गया है।
- source_word: νεάνισιν
  choice: जवान बेटियों
  rationale: शब्द का सामान्य अर्थ ‘युवतियाँ’ है, पर माता-पिता और बच्चों के पारिवारिक समानांतर में ‘बेटियों’ का संबंध निहित है। ‘जवान’ उनकी आयु-श्रेणी को भी बनाए रखता है।
- source_word: νεογνὰ ... βρέφη
  choice: नवजात शिशुओं
  rationale: दोनों शब्द शिशुओं की अत्यल्प आयु और असहायता पर बल देते हैं; ‘नवजात शिशु’ हिंदी में वही भाव संक्षेप और गरिमा से देता है।
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: अंतिम बार दूध पी रहे थे
  rationale: ἕλκω यहाँ स्तन से दूध खींचने या चूसने को दर्शाता है। हिंदी में ‘दूध पीना’ शिशु के स्तनपान की स्वाभाविक अभिव्यक्ति है, जबकि ‘अंतिम बार’ आसन्न मृत्यु की मार्मिकता रखता है।
