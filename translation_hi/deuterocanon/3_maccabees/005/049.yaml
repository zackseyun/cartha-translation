  register: भाषा आधुनिक मानक हिंदी, भावपूर्ण किंतु संयत और सार्वजनिक पाठ के योग्य रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है। मूल के विदाई-दृश्य, पुनरावृत्त क्रियाओं और स्तनपान करते नवजातों की मार्मिकता को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखा गया है।
