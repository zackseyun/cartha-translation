    reason: alternative_reading
lexical_decisions:
- source_word: καθόπλισον
  choice: युद्ध-सज्जित कर दो
  rationale: यह एकवचन आज्ञार्थक क्रिया हाथियों को युद्ध के लिए हथियारों और आवश्यक साज-सामान से तैयार करने का आदेश देती है। ‘युद्ध-सज्जित कर दो’ आधुनिक हिन्दी में इस सैन्य भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔτι καὶ νῦν
  choice: अभी से ही
  rationale: यह पदबंध आदेश की तात्कालिकता और बल को उभारता है। ‘अभी से ही’ तैयारी को इसी समय आरम्भ करने का भाव सुरक्षित रखता है।
- source_word: εἰς τὴν αὔριον
  choice: कल के लिए
  rationale: यह पदबंध अगले दिन को ध्यान में रखकर की जा रही तैयारी बताता है। ‘कल के लिए’ मूल यूनानी की समय-संबंधी दिशा को संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: के विनाश के लिए
  rationale: ἀφανισμός प्रबल नाश, मिटा दिए जाने या सर्वनाश का अर्थ दे सकता है। ‘विनाश’ अर्थ की गंभीरता बनाए रखता है, जबकि अधिक तीव्र विकल्प को पादटिप्पणी में दर्ज किया गया है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: इस प्रवासी हेलेनिस्टिक संदर्भ में यह पद केवल यहूदिया प्रदेश के निवासियों के बजाय जातीय-धार्मिक समुदाय को सूचित करता है; इसलिए ‘यहूदियों’ अधिक उपयुक्त है।
theological_decisions:
- issue: प्रवासी हेलेनिस्टिक संदर्भ में Ἰουδαῖοι का अनुवाद
  choice: यहूदियों
  alternative: यहूदिया-निवासियों
  rationale: कथा में लक्ष्य टॉलेमी शासन के अधीन पहचाना जाने वाला यहूदी जातीय-धार्मिक समुदाय है, न कि केवल यहूदिया के भौगोलिक निवासी। यह मुख्यतः ऐतिहासिक और शब्दार्थगत निर्णय है।
