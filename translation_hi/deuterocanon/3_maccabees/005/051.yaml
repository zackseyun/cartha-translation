  yaml_path: translation/deuterocanon/3_maccabees/005/051.yaml
  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
translation:
  language: hi
  text: उन्होंने बहुत ऊँची आवाज़ में पुकारा और सबके अधिपति से विनती की कि वह प्रकट होकर उन पर दया करे[a], क्योंकि वे पहले ही अधोलोक के द्वारों पर खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकटन के साथ उन पर दया करे।” यूनानी पदबंध का शाब्दिक अर्थ “प्रकटन/प्रकट होने के साथ” है और यह इस बात पर बल दे सकता है कि माँगी गई दया खुले रूप में दिखाई दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: उन्होंने ... पुकारा
  rationale: यह क्रिया सामूहिक और ऊँची पुकार को व्यक्त करती है; ‘पुकारा’ आधुनिक हिन्दी में स्वाभाविक है और संकट की तीव्रता बनाए रखता है।
- source_word: φωνῇ μεγάλῃ σφόδρα
  choice: बहुत ऊँची आवाज़ में
  rationale: μεγάλῃ और σφόδρα दोनों से प्राप्त तीव्रता को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: सबके अधिपति
  rationale: δυνάστης सत्ता और प्रभुत्व रखने वाले को सूचित करता है; ‘अधिपति’ गरिमापूर्ण किंतु बोधगम्य है, और ἁπάσης की व्यापकता ‘सबके’ से बनी रहती है।
- source_word: ἱκετεύοντες
  choice: विनती की
  rationale: यह कृदन्त व्याकुल और earnest याचना बताता है; हिन्दी वाक्य-प्रवाह के लिए इसे समापिका क्रिया के साथ समन्वित किया गया है।
- source_word: οἰκτείραι
  choice: उन पर दया करे
  rationale: प्रार्थना के प्रसंग में करुणामय हस्तक्षेप की याचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετὰ ἐπιφανείας
  choice: प्रत्यक्ष रूप से उनकी सहायता के लिए आए
  rationale: शाब्दिक अर्थ ‘प्रकटन/प्रकट होने के साथ’ है। प्रसंग में यह खुले और दिखाई देने वाले दैवी हस्तक्षेप की याचना है; मुख्य पाठ अर्थ को सहज बनाता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: ἤδη
  choice: पहले ही
  rationale: उनके संकट की तात्कालिकता और अत्यन्त निकटता को बनाए रखता है।
- source_word: πρὸς πύλας ᾅδου
  choice: अधोलोक के द्वारों पर
  rationale: मृत्यु के अत्यन्त निकट होने की स्थानिक उपमा को बनाए रखता है; ‘अधोलोक’ ᾅδης का धर्मसिद्धान्तगत रूप से कम विशिष्ट और हिन्दी में बोधगम्य रूप है।
- source_word: καθεστῶτας
  choice: खड़े थे
  rationale: उनकी वर्तमान स्थिति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहूदी-यूनानी द्वितीयकानूनी प्रसंग में ᾅδου का अनुवाद
  choice: अधोलोक
  alternative: हेडीस; मृतकों का लोक; मृत्यु
  rationale: ‘अधोलोक’ मूल की स्थानिक छवि को बनाए रखता है और इसे ‘नरक’ कहकर बाद की दण्ड-संबंधी धर्मशास्त्रीय विशिष्टता नहीं जोड़ता।
- issue: μετὰ ἐπιφανείας में दैवी प्रकटन और प्रत्यक्ष सहायता का संबंध
  choice: प्रत्यक्ष रूप से उनकी सहायता के लिए आए
  alternative: प्रकटन के साथ उन पर दया करे
  rationale: वाक्य-संदर्भ दया के खुले, दिखाई देने वाले हस्तक्षेप की याचना की ओर संकेत करता है, पर यूनानी पदबंध केवल ‘प्रकटन के साथ’ भी समझा जा सकता है; इसलिए वैकल्पिक औपचारिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘अधिपति’ प्रार्थना की ऊँची शैली बनाए रखता है; ‘अधोलोक’ मूल छवि को बचाते हुए ‘नरक’ जैसी अतिरिक्त धर्मशास्त्रीय विशिष्टता से बचता है।
