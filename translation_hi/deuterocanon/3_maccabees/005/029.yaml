  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल यूनानी में हेरमोन और सभी मित्र संयुक्त कर्ता हैं, यद्यपि उनसे पहले आई क्रिया एकवचन है; हिन्दी में अर्थानुसार बहुवचन प्रयोग किया गया है। प्रत्यक्ष कथन का स्पष्ट वक्ता मूल में नहीं बताया गया, इसलिए ‘उन्होंने कहा’ बहुवचन समूह को स्वाभाविक ढंग से जोड़ता है, बिना किसी एक वक्ता को निर्धारित किए।
