  yaml_path: translation/deuterocanon/3_maccabees/005/029.yaml
  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: hi
  text: 'हेरमोन और सभी मित्र[b] पशुओं और सैन्य-बलों को दिखा रहे थे[a]: “हे राजा, ये तुम्हारे उस इरादे[c] के अनुसार तैयार हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इशारा करके दिखा रहे थे’ या ‘प्रदर्शित कर रहे थे’। यूनानी का अपूर्ण भूतकाल बताता है कि यह क्रिया चल रही थी।
    reason: lexical_alternative
  - marker: b
    text: ‘मित्र’ से यूनानी राजदरबार के राजकीय सहयोगी या दरबारी भी अभिप्रेत हो सकते हैं।
    reason: cultural_note
  - marker: c
    text: या ‘उस योजना’ या ‘उस उद्देश्य’ के अनुसार।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: दिखा रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को व्यक्त करता है। ‘दिखा रहे थे’ इस प्रगतिशील भाव को स्वाभाविक हिन्दी में बनाए रखता है; अर्थ ‘इशारा करके दिखा रहे थे’ भी हो सकता है।
- source_word: ὁ Ἕρμων καὶ πάντες οἱ φίλοι
  choice: हेरमोन और सभी मित्र
  rationale: क्रिया एकवचन में है, पर क्रिया से बाद आने वाला संयुक्त कर्ता ‘हेरमोन और सभी मित्र’ है; मूल यूनानी की इस व्याकरणिक असंगति को अर्थ की दृष्टि से बहुवचन कर्ता के रूप में प्रस्तुत किया गया है। ‘मित्र’ को दरबारी पद मान लेना सम्भव है, पर मुख्य पाठ में वह अर्थ आरोपित नहीं किया गया।
- source_word: τὰ θηρία
  choice: पशुओं
  rationale: संदर्भ में ये संभवतः दंड के लिए तैयार किए गए हाथी हैं, किन्तु यूनानी शब्द व्यापक है; इसलिए मुख्य पाठ में ‘पशु’ रखा गया है।
- source_word: τὰς δυνάμεις
  choice: सैन्य-दलों
  rationale: बहुवचन δύναμις यहाँ सैन्य-बलों या टुकड़ियों का संकेत देता है। ‘सैन्य-दल’ अर्थ को स्पष्ट करता है, पर उनकी ठीक संरचना निर्धारित नहीं करता।
- source_word: Ἡτοίμασται
  choice: ये ... तैयार हैं
  rationale: पूर्णकालिक रूप तैयारी के फलस्वरूप वर्तमान तैयार अवस्था बताता है। यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन हो सकती है; हिन्दी में स्वाभाविक बहुवचन रखा गया है।
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: सम्बोधन कारक को गरिमापूर्ण और प्रत्यक्ष हिन्दी सम्बोधन से व्यक्त किया गया है।
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: तुम्हारे उस इरादे के अनुसार
  rationale: πρόθεσις का अर्थ ‘इरादा’, ‘उद्देश्य’ या ‘योजना’ हो सकता है। ‘उस’ यूनानी ἐκείνην के पूर्वोक्त या संकेतात्मक बल को बनाए रखता है।
