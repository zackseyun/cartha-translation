    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: पर ठीक उसी समय
  rationale: ἄρτι तात्कालिकता व्यक्त करता है और δέ यहाँ हल्का संक्रमण या विरोध दर्शाता है; यह पदबंध कथा के अचानक मोड़ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: भोर में मुर्गा बाँग दे चुका था
  rationale: ἀλέκτρυων का अर्थ मुर्गा और ὄρθρος का अर्थ भोर है। पूर्वकालिक क्रिया को ‘दे चुका था’ से व्यक्त किया गया है, जबकि भोर को समय-सूचक रखा गया है।
- source_word: τὰ θηρία
  choice: हिंसक पशुओं
  rationale: निष्पादन के संदर्भ में θηρία सामान्य पशुओं के बजाय खतरनाक पशुओं को सूचित करता है; ‘हिंसक पशु’ उस भयावहता को बनाए रखता है, पर किसी विशिष्ट प्रजाति का अनुमान नहीं लगाता।
- source_word: καθωπλικὼς
  choice: सुसज्जित करके
  rationale: καθοπλίζω का मूल अर्थ हथियारबंद या पूरी तरह सुसज्जित करना है। पशुओं के लिए शाब्दिक ‘हथियारबंद’ हिन्दी में भ्रामक हो सकता है; ‘सुसज्जित’ मूल की तैयारी और उपकरण—दोनों संभावनाएँ खुली रखता है।
- source_word: διεκίνει
  choice: हाँक रहा था
  rationale: διακινέω का अर्थ चलाना, गति में लाना या इधर-उधर घुमाना हो सकता है। पशुओं को सक्रिय रूप से नियंत्रित करने के प्रसंग में ‘हाँक रहा था’ स्वाभाविक और सजीव है।
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: बड़े स्तंभयुक्त प्रांगण में
  rationale: περιστύλιον स्तंभों से घिरे वास्तु-स्थान को दर्शाता है। ‘स्तंभयुक्त प्रांगण’ सामान्य पाठक के लिए बोधगम्य है और तकनीकी शब्द के बिना वास्तु-संकेत बनाए रखता है।
- source_word: ὁ Ἕρμων
  choice: हेरमोन
  rationale: यूनानी नाम Ἕρμων का देवनागरी लिप्यंतरण।
