  text: पर ठीक उसी समय, भोर में मुर्गा बाँग दे चुका था, और हेरमोन उन जंगली पशुओं को सुसज्जित करके बड़े स्तंभयुक्त प्रांगण[a] में हाँक रहा था।
  philosophy: optimal-equivalence
  footnotes:
