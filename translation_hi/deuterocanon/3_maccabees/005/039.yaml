- source_word: θαυμάζοντες
  choice: अचम्भा किया
  rationale: यह आश्चर्य या विस्मय की प्रतिक्रिया व्यक्त करता है, बिना उसे प्रशंसा मान लेने के।
- source_word: προεφέροντο
  choice: कहते रहे
  rationale: अपूर्ण भूतकाल निरन्तर या बार-बार होने वाली क्रिया का संकेत देता है, जिसे ‘कहते रहे’ व्यक्त करता है।
- source_word: τάδε
  choice: ये बातें
  rationale: यह आगे आने वाले कथन की ओर संकेत करने वाला सामान्य सूत्र है।
