lexical_decisions:
- source_word: ὁ ... προσταχθεὶς
  choice: जिस व्यक्ति को ये आदेश दिए गए थे
  rationale: भाववाचक कृदंत और τάδε पिछले संदर्भ में आदेश पाए व्यक्ति की ओर संकेत करते हैं। यह रूप निष्क्रिय अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐτρέπετο
  choice: लग गया
  rationale: अपूर्णकालीन मध्यम रूप किसी गतिविधि की ओर स्वयं प्रवृत्त होने का भाव देता है; ‘लग गया’ हिन्दी में इस संक्रमण को सहज रूप से व्यक्त करता है।
- source_word: τὴν εὐωχίαν
  choice: भोज करने में
  rationale: εὐωχία उत्सवी खाने-पीने या दावत का द्योतक है। ‘भोज करने में’ क्रियात्मक हिन्दी प्रवाह देता है, जबकि पादटिप्पणी अधिक औपचारिक संज्ञात्मक विकल्प सुरक्षित रखती है।
- source_word: συναγαγὼν
  choice: उसने ... इकट्ठा किया
  rationale: यह कृदंत मुख्य क्रिया के साथ जुड़ी कार्रवाई बताता है। हिन्दी में समन्वित पूर्ण क्रिया अर्थ और क्रम को अधिक स्पष्ट तथा स्वाभाविक बनाती है।
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: अपने मित्रों तथा सेना में से उन लोगों को ... सबसे अधिक
  rationale: यह मित्रों और सेना—दोनों समूहों में से एक उपसमूह चुनता है, जिसे अगला पद उनकी शत्रुतापूर्ण मनोवृत्ति के आधार पर पहचानता है।
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: जो यहूदियों के प्रति सबसे अधिक शत्रुता रखते थे
  rationale: यूनानी मुहावरा यहूदियों के प्रति विरोधी या शत्रुतापूर्ण मनोवृत्ति व्यक्त करता है। यह चयन उसकी तीव्रता को स्पष्ट रखता है, बिना उसे अनावश्यक रूप से बढ़ाए।
