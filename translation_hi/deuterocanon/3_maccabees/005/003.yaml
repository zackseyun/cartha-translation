  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: hi
  text: इसलिए जिसे ये आदेश दिए गए थे, वह अपने मित्रों और सेना में से उन लोगों को इकट्ठा करके, जो यहूदियों के प्रति सबसे अधिक शत्रुतापूर्ण थे, दावत की ओर मुड़ गया[a]।
