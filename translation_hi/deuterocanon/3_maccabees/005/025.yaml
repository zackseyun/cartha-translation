base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: hi
  text: पर यहूदी[a], उस अखंड समय के दौरान मन से एक होते हुए, अपने हाथ आकाश की ओर फैलाकर, करुण विलाप के स्वरों में आँसुओं-भरी गुहार लगाते हुए महानतम परमेश्वर से विनती कर रहे थे कि वह फिर से अविलंब उनकी सहायता करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस अखंड समय में एक प्राण होते हुए।” यूनानी अभिव्यक्ति असामान्य और सघन है; उसमें निरंतर समय और समुदाय की भीतरी एकता—दोनों विचार जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ
  choice: अखंड
  rationale: विशेषण का मूल अर्थ ‘जो विभाजित न हो’ है; ‘अखंड समय’ यूनानी की असामान्य अभिव्यक्ति और निरंतर अवधि—दोनों को बनाए रखता है।
- source_word: ψυχοκοινούμενοι
  choice: मन से एक होते हुए
  rationale: यह दुर्लभ संयुक्त रूप भीतरी या प्राणगत सामुदायिक एकता बताता है। ‘मन से एक’ आधुनिक हिन्दी में स्वाभाविक है और उस साझा आंतरिक एकता को व्यक्त करता है।
- source_word: πολυδάκρυν ἱκετίαν
  choice: बहुत आँसुओं के साथ विनती
  rationale: यह पद आँसुओं की बहुतायत से युक्त अनुनय को व्यक्त करता है; हिन्दी रूप भावात्मक तीव्रता को स्पष्ट रखता है।
- source_word: ἐν μέλεσιν γοεροῖς
  choice: करुण विलाप के स्वरों में
  rationale: μέλη गीत, धुन या स्वर और γοερός शोकपूर्ण विलाप का भाव देता है; यह रूप प्रार्थना के गेय एवं करुण स्वर को बनाए रखता है।
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: अपने हाथ आकाश की ओर फैलाकर
  rationale: प्रार्थना की पारंपरिक शारीरिक मुद्रा और ऊपर की दिशा दोनों सीधे व्यक्त होते हैं।
- source_word: ἐδέοντο
  choice: विनती करने लगे
  rationale: क्रिया गंभीर और आग्रहपूर्ण प्रार्थना को दर्शाती है; ‘विनती’ प्रसंग के अनुरूप गरिमापूर्ण और सहज है।
- source_word: τοῦ μεγίστου θεοῦ
  choice: महानतम परमेश्वर
  rationale: यूनानी में μέγας का श्रेष्ठतम रूप है। ‘महानतम’ इसे सीधे सुरक्षित रखता है और ‘परमप्रधान’ जैसी भिन्न पारंपरिक उपाधि नहीं जोड़ता।
- source_word: πάλιν
  choice: फिर से
  rationale: यह पूर्व में मिली सहायता के बाद नए दैवी हस्तक्षेप की प्रार्थना को सीधे व्यक्त करता है।
- source_word: συντόμως
  choice: अविलंब
  rationale: इस प्रार्थना में क्रिया-विशेषण शीघ्र सहायता की तात्कालिकता बताता है; ‘अविलंब’ संक्षिप्त, गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: τοῦ μεγίστου θεοῦ का अनुवाद
  choice: महानतम परमेश्वर
  alternative: परमप्रधान परमेश्वर; सर्वोच्च परमेश्वर
  rationale: मूल में स्पष्ट रूप से ‘महान’ का श्रेष्ठतम रूप है, कोई अलग स्थापित उपाधि नहीं। इसलिए शाब्दिक अतिशयोक्ति को सुरक्षित रखा गया है और परिचित किंतु भिन्न ‘परमप्रधान’ नहीं अपनाया गया।
- issue: ψυχοκοινούμενοι में सामुदायिक एकता का स्वरूप
  choice: मन से एक होते हुए
  alternative: आत्मा में एक होते हुए; एक प्राण होते हुए
  rationale: दुर्लभ पद को किसी विशिष्ट पवित्र-आत्मा संबंधी अर्थ में सीमित किए बिना आंतरिक सामुदायिक एकता के रूप में रखा गया है।
