  rationale: यह मुहावरा उस तत्काल मामले या कार्य को दर्शाता है जो विचार या कार्रवाई के लिए सामने था।
- source_word: ὤτρυνε
  choice: उकसाया
  rationale: ὀτρύνω किसी को कार्रवाई के लिए प्रेरित, दबावपूर्ण ढंग से आगे बढ़ाने या उकसाने का अर्थ रखता है; शत्रुतापूर्ण कथानक में ‘उकसाया’ इसकी तीव्रता को बनाए रखता है।
