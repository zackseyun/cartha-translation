- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: घुड़दौड़ के मैदान में उमड़ी ... से पूरी तरह भर चुका था
  rationale: καταμεστόω ठसाठस या पूर्णतः भर जाने का प्रबल भाव देता है, जबकि κατὰ τοῦ ἱπποδρόμου भीड़ के घुड़दौड़-मैदान में फैले या वहाँ एकत्र होने की स्थानगत सूचना देता है।
- source_word: εἰς τὴν αὐλήν
  choice: राजमहल के प्रांगण में
  rationale: αὐλή किसी भवन के आँगन या राजकीय निवास के प्रांगण को सूचित कर सकता है। राजा से भेंट के प्रसंग में यह स्पष्ट और स्वाभाविक है, पर इसकी शब्दगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐπὶ τὸ προκείμενον
