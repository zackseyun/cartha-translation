  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
translation:
  language: hi
  text: भोर के आसपास, जब नगर घुड़दौड़ के मैदान में उमड़े असंख्य जनसमूहों से पहले ही पूरी तरह भर चुका था, वह राजमहल के प्रांगण[a] में गया और उस सामने पड़े मामले में आगे बढ़ने के लिए राजा को उकसाया।
  philosophy: optimal-equivalence
  footnotes:
