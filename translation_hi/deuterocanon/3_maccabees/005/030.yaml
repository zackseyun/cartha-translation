  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: hi
  text: 'परन्तु वह कही गई बातों पर भारी क्रोध से भर गया, क्योंकि इन बातों के विषय में उसका सारा इरादा परमेश्वर की देखरेख से विफल हो गया था। उसने धमकी देते हुए ज़ोर देकर कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρεῖ χόλῳ
  choice: भारी क्रोध
  rationale: विशेषण βαρεῖ का मूल अर्थ ‘भारी’ रखते हुए तीव्र और बोझिल क्रोध का भाव सुरक्षित किया गया है; इसे केवल ‘भयंकर’ बनाकर अर्थ को अनावश्यक रूप से नहीं बदला गया।
- source_word: προνοίᾳ θεοῦ
  choice: परमेश्वर की पूर्वव्यवस्था
  rationale: πρόνοια यहाँ परमेश्वर की सक्रिय देखरेख और घटनाओं के नियमन को व्यक्त करता है; ‘पूर्वव्यवस्था’ संक्षिप्त रूप में इस धार्मिक अर्थ को बनाए रखती है।
- source_word: πᾶν αὐτοῦ νόημα
  choice: उसका सारा इरादा
  rationale: νόημα विचार, अभिप्राय या मंशा को सूचित कर सकता है; प्रसंग में कार्य-संबंधी उद्देश्य के लिए स्वाभाविक हिन्दी ‘इरादा’ चुना गया है।
- source_word: διεσκεδάσθαι
  choice: विफल हो गया था
  rationale: शाब्दिक रूप से बिखेर दिए जाने के रूपक को प्रसंगानुकूल परिणाम—इरादे का निष्फल कर दिया जाना—के रूप में व्यक्त किया गया है।
- source_word: ἐντείνων μετὰ ἀπειλῆς
  choice: ज़ोर डालते हुए धमकी भरे स्वर में
  rationale: ἐντείνων की तीव्रता/दबाव और μετὰ ἀπειλῆς की धमकी, दोनों को सहज हिन्दी में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर की πρόνοια द्वारा राजा के इरादे का विफल होना
  choice: परमेश्वर की पूर्वव्यवस्था के कारण
  alternative: परमेश्वर की देखरेख से
  rationale: मूल पाठ प्रत्यक्षतः दैवी πρόνοια को कारण बताता है। ‘पूर्वव्यवस्था’ इस दैवी सक्रियता को बनाए रखती है, बिना उसके तंत्र या किसी संप्रदायगत सिद्धांत को विस्तार से परिभाषित किए।
