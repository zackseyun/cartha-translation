base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: hi
  text: हे राजा, तुम कब तक हमारी परीक्षा लेते रहोगे—अब तीसरी बार उन्हें नष्ट करने की आज्ञा देकर, और फिर इसी मामले में अपना मन बदलकर अपने किए हुए निर्णयों[a] को पलटकर?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी राजाज्ञाओं को।’ यूनानी पद उन बातों को विशेष रूप से सूचित कर सकता है जिन्हें राजा ने आधिकारिक रूप से ठहराया या घोषित किया था, न कि केवल उसके निजी निर्णयों को।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: परीक्षा लेते रहोगे
  rationale: वर्तमान काल और μέχρι τίνος (‘कब तक’) के साथ यह क्रिया लगातार या बार-बार परखने का भाव देती है।
- source_word: προστάσσων
  choice: आज्ञा देते हो
  rationale: राजा द्वारा दिए गए आधिकारिक आदेश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἤδη τρίτον
  choice: अब ... तीसरी बार
  rationale: ἤδη वर्तमान स्थिति तक पहुँचने और τρίτον पुनरावृत्ति का बोध कराता है।
- source_word: αὐτοὺς ἀφανίσαι
  choice: उन्हें नष्ट करने
  rationale: संदर्भ में ἀφανίζω लोगों का पूरी तरह विनाश कर देने को दर्शाता है; हिन्दी में सक्रिय infinitival अभिव्यक्ति स्वाभाविक है।
- source_word: ἐπὶ τῶν πραγμάτων
  choice: जब उस पर अमल करने का समय आता है
  rationale: मुहावरा यहाँ आदेश को वास्तविक कार्यरूप देने की स्थिति की ओर संकेत करता है; यह अनुवाद संदर्भगत अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐκ μεταβολῆς
  choice: अपना मन बदलकर
  rationale: यह इरादे या निर्णय में आए बदलाव को व्यक्त करता है।
- source_word: ἀναλύων
  choice: पलट देते हो
  rationale: संदर्भ में पहले किए गए निर्णयों को रद्द या उलट देने का भाव है।
- source_word: τὰ σοὶ δεδογμένα
  choice: अपने ही किए हुए निर्णयों
  rationale: δεδογμένα उन बातों को सूचित करता है जिन्हें राजा ने निश्चित या आधिकारिक रूप से ठहराया है; मुख्य पाठ में ‘निर्णयों’ सहज है और पादटिप्पणी औपचारिक अर्थ बताती है।
