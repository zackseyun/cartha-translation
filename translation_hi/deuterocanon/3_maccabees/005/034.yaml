translation:
  language: hi
  text: परन्तु मित्रों में से हर एक, उदास मुख से, वहाँ इकट्ठे हुए लोगों को—हर एक को उसके अपने काम पर[b]—विदा कर रहा था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ὑπεκρέων नामक एक असामान्य रूप है, और उपलब्ध स्रोत-पाठ में मामूली पाठगत असंगति चिह्नित है। प्रसंग तथा साथ आई क्रिया ἀπέλυαν के आधार पर यहाँ इकट्ठे लोगों को विदा करने या भेजने का अर्थ लिया गया है।
    reason: textual_variant
  - marker: b
    text: या, “उसके अपने व्यवसाय की ओर” अथवा “उसके अपने मामलों की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθ᾽ εἷς
  choice: हर एक
  rationale: यह वितरणसूचक पद मित्रों को अलग-अलग व्यक्तियों के रूप में प्रस्तुत करता है; ‘हर एक’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: τῶν φίλων
  choice: मित्रों में से
  rationale: φίλοι का मूल अर्थ ‘मित्र’ है। राजदरबार के संदर्भ में यह अधिकारियों या दरबारियों का पदनाम भी हो सकता है, पर इस पद में उससे अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
- source_word: σκυθρωπῶς
  choice: उदास मुख से
  rationale: यह क्रियाविशेषण उदासी, मलिनता या गंभीर अप्रसन्नता से भरे चेहरे का भाव व्यक्त करता है; ‘उदास मुख से’ दृश्य भाव को सहज हिन्दी में रखता है।
- source_word: ὑπεκρέων
  choice: विदा कर दिया
  rationale: यह रूप असामान्य और पाठ की दृष्टि से अनिश्चित है। अगले पद ἀπέλυαν और प्रसंग के आधार पर लोगों को वहाँ से विदा करने का अर्थ लिया गया है, बिना किसी अधिक अनुमानात्मक सूक्ष्म अर्थ को जोड़ने के।
- source_word: τοὺς συνθροισμένους
  choice: इकट्ठे हुए लोगों को
  rationale: कृदन्त उन व्यक्तियों को सूचित करता है जो एक स्थान पर एकत्र हुए थे; यह हिन्दी रूप स्पष्ट और स्वाभाविक है।
- source_word: ἀπέλυαν
  choice: विदा कर दिया
  rationale: ἀπολύω यहाँ सभा में आए लोगों को जाने देने या भेज देने के अर्थ में है; ‘विदा कर दिया’ प्रसंगानुकूल है।
- source_word: ἕκαστον
  choice: एक-एक को
  rationale: एकवचन वितरणसूचक रूप प्रत्येक व्यक्ति को अलग-अलग भेजे जाने पर बल देता है।
- source_word: ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: उसके अपने काम पर
  rationale: ἀσχολία का अर्थ काम, व्यवसाय या व्यस्तता हो सकता है। ‘अपने काम पर’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
