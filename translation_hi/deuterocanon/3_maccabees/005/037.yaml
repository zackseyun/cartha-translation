  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: hi
  text: तब उसने हेरमोन को बुलाकर धमकी देते हुए कहा, “अरे महादुर्भागे, इन्हीं बातों के विषय में मुझे तुझे कितनी बार आज्ञा देनी पड़ेगी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... Ἕρμωνα
  choice: हेरमोन
  rationale: व्यक्तिनाम को यूनानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: προσκαλεσάμενος
  choice: बुलाकर
  rationale: मध्यवाच्य कृदन्त का आशय हेरमोन को अपने पास बुलवाना या बुलाना है; ‘बुलाकर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: μετὰ ἀπειλῆς
  choice: धमकी देते हुए
  rationale: शाब्दिक अर्थ ‘धमकी के साथ’ है; क्रिया-विशेषणात्मक हिन्दी रूप कथन के धमकी-भरे ढंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ποσάκις
  choice: कितनी बार
  rationale: यह आवृत्ति पूछने वाला प्रश्नवाचक क्रिया-विशेषण है और झिड़की के स्वर को बनाए रखता है।
- source_word: δεῖ
  choice: मुझे ... देनी पड़ेगी
  rationale: आवश्यकता के भाव को आधुनिक हिन्दी के स्वाभाविक शिकायतसूचक प्रश्न में व्यक्त किया गया है।
- source_word: σοι ... προστάττειν
  choice: मुझे तुझे ... आज्ञा देनी
  rationale: προστάσσω का अर्थ आदेश देना है; प्रसंग से वक्ता कर्ता है, जिसे हिन्दी में स्पष्ट करना आवश्यक है।
- source_word: περὶ τούτων αὐτῶν
  choice: इन्हीं बातों के विषय में
  rationale: αὐτῶν के बलाघात को ‘इन्हीं’ से सुरक्षित रखा गया है, जिससे पहले से कही गई उन्हीं बातों का संकेत मिलता है।
- source_word: ἀθλιώτατε
  choice: अरे महादुर्भागे
  rationale: सर्वोच्चावस्था वाले सीधे सम्बोधन और तीखे अपमान को ‘महादुर्भागे’ व्यक्त करता है; ‘अरे’ सम्बोधन को हिन्दी में स्वाभाविक बनाता है।
