  yaml_path: translation/deuterocanon/3_maccabees/005/019.yaml
  text: But when the one who had pointed out that during the night the order had been carried through to completion[a], and their friends had borne witness to it,
translation:
  language: hi
  text: परन्तु जब उस व्यक्ति ने बताया कि रात के समय आदेश को पूरी तरह कार्यान्वित कर दिया गया था[a], और उनके मित्रों ने भी इसकी गवाही दी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीट के पाठ में यहाँ जिस यूनानी क्रिया का अनुवाद ‘कार्यान्वित कर दिया गया था’ किया गया है, उसका पाठ और व्याकरणिक रूप कठिन है; फिर भी पूरे उपवाक्य से स्पष्ट है कि सूचना यह दी गई थी कि आदेशित कार्य रात के समय पूरा हो चुका था।
    reason: textual_variant
lexical_decisions:
- source_word: ὑποδείξαντος
  choice: बताया
  rationale: यह कृदन्त किसी बात को ज्ञात कराने या इंगित करने का भाव देता है। यहाँ प्रसंग के अनुसार ‘बताया’ स्वाभाविक है और इसे औपचारिक घोषणा नहीं बनाता।
- source_word: νυκτός
  choice: रात के समय
  rationale: कालवाचक संबंधकारक का यह सहज आधुनिक हिन्दी रूप है और रात के दौरान होने का भाव बनाए रखता है।
- source_word: τὸ προσταγέν
  choice: आदेश
  rationale: प्रστάσσω से बना यह संज्ञीकृत कृदन्त ‘जो आदेश दिया गया था’ को दर्शाता है; ‘आदेश’ संक्षिप्त और प्रशासनिक प्रसंग के अनुकूल है।
- source_word: ἐπὶ τέλος
  choice: पूरी तरह
  rationale: यह पदबंध कार्य के अंत तक पहुँचने या पूर्ण होने का भाव देता है; ‘पूरी तरह’ हिन्दी वाक्य में स्वाभाविक ढंग से पूर्णता व्यक्त करता है।
- source_word: ἠγοχέναι
  choice: कार्यान्वित कर दिया गया था
  rationale: यूनानी रूप पाठगत और रूपात्मक दृष्टि से कठिन है, पर पूरे उपवाक्य का आशय आदेशित कार्य के पूरा कर दिए जाने की सूचना है। यह चयन प्रशासनिक आदेश को अमल में लाने का भाव व्यक्त करता है।
- source_word: προσμαρτυρησάντων
  choice: भी इसकी गवाही दी
  rationale: मूल क्रिया अतिरिक्त या समर्थनकारी साक्ष्य देने का भाव रखती है। ‘भी’ προσ- के योगात्मक बल को और ‘गवाही दी’ साक्ष्य के भाव को बनाए रखता है।
- source_word: φίλων
  choice: मित्रों
  rationale: इस शब्द का सामान्य अर्थ ‘मित्र’ है। राजकीय प्रसंग में यह सहयोगियों या दरबारियों की ओर संकेत कर सकता है, पर इस खंड में सामान्य अर्थ को छोड़ने का पर्याप्त आधार नहीं है।
