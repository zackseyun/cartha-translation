  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। मूल यूनानी की तरह यह पद अगले वाक्यांश पर निर्भर एक अपूर्ण वाक्य-खंड है, इसलिए अंत में अल्पविराम रखा गया है। सर्वनाम αὐτῶν के बहुवचन को ‘उनके’ के रूप में सुरक्षित रखा गया है, यद्यपि इस अकेले पद में उसका पूर्वपद स्पष्ट नहीं है।
