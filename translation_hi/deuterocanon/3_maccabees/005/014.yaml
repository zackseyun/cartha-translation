  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
translation:
  language: hi
  text: जब छठा घंटा लगभग आधा बीत चुका था[a], तब बुलावों के लिए नियुक्त व्यक्ति ने बुलाए गए लोगों को एक साथ इकट्ठा देखा; वह राजा के पास आकर उसे संकेत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “छठे घंटे के लगभग मध्य में।” प्राचीन समय-गणना के अनुसार यह लगभग दोपहर का समय था।
    reason: cultural_note
lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: जब छठे घंटे का लगभग मध्य हो चुका था
  rationale: यह प्राचीन समय-सूचक अभिव्यक्ति को बनाए रखता है और μεσούσης, ἤδη तथा σχεδόν के संयुक्त भाव—समय का लगभग मध्य हो चुकना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: बुलावे की व्यवस्था पर नियुक्त अधिकारी
  rationale: τεταγμένος नियुक्त दायित्व बताता है और κλήσεις यहाँ प्रशासनिक बुलावे हैं। ‘अधिकारी’ प्रसंग में निहित भूमिका को सहज हिन्दी में स्पष्ट करता है, बिना इसे जनगणना या पंजीकरण मानने के।
- source_word: ἀθρόους
  choice: एक ही बड़ी भीड़ में इकट्ठा
  rationale: यह शब्द लोगों के एक साथ सघन समूह के रूप में जमा होने का दृश्यात्मक भाव देता है।
- source_word: τοὺς κλητούς
  choice: बुलाए गए लोगों
  rationale: यह अधिकारपूर्वक बुलाए गए व्यक्तियों को दर्शाता है, सामाजिक निमंत्रण पाने वालों को नहीं।
- source_word: προσελθὼν
  choice: राजा के पास गया
  rationale: पूर्वकालिक कृदंत को हिन्दी में क्रमिक मुख्य क्रिया के रूप में देना स्वाभाविक है।
- source_word: ἔνευσε
  choice: संकेत किया
  rationale: यह किसी संकेत, सिर के इशारे या हावभाव को व्यक्त करता है; ठीक प्रकार का इशारा अनिर्दिष्ट ही रहता है।
