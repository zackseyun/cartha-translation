translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से जटिल यूनानी संरचना स्पष्ट की गई है। राजदरबारी ‘मित्रों’ और प्रस्थान की संक्षिप्त यूनानी अभिव्यक्ति की वास्तविक अर्थ-संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
