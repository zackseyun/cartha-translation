base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/026.yaml
  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: hi
  text: अभी सूर्य की किरणें फैली भी न थीं। जब राजा अपने मित्रों[a] से मिल रहा था, तब हेरमोन सामने आया और उन्हें चल पड़ने के लिए बुलाया[b]। उसने बताया कि राजा इसके लिए उत्सुक और तैयार था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मित्र” राजदरबार का एक आधिकारिक पद भी हो सकता है; इसलिए इसका अर्थ “राजकीय सहचर” या “दरबारी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पद का शाब्दिक अर्थ “प्रस्थान के लिए पुकारा” है; आशय संभवतः वहाँ उपस्थित लोगों को चल पड़ने के लिए बुलाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: अभी सूर्य की किरणें फैली भी न थीं
  rationale: βολαί के मूल चित्र ‘फेंकी/बिखेरी गई किरणों’ को स्वाभाविक हिन्दी में ‘किरणें फैली’ से व्यक्त किया गया है; οὔπω और अपूर्ण भूतकाल का भाव ‘अभी ... न थीं’ में बना रहता है।
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: जब राजा अपने मित्रों से मिल रहा था
  rationale: ἐκδέχομαι यहाँ राजदरबार के लोगों को ग्रहण करने या उनसे मिलने का संकेत देता है। ‘से मिल रहा था’ आधुनिक हिन्दी में स्वाभाविक है और औपचारिक भेंट का प्रसंग बनाए रखता है।
- source_word: τοὺς φίλους
  choice: अपने मित्रों
  rationale: φίλους का सीधा अर्थ ‘मित्रों’ है। हेलेनिस्तीनी राजदरबारी प्रयोग में यह पद राजा के आधिकारिक सहचरों या दरबारियों के लिए भी हो सकता है; इस अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ὁ Ἕρμων παραστὰς
  choice: हेरमोन सामने आया
  rationale: नाम का हिन्दी लिप्यंतरण किया गया है और παραστάς को प्रसंगानुकूल ‘सामने आया’ कहा गया है।
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: उन्हें चल पड़ने के लिए बुलाया
  rationale: यूनानी में बुलाए गए लोगों का कर्म निहित है। हिन्दी में उसे स्पष्ट करके वाक्य को स्वाभाविक बनाया गया है, जबकि ἔξοδος का प्रस्थान-संबंधी अर्थ ‘चल पड़ने’ में सुरक्षित है।
- source_word: ὑποδεικνὺς τὸ πρόθυμον τοῦ βασιλέως ἐν ἑτοίμῳ κεῖσθαι
  choice: उसने बताया कि राजा इसके लिए उत्सुक और तैयार था
  rationale: πρόθυμον में उत्सुकता/तत्परता और ἐν ἑτοίμῳ κεῖσθαι में तैयार होने का भाव है। शब्दशः ‘राजा की उत्सुकता तैयार रखी थी’ हिन्दी में अस्वाभाविक होता, इसलिए दोनों निकटवर्ती भावों को स्पष्ट, स्वाभाविक रूप में रखा गया है।
