- source_word: κατὰ πᾶν ἀμετά-
  choice: अटल
  rationale: दृश्य स्रोत में अंतिम शब्द अधूरा है; प्रसंग में इसका सम्भावित अर्थ ऐसा रोष है जिसे बदला, मोड़ा या शांत नहीं किया जा सकता। ‘अटल’ संक्षिप्त और स्वाभाविक है, पर पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
