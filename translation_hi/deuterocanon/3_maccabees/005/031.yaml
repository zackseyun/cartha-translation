  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: hi
  text: वहाँ उपस्थित सभी माता-पिता अथवा उनकी संतानों ने जंगली पशुओं के लिए यह भरपूर भोज तैयार किया है—उन यहूदियों के स्थान पर, जो दोषरहित सिद्ध हुए हैं और जिन्होंने मेरे तथा मेरे पूर्वजों के प्रति पूर्ण और अटल निष्ठा दिखाई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γονεῖς
  choice: माता-पिताओं
  rationale: यह बहुवचन सामान्यतः माता-पिता या जनकों को सूचित करता है; प्रसंग में आधुनिक और स्पष्ट शब्द ‘माता-पिता’ है।
- source_word: παίδων γόνοι
  choice: उनके साथ के बच्चों
  rationale: यूनानी पदबंध इस पाठ-साक्षी में असामान्य और कुछ पुनरुक्तिपूर्ण है। प्रसंग में यह माता-पिताओं के साथ उपस्थित बच्चों या वंशजों को व्यापक रूप से सूचित करता जान पड़ता है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: θηρσὶν ἀγρίοις
  choice: जंगली पशुओं के लिए
  rationale: यह सम्प्रदान भोजन के लाभार्थी अथवा प्रयोजन को व्यक्त करता है; ‘जंगली पशु’ भयावह और गरिमापूर्ण स्वर बनाए रखता है।
- source_word: δαψιλῆ θοῖναν
  choice: भरपूर भोज
  rationale: पदबंध प्रचुर या विपुल भोज को सूचित करता है और मनुष्यों को पशुओं का आहार बनाए जाने की कटु विडंबना बनाए रखता है।
- source_word: ἀντὶ τῶν ... Ἰουδαίων
  choice: उन यहूदियों के स्थान पर
  rationale: 'ἀντί प्रतिस्थापन व्यक्त करता है: पशुओं के लिए तैयार भोज में यहूदियों की अपेक्षा उपस्थित माता-पिता और बच्चे रखे गए हैं।'
- source_word: ἀνεγκλήτων
  choice: हर प्रकार से निर्दोष
  rationale: शब्द का अर्थ आरोप या दोष से परे होना है; यहाँ राजकीय दृष्टि से निष्कलंक आचरण का भाव है।
- source_word: ἀποδεδειγμένων
  choice: सिद्ध हुए हैं
  rationale: पूर्ण कृदंत पहले से स्थापित और प्रमाणित स्थिति बताता है; ‘सिद्ध हुए हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁλοσχερῆ βεβαίαν πίστιν
  choice: दृढ़ निष्ठावान
  rationale: राजनीतिक-ऐतिहासिक प्रसंग में πίστις मुख्यतः प्रमाणित विश्वसनीयता या राजनिष्ठा का भाव देता है। ‘दृढ़ निष्ठावान’ βεβαίαν और πίστιν को स्वाभाविक हिन्दी में समेटता है, जबकि ὁλοσχερῆ का व्यापक भाव ‘हर प्रकार से’ में व्यक्त है।
theological_decisions:
- issue: गैर-सैद्धान्तिक राजनीतिक प्रसंग में πίστις का अनुवाद
  choice: निष्ठावान
  alternative: विश्वास रखनेवाले; पूरी तरह विश्वसनीय
  rationale: यहाँ बात यहूदियों की राजा और उसके पूर्वजों के प्रति प्रमाणित विश्वसनीयता की है, न कि मुख्यतः धार्मिक विश्वास की। ‘निष्ठावान’ उस अर्थ को स्पष्ट करता है, और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἀνεγκλήτων और πίστις के संबंध का हिन्दी रूप
  choice: मेरे और मेरे पूर्वजों के प्रति हर प्रकार से निर्दोष और दृढ़ निष्ठावान
  alternative: मेरे और मेरे पूर्वजों के सामने निर्दोष, पूर्ण और अटल निष्ठा रखनेवाले
  rationale: यूनानी वाक्यरचना सघन और कुछ कठिन है। चुना गया रूप दोषरहितता और प्रमाणित निष्ठा दोनों को बनाए रखते हुए साधारण पाठक के लिए वाक्य को सुबोध बनाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण पर सहज रखी गई है। ‘भरपूर भोज’ मूल की भयावह विडंबना को बनाए रखता है। कठिन यूनानी वंश-संबंध और πίστις की अर्थ-व्याप्ति को मुख्य पाठ में अत्यधिक बोझिल किए बिना पादटिप्पणियों में सुरक्षित रखा गया है।
