translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। यूनानी वाक्य की लंबी कृदन्त-रचना को स्पष्ट हिन्दी के लिए दो वाक्यों में बाँटा गया है। ‘यहाँ तक कि’ परिणाम को स्पष्ट करता है और यह सुनिश्चित करता है कि मदिरा तथा लोबान से भरे होने का संबंध हाथियों से समझा जाए, हेरमोन से नहीं।
