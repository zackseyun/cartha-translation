  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: hi
  text: परन्तु हेरमोन ने उन क्रूर[a] हाथियों को पिलाकर, उन्हें मदिरा की प्रचुर मात्रा से भरकर और लोबान[b] से लादकर, भोर में राजा को इन बातों की सूचना देने के लिए राजदरबार में उपस्थित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्दयी।” यूनानी विशेषण दया से रहित उग्रता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “लोबान” सामान्य धूप नहीं, बल्कि यूनानी λίβανος द्वारा सूचित विशिष्ट सुगंधित राल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλεῖς
  choice: क्रूर
  rationale: यह विशेषण दया से रहित उग्रता व्यक्त करता है। खतरनाक पशुओं के लिए ‘क्रूर’ स्वाभाविक आधुनिक हिन्दी है और यूनानी भाव को बनाए रखता है।
- source_word: ποτίσας
  choice: पिलाया
  rationale: यह कृदन्त हेरमोन द्वारा हाथियों को पेय पिलाने की पूर्ववर्ती क्रिया बताता है। ‘पिलाया’ हिन्दी में सकर्मक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: वे भरपूर दी गई मदिरा से भर गए
  rationale: यह अनुवाद मदिरा की बहुतायत और उपलब्ध कराए जाने, दोनों अर्थों को रखता है तथा स्पष्ट करता है कि हाथी ही भर गए थे।
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: लोबान से सराबोर हो गए
  rationale: λίβανος विशेष रूप से लोबान है। ‘सराबोर’ अत्यधिक भर जाने या व्याप्त हो जाने का प्रबल भाव देता है, जबकि क्रिया-विधि की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: ὄρθριος
  choice: भोर में
  rationale: यह प्रातः बहुत जल्दी पहुँचने का संकेत देता है। ‘भोर में’ संक्षिप्त, स्वाभाविक और समय की अनावश्यक सटीकता से रहित है।
- source_word: αὐλήν
  choice: राजदरबार
  rationale: राजकीय प्रसंग में αὐλή राजदरबार या राजमहल के परिसर को सूचित कर सकता है। ‘राजदरबार’ राजा को आधिकारिक सूचना देने के प्रसंग में स्वाभाविक है, यद्यपि शब्द केवल वास्तुगत आँगन तक सीमित नहीं है।
- source_word: προσαγγεῖλαι
  choice: सूचना ... दे
  rationale: यह उद्देश्यसूचक क्रिया राजा के पास आधिकारिक समाचार पहुँचाने का भाव रखती है। ‘सूचना देना’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
