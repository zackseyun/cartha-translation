  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: hi
  text: उन सबने आँसुओं के साथ और न थमनेवाली पुकार से सर्वशक्तिमान प्रभु को—हर प्रभुता के अधिपति, अपने दयालु परमेश्वर और पिता को—पुकारा और उनसे विनती की,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντοκράτορα
  choice: सर्वशक्तिमान
  rationale: यह बाइबलीय यूनानी में प्रचलित ईश्वरीय उपाधि का स्वाभाविक और सशक्त हिन्दी रूप है।
- source_word: κύριον
  choice: प्रभु
  rationale: ईश्वरीय उपाधि के रूप में κύριος का मानक, श्रद्धापूर्ण और सामान्य पाठकों के लिए परिचित अनुवाद।
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: जो हर सत्ता पर शासन करते हैं
  rationale: यह यूनानी पदावली के शासन-संबंधी सजातीय शब्दों और परमेश्वर की सर्वश्रेष्ठ प्रभुता को स्वाभाविक हिन्दी में व्यक्त करती है; संभावित व्यक्ति-वाचक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐλεήμονα
  choice: दयालु
  rationale: करुणा और दया का भाव रखने वाला सहज आधुनिक हिन्दी शब्द, जो इस प्रसंग में परमेश्वर के गुण को स्पष्ट करता है।
- source_word: θεὸν αὐτῶν καὶ πατέρα
  choice: उनके दयालु परमेश्वर और पिता
  rationale: αὐτῶν को दोनों संज्ञाओं से संबद्ध रखते हुए ‘परमेश्वर’ और ‘पिता’ दोनों संबंधपरक उपाधियाँ सुरक्षित रखी गई हैं।
- source_word: δυσκαταπαύστῳ βοῇ
  choice: न थमनेवाली पुकार से
  rationale: विशेषण का मूल भाव ऐसी पुकार है जिसे रोकना या शांत करना कठिन हो; ‘न थमनेवाली’ उसकी निरंतरता और तीव्रता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: μετὰ δακρύων
  choice: आँसुओं के साथ
  rationale: मूल की भावनात्मक और शारीरिक अभिव्यक्ति का सीधा अनुवाद।
- source_word: ἐπεκαλέσαντο
  choice: पुकारा
  rationale: प्रार्थनापूर्वक सहायता के लिए परमेश्वर को पुकारने का स्वाभाविक हिन्दी प्रयोग।
- source_word: δεόμενοι
  choice: उनसे विनती की
  rationale: यह कृदंत गंभीर और अत्यावश्यक याचना व्यक्त करता है; हिन्दी वाक्य में समन्वित क्रिया बनाकर अर्थ और प्रवाह दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ईश्वरीय उपाधियों की संचित श्रृंखला
  choice: सर्वशक्तिमान प्रभु…जो हर सत्ता पर शासन करते हैं और उनके दयालु परमेश्वर और पिता हैं
  alternative: सर्वशक्तिमान प्रभु और हर शासक के अधिपति, उनके दयालु परमेश्वर और पिता
  rationale: मूल यूनानी एक के बाद एक कई उपाधियाँ जोड़ता है। अनुवाद उन्हें एक ही सामान्य उपाधि में समेटने के बजाय उनकी संचयी शक्ति बनाए रखता है और स्पष्ट ‘पिता’ को भी सुरक्षित रखता है।
- issue: πάσης δυνάστην δυναστεύοντα में प्रभुता का लक्ष्य
  choice: हर सत्ता पर शासन करते हैं
  alternative: हर शासक पर शासन करते हैं
  rationale: यूनानी सजातीय शासन-संबंधी शब्दों के कारण ‘सत्ता/प्रभुता’ और ‘शासक’ दोनों अर्थ संभव हैं। मुख्य पाठ में व्यापक सत्ता-वाचक अर्थ रखा गया है और व्यक्ति-वाचक विकल्प पाद-टिप्पणी में दिया गया है, ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, श्रद्धापूर्ण किंतु सहज रखी गई है। यूनानी वाक्यांश के अधूरे, अगले पद से जुड़ने वाले स्वरूप को अंतिम अल्पविराम से बनाए रखा गया है। ‘तब’ प्रसंगगत प्रवाह के लिए जोड़ा गया है, जबकि कोई नई धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
