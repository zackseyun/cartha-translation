translation:
  language: hi
  text: उनके विरुद्ध की अपवित्र योजना को उलट देना, और एक महिमामय प्रकट होने के द्वारा उन्हें उस मृत्यु से बचा लेना जो उनके पाँवों के पास तैयार थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστρέψαι
  choice: उलट देना
  rationale: यह क्रिया विरोधी योजना को बदल देने या निष्फल कर देने का भाव रखती है। ‘उलट देना’ आधुनिक हिन्दी में स्वाभाविक है और मूल का दिशापरिवर्तन वाला भाव बनाए रखता है।
- source_word: βουλὴν ἀνοσίαν
  choice: अपवित्र योजना
  rationale: βουλή यहाँ उनके विरुद्ध बनाई गई योजना है, और ἀνόσιος उसके परमेश्वर-विरोधी तथा नैतिक रूप से दुष्ट चरित्र को व्यक्त करता है। ‘अपवित्र’ धार्मिक आयाम को केवल ‘दुष्ट’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: ῥύσασθαι
  choice: बचा लेना
  rationale: यह तत्काल उपस्थित प्राणघातक संकट से छुड़ाने को दर्शाता है। ‘बचा लेना’ सहज समकालीन हिन्दी है और सक्रिय उद्धार का भाव रखता है।
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: महिमामय रूप से प्रकट होकर
  rationale: ἐπιφάνεια प्रभावशाली प्रकट होने, विशेषतः ईश्वरीय सहायता के प्रकट होने, का बोध करा सकता है; μεγαλομερής उसकी भव्यता बताता है। यह अनुवाद घटना को केवल सामान्य ‘हस्तक्षेप’ बनाकर उसके प्रकट होने के भाव को नहीं मिटाता।
- source_word: μόρου
  choice: मृत्यु
  rationale: μόρος का अर्थ विनाशकारी भाग्य या मृत्यु हो सकता है; यहाँ निकट और तैयार पड़े संकट के संदर्भ में ‘मृत्यु’ सर्वाधिक स्पष्ट है।
- source_word: παρὰ πόδας ἐν ἑτοίμῳ
  choice: उनके पाँवों के पास तैयार खड़ी थी
  rationale: यह निकट और आसन्न संकट की सजीव स्थानिक छवि को बनाए रखता है। ‘तैयार खड़ी’ हिन्दी में तत्काल घटने को प्रस्तुत मृत्यु का स्वाभाविक मानवीकरण है।
theological_decisions:
- issue: ἐπιφάνεια का स्वरूप
  choice: ईश्वरीय ‘प्रकट होने’ की भाषा सुरक्षित रखी गई
  alternative: प्रतापी हस्तक्षेप
  rationale: संदर्भ उद्धारकारी ईश्वरीय सहायता का है, पर मूल यह नहीं बताता कि वह प्रकट होना ठीक किस प्रकार घटित हुआ। इसलिए ‘प्रकट होकर’ मूल की धार्मिक गूँज और उसकी अस्पष्टता दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी के दोनों infinitive रूपों को ‘उलट देना’ और ‘बचा लेना’ से समानांतर रखा गया है, क्योंकि दिया गया अंश अपने पूर्ववर्ती वाक्य पर व्याकरणिक रूप से निर्भर है।
