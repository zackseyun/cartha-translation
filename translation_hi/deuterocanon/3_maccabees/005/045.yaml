  text: But the elephant-master[a], after bringing the beasts almost—as he had said—into a frenzied state by very fragrant drinks, with wine mixed with frankincense, and making them terrifyingly adorned with equipment[c][b],
translation:
  language: hi
  text: परन्तु हाथियों के प्रभारी ने, जैसा उसने कहा था, उन पशुओं को अत्यन्त सुगन्धित पेय—लोबान-मिश्रित दाखमधु[b]—पिलाकर लगभग उन्मत्त अवस्था तक पहुँचा दिया[a] और उन्हें भयावह ढंग से साज-सामान[c] से सज्जित किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का यूनानी कृदन्त ἀγιοχὼς पाठगत और शब्दार्थगत रूप से कठिन है; ‘पहुँचा दिया’ सम्भावित प्रसंगगत अर्थ को व्यक्त करता है।
    reason: textual_variant
  - marker: b
