base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: hi
  text: फलारिस से भी बढ़कर क्रूर होकर उसने कहा, “आज उन्हें सोने दिया गया है; इसके लिए वे आभारी हों[a]। पर उन्हें आने वाले दिन तक जीवित रखो, और अधर्मी यहूदियों[b] के विनाश के लिए हाथियों को पहले की तरह तैयार करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “वे आज की नींद को उपकार मानें।” यूनानी मुहावरे का आशय है कि आज सोने दिए जाने को वे कृपा मानें और उसके लिए कृतज्ञ हों।'
    reason: lexical_alternative
  - marker: b
    text: “अधर्मी” वक्ता द्वारा लगाया गया शत्रुतापूर्ण आरोप है। यूनानी शब्द का अनुवाद “अनुचित,” “रीति-विरुद्ध” या “अपवित्र” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος ἐσχηκὼς
  choice: उसमें फलारिस से भी बढ़कर क्रूरता थी
  rationale: यह वाक्यांश उसके वर्तमान क्रूर स्वभाव को बताता है। ‘क्रूरता’ आधुनिक हिन्दी में स्वाभाविक है, जबकि तुलना की तीव्रता ‘से भी बढ़कर’ से बनी रहती है।
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: आज उन्हें सोने दिया गया है, इसके लिए वे आभारी हों
  rationale: χάριν ἔχειν कृतज्ञ होने का मुहावरा है। हिन्दी रूप स्पष्ट करता है कि आज सोने की अनुमति को उपकार मानने की बात कही जा रही है।
- source_word: συντηρηθέντας
  choice: उन्हें ... जीवित रखो
  rationale: संदर्भ में συντηρέω का आशय नियोजित वध तक जीवित बचाए रखने से है; ‘जीवित रखो’ इसे स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: ὑποτέλλουσαν ἡμέραν
  choice: आनेवाले दिन तक
  rationale: कृदन्त निकट आते दिन को सूचित करता है। ‘आनेवाला दिन’ मूल की गति को रखता है और अनावश्यक रूप से ‘अगला दिन’ निश्चित नहीं करता।
- source_word: κατὰ τὸ ὅμοιον
  choice: पहले की तरह
  rationale: वाक्यांश पूर्ववर्णित तैयारी की ओर संकेत करता है। हिन्दी में ‘पहले की तरह’ इस संदर्भसूचक अर्थ को ‘उसी प्रकार’ से अधिक स्पष्ट करता है।
- source_word: ἑτοίμασον
  choice: तैयार करो
  rationale: एकवचन आज्ञार्थक रूप को सीधे आदेश के रूप में रखा गया है।
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: के विनाश के लिए
  rationale: ἀφανισμός पूर्ण नाश या मिटा देने का प्रबल भाव रखता है; ‘विनाश’ गरिमापूर्ण और पर्याप्त रूप से सशक्त है।
- source_word: ἀθεμίτων Ἰουδαίων
  choice: अधर्मी यहूदियों
  rationale: ἀθέμιτος विधि, मान्य रीति या धार्मिक मर्यादा के विरुद्ध होने का शत्रुतापूर्ण आरोप है। ‘अधर्मी’ इस अपमानजनक कथन को वक्ता के शब्दों में रखता है, बिना उसे कथाकार का समर्थन बनाए।
theological_decisions:
- issue: यहूदियों के लिए शत्रुतापूर्ण विशेषण
  choice: अधर्मी यहूदियों
  alternative: व्यवस्थाहीन यहूदियों / रीति-विरुद्ध यहूदियों
  rationale: मूल यूनानी ἀθέμιτος में ‘अनुचित, निषिद्ध, अपवित्र या अधर्मी’ का अर्थ-विस्तार है। यहाँ यह उत्पीड़क की वाणी में अपमानसूचक विशेषण है; इसलिए इसे हटाया या नरम नहीं किया गया, और पादटिप्पणी स्पष्ट करती है कि यह वक्ता का आरोप है।
- issue: आज के सोने को उपकार मानना
  choice: आज उन्हें सोने दिया गया है, इसके लिए वे आभारी हों
  alternative: वे आज की नींद को उपकार मानें
  rationale: मूल मुहावरे में कृतज्ञता और दी गई मोहलत दोनों निहित हैं। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष भाषण को स्वाभाविक आज्ञार्थक रूप में रखा गया है। सांस्कृतिक संकेत, यूनानी मुहावरे और शत्रुतापूर्ण विशेषण की अस्पष्टता पादटिप्पणियों में सुरक्षित है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
