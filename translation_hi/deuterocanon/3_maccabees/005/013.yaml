  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: hi
  text: और यहूदी, पहले से नियत समय से बच निकलने के बाद, फिर अपने पवित्र परमेश्वर—अर्थात अपने उस परमेश्वर से जो कृपा करने को तत्पर है—विनती करते रहे कि वह अभिमानी राष्ट्रों को अपने हाथ का सामर्थ्य महान उदारता से दिखाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαφυγόντες
  choice: बच निकलने के बाद
  rationale: यह कृदंत पहले से निश्चित संकटपूर्ण समय को सफलतापूर्वक पार कर जाने का भाव देता है; ‘बच निकलना’ खतरे और छुटकारे दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: पहले से ठहराई गई घड़ी
  rationale: προσημανθεῖσαν में पहले से संकेतित या निर्धारित होने का भाव है। ‘घड़ी’ मूल की समय-संबंधी सजीव अभिव्यक्ति बनाए रखती है।
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  choice: पवित्र जन—अर्थात अपने परमेश्वर
  rationale: ἤγουν व्याख्यात्मक है, इसलिए दोनों पदों को केवल ‘पवित्र परमेश्वर’ में मिला देने के बजाय ‘अर्थात’ द्वारा मूल की व्याख्यात्मक संरचना सुरक्षित रखी गई है।
- source_word: ἤξιουν
  choice: विनती करने लगे
  rationale: अपूर्ण भूतकाल प्रार्थना की जारी या बार-बार की गई क्रिया सूचित करता है; यह रूप हिन्दी में उस प्रवाह और आग्रह को सहज ढंग से व्यक्त करता है।
- source_word: τὸν εὐκατάλλακτον
  choice: जो सहज ही अनुकूल होनेवाला है
  rationale: यह विशेषण ऐसे व्यक्ति का भाव देता है जो मेल या अनुकूलता के लिए सहज उपलब्ध है। अनुवाद मूल की कुछ असामान्य और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को मिटाए बिना उसे समझने योग्य रखता है।
- source_word: μεγαλοφθενῶς
  choice: बड़े उदार भाव से
  rationale: यह दुर्लभ क्रियाविशेषण भव्यता, उदात्तता या विशाल-हृदयता का भाव देता है। चुना गया पदबंध केवल बाहरी वैभव के बजाय उदात्त रीति को व्यक्त करता है।
- source_word: χειρὸς κράτος
  choice: अपने हाथ का सामर्थ्य
  rationale: यह बाइबलीय ठोस बिंब बनाए रखता है, जिसमें ‘हाथ’ प्रकट किए गए ईश्वरीय सामर्थ्य का माध्यम है।
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: अभिमानी राष्ट्रों
  rationale: ἔθνη का व्यापक अर्थ ‘राष्ट्र’ है, जबकि सन्दर्भ में ‘गैर-यहूदी’ भी सम्भव है। मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: εὐκατάλλακτον द्वारा परमेश्वर के स्वभाव का वर्णन
  choice: जो सहज ही अनुकूल होनेवाला है
  alternative: जो कृपा करने को तत्पर है; जिसे सहज ही मनाया जा सकता है
  rationale: ‘कृपालु’ अधिक सहज है, पर मूल में मेल या अनुकूल हो जाने की तत्परता का जो तनाव है उसे आंशिक रूप से सुलझा देता है; दूसरी ओर ‘मनाया जा सकता है’ हिन्दी में अस्थिर या मनमाने देवता का अनावश्यक आभास दे सकता है। चुना गया रूप मूल की अस्पष्टता और तनाव को अपेक्षाकृत संतुलित ढंग से बचाता है।
- issue: τὸν ἅγιον ἤγουν θεὸν αὐτῶν में ἤγουν की व्याख्यात्मक भूमिका
  choice: पवित्र जन—अर्थात अपने परमेश्वर
  alternative: अपने पवित्र परमेश्वर
  rationale: मूल का व्याख्यात्मक कण दो पदों के बीच संबंध स्पष्ट करता है। उसे खुलकर अनूदित करने से ‘पवित्र जन’ की उपाधि और ‘उनका परमेश्वर’ दोनों सुरक्षित रहते हैं।
- issue: ἔθνη का धर्म-सांस्कृतिक अर्थ
  choice: राष्ट्र
  alternative: गैर-यहूदी जातियाँ
  rationale: यहाँ दोनों अर्थ सम्भव हैं। मुख्य पाठ में व्यापक और कम व्याख्यात्मक अर्थ रखा गया है, जबकि यहूदी प्रयोग में सम्भव विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
