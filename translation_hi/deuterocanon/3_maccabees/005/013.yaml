  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘पवित्र जन’ उपाधि की प्रकृति बचाता है, ‘हाथ का सामर्थ्य’ बाइबलीय बिंब को बनाए रखता है, और डैश के बीच का अंश यूनानी की अपपदात्मक संरचना को हिन्दी में स्पष्ट करता है।
