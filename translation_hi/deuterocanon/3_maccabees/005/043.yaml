base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/043.yaml
  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
translation:
  language: hi
  text: पर यदि वह यहूदिया पर चढ़ाई करे, तो वह शीघ्र ही उसे आग और भाले से समतल कर देगा; और उनके उस पवित्रस्थान को—जिसमें हमारे लिए पाँव रखना वर्जित है[a]—तुरंत आग लगाकर[b], वहाँ बलिदान चढ़ानेवालों की सेवा को सदा के लिए समाप्त कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी शब्द ἄβατον का शाब्दिक अर्थ ‘जहाँ पाँव न रखा जाए’ या ‘जहाँ प्रवेश न किया जाए’ है; अनुवाद यह भी हो सकता है: ‘हमारे लिए अगम्य उनका पवित्रस्थान।’'
    reason: lexical_alternative
  - marker: b
    text: स्वीट के यूनानी पाठ में ‘आग लगाकर’ के लिए प्रयुक्त शब्द के कुछ अक्षर अनिश्चित हैं, पर पवित्रस्थान को आग से जलाने का भाव स्पष्ट है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  choice: यदि वह ... पर चढ़ाई करे
  rationale: यह सैन्य अभियान का भाव व्यक्त करता है और आसपास के परोक्ष कथन में निहित संभावित कार्रवाई को स्वाभाविक हिन्दी शर्त के रूप में रखता है।
- source_word: ἰσόπεδον ... στήσεσθαι
  choice: उसे ... समतल कर देगा
  rationale: यहूदिया को उजाड़कर भूमि के बराबर कर देने की सशक्त छवि को संक्षिप्त और स्पष्ट हिन्दी में सुरक्षित रखता है।
- source_word: πυρὶ καὶ δόρατι
  choice: आग और भाले से
  rationale: विनाश के दोनों साधनों को यूनानी के समान ठोस रूप में बनाए रखता है।
- source_word: διὰ τάχους / ἐν τάχει
  choice: शीघ्र ही / तुरंत
  rationale: मूल पाठ में शीघ्रता का भाव दो बार आया है; दो स्वाभाविक हिन्दी अभिव्यक्तियाँ दोनों बलाघातों को सुरक्षित रखती हैं।
- source_word: ἄβατον ἡμῖν
  choice: जहाँ हमारे लिए पाँव रखना वर्जित है
  rationale: ἄβατον की ‘न चलने/प्रवेश न करने योग्य’ ठोस छवि और वक्ता के प्रथम-पुरुष बहुवचन दृष्टिकोण, दोनों को बनाए रखता है।
- source_word: ναόν
  choice: पवित्रस्थान
  rationale: यह व्यापक मन्दिर-परिसर के बजाय विशेष रूप से मन्दिर के पवित्र भाग का संकेत दे सकता है; ‘पवित्रस्थान’ इस सूक्ष्मता को व्यक्त करता है।
- source_word: πρήσαντα
  choice: आग लगाकर
  rationale: पाठ के अक्षरों में थोड़ी अनिश्चितता के बावजूद आग से जला देने का अर्थ स्पष्ट है; यह हिन्दी में सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  choice: वहाँ बलिदान चढ़ानेवालों का काम
  rationale: बलिदान की सेवा पूरी करनेवालों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी ऐसे विशिष्ट पुरोहितीय पद को जोड़ने के जो यूनानी में स्पष्ट नहीं है।
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  choice: सदा के लिए बंद कर देगा
  rationale: यह बलिदान-कार्य के स्थायी अंत का भाव स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἄβατον ἡμῖν में प्रथम-पुरुष बहुवचन का संदर्भ
  choice: वक्ता और उसके साथियों के लिए यहूदी पवित्रस्थान में पाँव रखना वर्जित था।
  alternative: ‘हमारे लिए अगम्य उनका पवित्रस्थान’
  rationale: चुना गया रूप बाहरी व्यक्ति के दृष्टिकोण और पाँव रखने की मूल ठोस छवि को सुरक्षित रखता है, पर प्रवेश-निषेध के कारण के विषय में अतिरिक्त धार्मिक दावा नहीं करता।
- issue: ναός का अनुवाद
  choice: पवित्रस्थान
  alternative: मन्दिर
  rationale: ναός यहाँ व्यापक मन्दिर-परिसर के बजाय प्रवेश-वर्जित पवित्र भाग की ओर संकेत करता प्रतीत होता है; फिर भी अनुवाद इससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: स्थायी रूप से रोके जानेवाली वस्तु
  choice: वहाँ बलिदान चढ़ानेवालों का काम सदा के लिए बंद करना
  alternative: बलिदान चढ़ानेवालों को सदा के लिए समाप्त कर देना
  rationale: संदर्भ मन्दिर जलाने के द्वारा बलिदान-सेवा के स्थायी अंत पर केंद्रित है। चुना गया रूप व्यक्तियों के वध का अनावश्यक निष्कर्ष नहीं जोड़ता और यूनानी वाक्य की कुछ संक्षिप्तता को पठनीय हिन्दी में व्यक्त करता है।
