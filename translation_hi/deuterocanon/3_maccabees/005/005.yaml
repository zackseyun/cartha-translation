base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/005.yaml
  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: hi
  text: और इसके अतिरिक्त, परिचारक संध्या के समय बाहर जाकर उन पीड़ित लोगों के हाथ बाँधते थे और रात के लिए उनके संबंध में बाकी सुरक्षा-व्यवस्था भी कर रहे थे, यह सोचकर कि वे उस जाति को एक साथ विनाश के अंतिम छोर तक पहुँचा देंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस जाति’ का अनुवाद ‘उस प्रजा’ या ‘उन लोगों’ भी हो सकता है। यूनानी पद पूरे यहूदी समुदाय को सामूहिक रूप से दर्शाता है। ‘विनाश के अंतिम छोर’ का अधिक शाब्दिक रूप ‘विनाश का अंत’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργοὶ
  choice: सेवक
  rationale: यहाँ यह शब्द अधिकार के अधीन कोई निर्धारित काम करने वालों के लिए है, धार्मिक सेवकों के लिए नहीं। ‘सेवक’ साधारण हिन्दी में स्वाभाविक है और प्रसंगानुकूल भी।
- source_word: κατὰ τὴν ἑσπέραν
  choice: संध्या के समय
  rationale: यूनानी काल-सूचक वाक्यांश का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: τῶν ταλαιπωρουμένων
  choice: पीड़ित लोगों
  rationale: यह उन लोगों की दयनीय और कष्टपूर्ण दशा व्यक्त करता है; ‘पीड़ित’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐδέσμευον
  choice: बाँध दिए
  rationale: क्रिया हाथों को बाँधने की ठोस कार्रवाई बताती है।
- source_word: τὴν ... λοιπὴν ... ἀσφάλειαν ἔννυχον
  choice: रात भर उन्हें सुरक्षित पहरे में रखने के बाकी उपाय
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ असहज है; यह रूप रात के लिए अतिरिक्त सुरक्षा या निगरानी के प्रबंध को स्पष्ट करता है।
- source_word: ἐμηχανῶντο
  choice: उपाय भी किए
  rationale: मध्यवाच्य क्रिया सोची-समझी व्यवस्था या युक्ति रचने का भाव देती है। प्रसंग में ‘उपाय किए’ स्वाभाविक हिन्दी है।
- source_word: δοξαντες
  choice: समझते थे
  rationale: यह उनके अनुमान या अपेक्षा को प्रकट करता है, निश्चित तथ्य को नहीं।
- source_word: λήμψεσθαι ... πέρας
  choice: पराकाष्ठा तक पहुँचा देंगे
  rationale: शाब्दिक संरचना असामान्य है और संभवतः किसी परिणाम या अंत को प्राप्त करने का मुहावरा है। प्रसंग में यह समूह के विनाश को उसके अंतिम बिंदु तक ले जाने की उनकी अपेक्षा बताता है।
- source_word: τὸ φύλον
  choice: उस जाति
  rationale: यहाँ यह सामूहिक जातीय पद यहूदी लोगों को समग्र रूप में इंगित करता है। ‘जाति’ हिन्दी में उस सामूहिक अर्थ को बनाए रखती है, यद्यपि ‘लोग’ भी संभव है।
- source_word: πέρας τῆς ὀλεθρίας
  choice: विनाश की पराकाष्ठा
  rationale: πέρας अंत, चरम या पूर्णता हो सकता है। यह चयन विनाश के अंतिम और पूर्ण बिंदु का भाव रखता है, बिना उसे केवल ‘पूर्ण विनाश’ बनाकर संरचना मिटाए।
theological_decisions:
- issue: τὸ φύλον का सामूहिक जातीय अर्थ
  choice: उस जाति
  alternative: उस प्रजा / उन लोगों
  rationale: प्रसंग में लक्ष्य कोई एक गोत्र नहीं, बल्कि यहूदी समुदाय समग्र रूप में है। ‘जाति’ सामूहिक जातीय आयाम बनाए रखती है; विकल्प पादटिप्पणी में दिए गए हैं।
- issue: λήμψεσθαι ... πέρας τῆς ὀλεθρίας की असामान्य संरचना
  choice: उस जाति को विनाश की पराकाष्ठा तक पहुँचा देंगे
  alternative: उस जाति के पूर्ण विनाश को प्राप्त कर लेंगे
  rationale: यूनानी में λαμβάνω और πέρας का संबंध हिन्दी में शब्दशः रखने पर अस्पष्ट होता। चुना हुआ रूप उनके संहारकारी उद्देश्य को स्पष्ट करता है, जबकि ‘पराकाष्ठा’ मूल के ‘अंत/चरम’ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। यूनानी की संक्षिप्त सुरक्षा-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में स्पष्ट किया गया है, और अंतिम वाक्यांश की वास्तविक अर्थगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
