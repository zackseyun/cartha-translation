lexical_decisions:
- source_word: λογισάμενος
  choice: इस बात पर विचार किया
  rationale: यह रूप पहले कही गई बात पर राजा के विचार करने को दर्शाता है और क्रियाओं का क्रम बनाए रखता है।
- source_word: τραπεὶς εἰς τὸν πότον
  choice: पीने की ओर मुड़ा
  rationale: यह यूनानी पद राजा के मदिरापान की ओर प्रवृत्त होने को बताता है; मूल में मदिरा का नाम स्पष्टतः नहीं है, इसलिए सामान्य ‘पीने’ को रखा गया है।
- source_word: παραγεγονότας
  choice: आए लोगों
  rationale: पूर्ण कृदन्त उन लोगों को सूचित करता है जो आ चुके थे और वहाँ उपस्थित थे; ‘आए’ उसके क्रियात्मक भाव को बनाए रखता है।
- source_word: ἐπὶ τὴν συμποσίαν
  choice: भोज में
  rationale: συμποσία सामूहिक भोज अथवा मदिरापान-सभा हो सकती है। संदर्भ में पीना स्पष्ट है, जबकि ‘भोज’ सहज और पर्याप्त व्यापक है।
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: उसके चारों ओर लेटकर भोजन करने की जगह लें
  rationale: पाठ व वाक्य-विन्यास कठिन हैं, पर पदावली प्राचीन भोज में लेटकर स्थान ग्रहण करने से संबंधित है। ‘उसके चारों ओर’ संभावित स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कठिनाई छिपाए।
