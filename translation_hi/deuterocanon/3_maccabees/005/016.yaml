  text: जब राजा ने इस बात पर विचार किया और पीने लगा, तब उसने भोज में आए हुए लोगों को आज्ञा दी कि वे उसके चारों ओर भोजन के लिए लेटकर स्थान ग्रहण करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम यूनानी वाक्यांश का पाठ और वाक्य-विन्यास कठिन है। इसका आशय है कि अतिथि राजा के संबंध में किसी स्थान पर भोज के लिए लेटकर स्थान ग्रहण करें। ‘उसके चारों ओर’ संदर्भानुकूल अनुवाद है; अन्य संभावनाएँ हैं: ‘उसके पास’ या ‘मेज़ पर उसके स्थान की ओर।’'
