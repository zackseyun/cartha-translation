lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: और जब यह हो गया
  rationale: यह वाक्यांश पहले घट चुकी घटना के बाद की स्थिति बताता है। हिन्दी में यह स्वाभाविक क्रम देता है और ‘यह’ के संदर्भ को मूल से अधिक निश्चित नहीं करता।
- source_word: παρῄνει
  choice: उसने उनसे आग्रह किया
  rationale: क्रिया सलाह देने और बल देकर प्रोत्साहित करने का भाव रखती है; ‘आग्रह किया’ प्रसंग के अनुरूप है और उपदेशात्मक रंग नहीं जोड़ता।
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  choice: वे भोज-उत्सव में अपने आप को लगा दें
  rationale: यह खाने-पीने और उत्सवी आनंद में स्वयं को समर्पित करने का भाव व्यक्त करता है। ‘भोज-उत्सव’ उल्लास को रखता है, पर मूल से अधिक उच्छृंखलता नहीं जोड़ता।
- source_word: τὸ παρὸν τῆς συμποσίας
  choice: भोज के इस अवसर
  rationale: τὸ παρόν वर्तमान अवसर या मौजूदा समय को और συμποσία सामूहिक भोज को सूचित करता है। यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: बड़े आदर के साथ
  rationale: यूनानी कृदंत उपस्थित लोगों के द्वारा उस अवसर को बहुत महत्त्व अथवा सम्मान दिए जाने का भाव रखता है। हिन्दी में क्रियाविशेषणात्मक रूप वाक्य को सहज रखता है।
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: आनंद के लिए एक भाग नियत करें
  rationale: संक्षिप्त यूनानी मुहावरा किसी भाग को उल्लास के लिए अलग रखने या ठहराने का भाव देता है। ‘एक भाग नियत करें’ μέρος को स्पष्ट रूप से बनाए रखता है, जबकि पादटिप्पणी मुहावरे की दूसरी सम्भावित अभिव्यक्ति बताती है।
