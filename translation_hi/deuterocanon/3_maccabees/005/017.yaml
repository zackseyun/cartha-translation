    text: या, “भोज के इस वर्तमान अवसर को आनंद के लिए अलग रखें।” यूनानी अभिव्यक्ति καταθέσθαι μέρος में μέρος का अर्थ “भाग” है; यह किसी अवसर को आनंद के लिए अलग रखने या नियत करने का भाव दे सकती है।
