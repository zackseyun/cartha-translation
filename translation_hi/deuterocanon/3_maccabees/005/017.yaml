  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
translation:
  language: hi
  text: और जब यह भी हो गया, तब उसने उनसे, जो भोज में मग्न हो गए थे, आग्रह किया कि वे, स्वयं को बहुत सम्मानित समझते हुए, भोज के इस वर्तमान अवसर को आनंद के लिए एक भाग के रूप में अलग रखें।[a]
  philosophy: optimal-equivalence
  footnotes:
