  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: hi
  text: क्योंकि इन लोगों को एक साथ दण्ड दिए जाने पर, हम अपने मामलों को आने वाले समय के लिए पूरे विश्वास के साथ छोड़ देंगे कि वे स्थिरता और सर्वोत्तम दशा में स्थापित हो जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य-विन्यास संक्षिप्त और कुछ असामान्य है। अधिक शाब्दिक रूप में, ‘हम अपने मामलों को आने वाले समय के लिए ... स्थापित होने को छोड़ देंगे’ कहा जा सकता है। आशय यह है कि इन लोगों को दण्ड मिलने के बाद आगे के लिए शासक के मामले स्थिर और सर्वोत्तम स्थिति में रहेंगे।
    reason: यूनानी λείψαμεν तथा उसके साथ आए भविष्यत् कर्मवाच्य क्रियारूप की संक्षिप्त रचना को स्पष्ट करना।
