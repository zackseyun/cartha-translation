- source_word: τὴν ... εὐπραξίαν
  choice: अच्छे आचरण
  rationale: εὐπραξία यहाँ सफलता या समृद्धि से अधिक उस जनसमुदाय के प्रशंसनीय काम-काज और आचरण को सूचित करता है, जिसकी व्यापक चर्चा थी।
- source_word: περὶ τὸ γένος
  choice: उस जनसमुदाय के
  rationale: γένος यहाँ यहूदी लोगों को एक जातीय जनसमुदाय के रूप में दर्शाता है। आधुनिक हिन्दी में ‘जाति’ से जाति-व्यवस्था का अनचाहा अर्थ निकल सकता है, इसलिए ‘जनसमुदाय’ अधिक स्पष्ट है।
- source_word: ἐν πᾶσιν
  choice: सब ओर
  rationale: θρυλουμένην के साथ यह व्यापक सार्वजनिक चर्चा का भाव देता है; ‘सब ओर’ स्वाभाविक हिन्दी में उसे व्यक्त करता है।
- source_word: θρυλουμένην
  choice: जिसकी चर्चा ... होती थी
  rationale: यह निष्क्रिय कृदन्त किसी बात के आम तौर पर कहे या व्यापक रूप से चर्चित होने को दर्शाता है, बिना यह जोड़े कि उसकी औपचारिक प्रशंसा की जाती थी।
- source_word: οἱ ἀλλόφυλοι
  choice: दूसरे समुदायों के लोग
  rationale: ἀλλόφυλοι का मूल भाव दूसरे कुल या लोगों से संबंधित व्यक्तियों का है। यह अनुवाद जातीय-सामुदायिक भेद बनाए रखता है और ‘अन्यजाति’ से जुड़ी बाद की पारिभाषिक ध्वनि से बचता है।
- source_word: οὐδαμῶς
  choice: बिल्कुल भी नहीं
  rationale: यह प्रबल निषेध को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διηριθμήσαντο
  choice: ध्यान में रखा
  rationale: क्रिया का मूल संबंध गिनने या लेखा करने से है, पर यहाँ भाव किसी तथ्य को विचार या मूल्यांकन में स्थान देने का है।
