  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: hi
  text: परन्तु वे सम्मान-प्रदर्शन और भोजनों के संबंध में उनकी भिन्नता की चर्चा फैलाते रहे[a], और कहते थे कि ये लोग न तो राजा के और न उसकी सेनाओं के अनुरूप चलते हैं, बल्कि शत्रुभाव रखते हैं और राज्य के कामकाज का घोर विरोध करते हैं; और उन्होंने उनके बारे में कोई मामूली भय नहीं फैला दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उपासना और भोजनों के संबंध में उनकी भिन्नता।” ‘सम्मान-प्रदर्शन’ के लिए यूनानी शब्द धार्मिक उपासना, प्रणाम, या राजा के सामने किए जाने वाले सम्मान-सूचक अभिवादन का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, “उन्होंने उनके साथ कोई साधारण भय नहीं जोड़ दिया।” अर्थात् उन्होंने इन लोगों के बारे में गंभीर सार्वजनिक भय या संदेह उत्पन्न किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: अलग व्यवहार
  rationale: यह शब्द अलगाव, भिन्नता या मतभेद व्यक्त कर सकता है। यहाँ उपासना-संबंधी आचरण और भोजन में यहूदियों की सामाजिक-धार्मिक विशिष्टता की चर्चा है; ‘अलग व्यवहार’ इस संदर्भ में स्वाभाविक है और इसे खुला विद्रोह नहीं बनाता।
- source_word: προσκυνήσεων
  choice: दण्डवत करने
  rationale: प्रणाम, राजकीय अभिवादन और उपासना—तीनों की सम्भावना बनाए रखने के लिए ऐसा बाहरी सम्मान-सूचक शब्द चुना गया है; ‘उपासना’ अकेले धार्मिक अर्थ को अनावश्यक रूप से निश्चित कर देती।
- source_word: τροφῶν
  choice: भोजनों
  rationale: यूनानी संज्ञा सीधे ‘भोजनों/खाद्य पदार्थों’ को सूचित करती है। मुख्य पाठ में ‘भोजन-विधि’ या ‘खान-पान के नियम’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: ἐθρύλουν
  choice: चर्चा फैलाते रहे
  rationale: अपूर्ण भूतकाल लगातार किए गए कार्य को दिखाता है, और क्रिया में किसी बात को बार-बार प्रचारित करने या अफ़वाह की तरह फैलाने का नकारात्मक भाव है।
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: समान चाल-चलन अपनाते हैं
  rationale: पदबंध समान ढंग, रीति या जीवन-व्यवहार का होने की बात करता है। यह अनुवाद केवल विचारों की सहमति तक अर्थ को सीमित नहीं करता और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ταῖς δυνάμεσιν
  choice: उसकी सेनाओं
  rationale: राजकीय संदर्भ में δύναμις का बहुवचन सशस्त्र बलों या राजा की शक्तियों को सूचित कर सकता है। ‘सेनाओं’ राजनीतिक आरोप की तीव्रता और सम्भावित सैनिक अर्थ को बनाए रखता है।
- source_word: δυσμενεῖς
  choice: शत्रुभाव रखते हैं
  rationale: यह शब्द केवल दूरी या असहमति नहीं, बल्कि विरोधी और दुर्भावनापूर्ण रुख का आरोप व्यक्त करता है।
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: राज्य के कामकाज का घोर विरोध करते हैं
  rationale: τοῖς πράγμασιν इस संदर्भ में सार्वजनिक या राजकीय मामलों को और μέγα τι विरोध की गंभीरता को व्यक्त करता है।
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: असाधारण भय
  rationale: शाब्दिक मुहावरे ‘कोई साधारण/तुच्छ भय नहीं’ का सकारात्मक और सहज हिन्दी रूप है, जो आरोप की तीव्रता बनाए रखता है।
- source_word: περιήψαντο
  choice: भय का विषय बना दिया
  rationale: क्रिया में किसी पर कुछ लटका देने, उससे जोड़ देने या उसे किसी प्रभाव से घेर देने का भाव है। हिन्दी में चुना गया रूप परिणाम को स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक बताती है।
theological_decisions:
- issue: क्या προσκυνήσεων को केवल धार्मिक ‘उपासना’ के अर्थ में अनूदित किया जाए या राजकीय/अनुष्ठानिक अभिवादन का अर्थ भी खुला रखा जाए
  choice: दण्डवत करने
  alternative: उपासना करने; प्रणाम करने
  rationale: राजकीय परिवेश में यह शब्द राजा के सामने किए जाने वाले सम्मान-सूचक दण्डवत और धार्मिक उपासना दोनों को सूचित कर सकता है। व्यापक अनुवाद मूल की धार्मिक-राजकीय अस्पष्टता को सुरक्षित रखता है।
- issue: τοῖς πράγμασιν के राजनीतिक संकेत को कितना स्पष्ट किया जाए
  choice: राज्य के कामकाज
  alternative: सार्वजनिक मामलों; स्थापित व्यवस्था
  rationale: आरोप यह है कि ये लोग राजा और उसके शासन के लिए खतरा हैं। ‘राज्य के कामकाज’ राजनीतिक संदर्भ स्पष्ट करता है, पर इसे किसी विशिष्ट प्रकार के राजद्रोह के रूप में नहीं बढ़ाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट रूप रखा गया है। ‘दण्डवत’ भारतीय पाठक के लिए बाहरी श्रद्धा और अधीनता दोनों का बोध कराता है; पादटिप्पणी धार्मिक तथा राजकीय अर्थों की वास्तविक अस्पष्टता सुरक्षित रखती है। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, जबकि आरोपों की क्रमिक संरचना और अंतिम भय उत्पन्न करने वाला निष्कर्ष बनाए रखा गया है।
