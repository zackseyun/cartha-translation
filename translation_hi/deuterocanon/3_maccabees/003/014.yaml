translation:
  language: hi
  text: एशिया की ओर हमारे द्वारा चलाए गए उस सैन्य अभियान के विषय में, जिसके बारे में तुम स्वयं भी जानते हो और जिसे देवताओं के अटूट गठबंधन से[a], जैसा उचित था, अंत तक पहुँचाया गया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देवताओं के अजेय गठबंधन से।” यूनानी विशेषण का शाब्दिक भाव ऐसी वस्तु से है जो निर्बल या रुग्ण न हो; इसलिए यहाँ इसका अर्थ दृढ़, अविचल, या कभी विफल न होने वाला हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पूरा किया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: सैन्य अभियान
  rationale: यह संज्ञा युद्ध के लिए किए गए अभियान या चढ़ाई को दर्शाती है। ‘सैन्य अभियान’ मार्शल अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν Ἀσίαν
  choice: एशिया में
  rationale: εἰς यहाँ किसी क्षेत्र की ओर और उसके भीतर होने वाली गति को दर्शाता है। हिन्दी में अभियान के साथ ‘एशिया में’ इस दिशात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: γενομένης ἡμῖν
  choice: हमारे ... किए गए
  rationale: यह वाक्यांश उस अभियान को वक्ता और उसके पक्ष द्वारा किया गया बताता है। ‘हमारे ... किए गए’ सहभागिता और स्वामित्व, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: जिसके बारे में तुम स्वयं भी जानते हो
  rationale: ‘स्वयं भी’ क्रमशः αὐτοί के बल और καί के समावेशी भाव को बनाए रखता है।
- source_word: ἀρρωστῷ
  choice: अटल
  rationale: इसका शाब्दिक भाव ‘निर्बल या रुग्ण न होने वाला’ है; सहयोग के लिए प्रयुक्त होने पर ‘अटल’ दृढ़, अविचल और विफल न होने वाला भाव देता है, बिना इसे अनावश्यक रूप से ‘अजेय’ कहे।
- source_word: συμμαχίᾳ
  choice: सहयोग
  rationale: यह युद्ध-संदर्भ में गठबंधन, साथ या सहायता को दर्शाता है। देवताओं के संदर्भ में ‘सहयोग’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य साथ देने का अर्थ बनाए रखता है।
- source_word: τῶν θεῶν
  choice: देवताओं के
  rationale: यूनानी पाठ में स्पष्ट रूप से बहुवचन है। यह मूर्तिपूजक राजकीय वक्ता की धार्मिक भाषा को ज्यों का त्यों रखता है।
- source_word: κατὰ λόγον
  choice: जैसा उचित था
  rationale: यह मुहावरा तर्क, अपेक्षा या औचित्य के अनुरूप होने का भाव दे सकता है। ‘जैसा उचित था’ उसके मूल्यांकनात्मक भाव को सुरक्षित रखता है और किसी निश्चित योजना का अर्थ नहीं जोड़ता।
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: पूरा किया गया
  rationale: यह कर्मवाच्य वाक्यांश किसी बात को अंत या पूर्णता तक पहुँचाए जाने को दर्शाता है। ‘पूरा किया गया’ इसका स्वाभाविक हिन्दी रूप है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: राजकीय वक्तव्य में मूर्तिपूजक देवताओं का उल्लेख
  choice: देवताओं के
  alternative: परमेश्वर के; ईश्वरीय सहायता से
  rationale: मूल यूनानी τῶν θεῶν बहुवचन में है। वक्ता के ऐतिहासिक-धार्मिक दृष्टिकोण को एकेश्वरवादी भाषा में सामान्यीकृत करना पाठ में ऐसा धर्मवैचारिक दावा जोड़ देता जो मूल में नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय घोषणा के अनुरूप गरिमापूर्ण रखी गई है। पद एक बड़े वाक्य का आश्रित अंश है, इसलिए अंत में अल्पविराम रखा गया है। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है और ‘स्वयं भी’ मूल के बल को बनाए रखता है।
