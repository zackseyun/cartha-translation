translation:
  language: hi
  text: और धर्मियों के उत्तम आचरण से अपने जीवन को सुशोभित करके वे सभी लोगों में सम्मानित हो गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: उत्तम आचरण से
  rationale: यह पदबंध यहाँ नैतिक रूप से अच्छे और उचित व्यवहार को व्यक्त करता है; ‘उत्तम आचरण’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τῶν δικαίων
  choice: धर्मियों के
  rationale: यह विशेषण संज्ञा के रूप में बहुवचन है और धार्मिक-नैतिक दृष्टि से धर्मी लोगों को सूचित करता है।
- source_word: κοσμοῦντες
  choice: सुशोभित करके
  rationale: 'इससे यूनानी क्रिया का रूपक बना रहता है: उनका जीवन धर्मियों के उत्तम आचरण से शोभायमान होता था।'
- source_word: τὴν συναναστροφήν
  choice: अपने जीवन को
  rationale: संदर्भ में यह केवल किसी एक व्यवहार के बजाय सामाजिक और नैतिक जीवन-शैली को दर्शाता है; हिन्दी में ‘अपने जीवन’ सहज है।
- source_word: ἅπασιν ἀνθρώποις
  choice: सभी लोगों में
  rationale: सम्प्रदान कारक उन लोगों को बताता है जिनकी दृष्टि में वे आदरणीय थे; ‘सभी लोगों में’ इस सामाजिक प्रतिष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐδόκιμοι
  choice: सम्मानित
  rationale: शब्द का अर्थ अच्छी प्रतिष्ठा पाना या आदर की दृष्टि से देखा जाना है; ‘सम्मानित’ संक्षिप्त और सहज है।
- source_word: καθειστήκεισαν
  choice: हो गए थे
  rationale: पूर्णभूत रूप पहले से प्राप्त परिणामी दशा बताता है; ‘हो गए थे’ इस भाव को स्पष्ट रखता है।
