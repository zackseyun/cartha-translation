base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/010.yaml
  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: hi
  text: पहले ही कुछ पड़ोसी, मित्र और कारोबार के साथी भी कुछ लोगों को चुपके से अलग बुलाकर यह आश्वासन दे रहे थे कि वे उनकी रक्षा के लिए उनके साथ खड़े होंगे और उनकी सहायता के लिए अपना पूरा प्रयत्न करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उनकी रक्षा में मिलकर खड़े होंगे और उनकी सहायता के लिए भरसक योगदान देंगे।”
    reason: यूनानी συνασπίζειν में मिलकर रक्षा करने का भाव है। πᾶν ἐκτενὲς προσιοίσεσθαι का अर्थ पूरा प्रयत्न करने के साथ-साथ भरसक सहायता या योगदान देने का भी हो सकता है।
lexical_decisions:
- source_word: γείτονές
  choice: पड़ोसी
  rationale: यह निकट रहनेवाले लोगों का सामान्य और स्वाभाविक हिन्दी पद है तथा मित्रों और कारोबारी साथियों की सामाजिक सूची में ठीक बैठता है।
- source_word: φίλοι
  choice: मित्र
  rationale: इस सूची में शब्द का सामान्य संबंधपरक अर्थ सबसे उपयुक्त है; इसे ‘सहयोगी’ कहना अनावश्यक रूप से राजनीतिक या औपचारिक अर्थ जोड़ सकता है।
- source_word: συνπραγματευόμενοι
  choice: साथ में कारोबार करनेवाले लोग
  rationale: कृदन्त साझा व्यवहार, कामकाज या लेन-देन में लगे लोगों को दर्शाता है। यह हिन्दी अभिव्यक्ति व्यावसायिक संदर्भ को स्पष्ट करती है, पर औपचारिक साझेदारी का दावा नहीं करती।
- source_word: μυστικῶς
  choice: चुपके से
  rationale: यह गुप्त या दूसरों की दृष्टि से बचाकर की गई कार्रवाई को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τινας ἐπισπώμενοι
  choice: कुछ लोगों को ... अलग ले जाकर
  rationale: ἐπισπάω में अपनी ओर खींचने या अलग ले जाने का भाव हो सकता है। संदर्भ में यह अनुवाद गुप्त निजी बातचीत का दृश्य बनाए रखता है और ‘अपने पक्ष में कर लेना’ जैसा निश्चित प्रेरक अर्थ नहीं थोपता।
- source_word: πίστεις ἐδίδουν
  choice: यह भरोसा दिलाने लगे
  rationale: शाब्दिक ‘प्रतिज्ञाएँ देना’ के बजाय यह मुहावरे का आश्वासन अथवा विश्वसनीय वचन देने वाला अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνασπίζειν
  choice: उनकी रक्षा में साथ खड़े होंगे
  rationale: यह क्रिया ढाल लेकर मिलकर खड़े होने की सामूहिक रक्षात्मक छवि रखती है। हिन्दी में यह चयन संयुक्त संरक्षण का भाव स्वाभाविक रूप से देता है।
- source_word: πᾶν ἐκτενὲς προσιοίσεσθαι
  choice: अपनी पूरी शक्ति लगा देंगे
  rationale: यह पूर्ण तत्परता और भरसक प्रयास देने का अर्थ सहज हिन्दी में व्यक्त करता है, यद्यपि यूनानी वाक्यांश का रूप अधिक अमूर्त है।
- source_word: πρὸς ἀντίλημψιν
  choice: उनकी सहायता के लिए
  rationale: ἀντίλημψις का यहाँ सहायता, सहारा या मदद का अर्थ है; प्रसंग में ‘सहायता के लिए’ स्पष्ट और स्वाभाविक है।
