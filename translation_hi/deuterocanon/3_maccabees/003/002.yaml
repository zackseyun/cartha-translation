  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: hi
  text: जब इन मामलों का प्रबंध किया जा रहा था, तब उस जनसमुदाय के विरुद्ध उन लोगों के बीच, जो उसे हानि पहुँचाने के लिए एकमत थे, एक दुर्भावनापूर्ण अफ़वाह फैलाई गई; इस प्रकार उनकी शत्रुतापूर्ण मनोवृत्ति को बढ़ावा देने के लिए एक अवसर[a] दिया गया, मानो उस जनसमुदाय को अपने प्रचलित विधि-विधानों[b] से रोका जा रहा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अवसर’ का अनुवाद ‘बहाना’ या ‘आधार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रचलित विधि-विधान’ का अर्थ ‘परंपरागत नियम,’ ‘स्थापित रीति-रिवाज,’ या ‘पैतृक व्यवस्थाएँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονομουμένων
  choice: व्यवस्था की जा रही थी
  rationale: यह पद कामों को सँभालने, चलाने या सुव्यवस्थित करने का भाव देता है; संदर्भ में यह सहज और पर्याप्त रूप से व्यापक है।
- source_word: φήμη δυσμενὴς
  choice: दुर्भावनापूर्ण अफ़वाह
  rationale: φήμη का अर्थ खबर या अफ़वाह हो सकता है, जबकि δυσμενής उसमें विरोध और दुर्भावना का भाव जोड़ता है।
- source_word: ἐξέκειτο
  choice: फैलाई गई
  rationale: φήμη के साथ यह किसी बात के सामने रखे जाने या प्रचलित किए जाने को दर्शाता है; हिन्दी में ‘अफ़वाह फैलाई गई’ स्वाभाविक है।
- source_word: κατὰ τοῦ γένους
  choice: उस जाति के विरुद्ध
  rationale: γένος यहाँ यहूदी समुदाय को एक सामूहिक जातीय-जन पहचान के रूप में दर्शाता है; ‘जाति’ हिन्दी में उस सामूहिकता को संक्षेप में व्यक्त करती है।
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: उन लोगों के बीच ... जो उसे हानि पहुँचाने की एक ही सोच रखते थे
  rationale: सहमत मनोवृत्ति और हानि पहुँचाने की दिशा दोनों को स्पष्ट करते हुए यूनानी वाक्यांश के संकुचित रूप को स्वाभाविक हिन्दी में खोला गया है।
- source_word: ἀφόρμης ... διδομένης
  choice: एक बहाना मिल गया
  rationale: ἀφορμή अवसर, आधार या बहाना हो सकता है; इस शत्रुतापूर्ण प्रचार के संदर्भ में ‘बहाना’ स्वाभाविक है, जबकि व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: διάθεσιν
  choice: इरादे को पूरा करने के लिए
  rationale: διάθεσις मनोवृत्ति, प्रवृत्ति या उद्देश्य का संकेत दे सकता है। यहाँ पहले से बताई गई हानिकारक सोच के कारण ‘इरादा’ प्रसंगानुकूल है, पर इसे किसी विशिष्ट कार्रवाई तक सीमित नहीं किया गया।
- source_word: νομίμων
  choice: प्रचलित विधि-विधान
  rationale: τὰ νόμιμα स्थापित कानूनों, धार्मिक आचारों या परंपरागत रीति-विधानों को सूचित कर सकता है; संयुक्त अभिव्यक्ति कानूनी और प्रथागत दोनों पहलुओं को बनाए रखती है।
- source_word: κωλύωνται
  choice: रोका जा रहा हो
  rationale: ὡς ἂν के साथ यह वास्तविक तथ्य नहीं, बल्कि प्रचार में प्रस्तुत कथित बाधा को व्यक्त करता है; ‘मानो’ उस आरोपित स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: γένος से सूचित यहूदी सामूहिकता
  choice: उस जाति
  alternative: उस समुदाय / उस राष्ट्र
  rationale: यहाँ किसी जैविक नस्ल-सिद्धांत के बजाय एक जातीय-जन समुदाय अभिप्रेत है। ‘उस जाति’ पाठ के सामूहिक भाव को रखता है, जबकि संदर्भ से यहूदियों की पहचान स्पष्ट होती है।
- issue: ἀφορμή का शत्रुतापूर्ण संदर्भ में अर्थ
  choice: बहाना
  alternative: अवसर / आधार
  rationale: वाक्य में दुर्भावनापूर्ण अफ़वाह से हानि के इरादे को आगे बढ़ाने का आधार मिलता है। ‘बहाना’ इस प्रसंग में संभावित छलपूर्ण उपयोग को व्यक्त करता है, पर यूनानी की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- issue: αὐτούς और कथित रोक का संदर्भ
  choice: उन्हें अपने प्रचलित विधि-विधानों का पालन करने से रोका जा रहा हो
  alternative: वे प्रचलित विधि-विधानों से वंचित किए जा रहे हों
  rationale: यूनानी वाक्य संक्षिप्त है और सर्वनाम का संदर्भ पूरी तरह स्पष्ट नहीं। मुख्य पाठ उसे पहले उल्लिखित समान सोच वाले लोगों से जोड़ता है, लेकिन पादटिप्पणी में संदर्भगत अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। लंबे और संकुचित यूनानी वाक्य को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है। ‘अफ़वाह’, ‘हानि पहुँचाने’, ‘बहाना’ और ‘विधि-विधान’ जैसे शब्द शत्रुतापूर्ण राजनीतिक-सामाजिक संदर्भ को रखते हैं, बिना हिंसा के किसी विशेष रूप या संप्रदायगत व्याख्या को आरोपित किए।
