  text: क्योंकि किसी भी बात से अनजान न रहने वाली इतनी बड़ी संस्था की अनदेखी नहीं की जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  choice: अनदेखी नहीं की जाएगी
  rationale: भविष्यत् कर्मवाच्य क्रिया का अर्थ ‘उपेक्षित/अनदेखा किया जाना’ है। ‘अनदेखी नहीं की जाएगी’ उसके काल, वाच्य और निषेध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: οὕτω
  choice: इस प्रकार
  rationale: οὕτω को क्रिया παροραθήσεσθαι के साथ रखना यूनानी शब्दक्रम और सामान्य क्रियाविशेषणीय अर्थ के अधिक निकट है; इसे τηλικοῦτο के साथ मिलाकर केवल ‘इतनी बड़ी’ में समाहित नहीं किया गया।
- source_word: τηλικοῦτο
  choice: इतनी बड़ी
  rationale: यह परिमाण या महत्त्व की उल्लेखनीय महानता व्यक्त करता है, बिना यह तय किए कि केवल आकार अभिप्रेत है या प्रतिष्ठा।
- source_word: σύστημα
  choice: संस्था
  rationale: यह साथ मिलकर बने संगठित निकाय या व्यवस्था को सूचित कर सकता है। प्रसंग में ‘संस्था’ आधुनिक हिन्दी में संगठित सामूहिक निकाय का स्पष्ट और सहज बोध कराता है।
- source_word: μηδὲν ἠγνοηκός
  choice: जो किसी भी बात से अनजान नहीं थी
  rationale: पूर्ण सक्रिय कृदन्त का मूल भाव ‘किसी बात से अनजान न होना’ है। यह अनुवाद उसे ‘कुछ भी न छोड़ना’ जैसे अधिक व्याख्यात्मक अर्थ में बदले बिना स्वाभाविक हिन्दी देता है।
