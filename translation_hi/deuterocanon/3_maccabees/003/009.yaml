review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, τηλικοῦτο, σύστημα, the passive future of παροραθήσεσθαι, and the basic sense of μηδὲν ἠγνοηκός. However, οὕτω intensifies τηλικοῦτο ('so/that great'), rather than naturally meaning 'इस प्रकार' with 'अनदेखी'; the latter introduces a manner contrast not present in the Greek. The past 'नहीं थी' is also not warranted by the perfect participle, whose resulting-state sense is better retained by 'न रहने वाली'/'न होने वाली.'
  naturalness: '''इस प्रकार अनदेखी नहीं की जाएगी'' is possible Hindi but sounds like it refers to a previously described method of disregard, which is not the force of the Greek. The revised wording is modern, clear, and appropriately formal.'
  terminology: '''संस्था'' is a defensible contextual rendering of σύστημα. The footnote appropriately preserves ''संगठित निकाय'' as a lexical alternative. No theological terminology is involved.'
  issues:
  - severity: medium
    issue: οὕτω is rendered as 'इस प्रकार' modifying the passive verb.
    rationale: In this construction οὕτω strengthens τηλικοῦτο ('so great'), not the manner of being overlooked. The Hindi should place the emphasis with 'इतनी बड़ी.'
  - severity: medium
    issue: The participial clause is translated with the past tense 'अनजान नहीं थी.'
    rationale: μηδὲν ἠγνοηκός is a perfect participle and conveys a present resultant state ('ignorant of nothing' / 'having failed to notice nothing'). A past-state clause weakens this relation without contextual basis.
  revised_text: क्योंकि किसी भी बात से अनजान न रहने वाली इतनी बड़ी संस्था की अनदेखी नहीं की जाएगी।
  revised_footnotes:
