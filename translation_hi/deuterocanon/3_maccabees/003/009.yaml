    text: या “इतना बड़ा संगठित निकाय।”
    reason: σύστημα किसी संस्था, संगठित निकाय या व्यवस्था को सूचित कर सकता है।
  revision_rationale: The revision attaches the intensifier to 'इतनी बड़ी,' removes the unsupported past tense, and retains the future passive and the source's broad, non-technical reference to an organized body. The lexical-alternative footnote is retained unchanged.
