base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/020.yaml
  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
translation:
  language: hi
  text: परन्तु हम, उनकी मूर्खता को धैर्य से सहते हुए[a], विजय के साथ पार पहुँचाए जाकर, और मिस्र में सभी जातियों से मानवतापूर्वक मिलकर[b], वही किया जो उचित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी नासमझी के साथ नरमी से पेश आते हुए।” यूनानी कृदंत में धैर्यपूर्ण सहनशीलता का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मानवीय ढंग से” अथवा “उदारतापूर्वक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  choice: मूर्खता
  rationale: यह शब्द समझ-बूझ की कमी और अविवेक को व्यक्त करता है। ‘मूर्खता’ उसके नैतिक-बौद्धिक भाव को बनाए रखता है, बिना उसे मानसिक विक्षिप्तता के अर्थ में ले जाए।
- source_word: συμπεριενεχθέντες
  choice: धैर्य से सहते हुए
  rationale: इस प्रसंग में क्रिया किसी की मूर्खता के प्रति संयम और सहनशीलता से व्यवहार करने का भाव देती है। यह चयन उस धैर्यपूर्ण सहन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ νίκης
  choice: विजय के साथ
  rationale: यह यूनानी पदबंध का निकट और स्पष्ट रूप है; ‘विजयी होकर’ की तुलना में यह मूल संरचना को अधिक सुरक्षित रखता है।
- source_word: διακομισθέντες
  choice: पार पहुँचाए जाने पर
  rationale: क्रिया में पार ले जाए जाने या किसी परिस्थिति से सफलतापूर्वक निकाल दिए जाने का निष्क्रिय भाव है। हिन्दी में निष्क्रियता बनाए रखते हुए लक्ष्य या घटना को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: τοῖς πᾶσιν ἔθνεσιν
  choice: सभी जातियों से
  rationale: ἔθνη यहाँ विभिन्न जनसमुदायों या जातियों को सूचित करता है। ‘गैर-यहूदी’ कहना राजकीय वक्तव्य में ऐसा धार्मिक विरोध जोड़ देता जो मूल में स्पष्ट नहीं है।
- source_word: φιλανθρώπως
  choice: मानवोचित उदारता के साथ
  rationale: यह क्रिया-विशेषण मानवीय, उदार और परोपकारी ढंग से व्यवहार करने का भाव रखता है। चुना हुआ पद राजकीय दयालुता के आलंकारिक दावे को बनाए रखता है।
- source_word: ἀπαντήσαντες
  choice: मिलकर
  rationale: मूल क्रिया का आधारभूत अर्थ ‘मिलना’ या ‘भेंट करना’ है। ‘स्वागत करके’ या ‘व्यवहार करके’ की अपेक्षा यह कम व्याख्यात्मक है।
- source_word: καθὼς ἔπρεπεν
  choice: वही किया जो उचित था
  rationale: यह अभिव्यक्ति औचित्य और उपयुक्तता का दावा करती है। चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए औपचारिक राजकीय स्वर को बनाए रखता है।
theological_decisions:
- issue: अधीनस्थ जातियों के प्रति राजा की उदारता का आत्म-वर्णन
  choice: राजा के दावे को कथन के रूप में सीधे प्रस्तुत किया गया है, पर अनुवादक की ओर से उसकी पुष्टि नहीं जोड़ी गई।
  alternative: विडंबना या राजकीय प्रचार को प्रकट करने के लिए व्याख्यात्मक शब्द जोड़ना।
  rationale: यह पद राजकीय आत्म-औचित्य के वक्तव्य का भाग है। यूनानी पाठ में स्पष्ट न होने वाली स्वीकृति, निंदा या विडंबना अनुवाद में नहीं जोड़ी जानी चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय घोषणा के अनुरूप गरिमामय और औपचारिक रखी गई है। मूल के तीन कृदंतीय खंडों को यथासंभव समानांतर रखा गया है; διακομισθέντες का निष्क्रिय भाव भी सुरक्षित है।
