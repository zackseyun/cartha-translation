  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: hi
  text: परन्तु जिस किसी स्थान पर कोई यहूदी पूरी तरह छिपा हुआ पाया जाए, वह स्थान प्रवेश-अयोग्य और अग्नि-दग्ध हो जाए[a], और वह सदा के लिए प्रत्येक मरणशील प्राणी के लिए सर्वथा अनुपयोगी दिखाई देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस किसी स्थान पर कोई यहूदी छिपा हुआ पाया जाए।” τὸ σύνολον σκεπαζόμενος के आस-पास की यूनानी रचना कठिन है। τὸ σύνολον को ‘पूरी तरह’ के बल के रूप में समझा जा सकता है; आशय ऐसे स्थान का है जहाँ कोई यहूदी छिपा हुआ पाया जाए।
    reason: lexical_alternative
