  text: पर जो कोई यहूदियों में से किसी को—वृद्ध से लेकर शिशु तक, यहाँ तक कि दूध पीते शिशुओं तक भी[a]—शरण देगा, उसे उसके पूरे घराने समेत सबसे घृणित यातनाएँ देकर पीट-पीटकर मार डाला जाएगा।[b]
