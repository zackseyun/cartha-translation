    text: दुर्लभ यूनानी शब्द का अधिक शाब्दिक अनुवाद ‘स्तन के नीचे के शिशु’ हो सकता है; आशय उन शिशुओं से है जो अभी माँ का दूध पीते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया मारपीट द्वारा क्रूर मृत्युदंड का बोध कराती है। कुछ अनुवाद इसे अधिक तकनीकी रूप से ‘डंडों से पीटकर मार डाला जाएगा’ या ‘यातना-चक्र पर मार डाला जाएगा’ कहते हैं।
