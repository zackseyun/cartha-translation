- source_word: νόθως
  choice: कपट किया
  rationale: मूल क्रिया-विशेषण उनके व्यवहार को खोटा, नकली या निष्कपट न होने वाला बताता है। ‘कपट किया’ हिन्दी में कथनी और करनी के विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: προθυμηθέντων ἡμῶν
