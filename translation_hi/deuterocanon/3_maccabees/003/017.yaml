theological_decisions:
- issue: वक्ता द्वारा यहूदी मन्दिर में प्रवेश और उसे भेंटों से सम्मानित करने के कथित उद्देश्य का स्वर
  choice: वक्ता के दावे को सीधा ऐतिहासिक कथन मानकर अनूदित किया गया है।
  alternative: इसे अधिक अनुष्ठानिक रूप में ‘उनके मन्दिर में जाकर समर्पित भेंटों के द्वारा श्रद्धांजलि देने’ के रूप में कहा जा सकता था।
  rationale: यह भाषण के भीतर वक्ता का अपना दावा है, अनुवादक की धार्मिक स्वीकृति नहीं। इसलिए न तो दावे को नरम किया गया है, न उसके पक्ष या विपक्ष में कोई मत जोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बातों में ... व्यवहार में’ कथनी-करनी के विरोध को सहज हिन्दी में व्यक्त करता है। पद मूल वाक्य का अंश है, इसलिए अन्त में अल्पविराम बनाए रखा गया है।
