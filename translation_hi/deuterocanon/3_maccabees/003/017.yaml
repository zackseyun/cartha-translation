- source_word: ἀποδεξάμενοι
  choice: स्वीकार किया
  rationale: यह उनकी ओर से राजा की उपस्थिति को ग्रहण या स्वीकार करने का भाव देता है, पर ‘स्वागत किया’ जैसी हार्दिकता अनावश्यक रूप से नहीं जोड़ता।
- source_word: παρουσίαν
