translation:
  language: hi
  text: राजा टॉलेमी फिलोपातोर की ओर से—पूरे मिस्र में, स्थान-स्थान पर मौजूद सेनापतियों और सैनिकों को नमस्कार और उत्तम स्वास्थ्य की शुभकामनाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεὺς
  choice: राजा
  rationale: पत्र के प्रेषक के नाम से पहले प्रयुक्त राजकीय उपाधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: टॉलेमी फिलोपातोर
  rationale: व्यक्तिगत नाम और उपाधिनाम को मूल यूनानी के अनुरूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: τοῖς ... στρατηγοῖς καὶ στρατιώταις
  choice: सेनापतियों और सैनिकों को
  rationale: στρατηγοῖς सैन्य नेतृत्व करनेवालों और στρατιώταις सामान्य सैनिकों को दर्शाता है; हिन्दी में यह भेद स्पष्ट और स्वाभाविक रहता है।
- source_word: κατʼ Αἴγυπτον
  choice: पूरे मिस्र में
  rationale: κατά के भौगोलिक प्रयोग का वितरणात्मक भाव व्यक्त करता है—संबोधन मिस्र भर में उपस्थित लोगों के लिए है।
- source_word: καὶ κατὰ τόπον
  choice: स्थान-स्थान पर
  rationale: मुहावरेदार यूनानी पद का वितरणात्मक भाव बनाए रखता है। सैन्य संबोधन के साथ सहज हिन्दी के लिए ‘तैनात’ जोड़ा गया है, जबकि प्रशासनिक क्षेत्र अथवा अलग-अलग स्थानीय नियुक्तियों की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: χαίρειν καὶ ἐρρῶσθαι
  choice: नमस्कार और उत्तम स्वास्थ्य की शुभकामनाएँ
  rationale: यह पत्रारंभ की रूढ़ अभिवादन-विधि है; हिन्दी रूप अभिवादन और कुशल-स्वास्थ्य की कामना, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
