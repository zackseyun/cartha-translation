  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: hi
  text: हमने आदेश दिया है कि यह पत्र पहुँचते ही पंजी में दर्ज लोगों को[a], उनकी पत्नियों और बच्चों समेत, अपमानजनक दुर्व्यवहार और लूटपाट के साथ, लोहे की बेड़ियों में, चारों ओर से पूरी तरह बंद किए हुए, तुरंत हमारे पास भेज दिया जाए—उस असाध्य और कलंकपूर्ण गर्त में[c], जो शत्रुओं के योग्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पंजीकृत लोगों को” अथवा “नाम से सूचीबद्ध लोगों को”; यूनानी शब्द आधिकारिक पंजी में दर्ज व्यक्तियों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: “गर्त” का अर्थ वास्तविक गड्ढा भी हो सकता है, या यह विनाश और अपमान के स्थान का सजीव रूपक हो सकता है।
    reason: lexical_alternative
