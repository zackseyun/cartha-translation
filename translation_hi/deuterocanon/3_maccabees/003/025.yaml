- source_word: τοὺς ἐννεμομένους
  choice: पंजी में दर्ज लोगों को
  rationale: कृदंत किसी आधिकारिक सूची या पंजी में दर्ज व्यक्तियों को सूचित करता है; हिन्दी पदबंध प्रशासनिक अर्थ स्पष्ट रखता है।
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: उनकी पत्नियों और बच्चों समेत
  rationale: इस संदर्भ में γυναιξί दर्ज पुरुषों की पत्नियों के अर्थ में सर्वाधिक स्वाभाविक है।
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: अपमान और लूटपाट करते हुए
  rationale: ὕβρις अपमानजनक और उद्दंड दुर्व्यवहार, जबकि σκυλμοί छीनने, नोंचने या लूटने की क्रिया को व्यक्त करता है; दोनों पक्ष अलग रखे गए हैं।
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: लोहे की बेड़ियों में जकड़कर
  rationale: δεσμοί लोहे के बंधनों को बताता है; 'बेड़ियाँ' हिरासत और जबरन ले जाए जाने के प्रसंग में स्वाभाविक है।
- source_word: πάντοθεν κατακεκλεισμένους
  choice: चारों ओर से पूरी तरह बंद करके
  rationale: पूर्ण कृदंत और πάντοθεν मिलकर हर दिशा से संपूर्ण बंदीकरण पर बल देते हैं।
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: उस असाध्य और कलंकपूर्ण गर्त में, जो शत्रुओं के ही योग्य है
  rationale: βόθρος का ठोस बिंब 'गर्त' से रखा गया है; ἀνήκεστος का उपचार-असंभव भाव 'असाध्य' और δυσκλεής का अपयशभाव 'कलंकपूर्ण' से व्यक्त होता है।
