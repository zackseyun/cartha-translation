  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: hi
  text: यह बात मालूम होने पर[a] वह अधर्मी मनुष्य इतना क्रुद्ध हो उठा कि वह न केवल अलेक्ज़ान्द्रिया में रहने वालों पर क्रोधित हुआ, बल्कि देश के ग्रामीण क्षेत्रों में रहने वालों[b] का और भी कठोरता से विरोध करने लगा। फिर उसने आदेश दिया कि सबको शीघ्र एक ही स्थान पर इकट्ठा किया जाए और उन्हें सबसे भयंकर मृत्यु दी जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके अनुवाद ‘यह बात जान लेने पर’ या ‘यह सूचना मिलने पर’ भी हो सकते हैं। यूनानी μεταλαβών सूचना प्राप्त करने के साथ-साथ किसी बात को ग्रहण करने का अधिक सामान्य अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘χώρα में रहने वाले’। अलेक्ज़ान्द्रिया के साथ तुलना के कारण यहाँ संभवतः नगर के बाहर के आसपास के देहाती या प्रादेशिक इलाके अभिप्रेत हैं, न कि अमूर्त अर्थ में पूरा देश।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, ‘उन्हें जीवन से हटा देना’—अर्थात, उन्हें मार डालना।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: यह बात मालूम होने पर
  rationale: संदर्भ में कृदंत का आशय किसी बात या सूचना को ग्रहण करने अथवा जानने से है। यह हिंदी प्रयोग स्वाभाविक है और सूचना वास्तव में किस माध्यम से मिली, यह निर्धारित नहीं करता।
- source_word: δυσσεβὴς
  choice: भक्तिहीन मनुष्य
  rationale: यह शब्द केवल सामान्य दुष्टता नहीं, बल्कि धर्म और श्रद्धा के प्रति अनादर का भाव रखता है; ‘भक्तिहीन’ उस धार्मिक अर्थछाया को बनाए रखता है।
- source_word: ἐξεχόλησεν
  choice: इतना क्रुद्ध हो उठा
  rationale: क्रिया अत्यंत तीव्र रोष प्रकट करती है, और ‘इतना…कि’ यूनानी ὥστε-वाक्य के परिणामसूचक विन्यास को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: अलेक्ज़ान्द्रिया में रहनेवालों
  rationale: वाक्य में उल्लिखित लोगों की नगरगत स्थिति व्यक्त होती है; मूल में अनुपस्थित कोई जातीय संज्ञा मुख्य पाठ में नहीं जोड़ी गई।
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: नगर के बाहर के प्रदेश में रहनेवालों
  rationale: अलेक्ज़ान्द्रिया के साथ विरोध से χώρα यहाँ आसपास के गैर-नगरीय क्षेत्र को सूचित करता है। यह चयन ‘पूरे देश’ जैसी अनावश्यक व्यापकता से बचता है।
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: के विरुद्ध और भी कठोरता से खड़ा हो गया
  rationale: यह अनुवाद विरोधी रुख तथा तुलनात्मक βαρυτέρως—‘और भी कठोरता से’—दोनों को व्यक्त करता है, बिना अनिवार्य रूप से प्रत्यक्ष हिंसा जोड़ने के।
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: उसने आदेश दिया कि सबको शीघ्र एक ही स्थान पर इकट्ठा किया जाए
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त है। हिंदी का कर्मवाच्य आदेश की तात्कालिकता, ‘सबको’ और ‘एक ही स्थान पर’ को बनाए रखता है, पर आदेश का पालन करनेवाले व्यक्तियों की पहचान नहीं गढ़ता।
- source_word: χειρίστῳ μόρῳ
  choice: सबसे भयंकर मृत्यु देकर
  rationale: μόρος यहाँ विनाशकारी अंत या मृत्यु को सूचित करता है और χειρίστῳ उसकी चरम भयावहता बताता है। हिंदी में ‘सबसे भयंकर मृत्यु’ अर्थ को स्पष्ट और गंभीर रूप में व्यक्त करता है।
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: उनका जीवन समाप्त कर दिया जाए
  rationale: मूल का शाब्दिक भाव ‘जीवन से हटा देना’ है, जो मृत्यु देने का परोक्ष कथन है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
