  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप रखा गया है। ‘क्रुद्ध’, ‘भक्तिहीन’ और ‘भयंकर मृत्यु’ मूल के तीखे नैतिक और भावात्मक स्वर को बनाए रखते हैं। संक्षिप्त यूनानी आदेश-विन्यास को स्वाभाविक हिंदी कर्मवाच्य में व्यक्त किया गया है, जिससे अज्ञात कार्यकर्ताओं की पहचान पाठ में नहीं जोड़ी जाती।
