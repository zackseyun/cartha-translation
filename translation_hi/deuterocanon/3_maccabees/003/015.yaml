  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: hi
  text: हमने यह उचित समझा कि कोएले-सीरिया और फ़ोनीकिया में रहने वाली जातियों को पालें-पोसें[a]—भाले के बल से नहीं,[b] बल्कि नरमी और बड़ी दयालुता से—और प्रसन्नतापूर्वक उनका भला करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ किसी बच्चे को पालना-पोसना या उसका पालन करना भी हो सकता है; यहाँ अधीन जातियों के साथ अभिभावक-सदृश व्यवहार का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘भाले के बल से’ है—यह सैनिक दबाव या बलपूर्वक शासन का बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: हमने यह उचित समझा
  rationale: यहाँ क्रिया सोच-विचार करके नीति ठहराने का भाव देती है; यह अनुवाद उस विचारपूर्ण निर्णय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μὴ βίᾳ δόρατος
  choice: भाले के बल से नहीं
  rationale: βία का अर्थ बल या हिंसक शक्ति और δόρυ का अर्थ भाला है। ठोस सैनिक बिंब को सामान्य ‘हथियारों के बल’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: ἐπιεικείᾳ
  choice: नरमी से
  rationale: राजकीय संदर्भ में इसका अर्थ उदारता, सहनशीलता या कृपालु व्यवहार हो सकता है। ‘नरमी’ बलपूर्वक शासन के साथ विरोध को स्पष्ट और सहज रखती है।
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: बड़ी दयालुता से
  rationale: शब्द मनुष्यों के प्रति सद्भाव, मानवीयता और उपकारपूर्ण व्यवहार दर्शाता है। ‘बड़ी दयालुता’ आधुनिक हिन्दी में स्पष्ट है और सामान्य ‘कृपा’ की अपेक्षा मानवीय व्यवहार पर बल देती है।
- source_word: τιθηνήσασθαι
  choice: पालें-पोसें
  rationale: यह क्रिया बच्चे को दूध पिलाकर पालने या उसका पालन-पोषण करने का बिंब जगाती है। ‘पालें-पोसें’ अधीन जातियों के प्रति मूल पाठ की अभिभावक-सदृश, किंतु संरक्षणवादी, भाषा बनाए रखता है।
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: में रहनेवाली जातियों
  rationale: ἔθνη यहाँ विभिन्न जनसमुदायों या जातियों को और κατοικοῦντα उनके वहाँ बसे होने को दर्शाता है।
- source_word: Κοίλην Συρίαν
  choice: कोइले-सूरिया
  rationale: यह हेलेनिस्ती काल का भौगोलिक नाम है, इसलिए इसका शाब्दिक अर्थ ‘खोखला सूरिया’ करने के बजाय लिप्यंतरण किया गया है।
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: प्रसन्नतापूर्वक उनका भला करें
  rationale: εὖ ποιέω उपकार करने या भला करने और ἀσμένως प्रसन्न इच्छा से करने का भाव देता है। हिन्दी में वाक्य को स्वाभाविक रखने के लिए संकुचित कृदंत को उद्देश्य-श्रृंखला से जोड़ा गया है।
theological_decisions:
- issue: τιθηνήσασθαι में शासन का अभिभावक-सदृश बिंब
  choice: ‘पालें-पोसें’ कहकर पालन-पोषण का रूपक बनाए रखा गया है।
  alternative: ‘शासन करें’, ‘प्रबंध करें’ या ‘व्यवहार करें’।
  rationale: तटस्थ प्रशासनिक शब्द मूल यूनानी की संरक्षणवादी राजकीय वाणी को छिपा देते। पाठ की ऐतिहासिक और नैतिक तनावपूर्ण भाषा को बिना समर्थन या निंदा जोड़े सुरक्षित रखना अधिक पारदर्शी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पालें-पोसें’ जानबूझकर कुछ असामान्य राजनीतिक रूपक बनाए रखता है। कोष्ठक-चिह्नों के स्थान पर डैश से विरोधी साधनों—भाले का बल बनाम नरमी और दयालुता—को स्पष्ट किया गया है।
