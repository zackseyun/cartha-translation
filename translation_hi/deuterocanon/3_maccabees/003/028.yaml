base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: hi
  text: और जो कोई उनके विरुद्ध सूचना देना चाहे, वह इसके बदले उस व्यक्ति की संपत्ति पाएगा जो दंड का भागी ठहरेगा[a], साथ ही राजकोष से दो हज़ार द्राख्मा पाएगा, और उसे स्वतंत्रता का मुकुट पहनाया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आधिकारिक जाँच अथवा जवाबदेही के अधीन आएगा।” यूनानी पदबंध दंडात्मक राजाज्ञा के इस प्रसंग में दंड का भागी होने का अर्थ दे सकता है, पर उसमें न्यायिक जाँच या कानूनी जवाबदेही का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “स्वतंत्रता का मुकुट पहनाया जाएगा”; संभवतः इसका अर्थ है कि सूचना देने वाले को पुरस्कार के रूप में स्वतंत्रता प्रदान की जाएगी।
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: उनके विरुद्ध सूचना देना
  rationale: कानूनी-प्रशासनिक प्रसंग में यह अधिकारियों को किसी के विरुद्ध सूचना देने को दर्शाता है; यह अनुवाद आरोपात्मक भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸν βουλόμενον
  choice: जो कोई ... चाहे
  rationale: संज्ञार्थक कृदंत यहाँ सामान्य और खुला निमंत्रण व्यक्त करता है।
- source_word: ἐφʼ ᾧ
  choice: इसके बदले
  rationale: यह सूचना देने के कार्य को मिलने वाले प्रतिफल से जोड़ता है और हिन्दी में कारण/प्रतिफल संबंध को सहज ढंग से व्यक्त करता है।
- source_word: οὐσίαν
  choice: संपत्ति
  rationale: यहाँ दोषी ठहराए गए व्यक्ति की जब्त की जाने वाली भौतिक संपदा अभिप्रेत है।
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: उस व्यक्ति की ... जो दंड का भागी ठहरेगा
  rationale: प्रसंग दंडात्मक राजाज्ञा का है, किंतु εὔθυνα में आधिकारिक जाँच अथवा जवाबदेही का अर्थ भी संभव है; मुख्य पाठ प्रसंगानुकूल दंडात्मक अर्थ देता है और पादटिप्पणी अस्पष्टता सुरक्षित रखती है।
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: राजकोष से
  rationale: यूनानी में निहित कोष/धन को हिन्दी में स्पष्ट करना आवश्यक है; 'राजकोष' संक्षिप्त और ऐतिहासिक प्रसंगानुकूल है।
- source_word: δραχμὰς δισχιλίας
  choice: दो हज़ार द्राख्मा
  rationale: ऐतिहासिक मुद्रा-इकाई को सामान्य 'सिक्के' में बदलने के बजाय लिप्यंतरित रूप में रखा गया है।
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: उसे स्वतंत्रता का मुकुट पहनाया जाएगा
  rationale: στεφανόω की सम्मानसूचक मुकुट-छवि सुरक्षित रहती है, जबकि पदबंध संभवतः पुरस्कार के रूप में दास-मुक्ति या कानूनी स्वतंत्रता देने का संकेत करता है।
theological_decisions:
- issue: राजाज्ञा में ‘स्वतंत्रता का मुकुट पहनाया जाएगा’ का आशय
  choice: मुकुट की रूपकात्मक और सम्मानसूचक छवि को मुख्य पाठ में अक्षुण्ण रखा गया है।
  alternative: उसे स्वतंत्र कर दिया जाएगा / उसे नागरिक अधिकार दिए जाएँगे
  rationale: वाक्यांश संभवतः वास्तविक मुक्ति का पुरस्कार बताता है, पर यह स्पष्ट नहीं करता कि वह दास-मुक्ति है, व्यापक कानूनी स्वतंत्रता है या नागरिक विशेषाधिकार; इसलिए किसी एक अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कानूनी-राजकीय रजिस्टर अपनाया गया है। ‘द्राख्मा’ ऐतिहासिक मुद्रा को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
