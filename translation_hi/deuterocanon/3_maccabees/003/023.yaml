base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: hi
  text: उन्होंने न केवल उस सम्माननीय नागरिक व्यवस्था को ठुकरा दिया है[a], बल्कि वे अपने बीच के उन थोड़े-से लोगों से भी—जो हमारे प्रति सच्चा सद्भाव रखते हैं—वाणी और मौन, दोनों में घृणा करते हैं[b]। वे हर अवसर पर अत्यंत अधार्मिक बहाने का सहारा लेकर[c] हमारे मामलों को जल्द-से-जल्द बरबाद करने पर उतारू हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सम्माननीय नागरिक व्यवस्था’ का यूनानी पद नागरिकता, संविधान या सार्वजनिक जीवन-व्यवस्था को सूचित कर सकता है। ἄτιμητον का रूप ‘अनादृत’ या ‘सम्मानरहित’ भी समझा जा सकता है, पर यहाँ प्रसंग मूल्यवान व्यवस्था की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, ‘वचन और मौन में’; अर्थात उनकी घृणा कही हुई बातों में भी और मौन व्यवहार में भी दिखाई देती है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी अभिव्यक्ति का अनुवाद ‘घोर अधार्मिक प्रदर्शन के साथ’ या ‘घोर अधार्मिक बहाने के अधीन’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: ठुकरा दिया है
  rationale: मध्यवाच्य क्रिया यहाँ जानबूझकर मुँह मोड़ने या अस्वीकार करने का भाव देती है; ‘ठुकरा दिया’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: उस सम्माननीय नागरिक व्यवस्था को
  rationale: πολιτεία यहाँ केवल व्यक्तिगत नागरिकता नहीं, बल्कि नागरिक या राजकीय व्यवस्था को सूचित करता है। प्रसंग के आरोपात्मक तर्क में ἄτιμητον को सम्मान-योग्य या मूल्यवान व्यवस्था के रूप में समझना अधिक संगत है; रूप की दूसरी सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: βδελύσσονται
  choice: घृणा करते हैं
  rationale: यह तीव्र वितृष्णा या घोर घृणा की क्रिया है; ‘घृणा करते हैं’ स्पष्ट, सशक्त और सामान्य पाठक के लिए सहज है।
- source_word: λόγῳ τε καὶ σιγῇ
  choice: वाणी और मौन, दोनों में
  rationale: मूल की युग्मित अभिव्यक्ति को बनाए रखता है और खुली तथा मौन—दोनों प्रकार की शत्रुता का संकेत देता है, बिना उस संकेत को मुख्य पाठ में पूरी तरह व्याख्यायित किए।
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: जो हमारे प्रति सच्चा सद्भाव रखते हैं
  rationale: διακεῖμαι πρός किसी के प्रति मनोभाव दर्शाता है और γνησίως उसकी सच्चाई पर बल देता है। ‘सद्भाव’ औपचारिक राजनीतिक निष्ठा का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: παρʼ ἕκαστα
  choice: हर अवसर पर
  rationale: प्रसंग में यह मुहावरेदार अर्थ देता है कि जब-जब अवसर मिले; यह शब्दशः ‘हर बात में’ से अधिक स्वाभाविक है।
- source_word: ἐφορμώμενοι
  choice: आक्रामक हो उठते हैं
  rationale: कृदन्त में आगे बढ़कर हमला करने या किसी के विरुद्ध चढ़ आने का भाव है। ‘आक्रामक हो उठते हैं’ इस शत्रुतापूर्ण आवेग को बनाए रखता है।
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: घोर अधार्मिक मंशा के साथ
  rationale: दुष्ट या अधार्मिक प्रेरणा का आरोप स्पष्ट करता है, जबकि ἐμφάσεως के ‘प्रदर्शन/आभास/बहाने’ जैसे सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: διὰ τάχους
  choice: शीघ्र ही
  rationale: यह पद गति और तत्परता व्यक्त करता है; हिन्दी में क्रिया-विशेषण के रूप में रखना स्वाभाविक है।
- source_word: ἡμᾶς καταστρέψαι τὰ πράγματα
  choice: हमारे मामलों को बरबाद कर देने
  rationale: καταστρέφω और τὰ πράγματα मिलकर मामलों, स्थिति या राजकीय हितों को उलटने/नष्ट करने का व्यापक राजनीतिक भाव देते हैं; ‘मामलों’ से इसे केवल राज्य-विनाश तक सीमित नहीं किया गया।
theological_decisions:
- issue: ἄτιμητον का मूल्य-संबंधी अर्थ
  choice: सम्माननीय/मूल्यवान
  alternative: अनादृत अथवा सम्मानरहित
  rationale: शब्दरूप नकारात्मक अर्थ की सम्भावना रखता है, पर तत्कालीन राजकीय आरोप का तर्क उस व्यवस्था को मूल्यवान बताकर उसके अस्वीकार को दोष ठहराता है। अस्पष्टता को पाद-टिप्पणी में खुला रखा गया है।
- issue: ἐμφάσεως का आशय
  choice: मंशा
  alternative: प्रदर्शन, आभास, ढोंग या बहाना
  rationale: वाक्य में आक्रमण को प्रेरित करने वाले अधार्मिक भाव का अर्थ प्रवाहपूर्ण है, पर यूनानी संज्ञा बाहरी प्रदर्शन या बहाने की ओर भी संकेत कर सकती है; इसलिए वैकल्पिक अर्थ को दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ राजकीय-अभियोग वाला स्वर रखा गया है। लम्बे यूनानी वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘नागरिक व्यवस्था’, ‘सद्भाव’ और ‘हमारे मामले’ राजनीतिक अर्थक्षेत्र बनाए रखते हैं, पर आधुनिक संवैधानिक या सम्प्रदायगत अर्थ अनावश्यक रूप से नहीं जोड़ते।
