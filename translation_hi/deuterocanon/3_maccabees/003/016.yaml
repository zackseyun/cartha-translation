  choice: निर्धारित करने के बाद
  rationale: यह भूतकालिक कृदन्त मुख्य क्रिया से पहले की प्रशासनिक कार्रवाई बताता है; आय को बाँटने या नियत करने के अर्थ में यह स्वाभाविक है।
- source_word: τοῖς κατὰ πόλεσιν ἱεροῖς
  choice: नगर-नगर के मंदिरों के लिए
  rationale: κατὰ πόλεσιν विभिन्न नगरों में स्थित मंदिरों का बोध कराता है; हिन्दी में ‘नगर-नगर के’ संक्षिप्त और सहज है।
- source_word: προσόδους πλείστας
  choice: बहुत बड़ी आय
  rationale: πρόσοδοι यहाँ राजस्व अथवा नियमित आमदनी है, साधारण भेंट नहीं; πλείστας उसकी प्रचुर मात्रा पर बल देता है।
- source_word: προηχθημεν
  choice: हम आगे बढ़े
  rationale: यह रूप प्रसंग में आगे जाने या प्रस्थान जारी रखने के अर्थ में प्रयुक्त है।
- source_word: ἀναβάντες
  choice: यरूशलेम जाकर
  rationale: मूल में यरूशलेम ‘ऊपर जाने’ का पारंपरिक यात्रा-वर्णन है; प्रवाहपूर्ण हिन्दी में ‘जाकर’ मुख्य आशय रखता है, जबकि भौगोलिक आरोहण को अनावश्यक रूप से प्रमुख नहीं करता।
- source_word: τιμῆσαι
  choice: सम्मान किया
  rationale: यह गमन का उद्देश्य व्यक्त करता है; हिन्दी वाक्य में समन्वित क्रिया के रूप में उद्देश्य स्पष्ट और स्वाभाविक रहता है।
- source_word: τὸ ἱερὸν
  choice: मंदिर
  rationale: इस प्रसंग में यह यरूशलेम के मंदिर अथवा मंदिर-परिसर को सूचित करता है।
- source_word: ἀλητρίων
  choice: जो कभी फटके नहीं गए
  rationale: दुर्लभ शब्द की कृषि-संबंधी छवि—अनाज का फटककर साफ़ न किया जाना—सुरक्षित रखी गई है; इसे सामान्य नैतिक विशेषण बनाकर अस्पष्टता समाप्त नहीं की गई।
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  choice: अपनी मूर्खता से कभी बाज़ नहीं आते
  rationale: यह निरंतर बनी रहने वाली ἀνοία को मुहावरेदार आधुनिक हिन्दी में व्यक्त करता है और राजकीय वक्ता का तिरस्कारपूर्ण स्वर बनाए रखता है।
theological_decisions:
- issue: τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας का संबंध और भाव
  choice: इसे यरूशलेम के मंदिर से जुड़े लोगों के लिए प्रयुक्त तिरस्कारपूर्ण वर्णन माना गया है।
  alternative: इसे अधिक सकारात्मक अर्थ में ‘शुद्ध लोगों’ या ‘भक्ति में निरंतर रहने वालों’ का मंदिर समझना।
  rationale: व्याकरणतः संबंधकारक पदबंध ἱερόν पर आश्रित होकर मंदिर को उसके उपासकों के द्वारा पहचानता है। ἀλητρίων दुर्लभ और कठिन है, इसलिए सकारात्मक विकल्प पूरी तरह असंभव नहीं, पर तत्कालीन विरोधी वक्तृता कठोर अर्थ को अधिक स्वाभाविक बनाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। राजकीय वक्ता का विरोधी और अपमानसूचक स्वर सुरक्षित है। कृषि-रूपक को पाठ में रखा गया और उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
