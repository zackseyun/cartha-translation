  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: hi
  text: और नगरों में स्थित मंदिरों को बहुत अधिक राजस्व आवंटित करने के बाद, हम आगे बढ़े और यरूशलेम गए, ताकि उन लोगों के मंदिर का सम्मान करें जो कभी न फटके हुए हैं[a] और अपनी मूर्खता से कभी बाज़ नहीं आते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कभी न फटके हुए’ के लिए आया यूनानी शब्द दुर्लभ और कठिन है। यह संभवतः ऐसे लोगों के लिए तिरस्कारपूर्ण कृषि-रूपक है जिन्हें असंस्कृत या अशुद्ध समझा गया है; कुछ व्याख्याकार इसे अधिक सकारात्मक अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
