  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: hi
  text: और वे हमारे प्रति अपनी शत्रुता को स्पष्ट करते हुए, सब जातियों में अकेले, राजाओं और अपने उपकारियों के प्रति अकड़ते हैं और कुछ भी खरा प्रस्तुत करना नहीं चाहते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: शत्रुता
  rationale: यह शब्द विरोधी या वैरपूर्ण मनोभाव को व्यक्त करता है; ‘शत्रुता’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔκδηλον καθιστάντες
  choice: प्रकट करते हैं
  rationale: शाब्दिक अर्थ ‘प्रत्यक्ष/स्पष्ट बना देना’ है; प्रसंग में आरोपात्मक कथन के रूप में ‘प्रकट करते हैं’ सहज है।
- source_word: μονώτατοι τῶν ἐθνῶν
  choice: सब जातियों में केवल वे ही
  rationale: अतिशयोक्तिपूर्ण μονώτατοι और तुलनात्मक दायरे τῶν ἐθνῶν, दोनों को सुरक्षित रखता है।
- source_word: ὑψαυχνοῦντες
  choice: अकड़ दिखाते हैं
  rationale: शब्द का चित्र ऊँची गर्दन रखकर घमंड या उद्दंडता दिखाने का है; यह हिन्दी में उसी व्यवहार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδὲν γνήσιον ... φέρειν
  choice: किसी भी बात में सच्चा व्यवहार
  rationale: γνήσιον का अर्थ खरा, असली, निष्कपट या सच्चा हो सकता है; φέρειν के व्यापक व्यवहारगत अर्थ को देखते हुए इसे केवल भेंट चढ़ाने तक सीमित नहीं किया गया।
- source_word: βούλονται
  choice: नहीं करना चाहते
  rationale: इच्छा या तत्परता के अभाव को सीधे व्यक्त करता है।
theological_decisions:
- issue: वक्ता द्वारा यहूदियों पर लगाया गया व्यापक आरोप
  choice: आरोप को कथन के भीतर उसी तीखे रूप में रखा गया
  alternative: इसे नरम करके केवल कुछ लोगों के व्यवहार तक सीमित करना
  rationale: मूल राजकीय आरोप की अतिशयोक्ति पाठ का अंग है; अनुवाद को उसे अनुमोदित किए बिना faithfully प्रस्तुत करना चाहिए।
- issue: γνήσιον का अर्थ
  choice: सच्चा व्यवहार
  alternative: सच्ची भेंट / वास्तविक वस्तु
  rationale: यहाँ कर्म और संबंधों के संदर्भ में निष्कपट या खरे आचरण का अर्थ अधिक संभावित है, किंतु वाक्यांश में कुछ अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय अभियोग की कठोरता और अतिशयोक्ति सुरक्षित रखते हुए वाक्य को साधारण पाठक के लिए स्वाभाविक बनाया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
