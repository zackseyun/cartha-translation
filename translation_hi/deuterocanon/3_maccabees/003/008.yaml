base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: hi
  text: परन्तु नगर में रहनेवाले यूनानियों ने, जिनके साथ कोई अन्याय नहीं हुआ था, उन पुरुषों के विषय में मची अप्रत्याशित हलचल और हो रहे अव्यवस्थित जमावड़ों को देखकर उनकी सहायता करने की सामर्थ्य नहीं पाई; क्योंकि उनकी मनोवृत्ति उन्हें विनती करने के लिए प्रेरित कर रही थी[a]। कुछ लोग भी स्वयं व्याकुल अवस्था में थे[b] और समझते थे कि ये परिस्थितियाँ बदल जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उनकी प्रवृत्ति उन्हें ढाढ़स बँधाने के लिए प्रेरित कर रही थी।” यूनानी वाक्यांश संक्षिप्त और कठिन है; यहाँ प्रयुक्त शब्द का अर्थ विनती, आग्रह, प्रोत्साहन या सांत्वना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कुछ लोग स्वयं भी भीड़ की हलचल में बह गए थे।” दुर्लभ यूनानी क्रिया-विशेषण आंतरिक व्याकुलता या सामूहिक हलचल में शामिल हो जाने, दोनों में से किसी भाव की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: परन्तु नगर में रहनेवाले यूनानी
  rationale: κατὰ τὴν πόλιν उन्हें नगर के भीतर स्थित बताता है; δέ का हल्का विरोध ‘परन्तु’ से व्यक्त है।
- source_word: οὐδὲν ἠδικημένοι
  choice: जिनके साथ कोई अन्याय नहीं हुआ था
  rationale: ἀδικέω के पूर्ण निष्क्रिय कृदन्त का भाव सुरक्षित रखते हुए यह स्पष्ट करता है कि वे स्वयं दुर्व्यवहार के शिकार नहीं हुए थे।
- source_word: ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας
  choice: उन पुरुषों के विषय में मची अप्रत्याशित हलचल
  rationale: ταραχή को नागरिक अशांति के संदर्भ में ‘हलचल’ और περί को व्यापक संबंध-सूचक ‘के विषय में’ के रूप में रखा गया है।
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: हो रहे अव्यवस्थित जमावड़ों
  rationale: συνδρομή लोगों के एकत्र होने को और दुर्लभ ἀπρόκοπος उनके बेतरतीब अथवा निष्फल ढंग को सूचित करता है; ‘अव्यवस्थित जमावड़े’ दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: उनकी सहायता करने की सामर्थ्य नहीं पाई
  rationale: ἔσθενον में केवल सामान्य असमर्थता नहीं, बल्कि बल या सामर्थ्य की कमी का भाव है।
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: क्योंकि उनकी मनोवृत्ति उन्हें विनती करने के लिए प्रेरित कर रही थी
  rationale: पाठ वाक्य-विन्यास की दृष्टि से संक्षिप्त और कठिन है। διάθεσις को ‘मनोवृत्ति’ तथा παράκλησις को यहाँ प्रत्यक्ष हस्तक्षेप के बदले ‘विनती’ के रूप में रखा गया है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: कुछ लोग स्वयं भी हलचल में पड़ गए थे
  rationale: दुर्लभ συνδρόμως आंतरिक व्याकुलता या सामूहिक हलचल में बह जाने, दोनों का संकेत दे सकता है; मुख्य पाठ का वाक्यांश जानबूझकर कुछ व्यापक रखा गया है।
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: समझते थे कि ये परिस्थितियाँ बदल जाएँगी
  rationale: μεταπίπτω का मूल भाव स्थिति के बदलने या दूसरा मोड़ लेने का है; परिवर्तन की दिशा निर्दिष्ट नहीं की गई है।
