  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। लंबे यूनानी वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘सामर्थ्य’, ‘मनोवृत्ति’, ‘विनती’ और ‘हलचल’ स्रोत के अर्थ-सूक्ष्म भेदों को यथासंभव बनाए रखते हैं; कठिन और दुर्लभ पदों की वास्तविक अस्पष्टता पाद-टिप्पणियों में दी गई है।
