  text: परन्तु यहूदी राजाओं के प्रति अटल सद्भावना और निष्ठा बनाए हुए थे;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: परन्तु यहूदी
  rationale: δέ पिछले प्रसंग से विरोध दर्शाता है, इसलिए ‘परन्तु’ उपयुक्त है; Ἰουδαῖοι का सीधा अनुवाद ‘यहूदी’ है।
- source_word: εὔνοιαν
  choice: सद्भावना
  rationale: यह शब्द किसी के प्रति भली भावना या हितैषी मनोभाव दर्शाता है; ‘सद्भावना’ आधुनिक हिन्दी में इस सम्बन्धपरक अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: πίστιν
  choice: निष्ठा
  rationale: राजाओं के प्रति प्रयुक्त होने के कारण यहाँ धार्मिक ‘विश्वास’ नहीं, बल्कि वफ़ादारी और विश्वसनीय निष्ठा अभिप्रेत है।
- source_word: ἀδιάστροφον
  choice: अटल
  rationale: शब्द का भाव ऐसी अवस्था का है जो मुड़ी, बदली या विचलित न हुई हो; ‘अटल’ सद्भावना और निष्ठा दोनों की स्थिरता व्यक्त करता है।
- source_word: φυλάσσοντες
  choice: बनाए हुए थे
  rationale: φυλάσσω का मूल अर्थ रखना या सुरक्षित रखना है; अमूर्त गुणों के साथ ‘बनाए हुए थे’ सहज हिन्दी में उनकी निरन्तर रक्षा और निर्वाह का भाव देता है।
- source_word: πρὸς τοὺς βασιλεῖς
  choice: राजाओं के प्रति
  rationale: πρός के साथ कर्मकारक यहाँ व्यक्तियों के प्रति सम्बन्ध दर्शाता है। βασιλεῖς बहुवचन है, इसलिए ‘राजाओं’ रखा गया है।
theological_decisions:
- issue: गैर-धार्मिक, राजनीतिक प्रसंग में πίστις का अनुवाद
  choice: निष्ठा
  alternative: विश्वास / विश्वसनीयता / वफ़ादारी
  rationale: क्योंकि πίστις का सम्बन्ध यहाँ राजाओं से है, इसका अर्थ धार्मिक विश्वास नहीं बल्कि उनके प्रति स्थिर वफ़ादारी है। ‘निष्ठा’ इस अर्थ को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। यूनानी वाक्य की विरोधसूचक शुरुआत, राजाओं का बहुवचन और सद्भावना तथा निष्ठा की साझा अटलता सुरक्षित रखी गई है। अर्धविराम स्रोत अंश की अपूर्ण वाक्यगत निरन्तरता को दर्शाता है।
