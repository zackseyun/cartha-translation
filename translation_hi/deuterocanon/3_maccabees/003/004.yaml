translation:
  language: hi
  text: परन्तु वे परमेश्वर का आदर करते थे और अपनी व्यवस्था के अनुसार जीवन बिताते थे; इसलिए वे भोजन के मामलों में अलगाव रखते थे। इसी कारण कुछ लोग उन्हें घृणा के पात्र समझते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι
  choice: आराधना करते
  rationale: यहाँ क्रिया परमेश्वर के प्रति श्रद्धा और उपासना का भाव व्यक्त करती है; सहज आधुनिक हिन्दी में ‘आराधना करते’ प्रसंगानुकूल है।
- source_word: τῷ τούτων νόμῳ πολιτευόμενοι
  choice: उनकी व्यवस्था के अनुसार जीवन बिताते थे
  rationale: πολιτεύομαι यहाँ जीवन-व्यवहार संचालित करने का अर्थ देता है। τούτων का व्याकरणिक संकेत बहुवचन है और निकटवर्ती समूह की व्यवस्था की ओर जा सकता है, पर उपलब्ध पाठ-परंपरा और प्रसंगानुसार इसे परमेश्वर से संबद्ध ‘उनकी व्यवस्था’ के रूप में रखा गया है।
- source_word: χωρισμὸν ἐποίουν
  choice: अपने को अलग रखते थे
  rationale: शाब्दिक ‘अलगाव करते थे’ की अपेक्षा यह स्वाभाविक हिन्दी है और भोजन-संबंधी सामाजिक पृथकता का भाव सुरक्षित रखती है।
- source_word: ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: खान-पान के विषय में
  rationale: τροφάς भोजन-पदार्थों या आहार को सूचित करता है; ‘खान-पान’ साधारण पाठक के लिए व्यापक और सहज है।
- source_word: ἀπεχθεῖς
  choice: घृणित
  rationale: यह शब्द दूसरों की दृष्टि में घृणा या वैर का पात्र होने का प्रबल भाव रखता है; ‘घृणित समझते थे’ उस मूल्यांकन को स्पष्ट करता है।
theological_decisions:
- issue: व्यवस्था का संबंध
  choice: उनकी व्यवस्था
  alternative: उन लोगों की व्यवस्था / अपनी व्यवस्था
  rationale: ग्रीक τῷ τούτων νόμῳ में τούτων बहुवचन है, जिससे ‘इन लोगों की व्यवस्था’ संभव है; फिर भी प्राप्त संपादकीय परत ‘his law’ को निर्णीत करती है। हिन्दी में आदरसूचक ‘उनकी’ परमेश्वर से संबंध बनाए रखता है, यद्यपि मूल की व्याकरणिक अस्पष्टता पूर्णतः व्यक्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। लंबे ग्रीक वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘परन्तु’ से δέ का विरोधात्मक/संक्रमणकारी संबंध रखा गया है।
