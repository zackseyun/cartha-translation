base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: hi
  text: और इन मामलों में, उनके सहजातीयों के प्रति अपना द्वेष न रखना सबको जता देने के बाद[a], तथा उस मैत्री-संधि और उन असंख्य कार्यों के कारण जो आरम्भ से ही सच्चे मन से उन्हें सौंपे गए थे, हमने उनकी स्थिति बदलने, उन्हें सिकन्दरिया की नागरिकता के योग्य मानने, और पवित्रस्थान से सम्बन्धित बातों में सहभागी ठहराने[b] का निश्चय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सहजातीयों के प्रति हमारी क्षमाशीलता” या “हमारा बैर न रखना।” यूनानी शब्द का अर्थ किसी के किए हुए बुरे व्यवहार को पकड़कर न रखना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पवित्रस्थान के लिए/की ओर की बातों में।” इसका आशय पवित्रस्थान से जुड़े अधिकारों, दायित्वों या पवित्र विषयों से व्यापक रूप में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: हम उनके प्रति कोई वैर नहीं रखते
  rationale: यह संज्ञा किसी की बुराई को स्मरण रखकर द्वेष या बैर न पालने का भाव व्यक्त करती है। हिन्दी में यह वाक्यांश उस अर्थ को स्वाभाविक ढंग से पहुँचाता है।
- source_word: ὁμοφύλους
  choice: उनके सभी सजातीय लोगों
  rationale: शब्द समान जातीय या सामुदायिक मूल के लोगों को दर्शाता है। ‘सजातीय लोगों’ से यह अर्थ बना रहता है और आधुनिक ‘देशवासियों’ से जुड़ी अनावश्यक राष्ट्र-राज्य की धारणा नहीं आती।
- source_word: συμμαχίαν
  choice: मैत्री-संधि
  rationale: राजकीय-राजनीतिक प्रसंग में यह औपचारिक गठबन्धन या संधि को सूचित करता है; ‘मैत्री-संधि’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: वे असंख्य कार्य जो ... उन्हें सौंपे गए थे
  rationale: कृदन्त विश्वासपूर्वक सौंपे गए दायित्वों या मामलों को और πράγματα अनेक कार्यों/मामलों को दर्शाता है।
- source_word: μετὰ ἁπλότητος
  choice: सच्चे मन से
  rationale: यहाँ ἁπλότης निष्कपटता, सीधेपन या सद्भाव को सूचित करता है; ‘सच्चे मन से’ सहज और नैतिक भावयुक्त हिन्दी है।
- source_word: ἐξαλλοιῶσαι
  choice: उनकी स्थिति बदलने
  rationale: क्रिया पूरी तरह बदलने का भाव रखती है, जबकि आगे के पद परिवर्तन का नागरिक स्वरूप स्पष्ट करते हैं। ‘स्थिति बदलने’ से अनावश्यक रूप से जातीय आत्मसातीकरण निर्धारित नहीं होता।
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: सिकन्दरिया की नागरिकता
  rationale: πολιτεία यहाँ नागरिक हैसियत या नागरिकता है; हिन्दी में नगर के नाम के साथ यह स्वाभाविक अभिव्यक्ति है।
- source_word: καταξιῶσαι
  choice: योग्य मानने
  rationale: क्रिया केवल प्रदान करने के बजाय योग्य ठहराने या मानने का मूल्यांकनात्मक भाव रखती है।
- source_word: μετόχους
  choice: सहभागी
  rationale: यह किसी वस्तु, अधिकार या कार्य में हिस्सा रखने वाले व्यक्ति को दर्शाता है; ‘सहभागी’ स्पष्ट और गरिमापूर्ण है।
- source_word: τῶν εἰς ἱερὸν
  choice: पवित्रस्थान से सम्बन्धित बातों
  rationale: यूनानी पद संक्षिप्त और व्यापक है। यह पवित्रस्थान के अधिकारों, दायित्वों या अन्य पवित्र विषयों की ओर संकेत कर सकता है; अनुवाद इस व्यापकता को बनाए रखता है।
- source_word: καταστῆσαι
  choice: ठहराने
  rationale: यह किसी को नई भूमिका या स्थिति में स्थापित करने का अर्थ देता है; ‘ठहराने’ उस प्रशासनिक निर्णय को व्यक्त करता है।
theological_decisions:
- issue: यहूदियों को प्रस्तावित नागरिक और पवित्रस्थान-सम्बन्धी सहभागिता का सटीक विस्तार
  choice: नागरिकता और पवित्रस्थान से सम्बन्धित बातों में सहभागिता को व्यापक और अनिर्धारित रखा गया है।
  alternative: इसे पूर्ण जातीय-राजनीतिक आत्मसातीकरण या केवल मन्दिर-सेवा के विशिष्ट अधिकारों के रूप में सीमित करना।
  rationale: यूनानी पाठ सिकन्दरिया की नागरिकता और ‘पवित्रस्थान से सम्बन्धित बातों’ में सहभागिता कहता है, पर उनके ठीक कानूनी या धार्मिक विस्तार को परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में राजकीय घोषणा का गरिमापूर्ण किंतु सुबोध स्वर रखा गया है। ‘सिकन्दरिया’ प्रचलित हिन्दी नगरनाम है। यूनानी वाक्य की दीर्घ संरचना को बनाए रखते हुए सम्बन्धों को स्पष्ट किया गया है; अस्पष्ट पवित्रस्थान-सम्बन्धी पद को संकीर्ण अर्थ नहीं दिया गया।
