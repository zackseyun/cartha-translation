  text: परन्तु जो लोग इसके विपरीत की अपेक्षा रखते थे और अपनी जन्मजात दुर्भावना में भलाई को ठुकराकर निरन्तर नीचता की ओर मुड़ते रहते थे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούναντίον
  choice: इसके विपरीत होने
  rationale: ἐκδεχόμενοι के कर्म के रूप में यह पहले कही गई अच्छी बात के उलटे परिणाम की अपेक्षा व्यक्त करता है; हिन्दी में यह स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: ἐκδεχόμενοι
  choice: बाट जोह रहे थे
  rationale: यह केवल मानसिक अनुमान नहीं, बल्कि किसी परिणाम की प्रतीक्षा या अपेक्षा भी व्यक्त कर सकता है; ‘बाट जोहना’ दोनों भावों को जीवंत हिन्दी में रखता है।
- source_word: συμφύτῳ
  choice: जन्मजात
  rationale: शाब्दिक भाव ‘साथ-साथ उगा हुआ’ है, जिससे स्वभाव में आरम्भ से बसी हुई प्रवृत्ति का अर्थ निकलता है।
- source_word: κακοηθείᾳ
  choice: दुर्भाव
  rationale: यह बुरे चरित्र या दुर्भावनापूर्ण मनोवृत्ति को दर्शाता है; ‘दुर्भाव’ सामान्य पाठक के लिए स्पष्ट है और ‘दुष्टता’ की अपेक्षा मनोवृत्ति पर अधिक केंद्रित है।
- source_word: τὸ καλόν
  choice: भलाई
  rationale: नपुंसकलिंग संज्ञीकृत विशेषण नैतिक रूप से अच्छी या उत्तम वस्तु को दर्शाता है; ‘भलाई’ सहज हिन्दी में इस व्यापक नैतिक अर्थ को बनाए रखती है।
- source_word: ἀπωσάμενοι
  choice: ठुकराकर
  rationale: क्रिया बलपूर्वक दूर धकेलने या अस्वीकार करने का भाव रखती है; ‘ठुकराना’ हिन्दी में सक्रिय और जानबूझकर किए गए अस्वीकार को व्यक्त करता है।
- source_word: διηνεκῶς
  choice: निरन्तर
  rationale: यह लगातार और आदतन जारी क्रिया को व्यक्त करता है।
- source_word: φαῦλον
  choice: नीचता
  rationale: शब्द नैतिक रूप से घटिया, निकृष्ट या बुरी वस्तु का बोध करा सकता है; ‘नीचता’ इसके नैतिक और गुणात्मक दोनों पक्षों को रखती है।
- source_word: ἐκνεύοντες
  choice: की ओर मुड़ते जा रहे थे
  rationale: यह किसी दिशा से हटकर दूसरी ओर झुकने या मुड़ने की गतिशील छवि देता है; प्रगतिशील रूप निरन्तर नैतिक विचलन को स्वाभाविक हिन्दी में व्यक्त करता है।
