revisions:
- from: परन्तु जो लोग इसके विपरीत होने की बाट जोह रहे थे और अपने जन्मजात दुर्भाव से भलाई को ठुकराकर निरन्तर नीचता की ओर मुड़ते जा रहे थे,
  to: परन्तु जो लोग इसके विपरीत की अपेक्षा रखते थे और अपनी जन्मजात दुर्भावना में भलाई को ठुकराकर निरन्तर नीचता की ओर मुड़ते रहते थे,
  rationale: The revision preserves the source’s incomplete, participial syntax and final comma while making the object of expectation explicit and idiomatic. “अपनी जन्मजात दुर्भावना में” represents the disposition denoted by the Greek dative without adding a causal or doctrinal claim.
