  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: hi
  text: वे पुराने समय से चले आ रहे दंभ में बहकर[a] हमें प्रवेश करने से रोक दिया। वे हमारी उस सामर्थ्य से पीछे थे, जिसके द्वारा हम सभी लोगों के प्रति सद्भाव रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पुराने समय से चले आ रहे घमंड से प्रेरित होकर’ अथवा ‘लंबे समय से चले आ रहे दंभ में बहकर।’ यूनानी पदबंध में पुराने समय से जमे हुए अहंकार के अलग-अलग भाव संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  choice: पुराने समय से चले आ रहे घमंड में बहकर
  rationale: यह यूनानी पदबंध पुराने अथवा लंबे समय से जमे अहंकारी भावों से प्रेरित होकर चलने का अर्थ देता है। ‘बहकर’ φερόμενοι की निष्क्रिय और आवेगपूर्ण छाया बनाए रखता है।
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  choice: हमें भीतर आने से रोक बैठे
  rationale: εἴργω के साथ संबंधकारक प्रवेश से वंचित करने या रोकने को व्यक्त करता है; यह हिंदी में सहज और प्रसंगानुकूल है।
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: वे हमारी उस सामर्थ्य से बहुत पीछे थे
  rationale: λειπόμενοι तुलना में कमी या पीछे रह जाने को बताता है। ἀλκή के लिए ‘सामर्थ्य’ शक्ति और क्षमता दोनों को व्यक्त करता है, बिना अनावश्यक रूप से सैनिक अर्थ थोपे।
- source_word: διʼ ἣν
  choice: जिसके कारण
  rationale: संबंधवाचक पद ἀλκή को आगे आने वाली मानवहितैषी प्रवृत्ति का आधार अथवा कारण बताता है; यूनानी में साधन और कारण दोनों की छाया संभव है।
- source_word: πρὸς ἅπαντας ἀνθρώπους φιλανθρωπίαν
  choice: सभी मनुष्यों के प्रति सद्भाव
  rationale: φιλανθρωπία मानवों के प्रति कृपालु, हितैषी भाव को दर्शाता है। ‘सद्भाव’ आधुनिक हिंदी में स्वाभाविक है और ἀνθρώπους का सार्वभौमिक आशय स्पष्ट रखता है।
theological_decisions:
- issue: ἅπαντας ἀνθρώπους का सर्वसमावेशी अर्थ
  choice: सभी मनुष्यों
  alternative: सब लोगों
  rationale: यहाँ ἀνθρώπους पुरुष-विशेष नहीं, समस्त मानव समुदाय के लिए है। ‘सभी मनुष्यों’ स्रोत की संज्ञा और सार्वभौमिकता दोनों को स्पष्ट रखता है।
- issue: διʼ ἣν में कारण और साधन की संभावित छाया
  choice: जिसके कारण
  alternative: जिसके द्वारा
  rationale: संदर्भ में वक्ता अपनी सामर्थ्य को सबके प्रति सद्भाव का आधार बताता है। ‘जिसके कारण’ हिंदी में अधिक स्वाभाविक है, यद्यपि साधनात्मक अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय वक्ता के आत्मप्रशंसात्मक स्वर को बिना समर्थन या आलोचनात्मक व्याख्या जोड़े सुरक्षित रखा गया है।
