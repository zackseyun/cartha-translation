base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: hi
  text: 'अतः वह अपनी वर्तमान सफलता से फूल उठा था और महानतम परमेश्वर[a] की सामर्थ्य को नहीं पहचान रहा था। वह यह मान बैठा था कि वह सदा उसी संकल्प पर अटल रहेगा; उसने उनके विरुद्ध यह पत्र लिखा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान परमेश्वर।” यूनानी में शाब्दिक अर्थ “महानतम परमेश्वर” है।
    reason: मूल यूनानी के प्रत्यक्ष अतिशयोक्तिपरक अर्थ और हिन्दी में प्रचलित बाइबलीय उपाधि—दोनों की जानकारी देने के लिए।
lexical_decisions:
- source_word: εὐημερίᾳ
  choice: वर्तमान सफलता
  rationale: यह शब्द परिस्थितियों के अनुकूल होने और फलने-फूलने की दशा बताता है। प्रसंग में राजनीतिक और परिस्थितिजन्य कामयाबी के लिए ‘वर्तमान सफलता’ स्वाभाविक और सटीक है।
- source_word: γεγαυρωμένος
  choice: फूल उठा था
  rationale: कृदंत घमंड से फूल जाने का रूपक व्यक्त करता है; यह केवल ‘अभिमानी’ कहने की अपेक्षा यूनानी की चित्रात्मकता को अधिक सुरक्षित रखता है।
- source_word: οὐ καθορῶν
  choice: नहीं पहचान रहा था
  rationale: क्रिया केवल देखने नहीं, वास्तविकता को समझने या पहचानने में विफल रहने का भाव भी रखती है।
- source_word: κράτος
  choice: सामर्थ्य
  rationale: परमेश्वर के संदर्भ में यह प्रभावशाली शक्ति या प्रभुत्वकारी बल को दर्शाता है; ‘सामर्थ्य’ हिन्दी में गरिमापूर्ण और सहज है।
- source_word: τοῦ μεγίστου θεοῦ
  choice: महानतम परमेश्वर
  rationale: μέγιστος का प्रत्यक्ष अतिशयोक्तिपरक अर्थ ‘महानतम’ है। इसे अधिक परिचित उपाधि ‘परमप्रधान’ में बदलने के बजाय मूल की विशिष्ट अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ὑπολαμβάνων
  choice: यह मान बैठा था
  rationale: यह उसके गलत और आत्मविश्वासपूर्ण अनुमान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διηνεκῶς
  choice: सदा
  rationale: यहाँ आशय उसके संकल्प के निरंतर बने रहने की कल्पना से है, न कि दार्शनिक अनंतता से; ‘सदा’ उस भाव को संक्षेप में व्यक्त करता है।
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: उसी संकल्प पर अटल रहेगा
  rationale: वाक्यांश एक ही इरादे या नीति पर टिके रहने को दर्शाता है। ‘संकल्प पर अटल रहना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔγραφεν
  choice: उसने … लिखा
  rationale: अपूर्ण भूतकाल यहाँ आगे आने वाले पत्र का परिचय देता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: κατʼ αὐτῶν
  choice: उनके विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में κατά का अर्थ केवल ‘उनके विषय में’ नहीं, बल्कि उनके विरोध में है।
- source_word: ἐπιστολὴν τήνδε
  choice: यह पत्र
  rationale: संकेतवाचक शब्द आगे उद्धृत होने वाले पत्र की ओर इंगित करता है; ‘यह पत्र’ सीधा और विश्वसनीय अनुवाद है।
theological_decisions:
- issue: τοῦ μεγίστου θεοῦ का अनुवाद
  choice: महानतम परमेश्वर
  alternative: परमप्रधान परमेश्वर; सर्वोच्च परमेश्वर
  rationale: यूनानी μέγιστος शाब्दिक रूप से ‘महानतम’ है। परिचित बाइबलीय उपाधि ‘परमप्रधान’ अपनाने से मूल की अलग अभिव्यक्ति के साथ अनावश्यक सामंजस्य हो जाता; इसलिए प्रत्यक्ष अर्थ मुख्य पाठ में रखा गया है और प्रचलित विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘फूल उठा था’ मूल के घमंड से फूलने वाले रूपक को बनाए रखता है, जबकि ‘संकल्प पर अटल रहेगा’ जटिल यूनानी पदबंध को सामान्य पाठक के लिए स्पष्ट करता है।
