  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: hi
  text: इसलिए, इन प्रमाणों से भली-भाँति आश्वस्त होकर कि ये लोग हर प्रकार से हमारे प्रति दुर्भावना रखते हैं, और इस बात का पूर्वविचार करते हुए कि कहीं बाद में अचानक कोई उपद्रव उठ खड़ा हो और हमारे पीछे ये अधर्मी लोग विश्वासघाती और बर्बर शत्रु न हों,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बर्बर शत्रु’ का अनुवाद ‘जंगली शत्रु’ भी किया जा सकता है। यहाँ यूनानी विशेषण वक्ता की अपमानजनक भाषा है; यह आवश्यक नहीं कि किसी निश्चित जातीय समुदाय का सटीक नाम हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निकले निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τεκμηρίοις
  choice: इन प्रमाणों से
  rationale: करणवाचक बहुवचन का अर्थ ठोस प्रमाणों के साधन से आश्वस्त होना है; संदर्भगत संकेत के लिए ‘इन’ जोड़ा गया है।
- source_word: καλῶς πεπεισμένοι
  choice: भली-भाँति आश्वस्त होकर
  rationale: पूर्ण कृदंत से व्यक्त दृढ़ और स्थापित विश्वास तथा καλῶς की तीव्रता दोनों सुरक्षित रहते हैं।
- source_word: τούτους
  choice: ये लोग
  rationale: संकेतवाचक पद लक्षित समुदाय को बताता है, पर यूनानी से अधिक विशिष्ट पहचान नहीं जोड़ता।
- source_word: κατὰ πάντα
  choice: हर प्रकार से
  rationale: आरोप की सर्वांगीण व्यापकता को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: δυσνοεῖν ἡμῖν
  choice: हमारे प्रति दुर्भावना रखते हैं
  rationale: दत्तिव के साथ क्रिया का अर्थ शत्रुतापूर्ण मनोभाव रखना है; यह हिन्दी में स्वाभाविक और पर्याप्त औपचारिक है।
- source_word: προνοούμενοι
  choice: यह सोचकर
  rationale: आगे की संभावित परिस्थिति पर पहले से विचार करने का भाव रखता है, बिना किसी विशिष्ट निवारक कार्रवाई को पाठ में जोड़ने के।
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: कि कहीं बाद में अचानक कोई उपद्रव खड़ा हो जाए
  rationale: भविष्य की आशंकित, आकस्मिक अव्यवस्था का भाव सुरक्षित है; ‘उपद्रव’ ταραχή को विद्रोह जैसे अधिक संकीर्ण अर्थ तक सीमित नहीं करता।
- source_word: δυσσεβεῖς
  choice: अधर्मी
  rationale: वक्ता द्वारा लगाए गए धार्मिक-नैतिक आरोप की तीव्रता को बनाए रखता है।
- source_word: κατὰ νώτου
  choice: हमारी पीठ पीछे
  rationale: पीछे से उत्पन्न खतरे की सजीव सैन्य-राजनीतिक छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: προδότας
  choice: विश्वासघाती
  rationale: आंतरिक द्रोह और धोखे का राजनीतिक-सैन्य भाव स्पष्ट करता है।
- source_word: βαρβάρους πολεμίους
  choice: बर्बर शत्रु
  rationale: वक्ता की अपमानजनक और शत्रुतापूर्ण भाषा को बनाए रखता है; यहाँ यह आवश्यक रूप से सटीक जातीय पहचान नहीं है।
theological_decisions:
- issue: राजकीय आरोप में प्रयुक्त तीखे विवादात्मक विशेषण
  choice: ‘अधर्मी’, ‘विश्वासघाती’ और ‘बर्बर शत्रु’ को वक्ता के आरोप के रूप में यथावत तीखा रखा गया है।
  alternative: इन्हें ‘अवफादार’ या ‘विरोधी’ जैसे नरम नागरिक शब्दों से व्यक्त करना।
  rationale: पाठ वक्ता की शत्रुतापूर्ण धारणा और प्रचारात्मक भाषा दर्ज करता है। अनुवाद इन आरोपों का समर्थन नहीं करता, पर उन्हें नरम करने से मूल की वैचारिक और अलंकारिक तीव्रता घट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। वाक्य मूल यूनानी की अधूरी, अगले पद में जारी रहने वाली संरचना को अंतिम अल्पविराम से बनाए रखता है।
