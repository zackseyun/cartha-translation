  register: भाषा औपचारिक राजकीय पत्र के अनुरूप, किंतु आधुनिक पाठक के लिए सहज रखी गई है। ‘प्रशासनिक मामलों’ और ‘अधिकारियों’ से प्राचीन पदबंध का कार्य स्पष्ट होता है; पादटिप्पणियाँ स्थानवाचक बारीकी और पत्राचार-सूत्र का शाब्दिक रूप सुरक्षित रखती हैं।
