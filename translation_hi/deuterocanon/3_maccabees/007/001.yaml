  yaml_path: translation/deuterocanon/3_maccabees/007/001.yaml
  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: hi
  text: राजा टॉलेमी फिलोपाटोर की ओर से मिस्र में सेनापतियों और मामलों के प्रभारी नियुक्त सभी लोगों को नमस्कार और स्वस्थ रहने की शुभकामनाएँ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र भर के सेनापतियों”; κατʼ Αἴγυπτον में वितरण का यह भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “नमस्कार और स्वस्थ रहें”; यह यूनानी पत्रों में अभिवादन और कुशलता की कामना का प्रचलित सूत्र था।
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: राजा
  rationale: यह संज्ञा राजकीय पदवी के रूप में पत्र के प्रेषक का परिचय देती है; हिन्दी में ‘राजा’ स्वाभाविक और सटीक है।
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: टॉलेमी फिलोपाटोर
  rationale: व्यक्तिगत नाम और उपाधि का अनुवाद करने के बजाय उनका ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: मिस्र में नियुक्त सेनापतियों
  rationale: στρατηγοῖς का सैन्य-प्रशासनिक अर्थ ‘सेनापति’ है। κατʼ Αἴγυπτον मिस्र में अथवा मिस्र भर में उनकी स्थिति सूचित करता है; मुख्य पाठ में सहज ‘मिस्र में’ रखा गया है। ‘नियुक्त’ हिन्दी में संबोधन के प्रशासनिक संदर्भ को स्पष्ट करता है, यद्यपि यूनानी में इस पदबंध के साथ यह शब्द प्रत्यक्षतः नहीं है।
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: प्रशासनिक मामलों के प्रभारी सभी अधिकारियों
  rationale: τεταγμένοις नियुक्त या नियत व्यक्तियों को और ἐπὶ πραγμάτων मामलों पर उत्तरदायित्व को व्यक्त करता है। ‘अधिकारियों’ संदर्भगत रूप से निहित प्रशासनिक पद को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारंभ में यह पारंपरिक अभिवादन है; शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘नमस्कार’ इसका प्रकार्य स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐρρῶσθαι
  choice: स्वस्थ रहने की शुभकामनाएँ
  rationale: यह पत्राचार में स्वास्थ्य और कुशलता की कामना करने वाला रूढ़ प्रयोग है; चयन उसके आशय को स्पष्ट और स्वाभाविक हिन्दी में देता है।
