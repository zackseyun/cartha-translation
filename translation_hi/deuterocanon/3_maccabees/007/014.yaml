  rationale: ἀναιρέω यहाँ प्राण लेने या मिटा देने का अर्थ रखता है। यह पहले आए ‘मार डालते थे’ की अनावश्यक शब्दशः पुनरावृत्ति से बचते हुए दूसरे यूनानी क्रियापद को बनाए रखता है।
