  text: वे स्वयं भी अपवित्र ठहराए गए लोगों में से अपने ही किसी सजातीय को रास्ते में मिल जाने पर मार डालते थे और उसे सार्वजनिक रूप से उदाहरण बनाकर उसका अंत कर देते थे।[a]
  philosophy: optimal-equivalence
