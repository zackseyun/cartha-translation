    text: या, ‘उदाहरणात्मक दंड देते हुए’ अथवा ‘उसे सार्वजनिक चेतावनी का उदाहरण बनाते हुए।’ यूनानी पद हत्या के ढंग में सार्वजनिक अपमान या दूसरों को चेतावनी देने के लिए उदाहरण बनाने—दोनों पर बल दे सकता है।
