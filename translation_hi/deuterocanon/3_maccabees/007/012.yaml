base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: hi
  text: और जब उसने मान लिया कि वे सच कह रहे हैं और उन्हें प्रोत्साहित किया, तब उसने उन्हें पूरी छूट दे दी कि वे उसके राज्य के अधीन हर स्थान में परमेश्वर की व्यवस्था का उल्लंघन कर चुके लोगों का निर्भीकता से[a] सर्वनाश कर दें—बिना किसी राजकीय अधिकार या निरीक्षण के।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खुलेआम” अथवा “निडर होकर”; यूनानी μετὰ παρρησίας में साहस के साथ-साथ खुलेपन और स्वतंत्रतापूर्वक कार्य करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अनुवाद “बिना किसी राजकीय प्राधिकरण या जाँच के” भी हो सकता है। इससे कार्रवाई में सीधे राजकीय हस्तक्षेप या निगरानी की अनुपस्थिति पर बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τἀληθὲς ... λέγειν
  choice: सच कह रहे हैं
  rationale: लेखयुक्त नपुंसकलिंग विशेषण τἀληθές, λέγειν के साथ, उनकी बात को सत्य मानने का अर्थ देता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: παραδεξάμενος
  choice: मान लिया
  rationale: यह कृदन्त उनकी बात को सत्य और स्वीकार्य मान लेने को व्यक्त करता है; केवल सुन लेने का भाव पर्याप्त नहीं होगा।
- source_word: παραινέσας
  choice: उन्हें प्रोत्साहित किया
  rationale: क्रिया में समझाने, उत्साहित करने या आगे बढ़ने को प्रेरित करने का भाव हो सकता है। प्रसंग में ‘प्रोत्साहित किया’ सक्रिय समर्थन को व्यक्त करता है, पर अनावश्यक रूप से अधिक तीखा नहीं है।
- source_word: ἄδειαν πάντων
  choice: पूरी छूट
  rationale: ἄδεια अनुमति अथवा कार्य करने की स्वतंत्रता है और πάντων उसके व्यापक दायरे पर बल देता है। ‘पूरी छूट’ सहज हिन्दी में दोनों भाव समेटती है।
- source_word: τοὺς παραβεβηκότας
  choice: उल्लंघन कर चुके लोगों
  rationale: परिपूर्ण कृदन्त पहले हो चुके उल्लंघन और उससे बनी वर्तमान स्थिति को दर्शाता है।
- source_word: τοῦ θεοῦ τὸν νόμον
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος के लिए बाइबलीय हिन्दी में ‘व्यवस्था’ स्वाभाविक है और यहाँ परमेश्वर द्वारा दी गई विधि का औपचारिक भाव बनाए रखती है।
- source_word: ἐξολεθρεύσωσιν
  choice: सर्वनाश कर दें
  rationale: यह प्रबल क्रिया पूरी तरह नष्ट कर देने का अर्थ रखती है। ‘सर्वनाश’ हिंसा की तीव्रता को बिना नरम किए व्यक्त करता है।
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: उसके राज्य के अधीन हर स्थान में
  rationale: यह वाक्यांश पूरे राज्य में स्थान-स्थान पर लागू दायरे को व्यक्त करता है और यूनानी की संरचना के निकट रहते हुए स्पष्ट हिन्दी देता है।
- source_word: μετὰ παρρησίας
  choice: निर्भीकता से
  rationale: παρρησία में साहस, खुलापन और स्वतंत्रतापूर्वक कार्य करने का भाव हो सकता है। ‘निर्भीकता से’ मुख्य अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: बिना किसी राजकीय अधिकार या निरीक्षण के
  rationale: शब्दशः संरचना राजकीय ἐξουσία और ἐπίσκεψις की अनुपस्थिति बताती है। ‘अधिकार’ और ‘निरीक्षण’ मूल की असामान्य तथा संभावित रूप से तनावपूर्ण अभिव्यक्ति को व्याख्यात्मक रूप से सुलझाए बिना बनाए रखते हैं।
theological_decisions:
- issue: व्यवस्था का उल्लंघन करने वालों के विरुद्ध हिंसा का नैतिक और धर्मवैज्ञानिक चित्रण
  choice: मूल के अनुसार साफ कहा गया है कि उन्हें ऐसे लोगों का ‘सर्वनाश’ करने की छूट दी गई।
  alternative: इसे नरम करके ‘दंड दें’ या ‘हटा दें’ कहना।
  rationale: ἐξολεθρεύσωσιν अत्यंत प्रबल विनाशसूचक क्रिया है। अनुवाद को हिंसा कम करके नहीं दिखानी चाहिए और न ही पद में अनुपस्थित नैतिक समर्थन या निंदा जोड़नी चाहिए।
- issue: राजा की अनुमति और अंतिम वाक्यांश में राजकीय अधिकार की अनुपस्थिति के बीच तनाव
  choice: ‘बिना किसी राजकीय अधिकार या निरीक्षण के’ रखकर मूल का तनाव सुरक्षित रखा गया है।
  alternative: इसे ‘राजा के अधिकारियों के हस्तक्षेप या निगरानी के बिना’ कहकर स्पष्ट करना।
  rationale: राजा द्वारा छूट दिए जाने के तुरंत बाद ἄνευ πάσης βασιλικῆς ἐξουσίας कहना अर्थगत तनाव पैदा करता है। यूनानी किसी एक व्याख्या को निर्विवाद रूप से निश्चित नहीं करता, इसलिए मुख्य पाठ में उसे चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘व्यवस्था’, ‘सर्वनाश’ और ‘राजकीय’ जैसे शब्द प्रसंग की औपचारिक गंभीरता बनाए रखते हैं। वाक्य को अत्यधिक संस्कृतनिष्ठ बनाने से बचाया गया है, और मूल में मौजूद हिंसा तथा अंतिम वाक्यांश की अस्पष्टता दोनों को सुरक्षित रखा गया है।
