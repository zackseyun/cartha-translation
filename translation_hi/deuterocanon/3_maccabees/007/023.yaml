  text: Blessed is the deliverer of Israel forever. Amen.
translation:
  language: hi
  text: इस्राएल का छुड़ानेवाला सदा-सर्वदा धन्य है। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητός
  choice: धन्य है
  rationale: ईश्वर के लिए प्रयुक्त स्तुतिपरक विशेषण का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ὁ ῥύστης
  choice: छुड़ानेवाला
  rationale: ῥύστης संकट या शत्रु से बचाने अथवा छुड़ानेवाले को दर्शाता है; यह रूप पद की सक्रिय उद्धारकारी धारणा को स्पष्ट रखता है।
- source_word: Ἰσραήλ
  choice: इस्राएल का
  rationale: यूनानी संबंध को सहज हिन्दी संबंधकारक रचना में व्यक्त किया गया है।
- source_word: εἰς τοὺς ἀεὶ χρόνους
  choice: सदा-सर्वदा
  rationale: शाब्दिक रूप से ‘सदा के कालों तक’; हिन्दी की स्तुतिपरक भाषा में ‘सदा-सर्वदा’ निरंतर और अनंत अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: धार्मिक समापन की परंपरागत, व्यापक रूप से समझी जानेवाली लिप्यंतरण-प्रथा।
theological_decisions:
- issue: छुड़ानेवाले की स्पष्ट पहचान
  choice: मूल की तरह कर्ता का नाम न जोड़कर ‘इस्राएल का छुड़ानेवाला’ रखा गया है।
  alternative: ‘परमेश्वर, इस्राएल का छुड़ानेवाला’
  rationale: यूनानी पाठ में परमेश्वर का नाम स्पष्ट रूप से नहीं है; संदर्भगत पहचान को पाठ में जोड़ना मूल की संक्षिप्तता से आगे जाता।
- issue: कालावधि का स्वरूप
  choice: सदा-सर्वदा
  alternative: सभी कालों तक
  rationale: यह यूनानी बहुवचन χρόνους की दीर्घकालिक अभिव्यक्ति का अर्थ सुरक्षित रखते हुए आधुनिक हिन्दी में स्तुति-वाक्य को सहज बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण स्तुतिपरक शैली। कोई पादटिप्पणी आवश्यक नहीं है।
