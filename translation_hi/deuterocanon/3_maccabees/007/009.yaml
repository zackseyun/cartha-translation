base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: hi
  text: 'क्योंकि यह जान लो: यदि हम इन लोगों के विरुद्ध कोई बुरी चाल चलें या उन्हें किसी भी प्रकार दुःख पहुँचाएँ, तो इन बातों का प्रतिशोध लेने के लिए हमारे विरोध में कोई मनुष्य नहीं, बल्कि परमप्रधान परमेश्वर खड़ा होगा, जो समस्त सामर्थ्य पर प्रभुता करता है; और हम उससे किसी भी रीति से, कभी भी बच नहीं सकेंगे। कुशल से रहो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε γὰρ
  choice: क्योंकि यह जान लो
  rationale: आदेशात्मक γινώσκετε और कारणसूचक γὰρ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: कोई बुरी चाल चलें
  rationale: κακοτεχνέω में किसी के विरुद्ध हानिकारक षड्यंत्र या दुष्ट योजना रचने का भाव है; यह केवल सामान्य ‘बुराई करने’ से अधिक विशिष्ट है।
- source_word: ἐπιλυπήσωμεν
  choice: दुःख पहुँचाएँ
  rationale: क्रिया का कारक भाव—शोक, पीड़ा या कष्ट देना—सरल और व्यापक हिन्दी में व्यक्त होता है।
- source_word: τὸ σύνολον
  choice: किसी भी प्रकार
  rationale: यहाँ क्रियाविशेषणात्मक प्रयोग पूर्णतः या किसी भी तरह का व्यापक निषेध दर्शाता है।
- source_word: τὸν πάσης δεσπόζοντα δυνάμεως θεὸν ὕψιστον
  choice: परमप्रधान परमेश्वर से होगा, जो समस्त सामर्थ्य पर प्रभुता करता है
  rationale: θεὸν ὕψιστον की उपाधि तथा πάσης...δυνάμεως पर सार्वभौम प्रभुता, दोनों सुरक्षित हैं।
- source_word: ἀντικείμενον ἡμῖν ἐπʼ ἐκδίκησιν τῶν πραγμάτων
  choice: इन बातों का बदला लेने के लिए हमारा सामना ... से होगा
  rationale: ἀντικείμενον का विरोध में खड़े होने का भाव और ἐκδίκησις का प्रतिशोध/न्यायपूर्ण बदला लेने का आशय स्पष्ट करता है।
- source_word: κατὰ πᾶν ἀφεύκτως διὰ παντὸς
  choice: किसी भी रीति से, कभी भी बच नहीं सकेंगे
  rationale: तीव्र, व्यापक और स्थायी अनिवार्यता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यूनानी की कुछ असहज शब्द-क्रम की नकल किए।
- source_word: ἐρρῶσθε
  choice: कुशल से रहो
  rationale: पत्र के समापन की परंपरागत शुभकामना है; प्रसंगानुकूल और dignified हिन्दी।
theological_decisions:
- issue: दैवी प्रतिशोध की प्रकृति
  choice: परमेश्वर ‘इन बातों का बदला लेने के लिए’ उनका सामना करेगा
  alternative: परमेश्वर उन्हें सामान्य रूप से दंड देगा
  rationale: ἐπʼ ἐκδίκησιν τῶν πραγμάτων को प्रत्यक्ष रखा गया है; पाठ में न्याय और प्रतिशोध के बीच जो तनाव है उसे किसी व्यवस्थित धार्मिक व्याख्या से नरम नहीं किया गया।
- issue: πάσης δυνάμεως का अर्थ
  choice: समस्त सामर्थ्य पर प्रभुता करता है
  alternative: सारी सेनाओं पर शासन करता है
  rationale: δύναμις का अर्थ शक्ति, सामर्थ्य या सेना हो सकता है। निकटवर्ती स्पष्ट सैन्य संकेत के अभाव में व्यापक ‘सामर्थ्य’ चुना गया, जिससे मूल की व्यापकता बनी रहती है।
- issue: अटल दैवी विरोध की अवधि
  choice: किसी भी रीति से, कभी भी बच नहीं सकेंगे
  alternative: सर्वथा और सदा के लिए उससे बचना असंभव होगा
  rationale: κατὰ πᾶν ἀφεύκτως διὰ παντός की प्रबलता सुरक्षित है, पर इसे अनिवार्य रूप से उत्तर-मृत्यु के शाश्वत दंड की तकनीकी शिक्षा के रूप में नहीं बांधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय चेतावनी के अनुरूप गंभीर और गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। लंबे यूनानी वाक्य को अर्थ-संबंध सुरक्षित रखते हुए हिन्दी की स्वाभाविक वाक्य-रचना में व्यवस्थित किया गया है।
