lexical_decisions:
- source_word: προφερόμενοι
  choice: यह कहते हुए
  rationale: कृदन्त यहाँ आगे आने वाले परोक्ष कथन का परिचय देता है। यह सरल और औपचारिक हिन्दी में सार्वजनिक रूप से कही गई बात को व्यक्त करता है।
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: जिन्होंने पेट की खातिर
  rationale: यूनानी का सजीव रूपक ‘पेट की खातिर’ सुरक्षित रखा गया है; संदर्भ में इसका आशय शारीरिक भूख, भोजन या स्वार्थपूर्ण लालसा के आगे झुकने से है।
- source_word: τὰ θεῖα ... προστάγματα
  choice: परमेश्वर की आज्ञाओं
  rationale: θεῖα का आशय यहाँ ईश्वरीय अधिकार वाली आज्ञाओं से है। एकेश्वरवादी यहूदी संदर्भ में ‘परमेश्वर की आज्ञाएँ’ स्वाभाविक और स्पष्ट है।
- source_word: παραβεβηκότας
  choice: उल्लंघन किया था
  rationale: पूर्ण कृदन्त पहले हो चुके और परिणामकारी अपराध को दर्शाता है; ‘उल्लंघन’ इसकी नैतिक और विधिक गंभीरता बनाए रखता है।
- source_word: μηδέποτε εὐνοήσειν
  choice: कभी निष्ठावान नहीं रहेंगे
  rationale: εὐνοέω अनुकूल मनोभाव, समर्थन या वफादारी व्यक्त कर सकता है। राजकीय आज्ञाओं के संदर्भ में ‘निष्ठावान रहना’ स्वाभाविक हिन्दी है और भविष्यकालिक infinitive का बल बनाए रखता है।
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: राजा की आज्ञाओं के प्रति भी
  rationale: दत्तिव रूप εὐνοήσειν से जुड़ता है और बताता है कि उनकी निष्ठा राजा की आज्ञाओं के प्रति भी नहीं रहेगी। μηδέ को प्रसंगानुसार ‘भी ... नहीं’ से व्यक्त किया गया है।
theological_decisions:
- issue: τοὺς ... παραβεβηκότας और μηδέποτε εὐνοήσειν का वाक्यगत संबंध
  choice: '‘जिन्होंने ... उल्लंघन किया था’ को infinitive εὐνοήσειν का कर्मकारक कर्ता माना गया है: ऐसे लोग राजा की आज्ञाओं के प्रति भी निष्ठावान नहीं रहेंगे।'
  alternative: इसे ‘वे ऐसे उल्लंघनकर्ताओं पर और राजा की आज्ञाओं पर कभी कृपा न करें’ के रूप में दो कर्मों वाला कथन मानना।
  rationale: 'यूनानी परोक्ष कथन की सामान्य accusative-plus-infinitive रचना इस पद को सुगठित ढंग से समझाती है: τοὺς ... παραβεβηκότας कर्मकारक कर्ता है और τοῖς ... προστάγμασιν εὐνοέω का दत्तिव पूरक। वैकल्पिक पाठ में पहले पद का कर्मकारक εὐνοέω की अपेक्षित दत्तिव रचना से मेल नहीं खाता और ‘आज्ञाओं पर कृपा करना’ भी अस्वाभाविक अर्थ देता है।'
- issue: θεῖα προστάγματα में ईश्वरीय संदर्भ
  choice: परमेश्वर की आज्ञाएँ
  alternative: ईश्वरीय आदेश
  rationale: यहूदी कथा-संदर्भ में आज्ञाओं का स्रोत परमेश्वर है; यह रूप स्पष्ट है, फिर भी पद में कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
