  - marker: b
    text: यूनानी का अंतिम पदबंध संक्षिप्त है। इसका सीधा अर्थ राजा की आज्ञाओं के प्रति अनुकूल होना है; इसे राजा की आज्ञाओं का साथ देने वालों के संदर्भ में भी समझा जा सकता है।
