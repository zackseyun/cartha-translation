  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: hi
  text: उस दिन उन्होंने तीन सौ से अधिक पुरुषों को मार डाला, और अपवित्र लोगों को अपने वश में करके[b] उन्होंने उस दिन को भी आनन्द के साथ उत्सव के रूप में मनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘हर्ष को ले गए/लाए’ है; यहाँ भाव उस दिन को उत्सव के रूप में मनाने का है।
    reason: lexical_alternative
  - marker: b
    text: इस यूनानी अंतिम उपवाक्य की रचना कठिन है। ‘अपने वश में करके’ का अनुवाद ‘अपने अधिकार में करके’ या ‘परास्त करके’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: मार डाला
  rationale: कथात्मक प्रसंग में ἀναιρέω का अर्थ ‘मार डालना’ है। यह आधुनिक हिन्दी में स्पष्ट है और हिंसक क्रिया को बिना पुरातन शैली के व्यक्त करता है।
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: तीन सौ से अधिक पुरुषों को
  rationale: यहाँ ὑπέρ कर्मकारक के साथ संख्या की अधिकता बताता है; ἄνδρας के लिए ‘पुरुषों’ मूल के लिंग-विशिष्ट अर्थ को बनाए रखता है।
- source_word: ἤγαγον εὐφροσύνην
  choice: उत्सव के रूप में मनाया
  rationale: शाब्दिक रूप से यह ‘हर्ष को ले गए/लाए’ जैसा है, पर प्रसंग में उत्सव मनाने का भाव देता है। चुना हुआ रूप स्वाभाविक हिन्दी में उस भाव को व्यक्त करता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यह संगति या भाव बताने वाला सीधा पदबंध है; ‘आनन्द के साथ’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: βεβήλους
  choice: अपवित्र लोगों
  rationale: βέβηλος धार्मिक दृष्टि से अपवित्र या अनादरपूर्ण होने का मूल्यांकन व्यक्त करता है। संज्ञा के रूप में प्रयुक्त बहुवचन को हिन्दी में ‘अपवित्र लोगों’ से स्पष्ट किया गया है।
- source_word: χειρωσάμενοι
  choice: काबू में करके
  rationale: χειρόω का अर्थ अपने हाथ में करना, वश में करना या परास्त करना हो सकता है। ‘काबू में करके’ सहज हिन्दी है और क्रिया को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: βεβήλους द्वारा व्यक्त धार्मिक-मूल्यांकन
  choice: अपवित्र लोगों
  alternative: अधर्मी लोगों; धर्मविहीन लोगों
  rationale: ‘अपवित्र’ मूल शब्द के धार्मिक अनादर या अशुद्धता के भाव के निकट रहता है और किसी अधिक विकसित धर्मवैज्ञानिक श्रेणी को पाठ में नहीं जोड़ता।
- issue: ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς βεβήλους χειρωσάμενοι की कठिन वाक्यरचना
  choice: अपवित्र लोगों को काबू में करके उन्होंने उस दिन को भी आनन्द के साथ उत्सव के रूप में मनाया
  alternative: अपवित्र लोगों पर अधिकार पाने के कारण उन्होंने उस दिन का आनन्दपूर्वक उत्सव मनाया
  rationale: यूनानी वाक्यरचना कठिन है। अनुवाद कृदन्त को साधन/परिस्थिति के रूप में खुला रखता है और उसे निश्चित कारण के रूप में नहीं समझाता। स्त्रीलिंग सम्बन्धवाचक सर्वनाम को पहले आए ‘दिन’ से जोड़ना सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘मार डाला’ मूल की हिंसा को स्पष्ट रखता है; ‘उत्सव के रूप में मनाया’ कठिन यूनानी मुहावरे को स्वाभाविक बनाता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
