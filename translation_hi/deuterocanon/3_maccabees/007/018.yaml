  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: hi
  text: वहाँ उन्होंने छुटकारे का भोज[a] मनाया, क्योंकि राजा ने उदारतापूर्वक उनमें से हर एक को उसके अपने घर तक पहुँचने के लिए आवश्यक सब कुछ उपलब्ध कराया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उद्धार का भोज’ अथवा ‘छुटकारे का उत्सव।’ यूनानी में यह भोज उनके बचाव से स्पष्ट रूप से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: भोज
  rationale: यद्यपि यह शब्द मूलतः पीने से संबंधित है, यहाँ ἐποίησαν πότον उत्सवपूर्ण सामूहिक भोज का बोध कराता है; ‘भोज किया’ हिन्दी में स्वाभाविक है।
- source_word: σωτήριον
  choice: छुटकारे का
  rationale: यह विशेषण भोज को हाल में मिले बचाव या छुटकारे से जोड़ता है। ‘छुटकारे का’ इस संबंध को बनाए रखता है, पर यह अनावश्यक रूप से निश्चित नहीं करता कि भोज स्वयं छुटकारा देता था।
- source_word: χορηγήσαντος
  choice: उपलब्ध कराया था
  rationale: यह राजा द्वारा अपने व्यय पर आवश्यक वस्तुएँ मुहैया कराने का भाव व्यक्त करता है। उदारता का पक्ष εὐψύχως के अनुवाद में स्पष्ट किया गया है।
- source_word: εὐψύχως
  choice: उदारतापूर्वक
  rationale: शाब्दिक रूप से अच्छे मन या उत्साह से देने का भाव है; राजकीय प्रबंध के संदर्भ में ‘उदारतापूर्वक’ इच्छापूर्ण और भरपूर व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: पहुँचने के लिए आवश्यक सब कुछ
  rationale: शाब्दिक अर्थ ‘पहुँचने से संबंधित सब वस्तुएँ’ है। अगला वाक्यांश गंतव्य को अपना घर बताता है, इसलिए यह अनुवाद यात्रा की समस्त आवश्यक व्यवस्था को स्पष्ट करता है।
- source_word: ἑκάστῳ
  choice: उनमें से हर एक को
  rationale: एकवचन दत्तिव का वितरणात्मक अर्थ स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: उसके अपने घर तक
  rationale: व्यवस्था हर व्यक्ति के अपने घर तक पहुँचने के लिए थी। एकवचन रूप ἑκάστῳ के वितरणात्मक संबंध को ‘हर एक ... उसके अपने घर’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: σωτήριον का भोज के साथ संबंध
  choice: छुटकारे का भोज
  alternative: उद्धारकारी भोज
  rationale: यूनानी पद भोज को उनके बचाव से स्पष्टतः जोड़ता है, पर यह अनिवार्यतः नहीं कहता कि भोज स्वयं उद्धार का साधन था। ‘छुटकारे का भोज’ इस संबंध और मूल की संभावित अर्थ-व्याप्ति दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘भोज किया’ उत्सवपूर्ण आयोजन को व्यक्त करता है, और ‘उसके अपने घर तक’ यूनानी के वितरणात्मक एकवचन को बनाए रखता है।
