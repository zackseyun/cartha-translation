  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: hi
  text: परन्तु जो मृत्यु तक भी परमेश्वर से दृढ़ता से जुड़े रहे थे, वे पूर्ण छुटकारा[a] पाकर नगर से रवाना हुए। वे हर प्रकार के अत्यन्त सुगंधित फूलों से सजे हुए थे और आनन्द तथा ऊँची पुकार के साथ, स्तुतियों और सुरमय भजनों में अपने पूर्वजों के परमेश्वर—इस्राएल के पवित्र उद्धारकर्ता[b]—को धन्यवाद करते हुए चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूर्ण उद्धार पाकर।’ यूनानी σωτηρία इस प्रसंग में संकट से छुटकारे को दर्शा सकता है, साथ ही उसमें व्यापक उद्धार का अर्थ भी निहित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएल के पवित्र छुड़ानेवाले।’ यूनानी σωτήρ को प्रसंग के अनुसार ‘उद्धारकर्ता’ अथवा ‘छुड़ानेवाला’ कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: मृत्यु की हद तक परमेश्वर को दृढ़ता से थामे रखा था
  rationale: यह अभिव्यक्ति मृत्यु के वास्तविक घटित होने का दावा किए बिना चरम सीमा तक बनी रही निष्ठा दर्शाती है। ‘दृढ़ता से थामे रखना’ ἔχω के यहाँ प्रयुक्त संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: पूरा छुटकारा पाकर
  rationale: कथा के प्रसंग में σωτηρία तत्काल विनाश से बचाए जाने को सूचित करता है; ‘छुटकारा’ इस प्रसंग के अनुकूल है, जबकि पादटिप्पणी इसके व्यापक ‘उद्धार’ अर्थ को सुरक्षित रखती है।
- source_word: ἀνέζευξαν ἐκ τῆς πόλεως
  choice: नगर से रवाना हुए
  rationale: ἀναζεύγνυμι में पड़ाव उठाकर चल देने या प्रस्थान करने का भाव है; ‘रवाना हुए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: हर प्रकार के अत्यन्त सुगंधित फूलों से सजे हुए थे
  rationale: καταστρώννυμι के ढकने या बिछाने के दृश्यात्मक भाव को जुलूस के प्रसंग में स्वाभाविक हिन्दी से व्यक्त किया गया है; εὐωδεστάτοις की तीव्रता ‘अत्यन्त सुगंधित’ में बनी रहती है।
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: आनन्द मनाते तथा जयघोष करते हुए
  rationale: εὐφροσύνη उत्सवपूर्ण आनन्द और βοή ऊँची सामूहिक पुकार दर्शाता है; ‘जयघोष’ इस विजयोल्लासपूर्ण प्रसंग में उपयुक्त है।
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: स्तुतियों और सुरमय भजनों के साथ
  rationale: αἶνοι और ὕμνοι का भेद ‘स्तुतियों’ और ‘भजनों’ से रखा गया है। दुर्लभ παμμελέτοις के विस्तृत संगीतात्मक भाव को बिना अनावश्यक तकनीकी विवरण के ‘सुरमय’ से व्यक्त किया गया है।
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह वाचा-संबंधी पैतृक अभिव्यक्ति है। आधुनिक हिन्दी में ‘पूर्वजों’ सामान्य पाठक के लिए ‘पितरों’ से अधिक स्पष्ट है।
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: इस्राएल के पवित्र उद्धारकर्ता
  rationale: σωτήρ यहाँ परमेश्वर की उपाधि के रूप में प्रयुक्त है। ‘उद्धारकर्ता’ तत्काल रक्षा और व्यापक धर्मवैचारिक अर्थ, दोनों को धारण कर सकता है।
theological_decisions:
- issue: σωτηρία और σωτήρ को ऐतिहासिक रक्षा तथा व्यापक उद्धार—दोनों अर्थों वाले प्रसंग में व्यक्त करना
  choice: σωτηρία के लिए ‘छुटकारा’ और उपाधि σωτήρ के लिए ‘उद्धारकर्ता’
  alternative: दोनों के लिए एक ही शब्द-परिवार—‘उद्धार/उद्धारकर्ता’ या ‘छुटकारा/छुड़ानेवाला’—प्रयोग करना
  rationale: ‘छुटकारा’ तत्काल संकट से पूर्ण रक्षा को स्पष्ट करता है, जबकि ‘उद्धारकर्ता’ परमेश्वर के लिए प्रयुक्त गम्भीर उपाधि और उसके व्यापक अर्थ को बनाए रखता है।
- issue: τὸν θεὸν ἐσχηκότες में निष्ठा और लगाव का संबंधपरक भाव
  choice: ‘परमेश्वर को दृढ़ता से थामे रखा’ कहकर मूल रूपक बनाए रखना
  alternative: ‘परमेश्वर के प्रति निष्ठावान रहे’ कहकर भावार्थ देना
  rationale: मूल यूनानी की ठोस अभिव्यक्ति को बनाए रखने से निष्ठा का अर्थ उपस्थित रहता है, पर उसे केवल एक अमूर्त व्याख्या तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध कथात्मक शैली रखी गई है। लम्बे यूनानी वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘जयघोष’, ‘स्तुति’, ‘भजन’ और ‘उद्धारकर्ता’ उत्सवी तथा आराधनात्मक स्वर बनाए रखते हैं, जबकि संप्रदाय-विशेष की शब्दावली से बचा गया है।
