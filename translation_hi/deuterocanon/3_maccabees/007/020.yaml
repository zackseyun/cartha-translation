  language: hi
  text: इन बातों को एक शिला-स्तंभ पर अंकित करके[a] और भोज के स्थान पर प्रार्थना का एक स्थान स्थापित करके, वे सकुशल, स्वतंत्र और अत्यन्त आनन्दित होकर वहाँ से चल पड़े, राजा की आज्ञा से भूमि, समुद्र और नदियों के रास्ते सकुशल पहुँचते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों को एक शिला-स्तंभ पर समर्पित या प्रतिष्ठित करके”; यूनानी क्रिया का अर्थ उन्हें सार्वजनिक रूप से स्थापित करना या समर्पित करना भी हो सकता है।
    reason: lexical_alternative
