  text: But we[a], after threatening them more harshly on account of these things, in keeping with the clemency we have toward all people, scarcely granted them their lives, and, recognizing that the heavenly God had surely defended the Jews[b],
translation:
  language: hi
  text: परन्तु हमने इन बातों के कारण उन्हें और अधिक कठोर धमकियाँ देने के बाद, सब लोगों के प्रति अपनी क्षमाशीलता के अनुरूप, मुश्किल से उन्हें जीवित रहने दिया[a], और यह जानकर कि स्वर्गीय परमेश्वर[b] ने निश्चय ही यहूदियों की रक्षा की थी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार ढंग से, “उनके प्राण बख्श दिए।”
    reason: lexical_alternative
  - marker: b
    text: या “स्वर्ग के परमेश्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκληρότερον διαπειλησάμενοι
  choice: उन्हें और भी कड़ी धमकी दी
  rationale: तुलनात्मक क्रियाविशेषण और तीव्र अर्थ वाले संयुक्त क्रिया-रूप को सहज हिन्दी में व्यक्त करता है तथा पहले घटित कार्रवाई का क्रम बनाए रखता है।
- source_word: ἐπὶ τούτοις
  choice: इन बातों के कारण
  rationale: यह पिछले प्रसंग की बातों को धमकी का आधार बताता है; इसे तुलना के अर्थ में नहीं लिया गया।
- source_word: ἐπιείκειαν
  choice: उदारता
  rationale: राजकीय संदर्भ में यह संयमित नरमी अथवा दयापूर्ण रियायत का भाव देता है। ‘उदारता’ वक्ता के अपने आचरण के दावे को स्वाभाविक और गरिमापूर्ण ढंग से रखती है।
- source_word: μόγις
  choice: बड़ी मुश्किल से
  rationale: यह रियायत की कठिनता, संकीर्णता या अनिच्छापूर्ण ढंग से दिए जाने का भाव बनाए रखता है।
- source_word: τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: उन्हें जीवित रहने दिया
  rationale: यूनानी अभिव्यक्ति के अर्थ को स्वाभाविक हिन्दी में देता है, जबकि ‘उनके प्राण बख्श दिए’ को अधिक मुहावरेदार विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: ἐπουράνιον θεόν
  choice: स्वर्गीय परमेश्वर
  rationale: यूनानी विशेषण ἐπουράνιον को प्रत्यक्ष रूप से सुरक्षित रखते हुए ऊँची धार्मिक शैली बनाए रखता है।
- source_word: ἐγνωκότες
  choice: यह जान लिया
  rationale: पूर्ण कृदन्त अनुभव से प्राप्त और स्थापित पहचान को दर्शाता है।
- source_word: ἀσφαλῶς
  choice: निश्चय ही
  rationale: यहाँ क्रियाविशेषण परमेश्वर की रक्षा की निश्चितता पर बल देता है।
- source_word: ὑπερησπικότα
  choice: रक्षा की थी
  rationale: पूर्ण कृदन्त पहले से संपन्न और प्रभावी संरक्षण को व्यक्त करता है; हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: ἐπουράνιον θεόν का अनुवाद
  choice: स्वर्गीय परमेश्वर
  alternative: स्वर्ग के परमेश्वर
  rationale: मुख्य पाठ यूनानी विशेषणात्मक बनावट को सुरक्षित रखता है; सामान्य बाइबलीय मुहावरे को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- issue: τὸ ζῆν αὐτοῖς χαρισάμενοι में व्याख्यात्मक सहजता की मात्रा
  choice: उन्हें जीवित रहने दिया
  alternative: उनके प्राण बख्श दिए
  rationale: मुख्य पाठ मूल अभिव्यक्ति के निकट रहते हुए सहज हिन्दी देता है; वैकल्पिक मुहावरा अर्थ को अधिक संक्षेप में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में राजकीय, गरिमापूर्ण शैली रखी गई है। वाक्य स्रोत की तरह आगे जारी रहने वाला अंश है, इसलिए अंत में अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद लगाए गए हैं।
