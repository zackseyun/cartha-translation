    text: ‘मित्रों’ से राजदरबार के सहयोगी या ‘राजमित्र’ भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी शब्द का अर्थ ‘समूह’, ‘संघ’, ‘समुदाय’ या ‘संगठित निकाय’ हो सकता है। यूनानी क्रिया सक्रिय है: शाब्दिक रूप से यह यहूदियों द्वारा इन निकायों को एकत्र करने का भाव देती है; इस पदबंध का सटीक आशय अनिश्चित है।'
    reason: textual_ambiguity
