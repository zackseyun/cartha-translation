  text: हमारे मित्रों[a] में से कुछ लोगों ने, दुर्भावना से और लगातार हमारे निकट रहते हुए, हमें इस बात के लिए राज़ी कर लिया कि हमारे शासन के अधीन यहूदियों को, अपने संगठित निकायों को एकत्र करने के बाद[b], विद्रोहियों के लिए असाधारण दंडों से दंडित किया जाए[c]।
