  choice: संगठित समूह
  alternative: समुदाय, संस्थाएँ, अथवा सामूहिक निकाय
  rationale: शब्द किसी संगठित निकाय या संघ को दर्शा सकता है, पर इस स्थान पर उसका ठीक बल अनिश्चित है। मुख्य पाठ संगठन और सामूहिकता दोनों को बनाए रखता है।
- issue: यहूदियों को इकट्ठा करने वाली क्रिया का वाच्य
  choice: प्रसंगानुकूल रूप से उन्हें समूहों में इकट्ठा किया जाना
  alternative: यहूदियों का अपने समुदायों/निकायों को स्वयं इकट्ठा करना
  rationale: यूनानी participle रूपतः सक्रिय है, पर वाक्य-विन्यास कठिन है और राजकीय कार्रवाई का प्रसंग कर्मवाच्य/कारणवाचक अर्थ की ओर संकेत करता है। इसलिए पठनीय मुख्य पाठ के साथ पादटिप्पणी में व्याकरणिक विकल्प सुरक्षित रखा गया है।
