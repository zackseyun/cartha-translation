  text: जब वे प्टोलेमाइस पहुँचे—जो उस स्थान की विशेषता के कारण “गुलाबों वाली” कहलाती है[a]—तो वहाँ जहाज़ों का बेड़ा उनके साझा निर्णय के अनुसार सात दिन तक उनकी प्रतीक्षा करता रहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “गुलाब धारण करने वाली” भी हो सकता है। यूनानी शब्द ῥοδοφόρον प्टोलेमाइस का एक वर्णनात्मक उपनाम है, जो उस स्थान की किसी विशिष्ट विशेषता से जुड़ा है।
    reason: lexical_alternative
