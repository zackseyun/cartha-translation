- source_word: Παραγενηθέντες
  choice: जब वे … पहुँचे
  rationale: कालसूचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य के रूप में प्रस्तुत किया गया है; इससे अगली घटना से उसका संबंध बना रहता है।
- source_word: Πτολεμαΐδα
  choice: पतोलेमाइस
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण किया गया है, अनुवाद नहीं।
- source_word: τὴν ὀνομαζομένην
  choice: जो … कहलाती है
  rationale: नगर के लिए प्रयुक्त वर्णनात्मक नाम को सहज और स्रोत-समीप हिन्दी में व्यक्त करता है।
- source_word: διὰ τὴν τοῦ τόπου ἰδιότητα
  choice: उस स्थान की विशेषता के कारण
  rationale: ἰδιότης स्थान के विशिष्ट गुण या विशेष प्रकृति को सूचित करता है; अनुवाद उस गुण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ῥοδοφόρον
  choice: “गुलाबों वाली”
  rationale: यूनानी संयुक्त विशेषण का अर्थ ‘गुलाब धारण करने/उपजाने वाली’ है। उद्धरण-चिह्न इसे पतोलेमाइस के वर्णनात्मक उपनाम के रूप में स्पष्ट करते हैं।
- source_word: ἐν ᾗ
  choice: वहाँ
  rationale: यह पतोलेमाइस की ओर संकेत करता है; हिन्दी में ‘वहाँ’ संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: προσέμεινεν αὐτοὺς
  choice: उनकी प्रतीक्षा करता रहा
  rationale: कर्मकारक αὐτούς के साथ क्रिया का आशय केवल ठहरे रहने के बजाय किसी की प्रतीक्षा करना है।
- source_word: ὁ στόλος
  choice: जहाज़ों का बेड़ा
  rationale: στόλος यहाँ एकत्र जहाज़ों के समूह को सूचित करता है; ‘बेड़ा’ इसका मानक हिन्दी पर्याय है।
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: उन सबकी साझा सहमति के अनुसार
  rationale: βουλή सामूहिक विचार, योजना या निर्णय का बोध करा सकता है। ‘साझा सहमति’ सामूहिकता को रखती है और निर्णय की प्रक्रिया को जरूरत से अधिक विशिष्ट नहीं बनाती।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन तक
  rationale: कर्मकारक पद अवधि बताता है; हिन्दी में ‘तक’ उस अवधि को स्पष्ट करता है।
