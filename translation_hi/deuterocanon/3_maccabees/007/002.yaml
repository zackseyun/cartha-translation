  text: And we ourselves and our children are well[a], as the great God directs his commands for us, just as we choose.
translation:
  language: hi
  text: और हम स्वयं और हमारे बच्चे भी कुशल हैं—महान परमेश्वर हमारे लिए आदेशों को दिशा देता है, जैसा हम ठानते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जैसा हम ठानते हैं’ का अनुवाद ‘जैसा हम चुनते हैं’ या ‘जैसा हमारा उद्देश्य है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρώμεθα
  choice: कुशल हैं
  rationale: यह क्रिया यहाँ पत्रात्मक अभिवादन के संदर्भ में स्वस्थ और सकुशल होने का संकेत देती है। ‘कुशल हैं’ स्वाभाविक हिन्दी है और इसे केवल शारीरिक स्वास्थ्य तक सीमित नहीं करती।
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: हम स्वयं तथा हमारे बच्चे भी
  rationale: αὐτοὶ की बलात्मकता ‘स्वयं’ से बनी रहती है, और τέκνα के व्यापक अर्थ के लिए ‘बच्चे’ उपयुक्त है।
- source_word: κατευθύνοντος
  choice: ठीक दिशा दे रहा है
  rationale: मूल क्रिया का अर्थ सीधा करना, दिशा देना या उचित रीति से आगे बढ़ाना है। यह अनुवाद असामान्य कर्म ‘आदेशों’ के साथ भी मूल रूपक को सुरक्षित रखता है।
- source_word: τοῦ μεγάλου θεοῦ
  choice: महान परमेश्वर
  rationale: यह श्रद्धापूर्ण विशेषण सहित पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: τὰ προστάγματα
  choice: आदेशों
  rationale: प्रस्तुत यूनानी पाठ में προστάγματα का सामान्य अर्थ आदेश, निर्देश या अध्यादेश है। स्वामित्व मूल में स्पष्ट नहीं है, इसलिए ‘उसके आदेशों’ या ‘हमारे आदेशों’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: सम्प्रदान कारक को संदर्भ अथवा हित के अर्थ में स्वाभाविक हिन्दी दी गई है, बिना इससे अधिक निश्चित संबंध आरोपित किए।
- source_word: καθὼς προαιρούμεθα
  choice: जैसा हम ठानते हैं
  rationale: प्रक्रिया जानबूझकर चुनने, निश्चय करने या उद्देश्य रखने की है। ‘ठानते हैं’ सचेत मानवीय संकल्प को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की दिशा और मनुष्यों के संकल्प का संबंध
  choice: ‘महान परमेश्वर ... ठीक दिशा दे रहा है’ और ‘जैसा हम ठानते हैं’—दोनों को साथ रखा गया है।
  alternative: वाक्य को इस प्रकार समझाना कि मनुष्यों का निश्चय पूरी तरह परमेश्वर द्वारा निर्धारित है, अथवा परमेश्वर केवल उनके स्वतंत्र उद्देश्य को सफल करता है।
  rationale: यूनानी पाठ परमेश्वर की सक्रिय दिशा और वक्ताओं के προαιρούμεθα को पास-पास रखता है, पर उनके संबंध को स्पष्ट नहीं करता। अनुवाद इस तनाव को सुलझाने के बजाय बनाए रखता है।
- issue: τὰ προστάγματα के स्वामित्व की अस्पष्टता
  choice: केवल ‘आदेशों’
  alternative: ‘उसके आदेशों’ अथवा ‘हमारे आदेशों’
  rationale: यूनानी में संज्ञा के साथ कोई स्पष्ट संबंधवाचक सर्वनाम नहीं है। इसलिए आदेश परमेश्वर के हैं या राजकीय वक्ताओं के, यह मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पत्रात्मक शैली रखी गई है। ‘कुशल हैं’ सामान्य पाठक के लिए सहज है। ‘आदेशों को ठीक दिशा देना’ हिन्दी में कुछ असामान्य है, पर यह प्रस्तुत यूनानी पाठ προστάγματα और κατευθύνω के असामान्य संयोजन तथा उसकी वास्तविक अस्पष्टता को अनावश्यक व्याख्या से ढकने से बचाता है।
