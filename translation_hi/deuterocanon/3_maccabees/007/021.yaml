translation:
  language: hi
  text: हर एक अपने पहले के स्थान पर लौट गया[a]। उन्होंने अपने शत्रुओं के बीच आदर और भय के साथ अधिकार प्राप्त कर लिया था[b], और उनकी सारी संपत्ति में से किसी भी चीज़ को किसी ने तनिक भी क्षति नहीं पहुँचाई थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त और कुछ कठिन है। इसका अर्थ ‘अपने पहले के स्थान पर’, ‘जो पहले उनका था वहाँ’, या ‘अपनी पिछली स्थिति में’ भी हो सकता है; लौटने की क्रिया प्रसंग से समझी जाती है।
    reason: lexical_alternative
  - marker: b
    text: ‘शत्रुओं के बीच अधिकार’ का अनुवाद ‘शत्रुओं पर अधिकार’ भी किया जा सकता है। ‘भय’ से यह भी तात्पर्य हो सकता है कि उनके शत्रु उनसे भय खाने लगे थे।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से यह खंड उनकी समस्त संपत्ति के किसी के द्वारा ‘हिलाए’ या ‘अस्त-व्यस्त किए’ न जाने की बात कहता है; आशय संभवतः यह है कि उनकी किसी भी वस्तु को हानि नहीं पहुँची।
    reason: clarification
lexical_decisions:
- source_word: ἕκαστος εἰς τὴν ἔμπροσθεν
  choice: हर एक अपने पहले के स्थान पर लौट गया
  rationale: यूनानी पदबंध संक्षिप्त और दीर्घवृत्तात्मक है। ‘हर एक’ वितरणात्मक भाव रखता है; प्रसंग में पहले की जगह या स्थिति में वापसी निहित होने के कारण सहज हिन्दी में ‘लौट गया’ स्पष्ट किया गया है।
- source_word: ἐν τοῖς ἐχθροῖς
  choice: अपने शत्रुओं के बीच
  rationale: ἐν + संबंधकारक बहुवचन यहाँ शत्रुओं के संबंध में या उनके बीच प्राप्त स्थिति को व्यक्त कर सकता है। ‘के बीच’ मूल की संभावित संबंधपरक अस्पष्टता बचाता है और अनिवार्य रूप से उन पर प्रभुत्व का अर्थ नहीं थोपता।
- source_word: ἐξουσίαν ἐσχηκότες
  choice: अधिकार प्राप्त कर लिया था
  rationale: सिद्धकालिक कृदन्त प्राप्त और अब विद्यमान अधिकार की अवस्था बताता है। ‘अधिकार’ ἐξουσία का सीधा और सामान्य हिन्दी समकक्ष है।
- source_word: μετὰ δόξης καὶ φόβου
  choice: आदर और भय के साथ
  rationale: δόξα यहाँ प्रतिष्ठा या सम्मान का भाव दे सकता है; ‘आदर’ आधुनिक हिन्दी में स्वाभाविक है। ‘भय’ को व्याख्यायित नहीं किया गया, ताकि यह खुला रहे कि भय दूसरों में उत्पन्न हुआ या उस स्थिति के साथ जुड़ा था।
- source_word: τὸ σύνολον … τῶν ὑπαρχόντων
  choice: उनकी सारी संपत्ति में से किसी भी चीज़ को
  rationale: संक्षिप्त यूनानी रचना उनकी विद्यमान वस्तुओं या संपत्ति की समग्रता की ओर संकेत करती है। हिन्दी में ‘सारी संपत्ति में से किसी भी चीज़’ पूर्णता और एक भी वस्तु के अछूते न रहने वाले नकारात्मक बल को स्पष्ट करता है।
- source_word: ὑπὸ μηδενὸς διασεισθέντες
  choice: किसी ने तनिक भी क्षति नहीं पहुँचाई थी
  rationale: διασείω का मूल भाव हिलाना, विचलित करना या बाधित करना है। संपत्ति के प्रसंग में इसका स्वाभाविक आशय छेड़छाड़ या हानि न होना है; ‘तनिक भी’ पूर्ण निषेध को सहज हिन्दी में व्यक्त करता है।
