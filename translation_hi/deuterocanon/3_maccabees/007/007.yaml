- source_word: δικαίως ἀπολελύκαμεν
  choice: हमने उचित ही ... मुक्त कर दिया है
  rationale: δικαίως निर्णय को न्यायोचित बताता है और ἀπολελύκαμεν का पूर्णकाल पूरा हो चुका तथा प्रभावी बना हुआ विमोचन दर्शाता है।
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: हर प्रकार के आरोप से पूरी तरह
  rationale: यूनानी पदावली जानबूझकर व्यापक और बलयुक्त है। हिन्दी अभिव्यक्ति किसी भी संभावित कानूनी आरोप से संपूर्ण मुक्ति का भाव देती है, बिना असहज शब्दशः संरचना के।
