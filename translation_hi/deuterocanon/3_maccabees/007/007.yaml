base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: hi
  text: यह विचार करके कि वह एक पिता की तरह अपने पुत्रों की ओर से सदा हमारे साथ लड़ता आया है[a], और हमारे तथा हमारे पूर्वजों के प्रति उनकी मित्रवत् अटल सद्भावना को ध्यान में रखते हुए, हमने उचित ही उन्हें हर प्रकार के आरोप से पूरी तरह मुक्त कर दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा हमारा सहयोगी बना रहा है।” यूनानी क्रिया साथ लड़ने पर बल दे सकती है, या अधिक व्यापक अर्थ में सहयोगी सहायता पर।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम यूनानी पदावली अत्यंत बलयुक्त है; उसका शब्दशः भाव लगभग “किसी भी आरोप या कारण से, हर प्रकार से” है। यहाँ उसका कानूनी आशय दिया गया है: किसी भी संभावित आरोप से पूर्ण मुक्ति।'
    reason: lexical_alternative
