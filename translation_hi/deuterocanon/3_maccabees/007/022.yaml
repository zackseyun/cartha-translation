  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: hi
  text: और उन सबने अभिलेख से अपनी सारी वस्तुएँ वापस पा लीं[a], यहाँ तक कि जिन लोगों के पास उनकी कोई वस्तु थी, उन्होंने बड़े भय से उसे उन्हें लौटा दिया, क्योंकि महान परमेश्वर ने उनके छुटकारे के लिए बड़े-बड़े कार्य पूरी रीति से किए थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पंजीकरण से’, ‘सूची से’ अथवा ‘आधिकारिक अभिलेख से’। यूनानी शब्द ἀπογραφή प्रशासनिक पंजीकरण, संपत्ति-सूची या आधिकारिक अभिलेख को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके उद्धार के लिए’। यूनानी शब्द σωτηρία तत्काल संकट से छुटकारे और अधिक व्यापक अर्थ में उद्धार—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκομίσαντο
  choice: वापस पा ली
  rationale: मध्यवाच्य रूप यहाँ अपनी वस्तु फिर से प्राप्त करने का भाव देता है; यह सहज हिन्दी में संपत्ति की बहाली स्पष्ट करता है।
- source_word: ἐξ ἀπογραφῆς
  choice: अभिलेख के आधार पर
  rationale: ἀπογραφή किसी प्रशासनिक पंजीकरण, सूची या माल-सूची को सूचित कर सकता है। प्रसंग में उसी आधिकारिक अभिलेख के आधार पर संपत्ति लौटाए जाने का भाव उपयुक्त है, पर विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πάντα τὰ ἑαυτῶν
  choice: अपनी-अपनी सारी संपत्ति
  rationale: वितरणात्मक भाव को ‘अपनी-अपनी’ से और सभी स्वामित्व वाली वस्तुओं को ‘सारी संपत्ति’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοὺς ἔχοντάς τι
  choice: जिन लोगों के पास उनकी कोई भी वस्तु थी
  rationale: τι की व्यापकता और संपत्ति से उसका प्रसंगगत संबंध दोनों स्पष्ट रहते हैं।
- source_word: μετὰ φόβου μεγίστου
  choice: अत्यंत भय के साथ
  rationale: यह अतिशयोक्तिपूर्ण पदबंध को सीधे व्यक्त करता है और ‘भय’ को नरम करके केवल श्रद्धा नहीं बनाता।
- source_word: ἀποδοῦναι αὐτοῖς
  choice: वह उन्हें लौटा दी
  rationale: यह वस्तु के वास्तविक स्वामियों को वापस किए जाने का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: τὰ μεγαλεῖα
  choice: महान कार्य
  rationale: यह परमेश्वर के बड़े और सामर्थ्यपूर्ण कृत्यों का गरिमापूर्ण किंतु सरल वर्णन है।
- source_word: ποιήσαντος τελέως
  choice: पूरी तरह सम्पन्न किए थे
  rationale: τελέως की पूर्णता और प्रभावशीलता को बनाए रखते हुए जननात्मक निरपेक्ष रचना को हिन्दी में कारणवाचक उपवाक्य बनाया गया है।
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: उनके छुटकारे के लिए
  rationale: कथा के तत्काल प्रसंग में σωτηρία संकट से ठोस बचाव और मुक्ति को सूचित करता है; व्यापक ‘उद्धार’ अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: कथात्मक प्रसंग में σωτηρία का अनुवाद
  choice: छुटकारा
  alternative: उद्धार
  rationale: यहाँ लोगों को ऐतिहासिक संकट से बचाए जाने और उनकी संपत्ति बहाल होने की बात है, इसलिए ‘छुटकारा’ तत्काल अर्थ को अच्छी तरह व्यक्त करता है। फिर भी यूनानी शब्द का व्यापक धार्मिक अर्थ संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर के कार्यों की पूर्णता
  choice: महान कार्य पूरी तरह सम्पन्न किए थे
  alternative: महान कार्य किए थे
  rationale: τελέως को अनूदित रखना आवश्यक है, क्योंकि पाठ केवल कार्य करने की नहीं, उन्हें पूर्ण और प्रभावी रूप से करने की बात कहता है।
