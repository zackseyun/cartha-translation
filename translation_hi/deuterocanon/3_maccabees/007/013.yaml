base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: hi
  text: तब इन लोगों के याजकों और सारी भीड़ ने, जैसा उचित था, उसकी[a] स्तुति की और पुकार उठे, “हालेलूयाह!”[b] फिर वे आनन्द के साथ विदा हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ का संकेत सम्भवतः परमेश्वर की ओर है; यूनानी पाठ यहाँ संज्ञा को स्पष्ट रूप से दोहराता नहीं है।
    reason: alternative_reading
  - marker: b
    text: इसे ‘अल्लेलूया’ भी लिखा जा सकता है; यूनानी में इब्रानी उपासना-उद्घोष का लिप्यंतरण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: स्तुति की
  rationale: यह क्रिया प्रबल और सार्वजनिक प्रशंसा या जयघोष का भाव रखती है। ‘स्तुति की’ उपासना के प्रसंग में स्वाभाविक है और अर्थ को किसी अधिक विशिष्ट धार्मिक विधि तक सीमित नहीं करती।
- source_word: αὐτόν
  choice: उसकी
  rationale: यूनानी पाठ में पुल्लिंग एकवचन सर्वनाम है, संज्ञा ‘परमेश्वर’ दोहराई नहीं गई। हिन्दी में ‘उसकी स्तुति की’ मूल सर्वनाम को बनाए रखते हुए स्वाभाविक अभिव्यक्ति देता है।
- source_word: ὡς πρέπει ἦν
  choice: जैसा उचित था
  rationale: यह वाक्यांश उस आचरण को व्यक्त करता है जो उपयुक्त या शोभनीय था; चुना हुआ रूप मूल की गरिमा और कालगत भाव को सहज हिन्दी में रखता है।
- source_word: οἱ τούτων ἱερεῖς
  choice: इन लोगों के याजकों
  rationale: τούτων के संकेतवाचक और संबंधकारक बल को ‘इन लोगों के’ स्पष्ट रूप से व्यक्त करता है; केवल ‘उनके’ कहने से यह बल धुँधला हो सकता था।
- source_word: πᾶν τὸ πλῆθος
  choice: सारी भीड़
  rationale: ‘सारी’ πᾶν की समग्रता और ‘भीड़’ πλῆθος के एकत्र जनसमूह का सहज आधुनिक हिन्दी रूप है।
- source_word: ἐπιφωνήσαντες
  choice: पुकार उठे
  rationale: यह ऊँचे स्वर से उद्घोष करने का भाव व्यक्त करता है और ‘हालेलूयाह’ जैसे सामूहिक उपासना-उद्घोष के साथ स्वाभाविक बैठता है।
- source_word: ἀλληλουιά
  choice: हालेलूयाह
  rationale: यह इब्रानी मूल का लिप्यंतरित उपासना-उद्घोष है। हिन्दी बाइबलीय प्रयोग में प्रचलित रूप अर्थ का अनावश्यक विस्तार किए बिना उसके आराधनात्मक चरित्र को बनाए रखता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यह मूल संज्ञात्मक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀνέλυσαν
  choice: विदा हो गए
  rationale: सभा के कार्य के समाप्त होने पर चले जाने या बिखरने के अर्थ को गरिमापूर्ण और व्यापक रूप से व्यक्त करता है, जिससे याजक और पूरी भीड़ दोनों समाहित रहते हैं।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: मुख्य पाठ में ‘उसकी’ सर्वनाम रखा गया है।
  alternative: ‘परमेश्वर की’
  rationale: संदर्भ में संकेत सबसे अधिक सम्भवतः परमेश्वर की ओर है, पर यूनानी पाठ स्पष्ट संज्ञा के बजाय सर्वनाम ही प्रयोग करता है। इसलिए मुख्य पाठ मूल की अनिर्दिष्टता सुरक्षित रखता है और सम्भावित संदर्भ पादटिप्पणी में बताता है।
- issue: ἀλληλουιά का रूप
  choice: हालेलूयाह
  alternative: अल्लेलूया; ‘याह की स्तुति करो’
  rationale: मूल यूनानी ने इब्रानी उपासना-उद्घोष का लिप्यंतरण सुरक्षित रखा है। हिन्दी में प्रचलित लिप्यंतर उसी आराधनात्मक स्वरूप को बनाए रखता है; पूर्ण अर्थानुवाद मुख्य पाठ में स्रोत से अधिक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामूहिक उपासना के प्रसंग के अनुकूल भाषा रखी गई है। वाक्य को हिन्दी प्रवाह के लिए दो वाक्यों में बाँटा गया है, जबकि यूनानी participial क्रम—स्तुति, उद्घोष और फिर प्रस्थान—सुरक्षित है।
