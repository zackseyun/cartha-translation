  text: और हमने आदेश दिया है कि सभी लोग अपने-अपने घर लौट जाएँ[a], और कोई भी किसी भी प्रकार उन्हें बिल्कुल हानि न पहुँचाए और न उन घटनाओं को लेकर उनका अपमान करे जो अनुचित ढंग से घटी थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
