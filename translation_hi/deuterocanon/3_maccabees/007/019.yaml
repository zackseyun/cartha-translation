translation:
  language: hi
  text: और जब वे सकुशल नीचे लाए गए, तब उचित धन्यवाद के साथ उन्होंने वहाँ भी यह निश्चय किया कि अपने प्रवास की पूरी अवधि तक इन दिनों को आनन्द के दिनों के रूप में मनाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταχθέντες
  choice: जब वे सकुशल नीचे लाए गए
  rationale: अओरिस्ट कर्मवाच्य कृदन्त κατάγω की नीचे ले आने या वापस पहुँचाने की गति को बनाए रखता है; गंतव्य को अनावश्यक रूप से निश्चित नहीं करता। μετʼ εἰρήνης को स्वाभाविक हिन्दी में ‘सकुशल’ से व्यक्त किया गया है।
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: उचित धन्यवाद के साथ
  rationale: उत्सवपूर्ण प्रसंग में ἐξομολόγησις का अर्थ पाप-स्वीकार की अपेक्षा धन्यवाद या स्तुति अधिक उपयुक्त है; πρεπούσαις का अर्थ ‘उचित’ है।
- source_word: ἔστησαν
  choice: यह निश्चय किया
  rationale: यहाँ धातु का शाब्दिक अर्थ ‘खड़े हुए/स्थापित किया’ नहीं, बल्कि अनन्त क्रिया के साथ दृढ़ निर्णय लेने का भाव देता है।
- source_word: ἄγειν τὰς ἡμέρας
  choice: इन दिनों को ... मनाएँ
  rationale: पर्व या विशेष दिनों के साथ ἄγειν का अर्थ उनका पालन अथवा उत्सव मनाना है; आधुनिक हिन्दी में ‘मनाएँ’ सहज है।
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: अपने प्रवास की पूरी अवधि तक
  rationale: παροικία अपने देश से बाहर परदेशी अथवा अस्थायी निवासी के रूप में रहने को सूचित कर सकता है। ‘प्रवास’ यह व्यापकता बनाए रखता है और औपचारिक निर्वासन का अर्थ नहीं थोपता।
- source_word: εὐφροσύνους
  choice: आनन्द के दिनों के रूप में
  rationale: विशेषण दिनों को आनन्दमय बताता है; यह हिन्दी पदबंध उसके विधेयात्मक बल को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
