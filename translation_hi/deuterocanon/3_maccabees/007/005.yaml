base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as servants—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: hi
  text: ये लोग उन्हें बेड़ियों में, अपमान और दुर्व्यवहार के साथ, दासों की तरह—बल्कि षड्यंत्रकारियों की तरह—नीचे ले आए और बिना किसी सुनवाई या जाँच के उन्हें मार डालने का प्रयास किया; वे ऐसी क्रूरता से ओतप्रोत थे जो स्कूथियों की रीति से भी अधिक बर्बर थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्कूथियों की रीति” अत्यधिक क्रूरता के लिए एक सांस्कृतिक संकेत हो सकती है। यूनानी में अंतिम पद रूपकात्मक और कुछ कठिन है; उसका आशय ऐसी क्रूरता से ओतप्रोत होना है जो स्कूथियों की रीति से भी अधिक बर्बर हो।
    reason: cultural_note
lexical_decisions:
- source_word: δεσμίους καταγαγόντες
  choice: बेड़ियों में नीचे ले आए
  rationale: δεσμίους का ठोस बंधन-संबंधी अर्थ ‘बेड़ियों में’ से और κατάγω की दिशात्मक शक्ति ‘नीचे ले आए’ से सुरक्षित रहती है; गंतव्य को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: μετὰ σκυλμῶν
  choice: अपमानजनक व्यवहार सहते हुए
  rationale: यह पद व्यक्तियों के साथ किए गए कष्टदायक, अपमानित करने वाले दुर्व्यवहार को व्यक्त करता है; हिंदी में यह अर्थ स्वाभाविक ढंग से स्पष्ट होता है।
- source_word: ὡς ἀνδράποδα
  choice: दासों के समान
  rationale: ἀνδράποδα युद्ध-बंदी बनाकर दास बना दिए गए मनुष्यों अथवा मानवीय संपत्ति का अमानवीय भाव रखता है; ‘दासों’ उस कठोरता को नरम नहीं करता।
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: बल्कि षड्यंत्रकारियों के समान
  rationale: μᾶλλον δέ पूर्व तुलना को सुधारते और तीखा करते हुए उन्हें केवल अधीन दास नहीं, बल्कि हानि की योजना बनाने वाले मानने का आरोप व्यक्त करता है।
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: बिना किसी सुनवाई या जाँच के
  rationale: दोनों शब्द न्यायिक प्रक्रिया के अभाव को दर्शाते हैं; ‘सुनवाई’ और ‘जाँच’ आधुनिक पाठक के लिए स्पष्ट हैं और दोनों पदों का भेद बनाए रखते हैं।
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: मार डालने का प्रयास किया
  rationale: इस प्रसंग में ἀναιρέω का स्पष्ट अर्थ हत्या करना है; ‘मार डालना’ अस्पष्ट ‘नष्ट करना’ की अपेक्षा मूल आशय को सीधे व्यक्त करता है।
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: स्कूथियों की रीति से भी अधिक बर्बर
  rationale: νόμος यहाँ लिखित विधान के बजाय प्रचलित रीति या आचार का संकेत दे सकता है; ‘रीति’ हिंदी में उस संभावित अर्थ को स्वाभाविक रूप से व्यक्त करती है, जबकि तुलना सुरक्षित रहती है।
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: ऐसी क्रूरता धारण कर ली थी
  rationale: कठिन participle को क्रूरता से ओतप्रोत या उससे आवेष्टित होने के रूप में समझा गया है; ‘धारण कर ली थी’ रूपक की कुछ जीवंतता बनाए रखता है और अर्थ को जरूरत से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: ὡς ἀνδράποδα में अमानवीय दास-स्थिति की भाषा
  choice: दासों के समान
  alternative: बंदियों के समान
  rationale: ‘बंदी’ मूल शब्द में निहित मनुष्य को संपत्ति-समान दास बना देने की तीव्रता को कम कर देता; इसलिए कठोर सामाजिक स्थिति को स्पष्ट रखा गया।
- issue: νόμου Σκυθῶν का सांस्कृतिक संकेत
  choice: स्कूथियों की रीति
  alternative: स्कूथियों का कानून
  rationale: νόμος दोनों अर्थों की अनुमति देता है, पर यहाँ अत्यधिक क्रूरता के लिए प्रसिद्ध मानी गई सांस्कृतिक प्रथा की तुलना अधिक संभावित है; पादटिप्पणी इस सांस्कृतिक अलंकार को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबी यूनानी वाक्य-संरचना को हिंदी में दो वाक्यों में बाँटा गया है, पर क्रम, आरोप की तीव्रता और अंतिम अलंकार सुरक्षित हैं। ‘स्कूथियों’ को प्रचलित हिंदी बाइबलीय/ऐतिहासिक रूप में रखा गया है।
