base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: hi
  text: परन्तु यह पत्र पाकर उन्होंने लौटने[a] के लिए तुरन्त कोई जल्दी नहीं की, बल्कि राजा से निवेदन किया कि यहूदी वंश के जिन लोगों ने अपनी इच्छा से पवित्र परमेश्वर की व्यवस्था का उल्लंघन किया था, वे उनके हाथों[b] उचित दण्ड पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रस्थान करने’; यूनानी शब्द का अर्थ वर्तमान स्थान से निकलना या किसी पहले स्थान पर लौटना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके द्वारा’; यूनानी अभिव्यक्ति माध्यम अथवा किसी के हाथों दण्ड पाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: परन्तु यह पत्र पाकर
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से पहले की परिस्थिति के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; δέ का हल्का विरोधार्थक बल ‘परन्तु’ से आया है।
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: उन्होंने लौटने की तुरन्त जल्दी नहीं की
  rationale: ἐσπούδασαν की तत्परता/जल्दी और εὐθέως की तात्कालिकता सुरक्षित हैं। संदर्भ में ἄφοδος के लिए ‘लौटना’ सहज है, जबकि ‘प्रस्थान’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: προσηξίωσαν τὸν βασιλέα
  choice: राजा से निवेदन किया
  rationale: क्रिया सम्मानपूर्वक अथवा आग्रहपूर्वक अनुरोध करने का भाव रखती है; ‘निवेदन किया’ आधुनिक गरिमापूर्ण हिन्दी में उपयुक्त है।
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: यहूदी वंश के जिन लोगों
  rationale: γένος के जातीय/वंशगत अर्थ को ‘वंश’ से निकटता से व्यक्त किया गया है, बिना आधुनिक नस्ली शब्दावली का अनावश्यक भार जोड़े।
- source_word: αὐθαιρέτως παραβεβηκότας
  choice: अपनी इच्छा से ... उल्लंघन किया था
  rationale: αὐθαιρέτως स्वेच्छापूर्वक, जानबूझकर किए गए कार्य को बताता है; परिपूर्ण कृदन्त का पूर्वकालिक और वर्तमानतः प्रासंगिक बल ‘किया था’ से व्यक्त है।
- source_word: τοῦ θεοῦ τὸν νόμον
  choice: पवित्र परमेश्वर की व्यवस्था
  rationale: ‘व्यवस्था’ νόμος का प्रचलित और धर्म-सांस्कृतिक रूप से उपयुक्त हिन्दी पर्याय है; यूनानी पदक्रम को स्वाभाविक हिन्दी में पुनर्व्यवस्थित किया गया है।
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: वे उनके हाथों अपना उचित दण्ड पाएँ
  rationale: τυχεῖν का ‘पाना/भोगना’, διʼ αὐτῶν का माध्यम अथवा कर्तृत्व, और ὀφειλομένης का देय/उचित न्यायिक भाव संक्षेप में सुरक्षित है।
theological_decisions:
- issue: ‘पवित्र परमेश्वर’ और उसकी व्यवस्था का सम्बन्ध
  choice: वाक्य को इस्राएल के परमेश्वर की व्यवस्था का स्वेच्छापूर्वक उल्लंघन करने वाले यहूदियों के विषय में सीधे कथन के रूप में रखा गया है।
  alternative: इसे किसी विशिष्ट उत्तरवर्ती धर्मवैज्ञानिक श्रेणी या सम्प्रदायगत धारणा से स्पष्ट करना।
  rationale: मूल पाठ आन्तरिक यहूदी धर्मत्याग/अवज्ञा की निन्दा करता है, पर उससे आगे कोई सिद्धान्तगत व्याख्या नहीं देता; अनुवाद उसी सीमा को बनाए रखता है।
- issue: διʼ αὐτῶν में दण्ड देने वालों की भूमिका
  choice: ‘उनके हाथों’
  alternative: ‘उनके द्वारा’ अथवा ‘उनके माध्यम से’
  rationale: यह वाक्यांश उन लोगों को दण्ड के कार्यान्वयन का माध्यम बताता है। सर्वनाम का सन्दर्भ मूल में भी प्रसंगाधीन है, इसलिए अनुवाद में उसे अधिक स्पष्ट करके तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘व्यवस्था’, ‘उल्लंघन’ और ‘दण्ड’ न्यायिक-धार्मिक स्वर को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
