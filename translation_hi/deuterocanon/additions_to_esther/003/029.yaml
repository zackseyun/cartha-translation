  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: hi
  text: हे परमेश्वर, जो सब पर सामर्थ रखते हैं, निराश हो चुके लोगों की पुकार सुनिए। हमें बुराई करने वालों के हाथ से छुड़ाइए, और मुझे मेरे भय[a] से छुड़ाइए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस बात से मुझे भय है, उससे।” यूनानी वाक्यांश एस्तेर के अपने भय या उस भयकारी संकट—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  choice: हे परमेश्वर
  rationale: सवाचक के रूप में प्रयुक्त यूनानी कर्तृकारक को प्रार्थना के स्वाभाविक और गरिमापूर्ण हिन्दी संबोधन में व्यक्त किया गया है।
- source_word: ὁ ἰσχύων ἐπὶ πάντας
  choice: सब पर सामर्थ रखनेवाले
  rationale: यह परमेश्वर की ऐसी सामर्थ और सर्वोच्चता व्यक्त करता है जो सब पर लागू है; ‘सब’ यूनानी की व्यापकता को किसी एक वर्ग तक सीमित नहीं करता।
- source_word: εἰσάκουσον φωνὴν ἀπηλπισμένων
  choice: निराश हो चुके लोगों की पुकार सुनिए
  rationale: ἀπηλπισμένων की पूर्ण हो चुकी निराश अवस्था को ‘निराश हो चुके’ से और संकट में उठी φωνή की भावात्मक शक्ति को ‘पुकार’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ῥῦσαι ἡμᾶς … ῥῦσαί με
  choice: हमें … छुड़ाइए, और मुझे … छुड़ाइए
  rationale: दोनों यूनानी क्रियाओं की पुनरावृत्ति को बनाए रखा गया है। ‘छुड़ाइए’ आसन्न संकट और शत्रु के वश से मुक्ति, दोनों के लिए सहज आधुनिक हिन्दी है।
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: बुराई करनेवालों के हाथ से
  rationale: ‘हाथ से’ स्रोत के अधिकार अथवा नियंत्रण वाले रूपक को बनाए रखता है, जबकि ‘बुराई करनेवाले’ दुष्ट आचरण को अनावश्यक रूप से षड्यंत्र तक सीमित नहीं करता।
- source_word: ἐκ τοῦ φόβου μου
  choice: मेरे भय से
  rationale: यह सबसे सीधा रूप है और जानबूझकर खुला रखता है कि आशय भीतर के भय से है या उस भयकारी संकट से जिसका सामना एस्तेर कर रही है।
theological_decisions:
- issue: ἐκ τοῦ φόβου μου में भीतरी भय और भय उत्पन्न करनेवाले बाहरी संकट के बीच अस्पष्टता
  choice: मेरे भय से
  alternative: जिस बात से मुझे भय है, उससे
  rationale: मुख्य पाठ यूनानी की संक्षिप्तता और भावात्मक तनाव बनाए रखता है; संभावित बाहरी अर्थ को पादटिप्पणी में दिया गया है, ताकि किसी एक अर्थ को निर्णायक रूप से न थोपा जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-भाषा अपनाई गई है। परमेश्वर के लिए आदरसूचक क्रियारूप ‘सुनिए’ और ‘छुड़ाइए’ सामान्य पाठकों के लिए स्वाभाविक हैं। छोटे वाक्यों में विभाजन हिन्दी में प्रार्थना की स्पष्टता बढ़ाता है, जबकि यूनानी की दो समानांतर विनतियाँ और दोहराई गई क्रिया सुरक्षित रहती हैं।
