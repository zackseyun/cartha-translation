translation:
  language: hi
  text: और अब हमने तेरे सामने पाप किया है, और तूने हमें हमारे शत्रुओं के हाथों में सौंप दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण को सीधे रखते हुए प्रार्थना के प्रवाह को बनाए रखता है; यूनानी में निहित न होने वाला विरोध नहीं जोड़ता।
- source_word: ἡμάρτομεν
  choice: हमने ... पाप किया है
  rationale: यूनानी एओरिस्ट को हिन्दी का पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है और अंगीकार किए गए पाप के वर्तमान परिणाम से संबंध बनाए रखता है।
- source_word: ἐνώπιόν σου
  choice: तेरे सामने
  rationale: परमेश्वर की दृष्टि और उपस्थिति—दोनों भावों को संक्षिप्त, स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: παρέδωκας
  choice: तूने हमें ... सौंप दिया है
  rationale: परमेश्वर द्वारा लोगों को शत्रुओं के अधिकार में दिए जाने की सीधी कर्तृता और न्याय का बल सुरक्षित रहता है।
- source_word: εἰς χεῖρας
  choice: हाथों में
  rationale: मूल का सजीव बाइबलीय मुहावरा हिन्दी में भी स्वाभाविक है और किसी के वश या अधिकार में दिए जाने का अर्थ रखता है।
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं के
  rationale: यह यूनानी पद का सीधा और प्रसंगानुकूल आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: इस्राएल के न्याय में परमेश्वर की कर्तृता
  choice: परमेश्वर ने लोगों को उनके शत्रुओं के हाथों में सौंप दिया—इसे सीधे कहा गया है।
  alternative: ऐसी नरम अभिव्यक्ति जो परमेश्वर की सीधी कर्तृता को अस्पष्ट कर दे।
  rationale: यूनानी पाठ परमेश्वर को द्वितीय पुरुष में संबोधित करता है और παρέδωκας में उसी को कर्ता बताता है; इसलिए पाप और दैवी न्याय के बीच पाठ में उपस्थित धर्मवैज्ञानिक तनाव को कम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सहज शैली। एकवचन आत्मीय संबोधन के लिए ‘तेरे/तूने’ रखा गया है, जो परमेश्वर से सीधे प्रार्थनात्मक संबोधन को दर्शाता है; कोई सांप्रदायिक विशिष्टता नहीं जोड़ी गई।
