base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: hi
  text: तू मेरी विवशता जानता है[a]—मैं अपने घमंड के उस चिह्न से घृणा करती हूँ, जो उन दिनों मेरे सिर पर रहता है जब मैं लोगों के सामने आती हूँ[b][c]। मैं उससे ऐसे घृणा करती हूँ जैसे मासिक धर्म में इस्तेमाल होने वाले कपड़े से करती हूँ[d], और अपने शांत दिनों में उसे नहीं पहनती[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विवशता’ का अर्थ यहाँ ‘संकट’, ‘आवश्यकता’ या ‘बाध्यकारी परिस्थिति’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घमंड का चिह्न’ संभवतः एस्तेर के राजकीय सिर के आभूषण या पद-चिह्न की ओर संकेत करता है; यूनानी पाठ उस वस्तु को ठीक-ठीक नहीं बताता।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, ‘मेरे दिखाई देने के दिनों में’; अर्थात संभवतः वे अवसर जब वह सार्वजनिक रूप से या राजदरबार में उपस्थित होती थी।
    reason: lexical_alternative
  - marker: d
    text: यूनानी में शाब्दिक भाव ‘मासिक धर्म का चिथड़ा’ है—यह जानबूझकर प्रयुक्त तीखी वितृष्णापूर्ण उपमा है।
    reason: lexical_alternative
  - marker: e
    text: या ‘अपने विश्राम/शांति के दिनों में’; यह वाक्यांश उसकी सार्वजनिक उपस्थितियों के विपरीत निजी अवस्था का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: विवशता
  rationale: यह शब्द आवश्यकता, संकट या बाध्यकारी परिस्थिति को व्यक्त कर सकता है। प्रार्थना के संदर्भ में ‘विवशता’ एस्तेर की दबावपूर्ण स्थिति को स्वाभाविक हिन्दी में व्यक्त करती है और केवल भावनात्मक ‘दुःख’ तक अर्थ को सीमित नहीं करती।
- source_word: βδελύσσομαι
  choice: घृणा करती हूँ
  rationale: दोनों प्रयोगों में क्रिया तीव्र वितृष्णा प्रकट करती है; ‘घृणा करती हूँ’ आधुनिक हिन्दी में स्पष्ट, प्रबल और स्वाभाविक है।
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: मेरे घमंड का चिह्न
  rationale: ‘चिह्न’ यूनानी की व्यापकता बनाए रखता है और वस्तु को मुकुट या किसी खास आभूषण के रूप में अनावश्यक रूप से निश्चित नहीं करता। ‘घमंड’ यहाँ नकारात्मक गर्व या ऊँचे पद के दंभी प्रदर्शन का भाव रखता है।
- source_word: ἐν ἡμέραις ὀπτασίας μου
  choice: लोगों के सामने आने के दिनों में
  rationale: इस संदर्भ में ὀπτασία दर्शन या अलौकिक दृश्य नहीं, बल्कि दूसरों को दिखाई देने अथवा सार्वजनिक रूप से उपस्थित होने के अवसरों को सूचित करता है। यह वाक्यांश हिन्दी में उसका प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: ῥάκος καταμηνίων
  choice: मासिक धर्म में इस्तेमाल होने वाला कपड़ा
  rationale: यह अभिव्यक्ति मासिक धर्म से जुड़े कपड़े या चिथड़े का स्पष्ट उल्लेख करती है। हिन्दी पाठ मूल की तीखी और शारीरिक उपमा को बिना अश्लीलता या अनावश्यक शिष्टोक्ति के बनाए रखता है।
- source_word: φορῶ
  choice: पहनती हूँ
  rationale: सिर पर रहने वाले राजकीय चिह्न के संदर्भ में ‘पहनना’ सबसे स्वाभाविक समतुल्य है।
- source_word: ἐν ἡμέραις ἡσυχίας μου
  choice: अपने एकांत के दिनों में
  rationale: ἡσυχία शांति, विश्राम या सार्वजनिक गतिविधि से अलग रहने की दशा बता सकता है। ‘एकांत’ पूर्ववर्ती सार्वजनिक उपस्थितियों के साथ निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एस्तेर द्वारा अस्वीकार की गई वस्तु की पहचान
  choice: उसे सिर पर पहना जाने वाला ‘घमंड का चिह्न’ ही रखा गया है।
  alternative: मुकुट, राजमुकुट या सिर का आभूषण
  rationale: यूनानी पाठ किसी विशेष वस्तु का नाम नहीं लेता। व्यापक पदावली वस्तु की राजकीय प्रकृति का संकेत देती है, पर उसकी पहचान को मूल से अधिक निश्चित नहीं करती।
- issue: मासिक धर्म से जुड़ी उपमा की तीव्रता
  choice: मासिक धर्म का स्पष्ट उल्लेख मुख्य पाठ में रखा गया है।
  alternative: मैला कपड़ा या अशुद्ध चिथड़ा
  rationale: मूल पाठ जानबूझकर स्पष्ट और तीखी उपमा देता है। केवल ‘मैला’ या ‘अशुद्ध’ कहने से उसका ठोस अर्थ और एस्तेर की प्रबल वितृष्णा मंद पड़ जाती।
- issue: ὀπτασία और ἡσυχία के बीच विरोध
  choice: सार्वजनिक रूप से लोगों के सामने आने और निजी एकांत के बीच विरोध व्यक्त किया गया है।
  alternative: दर्शन के दिन और विश्राम के दिन
  rationale: सिर पर पहने जाने वाले राजकीय चिह्न के प्रसंग में सार्वजनिक उपस्थिति और निजी अवस्था का विरोध सर्वाधिक संगत है, जबकि पादटिप्पणियाँ मूल शब्दों की व्यापकता बचाए रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। परमेश्वर को संबोधन के लिए प्रार्थना-संदर्भानुकूल एकवचन ‘तू’ रखा गया है। स्त्रीलिंग क्रियाएँ वक्ता एस्तेर को स्पष्ट करती हैं। मूल की तीखी मासिक-धर्म संबंधी उपमा को शिष्टोक्ति से कमजोर नहीं किया गया, जबकि ‘चिथड़ा’ की अधिक कठोर शाब्दिकता पादटिप्पणी में दी गई है।
