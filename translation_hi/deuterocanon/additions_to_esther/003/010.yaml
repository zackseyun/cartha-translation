base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: hi
  text: मेरी विनती सुन और अपनी निज प्रजा पर दया कर[a], और हमारे शोक को आनंद में बदल दे, ताकि हम जीवित रहकर तेरे नाम का स्तुतिगान करें, हे प्रभु, और तेरी स्तुति करने वालों के मुँह को नष्ट न कर[b]। और समस्त इस्राएल ने अपनी पूरी शक्ति से पुकारा, क्योंकि उनकी मृत्यु उनकी आँखों के सामने थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने भाग पर दया कर।” यहाँ “भाग” से परमेश्वर के अपने लोग, अर्थात् उसकी निज प्रजा, अभिप्रेत हैं। “अपनी विरासत पर अनुग्रह कर” भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरी स्तुति करने वालों के मुँह को नष्ट न कर”; यह परमेश्वर की स्तुति करने वाले लोगों को सदा के लिए चुप कर दिए जाने का सजीव बिम्ब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κουσον (ἄκουσον)
  choice: सुन
  rationale: प्रार्थना में प्रयुक्त आदेशात्मक संबोधन को हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῆς δεήσεώς μου
  choice: मेरी विनती
  rationale: δέησις की आग्रहपूर्ण प्रार्थना या याचना का विशिष्ट भाव बनाए रखता है।
- source_word: ἱλάσθητι
  choice: दया कर
  rationale: कृपालु होने अथवा अनुकूल होने का प्रार्थनात्मक भाव सरल हिन्दी में देता है, बिना तकनीकी प्रायश्चित-शब्दावली आरोपित किए।
- source_word: τῷ κλήρῳ σου
  choice: अपने निज भाग के लोगों पर
  rationale: κλῆρος के शाब्दिक ‘भाग’ और सन्दर्भगत अर्थ—परमेश्वर के अपने लोग—दोनों को सुरक्षित रखता है।
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: हमारे शोक को आनन्द में बदल दे
  rationale: दुःख से आनन्द की ओर उलटाव को स्वाभाविक और निकट हिन्दी में व्यक्त करता है।
- source_word: ἵνα ζῶντες ὑμνῶμεν σου τὸ ὄνομα
  choice: ताकि हम जीवित रहकर तेरे नाम का स्तुतिगान करें
  rationale: जीवित बचने और स्तुति करने के सम्बन्ध को बनाए रखते हुए ὑμνέω के गेय स्तुति-भाव को ‘स्तुतिगान’ से व्यक्त करता है।
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: तेरी स्तुति करनेवालों के मुँह को नष्ट न कर
  rationale: मूल यूनानी के सजीव और कठोर बिम्ब ‘मुँह को नष्ट करना’ को व्याख्यात्मक रूप से केवल ‘चुप न कर’ में बदलने के बजाय सुरक्षित रखता है।
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: अपनी पूरी शक्ति से पुकारा
  rationale: पूरे जोर से की गई सामूहिक पुकार का भाव स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: उनकी मृत्यु उनकी आँखों के सामने थी
  rationale: मूल की पुनरुक्ति और आसन्न मृत्यु के दृश्य बिम्ब दोनों को बनाए रखता है।
theological_decisions:
- issue: κύριε का अनुवाद
  choice: हे प्रभु
  alternative: हे यहोवा
  rationale: यह यूनानी पाठ κύριε पढ़ता है; प्रत्यक्ष हिब्रू चतुरक्षरीय नाम के प्रमाण के बिना ‘प्रभु’ स्रोत-संगत है।
- issue: τῷ κλήρῳ σου का सन्दर्भगत अर्थ
  choice: अपने निज भाग के लोगों पर
  alternative: अपने भाग पर / अपनी विरासत पर
  rationale: ‘भाग’ की मूल उपमा को बचाते हुए स्पष्ट करता है कि प्रार्थना परमेश्वर के निज लोगों के लिए है; ‘विरासत’ भी सम्भव है, पर κλῆρος का मूल अर्थ अधिक परोक्ष हो जाता है।
- issue: ἀφανίσῃς στόμα का बिम्ब
  choice: मुँह को नष्ट न कर
  alternative: स्तुति करनेवालों को चुप न कर
  rationale: अर्थतः मौन कर देना अभिप्रेत हो सकता है, फिर भी मूल का ठोस बिम्ब जानबूझकर सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक रजिस्टर अपनाया गया है। परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरा’ रूप मूल यूनानी के एकवचन संबोधन और हिन्दी प्रार्थना-परम्परा के अनुरूप रखा गया है। ‘स्तुतिगान’ ὑμνέω के गान-संबंधी भाव को संक्षेप में व्यक्त करता है; मुख्य पाठ में मूल के कठिन बिम्बों को मिटाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
