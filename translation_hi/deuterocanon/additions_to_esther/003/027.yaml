  text: And your servant did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: hi
  text: और तेरी दासी[a] ने हामान की मेज़ पर भोजन नहीं किया, और मैंने राजा के भोज का सम्मान नहीं किया, न पेय-भेंटों का दाखमधु[b] पिया;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द स्त्रीलिंग है और उसका अर्थ ‘दासी’ या ‘स्त्री-दास’ हो सकता है; इसमें साधारण ‘सेविका’ से अधिक प्रबल अधीनता का भाव है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पेय-भेंटों या अर्घों से संबद्ध दाखमधु, केवल साधारण दाखमधु नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  choice: तेरी दासी
  rationale: स्त्रीलिंग δοῦλη अधीनता और सेवकत्व का प्रबल भाव रखता है। हिन्दी में ‘दासी’ वक्ता के स्त्री होने और उसके विनम्र आत्म-समर्पण—दोनों को स्वाभाविक रूप से व्यक्त करता है; यह केवल सामान्य ‘सेविका’ से अधिक प्रबल है, पर प्रसंग से बाहर कोई अतिरिक्त सामाजिक विवरण नहीं जोड़ता।
- source_word: ἔφαγεν … τράπεζαν Ἁμάν
  choice: हामान की मेज़ पर भोजन नहीं किया
  rationale: यूनानी में शाब्दिक रूप से ‘हामान की मेज़ नहीं खाई’ है; हिन्दी मुहावरे में मेज़ पर भोजन करना उसी ठोस चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐδόξασα
  choice: सम्मान किया
  rationale: यहाँ δοξάζω का कर्म राजा का भोज है, इसलिए ‘महिमा की’ की अपेक्षा ‘सम्मान किया’ प्रसंगानुकूल है और भोज को प्रतिष्ठित या आदरणीय मानने का भाव रखता है।
- source_word: συμπόσιον βασιλέως
  choice: राजा का भोज
  rationale: συμπόσιον सामूहिक भोज, प्रायः मदिरापान सहित, को सूचित करता है। ‘भोज’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और अनावश्यक रूप से बोलचाल का नहीं है।
- source_word: οἶνον σπονδῶν
  choice: पेय-भेंटों का दाखमधु
  rationale: σπονδαί देवता को उँडेली जाने वाली तरल भेंटें हैं। ‘पेय-भेंटों का दाखमधु’ संबंध को संक्षेप में बनाए रखता है, जबकि पादटिप्पणी सांस्कृतिक अर्थ स्पष्ट करती है।
theological_decisions:
- issue: एस्तेर के आत्म-संबोधन में δοῦλη की प्रबलता
  choice: दासी
  alternative: सेविका
  rationale: ‘दासी’ यूनानी स्त्रीलिंग रूप और उसके प्रबल अधीनता-भाव को सुरक्षित रखता है। यह प्रार्थना में आत्म-दीनता को दिखाता है, पर दासत्व के स्वरूप के विषय में पाठ से अधिक निश्चित दावा नहीं करता।
- issue: οἶνον σπονδῶν का उपासना-संबंधी संकेत
  choice: पेय-भेंटों का दाखमधु
  alternative: साधारण दाखमधु
  rationale: यूनानी वाक्यांश दाखमधु को पेय-भेंटों से जोड़ता है। इसे केवल सामान्य दाखमधु कहना धार्मिक-सांस्कृतिक तनाव मिटा देता; मुख्य पाठ और पादटिप्पणी मिलकर संकेत को बिना अति-व्याख्या के सुरक्षित रखते हैं।
- issue: ἔφαγεν से ἐδόξασα में पुरुष-वचन का परिवर्तन
  choice: ‘दासी ने’ के बाद ‘मैंने’
  alternative: पूरे वाक्य में केवल प्रथम पुरुष
  rationale: यूनानी पाठ पहले तृतीय पुरुष में ‘तेरी दासी ने’ और फिर प्रथम पुरुष में ‘मैंने’ कहता है। हिन्दी में इस परिवर्तन को बनाए रखा गया है, क्योंकि इसे समतल करना मूल की शैलीगत आकृति को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थना के अनुरूप गरिमापूर्ण किंतु सहज रखी गई है। ईश्वर को संबोधन में ‘तेरी’ मूल के एकवचन निकट संबोधन को बनाए रखता है। ‘दाखमधु’ बाइबिलीय-सांस्कृतिक संदर्भ में ‘मदिरा’ से अधिक विशिष्ट है। अर्धविराम के बाद समानांतर ‘न … और न …’ संरचना यूनानी निषेध-श्रृंखला को स्पष्ट करती है।
