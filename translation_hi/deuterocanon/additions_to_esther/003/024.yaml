translation:
  language: hi
  text: परन्तु अपने हाथ से हमें छुड़ा, और मेरी सहायता कर—मैं अकेली हूँ और तेरे सिवा मेरा कोई नहीं है, हे प्रभु। तुझे सब बातों का ज्ञान है,
