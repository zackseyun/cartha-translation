lexical_decisions:
- source_word: ῥῦσαι
  choice: छुड़ा
  rationale: यह संकट से बचाने की तात्कालिक प्रार्थना है। ‘छुड़ा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग से परे कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: ἐν χειρί σου
  choice: अपने हाथ से
  rationale: यह परमेश्वर की सामर्थ्य और कार्यकारी माध्यम का बाइबलीय रूपक बनाए रखता है तथा हिन्दी में सहज है।
- source_word: βοήθησόν μοι
  choice: मेरी सहायता कर
  rationale: आज्ञार्थक विनती और दत्तिव सर्वनाम का सीधा, गरिमापूर्ण हिन्दी रूप।
- source_word: τῇ μόνῃ
  choice: मैं अकेली हूँ
  rationale: स्त्रीलिंग रूप वक्ता एस्तेर की ओर संकेत करता है। स्वतंत्र उपवाक्य हिन्दी में उसकी असहाय स्थिति स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: तेरे सिवा मेरा कोई नहीं है
  rationale: यूनानी कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी रूप, जिसमें निहित व्यक्तिगत आश्रय स्पष्ट रहता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: परमेश्वर को सीधे संबोधन में κύριος का मानक, गरिमापूर्ण हिन्दी अनुवाद।
- source_word: πάντων γνῶσιν ἔχεις
  choice: तुझे सब बातों का ज्ञान है
  rationale: γνῶσιν संज्ञा और ἔχεις की रचना को बनाए रखते हुए ऊँची प्रार्थना-शैली में स्पष्ट हिन्दी देता है।
theological_decisions:
- issue: परमेश्वर के लिए सीधे संबोधन में κύριος का अनुवाद
  choice: हे प्रभु
  alternative: हे स्वामी
  rationale: प्रार्थना इस्राएल के परमेश्वर से है; ‘प्रभु’ मानक बाइबलीय संबोधन है और बिना अनावश्यक सांप्रदायिक अर्थ जोड़े मूल का सम्मान करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के संबोधन में ‘तू/तेरा’ के पारंपरिक निकटतापूर्ण रूप का प्रयोग हुआ है। आरम्भ का ‘परन्तु’ और अंत का अल्पविराम आसपास के वाक्य-प्रवाह से इस खंड के संबंध को सुरक्षित रखते हैं।
