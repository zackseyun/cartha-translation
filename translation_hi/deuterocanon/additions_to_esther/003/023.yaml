  yaml_path: translation/deuterocanon/additions_to_esther/003/023.yaml
  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: hi
  text: सिंह के सामने मेरे मुँह में उपयुक्त वचन डाल[a][b], और उसके हृदय को हमारे विरुद्ध युद्ध करने वाले के प्रति घृणा की ओर फेर दे, ताकि उसका और उसके साथ एकमत रहने वालों का विनाश हो जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे मुँह में सुव्यवस्थित वचन दे।” यूनानी पद ऐसी वाणी का संकेत दे सकता है जो अवसर के अनुकूल और अच्छी तरह गढ़ी हुई हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सिंह” राजा के लिए प्रयुक्त रूपक है।
    reason: cultural_note
  - marker: c
    text: “विनाश” के स्थान पर “अंत” या “सर्वनाश” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς
  choice: डाल
  rationale: δίδωμι का आज्ञार्थक रूप मूलतः ‘दे’ है, पर ‘मेरे मुँह में’ के साथ हिन्दी में ‘डाल’ अधिक स्वाभाविक है और परमेश्वर द्वारा वचन प्रदान किए जाने का भाव बनाए रखता है।
- source_word: λόγον εὔρυθμον
  choice: उपयुक्त वचन
  rationale: εὔρυθμος यहाँ अवसर के अनुकूल, सुव्यवस्थित और अच्छी तरह गढ़ी हुई वाणी का संकेत देता है। ‘उपयुक्त वचन’ इस अर्थ को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον τοῦ λέοντος
  choice: सिंह के सामने
  rationale: मूल यूनानी के रूपक को यथावत रखा गया है; प्रसंग में ‘सिंह’ राजा की ओर संकेत करता है, पर मुख्य पाठ में उसका अर्थ खोलकर रूपक को समाप्त नहीं किया गया।
- source_word: μετάθες τὴν καρδίαν αὐτοῦ
  choice: उसके हृदय को ... फेर दे
  rationale: μετατίθημι राजा की भीतरी प्रवृत्ति बदलने का निवेदन व्यक्त करता है। ‘हृदय को फेर दे’ दिशा-परिवर्तन के रूपक को सुरक्षित रखता है।
- source_word: εἰς μῖσος
  choice: घृणा करने के लिए
  rationale: εἰς परिणामी दिशा बताता है। हिन्दी में यह क्रियात्मक रूप स्वाभाविक है और हृदय के घृणा की ओर मुड़ने का अर्थ देता है।
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: उस व्यक्ति से ... जो हमसे युद्ध कर रहा है
  rationale: एकवचन वर्तमान कृदन्त का कर्तृवाचक और क्रियात्मक बल सुरक्षित रखा गया है; इसे सामान्यीकृत करके ‘शत्रुओं’ नहीं किया गया।
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: ताकि उसका ... विनाश हो जाए
  rationale: συντέλεια अंत, पूर्ण समाप्ति या प्रसंगानुसार विनाश को सूचित करता है। ‘ताकि’ εἰς के परिणाम/लक्ष्य संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: उससे एकमत लोगों
  rationale: ὁμονοέω समान सोच और उद्देश्य रखने को दर्शाता है। ‘उससे एकमत’ मूल की वैचारिक सहभागिता को ‘सहयोगियों’ से अधिक स्पष्टता से बनाए रखता है।
theological_decisions:
- issue: ‘सिंह’ को स्पष्ट रूप से राजा कहना या रूपक बनाए रखना
  choice: मुख्य पाठ में ‘सिंह’ रखा गया
  alternative: राजा के सामने
  rationale: यूनानी पाठ जानबूझकर सिंह की छवि प्रस्तुत करता है। रूपक बनाए रखने से प्रार्थना में भय और राजकीय शक्ति की साहित्यिक तीव्रता सुरक्षित रहती है; अर्थ पादटिप्पणी में बताया गया है।
- issue: τοῦ πολεμοῦντος ἡμᾶς के एकवचन को बनाए रखना
  choice: ‘उस व्यक्ति ... जो हमसे युद्ध कर रहा है’
  alternative: हमारे शत्रु / हमारे शत्रुओं
  rationale: यूनानी कृदन्त एकवचन है और संभवतः मुख्य विरोधी की ओर संकेत करता है। इसके बाद बहुवचन में उसके समान विचार रखने वालों का अलग उल्लेख है।
- issue: εἰς συντέλειαν को उद्देश्य, परिणाम या दिशा के रूप में व्यक्त करना
  choice: ‘ताकि ... विनाश हो जाए’
  alternative: उसके विनाश की ओर / उसके अंत तक
  rationale: εἰς यहाँ लक्ष्य अथवा परिणति की वास्तविक अस्पष्टता रखता है। हिन्दी में ‘ताकि’ प्रार्थना के इच्छित परिणाम को स्पष्ट करता है, जबकि ‘विनाश’ प्रसंगगत अर्थ देता है; वैकल्पिक ‘अंत’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘सिंह’ का मूल रूपक और विरोधी का एकवचन सुरक्षित रखा गया है। ‘उपयुक्त वचन’ सामान्य पाठक के लिए स्पष्ट है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
