base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: hi
  text: तू सब कुछ जानता है; हे प्रभु, तू जानता है कि मैंने यह काम—उस घमंडी हामान के सामने न झुकना[a]—न तो उद्दंडता से, न घमंड से और न ही मान-सम्मान पाने की लालसा से किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस घमंडी हामान के सामने दंडवत न करना।”
    reason: προσκυνεῖν का अर्थ केवल झुकना ही नहीं, बल्कि भूमि तक झुककर दंडवत करना भी हो सकता है; वैकल्पिक रूप इस अधिक विशिष्ट शारीरिक भाव को सुरक्षित रखता है।
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: तू सब कुछ जानता है
  rationale: परमेश्वर को सीधे संबोधित करने वाले बलाघात और उसके सर्वसमावेशी ज्ञान, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: σὺ οἶδας
  choice: तू जानता है
  rationale: यूनानी में प्रयुक्त ज्ञान-संबंधी दूसरे क्रियापद को पहले में विलीन न करके प्रार्थना की जोरदार पुनरुक्ति सुरक्षित रखी गई है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: दैवीय संबोधन के लिए स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: οὐκ ἐν ὕβρει
  choice: न तो उद्दंडता से
  rationale: ὕβρις के धृष्ट, मर्यादा-भंजक और अपमानजनक व्यवहार के भाव को व्यक्त करता है और इसे अगले शब्द के सामान्य घमंड से अलग रखता है।
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: न घमंड से
  rationale: अहंकारी आत्म-ऊँचाई के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: न ही मान-सम्मान पाने की लालसा से
  rationale: φιλοδοξία में निहित सम्मान या प्रतिष्ठा पाने की स्वार्थी आकांक्षा को केवल आधुनिक कैरियर-संबंधी 'महत्त्वाकांक्षा' तक सीमित किए बिना व्यक्त करता है।
- source_word: ἐποίησα τοῦτο
  choice: मैंने यह काम ... किया
  rationale: मूल के संकेतवाचक कथन को बनाए रखता है, जबकि बीच का व्याख्यात्मक वाक्यांश बताता है कि 'यह काम' क्या था।
- source_word: τὸ μὴ προσκυνεῖν
  choice: न झुकना
  rationale: प्रसंग में सम्मान प्रकट करने के लिए शरीर झुकाने का सहज हिन्दी वर्णन है; अधिक शारीरिक रूप से विशिष्ट अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: उस घमंडी हामान के सामने
  rationale: हामान के लिए प्रयुक्त नैतिक विशेषण को छोड़े बिना हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
theological_decisions:
- issue: हामान के सामने न झुकने का मोर्दकै का उद्देश्य
  choice: पद केवल यह स्पष्ट करता है कि उसका आचरण उद्दंडता, घमंड या मान-सम्मान की लालसा से प्रेरित नहीं था; सकारात्मक उद्देश्य अनकहा रहता है।
  alternative: इसे स्पष्ट रूप से केवल धार्मिक, राजनीतिक या निजी विरोध बताना।
  rationale: यूनानी पाठ तीन अनुचित उद्देश्यों का निषेध करता है, पर इस पद में वास्तविक सकारात्मक उद्देश्य नहीं बताता। अनुवाद उस धार्मिक तनाव और संयम को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन “तू” मूल यूनानी के प्रत्यक्ष संबोधन और हिन्दी बाइबिलीय प्रार्थना-परंपरा के अनुरूप है। डैश-युक्त वाक्यांश मूल के व्याख्यात्मक infinitive को स्पष्ट करता है, और तीन निषेधों की लय बनाए रखी गई है।
