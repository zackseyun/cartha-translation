lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: प्रार्थना में यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ अधिकार और श्रद्धा, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντων
  choice: सबके
  rationale: सम्बन्धकारक बहुवचन को ‘सबके प्रभु’ के रूप में प्रस्तुत किया गया है; यह यूनानी रचना के निकट और हिन्दी में सहज है।
- source_word: οὐκ ἔστιν ὃς
  choice: ऐसा कोई नहीं जो
  rationale: यह सामान्य निषेध और सम्बन्धवाचक उपवाक्य, दोनों को स्पष्ट रूप से बनाए रखता है; ‘कोई नहीं कर सकता’ क्षमता का अतिरिक्त भाव जोड़ सकता था।
- source_word: ἀντιτάξεται
  choice: विरोध करेगा
  rationale: भविष्यत् मध्यम रूप किसी के सामने विरोध में खड़े होने का भाव रखता है; ‘विरोध करेगा’ वर्तमान हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: σοι
  choice: आपका
  rationale: हिन्दी क्रिया ‘विरोध करना’ के साथ अपेक्षित सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है; विरोध का भाव क्रिया में ही निहित है।
- source_word: τῷ κυρίῳ
  choice: हे प्रभु
  rationale: रूप औपचारिक रूप से सम्प्रदान कारक है, पर इस प्रार्थनात्मक सन्दर्भ में सम्बोधन के रूप में कार्य करता है; ‘हे प्रभु’ वाक्य का सुसंगत प्रत्यक्ष सम्बोधन बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को प्रत्यक्ष सम्बोधन में κύριος की पुनरावृत्ति
  choice: प्रभु ... हे प्रभु
  alternative: प्रभु ... प्रभु को
  rationale: दूसरा κύριος लेख सहित सम्प्रदान रूप में है, पर सेप्टुआजिन्ट की प्रार्थना-भाषा में वह सम्बोधन का कार्य कर सकता है। इसे ‘हे प्रभु’ कहना पंक्ति के प्रार्थनात्मक और सुसंगत अर्थ को सुरक्षित रखता है, जबकि ‘प्रभु को’ भ्रामक सम्बन्ध उत्पन्न करता।
