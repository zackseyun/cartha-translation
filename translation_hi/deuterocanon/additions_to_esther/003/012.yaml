base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: hi
  text: और उसने अपने वैभव के वस्त्र उतारकर[a] संकट और शोक के वस्त्र पहन लिए। आडंबरपूर्ण सुगंध-द्रव्यों[b] के बदले उसने अपना सिर राख और गोबर से भर दिया[c]। उसने अपने शरीर को अत्यन्त दीन किया, और अपने उल्लासमय श्रृंगार के प्रत्येक स्थान को अपने बालों की मरोड़ी हुई लटों से भर दिया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वैभव के वस्त्र’ से आशय उसके शानदार अथवा राजसी वस्त्रों से है।
    reason: lexical_clarification
  - marker: b
    text: ग्रीक में शाब्दिक रूप से ‘घमण्डी सुगंध-द्रव्य’ है; आशय सम्भवतः भव्य, महँगे या दिखावटी इत्रों से है।
    reason: lexical_alternative
  - marker: c
    text: ग्रीक में शाब्दिक रूप से ‘उसने अपना सिर भर दिया’ है; भाव यह भी हो सकता है कि उसने अपना सिर राख और गोबर से ढक लिया।
    reason: lexical_alternative
  - marker: d
    text: अन्तिम वाक्यांश कठिन है। शाब्दिक रूप से यह उसके बालों की ‘मरोड़ी हुई’ लटों की बात करता है। सम्भवतः जिन स्थानों को वह आनन्द के अवसरों पर सजाती थी, वे अब शोक में उसकी मुड़ी-तुड़ी या बिखरी हुई लटों से ढके थे।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: उसने अपने वैभव के वस्त्र उतारकर
  rationale: मध्यवाच्य कृदन्त एस्तेर द्वारा जानबूझकर वस्त्र उतारने को व्यक्त करता है। ‘वैभव के वस्त्र’ मूल के संबंधकारक रूप और राजसी प्रतिष्ठा तथा शोक-वस्त्रों के विरोध को बनाए रखता है।
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: संकट और शोक के वस्त्र
  rationale: στενοχωρία में तंगी, क्लेश और संकट का भाव है। ‘संकट’ सामान्य पाठक के लिए स्पष्ट है और ‘शोक’ के साथ परिस्थिति तथा मनोदशा दोनों प्रकट करता है।
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: आडंबरपूर्ण सुगंध-द्रव्यों के बदले
  rationale: ἡδύσματα सुगंधित द्रव्यों, मसालों या इत्रों को सूचित करता है; ὑπερήφανος का मूल भाव घमण्डी/ऊँचा है, पर यहाँ वस्तुओं के लिए प्रयुक्त होकर दिखावटी भव्यता का संकेत देता है। ‘आडंबरपूर्ण’ उस असामान्य विशेषण की तीक्ष्णता को स्वाभाविक हिन्दी में बचाता है।
- source_word: σποδοῦ καὶ κοπριῶν
  choice: राख और गोबर
  rationale: दोनों शब्दों का सीधा और जानबूझकर कठोर अर्थ रखा गया है; ‘गंदगी’ जैसा नरम विकल्प आत्म-दीनता की तीव्रता घटा देता।
- source_word: ἔπλησεν τὴν κεφαλήν
  choice: अपने सिर को ... भर लिया
  rationale: ग्रीक में क्रिया का शाब्दिक अर्थ ‘भरना’ है। हिन्दी में प्रयोग असामान्य होने पर भी मूल की प्रबल और विचित्र अभिव्यक्ति को सुरक्षित रखता है; सम्भावित आशय पादटिप्पणी में बताया गया है।
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: अपने शरीर को बहुत दीन किया
  rationale: ταπεινόω का अर्थ दीन करना, नीचा करना या नम्र करना है। यह अनुवाद शारीरिक आत्म-दीनता रखता है, पर उपवास या किसी अन्य अनकहे अनुष्ठान को पाठ में नहीं जोड़ता।
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: अपने उल्लासमय श्रृंगार की हर जगह
  rationale: κόσμος यहाँ ‘संसार’ नहीं, बल्कि श्रृंगार या सजावट है; ἀγαλλίαμα उल्लास या हर्ष का भाव देता है। अभिव्यक्ति को निकट रखते हुए शरीर के उन भागों की ओर संकेत किया गया है जिन्हें उत्सव के लिए सजाया जाता था।
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: अपने बालों की उलझी लटों
  rationale: στρεπτός मुड़े, मरोड़े या गुँथे होने का भाव दे सकता है। शोक के प्रसंग में ‘उलझी लटें’ स्वाभाविक हिन्दी है, पर कठिन मूल वाक्यांश की अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: एस्तेर के शोक की शारीरिक और कठोर छवि
  choice: ‘राख और गोबर’ तथा ‘अपने शरीर को बहुत दीन किया’ जैसी ठोस भाषा बनाए रखी गई।
  alternative: ‘राख और गंदगी’ अथवा केवल ‘उसने स्वयं को दुःख दिया’।
  rationale: मूल पाठ गहरी आत्म-दीनता को जानबूझकर कठोर शारीरिक बिंबों में व्यक्त करता है। इसे सामान्य दुःख में बदलना पाठ की तीव्रता कम कर देता।
- issue: στρεπτῶν τριχῶν αὐτῆς की कठिन व्याख्या
  choice: मुख्य पाठ में ‘बालों की उलझी लटों’ और पादटिप्पणी में शाब्दिक तथा वैकल्पिक अर्थ।
  alternative: ‘बाल नोचने’ या ‘बाल बिखेरने’ को निश्चित अर्थ मानना।
  rationale: ग्रीक शब्द मरोड़ने या मुड़े होने से संबंधित है, पर पूरा वाक्यांश कठिन है। इसलिए शोक-संदर्भ के सम्भावित अर्थ को पठनीय रूप में रखते हुए अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। ‘वस्त्र’, ‘शोक’, ‘सुगंध-द्रव्य’ और ‘दीन किया’ जैसे शब्द धार्मिक-साहित्यिक गरिमा रखते हैं, जबकि वाक्यरचना साधारण पाठक के लिए स्पष्ट है। मूल की कठोरता और अन्तिम वाक्यांश की अनिश्चितता को नरम या सिद्धान्तगत रूप से निश्चित नहीं किया गया।
