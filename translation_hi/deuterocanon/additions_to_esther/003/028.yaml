  register: आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘तेरी/तुझमें’ निकट और पारंपरिक एकवचन ईश-संबोधन है। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए यूनानी के नकारात्मक कथन और अपवाद को ‘केवल तुझमें ही’ के सकारात्मक विन्यास में रखा गया है, बिना उसके आशय को बदलने के।
