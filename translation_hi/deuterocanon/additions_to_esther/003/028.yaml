translation:
  language: hi
  text: और तेरी दासी[a] मेरे परिवर्तन[b] के दिन से अब तक तेरे सिवा किसी में आनन्दित नहीं हुई है, हे प्रभु, अब्राहम के परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी सेविका।’ यूनानी में ‘दास/दासी’ का स्त्रीलिंग रूप है, जिसे एस्तेर परमेश्वर के सामने अपने लिए नम्र संबोधन के रूप में प्रयोग करती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी दशा बदलने के दिन से’ अथवा ‘मेरे उलटाव के दिन से।’ यूनानी वाक्यांश यह स्पष्ट नहीं करता कि परिवर्तन किस बात का था।
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  choice: दासी
  rationale: यह स्त्रीलिंग रूप है और परमेश्वर के सामने एस्तेर की दीन, पूर्णतः आश्रित आत्म-पहचान को व्यक्त करता है। ‘दासी’ आधुनिक हिन्दी में स्वाभाविक है और ‘सेविका’ की अपेक्षा बंधी हुई अधीनता का भाव अधिक सुरक्षित रखता है।
- source_word: ηὐφράνθη
  choice: आनन्दित हुई है
  rationale: यह क्रिया प्रसन्न या आनन्दित होने का भाव देती है। हिन्दी का स्त्रीलिंग रूप वक्ता के एस्तेर होने को भी बनाए रखता है।
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: मेरे परिवर्तन के दिन से लेकर अब तक
  rationale: μεταβολή परिवर्तन, उलटाव या बदली हुई दशा का संकेत दे सकता है। मुख्य पाठ में ‘परिवर्तन’ रखकर यूनानी की अनिर्दिष्टता सुरक्षित रखी गई है।
- source_word: πλὴν ἐπὶ σοί
  choice: केवल तुझमें ही
  rationale: πλήν अपवाद बताता है और ἐπὶ σοί यहाँ आनन्द के आधार या क्षेत्र के रूप में परमेश्वर की ओर संकेत करता है। ‘तुझमें’ इस धार्मिक संबंध को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप को स्वाभाविक और गरिमापूर्ण हिन्दी प्रार्थना-शैली में प्रस्तुत करता है।
- source_word: ὁ θεὸς Ἀβραάμ
  choice: अब्राहम के परमेश्वर
  rationale: यह वाचा-संबंधी ईश्वरीय उपाधि का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: प्रार्थना में δούλη द्वारा आत्म-संबोधन
  choice: तेरी दासी
  alternative: तेरी सेविका
  rationale: ‘दासी’ स्त्रीलिंग को स्पष्ट रखते हुए नम्रता और पूर्ण अधीनता दोनों व्यक्त करता है; फिर भी इसे सामाजिक दासता पर अतिरिक्त कथन बनाने के लिए विस्तारित नहीं किया गया।
- issue: μεταβολή का आशय
  choice: मेरा परिवर्तन
  alternative: मेरी दशा का बदलना; मेरा उलटाव
  rationale: यूनानी पाठ यह नहीं बताता कि परिवर्तन पद, परिस्थिति, भाग्य या किसी अन्य बात का था। इसलिए मुख्य अनुवाद उस अस्पष्टता को बनाए रखता है।
- issue: नकार और अपवाद का हिन्दी रूप
  choice: केवल तुझमें ही आनन्दित हुई है
  alternative: तेरे सिवा किसी में आनन्दित नहीं हुई
  rationale: यूनानी का ‘आनन्दित नहीं हुई ... सिवा तुझमें’ हिन्दी में सकारात्मक अपवाद के रूप में अधिक स्वाभाविक है और वही अर्थ देता है कि इस अवधि में परमेश्वर अकेला उसके आनन्द का आधार रहा।
