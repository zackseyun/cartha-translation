    text: “आपका भवन” सम्भवतः मंदिर को दर्शाता है, यद्यपि यूनानी में केवल “भवन” या “घर” है। “बुझा दें” यूनानी की एक ही क्रिया को महिमा और वेदी दोनों पर लागू करता है।
