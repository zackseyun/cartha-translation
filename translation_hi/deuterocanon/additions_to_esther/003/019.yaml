lexical_decisions:
- source_word: ἐξᾶραι
  choice: हटा दें
  rationale: यह क्रिया किसी वस्तु को उठा लेने, दूर करने या समाप्त कर देने का भाव रखती है। यहाँ परमेश्वर के मुख से निकले विधान को निष्प्रभावी करने का शत्रुतापूर्ण उद्देश्य व्यक्त होता है।
- source_word: ὁρισμὸν στόματός σου
  choice: आपके मुख से निकले विधान
  rationale: ὁρισμός के निश्चित आदेश या विधान के अर्थ को रखा गया है। हिन्दी में संबंध स्पष्ट और स्वाभाविक बनाने के लिए ‘मुख से निकले’ कहा गया है, जबकि ‘मुख’ की मूल बिंबात्मकता भी बनी रहती है।
- source_word: ἀφανίσαι
  choice: नष्ट कर दें
  rationale: यह किसी को मिटा देने, लुप्त कर देने या विनाश में डालने की प्रबल क्रिया है; प्रसंग में ‘नष्ट कर दें’ उपयुक्त है।
- source_word: κληρονομίαν σου
  choice: आपकी विरासत
  rationale: शब्द का मूल अर्थ उत्तराधिकार, विरासत या अधिकार में मिली संपत्ति है। बाइबलीय प्रसंग में यह परमेश्वर की प्रजा या उसके अधिकार की वस्तु हो सकती है; ‘विरासत’ संदर्भ को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἐμφράξαι στόμα
  choice: मुँह बंद कर दें
  rationale: यूनानी मुहावरे का ठोस बिंब और पहले आए ‘मुख’ के साथ समानांतरता रखते हुए स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: αἰνούντων σοι
  choice: आपकी स्तुति करनेवालों
  rationale: वर्तमान कृदंत परमेश्वर की स्तुति करनेवाले उपासकों को बताता है; यह हिन्दी में सहज और स्पष्ट है।
- source_word: σβέσαι
  choice: बुझा दें
  rationale: क्रिया आग या प्रकाश बुझाने के लिए प्रयुक्त होती है। ‘महिमा’ के साथ इसका रूपक और ‘वेदी’ के साथ इसका ठोस संकेत दोनों सुरक्षित रहते हैं।
- source_word: δόξαν οἴκου σου
  choice: आपके भवन की महिमा
  rationale: δόξα की महिमा या वैभव की धारणा तथा οἶκος का शाब्दिक ‘भवन/घर’ सुरक्षित है; मंदिर होने की सम्भावना मुख्य पाठ में स्पष्ट नहीं की गई।
- source_word: θυσιαστήριόν σου
  choice: आपकी वेदी
  rationale: θυσιαστήριον का मानक और स्पष्ट हिन्दी समतुल्य ‘वेदी’ है।
theological_decisions:
- issue: ‘आपकी विरासत’ का संदर्भ
  choice: मुख्य पाठ में ‘आपकी विरासत’ रखा गया
  alternative: आपकी प्रजा / इस्राएल
  rationale: संदर्भ सम्भवतः परमेश्वर की प्रजा की ओर संकेत करता है, पर यूनानी पाठ स्वयं उसका नाम नहीं लेता। वाचा-संबंधी शब्दावली और वास्तविक संदिग्धता दोनों सुरक्षित रखी गई हैं।
- issue: ‘आपके भवन’ का संदर्भ
  choice: ‘भवन’ का शाब्दिक अनुवाद रखा गया
  alternative: आपका मंदिर
  rationale: प्रसंग में भवन सम्भवतः मंदिर है, विशेषकर वेदी के साथ आने के कारण; फिर भी मूल पाठ केवल ‘भवन/घर’ कहता है, इसलिए व्याख्या को पादटिप्पणी में रखा गया है।
- issue: एक ही क्रिया का ‘महिमा’ और ‘वेदी’ पर लागू होना
  choice: दोनों के लिए ‘बुझा दें’ रखा गया
  alternative: महिमा मिटा दें और वेदी बुझा दें / नष्ट कर दें
  rationale: यूनानी में σβέσαι दोनों कर्मों को नियंत्रित करती प्रतीत होती है। हिन्दी में असामान्य लगने पर भी यह स्रोत के सशक्त रूपक और उसके तनाव को सुरक्षित रखता है।
