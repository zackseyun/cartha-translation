  text: to remove the decree from your mouth and to destroy your inheritance[a], and to shut the mouth of those who praise you, and to extinguish the glory of your house and your altar[d][c][b],
translation:
  language: hi
  text: कि वे आपके मुख से निकले विधान को हटा दें[a], आपकी विरासत को नष्ट कर दें[b], आपकी स्तुति करनेवालों का मुँह बंद कर दें[c], और आपके भवन की महिमा तथा आपकी वेदी को बुझा दें[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके मुख के विधान को उठा ले जाएँ।” आशय परमेश्वर के अधिकारपूर्ण विधान को हटा देने या निष्प्रभावी कर देने से हो सकता है।
