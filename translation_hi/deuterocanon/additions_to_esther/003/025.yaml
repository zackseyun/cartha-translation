  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: hi
  text: और तू जानता है कि मैंने अधर्मियों के वैभव से घृणा की, और मैं खतनारहित लोगों और हर विदेशी की शय्या[a] से घृणा करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवाह-शय्या” अथवा “यौन संबंध”; यूनानी शब्द “शय्या” विवाह या यौन संबंध के लिए लाक्षणिक रूप से भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίσησα
  choice: मैंने ... घृणा की है
  rationale: यूनानी एओरिस्ट प्रार्थना में एस्तेर के पूर्व और अब तक प्रासंगिक रुख को व्यक्त करता है; हिन्दी पूर्ण भूत रूप इसे स्वाभाविक ढंग से रखता है।
- source_word: δόξαν
  choice: वैभव
  rationale: यहाँ δόξα पद, प्रतिष्ठा या सांसारिक ठाठ की ओर संकेत करता है। ‘वैभव’ आधुनिक हिन्दी में ऊँचे भाव को बनाए रखता है।
- source_word: ἀνόμων
  choice: अधर्मियों
  rationale: ἀνόμων का मूल भाव व्यवस्था या धर्म-विधान के विरुद्ध होने का है। ‘अधर्मी’ केवल सामान्य ‘दुष्ट’ की अपेक्षा इस संबंध को बेहतर बनाए रखता है।
- source_word: βδελύσσομαι
  choice: मैं ... से घिन करता हूँ
  rationale: क्रिया तीव्र वितृष्णा व्यक्त करती है। यह प्रयोग आधुनिक, स्पष्ट और प्रार्थना के गंभीर स्वर के अनुकूल है।
- source_word: κοίτην
  choice: शय्या
  rationale: κοίτη का शाब्दिक चित्र ‘शय्या’ है, पर वह विवाह या यौन संबंध का लाक्षणिक अर्थ भी रख सकता है। मुख्य पाठ में चित्र को सुरक्षित रखा गया है और विकल्प पाद-टिप्पणी में स्पष्ट किए गए हैं।
- source_word: ἀπεριτμήτων
  choice: खतनारहित लोगों
  rationale: यूनानी में बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। हिन्दी में ‘लोगों’ जोड़ना व्याकरणिक स्पष्टता देता है, जबकि खतनारहित होने का मूल संकेत सुरक्षित रहता है।
- source_word: παντὸς ἀλλοτρίου
  choice: हर पराए व्यक्ति
  rationale: संदर्भ में ἀλλότριος किसी बाहरी या विदेशी व्यक्ति को सूचित करता है। ‘पराया व्यक्ति’ संबंधगत दूरी को व्यक्त करता है और केवल आधुनिक राष्ट्रीयता तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: क्या κοίτην को यौन संबंध या विवाह-शय्या के रूप में स्पष्ट कर दिया जाए
  choice: शय्या
  alternative: विवाह-शय्या; यौन संबंध
  rationale: यूनानी शब्द शाब्दिक और लाक्षणिक दोनों अर्थों की गुंजाइश रखता है। ‘शय्या’ मूल बिंब और वास्तविक अस्पष्टता को बचाए रखता है।
- issue: क्या ἀνόμων का अनुवाद सामान्य अर्थ में ‘दुष्टों’ किया जाए
  choice: अधर्मियों
  alternative: दुष्टों; व्यवस्था-विहीन लोगों
  rationale: ‘अधर्मी’ नैतिक बुराई के साथ धर्म-विधान के उल्लंघन की शब्दगत छाया बनाए रखता है और ‘दुष्ट’ की अपेक्षा स्रोत के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर प्रार्थना के गंभीर और गरिमापूर्ण स्वर के लिए ‘वैभव’ और ‘शय्या’ जैसे सहज साहित्यिक शब्द रखे गए हैं। संबोधन का एकवचन निकट रूप ‘तू’ मूल प्रार्थना में परमेश्वर से सीधे संबोधन के अनुरूप है।
