review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the main lexical elements: δόξαν as “वैभव,” ἀνόμων as “अधर्मियों,” and κοίτην as “शय्या,” while retaining the source’s deliberate ambiguity about bed, marriage bed, or sexual union. The aorist ἐμίσησα is more directly represented by the simple past “की,” rather than the present-perfect “की है.” “हर विदेशी” is clearer and more idiomatic for παντὸς ἀλλοτρίου than “हर पराए व्यक्ति,” without materially narrowing the referent.'
  naturalness: “...शय्या से घिन करता हूँ” is not idiomatic standard Hindi. A person normally “घृणा करता है” or “घिन महसूस करता है/उसे घिन आती है”; the former best conveys βδελύσσομαι in this solemn prayer. The revised coordinated possessives are also smoother.
  terminology: “अधर्मियों” is a suitable established Hindi rendering that retains the moral-legal force of ἀνόμων without reducing it merely to “दुष्टों.” “खतनारहित लोगों” is grammatical and appropriately leaves the implied noun in Greek explicit only as needed in Hindi. “शय्या” preserves the elevated register and lexical ambiguity.
  issues:
  - severity: medium
    issue: The idiom “शय्या से घिन करता हूँ” is unnatural in modern standard Hindi.
    rationale: “घिन करना” is not the normal construction for personal abhorrence. “...से घृणा करता हूँ” is idiomatic and conveys the strong revulsion of βδελύσσομαι.
  - severity: low
    issue: “मैंने ... घृणा की है” somewhat blurs the straightforward past force of ἐμίσησα.
    rationale: The Greek aorist is safely rendered in Hindi here by “मैंने ... घृणा की.”
  - severity: low
    issue: “हर पराए व्यक्ति” is less natural and less semantically direct than “हर विदेशी.”
    rationale: In this context ἀλλότριος most naturally identifies a foreign/outsider person. “विदेशी” is clear modern Hindi; the historical exclusionary wording is retained because it is present in the source.
  revised_text: और तू जानता है कि मैंने अधर्मियों के वैभव से घृणा की, और मैं खतनारहित लोगों और हर विदेशी की शय्या[a] से घृणा करता हूँ।
