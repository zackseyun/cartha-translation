base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: hi
  text: पर मैंने ऐसा इसलिए किया कि मनुष्य की महिमा को परमेश्वर की महिमा से ऊपर न रखूँ; और हे मेरे प्रभु, मैं आपके सिवा किसी के आगे दण्डवत् नहीं करूँगा[a], और मैं ये काम घमण्ड में आकर नहीं करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आपके सिवा किसी की आराधना नहीं करूँगा।” यूनानी क्रिया का अर्थ प्रसंग के अनुसार सम्मान में दण्डवत् करना या आराधना करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησα
  choice: मैंने ऐसा किया
  rationale: अओरिस्ट क्रिया को पूर्ण भूतकाल की स्वाभाविक हिन्दी में रखा गया है; ‘ऐसा’ प्रसंग में पहले बताए गए आचरण की ओर संकेत करता है।
- source_word: ἵνα μὴ θῶ
  choice: कि ... ऊपर न रखूँ
  rationale: τίθημι के ‘रखना/स्थापित करना’ रूपक को लक्ष्यवाचक ἵνα के साथ स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: δόξαν ἀνθρώπου
  choice: मनुष्य की महिमा
  rationale: एकवचन ἀνθρώπου को जातिवाचक एकवचन ‘मनुष्य’ से व्यक्त किया गया है और δόξα को अगले ‘परमेश्वर की महिमा’ के समान शब्द से अनूदित किया गया है, जिससे मूल विरोध बना रहता है।
- source_word: ὑπεράνω
  choice: से ऊपर
  rationale: दो महिमाओं के बीच ऊँचे स्थान या दर्जे की तुलना को सीधा व्यक्त करता है।
- source_word: οὐ προσκυνήσω
  choice: किसी के आगे दण्डवत् नहीं करूँगा
  rationale: προσκυνέω के शारीरिक रूप से झुककर सम्मान प्रकट करने के अर्थ को मुख्य पाठ में रखा गया है, जबकि ‘आराधना’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πλὴν σοῦ τοῦ κυρίου μου
  choice: हे मेरे प्रभु, मैं आपके सिवा
  rationale: πλήν के अपवाद-बोध और संबोधित परमेश्वर के लिए κύριος के ‘प्रभु’ अर्थ को स्पष्ट, सम्मानपूर्ण हिन्दी में रखा गया है।
- source_word: οὐ ποιήσω αὐτὰ
  choice: मैं ये काम ... नहीं करूँगा
  rationale: नपुंसकलिंग बहुवचन αὐτά को बहुवचन ‘ये काम’ से व्यक्त किया गया है, उसे एकवचन में नहीं समेटा गया।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमण्ड में आकर
  rationale: ὑπερηφανία के अभिमान या अहंकार के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मनुष्य के सामने προσκυνέω का आशय
  choice: मुख्य पाठ में ‘दण्डवत् करना’
  alternative: ‘आराधना करना’
  rationale: प्रसंग में मनुष्य के सामने झुकने से इनकार की ठोस क्रिया प्रमुख है, पर यूनानी क्रिया आराधना का अर्थ भी दे सकती है; इसलिए उस तनाव को पादटिप्पणी में खुला रखा गया है।
- issue: ἀνθρώπου का एकवचन और जातिवाचक बल
  choice: ‘मनुष्य की महिमा’
  alternative: ‘किसी मनुष्य की महिमा’ या ‘मानवीय महिमा’
  rationale: ‘मनुष्य’ हिन्दी में स्वाभाविक जातिवाचक एकवचन है और मूल के एकवचन रूप को बनाए रखते हुए अनावश्यक अमूर्तीकरण से बचता है।
- issue: τοῦ κυρίου μου में संबोधन की पहचान
  choice: ‘हे मेरे प्रभु’
  alternative: ‘मेरे स्वामी’
  rationale: पूरा कथन परमेश्वर को संबोधित प्रार्थना है और ठीक पहले ‘परमेश्वर की महिमा’ का उल्लेख है; अतः ‘प्रभु’ प्रसंग-संगत है, फिर भी वाक्य में προσκυνέω की अर्थगत अस्पष्टता अलग से सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महिमा’ की पुनरावृत्ति मूल के धर्मवैचारिक विरोध को बनाए रखती है; ‘दण्डवत्’ शारीरिक अधीनता की क्रिया को व्यक्त करता है और पादटिप्पणी उसके सम्भावित आराधनात्मक अर्थ को सुरक्षित रखती है।
