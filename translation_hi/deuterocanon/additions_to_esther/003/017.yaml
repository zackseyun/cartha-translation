lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: क्योंकि
  rationale: यह पद पिछले कथन के कारण या आधार को बताता है। ‘क्योंकि’ आधुनिक हिन्दी में इस कारणात्मक संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἐδοξάσαμεν
  choice: हमने … की महिमा की थी
  rationale: δοξάζω का मूल भाव किसी को महिमा या गौरव देना है। ‘महिमा की’ उपासना-संबंधी गंभीरता को बनाए रखता है; पूर्ण भूतकाल ‘की थी’ पूर्व किए गए पाप की स्वीकारोक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς θεοὺς αὐτῶν
  choice: उनके देवताओं
  rationale: यूनानी बहुवचन और संबंधवाचक सर्वनाम को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है तथा अन्यजातीय देवताओं और प्रभु के बीच का विरोध सुरक्षित रखता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: δίκαιος परमेश्वर की नैतिक सत्यनिष्ठा और न्यायोचितता दोनों व्यक्त कर सकता है। ‘धर्मी’ स्वीकारोक्ति के धार्मिक स्वर को बनाए रखता है, जबकि न्यायिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को हिन्दी के स्वाभाविक प्रार्थनात्मक सम्बोधन ‘हे प्रभु’ से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के लिए δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: संदर्भ में वक्ता अपने पाप के सामने परमेश्वर के सही और धर्मपूर्ण होने को स्वीकार करता है। ‘धर्मी’ व्यापक नैतिक अर्थ को रखता है; ‘न्यायी’ में निहित न्यायिक बल को पादटिप्पणी में सुरक्षित किया गया है।
- issue: प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह इस्राएल के परमेश्वर को किया गया सीधा सम्बोधन है, इसलिए सामान्य सामाजिक उपाधि ‘स्वामी’ की अपेक्षा ‘प्रभु’ अधिक उपयुक्त है।
- issue: परमेश्वर के सम्बोधन में हिन्दी सर्वनाम
  choice: आप
  alternative: तू
  rationale: आधुनिक मानक हिन्दी में ‘आप’ श्रद्धापूर्ण और सामान्य पाठकों के लिए स्वाभाविक है; इससे यूनानी पाठ में निहित न होने वाली असम्मानजनक छाया से बचा जाता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। वाक्य का आरम्भ ‘क्योंकि’ से होना मूल यूनानी के कारणात्मक और प्रसंग-निर्भर स्वरूप को सुरक्षित रखता है। परमेश्वर के लिए श्रद्धापूर्ण बहुवचन ‘आप … हैं’ अपनाया गया है।
