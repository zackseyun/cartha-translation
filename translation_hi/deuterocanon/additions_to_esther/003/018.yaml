- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: उन्होंने अपने हाथ बढ़ा दिए हैं
  rationale: यूनानी में शब्दशः ‘उन्होंने अपने हाथ रख दिए’ है और वाक्यांश का लक्ष्य स्पष्ट नहीं किया गया। हिन्दी का ‘हाथ बढ़ाना’ आगे कार्रवाई करने का भाव देता है, जबकि उसकी वास्तविक प्रकृति को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: राष्ट्रीय अधीनता के संदर्भ में δουλεία का अनुवाद
  choice: दासता
  alternative: सेवकाई / पराधीनता
  rationale: प्रार्थना में गंभीर और विवश अधीनता का विलाप है। ‘दासता’ इस भार को बनाए रखती है और किसी बाद की विशिष्ट ऐतिहासिक व्यवस्था को अनावश्यक रूप से नहीं जोड़ती।
- issue: ἔθηκαν τὰς χεῖρας αὐτῶν में निहित शत्रुतापूर्ण कार्रवाई
  choice: हाथ बढ़ा दिए हैं, अर्थ को पादटिप्पणी में स्पष्ट करना
  alternative: हम पर हाथ डाल दिया है
  rationale: मूल यूनानी में कर्म अनुपस्थित है। मुख्य पाठ में ‘हम पर’ जोड़ने से अधिक स्पष्ट शत्रुतापूर्ण अर्थ तय हो जाता; चुना गया रूप मूल की अपूर्णता और संभावित अर्थ-तनाव को बेहतर सुरक्षित रखता है।
