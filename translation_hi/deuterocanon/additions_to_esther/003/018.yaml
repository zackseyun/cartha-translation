  choice: संतुष्ट नहीं हुए
  rationale: यह निष्क्रिय क्रिया यहाँ इस भाव को व्यक्त करती है कि पहले से जारी पीड़ा भी उनके लिए पर्याप्त नहीं थी; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐν πικρασμῷ
  choice: की कड़वाहट से
  rationale: πικρασμός का मूल भाव कड़वाहट या कड़वे व्यवहार का है। यह चयन व्याख्यात्मक रूप से केवल ‘उत्पीड़न’ कर देने के बजाय मूल रूपक को बनाए रखता है।
- source_word: δουλείας ἡμῶν
