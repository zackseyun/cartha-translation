lexical_decisions:
- source_word: ἐδεήθη
  choice: विनती की
  rationale: यह क्रिया साधारण प्रार्थना की सूचना नहीं, बल्कि गंभीर और आग्रहपूर्ण याचना व्यक्त करती है। ‘विनती की’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: Κυρίου
  choice: प्रभु से
  rationale: δέομαι के साथ सम्बन्ध हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त होता है। κύριος को प्रार्थना के इस संदर्भ में ‘प्रभु’ रखा गया है।
- source_word: μνημονεύων
  choice: स्मरण किया
  rationale: ग्रीक वर्तमान कृदन्त मुख्य क्रिया के साथ घटती क्रिया या उसकी रीति बताता है। हिन्दी में समन्वित क्रिया सहज है और यह खुला रखती है कि स्मरण मन में था या वाणी से।
- source_word: πάντα τὰ ἔργα
  choice: सभी कामों को
  rationale: ‘सभी’ व्यापकता को और ‘काम’ ἔργα के विस्तृत अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है; यहाँ आशय प्रभु के किए हुए कार्यों से है।
- source_word: Κυρίου
  choice: प्रभु के
  rationale: दूसरी आवृत्ति को हटाया नहीं गया, ताकि मूल यूनानी में ‘प्रभु’ की पुनरावृत्ति सुरक्षित रहे।
theological_decisions:
- issue: यूनानी प्रार्थना-भाषा में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: इस खंड में κύριος है; ‘प्रभु’ उसका सीधा, प्रचलित और धर्मशास्त्रीय तनाव को अनावश्यक रूप से निश्चित न करने वाला अनुवाद है। ‘यहोवा’ मूल में निहित पहचान को स्पष्ट करके अधिक निर्णायक होता, जबकि ‘स्वामी’ प्रार्थना-संदर्भ में अपेक्षित धार्मिक अर्थ को कमजोर कर सकता है।
- issue: μνημονεύων को मानसिक स्मरण या मुख से वर्णन मानना
  choice: स्मरण किया
  alternative: याद करते हुए सुनाया
  rationale: मूल कृदन्त यह निश्चित नहीं करता कि स्मरण केवल मन में था या प्रार्थना में मुखरित हुआ। ‘स्मरण किया’ इस अस्पष्टता को बनाए रखता है।
