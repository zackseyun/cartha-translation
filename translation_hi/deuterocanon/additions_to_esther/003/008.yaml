base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: hi
  text: और अब, हे प्रभु परमेश्वर, हे राजा, हे अब्राहम के परमेश्वर, अपने लोगों को बख्श दे, क्योंकि वे हमारा सर्वनाश करने के लिए हम पर नज़र लगाए हुए हैं[a] और उन्होंने तेरी उस विरासत को, जो आरम्भ से तेरी है, नष्ट करना चाहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे हमारे विनाश के लिए हम पर दृष्टि लगाए हुए हैं।” यूनानी अभिव्यक्ति संक्षिप्त है और हमारे विनाश की ओर लक्षित शत्रुतापूर्ण मंशा प्रकट करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो प्राचीन काल से तेरी है” अथवा “तेरी प्राचीन विरासत।”
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε ὁ θεὸς ὁ βασιλεὺς ὁ θεὸς Ἀβραάμ
  choice: हे प्रभु परमेश्वर, हे राजा, हे अब्राहम के परमेश्वर
  rationale: सम्बोधन में आए उपाधियों के क्रम और संचय को बनाए रखा गया है। अलग-अलग ‘हे’ हिन्दी में प्रार्थनापूर्ण सम्बोधन को स्पष्ट और स्वाभाविक बनाते हैं।
- source_word: φεῖσαι τοῦ λαοῦ σου
  choice: अपने लोगों को बख्श दे
  rationale: φεῖσαι विनाश से छोड़ देने या बख्श देने की विनती है। ‘दया कर’ अधिक व्यापक होता, जबकि ‘बख्श दे’ यहाँ क्रिया के सटीक बल को बनाए रखता है।
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: वे हमारा सर्वनाश करने के लिए हम पर नज़र लगाए हुए हैं
  rationale: यूनानी अभिव्यक्ति संक्षिप्त है और विनाश के उद्देश्य से की गई शत्रुतापूर्ण निगाह को व्यक्त करती है। यह हिन्दी उस आशय को स्वाभाविक रूप में रखती है, बिना उसे केवल योजना या आक्रमण में बदलने के।
- source_word: καταφθοράν
  choice: सर्वनाश
  rationale: यह प्रबल विनाश या बरबादी का बोध देता है। सामूहिक संहार के प्रसंग में ‘सर्वनाश’ भारयुक्त और सहज है।
- source_word: ἐπεθύμησαν ἀπολέσαι
  choice: उन्होंने ... नष्ट करना चाहा है
  rationale: इच्छा या प्रबल अभिलाषा और उसके विनाशकारी लक्ष्य—दोनों को रखा गया है; इसे ‘योजना बनाई’ कहकर आशय को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: तेरी उस विरासत ... जो आरम्भ से तेरी है
  rationale: κληρονομία के विरासत-रूपक को सुरक्षित रखा गया है। हिन्दी वाक्य-विन्यास से यह भी स्पष्ट होता है कि ‘आरम्भ से’ विरासत के परमेश्वर से सम्बन्धित होने का कालगत वर्णन है।
theological_decisions:
- issue: ‘तेरी विरासत’ का संकेत
  choice: विरासत के रूपक को बिना स्पष्ट व्याख्यात्मक प्रतिस्थापन के बनाए रखा गया
  alternative: इसे सीधे ‘तेरी प्रजा’ या पैतृक देश/वाचा की धरोहर कहना
  rationale: सन्दर्भ में यह सम्भवतः परमेश्वर की वाचागत प्रजा को दर्शाता है और ‘तेरे लोगों’ के समानान्तर है, पर मूल पाठ स्वयं ‘विरासत’ कहता है। इसलिए सम्भावित व्यापक अर्थ को खुला रखा गया है।
- issue: ἐξ ἀρχῆς का कालगत बल
  choice: आरम्भ से
  alternative: प्राचीन काल से; आदिकाल से
  rationale: मुख्य पाठ में मूल अभिव्यक्ति की पारदर्शिता रखी गई है। यह परम आरम्भ या बहुत प्राचीन समय—दोनों का संकेत दे सकती है; वैकल्पिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तेरी’ और आज्ञार्थक ‘दे’ हिन्दी बाइबलीय प्रार्थना की प्रचलित शैली के अनुरूप हैं। ‘प्रभु परमेश्वर’, ‘राजा’ और ‘अब्राहम के परमेश्वर’ की क्रमिक उपाधियाँ मूल यूनानी के गहन सम्बोधन को बनाए रखती हैं।
