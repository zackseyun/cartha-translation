- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: इस्राएल के उद्धार के लिए
  rationale: πρός उद्देश्य या लक्ष्य बताता है। σωτηρία यहाँ संकट से बचाव अथवा छुटकारे के अर्थ में है; ‘उद्धार’ उस अर्थ को बनाए रखता है और केवल पारिभाषिक धार्मिक अर्थ तक सीमित नहीं है।
theological_decisions:
