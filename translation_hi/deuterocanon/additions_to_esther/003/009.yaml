  text: Do not overlook your portion[a], which I redeemed for myself out of the land of Egypt.
translation:
  language: hi
  text: अपने भाग[a] की उपेक्षा न कर, जिसे तूने मिस्र देश से अपने लिए छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने हिस्से।’ ‘भाग’ यहाँ परमेश्वर की प्रजा के लिए रूपक हो सकता है।
    reason: ‘भाग’ के शाब्दिक विकल्प को देता है और संभावित वाचा-संबंधी संकेत को निश्चित अर्थ के रूप में थोपे बिना स्पष्ट करता है।
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: उपेक्षा न कर
  rationale: यह निषेधात्मक प्रयोग किसी को अनदेखा करने या उसकी सुधि न लेने का भाव रखता है। ‘उपेक्षा न कर’ प्रार्थना के प्रसंग में स्वाभाविक है और भाव को अनावश्यक रूप से तीखा नहीं बनाता।
- source_word: τὴν μερίδα σου
  choice: अपने भाग[a]
  rationale: μερίς का मूल अर्थ ‘भाग’ या ‘हिस्सा’ है। ‘भाग’ परमेश्वर की अपनी प्रजा होने के वाचा-संबंधी संकेत को बनाए रखता है, पर मुख्य पाठ में ‘विरासत’ या ‘प्रजा’ जोड़कर अर्थ को सीमित नहीं करता।
- source_word: ἣν
  choice: जिसे
  rationale: संबंधवाचक सर्वनाम का संबंध ‘भाग’ से है; हिन्दी में ‘जिसे’ उसी संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: σεαυτῷ
  choice: अपने लिए
  rationale: यह द्वितीय पुरुष का निजवाचक सर्वनाम है और संबोधित परमेश्वर की ओर संकेत करता है। ‘अपने लिए’ उसके द्वारा उस भाग को अपनी निज संपत्ति के रूप में छुड़ाने का भाव सुरक्षित रखता है।
- source_word: ἐλυτρώσω
  choice: तूने … छुड़ाया था
  rationale: ἐλυτρώσω यहाँ द्वितीय पुरुष एकवचन रूप है—‘तूने छुड़ाया/मोल लेकर मुक्त किया’—न कि ‘मैंने छुड़ाया।’ ‘छुड़ाया’ निर्गमन के उद्धारकारी भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ γῆς Αἰγύπτου
  choice: मिस्र देश से
  rationale: यह निर्गमन-संबंधी पारंपरिक अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी रूप है तथा γῆς को ‘देश’ द्वारा स्पष्ट रखता है।
theological_decisions:
- issue: μερίς में इस्राएल के परमेश्वर के निज भाग होने का वाचा-संबंधी संकेत
  choice: अपने भाग
  alternative: अपनी विरासत; अपनी प्रजा, जो तेरा निज भाग है
  rationale: यूनानी पाठ सीधे ‘तेरा भाग’ कहता है। यह संभवतः परमेश्वर की प्रजा की ओर संकेत करता है, पर ‘प्रजा’ पाठ में स्पष्ट नहीं है; इसलिए रूपक और उसकी धर्मवैचारिक गूँज दोनों को खुला रखा गया है।
- issue: σεαυτῷ और ἐλυτρώσω का कर्ता तथा निजवाचक बल
  choice: जिसे तूने … अपने लिए छुड़ाया था
  alternative: जिसे मैंने अपने लिए छुड़ाया था
  rationale: ἐλυτρώσω और σεαυτῷ दोनों द्वितीय पुरुष एकवचन के अनुरूप हैं। प्रार्थना में वक्ता परमेश्वर को संबोधित कर रहा है, इसलिए ‘तूने … अपने लिए’ यूनानी व्याकरण को सुरक्षित रखता है; अंग्रेज़ी परामर्श-पाठ का ‘I redeemed for myself’ स्रोत से मेल नहीं खाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-भाषा अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल यूनानी के सीधे संबोधन और हिन्दी की पारंपरिक भक्तिपरक शैली के अनुरूप है। वाक्य को सहज बनाने के लिए हिन्दी का सामान्य संबंधवाचक क्रम रखा गया है।
