base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: hi
  text: मैंने जन्म से ही मेरे पैतृक कुल के गोत्र में यह सुना था कि हे प्रभु, आपने इस्राएल को सभी राष्ट्रों में से और हमारे पुरखाओं को उनके सभी पूर्वजों में से सदा की विरासत के रूप में ग्रहण किया, और उनके लिए वह किया जो आपने कहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “उनके लिए अपनी कही हुई बात पूरी की।” यूनानी में अधिक शाब्दिक रूप से है, “उनके लिए वह किया जो आपने कहा था।”
    reason: अंतिम उपवाक्य का अधिक भावानुवादी विकल्प देते हुए मूल यूनानी की शाब्दिक संरचना स्पष्ट करना।
lexical_decisions:
- source_word: ἐγὼ ἤκουον
  choice: मैंने ... सुन रखा है
  rationale: यूनानी अपूर्ण भूतकाल यहाँ बचपन से मिली और स्मरण में बनी परंपरा को व्यक्त करता है; ‘सुन रखा है’ आधुनिक हिन्दी में इस स्थायी प्राप्त ज्ञान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ γενετῆς μου
  choice: जन्म से ही
  rationale: γενετή का अर्थ यहाँ जन्म या उत्पत्ति है; ‘जन्म से ही’ समयगत अर्थ को स्पष्ट और सहज रखता है।
- source_word: ἐν φυλῇ πατριάς μου
  choice: अपने पैतृक घराने के गोत्र में
  rationale: φυλή के गोत्र/जनजातीय समूह और πατριά के पैतृक घराने अथवा कुल—दोनों संबंधसूचक पक्षों को बनाए रखा गया है।
- source_word: σύ, Κύριε
  choice: हे प्रभु, आपने
  rationale: सम्बोधन का बल ‘हे प्रभु’ से स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἔλαβες
  choice: ग्रहण किया
  rationale: λαμβάνω का मूल भाव ‘लेना’ है; विरासत के संदर्भ में ‘ग्रहण किया’ चयन या अपना लेने का संकेत देता है, पर ‘चुना’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐκ πάντων τῶν ἐθνῶν
  choice: सब जातियों में से
  rationale: ἐκ चयन के स्रोत को और ἔθνη विभिन्न जातियों/राष्ट्रों को दर्शाता है; ‘जातियों में से’ धार्मिक पहचान को ‘अन्यजातियों’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: τοὺς πατέρας ἡμῶν
  choice: हमारे पुरखाओं
  rationale: पुरुषवाची πατέρες को ‘पुरखाओं’ से रखा गया है, जो आधुनिक हिन्दी में आदरसूचक और स्वाभाविक है।
- source_word: ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: उनके सभी पूर्वजों में से
  rationale: πρόγονοι पूर्वजों को दर्शाता है और αὐτῶν का निकटतम व्याकरणिक संबंध ‘हमारे पुरखाओं’ से है; इस असामान्य लेकिन वास्तविक संरचना को नहीं मिटाया गया।
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: सदा की विरासत के रूप में
  rationale: κληρονομία का विरासत/अधिकार का भाव और αἰώνιος की स्थायी अवधि दोनों सुरक्षित हैं।
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: उनके लिए वह किया जो आपने कहा था
  rationale: यह यूनानी की ‘किया ... जो कहा’ संरचना के निकट है और हिन्दी में समझने योग्य है; ‘प्रतिज्ञा पूरी की’ संभावित अर्थ है, पर वह मूल से अधिक स्पष्ट व्याख्या होगी।
theological_decisions:
- issue: εἰς κληρονομίαν αἰώνιον में वाचा और विरासत की भाषा
  choice: ‘सदा की विरासत के रूप में’
  alternative: ‘सदा के लिए अपनी संपत्ति के रूप में’
  rationale: यह अनुवाद परमेश्वर द्वारा इस्राएल और पुरखाओं को ग्रहण करने की वाचागत छवि बनाए रखता है, पर ‘संपत्ति’ जैसे शब्द से उनके संबंध की धर्मवैज्ञानिक प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: ἐποίησας ... ὅσα ἐλάλησας में कथन और पूर्ति का संबंध
  choice: ‘वह किया जो आपने कहा था’
  alternative: ‘जो आपने कहा था, उसे उनके लिए पूरा किया’
  rationale: मूल पाठ स्पष्ट रूप से करने और कहने को जोड़ता है, लेकिन ‘प्रतिज्ञा’ शब्द नहीं प्रयोग करता। मुख्य पाठ उसी तनाव को रखता है; अधिक व्याख्यात्मक विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे प्रभु’ सम्बोधन को स्पष्ट करता है; ‘गोत्र’, ‘पुरखा’ और ‘विरासत’ बाइबलीय-सांस्कृतिक संदर्भ बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
