  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ‘स्मरण कर’ और ‘हे प्रभु’ बाइबलीय सम्बोधन की संक्षिप्तता बनाए रखते हैं; ‘मुझे साहस दे’ सामान्य पाठक के लिए सहज है। मूल के धर्मवैज्ञानिक तनाव और γνώρισθητι की वाच्यगत अस्पष्टता को मिटाने के बजाय पादटिप्पणियों में स्पष्ट किया गया है।
