base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/022.yaml
  text: Remember[a], Lord; make yourself known in the time of our affliction, and encourage me[b], O King of the gods and ruler over every authority.
translation:
  language: hi
  text: हे प्रभु, स्मरण कर; हमारे संकट के समय अपने आपको प्रकट कर[a], और मुझे साहस दे, हे देवताओं के राजा[b] और हर सत्ता पर प्रभुता रखने वाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्ञात हो” अथवा “अपने आपको ज्ञात करा।” यूनानी क्रिया का रूप निष्क्रिय है, पर यहाँ वह परमेश्वर के स्वयं को प्रकट करने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “देवताओं के राजा।” यह पद सभी कथित देवताओं या दिव्य शक्तियों पर प्रभु की सर्वोच्चता व्यक्त करता है।
    reason: theological_tension
lexical_decisions:
- source_word: μνήσθητι
  choice: स्मरण कर
  rationale: प्रार्थना में प्रयुक्त यूनानी आज्ञार्थक का सीधा और गरिमापूर्ण हिन्दी रूप; मूल में कर्म व्यक्त नहीं है, इसलिए अनुवाद में भी उसे नहीं जोड़ा गया।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन में प्रयुक्त κύριος का स्वाभाविक और प्रचलित दिव्य पदनाम।
- source_word: γνώρισθητι
  choice: अपने आपको प्रकट कर
  rationale: निष्क्रिय रूप यहाँ प्रार्थना में आत्मप्रकाशन या स्वयं को ज्ञात कराने की विनती व्यक्त कर सकता है; यह हिन्दी में अर्थ को सहज रखते हुए रूपगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: हमारे संकट के समय
  rationale: καιρός के समय-सूचक भाव और θλῖψις की विपत्ति/दबाव की धारणा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμὲ θάρσυνον
  choice: मुझे साहस दे
  rationale: θαρσύνω का अर्थ साहसी बनाना या हौसला देना है; ‘मुझे साहस दे’ स्पष्ट और प्रार्थना के प्रसंग में स्वाभाविक है।
- source_word: Βασιλεῦ τῶν θεῶν
  choice: हे देवताओं के राजा
  rationale: यूनानी पदबंध को जानबूझकर सीधा रखा गया है, ताकि उसकी प्रबल और संभावित रूप से असुविधाजनक अभिव्यक्ति को धर्मवैज्ञानिक रूप से नरम न किया जाए।
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: हर सत्ता पर प्रभुता रखनेवाले
  rationale: ἐπικρατῶν वर्तमान कृदन्त है और सम्बोधित राजा का वर्णन करता है; ἀρχή के ‘सत्ता/अधिकार’ भाव को व्यापक रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: τῶν θεῶν में परमेश्वर का ‘देवताओं का राजा’ कहलाना
  choice: देवताओं के राजा
  alternative: देवताओं से ऊपर राजा; समस्त दिव्य शक्तियों के राजा
  rationale: मूल यूनानी स्पष्ट रूप से ‘देवताओं के राजा’ कहता है। इसे बदलकर धर्मवैज्ञानिक तनाव मिटाना उचित नहीं; प्रसंग में यह सभी कथित देवताओं या दिव्य शक्तियों पर प्रभु की सर्वोच्चता व्यक्त करता है।
- issue: γνώρισθητι का वाच्य और भाव
  choice: अपने आपको प्रकट कर
  alternative: ज्ञात हो जा; अपने आपको जनवा दे
  rationale: व्याकरणिक रूप निष्क्रिय है, पर प्रार्थना में इसका भाव परमेश्वर से स्वयं को प्रकट करने की विनती हो सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और वैकल्पिक रूप पादटिप्पणी में रखता है।
- issue: ἐπικρατῶν का सम्बन्ध
  choice: 'राजा को विशेषित करने वाला कृदन्त: ‘हर सत्ता पर प्रभुता रखनेवाले’'
  alternative: ‘हर सत्ता के शासक’ के रूप में दूसरा समानान्तर पदनाम
  rationale: यूनानी कृदन्त सम्बोधित ‘राजा’ का वर्णन करता है। हिन्दी में कृदन्तीय संरचना इस व्याकरणिक सम्बन्ध को स्पष्ट रखती है और अनावश्यक दूसरा संज्ञापद नहीं बनाती।
