  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: hi
  text: और उसने कहा, “हे प्रभु, हे प्रभु, समस्त शक्तियों के राजा[a], क्योंकि सब कुछ आपके अधिकार में है; और जब आप इस्राएल को बचाना चाहते हैं, तब कोई आपका विरोध नहीं कर सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समस्त प्रभुत्वों के राजा।” यूनानी पद केवल राजनीतिक राज्यों को नहीं, बल्कि सामर्थ्य या शासन के सभी रूपों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε, κύριε
  choice: हे प्रभु, हे प्रभु
  rationale: प्रार्थना में प्रयुक्त संबोधन और यूनानी पाठ की पुनरुक्ति दोनों सुरक्षित रखी गई हैं; हिन्दी में ‘हे’ संबोधन को स्वाभाविक और श्रद्धापूर्ण बनाता है।
- source_word: βασιλεῦ πάντων κρατῶν
  choice: समस्त शक्तियों के राजा
  rationale: κρατῶν सामर्थ्य, सत्ता अथवा प्रभुत्व के विभिन्न रूपों को समेट सकता है। ‘शक्तियों’ इसकी व्यापकता को केवल सांसारिक राज्यों तक सीमित नहीं करता।
- source_word: ἐν ἐξουσίᾳ σου
  choice: आपके अधिकार में
  rationale: ἐξουσία यहाँ केवल क्षमता नहीं, सार्वभौम अधिकार भी व्यक्त करता है; राजकीय संदर्भ में ‘अधिकार’ इस अर्थ को सुरक्षित रखता है।
- source_word: τὸ πᾶν
  choice: सब कुछ
  rationale: यह यूनानी समग्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀντιδρῶσων σοι
  choice: कोई आपका विरोध नहीं कर सकता
  rationale: भविष्यत्कालिक कृदंत प्रभावी प्रतिरोध की असंभवता बताता है; ‘कर सकता’ प्रसंग में इसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν τῷ θέλειν σε
  choice: जब आप ... चाहते हैं
  rationale: ἐν के साथ संज्ञीकृत infinitive यहाँ कालगत/परिस्थितिगत अर्थ देता है; यह अनुवाद इच्छा अथवा संकल्प के भाव को बिना अधिक व्याख्या के रखता है।
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: इस्राएल को बचाना
  rationale: σῴζω का सीधा अर्थ ‘बचाना’ या ‘छुड़ाना’ है; प्रार्थना के इस प्रसंग में ‘बचाना’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: Κύριε, κύριε में परमेश्वर को दोहरा संबोधन
  choice: हे प्रभु, हे प्रभु
  alternative: प्रभु, प्रभु; हे प्रभु, मेरे प्रभु
  rationale: मूल पाठ की पुनरुक्ति को उसके आग्रह और श्रद्धा सहित रखा गया है; ऐसा कोई स्वामित्वसूचक शब्द नहीं जोड़ा गया जो यूनानी में नहीं है।
- issue: κρατῶν का व्यापक आशय
  choice: समस्त शक्तियों
  alternative: समस्त प्रभुत्वों; सभी सत्ताओं
  rationale: यह चयन परमेश्वर की सार्वभौमता को केवल राजनीतिक राज्यों तक सीमित किए बिना मूल की अर्थगत व्यापकता बनाए रखता है।
- issue: ἐξουσίᾳ में अधिकार और सामर्थ्य का संबंध
  choice: अधिकार
  alternative: सामर्थ्य; शक्ति
  rationale: राजा के संबोधन के बाद ‘अधिकार’ सार्वभौम शासन के भाव को प्रमुखता देता है, जबकि सामर्थ्य का आशय प्रसंग से बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में श्रद्धापूर्ण, प्रार्थनामय शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य-विन्यास सहज रखा गया है, जबकि दोहरे संबोधन और मूल की सार्वभौमता-संबंधी व्यापकता को सुरक्षित रखा गया है।
