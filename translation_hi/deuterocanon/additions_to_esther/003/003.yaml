- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: आकाश और पृथ्वी
  rationale: यह समस्त सृष्टि को समेटने वाली परिचित युग्म-अभिव्यक्ति है और हिन्दी में स्वाभाविक है।
- source_word: πᾶν θαυμαζόμενον
  choice: हर अद्भुत वस्तु
  rationale: नपुंसकलिंग एकवचन participle का भाव ऐसी प्रत्येक वस्तु से है जो विस्मयकारी है या जिस पर आश्चर्य किया जाता है। ‘हर अद्भुत वस्तु’ इसके वितरणात्मक और वस्तुगत दोनों भावों को बनाए रखता है।
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: आकाश के नीचे की
  rationale: यूनानी अभिव्यक्ति आकाश के नीचे के जगत को सूचित करती है। हिन्दी में विशेषणात्मक ‘आकाश के नीचे की’ अगले पद से सहज रूप से जुड़ती है।
