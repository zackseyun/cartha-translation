- source_word: ὅτι
  choice: क्योंकि
  rationale: प्रार्थना के संदर्भ में यह पिछले कथन का कारण बताता है; ‘क्योंकि’ इसके कारणवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐποίησας
