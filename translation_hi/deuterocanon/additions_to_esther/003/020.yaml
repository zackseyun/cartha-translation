  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
translation:
  language: hi
  text: और व्यर्थ वस्तुओं की प्रशंसा करने के लिए राष्ट्रों का मुँह खोलना,[a] और देह से बने एक राजा को सदा विस्मय से देखा जाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “व्यर्थ वस्तुओं की उत्कृष्टताओं की ओर।” इसका अर्थ “व्यर्थताओं की प्रशंसा” भी हो सकता है; संदर्भ में व्यर्थ मूर्तियाँ भी अभिप्रेत हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: “देह से बने राजा” का अर्थ “नश्वर राजा” या “मात्र मनुष्य राजा” भी हो सकता है। यूनानी में शाब्दिक रूप से, “मांस/देह का राजा” है।
    reason: lexical_alternative
