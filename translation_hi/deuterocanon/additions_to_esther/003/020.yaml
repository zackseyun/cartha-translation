- source_word: ἀνοῖξαι στόμα
  choice: मुँह खोलना
  rationale: यूनानी मुहावरे की सजीव छवि को बनाए रखते हुए बोलने या प्रशंसा करने का अवसर दिए जाने का भाव व्यक्त करता है।
- source_word: ἐθνῶν
  choice: राष्ट्रों का
