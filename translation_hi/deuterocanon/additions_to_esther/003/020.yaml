- source_word: ἀρετὰς
  choice: प्रशंसा
  rationale: मूलतः ‘उत्कृष्टताएँ’ भी हो सकता है, पर यहाँ व्यर्थ वस्तुओं को गुणवान बताने या उनकी प्रशंसा करने की वाक्पटु शक्ति प्रमुख है।
- source_word: ματαίων
  choice: व्यर्थ वस्तुओं
  rationale: विशेषण के संज्ञात्मक प्रयोग और उसके व्यर्थता/खोखलेपन के मूल अर्थ को सुरक्षित रखता है, बिना ‘मूर्तियाँ’ को मुख्य पाठ में स्पष्ट रूप से जोड़ने के।
- source_word: θαυμασθῆναι
  choice: आश्चर्य किया जाना
  rationale: निष्क्रिय क्रिया के ‘विस्मय या प्रशंसापूर्ण आश्चर्य का विषय होना’ अर्थ को रखता है; ‘पूजा किया जाना’ मूल से अधिक प्रबल होता।
- source_word: βασιλέα σάρκινον
  choice: एक देहधारी राजा
  rationale: ‘मांस/देह से बना’ मानव राजा और परमेश्वर के बीच निहित विरोध को स्वाभाविक हिन्दी में बनाए रखता है; इसका अर्थ केवल मानव या नश्वर राजा भी समझा जा सकता है।
- source_word: εἰς αἰῶνα
  choice: सदा
  rationale: स्थायी या अनंत काल तक सम्मानित किए जाने का भाव संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या ματαίων को स्पष्ट मूर्तिपूजात्मक अर्थ में प्रस्तुत किया जाए
  choice: व्यर्थ वस्तुओं
  alternative: व्यर्थ मूर्तियों / व्यर्थताओं
  rationale: संदर्भ मूर्तिपूजात्मक प्रशंसा का संकेत देता है, किंतु यूनानी शब्द स्वयं अधिक व्यापक और अस्पष्ट है। मुख्य पाठ उस व्यापकता को रखता है और पादटिप्पणी संभावित मूर्तिपूजात्मक संदर्भ बताती है।
- issue: σάρκινον द्वारा मानव और दिव्य राजत्व के विरोध को कैसे व्यक्त किया जाए
  choice: देहधारी राजा
  alternative: नश्वर राजा / मात्र मनुष्य राजा / देह का राजा
  rationale: मूल की ठोस ‘देह’ भाषा को स्वाभाविक हिन्दी में बनाए रखा गया है और उसे सीधे ‘नश्वर’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- issue: θαυμασθῆναι में सम्मान और उपासना की सीमा
  choice: आश्चर्य किया जाना
  alternative: सराहा जाना / विस्मय से देखा जाना / पूजा जाना
  rationale: यूनानी क्रिया विस्मय और प्रशंसा व्यक्त करती है; संदर्भ उपासना-जैसे सम्मान की ओर संकेत कर सकता है, पर मुख्य पाठ में ‘पूजा’ कहना अर्थ को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना-संदर्भ के अनुरूप रखी गई है। अनंत क्रियाओं की मूल शृंखला को हिन्दी में संज्ञार्थक क्रिया-रूपों से रखा गया है। मुख्य पाठ में यूनानी की वास्तविक अस्पष्टता सुरक्षित है; पादटिप्पणियाँ अधिक शाब्दिक और संदर्भगत विकल्प देती हैं।
