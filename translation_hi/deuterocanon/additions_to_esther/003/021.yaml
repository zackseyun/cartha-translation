base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: hi
  text: हे प्रभु, अपना राजदण्ड उन्हें न सौंपें जो अस्तित्व में नहीं हैं[a], और उन्हें हमारे पतन पर हँसने न दें। बल्कि उनकी योजना को उन्हीं के विरुद्ध फेर दें, और जिसने हमारे विरुद्ध पहल की है, उसे सार्वजनिक रूप से उदाहरण बना दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ भी नहीं हैं” अथवा “नगण्य लोग।” यूनानी में शाब्दिक रूप से “जो अस्तित्व में नहीं हैं” है।
    reason: τοῖς μὴ οὖσιν की असामान्य शाब्दिक अभिव्यक्ति और उसके सम्भव तिरस्कारपूर्ण अर्थ को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: हाथ में न सौंप
  rationale: παραδίδωμι किसी वस्तु या अधिकार को दूसरे के वश में सौंपने का भाव रखता है; हिन्दी में यह प्रयोग स्वाभाविक है और नियंत्रण हस्तांतरित करने की शक्ति बनाए रखता है।
- source_word: τὸ σκῆπρόν σου
  choice: अपना राजदण्ड
  rationale: σκῆπτρον राजकीय अधिकार के दृश्य चिह्न, राजदण्ड, को दर्शाता है। अमूर्त ‘शासन’ के बजाय मूल बिम्ब सुरक्षित रखा गया है।
- source_word: τοῖς μὴ οὖσιν
  choice: उन लोगों के हाथ में ... जो अस्तित्व में नहीं हैं
  rationale: यूनानी का शाब्दिक अर्थ ‘जो हैं नहीं’ है। यह विरोधियों की नगण्यता अथवा अवास्तविकता का तीखा कथन हो सकता है; मुख्य पाठ इसकी जानबूझकर बनी हुई असामान्यता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- source_word: μὴ καταγελασάτωσαν ἐν τῇ πτώσει ἡμῶν
  choice: हमारे पतन पर उन्हें हमारा उपहास न करने दे
  rationale: καταγελάω उपहासपूर्वक हँसने या ठट्ठा करने और πτῶσις पतन को व्यक्त करता है। यह अनुवाद सामुदायिक विनाश पर शत्रुओं के तिरस्कारपूर्ण उल्लास को स्पष्ट करता है।
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: उनकी योजना को उन्हीं के विरुद्ध फेर दे
  rationale: βουλή यहाँ शत्रुतापूर्ण योजना या मंसूबे के अर्थ में है, और στρέφω उसी योजना को उसके रचने वालों पर पलट देने का भाव देता है।
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: जिसने हमारे विरुद्ध यह आरम्भ किया
  rationale: ἀρξάμενον का मूल अर्थ ‘जिसने आरम्भ किया’ है। मूल में कर्म निहित है; ‘यह’ पिछले संदर्भ की शत्रुतापूर्ण योजना की ओर संकेत करता है और ‘हमारे विरुद्ध’ ἐφʼ ἡμᾶς को सीधे रखता है।
- source_word: παραδειγμάτισον
  choice: उसे सबके सामने दण्ड का उदाहरण बना दे
  rationale: παραδειγματίζω सार्वजनिक रूप से प्रकट, अपमानित या दण्ड का उदाहरण बनाने का भाव रखता है। इस शापात्मक प्रार्थना में यह हिन्दी वाक्य सार्वजनिक और चेतावनीकारी न्याय का अर्थ व्यक्त करता है, पर दण्ड की विधि निर्धारित नहीं करता।
theological_decisions:
- issue: τοῖς μὴ οὖσιν का आशय
  choice: जो अस्तित्व में नहीं हैं
  alternative: जो कुछ भी नहीं हैं / नगण्य लोग
  rationale: यह अत्यन्त तीखा यूनानी वाक्यांश विरोधियों को नगण्य ठहरा सकता है और मूर्तिपूजक अवास्तविकता की ओर भी संकेत कर सकता है। किसी एक व्याख्या को आरोपित करने के बजाय शाब्दिक तनाव मुख्य पाठ में रखा गया है और सहज विकल्प पादटिप्पणी में दिए गए हैं।
- issue: παραδειγμάτισον में न्याय का स्वरूप
  choice: सबके सामने दण्ड का उदाहरण बना दे
  alternative: सार्वजनिक रूप से अपमानित कर / चेतावनी का उदाहरण बना
  rationale: क्रिया सार्वजनिक प्रदर्शन और दण्डात्मक अपमान दोनों की गुंजाइश रखती है। अनुवाद चेतावनीकारी सार्वजनिक न्याय को व्यक्त करता है, पर उसकी विशिष्ट रीति नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक और गरिमापूर्ण स्वर रखा गया है। ‘राजदण्ड’ मूल राजकीय बिम्ब को बचाता है। संबोधन में सम्मानसूचक एकवचन क्रियारूप प्रयुक्त हैं। ‘जो अस्तित्व में नहीं हैं’ जानबूझकर असामान्य रखा गया है, क्योंकि मूल यूनानी भी उतना ही तीखा और धर्मवैचारिक रूप से खुला हुआ है।
