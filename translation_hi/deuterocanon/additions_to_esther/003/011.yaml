  rationale: यह संक्षिप्त पद संघर्ष, घोर व्यथा और आसन्न मृत्यु—इन जुड़े हुए भावों को व्यक्त करता है। ‘मृत्यु-संघर्ष’ मूल संघर्ष-बिंब और संबंधवाचक θανάτου की संक्षिप्तता को बनाए रखता है।
- source_word: κατειλημμένη
  choice: जकड़ी हुई
  rationale: निष्क्रिय कृदंत किसी दशा द्वारा पकड़ लिए जाने या उसके वश में होने का तीव्र भाव देता है; ‘जकड़ी हुई’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
