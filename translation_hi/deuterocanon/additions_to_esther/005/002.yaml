lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में सामान्य मानवीय प्रवृत्ति का उल्लेख करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: अत्यधिक भलाई के कारण
  rationale: सम्बन्धकारक दत्तिवाचक पद सम्मान पाने के साधन या आधार को व्यक्त करता है। ‘अत्यधिक’ πλείστῃ की तीव्रता और ‘भलाई’ χρηστότης के सद्भावपूर्ण उपकार को दर्शाता है।
- source_word: τῶν εὐεργετούντων
  choice: अपने उपकार करनेवालों की
  rationale: कृदन्त उन लोगों को सूचित करता है जो इनके साथ भलाई करते हैं। यह रूप ‘हितैषियों’ या औपचारिक ‘उपकारकों’ की अपेक्षा अधिक सहज है।
- source_word: πυκνότερον τιμώμενοι
  choice: जितना अधिक सम्मान पाते गए
  rationale: πυκνότερον का मूल भाव अधिक बार या अधिकाधिक है; तुलनात्मक वाक्य-संरचना में ‘जितना अधिक ... उतना ही’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: μεῖζον ἐφρόνησαν
  choice: उतना ही अपने आपको बड़ा समझने लगे
  rationale: यूनानी मुहावरा शाब्दिक रूप से ‘बड़ी बातें सोचने’ या स्वयं को ऊँचा मानने का संकेत देता है। यह अनुवाद मूल रूपक और उसके घमंडपूर्ण आशय दोनों को बनाए रखता है।
