  yaml_path: translation/deuterocanon/additions_to_esther/005/011.yaml
  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: hi
  text: उसने सभी राष्ट्रों के प्रति हमारी ऐसी सद्भावना प्राप्त की कि उसे हमारा पिता घोषित किया जाता है और सब उसके आगे झुकते हैं[a]; वह राजसिंहासन के बाद दूसरे स्थान पर बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अधिक शाब्दिक अर्थ, ‘सब उसके आगे दंडवत करते हैं,’ भी हो सकता है। प्रसंग में यह किसी उच्चाधिकारी को दी जाने वाली श्रद्धांजलि सूचित कर सकती है, यद्यपि यह क्रिया आराधना के अर्थ में भी प्रयुक्त होती है।
    reason: προσκυνέω में शारीरिक दंडवत, राजकीय श्रद्धांजलि, और आराधना की अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔτυχεν ἧς ἔχομεν ... φιλανθρωπίας
  choice: उसने ... हमारी सद्भावना का ... लाभ पाया
  rationale: ἔτυχεν का कर्ता प्रसंगानुसार वही पुरुष है, न कि प्रथम पुरुष बहुवचन ‘हम’। जननवाचक संबंध के साथ यह वाक्यांश उस राजकीय सद्भावना अथवा कृपा को प्राप्त करने का भाव देता है।
- source_word: πρὸς πᾶν ἔθνος
  choice: हर जाति के प्रति
  rationale: ἔθνος यहाँ साम्राज्य के अंतर्गत जातियों अथवा जनसमुदायों को सूचित करता है; ‘हर जाति’ आधुनिक हिन्दी में राजनीतिक-सामुदायिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: इतना ... कि
  rationale: यह परिणाम बताने वाली यूनानी संरचना है; हिन्दी की ‘इतना ... कि’ संरचना उसी संबंध को स्वाभाविक ढंग से रखती है।
- source_word: ἀναγορεύεσθαι ... πατέρα
  choice: पिता घोषित किया गया
  rationale: ἀναγορεύεσθαι सार्वजनिक या औपचारिक घोषणा का बोध देता है और πατέρα के वास्तविक पारिवारिक-राजकीय रूपक ‘पिता’ को बनाए रखा गया है।
- source_word: προσκυνούμενον ὑπὸ πάντων
  choice: सब उसके सामने झुकते थे
  rationale: यह राजदरबार में किसी उच्चाधिकारी के सामने शारीरिक रूप से झुकने या दंडवत सम्मान करने का अर्थ दे सकता है। इस चयन में केवल सामान्य ‘सम्मान’ की अपेक्षा मूल क्रिया का देहगत भाव अधिक स्पष्ट रहता है, जबकि उसकी अर्थ-सीमा पाद-टिप्पणी में दी गई है।
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: राजसिंहासन के बाद दूसरे स्थान पर
  rationale: शाब्दिक यूनानी वाक्यांश ‘राजकीय सिंहासन का दूसरा व्यक्ति/मुख’ पदक्रम का सूचक है। हिन्दी में यह रूप उप-राजकीय दर्जे को स्पष्ट करता है, बिना कोई विशिष्ट पदनाम जोड़ने के।
- source_word: διατελεῖν
  choice: बना रहा
  rationale: क्रिया की निरंतरता और स्थायी स्थिति को हिन्दी में ‘बना रहा’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: राजकीय प्रसंग में προσκυνούμενον का अर्थ
  choice: सब उसके सामने झुकते थे
  alternative: सब उसकी आराधना करते थे / सब उसे सम्मान देते थे
  rationale: मूल क्रिया शारीरिक दंडवत, किसी श्रेष्ठ व्यक्ति को दी गई राजकीय श्रद्धांजलि, अथवा धार्मिक आराधना तक का अर्थ ले सकती है। इस दरबारी प्रसंग में झुककर सम्मान देना अधिक संभावित है, पर धार्मिक अर्थ की भाषिक संभावना को पाद-टिप्पणी में खुला रखा गया है।
