  register: भाषा आधुनिक, सहज और राजकीय गरिमा वाली रखी गई है। मूल यूनानी में कर्ता तीसरे पुरुष का है, इसलिए अंग्रेज़ी परामर्श-पाठ के ‘हमने प्राप्त की’ के स्थान पर ‘उसने ... लाभ पाया’ अपनाया गया है। ‘राजसिंहासन के बाद दूसरे स्थान पर’ पदक्रम को स्पष्ट करता है और अस्वाभाविक शाब्दिक ‘दूसरा व्यक्ति’ से बचता है।
