translation:
  language: hi
  text: ताकि अब और इसके बाद भी हमारा और हमारे प्रति सद्भाव रखने वाले फ़ारसियों का छुटकारा हो[a], पर हमारे विरुद्ध षड्यंत्र रचने वालों के लिए विनाश का स्मारक हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार’। यूनानी σωτηρία में ‘उद्धार’ और संकट से ठोस ‘छुटकारे’—दोनों का भाव हो सकता है; यहाँ प्रसंग मुख्यतः संकट से रक्षा का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘विनाश की स्मृति’ अथवा ‘उनके विनाश की याद दिलाने वाला चिह्न’। यूनानी अभिव्यक्ति संक्षिप्त है और षड्यंत्र रचने वालों के पतन के स्थायी स्मरण को सूचित कर सकती है।
    reason: lexical_alternative
