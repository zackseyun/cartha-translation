  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अर्थगर्भित है। चुना हुआ रूप यह स्पष्ट किए बिना उसकी गंभीरता और अस्पष्टता बचाता है कि स्मारक किस रूप में होगा या विनाश को व्याकरणतः किसके साथ जोड़ा जाए।
