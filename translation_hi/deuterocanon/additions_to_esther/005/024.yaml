  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: hi
  text: पर हर नगर या प्रदेश, पूरा का पूरा, जो इन आदेशों के अनुसार कार्य न करे, क्रोधपूर्वक भाले और आग से भस्म कर दिया जाएगा[a]; वह न केवल मनुष्यों के लिए अगम्य, बल्कि जंगली पशुओं और पक्षियों के लिए भी सदा के लिए अत्यन्त घृणित बना दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘भाले और आग से’ है; कुछ अनुवाद ‘भाले’ के स्थान पर अधिक सामान्य अर्थ में ‘तलवार’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... πόλις ἢ χώρα τὸ σύνολον
  choice: हर नगर या पूरा प्रदेश
  rationale: यह पदबंध प्रत्येक नगर या प्रदेश को समग्र रूप में सम्मिलित करता है। ‘पूरा प्रदेश’ τὸ σύνολον की संपूर्णता पर दी गई विशेष बलाघात को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: इन आदेशों के अनुसार कार्य न करे
  rationale: संदर्भ राजकीय आज्ञाओं का है; इसलिए सामान्य ‘इन बातों’ के स्थान पर ‘इन आदेशों’ से आशय स्पष्ट होता है, जबकि ποιέω का कार्यान्वयन-संबंधी भाव भी सुरक्षित रहता है।
- source_word: δόρατι καὶ πυρὶ
  choice: भाले और आग से
  rationale: δόρυ का सीधा अर्थ ‘भाला’ है। इसे परंपरागत किंतु कम सटीक ‘तलवार’ से सामान्यीकृत नहीं किया गया।
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: क्रोधपूर्वक ... भस्म कर दिया जाएगा
  rationale: καταναλίσκω के नष्ट या भस्म कर देने के प्रबल भाव और μετʼ ὀργῆς में दंड के साथ जुड़े क्रोध—दोनों को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἄβατος
  choice: अगम्य
  rationale: यह किसी स्थान के भीतर न जा सकने या उसे पार न कर सकने का अर्थ देता है। ‘अगम्य’ विनाश के बाद दुर्गम बने स्थान की गंभीर छवि बनाए रखता है।
- source_word: ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: यूनानी बहुवचन यहाँ समस्त मानवों के लिए सामान्य अर्थ में है; ‘मनुष्यों’ से वही व्यापक आशय स्वाभाविक और सटीक रूप में आता है।
- source_word: θηρίοις καὶ πετεινοῖς
  choice: जंगली पशुओं और पक्षियों के लिए
  rationale: θηρία जंगली पशुओं और πετεινά उड़ने वाले जीवों, विशेषतः पक्षियों, को दर्शाते हैं।
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: सदा के लिए
  rationale: यह पदबंध अनवरत और स्थायी अवधि व्यक्त करता है; ‘सदा के लिए’ उसका गंभीर कालगत बल बनाए रखता है।
- source_word: ἔχθιστος κατασταθήσεται
  choice: अत्यन्त घृणित बना दिया जाएगा
  rationale: ἔχθιστος के अतिशयोक्तिपूर्ण ‘सबसे घृणित/अत्यन्त घृणित’ भाव और κατασταθήσεται के निष्क्रिय ‘बना दिया जाएगा’—दोनों को संरक्षित किया गया है।
theological_decisions:
- issue: ἀνθρώποις का सामान्य मानव-सूचक अर्थ
  choice: मनुष्यों के लिए
  alternative: लोगों के लिए
  rationale: स्रोत का शब्द यहाँ किसी विशेष लिंग तक सीमित नहीं, बल्कि मानवों को जंगली पशुओं और पक्षियों से अलग वर्ग के रूप में रखता है। ‘मनुष्यों’ से यह तुलना स्पष्ट रहती है।
- issue: δόρατι में विनाश का शस्त्र
  choice: भाले
  alternative: तलवार
  rationale: यूनानी पाठ विशेष रूप से ‘भाला’ कहता है। व्यापक युद्ध-संबंधी अर्थ मानकर इसे ‘तलवार’ करना स्रोत की विशिष्ट छवि को बदल देता।
- issue: ἔχθιστος का पशु-पक्षियों से असामान्य संबंध
  choice: जंगली पशुओं और पक्षियों के लिए भी अत्यन्त घृणित
  alternative: जंगली पशुओं और पक्षियों से भी पूरी तरह त्यागा हुआ
  rationale: यूनानी की अभिव्यक्ति अलंकारिक और असामान्य है। अनुवाद उसे किसी अधिक तर्कसंगत स्थान-वर्णन में बदलने के बजाय उसकी तीव्रता और तनाव को सुरक्षित रखता है।
