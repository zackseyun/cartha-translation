lexical_decisions:
- source_word: χρώμενοι ταῖς μεταβολαῖς
  choice: परिवर्तनों का उपयोग करते हुए
  rationale: कृदंत χρώμενοι के साधनात्मक भाव और μεταβολαῖς के बहुवचन ‘परिवर्तनों’ को सीधे तथा स्वाभाविक रूप में रखा गया है।
- source_word: τὰ ὑπὸ τὴν ὄψιν ἐρχόμενα
  choice: जो बातें हमारी आँखों के सामने आती हैं
  rationale: यूनानी दृश्यात्मक मुहावरे को आधुनिक हिन्दी में स्पष्ट रखा गया है; τὰ के नपुंसक बहुवचन का सामान्य अर्थ ‘बातें’ लिया गया है।
- source_word: διακρίνοντες
  choice: निर्णय करते हुए
  rationale: यहाँ क्रिया का अर्थ सामने आए मामलों को परखकर उनके विषय में निर्णय करना है; इसे केवल ‘पहचानना’ या ‘भेद करना’ नहीं बनाया गया।
- source_word: ἀεὶ μετʼ ἐπιεικεστέρας ἀπαντήσεως
  choice: सदा अधिक उदारता से
  rationale: ἐπιεικεστέρας के तुलनात्मक, नरम और न्यायसंगत व्यवहार के भाव को ‘अधिक उदारता’ से व्यक्त किया गया; हिन्दी में क्रियाविशेषणात्मक रूप वाक्य को स्वाभाविक बनाता है।
