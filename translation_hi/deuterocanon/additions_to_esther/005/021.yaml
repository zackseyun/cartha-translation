  rationale: ἀντί प्रतिस्थापन अथवा उलटाव व्यक्त करता है और ὀλεθρία विनाश या सर्वनाश को; यह चयन दोनों के स्पष्ट विरोध को बनाए रखता है।
- source_word: τοῦ ἐκλεκτοῦ γένους
  choice: चुने हुए वंश के
  rationale: γένος यहाँ सामुदायिक वंश, जातीय मूल और लोगों के समूह का अर्थ दे सकता है। ‘वंश’ मूल शब्द के वंशगत आयाम को बनाए रखता है और आधुनिक हिन्दी में ‘जाति’ से उत्पन्न हो सकने वाली अनुपयुक्त सामाजिक ध्वनि से बचता है।
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  choice: इसे उनके लिए आनन्द बना दिया है
  rationale: ποιέω के साथ विधेय कर्मकारक किसी वस्तु को दूसरी अवस्था में कर देने का भाव देता है; εὐφροσύνη आनन्द और हर्ष को व्यक्त करता है। यह रूप मूल वाक्य की सीधी रचना और उद्धारकारी उलटाव दोनों को रखता है।
theological_decisions:
- issue: ὁ πάντα δυναστεύων θεὸς में परमेश्वर की सार्वभौमता
  choice: सब पर प्रभुता रखनेवाले परमेश्वर
  alternative: सर्वशक्तिमान परमेश्वर
  rationale: मूल पद मुख्यतः सब पर सक्रिय अधिकार और शासन पर बल देता है। ‘सर्वशक्तिमान’ सम्भव धार्मिक भाव तो देता है, पर वह सामर्थ्य की एक स्थापित उपाधि को आयात कर सकता है जो यहाँ ठीक इसी रूप में नहीं है।
- issue: ἐκλεκτοῦ γένους की सामुदायिक पहचान
  choice: चुने हुए वंश
  alternative: चुने हुए लोग
  rationale: ‘वंश’ γένος के वंशगत और सामुदायिक दोनों आयामों को अधिक निकटता से सुरक्षित रखता है; ‘लोग’ अधिक सहज है, पर मूल की वंश-सम्बन्धी छाया को कम कर देता है।
