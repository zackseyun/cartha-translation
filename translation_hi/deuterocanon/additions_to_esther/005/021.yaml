- source_word: ὁ πάντα δυναστεύων θεὸς
  choice: सब पर प्रभुता रखनेवाले परमेश्वर
  rationale: δυναστεύω सक्रिय अधिकार और शासन व्यक्त करता है। ‘प्रभुता रखनेवाले’ सार्वभौम अधिकार को स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है, बिना इसे किसी बाद की निश्चित उपाधि में बदलने के।
