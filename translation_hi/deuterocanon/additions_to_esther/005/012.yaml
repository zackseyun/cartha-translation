translation:
  language: hi
  text: परन्तु वह उस घमंड को सह न सका और उसने हमें हमारे अधिकार और जीवन, दोनों से वंचित करने का प्रयत्न किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें हमारे शासन या पद और हमारे श्वास/आत्मा दोनों से वंचित करने का प्रयत्न किया।” यूनानी शब्द ἀρχή का अर्थ “शासन,” “पद” या “अधिकार,” और πνεῦμα का अर्थ “आत्मा,” “श्वास” या “जीवन” हो सकता है।
    reason: मूल यूनानी के ἀρχή और πνεῦμα में विद्यमान अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: सह न सका
  rationale: यह φέρω के कृदन्त का मुहावरेदार प्रयोग है, जिसका अर्थ किसी बात को सहना या बर्दाश्त करना है। हिन्दी में यह कारणसूचक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ὑπερηφανίαν
  choice: उसका घमंड
  rationale: ὑπερηφανία अहंकारी और तिरस्कारपूर्ण गर्व को दर्शाता है; आधुनिक हिन्दी में ‘घमंड’ इसका स्पष्ट नकारात्मक नैतिक भाव देता है।
- source_word: ἐπετήδευσεν
  choice: ठान ली
  rationale: क्रिया किसी काम को जानबूझकर अपना उद्देश्य बनाने या उसके पीछे लगने का भाव रखती है। ‘ठान ली’ दृढ़ अभिप्राय बताती है, पर यह दावा नहीं करती कि प्रयास सफल हुआ।
- source_word: τῆς ἀρχῆς
  choice: हमारे पद
  rationale: ἀρχή यहाँ शासन, अधिकार या राजकीय पद का सूचक हो सकता है। दरबारी संदर्भ में ‘पद’ स्वाभाविक है और राजनीतिक स्थिति का व्यापक भाव बनाए रखता है।
- source_word: στερῆσαι
  choice: वंचित करने
  rationale: στερέω का सामान्य अर्थ किसी को किसी वस्तु से वंचित करना या उसे उससे छीन लेना है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: यह वक्ता और उसके साथियों के लिए प्रयुक्त प्रथम पुरुष बहुवचन कर्म है।
- source_word: καὶ τοῦ πνεύματος
  choice: और जीवन
  rationale: πνεῦμα का अर्थ आत्मा, श्वास या जीवन-श्वास हो सकता है। पद छिनने के बाद इसकी चरम परिणति जीवन छिनना है; ‘जीवन’ इस संदर्भगत अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: राजनीतिक संकट के संदर्भ में πνεῦμα का अर्थ
  choice: जीवन
  alternative: आत्मा या श्वास
  rationale: ‘पद’ के साथ जिस दूसरी वस्तु से वंचित किए जाने की बात है, वह संदर्भ में प्राण या जीवन सबसे स्वाभाविक है। ‘आत्मा’ चुनने से यहाँ अनावश्यक रूप से मनुष्य की अभौतिक आत्मा से जुड़ा बाद का धर्मवैज्ञानिक अर्थ आ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठान ली’ जानबूझकर किए गए संकल्प को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी ἀρχή और πνεῦμα की वास्तविक शाब्दिक अस्पष्टता बनाए रखती है।
