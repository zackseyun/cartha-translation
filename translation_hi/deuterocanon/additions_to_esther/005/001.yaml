  rationale: σατραπείαις की फारसी प्रशासनिक विशिष्टता को ‘क्षत्रपियों’ से और χωρῶν ἄρχουσι के क्षेत्रीय शासन-संबंध को ‘प्रदेशों के शासकों’ से व्यक्त किया गया है।
- source_word: τοῖς τὰ ἡμέτερα φρονοῦσι
  choice: हमारे हितों का समर्थन करनेवालों
  rationale: यह राजनीतिक पक्षधरता का मुहावरा है। चयन उसके आशय को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: χαίρειν
  choice: अभिवादन
  rationale: पत्रारंभ में यह सामान्य अभिवादन-सूत्र है; यहाँ शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘अभिवादन’ स्वाभाविक है।
