base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/001.yaml
  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: hi
  text: 'पत्र की प्रति इस प्रकार है:


    “महान राजा अर्तक्षत्र की ओर से भारत से इथियोपिया तक की एक सौ सत्ताईस क्षत्रपी-प्रान्तों के शासकों और हमारे हितों का समर्थन करने वालों[a] को अभिवादन।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जो हमारी बातों के विषय में हमारे जैसा विचार रखते हैं”—अर्थात जो राजा के पक्ष या हितों का समर्थन करते हैं।
    reason: मूल यूनानी मुहावरे की शाब्दिक बनावट और उसके राजनीतिक आशय, दोनों को सुरक्षित रखने के लिए।
