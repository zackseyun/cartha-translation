    text: यूनानी में ‘बना कर’ और ‘घेर दिया’ का कर्ता स्त्रीलिंग एकवचन है, लेकिन इस पद में यह स्पष्ट नहीं किया गया कि वह किसकी ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
