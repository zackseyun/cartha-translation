  rationale: यूनानी क्रियात्मक रूप स्त्रीलिंग एकवचन कर्ता की ओर संकेत करते हैं, पर इस पद में उसका नाम स्पष्ट नहीं है। हिन्दी का ‘उसने’ संदर्भ को खुला रखता है; पादटिप्पणी यूनानी व्याकरण की सूचना देती है।
