  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: hi
  text: और अक्सर उसने[a] उन्माद में अधिकार के पदों पर नियुक्त उन बहुत-से मित्रों को, जिन्हें कामकाज सँभालने का भरोसा सौंपा गया था, निर्दोष रक्त के भागी[b] बना कर उन्हें ऐसी विपत्तियों से घेर दिया जिनका कोई उपाय नहीं था,
  philosophy: optimal-equivalence
  footnotes:
