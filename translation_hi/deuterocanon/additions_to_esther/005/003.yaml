  text: और वे न केवल हमारे अधीन लोगों को हानि पहुँचाने का प्रयास करते हैं, बल्कि समृद्धि[a] को सह न पाने के कारण अपने ही उपकारियों के विरुद्ध षड्यंत्र रचने का भी प्रयास करते हैं;
