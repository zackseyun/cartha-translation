review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the two coordinated accusations: seeking to harm those under the speakers'' authority and attempting hostile schemes against their own benefactors. However, «अपनी समृद्धि» adds a possessive not expressed by τὸν κόρον. The Greek states that they cannot bear prosperity/abundance (or satiety), without explicitly calling it their own.'
  naturalness: The sentence is clear and suitably formal. «हमारे अधीन लोगों के साथ बुरा करने» is understandable but less idiomatic and less direct than «हमारे अधीन लोगों को हानि पहुँचाने».
  terminology: «उपकारी» appropriately renders εὐεργέτης, and «षड्यंत्र रचने» appropriately represents the hostile sense of μηχανᾶσθαι. «समृद्धि» is a defensible contextual rendering of κόρος when accompanied by the lexical-alternative note.
  issues:
  - severity: low
    issue: Unwarranted possessive in «अपनी समृद्धि».
    rationale: τὸν κόρον has an article but no possessive pronoun. Removing «अपनी» preserves the Greek's scope and avoids making explicit what is only inferable from context.
  - severity: low
    issue: «लोगों के साथ बुरा करने» is indirect and mildly awkward.
    rationale: The Greek takes «those subject to us» as the direct object of the intended harm. «लोगों को हानि पहुँचाने» is natural modern Hindi and more closely reflects that syntax and sense.
  revised_text: और वे न केवल हमारे अधीन लोगों को हानि पहुँचाने का प्रयास करते हैं, बल्कि समृद्धि[a] को सह न पाने के कारण अपने ही उपकारियों के विरुद्ध षड्यंत्र रचने का भी प्रयास करते हैं;
