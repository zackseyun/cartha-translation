lexical_decisions:
- source_word: ὑποτεταγμένους
  choice: हमारे अधीन लोगों
  rationale: यह प्रयोग अधिकार के अधीन रखे गए लोगों को दर्शाता है। यह राजनीतिक पदवी को अनावश्यक रूप से निश्चित किए बिना संबंध का अर्थ बनाए रखता है।
- source_word: ζητοῦσι κακοποιεῖν
  choice: बुरा करने की कोशिश करते हैं
  rationale: यह यूनानी पदबंध किसी के साथ बुरा करने या उसे हानि पहुँचाने का प्रयत्न व्यक्त करता है; चुना हुआ रूप मूल क्रिया की नैतिक तीव्रता को सहज हिन्दी में रखता है।
- source_word: κόρον
  choice: समृद्धि
  rationale: κόρος का मूल भाव तृप्ति, भरपूरी या अति-प्रचुरता हो सकता है। प्रसंग में समृद्धि उस भरपूरी की स्थिति को स्वाभाविक हिन्दी में व्यक्त करती है जिसे वे संभाल नहीं पाते, जबकि पादटिप्पणी वास्तविक शाब्दिक विस्तार सुरक्षित रखती है।
- source_word: οὐ δυνάμενοι φέρειν
  choice: सह न पाने के कारण
  rationale: यह कृदन्तीय पदबंध किसी दशा को सहने या संभालने में असमर्थता बताता है और मुख्य कार्य से उसका कारणात्मक संबंध स्वाभाविक रूप में व्यक्त करता है।
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: अपने ही उपकारियों
  rationale: εὐεργέτης वह है जो किसी का भला या उपकार करता है। ‘अपने ही’ आत्मवाचक बल और विश्वासघात की विडंबना दोनों बनाए रखता है।
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: विरुद्ध षड्यंत्र रचने का भी प्रयास करते हैं
  rationale: μηχανάομαι प्रतिकूल योजना या षड्यंत्र रचने का भाव देता है, और दत्तिव वस्तु के साथ ‘विरुद्ध’ शत्रुतापूर्ण दिशा स्पष्ट करता है।
