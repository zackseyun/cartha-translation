  register: भाषा आधुनिक मानक हिन्दी की है और आदरसूचक बहुवचन ‘देखिए’ मूल के बहुवचन आज्ञार्थक को दर्शाता है। वाक्य की औपचारिक राजकीय शैली सुरक्षित रखते हुए विरामचिह्नों और स्वाभाविक हिन्दी पदक्रम से जटिल यूनानी संरचना को पठनीय बनाया गया है।
