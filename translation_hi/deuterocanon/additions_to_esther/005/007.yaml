  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: hi
  text: पर विचार कीजिए कि क्या हमारे द्वारा सौंपे गए पुराने इतिहासों से उतना नहीं, जितना आपके पैरों के पास पड़ी बातों[a] की जाँच करते हुए, यह जाना जा सकता है कि अयोग्य ढंग से शासन करनेवालों की महामारी[b] द्वारा कितने कार्य अधर्मपूर्वक[c] किए जा चुके हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आपके पैरों के पास पड़ी बातों’ के स्थान पर ‘आपके ठीक सामने की बातों’ भी सम्भव है। यूनानी मुहावरा उस बात पर बल देता है जो तत्काल सामने या निकट उपलब्ध है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘महामारी’ सम्भवतः रूपक है, जो अयोग्य ढंग से शासन करनेवालों के विनाशकारी प्रभाव को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: ‘अधर्मपूर्वक’ के स्थान पर ‘अपवित्र रीति से’ भी सम्भव है; यूनानी शब्द दुष्टता के साथ-साथ पवित्रता के उल्लंघन पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπεῖτε
  choice: ध्यान से देखिए
  rationale: बहुवचन आज्ञार्थक क्रिया केवल देखने नहीं, बल्कि ध्यानपूर्वक विचार और निरीक्षण करने का आह्वान करती है।
- source_word: ἐξέστιν
  choice: समझी जा सकती है
  rationale: यहाँ अनुमति की अपेक्षा सम्भावना या सामर्थ्य का भाव है; हिन्दी में कर्मवाच्य प्रयोग प्रसंग के तर्क को स्वाभाविक बनाता है।
- source_word: παλαιοτέρων ... ὡς παρεδώκαμεν ἱστοριῶν
  choice: हमारे सौंपे हुए अधिक पुराने इतिहासों
  rationale: παλαιοτέρων के तुलनात्मक भाव, ἱστοριῶν के ऐतिहासिक वृत्तान्तों और παρεδώκαμεν के ‘हमने सौंपे’ अर्थ—तीनों को बनाए रखा गया है।
- source_word: παρὰ πόδας ὑμᾶς
  choice: आपके पैरों के पास ही मौजूद बातों
  rationale: मूल यूनानी के सजीव मुहावरे ‘पैरों के पास’ को रखा गया है और ‘मौजूद’ से उसके तत्काल सामने या निकट होने का आशय स्पष्ट किया गया है।
- source_word: ἐξητοῦντας
  choice: जाँच करने से
  rationale: क्रिया गहन खोजबीन या बारीकी से जाँचने को दर्शाती है; हिन्दी वाक्य-विन्यास में साधनसूचक रूप स्वाभाविक है।
- source_word: ἀνοσίως
  choice: अधर्मपूर्वक
  rationale: यह शब्द पवित्र और नैतिक रूप से उचित बात के उल्लंघन को व्यक्त करता है; ‘अधर्मपूर्वक’ धार्मिक तथा नैतिक, दोनों आयामों को खुला रखता है।
- source_word: συντετελεσμένα
  choice: किए गए हैं
  rationale: पूर्ण निष्पन्न कर्म का भाव वर्तमान पूर्ण कर्मवाच्य से व्यक्त किया गया है, बिना अनावश्यक रूप से ‘सम्पन्न’ जैसे सकारात्मक अर्थ वाले शब्द का प्रयोग किए।
- source_word: λοιμότητι
  choice: महामारी
  rationale: मूल की महामारी या घातक प्रकोप वाली तीखी रूपक-छवि सुरक्षित रखी गई है।
- source_word: τῶν ἀναξία δυναστευόντων
  choice: अयोग्य रीति से सत्ता चलानेवालों
  rationale: ἀναξία को क्रियाविशेषणात्मक रखते हुए ‘अयोग्य रीति से’ और δυναστευόντων को सत्ता या प्रभुत्व चलाने के रूप में अनूदित किया गया है।
theological_decisions:
- issue: ἀνοσίως का नैतिक-धार्मिक बल
  choice: अधर्मपूर्वक
  alternative: अपवित्र रीति से; दुष्टतापूर्वक
  rationale: ‘अधर्मपूर्वक’ नैतिक बुराई और पवित्रता के उल्लंघन, दोनों सम्भावनाएँ बनाए रखता है; यह अर्थ को केवल अनुष्ठानिक अपवित्रता या केवल नागरिक कानूनभंग तक सीमित नहीं करता।
- issue: λοιμότης की रूपकात्मक तीव्रता
  choice: महामारी
  alternative: विनाशकारी भ्रष्टता; महामारी-जैसी बुराई
  rationale: मूल का ठोस और कठोर रूपक सीधे रखा गया है; उसका रूपकात्मक प्रयोग पादटिप्पणी में बताया गया है, मुख्य पाठ में उसे व्याख्यात्मक अर्थ से प्रतिस्थापित नहीं किया गया।
