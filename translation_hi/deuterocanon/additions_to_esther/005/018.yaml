  text: because the very man who had brought about these things was crucified at the gate of Susa with his whole household[a], since God, who rules over all, swiftly repaid him with the punishment he deserved,
translation:
  language: hi
  text: क्योंकि जिन बातों को उसने अंजाम दिया था, उसी व्यक्ति को उसके पूरे घराने समेत शूशन के फाटकों के पास क्रूस पर चढ़ा दिया गया था[a], और सब पर प्रभुता रखने वाले परमेश्वर ने उसे शीघ्र ही वह दण्ड दिया जिसके वह योग्य था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खंभे पर चढ़ा दिया गया था’ अथवा ‘सूली पर लटका दिया गया था।’ यूनानी क्रिया खंभे या क्रूस पर चढ़ाकर मृत्युदण्ड देने को दर्शा सकती है; यहाँ फ़ारसी दण्ड-विधि का ठीक वही रूप होना आवश्यक नहीं जो बाद में रोमी क्रूस-दण्ड का था।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण बताता है; ‘क्योंकि’ उसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  choice: जिस व्यक्ति ने ये सब कुकर्म किए थे, उसी को
  rationale: ‘उसी’ αὐτόν के बलाघात को व्यक्त करता है। प्रसंग में ἐξεργασάμενον हानिकारक षड्यंत्र को कार्यान्वित करने का बोध देता है; ‘कुकर्म किए’ इसे स्पष्ट किंतु संक्षिप्त रूप से व्यक्त करता है।
- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: शूशन के फाटकों के पास
  rationale: πρός के साथ सम्प्रदान कारक स्थान-समीपता दर्शाता है और πύλαις बहुवचन है; इसलिए ‘फाटकों के पास’ यूनानी रूप और अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἐσταυρῶσθαι
  choice: क्रूस पर चढ़ा दिया गया था
  rationale: यह यूनानी क्रिया सीधे क्रूस अथवा खम्भे पर चढ़ाकर दण्ड देने को दर्शाती है। मुख्य पाठ में पारंपरिक और स्पष्ट रूप रखा गया है, जबकि ऐतिहासिक दण्ड-विधि की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: σὺν τῇ πανοικίᾳ
  choice: उसके पूरे घराने समेत
  rationale: πανοικία पूरे घराने—परिवार और आश्रितों—को समेटता है; ‘घराना’ केवल निकट परिवार तक अर्थ को सीमित नहीं करता।
- source_word: τὴν καταξίαν ... κρίσιν
  choice: वह दण्ड ... जिसके वह योग्य था
  rationale: καταξίαν उचित अथवा पात्रतानुसार प्रतिफल और κρίσιν न्यायिक निर्णय का अर्थ देता है। इस दण्डात्मक प्रसंग में ‘योग्य दण्ड’ दोनों के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: सब पर प्रभुता रखने वाले परमेश्वर
  rationale: ἐπικρατέω का अर्थ अधिकार रखना, प्रबल होना या शासन करना है। ‘प्रभुता रखने वाले’ सार्वभौम अधिकार को बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
- source_word: διὰ τάχους
  choice: शीघ्र ही
  rationale: यह गति या तत्परता का क्रियाविशेषणीय भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: उसे ... दण्ड दिया
  rationale: ἀποδίδωμι प्रतिफल चुकाने और κρίσις न्यायिक निर्णय का बोध देता है। हिन्दी में ‘दण्ड दिया’ उस न्यायिक प्रतिदान को स्पष्ट रखता है।
theological_decisions:
- issue: दिव्य न्याय में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने उसे शीघ्र ही वह दण्ड दिया जिसके वह योग्य था
  alternative: उसे शीघ्र ही उसके योग्य न्याय मिला
  rationale: यूनानी सम्बन्धवाचक कृदन्त-विन्यास न्यायिक प्रतिफल का कर्ता सीधे परमेश्वर को ठहराता है। सक्रिय रचना इस अभिकर्तृत्व को सुरक्षित रखती है और इससे आगे कोई व्यापक धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ती।
- issue: दण्ड की सामूहिक परिधि
  choice: उसके पूरे घराने समेत
  alternative: उसके पूरे परिवार समेत
  rationale: πανοικία का दायरा केवल निकट परिवार से व्यापक हो सकता है। पाठ में निहित सामूहिक दण्ड की कठिनाई को न तो नरम किया गया है, न उसका औचित्य समझाकर तनाव मिटाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘शूशन’ बाइबलीय स्थान-नाम की प्रचलित हिन्दी वर्तनी है। यूनानी बहुवचन के अनुसार ‘फाटकों’ और व्यापक πανοικία के लिए ‘घराने’ को रखा गया है। यह पद अगले/पिछले वाक्य से व्याकरणिक रूप से जुड़ा अंश है, इसलिए अंत में अल्पविराम सुरक्षित रखा गया है।
