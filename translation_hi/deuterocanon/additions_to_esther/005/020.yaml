  text: और उन्हें बल देने के लिए[a], ताकि वे संकट के समय[b] उन पर आक्रमण करने वालों के विरुद्ध बारहवें महीने अदार के तेरहवें दिन अपनी रक्षा कर सकें, उसी दिन।
