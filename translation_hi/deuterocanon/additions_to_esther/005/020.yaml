lexical_decisions:
- source_word: συνεπισχύειν
  choice: उन्हें सामर्थ्य देने
  rationale: यह संयुक्त क्रिया अतिरिक्त बल या सहायता देने का भाव व्यक्त करती है। ‘सामर्थ्य देने’ से इसका सक्रिय, कारणवाचक अर्थ स्वाभाविक हिन्दी में बना रहता है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह प्रयोजन सूचित करता है; आधुनिक हिन्दी में ‘ताकि’ इस उद्देश्यात्मक संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐν καιρῷ θλίψεως
  choice: संकट के समय
  rationale: θλῖψις दबाव, क्लेश या विपत्ति की अवस्था को दर्शाता है। ‘संकट’ प्रसंग की गंभीरता रखते हुए सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἐπιθεμένους
  choice: अपने ऊपर आक्रमण करनेवालों
  rationale: ἐπιτίθημι का कृदन्त यहाँ शत्रुतापूर्ण आक्रमण का अर्थ रखता है। हिन्दी वाक्य में संबंध स्पष्ट करने के लिए ‘अपने ऊपर’ जोड़ा गया है, जिसका आधार αὐτοῖς है।
- source_word: ἀμύνωνται
  choice: अपनी रक्षा कर सकें
  rationale: मध्यम वाच्य अपने हित में शत्रु को रोकने या स्वयं की रक्षा करने का भाव देता है। यह अनधिकृत प्रतिशोध के बजाय आत्मरक्षा का अर्थ सुरक्षित रखता है।
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: बारहवें महीने, अर्थात् अदार महीने के तेरहवें दिन
  rationale: मूल की तिथि-संरचना और अदार नाम दोनों रखे गए हैं। ‘अर्थात्’ से यह स्पष्ट होता है कि अदार ही बारहवाँ महीना है।
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: उसी दिन
  rationale: αὐτῇ निर्दिष्ट तिथि की समानता पर बल देता है; ‘उसी दिन’ हिन्दी में यह बल संक्षेप और स्वाभाविकता से रखता है।
