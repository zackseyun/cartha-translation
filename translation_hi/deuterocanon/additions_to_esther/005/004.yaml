  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: hi
  text: और वे न केवल मनुष्यों से कृतज्ञता छीन लेते हैं, बल्कि उन लोगों की डींगों से फूल उठते हैं जिन्हें अत्यन्त भला माना जाता है[a]। वे समझते हैं कि वे उस परमेश्वर के दण्ड[b] से बच निकलेंगे, जो सदा सब कुछ देखता है और बुराई से घृणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अत्यन्त भला’ के पीछे का यूनानी रूप पाठगत और अर्थगत दृष्टि से कठिन है; सम्भवतः इसका संकेत उन लोगों की ओर है जिन्हें असाधारण रूप से भला या श्रेष्ठ माना जाता है।
    reason: textual_variant
  - marker: b
    text: या ‘न्याय’। यूनानी शब्द में न्यायिक निर्णय और उसके दण्डात्मक परिणाम—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  choice: कृतज्ञता
  rationale: यह अमूर्त संज्ञा धन्यवाद या कृतज्ञता का भाव व्यक्त करती है; ‘छीन लेते हैं’ के कर्म के रूप में ‘कृतज्ञता’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἀνταναιροῦντες
  choice: छीन लेते हैं
  rationale: कृदन्त किसी वस्तु से वंचित करने या उसे ले लेने का भाव देता है; यह अनावश्यक रूप से ‘नष्ट करना’ जैसे अधिक प्रबल अर्थ को नहीं अपनाता।
- source_word: κόμποις
  choice: डींगों
  rationale: शब्द में घमंडपूर्ण दावे या शेखी का भाव है; ‘डींगों’ से उसका नकारात्मक और अहंकारी स्वर सरल आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: ἐπαρθέντες
  choice: फूल उठते हैं
  rationale: निष्क्रिय कृदन्त का शाब्दिक भाव ऊपर उठाए जाने का है, पर प्रसंग में गर्व से भरने का नैतिक अर्थ प्रमुख है; ‘फूल उठते हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπεράγἀθων
  choice: जिन्हें अत्यन्त भला माना जाता है
  rationale: प्रेषित यूनानी रूप पाठगत और कोशगत दृष्टि से कठिन है, पर सम्भवतः असाधारण रूप से भले या श्रेष्ठ समझे जानेवाले लोगों की ओर संकेत करता है। ‘माना जाता है’ इस अनिश्चितता और प्रतिष्ठा-आधारित भाव को बनाए रखता है।
- source_word: κατοπτεύοντος
  choice: जो सदा सब कुछ देखता है
  rationale: यह कृदन्त ध्यान से देखने या निरीक्षण करने का अर्थ देता है; τὰ πάντα और ἀεί के सार्वभौमिक तथा निरन्तर भाव दोनों सुरक्षित रखे गए हैं।
- source_word: μισοπόνηρον
  choice: बुराई से घृणा करता है
  rationale: विशेषण का शाब्दिक अर्थ ‘बुराई से घृणा करनेवाला’ है। क्रियात्मक हिन्दी वाक्यांश अधिक स्वाभाविक है और परमेश्वर के बुराई-विरोधी चरित्र को बनाए रखता है।
- source_word: δίκην
  choice: दण्ड
  rationale: इस प्रसंग में शब्द उस न्यायिक परिणाम की ओर संकेत करता है जिससे अपराधी बचने की आशा करते हैं। ‘दण्ड’ स्वाभाविक है, जबकि पादटिप्पणी में ‘न्याय’ की व्यापक सम्भावना सुरक्षित रखी गई है।
theological_decisions:
- issue: परमेश्वर का सर्वदर्शी और बुराई-विरोधी वर्णन
  choice: उस परमेश्वर के दण्ड से… जो सदा सब कुछ देखता है और बुराई से घृणा करता है
  alternative: सदा सब कुछ देखनेवाले और बुराई से घृणा करनेवाले परमेश्वर के न्याय से
  rationale: यूनानी में परमेश्वर के विषय में सघन रूप से दो गुण साथ रखे गए हैं—उसका निरन्तर सब कुछ देखना और बुराई से उसका नैतिक विरोध। अनुवाद दोनों को स्पष्ट रखता है, पर बाद की धर्मशास्त्रीय शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। यूनानी के एक लम्बे वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘डींगों से फूल उठते हैं’ मूल की अहंकार-सूचक छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
