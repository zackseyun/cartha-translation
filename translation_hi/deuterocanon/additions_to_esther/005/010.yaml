  text: For Haman son of Hammedatha[a], a Macedonian, being alien to the true Persian blood and far removed from our goodwill, though he had been received by us as a guest[b],
translation:
  language: hi
  text: क्योंकि हम्मदाता का पुत्र हामान[a], जो मकिदुनियाई था, सच्चे फ़ारसी वंश से पराया और हमारी सद्भावना से बहुत दूर था, फिर भी हमने उसे अतिथि के रूप में स्वीकार किया था[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ हामान को “मकिदुनियाई” कहता है। यह जातीय पहचान यूनानी परिवर्धन की विशेषता है और संभवतः उसके ऐतिहासिक या विवादात्मक परिवेश को दर्शाती है।
    reason: cultural_note
  - marker: b
    text: “सच्चे फ़ारसी वंश से पराया” के पीछे का यूनानी वाक्यांश व्याकरण की दृष्टि से कठिन है; आशय यह है कि हामान वास्तव में फ़ारसी वंश का नहीं था।
    reason: lexical_alternative
