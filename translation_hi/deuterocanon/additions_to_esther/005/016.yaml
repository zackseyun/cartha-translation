translation:
  language: hi
  text: परमप्रधान, महानतम और जीवित परमेश्वर के पुत्र होते हुए[a]—जो हमारे और हमारे पुरखों के लिए राज्य को सर्वोत्तम रीति से चलाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान, महानतम और जीवित परमेश्वर की संतान होते हुए।” यूनानी में शाब्दिक शब्द “पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: “राज्य” का अर्थ यहाँ “राजसत्ता” या “शाही शासन” भी हो सकता है। “सर्वोत्तम रीति से चलाता है” का अनुवाद “सबसे उत्तम व्यवस्था में दिशा देता है” या “सर्वोत्तम ढंग से व्यवस्थित करता है” भी किया जा सकता है।
    reason: alternative_reading
