- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: हमारे और हमारे पुरखों के लिए
  rationale: πρόγονοι पूर्वजों को दर्शाता है; ‘पुरखे’ पारिवारिक-ऐतिहासिक भाव और ऊँची किंतु सुबोध शैली बनाए रखता है।
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: सर्वोत्तम व्यवस्था में
  rationale: διάθεσις यहाँ व्यवस्था, विन्यास या संचालन-पद्धति का भाव देता है; यह अनुवाद यूनानी सर्वोत्तमावस्था को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के साथ सामूहिक पुत्र-संबंध
  choice: परमेश्वर के पुत्र होते हुए
  alternative: परमेश्वर की संतान होते हुए
  rationale: मुख्य पाठ में स्पष्ट पुत्र-संबंधी भाषा रखी गई है, पर पादटिप्पणी में समावेशी अर्थ की सम्भावना बताई गई है।
- issue: राज्य के संचालन में परमेश्वर की क्रिया का काल और स्वरूप
  choice: राज्य को ... चलाता है
  alternative: राज्य को ... दिशा देता है / व्यवस्थित करता है
  rationale: वर्तमान कृदन्त को सामान्य वर्तमान के रूप में प्रस्तुत किया गया है, ताकि परमेश्वर के निरन्तर संचालन का भाव रहे और इसे केवल अतीत की घटना न बनाया जाए।
- issue: आरम्भिक कृदन्त का संबंध
  choice: पुत्र होते हुए
  alternative: क्योंकि हम पुत्र हैं
  rationale: यूनानी में कारणसूचक संयोजक नहीं है; इसलिए अनुवाद में स्पष्ट कारणात्मक अर्थ जोड़ने के बजाय कृदन्तीय रचना को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी का कृदन्तीय, कुछ हद तक खंडात्मक आरम्भ जानबूझकर सुरक्षित है; डैश अगले संबंधवाचक उपवाक्य को स्पष्ट करता है।
