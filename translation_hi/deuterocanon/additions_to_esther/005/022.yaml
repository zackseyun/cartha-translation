lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: इसलिए तुम भी
  rationale: καί और οὖν पिछले प्रसंग से निष्कर्षात्मक संबंध जोड़ते हैं; ‘इसलिए तुम भी’ आधुनिक हिन्दी में इसे सहज और स्पष्ट रखता है।
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: अपने नामित पर्वों पर
  rationale: ἐπώνυμος का मूल भाव किसी नाम या पदनाम से पहचाने जाने का है। ‘नामित पर्व’ इस असामान्य यूनानी अभिव्यक्ति को अति-व्याख्या किए बिना सुरक्षित रखता है; ἐν का कालवाचक अर्थ ‘पर’ से व्यक्त हुआ है।
- source_word: ἐπίσημον ἡμέραν
  choice: इस दिन को ... एक विशेष दिन के रूप में
  rationale: ἐπίσημος चिह्नित, विशिष्ट या उल्लेखनीय होने का भाव देता है। हिन्दी में ‘विशेष दिन के रूप में’ स्वाभाविक है; प्रसंगगत कर्म को स्पष्ट करने के लिए ‘इस दिन को’ जोड़ा गया है।
- source_word: μετὰ πάσης εὐωχίας
  choice: हर प्रकार के भोज के साथ
  rationale: εὐωχία उत्सवी भोज और उससे जुड़े आनंद को सूचित करता है; πάσης की व्यापकता ‘हर प्रकार के’ से बनी रहती है।
- source_word: ἄγετε
  choice: मनाओ
  rationale: यह वर्तमान आज्ञार्थक क्रिया किसी दिन को उत्सवपूर्वक मनाने या मानने का निर्देश देती है; ‘मनाओ’ इस संदर्भ में सहज आधुनिक हिन्दी है।
