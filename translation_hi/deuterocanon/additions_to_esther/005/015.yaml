  text: परन्तु हम पाते हैं कि उस तीन बार शापित व्यक्ति[a] के द्वारा विनाश के लिए सौंपे गए यहूदी अपराधी नहीं हैं, बल्कि अत्यन्त न्यायपूर्ण नियमों के अनुसार जीवन बिताते हैं[b],
