  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: hi
  text: उसने कुटिल चालों और छलपूर्ण तर्कों से हमारे उद्धारकर्ता[a] और सदा उपकार करनेवाले मोर्दकै, तथा राज्य की निर्दोष सहभागी एस्तेर को, उनकी सारी जाति समेत, नष्ट करने की माँग की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुड़ानेवाले” अथवा “रक्षक।” यहाँ यूनानी शब्द मोर्दकै के बचाने या रक्षा करने के कार्य को बताता है; यह आवश्यक नहीं कि कोई औपचारिक धार्मिक उपाधि हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह σωτήρ का सीधा और गरिमापूर्ण हिन्दी रूप है। यहाँ यह मोर्दकै के द्वारा राजा अथवा राज्य की रक्षा किए जाने के सामान्य अर्थ में है, किसी विशिष्ट धार्मिक उपाधि के रूप में नहीं; इस बात को पादटिप्पणी स्पष्ट करती है।
- source_word: διὰ παντὸς εὐεργέτην
  choice: सदा उपकार करनेवाले
  rationale: διὰ παντός की निरंतरता और εὐεργέτης के हितकारी सेवा करनेवाले अर्थ, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄμεμπτον
  choice: निर्दोष
  rationale: निन्दा या दोष से परे होने का नैतिक-वैधानिक भाव रखता है और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: τῆς Βασιλείας κοινωνὸν
  choice: राज्य की ... सहभागी
  rationale: κοινωνός के साझेदारी अथवा सहभागिता के अर्थ को बनाए रखता है और Βασιλεία को बिना अनावश्यक व्याख्या के 'राज्य' कहता है।
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: उनकी पूरी जाति समेत
  rationale: τούτων को मोर्दकै और एस्तेर दोनों की ओर संकेत करनेवाले बहुवचन के रूप में रखता है; ἔθνος का सामूहिक जातीय अर्थ यहाँ 'जाति' से स्वाभाविक रूप में व्यक्त होता है।
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: अपनी कुटिल चालों और छलपूर्ण तर्कों से
  rationale: यूनानी पदसमूह में जटिल षड्यंत्र, कपटपूर्ण उपाय और भ्रामक तर्क का घना नकारात्मक भाव है। यह रूप उसे पठनीय हिन्दी में रखता है, बिना उसे केवल एक सामान्य 'योजना' तक सीमित किए।
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: नाश कराने की माँग की
  rationale: αἰτέομαι के माँग अथवा निवेदन करने के अर्थ और εἰς ἀπώλειαν के लक्षित परिणाम को संयुक्त, स्वाभाविक हिन्दी में व्यक्त करता है; राजकीय संदर्भ में किसी से विनाश की अनुमति माँगना निहित है।
theological_decisions:
- issue: मोर्दकै के लिए σωτήρ का प्रयोग
  choice: उद्धारकर्ता
  alternative: छुड़ानेवाला; रक्षक
  rationale: यूनानी शब्द को उसके पूर्ण अर्थ-भार सहित रखा गया है, पर पादटिप्पणी स्पष्ट करती है कि प्रसंग में यह मोर्दकै के रक्षा अथवा बचाव के कार्य का वर्णन है, कोई अनिवार्य रूप से मसीही उपाधि नहीं।
- issue: τούτων ἔθνει का संबंध
  choice: उनकी पूरी जाति
  alternative: उसकी पूरी जाति; इन लोगों की पूरी जाति
  rationale: बहुवचन τούτων सबसे स्वाभाविक रूप से अभी-अभी उल्लिखित मोर्दकै और एस्तेर दोनों की ओर लौटता है और उन्हें लक्षित यहूदी जाति से जोड़ता है।
- issue: τῆς Βασιλείας κοινωνὸν की व्याख्या
  choice: राज्य की सहभागी
  alternative: राजसत्ता की सहभागी; राजकीय पद की सहभागी
  rationale: यूनानी में राज्य, राजत्व अथवा शासन-संबंधी सहभागिता की कुछ अर्थगत खुली गुंजाइश है। मुख्य पाठ निकट और सहज रूप 'राज्य की सहभागी' रखकर इसे किसी अधिक विशिष्ट राजनैतिक या वैवाहिक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। वाक्य की राजकीय-आरोपात्मक शैली बनाए रखते हुए यूनानी कृदन्त को पूर्ण हिन्दी क्रिया में बदला गया है। 'कुटिल चालों और छलपूर्ण तर्कों' से मूल के सघन, बहुस्तरीय निंदात्मक पदसमूह को स्वाभाविक ढंग से व्यक्त किया गया है।
