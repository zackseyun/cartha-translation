translation:
  language: hi
  text: वह उन बंदियों में से था[a], जिन्हें बाबेल का राजा नबूकदनेस्सर, यहूदिया[b] के राजा यकोन्याह के साथ, यरूशलेम से बंदी बनाकर ले गया था।
  philosophy: optimal-equivalence
  footnotes:
