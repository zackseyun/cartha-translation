    text: शाब्दिक रूप से, “बंदीवास में से था”; अर्थ “निर्वासित लोगों में से था” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “यहूदिया” यूनानी शब्दावली को दर्शाता है; ऐतिहासिक संदर्भ यहूदा के राजवंश और राज्य का है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: उन बंदियों में से था
  rationale: यूनानी में शाब्दिक रूप से ‘बंदीवास में से’ है। हिन्दी में ‘उन बंदियों में से’ निर्वासित समुदाय से उसके संबंध को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी मूल की अमूर्त एकवचन संज्ञा को सुरक्षित रखती है।
- source_word: ᾐχμαλώτευσεν
  choice: बंदी बनाकर ले गया था
  rationale: क्रिया बलपूर्वक बंदी बनाने और स्थान से ले जाने, दोनों का भाव देती है। यह प्रयोग आधुनिक हिन्दी में स्पष्ट है और आधुनिक प्रशासनिक शब्दावली थोपने से बचता है।
- source_word: Ναβουχοδονόσορ
  choice: नबूकदनेस्सर
  rationale: बाबेल के राजा के लिए प्रचलित हिन्दी बाइबलीय नामरूप चुना गया है।
- source_word: μετὰ Ἰεχονίου
  choice: यकोन्याह के साथ
  rationale: μετά संबंधकारक के साथ सहभागिता या साथ होने का अर्थ देता है; ‘के साथ’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: τῆς Ἰουδαίας
  choice: यहूदिया के
  rationale: यह रूप यूनानी भौगोलिक-राजनीतिक नाम Ἰουδαία को निकटता से दर्शाता है। ऐतिहासिक संदर्भ में ‘यहूदा’ भी संभव है, इसलिए पादटिप्पणी में उसे स्पष्ट किया गया है।
theological_decisions:
- issue: बंदी बनाए जाने की ऐतिहासिक भाषा को बाद की धर्मवैज्ञानिक धारणाओं से मुक्त रखना
  choice: उन बंदियों में से था … बंदी बनाकर ले गया था
  alternative: बंदीवास में से था … निर्वासित कर दिया था
  rationale: पद ऐतिहासिक पहचान बताता है। चुना हुआ अनुवाद बलपूर्वक ले जाए जाने का अर्थ बनाए रखता है, पर व्यक्ति की सामाजिक या धर्मवैज्ञानिक स्थिति के बारे में मूल से अधिक निष्कर्ष नहीं निकालता।
- issue: Ἰουδαίας को ‘यहूदिया’ या ‘यहूदा’ कहना
  choice: यहूदिया
  alternative: यहूदा
  rationale: ‘यहूदिया’ यूनानी शब्दरूप का अधिक सीधा प्रतिनिधित्व करता है; फिर भी राजवंशीय ऐतिहासिक संदर्भ यहूदा के राज्य से जुड़ा है, जिसे पादटिप्पणी में बताया गया है।
