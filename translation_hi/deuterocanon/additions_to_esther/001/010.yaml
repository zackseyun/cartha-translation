  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
translation:
  language: hi
  text: प्रकाश हुआ और सूर्य उदय हुआ; दीन जन[a] ऊँचे किए गए और उन्होंने प्रतिष्ठित लोगों[b] को निगल लिया।
  philosophy: optimal-equivalence
  footnotes:
