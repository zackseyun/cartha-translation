    text: या “विनम्र जन।” यूनानी शब्द विनम्र स्वभाव या नीची सामाजिक दशा—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सम्मानित लोग” अथवा “यशस्वी लोग।” यूनानी शब्द उन लोगों के लिए है जिन्हें सम्मान या प्रसिद्धि प्राप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ज्योति
  rationale: ग्रीक में यह बिना क्रिया के एक स्वतंत्र, चित्रात्मक संज्ञा है। ‘ज्योति’ उसके प्रतीकात्मक बल और गरिमापूर्ण शैली को बनाए रखती है।
- source_word: ὁ ἥλιος
  choice: सूर्य
  rationale: निश्चित पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀνέτειλεν
  choice: उदय हुआ
  rationale: सूर्य के उगने के लिए प्रचलित, संक्षिप्त और गरिमापूर्ण अभिव्यक्ति।
- source_word: οἱ ταπεινοὶ
  choice: जो दीन थे
  rationale: ταπεινός सामाजिक रूप से नीचे माने जाने या विनम्र होने—दोनों अर्थ दे सकता है; ‘दीन’ स्थिति-पलट को उभारता है, पर बाहरी उत्पीड़न का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ὑψώθησαν
  choice: ऊँचे किए गए
  rationale: निष्क्रिय क्रिया और ऊपर उठाए जाने की मूल छवि दोनों सुरक्षित रहते हैं; इसे केवल सम्मानित किए जाने तक सीमित नहीं किया गया।
- source_word: κατέφαγον
  choice: निगल लिया
  rationale: मूल की तीव्र, विजय-सूचक भक्षण-छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοὺς ἐνδόξους
  choice: प्रतिष्ठित लोगों
  rationale: ἔνδοξος उन लोगों को सूचित करता है जिन्हें सम्मान, यश या प्रतिष्ठा प्राप्त है; यह हिन्दी रूप ‘महिमामय’ की संभावित दैवी ध्वनि से बचता है।
theological_decisions:
- issue: क्या संक्षिप्त प्रतीकात्मक चित्रों को उद्धार और विजय की व्याख्यात्मक गद्य-अभिव्यक्ति में बदल दिया जाए
  choice: ज्योति, सूर्य के उदय, दीनों के ऊँचे किए जाने और प्रतिष्ठित लोगों को निगल लेने की मूल छवियाँ सीधे बनाए रखी गईं।
  alternative: इसे स्पष्ट रूप से दीनों की मुक्ति और शक्तिशालियों पर विजय के कथन के रूप में समझाकर लिखना।
  rationale: ग्रीक स्वयं अत्यंत संक्षिप्त और प्रतीकात्मक है; व्याख्यात्मक विस्तार उसकी वास्तविक अस्पष्टता और नाटकीय तनाव को घटा देता।
- issue: ταπεινοί का नैतिक या सामाजिक अर्थ
  choice: मुख्य पाठ में ‘दीन’ रखा गया, जिससे निम्न दशा और विनम्रता दोनों की कुछ गुंजाइश रहती है।
  alternative: ‘विनम्र’ या ‘पद में छोटे लोग’।
  rationale: संदर्भ स्थिति-पलट का संकेत देता है, पर शब्द को केवल सामाजिक वर्ग या केवल आंतरिक सद्गुण तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और चित्रात्मक शैली रखी गई है। ‘ज्योति’ और ‘निगल लिया’ मूल की काव्यात्मक तीव्रता बनाए रखते हैं; फुटनोट-चिह्न मुख्य पाठ में संबंधित पदों के बाद दिए गए हैं।
