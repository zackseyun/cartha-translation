    issue: “उन दोनों खोजों से पूछताछ की” is somewhat more interrogative in tone than necessary.
    rationale: ἐξήτασεν denotes examination or inquiry and need not imply an interrogation. “उन दोनों खोजों की जाँच की” is idiomatic Hindi and preserves the broader formal-investigation sense.
