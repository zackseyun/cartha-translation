    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήτασεν
  choice: पूछताछ की
  rationale: क्रिया जाँच-पड़ताल या औपचारिक पूछताछ का बोध कराती है। ‘पूछताछ की’ न्यायिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करती है, पर ‘कड़ी पूछताछ’ जैसी अनावश्यक तीव्रता नहीं जोड़ती।
- source_word: εὐνούχους
  choice: खोजों
  rationale: यूनानी शब्द का सीधा अर्थ ‘खोजे’ है। दरबार में उनकी अधिकारी की भूमिका रही होगी, फिर भी केवल ‘दरबारी अधिकारियों’ कहना मूल पाठ की विशिष्टता को मिटा देता।
- source_word: ὁμολογήσαντες
  choice: उनके स्वीकार कर लेने पर
  rationale: कृदंत किसी बात को मान लेने या स्वीकार करने को दर्शाता है। मूल में यह स्पष्ट नहीं कहा गया कि उन्होंने ठीक क्या स्वीकार किया, इसलिए हिन्दी में ‘अपराध’ या ‘दोष’ नहीं जोड़ा गया।
- source_word: ἀπήχθησαν
  choice: उन्हें ले जाया गया
  rationale: कर्मवाच्य क्रिया अधिकारपूर्वक वहाँ से ले जाए जाने का संकेत देती है। यह अनुवाद हिरासत या दंड का ऐसा विवरण नहीं जोड़ता जो मूल में नहीं है।
