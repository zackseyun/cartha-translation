  source_fidelity: 'The draft preserves all four Greek elements: the king''s examination, the specific designation of the two εὐνοῦχοι, their admission without supplying its object, and their subsequent passive removal. However, the footnote anchors do not correspond to the annotated terms in the verse: the note on formal examination is attached to “पूछताछ,” while no note is attached to the confession/admission phrase, despite the English audit trail''s placement and lexical rationale.'
