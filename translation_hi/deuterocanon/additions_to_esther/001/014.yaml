  terminology: Retain “खोजों” for εὐνούχους rather than generalizing to court officials. Retain “स्वीकार” without adding “अपराध,” “दोष,” or another implied object. The revised notes place the lexical alternative for εὐνούχους at that noun and the admission-related clarification at “स्वीकार.”
  issues:
