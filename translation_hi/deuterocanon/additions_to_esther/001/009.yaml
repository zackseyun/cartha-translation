- source_word: ποταμὸς μέγας
  choice: एक बड़ी नदी
  rationale: यह सीधा चयन छोटे सोते और बड़ी नदी के बीच मूल यूनानी पाठ के आकार-संबंधी विरोध को सुरक्षित रखता है।
- source_word: ὕδωρ πολύ
  choice: बहुत जल
  rationale: मूल का संक्षिप्त, अनुवर्ती पदबंध नदी में जल की प्रचुरता पर बल देता है। ‘बहुत जल’ उसकी अर्थगत और वाक्यगत तीक्ष्णता को बनाए रखता है।
