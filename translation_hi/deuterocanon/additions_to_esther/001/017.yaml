  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: hi
  text: और हम्मदाता का पुत्र हामान बूगाई[a] राजा के सामने प्रतिष्ठित था। वह राजा के दो खोजों के कारण मोर्दकै और उसके लोगों को हानि पहुँचाने की कोशिश कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “बूगाई” है। एक अधिक परिचित पाठ-परंपरा हामान को “अगागी” कहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: हम्मदाता का पुत्र हामान
  rationale: सम्बन्धकारक Ἁμαδάθου को स्वाभाविक पितृनाम के रूप में व्यक्त किया गया है; नामों का लिप्यंतरण हिन्दी की प्रचलित बाइबलीय वर्तनी के अनुरूप है।
- source_word: Βουγαῖος
  choice: बुगाई
  rationale: यह अस्पष्ट जातीय या कुल-सूचक पद है। इसका अर्थ निर्धारित करने अथवा इसे दूसरी पाठ-परंपरा के ‘अगागी’ से मिलाने के बजाय यूनानी रूप का लिप्यंतरण किया गया है।
- source_word: ἔνδοξος ἐνώπιον τοῦ βασιλέως
  choice: राजा के सामने प्रतिष्ठित था
  rationale: ἔνδοξος यहाँ हामान की राजदरबार में सम्मानित और ऊँची स्थिति बताता है; ‘प्रतिष्ठित’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐζήτει κακοποιῆσαι
  choice: हानि पहुँचाने की कोशिश कर रहा था
  rationale: अपूर्ण भूतकाल ἐζήτει निरंतर प्रयास या मंशा दर्शाता है; κακοποιῆσαι की व्यापक दुर्भावनापूर्ण हानि को ‘हानि पहुँचाने’ से व्यक्त किया गया है।
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: मोर्दकै और उसके लोगों को
  rationale: λαός यहाँ मोर्दकै से संबंधित यहूदी समुदाय को सूचित करता है; ‘उसके लोग’ मूल की संक्षिप्तता बनाए रखता है।
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: राजा के दो खोजों के कारण
  rationale: संदर्भ में ὑπέρ कारण-संबंध प्रकट करता है। εὐνοῦχοι का दरबारी अर्थ ‘खोजे’ से सीधे और ऐतिहासिक रूप से व्यक्त होता है।
theological_decisions:
- issue: अस्पष्ट पद Βουγαῖος का अनुवाद
  choice: ‘बुगाई’ के रूप में लिप्यंतरण
  alternative: ‘अगागी’ अथवा कोई अनुमानित जातीय पहचान
  rationale: प्रस्तुत यूनानी साक्षी Βουγαῖος पढ़ता है। इसलिए अनुवाद उसी रूप को सुरक्षित रखता है और परिचित वैकल्पिक परंपरा को केवल पादटिप्पणी में बताता है, जिससे पाठों का मौन सामंजस्य न किया जाए।
- issue: ὑπέρ से व्यक्त संबंध
  choice: कारणसूचक ‘के कारण’
  alternative: ‘के विषय में’ या ‘की ओर से’
  rationale: कथा-संदर्भ हामान की शत्रुता को राजा के दो खोजों से जुड़े प्रसंग का परिणाम बताता है; फिर भी मूल पूर्वसर्ग में संभव व्यापक संबंध को अनावश्यक विवरण जोड़कर सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। लंबे यूनानी संयुक्त वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, जबकि घटनाओं का क्रम और अपूर्ण भूतकाल का निरंतर भाव सुरक्षित है।
