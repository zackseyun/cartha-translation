  yaml_path: translation/deuterocanon/additions_to_esther/001/011.yaml
  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: hi
  text: मोर्दकै जागने पर, यह स्वप्न और यह कि परमेश्वर ने क्या करने का निश्चय किया था, देख चुका था। उसने इसे अपने हृदय[a] में रखा और रात होने तक हर बात[b] में इसे समझना चाहता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वेते के मुद्रित यूनानी पाठ में यहाँ ‘ἐν Β τῇ καρδίᾳ’ मिलता है। ‘Β’ संभवतः प्रतिलिपि या मुद्रण-दोष है; अर्थ के अनुसार पाठ ‘अपने हृदय में’ समझा जाता है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से ‘हर बात/हर वचन में’; यूनानी पद का अर्थ ‘हर पहलू में’ या ‘हर प्रकार से’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθείς
  choice: जब मोर्दकै जागा
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी में मुख्य कथानक की अगली घटना के रूप में व्यक्त किया गया है; कर्मवाच्य का यांत्रिक अनुवाद आवश्यक नहीं है।
- source_word: τὸ ἐνύπνιον
  choice: इस स्वप्न को
  rationale: ἐνύπνιον का सामान्य और प्रसंगानुकूल अर्थ ‘स्वप्न’ है; ‘दर्शन’ अर्थ को अनावश्यक रूप से विशिष्ट कर देता।
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: परमेश्वर ने जो करने का निश्चय किया था
  rationale: पूर्णकालिक मध्यरूप βεβούλευται परमेश्वर के ठहराए हुए अभिप्राय को दर्शाता है; ‘निश्चय’ आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: εἶχεν αὐτὸ ... τῇ καρδίᾳ
  choice: उसने यह बात अपने हृदय में रखी
  rationale: मूल का हृदय-संबंधी बिंब सुरक्षित रखा गया है; ‘मन में रखा’ अधिक सपाट होता और मूल शब्द καρδία को धुंधला करता।
- source_word: ἐν παντὶ λόγῳ
  choice: हर पहलू से
  rationale: λόγος यहाँ केवल बोले गए ‘शब्द’ तक सीमित नहीं, बल्कि स्वप्न से संबंधित बात, विवरण या पक्ष का व्यापक अर्थ दे सकता है। ‘हर पहलू से’ इसी व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤθελεν ἐπιγνῶναι αὐτό
  choice: इसका अर्थ समझने की इच्छा करता रहा
  rationale: ἐπιγνῶναι में पूर्णतः जानने या पहचानने का भाव है। स्वप्न के प्रसंग में हिन्दी का ‘अर्थ समझना’ व्याख्यात्मक खोज को स्पष्ट करता है, जबकि ‘इच्छा करता रहा’ अपूर्णकालिक निरंतरता बचाता है।
- source_word: ἕως τῆς νυκτός
  choice: रात होने तक
  rationale: यह अभिव्यक्ति रात के आगमन तक की समय-सीमा बताती है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: ὁ θεός का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में सामान्य, गरिमापूर्ण पद है और मूल में उपस्थित सामान्य ईश्वरीय उपाधि से अधिक विशिष्टता नहीं जोड़ता।
- issue: हृदय का मानवशास्त्रीय मुहावरा
  choice: अपने हृदय में रखी
  alternative: अपने मन में रखी
  rationale: मूल के καρδία बिंब को सुरक्षित रखने से चिंतन तथा भीतरी संजोकर रखने—दोनों की गुंजाइश बनी रहती है।
- issue: स्वप्न और परमेश्वर के अभिप्राय के बीच संबंध
  choice: इस स्वप्न को और परमेश्वर ने जो करने का निश्चय किया था उसे देखकर
  alternative: इस स्वप्न में यह देखकर कि परमेश्वर ने क्या करने का निश्चय किया था
  rationale: ग्रीक की समन्वयी रचना में स्वप्न और परमेश्वर के अभिप्राय दोनों उसके देखे हुए विषय हो सकते हैं। मुख्य पाठ इस हल्की संरचनात्मक अस्पष्टता को पूरी तरह एक ही व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हृदय’ जैसे मूल बाइबलीय बिंब को बचाया गया है, जबकि कठिन यूनानी वाक्य-विन्यास को प्रवाहपूर्ण हिन्दी में ढाला गया है। स्वेते पाठ में καρδίᾳ से पहले छपा ‘Β’ संभवतः मुद्रण या प्रतिलेखन-दोष है; अर्थगम्य पाठ के अनुसार अनुवाद किया गया है।
