  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: hi
  text: उसने उनकी योजनाएँ सुनीं और उनकी चिंताओं को अच्छी तरह जाँचा-परखा। तब उसे पता चला कि वे राजा अर्तक्षत्र पर हाथ डालने की तैयारी कर रहे थे।[a] उसने उनके विषय में राजा को सूचना दे दी।
  philosophy: optimal-equivalence
  footnotes:
