    text: या, “राजा अर्तक्षत्र पर हमला करने।” यूनानी मुहावरे का शाब्दिक अर्थ है “राजा पर हाथ डालना”; यह शत्रुतापूर्ण कार्रवाई का संकेत दे सकता है, पर उसके सटीक रूप को नहीं बताता।
    reason: lexical_alternative
