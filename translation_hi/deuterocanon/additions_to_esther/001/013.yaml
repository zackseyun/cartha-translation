- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: पर हाथ डालने
  rationale: यूनानी मुहावरे के शाब्दिक बिंब और उसकी अनिर्दिष्ट शत्रुतापूर्ण कार्रवाई—पकड़ना, हमला करना या प्राणघातक वार करना—को सुरक्षित रखता है।
- source_word: Ἀρταξέρξῃ
  choice: अर्तक्षत्र
  rationale: राजा Artaxerxes के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और सुबोध नाम-रूप।
- source_word: ὑπέδειξεν
  choice: सूचना दे दी
  rationale: यह राजा के ध्यान में बात लाने या उसे बताने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
