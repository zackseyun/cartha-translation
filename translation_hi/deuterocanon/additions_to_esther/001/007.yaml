  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: hi
  text: 'और देखो: पृथ्वी[a] पर अंधकार और घोर अंधकार, क्लेश और संकट, दुर्दशा और बड़ी उथल-पुथल का दिन!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश पर।” यूनानी शब्द γῆ का अर्थ सामान्य रूप से “पृथ्वी” या किसी विशेष “देश” से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आकस्मिक और दर्शनात्मक उद्घोष की शक्ति बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡμέρα
  choice: दिन
  rationale: विपत्तियों की सूची को एक अशुभ दिन की घोषणा के रूप में प्रस्तुत करता है।
- source_word: σκότους καὶ γνόφου
  choice: अंधकार और घोर अंधकार
  rationale: दोनों निकटार्थक यूनानी शब्दों का भेद और काव्यात्मक समानांतरता बनाए रखने के लिए γνόφος को तीव्रतर अभिव्यक्ति दी गई है।
- source_word: θλίψις καὶ στενοχωρία
  choice: क्लेश और संकट
  rationale: दबावपूर्ण पीड़ा और घिरी हुई कठिन दशा के अर्थों को एक स्वाभाविक हिन्दी युग्म में व्यक्त करता है।
- source_word: κάκωσις
  choice: दुर्दशा
  rationale: बिना किसी निश्चित उत्पीड़क को मान लिए पीड़ा और विपत्ति की परिणामी दशा व्यक्त करता है।
- source_word: τάραχος μέγας
  choice: बड़ी उथल-पुथल
  rationale: व्यापक अव्यवस्था और हलचल को μέγας की तीव्रता सहित व्यक्त करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: दर्शनात्मक और व्यापक स्वर के अनुरूप γῆ का विस्तृत अर्थ चुना गया है; किसी विशेष देश का अर्थ भी संभव है।
theological_decisions:
- issue: γῆ का भौगोलिक दायरा
  choice: पृथ्वी पर
  alternative: देश में
  rationale: पद की व्यापक, विपत्तिमय और दर्शनात्मक भाषा पृथ्वी-व्यापी अर्थ का समर्थन करती है, पर यूनानी शब्द अपने आप किसी विशेष देश की संभावना को समाप्त नहीं करता।
- issue: क्रियाहीन यूनानी उद्घोष का हिन्दी रूप
  choice: दिन आ पहुँचा
  alternative: दिन
  rationale: यूनानी में नाममात्रात्मक उद्घोष है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए क्रिया जोड़ी गई है, बिना यह निर्धारित किए कि घटना तत्काल वर्तमान है या दर्शन में सामने आती है।
