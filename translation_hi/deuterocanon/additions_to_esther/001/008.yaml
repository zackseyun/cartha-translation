translation:
  language: hi
  text: और हर धर्मी राष्ट्र के लोग व्याकुल हो उठे[a]; वे अपने ऊपर आने वाली विपत्तियों से डर रहे थे[b] और नाश होने के लिए तैयार हो गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर न्यायप्रिय राष्ट्र के लोग घबरा गए।’ यूनानी δίκαιον का अनुवाद ‘धर्मी’ या ‘न्यायप्रिय,’ और ἐταράχθη का ‘व्याकुल हो उठा’ या ‘घबरा गया’ किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपनी बुराइयों से’; इसका आशय उन अनिष्टों या विपत्तियों से भी हो सकता है जिनके अपने ऊपर आने का उन्हें भय था।
    reason: lexical_alternative
  - marker: c
    text: या ‘नष्ट कर दिए जाने के लिए तैयार हो गए।’ यूनानी ἀπολέσθαι में स्वयं नाश होने अथवा नष्ट किए जाने—दोनों का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: व्याकुल हो उठे
  rationale: यह पद निष्क्रिय रूप में भीतर और बाहर की गहरी घबराहट या हलचल व्यक्त करता है। ‘व्याकुल हो उठे’ आधुनिक हिन्दी में स्वाभाविक है और केवल ‘चिन्तित हुए’ की अपेक्षा इसकी तीव्रता को बेहतर रखता है।
- source_word: δίκαιον
  choice: धर्मी
  rationale: δίκαιος यहाँ केवल कानूनी रूप से ‘न्यायपूर्ण’ नहीं, बल्कि नैतिक रूप से सही और निर्दोष होने का भाव रखता है। ‘धर्मी’ बाइबलीय नैतिक भार को बनाए रखता है।
- source_word: πᾶν ἔθνος
  choice: हर ... जाति के लोग
  rationale: एकवचन πᾶν ἔθνος का वितरणात्मक अर्थ ‘हर जाति/जनसमुदाय’ है। आगे के बहुवचन कृदन्तों को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘के लोग’ लगाया गया है; ‘जाति’ यहाँ लोगों या राष्ट्र के अर्थ में है।
- source_word: φοβούμενοι
  choice: डर रहे थे
  rationale: वर्तमान कृदन्त मुख्य घटना के साथ चल रहे भय को बताता है। हिन्दी में यह रूप उस सतत परिस्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ἑαυτῶν κακά
  choice: अपने ऊपर आनेवाली विपत्तियों
  rationale: κακά का शाब्दिक विस्तार ‘बुराइयाँ’ से लेकर हानि और विपत्तियों तक है। आसन्न विनाश के प्रसंग में यह उन विपत्तियों को सूचित करता है जिनके अपने ऊपर आने का उन्हें भय था।
- source_word: ἡτοιμάσθησαν
  choice: तैयार हो गए
  rationale: यह मध्य/निष्क्रिय रूप यहाँ अकर्मक अर्थ में अपनी तैयारी या तत्पर अवस्था को व्यक्त करता है।
- source_word: ἀπολέσθαι
  choice: नाश होने के लिए
  rationale: मध्य infinitive में स्वयं मिट जाने, मरने या विनष्ट किए जाने की गुंजाइश है। ‘नाश होना’ उस गंभीरता और कुछ हद तक उस अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: δίκαιον द्वारा प्रभावित ἔθνος का वर्णन
  choice: नैतिक-धार्मिक अर्थ में ‘धर्मी’
  alternative: सामाजिक-कानूनी अर्थ में ‘न्यायी’
  rationale: पद आसन्न विपत्ति से डर रहे एक सीधे और निर्दोष जनसमुदाय का चित्र देता है। ‘धर्मी’ δίκαιος के बाइबलीय नैतिक-धार्मिक भार को ‘न्यायी’ की तुलना में अधिक स्पष्ट रूप से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी रखी गई है। ‘हर ... जाति के लोग’ यूनानी के एकवचन सामूहिक संज्ञा और उसके बाद आए बहुवचन कृदन्तों के अर्थ-सामंजस्य को हिन्दी में स्वाभाविक बनाता है। ‘जाति’ का प्रयोग यहाँ राष्ट्र/जनसमुदाय के अर्थ में है, न कि भारतीय वर्ण या जाति-व्यवस्था के अर्थ में।
