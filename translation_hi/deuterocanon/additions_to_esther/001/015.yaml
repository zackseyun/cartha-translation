translation:
  language: hi
  text: और राजा ने इन बातों को स्मरण के लिए लिख दिया[a], और मोर्दकै ने भी इन बातों के विषय में लिखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक स्मारक के रूप में’ अथवा ‘यादगार के लिए।’ यूनानी पद का आशय स्मरण बनाए रखनेवाले स्मारक या सुरक्षित लिखित अभिलेख—दोनों में से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिख दिया / लिखा
  rationale: γράφω का सीधा अर्थ ‘लिखना’ है। पहले खंड में स्वाभाविक हिन्दी के लिए ‘लिख दिया’ और दूसरे में ‘लिखा’ रखा गया है; दोनों मूल यूनानी की पुनरावृत्ति को पर्याप्त रूप से दर्शाते हैं।
- source_word: τοὺς λόγους τούτους
  choice: इन बातों को
  rationale: λόγοι यहाँ पहले कही गई विषय-वस्तु की ओर संकेत करता है और ‘शब्दों’ अथवा ‘बातों/विषयों’ का अर्थ दे सकता है। प्रसंग में ‘इन बातों’ अधिक स्वाभाविक है, जबकि अर्थ की व्यापकता भी बनी रहती है।
- source_word: εἰς μνημόσυνον
  choice: स्मरण के लिए
  rationale: μνημόσυνον ऐसी वस्तु या अभिलेख को सूचित करता है जो स्मरण बनाए रखे। ‘स्मरण के लिए’ उद्देश्य और स्मारकीय/अभिलेखीय भाव दोनों को खुला रखता है।
- source_word: Μαρδοχαῖος
  choice: मोर्दकै
  rationale: यह Μαρδοχαῖος का हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप है।
- source_word: περὶ τῶν λόγων τούτων
  choice: इन बातों के विषय में
  rationale: संबंधवाचक περί के साथ संबंधकारक का अर्थ ‘के विषय में/के बारे में’ है। यह दूसरे लेखन को उन्हीं बातों से स्पष्ट रूप से जोड़ता है।
