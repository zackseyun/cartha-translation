  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: hi
  text: और राजा ने मोर्दकै को राजदरबार में सेवा करने की आज्ञा दी[a], और इन बातों के कारण उसे उपहार दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजमहल के प्रांगण में।” यूनानी पद का शाब्दिक अर्थ “प्रांगण में” भी हो सकता है और यह राजदरबार अथवा राजमहल-परिसर में सेवा का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने को व्यक्त करती है; राजकीय संदर्भ में ‘आज्ञा दी’ स्वाभाविक और सटीक है।
- source_word: θεραπεύειν
  choice: सेवा करने
  rationale: दरबारी संदर्भ में यह उपस्थित रहकर सेवा करने का बोध देती है; ‘सेवा करने’ से धार्मिक अर्थ अनावश्यक रूप से नहीं जुड़ता।
- source_word: ἐν τῇ αὐλῇ
  choice: राजदरबार में
  rationale: αὐλή दरबार, आँगन या राजमहल-परिसर का संकेत कर सकता है; यहाँ राजकीय सेवा के संदर्भ में ‘राजदरबार में’ सबसे स्वाभाविक है, जबकि स्थानवाचक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: δόματα
  choice: उपहार
  rationale: शब्द सामान्यतः दी गई भेंटों को दर्शाता है; ‘पुरस्कार’ कहना राजा की मंशा को मूल से अधिक स्पष्ट कर देता।
- source_word: περὶ τούτων
  choice: इन बातों के कारण
  rationale: यह प्रसंग में कारण अथवा अवसर बताता है; बहुवचन τούτων को ‘इन बातों’ से बनाए रखा गया है।
