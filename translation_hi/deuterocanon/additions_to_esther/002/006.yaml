base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: hi
  text: इसलिए हमने हामान—जो राजकीय कार्यों पर नियुक्त था और हमारा दूसरा पिता[b] था—के लिखे हुए दस्तावेज़ों में तुम्हें शब्द लिखवाने वालों[a] को यह निर्देश दिया है कि वे उनके शत्रुओं की तलवारों से उन सबको—स्त्रियों और बच्चों समेत—जड़-मूल से नष्ट कर दें, तनिक भी दया या रियायत किए बिना, इसी वर्तमान वर्ष के बारहवें महीने, अर्थात् अदार की चौदहवीं तारीख को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें बोलकर लिखवाने वाले।” यूनानी कृदंत उन व्यक्तियों को सूचित कर सकता है जो दस्तावेज़ों का मसौदा तैयार करते या उनका शब्दांकन बोलकर लिखवाते थे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “हमारा दूसरा पिता” है। यह हामान के ऊँचे पद को व्यक्त करने वाला दरबारी सम्मानसूचक कथन है।
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: हमने यह निर्देश दिया है
  rationale: दुर्बोध क्रियारूप को राजकीय पत्र के प्रशासनिक संदर्भ के अनुसार निर्देश जारी करने के अर्थ में लिया गया है; अधिक अक्षरशः किंतु अस्पष्ट रूप से बचा गया है।
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: तुम्हारे लिए शब्द लिखवाने वाले अधिकारी
  rationale: ὑπαγορεύω प्रायः किसी लेख का शब्दांकन बोलकर लिखवाने को दर्शाता है। ‘अधिकारी’ संदर्भगत पूर्ति है, जबकि पादटिप्पणी भूमिका की अनिश्चितता बनाए रखती है।
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: हामान द्वारा लिखे गए दस्तावेज़ों में
  rationale: γεγραμμένοις के व्यापक आधिकारिक लिखित अर्थ के लिए ‘दस्तावेज़’ उपयुक्त है और इसे केवल ‘पत्रों’ तक सीमित नहीं करता।
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: राजकीय मामलों पर नियुक्त था
  rationale: वाक्यांश प्रशासनिक कार्यों पर आधिकारिक नियुक्ति दर्शाता है; ‘राजकीय’ संदर्भ को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: हमारा दूसरा पिता
  rationale: असामान्य दरबारी सम्मानसूचक रूपक को व्याख्यात्मक ‘मुख्य सलाहकार’ में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ἀπολέσαι ὁλορριζεί
  choice: जड़-मूल से नष्ट कर दें
  rationale: ἀπολέσαι के विनाश और ὁλορριζεί की पूर्ण उन्मूलन वाली जड़ की छवि दोनों को संक्षिप्त, स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: उनके शत्रुओं की तलवारों से
  rationale: करण कारक और पीड़ितों के शत्रुओं से संबंधित संभावित संबंध दोनों सुरक्षित हैं।
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: तनिक भी दया या रियायत किए बिना
  rationale: οἶκτος की करुणा और φειδώ के बख्शने या रियायत करने के अलग-अलग भावों को बनाए रखा गया है।
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ τοῦ ἐνεστῶτος ἔτους
  choice: इसी वर्तमान वर्ष के बारहवें महीने, अर्थात् अदार की चौदहवीं तारीख को
  rationale: औपचारिक तिथि को स्वाभाविक आधुनिक हिंदी क्रम में प्रस्तुत करते हुए अदार का नाम और बारहवाँ महीना दोनों रखे गए हैं।
theological_decisions:
- issue: राजकीय आदेश में सामूहिक हिंसा की भाषा
  choice: स्त्रियों और बच्चों सहित पूर्ण विनाश की आज्ञा को सीधे और स्पष्ट रूप में अनूदित करना
  alternative: ‘हटा दें’ या ‘उनसे निपटें’ जैसी नरम प्रशासनिक भाषा
  rationale: यूनानी पाठ स्पष्टतः सबके विनाश का आदेश देता है और ‘जड़-मूल से’ तथा ‘दया या रियायत किए बिना’ जोड़ता है; नैतिक कठोरता को नरम करना स्रोत को विकृत करता।
- issue: δευτέρου πατρὸς ἡμῶν का दरबारी रूपक
  choice: ‘हमारा दूसरा पिता’
  alternative: ‘हमारा मुख्य सलाहकार’
  rationale: मूल की असामान्य सम्मानसूचक भाषा और उसकी संभावित व्याख्यात्मक कठिनाई को सुरक्षित रखा गया है, किसी विशेष दरबारी पद को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में औपचारिक राजकीय शैली रखी गई है। हिंसक आदेश को बिना शिष्टोक्ति के व्यक्त किया गया है। लंबे यूनानी वाक्य को हिंदी की स्पष्टता के लिए दो वाक्यों में व्यवस्थित किया गया, किंतु सभी अर्थ-संबंध और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सुरक्षित हैं।
