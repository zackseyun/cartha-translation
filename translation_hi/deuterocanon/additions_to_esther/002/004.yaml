base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: hi
  text: सारे आबाद संसार की सभी जातियों के बीच शत्रुतापूर्ण एक प्रजा घुली-मिली हुई है। वह अपने नियमों में हर जाति के विरुद्ध है[a] और राजाओं की आज्ञाओं की निरन्तर उपेक्षा करती है[b], ताकि हमारे द्वारा निर्दोष रीति से चलाया जा रहा साझा शासन[c] कायम न रह सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियम’ के स्थान पर ‘रीति-रिवाज’ भी सम्भव है; यूनानी νόμοι में दोनों अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी वाक्य-विन्यास संक्षिप्त और कुछ कठिन है। इसका अर्थ राजाओं की आज्ञाओं को ‘दरकिनार करना’ या ‘न मानना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘साझा शासन’ के लिए ‘संयुक्त शासन’ या ‘सामान्य प्रशासन’ भी सम्भव है; यूनानी συναρχία दुर्लभ शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: सारे बसे हुए संसार की सभी जातियों के बीच
  rationale: ‘बसा हुआ संसार’ οἰκουμένη का अर्थ बनाए रखता है, जबकि ‘जातियाँ’ यहाँ φυλαί के जातीय समुदायों वाले व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναμεμιγμένον δυσμενῆ λαόν τινα
  choice: एक शत्रुभाव रखने वाली प्रजा घुली-मिली हुई है
  rationale: ‘घुली-मिली हुई’ ἀναμεμιγμένον के दूसरे समुदायों में मिले होने के भाव को और ‘शत्रुभाव रखने वाली’ δυσμενῆ के आरोपात्मक स्वर को बनाए रखता है। ‘एक ... प्रजा’ τινα की अनिश्चितता को भी व्यक्त करता है।
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: उसके नियम हर जाति के नियमों के विरुद्ध हैं
  rationale: यह ἀντίθετον का विरोधी भाव स्पष्ट करता है। νόμοι का प्राथमिक अनुवाद ‘नियम’ रखा गया है, पर इसका ‘रीति-रिवाज’ वाला व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: वह राजाओं की आज्ञाओं की निरन्तर उपेक्षा करती है
  rationale: παραπέμπω के यहाँ सम्भावित ‘दरकिनार करना/अनदेखा करना’ भाव के लिए ‘उपेक्षा’ स्वाभाविक है। βασιλέων का बहुवचन ‘राजाओं’ के रूप में बनाए रखा गया है।
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: ताकि ... कायम न रह सके
  rationale: यह वाक्यांश उद्देश्य अथवा परिणाम की दिशा बताता है। सन्दर्भ में κατατίθεσθαι को शासन-व्यवस्था के कायम रहने या स्थिर होने से सम्बद्ध समझा गया है, बिना उद्देश्य और परिणाम के तनाव को पूरी तरह मिटाए।
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: हमारे द्वारा निर्दोष ढंग से चलाया जा रहा साझा शासन
  rationale: ‘साझा शासन’ दुर्लभ συναρχία के संयुक्त या सामान्य शासन के भाव को रखता है। ‘निर्दोष ढंग से चलाया जा रहा’ ἀμέμπτως और κατευθυνομένην को स्वाभाविक हिन्दी में जोड़ता है और राजकीय पत्र के आत्मसमर्थक स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय आरोप का राजनीतिक और शत्रुतापूर्ण स्वर
  choice: प्रजा को ‘शत्रुभाव रखने वाली’ बताने और उसके नियमों तथा राजाज्ञाओं के विषय में लगाए गए आरोपों को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे तटस्थ बनाकर ‘भिन्न प्रजा’ या ‘अलग रीति-रिवाजों वाली प्रजा’ कहना।
  rationale: यह कथन राजकीय पत्र में आरोप लगाने वाले वक्ता की भाषा है, निष्पक्ष कथावाचक का निर्णय नहीं। अनुवाद को वक्ता का प्रचारात्मक और विरोधी स्वर न तो नरम करना चाहिए, न उसे धर्मशास्त्रीय तथ्य के रूप में मजबूत करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा’, ‘राजाओं की आज्ञाएँ’ और ‘साझा शासन’ राजकीय पत्र की औपचारिकता बनाए रखते हैं। आरोपात्मक शब्दावली को वक्ता की भाषा के रूप में ज्यों का त्यों रखा गया है।
