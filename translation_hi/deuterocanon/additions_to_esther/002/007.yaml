  text: so that those who were hostile in the past and are hostile now[a], after going down violently to Hades in a single day, may for all time afterward provide us with stable and undisturbed affairs.
translation:
  language: hi
  text: ताकि जो लोग पहले और अब भी विरोधी हैं, वे एक ही दिन हिंसापूर्वक अधोलोक[a] में उतर जाने के बाद, आगे आने वाले समय में सदा हमारे लिए स्थिर और निर्विघ्न परिस्थितियाँ प्रदान करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधोलोक’ अर्थात मृतकों का लोक; इसका अनुवाद ‘कब्र’ या ‘मृतकों का लोक’ भी किया जा सकता है। यूनानी शब्द यहाँ विशेष रूप से अंतिम दण्ड के स्थान को नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσμενεῖς
  choice: विरोधी
  rationale: यह विशेषण दुर्भावना रखने और प्रतिकूल होने का भाव देता है। ‘विरोधी’ औपचारिक शत्रुता को अनावश्यक रूप से निश्चित किए बिना सक्रिय प्रतिकूलता व्यक्त करता है।
- source_word: οἱ πάλαι καὶ νῦν δυσμενεῖς
  choice: जो लोग पहले से और अब भी हमारे विरोधी हैं
  rationale: πάλαι और νῦν का समयगत विरोध बनाए रखा गया है; प्रसंग से स्पष्ट ‘हमारे’ को सहज हिन्दी के लिए व्यक्त किया गया है।
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: एक ही दिन
  rationale: यह पद विनाश की आकस्मिकता और एक दिन में घटित होने पर बल देता है।
- source_word: βιαίως
  choice: हिंसापूर्वक
  rationale: यह क्रियाविशेषण बलपूर्ण और हिंसक अवरोह को बताता है, केवल सामान्य मृत्यु को नहीं।
- source_word: εἰς τὸν ἅδην κατελθόντες
  choice: अधोलोक में उतर जाएँ
  rationale: ᾅδης मृतकों के लोक को सूचित करता है। ‘अधोलोक’ आधुनिक हिन्दी में बोधगम्य है और इसे अंतिम दण्ड के स्थान के रूप में सीमित नहीं करता; κατελθόντες का अवरोह भी सुरक्षित है।
- source_word: εἰς τὸν μετέπειτα χρόνον
  choice: इसके बाद
  rationale: यह शत्रुओं के पतन के बाद आने वाले समय की ओर संकेत करता है। स्थायित्व का बल διὰ τέλους के अनुवाद ‘सदा’ में रखा गया है।
- source_word: εὐσταθῆ καὶ ἀτάραχα
  choice: स्थिर और अशांतिरहित
  rationale: दोनों विशेषण क्रमशः स्थिरता/सुदृढ़ता और उपद्रव से मुक्ति व्यक्त करते हैं; दोनों अलग भाव हिन्दी में बनाए गए हैं।
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: हमारे लिए परिस्थितियाँ ... बनाए रखें
  rationale: τὰ πράγματα यहाँ व्यापक सार्वजनिक स्थिति या परिस्थितियों को बताता है। ‘बनाए रखें’ हिन्दी में कारणात्मक अर्थ और जारी रहने की कामना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διὰ τέλους
  choice: सदा
  rationale: यह पद अंत तक निरंतरता और स्थायी अवधि व्यक्त करता है; ‘सदा’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: यूनानी ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; कब्र
  rationale: मूल में मृतकों के लोक का नाम है, अंतिम दण्ड के स्थान का स्पष्ट उल्लेख नहीं। ‘अधोलोक’ इस व्यापक अर्थ को बनाए रखता है; पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
- issue: शत्रुओं के विनाश और उसके परिणाम के बीच कारणात्मक संबंध
  choice: यूनानी वाक्य की कठोर राजकीय कामना को यथावत रखना
  alternative: भाषा को नरम करके केवल उनकी पराजय कहना
  rationale: βιαίως और εἰς τὸν ἅδην κατελθόντες हिंसक मृत्यु/मृतकों के लोक में अवरोह का प्रबल चित्र देते हैं; इसे नैतिक या धर्मवैज्ञानिक कारण से नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण राजकीय-विनयात्मक स्वर रखा गया है। वाक्य मूल यूनानी की उद्देश्यसूचक संरचना और कठोरता बनाए रखता है, पर ‘परिस्थितियाँ ... बनाए रखें’ के द्वारा हिन्दी प्रवाह स्वाभाविक किया गया है।
