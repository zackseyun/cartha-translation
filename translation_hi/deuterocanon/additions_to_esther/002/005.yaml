  rationale: यह पद शत्रुतापूर्ण राजकीय पत्र का अंश है। अनुवाद वक्ता की कटुता को सुरक्षित रखता है, पर कथावाचक की ओर से उसके आरोपों की पुष्टि नहीं जोड़ता।
- issue: 'राज्य की अस्थिरता: उद्देश्य या परिणाम'
  choice: ‘जिससे राज्य को स्थिरता न मिले’
  alternative: ‘ताकि राज्य को स्थिरता न मिले’ या ‘जिसके परिणामस्वरूप राज्य अस्थिर रहता है’
  rationale: πρὸς τό के प्रयोग में उद्देश्य अथवा परिणाम की छाया हो सकती है। मुख्य पाठ ऐसा संबंध रखता है जो दोनों संभावनाओं को सह सकता है; पादटिप्पणी इस तनाव को स्पष्ट करती है।
