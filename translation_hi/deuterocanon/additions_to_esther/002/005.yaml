  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: hi
  text: इसलिए हमने यह समझ लिया है कि केवल यही जाति हर मनुष्य[a] के विरोध में सदा खड़ी रहती है, अपने नियमों में पराया जीवन-ढंग अपनाती है[b], हमारे मामलों के प्रति दुर्भावना रखती है और घोरतम बुराइयाँ करती है, जिससे राज्य को स्थिरता न मिले[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में एकवचन ‘हर मनुष्य’ है, जिसका अर्थ सामान्य रूप से ‘हर व्यक्ति’ है।
    reason: lexical_alternative
  - marker: b
    text: नियमों और जीवन-ढंग से जुड़ी यूनानी अभिव्यक्ति संक्षिप्त और शत्रुतापूर्ण है; इसमें इस जाति के रीति-रिवाजों को साम्राज्य के लिए पराया बताया गया है।
    reason: cultural_note
  - marker: c
    text: मुख्य पाठ का ‘जिससे’ परिणाम का भाव देता है; इसका अनुवाद ‘ताकि राज्य को स्थिरता न मिले’ भी किया जा सकता है। यूनानी में उद्देश्य और परिणाम—दोनों की छाया हो सकती है।
    reason: ambiguity_note
lexical_decisions:
- source_word: διειληφότες
  choice: हमने यह समझ लिया है
  rationale: यह पूर्ण कृदन्त राजकीय पत्र में एक ठहराए हुए निष्कर्ष को प्रस्तुत करता है। ‘समझ लिया है’ बोध और निष्कर्ष—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे औपचारिक आदेश नहीं बनाता।
- source_word: ἔθνος
  choice: जाति
  rationale: यहाँ शब्द एक पहचाने जाने वाले जातीय-सामुदायिक समूह के लिए प्रयुक्त है। ‘जाति’ आधुनिक हिन्दी बाइबलीय गद्य में इस राजनीतिक-जातीय अर्थ को व्यक्त करती है; यहाँ इसका आशय सामाजिक वर्ण या उपजाति नहीं है।
- source_word: μονώτατον
  choice: केवल यही
  rationale: अतिशयोक्तिपरक रूप इस समुदाय को अकेला और अपवादस्वरूप ठहराता है। ‘केवल यही’ आरोप की विशिष्टता को स्पष्ट रखता है।
- source_word: ἐν ἀντιπαραγωγῇ ... κείμενον
  choice: विरोध में खड़ी रहती है
  rationale: यह वाक्यांश लगातार बनी हुई विरोधी स्थिति दर्शाता है। स्त्रीलिंग ‘खड़ी रहती है’ हिन्दी में ‘जाति’ से स्वाभाविक रूप से मेल खाता है।
- source_word: παντὶ διὰ παντὸς ἀνθρώπῳ
  choice: सदा हर मनुष्य
  rationale: παντὶ ἀνθρώπῳ एकवचन में सामान्य मानवीय अर्थ रखता है और διὰ παντός निरंतरता बताता है। ‘सदा हर मनुष्य’ दोनों तत्व सुरक्षित रखता है।
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: अपने नियमों में एक पराया जीवन-ढंग ले आती है
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और आरोपपूर्ण है; वह नियमों तथा साम्राज्य को पराये लगने वाले जीवन-व्यवहार को जोड़ती है। हिन्दी रूप दोनों आयाम रखता है और अस्पष्ट वाक्यांश को अनावश्यक रूप से ‘नियम बदलना’ नहीं बनाता।
- source_word: δυσονοοῦν
  choice: दुर्भाव रखती है
  rationale: यह शब्द प्रतिकूल मानसिकता या वैरपूर्ण अभिप्राय दर्शाता है। ‘दुर्भाव रखती है’ औपचारिक होते हुए भी सामान्य पाठक के लिए स्पष्ट है।
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: हमारे मामलों के प्रति
  rationale: यह व्यापक रूप से राजा और शासन के हितों तथा कार्यों की ओर संकेत करता है। ‘हमारे मामलों’ से वह व्यापकता बनी रहती है।
- source_word: τὰ χείριστα συντελοῦν κακὰ
  choice: घोरतम बुराइयाँ करती है
  rationale: χείριστα की तीव्र आरोपात्मक शक्ति ‘घोरतम’ में बनी रहती है, और συντελοῦν का कार्यकारी भाव ‘करती है’ से सहज हिन्दी में आता है।
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: जिससे राज्य को स्थिरता न मिले
  rationale: यह कथित आचरण को राज्य की अस्थिरता से जोड़ता है। ‘जिससे’ प्रयोजन और परिणाम के बीच यूनानी की संभावित लचक को पूरी तरह बंद नहीं करता।
