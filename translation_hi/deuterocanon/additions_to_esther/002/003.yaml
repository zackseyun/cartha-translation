  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: hi
  text: और जब मैंने अपने सलाहकारों से पूछा कि इसे किस प्रकार पूरा किया जा सकता है, तब हामान ने हमें उपाय बताया[a]। वह हमारे बीच विवेक में श्रेष्ठ था, सद्भावना में अटल और दृढ़ निष्ठावान सिद्ध हुआ था, और उसने राज्य में सम्मान का दूसरा स्थान प्राप्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हामान ने हमें दिखाया” अथवा “हामान ने हमें बता दिया।” यूनानी में “इसे किस प्रकार पूरा किया जा सकता है” के बाद ‘दिखाया’ क्रिया का कर्म स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: जब मैंने अपने मंत्रियों से पूछा
  rationale: संबंधवाचक स्वतंत्र पदबंध पूछताछ की परिस्थिति बताता है। राजदरबार के प्रसंग में συμβούλων के लिए ‘मंत्रियों’ स्वाभाविक और स्पष्ट है।
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: इसे किस प्रकार पूरा किया जा सकता है
  rationale: यह अनुवाद संभावनार्थक और कर्मवाच्य भाव के साथ किसी विषय को उसके लक्ष्य तक पहुँचाने का अर्थ सुरक्षित रखता है।
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: वह हमारे बीच विवेक में श्रेष्ठ था
  rationale: राजकीय-प्रशासनिक प्रशंसा में σωφροσύνη का अर्थ विवेक या समझदारी है, और διενέγκας श्रेष्ठता अथवा विशिष्टता दर्शाता है।
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: उसका सद्भाव अपरिवर्तनशील
  rationale: εὔνοια के लिए ‘सद्भाव’ और ἀπαραλλάκτως के लिए ‘अपरिवर्तनशील’ मूल के स्थिर, न बदलने वाले भाव को रखते हैं।
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: उसकी निष्ठा दृढ़ प्रमाणित हुई थी
  rationale: यहाँ πίστις धार्मिक विश्वास नहीं, राजकीय सेवा में विश्वसनीय निष्ठा है; βεβαίᾳ और ἀποδεδειγμένος उसकी दृढ़ता और प्रमाणित चरित्र को व्यक्त करते हैं।
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: उसे राज्य में दूसरे स्थान का सम्मान मिला था
  rationale: γέρας सम्मान या विशेष प्रतिष्ठा है; दूसरा स्थान कहने से हामान की राजा के ठीक नीचे की उच्च राजकीय स्थिति आधुनिक हिन्दी में स्पष्ट होती है।
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: हामान ने हमें उपाय बताया
  rationale: क्रिया का कर्म यूनानी में अप्रकट है और पिछली बात—कार्य कैसे पूरा हो—से समझा जाता है। ‘उपाय बताया’ हिन्दी में इस लोप को सहज बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: गैर-धार्मिक राजदरबारी प्रसंग में πίστις का अनुवाद
  choice: निष्ठा
  alternative: विश्वास / विश्वासयोग्यता
  rationale: वक्ता हामान के धार्मिक विश्वास की नहीं, राजकीय सेवा में उसकी प्रमाणित वफादारी और भरोसेमंदी की प्रशंसा कर रहा है; इसलिए ‘निष्ठा’ प्रसंगानुकूल है।
- issue: ἐπεδείξεν के अप्रकट कर्म की प्रस्तुति
  choice: उपाय बताया
  alternative: हमें दिखाया / हमें बता दिया
  rationale: मूल में प्रत्यक्ष कर्म नहीं है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए पूर्ववर्ती प्रश्न से समझा जाने वाला ‘उपाय’ रखा गया है, और अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण राजकीय गद्य। वाक्य को हिन्दी में पठनीय बनाने के लिए यूनानी के लंबे कृदंत-क्रम को अलग वाक्य में रखा गया है। ‘मंत्रियों’, ‘विवेक’, ‘सद्भाव’ और ‘निष्ठा’ सामान्य पाठक के लिए स्पष्ट हैं और दरबारी संदर्भ बनाए रखते हैं।
