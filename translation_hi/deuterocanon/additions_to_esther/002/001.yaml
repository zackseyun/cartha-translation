base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
translation:
  language: hi
  text: 'और पत्र की प्रति यह है: महान राजा अर्तक्षत्र भारत से लेकर कूश तक के एक सौ सत्ताईस प्रदेशों के शासकों और स्थानीय शासकों को, जो उसके अधीन हैं, यह लिखता है:[b][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्षेत्रों” अथवा “देशों”; यूनानी शब्द का अर्थ अधिक व्यापक है, यद्यपि यहाँ संदर्भ साम्राज्य के प्रशासन का है।
    reason: lexical_alternative
  - marker: b
    text: “यह लिखता है” का अनुवाद “इस प्रकार लिखता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: पत्र
  rationale: यह यूनानी शब्द सामान्यतः लिखित संदेश या पत्र को दर्शाता है; ‘पत्र’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἀντίγραφον
  choice: प्रति
  rationale: दस्तावेज़ की नकल या प्रतिलिपि के अर्थ में ‘प्रति’ औपचारिक और स्वाभाविक हिन्दी है।
- source_word: Βασιλεὺς μέγας
  choice: महान राजा
  rationale: यह राजकीय उपाधि है; ‘महान राजा’ उसके औपचारिक स्वर को बनाए रखता है।
- source_word: Ἀρταξέρξης
  choice: अर्तक्षत्र
  rationale: हिन्दी बाइबल परंपरा में प्रचलित राजकीय नाम-रूप अपनाया गया है।
- source_word: χωρῶν
  choice: प्रदेशों
  rationale: शब्द का अर्थ भूमि, क्षेत्र या प्रदेश हो सकता है; साम्राज्य के प्रशासनिक संदर्भ में ‘प्रदेश’ उपयुक्त है, जबकि व्यापक अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: ἄρχουσι
  choice: शासकों
  rationale: यह अधिकार चलाने वालों के लिए व्यापक पद है और अगले अधिक स्थानीय पद से भेद बनाए रखता है।
- source_word: τοπάρχαις
  choice: स्थानीय अधिकारियों
  rationale: यह किसी स्थान या जिले पर अधिकार रखने वाले पदाधिकारी को दर्शाता है; यह अनुवाद सामान्य पाठक के लिए स्पष्ट है और ‘शासकों’ से अलग प्रशासनिक भूमिका बताता है।
- source_word: ὑποτεταγμένοις
  choice: अपने अधीन
  rationale: कृदंत राजकीय अधीनता व्यक्त करता है; हिन्दी में इसे संबोधित अधिकारियों के साथ जोड़ना स्वाभाविक है।
- source_word: τάδε γράφει
  choice: यह लिखता है
  rationale: मूल के औपचारिक सूत्र को निकटता से रखता है; ‘इस प्रकार लिखता है’ भी सम्भव है।
- source_word: Αἰθιοπίας
  choice: कूश
  rationale: यहाँ Αἰθιοπία प्राचीन नील-घाटी के दक्षिणी भूभाग को सूचित करती है; आधुनिक देश इथियोपिया से सीधे समानता का भ्रम टालने के लिए बाइबलीय भू-नाम ‘कूश’ चुना गया है।
theological_decisions:
- issue: द्वितीयकानूनी आख्यान में राजकीय उपाधि और प्रशासनिक भाषा
  choice: पद को औपचारिक शाही पत्र के आरम्भ के रूप में अनूदित किया गया है, बिना किसी बाद की ऐतिहासिक या धर्मवैज्ञानिक सामंजस्य-स्थापना के।
  alternative: इसे सामान्य राजकीय घोषणा के रूप में अधिक स्वतंत्रता से व्यक्त करना।
  rationale: मूल पाठ प्रशासनिक और आख्यानात्मक है। अनुवाद उसके औपचारिक स्वर और पदों के भेद को सुरक्षित रखता है तथा स्रोत से बाहर कोई व्याख्यात्मक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, औपचारिक राजकीय शैली रखी गई है। पत्र के उद्धरण को स्पष्ट करने के लिए हिन्दी उद्धरण-चिह्न लगाए गए हैं। ‘अपने अधीन’ को प्राकृतिक हिन्दी वाक्य-विन्यास के अनुसार दोनों प्रकार के अधिकारियों से जोड़ा गया है।
