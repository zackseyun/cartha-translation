    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  choice: जल्दबाज़ी से आगे बढ़ाया जा रहा था
  rationale: अपूर्ण भूतकाल का कर्मवाच्य रूप किसी जारी प्रक्रिया को तेज़ी से आगे बढ़ाए जाने का भाव देता है। यह अनुवाद तत्परता और कर्मवाच्यता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τὸ πρᾶγμα
  choice: वह काम
  rationale: यूनानी पद सामान्य रूप से किसी काम, मामले या कार्यवाही को सूचित करता है। संदर्भ में राजकीय आदेश है, पर मूल संज्ञा को उससे अधिक विशिष्ट न बनाते हुए ‘वह काम’ सहज और व्यापक है।
- source_word: καὶ εἰς Σουσάν
  choice: शूशन में भी
  rationale: यह वाक्यांश उस कार्यवाही के शूशन तक भी पहुँचने को दर्शाता है। हिन्दी में ‘शूशन में भी’ इसी विस्तार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκωθωνίζοντο
  choice: भोजन के लिए गद्दियों पर टिके हुए थे
  rationale: क्रिया औपचारिक भोजन के समय आसनों या भोजन-गद्दियों पर टिककर खाने की प्राचीन रीति का चित्र प्रस्तुत करती है। यह रूप केवल ‘दावत कर रहे थे’ की अपेक्षा उस सांस्कृतिक मुद्रा को अधिक स्पष्टता से बचाए रखता है।
- source_word: ἐταράσσετο
  choice: खलबली मची हुई थी
  rationale: अपूर्ण भूतकाल नगर की जारी व्याकुलता और अव्यवस्था को दर्शाता है। ‘खलबली मची हुई थी’ आधुनिक हिन्दी में सामूहिक अशांति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ πόλις
  choice: नगर
  rationale: πόλις का सीधा अर्थ नगर है; संदर्भ में इससे शूशन और उसके निवासी सामूहिक रूप से अभिप्रेत हो सकते हैं, और ‘नगर’ इस अर्थ-व्याप्ति को बनाए रखता है।
