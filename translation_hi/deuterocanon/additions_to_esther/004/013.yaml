- source_word: ἄγγελον θεοῦ
  choice: परमेश्वर के एक स्वर्गदूत
  rationale: निर्देशक पद के अभाव के कारण अनिश्चित अर्थ स्वाभाविक है; प्रसंग में स्वर्गीय तेज और विस्मय के कारण ‘स्वर्गदूत’ उपयुक्त है।
- source_word: ἐταράχθη ἡ καρδία μου
  choice: मेरा हृदय घबरा उठा
  rationale: यह हृदय की भीतरी व्याकुलता का स्वाभाविक हिन्दी रूप है और साथ आने वाले भय को अत्यधिक दोहराने से बचाता है।
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: आपके तेज के भय से
  rationale: यह भय को व्याकुलता का कारण बताता है और δόξα के यहाँ दिखाई देने वाले राजसी वैभव या तेज के अर्थ को स्पष्ट रखता है।
