  choice: मानवीय राजा के लिए ‘हे स्वामी’
  alternative: ‘हे प्रभु’
  rationale: तात्कालिक प्रसंग एस्तेर द्वारा राजा को देखकर भयभीत होने का है। ‘स्वामी’ सम्मान बनाए रखते हुए संबोधित व्यक्ति को परमेश्वर मान लेने का संकेत नहीं देता।
- issue: ὡς ἄγγελον θεοῦ में तुलना या पहचान
  choice: ‘परमेश्वर के एक स्वर्गदूत के समान’—तुलनात्मक अर्थ
  alternative: ‘परमेश्वर के एक स्वर्गदूत के रूप में’
  rationale: ὡς में कुछ भाषिक लचीलापन है, पर यहाँ आशय स्वर्गदूत से समानता का है, उस व्यक्ति की स्वर्गदूत के रूप में पहचान का नहीं।
