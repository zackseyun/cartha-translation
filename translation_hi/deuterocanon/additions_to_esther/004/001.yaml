  yaml_path: translation/deuterocanon/additions_to_esther/004/001.yaml
  text: And it happened on the third day[a], when she had stopped praying, that she took off the garments of her service and put on her splendor[b];
translation:
  language: hi
  text: तीसरे दिन, जब उसने प्रार्थना करना समाप्त किया, तब उसने सेवा के वस्त्र[a] उतार दिए और अपना वैभव[b] धारण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी उपासना अथवा परिचर्या के वस्त्र।’ यूनानी शब्द सेवा, परिचर्या या भक्तिपरक साधना को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी महिमा।’ यहाँ आशय संभवतः उसकी भव्य राजसी वेशभूषा या शोभा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγενήθη
  choice: तब
  rationale: यूनानी कथात्मक सूत्र को स्वाभाविक हिन्दी संक्रमण के रूप में व्यक्त करता है; अलग से ‘ऐसा हुआ’ कहना यहाँ अनावश्यक रूप से भारी होता।
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: समय बताने वाली यूनानी अभिव्यक्ति का सहज और सटीक हिन्दी रूप।
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: जब उसने प्रार्थना करना समाप्त किया
  rationale: प्रार्थना की क्रिया अगली कार्रवाइयों से पहले पूरी होने का भाव स्पष्ट रखता है।
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: वस्त्र उतार दिए
  rationale: कपड़े उतारने की क्रिया को गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῆς θεραπείας
  choice: सेवा के
  rationale: θεραπεία के व्यापक अर्थ—सेवा, परिचर्या अथवा भक्तिपरक साधना—को किसी एक विशिष्ट धार्मिक क्रिया तक सीमित नहीं करता।
- source_word: περιεβάλετο
  choice: धारण किया
  rationale: वस्त्र पहनने के आशय को प्रसंगानुकूल, संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὴν δόξαν αὐτῆς
  choice: अपना वैभव
  rationale: यहाँ δόξα संभवतः एस्तेर की दिखाई देने वाली राजसी शोभा अथवा भव्य वेशभूषा को सूचित करता है; ‘वैभव’ उस भाव को ‘महिमा’ की अपेक्षा कम अमूर्त रूप में देता है।
theological_decisions:
- issue: एस्तेर के बदले हुए वस्त्रों के संबंध में τῆς θεραπείας का अर्थ
  choice: सेवा के वस्त्र
  alternative: उपासना के वस्त्र; परिचर्या के वस्त्र; भक्तिपरक साधना के वस्त्र
  rationale: यूनानी पद सेवा, परिचर्या या भक्तिपरक आचरण का बोध करा सकता है। निकटवर्ती प्रसंग प्रार्थना का है, पर पाठ किसी औपचारिक उपासना-पद्धति को स्पष्ट नहीं करता; इसलिए मुख्य पाठ व्यापक रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- issue: τὴν δόξαν αὐτῆς का संदर्भ
  choice: अपना वैभव
  alternative: अपनी महिमा
  rationale: राजा के सामने जाने के लिए वस्त्र बदलने के प्रसंग में यह पद राजसी वेशभूषा और बाहरी शोभा की ओर संकेत करता है। फिर भी ‘महिमा’ शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘धारण किया’ दृश्य के राजसी परिवेश के अनुकूल है, जबकि अस्पष्ट यूनानी पदों के वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
