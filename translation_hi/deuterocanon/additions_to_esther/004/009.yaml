    reason: alternative_reading
lexical_decisions:
- source_word: Τί ἐστιν
  choice: क्या बात है?
  rationale: यूनानी मुहावरेदार प्रश्न का यह स्वाभाविक आधुनिक हिन्दी रूप है। अधिक शब्दशः ‘क्या है?’ सम्भव है, पर इस प्रसंग में कम स्वाभाविक है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: ἀδελφός
  choice: भाई
  rationale: यूनानी शब्द का सीधा अर्थ ‘भाई’ है। प्रसंग में इसका व्यापक अर्थ ‘कुटुम्बी’ हो सकता है, फिर भी मुख्य पाठ में मूल पारिवारिक पद सुरक्षित रखा गया है।
- source_word: θάρσει
  choice: हिम्मत रखो
  rationale: यह साहस या भरोसा रखने की आज्ञा है। ‘हिम्मत रखो’ सहज, वर्तमान हिन्दी में आश्वासन और प्रोत्साहन—दोनों का भाव देता है।
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: मैं तुम्हारा भाई हूँ
  rationale: पूर्ण हिन्दी वाक्य स्पष्ट सर्वनाम के कारण यूनानी अभिव्यक्ति के बल और आश्वासन को बनाए रखता है।
theological_decisions:
- issue: वक्ता द्वारा एस्तेर के लिए प्रयुक्त पारिवारिक सम्बन्ध
  choice: मुख्य पाठ में शाब्दिक ‘भाई’ रखा गया है।
  alternative: ‘कुटुम्बी’ या ‘रिश्तेदार’
  rationale: यूनानी में स्पष्टतः ‘भाई’ है, किंतु यह पद कभी व्यापक पारिवारिक सम्बन्ध भी बता सकता है। अनुवाद मुख्य पाठ में मूल शब्द को रखता और पादटिप्पणी में व्यापक अर्थ की सम्भावना बताता है, इसलिए सम्बन्ध को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘हिम्मत रखो’ सामान्य पाठक के लिए स्वाभाविक है, और मुख्य पाठ तथा दोनों पादटिप्पणी-चिह्नों का मेल सुरक्षित रखा गया है।
