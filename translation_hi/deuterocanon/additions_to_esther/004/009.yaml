  language: hi
  text: और उसने उससे कहा, “एस्तेर, क्या बात है?[a] मैं तुम्हारा भाई हूँ[b]; हिम्मत रखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
