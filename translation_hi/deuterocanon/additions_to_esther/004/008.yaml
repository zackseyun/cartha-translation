  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: hi
  text: और परमेश्वर ने राजा के मन को कोमल कर दिया[a]। तब राजा व्याकुल होकर अपने सिंहासन से झट उठ खड़ा हुआ और उसने उसे अपनी बाँहों में थाम लिया, जब तक कि वह सँभल न गई[b]; और वह शान्ति भरे शब्दों से उसे ढाढ़स बँधाता रहा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा की आत्मा को नम्रता में बदल दिया”; यहाँ “आत्मा” का अर्थ उसकी मनोदशा या मनोवृत्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब तक कि वह फिर स्थिर न हो गई”; अथवा, “जब तक कि वह स्वस्थ न हो गई।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “शान्ति के शब्दों से”; अर्थात आश्वासन भरे शब्दों से।
    reason: lexical_alternative
