- issue: राजा की भीतरी मनोदशा पर परमेश्वर की क्रिया
  choice: परमेश्वर ने राजा के मन को कोमल कर दिया
  alternative: परमेश्वर ने राजा की आत्मा/मनोवृत्ति को नम्रता की ओर फेर दिया
  rationale: यूनानी पाठ राजा के बदले हुए व्यवहार का कारण सीधे परमेश्वर को ठहराता है। मुख्य पाठ इस दैवी क्रिया को स्पष्ट रखता है, पर πνεῦμα को किसी तकनीकी मनोवैज्ञानिक या सिद्धान्तगत अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। लंबे यूनानी समन्वित वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘ढाढ़स बँधाता रहा’ अपूर्णकालीन क्रिया की निरंतरता दर्शाता है, और पादटिप्पणियाँ πνεῦμα, κατέστη तथा λόγοις εἰρηνικοῖς की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती हैं।
