translation:
  language: hi
  text: क्योंकि हे प्रभु, आप अद्भुत हैं, और आपका मुख[क] अनुग्रह से भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘आपकी उपस्थिति अनुग्रह से परिपूर्ण है’ अथवा ‘आपका मुखमंडल कृपालुता से भरा है।’
    reason: πρόσωπον के लिए ‘मुख’ के अतिरिक्त ‘उपस्थिति/मुखमंडल’ और χαρίτων के लिए ‘अनुग्रह’ के अतिरिक्त ‘कृपालुता’ संभावित हैं; मुख्य पाठ मूल के प्रत्यक्ष ‘मुख’ बिंब को रखता है।
lexical_decisions:
- source_word: θαυμαστὸς
  choice: अद्भुत
  rationale: यह विशेषण विस्मयकारी या आश्चर्य के योग्य होने का भाव देता है। ‘अद्भुत’ आधुनिक हिन्दी में स्वाभाविक है और श्रद्धापूर्ण विस्मय बनाए रखता है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को किया गया सीधा संबोधन है। ‘हे प्रभु’ प्रार्थना के प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: πρόσωπόν
  choice: मुख
  rationale: यूनानी शब्द का सीधा अर्थ ‘मुख’ है। यह मूल की सजीव मानवीय उपमा को ‘उपस्थिति’ जैसे अमूर्त अर्थ में बदले बिना सुरक्षित रखता है।
- source_word: χαρίτων
  choice: अनुग्रह
  rationale: χάρις का बहुवचन अनुग्रह, कृपाएँ अथवा कृपापूर्ण गुण सूचित कर सकता है। हिन्दी में ‘अनुग्रह’ यहाँ सामूहिक अर्थ में स्वाभाविक है और भक्तिपूर्ण भाव बनाए रखता है।
- source_word: μεστόν
  choice: से भरा है
  rationale: यह विशेषण परिपूर्ण या भरा हुआ होने का अर्थ देता है; इस वाक्य में ‘से भरा है’ सहज हिन्दी प्रयोग है।
theological_decisions:
- issue: परमेश्वर के लिए ‘आपका मुख’ का मानवरूपी वर्णन
  choice: ‘आपका मुख’ को यथावत रखना
  alternative: ‘आपकी उपस्थिति’
  rationale: मूल यूनानी πρόσωπον का सीधा प्रयोग करता है। अनुवाद इस बिंब को अमूर्त धर्मवैज्ञानिक व्याख्या में बदलने के बजाय सुरक्षित रखता है।
- issue: परमेश्वर के मुख के वर्णन में χάρις
  choice: ‘अनुग्रह’
  alternative: ‘कृपा’ अथवा ‘कृपालुता’
  rationale: शब्द अनुग्रह, कृपा या कृपापूर्ण गुणों का अर्थ दे सकता है। ‘अनुग्रह’ मूल की व्यापक अर्थ-संभावना और धर्मवैज्ञानिक प्रतिध्वनि को स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। परमेश्वर के संबोधन में आदरसूचक ‘आप’ रखा गया है। मूल के ‘मुख’ बिंब और χάρις के सामूहिक भाव को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
