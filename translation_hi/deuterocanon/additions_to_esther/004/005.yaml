    reason: lexical_alternative
  - marker: b
    text: या, “उसका चेहरा उज्ज्वल और मनभावन था।” यूनानी वाक्यांश का अधिक शाब्दिक अर्थ “मानो प्रिय हो” भी हो सकता है।
    reason: lexical_alternative
