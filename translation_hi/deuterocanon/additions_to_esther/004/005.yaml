  text: अपनी सुंदरता के पूरे निखार में वह लाल हो रही थी[a], और उसका चेहरा प्रसन्न था, मानो वह मनभावन हो[b]; पर भय से उसका हृदय सिकुड़ा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
