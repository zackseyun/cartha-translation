- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: पूरी तरह सोने और बहुमूल्य पत्थरों से ढका हुआ था
  rationale: खंडित यूनानी वाक्य में वस्त्र का स्पष्ट उल्लेख नहीं है। यह अनुवाद वैभवपूर्ण बाहरी स्वरूप को स्वाभाविक हिन्दी में व्यक्त करता है, पर किसी विशेष परिधान की कल्पना नहीं जोड़ता।
- source_word: φοβερὸς σφόδρα
  choice: अत्यन्त भयावह
  rationale: यह राजा के स्वरूप से उत्पन्न गहरे भय को व्यक्त करता है; ‘भयावह’ यूनानी विशेषण की तीव्रता बनाए रखता है।
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: अपना चेहरा उठाया
  rationale: शारीरिक क्रिया का सजीव और निकट अनुवाद है; इसे केवल ‘ऊपर देखा’ कहकर संक्षिप्त नहीं किया गया।
- source_word: πεπυρωμένον δόξῃ
  choice: तेज से धधकता
  rationale: πεπυρωμένον की अग्निमय छवि और δόξα के दीप्तिमान वैभव—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: क्रोध की पराकाष्ठा में
  rationale: ἀκμή चरम बिंदु या सर्वोच्च तीव्रता बताता है; यह पदबंध उसी भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: मूर्छित होते हुए उसका रंग बदल गया
  rationale: रंग बदलने और शक्ति चुकने अथवा मूर्छा आने के परस्पर जुड़े भावों को सहज हिन्दी में रखता है, बिना इसे केवल ‘पीली पड़ गई’ तक सीमित किए।
- source_word: κατέκυψεν
  choice: झुक गई
  rationale: यह अनैच्छिक ढंग से नीचे झुकने या लुढ़कने जैसी शारीरिक गति को व्यक्त करता है और जानबूझकर प्रणाम करने का भाव नहीं लाता।
- source_word: ἅβρας
  choice: सुकुमारी
  rationale: ἁβρός में कोमलता, नज़ाकत और परिष्कृत अवस्था का भाव है; ‘सुकुमारी’ प्रसंग के अनुरूप गरिमापूर्ण और बोधगम्य है।
- source_word: τῆς προπορευομένης
  choice: अपने आगे चल रही
  rationale: यह जुलूस में रानी से आगे चलने वाली दासी की स्थिति को सहज आधुनिक हिन्दी में स्पष्ट करता है।
