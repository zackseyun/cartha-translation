  text: '...entirely covered with gold and costly stones, and he was very terrifying. And lifting up his face, blazing with splendor at the height of anger, he looked; and the queen fell and changed color in faintness, and she bent down upon the head of the delicate maidservant who was going before her.'
translation:
  language: hi
  text: …[a] पूरी तरह सोने और बहुमूल्य पत्थरों से ढका हुआ था[b], और वह अत्यन्त भयावह था। और उसने तेज से धधकता अपना चेहरा उठाया और क्रोध की पराकाष्ठा में देखा। रानी गिर पड़ी; मूर्छित होते हुए उसका रंग बदल गया[c], और वह अपने आगे चल रही सुकुमारी दासी के सिर पर झुक गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध यूनानी पाठ का आरम्भ वर्णन के बीच से होता है। इसलिए यहाँ लुप्त शब्दों का अनुमान लगाने के बजाय त्रिबिंदु दिया गया है।
    reason: textual_variant
  - marker: b
    text: या, “पूरा का पूरा सोने और बहुमूल्य पत्थरों से सजा हुआ था।”
    reason: lexical_alternative
  - marker: c
    text: या, “मूर्छा आने पर उसका रंग बदल गया।”
    reason: lexical_alternative
