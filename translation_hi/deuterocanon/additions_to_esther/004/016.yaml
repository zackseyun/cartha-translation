  rationale: अपूर्णकालीन रूप राजा की जारी आंतरिक अशांति व्यक्त करता है। ‘व्याकुल था’ स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है, बिना इसे घबराहट या आतंक तक बढ़ाए।
- source_word: θεραπεία
  choice: सेवक
  rationale: राजदरबार के इस प्रसंग में यह सामूहिक रूप से राजा की व्यक्तिगत सेवा और परिचर्या में रहनेवालों को दर्शाता है। ‘सभी सेवक’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: παρεκάλει
  choice: ढाढ़स बँधा रहे थे
  rationale: παρακαλέω प्रोत्साहन देने, आग्रह करने या सांत्वना देने का अर्थ रख सकता है। इस प्रसंग में स्त्री की व्याकुल दशा के प्रति सहायक प्रतिक्रिया के रूप में ‘ढाढ़स बँधा रहे थे’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  choice: उसके सभी सेवक
  rationale: यह पदबंध राजा की सेवा में उपस्थित पूरे सेवक-वर्ग का सामूहिक उल्लेख करता है।
