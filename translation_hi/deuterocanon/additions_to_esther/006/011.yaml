  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: hi
  text: टॉलेमी और क्लियोपेट्रा के शासन के चौथे वर्ष में, दोसिथियुस, जिसने कहा कि वह याजक और लेवी था, और उसका पुत्र टॉलेमी, निम्नलिखित पूरीम-पर्व का पत्र लेकर आया।[a] उन्होंने कहा कि यह पत्र उपलब्ध था और यरूशलेम में रहने वालों में से टॉलेमी के पुत्र लिसिमाखुस ने इसका अनुवाद किया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘फ्रूराइया का’; यहाँ यह पूरीम पर्व के लिए प्रयुक्त यूनानी नाम है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने कहा कि यह पत्र विद्यमान था और टॉलेमी के पुत्र लिसिमाखुस ने इसका अनुवाद किया था।” यूनानी वाक्य बहुत संक्षिप्त है और पत्र की प्रामाणिकता के बजाय उसके अस्तित्व या उपलब्धता पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: टॉलेमी और क्लियोपेट्रा के शासन के चौथे वर्ष में
  rationale: यूनानी काल-सूचक रचना को स्वाभाविक आधुनिक हिन्दी में रखते हुए दोनों शासकों के संयुक्त शासन-संदर्भ को सुरक्षित रखा गया है।
- source_word: εἰσήνεγκεν
  choice: लेकर आए
  rationale: क्रिया का मूल भाव किसी दस्तावेज़ को सामने लाने या प्रस्तुत करने का है; बहुवचन कर्ताओं के कारण हिन्दी में स्वाभाविक बहुवचन प्रयोग किया गया है।
- source_word: ὃς ἔφη εἶναι ἱερεὺς καὶ Λευείτης
  choice: जिसने कहा कि वह याजक और लेवी था
  rationale: ἔφη को संदेहसूचक ‘दावा किया’ न बनाकर तटस्थ ‘कहा’ रखा गया है और καί से जुड़े दोनों पदों को यथावत रखा गया है।
- source_word: τὴν προκειμένην ἐπιστολὴν τῶν Φρουραίων
  choice: पूरीम पर्व से संबंधित यह पत्र
  rationale: προκειμένην का पाठक के सामने उपस्थित दस्तावेज़ वाला संकेत ‘यह पत्र’ से व्यक्त होता है; Φρουραίων का संदर्भ स्पष्ट करने के लिए परिचित नाम ‘पूरीम पर्व’ दिया गया है।
- source_word: ἣν ἔφασαν εἶναι
  choice: उन्होंने कहा कि यह पत्र उपलब्ध था
  rationale: संक्षिप्त यूनानी वाक्यांश दस्तावेज़ के अस्तित्व या उपलब्ध होने की बात कह सकता है। ‘उपलब्ध था’ प्रामाणिकता का अतिरिक्त दावा किए बिना इस अर्थ को व्यक्त करता है।
- source_word: καὶ ἑρμηνευκέναι
  choice: और ... ने इसका अनुवाद किया था
  rationale: दस्तावेज़ीय संदर्भ में ἑρμηνεύω का सर्वाधिक संभावित अर्थ ‘अनुवाद करना’ है।
- source_word: Λυσίμαχον Πτολεμαίου τῶν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में रहनेवालों में से टॉलेमी के पुत्र लिसिमाखुस
  rationale: Πτολεμαίου को स्वाभाविक वंश-सूचक संबंध और τῶν ἐν Ἰερουσαλήμ को समूह-संबंध के रूप में अनूदित किया गया है।
theological_decisions:
- issue: ὃς ἔφη εἶναι में तटस्थ सूचना या संदेह का भाव
  choice: जिसने कहा कि वह
  alternative: जिसने दावा किया कि वह
  rationale: यूनानी क्रिया तटस्थ या हल्का संदेहसूचक हो सकती है; मुख्य पाठ में अनावश्यक संशय आरोपित न करने के लिए तटस्थ रूप चुना गया है।
- issue: τῶν Φρουραίων की पहचान
  choice: पूरीम पर्व से संबंधित
  alternative: फ्रूराइया से संबंधित
  rationale: यह एस्तेर की यूनानी परंपरा में पूरीम का यूनानी नाम है। मुख्य पाठ में पाठक के लिए परिचित संदर्भ दिया गया है और मूल पद पादटिप्पणी में सुरक्षित है।
- issue: ἣν ἔφασαν εἶναι का आशय
  choice: यह पत्र उपलब्ध था
  alternative: यह पत्र विद्यमान था / यह पत्र प्रामाणिक था
  rationale: वाक्यांश संक्षिप्त और अर्थ की दृष्टि से तनावपूर्ण है। ‘उपलब्ध’ अस्तित्व/प्राप्यता का न्यूनतम दावा रखता है, जबकि ‘प्रामाणिक’ स्रोत से अधिक कहेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण दस्तावेज़ीय लहजा अपनाया गया है। व्यक्तिनामों के प्रचलित देवनागरी लिप्यंतरण रखे गए हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, बिना उसके तथ्यात्मक संबंध बदले।
