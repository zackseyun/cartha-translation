lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक; इसमें अतिरिक्त कालगत अर्थ नहीं जोड़ा गया।
- source_word: εἶπεν
  choice: ने कहा
  rationale: λέγω के एओरिस्ट रूप का सहज कथात्मक अनुवाद।
- source_word: Μαρδοχαῖος
  choice: मोर्दकै
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Παρὰ τοῦ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: सम्बन्धकारक के साथ παρά स्रोत या उद्गम बताता है; यह वाक्यांश घटनाओं का स्रोत परमेश्वर को ठहराता है, पर कार्य-प्रणाली को अधिक स्पष्ट नहीं करता।
- source_word: ἐγένετο
  choice: हुई हैं
  rationale: γίνομαι यहाँ घटनाओं के घटित होने को व्यक्त करता है; हिन्दी में बहुवचन स्त्रीलिंग ‘बातें’ के साथ ‘हुई हैं’ स्वाभाविक है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का अर्थ सुरक्षित रखते हुए पूर्ववर्ती घटनाओं की ओर संकेत करता है।
theological_decisions:
