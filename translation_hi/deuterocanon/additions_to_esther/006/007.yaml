- source_word: λαῷ τοῦ θεοῦ
  choice: परमेश्वर की प्रजा
  rationale: यह यूनानी संबंधवाचक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सामूहिक अर्थ बनाए रखता है।
- source_word: πᾶσι τοῖς ἔθνεσιν
  choice: सभी राष्ट्रों
  rationale: ‘राष्ट्र’ ἔθνη के व्यापक अर्थ को सुरक्षित रखता है। इस संदर्भ में ‘गैर-यहूदी’ भी संभव है, पर उसे मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
