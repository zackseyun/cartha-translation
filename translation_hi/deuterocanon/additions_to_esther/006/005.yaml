lexical_decisions:
- source_word: ἔθνη
  choice: दूसरी जातियाँ
  rationale: यहाँ यह शब्द यहूदियों से भिन्न गैर-यहूदी जातियों या लोगों को सूचित करता है। केवल ‘जातियाँ’ की अपेक्षा ‘दूसरी जातियाँ’ हिन्दी में इस विरोध को अधिक स्वाभाविक ढंग से स्पष्ट करता है, जबकि ‘अन्यजाति’ जैसे धार्मिक पारिभाषिक शब्द से बचता है।
- source_word: ἐπισυναχθέντα
  choice: इकट्ठी हुई थीं
  rationale: यूनानी कृदन्त रूपतः कर्मवाच्य है, पर सन्दर्भ में एकत्र होने की परिणत अवस्था बताता है। यह हिन्दी प्रयोग स्वाभाविक है; कर्मवाच्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀπολέσαι
  choice: मिटा देने के लिए
  rationale: अनन्त क्रिया उद्देश्य व्यक्त करती है। ‘मिटा देना’ आगे आने वाले ‘नाम’ के साथ स्वाभाविक हिन्दी मुहावरा बनाता है और पूर्ण विनाश का आशय रख सकता है, बिना ‘समूल नाश’ जैसी अधिक व्याख्यात्मक तीव्रता जोड़े।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: मूल यूनानी का प्रत्यक्ष बिम्ब सुरक्षित रखा गया है। यहाँ ‘नाम मिटाना’ किसी समुदाय की स्मृति अथवा उसके अस्तित्व को समाप्त करने का बाइबलीय मुहावरा हो सकता है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: एस्तेर के प्रसंग में यह शब्द यहूदी लोगों के लिए है; आधुनिक मानक हिन्दी में ‘यहूदी’ सबसे स्पष्ट और प्रचलित रूप है।
theological_decisions:
- issue: ‘यहूदियों का नाम मिटा देना’ का मुहावरेदार आशय
  choice: मुख्य पाठ में मूल बिम्ब ‘यहूदियों का नाम मिटा देना’ बनाए रखा गया है।
  alternative: ‘यहूदियों की स्मृति मिटा देना’ अथवा ‘यहूदियों का अस्तित्व समाप्त कर देना।’
  rationale: वाक्यांश किसी समुदाय की स्मृति और निरन्तर अस्तित्व दोनों के उन्मूलन का संकेत दे सकता है। प्रत्यक्ष रूप बनाए रखने से इस आशय को किसी एक व्याख्या तक सीमित नहीं किया जाता।
