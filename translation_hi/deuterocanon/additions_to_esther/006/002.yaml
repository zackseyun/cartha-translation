- source_word: περὶ τῶν λόγων τούτων
  choice: इन बातों के विषय में
  rationale: यहाँ λόγοι केवल बोले गए शब्द नहीं, बल्कि स्वप्न से संबंधित बातों या घटनाओं को सूचित कर सकता है।
- source_word: οὐδὲ ... παρῆλθεν
  choice: एक भी ... व्यर्थ नहीं गई
  rationale: παρέρχομαι का मूल भाव ‘बीत जाना/निकल जाना’ है; इस प्रसंग में वाक्य बताता है कि स्वप्न की कोई बात निष्फल नहीं हुई, जबकि हिन्दी अभिव्यक्ति संक्षिप्त बनी रहती है।
- source_word: ἀπʼ αὐτῶν λόγος
  choice: उनमें से एक भी बात
  rationale: नकार के साथ एकवचन λόγος का अर्थ ‘एक भी बात’ हो सकता है; ‘उनमें से’ ἀπʼ αὐτῶν को स्वाभाविक हिन्दी में व्यक्त करता है।
