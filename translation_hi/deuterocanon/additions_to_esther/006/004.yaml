- source_word: οἱ ... δύο δράκοντες
  choice: वे दो अजगर
  rationale: δράκοντες का मूल अर्थ बड़े सर्प या अजगर-जैसे पौराणिक प्राणी हो सकता है। “अजगर” स्वप्न की सजीव छवि को बनाए रखता है; “सर्प” सम्भव विकल्प है।
- source_word: ἐγώ εἰμι
