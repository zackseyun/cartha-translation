- source_word: Ἁμάν
  choice: हामान
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: δέ
  choice: पर
  rationale: δέ हल्का संक्रमण अथवा विरोध सूचित करता है; यहाँ प्रतीकों की व्याख्या की ओर मुड़ने के लिए “पर” उपयुक्त है।
