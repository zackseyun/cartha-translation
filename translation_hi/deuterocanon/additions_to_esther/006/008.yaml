lexical_decisions:
- source_word: οἱ δύο κλῆροι οὗτοι
  choice: ये दोनों चिट्ठियाँ
  rationale: κλῆρος का मूल बिंब चिट्ठी डालकर किसी भाग या परिणाम के ठहराए जाने का है। ‘चिट्ठियाँ’ उस ठोस बिंब को बनाए रखता है; οὗτοι को ‘ये’ से व्यक्त किया गया है।
- source_word: ἦλθον
  choice: आ पहुँचीं
  rationale: ἔρχομαι के साधारण अर्थ ‘आना/पहुँचना’ को व्यक्त करता है और चिट्ठियों के ‘पड़ने’ का अतिरिक्त बिंब नहीं जोड़ता।
- source_word: εἰς ὥραν καὶ καιρόν
  choice: उस घड़ी और नियत समय पर
  rationale: ὥρα किसी निश्चित घड़ी और καιρός उपयुक्त अथवा ठहराए हुए अवसर को सूचित करता है; ‘नियत समय’ प्रसंग में इस दूसरे भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς ἡμέραν κρίσεως
  choice: न्याय के दिन
  rationale: κρίσις यहाँ न्यायिक निर्णय या न्याय का बोध कराता है। ‘न्याय के दिन’ हिन्दी में स्वाभाविक और गंभीर अभिव्यक्ति है।
- source_word: ἐνώπιον τοῦ θεοῦ καὶ πᾶσι τοῖς ἔθνεσιν
  choice: परमेश्वर और सब जातियों के सामने
  rationale: ‘सामने’ ἐνώπιον की उपस्थिति तथा न्यायालय-सदृश गंभीरता को बनाए रखता है। हिन्दी की संयुक्त रचना में इसका संबंध परमेश्वर और सब जातियों—दोनों—से स्पष्ट है।
theological_decisions:
- issue: κλῆροι का प्रसंगगत अर्थ
  choice: मुख्य पाठ में ठोस बिंब ‘चिट्ठियाँ’ रखा गया है और उसके संभावित लाक्षणिक अर्थ को अनिर्णीत छोड़ा गया है।
  alternative: ‘नियत भाग’, ‘भाग्य’ या ‘नियतियाँ’
  rationale: प्रसंग में यह शब्द दो विरोधी परिणामों या नियतियों की ओर संकेत कर सकता है, पर यूनानी पाठ ठोस रूप से κλῆροι कहता है। लाक्षणिक अर्थ को मुख्य पाठ में निश्चित कर देना मूल की अर्थगत व्यापकता घटा देता।
- issue: ἐνώπιον का ‘परमेश्वर’ और ‘सब जातियों’ दोनों पर लागू होना
  choice: एक ही ‘सामने’ को संयुक्त पद के अंत में रखकर दोनों पर लागू किया गया है।
  alternative: ‘परमेश्वर के सामने और सब जातियों के सामने’
  rationale: यूनानी में ἐνώπιον केवल एक बार है। हिन्दी में ‘परमेश्वर और सब जातियों के सामने’ इस साझा संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, बिना दूसरे पूर्वसर्ग को अनावश्यक रूप से जोड़ने के।
