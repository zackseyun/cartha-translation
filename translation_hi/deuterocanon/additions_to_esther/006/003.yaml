translation:
  language: hi
  text: वह छोटा सोता, जो नदी बन गया, और वहाँ प्रकाश, सूर्य और बहुत जल था—वह नदी एस्तेर है; राजा ने उससे विवाह किया और उसे रानी बनाया।
