lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: वह छोटा सोता
  rationale: πηγή जल के प्राकृतिक स्रोत या सोते को दर्शाता है। ‘सोता’ आधुनिक हिन्दी में सहज है और नदी बनने वाले छोटे जलस्रोत की छवि बनाए रखता है।
- source_word: ἡ ἐγένετο ποταμός
  choice: जो नदी बन गया
  rationale: यह सम्बन्धवाचक उपवाक्य सोते के नदी में बदलने को सीधे व्यक्त करता है।
- source_word: φῶς
  choice: प्रकाश
  rationale: मूल शब्द का सामान्य अर्थ सुरक्षित रखा गया है; प्रसंग इसे स्वप्न के प्रतीक के रूप में प्रस्तुत करता है।
- source_word: ἥλιος
  choice: सूर्य
  rationale: स्वप्न-प्रतीक की ठोस छवि को अक्षुण्ण रखने के लिए शाब्दिक अनुवाद किया गया है।
- source_word: ὕδωρ πολύ
  choice: बहुत जल
  rationale: πολύ की परिमाणवाचक शक्ति को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἐσθήρ ἐστιν ὁ ποταμός
  choice: वह नदी एस्तेर है
  rationale: यूनानी वाक्य की स्पष्ट पहचान और वर्तमान काल दोनों को बनाए रखता है, तथा एस्तेर को केवल छोटे सोते के बजाय नदी से जोड़ता है।
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: जिससे राजा ने विवाह किया
  rationale: ἐγαμέω का यहाँ सीधा अर्थ विवाह करना है; हिन्दी में स्त्री के साथ विवाह के लिए ‘जिससे’ स्वाभाविक है।
- source_word: ἐποίησεν βασίλισσαν
  choice: जिसे रानी बनाया
  rationale: क्रिया और विधेय कर्म का कारणात्मक अर्थ स्पष्ट और संक्षिप्त रूप से व्यक्त होता है।
theological_decisions:
- issue: स्वप्न के प्रतीकों और एस्तेर की पहचान का वाक्य-विन्यास
  choice: प्रकाश, सूर्य और बहुत जल को पहले प्रतीकात्मक दृश्य के भीतर रखा गया है, फिर यूनानी के अनुसार स्पष्ट कहा गया है, ‘वह नदी एस्तेर है।’
  alternative: ‘वह छोटा सोता जो नदी बन गया, एस्तेर थी ...; और वहाँ प्रकाश, सूर्य और बहुत जल था।’
  rationale: यूनानी पाठ में प्रकाश, सूर्य और बहुत जल का खंड नदी की स्पष्ट पहचान से पहले आता है, और Ἐσθήρ ἐστιν ὁ ποταμός औपचारिक रूप से ‘एस्तेर नदी है’ कहता है। चुना गया रूप इस क्रम, वर्तमान काल और रूपक की वास्तविक पहचान को बिना धर्मसैद्धांतिक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सोता’, ‘प्रकाश’, ‘सूर्य’ और ‘जल’ स्वप्न की काव्यात्मक छवि को बनाए रखते हैं। डैश लंबे प्रतीकात्मक खंड के बाद उसकी व्याख्या को स्पष्ट करता है।
