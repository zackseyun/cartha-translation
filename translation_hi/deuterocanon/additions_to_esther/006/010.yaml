- source_word: ἔσονται αὐτοῖς αἱ ἡμέραι αὗται
  choice: उनके लिए ये दिन ... बने रहेंगे
  rationale: भविष्यकाल और आदेश-सदृश स्थायी भाव को बनाए रखता है। केवल ‘होंगे’ की अपेक्षा ‘बने रहेंगे’ हिन्दी में अधिक स्वाभाविक है और आगे आने वाले चिरस्थायित्व के वाक्यांश से मेल खाता है।
