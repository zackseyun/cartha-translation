  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: hi
  text: और ये दिन उनके लिए अदार महीने में, उसके चौदहवें और पंद्रहवें दिन, परमेश्वर के सामने सभा[a], आनन्द और हर्ष के साथ, उसकी प्रजा इस्राएल में पीढ़ी-दर-पीढ़ी सदा होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एकत्रीकरण” अथवा “सामुदायिक सभा।” यहाँ यूनानी शब्द συναγωγή किसी आराधनालय-भवन का विशेष उल्लेख नहीं, बल्कि लोगों के एकत्र होने को दर्शाता है।
    reason: lexical_alternative
