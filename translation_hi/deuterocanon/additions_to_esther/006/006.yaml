  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: hi
  text: पर मेरे लोग—अर्थात् इस्राएल—वे हैं जिन्होंने सहायता के लिए परमेश्वर को पुकारा[a] और बचाए गए। प्रभु ने अपनी प्रजा को बचाया, और प्रभु ने हमें इन सब विपत्तियों से छुड़ाया। परमेश्वर ने चिन्ह और बड़े-बड़े चमत्कार किए, जो अन्य जातियों के बीच कभी नहीं हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्होंने परमेश्वर से सहायता माँगी।” यूनानी वाक्यांश कुछ असामान्य है, पर प्रसंग का भाव यह है कि इस्राएल ने परमेश्वर से सहायता की विनती की और उसने उन्हें बचाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔθνος τὸ ἐμόν
  choice: मेरी जाति
  rationale: यहाँ ἔθνος वक्ता के अपने सामूहिक जनसमुदाय को सूचित करता है, जिसकी पहचान तुरंत इस्राएल के रूप में होती है। ‘जाति’ प्राचीन राष्ट्रीय-जनसमुदाय का भाव रखती है, आधुनिक राष्ट्र-राज्य का नहीं।
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: अर्थात् इस्राएल
  rationale: यह स्वाभाविक हिन्दी में पहचान स्पष्ट करता है और यूनानी के बलयुक्त परिचयात्मक संबंध को बनाए रखता है।
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: जिन्होंने सहायता के लिए परमेश्वर को पुकारा
  rationale: यूनानी प्रयोग असामान्य है; प्रसंग के अनुसार अर्थ परमेश्वर की सहायता माँगना है, न कि परमेश्वर की सहायता करना। पादटिप्पणी में निकटतर विकल्प रखा गया है।
- source_word: σωθέντες / ἔσωσεν
  choice: बचाए गए / बचाया
  rationale: दोनों रूपों में σῴζω का शब्द-संबंध बनाए रखा गया है और इस प्रसंग में दैवी उद्धार का स्पष्ट, सामान्य हिन्दी अर्थ मिलता है।
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: यह ἔσωσεν से अर्थगत निकटता रखते हुए संकट से निकालने के विशिष्ट भाव को व्यक्त करता है।
- source_word: τῶν κακῶν τούτων
  choice: इन सब विपत्तियों
  rationale: κακά यहाँ यहूदियों पर आई हानिकारक परिस्थितियों और संकटों को सूचित करता है; ‘विपत्तियों’ प्रसंगानुकूल है और नैतिक बुराइयों तक अर्थ को सीमित नहीं करता।
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: चिन्ह और बड़े-बड़े अद्भुत काम
  rationale: यह बाइबलीय युग्म का स्वाभाविक हिन्दी रूप है; ‘अद्भुत काम’ τέρατα के चमत्कारपूर्ण स्वरूप को स्पष्ट करता है।
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: जो अन्य जातियों के बीच कभी नहीं हुए
  rationale: पूर्ण क्रिया के असाधारणता-बोध को ‘कभी नहीं हुए’ से व्यक्त किया गया है; ‘अन्य’ इस्राएल और बाकी जातियों के निहित विरोध को हिन्दी में स्पष्ट करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: मूल यूनानी में κύριος है; इसलिए किसी अंतर्निहित इब्रानी रूप को आरोपित किए बिना ‘प्रभु’ उपयुक्त है।
theological_decisions:
- issue: βοηθήσαντες πρὸς τὸν θεόν का अर्थ
  choice: इस्राएल ने सहायता के लिए परमेश्वर को पुकारा।
  alternative: इस्राएल ने परमेश्वर से सहायता माँगी।
  rationale: शाब्दिक संरचना असामान्य है, लेकिन बचाए और छुड़ाए जाने का निकट प्रसंग बताता है कि लोग परमेश्वर की ओर सहायता के लिए मुड़े थे। पादटिप्पणी वास्तविक भाषिक कठिनाई और वैकल्पिक अभिव्यक्ति बचाए रखती है।
- issue: σωθέντες/ἔσωσεν और ἐρρύσατο में उद्धार-संबंधी भाषा
  choice: ‘बचाए गए/बचाया’ और ‘छुड़ाया’ से समानता तथा भेद दोनों बनाए गए।
  alternative: ‘उद्धार पाए/उद्धार किया’ और ‘बचाया’
  rationale: पहले दो रूप एक ही यूनानी धातु से हैं, इसलिए हिन्दी में उनकी पुनरावृत्ति रखी गई; अलग क्रिया ἐρρύσατο को ‘छुड़ाया’ कहा गया ताकि संकट से निकालने का भाव उभरे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज पाठ। ‘मेरी जाति’ और ‘अपनी प्रजा’ से ἔθνος तथा λαός का हल्का भेद रखा गया है। वाक्यों को हिन्दी में स्पष्टता के लिए विभाजित किया गया है; किसी सांप्रदायिक विशिष्टता को नहीं जोड़ा गया।
