translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में हल्के विषय-परिवर्तन के लिए अनावश्यक ‘अब’ नहीं जोड़ा गया। ‘उन्नति हुई है’ मूल के परिणामसूचक पूर्णकाल और εἰς προκοπήν की संज्ञात्मक संरचना दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
