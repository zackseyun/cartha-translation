  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: hi
  text: भाइयो[a], मैं चाहता हूँ कि आप जान लें कि मेरे साथ जो कुछ हुआ है, उससे वास्तव में सुसमाचार[b] की उन्नति हुई है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, भाइयो और बहनो; यूनानी में ‘भाइयो’ है, पर यह पूरी विश्वासी मंडली के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, शुभ समाचार।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: मैं चाहता हूँ कि आप जान लें
  rationale: यह हिन्दी में सूचना देने की स्वाभाविक अभिव्यक्ति है और लेखक की व्यक्तिगत इच्छा को स्पष्ट रखती है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ हल्के विषय-परिवर्तन का संकेत देता है; हिन्दी में वाक्य का प्रवाह इसे बिना ‘अब’ या ‘परन्तु’ जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: मूल के पुल्लिंग बहुवचन संबोधन को मुख्य पाठ में रखा गया है; पूरी विश्वासी मंडली को शामिल करने की सम्भावना पादटिप्पणी में बताई गई है।
- source_word: τὰ κατ’ ἐμὲ
  choice: मेरे साथ जो कुछ हुआ है
  rationale: यह पौलुस की वर्तमान परिस्थिति और उससे जुड़ी घटनाओं को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μᾶλλον
  choice: वास्तव में
  rationale: यह अपेक्षा के विपरीत निकले परिणाम पर बल देता है, बिना ‘बल्कि’ जोड़कर किसी अनकहे विरोध को अत्यधिक स्पष्ट किए।
- source_word: εἰς προκοπὴν ... ἐλήλυθεν
  choice: से ... की उन्नति हुई है
  rationale: यह निर्माण घटनाओं के उस परिणाम को व्यक्त करता है जो अब भी प्रभावी है; हिन्दी का पूर्णकाल यूनानी पूर्णकाल के वर्तमान परिणाम को स्वाभाविक रूप से सामने लाता है।
- source_word: τοῦ εὐαγγελίου
  choice: सुसमाचार
  rationale: यह εὐαγγέλιον के लिए प्रचलित, गरिमापूर्ण और साधारण हिन्दी पाठकों के लिए परिचित शब्द है; इसका शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
