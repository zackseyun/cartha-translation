  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: hi
  text: परन्तु शरीर में बने रहना तुम्हारे लिए अधिक आवश्यक है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरीर में जीवित बने रहना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: बने रहना
  rationale: संज्ञा के रूप में प्रयुक्त इस क्रियार्थक रूप का अर्थ यहाँ वर्तमान शारीरिक जीवन में आगे भी बने रहना है; ‘बने रहना’ स्वाभाविक हिन्दी में इस निरन्तरता को बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में मसीह के साथ रहने के लिए विदा होने की इच्छा के विपरीत विचार की ओर मोड़ दिखाता है।
- source_word: ἐν τῇ σαρκὶ
  choice: शरीर में
  rationale: सन्दर्भ में σάρξ नैतिक अर्थ में ‘पापी स्वभाव’ नहीं, बल्कि देहधारी सांसारिक जीवन को दर्शाता है। ‘शरीर में’ आधुनिक हिन्दी में इस शाब्दिक आशय को बिना भ्रम के व्यक्त करता है।
- source_word: ἀναγκαιότερον
  choice: अधिक आवश्यक
  rationale: यूनानी तुलनात्मक रूप को स्पष्ट और निकट रूप से सुरक्षित रखता है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे लिए
  rationale: यह फिलिप्पियों के हित या लाभ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तुम्हारे कारण’ सम्भव होते हुए भी यहाँ अनचाहा कारणात्मक अर्थ दे सकता है।
theological_decisions:
- issue: इस पद में σάρξ का अर्थ
  choice: देहधारी सांसारिक जीवन (‘शरीर में’)
  alternative: नैतिक अर्थ में ‘पापी स्वभाव’ अथवा विस्तृत भावानुवाद ‘इस संसार में जीवित रहना’
  rationale: सन्दर्भ में पौलुस मसीह के साथ रहने के लिए विदा होने की तुलना फिलिप्पियों के लाभ के लिए अपने वर्तमान शारीरिक जीवन में बने रहने से करता है। नैतिक अर्थ यहाँ सन्दर्भ से असमर्थित धर्मवैचारिक भाव जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘शरीर’ का चयन ‘देह’ या शाब्दिक ‘मांस’ की अपेक्षा इस सन्दर्भ में अधिक स्वाभाविक और कम भ्रामक है।
