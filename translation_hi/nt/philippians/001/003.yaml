lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: धन्यवाद देता हूँ
  rationale: वर्तमानकालीन प्रथम पुरुष एकवचन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; कृतज्ञता व्यक्त करने का भाव सुरक्षित रहता है।
- source_word: τῷ θεῷ μου
  choice: अपने परमेश्वर को
  rationale: εὐχαριστέω के साथ सम्प्रदान कारक को हिन्दी में ‘को’ से स्वाभाविक रूप दिया गया है; ‘अपने’ मूल के μου को बनाए रखता है और कर्ता से सम्बन्ध स्पष्ट करता है।
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: जब-जब … याद करता हूँ, तब-तब
  rationale: ἐπί और एकवचन πάσῃ μνείᾳ यहाँ प्रत्येक स्मरण के अवसर को दर्शाते हैं। यह हिन्दी मुहावरा ‘हर बार स्मरण करने पर’ का सहज और स्पष्ट रूप है।
- source_word: μνείᾳ
  choice: याद करता हूँ
  rationale: मूल संज्ञा का हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है और स्मरण के अर्थ को बनाए रखता है; ‘उल्लेख’ का अर्थ अनावश्यक रूप से नहीं थोपा गया।
- source_word: ὑμῶν
  choice: आपको
  rationale: बहुवचन सम्बन्धवाचक सर्वनाम को आदरसूचक आधुनिक हिन्दी ‘आप’ द्वारा व्यक्त किया गया है; प्रसंग में यह फिलिप्पी के विश्वासियों के समुदाय को संबोधित करता है।
