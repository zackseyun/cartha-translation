source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: hi
  text: तो क्या हुआ? बस इतना कि हर तरह से—चाहे दिखावे के लिए, चाहे सच्चाई से—मसीह का प्रचार हो रहा है; और मैं इसी में आनन्दित हूँ। हाँ, और मैं आनन्दित रहूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γάρ
  choice: तो क्या हुआ?
  rationale: पौलुस के संक्षिप्त आलंकारिक प्रश्न और पिछले कथन से निकाले गए निष्कर्ष—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πλὴν ὅτι
  choice: बस इतना कि
  rationale: 'अभिव्यक्ति के सीमित करने वाले बल को बनाए रखता है: प्रचारकों की मंशा कैसी भी हो, पौलुस के लिए मुख्य बात आगे कही गई बात है।'
- source_word: παντὶ τρόπῳ
  choice: हर तरह से
  rationale: यूनानी पद के व्यापक और वितरणात्मक अर्थ का सहज हिन्दी रूप है।
- source_word: προφάσει
  choice: दिखावे के लिए
  rationale: ऐसे बाहरी प्रदर्शन को दर्शाता है जिसके पीछे सच्ची मंशा नहीं है, पर किसी विशिष्ट गलत उद्देश्य को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἀληθείᾳ
  choice: सच्चाई से
  rationale: προφάσει के साथ मूल पाठ का स्पष्ट विरोध बनाए रखता है और ईमानदार मंशा का भाव देता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός के उपाधिसूचक अर्थ को हिन्दी के प्रचलित और अर्थपूर्ण धार्मिक पद से व्यक्त करता है।
- source_word: καταγγέλλεται
  choice: प्रचार हो रहा है
  rationale: वर्तमानकालीन कर्मवाच्य और सार्वजनिक घोषणा—दोनों भावों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τούτῳ
  choice: इसी में
  rationale: पौलुस के आनन्द को ठीक पूर्ववर्ती तथ्य, अर्थात मसीह के प्रचार, से सीधे जोड़ता है।
- source_word: χαίρω
  choice: आनन्दित हूँ
  rationale: क्षणिक प्रसन्नता के बजाय χαίρω के अधिक गहरे आनन्द-बोध को बनाए रखता है।
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: हाँ, मैं आगे भी आनन्दित रहूँगा
  rationale: जोर देने वाले संक्रमण और भविष्यकाल को मुहावरेदार हिन्दी में व्यक्त करता है; “आगे” वर्तमान आनन्द से भविष्य के आनन्द की ओर गति स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट / क्राइस्ट
  rationale: यहाँ शब्द घोषित किए जा रहे व्यक्ति की उपाधि के रूप में प्रयुक्त है; “मसीह” उसके अर्थ को आधुनिक हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक रूप से सुरक्षित रखता है।
- issue: कपटपूर्ण प्रचार के बावजूद पौलुस का आनन्द
  choice: आनन्द का आधार केवल यह बताया गया है कि मसीह का प्रचार हो रहा है
  alternative: पौलुस प्रचारकों की गलत मंशा या उनके हर तरीके को अनुमोदित कर रहे हैं
  rationale: मूल पाठ मंशाओं के विरोध को बनाए रखते हुए आनन्द को मसीह के प्रचार से जोड़ता है; अनुवाद न तो गलत मंशा को उचित ठहराता है, न पद में अनुपस्थित नैतिक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वाक्य की संक्षिप्त आलंकारिक शुरुआत और ‘चाहे…चाहे…’ वाला विरोध मूल की गति बनाए रखते हैं। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई है।
