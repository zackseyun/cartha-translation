translation:
  language: hi
  text: क्योंकि तुम उसी संघर्ष का सामना कर रहे हो, जैसा तुमने मुझ में देखा था और जिसके बारे में अब सुनते हो कि मैं अब भी उसका सामना कर रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν αὐτὸν ἀγῶνα
  choice: वही संघर्ष
  rationale: ἀγών यहाँ विरोध और कष्ट के बीच किए जाने वाले संघर्ष को दर्शाता है; ‘वही’ यूनानी τὸν αὐτόν की समानता को स्पष्ट रखता है।
- source_word: ἔχοντες
  choice: कर रहे हो
  rationale: ‘संघर्ष रखना’ हिंदी में अस्वाभाविक है; प्रसंगानुसार सक्रिय संघर्ष में लगे होने का स्वाभाविक और वर्तमान अर्थ व्यक्त किया गया है।
- source_word: οἷον εἴδετε ἐν ἐμοὶ
  choice: जैसा तुमने मुझे करते देखा था
  rationale: शाब्दिक ‘मुझमें देखा’ के आशय को स्वाभाविक हिंदी में व्यक्त करता है और संघर्ष को पौलुस के अनुभव तथा आचरण में प्रत्यक्ष देखे जाने से जोड़ता है।
- source_word: καὶ νῦν ἀκούετε ἐν ἐμοί
  choice: और अब सुनते हो कि मैं अब भी कर रहा हूँ
  rationale: νῦν का ‘अब’ और पौलुस में उसी संघर्ष के जारी होने का आशय सुरक्षित है; ‘अब भी’ अंग्रेज़ी परामर्श-पाठ के अनुरूप निहित निरंतरता को स्पष्ट करता है।
theological_decisions:
- issue: पौलुस और फिलिप्पियों के संघर्ष की समानता
  choice: ‘वही संघर्ष’ रखा गया
  alternative: ‘वैसा ही संघर्ष’
  rationale: मूल का τὸν αὐτόν अधिक प्रत्यक्ष रूप से उसी प्रकार अथवा उसी साझा संघर्ष की समानता बताता है; अनावश्यक रूप से संघर्षों को बिल्कुल एक ही घटना नहीं बनाया गया।
- issue: ἐν ἐμοί का अर्थ
  choice: पौलुस द्वारा संघर्ष किए जाने के रूप में व्यक्त किया
  alternative: शाब्दिक ‘मुझमें’
  rationale: दोनों बार ἐν ἐμοί पौलुस के जीवन में दिखाई और सुनाई देने वाले संघर्ष को संदर्भित करता है; हिंदी में शाब्दिक रूप अस्पष्ट और अस्वाभाविक होता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन बहुवचन ‘तुम’ है। शैली सरल, गरिमापूर्ण और पिछले पद से जुड़ने योग्य रखी गई है।
