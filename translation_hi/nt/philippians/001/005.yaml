lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: क्योंकि … तुम्हारी सहभागिता रही है
  rationale: ἐπί के साथ दत्तिव यहाँ आसपास के वाक्य में पौलुस के धन्यवाद का कारण बताता है। ‘सहभागिता’ κοινωνία की सक्रिय साझेदारी और सम्मिलित भागीदारी—दोनों को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: εἰς τὸ εὐαγγέλιον
  choice: सुसमाचार में
  rationale: यह यूनानी पदबंध सहभागिता के क्षेत्र अथवा उसके लक्ष्य को व्यक्त कर सकता है। मुख्य पाठ में ‘सुसमाचार में’ निकट संबंध और मूल की अस्पष्टता को पर्याप्त रूप से बनाए रखता है; उद्देश्यवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν
  choice: पहले दिन से लेकर अब तक
  rationale: यह सहभागिता के आरंभ-बिंदु से वर्तमान समय तक जारी रहने को सहज और सटीक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: सुसमाचार और सहभागिता के बीच संबंध
  choice: सुसमाचार में तुम्हारी सहभागिता
  alternative: सुसमाचार के लिए तुम्हारी सहभागिता
  rationale: εἰς τὸ εὐαγγέλιον सहभागिता के क्षेत्र (‘में’) या लक्ष्य/उद्देश्य (‘के लिए’) का बोध करा सकता है। किसी एक अर्थ को अंतिम रूप से थोपने के बजाय मुख्य पाठ और पादटिप्पणी दोनों संभावनाएँ सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘सुसमाचार’ पौलुस के संदर्भ में प्रचलित और अर्थगर्भित पद है; ‘सहभागिता’ केवल आत्मीय संगति नहीं, बल्कि सक्रिय साझा भागीदारी भी दर्शाती है।
