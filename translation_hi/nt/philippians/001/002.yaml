  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: hi
  text: तुम्हें हमारे पिता परमेश्वर और प्रभु यीशु मसीह की ओर से अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह पौलुस के अभिवादन में प्रयुक्त शब्द के संबंधपरक और धर्मवैचारिक अर्थ को बनाए रखने वाला स्वाभाविक तथा प्रचलित हिन्दी रूप है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: पत्रात्मक आशीर्वचन में दत्तिव कारक का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह यूनानी और यहूदी अभिवादन-परंपराओं से जुड़े व्यापक कल्याण के भाव को सुरक्षित रखता है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यहाँ यह स्रोत को दर्शाता है; हिन्दी आशीर्वचन में ‘की ओर से’ स्वाभाविक है और अनुग्रह तथा शांति के उद्गम को स्पष्ट करता है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: यह संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘परमेश्वर, जो हमारे पिता हैं’ के अपपदात्मक अर्थ को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह κύριος का स्थापित हिन्दी रूप है और नए नियम में इसके मसीह-संबंधी महत्व को बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός के अभिषिक्त राजा वाले पदवीगत अर्थ को सुरक्षित रखता है, जबकि हिन्दी बाइबलीय प्रयोग में ‘यीशु मसीह’ स्वाभाविक और व्यापक रूप से समझा जाता है।
theological_decisions:
- issue: पौलुस के अभिवादन में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: Χριστός यहाँ नाम-सदृश भी सुनाई दे सकता है और पदवीगत अर्थ भी रखता है। ‘मसीह’ हिन्दी में दोनों पहलुओं को बिना किसी संप्रदायगत व्याख्या के स्वाभाविक रूप से बनाए रखता है।
- issue: क्रियारहित यूनानी आशीर्वचन को हिन्दी में व्यक्त करना
  choice: मिले
  alternative: हो
  rationale: मूल यूनानी में व्यक्त क्रिया नहीं है। ‘मिले’ हिन्दी में इसे स्वाभाविक आशीर्वचन बनाता है और इसे तथ्यात्मक कथन में बदले बिना अभिप्रेत कामना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सरल पत्रात्मक आशीर्वचन। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है; ‘की ओर से’ अनुग्रह और शांति के स्रोत को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
