id: PHP.1.9
reference: Philippians 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: hi
  text: और मैं यह प्रार्थना करता हूँ कि तुम्हारा प्रेम ज्ञान[a] और हर प्रकार की परख[b] में और भी अधिक बढ़ता जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज्ञान के साथ’; यूनानी पूर्वसर्ग निकट संगति का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर प्रकार की अन्तर्दृष्टि’ अथवा ‘हर प्रकार की नैतिक सूझ-बूझ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: और मैं यह
  rationale: καί के संयोजक भाव और τοῦτο के संकेतवाचक बल को स्वाभाविक हिन्दी वाक्य-विन्यास में बनाए रखता है; ‘मैं’ को क्रिया के साथ रखा गया है।
- source_word: προσεύχομαι
  choice: प्रार्थना करता हूँ
  rationale: वर्तमान काल की निरन्तर या प्रचलित क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से प्रगतिशील पक्ष थोपे।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ प्रार्थना की विषय-वस्तु अथवा अभिप्राय प्रस्तुत करता है; ‘कि’ हिन्दी में स्वाभाविक पूरक-संयोजक है।
- source_word: ἡ ἀγάπη ὑμῶν
  choice: तुम्हारा प्रेम
  rationale: ἀγάπη का सामान्य और प्रसंगानुकूल अर्थ ‘प्रेम’ है; ὑμῶν बहुवचन समुदाय को सम्बोधित करता है, जिसे हिन्दी में सामूहिक ‘तुम्हारा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: और भी अधिक
  rationale: ἔτι और दुहराए गए μᾶλλον के निरन्तर बढ़ोतरी वाले बल को सहज हिन्दी में व्यक्त करता है; यांत्रिक पुनरावृत्ति से बचते हुए जोर बनाए रखता है।
- source_word: περισσεύῃ
  choice: बढ़ता जाए
  rationale: वर्तमान संभावनार्थक क्रिया के निरन्तर विस्तार और प्रार्थनात्मक भाव को प्राकृतिक हिन्दी में व्यक्त करता है; प्रसंग में प्रेम की बढ़ती प्रचुरता अभिप्रेत है।
- source_word: ἐν ἐπιγνώσει
  choice: ज्ञान में
  rationale: ἐν की क्षेत्रगत धारणा और ἐπίγνωσις के सुलभ अर्थ को बनाए रखता है। ‘ज्ञान के साथ’ भी व्याकरणतः सम्भव निकट-संबंधी अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: πάσῃ αἰσθήσει
  choice: हर प्रकार की परख
  rationale: αἴσθησις यहाँ केवल इन्द्रिय-अनुभूति नहीं, बल्कि व्यावहारिक या नैतिक विवेकपूर्ण परख का बोध देता है; πάσῃ की व्यापकता ‘हर प्रकार की’ से स्पष्ट होती है।
