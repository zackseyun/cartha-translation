lexical_decisions:
- source_word: δοκιμάζειν
  choice: परखकर … स्वीकार करो
  rationale: क्रिया में जाँचने और जाँच के बाद अनुमोदन करने—दोनों का भाव है; संयुक्त अभिव्यक्ति इन दोनों पहलुओं को स्वाभाविक हिन्दी में रखती है।
- source_word: τὰ διαφέροντα
  choice: उत्तम बातों को
  rationale: शाब्दिक अर्थ ‘जो बातें भिन्न हैं’ है, पर प्रसंग में इसका संभावित मुहावरेदार अर्थ श्रेष्ठ या अधिक महत्त्वपूर्ण बातों को पहचानना है।
- source_word: εἰλικρινεῖς
  choice: शुद्ध
  rationale: यह शब्द नैतिक शुद्धता, निष्कपटता या खरापन व्यक्त कर सकता है; यहाँ ‘शुद्ध’ साथ आने वाले ἀπρόσκοποι के साथ सहज बैठता है।
- source_word: ἀπρόσκοποι
  choice: निर्दोष
  rationale: यह ठोकर न खाने या दूसरों के लिए ठोकर का कारण न बनने का भाव दे सकता है; ‘निर्दोष’ व्यापक नैतिक परिणाम को संक्षेप में व्यक्त करता है, और अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: मसीह के दिन के लिए
  rationale: εἰς को लक्ष्य की ओर संकेत करने वाले अर्थ में लिया गया है। Χριστός यहाँ उपाधि के रूप में है, जिसके लिए हिन्दी का स्वाभाविक और अर्थपूर्ण रूप ‘मसीह’ है।
theological_decisions:
- issue: εἰς ἡμέραν Χριστοῦ में समय या लक्ष्य का भाव
  choice: मसीह के दिन के लिए
  alternative: मसीह के दिन तक
  rationale: εἰς लक्ष्य की तैयारी का भाव दे सकता है, जबकि समय-सीमा का अर्थ भी सम्भव है; मुख्य पाठ में लक्ष्य का भाव और पादटिप्पणी में समय-संबंधी विकल्प रखा गया है।
- issue: ἀπρόσκοποι का नैतिक आशय
  choice: निर्दोष
  alternative: ठोकर न खानेवाले / किसी के लिए ठोकर का कारण न बननेवाले
  rationale: यूनानी शब्द के सक्रिय और निष्क्रिय दोनों प्रकार के अर्थ सम्भव हैं; मुख्य पाठ किसी एक को अनावश्यक रूप से निश्चित नहीं करता और विकल्प पादटिप्पणी में दिए गए हैं।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός मसीही उपाधि है। ‘मसीह’ आधुनिक हिन्दी में प्रचलित है और ‘अभिषिक्त जन’ की उपाधिगत पहचान को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परखकर … स्वीकार करो’ मूल क्रिया के परीक्षण और अनुमोदन, दोनों भावों को व्यक्त करता है; पादटिप्पणियाँ मूल की वास्तविक शाब्दिक और व्याकरणिक अस्पष्टताओं को सुरक्षित रखती हैं।
