  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: hi
  text: ताकि तुम उत्तम बातों को परखकर पहचान सको[a] और इस प्रकार मसीह के दिन के लिए शुद्ध और निर्दोष[b] हो सको[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उत्तम बातों को स्वीकार करो,” “जो बातें महत्त्वपूर्ण हैं उन्हें पहचानो,” या “जो सर्वोत्तम है उसे पहचानो”; अधिक शाब्दिक रूप में, “जो बातें भिन्न हैं उन्हें परखो।”'
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “ठोकर न खानेवाले” या “दूसरों के लिए ठोकर का कारण न बननेवाले” भी हो सकता है।
