id: PHP.1.28
reference: Philippians 1:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: hi
  text: और किसी भी बात में अपने विरोधियों से भयभीत न हों[a]। यह उनके लिए विनाश का, पर आपके लिए उद्धार का संकेत[b] है—और यह परमेश्वर की ओर से है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घबराएँ नहीं” अथवा “आतंकित न हों।”
    reason: lexical_alternative
  - marker: b
    text: या “प्रमाण” अथवा “सूचना देने वाला चिह्न।”
    reason: lexical_alternative
  - marker: c
    text: “यह परमेश्वर की ओर से है” केवल उद्धार को अथवा अधिक व्यापक रूप से पूरे पूर्ववर्ती संकेत को संदर्भित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: भयभीत न हों
  rationale: यह क्रिया चौंका दिए जाने, डरने या दबाव में भयभीत होने का भाव रखती है। निषेध के साथ “भयभीत न हों” स्वाभाविक और अर्थपूर्ण हिन्दी है।
- source_word: ἐν μηδενί
  choice: किसी भी बात में
  rationale: यह वाक्यांश पूर्ण निषेध व्यक्त करता है—किसी भी परिस्थिति या विषय में नहीं। यह हिन्दी में निकट और सहज रूप है।
- source_word: τῶν ἀντικειμένων
  choice: अपने विरोधियों
  rationale: कृदंत उन लोगों को दर्शाता है जो पाठकों के विरुद्ध खड़े हैं। “अपने विरोधियों” संक्षिप्त और स्पष्ट है।
- source_word: ἔνδειξις
  choice: संकेत
  rationale: शब्द प्रमाणसूचक चिह्न या संकेत को दर्शाता है। “संकेत” अर्थ को बिना अनावश्यक रूप से निर्णायक बनाए सुरक्षित रखता है।
- source_word: ἀπωλείας
  choice: विनाश
  rationale: यह नाश, बरबादी या न्यायगत विनाश का भाव रखता है; “विनाश” प्रचलित और पर्याप्त व्यापक हिन्दी शब्द है।
- source_word: σωτηρίας
  choice: उद्धार
  rationale: यहाँ पौलुस की परमेश्वर के बचाने वाले कार्य से संबंधित धार्मिक अर्थवत्ता को “उद्धार” स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: और यह परमेश्वर की ओर से है
  rationale: “यह” को स्पष्ट रखते हुए वाक्यांश के स्रोतार्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है और उसके संदर्भ को जानबूझकर खुला रखा गया है।
theological_decisions:
- issue: τοῦτο (‘यह’) का संदर्भ
  choice: 'मुख्य पाठ में व्यापक और अनिर्धारित रखा गया: “और यह परमेश्वर की ओर से है।”'
  alternative: “यह” केवल उद्धार को, अथवा विरोध के बीच उनकी निर्भीकता से प्रकट पूरे संकेत को संदर्भित कर सकता है।
  rationale: यूनानी पाठ में निकटवर्ती ‘उद्धार’ और पूरे पूर्ववर्ती संकेत—दोनों से संबंध संभव है; इसलिए अनिश्चितता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थक बहुवचन रखा गया है। भाषा सरल और गरिमापूर्ण है; “उद्धार” और “विनाश” जैसे स्थापित धार्मिक शब्द मूल के व्यापक अर्थ को बनाए रखते हैं।
