reference: Philippians 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: hi
  text: 'पौलुस और तीमुथियुस, मसीह यीशु के दास[a], उन सभी पवित्र जनों को जो मसीह यीशु में हैं और फिलिप्पी में रहते हैं, निरीक्षकों[b] और सेवकों[c] समेत:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ के लिए आया यूनानी शब्द स्वामी के अधीन व्यक्ति को दर्शाता है; इसका अनुवाद ‘गुलाम’ या, कुछ संदर्भों में, ‘सेवक’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या पारंपरिक पदनाम में ‘बिशपों’।
    reason: lexical_alternative
  - marker: c
    text: या ‘सेवा करनेवालों’; परंपरागत पदनाम में ‘डीकनों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: यह शब्द स्वामी के अधीन बँधे हुए व्यक्ति को दर्शाता है। ‘दास’ आधुनिक हिन्दी में गरिमापूर्ण रहते हुए इस अधीनता को ‘सेवक’ से अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ यीशु की उपाधि है; ‘मसीह’ हिन्दी में उसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: ἁγίοις
  choice: पवित्र जनों
  rationale: यह पौलुस द्वारा विश्वासियों की सामूहिक पवित्र पहचान के लिए प्रयुक्त संबोधन है; ‘पवित्र जन’ उस अर्थ को सामान्य पाठक के लिए ‘संतों’ से अधिक पारदर्शी बनाता है।
- source_word: ἐν
  choice: में
  rationale: 'दोनों प्रयोगों को अलग रखा गया है: विश्वासी ‘मसीह यीशु में’ हैं और भौगोलिक रूप से फिलिप्पी में रहते हैं। इससे पौलुस की मसीह-संबंधी भाषा और स्थान-सूचना दोनों सुरक्षित रहती हैं।'
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: जो ... फिलिप्पी में रहते हैं
  rationale: यूनानी कृदन्तीय पदबंध को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: σὺν
  choice: समेत
  rationale: यह मुख्य समुदाय के साथ निरीक्षकों और सेवकों के समावेश को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπισκόποις
  choice: निरीक्षकों
  rationale: यह यूनानी शब्द के देखरेख करनेवाले अर्थ को सीधे व्यक्त करता है और बाद के किसी विशिष्ट पदानुक्रम को पाठ में नहीं जोड़ता।
- source_word: διακόνοις
  choice: सेवकों
  rationale: मूल शब्द सेवा करनेवालों को दर्शाता है। इस युग्मित संदर्भ में यह किसी पहचानी हुई सेवकाई की भूमिका हो सकती है, पर ‘सेवक’ उस संभावना को बिना अति-निर्धारित किए सुरक्षित रखता है।
theological_decisions:
- issue: Χριστός को नाम मानना या उपाधि के रूप में व्यक्त करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट जीसस
  rationale: यूनानी Χριστός मूलतः ‘अभिषिक्त जन’ की उपाधि है। ‘मसीह’ हिन्दी की स्थापित धार्मिक शब्दावली में इस उपाधि को सुरक्षित रखता है।
- issue: δοῦλοι में बँधी हुई अधीनता की तीव्रता
  choice: दास
  alternative: सेवक
  rationale: ‘सेवक’ स्वैच्छिक सेवा का भाव दे सकता है, जबकि δοῦλοι स्वामित्व और पूर्ण अधीनता का अधिक प्रबल बोध कराता है। ‘दास’ इस तनाव को नरम किए बिना हिन्दी में स्वाभाविक है।
- issue: ἐπισκόποι और διακόνοι क्या निश्चित कलीसियाई पद हैं
  choice: निरीक्षक और सेवक
  alternative: बिशप और डीकन
  rationale: संदर्भ संगठित सेवकाई की भूमिकाओं की ओर संकेत करता है, फिर भी बाद में विकसित पदवियों को अनिवार्य रूप से मान लेना उचित नहीं। इसलिए अर्थपरक हिन्दी मुख्य पाठ में रखी गई है और पारंपरिक पदनाम पादटिप्पणियों में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और पत्र के आरंभिक संबोधन के अनुकूल रखी गई है। ‘जो मसीह यीशु में हैं और फिलिप्पी में रहते हैं’ दोहरे ἐν को स्पष्ट करता है। ‘निरीक्षक’ और ‘सेवक’ पारदर्शी अर्थपरक शब्द हैं और किसी बाद की विशिष्ट कलीसियाई व्यवस्था को अनावश्यक रूप से आरोपित नहीं करते।
