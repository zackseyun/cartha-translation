  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: hi
  text: धार्मिकता[a] के फल से भरे हुए, जो यीशु मसीह[b] के द्वारा मिलता है—परमेश्वर की महिमा और स्तुति के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘Ἰησοῦ Χριστοῦ’; यहाँ ‘मसीह’ Χριστός को एक उपाधि के रूप में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: भरे हुए
  rationale: पूर्णकालिक कर्मवाच्य कृदंत उस परिणामी अवस्था को व्यक्त करता है जिसमें संबोधित लोग भर चुके हैं; यह रूप पिछले वाक्य से इसके व्याकरणिक संबंध को भी बनाए रखता है।
- source_word: καρπὸν
  choice: फल
  rationale: यह पौलुस के नैतिक और आत्मिक परिणाम के रूपक को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह δικαιοσύνη का सामान्य धर्मशास्त्रीय अर्थ बनाए रखता है, जबकि ‘न्याय’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: जो यीशु मसीह के द्वारा मिलता है
  rationale: संबंधवाचक उपवाक्य यूनानी निश्चित पदबंध τὸν διὰ Ἰησοῦ Χριστοῦ को सहज हिन्दी में व्यक्त करता है; ‘के द्वारा’ διά के साधन अथवा माध्यम के भाव को सुरक्षित रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यह Χριστός को केवल नाम का दूसरा भाग नहीं, बल्कि अभिषिक्त जन की उपाधि के रूप में व्यक्त करता है।
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: परमेश्वर की महिमा और स्तुति के लिए
  rationale: ‘के लिए’ εἰς के लक्ष्य अथवा परिणाम के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ‘धार्मिकता का फल’ में संबंधकारक का अर्थ
  choice: वाक्यांश को ‘धार्मिकता के फल’ के रूप में खुला रखा गया है।
  alternative: ऐसा फल जो धार्मिकता से पहचाना जाता है; वह फल जो धार्मिकता है; अथवा धार्मिक ठहराए जाने से उत्पन्न फल।
  rationale: यूनानी संबंधकारक इन निकटवर्ती अर्थों में से किसी एक को स्पष्ट रूप से निश्चित नहीं करता। इसलिए अनुवाद फल के नैतिक-आत्मिक भाव और मसीह के माध्यम को बनाए रखते हुए संबंध की ठीक प्रकृति को नहीं सुलझाता।
- issue: यीशु मसीह की माध्यमिक भूमिका
  choice: ‘यीशु मसीह के द्वारा मिलता है’
  alternative: ‘यीशु मसीह के द्वारा उत्पन्न होता है’ अथवा ‘यीशु मसीह के माध्यम से आता है’।
  rationale: διά के साधन या माध्यम को स्पष्ट रखा गया है, पर फल की उत्पत्ति की प्रक्रिया को मूल पाठ से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। पद पिछले वाक्य पर निर्भर कृदंतीय संरचना है, इसलिए इसे स्वतंत्र आज्ञा या पूर्ण वाक्य में नहीं बदला गया।
