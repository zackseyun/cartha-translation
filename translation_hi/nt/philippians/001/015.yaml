  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य के दोनों καί को अलग-अलग ‘भी’ के रूप में व्यक्त नहीं किया गया, क्योंकि हिन्दी में उससे वाक्य असहज होता; ‘तो … पर’ मूल विरोध को पर्याप्त रूप से सुरक्षित रखता है।
