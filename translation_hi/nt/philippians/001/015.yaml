  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: hi
  text: कुछ लोग तो ईर्ष्या और प्रतिद्वंद्विता के कारण मसीह का प्रचार करते हैं, पर दूसरे सद्भावना से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: कुछ लोग तो … पर दूसरे
  rationale: यह अभिव्यक्ति दो समूहों के बीच μέν … δέ द्वारा बनाए गए स्पष्ट विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: διὰ φθόνον
  choice: ईर्ष्या … के कारण
  rationale: διά के साथ कर्मकारक यहाँ हेतु या प्रेरणा बताता है; ‘के कारण’ इस अर्थ को स्पष्ट रखता है।
- source_word: ἔριν
  choice: प्रतिद्वंद्विता
  rationale: इस संदर्भ में शब्द व्यक्तिगत होड़ और प्रतिस्पर्धी विरोध का भाव देता है; ‘प्रतिद्वंद्विता’ ‘झगड़े’ की अपेक्षा उस प्रेरणा को अधिक ठीक व्यक्त करती है।
- source_word: δι’ εὐδοκίαν
  choice: सद्भावना से
  rationale: यह ईर्ष्या और प्रतिद्वंद्विता के विपरीत एक अच्छी प्रेरणा को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: τὸν Χριστόν
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ इसका स्थापित और सहज शीर्षकीय अनुवाद है।
- source_word: κηρύσσουσιν
  choice: प्रचार करते हैं
  rationale: यह κηρύσσω के सार्वजनिक घोषणा करने के भाव को सामान्य, वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
