  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: hi
  text: क्योंकि मेरे लिए जीना मसीह[a] है, और मरना लाभ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसीहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: मेरे लिए
  rationale: सम्प्रदान कारक सर्वनाम पौलुस के निजी दृष्टिकोण को व्यक्त करता है। “मेरे लिए” आधुनिक हिन्दी में स्वाभाविक है और पूरे कथन के व्यक्तिगत बल को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह अव्यय पिछले विचार का कारण या स्पष्टीकरण प्रस्तुत करता है। “क्योंकि” हिन्दी में इस तर्क-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ ζῆν
  choice: जीना
  rationale: लेखयुक्त धातुरूप यहाँ संज्ञा के समान प्रयुक्त है। “जीना” संक्षिप्त है और “मरना” के साथ मूल का संतुलित समानांतर रूप बनाए रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός पौलुस के लेखन में उपाधि और नाम-सदृश प्रयोग, दोनों रख सकता है। “मसीह” हिन्दी बाइबलीय प्रयोग में स्वाभाविक और प्रतिष्ठित है; उपाधि पर अधिक बल देने वाला “मसीहा” पादटिप्पणी में दिया गया है।
- source_word: τὸ ἀποθανεῖν
  choice: मरना
  rationale: यह लेखयुक्त धातुरूप भी संज्ञा के समान प्रयुक्त है। “मरना” मूल के संक्षिप्त रूप और “जीना” के साथ उसके समानांतर विन्यास को सुरक्षित रखता है।
- source_word: κέρδος
  choice: लाभ
  rationale: “लाभ” किसी फायदे या प्राप्ति का अर्थ सहजता से देता है और इस प्रसंग में अनावश्यक रूप से व्यापारिक नहीं लगता।
theological_decisions:
- issue: Χριστός को नाम-सदृश या उपाधि-सूचक रूप में प्रस्तुत करना
  choice: मुख्य पाठ में “मसीह”
  alternative: “मसीहा”
  rationale: मूल यूनानी में दोनों छायाएँ संभव हैं। मुख्य पाठ हिन्दी के प्रचलित पौलुसी प्रयोग को अपनाता है, जबकि पादटिप्पणी उपाधि-सूचक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी में है। मूल यूनानी की सूत्रात्मक समांतरता—“जीना … और मरना …”—को बनाए रखा गया है।
