  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: hi
  text: केवल मसीह के सुसमाचार के योग्य आचरण करो[a], ताकि चाहे मैं आकर तुम्हें देखूँ या अनुपस्थित रहूँ, तुम्हारे विषय में यह सुनूँ कि तुम एक ही आत्मा में[b] दृढ़ खड़े हो और एक प्राण होकर[c] सुसमाचार के विश्वास के लिए[d] मिलकर संघर्ष कर रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी क्रिया में नागरिकों के समान जीवन और आचरण करने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘आत्मा’ से एक साझा आत्मभाव या पवित्र आत्मा—दोनों में से कोई अर्थ संभव है।
    reason: alternative_reading
  - marker: c
    text: या ‘एक मन होकर’।
    reason: lexical_alternative
  - marker: d
    text: या ‘सुसमाचार में विश्वास के लिए’; अथवा ‘सुसमाचार के विश्वास के पक्ष में’।
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: केवल इतना ध्यान रखो कि
  rationale: वाक्य के आरम्भ में आए बल को स्वाभाविक हिन्दी में व्यक्त करता है और इसे पौलुस के मुख्य आग्रह के रूप में प्रस्तुत करता है।
- source_word: ἀξίως
  choice: के योग्य
  rationale: जीवन बिताने के ढंग और सुसमाचार के अनुरूप आचरण के नैतिक भाव को संक्षेप में सुरक्षित रखता है।
- source_word: πολιτεύεσθε
  choice: अपना जीवन बिताओ
  rationale: आधुनिक हिन्दी में स्वाभाविक है; यूनानी क्रिया में निहित नागरिक जीवन के भाव को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ εὐαγγελίου τοῦ Χριστοῦ
  choice: मसीह के सुसमाचार
  rationale: εὐαγγέλιον के लिए प्रचलित ‘सुसमाचार’ और Χριστός के पदवीगत अर्थ के लिए ‘मसीह’ उपयुक्त हैं।
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: तुम्हारे विषय में यह सुनूँ
  rationale: यूनानी मुहावरे को सहज हिन्दी में व्यक्त करता है और आगे आने वाली सूचना से स्वाभाविक रूप से जोड़ता है।
- source_word: στήκετε
  choice: दृढ़ खड़े हो
  rationale: क्रिया के स्थिरता और अटल बने रहने के भाव को बनाए रखता है।
- source_word: ἐν ἑνὶ πνεύματι
  choice: एक ही आत्मा में
  rationale: मूल की एकता का भाव बनाए रखता है और यह तय नहीं करता कि संकेत सामूहिक मानवीय आत्मभाव की ओर है या पवित्र आत्मा की ओर।
- source_word: μιᾷ ψυχῇ
  choice: एक प्राण होकर
  rationale: ψυχή की सजीव उपमा को बचाते हुए हिन्दी में घनिष्ठ एकता और साझा संकल्प का स्वाभाविक भाव देता है।
- source_word: συναθλοῦντες
  choice: मिलकर संघर्ष कर रहे हो
  rationale: साथ-साथ प्रयत्न और संघर्ष करने के भाव को स्पष्ट एवं वर्तमान हिन्दी में व्यक्त करता है।
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: सुसमाचार के विश्वास के लिए
  rationale: यूनानी संबंधकारक रचना को अपेक्षाकृत खुला रखता है और इसे केवल ‘सुसमाचार में विश्वास’ मानकर अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: क्या πνεύματι पवित्र आत्मा को दर्शाता है या विश्वासियों के साझा आत्मभाव को
  choice: एक ही आत्मा में
  alternative: एक ही पवित्र आत्मा में / एक ही आत्मभाव में
  rationale: ‘एक प्राण होकर’ के समानांतर होने से सामूहिक एकता का अर्थ प्रबल है, पर पवित्र आत्मा का संकेत भी संभव है; मुख्य पाठ और पादटिप्पणी दोनों संभावनाएँ खुली रखते हैं।
- issue: τῇ πίστει τοῦ εὐαγγελίου का संबंध
  choice: सुसमाचार के विश्वास के लिए
  alternative: सुसमाचार में विश्वास के लिए
  rationale: मुख्य पाठ मूल की संबंधकारक अस्पष्टता को सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामुदायिक पाठ के अनुकूल रखी गई है। ‘एक प्राण होकर’ साहित्यिक होते हुए भी प्रचलित और बोधगम्य है। नागरिकता-संबंधी सूक्ष्म अर्थ तथा πνεῦμα और πίστις की वास्तविक व्याख्यात्मक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
