base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: hi
  text: पर यदि शरीर में जीवित रहना मेरे लिए फलदायी कार्य है,[a][b]—फिर भी मैं क्या चुनूँगा, यह मैं नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “देह में।”
    reason: lexical_alternative
  - marker: b
    text: या “कार्य का फल” अथवा “फलदायी परिश्रम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: जीवित रहना
  rationale: संज्ञीकृत क्रियार्थक रूप वर्तमान सांसारिक जीवन के जारी रहने को दर्शाता है; हिन्दी में ‘जीवित रहना’ स्वाभाविक है और संदर्भ से निरंतरता स्पष्ट होती है।
- source_word: ἐν σαρκί
  choice: शरीर में
  rationale: यहाँ σάρξ नैतिक अर्थ में ‘पापी स्वभाव’ नहीं, बल्कि देहधारी सांसारिक अस्तित्व को दर्शाता है। ‘शरीर में’ आधुनिक हिन्दी में इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καρπὸς ἔργου
  choice: फलदायी परिश्रम
  rationale: यूनानी पदबंध संक्षिप्त और कुछ अस्पष्ट है। ‘फलदायी परिश्रम’ कार्य और उससे उत्पन्न फल—दोनों को सहज हिन्दी में समेटता है।
- source_word: αἱρήσομαι
  choice: मैं चुनूँगा
  rationale: यह दो संभावनाओं में चयन को व्यक्त करता है; ‘चुनूँगा’ सीधा और स्वाभाविक अनुवाद है।
- source_word: οὐ γνωρίζω
  choice: मैं नहीं जानता
  rationale: संदर्भ में यह अनिश्चितता व्यक्त करता है; ‘मैं नहीं जानता’ हिन्दी में इसका सर्वाधिक स्वाभाविक रूप है।
theological_decisions:
- issue: इस पद में σάρξ का अर्थ
  choice: देहधारी सांसारिक अस्तित्व (‘शरीर में’)
  alternative: पापी स्वभाव
  rationale: आस-पास के संदर्भ में पौलुस पृथ्वी पर जीवित रहने की तुलना मसीह के साथ रहने के लिए विदा होने से करता है; इसलिए यहाँ σάρξ नैतिक भ्रष्टता नहीं, शारीरिक जीवन को दर्शाता है।
- issue: εἰ δὲ ... καὶ की अपूर्ण और तनावपूर्ण वाक्य-रचना
  choice: ‘पर यदि ... तो ...’ के द्वारा शर्त और उसके बाद की दुविधा को बनाए रखना
  alternative: 'इसे निर्णायक कथन बनाना: ‘क्योंकि जीवित रहने का अर्थ ... है’'
  rationale: यूनानी वाक्य जानबूझकर संक्षिप्त और कुछ अनगढ़ है। हिन्दी में अर्थगम्यता के लिए ‘तो’ जोड़ा गया है, पर चयन के विषय में पौलुस की अनिश्चितता को नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। मुख्य पाठ में ‘शरीर में’ स्पष्टता के लिए चुना गया है, जबकि अधिक शाब्दिक ‘देह में’ पादटिप्पणी में सुरक्षित है।
