id: PHP.1.7
reference: Philippians 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: hi
  text: क्योंकि तुम सबके विषय में ऐसा सोचना मेरे लिए उचित है, क्योंकि तुम मेरे हृदय में बसे हो[a]; मेरी बेड़ियों में और सुसमाचार के बचाव और पुष्टि में, तुम सब मेरे साथ अनुग्रह के सहभागी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुमने मुझे अपने हृदय में बसा रखा है।” यूनानी वाक्यांश के दोनों अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: उचित
  rationale: यहाँ शब्द पौलुस के रवैये को न्यायसंगत और यथोचित बताता है; ‘उचित’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक भाव बनाए रखता है।
- source_word: φρονεῖν
  choice: ऐसा सोचना
  rationale: क्रिया सोच और मनोभाव दोनों को समेट सकती है; ‘ऐसा सोचना’ निकट संदर्भ से जुड़कर संक्षिप्त और सहज रहता है।
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: तुम सबके विषय में
  rationale: φρονεῖν के साथ ὑπέρ यहाँ प्रतिनिधित्व करने के बजाय लोगों के प्रति विचार या मनोभाव व्यक्त करता है।
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: क्योंकि तुम मेरे हृदय में बसे हो
  rationale: मुख्य पाठ में पौलुस द्वारा फिलिप्पियों को हृदय में रखने का संदर्भगत रूप लिया गया है। दोनों सर्वनाम कर्मकारक होने के कारण विपरीत अर्थ भी व्याकरणतः संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: δεσμοῖς
  choice: बेड़ियों
  rationale: यह चयन कैद का ठोस बिंब सुरक्षित रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀπολογίᾳ
  choice: पक्ष रखने
  rationale: यह सुसमाचार के प्रतिरक्षण या सार्वजनिक बचाव को व्यक्त करता है; ‘पक्ष रखने’ से हिन्दी में कानूनी अर्थ तक अनावश्यक रूप से सीमित हुए बिना आशय स्पष्ट होता है।
- source_word: βεβαιώσει
  choice: दृढ़ता से स्थापित करने
  rationale: शब्द सुसमाचार की सच्चाई और स्थिरता को पुष्ट अथवा स्थापित करने का भाव देता है।
- source_word: συγκοινωνούς
  choice: मेरे साथ ... सहभागी
  rationale: यह संयुक्त सहभागिता व्यक्त करता है; ‘मेरे साथ सहभागी’ स्वाभाविक हिन्दी में συγ- और μου दोनों का संबंध स्पष्ट करता है।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: यह प्रमुख धर्मवैचारिक पद है और यहाँ परमेश्वर के अनुग्रह में साझा सहभागिता को बनाए रखता है।
theological_decisions:
- issue: हृदय वाले उपवाक्य की वाक्यगत अस्पष्टता
  choice: तुम मेरे हृदय में बसे हो
  alternative: तुमने मुझे अपने हृदय में बसा रखा है
  rationale: प्रमुख अर्थ पौलुस के स्नेह और पिछले कथन के प्रवाह से अच्छी तरह मेल खाता है, लेकिन यूनानी में με और ὑμᾶς दोनों कर्मकारक होने से दूसरा संबंध भी संभव है; इसलिए वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: अनुग्रह में सहभागिता का संबंध
  choice: तुम सब मेरे साथ अनुग्रह के सहभागी हो
  alternative: तुम सब उस अनुग्रह में मेरे सहभागी हो
  rationale: संबंधवाचक τῆς χάριτος सहभागिता की वस्तु बताता है; हिन्दी में मुख्य रूप स्वाभाविक रखते हुए पौलुस के साथ संयुक्त सहभागिता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘बेड़ियों’ से मूल का ठोस बिंब, ‘सुसमाचार’ और ‘अनुग्रह’ से परिचित बाइबलीय शब्दावली, तथा ‘पक्ष रखने’ और ‘दृढ़ता से स्थापित करने’ से युग्मित यूनानी संज्ञाओं का स्पष्ट क्रियात्मक अर्थ सुरक्षित रखा गया है।
