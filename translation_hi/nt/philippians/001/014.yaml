source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: hi
  text: और भाइयों में से अधिकांश ने मेरी बेड़ियों के कारण प्रभु में भरोसा रखते हुए, वचन को निडर होकर बोलने का और भी अधिक साहस किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείονας
  choice: अधिकांश
  rationale: निश्चित पद और अंशसूचक संबंधकारक के साथ यह ‘और अधिक’ नहीं, बल्कि भाइयों के बड़े भाग या बहुमत को दर्शाता है।
- source_word: ἀδελφῶν
  choice: भाई
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। मुख्य पाठ में इसे बनाए रखा गया है; व्यापक रूप से मसीही स्त्री-पुरुष दोनों के सम्मिलित होने की संभावना पादटिप्पणी में दी गई है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का विशिष्ट पदबंध है और यहाँ भरोसे के क्षेत्र या आधार को व्यक्त करता है; सीधा अनुवाद उसकी अर्थगत व्यापकता बनाए रखता है।
- source_word: πεποιθότας
  choice: भरोसा पाकर
  rationale: पूर्णकालिक कृदंत पहले उत्पन्न हुए और अब बने हुए भरोसे की अवस्था बताता है। ‘भरोसा पाकर’ इस परिणामी अवस्था को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῖς δεσμοῖς μου
  choice: मेरी बेड़ियों के कारण
  rationale: ‘बेड़ियाँ’ मूल ठोस बिंब को बनाए रखता है और कारक रूप को प्रसंगानुसार कारण के अर्थ में स्पष्ट करता है।
- source_word: περισσοτέρως
  choice: और भी अधिक
  rationale: यह तुलनात्मक क्रियाविशेषण बढ़े हुए साहस को बताता है; यह हिंदी में स्वाभाविक समतुल्य है।
- source_word: τολμᾶν
  choice: साहस करने लगे हैं
  rationale: यह निर्भीक संकल्प या हिम्मत करने का भाव देता है। पिछले पद से जुड़े परिणामसूचक यूनानी वाक्य को हिंदी में स्वतंत्र और सहज बनाने के लिए ‘लगे हैं’ प्रयुक्त है।
- source_word: ἀφόβως
  choice: निडर होकर
  rationale: यह भय के अभाव को स्पष्ट रूप से व्यक्त करता है, केवल सामान्य साहस को नहीं।
- source_word: τὸν λόγον
  choice: वचन
  rationale: प्रसंग में यह सुसमाचार के संदेश की ओर संकेत करता है, पर मूल में ‘परमेश्वर का’ नहीं है; ‘वचन’ मूल की संक्षिप्तता और पारंपरिक अर्थ-गहराई बनाए रखता है।
- source_word: λαλεῖν
  choice: बोलने
  rationale: यह बोलने की सामान्य क्रिया है; ‘प्रचार करने’ जैसा अधिक विशिष्ट अर्थ जोड़ने से बचा गया है।
theological_decisions:
- issue: ἀδελφοί का दायरा
  choice: मुख्य पाठ में ‘भाई’, और पादटिप्पणी में व्यापक विश्वासी समुदाय की संभावित समावेशिता
  alternative: ‘भाई-बहन’ या ‘विश्वासी’
  rationale: यूनानी रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ उसकी लैंगिक अभिव्यक्ति बनाए रखता है; साथ ही प्रसंग में स्त्री और पुरुष दोनों साथी विश्वासियों के सम्मिलित होने की संभावना को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘प्रभु में’, ‘बेड़ियाँ’ और ‘वचन’ जैसे स्रोत-सन्निकट पद रखे गए हैं, जबकि यूनानी वाक्य की आश्रित रचना को पद के रूप में स्वाभाविक हिंदी वाक्य बनाया गया है।
