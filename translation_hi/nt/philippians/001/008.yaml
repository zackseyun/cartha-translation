id: PHP.1.8
reference: Philippians 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: hi
  text: क्योंकि परमेश्वर मेरा गवाह है कि मैं मसीह यीशु के गहरे स्नेह[a] के साथ तुम सबके लिए कितना तरसता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “करुणा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: गवाह
  rationale: “परमेश्वर मेरा गवाह है” हिन्दी में एक स्वाभाविक और गंभीर कथन है, जो पौलुस की सच्चाई के प्रमाण के लिए परमेश्वर की दुहाई देने का भाव बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन से इस पद का कारणात्मक संबंध स्पष्ट करता है।
- source_word: ὡς
  choice: कितना
  rationale: यह पौलुस की लालसा के तथ्य के साथ उसकी तीव्रता भी व्यक्त करता है।
- source_word: ἐπιποθῶ
  choice: तरसता हूँ
  rationale: यह गहरी व्यक्तिगत लालसा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντας ὑμᾶς
  choice: तुम सबके लिए
  rationale: यह πάντας के समावेशी बल को स्पष्ट रूप से बनाए रखता है।
- source_word: σπλάγχνοις
  choice: गहरे स्नेह
  rationale: शाब्दिक रूप से अंतड़ियों अथवा भीतरी अंगों को सूचित करने वाला यह शब्द गहरी भावना के केंद्र के लिए प्रयुक्त है; “गहरे स्नेह” उसका स्वाभाविक हिन्दी भाव देता है, जबकि “करुणा” को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός के पदवीगत अर्थ को “मसीह” के द्वारा और Ἰησοῦ के नाम को “यीशु” के द्वारा मानक हिन्दी बाइबलीय भाषा में व्यक्त किया गया है।
theological_decisions:
- issue: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ में स्नेह का संबंध
  choice: मसीह यीशु के गहरे स्नेह के साथ
  alternative: मसीह यीशु की करुणा से
  rationale: यूनानी वाक्यांश पौलुस की भावना को मसीह यीशु से संबंधित बताता है, पर उस संबंध की प्रकृति को पूरी तरह नहीं खोलता। “के साथ” इस संबंध को व्यक्त करता है और इसे अनावश्यक रूप से केवल स्रोत, अनुकरण या रहस्यमय सहभागिता के रूप में निर्धारित नहीं करता।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: “मसीह” आधुनिक मानक हिन्दी में समझ में आने वाली स्थापित पदवी है और यूनानी Χριστός के अभिषिक्त जन के पदवीगत अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “तुम सबके लिए कितना तरसता हूँ” सामान्य पाठक के लिए स्वाभाविक है और मूल की भावनात्मक तीव्रता बनाए रखता है।
