  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: hi
  text: मुझे इसी बात का भरोसा है कि जिसने तुम लोगों के बीच[a] एक अच्छा काम आरम्भ किया है, वह उसे मसीह[b] यीशु के दिन तक पूरा कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम लोगों में।”
    reason: lexical_alternative
  - marker: b
    text: 'पारंपरिक रूप: “ख्रीस्त यीशु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: मुझे भरोसा है
  rationale: यह कृदन्त आसपास के वाक्य में पौलुस के प्रथम-पुरुष दृष्टिकोण से जुड़ा है; हिन्दी में स्पष्ट और स्वाभाविक पूर्ण कथन के लिए इसे सीमित क्रिया-वाक्यांश के रूप में व्यक्त किया गया है।
- source_word: αὐτὸ τοῦτο
  choice: इसी बात का
  rationale: αὐτό के बलाघात को ‘इसी’ सुरक्षित रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ὁ ἐναρξάμενος
  choice: जिसने ... आरम्भ किया है
  rationale: मूल पाठ कर्ता का नाम नहीं देता, यद्यपि प्रसंग में वह परमेश्वर है; हिन्दी अनुवाद भी इस निहितार्थ को बिना विस्तार किए सुरक्षित रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम लोगों के बीच
  rationale: ὑμῖν बहुवचन है और पत्र कलीसिया को संबोधित है, इसलिए सामुदायिक अर्थ मुख्य पाठ में रखा गया है; ‘तुम लोगों में’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: ἔργον ἀγαθὸν
  choice: एक अच्छा काम
  rationale: यह मूल यूनानी का सीधा और सामान्य हिन्दी रूप है, जिसमें अनावश्यक धर्मवैज्ञानिक विस्तार नहीं जोड़ा गया।
- source_word: ἐπιτελέσει
  choice: उसे ... पूरा कर देगा
  rationale: यह आरम्भ किए गए काम को सफलतापूर्वक पूर्ण करने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄχρι ἡμέρας
  choice: दिन तक
  rationale: ἄχρι की स्वाभाविक कालवाचक सीमा ‘तक’ है; इसे ‘दिन पर’ करके पूर्णता के सटीक क्षण का ऐसा अर्थ नहीं थोपा गया जो यूनानी में अनिवार्य नहीं है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि है। हिन्दी में ‘मसीह’ उसका प्रचलित और अर्थवाही रूप है; केवल पारम्परिक वैकल्पिक लिप्यन्तरण पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के काम का व्यक्तिगत या सामुदायिक दायरा
  choice: मुख्य पाठ में ‘तुम लोगों के बीच’
  alternative: ‘तुम लोगों में’, जिसका व्यक्तिगत अथवा सामूहिक दोनों अर्थ लिया जा सकता है
  rationale: बहुवचन सर्वनाम और फिलिप्पी की मण्डली को सामूहिक संबोधन मुख्य पाठ में सामुदायिक अर्थ का समर्थन करते हैं, पर पादटिप्पणी मूल पूर्वसर्ग की दूसरी वास्तविक सम्भावना सुरक्षित रखती है।
- issue: काम की पूर्णता और मसीह यीशु के दिन का कालगत सम्बन्ध
  choice: ‘मसीह यीशु के दिन तक पूरा कर देगा’
  alternative: ‘मसीह यीशु के दिन पूरा कर देगा’
  rationale: ἄχρι स्वाभाविक रूप से ‘तक’ की सीमा बताता है। अनुवाद यह अनिवार्य रूप से तय नहीं करता कि पूर्णता केवल उसी दिन के एक क्षण पर होगी या उस दिन तक चलने वाली प्रक्रिया के रूप में।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तुम लोगों’ से बहुवचन संबोधन स्पष्ट होता है। ‘आरम्भ’ और ‘मसीह’ सामान्य बाइबिलीय हिन्दी से परिचित हैं, फिर भी वाक्य-संरचना आज के पाठक के लिए स्वाभाविक रखी गई है।
