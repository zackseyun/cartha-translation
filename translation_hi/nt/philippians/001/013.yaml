lexical_decisions:
- source_word: ὥστε
  choice: फलस्वरूप
  rationale: यह पिछले कथन के परिणाम को प्रस्तुत करता है; ‘फलस्वरूप’ यूनानी के परिणामसूचक बल को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: τοὺς δεσμούς μου
  choice: मेरी बेड़ियाँ
  rationale: δεσμούς का मूर्त अर्थ ‘बेड़ियाँ’ है और यहाँ वह पौलुस की कैद को भी सूचित करता है; मूर्त रूपक को बनाए रखने से मूल भाषा की तीव्रता सुरक्षित रहती है।
- source_word: φανεροὺς ... γενέσθαι
  choice: स्पष्ट हो गया है
  rationale: यह रचना किसी बात के प्रकट या सर्वविदित हो जाने का परिणाम बताती है; ‘स्पष्ट हो गया है’ आधुनिक हिन्दी में सहज है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: यह निकटतम औपचारिक समतुल्य है और संबंध के स्वरूप—कारण, पहचान अथवा मसीह से एकता के क्षेत्र—को अनावश्यक रूप से एक ही अर्थ तक सीमित नहीं करता।
- source_word: Χριστῷ
  choice: मसीह
  rationale: Χριστός अभिषिक्त जन की उपाधि है; ‘मसीह’ हिन्दी में उसका स्थापित और अर्थपूर्ण रूप है।
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: पूरे शाही अंगरक्षक दल
  rationale: इस प्रसंग में πραιτώριον संभवतः शाही अंगरक्षक दल या उससे जुड़े प्रतिष्ठान को सूचित करता है; मुख्य पाठ में सबसे संभावित व्यक्ति-समूह लिया गया है और स्थान-संबंधी विकल्प पादटिप्पणी में रखा गया है।
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: बाकी सभी लोगों को
  rationale: यह प्रेटोरियम से आगे के समस्त लोगों तक दायरा बढ़ाता है और यूनानी के समावेशी बल को स्पष्ट हिन्दी में रखता है।
theological_decisions:
- issue: पौलुस की बेड़ियों के साथ ἐν Χριστῷ का संबंध
  choice: ‘मेरी बेड़ियाँ मसीह में हैं’—संबंध को जानबूझकर व्यापक रखा गया है।
  alternative: ‘मैं मसीह के कारण कैद में हूँ’ अथवा ‘मेरी बेड़ियाँ मसीह से जुड़ी हैं।’
  rationale: मूल यूनानी कारण और मसीह के साथ संबंध/एकता के क्षेत्र के बीच पूर्ण निर्णय नहीं करता। मुख्य पाठ निकट रूप बनाए रखता है और अधिक स्पष्ट कारणात्मक अर्थ को पादटिप्पणी में सुरक्षित करता है।
- issue: πραιτώριον का अभिप्राय
  choice: शाही अंगरक्षक दल
  alternative: पूरा प्रेटोरियम, अर्थात शाही मुख्यालय या निवास-परिसर
  rationale: शब्द किसी अंगरक्षक दल अथवा उससे जुड़े स्थान/प्रतिष्ठान का संकेत दे सकता है। प्रसंग में लोगों को बात ज्ञात होने के कारण दल मुख्य पाठ में स्वाभाविक है, पर स्थानगत अर्थ भी वास्तविक संभावना है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘बेड़ियाँ’ मूल के मूर्त कारावास-बिंब को रखता है। वाक्य-संरचना हिन्दी की स्पष्टता के लिए बदली गई है, जबकि ἐν Χριστῷ की वास्तविक अर्थगत खुलावट मुख्य पाठ और पादटिप्पणी में सुरक्षित है।
