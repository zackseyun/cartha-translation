id: PHP.1.19
reference: Philippians 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि तुम्हारी प्रार्थना और यीशु मसीह की आत्मा की सहायता के द्वारा यह मेरे छुटकारे[a] का कारण बनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उद्धार” अथवा “निर्दोष ठहराया जाना।”
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: पूर्ण रूप वर्तमान अर्थ में प्रयुक्त है और पौलुस के विश्वास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦτό
  choice: इसका
  rationale: एकवचन संकेतवाचक पौलुस की वर्तमान परिस्थिति को समग्र रूप से पीछे की ओर संकेत करता है; इसे अनावश्यक रूप से अधिक निश्चित नहीं किया गया।
- source_word: ἀποβήσεται
  choice: परिणाम ... के रूप में निकलेगा
  rationale: क्रिया किसी परिस्थिति के परिणाम या परिणति को व्यक्त करती है; यह हिन्दी में भाव को स्पष्ट और स्वाभाविक रखता है।
- source_word: σωτηρίαν
  choice: छुटकारे
  rationale: कारावास के तात्कालिक संदर्भ में 'छुटकारा' उपयुक्त है, पर यूनानी शब्द के व्यापक अर्थ—उद्धार या निर्दोष ठहराया जाना—को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δεήσεως
  choice: प्रार्थना
  rationale: यह निवेदनपूर्ण प्रार्थना का सहज और सामान्य आधुनिक हिन्दी पर्याय है।
- source_word: ἐπιχορηγίας
  choice: मिलने वाली सहायता
  rationale: शब्द उपलब्ध कराई गई पूर्ति, सहायता या संसाधन का भाव देता है; इस वाक्य में हिन्दी का यह रूप अस्पष्ट स्वामित्व-संबंध से बचते हुए स्वाभाविक है।
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के आत्मा
  rationale: 'सम्बन्धकारक पदबंध को सीधा रखा गया है: वह आत्मा जो यीशु मसीह से सम्बद्ध है। Χριστός को उसके उपाधिगत अर्थ में ''मसीह'' कहा गया है।'
theological_decisions:
- issue: कारावास के संदर्भ में σωτηρίαν का अर्थ
  choice: छुटकारा
  alternative: उद्धार; निर्दोष ठहराया जाना
  rationale: तात्कालिक संदर्भ पौलुस की बंदी अवस्था और उसके अपेक्षित परिणाम से जुड़ा है, इसलिए 'छुटकारा' मुख्य पाठ में उपयुक्त है। फिर भी शब्द की उद्धार और प्रतिपुष्टि/निर्दोष सिद्ध होने से जुड़ी व्यापकता को पादटिप्पणी में छोड़ा गया है।
- issue: ἐπιχορηγίας τοῦ πνεύματος का सम्बन्ध
  choice: आत्मा से मिलने वाली सहायता
  alternative: आत्मा की सहायता/आत्मा का दिया जाना
  rationale: सम्बन्धकारक रचना यह बता सकती है कि सहायता आत्मा देता है या सहायता स्वयं आत्मा की उपलब्धता है। मुख्य पाठ सहज हिन्दी में स्रोत-संबंध व्यक्त करता है, बिना इस बात को कठोरता से निर्धारित किए कि आत्मा दाता है या प्रदत्त वरदान।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'यीशु मसीह के आत्मा' मूल यूनानी पदबंध की विशिष्टता बनाए रखता है; वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए हल्का पुनर्गठित किया गया है।
