id: PHP.1.25
reference: Philippians 1:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: hi
  text: और इस बात का भरोसा रखते हुए, मैं जानता हूँ कि मैं बना रहूँगा और तुम सबके साथ बना रहूँगा, तुम्हारी उन्नति और विश्वास में आनन्द[a] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास का आनन्द” अथवा “विश्वास से मिलने वाला आनन्द।”
    reason: χαρὰν τῆς πίστεως में षष्ठी सम्बन्ध एक से अधिक अर्थ की अनुमति देता है।
lexical_decisions:
- source_word: πεποιθὼς
  choice: भरोसा रखते हुए
  rationale: पूर्णकालिक कृदन्त एक स्थिर और वर्तमान भरोसे की अवस्था व्यक्त करता है; यह हिन्दी में स्वाभाविक है और भाव को अनावश्यक रूप से तीव्र नहीं करता।
- source_word: μενῶ
  choice: बना रहूँगा
  rationale: यह μένω के सामान्य अर्थ ‘रहना/बने रहना’ और भविष्यकाल को व्यक्त करता है, साथ ही अगले संयुक्त क्रिया-पद से भेद बनाए रखता है।
- source_word: παραμενῶ
  choice: तुम सबके साथ रहूँगा
  rationale: παραμένω यहाँ केवल जीवित बने रहने से आगे, उनके पास या उनके साथ आगे भी रहने का भाव देता है।
- source_word: πᾶσιν ὑμῖν
  choice: तुम सबके साथ
  rationale: πᾶσιν को स्पष्ट रखते हुए सम्बन्धवाचक दत्तिव का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: προκοπὴν
  choice: उन्नति
  rationale: शब्द आगे बढ़ने या प्रगति करने का भाव रखता है; विश्वास के प्रसंग में ‘उन्नति’ सहज और गरिमापूर्ण है।
- source_word: χαρὰν τῆς πίστεως
  choice: विश्वास में तुम्हारी ... आनन्द
  rationale: ‘विश्वास में’ सम्बन्धसूचक षष्ठी की अस्पष्टता को पूरी तरह किसी एक कारणात्मक अर्थ में सीमित नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में πίστις विश्वास करने वाले जीवन को सूचित करता है; ‘विश्वास’ इसका सामान्य और उपयुक्त हिन्दी समतुल्य है।
theological_decisions:
- issue: χαρὰν τῆς πίστεως में षष्ठी सम्बन्ध का अर्थ
  choice: विश्वास में आनन्द
  alternative: विश्वास का आनन्द; विश्वास से मिलने वाला आनन्द
  rationale: यूनानी रचना सम्बन्ध, क्षेत्र अथवा स्रोत की छाया दे सकती है। मुख्य पाठ स्वाभाविक हिन्दी रखता है, जबकि पादटिप्पणी वैकल्पिक सम्भावनाओं को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्बोधन में स्वाभाविक बहुवचन ‘तुम सब’; शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है।
