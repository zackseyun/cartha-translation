  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: hi
  text: ताकि मेरे फिर तुम्हारे पास आने से मसीह यीशु[d] में गर्व करने का तुम्हारा कारण[a] मेरे कारण[b] और भी बढ़ जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा गर्व।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मुझ में”; यहाँ अर्थ “मेरे कारण” या “मेरे संबंध में” हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: “मसीह यीशु” का अनुवाद “ख्रीस्त यीशु” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले कथन से निकलने वाले उद्देश्य अथवा परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ καύχημα ὑμῶν
  choice: तुम्हारा गर्व
  rationale: καύχημα गर्व करने की क्रिया, उसके विषय, या उसके आधार को सूचित कर सकता है। संक्षिप्त मुख्य पाठ मूल की व्यापकता बनाए रखता है; सकारात्मक आशय संदर्भ और ‘मसीह यीशु में’ से स्पष्ट होता है।
- source_word: περισσεύῃ
  choice: और भी बढ़ जाए
  rationale: यह περισσεύω के प्रचुर होने या बढ़ने के भाव तथा ἵνα के बाद आए संभावनार्थक रूप को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν को ‘में’ रखकर पौलुस की अभिव्यक्ति और उसका धर्मवैचारिक संबंध सुरक्षित रखा गया है; Χριστός को उसके पदवी-संबंधी अर्थ में ‘मसीह’ कहा गया है।
- source_word: ἐν ἐμοὶ
  choice: मेरे कारण
  rationale: शाब्दिक अर्थ ‘मुझ में’ है, पर यहाँ पौलुस उनके गर्व का अवसर या आधार है; ‘मेरे कारण’ यह संबंध स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: मेरे फिर से तुम्हारे पास आने के द्वारा
  rationale: διά के साधनात्मक भाव, παρουσία के व्यक्तिगत आगमन, और πάλιν πρὸς ὑμᾶς के पुनः भेंट करने के अर्थ को निकटता से रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: यहाँ Χριστός की पदवी का अर्थ सक्रिय है; ‘मसीह’ आधुनिक हिन्दी में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है।
- issue: ἐν Χριστῷ Ἰησοῦ का वाक्यगत संबंध
  choice: ‘मसीह यीशु में’ को ‘तुम्हारा गर्व’ से जोड़ना
  alternative: इसे ‘बढ़ जाए’ से जोड़कर पढ़ना
  rationale: शब्दक्रम दोनों संबंधों की कुछ संभावना छोड़ता है, पर पौलुस की प्रचलित ‘मसीह में गर्व’ अभिव्यक्ति संज्ञा से संबंध का समर्थन करती है। वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘गर्व’ का सामान्यतः नकारात्मक लग सकने वाला भाव यहाँ ‘मसीह यीशु में’ से नियंत्रित होता है; पादटिप्पणी καύχημα के ‘गर्व करने के कारण’ वाले अर्थ को स्पष्ट करती है।
