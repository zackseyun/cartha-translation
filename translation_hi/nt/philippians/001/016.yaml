  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: hi
  text: कुछ लोग प्रेम के कारण ऐसा करते हैं[a], यह जानते हुए कि मुझे सुसमाचार की पैरवी के लिए ठहराया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ये तो प्रेम के कारण”; कार्य आसपास के प्रसंग से समझा जाता है।
    reason: implicit_action
  - marker: b
    text: या, “मुझे यहाँ सुसमाचार की पैरवी के लिए रखा गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: कुछ लोग … ऐसा करते हैं
  rationale: यूनानी वाक्य में क्रिया प्रसंग से समझी जाती है और μὲν अगले वाक्य के δέ के साथ विरोध दिखाता है। स्वाभाविक हिन्दी में ‘ऐसा करते हैं’ जोड़कर निहित कार्य को स्पष्ट किया गया है; पादटिप्पणी शाब्दिक संरचना बताती है।
- source_word: ἐξ ἀγάπης
  choice: प्रेम के कारण
  rationale: ἐξ यहाँ प्रेरणा या उद्देश्य का स्रोत बताता है। ‘प्रेम के कारण’ आधुनिक हिन्दी में इस भाव को सहज रूप से व्यक्त करता है।
- source_word: εἰδότες
  choice: यह जानते हुए कि
  rationale: यह कृदन्तीय संबंध बनाए रखता है और बताता है कि उनका ज्ञान उनके प्रेमपूर्ण कार्य की पृष्ठभूमि है।
- source_word: εἰς ἀπολογίαν
  choice: पैरवी के लिए
  rationale: ἀπολογία कानूनी या तर्कपूर्ण बचाव को सूचित कर सकता है। ‘पैरवी’ यहाँ सुसमाचार के पक्ष में प्रतिरक्षा और समर्थन, दोनों का स्वाभाविक हिन्दी भाव देता है।
- source_word: τοῦ εὐαγγελίου
  choice: सुसमाचार की
  rationale: ‘सुसमाचार’ आधुनिक हिन्दी मसीही प्रयोग में εὐαγγέλιον के लिए परिचित और अर्थपूर्ण शब्द है।
- source_word: κεῖμαι
  choice: मुझे … ठहराया गया है
  rationale: यहाँ κεῖμαι केवल शारीरिक रूप से पड़े या रखे होने से अधिक, किसी उद्देश्य के लिए नियत स्थिति में होने का भाव देता है। ‘ठहराया गया’ उस भाव को व्यक्त करता है, जबकि वैकल्पिक अधिक स्थानगत अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: कैद के प्रसंग में κεῖμαι का अर्थ
  choice: मुझे … ठहराया गया है
  alternative: मुझे यहाँ … के लिए रखा गया है
  rationale: मुख्य पाठ पौलुस की वर्तमान दशा के उद्देश्यपूर्ण होने का भाव रखता है, पर यह स्पष्ट रूप से नहीं जोड़ता कि किसने उसे नियुक्त किया। वैकल्पिक स्थानगत अर्थ पादटिप्पणी में दिया गया है ताकि मूल की अर्थ-व्याप्ति बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऐसा करते हैं’ प्रसंग में निहित प्रचार के कार्य को बिना अनावश्यक पुनरावृत्ति के स्पष्ट करता है; ‘पैरवी’ कानूनी तथा तर्कपूर्ण बचाव की छाया को बनाए रखती है।
