source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: hi
  text: पर दूसरे लोग स्वार्थी महत्त्वाकांक्षा से मसीह का प्रचार करते हैं, शुद्ध भाव से नहीं; वे यह सोचकर ऐसा करते हैं कि मेरी कैद[a] में क्लेश बढ़ा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी बेड़ियाँ”; अर्थात मेरी कैद में।
    reason: δεσμοί के शाब्दिक ‘बेड़ियाँ’ अर्थ को सुरक्षित रखते हुए मुख्य पाठ में उसका प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: ἐριθείας
  choice: स्वार्थी महत्त्वाकांक्षा
  rationale: यह शब्द केवल सामान्य स्वार्थ नहीं, बल्कि अपने लाभ और प्रतिस्पर्धी गुटबंदी से प्रेरित महत्त्वाकांक्षा को व्यक्त करता है। यह पद के विरोधी उद्देश्यों को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός प्रचार की विषयवस्तु और यीशु की उपाधि के रूप में आया है; हिन्दी में ‘मसीह’ इसका स्थापित और स्वाभाविक रूप है।
- source_word: καταγγέλλουσιν
  choice: प्रचार करते हैं
  rationale: क्रिया सार्वजनिक रूप से घोषणा करने का भाव रखती है। ‘प्रचार करते हैं’ इस सन्दर्भ में स्वाभाविक है और इसे केवल औपचारिक उपदेश तक सीमित नहीं करता।
- source_word: ἁγνῶς
  choice: शुद्ध मन से
  rationale: यहाँ क्रिया-विशेषण उद्देश्यों की शुद्धता से सम्बन्धित है। ‘शुद्ध मन से नहीं’ नैतिक अभिप्राय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἰόμενοι
  choice: वे सोचते हैं
  rationale: यह रूप उनकी धारणा अथवा अपेक्षा बताता है। अलग वाक्य में ‘वे सोचते हैं’ हिन्दी में स्पष्ट और सहज है।
- source_word: θλῖψιν ἐγείρειν
  choice: क्लेश खड़ा कर देंगे
  rationale: शाब्दिक चित्र ‘क्लेश उठाना’ हिन्दी में अस्वाभाविक है। ‘क्लेश खड़ा करना’ दुःख या दबाव उत्पन्न करने के आशय और मूल रूपक, दोनों को पर्याप्त रूप से बनाए रखता है।
- source_word: τοῖς δεσμοῖς μου
  choice: मेरी कैद
  rationale: δεσμοί का शाब्दिक अर्थ ‘बेड़ियाँ’ है, पर यहाँ वह पौलुस की कैद को सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: Χριστός का उपाधि-सूचक प्रयोग
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पद में यीशु को प्रतिज्ञात अभिषिक्त जन के रूप में घोषित करना प्रमुख है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और व्यापक रूप से समझी जाने वाली उपाधि है।
- issue: विरोधियों की मंशा और अपेक्षित परिणाम
  choice: वे सोचते हैं कि वे ... क्लेश खड़ा कर देंगे
  alternative: वे ... क्लेश खड़ा करने के उद्देश्य से प्रचार करते हैं
  rationale: οἰόμενοι उनकी सोच या अपेक्षा व्यक्त करता है; इसे निश्चित सफल उद्देश्य में बदलना मूल की हल्की अस्पष्टता को मिटा देता। इसलिए उनकी धारणा को अलग से व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर दूसरे लोग’ पिछले पद के समूह के साथ स्पष्ट विरोध बनाए रखता है। दो छोटे वाक्यों का प्रयोग हिन्दी में जटिल participial रचना को स्वाभाविक बनाता है, बिना अर्थगत सम्बन्ध खोए।
