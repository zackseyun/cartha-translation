id: PHP.1.20
reference: Philippians 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: hi
  text: मेरी उत्कट प्रतीक्षा और आशा के अनुसार, मैं किसी भी बात में लज्जित नहीं किया जाऊँगा,[a] बल्कि पूरे साहस के साथ, जैसा सदा होता आया है, वैसा ही अब भी, मेरी देह में मसीह[b] की बड़ाई होगी—चाहे जीवन के द्वारा, चाहे मृत्यु के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं किसी भी बात में लज्जित नहीं होऊँगा।”
    reason: यूनानी क्रिया सार्वजनिक रूप से लज्जित किए जाने या स्वयं लज्जित होने—दोनों अर्थों में समझी जा सकती है।
  - marker: b
    text: या, “ख्रीष्ट।”
    reason: Χριστός को अर्थानुवाद ‘मसीह’ या पारम्परिक लिप्यन्तरण ‘ख्रीष्ट’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: κατὰ
  choice: के अनुसार
  rationale: यह पौलुस की उत्कट प्रतीक्षा और आशा के अनुरूप होने का भाव व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: ἀποκαραδοκίαν
  choice: उत्कट प्रतीक्षा
  rationale: यह दुर्लभ और सघन शब्द आगे की ओर लगी हुई तीव्र प्रतीक्षा का भाव रखता है; ‘उत्कट प्रतीक्षा’ उस बल को संक्षेप में व्यक्त करती है।
- source_word: ἐλπίδα
  choice: आशा
  rationale: यहाँ पौलुस की भरोसे से भरी आशा अभिप्रेत है और ‘उत्कट प्रतीक्षा’ के साथ स्वाभाविक युग्म बनता है।
- source_word: ἐν οὐδενὶ
  choice: किसी भी बात में
  rationale: यह सर्वथा निषेध को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: αἰσχυνθήσομαι
  choice: लज्जित नहीं किया जाऊँगा
  rationale: रूप में सार्वजनिक रूप से लज्जित या निराश सिद्ध किए जाने का निष्क्रिय भाव सम्भव है; मुख्य पाठ में उसे सुरक्षित रखा गया है, जबकि आत्मगत ‘लज्जित होऊँगा’ को पादटिप्पणी में दिया गया है।
- source_word: παρρησίᾳ
  choice: साहस
  rationale: सन्दर्भ में निर्भीक सार्वजनिक साक्षी का भाव प्रमुख है; ‘पूरे साहस के साथ’ πάσῃ के व्यापक बल को भी व्यक्त करता है।
- source_word: μεγαλυνθήσεται
  choice: की बड़ाई होगी
  rationale: यह मसीह को महान प्रकट या प्रतिष्ठित किए जाने का अर्थ स्वाभाविक हिन्दी में देता है और मूल के रूपक को बनाए रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός का उपाधिगत, अर्थपूर्ण बल सुनाई देता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में उसी उपाधि को स्पष्ट रखता है।
- source_word: ἐν τῷ σώματί μου
  choice: मेरी देह में
  rationale: यह मूल के ἐν को निकटता से रखता है और पौलुस की देह में घटने वाली जीवित अथवा मरणशील साक्षी को अस्पष्ट किए बिना व्यक्त करता है।
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: चाहे जीवन के द्वारा, चाहे मृत्यु के द्वारा
  rationale: दोनों समानान्तर विकल्पों और διά के माध्यम अथवा परिस्थिति-संबंधी भाव को सुरक्षित रखता है।
theological_decisions:
- issue: पौलुस के पत्र में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस वाक्य में शब्द केवल नाम-जैसा संकेत नहीं, बल्कि यीशु की मसीही उपाधि का अर्थ भी वहन करता है; इसलिए मुख्य पाठ में ‘मसीह’ रखा गया है और पारम्परिक लिप्यन्तरण पादटिप्पणी में दिया गया है।
- issue: αἰσχυνθήσομαι में सार्वजनिक अपमान और आत्मगत लज्जा
  choice: लज्जित नहीं किया जाऊँगा
  alternative: लज्जित नहीं होऊँगा
  rationale: सन्दर्भ पौलुस की सार्वजनिक साक्षी और उसके परिणाम से जुड़ा है, इसलिए निष्क्रिय/सार्वजनिक अर्थ मुख्य पाठ में उपयुक्त है; फिर भी यूनानी रूप आत्मगत लज्जा का अर्थ भी दे सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: μεγαλυνθήσεται का कर्तृवाच्य हिन्दी रूप
  choice: मसीह की बड़ाई होगी
  alternative: मसीह महान ठहराया जाएगा
  rationale: दोनों मसीह को महान प्रकट किए जाने का भाव देते हैं; ‘की बड़ाई होगी’ अधिक स्वाभाविक और प्रतिष्ठित हिन्दी है तथा यह नहीं बताता कि मसीह स्वयं अधिक महान बनते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। ‘उत्कट प्रतीक्षा’, ‘पूरे साहस के साथ’ और ‘की बड़ाई होगी’ मूल के भाव और बाइबलीय गम्भीरता को बिना अनावश्यक संस्कृतनिष्ठता के सँभालते हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी चिह्नों का क्रम असंगत दिखाई देता है; हिन्दी मसौदे में प्रत्येक विकल्प को उसके सम्बद्ध शब्द के ठीक बाद रखा गया है।
