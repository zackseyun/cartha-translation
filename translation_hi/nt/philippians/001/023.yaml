source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: hi
  text: पर मैं इन दोनों के बीच दबाव में हूँ; मेरी इच्छा प्रस्थान करूँ और मसीह के साथ रहूँ, क्योंकि यह कहीं अधिक उत्तम है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέχομαι
  choice: दबा हुआ हूँ
  rationale: यह क्रिया दोनों विकल्पों के दबाव में होने का भाव व्यक्त करती है। यह अनुवाद केवल सामान्य ‘दुविधा’ कहने के बजाय मूल के दबाव और बँधे होने के भाव को बनाए रखता है।
- source_word: ἐκ τῶν δύο
  choice: इन दोनों के बीच
  rationale: यूनानी मुहावरे का आशय दो विकल्पों के बीच दबाव में होना है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: मेरी इच्छा है
  rationale: इससे ἐπιθυμία संज्ञा का स्पष्ट अर्थ बना रहता है और हिन्दी वाक्य सहज सुनाई देता है।
- source_word: ἀναλῦσαι
  choice: विदा हो जाऊँ
  rationale: मूल शब्द का शाब्दिक प्रस्थान-संबंधी रूप सुरक्षित रखा गया है; प्रसंग में यह मृत्यु के लिए सौम्य अभिव्यक्ति है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: Χριστῷ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसका प्रचलित और अर्थपूर्ण हिन्दी रूप है।
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: क्योंकि यह कहीं अधिक उत्तम है
  rationale: यह अभिव्यक्ति मूल के प्रबल तुलनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: मृत्यु के बाद मसीह के साथ होने का निहितार्थ
  choice: विदा हो जाऊँ और मसीह के साथ रहूँ
  alternative: मरकर तुरंत स्वर्ग में मसीह के पास जाऊँ
  rationale: अनुवाद वही कहता है जो यूनानी पाठ स्पष्ट रूप से कहता है—विदा होना और मसीह के साथ रहना—और समय, स्थान या मध्यवर्ती अवस्था के विषय में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दबा हुआ हूँ’ मूल के दबाव के भाव को बनाए रखता है, जबकि ‘विदा हो जाऊँ’ पौलुस की सौम्य अभिव्यक्ति को सुरक्षित रखता है।
