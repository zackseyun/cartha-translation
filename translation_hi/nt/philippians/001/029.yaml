  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: hi
  text: क्योंकि मसीह के निमित्त[a] तुम्हें यह कृपा दी गई है कि तुम न केवल उस पर विश्वास करो[b], बल्कि उसके निमित्त दुःख भी सहो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के कारण” अथवा “मसीह के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर भरोसा रखो।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके कारण दुःख सहो” अथवा “उसके लिए दुःख सहो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐχαρίσθη
  choice: यह कृपा दी गई है
  rationale: क्रिया में केवल अनुमति देने का नहीं, बल्कि कृपापूर्वक उपहार देने का भाव है। यह निष्क्रिय रूप में निहित दैवी कर्ता को अनकहा रखता है और विश्वास तथा दुःख—दोनों को मिली हुई कृपा के अंतर्गत रखता है।
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: मसीह के निमित्त
  rationale: यह पदबंध आगे आने वाले दोनों क्रियार्थक पदों के लिए शीर्षक-सदृश भूमिका निभाता है और मसीह से जुड़े कारण अथवा हित का भाव देता है। ‘मसीह’ Χριστός को उपाधि के रूप में व्यक्त करता है।
- source_word: πιστεύειν εἰς αὐτόν
  choice: उस पर विश्वास करो
  rationale: यह किसी व्यक्ति में विश्वास रखने या उस पर भरोसा करने की सामान्य और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: πάσχειν
  choice: दुःख भी सहो
  rationale: मूल क्रिया कष्ट या दुःख भोगने को सीधे व्यक्त करती है; ‘दुःख सहना’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ὑπὲρ αὐτοῦ
  choice: उसके निमित्त
  rationale: यह मसीह के कारण, उसके लिए अथवा उसके हित में दुःख सहने का भाव रखता है। पहले ὑπέρ के साथ समान शब्दावली मूल की पुनरावृत्ति को भी सुरक्षित रखती है।
theological_decisions:
- issue: क्या विश्वास और दुःख सहना—दोनों को कृपा के रूप में दिया हुआ बताया जाए
  choice: दोनों को ‘यह कृपा दी गई है’ के समान व्याकरणिक दायरे में रखा गया है
  alternative: वाक्य को इस प्रकार नरम करना कि केवल विश्वास कृपा हो या दुःख सहना मात्र अनुमति अथवा परिस्थिति लगे
  rationale: यूनानी वाक्य में ‘न केवल... बल्कि... भी’ के दोनों क्रियार्थक पद ἐχαρίσθη के अधीन हैं। अनुवाद इस कठिन धर्मवैचारिक तनाव को बिना घटाए बनाए रखता है।
- issue: τὸ ὑπὲρ Χριστοῦ का संबंध और अर्थ
  choice: ‘मसीह के निमित्त’ को दोनों आगामी बातों पर लागू होने वाले आरंभिक पदबंध के रूप में रखा गया है
  alternative: इसे केवल दुःख सहने से जोड़ना, या स्पष्ट रूप से ‘मसीह की ओर से’ कहकर मसीह को देने वाला कर्ता ठहराना
  rationale: मूल संरचना इस पदबंध को शीर्षक-सदृश रूप में रखती है, पर ὑπέρ में कारण, हित और निमित्त के बीच अर्थगत विस्तार है। हिन्दी पाठ एक अर्थ को जरूरत से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘निमित्त’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर यहाँ ὑπέρ की अर्थगत व्यापकता और दोनों स्थानों की पुनरावृत्ति को संक्षेप में सुरक्षित रखता है।
