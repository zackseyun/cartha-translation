review_pass:
  verdict: approve
  source_fidelity: The Hindi accurately preserves the explanatory force of ὅτι, the passive gift/grace nuance of ἐχαρίσθη, and the scope in which both believing and suffering are granted. ‘मसीह के निमित्त’ appropriately renders the broad ὑπέρ relation and, by its initial placement, applies to both following infinitival clauses. The repeated ‘उसके निमित्त’ also reflects the source’s repeated ὑπέρ. ‘उस पर विश्वास करो’ and ‘दुःख सहो’ faithfully convey πιστεύειν εἰς αὐτόν and πάσχειν.
  naturalness: The sentence is clear, grammatical, and suitably dignified in modern standard Hindi. ‘निमित्त’ is somewhat formal but is natural in biblical/literary register and usefully maintains the source’s semantic breadth and repetition. The ‘न केवल … बल्कि … भी’ construction is fluent.
  terminology: ‘मसीह’ properly represents Χριστός as a title. ‘कृपा दी गई है’ retains the gracious-gift sense without specifying the unexpressed giver. ‘विश्वास’ and ‘दुःख सहो’ are established, understandable Hindi theological and general-language terms.
