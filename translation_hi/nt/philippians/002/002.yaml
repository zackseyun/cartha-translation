  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: hi
  text: मेरे आनन्द को पूरा कर दो, ताकि तुम एक ही सोच रखो[a], एक ही प्रेम रखते हुए, एक-प्राण[b] होकर, एक ही बात सोचो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक मन के हो।”
    reason: φρονέω सोच, मनोभाव या मानसिकता को सूचित कर सकता है।
  - marker: b
    text: शाब्दिक रूप से, “एक प्राण वाले”; या, “एक मन होकर।”
    reason: σύμψυχοι एक दुर्लभ संयुक्त शब्द है, जो साझा आन्तरिक जीवन अथवा गहरी मनोभावगत एकता का बिंब देता है।
  - marker: c
    text: या, “एक ही उद्देश्य पर मन लगाओ।”
    reason: τὸ ἓν φρονοῦντες का अर्थ शाब्दिक रूप से एक ही बात सोचना या अधिक भावगत रूप से एक उद्देश्य पर केंद्रित रहना हो सकता है।
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: मेरा आनन्द पूरा कर दो
  rationale: आज्ञार्थक क्रिया आनन्द को उसकी पूरी मात्रा तक पहुँचाने का भाव देती है। यह अनुवाद पूर्णता की मूल उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह पौलुस की आज्ञा के अभिप्रेत परिणाम अथवा उसकी विषय-वस्तु को जोड़ता है; ‘ताकि’ प्रयोजन के भाव को स्पष्ट रखता है।
- source_word: τὸ αὐτὸ φρονῆτε
  choice: तुम एक ही सोच रखो
  rationale: φρονέω केवल बौद्धिक विचार नहीं, बल्कि मनोभाव और दृष्टिकोण को भी व्यक्त करता है। ‘एक ही सोच रखो’ आधुनिक हिन्दी में सहज है और एकता के आह्वान को व्यक्त करता है।
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: एक ही प्रेम रखते हुए
  rationale: यह सहभागी क्रिया-रचना को बनाए रखता है और ἀγάπη का सामान्य, स्पष्ट अनुवाद ‘प्रेम’ देता है।
- source_word: σύμψυχοι
  choice: एक-प्राण होकर
  rationale: यह संयुक्त शब्द के ‘साथ/एक’ और ‘प्राण/अन्तर्मन’ संबंधी सजीव बिंब को बचाता है तथा सामान्य ‘एकजुट’ की तुलना में मूल की तीव्रता बेहतर व्यक्त करता है।
- source_word: τὸ ἓν φρονοῦντες
  choice: एक ही बात सोचो
  rationale: यह पहले आए φρονέω के साथ शब्दगत पुनरावृत्ति बनाए रखता है और यूनानी के शाब्दिक खुलेपन को किसी एक निश्चित उद्देश्य तक सीमित नहीं करता।
theological_decisions:
- issue: एकता के आह्वान में φρονέω की पुनरावृत्ति को कैसे व्यक्त किया जाए
  choice: ‘एक ही सोच रखो’ और ‘एक ही बात सोचो’ के द्वारा सोच/मनोभाव की पुनरावृत्ति बनाए रखना
  alternative: ‘एक मन रहो’ और ‘एक ही उद्देश्य पर मन लगाओ’
  rationale: मूल पाठ पुनरावृत्ति और भिन्न अभिव्यक्तियों के द्वारा एकता पर बल देता है। चुना हुआ रूप इस अलंकारिक संबंध को सुरक्षित रखता है, पर इसे संस्थागत या पूर्ण वैचारिक एकरूपता की संकीर्ण धारणा में नहीं बदलता।
- issue: σύμψυχοι में आत्मिक अथवा आन्तरिक एकता का बिंब
  choice: एक-प्राण होकर
  alternative: एक मन होकर; आत्मा में एक होकर
  rationale: ‘एक-प्राण’ मूल संयुक्त शब्द के बिंब और घनिष्ठ आन्तरिक एकता को बनाए रखता है। ‘आत्मा में एक’ से पवित्र आत्मा का ऐसा स्पष्ट संकेत निकल सकता है जो इस शब्द में अनिवार्य नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘एक-प्राण’ कुछ साहित्यिक है, पर मूल के सजीव संयुक्त शब्द को बचाता है और पादटिप्पणी उसका सहज विकल्प देती है। वाक्य की सहभागी संरचना तथा φρονέω की पुनरावृत्ति यथासम्भव सुरक्षित रखी गई है।
