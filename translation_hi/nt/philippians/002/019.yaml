reference: Philippians 2:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: hi
  text: पर मैं प्रभु यीशु में आशा रखता हूँ कि तीमुथियुस को शीघ्र तुम्हारे पास भेजूँ, ताकि तुम्हारे विषय में जानकर मैं भी उत्साहित होऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: मैं आशा रखता हूँ
  rationale: वर्तमान काल में पौलुस की मौजूदा आशा या अपेक्षा व्यक्त होती है; यह हिंदी में स्वाभाविक और सीधा है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का संक्रमण या विरोध दर्शाता है; ‘पर’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: प्रभु यीशु में
  rationale: ἐν के संबंधपरक और निर्भरता-सूचक भाव को बनाए रखा गया है तथा κύριος के मसीही शीर्षक के लिए प्रचलित ‘प्रभु’ रखा गया है।
- source_word: Τιμόθεον
  choice: तीमुथियुस
  rationale: व्यक्तिनाम का मानक हिंदी बाइबलीय लिप्यंतरण।
- source_word: ταχέως
  choice: शीघ्र
  rationale: यहाँ समय की निकटता व्यक्त होती है; ‘शीघ्र’ गरिमापूर्ण, स्पष्ट और स्वाभाविक है।
- source_word: πέμψαι
  choice: भेजूँ
  rationale: ἐλπίζω के बाद आए infinitive को हिंदी में आशा-निर्भर क्रियारूप से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ὑμῖν
  choice: तुम्हारे पास
  rationale: किसी व्यक्ति को समुदाय के पास भेजने के संदर्भ में यह हिंदी का स्वाभाविक प्रयोग है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक संबंध को आधुनिक हिंदी में स्पष्ट रखता है।
- source_word: κἀγὼ
  choice: मेरा भी
  rationale: κἀγώ में निहित ‘मैं भी’ के बल को हिंदी वाक्य-संरचना के अनुसार ‘मेरा भी मन’ में सुरक्षित रखा गया है।
- source_word: εὐψυχῶ
  choice: मन प्रसन्न हो
  rationale: क्रिया का अर्थ अच्छे मनोभाव या उत्साह में होना है; ‘मन प्रसन्न हो’ हिंदी में सहज है और केवल बाहरी प्रोत्साहन का अर्थ नहीं थोपता।
- source_word: γνοὺς
  choice: जानकर
  rationale: aorist participle का पूर्वकालिक/परिस्थितिजन्य संबंध हिंदी कृदंत ‘जानकर’ से संक्षेप में सुरक्षित रहता है।
- source_word: τὰ περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: यूनानी अभिव्यक्ति को अनावश्यक रूप से केवल कुशल-क्षेम तक सीमित किए बिना उनके संबंध की खबर या परिस्थितियों का व्यापक भाव बनाए रखता है।
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: नए नियम में यीशु के मसीही शीर्षक के रूप में ‘प्रभु’ मानक और प्रसंगानुकूल है; इस पद में किसी अन्य अर्थ की आवश्यकता नहीं है।
- issue: ἐν κυρίῳ Ἰησοῦ में ἐν का संबंध
  choice: प्रभु यीशु में
  alternative: प्रभु यीशु के द्वारा
  rationale: ‘में’ पौलुस की आशा के प्रभु से संबंध और उन पर निर्भरता की अस्पष्टता को बनाए रखता है; ‘के द्वारा’ साधन का अर्थ अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है। अंतिम खंड को ‘तुम कैसे हो’ बनाकर सीमित न करते हुए मूल के व्यापक τὰ περὶ ὑμῶν का भाव रखा गया है।
