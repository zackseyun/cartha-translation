- from: पर मैं प्रभु यीशु में आशा रखता हूँ कि तीमुथियुस को शीघ्र तुम्हारे पास भेजूँ, ताकि तुम्हारे विषय में जानकर मेरा भी मन प्रसन्न हो।
  to: पर मैं प्रभु यीशु में आशा रखता हूँ कि तीमुथियुस को शीघ्र तुम्हारे पास भेजूँ, ताकि तुम्हारे विषय में जानकर मैं भी उत्साहित होऊँ।
