base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: hi
  text: क्योंकि वह आप सभी को बहुत याद कर रहा था और बहुत व्याकुल था, क्योंकि आपने सुना था कि वह बीमार पड़ गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: क्योंकि
  rationale: यह इपफ्रुदीतुस को वापस भेजने का कारण बताता है और पिछले वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐπιποθῶν ἦν
  choice: से मिलने के लिए तरस रहा था
  rationale: वर्तमान कृदंत और अपूर्णकालीन सहायक क्रिया अतीत में जारी गहरी लालसा व्यक्त करते हैं। हिन्दी में व्यक्तियों के संदर्भ में ‘मिलने के लिए तरस रहा था’ स्वाभाविक रूप से यही भाव देता है।
- source_word: πάντας ὑμᾶς
  choice: आप सब
  rationale: πάντας के समावेशी बल को स्पष्ट रखता है और आधुनिक सम्मानसूचक हिन्दी में स्वाभाविक है।
- source_word: ἀδημονῶν
  choice: बहुत व्याकुल था
  rationale: यह शब्द साधारण चिंता से अधिक तीव्र मानसिक बेचैनी बताता है; ‘बहुत व्याकुल’ उस तीव्रता को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: διότι
  choice: क्योंकि
  rationale: उसकी व्याकुलता का सीधा कारण प्रस्तुत करता है।
- source_word: ἠκούσατε
  choice: आपने सुन लिया था
  rationale: दूसरे पुरुष बहुवचन को स्पष्ट रखता है। हिन्दी का पूर्ण भूतकाल बीमारी का समाचार मिलने को उसकी जारी व्याकुलता से पहले की घटना के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι ἠσθένησεν
  choice: कि वह बीमार पड़ गया था
  rationale: यहाँ ἀσθενέω शारीरिक बीमारी का संकेत देता है; ‘बीमार पड़ गया था’ बीमारी घटित होने और उसका समाचार पहुँचने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन ‘आप सब’; सरल, गरिमापूर्ण और मंडलीय पाठ के लिए सहज। अंग्रेज़ी परामर्श-पाठ की वैकल्पिक टिप्पणी को शामिल नहीं किया गया, क्योंकि ‘उसने सुना कि आपने सुना’ के लिए यूनानी पाठ में अलग क्रिया नहीं है और ἠκούσατε स्पष्टतः ‘आपने सुना’ है।
