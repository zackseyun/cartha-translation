revisions:
- from: क्योंकि वह आप सब से मिलने के लिए तरस रहा था और बहुत व्याकुल था, क्योंकि आपने सुन लिया था कि वह बीमार पड़ गया था।
  to: क्योंकि वह आप सभी को बहुत याद कर रहा था और बहुत व्याकुल था, क्योंकि आपने सुना था कि वह बीमार पड़ गया था।
  rationale: The revision removes the added notion of meeting while retaining an idiomatic Hindi expression for Epaphroditus’s sustained longing. It also renders “you heard” more directly. The English audit footnote’s alternative (“because he heard that you had heard”) is not supported by the supplied SBLGNT text, which has ἠκούσατε (“you heard”); therefore no Hindi footnote is added.
