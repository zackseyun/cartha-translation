id: PHP.2.25
reference: Philippians 2:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: hi
  text: पर मैंने इपफ्रुदीतुस को तुम्हारे पास भेजना आवश्यक समझा। वह मेरा भाई, सहकर्मी और संगी सैनिक है, और तुम्हारा भेजा हुआ प्रतिनिधि[a] तथा मेरी आवश्यकता में सेवा करनेवाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा प्रेरित”—अर्थात तुम्हारी ओर से भेजा गया व्यक्ति।
    reason: ἀπόστολον के व्यापक ‘भेजे हुए प्रतिनिधि’ और संभावित पारिभाषिक ‘प्रेरित’ अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: आवश्यक
  rationale: यह शब्द उस बात को व्यक्त करता है जिसे पौलुस ने जरूरी माना; ‘आवश्यक’ आधुनिक मानक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἡγησάμην
  choice: मैंने ... समझा
  rationale: यह पौलुस के विचारपूर्ण आकलन को व्यक्त करता है, केवल अनिश्चित राय को नहीं।
- source_word: πέμψαι
  choice: भेजना
  rationale: यूनानी पाठ में केवल ‘भेजना’ स्पष्ट है; ‘वापस भेजना’ संदर्भ से निकला विस्तार होगा।
- source_word: ἀδελφὸν
  choice: भाई
  rationale: यह सहविश्वासी के लिए प्रयुक्त पारिवारिक संबोधन को सीधे बनाए रखता है।
- source_word: συνεργὸν
  choice: सहकर्मी
  rationale: यह साथ मिलकर काम करनेवाले व्यक्ति का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: συστρατιώτην
  choice: संगी सैनिक
  rationale: यह यूनानी के सैन्य रूपक को स्पष्ट रूप से बनाए रखता है और ‘सहकर्मी’ के साथ अनावश्यक ध्वन्यात्मक पुनरावृत्ति से बचता है।
- source_word: ἀπόστολον
  choice: भेजा हुआ प्रतिनिधि
  rationale: यहाँ इपफ्रुदीतुस फिलिप्पियों की ओर से भेजा गया व्यक्ति है; यह रूप भेजे जाने और प्रतिनिधित्व, दोनों भावों को रखता है, बिना औपचारिक प्रेरित-पद का अर्थ थोपे।
- source_word: λειτουργὸν
  choice: सेवा करनेवाला
  rationale: यह व्यावहारिक और गरिमापूर्ण सेवा को व्यक्त करता है तथा आधुनिक धार्मिक पद का अनचाहा संकेत नहीं देता।
- source_word: τῆς χρείας μου
  choice: मेरी आवश्यकता में
  rationale: यह पौलुस की जरूरत के संबंध में की गई सेवा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ἀπόστολον को औपचारिक पद ‘प्रेरित’ के रूप में अनुवाद किया जाए या व्यापक अर्थ में भेजे हुए प्रतिनिधि के रूप में
  choice: भेजा हुआ प्रतिनिधि
  alternative: प्रेरित
  rationale: निकटवर्ती संदर्भ में इपफ्रुदीतुस फिलिप्पी की मण्डली द्वारा पौलुस के पास भेजा गया था। मुख्य पाठ व्यापक प्रासंगिक अर्थ देता है, जबकि पादटिप्पणी ‘प्रेरित’ की शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठकों के लिए स्पष्ट। वाक्य को हिन्दी की स्वाभाविक पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘इपफ्रुदीतुस’ प्रचलित हिन्दी बाइबलीय नामरूप है।
