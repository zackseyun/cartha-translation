lexical_decisions:
- source_word: μηδὲν
  choice: कुछ न करो
  rationale: निषेधात्मक उपदेश को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατ’ ἐριθείαν
  choice: स्वार्थी महत्त्वाकांक्षा से
  rationale: ἐριθεία में स्वार्थपूर्ण, प्रतिस्पर्धी और गुटबंदी कराने वाली आकांक्षा का भाव है; यह चयन उस प्रेरक कारण को स्पष्ट रखता है।
- source_word: κατὰ κενοδοξίαν
  choice: खोखले घमंड से
  rationale: κενοδοξία का शाब्दिक भाव ‘खोखली महिमा’ है; ‘खोखला घमंड’ आत्म-बड़ाई की निरर्थकता को सहज हिन्दी में रखता है।
- source_word: τῇ ταπεινοφροσύνῃ
  choice: दीनता से
  rationale: रीति अथवा भाव को दर्शाने वाले दत्तिव को संक्षिप्त रूप में व्यक्त करता है; ‘दीनता’ यहाँ आत्म-हीनता नहीं, नम्र मनोवृत्ति है।
- source_word: ἀλλήλους ἡγούμενοι
  choice: एक-दूसरे को ... समझो
  rationale: ἡγέομαι के विचारपूर्वक मूल्यांकन करने के अर्थ और पारस्परिक ἀλλήλους—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: अपने से बढ़कर
  rationale: ὑπερέχω के तुलनात्मक ‘ऊपर/श्रेष्ठ होना’ भाव को बनाए रखता है, पर किसी जन्मजात या तात्त्विक श्रेष्ठता को अनिवार्य नहीं करता।
theological_decisions:
- issue: दूसरों को अपने से बढ़कर मानने का आशय
  choice: अपने से बढ़कर समझो
  alternative: अपने से अधिक महत्त्वपूर्ण समझो
  rationale: मूल पाठ तुलनात्मक ὑπερέχοντας का व्यापक भाव रखता है। ‘बढ़कर’ उस वास्तविक तनाव और व्यापकता को सुरक्षित रखता है, बिना इसे केवल महत्त्व या दर्जे तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सुबोध। ‘दीनता’ बाइबलीय नैतिक भाव को रखती है, जबकि ‘खोखला घमंड’ κενοδοξία की अर्थ-छवि को सहज भाषा में व्यक्त करता है।
