- from: 'पर तुम उसके परखे हुए चरित्र को जानते हो[a]: जैसे संतान पिता के साथ सेवा करती है[b], वैसे ही उसने मेरे साथ सुसमाचार के लिए सेवा की।'
  to: पर तुम उसका परखा हुआ चरित्र जानते हो[a], कि उसने सुसमाचार के लिए मेरे साथ वैसी ही सेवा की जैसे एक संतान पिता के साथ करती है[b]।
  rationale: The revision retains every substantive element of the Greek while placing Timothy's completed service in the main assertion and using the father-child language as the intended comparison. It also makes the expression for δοκιμή more idiomatic in modern standard Hindi. Footnote anchors remain attached to the relevant terms.
