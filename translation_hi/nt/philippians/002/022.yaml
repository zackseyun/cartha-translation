id: PHP.2.22
reference: Philippians 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: hi
  text: पर तुम उसका परखा हुआ चरित्र जानते हो[a], कि उसने सुसमाचार के लिए मेरे साथ वैसी ही सेवा की जैसे एक संतान पिता के साथ करती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ऐसा चरित्र जो परखे जाने पर खरा सिद्ध हुआ हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जैसे पिता के साथ संतान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: संदर्भ में हल्का विरोध अथवा संक्रमण व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δοκιμὴν
  choice: परखे हुए चरित्र
  rationale: यह केवल परीक्षा या प्रमाण नहीं, बल्कि परखे जाने से प्रामाणिक सिद्ध हुए चरित्र को दर्शाता है।
- source_word: γινώσκετε
  choice: तुम ... जानते हो
  rationale: वर्तमान काल फिलिप्पियों को तीमुथियुस के विषय में पहले से विदित बात सीधे व्यक्त करता है।
- source_word: ὅτι
  choice: ':'
  rationale: हिन्दी में विसर्ग आगे आने वाली उस बात को स्वाभाविक ढंग से प्रस्तुत करता है जो बताती है कि वे उसके चरित्र को कैसे जानते हैं।
- source_word: ὡς πατρὶ τέκνον
  choice: जैसे संतान पिता के साथ सेवा करती है
  rationale: पारिवारिक उपमा को सुरक्षित रखता है; τέκνον को लिंग-विशिष्ट ‘पुत्र’ न बनाकर ‘संतान’ कहा गया है। क्रिया की पुनरावृत्ति हिन्दी में उपमा को पूर्ण और स्पष्ट बनाती है।
- source_word: σὺν ἐμοὶ
  choice: मेरे साथ
  rationale: पौलुस के साथ निकट सहभागी सेवा का सीधा अनुवाद है और पौलुस को व्याकरण से परे स्पष्ट रूप से ‘पिता’ घोषित नहीं करता।
- source_word: ἐδούλευσεν
  choice: सेवा की
  rationale: यहाँ सुसमाचार के कार्य के संदर्भ में क्रिया का स्वाभाविक अर्थ देता है; ‘दासता की’ इस प्रसंग में अनावश्यक रूप से कठोर और अस्वाभाविक होता।
- source_word: εἰς τὸ εὐαγγέλιον
  choice: सुसमाचार के लिए
  rationale: सेवा की दिशा और उद्देश्य को संक्षिप्त, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पिता-संतान उपमा में पौलुस की भूमिका
  choice: उपमा को ‘संतान पिता के साथ’ रखा और मुख्य कथन में अलग से ‘मेरे साथ’ कहा
  alternative: ‘उसने पुत्र के समान मेरे, अपने पिता, के साथ सेवा की’
  rationale: मूल पाठ पौलुस और तीमुथियुस के संबंध की ओर संकेत करता है, पर πατρὶ को स्पष्ट रूप से पौलुस का पदनाम नहीं बनाता। चुना हुआ रूप इस संकेत और व्याकरणिक भेद दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘संतान’ मूल के लिंग-निरपेक्ष τέκνον को सुरक्षित रखता है; ‘परखे हुए चरित्र’ परीक्षण द्वारा सिद्ध प्रामाणिकता को स्पष्ट करता है।
