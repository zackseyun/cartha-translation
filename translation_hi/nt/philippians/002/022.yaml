review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the contrast, Timothy's character proved through testing, and his shared service with Paul for the gospel. However, its comparison clause uses a generic present action ('संतान ... सेवा करती है') before the main clause, which makes the analogy less direct and somewhat repetitive. A recast preserves the completed service of ἐδούλευσεν while expressing ὡς πατρὶ τέκνον naturally.
  naturalness: ‘परखे हुए चरित्र’ is understandable but less idiomatic than ‘परखा हुआ चरित्र.’ Recasting the sentence so that Timothy's service is stated once and the father-child wording functions as the comparison is more natural modern Hindi.
  terminology: ‘सुसमाचार’ and ‘सेवा’ are appropriate established terms. ‘संतान’ suitably preserves the non-gender-specific scope of τέκνον. The wording does not overidentify Paul explicitly as the father, while retaining the relational analogy.
  issues:
  - severity: medium
    issue: The simile is expressed as a separate generic present-action clause.
    rationale: The Greek says that Timothy served with Paul ‘as a child with a father’; it does not primarily assert the general proposition that a child serves with a father. The current construction is grammatically possible but less direct and produces an unnecessary repetition of ‘सेवा.’
  - severity: low
    issue: ‘उसके परखे हुए चरित्र’ is slightly awkward Hindi phrasing.
    rationale: ‘उसका परखा हुआ चरित्र’ more idiomatically expresses a character shown genuine through testing without changing the sense.
  revised_text: पर तुम उसका परखा हुआ चरित्र जानते हो[a], कि उसने सुसमाचार के लिए मेरे साथ वैसी ही सेवा की जैसे एक संतान पिता के साथ करती है[b]।
