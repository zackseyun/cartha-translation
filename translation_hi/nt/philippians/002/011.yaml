  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: hi
  text: और हर एक जीभ अंगीकार करे कि यीशु मसीह प्रभु है, पिता परमेश्वर की महिमा के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: हर जीभ
  rationale: यह मूल के शारीरिक रूपक को बनाए रखता है और हिन्दी में सार्वभौमिक अंगीकार का स्वाभाविक, परिचित ढंग है।
- source_word: ἐξομολογήσηται
  choice: अंगीकार करे
  rationale: यह क्रिया के खुले और घोषणात्मक भाव को व्यक्त करता है तथा पिछले पद से जुड़े उद्देश्यवाचक संभावनार्थक रूप के अनुकूल है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का मानक और गरिमापूर्ण हिन्दी रूप है तथा इस मसीही अंगीकार और उसकी शास्त्रीय प्रतिध्वनि को सुरक्षित रखता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम का प्रचलित हिन्दी रूप है और ‘मसीह’ Χριστός के उपाधिगत अर्थ को व्यक्त करता है, केवल ध्वन्यंतरण नहीं करता।
- source_word: εἰς δόξαν
  choice: महिमा के लिए
  rationale: यह εἰς के लक्ष्य अथवा परिणामसूचक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεοῦ πατρός
  choice: परमेश्वर पिता
  rationale: यह यूनानी संबंधवाचक पदबंध का स्पष्ट, स्वाभाविक और धर्मशास्त्रीय रूप से अनावश्यक विस्तार से रहित हिन्दी रूप है।
theological_decisions:
- issue: κύριος Ἰησοῦς Χριστός में विधेय की पहचान
  choice: यीशु मसीह प्रभु है
  alternative: प्रभु यीशु मसीह है
  rationale: 'प्रसंग और प्रचलित अंगीकार-वाक्य κύριος को विधेय के रूप में समझने का समर्थन करते हैं: ‘यीशु मसीह प्रभु है।’ फिर भी लेखरहित यूनानी पदक्रम दूसरी व्याकरणिक समझ की संभावना को पूरी तरह समाप्त नहीं करता, इसलिए उसे पाद-टिप्पणी में रखा गया है।'
- issue: Χριστός का रूप
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός उपाधि के रूप में सक्रिय है; ‘मसीह’ आधुनिक हिन्दी में उस उपाधिगत दावे को स्पष्ट और परिचित ढंग से व्यक्त करता है।
