  rationale: यहाँ क्रिया का अर्थ किसी बात की ओर सजग ध्यान और सरोकार रखना है। हिंदी में “ध्यान देना” इस भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: τὰ ἑαυτῶν
  choice: अपने ही हितों
  rationale: नपुंसकलिंग बहुवचन पदबंध केवल संपत्ति नहीं, बल्कि अपने मामलों, सरोकारों और हितों को व्यापक रूप से दर्शाता है; “हितों” संदर्भ में सहज है, जबकि शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἕκαστοι
  choice: हर एक
  rationale: यह समूह के प्रत्येक व्यक्ति पर अलग-अलग लागू होने वाला वितरणात्मक भाव व्यक्त करता है।
- source_word: ἀλλὰ καὶ
  choice: केवल ... नहीं, बल्कि ... भी
  rationale: यह हिंदी में विरोध और समावेश दोनों को स्वाभाविक रूप से व्यक्त करता है; आशय अपने हितों को पूरी तरह छोड़ना नहीं, बल्कि दूसरों के हितों पर भी ध्यान देना है।
- source_word: τὰ ἑτέρων
  choice: दूसरों के हितों
  rationale: यह पदबंध दूसरों की वस्तुओं तक सीमित नहीं, बल्कि उनके मामलों, सरोकारों और भलाई को व्यापक रूप से समेटता है।
theological_decisions:
