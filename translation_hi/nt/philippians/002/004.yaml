  choice: “केवल ... नहीं, बल्कि ... भी” द्वारा समावेशी विरोध
  alternative: “अपने हितों पर ध्यान न दे, बल्कि दूसरों के हितों पर दे”
  rationale: यूनानी μὴ ... ἀλλὰ καὶ में καὶ दूसरों के मामलों को भी देखने पर बल देता है; इसलिए अनुवाद अपने हितों की पूर्ण मनाही का अनावश्यक निष्कर्ष नहीं निकालता।
