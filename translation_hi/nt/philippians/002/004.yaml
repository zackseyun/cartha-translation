  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामुदायिक उपदेश के अनुरूप। सहभागी रूप σκοποῦντες को पिछले संदर्भ से जुड़े निर्देशात्मक अर्थ में स्वाभाविक हिंदी आज्ञार्थक वाक्य बनाया गया है।
