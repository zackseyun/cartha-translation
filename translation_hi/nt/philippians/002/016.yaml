  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: hi
  text: जीवन के वचन को दृढ़ता से थामे हुए, ताकि मसीह के दिन मेरे लिए यह गर्व का कारण हो कि मैं न व्यर्थ दौड़ा, न व्यर्थ परिश्रम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: जीवन का वचन
  rationale: यह संक्षिप्त यूनानी पदबंध को बनाए रखता है और जीवन देने वाले वचन तथा जीवन के विषय में वचन—दोनों संभावित अर्थों के लिए खुला रहता है।
- source_word: ἐπέχοντες
  choice: दृढ़ता से थामे रहो
  rationale: संदर्भ में स्थिर आज्ञाकारिता और निष्कलंक जीवन का आग्रह है, इसलिए यहाँ थामे रहने का अर्थ उपयुक्त है; प्रस्तुत करने या आगे बढ़ाने का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: καύχημα
  choice: गर्व करने का कारण
  rationale: हिन्दी में यह स्वाभाविक रूप से उस आधार या अवसर को व्यक्त करता है जिस पर पौलुस उचित गर्व कर सकेगा।
- source_word: ἡμέραν Χριστοῦ
  choice: मसीह के दिन
  rationale: Χριστός यहाँ अंतकालीन उपाधि के रूप में सक्रिय है; हिन्दी में ‘मसीह’ उसका स्थापित और स्पष्ट शीर्षकीय रूप है।
- source_word: οὐκ εἰς κενὸν
  choice: व्यर्थ नहीं
  rationale: यह निष्फलता बताने वाले यूनानी मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἔδραμον
  choice: मैं दौड़ा
  rationale: पौलुस की सेवकाई के प्रयत्न को व्यक्त करने वाला दौड़ का रूपक सीधे सुरक्षित रहता है।
- source_word: ἐκοπίασα
  choice: मैंने परिश्रम किया
  rationale: यह कठिन और श्रमसाध्य काम के भाव को स्पष्ट रूप से व्यक्त करता है तथा ‘दौड़ा’ के साथ समानांतरता रखता है।
theological_decisions:
- issue: Χριστοῦ को अंतकालीन शीर्षकीय पदबंध में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: ‘मसीह के दिन’ में शब्द राजकीय और अंतकालीन उपाधि के रूप में प्रयुक्त है, इसलिए हिन्दी का स्थापित शीर्षकीय शब्द ‘मसीह’ चुना गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। यूनानी कृदंत को निकटवर्ती आग्रह के अनुरूप आज्ञार्थक प्रवाह में रखा गया है। ‘गर्व करने का कारण’ शब्दशः ‘गर्व’ की अपेक्षा अधिक स्वाभाविक है, और दौड़ तथा परिश्रम की समानांतर छवियाँ सुरक्षित हैं।
