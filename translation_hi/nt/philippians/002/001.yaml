source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: hi
  text: इसलिए, यदि मसीह में कोई प्रोत्साहन हो, यदि प्रेम से कोई सांत्वना हो, यदि आत्मा की कोई संगति[a] हो, यदि कोई गहरा स्नेह और करुणा हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा में सहभागिता”; कम सम्भावित अर्थ, “आत्मिक संगति।” यूनानी सम्बन्धकारक κοινωνία πνεύματος में यह अस्पष्ट है कि आत्मा संगति का स्रोत है, संगति का क्षेत्र या विषय है, अथवा πνεύματος मानवीय आत्मा/भाव को दर्शाता है।
    reason: यूनानी सम्बन्धकारक κοινωνία πνεύματος के सम्बन्ध की अस्पष्टता और वैकल्पिक अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निकलने वाले निष्कर्ष या आग्रह का संबंध स्पष्ट करता है और आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: παράκλησις
  choice: प्रोत्साहन
  rationale: यहाँ सांत्वना देकर दृढ़ करने और उत्साहित करने का भाव उपयुक्त है; ‘उपदेश’ अर्थ को अनावश्यक रूप से आदेशात्मक बना देता।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ἐν का मूल संबंध ‘में’ से बना रहता है और Χριστός को उसकी उपाधिगत अर्थवत्ता के साथ ‘मसीह’ कहा गया है।
- source_word: παραμύθιον
  choice: सांत्वना
  rationale: यह प्रेम से मिलने वाली दिलासा का भाव व्यक्त करता है और पहले प्रयुक्त ‘प्रोत्साहन’ से अर्थगत भेद बनाए रखता है।
- source_word: ἀγάπης
  choice: प्रेम से
  rationale: सम्बन्धकारक को यहाँ स्रोत के रूप में समझना प्रसंगानुकूल और हिन्दी में स्वाभाविक है—अर्थात प्रेम से मिलने वाली सांत्वना।
- source_word: κοινωνία
  choice: सहभागिता
  rationale: यह साझा भागीदारी और संगति दोनों का भाव दे सकती है; πνεύματος के साथ इसके सटीक संबंध की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: πνεύματος
  choice: आत्मा की
  rationale: प्रसंग में पवित्र आत्मा का संकेत सर्वाधिक संभावित है, पर यूनानी सम्बन्धकारक यह पूरी तरह निर्धारित नहीं करता कि अर्थ आत्मा से प्राप्त सहभागिता है या आत्मा में भागीदारी।
- source_word: σπλάγχνα
  choice: गहरा स्नेह
  rationale: शाब्दिक रूप से ‘अंतरंग अंग’ कहने वाला यह मुहावरा गहरी, कोमल आत्मीयता दर्शाता है; ‘गहरा स्नेह’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: οἰκτιρμοί
  choice: करुणा
  rationale: यह दयापूर्ण संवेदना का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप है तथा ‘गहरा स्नेह’ के साथ अर्थगत युग्म बनाता है।
theological_decisions:
- issue: क्या πνεύματος विशेष रूप से पवित्र आत्मा को दर्शाता है, और κοινωνία के साथ सम्बन्धकारक संबंध कैसे व्यक्त हो
  choice: आत्मा की सहभागिता
  alternative: 'आत्मा में सहभागिता; कम सम्भावित: आत्मिक संगति'
  rationale: पौलुस के प्रयोग और मसीही वरदानों की इस श्रृंखला में पवित्र आत्मा का संदर्भ सबसे सम्भावित है। फिर भी यूनानी वाक्यांश संबंध की दिशा को पूरी तरह स्पष्ट नहीं करता, इसलिए मुख्य पाठ में संक्षिप्त सम्भावित अर्थ रखा गया और विकल्प पादटिप्पणी में सुरक्षित किए गए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। चारों शर्तीय वाक्यांशों की समानांतर संरचना बनाए रखने के लिए ‘यदि’ दोहराया गया है। पद अगले पद में पूरा होने वाले वाक्य का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है।
