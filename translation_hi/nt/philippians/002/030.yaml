  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: hi
  text: क्योंकि मसीह[a] के काम के कारण[c] वह मृत्यु के निकट पहुँच गया था; उसने अपनी जान जोखिम में डाल दी, ताकि मेरी सेवा में आपकी ओर से जो कमी रह गई थी[b], उसे वह पूरा कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “ख्रीस्त।” यूनानी में: “मसीह/ख्रीस्त का काम।”'
    reason: alternative_reading
  - marker: b
    text: “जो कमी ... रह गई थी” से आशय उस सेवा से है जो फिलिप्पी के विश्वासी दूर होने के कारण स्वयं उपस्थित होकर नहीं कर सकते थे; इसका अर्थ यह नहीं कि वे सेवा करना नहीं चाहते थे।
    reason: cultural_note
  - marker: c
    text: या, “मसीह के काम के लिए।”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: मसीह के काम के लिए
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा उद्देश्य-सदृश आधार व्यक्त करता है। ‘के लिए’ इपफ्रुदीतुस द्वारा मसीह के काम के निमित्त उठाए गए जोखिम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के कारण’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन के अर्थ और हिन्दी बाइबलीय प्रयोग दोनों को बनाए रखता है।
- source_word: μέχρι θανάτου ἤγγισεν
  choice: वह मृत्यु के निकट पहुँच गया था
  rationale: यह यूनानी अभिव्यक्ति उसके लगभग मर जाने की स्थिति बताती है। चुना हुआ अनुवाद मूल रूपक को बनाए रखते हुए स्पष्ट और गरिमापूर्ण है।
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: उसने अपनी जान जोखिम में डाल दी
  rationale: कृदन्त जानबूझकर प्राण को संकट में डालने का भाव देता है। यहाँ ψυχή का आशय सांसारिक जीवन है, अमूर्त आत्मा नहीं।
- source_word: ἵνα ἀναπληρώσῃ
  choice: ताकि ... उसे वह पूरा कर सके
  rationale: ἵνα उद्देश्य व्यक्त करता है और ἀναπληρόω किसी रह गई कमी को भरने या पूरा करने को सूचित करता है।
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: जो कमी आपकी ओर से रह गई थी
  rationale: यह व्यावहारिक अनुपस्थिति को दर्शाता है, नैतिक दोष या अनिच्छा को नहीं। ‘रह गई थी’ अनावश्यक आरोप से बचाता है।
- source_word: τῆς πρός με λειτουργίας
  choice: मेरी सेवा में
  rationale: λειτουργία यहाँ पौलुस के लिए की गई व्यावहारिक सेवा को बताता है। ‘सेवा’ अर्थ की व्यापकता बनाए रखती है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: पौलुस के वाक्यांश में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस प्रसंग में Χριστός की उपाधिगत शक्ति सुनाई देती है; इसलिए अर्थानुवाद ‘मसीह’ को मुख्य पाठ में रखा गया है, जबकि प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: फिलिप्पियों की सेवा में ‘कमी’ का आशय
  choice: दूरी के कारण व्यक्तिगत रूप से न कर सकी सेवा
  alternative: उनकी सेवा में दोष या अनिच्छा
  rationale: संदर्भ इपफ्रुदीतुस को मंडली के प्रतिनिधि और पौलुस की आवश्यकता पूरी करने वाले के रूप में प्रस्तुत करता है; अतः वाक्य को उनकी निष्ठा पर दोषारोपण की तरह नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘मृत्यु के निकट पहुँच गया’ मूल यूनानी की छवि बनाए रखता है, जबकि ‘अपनी जान जोखिम में डाल दी’ उसी भाव को सहज बोलचाल की गरिमा के साथ व्यक्त करता है। वाक्य को दो भागों में बाँटा गया है ताकि लम्बी यूनानी संरचना सामान्य पाठक के लिए स्पष्ट रहे।
