  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: hi
  text: क्योंकि परमेश्वर ही है जो अपनी प्रसन्नता के लिए तुममें इच्छा करने और कार्य करने, दोनों में कार्यरत है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इच्छा और कार्य, दोनों में।”
    reason: क्रियार्थक संज्ञाओं τὸ θέλειν और τὸ ἐνεργεῖν को प्रक्रिया (“इच्छा करने और कार्य करने”) या संज्ञात्मक रूप (“इच्छा और कार्य”) में व्यक्त किया जा सकता है।
  - marker: b
    text: या, “अपनी प्रसन्नता के अनुसार।”
    reason: ὑπὲρ τῆς εὐδοκίας का अर्थ उद्देश्य/हित (“के लिए”) या प्रसंगानुसार अनुरूपता (“के अनुसार”) के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का आधार बताता है और हिन्दी में उसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἐνεργῶν
  choice: जो ... प्रभावी करता है
  rationale: संज्ञात्मक वर्तमान कृदन्त परमेश्वर की निरंतर सक्रियता दिखाता है। ‘प्रभावी करता है’ इसी पद और आगे आए ἐνεργεῖν के बीच का शब्द-संबंध बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह यूनानी पदबंध के निकट है तथा व्यक्तिगत ‘तुममें’ और सामूहिक ‘तुम लोगों के बीच’ की संभावित व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τὸ θέλειν
  choice: इच्छा करने
  rationale: यह संकल्प अथवा चाहने की क्रिया को व्यक्त करता है और अगले क्रियार्थक पद के साथ समानांतर संरचना बनाए रखता है।
- source_word: τὸ ἐνεργεῖν
  choice: काम करने
  rationale: यह वास्तविक क्रिया या कार्य को सरल आधुनिक हिन्दी में व्यक्त करता है; मुख्य क्रिया ‘प्रभावी करता है’ के साथ मूल की शब्दगत पुनरावृत्ति का कुछ संकेत भी बना रहता है।
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: अपनी प्रसन्नता के लिए
  rationale: ὑπέρ के उद्देश्य/हित के भाव को ‘के लिए’ और εὐδοκία को ‘प्रसन्नता’ से व्यक्त किया गया है। ‘अपनी’ का संबंध वाक्य के कर्ता परमेश्वर से है।
theological_decisions:
- issue: ईश्वरीय सक्रियता तथा मनुष्य की इच्छा और कार्य
  choice: परमेश्वर को इच्छा करने और काम करने—दोनों को मनुष्यों में प्रभावी करने वाला कहा गया है।
  alternative: परमेश्वर केवल इच्छा या केवल कार्य करने की सामर्थ्य देता है।
  rationale: मूल पाठ इच्छा और कार्य दोनों के स्तर पर परमेश्वर की सक्रियता रखता है। अनुवाद इस तनाव को बनाए रखता है और यह निर्धारित नहीं करता कि मानवीय उत्तरदायित्व तथा ईश्वरीय सक्रियता का दार्शनिक संबंध कैसे समझा जाए।
- issue: ὑπὲρ का अर्थ-संबंध
  choice: अपनी प्रसन्नता के लिए
  alternative: अपनी प्रसन्नता के अनुसार
  rationale: संबंधबोधक पद उद्देश्य/हित का भाव दे सकता है, जबकि प्रसंग में अनुरूपता का अर्थ भी संभव है; मुख्य पाठ में उद्देश्यगत अर्थ रखा गया और विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘परमेश्वर ही है’ यूनानी की बलाघाती संरचना θεὸς ... ὁ ἐνεργῶν को सामने लाता है। ‘प्रभावी करता है’ थोड़ा औपचारिक है, पर ἐνεργέω की सक्रिय और फलदायी क्रिया तथा पद की पुनरावृत्ति को केवल ‘देता है’ की अपेक्षा बेहतर सुरक्षित रखता है।
