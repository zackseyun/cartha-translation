translation:
  language: hi
  text: उसने अपने आप को नम्र किया और मृत्यु तक आज्ञाकारी बन गया—यहाँ तक कि क्रूस पर मृत्यु तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: दीन किया
  rationale: यह क्रिया स्वेच्छा से अपने को नीचा करने या नम्र बनाने का भाव रखती है; ‘दीन किया’ आधुनिक, गरिमापूर्ण हिंदी में इस सक्रिय अर्थ को व्यक्त करता है।
- source_word: ἑαυτὸν
  choice: अपने आप को
  rationale: मूल पाठ का स्पष्ट आत्मवाचक सर्वनाम बनाए रखा गया है, जिससे मसीह के स्वेच्छापूर्ण आत्म-दीनकरण पर बल बना रहता है।
- source_word: γενόμενος
  choice: बना रहा
  rationale: संदर्भ में यह कृदंत उसके अपने को दीन करने के ढंग को बताता है। ‘आज्ञाकारी बना रहा’ मृत्यु तक जारी आज्ञाकारिता को स्वाभाविक हिंदी में व्यक्त करता है, यद्यपि अधिक शाब्दिक विकल्प ‘आज्ञाकारी होकर’ है।
- source_word: ὑπήκοος
  choice: आज्ञाकारी
  rationale: यह विशेषण का सीधा और प्रचलित हिंदी समतुल्य है तथा अधीनता के भाव को अनावश्यक रूप से कमजोर नहीं करता।
- source_word: μέχρι θανάτου
  choice: मृत्यु तक
  rationale: 'यह मूल की सीमा या चरम बिंदु को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है: उसकी आज्ञाकारिता मृत्यु तक पहुँची।'
- source_word: δὲ
  choice: हाँ
  rationale: यहाँ δέ अंतिम पदबंध को चरमोत्कर्ष की ओर बढ़ाता है। ‘हाँ’ मृत्यु के विशेषतः लज्जाजनक प्रकार पर स्वाभाविक हिंदी में जोर देता है।
- source_word: σταυροῦ
  choice: क्रूस की मृत्यु
  rationale: संक्षिप्त संबंधकारक पदबंध का यह निकट और स्पष्ट रूप है; इसका अर्थ क्रूस पर होने वाली मृत्यु है।
theological_decisions:
- issue: θανάτου δὲ σταυροῦ का बल
  choice: 'इसे बढ़ते हुए जोर के रूप में प्रस्तुत किया गया है: ‘हाँ, क्रूस की मृत्यु तक।’'
  alternative: ‘बल्कि क्रूस पर मृत्यु तक’ अथवा अधिक शाब्दिक ‘और वह भी क्रूस की मृत्यु’
  rationale: मूल वाक्य केवल मृत्यु को दोहराता नहीं, बल्कि क्रूस की मृत्यु को चरम बिंदु बनाता है। अनुवाद इस अलंकारिक तीव्रता को रखता है, पर क्रूस के धर्मवैज्ञानिक अर्थ की अतिरिक्त व्याख्या मुख्य पाठ में नहीं जोड़ता।
- issue: γενόμενος का संबंध
  choice: इसे आत्म-दीनकरण के ढंग और जारी आज्ञाकारिता के रूप में व्यक्त किया गया है।
  alternative: इसे क्रमसूचक रूप में ‘आज्ञाकारी होकर’ या ‘आज्ञाकारी बनकर’ कहना
  rationale: कृदंत का संबंध समय, ढंग या साधन के सूक्ष्म भेद के लिए खुला है। हिंदी वाक्य ढंग और निरंतरता को सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘क्रूस’ भारतीय हिंदी बाइबल परंपरा में परिचित शब्द है। वाक्य में डैश मूल के चरमोत्कर्ष और ‘क्रूस की मृत्यु’ पर जोर को स्पष्ट करते हैं।
