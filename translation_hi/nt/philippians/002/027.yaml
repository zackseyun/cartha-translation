source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: hi
  text: क्योंकि वह सचमुच बीमार था, यहाँ तक कि मृत्यु के निकट था[a]। परन्तु परमेश्वर ने उस पर दया की—और केवल उस पर ही नहीं, बल्कि मुझ पर भी—ताकि मुझे शोक पर शोक न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु के बहुत निकट था” अथवा “मरने की हद तक बीमार था।”
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में “शोक पर शोक” है; इसका अर्थ है पहले से मौजूद शोक के ऊपर एक और शोक जुड़ जाना।
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: बीमार होकर
  rationale: संदर्भ में ἀσθενέω शारीरिक बीमारी को सूचित करता है। इस कृदन्तीय प्रयोग से बीमारी और मृत्यु के निकट पहुँचने के बीच स्वाभाविक हिन्दी संबंध बनता है, बिना इसे सामान्य दुर्बलता मानने के।
- source_word: παραπλήσιον θανάτῳ
  choice: मृत्यु के निकट पहुँच गया था
  rationale: παραπλήσιον के साथ सम्प्रदान कारक θανάτῳ मृत्यु से अत्यधिक निकटता व्यक्त करता है। यह अनुवाद वास्तविक मृत्यु का दावा किए बिना गंभीर दशा को स्पष्ट करता है।
- source_word: ἠλέησεν
  choice: दया की
  rationale: यह चुनाव परमेश्वर की करुणामय दया का धार्मिक और संबंधपरक भार बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: और केवल उस पर ही नहीं, बल्कि मुझ पर भी
  rationale: विरोधी संरचना और पौलुस पर भी हुई दया, दोनों को स्पष्ट रखते हुए यूनानी वाक्य का बल सुरक्षित रखा गया है।
- source_word: ἵνα μὴ
  choice: ताकि ... न हो
  rationale: यह नकारात्मक उद्देश्य अथवा टाले गए परिणाम की ध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λύπην ἐπὶ λύπην
  choice: शोक पर शोक
  rationale: मूल की पुनरुक्ति और संचयी दुःख की छवि को बनाए रखा गया है; इसे केवल सामान्यीकृत 'और अधिक दुःख' नहीं किया गया।
- source_word: σχῶ
  choice: मुझे ... न हो
  rationale: ἔχω के व्यापक अर्थ को हिन्दी के स्वाभाविक अनुभूति-सूचक निर्माण में व्यक्त किया गया है, बिना 'सहना' जैसे अतिरिक्त भाव को अनिवार्य बनाने के।
theological_decisions:
- issue: परमेश्वर की दया का आशय
  choice: रोगी के स्वस्थ होने और पौलुस को अतिरिक्त शोक से बचाए जाने—दोनों को परमेश्वर की दया के रूप में रहने दिया गया है।
  alternative: दया को किसी विशेष चमत्कारी उपचार-विधि या अंतिम उद्धार तक सीमित करना।
  rationale: पद परमेश्वर की दया का परिणाम बताता है, पर उपचार की विधि या कोई संप्रदायगत सिद्धान्त निर्दिष्ट नहीं करता।
- issue: ἵνα μὴ में उद्देश्य और परिणाम का संबंध
  choice: ‘ताकि’ द्वारा उद्देश्य की ध्वनि रखी गई है।
  alternative: ‘जिसके परिणामस्वरूप’ कहकर केवल परिणाम बताना।
  rationale: ἵνα सामान्यतः उद्देश्य व्यक्त करता है, यद्यपि यहाँ परिणाम की निकट छाया भी संभव है; हिन्दी ‘ताकि’ मूल बल को सबसे सीधे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘परन्तु’, ‘दया’ और ‘शोक’ बाइबलीय गंभीरता रखते हैं, फिर भी सामान्य पाठक के लिए स्पष्ट हैं। विराम-चिह्नों से मध्यवर्ती विरोधी वाक्यांश का बल दिखाया गया है।
