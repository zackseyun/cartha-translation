- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को उसके उपाधि-संबंधी अर्थ में ‘मसीह’ किया गया है और ἐν को ‘में’ रखकर सम्बन्ध की सटीक छाया को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: क्या उपवाक्य यीशु में विद्यमान आदर्श मनोभाव बताता है, या वह मनोभाव जो विश्वासियों को मसीह में सहभागिता के द्वारा प्राप्त है?
  choice: जो मसीह यीशु में भी था
  alternative: जो मसीह यीशु में तुम्हारा भी है
  rationale: तत्काल संदर्भ मसीह के आत्म-दीनकरण को विश्वासियों के आदर्श के रूप में प्रस्तुत करता है, इसलिए उदाहरणात्मक अर्थ मुख्य पाठ में है। फिर भी यूनानी वाक्य संक्षिप्त और क्रियारहित है तथा सहभागिता वाला अर्थ भी सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, सामुदायिक और गरिमापूर्ण आज्ञार्थक शैली। ‘मनोभाव’ φρονέω की विचार-दृष्टि और प्रवृत्ति दोनों को समेटता है। मुख्य पाठ यूनानी की संक्षिप्तता बनाए रखता है और वैकल्पिक व्याकरणिक-पारलौकिक अर्थ पादटिप्पणी में सुरक्षित है।
