id: PHP.2.17
reference: Philippians 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: hi
  text: परन्तु यदि मैं तुम्हारे विश्वास[c] के बलिदान और उपासना-सेवा[b] पर पेय-बलि के रूप में उंडेला भी जा रहा हूँ[a], तो मैं आनन्दित हूँ और तुम सबके साथ आनन्द करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पेय-भेंट के रूप में उंडेला जा रहा हूँ।”
    reason: lexical_alternative
  - marker: b
    text: “उपासना-सेवा” का अनुवाद “सेवा” या “धार्मिक सेवा” भी किया जा सकता है; यहाँ यूनानी शब्द बलिदानी उपासना का रंग बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “विश्वासयोग्यता।”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: अर्घ के समान उंडेला जा रहा हूँ
  rationale: यह कर्मवाच्य क्रिया बलिदानी उपासना में द्रव-भेंट उंडेलने का चित्र प्रस्तुत करती है। ‘अर्घ के समान’ रूपक को स्पष्ट रखता है और ‘उंडेला जा रहा हूँ’ वर्तमान कर्मवाच्य भाव को बचाता है।
- source_word: ἐπὶ
  choice: पर
  rationale: यहाँ चतुर्थी के साथ ἐπί पौलुस के उंडेले जाने को फिलिप्पियों के बलिदान और सेवा के ऊपर अथवा उसमें जोड़ी गई भेंट के रूप में दिखाता है; ‘पर’ इस संबंध को संक्षेप में बनाए रखता है।
- source_word: θυσίᾳ
  choice: बलिदान
  rationale: यह सामान्य बलिदानी शब्द है और पद की उपासना-संबंधी चित्रावली को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: λειτουργίᾳ
  choice: उपासना-सेवा
  rationale: इस बलिदानी संदर्भ में शब्द केवल सामान्य सेवा से अधिक पवित्र उपासना में की गई सेवा का संकेत दे सकता है। ‘उपासना-सेवा’ उस रंग को बचाता है, पर फिलिप्पियों को शब्दशः नियुक्त याजक घोषित नहीं करता।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस संदर्भ में πίστις का प्राथमिक अर्थ परमेश्वर पर विश्वास है, जिसे बलिदान और सेवा के रूप में प्रस्तुत किया गया है। ‘विश्वासयोग्यता’ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: χαίρω
  choice: मैं आनन्दित हूँ
  rationale: यह वर्तमान काल की घोषणा और फिलिप्पियों में बार-बार आने वाले आनन्द के विषय को स्वाभाविक हिन्दी में रखता है।
- source_word: συγχαίρω
  choice: तुम सबके साथ आनन्द मनाता हूँ
  rationale: σύν- का सामूहिक भाव स्पष्ट करता है और ‘बधाई देता हूँ’ जैसे कम उपयुक्त अर्थ से बचता है।
- source_word: πᾶσιν ὑμῖν
  choice: तुम सबके साथ
  rationale: पूरे समुदाय पर पौलुस के स्पष्ट समावेशी बल को बनाए रखता है।
theological_decisions:
- issue: पौलुस की सम्भावित मृत्यु के लिए बलिदानी चित्रावली
  choice: पौलुस स्वयं को फिलिप्पियों के विश्वास के बलिदान और उपासना-सेवा पर उंडेले जाते अर्घ के रूप में चित्रित करता है।
  alternative: पौलुस का जीवन उनकी सेवा के साथ केवल सामान्य रूप से अर्पित हो रहा है, बिना बलिदानी अर्थ को प्रमुख बनाए।
  rationale: σπένδομαι, θυσία और λειτουργία का समूह स्पष्ट रूप से बलिदान और उपासना की चित्रावली रचता है; इसलिए इसे सामान्य ‘समर्पित सेवा’ बनाकर सपाट नहीं किया गया।
- issue: τῆς πίστεως का अर्थ और संबंध
  choice: ‘विश्वास’ को मुख्य पाठ में रखा गया है और उसे ‘बलिदान’ तथा ‘उपासना-सेवा’ से संबंधित रहने दिया गया है।
  alternative: πίστις को ‘विश्वासयोग्यता’ समझा जा सकता है।
  rationale: संबंधकारक वाक्यांश दोनों संयुक्त संज्ञाओं से जुड़ सकता है, और ‘विश्वास’ यहाँ सबसे स्वाभाविक प्राथमिक अर्थ है; फिर भी नैतिक विश्वासयोग्यता की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक पाठ के योग्य रखी गई है। ‘अर्घ’ अपेक्षाकृत विशिष्ट शब्द है, इसलिए मुख्य पाठ में ‘के समान उंडेला’ और पादटिप्पणी में ‘पेय-बलि’ देकर अर्थ स्पष्ट किया गया है। ‘उपासना-सेवा’ λειτουργία के धार्मिक रंग को बचाती है, जबकि ‘याजकीय’ से उत्पन्न हो सकने वाले अनावश्यक पदगत निष्कर्ष से बचती है।
