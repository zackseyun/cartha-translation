  to: परन्तु यदि मैं तुम्हारे विश्वास[c] के बलिदान और उपासना-सेवा[b] पर पेय-बलि के रूप में उंडेला भी जा रहा हूँ[a], तो मैं आनन्दित हूँ और तुम सबके साथ आनन्द करता हूँ।
