  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि वे सब अपने ही हितों की तलाश करते हैं, यीशु मसीह के हितों की नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πάντες
  choice: वे सब
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन पद संदर्भ में आए सभी लोगों की ओर संकेत करता है; ‘वे सब’ सामूहिक बल बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और वाक्य के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἑαυτῶν
  choice: अपने ही हितों
  rationale: नपुंसकलिंग बहुवचन मुहावरा उन बातों को दर्शाता है जो स्वयं से संबंधित हैं; ‘अपने ही हितों’ से विरोध में निहित स्वार्थपरता स्पष्ट होती है।
- source_word: ζητοῦσιν
  choice: खोज में रहते हैं
  rationale: वर्तमान काल की निरंतर या सामान्य प्रवृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘ढूँढ़ते हैं’ की संभावित भौतिक वस्तु वाली छाया से बचता है।
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के हितों
  rationale: यूनानी में निहित ‘बातों/हितों’ को हिन्दी में दोहराना स्पष्ट और स्वाभाविक है। ‘मसीह’ Χριστός के पदवीगत अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: ‘मसीह’ आधुनिक हिन्दी में Χριστός की पदवी और उसके अभिषिक्त जन वाले अर्थ को स्पष्ट तथा व्यापक रूप से बोधगम्य रखता है; ‘ख्रीस्त’ अधिक नाम-सदृश और कुछ परंपराओं में प्रचलित रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के ‘अपने’ बनाम ‘यीशु मसीह के’ विरोध को स्पष्ट करने के लिए ‘हितों’ को दोनों खंडों में व्यक्त किया गया है।
