- from: क्योंकि वे सब अपने ही हितों की खोज में रहते हैं, न कि यीशु मसीह के हितों की।
  to: क्योंकि वे सब अपने ही हितों की तलाश करते हैं, यीशु मसीह के हितों की नहीं।
  rationale: Replaced only the non-idiomatic verbal phrase “खोज में रहते हैं” with the natural and semantically equivalent “तलाश करते हैं.” The contrast, explanatory connection, plural scope, and christological title are retained.
  reviewer_model: gpt-5.6-terra
