review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the explanatory γάρ (“क्योंकि”), the collective emphasis of οἱ πάντες (“वे सब”), and the contrasted plural expressions τὰ ἑαυτῶν / τὰ Ἰησοῦ Χριστοῦ. “यीशु मसीह” appropriately retains Χριστός as a title. The explicit repetition of “हितों” is a legitimate clarification of the Greek ellipsis.
  naturalness: “खोज में रहते हैं” is not idiomatic in this context and awkwardly suggests merely being engaged in a search. “हितों की तलाश करते हैं” is natural modern Hindi and conveys the habitual present ζητοῦσιν without changing the sense.
  terminology: '“हितों” suitably conveys the broad, elliptical τὰ (“things/interests/concerns”) in this contrast. “यीशु मसीह” is standard, comprehensible Hindi and preserves the titular force of Χριστοῦ. No footnote is needed: the English alternative “Jesus Christ” does not represent a textual variant requiring a Hindi anchor.'
  issues:
  - severity: medium
    issue: The phrase “अपने ही हितों की खोज में रहते हैं” is unnatural Hindi.
    rationale: In modern Hindi, “खोज में रहना” normally describes being in a state of searching rather than actively or habitually seeking one's own concerns. It is less direct than the Greek present verb and impairs readability.
  revised_text: क्योंकि वे सब अपने ही हितों की तलाश करते हैं, यीशु मसीह के हितों की नहीं।
