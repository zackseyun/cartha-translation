  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: hi
  text: ताकि तुम इस टेढ़ी और विकृत पीढ़ी के बीच निर्दोष और निष्कपट, परमेश्वर की निष्कलंक संतान बनो।[a] उन्हीं लोगों के बीच तुम संसार में ज्योतियों[b] के समान चमकते हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘टेढ़ी और विकृत पीढ़ी’ संभवतः व्यवस्थाविवरण 32:5 की प्रतिध्वनि है, जहाँ भ्रष्ट पीढ़ी का परमेश्वर की संतान से विरोध दिखाया गया है।
    reason: cross_reference
  - marker: b
    text: 'या: ‘प्रकाशमान पिंडों।’'
    reason: lexical_alternative
  - marker: c
    text: 'या: ‘तुम संसार में ज्योतियों के समान दिखाई देते हो।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: ताकि तुम … बनो
  rationale: ἵνα उद्देश्य अथवा अपेक्षित परिणाम बताता है और γένησθε में बनने का भाव है; यह हिंदी प्रयोग दोनों को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: ἄμεμπτοι
  choice: निर्दोष
  rationale: नैतिक रूप से दोषरहित होने का अर्थ सरल और प्रतिष्ठित आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἀκέραιοι
  choice: निष्कपट
  rationale: शब्द का मूल भाव अमिश्रित, खरा और बुराई से रहित होना है; ‘निष्कपट’ इस संदर्भ में नैतिक अखंडता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τέκνα θεοῦ
  choice: परमेश्वर की … संतान
  rationale: τέκνα सभी लिंगों को समेटने वाला बहुवचन है; हिंदी में सामूहिक ‘संतान’ स्वाभाविक और लिंग-समावेशी है।
- source_word: ἄμωμα
  choice: निष्कलंक
  rationale: यह ἄμεμπτοι से अलग कलंक या दोष न होने की छवि को बनाए रखता है और संभावित बलिदानी तथा वाचा-संबंधी प्रतिध्वनि को दबाता नहीं।
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: इस टेढ़ी और विकृत पीढ़ी के बीच
  rationale: स्थानगत अर्थ और प्रबल नैतिक वर्णन दोनों सुरक्षित रहते हैं; ‘टेढ़ी और विकृत’ व्यवस्थाविवरण 32:5 की संभावित प्रतिध्वनि के अनुकूल भी है।
- source_word: ἐν οἷς
  choice: उसके लोगों के बीच
  rationale: यूनानी संबंधवाचक सर्वनाम का आशय उस पीढ़ी के लोगों से है; शाब्दिक ‘जिसमें’ की अपेक्षा यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: φαίνεσθε
  choice: तुम … चमकते हो
  rationale: φωστῆρες के साथ प्रकाश देने वाला अर्थ संदर्भ में सर्वाधिक स्वाभाविक है; ‘दिखाई देते हो’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: φωστῆρες
  choice: ज्योतियों
  rationale: यह प्रकाशमान पिंडों अथवा प्रकाश-स्रोतों का व्यापक अर्थ रखता है और केवल ‘तारों’ तक सीमित नहीं करता।
- source_word: ἐν κόσμῳ
  choice: संसार में
  rationale: यहाँ κόσμος के मानव-संसार संबंधी अर्थ को सामान्य और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘निष्कलंक’ का ‘परमेश्वर की संतान’ से संबंध और व्यवस्थाविवरण 32:5 की संभावित प्रतिध्वनि
  choice: ‘परमेश्वर की निष्कलंक संतान’ के रूप में निकट संबंध बनाए रखा गया है और प्रतिध्वनि को पादटिप्पणी में बताया गया है।
  alternative: ‘निष्कलंक’ को पूरे उपदेश का सामान्य विशेषण मानना, अथवा व्यवस्थाविवरण की ओर संकेत को मुख्य पाठ में अधिक स्पष्ट करना।
  rationale: यूनानी पदक्रम ἄμωμα को τέκνα θεοῦ के साथ स्वाभाविक रूप से जोड़ता है, जबकि ‘टेढ़ी और विकृत पीढ़ी’ व्यवस्थाविवरण 32:5 के साथ अंतरपाठीय संबंध सुझाती है। मुख्य पाठ को इस संबंध की व्याख्या थोपे बिना तनाव सुरक्षित रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘संतान’ लिंग-समावेशी है; ‘निष्कपट’ नैतिक अखंडता और ‘निष्कलंक’ कलंकहीनता की अलग-अलग छवियों को बनाए रखते हैं।
