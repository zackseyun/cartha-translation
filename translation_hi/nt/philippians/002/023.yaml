  text: τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: hi
  text: इसलिए मुझे आशा है कि जैसे ही मुझे अपनी परिस्थिति का पता चलेगा, मैं उसे भेज दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: उसे
  rationale: यह कर्मकारक संकेतवाचक सर्वनाम निकट संदर्भ में तीमुथियुस की ओर संकेत करता है; आधुनिक हिन्दी में ‘उसे’ स्वाभाविक है।
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह पदसमूह पिछले कथन से निष्कर्षात्मक संक्रमण दिखाता है; ‘इसलिए’ उस संबंध को सहज रूप में व्यक्त करता है।
- source_word: ἐλπίζω πέμψαι
  choice: मुझे आशा है कि ... मैं उसे भेज दूँगा
  rationale: ἐλπίζω आशा अथवा अपेक्षा व्यक्त करता है और πέμψαι भेजने की क्रिया को; हिन्दी की यह रचना दोनों भावों को स्वाभाविक रूप से रखती है।
- source_word: ὡς ἂν ἀφίδω
  choice: जैसे ही मुझे ... पता चलेगा
  rationale: यह अनिश्चित भविष्य की उस घड़ी को बताता है जो पौलुस द्वारा अपनी स्थिति को जान लेने पर निर्भर है; ‘जैसे ही’ कालगत और प्रत्याशित भाव को व्यक्त करता है।
- source_word: τὰ περὶ ἐμέ
  choice: अपनी परिस्थिति
  rationale: यह वाक्यांश पौलुस से संबंधित मामलों, अर्थात उसकी वर्तमान दशा और आगे क्या होगा, को सूचित करता है; एकवचन सामूहिक ‘परिस्थिति’ हिन्दी में स्पष्ट और सहज है।
- source_word: ἐξαυτῆς
  choice: जैसे ही
  rationale: यह तत्कालता पर बल देता है; हिन्दी में इसे अलग ‘तुरंत’ कहने के बजाय कालगत पद ‘जैसे ही’ में समाहित करना अधिक स्वाभाविक है।
theological_decisions: []
