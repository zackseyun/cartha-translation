  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की भविष्य-सापेक्षता और तीमुथियुस को शीघ्र भेजने की आशा सुरक्षित है।
