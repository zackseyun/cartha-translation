- source_word: μετὰ πάσης χαρᾶς
  choice: पूरे आनंद के साथ
  rationale: यह πᾶς से व्यक्त आनंद की पूर्णता को बनाए रखते हुए स्वाभाविक हिंदी देता है।
- source_word: τοὺς τοιούτους
  choice: उसके जैसे लोगों
  rationale: यह इपफ्रुदीतुस को उदाहरण मानकर उसी प्रकार के अन्य व्यक्तियों की ओर संकेत करने वाली अभिव्यक्ति को सहज हिंदी में व्यक्त करता है; यूनानी के पुल्लिंग बहुवचन रूप की सूचना पाद-टिप्पणी में दी गई है।
- source_word: ἐντίμους ἔχετε
  choice: आदर करो
  rationale: यह ऐसे व्यक्तियों को आदरणीय मानने और उनके साथ सम्मानपूर्वक व्यवहार करने का आशय संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
