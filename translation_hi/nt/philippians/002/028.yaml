  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: hi
  text: इसलिए मैंने उसे और भी अधिक उत्सुकता से भेजा, ताकि उसे फिर देखकर तुम आनन्दित हो जाओ और मेरा दुःख कुछ कम हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: और भी अधिक उत्सुकता से
  rationale: तुलनात्मक क्रियाविशेषण की बढ़ी हुई तत्परता और उत्सुकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछली बात से निकलने वाले निष्कर्ष और तार्किक संबंध को स्पष्ट रखता है।
- source_word: ἔπεμψα
  choice: मैंने ... भेजा
  rationale: अओरिस्ट कथन को प्रसंगानुसार सामान्य भूतकाल में व्यक्त किया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἰδόντες ... πάλιν
  choice: उसे फिर देखकर
  rationale: अओरिस्ट कृदन्त की परिस्थितिजन्य/कालिक भूमिका और πάλιν के पुनः देखने के अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χαρῆτε
  choice: तुम आनन्दित हो जाओ
  rationale: उद्देश्य-वाक्य के अधीन सम्भावित परिणाम को रखते हुए χαίρω के आनन्द संबंधी अर्थ और पौलुस की शब्दावली की अनुगूँज बचाता है।
- source_word: κἀγὼ
  choice: और मेरा
  rationale: καὶ ἐγώ के समन्वय को हिन्दी की स्वाभाविक वाक्य-रचना में ‘और मेरा दुःख...’ द्वारा व्यक्त किया गया है।
- source_word: ἀλυπότερος ὦ
  choice: मेरा दुःख कुछ कम हो जाए
  rationale: शाब्दिक ‘मैं कम दुःखी हो जाऊँ’ की अपेक्षा स्वाभाविक हिन्दी है, पर तुलनात्मक अर्थ—दुःख का घट जाना, पूरी तरह मिटना नहीं—सुरक्षित रखता है।
