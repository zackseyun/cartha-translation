  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘आनन्दित’ पौलुस की आनन्द-विषयक भाषा को बनाए रखता है, जबकि ‘दुःख कुछ कम’ ἀλυπότερος की तुलनात्मक बारीकी को स्पष्ट करता है।
