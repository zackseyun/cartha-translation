  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: hi
  text: इसलिए, मेरे प्रिय लोगो, जिस प्रकार तुम सदा आज्ञा मानते आए हो—न केवल मेरी उपस्थिति में, बल्कि अब मेरी अनुपस्थिति में और भी अधिक—डरते और काँपते हुए अपने उद्धार को कार्य में लाते रहो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने उद्धार को कार्य में लाते रहो” में उसे जीवन और आचरण में प्रभावी ढंग से पूरा करने का भाव है।
    reason: alternative_reading
  - marker: b
    text: “डरते और काँपते हुए” श्रद्धापूर्ण भय, गंभीरता और विनम्रता का पदबंध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्षात्मक संबंध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀγαπητοί μου
  choice: मेरे प्रिय लोगो
  rationale: सम्बोधन की आत्मीयता और पौलुस का स्नेहपूर्ण пастरीय स्वर सुरक्षित रहता है।
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: जिस प्रकार तुम सदा आज्ञा मानते आए हो
  rationale: उनकी बीती और अब तक प्रासंगिक बनी हुई आज्ञाकारिता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: उपस्थिति / अनुपस्थिति
  rationale: यूनानी के स्पष्ट विरोध को निकट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: πολλῷ μᾶλλον
  choice: और भी अधिक
  rationale: तुलनात्मक बल को स्पष्ट रूप से व्यक्त करता है।
- source_word: μετὰ φόβου καὶ τρόμου
  choice: डरते और काँपते हुए
  rationale: मूल पदबंध की तीव्रता और गंभीरता को नरम किए बिना स्वाभाविक क्रियाविशेषणीय रूप देता है।
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: अपने उद्धार को
  rationale: σωτηρία का धार्मिक भार तथा ἑαυτῶν द्वारा दिया गया आत्म-संबंध दोनों सुरक्षित रहते हैं।
- source_word: κατεργάζεσθε
  choice: कार्यान्वित करते रहो
  rationale: उद्धार को जीवन और आचरण में प्रभावी रूप देने तथा आगे बढ़ाने का भाव व्यक्त करता है; इसे कमाने का अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: ‘अपने उद्धार को कार्यरूप देते रहो’ का अर्थ
  choice: उद्धार को जीवन और आचरण में प्रभावी रूप से पूरा करते रहना
  alternative: अपने प्रयत्नों से उद्धार अर्जित करना
  rationale: κατεργάζεσθε किसी बात को प्रभावी रूप देने या अंजाम तक पहुँचाने का भाव रखता है; अगली आयत में परमेश्वर के भीतर कार्य करने का उल्लेख है। मुख्य पाठ तनाव को बनाए रखता है और पाद-टिप्पणी अर्जित करने के अर्थ से भेद स्पष्ट करती है।
- issue: ‘डरते और काँपते हुए’ का अभिप्राय
  choice: परमेश्वर के सामने श्रद्धापूर्ण भय, गंभीरता और विनम्रता
  alternative: केवल आतंक, अथवा भावहीन सम्मान
  rationale: मूल पदबंध की गंभीर भावात्मक शक्ति को बनाए रखते हुए उसके संदर्भगत धार्मिक आशय को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय किन्तु गरिमापूर्ण सम्बोधन। वाक्य की मूल तर्क-रचना, उपस्थिति-अनुपस्थिति का विरोध और आदेश की गंभीरता सुरक्षित रखी गई है।
