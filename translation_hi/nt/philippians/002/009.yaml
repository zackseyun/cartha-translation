  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: hi
  text: इसलिए परमेश्वर ने भी उसे अत्यन्त ऊँचा उठाया और अनुग्रहपूर्वक उसे वह नाम दिया[a] जो हर नाम से ऊपर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे प्रदान किया।”
    reason: lexical_alternative
  - marker: b
    text: “नाम” केवल बोले जाने वाले नाम को ही नहीं, बल्कि प्रतिष्ठा, पद या उपाधि को भी सूचित कर सकता है; यह पद अभी यह स्पष्ट नहीं करता कि कौन-सा नाम अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: इसलिए ... भी
  rationale: ‘इसलिए’ διό के निष्कर्षसूचक अर्थ को और ‘भी’ καί के योगात्मक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यूनानी में कर्ता स्पष्ट और निश्चित है; आधुनिक मानक हिन्दी में दिव्य संदर्भ के लिए ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ὑπερύψωσεν
  choice: सर्वोच्च स्थान तक ऊँचा किया
  rationale: यह संयुक्त क्रिया के तीव्र अर्थ को स्पष्ट हिन्दी में व्यक्त करता है; केवल ‘ऊँचा किया’ उसकी प्रबलता को कम कर सकता था।
- source_word: ἐχαρίσατο
  choice: अनुग्रहपूर्वक ... दिया
  rationale: यह χάρις से जुड़े अनुग्रह के भाव को सामने रखता है, जबकि ‘प्रदान किया’ एक संभव अधिक औपचारिक विकल्प है।
- source_word: τὸ ὄνομα
  choice: वह नाम
  rationale: मूल पाठ स्पष्ट रूप से ‘नाम’ कहता है; इसे मुख्य पाठ में ‘उपाधि’ या किसी विशेष नाम के रूप में निर्धारित नहीं किया गया।
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: जो हर नाम से ऊपर है
  rationale: यह मूल की तुलनात्मक संरचना को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: ‘नाम’ की पहचान
  choice: मुख्य पाठ में केवल ‘वह नाम’ रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘यीशु’ नाम या अगले पदों में प्रकट होने वाली दिव्य उपाधि ‘प्रभु’ मानना।
  rationale: यह पद स्वयं उस नाम की पहचान नहीं बताता; इसलिए अनुवाद अगले पदों से कोई एक व्याख्या लाकर यहाँ आरोपित नहीं करता।
- issue: ὑπερύψωσεν में स्थान और प्रतिष्ठा का संबंध
  choice: ‘सर्वोच्च स्थान तक ऊँचा किया’
  alternative: ‘अत्यन्त महान किया’ या ‘बहुत ऊँचा उठाया’
  rationale: क्रिया अत्यधिक ऊँचा किए जाने को व्यक्त करती है और संदर्भ में प्रतिष्ठा भी निहित हो सकती है; चयन अर्थ को केवल आंतरिक महानता तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘अनुग्रहपूर्वक’ मूल क्रिया के अनुग्रह-संबंधी भाव को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
