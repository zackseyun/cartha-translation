    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: इसी प्रकार
  rationale: यह पदबंध यहाँ क्रियाविशेषण की तरह पिछले कथन की ओर संकेत करता है। ‘इसी प्रकार’ स्वाभाविक हिन्दी में उस संबंध को बनाए रखता है; δέ के हल्के संक्रमणकारी भाव को अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: χαίρετε
  choice: आनन्दित हो
  rationale: वर्तमानकालीन कर्तृवाच्य आज्ञार्थक बहुवचन को संबोधन-संगत हिन्दी आज्ञा में व्यक्त किया गया है। यह फिलिप्पियों में बार-बार आने वाले आनन्द के भाव को बनाए रखता है।
- source_word: συγχαίρετέ
  choice: साथ आनन्द मनाओ
  rationale: संयुक्त क्रिया साझा आनन्द का भाव देती है। ‘साथ आनन्द मनाओ’ आधुनिक हिन्दी में स्पष्ट रूप से सह-आनन्द को व्यक्त करता है और पहली क्रिया से अनावश्यक रूप से एक-जैसा नहीं सुनाई देता।
- source_word: μοι
  choice: मेरे साथ
  rationale: सम्प्रदान कारक सर्वनाम पौलुस को उस व्यक्ति के रूप में दिखाता है जिसके साथ पाठकों को आनन्द मनाना है; हिन्दी में ‘मेरे साथ’ इसका स्वाभाविक रूप है।
