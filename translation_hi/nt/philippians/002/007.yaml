translation:
  language: hi
  text: बल्कि अपने आपको खाली कर दिया[a], दास का स्वरूप धारण करके और मनुष्यों के समान बनकर[b]; और बाहरी रूप में मनुष्य के समान दिखाई देकर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको कुछ नहीं बना लिया।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी: “मनुष्यों की समानता में होकर।” ‘मनुष्यों’ यहाँ सामान्य अर्थ में है, किसी विशेष लिंग के लिए नहीं।'
    reason: source_clarity
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले कथन के साथ प्रबल विरोध दिखाता है; हिन्दी में ‘बल्कि’ इस सुधारात्मक-विरोधी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἑαυτὸν ἐκένωσεν
  choice: अपने आपको खाली कर दिया
  rationale: यह κενόω के रूपक को बनाए रखता है और यह तय नहीं करता कि उसने किस वस्तु को त्यागा; आगे आने वाले कृदन्त बताते हैं कि यह आत्म-रिक्तीकरण किस प्रकार हुआ।
- source_word: μορφὴν δούλου λαβών
  choice: दास का स्वरूप धारण करके
  rationale: ‘स्वरूप’ μορφή के अर्थ और पिछले पद के साथ उसके समानान्तर प्रयोग को सुरक्षित रखता है। ‘दास’ δοῦλος की बँधी और अधीन स्थिति की प्रबलता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: मनुष्यों की समानता में आकर
  rationale: यह ὁμοίωμα को ‘समानता’ और γενόμενος को ‘आकर’ के द्वारा निकटता से व्यक्त करता है। बहुवचन ἀνθρώπων समस्त मानवजाति को सूचित करता है, किसी विशेष लिंग को नहीं।
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: बाहरी रूप में मनुष्य के समान पाया जाकर
  rationale: ‘बाहरी रूप’ σχῆμα के दिखाई देने वाले रूप या दशा को व्यक्त करता है और इसे पहले आए μορφή (‘स्वरूप’) से अलग रखता है। ‘पाया जाकर’ कृदन्तीय रचना को बनाए रखता है, जो अगले पद में जारी रहती है।
theological_decisions:
- issue: ‘अपने आपको खाली कर दिया’ (ἑαυτὸν ἐκένωσεν) का मसीह-विज्ञान संबंधी अर्थ
  choice: मूल रूपक को बनाए रखा गया और उसके ढंग की व्याख्या आगे के कृदन्तों पर छोड़ी गई।
  alternative: ‘अपने आपको कुछ नहीं बना लिया’ या इसे ईश्वरीय गुणों के त्याग के रूप में स्पष्ट करना
  rationale: यूनानी पाठ यह नहीं बताता कि उसने किसी ईश्वरीय गुण को त्याग दिया। रूपक को ज्यों का त्यों रखने से पद का तनाव सुरक्षित रहता है और कोई अतिरिक्त मसीह-विज्ञान संबंधी सिद्धान्त पाठ में नहीं जोड़ा जाता।
- issue: ‘मनुष्यों की समानता’ (ὁμοίωμα) का आशय
  choice: ‘समानता’ शब्द को स्पष्ट रूप से बनाए रखा गया, पर उसे केवल दिखावटी मानवता नहीं समझाया गया।
  alternative: ‘केवल मनुष्य जैसा दिखाई दिया’ या यूनानी से अधिक स्पष्ट रूप से ‘पूरी तरह मनुष्य बना’ कहना
  rationale: पौलुस की अभिव्यक्ति वास्तविक मानवता और ‘समानता’ की सूक्ष्मता को साथ रखती है। अनुवाद को न तो वास्तविक मानवता नकारनी चाहिए, न पाठ से अधिक दार्शनिक स्पष्टता जोड़नी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘दास’ ऐतिहासिक अधीनता की तीव्रता को सुरक्षित रखता है। पद के अंत का ‘पाया जाकर’ जानबूझकर कृदन्तीय है, क्योंकि यूनानी वाक्य अगले पद में आगे बढ़ता है।
