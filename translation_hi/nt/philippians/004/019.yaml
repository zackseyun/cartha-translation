source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: hi
  text: और मेरा परमेश्वर अपनी महिमा में अपने धन के अनुसार[a] मसीह यीशु में तुम्हारी हर आवश्यकता पूरी करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने धन के अनुसार” का अर्थ है कि परमेश्वर का प्रबंध उसके धन के माप के अनुरूप है, केवल उसके धन में से नहीं।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “महिमा में” का संबंध कुछ अस्पष्ट है। इसका संबंध “धन” से समझा जा सकता है, अथवा इसे पूरी प्रतिज्ञा के ढंग/क्षेत्र से संबद्ध माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: और मेरा परमेश्वर
  rationale: δέ यहाँ हल्का संयोजक है; “और” पिछले संदर्भ से स्वाभाविक संबंध रखता है और “मेरा” की व्यक्तिगत अभिव्यक्ति बनाए रखता है।
- source_word: πληρώσει
  choice: पूरी करेगा
  rationale: इस संदर्भ में πληρόω का अर्थ जो कमी है उसे उपलब्ध कराकर आवश्यकता पूरी करना है; आधुनिक हिन्दी में “आवश्यकता पूरी करेगा” स्वाभाविक और अर्थसटीक है।
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: तुम्हारी हर आवश्यकता
  rationale: यह χρεία के ‘आवश्यकता’ अर्थ और πᾶσαν के वितरणात्मक बल, दोनों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: अपने ... धन के अनुसार
  rationale: κατά यहाँ स्रोत मात्र नहीं, बल्कि माप या मानक व्यक्त करता है; इसलिए “धन में से” की अपेक्षा “धन के अनुसार” अधिक सटीक है।
- source_word: ἐν δόξῃ
  choice: महिमा के धन
  rationale: हिन्दी में इसे निकटवर्ती “धन” से जोड़ना स्वाभाविक है, अर्थात महिमा में स्थित या महिमामय धन; यूनानी वाक्य-विन्यास अन्य संबंध की संभावना भी खुली रखता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν का संबंधात्मक/क्षेत्रगत भाव “में” से बना रहता है। Χριστός के लिए प्रचलित हिन्दी पदवी “मसीह” अर्थपूर्ण, स्वाभाविक और व्यापक रूप से समझी जाती है।
theological_decisions:
- issue: ἐν δόξῃ और ἐν Χριστῷ Ἰησοῦ का वाक्यगत संबंध
  choice: “मसीह यीशु में” को पूरी प्रतिज्ञा के क्षेत्र से और “महिमा” को परमेश्वर के धन से जोड़ा गया है
  alternative: “अपनी महिमा में, मसीह यीशु में” अथवा “मसीह यीशु में महिमा के साथ”
  rationale: यूनानी में लगातार आए दो ἐν-वाक्यांशों का सटीक संबंध कुछ अस्पष्ट है। मुख्य पाठ सहज हिन्दी देता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक संरचना सुरक्षित रखती है।
- issue: Χριστός का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: “मसीह” आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित है और Χριστός की पदवी का अर्थ भी संप्रेषित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “पूरी करेगा” बोलचाल की स्पष्टता और मूल के आशय का संतुलन रखता है; पदबंधों की वास्तविक यूनानी अस्पष्टता पादटिप्पणी में सुरक्षित है।
