revisions:
- from: हाँ, हे सच्चे सहचर,[a] मैं तुझसे भी विनती करता हूँ कि इन स्त्रियों की सहायता कर। इन्होंने सुसमाचार के काम में मेरे साथ संघर्ष किया था,[b] और क्लेमेंस तथा मेरे बाकी सहकर्मियों ने भी—जिनके नाम जीवन की पुस्तक में हैं।
  to: हाँ, हे सच्चे सहचर,[a] मैं तुमसे भी विनती करता हूँ कि इन स्त्रियों की सहायता करो, जिन्होंने सुसमाचार में मेरे साथ, क्लेमेंस और मेरे बाकी सहकर्मियों के साथ मिलकर संघर्ष किया है। उन सबके नाम जीवन की पुस्तक में हैं।
  rationale: The revision makes the women the grammatical subject of the relative clause, joins Clement and the remaining coworkers to the same shared gospel striving, and explicitly gives ‘उन सबके नाम’ the group-wide scope indicated by the Greek. The aorist is rendered with Hindi perfect (‘किया है’) in this relative description, a natural idiom that need not imply a Greek perfect. Footnote b is retained as a lexical alternative but updated to match the revised verbal form.
  reviewer_model: gpt-5.6-terra
