id: PHP.4.3
reference: Philippians 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: hi
  text: हाँ, हे सच्चे सहचर,[a] मैं तुमसे भी विनती करता हूँ कि इन स्त्रियों की सहायता करो, जिन्होंने सुसमाचार में मेरे साथ, क्लेमेंस और मेरे बाकी सहकर्मियों के साथ मिलकर संघर्ष किया है। उन सबके नाम जीवन की पुस्तक में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सच्चे जुए के साथी”; कुछ लोग इसे व्यक्ति का नाम, “सिज़िगुस,” भी मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: हाँ
  rationale: पौलुस की आरंभिक पुष्टि और सीधे संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐρωτῶ
  choice: विनती करता हूँ
  rationale: व्यक्तिगत और विनम्र अनुरोध का भाव देता है; केवल ‘पूछता हूँ’ यहाँ हिन्दी में अपेक्षित आशय व्यक्त नहीं करता।
- source_word: γνήσιε σύζυγε
  choice: हे सच्चे सहचर
  rationale: इसे किसी अज्ञात पुरुष सहयोगी के लिए वर्णनात्मक संबोधन मानता है और साझेदारी का भाव गरिमापूर्ण, सुबोध हिन्दी में व्यक्त करता है।
- source_word: συλλαμβάνου
  choice: सहायता कर
  rationale: आज्ञार्थक क्रिया में निहित सक्रिय सहयोग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐταῖς
  choice: इन स्त्रियों की
  rationale: यूनानी स्त्रीलिंग बहुवचन और प्रसंग में यूओदिया तथा सुन्तुखे की ओर संकेत को स्पष्ट करता है।
- source_word: συνήθλησάν μοι
  choice: मेरे साथ संघर्ष किया था
  rationale: συναθλέω के साथ मिलकर प्रयत्न या संघर्ष करने वाले सशक्त बिंब को बनाए रखता है।
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: सुसमाचार के काम में
  rationale: यूनानी के संक्षिप्त वाक्यांश को हिन्दी में स्वाभाविक बनाते हुए सुसमाचार से जुड़ी सेवा का व्यापक आशय व्यक्त करता है।
- source_word: συνεργῶν
  choice: सहकर्मियों
  rationale: पौलुस के साथ एक ही कार्य में लगे लोगों के लिए संक्षिप्त, आधुनिक और स्वाभाविक शब्द है।
- source_word: βίβλῳ ζωῆς
  choice: जीवन की पुस्तक
  rationale: स्थापित बाइबलीय अभिव्यक्ति को स्पष्ट और परिचित रूप में प्रस्तुत करता है।
theological_decisions:
- issue: γνήσιε σύζυγε की व्याख्या
  choice: 'किसी अज्ञात पुरुष सहयोगी के लिए वर्णनात्मक संबोधन: “हे सच्चे सहचर”'
  alternative: इसे ‘सिज़िगुस’ नाम मानना, अथवा अधिक शाब्दिक रूप से ‘सच्चे जुए के साथी’ कहना
  rationale: विशेषण γνήσιε के साथ यह पदबंध स्वाभाविक रूप से वर्णनात्मक संबोधन समझा जा सकता है। फिर भी नाम और रूपक संबंधी वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου का संबंध
  choice: क्लेमेंस और अन्य सहकर्मियों को भी सुसमाचार के संयुक्त संघर्ष में सहभागी मानते हुए स्वतंत्र समन्वित खंड
  alternative: क्लेमेंस और अन्य सहकर्मियों को केवल स्त्रियों की सहायता करने वाले संभावित व्यक्तियों के रूप में जोड़ना
  rationale: μετά के साथ जनन कारक उन लोगों को स्वाभाविक रूप से पौलुस और इन स्त्रियों के साथ संयुक्त प्रयास में सहभागी बताता है; हिन्दी में अस्पष्ट या असंगत संयोजन से बचने के लिए इसे स्पष्ट समन्वित खंड बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। एकवचन संबोधन में ‘तुझसे/कर’ मूल यूनानी के व्यक्तिगत और सीधे संबोधन को बनाए रखता है। ‘सुसमाचार के काम में’ मूल ἐν τῷ εὐαγγελίῳ की संक्षिप्तता को हल्का खोलता है, जबकि संघर्ष का बिंब मुख्य पाठ और पादटिप्पणी में सुरक्षित है।
