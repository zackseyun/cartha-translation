source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: hi
  text: अंत में, भाइयो[a], जो कुछ सत्य है, जो कुछ आदरणीय है, जो कुछ न्यायसंगत है, जो कुछ शुद्ध है, जो कुछ मनोहर है, जो कुछ सराहनीय है—यदि कोई सद्गुण है और यदि कोई प्रशंसा की बात है—इन बातों पर विचार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयों और बहनों’; यूनानी में ‘भाइयो’ पूरी विश्वासी मंडली के लिए संबोधन हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: अंत में
  rationale: यह समापन की ओर ले जाने वाला संवाद-सूचक पद है। ‘अंत में’ आधुनिक हिन्दी में स्वाभाविक है और उपदेश के संक्रमण को स्पष्ट रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और पौलुस के संबोधन में प्रायः पूरी विश्वासी मंडली को समेटता है; मूल रूप मुख्य पाठ में रखा गया और समावेशी प्रयोग पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ὅσα
  choice: जो कुछ
  rationale: बार-बार आने वाले अनिश्चित संबंधवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और सूची की पुनरावृत्त संरचना बनाए रखता है।
- source_word: ἀληθῆ
  choice: सत्य
  rationale: यह व्यापक रूप से उस बात को दर्शाता है जो सच और वास्तविक है।
- source_word: σεμνά
  choice: आदरणीय
  rationale: नैतिक गरिमा और सम्मान के योग्य होने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: δίκαια
  choice: न्यायसंगत
  rationale: नैतिक रूप से सही, सीधा और न्यायपूर्ण होने का अर्थ व्यक्त करता है, बिना इसे अनावश्यक रूप से तकनीकी धार्मिक शब्द बनाने के।
- source_word: ἁγνά
  choice: शुद्ध
  rationale: नैतिक और आंतरिक पवित्रता के व्यापक भाव को संक्षेप में सुरक्षित रखता है।
- source_word: προσφιλῆ
  choice: मनोहर
  rationale: उस वस्तु या आचरण का भाव देता है जो प्रेम और स्नेह जगाता है; ‘प्रिय’ की तुलना में सूची में अधिक स्वाभाविक विशेषण है।
- source_word: εὔφημα
  choice: सराहनीय
  rationale: जिसके विषय में अच्छा कहा जाता है अथवा जिसकी अच्छी प्रतिष्ठा है, उस अर्थ को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: εἴ τις ἀρετὴ
  choice: यदि कोई सद्गुण है
  rationale: ἀρετή के गुण, नैतिक श्रेष्ठता और उत्कृष्टता के संक्षिप्त संज्ञात्मक रूप को बनाए रखता है।
- source_word: εἴ τις ἔπαινος
  choice: और यदि कोई प्रशंसा की बात है
  rationale: ἔπαινος के ‘प्रशंसा’ अर्थ को रखते हुए हिन्दी में वाक्य को स्वाभाविक और बोधगम्य बनाया गया है।
- source_word: ταῦτα λογίζεσθε
  choice: इन्हीं बातों पर विचार करते रहो
  rationale: यह केवल क्षणिक सोच नहीं, बल्कि जान-बूझकर और निरंतर मन लगाने का आदेश है; ‘इन्हीं’ पूर्ववर्ती सूची की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: ἀδελφοί के संबोधन का लिंग और विस्तार
  choice: मुख्य पाठ में ‘भाइयो’, पाद-टिप्पणी में पूरी विश्वासी मंडली का संभावित समावेश
  alternative: मुख्य पाठ में ‘भाइयो और बहनो’
  rationale: इससे यूनानी शब्द का व्याकरणिक रूप छिपता नहीं, साथ ही पौलुस के सामुदायिक संबोधन में स्त्रियों के समावेश की प्रासंगिक भाषिक-सांस्कृतिक जानकारी भी दी जाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामुदायिक उपदेश का स्वर रखा गया है। दोहराए गए ‘जो कुछ’ से यूनानी सूची की लय सुरक्षित रहती है, जबकि ‘विचार करते रहो’ निरंतर मनन के आदेश को स्वाभाविक ढंग से व्यक्त करता है।
