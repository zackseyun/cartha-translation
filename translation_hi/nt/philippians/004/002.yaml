lexical_decisions:
- source_word: Εὐοδίαν
  choice: यूओदिया
  rationale: व्यक्तिगत नाम का यूनानी रूप से निकट और हिन्दी में पठनीय लिप्यंतरण किया गया है; इसका अर्थानुवाद नहीं किया गया।
- source_word: παρακαλῶ
  choice: मैं ... से आग्रह करता हूँ
  rationale: यह इस प्रसंग के व्यक्तिगत और गंभीर निवेदन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। यूनानी पाठ की पुनरावृत्ति दोनों स्त्रियों के प्रति समान और अलग-अलग आग्रह दिखाती है, इसलिए उसे बनाए रखा गया है।
- source_word: Συντύχην
  choice: सुन्तुखे
  rationale: व्यक्तिगत नाम का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: τὸ αὐτὸ φρονεῖν
  choice: एक ही मन रखें
  rationale: यह वाक्यांश केवल किसी एक बात पर सहमत होने से अधिक, सोच और मनोवृत्ति की समानता व्यक्त करता है। हिन्दी में यह संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: 'यह संबंधपरक और धार्मिक आधार को खुला रखता है: अपेक्षित एकता प्रभु के दायरे या उनके साथ संबंध में है।'
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν में एकता का स्वरूप
  choice: एक ही मन रखें
  alternative: प्रभु में सहमत हों
  rationale: ‘सहमत हों’ संभव है, पर वह अभिव्यक्ति को किसी विशेष मतभेद पर सहमति तक सीमित कर सकती है। ‘एक ही मन रखें’ सोच और मनोवृत्ति के व्यापक अर्थ तथा मूल पाठ के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों नामों के साथ ‘आग्रह करता हूँ’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
