source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: hi
  text: और परमेश्वर की शांति, जो सारी समझ से परे है, तुम्हारे हृदयों और तुम्हारे विचारों की मसीहा यीशु में[a] रक्षा करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसीह यीशु में।”
    reason: Χριστός के लिए पारंपरिक हिन्दी रूप ‘मसीह’ का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: εἰρήνη
  choice: शांति
  rationale: यह सामान्य, स्वाभाविक हिन्दी समतुल्य है और यहाँ आंतरिक स्थिरता तथा परमेश्वर से मिलने वाली संपूर्ण कुशलता—दोनों की अर्थ-छाया को खुला रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक पद का सीधा अनुवाद किया गया है; इससे अधिकार अथवा स्रोत की अर्थ-संभावनाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: जो सारी समझ से परे है
  rationale: यह पद परमेश्वर की शांति को मानवीय बोध की सीमा से बढ़कर बताता है। हिन्दी में यह स्वाभाविक है और मूल का तुलनात्मक भाव बनाए रखता है।
- source_word: φρουρήσει
  choice: रक्षा करेगी
  rationale: क्रिया में पहरा देने और सुरक्षित रखने का सशक्त भाव है। ‘रक्षा करेगी’ आधुनिक हिन्दी में स्पष्ट है और उस सुरक्षात्मक चित्र को व्यक्त करता है।
- source_word: τὰς καρδίας ὑμῶν
  choice: तुम्हारे हृदयों
  rationale: ‘हृदय’ बाइबलीय प्रयोग में भावनाओं और भीतरी व्यक्तित्व के केंद्र को व्यक्त करता है; बहुवचन मूल पाठ के अनुरूप रखा गया है।
- source_word: τὰ νοήματα ὑμῶν
  choice: तुम्हारे विचारों
  rationale: νοήματα मानसिक धारणाओं, सोच और विचारों को सूचित करता है। ‘विचारों’ मूल बहुवचन को बचाता है और ‘हृदयों’ से अनावश्यक रूप से समानार्थी नहीं बनता।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीहा यीशु में
  rationale: ἐν को क्षेत्र अथवा एकता के अर्थ में ‘में’ से व्यक्त किया गया है। Χριστός की उपाधि-शक्ति बनाए रखने के लिए ‘मसीहा’ चुना गया है, जबकि पारंपरिक ‘मसीह यीशु में’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ में Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीहा यीशु में
  alternative: मसीह यीशु में
  rationale: यह पौलुसी पद विश्वासियों की सुरक्षा और जीवन के क्षेत्र को यीशु मसीहा में स्थित बताता है। ‘मसीहा’ उपाधि का अर्थ अधिक प्रत्यक्ष रखता है; ‘मसीह’ प्रचलित किन्तु अधिक नाम-सदृश रूप है।
- issue: परमेश्वर की शांति और मानवीय समझ का संबंध
  choice: जो सारी समझ से परे है
  alternative: जो हर मन से बढ़कर है
  rationale: νοῦς का शाब्दिक अर्थ ‘मन’ हो सकता है, पर इस वाक्यांश में बोध अथवा समझ की सीमा प्रमुख है। चुना हुआ पाठ किसी अतिरिक्त दार्शनिक या संप्रदायगत व्याख्या को नहीं जोड़ता।
