  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य-रचना मूल यूनानी के प्रवाह के निकट है, पर ‘सारी समझ से परे’ और ‘रक्षा करेगी’ जैसे स्वाभाविक हिन्दी पदों का प्रयोग किया गया है।
