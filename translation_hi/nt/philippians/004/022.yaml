  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: hi
  text: सभी पवित्र जन तुम्हें नमस्कार कहते हैं, विशेषकर वे जो कैसर के घराने से हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζονται
  choice: नमस्कार कहते हैं
  rationale: पत्रों में अभिवादन भेजने के लिए प्रयुक्त सामान्य क्रिया; यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है।
- source_word: πάντες οἱ ἅγιοι
  choice: सब पवित्र जन
  rationale: ἅγιοι पौलुस के पत्रों में विश्वासियों के लिए प्रयुक्त सामुदायिक पद है। ‘पवित्र जन’ मूल के ‘पवित्र’ अर्थ को बनाए रखता है और किसी विशिष्ट उच्च धार्मिक वर्ग का संकेत नहीं देता।
- source_word: μάλιστα δὲ
  choice: विशेषकर
  rationale: यह बड़े समूह के भीतर एक समूह पर विशेष बल देता है; ‘विशेषकर’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: वे जो कैसर के राजपरिवार से जुड़े हैं
  rationale: यह पद कैसर के घराने अथवा शाही प्रतिष्ठान से संबद्ध लोगों को दर्शा सकता है, केवल रक्त-संबंधी परिवार को नहीं। ‘से जुड़े हैं’ उस व्यापक संबद्धता को सुरक्षित रखता है।
- source_word: Καίσαρος
  choice: कैसर
  rationale: यूनानी पाठ के ऐतिहासिक शाही नाम/उपाधि को बनाए रखता है; ‘सम्राट’ कहने की अपेक्षा मूल रूप के अधिक निकट है।
theological_decisions:
- issue: पौलुस के प्रयोग में ‘पवित्र जन’ का अर्थ
  choice: इसे सभी मसीही विश्वासियों के लिए सामुदायिक पद के रूप में रखा गया है।
  alternative: ‘परमेश्वर के लोग’ या ‘विश्वासी’
  rationale: मूल शब्द की पवित्रता-संबंधी धारणा को बनाए रखते हुए इसे किसी विशिष्ट, असाधारण रूप से पवित्र वर्ग तक सीमित नहीं किया गया।
- issue: ‘कैसर के घराने’ का दायरा
  choice: शाही घराने या प्रतिष्ठान से संबद्ध व्यक्ति
  alternative: कैसर के रक्त-संबंधी परिवार के सदस्य
  rationale: οἰκία और ἐκ का यह प्रयोग दासों, मुक्त किए गए लोगों, सेवकों या अधिकारियों सहित व्यापक शाही प्रतिष्ठान को सूचित कर सकता है; अनुवाद इसे केवल परिवार तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पवित्र जन’ प्रमुख पौलुसी पदावली को बनाए रखता है, जबकि ‘राजपरिवार से जुड़े’ वाक्यांश सामान्य पाठक को व्यापक शाही घराने का अर्थ समझने में सहायता देता है।
