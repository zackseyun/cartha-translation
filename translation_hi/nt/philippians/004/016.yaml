  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: hi
  text: क्योंकि थिस्सलुनीके में भी तुमने मेरी ज़रूरत के लिए एक बार और फिर दूसरी बार भी भेजा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आसपास के कथन का कारण बताने वाला संयोजक है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: ἐν Θεσσαλονίκῃ
  choice: थिस्सलुनीके में
  rationale: यूनानी के सीधे स्थानवाचक अर्थ को बनाए रखता है।
- source_word: ἅπαξ καὶ δὶς
  choice: एक बार ही नहीं, बल्कि दूसरी बार भी
  rationale: यह स्वाभाविक हिन्दी में बार-बार भेजे जाने का अर्थ व्यक्त करता है और यूनानी पदबंध में निहित ‘एक बार और दो बार’ की पुनरावृत्ति को बनाए रखता है।
- source_word: εἰς τὴν χρείαν μοι
  choice: मेरी ज़रूरत के लिए
  rationale: χρεία के एकवचन को ‘ज़रूरत’ से दर्शाता है और सहायता को पौलुस की आवश्यकता की ओर निर्देशित बताता है।
- source_word: ἐπέμψατε
  choice: तुमने ... भेजा था
  rationale: क्रिया के सामान्य अर्थ ‘भेजना’ को रखता है; कोई स्पष्ट कर्म, जैसे ‘सहायता’ या ‘धन’, नहीं जोड़ा गया है। भूतकालीन ‘था’ प्रसंगानुकूल पूर्व घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
