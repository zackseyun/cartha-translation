  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: hi
  text: प्रभु में सदा आनन्दित रहो[a]। मैं फिर कहूँगा[b], आनन्दित रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु में सदा प्रसन्न रहो।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मैं फिर कहूँगा, आनन्दित रहो।’
