lexical_decisions:
- source_word: Χαίρετε
  choice: आनन्दित रहो
  rationale: वर्तमानकालीन सक्रिय आज्ञार्थक, बहुवचन। ‘आनन्दित रहो’ आज्ञा की निरन्तरता और पौलुस के प्रोत्साहन का भाव स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν
  choice: में
  rationale: यहाँ ‘में’ प्रभु के साथ सम्बन्ध या उसके क्षेत्र में होने का व्यापक अर्थ बनाए रखता है; इसे केवल ‘के कारण’ या ‘की सहायता से’ तक सीमित नहीं करता।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: पौलुस के इस प्रयोग में κύριος मसीह को सूचित करता है। ‘प्रभु’ मानक और धर्मशास्त्रीय रूप से खुला हिन्दी पर्याय है।
- source_word: πάντοτε
  choice: सदा
  rationale: ‘सदा’ πάντοτε की निरन्तर और सर्वकालिक शक्ति को संक्षिप्त, स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάλιν
  choice: फिर
  rationale: ‘फिर’ बलपूर्ण पुनरुक्ति को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐρῶ
  choice: मैं कहूँगा
  rationale: यह λέγω का भविष्यकालीन रूप है। ‘मैं कहूँगा’ यूनानी भविष्यकाल को सुरक्षित रखता है, उसे वर्तमानकाल ‘मैं कहता हूँ’ में नहीं बदलता।
- source_word: χαίρετε
  choice: आनन्दित रहो
  rationale: दोहराई गई आज्ञा का समान अनुवाद पौलुस की आलंकारिक पुनरुक्ति और बल को बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु में’ का अर्थ
  choice: '‘प्रभु में’ को सम्बन्ध अथवा क्षेत्र के अर्थ में यथावत रखा गया है: आनन्द प्रभु के साथ सम्बन्ध और उसमें स्थिति से जुड़ा है।'
  alternative: इसे ‘प्रभु के कारण’ या ‘प्रभु की सामर्थ्य से’ समझना सम्भव है।
  rationale: ἐν κυρίῳ पौलुस में प्रायः सम्बन्ध या क्षेत्र सूचित करता है। शाब्दिक और स्वाभाविक ‘प्रभु में’ सम्भावित अर्थों को अनावश्यक रूप से सीमित किए बिना धर्मशास्त्रीय व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक सम्बोधन वाला रूप अपनाया गया है। ‘आनन्दित रहो’ को ‘खुश रहो’ की अपेक्षा इसलिए चुना गया है कि वह मूल आज्ञा की धार्मिक-प्रोत्साहक गरिमा और निरन्तर भाव को बेहतर बनाए रखता है।
