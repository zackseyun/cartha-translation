- source_word: ἐπιεικές
  choice: उदार और सहृदय व्यवहार
  rationale: यह पद केवल कोमल स्वभाव नहीं, बल्कि दूसरों के प्रति विचारशील, न कठोर, रियायत देनेवाले और अनुग्रहपूर्ण आचरण को व्यक्त करता है। हिंदी में संयुक्त अभिव्यक्ति इसके व्यापक नैतिक अर्थ को स्वाभाविक ढंग से सामने लाती है।
- source_word: γνωσθήτω
  choice: प्रकट हो
  rationale: 'यह निष्क्रिय आज्ञार्थक भाव को सहज हिंदी में व्यक्त करता है: ऐसा आचरण सबको स्पष्ट दिखाई दे और पहचाना जाए।'
- source_word: πᾶσιν ἀνθρώποις
  choice: सब लोगों पर
  rationale: यह वाक्यांश सभी मनुष्यों को समावेशी रूप से संदर्भित करता है; ‘सब लोगों’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος की धर्मवैचारिक गरिमा और प्रचलित बाइबलीय उपाधि को बनाए रखता है।
- source_word: ἐγγύς
  choice: निकट
  rationale: ‘निकट’ मूल यूनानी की स्थानगत और कालगत दोनों संभावनाओं को सुरक्षित रखता है—प्रभु पास उपस्थित हैं, उनका आगमन निकट है, अथवा दोनों।
theological_decisions:
- issue: ὁ κύριος ἐγγύς का आशय
  choice: प्रभु निकट हैं
  alternative: प्रभु पास ही हैं / प्रभु शीघ्र आनेवाले हैं
  rationale: यूनानी कथन उपस्थिति की निकटता और आने के समय की निकटता—दोनों अर्थों की संभावना रखता है। मुख्य पाठ किसी एक अर्थ को चुनकर इस तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उदार और सहृदय व्यवहार’ अमूर्त तथा संभावित रूप से संकीर्ण एक-शब्दीय विकल्पों की अपेक्षा संदर्भगत नैतिक गुण को अधिक स्पष्ट करता है; फुटनोट प्रमुख शाब्दिक विकल्प सुरक्षित रखता है।
