source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: hi
  text: मसीह यीशु में हर एक पवित्र जन को नमस्कार कहो। जो भाई[a] मेरे साथ हैं, वे तुम्हें नमस्कार कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ यहाँ पौलुस के साथ के साथी विश्वासियों के लिए है; संदर्भ में इसमें स्त्रियाँ भी शामिल हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्र के समापन में यह आज्ञार्थक क्रिया अभिवादन पहुँचाने को कहती है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: πάντα ἅγιον
  choice: हर एक पवित्र जन
  rationale: एकवचन के साथ πᾶς का वितरणात्मक अर्थ है। यह अनुवाद प्रत्येक विश्वासी को अलग-अलग संबोधित करने का भाव और ἅγιος का ‘पवित्र/अलग किया हुआ जन’ अर्थ बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता संबंधी अर्थ को व्यक्त करता है और ἐν का संबंध सीधे बनाए रखता है।
- source_word: ἀσπάζονται
  choice: नमस्कार कहते हैं
  rationale: पत्रात्मक संदर्भ में यह वर्तमानकालीन क्रिया अभिवादन भेजने या कहने का सामान्य अर्थ देती है।
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: जो भाई मेरे साथ हैं
  rationale: यह यूनानी पदबंध का स्वाभाविक हिंदी रूप है और ἀδελφοί के व्याकरणिक पुल्लिंग बहुवचन को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ἅγιον की पहचान-संबंधी भाषा
  choice: पवित्र जन
  alternative: संत
  rationale: ‘पवित्र जन’ मूल शब्द के ‘परमेश्वर के लिए अलग किए हुए व्यक्ति’ के सामान्य अर्थ को अधिक पारदर्शी ढंग से बताता है और किसी विशेष मान्यता-प्राप्त धार्मिक वर्ग का संकेत नहीं देता।
- issue: ἀδελφοί का संदर्भगत विस्तार
  choice: मुख्य पाठ में ‘भाई’
  alternative: ‘भाई-बहन’ अथवा ‘संगी विश्वासी’
  rationale: यूनानी शब्द व्याकरणिक रूप से पुल्लिंग बहुवचन है। संदर्भ में यह मिश्रित विश्वासी समूह को भी समेट सकता है, पर पद स्वयं इसे निश्चित नहीं करता; इसलिए मुख्य पाठ मूल रूप को रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और पत्रात्मक शैली। ‘मसीह’ को उपाधि के रूप में रखा गया है। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई असंगत पाद-टिप्पणी चिह्न नहीं है।
