  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: hi
  text: किसी भी बात की चिंता मत करो[a], बल्कि हर बात में प्रार्थना और विनती के द्वारा, धन्यवाद के साथ, अपनी माँगें परमेश्वर के सामने रखो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी भी बात को लेकर व्याकुल मत हो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “तुम्हारी माँगें परमेश्वर को ज्ञात कराई जाएँ”; या, “अपनी माँगें परमेश्वर को बताओ।”
    reason: translation_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: किसी भी बात की चिंता मत करो
  rationale: निषेध के साथ μηδὲν का स्वाभाविक हिन्दी रूप ‘किसी भी बात’ है; ‘चिंता मत करो’ μεριμνάω के व्याकुल चिंता करने के अर्थ को सहज और गंभीर भाषा में व्यक्त करता है।
- source_word: ἐν παντὶ
  choice: हर बात में
  rationale: यह वाक्यांश मूल के व्यापक, सर्वसमावेशी भाव को आधुनिक हिन्दी में स्वाभाविक ढंग से रखता है।
- source_word: τῇ προσευχῇ καὶ τῇ δεήσει
  choice: प्रार्थना और विनती के द्वारा
  rationale: ‘प्रार्थना’ सामान्यतः परमेश्वर को संबोधित प्रार्थना है, जबकि ‘विनती’ किसी विशेष आवश्यकता के लिए आग्रह का अधिक विशिष्ट भाव बनाए रखती है।
- source_word: μετ’ εὐχαριστίας
  choice: धन्यवाद के साथ
  rationale: यह εὐχαριστία के संज्ञात्मक रूप और कृतज्ञतापूर्ण प्रार्थना के भाव दोनों को स्पष्ट और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: τὰ αἰτήματα ὑμῶν
  choice: अपनी माँगें
  rationale: αἴτημα उन बातों को दर्शाता है जिन्हें माँगा जाता है; ‘माँगें’ ‘विनती’ की अनावश्यक पुनरावृत्ति से बचते हुए ठोस अर्थ देता है।
- source_word: γνωριζέσθω πρὸς τὸν θεόν
  choice: परमेश्वर के सामने रखो
  rationale: यूनानी निष्क्रिय आज्ञार्थक का शाब्दिक रूप हिन्दी में बोझिल होता; यह स्वाभाविक रूप परमेश्वर को अपनी माँगें ज्ञात कराने का आशय देता है और πρὸς के संबंधपरक अर्थ को बनाए रखता है।
theological_decisions:
- issue: γνωριζέσθω का निष्क्रिय रूप और यह तथ्य कि परमेश्वर पहले से जानता है
  choice: अपनी माँगें परमेश्वर के सामने रखो
  alternative: तुम्हारी माँगें परमेश्वर को बताई जाएँ
  rationale: यह आज्ञा परमेश्वर को अज्ञात सूचना देने का सिद्धांत नहीं बनाती, बल्कि प्रार्थना में माँगें उनके सामने व्यक्त करने को कहती है। चुना गया रूप स्वाभाविक हिन्दी है और मूल की आज्ञात्मक शक्ति बनाए रखता है।
- issue: πρὸς τὸν θεόν का संबंध
  choice: परमेश्वर के सामने
  alternative: परमेश्वर को
  rationale: πρός यहाँ दिशा या संबोधन (‘परमेश्वर को’) और उपस्थिति-संबंधी भाव (‘परमेश्वर के सामने’) दोनों की अनुमति देता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और वैकल्पिक अनुवाद पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है, इसलिए ‘करो/रखो’ के रूप मूल के सामुदायिक निर्देश को स्वाभाविक ढंग से व्यक्त करते हैं। भाषा सरल और गरिमापूर्ण है। ‘चिंता’ तथा ‘विनती’ सामान्य पाठकों के लिए परिचित हैं, और पादटिप्पणियाँ वास्तविक शाब्दिक विकल्पों को सुरक्षित रखती हैं।
