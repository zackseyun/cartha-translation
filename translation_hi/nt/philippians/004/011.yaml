revisions:
- from: यह नहीं कि मैं अभाव के कारण कह रहा हूँ, क्योंकि मैंने यह सीख लिया है कि मैं जिन भी परिस्थितियों में रहूँ, उनमें संतुष्ट[a] रहूँ।
  to: मैं यह बात किसी अभाव के कारण नहीं कह रहा हूँ, क्योंकि मैंने हर परिस्थिति में संतुष्ट रहना सीख लिया है।
  rationale: The revision retains the meaning of speaking not from personal lack and of learned contentment, while using an idiomatic Hindi infinitive construction. “हर परिस्थिति में” naturally conveys the idiomatic breadth of ἐν οἷς εἰμι, and the footnote continues to preserve the semantic range of αὐτάρκης.
  reviewer_model: gpt-5.6-terra
