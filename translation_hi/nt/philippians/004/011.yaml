  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: hi
  text: मैं यह बात किसी अभाव के कारण नहीं कह रहा हूँ, क्योंकि मैंने हर परिस्थिति में संतुष्ट रहना सीख लिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: अभाव के कारण
  rationale: यह वाक्यांश कमी या जरूरत की दशा को दर्शाता है। ‘अभाव के कारण’ स्वाभाविक हिन्दी में यह स्पष्ट करता है कि पौलुस अपनी निजी कमी से प्रेरित होकर नहीं बोल रहा।
- source_word: λέγω
  choice: मैं ... कह रहा हूँ
  rationale: वर्तमान काल को आधुनिक हिन्दी के स्वाभाविक अपूर्ण वर्तमान रूप में रखा गया है, जो पौलुस के इसी कथन की ओर संकेत करता है।
- source_word: ἔμαθον
  choice: मैंने यह सीख लिया है
  rationale: यह रूप पूर्ण हुई सीखने की प्रक्रिया और उसके वर्तमान परिणाम—अब परिस्थितियों में संतुष्ट रहने की क्षमता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν οἷς εἰμι
  choice: मैं जिन भी परिस्थितियों में रहूँ
  rationale: मूल का संबंधवाचक वाक्यांश केवल स्थान नहीं, बदलती दशाओं को सूचित करता है। यह अनुवाद उसकी व्यापकता और अनिश्चितता को बनाए रखता है।
- source_word: αὐτάρκης
  choice: संतुष्ट
  rationale: संदर्भ में यह शब्द अलग-अलग परिस्थितियों में पर्याप्तता और संतोष की सीखी हुई अवस्था बताता है। ‘संतुष्ट’ सामान्य हिन्दी में स्वाभाविक है और मुख्य पाठ में आत्मनिर्भरता का दार्शनिक अर्थ अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: αὐτάρκης में संभावित दार्शनिक अर्थ
  choice: मुख्य पाठ में ‘संतुष्ट’
  alternative: ‘स्वावलंबी’ या ‘अपने आप में पर्याप्त’
  rationale: निकटवर्ती संदर्भ पौलुस की हर परिस्थिति में सीखी हुई संतोषपूर्ण पर्याप्तता पर बल देता है। ‘संतुष्ट’ इस अर्थ को सहज रूप से व्यक्त करता है, जबकि शब्द में निहित आत्म-पर्याप्तता की वैकल्पिक छाया को पादटिप्पणी में सुरक्षित रखा गया है; इससे स्वतंत्र आत्मनिर्भरता का धर्मवैज्ञानिक निष्कर्ष मुख्य पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अभाव’, ‘परिस्थितियाँ’ और ‘संतुष्ट’ सामान्य पाठकों के लिए स्पष्ट हैं। वाक्य की कारणसूचक संरचना और मूल की अर्थगत अस्पष्टता को यथासंभव बनाए रखा गया है।
