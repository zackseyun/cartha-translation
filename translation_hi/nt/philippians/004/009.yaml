  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: hi
  text: जो बातें तुमने सीखी, ग्रहण कीं, सुनीं और मुझमें देखीं[b], इन बातों को व्यवहार में लाते रहो[a]; और शान्ति का परमेश्वर तुम्हारे साथ रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों को करते रहो।”
    reason: lexical_alternative
  - marker: b
    text: “मुझमें देखीं” का अर्थ “मेरे उदाहरण में देखीं” या “मेरे जीवन में देखीं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: जो कुछ
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम का स्वाभाविक हिन्दी रूप; आगे के ‘उन्हीं बातों’ में बहुवचन अर्थ स्पष्ट हो जाता है।
- source_word: ἐμάθετε
  choice: सीखा
  rationale: पौलुस से मिली शिक्षा को सरल और सीधा रूप देता है।
- source_word: παρελάβετε
  choice: ग्रहण किया
  rationale: शिक्षा या सौंपे गए उपदेश को स्वीकार करने का व्यापक अर्थ बनाए रखता है, बिना ‘परम्परा’ को अनावश्यक रूप से स्पष्ट किए।
- source_word: ἠκούσατε
  choice: सुना
  rationale: क्रियाओं की समानान्तर शृंखला और मूल क्रिया का सीधा अर्थ सुरक्षित रखता है।
- source_word: εἴδετε ἐν ἐμοί
  choice: मुझमें ... देखा
  rationale: यूनानी वाक्यांश की जानबूझकर संक्षिप्त अभिव्यक्ति को बनाए रखता है; इसे केवल ‘मेरे उदाहरण में’ कहकर सीमित नहीं करता।
- source_word: ταῦτα πράσσετε
  choice: उन्हीं बातों पर चलते रहो
  rationale: निरन्तर आचरण में उतारने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: शान्ति का परमेश्वर
  rationale: पौलुस की विशिष्ट सम्बन्धसूचक अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: ἔσται μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहेगा
  rationale: भविष्यकालीन आश्वासन और परमेश्वर की उपस्थिति का सीधा अर्थ व्यक्त करता है।
theological_decisions:
- issue: आज्ञापालन और परमेश्वर की उपस्थिति का सम्बन्ध
  choice: उपदेश के बाद ‘और’ से जुड़ा आश्वासन रखा गया है।
  alternative: इसे स्पष्ट शर्त के रूप में प्रस्तुत करना—‘यदि तुम ऐसा करोगे, तो...’।
  rationale: यूनानी पाठ दोनों खण्डों को καί से जोड़ता है, स्पष्ट शर्तसूचक रचना से नहीं; इसलिए उपदेश और प्रतिज्ञा का बल बना रहता है, पर यांत्रिक कारण-परिणाम नहीं जोड़ा गया।
- issue: εἴδετε ἐν ἐμοί में पौलुस की भूमिका
  choice: ‘मुझमें ... देखा’ रखा गया है।
  alternative: ‘मेरे उदाहरण में देखा’ या ‘मेरे जीवन में देखा’।
  rationale: मूल की व्यापकता सुरक्षित रहती है; यह पौलुस के उदाहरण या जीवन की ओर संकेत कर सकता है, पर मुख्य पाठ में किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ग्रहण किया’ शिक्षा को स्वीकार करने का भाव देता है। क्रियाओं की मूल समानान्तरता यथासम्भव बचाई गई है, और ‘मुझमें’ की वास्तविक अस्पष्टता को विस्तृत व्याख्या से नहीं मिटाया गया।
