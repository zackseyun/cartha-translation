  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सुसमाचार के आरम्भ में’ मूल की संक्षिप्तता और सम्भावित अर्थगत व्यापकता को बनाए रखता है; ‘सहभागिता’ आर्थिक सहायता से अधिक व्यापक साझेदारी का भाव सुरक्षित रखती है।
