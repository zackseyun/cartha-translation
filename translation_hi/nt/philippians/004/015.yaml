id: PHP.4.15
reference: Philippians 4:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: hi
  text: और हे फिलिप्पियो, तुम स्वयं भी जानते हो कि सुसमाचार के आरम्भ में, जब मैं मकिदुनिया से निकला, तब तुम्हीं को छोड़कर किसी भी कलीसिया ने देने और लेने के मामले[a] में मेरे साथ साझेदारी नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देने और लेने के हिसाब में।”
    reason: λόγος यहाँ सामान्य ‘मामला’ अथवा लेखा-व्यवहार के अर्थ में ‘हिसाब’ सूचित कर सकता है।
lexical_decisions:
- source_word: Οἴδατε
  choice: जानते हो
  rationale: οἶδα की वर्तमान स्थिति दर्शाने वाली सामान्य शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ यह प्रबल विरोध नहीं, बल्कि कथन को आगे बढ़ाने वाला संयोजक है।
- source_word: καὶ ὑμεῖς
  choice: तुम स्वयं भी
  rationale: καί के योगात्मक अर्थ और ὑμεῖς के बल—दोनों को सुरक्षित रखता है।
- source_word: Φιλιππήσιοι
  choice: हे फिलिप्पियो
  rationale: सम्बोधन रूप को स्पष्ट और हिन्दी पत्र-शैली के अनुरूप रखता है।
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: सुसमाचार के आरम्भ में
  rationale: यूनानी अभिव्यक्ति और उसके सम्भावित ऐतिहासिक संकेत को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: मैं मकिदुनिया से निकला
  rationale: मकिदुनिया से प्रस्थान की पूर्ण घटना को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδεμία ... ἐκκλησία
  choice: किसी भी कलीसिया ने ... नहीं
  rationale: निषेध को स्पष्ट, स्वाभाविक हिन्दी संरचना में व्यक्त करता है।
- source_word: ἐκοινώνησεν ... μοι
  choice: मेरे साथ सहभागिता नहीं की
  rationale: κοινωνέω के साझी भागीदारी वाले अर्थ को सुरक्षित रखता है; आर्थिक सन्दर्भ निकटवर्ती वाक्यांश से स्पष्ट होता है।
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: देने और लेने के मामले में
  rationale: वित्तीय साझेदारी के सन्दर्भ में वाक्यांश को समझने योग्य रखता है, जबकि λόγος की लेखा-सम्बन्धी सम्भावना पादटिप्पणी में दी गई है।
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: तुम्हारे सिवा
  rationale: अपवाद और विशिष्टता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘किसी भी कलीसिया’ के साथ मिलकर केवल उन्हीं के होने का बल स्पष्ट रहता है।
