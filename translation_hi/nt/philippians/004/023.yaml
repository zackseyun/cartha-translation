  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: hi
  text: प्रभु यीशु मसीह का अनुग्रह तुम्हारी आत्मा के साथ रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन हस्तलिपियों में: “तुम सबके साथ रहे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह पौलुस की आशीष-वाणी का मानक शब्द है; ‘अनुग्रह’ इसके ईशवैज्ञानिक भार और कृपापूर्ण उपकार के अर्थ को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यीशु के लिए प्रयुक्त उपाधि κύριος का स्वाभाविक और प्रचलित हिन्दी समतुल्य।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु से जुड़ी मसीही उपाधि है; हिन्दी में ‘मसीह’ स्वाभाविक, प्रतिष्ठित और सामान्य पाठकों के लिए परिचित है।
- source_word: μετὰ
  choice: के साथ
  rationale: सम्बन्धकारक के साथ μετά यहाँ साथ या उपस्थिति व्यक्त करता है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: सन्दर्भ फिलिप्पियों की मानवीय आत्मा या सामूहिक आन्तरिक जीवन की ओर संकेत करता है, न कि स्पष्ट रूप से पवित्र आत्मा की ओर।
- source_word: ὑμῶν
  choice: तुम्हारी
  rationale: मूल शब्द बहुवचन है; ‘तुम्हारी’ पूरी मण्डली को सम्बोधित करता है, जबकि ‘आत्मा’ का एकवचन सामूहिक भाव बनाए रखता है।
theological_decisions:
- issue: πνεύματος का आशय मानवीय आत्मा है या पवित्र आत्मा
  choice: मानवीय आत्मा के अर्थ में ‘आत्मा’
  alternative: पवित्र आत्मा के अर्थ में ‘आत्मा’
  rationale: ὑμῶν (‘तुम्हारी’) और पौलुस की समापन आशीष-वाणी का ढाँचा सम्बोधित विश्वासियों की आत्मा/आन्तरिक सत्ता की ओर अधिक स्वाभाविक रूप से संकेत करता है; फिर भी हिन्दी ‘आत्मा’ मूल की संक्षिप्तता बनाए रखता है।
- issue: Χριστοῦ को ‘मसीह’ या ‘ख्रीस्त’ कहना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ उपाधि का बल अभी उपस्थित है, और आधुनिक मानक हिन्दी में ‘मसीह’ अधिक स्वाभाविक तथा व्यापक रूप से बोधगम्य है।
- issue: वचन-पाठ में τοῦ πνεύματος ὑμῶν के स्थान पर πάντων (‘तुम सब’) का पाठांतर
  choice: 'SBLGNT का पाठ: ‘तुम्हारी आत्मा के साथ’'
  alternative: ‘तुम सबके साथ’
  rationale: प्रदत्त मूल पाठ τοῦ πνεύματος ὑμῶν को मुख्य पाठ में रखा गया है; प्राचीन साक्ष्यों में पाया जाने वाला संक्षिप्त पाठ फुटनोट में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारी आत्मा’ मूल के एकवचन πνεύματος और बहुवचन ὑμῶν—अर्थात पूरी मण्डली के सामूहिक आन्तरिक जीवन—दोनों को यथासम्भव सुरक्षित रखता है।
