- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: मेरे लिए आपकी चिन्ता
  rationale: यहाँ φρονεῖν केवल सोचने के बजाय पौलुस के प्रति मनोभाव और व्यावहारिक सरोकार को दर्शाता है।
- source_word: ἐφ’ ᾧ
  choice: वास्तव में
  rationale: पौलुस की उस स्पष्टीकरणात्मक पुष्टि को स्वाभाविक हिन्दी में जोड़ता है कि उनकी चिन्ता पहले भी बनी हुई थी।
- source_word: ἐφρονεῖτε
  choice: आप मेरी चिन्ता करते तो थे
  rationale: पहले φρονεῖν के साथ अर्थगत संगति रखते हुए निरन्तर सरोकार तथा आगे आने वाले विरोधसूचक वाक्य का भाव प्रकट करता है।
