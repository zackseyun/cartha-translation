  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: hi
  text: पर मुझे प्रभु में बहुत आनन्द हुआ कि अब अन्ततः मेरे प्रति आपकी परवाह फिर से पनप उठी है[a]। वास्तव में, आप मेरी परवाह करते तो थे[b], पर आपको अवसर नहीं मिला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे लिए आपकी सोच फिर से खिल उठी है”; यूनानी क्रिया का अर्थ फिर से पनपना या खिलना है और यहाँ आपकी परवाह के फिर से प्रकट या सक्रिय होने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “आप मेरे विषय में सोचते तो थे”; यूनानी क्रिया का अर्थ किसी के विषय में सोचना, उसके प्रति मन रखना, या उसकी परवाह करना हो सकता है।
    reason: lexical_alternative
