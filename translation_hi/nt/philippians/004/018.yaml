id: PHP.4.18
reference: Philippians 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: hi
  text: पर मुझे सब कुछ मिल गया है[a], और मेरे पास बहुतायत है। इपफ्रुदीतुस से तुम्हारी ओर से आई वस्तुएँ पाकर मैं पूरी तरह से भरपूर हूँ—वे सुगन्धित महक, ग्रहणयोग्य बलिदान, और परमेश्वर को भानेवाला बलिदान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “मेरे पास सब कुछ पूरा है” अथवा “मुझे पूरा भुगतान मिल गया है।”
    reason: ἀπέχω में सामान्य ‘प्राप्त करना’ के साथ पूर्ण रूप से हाथ में होने या रसीद/भुगतान की पुष्टि करने का व्यावसायिक भाव भी सम्भव है।
lexical_decisions:
- source_word: ἀπέχω
  choice: मुझे ... मिल गया है
  rationale: यह क्रिया यहाँ मिली हुई सहायता को अपने पास पूर्ण रूप से होने या प्राप्त कर लेने का भाव देती है। मुख्य पाठ में सहज हिन्दी रखी गई है और संभावित हिसाबी अर्थ को पादटिप्पणी में दिया गया है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक भाव सुरक्षित रहता है और यह फिलिप्पियों द्वारा भेजी गई पूरी सहायता की ओर संकेत करता है।
- source_word: περισσεύω
  choice: मेरे पास बहुतायत है
  rationale: यह आवश्यकता से अधिक प्रचुरता व्यक्त करता है और आधुनिक हिन्दी में पौलुस के पर्याप्त से बढ़कर होने के भाव को स्पष्ट करता है।
- source_word: πεπλήρωμαι
  choice: मैं पूरी तरह भर गया हूँ
  rationale: पूर्णकालिक रूप प्राप्त उपहार के परिणामस्वरूप वर्तमान भरपूरी की दशा पर बल देता है। यह अनुवाद मूल की ‘भरने’ वाली छवि को बनाए रखता है।
- source_word: δεξάμενος
  choice: पाकर
  rationale: कृदन्त बताता है कि पौलुस किस प्रकार भरपूर हुआ; संक्षिप्त हिन्दी रूप वाक्य के प्रवाह में स्वाभाविक है।
- source_word: παρὰ Ἐπαφροδίτου
  choice: इपफ्रुदीतुस से
  rationale: इपफ्रुदीतुस उस तत्काल माध्यम या व्यक्ति के रूप में सामने आता है जिससे पौलुस ने वस्तुएँ प्राप्त कीं; अगला वाक्यांश उनके वास्तविक प्रेषकों को स्पष्ट करता है।
- source_word: τὰ παρ’ ὑμῶν
  choice: तुम्हारी भेजी हुई वस्तुएँ
  rationale: यह फिलिप्पियों की ओर से आई सहायता को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भेजी हुई’ सन्दर्भ से स्पष्ट है, यद्यपि यूनानी में केवल ‘तुम्हारी ओर से वस्तुएँ’ है।
- source_word: ὀσμὴν εὐωδίας
  choice: सुगन्धित धूप
  rationale: शाब्दिक अर्थ ‘सुगन्ध की महक’ है। हिन्दी बाइबलीय उपासना-भाषा में ‘सुगन्धित धूप’ बलिदानी सुगन्ध का बोध कराती है, पर इसे अगली संज्ञाओं के साथ रूपकात्मक विधान के रूप में रखा गया है।
- source_word: θυσίαν δεκτήν
  choice: ग्रहणयोग्य बलिदान
  rationale: यह उपहार को परमेश्वर द्वारा स्वीकार किए जाने योग्य बलिदानी उपासना के रूप में प्रस्तुत करता है और मूल की आराधनात्मक छवि को बनाए रखता है।
- source_word: εὐάρεστον τῷ θεῷ
  choice: परमेश्वर को प्रसन्न करनेवाली भेंट
  rationale: विशेषण का आशय परमेश्वर को भाने या प्रसन्न करने से है। ‘भेंट’ जोड़कर हिन्दी में समानान्तर सूची स्पष्ट होती है और उसी उपहार की ओर संकेत बना रहता है।
theological_decisions:
- issue: फिलिप्पियों की आर्थिक सहायता के लिए बलिदानी भाषा
  choice: उपहार को ‘सुगन्धित धूप, ग्रहणयोग्य बलिदान और परमेश्वर को प्रसन्न करनेवाली भेंट’ के रूप में बनाए रखना
  alternative: रूपक को सामान्य धन्यवाद में समतल कर देना, अथवा केवल ‘परमेश्वर द्वारा प्रसन्नतापूर्वक स्वीकार की गई भेंट’ कहना
  rationale: पौलुस जानबूझकर मन्दिर और बलिदान से जुड़ी भाषा द्वारा आर्थिक सहायता को उपासना के रूप में चित्रित करता है। सुगन्ध, बलिदान और परमेश्वर की प्रसन्नता—तीनों तत्व सुरक्षित रखने से धार्मिक तनाव और रूपक की शक्ति बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘बहुतायत’, ‘ग्रहणयोग्य’ और ‘बलिदान’ मूल की संक्षिप्त तथा आराधनात्मक गंभीरता बनाए रखते हैं। मुख्य पाठ का [a] चिह्न सम्बद्ध पादटिप्पणी से मेल खाता है।
