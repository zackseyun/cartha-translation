base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: hi
  text: मैं दीन दशा में रहना भी जानता हूँ और भरपूरी में रहना भी जानता हूँ। हर परिस्थिति और सब बातों में मैंने यह रहस्य सीख लिया है[a]—भरपेट रहना और भूखा रहना, भरपूरी में रहना और अभाव में रहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मुझे दीक्षा दी गई है।” पौलुस यहाँ किसी रहस्य को जानने के लिए दीक्षा दिए जाने की भाषा का रूपक के रूप में प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: मैं ... रहना जानता हूँ
  rationale: इसके साथ आए infinitives व्यावहारिक और अनुभव से प्राप्त योग्यता व्यक्त करते हैं; यह हिन्दी में स्वाभाविक रूप से ‘रहना जानता हूँ’ से प्रकट होती है।
- source_word: ταπεινοῦσθαι
  choice: दीन दशा में रहना
  rationale: यह परिस्थितियों में नीचे किए जाने या निम्न अवस्था में होने का भाव रखता है; ‘दीन दशा’ इसे केवल मन की नम्रता तक सीमित नहीं करती।
- source_word: περισσεύειν
  choice: भरपूरी में रहना
  rationale: यह आवश्यकता से अधिक होने का व्यापक भाव और दोनों प्रयोगों की समानता बनाए रखता है, बिना इसे केवल आर्थिक समृद्धि तक सीमित किए।
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: हर परिस्थिति और सब बातों में
  rationale: दोनों यूनानी पदों की व्यापक, बलाघाती समानांतरता को अलग-अलग रखते हुए सहज हिन्दी देता है।
- source_word: μεμύημαι
  choice: मैंने यह रहस्य सीख लिया है
  rationale: मूल क्रिया दीक्षा देकर किसी गुप्त बात से परिचित कराने की भाषा का रूपकात्मक प्रयोग करती है; मुख्य पाठ में अर्थ स्पष्ट है और शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
- source_word: χορτάζεσθαι
  choice: तृप्त रहना
  rationale: भूखा रहने के विपरीत भोजन से भर जाने का भाव व्यक्त करता है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: πεινᾶν
  choice: भूखा रहना
  rationale: यह भोजन की कमी को सीधे व्यक्त करता है और ‘तृप्त रहना’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ὑστερεῖσθαι
  choice: अभाव में रहना
  rationale: कमी और वंचना का व्यापक अर्थ रखता है तथा इसे केवल धन की कमी तक सीमित नहीं करता।
