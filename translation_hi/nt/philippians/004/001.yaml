id: PHP.4.1
reference: Philippians 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: hi
  text: इसलिए, मेरे प्रिय भाइयो[a], जिनके लिए मेरा मन तरसता है—मेरे आनंद और मेरे मुकुट[b]—प्रभु में इसी प्रकार दृढ़ बने रहो, मेरे प्रियो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ पुल्लिंग रूप ‘भाइयो’ है; संदर्भ में पौलुस मण्डली के सभी साथी विश्वासियों को संबोधित कर रहा है, केवल पुरुषों को नहीं।
    reason: cultural_note
  - marker: b
    text: या ‘विजय-मुकुट’; यूनानी शब्द उस पुष्पमुकुट को दर्शाता है जो किसी विजेता को पुरस्कार में दिया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले विचार से निकलने वाले निष्कर्ष और आगे दिए गए आग्रह, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी में प्रयुक्त पुल्लिंग संबोधन को बनाए रखता है; पूरी मण्डली के समावेशी संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀγαπητοὶ / ἀγαπητοί
  choice: प्रिय / मेरे प्रियो
  rationale: पौलुस के स्नेह और मूल पाठ में इस शब्द की पुनरावृत्ति, दोनों को बनाए रखता है। वाक्य के अंत में संबोधन को स्वाभाविक बनाने के लिए ‘मेरे प्रियो’ रखा गया है।
- source_word: ἐπιπόθητοι
  choice: जिनसे मिलने की मुझे बड़ी लालसा है
  rationale: गहरी अभिलाषा के भाव को ‘अभिलषित’ जैसे अस्वाभाविक विशेषण की अपेक्षा सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: χαρὰ
  choice: आनंद
  rationale: यह मानक और स्वाभाविक शब्द है तथा इस बात को बनाए रखता है कि फिलिप्पी के विश्वासी स्वयं पौलुस के आनंद हैं।
- source_word: στέφανος
  choice: मुकुट
  rationale: हिन्दी में संक्षिप्त और परिचित रूपक है; विजेता को दिए जाने वाले पुष्पमुकुट का विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: क्रियाविशेषण की स्पष्टता बनाए रखता है और पिछले उपदेश के अनुरूप दृढ़ बने रहने की रीति की ओर संकेत करता है।
- source_word: στήκετε
  choice: दृढ़ बने रहो
  rationale: आज्ञार्थक आग्रह और लगातार अटल रहने, दोनों अर्थों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: पौलुस के प्रचलित संबंधपरक/स्थानसूचक वाक्यांश को बिना अनावश्यक व्याख्या के निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ἀδελφοί का प्रतिनिधिक दायरा
  choice: मुख्य पाठ में पुल्लिंग संबोधन ‘भाइयो’ रखा गया है और पादटिप्पणी में स्पष्ट किया गया है कि संदर्भ में पूरी विश्वासी मण्डली अभिप्रेत है।
  alternative: ‘भाइयो और बहनो’ या ‘विश्वासी जनो’
  rationale: यह यूनानी रूप की लिंग-संबंधी विशेषता को सुरक्षित रखते हुए उसके संदर्भगत समावेशी दायरे को भी स्पष्ट करता है।
- issue: ἐν κυρίῳ का संबंधपरक अर्थ
  choice: ‘प्रभु में’
  alternative: ‘प्रभु के साथ एकता में’
  rationale: शाब्दिक और पौलुसी वाक्यांश की अर्थगत व्यापकता बनाए रखी गई है; अधिक व्याख्यात्मक विकल्प किसी एक संबंधपरक अर्थ को जरूरत से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मण्डलीय पाठ के योग्य हिन्दी अपनाई गई है। संबोधनों की भावपूर्ण पुनरावृत्ति सुरक्षित रखी गई है। ‘जिनसे मिलने की मुझे बड़ी लालसा है’ स्रोत के स्नेहपूर्ण भाव को सामान्य पाठक के लिए सहज बनाता है; डैश परस्पर जुड़े संबोधनों को स्पष्ट करते हैं।
