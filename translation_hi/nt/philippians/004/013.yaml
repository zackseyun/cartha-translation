  yaml_path: translation/nt/philippians/004/013.yaml
  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: hi
  text: जो मुझे सामर्थ्य देता है, उसके द्वारा मैं सब कुछ कर सकता हूँ[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मैं हर परिस्थिति में समर्थ हूँ’ भी हो सकता है। प्रसंग में भाव हर तरह की परिस्थिति में समर्थ होने का है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘जो मुझे सामर्थ्य देता है’ है; इस पद में मसीह का नाम स्पष्ट रूप से नहीं आया है, यद्यपि प्रसंग उसी की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: यह यूनानी नपुंसकलिंग बहुवचन कर्मकारक की व्यापकता बनाए रखता है। प्रसंग में पौलुस हर प्रकार की परिस्थिति—अभाव और भरपूरी—की बात कर रहा है, पर मुख्य पाठ में अर्थ को केवल ‘हर परिस्थिति’ तक सीमित नहीं किया गया।
- source_word: ἰσχύω
  choice: मैं ... कर सकता हूँ
  rationale: क्रिया सामर्थ्य या क्षमता व्यक्त करती है। आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है और केवल शारीरिक बल का अर्थ नहीं देता।
- source_word: ἐν
  choice: के द्वारा
  rationale: व्यक्तिवाचक कृदन्त के साथ यहाँ ἐν सामर्थ्य के माध्यम या आधार को व्यक्त करता है; ‘के द्वारा’ हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से प्रकट करता है।
- source_word: τῷ ἐνδυναμοῦντί με
  choice: जो मुझे सामर्थ्य देता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त को संबंधवाचक वाक्यांश से व्यक्त किया गया है। इससे निरंतर सामर्थ्य देने का भाव रहता है और यूनानी में अनुपस्थित किसी नाम या उपाधि को मुख्य पाठ में नहीं जोड़ा जाता।
theological_decisions:
- issue: ‘जो मुझे सामर्थ्य देता है’ का निहित संदर्भ
  choice: मुख्य पाठ में व्यक्ति का नाम जोड़े बिना यूनानी की संज्ञात्मक अभिव्यक्ति बनाए रखना
  alternative: ‘मसीह के द्वारा, जो मुझे सामर्थ्य देता है’
  rationale: निकट और व्यापक प्रसंग उस व्यक्ति की पहचान मसीह यीशु के रूप में करने की ओर संकेत करता है, पर इस पद के SBLGNT यूनानी पाठ में ‘मसीह’ स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ वही कहता है जो मूल में स्पष्ट है और संदर्भगत पहचान को टिप्पणी में बताता है।
- issue: ‘सब कुछ’ की सीमा
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति रखना और पादटिप्पणी में प्रसंगगत अर्थ स्पष्ट करना
  alternative: ‘हर परिस्थिति का सामना कर सकता हूँ’
  rationale: पद 11–12 का प्रसंग अभाव, भरपूरी, भूख और तृप्ति जैसी परिस्थितियों में संतुष्ट रहने की क्षमता बताता है। फिर भी πάντα स्वयं व्यापक है; अतः अनुवाद न तो इसे असीम उपलब्धियों का दावा बनाता है, न मूल की व्यापकता को चुपचाप संकुचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल-सुलभ रचना। ‘सामर्थ्य देता है’ धार्मिक हिन्दी में परिचित होने के साथ सामान्य पाठक के लिए स्पष्ट है। ‘सब कुछ कर सकता हूँ’ की संभावित अतिव्यापक समझ को प्रसंगगत पादटिप्पणी संतुलित करती है।
