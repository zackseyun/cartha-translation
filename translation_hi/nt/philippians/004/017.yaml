  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: hi
  text: यह नहीं कि मैं भेंट की खोज में हूँ, बल्कि मैं उस फल की खोज में हूँ जो तुम्हारे लेखे में बढ़ता जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: लालसा रखता हूँ
  rationale: यह क्रिया सक्रिय चाह या अभिलाषा व्यक्त करती है। दोनों बार एक ही पदावली रखकर यूनानी वाक्य का दोहराव और विरोध सुरक्षित रखा गया है।
- source_word: δόμα
  choice: भेंट
  rationale: संदर्भ में यह फिलिप्पियों द्वारा पौलुस को दी गई वस्तुगत सहायता है। ‘भेंट’ सीधा और स्वाभाविक है तथा मूल में न होने वाला ‘ही’ नहीं जोड़ता।
- source_word: καρπὸν
  choice: फल
  rationale: ‘फल’ परिणाम या उपज के रूपक को बनाए रखता है और आगे आने वाली लेखे की व्यावसायिक भाषा के साथ मूल का रूपकीय तनाव सुरक्षित रखता है।
- source_word: πλεονάζοντα
  choice: बढ़ता जाता है
  rationale: वर्तमान कृदंत निरंतर बढ़ने या प्रचुर होने का भाव देता है; ‘बढ़ता जाता है’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς λόγον ὑμῶν
  choice: तुम्हारे लेखे में
  rationale: फिलिप्पियों 4:15 के संदर्भ में λόγος हिसाब या खाते की भाषा है। ‘तुम्हारे लेखे में’ इस व्यावसायिक रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: यह नहीं कि ... बल्कि
  rationale: यह रचना स्पष्टीकरण और विरोध प्रकट करती है; हिन्दी में यही उसका स्वाभाविक समतुल्य है।
