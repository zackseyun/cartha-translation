  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: hi
  text: हमारे परमेश्वर और पिता की महिमा युगानुयुग[a] होती रहे। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “युगों के युगों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δὲ समापन की स्तुतिवाणी की ओर हल्का संक्रमण दिखाता है। हिन्दी में प्रसंग और वाक्य-विन्यास ही इस संबंध को स्वाभाविक रूप से व्यक्त करते हैं; ‘अब’ जोड़ने से मूल में निहित न होने वाला कालगत भाव आ सकता है।
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: हमारे परमेश्वर और पिता
  rationale: दोनों संज्ञाएँ एक ही व्यक्ति को सूचित करने वाली संयुक्त अभिव्यक्ति हैं, और ‘हमारे’ स्वाभाविक रूप से दोनों पर लागू होता है।
- source_word: ἡ δόξα
  choice: महिमा ... होती रहे
  rationale: यूनानी वाक्य में क्रिया नहीं है। हिन्दी की स्तुतिपरक शैली में ‘होती रहे’ जोड़ना कामना और निरंतर स्तुति का भाव स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल तथ्य-वचन बना देने के।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह प्रचलित, गरिमापूर्ण हिन्दी मुहावरा अनंत काल की अवधि व्यक्त करता है और मूल की ‘युगों के युगों तक’ संरचना की प्रतिध्वनि भी बनाए रखता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: मसीही हिन्दी में स्थापित उपासना-संबंधी रूप रखा गया है; यह दृढ़ पुष्टि का कार्य करता है।
theological_decisions:
- issue: क्रियारहित स्तुतिवाक्य में निहित क्रिया की पूर्ति
  choice: महिमा ... होती रहे
  alternative: महिमा है / महिमा हो
  rationale: मूल यूनानी क्रियारहित है और ‘हो’, ‘है’ अथवा ‘उसी की है’ जैसी पूर्तियों की व्याकरणिक संभावना छोड़ता है। ‘होती रहे’ हिन्दी में स्तुतिपरक कामना को सहज बनाता है और εἰς τοὺς αἰῶνας τῶν αἰώνων की निरंतरता के साथ मेल खाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण उपासना-रजिस्टर। ‘युगानुयुग’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल मुहावरे की काव्यात्मक ऊँचाई बनाए रखता है।
