  rationale: यूनानी रूप जारी अनुरूपता को व्यक्त करता है, जबकि उसका व्याकरणिक वाच्य हिन्दी में पूरी तरह निश्चित करना कठिन है। मुख्य पाठ स्वाभाविक हिन्दी में प्रक्रिया को रखता है और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
