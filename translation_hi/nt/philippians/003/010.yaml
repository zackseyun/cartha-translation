  rationale: सम्प्रदान कारक को συμμορφιζόμενος के पूरक के रूप में व्यक्त करते हुए ध्यान मसीह की मृत्यु से अनुरूपता पर बनाए रखता है।
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ का अर्थ
  choice: मसीह के दुखों में वास्तविक सहभागिता
  alternative: उसके दुखों की संगति अथवा उनके साथ अधिक अमूर्त संबंध
