  rationale: वर्तमान कृदन्त की जारी प्रक्रिया और मृत्यु के नमूने के अनुसार ढलते जाने—दोनों भावों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τῷ θανάτῳ αὐτοῦ
