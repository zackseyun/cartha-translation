source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: hi
  text: भाइयो[a], मेरे अनुकरण करनेवालों में शामिल हो जाओ, और उन लोगों को ध्यान से देखते रहो जो इसी तरह चलते हैं, जैसा कि हम तुम्हारे लिए एक आदर्श हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयो और बहनो”; यूनानी रूप पुल्लिंग बहुवचन है, पर सम्भवतः यह सम्बोधन पूरी मण्डली से है।
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: तुम सब मिलकर मेरे अनुकरण करनेवाले बनो
  rationale: ‘तुम सब मिलकर’ Συμμιμηταί के सामूहिक सह-अनुकरण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बनो’ γίνεσθε की आज्ञार्थक शक्ति को बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन का यूनानी रूप पुल्लिंग बहुवचन है। मुख्य पाठ में उसी रूप को रखा गया है, जबकि पूरी मण्डली के सम्भावित समावेश को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: σκοπεῖτε
  choice: ध्यान दो
  rationale: यह क्रिया सावधानी से देखते रहने और गौर करने का अर्थ देती है; ‘ध्यान दो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οὕτω περιπατοῦντας
  choice: जो इसी तरह चलते हैं
  rationale: ‘चलते हैं’ पौलुस के जीवन-आचरण वाले रूपक को सुरक्षित रखता है, और ‘इसी तरह’ οὕτω को व्यक्त करता है।
- source_word: τύπον
  choice: नमूना
  rationale: यहाँ शब्द अनुसरण योग्य आदर्श या प्रतिरूप को दर्शाता है; ‘नमूना’ इस अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: ἡμᾶς
  choice: हम
  rationale: यूनानी सर्वनाम बहुवचन है, इसलिए इसे एकवचन ‘मैं’ में नहीं बदला गया।
theological_decisions:
- issue: ἀδελφοί का समावेशी आशय
  choice: मुख्य पाठ में ‘भाइयो’ और पादटिप्पणी में पूरी मण्डली के सम्भावित समावेश का स्पष्टीकरण
  alternative: मुख्य पाठ में ‘भाइयो और बहनो’
  rationale: यह चयन यूनानी के व्याकरणिक पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, साथ ही इस सम्भावना को नहीं छिपाता कि सम्बोधन पूरी मण्डली से है।
- issue: अनुकरण का सामूहिक स्वरूप
  choice: ‘तुम सब मिलकर मेरे अनुकरण करनेवाले बनो’
  alternative: ‘मेरा अनुकरण करो’
  rationale: सिर्फ व्यक्तिगत अनुकरण के बजाय Συμμιμηταί में निहित साथ मिलकर अनुकरण करने के भाव को स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चलते हैं’ मूल के जीवन-आचरण संबंधी रूपक को बनाए रखता है; ‘तुम्हारे सामने हम एक नमूना हैं’ बहुवचन ἡμᾶς और τύπος के आदर्शात्मक भाव को सुरक्षित रखता है।
