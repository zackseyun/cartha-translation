  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘तो हम हैं’ यूनानी के जोर को व्यक्त करता है। ‘खतना किए हुए लोग’ अमूर्त यूनानी पद के सामुदायिक प्रयोग को हिंदी में स्पष्ट करता है, और डैश के बाद संबंधवाचक उपवाक्य को पठनीय ढंग से खोला गया है।
