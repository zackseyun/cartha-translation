  text: क्योंकि खतना किए हुए लोग तो हम हैं—हम, जो परमेश्वर की आत्मा के द्वारा आराधना करते हैं[a], मसीह[b] यीशु में गर्व करते हैं और शरीर पर भरोसा नहीं रखते[c]।
  philosophy: optimal-equivalence
  footnotes:
