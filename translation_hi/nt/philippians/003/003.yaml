    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: खतना किए हुए लोग
  rationale: यूनानी में भाववाचक संज्ञा ‘खतना’ लोगों के समुदाय के लिए प्रयुक्त है। हिंदी में यह रूप स्वाभाविक रहते हुए पौलुस के इस दावे को बनाए रखता है कि वास्तविक वाचा-समुदाय केवल शारीरिक चिह्न से परिभाषित नहीं होता।
- source_word: πνεύματι θεοῦ
  choice: परमेश्वर के आत्मा के द्वारा
  rationale: यह SBLGNT पाठ के अनुसार परमेश्वर के आत्मा को आराधना का माध्यम या सामर्थ्य बताता है; इसे केवल मानवीय आंतरिक भावना तक सीमित नहीं किया गया।
- source_word: λατρεύοντες
  choice: आराधना करते हैं
  rationale: यह क्रिया परमेश्वर को दी जाने वाली धार्मिक सेवा और उपासना को व्यक्त करती है; ‘आराधना’ आधुनिक हिंदी में सहज और गरिमापूर्ण है।
- source_word: καυχώμενοι
  choice: गर्व करते हैं
  rationale: 'यह पौलुस द्वारा बताए गए गर्व या भरोसे के आधारों का तीखा विरोध बनाए रखता है: गर्व मसीह यीशु पर है, मानवीय उपलब्धियों पर नहीं।'
- source_word: Χριστῷ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में अर्थवान है; ‘मसीह’ उसके अभिषिक्त राजा के भाव को बनाए रखता है।
- source_word: σαρκί
  choice: शरीर
  rationale: ‘शरीर’ मूल रूपक को सुरक्षित रखता है। निकटवर्ती संदर्भ में इसका आशय खतना, वंश, धार्मिक दर्जे और मानवीय योग्यताओं जैसे बाहरी या मानवीय भरोसे के आधारों से है।
- source_word: πεποιθότες
  choice: भरोसा नहीं रखते
  rationale: यह सिद्ध या स्थिर निर्भरता का भाव देता है और हिंदी में ‘शरीर पर भरोसा’ के साथ स्वाभाविक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी के लिए इस पद द्वारा दिया गया स्पष्टीकरण स्पष्ट करता है।
theological_decisions:
- issue: इस पद में σάρξ का अर्थ
  choice: शरीर—विशेषकर शारीरिक और मानवीय धार्मिक योग्यता, जैसे खतना, वंश और दर्जा
  alternative: पापी स्वभाव या भीतर सक्रिय नैतिक पाप-सिद्धांत
  rationale: फिलिप्पियों 3 के अगले पदों में पौलुस खतना, वंश, व्यवस्था और धार्मिक उपलब्धियों को गिनाता है; इसलिए यहाँ मानवीय पहचान और योग्यता पर भरोसा मुख्य है, यद्यपि ‘शरीर’ मूल रूपक की व्यापकता बनाए रखता है।
- issue: πνεύματι θεοῦ का बल
  choice: परमेश्वर का आत्मा आराधना का माध्यम या क्षेत्र है
  alternative: मानवीय आत्मा में आराधना करना या केवल आत्मिक ढंग से परमेश्वर की आराधना करना
  rationale: SBLGNT के θεοῦ पाठ में वाक्यांश स्वाभाविक रूप से परमेश्वर के आत्मा की ओर संकेत करता है और बाहरी धार्मिक चिह्न के साथ पौलुस के विरोध को पुष्ट करता है।
- issue: ‘खतना’ के सामुदायिक दावे का रूप
  choice: ‘खतना किए हुए लोग तो हम हैं’
  alternative: ‘खतना हम हैं’ या ‘सच्चा खतना हम हैं’
  rationale: पहला विकल्प हिंदी में अर्थ स्पष्ट करता है, जबकि ‘सच्चा’ जोड़कर मूल में निहित निष्कर्ष को अनावश्यक रूप से प्रत्यक्ष नहीं बनाता।
