id: PHP.3.20
reference: Philippians 3:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि हमारी नागरिकता स्वर्ग में है[a], और वहीं से हम उद्धारकर्ता—प्रभु यीशु मसीह—की उत्सुकता से प्रतीक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “स्वर्गों में”; “नागरिकता” का अर्थ “नागरिक समुदाय” भी हो सकता है।
    reason: यूनानी ἐν οὐρανοῖς बहुवचन है, और πολίτευμα व्यक्ति की नागरिक स्थिति के साथ उस राजनीतिक समुदाय का भी बोध करा सकता है जिससे वह संबंधित है।
lexical_decisions:
- source_word: πολίτευμα
  choice: नागरिकता
  rationale: यह शब्द नागरिक या राजनीतिक समुदाय से संबंध और अधिकार का भाव रखता है। संदर्भ में पृथ्वी-केंद्रित पहचान के विपरीत विश्वासियों की स्वर्गीय नागरिकता प्रमुख है; ‘नागरिकता’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी में बहुवचन है, पर आधुनिक हिन्दी में इस दिव्य लोक के लिए ‘स्वर्ग में’ अधिक स्वाभाविक है; शाब्दिक रूप का संकेत पादटिप्पणी में दिया गया है।
- source_word: ὑπάρχει
  choice: है
  rationale: क्रिया वर्तमान वास्तविक अस्तित्व बताती है; हिन्दी में ‘है’ इसका स्वाभाविक और पर्याप्त समतुल्य है।
- source_word: ἐξ οὗ
  choice: वहीं से
  rationale: यह स्वर्ग की ओर लौटकर उस स्थान को दर्शाता है जहाँ से उद्धारकर्ता आएगा। ‘वहीं से’ स्थानिक संबंध और बल दोनों को सहज हिन्दी में रखता है।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह σωτήρ का प्रचलित, अर्थपूर्ण और मसीह-संबंधी भार को बनाए रखने वाला हिन्दी रूप है।
- source_word: ἀπεκδεχόμεθα
  choice: उत्सुकता से प्रतीक्षा करते हैं
  rationale: यह संयुक्त क्रिया निरंतर, आशापूर्ण और आतुर प्रतीक्षा व्यक्त करती है; चुना हुआ वाक्यांश इन आयामों को स्वाभाविक हिन्दी में रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: नए नियम के मसीह-संबंधी प्रयोग में ‘प्रभु’ प्रतिष्ठित और प्रसंगानुकूल हिन्दी समतुल्य है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की पदवी को बनाए रखता है। हिन्दी में ‘मसीह’ स्वयं पदवी के रूप में स्थापित है और ‘क्राइस्ट’ की अपेक्षा अर्थ तथा बाइबिलीय परंपरा दोनों को बेहतर रखता है।
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν में Χριστόν का अनुवाद
  choice: प्रभु यीशु मसीह
  alternative: प्रभु यीशु ख्रीष्ट/क्राइस्ट; प्रभु यीशु, जो मसीह हैं
  rationale: यूनानी में पदवी के पहले अलग निश्चित उपपद नहीं है। हिन्दी का पारंपरिक और स्वाभाविक ‘यीशु मसीह’ पदवी को सुरक्षित रखता है, जबकि अतिरिक्त ‘वह मसीह’ जोड़ना मूल की व्याकरणिक अस्पष्टता को अनावश्यक रूप से स्पष्ट कर देता।
- issue: σωτῆρα और κύριον Ἰησοῦν Χριστόν का संबंध
  choice: ‘उद्धारकर्ता’ के बाद समानाधिकरण के रूप में ‘प्रभु यीशु मसीह’
  alternative: ‘एक उद्धारकर्ता अर्थात् प्रभु यीशु मसीह’
  rationale: मूल में σωτῆρα के बाद κύριον Ἰησοῦν Χριστόν उसी व्यक्ति की पहचान कराता है। अल्पविराम इसे स्पष्ट करता है, पर ‘अर्थात्’ जैसा व्याख्यात्मक शब्द नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘क्योंकि’ γάρ को पिछले संदर्भ से जोड़ता है; ‘हमारी नागरिकता’ को आरंभ में रखकर यूनानी के विषय-विन्यास का बल सुरक्षित किया गया है।
