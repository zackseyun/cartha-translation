    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: कि किसी तरह
  rationale: यह पौलुस की लक्ष्य की ओर विनम्र और आकांक्षापूर्ण अभिव्यक्ति को बनाए रखता है तथा यह स्पष्ट नहीं करता कि उसे परमेश्वर की प्रतिज्ञा पर संदेह था।
- source_word: καταντήσω
  choice: मैं ... पहुँच सकूँ
  rationale: क्रिया किसी लक्ष्य या परिणति तक पहुँचने का भाव देती है; संभावनार्थक रूप यूनानी के सब्जंक्टिव का स्वाभाविक हिन्दी रूप है।
- source_word: εἰς
  choice: तक
  rationale: लक्ष्य तक पहुँचने की हिन्दी अभिव्यक्ति में ‘तक’ स्वाभाविक है और गंतव्य की ओर गति का भाव बनाए रखता है।
- source_word: ἐξανάστασιν
  choice: जी उठने
  rationale: यह पुनरुत्थान का सामान्य, स्पष्ट और आधुनिक हिन्दी रूप है; असामान्य यूनानी संज्ञा की ‘बाहर उठने’ वाली बनावट को मुख्य पाठ में कृत्रिम रूप से नहीं थोपा गया।
- source_word: τὴν ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह यूनानी वाक्यांश का स्वाभाविक और अर्थपूर्ण हिन्दी रूप है तथा ‘मृतकों के बीच से बाहर’ का भाव सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἐξανάστασις को सामान्य ἀνάστασις से तीखे रूप में अलग दिखाकर किसी विशेष पुनरुत्थान का संकेत दिया जाए?
  choice: मुख्य पाठ में ‘मरे हुओं में से जी उठने’ रखा गया।
  alternative: ‘मरे हुओं के बीच से बाहर जी उठने’ या ‘बाहर-पुनरुत्थान’
  rationale: असामान्य संज्ञा मृतकों में से पुनरुत्थान का स्पष्ट संकेत देती है, पर केवल उसके रूप के आधार पर किसी विशिष्ट क्रम या अलग प्रकार के पुनरुत्थान का सिद्धांत स्थापित करना उचित नहीं। सम्भावित विशेष बल को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुनरुत्थान’ की अपेक्षा ‘जी उठना’ साधारण पाठक के लिए अधिक सीधा है, जबकि पादटिप्पणी यूनानी शब्द की असामान्य ‘बाहर’ वाली छाया को सुरक्षित रखती है।
