lexical_decisions:
- source_word: Βλέπετε
  choice: से सावधान रहो
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया यहाँ तत्काल और लगातार सतर्क रहने की चेतावनी देती है। यूनानी में इसकी तीन बार पुनरावृत्ति है, इसलिए हिन्दी में भी वही आवृत्ति रखी गई है।
- source_word: τοὺς κύνας
  choice: कुत्तों
  rationale: मूल का कठोर रूपक बिना व्याख्यात्मक विशेषण जोड़े ज्यों का त्यों रखा गया है।
- source_word: τοὺς κακοὺς ἐργάτας
  choice: बुरे काम करने वालों
  rationale: यह κακούς के नैतिक नकारात्मक भाव और ἐργάτας के कार्य करने वाले व्यक्तियों के सामान्य अर्थ—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν κατατομήν
  choice: उस अंग-भंग
  rationale: κατατομή का शाब्दिक और अपमानसूचक भाव ‘काटना/अंग-भंग’ है। ‘अंग-भंग’ अगले पद के περιτομή (‘खतना’) के साथ जानबूझकर किए गए तीखे शब्द-विरोध को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: आसपास के खतना-संबंधी प्रसंग में κατατομήν का अनुवाद
  choice: उस अंग-भंग
  alternative: अंग काटने वाले; झूठा खतना
  rationale: पौलुस सामान्य ‘खतना’ शब्द नहीं, बल्कि उससे मिलता-जुलता अपमानसूचक प्रतिशब्द प्रयोग करता है। अमूर्त संज्ञा को बनाए रखने से मूल की कठोरता और अगले पद के साथ उसका शब्द-विरोध सुरक्षित रहता है, बिना यह तय किए कि इसे व्यक्तियों के लिए ही समझना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। तीन समान चेतावनियों की लय मूल यूनानी के बलाघात को बनाए रखती है। ‘कुत्तों’ और ‘अंग-भंग’ की कठोरता जानबूझकर नरम नहीं की गई है।
