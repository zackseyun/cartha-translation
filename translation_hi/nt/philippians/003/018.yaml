  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: hi
  text: क्योंकि बहुत-से लोग, जिनके विषय में मैं तुमसे बार-बार कहता था और अब रोते हुए भी कहता हूँ, मसीह के क्रूस के शत्रु बनकर चलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और अनिर्दिष्ट बड़ी संख्या को दर्शाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: περιπατοῦσιν
  choice: ऐसे चलते हैं
  rationale: क्रिया जीवन-चाल के लिए रूपक है। ‘चलते हैं’ मूल रूपक को बनाए रखता है, जबकि ‘ऐसे’ आगे आने वाले विधेय ‘शत्रु हैं’ से स्वाभाविक संबंध बनाता है।
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: मैं तुमसे बार-बार कहता था
  rationale: πολλάκις और अपूर्णकाल ἔλεγον मिलकर अतीत में दोहराई गई क्रिया व्यक्त करते हैं।
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: अब रोते हुए भी कहता हूँ
  rationale: वर्तमान कृदन्त κλαίων को उसी समय रोते हुए बोलने की क्रिया के रूप में प्रत्यक्ष रखा गया है; καί का बल ‘भी’ से व्यक्त है।
- source_word: ἐχθροὺς
  choice: शत्रु
  rationale: यह प्रबल विरोध को दर्शाने वाला सीधा और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: σταυροῦ
  choice: क्रूस
  rationale: यह यीशु की क्रूस-मृत्यु और उससे जुड़ी धार्मिक सार्थकता का स्थापित हिन्दी पद है।
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: यहाँ Χριστός उपाधि के रूप में स्वाभाविक है; ‘मसीह’ उसके अभिषिक्त जन के अर्थ और प्रचलित हिन्दी बाइबलीय प्रयोग दोनों को बनाए रखता है।
theological_decisions:
- issue: τοῦ Χριστοῦ में Χριστός को उपाधि या नाम-जैसे पद के रूप में प्रस्तुत करना
  choice: मसीह के
  alternative: ख्रीस्त के / क्राइस्ट के
  rationale: इस संबंधकारक वाक्यांश में पद उपाधि के रूप में अर्थपूर्ण है; ‘मसीह’ किसी संप्रदायगत व्याख्या को जोड़े बिना उस उपाधि को व्यक्त करता है।
- issue: ‘मसीह के क्रूस के शत्रु’ का आशय
  choice: स्रोत की संक्षिप्त और तनावपूर्ण अभिव्यक्ति को यथावत रखना
  alternative: मसीह की क्रूस-मृत्यु के संदेश का विरोध करने वाले
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि विरोध क्रूस के संदेश, जीवन-पद्धति या उसके धार्मिक निहितार्थों में से विशेषतः किसके प्रति है; विस्तार करने से मूल अस्पष्टता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली। यूनानी वाक्य की लंबी संरचना को डैश से सँभाला गया है, ताकि संबंधवाचक खंड और भावात्मक व्यवधान स्पष्ट रहें। किसी पादटिप्पणी की आवश्यकता नहीं है।
