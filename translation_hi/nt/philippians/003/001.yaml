source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: hi
  text: अन्त में[a], मेरे भाइयो[b], प्रभु में आनन्दित रहो। तुम्हें वही बातें लिखना मेरे लिए तो कोई परेशानी नहीं है[c], और तुम्हारी सुरक्षा के लिए है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाकी बातों के विषय में” अथवा “अब से।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयो” का संबोधन पूरी मण्डली से है; अर्थात इसमें भाई और बहनें दोनों सम्मिलित हैं।
    reason: cultural_note
  - marker: c
    text: या “मेरे लिए कोई बोझ नहीं” अथवा “मेरे लिए उबाऊ नहीं।”
    reason: lexical_alternative
  - marker: d
    text: या “तुम्हारे लिए सुरक्षा का साधन है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: अन्त में
  rationale: यह आगे की बात की ओर ले जाने वाला संक्रमण-वाक्यांश है। हिन्दी में “अन्त में” स्वाभाविक है, यद्यपि इसका अर्थ अनिवार्य रूप से पत्र के तुरन्त समाप्त होने का संकेत नहीं देता; अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और सम्बोधन के रूप में आया है। मुख्य पाठ उसका रूप बनाए रखता है, जबकि पूरी मण्डली के समावेशी सन्दर्भ को पादटिप्पणी स्पष्ट करती है।
- source_word: χαίρετε
  choice: आनन्दित रहो
  rationale: बहुवचन आज्ञार्थक क्रिया का उपदेशात्मक बल बनाए रखता है और पौलुस के प्रयोग के अनुरूप सतत मनोभाव व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: पूर्वसर्गीय वाक्यांश को सीधे रखा गया है, ताकि आनन्द का प्रभु से सम्बन्ध या उसमें निहित होना बना रहे।
- source_word: τὰ αὐτά
  choice: वही बातें
  rationale: यह अनुवाद यूनानी की व्यापक और कुछ हद तक अस्पष्ट निर्देशात्मकता बनाए रखता है; यह तय नहीं करता कि संकेत ठीक किन पहले कही गई बातों की ओर है।
- source_word: γράφειν
  choice: लिखना
  rationale: यूनानी क्रियार्थक संज्ञा के कार्य को हिन्दी के स्वाभाविक क्रियामूल रूप से व्यक्त किया गया है।
- source_word: οὐκ ὀκνηρόν
  choice: कष्टकर नहीं
  rationale: इससे यह भाव आता है कि उन्हीं बातों को फिर लिखना पौलुस के लिए बोझिल, अरुचिकर या हिचक उत्पन्न करने वाला नहीं है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀσφαλές
  choice: सुरक्षित है
  rationale: विशेषण के सुरक्षा और स्थिरता सम्बन्धी सीधे अर्थ को बनाए रखा गया है, बिना मुख्य पाठ में अतिरिक्त रूपक जोड़ने के। अधिक व्याख्यात्मक विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: मण्डली के लिए लिंगसूचक सम्बोधन
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग बहुवचन को बनाए रखता है। फिर भी सम्बोधन पूरी मण्डली से है, इसलिए उसके समावेशी आशय को पादटिप्पणी में स्पष्ट किया गया है।
- issue: बार-बार लिखने का सुरक्षात्मक महत्त्व
  choice: तुम्हारे लिए सुरक्षित है
  alternative: तुम्हारी सुरक्षा का उपाय है
  rationale: मुख्य पाठ ἀσφαλές के विशेषणात्मक रूप और सीधे अर्थ को बनाए रखता है। “सुरक्षा का उपाय” इसके सम्भावित सुरक्षात्मक कार्य को अधिक स्पष्ट करता है, पर वह कुछ अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक सम्बोधन का प्रयोग किया गया है। “आनन्दित रहो” उपदेशात्मक स्वर बनाए रखता है। “मेरे लिए तो ... और तुम्हारे लिए ...” से यूनानी μέν ... δέ का हल्का विरोध स्पष्ट होता है।
