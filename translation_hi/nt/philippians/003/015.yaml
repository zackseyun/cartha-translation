  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: hi
  text: इसलिए हममें से जो परिपक्व हैं[a], हम सब यही मनोभाव रखें; और यदि किसी बात में आपकी सोच अलग है, तो परमेश्वर यह भी आपको प्रकट कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिद्ध।” यूनानी शब्द का अर्थ “सिद्ध” भी हो सकता है, पर यहाँ संभवतः आत्मिक परिपक्वता का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचार से निकले निष्कर्ष और पौलुस के वर्तमान आग्रह के बीच तार्किक संबंध दिखाता है।
- source_word: ὅσοι
  choice: हममें से जितने
  rationale: यह संबोधित समूह के भीतर उन सभी को समावेशी ढंग से दर्शाता है जिन पर अगला विशेषण लागू होता है।
- source_word: τέλειοι
  choice: परिपक्व
  rationale: इस संदर्भ में यह पूर्ण विकसित या आत्मिक रूप से प्रौढ़ होने का भाव देता है; फिर भी ‘सिद्ध’ की शाब्दिक संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦτο φρονῶμεν
  choice: वे यही सोच रखें
  rationale: τοῦτο पिछले पदों में व्यक्त मनोभाव की ओर संकेत करता है और वर्तमान विधिलिंग सामूहिक आग्रह व्यक्त करता है। हिंदी में तृतीय पुरुष का यह रूप ‘हममें से जितने’ के साथ स्वाभाविक है।
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: यदि किसी बात में आपकी सोच अलग है
  rationale: यह शर्त, अनिश्चित व्यापकता और भिन्न मनोभाव—तीनों को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: ἀποκαλύψει
  choice: प्रकट कर देगा
  rationale: यह परमेश्वर द्वारा किसी बात को खोलकर ज्ञात कराने के भाव और भविष्यकाल दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: τέλειοι का अर्थ
  choice: परिपक्व
  alternative: सिद्ध
  rationale: ठीक पहले पौलुस अपने लक्ष्य तक अभी न पहुँचने की बात करता है, इसलिए यहाँ ‘परिपक्व’ संदर्भानुकूल है। फिर भी यूनानी शब्द की ‘सिद्ध’ अर्थ-छाया को पाद-टिप्पणी में रखा गया है, ताकि पाठ की विडंबना और धार्मिक तनाव मिट न जाए।
- issue: परमेश्वर क्या प्रकट करेगा
  choice: ‘यह भी’ को अनिर्दिष्ट रखा गया है
  alternative: परमेश्वर सही मत या पौलुस का दृष्टिकोण प्रकट करेगा
  rationale: यूनानी τοῦτο का सटीक आशय संदर्भ से समझा जाता है, पर पद स्वयं उसे विस्तार से परिभाषित नहीं करता। अनुवाद किसी विशिष्ट मतगत व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यही सोच रखें’ φρονέω के केवल बौद्धिक विचार नहीं, बल्कि दृष्टिकोण या मनोभाव के व्यापक अर्थ को संक्षेप में व्यक्त करता है।
