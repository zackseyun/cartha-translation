review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential οὖν, the inclusive scope of ὅσοι, τέλειοι as contextual maturity, the conditional difference in outlook, and God’s future disclosure. However, “वे यही सोच रखें” changes Paul’s first-person plural hortatory subjunctive (φρονῶμεν, “let us think/adopt”) into a third-person exhortation. “आप पर प्रकट कर देगा” is not natural Hindi for disclosure to persons and can suggest manifestation upon them rather than making something known to them.
  naturalness: “परमेश्वर यह भी आपको प्रकट कर देगा” is the natural modern Hindi expression. “हम सब यही मनोभाव रखें” preserves the communal exhortation and naturally conveys φρονέω as an attitude or mindset.
  terminology: “परिपक्व” is appropriate for τέλειοι in this context, and the footnote responsibly preserves “सिद्ध” as a lexical alternative without forcing an interpretation. “परमेश्वर” and “मनोभाव” suit the intended dignified modern register.
  issues:
  - severity: medium
    issue: The hortatory subject is shifted from first person to third person in “वे यही सोच रखें.”
    rationale: 'φρονῶμεν is a first-person plural hortatory subjunctive. The Hindi should retain Paul’s inclusive appeal: “हम सब ... रखें.”'
  - severity: medium
    issue: “आप पर प्रकट कर देगा” is an unsuitable construction for “will reveal to you.”
    rationale: The Greek indirect object ὑμῖν means “to you.” In modern Hindi, “आपको ... प्रकट कर देगा” expresses divine disclosure clearly and avoids the different sense of something appearing upon someone.
  revised_text: इसलिए हममें से जो परिपक्व हैं[a], हम सब यही मनोभाव रखें; और यदि किसी बात में आपकी सोच अलग है, तो परमेश्वर यह भी आपको प्रकट कर देगा।
  revised_footnotes:
