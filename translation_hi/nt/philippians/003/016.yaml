  text: Only[a], let us keep in step with what we have attained.
translation:
  language: hi
  text: केवल इतना कि, जिस स्तर तक हम पहुँच चुके हैं, उसी के अनुरूप चलें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसी नियम के अनुसार चलें” अथवा “उसी मानक पर बने रहें।”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: फिर भी
  rationale: यहाँ शब्द पिछले कथन से एक सीमित करने वाले संक्रमण को व्यक्त करता है। “फिर भी” आधुनिक हिन्दी में स्वाभाविक है और पौलुस के आग्रह की सुधारात्मक शक्ति बनाए रखता है।
- source_word: εἰς ὃ
  choice: जहाँ तक
  rationale: यह वाक्यांश उस अवस्था या प्रगति-बिंदु की ओर संकेत करता है जहाँ विश्वासी पहुँच चुके हैं; “जहाँ तक” हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: ἐφθάσαμεν
  choice: हम ... पहुँचे हैं
  rationale: क्रिया अब तक प्राप्त किए गए स्तर या बिंदु को दर्शाती है। पूर्ण वर्तमान रूप वर्तमान जीवन पर उस उपलब्धि की प्रासंगिकता स्पष्ट करता है।
- source_word: τῷ αὐτῷ
  choice: उसी के अनुसार
  rationale: दत्तिव पद उसी पहले से प्राप्त मानक या मार्ग के अनुरूप चलने का भाव देता है। मूल यूनानी में कोई स्पष्ट संज्ञा नहीं है, इसलिए “नियम” या “मानक” जोड़े बिना इसे सर्वनामात्मक रखा गया है।
- source_word: στοιχεῖν
  choice: कदम मिलाकर चलते रहें
  rationale: यह क्रिया पंक्ति या क्रम में चलने, अर्थात किसी मानक के अनुरूप बने रहने का रूपक व्यक्त करती है। यह हिन्दी पदबंध उस गतिशील रूपक और निरंतर आग्रह दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: τῷ αὐτῷ के साथ “नियम” या “मानक” जैसी स्पष्ट संज्ञा जोड़ी जाए या नहीं
  choice: मुख्य पाठ में कोई संज्ञा न जोड़कर “उसी के अनुसार कदम मिलाकर” कहना
  alternative: “उसी नियम के अनुसार चलें” अथवा “उसी मानक पर बने रहें”
  rationale: दिए गए SBLGNT पाठ में संज्ञा निहित है, स्पष्ट नहीं। उसे मुख्य पाठ में जोड़ना पाठ की अस्पष्टता को अनावश्यक रूप से निश्चित कर देगा; चुना हुआ अनुवाद अनुरूप जीवन का भाव बनाए रखते हुए इसे खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और उपदेशात्मक शैली। “कदम मिलाकर” στοιχεῖν के चलने/पंक्ति में बने रहने के रूपक को स्वाभाविक हिन्दी में बनाए रखता है। मुख्य पाठ में कोई फुटनोट आवश्यक नहीं माना गया, क्योंकि वैकल्पिक अर्थ को बिना अतिरिक्त संज्ञा जोड़े स्पष्ट रूप से व्यक्त किया गया है।
