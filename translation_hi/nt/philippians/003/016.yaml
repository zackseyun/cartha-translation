  rationale: The revision renders πλήν with a natural limiting transition, retains the attained level or point indicated by εἰς ὃ ἐφθάσαμεν, and expresses στοιχεῖν as walking in conformity with that point. The footnote records traditional explicit renderings of the implied referent without inserting an explicit noun into the main text.
