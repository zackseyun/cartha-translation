  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: hi
  text: परन्तु जो कुछ मेरे लिए लाभ था, उसे मैंने मसीह के कारण हानि समझ लिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे मैंने मसीह के कारण हानि माना है।”
    reason: ἥγημαι के पूर्णकालीन रूप को हिन्दी में वर्तमान तक कायम मूल्यांकन के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: Ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले पदों में बताए गए मानवीय भरोसे के आधारों से स्पष्ट और प्रबल विरोध प्रकट करता है।
- source_word: ἅτινα
  choice: जो कुछ
  rationale: अनिश्चित संबंधवाचक रूप पौलुस द्वारा पहले गिनाए गए सभी लाभों को सामूहिक रूप से समेटता है।
- source_word: κέρδη
  choice: लाभ
  rationale: यह पूर्व सुविधाओं या उपलब्धियों को लाभकारी संपत्ति मानने का भाव देता है और हानि के साथ लेखा-जोखा संबंधी विरोध बनाए रखता है।
- source_word: ἥγημαι
  choice: मैंने ... समझ लिया है
  rationale: पूर्णकालीन रूप किसी बीते पुनर्मूल्यांकन से बनी और वर्तमान में कायम ठहरी हुई धारणा व्यक्त करता है।
- source_word: διὰ τὸν Χριστὸν
  choice: मसीह के कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण व्यक्त करता है; Χριστός को अर्थसूचक उपाधि ‘मसीह’ के रूप में रखा गया है।
- source_word: ζημίαν
  choice: हानि
  rationale: एकवचन संज्ञा अनेक पूर्व लाभों के संयुक्त नकारात्मक मूल्यांकन को व्यक्त करती है और लेखा-जोखा का रूपक सुरक्षित रखती है।
theological_decisions:
- issue: Χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: इस प्रसंग में Χριστός अर्थपूर्ण उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और उपाधि का अर्थ सुरक्षित रखता है।
- issue: διὰ τὸν Χριστόν का संबंध
  choice: मसीह के कारण
  alternative: मसीह के लिए
  rationale: διά + कर्मकारक मूलतः कारण या वजह व्यक्त करता है। ‘मसीह के कारण’ इसे सीधे रखता है, जबकि ‘मसीह के लिए’ उद्देश्य या हित का अतिरिक्त भाव दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लाभ—हानि’ से मूल का आर्थिक रूपक सुरक्षित है; वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुरूप बनाया गया है।
