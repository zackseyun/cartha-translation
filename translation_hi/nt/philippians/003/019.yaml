base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: hi
  text: उनका अंत विनाश है, उनका देवता उनका पेट[a] है, और उनका गौरव उनकी लज्जा में है—वे धरती की बातों पर मन लगाए रहते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उनका देवता उनकी भूख है।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “उनका मन धरती की बातों पर लगा रहता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: अन्त
  rationale: यह यूनानी शब्द की संक्षिप्तता बनाए रखता है और जीवन के समापन तथा अंतिम परिणाम—दोनों अर्थों की गुंजाइश देता है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: यह कठोर और सम्भावित अन्तकालीन भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κοιλία
  choice: पेट
  rationale: मूल पाठ के ठोस और तीखे शारीरिक रूपक को बनाए रखता है; ‘भूख’ या ‘लालसा’ कहना उसकी व्याख्या कर देता।
- source_word: δόξα
  choice: गौरव
  rationale: यह सीधा समतुल्य है और लज्जाजनक बात में गौरव करने की विडम्बना तथा तनाव को सुरक्षित रखता है।
- source_word: αἰσχύνη
  choice: लज्जा
  rationale: यह अपमान और नैतिक लज्जा, दोनों अर्थों को संक्षेप में व्यक्त करता है।
- source_word: τὰ ἐπίγεια
  choice: धरती की बातें
  rationale: यह अभिव्यक्ति पृथ्वी से सम्बन्धित वस्तुओं और सरोकारों के व्यापक अर्थ को सहज हिन्दी में रखती है, बिना इसे केवल भौतिक वस्तुओं तक सीमित किए।
- source_word: φρονοῦντες
  choice: मन लगाए रहते हैं
  rationale: यह कृदन्त में निहित निरन्तर मानसिक रुझान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὧν ... ὧν
  choice: उनका ... उनका
  rationale: दोहराए गए सम्बन्धवाचक सर्वनाम का आशय पिछले पद में वर्णित लोगों से है; हिन्दी में ‘उनका’ इसे स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: ‘उनका ईश्वर उनका पेट है’ रूपक का अर्थ
  choice: मुख्य पाठ में ‘पेट’ का ठोस रूपक बनाए रखा गया।
  alternative: उनका ईश्वर उनकी भूख/लालसा है।
  rationale: यूनानी पाठ निकृष्ट इच्छाओं या इन्द्रिय-सुख के प्रति समर्पण को एक तीखे शारीरिक रूपक से कहता है। रूपक को बनाए रखने से उसका अर्थ किसी एक व्याख्या तक सीमित नहीं होता।
- issue: ‘धरती की बातें’ के प्रति मानसिक रुझान
  choice: ‘मन लगाए रहते हैं’ द्वारा निरन्तर अभिमुखता व्यक्त की गई।
  alternative: वे धरती की बातों के विषय में सोचते रहते हैं।
  rationale: φρονέω केवल क्षणिक विचार नहीं, बल्कि सोच और मूल्यबोध की दिशा भी बता सकता है; चुना हुआ रूप इस व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानान्तर वाक्य-रचना और अन्तिम डैश पौलुस के तीखे, संक्षिप्त वर्णन को बनाए रखते हैं। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का स्थान असंगत था; हिन्दी मसौदे में प्रत्येक विकल्प को उसके सम्बन्धित पदांश पर लगाया गया है।
