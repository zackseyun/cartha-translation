source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: hi
  text: 'भाइयों[a], मैं अपने विषय में यह नहीं मानता कि मैंने उसे पकड़ लिया है। पर एक बात: जो बातें पीछे हैं, उन्हें भूलते हुए और जो आगे हैं, उनकी ओर बढ़ते हुए,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ यूनानी के पुल्लिंग संबोधन adelphoi का अनुवाद है; पौलुस प्रायः इसका प्रयोग स्त्रियों सहित पूरे विश्वासी समुदाय के लिए करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी पुल्लिंग संबोधन के रूप को मुख्य पाठ में बनाए रखता है; यहाँ पूरे विश्वासी समुदाय, स्त्रियों सहित, को संबोधित किए जाने की व्यावहारिक व्यापकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: λογίζομαι
  choice: मानता
  rationale: अपने विषय में किए गए विचारपूर्ण आकलन का भाव आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατειληφέναι
  choice: पकड़ लिया है
  rationale: पद 12 से चली आ रही पकड़ने या अधिकार में लेने की रूपकात्मक भाषा को बनाए रखता है; निहित कर्म को हिन्दी में ‘उसे’ से स्पष्ट किया गया है।
- source_word: ἓν δέ
  choice: पर एक बात
  rationale: यूनानी के संक्षिप्त और अधूरे वाक्य-विन्यास को अनावश्यक रूप से ‘मैं करता हूँ’ जोड़कर पूरा नहीं करता।
- source_word: τὰ μὲν ὀπίσω
  choice: जो बातें पीछे हैं
  rationale: बहुवचन और स्थानिक रूपक दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐπιλανθανόμενος
  choice: भूलते हुए
  rationale: क्रिया का सीधा अर्थ देता है और पीछे की बातों के प्रति पौलुस के भाव को ‘त्यागना’ या ‘अनदेखा करना’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: जो आगे हैं
  rationale: ‘पीछे’ के साथ स्पष्ट समानांतर विरोध बनाए रखता है और आगे की वस्तुओं या बातों को अनिर्दिष्ट रहने देता है।
- source_word: ἐπεκτεινόμενος
  choice: उनकी ओर बढ़ते हुए
  rationale: आगे की ओर सक्रिय विस्तार और प्रयास का भाव सहज हिन्दी में देता है; ‘तनकर पहुँचने’ जैसी अस्वाभाविक या अधिक तीव्र अभिव्यक्ति से बचता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। यूनानी के आकस्मिक ‘पर एक बात’ और दोनों वर्तमान कृदंतों की प्रवाहशीलता बनाए रखी गई है; पद अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
