source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: hi
  text: हाँ, बल्कि इससे भी बढ़कर, मैं सब कुछ हानि मानता हूँ, क्योंकि मेरे प्रभु मसीह यीशु को जानने का मूल्य सबसे बढ़कर है। जिनके लिए मैंने सब कुछ की हानि उठाई है और उन्हें कूड़ा[a] मानता हूँ, ताकि मैं मसीह को प्राप्त करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कूड़ा” के लिए आया यूनानी शब्द बहुत तीखा है; इसका अर्थ “मल” या “गंदा कचरा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: बल्कि इससे भी बढ़कर
  rationale: यह पदबंध पिछले कथन को सुधारते हुए उससे आगे बढ़ाता और बात पर बल देता है; यह हिन्दी में उसके संयुक्त संवादात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡγοῦμαι
  choice: मैं ... मानता हूँ
  rationale: यह विचारपूर्वक मूल्यांकन करने का भाव देता है और दोनों occurrences में एक ही हिन्दी क्रिया उस निरंतर मूल्यांकन को बनाए रखती है।
- source_word: πάντα / τὰ πάντα
  choice: सब कुछ
  rationale: यह यूनानी अभिव्यक्ति के व्यापक और समावेशी दायरे को सहज आधुनिक हिन्दी में रखता है।
- source_word: ζημίαν
  choice: हानि
  rationale: यह लाभ-हानि के रूपक को सटीक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: को जानने का मूल्य सबसे बढ़कर है
  rationale: यह τὸ ὑπερέχον के श्रेष्ठ मूल्य और γνώσεως के व्यक्तिगत जानने के भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: मसीह हिन्दी बाइबलीय प्रयोग में Χριστός के पदवीगत अर्थ को सुरक्षित रखता है और यीशु के साथ स्वाभाविक है।
- source_word: τοῦ κυρίου μου
  choice: मेरे प्रभु
  rationale: यह संबंधसूचक भाव तथा κύριος का मसीह-संबंधी महत्व दोनों बनाए रखता है।
- source_word: δι’ ὃν
  choice: उन्हीं के कारण
  rationale: यह उस व्यक्ति-केंद्रित कारण को व्यक्त करता है जिसके कारण पौलुस ने हानि उठाई; 'उन्हीं' हिन्दी में उचित बल देता है।
- source_word: ἐζημιώθην
  choice: मैंने ... खो दिया है
  rationale: यूनानी निष्क्रिय रूप हानि उठाने का अर्थ देता है; हिन्दी में यह परिणाम सहित वास्तविक हानि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: σκύβαλα
  choice: कूड़ा
  rationale: यह शब्द अनुपयोगी और घृणित फेंकी हुई वस्तु का तीखा भाव देता है; अधिक कठोर संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἵνα Χριστὸν κερδήσω
  choice: ताकि मैं मसीह को प्राप्त करूँ
  rationale: यह ἵνα का प्रयोजन और κερδήσω के लाभ/प्राप्ति रूपक को बनाए रखता है।
theological_decisions:
- issue: Χριστός का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की पदवी के रूप में अर्थवान है। 'मसीह' आधुनिक हिन्दी के परिचित बाइबलीय प्रयोग में उस पदवीगत अर्थ को सुरक्षित रखता है।
- issue: γνῶσις का स्वरूप
  choice: मसीह यीशु को जानना
  alternative: मसीह यीशु का ज्ञान
  rationale: सम्बन्धवाचक रचना ज्ञान की वस्तु के रूप में मसीह यीशु को प्रस्तुत करती है। क्रियात्मक हिन्दी व्यक्तिगत और संबंधपरक अर्थ को स्पष्ट करती है, पर केवल बौद्धिक ज्ञान तक अर्थ को सीमित नहीं करती।
- issue: हानि का कर्तृत्व
  choice: मैंने सब कुछ खो दिया है
  alternative: मुझे सब कुछ खोना पड़ा है
  rationale: ἐζημιώθην व्याकरणतः निष्क्रिय है, पर अभिकर्ता नहीं बताता। चुना हुआ हिन्दी रूप वास्तविक हानि और उसके वर्तमान परिणाम को व्यक्त करता है, बिना यह तय किए कि हानि किसने कराई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। लाभ-हानि का रूपक पूरे पद में रखा गया है। 'उन्हीं' से मसीह यीशु पर बल आता है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्द के तुरंत बाद रखा गया है।
