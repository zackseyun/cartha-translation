source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: hi
  text: ऐसा नहीं है कि मैं उसे पहले ही प्राप्त कर चुका हूँ[a] या पहले ही पूर्ण हो चुका हूँ[b]; बल्कि मैं उसके पीछे लगा हुआ हूँ कि देखूँ, क्या मैं भी उसे पकड़ लूँ, जिसके लिए मसीह ने मुझे भी पकड़ लिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे पा चुका हूँ’ या ‘उसे हासिल कर चुका हूँ’; यूनानी में कर्म स्पष्ट रूप से नहीं दिया गया है, बल्कि आसपास के संदर्भ से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पहले ही सिद्ध हो चुका हूँ’ अथवा ‘पहले ही पूर्ण किया गया हूँ।’
    reason: lexical_alternative
  - marker: c
    text: यूनानी ख़्रिस्तोस; वैकल्पिक रूप से ‘मसीहा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: उसे पहले ही पा चुका हूँ
  rationale: क्रिया का कर्म यूनानी में व्यक्त नहीं है, पर आसपास के संदर्भ से लक्ष्य की ओर संकेत मिलता है। हिन्दी में स्पष्टता के लिए ‘उसे’ जोड़ा गया है; ‘पा चुका’ प्राप्ति और उपलब्धि, दोनों की सम्भावना खुली रखता है।
- source_word: τετελείωμαι
  choice: पहले ही सिद्ध किया जा चुका हूँ
  rationale: पूर्णकालिक कर्मवाच्य रूप को हिन्दी में कर्मवाच्य और प्राप्त अवस्था के रूप में रखा गया है। ‘सिद्ध’ पूर्णता की धारणा व्यक्त करता है, पर किसी बाद की धर्मवैज्ञानिक व्यवस्था को पाठ पर नहीं थोपता।
- source_word: διώκω
  choice: मैं आगे बढ़ता जा रहा हूँ
  rationale: यह वाक्यांश लक्ष्य की ओर लगातार और सक्रिय प्रयत्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καταλάβω
  choice: शायद उसे पकड़ लूँ
  rationale: ‘पकड़ लूँ’ καταλαμβάνω की सजीव छवि को बनाए रखता है और आगे के कर्मवाच्य κατελήμφθην के साथ शब्द-संबंध सुरक्षित करता है।
- source_word: ἐφ’ ᾧ
  choice: जिसके लिए
  rationale: 'वाक्यांश को उद्देश्य या लक्ष्य बताने वाला माना गया है: मसीह द्वारा पौलुस को पकड़ने के पीछे वही लक्ष्य था। यूनानी में अन्य व्याकरणिक सम्भावनाएँ हो सकती हैं, पर संदर्भ में यह सबसे उपयुक्त है।'
- source_word: κατελήμφθην
  choice: मुझे पकड़ लिया था
  rationale: कर्मवाच्य अर्थ स्पष्ट रहता है और ‘पकड़ लूँ’ के साथ मूल का शब्दालंकार सुरक्षित रहता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और Χριστός के अभिषिक्त जन/मसीहा संबंधी शीर्षकीय अर्थ को भी बनाए रखता है।
theological_decisions:
- issue: क्या τετελείωμαι का अनुवाद निष्पाप सिद्धता का संकेत दे
  choice: सिद्ध किया जा चुका हूँ
  alternative: पूर्ण हो चुका हूँ / सिद्ध हो चुका हूँ
  rationale: पौलुस किसी पूर्ण अवस्था तक पहुँच चुकने से इनकार करता है, पर पद स्वयं उस अवस्था को बाद की धर्मवैज्ञानिक श्रेणियों में परिभाषित नहीं करता। कर्मवाच्य रूप मूल की व्याकरणिक बनावट और धर्मवैज्ञानिक तनाव दोनों को बनाए रखता है।
- issue: ἐφ’ ᾧ में उद्देश्य और कारण के बीच सम्भावित अस्पष्टता
  choice: जिसके लिए
  alternative: क्योंकि / इस कारण कि
  rationale: निकट संदर्भ में लक्ष्य की प्राप्ति और मसीह द्वारा पकड़े जाने का उद्देश्य प्रमुख है; फिर भी अनुवाद इससे अधिक विशिष्ट उद्देश्य को नहीं बताता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पकड़ लूँ—पकड़ लिया’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी मूल का शब्दालंकार सुनाई दे।
