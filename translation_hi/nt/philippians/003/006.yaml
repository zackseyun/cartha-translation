review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated κατά structure, the hostile sense of διώκων, and the limiting framework of Paul’s law-related righteousness. However, “व्यवस्था के अधीन” can suggest subjection to the law rather than the Greek’s stated sphere, “in the law.” The main text can safely retain that spatial/framework sense directly.
  naturalness: The parallel list structure is clear and suitably concise. “कलीसिया को सतानेवाला” and “निर्दोष ठहरा” are understandable, but spacing the participial form and using “व्यवस्था में” produce more natural, transparent modern Hindi.
  terminology: “कलीसिया,” “व्यवस्था,” and “धार्मिकता” are established biblical terms. “निर्दोष” appropriately conveys blamelessness in the stated legal-righteousness framework, without itself requiring a claim of absolute sinlessness.
  issues:
  - severity: medium
    issue: “व्यवस्था के अधीन” for ἐν νόμῳ
    rationale: Although idiomatic in some contexts, “के अधीन” commonly denotes being subject to the law. Here ἐν νόμῳ specifies the sphere or standard of the righteousness under consideration. “व्यवस्था में” is both source-nearer and clear Hindi, while the footnote can preserve the alternative idiomatic framing.
  - severity: low
    issue: Closed compound “सतानेवाला”
    rationale: Modern standard Hindi ordinarily writes this participial construction as “सताने वाला.”
  revised_text: उत्साह की दृष्टि से, कलीसिया को सताने वाला; व्यवस्था में धार्मिकता की दृष्टि से, निर्दोष ठहरा।
