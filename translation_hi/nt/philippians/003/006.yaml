  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: hi
  text: उत्साह की दृष्टि से, कलीसिया को सताने वाला; व्यवस्था में धार्मिकता की दृष्टि से, निर्दोष ठहरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: की दृष्टि से
  rationale: यहाँ κατά उस कसौटी या क्षेत्र का परिचय देता है जिसके अनुसार पौलुस अपने पुराने जीवन का मूल्यांकन करता है। दोहराया गया वाक्यांश यूनानी की समानांतर अलंकारिक रचना को बनाए रखता है।
- source_word: ζῆλος
  choice: उत्साह
  rationale: यह शब्द पौलुस की पूर्व धार्मिक निष्ठा की तीव्रता को व्यक्त करता है; आधुनिक हिन्दी में ‘उत्साह’ स्पष्ट और स्वाभाविक है।
- source_word: διώκων
  choice: सतानेवाला
  rationale: इस संदर्भ में क्रिया का अर्थ केवल पीछा करना नहीं, बल्कि मसीही समुदाय के विरुद्ध शत्रुतापूर्ण उत्पीड़न करना है।
- source_word: τὴν ἐκκλησίαν
  choice: कलीसिया को
  rationale: यहाँ ἐκκλησία सामान्य सभा नहीं, बल्कि मसीह में विश्वास करनेवाले समुदाय को दर्शाता है; ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में सुबोध और स्थापित है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह व्यवस्था की कसौटी पर खरी ठहरने की दशा को व्यक्त करता है। ‘धार्मिकता’ मुख्य अर्थ को बनाए रखती है, जबकि ‘न्यायपरायणता’ को पादटिप्पणी में जीवित विकल्प के रूप में दिया गया है।
- source_word: ἐν νόμῳ
  choice: व्यवस्था के अधीन
  rationale: यूनानी का शाब्दिक रूप ‘व्यवस्था में’ है। संदर्भ में यह उस क्षेत्र अथवा कसौटी को बताता है जिसके भीतर धार्मिकता का मूल्यांकन होता है; ‘व्यवस्था के अधीन’ स्वाभाविक हिन्दी है।
- source_word: γενόμενος
  choice: ठहरा
  rationale: यह रूप उस परिणाम या स्थिति को व्यक्त करता है जिसमें पौलुस व्यवस्था की कसौटी पर निर्दोष माना जाता था। ‘ठहरा’ हिन्दी में इस मूल्यांकनात्मक भाव को संक्षेप में व्यक्त करता है, बिना पूर्ण निष्पापता का दावा जोड़े।
- source_word: ἄμεμπτος
  choice: निर्दोष
  rationale: यह निर्धारित कसौटी के अंतर्गत दोषारोपण से मुक्त होने का भाव देता है; इसका आशय परमेश्वर के सामने पूर्ण पापरहित होना आवश्यक नहीं है।
theological_decisions:
- issue: पौलुस के ‘निर्दोष’ होने के दावे की सीमा
  choice: यह दावा व्यवस्था के अधीन धार्मिकता की कसौटी के संबंध में है, न कि परमेश्वर के सामने पूर्ण नैतिक निष्पापता का दावा।
  alternative: पौलुस पूर्ण पापरहित होने का दावा कर रहा है, अथवा केवल व्यंग्य कर रहा है।
  rationale: व्याकरण में ἄμεμπτος का संबंध ‘व्यवस्था में पाई जानेवाली धार्मिकता’ से है। इसलिए कथन पौलुस के पूर्व जीवन के विधि-संबंधी मूल्यांकन तक सीमित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संक्षिप्त रखी गई है। पद की सूची-जैसी, समानांतर रचना को अर्धविराम और ‘की दृष्टि से’ की पुनरावृत्ति द्वारा सुरक्षित रखा गया है।
