  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: hi
  text: मैं लक्ष्य की ओर बढ़ता जाता हूँ, मसीह यीशु में परमेश्वर की ऊपर की बुलाहट के पुरस्कार के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गीय बुलाहट” अथवा “ऊपर से आने वाली बुलाहट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: लक्ष्य की ओर
  rationale: दौड़ के रूपक में यह वाक्यांश किसी निश्चित लक्ष्य की दिशा में बढ़ने का भाव देता है; यह हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: διώκω
  choice: बढ़ता जाता हूँ
  rationale: यहाँ क्रिया लगातार और दृढ़ प्रयास से आगे बढ़ने का भाव रखती है। यह अनुवाद प्रसंग की दौड़ वाली छवि को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: εἰς τὸ βραβεῖον
  choice: ताकि ... पुरस्कार पाऊँ
  rationale: εἰς यहाँ प्रयास के उद्देश्य को प्रकट करता है। हिन्दी में उद्देश्यवाचक रचना मूल अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἄνω
  choice: ऊपर की
  rationale: यह चयन स्थानसूचक अर्थ को बनाए रखता है और इसे केवल ‘स्वर्गीय’ अर्थ तक सीमित नहीं करता।
- source_word: κλήσεως τοῦ θεοῦ
  choice: परमेश्वर की ... बुलाहट
  rationale: सम्बन्धकारक रचना बुलाहट के परमेश्वर से होने या परमेश्वर की ओर से आने के भाव को संक्षेप में सुरक्षित रखती है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν की पौलुस-विशिष्ट सम्बन्धात्मक भाषा को बनाए रखा गया है; ‘मसीह’ Χριστός को उपाधि के रूप में व्यक्त करता है।
theological_decisions:
- issue: ἄνω κλήσεως का अर्थ
  choice: ऊपर की बुलाहट
  alternative: स्वर्गीय बुलाहट; ऊपर से आने वाली बुलाहट
  rationale: '‘ऊपर की’ मूल स्थानसूचक अस्पष्टता को बनाए रखता है: बुलाहट ऊपर की ओर हो सकती है या ऊपर से आने वाली। मुख्य पाठ किसी एक व्याख्या को अनिवार्य नहीं बनाता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। उद्देश्यवाचक ‘ताकि ... पाऊँ’ हिन्दी की स्वाभाविकता के लिए अपनाया गया है, जबकि लक्ष्य, पुरस्कार और बुलाहट की मूल रूपकात्मक भाषा सुरक्षित है।
