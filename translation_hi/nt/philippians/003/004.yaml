  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: hi
  text: हालाँकि मुझे स्वयं भी शरीर के आधार पर भरोसा है। यदि कोई और सोचता है कि उसे शरीर के आधार पर भरोसा है[a], तो मुझे उससे भी अधिक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “मानवीय योग्यताओं पर भरोसा” अथवा “बाहरी हैसियत पर भरोसा।” यूनानी में: “शरीर के आधार पर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: हालाँकि
  rationale: यह आरंभिक रियायती भाव को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἔχων πεποίθησιν
  choice: मैं स्वयं ... भरोसा रख सकता हूँ
  rationale: यूनानी पदबंध का शाब्दिक अर्थ भरोसा होना/रखना है; प्रसंग में पौलुस अपने भरोसे के वैध मानवीय आधार होने का दावा कर रहा है, इसलिए हिन्दी में सामर्थ्यसूचक रूप स्वाभाविक है।
- source_word: ἐν σαρκί
  choice: शरीर पर
  rationale: σάρξ का ठोस स्रोत-रूप सुरक्षित रखा गया है; यहाँ इसका आशय पापी स्वभाव नहीं, बल्कि मानवीय व बाहरी योग्यताएँ हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: δοκεῖ
  choice: सोचता है
  rationale: यह व्यक्ति के अपने विषय में मानने या समझने का सहज हिन्दी रूप है।
- source_word: πεποιθέναι
  choice: भरोसा रख सकता है
  rationale: पूर्ण infinitive भरोसे की स्थापित दशा दर्शाता है; प्रसंग में उस भरोसे का आधार होने का भाव भी निहित है।
- source_word: μᾶλλον
  choice: उससे भी अधिक
  rationale: तुलना को हिन्दी में पूरा और स्पष्ट बनाता है, जबकि यूनानी की संक्षिप्त वक्तृता बनी रहती है।
theological_decisions:
- issue: फिलिप्पियों 3:4 में σάρξ का अर्थ
  choice: मुख्य पाठ में “शरीर” रखा गया है और पादटिप्पणी में प्रसंगगत अर्थ बताया गया है।
  alternative: “मानवीय योग्यताओं” या “बाहरी हैसियत” पर भरोसा
  rationale: अगली आयतों में खतना, वंश, व्यवस्था और जोश का उल्लेख दिखाता है कि यहाँ बात पापी स्वभाव की नहीं, मानवीय पहचान और बाहरी धार्मिक योग्यताओं की है। स्रोत की अर्थगत व्यापकता बचाने के लिए व्याख्यात्मक रूप मुख्य पाठ में नहीं रखा गया।
- issue: पौलुस के दावे का स्वरूप
  choice: “भरोसा रख सकता हूँ”
  alternative: “भरोसा रखता हूँ”
  rationale: यह स्पष्ट करता है कि पौलुस वास्तव में शरीर को अपने अंतिम भरोसे का आधार नहीं बना रहा, बल्कि कह रहा है कि यदि ऐसे आधारों की गणना हो तो उसके पास अधिक कारण हैं; फिर भी मूल के आत्मविश्वास संबंधी दावे को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “शरीर” स्रोत-पद की धार्मिक और आलंकारिक गहराई बचाता है; पादटिप्पणी तत्काल प्रसंग में उसका अर्थ खोलती है।
