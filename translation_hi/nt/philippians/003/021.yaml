  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: hi
  text: जो हमारी दीन दशा की देह को बदलकर अपनी महिमामय देह के अनुरूप बना देगा—उस प्रभावकारी सामर्थ्य के अनुसार जो उसे सब कुछ अपने अधीन करने में भी समर्थ बनाती है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारी दीनता की देह।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी महिमा की देह।”
    reason: lexical_alternative
  - marker: c
    text: या, “उस क्रियाशीलता के अनुसार जिसके द्वारा वह सब कुछ अपने अधीन करने में समर्थ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: बदलकर ... बना देगा
  rationale: यह भविष्य में देह के रूप और दशा के वास्तविक परिवर्तन को व्यक्त करता है; केवल सामान्य ‘बदल देगा’ की अपेक्षा परिणाम भी स्पष्ट करता है।
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: हमारी दीन दशा की देह
  rationale: यह यूनानी संबंधकारक पदबंध की ‘हमारी दीनता/अपमान की देह’ वाली तीव्रता को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σύμμορφον
  choice: के समान
  rationale: यह रूपगत अनुरूपता को सरल, स्वाभाविक हिन्दी में व्यक्त करता है; अर्थ केवल बाहरी समानता तक सीमित नहीं किया गया।
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: अपनी महिमामय देह
  rationale: यूनानी ‘उसकी महिमा की देह’ का स्वाभाविक हिन्दी विशेषणात्मक रूप है, जो महिमा से युक्त देह का भाव देता है।
- source_word: κατὰ τὴν ἐνέργειαν
  choice: उस सामर्थ्य के कार्य के अनुसार
  rationale: ἐνέργεια की सक्रिय और प्रभावकारी क्रियाशीलता तथा κατὰ के ‘अनुसार’ संबंध—दोनों को सुरक्षित रखता है।
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: जिसके द्वारा वह ... कर सकता है
  rationale: यह सामर्थ्य की प्रभावी क्षमता को स्पष्ट करता है और यूनानी infinitival construction को सहज हिन्दी में व्यक्त करता है।
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: सब कुछ अपने अधीन ... कर सकता है
  rationale: यह ὑποτάσσω के अधीन करने और τὰ πάντα के सार्वभौमिक विस्तार को बनाए रखता है।
theological_decisions:
- issue: वर्तमान दीन शारीरिक दशा और भावी महिमा का संबंध
  choice: विश्वासियों की वर्तमान दीन दशा की देह को मसीह की महिमामय देह के समान बनाए जाने वाला भावी परिवर्तन
  alternative: यहाँ स्पष्ट रूप से ‘पुनरुत्थान’ शब्द जोड़ना
  rationale: पद देह के भावी परिवर्तन और मसीह की देह से अनुरूपता को स्पष्ट करता है, पर इसकी प्रक्रिया के लिए यहाँ ‘पुनरुत्थान’ शब्द प्रयुक्त नहीं करता; इसलिए अनुवाद अतिरिक्त doctrinal wording नहीं जोड़ता।
- issue: καί का बल
  choice: ‘भी’ द्वारा यह व्यक्त करना कि सब कुछ अपने अधीन करना भी उसी सामर्थ्य के दायरे में है
  alternative: καί को अनूदित न करना
  rationale: ‘भी’ यूनानी बल को बनाए रखता है और देह-परिवर्तन को सार्वभौमिक अधीनता की सामर्थ्य से जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘दीन दशा’ शारीरिक कमजोरी मात्र की अपेक्षा ταπείνωσις के अपमान/नीच अवस्था के व्यापक भाव को रखता है। ‘सामर्थ्य का कार्य’ सक्रिय प्रभावकारी शक्ति को व्यक्त करता है।
