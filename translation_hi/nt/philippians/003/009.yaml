source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: hi
  text: और मैं उसमें ऐसा पाया जाऊँ कि मेरे पास अपनी वह धार्मिकता न हो जो व्यवस्था से आती है, बल्कि वह धार्मिकता हो जो मसीह में विश्वास के द्वारा मिलती है[a]—अर्थात् वह धार्मिकता[b] जो परमेश्वर से आती है और विश्वास पर आधारित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह की विश्वासयोग्यता के द्वारा।”
    reason: πίστεως Χριστοῦ के कर्तृगत संबंधकारक वाले वैकल्पिक अर्थ को सुरक्षित रखना।
  - marker: b
    text: दोनों स्थानों पर “धार्मिकता” का अनुवाद “न्याय” भी हो सकता है।
    reason: δικαιοσύνη के शब्दार्थगत वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: εὑρεθῶ ἐν αὐτῷ
  choice: मैं उसमें पाया जाऊँ
  rationale: यूनानी निष्क्रिय क्रिया और पौलुस के विशिष्ट ‘उसमें’ संबंध-वाचक कथन को बिना किसी एक व्याख्यात्मक अर्थ तक सीमित किए सुरक्षित रखता है।
- source_word: μὴ ἔχων ἐμὴν δικαιοσύνην
  choice: मेरी अपनी धार्मिकता लिए हुए नहीं
  rationale: सहभागी क्रिया ἔχων की अवस्था/रीति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘अपनी’ पर दिए बल को बनाए रखता है।
- source_word: τὴν ἐκ νόμου
  choice: जो व्यवस्था से आती है
  rationale: ἐκ के स्रोत या उद्गम के भाव को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है; संदर्भ में व्यवस्था परमेश्वर की व्यवस्था, विशेषतः मूसा की व्यवस्था, की ओर संकेत करती है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ परमेश्वर के सामने उचित ठहरने या सही संबंध की पौलुसी अर्थ-व्याप्ति को ‘धार्मिकता’ अधिक स्वाभाविक ढंग से व्यक्त करती है; ‘न्याय’ इस वाक्य में भ्रामक हो सकता है।
- source_word: διὰ πίστεως Χριστοῦ
  choice: मसीह में विश्वास के द्वारा
  rationale: विवादित संबंधकारक को मुख्य पाठ में वस्तुगत अर्थ—मसीह में विश्वास—के रूप में प्रस्तुत किया गया है; मसीह की विश्वासयोग्यता वाला संभव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: हिन्दी बाइबलीय प्रयोग में Χριστός के पदवीगत अर्थ का प्रचलित और बोधगम्य रूप है।
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: परमेश्वर से मिलने वाली धार्मिकता
  rationale: ἐκ θεοῦ के स्रोत को स्पष्ट करता है और पूर्ववर्ती धार्मिकता के साथ विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τῇ πίστει
  choice: विश्वास पर आधारित
  rationale: ἐπί सहित चतुर्थी के आधार या निर्भरता के भाव को संक्षिप्त और आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πίστεως Χριστοῦ का संबंधकारक अर्थ
  choice: मसीह में विश्वास
  alternative: मसीह की विश्वासयोग्यता
  rationale: यूनानी पदबंध वस्तुगत और कर्तृगत संबंधकारक दोनों प्रकार से समझा गया है। मुख्य पाठ प्रचलित वस्तुगत अर्थ देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय अथवा सही ठहराए जाने की स्थिति
  rationale: इस प्रसंग में ‘धार्मिकता’ पौलुस के व्यवस्था, विश्वास और परमेश्वर से प्राप्त स्थिति के विरोध को हिन्दी में सबसे कम संकीर्णता के साथ व्यक्त करती है।
- issue: ἐπὶ τῇ πίστει का संबंध
  choice: विश्वास पर आधारित
  alternative: विश्वास के आधार पर
  rationale: दोनों रूप आधार का भाव देते हैं; मुख्य पाठ का रूप आधुनिक और संक्षिप्त है, पर यह परमेश्वर से मिलने वाली धार्मिकता और विश्वास के सटीक धर्मवैज्ञानिक संबंध को आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उसमें’ को व्याख्यात्मक विस्तार ‘उसके साथ एकता में’ से नहीं बदला गया, ताकि पौलुस की अभिव्यक्ति की व्यापकता बनी रहे। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
