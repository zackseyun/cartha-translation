  choice: इब्रानियों में से इब्रानी
  alternative: इब्रानियों से जन्मा इब्रानी
  rationale: मुख्य पाठ मूल की व्यापक और बलपूर्ण अभिव्यक्ति को बनाए रखता है; अधिक स्पष्ट वंशगत अर्थ को पादटिप्पणी में रखा गया है ताकि वास्तविक अर्थ-परास संकुचित न हो।
