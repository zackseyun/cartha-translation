    text: या, “इब्रानियों से जन्मा इब्रानी”; यह पौलुस के इब्रानी वंश और पहचान पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: आठवें दिन मेरा खतना हुआ
  rationale: यूनानी की अत्यंत संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए आठवें दिन हुए वाचागत खतने का तथ्य स्पष्ट किया गया है।
- source_word: ἐκ γένους Ἰσραήλ
  choice: इस्राएल के वंश का
  rationale: γένος यहाँ जातीय और वंशगत मूल को सूचित करता है; ‘वंश’ इस दावे को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φυλῆς Βενιαμίν
  choice: बिन्यामीन के गोत्र का
  rationale: φυλή के लिए ‘गोत्र’ इस्राएल के बारह गोत्रों के ऐतिहासिक संदर्भ में मानक और स्पष्ट शब्द है।
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: इब्रानियों में से इब्रानी
  rationale: यह चयन मूल की संक्षिप्त, बलपूर्ण संरचना को बनाए रखता है और इब्रानी वंश तथा पहचान—दोनों की सम्भावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κατὰ νόμον
  choice: व्यवस्था की दृष्टि से
  rationale: κατά यहाँ किसी विषय या मानदंड के संबंध में वर्गीकरण बताता है; यह हिन्दी प्रयोग अगले पद ‘फरीसी’ से स्वाभाविक रूप से जुड़ता है।
- source_word: Φαρισαῖος
  choice: फरीसी
  rationale: यह उस यहूदी धार्मिक समूह के नाम का हिन्दी में स्थापित रूप है।
theological_decisions:
