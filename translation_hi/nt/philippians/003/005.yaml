translation:
  language: hi
  text: आठवें दिन मेरा खतना हुआ; मैं इस्राएल के वंश का, बिन्यामीन के गोत्र का, इब्रानियों में से इब्रानी[a]; व्यवस्था की दृष्टि से फरीसी था।
