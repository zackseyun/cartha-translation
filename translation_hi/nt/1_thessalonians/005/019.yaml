lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: पवित्र आत्मा
  rationale: संज्ञा के साथ निश्चित उपपद और आगे भविष्यवाणियों के उल्लेख (पद 20–21) के कारण यहाँ सबसे स्वाभाविक संकेत पवित्र आत्मा की ओर है। यूनानी पाठ स्वयं बड़े-छोटे अक्षरों से यह भेद नहीं दिखाता।
- source_word: μὴ
  choice: न
  rationale: μή वर्तमान आज्ञार्थक क्रिया के साथ निषेध व्यक्त करता है; हिंदी में स्वाभाविक निषेधात्मक आज्ञा के लिए ‘न’ उपयुक्त है।
- source_word: σβέννυτε
  choice: आग को न बुझाओ
  rationale: σβέννυμι का मूल अर्थ आग या ज्योति को बुझाना है। हिंदी में केवल ‘आत्मा को न बुझाओ’ अस्वाभाविक और अस्पष्ट हो सकता है; ‘आग’ जोड़ने से मूल अग्नि-रूपक स्वाभाविक ढंग से प्रकट होता है, बिना आशय को ‘दबाना’ जैसे अमूर्त शब्द में बदलने के।
theological_decisions:
- issue: πνεῦμα का अभिप्रेत संदर्भ
  choice: पवित्र आत्मा
  alternative: आत्मा; आत्मिक उत्साह या वरदान
  rationale: इसके तुरंत बाद भविष्यवाणियों को तुच्छ न जानने और सब कुछ परखने की आज्ञा आती है, इसलिए मंडली में सक्रिय पवित्र आत्मा सबसे संभावित संदर्भ है। फिर भी यूनानी शब्द व्यापक अर्थ में ‘आत्मा’ भी हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और आज्ञात्मक रखी गई है। ‘पवित्र आत्मा की आग’ हिंदी में बुझाने के रूपक को स्पष्ट और स्वाभाविक बनाता है; पादटिप्पणी अधिक शाब्दिक विकल्प और वास्तविक अर्थगत अस्पष्टता सुरक्षित रखती है।
