reference: 1 Thessalonians 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: hi
  text: क्योंकि तुम स्वयं भली-भाँति जानते हो कि प्रभु का दिन रात में चोर की तरह आता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: तुम स्वयं
  rationale: यह बलवाचक सर्वनाम οἴδατε में निहित द्वितीय पुरुष कर्ता पर जोर देता है; ‘तुम स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: ἀκριβῶς
  choice: भली-भाँति
  rationale: οἴδατε के साथ यह सटीक और पक्की जानकारी का भाव देता है; ‘भली-भाँति जानते हो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: इसका सीधा और सामान्य अर्थ ‘जानना’ है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनके ज्ञान की विषय-वस्तु का परिचय देता है।
- source_word: ἡμέρα κυρίου
  choice: प्रभु का दिन
  rationale: यह स्थापित बाइबलीय और युगांत-संबंधी अभिव्यक्ति है, साप्ताहिक आराधना-दिवस का उल्लेख नहीं।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ मानक, गरिमापूर्ण और इस बाइबलीय अभिव्यक्ति के अनुकूल हिन्दी रूप है।
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: रात में चोर की तरह
  rationale: यह यूनानी उपमा को स्वाभाविक हिन्दी में बनाए रखता है और आगमन के अप्रत्याशित होने का चित्र प्रस्तुत करता है।
- source_word: οὕτως
  choice: की तरह
  rationale: οὕτως उपमा में बताए गए ढंग से आगमन को जोड़ता है; हिन्दी में यह भाव ‘चोर की तरह आता है’ में स्वाभाविक रूप से समाहित है।
- source_word: ἔρχεται
  choice: आता है
  rationale: वर्तमान काल के सजीव रूप और भविष्य-संदर्भ दोनों को हिन्दी का सामान्य वर्तमान ‘आता है’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: युगांत-संबंधी अभिव्यक्ति ἡμέρα κυρίου
  choice: प्रभु का दिन
  alternative: प्रभु-दिवस
  rationale: संदर्भ परमेश्वर के भावी निर्णायक हस्तक्षेप के दिन और उसके अप्रत्याशित आगमन का है, किसी साप्ताहिक आराधना-दिवस का नहीं। ‘प्रभु का दिन’ भविष्यद्वाणी की स्थापित अभिव्यक्ति को सुरक्षित रखता है।
- issue: ‘रात में चोर’ की उपमा का आशय
  choice: उपमा को बिना विस्तार के यथावत रखा गया
  alternative: इसे ‘अचानक’ या ‘चुपके से’ कहकर स्पष्ट करना
  rationale: मूल पाठ चोर की उपमा देता है, पर किसी विस्तृत युगांत-क्रम, गुप्तता या समय-सिद्धांत को स्पष्ट नहीं करता। इसलिए उसके तनाव और चित्रात्मकता को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘भली-भाँति’ सटीक ज्ञान का भाव देता है, जबकि वाक्य-रचना मूल के जोर और उपमा को बनाए रखती है।
