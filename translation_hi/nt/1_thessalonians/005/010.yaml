  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: hi
  text: जो हमारे लिए मर गए, ताकि चाहे हम जाग रहे हों या सो रहे हों,[a] हम उनके साथ जीवित रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चाहे हम सतर्क हों या सो रहे हों।’ यह वाक्यांश आसपास के पदों में सतर्क रहने की शिक्षा की प्रतिध्वनि हो सकता है, यद्यपि यहाँ संभवतः आशय यह है कि विश्वासी जीवित हों या मर चुके हों।
    reason: वैकल्पिक अर्थ और प्रसंगगत अस्पष्टता
lexical_decisions:
- source_word: ἀποθανόντος
  choice: जिन्होंने ... प्राण दिए
  rationale: यह भूतकालिक कृदन्त पिछले पद के ‘हमारे प्रभु यीशु मसीह’ को संदर्भित करता है। हिन्दी में आदरसूचक सम्बन्धवाचक उपवाक्य स्वाभाविक है; ‘प्राण दिए’ मृत्यु को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: περὶ ἡμῶν
  choice: हमारे लिए
  rationale: इस उद्धार-संबंधी प्रसंग में περί + सम्बन्धकारक का अर्थ ‘हमारी ओर से/हमारे हित में’ है। ‘हमारे लिए’ स्वाभाविक है और पाठ से अधिक विशिष्ट प्रायश्चित्त-सिद्धान्त आरोपित नहीं करता।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम का भाव सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: γρηγορῶμεν
  choice: हम जाग रहे हों
  rationale: क्रिया शारीरिक रूप से जागे रहने या रूपकतः सतर्क रहने, दोनों का अर्थ दे सकती है। यह चयन उस रूपक को खुला रखता है और ‘सो रहे हों’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: καθεύδωμεν
  choice: सो रहे हों
  rationale: मूल रूपक को बनाए रखता है। यहाँ इसका प्रमुख संकेत संभवतः मर चुके विश्वासियों की ओर है, फिर भी नैतिक असावधानी की निकटवर्ती प्रतिध्वनि को मुख्य पाठ में समाप्त नहीं किया गया।
- source_word: ἅμα
  choice: मिलकर
  rationale: σύν के साथ साझा जीवन और संगति का भाव व्यक्त करता है; ‘साथ मिलकर’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: σὺν αὐτῷ
  choice: उनके साथ
  rationale: मसीह के साथ संगति अथवा संयुक्त जीवन को व्यक्त करता है। यीशु के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी के अनुरूप है।
- source_word: ζήσωμεν
  choice: हम ... जीवित रहें
  rationale: ἵνα के अधीन सम्भावनार्थक/उद्देश्यात्मक भाव को ‘रहें’ से सुरक्षित रखा गया है। ‘जीवित रहें’ इस प्रसंग में मसीह के साथ जीवन को स्पष्ट करता है।
theological_decisions:
- issue: ‘जाग रहे हों या सो रहे हों’ का प्रसंगगत अर्थ
  choice: मुख्यतः जीवित होने या मर चुके होने का संकेत, जबकि मूल रूपक मुख्य पाठ में सुरक्षित है।
  alternative: नैतिक रूप से सतर्क होने या आध्यात्मिक रूप से असावधान होने का संकेत।
  rationale: 4:13–15 में ‘सोना’ मृत विश्वासियों के लिए प्रयुक्त रूपक है, और यहाँ दोनों अवस्थाओं में मसीह के साथ जीवित रहने की बात जीवित/मृत विरोध के अनुकूल है। फिर भी 5:6–7 की सतर्कता-विषयक भाषा इसकी नैतिक प्रतिध्वनि संभव बनाती है, इसलिए अनुवाद अर्थ को निर्णायक रूप से नहीं खोलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आदरसूचक ‘जिन्होंने/उनके’ यीशु के लिए प्रयोग हुआ है। मुख्य पाठ में जागने-सोने का रूपक रखा गया है और फुटनोट में उसकी नैतिक तथा जीवित-मृत दोनों संभावनाएँ बताई गई हैं।
