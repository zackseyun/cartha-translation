source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: hi
  text: शान्ति का परमेश्वर स्वयं तुम्हें पूरी तरह पवित्र करे, और तुम्हारी आत्मा, प्राण और शरीर सम्पूर्ण रूप से हमारे प्रभु यीशु मसीह के आगमन के समय निर्दोष रखे जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ “आत्मा, प्राण और शरीर” तीनों का नाम लेता है। इसका आशय मनुष्य के तीन अलग-अलग भागों की शिक्षा देना है या सम्पूर्ण व्यक्ति पर बल देना—इस विषय में व्याख्याकारों के मत अलग हैं।
    reason: theological_ambiguity
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: शान्ति का परमेश्वर स्वयं
  rationale: αὐτός के बलाघात को “स्वयं” से रखा गया है। δέ यहाँ प्रार्थनात्मक आशीष की ओर हल्का संक्रमण दिखाता है; हिन्दी में अलग संयोजक जोड़ना अनावश्यक और कुछ कृत्रिम होता।
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: तुम्हें पूरी तरह पवित्र करे
  rationale: optative को कामना/प्रार्थना के रूप में “करे” से व्यक्त किया गया है। ὁλοτελεῖς सम्पूर्णता पर बल देता है; “पूरी तरह” स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: तुम्हारी आत्मा, प्राण और शरीर—सब कुछ—
  rationale: तीनों यूनानी पदों का भेद बनाए रखते हुए ὁλόκληρον की समग्रता को “सब कुछ” से स्पष्ट किया गया है। “आत्मा” πνεῦμα और “प्राण” ψυχή के लिए हिन्दी बाइबलीय परम्परा में परिचित तथा यहाँ परस्पर भिन्न शब्द हैं।
- source_word: ἀμέμπτως ... τηρηθείη
  choice: निर्दोष सुरक्षित रहे
  rationale: निष्क्रिय optative को दूसरी प्रार्थनात्मक कामना के रूप में रखा गया है। “निर्दोष सुरक्षित रहे” दोषरहित अवस्था में संभाले रखे जाने का भाव देता है।
- source_word: ἐν τῇ παρουσίᾳ
  choice: आगमन पर
  rationale: पौलुस के इस अंतिम-काल सम्बन्धी प्रसंग में παρουσία प्रभु के आने/आगमन को सूचित करता है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह
  rationale: Χριστός को हिन्दी में स्थापित उपाधि “मसीह” से अनूदित किया गया है; यह केवल नाम नहीं बल्कि अभिषिक्त जन की उपाधि का अर्थ भी वहन करता है।
theological_decisions:
- issue: आत्मा, प्राण और शरीर की त्रयी
  choice: तीनों पदों को अलग-अलग रखते हुए “सब कुछ” द्वारा समग्र व्यक्ति पर बल
  alternative: इसे मनुष्य के तीन पृथक तत्त्वों की औपचारिक शिक्षा मानना, अथवा तीनों को केवल “सम्पूर्ण अस्तित्व” कहकर मिला देना
  rationale: यूनानी पाठ तीनों का स्पष्ट उल्लेख करता है, पर यह तय नहीं करता कि पौलुस मनुष्य की त्रिभागी संरचना का तकनीकी सिद्धान्त दे रहा है या समग्रता पर आलंकारिक बल। अनुवाद दोनों सम्भावनाओं को खुला रखता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: “मसीह” आधुनिक हिन्दी में व्यापक, अर्थपूर्ण और स्थापित उपाधि है; इससे Χριστός की पदवीगत प्रकृति बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक सम्बोधन वाली है। “शान्ति,” “पवित्र,” “प्राण,” “मसीह” और “आगमन” जैसे परिचित बाइबलीय शब्द बनाए गए हैं। विराम-चिह्नों से ὁλόκληρον का समग्रता वाला बल स्वाभाविक हिन्दी में व्यक्त किया गया है।
