base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: hi
  text: हर परिस्थिति में[a] धन्यवाद दो, क्योंकि मसीह यीशु में तुम्हारे लिए परमेश्वर की यही इच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हर बात में।” इसका आशय हर परिस्थिति में धन्यवाद देना है; यह आवश्यक नहीं कि स्वयं बुराई के लिए धन्यवाद दिया जाए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: हर परिस्थिति में
  rationale: ἐν के साथ संबंधकारक παντί उस परिस्थिति या क्षेत्र को व्यक्त करता है जिसमें धन्यवाद देना है। यह स्वाभाविक हिन्दी है और इसका अर्थ यह नहीं लगाता कि बुराई के लिए भी धन्यवाद देना चाहिए।
- source_word: εὐχαριστεῖτε
  choice: धन्यवाद दो
  rationale: यह वर्तमानकालीन सक्रिय आज्ञार्थक, बहुवचन रूप है। हिन्दी में “धन्यवाद दो” सीधी और स्वाभाविक आज्ञा है; निरंतरता को अलग शब्द जोड़कर अतिरंजित नहीं किया गया।
- source_word: τοῦτο
  choice: यही
  rationale: संकेतवाचक शब्द निकटवर्ती उपदेश की ओर संकेत करता है। “यही” यूनानी की संक्षिप्तता बनाए रखता है और संकेत के दायरे को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेश का कारण प्रस्तुत करता है; आधुनिक हिन्दी में “क्योंकि” स्पष्ट और स्वाभाविक है।
- source_word: θέλημα θεοῦ
  choice: परमेश्वर की इच्छा
  rationale: संबंधसूचक रचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός यहाँ उपाधि के रूप में अर्थपूर्ण है, इसलिए “मसीह” उसका यहूदी-मसीहाई अर्थ बनाए रखता है। “में” पौलुस की संक्षिप्त संघात्मक भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: इस संदर्भ में εἰς ὑμᾶς परमेश्वर की इच्छा का विश्वासियों की ओर निर्देशित या उनसे संबंधित होना व्यक्त करता है। “तुम्हारे लिए” इसका सहज हिन्दी रूप है।
theological_decisions:
- issue: Χριστῷ को अर्थपूर्ण उपाधि के रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु / क्राइस्ट जीसस
  rationale: “मसीह” आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित है और Χριστός की उपाधिगत तथा मसीहाई अर्थवत्ता को सुरक्षित रखता है; केवल ध्वन्यंतरण करने से यह अर्थ धुंधला पड़ सकता है।
- issue: ἐν παντί में धन्यवाद का संबंध
  choice: हर परिस्थिति में धन्यवाद देना
  alternative: हर बात के लिए धन्यवाद देना
  rationale: ἐν के साथ संबंधकारक मुख्यतः उस परिस्थिति को बताता है जिसमें धन्यवाद दिया जाए। इससे पाठ में यह अतिरिक्त धार्मिक दावा नहीं जोड़ा जाता कि स्वयं प्रत्येक बुराई के लिए धन्यवाद देना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “मसीह यीशु में” की पौलुसी संक्षिप्तता तथा “यही” के संकेत की संभावित व्यापकता को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
