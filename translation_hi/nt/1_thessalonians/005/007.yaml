  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: hi
  text: क्योंकि जो सोते हैं, वे रात में सोते हैं, और जो नशे में होते हैं, वे रात में नशे में होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद के उपदेश का आधार बताने वाला व्याख्यात्मक संबंधसूचक है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारणसूचक संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: जो सोते हैं, वे ... सोते हैं
  rationale: संज्ञात्मक कृदन्त को सामान्य वर्ग के रूप में व्यक्त किया गया है और उसी क्रिया की पुनरावृत्ति रखी गई है, जिससे यूनानी वाक्य का समानांतर तथा आलंकारिक प्रभाव बना रहता है।
- source_word: νυκτὸς
  choice: रात में
  rationale: यह सम्बन्धकारक रूप क्रियाविशेषण की तरह समय बताता है; ‘रात में’ संक्षिप्त, स्वाभाविक आधुनिक हिन्दी है।
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: जो मतवाले होते हैं, वे ... मतवाले होते हैं
  rationale: यह चयन नशे की अवस्था में होने या होने लगने का भाव देता है और कृदन्त तथा मुख्य क्रिया की पुनरावृत्ति को समान हिन्दी अभिव्यक्ति से सुरक्षित रखता है।
- source_word: καί
  choice: और
  rationale: दो समानांतर उपवाक्यों को जोड़ने वाला साधारण समुच्चयबोधक।
theological_decisions:
- issue: नींद और मतवालेपन को शाब्दिक या रूपकात्मक ढंग से प्रस्तुत करना
  choice: मुख्य पाठ में सामान्य रात्री-व्यवहार के शाब्दिक चित्र—‘सोते’ और ‘मतवाले होते’—को बनाए रखना
  alternative: इन्हें आत्मिक असावधानी और नैतिक असंयम के रूप में स्पष्ट करके अनुवाद करना
  rationale: तात्कालिक संदर्भ में पौलुस सामान्य रात्री-व्यवहार को पिछले आत्मिक उपदेश के लिए उपमा के रूप में प्रयोग करता है। शाब्दिक चित्र को बनाए रखने से व्याख्या अनुवाद में नहीं मिलाई जाती और उपमा का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मतवाले होते हैं’ ने ‘नशे में धुत होते हैं’ की अपेक्षा मूल की पुनरुक्ति और औपचारिक संतुलन को बेहतर रखा है।
