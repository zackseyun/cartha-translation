lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεὸς
  choice: परमेश्वर ने हमें ... नहीं ... ठहराया है
  rationale: τίθημι यहाँ किसी परिणाम या उद्देश्य के लिए नियुक्त करने का भाव रखता है। ‘ठहराया’ इस अर्थ को सुरक्षित रखता है, पर पाठ से अधिक प्रबल नियतिवादी भाषा नहीं जोड़ता।
- source_word: εἰς ὀργὴν
  choice: क्रोध के लिए
  rationale: पौलुस के इस अंतकालिक संदर्भ में ὀργή परमेश्वर के क्रोध को सूचित करता है; ‘न्याय’ कहना अधिक व्याख्यात्मक होता।
- source_word: εἰς περιποίησιν σωτηρίας
  choice: उद्धार प्राप्त करने के लिए
  rationale: περιποίησις प्राप्ति, अर्जन, अधिकार में आने या संरक्षण तक का अर्थ दे सकता है। मुख्य पाठ में ‘उद्धार प्राप्त करने’ से विरोधी परिणामों की संरचना स्पष्ट और स्वाभाविक रहती है, जबकि व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम दर्शाता है। Χριστός को हिन्दी की प्रचलित अर्थपूर्ण उपाधि ‘मसीह’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्या ἔθετο को अधिक प्रबल पूर्वनियति-सूचक भाषा में व्यक्त किया जाए
  choice: ठहराया है
  alternative: नियत किया है
  rationale: पद परमेश्वर के उद्देश्य और नियुक्ति की पुष्टि करता है, पर किसी विशिष्ट पूर्वनियति-सिद्धान्त को विस्तार से निर्धारित नहीं करता। ‘ठहराया’ उस तनाव को बनाए रखता है।
- issue: Χριστοῦ को उपाधि के रूप में या नाम-सदृश पारंपरिक रूप में व्यक्त करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यह यीशु की उपाधि है और हिन्दी में ‘मसीह’ उसका अर्थपूर्ण, व्यापक रूप से समझा जाने वाला पारंपरिक अनुवाद है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कारणसूचक आरम्भ, समानांतर ‘के लिए’ संरचना और परमेश्वर के क्रोध तथा उद्धार के बीच मूल विरोध सुरक्षित है।
