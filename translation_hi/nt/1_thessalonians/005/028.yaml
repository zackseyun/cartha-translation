  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह का अनुग्रह तुम्हारे साथ रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में, “तुम सबके साथ रहे।”
    reason: 'पाठांतर: कुछ यूनानी साक्ष्यों में ὑμῶν से पहले πάντων (‘सब’) जोड़ा गया है।'
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के आशीर्वचन में यह परमेश्वर की कृपापूर्ण भलाई और कृपा को दर्शाता है; ‘अनुग्रह’ इसका प्रचलित और अर्थपूर्ण हिन्दी धार्मिक पर्याय है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की अधिकारपूर्ण उपाधि है; ‘प्रभु’ उसके धार्मिक और मसीही भार को बनाए रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ यीशु की मसीही उपाधि है। ‘मसीह’ हिन्दी में स्थापित रूप है और अभिषिक्त उद्धारकर्ता की उपाधि को स्पष्ट रखता है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहे
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘तुम्हारे साथ’ है। क्रियारहित आशीर्वचन को स्वाभाविक हिन्दी में पूरा करने के लिए ‘रहे’ जोड़ा गया है; ‘तुम्हारे’ समुदाय को संबोधित बहुवचन है।
theological_decisions:
- issue: Χριστοῦ को पौलुस के समापन आशीर्वचन में कैसे व्यक्त किया जाए
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यह पद यीशु की उपाधि को सुरक्षित रखता है और हिन्दी पाठकों के लिए प्रचलित, स्वाभाविक रूप है; इसे केवल उपनाम की तरह प्रस्तुत नहीं किया गया।
- issue: क्रियारहित यूनानी आशीर्वचन का हिन्दी रूप
  choice: अनुग्रह तुम्हारे साथ रहे
  alternative: अनुग्रह तुम्हारे साथ हो
  rationale: दोनों सम्भव हैं, पर ‘रहे’ निरंतर संगति की कामना को स्वाभाविक हिन्दी आशीर्वचन के रूप में व्यक्त करता है, बिना यूनानी में अनुपस्थित किसी अतिरिक्त धार्मिक विचार को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन। ‘तुम्हारे’ का प्रयोग पूरी थिस्सलुनीकी कलीसिया को संबोधित बहुवचन के रूप में किया गया है। मुख्य पाठ SBLGNT के संक्षिप्त पाठ का अनुसरण करता है और पाठांतर को पादटिप्पणी में रखता है।
