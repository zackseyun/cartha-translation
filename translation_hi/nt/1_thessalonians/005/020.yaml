translation:
  language: hi
  text: भविष्यवाणियों को तुच्छ मत समझो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भविष्यसूचक वचनों को।’
    reason: प्रोफेतेइआस (προφητείας) भविष्यवाणी के कथनों या अभिव्यक्तियों को भी सूचित कर सकता है; यह विकल्प उस अर्थ को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: προφητείας
  choice: भविष्यवाणियों
  rationale: यह προφητεία का कर्मकारक बहुवचन है और भविष्यवाणी के अलग-अलग कथनों या अभिव्यक्तियों की ओर संकेत करता है। ‘भविष्यवाणियों’ स्वाभाविक हिन्दी है और यूनानी बहुवचन को बनाए रखता है।
- source_word: μὴ
  choice: न
  rationale: वर्तमानकालीन आज्ञार्थक के साथ यह सामान्य निषेध है; हिन्दी में ‘न ... समझो’ इसकी शक्ति को बिना अनावश्यक रूप से बढ़ाए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξουθενεῖτε
  choice: तुच्छ न समझो
  rationale: क्रिया का अर्थ किसी को या किसी बात को नगण्य मानना, उसका तिरस्कार करना या उसे हेय समझना है। ‘तुच्छ न समझो’ संक्षिप्त, सहज और अर्थ की अवमाननापूर्ण उपेक्षा को सुरक्षित रखता है; केवल ‘अस्वीकार न करो’ अर्थ को अधिक संकीर्ण कर देता।
theological_decisions:
- issue: आरम्भिक मसीही सभा के संदर्भ में ‘भविष्यवाणियों’ का अर्थ
  choice: व्यापक शब्द ‘भविष्यवाणियों’ को किसी खास प्रक्रिया या बाद की धर्मसैद्धांतिक श्रेणी तक सीमित किए बिना बनाए रखना।
  alternative: ‘भविष्यसूचक वचनों’ अथवा ‘परमेश्वर की ओर से बताए जाने का दावा किए गए संदेशों’ के रूप में स्पष्ट करना।
  rationale: पद सभा में भविष्यवाणी से जुड़े कथनों को तुच्छ मानने से रोकता है, पर यूनानी शब्द स्वयं इस विषय पर बाद के समाप्तिवादी या निरंतरतावादी निष्कर्ष तय नहीं करता। सीधा और व्यापक अनुवाद मूल धर्मसैद्धांतिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज आज्ञार्थक शैली। ‘भविष्यवाणियों’ मूल के बहुवचन को और ‘तुच्छ न समझो’ अवमाननापूर्ण उपेक्षा के भाव को बनाए रखते हैं।
