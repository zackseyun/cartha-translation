lexical_decisions:
- source_word: ἀπέχεσθε
  choice: दूर रहो
  rationale: वर्तमानकालीन मध्यम आज्ञार्थक, द्वितीय पुरुष बहुवचन, निरंतर बचते रहने का आह्वान करता है। ‘दूर रहो’ स्वाभाविक, स्पष्ट और आज्ञा के बल को बनाए रखता है।
- source_word: ἀπὸ
  choice: से
  rationale: ἀπέχομαι के साथ अलगाव या दूरी का सामान्य अर्थ व्यक्त करता है।
- source_word: παντὸς
  choice: हर
  rationale: εἴδους के साथ इसका अर्थ ‘हर प्रकार’ है; आधुनिक हिन्दी में ‘हर’ सहज और सीधा है।
- source_word: εἴδους
  choice: प्रकार
  rationale: इस संदर्भ में εἶδος का अर्थ केवल बाहरी ‘दिखावट’ के बजाय ‘प्रकार’ या ‘रूप’ अधिक स्वाभाविक है।
- source_word: πονηροῦ
  choice: बुराई
  rationale: यह εἴδους को विशेषित करने वाला संबंधकारक एकवचन है; ‘बुराई’ सीधा और सामान्य हिन्दी पर्याय है।
theological_decisions:
- issue: ἀπὸ παντὸς εἴδους πονηροῦ में εἴδους का अर्थ
  choice: हर प्रकार की बुराई
  alternative: बुराई के हर रूप से; परंपरागत रूप से, बुराई की हर दिखावट से
  rationale: यहाँ εἶδος का अर्थ ‘प्रकार’ या ‘रूप’ होना अधिक संभावित है। ‘दिखावट’ वाला अनुवाद केवल बुरा दिखाई देने वाली बातों से बचने का अर्थ दे सकता है, जो इस संदर्भ में शब्द के आशय को आवश्यकता से अधिक सीमित या परिवर्तित करता है। विकल्पों को पादटिप्पणी में पारदर्शी रूप से रखा गया है।
