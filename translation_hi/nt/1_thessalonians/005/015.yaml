  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: hi
  text: सावधान रहो कि कोई भी किसी को बुराई के बदले बुराई न चुकाए; बल्कि हमेशा एक-दूसरे के प्रति और सबके प्रति भलाई करने का प्रयत्न करते रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एक-दूसरे” संभवतः साथी विश्वासियों की ओर, और “सबके” उससे आगे सभी लोगों की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: सावधान रहो
  rationale: यह बहुवचन आज्ञार्थक यहाँ केवल देखने नहीं, बल्कि समुदाय को सतर्क रहने और ध्यान रखने का निर्देश देता है।
- source_word: μή τις ... ἀποδῷ
  choice: कि कोई भी ... न करे
  rationale: ὁρᾶτε के साथ यह उस व्यवहार को व्यक्त करता है जिसे रोकना है; आधुनिक हिन्दी में यह स्वाभाविक निषेधात्मक रचना है।
- source_word: κακὸν ἀντὶ κακοῦ
  choice: बुराई के बदले बुराई
  rationale: यह प्रतिशोध का प्रचलित सूत्र है और मूल की पुनरुक्ति तथा व्यापक नैतिक अर्थ को बनाए रखता है।
- source_word: τινι
  choice: किसी के साथ
  rationale: सम्प्रदान कारक उस व्यक्ति को सूचित करता है जिसके प्रति बदला चुकाया जाता है; हिन्दी में इस क्रिया के साथ यह स्वाभाविक प्रयोग है।
- source_word: ἀποδῷ
  choice: करे
  rationale: संदर्भ में इसका अर्थ पूर्व बुराई के प्रत्युत्तर में वैसी ही बुराई करना है; 'बुराई के बदले बुराई करे' सहज हिन्दी में प्रतिशोध का भाव स्पष्ट करता है।
- source_word: πάντοτε
  choice: हमेशा
  rationale: यह कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: τὸ ἀγαθὸν
  choice: भलाई
  rationale: संज्ञीकृत विशेषण नैतिक रूप से अच्छी बात या हितकारी आचरण को दर्शाता है; 'भलाई' सामान्य पाठक के लिए संक्षिप्त और स्वाभाविक है।
- source_word: διώκετε
  choice: करने में लगे रहो
  rationale: यह निरंतर, सक्रिय और उत्सुक प्रयास का आज्ञार्थक भाव व्यक्त करता है, न कि केवल भलाई को पसंद करने का।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे के प्रति
  rationale: εἰς यहाँ आचरण की संबंधपरक दिशा बताता है और पारस्परिक समुदाय को सूचित करता है।
- source_word: καὶ εἰς πάντας
  choice: और सबके प्रति
  rationale: यह पहले पारस्परिक दायरे से आगे व्यापक समूह की ओर संकेत करता है, पर अनावश्यक व्याख्या जोड़े बिना मूल की संक्षिप्तता रखता है।
theological_decisions:
- issue: मसीही नैतिक दायित्व का दायरा
  choice: '''एक-दूसरे'' और ''सबके'' के बीच मूल पाठ का भेद बनाए रखा गया है, जिससे समुदाय के भीतर से व्यापक जनसमूह की ओर विस्तार का संकेत मिलता है।'
  alternative: '''सबके'' को केवल सभी विश्वासियों तक सीमित समझना।'
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας स्वाभाविक रूप से निकट पारस्परिक समूह से अधिक व्यापक दायरे की ओर बढ़ता है; अनुवाद इस संकेत को रखता है, पर व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामुदायिक आज्ञा के लिए बहुवचन रूप, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शब्दावली।
