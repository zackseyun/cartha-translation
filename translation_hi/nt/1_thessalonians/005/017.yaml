lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: निरन्तर
  rationale: यह क्रियाविशेषण लगातार अथवा बार-बार दृढ़ता से जारी रहने का भाव देता है। ‘निरन्तर’ यूनानी की व्यापकता बनाए रखता है और इसे हर क्षण बिना किसी विराम के केवल मौखिक प्रार्थना करने की गणितीय माँग नहीं बनाता।
- source_word: προσεύχεσθε
  choice: प्रार्थना करते रहो
  rationale: वर्तमानकालिक आज्ञार्थक रूप बहुवचन में समुदाय को संबोधित करता है और जारी रहने वाली अथवा नियमित क्रिया का आह्वान करता है। ‘करते रहो’ इस पक्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आज्ञा का व्यावहारिक आशय
  choice: प्रार्थना में लगातार और नियमित रूप से लगे रहने का सामान्य आह्वान
  alternative: हर क्षण बिना रुके स्पष्ट शब्दों में प्रार्थना करने की अक्षरशः माँग
  rationale: वर्तमानकालिक आज्ञार्थक और ἀδιαλείπτως का मेल प्रार्थना में सतत समर्पण और दृढ़ नियमितता का आग्रह करता है। अनुवाद संक्षिप्त आज्ञा की शक्ति बनाए रखते हुए किसी संकीर्ण तपस्वी या सांप्रदायिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और सामान्य आधुनिक हिन्दी। ‘निरन्तर’ औपचारिक होते हुए भी व्यापक रूप से समझा जाता है; ‘प्रार्थना करते रहो’ सामूहिक आज्ञा और जारी रहने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
