  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: hi
  text: इसलिए हम दूसरों की तरह सोते न रहें, बल्कि जागते और संयमी रहें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संयमी रहें” के लिए “होश में रहें” या “सचेत रहें” भी हो सकता है। यूनानी क्रिया का मूल अर्थ नशे से मुक्त या होश में रहना है; प्रसंग में इसमें मानसिक स्पष्टता और आत्मसंयम का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले विचार से निकलने वाले व्यावहारिक निष्कर्ष को दिखाता है; आधुनिक हिन्दी में ‘इसलिए’ स्वाभाविक और पर्याप्त रूप से दृढ़ है।
- source_word: μὴ καθεύδωμεν
  choice: हम ... सोते न रहें
  rationale: μή के साथ वर्तमान विधिलिंग सामूहिक आग्रह व्यक्त करता है। ‘सोते न रहें’ चलती हुई अवस्था से बचने का भाव देता है और पौलुस के नींद-जागने के रूपक को बनाए रखता है।
- source_word: ὡς οἱ λοιποί
  choice: दूसरों की तरह
  rationale: οἱ λοιποί प्रसंग में विश्वासियों से अलग बाकी लोगों को सूचित करता है। ‘दूसरों की तरह’ सहज हिन्दी है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह निषेध के बाद सकारात्मक और तीखा विरोध प्रस्तुत करता है; हिन्दी में ‘बल्कि’ इस संरचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: γρηγορῶμεν
  choice: जागते ... रहें
  rationale: यह καθεύδωμεν के ठीक विपरीत जागे रहने का चित्र बनाए रखता है, साथ ही प्रसंग में निहित चौकसी का भाव भी ग्रहण कर सकता है।
- source_word: νήφωμεν
  choice: सचेत रहें
  rationale: νήφω नशे से मुक्त होने के मूल भाव से मानसिक स्पष्टता, संयम और सावधानी तक विस्तृत होता है। ‘सचेत’ आधुनिक हिन्दी में स्पष्ट है; पादटिप्पणी ‘संयमी’ विकल्प देकर मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
theological_decisions:
- issue: नींद और जागने के रूपक का नैतिक-आत्मिक बल
  choice: मुख्य पाठ में ‘सोते’ और ‘जागते’ का चित्र बनाए रखा गया है।
  alternative: इसे सीधे ‘लापरवाह न रहें, बल्कि चौकस रहें’ के रूप में समझाकर कहना।
  rationale: आसपास का प्रसंग रात, अंधकार और ज्योति की पारस्परिक छवियों पर टिका है। मूल रूपक रखने से पौलुस की धर्मवैचारिक भाषा बचती है और उसका अर्थ अधिक संकीर्ण नहीं होता।
- issue: νήφω की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘सचेत रहें’, और पादटिप्पणी में ‘संयमी रहें’ का विकल्प।
  alternative: ‘नशे में न रहें’ अथवा केवल ‘संयमी रहें’।
  rationale: क्रिया में शाब्दिक मद्यत्याग और उससे निकले मानसिक स्पष्टता तथा आत्मसंयम—दोनों की प्रतिध्वनि हो सकती है। ‘सचेत’ प्रसंग के जागरण से स्वाभाविक रूप से जुड़ता है, जबकि पादटिप्पणी व्यापक नैतिक भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, सामूहिक उपदेशात्मक और गरिमापूर्ण रूप। ‘हम ... न रहें’ तथा ‘जागते ... रहें’ से यूनानी विधिलिंग का सहभागी आग्रह व्यक्त किया गया है।
