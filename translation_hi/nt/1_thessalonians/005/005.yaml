  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: hi
  text: क्योंकि तुम सब ज्योति के पुत्र और दिन के पुत्र[a] हो। हम न रात के हैं, न अंधकार के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्योति की संतान और दिन की संतान।” यूनानी में शाब्दिक रूप से “पुत्र” है; यह उन लोगों के लिए एक मुहावरा है जो ज्योति और दिन से संबंधित हैं या उनके गुण से पहचाने जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: सब
  rationale: ‘तुम सब’ यूनानी पद के समावेशी और बलयुक्त अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक को स्पष्ट रूप से बनाए रखता है।
- source_word: υἱοὶ
  choice: पुत्र
  rationale: यूनानी में पुल्लिंग बहुवचन ‘पुत्र’ है; यहाँ यह किसी वर्ग से संबंध रखने या उसके गुण से पहचाने जाने का मुहावरा है। मुख्य पाठ मूल रूपक को रखता है और पादटिप्पणी उसके समावेशी आशय को स्पष्ट करती है।
- source_word: φωτός
  choice: ज्योति
  rationale: यह नैतिक और आत्मिक रूपक को तथा ‘अंधकार’ के साथ उसके विरोध को गरिमापूर्ण, परिचित बाइबलीय हिन्दी में बनाए रखता है।
- source_word: ἡμέρας
  choice: दिन
  rationale: यह ज्योति के समानांतर रूपक और रात के साथ स्पष्ट विरोध को सुरक्षित रखता है।
- source_word: οὐκ ἐσμὲν
  choice: हम ... नहीं हैं
  rationale: मूल पाठ में ‘तुम’ से ‘हम’ की ओर पुरुष-वचन का परिवर्तन है; उसे समतल किए बिना सुरक्षित रखा गया है।
- source_word: νυκτός
  choice: रात के
  rationale: संबंध या संबद्धता बताने वाले संबंधकारक को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σκότους
  choice: अंधकार के
  rationale: मूल नैतिक-आत्मिक विरोध को बनाए रखता है और ‘रात’ के साथ समानांतर बैठता है।
theological_decisions:
- issue: υἱοὶ φωτός / υἱοὶ ἡμέρας में लिंगयुक्त पारिवारिक रूपक
  choice: ज्योति के पुत्र और दिन के पुत्र
  alternative: ज्योति की संतान और दिन की संतान
  rationale: मूल यूनानी ‘पुत्र’ कहता है, पर मुहावरे का आशय केवल पुरुषों तक सीमित नहीं, बल्कि उन सभी से है जो ज्योति और दिन से संबंधित या उनके गुण से पहचाने जाते हैं। मुख्य पाठ मूल रूपक रखता है; पादटिप्पणी समावेशी अर्थ बताती है।
- issue: द्वितीय पुरुष से प्रथम पुरुष बहुवचन में परिवर्तन
  choice: तुम सब ... हम न ...
  alternative: तुम सब ... तुम न ...
  rationale: यूनानी पाठ पहले पाठकों को ‘तुम’ कहकर संबोधित करता है और फिर लेखक को सम्मिलित करते हुए ‘हम’ कहता है। इस आलंकारिक परिवर्तन को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘ज्योति’ और ‘अंधकार’ से रूपकीय विरोध स्पष्ट रहता है; ‘तुम’ से ‘हम’ का मूल परिवर्तन और ‘पुत्र’ का पारिवारिक रूपक सुरक्षित रखा गया है।
