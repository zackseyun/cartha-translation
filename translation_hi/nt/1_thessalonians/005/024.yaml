lexical_decisions:
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह विधेय विशेषण बुलाने वाले परमेश्वर की निष्ठा और भरोसेमंदी व्यक्त करता है। ‘विश्वासयोग्य’ स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ὁ καλῶν
  choice: जो … बुलाता है
  rationale: संज्ञात्मक वर्तमान कृदंत परमेश्वर को समुदाय को बुलाने वाले के रूप में प्रस्तुत करता है; यह रूप उसकी जारी भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन है। हिन्दी में ‘तुम्हें’ पूरी मण्डली को संबोधित करने वाला सहज बहुवचन रूप है।
- source_word: ὃς καὶ ποιήσει
  choice: वह यह करेगा भी
  rationale: यह सम्बन्धवाचक उपवाक्य उसी बुलाने वाले की ओर संकेत करता है। ‘भी’ καὶ की निरंतरता और बल को रखता है, जबकि ‘यह’ पिछले पद में माँगे गए पवित्रीकरण और सुरक्षित रखे जाने की ओर संकेत करता है।
theological_decisions:
- issue: ποιήσει का निहित कर्म
  choice: वह यह करेगा भी
  alternative: वह इसे पूरा भी करेगा
  rationale: यूनानी पाठ कर्म को स्पष्ट नहीं करता। ‘यह’ पिछले पद की प्रार्थना की ओर संकेत करता है, पर कार्य के स्वरूप या प्रक्रिया को आवश्यकता से अधिक निश्चित नहीं करता।
