source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: hi
  text: पर हम, जो दिन के हैं, विश्वास[a] और प्रेम का छाती का कवच तथा उद्धार की आशा का टोप[b] पहने हुए होश में रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भरोसा’ अथवा ‘विश्वासयोग्यता’। यूनानी शब्द πίστις के ये अर्थ भी हो सकते हैं; यहाँ ‘विश्वास’ मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उद्धार की आशा को टोप के रूप में’।
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: पर हम
  rationale: δέ पिछले पदों में बताए गए लोगों से विरोध दिखाता है; ‘पर हम’ इसे सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμέρας ὄντες
  choice: जो दिन के हैं
  rationale: यह पदबंध केवल दिन के समय होने की बात नहीं, बल्कि दिन से संबंध या उसके क्षेत्र में होने का रूपक व्यक्त करता है। हिन्दी में यह रूपक बिना अतिरिक्त व्याख्या के बना रहता है।
- source_word: νήφωμεν
  choice: होश में रहें
  rationale: νήφω में नशे से मुक्त होने का शाब्दिक भाव और सतर्क, आत्म-संयमी रहने का लाक्षणिक भाव दोनों हो सकते हैं। ‘होश में रहें’ रात-दिन और जागते रहने के निकट प्रसंग में दोनों प्रतिध्वनियों को यथासंभव बनाए रखता है।
- source_word: ἐνδυσάμενοι
  choice: पहने रहें
  rationale: कृदंत मुख्य आग्रह के साथ कवच धारण किए रहने की परिस्थिति या रीति बताता है। हिन्दी में ‘पहने रहें’ सतत नैतिक आग्रह के संदर्भ में स्वाभाविक है, यद्यपि यूनानी का रूप धारण करने की क्रिया को पूर्ववर्ती या पूर्ण मानकर भी समझा जा सकता है।
- source_word: θώρακα
  choice: झिलम
  rationale: θώραξ सैनिक के धड़ और छाती की रक्षा करने वाला कवच है। ‘झिलम’ इस विशिष्ट सैन्य बिंब को सामान्य ‘कवच’ की अपेक्षा अधिक ठीक रखता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का सामान्य अर्थ यहाँ ‘विश्वास’ है और प्रेम तथा आशा के साथ इसका मेल पौलुस के परिचित सद्गुण-समूह से होता है। ‘भरोसा’ और ‘विश्वासयोग्यता’ संभव अर्थ हैं, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: ἀγάπη के लिए ‘प्रेम’ आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल शब्द है।
- source_word: περικεφαλαίαν
  choice: टोप
  rationale: यह सिर की रक्षा करने वाले सैनिक टोप का सीधा उल्लेख है और युद्ध-सज्जा के रूपक को बनाए रखता है।
- source_word: ἐλπίδα σωτηρίας
  choice: उद्धार की आशा
  rationale: यह पदबंध उद्धार की ओर लगी या उद्धार से पहचानी जाने वाली आशा व्यक्त करता है। ‘उद्धार की आशा’ यूनानी की अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: कवच के रूपक में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: प्रेम और आशा के साथ सद्गुणों की त्रयी में ‘विश्वास’ सबसे स्वाभाविक मुख्य पाठ है, पर यूनानी शब्द में भरोसे या विश्वासयोग्यता का भाव भी संभव है; इसलिए उसे दबाया नहीं गया है।
- issue: ἡμέρας ὄντες का बल
  choice: जो दिन के हैं
  alternative: जो दिन से संबंध रखते हैं
  rationale: मुख्य पाठ मूल रूपक को संक्षिप्त रूप में रखता है और इसे केवल समय-सूचक या किसी विस्तृत सामुदायिक सिद्धांत में नहीं बदलता।
- issue: ἐλπίδα σωτηρίας और περικεφαλαίαν का संबंध
  choice: उद्धार की आशा का टोप
  alternative: उद्धार की आशा को टोप के रूप में
  rationale: दोनों पद एक ही सैन्य रूपक व्यक्त करते हैं। मुख्य रूप हिन्दी में अधिक सहज है, जबकि विकल्प यूनानी के समानाधिकरण-सदृश विन्यास को अधिक स्पष्ट दिखाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दिन के हैं’ मूल रूपक को बनाए रखता है; ‘होश में रहें’ शाब्दिक संयम और लाक्षणिक सतर्कता दोनों को सुनाई देता है। सैन्य बिंब के लिए ‘झिलम’ और ‘टोप’ प्रयुक्त हुए हैं।
