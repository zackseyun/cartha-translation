lexical_decisions:
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: περί नए विषय का परिचय देता है और δέ प्रसंग-परिवर्तन सूचित करता है। हिन्दी में वाक्य के आरम्भ में ‘के विषय में’ स्वाभाविक रूप से यह परिवर्तन व्यक्त करता है; कोई स्पष्ट कालवाचक ‘अब’ नहीं जोड़ा गया।
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: समयों और नियत अवसरों
  rationale: χρόνος समय की अवधि या प्रवाह को, जबकि καιρός किसी विशेष, उपयुक्त अथवा निर्धारित अवसर को सूचित कर सकता है। ‘समयों और नियत अवसरों’ दोनों शब्दों का भेद और युगान्त-संबंधी संदर्भ बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: पुल्लिंग बहुवचन संबोधन का स्रोत-रूप सुरक्षित रखा गया है। यह संबोधन संभवतः पूरी विश्वासी मंडली को शामिल करता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οὐ χρείαν ἔχετε
  choice: तुम्हें ... आवश्यकता नहीं है
  rationale: यह अभिव्यक्ति आवश्यकता के अभाव को बताती है। हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: ὑμῖν γράφεσθαι
  choice: तुम्हें कुछ लिखे जाने
  rationale: निष्क्रिय infinitive γράφεσθαι में लिखने वाला स्पष्ट नहीं किया गया है। हिन्दी का निष्क्रिय रूप उसी अनिर्दिष्ट कर्ता को बनाए रखता है; ‘कुछ’ वाक्य को सहज बनाता है, बिना विषय-वस्तु को अनावश्यक रूप से सीमित किए।
theological_decisions:
- issue: कलीसिया के लिए लिंगसूचक संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: यूनानी ἀδελφοί का व्याकरणिक पुल्लिंग रूप मुख्य पाठ में रखा गया है, जबकि पूरी विश्वासी मंडली के संभावित समावेशी अर्थ को पादटिप्पणी में बताया गया है।
- issue: χρόνοι और καιροί का युगान्त-संबंधी अर्थ
  choice: समयों और नियत अवसरों
  alternative: समय और ऋतुओं
  rationale: ‘नियत अवसरों’ से καιροί के उपयुक्त या निर्धारित क्षणों का भाव व्यक्त होता है, पर पाठ यह निर्धारित नहीं करता कि प्रत्येक अवसर किस प्रकार या किसके द्वारा नियत है।
