  choice: मुख्य पाठ में ‘प्रोत्साहित करते रहो’
  alternative: ‘समझाते रहो’ या ‘आग्रह करते रहो’
  rationale: संदर्भ में परस्पर दृढ़ता प्रमुख है, पर यूनानी शब्द केवल सांत्वना तक सीमित नहीं; इसलिए वैकल्पिक प्रेरक/आग्रहपूर्ण अर्थ पादटिप्पणी में रखा गया है।
