lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से जोड़ता है।
- source_word: παρακαλεῖτε
  choice: प्रोत्साहित करते रहो
  rationale: यहाँ परस्पर हौसला देने और भलाई के लिए प्रेरित करने का व्यापक भाव है; वर्तमानकालीन आज्ञा के चलते जारी अभ्यास का संकेत भी रखा गया है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: यह पारस्परिक क्रिया को आधुनिक मानक हिन्दी में सहजता से व्यक्त करता है।
- source_word: οἰκοδομεῖτε
  choice: उन्नत करते रहो
  rationale: यूनानी निर्माण-रूपक का आशय किसी व्यक्ति को आत्मिक और सामुदायिक रूप से दृढ़ बनाना है। ‘उन्नत करना’ हिन्दी में संक्षिप्त और गरिमापूर्ण है, यद्यपि निर्माण का प्रत्यक्ष बिंब कुछ मंद पड़ता है।
- source_word: εἷς τὸν ἕνα
  choice: एक-दूसरे को
  rationale: यूनानी मुहावरे के परस्पर और व्यक्ति-व्यक्ति भाव को स्वाभाविक हिन्दी में दोहराकर सुरक्षित रखा गया है।
- source_word: καθὼς καὶ ποιεῖτε
  choice: जैसा तुम कर भी रहे हो
  rationale: यह तुलना, καί के ‘भी’ भाव, वर्तमान अभ्यास और निहित सराहना—सभी को व्यक्त करता है।
