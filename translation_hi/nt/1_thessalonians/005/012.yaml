base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: hi
  text: हे भाइयो, हम आपसे अनुरोध करते हैं कि जो लोग आपके बीच परिश्रम करते हैं, प्रभु में आपकी अगुवाई करते हैं[b] और आपको समझाते-चेताते हैं, उन्हें मान दें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “प्रभु में आपके ऊपर हैं” अथवा “प्रभु में आपकी देखरेख करते हैं।”
    reason: alternative_reading
  - marker: c
    text: या, “उन्हें पहचानें” अथवा “उनकी कदर करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: हम आपसे अनुरोध करते हैं
  rationale: यह क्रिया यहाँ आदेश नहीं, बल्कि नम्र पासबानी निवेदन प्रकट करती है; ‘अनुरोध करते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: δέ यहाँ हल्का प्रसंग-संक्रमण सूचित करता है; हिन्दी में अनावश्यक ‘अब’ या विरोधसूचक ‘परन्तु’ जोड़े बिना वाक्य स्वाभाविक रहता है।
- source_word: ἀδελφοί
  choice: हे भाइयो और बहनो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, पर मण्डली को सम्बोधित करते समय इसमें स्त्री-पुरुष दोनों सम्मिलित हैं; पादटिप्पणी मूल रूप स्पष्ट करती है।
- source_word: εἰδέναι
  choice: उन्हें मान दें
  rationale: इस प्रसंग में शाब्दिक ‘जानना’ से बढ़कर पहचानने, कदर करने और सम्मान देने का भाव है; ‘मान दें’ हिन्दी में इस सम्बन्धपरक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: κοπιῶντας
  choice: जो ... परिश्रम करते हैं
  rationale: κοπιάω कठिन और थका देने वाले श्रम पर बल देता है; ‘परिश्रम’ उसका भार और गरिमा बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: आपके बीच
  rationale: यह मण्डली के भीतर किए जाने वाले कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προϊσταμένους ὑμῶν
  choice: आपकी अगुवाई करते हैं
  rationale: प्रयोग नेतृत्व, देखरेख या उत्तरदायित्वपूर्ण संचालन को सूचित कर सकता है; ‘अगुवाई’ अधिकार को व्यक्त करता है, पर किसी कठोर पदानुक्रम को आरोपित नहीं करता।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह नेतृत्व को प्रभु से उसके सम्बन्ध और क्षेत्र में स्थित करता है; पारदर्शी पारम्परिक अभिव्यक्ति बनाए रखी गई है।
- source_word: νουθετοῦντας
  choice: आपको समझाते-चेताते हैं
  rationale: νουθετέω में शिक्षाप्रद समझाइश और सुधारात्मक चेतावनी दोनों निहित हैं; संयुक्त हिन्दी पद दोनों पहलुओं को सुरक्षित रखता है।
theological_decisions:
- issue: मण्डली के सम्बोधन ἀδελφοί का लिंग और समावेश
  choice: मुख्य पाठ में ‘हे भाइयो और बहनो’
  alternative: ‘हे भाइयो’
  rationale: स्रोत का रूप पुल्लिंग है, किन्तु यहाँ सम्बोधन पूरी मण्डली के लिए है। समावेशी अर्थ मुख्य पाठ में स्वाभाविक रूप से दिया गया है और मूल रूप पादटिप्पणी में सुरक्षित है।
- issue: εἰδέναι द्वारा सेवकों के प्रति अपेक्षित प्रतिक्रिया
  choice: ‘उन्हें मान दें’
  alternative: ‘उन्हें पहचानें’ या ‘उनकी कदर करें’
  rationale: क्रिया यहाँ केवल परिचय नहीं, बल्कि उनकी सेवा को पहचानने और उचित आदर देने का संकेत करती है; इससे आज्ञापालन या पूज्यभाव जैसी अधिक प्रबल कलीसियाई धारणा नहीं जोड़ी गई।
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ की नेतृत्व-संबंधी शक्ति
  choice: ‘प्रभु में आपकी अगुवाई करते हैं’
  alternative: ‘प्रभु में आपके ऊपर नियुक्त हैं’ या ‘प्रभु में आपकी देखभाल करते हैं’
  rationale: यूनानी पद में नेतृत्व/देखरेख का वास्तविक भाव है, पर उसका ठीक प्रशासनिक ढाँचा निर्दिष्ट नहीं है। चुना हुआ रूप अधिकार और सेवा दोनों की सम्भावना खुली रखता है।
- issue: νουθετέω का पासबानी और सुधारात्मक आयाम
  choice: ‘समझाते-चेताते हैं’
  alternative: ‘चेतावनी देते हैं’ या ‘शिक्षा देते हैं’
  rationale: केवल ‘शिक्षा’ सुधारात्मक धार को कम कर देती है और केवल ‘चेतावनी’ पासबानी समझाइश को संकुचित करती है; संयुक्त पद मूल तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण बहुवचन ‘आप’ अपनाया गया है। शैली dignified किन्तु सामान्य पाठक के लिए सहज है। ‘मण्डली’ केवल पादटिप्पणी में प्रसंग स्पष्ट करने के लिए आया है; मुख्य पाठ में स्रोत से अतिरिक्त संस्थागत पदावली नहीं जोड़ी गई।
