  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: hi
  text: पर हे भाइयो[a], तुम अंधकार में नहीं हो कि वह दिन[b] तुम्हें चोर की तरह आ घेरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, समावेशी अर्थ में ‘भाइयो और बहनो।’
    reason: lexical_alternative
  - marker: b
    text: निकट संदर्भ में इसका अर्थ ‘प्रभु का दिन’ है।
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: पर ... तुम
  rationale: δέ पिछले वर्णन के विपरीत स्थिति दिखाता है और स्पष्ट सर्वनाम ὑμεῖς बल देता है; हिंदी में ‘पर ... तुम’ दोनों बातों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: संबोधन के पुल्लिंग बहुवचन को मुख्य पाठ में औपचारिक रूप से रखा गया है; पूरी मंडली को समेटने वाला संभावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν σκότει
  choice: अंधकार में
  rationale: यह चुनाव मूल रूपक तथा उसके नैतिक और आत्मिक संकेत को बनाए रखता है।
- source_word: ἵνα
  choice: कि
  rationale: हिंदी में ‘नहीं हो कि...’ यूनानी वाक्य की परिणामी/परिस्थितिजन्य कड़ी को सहज रूप से व्यक्त करता है और प्रयोजन या परिणाम में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἡ ἡμέρα
  choice: वह दिन
  rationale: निश्चित उपपद और निकट संदर्भ में पहले से उल्लिखित दिन की ओर संकेत को स्वाभाविक हिंदी में व्यक्त करता है, बिना मुख्य पाठ में पूरा पद ‘प्रभु का दिन’ जोड़ने के।
- source_word: ὡς κλέπτης
  choice: चोर की तरह
  rationale: तुलना को स्पष्ट और आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: καταλάβῃ
  choice: आ दबोचे
  rationale: क्रिया के अचानक पकड़ लेने या आ पहुँचकर काबू कर लेने के भाव को चोर की उपमा के साथ सजीव और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मिश्रित मंडली के लिए लिंगसूचक संबोधन ἀδελφοί
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ यूनानी के पुल्लिंग संबोधन को बनाए रखता है, जबकि संभावित समावेशी आशय को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἡ ἡμέρα का युगांत-संबंधी संदर्भ
  choice: वह दिन
  alternative: प्रभु का दिन
  rationale: निकट संदर्भ में आशय ‘प्रभु का दिन’ है, पर इस पद में यूनानी पाठ केवल ‘दिन’ कहता है; इसलिए पूरा पद मुख्य पाठ में न जोड़कर पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘अंधकार’ मूल रूपक को बनाए रखता है और ‘आ दबोचे’ अचानक आकर पकड़ लेने की शक्ति को सहज हिंदी में व्यक्त करता है।
