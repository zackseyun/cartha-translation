- source_word: ἡγεῖσθαι
  choice: आदर करो
  rationale: यहाँ क्रिया का अर्थ मूल्यांकन करके ऊँचा मानना है, न कि अगुवाई करना। हिंदी में ‘आदर करो’ स्वाभाविक रूप से उस सकारात्मक सम्मान को व्यक्त करता है।
- source_word: ὑπερεκπερισσοῦ
  choice: बहुत ही अधिक
  rationale: यह असामान्य रूप से प्रबल क्रियाविशेषण है। ‘बहुत ही अधिक’ उसकी तीव्रता को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम से
  rationale: यह सम्मान करने के ढंग या भाव को बताता है। ‘प्रेम से’ ἀγάπη को स्पष्ट रखते हुए हिंदी में स्वाभाविक है।
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: उनके काम के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या आधार व्यक्त करता है; यह अनुवाद संज्ञा ἔργον को भी बनाए रखता है।
- source_word: εἰρηνεύετε
  choice: शांति से रहो
  rationale: वर्तमान आज्ञार्थक निरंतर शांतिपूर्ण जीवन की पुकार देता है। ‘शांति से रहो’ आधुनिक हिंदी में स्वाभाविक और सामुदायिक संदर्भ के अनुकूल है।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: बहुवचन आत्मवाचक सर्वनाम समुदाय के भीतर पारस्परिक संबंध को दर्शाता है; ‘आपस में’ इसका सहज हिंदी रूप है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद की विनतियों से इस निर्देश को जोड़ता है।
- source_word: αὐτούς
  choice: उनका
  rationale: सर्वनाम पिछले पद में बताए गए परिश्रम करने और अगुवाई/चेतावनी देने वालों की ओर संकेत करता है। हिंदी वाक्य में संबंधकारक रूप स्वाभाविक है।
