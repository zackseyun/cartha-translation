id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: hi
  text: जब वे कहें, “शान्ति और सुरक्षा,” तब उन पर अचानक विनाश आ पड़ेगा, जैसे गर्भवती स्त्री को प्रसव-पीड़ा होती है; और वे किसी भी तरह बच नहीं पाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: जब वे कहें
  rationale: ὅταν के साथ वर्तमान संभावनार्थक क्रिया भविष्याभिमुख अनिश्चित समय बताती है। ‘जब वे कहें’ हिन्दी में स्वाभाविक है और यूनानी के अनिर्दिष्ट बहुवचन कर्ता को बनाए रखता है।
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: शान्ति और सुरक्षा
  rationale: εἰρήνη के लिए ‘शान्ति’ और ἀσφάλεια के लिए ‘सुरक्षा’ इस सार्वजनिक आश्वासन जैसे कथन के स्वाभाविक और व्यापक समतुल्य हैं।
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: अचानक विनाश आ पड़ेगा
  rationale: यह अभिव्यक्ति विनाश के आकस्मिक रूप से उन पर आ पहुँचने को व्यक्त करती है। ‘विनाश’ परिणाम की प्रकृति या अवधि को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: जैसे गर्भवती स्त्री को प्रसव-पीड़ा होती है
  rationale: ‘गर्भवती स्त्री’ यूनानी के शाब्दिक ‘गर्भ में रखनेवाली’ का स्वाभाविक हिन्दी रूप है; ‘प्रसव-पीड़ा’ ὠδίν के प्रसंगगत अर्थ और अचानक, अनिवार्य आरम्भ की उपमा को स्पष्ट रखती है।
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: वे किसी भी तरह बच नहीं पाएँगे
  rationale: οὐ μή के साथ संभावनार्थक क्रिया भविष्य के विषय में प्रबल निषेध है। ‘किसी भी तरह ... नहीं पाएँगे’ आधुनिक हिन्दी में उसका बल व्यक्त करता है।
theological_decisions:
- issue: अन्त-समय की चेतावनी में ὄλεθρος का स्वरूप
  choice: ‘विनाश’ रखा गया, पर उसके प्रकार या अवधि को स्पष्ट नहीं किया गया।
  alternative: ‘बरबादी’ या ‘सर्वनाश’
  rationale: पद निर्णायक न्याय की गंभीरता बताता है, किन्तु यह शब्द अकेले विनाश के सटीक प्रकार, चेतन दण्ड की अवधि, या अस्तित्व-समाप्ति का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘शान्ति’ की पारंपरिक वर्तनी रखी गई है। वाक्य की आकस्मिकता और अन्तिम प्रबल निषेध को स्वाभाविक हिन्दी में सुरक्षित किया गया है।
