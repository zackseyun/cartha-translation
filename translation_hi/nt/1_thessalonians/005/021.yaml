lexical_decisions:
- source_word: πάντα
  choice: सब बातों को
  rationale: नपुंसकलिंग बहुवचन कर्मकारक का व्यापक अर्थ बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; इसे केवल भविष्यवाणियों तक सीमित नहीं किया गया।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले निर्देशों से हल्का विरोध अथवा संक्रमण दिखाता है; ‘पर’ इस संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: δοκιμάζετε
  choice: परखो
  rationale: वर्तमान काल की आज्ञा निरंतर जाँचकर प्रामाणिकता या मूल्य निर्धारित करने का भाव देती है; ‘परखो’ हिन्दी में इस मूल्यांकनात्मक अर्थ को स्पष्ट रखता है।
- source_word: τὸ καλὸν
  choice: जो अच्छा है
  rationale: लेख सहित नपुंसकलिंग एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; यह रूप हिन्दी में स्वाभाविक है और अनावश्यक दार्शनिक अमूर्तन से बचता है।
- source_word: κατέχετε
  choice: दृढ़ता से थामे रहो
  rationale: यह जाँच के बाद किसी अच्छी बात को मजबूती और निरंतरता से पकड़े रहने या अपनाए रखने का भाव व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी और विवेक के संदर्भ में πάντα का दायरा
  choice: ‘सब बातों को’ कहकर आदेश का व्यापक दायरा सुरक्षित रखा गया है, जबकि निकटवर्ती संदर्भ में भविष्यवाणी की बातों को परखना विशेष रूप से सम्मिलित है।
  alternative: ‘सब भविष्यवाणियों को’ या ‘कही गई सब बातों को’
  rationale: पद 20 में भविष्यवाणियों का उल्लेख है, पर यूनानी पाठ में πάντα के साथ कोई सीमित करने वाली संज्ञा नहीं है। इसलिए अनुवाद को व्याख्यात्मक रूप से संकरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘परखो’ तथा ‘दृढ़ता से थामे रहो’ आज्ञाओं की निरंतर और सक्रिय प्रकृति व्यक्त करते हैं।
