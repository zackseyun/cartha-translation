  rationale: यह ἀδελφός का संबोधन-बहुवचन है। मुख्य पाठ में यूनानी का पुल्लिंग रूप रखा गया है; संभवतः पूरी, स्त्री-पुरुष दोनों वाली मंडली संबोधित है, इसलिए समावेशी अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: यह वर्तमानकालिक आज्ञार्थक, द्वितीय पुरुष बहुवचन रूप है। हिंदी में “प्रार्थना करो” स्वाभाविक आज्ञा है; यूनानी वर्तमान पक्ष से निरंतरता का भाव संभव है, पर यहाँ “प्रार्थना करते रहो” कहना अनावश्यक रूप से अधिक स्पष्ट होगा।
- source_word: περὶ
  choice: के लिए
  rationale: संबंधकारक ἡμῶν के साथ περί यहाँ प्रार्थना के विषय अथवा हित को व्यक्त करता है; हिंदी में “हमारे लिए” स्वाभाविक प्रयोग है।
- source_word: ἡμῶν
  choice: हमारे
  rationale: यह प्रथम पुरुष बहुवचन संबंधकारक सर्वनाम है और पौलुस तथा उसके सहकर्मियों की ओर संकेत करता है; पाठ से अधिक विशिष्टता जोड़े बिना इसे “हमारे” कहा गया है।
