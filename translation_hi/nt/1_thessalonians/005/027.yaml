  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। ‘शपथ देकर ... आदेश देता हूँ’ मूल की गंभीरता को बनाए रखता है; ‘पढ़कर सुनाया जाए’ सभा में श्रव्य पाठ को स्वाभाविक हिंदी में व्यक्त करता है।
