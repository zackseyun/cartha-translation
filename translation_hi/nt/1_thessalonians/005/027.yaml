  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: hi
  text: मैं तुम्हें प्रभु[a] की शपथ देकर यह आदेश देता हूँ कि यह पत्र सभी भाइयों[b] को पढ़कर सुनाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक: “प्रभु के नाम पर” या “प्रभु को साक्षी मानकर।” यूनानी अभिव्यक्ति में प्रभु को उस प्राधिकारी के रूप में आहूत किया गया है जिसके द्वारा यह गंभीर आदेश दिया जाता है।'
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” से संभवतः स्त्रियों सहित पूरी मंडली का अभिप्राय है; यूनानी शब्द ἀδελφοῖς पुल्लिंग बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: शपथ देकर ... आदेश देता हूँ
  rationale: क्रिया किसी को शपथ के द्वारा गंभीर रूप से बाध्य करने का भाव रखती है। यह हिंदी में उसके शपथ-संबंधी बल और गंभीर आदेश—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु की शपथ देकर
  rationale: ἐνορκίζω के साथ कर्मकारक पद उस व्यक्ति को सूचित कर सकता है जिसके नाम या अधिकार से शपथ दिलाई जाती है। यह अनुवाद प्रभु को आहूत प्राधिकारी के रूप में रखता है; वैकल्पिक व्याकरणिक समझ फुटनोट में दी गई है।
- source_word: ἀναγνωσθῆναι
  choice: पढ़कर सुनाया जाए
  rationale: कर्मवाच्य अनंत क्रिया का अर्थ ‘पढ़ा जाए’ है; सभा और पत्र के संदर्भ में सार्वजनिक रूप से सुनाकर पढ़ना निहित है। हिंदी में ‘पढ़कर सुनाया जाए’ इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ἐπιστολήν
  choice: यह पत्र
  rationale: यूनानी में निश्चित पद है और संदर्भ वर्तमान पत्र की ओर संकेत करता है। आधुनिक हिंदी में ‘यह पत्र’ स्वाभाविक है।
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: सभी भाइयों
  rationale: ἀδελφοῖς व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। पौलुस के प्रयोग में यह प्रायः स्त्रियों सहित पूरी मंडली को संबोधित करता है; उस संभावित समावेशी संदर्भ को फुटनोट में सुरक्षित रखा गया है।
theological_decisions:
- issue: मिश्रित-लिंग मंडली के संभावित संदर्भ में ἀδελφοῖς का अनुवाद
  choice: भाइयों
  alternative: भाइयों और बहनों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को बनाए रखता है, जबकि पौलुस के प्रयोग में पूरे विश्वास-समुदाय के सम्मिलित होने की संभावना को फुटनोट स्पष्ट करता है।
- issue: τὸν κύριον का शपथ-सूत्र में संबंध
  choice: प्रभु की शपथ देकर
  alternative: प्रभु के सामने
  rationale: यूनानी रचना प्रभु के नाम या अधिकार से शपथ दिलाने का अर्थ दे सकती है। ‘प्रभु के सामने’ प्रभु को साक्षी मानने का निकटवर्ती अर्थ व्यक्त करता है; वास्तविक अस्पष्टता फुटनोट में रखी गई है।
