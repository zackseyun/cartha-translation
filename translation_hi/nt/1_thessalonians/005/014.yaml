  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: hi
  text: 'और हे भाइयो,[a] हम तुमसे आग्रह करते हैं: जो अनुशासनहीन हैं, उन्हें चेताओ; जो हिम्मत हारनेवाले हैं, उन्हें ढाढ़स दो; जो कमज़ोर हैं, उन्हें सहारा दो; और सबके साथ धीरज रखो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे भाइयो और बहनो”; पौलुस पूरी मण्डली को सम्बोधित कर रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: हम आग्रह करते हैं
  rationale: यह प्रेरित की गंभीर किंतु आत्मीय विनती को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘उपदेश देते हैं’ की अपेक्षा इसमें आग्रह का बल अधिक स्पष्ट है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि पिछले उपदेशों से आगे बढ़ने का संकेत देता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन के पुल्लिंग बहुवचन रूप को मुख्य पाठ में बनाए रखा गया है; पूरी मण्डली के समावेशी आशय को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: νουθετεῖτε
  choice: चेताओ
  rationale: यह सुधार के उद्देश्य से सावधान करने और समझाने का भाव देता है; हिन्दी में संक्षिप्त और सहज है।
- source_word: ἀτάκτους
  choice: जो अनुशासनहीन हैं
  rationale: यह ἄτακτος के ‘व्यवस्था से बाहर’ या ‘अनियमित’ होने के व्यापक अर्थ को रखता है और इसे केवल आलस्य तक सीमित नहीं करता।
- source_word: παραμυθεῖσθε
  choice: ढाढ़स दो
  rationale: यह स्नेहपूर्ण वाणी से साहस और सांत्वना देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀλιγοψύχους
  choice: जो निराश हैं
  rationale: यह कम हिम्मत, भय या हतोत्साह की अवस्था को सामान्य पाठक के लिए स्पष्ट करता है, बिना कारण को विशेष रूप से निर्धारित किए।
- source_word: ἀντέχεσθε
  choice: सहारा दो
  rationale: सम्बन्धकारक के साथ क्रिया का अर्थ किसी से लगे रहना, उसका पक्ष लेना या उसे सम्भालना है; ‘सहारा दो’ निरन्तर सहयोग का भाव रखता है।
- source_word: τῶν ἀσθενῶν
  choice: जो कमज़ोर हैं
  rationale: यह शारीरिक, आत्मिक, नैतिक या सामाजिक कमज़ोरी में से किसी एक को अनावश्यक रूप से निश्चित किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: μακροθυμεῖτε
  choice: धीरज रखो
  rationale: यह लोगों के प्रति देर से क्रोधित होने और सहनशील बने रहने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρὸς πάντας
  choice: सबके साथ
  rationale: यह प्रत्येक व्यक्ति की ओर धैर्यपूर्ण व्यवहार के सार्वभौमिक विस्तार को मुहावरेदार हिन्दी में बताता है।
theological_decisions:
- issue: मण्डली को सम्बोधित ἀδελφοί का समावेशी आशय
  choice: मुख्य पाठ में ‘हे भाइयो’ रखा गया और पादटिप्पणी में ‘भाइयो और बहनो’ का आशय स्पष्ट किया गया।
  alternative: मुख्य पाठ में ‘हे भाइयो और बहनो’ लिखा जा सकता है।
  rationale: मूल का व्याकरणिक रूप पुल्लिंग बहुवचन है, पर सन्दर्भ में पौलुस पूरी मण्डली को सम्बोधित करता है; मुख्य पाठ और पादटिप्पणी मिलकर रूप और आशय दोनों को सुरक्षित रखते हैं।
- issue: कमज़ोरी का स्वरूप
  choice: ‘जो कमज़ोर हैं’ कहकर अर्थ को व्यापक रखा गया।
  alternative: इसे केवल शारीरिक रूप से दुर्बल, विश्वास में कमज़ोर या सामाजिक रूप से असहाय लोगों के लिए समझा जा सकता है।
  rationale: पद स्वयं कमज़ोरी का प्रकार निश्चित नहीं करता, इसलिए अनुवाद को भी धार्मिक या सामाजिक अर्थ में अनावश्यक रूप से सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मण्डली में सार्वजनिक पाठ के अनुकूल रखी गई है। समानान्तर आज्ञाओं को स्पष्ट करने के लिए अल्पविराम और अन्तिम ‘और’ का प्रयोग किया गया है। ‘ढाढ़स दो’ आत्मीय और प्रचलित है; ‘अनुशासनहीन’ ἀτάκτους की व्यापकता को केवल ‘आलसी’ तक सीमित होने से बचाता है।
