lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार करो
  rationale: यह बहुवचन में सीधी आज्ञा है। आधुनिक हिन्दी में ‘नमस्कार करो’ अभिवादन करने का स्वाभाविक और संक्षिप्त निर्देश है।
- source_word: ἀδελφοὺς
  choice: भाइयों
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है; इसलिए मुख्य पाठ में ‘भाइयों’ रखा गया है। प्रसंग में इसका आशय सम्पूर्ण विश्वासी समुदाय, अर्थात भाई-बहन दोनों, हो सकता है; यह सम्भावना पादटिप्पणी में दी गई है।
- source_word: πάντας
  choice: सब
  rationale: यह समूह के प्रत्येक सदस्य को सम्मिलित करने पर बल देता है; ‘सब भाइयों’ सहज और ठीक हिन्दी है।
- source_word: ἐν φιλήματι ἁγίῳ
  choice: पवित्र चुम्बन से
  rationale: ἐν यहाँ अभिवादन के साथ होने वाले साधन अथवा ढंग को व्यक्त करता है। ‘पवित्र चुम्बन’ φίλημα और ἁγίῳ का सीधा, प्रतिष्ठित और अर्थपूर्ण अनुवाद है।
theological_decisions:
- issue: कलीसियाई प्रसंग में ἀδελφοί का लिंग और व्यापक आशय
  choice: मुख्य पाठ में ‘भाइयों’
  alternative: ‘भाइयों और बहनों’
  rationale: यूनानी रूप पुल्लिंग बहुवचन है, इसलिए उसका रूप मुख्य पाठ में सुरक्षित रखा गया है। फिर भी पौलुस का सम्बोधन सम्भवतः पूरे विश्वासी समुदाय को समेटता है; इस वास्तविक अर्थ-सम्भावना को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञार्थक बहुवचन ‘करो’ मूल यूनानी के सामुदायिक सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करता है; सांस्कृतिक अभिव्यक्ति को हटाने या आधुनिक रीति से बदलने के बजाय मूल रूप में सुरक्षित रखा गया है।
