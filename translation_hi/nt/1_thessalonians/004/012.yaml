review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the purpose clause, the fitting/respectable conduct intended by εὐσχημόνως, the community-distinguishing sense of τοὺς ἔξω, and the broad 'nothing' sense of μηδενός. However, πρὸς more directly denotes conduct toward/in relation to outsiders than conduct merely 'before' them, and 'ज़रूरत न पड़े' can imply that a need does not arise rather than that they lack no necessity.
  naturalness: The draft is generally clear and modern. 'बाहर के लोगों के प्रति आपका आचरण उचित हो' is more idiomatic and more directly expresses the relational force of the Greek than 'बाहरवालों के सामने आपका चालचलन उचित हो.' 'आपको किसी चीज़ की ज़रूरत न हो' is a natural, direct rendering of the closing clause.
  terminology: '''बाहर के लोग'' retains the source''s designation without adding the interpretive term ''अविश्वासी.'' ''आचरण'' is appropriate in a dignified modern biblical register. The footnote appropriately retains the plausible alternative of dependence on persons.'
  issues:
  - severity: medium
    issue: '''बाहरवालों के सामने'' weakens the relational force of πρὸς τοὺς ἔξω.'
    rationale: The phrase concerns behavior toward or in relation to people outside the community, not solely behavior displayed in their presence.
  - severity: low
    issue: '''ज़रूरत न पड़े'' is slightly less direct than the Greek expression for having no need.'
    rationale: It can suggest that no occasion for need will occur. 'ज़रूरत न हो' more closely conveys μηδενὸς χρείαν ἔχητε while retaining the intended breadth.
  revised_text: ताकि बाहर के लोगों के प्रति आपका आचरण उचित हो और आपको किसी चीज़ की ज़रूरत न हो।[a]
  revised_footnotes:
