id: 1TH.4.12
reference: 1 Thessalonians 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: hi
  text: ताकि बाहर के लोगों के प्रति आपका आचरण उचित हो और आपको किसी चीज़ की ज़रूरत न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आपको किसी की ज़रूरत न हो।” इस वाक्यांश में दूसरों पर निर्भर न रहने पर बल हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले उपदेश का उद्देश्य या परिणाम बताता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से प्रयोजन का भाव रखता है।
- source_word: περιπατῆτε
  choice: आपका चालचलन हो
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘चलना’ है, पर यहाँ यह जीवन-व्यवहार का रूपक है। ‘चालचलन’ उस रूपक की छाया बनाए रखते हुए हिन्दी में अभिप्रेत अर्थ स्पष्ट करता है।
- source_word: εὐσχημόνως
  choice: उचित
  rationale: यह शोभनीय, मर्यादित और सामाजिक रूप से सम्मानजनक व्यवहार का भाव देता है; ‘उचित’ संक्षिप्त और स्वाभाविक है तथा अर्थ को अनावश्यक रूप से केवल नैतिक सम्मान तक सीमित नहीं करता।
- source_word: πρὸς τοὺς ἔξω
  choice: बाहरवालों के सामने
  rationale: यह मसीही समुदाय से बाहर के लोगों के संबंध में दिखाई देने वाले सार्वजनिक आचरण को व्यक्त करता है।
- source_word: τοὺς ἔξω
  choice: बाहरवालों
  rationale: मूल पाठ के ‘बाहर के लोग’ वाले सामुदायिक भेद को बनाए रखता है और ‘अविश्वासी’ जैसा अधिक व्याख्यात्मक धर्मवैज्ञानिक पद नहीं जोड़ता।
- source_word: μηδενὸς χρείαν ἔχητε
  choice: आपको किसी चीज़ की ज़रूरत न पड़े
  rationale: व्याकरण की दृष्टि से यह किसी वस्तु या आवश्यकता की कमी न होने का स्वाभाविक अर्थ देता है। प्रसंग में दूसरों पर अनावश्यक निर्भरता का भाव भी संभव है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: समापन वाक्यांश μηδενὸς χρείαν ἔχητε का अर्थ
  choice: ‘आपको किसी चीज़ की ज़रूरत न पड़े’—आवश्यकताओं के लिए अभाव या निर्भरता न होना
  alternative: ‘आपको किसी व्यक्ति पर निर्भर न रहना पड़े’ अथवा ‘आपको किसी की ज़रूरत न पड़े’
  rationale: μηδενός व्याकरणतः ‘किसी चीज़’ और ‘किसी व्यक्ति’ दोनों की दिशा में समझा जा सकता है। हाथों से काम करने के निकटवर्ती प्रसंग में आर्थिक आत्मनिर्भरता प्रमुख है, फिर भी पाठ को पूर्ण सामाजिक स्वतंत्रता का दावा बनाना उचित नहीं; इसलिए वैकल्पिक मानवीय-निर्भरता वाला अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘बाहरवालों’ से मूल पाठ का सामुदायिक पदबंध सुरक्षित रहता है; ‘चालचलन’ जीवन-व्यवहार के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
