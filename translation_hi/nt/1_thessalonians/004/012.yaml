revisions:
- from: ताकि बाहरवालों के सामने आपका चालचलन उचित हो और आपको किसी चीज़ की ज़रूरत न पड़े।[a]
  to: ताकि बाहर के लोगों के प्रति आपका आचरण उचित हो और आपको किसी चीज़ की ज़रूरत न हो।[a]
  rationale: The revision renders πρὸς τοὺς ἔξω as 'बाहर के लोगों के प्रति,' preserving its relational orientation, and replaces 'ज़रूरत न पड़े' with the more direct 'ज़रूरत न हो.' The alternative reading involving dependence on persons remains in the footnote, without resolving the source phrase beyond what its grammar and context support.
