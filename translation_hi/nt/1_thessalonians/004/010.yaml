  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: hi
  text: क्योंकि तुम सचमुच समूचे मकिदुनिया में रहने वाले सभी भाइयों के प्रति ऐसा करते हो। परन्तु, भाइयो,[a] हम तुमसे आग्रह करते हैं कि तुम और भी बढ़ते जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयो” से आशय साथी विश्वासियों से है और कलीसियाओं के स्त्री और पुरुष दोनों सदस्य सम्भवतः इसमें शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... सचमुच
  rationale: γάρ पिछले कथन का कारण स्पष्ट करता है, जबकि καί यहाँ बल देता है; यह संयोजन दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιεῖτε αὐτὸ
  choice: तुम ... ऐसा कर भी रहे हो
  rationale: वर्तमान काल उनके लगातार आचरण को दर्शाता है, और αὐτό पीछे उल्लिखित भाईचारे के प्रेम की ओर संकेत करता है।
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: सब भाइयों के प्रति
  rationale: εἰς यहाँ प्रेमपूर्ण व्यवहार की दिशा या संबंध बताता है; ‘के प्रति’ हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: सारे मकिदुनिया में
  rationale: ἐν ὅλῃ भौगोलिक विस्तार को बताता है; ‘सारे मकिदुनिया में’ उस व्यापकता को बनाए रखता है।
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: फिर भी ... हम तुमसे आग्रह करते हैं
  rationale: παρακαλέω का यहाँ अर्थ गंभीर प्रोत्साहन या आग्रह है। δέ प्रशंसा से आगे के आग्रह की ओर हल्का विरोधात्मक संक्रमण करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन व्याकरणतः पुल्लिंग बहुवचन है और विश्वासियों के समुदाय को संबोधित करता है; इसके व्यापक संदर्भ को पादटिप्पणी स्पष्ट करती है।
- source_word: περισσεύειν μᾶλλον
  choice: इसमें और भी बढ़ते जाओ
  rationale: περισσεύειν वृद्धि और प्रचुरता का भाव रखता है तथा μᾶλλον वर्तमान स्तर से आगे बढ़ने पर बल देता है। ‘इसमें’ संदर्भानुसार भाईचारे के प्रेम को सूचित करता है।
theological_decisions:
- issue: मिश्रित-लिंग विश्वासी समुदाय के लिए ἀδελφοί/ἀδελφούς का अनुवाद
  choice: भाई/भाइयो
  alternative: भाइयो और बहनो; साथी विश्वासियो
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में स्त्री और पुरुष दोनों विश्वासी सम्मिलित होने की संभावना है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मकिदुनिया’ प्रचलित हिन्दी बाइबलीय भौगोलिक नाम है। ‘बढ़ते जाओ’ निरंतर प्रगति की प्रेरणा को स्वाभाविक ढंग से व्यक्त करता है।
