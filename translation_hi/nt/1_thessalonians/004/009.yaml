  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: hi
  text: जहाँ तक भाईचारे के प्रेम की बात है,[a] तुम्हें इस विषय में किसी के लिखने की आवश्यकता नहीं है,[b] क्योंकि परमेश्वर ने तुम्हीं को एक-दूसरे से प्रेम करना सिखाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, विशेष रूप से, ‘साथी विश्वासियों के प्रति प्रेम’; यूनानी शब्द मसीही समुदाय के भीतर पारिवारिक सम्बन्ध की छवि रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘तुम्हें लिखने की आवश्यकता नहीं है’; यूनानी में लिखने वाला कर्ता स्पष्ट नहीं, बल्कि निहित है, इसलिए हिन्दी में ‘किसी के’ जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τῆς φιλαδελφίας
  choice: जहाँ तक भाईचारे के प्रेम की बात है
  rationale: यह नए विषय की ओर सहज संक्रमण दिखाता है। ‘भाईचारे का प्रेम’ विश्वासियों के समुदाय में पारिवारिक स्नेह का बिंब रखता है और आगे के सामान्य क्रियापद ‘प्रेम करना’ से शब्दगत भेद बनाए रखता है।
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: तुम्हें इस विषय में किसी के लिखने की आवश्यकता नहीं है
  rationale: यूनानी में γράφειν का कर्ता स्पष्ट नहीं है। ‘किसी के’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है, पर ‘हमारे’ कहकर निहित कर्ता को अनावश्यक रूप से निश्चित नहीं किया जाता। ‘इस विषय में’ प्रसंगगत सम्बन्ध स्पष्ट करता है।
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: क्योंकि ... तुमने स्वयं
  rationale: ‘तुमने स्वयं’ दोहरे सर्वनाम का बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεοδίδακτοί
  choice: परमेश्वर से सीखा है
  rationale: दुर्लभ विशेषण का अर्थ ‘परमेश्वर द्वारा सिखाए हुए’ है। हिन्दी में ‘परमेश्वर से सीखा है’ दैवी स्रोत को स्पष्ट रखते हुए सहज और वर्तमान भाषा है।
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: एक-दूसरे से प्रेम करना
  rationale: यह उद्देश्य या परिणाम की ओर संकेत करने वाली रचना है। हिन्दी में यह रूप स्वाभाविक है और पारस्परिक प्रेम का अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: φιλαδελφία और ἀγαπᾶν के बीच शब्दगत भेद
  choice: पहले पद को ‘भाईचारे का प्रेम’ और बाद की क्रिया को ‘प्रेम करना’ कहा गया है।
  alternative: दोनों को केवल ‘प्रेम’ से अनूदित करना।
  rationale: इससे विश्वासियों के बीच पारिवारिक स्नेह का विशिष्ट भाव और फिर परस्पर प्रेम की व्यापक क्रिया—दोनों सुरक्षित रहते हैं।
- issue: γράφειν का निहित कर्ता
  choice: ‘किसी के लिखने’
  alternative: ‘हमारे लिखने’
  rationale: सन्दर्भ में पौलुस और उसके सह-प्रेषक सम्भावित कर्ता हैं, पर यूनानी अनन्त क्रिया में कर्ता व्यक्त नहीं है। अनिश्चित रूप मूल की खुली अभिव्यक्ति बचाता है।
- issue: θεοδίδακτοί में दैवी शिक्षण
  choice: ‘परमेश्वर से सीखा है’
  alternative: ‘परमेश्वर द्वारा सिखाए गए हो’
  rationale: चुना हुआ रूप परमेश्वर को शिक्षा का स्रोत बनाए रखता है और यह दावा भी सुरक्षित रखता है कि समुदाय को परस्पर प्रेम की शिक्षा स्वयं परमेश्वर से मिली है।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन सम्बोधन ‘तुम’, और सरल किन्तु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। ‘भ्रातृ-प्रेम’ की अपेक्षा ‘भाईचारे का प्रेम’ सामान्य पाठक के लिए अधिक सहज है; पादटिप्पणी इसके समावेशी सामुदायिक अर्थ को स्पष्ट करती है।
