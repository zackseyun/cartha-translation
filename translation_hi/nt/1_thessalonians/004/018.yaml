lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह शब्द प्रभु के आगमन और मरे हुए विश्वासियों के जी उठने के विषय में पहले कही गई बातों से निष्कर्ष निकालता है; ‘इसलिए’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρακαλεῖτε
  choice: प्रोत्साहन देते रहो
  rationale: वर्तमान काल की आज्ञा पारस्परिक रूप से जारी रहने वाले कार्य का भाव दे सकती है। παρακαλέω में प्रोत्साहित करने, सांत्वना देने और आग्रह करने के अर्थ शामिल हैं; यहाँ शोकग्रस्त विश्वासियों को आश्वस्त करने के संदर्भ में ‘प्रोत्साहन देते रहो’ व्यापक मुख्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: यह पारस्परिक सर्वनाम समुदाय के सदस्यों द्वारा परस्पर किए जाने वाले कार्य को दर्शाता है; ‘एक-दूसरे को’ सहज आधुनिक हिन्दी है।
- source_word: ἐν
  choice: से
  rationale: यहाँ ἐν उन बातों को प्रोत्साहन के साधन अथवा आधार के रूप में प्रस्तुत करता है। हिन्दी में ‘इन बातों से’ इस साधनात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς λόγοις τούτοις
  choice: इन बातों
  rationale: यह वाक्यांश ठीक पहले दिए गए पूरे संदेश की ओर संकेत करता है। हिन्दी में ‘इन बातों’ उस संदर्भ को स्वाभाविक रूप से समेटता है; अधिक शाब्दिक ‘इन शब्दों’ भी संभव है।
theological_decisions:
- issue: παρακαλεῖτε का प्रोत्साहन और सांत्वना के बीच अर्थ
  choice: मुख्य पाठ में ‘प्रोत्साहन देते रहो’
  alternative: ‘एक-दूसरे को सांत्वना देते रहो’
  rationale: पूर्ववर्ती प्रसंग मृत विश्वासियों के विषय में दुःख और भविष्य के पुनर्मिलन से संबंधित है, इसलिए सांत्वना का भाव प्रबल है; फिर भी क्रिया का अर्थ केवल सांत्वना तक सीमित नहीं है। मुख्य पाठ में व्यापक अर्थ रखा गया और प्रसंगानुकूल विकल्प पादटिप्पणी में दिया गया।
