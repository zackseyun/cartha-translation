source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: hi
  text: क्योंकि यदि हम विश्वास करते हैं कि यीशु मरे और जी उठे, तो उसी प्रकार परमेश्वर उन लोगों को भी, जो यीशु के द्वारा[b] सो गए हैं[a], यीशु के साथ ले आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “मर गए हैं।” इस प्रसंग में पौलुस मृत्यु के लिए “सो गए” का रूपक प्रयोग करते हैं।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “जो यीशु में सो गए हैं” भी हो सकता है। यूनानी पदबंध “यीशु के द्वारा” का संबंध “सो गए हैं” के बजाय “ले आएगा” से जोड़कर यह अर्थ भी समझा जा सकता है कि परमेश्वर उन्हें यीशु के द्वारा यीशु के साथ ले आएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ के कारणसूचक/निष्कर्षसूचक संबंध और εἰ की शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πιστεύομεν
  choice: हम विश्वास करते हैं
  rationale: यहाँ यीशु की मृत्यु और पुनरुत्थान के विषय में साझा अंगीकार और विश्वास व्यक्त होता है।
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: यीशु मरे और जी उठे
  rationale: दोनों यूनानी क्रियाओं के सरल भूतकाल तथा ἀνέστη के अकर्मक भाव को स्वाभाविक, आदरसूचक हिन्दी में व्यक्त करता है।
- source_word: οὕτως καὶ
  choice: तो उसी प्रकार ... भी
  rationale: यीशु की मृत्यु और पुनरुत्थान को मृत विश्वासियों के विषय में परमेश्वर के भावी कार्य से जोड़ने वाला सहसंबंध सुरक्षित रहता है।
- source_word: τοὺς κοιμηθέντας
  choice: जो ... सो गए हैं
  rationale: मृत्यु के लिए पौलुस के रूपक को बनाए रखता है; पूर्णतासूचक हिन्दी वर्तमान परिणामी अवस्था भी व्यक्त करती है।
- source_word: διὰ τοῦ Ἰησοῦ
  choice: यीशु के द्वारा
  rationale: διά के साथ संबंधकारक के सामान्य साधन/माध्यम-संबंध को निकटता से व्यक्त करता है, जबकि वाक्यांश के संबंध और अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ἄξει
  choice: ले आएगा
  rationale: 'ἄγω के भविष्यकाल को प्रसंगानुकूल ढंग से व्यक्त करता है: परमेश्वर उन्हें यीशु के साथ लाएगा।'
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: σύν का संगति-सूचक अर्थ और यूनानी सर्वनाम दोनों बने रहते हैं; निकट प्रसंग में सर्वनाम यीशु की ओर संकेत करता है।
theological_decisions:
- issue: κοιμηθέντας में मृत्यु का रूपक
  choice: मुख्य पाठ में “सो गए हैं” रूपक बनाए रखा गया है।
  alternative: “मर गए हैं”
  rationale: यह रूपक वास्तविक मृत्यु को नकारे बिना भावी पुनरुत्थान की आशा वाले इस प्रसंग की भाषिक और धर्मवैचारिक विशेषता सुरक्षित रखता है।
- issue: διὰ τοῦ Ἰησοῦ का अर्थ और वाक्यगत संबंध
  choice: मुख्य पाठ में “यीशु के द्वारा” रखा गया है।
  alternative: “यीशु में”; अथवा इसे परमेश्वर के ‘ले आने’ के साधन के रूप में समझना
  rationale: यूनानी पदबंध को मृत लोगों के ‘सो जाने’ से या मुख्य क्रिया ‘ले आएगा’ से जोड़े जाने की संभावना है; इसे किसी एक व्याख्या तक सीमित किए बिना पादटिप्पणी में विकल्प दिए गए हैं।
- issue: ἀνέστη की वाच्यता
  choice: “जी उठे”
  alternative: “जिलाए गए”
  rationale: यूनानी क्रिया यहाँ अकर्मक रूप में है; इसलिए हिन्दी में अकर्मक अभिव्यक्ति रखी गई है और निष्क्रिय वाच्य नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। यीशु के लिए आदरसूचक बहुवचन क्रियाएँ (“मरे,” “जी उठे”) मानक हिन्दी प्रयोग के अनुरूप हैं। मृत्यु का मूल रूपक बनाए रखते हुए उसका सीधा अर्थ पादटिप्पणी में दिया गया है।
