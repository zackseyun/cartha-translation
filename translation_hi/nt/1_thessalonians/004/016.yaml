    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; इसलिए हिन्दी में ‘क्योंकि’ स्वाभाविक और सटीक है।
- source_word: αὐτὸς ὁ κύριος
  choice: प्रभु स्वयं
  rationale: αὐτός का बलवाचक प्रयोग प्रभु के स्वयं आने पर जोर देता है; ‘स्वयं’ उस बल को बनाए रखता है।
- source_word: ἐν κελεύσματι
  choice: आदेश की पुकार के साथ
  rationale: κέλευσμα किसी अधिकारपूर्ण आदेश, आह्वान या ऊँची आदेशात्मक पुकार को सूचित कर सकता है। ‘आदेश की पुकार’ इन दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: प्रधान स्वर्गदूत की आवाज़ के साथ
  rationale: φωνή का सीधा अर्थ ‘आवाज़’ है और ἀρχάγγελος स्वर्गदूतों में प्रधान पद को सूचित करता है। यूनानी में निश्चित उपपद न होने के बावजूद हिन्दी में यह संबंधवाचक रचना संख्या को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἐν σάλπιγγι θεοῦ
  choice: परमेश्वर की तुरही के साथ
  rationale: σάλπιγξ के लिए ‘तुरही’ प्रचलित और प्रसंगानुकूल शब्द है; संबंधकारक θεοῦ को स्वाभाविक हिन्दी में ‘परमेश्वर की’ कहा गया है।
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: स्वर्ग से उतरेंगे
  rationale: यह अनुवाद नीचे आने की दिशा और स्वर्ग से आरंभ होने—दोनों को स्पष्ट रूप से बनाए रखता है। प्रभु के लिए आदरसूचक बहुवचन हिन्दी के स्वाभाविक सम्मानसूचक प्रयोग के अनुरूप है।
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: मसीह में जो मर गए हैं
  rationale: शाब्दिक ‘मसीह में मृतक’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि ‘मसीह में’ की संबंधपरक और धर्मवैचारिक अभिव्यक्ति सुरक्षित रहती है। Χριστός को उसके उपाधिगत अर्थ के अनुरूप ‘मसीह’ कहा गया है।
- source_word: ἀναστήσονται πρῶτον
  choice: पहले जी उठेंगे
  rationale: ἀναστήσονται यहाँ पुनरुत्थान को सूचित करता है; ‘जी उठेंगे’ हिन्दी में स्पष्ट और प्रचलित है। ‘पहले’ अगले पद में जीवित लोगों के साथ बताई गई क्रमिकता को बनाए रखता है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिन्दी में अर्थपूर्ण, व्यापक रूप से समझा जाने वाला और स्थापित रूप है; ‘ख्रीष्ट’ अधिक लिप्यंतरणपरक तथा कम सामान्य है।
- issue: ἀναστήσονται की वाच्यता
  choice: जी उठेंगे
  alternative: जिलाए जाएँगे
  rationale: यूनानी क्रिया का रूप यहाँ कर्तृवाच्य/मध्यवाच्य अर्थ में ‘उठेंगे’ को सहारा देता है। ‘जिलाए जाएँगे’ परमेश्वर को निहित कर्ता बनाकर एक कर्मवाच्य सूक्ष्मता जोड़ सकता है जो इस पद के रूप में स्पष्ट नहीं है।
- issue: κέλευσμα की प्रकृति
  choice: आदेश की पुकार
  alternative: आदेश
  rationale: शब्द अधिकारपूर्ण आदेश या आदेशात्मक पुकार दोनों अर्थ दे सकता है। मुख्य पाठ में दोनों पहलुओं को बनाए रखा गया है और संक्षिप्त विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उतरेंगे’ और ‘जी उठेंगे’ सहज हिन्दी हैं; अर्धविराम प्रभु के उतरने से संबंधित तीन साथ आने वाले संकेतों और उसके बाद मृतकों के जी उठने के कथन के बीच संरचनात्मक भेद स्पष्ट करता है।
