  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: hi
  text: क्योंकि प्रभु स्वयं आदेश की पुकार के साथ[a], किसी प्रधान स्वर्गदूत की आवाज़ के साथ और परमेश्वर की तुरही के साथ स्वर्ग से उतरेंगे; और मसीह में जो मर गए हैं, वे पहले जी उठेंगे।
  philosophy: optimal-equivalence
  footnotes:
