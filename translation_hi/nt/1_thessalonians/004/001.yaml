reference: 1 Thessalonians 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: hi
  text: तो फिर, भाइयो[a], हम प्रभु यीशु में तुमसे निवेदन और आग्रह करते हैं कि जिस प्रकार तुम्हें चलना और परमेश्वर को प्रसन्न करना चाहिए, वह तुमने हमसे सीखा है—और जैसा कि तुम चल भी रहे हो—तुम और भी अधिक बढ़ते जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयो और बहनो”; यूनानी में “भाइयो” है, और पुल्लिंग बहुवचन का प्रयोग प्रायः स्त्री-पुरुष दोनों वाले समूह को संबोधित करने के लिए होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: अंत में
  rationale: यह आगे की समापनपरक नसीहत की ओर संक्रमण दिखाता है। स्वाभाविक हिन्दी में ‘अंत में’ दोनों अव्ययों की संयुक्त प्रवचनात्मक भूमिका पर्याप्त रूप से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी का पुल्लिंग बहुवचन संबोधन बनाए रखा गया है; पूरी विश्वासी मंडली के समावेश की जानकारी पादटिप्पणी में दी गई है।
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: हम ... तुमसे निवेदन और आग्रह करते हैं
  rationale: यह जोड़ी विनम्र अनुरोध और गंभीर प्रोत्साहन/नसीहत, दोनों बलों को व्यक्त करती है।
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: प्रभु यीशु में
  rationale: ‘में’ यूनानी ἐν को बनाए रखता है और अपील के प्रभु से जुड़े क्षेत्र तथा अधिकार, दोनों को अनिर्णीत रहने देता है।
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: जैसा तुमने हमसे सीखा
  rationale: शिक्षा-परंपरा के संदर्भ में παραλαμβάνω का आशय किसी शिक्षा को ग्रहण करना है; ‘सीखा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और अगले उपवाक्य को उस शिक्षा की विषयवस्तु के रूप में स्पष्ट रखता है।
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: कि तुम्हें किस प्रकार चलना ... चाहिए
  rationale: ‘चलना’ पौलुस के आचरण-संबंधी रूपक को सुरक्षित रखता है, जबकि ‘चाहिए’ δεῖ की नैतिक अनिवार्यता व्यक्त करता है।
- source_word: καὶ ἀρέσκειν θεῷ
  choice: और परमेश्वर को प्रसन्न करना
  rationale: समन्वित क्रियार्थ को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθὼς καὶ περιπατεῖτε
  choice: और जैसा तुम चल भी रहे हो
  rationale: वर्तमान काल उनके मौजूदा आचरण की पुष्टि करता है; ‘भी’ καί को और ‘चल’ मूल रूपक को दर्शाता है।
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: वैसे ही तुम इसमें और भी बढ़ते जाओ
  rationale: περισσεύω वर्तमान दशा से आगे बढ़ने का भाव देता है। हिन्दी में ‘बढ़ते जाओ’ निरंतर उन्नति को स्वाभाविक ढंग से व्यक्त करता है; ‘इसमें’ पूर्ववर्ती जीवन-आचरण को संदर्भित करता है।
theological_decisions:
- issue: थिस्सलुनीके के विश्वासियों के लिए लिंग-सूचक संबोधन
  choice: मुख्य पाठ में ‘भाइयो’, समावेशी अर्थ पादटिप्पणी में
  alternative: ‘भाइयो और बहनो’
  rationale: ἀδελφοί व्याकरणतः पुल्लिंग बहुवचन है, यद्यपि इस संदर्भ में संभवतः पूरी विश्वासी मंडली को संबोधित करता है। मूल रूप मुख्य पाठ में रखा गया और संदर्भगत समावेशिता टिप्पणी में स्पष्ट की गई।
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος यीशु की मसीही उपाधि है; ‘प्रभु’ इसका स्थापित, गरिमापूर्ण और धर्मवैज्ञानिक बल सुरक्षित रखता है।
- issue: ἐν κυρίῳ Ἰησοῦ में संबंध का स्वरूप
  choice: ‘प्रभु यीशु में’ को यथावत रखना
  alternative: ‘प्रभु यीशु के अधिकार से’
  rationale: ἐν को केवल साधन या अधिकार के अर्थ में स्पष्ट कर देना मूल की संभावित क्षेत्रगत/संबंधगत छाया को सीमित कर देता। शाब्दिक पूर्वसर्ग वास्तविक अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामुदायिक उपदेशात्मक रजिस्टर अपनाया गया है। ‘चलना’ जैसे पौलुसी रूपक को सुरक्षित रखते हुए वाक्य को हिन्दी में पठनीय बनाने के लिए मध्यवर्ती पुष्टि-वाक्यांश को डैश के बीच रखा गया है।
