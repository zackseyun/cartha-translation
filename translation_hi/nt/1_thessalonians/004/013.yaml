source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: hi
  text: परन्तु, भाइयो[b], हम नहीं चाहते कि तुम उन लोगों के विषय में अनभिज्ञ रहो जो सो गए हैं[a], ताकि तुम उन बाकी लोगों के समान शोक न करो जिनके पास आशा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो सो रहे हैं’; यहाँ पौलुस ‘नींद’ का प्रयोग मृतकों के लिए एक रूपक के रूप में करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाइयो’ से पूरी मण्डली को सम्बोधित किया गया है और सम्भवतः इसमें स्त्री और पुरुष दोनों सम्मिलित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: परन्तु हम नहीं चाहते
  rationale: δέ प्रसंग में हल्का संक्रमण अथवा विरोध दर्शाता है; ‘परन्तु’ इसे बिना अनावश्यक रूप से तीखा किए स्वाभाविक हिन्दी में व्यक्त करता है। θέλομεν के साथ infinitive का आशय ‘हम नहीं चाहते कि...’ है।
- source_word: ὑμᾶς ἀγνοεῖν
  choice: कि तुम ... अनजान रहो
  rationale: ἀγνοεῖν का अर्थ किसी बात को न जानना या उससे अनभिज्ञ रहना है। ‘अनजान रहो’ आधुनिक हिन्दी में स्पष्ट है और अपमानसूचक भाव नहीं लाता।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और मण्डली को सम्बोधित करता है। मूल रूप को मुख्य पाठ में रखा गया है; स्त्री-पुरुष दोनों के सम्मिलित होने की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: περὶ τῶν κοιμωμένων
  choice: उन लोगों के विषय में ... जो सो गए हैं
  rationale: κοιμωμένων यहाँ मर चुके विश्वासियों के लिए प्रयुक्त ‘नींद’ का रूपक है। ‘सो गए हैं’ रूपक और उसके पुनरुत्थान-संबंधी आशय को बनाए रखता है।
- source_word: ἵνα μὴ λυπῆσθε
  choice: ताकि तुम ... शोक न करो
  rationale: ἵνα के साथ subjunctive उद्देश्य या अपेक्षित परिणाम व्यक्त करता है। यह अनुवाद शोक के पूर्ण निषेध का अनावश्यक अर्थ दिए बिना पौलुस की पासबानी मंशा दर्शाता है।
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: बाकी लोगों के समान
  rationale: οἱ λοιποί यहाँ उस विश्वासी समुदाय से बाहर के अन्य लोगों को सूचित करता है जिनसे तुलना की गई है। ‘बाकी लोग’ मूल की व्यापकता बनाए रखता है।
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: जिन्हें कोई आशा नहीं है
  rationale: यह participial पदबंध का सीधा और स्वाभाविक हिन्दी रूप है तथा अन्तकालीन आशा के विषय में पौलुस के विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: अन्तकालीन प्रसंग में κοιμωμένων का अर्थ
  choice: मुख्य पाठ में ‘जो सो गए हैं’ रूपक बनाए रखा गया है।
  alternative: ‘जो मर गए हैं’ अथवा ‘जो सो रहे हैं’
  rationale: पौलुस मृत विश्वासियों के लिए जानबूझकर नींद का रूपक प्रयोग करता है। इसे बनाए रखने से पुनरुत्थान की आशा से जुड़ी धार्मिक बनावट सुरक्षित रहती है; अभिप्राय पादटिप्पणी में स्पष्ट है।
- issue: ἀδελφοί का दायरा
  choice: मुख्य पाठ में ‘भाइयो’ और पादटिप्पणी में पूरी मण्डली की सम्भावित समावेशिता
  alternative: ‘भाइयो और बहनो’ अथवा ‘भाई-बहनो’
  rationale: यह रूप यूनानी के व्याकरणिक पुल्लिंग को स्पष्ट रखता है, जबकि पादटिप्पणी बताती है कि सम्बोधन सम्भवतः मण्डली के स्त्री और पुरुष दोनों सदस्यों के लिए है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मण्डलीय पाठ के अनुकूल रूप अपनाया गया है। ‘सो गए हैं’ जैसे परिचित रूपक को सुरक्षित रखा गया है और अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
