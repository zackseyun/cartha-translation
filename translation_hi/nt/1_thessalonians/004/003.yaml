source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: hi
  text: 'क्योंकि परमेश्वर की इच्छा यह है: तुम्हारा पवित्रीकरण[a]—कि तुम यौन अनैतिकता[b] से दूर रहो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी पवित्रता’।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी: पोर्नेइया; अनुचित यौन आचरण के लिए एक व्यापक शब्द। परंपरागत अनुवादों में प्रायः ‘व्यभिचार’ या ‘जारकर्म’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: इच्छा
  rationale: परमेश्वर के इच्छित और अधिकारपूर्ण अभिप्राय के लिए ‘इच्छा’ स्वाभाविक और प्रचलित हिन्दी शब्द है; ‘अभिलाषा’ अपेक्षाकृत दुर्बल और ‘उद्देश्य’ अधिक संकीर्ण अर्थ दे सकता है।
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: तुम्हारा पवित्रीकरण
  rationale: यह पद पवित्र किए जाने और पवित्र जीवन जीने, दोनों से जुड़ी व्यापक धारणा को बनाए रखता है। ‘तुम्हारी पवित्रता’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: ἀπέχεσθαι
  choice: कि तुम … से दूर रहो
  rationale: यह क्रियार्थक पदबंध ‘पवित्रीकरण’ का आशय स्पष्ट करता है। ‘से दूर रहो’ आधुनिक हिन्दी में संयमपूर्वक बचने की बात स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: πορνεία अवैध या अनुचित यौन आचरण के लिए व्यापक शब्द है। ‘व्यभिचार’ इसे किसी एक प्रकार के आचरण तक सीमित कर सकता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश के साथ कारण अथवा आधार का संबंध स्पष्ट करता है और हिन्दी में वाक्य-संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नैतिक उपदेश में ἁγιασμός का अर्थ
  choice: ‘पवित्रीकरण’ रखा गया है, जिसकी नैतिक अभिव्यक्ति अगले खंड में बताई गई है।
  alternative: ‘पवित्रता’
  rationale: अनुवाद इस शब्द को केवल प्राप्त स्थिति या केवल क्रमिक प्रक्रिया तक सीमित नहीं करता; यह परमेश्वर के लिए अलग किए गए पवित्र जीवन की व्यापक धारणा बनाए रखता है।
- issue: πορνεία का दायरा
  choice: व्यापक अर्थ में ‘यौन अनैतिकता’
  alternative: ‘व्यभिचार’ या ‘जारकर्म’
  rationale: यूनानी शब्द अनुचित यौन आचरण की व्यापक श्रेणी बताता है। अधिक संकीर्ण हिन्दी शब्द स्रोत में निहित व्यापकता को अनावश्यक रूप से सीमित कर सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘पवित्रीकरण’ स्थापित धार्मिक शब्दावली को बनाए रखता है, जबकि पादटिप्पणी सरल वैकल्पिक अभिव्यक्ति देती है। संबोधन में बहुवचन ‘तुम’ यूनानी ὑμῶν/ὑμᾶς के अनुरूप है।
