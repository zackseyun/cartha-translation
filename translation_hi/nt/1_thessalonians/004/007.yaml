  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने हमें अशुद्धता के लिए नहीं, बल्कि पवित्रता में बुलाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्रता में’ का अनुवाद ‘पवित्र किए जाने में’ भी हो सकता है। यूनानी शब्द पवित्र अवस्था या पवित्र किए जाने की प्रक्रिया—दोनों का बोध करा सकता है। यहाँ ‘अशुद्धता’ का अर्थ नैतिक अशुद्धता है और इस प्रसंग में विशेष रूप से यौन अशुद्धता भी सम्मिलित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκάλεσεν
  choice: बुलाया है
  rationale: यूनानी एओरिस्ट परमेश्वर के बुलाने की घटना बताता है। हिन्दी में पूर्ण वर्तमान यहाँ उस बीती हुई बुलाहट की वर्तमान प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है, बिना बुलाहट की किसी संप्रदायगत व्याख्या को जोड़ने के।
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: अशुद्धता के लिए
  rationale: ἐπί के साथ सम्प्रदान यहाँ लक्ष्य अथवा उस जीवन-दिशा का संकेत देता है जिसके लिए परमेश्वर ने नहीं बुलाया। ‘अशुद्धता’ नैतिक और प्रसंगानुसार यौन अशुद्धता, दोनों की व्यापकता बनाए रखती है।
- source_word: ἐν ἁγιασμῷ
  choice: पवित्रता में
  rationale: ἐν को ‘में’ से रखा गया है और ἁγιασμός की अवस्था तथा पवित्र किए जाने की प्रक्रिया—दोनों संभावनाओं को टिप्पणी में सुरक्षित किया गया है। मुख्य पाठ में यह अशुद्धता के विपरीत पवित्र जीवन-क्षेत्र को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की ‘बुलाहट’ का अर्थ
  choice: विश्वासियों को परमेश्वर की वास्तविक बुलाहट, जो पवित्र जीवन का आधार है
  alternative: सामान्य निमंत्रण, अथवा तकनीकी अर्थ में विशेष रूप से प्रभावकारी बुलाहट
  rationale: पद बुलाहट की कार्यविधि परिभाषित नहीं करता। इसलिए ‘बुलाया’ को बनाए रखते हुए किसी संप्रदायगत सिद्धांत को पाठ में नहीं जोड़ा गया।
- issue: ἁγιασμός में अवस्था और प्रक्रिया का तनाव
  choice: मुख्य पाठ में ‘पवित्रता’, साथ में टिप्पणी में ‘पवित्र किए जाने’ की संभावना
  alternative: केवल ‘पवित्रीकरण’ के रूप में प्रक्रिया को निश्चित करना
  rationale: यूनानी संज्ञा पवित्र अवस्था और पवित्र किए जाने की प्रक्रिया, दोनों का बोध करा सकती है; अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘अशुद्धता’ और ‘पवित्रता’ का स्पष्ट विरोध मूल पाठ के नैतिक तथा धार्मिक अनुनाद को बनाए रखता है।
