  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: hi
  text: इसलिए जो कोई इस शिक्षा को ठुकराता है, वह किसी मनुष्य को नहीं, बल्कि परमेश्वर को ठुकराता है—उस परमेश्वर को, जो अपना पवित्र आत्मा भी तुम्हें देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ठुकराता है’ का अनुवाद ‘अनदेखा करता है’ या ‘दरकिनार करता है’ भी हो सकता है। अंतिम वाक्यांश का अधिक शाब्दिक अनुवाद है, ‘जो अपना पवित्र आत्मा तुम्हारे भीतर देता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: इसलिए
  rationale: यह शब्द पिछले उपदेश से निकलने वाला निष्कर्ष प्रकट करता है; ‘इसलिए’ आधुनिक हिन्दी में उसके तार्किक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: जो कोई ... ठुकराता है ... ठुकराता है
  rationale: लेखयुक्त कृदंत का अर्थ सामान्य और प्रतिनिधिक है। ‘जो कोई’ लिंग-निरपेक्ष व्यापकता रखता है, और ‘ठुकराता है’ अधिकारपूर्ण शिक्षा को अस्वीकार करने तथा परमेश्वर को अस्वीकार करने के बीच के तीखे विरोध को बनाए रखता है।
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: किसी मनुष्य को नहीं, बल्कि परमेश्वर को
  rationale: एकवचन ἄνθρωπον यहाँ सामान्य अर्थ में है। ‘किसी मनुष्य’ स्रोत के एकवचन और परमेश्वर के साथ स्पष्ट विरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν καὶ διδόντα
  choice: उसी परमेश्वर को, जो ... देता है
  rationale: लेखयुक्त वर्तमान कृदंत परमेश्वर की आगे पहचान कराता है। सापेक्ष उपवाक्य हिन्दी में स्वाभाविक है; ‘देता है’ वर्तमान/निरंतर क्रिया को व्यक्त करता है। καί के संयोजक बल को वाक्य की प्रवाहपूर्ण पहचानात्मक रचना में समाहित किया गया है।
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: अपना पवित्र आत्मा
  rationale: यह पौलुसी संदर्भ में परमेश्वर के पवित्र आत्मा का उल्लेख है। हिन्दी में ‘अपना’ कर्ता परमेश्वर से संबंध को साफ और स्वाभाविक बनाता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हें
  rationale: यद्यपि εἰς का मूल स्थानिक अर्थ ‘में/के भीतर’ हो सकता है, δίδωμι के साथ यहाँ प्राप्तकर्ता का स्वाभाविक हिन्दी रूप ‘तुम्हें देता है’ है। शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘उसका पवित्र आत्मा’ का आशय
  choice: परमेश्वर द्वारा विश्वासियों को दिया जाने वाला पवित्र आत्मा
  alternative: पवित्र स्वभाव या अपेक्षाकृत अवैयक्तिक आत्मिक वरदान
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον की निश्चित और विशेषणात्मक रचना तथा पौलुसी संदर्भ स्वाभाविक रूप से परमेश्वर के पवित्र आत्मा की ओर संकेत करते हैं; अनुवाद इससे आगे कोई संप्रदायगत परिभाषा नहीं जोड़ता।
- issue: ὁ ἀθετῶν का सामान्य आशय
  choice: ‘जो कोई ... ठुकराता है’
  alternative: ‘वह व्यक्ति जो ... ठुकराता है’ अथवा पुरुष-विशिष्ट अभिव्यक्ति
  rationale: यूनानी पुल्लिंग एकवचन यहाँ सामान्य/प्रतिनिधिक है, केवल पुरुषों तक सीमित नहीं। ‘जो कोई’ इस व्यापकता को वर्तमान हिन्दी में सुरक्षित रखता है।
- issue: अस्वीकार की गई वस्तु का निहित संदर्भ
  choice: ‘इस शिक्षा को’
  alternative: सिर्फ ‘इसे’ या बिना व्यक्त कर्म के ‘अनादर करता है’
  rationale: यूनानी में ἀθετέω का कर्म संदर्भ से, अर्थात पिछले पदों के निर्देश से, समझा जाता है। ‘इस शिक्षा को’ हिन्दी में आवश्यक स्पष्टता देता है, पर इसे किसी व्यक्ति के बजाय अधिकारपूर्ण उपदेश के रूप में ही रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस शिक्षा’ पिछले संदर्भ में दिए गए निर्देश को स्पष्ट करता है। मुख्य पाठ में ‘तुम्हें’ स्वाभाविक हिन्दी है, जबकि εἰς के संभावित ‘तुम्हारे भीतर’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
