  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: hi
  text: और अपनी अभिलाषा यह रखो कि शांत जीवन बिताओ, अपने काम-काज पर ध्यान दो और अपने हाथों से काम करो, जैसा कि हमने तुम्हें आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: यह अपनी आकांक्षा बनाओ
  rationale: क्रिया किसी बात को सम्मानपूर्ण लक्ष्य या अभिलाषा मानकर उसके लिए प्रयत्न करने का भाव रखती है। यह अभिव्यक्ति शांत रहने को महत्वाकांक्षा बनाने की मूल विडंबनापूर्ण शक्ति बचाती है।
- source_word: ἡσυχάζειν
  choice: शांत जीवन बिताओ
  rationale: यहाँ केवल मौन रहने की नहीं, बल्कि शांत और व्यवस्थित ढंग से जीवन जीने की बात है।
- source_word: πράσσειν τὰ ἴδια
  choice: अपने काम-काज पर ध्यान दो
  rationale: यूनानी मुहावरे का अर्थ अपनी ही जिम्मेदारियों और मामलों में लगे रहना है; यह हिंदी में स्वाभाविक है और अनावश्यक कटुता से बचता है।
- source_word: ἐργάζεσθαι
  choice: काम करो
  rationale: यह सामान्य रूप से श्रम या काम करने को व्यक्त करता है और संदर्भ में स्वाभाविक है।
- source_word: ταῖς χερσὶν ὑμῶν
  choice: अपने हाथों से
  rationale: करण कारक और ὑμῶν के स्वत्व-सूचक बल को बनाए रखते हुए हाथ से स्वयं श्रम करने पर जोर देता है।
- source_word: καθὼς
  choice: जैसा कि
  rationale: पहले दिए गए प्रेरितीय निर्देश से तुलना को सहज हिंदी में व्यक्त करता है।
- source_word: παρηγγείλαμεν
  choice: हमने तुम्हें आज्ञा दी थी
  rationale: παραγγέλλω के अधिकारपूर्ण निर्देश के भाव को सुरक्षित रखता है; भूतकालीन संदर्भ पहले दिए गए आदेश की ओर संकेत करता है।
theological_decisions:
- issue: प्रेरितीय निर्देश का नैतिक और अधिकारपूर्ण बल
  choice: आज्ञा दी थी
  alternative: निर्देश दिया था
  rationale: मूल क्रिया साधारण सलाह से अधिक अधिकारपूर्ण निर्देश बताती है; ‘आज्ञा’ उसके बल को बिना किसी सांप्रदायिक व्याख्या के सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरंभ में ‘और’ रखा गया है। ‘काम-काज’ निजी मामलों और जिम्मेदारियों का स्वाभाविक, गैर-आक्रामक हिंदी रूप है।
