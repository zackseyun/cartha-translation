lexical_decisions:
- source_word: μὴ ἐν
  choice: में नहीं
  rationale: यह पिछले पद से जारी निर्देश में आचरण के ढंग या क्षेत्र का निषेध व्यक्त करता है।
- source_word: πάθει ἐπιθυμίας
  choice: वासना के आवेग में
  rationale: πάθος की प्रबल, नियंत्रित करने वाली भावना को ‘आवेग’ और इस यौन-नैतिक प्रसंग में ἐπιθυμία को ‘वासना’ से व्यक्त किया गया है; इससे दोनों शब्दों का संयुक्त नकारात्मक भाव स्वाभाविक हिन्दी में बना रहता है।
- source_word: καθάπερ καὶ
  choice: जैसे ... करते हैं
  rationale: तुलना को सहज हिन्दी में व्यक्त करता है। ‘भी’ को अलग से रखने पर वाक्य कृत्रिम होता; καί का तुलनात्मक बल इस संरचना में निहित है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी लोग
  rationale: पौलुस के प्रयोग में यह सामान्यतः यहूदियों से बाहर के लोगों को दर्शाता है। आधुनिक पाठक के लिए यह ‘अन्यजातियों’ से अधिक स्पष्ट और ‘मूर्तिपूजकों’ से कम व्याख्यात्मक है।
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: जो परमेश्वर को नहीं जानते
  rationale: विशेषणात्मक कृदन्त को जारी अवस्था बताने वाले स्वाभाविक सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: πάθει ἐπιθυμίας का नैतिक और यौन आशय
  choice: वासना के आवेग में
  alternative: तीव्र अभिलाषा में
  rationale: आस-पास का प्रसंग यौन पवित्रता का है, इसलिए ‘वासना’ उचित विशिष्टता देता है; ‘आवेग’ πάθος की प्रबलता को बनाए रखता है, बिना यह दावा किए कि प्रत्येक तीव्र इच्छा अपने-आप पापपूर्ण है।
- issue: ἔθνη की पहचान
  choice: गैर-यहूदी लोग
  alternative: जातियाँ; मूर्तिपूजक
  rationale: यह पौलुस की यहूदी/गैर-यहूदी श्रेणी को सुरक्षित रखता है। ‘मूर्तिपूजक’ यहाँ सम्भव अर्थ तो है, पर मूल शब्द से अधिक व्याख्यात्मक और अधिक निंदात्मक हो सकता है।
- issue: καί का अनुवाद
  choice: तुलनात्मक वाक्य-रचना में निहित
  alternative: जैसे गैर-यहूदी लोग भी करते हैं
  rationale: ‘भी’ का प्रत्यक्ष प्रयोग हिन्दी में गलत तुलना का आभास दे सकता है, मानो विश्वासियों के अतिरिक्त गैर-यहूदी भी यही करते हों। मूल का तुलनात्मक बल ‘जैसे ... करते हैं’ में स्पष्ट है।
translation_notes:
