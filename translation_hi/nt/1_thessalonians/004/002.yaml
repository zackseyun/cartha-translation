  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: hi
  text: क्योंकि आप जानते हैं कि हमने प्रभु यीशु के द्वारा[a] आपको क्या-क्या निर्देश दिए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु यीशु के अधिकार से।”
    reason: διὰ τοῦ κυρίου Ἰησοῦ में माध्यम/अभिकरण के साथ अधिकार की अर्थ-छाया भी सम्भव है।
lexical_decisions:
- source_word: οἴδατε
  choice: आप जानते हैं
  rationale: οἶδα का पूर्ण रूप कोइने यूनानी में वर्तमान अर्थ रखता है; आधुनिक मानक हिन्दी में यह स्वाभाविक अनुवाद है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संयोजक बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τίνας παραγγελίας
  choice: क्या-क्या निर्देश
  rationale: बहुवचन παραγγελίας को ‘निर्देश’ से व्यक्त किया गया है, और τίνας के साथ ‘क्या-क्या’ हिन्दी में बहुवचन सामग्री को सहज रूप से दर्शाता है। ‘निर्देश’ में शिक्षा और प्रामाणिक आदेश—दोनों की गुंजाइश बनी रहती है।
- source_word: ἐδώκαμεν ὑμῖν
  choice: हमने ... आपको ... दिए थे
  rationale: δίδωμι का सीधा अर्थ ‘देना’ है। भूतकालीन संदर्भ में ‘दिए थे’ पूर्व में दिए गए निर्देशों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या अभिकरण व्यक्त कर सकता है। ‘के द्वारा’ यूनानी संरचना को निकटता से रखते हुए मध्यस्थता और अधिकार, दोनों अर्थ-छायाओं के लिए स्थान छोड़ता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और सामान्य हिन्दी बाइबलीय पद।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित मानक रूप।
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ का अर्थ-बल
  choice: प्रभु यीशु के द्वारा
  alternative: प्रभु यीशु के अधिकार से
  rationale: मुख्य पाठ माध्यम/अभिकरण की यूनानी अभिव्यक्ति को सुरक्षित रखता है और अर्थ को केवल अधिकार तक सीमित नहीं करता। फिर भी प्रसंग में अधिकार की अर्थ-छाया सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन ‘आप’; भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है।
