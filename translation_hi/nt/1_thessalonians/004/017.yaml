id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: hi
  text: फिर हम, जो जीवित और बचे रहेंगे, उनके साथ ही बादलों में उठा लिए जाएँगे[a], प्रभु से मिलने के लिए हवा में[b]; और इस प्रकार हम सदा प्रभु के साथ रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झपटकर उठा लिए जाएँगे।” यूनानी क्रिया अचानक और प्रबल क्रिया पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रभु से भेंट करने के लिए।” यह पद प्रभु से मिलने की बात बताता है, पर इस भेंट के बाद का विस्तृत घटनाक्रम स्वयं निर्धारित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: फिर
  rationale: पिछले पद में मसीह में मरे हुओं के जी उठने के बाद अगली घटना का क्रम स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: जो जीवित हैं और बचे रहेंगे
  rationale: 'दोनों कृदंतों को बनाए रखता है: उस समय जीवित होना और तब तक शेष रहना। ‘बचे रहेंगे’ को भविष्यकाल में रखने से हिन्दी में संदर्भित भाव स्पष्ट होता है, पर किसी विशेष संकट से जीवित बच निकलने का अर्थ अनिवार्य नहीं बनाया गया।'
- source_word: ἅμα σὺν αὐτοῖς
  choice: उनके साथ ही
  rationale: यह पुनर्जीवित विश्वासियों के साथ सहभागिता और उसी अवसर पर होने—दोनों पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἁρπαγησόμεθα
  choice: उठा लिए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखता है और अचानक, प्रबल बाहरी क्रिया का भाव देता है, बिना इस पद पर बाद की किसी विशिष्ट युगांत-विषयक प्रणाली को थोपे।
- source_word: ἐν νεφέλαις
  choice: बादलों में
  rationale: बहुवचन और ठोस बादल-चित्रण को बनाए रखता है।
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ताकि हवा में प्रभु से मिलें
  rationale: उद्देश्य और भेंट, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; इससे आगे की यात्रा या घटनाक्रम को पद से अधिक निश्चित नहीं किया गया।
- source_word: καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: और इस प्रकार हम सदा प्रभु के साथ रहेंगे
  rationale: घटनाक्रम से निकलने वाले परिणाम तथा प्रभु के साथ निरंतर संगति के आश्वासन को सुरक्षित रखता है।
theological_decisions:
- issue: ἁρπαγησόμεθα का अनुवाद, जिसे प्रायः ‘रैप्चर’ संबंधी मतों से जोड़ा जाता है
  choice: उठा लिए जाएँगे
  alternative: झपटकर उठा लिए जाएँगे
  rationale: चुना हुआ पाठ यूनानी क्रिया की वास्तविक उठाए जाने की घटना और कर्मवाच्य को व्यक्त करता है, जबकि पादटिप्पणी उसके अचानक तथा प्रबल भाव को बताती है। इससे घटना के समय या स्वरूप के बारे में कोई सांप्रदायिक ढाँचा नहीं जोड़ा जाता।
- issue: εἰς ἀπάντησιν τοῦ κυρίου के बाद का निहित घटनाक्रम
  choice: ताकि हवा में प्रभु से मिलें
  alternative: प्रभु से भेंट करने के लिए हवा में जाएँ
  rationale: पद स्पष्ट रूप से प्रभु से मिलने की बात कहता है, पर इस भेंट के बाद दिशा या विस्तृत युगांत-विषयक क्रम नहीं बताता; अनुवाद उसी सीमा को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘प्रभु’ को κύριος की उपाधिगत शक्ति के लिए रखा गया है। वाक्य में मूल यूनानी का क्रम, सामूहिकता और अंतिम आश्वासन सुरक्षित हैं; पादटिप्पणी-चिह्न संबंधित पदबंधों के ठीक बाद रखे गए हैं।
