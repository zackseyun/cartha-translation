source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: hi
  text: क्योंकि हम तुमसे प्रभु के वचन के आधार पर यह कहते हैं कि हम जो जीवित हैं, जो प्रभु के आगमन[a] तक बचे रहेंगे, हम सो गए लोगों[b] से किसी भी रीति से पहले नहीं पहुँचेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी παρουσία का अनुवाद ‘उपस्थिति’ या ‘पहुँचना’ भी किया जा सकता है। यहाँ यह प्रभु के भावी आगमन को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सो गए लोग’ मृत्यु के लिए प्रयुक्त एक रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: प्रभु से मिले वचन के आधार पर
  rationale: यह वाक्यांश पौलुस के कथन के आधार और प्रभु से प्राप्त अधिकार को व्यक्त करता है, पर यह तय नहीं करता कि वह यीशु के किसी ज्ञात कथन का उद्धरण है या प्रभु से मिला प्रकाशन।
- source_word: παρουσίαν
  choice: आगमन
  rationale: इस अंतकालीन संदर्भ में यह प्रभु के भावी आने या पहुँचने की घटना को दर्शाता है; ‘आगमन’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: οἱ ζῶντες
  choice: हम जो जीवित हैं
  rationale: वर्तमान कृदंत का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: οἱ περιλειπόμενοι
  choice: बचे रहेंगे
  rationale: यह उन लोगों को दर्शाता है जो बताए गए समय तक जीवित शेष रहेंगे; यह ‘बचा लिए जाएँगे’ जैसी अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
- source_word: οὐ μὴ φθάσωμεν
  choice: किसी भी तरह पहले नहीं होंगे
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति और φθάνω के ‘पहले होना’ अर्थ—दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς κοιμηθέντας
  choice: सो चुके लोगों
  rationale: मृत विश्वासियों के लिए प्रयुक्त मूल यूनानी के नींद-रूपक को बनाए रखता है।
- source_word: κύριος / κυρίου
  choice: प्रभु
  rationale: इस प्रसंग में यह यीशु को दर्शाता है; ‘प्रभु’ मानक और संदर्भानुकूल रूप है।
theological_decisions:
- issue: ‘प्रभु के वचन’ से पौलुस के अभिप्राय का स्वरूप
  choice: ‘प्रभु से मिले वचन के आधार पर’ कहकर अधिकार और स्रोत व्यक्त किया गया, लेकिन संप्रेषण की विधि अनिर्धारित रखी गई।
  alternative: इसे प्रभु यीशु के किसी ज्ञात कथन का सीधा उद्धरण अथवा पौलुस को मिला प्रत्यक्ष प्रकाशन मानना।
  rationale: ἐν λόγῳ κυρίου प्रभु के अधिकार को स्पष्ट करता है, पर स्वयं यह नहीं बताता कि वह वचन किस रीति से पौलुस तक पहुँचा।
- issue: κοιμηθέντας का अर्थ
  choice: मृत विश्वासियों के लिए ‘सो चुके’ का रूपक बनाए रखा गया।
  alternative: इसे स्पष्ट रूप से ‘मर चुके लोग’ कहना।
  rationale: मूल पाठ मृत्यु को नींद के रूपक द्वारा प्रस्तुत करता है; इसे बनाए रखने से पुनरुत्थान की आशा से जुड़ी पौलुस की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पठन के अनुकूल शैली। ‘तुमसे’ बहुवचन समुदाय को संबोधित करता है। वाक्य की प्रबल निषेधात्मकता ‘किसी भी तरह ... नहीं’ से सुरक्षित रखी गई है।
