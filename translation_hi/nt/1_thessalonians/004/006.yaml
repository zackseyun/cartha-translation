id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: hi
  text: कि कोई इस बात में सीमा न लाँघे और अपने भाई[b] का अनुचित लाभ न उठाए[a], क्योंकि प्रभु इन सब बातों का बदला लेनेवाला है, जैसा कि हम तुमसे पहले भी कह चुके और तुम्हें गंभीरता से चेतावनी दे चुके हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मामले में अपने भाई को न ठगे।” यूनानी क्रिया किसी का अनुचित लाभ उठाने का अर्थ दे सकती है; कुछ लोग इसे अधिक संकुचित अर्थ में धोखा देना समझते हैं। निकट संदर्भ में यह चेतावनी संभवतः यौन अनैतिकता से संबंधित है।
    reason: lexical_alternative
  - marker: b
    text: “अपने भाई” के लिए यूनानी पद पुल्लिंग एकवचन है। यहाँ मुख्य रूप से किसी साथी विश्वासी की ओर संकेत हो सकता है, यद्यपि समुदाय में यह नैतिक चेतावनी अधिक व्यापक रूप से भी लागू हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: कि कोई ... सीमा न लाँघे
  rationale: संज्ञार्थक क्रियारूप पिछले पद के उपदेश को आगे बढ़ाता है। ‘सीमा न लाँघे’ नैतिक मर्यादा के उल्लंघन का रूपक बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πλεονεκτεῖν
  choice: अनुचित लाभ न उठाए
  rationale: क्रिया किसी दूसरे की कीमत पर अपना लाभ साधने या उसका शोषण करने का व्यापक भाव रखती है। यह चयन अर्थ को केवल आर्थिक धोखाधड़ी तक सीमित नहीं करता।
- source_word: ἐν τῷ πράγματι
  choice: इस बात में
  rationale: यूनानी पद संदर्भ से निश्चित है, पर अपने शब्दों में सामान्य बना रहता है। ‘इस बात में’ पिछले पदों की यौन-पवित्रता संबंधी चर्चा की ओर संकेत करता है, बिना उसे मूल से अधिक स्पष्ट किए।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई
  rationale: यूनानी पद पुल्लिंग एकवचन है। ‘अपने भाई’ उसके व्याकरणिक रूप को बनाए रखता है; संभव व्यापक सामुदायिक अर्थ पादटिप्पणी में बताया गया है।
- source_word: ἔκδικος κύριος
  choice: प्रभु ... बदला लेनेवाला है
  rationale: ἔκδικος अपराध के विरुद्ध न्याय लागू करने और दण्ड दिलानेवाले का भाव रखता है। ‘बदला लेनेवाला’ कथन की गंभीर न्यायिक चेतावनी को संक्षेप में सुरक्षित रखता है।
- source_word: περὶ πάντων τούτων
  choice: इन सब बातों का
  rationale: यह निकटवर्ती चर्चा में बताए गए सभी अनुचित कार्यों की व्यापकता बनाए रखता है।
- source_word: προείπαμεν
  choice: हम तुमसे पहले भी कह चुके
  rationale: यह पहले किए गए संवाद या निर्देश का समयगत भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διεμαρτυράμεθα
  choice: तुम्हें गंभीरता से चेतावनी दे चुके हैं
  rationale: यह क्रिया दृढ़ गवाही, आग्रह या गंभीर चेतावनी का भाव रखती है; उपदेशात्मक संदर्भ में ‘गंभीरता से चेतावनी’ उपयुक्त है।
theological_decisions:
- issue: ‘इस बात में’ का संदर्भ और अपराध का स्वरूप
  choice: मुख्य पाठ व्यापक शब्दावली रखता है, जबकि संदर्भ इसे यौन अनैतिकता से संबंधित चेतावनी के रूप में इंगित करता है।
  alternative: इसे सामान्य व्यापारिक या पारस्परिक धोखाधड़ी की चेतावनी समझना।
  rationale: पद 3–5 का निकट संदर्भ पवित्रीकरण, यौन अनैतिकता और पवित्रता में अपने शरीर पर नियंत्रण की चर्चा करता है। फिर भी πλεονεκτεῖν अधिक सामान्य धोखे या अनुचित लाभ को भी व्यक्त कर सकता है, इसलिए मुख्य पाठ अस्पष्टता को सुरक्षित रखता और पादटिप्पणी संकुचित विकल्प बताती है।
- issue: ἀδελφός का अनुवाद
  choice: अपने भाई
  alternative: अपने भाई या बहन; दूसरे विश्वासी
  rationale: मूल यूनानी पुल्लिंग एकवचन है। मुख्य पाठ स्रोत का रूप सुरक्षित रखता है, जबकि पादटिप्पणी संभावित व्यापक सामुदायिक प्रयोग स्पष्ट करती है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस संदर्भ में यह न्याय करनेवाले प्रभु को सूचित करता है; ‘प्रभु’ सामान्य बाइबलीय और धर्मवैचारिक निरंतरता बनाए रखता है।
- issue: ἔκδικος की न्यायिक धार
  choice: बदला लेनेवाला
  alternative: न्याय करके दण्ड देनेवाला
  rationale: मुख्य चयन मूल की तीखी चेतावनी और प्रतिफलात्मक न्याय को बनाए रखता है, पर इसे किसी मानवीय निजी वैर की तरह नहीं समझना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य पिछले पद से जारी आशय के कारण ‘कि कोई’ से आरम्भ होता है। ‘सीमा न लाँघे’ मूल रूपक को और ‘अनुचित लाभ न उठाए’ अर्थ की व्यापकता को सुरक्षित रखते हैं।
