  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: hi
  text: हमारे परमेश्वर और पिता स्वयं[a], और हमारे प्रभु यीशु, तुम्हारे पास जाने का हमारा मार्ग सीधा करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सीधा करें’ के लिए एकवचन क्रिया है, यद्यपि उसके साथ ‘हमारे परमेश्वर और पिता’ और ‘हमारे प्रभु यीशु’ दोनों संयुक्त कर्ता हैं।
    reason: cross_reference
  - marker: b
    text: या, “हमारे मार्ग को तुम्हारी ओर सीधा करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: स्वयं
  rationale: यह बलवाचक प्रयोग परमेश्वर और पिता की व्यक्तिगत पहल पर जोर देता है। वाक्य के आरम्भ में ‘स्वयं’ रखना आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि प्रार्थनात्मक अभिलाषा की ओर हल्का संक्रमण दिखाता है। हिन्दी में अलग से ‘अब’ या ‘परन्तु’ जोड़ना अनावश्यक कालगत या विरोधात्मक अर्थ दे सकता था।
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: हमारे परमेश्वर और पिता
  rationale: यह दोनों उपाधियों को एक ही व्यक्ति के लिए प्रयुक्त मानते हुए यूनानी संरचना और क्रम को निकटता से बनाए रखता है।
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: हमारे प्रभु यीशु
  rationale: κύριος के लिए ‘प्रभु’ और Ἰησοῦς के लिए प्रचलित हिन्दी रूप ‘यीशु’ रखा गया है; यूनानी का ‘हमारे’ भी सुरक्षित है।
- source_word: κατευθύναι
  choice: सीधा करें
  rationale: अओरिस्ट ऑप्टेटिव प्रार्थना अथवा अभिलाषा व्यक्त करता है। ‘सीधा करें’ मार्ग को सीधा करने और यात्रा संभव कराने—दोनों भावों को बनाए रखता है।
- source_word: τὴν ὁδὸν ἡμῶν
  choice: हमारा मार्ग
  rationale: ὁδός वास्तविक रास्ते या यात्रा के अवसर, दोनों की ओर संकेत कर सकता है। ‘हमारा मार्ग’ इस व्यापकता को सुरक्षित रखता है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास आने का
  rationale: यह थिस्सलुनीकियों की ओर यात्रा की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘आने का’ प्रसंग में निहित यात्रा-संबंधी अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: ‘हमारे परमेश्वर और पिता’ तथा ‘हमारे प्रभु यीशु’ के साथ यूनानी में एकवचन क्रिया
  choice: दोनों कर्ताओं को स्पष्ट रूप से साथ रखा गया है और एक ही संयुक्त प्रार्थना के अंतर्गत ‘सीधा करें’ कहा गया है।
  alternative: वाक्य को इस प्रकार पुनर्गठित करना कि क्रिया मुख्यतः केवल परमेश्वर पर लागू होती दिखाई दे, अथवा दोनों के लिए अलग-अलग क्रियाएँ देना।
  rationale: यूनानी पाठ पिता और प्रभु यीशु को एक ही एकवचन क्रिया के संयुक्त कर्ताओं के रूप में प्रस्तुत करता है। हिन्दी में आदरसूचक ‘करें’ से वचन का रूप निर्णायक रूप से दिखाई नहीं देता, इसलिए पाठ की उल्लेखनीय व्याकरणिक विशेषता पादटिप्पणी में बताई गई है, बिना उससे आगे कोई धर्मसैद्धान्तिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है। ‘स्वयं’ मूल के बल को बनाए रखता है, जबकि ‘मार्ग सीधा करें’ यात्रा के वास्तविक रास्ते और उसे संभव बनाने—दोनों अर्थों के लिए खुला रहता है।
