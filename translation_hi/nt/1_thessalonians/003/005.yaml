reference: 1 Thessalonians 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: hi
  text: इसी कारण, जब मुझसे और सहा न गया, तो मैंने तुम्हारे विश्वास[a] का हाल जानने के लिए भेजा, कहीं ऐसा न हो कि परीक्षा में डालनेवाले ने तुम्हें परीक्षा में डाल दिया हो और हमारा परिश्रम व्यर्थ न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी विश्वासयोग्यता” अथवा “तुम्हारे भरोसे।” यूनानी शब्द प्रसंग के अनुसार इन परस्पर जुड़े अर्थों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह स्वाभाविक हिन्दी में पिछले कथन की ओर संकेत करने वाला कारणसूचक संबंध बनाए रखता है।
- source_word: κἀγὼ
  choice: मैंने
  rationale: καί का भाव प्रसंग में निहित है; हिन्दी में ‘मैंने भी’ कहना अनावश्यक बल दे सकता है।
- source_word: μηκέτι στέγων
  choice: जब मुझसे और सहा न गया
  rationale: यह सहने की सीमा समाप्त हो जाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔπεμψα
  choice: मैंने ... भेजा
  rationale: मूल में कर्म स्पष्ट नहीं है; पिछले संदर्भ से तीमुथियुस समझा जाता है, पर उसे इस पद में जोड़ा नहीं गया।
- source_word: εἰς τὸ γνῶναι
  choice: हाल जानने के लिए
  rationale: उद्देश्यसूचक infinitive और सूचना प्राप्त करने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τὴν πίστιν ὑμῶν
  choice: तुम्हारे विश्वास
  rationale: πίστις का यहाँ सबसे स्वाभाविक अर्थ मसीहियों का बना रहने वाला विश्वास है; निकटवर्ती अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: μή πως
  choice: कहीं ऐसा न हो कि
  rationale: यह पौलुस की आशंका को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: परीक्षा में डालनेवाले ने तुम्हें परीक्षा में डाल दिया हो
  rationale: संज्ञात्मक participle और क्रिया की मूल शब्द-पुनरावृत्ति को सुरक्षित रखता है तथा प्रलोभन और परीक्षा की जानबूझकर खुली अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: εἰς κενὸν γένηται
  choice: व्यर्थ हो गया हो
  rationale: हिन्दी का स्वाभाविक मुहावरा है, जो निष्फल हो जाने की आशंका और यूनानी subjunctive की अनिश्चितता को व्यक्त करता है।
- source_word: ὁ κόπος ἡμῶν
  choice: हमारा परिश्रम
  rationale: κόπος में निहित कठिन और श्रमसाध्य कार्य का भार ‘परिश्रम’ से स्पष्ट होता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस संदर्भ में थिस्सलुनीकियों के बने रहने वाले विश्वास की चिंता प्रमुख है, फिर भी शब्द की अन्य संभावित छायाएँ पादटिप्पणी में दी गई हैं।
- issue: πειράζω शब्द-समूह का अनुवाद
  choice: परीक्षा में डालना / परीक्षा में डालनेवाला
  alternative: बहकाना / बहकानेवाला; परखना / परखनेवाला
  rationale: यूनानी शब्द परीक्षा और प्रलोभन दोनों की अर्थ-सीमा रख सकता है। मुख्य पाठ स्रोत की पुनरावृत्ति और कुछ अस्पष्टता बचाता है; ‘शैतान’ नाम जोड़कर वर्णन को स्पष्ट नहीं किया गया।
- issue: μή πως के बाद संभावित परिणाम
  choice: डाल दिया हो ... व्यर्थ हो गया हो
  alternative: शायद डाल दिया था ... व्यर्थ हो जाता
  rationale: यह पौलुस की आशंका व्यक्त करता है, बिना यह घोषित किए कि परीक्षा या परिश्रम की निष्फलता वास्तव में हो चुकी थी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। वाक्य में पौलुस की चिंता और मूल की शब्द-पुनरावृत्ति सुरक्षित रखी गई है; अंतर्निहित कर्म के रूप में ‘तीमुथियुस’ नहीं जोड़ा गया।
