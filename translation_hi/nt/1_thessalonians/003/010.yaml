translation:
  language: hi
  text: हम रात-दिन बहुत ही उत्कटता से प्रार्थना करते हैं, ताकि तुम्हें आमने-सामने देख सकें और तुम्हारे विश्वास में जो कमी है, उसे पूरा कर सकें।[a]
  philosophy: optimal-equivalence
  footnotes:
