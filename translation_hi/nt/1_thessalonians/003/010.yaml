    text: या “तुम्हारे विश्वास में जो कुछ अभी नहीं है।” यूनानी को अधिक व्यापक अर्थ में उस बात के लिए भी समझा जा सकता है जिसे तुम्हारे विश्वास में अभी दृढ़ या पूर्ण किए जाने की आवश्यकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: रात-दिन
  rationale: यह स्वाभाविक हिन्दी मुहावरा निरन्तर अथवा बार-बार किए जाने वाले कार्य का भाव व्यक्त करता है।
- source_word: ὑπερεκπερισσοῦ
  choice: अत्यन्त उत्कटता से
  rationale: यह दुर्लभ क्रियाविशेषण बहुत प्रबल और बढ़े हुए आग्रह को दर्शाता है; चुना हुआ पद प्रार्थना की तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δεόμενοι
  choice: प्रार्थना करते हैं
  rationale: कृदन्त का अर्थ विनती या आग्रहपूर्वक प्रार्थना करना है। तीव्रता साथ आए क्रियाविशेषण से स्पष्ट होती है।
- source_word: εἰς τὸ ἰδεῖν
  choice: कि ... देख सकें
  rationale: सव्यय भाववाचक क्रिया यहाँ उद्देश्य व्यक्त करती है; हिन्दी में यह रचना स्वाभाविक है।
- source_word: ὑμῶν τὸ πρόσωπον
  choice: तुम्हें आमने-सामने
  rationale: यूनानी में शाब्दिक रूप से ‘तुम्हारा मुख’ है, पर आशय व्यक्तिगत भेंट और उपस्थिति है। ‘आमने-सामने’ ठोस और सम्बन्धपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καταρτίσαι
  choice: पूरा कर सकें
  rationale: क्रिया का अर्थ व्यवस्थित करना, सुधारना, सुसज्जित करना या पूर्ण करना हो सकता है। ‘कमी’ के साथ ‘पूरा करना’ स्वाभाविक है और आवश्यक सहायता देकर विश्वास को परिपक्व करने का भाव रखता है।
- source_word: τὰ ὑστερήματα
  choice: जो कमी है
  rationale: बहुवचन संज्ञा कमियों या अभावों को सूचित करती है; हिन्दी में सामूहिक एकवचन अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: τῆς πίστεως ὑμῶν
  choice: तुम्हारे विश्वास में
  rationale: यहाँ πίστις थिस्सलुनीकियों के उस विश्वास या भरोसे को दर्शाता है जिसे और दृढ़ तथा परिपक्व किए जाने की आवश्यकता है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस प्रसंग में मुख्य भाव मसीहियों के विश्वास या भरोसे का है, न कि प्रधानतः उनके विश्वासयोग्य आचरण का। फिर भी वाक्य यह नहीं कहता कि उनमें विश्वास नहीं है, बल्कि यह कि उसमें कुछ अभी पूरा या दृढ़ किया जाना बाकी है।
- issue: विश्वास में ‘कमी’ का आशय
  choice: जो कमी है, उसे पूरा करना
  alternative: जिसे दृढ़ या पूर्ण किए जाने की आवश्यकता है
  rationale: τὰ ὑστερήματα और καταρτίσαι अभाव को पूरा करने का सीधा भाव देते हैं, पर καταρτίσαι में सुधारने, सुदृढ़ करने और पूर्णता की ओर लाने का व्यापक अर्थ भी सम्भव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
