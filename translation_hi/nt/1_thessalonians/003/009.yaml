  to: क्योंकि आपके विषय में हम परमेश्वर को कौन-सा धन्यवाद लौटा सकते हैं, उस सारे आनन्द के लिए जिसमें हम आपके कारण अपने परमेश्वर के सामने आनन्दित होते हैं?
