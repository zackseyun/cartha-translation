id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: hi
  text: क्योंकि आपके विषय में हम परमेश्वर को कौन-सा धन्यवाद लौटा सकते हैं, उस सारे आनन्द के लिए जिसमें हम आपके कारण अपने परमेश्वर के सामने आनन्दित होते हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: क्या धन्यवाद
  rationale: प्रश्नवाचक पदबंध को सीधे रखा गया है, ताकि पर्याप्त धन्यवाद दे पाने की असमर्थता व्यक्त करने वाला आलंकारिक प्रश्न बना रहे।
- source_word: δυνάμεθα
  choice: हम ... सकते हैं
  rationale: वर्तमानकालीन सामर्थ्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और प्रश्न का आलंकारिक बल बनाए रखता है।
- source_word: ἀνταποδοῦναι
  choice: लौटा सकते हैं
  rationale: क्रिया में निहित प्रतिदान या बदले में वापस देने की धारणा को सुरक्षित रखता है; केवल ‘दे सकते हैं’ कहने से यह अर्थ घट जाता।
- source_word: περὶ ὑμῶν
  choice: आपके विषय में
  rationale: περί के सम्बन्ध-सूचक अर्थ को व्यक्त करता है और आगे आने वाले δι’ ὑμᾶς (‘आपके कारण’) से भेद बनाए रखता है।
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: उस सारे आनन्द के बदले
  rationale: यहाँ ἐπί धन्यवाद लौटाने के आधार या अवसर को सूचित करता है; ‘के बदले’ ἀνταποδοῦναι के प्रत्युत्तरात्मक भाव से भी स्वाभाविक रूप से जुड़ता है।
- source_word: ᾗ χαίρομεν
  choice: जिससे हम ... आनन्दित होते हैं
  rationale: χαρά और χαίρω की शब्दगत पुनरावृत्ति को ‘आनन्द’ और ‘आनन्दित’ द्वारा बनाए रखा गया है।
- source_word: δι’ ὑμᾶς
  choice: आपके कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है; ‘आपके कारण’ स्पष्ट और स्वाभाविक है।
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: अपने परमेश्वर के सामने
  rationale: परमेश्वर की उपस्थिति का स्थानात्मक रूपक संक्षिप्त और स्रोत-संगत ढंग से सुरक्षित है; हिन्दी वाक्य में ‘हमारे’ के स्थान पर आत्मवाचक ‘अपने’ अधिक स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर को धन्यवाद ‘लौटाने’ की आलंकारिक भाषा
  choice: ‘क्या धन्यवाद लौटा सकते हैं’
  alternative: ‘हम आपके लिए परमेश्वर को पर्याप्त धन्यवाद कैसे दे सकते हैं?’
  rationale: मूल ἀνταποδοῦναι में प्रतिदान या वापस देने का स्पष्ट भाव है। उसे बनाए रखने पर भी आलंकारिक प्रश्न यह स्पष्ट करता है कि आशय परमेश्वर के साथ लेन-देन नहीं, बल्कि अपने धन्यवाद को अपर्याप्त मानना है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ अपनाया गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल के ‘आनन्द ... आनन्दित’ शब्दालंकार तथा ‘धन्यवाद लौटाने’ के असामान्य पर अर्थपूर्ण रूपक को सुरक्षित रखा गया है।
