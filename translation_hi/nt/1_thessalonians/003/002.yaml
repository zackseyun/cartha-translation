lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: हमने भेजा
  rationale: अओरिस्ट कथात्मक क्रिया को सहज और स्पष्ट सामान्य भूतकाल में व्यक्त किया गया है।
- source_word: Τιμόθεον
  choice: तीमुथियुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ἀδελφὸν ἡμῶν
  choice: हमारा भाई
  rationale: विश्वासियों के पारिवारिक संबंध को व्यक्त करने वाले यूनानी रूपक और उसके आत्मीय बल को सुरक्षित रखता है।
- source_word: συνεργὸν τοῦ θεοῦ
  choice: परमेश्वर का सहकर्मी
  rationale: SBLGNT के पाठ का प्रबल और धर्मवैज्ञानिक तनावयुक्त कथन बिना कमज़ोर किए सुरक्षित रखा गया है; संबंधवाचक षष्ठी की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: मसीह के सुसमाचार में
  rationale: ἐν को सेवा के क्षेत्र के रूप में और संबंधवाचक रचना को उसकी वास्तविक अस्पष्टता सहित रखा गया है कि सुसमाचार मसीह का है अथवा मसीह के विषय में।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός की पदवीगत भावना को प्रचलित और अर्थपूर्ण हिन्दी पद ‘मसीह’ व्यक्त करता है।
- source_word: εἰς τὸ στηρίξαι
  choice: ताकि वह तुम्हें दृढ़ करे
  rationale: εἰς के साथ प्रयुक्त सव्यंजन infinitive का प्रयोजन स्पष्ट हिन्दी प्रयोजनवाचक रचना से व्यक्त किया गया है।
- source_word: παρακαλέσαι
  choice: तुम्हारा उत्साह बढ़ाए
  rationale: संकट में सहायक pastoral अर्थ को व्यक्त करता है और इसे केवल सांत्वना या केवल उपदेश तक सीमित नहीं करता।
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: तुम्हारे विश्वास के विषय में
  rationale: ὑπέρ के ‘के विषय में’ अर्थ को अपनाया गया है; ‘तुम्हारे विश्वास की खातिर’ भी संदर्भगत रूप से संभव है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις विश्वासियों के भरोसे और विश्वास की ओर संकेत करता है; ‘विश्वासयोग्यता’ प्राथमिक अर्थ नहीं है।
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का सहकर्मी
  alternative: परमेश्वर के साथ सहकर्मी; परमेश्वर का सेवक
  rationale: मुख्य पाठ SBLGNT के συνεργὸν τοῦ θεοῦ को उसके धर्मवैज्ञानिक तनाव सहित रखता है। ‘सेवक’ कुछ अन्य पाठ-साक्ष्यों का प्रतिनिधित्व करता है, पर इसे मुख्य पाठ में लाकर कठिन अभिव्यक्ति को सरल नहीं किया गया।
- issue: εὐαγγελίῳ τοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस संबंधवाचक पदबंध में पदवीगत अर्थ प्रमुख है; हिन्दी ‘मसीह’ अर्थ और प्रचलन दोनों को स्वाभाविक रूप से व्यक्त करता है।
