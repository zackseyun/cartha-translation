  text: और हमने तीमुथियुस को भेजा—जो हमारा भाई और मसीह के सुसमाचार में परमेश्वर का सहकर्मी है[a]—ताकि वह तुम्हें दृढ़ करे और तुम्हारे विश्वास के विषय में तुम्हें प्रोत्साहित करे।
