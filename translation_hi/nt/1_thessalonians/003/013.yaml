  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: hi
  text: ताकि वह तुम्हारे हृदयों को दृढ़ करे, जिससे वे हमारे परमेश्वर और पिता के सामने पवित्रता में निर्दोष हों, जब हमारे प्रभु यीशु अपने सभी पवित्र जनों[a] के साथ आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने सभी संतों के साथ।’ इस प्रसंग में यूनानी पद ‘पवित्र जन’ पवित्र लोगों, स्वर्गदूतों, या दोनों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: ताकि वह ... दृढ़ करे
  rationale: सव्यय आर्टिकुलर इनफिनिटिव पूर्ववर्ती कथन से जुड़े उद्देश्य या परिणाम को व्यक्त करता है; हिन्दी में सीमित क्रिया वाला ‘ताकि’ उपवाक्य इसका स्वाभाविक रूप है।
- source_word: στηρίξαι
  choice: दृढ़ करे
  rationale: क्रिया का अर्थ मजबूत या स्थिर करना है। ‘हृदयों’ के साथ ‘दृढ़ करे’ आधुनिक हिन्दी में सहज है और स्थिरता का भाव बनाए रखता है।
- source_word: καρδίας
  choice: हृदयों
  rationale: पौलुस के प्रयोग में यह केवल भावनाओं के बजाय भीतरी मनुष्य को सूचित करता है; ‘हृदय’ उस व्यापक और धर्मवैचारिक अर्थ को बनाए रखता है।
- source_word: ἀμέμπτους
  choice: निर्दोष
  rationale: यह वैध दोषारोपण से मुक्त होने का नैतिक भाव संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἁγιωσύνῃ
  choice: पवित्रता में
  rationale: यह पवित्र होने की अवस्था या गुण को सीधे व्यक्त करता है और अनावश्यक तकनीकी भाषा से बचता है।
- source_word: ἔμπροσθεν
  choice: के सामने
  rationale: यह परमेश्वर की उपस्थिति या दृष्टि में खड़े होने का भाव स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: हमारे परमेश्वर और पिता
  rationale: यह यूनानी पदबंध की संयुक्त संरचना को सुरक्षित रखते हुए सहज हिन्दी देता है।
- source_word: παρουσίᾳ
  choice: जब ... आएँ
  rationale: इस अंतकालीन प्रसंग में παρουσία प्रभु के भावी आगमन को सूचित करता है; हिन्दी उपवाक्य घटना को स्पष्ट रूप से व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का मानक और इस मसीही उपाधि के अनुकूल हिन्दी रूप है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: नाम का प्रचलित मानक हिन्दी रूप अपनाया गया है।
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: अपने सभी पवित्र जनों के साथ
  rationale: ‘पवित्र जन’ ἅγιοι की व्यापकता को बनाए रखता है और मुख्य पाठ में उसे केवल स्वर्गदूतों या केवल पवित्र विश्वासियों तक सीमित नहीं करता।
theological_decisions:
- issue: ‘उसके सभी पवित्र जनों’ का अभिप्रेत समूह
  choice: पवित्र जनों
  alternative: संतों; पवित्र लोगों; स्वर्गदूतों
  rationale: इस अंतकालीन संदर्भ में यूनानी ἁγίων पवित्र मनुष्यों, स्वर्गदूतों, या दोनों को सूचित कर सकता है। मुख्य पाठ किसी एक विकल्प को निश्चित नहीं करता और पादटिप्पणी वास्तविक अस्पष्टता स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य को हिन्दी की स्वाभाविक सूचना-रचना के अनुसार व्यवस्थित किया गया है, जबकि उद्देश्य, पवित्रता, निर्दोषता, आगमन और परमेश्वर के सामने उत्तरदायित्व के सभी प्रमुख अर्थ सुरक्षित हैं।
