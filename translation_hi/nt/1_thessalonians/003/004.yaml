source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: hi
  text: क्योंकि जब हम तुम्हारे साथ ही थे, तब हम तुम्हें पहले से बार-बार बताते थे कि हमें क्लेश सहना पड़ेगा[a]। और वैसा ही हुआ, जैसा तुम जानते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर कष्ट आएँगे” अथवा “हमें सताया जाएगा।” यूनानी क्रिया दबाव, संकट, कष्ट या सताव झेलने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... तब भी
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और καί का हल्का बल ‘तब भी’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: जब हम तुम्हारे साथ थे
  rationale: यह उनके बीच व्यक्तिगत उपस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προελέγομεν
  choice: पहले से बार-बार बताते थे
  rationale: ‘पहले से’ προ- का अर्थ रखता है और ‘बार-बार बताते थे’ अपूर्ण भूतकाल की जारी अथवा पुनरावृत्त क्रिया को दर्शाता है; ‘चेतावनी देते थे’ अनावश्यक रूप से अर्थ को संकुचित करता।
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: कि हमें क्लेश सहना पड़ेगा
  rationale: μέλλομεν की अपेक्षित/आसन्न भावी घटना और θλίβεσθαι की पीड़ा-दबाव-विपत्ति की व्यापकता को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: καθὼς καὶ ἐγένετο
  choice: और ठीक वैसा ही हुआ
  rationale: καθώς की पूर्वकथन और घटना के बीच सटीक अनुरूपता तथा καί का पुष्टिकारक बल इस वाक्यांश में व्यक्त होता है।
- source_word: καὶ οἴδατε
  choice: जैसा कि तुम जानते हो
  rationale: यूनानी का भाव स्वाभाविक हिन्दी में रखा गया है; ज्ञात बात संदर्भ से स्पष्ट है और अलग ‘इसे’ जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: θλίβεσθαι में वर्णित कष्ट का स्वरूप
  choice: व्यापक अर्थ वाला ‘क्लेश सहना’, जिसमें विरोध या सताव सम्मिलित हो सकता है
  alternative: विशेष रूप से ‘सताया जाना’ अथवा तकनीकी/अंतकालीन अर्थ में ‘महाक्लेश सहना’
  rationale: निकटवर्ती संदर्भ विरोध और कठिनाई की ओर संकेत करता है, पर यूनानी क्रिया स्वयं किसी एक प्रकार के कष्ट या तकनीकी अंतकालीन अर्थ तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘तुम’ बहुवचन कलीसियाई समुदाय के लिए है। भाषा सरल और गरिमापूर्ण रखी गई है। ‘क्लेश’ संदर्भगत शब्द-संबंध बनाए रखता है, जबकि पादटिप्पणी उसके व्यापक अर्थ को स्पष्ट करती है।
