id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: hi
  text: और प्रभु तुम्हें एक-दूसरे के प्रति और सबके प्रति प्रेम में बढ़ाए और प्रेम से भरपूर करे[a], ठीक वैसे ही जैसे हम भी तुम्हारे प्रति प्रेम रखते हैं[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक-दूसरे की ओर और सबकी ओर।”
    reason: εἰς ἀλλήλους καὶ εἰς πάντας की दिशात्मकता का वैकल्पिक स्वाभाविक अनुवाद।
  - marker: b
    text: यूनानी में अंतिम वाक्यांश संक्षिप्त और क्रियाविहीन है; शब्दशः, “ठीक वैसे ही जैसे हम भी तुम्हारे प्रति।” उसका अर्थ पिछले वाक्यांश के आधार पर पूरा किया गया है।
    reason: अंतिम यूनानी उपवाक्य की ellipsis को स्पष्ट करता है।
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि प्रार्थनापूर्ण कामना को पिछले कथन से सहज रूप से जोड़ता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी धार्मिक शीर्षक है; पद में उसके संदर्भित व्यक्ति को अधिक स्पष्ट किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: πλεονάσαι καὶ περισσεύσαι
  choice: बढ़ाए और भरपूर करे
  rationale: दोनों समानार्थी क्रियाओं को अलग रखते हुए उनकी क्रमिक तीव्रता व्यक्त की गई है; प्रभु को कर्ता और ‘तुम्हें’ को कर्म मानने वाली यूनानी रचना भी सुरक्षित रहती है।
- source_word: τῇ ἀγάπῃ
  choice: प्रेम में
  rationale: सम्बन्धवाचक दत्तिव प्रेम को उस क्षेत्र या विषय के रूप में प्रस्तुत करता है जिसमें वृद्धि और भरपूरी होनी है।
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: एक-दूसरे के प्रति और सबके प्रति
  rationale: ‘के प्रति’ εἰς की दिशात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सबके’ का दायरा मूल की तरह अनिर्दिष्ट और व्यापक रहता है।
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: ठीक वैसे ही जैसे हम भी तुम्हारे प्रति प्रेम रखते हैं
  rationale: यूनानी में अंतिम उपवाक्य क्रियाविहीन है। हिन्दी में अर्थ पूरा करने के लिए निकटवर्ती ‘प्रेम’ को स्पष्ट रूप से दोहराया गया है, पर भरपूरी जैसी कोई अतिरिक्त विशिष्टता नहीं जोड़ी गई।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: केवल ‘प्रभु’ रखा गया है।
  alternative: इसे स्पष्ट रूप से मसीह अथवा परमेश्वर के लिए प्रयुक्त बताना।
  rationale: मूल पद κύριος शीर्षक देता है, पर इसी पद में संदर्भित व्यक्ति को स्पष्ट नहीं करता; अनुवाद उसी खुलापन को बनाए रखता है।
- issue: πάντας का दायरा
  choice: ‘सबके’—दायरा अनिर्दिष्ट रखा गया है।
  alternative: ‘सभी लोगों’ या ‘सभी विश्वासियों’ के रूप में सीमित करना।
  rationale: सन्दर्भ व्यापक प्रेम का संकेत दे सकता है, पर यूनानी शब्द स्वयं किसी एक समूह को निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। ‘भरपूर करे’ सामान्य पाठक के लिए स्वाभाविक है और περισσεύσαι की प्रचुरता व्यक्त करता है। दोनों पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
