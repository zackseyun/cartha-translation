  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: hi
  text: ताकि इन क्लेशों के कारण कोई विचलित न हो।[a][b] क्योंकि तुम स्वयं जानते हो कि हम इसी के लिए ठहराए गए हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अस्थिर’ अथवा ‘व्याकुल’। इस दुर्लभ क्रिया का अन्य प्रसंगों में ‘बहकाया जाना’ या ‘चापलूसी से अपने पक्ष में किया जाना’ अर्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘इन क्लेशों में’; या ‘इन विपत्तियों के कारण’।
    reason: lexical_alternative
  - marker: c
    text: या ‘हमारे लिए यही नियत है’ अथवा ‘हम इसी के लिए रखे गए हैं’।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: ताकि ... कोई विचलित न हो
  rationale: संज्ञार्थक क्रियारूप पूर्ववर्ती कथन से जुड़े उद्देश्य या परिणाम को व्यक्त करता है। दुर्लभ क्रिया σαίνεσθαι यहाँ कष्टों के कारण अस्थिर या विचलित होने का भाव देती है; इसलिए आधुनिक हिन्दी में ‘विचलित न हो’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: इन क्लेशों के कारण
  rationale: θλίψεσιν दबाव, संकट या पीड़ादायक कठिनाइयों का बोध कराता है। ‘क्लेश’ पौलुस के प्रयोग की गंभीरता बनाए रखता है। ἐν का मूल भाव ‘में’ है, पर ‘विचलित’ के साथ यहाँ कारण/परिस्थिति को हिन्दी में ‘के कारण’ कहना अधिक स्वाभाविक है।
- source_word: αὐτοὶ
  choice: तुम स्वयं
  rationale: αὐτοὶ बलाघाती है; ‘तुम स्वयं’ इस जोर को सुरक्षित रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक होते हुए भी वर्तमान अर्थ में प्रयुक्त है; ‘जानते हो’ उपयुक्त है।
- source_word: εἰς τοῦτο
  choice: इसी के लिए
  rationale: यह पदबंध अभी बताए गए क्लेशों की ओर संकेत करता है। ‘इसी के लिए’ संकेत और बल दोनों को संक्षेप में व्यक्त करता है, बिना ‘उद्देश्य’ का अर्थ अनावश्यक रूप से थोपे।
- source_word: κείμεθα
  choice: हम ... ठहराए गए हैं
  rationale: κεῖμαι का मूल अर्थ रखा या स्थित होना है; इस मुहावरे में नियत या नियुक्त होने का भाव है। ‘ठहराए गए हैं’ निष्क्रिय और नियत स्थिति को व्यक्त करता है, पर अत्यधिक नियतिवादी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: εἰς τοῦτο κείμεθα में विश्वासियों और क्लेशों का संबंध
  choice: हम इसी के लिए ठहराए गए हैं
  alternative: हमारे लिए यही नियत है; हम इसी के लिए रखे गए हैं
  rationale: पाठ क्लेशों को विश्वासियों के जीवन में अपेक्षित और नियत वास्तविकता बताता है, पर नियतिवाद या पूर्वनियति की कोई विस्तृत धर्मवैज्ञानिक प्रणाली स्पष्ट नहीं करता। ‘ठहराए गए हैं’ मूल की गंभीरता और निष्क्रियता को बनाए रखते हुए उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘क्लेश’ बाइबलीय गंभीरता रखता है और सामान्य पाठक के लिए भी बोधगम्य है। ‘विचलित’ मानसिक व आत्मिक अस्थिरता दोनों को समेटता है। सभी वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
