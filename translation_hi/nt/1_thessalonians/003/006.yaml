source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: hi
  text: पर अब तीमुथियुस तुम्हारे यहाँ से हमारे पास आया है और वह तुम्हारे विश्वास[a] और प्रेम का शुभ समाचार हमारे लिए लेकर आया है। उसने यह भी बताया कि तुम हमें सदा अच्छे भाव से याद करते हो और हमें देखने की लालसा रखते हो, जैसे हम भी तुम्हें देखने की लालसा रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता।” यूनानी शब्द पिस्तिस का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: पर अब
  rationale: Ἄρτι वर्तमान और हाल की स्थिति को सूचित करता है, जबकि δὲ पिछली चिंता से अब मिली राहत की ओर हल्का विरोधात्मक संक्रमण दिखाता है।
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: तीमुथियुस तुम्हारे पास से हमारे पास आया है
  rationale: यूनानी genitive absolute को स्वाभाविक हिन्दी के पूर्ण क्रियापद वाले वाक्यांश में व्यक्त किया गया है; ‘आया है’ हाल की घटना का भाव रखता है।
- source_word: εὐαγγελισαμένου
  choice: शुभ समाचार दिया है
  rationale: यहाँ क्रिया सुसमाचार प्रचार के तकनीकी अर्थ में नहीं, तीमुथियुस की अनुकूल सूचना के लिए प्रयुक्त है; ‘शुभ समाचार’ मूल की सकारात्मक और सुसमाचार-संबंधी प्रतिध्वनि दोनों बनाए रखता है।
- source_word: τὴν πίστιν
  choice: विश्वास
  rationale: πίστις का सामान्य और प्रसंगानुकूल अनुवाद ‘विश्वास’ है; ‘विश्वासयोग्यता’ की संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का मानक, स्पष्ट और स्वाभाविक हिन्दी अनुवाद।
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: तुम हमें सदा अच्छी तरह याद करते हो
  rationale: शाब्दिक ‘हमारी अच्छी स्मृति रखते हो’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और सकारात्मक स्मरण का आशय बनाए रखता है।
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: हमसे मिलने के लिए तरसते हो
  rationale: ἐπιποθέω की प्रबल स्नेहपूर्ण अभिलाषा को ‘तरसते हो’ व्यक्त करता है; ἰδεῖν को प्रसंगानुसार ‘मिलने’ कहा गया है।
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: ठीक वैसे ही जैसे हम भी तुमसे मिलने के लिए तरसते हैं
  rationale: यूनानी में लुप्त क्रिया को हिन्दी में स्पष्ट किया गया है, जिससे पारस्परिक अभिलाषा और तुलना दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: πίστις में ‘विश्वास’ और ‘विश्वासयोग्यता’ की अर्थ-संभावना
  choice: तुम्हारे विश्वास
  alternative: तुम्हारी विश्वासयोग्यता
  rationale: प्रसंग मुख्यतः थिस्सलुनीकियों के बने रहने वाले विश्वास की सूचना देता है, इसलिए मुख्य पाठ में ‘विश्वास’ रखा गया है; दृढ़ निष्ठा या विश्वासयोग्यता की संभावित अर्थ-छाया को दबाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। ‘तुम’ बहुवचन मण्डली को संबोधित करता है। मूल यूनानी पद्य एक लंबे वाक्य का अंश है, पर स्वतंत्र पठनीयता के लिए हिन्दी में इसे दो वाक्यों में बाँटा गया है।
