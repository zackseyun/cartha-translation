translation:
  language: hi
  text: क्योंकि अब हम जीते हैं,[a] यदि तुम प्रभु में दृढ़ बने रहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम जीते हैं।” यहाँ यह संभवतः नई स्फूर्ति या प्रोत्साहन की आलंकारिक अभिव्यक्ति है, केवल शारीरिक रूप से जीवित रहने का कथन नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उसका स्वाभाविक कारणसूचक बल बनाए रखता है।
- source_word: νῦν
  choice: अब
  rationale: कालसूचक क्रियाविशेषण को सीधे रखा गया है; यह थिस्सलुनीकियों की दृढ़ता से पौलुस को मिली वर्तमान स्फूर्ति पर बल देता है।
- source_word: ζῶμεν
  choice: हम सचमुच जीते हैं
  rationale: मूल अर्थ ‘हम जीते हैं’ है, पर प्रसंग में यह केवल शारीरिक रूप से जीवित होने के बजाय नई स्फूर्ति और प्रोत्साहन की आलंकारिक अभिव्यक्ति है। ‘सचमुच’ हिन्दी में इस मुहावरेदार बल को स्वाभाविक बनाता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: ἐὰν
  choice: यदि
  rationale: यूनानी की स्पष्ट शर्तसूचक रचना को बिना उसका बल घटाए बनाए रखता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: बहुवचन सर्वनाम को सामान्य आधुनिक हिन्दी में रखा गया है और इससे थिस्सलुनीकी विश्वासियों पर वाक्य का केंद्र बना रहता है।
- source_word: στήκετε
  choice: दृढ़ बने रहते हो
  rationale: στήκω का आशय स्थिर या अटल खड़े रहने से है। वर्तमानकालीन निरंतर अवस्था को हिन्दी में ‘बने रहते हो’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: पौलुस की व्यापक और धर्मवैज्ञानिक रूप से समृद्ध अभिव्यक्ति को सुरक्षित रखता है तथा उसे किसी संकीर्ण व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: ‘अब हम जीते हैं’ का आशय
  choice: इसे नई स्फूर्ति या वास्तविक प्रोत्साहन की आलंकारिक अभिव्यक्ति माना गया है।
  alternative: इसे केवल शारीरिक जीवन का कथन या ऐसी अतिशयोक्ति माना जा सकता है जिसमें पौलुस के सेवाकार्य का अर्थ उनके धीरज पर निर्भर हो।
  rationale: प्रसंग आलंकारिक बल का समर्थन करता है, पर अनुवाद यह तनाव बनाए रखता है और विस्तृत व्याख्या पादटिप्पणी में देता है।
- issue: ‘प्रभु में’ का अर्थ
  choice: प्रभु के साथ संबंध के क्षेत्र में दृढ़ बने रहना।
  alternative: ‘प्रभु के साथ एकता में’ या ‘प्रभु के प्रति विश्वासयोग्य’।
  rationale: ‘प्रभु में’ मूल की व्यापकता बनाए रखता है और किसी विशिष्ट सांप्रदायिक धीरज-सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘तुम’ बहुवचन समुदाय को संबोधित करता है।
