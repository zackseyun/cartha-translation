id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: hi
  text: इसी कारण, भाइयो[a], तुम्हारे विषय में, अपने सारे संकट और क्लेश के बीच, तुम्हारे विश्वास[b] के द्वारा हमें सांत्वना मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” पौलुस का मंडली को संबोधित करने का प्रचलित तरीका है और इसमें विश्वासियों का पूरा समुदाय सम्मिलित हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, “विश्वासयोग्यता” अथवा “विश्वास में दृढ़ता।” यूनानी शब्द पिस्तिस का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है; यहाँ थिस्सलुनीके के विश्वासियों के निरंतर विश्वास में स्थिर बने रहने का भाव भी सम्मिलित हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद तीमुथियुस से मिले पिछले समाचार के परिणाम को बताता है; ‘इसी कारण’ उस प्रसंग-संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: παρεκλήθημεν
  choice: हमें सांत्वना मिली
  rationale: यहाँ कर्मवाच्य क्रिया कठिनाई के बीच मिले ढाढ़स और राहत को व्यक्त करती है; ‘सांत्वना मिली’ हिंदी में स्वाभाविक है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: मूल यूनानी के संबोधन का रूप सुरक्षित रखा गया है; पौलुस के इस प्रचलित संबोधन में पूरी विश्वासियों की मंडली सम्मिलित हो सकती है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἐφ’ ὑμῖν
  choice: तुम्हारे विषय में
  rationale: यह वाक्यांश बताता है कि मिली सांत्वना किसके संबंध में थी, न कि थिस्सलुनीके के विश्वासी संकट का कारण थे।
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: अपने सारे संकट और क्लेश के बीच
  rationale: दोनों निकटार्थी पीड़ा-सूचक संज्ञाएँ अलग रखी गई हैं और ἐπί को उन परिस्थितियों के रूप में व्यक्त किया गया है जिनके बीच सांत्वना मिली।
- source_word: ἀνάγκῃ
  choice: संकट
  rationale: इस प्रसंग में शब्द आवश्यकता मात्र नहीं, बल्कि दबाव और कठिन परिस्थिति को सूचित करता है।
- source_word: θλίψει
  choice: क्लेश
  rationale: यह शब्द दबाव, उत्पीड़न या दुःख की गंभीरता व्यक्त करता है और वर्तमान धार्मिक हिंदी में समझा जाता है।
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: तुम्हारे विश्वास के द्वारा
  rationale: संबंधकारक के साथ διά यहाँ माध्यम को व्यक्त करता है; विश्वास वह माध्यम था जिसके द्वारा पौलुस और उसके साथियों को सांत्वना मिली।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का सामान्य और प्रसंगानुकूल अनुवाद ‘विश्वास’ है; यहाँ विश्वास में स्थिरता या विश्वासयोग्यता की छाया भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ऐसे प्रसंग में πίστις का अनुवाद जहाँ दृढ़ता या विश्वासयोग्यता का भाव भी संभव है
  choice: विश्वास
  alternative: विश्वासयोग्यता; विश्वास में दृढ़ता
  rationale: मुख्य पाठ सामान्य अर्थ ‘विश्वास’ को सुरक्षित रखता है और मूल शब्द की संभावित नैतिक/स्थिरता-संबंधी छाया को पादटिप्पणी में देता है, ताकि अस्पष्टता अनावश्यक रूप से समाप्त न हो।
- issue: ἀδελφοί के संबोधन का दायरा
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ मूल के पुल्लिंग बहुवचन संबोधन को बनाए रखता है, जबकि पादटिप्पणी बताती है कि पौलुस का यह प्रचलित संबोधन पूरी विश्वासी मंडली को समेट सकता है।
translation_notes:
  register: 'आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य-क्रम मूल यूनानी के प्रमुख संबंधों को बनाए रखता है: ‘तुम्हारे विषय में’ सांत्वना के विषय को और ‘संकट और क्लेश के बीच’ उसकी परिस्थिति को स्पष्ट करता है।'
