  to: बल्कि, जैसा तुम जानते हो, फिलिप्पी में पहले दुःख उठाने और अपमानजनक दुर्व्यवहार सहने के बाद[a], हमने अपने परमेश्वर में साहस पाकर तुम्हें परमेश्वर का सुसमाचार बहुत संघर्ष के बीच सुनाया[b][c]।
