source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: hi
  text: बल्कि, जैसा तुम जानते हो, फिलिप्पी में पहले दुःख उठाने और अपमानजनक दुर्व्यवहार सहने के बाद[a], हमने अपने परमेश्वर में साहस पाकर तुम्हें परमेश्वर का सुसमाचार बहुत संघर्ष के बीच सुनाया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घोर अपमान सहने के बाद,” अथवा “उद्दंडतापूर्वक दुर्व्यवहार सहने के बाद।” यूनानी क्रिया में अपमानजनक और धृष्टतापूर्ण व्यवहार का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हम अपने परमेश्वर में निर्भीक हुए कि ... तुमसे बोलें।” इसका अनुवाद “हमने अपने परमेश्वर में होकर निडरता से ... कहा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “बहुत संघर्ष में” अथवा “बहुत विरोध के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले विचार के साथ प्रबल विरोध दर्शाता है; हिन्दी में ‘बल्कि’ उस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προπαθόντες
  choice: पहले दुःख उठाने के बाद
  rationale: अओरिस्ट कृदन्त और προ- उपसर्ग मुख्य क्रिया से पहले हुए दुःख को दर्शाते हैं।
- source_word: ὑβρισθέντες
  choice: अपमानजनक दुर्व्यवहार सहने के बाद
  rationale: क्रिया में केवल मौखिक अपमान नहीं, बल्कि उद्दंडतापूर्ण, अपमानकारी व्यवहार का भाव भी है।
- source_word: καθὼς οἴδατε
  choice: जैसा तुम जानते हो
  rationale: थिस्सलुनीकियों के अपने ज्ञान की ओर पौलुस की सीधी, प्रसंगगत अपील को बनाए रखता है।
- source_word: ἐν Φιλίπποις
  choice: फिलिप्पी में
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἐπαρρησιασάμεθα
  choice: साहस पाकर ... सुनाया
  rationale: क्रिया निर्भीक और खुलकर बोलने का भाव रखती है; ‘साहस पाकर’ के साथ ‘सुनाया’ आगामी λαλῆσαι और सुसमाचार की विषयवस्तु को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: अपने परमेश्वर में
  rationale: ग्रीक की संबंधात्मक अथवा क्षेत्रगत अस्पष्टता को बनाए रखता है और परमेश्वर को केवल साधन या कारण तक सीमित नहीं करता।
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: तुम्हें ... सुनाया
  rationale: हिन्दी में सुसमाचार के साथ ‘सुनाना’ सहज है और संबोधन की दिशा को स्पष्ट रखता है।
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: परमेश्वर का सुसमाचार
  rationale: पौलुस की परिचित अभिव्यक्ति और सम्बन्धकारक रचना को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐν πολλῷ ἀγῶνι
  choice: भारी संघर्ष के बीच
  rationale: ἀγών के संघर्ष, कठिन प्रयास और विरोध के व्यापक अर्थ को बिना केवल बाहरी विरोध तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν का आशय
  choice: अपने परमेश्वर में
  alternative: अपने परमेश्वर के द्वारा; अपने परमेश्वर पर भरोसा रखकर
  rationale: मूल वाक्यांश साहस के क्षेत्र, आधार या संबंध को सूचित कर सकता है। ‘में’ इस तनाव को बनाए रखता है और अर्थ को केवल साधनात्मक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। वाक्य-विन्यास को हिन्दी की स्वाभाविकता के अनुसार पुनर्गठित किया गया है, जबकि पहले के दुःख, परमेश्वर में साहस और संघर्ष के बीच प्रचार—इन तीनों संबंधों को सुरक्षित रखा गया है।
