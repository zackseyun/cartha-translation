  naturalness: The wording is clear modern standard Hindi. Removing ‘भी’ makes the syntax both more direct and more faithful. ‘बहुत संघर्ष के बीच’ is a natural rendering that retains the broad sense of ἀγών.
  terminology: ‘परमेश्वर का सुसमाचार’ appropriately retains the Pauline expression, and ‘अपने परमेश्वर में’ preserves the deliberately broad force of ἐν τῷ θεῷ ἡμῶν. ‘साहस पाकर’ is acceptable idiomatic Hindi for the boldness expressed by ἐπαρρησιασάμεθα.
