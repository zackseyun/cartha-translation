lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम ही
  rationale: द्वितीय पुरुष बहुवचन सर्वनाम यहाँ स्पष्ट रूप से आया है और बल देता है; ‘तुम ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ तार्किक सम्बन्ध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐστε
  choice: हो
  rationale: वर्तमानकालीन संयोजक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἡ δόξα ἡμῶν
  choice: हमारी महिमा
  rationale: ‘महिमा’ δόξα के मूल अर्थ और उसके आलंकारिक भार को बनाए रखती है; यहाँ इसका आशय वह सम्मान या गौरव भी हो सकता है जो प्रेरितों को थिस्सलुनीके के विश्वासियों से प्राप्त है।
- source_word: ἡ χαρά
  choice: आनन्द
  rationale: χαρά हर्ष या आनन्द को दर्शाता है; ‘आनन्द’ गरिमापूर्ण, सामान्य और संज्ञात्मक अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: पौलुस के पारस्परिक कथन में δόξα का अनुवाद
  choice: महिमा
  alternative: गौरव; सम्मान
  rationale: यहाँ कोई तकनीकी धर्मसैद्धान्तिक दावा नहीं, बल्कि विश्वासियों के प्रति प्रेरितों के सम्मान और उल्लास की अभिव्यक्ति है। ‘महिमा’ यूनानी शब्द की व्यापकता और वाक्य की प्रबलता को सुरक्षित रखती है, जबकि पादटिप्पणी प्रसंगानुकूल वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष रूप। ‘तुम ही’ मूल सर्वनाम के बल को व्यक्त करता है। ‘आनन्द’ को वर्तमान हिन्दी में स्वाभाविक धार्मिक-साहित्यिक गरिमा के लिए चुना गया है।
