source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: hi
  text: और इसी कारण हम भी परमेश्वर का निरन्तर धन्यवाद करते हैं कि जब तुमने परमेश्वर का वह वचन ग्रहण किया जो तुमने हमसे सुना था,[a] तो तुमने उसे मनुष्यों का वचन नहीं, बल्कि—जैसा कि वह सचमुच है—परमेश्वर का वचन माना;[b] और वह वचन तुम में, जो विश्वास करते हो, कार्य भी कर रहा है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का वह संदेश, जो तुमने हमसे सुना था।” यूनानी अभिव्यक्ति संक्षिप्त है और हिन्दी में इसे एक से अधिक स्वाभाविक ढंग से खोला जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुमने उसे किसी मनुष्य का वचन नहीं, बल्कि—जैसा कि वह सचमुच है—परमेश्वर का वचन मानकर स्वीकार किया।”
    reason: lexical_alternative
  - marker: c
    text: 'संबंधवाचक सर्वनाम को परमेश्वर की ओर संकेत करते हुए भी समझा जा सकता है: “और वही परमेश्वर तुम में, जो विश्वास करते हो, कार्य भी कर रहा है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद को पिछले प्रसंग से कारणात्मक रूप से जोड़ता है और यूनानी अभिव्यक्ति की स्पष्ट शक्ति बनाए रखता है।
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: हम भी परमेश्वर का निरन्तर धन्यवाद करते हैं
  rationale: वर्तमान काल और लगातार दोहराए जानेवाले धन्यवाद का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: παραλαβόντες
  choice: ग्रहण किया
  rationale: सौंपे गए संदेश को प्राप्त करने का भाव रखता है; सहभागी रूप को हिन्दी में पठनीय उपवाक्य बनाया गया है।
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: परमेश्वर का वह वचन ... जो तुमने हमसे सुना था
  rationale: संक्षिप्त यूनानी संबंध-रचना को स्वाभाविक हिन्दी में खोला गया है और आगे आनेवाले ‘मनुष्यों का वचन/परमेश्वर का वचन’ के विरोध को सुरक्षित रखा गया है।
- source_word: ἐδέξασθε
  choice: माना
  rationale: यहाँ क्रिया केवल सुनने या प्राप्त करने से आगे बढ़कर संदेश को उसके वास्तविक स्वरूप में स्वीकार करने को दर्शाती है; ‘माना’ अगले ‘मनुष्यों का वचन नहीं...परमेश्वर का वचन’ के साथ स्वाभाविक बैठता है।
- source_word: οὐ λόγον ἀνθρώπων
  choice: मनुष्यों का वचन नहीं
  rationale: ἀνθρώπων के सामान्य बहुवचन और परमेश्वर के वचन के साथ आलंकारिक विरोध को बनाए रखता है।
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν
  choice: बल्कि—जैसा कि वह सचमुच है—
  rationale: मूल के बीच में आए पुष्टिकारक कथन को स्पष्ट किन्तु स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: λόγον θεοῦ
  choice: परमेश्वर का वचन
  rationale: मूल की पुनरावृत्ति और धार्मिक भार को बिना अतिरिक्त doctrinal विस्तार के बनाए रखता है।
- source_word: ὃς
  choice: वही
  rationale: सबसे स्वाभाविक निकटवर्ती पूर्वपद ‘वचन’ की ओर संकेत करता है; हिन्दी में ‘वही’ वचन की प्रभावी सक्रियता पर बल देता है।
- source_word: ἐνεργεῖται
  choice: सक्रिय ... है
  rationale: चल रही प्रभावकारी क्रिया को व्यक्त करता है, बिना मध्य या कर्मवाच्य के सूक्ष्म भेद को अनावश्यक रूप से निश्चित किए।
- source_word: τοῖς πιστεύουσιν
  choice: तुम विश्वास करनेवालों में
  rationale: वर्तमान कृदन्त को विश्वास से पहचाने जानेवाले लोगों के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὃς का पूर्वपद
  choice: 'संबंधवाचक खंड ‘परमेश्वर के वचन’ की ओर संकेत करता है: ‘वही ... सक्रिय भी है।’'
  alternative: 'इसे परमेश्वर की ओर संकेत मानना: ‘और वही परमेश्वर तुम विश्वास करनेवालों में कार्य भी करता है।’'
  rationale: ὃς पुल्लिंग एकवचन है और निकटवर्ती λόγον से मेल खाता है; वचन की प्रभावकारी क्रिया पर पौलुस का बल भी इस पाठ के अनुकूल है। θεοῦ की निकटता के कारण दूसरा अर्थ व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: प्रेरितीय प्रचार के लिए ‘परमेश्वर का वचन’
  choice: ‘परमेश्वर का वचन’
  alternative: ‘परमेश्वर का संदेश’
  rationale: पद स्वयं मनुष्यों के वचन और परमेश्वर के वचन का स्पष्ट विरोध करता है। ‘वचन’ इस आलंकारिक और धर्मवैचारिक भार को रखता है, पर पद से आगे कोई विस्तृत प्रेरणा-सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘निरन्तर’, ‘ग्रहण’, ‘वचन’ और ‘सक्रिय’ औपचारिकता रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। विरामचिह्न मूल के पुष्टिकारक मध्यवर्ती वाक्यांश को स्पष्ट करते हैं।
