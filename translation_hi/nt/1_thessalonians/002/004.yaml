base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: hi
  text: बल्कि, जैसे परमेश्वर ने हमें सुसमाचार सौंपने योग्य माना है, वैसे ही हम बोलते हैं—मनुष्यों को प्रसन्न करने के लिए नहीं, बल्कि परमेश्वर को प्रसन्न करने के लिए, जो हमारे हृदयों को परखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: परखकर ... योग्य ठहराया है
  rationale: पूर्णकालिक कर्मवाच्य रूप पहले हुई जाँच और उसके बने हुए परिणाम, दोनों को व्यक्त करता है। यह अनुवाद केवल ‘परखा’ कहने की अपेक्षा अनुमोदन का भाव भी सुरक्षित रखता है।
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: सुसमाचार सौंपने
  rationale: यहाँ कर्मवाच्य infinitive का अर्थ सुसमाचार पर विश्वास करना नहीं, बल्कि उसे भरोसे के साथ किसी को सौंपा जाना है।
- source_word: τὸ εὐαγγέλιον
  choice: सुसमाचार
  rationale: यह पौलुस के प्रसंग में स्थापित, स्वाभाविक और अर्थपूर्ण हिन्दी पद है।
- source_word: οὕτως λαλοῦμεν
  choice: वैसे ही हम बोलते हैं
  rationale: यह परमेश्वर द्वारा परखे और दायित्व सौंपे जाने को उनके बोलने के ढंग से स्पष्ट रूप से जोड़ता है।
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: मनुष्यों को प्रसन्न करने वालों के समान नहीं
  rationale: यह सहभागी रूप और ὡς की तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀλλὰ θεῷ
  choice: बल्कि परमेश्वर को
  rationale: यूनानी में दूसरे खंड में ‘प्रसन्न करने’ की क्रिया निहित है, लिखी हुई नहीं; संक्षिप्त हिन्दी इसे सुरक्षित रखती है।
- source_word: τῷ δοκιμάζοντι
  choice: जो ... परखता है
  rationale: वर्तमान सहभागी परमेश्वर की जारी जाँच को दर्शाता है और पद के आरम्भ में आए δοκιμάζω से शब्दगत संबंध बनाए रखता है।
- source_word: τὰς καρδίας ἡμῶν
  choice: हमारे हृदयों
  rationale: ‘हृदय’ बाइबलीय मानव-विज्ञान की व्यापकता को बनाए रखता है; इसे केवल मन या भावनाओं तक सीमित नहीं करता।
theological_decisions:
- issue: मनुष्यों और परमेश्वर को प्रसन्न करने के बीच संकुचित विरोध
  choice: मुख्य पाठ में ‘मनुष्यों को प्रसन्न करने वालों के समान नहीं, बल्कि परमेश्वर को’
  alternative: ‘मनुष्यों को नहीं, बल्कि परमेश्वर को प्रसन्न करने के लिए’
  rationale: यूनानी पहले खंड में ही ‘प्रसन्न करने’ को स्पष्ट करता है और दूसरे में उसे निहित छोड़ता है। मुख्य पाठ इस तनाव और पौलुस की संक्षिप्त शैली को बनाए रखता है; अधिक मुहावरेदार विस्तार पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परखकर ... योग्य ठहराया’ मूल के परीक्षण और अनुमोदन दोनों भावों को व्यक्त करता है; डैश पौलुस के विरोधात्मक स्पष्टीकरण को स्पष्ट करता है।
