  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: hi
  text: जिन्होंने प्रभु यीशु और भविष्यद्वक्ताओं को भी मार डाला[a], और हमें खदेड़ दिया[b]; वे परमेश्वर को प्रसन्न नहीं करते और सब मनुष्यों के विरोधी हैं[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु यीशु को मृत्यु के घाट उतार दिया।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् उन्होंने हमें भगा दिया या बाहर निकाल दिया; मूल क्रिया सामान्य ‘सताने’ से अधिक विशिष्ट है।
    reason: lexical_alternative
  - marker: c
    text: यह वर्णन व्याकरण की दृष्टि से पिछले पद में बताए गए समूह के विषय में आगे कहा गया है; इसे हर समय और हर स्थान के सभी यहूदियों के बारे में व्यापक कथन नहीं समझना चाहिए।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: मार डाला
  rationale: यह क्रिया ‘मार डालना/मृत्यु के घाट उतारना’ व्यक्त करती है। ‘मार डाला’ सहज आधुनिक हिन्दी है और ‘हत्या की’ की तुलना में अभिप्राय संबंधी अतिरिक्त नैतिक अर्थ नहीं जोड़ती।
- source_word: κύριον Ἰησοῦν
  choice: प्रभु यीशु
  rationale: κύριος का मसीही उपाधि के रूप में मानक और स्वाभाविक हिन्दी रूप ‘प्रभु’ है; Ἰησοῦς का प्रचलित रूप ‘यीशु’ है।
- source_word: τοὺς προφήτας
  choice: भविष्यद्वक्ताओं
  rationale: यह परमेश्वर के पहचाने हुए भविष्यद्वक्ताओं की परंपरा की ओर संकेत करता है; हिन्दी में इस संदर्भ में निश्चितता बिना अलग निश्चित उपपद के स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐκδιωξάντων
  choice: खदेड़ दिया
  rationale: क्रिया केवल सामान्य उत्पीड़न नहीं, बल्कि किसी स्थान से बाहर निकालने या भगा देने का ठोस भाव रखती है।
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: परमेश्वर को प्रसन्न नहीं करते
  rationale: वर्तमान कृदंत की जारी वर्णनात्मक शक्ति को स्वाभाविक हिन्दी क्रिया-वाक्यांश में रखा गया है।
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: सब मनुष्यों के विरोधी हैं
  rationale: ἐναντίος विरोध अथवा शत्रुतापूर्ण रुख व्यक्त करता है। ‘विरोधी’ मूल की व्यापकता बनाए रखता है और ‘शत्रु’ की अपेक्षा कम अतिव्याख्यात्मक है।
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: जिन्होंने ... मार डाला ... खदेड़ दिया; वे ... प्रसन्न नहीं करते और ... विरोधी हैं
  rationale: सम्बन्धवाचक ‘जिन्होंने’ पिछले पद के पूर्वपद से व्याकरणिक संबंध बनाए रखता है। अर्धविराम के बाद ‘वे’ की पुनरुक्ति लंबी कृदंत-शृंखला को स्पष्ट, पठनीय हिन्दी बनाती है।
- source_word: καὶ
  choice: भी / और
  rationale: पहला καί आरोप में जोड़ को दिखाने के लिए ‘भी’ और बाकी संचयी संबंधों के लिए ‘और’ के रूप में दिया गया है।
theological_decisions:
- issue: कृदंत-शृंखला का संदर्भ
  choice: ‘जिन्होंने’ के द्वारा विवरण को पिछले पद में बताए गए समूह से व्याकरणिक रूप से जोड़ा गया है।
  alternative: इसे हर समय और हर स्थान के सभी यहूदी लोगों की सामान्य निंदा मानना।
  rationale: यूनानी वाक्यरचना पद 14 के पूर्वपद को आगे बढ़ाती है। अनुवाद तत्काल साहित्यिक संदर्भ को बनाए रखता है और कथन को सार्वकालिक जातीय आरोप में विस्तृत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए अंत में अल्पविराम रखा गया है। ‘खदेड़ दिया’ मूल क्रिया की ठोस शक्ति बचाता है, जबकि [b] अधिक तटस्थ विकल्प स्पष्ट करता है।
