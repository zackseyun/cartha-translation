  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: hi
  text: क्योंकि हम तुम्हारे पास आना चाहते थे—मैं, पौलुस, एक से अधिक बार[a]—पर शैतान ने हमारे मार्ग में बाधा डाली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “एक बार और दो बार”; यह मुहावरा एक से अधिक बार का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ इसके व्याख्यात्मक-कारणवाचक बल को स्वाभाविक हिंदी में रखता है।
- source_word: ἠθελήσαμεν
  choice: हम ... आना चाहते थे
  rationale: θέλω यहाँ इच्छा या अभिलाषा व्यक्त करता है; यह चयन आधुनिक हिंदी में सहज है और क्रिया के भूतकालीन सारांश को बनाए रखता है।
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: तुम्हारे पास आना
  rationale: यह गमन की दिशा को सीधे व्यक्त करता है और ‘भेंट करने’ या ‘वापस आने’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐγὼ μὲν Παῦλος
  choice: मैं, पौलुस
  rationale: बहुवचन ‘हम’ के बीच पौलुस स्वयं को विशेष रूप से अलग करके बताता है; यह रूप उस बलाघात को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: καὶ ἅπαξ καὶ δίς
  choice: एक से अधिक बार
  rationale: शाब्दिक रूप ‘एक बार और दो बार’ है, जो मुहावरे के रूप में पुनरावृत्ति—कम-से-कम दो अवसरों—को दर्शाता है; ‘एक से अधिक बार’ अर्थ को स्पष्ट रखते हुए अतिशयोक्ति से बचता है।
- source_word: ἐνέκοψεν
  choice: रोक दिया
  rationale: ἐγκόπτω मार्ग में बाधा डालकर आगे बढ़ने से रोकने का भाव देता है। प्रसंग में प्रयास सफल न होने के कारण ‘रोक दिया’ स्वाभाविक है, पर यह उससे आगे किसी व्यापक नियतिवादी दावे को नहीं जोड़ता।
- source_word: ὁ Σατανᾶς
  choice: शैतान
  rationale: नए नियम में प्रयुक्त व्यक्तिगत नाम/उपाधि का हिंदी में स्थापित रूप है।
theological_decisions:
- issue: पौलुस की यात्रा में शैतान की सक्रिय बाधा
  choice: लेकिन शैतान ने हमें रोक दिया
  alternative: लेकिन विरोधी ने हमारे मार्ग में बाधा डाली
  rationale: मूल पाठ बाधा का कर्ता स्पष्ट रूप से शैतान को बताता है। अनुवाद इस व्यक्तिगत सक्रियता को बनाए रखता है, न उसे केवल परिस्थितियों में विलीन करता है और न यह बताता है कि बाधा किस माध्यम से आई।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन के लिए संदर्भानुकूल बहुवचन ‘तुम’ रखा गया है। वाक्य गरिमापूर्ण और सहज है। डैश बहुवचन ‘हम’ के बीच पौलुस के व्यक्तिगत बलाघात को स्पष्ट करता है।
