id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: hi
  text: क्योंकि, हे भाइयो, तुम यहूदिया में मसीह यीशु में स्थित परमेश्वर की कलीसियाओं के अनुकरण करनेवाले बने; क्योंकि तुमने भी अपने ही देशवासियों[b] के हाथों वही दुःख सहे, जैसे उन्होंने यहूदियों[c] के हाथों सहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “अपने ही जातीय समुदाय के लोगों।”
    reason: συμφυλέται साझा जातीय, जनसमूहीय, या राष्ट्रीय पहचान वाले लोगों का संकेत कर सकता है।
  - marker: c
    text: या, “यहूदिया-निवासियों।” यहाँ यूनानी शब्द Ἰουδαίων का अर्थ संदर्भ के अनुसार ‘यहूदी’ अथवा ‘यहूदिया-निवासी’ हो सकता है।
    reason: मूल शब्द की संदर्भगत भौगोलिक और जातीय-धार्मिक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: अनुकरण करनेवाले बने
  rationale: यह पदबंध μιμηταί के स्पष्ट तुलना-सूचक अर्थ और ἐγενήθητε में निहित ‘बनने’ के भाव, दोनों को बनाए रखता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन का सीधा, प्रचलित और गरिमापूर्ण हिन्दी रूप; मूल का पुल्लिंग बहुवचन सुरक्षित है।
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: परमेश्वर की कलीसियाओं
  rationale: पौलुस के पत्रों के कलीसियाई संदर्भ में ἐκκλησία के लिए ‘कलीसिया’ मानक और स्वाभाविक बाइबलीय हिन्दी है।
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया की
  rationale: यह संक्षिप्त हिन्दी अभिव्यक्ति कलीसियाओं की भौगोलिक स्थिति बताती है; इसका अर्थ ‘यहूदिया में स्थित’ है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता वाले पदनाम को व्यक्त करता है और हिन्दी में स्वाभाविक भी है।
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: वही दुःख सहे
  rationale: πάσχω के दुःख भोगने के भाव तथा τὰ αὐτά की प्रत्यक्ष समानता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: अपने ही जाति के लोगों
  rationale: ἰδίων का ‘अपने ही’ वाला बल और συμφυλετῶν का समान जातीय अथवा जनसमूह से होने का अर्थ दोनों व्यक्त होते हैं, बिना केवल पुरुषों तक अर्थ सीमित किए।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: संदर्भ में यह प्रचलित जातीय-धार्मिक अर्थ को व्यक्त करता है; मूल शब्द का ‘यहूदिया-निवासी’ अर्थ भी संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: Χριστῷ को पदनाम के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: ‘मसीह’ Χριστός के अर्थपूर्ण पदनाम को सुरक्षित रखता है और हिन्दी पाठकों के लिए स्वाभाविक है।
- issue: τῶν Ἰουδαίων का आशय और दायरा
  choice: यहूदियों
  alternative: यहूदिया-निवासियों
  rationale: मुख्य पाठ मूल का सामान्य जातीय-धार्मिक अर्थ रखता है, पर इसे सभी यहूदियों पर सार्वकालिक आरोप के रूप में विस्तृत नहीं करता। भौगोलिक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- issue: सम्फुलेतोन में साझा पहचान का स्वरूप
  choice: अपने ही जाति के लोगों
  alternative: अपने ही देशवासियों
  rationale: मूल शब्द साझा जनसमूह, जातीयता या राष्ट्रीय पहचान का संकेत दे सकता है। मुख्य पाठ जातीय/सामुदायिक निकटता को रखता है और नागरिक-भौगोलिक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘कलीसिया’, ‘मसीह’ और ‘परमेश्वर’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाते हुए मूल की तुलना, कारण और पीड़ा के भाव को सुरक्षित रखा गया है।
