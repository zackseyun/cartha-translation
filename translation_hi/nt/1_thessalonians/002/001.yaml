  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: hi
  text: क्योंकि हे भाइयो[a], तुम स्वयं जानते हो कि तुम्हारे पास हमारा आना व्यर्थ नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे भाई-बहनो”; यूनानी में शाब्दिक रूप से “भाइयो” है, और यह पुल्लिंग रूप प्रायः पूरे विश्वासी समुदाय को संबोधित करने के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: तुम स्वयं
  rationale: यह बलवाचक प्रयोग थिस्सलुनीकियों के अपने प्रत्यक्ष ज्ञान पर ज़ोर देता है; केवल ‘तुम’ की अपेक्षा ‘तुम स्वयं’ इस बल को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण या आधार प्रस्तुत करता है; हिंदी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: रूप की दृष्टि से पूर्णकालिक होने पर भी οἶδα यहाँ वर्तमान अर्थ रखता है; ‘जानते हो’ सहज और सटीक है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन का पुल्लिंग रूप सुरक्षित रखा गया है। पौलुस के प्रयोग में यह प्रायः संपूर्ण विश्वासी समुदाय को संबोधित करता है, इसलिए व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: तुम्हारे पास हमारा आना
  rationale: यह पौलुस और उसके सहकर्मियों के थिस्सलुनीकियों के पास पहुँचने को दर्शाता है। ‘आना’ आधुनिक हिंदी में ‘प्रवेश’ की अपेक्षा अधिक स्वाभाविक है और ‘तुम्हारे पास’ दिशा को सुरक्षित रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनके ज्ञान की विषयवस्तु का परिचय देता है।
- source_word: οὐ κενὴ γέγονεν
  choice: व्यर्थ नहीं हुआ
  rationale: κενός यहाँ निष्फल, प्रभावहीन या निरर्थक होने का भाव रखता है। ‘व्यर्थ नहीं हुआ’ स्वाभाविक हिंदी में मूल्यांकनात्मक बल और γέγονεν के परिणामी भाव को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοί का अनुवाद
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ में यूनानी के व्याकरणिक पुल्लिंग संबोधन को बनाए रखा गया है, जबकि इस संभावना—और पौलुस के सामान्य प्रयोग—को पादटिप्पणी में बताया गया है कि संबोधन पूरे विश्वासी समुदाय के लिए है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण संबोधन रखा गया है। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार बदला गया है, पर ‘तुम स्वयं’, कारणसूचक संबंध और आगमन के निष्फल न होने का मूल बल सुरक्षित है।
