  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: hi
  text: 'क्योंकि, भाइयो[a], तुम्हें हमारा परिश्रम और कष्ट याद है: हम रात-दिन काम करते हुए, ताकि हम तुम में से किसी पर बोझ न बनें, तुम्हें परमेश्वर का सुसमाचार सुनाते रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयो और बहनो”; यूनानी में “भाइयो” है, जो यहाँ पूरी मंडली को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: तुम्हें ... याद है
  rationale: वर्तमानकालिक कथन को आज्ञा के बजाय स्मरण की पुष्टि के रूप में रखा गया है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी के पुल्लिंग बहुवचन संबोधन को मुख्य पाठ में बनाए रखा गया है; मंडली-समावेशी संभावना पादटिप्पणी में दी गई है।
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: हमारा परिश्रम और कठिन श्रम
  rationale: दोनों निकटार्थक शब्दों का अलग-अलग भाव रखते हुए श्रमसाध्य प्रयास और उससे जुड़ी कठिनाई व्यक्त की गई है।
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: रात-दिन काम करते हुए
  rationale: यूनानी कृदंत की परिस्थितिजन्य भूमिका और निरंतर प्रयास का स्वाभाविक हिन्दी रूप।
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: ताकि तुममें से किसी पर बोझ न बनें
  rationale: उद्देश्यसूचक रचना को स्पष्ट किया गया है; यहाँ आर्थिक या व्यावहारिक भार डालने का भाव है।
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: तुम्हारे बीच ... सुनाया
  rationale: κηρύσσω का सार्वजनिक घोषणा का भाव 'सुनाया' से स्वाभाविक हिन्दी में व्यक्त होता है; εἰς ὑμᾶς के लिए प्रसंगानुकूल सामुदायिक क्षेत्र 'तुम्हारे बीच' रखा गया है, जबकि 'तुम्हें' भी संभव है।
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: परमेश्वर का सुसमाचार
  rationale: स्थापित बाइबलीय पदावली रखी गई है और संबंधकारक की संभावित व्यापकता—स्रोत, स्वामित्व या विषय—को नहीं सुलझाया गया।
theological_decisions:
- issue: ἀδελφοί का समावेशी आशय
  choice: मुख्य पाठ में 'भाइयो'
  alternative: '''भाइयो और बहनो'''
  rationale: मूल यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखा गया है, जबकि संभवतः पूरी मंडली को संबोधन होने की बात पादटिप्पणी में बताई गई है।
- issue: τοῦ θεοῦ संबंधकारक का अर्थ
  choice: परमेश्वर का सुसमाचार
  alternative: परमेश्वर की ओर से सुसमाचार
  rationale: मूल में संबंधकारक स्रोत, स्वामित्व या विषय का भाव दे सकता है; हिन्दी संबंधकारक उस वास्तविक अस्पष्टता को बनाए रखता है।
