  rationale: The revision uses ‘आग्रह’ for the contextually broad sense of παράκλησις, replaces ‘भूल’ with ‘भ्रम’ to better reflect πλάνη without equating it with deliberate deception, and recasts the final clause to convey ἐν δόλῳ as manner in natural Hindi. The broad moral scope of ‘अशुद्धता’ is retained.
