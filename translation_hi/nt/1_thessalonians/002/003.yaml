lexical_decisions:
- source_word: παράκλησις
  choice: विनती
  rationale: यहाँ शब्द श्रोताओं को गंभीरता से बुलाने और समझाने के अर्थ में है। ‘विनती’ इस संदर्भ में स्वाभाविक है, यद्यपि ‘उपदेश’ भी संभव है।
- source_word: πλάνης
  choice: भूल
  rationale: ἐκ के साथ यह विनती के स्रोत को बताता है—वह किसी गलत धारणा या असत्य से नहीं उपजती। यह δόλος के जानबूझकर किए गए छल से भेद भी बनाए रखता है।
- source_word: ἀκαθαρσίας
  choice: अशुद्धता
  rationale: यह नैतिक अशुद्धता का व्यापक अर्थ सुरक्षित रखता है और पद में न कही गई किसी विशेष प्रकार की अशुद्धता को नहीं जोड़ता।
- source_word: δόλῳ
  choice: छल
  rationale: यह जानबूझकर कपटपूर्ण ढंग अपनाने के भाव को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ ... ἐξ ... ἐν
  choice: से उपजती है ... से ... छल के साथ
  rationale: ἐκ/ἐξ के स्रोत और ἐν के रीति या ढंग संबंधी अंतर को हिन्दी में यथासंभव स्पष्ट रखा गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या स्पष्टीकरण से इस वाक्य का संबंध स्वाभाविक हिन्दी में दिखाता है।
theological_decisions:
- issue: ἀκαθαρσία का दायरा
  choice: व्यापक ‘अशुद्धता’
  alternative: यौन अशुद्धता
  rationale: यूनानी शब्द में यौन अनैतिकता का भाव हो सकता है, पर इस पद में वह अर्थ स्पष्ट रूप से सीमित नहीं किया गया; इसलिए व्यापक नैतिक अर्थ सुरक्षित रखा गया है।
- issue: πλάνη और δόλος का संबंध
  choice: ‘भूल’ और ‘छल’ के रूप में अलग अर्थ-छायाएँ
  alternative: दोनों को ‘धोखा’ से संबंधित शब्दों में प्रस्तुत करना
  rationale: पहला शब्द गलत धारणा या असत्य स्रोत की ओर और दूसरा जानबूझकर कपटपूर्ण रीति की ओर संकेत कर सकता है; अनुवाद इस संभावित भेद को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली। ‘न तो…न…और न ही’ से तीन निषेधों की संरचना रखी गई है; ‘से उपजती है’ तथा ‘के साथ की जाती है’ स्रोत और रीति के यूनानी भेद को व्यक्त करते हैं।
