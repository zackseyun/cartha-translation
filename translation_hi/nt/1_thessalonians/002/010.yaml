  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: hi
  text: तुम गवाह हो, और परमेश्वर भी, कि तुम विश्वासियों के प्रति हमारा आचरण कितना भक्तिपूर्ण, न्यायपूर्ण और निर्दोष था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: तुम गवाह हो, और परमेश्वर भी
  rationale: मूल के बलाघात को बनाए रखते हुए पहले थिस्सलुनीकियों और फिर परमेश्वर को गवाह के रूप में संबोधित किया गया है; हिन्दी में स्वाभाविकता के लिए ‘हो’ जोड़ा गया है।
- source_word: ὡς
  choice: कि … कितनी
  rationale: यहाँ ὡς प्रेरितों के आचरण की रीति बताता है; ‘कि … कितनी’ हिन्दी में गवाही की अपील के बाद उस रीति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁσίως
  choice: भक्तिपूर्वक
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और भक्ति से चिह्नित आचरण बताता है; ‘भक्तिपूर्वक’ आधुनिक हिन्दी में इस ईश्वराभिमुख अर्थ को स्पष्ट रखता है।
- source_word: δικαίως
  choice: धार्मिकता से
  rationale: यह नैतिक रूप से उचित और सीधा आचरण व्यक्त करता है; ‘धार्मिकता से’ इसके नैतिक आशय को बनाए रखता है।
- source_word: ἀμέμπτως
  choice: निर्दोष रीति से
  rationale: इसका आशय ऐसे आचरण से है जिस पर उचित दोष न लगाया जा सके; यह अनुवाद पापरहित सिद्धता का अतिरिक्त दावा किए बिना उस अर्थ को व्यक्त करता है।
- source_word: ὑμῖν τοῖς πιστεύουσιν
  choice: तुम विश्वास करनेवालों के प्रति
  rationale: सम्बन्धकारक दत्तिव को उन विश्वासियों की ओर उन्मुख आचरण के रूप में व्यक्त किया गया है; ‘बीच’ भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: ἐγενήθημεν
  choice: हमने … व्यवहार किया
  rationale: रीतिवाचक क्रियाविशेषणों के साथ γίνομαι यहाँ उनके जीवन और आचरण की रीति को सूचित करता है; हिन्दी में ‘व्यवहार किया’ इसका स्वाभाविक सन्दर्भगत रूप है।
theological_decisions:
- issue: प्रेरितों के आचरण के तीन नैतिक वर्णन
  choice: इन शब्दों को परमेश्वर और विश्वासियों के सामने मिशनरियों के वास्तविक, निष्कलंक आचरण का वर्णन माना गया है।
  alternative: इन्हें केवल आलंकारिक आत्मरक्षा या पूर्ण पापरहितता का दावा मानना।
  rationale: पद मानव और परमेश्वर दोनों की गवाही देकर आचरण की खराई पर बल देता है, पर ‘निर्दोष’ अपने आप में निरपेक्ष पापरहित सिद्धता का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों क्रियाविशेषणों का भेद बनाए रखा गया है और मूल दत्तिव की सम्भावित ‘प्रति/बीच’ अस्पष्टता पादटिप्पणी में संरक्षित है।
