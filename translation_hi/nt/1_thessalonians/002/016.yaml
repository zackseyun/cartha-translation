source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: hi
  text: वे हमें गैर-यहूदियों से बोलने से रोकते हैं, ताकि वे उद्धार न पाएँ; और इस तरह वे सदा अपने पापों का माप भरते जाते हैं। परन्तु क्रोध[b] उन पर अन्ततः[a] आ पहुँचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अन्ततः” के लिए यूनानी εἰς τέλος का अर्थ “पूरी तरह,” “पूर्ण रूप से,” या “अन्त तक” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “क्रोध” सम्भवतः दिव्य न्याय को दर्शाता है, पर पौलुस यहाँ यह स्पष्ट नहीं करते कि उनका आशय वर्तमान ऐतिहासिक न्याय, अन्तिम न्याय, या दोनों से है।
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: रोकते हैं
  rationale: वर्तमान कृदन्त निरन्तर बाधा डालने की क्रिया बताता है; ‘रोकते हैं’ स्वाभाविक हिन्दी है और कानूनी निषेध का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: यहाँ पौलुस का संकेत यहूदी न होने वाले लोगों की ओर है, न कि राजनीतिक राष्ट्रों की ओर।
- source_word: λαλῆσαι
  choice: बात करने
  rationale: मूल क्रिया का सीधा अर्थ सुरक्षित रहता है; सुसमाचार सुनाने का आशय प्रसंग से मिलता है।
- source_word: ἵνα σωθῶσιν
  choice: ताकि वे उद्धार न पाएँ
  rationale: यूनानी उद्देश्यवाचक उपवाक्य और कर्मवाच्य ‘उद्धार पाएँ’ में सुरक्षित हैं; मुख्य निषेधात्मक क्रिया के साथ हिन्दी में ‘न’ आवश्यक है।
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: इस तरह ... भरते जाते हैं
  rationale: रचना के परिणामी अथवा परिणति की ओर बढ़ते भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह कहे कि पापों को पूरा करना उनका सचेत उद्देश्य था।
- source_word: ἀναπληρῶσαι
  choice: अपने पापों का घड़ा भरते जाते हैं
  rationale: ‘घड़ा भरना’ हिन्दी में पापों के पूर्ण माप तक पहुँचने की बाइबलीय छवि को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: πάντοτε
  choice: सदा
  rationale: यह उनके लगातार चले आ रहे आचरण को दर्शाता है।
- source_word: ἔφθασεν
  choice: आ पहुँचा है
  rationale: पूर्ण हुई और वर्तमान रूप से प्रासंगिक घटना का भाव देता है तथा ἐπί के साथ पहुँचने के अर्थ को सुरक्षित रखता है।
- source_word: ὀργή
  choice: परमेश्वर का क्रोध
  rationale: यूनानी में केवल ‘क्रोध’ है, पर प्रसंग में इसका दिव्य स्रोत निहित है; हिन्दी में स्पष्टता के लिए ‘परमेश्वर का’ जोड़ा गया है, जबकि न्याय के स्वरूप को अनिर्धारित रखा गया है।
- source_word: εἰς τέλος
  choice: अन्ततः
  rationale: वाक्य में चरम परिणति अथवा ‘आखिरकार’ का स्वाभाविक अर्थ देता है; ‘पूरी तरह’ की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ὀργή का स्रोत और न्याय का स्वरूप
  choice: ‘परमेश्वर का क्रोध’ कहकर दिव्य न्याय का आशय स्पष्ट किया गया, पर यह नहीं बताया गया कि वह ऐतिहासिक न्याय है, अन्तिम न्याय है, या दोनों।
  alternative: केवल ‘क्रोध’; अथवा किसी निश्चित ऐतिहासिक या अन्तकालीन न्याय की पहचान।
  rationale: प्रसंग दिव्य क्रोध की ओर संकेत करता है, किन्तु पद स्वयं उसके समय और रूप को निश्चित नहीं करता।
- issue: εἰς τὸ ἀναπληρῶσαι का बल
  choice: 'परिणाम अथवा परिणति: ‘इस तरह ... भरते जाते हैं’।'
  alternative: 'स्पष्ट उद्देश्य: ‘ताकि वे अपने पापों को पूरा करें’।'
  rationale: यह अनुवाद यूनानी रचना की दिशा को रखता है, पर यह दावा नहीं करता कि पापों का माप भरना विरोधियों का सचेत लक्ष्य था।
- issue: ἵνα σωθῶσιν और निषेध का सम्बन्ध
  choice: ‘ताकि वे उद्धार न पाएँ’।
  alternative: 'शाब्दिक क्रम: ‘उन्हें बोलने से रोकते हैं, ताकि वे उद्धार पाएँ’।'
  rationale: 'यूनानी में निषेध κωλυόντων पर है, पर हिन्दी में आशय स्पष्ट करने के लिए उद्देश्य उपवाक्य में ‘न’ लगाना स्वाभाविक है: वे बोलने से इसलिए रोकते हैं कि गैर-यहूदी उद्धार न पाएँ।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘गैर-यहूदी’, ‘उद्धार’ और ‘पापों का घड़ा भरना’ धार्मिक संदर्भ को स्पष्ट रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
