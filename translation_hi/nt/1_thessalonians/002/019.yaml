source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: hi
  text: क्योंकि हमारे प्रभु यीशु के सामने, उनके आगमन[a] पर, हमारी आशा या आनन्द या गौरव का मुकुट कौन है? क्या आप ही नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी उपस्थिति में’ अथवा ‘उनके आने पर।’ यूनानी शब्द παρουσίᾳ का अर्थ उपस्थिति या आगमन हो सकता है; इस प्रसंग में यह प्रभु यीशु के भविष्य में आने को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यूनानी प्रश्नवाचक सर्वनाम यहाँ आगे आने वाले ‘आप’ अर्थात व्यक्तियों की ओर संकेत करता है; हिन्दी में ‘हमारी आशा... कौन है?’ स्वाभाविक है और मूल की व्यक्ति-वाचक सम्भावना बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन से व्याख्यात्मक सम्बन्ध स्पष्ट रखने के लिए इसे व्यक्त किया गया है।
- source_word: ἐλπίς
  choice: आशा
  rationale: यह पौलुस के विश्वासपूर्ण भावी अपेक्षा के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χαρά
  choice: आनन्द
  rationale: यह भावात्मक बल को बनाए रखने वाला सीधा और गरिमापूर्ण हिन्दी पर्याय है।
- source_word: στέφανος καυχήσεως
  choice: गर्व का मुकुट
  rationale: ‘मुकुट’ सम्मान या विजय के στέφανος को व्यक्त करता है और ‘गर्व’ καύχησις को यहाँ अनुचित घमण्ड के बजाय वैध गौरव के अर्थ में संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: क्या वह आप ही नहीं हैं
  rationale: यह अपेक्षित सकारात्मक उत्तर और οὐχί की प्रबलता को व्यक्त करता है; ‘ही’ इस प्रसंग में καί के बलवर्धक प्रभाव को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἔμπροσθεν
  choice: के सामने
  rationale: यह प्रभु की उपस्थिति में होने का स्थानिक और न्यायिक-सार्वजनिक भाव सहज हिन्दी में व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए मानक और प्रसंगानुकूल मसीही सम्बोधन है।
- source_word: παρουσίᾳ
  choice: आगमन
  rationale: इस भविष्यकालीन मसीही प्रसंग में ‘आगमन’ प्रभु के आने को स्पष्ट करता है, जबकि शब्द की ‘उपस्थिति’ वाली अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: भविष्यकालीन प्रसंग में παρουσίᾳ का अनुवाद
  choice: आगमन
  alternative: उपस्थिति; आना
  rationale: यहाँ प्रसंग प्रभु यीशु के भविष्य में आने की ओर संकेत करता है, इसलिए ‘आगमन’ स्पष्ट और गरिमापूर्ण है; फिर भी यूनानी शब्द आगमन से उत्पन्न उपस्थिति को भी सूचित कर सकता है, इसलिए वह सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। मूल के आलंकारिक प्रश्न और तीन समानान्तर संज्ञाओं—आशा, आनन्द और गर्व का मुकुट—को बनाए रखा गया है।
