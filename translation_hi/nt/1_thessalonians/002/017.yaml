id: 1TH.2.17
reference: 1 Thessalonians 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: hi
  text: परन्तु हे भाइयो[a], हम थोड़े समय के लिए आपसे बिछुड़ गए थे[b]—प्रत्यक्ष रूप से, मन से नहीं—और हमने बड़ी लालसा के साथ आपका मुख देखने का और भी अधिक भरसक प्रयत्न किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” पौलुस का सम्बोधन है; प्रसंग में सम्भवतः इसमें स्त्रियों सहित पूरी विश्वासी मण्डली सम्मिलित है।
    reason: cultural_note
  - marker: b
    text: यूनानी में अधिक शाब्दिक रूप से, “आपसे अनाथ कर दिए गए थे” या “वियोगी कर दिए गए थे”; यह अलगाव को शोकपूर्ण पारिवारिक-वियोग के सजीव बिम्ब से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: परन्तु ... हम
  rationale: δέ पिछले कथन से हल्का विरोध या संक्रमण दिखाता है, और Ἡμεῖς पर बल है; हिन्दी वाक्य-विन्यास में दोनों को स्वाभाविक ढंग से रखा गया है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन का व्याकरणिक पुल्लिंग रूप सुरक्षित रखा गया है; प्रसंग में यह पूरी विश्वासी मण्डली को सम्बोधित कर सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: हम आपसे बिछुड़ गए थे
  rationale: क्रिया में अनाथ या वियोगग्रस्त किए जाने का सजीव भाव है। मुख्य पाठ में स्वाभाविक हिन्दी 'बिछुड़ गए' पीड़ादायक अलगाव व्यक्त करती है, जबकि शाब्दिक बिम्ब पादटिप्पणी में रखा गया है।
- source_word: πρὸς καιρὸν ὥρας
  choice: थोड़े समय के लिए
  rationale: यह मुहावरा किसी शाब्दिक एक घंटे के बजाय संक्षिप्त अवधि बताता है।
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: सामने से, मन से नहीं
  rationale: यह शारीरिक अनुपस्थिति और भीतरी स्नेह के बीच विरोध को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: हम और भी अधिक उत्सुक थे
  rationale: περισσοτέρως तीव्रता बढ़ाता है और ἐσπουδάσαμεν यहाँ उत्सुकता तथा तत्पर प्रयत्न का भाव देता है; यह रूप भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: आपका मुख देखने के लिए
  rationale: मूल के 'मुख देखने' वाले व्यक्तिगत और देहधारी मिलन के भाव को केवल 'आपसे मिलने' में समतल नहीं किया गया।
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: बड़ी लालसा के साथ
  rationale: यहाँ ἐπιθυμία प्रबल स्नेहपूर्ण अभिलाषा है, न कि अनिवार्य रूप से कोई नकारात्मक कामना।
theological_decisions:
- issue: ἀδελφοί में लिंगयुक्त सम्बोधन
  choice: हे भाइयो
  alternative: हे भाइयो और बहनो
  rationale: मूल का व्याकरणिक पुल्लिंग सम्बोधन मुख्य पाठ में रखा गया है; साथ ही पादटिप्पणी बताती है कि पौलुस का सम्बोधन प्रसंगतः स्त्रियों सहित पूरी विश्वासी मण्डली को समेट सकता है।
- issue: ἀπορφανισθέντες का पारिवारिक-वियोग बिम्ब
  choice: बिछुड़ गए थे
  alternative: अनाथ कर दिए गए थे
  rationale: शाब्दिक रूप हिन्दी में सम्बन्ध को भ्रमित कर सकता है, क्योंकि पौलुस थिस्सलुनीकियों की सन्तान नहीं कहलाता; इसलिए मुख्य पाठ अर्थगत पीड़ा रखता है और पादटिप्पणी मूल बिम्ब सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। 'आप' से सामुदायिक सम्बोधन, 'मन' से आन्तरिक स्नेह, और 'मुख देखने' से मूल की व्यक्तिगत अभिव्यक्ति सुरक्षित रहती है। मुख्य पाठ में दोनों पादटिप्पणी संकेत आवश्यक हैं; अतः ἀπορφανισθέντες के बाद [b] लगाया जाना चाहिए।
