  to: परन्तु हे भाइयो[a], हम थोड़े समय के लिए आपसे बिछुड़ गए थे[b]—प्रत्यक्ष रूप से, मन से नहीं—और हमने बड़ी लालसा के साथ आपका मुख देखने का और भी अधिक भरसक प्रयत्न किया।
