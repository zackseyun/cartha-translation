  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: hi
  text: और न हम लोगों से सम्मान[a] पाने की कोशिश कर रहे थे—न आपसे, न दूसरों से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमा” अथवा “प्रशंसा।”
    reason: δόξα के लिए शब्दगत विकल्प; इस प्रसंग में आशय लोगों से मिलने वाले सम्मान या अनुमोदन का है।
lexical_decisions:
- source_word: ζητοῦντες
  choice: पाने की खोज में थे
  rationale: वर्तमान कृदंत को आसपास के वाक्य से मिलने वाले निहित कर्ता और भूतकालीन प्रसंग के अनुरूप व्यक्त किया गया है; यह लगातार चाहने या प्रयास करने का भाव रखता है।
- source_word: ἐξ ἀνθρώπων
  choice: मनुष्यों से
  rationale: ἄνθρωποι यहाँ पुरुषों तक सीमित नहीं, बल्कि सामान्य रूप से मानव समुदाय को दर्शाता है; ‘मनुष्यों से’ आधुनिक मानक हिन्दी में व्यापक मानवीय संदर्भ स्पष्ट करता है।
- source_word: δόξαν
  choice: महिमा
  rationale: यहाँ δόξα का आशय मनुष्यों से मिलने वाली प्रतिष्ठा, आदर या प्रशंसा है। ‘महिमा’ नए नियम में इस शब्द की व्यापक शाब्दिक संगति बनाए रखती है, जबकि पादटिप्पणी प्रसंगगत विकल्प स्पष्ट करती है।
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: और न ...—न ... न
  rationale: पहला ‘और न’ पिछले कथन से संबंध बनाए रखता है, और बाद के दो ‘न’ स्रोत की समन्वयी नकारात्मक संरचना को स्वाभाविक हिन्दी में प्रस्तुत करते हैं।
- source_word: ἀφ’ ὑμῶν
  choice: आपसे
  rationale: यह थिस्सलुनीके के विश्वासियों के लिए प्रत्यक्ष द्वितीय पुरुष बहुवचन संबोधन है; ‘आपसे’ सम्मानपूर्ण और स्वाभाविक हिन्दी है।
- source_word: ἀπ’ ἄλλων
  choice: दूसरों से
  rationale: यह थिस्सलुनीकियों के अतिरिक्त अन्य लोगों को संक्षेप और स्वाभाविक ढंग से दर्शाता है।
theological_decisions:
- issue: ζητοῦντες के निहित कर्ता का हिन्दी में प्रकटीकरण
  choice: हम ... थे
  alternative: कर्ता को निहित रखते हुए कृदंतीय वाक्यांश
  rationale: यह खंड पिछले वाक्य के पौलुस और उसके सहकर्मियों से जुड़ता है। हिन्दी में स्वतंत्र, सुबोध अभिव्यक्ति के लिए ‘हम’ और ‘थे’ आवश्यक हैं, पर उनसे नया कर्ता नहीं जोड़ा गया।
- issue: माँगी जाने वाली δόξα का स्वरूप
  choice: मनुष्यों से मिलने वाली महिमा अर्थात मानवीय प्रतिष्ठा/प्रशंसा
  alternative: परमेश्वर की महिमा
  rationale: ἐξ ἀνθρώπων स्पष्ट करता है कि यहाँ स्रोत मनुष्य हैं। अनुवाद इसको परमेश्वर की महिमा पाने की खोज के रूप में नहीं पढ़ता, फिर भी δόξα की शाब्दिक व्यापकता को पादटिप्पणी सहित बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘महिमा’ प्रमुख नए नियमीय शब्दावली से संबंध बनाए रखती है; डैश अंतिम दो स्रोतों के विशेषीकरण को स्पष्ट करता है।
