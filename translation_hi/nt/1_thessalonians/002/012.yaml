translation:
  language: hi
  text: हम तुम्हें प्रोत्साहित करते, ढाढ़स बँधाते और गंभीरता से आग्रह करते थे कि तुम ऐसा जीवन जियो जो परमेश्वर के योग्य हो[a]—वही तुम्हें अपने राज्य और महिमा में बुलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में शाब्दिक अर्थ ‘चलना’ है; यहाँ ‘चलना’ जीवन बिताने और आचरण करने का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: प्रोत्साहित करते
  rationale: यह वर्तमान कृदंत पौलुस और उसके सहकर्मियों की निरंतर पितातुल्य सेवा बताता है। ‘प्रोत्साहित’ पारिवारिक संदर्भ में स्वाभाविक है और उपदेश देने के भाव को अनावश्यक कठोरता नहीं देता।
- source_word: παραμυθούμενοι
  choice: ढाढ़स बँधाते
  rationale: यह सांत्वना देने और हौसला बढ़ाने वाली आत्मीय वाणी को व्यक्त करता है तथा पहले कृदंत से अर्थगत अंतर भी बनाए रखता है।
- source_word: μαρτυρόμενοι
  choice: गंभीरता से आग्रह करते
  rationale: संदर्भ में क्रिया का भाव गंभीर साक्ष्य देते हुए ज़ोर देने या आग्रह करने का है। यह अनुवाद केवल ‘गवाही देते’ की संभावित अस्पष्टता से बचते हुए उसकी गंभीरता बनाए रखता है।
- source_word: εἰς τὸ περιπατεῖν
  choice: कि ... जीवन जियो
  rationale: εἰς के साथ सप्रत्यय क्रियारूप उद्देश्य/परिणाम व्यक्त करता है। हिन्दी में आचरण के लिए शाब्दिक ‘चलो’ की अपेक्षा ‘जीवन जियो’ अधिक स्वाभाविक और तत्काल बोधगम्य है।
- source_word: ἀξίως τοῦ θεοῦ
  choice: परमेश्वर के योग्य
  rationale: ἀξίως के बाद संबंधकारक का सीधा अर्थ ‘के योग्य’ है; इससे अपेक्षित जीवन-आचरण व्यक्त होता है, बिना यह संकेत दिए कि मनुष्य परमेश्वर के समान योग्य बन सकता है।
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: वही तुम्हें ... बुलाता है
  rationale: वर्तमान कृदंत को वर्तमान काल में रखा गया है, जिससे बुलाने की क्रिया के समय या रीति पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा जाता।
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: अपने राज्य और महिमा में
  rationale: ‘अपने’ ἑαυτοῦ के आत्मवाचक बल को सुरक्षित रखता है। एक ही संबंधसूचक पद राज्य और महिमा दोनों पर लागू है, इसलिए दोनों को समानांतर रखा गया है।
theological_decisions:
- issue: περιπατεῖν के रूपक को शाब्दिक रखना या उसका आशय स्पष्ट करना
  choice: मुख्य पाठ में ‘जीवन जियो’
  alternative: ‘चलो’ अथवा ‘चाल चलो’
  rationale: मूल रूपक जीवन-आचरण को दर्शाता है, पर आधुनिक सामान्य हिन्दी में ‘परमेश्वर के योग्य चलो’ अस्वाभाविक या अस्पष्ट होगा। अर्थ-समान अभिव्यक्ति मुख्य पाठ में रखी गई और शाब्दिक रूपक पादटिप्पणी में बताया गया है।
- issue: τοῦ καλοῦντος में परमेश्वर के बुलाने का काल और बल
  choice: ‘बुलाता है’
  alternative: ‘बुला रहा है’ अथवा ‘जिसने बुलाया’
  rationale: वर्तमान कृदंत का सामान्य वर्तमान हिन्दी में स्वाभाविक है और बुलाहट के समय, क्रम या प्रभावशीलता के विषय में कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: राज्य और महिमा के साथ εἰς का संबंध
  choice: ‘अपने राज्य और महिमा में’
  alternative: ‘अपने राज्य और महिमा की ओर’
  rationale: ‘में’ सहभागिता/प्रवेश का स्वाभाविक अर्थ देता है, जबकि दोनों संज्ञाओं को समन्वित रखकर उनके परस्पर संबंध को व्याख्यात्मक रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। तीनों कृदंतों की अलग-अलग छटाएँ ‘प्रोत्साहित’, ‘ढाढ़स बँधाते’ और ‘गंभीरता से आग्रह’ द्वारा सुरक्षित रखी गई हैं। पिछले पदों के भूतकालीन वर्णन से वाक्य जोड़ने के लिए हिन्दी में ‘करते थे’ प्रयुक्त है; परमेश्वर की बुलाहट के वर्तमान कृदंत को ‘बुलाता है’ रखा गया है।
