source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: hi
  text: क्योंकि हम कभी भी चापलूसी भरी बातों के साथ नहीं आए[a], जैसा कि तुम जानते हो, और न ही लोभ की आड़ लेकर आए[b]—परमेश्वर गवाह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चापलूसी के साथ”; शाब्दिक रूप से, “चापलूसी के वचन में।”
    reason: lexical_alternative
  - marker: b
    text: या, “लोभ के लिए बहाने के साथ” अथवा “लोभ के बहाने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: क्योंकि हम न तो कभी
  rationale: γάρ को पिछले कथन से कारणात्मक संबंध बनाए रखने के लिए ‘क्योंकि’ और οὔτε...ποτε की समयगत प्रबल नकारात्मकता को स्वाभाविक हिन्दी में ‘न तो कभी’ से व्यक्त किया गया है।
- source_word: ἐν λόγῳ κολακείας
  choice: चापलूसी भरी बातें लेकर
  rationale: λόγος यहाँ एक अकेले शब्द के बजाय वाणी या कही गई बातों को सूचित करता है, जबकि κολακεία चापलूसी है। यह पदबंध ἐν के संगत/साधनात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐγενήθημεν
  choice: हम ... लेकर आए
  rationale: संदर्भ पौलुस और उसके साथियों के थिस्सलुनीके आने और वहाँ उनके व्यवहार का है। ‘लेकर आए’ इस प्रसंग में γίνομαι के प्रकट होने या उपस्थित होने के भाव को स्वाभाविक रूप देता है, यद्यपि इसका अधिक शाब्दिक अर्थ ‘हुए’ हो सकता है।
- source_word: καθὼς οἴδατε
  choice: जैसा कि तुम जानते हो
  rationale: यह पाठकों के अपने प्रत्यक्ष ज्ञान की ओर सीधा प्रमाणात्मक संकेत है।
- source_word: ἐν προφάσει πλεονεξίας
  choice: लोभ को छिपाने के लिए कोई बहाना लेकर
  rationale: πρόφασις बहाने, दिखावे या आड़ को और πλεονεξία अधिक पाने की लालसा या लोभ को दर्शाता है। हिन्दी अभिव्यक्ति छिपे हुए लोभी उद्देश्य का भाव स्पष्ट करती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: θεὸς μάρτυς
  choice: परमेश्वर गवाह है
  rationale: यूनानी में अधिकारवाचक सर्वनाम नहीं है; इसलिए यह संक्षिप्त और गंभीर कथन मूल के निकट रहते हुए स्वाभाविक हिन्दी है।
theological_decisions:
- issue: पौलुस द्वारा अपने साधनों और उद्देश्यों का निषेध
  choice: पद वाणी में चापलूसी और बहाने की आड़ में छिपे लोभ—दोनों का निषेध करता है।
  alternative: इसे हर प्रकार की प्रभावशाली वक्तृता का निषेध मानना, या इसे केवल आर्थिक शोषण तक सीमित करना।
  rationale: यूनानी पाठ विशेष रूप से κολακεία और πλεονεξία को नाम देता है। अनुवाद इन्हीं ठोस आरोपों तक रहता है और व्यापक साम्प्रदायिक या सेवकाई-संबंधी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘चापलूसी’, ‘लोभ’, ‘बहाना’ और ‘गवाह’ प्रचलित शब्द हैं। संबोधन के लिए बहुवचन ‘तुम’ संदर्भानुकूल और सुलभ है; वाक्य के दोनों निषेधों को ‘न तो...और न...’ से संतुलित रखा गया है।
