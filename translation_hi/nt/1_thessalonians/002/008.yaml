id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: hi
  text: इसी प्रकार, आपके लिए गहरा स्नेह रखते हुए[a], हमें आपके साथ न केवल परमेश्वर का सुसमाचार, बल्कि अपने जीवन तक बाँटने में प्रसन्नता हुई[b], क्योंकि आप हमारे प्रिय हो गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपके लिए तरसते हुए’ अथवा ‘आपके प्रति गहरी आत्मीय लालसा रखते हुए’; यूनानी का यह दुर्लभ शब्द प्रबल स्नेह और लालसा व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने प्राण तक’ अथवा ‘स्वयं को भी’; यहाँ ‘जीवन’ का अर्थ है कि उन्होंने केवल सन्देश ही नहीं, बल्कि अपने आपको भी व्यक्तिगत और बलिदानी रीति से दे दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले पद के पालन-पोषण और कोमल देखभाल के चित्र से इस व्यवहार को जोड़ता है और क्रिया-विशेषण का ढंग-सूचक भाव बनाए रखता है।
- source_word: ὁμειρόμενοι ὑμῶν
  choice: आपके लिए गहरा स्नेह रखते हुए
  rationale: दुर्लभ कृदन्त प्रबल आत्मीय लगाव और लालसा व्यक्त करता है। यह अनुवाद उस भावनात्मक गहराई को स्वाभाविक हिन्दी में रखता है और कृदन्त को अनावश्यक रूप से केवल कारणवाचक नहीं बनाता।
- source_word: εὐδοκοῦμεν
  choice: हमें ... प्रसन्नता हुई
  rationale: यह केवल सहमति नहीं, बल्कि स्वेच्छापूर्ण प्रसन्नता दर्शाता है। हिन्दी अभिव्यक्ति इसी सकारात्मक और इच्छापूर्ण भाव को सहज रूप में देती है।
- source_word: μεταδοῦναι
  choice: बाँटने
  rationale: क्रिया अपनी वस्तु में दूसरों को सहभागी करने का भाव रखती है और सुसमाचार तथा जीवन—दोनों कर्मों के साथ स्वाभाविक बैठती है।
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: परमेश्वर का सुसमाचार
  rationale: यह पौलुस की स्थापित धार्मिक शब्दावली और यूनानी सम्बन्धकारक की सीधी संरचना दोनों को सुरक्षित रखता है।
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: अपने जीवन तक
  rationale: यहाँ ψυχή अलग अभौतिक आत्मा की शिक्षा देने के बजाय व्यक्ति के जीवन और स्वयं के आत्म-समर्पण को दर्शाता है। ‘तक’ बल और बलिदानी तत्परता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: διότι
  choice: क्योंकि
  rationale: यह उनके आत्म-समर्पण का कारण स्पष्ट रूप से बताता है।
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: आप हमारे प्रिय हो गए थे
  rationale: यह परिणामी अवस्था और व्यक्तिगत आत्मीयता दोनों को सहज हिन्दी में रखता है, बिना कोई अतिरिक्त तकनीकी धार्मिक अर्थ जोड़े।
theological_decisions:
- issue: ψυχάς का अर्थ
  choice: अपने जीवन तक
  alternative: अपने प्राण तक; स्वयं को भी
  rationale: सन्दर्भ प्रेरितों की आत्म-समर्पित देखभाल का है, शरीर और आत्मा के भेद पर मानवशास्त्रीय कथन का नहीं। ‘जीवन’ ठोस और बलिदानी अर्थ को स्पष्ट करता है।
- issue: ἀγαπητοὶ की शक्ति
  choice: हमारे प्रिय
  alternative: हमारे द्वारा प्रेम किए गए; हमारे प्यारे
  rationale: ‘हमारे प्रिय’ सम्बन्धपरक स्नेह को गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है तथा अनावश्यक तकनीकी धार्मिक अर्थ से बचता है।
- issue: ὁμειρόμενοι का कृदन्तीय सम्बन्ध
  choice: गहरा स्नेह रखते हुए
  alternative: क्योंकि हम आपके लिए तरसते थे
  rationale: यूनानी कृदन्त में ढंग, साथ-साथ घटित भाव और सम्भावित कारण का कुछ खुलापन है। हिन्दी कृदन्त उस अस्पष्टता को केवल कारणवाचक वाक्य में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, आत्मीय और गरिमापूर्ण है। ‘सुसमाचार’ स्थापित और व्यापक रूप से समझा जाने वाला बाइबिलीय शब्द है। वाक्य में मूल यूनानी की भावात्मक तीव्रता और आत्म-समर्पण को बनाए रखते हुए कृदन्त की वास्तविक व्याकरणिक अस्पष्टता को खुला रखा गया है।
