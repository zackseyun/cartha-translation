  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: hi
  text: यद्यपि मसीह के प्रेरित होने के नाते हम तुम पर अपना भार डाल सकते थे,[a] फिर भी हम तुम्हारे बीच कोमल बन गए—जैसे दूध पिलानेवाली माँ अपने ही बच्चों को प्यार से दुलारती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “भार में हो सकते थे।” भाव यह भी हो सकता है: “अपना अधिकार जता सकते थे,” “तुमसे माँगें कर सकते थे,” या “तुम्हारे लिए बोझ बन सकते थे।”'
    reason: lexical_alternative
  - marker: b
    text: “दूध पिलानेवाली माँ” का अनुवाद “धाय” भी हो सकता है। चित्र कोमल मातृ-सदृश देखभाल का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι ἐν βάρει εἶναι
  choice: हम तुम पर अपना भार डाल सकते थे
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘भार में होना’ है। हिन्दी में ‘अपना भार डालना’ भार, माँग और प्रेरिताई अधिकार के प्रभाव—इन संभावित अर्थों को अपेक्षाकृत खुला रखते हुए स्वाभाविक लगता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: मसीह के प्रेरित होने के नाते
  rationale: Χριστοῦ यहाँ उपाधि के रूप में है, इसलिए ‘मसीह’ चुना गया। ὡς का प्रसंगगत अर्थ है कि उनकी प्रेरिताई हैसियत उन्हें ऐसा करने की क्षमता या अधिकार देती थी।
- source_word: ἀλλὰ ἐγενήθημεν
  choice: फिर भी हम ... बने रहे
  rationale: ἀλλά पिछले रियायती कथन के साथ प्रबल विरोध व्यक्त करता है। ἐγενήθημεν के क्रियात्मक बल को ‘बने रहे’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤπιοι
  choice: कोमल
  rationale: यह शब्द नम्र, मृदु और सौम्य व्यवहार का बोध देता है; मातृ-सदृश उपमा के साथ ‘कोमल’ स्वाभाविक है।
- source_word: ἐν μέσῳ ὑμῶν
  choice: तुम्हारे बीच
  rationale: मूल पूर्वसर्गीय वाक्यांश का सहज आधुनिक हिन्दी रूप।
- source_word: ὡς ἐὰν τροφὸς
  choice: जैसे दूध पिलानेवाली माँ
  rationale: τροφός ऐसी स्त्री को दर्शाता है जो शिशु को दूध पिलाकर उसकी देखभाल करती है। ‘माँ’ निकटवर्ती ‘अपने बच्चों’ के कारण स्वाभाविक है, पर ‘धाय’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: θάλπῃ
  choice: स्नेह से सँभालती है
  rationale: क्रिया का मूल चित्र गर्म रखने और उससे विस्तारित कोमल देखभाल का है। यह हिन्दी अभिव्यक्ति उस पोषणकारी स्नेह को स्पष्ट करती है।
- source_word: τὰ ἑαυτῆς τέκνα
  choice: अपने बच्चों को
  rationale: ἑαυτῆς का आत्मवाचक बल ‘अपने’ से और τέκνα का सामान्य अर्थ ‘बच्चों’ से व्यक्त होता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: इस वाक्यांश में Χριστός पदवी के रूप में प्रयुक्त है; इसलिए अर्थ-स्पष्ट हिन्दी पद ‘मसीह’ चुना गया।
- issue: ἐν βάρει εἶναι का आशय
  choice: तुम पर अपना भार डालना
  alternative: अपना अधिकार जता सकते थे / माँगें रख सकते थे / तुम्हारे लिए बोझ बन सकते थे
  rationale: वाक्यांश में आर्थिक बोझ, माँग करने या प्रेरिताई प्रतिष्ठा का भार जताने की गुंजाइश है। मुख्य पाठ भार-रूपक को बनाए रखता है और पादटिप्पणी संभावित अर्थों को बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन में बहुवचन ‘तुम’ रखा गया है। मातृ-सदृश उपमा को भावुक बनाए बिना उसकी कोमलता सुरक्षित रखी गई है।
