id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: hi
  text: 'पौलुस, सिलवानुस और तीमुथियुस की ओर से,


    थिस्सलुनीकियों की उस कलीसिया[a] के नाम, जो परमेश्वर पिता और प्रभु यीशु मसीह[b] में है:


    तुम्हें अनुग्रह और शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभा।” यूनानी शब्द एकत्र हुए समुदाय को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “मसीह” का अर्थ “अभिषिक्त जन” है।
    reason: lexical_clarification
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप।
- source_word: Σιλουανὸς
  choice: सिलवानुस
  rationale: मूल पाठ में आए Σιλουανός का सीधा रूप रखा गया है; इसे परिचित नाम ‘सीलास’ से नहीं बदला गया, क्योंकि वह अलग यूनानी रूप को दर्शाता है।
- source_word: Τιμόθεος
  choice: तीमुथियुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: पत्र के इस संबोधन में विश्वासियों के एकत्र समुदाय के लिए हिन्दी में स्वाभाविक और प्रचलित शब्द; ‘सभा’ संभव विकल्प है।
- source_word: Θεσσαλονικέων
  choice: थिस्सलुनीकियों की
  rationale: बहुवचन संबंधकारक नगर थिस्सलुनीके से जुड़े लोगों को सूचित करता है; यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: ἐν
  choice: में
  rationale: समुदाय के परमेश्वर पिता और प्रभु यीशु मसीह के साथ संबंध अथवा उसके अस्तित्व के क्षेत्र को बिना अधिक व्याख्या किए सुरक्षित रखता है।
- source_word: θεῷ πατρὶ
  choice: परमेश्वर पिता
  rationale: यूनानी में ‘हमारे’ नहीं है, इसलिए कोई अतिरिक्त संबंधवाचक सर्वनाम नहीं जोड़ा गया।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: नए नियम के इस धार्मिक संदर्भ में κύριος का स्वाभाविक और मानक हिन्दी रूप।
- source_word: Ἰησοῦ Χριστῷ
  choice: यीशु मसीह
  rationale: Χριστός के पदवीगत अर्थ को हिन्दी के प्रचलित ‘मसीह’ से व्यक्त किया गया है; यह ‘अभिषिक्त जन’ के अर्थ को वहन करता है और यीशु के नाम के साथ स्वाभाविक है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन का मानक धार्मिक शब्द, जो कृपा और ईश्वरीय अनुग्रह की अर्थ-छाया बनाए रखता है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यूनानी और यहूदी अभिवादन की अर्थ-छाया को सुरक्षित रखने वाला स्वाभाविक हिन्दी शब्द।
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: तुम्हें अनुग्रह और शांति मिले
  rationale: हिन्दी में पूर्ण और स्वाभाविक आशीर्वचन बनाने के लिए निहित क्रिया ‘मिले’ जोड़ी गई है, जबकि अनुग्रह और शांति का मूल क्रम रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: यहाँ पदवी का अर्थ सक्रिय है। ‘मसीह’ आधुनिक हिन्दी के धार्मिक प्रयोग में स्वाभाविक है और मूलतः अभिषिक्त राजा/उद्धारकर्ता की पदवी को दर्शाता है; पादटिप्पणी अर्थ स्पष्ट करती है।
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ द्वारा व्यक्त संबंध
  choice: जो परमेश्वर पिता और प्रभु यीशु मसीह में है
  alternative: जो परमेश्वर पिता और प्रभु यीशु मसीह की है
  rationale: ‘में’ को बनाए रखने से पौलुस की संबंध, सहभागिता या अस्तित्व के क्षेत्र से जुड़ी भाषा सुरक्षित रहती है; इसे केवल स्वामित्व के अर्थ में सीमित नहीं किया गया।
- issue: θεῷ πατρὶ में संबंधवाचक सर्वनाम
  choice: परमेश्वर पिता
  alternative: हमारे परमेश्वर पिता
  rationale: मूल यूनानी में ‘हमारे’ नहीं है, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पत्र-संबोधन को स्पष्ट करने के लिए ‘की ओर से’ और ‘के नाम’ का प्रयोग किया गया है; यूनानी के संक्षिप्त आशीर्वचन में हिन्दी की अपेक्षित क्रिया ‘मिले’ जोड़ी गई है।
