lexical_decisions:
- source_word: μνημονεύοντες
  choice: याद करते हुए
  rationale: वर्तमान कृदंत पिछले वाक्य की क्रिया को आगे बढ़ाता है; यह रूप निरंतर स्मरण का स्वाभाविक संकेत देता है।
- source_word: ἔργου τῆς πίστεως
  choice: विश्वास से उत्पन्न काम
