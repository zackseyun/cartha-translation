- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: आशा से उत्पन्न धीरज
  rationale: ὑπομονή दबाव में टिके रहने का भाव रखता है; 'धीरज' सामान्य हिंदी में स्वाभाविक है और आशा से उसके संबंध को बनाए रखता है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीहा पर रखी
  rationale: यह संबंधकारक निकटतम संज्ञा 'आशा' के विषय/आधार को बताता है; हिंदी में 'पर रखी आशा' इसे स्पष्ट और स्वाभाविक बनाता है। Χριστός को उपाधि के अर्थ में 'मसीहा' किया गया है।
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: हमारे परमेश्वर और पिता के सामने
  rationale: ἔμπροσθεν का उपस्थिति-संबंधी अर्थ 'के सामने' से सीधे व्यक्त होता है; साझा लेख के अंतर्गत दोनों पदों की निकटता बनी रहती है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस प्रसंग में परमेश्वर/मसीह पर विश्वास से उत्पन्न काम सबसे संभावित है, पर शब्द में 'विश्वासयोग्यता' अथवा 'भरोसा' की छाया संभव है; विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: Χριστός का अनुवाद
  choice: मसीहा
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की उपाधि का अर्थ रखता है, इसलिए अर्थपरक 'मसीहा' मुख्य पाठ में रखा गया है; प्रचलित लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: तीन संबंधकारक पदों का संबंध
  choice: विश्वास से उत्पन्न काम, प्रेम से किया गया परिश्रम, और आशा से उत्पन्न धीरज
  alternative: विश्वास का काम, प्रेम का परिश्रम, और आशा का धीरज
  rationale: यूनानी संबंधकारक व्याकरणतः व्यापक हैं। मुख्य पाठ में संभावित उत्पादक/विशेषक अर्थ को स्वाभाविक हिंदी में दिया गया है, जबकि अधिक शाब्दिक और जानबूझकर अनिर्णीत रूप पादटिप्पणी में सुरक्षित है।
