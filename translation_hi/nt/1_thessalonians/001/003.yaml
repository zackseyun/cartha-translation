  - marker: b
    text: 'अधिक शाब्दिक रूप से: “तुम्हारे विश्वास का काम, प्रेम का परिश्रम, और हमारे प्रभु यीशु मसीहा की आशा का धीरज।” यूनानी में इन संबंधों का ठीक आशय कुछ हद तक खुला है।'
