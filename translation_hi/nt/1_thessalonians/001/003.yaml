  text: हमारे परमेश्वर और पिता के सामने तुम्हारे विश्वास के काम, प्रेम के परिश्रम, और हमारे प्रभु यीशु मसीहा में आशा के धीरज को याद करते हुए[a][b][c],
  philosophy: optimal-equivalence
