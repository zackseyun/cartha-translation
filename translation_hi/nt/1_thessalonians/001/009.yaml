source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: hi
  text: क्योंकि वे स्वयं हमारे विषय में बताते हैं कि आपके पास हमारा आना कैसा रहा[a], और यह भी कि आप मूर्तियों से हटकर परमेश्वर की ओर कैसे मुड़े[b], जीवित और सच्चे परमेश्वर[c] की सेवा करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके बीच हमारा प्रवेश कैसा था।” यूनानी अभिव्यक्ति उनके आगमन के स्वरूप और उसके प्रभाव—दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “आप मूर्तियों से परमेश्वर की ओर फिरे।” ‘मन फिराया’ भी इस मुड़ने के व्यापक आशय को व्यक्त करता है।
    reason: alternative_reading
  - marker: c
    text: “जीवित और सच्चा परमेश्वर” निर्जीव मूर्तियों के विपरीत है; यिर्मयाह 10:10 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: 'बलवाचक सर्वनाम का जोर बनाए रखता है: दूसरे लोग पौलुस के कहे बिना स्वयं यह समाचार सुना रहे हैं।'
- source_word: ἀπαγγέλλουσιν
  choice: बताते हैं
  rationale: वर्तमान काल में लगातार समाचार सुनाने का भाव देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: आपके पास हमारा आना कैसा रहा
  rationale: ‘प्रवेश’ की मूल छवि को स्वाभाविक हिन्दी में रखते हुए पौलुस के आगमन के स्वरूप और प्रभाव—दोनों के लिए स्थान छोड़ता है।
- source_word: πῶς ἐπεστρέψατε
  choice: आप कैसे ... फिरकर ... मुड़े
  rationale: दिशा बदलने और मन-परिवर्तन की रूपकात्मक भाषा को बनाए रखता है; किसी बाद की तकनीकी धर्मशास्त्रीय शब्दावली को मुख्य पाठ में नहीं थोपता।
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: मूर्तियों से फिरकर परमेश्वर की ओर
  rationale: ग्रीक के स्रोत और लक्ष्य—मूर्तियों से दूर तथा परमेश्वर की ओर—दोनों दिशाओं को स्पष्ट करता है।
- source_word: εἰδώλων
  choice: मूर्तियों
  rationale: पूजा की वस्तुओं अथवा देव-प्रतिमाओं के लिए सीधा और प्रचलित हिन्दी शब्द है।
- source_word: δουλεύειν
  choice: सेवा करें
  rationale: यहाँ परमेश्वर के प्रति समर्पित धार्मिक सेवा का भाव है; ‘दास बनें’ प्रसंग की अपेक्षा अधिक कठोर अर्थ ला सकता है।
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: जीवित और सच्चे परमेश्वर
  rationale: निर्जीव मूर्तियों के विपरीत परमेश्वर के जीवित और वास्तविक/सच्चे होने पर दिए गए जोर को स्पष्ट और परंपरागत ढंग से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के समर्थन में आए व्याख्यात्मक संबंध को स्पष्ट करता है।
theological_decisions:
- issue: ἐπεστρέψατε में मन-परिवर्तन और कर्तृत्व
  choice: ‘आप ... परमेश्वर की ओर मुड़े’
  alternative: ‘आप ... परमेश्वर की ओर फेरे गए’ अथवा ‘आपका मन ... परमेश्वर की ओर फिरा’
  rationale: ग्रीक क्रिया सक्रिय रूप में है और मुड़ने की छवि रखती है। मुख्य पाठ उसी व्याकरण और रूपक को बनाए रखता है, जबकि पादटिप्पणी धर्म-परिवर्तन के व्यापक आशय को बताती है, बिना ईश्वरीय और मानवीय कर्तृत्व के प्रश्न को अनावश्यक रूप से निर्णीत किए।
- issue: δουλεύειν का सेवा-दासता संबंधी बल
  choice: ‘सेवा करें’
  alternative: ‘दास बनकर सेवा करें’ या ‘उपासना करें’
  rationale: क्रिया दासवत समर्पण के अर्थ-क्षेत्र से आती है, पर इस धार्मिक प्रसंग में ‘सेवा’ निष्ठा और उपासना दोनों को समेटती है तथा अनावश्यक कठोरता से बचती है।
- issue: ‘जीवित और सच्चा परमेश्वर’ का मूर्तियों से विरोध
  choice: विशेषणों को सीधे बनाए रखा गया
  alternative: ‘वह परमेश्वर जो जीवित और सच्चा है’
  rationale: यह वाक्यांश निर्जीव और असत्य देवताओं/मूर्तियों के विपरीत परमेश्वर की विशिष्टता बताता है; मुख्य पाठ इस विरोध को न तो कम करता है, न आगे बढ़ाकर व्याख्यायित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘आप’ बहुवचन समुदाय को संबोधित करता है। ‘प्रवेश’ जैसे अधिक शाब्दिक पर कम स्वाभाविक रूप को पादटिप्पणी में रखा गया है; मुख्य पाठ में ‘आना’ मूल छवि और पठनीयता का संतुलन रखता है।
