id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: hi
  text: और तुम बहुत क्लेश के बीच पवित्र आत्मा से मिला आनन्द[a] के साथ वचन को ग्रहण करके हमारे और प्रभु के अनुकरण करनेवाले बन गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पवित्र आत्मा का आनन्द”; अर्थात पवित्र आत्मा द्वारा उत्पन्न आनन्द भी समझा जा सकता है।
    reason: सम्बन्धकारक आनन्द के स्रोत, संबंध अथवा उत्पन्न करने वाले को सूचित कर सकता है।
lexical_decisions:
- source_word: μιμηταὶ
  choice: अनुकरण करनेवाले
  rationale: यह संज्ञा किसी आदर्श के आचरण का अनुकरण करनेवालों को दर्शाती है। यह ‘पीछे चलनेवाले’ की अपेक्षा पौलुस की अनुकरण-संबंधी भाषा को अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: ἐγενήθητε
  choice: बन गए
  rationale: यह रूप अवस्था में परिवर्तन को व्यक्त करता है; थिस्सलुनीके के विश्वासी अनुकरण करनेवाले बन गए।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος यीशु के लिए प्रयुक्त मसीही उपाधि है; हिन्दी बाइबलीय प्रयोग में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: δεξάμενοι
  choice: ग्रहण करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से जुड़ी परिस्थिति अथवा साधन को व्यक्त करता है। ‘ग्रहण करके’ इस संबंध को बिना अतिरिक्त कारण-सूचक शब्द जोड़े सहज हिन्दी में रखता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: संदर्भ में यह प्रचारित सुसमाचार-संदेश है। ‘वचन’ पौलुस की शब्दावली और उसकी व्यापक बाइबलीय प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἐν θλίψει πολλῇ
  choice: बहुत क्लेश के बीच
  rationale: θλῖψις दबाव, उत्पीड़न अथवा दुःख को दर्शाता है। ‘क्लेश’ अर्थ को बनाए रखता है, जबकि ‘के बीच’ आधुनिक हिन्दी में परिस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: पूर्वसर्गीय पद का सीधा और स्वाभाविक अनुवाद।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा से मिले
  rationale: सम्बन्धकारक को आनन्द के स्रोत के रूप में समझना संदर्भ में संभावित है। ‘से मिले’ सहज हिन्दी में आत्मा-प्रदत्त आनन्द व्यक्त करता है; मूल की वैकल्पिक सम्बन्धकारक समझ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: ‘पवित्र आत्मा के/से आनन्द’ में सम्बन्धकारक का संबंध
  choice: 'आनन्द का स्रोत: ‘पवित्र आत्मा से मिला आनन्द’'
  alternative: ‘पवित्र आत्मा का आनन्द’ अथवा ‘पवित्र आत्मा द्वारा उत्पन्न आनन्द’
  rationale: कठिन क्लेश के विपरीत यह आनन्द परिस्थितिजन्य नहीं, आत्मा से मिलनेवाला जान पड़ता है। मुख्य पाठ में संभावित स्रोतार्थ रखा गया है, पर मूल यूनानी सम्बन्धकारक को केवल इसी अर्थ तक सीमित न करते हुए वैकल्पिक समझ फुटनोट में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार बदला गया है, जबकि कृदन्त और मुख्य कथन का संबंध सुरक्षित है।
