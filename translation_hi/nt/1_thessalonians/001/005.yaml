  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: hi
  text: क्योंकि हमारा सुसमाचार तुम्हारे पास केवल शब्दों में ही नहीं पहुँचा, बल्कि सामर्थ्य, पवित्र आत्मा और बड़े निश्चय के साथ[a] पहुँचा। जैसा तुम जानते हो, हम तुम्हारे बीच तुम्हारी भलाई के लिए किस प्रकार के व्यक्ति साबित हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरे आश्वासन के साथ” अथवा “बहुत दृढ़ विश्वास के साथ।” यूनानी पाठ यह स्पष्ट नहीं करता कि यह निश्चय मुख्यतः प्रचारकों का था, सुनने वालों का, या सुसमाचार के प्रभावी आगमन का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हम तुम्हारे बीच किस प्रकार के मनुष्य बने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: पौलुस के संदर्भ में यह प्रेरितों द्वारा सुनाए गए उद्धार-संदेश का स्थापित, स्वाभाविक और विशिष्ट हिन्दी पद है।
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: तुम्हारे पास … पहुँचा
  rationale: यह यूनानी मुहावरा थिस्सलुनीकियों तक सुसमाचार के आने और उनके बीच प्रभावी होने को व्यक्त करता है; हिन्दी में ‘पहुँचा’ सहज है।
- source_word: ἐν λόγῳ μόνον
  choice: केवल शब्दों में ही
  rationale: यह मौखिक घोषणा मात्र और उसके साथ प्रकट हुई प्रभावकारी सामर्थ्य के बीच का विरोध बनाए रखता है।
- source_word: ἐν δυνάμει
  choice: सामर्थ्य में
  rationale: ‘में’ से लगातार आने वाले ἐν-वाक्यांशों की समानांतरता और बल यथासंभव सुरक्षित रहते हैं।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: यहाँ पद परमेश्वर के पवित्र आत्मा को सूचित करता है, न कि केवल किसी पवित्र मनोभाव या मानवीय आत्मा को।
- source_word: πληροφορίᾳ πολλῇ
  choice: पूरे दृढ़ विश्वास के साथ
  rationale: यह अभिव्यक्ति प्रबल निश्चय और पूर्ण आश्वासन के अर्थ-क्षेत्र को स्वाभाविक हिन्दी में रखती है, जबकि उसके धारक को स्पष्ट नहीं करती।
- source_word: καθὼς οἴδατε
  choice: तुम जानते ही हो
  rationale: यह पाठकों के अपने ज्ञान से की गई पुष्टि को स्वाभाविक हिन्दी बल के साथ व्यक्त करता है।
- source_word: οἷοι ἐγενήθημεν
  choice: हम किस प्रकार के व्यक्ति साबित हुए
  rationale: संदर्भ में यह पौलुस और उसके सहकर्मियों के चरित्र तथा आचरण की ओर संकेत करता है; ‘साबित हुए’ हिन्दी में प्रसंगानुकूल है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच रहते हुए
  rationale: यह उनके समुदाय के मध्य सेवकों की उपस्थिति और आचरण को स्पष्ट, स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारी भलाई के लिए
  rationale: संदर्भ में διά + कर्मकारक उनके हित या लाभ का भाव देता है; यह भाव केवल कारण बताने की अपेक्षा अधिक उपयुक्त है।
theological_decisions:
- issue: πνεύματι ἁγίῳ का संदर्भ
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/आध्यात्मिक शक्ति का कोई सामान्य भाव
  rationale: पौलुस की सामान्य प्रयोग-प्रणाली और ‘शब्द’ के साथ ‘सामर्थ्य’ के विरोध में यह परमेश्वर के पवित्र आत्मा की क्रियाशील उपस्थिति को सूचित करता है।
- issue: πληροφορίᾳ πολλῇ का अर्थ और संबंध
  choice: पूरे दृढ़ विश्वास के साथ; विश्वास किसका था, इसे खुला रखा गया है
  alternative: बड़े निश्चय के साथ; पूर्ण आश्वासन के साथ
  rationale: यूनानी पाठ स्पष्ट नहीं करता कि यह निश्चय प्रचारकों में, सुनने वालों में, या संदेश के आगमन के समग्र ढंग में था; अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: οἷοι ἐγενήθημεν का रूप
  choice: हम किस प्रकार के व्यक्ति साबित हुए
  alternative: हम कैसे मनुष्य बने; हमारा आचरण कैसा था
  rationale: शाब्दिक ‘बने’ हिन्दी में चरित्र-परिवर्तन का अनचाहा अर्थ दे सकता है। ‘साबित हुए’ उनके प्रकट चरित्र को दर्शाता है, जबकि ‘व्यक्ति’ ज्ञात सेवक-दल को स्वाभाविक रूप से सूचित करता है।
- issue: δι’ ὑμᾶς का संबंध
  choice: तुम्हारी भलाई के लिए
  alternative: तुम्हारे कारण
  rationale: दोनों अर्थ व्याकरणतः संभव हैं, पर मिशनरी आचरण के इस संदर्भ में हित/लाभ का भाव अधिक संभावित और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘सुसमाचार’, ‘सामर्थ्य’ और ‘पवित्र आत्मा’ जैसे परिचित बाइबलीय पद बनाए गए हैं। यूनानी वाक्य की पुनरावृत्ति को हिन्दी में अनावश्यक बोझिलता से बचाते हुए मुख्य समानांतरता सुरक्षित रखी गई है।
