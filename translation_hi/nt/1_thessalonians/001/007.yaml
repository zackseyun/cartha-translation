  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन मण्डलीय सम्बोधन है। ‘उदाहरण’ मुख्य पाठ में सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी τύπος के निकटवर्ती अर्थ-विकल्प सुरक्षित रखती है।
