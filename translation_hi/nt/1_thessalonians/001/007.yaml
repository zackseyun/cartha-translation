  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: hi
  text: इस प्रकार तुम मकिदुनिया और अखाया में सभी विश्वासियों के लिए एक उदाहरण[a] बन गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक आदर्श” या “एक नमूना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इस प्रकार
  rationale: यह पिछले कथन के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ अर्थ केवल उद्देश्य नहीं, बल्कि वास्तविक परिणाम का है।
- source_word: γενέσθαι
  choice: बन गए
  rationale: ὥστε के साथ आया एओरिस्ट infinitive परिणाम बताता है; हिन्दी में सीमित क्रिया ‘बन गए’ सहज और स्पष्ट है।
- source_word: ὑμᾶς
  choice: तुम
  rationale: यह बहुवचन सम्बोधन है और infinitive का अर्थगत कर्ता है; पत्र की सीधी सम्बोधन-शैली बनाए रखी गई है।
- source_word: τύπον
  choice: एक उदाहरण
  rationale: यह दूसरों के अनुकरण के योग्य आदर्श या नमूने को दर्शाता है; ‘उदाहरण’ सामान्य आधुनिक हिन्दी में सर्वाधिक स्पष्ट है।
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: सभी विश्वासियों के लिए
  rationale: संज्ञा के रूप में प्रयुक्त participle उन सब लोगों को दर्शाता है जो विश्वास करते हैं; dative को ‘के लिए’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: मकिदुनिया में
  rationale: यह स्थानवाचक पद रोमी प्रान्त अथवा क्षेत्र मकिदुनिया का नाम देता है।
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: और अखाया में
  rationale: दूसरे भौगोलिक क्षेत्र को समानांतर रूप से जोड़ता है; हिन्दी में दोनों स्थानों के साथ ‘में’ दोहराना स्पष्ट है।
