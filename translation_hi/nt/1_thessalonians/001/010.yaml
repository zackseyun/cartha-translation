source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: hi
  text: और उसके पुत्र के स्वर्ग से आने की प्रतीक्षा करने लगे, जिसे उसने मृतकों में से जिलाया—यीशु, जो हमें आने वाले क्रोध से बचाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हमें आने वाले क्रोध से छुड़ाता है।”
    reason: ‘बचाता है’ के लिए ῥυόμενον का निकटवर्ती शाब्दिक विकल्प; marker को बचाने वाली क्रिया पर रखा गया है।
lexical_decisions:
- source_word: ἀναμένειν
  choice: प्रतीक्षा करने लगे
  rationale: यह क्रिया पद 9 में परमेश्वर की ओर फिरने के वर्णन से जुड़ी है और आशापूर्ण प्रतीक्षा का भाव रखती है। हिंदी वाक्य में पूर्ववर्ती क्रिया के साथ स्वाभाविक संबंध के लिए ‘करने लगे’ रखा गया है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: उसके पुत्र
  rationale: यह सीधा और गरिमापूर्ण अनुवाद पुत्र-संबंधी मसीही उपाधि को बिना विस्तार के बनाए रखता है।
- source_word: ἐκ τῶν οὐρανῶν
  choice: स्वर्ग से आने
  rationale: ग्रीक में ‘स्वर्गों’ बहुवचन है, पर इस अर्थ में आधुनिक मानक हिंदी में एकवचन ‘स्वर्ग’ स्वाभाविक है। ‘आने’ को प्रतीक्षा के आशय से स्पष्ट रूप से जोड़ा गया है।
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: जिसे उसने मरे हुओं में से जिलाया
  rationale: ‘मरे हुओं में से’ ἐκ τῶν νεκρῶν की सामूहिक और पृथक्करण-संबंधी छवि को सुरक्षित रखता है; ‘जिलाया’ पुनरुत्थान के लिए सहज हिंदी है।
- source_word: Ἰησοῦν
  choice: अर्थात यीशु
  rationale: ‘अर्थात’ हिंदी में यह स्पष्ट करता है कि यीशु ही पहले उल्लिखित पुत्र हैं, बिना कोई अतिरिक्त व्याख्या जोड़े।
- source_word: τὸν ῥυόμενον
  choice: जो हमें ... बचाता है
  rationale: वर्तमान कृदंत यीशु को बचानेवाले के रूप में चित्रित करता है। सामान्य वर्तमान काल भविष्य को अनावश्यक रूप से निश्चित किए बिना उस चरित्रात्मक कार्य को बनाए रखता है।
- source_word: ἐκ τῆς ὀργῆς
  choice: प्रकोप से
  rationale: ‘प्रकोप’ परमेश्वर के सक्रिय क्रोध का गरिमापूर्ण और समझने योग्य हिंदी रूप है; इसे व्यापक ‘न्याय’ में बदलकर अर्थ को हल्का नहीं किया गया।
- source_word: τῆς ἐρχομένης
  choice: आनेवाले
  rationale: यह निकट आते हुए भावी प्रकोप को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘आनेवाले प्रकोप’ का स्वरूप
  choice: वाक्यांश को बिना और परिभाषित किए ‘आनेवाले प्रकोप’ रखा गया।
  alternative: इसे विशेष रूप से अंतिम दंड, अंतिम न्याय या अंत-कालीन क्लेश बताना।
  rationale: यह पद स्वयं प्रकोप के सटीक कालक्रम या स्वरूप को संकीर्ण रूप से परिभाषित नहीं करता; इसलिए अनुवाद किसी विशिष्ट अंत-कालीन योजना को आरोपित नहीं करता।
- issue: ῥυόμενον के वर्तमान कृदंत का कालगत बल
  choice: ‘जो हमें ... बचाता है’
  alternative: ‘जो हमें ... बचाएगा’ या ‘जो हमें ... बचा रहा है’
  rationale: ग्रीक वर्तमान कृदंत यीशु को बचानेवाले के रूप में चिन्हित कर सकता है। संदर्भ भावी है, फिर भी केवल भविष्यकाल लगा देना मूल की चरित्रात्मक अस्पष्टता को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘मरे हुओं में से जिलाया’ तथा ‘आनेवाले प्रकोप’ जैसे पद मूल की ठोस धर्मवैचारिक भाषा को बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि दिए गए अंग्रेज़ी पादटिप्पणी का पाठ उसके मुख्य पाठ से असंबद्ध प्रतीत होता है और हिंदी अनुवाद में वास्तविक पाठांतर नहीं बनाता।
