id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: hi
  text: क्योंकि प्रभु का वचन तुम्हारे यहाँ से न केवल मकिदुनिया और अखाया में गूँज उठा है, बल्कि परमेश्वर पर तुम्हारा विश्वास[a] हर जगह फैल गया है। इसलिए हमें कुछ भी कहने की आवश्यकता नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “परमेश्वर की ओर तुम्हारा विश्वास।”
    reason: πρὸς का मूल दिशात्मक भाव दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἐξήχηται
  choice: गूँज उठा है
  rationale: यह क्रिया प्रबल ध्वनि के किसी स्रोत से दूर तक गूँजने का चित्र प्रस्तुत करती है। पूर्णकाल के वर्तमान परिणाम को ‘उठा है’ से बनाए रखा गया है।
- source_word: ὁ λόγος τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: यह प्रचलित और गरिमापूर्ण पौलुसी अभिव्यक्ति है तथा संबंधकारक के अर्थ—प्रभु से आया या प्रभु से संबंधित वचन—को अनावश्यक रूप से सीमित नहीं करती।
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: मकिदुनिया और अखाया
  rationale: इन ऐतिहासिक क्षेत्रों के मानक हिन्दी बाइबलीय नाम रखे गए हैं।
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: बल्कि ... हर जगह
  rationale: यह παντὶ τόπῳ के व्यापक, वितरणात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: परमेश्वर पर तुम्हारा विश्वास
  rationale: ‘परमेश्वर पर विश्वास’ स्वाभाविक हिन्दी है। πρὸς का अधिक शाब्दिक दिशात्मक भाव फुटनोट में सुरक्षित रखा गया है।
- source_word: ἐξελήλυθεν
  choice: फैल गया है
  rationale: यूनानी में बाहर निकलने या आगे जाने की गति का बिंब है; हिन्दी में विश्वास के व्यापक रूप से ज्ञात हो जाने के लिए ‘फैल गया है’ स्पष्ट और स्वाभाविक है तथा पूर्णकाल का परिणाम भी बनाए रखता है।
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: इसलिए हमें ... आवश्यकता नहीं है
  rationale: यह ὥστε से व्यक्त परिणाम को स्पष्ट, सहज हिन्दी में रखता है।
- source_word: λαλεῖν τι
  choice: कुछ भी कहने
  rationale: संदर्भ में यह स्वाभाविक हिन्दी है और यूनानी के अनिश्चित सर्वनाम τι का बल सुरक्षित रखता है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस प्रसंग में थिस्सलुनीकियों की परमेश्वर की ओर उन्मुख विश्वासपूर्ण प्रतिक्रिया अभिप्रेत है; उनकी विश्वसनीयता मुख्य अर्थ नहीं है। इसलिए ‘विश्वास’ सबसे उपयुक्त और धर्मवैज्ञानिक रूप से अनिर्णायक अनुवाद है।
- issue: πρὸς τὸν θεόν का संबंध
  choice: परमेश्वर पर
  alternative: परमेश्वर की ओर
  rationale: ‘परमेश्वर पर विश्वास’ हिन्दी की स्वाभाविक अभिव्यक्ति है, जबकि ‘की ओर’ यूनानी का अधिक शाब्दिक दिशात्मक रूप है। उस सूक्ष्मता को फुटनोट में दिया गया है, न कि मुख्य पाठ में असहज हिन्दी द्वारा दबाया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘गूँज उठा है’ मूल ध्वनि-बिंब को बनाए रखता है, जबकि ‘फैल गया है’ दूसरे क्रियापद के गति और व्यापक प्रसार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
