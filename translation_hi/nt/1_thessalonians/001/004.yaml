lexical_decisions:
- source_word: εἰδότες
  choice: क्योंकि हम जानते हैं
  rationale: यूनानी में यह कृदन्त है, पर यहाँ पिछले विचार को कारणात्मक ढंग से आगे बढ़ाता है; हिन्दी में स्पष्ट क्रिया वाला यह रूप स्वाभाविक है।
- source_word: ἀδελφοὶ
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है। पौलुस के पत्रों में इससे प्रायः पूरी विश्वासी मण्डली को संबोधित किया जाता है; इस व्यापक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: परमेश्वर के प्रिय
  rationale: यह परमेश्वर के प्रेम के फलस्वरूप बनी हुई अवस्था व्यक्त करता है। ‘परमेश्वर के प्रिय’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा प्रेम के कर्ता के रूप में परमेश्वर को स्पष्ट रखता है।
- source_word: ἐκλογὴν
  choice: चुने हुए
  rationale: संज्ञा ἐκλογή को हिन्दी में केवल पारिभाषिक ‘चुनाव’ कहना राजनीतिक अर्थ जगा सकता है। ‘चुने हुए’ उसी चुने जाने के भाव को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी संज्ञात्मक विकल्प देती है।
- source_word: ὑμῶν
  choice: तुम
  rationale: यह बहुवचन ‘तुम्हारा/तुम लोगों का’ है; ‘कि तुम चुने हुए हो’ में इसका सम्बन्ध स्वाभाविक हिन्दी वाक्य-रचना से व्यक्त होता है।
theological_decisions:
- issue: ἐκλογή का धर्मवैज्ञानिक रूप से विवादित अर्थ
  choice: कि तुम चुने हुए हो
  alternative: तुम्हारा चुना जाना
  rationale: यह पाठ परमेश्वर से प्रेम पाए समुदाय के चुने जाने की पुष्टि करता है, पर चुनाव की प्रक्रिया, आधार या व्यापक धर्मवैज्ञानिक व्यवस्था तय नहीं करता। अनुवाद इस तनाव को खुला रखता है।
- issue: ἀδελφοί के संबोधन का दायरा
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग रूप को बनाए रखता है; सम्भावित सामुदायिक समावेश को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद पिछले वाक्य से जुड़ा है, इसलिए आरम्भ में ‘क्योंकि’ रखा गया है। सम्बोधन में प्रचलित ‘परमेश्वर के प्रिय भाइयो’ और ἐκλογή के लिए गैर-राजनीतिक, स्वाभाविक ‘चुने हुए’ अपनाया गया है।
