  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: hi
  text: हम तुम सबके लिए सदा परमेश्वर को धन्यवाद देते हैं और अपनी प्रार्थनाओं में तुम्हारा लगातार स्मरण करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘लगातार’ का सम्बन्ध पूरे कथन से भी हो सकता है: “हम तुम सबके लिए सदा परमेश्वर को लगातार धन्यवाद देते हैं।” मूल यूनानी में यह स्पष्ट नहीं है कि ‘लगातार’ विशेष रूप से प्रार्थनाओं में स्मरण करने से जुड़ता है या पूरे धन्यवाद-वचन से।'
    reason: ἀδιαλείπτως के सम्बन्ध की वास्तविक वाक्यगत अस्पष्टता को स्पष्ट और अर्थपूर्ण ढंग से सुरक्षित रखना।
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: हम ... धन्यवाद देते हैं
  rationale: वर्तमानकालीन प्रथम पुरुष बहुवचन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और कृतज्ञता के प्राप्तकर्ता परमेश्वर को स्पष्ट रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: सम्प्रदान कारक धन्यवाद के प्राप्तकर्ता को सूचित करता है।
- source_word: πάντοτε
  choice: सदा
  rationale: πάντοτε के कालवाचक अर्थ को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: περὶ πάντων ὑμῶν
  choice: तुम सबके लिए
  rationale: περί के सम्बन्ध अथवा सरोकार के भाव और πάντων की समावेशी व्यापकता को प्रार्थना-धन्यवाद के स्वाभाविक हिन्दी मुहावरे में बनाए रखता है।
- source_word: μνείαν ποιούμενοι
  choice: तुम्हें ... याद करते हैं
  rationale: इस यूनानी मुहावरे का आशय प्रार्थना में उनका स्मरण करने से है; शाब्दिक ‘उल्लेख करते हैं’ की अपेक्षा यह साधारण आधुनिक हिन्दी में अधिक स्वाभाविक है। ‘तुम्हें’ का कर्म प्रसंग से प्राप्त होता है।
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: अपनी प्रार्थनाओं में
  rationale: इस प्रसंग में ἐπί सहित वाक्यांश का स्वाभाविक हिन्दी अर्थ प्रार्थना करते समय अथवा प्रार्थनाओं में है।
- source_word: ἀδιαλείπτως
  choice: लगातार
  rationale: यह निरन्तर और बार-बार बने रहने वाली क्रिया का प्रबल भाव देता है, बिना इसे हर क्षण अक्षरशः चलने वाली क्रिया के रूप में अनावश्यक रूप से कठोर किए।
theological_decisions:
- issue: ἀδιαλείπτως किस क्रिया से जुड़ता है
  choice: मुख्य पाठ में इसे प्रार्थनाओं में स्मरण करने से जोड़ा गया है
  alternative: 'यह पूरे धन्यवाद-वाक्य को विशेषित कर सकता है: ‘हम लगातार तुम सबके लिए सदा परमेश्वर को धन्यवाद देते हैं।’'
  rationale: यूनानी में पद का स्थान अगले पद के साथ वाक्य-विभाजन के कारण व्याकरणिक रूप से संदिग्ध है। निकटस्थ कृदन्त-वाक्यांश से जोड़ना स्वाभाविक है, पर व्यापक धन्यवाद-वचन से इसका सम्बन्ध भी सम्भव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। भाषा सरल, गरिमापूर्ण और कलीसियाई पाठ के योग्य रखी गई है।
