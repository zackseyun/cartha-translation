id: 1JN.2.4
reference: 1 John 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: hi
  text: जो कोई कहता है, “मैं उसे जान चुका हूँ,”[a] लेकिन उसकी आज्ञाओं का पालन नहीं करता, वह झूठा है, और उसमें सत्य नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मैं उसे जानता हूँ।” यूनानी पूर्णकाल का अनुवाद इस सरल रूप में भी किया जा सकता है; “जान चुका हूँ” पहले जानने से उत्पन्न वर्तमान संबंध के भाव को अधिक स्पष्ट करता है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “इस व्यक्ति में” या “ऐसे व्यक्ति में सत्य नहीं है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: जो कोई कहता है
  rationale: विशेषणवत् प्रयुक्त वर्तमान कृदंत यहाँ सामान्य रूप से ऐसे प्रत्येक व्यक्ति को दर्शाता है जो यह दावा करता है; यह हिंदी में स्वाभाविक और लिंग-निरपेक्ष है।
- source_word: Ἔγνωκα
  choice: मैं उसे जान गया हूँ
  rationale: γινώσκω का पूर्णकाल पहले आरंभ हुए जानने के परिणामस्वरूप वर्तमान संबंध या अवस्था को व्यक्त करता है। ‘जान गया हूँ’ इस पक्ष को केवल ‘जानता हूँ’ से अधिक स्पष्ट रखता है।
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: उसकी आज्ञाओं
  rationale: ‘आज्ञाएँ’ यूहन्नाई प्रयोग में ἐντολή की धार्मिक और अंतरपाठीय गंभीरता बनाए रखती हैं।
- source_word: μὴ τηρῶν
  choice: पालन नहीं करता
  rationale: वर्तमान कृदंत निरंतर या चरित्रगत असफलता बताता है। हिंदी में ‘आज्ञाओं का पालन करना’ τηρέω के ‘मानना/बनाए रखना’ भाव का स्वाभाविक रूप है।
- source_word: ψεύστης
  choice: झूठा
  rationale: मूल में विधेय संज्ञा द्वारा व्यक्ति का सीधा नैतिक चरित्रांकन है; ‘झूठा’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν
  choice: उसमें सत्य नहीं है
  rationale: τούτῳ पूर्वोक्त व्यक्ति की ओर संकेत करता है और ‘सत्य’ यूहन्नाई प्रयोग की वैचारिक तथा नैतिक व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: αὐτόν / αὐτοῦ का संदर्भ
  choice: सर्वनाम ‘उसे/उसकी’ रखा गया है
  alternative: संदर्भ को स्पष्ट करके ‘परमेश्वर’ या ‘मसीह’ कहना
  rationale: निकट संदर्भ में संकेत परमेश्वर की ओर सबसे स्वाभाविक है, पर यूहन्नाई धर्मविज्ञान में पिता और पुत्र का घनिष्ठ संबंध है। मूल के सर्वनाम बनाए रखने से पाठ की वास्तविक अस्पष्टता अनावश्यक रूप से हल नहीं होती।
- issue: यूहन्नाई ‘जानने’ की शक्ति
  choice: ‘जान गया हूँ’—पूर्व परिचय से उत्पन्न वर्तमान संबंध
  alternative: ‘जानता हूँ’—सरल वर्तमान ज्ञान
  rationale: पूर्णकाल केवल बौद्धिक जानकारी नहीं, बल्कि प्राप्त और अब भी विद्यमान ज्ञान-संबंध का दावा दर्शाता है; फिर भी अनुवाद किसी विशेष रहस्यवादी अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘जो कोई’ सामान्य एकवचन को स्वाभाविक ढंग से व्यक्त करता है; ‘आज्ञाओं का पालन’ सामान्य पाठक के लिए स्पष्ट है और मूल क्रिया के अर्थ को अत्यधिक शाब्दिक बनाए बिना सुरक्षित रखता है।
