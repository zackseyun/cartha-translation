source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: hi
  text: बच्चों, यह अंतिम घड़ी है। और जैसा तुमने सुना था कि मसीह-विरोधी[a] आ रहा है, अब बहुत-से मसीह-विरोधी प्रकट हो चुके हैं[b]। इसी से हम जानते हैं कि यह अंतिम घड़ी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे किसी प्रत्याशित विशिष्ट व्यक्ति के रूप में भी समझा जा सकता है: ‘वह मसीह-विरोधी आ रहा है।’ यूनानी में ‘मसीह-विरोधी’ के साथ निश्चित उपपद नहीं है।'
    reason: alternative_reading
  - marker: b
    text: या ‘उठ खड़े हुए हैं’ अथवा ‘आ चुके हैं।’ यूनानी पूर्ण काल इस बात पर बल देता है कि बहुत-से मसीह-विरोधी प्रकट हो चुके हैं और अब उपस्थित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: बच्चो
  rationale: यह सम्बोधन आत्मीय और पारिवारिक भाव रखता है। आधुनिक हिन्दी में ‘बच्चो’ स्वाभाविक है और अनावश्यक रूप से अधिक लाड़सूचक अर्थ नहीं जोड़ता।
- source_word: ἐσχάτη ὥρα
  choice: अन्तिम घड़ी
  rationale: मूल के काल-सूचक रूपक को सीधे बनाए रखता है और इसे न तो ठीक साठ मिनट की अवधि बनाता है, न किसी विशिष्ट अन्त-काल पद्धति में सीमित करता है।
- source_word: καθὼς ἠκούσατε
  choice: जैसा तुमने सुना था
  rationale: पाठकों को पहले मिली शिक्षा की ओर संकेत करता है और καθὼς का तुलनात्मक सम्बन्ध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀντίχριστος
  choice: मसीह-विरोधी
  rationale: यूहन्ना के विशिष्ट शब्द का अर्थ स्पष्ट करता है और एकवचन तथा आगे आने वाले बहुवचन के बीच शब्दगत सम्बन्ध बनाए रखता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: वर्तमान काल में व्यक्त प्रत्याशित आगमन को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: καὶ νῦν
  choice: वैसे ही अब
  rationale: पहले सुनी हुई प्रत्याशा और वर्तमान में दिखाई देने वाली बहुलता के बीच सम्बन्ध तथा बल को प्रकट करता है।
- source_word: ἀντίχριστοι πολλοὶ
  choice: बहुत-से मसीह-विरोधी
  rationale: मूल के बहुवचन को सीधे रखता है और पहले आए एकवचन ‘मसीह-विरोधी’ से उसका स्पष्ट सम्बन्ध बनाए रखता है।
- source_word: γεγόνασιν
  choice: उठ खड़े हुए हैं
  rationale: पूर्ण काल में निहित यह भाव व्यक्त करता है कि वे प्रकट हो चुके हैं और अब उपस्थित हैं।
- source_word: ὅθεν γινώσκομεν
  choice: इसी से हम जानते हैं
  rationale: पिछली बात को उस निष्कर्ष का प्रमाण बताता है जिसे लेखक और पाठक पहचानते हैं।
theological_decisions:
- issue: ‘अन्तिम घड़ी’ का अर्थ
  choice: मूल काल-सूचक और अन्त-काल सम्बन्धी रूपक ‘अन्तिम घड़ी’ को यथावत रखना
  alternative: इसे केवल बहुत निकट का कालानुक्रमिक क्षण या केवल संकट की आलंकारिक अभिव्यक्ति बताना
  rationale: सन्दर्भ निर्णायक अन्तिम चरण का संकेत देता है, पर अनुवाद को इसकी अवधि या विस्तृत अन्त-काल व्यवस्था निश्चित नहीं करनी चाहिए।
- issue: एकवचन ‘मसीह-विरोधी’ और बहुवचन ‘मसीह-विरोधी’ का सम्बन्ध
  choice: प्रत्याशित एकवचन और वर्तमान बहुवचन दोनों को बिना मिलाए बनाए रखना
  alternative: एकवचन को केवल सामान्य श्रेणी या स्पष्ट रूप से परिभाषित एक ही व्यक्ति के रूप में अनुवाद करना
  rationale: लेखक जानबूझकर पहले सुनी हुई एकवचन प्रत्याशा को अब उपस्थित अनेक मसीह-विरोधियों के साथ रखता है; अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बच्चो’ आत्मीय पासबानी सम्बोधन है; ‘मसीह-विरोधी’ पारदर्शी धार्मिक पद है। वाक्य-विन्यास मूल के तर्क और एकवचन-बहुवचन विरोध को स्पष्ट रखता है।
