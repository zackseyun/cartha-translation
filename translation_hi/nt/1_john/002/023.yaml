    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: जो कोई … इनकार करता है
  rationale: यह पदबंध सामान्य और सार्वभौमिक अर्थ वाला संज्ञात्मक वर्तमान कृदंत है। ‘जो कोई’ स्वाभाविक हिन्दी में उसके व्यापक दायरे को बनाए रखता है।
- source_word: ἀρνούμενος
  choice: इनकार करता है
  rationale: यह मसीह के विषय में कथन को नकारने या अस्वीकार करने के अंगीकार-संबंधी अर्थ को व्यक्त करता है; ‘इनकार’ मूल के निकट और सामान्य हिन्दी में स्पष्ट है।
- source_word: τὸν υἱὸν
  choice: पुत्र
  rationale: यूनानी पाठ में केवल निश्चित मसीही उपाधि ‘पुत्र’ है; ‘परमेश्वर का पुत्र’ जोड़ना अनावश्यक विस्तार होता।
- source_word: οὐδὲ τὸν πατέρα ἔχει
  choice: उसके पास पिता भी नहीं है
  rationale: ‘भी नहीं’ οὐδὲ के सह-संबंधी निषेध को स्वाभाविक हिन्दी में व्यक्त करता है। ‘उसके पास … है’ ἔχει की जानबूझकर रखी गई यूहन्नाई अभिव्यक्ति को किसी विशिष्ट संबंधपरक व्याख्या में नहीं बदलता।
- source_word: ὁ ὁμολογῶν
  choice: जो … स्वीकार करता है
  rationale: ὁμολογέω यहाँ पुत्र को स्पष्ट रूप से मानने और अंगीकार करने का अर्थ देता है। आधुनिक सामान्य हिन्दी में ‘स्वीकार करता है’ सहज है और केवल निजी जानकारी मान लेने तक सीमित नहीं है।
- source_word: καὶ τὸν πατέρα ἔχει
  choice: उसके पास पिता भी है
  rationale: '‘भी’ विरोधी समानांतरता को स्पष्ट करता है: पुत्र को स्वीकार करने वाले के पास पिता भी है।'
theological_decisions:
- issue: मुद्रित यूनानी पाठ में कोष्ठकित दूसरा उपवाक्य
  choice: 'मुख्य पाठ में शामिल: ‘जो पुत्र को स्वीकार करता है, उसके पास पिता भी है।’'
  alternative: कुछ हस्तलिपियों के अनुसार दूसरे उपवाक्य को छोड़ देना।
  rationale: दिया गया SBLGNT पाठ इस उपवाक्य को पाठ में रखता है, यद्यपि चिह्नों द्वारा पाठांतर बताता है। इसलिए इसे मुख्य पाठ में अनूदित किया गया और हस्तलिपीय भिन्नता पादटिप्पणी में दी गई।
- issue: ‘पिता को रखना/पिता का होना’ की संबंधपरक शक्ति
  choice: ἔχει को ‘उसके पास पिता … है’ के रूप में बनाए रखना।
  alternative: ‘पिता के साथ संगति है’ या ‘वह पिता का है’ जैसी व्याख्यात्मक भाषा।
  rationale: मूल कथन पुत्र के अंगीकार और पिता को पाने की अविभाज्यता को तीखे ढंग से रखता है। किसी एक संबंधपरक श्रेणी में अर्थ सीमित न करके यूहन्नाई मुहावरे और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया है।
