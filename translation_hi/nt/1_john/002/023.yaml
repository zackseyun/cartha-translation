  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘पुत्र’ और ‘पिता’ को निश्चित मसीही उपाधियों के रूप में रखा गया है। पादटिप्पणी-चिह्न संबंधित पाठांतर वाले दूसरे उपवाक्य के बाद लगाया गया है।
