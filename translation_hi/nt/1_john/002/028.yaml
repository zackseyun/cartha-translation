source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: hi
  text: और अब, प्यारे बच्चो, उसमें बने रहो, ताकि यदि वह प्रकट हो[a], तो हमें निर्भीकता मिले और हम उसके आगमन पर लज्जित होकर उससे दूर न हटें[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह प्रकट दिखाई दे।” यूनानी क्रिया कर्मवाच्य है; अधिक शाब्दिक रूप से, “यदि वह प्रकट किया जाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके सामने लज्जित न हों।” वाक्यांश को उसकी उपस्थिति में लज्जा अनुभव करने के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “उसकी उपस्थिति में।” यहाँ “आगमन” यूनानी शब्द के अंतकालीन अर्थ को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: प्यारे बच्चो
  rationale: यह स्नेहपूर्ण संबोधन है। ‘प्यारे बच्चो’ आधुनिक हिन्दी में आत्मीयता और पारिवारिक भाव व्यक्त करता है; केवल ‘बच्चो’ से इसका स्नेहपूर्ण बल कुछ कम हो जाता।
- source_word: μένετε ἐν αὐτῷ
  choice: उसमें बने रहो
  rationale: यह यूहन्ना की प्रमुख संबंधपरक अभिव्यक्ति को बिना अनावश्यक व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἐὰν φανερωθῇ
  choice: जब वह प्रकट हो
  rationale: संदर्भ भविष्य में मसीह के प्रकट होने की ओर संकेत करता है। हिन्दी में ‘जब’ स्वाभाविक है; यूनानी ἐάν की शाब्दिक शर्तात्मकता के लिए पादटिप्पणी दी गई है और passive रूप की वैकल्पिक अभिव्यक्ति भी सुरक्षित रखी गई है।
- source_word: σχῶμεν παρρησίαν
  choice: हम भरोसे के साथ उसके सामने खड़े हो सकें
  rationale: παρρησία यहाँ निर्भीक खुलेपन और विश्वास को व्यक्त करता है। हिन्दी में यह वाक्यांश भाव को स्वाभाविक ढंग से सामने लाता है; ‘खड़े हो सकें’ निहित संदर्भ को स्पष्ट करता है।
- source_word: μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: लज्जित होकर उससे दूर न हटें
  rationale: यह αἰσχύνομαι की लज्जा और ἀπό के ‘उससे दूर’ भाव, दोनों को व्यक्त करता है, बिना इसे न्यायिक दण्ड या अंतिम दोषसिद्धि मान लेने के।
- source_word: παρουσίᾳ
  choice: आगमन
  rationale: इस अंतकालीन संदर्भ में παρουσία मसीह के भावी आने को सूचित करता है। ‘आगमन’ dignified और स्पष्ट है; ‘उपस्थिति’ अधिक शाब्दिक विकल्प है।
theological_decisions:
- issue: सर्वनामों का संदर्भ और भावी प्रकटीकरण
  choice: सर्वनाम का संदर्भ प्रसंगानुसार पुत्र/यीशु मसीह से है और वाक्य उसके भावी प्रकटीकरण तथा आगमन की बात करता है।
  alternative: सर्वनाम को सामान्य रूप से परमेश्वर के लिए समझना।
  rationale: निकटवर्ती प्रसंग पुत्र में बने रहने और उसके प्रकट होने पर केन्द्रित है। अनुवाद नाम जोड़कर अस्पष्टता को कृत्रिम रूप से समाप्त नहीं करता।
- issue: आगमन के समय लज्जा का अर्थ
  choice: लज्जा के कारण उससे दूर हटने का संबंधपरक चित्र।
  alternative: केवल ‘उसके सामने लज्जित हों’ या ‘उसके द्वारा लज्जित किए जाएँ।’
  rationale: ἀπ’ αὐτοῦ दूरी या पीछे हटने की छाया देता है। फिर भी यह न्यायिक दोषसिद्धि को अनिवार्य नहीं बनाता; वैकल्पिक समझ पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्नेहपूर्ण प्रेरितिक संबोधन और गरिमापूर्ण अंतकालीन भाषा। मुख्य पाठ प्रवाहपूर्ण रखा गया है, जबकि यूनानी कर्मवाच्य, शर्तात्मक रूप और παρουσία की ‘उपस्थिति’ वाली छाया पादटिप्पणियों में सुरक्षित हैं।
