  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: hi
  text: मैंने ये बातें तुम्हें उन लोगों के विषय में लिखी हैं जो तुम्हें भटकाने की कोशिश कर रहे हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो तुम्हें भटका रहे हैं’ अथवा ‘जो तुम्हें धोखा दे रहे हैं।’ यूनानी कृदंत सक्रिय छल या भटकाने की कोशिश—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पूर्ववर्ती लिखित बातों की ओर संकेत करता है; आधुनिक हिन्दी में ‘ये बातें’ स्वाभाविक है।
- source_word: ἔγραψα
  choice: मैंने ... लिखी हैं
  rationale: यूनानी अओरिस्ट पूर्ण किए गए लेखन को बताता है; पत्र-संदर्भ में हिन्दी का पूर्ण पक्ष वर्तमान प्रासंगिकता सहित स्वाभाविक है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: समुदाय को संबोधित बहुवचन सर्वनाम के लिए सामान्य और स्पष्ट हिन्दी रूप।
- source_word: περὶ
  choice: के विषय में
  rationale: लेखन के विषय को प्रस्तुत करता है और गरिमापूर्ण आधुनिक हिन्दी में स्पष्ट है।
- source_word: τῶν πλανώντων ὑμᾶς
  choice: जो तुम्हें भटकाने की कोशिश कर रहे हैं
  rationale: πλανάω के पथ से हटाने वाले बिंब को ‘भटकाना’ बनाए रखता है। ‘कोशिश’ विरोधियों की जारी गतिविधि और उद्देश्य व्यक्त करती है, बिना यह निश्चित किए कि वे सफल हो चुके हैं।
theological_decisions:
- issue: क्या πλανώντων सफल छल को बताता है या भटकाने की जारी कोशिश को
  choice: जो तुम्हें भटकाने की कोशिश कर रहे हैं
  alternative: जो तुम्हें भटका रहे हैं / जो तुम्हें धोखा देते हैं
  rationale: कृदंत उन लोगों को पाठकों की ओर निर्देशित उनकी गतिविधि से पहचानता है, पर उनकी सफलता अनिवार्य नहीं करता। चुना हुआ रूप इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामुदायिक बहुवचन संबोधन। ‘भटकाना’ मूल यूनानी के दिशात्मक बिंब को बनाए रखता है।
