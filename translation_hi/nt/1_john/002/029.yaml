  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: hi
  text: यदि तुम जानते हो कि वह धर्मी है,[a] तो तुम जानते हो कि हर वह व्यक्ति जो धार्मिकता का आचरण करता है, उससे जन्मा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘वह’ परमेश्वर पिता या पुत्र की ओर संकेत कर सकता है; यूनानी पाठ इस पद में संदर्भ को स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: या ‘उसमें से जन्मा है।’ यूनानी अभिव्यक्ति उद्गम बताती है और इसका अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: यदि तुम जानते हो
  rationale: शर्तसूचक ἐὰν और οἶδα के रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δίκαιός
  choice: धर्मी
  rationale: यह व्यक्ति के नैतिक चरित्र को दर्शाता है और इसी वाक्य के δικαιοσύνη से शब्दार्थिक संबंध बनाए रखता है।
- source_word: γινώσκετε
  choice: तो तुम जानते हो
  rationale: रूप को आज्ञार्थक के बजाय कथन के रूप में लिया गया है; पहले क्रियापद के साथ समानांतरता भी बनी रहती है।
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: हर वह व्यक्ति जो धार्मिकता पर चलता है
  rationale: वर्तमान कृदंत की निरंतर अथवा चरित्रगत जीवन-रीति को सहज हिन्दी में व्यक्त करता है; केवल एक काम करने का भाव नहीं देता।
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: उससे जन्मा है
  rationale: ἐξ को उद्गम के अर्थ में और पूर्ण निष्क्रिय γεγέννηται को घटित जन्म के वर्तमान परिणाम सहित व्यक्त करता है।
theological_decisions:
- issue: δίκαιός ἐστιν और ἐξ αὐτοῦ में सर्वनाम का संदर्भ
  choice: ‘वह/उससे’ रखकर संदर्भ अनिर्दिष्ट रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर पिता’ या ‘पुत्र’ कहना
  rationale: निकटवर्ती प्रसंग में दोनों संदर्भों पर विचार संभव है, जबकि यूनानी वाक्य इस पद में नाम स्पष्ट नहीं करता। इसलिए मूल की धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संबोधन रखा गया है। ‘धर्मी/धार्मिकता’ से संबंधित यूनानी शब्दों का संबंध दिखाई देता है, जबकि ‘धार्मिकता पर चलता है’ चरित्रगत आचरण को साधारण पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
