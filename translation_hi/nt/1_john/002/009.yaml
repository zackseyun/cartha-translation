source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: hi
  text: जो कोई कहता है कि वह ज्योति में है, और अपने भाई से घृणा करता है, वह अब तक अंधकार में है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने भाई या बहन से।” यूनानी में पुल्लिंग एकवचन “भाई” है, जो इस नैतिक संदर्भ में प्रतिनिधि रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: जो कोई कहता है
  rationale: निश्चित लेख के साथ वर्तमान कृदंत यहाँ संज्ञा की तरह प्रयुक्त होकर एक प्रतिनिधि व्यक्ति को दर्शाता है। यह हिंदी में स्वाभाविक है और कथन को सामान्य नैतिक सिद्धांत के रूप में व्यक्त करता है।
- source_word: ἐν τῷ φωτὶ
  choice: ज्योति में
  rationale: यह स्थानवाचक रूपक यूहन्ना की ज्योति-अंधकार की प्रमुख छवि को सुरक्षित रखता है; ‘ज्योति’ गरिमापूर्ण और प्रचलित बाइबलीय हिंदी है।
- source_word: εἶναι
  choice: कि वह ... में है
  rationale: अप्रत्यक्ष कथन को स्वाभाविक हिंदी में व्यक्त करने के लिए εἶναι को सीमित क्रिया ‘है’ के रूप में प्रस्तुत किया गया है।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई से
  rationale: यूनानी में पुल्लिंग एकवचन ‘भाई’ है। ‘अपने’ कर्ता के साथ संबंध स्पष्ट करता है, और परसर्ग ‘से’ हिंदी में ‘घृणा करना’ की स्वाभाविक संरचना है। संदर्भगत समावेशी अर्थ को पादटिप्पणी में रखा गया है।
- source_word: μισῶν
  choice: घृणा करता है
  rationale: वर्तमान कृदंत निरंतर या चरित्रगत मनोवृत्ति व्यक्त करता है। हिंदी का सामान्य वर्तमान काल इस अर्थ को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: ἐν τῇ σκοτίᾳ
  choice: अंधकार में
  rationale: यह ‘ज्योति में’ के समानांतर है और यूहन्ना के नैतिक-आत्मिक विरोध को बनाए रखता है।
- source_word: ἕως ἄρτι
  choice: अब तक
  rationale: यह वाक्यांश वर्तमान क्षण तक बनी हुई अवस्था पर बल देता है; ‘अब तक’ इसका सीधा और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: प्रतिनिधि एकवचन नैतिक कथन में ἀδελφός का अनुवाद
  choice: भाई
  alternative: भाई या बहन; संगी विश्वासी
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग एकवचन को सुरक्षित रखा गया है। फिर भी इस नैतिक संदर्भ में शब्द प्रतिनिधि रूप से स्त्री-पुरुष दोनों को समेट सकता है, इसलिए वह संभावना पादटिप्पणी में स्पष्ट की गई है। ‘संगी विश्वासी’ संदर्भानुकूल हो सकता है, पर मुख्य पाठ के लिए अधिक व्याख्यात्मक है।
- issue: ज्योति और अंधकार का स्वरूप
  choice: रूपकों को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: सत्य/धार्मिकता में; पाप/भ्रम में
  rationale: मूल पाठ जानबूझकर यूहन्ना की प्रतीकात्मक भाषा का उपयोग करता है। उसे किसी एक धर्मवैज्ञानिक व्याख्या में सीमित करना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण शैली। ‘ज्योति’ और ‘अंधकार’ यूहन्ना की साहित्यिक छवि तथा परस्पर समानांतरता को सुरक्षित रखते हैं। मुख्य पाठ में मूल की प्रतिनिधि पुल्लिंग एकवचन संरचना रखी गई है और संभावित समावेशी अर्थ पादटिप्पणी में दिया गया है।
