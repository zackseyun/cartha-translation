id: 1JN.2.27
reference: 1 John 2:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: hi
  text: और जहाँ तक तुम्हारी बात है, जो अभिषेक तुमने उससे पाया था, वह तुममें बना रहता है[b]; और तुम्हें इसकी आवश्यकता नहीं कि कोई तुम्हें सिखाए। बल्कि उसका अभिषेक तुम्हें सब बातों के विषय में सिखाता है; वह सच्चा है और झूठ नहीं है। और जैसा उसने तुम्हें सिखाया, तुम उसमें बने रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जैसा उसने तुम्हें सिखाया, तुम उसमें बने रहते हो।”
    reason: textual_variant
  - marker: b
    text: “बना रहता है” और “बने रहो” दोनों के लिए यूनानी में एक ही क्रिया का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: अभिषेक
  rationale: यह शब्द अभिषेक अथवा अभिषेक के पदार्थ को सूचित कर सकता है और यहाँ रूपक के रूप में प्रयुक्त है। ‘अभिषेक’ मूल रूपक को बनाए रखता है और मुख्य पाठ में इसे सीधे ‘पवित्र आत्मा’ कहकर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἀπ’ αὐτοῦ
  choice: उससे
  rationale: यूनानी पाठ में सर्वनाम है, जिसका पूर्वपद प्रसंग से समझा जाता है। ‘उससे’ उसी अनिर्दिष्टता को बनाए रखता है।
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: तुममें बना रहता है / तुम उसमें बने रहो
  rationale: ‘बना रहना’ आधुनिक हिन्दी में स्वाभाविक है और पद में μένω की पुनरावृत्ति को दोनों स्थानों पर सुरक्षित रखता है।
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: तुम्हें इसकी आवश्यकता नहीं कि कोई तुम्हें सिखाए
  rationale: यह यूनानी कथन को न तो नरम करता है, न उसे प्रसंग से काटकर सभी मानवीय शिक्षा का पूर्ण निषेध बना देता है।
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: सिखाए / सिखाता है / सिखाया है
  rationale: एक ही हिन्दी क्रिया से मूल पाठ की पुनरावृत्ति और वाक्प्रभाव सुरक्षित रहता है।
- source_word: περὶ πάντων
  choice: सब बातों के विषय में
  rationale: यह वाक्यांश की व्यापकता को बिना किसी व्याख्यात्मक सीमा के बनाए रखता है।
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: वह सच्चा है, झूठ नहीं
  rationale: यह यूहन्नाई शैली में सत्य और झूठ के तीखे विरोध को संक्षिप्त और सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: और जैसा उसने तुम्हें सिखाया है
  rationale: ‘जैसा’ अभिषेक की शिक्षा और अंतिम आग्रह के बीच मूल तुलनात्मक संबंध को बनाए रखता है।
theological_decisions:
- issue: ‘अभिषेक’ (χρῖσμα) का अभिप्राय
  choice: मुख्य पाठ में ‘अभिषेक’ रूपक को बनाए रखा गया है।
  alternative: ‘पवित्र आत्मा’ या ‘प्राप्त सन्देश’
  rationale: प्रसंग संभवतः आत्मा की अभिषेककारी और शिक्षा देने वाली उपस्थिति की ओर संकेत करता है, पर पद स्वयं ‘अभिषेक’ कहता है। इसलिए किसी एक धर्मवैज्ञानिक पहचान को पाठ में जोड़कर अस्पष्टता समाप्त नहीं की गई।
- issue: ‘कोई तुम्हें सिखाए’ की आवश्यकता न होने का कथन
  choice: कथन को उसके स्पष्ट रूप में रखा गया है।
  alternative: इसे सभी मानवीय शिक्षकों का पूर्ण निषेध मानना, या केवल अलग हुए विरोधियों की शिक्षा तक सीमित करके अनुवाद करना
  rationale: अनुवाद न तो मूल कथन को कमजोर करता है, न उससे ऐसी निरपेक्ष धर्मशिक्षा बनाता है जो यहाँ स्पष्ट रूप से नहीं कही गई; उसका आशय प्रसंग से समझा जाएगा।
- issue: अंतिम μένετε का भाव
  choice: 'आज्ञार्थक: ‘तुम उसमें बने रहो।’'
  alternative: 'वर्णनार्थक: ‘तुम उसमें बने रहते हो।’'
  rationale: इस प्रसंग में SBLGNT का रूप स्वाभाविक रूप से आग्रह के रूप में समझा जा सकता है। वैकल्पिक पाठ/समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम αὐτῷ का संदर्भ
  choice: ‘उसमें’—पुल्लिंग व्यक्तिगत संदर्भ को बनाए रखा गया है।
  alternative: ‘उस अभिषेक में’ या ‘उसमें’ को अभिषेक के संदर्भ में समझना
  rationale: यूनानी सर्वनाम पुल्लिंग है और प्रसंग में किसी व्यक्ति की ओर संकेत करने की संभावना रखता है; इसे ‘अभिषेक में’ कहकर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अभिषेक’ बाइबलीय रूपक को सुरक्षित रखता है; ‘बना रहना’ पारंपरिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। बहुवचन ‘तुम’ मूल पाठ के सामुदायिक संबोधन को दर्शाता है।
