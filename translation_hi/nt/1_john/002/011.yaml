source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: hi
  text: परन्तु जो अपने भाई से घृणा करता है, वह अन्धकार में है और अन्धकार में चलता है[a]; वह नहीं जानता कि कहाँ जा रहा है, क्योंकि अन्धकार ने उसकी आँखें अन्धी कर दी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भाई या बहन’; यूनानी पाठ में ‘भाई’ है और यहाँ सम्भवतः मसीही समुदाय के किसी सहविश्वासी की ओर संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: घृणा करता है
  rationale: वर्तमान कृदन्त यहाँ संज्ञात्मक रूप से प्रयुक्त है और किसी व्यक्ति की निरन्तर या चरित्रगत मनोवृत्ति व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: ἀδελφὸν
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग एकवचन है। यूहन्ना के सन्दर्भ में यह सामान्यतः विश्वासियों के समुदाय के किसी सह-सदस्य को सूचित करता है; व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν τῇ σκοτίᾳ
  choice: अन्धकार में
  rationale: दोनों बार एक ही अभिव्यक्ति रखकर यूनानी की पुनरावृत्ति और नैतिक-आत्मिक क्षेत्र के रूप में अन्धकार की यूहन्नाई छवि सुरक्षित रखी गई है। हिन्दी में पृथक निश्चित उपपद न होने के कारण अर्थ सन्दर्भ से व्यक्त होता है।
- source_word: περιπατεῖ
  choice: चलता है
  rationale: यह चयन आचरण या जीवन-शैली के बाइबलीय रूपक को बनाए रखता है; ‘जीता है’ अर्थ को अधिक स्पष्ट करता, पर मूल चित्र को सपाट कर देता।
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: नहीं जानता कि कहाँ जा रहा है
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और वर्तमान दिशा तथा गति की छवि को बनाए रखता है।
- source_word: ἐτύφλωσεν
  choice: ने ... अन्धी कर दी हैं
  rationale: यूनानी अओरिस्ट की घटना और उससे बनी वर्तमान दशा दोनों हिन्दी के पूर्णतासूचक प्रयोग में स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: उसकी आँखें
  rationale: यह स्वाभाविक हिन्दी स्वामित्व-रचना है और मूल की ठोस शारीरिक छवि को बनाए रखती है।
theological_decisions:
- issue: यूहन्नाई द्वैत में अन्धकार का नैतिक-आत्मिक अर्थ
  choice: σκοτία का अनुवाद रूपक को बनाए रखते हुए ‘अन्धकार’ किया गया है।
  alternative: बुराई; पाप का अन्धकार
  rationale: मूल पाठ स्वयं रूपक की व्याख्या को किसी एक संकीर्ण सिद्धान्त तक सीमित नहीं करता। ‘अन्धकार’ प्रकाश के साथ यूहन्नाई विरोध और उसकी धर्मवैचारिक गहराई सुरक्षित रखता है।
- issue: ‘भाई’ का सन्दर्भ
  choice: मुख्य पाठ में पुल्लिंग एकवचन ‘भाई’ रखा गया है और उसके सामुदायिक व्यापक आशय को पादटिप्पणी में बताया गया है।
  alternative: भाई या बहन; सहविश्वासी
  rationale: यह मूल के व्याकरणिक रूप को सुरक्षित रखता है, जबकि पादटिप्पणी सम्भावित प्रतिनिधिक अर्थ स्पष्ट करती है और पाठ में अनावश्यक व्याख्या नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’, ‘अन्धकार’ और ‘घृणा’ साहित्यिक-बाइबलीय गरिमा रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
