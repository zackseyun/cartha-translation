  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: hi
  text: जो कोई यह कहता है कि वह उसमें बना रहता है, उसे भी उसी प्रकार चलना चाहिए जैसे वह चला था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तुलना-वाक्य का अंतिम ‘वह’ यीशु की ओर संकेत करता है। यूनानी में संकेतवाचक सर्वनाम ἐκεῖνος है, जिसमें साधारण ‘वह’ से कुछ अधिक संकेत या बल हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ ‘चलना’ किसी के जीवन और आचरण के ढंग का बाइबलीय रूपक है; अर्थात उसे उसी प्रकार जीना चाहिए जैसे यीशु जिए।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: जो कोई कहता है
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत है और किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जो यह दावा करता है; आधुनिक हिन्दी में ‘जो कोई’ इस सामान्य एकवचन अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν αὐτῷ μένειν
  choice: वह उसमें बना रहता है
  rationale: μένω यूहन्ना के लेखन का प्रमुख शब्द है, जिसमें संबंध में टिके रहने और निरंतर बने रहने का भाव है। ‘बना रहता है’ इस अर्थ को सहज हिन्दी में रखता है।
- source_word: ὀφείλει
  choice: उसे चाहिए
  rationale: यह नैतिक दायित्व व्यक्त करता है। ‘उसे चाहिए’ न तो अत्यधिक कानूनी है, न मूल से अधिक कठोर।
- source_word: καθὼς
  choice: वैसे ही ... जैसे
  rationale: यह रीति और अनुरूपता की तुलना को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: संदर्भ में संकेत यीशु की ओर है। हिन्दी में ‘वह’ स्वाभाविक है; यूनानी संकेतवाचक बल को टिप्पणी में स्पष्ट किया गया है, क्योंकि मुख्य पाठ में ‘वह व्यक्ति’ कृत्रिम और अस्पष्ट सुनाई दे सकता है।
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: चला था ... चले
  rationale: ‘चलना’ जीवन-व्यवहार का बाइबलीय रूपक बनाए रखता है और दोनों यूनानी रूपों की शब्दगत पुनरावृत्ति को भी सुरक्षित रखता है।
- source_word: καὶ αὐτὸς
  choice: वह स्वयं भी
  rationale: ‘स्वयं भी’ αὐτός के कर्ता-बल और καί के समावेशी अर्थ, दोनों को व्यक्त करता है।
theological_decisions:
- issue: αὐτῷ और ἐκεῖνος का संदर्भ
  choice: दोनों को ‘उसमें’ और ‘वह’ के रूप में रखा गया है; निकट संदर्भ में संकेत यीशु मसीह की ओर है।
  alternative: स्पष्ट रूप से ‘मसीह में’ और ‘यीशु’ कहना, अथवा आदरसूचक ‘उसमें/वह’ को विशेष रूप से चिह्नित करना।
  rationale: मूल यूनानी में नाम दोहराया नहीं गया और ईश्वर-संबंधी सर्वनामों के लिए कोई विशेष अक्षरांकन नहीं है। संदर्भ यीशु को सूचित करता है, पर अनुवाद मूल की सर्वनामिक अभिव्यक्ति और उसकी संदर्भगत पहचान को बनाए रखता है।
- issue: ‘चलना’ रूपक का अर्थ
  choice: मुख्य पाठ में ‘चले’ रूपक को बनाए रखा गया है।
  alternative: ‘जीवन बिताए’ या ‘वैसा ही जीवन जिए’ कहना।
  rationale: यूनानी περιπατέω यहाँ जीवन-व्यवहार का नैतिक रूपक है। इसे रखना बाइबलीय शब्द-संबंधों को सुरक्षित करता है, जबकि पादटिप्पणी साधारण पाठक के लिए अर्थ स्पष्ट करती है।
- issue: सामान्य पुल्लिंग एकवचन
  choice: ‘जो कोई ... वह’ के रूप में सामान्य एकवचन रखा गया है।
  alternative: बहुवचन ‘जो लोग ... वे’ करना।
  rationale: यूनानी व्याकरणिक रूप एकवचन है, पर उसका आशय सामान्य है। हिन्दी का ‘जो कोई’ लिंग-समावेशी सामान्य अर्थ देते हुए एकवचन संरचना को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बना रहता है’ यूहन्नाई μένω की निरंतरता और संबंधपरकता को व्यक्त करता है। ‘चलना’ रूपक मुख्य पाठ में सुरक्षित है, और उसके अर्थ को पादटिप्पणी में खोला गया है।
