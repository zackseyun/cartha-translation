  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: hi
  text: झूठा कौन है, सिवाय उसके जो इस बात से इनकार करता है कि यीशु मसीह है? यही मसीह-विरोधी है—वह जो पिता और पुत्र का इनकार करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी पद ὁ χριστός यहाँ नाम के बजाय उपाधि के रूप में प्रयुक्त हुआ है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी में इस पद के साथ निश्चित उपपद है: “वह मसीह-विरोधी।” मुख्य पाठ में ‘यही’ उस पहचानकारी बल को व्यक्त करता है। यूहन्ना के पत्रों में यह पद पिता और पुत्र का इनकार करने वाले विरोधी व्यक्ति अथवा ऐसे विरोधी प्रकार को सूचित कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: झूठा
  rationale: संज्ञा के साथ निश्चित उपपद इसे केवल किसी झूठ बोलने वाले के बजाय इस प्रसंग में विशिष्ट रूप से पहचाने गए ‘झूठे’ के रूप में प्रस्तुत करता है।
- source_word: ἀρνούμενος
  choice: जो ... से इनकार करता है
  rationale: वर्तमानकालिक कृदंत व्यक्ति की निरंतर या चरित्रगत अस्वीकृति बताता है; यह हिंदी में स्वाभाविक और अर्थपूर्ण है।
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: कि यीशु मसीह है—इस बात से इनकार करता है
  rationale: 'यूनानी वाक्यांश इनकार की विषय-वस्तु है: वह ‘यीशु मसीह नहीं है’ का दावा करता है। हिंदी में सकारात्मक आश्रित कथन के साथ ‘इस बात से इनकार’ वही अर्थ स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में पहचानी जाने वाली अर्थवाही उपाधि है।
- source_word: ἀντίχριστος
  choice: मसीह-विरोधी
  rationale: यह चयन यूनानी पद का अर्थ पारदर्शी रखता है और हिंदी पाठक को मसीह का विरोध करने वाले व्यक्ति या प्रकार की पहचान समझाता है; निश्चितता ‘यही ... है’ से व्यक्त होती है।
- source_word: πατέρα
  choice: पिता
  rationale: पुत्र के साथ संबंध में यह परमेश्वर पिता को सूचित करता है; हिंदी धार्मिक प्रयोग में यह संबोधन स्पष्ट है।
- source_word: υἱόν
  choice: पुत्र
  rationale: पिता-पुत्र संबंध में विशिष्ट पुत्र का संकेत है; ‘पुत्र’ मूल संबंधपरक उपाधि को बनाए रखता है।
- source_word: οὗτός ἐστιν
  choice: यही ... है
  rationale: ‘यही’ पहले वर्णित व्यक्ति की ओर लौटकर जोरदार पहचान कराता है और यूनानी संकेतवाचक की शक्ति को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: Χριστός को मसीही स्वीकारोक्ति/इनकार के सूत्र में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός नाम की तरह नहीं, उपाधि की तरह काम करता है। ‘मसीह’ उस उपाधि और उससे जुड़े प्रतिज्ञात अभिषिक्त जन के दावे को हिंदी में सुरक्षित रखता है।
- issue: ἀντίχριστος का संदर्भ
  choice: मसीह-विरोधी
  alternative: मसीह-विरोधी व्यक्ति / ख्रीस्त-विरोधी
  rationale: ‘यही’ यूनानी निश्चित उपपद की पहचानकारी शक्ति बनाए रखता है। पद को किसी एक अंतिम-कालीन व्यक्ति तक सीमित नहीं किया गया, क्योंकि यूहन्ना के पत्रों में यह विरोधी प्रकार या प्रतिनिधि को भी सूचित कर सकता है।
- issue: पिता और पुत्र का इनकार
  choice: पिता और पुत्र से इनकार करता है
  alternative: पिता और पुत्र को नकारता है
  rationale: ‘से इनकार’ संबंधपरक अस्वीकृति और कथनात्मक नकार—दोनों की संभावित छाया बनाए रखता है, बिना उस तनाव को किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ में सीमित किए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रश्न की वादात्मक तीव्रता के लिए ‘झूठा कौन है, सिवाय उसके...’ और पहचान के जोर के लिए ‘यही’ चुना गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
