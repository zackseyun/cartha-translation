source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: hi
  text: तुमने आरम्भ से जो सुना है[a], वह तुम में बना रहे। यदि तुमने आरम्भ से जो सुना है, वह तुम में बना रहे, तो तुम भी पुत्र में और पिता में बने रहोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो तुमने आरम्भ से सुना है।” “जो” व्यापक है; प्रसंग में यह सम्भवतः पुत्र के विषय में आरम्भिक प्रेरितीय सन्देश की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “बना रहे” और “बने रहोगे” यूनानी की एक ही क्रिया के रूप हैं; इस पद में उसका प्रयोग एकरूप रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: पर तुम
  rationale: वाक्य के आरम्भ में आया सर्वनाम बल और प्रसंगगत विरोध प्रकट करता है। हिन्दी में “पर तुम” पिछले संदर्भ से यह विरोध स्वाभाविक रूप से जोड़ता है।
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: तुमने आरम्भ से जो सुना है
  rationale: नपुंसकलिंग सम्बन्धवाचक ὃ को व्यापक “जो” से व्यक्त किया गया है; मुख्य पाठ में “सन्देश” या “सुसमाचार” जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: ἐν ὑμῖν μενέτω
  choice: वह तुम में बना रहे
  rationale: वर्तमान आज्ञार्थक निरन्तर बने रहने का आह्वान करता है। “बना रहे” आधुनिक हिन्दी में सहज है और μένω की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: यदि ... वह तुम में बना रहता है
  rationale: ἐάν के साथ सम्भावनार्थक शर्त को सीधे “यदि” से व्यक्त किया गया है और उसी क्रिया के लिए “बना रहता है” रखा गया है।
- source_word: καὶ ὑμεῖς
  choice: तो तुम भी
  rationale: “भी” καί का समावेशी बल और स्पष्ट सर्वनाम का जोर बनाए रखता है; “तो” हिन्दी में शर्त के परिणाम को स्वाभाविक ढंग से चिह्नित करता है।
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: पुत्र में और पिता में
  rationale: दोनों सम्बन्धों के साथ आए ἐν को “में” दोहराकर यूनानी समानान्तरता और सम्बन्धपरक भाषा बनाए रखी गई है।
- source_word: μενεῖτε
  choice: बने रहोगे
  rationale: भविष्यत् सूचक रूप को सीधे भविष्यकाल में अनूदित किया गया है और μένω के पिछले दोनों प्रयोगों से शब्दगत सम्बन्ध रखा गया है।
theological_decisions:
- issue: अन्तिम उपवाक्य में शर्त और प्रतिज्ञा का सम्बन्ध
  choice: “तो तुम भी पुत्र में और पिता में बने रहोगे” के रूप में भविष्यकाल को सीधे सुरक्षित रखा गया है।
  alternative: इसे केवल आज्ञा या बाद के किसी विशिष्ट सिद्धान्तगत ढाँचे में दृढ़ता के प्रमाण के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ आरम्भिक सुनी हुई बात के बने रहने से जुड़ा शर्तात्मक कथन देता है। अनुवाद इस तनाव को बनाए रखता है और धैर्य, आश्वासन या एकता पर किसी साम्प्रदायिक निष्कर्ष को नहीं जोड़ता।
- issue: “आरम्भ से जो सुना” का आशय
  choice: मुख्य पाठ में व्यापक “जो सुना” रखा गया है।
  alternative: “सुसमाचार” या “प्रेरितों का सन्देश” स्पष्ट रूप से जोड़ना।
  rationale: प्रसंग सम्भवतः पुत्र के विषय में आरम्भिक प्रेरितीय घोषणा की ओर संकेत करता है, पर यूनानी पाठ स्वयं केवल सम्बन्धवाचक सर्वनाम से इसे व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। “बना रहना” को पूरे पद में एकरूप रखा गया है, जबकि वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित है।
