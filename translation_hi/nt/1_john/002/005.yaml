id: 1JN.2.5
reference: 1 John 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: hi
  text: 'परन्तु जो कोई उसके वचन का पालन करता है, उसमें[a] सचमुच परमेश्वर का प्रेम[b] पूर्णता तक पहुँच गया है। इसी से हम जानते हैं कि हम उसमें हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अनुवाद ‘इसमें’ या ‘इस व्यक्ति में’ भी हो सकता है। यह पदबंध वचन का पालन करने वाले व्यक्ति की ओर, अथवा इस बात को प्रमाण मानने की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘परमेश्वर का प्रेम’ का अर्थ परमेश्वर का उसके प्रति प्रेम, अथवा उसका परमेश्वर के प्रति प्रेम हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: परन्तु जो कोई
  rationale: δέ पिछले कथन के साथ हल्का विरोध दिखाता है, और ὃς ἂν सामान्य तथा अनिश्चित शर्त व्यक्त करता है—‘जो कोई।’
- source_word: τηρῇ
  choice: पालन करता है
  rationale: τηρέω का अर्थ किसी वचन को मानना, बनाए रखना या उसकी आज्ञा का पालन करना हो सकता है। ‘पालन करता है’ आधुनिक हिन्दी में स्वाभाविक है और केवल सुनने के बजाय जीवन में मानने का भाव रखता है।
- source_word: αὐτοῦ τὸν λόγον
  choice: उसके वचन
  rationale: λόγος एकवचन में है और यहाँ परमेश्वर अथवा मसीह द्वारा दिए गए वचन को व्यापक अर्थ में सूचित करता है। ‘वचन’ यूहन्ना की शब्दावली और उसके धर्मवैचारिक अनुनाद को बनाए रखता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह क्रिया-विशेषण कथन पर बल देता है; ‘सचमुच’ स्पष्ट और सहज आधुनिक हिन्दी है।
- source_word: ἐν τούτῳ
  choice: उसमें
  rationale: निकट संदर्भ में संकेत उस व्यक्ति की ओर हो सकता है जो वचन का पालन करता है। मुख्य पाठ में ‘उसमें’ स्वाभाविक है; यूनानी की अधिक शाब्दिक और संभावित वस्तुगत समझ पाद-टिप्पणी में रखी गई है।
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: यह रचना परमेश्वर द्वारा किए जाने वाले प्रेम अथवा परमेश्वर के प्रति मनुष्य के प्रेम—दोनों अर्थ दे सकती है। ‘परमेश्वर का प्रेम’ इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- source_word: τετελείωται
  choice: पूर्णता को पहुँच गया है
  rationale: पूर्णकालिक कर्मवाच्य रूप ऐसी पूर्ण हुई प्रक्रिया और उसके वर्तमान परिणाम को व्यक्त करता है जिसका लक्ष्य सिद्ध हो चुका है। यह हिन्दी ‘सिद्ध किया गया है’ की अपेक्षा अधिक स्वाभाविक है और परिपक्वता/लक्ष्य तक पहुँचने का भाव बनाए रखती है।
- source_word: ἐν τούτῳ γινώσκομεν
  choice: इसी से हम जानते हैं
  rationale: यूहन्ना की यह सूत्रात्मक अभिव्यक्ति ज्ञान के आधार या प्रमाण को प्रस्तुत करती है; ‘इसी से’ हिन्दी में उस साधनात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: कि हम उसमें हैं
  rationale: ‘उसमें’ रहना यूहन्ना की संबंध और सहभागिता दर्शाने वाली प्रमुख अभिव्यक्ति है। इसे व्याख्यात्मक विस्तार दिए बिना मूल रूप में रखा गया है।
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: परमेश्वर का प्रेम
  alternative: परमेश्वर का हमारे प्रति प्रेम; अथवा परमेश्वर के प्रति हमारा प्रेम
  rationale: यूनानी संबंधकारक कर्तृवाचक या कर्मवाचक दोनों समझा जा सकता है। मुख्य पाठ किसी एक धर्मवैचारिक अर्थ को आरोपित न करके दोनों संभावनाएँ खुली रखता है।
- issue: पहले ἐν τούτῳ का संकेत
  choice: उसमें
  alternative: इसमें; अथवा इस व्यक्ति में
  rationale: यह वचन का पालन करने वाले व्यक्ति की ओर संकेत कर सकता है, पर इसे उस बात या प्रमाण की ओर संकेत करने वाला भी समझा जा सकता है। सहज मुख्य पाठ के साथ अधिक शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- issue: τετελείωται में पूर्णता का स्वरूप
  choice: पूर्णता को पहुँच गया है
  alternative: सिद्ध हुआ है; पूर्ण किया गया है
  rationale: यह अभिव्यक्ति निष्पापता की कोई अतिरिक्त धारणा आरोपित नहीं करती, बल्कि प्रेम के अपने लक्ष्य या परिपक्वता तक पहुँचने का भाव व्यक्त करती है और यूनानी पूर्णकाल के वर्तमान परिणाम को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वचन,’ ‘परमेश्वर का प्रेम’ और ‘उसमें हैं’ जैसी यूहन्नाई अभिव्यक्तियों को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है। अंतिम विराम-चिह्न के रूप में द्विबिंदु रखा गया है, क्योंकि विचार अगले पद में आगे बढ़ता है।
