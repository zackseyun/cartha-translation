source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: hi
  text: और वह स्वयं हमारे पापों के लिए प्रायश्चित्त का बलिदान है—और केवल हमारे ही पापों के लिए नहीं, बल्कि सारे संसार के पापों के लिए भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: वही
  rationale: यह गहन बलसूचक प्रयोग यीशु की अपनी व्यक्तिगत और विशिष्ट भूमिका पर जोर देता है; आधुनिक हिन्दी में ‘वही’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱλασμός
  choice: प्रायश्चित्त-बलिदान
  rationale: यह पद पापों के संबंध में प्रायश्चित्तकारी साधन अथवा बलिदान को सूचित करता है। ‘प्रायश्चित्त-बलिदान’ बलिदानात्मक अर्थ बनाए रखते हुए सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है; अन्य संभावित अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: हमारे पापों के लिए
  rationale: ἱλασμός के साथ περί का सम्बन्धसूचक अर्थ हिन्दी में ‘के लिए’ द्वारा सहज और विश्वसनीय रूप से व्यक्त होता है।
- source_word: τῶν ἡμετέρων
  choice: हमारे ही पापों
  rationale: यूनानी विशेषण यहाँ पहले आए ‘पापों’ को अध्याहृत रखता है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए संज्ञा को दोहराया गया है, जबकि ‘ही’ सीमितता के विरोध को बनाए रखता है।
- source_word: ὅλου τοῦ κόσμου
  choice: सारे संसार
  rationale: यह ὅλου की व्यापकता को बिना किसी धर्मवैज्ञानिक संकुचन के सुरक्षित रखता है। दूसरे खंड में ‘पापों’ को स्पष्ट रूप से पूरा करना हिन्दी में आवश्यक है।
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: केवल ... ही नहीं, बल्कि ... भी
  rationale: यह यूनानी सहसंबंधी विरोध का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ‘सारे संसार’ का विस्तार
  choice: व्यापक अभिव्यक्ति ‘सारे संसार’ को बिना व्याख्यात्मक सीमा के बनाए रखा गया।
  alternative: ‘संसार भर के लोगों’ अथवा ‘संसार भर के चुने हुओं’ तक अर्थ को सीमित करना।
  rationale: यूनानी पाठ स्वयं ऐसी कोई सीमा नहीं लगाता; अनुवाद को उसकी व्यापकता और उससे उत्पन्न धर्मवैज्ञानिक तनाव सुरक्षित रखना चाहिए।
- issue: ἱλασμός के लिए प्रायश्चित्त संबंधी शब्दावली
  choice: मुख्य पाठ में ‘प्रायश्चित्त-बलिदान’।
  alternative: ‘कोप-शमन’ अथवा ‘पाप-निवारण’।
  rationale: मूल शब्द में प्रायश्चित्त का ऐसा अर्थक्षेत्र है जिसे केवल दैवी कोप के शमन या केवल पाप के हटाए जाने तक सीमित करना विवादित अर्थ को समय से पहले तय कर देगा। मुख्य पाठ में व्यापक बलिदानात्मक पद रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वही’ बलसूचक है, और दूसरे खंड में ‘पापों’ की पुनरावृत्ति हिन्दी में संदर्भ स्पष्ट करती है।
