id: 1JN.2.17
reference: 1 John 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: hi
  text: और संसार मिटता जा रहा है, और उसकी अभिलाषा भी[a]; पर जो परमेश्वर की इच्छा पूरी करता है, वह सदा बना रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अभिलाषा’ का अनुवाद ‘लालसा’ या ‘वासना’ भी हो सकता है। यहाँ इसका आशय संसार की विकृत चाह से व्यापक रूप में है, केवल यौन इच्छा से नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘बना रहता है’ के लिए यूनानी क्रिया का अनुवाद ‘स्थिर रहता है’ भी किया जा सकता है। यूहन्ना के लेखन में यह क्रिया निरंतर टिके या जुड़े रहने के अर्थ में बार-बार आती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना के इस प्रसंग में यह शब्द केवल भौतिक सृष्टि नहीं, बल्कि परमेश्वर के विरोध में खड़ी मानवीय व्यवस्था और उसके मूल्यों को भी समेटता है। ‘संसार’ व्यापक अर्थ को बनाए रखता है, जिसे 2:15–16 का संदर्भ स्पष्ट करता है।
- source_word: παράγεται
  choice: मिटता जा रहा है
  rationale: वर्तमान काल चल रही प्रक्रिया और संसार की क्षणभंगुरता व्यक्त करता है। ‘मिटता जा रहा है’ स्वाभाविक आधुनिक हिन्दी में इस क्रमिक समाप्ति को स्पष्ट करता है।
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यहाँ शब्द संसार की प्रबल और विकृत चाह को व्यापक रूप से बताता है; ‘अभिलाषा’ इसे केवल यौन वासना तक सीमित नहीं करती।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम का संबंध ‘संसार’ से है और हिन्दी में उसी के अनुरूप ‘उसकी’ स्वाभाविक है।
- source_word: ὁ δὲ ποιῶν
  choice: पर जो ... पूरी करता है
  rationale: संज्ञात्मक कृदंत ऐसे व्यक्ति को दर्शाता है जिसकी पहचान परमेश्वर की इच्छा करने से होती है। ‘जो’ प्रतिनिधिक और सर्वसमावेशी अर्थ को सहज हिन्दी में रखता है।
- source_word: θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा
  rationale: यह पद परमेश्वर के उद्देश्य और आदेश के अनुरूप आचरण को व्यक्त करता है; पारंपरिक किंतु वर्तमान हिन्दी में ‘इच्छा’ स्वाभाविक और अर्थपूर्ण है।
- source_word: μένει
  choice: बना रहता है
  rationale: यूहन्ना के लेखन का यह प्रमुख क्रियापद स्थायी बने रहने को व्यक्त करता है। ‘बना रहता है’ समकालीन हिन्दी में स्पष्ट है और केवल स्थान पर ठहरे रहने का संकेत नहीं देता।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: इस प्रसंग में यूनानी मुहावरा अंतहीन स्थायित्व बताता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में κόσμος का आशय
  choice: ‘संसार’—परमेश्वर के विरोध में स्थित क्षणभंगुर मानवीय व्यवस्था सहित व्यापक अर्थ
  alternative: केवल भौतिक सृष्टि
  rationale: 2:15–16 संसार को उसकी अभिलाषाओं और घमंड से चिह्नित करता है। मुख्य पाठ व्यापक शब्द को बनाए रखता है और उसके नैतिक-धार्मिक आशय को संदर्भ से उभरने देता है।
- issue: μένει εἰς τὸν αἰῶνα का बल
  choice: परमेश्वर की इच्छा पूरी करने वाले व्यक्ति का सदा बना रहना
  alternative: अनन्त जीवन के तंत्र की अधिक तकनीकी या विस्तृत व्याख्या
  rationale: यूनानी पाठ स्थायी निरंतरता कहता है, पर उसका doctrinal mechanism नहीं समझाता। अनुवाद उसी कथन का भार बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक विवरण जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘अभिलाषा’ नैतिक संदर्भ को बनाए रखते हुए अनावश्यक रूप से संकीर्ण अर्थ से बचाती है; ‘बना रहता है’ प्रमुख यूहन्नाई क्रिया की पुनरावृत्ति और स्थायित्व दोनों को सहज हिन्दी में व्यक्त करता है।
