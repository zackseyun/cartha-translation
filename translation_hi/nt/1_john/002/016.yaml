id: 1JN.2.16
reference: 1 John 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: hi
  text: क्योंकि संसार में जो कुछ है—शरीर की लालसा[a][b], आँखों की लालसा और जीवन की शेखी[c]—वह पिता की ओर से नहीं, बल्कि संसार की ओर से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरीर की अभिलाषा’ अथवा ‘शरीर की वासना।’ यूनानी शब्द प्रबल इच्छा, लालसा या वासना व्यक्त कर सकता है; यहाँ इसका अर्थ केवल यौन इच्छा तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पापी स्वभाव की लालसा।’ कुछ संदर्भों में यूनानी ‘शरीर’ पतित मानवीय स्वभाव के लिए रूपक हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘जीवन का घमंड’ अथवा ‘सांसारिक जीवन का दिखावा।’ इसमें अपनी हैसियत, संपत्ति, जीवन-यापन के साधनों या रहन-सहन पर अहंकारी शेखी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण बताता है; ‘क्योंकि’ यूनानी के कारणसूचक बल को सीधे बनाए रखता है।
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: संसार में जो कुछ है
  rationale: नपुंसकलिंग एकवचन रचना का सामूहिक और व्यापक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: κόσμῳ / κόσμου
  choice: संसार
  rationale: मानक और संदर्भानुकूल शब्द; ‘संसार-व्यवस्था’ जैसे व्याख्यात्मक विस्तार से बचते हुए यूनानी शब्द की अर्थगत व्यापकता बनाए रखता है।
- source_word: ἐπιθυμία
  choice: लालसा
  rationale: यह संदर्भ में प्रबल और अनुचित चाह को व्यक्त करता है, पर इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: τῆς σαρκὸς
  choice: शरीर की
  rationale: ‘शरीर’ σάρξ का निकट और पारंपरिक समतुल्य है; यह ‘पापी स्वभाव’ जैसी व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: τῶν ὀφθαλμῶν
  choice: आँखों की
  rationale: यूनानी बहुवचन और संबंधकारक रचना को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀλαζονεία
  choice: शेखी
  rationale: यह शब्द अहंकारी दिखावे और डींगपूर्ण आत्म-प्रदर्शन को ‘घमंड’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: τοῦ βίου
  choice: जीवन की
  rationale: βίος जीवन, जीवन-यापन, साधन-संपत्ति या रहन-सहन की ओर संकेत कर सकता है; ‘जीवन’ मुख्य पाठ में इस व्यापकता को बनाए रखता है।
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: पिता की ओर से नहीं
  rationale: ἐκ के स्रोत या उद्गम के भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: बल्कि संसार की ओर से है
  rationale: पिता और संसार के बीच स्रोत के समानांतर विरोध को बनाए रखता है।
theological_decisions:
- issue: नैतिक रूप से नकारात्मक सूची में σάρξ का अर्थ
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: ‘शरीर’ मूल रूपक और उसकी धर्मवैज्ञानिक अर्थगत खिंचाव को सुरक्षित रखता है; ‘पापी स्वभाव’ सम्भव व्याख्या है, पर मुख्य पाठ में अर्थ को एक विशेष मानवशास्त्रीय निष्कर्ष तक सीमित कर देगा।
- issue: κόσμος की व्याख्या
  choice: संसार
  alternative: पतित सांसारिक व्यवस्था
  rationale: पद स्वयं ‘पिता’ और ‘संसार’ के स्रोतगत विरोध को सामने रखता है। व्याख्यात्मक विस्तार जोड़ने के बजाय संदर्भ को उसका नैतिक अर्थ प्रकट करने दिया गया है।
- issue: ἀλαζονεία τοῦ βίου का दायरा
  choice: जीवन की शेखी
  alternative: संपत्ति या हैसियत का घमंड
  rationale: यूनानी वाक्यांश जीवन-यापन, साधनों, हैसियत और रहन-सहन से जुड़ी अहंकारी शेखी को समेट सकता है; मुख्य पाठ में किसी एक पहलू तक सीमित न करके अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों पदों की समानांतर संरचना तथा ‘पिता की ओर से’ और ‘संसार की ओर से’ का स्रोतगत विरोध सुरक्षित है। ‘लालसा’ नकारात्मक प्रबल इच्छा को व्यक्त करती है, जबकि ‘शरीर’ और ‘संसार’ जैसे धर्मवैज्ञानिक रूप से तनावपूर्ण शब्दों को व्याख्यात्मक विस्तार से नहीं बदला गया।
