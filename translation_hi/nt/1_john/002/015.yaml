source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: hi
  text: संसार से प्रेम न करो, और न संसार में जो कुछ है उससे। यदि कोई संसार से प्रेम करता है, तो उसमें पिता का प्रेम[a] नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पिता का प्रेम” का अर्थ “पिता के प्रति प्रेम” हो सकता है; “पिता की ओर से प्रेम” भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: प्रेम न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक रूप सामान्य निषेध या चल रहे आचरण को रोकने का भाव दे सकता है। सरल निषेध मूल की पक्षगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: τὸν κόσμον
  choice: संसार
  rationale: यहाँ κόσμος संदर्भ में परमेश्वर के विरोध में खड़ी मानवीय व्यवस्था और उसके मूल्यों की ओर संकेत करता है; फिर भी परिचित व्यापक शब्द ‘संसार’ मूल अभिव्यक्ति को सुरक्षित रखता है और संदर्भ को अर्थ निर्धारित करने देता है।
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: और संसार में जो कुछ है, उससे
  rationale: यह स्वाभाविक हिन्दी में संसार के साथ-साथ उसमें विद्यमान वस्तुओं या आकर्षणों को भी निषेध के दायरे में रखता है। ‘और...न’ यहाँ μηδέ का निषेधात्मक संयोजन व्यक्त करता है।
- source_word: ἐάν τις ἀγαπᾷ
  choice: यदि कोई ... प्रेम करता है
  rationale: ‘यदि कोई’ अनिश्चित सर्वनाम τις के सार्वत्रिक और व्यक्ति-निरपेक्ष दायरे को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: पिता का प्रेम
  rationale: 'यह रूप यूनानी संबंधकारक की अस्पष्टता बनाए रखता है: संदर्भ में प्रमुख अर्थ पिता के प्रति प्रेम हो सकता है, जबकि पिता की ओर से प्रेम का अर्थ व्याकरणतः संभव है।'
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: हिन्दी का ‘उसमें’ एकवचन व्यक्ति को स्वाभाविक ढंग से संदर्भित करता है और यूनानी पुल्लिंग रूप को अनावश्यक लैंगिक प्रमुखता दिए बिना सामान्य प्रयोग सुरक्षित रखता है।
theological_decisions:
- issue: यूहन्नाई नैतिक शिक्षा में ‘संसार’ का अर्थ
  choice: मुख्य पाठ में ‘संसार’ रखा गया है; संदर्भ इसे परमेश्वर-विरोधी व्यवस्था और मूल्यों के रूप में सीमित करता है।
  alternative: सांसारिक व्यवस्था
  rationale: व्याख्यात्मक विस्तार मूल शब्द को बहुत जल्दी संकीर्ण कर देता और सृष्टि अथवा मनुष्यों के प्रति प्रेम को निषिद्ध समझे जाने की दिशा में पाठ को अनावश्यक रूप से सुलझाता।
- issue: ἡ ἀγάπη τοῦ πατρὸς में संबंधकारक का अर्थ
  choice: ‘पिता का प्रेम’ रखकर व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
  alternative: पिता के प्रति प्रेम; पिता की ओर से प्रेम
  rationale: संसार से प्रेम के साथ विरोध मुख्यतः पिता के प्रति प्रेम का समर्थन करता है, पर यूनानी रूप पिता की ओर से प्रेम का अर्थ भी ग्रहण कर सकता है; इसलिए मुख्य पाठ में किसी एक अर्थ को बाध्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘प्रेम न करो’ सामान्य निषेध को सहज रूप में रखता है। मुख्य पाठ में केवल आवश्यक footnote marker [a] रखा गया है।
