revisions:
- from: पर तुम्हारा अभिषेक उस पवित्र जन से हुआ है,[a] और तुम सब जानते हो।
  to: पर तुम्हें उस पवित्र जन से अभिषेक मिला है,[a] और तुम सब जानते हो।
  rationale: The revision changes only the Hindi expression of χρῖσμα ἔχετε so that the readers, rather than ‘their anointing,’ are the recipients and possessors of the anointing. It retains the source text’s ambiguity about the Holy One, the metaphor ‘अभिषेक,’ the contrast, and the SBLGNT reading ‘तुम सब जानते हो.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:45:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the contrastive force of the opening conjunction, preserves the ambiguity of ‘the Holy One,’ and follows the SBLGNT reading πάντες as ‘you all.’ However, ‘तुम्हारा अभिषेक ... हुआ है’ recasts χρῖσμα ἔχετε (‘you have an anointing’) as an event happening to ‘your anointing.’ A recipient-oriented expression is needed.
  naturalness: ‘तुम्हें ... अभिषेक मिला है’ is natural, dignified modern Hindi and communicates the received, continuing possession implied by the Greek present without making the anointing itself the grammatical subject of a completed event.
  terminology: ‘अभिषेक’ appropriately retains χρῖσμα’s metaphorical theological wording. ‘उस पवित्र जन’ preserves the deliberately unspecified title τοῦ ἁγίου, though it is a formal biblical expression. The textual-variant note is accurate and its anchor is correctly placed after ‘पवित्र जन.’
  issues:
  - severity: medium
    issue: The phrase ‘तुम्हारा अभिषेक उस पवित्र जन से हुआ है’ does not accurately express χρῖσμα ἔχετε.
    rationale: It can mean that an anointing belonging to the readers occurred from the Holy One, whereas the Greek says that the readers possess/have received an anointing from the Holy One. Recasting the readers as recipients restores the source relation and sense.
  revised_text: पर तुम्हें उस पवित्र जन से अभिषेक मिला है,[a] और तुम सब जानते हो।
  revised_footnotes:
  - marker: a
    text: 'एक अन्य पाठांतर के अनुसार: “और तुम सब कुछ जानते हो।” SBLGNT का पाठ “और तुम सब जानते हो” का समर्थन करता है।'
    reason: textual_variant
  revision_rationale: The revision changes only the Hindi expression of χρῖσμα ἔχετε so that the readers, rather than ‘their anointing,’ are the recipients and possessors of the anointing. It retains the source text’s ambiguity about the Holy One, the metaphor ‘अभिषेक,’ the contrast, and the SBLGNT reading ‘तुम सब जानते हो.’
