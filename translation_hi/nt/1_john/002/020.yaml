  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: hi
  text: पर तुम्हें उस पवित्र जन से अभिषेक मिला है,[a] और तुम सब जानते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठांतर के अनुसार: “और तुम सब कुछ जानते हो।” SBLGNT का पाठ “और तुम सब जानते हो” का समर्थन करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: पर
  rationale: यहाँ καί पिछले पद में बताए गए मसीह-विरोधियों और संबोधित विश्वासियों के बीच विरोध प्रकट करता है; आधुनिक हिन्दी में ‘पर’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑμεῖς
  choice: तुम्हारा
  rationale: यूनानी सर्वनाम बलाघाती है। ‘पर तुम्हारा’ की रचना पिछले समूह से स्पष्ट विरोध दिखाती है।
- source_word: χρῖσμα ἔχετε
  choice: तुम्हारा अभिषेक … हुआ है
  rationale: χρῖσμα के अभिषेक-रूपक को बनाए रखते हुए यह हिन्दी में ‘तुम्हारे पास अभिषेक है’ की अपेक्षा अधिक स्वाभाविक है और प्राप्त अभिषेक की वर्तमान वास्तविकता व्यक्त करता है।
- source_word: ἀπὸ τοῦ ἁγίου
  choice: उस पवित्र जन से
  rationale: यह पदवी मूल पाठ की अस्पष्टता बनाए रखती है और इसे विशेष रूप से पिता, पुत्र या पवित्र आत्मा के रूप में नहीं खोलती। ‘उस’ निश्चित यूनानी पदबंध को दर्शाता है।
- source_word: καὶ
  choice: और
  rationale: दूसरा καί दोनों कथनों को सीधे जोड़ता है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: यह οἴδατε का सीधा, स्वाभाविक और व्यापक हिन्दी समतुल्य है।
- source_word: πάντες
  choice: तुम सब
  rationale: SBLGNT के कर्तृवाचक बहुवचन πάντες के अनुसार अर्थ ‘तुम सब जानते हो’ है, न कि ‘तुम सब कुछ जानते हो’।
theological_decisions:
- issue: ‘पवित्र जन’ का संदर्भ
  choice: संदर्भ को अनिर्दिष्ट रखते हुए ‘उस पवित्र जन’
  alternative: परमेश्वर पिता; यीशु मसीह; पवित्र आत्मा
  rationale: मूल पदबंध स्वयं संदर्भित व्यक्ति को स्पष्ट नहीं करता; अतः अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
- issue: χρῖσμα का आशय
  choice: रूपकात्मक ‘अभिषेक’
  alternative: पवित्र आत्मा; आत्मा का अभिषेक; अभिषेक का वरदान
  rationale: संदर्भ में इसे पवित्र आत्मा या उसके कार्य से जोड़ा जा सकता है, पर यूनानी पाठ रूपकात्मक संज्ञा का प्रयोग करता है; इसलिए उसी तनाव को बनाए रखा गया है।
- issue: πάντες की पाठगत व्याख्या
  choice: ‘तुम सब जानते हो’
  alternative: ‘तुम सब कुछ जानते हो’
  rationale: प्रदत्त SBLGNT पाठ में πάντες कर्तृवाचक पुल्लिंग बहुवचन है और संबोधित सभी लोगों को सूचित करता है; वैकल्पिक पाठ πάνTA वस्तुओं की समग्रता का अर्थ देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अभिषेक’ और ‘पवित्र जन’ मूल के धार्मिक रूपक तथा संदर्भगत अस्पष्टता को सुरक्षित रखते हैं।
