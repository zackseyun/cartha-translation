reference: 1 John 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: hi
  text: हे पिताओ, मैं तुम्हें लिख रहा हूँ, क्योंकि तुम उसे जान चुके हो जो आरम्भ से है।[a] हे जवानो, मैं तुम्हें लिख रहा हूँ, क्योंकि तुमने उस दुष्ट पर विजय पाई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो आरम्भ से है” सम्भवतः पुत्र की ओर संकेत करता है, यद्यपि कुछ लोग इसे अधिक व्यापक रूप से परमेश्वर के लिए समझते हैं।
    reason: मूल यूनानी संकेतित व्यक्ति का नाम नहीं बताता; टिप्पणी सम्भावित संदर्भ बताते हुए अस्पष्टता बनाए रखती है।
lexical_decisions:
- source_word: γράφω
  choice: मैं तुम्हें लिख रहा हूँ
  rationale: पत्र लिखे जाने की वर्तमान क्रिया को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है और यूनानी वर्तमान काल की तात्कालिकता बनाए रखता है।
- source_word: πατέρες
  choice: हे पिताओ
  rationale: सम्बोधन के शाब्दिक अर्थ ‘पिता’ को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘बुज़ुर्गो’ या ‘परिपक्व विश्वासियो’ नहीं बनाया गया।
- source_word: ἐγνώκατε
  choice: तुम ... जान चुके हो
  rationale: पूर्ण काल पहले प्राप्त हुए ज्ञान और उसके बने रहने वाले परिणाम, दोनों को व्यक्त करता है।
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: उसे ... जो आरम्भ से है
  rationale: मूल के व्यक्तिवाचक, पर अनाम, संकेत को सुरक्षित रखता है और वर्तमान भाव ‘है’ को बनाए रखता है।
- source_word: νεανίσκοι
  choice: हे जवानो
  rationale: पुल्लिंग बहुवचन सम्बोधन को स्पष्ट, स्वाभाविक और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νενικήκατε
  choice: तुमने ... विजय पाई है
  rationale: पूर्ण काल की सम्पन्न विजय और उसके वर्तमान प्रभाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὸν πονηρόν
  choice: उस दुष्ट पर
  rationale: पुल्लिंग एकवचन सविशेषण रूप एक व्यक्तिगत दुष्ट विरोधी की ओर संकेत करता है; ‘शैतान’ नाम जोड़ने से बचा गया है।
theological_decisions:
- issue: ‘जो आरम्भ से है’ का संकेतित व्यक्ति
  choice: मुख्य पाठ में व्यक्ति का नाम स्पष्ट किए बिना ‘उसे ... जो आरम्भ से है’
  alternative: इसे स्पष्ट रूप से पुत्र/मसीह या अधिक व्यापक रूप से परमेश्वर कहना
  rationale: यूहन्नाई संदर्भ संभवतः पुत्र की ओर संकेत करता है, पर यूनानी वाक्य यहाँ उसका नाम नहीं देता; इसलिए मूल की अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: ‘उस दुष्ट’ का अर्थ
  choice: व्यक्तिगत दुष्ट विरोधी
  alternative: अमूर्त बुराई
  rationale: पुल्लिंग एकवचन और निश्चित लेख व्यक्तिगत संदर्भ का दृढ़ संकेत देते हैं, फिर भी मूल में न आया हुआ ‘शैतान’ नाम नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘हे पिताओ’ और ‘हे जवानो’ सम्बोधन स्पष्ट करते हैं; ‘तुम’ सामूहिक बहुवचन के रूप में प्रयुक्त है।
