source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: hi
  text: 'और यही वह प्रतिज्ञा है जो उसने स्वयं हमसे की थी: अनन्त जीवन।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसने स्वयं’ में ‘उसने’ किसके लिए है, यह इस वाक्य में स्पष्ट रूप से दोबारा नहीं बताया गया है; संदर्भ में इसे पिता या पुत्र से संबंधित समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: प्रतिज्ञा / प्रतिज्ञा की है
  rationale: संज्ञा और उसी मूल की क्रिया के बीच का शब्द-संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: αὐτός
  choice: उसने स्वयं
  rationale: ‘स्वयं’ यूनानी सर्वनाम के बलाघात को व्यक्त करता है, बिना उसके संदर्भ को पिता या पुत्र के रूप में निश्चित किए।
- source_word: ἡμῖν
  choice: हमसे
  rationale: हिन्दी में ‘प्रतिज्ञा करना’ के साथ वचन पाने वाले समुदाय को ‘हमसे’ कहना स्वाभाविक है; अर्थ है कि प्रतिज्ञा हमसे/हमारे लिए की गई।
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह पदबंध प्रतिज्ञा की विषय-वस्तु बताता है। ‘अनन्त जीवन’ यूहन्नाई प्रयोग के लिए स्पष्ट, प्रतिष्ठित और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: καὶ αὕτη ἐστίν
  choice: और यह वही ... है
  rationale: ‘यह वही’ संकेतवाचक बल को स्वाभाविक हिन्दी में सामने लाता है और पिछले प्रसंग से संबंध बनाए रखता है।
theological_decisions:
- issue: ‘उसने स्वयं’ (αὐτός) का संदर्भ
  choice: सर्वनाम को ‘उसने स्वयं’ रखा गया है और उसका संदर्भ स्पष्ट रूप से नहीं बताया गया।
  alternative: ‘पिता ने स्वयं’ अथवा ‘पुत्र ने स्वयं’
  rationale: इस वाक्य में यूनानी पाठ कर्ता को दोबारा नाम से नहीं बताता। संदर्भ को किसी एक रूप में निश्चित करना पाठ की वास्तविक खुली हुई स्थिति को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रतिज्ञा’ और ‘अनन्त जीवन’ परिचित बाइबलीय शब्द हैं, जबकि वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुकूल है। यूनानी के निश्चित उपपद का हिन्दी में अलग चिह्न नहीं दिया गया, क्योंकि हिन्दी में उपपद-प्रणाली नहीं है और ‘अनन्त जीवन’ स्वयं स्वाभाविक रूप से निश्चित विषय-वस्तु को व्यक्त करता है।
