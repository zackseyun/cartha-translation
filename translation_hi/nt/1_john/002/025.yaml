review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the cognate relationship of ἐπαγγελία and ἐπηγγείλατο, the emphatic force of αὐτός ('स्वयं'), the unresolved referent, and the appositional content 'eternal life.' However, 'वही' adds a slightly stronger sense of identity ('that very/same') than the Greek demonstrative requires, and 'की है' does not reflect the Greek aorist as naturally as a past form in this context.
  naturalness: The proposed revision is clear, modern, and suitably dignified Hindi. 'यही वह प्रतिज्ञा' is an idiomatic way to render the Greek demonstrative plus definite noun without adding emphasis beyond the source. A colon naturally introduces the appositional specification of the promise.
  terminology: ‘प्रतिज्ञा’ and ‘अनन्त जीवन’ are appropriate established Hindi biblical terms. ‘उसने स्वयं’ appropriately preserves emphasis without deciding whether the antecedent is the Father or the Son.
  issues:
