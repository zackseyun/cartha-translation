    issue: ‘वही’ slightly overstates the demonstrative force.
    rationale: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία means ‘and this is the promise’; ‘वही’ can imply ‘that same/very promise.’ ‘यही वह प्रतिज्ञा’ is closer while remaining natural.
  - severity: low
    issue: ‘की है’ weakens the aorist time reference.
    rationale: ἐπηγγείλατο is aorist. Hindi ‘की थी’ fits the completed act of promising in the past and reads naturally in this construction.
