id: 1JN.2.8
reference: 1 John 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: hi
  text: फिर, मैं तुम्हें एक नई आज्ञा लिख रहा हूँ। यह बात उसमें[a] और तुम में सच्ची है, क्योंकि अंधकार मिटता जा रहा है और सच्ची ज्योति अभी से चमक रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसमें’ का अर्थ ‘मसीह में’ हो सकता है; इसे ‘उस आज्ञा में’ भी समझा जा सकता है।
    reason: मूल में सर्वनाम के संदर्भ की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह संक्षिप्त विमर्श-सूचक पिछले पद की बात को एक नए दृष्टिकोण से आगे बढ़ाता है; ‘फिर’ मूल की संक्षिप्तता बनाए रखता है और संबंध को जरूरत से अधिक नहीं समझाता।
- source_word: ἐντολὴν καινὴν
  choice: एक नई आज्ञा
  rationale: यह स्वाभाविक और प्रचलित हिन्दी है तथा केवल समय की दृष्टि से नई नहीं, बल्कि गुण या स्वरूप में नई होने का भाव भी ग्रहण कर सकती है।
- source_word: γράφω ὑμῖν
  choice: मैं तुम्हें ... लिख रहा हूँ
  rationale: वर्तमान काल पत्र लिखने की चल रही क्रिया को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅ ἐστιν ἀληθὲς
  choice: यह बात ... सच्ची है
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम पिछली आज्ञा या पूरे कथन को संकल्पना के रूप में समेट सकता है; ‘यह बात’ हिन्दी में उस व्यापक संदर्भ को सहज रूप से व्यक्त करता है।
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: उसमें और तुम में
  rationale: ‘उसमें’ हिन्दी में व्यक्ति या वस्तु दोनों की ओर संकेत कर सकता है, इसलिए यूनानी में संभावित संदर्भगत अस्पष्टता बनी रहती है; ‘तुम में’ पाठकों के भीतर या उनके जीवन में इसकी वास्तविकता को सीधे व्यक्त करता है।
- source_word: ἡ σκοτία παράγεται
  choice: अंधकार मिटता जा रहा है
  rationale: यह जारी प्रक्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है—अंधकार अभी क्रमशः हट रहा है।
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: सच्ची ज्योति
  rationale: ‘ज्योति’ गरिमापूर्ण, समझने योग्य और यूहन्नाई प्रकाश-रूपक के अनुकूल है; ‘सच्ची’ वास्तविक और प्रामाणिक होने का भाव रखती है।
- source_word: ἤδη φαίνει
  choice: अभी से चमक रही है
  rationale: ‘अभी से’ उस वास्तविकता के वर्तमान में आरम्भ हो चुकने पर बल देता है, और ‘चमक रही है’ वर्तमान में जारी प्रकाश को व्यक्त करता है।
theological_decisions:
- issue: ἐν αὐτῷ में αὐτῷ का संदर्भ
  choice: मुख्य पाठ में ‘उसमें’ रखा गया है, जो संदर्भ में सबसे स्वाभाविक रूप से मसीह की ओर संकेत कर सकता है।
  alternative: इसे ‘उस आज्ञा में’ भी समझा जा सकता है।
  rationale: निकट संदर्भ और यूहन्नाई प्रयोग व्यक्तिगत, मसीह-संबंधी अर्थ का समर्थन करते हैं, पर वाक्य की संकल्पनात्मक रचना आज्ञा की ओर संकेत करने की संभावना को पूरी तरह समाप्त नहीं करती। हिन्दी ‘उसमें’ मूल की इस अस्पष्टता को स्वाभाविक रूप से बनाए रखता है, और पादटिप्पणी दोनों संभावनाएँ स्पष्ट करती है।
- issue: अंधकार के मिटने और ज्योति के पहले से चमकने का कालगत तनाव
  choice: 'दोनों क्रियाओं को जारी वर्तमान प्रक्रिया के रूप में रखा गया है: ‘मिटता जा रहा है’ और ‘अभी से चमक रही है’।'
  alternative: अंधकार को पूरी तरह मिट चुका और ज्योति को पूर्ण रूप से प्रकट मानकर अनुवाद करना।
  rationale: यूनानी वर्तमान काल और ἤδη मिलकर आरम्भ हो चुकी, पर अभी जारी वास्तविकता व्यक्त करते हैं; अनुवाद इस तनाव को अंतिम पूर्णता में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘ज्योति’ यूहन्नाई रूपक की साहित्यिक गरिमा बनाए रखती है, जबकि शेष वाक्यरचना सामान्य पाठक के लिए सीधी है।
