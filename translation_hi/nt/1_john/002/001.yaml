  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: hi
  text: मेरे प्यारे बच्चो, मैं ये बातें तुम्हें इसलिए लिख रहा हूँ कि तुम पाप न करो। पर यदि कोई पाप करे, तो पिता के पास हमारा एक पक्षसमर्थक[a] है—यीशु मसीह, जो धर्मी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी ओर से विनती करनेवाला” या “अधिवक्ता”; यूनानी शब्द παράκλητος का अर्थ प्रसंग के अनुसार पक्षसमर्थक, सहायक, सलाहकार या सांत्वना देनेवाला भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία μου
  choice: मेरे प्यारे बच्चो
  rationale: यह स्नेहपूर्ण पारिवारिक संबोधन है। ‘प्यारे बच्चो’ यूनानी लघुतासूचक रूप की आत्मीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ταῦτα γράφω ὑμῖν
  choice: मैं ये बातें तुम्हें ... लिख रहा हूँ
  rationale: वर्तमानकालीन पत्र-लेखन की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और ταῦτα को अनिर्दिष्ट ‘ये बातें’ के रूप में बनाए रखता है।
- source_word: ἵνα μὴ ἁμάρτητε
  choice: इसलिए ... कि तुम पाप न करो
  rationale: ἵνα के प्रयोजनार्थ को स्पष्ट रखता है और अपने आप में पापरहित सिद्धता का अतिरिक्त दावा नहीं जोड़ता।
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: फिर भी यदि कोई पाप कर बैठे
  rationale: संदर्भ में καί का विरोधसूचक प्रवाह ‘फिर भी’ से व्यक्त होता है। ‘कर बैठे’ संभावित चूक का भाव देता है, बिना उसे अनिवार्य ठहराए।
- source_word: παράκλητον
  choice: पक्षसमर्थक
  rationale: यहाँ पिता के पास यीशु की प्रतिनिधिक और सहायक भूमिका प्रमुख है। ‘पक्षसमर्थक’ विधिक अर्थ तक सीमित हुए बिना किसी के पक्ष में खड़े होने का भाव देता है।
- source_word: πρὸς τὸν πατέρα
  choice: पिता के पास
  rationale: πρός यहाँ पिता की उपस्थिति और उनकी ओर संबंधात्मक पहुँच का भाव देता है; ‘के पास’ हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: Ἰησοῦν Χριστὸν
  choice: यीशु मसीह
  rationale: Χριστός यहाँ यीशु की मसीही उपाधि को व्यक्त करता है; हिन्दी में ‘यीशु मसीह’ स्थापित, स्वाभाविक और शीर्षकीय अर्थ वाला रूप है।
- source_word: δίκαιον
  choice: जो धर्मी है
  rationale: विशेषण यीशु मसीह का वर्णन करता है। ‘जो धर्मी है’ यूनानी व्याकरण के अनुरूप है और हिन्दी में कृत्रिम उपाधि बनाए बिना कथन का बल सुरक्षित रखता है।
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητε में पापरहित सिद्धता का संभावित अर्थ
  choice: 'प्रयोजन-वाक्य: ‘कि तुम पाप न करो’'
  alternative: ऐसा कथन जो पूर्ण और प्राप्त पापरहितता को अनिवार्य रूप से सिखाए
  rationale: लेखक का उद्देश्य स्पष्ट रखा गया है, जबकि अगला शर्तसूचक वाक्य पाप की वास्तविक संभावना को भी बनाए रखता है।
- issue: Χριστός का शीर्षकीय या नाम-जैसा प्रयोग
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस संदर्भ में Χριστός मसीही पहचान और उपाधि को वहन करता है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित है।
- issue: παράκλητος की प्रतिनिधिक भूमिका
  choice: पक्षसमर्थक
  alternative: सहायक, सलाहकार, सांत्वना देनेवाला, अधिवक्ता
  rationale: पिता के पास होने का संदर्भ किसी के पक्ष में खड़े होने की भूमिका को उभारता है, पर शब्द का अर्थ केवल सांसारिक न्यायालय के वकील तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। आत्मीय संबोधन के लिए ‘मेरे प्यारे बच्चो’ और पाठक से निकट संबंध के अनुरूप ‘तुम’ का प्रयोग किया गया है। ‘पक्षसमर्थक’ अपेक्षाकृत कम प्रचलित किंतु अर्थ-पारदर्शी शब्द है; इसलिए उसके व्यापक अर्थ की पाद-टिप्पणी दी गई है।
