  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: hi
  text: 'और इसी से हम जानते हैं कि हम उसे जान गए हैं: यदि हम उसकी आज्ञाओं का पालन करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह यूहन्ना की विशिष्ट अभिव्यक्ति है, जो उस आधार या प्रमाण को प्रस्तुत करती है जिससे कोई बात जानी जाती है। ‘इसी से’ स्वाभाविक हिन्दी में संकेतवाचक बल बनाए रखता है।
- source_word: γινώσκομεν
  choice: हम जानते हैं
  rationale: वर्तमानकाल यहाँ मौजूदा पहचान या निश्चय व्यक्त करता है; हिन्दी में सामान्य वर्तमान स्वाभाविक है।
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: कि हम उसे जान गए हैं
  rationale: यूनानी पूर्णकाल किसी को जानने तक पहुँचने और उसके बने हुए परिणाम—दोनों का संकेत देता है। ‘जान गए हैं’ हिन्दी में इस पूर्णतापरक भाव को संक्षेप और स्वाभाविक रीति से व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: मूल पाठ केवल सर्वनाम रखता है। ‘उसे’ अनुवर्ती संदर्भ को परमेश्वर या मसीह कहकर आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἐὰν
  choice: यदि
  rationale: यह प्रमाण या कसौटी बताने वाला सामान्य शर्तसूचक अव्यय है; ‘यदि’ सीधा और गरिमापूर्ण अनुवाद है।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: ‘आज्ञाएँ’ यूहन्ना के प्रयोग में नैतिक और वाचागत भार बनाए रखता है तथा आधुनिक हिन्दी के बाइबलीय रजिस्टर में सहज है।
- source_word: τηρῶμεν
  choice: पालन करते हैं
  rationale: τηρέω में थामे रखने, मानने और आचरण में निभाने का भाव है। आज्ञाओं के साथ ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञाकारी अनुपालन स्पष्ट करता है।
theological_decisions:
- issue: αὐτόν (‘उसे’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उसे’ बनाए रखना
  alternative: ‘परमेश्वर को’ अथवा ‘यीशु/मसीह को’ स्पष्ट करना
  rationale: यूनानी पाठ सर्वनाम का प्रयोग करता है और निकटवर्ती संदर्भ परमेश्वर को जानने तथा पुत्र से संबंध के बीच घनिष्ठ धार्मिक तनाव बनाए रखता है। सर्वनाम रखना मूल की अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। वाक्य की प्रमाणसूचक रचना और मूल पाठ का सर्वनाम सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘जान गए हैं’ यूनानी पूर्णकाल का अर्थ मुख्य पाठ में पर्याप्त रूप से व्यक्त करता है।
