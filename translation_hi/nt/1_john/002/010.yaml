base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: hi
  text: जो अपने भाई से प्रेम करता है, वह ज्योति में बना रहता है, और उसमें ठोकर का कोई कारण नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए ठोकर का कोई कारण नहीं है।” यूनानी वाक्यांश का अर्थ या तो यह हो सकता है कि ठोकर का कारण उसमें नहीं है, या यह कि उसके लिए ठोकर का कोई कारण नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: जो ... प्रेम करता है
  rationale: निश्चित लेख के साथ वर्तमान कृदंत यहाँ व्यक्ति को सामान्य और निरंतर भाव में दर्शाता है; यह हिंदी में स्वाभाविक रूप से उसी अर्थ को व्यक्त करता है।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई से
  rationale: ἀδελφός पुल्लिंग एकवचन है। 'भाई' मूल की व्याकरणिक विशिष्टता और विश्वास-समुदाय के संबंधपरक संदर्भ को बनाए रखता है; 'अपने' हिंदी में कर्ता से संबंध स्पष्ट करता है।
- source_word: ἐν τῷ φωτὶ
  choice: ज्योति में
  rationale: '''ज्योति'' यूहन्नाई प्रकाश-रूपक को बनाए रखते हुए गरिमापूर्ण और सामान्य बाइबलीय हिंदी है।'
- source_word: μένει
  choice: बना रहता है
  rationale: μένω की निरंतरता और स्थायित्व को आधुनिक, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: σκάνδαλον
  choice: ठोकर का कोई कारण
  rationale: यह अभिव्यक्ति σκάνδαλον के ठोकर, फंदे या पतन का कारण होने के नैतिक रूपक को बिना उसे शाब्दिक वस्तु बनाए सुरक्षित रखती है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: पुल्लिंग सर्वनाम का सबसे सीधा संबंध प्रेम करने वाले व्यक्ति से है। मूल वाक्यांश की संभावित 'उसके लिए' व्याख्या पादटिप्पणी में रखी गई है।
- source_word: οὐκ ἔστιν
  choice: नहीं है
  rationale: अस्तित्व के निषेध को हिंदी में सहज और सीधी रीति से व्यक्त करता है।
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν में अंतिम वाक्यांश का संबंध और आशय
  choice: प्रेम करने वाले व्यक्ति में ठोकर का कोई कारण नहीं है
  alternative: उसके लिए ठोकर की कोई बाधा नहीं है
  rationale: ἐν αὐτῷ का सबसे सीधा अर्थ 'उसमें' है, पर प्रसंग में इसे 'उसके लिए' भी समझा जा सकता है। मुख्य पाठ आंतरिक नैतिक अर्थ को बिना यह तय किए रखता है कि ठोकर स्वयं उसे लगती है या वह दूसरों को ठोकर देता है; दूसरी संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण शैली अपनाई गई है। 'ज्योति' यूहन्नाई रूपक और बाइबलीय स्वर बनाए रखता है; शेष वाक्यरचना साधारण पाठक के लिए सहज रखी गई है।
