id: 1JN.2.7
reference: 1 John 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: hi
  text: प्रिय जनो, मैं तुम्हें कोई नई आज्ञा नहीं लिख रहा हूँ, बल्कि एक पुरानी आज्ञा, जो आरम्भ से तुम्हारे पास रही है। वह पुरानी आज्ञा वह सन्देश[a] है जिसे तुमने सुना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वचन”।
    reason: λόγος का अधिक शाब्दिक और पारम्परिक विकल्प; मुख्य पाठ में संदर्भानुकूल ‘सन्देश’ रखा गया है।
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन सम्बोधन में यह स्वाभाविक, आत्मीय और गरिमापूर्ण हिन्दी है; यह लेखक के प्रेमपूर्ण पासबानी स्वर को बनाए रखता है, जबकि अधिक कृत्रिम ‘हे प्रियो’ से बचता है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: यूहन्ना के लेखन में इस शब्द का नैतिक और धर्मवैचारिक भार है। ‘आज्ञा’ उस अर्थ और बाइबलीय प्रतिध्वनि को सहज हिन्दी में बनाए रखती है।
- source_word: καινήν
  choice: नई
  rationale: यह παλαιάν (‘पुरानी’) के साथ स्पष्ट विरोध को सीधे व्यक्त करता है और किसी अतिरिक्त अर्थ को नहीं जोड़ता।
- source_word: γράφω
  choice: लिख रहा हूँ
  rationale: वर्तमानकालीन पत्र-लेखन की जारी क्रिया को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: παλαιάν / παλαιά
  choice: पुरानी
  rationale: ‘नई’ के सीधे विरोध को सुरक्षित रखता है और यह दर्शाता है कि आज्ञा पाठकों को पहले से प्राप्त है; ‘प्राचीन’ अनावश्यक रूप से बहुत दूर के काल का संकेत दे सकता है।
- source_word: εἴχετε
  choice: तुम्हारे पास है
  rationale: यूनानी अपूर्णकाल में अतीत से चली आ रही प्राप्ति/अधिकार की अवस्था है। ‘आरम्भ से तुम्हारे पास है’ हिन्दी में उसके अब तक बने रहने का भाव स्वाभाविक ढंग से देता है।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: यूहन्नाई अभिव्यक्ति की व्यापकता बनाए रखता है और यह तय नहीं करता कि आशय उनके मसीही जीवन, शिक्षा या सुसमाचार-प्रचार के आरम्भ से है।
- source_word: λόγος
  choice: सन्देश
  rationale: यहाँ संदर्भ सुनी हुई घोषित विषयवस्तु का है; ‘सन्देश’ आधुनिक पाठक के लिए स्पष्ट है। ‘वचन’ सम्भव शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἠκούσατε
  choice: तुमने सुना था
  rationale: यूनानी अओरिस्ट पाठकों द्वारा पहले सुने जाने की घटना की ओर संकेत करता है; हिन्दी में ‘सुना था’ वर्तमान लेखन-क्षण से पूर्व की उस घटना को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘आरम्भ से’ का संकेत किस ओर है
  choice: ‘आरम्भ से’ को बिना और स्पष्ट किए रखा गया
  alternative: ‘तुम्हारे मसीही जीवन के आरम्भ से’ अथवा ‘सुसमाचार के प्रचार के आरम्भ से’
  rationale: निकट संदर्भ पाठकों की आरम्भिक शिक्षा की ओर संकेत कर सकता है, पर यूनानी पाठ इसे संकीर्ण रूप से परिभाषित नहीं करता; अतः यूहन्नाई व्यापकता और सम्भावित तनाव सुरक्षित रखा गया है।
- issue: पुरानी आज्ञा और सुने हुए λόγος का सम्बन्ध
  choice: 'दोनों को सीधे समान ठहराया गया: ‘वही पुरानी आज्ञा वही सन्देश है’'
  alternative: निकटवर्ती पदों या व्यापक धर्मविज्ञान से आज्ञा की व्याख्या जोड़ना
  rationale: यूनानी वाक्य स्वयं पुरानी आज्ञा को सुने हुए λόγος के समान ठहराता है। अनुवाद इस सम्बन्ध को बिना सामंजस्यकारी विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय पर गरिमापूर्ण सम्बोधन, और सामान्य पाठक के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘वही’ का प्रयोग यूनानी में आज्ञा और सन्देश के बलपूर्ण समीकरण को स्पष्ट करता है। पादटिप्पणी-चिह्न सम्बद्ध शब्द λόγος के अनुवाद ‘सन्देश’ पर रखा गया है।
