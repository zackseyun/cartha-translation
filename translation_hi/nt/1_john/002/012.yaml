  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: hi
  text: हे प्यारे बच्चो, मैं तुम्हें लिख रहा हूँ[a], क्योंकि उसके[c] नाम के कारण तुम्हारे पाप क्षमा किए गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें लिखता हूँ।” पत्र के प्रसंग में यूनानी वर्तमान काल का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कि तुम्हारे पाप क्षमा किए गए हैं।” यूनानी संयोजक कथ्य का परिचय दे सकता है, यद्यपि यहाँ संभवतः लिखने का कारण बताया गया है।
    reason: alternative_reading
  - marker: c
    text: “उसके” का संकेत प्रसंग के आधार पर परमेश्वर या यीशु की ओर समझा जा सकता है; यूनानी इस पद में इसे स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: मैं तुम्हें लिख रहा हूँ
  rationale: पत्र लिखे जाने की वर्तमान क्रिया को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; यूनानी वर्तमान को साधारण वर्तमान के रूप में भी समझा जा सकता है।
- source_word: τεκνία
  choice: हे प्यारे बच्चो
  rationale: सम्बोधन का स्नेहपूर्ण और पारिवारिक भाव व्यक्त करता है; यह केवल कम आयु का संकेत नहीं है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ पत्र लिखने का कारण बताना आसपास के कथन-क्रम के अनुकूल है, यद्यपि इसे कथ्यसूचक ‘कि’ भी समझा जा सकता है।
- source_word: ἀφέωνται
  choice: क्षमा किए गए हैं
  rationale: पूर्ण निष्क्रिय रूप बीते हुए कार्य और उसके बने रहने वाले परिणाम—क्षमा की वर्तमान अवस्था—दोनों को व्यक्त करता है।
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: तुम्हारे पाप
  rationale: क्षमा संबंधी यूनानी रचना में बहुवचन द्वितीय पुरुष के लिए निहित संबंध को हिन्दी में स्वाभाविक अधिकारवाचक रूप से व्यक्त किया गया है।
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: उसके नाम के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या आधार दर्शाता है। ‘नाम’ का व्यक्तिगत और धर्मवैचारिक भार सुरक्षित रखते हुए यह हिन्दी में सहज है।
- source_word: ὄνομα
  choice: नाम
  rationale: ‘नाम’ को ‘प्रतिष्ठा’ तक सीमित न करके मूल बाइबिलीय अभिव्यक्ति और उसके व्यापक व्यक्तिगत अर्थ को बनाए रखता है।
theological_decisions:
- issue: ‘उसके नाम’ में ‘उसके’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘उसके’ रखा गया
  alternative: परमेश्वर अथवा यीशु मसीह को स्पष्ट रूप से लिखना
  rationale: इस पद में संदर्भित व्यक्ति का नाम स्पष्ट नहीं किया गया है; व्यापक प्रसंग के आधार पर दोनों व्याख्याएँ मिलती हैं। सर्वनाम को यथावत रखने से मूल की अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: ὅτι का कार्य
  choice: कारणसूचक ‘क्योंकि’
  alternative: कथ्यसूचक ‘कि’
  rationale: आसपास के अनुच्छेद में यह यूहन्ना के लिखने का कारण अधिक स्वाभाविक रूप से बताता है, पर कथ्यसूचक अर्थ व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गरिमामय और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘हे प्यारे बच्चो’ τεκνία का आत्मीय सम्बोधन व्यक्त करता है, जबकि ‘उसके’ को अस्पष्ट रखकर मूल पाठ की संदर्भगत अनिश्चितता सुरक्षित की गई है।
