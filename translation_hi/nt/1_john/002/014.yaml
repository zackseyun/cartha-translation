id: 1JN.2.14
reference: 1 John 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: hi
  text: हे बच्चो, मैंने तुम्हें लिखा है[a], क्योंकि तुम पिता को जान चुके हो। हे पिताओ, मैंने तुम्हें लिखा है, क्योंकि तुम उसे जान चुके हो जो आरम्भ से है। हे जवानो, मैंने तुम्हें लिखा है, क्योंकि तुम बलवान हो, परमेश्वर का वचन तुममें बना रहता है[b], और तुम उस दुष्ट पर विजय पा चुके हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हें लिखा”; पूरे पद में यूनानी क्रिया का अनुवाद साधारण भूतकाल में भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का वचन तुममें स्थिर रहता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: मैंने तुम्हें लिखा है
  rationale: पत्र के संदर्भ में यूनानी एओरिस्ट यहाँ लिखे हुए संदेश की वर्तमान प्रासंगिकता रखता है; हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से यह भाव व्यक्त करता और तीनों आवृत्तियों की अलंकारिक समानता बनाए रखता है।
- source_word: παιδία
  choice: हे बच्चो
  rationale: यह सम्बोधन पारिवारिक रूपक को सहज आधुनिक हिन्दी में रखता है; 'हे' तीनों सम्बोधनों को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: ἐγνώκατε
  choice: जान चुके हो
  rationale: यूनानी पूर्णकाल पहले प्राप्त और अब भी स्थिर ज्ञान को दर्शाता है; 'जान चुके हो' उसके परिणामकारी पक्ष को बनाए रखता है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूहन्नाई प्रयोग में यह परमेश्वर के लिए स्पष्ट सम्बन्धसूचक उपाधि है।
- source_word: πατέρες
  choice: हे पिताओ
  rationale: स्रोत के पुरुषवाची सम्बोधन और बच्चो–पिताओ–जवानो की त्रयी को ज्यों का त्यों रखा गया है; इसे केवल 'बुज़ुर्गो' बनाना अर्थ को उम्र तक सीमित कर देता।
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: उसे ... जो आरम्भ से है
  rationale: यह व्यक्तिवाचक और कालातीत वाक्यांश स्रोत की अस्पष्टता को सुरक्षित रखता है तथा अनकहे रूप से मसीह या परमेश्वर नाम नहीं जोड़ता।
- source_word: νεανίσκοι
  choice: हे जवानो
  rationale: यह पुरुषवाची बहुवचन का सीधा, वर्तमान और स्वाभाविक हिन्दी रूप है तथा 'पिताओ' से विरोध बनाए रखता है।
- source_word: ἰσχυροί
  choice: सामर्थी
  rationale: आत्मिक-नैतिक संदर्भ में यह गरिमापूर्ण और स्पष्ट है; 'बलवान' भी सम्भव है, पर 'सामर्थी' केवल शारीरिक बल का संकेत कम देता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह परिचित बाइबलीय अभिव्यक्ति है और परमेश्वर के संदेश तथा घोषित सुसमाचार के बीच अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: μένει
  choice: बना रहता है
  rationale: यह μένω की निरन्तरता को सहज आधुनिक हिन्दी में व्यक्त करता है; 'वास करता है' स्रोत में निहित न होने वाला निवास-रूपक अधिक प्रबल कर सकता है।
- source_word: νενικήκατε
  choice: विजय पा चुके हो
  rationale: यह यूनानी पूर्णकाल की पूरी हुई विजय और उसके वर्तमान परिणाम दोनों को स्पष्ट करता है।
- source_word: τὸν πονηρόν
  choice: उस दुष्ट
  rationale: लेखयुक्त पुरुषवाची रूप किसी व्यक्तिगत दुष्ट सत्ता की ओर संकेत करता है, न कि अमूर्त बुराई की ओर; 'उस' निश्चित और पहले से समझे जाने वाले विरोधी का भाव देता है।
theological_decisions:
- issue: '''जो आरम्भ से है'' का अभिप्रेत व्यक्ति'
  choice: पहचान को अंतर्निहित रखते हुए 'उसे ... जो आरम्भ से है'
  alternative: स्पष्ट रूप से 'मसीह को' या 'पुत्र को' कहना; अथवा इसे परमेश्वर के रूप में स्पष्ट करना
  rationale: यूहन्नाई भाषा में यह सम्भवतः पूर्व-अस्तित्ववान पुत्र की ओर संकेत करता है, पर पद स्वयं उसका नाम नहीं लेता। अनुवाद उसी धार्मिक तनाव और अस्पष्टता को सुरक्षित रखता है।
- issue: तीन सम्बोधित समूहों का लिंग और स्वरूप
  choice: बच्चो, पिताओ और जवानो
  alternative: तीनों को पूरी कलीसिया के लिंग-निरपेक्ष या केवल आत्मिक-परिपक्वता वाले वर्गों के रूप में प्रस्तुत करना
  rationale: यूनानी में पहला शब्द व्यापक पारिवारिक सम्बोधन है, जबकि अगले दो पुरुषवाची हैं। अनुवाद इनके रूप को समतल किए बिना सम्भावित रूपकात्मक अर्थ खुला रखता है।
- issue: '''उस दुष्ट'' का व्यक्तिगत या अमूर्त अर्थ'
  choice: व्यक्तिगत विरोधी—'उस दुष्ट'
  alternative: अमूर्त 'बुराई'
  rationale: τὸν πονηρόν का लेखयुक्त पुरुषवाची रूप इस प्रसंग में किसी व्यक्ति, परम्परागत रूप से शैतान, की ओर अधिक स्वाभाविक संकेत करता है; फिर भी अनुवाद उसका नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष सम्बोधन रखा गया है। 'हे' से त्रिस्तरीय अलंकारिक संरचना स्पष्ट होती है। पूर्णकाल के लिए 'जान चुके हो' और 'विजय पा चुके हो' चुने गए हैं, जबकि पत्र-लेखन के प्रसंग में 'मैंने ... लिखा है' वर्तमान प्रासंगिकता व्यक्त करता है।
