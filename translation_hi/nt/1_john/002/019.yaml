id: 1JN.2.19
reference: 1 John 2:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: hi
  text: वे हमारे बीच से निकल गए, पर वे हममें से नहीं थे; क्योंकि यदि वे हममें से होते, तो हमारे साथ बने रहते। पर यह इसलिए हुआ कि यह प्रकट हो जाए कि वे सभी हममें से नहीं हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: हमारे बीच से / हममें से
  rationale: पहली बार यह वाक्यांश समुदाय के बीच से बाहर जाने को व्यक्त करता है, इसलिए ‘हमारे बीच से’; बाद की बारों में संबंध और पहचान का भाव है, इसलिए ‘हममें से’। इससे संदर्भानुसार अर्थ स्वाभाविक रहता है और यूनानी पुनरावृत्ति का संबंध भी बना रहता है।
- source_word: ἐξῆλθαν
  choice: निकल गए
  rationale: यह बाहर जाने या प्रस्थान करने की सीधी क्रिया है। ‘निकल गए’ ठोस बिंब बनाए रखता है और क्रिया में स्वयं ‘विश्वास-त्याग’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: वे हममें से नहीं थे
  rationale: यह स्वाभाविक हिन्दी में संबंध अथवा सामुदायिक पहचान को व्यक्त करता है, पर ‘सच्चे विश्वासी नहीं थे’ जैसी व्याख्यात्मक धर्मवैज्ञानिक भाषा नहीं जोड़ता।
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: क्योंकि यदि वे हममें से होते
  rationale: यह अतीत की तथ्य-विरुद्ध शर्त को स्वाभाविक हिन्दी में व्यक्त करता है और ‘हममें से’ की संबंधसूचक भाषा बनाए रखता है।
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: तो हमारे साथ बने रहते
  rationale: ‘बने रहते’ μένω के टिके या कायम रहने के भाव को सहज हिन्दी में व्यक्त करता है और तथ्य-विरुद्ध परिणाम को ‘तो ... रहते’ संरचना से स्पष्ट करता है।
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: पर यह इसलिए हुआ कि यह प्रकट हो जाए
  rationale: यूनानी में मुख्य घटना संदर्भ से निहित है; ‘यह हुआ’ हिन्दी वाक्य को पूर्ण बनाता है। ‘प्रकट हो जाए’ निष्क्रिय φανερωθῶσιν के प्रकट या स्पष्ट किए जाने के भाव को सुरक्षित रखता है।
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: कि वे सभी हममें से नहीं हैं
  rationale: यह οὐ ... πάντες को ‘सभी नहीं’ के रूप में रखता है—अर्थात उल्लिखित लोगों में से कोई भी हममें से नहीं है—और हिन्दी में संभावित ‘कुछ हैं, कुछ नहीं’ वाली भ्रामक व्याप्ति से बचाता है।
theological_decisions:
- issue: क्या ‘ἐξ ἡμῶν’ को ऐसी भाषा में व्यक्त किया जाए जो दृश्य और अदृश्य समुदाय की सदस्यता अथवा उद्धार की स्थिति को निश्चित कर दे
  choice: ‘हममें से’ की संबंधसूचक सामुदायिक भाषा को बनाए रखना
  alternative: ‘वे कभी सच्चे विश्वासी नहीं थे’ या ‘वे वास्तव में कलीसिया के सदस्य नहीं थे’
  rationale: पद वास्तविक संबंध और बाहरी संगति के बीच भेद करता है, पर मूल यूनानी बाद की व्यवस्थित धर्मवैज्ञानिक श्रेणियाँ नहीं अपनाता। ‘हममें से’ मूल पाठ का तनाव सुरक्षित रखता है।
- issue: ἵνα खंड को स्पष्ट उद्देश्य या परिणाम के रूप में सीमित करना
  choice: ‘यह इसलिए हुआ कि’ द्वारा उद्देश्य/परिणाम का खुला संबंध रखना
  alternative: ‘परमेश्वर ने ऐसा इसलिए होने दिया कि’
  rationale: ἵνα उद्देश्य अथवा फल की दिशा दिखाता है, पर इस वाक्य में परमेश्वर को स्पष्ट कर्ता नहीं कहा गया। अनूदित पाठ निहित कर्ता को धर्मवैज्ञानिक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। ‘हमारे बीच से’ भौतिक-सामुदायिक प्रस्थान और ‘हममें से’ वास्तविक संबंध का भेद स्वाभाविक ढंग से व्यक्त करते हैं। कोई पादटिप्पणी आवश्यक नहीं; दिए गए अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न और उनकी स्थितियाँ असंगत हैं, इसलिए उन्हें हिन्दी मुख्य पाठ में नहीं अपनाया गया।
