source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: hi
  text: मैंने तुम्हें इसलिए नहीं लिखा है[a] कि तुम सत्य को नहीं जानते, बल्कि इसलिए कि तुम उसे जानते हो, और इसलिए भी कि कोई झूठ सत्य से उत्पन्न नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हें इसलिए नहीं लिखा।” यूनानी एओरिस्ट का अनुवाद सामान्य भूतकाल में भी किया जा सकता है; “लिखा है” इस पत्र के पाठकों के सामने अब मौजूद होने के संदर्भ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: मैंने ... लिखा है
  rationale: यूनानी एओरिस्ट को सामान्य भूतकाल में भी व्यक्त किया जा सकता है, पर पत्र के पाठकों के हाथ में अब मौजूद लिखित संदेश के संदर्भ में हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: οἴδατε
  choice: तुम ... जानते हो
  rationale: यह क्रिया स्थिर ज्ञान को व्यक्त करती है। ‘नहीं जानते’ और ‘जानते हो’ का सीधा विरोध यूनानी वाक्य के बल को बनाए रखता है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य को
  rationale: निश्चित उपपद और यूहन्ना की व्यापक शब्दावली को ध्यान में रखते हुए ‘सत्य’ रखा गया है; इसे ‘सुसमाचार’ या ‘सच्चा संदेश’ कहकर संकुचित नहीं किया गया।
- source_word: πᾶν ψεῦδος
  choice: कोई झूठ
  rationale: शाब्दिक संरचना ‘हर झूठ ... नहीं’ हिन्दी में ‘हर झूठ नहीं’ जैसा भ्रामक आंशिक निषेध जता सकती है। ‘कोई झूठ ... नहीं’ सार्वभौमिक निषेध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: सत्य से नहीं निकलता
  rationale: ἐκ स्रोत या उद्गम बताता है। ‘से नहीं निकलता’ सहज हिन्दी में यही संबंध व्यक्त करता है और झूठ तथा सत्य के विरोध को बनाए रखता है।
theological_decisions:
- issue: ‘सत्य’ का यूहन्नाई अर्थ
  choice: सत्य
  alternative: सच्चा संदेश; सुसमाचार का सत्य
  rationale: पद में ‘सत्य’ का अर्थ जानबूझकर व्यापक है। किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को जोड़ने के बजाय मूल अभिव्यक्ति की व्यापकता सुरक्षित रखी गई है।
- issue: झूठ और सत्य का संबंध
  choice: कोई झूठ सत्य से नहीं निकलता
  alternative: कोई झूठ सत्य से नहीं है
  rationale: ἐκ को स्रोत या उद्गम के रूप में व्यक्त किया गया है। इससे कथन को केवल सत्य के भीतर झूठ की अनुपस्थिति बताने वाले कथन में नहीं बदला जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; ‘तुम’ बहुवचन पाठक-समुदाय के लिए है। वाक्य की तर्कपूर्ण विरोधी संरचना—‘इसलिए नहीं ... बल्कि इसलिए’—मूल के अनुरूप रखी गई है।
