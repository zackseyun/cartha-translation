  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: hi
  text: प्रिय जनो, यदि हमारा हृदय[c] हमें दोषी नहीं ठहराता[a], तो परमेश्वर के सामने हमें निडर भरोसा होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हम पर दोष नहीं लगाता’ अथवा ‘हमारी निंदा नहीं करता’।
    reason: lexical_alternative
  - marker: b
    text: या ‘निडरता’ अथवा ‘आश्वस्तता’।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘हृदय’ से आशय मनुष्य का भीतरी व्यक्तित्व या नैतिक आत्म-बोध है; इसका भाव ‘विवेक’ या ‘अंतःकरण’ के निकट है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: यह बहुवचन संबोधन आत्मीय प्रेम प्रकट करता है। ‘प्रिय जनो’ आधुनिक, सहज और गरिमापूर्ण है तथा पत्र में बार-बार आने वाली प्रेम की भाषा से संबंध बनाए रखता है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह संभाव्य शर्त प्रस्तुत करता है; हिंदी में ‘यदि’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: ἡ καρδία
  choice: हमारा हृदय
  rationale: ‘हृदय’ स्रोत-पाठ के रूपक को सुरक्षित रखता है। प्रसंग में इसका आशय मनुष्य के भीतरी नैतिक आत्म-बोध से है, पर मुख्य पाठ में इसे सीधे ‘विवेक’ कहना अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: हमें दोषी नहीं ठहराता
  rationale: καταγινώσκω में किसी के विरुद्ध निर्णय देने, दोष लगाने या निंदा करने का भाव है। ‘दोषी ठहराता’ न्यायिक और नैतिक छाया को बनाए रखते हुए हिंदी में स्पष्ट है।
- source_word: παρρησίαν
  choice: भरोसा
  rationale: παρρησία खुलेपन, निडरता और आत्मविश्वास का बोध करा सकता है। परमेश्वर के सामने संबंधपरक स्थिति के लिए ‘भरोसा’ सहज है; वैकल्पिक अर्थ फुटनोट में दिए गए हैं।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर के सामने
  rationale: इस प्रसंग में πρός परमेश्वर के संबंध में या उसकी उपस्थिति में होने की स्थिति बताता है। ‘परमेश्वर के सामने’ हिंदी में स्वाभाविक है और नैतिक आत्म-परीक्षण के प्रसंग से मेल खाता है।
theological_decisions:
- issue: καρδία द्वारा सूचित भीतरी मानवीय पक्ष
  choice: हृदय
  alternative: विवेक या अंतःकरण
  rationale: ‘हृदय’ यूहन्ना की रूपकात्मक शब्दावली को सुरक्षित रखता है और इसे केवल आधुनिक मनोवैज्ञानिक अथवा नैतिक श्रेणी ‘विवेक’ तक सीमित नहीं करता। कार्यगत अर्थ फुटनोट में स्पष्ट किया गया है।
- issue: परमेश्वर के संबंध में παρρησία का भाव
  choice: परमेश्वर के सामने भरोसा
  alternative: परमेश्वर के सामने निडरता या आश्वस्तता
  rationale: ‘भरोसा’ परमेश्वर की उपस्थिति में खुले और निर्भय संबंध का भाव देता है, पर इसे भावनात्मक निश्चितता अथवा असम्मानपूर्ण दुस्साहस में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी, आत्मीय किंतु गरिमापूर्ण पत्रात्मक शैली। वाक्य-संरचना स्रोत के निकट रखी गई है, पर हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
