source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: hi
  text: और जो कोई यह आशा उस पर[a] रखता है, अपने आप को शुद्ध करता है, जैसे वह[b] शुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें यह आशा रखता है।” यूनानी वाक्यांश को ‘उस पर’ या ‘उसमें’ दोनों रूपों में अनूदित किया जा सकता है; दोनों में वही आशा का लक्ष्य व्यक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में “वह” का संकेत सबसे अधिक संभवतः पुत्र अर्थात मसीह की ओर है, यद्यपि यूनानी पाठ यहाँ केवल सर्वनाम देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: हर कोई जो … रखता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का सामान्य और निरंतर भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τὴν ἐλπίδα ταύτην
  choice: यह आशा
  rationale: संकेतवाचक शब्द पिछली आयतों में बताई गई आशा की ओर लौटता है; यहाँ आशा केवल इच्छा नहीं, बल्कि भरोसे से भरी प्रतीक्षा है।
- source_word: ἐπ’ αὐτῷ
  choice: उस पर
  rationale: ἐπί के साथ सम्प्रदान कारक आशा के लक्ष्य या आधार का भाव दे सकता है। ‘उस पर … आशा रखता है’ हिन्दी में स्वाभाविक है और आशा की दिशा स्पष्ट रखता है।
- source_word: ἁγνίζει ἑαυτὸν
  choice: अपने आप को शुद्ध करता है
  rationale: यह नैतिक शुद्धता की सक्रिय प्रक्रिया व्यक्त करता है और ἁγνός के साथ मूल पाठ का शब्द-संबंध बनाए रखता है।
- source_word: καθὼς
  choice: जैसे
  rationale: तुलना को सरल और स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: यूनानी संकेतवाचक सर्वनाम को किसी उपाधि से बदलने के बजाय सर्वनाम ही रखा गया है। हिन्दी में ‘वह’ स्वाभाविक है और संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: ἁγνός
  choice: शुद्ध
  rationale: नैतिक संदर्भ में उपयुक्त अर्थ देता है और ‘शुद्ध करता है’ के साथ मूल के सजातीय शब्द-संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: αὐτῷ और ἐκεῖνος का संदर्भ
  choice: दोनों को सर्वनामों ‘उस’ और ‘वह’ से अनूदित किया गया है; निकट संदर्भ में इनका सबसे स्वाभाविक संकेत पुत्र/मसीह की ओर है।
  alternative: αὐτῷ परमेश्वर पिता की ओर संकेत कर सकता है, अथवा पिता और पुत्र के बीच कुछ जानबूझकर अस्पष्टता बनी रह सकती है।
  rationale: पिछला संदर्भ उसे वैसा ही देखने की बात करता है जैसा वह है, जिससे मसीह का संकेत प्रबल होता है; फिर भी यूनानी पाठ कोई नाम या उपाधि नहीं देता। इसलिए अनुवाद उस तनाव को स्वयं हल नहीं करता।
- issue: ἑαυτὸν का सामान्य पुल्लिंग एकवचन रूप
  choice: ‘अपने आप को’
  alternative: ‘स्वयं को’
  rationale: हिन्दी का आत्मवाचक पद लिंग-भेद थोपे बिना यूनानी के आत्मवाचक अर्थ को ठीक प्रकार व्यक्त करता है; ‘हर कोई’ सामान्य व्यापकता को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शुद्ध करता है/शुद्ध है’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी ἁγνίζει/ἁγνός का अर्थ-संबंध बना रहे।
