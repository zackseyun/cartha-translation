  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: hi
  text: और तुम जानते हो कि वह पापों को दूर करने के लिए प्रकट हुआ; और उसमें पाप नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: पूर्ण-रूप οἶδα कोइने यूनानी में सामान्यतः वर्तमान अर्थ रखता है; यह स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: शाब्दिक अर्थ ‘वह व्यक्ति’ हो सकता है, पर यूहन्ना के इस संदर्भ में संकेत यीशु मसीह की ओर है; ‘वह’ संदर्भ को स्पष्ट रखते हुए अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐφανερώθη
  choice: प्रकट हुआ
  rationale: यह मसीह के ऐतिहासिक रूप से प्रकट होने को व्यक्त करता है और यूनानी कर्मवाच्य की ध्वनि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἵνα
  choice: इसलिए ... कि
  rationale: यह उद्देश्यसूचक बल को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁμαρτίας
  choice: पापों
  rationale: यूनानी में बहुवचन है; ‘पापों’ ठोस बहुलता को सुरक्षित रखता है।
- source_word: ἄρῃ
  choice: उठा ले
  rationale: αἴρω में उठाने, ले जाने और दूर करने की अर्थ-सीमा है। ‘उठा ले’ इस बहुअर्थकता को ‘दूर कर दे’ की तुलना में अधिक सुरक्षित रखता है; पादटिप्पणी सम्भव अर्थ स्पष्ट करती है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: एकवचन संज्ञा को सीधे ‘पाप’ कहना उसके नैतिक और व्यापक बल को बनाए रखता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह ἐν + दत्तिव का सीधा और स्वाभाविक हिन्दी रूप है तथा यूहन्ना की अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ἐκεῖνος का संदर्भ
  choice: यीशु मसीह की ओर संकेत करने वाला ‘वह’
  alternative: अधिक शाब्दिक ‘वह व्यक्ति’
  rationale: निकटवर्ती संदर्भ में पापों को उठाने के लिए प्रकट होने वाला और पापरहित व्यक्ति यीशु मसीह है। ‘वह’ इस मसीह-संबंधी संकेत को बनाए रखता है, पर नाम जोड़कर मूल से अधिक स्पष्ट नहीं करता।
- issue: पापों के साथ αἴρω का अर्थ
  choice: पापों को उठा लेना, जिसमें दूर करने और ले जाने दोनों की सम्भावना बनी रहती है
  alternative: केवल ‘पापों को दूर कर देना’ या ‘पापों को अपने ऊपर उठा लेना’
  rationale: क्रिया की अर्थ-सीमा हटाने और उठाकर ले जाने दोनों को समेट सकती है। मुख्य पाठ और पादटिप्पणी किसी एक प्रायश्चित-व्याख्या को अनावश्यक रूप से निश्चित किए बिना मूल की अर्थगत तथा धर्मवैज्ञानिक व्यापकता बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘प्रकट हुआ’ धार्मिक संदर्भ में परिचित होने के साथ आज भी बोधगम्य है। ‘उठा ले’ को जानबूझकर रखा गया है ताकि यूनानी क्रिया की वास्तविक अर्थ-व्याप्ति बनी रहे; पादटिप्पणी संभावित अर्थों को स्पष्ट करती है।
