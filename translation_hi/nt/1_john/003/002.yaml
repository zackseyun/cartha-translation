source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: hi
  text: प्रिय जनो, अब हम परमेश्वर की संतान हैं, और हम क्या होंगे, यह अब तक प्रकट नहीं हुआ है। हम जानते हैं कि यदि वह प्रकट हो, तो हम उसके समान होंगे, क्योंकि जैसा वह है, वैसा ही उसे देखेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन संबोधन का स्नेहपूर्ण भाव स्वाभाविक, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: νῦν
  choice: अब
  rationale: वर्तमान में प्राप्त संतान होने की स्थिति और भविष्य में प्रकट होनेवाली अवस्था के बीच का कालगत विरोध बनाए रखता है।
- source_word: τέκνα θεοῦ
  choice: परमेश्वर की संतान
  rationale: τέκνα के पारिवारिक संबंध को बिना अनावश्यक लिंग-विशेष के सहज हिन्दी में व्यक्त करता है।
- source_word: οὔπω ἐφανερώθη
  choice: अब तक प्रकट नहीं हुआ है
  rationale: φανερόω के प्रकट या प्रत्यक्ष होने के भाव और वर्तमान तक बनी स्थिति, दोनों को व्यक्त करता है।
- source_word: τί ἐσόμεθα
  choice: हम क्या होंगे
  rationale: विश्वासियों की भावी दशा या स्वरूप की ओर संकेत करनेवाले τί का सीधा अनुवाद है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: वर्तमान अर्थवाले क्रियारूप का सरल और सीधा हिन्दी रूप।
- source_word: ἐὰν φανερωθῇ
  choice: यदि वह प्रकट हो
  rationale: निहित कर्ता को निकट संदर्भ के अनुसार मसीह मानते हुए भी ἐὰν की शर्तात्मक अभिव्यक्ति और φανερόω की पहले प्रयोग से शब्दगत कड़ी सुरक्षित रखी गई है।
- source_word: ὅμοιοι αὐτῷ
  choice: उसके समान
  rationale: वास्तविक समानता व्यक्त करता है, पर पूर्ण अभिन्नता या तत्त्वगत एकरूपता का अर्थ नहीं जोड़ता।
- source_word: ὀψόμεθα αὐτὸν
  choice: हम उसे ... देखेंगे
  rationale: भविष्यकाल और प्रत्यक्ष कर्म, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: καθώς ἐστιν
  choice: वैसा ही ... जैसा वह है
  rationale: मसीह को उसकी वास्तविक अवस्था में देखने की तुलना और रीति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐὰν φανερωθῇ में निहित कर्ता का संदर्भ
  choice: 'कर्ता मसीह है: “यदि वह प्रकट हो।”'
  alternative: 'कर्ता विश्वासियों की भावी अवस्था भी समझा जा सकता है: “यदि वह प्रकट हो”; अथवा अधिक व्याख्यात्मक रूप में “जब वह प्रकट होगा।”'
  rationale: इसके बाद “उसके समान” और “उसे ... देखेंगे” आने के कारण मसीह सबसे स्वाभाविक संदर्भ है। फिर भी यूनानी में कर्ता स्पष्ट नहीं है, इसलिए वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: विश्वासियों की भावी समानता का स्वरूप
  choice: “उसके समान होंगे” मसीह से वास्तविक समानता बताता है, अभिन्नता नहीं।
  alternative: “ठीक वही हो जाएंगे जो वह है” जैसे अधिक प्रबल रूप।
  rationale: ὅμοιοι समानता दर्शाता है, एक ही सत्ता या तत्त्व हो जाना नहीं; इसलिए प्रतिज्ञात परिवर्तन की शक्ति को बनाए रखते हुए अभिन्नता का अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण और गरिमापूर्ण शैली रखी गई है। “प्रिय जनो” सामान्य पाठक के लिए “हे प्रियो” से अधिक स्वाभाविक है। “प्रकट” की पुनरावृत्ति मूल यूनानी में φανερόω की पुनरावृत्ति को जानबूझकर सुरक्षित रखती है।
