  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: hi
  text: क्योंकि यदि हमारा हृदय हमें दोषी ठहराता है[a], तो परमेश्वर हमारे हृदय से बड़ा है[b] और वह सब कुछ जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर दोष लगाता है” अथवा “हममें दोष पाता है।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर हमारे हृदय से बड़ा है” उसके हमारे बारे में अधिक पूर्ण ज्ञान की ओर संकेत कर सकता है और, निहित रूप से, अपने-आप को दोषी ठहराने पर उसके अधिकार की ओर भी।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: पहला ὅτι पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में “क्योंकि” इसका स्वाभाविक संकेत है।
- source_word: ἐὰν
  choice: यदि
  rationale: वर्तमान संभावनार्थक क्रिया के साथ यह एक शर्तसूचक स्थिति बताता है; “यदि” औपचारिक और सहज दोनों है।
- source_word: καταγινώσκῃ
  choice: दोषी ठहराता है
  rationale: यह क्रिया किसी के विरुद्ध दोष जानने, दोष लगाने या निंदा करने का भाव रखती है। “दोषी ठहराता है” हृदय के आंतरिक न्यायसूचक भाव को स्पष्ट रखता है।
- source_word: ἡ καρδία ἡμῶν
  choice: हमारा हृदय
  rationale: καρδία को व्याख्यात्मक रूप से “विवेक” बनाने के बजाय मूल रूपक “हृदय” बनाए रखा गया है।
- source_word: ὅτι
  choice: तो
  rationale: दूसरे ὅτι की व्याख्यात्मक अथवा कारणसूचक भूमिका को हिन्दी की शर्त-परिणाम संरचना “यदि…तो…” में स्वाभाविक रूप से व्यक्त किया गया है; इसे अलग से “कि” कहने पर वाक्य असहज होता।
- source_word: μείζων
  choice: बड़ा
  rationale: तुलनात्मक विशेषण को व्यापक रखा गया है; इसे केवल ज्ञान, दया या अधिकार तक सीमित नहीं किया गया।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए आधुनिक हिन्दी बाइबलीय गद्य में प्रतिष्ठित और गरिमापूर्ण शब्द।
- source_word: τῆς καρδίας ἡμῶν
  choice: हमारे हृदय से
  rationale: तुलनात्मक संबंध को हिन्दी में “से” द्वारा स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: γινώσκει πάντα
  choice: सब कुछ जानता है
  rationale: πάντα की सर्वसमावेशी व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: “परमेश्वर हमारे हृदय से बड़ा है” का आशय
  choice: कथन को व्यापक रखा गया है और अगले वाक्यांश में परमेश्वर के सर्वज्ञान को स्पष्ट किया गया है।
  alternative: इसे केवल परमेश्वर की दया, केवल उसके निर्णायक अधिकार, या केवल उसके अधिक पूर्ण ज्ञान के रूप में सीमित करना।
  rationale: यूनानी पाठ तुलना के सटीक पक्ष को नहीं बाँधता। “और सब कुछ जानता है” ज्ञान को विशेष रूप से प्रासंगिक बनाता है, पर “बड़ा” का अर्थ उससे अधिक व्यापक रह सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। “हृदय” का मूल रूपक सुरक्षित रखा गया है; “बड़ा” को व्याख्यात्मक विस्तार देकर संकीर्ण नहीं किया गया।
