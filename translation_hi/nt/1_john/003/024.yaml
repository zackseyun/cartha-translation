reference: 1 John 3:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: hi
  text: और जो उसकी आज्ञाओं का पालन करता है, वह उसमें बना रहता है[a], और परमेश्वर उसमें बना रहता है। और इसी से हम जानते हैं कि वह हममें बना रहता है—उस आत्मा से[b], जिसे उसने हमें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बना रहता है’ का अनुवाद ‘निवास करता है’ भी हो सकता है। यही यूनानी क्रिया इस पद में तीन बार आई है और निरंतर संबंध में रहने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस आत्मा के द्वारा’। यूनानी संबंधबोधक शब्द यहाँ स्रोत या आधार पर बल दे सकता है, और साधन का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: पालन करता है
  rationale: यह आज्ञाओं को मानने और उनका निष्ठापूर्वक पालन करने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘रखता है’ कहना यहाँ अस्पष्ट होता।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: यूहन्ना के लेखन में प्रयुक्त नैतिक और वाचागत बल को बनाए रखने के लिए ‘आज्ञाएँ’ उपयुक्त और परिचित शब्द है।
- source_word: μένει
  choice: बना रहता है
  rationale: यह बार-बार आने वाले यूहन्नाई क्रियापद की निरंतरता और संबंधपरक स्थायित्व को आधुनिक हिन्दी में व्यक्त करता है। पद में इसके तीनों प्रयोगों के लिए यही रूप रखा गया है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यूनानी सर्वनाम को संज्ञा ‘परमेश्वर’ से बदलने के बजाय सर्वनाम रखा गया है, ताकि मूल पाठ की संदर्भ-निर्भरता बनी रहे।
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह उस आधार या साधन की ओर संकेत करता है जिससे विश्वासियों को यह ज्ञान होता है; हिन्दी में यह स्वाभाविक है और आगे आने वाले आत्मा-संबंधी वाक्यांश से जुड़ता है।
- source_word: γινώσκομεν
  choice: हम जानते हैं
  rationale: वर्तमान ज्ञान या पहचान को सरल और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τοῦ πνεύματος
  choice: उस आत्मा के द्वारा
  rationale: ἐκ यहाँ ज्ञान के आधार अथवा साधन को सूचित कर सकता है। ‘के द्वारा’ मुख्य पाठ में इस संबंध को स्पष्ट करता है, जबकि स्रोत का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: संदर्भ परमेश्वर द्वारा दिए गए दिव्य आत्मा की ओर संकेत करता है। हिन्दी में बड़े अक्षर से भेद संभव नहीं है; ‘पवित्र’ जोड़ना मूल पद में अनुपस्थित विशेषण जोड़ देता।
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: जिसे उसने हमें दिया है
  rationale: ‘जिसे’ आत्मा के व्यक्तिगत संदर्भ के अनुकूल है। हिन्दी का पूर्ण वर्तमान ‘दिया है’ भूतकालीन दान के वर्तमान संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: αὐτῷ / αὐτός तथा ‘वह हममें बना रहता है’ में सर्वनामों का संदर्भ
  choice: मुख्य पाठ में ‘उसमें/वह’ सर्वनाम बनाए रखे गए हैं; संदर्भतः आज्ञा मानने वाला परमेश्वर में और परमेश्वर उसमें बना रहता है।
  alternative: ‘परमेश्वर’ को स्पष्ट रूप से जोड़ना, अथवा अंतिम वाक्यांश को मसीह के निवास के रूप में व्यक्त करना।
  rationale: निकटवर्ती संदर्भ परमेश्वर की आज्ञाओं और उसके द्वारा दिए गए आत्मा की ओर संकेत करता है, पर यूनानी पाठ स्वयं सर्वनामों का प्रयोग करता है। सर्वनाम बनाए रखने से मूल की संदर्भ-निर्भरता और व्यापक यूहन्नाई धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: πνεῦμα की पहचान
  choice: ‘आत्मा’ को परमेश्वर द्वारा दिए गए दिव्य आत्मा के संदर्भ में समझा गया है।
  alternative: मानवीय आत्मा या सामान्य आध्यात्मिक प्रभाव।
  rationale: ‘जिसे उसने हमें दिया है’ और यूहन्नाई संदर्भ दिव्य आत्मा की ओर संकेत करते हैं। फिर भी मूल में ἅγιον (‘पवित्र’) न होने के कारण हिन्दी पाठ में ‘पवित्र’ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पालन करता है’ आज्ञाकारिता को स्पष्ट करता है; ‘बना रहता है’ यूहन्ना के प्रमुख संबंधपरक पद की पुनरावृत्ति बचाता है। सर्वनामों को संज्ञाओं से बदलकर धर्मवैज्ञानिक संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया है।
