id: 1JN.3.12
reference: 1 John 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: hi
  text: कैन के समान न हों,[a] जो उस दुष्ट से था और जिसने अपने भाई की हत्या कर दी। और उसने उसकी हत्या क्यों की?[b] क्योंकि उसके काम बुरे थे, पर उसके भाई के काम धर्मी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई से।” यूनानी अभिव्यक्ति का अमूर्त अर्थ भी संभव है, पर यूहन्ना के लेखन में यह प्रायः व्यक्तिगत दुष्ट सत्ता को सूचित करती है।
    reason: alternative_reading
  - marker: b
    text: या “उसे काट डाला” या “मार डाला।” यूनानी क्रिया सामान्य “हत्या” से अधिक हिंसक और चित्रात्मक है, जिसका शाब्दिक प्रयोग वध करने के लिए भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: कैन के समान नहीं
  rationale: नकारात्मक तुलना को स्वाभाविक हिन्दी में रखता है और पिछले संदर्भ की निषेधात्मक प्रेरणा से जुड़ता है।
- source_word: ἐκ τοῦ πονηροῦ
  choice: उस दुष्ट से
  rationale: ἐκ के स्रोत अथवा उत्पत्ति के भाव को बनाए रखता है; यूहन्नाई प्रयोग में सविशेषण पद प्रायः व्यक्तिगत दुष्ट की ओर संकेत करता है।
- source_word: ἔσφαξεν
  choice: हत्या कर दी
  rationale: हिन्दी में जान-बूझकर हिंसक रूप से मार डालने का स्वाभाविक अर्थ देता है; यूनानी क्रिया अधिक चित्रात्मक है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: χάριν τίνος
  choice: क्यों
  rationale: कारण पूछने वाली यूनानी अभिव्यक्ति का सीधा और सहज आधुनिक हिन्दी रूप।
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: उसके अपने काम बुरे थे
  rationale: ἔργα के नैतिक अर्थ को सरल हिन्दी में व्यक्त करता है और αὐτοῦ के विरोधात्मक बल को 'अपने' से उभारता है।
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: पर उसके भाई के काम धर्मी थे
  rationale: यूनानी में निहित 'काम' को हिन्दी में स्पष्ट करना स्वाभाविक है; δίκαια का नैतिक-धार्मिक भाव 'धर्मी' से सुरक्षित रहता है।
theological_decisions:
- issue: τοῦ πονηροῦ व्यक्तिगत 'दुष्ट' है या निराकार 'बुराई'
  choice: 'व्यक्तिगत: ''उस दुष्ट से'''
  alternative: 'निराकार: ''बुराई से'''
  rationale: यूहन्नाई साहित्य में सविशेषण ὁ πονηρός सामान्यतः व्यक्तिगत दुष्ट को सूचित करता है, जबकि वास्तविक भाषिक संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'उस दुष्ट' व्यक्तिगत संदर्भ को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है। यूनानी ἔσφαξεν की हिंसक तीव्रता को मुख्य पाठ में स्वाभाविक 'हत्या कर दी' और बिना अलग चिह्न की आवश्यकता के निर्णय-विवरण में दर्ज किया गया है।
