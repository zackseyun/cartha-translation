id: 1JN.3.10
reference: 1 John 3:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: hi
  text: इसी से परमेश्वर की संतान और शैतान की संतान साफ़ पहचानी जाती हैं:[a] जो कोई धार्मिकता नहीं करता,[b] वह परमेश्वर से नहीं है; और जो अपने भाई से प्रेम नहीं करता, वह भी परमेश्वर से नहीं है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी में” अथवा “इसी आधार पर।” यूनानी पदबंध उस आधार या कसौटी की ओर संकेत कर सकता है जिससे यह भेद पहचाना जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय।” यहाँ यूनानी शब्द का अर्थ धार्मिकता या न्याय हो सकता है, पर इस नैतिक विरोध में “धार्मिकता” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने भाई या बहन से,” अर्थात् अपने साथी विश्वासी से। यूनानी में पुल्लिंग एकवचन “अपने भाई” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह पदबंध उस आधार या कसौटी की ओर संकेत करता है जिससे दोनों समूहों का भेद पहचाना जाता है। ‘इसी से’ स्वाभाविक हिन्दी में साधन और निष्कर्ष, दोनों की संभावित छाया बनाए रखता है।
- source_word: φανερά ἐστιν
  choice: साफ़ पहचानी जाती हैं
  rationale: विशेषण का अर्थ प्रकट या स्पष्ट होना है। सन्दर्भ में पहचानने योग्य भेद पर बल है, इसलिए यह आधुनिक और सहज अभिव्यक्ति चुनी गई।
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: परमेश्वर की संतान और शैतान की संतान
  rationale: ‘संतान’ मूल के पारिवारिक और आत्मिक सम्बन्ध के रूपक को सुरक्षित रखता है तथा हिन्दी में सामूहिक अर्थ भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: जो कोई धार्मिकता के काम नहीं करता
  rationale: वर्तमान कृदन्त यहाँ व्यक्ति के लाक्षणिक आचरण को दर्शाता है। ‘धार्मिकता के काम नहीं करता’ हिन्दी में लगातार या विशिष्ट व्यवहार का भाव देता है, न कि केवल एक घटना का।
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: वह परमेश्वर से नहीं है
  rationale: ἐκ स्रोत, उत्पत्ति या सम्बन्ध का संकेत देता है। ‘परमेश्वर से नहीं है’ इस अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: वह भी नहीं, जो अपने भाई से प्रेम नहीं करता
  rationale: दूसरे कृदन्त में पहले खण्ड का ‘परमेश्वर से नहीं है’ निहित है। हिन्दी में ‘वह भी नहीं’ इस समानान्तर नकार को स्पष्ट करता है; ‘अपने भाई’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
theological_decisions:
- issue: नैतिक और आत्मिक पहचान के लिए पारिवारिक भाषा
  choice: परमेश्वर की संतान और शैतान की संतान
  alternative: परमेश्वर के लोग और शैतान के लोग
  rationale: मूल पाठ स्पष्ट रूप से संतान की भाषा इस्तेमाल करता है। इसे बनाए रखने से यूहन्ना का आत्मिक सम्बन्ध और पहचान का रूपक सुरक्षित रहता है।
- issue: δικαιοσύνη का नैतिक अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस निकट सन्दर्भ में शब्द परमेश्वर के अनुरूप सही आचरण को दर्शाता है; केवल सामाजिक या न्यायिक न्याय तक सीमित नहीं है। फिर भी शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- issue: ἀδελφός का लिंग और सामुदायिक विस्तार
  choice: अपने भाई
  alternative: अपने भाई या बहन / साथी विश्वासी
  rationale: मूल रूप पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसे सुरक्षित रखा गया है। सन्दर्भ में इसका विस्तार साथी विश्वासियों तक हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘साफ़ पहचानी जाती हैं’ सामान्य पाठक के लिए स्वाभाविक है; ‘संतान’, ‘धार्मिकता’ और ‘परमेश्वर से’ मूल की प्रमुख धर्मवैज्ञानिक तथा सम्बन्धपरक भाषा को सुरक्षित रखते हैं।
