  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: hi
  text: जो कोई पाप करता है[a], वह व्यवस्था का उल्लंघन भी करता है; और पाप व्यवस्था का उल्लंघन है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई पाप करता रहता है।” यूनानी वर्तमान रूप का सीधा अनुवाद “करता है” है; संदर्भ में यह निरंतर या चारित्रिक आचरण का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “व्यवस्था का उल्लंघन” के लिए यूनानी शब्द का अनुवाद “अधर्म,” “व्यवस्थाहीनता,” या अधिक शाब्दिक रूप से “कानूनविहीनता” भी किया जा सकता है। यूनानी में दोनों संज्ञाओं के साथ निश्चित लेख है, पर हिन्दी में इस प्रकार के परिभाषात्मक कथन में उसकी अलग अभिव्यक्ति स्वाभाविक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: जो कोई पाप करता रहता है
  rationale: संज्ञायुक्त वर्तमान कृदंत का सामान्य और संदर्भतः निरंतर अथवा चारित्रिक भाव है। ‘करता रहता है’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे किसी तकनीकी ‘आदतन काल’ के रूप में कठोरता से परिभाषित नहीं करता।
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: वह व्यवस्था का विरोध भी करता है
  rationale: ποιεῖ पहले ‘करता रहता है’ के समानांतर क्रिया को बनाए रखता है। ἀνομία को ‘व्यवस्था का विरोध’ कहना νόμος से उसके संबंध और विद्रोही भाव को सुरक्षित रखता है, जबकि ‘अधर्म’ उस संबंध को अस्पष्ट कर सकता है और ‘व्यवस्था का उल्लंघन’ अर्थ को केवल नियम-भंग तक सीमित कर सकता है।
- source_word: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: पाप व्यवस्था का विरोध है
  rationale: यह परिभाषात्मक कथन है। हिन्दी में अमूर्त संज्ञाओं के साथ लेख की आवश्यकता नहीं होती। अनुवाद मूल की सीधी और तनावपूर्ण समानता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: वर्तमानकालिक ποιῶν को एक अलग घटना या निरंतर/चारित्रिक आचरण के रूप में व्यक्त करना
  choice: निरंतर अथवा चारित्रिक भाव—‘करता रहता है’
  alternative: साधारण रूप—‘करता है’ या ‘पाप करता है’
  rationale: निकटवर्ती संदर्भ में वर्तमान रूप चल रहे या चारित्रिक आचरण की ओर संकेत कर सकता है। ‘करता रहता है’ इस पहलू को सामने लाता है, फिर भी इसका अर्थ यह नहीं ठहराता कि पद किसी एक पापपूर्ण कार्य की चर्चा कर ही नहीं सकता।
- issue: ἀνομία का अर्थ
  choice: व्यवस्था का विरोध
  alternative: अधर्म; व्यवस्था का उल्लंघन; व्यवस्थाहीनता
  rationale: यह चुनाव ‘व्यवस्था’ से शब्द का संबंध और पाप के विद्रोही स्वरूप को बनाए रखता है। यह बिना पाठगत आधार के ‘व्यवस्था’ को केवल मूसा की व्यवस्था, नागरिक कानून, या किसी विशेष धार्मिक संहिता तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जो कोई’ सामान्य और समावेशी है। ‘व्यवस्था का विरोध’ साधारण पाठक के लिए बोधगम्य रहते हुए मूल ἀνομία और νόμος के शब्दगत संबंध को यथासंभव सुरक्षित रखता है।
