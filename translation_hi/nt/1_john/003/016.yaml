id: 1JN.3.16
reference: 1 John 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: hi
  text: इसी से हमने प्रेम को जाना है कि उसने हमारे लिए अपना जीवन दे दिया; और हमें भी भाई-बहनों के लिए अपने जीवन दे देने चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह पद उस आधार या माध्यम का परिचय देता है जिससे प्रेम पहचाना गया; ‘इसी से’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी अभिव्यक्ति की व्याख्यात्मक शक्ति बनाए रखता है।
- source_word: ἐγνώκαμεν
  choice: हमने ... जाना है
  rationale: पूर्णकाल भूतकाल में हुई पहचान और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है; हिन्दी का ‘जाना है’ इस स्थायी बोध को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: यह ἀγάπη का सीधा, प्रतिष्ठित और सामान्य हिन्दी समतुल्य है।
- source_word: ἐκεῖνος
  choice: उसने
  rationale: यूनानी सर्वनाम का संकेत प्रसंग में यीशु की ओर है; केवल ‘उसने’ रखने से संदर्भ पहचान कराता है और अनुवाद मूल से अधिक स्पष्ट नहीं होता।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: यह लाभार्थक और प्रतिनिधिक आत्मदान का भाव रखता है, पर प्रायश्चित के किसी विशिष्ट सिद्धान्त को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: अपना जीवन दे दिया
  rationale: इस योहन्नाई मुहावरे में ψυχή का अर्थ ‘जीवन’ है और वाक्यांश स्वेच्छापूर्ण आत्मबलिदान बताता है; हिन्दी में ‘जीवन दे दिया’ स्पष्ट और स्वाभाविक है।
- source_word: ὀφείλομεν
  choice: हमें ... चाहिए
  rationale: यह नैतिक दायित्व व्यक्त करता है; ‘हमें भी ... चाहिए’ आधुनिक हिन्दी में कर्तव्य का स्वाभाविक और पर्याप्त रूप है।
- source_word: τῶν ἀδελφῶν
  choice: भाई-बहनों
  rationale: यूनानी पुल्लिंग बहुवचन कलीसियाई प्रसंग में सहविश्वासियों के सामूहिक समुदाय को सूचित करता है, जिसमें स्त्रियाँ भी सम्मिलित हैं; हिन्दी में ‘भाई-बहनों’ अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: τὰς ψυχὰς θεῖναι
  choice: अपने जीवन दे देने
  rationale: पहले आए आत्मदान के मुहावरे के साथ संगति रखता है; बहुवचन τὰς ψυχὰς का अर्थ समुदाय के सदस्यों के अलग-अलग जीवन हैं।
theological_decisions:
- issue: ἐκεῖνος का संदर्भ
  choice: मुख्य पाठ में ‘उसने’, जिसका संदर्भ प्रसंग से यीशु है
  alternative: नाम स्पष्ट करके ‘यीशु ने’ अथवा अधिक शाब्दिक ‘उस व्यक्ति ने’
  rationale: योहन्नाई प्रसंग और ‘जीवन दे दिया’ का समानांतर प्रयोग यीशु को संदर्भित करता है। सर्वनाम बनाए रखना यूनानी की अभिव्यक्ति और प्रसंगगत पहचान दोनों को सुरक्षित रखता है।
- issue: ἀδελφῶν का दायरा
  choice: ‘भाई-बहनों’—सभी सहविश्वासियों के लिए
  alternative: रूपगत रूप से ‘भाइयों’
  rationale: यद्यपि यूनानी संज्ञा व्याकरणतः पुल्लिंग बहुवचन है, इस कलीसियाई संदर्भ में यह विश्वासियों के समुदाय को सामूहिक रूप से दर्शाती है। हिन्दी में केवल ‘भाइयों’ से अनचाहा पुरुष-मात्र अर्थ निकल सकता है।
- issue: ὑπέρ में आत्मदान का स्वरूप
  choice: ‘हमारे लिए’
  alternative: ‘हमारे स्थान पर’ या ‘हमारी ओर से’
  rationale: मूल में दूसरों के हित में आत्मदान का गहरा भाव है, पर यह पद अकेले किसी एक प्रायश्चित-सिद्धान्त को पूरी तरह परिभाषित नहीं करता; ‘हमारे लिए’ उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों खंडों में ‘जीवन दे देना’ की पुनरावृत्ति जानबूझकर रखी गई है, ताकि मसीह के प्रेम और विश्वासियों के दायित्व के बीच मूल पाठ का समानांतर स्पष्ट रहे।
