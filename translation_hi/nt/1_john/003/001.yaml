id: 1JN.3.1
reference: 1 John 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: hi
  text: देखो, पिता ने हमें कैसा प्रेम दिया है[a] कि हम परमेश्वर की संतान कहलाएँ—और हम हैं[b]। इसी कारण संसार हमें नहीं जानता[c], क्योंकि उसने उसे नहीं जाना[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किस प्रकार का प्रेम।” यहाँ यूनानी अभिव्यक्ति पिता के प्रेम के प्रकार और गुण पर विस्मय प्रकट करती है, केवल उसकी महानता पर नहीं।
    reason: lexical_alternative
  - marker: b
    text: कुछ हस्तलिपियों में “और हम हैं” नहीं है।
    reason: textual_variant
  - marker: c
    text: या, “हमें नहीं पहचानता।” इसी प्रकार आगे, “उसे नहीं पहचाना।”
    reason: lexical_alternative
  - marker: d
    text: “उसे” से इस पद में सबसे स्वाभाविक रूप से पिता का संकेत मिलता है; कुछ लोग यूहन्नाई सन्दर्भ में इसे मसीह का संकेत समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक यहाँ ध्यान आकर्षित करने वाला आह्वान है; ‘देखो’ आधुनिक, सहज और सीधा है।
- source_word: ποταπὴν ἀγάπην
  choice: कैसा प्रेम
  rationale: यह पदबंध प्रेम की केवल मात्रा नहीं, बल्कि उसके विलक्षण प्रकार और गुण पर विस्मय व्यक्त करता है।
- source_word: δέδωκεν
  choice: दिया है
  rationale: यूनानी पूर्णकाल अतीत में दिए गए प्रेम के बने रहने वाले परिणाम को सूचित करता है; हिन्दी पूर्ण रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूहन्नाई प्रयोग में यह परमेश्वर के लिए निश्चित संबोधन है; ‘पिता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τέκνα θεοῦ
  choice: परमेश्वर की संतान
  rationale: τέκνα लिंग-समावेशी है; ‘संतान’ स्त्री-पुरुष दोनों को समेटते हुए सम्बन्ध का भाव बनाए रखता है।
- source_word: κληθῶμεν
  choice: कहलाएँ
  rationale: ἵνα के बाद का कर्मवाच्य संभावनार्थक रूप उद्देश्य/परिणाम को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ἐσμέν
  choice: और हम हैं
  rationale: यह संक्षिप्त रूप यूनानी पाठ की जोरदार पुष्टि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: पूर्व कथन से निकलने वाले कारणात्मक सम्बन्ध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्नाई धार्मिक अर्थ की व्याख्या मुख्य पाठ में आरोपित किए बिना मूल रूपक और शब्दावली को सुरक्षित रखता है।
- source_word: οὐ γινώσκει ἡμᾶς
  choice: हमें नहीं जानता
  rationale: γινώσκω के मूल ‘जानना’ अर्थ और अगले समानान्तर वाक्यांश को बनाए रखता है; ‘पहचानता’ सम्भव अर्थ के रूप में पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: ‘उसे’ का निकटतम संदर्भ पिता/परमेश्वर
  alternative: मसीह
  rationale: इस पद में निकटतम स्पष्ट पूर्वपद ‘पिता’ है, पर व्यापक यूहन्नाई सन्दर्भ में कुछ लोग इसे मसीह समझते हैं; हिन्दी सर्वनाम मूल की औपचारिक अस्पष्टता को बनाए रखता है और विकल्प पादटिप्पणी में है।
- issue: καὶ ἐσμέν का समावेश
  choice: मुख्य पाठ में ‘और हम हैं’
  alternative: वाक्यांश का लोप
  rationale: SBLGNT इसे मुख्य पाठ में रखता है और यह वास्तविक स्थिति की जोरदार पुष्टि करता है; कुछ हस्तलिपियों का लोप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। ‘कैसा प्रेम’ विस्मय और गुणात्मक बल को रखता है। ‘संतान’ लिंग-समावेशी है। विराम-चिह्न वाक्य के जोर और कारणात्मक प्रवाह को स्पष्ट करते हैं।
