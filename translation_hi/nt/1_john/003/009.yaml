id: 1JN.3.9
reference: 1 John 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: hi
  text: हर कोई जो परमेश्वर से जन्मा है, पाप करने की रीति पर नहीं चलता[a], क्योंकि परमेश्वर का बीज उसमें बना रहता है[b]; और वह पाप की रीति पर चलता नहीं रह सकता[c], क्योंकि वह परमेश्वर से जन्मा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘पाप नहीं करता’ या ‘पाप करता नहीं।’ यहाँ यूनानी वर्तमानकाल संभवतः किसी एक कार्य के बजाय पाप करते रहने या उसे जीवन की रीति बनाने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसमें स्थिर रहता है।’
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, ‘वह पाप नहीं कर सकता।’ प्रसंग में यूनानी वर्तमानकालीन infinitive का अर्थ संभवतः ‘पाप करता नहीं रह सकता’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: हर कोई जो … जन्मा है
  rationale: यह पदबंध एक सार्वभौमिक वर्ग को सूचित करता है। ‘जन्मा है’ पूर्णकाल के उस भाव को बनाए रखता है जिसमें जन्म की घटना का परिणाम वर्तमान में बना हुआ है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἐκ यहाँ जन्म के स्रोत को व्यक्त करता है। आधुनिक हिन्दी में ‘परमेश्वर से जन्मा’ स्वाभाविक रूप से इसी स्रोत-संबंध को बताता है।
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: पाप करता नहीं रहता
  rationale: ποιεῖ वर्तमानकाल में है और आगे के ἁμαρτάνειν के साथ मिलकर पाप के चलते रहने या जीवन की नियमित रीति बनने का संकेत देता है। यह अनुवाद किसी एक पापपूर्ण कार्य की संभावना को पाठ से अधिक कठोरता से नकारता नहीं।
- source_word: σπέρμα αὐτοῦ
  choice: परमेश्वर का बीज
  rationale: σπέρμα के ठोस रूपक ‘बीज’ को बनाए रखा गया है। ‘परमेश्वर का’ सर्वनाम के अभिप्रेत पूर्वपद को हिन्दी में स्पष्ट करता है, पर बीज किस वस्तु का प्रतीक है, इसका निर्णय नहीं करता।
- source_word: ἐν αὐτῷ μένει
  choice: उसमें बना रहता है
  rationale: μένει का स्थायित्व और निरंतरता का भाव वर्तमान, सहज हिन्दी में ‘बना रहता है’ से व्यक्त होता है।
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: वह पाप करता रह नहीं सकता
  rationale: वर्तमानकालीन infinitive ἁμαρτάνειν को प्रसंगानुसार जारी रहने वाली क्रिया के रूप में व्यक्त किया गया है। साथ ही अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: γεγέννηται
  choice: जन्मा है
  rationale: यूनानी पूर्णकाल पूर्व जन्म और उसके बने हुए परिणाम को दिखाता है; हिन्दी का पूर्ण रूप ‘जन्मा है’ इसे स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या पद पूर्णतः पापरहित होने की शिक्षा देता है या नए जन्म के साथ निरंतर पापमय आचरण की असंगति बताता है
  choice: मुख्य पाठ में निरंतर पाप करते रहने को नए जन्म के साथ असंगत बताया गया है।
  alternative: ‘वह पाप नहीं कर सकता’—अर्थात किसी भी एक पाप को करने की पूर्ण असमर्थता।
  rationale: ποιεῖ और ἁμαρτάνειν के वर्तमानकालीन रूप तथा 1 यूहन्ना 1:8–2:1 का व्यापक प्रसंग निरंतर या अभ्यस्त आचरण की ओर संकेत करते हैं। अधिक शाब्दिक विकल्प को पादटिप्पणी में रखकर मूल पाठ का तनाव सुरक्षित रखा गया है।
- issue: ‘परमेश्वर के बीज’ का अभिप्राय
  choice: ‘बीज’ का रूपक बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे परमेश्वर का वचन, जीवन या स्वभाव कहकर स्पष्ट करना।
  rationale: σπέρμα का सटीक प्रतीकात्मक संदर्भ पद में नहीं बताया गया है; किसी एक व्याख्या को मुख्य पाठ में रखने से अनावश्यक धर्मवैचारिक निष्कर्ष जुड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। ‘बीज’ जैसे मूल रूपक को सुरक्षित रखा गया है और ‘स्थिर रहता है’ जैसे अधिक पारंपरिक विकल्प को पादटिप्पणी में दिया गया है।
