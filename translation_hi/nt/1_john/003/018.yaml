revisions:
- from: हे छोटे बच्चो, हम केवल शब्दों या जीभ से प्रेम न करें, बल्कि काम और सच्चाई में प्रेम करें।
  to: हे छोटे बच्चो, हम केवल शब्दों या जीभ से प्रेम न करें, बल्कि कार्य और सच्चाई में प्रेम करें।
  rationale: The revision changes only “काम” to “कार्य.” It preserves the affectionate plural address, the first-person plural exhortation, the literal tongue imagery, the strong contrast, and the theological and semantic breadth of “सच्चाई.” “केवल” is retained as a natural Hindi expression of the contrast between love that is merely verbal and love demonstrated in deed and truth.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:45:50Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the hortatory first-person plural, the contrast between verbal and enacted love, and retains the open Johannine sense of ἀλήθεια as “सच्चाई.” However, “काम ... में प्रेम” is not an idiomatic or sufficiently clear Hindi rendering of ἐν ἔργῳ.
  naturalness: “हे छोटे बच्चो” is an understandable affectionate address, and the overall register is appropriate. Replacing “काम” with “कार्य” avoids the modern Hindi association of “काम” with employment or a task and gives the concluding contrast a clearer, more dignified expression.
  terminology: “सच्चाई” appropriately preserves ἀλήθεια without reducing it to mere sincerity. “कार्य” is a safer rendering of ἔργον here than “काम.”
  issues:
  - severity: medium
    issue: “काम और सच्चाई में प्रेम करें” is awkward and potentially ambiguous.
    rationale: In modern Hindi, “काम” commonly denotes work, employment, or a particular task. In this construction it does not naturally communicate love expressed through concrete deeds. “कार्य” better represents ἔργῳ while retaining the source’s singular, general sense.
  revised_text: हे छोटे बच्चो, हम केवल शब्दों या जीभ से प्रेम न करें, बल्कि कार्य और सच्चाई में प्रेम करें।
