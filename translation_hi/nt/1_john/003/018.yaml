id: 1JN.3.18
reference: 1 John 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: hi
  text: हे छोटे बच्चो, हम केवल शब्दों या जीभ से प्रेम न करें, बल्कि कार्य और सच्चाई में प्रेम करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τεκνία
  choice: हे छोटे बच्चो
  rationale: संबोधन का बहुवचन और स्नेहपूर्ण लघुतासूचक भाव बनाए रखता है; आधुनिक हिन्दी में आत्मीय संबोधन के रूप में स्वाभाविक है।
- source_word: μὴ ἀγαπῶμεν
  choice: हम ... प्रेम न करें
  rationale: μή के साथ वर्तमान संभावनार्थक क्रिया के प्रथम-पुरुष बहुवचन उपदेशात्मक भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λόγῳ
  choice: शब्दों
  rationale: यहाँ λόγος का आशय मौखिक अभिव्यक्ति से है। बहुवचन 'शब्दों' हिन्दी में स्वाभाविक है और केवल कहने तथा करने के बीच विरोध स्पष्ट करता है।
- source_word: μηδὲ τῇ γλώσσῃ
  choice: या जीभ से
  rationale: γλῶσσα के ठोस रूपक को बनाए रखता है, जबकि हिन्दी में 'जीभ से' बोलने का बोध सहज रूप से देता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: मात्र मौखिक प्रेम और व्यवहार में प्रकट प्रेम के बीच प्रबल विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἔργῳ
  choice: काम ... में
  rationale: ἔργον के कर्म या कार्य के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है; 'कर्म' की अपेक्षा 'काम' अधिक सहज है और यहाँ किसी विशिष्ट धार्मिक अर्थ को नहीं जोड़ता।
- source_word: καὶ ἀληθείᾳ
  choice: और सच्चाई में
  rationale: ἀλήθεια का मूल अर्थ और यूहन्नाई धार्मिक गहराई सुरक्षित रखता है; इसे केवल 'ईमानदारी' या 'सच्चे मन' तक सीमित नहीं करता।
theological_decisions:
- issue: ‘काम और सच्चाई में’ में ‘सच्चाई’ का आशय
  choice: सच्चाई
  alternative: सच्चे मन से / ईमानदारी से
  rationale: मूल शब्द ἀλήθεια प्रामाणिकता का भाव दे सकता है, पर यूहन्ना के लेखन में इसका अर्थ केवल आंतरिक निष्कपटता से व्यापक है। 'सच्चाई' वास्तविक प्रेम और परमेश्वर की सच्चाई के अनुरूप प्रेम—दोनों संभावनाएँ खुली रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'हे छोटे बच्चो' लेखक की स्नेहपूर्ण पारिवारिक वाणी को बनाए रखता है। 'केवल' यूनानी में अलग शब्द के रूप में नहीं है, पर निषेध और ‘बल्कि’ के विरोध में निहित मात्रता को हिन्दी में स्पष्ट करता है।
