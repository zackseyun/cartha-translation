source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: hi
  text: बच्चों, कोई तुम्हें धोखा न दे[a]। जो धार्मिकता[b] का आचरण करता है, वह धर्मी है, ठीक वैसे ही जैसे वह[c] धर्मी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई तुम्हें भटका न दे।”
    reason: lexical_alternative
  - marker: b
    text: या “न्याय”; यहाँ आशय धर्मी व्यक्ति के अनुरूप सीधे और उचित आचरण से है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “वह वाला”; संभवतः मसीह की ओर संकेत है, यद्यपि कुछ लोग इसे परमेश्वर का संदर्भ मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: बच्चो
  rationale: यह स्नेहपूर्ण संबोधन है। आधुनिक हिन्दी में “बच्चो” स्वाभाविक रूप से पारिवारिक निकटता व्यक्त करता है; “छोटे बच्चो” अनावश्यक रूप से शारीरिक आयु पर बल दे सकता है।
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: कोई तुम्हें धोखा न दे
  rationale: निषेधात्मक आज्ञा को सहज हिन्दी में रखा गया है। πλανάω में धोखा देने और भटका देने, दोनों का भाव संभव है; मुख्य पाठ में झूठी शिक्षा से धोखा खाने का आशय उपयुक्त है।
- source_word: ὁ ποιῶν
  choice: जो ... का आचरण करता है
  rationale: वर्तमानकालिक कृदंत यहाँ किसी एक कार्य के बजाय लगातार या चरित्रगत व्यवहार को दर्शाता है; “आचरण करता है” इस पक्ष को स्पष्ट करता है।
- source_word: τὴν δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ शब्द का आशय धर्मी होने के अनुरूप सीधा और उचित आचरण है। “धार्मिकता” अगले शब्द δίκαιος के अनुवाद “धर्मी” से वैचारिक संबंध बनाए रखता है।
- source_word: δίκαιός ἐστιν
  choice: धर्मी है
  rationale: यह व्यक्ति के नैतिक चरित्र या स्थिति को बताता है और δικαιοσύνη के साथ मूल पाठ का निकट संबंध बनाए रखता है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: तुलना और अनुरूपता की शक्ति को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: मूल यूनानी में संकेतवाचक सर्वनाम है। हिन्दी का “वह” स्वाभाविक रहते हुए उसके दिव्य संदर्भ को मुख्य पाठ में अनावश्यक रूप से “मसीह” या “परमेश्वर” बनाकर निश्चित नहीं करता।
theological_decisions:
- issue: ἐκεῖνος का संदर्भ
  choice: मुख्य पाठ में अस्पष्टता बनाए रखते हुए “वह”
  alternative: “मसीह” अथवा “परमेश्वर” को स्पष्ट रूप से लिखना
  rationale: निकट संदर्भ और 1 यूहन्ना में समान प्रयोग मसीह की ओर संकेत करने की संभावना बढ़ाते हैं, पर परमेश्वर को संदर्भ मानना भी संभव है। इसलिए मूल पाठ का तनाव और खुलापन सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “बच्चो” स्नेहपूर्ण संबोधन है; “धार्मिकता का आचरण” चरित्रगत व्यवहार को व्यक्त करता है। सर्वनाम “वह” जानबूझकर मूल संदर्भगत अस्पष्टता को सुरक्षित रखता है।
