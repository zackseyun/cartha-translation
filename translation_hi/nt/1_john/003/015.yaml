id: 1JN.3.15
reference: 1 John 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: hi
  text: जो कोई अपने भाई[a] से घृणा करता है, वह हत्यारा है; और तुम जानते हो कि किसी भी हत्यारे में अनन्त जीवन बना नहीं रहता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में ‘भाई’ से सम्भवतः कोई साथी विश्वासी अभिप्रेत है; यूनानी शब्द पुल्लिंग एकवचन है।
    reason: cultural_note
  - marker: b
    text: या ‘उसमें वास नहीं करता।’ यूनानी क्रिया μένω यूहन्ना के लेखन का एक प्रमुख शब्द है, जिसका अर्थ ‘बने रहना,’ ‘स्थिर रहना’ या ‘वास करना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: जो कोई ... से घृणा करता है
  rationale: संज्ञात्मक वर्तमान कृदन्त एक सामान्य वर्ग और चारित्रिक आचरण व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से ‘जो कोई ... करता है’ से व्यक्त होता है।
- source_word: ἀδελφὸν αὐτοῦ
  choice: अपने भाई
  rationale: यूनानी पद पुल्लिंग एकवचन है। ‘अपने भाई’ स्रोत-रूप को बनाए रखता है, जबकि प्रसंग में विश्वासियों के समुदाय की सम्भावित व्याप्ति पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἀνθρωποκτόνος
  choice: हत्यारा
  rationale: यह आधुनिक हिंदी का स्वाभाविक और नैतिक बल बनाए रखने वाला समतुल्य है।
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: द्वितीय पुरुष बहुवचन को आधुनिक मानक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: किसी भी हत्यारे में ... नहीं
  rationale: निषेध सहित सार्वत्रिक कथन का अर्थ ‘कोई हत्यारा नहीं’ है; यह रचना हिंदी में स्पष्ट और स्वाभाविक है तथा यूनानी के सार्वत्रिक बल को बनाए रखती है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यूहन्ना के साहित्य में यह मानक और प्रसंगानुकूल पद है, जो जीवन की अनन्त अवधि और उसके गुणात्मक धार्मिक आशय दोनों को खुला रखता है।
- source_word: ἐν αὐτῷ μένουσαν
  choice: उसमें ... बना नहीं रहता
  rationale: μένω के टिके रहने या बने रहने के निरन्तर भाव को आधुनिक हिंदी में व्यक्त करता है; इसके यूहन्नाई पारिभाषिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘भाई’ की व्याप्ति
  choice: मुख्य पाठ में ‘अपने भाई’ रखा गया है।
  alternative: अपने भाई या बहन; किसी साथी विश्वासी
  rationale: निकट प्रसंग विश्वासियों के पारस्परिक प्रेम से सम्बन्धित है, पर यूनानी शब्द पुल्लिंग एकवचन है। अनुवाद इस रूप को बनाए रखता है और सम्भावित सामुदायिक अर्थ को पादटिप्पणी में बताता है।
- issue: यूहन्नाई μένω का अनुवाद
  choice: ‘बना ... रहता’
  alternative: ‘वास करता’; ‘स्थिर रहता’
  rationale: यह निरन्तर उपस्थिति के विचार को सहज आधुनिक हिंदी में रखता है, बिना किसी एक पारम्परिक धर्मशास्त्रीय शब्दावली को अनिवार्य बनाए।
- issue: निषेध का दायरा
  choice: ‘किसी भी हत्यारे में ... नहीं’
  alternative: ‘हर हत्यारे में ... नहीं’
  rationale: यूनानी πᾶς ... οὐκ का आशय प्रसंग में किसी भी हत्यारे के भीतर अनन्त जीवन न होने से है। चुनी हुई हिंदी अस्पष्ट अथवा आंशिक निषेध का अनचाहा अर्थ उत्पन्न नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घृणा,’ ‘हत्यारा’ और ‘अनन्त जीवन’ मूल कथन का नैतिक तथा धर्मशास्त्रीय बल बनाए रखते हैं; अर्धविराम दोनों निकट सम्बन्धित कथनों को स्पष्ट रूप से जोड़ता है।
