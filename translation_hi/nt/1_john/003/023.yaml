id: 1JN.3.23
reference: 1 John 3:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: hi
  text: और उसकी आज्ञा यह है कि हम उसके पुत्र यीशु मसीह के नाम पर विश्वास करें और एक-दूसरे से प्रेम करें, जैसा उसने हमें आज्ञा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: आज्ञा
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और यूनानी शब्द की अधिकारपूर्ण शक्ति बनाए रखता है। दोनों प्रयोगों में इसी शब्द-मूल को रखकर पद की पुनरुक्ति सुरक्षित की गई है।
- source_word: ἵνα πιστεύσωμεν
  choice: कि हम ... विश्वास करें
  rationale: यहाँ ἵνα मुख्य आज्ञा की विषय-वस्तु बताता है; हिन्दी विधिलिंग आज्ञात्मक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πιστεύω τῷ ὀνόματι
  choice: नाम पर विश्वास करें
  rationale: πιστεύω के साथ सम्प्रदान कारक उस व्यक्ति की ओर निर्देशित विश्वास को व्यक्त करता है जिसका परिचय और अधिकार नाम में प्रकट है। 'नाम पर विश्वास करना' हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: υἱοῦ
  choice: पुत्र
  rationale: सन्दर्भ में यह परमेश्वर के पुत्र यीशु को दर्शाता है; हिन्दी में 'पुत्र' गरिमापूर्ण और सटीक है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός का शीर्षकीय अर्थ 'मसीह' से सुरक्षित रहता है, जबकि पूरा पदबंध आधुनिक हिन्दी में स्वाभाविक रूप से 'यीशु मसीह' कहा जाता है।
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: एक-दूसरे से प्रेम रखें
  rationale: यह पारस्परिक और निरन्तर सामुदायिक प्रेम को सहज हिन्दी में व्यक्त करता है।
- source_word: καθὼς
  choice: जैसा
  rationale: यह पहले कही गई आज्ञा और दी गई आज्ञा के अनुरूप सम्बन्ध को संक्षेप और स्वाभाविक रूप से दिखाता है।
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: उसने हमें आज्ञा दी है
  rationale: यूनानी में शब्दशः 'उसने हमें आज्ञा दी' है। हिन्दी में यही मुहावरेदार रूप है और आरम्भ के 'आज्ञा' से शाब्दिक सम्बन्ध बनाए रखता है। पूर्ण वर्तमान सन्दर्भगत स्थायी प्रासंगिकता को व्यक्त करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की मसीही उपाधि को दर्शाता है। हिन्दी में 'मसीह' अर्थपूर्ण, प्रचलित और शीर्षकीय बल को सुरक्षित रखने वाला रूप है।
- issue: πιστεύω τῷ ὀνόματι का आशय
  choice: नाम पर विश्वास करें
  alternative: नाम पर भरोसा रखें
  rationale: यह केवल नाम-संज्ञा को सत्य मानना नहीं, बल्कि उस नाम द्वारा प्रकट व्यक्ति पर विश्वास करना है। अनुवाद मूल की संक्षिप्तता और यूहन्नाई धार्मिक भाषा दोनों बनाए रखता है।
- issue: एकवचन ἐντολή और उसके दो अंग
  choice: एक आज्ञा के रूप में विश्वास और प्रेम दोनों
  alternative: दो अलग आज्ञाएँ
  rationale: मूल पाठ एकवचन 'आज्ञा' के बाद विश्वास करने और प्रेम रखने—दोनों को उसकी विषय-वस्तु के रूप में जोड़ता है; अनुवाद इस तनाव को बिना व्याख्यात्मक विभाजन के सुरक्षित रखता है।
- issue: अन्तिम ἔδωκεν का कर्ता
  choice: उसने
  alternative: स्पष्ट रूप से 'यीशु ने' या 'परमेश्वर ने'
  rationale: यूनानी सर्वनामरहित क्रिया का कर्ता प्रसंग से समझा जाता है और उसमें सम्भावित सन्दर्भगत तनाव है। किसी नाम को जोड़कर अस्पष्टता को कृत्रिम रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। 'यीशु मसीह' हिन्दी में स्वाभाविक पदबंध है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ मूल की प्रमुख अर्थगत और सन्दर्भगत विशेषताओं को पर्याप्त रूप से सुरक्षित रखता है।
