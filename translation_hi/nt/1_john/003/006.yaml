  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: hi
  text: जो कोई उसमें बना रहता है, वह पाप नहीं करता[a]; जो कोई पाप करता है, उसने न तो उसे देखा है, न ही उसे जाना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वैकल्पिक रूप से, “पाप नहीं करता … जो कोई पाप करता है।” यहाँ प्रयुक्त यूनानी वर्तमानकाल के रूप जारी या चरित्रगत आचरण को भी व्यक्त कर सकते हैं; इसलिए इसका अर्थ “पाप करता नहीं रहता … जो कोई पाप करता रहता है” हो सकता है।
    reason: यूनानी वर्तमानकाल के सामान्य और जारी/चरित्रगत अर्थों की वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: πᾶς ὁ
  choice: जो कोई
  rationale: यह सव्ययी पद किसी भी ऐसे व्यक्ति को सामान्य और सार्वभौमिक रूप से दर्शाता है; ‘जो कोई’ स्वाभाविक आधुनिक हिन्दी में इस व्यापकता को बनाए रखता है।
- source_word: ἐν αὐτῷ μένων
  choice: उसमें बना रहता है
  rationale: μένω निरंतर बने रहने और संबंध में स्थिर रहने का भाव रखता है। ‘उसमें’ मूल के संबंध/एकता-सूचक रूप को स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: οὐχ ἁμαρτάνει
  choice: पाप नहीं करता
  rationale: यूनानी वर्तमानकाल का औपचारिक रूप रखा गया है। संदर्भ में यह जारी या चरित्रगत आचरण का बोध करा सकता है; उस संभावित अर्थ को पादटिप्पणी में दिया गया है ताकि मूल की अस्पष्टता बनी रहे।
- source_word: ὁ ἁμαρτάνων
  choice: जो कोई पाप करता है
  rationale: वर्तमान कृदंत को पहले खंड के समान सामान्य वर्तमान से व्यक्त किया गया है। इसके जारी या आदतन अर्थ की संभावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: उसने न तो उसे देखा है
  rationale: पूर्णकाल को वर्तमान परिणाम सहित ‘देखा है’ से व्यक्त किया गया है और सर्वनाम को यथावत रखा गया है।
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: न ही उसे जाना है
  rationale: γινώσκω यहाँ केवल बौद्धिक जानकारी नहीं, बल्कि संबंधपरक पहचान भी व्यक्त कर सकता है। ‘जाना है’ उस अर्थ-क्षेत्र को खुला रखता है और οὐδέ की संयुक्त नकारात्मकता को ‘न ही’ से दर्शाता है।
- source_word: αὐτῷ / αὐτόν
  choice: उसमें / उसे
  rationale: यूनानी पाठ यहाँ सर्वनाम ही रखता है; इसलिए उसके संदर्भ को ‘परमेश्वर’, ‘पुत्र’ या ‘मसीह’ कहकर अधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: क्या यह पद विश्वासियों की पूर्ण पापहीनता सिखाता है
  choice: मुख्य पाठ में सामान्य वर्तमान ‘पाप नहीं करता / पाप करता है’ रखा गया है और पादटिप्पणी में जारी या चरित्रगत आचरण की संभावना बताई गई है।
  alternative: ‘पाप करता नहीं रहता / पाप करता रहता है’ कहकर आदतन अर्थ को मुख्य पाठ में स्पष्ट करना।
  rationale: यूनानी वर्तमान रूप जारी या चरित्रगत आचरण व्यक्त कर सकते हैं, विशेषकर 1 यूहन्ना 1:8–2:2 के संदर्भ में; फिर भी यह अर्थ केवल कालरूप से निर्विवाद रूप से सांकेतिक नहीं है। मुख्य पाठ और पादटिप्पणी मिलकर मूल की नैतिक तीव्रता तथा व्याकरणिक अस्पष्टता दोनों सुरक्षित रखते हैं।
- issue: ‘उसे/उसमें’ का संदर्भ
  choice: सर्वनाम को ‘उसमें’ और ‘उसे’ के रूप में बनाए रखा गया है।
  alternative: उसे ‘परमेश्वर’, ‘पुत्र’ या ‘मसीह’ के रूप में स्पष्ट करना।
  rationale: निकटवर्ती संदर्भ में पिता और पुत्र दोनों की चर्चा है, जबकि इस पद का यूनानी पाठ सर्वनाम का प्रयोग करता है। किसी एक संदर्भ को अनावश्यक रूप से निश्चित करना मूल से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘बना रहता है’ यूहन्ना-साहित्य के प्रमुख μένω शब्द का निरंतर संबंध वाला भाव देता है। वाक्य की समानांतर संरचना और दोनों पूर्णकालीन क्रियाओं की संयुक्त नकारात्मकता को स्पष्ट रखा गया है।
