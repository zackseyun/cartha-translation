lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह साधन या आधार का संकेत देता है; ‘इसी से’ यूनानी पदबंध के संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γνωσόμεθα
  choice: हम जानेंगे
  rationale: भविष्यत्काल का सीधा और स्वाभाविक अनुवाद; रूप अपने आप में ‘जानने लगेंगे’ का भाव अनिवार्य नहीं करता।
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: हम सत्य से हैं
  rationale: ἐκ स्रोत, उत्पत्ति या संबंध का भाव दे सकता है। यह अनुवाद मूल अभिव्यक्ति की खुली अर्थ-सीमा को बचाता है और उसे ‘हम सत्य के हैं’ जैसे अधिक व्याख्यात्मक कथन में नहीं बदलता।
- source_word: ἔμπροσθεν αὐτοῦ
  choice: उसके सामने
  rationale: स्थान-संबंधी अभिव्यक्ति का निकट और स्वाभाविक अनुवाद; प्रसंग में ‘उसकी उपस्थिति में’ भी संभव है।
- source_word: πείσομεν
  choice: आश्वस्त करेंगे
  rationale: हृदय को कर्म बनाकर प्रयुक्त πείθω यहाँ भीतर भरोसा दिलाने या शांत करने का भाव रख सकता है। ‘आश्वस्त करेंगे’ आधुनिक हिन्दी में स्वाभाविक है, जबकि मूल के ‘मनाएँगे’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν καρδίαν ἡμῶν
  choice: अपने हृदय को
  rationale: यूनानी में ‘हृदय’ एकवचन है। हिन्दी में बहुवचन कर्ता के साथ ‘अपने हृदय को’ स्वाभाविक है और मूल संख्या भी बनाए रखता है।
theological_decisions:
- issue: ‘सत्य से हैं’ का यूहन्नाई अर्थ
  choice: स्रोत-संबंधी अभिव्यक्ति ‘सत्य से हैं’ को बनाए रखना
  alternative: हम सत्य के हैं / हम सत्य के पक्ष के हैं
  rationale: पद स्वयं इस संबंध को पूरी तरह परिभाषित नहीं करता; अधिक स्पष्ट doctrinal अर्थ जोड़ने के बजाय मूल का तनाव और अस्पष्टता बनाए रखी गई है।
- issue: हृदय के साथ πείσομεν का अर्थ
  choice: अपने हृदय को आश्वस्त करेंगे
  alternative: अपने हृदय को मनाएँगे
  rationale: निकटवर्ती प्रसंग परमेश्वर के सामने आंतरिक निश्चय से जुड़ा है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, पर शाब्दिक ‘मनाएँगे’ को पादटिप्पणी में दिया गया है ताकि अर्थ को अनावश्यक रूप से बंद न किया जाए।
