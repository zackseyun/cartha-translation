source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: hi
  text: पर जिसके पास संसार की संपत्ति हो और वह अपने भाई को आवश्यकता में देखे[a], फिर भी उसके प्रति अपना हृदय बंद कर ले[b], तो उसमें परमेश्वर का प्रेम कैसे बना रहता है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ से यहाँ प्रतिनिधिक रूप में किसी भाई या बहन, अर्थात किसी सहविश्वासी, का बोध हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उससे अपनी करुणा रोक ले’; शाब्दिक अर्थ है, ‘अपने भीतर के अंगों को उसके लिए बंद कर ले’—यह हार्दिक करुणा रोक लेने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: ‘परमेश्वर का प्रेम’ का अर्थ उसमें विद्यमान परमेश्वर का प्रेम या परमेश्वर के प्रति उसका प्रेम हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: संसार की संपत्ति
  rationale: βίος यहाँ जीवन के साधनों या भौतिक संपत्ति का बोध कराता है; जरूरतमंद भाई के संदर्भ में यह स्वाभाविक और स्पष्ट है।
- source_word: θεωρῇ
  choice: देखे
  rationale: यह प्रत्यक्ष रूप से किसी की दशा देखने और उससे अवगत होने का सरल, स्वाभाविक अर्थ देता है।
- source_word: ἀδελφὸν
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग एकवचन है; मुख्य पाठ में उसी रूप को रखा गया है, जबकि उसका प्रतिनिधिक व्यापक अर्थ पादटिप्पणी में बताया गया है।
- source_word: χρείαν ἔχοντα
  choice: आवश्यकता में
  rationale: शाब्दिक भाव ‘आवश्यकता रखते हुए’ है; ‘आवश्यकता में’ आधुनिक हिन्दी में स्वाभाविक ढंग से अभाव की स्थिति व्यक्त करता है।
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: उसके प्रति अपने हृदय को बंद कर ले
  rationale: σπλάγχνα शाब्दिक रूप से भीतरी अंग और मुहावरे में गहरी करुणा का केंद्र है। यह अनुवाद जानबूझकर करुणा रोक लेने की रूपकात्मक शक्ति बनाए रखता है।
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: यह रूप यूनानी संबंधकारक की अस्पष्टता बनाए रखता है—अर्थ परमेश्वर का मनुष्य के प्रति प्रेम अथवा मनुष्य का परमेश्वर के प्रति प्रेम हो सकता है।
- source_word: μένει ἐν αὐτῷ
  choice: उसमें ... बना रहता है
  rationale: μένω यूहन्ना के लेखन का प्रमुख शब्द है; ‘बना रहता है’ उसके निरंतर निवास या स्थायित्व का सुबोध हिन्दी रूप है।
theological_decisions:
- issue: ‘परमेश्वर का प्रेम’ में संबंधकारक की अस्पष्टता
  choice: परमेश्वर का प्रेम
  alternative: परमेश्वर की ओर से प्रेम / परमेश्वर के प्रति प्रेम
  rationale: यूनानी पदबंध दोनों अर्थों की संभावना रखता है और यूहन्ना की विचारधारा में पाए तथा प्रकट किए गए प्रेम जुड़े हुए हैं; इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई है।
- issue: ἀδελφὸν का लिंग और प्रतिनिधिक प्रयोग
  choice: भाई
  alternative: भाई या बहन / सहविश्वासी
  rationale: मूल शब्द पुल्लिंग एकवचन है। व्यापक प्रतिनिधिक प्रयोग को मुख्य पाठ में व्याख्यात्मक रूप से बदलने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘हृदय को बंद कर लेना’ मूल शारीरिक मुहावरे की रूपकात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। सभी व्याख्यात्मक विकल्प पादटिप्पणियों में रखे गए हैं।
