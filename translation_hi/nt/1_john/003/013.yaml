  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: hi
  text: भाइयो[a], यदि संसार तुमसे घृणा करता है, तो आश्चर्य मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ मूल भाषा के पुल्लिंग बहुवचन रूप का अनुवाद है; यहाँ यह सम्भवतः स्त्रियों सहित विश्वासियों के पूरे समुदाय को संबोधित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: आश्चर्य मत करो
  rationale: μή के साथ वर्तमानकालिक आज्ञार्थक क्रिया निषेध व्यक्त करती है। ‘आश्चर्य मत करो’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ θαυμάζω का भाव स्पष्ट रूप से पहुँचाता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यह ἀδελφός का पुल्लिंग बहुवचन संबोधन है। ‘भाइयो’ स्रोत के व्याकरणिक रूप को बनाए रखता है; पूरे विश्वासी समुदाय, जिसमें स्त्रियाँ भी सम्मिलित हैं, की संभावित समावेशिता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: εἰ
  choice: यदि
  rationale: यह सामान्य शर्तसूचक अव्यय है। ‘यदि’ वास्तविक मानी जा रही परिस्थिति की संभावना को खुला रखता है और उसे चुपचाप ‘जब’ में नहीं बदलता।
- source_word: μισεῖ
  choice: घृणा करता है
  rationale: वर्तमानकालिक कर्तृवाच्य निर्देशार्थक रूप को हिन्दी के सामान्य वर्तमानकाल में रखा गया है, जो लगातार या सामान्य वास्तविकता दोनों व्यक्त कर सकता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना के लेखन में κόσμος प्रायः परमेश्वर के विरोध में खड़ी मानव-व्यवस्था का भाव रखता है। ‘संसार’ उसकी व्यापकता और धार्मिक तनाव को बनाए रखता है, बिना मुख्य पाठ में व्याख्यात्मक विस्तार जोड़े।
theological_decisions:
- issue: ἀδελφοί में प्रतिनिधिक पुल्लिंग संबोधन
  choice: मुख्य पाठ में ‘भाइयो’ रखा गया
  alternative: ‘भाइयो और बहनो’ या ‘विश्वासी साथियो’
  rationale: मूल का पुल्लिंग बहुवचन रूप सुरक्षित रखा गया है, जबकि इस संभावना को कि संबोधन पूरे विश्वासी समुदाय के लिए है, पाद-टिप्पणी में बताया गया है।
- issue: κόσμος का यूहन्नाई अर्थ
  choice: ‘संसार’
  alternative: ‘परमेश्वर-विरोधी संसार’ या ‘संसार की व्यवस्था’
  rationale: ‘संसार’ मूल शब्द की धार्मिक व्यापकता और संदर्भगत अर्थ को सुरक्षित रखता है; विस्तार करने से पाठ में ऐसी व्याख्या जुड़ जाती जो यूनानी में स्पष्ट रूप से लिखी नहीं है।
- issue: εἰ की शर्तसूचक शक्ति
  choice: ‘यदि’
  alternative: ‘जब’
  rationale: ‘यदि’ यूनानी की वास्तविक शर्तसूचक अभिव्यक्ति को बनाए रखता है। ‘जब’ कहना इस शर्त को निश्चित समयगत घटना के रूप में अधिक स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामुदायिक संबोधन वाला रूप अपनाया गया है। हिन्दी की स्वाभाविक शर्तीय रचना ‘यदि…तो…’ प्रयोग की गई है।
