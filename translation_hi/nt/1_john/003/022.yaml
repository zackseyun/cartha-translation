source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: hi
  text: और जो कुछ भी हम माँगते हैं, वह हमें उससे मिलता है, क्योंकि हम उसकी आज्ञाओं का पालन करते हैं और वह करते हैं जो उसकी दृष्टि में उसे प्रसन्न करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: जो कुछ भी
  rationale: अनिश्चित संबंधवाचक रचना का स्वाभाविक हिन्दी अर्थ ‘जो कुछ भी’ है।
- source_word: αἰτῶμεν
  choice: हम माँगते हैं
  rationale: प्रार्थना और विनती के प्रसंग में ‘माँगना’ सहज और सटीक है।
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: वह हमें उससे मिलता है
  rationale: यह सामान्य वर्तमान काल और पाने के स्रोत—‘उससे’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι स्पष्ट रूप से कारण बताता है; इसलिए कारणात्मक संबंध को बनाए रखा गया है।
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: हम उसकी आज्ञाओं का पालन करते हैं
  rationale: ‘पालन करना’ आज्ञाओं को मानने और बनाए रखने के अर्थ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ ἀρεστὰ ... ποιοῦμεν
  choice: वही करते हैं जो उसे प्रसन्न करता है
  rationale: यह मूल के व्यापक नैतिक अर्थ को बिना अनावश्यक विस्तार के सहज हिन्दी में रखता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह मूल अभिव्यक्ति के ‘सामने/दृष्टि में’ अर्थ को निकटता से बनाए रखता है; वैकल्पिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: प्रार्थना का उत्तर मिलने और आज्ञापालन के बीच संबंध
  choice: ‘क्योंकि’ के द्वारा मूल पाठ का स्पष्ट कारणात्मक संबंध बनाए रखा गया है।
  alternative: संबंध को केवल सामान्य संगति के रूप में व्यक्त करना या कारणात्मक बल को कम करना।
  rationale: यूनानी ὅτι यहाँ कारण देता है। अनुवाद न तो इस तनाव को कमजोर करता है, न इसे प्रार्थना के उत्तर का यांत्रिक सूत्र बनाकर समझाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। परमेश्वर के लिए आदरसूचक अर्थ बनाए रखते हुए सामान्य हिन्दी सर्वनाम-प्रयोग अपनाया गया है।
