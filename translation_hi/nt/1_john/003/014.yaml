  choice: मुख्य पाठ में ‘भाई-बहनों’, और फुटनोट में यूनानी के शाब्दिक ‘भाइयों’ का उल्लेख
  alternative: मुख्य पाठ में केवल ‘भाइयों’
  rationale: यूनानी रूप पुल्लिंग बहुवचन है, किंतु 1 यूहन्ना के सामुदायिक संदर्भ में इसका आशय सामान्यतः सभी सहविश्वासियों से है। आधुनिक हिन्दी में ‘भाई-बहनों’ से संभावित समावेशी आशय स्पष्ट होता है, जबकि फुटनोट स्रोत-रूप के प्रति पारदर्शिता रखता है।
- issue: ‘मृत्यु’ और ‘जीवन’ की प्रकृति
  choice: ‘मृत्यु’ और ‘जीवन’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘आत्मिक मृत्यु’ और ‘अनन्त जीवन’ अथवा ‘मृत्यु के क्षेत्र’ और ‘जीवन के क्षेत्र’
  rationale: पद एक गहरे धर्मवैज्ञानिक परिवर्तन को संक्षिप्त रूपक में व्यक्त करता है, पर इन संज्ञाओं को स्वयं अधिक विशिष्ट नहीं करता। विस्तार जोड़ना मूल से आगे जाकर तनाव और व्यापकता को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सुबोध किंतु गरिमापूर्ण। ‘मृत्यु से निकलकर जीवन में आ गए हैं’ स्रोत के गमन-रूपक और पूर्ण काल के वर्तमान परिणाम को स्वाभाविक हिन्दी में रखता है। मुख्य पाठ में समावेशी सामुदायिक आशय स्पष्ट किया गया है और फुटनोट यूनानी के व्याकरणिक रूप को दर्ज करता है।
