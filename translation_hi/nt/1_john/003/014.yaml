base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: hi
  text: हम जानते हैं कि हम मृत्यु से निकलकर जीवन में आ गए हैं, क्योंकि हम भाइयों[a] से प्रेम करते हैं। जो प्रेम नहीं करता, वह मृत्यु में बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘भाइयों’; इस संदर्भ में सम्भवतः इसका आशय सामान्य रूप से सहविश्वासियों, अर्थात भाई और बहन दोनों, से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: यूनानी का पूर्ण रूप οἶδα कोइने यूनानी में वर्तमान स्थिति व्यक्त करता है; इसलिए वर्तमानकालीन हिन्दी स्वाभाविक और सटीक है।
- source_word: μεταβεβήκαμεν
  choice: हम ... निकलकर ... में आ गए हैं
  rationale: पूर्ण काल एक पूरी हो चुकी यात्रा और उसके बने हुए परिणाम—अब जीवन में होना—दोनों को व्यक्त करता है। यह हिन्दी रचना गमन के रूपक को सहज ढंग से बनाए रखती है।
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: मृत्यु से निकलकर जीवन में
  rationale: ἐκ...εἰς एक क्षेत्र से बाहर निकलकर दूसरे में प्रवेश करने की गति दर्शाते हैं; ‘से निकलकर ... में’ दोनों दिशाओं को स्पष्ट रखता है।
- source_word: ἀγαπῶμεν
  choice: हम ... से प्रेम करते हैं
  rationale: वर्तमानकाल यहाँ निरंतर चारित्रिक व्यवहार बताता है; ‘प्रेम करते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοὺς ἀδελφούς
  choice: भाई-बहनों
  rationale: ἀδελφούς व्याकरणतः पुल्लिंग बहुवचन है, पर इस सामुदायिक संदर्भ में मसीही विश्वासियों—स्त्री और पुरुष दोनों—के लिए प्रतिनिधिक रूप से प्रयुक्त है। हिन्दी में ‘भाई-बहनों’ से आशय स्पष्ट होता है; शाब्दिक रूप फुटनोट में दिया गया है।
- source_word: ὁ μὴ ἀγαπῶν
  choice: जो प्रेम नहीं करता
  rationale: लेखयुक्त वर्तमान कृदंत किसी सामान्य प्रकार या चारित्रिक व्यक्ति को बताता है; यह हिन्दी रूप सामान्य एकवचन अर्थ को सहजता से व्यक्त करता है।
- source_word: μένει
  choice: बना रहता है
  rationale: μένω निरंतर स्थिति को दर्शाता है। ‘बना रहता है’ सुबोध है और यूहन्ना के स्थायित्व संबंधी भाव को बनाए रखता है।
- source_word: ἐν τῷ θανάτῳ
  choice: मृत्यु में
  rationale: यह रूपकात्मक वाक्यांश मृत्यु के क्षेत्र में जारी रहने को बताता है; संक्षिप्त अनुवाद मूल की अस्पष्टता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
