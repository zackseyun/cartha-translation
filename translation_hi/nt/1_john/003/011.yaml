base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: hi
  text: 'क्योंकि यही वह संदेश है जिसे तुमने आरम्भ से सुना है: कि हम एक-दूसरे से प्रेम करें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि हम एक-दूसरे से प्रेम करें”; अथवा, “आओ, हम एक-दूसरे से प्रेम करें।”
    reason: ἵνα के विषयवस्तु-सूचक, प्रयोजनात्मक और प्रोत्साहनात्मक बल के बीच सम्भव अर्थभेद को सुरक्षित रखना।
lexical_decisions:
- source_word: Ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: यही वह संदेश है
  rationale: ‘यही’ यूनानी संकेतवाचक की बलवत्ता बनाए रखता है, और ‘संदेश’ ἀγγελία का स्पष्ट, वर्तमान हिन्दी समतुल्य है।
- source_word: ἣν ἠκούσατε
  choice: जिसे तुमने सुना है
  rationale: यूनानी में क्रिया सामान्य भूतकाल में है; हिन्दी का पूर्ण रूप प्राप्त शिक्षा की वर्तमान प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: यह यूहन्ना-साहित्य की परिचित अभिव्यक्ति है और समयगत आरम्भ का अर्थ संक्षेप तथा गरिमा से बनाए रखती है।
- source_word: ἵνα ἀγαπῶμεν
  choice: कि हम ... प्रेम करें
  rationale: यह रचना संदेश की विषयवस्तु तथा उसकी नैतिक अपेक्षा दोनों व्यक्त करती है; हिन्दी में संभावनार्थक क्रिया आदेशात्मक बल को कठोर प्रत्यक्ष आज्ञा बनाए बिना सुरक्षित रखती है।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: यह पारस्परिक प्रेम के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους का बल
  choice: संदेश की विषयवस्तु के रूप में ‘कि हम एक-दूसरे से प्रेम करें’
  alternative: ‘ताकि हम एक-दूसरे से प्रेम करें’ या ‘आओ, हम एक-दूसरे से प्रेम करें’
  rationale: संदर्भ मुख्यतः आरम्भ से सुने गए संदेश की विषयवस्तु बताता है। फिर भी ἵνα के प्रयोजनात्मक या प्रोत्साहनात्मक रंग को पूरी तरह नकारा नहीं जा सकता, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुमने’ मूल के बहुवचन संबोधन को सामान्य हिन्दी में स्वाभाविक रूप से व्यक्त करता है। ‘आरम्भ’ यूहन्ना की विशिष्ट अभिव्यक्ति का साहित्यिक और धर्मवैचारिक प्रतिध्वनि बनाए रखता है।
