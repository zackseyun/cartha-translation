source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: hi
  text: जो पाप करता रहता है, वह शैतान से है,[a] क्योंकि शैतान आरम्भ से पाप करता आया है। परमेश्वर का पुत्र इसी उद्देश्य से प्रकट हुआ कि वह शैतान के कामों को नष्ट कर दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पाप करता है।” यूनानी में वर्तमान कृदन्त निरन्तर या चरित्रगत आचरण का संकेत दे सकता है, न कि केवल किसी एक अलग-थलग कार्य का।
    reason: lexical_alternative
  - marker: b
    text: या, “शैतान के कामों को मिटा दे” अथवा “तोड़ दे।” यूनानी क्रिया का मूल अर्थ “खोलना” है और यहाँ उसका भाव किसी काम को विफल या नष्ट कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: जो पाप करता रहता है
  rationale: वर्तमान कृदन्त ποιῶν यहाँ निरन्तर या चरित्रगत आचरण का संकेत देता है। ‘करता रहता है’ इसे स्वाभाविक हिन्दी में व्यक्त करता है और केवल एक अलग-थलग पाप का अर्थ थोपने से बचता है।
- source_word: ἐκ τοῦ διαβόλου
  choice: शैतान से है
  rationale: ἐκ स्रोत या नैतिक-आत्मिक सम्बद्धता दर्शाता है। ‘से है’ स्रोत की उपमा बनाए रखता है, पर शैतान से शाब्दिक जन्म का भाव नहीं देता।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: इस प्रसंग में διάβολος एक व्यक्तिगत पदनाम है; आधुनिक हिन्दी में ‘शैतान’ स्पष्ट और प्रचलित रूप है।
- source_word: ἀπ’ ἀρχῆς ... ἁμαρτάνει
  choice: आरम्भ से पाप करता आया है
  rationale: यह अनुवाद आरम्भ से वर्तमान तक जारी चरित्रगत पाप को व्यक्त करता है और ‘आरम्भ’ किस घटना को सूचित करता है, इसे पाठ की तरह खुला रखता है।
- source_word: εἰς τοῦτο
  choice: इसी उद्देश्य से
  rationale: यह पद आगे आने वाले ἵνα उद्देश्य-वाक्य की ओर संकेत करता है; ‘इसी उद्देश्य से’ उस प्रयोजन को साफ और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐφανερώθη
  choice: प्रकट हुआ
  rationale: φανερόω यहाँ प्रकट होने या प्रकट किए जाने का भाव रखता है। ‘प्रकट हुआ’ हिन्दी में स्वाभाविक है और पुत्र की पहचान तथा मिशन के प्रकटीकरण को समेटता है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह मसीह-संबंधी पदवी का सीधा, मानक और सटीक हिन्दी अनुवाद है।
- source_word: ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου
  choice: कि वह शैतान के कामों को नष्ट कर दे
  rationale: λύω का मूल अर्थ खोलना या बन्धनमुक्त करना है, पर यहाँ शैतान के कामों के साथ इसका अर्थ उन्हें तोड़ देना, निष्फल करना या नष्ट करना है। ‘नष्ट कर दे’ निर्णायक विघटन को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के पाप-विषयक वर्तमानकालीन कथन का बल
  choice: 'चरित्रगत या निरन्तर आचरण: ‘पाप करता रहता है’'
  alternative: 'किसी एक पापपूर्ण कार्य के विषय में निरपेक्ष कथन: ‘जो पाप करता है’'
  rationale: वर्तमान कृदन्त और निकटवर्ती प्रसंग स्थायी आचरण की ओर संकेत करते हैं। यह रूप 1 यूहन्ना 1:8–2:2 में विश्वासियों के पाप करने की स्वीकृति के साथ विद्यमान तनाव को मिटाए बिना सुरक्षित रखता है।
- issue: ‘शैतान से है’ का अर्थ
  choice: नैतिक-आत्मिक स्रोत या सम्बद्धता
  alternative: शैतान से शाब्दिक या अस्तित्वगत उत्पत्ति
  rationale: यूहन्ना की द्वैतात्मक भाषा में ἐκ नैतिक-आत्मिक स्रोत और पक्ष-संबंध दर्शाता है; अनुवाद स्रोत की भाषा रखता है, पर शाब्दिक जन्म का दावा नहीं करता।
- issue: परमेश्वर के पुत्र के प्रकट होने का उद्देश्य
  choice: शैतान के कामों को नष्ट करना
  alternative: केवल शैतान के कामों को उजागर करना
  rationale: ἵνα के साथ λύσῃ स्पष्ट उद्देश्य और निर्णायक विघटन व्यक्त करता है, केवल प्रकटीकरण नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आरम्भ’ की समय-संदर्भगत अस्पष्टता जानबूझकर सुरक्षित है। ‘पाप करता रहता है’ आदतन बल स्पष्ट करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक विकल्प देती है।
