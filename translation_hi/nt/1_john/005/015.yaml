review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s twofold ‘we know,’ correctly renders ἀκούει as ‘hears’ rather than ‘answers,’ and maintains the present certainty of ἔχομεν. A small revision makes the final plural αἰτήματα explicit and places the indefinite ‘whatever’ clause more naturally in Hindi.
  naturalness: ‘वह हमारी सुनता है’ is idiomatic in a prayer context. Reordering the first clause improves flow, and replacing the singular collective final ‘वह हमारे पास है’ with a plural expression avoids a grammatical and semantic mismatch with τὰ αἰτήματα.
  terminology: ‘माँगना,’ ‘सुनता है,’ and ‘हम जानते हैं’ are appropriate modern-standard Hindi choices. ‘जिन बातों के लिए हमने उससे माँगा है’ naturally expresses ‘the requests that we have asked from him’ while retaining the Greek perfect’s present relevance.
  issues:
  - severity: medium
    issue: The final clause uses singular ‘वह हमारे पास है’ for plural τὰ αἰτήματα.
    rationale: Although ‘जो कुछ’ can function collectively in Hindi, the Greek explicitly has plural ‘the requests.’ Rendering these as plural ‘वे बातें ... हमारे पास हैं’ more clearly represents both the noun and the relative clause.
  - severity: low
    issue: The opening indefinite relative clause is positioned before its governing verb.
    rationale: The draft is understandable, but ‘कि वह हमारी सुनता है, जो कुछ भी हम माँगें’ is smoother Hindi and keeps the breadth of ὃ ἐὰν αἰτώμεθα without changing it into merely temporal ‘whenever.’
  revised_text: और यदि हम जानते हैं कि वह हमारी सुनता है, जो कुछ भी हम माँगें[a], तो हम जानते हैं कि जिन बातों के लिए हमने उससे माँगा है, वे हमारे पास हैं।
  revised_footnotes:
