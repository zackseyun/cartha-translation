  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: hi
  text: और यदि हम जानते हैं कि वह हमारी सुनता है, जो कुछ भी हम माँगें[a], तो हम जानते हैं कि जिन बातों के लिए हमने उससे माँगा है, वे हमारे पास हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम चाहे जो कुछ माँगें।” यूनानी वाक्यरचना खुला और व्यापक अर्थ व्यक्त करती है—“जो कुछ भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: वह हमारी सुनता है
  rationale: यह हिन्दी में किसी की प्रार्थना या विनती सुनने का स्वाभाविक मुहावरा है। इससे केवल ध्वनि सुनने से अधिक ध्यान देने का भाव आता है, पर ‘उत्तर देता है’ का अतिरिक्त अर्थ नहीं जोड़ा जाता।
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: हम जो कुछ भी माँगें
  rationale: सम्बन्धवाचक सर्वनाम और ἐάν का मेल अनिश्चित तथा व्यापक अर्थ देता है—‘जो कुछ भी’। सम्भावनार्थक ‘माँगें’ इस खुले अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἰτώμεθα
  choice: माँगें
  rationale: प्रार्थना के प्रसंग में αἰτέω के लिए ‘माँगना’ सीधा, सामान्य और यूहन्नाई प्रयोग के अनुरूप है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: दोनों occurrences में यही अनुवाद लेखक की दोहराई गई निश्चितता और तर्क-क्रम को बनाए रखता है।
- source_word: ἔχομεν
  choice: हमारे पास है
  rationale: यह वर्तमानकालीन ‘होने/रखने’ का भाव सुरक्षित रखता है और इसे व्याख्यात्मक रूप से ‘हमें मिल जाएगा’ या ‘वह उत्तर देता है’ नहीं बनाता।
- source_word: τὰ αἰτήματα ἃ ᾐτήκαμεν
  choice: हमने ... जो कुछ माँगा है
  rationale: संज्ञा αἰτήματα को स्वाभाविक हिन्दी में ‘जो कुछ माँगा है’ से व्यक्त किया गया है; पूर्ण क्रिया का वर्तमान-सापेक्ष भाव ‘माँगा है’ से बना रहता है।
- source_word: ἀπ’ αὐτοῦ
  choice: उससे
  rationale: ἀπό के स्रोत/जिससे माँगा गया है उस व्यक्ति के भाव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ἀκούει को केवल ‘सुनता है’ या अनुकूल उत्तर देने के अर्थ में ‘उत्तर देता है’ कहा जाए
  choice: वह हमारी सुनता है
  alternative: वह हमारी प्रार्थना का उत्तर देता है
  rationale: यूनानी पाठ सुनने की बात स्पष्ट रूप से कहता है और फिर माँगी हुई बातों के हमारे पास होने का निष्कर्ष निकालता है। ‘उत्तर देता है’ कहने से इस दो-चरणीय तर्क का तनाव मिट जाता और पाठ से अधिक अर्थ जुड़ जाता।
- issue: ἔχομεν की वर्तमानकालीन निश्चितता को कैसे व्यक्त किया जाए
  choice: वह हमारे पास है
  alternative: वह हमें मिल जाएगा
  rationale: मूल पाठ वर्तमान ‘हमारे पास है’ कहता है। भविष्यकाल लगाने से कथन की वर्तमान निश्चितता बदल जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रार्थना के प्रसंग के अनुरूप है। ‘हमारी सुनता है’ सहज हिन्दी मुहावरा है, जबकि अंतिम खंड में ‘हमारे पास है’ मूल के वर्तमानकाल और निहित धर्मवैचारिक तनाव को बनाए रखता है।
