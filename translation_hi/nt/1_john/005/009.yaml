  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: hi
  text: यदि हम मनुष्यों की गवाही स्वीकार करते हैं, तो परमेश्वर की गवाही मनुष्यों की गवाही से बड़ी है; क्योंकि यह परमेश्वर की गवाही है कि उसने अपने पुत्र के विषय में गवाही दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अर्थ यह भी हो सकता है: “क्योंकि उसने अपने पुत्र के विषय में गवाही दी है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: गवाही
  rationale: यह शब्द पूरे पद में प्रमाणात्मक कथन या साक्ष्य के अर्थ में दोहराया गया है। ‘गवाही’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी की पुनरावृत्ति को बनाए रखता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों
  rationale: यहाँ बहुवचन शब्द सामान्य रूप से मानवों की ओर संकेत करता है और उनकी गवाही की तुलना परमेश्वर की गवाही से करता है; ‘मनुष्यों’ इस व्यापक अर्थ को स्पष्ट रखता है।
- source_word: λαμβάνομεν
  choice: स्वीकार करते हैं
  rationale: गवाही के प्रसंग में λαμβάνω केवल उसे पाने से अधिक, उसे मान्य करने का भाव रख सकता है; हिन्दी में ‘गवाही स्वीकार करना’ स्वाभाविक प्रयोग है।
- source_word: μείζων
  choice: उससे बड़ी
  rationale: तुलना मनुष्यों की गवाही से है। ‘उससे’ जोड़ने से हिन्दी में तुलना स्पष्ट होती है, जबकि ‘बड़ी’ मूल के सीधे तुलनात्मक अर्थ को रखता है।
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: परमेश्वर की गवाही यह है
  rationale: यह रूप यूनानी कथन की संरचना और ‘गवाही’ की पुनरावृत्ति बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: μεμαρτύρηκεν
  choice: गवाही दी है
  rationale: पूर्णकालीन रूप उस दी हुई गवाही की वर्तमान प्रासंगिकता दर्शाता है। यह संज्ञा ‘गवाही’ के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: अपने पुत्र के विषय में
  rationale: περί के संबंधसूचक अर्थ को ‘के विषय में’ ठीक व्यक्त करता है; आत्मवाचक ‘अपने’ हिन्दी में कर्ता परमेश्वर और उसके पुत्र का संबंध स्पष्ट करता है।
theological_decisions:
- issue: दूसरे ὅτι का वाक्यगत कार्य
  choice: 'विषय-वस्तु बताने वाला उपवाक्य: ‘कि उसने अपने पुत्र के विषय में गवाही दी है’'
  alternative: 'कारणसूचक उपवाक्य: ‘क्योंकि उसने अपने पुत्र के विषय में गवाही दी है’'
  rationale: निकटतम संरचना में दूसरा ὅτι परमेश्वर की गवाही की विषय-वस्तु बताता है। फिर भी कारणसूचक अर्थ व्याकरणतः संभव है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ἀνθρώπων का सामान्य मानव-संदर्भ
  choice: मनुष्यों
  alternative: लोगों
  rationale: यहाँ किसी विशेष लिंग के पुरुषों की नहीं, मानव गवाही की परमेश्वर की गवाही से तुलना है। ‘मनुष्यों’ मूल शब्द के सामान्य मानव-संदर्भ और औपचारिक विरोध दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘गवाही’ की पुनरावृत्ति मूल यूनानी के आलंकारिक बल को बनाए रखती है। मुख्य पाठ में दूसरे ὅτι को विषय-वस्तु सूचक माना गया है और वास्तविक व्याकरणिक अस्पष्टता पाद-टिप्पणी में दी गई है।
