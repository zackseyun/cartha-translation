  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: hi
  text: हर प्रकार की अधार्मिकता पाप है,[a] और ऐसा पाप भी है जो मृत्यु की ओर नहीं ले जाता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर गलत काम पाप है” अथवा “हर प्रकार का अन्याय पाप है।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो मृत्यु का कारण नहीं बनता”; अधिक शाब्दिक रूप में, “जो मृत्यु की ओर नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: हर प्रकार की अधार्मिकता
  rationale: अनिश्चित एकवचन संज्ञा के साथ πᾶσα का व्यापक अर्थ है—सारी अधार्मिकता अथवा हर प्रकार की अधार्मिकता। यह रूप हिन्दी में स्वाभाविक रहते हुए सार्वभौमिक दायरा बनाए रखता है।
- source_word: ἀδικία
  choice: अधार्मिकता
  rationale: यह शब्द अन्याय, गलत काम या धार्मिकता के विपरीत नैतिक अवस्था/आचरण को व्यक्त कर सकता है। यूहन्ना के नैतिक-धर्मवैचारिक संदर्भ में ‘अधार्मिकता’ इसका व्यापक अर्थ बनाए रखती है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: दोनों स्थानों पर ἁμαρτία का मानक और संदर्भानुकूल हिन्दी प्रतिशब्द।
- source_word: καὶ ἔστιν
  choice: और ऐसा ... भी है
  rationale: καί के संयोजक बल और ἔστιν के अस्तित्वसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भी’ पहले व्यापक कथन के बाद आने वाले स्पष्टीकरण को सहज रूप से जोड़ता है।
- source_word: οὐ πρὸς θάνατον
  choice: मृत्यु की ओर नहीं ले जाता
  rationale: πρός यहाँ दिशा अथवा परिणाम का भाव देता है। यह अनुवाद आधुनिक हिन्दी में स्पष्ट है और मूल वाक्यांश की गतिशील दिशा को सुरक्षित रखता है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि आशय शारीरिक, आत्मिक या अंतिम मृत्यु से है; इसलिए बिना व्याख्यात्मक विशेषण के सीधा अनुवाद किया गया है।
theological_decisions:
- issue: ‘मृत्यु की ओर नहीं’ में मृत्यु का स्वरूप
  choice: केवल ‘मृत्यु’ कहना, कोई व्याख्यात्मक विशेषण न जोड़ना
  alternative: शारीरिक मृत्यु; आत्मिक मृत्यु; अंतिम दण्ड
  rationale: यूनानी पाठ में केवल θάνατον है। अनुवाद विवादित धर्मवैचारिक अर्थ को तय करने के बजाय मूल की अस्पष्टता बनाए रखता है।
- issue: ἀδικία का नैतिक-धर्मवैचारिक अर्थ
  choice: मुख्य पाठ में ‘अधार्मिकता’
  alternative: गलत काम; अन्याय
  rationale: कथन का दायरा केवल सामाजिक अन्याय या किसी एक गलत कार्य तक सीमित नहीं है। ‘अधार्मिकता’ धार्मिकता के विपरीत व्यापक नैतिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘हर प्रकार की’ व्यापकता को स्पष्ट करता है; ‘अधार्मिकता’ प्रमुख यूहन्नाई नैतिक शब्दावली का भार रखती है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
