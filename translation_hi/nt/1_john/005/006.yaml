  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: hi
  text: यही वह है जो जल और लहू के द्वारा आया[a]—यीशु मसीह। केवल जल में नहीं, बल्कि जल और लहू में। और आत्मा ही गवाही देने वाला है, क्योंकि आत्मा सत्य है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जल और लहू’ का आशय विवादित है। इसे यीशु के बपतिस्मे और मृत्यु, उनके जन्म और मृत्यु, या संस्कार-संबंधी प्रतीक के रूप में समझा गया है। अनुवाद किसी एक अर्थ को नहीं चुनता।
    reason: alternative_reading
  - marker: b
    text: या, “और आत्मा ही गवाही देने वाला है कि आत्मा सत्य है।” यूनानी संयोजक का अर्थ यहाँ “क्योंकि” अथवा “कि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: यही वह है जो ... आया
  rationale: यह रचना संकेतवाचक की पहचानात्मक और बलयुक्त भूमिका को स्वाभाविक हिन्दी में व्यक्त करती है तथा कृदन्त को ऐतिहासिक घटना के रूप में रखती है।
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: जल और लहू के द्वारा
  rationale: διά के साधन अथवा संबद्ध परिस्थिति के भाव को व्यक्त करते हुए मूल रूपक को खुला रखा गया है; बपतिस्मा, जन्म, मृत्यु या संस्कार का अर्थ मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: Χριστός यहाँ यीशु की पहचान करने वाली उपाधि है; हिन्दी में ‘मसीह’ स्थापित, अर्थपूर्ण और स्वाभाविक पद है।
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: केवल जल के द्वारा नहीं, बल्कि जल और लहू के द्वारा
  rationale: विरोध और दोनों तत्त्वों पर दिए गए बल को बनाए रखते हुए हिन्दी में अनावश्यक भारी पुनरावृत्ति से बचा गया है।
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: आत्मा ही गवाही देता है
  rationale: संज्ञीकृत वर्तमान कृदन्त की निरंतर साक्षी देने की क्रिया को स्वाभाविक हिन्दी में रखा गया है; ‘ही’ आत्मा की पहचानात्मक भूमिका पर बल देता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: इसे कारणवाचक समझने पर आत्मा की गवाही का आधार अगली पंक्ति में मिलता है और प्रसंग का प्रवाह सुगम रहता है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: विधेय में निश्चित पहचान का भाव ‘सत्य है’ से स्वाभाविक हिन्दी में व्यक्त होता है; इसे केवल ‘सत्यवादी’ बनाकर कथन को कमजोर नहीं किया गया।
theological_decisions:
- issue: ‘जल और लहू’ का आशय
  choice: मुख्य पाठ में व्याख्या किए बिना ‘जल और लहू’ बनाए रखा
  alternative: यीशु का बपतिस्मा और मृत्यु; जन्म और मृत्यु; अथवा बपतिस्मा और प्रभु-भोज संबंधी प्रतीक
  rationale: यूनानी पाठ इन तत्त्वों की व्याख्या नहीं करता और इनके आशय पर मतभेद है; अतः अनुवाद उस तनाव को सुरक्षित रखता है।
- issue: τὸ πνεῦμα का संदर्भ
  choice: पवित्र आत्मा के संदर्भ में ‘आत्मा’
  alternative: कोई सामान्य आत्मा
  rationale: ईश्वरीय गवाही का निकट प्रसंग और यूहन्नाई प्रयोग पवित्र आत्मा की ओर संकेत करते हैं, पर मुख्य पाठ में ‘पवित्र’ जोड़कर स्रोत से अधिक स्पष्टता नहीं दी गई।
- issue: Χριστός का निर्वचन
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ पद यीशु की उपाधि और पहचान के रूप में कार्य करता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित है।
- issue: ὅτι का संबंध
  choice: कारणवाचक—‘क्योंकि’
  alternative: विषयवाचक—‘कि आत्मा सत्य है’
  rationale: दोनों व्याकरणतः संभव हैं; कारणवाचक अर्थ प्रसंग में गवाही का आधार देता है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ बाइबलीय हिन्दी में परिचित और प्रसंगानुकूल है; वाक्य-विन्यास मूल के विरोध और बल को बनाए रखते हुए स्वाभाविक हिन्दी में ढाला गया है।
