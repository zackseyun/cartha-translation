source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: hi
  text: और संसार पर विजय कौन पाता है? केवल वही जो विश्वास करता है कि यीशु परमेश्वर का पुत्र है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वह जो संसार पर विजय पाता है ... वह जो विश्वास करता है।” यूनानी में पुल्लिंग एकवचन कृदन्तों का प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम एक आलंकारिक प्रश्न आरम्भ करता है; ‘कौन’ सरल और स्वाभाविक है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ पिछले कथन से हल्का संबंध जोड़ता है, तीखा विरोध नहीं; इसलिए ‘और’ उपयुक्त है।
- source_word: ὁ νικῶν
  choice: विजय पानेवाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमानकालिक कृदन्त निरंतर या चरित्रगत विजय का भाव रखता है; यह रूप हिन्दी में स्वाभाविक है।
- source_word: τὸν κόσμον
  choice: संसार पर
  rationale: κόσμος को बिना व्याख्यात्मक विस्तार के ‘संसार’ रखा गया है; हिन्दी में ‘विजय पाना’ के साथ ‘पर’ स्वाभाविक कारक है।
- source_word: εἰ μὴ
  choice: सिवाय उसके
  rationale: इस आलंकारिक प्रश्न में यह पदबंध अपवाद और विशिष्टता व्यक्त करता है।
- source_word: ὁ πιστεύων
  choice: जो विश्वास करता है
  rationale: वर्तमानकालिक कृदन्त की क्रियात्मक और चरित्रगत शक्ति को बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह विश्वास की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिगत नाम का हिन्दी में मानक बाइबलीय रूप।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: मसीह-संबंधी उपाधि को सीधे और बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ὁ νικῶν और ὁ πιστεύων के पुल्लिंग एकवचन कृदन्तों का प्रतिनिधिक प्रयोग
  choice: विजय पानेवाला / जो विश्वास करता है
  alternative: वह पुरुष जो विजय पाता है / वह पुरुष जो विश्वास करता है
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन हैं, पर उनका अर्थ सामान्य और प्रतिनिधिक है। हिन्दी के ये रूप अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित किए बिना उस प्रतिनिधिक बल को बनाए रखते हैं।
- issue: ὁ υἱὸς τοῦ θεοῦ में मसीह-संबंधी अंगीकार
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का बेटा
  rationale: ‘पुत्र’ उपाधि की गरिमा और अंगीकारात्मक वजन को सुरक्षित रखता है, बिना उसके अर्थ को बढ़ाए या घटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। ‘संसार’ और ‘परमेश्वर का पुत्र’ जैसे स्थापित बाइबलीय पदों को बनाए रखा गया है; वाक्य की आलंकारिक प्रश्न-रचना और विशिष्टता सुरक्षित है।
