source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: hi
  text: 'और उसके सामने हमें जो भरोसा[a] है, वह यह है: यदि हम उसकी इच्छा के अनुसार कुछ भी माँगते हैं, तो वह हमारी सुनता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निडरता’ अथवा ‘दृढ़ आश्वस्तता’।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: भरोसा
  rationale: यहाँ शब्द परमेश्वर के सामने प्रार्थना में खुले और निश्चिंत होकर आने का भाव व्यक्त करता है। ‘भरोसा’ आधुनिक हिन्दी में स्वाभाविक है और केवल सार्वजनिक निर्भीकता का अर्थ नहीं देता।
- source_word: πρὸς αὐτόν
  choice: उसके सामने
  rationale: व्यक्तिवाचक कर्म के साथ πρός यहाँ संबंधपरक उन्मुखता और उपस्थिति का भाव देता है। प्रार्थना के प्रसंग में ‘उसके सामने’ स्वाभाविक रूप से परमेश्वर की उपस्थिति में पहुँच को व्यक्त करता है।
- source_word: ὅτι
  choice: 'वह यह है:'
  rationale: यहाँ ὅτι भरोसे का कारण नहीं, उसकी विषय-वस्तु प्रस्तुत करता है; इसलिए हिन्दी वाक्य-रचना में ‘वह यह है:’ स्पष्ट और स्वाभाविक है।
- source_word: ἐάν τι αἰτώμεθα
  choice: यदि हम ... कुछ भी माँगते हैं
  rationale: ἐάν और वर्तमान संभावनार्थक क्रिया एक सामान्य शर्त व्यक्त करते हैं। ‘कुछ भी’ τι के खुले दायरे को बनाए रखता है।
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: उसकी इच्छा के अनुसार
  rationale: κατά यहाँ अनुरूपता या मानदंड बताता है। ‘इच्छा’ θέλημα का धार्मिक भार बिना अनावश्यक व्याख्या के बनाए रखती है।
- source_word: ἀκούει ἡμῶν
  choice: वह हमारी सुनता है
  rationale: प्रार्थना के प्रसंग में यह स्वाभाविक हिन्दी मुहावरा परमेश्वर के ध्यान देकर सुनने को व्यक्त करता है, पर अपने-आप हर विनती पूरी किए जाने का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: प्रार्थना को परमेश्वर के सुनने का अर्थ
  choice: ‘वह हमारी सुनता है’—अर्थात परमेश्वर इच्छा के अनुसार की गई प्रार्थना पर ध्यान देता है।
  alternative: ‘वह हमें उत्तर देता है’ या ‘वह हमारी विनती पूरी करता है।’
  rationale: पद सुनने की बात कहता है; विनती पूरी किए जाने की अधिक स्पष्ट चर्चा अगले पद में आती है। इसलिए यहाँ उससे अधिक अर्थ जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हमारी सुनता है’ सामान्य हिन्दी में प्रार्थना पर ध्यान देने का स्वाभाविक प्रयोग है। पाद-टिप्पणी का चिह्न उसी शब्द ‘भरोसा’ पर रखा गया है जिसके लिए वैकल्पिक अर्थ दिए गए हैं।
