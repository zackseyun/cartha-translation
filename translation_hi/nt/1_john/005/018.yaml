id: 1JN.5.18
reference: 1 John 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: hi
  text: हम जानते हैं कि परमेश्वर से जन्मा हर व्यक्ति पाप करने में लगा नहीं रहता[a]; बल्कि परमेश्वर से जन्मा हुआ व्यक्ति उसे सुरक्षित रखता है[b], और वह दुष्ट उसे नहीं छूता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी वर्तमान काल संभवतः लगातार या आदतन पाप करते रहने की ओर संकेत करता है; इसका यह अर्थ नहीं कि विश्वासी कभी कोई पाप करता ही नहीं (देखें 1 यूहन्ना 1:8–10; 2:1)।
    reason: cross_reference
  - marker: b
    text: या, “वह अपने आपको सुरक्षित रखता है।” परन्तु अनेक व्याख्याकार “परमेश्वर से जन्मा हुआ व्यक्ति” को यीशु, परमेश्वर के पुत्र, के लिए समझते हैं, जो विश्वासी को सुरक्षित रखता है।
    reason: alternative_reading
  - marker: c
    text: “छूना” यहाँ हानि पहुँचाने के लिए किसी को पकड़ लेने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα पूर्ण रूप होते हुए भी वर्तमान स्थिति का अर्थ देता है; इसलिए आधुनिक हिन्दी में ‘हम जानते हैं’ स्वाभाविक है।
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: परमेश्वर से जन्मा हर व्यक्ति
  rationale: πᾶς ὁ + कृदन्त का अर्थ प्रत्येक व्यक्ति से है, और पूर्ण निष्क्रिय कृदन्त जन्म के फलस्वरूप बनी वर्तमान स्थिति को व्यक्त करता है। ‘परमेश्वर से जन्मा’ यूहन्ना की विशिष्ट अभिव्यक्ति को बनाए रखता है।
- source_word: οὐχ ἁμαρτάνει
  choice: पाप करने में लगा नहीं रहता
  rationale: वर्तमान काल की अपूर्णतामूलक शक्ति यहाँ जारी या अभ्यस्त पाप को सूचित कर सकती है। यह अनुवाद ऐसा दावा नहीं करता कि विश्वासी कभी कोई पाप करता ही नहीं।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह पहले कथन के बाद तीखा विरोध और सुधारात्मक बल व्यक्त करता है।
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: जो परमेश्वर से जन्मा था
  rationale: यूनानी अनिश्चितता को बनाए रखते हुए यह वाक्यांश विश्वासी अथवा परमेश्वर के पुत्र—दोनों संभावित संकेतों के लिए खुला रहता है; मुख्य पाठ में ‘यीशु’ नहीं जोड़ा गया।
- source_word: τηρεῖ αὐτόν
  choice: वह उसे सुरक्षित रखता है
  rationale: τηρέω का अर्थ ‘रखना, पहरा देना, सुरक्षित रखना’ हो सकता है। प्रसंग में ‘सुरक्षित रखता है’ स्वाभाविक हिन्दी है, जबकि सर्वनाम की व्याकरणिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ὁ πονηρὸς
  choice: वह दुष्ट
  rationale: संज्ञीकृत विशेषण और यूहन्नाई प्रयोग के आधार पर यह अमूर्त बुराई के बजाय एक व्यक्तिगत दुष्ट सत्ता की ओर संकेत करता है।
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: उसे छू भी नहीं पाता
  rationale: ἅπτομαι का मूल अर्थ ‘छूना’ है, पर यहाँ हानि पहुँचाने के लिए पकड़ लेने का भाव हो सकता है। ‘भी नहीं पाता’ प्रसंग के सुरक्षात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: οὐχ ἁμαρτάνει में वर्तमान काल का अर्थ
  choice: यह लगातार या अभ्यस्त रूप से पाप करते रहने का निषेध है।
  alternative: विश्वासी कोई पाप बिल्कुल नहीं करता।
  rationale: वर्तमान काल का अपूर्णतामूलक पक्ष और 1 यूहन्ना 1:8–10; 2:1 का निकट व्यापक संदर्भ जारी पाप के अर्थ का समर्थन करता है, फिर भी मुख्य कथन की गंभीरता बनाए रखी गई है।
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ किसकी ओर संकेत करता है
  choice: मुख्य पाठ में ‘जो परमेश्वर से जन्मा था’ रखकर संदर्भ को खुला रखा गया है।
  alternative: यह विश्वासी की ओर संकेत करता है; अथवा विशेष रूप से यीशु, परमेश्वर के पुत्र, की ओर संकेत करता है।
  rationale: यूनानी वाक्यरचना दोनों व्याख्याओं की अनुमति देती है। किसी एक धार्मिक निष्कर्ष को मुख्य पाठ में जोड़ने के बजाय विकल्प पादटिप्पणी में स्पष्ट किया गया है।
- issue: αὐτόν और αὐτοῦ के संकेत
  choice: दोनों को ‘उसे’ कहा गया है और सुरक्षित रखे जाने वाले व्यक्ति को विश्वासी समझने की स्वाभाविक संभावना बनाए रखी गई है।
  alternative: 'यदि कृदन्त विश्वासी के लिए है, तो भाव प्रतिवाचक हो सकता है: ‘वह अपने आपको सुरक्षित रखता है।’'
  rationale: αὐτόν स्वयं प्रतिवाचक सर्वनाम नहीं है; इसलिए मुख्य पाठ में सामान्य ‘उसे’ रखा गया है, और वैकल्पिक व्याख्या को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठकों के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘परमेश्वर से जन्मा’, ‘वह दुष्ट’ और ‘सुरक्षित रखता है’ यूहन्नाई शब्दावली तथा प्रसंग के सुरक्षात्मक भाव को बनाए रखते हैं। वास्तविक व्याकरणिक और धर्मवैचारिक अनिश्चितता को मुख्य पाठ तथा पादटिप्पणी के संयोजन से संरक्षित किया गया है।
