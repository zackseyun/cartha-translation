source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: hi
  text: मैंने ये बातें तुम्हें, जो परमेश्वर के पुत्र के नाम पर विश्वास करते हो,[a] लिखी हैं ताकि तुम जानो कि तुम्हारे पास अनन्त जीवन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, यूनानी शब्द-क्रम के अधिक निकट: “मैंने ये बातें तुम्हें लिखी हैं ताकि तुम जानो कि तुम्हारे पास अनन्त जीवन है—तुम्हें, जो परमेश्वर के पुत्र के नाम पर विश्वास करते हो।”'
    reason: यूनानी में ‘जो विश्वास करते हैं’ पदबंध आश्वासन-वाक्य के बाद आता है। इसे आरंभ के ‘तुम्हें’ की पहचान बताने वाला समानाधिकरण, अथवा आश्वासन के बाद उसी का पुनरुक्त स्पष्टीकरण, दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पत्र की लिखी हुई बातों की ओर संकेत करता है; हिंदी में ‘ये बातें’ स्वाभाविक रूप से बहुवचन बनाए रखता है।
- source_word: ἔγραψα
  choice: मैंने ... लिखी हैं
  rationale: पत्र-संदर्भ में यूनानी एओरिस्ट पूर्ण किए गए लेखन को दर्शाता है; आधुनिक हिंदी में पूर्ण वर्तमान पत्र के वर्तमान प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम लोगों को
  rationale: बहुवचन द्वितीय पुरुष को स्पष्ट करते हुए दत्तिव का स्वाभाविक हिंदी रूप।
- source_word: ἵνα εἰδῆτε
  choice: इसलिए ... कि तुम जानो
  rationale: ἵνα का प्रयोजनार्थक भाव और εἰδῆτε का ज्ञान-संबंधी अर्थ सुरक्षित रहता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यूहन्नाई अभिव्यक्ति का प्रचलित और सटीक हिंदी रूप, जो जीवन की अवधि और परमेश्वर-संबंधी गुण दोनों को खुला रखता है।
- source_word: ἔχετε
  choice: तुम्हारे पास है
  rationale: वर्तमान काल अभी के अधिकार या प्राप्ति को व्यक्त करता है, केवल भविष्य की आशा को नहीं।
- source_word: τοῖς πιστεύουσιν
  choice: जो ... विश्वास करते हो
  rationale: इसे ὑμῖν के समानाधिकरण में लेकर पत्र पाने वालों की पहचान बताई गई है; संबोधन का बहुवचन रूप हिंदी में बनाए रखा गया है।
- source_word: πιστεύουσιν εἰς
  choice: पर विश्वास करते हो
  rationale: यूहन्नाई प्रयोग में किसी व्यक्ति के नाम पर विश्वास/भरोसा रखने का मानक हिंदी रूप।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: ‘नाम’ द्वारा व्यक्ति, उसकी प्रकट पहचान और अधिकार का बाइबलीय मुहावरा बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यूनानी संबंधकारक संरचना और मसीह-संबंधी उपाधि का सीधा, प्रतिष्ठित हिंदी अनुवाद।
theological_decisions:
- issue: τοῖς πιστεύουσιν का स्थान और वाक्यगत संबंध
  choice: इसे ὑμῖν से जोड़कर ‘तुम लोगों को, जो ... विश्वास करते हो’
  alternative: 'आश्वासन के बाद पुनरुक्त समानाधिकरण: ‘कि अनन्त जीवन तुम्हारे पास है—तुम्हारे पास, जो ... विश्वास करते हो’'
  rationale: यूनानी शब्द-क्रम दोनों संबंधों की संभावना देता है। मुख्य पाठ में ὑμῖν के साथ संबंध स्वाभाविक हिंदी और संभावित आशय देता है; वास्तविक क्रमगत अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज लेकिन गरिमापूर्ण संबोधन के लिए बहुवचन ‘तुम लोगों’ का प्रयोग। ‘अनन्त जीवन’ और ‘परमेश्वर के पुत्र के नाम पर विश्वास’ जैसे परिचित बाइबलीय पदबंध सुरक्षित रखे गए हैं।
