lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: निकट संदर्भ में यह पवित्र आत्मा को निश्चित साक्षी के रूप में सूचित करता है; हिंदी बाइबल-शैली में ‘आत्मा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸ ὕδωρ
  choice: जल
  rationale: मूल के ठोस बिंब को बिना उसका आशय व्याख्यायित किए सुरक्षित रखता है।
- source_word: τὸ αἷμα
  choice: लहू
  rationale: मूल के ठोस संज्ञा-रूप को बनाए रखता है और आधुनिक हिंदी के धार्मिक पाठ में सहज है; पद स्वयं इसका संदर्भ स्पष्ट नहीं करता।
- source_word: οἱ τρεῖς
  choice: ये तीनों
  rationale: अभी-अभी बताए गए आत्मा, जल और लहू की सामूहिक ओर स्पष्ट संकेत करता है।
- source_word: εἰς τὸ ἕν εἰσιν
  choice: एक ही बात पर सहमत हैं
  rationale: साक्ष्य के संदर्भ में तीनों की गवाही के एक लक्ष्य पर मिलने को स्वाभाविक हिंदी में व्यक्त करता है, जबकि शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या εἰς τὸ ἕν εἰσιν को तात्त्विक एकता या गवाही की सहमति के रूप में व्यक्त किया जाए
  choice: 'गवाही की सहमति: ‘ये तीनों एक ही बात पर सहमत हैं’'
  alternative: ‘और ये तीनों एक हैं’
  rationale: संदर्भ आत्मा, जल और लहू को साक्षियों के रूप में प्रस्तुत करता है। इसलिए वाक्यांश उनकी गवाही के एक मत होने को अधिक स्वाभाविक रूप से बताता है; फिर भी अधिक शाब्दिक और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है, ताकि मूल की संक्षिप्तता और तनाव न मिटे।
