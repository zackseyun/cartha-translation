source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: hi
  text: क्योंकि जो कोई परमेश्वर से जन्मा है[a], वह संसार पर विजय पाता है। और यह वह विजय है जो संसार पर विजय पा चुकी है—हमारा विश्वास[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ परमेश्वर से जन्मा है।” यूनानी में यह पद नपुंसकलिंग में है और परमेश्वर से जन्मे सभी लोगों के पूरे वर्ग को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारी विश्वासयोग्यता।” यूनानी शब्द का अर्थ कुछ सन्दर्भों में “विश्वास,” “भरोसा” या “विश्वासयोग्यता” हो सकता है; यहाँ मुख्य पाठ में सामान्य अर्थ “विश्वास” लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πᾶν τὸ γεγεννημένον
  choice: जो कोई ... जन्मा है
  rationale: यूनानी पद व्याकरण की दृष्टि से नपुंसकलिंग एकवचन है, पर सन्दर्भ में परमेश्वर से जन्मे लोगों के पूरे वर्ग की ओर संकेत करता है। व्यक्तिगत हिन्दी रूप आशय को स्वाभाविक ढंग से व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: γεγεννημένον
  choice: जन्मा है
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त ऐसे जन्म को दर्शाता है जो हो चुका है और जिसका परिणाम बना हुआ है; ‘जन्मा है’ यूहन्ना की नए जन्म की भाषा के लिए सहज है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: यह जन्म के दिव्य स्रोत को व्यक्त करता है; हिन्दी में ‘परमेश्वर से जन्मा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: νικᾷ
  choice: विजय पाता है
  rationale: यह वर्तमान क्रिया संसार के विरोध पर जय को व्यक्त करती है और इसी वचन में νίκη तथा νικήσασα के साथ शब्दगत सम्बन्ध बनाए रखती है।
- source_word: κόσμον
  choice: संसार
  rationale: यहाँ शब्द परमेश्वर के विरोध में खड़ी संसार-व्यवस्था का यूहन्नाई अर्थ रखता है; मुख्य पाठ में ‘संसार’ उस अर्थ को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: वह विजय ... यह है
  rationale: यह रचना संकेतवाचक बल और ‘विजय’ संज्ञा को बनाए रखती है, साथ ही अगले पदबंध को हिन्दी में स्पष्ट रूप से उससे जोड़ती है।
- source_word: ἡ νικήσασα
  choice: जिसने ... विजय पाई है
  rationale: यह पूर्ण हुए विजय-कार्य को हिन्दी के पूर्ण रूप में व्यक्त करता है और νικᾷ/νίκη के साथ मूल शब्दगत सम्बन्ध बनाए रखता है।
- source_word: ἡ πίστις ἡμῶν
  choice: हमारा विश्वास
  rationale: इस सन्दर्भ में πίστις का सामान्य और सबसे स्वाभाविक अर्थ ‘विश्वास’ है; सम्भव वैकल्पिक अर्थ ‘विश्वासयोग्यता’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον का संकेत
  choice: 'व्यक्तिगत और सामूहिक: ‘जो कोई परमेश्वर से जन्मा है’'
  alternative: ‘जो कुछ परमेश्वर से जन्मा है’
  rationale: नपुंसकलिंग रूप का अधिक शाब्दिक अनुवाद ‘जो कुछ’ हो सकता है, पर निकटवर्ती सन्दर्भ विश्वासियों की बात करता है। मुख्य पाठ व्यक्तिगत आशय स्पष्ट करता है और व्याकरणिक अस्पष्टता पादटिप्पणी में रखता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: ‘हमारा विश्वास’ इस सन्दर्भ में सबसे स्वाभाविक है और बताता है कि संसार पर विजय किससे पहचानी जाती है; फिर भी πίστις कुछ सन्दर्भों में ‘विश्वासयोग्यता’ भी व्यक्त कर सकता है, इसलिए वह सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘विजय पाता है / विजय / विजय पाई है’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल यूनानी के सजातीय शब्दों का अलंकार और वैचारिक सम्बन्ध बना रहे।
