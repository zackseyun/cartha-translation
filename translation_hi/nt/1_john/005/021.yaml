lexical_decisions:
- source_word: Τεκνία
  choice: हे प्यारे बच्चो
  rationale: सम्बोधन में प्रयुक्त बहुवचन लघु-स्नेहसूचक रूप है। ‘प्यारे बच्चो’ यूहन्ना के आत्मीय, पारिवारिक और पासबानी स्वर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘छोटे बच्चो’ आयु पर अनावश्यक बल दे सकता है।
- source_word: φυλάξατε
  choice: बचाए रखो
  rationale: यह बहुवचन आज्ञार्थक रूप सक्रिय और सतत चौकसी की माँग व्यक्त करता है। ‘बचाए रखो’ हिन्दी में आत्म-सुरक्षा के साथ स्वाभाविक है और केवल सामान्य ‘रखो’ से अधिक स्पष्ट है।
- source_word: ἑαυτὰ
  choice: अपने आप को
  rationale: आत्मवाचक सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप, जिससे चेतावनी की व्यक्तिगत जिम्मेदारी बनी रहती है।
- source_word: ἀπὸ
  choice: से
  rationale: यह अलगाव या दूरी का भाव देता है; ‘मूर्तियों से’ हिन्दी में संक्षिप्त और सहज है।
- source_word: εἰδώλων
  choice: मूर्तियों
  rationale: यह शब्द उपासना की मूर्तियों अथवा प्रतिमाओं को दर्शाता है। ‘मूर्तियों’ ठोस अर्थ को सुरक्षित रखता है और इसे व्याख्यात्मक रूप से ‘परमेश्वर का स्थान लेने वाली हर वस्तु’ तक नहीं फैलाता।
theological_decisions:
- issue: ‘मूर्तियों’ का दायरा
  choice: ठोस रूप में ‘मूर्तियों’ अनुवादित किया गया है।
  alternative: ‘हर उस वस्तु से जो परमेश्वर का स्थान ले’ या सामान्य रूप से ‘झूठी उपासना से’
  rationale: यूनानी पाठ सीधे मूर्तियों का उल्लेख करता है। व्यापक मूर्तिपूजा का आशय निहित हो सकता है, पर अनुवाद में स्रोत से आगे बढ़कर उसका विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय किंतु गरिमापूर्ण सम्बोधन रखा गया है। ‘प्यारे’ यूनानी में अलग विशेषण नहीं है, पर हिन्दी में उसके स्नेहसूचक लघु रूप का भाव स्वाभाविक ढंग से व्यक्त करता है।
