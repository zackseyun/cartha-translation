source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: hi
  text: जिसके पास पुत्र है, उसके पास जीवन है[a]; जिसके पास परमेश्वर का पुत्र नहीं है, उसके पास जीवन नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनन्त जीवन”; यूहन्ना के लेखन में यहाँ “जीवन” का अर्थ वह जीवन है जो पुत्र में पाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: जिसके पास ... है
  rationale: निश्चयवाचक लेख के साथ वर्तमान कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है और किसी भी ऐसे व्यक्ति को दर्शाता है जिसकी पहचान पुत्र को रखने से होती है। यह आधुनिक हिन्दी में सहज है और सामान्य एकवचन का भाव बनाए रखता है।
- source_word: τὸν υἱόν
  choice: पुत्र
  rationale: पहले उपवाक्य में यूनानी पाठ केवल ‘पुत्र’ कहता है; संक्षिप्त रूप रखने से मूल की शब्दगत भिन्नता सुरक्षित रहती है और प्रसंग से संदर्भ स्पष्ट है।
- source_word: ἔχει
  choice: उसके पास ... है
  rationale: ἔχω का सीधा और स्वाभाविक हिन्दी रूप है। यह यूहन्ना के संबंधात्मक अर्थ को बनाए रखता है, बिना उसे ‘अधिकार’ या ‘स्वामित्व’ जैसे अधिक संकुचित अर्थ में बदलने के।
- source_word: τὴν ζωήν
  choice: जीवन
  rationale: मुख्य पाठ में केवल ‘जीवन’ रखने से मूल के शब्द का सीधा रूप और उसका यूहन्नाई धर्मवैचारिक भार सुरक्षित रहता है; ‘अनन्त’ को पद में जोड़ा नहीं गया है।
- source_word: ὁ μὴ ἔχων
  choice: जिसके पास ... नहीं है
  rationale: μή कृदन्तीय वाक्यांश का निषेध करता है। यह रूप पहले उपवाक्य के साथ संतुलित विरोध और सामान्य व्यक्ति-संदर्भ बनाए रखता है।
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह दूसरे उपवाक्य में पूर्ण मसीही उपाधि है और सम्बन्धकारक τοῦ θεοῦ को स्पष्ट, प्रचलित हिन्दी में व्यक्त करती है।
- source_word: οὐκ ἔχει
  choice: उसके पास ... नहीं है
  rationale: οὐκ सीमित क्रिया का निषेध करता है। यह पहले उपवाक्य के सकारात्मक कथन के साथ स्पष्ट समानांतरता बनाए रखता है।
theological_decisions:
- issue: यूहन्नाई प्रसंग में ‘जीवन’ का अर्थ
  choice: मुख्य पाठ में ζωή का अनुवाद ‘जीवन’ किया गया है।
  alternative: अनन्त जीवन
  rationale: 1 यूहन्ना में ζωή प्रायः पुत्र में पाए जाने वाले अनन्त जीवन को दर्शाता है, पर इस पद में स्वयं केवल ζωή है। इसलिए व्याख्यात्मक ‘अनन्त’ को मुख्य पाठ में जोड़ने के बजाय विकल्प को पादटिप्पणी में बताया गया है।
- issue: सामान्य अर्थ वाले पुल्लिंग एकवचन कृदन्त
  choice: ‘जिसके पास...’ का प्रयोग किया गया है।
  alternative: वह पुरुष जिसके पास... / जो कोई...
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर उसका आशय सामान्य है। ‘जिसके पास...’ आधुनिक हिन्दी में सहज है, सभी व्यक्तियों को समेटता है और कथन को अनावश्यक रूप से बहुवचन नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संतुलित वाक्य-विन्यास रखा गया है। ‘जिसके पास... उसके पास...’ की पुनरावृत्ति मूल यूनानी के समानांतर विरोध को स्पष्ट करती है।
