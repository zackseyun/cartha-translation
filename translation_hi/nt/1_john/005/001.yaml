reference: 1 John 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: hi
  text: हर वह व्यक्ति जो विश्वास करता है कि यीशु मसीह है,[a] परमेश्वर से जन्मा है; और जो कोई जन्म देने वाले से प्रेम करता है, वह उससे जन्मे हुए से भी प्रेम करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त है।” यूनानी शब्द Χριστός एक उपाधि है, जिसका अर्थ “अभिषिक्त जन” है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “जन्मा है,” “जन्म देने वाले” और “जन्मे हुए” के लिए एक ही मूल क्रिया के अलग-अलग रूप आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: हर वह व्यक्ति जो विश्वास करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का सार्वत्रिक अर्थ है। यह हिंदी में स्वाभाविक है और प्रत्येक ऐसे व्यक्ति को सम्मिलित करता है जिसकी पहचान विश्वास करनेवाले के रूप में होती है।
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: कि यीशु ही मसीह है
  rationale: χριστός यहाँ उपाधि है। ‘मसीह’ हिंदी में इस अभिषिक्त, प्रतिज्ञात व्यक्ति की उपाधि को स्वाभाविक रूप से व्यक्त करता है; ‘ही’ विधेय की पहचानात्मक और अंगीकारात्मक शक्ति स्पष्ट करता है।
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: परमेश्वर से जन्मा है
  rationale: पूर्णकालिक कर्मवाच्य रूप बीते हुए जन्म और उसके वर्तमान स्थायी परिणाम को व्यक्त करता है। ‘से’ ἐκ के स्रोत-बोध को बनाए रखता है।
- source_word: πᾶς ὁ ἀγαπῶν
  choice: जो कोई ... प्रेम करता है
  rationale: यह भी सार्वत्रिक, संज्ञात्मक वर्तमान कृदंत है; हिंदी में ‘जो कोई’ इसकी व्यापकता और वाक्यगत प्रवाह दोनों बनाए रखता है।
- source_word: τὸν γεννήσαντα
  choice: जन्म देनेवाले
  rationale: यह γεννάω का कर्तृवाचक रूप है और परमेश्वर को जन्म का स्रोत बताता है। ‘पिता’ कहना मूल शब्द से अधिक व्याख्यात्मक होता, जबकि यह चयन उसी क्रिया-परिवार को आगे के कर्मवाच्य रूप से जोड़ता है।
- source_word: ἀγαπᾷ καὶ
  choice: से भी प्रेम करता है
  rationale: καί दूसरे प्रेम-पात्र को जोड़ता है; हिंदी में ‘भी’ परमेश्वर से प्रेम और उससे जन्मे व्यक्ति से प्रेम के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: उससे जन्मे व्यक्ति
  rationale: पूर्णकालिक कर्मवाच्य कृदंत जन्म पाए हुए व्यक्ति और उस संबंध के बने रहने को दर्शाता है। ‘व्यक्ति’ सामान्य एकवचन को स्पष्ट रखता है और इसे केवल यीशु या किसी विशिष्ट संतान तक सीमित नहीं करता।
theological_decisions:
- issue: γεννάω के सक्रिय और कर्मवाच्य रूपों में जन्म/उत्पत्ति की समान शब्दावली
  choice: ‘परमेश्वर से जन्मा’, ‘जन्म देनेवाले’ और ‘उससे जन्मे व्यक्ति’
  alternative: ‘परमेश्वर की संतान’, ‘पिता’ और ‘उसकी संतान’
  rationale: चुना गया रूप मूल यूनानी में एक ही क्रिया के तीन प्रयोगों को यथासंभव दृश्य रखता है और पिता-संतान की व्याख्यात्मक भाषा जोड़कर संबंध को मूल से अधिक निश्चित नहीं करता।
- issue: ὁ χριστός की मसीही उपाधि
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ शब्द यीशु की अंगीकारात्मक उपाधि है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में परिचित है और इसे केवल व्यक्तिगत नाम बनने से बचाते हुए अर्थपूर्ण उपाधि के रूप में रखता है।
- issue: τὸν γεγεννημένον का संदर्भ
  choice: सामान्य रूप में ‘उससे जन्मे व्यक्ति’
  alternative: ‘उसके बच्चे’ अथवा विशेष रूप से ‘यीशु’
  rationale: व्याकरणिक एकवचन संदर्भगत रूप से परमेश्वर से जन्मे प्रत्येक व्यक्ति की ओर संकेत कर सकता है। सामान्य भाषा मूल की इस व्यापकता को बनाए रखती है और किसी एक विवादित पहचान को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘परमेश्वर से जन्मा’ यूहन्नाई जन्म-भाषा और स्रोत-बोध को बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदांशों के बाद रखे गए हैं।
