review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes ἡ ἀγάπη τοῦ θεοῦ in its immediate Johannine context as believers’ love for God, renders τηρῶμεν as obedience to/keeping the commandments, and conveys βαρεῖαι as not oppressive. A footnote should retain the Greek genitive’s alternative reading, as documented in the English audit trail.
  naturalness: “परमेश्वर से प्रेम यही है” is understandable but less idiomatic than “परमेश्वर से प्रेम का अर्थ यह है.” For commandments, “बोझ नहीं हैं” is more natural modern Hindi than “बोझिल नहीं हैं,” which can also suggest tedious or dull discourse.
  terminology: “परमेश्वर,” “प्रेम,” “आज्ञाएँ,” and “पालन” are appropriate, dignified, and consistent terms. The added note preserves the alternative grammatical possibility without imposing it on the translation.
  issues:
  - severity: low
    issue: The opening predicate construction is somewhat stiff in modern Hindi.
    rationale: Adding “का अर्थ” makes the explanatory force of αὕτη ... ἵνα natural while retaining the verse’s meaning.
  - severity: medium
    issue: No footnote preserves the alternative sense of τοῦ θεοῦ.
    rationale: Although the context favors “परमेश्वर से प्रेम,” the Greek genitive may also be read as “परमेश्वर का प्रेम”; an anchored note transparently records this ambiguity.
  - severity: low
    issue: “बोझिल” is not the most idiomatic predicate for commandments.
    rationale: “बोझ नहीं हैं” directly and naturally expresses that the commandments are not burdensome.
  revised_text: क्योंकि परमेश्वर से प्रेम[a] का अर्थ यह है कि हम उसकी आज्ञाओं का पालन करें, और उसकी आज्ञाएँ बोझ नहीं हैं।
  revised_footnotes:
