    text: यूनानी वाक्यांश का अनुवाद “परमेश्वर का प्रेम” भी हो सकता है; पर निकट संदर्भ में अर्थ “परमेश्वर से प्रेम” अधिक उपयुक्त है।
    reason: alternative_reading
