id: 1JN.5.3
reference: 1 John 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: hi
  text: क्योंकि परमेश्वर से प्रेम[a] का अर्थ यह है कि हम उसकी आज्ञाओं का पालन करें, और उसकी आज्ञाएँ बोझ नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अनुवाद “परमेश्वर का प्रेम” भी हो सकता है; पर निकट संदर्भ में अर्थ “परमेश्वर से प्रेम” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: यही
  rationale: यह संकेतवाचक शब्द आगे आने वाले कथन की ओर संकेत करता है; ‘यही’ हिन्दी में परिभाषात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर से प्रेम
  rationale: निकट संदर्भ में विश्वासियों द्वारा परमेश्वर से प्रेम करना उसकी आज्ञाओं के पालन में प्रकट होता है; ‘से प्रेम’ हिन्दी में इस उद्देश्यवाचक संबंध को स्वाभाविक और स्पष्ट रूप देता है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ यह प्रेम किस बात में निहित है, उसका आशय प्रस्तुत किया गया है; ‘कि’ हिन्दी में इस व्याख्यात्मक उपवाक्य को सहजता से जोड़ता है।
- source_word: τὰς ἐντολὰς
  choice: आज्ञाओं
  rationale: ‘आज्ञा’ ἐντολή के अधिकारपूर्ण अर्थ और यूहन्ना-साहित्य की परिचित शब्दावली को बनाए रखता है।
- source_word: τηρῶμεν
  choice: हम ... पालन करें
  rationale: आज्ञाओं के संदर्भ में τηρέω का अर्थ मानना या उनका पालन करना है; ‘पालन करें’ आधुनिक हिन्दी में ‘रखें’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: βαρεῖαι
  choice: बोझिल
  rationale: यह शब्द ऐसी बात को दर्शाता है जो भारी या सहने में कठिन हो; ‘बोझिल’ मूल रूपक और उसके व्यावहारिक अर्थ दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: विश्वासियों का परमेश्वर से प्रेम
  alternative: परमेश्वर का विश्वासियों के प्रति प्रेम; अथवा दोनों अर्थों की संयुक्त अस्पष्टता
  rationale: पद 2–3 का निकट संदर्भ परमेश्वर से प्रेम करने को उसकी आज्ञाओं के पालन से जोड़ता और उसी प्रेम को परिभाषित करता है। इसलिए उद्देश्यवाचक अर्थ अधिक संभावित है। हिन्दी में ‘परमेश्वर का प्रेम’ सामान्यतः परमेश्वर द्वारा किए जाने वाले प्रेम के रूप में समझा जाता, अतः यहाँ संदर्भ-सम्मत अर्थ स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘आज्ञाओं का पालन’ प्रचलित और स्पष्ट धार्मिक अभिव्यक्ति है; अनावश्यक संस्कृतनिष्ठता तथा संप्रदाय-विशेष की शब्दावली से बचा गया है।
