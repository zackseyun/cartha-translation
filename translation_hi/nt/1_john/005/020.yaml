language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: hi
  text: और हम जानते हैं कि परमेश्वर का पुत्र आ चुका है और उसने हमें समझ दी है, ताकि हम उस सच्चे को जानें। और हम उस सच्चे में हैं—उसके पुत्र यीशु मसीह में। यही[a] सच्चा परमेश्वर और अनन्त जीवन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यही’ का संकेत विशेष रूप से यीशु मसीह की ओर हो सकता है; पर कुछ व्याख्याकार इसे पिछले वाक्यांश में आए ‘उस सच्चे’, अर्थात् पिता, की ओर संकेत मानते हैं।
    reason: संकेतवाचक οὗτός के पूर्वपद के विषय में वास्तविक व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα का पूर्णकालिक रूप यहाँ वर्तमान स्थिति और दृढ़ ज्ञान को व्यक्त करता है; हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: ἥκει
  choice: आ चुका है
  rationale: यह आने की पूर्ण घटना और उसके वर्तमान परिणाम, दोनों को व्यक्त करता है।
- source_word: δέδωκεν
  choice: उसने हमें समझ दी है
  rationale: पूर्णकाल दिए गए वरदान के बने रहने वाले प्रभाव को सूचित करता है; ‘दी है’ इसे स्वाभाविक रूप से रखता है।
- source_word: διάνοιαν
  choice: समझ
  rationale: सन्दर्भ में इसका अर्थ सत्य को पहचानने की बौद्धिक-आत्मिक क्षमता है, केवल ‘मन’ नहीं।
- source_word: ἵνα γινώσκωμεν
  choice: ताकि हम ... जानें
  rationale: ἵνα के प्रयोजनार्थक बल और वर्तमान विधिलिंग को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: उसे जो सत्य है / उसमें जो सत्य है
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। समान अभिव्यक्ति की पुनरावृत्ति यूहन्नाई शैली को बनाए रखती है और किसी अतिरिक्त उपाधि को नहीं जोड़ती।
- source_word: ἐσμὲν ἐν
  choice: हम उसमें हैं
  rationale: मूल पाठ सीधे ‘में होना’ कहता है; ‘बने रहते हैं’ या ‘एक हो गए हैं’ जैसी व्याख्या नहीं जोड़ी गई।
- source_word: ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ
  choice: उसके पुत्र यीशु मसीह में
  rationale: सम्बन्ध और ‘में’ की भाषा सुरक्षित रहती है; Χριστός को हिन्दी की प्रचलित मसीही उपाधि ‘मसीह’ से व्यक्त किया गया है।
- source_word: οὗτός
  choice: यही
  rationale: यह यूनानी संकेतवाचक का बल बनाए रखता है और निकटतम पूर्वपद की ओर स्वाभाविक संकेत करता है, पर उसके सन्दर्भ को व्याख्यात्मक रूप से निर्णीत नहीं करता।
- source_word: ὁ ἀληθινὸς θεὸς
  choice: सच्चा परमेश्वर
  rationale: यह पद का सीधा और हिन्दी में स्थापित रूप है।
- source_word: ζωὴ αἰώνιος
  choice: अनन्त जीवन
  rationale: यह यूहन्नाई प्रयोग का स्वाभाविक और स्थापित हिन्दी रूप है, जिसमें जीवन की अवधि और गुण दोनों निहित रह सकते हैं।
theological_decisions:
- issue: οὗτός (‘यही’) का पूर्वपद
  choice: मुख्य पाठ में ‘यही’ रखा गया है, जो निकटतम व्यक्तिगत पूर्वपद ‘उसके पुत्र यीशु मसीह’ की ओर स्वाभाविक संकेत कर सकता है।
  alternative: इसे पहले आए ‘जो सत्य है’, अर्थात् पिता, की ओर संकेत समझा जा सकता है।
  rationale: यूनानी वाक्यरचना में निकटतम पूर्वपद यीशु मसीह है, पर संकेतवाचक के सन्दर्भ पर ऐतिहासिक रूप से मतभेद रहा है। इसलिए मुख्य पाठ सीधे मूल संकेतवाचक को रखता है और पादटिप्पणी दूसरे सम्भव सम्बन्ध को सुरक्षित रखती है।
- issue: ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ का सम्बन्ध
  choice: ‘और हम उसमें हैं जो सत्य है—उसके पुत्र यीशु मसीह में।’
  alternative: ‘अर्थात् उसके पुत्र’ कहकर दोनों पदों को स्पष्ट समानाधिकरण मानना।
  rationale: डैश दूसरे वाक्यांश की व्याख्यात्मक/सम्बद्ध भूमिका दिखाता है, पर ‘अर्थात्’ जोड़कर सम्बन्ध को मूल से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निकट-औपचारिक शैली अपनाई गई है। ‘आ चुका है’ और ‘दी है’ यूनानी पूर्णकाल के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करते हैं। ‘जो सत्य है’ कृत्रिम उपाधि बनाने के बजाय substantival adjective को सहज रूप देता है; ‘यही’ संकेतवाचक बल और धर्मवैज्ञानिक तनाव दोनों बनाए रखता है।
