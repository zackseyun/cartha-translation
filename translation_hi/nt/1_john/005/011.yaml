source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: hi
  text: 'और गवाही यह है: परमेश्वर ने हमें अनन्त जीवन दिया है, और यह जीवन उसके पुत्र में है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: गवाही
  rationale: यूहन्ना के साक्ष्य-संबंधी प्रसंग में यह उस बात को दर्शाता है जिसकी पुष्टि की जा रही है; आधुनिक हिन्दी में ‘गवाही’ स्वाभाविक और स्पष्ट है।
- source_word: ὅτι
  choice: 'यह है:'
  rationale: यूनानी ὅτι गवाही की विषयवस्तु प्रस्तुत करता है। हिन्दी में पूर्ववर्ती ‘यह है’ और विसर्ग के द्वारा इसे स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह यूहन्ना की शब्दावली का प्रचलित और गरिमापूर्ण हिन्दी रूप है, जो जीवन की अवधि और परमेश्वर से प्राप्त उसके गुण—दोनों को खुला रखता है।
- source_word: ἔδωκεν
  choice: दिया है
  rationale: यूनानी एओरिस्ट पूर्ण किए गए दान को बताता है; हिन्दी पूर्ण वर्तमान ‘दिया है’ उसके वर्तमान परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ θεὸς ἡμῖν
  choice: परमेश्वर ने हमें
  rationale: कर्ता और अप्रत्यक्ष कर्म का सीधा, स्पष्ट हिन्दी रूप।
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: उसके पुत्र में
  rationale: ‘में’ यूनानी ἐν और यूहन्ना की सघन धर्मवैचारिक अभिव्यक्ति को सुरक्षित रखता है; इसे ‘उसके पुत्र के द्वारा’ कहने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: यह ... यह जीवन
  rationale: दोहराए गए संकेतवाचक को बनाए रखने से यूनानी का बल और दोनों कथनों का संबंध सुरक्षित रहता है।
theological_decisions:
- issue: ἔδωκεν का कालगत बल और जीवन का वर्तमान अधिकार
  choice: ‘दिया है’
  alternative: ‘दिया’
  rationale: यह परमेश्वर के पूर्ण किए हुए कार्य और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है, बिना किसी विशिष्ट धर्मसैद्धान्तिक व्यवस्था को आरोपित किए।
- issue: जीवन का परमेश्वर के पुत्र ‘में’ होना
  choice: मूल की सघन अभिव्यक्ति ‘उसके पुत्र में’ को बनाए रखा
  alternative: ‘उसके पुत्र के द्वारा’ या ‘उसके पुत्र के पास’
  rationale: यूनानी कथन जीवन को पुत्र के संबंध में ‘में’ स्थित बताता है। व्याख्यात्मक विस्तार उसकी वास्तविक व्यापकता और धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘अनन्त जीवन’, ‘परमेश्वर’ और ‘पुत्र’ बाइबलीय हिन्दी के परिचित पद हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ मूल की अस्पष्टता और बल को पर्याप्त रूप से सुरक्षित रखता है।
