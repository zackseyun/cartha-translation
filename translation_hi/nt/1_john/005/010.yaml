id: 1JN.5.10
reference: 1 John 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: hi
  text: जो परमेश्वर के पुत्र पर विश्वास करता है, उसके भीतर यह गवाही है[a]; जो परमेश्वर की बात पर विश्वास नहीं करता, उसने उसे झूठा ठहराया है, क्योंकि उसने उस गवाही पर विश्वास नहीं किया जो परमेश्वर ने अपने पुत्र के विषय में दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “उसके भीतर” के स्थान पर “उसमें” है, जिसका अर्थ “पुत्र में” भी समझा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: जो परमेश्वर के पुत्र पर विश्वास करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत के सामान्य एकवचन भाव को स्वाभाविक हिन्दी में रखा गया है; πιστεύω के साथ εἰς व्यक्ति की ओर निर्देशित विश्वास को व्यक्त करता है।
- source_word: τὴν μαρτυρίαν
  choice: यह गवाही / उस गवाही
  rationale: ‘गवाही’ यूहन्ना के न्यायिक-साक्ष्य संबंधी भाव को स्पष्ट और सामान्य आधुनिक हिन्दी में बनाए रखती है। पहले उल्लेख में ‘यह’ प्रसंग में बताई गई गवाही की ओर संकेत करता है।
- source_word: ἐν αὑτῷ
  choice: उसके भीतर
  rationale: SBLGNT के आत्मवाचक αὑτῷ का सबसे स्वाभाविक संकेत पहले बताए गए विश्वासी की ओर है और गवाही के आंतरिक रूप से उसके पास होने का भाव रखता है।
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: जो परमेश्वर की बात पर विश्वास नहीं करता
  rationale: सम्प्रदान कारक यहाँ परमेश्वर द्वारा कही गई गवाही को सत्य न मानने का अर्थ देता है, न कि केवल परमेश्वर के अस्तित्व में विश्वास न करने का। ‘की बात पर’ हिन्दी में इस अंतर को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: उसने उसे झूठा ठहराया है
  rationale: शाब्दिक ‘उसे झूठा बनाया है’ हिन्दी में भ्रामक हो सकता है; ‘झूठा ठहराया है’ उस भाव को व्यक्त करता है कि गवाही अस्वीकार करके व्यक्ति परमेश्वर को असत्य कहता है। पूर्ण काल का वर्तमान परिणाम ‘है’ से बना रहता है।
- source_word: οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν
  choice: उस गवाही पर विश्वास नहीं किया
  rationale: पूर्ण काल जारी परिणाम वाले अविश्वास को दर्शाता है; εἰς के लक्ष्यसूचक भाव के लिए हिन्दी में ‘पर विश्वास’ स्वाभाविक है।
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ
  choice: जो परमेश्वर ने अपने पुत्र के विषय में दी है
  rationale: हिन्दी में ‘गवाही दी है’ संज्ञा और सजातीय क्रिया का संबंध स्वाभाविक ढंग से सुरक्षित रखता है; περί का अर्थ ‘के विषय में’ है।
theological_decisions:
- issue: ‘उसके भीतर गवाही’ का संकेत
  choice: गवाही विश्वासी के भीतर है
  alternative: गवाही पुत्र में है
  rationale: दिए गए SBLGNT पाठ में आत्मवाचक ἐν αὑτῷ सबसे स्वाभाविक रूप से अभी उल्लिखित विश्वासी की ओर संकेत करता है; वैकल्पिक पांडुलिपि-पाठ को पादटिप्पणी में रखा गया है।
- issue: ‘परमेश्वर पर/की बात पर विश्वास न करना’ का अर्थ
  choice: परमेश्वर की गवाही को सत्य न मानना
  alternative: सामान्य रूप से परमेश्वर के अस्तित्व में विश्वास न करना
  rationale: आगे का ὅτι-वाक्य इस अविश्वास को परमेश्वर द्वारा पुत्र के विषय में दी गई गवाही न मानने के रूप में समझाता है।
- issue: ‘झूठा बनाया’ मुहावरे का अर्थ
  choice: परमेश्वर को झूठा ठहराना
  alternative: शाब्दिक रूप से परमेश्वर को झूठा बना देना
  rationale: कथन का आशय परमेश्वर के स्वरूप को बदलना नहीं, बल्कि उसकी गवाही ठुकराकर उसे झूठा मानना या घोषित करना है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘झूठा ठहराया’ और ‘परमेश्वर की बात पर विश्वास’ जैसे प्रयोग मूल यूनानी के अर्थभेद को स्वाभाविक हिन्दी में व्यक्त करते हैं।
