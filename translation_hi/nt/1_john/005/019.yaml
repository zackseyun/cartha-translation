  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: hi
  text: हम जानते हैं कि हम परमेश्वर से हैं, और सारा संसार उस दुष्ट के वश में पड़ा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “सारा संसार उस दुष्ट में पड़ा है।” “उस दुष्ट” का अर्थ “बुराई” भी समझा जा सकता है, पर यूहन्ना के प्रयोग में व्यक्तिगत अर्थ अधिक संभावित है।'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: यह क्रिया दृढ़ और सुनिश्चित ज्ञान व्यक्त करती है; यह स्वाभाविक हिन्दी में पत्र की आश्वस्त वाणी बनाए रखती है।
- source_word: ἐκ τοῦ θεοῦ
  choice: हम परमेश्वर से हैं
  rationale: ἐκ यहाँ स्रोत, उद्गम या संबंध दर्शाता है। यह अनुवाद ‘परमेश्वर से जन्मे हैं’ जैसी अधिक विशिष्ट धारणा जोड़े बिना मूल की संक्षिप्तता बनाए रखता है।
- source_word: ὁ κόσμος ὅλος
  choice: सारा संसार
  rationale: ὅλος व्यापकता पर बल देता है, और ‘सारा संसार’ आधुनिक हिन्दी में सहज तथा अर्थनिष्ठ है।
- source_word: ἐν τῷ πονηρῷ
  choice: उस दुष्ट के वश में
  rationale: यूहन्ना के प्रयोग में substantivized πονηρός संभवतः एक व्यक्तिगत दुष्ट सत्ता को सूचित करता है। ‘वश में’ यूनानी संबंध की स्वाभाविक हिन्दी अभिव्यक्ति है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: κεῖται
  choice: पड़ा है
  rationale: यह केῖται के ‘पड़ा होना’ रूपक को बनाए रखता है और ‘वश में’ के साथ मिलकर स्थायी दशा या अधीनता व्यक्त करता है।
theological_decisions:
- issue: क्या τῷ πονηρῷ अमूर्त बुराई को दर्शाता है या व्यक्तिगत ‘दुष्ट’ को
  choice: 'व्यक्तिगत: ‘उस दुष्ट’'
  alternative: 'अमूर्त: ‘बुराई’'
  rationale: यूहन्ना के साहित्य में ὁ πονηρός प्रायः व्यक्तिगत दुष्ट को दर्शाता है (देखें 1 यूहन्ना 2:13–14; 3:12; 5:18)। फिर भी व्याकरणिक रूप से अमूर्त अर्थ पूरी तरह असंभव नहीं है, इसलिए उसे पादटिप्पणी में दर्ज किया गया है।
- issue: ἐν τῷ πονηρῷ में निहित संबंध को हिन्दी में कैसे व्यक्त किया जाए
  choice: ‘उस दुष्ट के वश में’
  alternative: 'अधिक शाब्दिक: ‘उस दुष्ट में’'
  rationale: ‘उस दुष्ट में पड़ा है’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। ‘वश में पड़ा है’ अधीनता की प्रासंगिक शक्ति व्यक्त करता है, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के लिए स्वाभाविक। ‘परमेश्वर’ तथा ‘उस दुष्ट’ बाइबलीय संदर्भ के अनुरूप हैं, और ‘वश में पड़ा है’ मूल रूपक तथा उसके आशय दोनों को सहज हिन्दी में व्यक्त करता है।
