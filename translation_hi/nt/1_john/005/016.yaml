id: 1JN.5.16
reference: 1 John 5:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: hi
  text: यदि कोई अपने भाई को ऐसा पाप करते देखे जो मृत्यु की ओर नहीं ले जाता,[a] तो वह माँगे, और परमेश्वर[b] उसे जीवन देगा—अर्थात उन्हें जो ऐसा पाप करते हैं जो मृत्यु की ओर नहीं ले जाता। ऐसा पाप है जो मृत्यु की ओर ले जाता है; उसके विषय में मैं यह नहीं कहता कि वह माँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मृत्यु’ का अर्थ शारीरिक मृत्यु, आत्मिक मृत्यु या अंतिम दण्ड हो सकता है; यूनानी पाठ इसे स्पष्ट नहीं करता।
    reason: theological_ambiguity
  - marker: b
    text: यूनानी में ‘जीवन देगा’ का कर्ता स्पष्ट रूप से नहीं दिया गया है; प्रार्थना के प्रसंग के कारण अनुवाद में ‘परमेश्वर’ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: भाई
  rationale: यूनानी शब्द एकवचन पुल्लिंग है और यूहन्ना के प्रयोग में सामान्यतः मसीही समुदाय के एक सहविश्वासी को सूचित करता है; ‘भाई’ स्रोत के रूप को बनाए रखता है।
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: पाप करते
  rationale: कृदंत और सजातीय कर्म को स्वाभाविक हिन्दी में ठोस पाप-कर्म के रूप में व्यक्त करता है।
- source_word: μὴ πρὸς θάνατον
  choice: जो मृत्यु की ओर नहीं ले जाता
  rationale: πρός के दिशा/परिणाम भाव को व्यक्त करता है और ‘मृत्यु’ के शारीरिक, आत्मिक अथवा अंतिम दण्ड होने की अस्पष्टता बनाए रखता है।
- source_word: αἰτήσει
  choice: वह माँगे
  rationale: भविष्यत् निर्देशात्मक बल को प्रार्थना के प्रसंग में सहज हिन्दी निर्देश के रूप में प्रस्तुत करता है।
- source_word: δώσει αὐτῷ ζωήν
  choice: परमेश्वर उसे जीवन देगा
  rationale: यूनानी में कर्ता अव्यक्त है; प्रार्थना के प्रसंग में जीवन देने वाला परमेश्वर समझा जाता है।
- source_word: ζωήν
  choice: जीवन
  rationale: यूहन्ना के धर्मवैज्ञानिक रूप से समृद्ध शब्द को बिना ‘आत्मिक’ या ‘अनन्त’ जोड़कर सीमित किए सरल रूप में रखता है।
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: अर्थात उन्हें जो ऐसा पाप करते हैं जो मृत्यु की ओर नहीं ले जाता
  rationale: यूनानी बहुवचन को बनाए रखते हुए कठिन दत्तिव पदबंध को व्याख्यात्मक अनुप्रयोग के रूप में प्रस्तुत करता है।
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: ऐसा पाप भी है जो मृत्यु की ओर ले जाता है
  rationale: वाक्य की श्रेणीगत अस्पष्टता को यथासंभव रखते हुए आधुनिक हिन्दी में स्वाभाविक कथन देता है।
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: उसके विषय में मैं यह नहीं कहता कि वह माँगे
  rationale: ἐρωτάω को प्रार्थना-संबंधी ‘माँगे’ से व्यक्त करते हुए लेखक के कथन को निषेध के बजाय सावधानीपूर्ण अनिर्देश के रूप में बनाए रखता है।
theological_decisions:
- issue: ‘मृत्यु की ओर ले जाने वाले पाप’ में मृत्यु का अर्थ
  choice: केवल ‘मृत्यु’ कहा गया है; उसका प्रकार निर्धारित नहीं किया गया।
  alternative: शारीरिक मृत्यु, आत्मिक/अनन्त मृत्यु, अथवा अंतिम दण्ड
  rationale: पद स्वयं मृत्यु का प्रकार परिभाषित नहीं करता; अनुवाद को विवादित धर्मवैज्ञानिक प्रश्न का समाधान नहीं थोपना चाहिए।
- issue: ‘जीवन देगा’ का कर्ता
  choice: परमेश्वर को स्पष्ट कर्ता बनाया गया।
  alternative: कर्ता को ‘वह’ के रूप में अस्पष्ट रखना अथवा प्रार्थना करने वाले को कर्ता समझना
  rationale: यूनानी में कर्ता अव्यक्त है, पर प्रार्थना के प्रसंग में जीवन देने वाला परमेश्वर स्वाभाविक रूप से अभिप्रेत है; फुटनोट इस पूर्ति को स्पष्ट करता है।
- issue: अंतिम वाक्य का बल
  choice: लेखक उस पाप के विषय में माँगने का निर्देश नहीं देता।
  alternative: लेखक उस पाप के लिए प्रार्थना करने को पूर्णतः मना करता है।
  rationale: οὐ ... λέγω ἵνα का शब्दार्थ ‘मैं यह नहीं कहता कि’ है; इसे स्पष्ट निषेध बनाना स्रोत से अधिक निर्णायक होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘माँगे’ प्रार्थना का प्रसंग बनाए रखता है, जबकि ‘प्रार्थना करे’ लिखकर यूनानी के दो निकटवर्ती अनुरोध-वाचक क्रियापदों को अनावश्यक रूप से एक धर्मवैज्ञानिक तकनीकी पद में नहीं बदला गया। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
