source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: hi
  text: इसी से हम जानते हैं कि हम परमेश्वर की संतानों से प्रेम करते हैं—जब हम परमेश्वर से प्रेम करते और उसकी आज्ञाओं का पालन करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी आज्ञाओं को करते हैं।” यहाँ यूनानी क्रिया ποιῶμεν का अर्थ “करते हैं” है; सामान्यतः प्रयुक्त “मानते/पालन करते हैं” वाली क्रिया τηρέω यहाँ नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह यूहन्ना की विशिष्ट अभिव्यक्ति है, जो किसी बात को जानने का आधार या पहचान बताती है। ‘इसी से’ संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γινώσκομεν
  choice: हम जानते हैं
  rationale: वर्तमान काल में चलती हुई पहचान या निश्चित ज्ञान का भाव है; ‘हम जानते हैं’ स्पष्ट और स्वाभाविक है।
- source_word: ἀγαπῶμεν
  choice: हम ... से प्रेम करते हैं
  rationale: ἀγαπάω के वर्तमान रूप को सरल वर्तमान काल में अनूदित किया गया है; दोनों स्थानों पर ‘प्रेम’ रखकर शाब्दिक संगति बनाए रखी गई है।
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: परमेश्वर की संतानों
  rationale: τέκνα का समावेशी पारिवारिक अर्थ ‘संतान’ से व्यक्त होता है; यह स्त्री और पुरुष दोनों को समेटता है और आधुनिक हिन्दी में गरिमापूर्ण है।
- source_word: ὅταν
  choice: जब
  rationale: वर्तमान संभावनार्थक क्रियाओं के साथ इसका अर्थ ‘जब’ या ‘जब कभी’ हो सकता है। यहाँ ‘जब’ अधिक सहज है और कालिक-शर्तीय संबंध को खुला रखता है।
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: उसकी आज्ञाओं का पालन करते हैं
  rationale: ποιέω का मूल अर्थ ‘करना’ है, पर हिन्दी में ‘आज्ञाएँ करना’ अस्वाभाविक है। ‘आज्ञाओं का पालन करना’ आदेशों को कार्य में उतारने का अर्थ स्वाभाविक रूप से देता है; पादटिप्पणी मूल क्रिया की शाब्दिक विशेषता बताती है।
theological_decisions:
- issue: परमेश्वर की संतानों से प्रेम और परमेश्वर से प्रेम का संबंध
  choice: वचन को ऐसा रखा गया है कि परमेश्वर की संतानों से प्रेम की पहचान परमेश्वर से प्रेम करने और उसकी आज्ञाओं का पालन करने में होती है।
  alternative: इसे केवल प्रमाण, कारण, या दोनों प्रकार के प्रेम की परिभाषा के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्य संबंध को संक्षेप में प्रस्तुत करता है और उसकी तार्किक प्रकृति को आगे परिभाषित नहीं करता। अनुवाद उसी तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक पाठ के योग्य शैली। ‘संतानों’ समावेशी पारिवारिक अर्थ रखता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘आज्ञाओं का पालन’ चुना गया है, जबकि पादटिप्पणी यूनानी ‘करना’ को पारदर्शी बनाती है।
