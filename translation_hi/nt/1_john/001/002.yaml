source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: hi
  text: और वह जीवन प्रकट हुआ[a], और हमने उसे देखा है और गवाही देते हैं और तुम्हें उस अनन्त जीवन का समाचार देते हैं[b], जो पिता के साथ था और हमें प्रकट हुआ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दिखाई दिया’ अथवा ‘प्रकाशित हुआ’।
    reason: lexical_alternative
  - marker: b
    text: ‘अनन्त जीवन’ व्याकरण की दृष्टि से जीवन को एक वास्तविकता के रूप में व्यक्त करता है, पर प्रसंग में इसका व्यक्तिगत संदर्भ उस पुत्र से है जो पिता के साथ था और हमें प्रकट हुआ।
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: वह जीवन / उस अनन्त जीवन
  rationale: निश्चयवाचक यूनानी पदबंध को हिन्दी में ‘वह/उस’ से व्यक्त किया गया है, ताकि जीवन को केवल अमूर्त धारणा न समझा जाए और पद में उसकी विशिष्ट, व्यक्तिगत वास्तविकता बनी रहे।
- source_word: ἐφανερώθη
  choice: प्रकट हुआ
  rationale: यह सहज आधुनिक हिन्दी है और उस वास्तविकता के दिखाई देने अथवा उद्घाटित होने का भाव रखती है जो पहले प्रत्यक्ष नहीं थी। कर्मवाच्य अर्थ हिन्दी के इस स्वाभाविक अकर्मक रूप में सुरक्षित है।
- source_word: ἑωράκαμεν
  choice: हमने उसे देखा है
  rationale: पूर्णकालिक रूप प्रत्यक्षदर्शी अनुभव और उसके वर्तमान महत्व—दोनों को व्यक्त करता है। ‘उसे’ हिन्दी में अपेक्षित कर्म है और उसका संदर्भ ‘जीवन’ है।
- source_word: μαρτυροῦμεν
  choice: हम उसकी गवाही देते हैं
  rationale: ‘गवाही देना’ साक्षी और प्रमाण का भाव रखने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἀπαγγέλλομεν
  choice: समाचार सुनाते हैं
  rationale: यह संबोधित लोगों तक बात पहुँचाने और घोषित करने का भाव व्यक्त करता है तथा ‘गवाही देते हैं’ से क्रियात्मक भेद भी बनाए रखता है।
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: उस अनन्त जीवन
  rationale: विशेष, निश्चित जीवन की ओर संकेत बनाए रखते हुए यूनानी पदबंध का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: ἥτις
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम का व्याकरणिक पूर्वपद ‘अनन्त जीवन’ है; ‘जो’ व्यक्तिगत संदर्भ की संभावना को खुला रखता है, पर पाठ में सीधे ‘वह व्यक्ति’ या ‘पुत्र’ नहीं जोड़ता।
- source_word: ἦν πρὸς τὸν πατέρα
  choice: पिता के साथ था
  rationale: यह सम्बन्ध और निकट उपस्थिति का स्वाभाविक हिन्दी रूप है तथा यूहन्नाई अभिव्यक्ति की प्रतिध्वनि बनाए रखता है।
- source_word: ἡμῖν
  choice: हम पर
  rationale: ‘प्रकट होना’ के साथ ‘हम पर’ स्वाभाविक हिन्दी प्रयोग है और प्रेरितों को हुए प्रकाशन/प्रकटीकरण का भाव देता है।
theological_decisions:
- issue: ‘जीवन’ को अमूर्त रूप में रखना या व्यक्तिगत संदर्भ को स्पष्ट कर देना
  choice: मुख्य पाठ में ‘वह जीवन’ और ‘उस अनन्त जीवन’ रखा गया है।
  alternative: ‘वह प्रकट हुआ’ या सीधे ‘पुत्र’ कहना।
  rationale: यूनानी पाठ स्वयं ζωή संज्ञा का प्रयोग करता है, किसी स्पष्ट पुल्लिंग सर्वनाम या ‘पुत्र’ नाम का नहीं। इसलिए व्यक्तिगत संदर्भ को प्रसंग और टिप्पणी से उभरने दिया गया है।
- issue: πρὸς τὸν πατέρα में पूर्व-अस्तित्व और सम्बन्ध को कितना स्पष्ट करना
  choice: ‘पिता के साथ था’
  alternative: ‘पिता की उपस्थिति में था’
  rationale: चुना हुआ रूप मूल के सम्बन्धपरक भाव को संक्षेप में सुरक्षित रखता है और व्याख्यात्मक विस्तार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद 1 से चलता हुआ वाक्य होने के कारण आरम्भ में ‘और’ तथा अंत में दीर्घ विराम-चिह्न रखा गया है।
