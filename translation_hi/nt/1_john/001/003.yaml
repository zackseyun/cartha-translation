id: 1JN.1.3
reference: 1 John 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: hi
  text: जो कुछ हमने देखा और सुना है, उसकी घोषणा हम तुम्हें भी करते हैं, ताकि तुम भी हमारे साथ संगति[a] रखो। और सचमुच हमारी संगति पिता और उसके पुत्र, यीशु मसीह[b], के साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संगति’ का अनुवाद ‘सहभागिता,’ ‘साझेदारी’ या ‘साझा जीवन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पदवी Χριστός का अर्थ ‘मसीह’ अर्थात ‘अभिषिक्त जन’ है; इसका पारंपरिक रूप ‘ख्रीस्त’ भी मिलता है।
    reason: alternative_rendering
lexical_decisions:
- source_word: ὃ
  choice: जो कुछ
  rationale: नपुंसकलिंग एकवचन संबंधवाचक सर्वनाम को व्यापक और असमय व्यक्ति-विशेष न बनाने वाले स्वाभाविक हिन्दी रूप में रखा गया है।
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: हमने देखा और सुना है
  rationale: यूनानी पूर्णकाल के पिछले अनुभव और उसकी वर्तमान साक्ष्यगत प्रासंगिकता को हिन्दी के संयुक्त पूर्ण रूप से व्यक्त किया गया है।
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: उसकी घोषणा हम तुम्हें भी करते हैं
  rationale: क्रिया के समाचार देने या घोषित करने के भाव और καὶ के ‘भी’ को स्पष्ट तथा स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: κοινωνίαν
  choice: संगति
  rationale: यह शब्द साझा सहभागिता, संबंध और सामुदायिक जीवन—तीनों को समेटता है; केवल सामाजिक मेल-जोल या किसी विशिष्ट संस्कार तक अर्थ को सीमित नहीं करता।
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: और सचमुच हमारी संगति
  rationale: δέ के व्याख्यात्मक और बलसूचक भाव को ‘सचमुच’ से व्यक्त किया गया है, बिना उसे कठोर विरोध में बदलने के।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता वाले पदवीगत अर्थ के लिए हिन्दी का प्रचलित और अर्थपूर्ण रूप ‘मसीह’ चुना गया है।
theological_decisions:
- issue: κοινωνία का अर्थ-क्षेत्र
  choice: संगति
  alternative: साझेदारी / सहभागिता
  rationale: ‘संगति’ विश्वासियों की प्रेरित गवाहों के साथ और पिता तथा पुत्र के साथ साझा जीवन-संबंध को व्यक्त करती है तथा संबंध और सहभागिता के बीच की अर्थगत व्यापकता बनाए रखती है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Ἰησοῦ Χριστοῦ में Χριστός की मसीही पदवी और उसका धार्मिक अर्थ बनाए रखा गया है; हिन्दी पाठकों के लिए ‘मसीह’ स्वाभाविक और सुबोध है।
- issue: पिता और पुत्र के साथ संगति
  choice: कथन को बिना व्याख्यात्मक विस्तार के यथावत रखा गया
  alternative: परमेश्वर पिता और उसके पुत्र के साथ आत्मिक सहभागिता
  rationale: मूल पाठ केवल ‘पिता’ और ‘उसके पुत्र’ कहता है; अतिरिक्त धर्मवैज्ञानिक विशेषण जोड़ने से बचते हुए उसके संबंधपरक दावे और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए पहले यूनानी वाक्य को दो वाक्यों में बाँटा गया है, जबकि उसके तर्कसंबंध को ‘और सचमुच’ से बनाए रखा गया है।
