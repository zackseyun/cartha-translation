source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: hi
  text: यदि हम कहते हैं कि हम में पाप नहीं है[a], तो हम अपने आप को धोखा देते हैं, और सत्य हम में नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “हम में पापमयता नहीं है”; यूनानी में शाब्दिक शब्द “पाप” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: यदि हम कहते हैं
  rationale: ἐὰν के साथ अओरिस्ट सब्जंक्टिव एक शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि हम कहते हैं’ स्वाभाविक है और सम्भावित दावे का भाव बनाए रखता है।
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: हम में पाप नहीं है
  rationale: यूनानी में एकवचन ἁμαρτίαν यहाँ किसी एक पाप-कर्म के बजाय पाप की विद्यमानता बताता है। शाब्दिक ‘हम पाप नहीं रखते’ हिन्दी में अस्वाभाविक है; ‘हम में पाप नहीं है’ अर्थ को स्वाभाविक रूप से व्यक्त करता है और आगे के ‘हम में’ से भी संगति रखता है।
- source_word: ἑαυτοὺς πλανῶμεν
  choice: हम अपने आप को धोखा देते हैं
  rationale: प्रतिबिंबवाचक रचना आत्म-छल को व्यक्त करती है; यह हिन्दी में स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: ‘सत्य’ यूहन्ना की संक्षिप्त और व्यापक अभिव्यक्ति को बनाए रखता है, बिना इसे केवल सत्यवादिता या केवल परमेश्वर के प्रकट सत्य तक सीमित किए। हिन्दी में इस अमूर्त संज्ञा के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: हम में नहीं है
  rationale: ἐν ἡμῖν के आंतरिक और व्यक्तिगत आयाम को सीधे तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘हम में पाप नहीं है’ में ‘पाप’ का अर्थ
  choice: एकवचन भाववाचक अर्थ में ‘पाप’, अर्थात व्यक्ति में पाप की उपस्थिति
  alternative: ‘हमने कोई पाप नहीं किया’ या ‘हम में पापमयता नहीं है’
  rationale: ἁμαρτίαν ἔχομεν का अर्थ पाप करना नहीं, बल्कि ‘पाप होना/रखना’ है। इससे पद 10 में पाप करने के इनकार से यहाँ का भेद बना रहता है; ‘पापमयता’ सम्भव व्याख्या है, पर यूनानी से अधिक व्याख्यात्मक है।
- issue: ‘सत्य हम में नहीं है’ का यूहन्नाई आशय
  choice: वाक्य को संक्षिप्त रूप में यथावत रखना
  alternative: ‘परमेश्वर का सत्य हम में नहीं है’ या ‘हम सत्य के अनुसार नहीं जीते’
  rationale: यूनानी कथन वस्तुगत ईश्वरीय सत्य और व्यक्तिपरक सच्चाई—दोनों की प्रतिध्वनि रख सकता है। विस्तार करने से मूल की सार्थक अस्पष्टता सीमित हो जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने आप को’ सामान्य पाठकों के लिए स्वाभाविक है। मुख्य पाठ में ‘पाप’ रखकर मूल की संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
