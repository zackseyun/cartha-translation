  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: hi
  text: परन्तु यदि हम ज्योति में चलते हैं, जैसे वह स्वयं ज्योति में है, तो हम एक-दूसरे के साथ संगति रखते हैं[a], और उसके पुत्र यीशु का लहू हमें हर पाप से शुद्ध करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हम परस्पर संगति रखते हैं।’ कुछ व्याख्याकार ‘एक-दूसरे के साथ’ को विश्वासियों और परमेश्वर के बीच संगति मानते हैं, पर यूनानी का पारस्परिक पद सबसे स्वाभाविक रूप से विश्वासियों की आपसी संगति को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘समस्त पाप से।’ यूनानी पद को वितरणात्मक अर्थ में ‘हर पाप’ या सामूहिक अर्थ में ‘समस्त पाप’ समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: परन्तु यदि
  rationale: δέ पिछले पद में अन्धकार में चलने के दावे के साथ विरोध दर्शाता है; ‘परन्तु यदि’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ φωτὶ
  choice: ज्योति में
  rationale: ‘ज्योति’ यूहन्ना के रूपक और निकटवर्ती प्रसंग की प्रमुख छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
- source_word: περιπατῶμεν
  choice: हम ... चलते हैं
  rationale: नैतिक जीवन के लिए प्रयुक्त मूल ‘चलने’ के रूपक को ‘जीते हैं’ में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: जैसे वह स्वयं ज्योति में है
  rationale: ‘स्वयं’ स्पष्ट αὐτός के हल्के बल को व्यक्त करता है, और ‘जैसे’ तुलना को उससे अधिक निश्चित नहीं बनाता जितनी यूनानी पाठ में है।
- source_word: κοινωνίαν ἔχομεν
  choice: हमारी ... संगति होती है
  rationale: ‘संगति’ साझा सहभागिता और पारस्परिक संबंध दोनों को व्यक्त करती है तथा संस्कार-संबंधी कोई अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: μετ’ ἀλλήλων
  choice: एक-दूसरे के साथ
  rationale: यह पारस्परिक यूनानी सर्वनाम का स्वाभाविक हिन्दी रूप है और विश्वासियों के बीच परस्परता बनाए रखता है।
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: उसके पुत्र यीशु का लहू
  rationale: यह सम्बन्धवाचक संरचना को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘लहू’ को अगले कथन का कर्ता बनाए रखता है।
- source_word: καθαρίζει
  choice: शुद्ध करता है
  rationale: यह नैतिक और धार्मिक शुद्धि के अर्थों को समेटता है; सामान्य वर्तमान काल निरन्तर या चारित्रिक क्रिया की सम्भावना को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: हर पाप से
  rationale: एकवचन ἁμαρτίας के साथ πάσης के वितरणात्मक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: μετ’ ἀλλήλων (‘एक-दूसरे के साथ’) का संदर्भ
  choice: विश्वासियों की आपसी संगति
  alternative: विश्वासियों और परमेश्वर के बीच संगति
  rationale: पारस्परिक ἀλλήλων सामान्यतः मनुष्यों के बीच आपसी संबंध को सूचित करता है। व्यापक प्रसंग में परमेश्वर के साथ संगति अवश्य है, पर इस वाक्यांश के सीधे पारस्परिक अर्थ को मुख्य पाठ में बनाए रखा गया है।
- issue: καθαρίζει के वर्तमान काल का बल
  choice: सामान्य वर्तमान ‘शुद्ध करता है,’ जिसमें निरन्तर या चारित्रिक क्रिया समा सकती है
  alternative: स्पष्ट प्रगतिशील रूप ‘निरन्तर शुद्ध करता रहता है’ अथवा एकबारगी शुद्धि
  rationale: यूनानी वर्तमान यहाँ जारी या चारित्रिक क्रिया का संकेत दे सकता है, पर उसे व्याख्यात्मक ढंग से अत्यधिक स्पष्ट करना उचित नहीं; हिन्दी का सामान्य वर्तमान मूल तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और धर्मशास्त्रीय रूप से संयत शैली रखी गई है। ‘ज्योति,’ ‘संगति,’ ‘लहू’ और ‘शुद्ध करता है’ जैसे परिचित बाइबलीय पद मूल रूपकों और अर्थ-क्षेत्रों को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों के बाद रखे गए हैं जिनसे उनकी सामग्री संबंधित है।
