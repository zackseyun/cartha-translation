id: 1JN.1.5
reference: 1 John 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: hi
  text: 'और यह वह संदेश है जो हमने उससे सुना है और तुम्हें सुनाते हैं[a]: परमेश्वर ज्योति है, और उसमें तनिक भी अंधकार नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे सामने घोषित करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγελία
  choice: संदेश
  rationale: ‘संदेश’ आधुनिक हिन्दी में स्वाभाविक है और उस विषय-वस्तु को ठीक से व्यक्त करता है जिसे आगे सुनाया जा रहा है।
- source_word: ἀκηκόαμεν
  choice: हमने सुना है
  rationale: यह रूप यूनानी पूर्णकाल के उस भाव को बनाए रखता है जिसमें पहले सुनी गई बात का प्रभाव वर्तमान में बना हुआ है।
- source_word: ἀπ’ αὐτοῦ
  choice: उससे
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया है; ‘यीशु से’ या ‘पुत्र से’ कहना संदर्भ की व्याख्या को अनुवाद में जोड़ देता।
- source_word: ἀναγγέλλομεν
  choice: सुनाते हैं
  rationale: यह प्राप्त संदेश को दूसरों तक पहुँचाने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है; ‘घोषित करते हैं’ भी संभव है, पर यहाँ कुछ अधिक औपचारिक है।
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: परमेश्वर ज्योति है
  rationale: विधेय रूपक को बिना व्याख्यात्मक विशेषण जोड़े सीधे बनाए रखा गया है। ‘ज्योति’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में स्पष्ट है।
- source_word: σκοτία
  choice: अंधकार
  rationale: यह शब्द मूल के वास्तविक और नैतिक-रूपकात्मक दोनों अर्थ-संकेतों को सुरक्षित रखता है।
- source_word: ἐν αὐτῷ οὐκ ἔστιν οὐδεμία
  choice: उसमें तनिक भी अंधकार नहीं है
  rationale: ‘तनिक भी ... नहीं’ दोहरे निषेध की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर ज्योति है’ का रूपकात्मक विधेय
  choice: रूपक को सीधे ‘परमेश्वर ज्योति है’ के रूप में रखा गया।
  alternative: ‘परमेश्वर पवित्र ज्योति है’ या ‘परमेश्वर शुद्ध प्रकाश है’
  rationale: ‘पवित्र’ या ‘शुद्ध’ जोड़ना रूपक के व्यापक अर्थ की व्याख्या करना होगा। मूल पाठ रूपक को बिना विस्तार के प्रस्तुत करता है।
- issue: ἀπ’ αὐτοῦ में सर्वनाम का संदर्भ
  choice: ‘उससे’
  alternative: ‘यीशु से’ या ‘पुत्र से’
  rationale: संदर्भ से आशय समझा जा सकता है, पर मूल में संज्ञा के स्थान पर सर्वनाम है; इसलिए वास्तविक संदर्भगत अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है। ‘ज्योति’ और ‘अंधकार’ के रूपकों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
