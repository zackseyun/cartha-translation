reference: 1 John 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: hi
  text: यदि हम कहें कि हमारी उसके साथ संगति है, फिर भी अंधकार में चलते रहें, तो हम झूठ बोलते हैं और सत्य के अनुसार आचरण नहीं करते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “सत्य को नहीं करते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: यदि हम कहें
  rationale: यह स्वाभाविक हिन्दी में शर्त की सम्भावना को बनाए रखता है और ‘दावा करें’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: κοινωνίαν ἔχομεν
  choice: हमारी ... संगति है
  rationale: ‘संगति रखना’ के सम्बन्धात्मक अर्थ को सहज और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: सम्बन्ध या सहभागिता दर्शाने वाले यूनानी पूर्वसर्ग और सर्वनाम को ज्यों का त्यों रखता है; प्रसंग से ‘वह’ परमेश्वर है, पर उसे स्पष्ट करके नहीं जोड़ा गया।
- source_word: ἐν τῷ σκότει
  choice: अंधकार में
  rationale: यूहन्ना के नैतिक-आत्मिक रूपक को सुरक्षित रखता है। हिन्दी में भाववाचक ‘अंधकार’ के साथ निश्चित उपपद स्वाभाविक रूप से व्यक्त नहीं होता।
- source_word: περιπατῶμεν
  choice: चलते रहें
  rationale: जीवन-आचरण के लिए प्रयुक्त बाइबलीय रूपक ‘चलना’ बनाए रखता है; ‘रहें’ शर्त के भीतर जारी आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψευδόμεθα
  choice: हम झूठ बोलते हैं
  rationale: वर्तमानकालीन क्रिया को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: सत्य पर नहीं चलते
  rationale: शाब्दिक ‘सत्य को नहीं करते’ आधुनिक हिन्दी में अस्वाभाविक है। ‘सत्य पर चलना’ सत्य के अनुरूप व्यवहार करने का सक्रिय अर्थ देता है, यद्यपि मूल मुहावरे की जानकारी पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: अंधकार का नैतिक-आत्मिक रूपक
  choice: अंधकार में चलते रहें
  alternative: पाप में जीवन बिताते रहें
  rationale: ‘अंधकार’ को केवल एक व्याख्यात्मक श्रेणी ‘पाप’ में सीमित नहीं किया गया; यूहन्ना में इसके नैतिक, आत्मिक और सत्य-विरोधी अर्थों का तनाव सुरक्षित है।
- issue: सत्य को ‘करना’
  choice: सत्य पर नहीं चलते
  alternative: सत्य को नहीं करते
  rationale: मूल का सक्रिय नैतिक बल बनाए रखते हुए स्वाभाविक हिन्दी दी गई है; इसे केवल ‘सत्य नहीं कहते’ नहीं बनाया गया, क्योंकि यूनानी अभिव्यक्ति व्यवहार को भी समेटती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘संगति,’ ‘अंधकार’ और ‘चलना’ जैसे प्रमुख बाइबलीय शब्द तथा रूपक सुरक्षित हैं।
