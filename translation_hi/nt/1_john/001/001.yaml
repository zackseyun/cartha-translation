id: 1JN.1.1
reference: 1 John 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: hi
  text: जो आरम्भ से था,[a] जिसे हमने सुना है, जिसे हमने अपनी आँखों से देखा है, जिसे हमने निहारा और जिसे हमारे हाथों ने छुआ—जीवन के वचन के विषय में[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वह जो आरम्भ से था।” यूनानी में सम्बन्धवाचक सर्वनाम नपुंसकलिंग है; इसलिए यह केवल पुत्र को सीधे “वह” कहने के बजाय उसके विषय में प्रेरितीय साक्ष्य की पूरी विषयवस्तु की ओर व्यापक संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “जीवन का वचन” पुत्र की ओर व्यक्तिगत रूप से संकेत कर सकता है—यूहन्ना 1:1 की प्रतिध्वनि के साथ—या उसके विषय में जीवनदायी सन्देश को बता सकता है। हिन्दी लिपि में बड़े और छोटे अक्षरों का भेद नहीं है, इसलिए दोनों अर्थ खुले रहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: जो / जिसे
  rationale: यूनानी में बार-बार आया नपुंसकलिंग सम्बन्धवाचक सर्वनाम किसी एक पुरुषवाचक व्यक्ति को स्पष्ट रूप से नामित करने के बजाय साक्ष्य की समग्र विषयवस्तु की ओर संकेत कर सकता है। हिन्दी में ‘जो/जिसे’ इस व्यापकता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: आरम्भ से था
  rationale: यह यूहन्नाई कालगत अभिव्यक्ति को सीधे और संक्षेप में रखता है तथा अपूर्ण भूतकाल ἦν में अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἀκηκόαμεν
  choice: हमने सुना है
  rationale: पूर्णकाल को हिन्दी के पूर्ण पक्ष में रखा गया है, जिससे अतीत में प्राप्त और अब भी प्रभावी प्रेरितीय साक्ष्य व्यक्त होता है।
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: हमने अपनी आँखों से देखा है
  rationale: पूर्णकाल और ‘अपनी आँखों से’ की प्रत्यक्षदर्शी गवाही तथा जोर दोनों सुरक्षित रखे गए हैं।
- source_word: ἐθεασάμεθα
  choice: हमने ध्यान से दृष्टि की
  rationale: यह साधारणतः देखने से अधिक, जान-बूझकर और ध्यानपूर्वक निहारने का भाव व्यक्त करता है, किंतु अत्यधिक पुरातन शब्दावली से बचता है।
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: हमारे हाथों ने छुआ है
  rationale: ‘छुआ’ शारीरिक और प्रत्यक्ष संपर्क को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। हिन्दी वाक्य-समन्वय में पूर्ण पक्ष रखा गया है।
- source_word: περὶ
  choice: के विषय में
  rationale: यह प्रेरितीय साक्ष्य के विषय को प्रस्तुत करने वाला गरिमापूर्ण और सहज हिन्दी प्रयोग है।
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: जीवन का वचन
  rationale: ‘वचन’ λόγος की यूहन्नाई प्रतिध्वनि और संदेश, दोनों संभावनाओं को खुला रखता है; देवनागरी में बड़े-छोटे अक्षर न होने के कारण व्यक्ति और संदेश की अस्पष्टता टिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: नपुंसकलिंग सम्बन्धवाचक उपवाक्यों और λόγος का अभिप्रेत
  choice: आरम्भ में ‘जो/जिसे’ तथा अन्त में ‘जीवन का वचन’ रखा गया है।
  alternative: ‘वह जो आरम्भ से था’ अथवा स्पष्ट रूप से ‘जीवनदायी संदेश’ कहना।
  rationale: सन्दर्भ मसीह-केंद्रित है, फिर भी यूनानी पाठ नपुंसकलिंग सम्बन्धवाचक सर्वनामों का प्रयोग करता है और λόγος व्यक्ति अथवा उसके विषय में जीवनदायी संदेश—दोनों की प्रतिध्वनि रख सकता है। मुख्य पाठ इस तनाव को निर्णीत नहीं करता।
- issue: ‘जीवन के वचन’ और ‘जीवन का वचन’ की हिन्दी व्याख्या
  choice: जीवन का वचन
  alternative: जीवन के विषय में वचन / जीवन देने वाला संदेश
  rationale: सम्बन्धसूचक षष्ठी τῆς ζωῆς का अर्थ जान-बूझकर संक्षिप्त रखा गया है, ताकि जीवन से सम्बन्ध, जीवन देने का भाव और व्यक्तिगत यूहन्नाई प्रतिध्वनि साथ रह सकें।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोहराए गए ‘जिसे’ मूल की साक्ष्यात्मक लय को बनाए रखते हैं। पद अगले वाक्यांशों में जारी रहता है, इसलिए अन्त में दीर्घ विराम-चिह्न रखा गया है।
