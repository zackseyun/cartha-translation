- from: यदि हम अपने पापों को मान लेते हैं, तो वह विश्वासयोग्य और धर्मी[a] है कि हमारे पाप क्षमा करे और हमें सारी अधार्मिकता से शुद्ध करे।
  to: यदि हम अपने पापों को स्वीकार करते हैं, तो वह विश्वासयोग्य और धर्मी[a] है कि हमारे पापों को क्षमा करे और हमें हर प्रकार के अधर्म से शुद्ध करे।
