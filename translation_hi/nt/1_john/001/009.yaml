review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional, confession of sins, God’s faithfulness and righteousness, forgiveness, and cleansing. However, “मान लेते हैं” can suggest simply admitting something and its perfective construction is less well matched to the ongoing/general conditional sense of ὁμολογῶμεν. “स्वीकार करते हैं” is more direct and idiomatic here.
  naturalness: The proposed revision uses natural modern Hindi while retaining a dignified biblical register. “हमारे पापों को क्षमा करे” avoids the slightly compressed construction “हमारे पाप क्षमा करे,” and “हर प्रकार के अधर्म” is clearer and more idiomatic than the abstract singular “सारी अधार्मिकता.”
  terminology: “विश्वासयोग्य,” “धर्मी,” “क्षमा,” and “शुद्ध” appropriately convey πιστός, δίκαιος, ἀφίημι, and καθαρίζω. The footnote correctly preserves “न्यायी” as a legitimate lexical alternative for δίκαιος. “अधर्म” provides a suitably broad moral rendering of ἀδικία without reducing it to isolated wrong acts.
  issues:
  - severity: medium
    issue: “मान लेते हैं” for ὁμολογῶμεν
    rationale: Although possible, this phrasing is somewhat colloquial and can mean merely admitting a fact. “अपने पापों को स्वीकार करते हैं” more clearly conveys confession/acknowledgment in this context and better suits the verse’s general conditional force.
  - severity: low
    issue: “सारी अधार्मिकता” for ἀπὸ πάσης ἀδικίας
    rationale: The meaning is substantially retained, but the expression is less idiomatic in modern Hindi and may be heard narrowly as irreligiosity. “हर प्रकार के अधर्म से” naturally preserves the comprehensive moral scope.
  revised_text: यदि हम अपने पापों को स्वीकार करते हैं, तो वह विश्वासयोग्य और धर्मी[a] है कि हमारे पापों को क्षमा करे और हमें हर प्रकार के अधर्म से शुद्ध करे।
  revised_footnotes:
  - marker: a
    text: या “न्यायी”।
    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic precision for confession and for the comprehensive scope of ἀδικία, while preserving the source’s conditional structure, the linked acts of forgiveness and cleansing, and the lexical ambiguity of δίκαιος.
