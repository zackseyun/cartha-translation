id: 1JN.1.9
reference: 1 John 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: hi
  text: यदि हम अपने पापों को स्वीकार करते हैं, तो वह विश्वासयोग्य और धर्मी[a] है कि हमारे पापों को क्षमा करे और हमें हर प्रकार के अधर्म से शुद्ध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: तीसरे प्रकार की शर्त का स्वाभाविक हिन्दी रूप; शर्त के भाव को बनाए रखता है, बिना बार-बार होने का अर्थ जोड़े।
- source_word: ὁμολογῶμεν
  choice: हम ... मान लेते हैं
  rationale: पापों को स्वीकार करने और उन्हें खुलकर मानने का भाव देता है; आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: अपने पापों को
  rationale: सम्बन्धवाचक सर्वनाम सहित कर्म का सहज और सटीक हिन्दी रूप।
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: परमेश्वर की भरोसेमंदी और अपने वचन तथा चरित्र के प्रति निष्ठा व्यक्त करता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: नैतिक खराई और न्यायपूर्णता दोनों की व्यापकता बनाए रखता है; ‘न्यायी’ सम्भव विकल्प है।
- source_word: ἵνα
  choice: कि
  rationale: विशेषणों के बाद आने वाले ἵνα-वाक्य का स्वाभाविक हिन्दी संयोजन; उद्देश्य या अपेक्षित परिणाम की अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀφῇ
  choice: क्षमा करे
  rationale: पाप के प्रसंग में ἀφίημι का स्पष्ट और प्रचलित अर्थ।
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: हमारे पाप क्षमा करे
  rationale: दत्तिव और प्रत्यक्ष कर्म का सहज हिन्दी विन्यास।
- source_word: καθαρίσῃ
  choice: शुद्ध करे
  rationale: नैतिक अशुद्धता दूर किए जाने की छवि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ πάσης ἀδικίας
  choice: सारी अधार्मिकता से
  rationale: ἀδικία की व्यापक नैतिक-धार्मिक अर्थच्छाया को बनाए रखता है; केवल अलग-अलग गलत कामों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर की क्षमा के सम्बन्ध में δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ परमेश्वर की नैतिक खराई और न्यायपूर्ण चरित्र दोनों को समेटता है और अर्थ को केवल न्यायिक निष्पक्षता तक सीमित नहीं करता। ‘न्यायी’ भी मजबूत शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘मान लेते हैं’ को स्वीकारोक्ति के स्वाभाविक रूप में और ‘शुद्ध करे’ को καθαρίζω की शुद्धीकरण-छवि के लिए चुना गया है।
