  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: hi
  text: यदि हम कहते हैं कि हमने पाप नहीं किया है[a], तो हम उसे झूठा ठहराते हैं, और उसका वचन[b] हमारे भीतर नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमने पाप नहीं किया।” यूनानी में पूर्ण काल की क्रिया है, इसलिए “हमने पाप नहीं किया है” अतीत के कार्य की वर्तमान प्रासंगिकता भी व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “वचन” का अनुवाद “संदेश” भी किया जा सकता है। यूनानी λόγος में दोनों अर्थ सम्भव हैं; यूहन्ना की शब्दावली को बनाए रखने के लिए “वचन” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: यदि हम कहते हैं
  rationale: ἐὰν के साथ संभावनार्थक क्रिया एक वास्तविक शर्त प्रस्तुत करती है। “यदि हम कहते हैं” इसका स्वाभाविक और सीधा हिन्दी रूप है; “यदि हम दावा करते हैं” मूल में निहित न होने वाला अतिरिक्त भाव जोड़ सकता है।
- source_word: οὐχ ἡμαρτήκαμεν
  choice: हमने पाप नहीं किया है
  rationale: पूर्णकालीन ἡμαρτήκαμεν अतीत के कार्य और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करता है। हिन्दी का “नहीं किया है” इस पक्ष को “नहीं किया” से अधिक स्पष्टता से बनाए रखता है, जबकि “कभी पाप नहीं किया” मूल से अधिक व्यापक होगा।
- source_word: ψεύστην ποιοῦμεν αὐτὸν
  choice: हम उसे झूठा ठहराते हैं
  rationale: ψεύστης संज्ञा रूप में “झूठा” है, और ποιέω के साथ यहाँ किसी को ऐसा घोषित या सिद्ध ठहराने का अर्थ देता है। “झूठा ठहराते हैं” हिन्दी में स्वाभाविक है और कथन की तीखी व्यक्तिगत शक्ति को बनाए रखता है।
- source_word: ὁ λόγος αὐτοῦ
  choice: उसका वचन
  rationale: λόγος का अर्थ “वचन,” “संदेश,” या “शिक्षा” हो सकता है। “वचन” यूहन्नाई शब्दावली और सम्भावित व्यापक अर्थ-संबंध को बनाए रखता है।
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: हमारे भीतर नहीं है
  rationale: यह रूप ἐν ἡμῖν के आन्तरिक और सम्बन्धपरक भाव को सीधे रखता है। “हममें वास नहीं करता” मूल में स्पष्ट न की गई वास करने की छवि जोड़ देता।
theological_decisions:
- issue: αὐτόν और αὐτοῦ का संदर्भ
  choice: मुख्य पाठ में “उसे” और “उसका” रखा गया है; प्रसंग में इनका संदर्भ परमेश्वर है।
  alternative: सर्वनामों के स्थान पर सीधे “परमेश्वर” कहना।
  rationale: 1 यूहन्ना 1:5-10 के निकट प्रसंग में जिसका साक्ष्य नकारा जा रहा है, वह परमेश्वर है। फिर भी यूनानी पाठ सर्वनाम रखता है, इसलिए अनुवाद प्रसंगगत संदर्भ को स्पष्ट रूप से प्रतिस्थापित किए बिना मूल की अभिव्यक्ति सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। “झूठा ठहराते हैं” शाब्दिक “झूठा बनाते हैं” की अपेक्षा अधिक स्वाभाविक है और मूल आरोप की तीव्रता बनाए रखता है। फुटनोट [b] को “वचन” के बाद रखा गया है, क्योंकि वही उसकी विषयवस्तु से सम्बद्ध है।
