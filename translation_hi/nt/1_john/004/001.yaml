source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: hi
  text: हे प्रिय जनो,[a] हर एक आत्मा पर विश्वास न करो, बल्कि आत्माओं को परखो कि वे परमेश्वर की ओर से हैं या नहीं,[b] क्योंकि बहुत-से झूठे भविष्यद्वक्ता संसार में निकल गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे प्रिय मित्रो।” यूनानी संबोधन का शाब्दिक अर्थ “प्रिय जनो” है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात भविष्यवाणी के दावों के पीछे के आत्मिक स्रोत को परखो; अगला वाक्यांश मानवीय माध्यमों को “झूठे भविष्यद्वक्ता” कहता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: हे प्रियो
  rationale: बहुवचन संबोधन स्नेह और ἀγαπάω/ἀγάπη से शब्दगत संबंध दोनों को बनाए रखता है; यह आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: παντὶ πνεύματι
  choice: हर एक आत्मा
  rationale: मूल के अलौकिक और सामान्यवाची आशय को सुरक्षित रखता है; इसे केवल मनुष्य या कथन तक सीमित नहीं करता।
- source_word: πιστεύετε
  choice: विश्वास न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक सामान्य निषेध व्यक्त करता है; यहाँ दावों को सत्य मान लेने का भाव स्वाभाविक रूप से आता है।
- source_word: δοκιμάζετε
  choice: परखो
  rationale: सच्चाई और प्रामाणिकता जाँचने की मूल्यांकनात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ πνεύματα
  choice: आत्माओं
  rationale: मूल के बहुवचन और आध्यात्मिक स्रोतों के संकेत को बिना व्याख्यात्मक संकुचन के बनाए रखता है।
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: कि वे परमेश्वर की ओर से हैं या नहीं
  rationale: εἰ की अप्रत्यक्ष प्रश्नवाचक शक्ति और ἐκ के स्रोत-बोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: πολλοὶ ψευδοπροφῆται
  choice: बहुत-से झूठे भविष्यद्वक्ता
  rationale: मूल पद का सीधा, प्रचलित और अर्थपूर्ण हिन्दी रूप है।
- source_word: ἐξεληλύθασιν
  choice: निकल पड़े हैं
  rationale: पूर्णकाल के घटित कार्य और उसके वर्तमान प्रभाव को बनाए रखते हुए संसार में सक्रिय हो जाने की गति व्यक्त करता है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: मानव-जगत में उनके निकलकर सक्रिय होने का स्वाभाविक हिन्दी रूप; 'संसार-व्यवस्था' जोड़ना अनावश्यक व्याख्या होता।
theological_decisions:
- issue: ‘आत्माओं’ का संदर्भ
  choice: भविष्यद्वक्ताओं के द्वारा प्रकट होने वाले वास्तविक आत्मिक स्रोत, जिन्हें उनके दावों के माध्यम से परखा जाता है
  alternative: केवल मानवीय शिक्षक या अमूर्त भविष्यवाणीय कथन
  rationale: पद ‘आत्माओं’ और ‘झूठे भविष्यद्वक्ताओं’ दोनों का उल्लेख करता है। इसलिए अनुवाद अलौकिक भाषा को सुरक्षित रखता है, जबकि पादटिप्पणी व्यावहारिक संबंध स्पष्ट करती है और अस्पष्टता को पूरी तरह समाप्त नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्नेहपूर्ण तथा गरिमापूर्ण बाइबलीय शैली। ‘हे प्रियो’ संबोधन का भाव और शब्दगत संबंध बनाए रखता है; ‘परखो’ सामान्य पाठक के लिए स्पष्ट है।
