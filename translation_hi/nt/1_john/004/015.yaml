source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: hi
  text: जो कोई यह अंगीकार करता है कि यीशु परमेश्वर का पुत्र है, परमेश्वर उसमें बना रहता है[a], और वह परमेश्वर में बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसमें निवास करता है, और वह परमेश्वर में निवास करता है।’ यूनानी क्रिया मेनो यूहन्ना के लेखन का एक प्रमुख शब्द है, जिसका अर्थ ‘बना रहना’ या ‘निवास करना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: जो कोई
  rationale: अनिश्चित संबंधवाचक संरचना का सामान्य और स्वाभाविक हिन्दी रूप; यह कथन को हर व्यक्ति पर लागू करता है।
- source_word: ὁμολογήσῃ
  choice: अंगीकार करता है
  rationale: यह केवल मन में मान लेने के बजाय यीशु के विषय में सत्य को स्वीकार करने और प्रकट रूप से मानने का भाव रखता है। सामान्य शर्त में यूनानी एओरिस्ट सब्जंक्टिव का हिन्दी वर्तमानकालीन रूप स्वाभाविक है।
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: यीशु परमेश्वर का पुत्र है
  rationale: मसीह-संबंधी उपाधि को बिना विस्तार या व्याख्यात्मक जोड़ के सीधे और प्रतिष्ठित हिन्दी में सुरक्षित रखता है।
- source_word: ἐν αὐτῷ μένει
  choice: उसमें बना रहता है
  rationale: μένω की निरंतर, संबंधपरक स्थिति को आधुनिक और सहज हिन्दी में व्यक्त करता है; ‘निवास करता है’ संभव है, पर वह मूल क्रिया से अधिक व्याख्यात्मक हो सकता है।
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: और वह परमेश्वर में बना रहता है
  rationale: यूनानी में क्रिया दूसरी उपवाक्य में लुप्त है, पर पहले उपवाक्य से समझी जाती है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए उसे दोहराया गया है, जबकि पारस्परिक संरचना सुरक्षित है।
theological_decisions:
- issue: परमेश्वर और विश्वासी का पारस्परिक बने रहना
  choice: परमेश्वर उसमें बना रहता है, और वह परमेश्वर में बना रहता है
  alternative: परमेश्वर उसमें निवास करता है, और वह परमेश्वर में निवास करता है
  rationale: मूल पाठ के पारस्परिक संबंध को ज्यों का त्यों रखा गया है; इसे केवल संगति, नैतिक समानता या किसी बाद की धर्मसैद्धांतिक व्यवस्था के रूप में सीमित नहीं किया गया।
- issue: मसीह-संबंधी उपाधि
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का बेटा
  rationale: ‘पुत्र’ मूल की औपचारिक उपाधि और उसके धर्मवैचारिक महत्व को गरिमापूर्ण, परिचित हिन्दी में सुरक्षित रखता है; ‘बेटा’ अधिक बोलचाल का और इस संदर्भ में कम उपाधिपरक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘अंगीकार’ और ‘पुत्र’ जैसे परिचित बाइबिलीय शब्द अर्थगत भार बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
