    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: हम
  rationale: यूनानी में कर्ता-सर्वनाम स्पष्ट रूप से उपस्थित है और हल्का बल देता है; हिन्दी में ‘हम’ स्वाभाविक रूप से आवश्यक भी है और इस बल को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἀγαπῶμεν
  choice: प्रेम करते हैं
  rationale: वर्तमानकालीन क्रिया को स्वाभाविक हिन्दी में सामान्य वर्तमान से व्यक्त किया गया है। कोई कर्म नहीं जोड़ा गया, क्योंकि मुख्य पाठ में वह अनुल्लिखित है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'यहाँ संयोजक कारण बताता है: हमारा प्रेम परमेश्वर के पहले किए गए प्रेम पर आधारित है।'
- source_word: αὐτὸς
  choice: उसी ने
  rationale: संदर्भ में सर्वनाम परमेश्वर की ओर संकेत करता है। ‘उसी ने’ यूनानी सर्वनाम के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρῶτος
  choice: पहले
  rationale: यह परमेश्वर के प्रेम की कालगत प्राथमिकता व्यक्त करता है।
- source_word: ἠγάπησεν
  choice: प्रेम किया था
  rationale: अओरिस्ट परमेश्वर के निर्णायक, पहले किए गए प्रेम की ओर संकेत करता है; ‘किया था’ हिन्दी में हमारे वर्तमान प्रेम से उसकी पूर्वता स्पष्ट करता है।
- source_word: ἡμᾶς
  choice: हमसे
  rationale: हिन्दी में ‘प्रेम करना’ के व्यक्ति-कर्म के लिए ‘से’ स्वाभाविक कारक-चिह्न है।
theological_decisions:
- issue: ‘हम प्रेम करते हैं’ के लिए कर्म जोड़ा जाए या नहीं
  choice: 'कर्म को अनुल्लिखित रखना: ‘हम प्रेम करते हैं’'
  alternative: ‘हम उससे प्रेम करते हैं’ अथवा ‘हम परमेश्वर से प्रेम करते हैं’
  rationale: दिए गए SBLGNT पाठ में ἀγαπῶμεν के बाद कोई स्पष्ट कर्म नहीं है। कर्म जोड़ने से पाठ की व्यापकता और वास्तविक पाठगत अस्पष्टता सीमित हो जाएगी।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘प्रेम’ शब्द को निकटवर्ती संदर्भ की प्रमुख शब्दावली से संबंध बनाए रखने के लिए चुना गया है; मुख्य पाठ में अनुल्लिखित कर्म को नहीं जोड़ा गया।
