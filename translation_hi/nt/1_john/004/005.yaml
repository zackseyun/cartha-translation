  rationale: यहाँ अर्थ भौतिक सृष्टि नहीं, बल्कि परमेश्वर के विरोध में खड़ी मानवीय व्यवस्था है। मुख्य पाठ में प्रचलित और अर्थगर्भित शब्द ‘संसार’ रखा गया है; व्याख्या पाद-टिप्पणी में दी गई है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पदबंध उनके संसार से होने और उनके बोलने के ढंग/स्रोत के बीच कारणात्मक संबंध स्पष्ट करता है।
- source_word: λαλοῦσιν
  choice: बोलते हैं
  rationale: वर्तमान काल यहाँ सामान्य या अभ्यस्त क्रिया व्यक्त करता है। ‘बोलते हैं’ सहज, संक्षिप्त और गरिमापूर्ण है।
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: संसार से ही बोलते हैं
  rationale: यूनानी में वही ἐκ + κόσμος रचना दोहराई गई है। हिंदी में ‘ही’ स्रोत पर बल और वाक्य की स्वाभाविकता बढ़ाता है, बिना किसी विशिष्ट व्याख्या को मुख्य पाठ में जोड़े।
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: संसार उनकी बात सुनता है
  rationale: ἀκούω यहाँ केवल ध्वनि सुनने के बजाय ग्रहणशीलता या अनुकूल स्वीकार का भाव रखता है। ‘उनकी बात सुनता है’ आधुनिक हिंदी में स्वाभाविक रूप से यही भाव व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के प्रयोग में κόσμος का अर्थ
  choice: ‘संसार’ से आशय परमेश्वर से विमुख मानवीय व्यवस्था है
  alternative: भौतिक जगत अथवा तटस्थ अर्थ में समस्त मानवता
  rationale: निकटवर्ती प्रसंग ‘परमेश्वर से’ और ‘संसार से’ होने का विरोध करता है। इसलिए यहाँ नैतिक-आत्मिक स्रोत और स्वीकार्यता की बात है; फिर भी मुख्य पाठ में केवल ‘संसार’ रखकर उसकी धर्मवैचारिक गूँज और संक्षिप्तता सुरक्षित रखी गई है।
- issue: αὐτοὶ का बल
  choice: मुख्य पाठ में केवल ‘वे’
  alternative: ‘वे स्वयं’
  rationale: यूनानी सर्वनाम में कुछ विरोधात्मक बल है, पर हिंदी में अगले पद के ‘हम’ के साथ विरोध से यह पर्याप्त रूप से प्रकट होता है। ‘वे स्वयं’ अनावश्यक रूप से प्रबल लग सकता है।
