lexical_decisions:
- source_word: αὐτοὶ
  choice: वे
  rationale: यह सर्वनाम पिछले प्रसंग के झूठे भविष्यद्वक्ताओं/आत्माओं की ओर संकेत करता है और अगले पद के ‘हम’ के साथ उसका विरोध बनाए रखता है। ‘वे स्वयं’ हिंदी में अनावश्यक रूप से अधिक बल देता।
- source_word: ἐκ τοῦ κόσμου
