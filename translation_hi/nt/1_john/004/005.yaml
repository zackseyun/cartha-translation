  register: आधुनिक मानक हिंदी में संक्षिप्त, सहज और गरिमापूर्ण शैली रखी गई है। ‘संसार से’ की पुनरावृत्ति यूनानी पाठ की स्रोत-संबंधी भाषा और अलंकारिक समानता को सुरक्षित रखती है; ‘उनकी बात सुनता है’ ग्रहणशील सुनने का स्वाभाविक हिंदी रूप है।
