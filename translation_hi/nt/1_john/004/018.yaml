reference: 1 John 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: hi
  text: प्रेम में भय नहीं है, बल्कि पूर्ण[a] प्रेम भय को बाहर निकाल देता है[b], क्योंकि भय में दण्ड होता है[c]। पर जो डरता है, वह प्रेम में पूर्ण नहीं हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्ण’ का अर्थ यहाँ ‘अपनी अपेक्षित पूर्णता तक पहुँचा हुआ’ या ‘परिपक्व’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “भय को निकाल बाहर करता है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “भय दण्ड रखता है”; अर्थात भय दण्ड से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: भय / जो डरता है
  rationale: संज्ञा के लिए ‘भय’ गरिमापूर्ण और स्वाभाविक है; कृदन्त के लिए ‘जो डरता है’ आधुनिक हिन्दी में सहज है और उसी मूल भाव की पुनरावृत्ति बनाए रखता है।
- source_word: ἀγάπῃ / ἀγάπη
  choice: प्रेम
  rationale: ἀγάπη का मानक, व्यापक और प्रसंगानुकूल हिन्दी रूप; पूरे पद में मुख्य शब्द की एकरूपता रखता है।
- source_word: τελεία / τετελείωται
  choice: पूर्ण / पूर्ण नहीं हुआ है
  rationale: दोनों यूनानी रूपों के शब्दगत सम्बन्ध को हिन्दी में ‘पूर्ण’ द्वारा बनाए रखता है। यह प्रेम के अपने लक्ष्य तक पहुँचने का भाव देता है, बिना निष्पाप सिद्धता का कोई विशेष धर्मसैद्धान्तिक मत जोड़ने के।
- source_word: ἔξω βάλλει
  choice: बाहर निकाल देता है
  rationale: बलपूर्वक हटाने की स्थानिक उपमा को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: κόλασιν ἔχει
  choice: दण्ड निहित है
  rationale: यूनानी के शाब्दिक ‘दण्ड रखता है’ को अस्वाभाविक हिन्दी में दोहराने के बजाय भय के भीतर दण्ड के जुड़े होने का घनिष्ठ भाव व्यक्त करता है, पर उसे केवल ‘दण्ड की आशंका’ बनाकर सीमित नहीं करता।
- source_word: ἐν τῇ ἀγάπῃ
  choice: प्रेम में
  rationale: पूर्वसर्गीय वाक्यांश का सरल और स्वाभाविक रूप, जो प्रेम के क्षेत्र या अवस्था की सम्भावना को खुला रखता है।
theological_decisions:
- issue: ‘पूर्ण प्रेम’ और ‘प्रेम में पूर्ण नहीं हुआ’ का सम्बन्ध
  choice: दोनों स्थानों पर ‘पूर्ण’ मूल को बनाए रखा गया है।
  alternative: ‘परिपक्व प्रेम’ / ‘प्रेम में परिपक्व नहीं हुआ’
  rationale: यह τελεία और τετελείωται के स्पष्ट शब्दगत सम्बन्ध तथा प्रेम के लक्ष्य तक पहुँचने की धारणा को सुरक्षित रखता है; साथ ही इसे मात्र भावनात्मक परिपक्वता या निष्पाप सिद्धता की किसी विशिष्ट शिक्षा में नहीं बदलता।
- issue: भय और दण्ड का सम्बन्ध
  choice: ‘भय में दण्ड निहित है’
  alternative: ‘भय का सम्बन्ध दण्ड से है’ या ‘भय में दण्ड की आशंका होती है’
  rationale: पहला विकल्प यूनानी κόλασιν ἔχει की तीव्र और संक्षिप्त अभिव्यक्ति के अधिक निकट है। ‘आशंका’ जोड़ने से अर्थ अनावश्यक रूप से केवल भविष्य के दण्ड की प्रतीक्षा तक सीमित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘भय’ और ‘दण्ड’ औपचारिक स्पष्टता देते हैं, जबकि ‘जो डरता है’ सामान्य पाठक के लिए स्वाभाविक है।
