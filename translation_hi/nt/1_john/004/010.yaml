    text: या “पापों का परिहार करने वाली बलि”; “परमेश्वर के कोप को शांत करने वाली बलि” भी संभव। यूनानी शब्द ἱλασμός उस बलिदानी कार्य को दर्शाता है जिसके द्वारा पुत्र पापों से प्रभावी रूप से निपटता है।
    reason: lexical_alternative
