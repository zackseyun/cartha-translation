  text: 'प्रेम इसी में है: यह नहीं कि हमने परमेश्वर से प्रेम किया, बल्कि यह कि उसने हमसे प्रेम किया और हमारे पापों के लिए प्रायश्चित-बलि के रूप में अपने पुत्र को भेजा।[a]'
