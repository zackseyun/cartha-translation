- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: हमारे पापों के लिए
  rationale: बलिदानी संदर्भ में περί का स्वाभाविक और प्रसंगानुकूल हिन्दी रूप है।
theological_decisions:
- issue: प्रायश्चित-संदर्भ में ἱλασμός का अनुवाद
  choice: प्रायश्चित-बलि
  alternative: पापों का परिहार करने वाली बलि; परमेश्वर के कोप को शांत करने वाली बलि
