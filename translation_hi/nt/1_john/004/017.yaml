source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: hi
  text: इसी से[a] प्रेम हमारे साथ परिपूर्ण हुआ है, ताकि न्याय के दिन हम निर्भीक हो सकें[b], क्योंकि जैसा वह[c] है, वैसे ही हम भी इस संसार में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी में हमारे बीच प्रेम परिपूर्ण हुआ है।” यूनानी पदबंध साधन या रीति भी बता सकता है, और “हमारे साथ” का अनुवाद “हमारे बीच” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमें निर्भीकता हो”; इसका अर्थ “हमें भरोसा हो” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “वह” से संभवतः यीशु का संकेत है; कुछ लोग इसे अधिक सामान्य रूप से परमेश्वर का संकेत समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह पदबंध साधन, रीति या उस बात की ओर संकेत कर सकता है जिसमें प्रेम परिपूर्ण होता है। ‘इसी से’ आरंभिक संकेत और आगे आने वाले कारणवाचक कथन के संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τετελείωται
  choice: परिपूर्ण हुआ है
  rationale: पूर्ण निष्पन्न कर्मवाच्य रूप ऐसी पूरी की गई क्रिया बताता है जिसका परिणाम वर्तमान में बना हुआ है। ‘परिपूर्ण हुआ है’ प्रेम को उसके अभिप्रेत लक्ष्य तक पहुँचाए जाने का भाव रखता है।
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: हमारे साथ प्रेम
  rationale: μετά के मूल ‘साथ’ अर्थ को बनाए रखकर यह अनुवाद इस प्रश्न को खुला छोड़ता है कि यहाँ मुख्य रूप से परमेश्वर का हमारे प्रति प्रेम, हमारा उसके प्रति प्रेम, या विश्वासियों के बीच पूर्णता पाता प्रेम अभिप्रेत है।
- source_word: παρρησίαν
  choice: निडर रह सकें
  rationale: न्याय के संदर्भ में यह परमेश्वर के सामने भय के बिना, भरोसे के साथ उपस्थित होने की स्वतंत्रता व्यक्त करता है। क्रियात्मक हिन्दी संज्ञात्मक ‘निडरता रखें’ से अधिक स्वाभाविक है।
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: न्याय के दिन
  rationale: यह प्रचलित और स्पष्ट हिन्दी अभिव्यक्ति यूनानी के अंतिम न्याय संबंधी समय-संकेत को सुरक्षित रखती है।
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: जैसा वह है, वैसे ही हम भी ... हैं
  rationale: ‘जैसा…वैसे ही’ तुलना को स्पष्ट करता है, ‘वह’ यूनानी सर्वनाम के अप्रकट पूर्वपद को बनाए रखता है, और वर्तमानकालीन ‘है/हैं’ को सुरक्षित रखता है।
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: इस संसार में
  rationale: यह वर्तमान मानवीय जीवन-क्षेत्र के अर्थ में κόσμος का सहज और मानक हिन्दी रूप है।
theological_decisions:
- issue: ἐκεῖνος (‘वह’) का संदर्भ
  choice: मुख्यतः मसीह/पुत्र की ओर संकेत समझा गया, पर मुख्य पाठ में केवल ‘वह’ रखा गया
  alternative: इसे अधिक सामान्य रूप से परमेश्वर की ओर संकेत माना जा सकता है
  rationale: 1 यूहन्ना में ἐκεῖνος प्रायः यीशु की ओर संकेत करता है, और यहाँ विश्वासियों की उससे तुलना इसी प्रयोग के अनुकूल है। फिर भी यूनानी की तरह हिन्दी सर्वनाम भी नाम को स्पष्ट नहीं करता, इसलिए वास्तविक अस्पष्टता सुरक्षित है।
- issue: परिपूर्ण प्रेम का अर्थ
  choice: विश्वासियों के संबंध में प्रेम अपने अभिप्रेत लक्ष्य तक पहुँचाया गया है, जिसका फल न्याय के दिन निडरता है
  alternative: केवल परमेश्वर का हमारे प्रति प्रेम पूर्ण होता है; अथवा केवल परमेश्वर के प्रति हमारा प्रेम नैतिक रूप से सिद्ध हो जाता है
  rationale: यूनानी कथन प्रेम की दिशा को संकीर्ण रूप से निर्धारित नहीं करता। ‘हमारे साथ प्रेम परिपूर्ण हुआ है’ उस तनाव को बनाए रखता है और किसी सिद्धतावादी शिक्षा को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परिपूर्ण’ आसपास के τελειόω शब्द-समूह से संबंध बनाए रखता है; ‘निडर रह सकें’ न्याय के प्रसंग में παρρησία का स्वाभाविक हिन्दी रूप है।
