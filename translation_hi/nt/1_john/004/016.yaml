source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: hi
  text: और हमने परमेश्वर के उस प्रेम को, जो हमारे बीच है, जान लिया है और उस पर विश्वास किया है।[a] परमेश्वर प्रेम है, और जो प्रेम में बना रहता है, वह परमेश्वर में बना रहता है, और परमेश्वर उसमें बना रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के उस प्रेम को जो हमारे भीतर है।” यूनानी पदबंध विश्वासियों के भीतर विद्यमान प्रेम या समुदाय के बीच प्रकट प्रेम—दोनों अर्थ दे सकता है।
    reason: alternative_reading
  - marker: b
    text: “उसमें” से आशय उस व्यक्ति से है जो प्रेम में बना रहता है। यूनानी में यहाँ पुल्लिंग एकवचन रूप प्रतिनिधिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: हमने ... जान लिया है
  rationale: पूर्णकाल पूर्व में जानने तक पहुँचने और उसके वर्तमान परिणाम को व्यक्त करता है; ‘जान लिया है’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: πεπιστεύκαμεν
  choice: विश्वास किया है
  rationale: पूर्णकाल स्थिर और अब तक बने हुए विश्वास को व्यक्त करता है; यूहन्ना की शब्दावली से संगति के लिए ‘विश्वास’ रखा गया है।
- source_word: τὴν ἀγάπην
  choice: उस प्रेम को
  rationale: निश्चित पदबंध किसी सामान्य भावना नहीं, बल्कि पहले से वर्णित परमेश्वर के विशिष्ट प्रेम की ओर संकेत करता है।
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: जो परमेश्वर हमारे बीच रखता है
  rationale: ἐν ἡμῖν का मूल स्थानवाचक/सामुदायिक बल ‘हमारे बीच’ से सुरक्षित रहता है। ‘हमसे करता है’ सहज होता, पर वह ‘हमारे लिए’ अर्थ चुनकर मूल की वास्तविक अस्पष्टता घटा देता।
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: परमेश्वर प्रेम है
  rationale: विधेय संज्ञा वाले सीधे कथन को बिना विस्तार के रखा गया है।
- source_word: ὁ μένων
  choice: जो ... बना रहता है
  rationale: ‘बना रहता है’ μένω के निरंतर, संबंधपरक स्थायित्व को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ἀγάπῃ
  choice: प्रेम में
  rationale: यह परमेश्वर के अभी वर्णित प्रेम के क्षेत्र में बने रहने को बताता है; हिन्दी में अतिरिक्त निश्चयवाचक संकेत की आवश्यकता नहीं।
- source_word: ἐν τῷ θεῷ μένει
  choice: परमेश्वर में बना रहता है
  rationale: परस्पर निवास की यूहन्नाई विषयवस्तु तथा μένω की शब्दगत संगति बनाए रखी गई है।
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: परमेश्वर उसमें बना रहता है
  rationale: ‘उसमें’ यूनानी पुल्लिंग एकवचन को हिन्दी में स्वाभाविक प्रतिनिधिक रूप में व्यक्त करता और पहले आए ‘जो’ से स्पष्ट रूप से जुड़ता है।
theological_decisions:
- issue: पहले खंड में ἐν ἡμῖν का अर्थ
  choice: 'स्थानवाचक/सामुदायिक: ‘हमारे बीच’'
  alternative: ‘हमारे भीतर’ अथवा ‘हमसे/हमारे लिए’
  rationale: ἐν का सीधा बल ‘में/बीच’ है। संदर्भ में प्रेम का समुदाय में प्रकट होना और पारस्परिक निवास दोनों उपस्थित हैं; इसलिए मुख्य पाठ सामुदायिक अर्थ रखता है और भीतरी अर्थ को पादटिप्पणी में सुरक्षित करता है।
- issue: αὐτῷ का प्रतिनिधिक एकवचन
  choice: ‘उसमें’
  alternative: ‘उस व्यक्ति में’
  rationale: यूनानी रूप पुल्लिंग एकवचन है, पर उसका संकेत प्रतिनिधिक रूप से ‘जो प्रेम में बना रहता है’ की ओर है। ‘उसमें’ स्रोत-रूप और सहज हिन्दी दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। यूहन्ना के प्रमुख क्रियापद μένω के लिए हर बार ‘बना रहता है’ रखकर शब्दगत संगति बनाए रखी गई है। प्रथम वाक्य में कुछ असामान्य किंतु अर्थ-सटीक ‘प्रेम ... रखता है’ मूल के ἔχει और ἐν की स्थानवाचक अस्पष्टता बचाता है।
