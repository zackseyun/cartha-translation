id: 1JN.4.14
reference: 1 John 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: hi
  text: और हमने देखा है और गवाही देते हैं कि पिता ने पुत्र को संसार के उद्धारकर्ता के रूप में भेजा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “पिता ने पुत्र को, संसार का उद्धारकर्ता, भेजा है।”'
    reason: मूल यूनानी में ‘उद्धारकर्ता’ पुत्र के समानाधिकरण में है; ‘के रूप में’ स्वाभाविक हिन्दी के लिए जोड़ा गया है।
lexical_decisions:
- source_word: τεθεάμεθα
  choice: हमने देखा है
  rationale: पूर्णकालिक क्रिया पहले घटित प्रत्यक्ष दर्शन और उसके बने रहने वाले महत्व को व्यक्त करती है; यह सहज आधुनिक हिन्दी में प्रत्यक्षदर्शी भाव बनाए रखती है।
- source_word: μαρτυροῦμεν
  choice: गवाही देते हैं
  rationale: वर्तमानकाल निरंतर साक्ष्य देने को व्यक्त करता है और हिन्दी में औपचारिक साक्ष्य का स्वाभाविक रूप है।
- source_word: ὅτι
  choice: कि
  rationale: यह गवाही की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूहन्नाई प्रयोग में यह परमेश्वर के लिए पुत्र के संबंध में प्रयुक्त संबोधन है; मूल में निहित संबंधपरक उपाधि को बनाए रखा गया है।
- source_word: ἀπέσταλκεν
  choice: भेजा है
  rationale: पूर्णकाल एक संपन्न भेजे जाने और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करता है।
- source_word: τὸν υἱόν
  choice: पुत्र
  rationale: यूनानी में निश्चित पद है, स्पष्ट अधिकारवाचक सर्वनाम नहीं; इसलिए ‘उसके पुत्र’ जोड़ने के बजाय संबंधपरक उपाधि रखी गई है।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह σωτήρ का स्थापित, अर्थपूर्ण और आधुनिक हिन्दी मसीही प्रयोग है; ‘छुड़ानेवाला’ संभव है, पर यहाँ उपाधि के रूप में कम स्वाभाविक है।
- source_word: τοῦ κόσμου
  choice: संसार के
  rationale: σωτήρ के साथ संबंधकारक को ‘संसार का उद्धारकर्ता’ के स्वाभाविक हिन्दी ढाँचे में व्यक्त किया गया है और κόσμος का व्यापक दायरा सुरक्षित है।
- source_word: καὶ ἡμεῖς
  choice: और हमने
  rationale: संयोजक और स्पष्ट सर्वनाम से आए हल्के बल तथा पिछले कथन से प्रवाह, दोनों को बनाए रखता है।
- source_word: σωτῆρα τοῦ κόσμου
  choice: संसार के उद्धारकर्ता के रूप में
  rationale: मूल का कर्म-समानाधिकरण हिन्दी में अत्यधिक असहज हो सकता है; ‘के रूप में’ पुत्र की भूमिका को स्वाभाविक ढंग से व्यक्त करता है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘संसार के उद्धारकर्ता’ का दायरा
  choice: मूल के व्यापक कथन ‘संसार के उद्धारकर्ता’ को बिना संकुचित किए रखा गया है।
  alternative: इसे किसी विशिष्ट प्रायश्चित-सिद्धांत या केवल किसी सीमित समूह के उद्धार तक संकुचित करना।
  rationale: यूनानी पाठ उपाधि और उसके दायरे को सीधे कहता है, पर उद्धार की कार्यप्रणाली या उसके लाभ पाने वालों की सीमा यहाँ स्पष्ट नहीं करता।
- issue: पिता-पुत्र संबंध की भाषा
  choice: ‘पिता’ और ‘पुत्र’ संबंधपरक उपाधियों को ज्यों का त्यों रखा गया है।
  alternative: ‘परमेश्वर पिता’ और ‘यीशु मसीह’ कहकर स्पष्ट विस्तार करना।
  rationale: पद स्वयं इन्हीं संबंधपरक उपाधियों का प्रयोग करता है; नाम या अन्य उपाधियाँ जोड़ना मूल से अधिक कहना होता।
- issue: ‘के रूप में’ का अर्थ-संबंध
  choice: इसे पुत्र की भेजे जाने की भूमिका बताने वाला स्वाभाविक हिन्दी रूप माना गया है।
  alternative: 'अधिक शाब्दिक समानाधिकरण: ‘पिता ने पुत्र को, संसार का उद्धारकर्ता, भेजा है।’'
  rationale: यूनानी σωτῆρα को τὸν υἱόν के समानाधिकरण में रखता है। मुख्य पाठ में स्वाभाविकता चुनी गई है, पर मूल की संरचनात्मक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गवाही देते हैं’ औपचारिक साक्ष्य का भाव रखता है; ‘उद्धारकर्ता’ स्थापित धार्मिक शब्द होते हुए भी व्यापक रूप से बोधगम्य है।
