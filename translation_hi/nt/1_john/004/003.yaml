id: 1JN.4.3
reference: 1 John 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: hi
  text: और हर वह आत्मा जो यीशु को स्वीकार नहीं करती, परमेश्वर से नहीं है।[a] और यही मसीह-विरोधी की आत्मा है,[b] जिसके बारे में तुमने सुना है कि वह आ रही है, और वह अब संसार में पहले ही से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “यह स्वीकार नहीं करती कि यीशु मसीह देह में आया है।”
    reason: textual_variant
  - marker: b
    text: यूनानी में शाब्दिक रूप से “यही मसीह-विरोधी का है”; यहाँ “आत्मा” पहले खंड से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: हर वह आत्मा
  rationale: एकवचन के साथ πᾶν यहाँ वितरणात्मक है। संदर्भ में आत्मिक प्रभावों और दावों को परखा जा रहा है, इसलिए सामान्य संज्ञा ‘आत्मा’ उपयुक्त है।
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: यीशु को स्वीकार करती
  rationale: ὁμολογέω में खुली स्वीकृति और निष्ठा की घोषणा का भाव है। आधुनिक हिन्दी में ‘स्वीकार करना’ स्वाभाविक है और केवल बौद्धिक पहचान से अधिक अर्थ देता है। मुख्य पाठ में SBLGNT का संक्षिप्त पाठ रखा गया है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἐκ स्रोत या उद्गम बताता है; ‘परमेश्वर से’ इसे स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: यही मसीह-विरोधी की आत्मा है
  rationale: यूनानी वाक्यांश में संज्ञा लुप्त है, पर पहले आए πνεῦμα से ‘आत्मा’ स्पष्ट रूप से निहित है। उसे जोड़ना हिन्दी में अर्थ को स्वाभाविक बनाता है; शाब्दिक लोप पादटिप्पणी में बताया गया है।
- source_word: ἀντιχρίστου
  choice: मसीह-विरोधी
  rationale: यह यूहन्नाई संदर्भ के परिचित विरोधी को सूचित करता है। हिन्दी में ‘मसीह-विरोधी’ अर्थपूर्ण और स्थापित रूप है।
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: जिसके विषय में तुम सुन चुके हो कि वह आने वाली है
  rationale: सम्बन्धवाचक सर्वनाम ὃ नपुंसकलिंग है और निकटवर्ती निहित ‘आत्मा’ की ओर संकेत करता है; हिन्दी में स्त्रीलिंग ‘वह’ इसी संदर्भ को बनाए रखता है और इसे किसी पुरुष व्यक्ति के रूप में अनावश्यक रूप से नहीं खोलता।
- source_word: ἐν τῷ κόσμῳ
  choice: संसार में
  rationale: यूहन्नाई प्रयोग में κόσμος के लिए ‘संसार’ मानक, संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἤδη
  choice: अब ... आ भी चुकी है
  rationale: ἤδη वर्तमान में उसकी वास्तविक उपस्थिति पर बल देता है। ‘अब ... आ भी चुकी है’ आने की क्रिया के साथ ‘पहले से/अब तक उपस्थित’ होने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अस्वीकार किए गए अंगीकार का पाठीय रूप
  choice: मुख्य पाठ में SBLGNT का संक्षिप्त पाठ ‘यीशु को स्वीकार नहीं करती’ रखा गया।
  alternative: ‘यह स्वीकार नहीं करती कि यीशु मसीह देह में आया है’
  rationale: आलोचनात्मक यूनानी पाठ संक्षिप्त रूप का समर्थन करता है, जबकि पिछले पद में अंगीकार की मसीह-विषयक सामग्री दी जा चुकी है। विस्तृत परंपरागत पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मसीह-विरोधी वाले यूनानी लोप को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में निहित संज्ञा जोड़कर ‘मसीह-विरोधी की आत्मा’ कहा गया।
  alternative: 'अधिक शाब्दिक रूप: ‘यही मसीह-विरोधी का है’'
  rationale: यूनानी में πνεῦμα दोहराया नहीं गया, किंतु पहले खंड से वही स्पष्टतः निहित है। हिन्दी में संज्ञा न जोड़ने पर वाक्य अस्पष्ट और अस्वाभाविक होगा; पादटिप्पणी स्रोत की लाक्षणिक संक्षिप्तता को दर्ज करती है।
- issue: आने वाले के लिए व्यक्ति या आत्मा का संकेत
  choice: ‘वह आने वाली है’ को निहित ‘आत्मा’ से सम्बद्ध रखा गया।
  alternative: ‘वह [मसीह-विरोधी] आने वाला है’
  rationale: यूनानी ὃ नपुंसकलिंग है और तत्काल पूर्ववर्ती पूरे भाव/निहित आत्मा से मेल खाता है। पुरुष व्यक्ति का संकेत देना सम्भव व्याख्या है, पर मुख्य पाठ में उसे निश्चित करना स्रोत की अस्पष्टता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण। ‘तुम’ पत्र के सामुदायिक बहुवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। ‘मसीह-विरोधी’ अर्थपूर्ण धार्मिक पद है; अनावश्यक पारिभाषिक जटिलता से बचा गया है।
