id: 1JN.4.20
reference: 1 John 4:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: hi
  text: यदि कोई कहे, “मैं परमेश्वर से प्रेम करता हूँ,” और अपने भाई से घृणा करे, तो वह झूठा है; क्योंकि जो अपने भाई से, जिसे उसने देखा है, प्रेम नहीं करता, वह परमेश्वर से, जिसे उसने नहीं देखा है, प्रेम नहीं कर सकता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ के स्थान पर ‘भाई या बहन’ भी समझा जा सकता है। यूनानी में पुल्लिंग एकवचन ‘भाई’ (ἀδελφόν) है, जो इस प्रसंग में प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: यदि कोई कहे
  rationale: ἐάν के साथ aorist subjunctive एक सामान्य शर्त व्यक्त करता है; ‘यदि कोई कहे’ हिंदी में इसकी अनिश्चित और सामान्य प्रकृति को स्वाभाविक रूप से रखता है।
- source_word: Ἀγαπῶ / ἀγαπῶν / ἀγαπᾶν
  choice: प्रेम करता हूँ / प्रेम नहीं करता / प्रेम नहीं कर सकता
  rationale: पूरे पद में ἀγαπάω की पुनरावृत्ति को ‘प्रेम’ से समान रूप में रखा गया है, ताकि यूहन्ना की शब्दगत कड़ी बनी रहे।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: एकमात्र परमेश्वर के लिए आधुनिक मानक हिंदी का स्वाभाविक और गरिमापूर्ण शब्द।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: अपने भाई
  rationale: ἀδελφός पुल्लिंग एकवचन है; ‘अपने भाई’ मूल रूप को सुरक्षित रखता है। प्रसंग में इसके प्रतिनिधिक या सहविश्वासी अर्थ की संभावना पाद-टिप्पणी में दी गई है।
- source_word: μισῇ
  choice: घृणा करे
  rationale: वर्तमान subjunctive को शर्त के समानांतर ‘घृणा करे’ से स्वाभाविक हिंदी में व्यक्त किया गया है; यह विरोधी नैतिक धार को बनाए रखता है।
- source_word: ψεύστης ἐστίν
  choice: वह झूठा है
  rationale: ψεύστης संज्ञात्मक और स्पष्ट नैतिक निर्णय है; ‘झूठा है’ इसे केवल ‘झूठ बोलता है’ में कमजोर नहीं करता।
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: क्योंकि जो ... प्रेम नहीं करता
  rationale: γάρ के व्याख्यात्मक संबंध और substantival participle दोनों को सहज हिंदी में सुरक्षित रखा गया है।
- source_word: ὃν ἑώρακεν
  choice: जिसे उसने देखा है
  rationale: perfect ἑώρακεν को हिंदी के पूर्ण पक्ष ‘देखा है’ से व्यक्त किया गया है, जिससे पूर्व दर्शन की वर्तमान प्रासंगिकता बनी रहती है।
- source_word: οὐ δύναται ἀγαπᾶν
  choice: प्रेम नहीं कर सकता
  rationale: δύναται की सामर्थ्य अथवा संभावना संबंधी प्रबल नकारात्मकता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἀδελφός का दायरा
  choice: मुख्य पाठ में ‘भाई’
  alternative: ‘भाई या बहन’ अथवा ‘सहविश्वासी’
  rationale: यूनानी रूप पुल्लिंग एकवचन है, इसलिए मुख्य पाठ उसे बनाए रखता है; किंतु प्रसंग में वह प्रतिनिधिक रूप से किसी सहविश्वासी के लिए प्रयुक्त हो सकता है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- issue: οὐ δύναται ἀγαπᾶν का बल
  choice: ‘प्रेम नहीं कर सकता’
  alternative: ‘प्रेम करने में समर्थ नहीं है’
  rationale: यह यूहन्ना के तर्क में नैतिक-आत्मिक असंभवता का प्रबल कथन है; अनुवाद उस तनाव को बिना अतिरिक्त दार्शनिक व्याख्या के रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘प्रेम’ की पुनरावृत्ति जानबूझकर रखी गई है। पाद-टिप्पणी चिह्न वाक्य के अंत में रखा गया है, क्योंकि वह पद में ‘भाई’ के दोनों प्रयोगों पर लागू होता है।
