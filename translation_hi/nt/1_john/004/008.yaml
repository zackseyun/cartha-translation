  text: The one who does not love has not known God[a], because God is love.
translation:
  language: hi
  text: जो प्रेम नहीं करता, उसने परमेश्वर को नहीं जाना है[a], क्योंकि परमेश्वर प्रेम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह परमेश्वर को नहीं जानता।” यूनानी अओरिस्ट क्रिया को सरल वर्तमान काल में भी व्यक्त किया जा सकता है; “नहीं जाना है” परमेश्वर को जानने तक न पहुँचने और उसके वर्तमान परिणाम के भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: जो प्रेम नहीं करता
  rationale: लेख सहित वर्तमान कृदंत यहाँ सामान्य रूप से ऐसे व्यक्ति को दर्शाता है जिसकी पहचान प्रेम न करने से होती है। यह सहज हिन्दी में निरंतर या चारित्रिक भाव बनाए रखता है।
- source_word: ἀγαπῶν / ἀγάπη
  choice: प्रेम करता / प्रेम
  rationale: दोनों सजातीय यूनानी शब्दों के लिए ‘प्रेम’ को बनाए रखने से पद के भीतर उनका जानबूझकर किया गया शाब्दिक संबंध स्पष्ट रहता है।
- source_word: οὐκ ἔγνω
  choice: नहीं जाना है
  rationale: अओरिस्ट क्रिया को हिन्दी के पूर्ण पक्ष में रखा गया है, जिससे परमेश्वर को जानने तक न पहुँचने और उसके वर्तमान परिणाम—उसे न जानने—दोनों का भाव बना रहता है।
- source_word: τὸν θεόν / ὁ θεὸς
  choice: परमेश्वर
  rationale: ईश्वर के लिए प्रचलित, गरिमापूर्ण हिन्दी पद; पहले कर्म और फिर वाक्य के कर्ता के रूप में प्रयुक्त।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; इसलिए कारणवाचक ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: ἀγάπη ἐστίν
  choice: प्रेम है
  rationale: संज्ञात्मक विधेय को विशेषण में बदलने के बजाय मूल कथन का पूरा बल सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर प्रेम है’ का बल
  choice: परमेश्वर प्रेम है
  alternative: परमेश्वर प्रेममय है / प्रेम परमेश्वर है
  rationale: यूनानी में ‘परमेश्वर’ कर्ता और ‘प्रेम’ विधेय है। चुना हुआ रूप परमेश्वर के चरित्र या स्वभाव के विषय में कथन को बनाए रखता है, पर उसे उलटकर ‘प्रेम परमेश्वर है’ नहीं बनाता और न संज्ञात्मक बल को केवल ‘प्रेममय’ तक घटाता है।
- issue: परमेश्वर को जानने का पक्ष और अर्थ
  choice: उसने परमेश्वर को नहीं जाना है
  alternative: वह परमेश्वर को नहीं जानता / उसने परमेश्वर को नहीं समझा
  rationale: यह रूप ज्ञान को मात्र बौद्धिक समझ तक सीमित नहीं करता और परमेश्वर को जानने तक न पहुँचने के पूर्ण-पक्षीय भाव को सुरक्षित रखता है।
