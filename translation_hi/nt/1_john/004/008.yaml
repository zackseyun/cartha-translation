  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘जो’ वाला सामान्य एकवचन मूल के substantival participle को स्वाभाविक ढंग से व्यक्त करता है; ‘प्रेम करता’ और ‘प्रेम’ की पुनरावृत्ति मूल के शाब्दिक संबंध को बनाए रखती है।
