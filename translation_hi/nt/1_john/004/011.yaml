id: 1JN.4.11
reference: 1 John 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: hi
  text: प्रिय जनो, यदि परमेश्वर ने हमसे ऐसा प्रेम किया, तो हमें भी एक-दूसरे से प्रेम करना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “क्योंकि परमेश्वर ने हमसे इस प्रकार प्रेम किया।” यूनानी में “यदि” वाला शर्तवाचक रूप है, पर प्रसंग में यह शर्त संभवतः सत्य मानी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन संबोधन को आत्मीय और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है। ‘प्रिय’ प्रेम की शब्दावली से संबंध बनाए रखता है, यद्यपि यूनानी के समान शब्द-मूल की पूर्ण पुनरावृत्ति हिन्दी में संभव नहीं।
- source_word: εἰ
  choice: यदि
  rationale: यूनानी की शर्तवाचक संरचना को सुरक्षित रखता है; प्रसंग में यह शर्त सत्य मानी गई है, फिर भी इसे सीधे ‘क्योंकि’ बनाकर अर्थ को निश्चित नहीं किया गया।
- source_word: οὕτως
  choice: ऐसा
  rationale: यह पिछले प्रसंग में प्रकट परमेश्वर के प्रेम के ढंग और परिमाण, दोनों की ओर संकेत कर सकता है; ‘ऐसा’ इस स्वाभाविक अस्पष्टता को बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: आधुनिक मानक हिन्दी बाइबलीय प्रयोग में θεός का स्वाभाविक और गरिमापूर्ण अनुवाद।
- source_word: ἠγάπησεν
  choice: प्रेम किया
  rationale: ἀγαπάω के भूतकालीन कथन को स्वाभाविक हिन्दी में व्यक्त करता है और पद की मुख्य प्रेम-विषयक शब्दावली बनाए रखता है।
- source_word: ἡμᾶς
  choice: हमसे
  rationale: हिन्दी में ‘किसी से प्रेम करना’ स्वाभाविक कारक-रचना है और यूनानी कर्मवाचक सर्वनाम का अर्थ ठीक व्यक्त करती है।
- source_word: καὶ ἡμεῖς
  choice: हमें भी
  rationale: ‘भी’ पारस्परिक उत्तरदायित्व पर बल देता है; हिन्दी वाक्य-रचना में कर्ता का भाव ‘हमें’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὀφείλομεν
  choice: करना चाहिए
  rationale: नैतिक दायित्व को स्पष्ट करता है, पर ‘अवश्य’ जैसी अधिक कठोर आज्ञात्मक तीव्रता नहीं जोड़ता।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: पारस्परिक संबंध का सामान्य, स्पष्ट आधुनिक हिन्दी रूप।
- source_word: ἀγαπᾶν
  choice: प्रेम करना
  rationale: पूरक क्रिया के रूप में स्वाभाविक हिन्दी है और पद की प्रेम-संबंधी पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: εἰ से आरम्भ होने वाले उपवाक्य का बल
  choice: ‘यदि परमेश्वर ने हमसे ऐसा प्रेम किया’—औपचारिक शर्तवाचक रूप बनाए रखा गया।
  alternative: ‘क्योंकि/जब परमेश्वर ने हमसे इस प्रकार प्रेम किया’
  rationale: प्रसंग परमेश्वर के प्रेम को सत्य मानता है, पर यूनानी कथन को शर्त के रूप में रखता है। ‘यदि’ उस आलंकारिक बल और धार्मिक तनाव को सुरक्षित रखता है; पादटिप्पणी संभावित कारणवाचक समझ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, आत्मीय और गरिमापूर्ण रखी गई है। ‘प्रिय जनो’ यूहन्ना के स्नेहपूर्ण संबोधन के अनुकूल है। ‘ऐसा प्रेम किया’ οὕτως के ढंग और परिमाण दोनों संभावित संकेतों को खुला रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित कथन के अंत में दिया गया है।
