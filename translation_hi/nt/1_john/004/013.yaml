base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: hi
  text: इसी से[a] हम जानते हैं कि हम उसमें बने रहते हैं और वह हममें बना रहता है, क्योंकि उसने हमें अपने आत्मा में से दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी में हम जानते हैं …।” यूनानी वाक्यांश का अधिक शब्दशः अनुवाद ऐसा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “अपने आत्मा में से”; यह अभिव्यक्ति आत्मा को स्रोत के रूप में उभारती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: इसी से
  rationale: यह यूहन्ना की प्रमाण-सूचक अभिव्यक्ति है; ‘इसी से’ सहज हिन्दी में उस आधार या प्रमाण को व्यक्त करता है जिससे कुछ जाना जाता है।
- source_word: γινώσκομεν
  choice: हम जानते हैं
  rationale: वर्तमान काल यहाँ निरंतर ज्ञान या आश्वस्तता बताता है; ‘जानते हैं’ स्वाभाविक और सटीक है।
- source_word: ἐν αὐτῷ μένομεν
  choice: हम उसमें बने रहते हैं
  rationale: μένω यूहन्ना के लेखन का प्रमुख संबंधपरक शब्द है। ‘बने रहते हैं’ उसकी निरंतरता को आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: और वह हममें
  rationale: यूनानी में क्रिया दुबारा नहीं आई है; संक्षिप्त हिन्दी वाक्यांश उसी समानांतरता को बनाए रखता है, और ‘बना रहता है’ स्वतः समझ में आता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: दूसरा ὅτι उस ज्ञान का आधार बताता है; इस प्रसंग में ‘क्योंकि’ स्वाभाविक व्याख्यात्मक संबंध व्यक्त करता है।
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: अपने आत्मा में से
  rationale: ἐκ स्रोत अथवा उसमें से दिए जाने का भाव रखता है। ‘में से’ इस असामान्य किंतु वास्तविक स्रोत/अंशात्मक बारीकी को केवल ‘अपना आत्मा’ कहने की अपेक्षा अधिक स्पष्टता से बचाता है।
- source_word: δέδωκεν ἡμῖν
  choice: उसने ... हमें दिया है
  rationale: पूर्ण काल अतीत में संपन्न दान और उसके वर्तमान परिणाम को दर्शाता है; ‘दिया है’ इस पहलू को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ और πνεῦμα की पहचान
  choice: ‘अपने आत्मा’ परमेश्वर के आत्मा को दर्शाता है; ‘आत्मा’ को सम्मानसूचक धार्मिक संज्ञा के रूप में लिखा गया है।
  alternative: ‘आत्मा’ को सामान्य आत्मिक वरदान या मनोवृत्ति मानना
  rationale: निकटवर्ती प्रसंग में परमेश्वर और विश्वासियों का परस्पर बने रहना परमेश्वर द्वारा दिए गए आत्मा से प्रमाणित होता है। हिन्दी में देवनागरी के अक्षर-रूप से बड़ा/छोटा अक्षर भेद संभव नहीं, इसलिए संदर्भ ही पहचान स्पष्ट करता है।
- issue: परस्पर निवास के लिए μένω का अनुवाद
  choice: ‘हम उसमें बने रहते हैं और वह हममें’
  alternative: ‘हम उसमें वास करते हैं और वह हममें वास करता है’
  rationale: चुना गया रूप संबंध की निरंतरता और यूनानी की संक्षिप्त समानांतर रचना बनाए रखता है, बिना किसी दार्शनिक या सांप्रदायिक विस्तार के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘बने रहते हैं’ को यूहन्ना की संबंधपरक निरंतरता के लिए रखा गया है। मुख्य पाठ में ‘अपने आत्मा में से’ जानबूझकर थोड़ा औपचारिक है ताकि यूनानी ἐκ की स्रोत/अंशात्मक बारीकी न मिटे।
