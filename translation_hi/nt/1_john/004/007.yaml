id: 1JN.4.7
reference: 1 John 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: hi
  text: हे प्रियो[a], हम एक-दूसरे से प्रेम करें, क्योंकि प्रेम परमेश्वर से है; और हर कोई जो प्रेम करता है, परमेश्वर से जन्मा है और परमेश्वर को जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रिय मित्रो।” यूनानी सम्बोधन का शाब्दिक अर्थ “प्रियो” है और यह पूरे पद में दोहराए गए ‘प्रेम’ शब्द-परिवार की प्रतिध्वनि करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: हे प्रियो
  rationale: सम्बोधन के बहुवचन और स्नेहपूर्ण भाव को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है तथा इसी पद में बार-बार आने वाले ἀγαπ- प्रेम-शब्द परिवार से संबंध बनाए रखता है।
- source_word: ἀγαπῶμεν
  choice: हम ... प्रेम करें
  rationale: प्रथम पुरुष बहुवचन के आग्रहसूचक वर्तमान संभावनार्थक का स्वाभाविक हिन्दी रूप; निरंतरता को अनावश्यक रूप से स्पष्ट करके मूल से अधिक नहीं कहता।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: पारस्परिक सर्वनाम का प्रचलित और सहज हिन्दी रूप।
- source_word: ὅτι
  choice: क्योंकि
  rationale: आग्रह के आधार या कारण को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡ ἀγάπη
  choice: प्रेम
  rationale: यहाँ पदबंध सामान्य अर्थ में प्रेम को बताता है; हिन्दी में निश्चित उपपद जोड़ना आवश्यक नहीं।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἐκ द्वारा व्यक्त स्रोत या उद्गम को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: πᾶς ὁ ἀγαπῶν
  choice: हर कोई जो प्रेम करता है
  rationale: πᾶς के साथ संज्ञार्थक कृदंत द्वारा बताए गए सामान्य वर्ग को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: γεγέννηται
  choice: जन्मा है
  rationale: पूर्णकालिक कर्मवाच्य के घटित कार्य और वर्तमान परिणाम को हिन्दी के स्वाभाविक पूर्ण रूप में व्यक्त करता है; कर्ता का पुल्लिंग रूप ‘हर कोई’ के व्याकरणिक रूप से मेल खाता है।
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: परमेश्वर से जन्मा है
  rationale: यूहन्ना के विशिष्ट प्रयोग में दिव्य स्रोत को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: γινώσκει τὸν θεόν
  choice: परमेश्वर को जानता है
  rationale: वर्तमानकालीन, संबंधपरक ज्ञान को सीधे व्यक्त करता है; ‘जानने लगा है’ जैसी आरंभसूचक छाया नहीं जोड़ता।
theological_decisions:
- issue: प्रेम, परमेश्वर से जन्म और परमेश्वर के ज्ञान का संबंध
  choice: पद को सीधे इस प्रकार प्रस्तुत किया गया है कि प्रेम करने वाला परमेश्वर से जन्मा है और परमेश्वर को जानता है।
  alternative: इसे या तो उद्धार-क्रम का तकनीकी, निर्णायक प्रमाण बनाना, अथवा नए जन्म से अलग केवल नैतिक कथन मानना।
  rationale: यूनानी पाठ इन तीनों वास्तविकताओं को जोड़ता है, पर उनके कालानुक्रमिक या व्यवस्थित धर्मवैज्ञानिक संबंध को विस्तार से परिभाषित नहीं करता; अनुवाद उसी तनाव को बनाए रखता है।
- issue: ἀγάπη / ἀγαπάω शब्द-परिवार की पुनरावृत्ति
  choice: सम्बोधन में ‘प्रियो’ और शेष पद में ‘प्रेम’ रखकर हिन्दी में यथासंभव समान शब्द-परिवार की प्रतिध्वनि सुरक्षित की गई है।
  alternative: ‘प्रिय मित्रो’ जैसे सम्बोधन से स्नेह तो व्यक्त करना, पर प्रेम-शब्द की साहित्यिक कड़ी को अस्पष्ट कर देना।
  rationale: मूल पद की अलंकारिक और धर्मवैज्ञानिक शक्ति ἀγαπ- मूल की पुनरावृत्ति में निहित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘हे प्रियो’ सामान्य बोलचाल से कुछ ऊँचा सम्बोधन है, पर मूल की स्नेहपूर्ण शब्द-कड़ी सुरक्षित करता है; वैकल्पिक सहज रूप पादटिप्पणी में दिया गया है।
