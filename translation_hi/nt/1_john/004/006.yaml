id: 1JN.4.6
reference: 1 John 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: hi
  text: हम परमेश्वर से हैं। जो परमेश्वर को जानता है, वह हमारी बात सुनता है; जो परमेश्वर से नहीं है, वह हमारी बात नहीं सुनता[a]। इसी से हम सत्य की आत्मा[b] और भ्रम की आत्मा को पहचानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों जगह ‘हमारी बात सुनता है’ का अनुवाद ‘हमें सुनता है’ भी हो सकता है। यूनानी क्रिया का मूल अर्थ ‘सुनना’ है, पर यहाँ प्रेरितों की गवाही को ग्रहण करने का भाव सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: ‘सत्य की आत्मा’ यूहन्ना 14:17; 15:26; 16:13 की प्रतिध्वनि है और सम्भवतः पवित्र आत्मा को सूचित करता है; इसे अधिक सामान्य अर्थ में भी समझा जा सकता है।
    reason: alternative_reading_cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ‘से’ यूनानी ἐκ के स्रोत या उद्गम के भाव को बनाए रखता है और यूहन्ना के लेखन में पाए जाने वाले विरोध—परमेश्वर से होना या न होना—को सीधे व्यक्त करता है।
- source_word: γινώσκων τὸν θεόν
  choice: जो परमेश्वर को जानता है
  rationale: वर्तमान कृदंत के सामान्य और चरित्रसूचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀκούει ἡμῶν
  choice: हमारी सुनता है
  rationale: यह केवल ध्वनि सुनने के बजाय प्रेरितों की गवाही को ग्रहण करने का भाव देता है, पर ‘आज्ञा मानता है’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: ἐκ τούτου γινώσκομεν
  choice: इसी से हम ... पहचानते हैं
  rationale: ‘इसी से’ पिछले कथन को पहचान की कसौटी बताता है; ‘पहचानते हैं’ इस संदर्भ में सत्य और भ्रम के आत्मिक स्रोतों के बीच विवेक करने का स्वाभाविक हिन्दी रूप है।
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: सत्य के आत्मा
  rationale: सम्बन्धवाचक संरचना को निकटता से रखता है और यूहन्ना के साहित्य में पवित्र आत्मा के लिए प्रयुक्त पद की सम्भावना को बनाए रखता है।
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: भ्रम की आत्मा
  rationale: πλάνη में भूल, धोखे और सत्य से भटकने के भाव हैं; ‘भ्रम’ सत्य के साथ विरोध को संक्षेप में व्यक्त करते हुए इस अर्थ-सीमा को पर्याप्त रूप से खुला रखता है।
theological_decisions:
- issue: क्या ‘सत्य के आत्मा’ से विशेष रूप से पवित्र आत्मा अभिप्रेत है
  choice: मुख्य पाठ में ‘सत्य के आत्मा’
  alternative: ‘सत्य की आत्मा’ को सामान्य सत्यवादी प्रवृत्ति या आत्मिक प्रभाव मानना
  rationale: 1 यूहन्ना 4:1–6 में आत्माओं को परखने का प्रसंग और यूहन्ना 14:17; 15:26; 16:13 का समान पद पवित्र आत्मा की ओर संकेत करता है। फिर भी हिन्दी में बड़े अक्षर से भेद नहीं किया जा सकता और यूनानी पद अपने आप में कुछ व्याख्यात्मक खुलापन रखता है, इसलिए इसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἀκούει ἡμῶν में केवल सुनना या ग्रहणशीलता
  choice: हमारी सुनता है
  alternative: हमारी बात सुनता है / हमारी आज्ञा मानता है
  rationale: यह रूप प्रेरितों की गवाही की ग्रहणशील सुनवाई बताता है, लेकिन इसे स्पष्ट आज्ञापालन बनाकर अर्थ को आवश्यकता से अधिक प्रबल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हमारी सुनता है’ सामान्य हिन्दी में ग्रहणशील सुनवाई का अर्थ देता है। ‘परमेश्वर से’ कुछ असामान्य लग सकता है, पर यह जानबूझकर यूनानी ἐκ के स्रोत/उद्गम के महत्त्वपूर्ण यूहन्नाई भाव को सुरक्षित रखता है।
