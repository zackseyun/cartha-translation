source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: hi
  text: परमेश्वर को कभी किसी ने नहीं देखा। यदि हम एक-दूसरे से प्रेम करते हैं, तो परमेश्वर हममें बना रहता है, और उसका प्रेम[a] हममें पूर्णता को पहुँचा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के लिए हमारा प्रेम।” यूनानी वाक्यांश का अर्थ परमेश्वर का हमारे प्रति प्रेम या हमारा परमेश्वर के प्रति प्रेम—दोनों हो सकता है; संदर्भ पहले अर्थ के अधिक अनुकूल है।
    reason: alternative_reading
  - marker: b
    text: या, “पूर्ण किया गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: देखा
  rationale: θεάομαι यहाँ प्रत्यक्ष देखने या निहारने का भाव रखता है। आधुनिक हिन्दी में ‘देखा’ स्वाभाविक है और पूर्णकाल के बल को πώποτε के साथ ‘कभी ... नहीं’ व्यक्त करता है।
- source_word: πώποτε
  choice: कभी
  rationale: 'नकार के साथ यह किसी भी समय को समेटते हुए सार्वभौमिक कथन बनाता है: ‘कभी किसी ने नहीं देखा।’'
- source_word: ἐὰν ἀγαπῶμεν
  choice: यदि हम ... प्रेम करते हैं
  rationale: ἐάν के साथ वर्तमान संभावनार्थक क्रिया वास्तविक शर्त व्यक्त करती है; ‘यदि’ इस शर्त को सहज हिन्दी में बनाए रखता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: यह पारस्परिकता का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: μένει
  choice: बना रहता है
  rationale: यूहन्ना के लेखन में μένω निरंतर संबंध और निवास का प्रमुख शब्द है; ‘बना रहता है’ इसे आधुनिक और सुबोध हिन्दी में व्यक्त करता है।
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: उसका प्रेम
  rationale: αὐτοῦ को मुख्य पाठ में परमेश्वर के प्रेम के रूप में लेना निकटवर्ती संदर्भ (पद 10–11) के अनुकूल है, जहाँ परमेश्वर का पहल करने वाला प्रेम प्रमुख है; संबंधकारक की दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: दोनों स्थानों पर एक-सा अनुवाद अंतर्निवास के विषय को बनाए रखता है; ‘हमारे बीच’ सम्भव होते हुए भी μένει के संदर्भ में कम उपयुक्त है।
- source_word: τετελειωμένη ἐστιν
  choice: पूर्णता को पहुँचा है
  rationale: यह परिपूर्ण कृदन्त और सहायक क्रिया की रचना किसी पूरी हुई प्रक्रिया के वर्तमान परिणाम को दर्शाती है। ‘पूर्णता को पहुँचा है’ हिन्दी में स्वाभाविक रहते हुए इस अवस्था को व्यक्त करता है।
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ में संबंधकारक का अर्थ
  choice: परमेश्वर का प्रेम हममें पूर्णता को पहुँचता है
  alternative: परमेश्वर के लिए हमारा प्रेम हममें पूर्णता को पहुँचता है
  rationale: निकटवर्ती संदर्भ परमेश्वर के पहले किए गए प्रेम पर बल देता है, इसलिए कर्तृवाचक/अधिकारसूचक अर्थ अधिक सम्भावित है। फिर भी यूनानी संबंधकारक में वास्तविक अस्पष्टता होने के कारण वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τετελειωμένη ἐστιν का परिणामकारी पूर्ण भाव
  choice: पूर्णता को पहुँचा है
  alternative: सिद्ध हुआ है
  rationale: मुख्य रूप समाप्त प्रक्रिया से उत्पन्न वर्तमान अवस्था को स्पष्ट करता है; वैकल्पिक रूप उसी विचार का अधिक पारंपरिक और संक्षिप्त धार्मिक पद है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘हममें’ को दोनों बार जोड़कर लिखा गया है ताकि मूल की पुनरावृत्ति और अंतर्निवास का भाव बना रहे। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
