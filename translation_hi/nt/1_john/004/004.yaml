source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: hi
  text: हे प्यारे बच्चो, तुम परमेश्वर से हो और उन पर जय पा चुके हो,[a] क्योंकि जो तुम में है, वह उस से बड़ा है जो संसार में है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पिछले पदों में बताए गए विरोधियों पर, विशेषकर झूठे भविष्यवक्ताओं पर।
    reason: cross_reference
  - marker: b
    text: यूनानी पाठ दोनों की पहचान स्पष्ट नहीं करता। संदर्भ से पहला परमेश्वर या उसका आत्मा, और दूसरा संसार के पीछे सक्रिय दुष्ट जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है। संबोधन के साथ ‘तुम’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से हो
  rationale: ἐκ स्रोत, उत्पत्ति या परमेश्वर से प्राप्त संबंध को दर्शाता है; ‘परमेश्वर से हो’ यूहन्ना की भाषा और आगे के विरोध को सुरक्षित रखता है।
- source_word: τεκνία
  choice: हे प्यारे बच्चो
  rationale: τεκνία आत्मीय और स्नेहपूर्ण संबोधन है। ‘प्यारे बच्चो’ आधुनिक हिन्दी में उसका पारिवारिक स्नेह स्वाभाविक रूप से व्यक्त करता है।
- source_word: νενικήκατε
  choice: जय पा चुके हो
  rationale: पूर्णकालीन रूप पूरी हुई विजय और उसके बने हुए परिणाम को दर्शाता है; ‘जय पा चुके हो’ दोनों पक्षों को सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτούς
  choice: उन पर
  rationale: सर्वनाम पिछले संदर्भ के विरोधियों, विशेषकर झूठे भविष्यवक्ताओं, की ओर लौटता है; मुख्य पाठ में ‘उन’ मूल की अनिर्दिष्टता बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह विश्वासियों की विजय का कारण प्रस्तुत करता है।
- source_word: μείζων
  choice: महान
  rationale: तुलना केवल शक्ति तक सीमित नहीं है; ‘महान’ व्यापक अर्थ सुरक्षित रखता है और ‘से’ के साथ स्पष्ट तुलनात्मक वाक्य बनाता है।
- source_word: ὁ ἐν ὑμῖν
  choice: जो तुममें है
  rationale: यूनानी अभिव्यक्ति व्यक्ति का संकेत देती है, पर उसकी पहचान स्पष्ट नहीं करती; हिन्दी का यह रूप उसी निहितता को बनाए रखता है।
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: जो संसार में है
  rationale: पहली अभिव्यक्ति के समानांतर रचना रखते हुए यह पहचान को मुख्य पाठ में अनकहा रहने देता है।
- source_word: κόσμῳ
  choice: संसार
  rationale: ‘संसार’ यूहन्ना के व्यापक और कभी-कभी परमेश्वर-विरोधी अर्थक्षेत्र को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ‘जो तुममें है’ और ‘जो संसार में है’ की पहचान
  choice: मुख्य पाठ में दोनों की पहचान निहित रखी गई है।
  alternative: पहले को परमेश्वर या पवित्र आत्मा और दूसरे को शैतान या दुष्ट स्पष्ट रूप से कहना।
  rationale: संदर्भ इन पहचानों की ओर संकेत करता है, किंतु यूनानी पाठ दोनों को नाम नहीं देता। अनिर्दिष्टता बनाए रखना मूल की आलंकारिक शक्ति और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: αὐτούς का संदर्भ
  choice: मुख्य पाठ में ‘उन’ रखा गया और टिप्पणी में संदर्भ बताया गया।
  alternative: मुख्य पाठ में ‘झूठे भविष्यवक्ताओं’ या ‘विरोधियों’ कहना।
  rationale: निकटवर्ती संदर्भ विरोधियों, विशेषकर झूठे भविष्यवक्ताओं, की ओर संकेत करता है, लेकिन मूल पद केवल सर्वनाम का प्रयोग करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे प्यारे बच्चो’ स्नेहपूर्ण संबोधन को व्यक्त करता है; ‘जय पा चुके हो’ यूनानी पूर्णकाल के स्थायी परिणाम को उभारता है। दोनों निहित व्यक्तियों की पहचान मुख्य पाठ में जानबूझकर स्पष्ट नहीं की गई है।
