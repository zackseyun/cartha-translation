    text: या ‘अपने भाई या बहन से’; यूनानी में ‘अपने भाई’ पुल्लिंग एकवचन में है, जो यहाँ किसी सहविश्वासी के लिए प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: यह शब्द यूहन्ना के प्रयोग में नैतिक और अधिकारपूर्ण निर्देश को व्यक्त करता है; आधुनिक हिन्दी में ‘आज्ञा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀπ’ αὐτοῦ
  choice: उससे
  rationale: यूनानी सर्वनाम को सर्वनाम के रूप में रखा गया है; निकटवर्ती संदर्भ में इसका संकेत परमेश्वर की ओर है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ἵνα आज्ञा की विषय-वस्तु बताता है; हिन्दी में ‘कि’ इसका सहज समतुल्य है।
- source_word: ὁ ἀγαπῶν τὸν θεὸν
  choice: जो परमेश्वर से प्रेम करता है
  rationale: यह यूनानी के संज्ञास्वरूप कृदंत को स्वाभाविक हिन्दी में व्यक्त करता है और उसके प्रतिनिधिक एकवचन भाव को बनाए रखता है।
- source_word: ἀγαπᾷ
  choice: प्रेम करे
  rationale: ἵνα के बाद प्रयुक्त विधिलिंग आज्ञा से उत्पन्न दायित्व प्रकट करता है; ‘करे’ हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀδελφὸν αὐτοῦ
  choice: अपने भाई
  rationale: यूनानी में पुल्लिंग एकवचन ‘भाई’ है। ‘अपने’ कर्ता की ओर लौटने वाले संबंध को आधुनिक हिन्दी में स्वाभाविक रूप से स्पष्ट करता है। संदर्भगत समावेशी अर्थ पादटिप्पणी में दिया गया है।
- source_word: καὶ
  choice: भी
  rationale: 'दूसरा καί योगात्मक बल रखता है: परमेश्वर से प्रेम करने वाला अपने भाई से भी प्रेम करे।'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: प्रेम करना / प्रेम करता है / प्रेम करे
  rationale: एक ही यूनानी शब्द-समूह के लिए ‘प्रेम’ को लगातार रखा गया है, जिससे यूहन्ना की विषयगत संगति बनी रहती है।
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ में पुल्लिंग एकवचन और उसका प्रतिनिधिक अर्थ
  choice: मुख्य पाठ में ‘अपने भाई’ रखा गया है और व्यापक सामुदायिक अर्थ पादटिप्पणी में बताया गया है।
  alternative: अपने भाई या बहन; अपने सहविश्वासी
  rationale: मूल यूनानी व्याकरणतः पुल्लिंग एकवचन है, पर संदर्भ में यह सहविश्वासियों के लिए प्रतिनिधिक रूप से प्रयुक्त हो सकता है। मुख्य पाठ मूल रूप को सुरक्षित रखता है और पादटिप्पणी उसके व्यापक आशय को स्पष्ट करती है।
- issue: ἀπ’ αὐτοῦ का पूर्वसंदर्भ
  choice: ‘उससे’ के रूप में सर्वनाम बनाए रखा गया है।
  alternative: परमेश्वर से
  rationale: तात्कालिक संदर्भ में सर्वनाम परमेश्वर की ओर संकेत करता है, लेकिन मूल पाठ नाम को दोहराता नहीं है; इसलिए अनावश्यक स्पष्टता जोड़ने के बजाय संदर्भगत संकेत सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘परमेश्वर’, ‘आज्ञा’ और ‘प्रेम’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है।
