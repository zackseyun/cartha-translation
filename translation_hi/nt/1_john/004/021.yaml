  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: hi
  text: और हमें उससे यह आज्ञा प्राप्त है कि जो परमेश्वर से प्रेम करता है, वह अपने भाई[a] से भी प्रेम करे।
