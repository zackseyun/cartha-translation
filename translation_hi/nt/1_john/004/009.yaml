id: 1JN.4.9
reference: 1 John 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: hi
  text: 'परमेश्वर का प्रेम हमारे बीच[a] इस प्रकार प्रकट हुआ: परमेश्वर ने अपने इकलौते पुत्र[b] को संसार में भेजा है, ताकि हम उसके द्वारा जीएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हममें।” यूनानी पद का अर्थ विश्वासियों के भीतर या समुदाय के बीच—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “अद्वितीय पुत्र” भी हो सकता है। पारंपरिक अनुवाद में “एकलौता पुत्र” मिलता है; यह शब्द पुत्र की अद्वितीयता और एकमात्रता पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इस प्रकार
  rationale: यह यूहन्ना की विशिष्ट अभिव्यक्ति है, जो आगे आने वाले ὅτι-वाक्य द्वारा प्रेम के प्रकट होने का ढंग बताती है। हिंदी में ‘इस प्रकार’ स्वाभाविक रहते हुए इस व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: ἐφανερώθη
  choice: प्रकट हुआ
  rationale: यह φανερόω का अओरिस्ट कर्मवाच्य रूप है और किसी बात के दृश्य या ज्ञात हो जाने का भाव देता है। ‘प्रकट हुआ’ आधुनिक, गरिमापूर्ण और स्रोत के निकट है।
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: संदर्भ में संबंधकारक मुख्यतः कर्तृवाचक है—वह प्रेम जो परमेश्वर से आता है और पुत्र को भेजने में दिखाई देता है।
- source_word: ἐν ἡμῖν
  choice: हमारे बीच
  rationale: 'ἐν ἡμῖν का सामुदायिक अर्थ यहाँ स्वाभाविक है: परमेश्वर का प्रेम हमारे मध्य अथवा हमारे संबंध में प्रकट हुआ। शाब्दिक ‘हममें’ भी संभव है और पादटिप्पणी में रखा गया है।'
- source_word: ὅτι
  choice: कोलन के बाद व्याख्यात्मक कथन
  rationale: ὅτι पहले कथन की विषयवस्तु या व्याख्या प्रस्तुत करता है। हिंदी में कोलन और उसके बाद पूर्ण कथन इस संबंध को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: अपने इकलौते पुत्र
  rationale: μονογενής यहाँ पुत्र की अद्वितीयता और एकमात्रता पर बल देता है। ‘इकलौता पुत्र’ सहज आधुनिक हिंदी है; ऐतिहासिक ‘एकलौता जन्मा पुत्र’ को विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: ἀπέσταλκεν
  choice: भेजा है
  rationale: यूनानी पूर्णकाल एक पूरी हुई घटना के वर्तमान महत्त्व को बनाए रखता है; हिंदी का ‘भेजा है’ इस भाव को अच्छी तरह व्यक्त करता है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: यह पुत्र के मानव संसार में भेजे जाने का स्वाभाविक हिंदी रूप है।
- source_word: ἵνα ζήσωμεν
  choice: ताकि हम ... जीवन पाएँ
  rationale: ἵνα के साथ संभावनार्थक क्रिया उद्देश्य व्यक्त करती है। केवल ‘जीएँ’ की तुलना में ‘जीवन पाएँ’ यहाँ मसीह के द्वारा प्राप्त जीवन के यूहन्नाई भाव को स्वाभाविक हिंदी में अधिक स्पष्ट करता है, बिना उसे अनावश्यक रूप से परिभाषित किए।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: διά के संबंधकारक रूप में माध्यम या साधन का भाव है। ‘उसके द्वारा’ स्रोत के अर्थ को स्पष्ट और स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: पुत्र के लिए μονογενής का अर्थ
  choice: मुख्य पाठ में ‘इकलौते पुत्र’
  alternative: ‘एकलौते जन्मे पुत्र’ या ‘अद्वितीय पुत्र’
  rationale: यह चुनाव पुत्र के परमेश्वर के साथ अद्वितीय संबंध और उसकी एकमात्रता को व्यक्त करता है, पर शब्द में बाद की धर्मवैज्ञानिक शब्दावली को सीधे आरोपित नहीं करता। पारंपरिक रूप पादटिप्पणी में सुरक्षित है।
- issue: ἐν ἡμῖν का आशय
  choice: ‘हमारे बीच’
  alternative: ‘हममें’
  rationale: संदर्भ में प्रेम का समुदाय के मध्य या उसके संबंध में प्रकट होना स्वाभाविक है, पर भीतर प्रकट होने वाला अर्थ भी व्याकरणतः संभव है; इसलिए अस्पष्टता पादटिप्पणी में संरक्षित है।
- issue: ἵνα ζήσωμεν में जीवन का स्वरूप
  choice: ‘ताकि हम उसके द्वारा जीवन पाएँ’
  alternative: ‘ताकि हम उसके द्वारा जीएँ’
  rationale: ‘जीवन पाएँ’ यूहन्ना के जीवन-विषयक प्रयोग को हिंदी में स्पष्ट करता है, जबकि यह तय नहीं करता कि यहाँ वर्तमान आत्मिक जीवन, अनन्त जीवन या दोनों में से कौन-सा पक्ष प्रधान है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘परमेश्वर’, ‘पुत्र’, ‘प्रकट हुआ’ और ‘उसके द्वारा’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य-संरचना स्रोत के व्याख्यात्मक प्रवाह को बनाए रखते हुए हिंदी में स्वाभाविक बनाई गई है।
