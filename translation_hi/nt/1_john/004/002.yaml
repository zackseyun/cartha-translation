source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: hi
  text: 'इसी से तुम परमेश्वर की आत्मा को पहचानते हो: हर आत्मा जो यह अंगीकार करता है[c] कि यीशु मसीह[a] देह में आए हैं[b], वह परमेश्वर से है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यीशु, जो मसीह हैं’। यूनानी Χριστός एक उपाधि है, जिसका अर्थ ‘मसीह’, अर्थात अभिषिक्त जन, है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘देह में आए हुए’। यूनानी में पूर्णकालिक कृदन्त है, जो यीशु मसीह के वास्तव में देह में आने और उसके बने रहने वाले महत्त्व पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘देह में आए हुए यीशु मसीह को अंगीकार करता है’।
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह वाक्यांश उस कसौटी या साधन का परिचय देता है जिसके द्वारा पहचान की जाती है; ‘इसी से’ आधुनिक हिन्दी में स्वाभाविक है और साधनसूचक अर्थ बनाए रखता है।
- source_word: γινώσκετε
  choice: तुम ... पहचानते हो
  rationale: इसे वर्तमानकालीन कथन के रूप में लिया गया है। ‘पहचानते हो’ प्रसंग में आत्माओं को परखकर पहचानने का भाव स्पष्ट करता है।
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: परमेश्वर के आत्मा
  rationale: सप्रसंग यह पद परमेश्वर के आत्मा की ओर संकेत करता है, जिसका अंतर आगे उल्लिखित प्रत्येक आत्मा से किया जाता है। ‘के’ का प्रयोग ‘आत्मा को’ के साथ हिन्दी की परसर्गीय रचना के कारण है।
- source_word: πᾶν πνεῦμα
  choice: हर आत्मा
  rationale: यह किसी भी जाँचे जा रहे आत्मिक दावे या प्रभाव को समाविष्ट करने वाला वितरणात्मक प्रयोग है।
- source_word: ὁμολογεῖ
  choice: अंगीकार करता है
  rationale: यह खुलकर स्वीकार करने और घोषित करने, दोनों का भाव रखता है; ‘अंगीकार’ यूहन्ना के प्रसंग में इस अर्थ को सटीक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: Χριστός को उसके उपाधिमूलक अर्थ में ‘मसीह’ रखा गया है; हिन्दी में ‘यीशु मसीह’ स्वाभाविक रूप से नाम और उपाधि का संयुक्त रूप है।
- source_word: ἐν σαρκὶ
  choice: देह में
  rationale: यह यीशु के वास्तविक मानवीय, शारीरिक आगमन की पुष्टि करता है और यूनानी σάρξ की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: ἐληλυθότα
  choice: आए हैं
  rationale: हिन्दी का पूर्ण वर्तमान यूनानी पूर्णकालिक कृदन्त के उस भाव को स्वाभाविक रूप से व्यक्त करता है जिसमें अतीत का आगमन वर्तमान में स्थायी महत्त्व रखता है।
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: परमेश्वर से है
  rationale: ἐκ उद्गम या स्रोत बताता है; ‘परमेश्वर से है’ स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: क्या τὸ πνεῦμα τοῦ θεοῦ विशेष रूप से परमेश्वर के आत्मा को दर्शाता है या सामान्यतः परमेश्वर से आए किसी आत्मा को
  choice: ‘परमेश्वर के आत्मा’ के रूप में अनुवाद किया गया है, जो आगे के ‘हर आत्मा’ से अलग परमेश्वर के अपने आत्मा की ओर संकेत करता है।
  alternative: ‘परमेश्वर की ओर से आनेवाला आत्मा’
  rationale: एकवचन, निश्चित पदबंध और 4:1–3 में सच्चे तथा झूठे आत्माओं के बीच का विरोध परमेश्वर के आत्मा की ओर संकेत करता है; फिर भी अनुवाद मूल पदबंध से आगे कोई तकनीकी विस्तार नहीं जोड़ता।
- issue: ἐν σαρκὶ ἐληλυθότα का मसीह-संबंधी बल
  choice: ‘देह में आए हैं’ द्वारा वास्तविक देहधारण और उसके स्थायी महत्त्व को व्यक्त किया गया है।
  alternative: ‘मनुष्य बनकर आए हैं’
  rationale: ‘देह में’ मूल यूनानी की अभिव्यक्ति और उसके तनाव को सुरक्षित रखता है, जबकि ‘मनुष्य बनकर’ अधिक व्याख्यात्मक होता।
- issue: ὁμολογεῖ के बाद Ἰησοῦν Χριστὸν ... ἐληλυθότα की वाक्यगत रचना
  choice: स्वाभाविक हिन्दी में ‘यह अंगीकार करता है कि यीशु मसीह ... आए हैं’ रखा गया है।
  alternative: ‘देह में आए हुए यीशु मसीह को अंगीकार करता है’
  rationale: यूनानी में यीशु मसीह कर्मकारक है और कृदन्त उनका वर्णन करता है। हिन्दी की ‘कि’ वाली रचना उसी कथ्य को स्पष्ट करती है, जबकि पादटिप्पणी अधिक रूप-सन्निकट विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आत्मा’ को मानक हिन्दी व्याकरण के अनुसार पुल्लिंग माना गया है। मुख्य वाक्य में ‘कि’ वाली रचना स्वाभाविक हिन्दी देती है; अधिक शाब्दिक कृदन्तीय रचना पादटिप्पणी में सुरक्षित है।
