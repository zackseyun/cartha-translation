  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: hi
  text: जो सदा सीखती तो रहती हैं, पर सत्य के ज्ञान[a] तक कभी नहीं पहुँच पातीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य के पूरे ज्ञान।” यूनानी शब्द अधिक पूर्ण या गहरे ज्ञान का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: सदा
  rationale: यह निरंतर और बार-बार होने वाली क्रिया का भाव देता है तथा μηδέποτε के साथ तीखा विरोध बनाए रखता है।
- source_word: μανθάνοντα
  choice: सीखती तो रहती हैं
  rationale: वर्तमान कृदन्त लगातार सीखने की क्रिया बताता है। 'तो' आगे आने वाले विरोध को स्वाभाविक हिन्दी में उभारता है। स्त्रीलिंग बहुवचन पिछले पद में वर्णित स्त्रियों से इसके व्याकरणिक संबंध को बनाए रखता है।
- source_word: μηδέποτε
  choice: कभी नहीं
  rationale: यह प्रबल कालवाचक निषेध है और πάντοτε के विपरीत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: सत्य के ज्ञान तक
  rationale: εἰς और ἐλθεῖν मिलकर किसी लक्ष्य तक पहुँचने का भाव देते हैं। 'सत्य के ज्ञान' स्वाभाविक है और ἐπίγνωσις में सम्भव अधिक पूर्ण ज्ञान की छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐλθεῖν δυνάμενα
  choice: पहुँच पातीं
  rationale: यह आगमन और सामर्थ्य दोनों को संक्षिप्त, सहज हिन्दी में व्यक्त करता है; निषेध के साथ असमर्थता का आशय स्पष्ट रहता है।
theological_decisions:
- issue: पौलुस के प्रयोग में ἐπίγνωσις का अर्थ-बल
  choice: ज्ञान
  alternative: पूरा ज्ञान
  rationale: यह शब्द अधिक पूर्ण या गहरे ज्ञान का भाव रख सकता है, पर यहाँ मुख्य विरोध सदा सीखने और सत्य के वास्तविक ज्ञान तक न पहुँच पाने के बीच है। मुख्य पाठ में 'ज्ञान' अतिव्याख्या से बचता है और सम्भव प्रबल अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यह पद पिछले पद से जुड़ा हुआ वाक्यांश है, इसलिए स्त्रीलिंग बहुवचन 'सीखती...पातीं' मूल यूनानी के व्याकरणिक संबंध को स्पष्ट करता है।
