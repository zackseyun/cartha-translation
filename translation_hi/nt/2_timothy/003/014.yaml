  rationale: स्पष्ट सर्वनाम और δέ मिलकर पिछले वर्णन के विपरीत तीखा व्यक्तिगत आग्रह व्यक्त करते हैं; आधुनिक हिन्दी में ‘पर तुम’ इसे स्वाभाविक रूप से रखता है।
- source_word: μένε ἐν οἷς
  choice: उन बातों में बने रहो
  rationale: वर्तमान आज्ञार्थक निरंतर टिके रहने का भाव देता है, और ‘में’ मूल के क्षेत्र-संबंधी रूपक को बनाए रखता है।
- source_word: ἔμαθες
