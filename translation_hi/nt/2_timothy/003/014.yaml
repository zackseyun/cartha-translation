  text: पर तुम उन बातों में बने रहो जिन्हें तुमने सीखा और जिनके विषय में तुम्हें दृढ़ विश्वास हुआ,[a] यह जानते हुए कि तुमने उन्हें किन लोगों से सीखा।[b]
  philosophy: optimal-equivalence
  footnotes:
