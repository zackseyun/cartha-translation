  rationale: अओरिस्ट तीमुथियुस द्वारा पहले प्राप्त की गई शिक्षा की ओर संकेत करता है; हिन्दी का सामान्य पूर्ण भूत रूप उपयुक्त है।
- source_word: ἐπιστώθης
  choice: जिनके विषय में तुम्हें दृढ़ विश्वास हुआ
  rationale: निष्क्रिय क्रिया यहाँ सीखी हुई बातों के संबंध में आश्वस्त या निश्चित हो जाने का भाव देती है; यह अनुवाद परिणामी दृढ़ता को स्पष्ट करता है।
- source_word: εἰδὼς
  choice: क्योंकि तुम जानते हो
  rationale: कृदन्त का प्रसंग में कारणात्मक संबंध स्वाभाविक है; हिन्दी में यह रूप वाक्य को सुबोध बनाता है, यद्यपि मूल कृदन्त कुछ अर्थगत खुलापन रखता है।
- source_word: παρὰ τίνων
  choice: किन लोगों से
  rationale: παρά संबंधकारक के साथ स्रोत दर्शाता है, और SBLGNT का बहुवचन रूप एक से अधिक शिक्षकों की ओर संकेत कर सकता है, बिना उनकी पहचान तय किए।
theological_decisions:
- issue: παρὰ τίνων का संदर्भ
  choice: मुख्य पाठ में बहुवचन ‘किन लोगों से’ रखा गया और शिक्षकों की पहचान नहीं की गई।
  alternative: कुछ पांडुलिपियों के एकवचन के अनुसार ‘किससे’, जिसे प्रायः पौलुस समझा जाता है।
  rationale: SBLGNT में बहुवचन पाठ है और पद स्वयं शिक्षकों को नाम से नहीं बताता; अतः उनकी पहचान सीमित करना उचित नहीं।
- issue: ἐπιστώθης का अर्थ
  choice: ‘तुम्हें दृढ़ विश्वास हुआ’
  alternative: ‘तुम्हें निश्चय दिलाया गया’ या ‘तुम आश्वस्त हुए’
  rationale: यह सीखी हुई शिक्षा के विषय में तीमुथियुस की स्थापित निश्चितता व्यक्त करता है और इसे किसी औपचारिक सौंपे जाने के अर्थ में नहीं बदलता।
