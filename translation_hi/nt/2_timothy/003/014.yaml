    text: कुछ पांडुलिपियों में “किससे” एकवचन में है, जिसे प्रायः पौलुस के लिए समझा जाता है; यहाँ अपनाया गया बहुवचन पाठ तीमुथियुस के शिक्षकों की ओर अधिक व्यापक रूप से संकेत कर सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
