id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: hi
  text: क्योंकि लोग स्वार्थी, धन से प्रेम करनेवाले, डींग मारनेवाले, घमंडी, निंदा करनेवाले[a], माता-पिता की आज्ञा न माननेवाले, कृतघ्न, अपवित्र होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की निंदा करनेवाले” अथवा “अपमानजनक बातें कहनेवाले।” यूनानी शब्द ऐसी वाणी के लिए प्रयुक्त हो सकता है जो मनुष्यों या परमेश्वर का अनादर करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: होंगे
  rationale: εἰμί के भविष्यकालीन रूप को सहज और स्पष्ट हिन्दी भविष्यकाल में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करनेवाले संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यहाँ पुल्लिंग बहुवचन समस्त लोगों के लिए सामान्य अर्थ में प्रयुक्त है; ‘लोग’ अनावश्यक रूप से इसे केवल पुरुषों तक सीमित नहीं करता।
- source_word: φίλαυτοι
  choice: स्वार्थी
  rationale: यह शब्द अपने प्रति अनुचित और स्वार्थपूर्ण प्रेम को दर्शाता है; ‘स्वार्थी’ आधुनिक हिन्दी में इस दुर्गुण को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: φιλάργυροι
  choice: धन से प्रेम करनेवाले
  rationale: यूनानी यौगिक का शाब्दिक आशय धन से प्रेम रखना है; यह अनुवाद मूल अभिव्यक्ति को बनाए रखता है और इसे केवल सामान्य लोभ तक सीमित नहीं करता।
- source_word: ἀλαζόνες
  choice: डींग मारनेवाले
  rationale: यह घमंड से अपनी बढ़ाई करने या दिखावा करनेवालों को दर्शाता है; चुनी हुई अभिव्यक्ति वर्तमान हिन्दी में स्पष्ट है।
- source_word: ὑπερήφανοι
  choice: घमंडी
  rationale: यह दूसरों से अपने को ऊँचा समझने के नकारात्मक नैतिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βλάσφημοι
  choice: निन्दा करनेवाले
  rationale: यह शब्द मनुष्यों या परमेश्वर के विरुद्ध अपमानजनक अथवा निन्दात्मक वाणी को सूचित कर सकता है; ‘निन्दा करनेवाले’ इस व्यापकता को बनाए रखता है।
- source_word: γονεῦσιν ἀπειθεῖς
  choice: माता-पिता की आज्ञा न माननेवाले
  rationale: यह दत्तिव बहुवचन के साथ प्रयुक्त विशेषण का स्पष्ट और प्रचलित हिन्दी अर्थ है।
- source_word: ἀχάριστοι
  choice: कृतघ्न
  rationale: कृतज्ञता के अभाव को संक्षिप्त, प्रतिष्ठित और परिचित हिन्दी में व्यक्त करता है।
- source_word: ἀνόσιοι
  choice: अपवित्र
  rationale: यह पवित्रता और धार्मिक श्रद्धा से रहित होने के नैतिक-धार्मिक भाव को बनाए रखता है।
theological_decisions:
- issue: οἱ ἄνθρωποι का सामान्य पुल्लिंग प्रयोग
  choice: लोग
  alternative: मनुष्य / पुरुष
  rationale: संदर्भ सामान्य मानव व्यवहार का है, केवल पुरुषों का नहीं; ‘लोग’ इस व्यापक आशय को सहज रूप से व्यक्त करता है।
- issue: इस दुर्गुण-सूची में βλάσφημοι का अर्थ
  choice: निन्दा करनेवाले
  alternative: परमेश्वर की निन्दा करनेवाले / अपमानजनक बातें कहनेवाले
  rationale: यूनानी शब्द मनुष्यों के विरुद्ध बदनामी या अपमान और परमेश्वर के विरुद्ध निन्दा—दोनों के लिए आ सकता है। मुख्य पाठ में व्यापक शब्द रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दुर्गुण-सूची की लय बनाए रखने के लिए समानांतर विशेषणात्मक पदों का प्रयोग किया गया है।
