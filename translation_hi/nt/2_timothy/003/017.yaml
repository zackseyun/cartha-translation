source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: hi
  text: ताकि परमेश्वर का जन[a] पूर्ण रूप से योग्य हो और हर भले काम के लिए पूरी तरह तैयार[b] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर का जन’ यूनानी में पुल्लिंग एकवचन का एक पहचाना हुआ बाइबलीय पदनाम है। संदर्भ में यह विशेष रूप से परमेश्वर के सेवक की ओर संकेत कर सकता है, पर पवित्रशास्त्र से गढ़े जाने वाले विश्वासियों पर भी अधिक व्यापक रूप से लागू हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, ‘हर भले काम के लिए पूरी तरह सुसज्जित।’ यूनानी कृदन्त का भाव है कि उसे भली-भाँति तैयार किया गया है और आवश्यक साधनों से युक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पद 16 से निकलने वाले उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄρτιος
  choice: पूर्ण रूप से योग्य
  rationale: यहाँ शब्द का अर्थ कार्य के लिए पूर्ण, सक्षम या उपयुक्त होना है; केवल ‘सिद्ध’ कहना आधुनिक हिन्दी में नैतिक निष्पापता का अनावश्यक संकेत दे सकता है।
- source_word: ᾖ
  choice: हो
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक क्रिया को हिन्दी उद्देश्यवाचक वाक्य में ‘ताकि ... हो’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: परमेश्वर का जन
  rationale: यह प्रतिष्ठित बाइबलीय पदनाम की गरिमा बनाए रखता है और यूनानी के एकवचन व्यक्ति-संदर्भ को अनावश्यक रूप से सीमित किए बिना व्यक्त करता है।
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: हर भले काम के लिए
  rationale: यह πρὸς की उद्देश्य/उपयुक्तता और πᾶν के वितरणात्मक अर्थ को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐξηρτισμένος
  choice: पूरी तरह तैयार
  rationale: पूर्ण निष्क्रिय कृदन्त पहले से अच्छी तरह तैयार या साधन-संपन्न किए जाने की परिणामी अवस्था बताता है; ‘पूरी तरह तैयार’ उसके तीव्र अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: ὁ τοῦ θεοῦ ἄνθρωπος में पुल्लिंग एकवचन पदनाम
  choice: परमेश्वर का जन
  alternative: परमेश्वर का मनुष्य
  rationale: यूनानी अभिव्यक्ति पुल्लिंग एकवचन है और संभवतः परमेश्वर के सेवक के लिए पहचाना हुआ बाइबलीय पदनाम है। हिन्दी में ‘परमेश्वर का जन’ इस पदनाम को सुरक्षित रखते हुए स्वाभाविक और गरिमापूर्ण है; पादटिप्पणी उसके तत्काल और व्यापक प्रयोग के बीच के तनाव को स्पष्ट करती है।
- issue: ἄρτιος और ἐξηρτισμένος के निकटार्थी बल का प्रस्तुतीकरण
  choice: पूर्ण रूप से योग्य ... पूरी तरह तैयार
  alternative: संपूर्ण ... सुसज्जित
  rationale: 'दोनों शब्दों को अलग रखा गया है: पहला व्यक्ति की उपयुक्तता/पूर्णता, दूसरा हर भले काम के लिए उसकी तैयार अवस्था बताता है। इससे किसी एक शब्द का बल दूसरे में विलीन नहीं होता।'
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण बाइबलीय शैली। ‘परमेश्वर का जन’ मान्य धार्मिक पदनाम के रूप में रखा गया है। ‘पूर्ण रूप से योग्य’ और ‘पूरी तरह तैयार’ मूल के दो निकट-संबंधित, पर अलग पदों को स्पष्ट रूप से व्यक्त करते हैं।
