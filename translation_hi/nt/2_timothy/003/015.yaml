  register: भाषा आधुनिक मानक हिन्दी की है। ‘शैशवकाल’ मूल के ‘बहुत छोटी आयु’ वाले अर्थ को बनाए रखने के लिए चुना गया है; शेष वाक्यरचना सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है।
