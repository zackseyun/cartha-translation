    text: या ‘पवित्र शास्त्रों को।’ यूनानी में शब्दशः ‘पवित्र लेख’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: शैशवकाल से
  rationale: βρέφος बहुत छोटे बच्चे या शिशु को दर्शाता है। ‘शैशवकाल से’ इस प्रबल अर्थ को सामान्य ‘बचपन से’ की अपेक्षा अधिक ठीक रखता है।
- source_word: ἱερὰ γράμματα
  choice: पवित्र लेखों
  rationale: यह यूनानी पद शब्दशः पवित्र या पूज्य लेखों को दर्शाता है। ‘पवित्र लेख’ मूल अभिव्यक्ति के निकट है और इन्हें बाद की तकनीकी संज्ञा मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: οἶδας
  choice: जानते आए हो
  rationale: οἶδα का रूप पूर्णकालिक है, पर अर्थ वर्तमान है। ‘शैशवकाल से’ के साथ ‘जानते आए हो’ अतीत से अब तक बने ज्ञान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: वे ... तुम्हें ... बुद्धिमान बना सकते हैं
  rationale: कृदंत ‘पवित्र लेखों’ को विशेषित करता है और σοφίζω का सीधा अर्थ किसी को बुद्धिमान बनाना या बुद्धि देना है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार पाने के लिए
  rationale: εἰς यहाँ लक्ष्य या परिणाम बताता है। यह हिन्दी प्रयोग उस लक्ष्यगत अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: πίστις का इस प्रसंग में सबसे स्वाभाविक अर्थ ‘विश्वास’ है और διά माध्यम को दर्शाता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को उसके उपाधिगत अर्थ में ‘मसीह’ अनूदित किया गया है, जबकि यीशु नाम है। ‘में’ यूनानी ἐν को बनाए रखता है और विश्वास के केंद्र को बताता है।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में या नाम-सदृश तत्व के रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट यीशु
  rationale: यहाँ Χριστός का ‘अभिषिक्त जन’ अर्थात मसीह वाला उपाधिगत अर्थ प्रासंगिक है; इसलिए केवल परंपरागत लिप्यंतरण के बजाय अर्थानुवाद रखा गया है।
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ में πίστεως का अर्थ
  choice: मसीह यीशु में विश्वास के द्वारा
  alternative: मसीह यीशु की विश्वासयोग्यता के द्वारा
  rationale: इस रचना में सबसे स्वाभाविक अर्थ मनुष्य का वह विश्वास है जिसका केंद्र मसीह यीशु हैं। फिर भी ‘मसीह यीशु की विश्वासयोग्यता’ की कम संभावित व्याख्या को टिप्पणी में सुरक्षित रखा गया है।
