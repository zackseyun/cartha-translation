  text: और यह भी कि तुम शैशवकाल से पवित्र लेखों[a] को जानते आए हो; वे मसीह यीशु में विश्वास के द्वारा तुम्हें उद्धार के लिए बुद्धिमान बना सकते हैं।
  philosophy: optimal-equivalence
