lexical_decisions:
- source_word: Τοῦτο
  choice: यह
  rationale: नपुंसकलिंग संकेतवाचक सर्वनाम आगे आने वाले ὅτι-वाक्य की विषयवस्तु की ओर संकेत करता है; हिन्दी में ‘यह’ स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले प्रसंग से हल्का विरोध या विचार-विकास दिखाता है। ‘पर’ इस मोड़ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना विरोध को अनावश्यक रूप से तीखा बनाए।
- source_word: γίνωσκε
  choice: जान लो
  rationale: यह वर्तमानकालीन कर्तृवाच्य आज्ञार्थक, द्वितीय पुरुष एकवचन है। ‘जान लो’ तीमुथियुस को सचेत रहने की सीधी आज्ञा को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: ':'
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे जानना है। ‘यह जान लो:’ के बाद विसर्ग-सदृश द्विबिंदु हिन्दी में इस सम्बन्ध को अधिक स्वाभाविक रूप से दिखाता है।
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: अन्तिम दिनों में
  rationale: यह स्थापित युगान्त-विषयक पदबंध है। अनुवाद इसके कालगत दायरे को किसी एक व्याख्या तक सीमित किए बिना मूल अभिव्यक्ति को बनाए रखता है।
- source_word: ἐνστήσονται
  choice: आएँगे
  rationale: ἐνίστημι का भविष्य मध्यम रूप यहाँ उपस्थित होने या आ पहुँचने का भाव देता है। समयों के साथ ‘आएँगे’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: καιροὶ
  choice: समय
  rationale: καιρός मात्र घड़ीगत समय नहीं, बल्कि अवधि या अवसर को सूचित करता है। इस वाक्य में ‘समय’ सबसे सहज व्यापक समतुल्य है।
- source_word: χαλεποί
  choice: कठिन
  rationale: χαλεπός कठिन, कष्टदायक, भयंकर या खतरनाक होने का भाव दे सकता है। ‘कठिन’ इसका व्यापक मूल अर्थ सहज आधुनिक हिन्दी में देता है; अन्य अर्थछायाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ‘अन्तिम दिनों’ का कालगत अर्थ
  choice: ‘अन्तिम दिनों’ पदबंध को बनाए रखना और उसे केवल मसीह की वापसी से ठीक पहले की अवधि तक सीमित न करना।
  alternative: इसे या तो अन्त से ठीक पहले की अंतिम अवधि, या नए नियम के व्यापक आरम्भ हो चुके युगान्तकाल के रूप में स्पष्ट करना।
  rationale: मूल पदबंध धर्मवैज्ञानिक रूप से अर्थगर्भित है और दोनों प्रकार की समझ की गुंजाइश रखता है। अनुवाद किसी विशिष्ट युगान्त-व्यवस्था को आरोपित किए बिना इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। एकवचन आज्ञा ‘जान लो’ मूल में तीमुथियुस को किए गए सीधे सम्बोधन को बनाए रखती है।
