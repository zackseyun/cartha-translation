source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: hi
  text: जिस प्रकार यन्नेस और यम्ब्रेस ने मूसा का विरोध किया था[a], उसी प्रकार ये पुरुष भी सत्य का विरोध करते हैं—ऐसे पुरुष जिनकी बुद्धि भ्रष्ट हो चुकी है और जो विश्वास के विषय में अयोग्य हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा के विरुद्ध खड़े हुए थे” … “सत्य के विरुद्ध खड़े होते हैं।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “विश्वास” से सम्भवतः मसीही विश्वास या प्रेरितों का सन्देश अभिप्रेत है, केवल व्यक्तिगत भरोसा नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον
  choice: जिस प्रकार
  rationale: यह तुलना आरम्भ करने वाला स्वाभाविक हिन्दी प्रयोग है और यूनानी पद की तुलनात्मक शक्ति बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यहाँ यह हल्के संक्रमण का सूचक है; हिन्दी में तुलना की रचना स्वयं प्रवाह स्पष्ट करती है, इसलिए ‘अब’ या प्रबल ‘परन्तु’ जोड़ना अनावश्यक होगा।
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: यन्नेस और यम्ब्रेस
  rationale: यूनानी नामों का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: विरोध किया था / विरोध करते हैं
  rationale: दोनों समान मूल के क्रियापद हैं; समान हिन्दी क्रिया भूतकालीन उदाहरण और वर्तमान निरन्तर विरोध का समानांतर बनाए रखती है।
- source_word: οὕτως καὶ οὗτοι
  choice: उसी प्रकार ये पुरुष भी
  rationale: पूर्ववर्ती तुलना से स्पष्ट संबंध रखता है और प्रसंगानुसार पुरुषवाचक संकेत को बनाए रखता है।
- source_word: τῇ ἀληθείᾳ
  choice: सत्य
  rationale: पौलुस के व्यापक पद को संकीर्ण व्याख्या के बिना रखा गया है।
- source_word: ἄνθρωποι
  choice: पुरुष
  rationale: व्याकरण और प्रसंग दोनों यहाँ पुरुष झूठे शिक्षकों की ओर संकेत करते हैं।
- source_word: κατεφθαρμένοι τὸν νοῦν
  choice: जिनकी बुद्धि भ्रष्ट हो चुकी है
  rationale: पूर्ण निष्क्रिय कृदन्त से प्राप्त स्थायी अवस्था व्यक्त होती है; ‘बुद्धि’ νοῦς के बौद्धिक और नैतिक आयाम को सहज हिन्दी में दर्शाती है।
- source_word: ἀδόκιμοι
  choice: खोटे ठहरे हैं
  rationale: यह जाँच में अस्वीकृत या अप्रमाणित पाए जाने का भाव व्यक्त करता है; ‘अयोग्य’ की तुलना में परीक्षण-संबंधी छवि अधिक सुरक्षित रहती है।
- source_word: περὶ τὴν πίστιν
  choice: विश्वास के विषय में
  rationale: περί के संदर्भ/क्षेत्र वाले अर्थ को बनाए रखता है और πίστις को व्यक्तिगत भरोसे अथवा मसीही विश्वास—दोनों संभावित अर्थों के लिए खुला छोड़ता है।
theological_decisions:
- issue: ‘सत्य’ और ‘विश्वास’ का संदर्भ
  choice: मुख्य पाठ में व्यापक पद ‘सत्य’ और ‘विश्वास’ रखे गए हैं।
  alternative: उन्हें स्पष्ट रूप से ‘सुसमाचार का सत्य’ और ‘मसीही धर्म-विश्वास’ कहना।
  rationale: प्रसंग में सम्भवतः प्रेरितीय सन्देश और मसीही विश्वास अभिप्रेत हैं, पर यूनानी पाठ स्वयं अधिक व्यापक है; अनुवाद उस अर्थगत तनाव को संकीर्ण नहीं करता।
- issue: ἄνθρωποι का लिंग
  choice: पुरुष
  alternative: लोग / व्यक्ति
  rationale: प्रसंग विशिष्ट पुरुष झूठे शिक्षकों की ओर संकेत करता है, इसलिए पुरुषवाचक रूप सुरक्षित रखा गया है।
- issue: ἀδόκιμοι का मूल्यांकनात्मक अर्थ
  choice: खोटे ठहरे हैं
  alternative: अयोग्य हैं / अस्वीकृत हैं
  rationale: यह चुनाव जाँच में प्रमाणित न होने के भाव को व्यक्त करता है, बिना यह तय किए कि किसने औपचारिक रूप से उन्हें अस्वीकार किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। लम्बे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है; तुलना और पुरुषों का वर्णन अर्थगत रूप से जुड़े रहते हैं।
