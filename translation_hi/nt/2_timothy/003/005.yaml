  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: hi
  text: वे भक्ति का बाहरी रूप[a] तो रखते हैं, पर उसकी सामर्थ्य को नकार चुके हैं। ऐसे लोगों से दूर रहो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाहरी रूप’ के स्थान पर ‘रूप’ या ‘भक्ति का बाह्य स्वरूप’ भी सम्भव है। यूनानी शब्द रूप, आकार या अभिव्यक्ति पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दूर रहो’ का अनुवाद ‘ऐसे लोगों से बचो’ या ‘उनसे मुँह मोड़ लो’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: रखते हैं
  rationale: यह वर्तमान कृदंत पिछले पदों में वर्णित लोगों का गुण बताता है; हिन्दी में मुख्य क्रिया के रूप में यह सहज है।
- source_word: μόρφωσιν
  choice: बाहरी रूप
  rationale: यह शब्द रूप, आकार या बाह्य अभिव्यक्ति का बोध करा सकता है। ‘बाहरी रूप’ वास्तविक सामर्थ्य के साथ विरोध को स्पष्ट रखते हुए अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: εὐσεβείας
  choice: भक्ति
  rationale: यहाँ अर्थ परमेश्वर के प्रति श्रद्धापूर्ण और उसके अनुरूप जीवन से है। ‘भक्ति’ आधुनिक हिन्दी में संक्षिप्त और सहज है, यद्यपि इसे केवल भावनात्मक उपासना तक सीमित नहीं समझना चाहिए।
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: पर उसकी सामर्थ्य
  rationale: सर्वनाम का संबंध भक्ति से बनाए रखा गया है और δύναμις की व्यापक प्रभावकारी शक्ति को किसी एक विशेष अभिव्यक्ति तक सीमित नहीं किया गया।
- source_word: ἠρνημένοι
  choice: नकार चुके हैं
  rationale: पूर्ण कृदंत पहले किए गए नकार के बने हुए परिणाम या स्थिर रुख को दर्शाता है; ‘नकार चुके हैं’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ τούτους ἀποτρέπου
  choice: ऐसे लोगों से दूर रहो
  rationale: मध्यवाच्य आज्ञार्थक क्रिया स्वयं को उनसे फेर लेने, बचने या अलग रहने का भाव देती है; ‘दूर रहो’ हिन्दी में स्पष्ट और स्वाभाविक आदेश है।
theological_decisions:
- issue: बाहरी धार्मिकता और उसकी वास्तविक सामर्थ्य के बीच विरोध
  choice: ‘भक्ति का बाहरी रूप’ और ‘उसकी सामर्थ्य’
  alternative: ‘भक्ति का रूप’ अथवा ‘भक्ति का दिखावा’
  rationale: अनुवाद बाह्य रूप और प्रभावकारी वास्तविकता के बीच विरोध बनाए रखता है, पर ‘सामर्थ्य’ को केवल चमत्कार, नैतिक परिवर्तन या पवित्र आत्मा की किसी एक विशिष्ट क्रिया तक सीमित नहीं करता। ‘दिखावा’ जानबूझकर छल करने का अतिरिक्त अर्थ जोड़ सकता है, इसलिए उसे मुख्य पाठ में नहीं चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नकार चुके हैं’ यूनानी पूर्णकालिक कृदंत के स्थायी परिणाम को व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
