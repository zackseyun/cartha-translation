  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: hi
  text: परन्तु दुष्ट लोग और ढोंगी[a] बद से बदतर होते चले जाएँगे[b]—वे दूसरों को भटकाएँगे और स्वयं भी भटकाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कपटी ठग’; यूनानी शब्द छलपूर्ण ढोंगियों के लिए प्रयुक्त हो सकता है और कुछ प्रसंगों में उसमें जादू-टोने या नीम-हकीमी की छाया भी होती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और भी बुरी दशा की ओर बढ़ेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: दुष्ट
  rationale: यह शब्द लोगों की नैतिक बुराई को व्यक्त करता है; केवल सामान्य खराबी बताने वाला ‘बुरे’ अपेक्षाकृत कम सटीक है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन के विपरीत स्थिति प्रस्तुत करता है, इसलिए विरोधसूचक संयोजक उपयुक्त है।
- source_word: ἄνθρωποι
  choice: लोग
  rationale: यूनानी बहुवचन यहाँ सामान्य रूप से मनुष्यों का उल्लेख करता है, केवल पुरुषों का नहीं।
- source_word: γόητες
  choice: ढोंगी
  rationale: यह कपटपूर्ण छल करने वालों का बोध कराता है। ‘ढोंगी’ धार्मिक या नैतिक कपट को स्वाभाविक हिन्दी में व्यक्त करता है, बिना जादू-टोने का अर्थ अनिवार्य बनाए।
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: बद से बदतर होते चले जाएँगे
  rationale: मूल में आगे बढ़ने की क्रिया का विडंबनापूर्ण प्रयोग और अधिक बुरी दशा की ओर गति के लिए हुआ है; यह हिन्दी मुहावरा दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: πλανῶντες
  choice: दूसरों को भटकाएँगे
  rationale: सक्रिय कृदन्त उनकी लगातार दूसरों को गलत राह पर ले जाने वाली गतिविधि बताता है; ‘दूसरों को’ हिन्दी में कर्म को स्पष्ट और स्वाभाविक बनाता है।
- source_word: πλανώμενοι
  choice: स्वयं भी भटकाए जाएँगे
  rationale: निष्क्रिय रूप को बनाए रखा गया है, जिससे स्पष्ट होता है कि छल करने वाले स्वयं भी किसी छल के अधीन हैं।
theological_decisions:
- issue: ἄνθρωποι के व्याकरणिक पुल्लिंग का अनुवाद
  choice: लोग
  alternative: पुरुष
  rationale: संदर्भ में अर्थ सामान्य मानव व्यक्तियों का है, केवल पुरुषों का नहीं; इसलिए ‘लोग’ स्रोत के आशय को ठीक व्यक्त करता है।
- issue: γόητες में निहित कपट अथवा जादू-टोने की छाया
  choice: ढोंगी
  alternative: जादूगर / ठग
  rationale: इस प्रसंग में छल और भटकाने पर बल है। ‘जादूगर’ संदर्भ से अधिक प्रबल तांत्रिक दावा जोड़ सकता है, जबकि ‘ढोंगी’ कपट को सुरक्षित रखता है।
- issue: πλανώμενοι की वाच्यता
  choice: भटकाए जाएँगे
  alternative: भटकते जाएँगे
  rationale: मूल का रूप निष्क्रिय है। उसे बनाए रखने से यह तनाव सुरक्षित रहता है कि दूसरों को भटकाने वाले स्वयं भी भटकाए जा रहे हैं; उनके भटकाव के कर्ता को पाठ स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परन्तु’ औपचारिक बाइबलीय प्रवाह बनाए रखता है; ‘बद से बदतर होते चले जाएँगे’ मूल की विडंबनापूर्ण प्रगति को स्वाभाविक हिन्दी में प्रस्तुत करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
