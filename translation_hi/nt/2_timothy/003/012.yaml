translation:
  language: hi
  text: और निश्चय ही, वे सभी जो मसीह यीशु में भक्तिपूर्वक जीना चाहते हैं, सताए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: और निश्चय ही
  rationale: दोनों संयोजकों के संदर्भगत संबंध और पुष्टिकारक बल को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ प्रबल विरोध नहीं है।
- source_word: πάντες οἱ θέλοντες
  choice: वे सब जो ... चाहते हैं
  rationale: संज्ञार्थक कृदंत की सार्वभौमिकता और इच्छार्थक भाव दोनों को स्पष्ट तथा सहज हिन्दी में बनाए रखता है।
- source_word: ζῆν εὐσεβῶς
  choice: भक्ति से जीवन बिताना
  rationale: εὐσεβῶς के परमेश्वर-अभिमुख श्रद्धापूर्ण आचरण को आधुनिक हिन्दी में व्यक्त करता है; केवल सामान्य नैतिकता तक अर्थ को सीमित नहीं करता।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν के संबंध/क्षेत्र के भाव को 'में' से सुरक्षित रखा गया है और Χριστός को सक्रिय उपाधि के रूप में 'मसीह' अनूदित किया गया है।
- source_word: διωχθήσονται
  choice: सताए जाएँगे
  rationale: भविष्यत् कर्मवाच्य और विरोधपूर्ण उत्पीड़न के अर्थ का सीधा, प्रचलित हिन्दी रूप।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में अनूदित करना या नाम-सदृश रूप रखना
  choice: मसीह यीशु
  alternative: क्राइस्ट यीशु / ख्रीष्ट यीशु
  rationale: इस पौलुसी पदबंध में उपाधिगत अर्थ स्पष्ट है; 'मसीह' हिन्दी में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है।
- issue: ἐν Χριστῷ Ἰησοῦ में ἐν का संबंध
  choice: मसीह यीशु में
  alternative: मसीह यीशु के साथ संबंध में
  rationale: '''में'' मूल की संक्षिप्तता और मसीह से संबंध/एकता की अर्थगत व्यापकता बचाता है, बिना किसी एक धर्मवैज्ञानिक व्याख्या तक इसे सीमित किए।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'भक्ति से जीवन बिताना' धार्मिक-नैतिक जीवन का भाव देता है, जबकि 'सताए जाएँगे' भविष्यत् कर्मवाच्य को स्वाभाविक हिन्दी में रखता है।
