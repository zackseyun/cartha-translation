source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: hi
  text: पर वे और आगे नहीं बढ़ेंगे[a], क्योंकि उनकी मूर्खता सबके सामने स्पष्ट हो जाएगी, जैसे उन लोगों की भी हुई थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे और अधिक प्रगति नहीं करेंगे।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात यन्नेस और यम्ब्रेस की मूर्खता, जिनका उल्लेख पिछली आयत में है।
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: आगे बढ़ेंगे
  rationale: προκόπτω का अर्थ आगे बढ़ना या प्रगति करना है। यहाँ यह झूठे शिक्षकों की गतिविधि के आगे बढ़ने को दर्शाता है, बिना उसे सकारात्मक उन्नति बताए।
- source_word: ἐπὶ πλεῖον
  choice: इससे आगे
  rationale: यह पदबंध ‘और आगे’ या ‘अधिक सीमा तक’ का अर्थ देता है; निषेध के साथ ‘इससे आगे नहीं’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἄνοια
  choice: मूर्खता
  rationale: ἄνοια समझ के अभाव और विवेकहीनता को सूचित करता है; ‘मूर्खता’ इसका स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
- source_word: ἔκδηλος
  choice: प्रकट
  rationale: ἔκδηλος का अर्थ स्पष्ट या जाहिर होना है; ‘प्रकट हो जाएगी’ भावी क्रिया ἔσται को भी सहज ढंग से व्यक्त करता है।
- source_word: πᾶσιν
  choice: सब पर
  rationale: कर्ता की मूर्खता लोगों के सामने स्पष्ट होने के अर्थ में ‘सब पर प्रकट’ हिन्दी का स्वाभाविक प्रयोग है और सार्वभौमिक दायरा बनाए रखता है।
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: जैसे उन लोगों की भी हुई थी
  rationale: यूनानी वाक्यांश में ‘मूर्खता’ अध्याहृत है और ἐκείνων पिछली आयत के व्यक्तियों की ओर संकेत करता है। हिन्दी में स्त्रीलिंग क्रिया ‘हुई थी’ ‘मूर्खता’ से संबंध स्पष्ट रखती है।
theological_decisions:
- issue: ἐκείνων का संदर्भ
  choice: ‘उन लोगों’ से पिछली आयत में उल्लिखित यन्नेस और यम्ब्रेस की ओर संकेत
  alternative: पूर्वकाल के विरोधियों या झूठे शिक्षकों की अधिक सामान्य ओर संकेत
  rationale: तात्कालिक प्रसंग 3:8 में यन्नेस और यम्ब्रेस का उल्लेख है। मुख्य पाठ में ‘उन लोगों’ मूल संकेतात्मक अस्पष्टता को बनाए रखता है, जबकि पादटिप्पणी निकटतम संदर्भ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल में बोधगम्य शैली अपनाई गई है। ‘पर’ ἀλλά के विरोध को संक्षेप में व्यक्त करता है। मुख्य पाठ में संकेतात्मक ‘उन लोगों’ रखकर मूल का संदर्भ-संबंध सुरक्षित रखा गया है।
