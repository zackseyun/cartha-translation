source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: hi
  text: क्योंकि इन्हीं लोगों में वे भी हैं जो चुपके से घरों में घुस जाते हैं और पापों से लदी हुई, तरह-तरह की अभिलाषाओं से संचालित दुर्बल स्त्रियों[a] को बंदी बना लेते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक रूप “छोटी स्त्रियाँ” है; यह तिरस्कारपूर्ण लघुरूप है और यहाँ शारीरिक आकार का संकेत नहीं देता।
    reason: lexical_alternative
  - marker: b
    text: अर्थात किसी को पकड़कर बंदी बना लेना; यूनानी क्रिया में युद्धबंदियों को पकड़ने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: इन्हीं लोगों में
  rationale: यह पदबंध पहले वर्णित लोगों के समूह में इन व्यक्तियों के शामिल होने का संकेत देता है; हिंदी में यह स्वाभाविक और संदर्भ-स्पष्ट है।
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: चुपके से घरों में घुस जाते हैं
  rationale: क्रिया चोरी-छिपे अथवा कपटपूर्वक प्रवेश करने का भाव रखती है। बहुवचन οἰκίας के लिए ‘घरों’ मूल के निकट और स्वाभाविक है।
- source_word: αἰχμαλωτίζοντες
  choice: बंदी बना लेते हैं
  rationale: यह शब्द युद्ध में किसी को पकड़कर बंदी बनाने की सशक्त छवि रखता है; हिंदी में यह रूप उस रूपक को सुरक्षित रखता है।
- source_word: γυναικάρια
  choice: दुर्बल स्त्रियों
  rationale: दुर्बलतासूचक और तिरस्कारपूर्ण लघुरूप यहाँ समस्त स्त्रियों के लिए नहीं, बल्कि आसानी से शिकार बननेवाली कुछ स्त्रियों के लिए प्रयुक्त है। ‘दुर्बल स्त्रियाँ’ प्रसंगगत आशय बताता है, जबकि टिप्पणी मूल की शाब्दिक बारीकी सुरक्षित रखती है।
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: पापों के बोझ से दबी
  rationale: पूर्ण निष्क्रिय कृदन्त संचित पापों से उत्पन्न बनी हुई दशा व्यक्त करता है; ‘बोझ से दबी’ भार और संचय, दोनों का स्वाभाविक संकेत देता है।
- source_word: ἀγόμενα
  choice: वश में चलनेवाली
  rationale: निष्क्रिय भाव बताता है कि वे अपनी विविध अभिलाषाओं से संचालित हो रही हैं; यह हिंदी में निरंतर प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιθυμίαις ποικίλαις
  choice: तरह-तरह की अभिलाषाओं
  rationale: ἐπιθυμία यहाँ नैतिक रूप से नकारात्मक इच्छाओं या लालसाओं को सूचित करता है; ‘अभिलाषाएँ’ व्यापकता बनाए रखता है और ποικίλαις को ‘तरह-तरह की’ स्पष्ट करता है।
theological_decisions:
- issue: γυναικάρια का तिरस्कारपूर्ण स्त्रीलिंग संदर्भ
  choice: ‘दुर्बल स्त्रियाँ’—एक विशेष, आसानी से शिकार बननेवाले समूह के रूप में
  alternative: ‘छोटी स्त्रियाँ’, ‘तुच्छ स्त्रियाँ’ या ‘भोली स्त्रियाँ’
  rationale: मूल शब्द का लघुरूप तिरस्कारपूर्ण है, पर शारीरिक आकार इसका आशय नहीं है। अनुवाद को इसकी नकारात्मक और संदर्भगत शक्ति बनाए रखनी चाहिए, बिना सभी स्त्रियों के बारे में सार्वभौमिक दावा किए।
- issue: αἰχμαλωτίζοντες की बंदी बनाने की छवि
  choice: बंदी बना लेते हैं
  alternative: अपने काबू में कर लेते हैं
  rationale: मूल की युद्ध/बंदी संबंधी रूपकात्मक शक्ति को नरम करके केवल प्रभाव या नियंत्रण में बदलना उचित नहीं; ‘बंदी’ उस तनाव को सुरक्षित रखता है।
- issue: οἰκίας का अर्थ-क्षेत्र
  choice: घरों
  alternative: घरानों में
  rationale: मूल का सामान्य अर्थ घरों में प्रवेश करना है। सामाजिक प्रभाव का आशय संदर्भ से निकलता है, पर अनुवाद में ‘घरानों’ द्वारा उसे अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘चुपके से…घुस जाते हैं’ कपटपूर्ण प्रवेश को स्पष्ट करता है; ‘बंदी बना लेते हैं’ मूल रूपक की तीव्रता बनाए रखता है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
