source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: hi
  text: मेरे सतावों और दुखों को भी—जैसे अन्ताकिया, इकुनियुम और लुस्त्रा में मेरे साथ हुए थे—और यह भी कि मैंने कैसे-कैसे सताव सहे[a]; और प्रभु ने उन सब से मुझे छुड़ाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने किस प्रकार के सताव सहे।”
    reason: οἵους की गुणात्मक अभिव्यक्ति का अधिक शाब्दिक विकल्प।
  - marker: b
    text: यहाँ “प्रभु” से सम्भवतः प्रभु यीशु अभिप्रेत हैं, यद्यपि यूनानी पाठ में केवल “प्रभु” है।
    reason: उपाधि के सम्भावित संदर्भ को बताते हुए मूल पाठ की अनिर्दिष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: सतावों / सताव
  rationale: यह शब्द विश्वास और सेवा के कारण किए गए विरोध और उत्पीड़न को दर्शाता है। ‘सताव’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और दोनों occurrences को एक ही शब्द से जोड़ता है।
- source_word: παθήμασιν
  choice: दुखों
  rationale: यह शब्द व्यापक रूप से दुःखद अनुभवों को दर्शाता है; ‘दुखों’ इसे केवल बाहरी कष्टों तक सीमित नहीं करता।
- source_word: οἷά μοι ἐγένετο
  choice: जैसे ... मेरे साथ हुए
  rationale: यह पहले बताए गए सतावों और दुखों के उदाहरण प्रस्तुत करता है तथा यूनानी वाक्यांश की exemplifying force बनाए रखता है।
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: अन्ताकिया, इकुनियुम और लुस्त्रा में
  rationale: स्थान-नाम प्रचलित हिन्दी बाइबल वर्तनी में लिप्यंतरित किए गए हैं। हिन्दी में सहज प्रवाह के लिए परसर्ग ‘में’ समूह के अंत में रखा गया है।
- source_word: οἵους διωγμοὺς
  choice: कैसे-कैसे सताव
  rationale: दोहराया ‘कैसे-कैसे’ गुणात्मक और विस्मयात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना सतावों की कोई अतिरिक्त श्रेणी तय किए।
- source_word: ὑπήνεγκα
  choice: मैंने ... सहे
  rationale: ‘सहे’ दबाव के अधीन टिककर कष्ट उठाने का अर्थ संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: ἐκ πάντων
  choice: उन सब से
  rationale: यह पीछे बताए गए सभी सतावों और दुखों की ओर संकेत करता है तथा उनसे छुड़ाए जाने का भाव बनाए रखता है।
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: यह खतरे से बचाने या निकालने का अर्थ देता है और यहाँ अनावश्यक रूप से व्यापक उद्धारशास्त्रीय अर्थ नहीं जोड़ता।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यूनानी में केवल उपाधि है; ‘प्रभु’ उसका स्थापित और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’
  rationale: पौलुस के प्रयोग और निकट संदर्भ में सम्भवतः यीशु अभिप्रेत हैं, पर यूनानी पाठ में नाम नहीं है; इसलिए अनुवाद स्रोत की अनिर्दिष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भिक पदांश पिछले पद के क्रियात्मक ढाँचे से जुड़ा होने के कारण ‘मेरे ... को भी’ रखा गया है। ‘फिर भी’ यूनानी καί के प्रसंगगत विरोधी परिणाम को हिन्दी में स्पष्ट करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
