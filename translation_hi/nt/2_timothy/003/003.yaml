lexical_decisions:
- source_word: ἄστοργοι
  choice: स्वाभाविक स्नेह से रहित
  rationale: यह शब्द उस सहज स्नेह के अभाव को दर्शाता है जिसकी विशेष रूप से परिवार और निकट संबंधों में अपेक्षा होती है। यह व्यापक ‘प्रेमहीन’ की तुलना में मूल अर्थ को अधिक स्पष्ट रखता है।
- source_word: ἄσπονδοι
  choice: मेल-मिलाप न करनेवाले
  rationale: यह उन लोगों को दर्शाता है जो शांति या समझौता करने को तैयार नहीं होते। यह सामान्य आधुनिक हिन्दी में ‘irreconcilable/implacable’ का भाव व्यक्त करता है, बिना यह अनिवार्य मान लिए कि उन्होंने पहले से हुई संधि तोड़ी है।
- source_word: διάβολοι
  choice: बदनामी करनेवाले
  rationale: इस बहुवचन दुर्गुण-सूची में शब्द का अर्थ झूठे या दुर्भावनापूर्ण आरोप लगाकर बदनाम करनेवाले लोग है; यहाँ यह ‘शैतान’ के लिए उपाधि नहीं है।
- source_word: ἀκρατεῖς
  choice: असंयमी
  rationale: यह अपनी इच्छाओं और आवेगों पर नियंत्रण न रखने का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἀνήμεροι
  choice: क्रूर
  rationale: मूल शब्द असभ्य, अदम्य या हिंस्र कठोरता का भाव रखता है। ‘क्रूर’ आधुनिक हिन्दी में इस नैतिक दुर्गुण को स्पष्टता से व्यक्त करता है।
- source_word: ἀφιλάγαθοι
  choice: भलाई से प्रेम न रखनेवाले
  rationale: यौगिक शब्द का मूल भाव ‘जो भलाई से प्रेम नहीं रखते’ है। यह अभावसूचक अर्थ को बचाता है और उसे अनावश्यक रूप से सक्रिय घृणा में नहीं बदलता।
theological_decisions:
- issue: दुर्गुण-सूची में διάβολοι का अर्थ
  choice: बदनामी करनेवाले लोगों के अर्थ में सामान्य नैतिक वर्णन
  alternative: शैतान-सदृश या शैतान
  rationale: बहुवचन रूप और आसपास के नैतिक विशेषण संकेत करते हैं कि यहाँ व्यवहार का वर्णन है, किसी दुष्ट आत्मिक सत्ता या शैतान की उपाधि का नहीं।
- issue: ἀφιλάγαθοι की अभावसूचक या सक्रिय-विरोधी शक्ति
  choice: भलाई से प्रेम न रखनेवाले
  alternative: भलाई से घृणा करनेवाले
  rationale: मूल यौगिक सीधे भलाई के प्रति प्रेम के अभाव को व्यक्त करता है। सक्रिय घृणा संभव व्याख्यात्मक विस्तार है, पर मुख्य पाठ में उससे अधिक प्रबल अर्थ थोपना उचित नहीं।
