  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: hi
  text: पवित्रशास्त्र का हर लेख[a] परमेश्वर की श्वास से उत्पन्न है और शिक्षा देने, दोष दिखाने, सुधारने और धार्मिकता[c] में प्रशिक्षण देने के लिए उपयोगी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारा पवित्रशास्त्र।” यूनानी पद πᾶσα γραφή का अर्थ वितरणात्मक रूप से “पवित्रशास्त्र का हर लेख” या सामूहिक रूप से “सारा पवित्रशास्त्र” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “परमेश्वर की श्वास से उत्पन्न पवित्रशास्त्र का हर लेख शिक्षा देने, दोष दिखाने, सुधारने और धार्मिकता में प्रशिक्षण देने के लिए उपयोगी भी है।”
    reason: alternative_reading
  - marker: c
    text: कुछ पौलुसी प्रसंगों में “धार्मिकता” का अनुवाद “न्याय” भी हो सकता है; यहाँ भाव खरे और सही जीवन के लिए नैतिक गठन का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: पवित्रशास्त्र का प्रत्येक लेख
  rationale: अनुच्छेद सहित ‘प्रत्येक लेख’ यूनानी पद के वितरणात्मक रूप को स्वाभाविक हिन्दी में व्यक्त करता है। प्रसंग (पद 15–17) में γραφή किसी भी लेख के बजाय पवित्र लेखों को सूचित करता है; सामूहिक अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: θεόπνευστος
  choice: परमेश्वर की श्वास से उत्पन्न
  rationale: यह यूनानी संयुक्त विशेषण का पारदर्शी अर्थ देता है और ‘प्रेरित’ शब्द से जुड़ी बाद की विस्तृत धर्मवैज्ञानिक धारणाएँ मूल पाठ में नहीं जोड़ता।
- source_word: ὠφέλιμος
  choice: उपयोगी
  rationale: यह लाभदायक और किसी उद्देश्य के काम आने का अर्थ सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: πρὸς διδασκαλίαν
  choice: शिक्षा देने के लिए
  rationale: यहाँ διδασκαλία शिक्षा देने की क्रिया और विषयवस्तु दोनों को समेट सकता है; यह अनुवाद केवल औपचारिक ‘सिद्धान्त’ तक अर्थ को सीमित नहीं करता।
- source_word: ἐλεγμόν
  choice: दोष दिखाने के लिए
  rationale: यह भूल या दोष को उजागर करने का अर्थ देता है और केवल व्यक्तिगत डाँट तक सीमित नहीं है।
- source_word: ἐπανόρθωσιν
  choice: सुधारने के लिए
  rationale: यह किसी गलत बात को फिर सही करने या सीधा करने का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: धार्मिकता में प्रशिक्षण देने के लिए
  rationale: παιδεία के गठनकारी प्रशिक्षण और अनुशासन के भाव को ‘प्रशिक्षण’ व्यक्त करता है; δικαιοσύνη के लिए प्रसंगानुकूल पारंपरिक पद ‘धार्मिकता’ रखा गया है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यहाँ अर्थ न्यायिक व्यवस्था की अपेक्षा सही और खरे जीवन में गठन से अधिक संबंधित है; सम्भव वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: θεόπνευστος और ὠφέλιμος का πᾶσα γραφή से वाक्यगत सम्बन्ध
  choice: 'दोनों विशेषण विधेय माने गए हैं: ‘पवित्रशास्त्र का प्रत्येक लेख परमेश्वर की श्वास से उत्पन्न है और ... उपयोगी है।’'
  alternative: ‘परमेश्वर की श्वास से उत्पन्न पवित्रशास्त्र का प्रत्येक लेख ... उपयोगी भी है।’
  rationale: दोनों विशेषणों को समानान्तर विधेय मानना अगले पद तक जाते विचार-प्रवाह में अधिक स्वाभाविक है। विशेषणात्मक वैकल्पिक रचना यूनानी व्याकरण में सम्भव है, इसलिए वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पवित्रशास्त्र’, ‘परमेश्वर’ और ‘धार्मिकता’ जैसे परिचित बाइबलीय पद बनाए रखते हुए वाक्यरचना सहज हिन्दी में दी गई है।
