lexical_decisions:
- source_word: προδόται
  choice: विश्वासघाती
  rationale: यह शब्द धोखा देने और निष्ठा तोड़ने वाले व्यक्ति को दर्शाता है। ‘विश्वासघाती’ आधुनिक हिन्दी में स्वाभाविक है और इस दुर्गुण-सूची में अपेक्षित नैतिक गंभीरता बनाए रखता है।
- source_word: προπετεῖς
  choice: उतावले
  rationale: यह बिना सोचे आगे बढ़ने, जल्दबाज़ी और अविवेकपूर्ण दुस्साहस का भाव देता है। ‘उतावले’ संक्षिप्त और सामान्य हिन्दी है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: τετυφωμένοι
  choice: घमण्ड से फूले हुए
  rationale: यह τυφόομαι का पूर्ण निष्क्रिय कृदन्त है। यह चुनाव मूल रूपक तथा घमण्डी/दंभी होने का आशय दोनों बनाए रखता है।
- source_word: φιλήδονοι
  choice: सुख-विलास से प्रेम करने वाले
  rationale: यह यौगिक शब्द सुख या भोग से प्रेम करने वालों को दर्शाता है। ‘सुख-विलास’ यहाँ अनैतिकता का अनावश्यक विशिष्ट आरोप लगाए बिना आत्मतुष्टि और भोगप्रियता का भाव व्यक्त करता है।
- source_word: μᾶλλον ἢ
  choice: के बजाय
  rationale: इस तुलना में प्राथमिकता और विरोध दोनों व्यक्त होते हैं। ‘के बजाय’ हिन्दी में स्वाभाविक ढंग से गलत प्रेम-वरीयता को स्पष्ट करता है।
- source_word: φιλόθεοι
  choice: परमेश्वर से प्रेम करने वाले
  rationale: यह यौगिक शब्द परमेश्वर से प्रेम करने वालों को दर्शाता है। यह रूप φιλήδονοι के साथ मूल पाठ का समानान्तर विरोध सुरक्षित रखता है।
theological_decisions:
- issue: दुर्गुण-सूची के समानान्तर प्रेम-संबंधी पदों और घमण्ड के रूपक को बिना अतिरिक्त धर्मसैद्धान्तिक अर्थ जोड़े प्रस्तुत करना
  choice: ‘परमेश्वर से प्रेम करने के बजाय सुख-विलास से प्रेम करने वाले’ और ‘घमण्ड से फूले हुए’
  alternative: ‘परमेश्वर-प्रेमी नहीं, बल्कि भोग-विलासी’ तथा ‘दंभी’
  rationale: चुना हुआ पाठ दोनों यौगिक विशेषणों की संरचनात्मक समानता और मूल के रूपक को बनाए रखता है। यह नैतिक विरोध को स्पष्ट करता है, पर किसी विशेष पंथीय व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण दुर्गुण-सूची वाला विन्यास अपनाया गया है। भविष्यकाल ‘होंगे’ पिछले पद से वाक्यगत रूप से जुड़ने के कारण जोड़ा गया है। ‘परमेश्वर’ सामान्य बाइबलीय हिन्दी के अनुरूप है; भाषा किसी संप्रदाय-विशेष की शब्दावली पर निर्भर नहीं है।
