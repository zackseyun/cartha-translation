source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: hi
  text: परन्तु तुमने मेरी शिक्षा, चालचलन, उद्देश्य, विश्वास[a], सहनशीलता, प्रेम और धीरज का ध्यानपूर्वक अनुसरण किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता।’ यहाँ यूनानी शब्द का अर्थ ‘विश्वास’ या ‘विश्वासयोग्यता’, दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: परन्तु तुमने
  rationale: δέ पिछले वर्णन के साथ विरोध प्रकट करता है और emphatic Σὺ को स्पष्ट ‘तुम’ से रखा गया है।
- source_word: παρηκολούθησάς
  choice: निकटता से अनुसरण किया है
  rationale: यह क्रिया ध्यानपूर्वक जानने और जीवन में अनुसरण करने—दोनों भाव समेट सकती है; यह हिन्दी अभिव्यक्ति उस व्यापकता को बनाए रखती है।
- source_word: μου
  choice: मेरी
  rationale: सम्बन्धकारक सर्वनाम को सूची की पहली संज्ञा के साथ स्वाभाविक हिन्दी में रखा गया है और उसका आशय पूरी सूची पर लागू होता है।
- source_word: διδασκαλίᾳ
  choice: शिक्षा
  rationale: यह आधुनिक, सहज शब्द है और अनावश्यक रूप से तकनीकी ‘सिद्धान्त’ से बचता है।
- source_word: ἀγωγῇ
  choice: चालचलन
  rationale: यह व्यक्ति के व्यवहार और जीवन-रीति का संक्षिप्त, स्वाभाविक हिन्दी रूप है।
- source_word: προθέσει
  choice: उद्देश्य
  rationale: यह पौलुस के स्थिर लक्ष्य या अभिप्राय को स्पष्ट रूप से व्यक्त करता है।
- source_word: πίστει
  choice: विश्वास
  rationale: πίστις का सामान्य हिन्दी प्रतिरूप ‘विश्वास’ है; इस गुण-सूची में ‘विश्वासयोग्यता’ भी सम्भव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: μακροθυμίᾳ
  choice: धीरज
  rationale: यह विशेषतः लोगों या उकसावे के प्रति दीर्घकालीन सहनशीलता का सहज हिन्दी रूप है।
- source_word: ἀγάπῃ
  choice: प्रेम
  rationale: ἀγάπη का सीधा, प्रचलित और गरिमापूर्ण हिन्दी प्रतिरूप है।
- source_word: ὑπομονῇ
  choice: दृढ़ता
  rationale: यह कठिनाई के अधीन टिके रहने का भाव देता है और μακροθυμία के लिए प्रयुक्त ‘धीरज’ से आवश्यक भेद बनाए रखता है।
theological_decisions:
- issue: पौलुसी गुण-सूची में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: इस प्रसंग में परमेश्वर पर विश्वास और विश्वसनीय चरित्र, दोनों अर्थ सम्भव हैं। मुख्य पाठ सामान्य प्रतिरूप रखता है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। सूची की लय बनाए रखते हुए μακροθυμία और ὑπομονή को क्रमशः ‘धीरज’ और ‘दृढ़ता’ से अलग किया गया है।
