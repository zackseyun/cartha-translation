source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: hi
  text: प्रभु उसे यह कृपा दे कि उस दिन वह प्रभु से दया पाए[a][b]—और इफिसुस में उसने जितनी सेवा की, उसे तुम बेहतर जानते हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के पास दया पाए।” यूनानी पदबंध को दया के स्रोत अथवा प्रभु की उपस्थिति के संकेत के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उस दिन” नए नियम में आने वाले ईश्वरीय न्याय या निर्दोष ठहराए जाने के दिन का प्रचलित संकेत है।
    reason: cross_reference
  - marker: c
    text: शाब्दिक रूप से, “बेहतर जानते हो।” तुलना का दूसरा पक्ष यूनानी में स्पष्ट नहीं किया गया है। इसे “तुम बहुत अच्छी तरह जानते हो” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: प्रभु उसे यह प्रदान करे
  rationale: अओरिस्ट ऑप्टेटिव प्रार्थना या अभिलाषा व्यक्त करता है। ‘प्रदान करे’ हिन्दी में गरिमापूर्ण और स्वाभाविक है; ‘यह’ अगले infinitive वाक्यांश को सहजता से जोड़ता है।
- source_word: εὑρεῖν ἔλεος
  choice: दया पाए
  rationale: यूनानी मुहावरे ‘दया पाना/प्राप्त करना’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ κυρίου
  choice: प्रभु से
  rationale: Genitive के साथ παρά यहाँ स्रोत को सूचित करना सबसे स्वाभाविक है। κύριος की पुनरावृत्ति बनाए रखी गई है।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: समय-सूचक पदबंध का स्वाभाविक हिन्दी रूप; अंतकालीन संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ὅσα ... διηκόνησεν
  choice: उसने जितनी सेवा की
  rationale: ὅσα सेवा की सीमा या व्यापकता को समेटता है। ‘जितनी सेवा की’ आधुनिक हिन्दी में स्पष्ट है और διακονέω को सामान्य, गैर-सांप्रदायिक अर्थ में रखता है।
- source_word: ἐν Ἐφέσῳ
  choice: इफिसुस में
  rationale: स्थान-सूचक पदबंध का मानक हिन्दी रूप।
- source_word: βέλτιον σὺ γινώσκεις
  choice: उसे तुम मुझसे बेहतर जानते हो
  rationale: βέλτιον का तुलनात्मक बल स्पष्ट करता है। यूनानी में तुलना का दूसरा पद अव्यक्त है; संदर्भ में वक्ता से तुलना सबसे स्वाभाविक है, पर इसे पाठ में स्पष्ट करने के कारण पादटिप्पणी दी गई है।
theological_decisions:
- issue: दो बार आए κύριος का संदर्भ
  choice: दोनों बार ‘प्रभु’ रखा गया है और व्यक्तियों का भेद निर्दिष्ट नहीं किया गया।
  alternative: पहला ‘प्रभु’ मसीह और दूसरा पिता; अथवा दोनों मसीह के लिए।
  rationale: यूनानी पाठ दोनों स्थानों पर κύριος कहता है और स्वयं स्पष्ट भेद नहीं करता; अनुवाद इस धर्मवैज्ञानिक अस्पष्टता को बनाए रखता है।
- issue: ‘उस दिन’ का अंतकालीन आशय
  choice: केवल ‘उस दिन’
  alternative: न्याय का दिन; अंतिम दिन
  rationale: वाक्यांश संभवतः आने वाले ईश्वरीय न्याय या निर्दोष ठहराए जाने के दिन की ओर संकेत करता है, पर मूल पाठ उसका विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘सेवा’ को ‘सेवकाई’ पर प्राथमिकता दी गई है ताकि सांप्रदायिक या तकनीकी रंग न आए। ‘प्रभु’ की पुनरावृत्ति और ‘उस दिन’ की संक्षिप्तता मूल पाठ के धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
