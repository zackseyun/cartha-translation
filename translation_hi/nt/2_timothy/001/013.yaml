source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: hi
  text: तुमने मुझसे जो खरे वचन सुने हैं, उनके नमूने को मसीह यीशु में पाए जाने वाले विश्वास[a] और प्रेम में थामे रहो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता और प्रेम।” यूनानी शब्द का अर्थ संदर्भ के अनुसार “विश्वास,” “भरोसा” या “विश्वासयोग्यता” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या इस अंश का अर्थ हो सकता है: “मसीह यीशु में विश्वास और प्रेम के विषय में तुमने मुझसे जो खरे वचन सुने हैं, उनके नमूने को थामे रहो।” यूनानी वाक्य-रचना में “विश्वास और प्रेम” या तो नमूने को थामे रहने के ढंग को बता सकते हैं या सुने हुए वचनों के विषय को।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: नमूने
  rationale: यह शब्द किसी ऐसी रूपरेखा, प्रतिरूप या नमूने को दर्शाता है जिसका अनुसरण किया जाए। “नमूना” अर्थ को अनावश्यक रूप से केवल नियम या शिक्षा तक सीमित नहीं करता।
- source_word: ἔχε
  choice: थामे रहो
  rationale: शाब्दिक अर्थ “रखो/अपने पास रखो” है, पर आज्ञार्थक प्रयोग यहाँ दृढ़ता से बनाए रखने और उससे जुड़े रहने का भाव देता है।
- source_word: ὑγιαινόντων λόγων
  choice: खरे वचन
  rationale: ὑγιαίνω का मूल चित्र स्वस्थ होने का है और यहाँ रूपकतः सही तथा दोषरहित होने का भाव है। “खरे” इस रूपक का स्वाभाविक हिन्दी रूप है, जबकि “वचन” λόγων को सामान्य “शिक्षा” में विलीन नहीं करता।
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: तुमने मुझसे जो … सुने हैं
  rationale: παρά के साथ संबंधकारक यहाँ स्रोत, अर्थात “मुझसे,” बताता है; संबंधवाचक उपवाक्य स्वाभाविक रूप से “वचन” को विशेषित करता है।
- source_word: ἐν πίστει
  choice: उस विश्वास … में
  rationale: πίστις का प्राथमिक रूप “विश्वास” रखा गया है और ἐν को उस क्षेत्र या ढंग के रूप में व्यक्त किया गया है जिसमें तीमुथियुस को नमूना थामे रहना है। “विश्वासयोग्यता” की संभव भावना पादटिप्पणी में दी गई है।
- source_word: καὶ ἀγάπῃ
  choice: और प्रेम
  rationale: ἀγάπη का सीधा और स्वाभाविक हिन्दी प्रतिशब्द “प्रेम” है।
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: जो मसीह यीशु में हैं
  rationale: सव्यय पद को विश्वास और प्रेम की संयुक्त जोड़ी से जोड़ा गया है। हिन्दी में बहुवचन “हैं” दोनों संज्ञाओं को सामूहिक रूप से विशेषित करता है।
- source_word: Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि का अर्थ बनाए रखता है। हिन्दी “मसीह” उस अभिषिक्त जन की मसीहाई उपाधि को स्वाभाविक और प्रचलित ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: मुख्य पाठ में यह पद तीमुथियुस के नमूने को थामे रहने का क्षेत्र या ढंग बताता है—मसीह यीशु में पाए जाने वाले विश्वास और प्रेम में।
  alternative: यह पद सुने हुए खरे वचनों का विषय बता सकता है—मसीह यीशु में विश्वास और प्रेम के विषय में वचन।
  rationale: उपदेशात्मक प्रवाह पहले अर्थ के अनुकूल है, किंतु यूनानी वाक्य-रचना दूसरे संबंध की भी अनुमति देती है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: यहाँ “विश्वास” सबसे सहज और व्यापक अर्थ है, पर शब्द में निष्ठा अथवा विश्वासयोग्यता का भाव भी संभव है; उस संभावना को पादटिप्पणी में रखा गया है।
- issue: Χριστός का रूपांतरण
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: यहाँ शब्द उपाधि है। “मसीह” आधुनिक हिन्दी के बाइबिलीय प्रयोग में अर्थपूर्ण और परिचित है तथा किसी अलग सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। “खरे वचन,” “नमूना,” और “थामे रहो” मूल के शब्द-चित्रों को यथासंभव बनाए रखते हैं। हिन्दी में “मसीह” ही Χριστός की उपाधिगत भावना को स्वाभाविक रूप से व्यक्त करता है, इसलिए अंग्रेज़ी के ‘Messiah/Christ’ भेद जैसी अलग पादटिप्पणी आवश्यक नहीं मानी गई।
