  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने हमें कायरता[a] की आत्मा नहीं, बल्कि सामर्थ्य, प्रेम और संयम[b] की आत्मा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भीरुता’ अथवा ‘भयभीत स्वभाव’; यूनानी शब्द सामान्य भय के बजाय कायरतापूर्ण भय का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्वस्थ विवेक’ अथवा ‘अनुशासन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले पद के प्रोत्साहन का कारण बताता है; इसलिए ‘क्योंकि’ स्वाभाविक रूप से संबंध स्पष्ट करता है, और οὐ का निषेध ‘नहीं’ से व्यक्त होता है।
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: परमेश्वर ने हमें ... दी
  rationale: यूनानी अओरिस्ट को सरल भूतकाल में रखा गया है; ἡμῖν का स्वाभाविक हिन्दी रूप ‘हमें’ है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: ‘आत्मा’ मूल शब्द की व्यापकता बनाए रखता है और इसे केवल मनोभाव या केवल पवित्र आत्मा के अर्थ में सीमित नहीं करता। हिन्दी वाक्य-विन्यास में इसे अंत में रखकर सभी संबंधकारक संज्ञाओं—कायरता, सामर्थ्य, प्रेम और संयम—से जोड़ा गया है।
- source_word: δειλίας
  choice: कायरता
  rationale: यह शब्द सामान्य भय से अधिक निंदनीय भयभीतता या साहस की कमी को व्यक्त करता है; ‘कायरता’ उस प्रबल नकारात्मक अर्थ को सुरक्षित रखता है।
- source_word: δυνάμεως
  choice: सामर्थ्य
  rationale: ‘सामर्थ्य’ शक्ति और सक्षम होने, दोनों भावों को गरिमापूर्ण तथा सहज हिन्दी में व्यक्त करता है।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: आधुनिक हिन्दी में ἀγάπη का सीधा, स्वाभाविक और व्यापक समतुल्य ‘प्रेम’ है।
- source_word: σωφρονισμοῦ
  choice: संयम
  rationale: यह दुर्लभ शब्द आत्म-नियंत्रण, अनुशासन और स्वस्थ विवेक के अर्थ-क्षेत्र को समेटता है। मुख्य पाठ में ‘संयम’ संक्षिप्त और सहज है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: πνεῦμα का अभिप्राय
  choice: ‘आत्मा’—बिना यह निश्चित किए कि यहाँ केवल मनोभाव है या पवित्र आत्मा का सीधा उल्लेख
  alternative: ‘मनोभाव’ अथवा ‘पवित्र आत्मा’
  rationale: अनुच्छेदरहित πνεῦμα और उसके साथ जुड़े संबंधकारक शब्द गुण या प्रवृत्ति का संकेत दे सकते हैं, पर ‘मनोभाव’ कहना अर्थ को आवश्यकता से अधिक सीमित करेगा। दूसरी ओर ‘पवित्र आत्मा’ मूल पाठ से अधिक स्पष्टता जोड़ देगा। ‘आत्मा’ वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। वाक्य-विन्यास में ‘आत्मा’ को अंत में रखने से यूनानी के समान एक ही संज्ञा विरोधी दोनों पक्षों से जुड़ती है और अनावश्यक पुनरुक्ति से बचा जाता है।
