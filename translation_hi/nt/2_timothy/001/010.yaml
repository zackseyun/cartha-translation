source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: hi
  text: पर अब वह हमारे उद्धारकर्ता यीशु मसीह[a] के प्रकट होने के द्वारा प्रकट हुई है, जिन्होंने मृत्यु को निष्प्रभावी कर दिया और सुसमाचार के द्वारा जीवन और अविनश्वरता[b] को प्रकाश में लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त।” यूनानी Χριστός उपाधि (“मसीह”) या नाम-सदृश संबोधन (“ख्रीस्त”) के रूप में प्रयुक्त हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “अमरता।” यूनानी शब्द नाश या क्षय से मुक्त होने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: प्रकट हुई है
  rationale: यह पिछले पद में वर्णित परमेश्वर के अनुग्रह की ओर संकेत करने वाला कर्मवाच्य कृदंत है; हिन्दी में स्वाभाविक संबंध के लिए इसे सीमित क्रिया के रूप में रखा गया है।
- source_word: ἐπιφανείας
  choice: प्रकट होने
  rationale: यह यीशु के दृश्यमान ऐतिहासिक आगमन को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σωτῆρος
  choice: उद्धारकर्ता
  rationale: मसीही उपाधि के रूप में स्थापित और अर्थसंगत हिन्दी रूप।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός यहाँ नाम-उपाधि क्रम में है; हिन्दी में ‘मसीह’ उपाधि का अर्थ बनाए रखते हुए स्वाभाविक रूप से नाम के साथ आता है।
- source_word: καταργήσαντος
  choice: निष्प्रभावी कर दिया
  rationale: यह मृत्यु की निर्णायक पराजय व्यक्त करता है, पर ऐसा नहीं कहता कि वर्तमान में मृत्यु का अस्तित्व पूरी तरह समाप्त हो चुका है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल शब्द का सीधा और प्रसंगानुकूल रूप।
- source_word: φωτίσαντος
  choice: प्रकाश में लाया
  rationale: प्रकट या ज्ञात कर देने के भाव को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है।
- source_word: ζωὴν
  choice: जीवन
  rationale: मूल शब्द का मानक रूप, जिसमें प्रसंग का उद्धार और भावी युग संबंधी भार बना रहता है।
- source_word: ἀφθαρσίαν
  choice: अविनाशिता
  rationale: नाश, क्षय या भ्रष्टता से मुक्त होने के अर्थ को ‘अमरता’ की अपेक्षा अधिक निकटता से व्यक्त करता है।
- source_word: διὰ τοῦ εὐαγγελίου
  choice: सुसमाचार के द्वारा
  rationale: διά के साधनात्मक अर्थ को सुरक्षित रखते हुए εὐαγγέλιον का परिचित हिन्दी रूप दिया गया है।
- source_word: μὲν ... δὲ
  choice: मृत्यु को निष्प्रभावी कर दिया और ... प्रकाश में लाया
  rationale: दोनों पूरक कार्यों का संतुलन हिन्दी में अनावश्यक कठोरता के बिना समानांतर क्रियाओं द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का रूप
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: ‘मसीह’ Χριστός की उपाधिगत शक्ति को हिन्दी में स्पष्ट रखता है; नाम-सदृश पारंपरिक रूप को पादटिप्पणी में दिया गया है।
- issue: मृत्यु के संबंध में καταργήσαντος का बल
  choice: मृत्यु को निष्प्रभावी कर दिया
  alternative: मृत्यु का अंत कर दिया
  rationale: चुना हुआ रूप मसीह की निर्णायक विजय को व्यक्त करता है, पर मृत्यु के वर्तमान अनुभव और अंतिम उन्मूलन के बीच की धर्मवैज्ञानिक खिंचाव को समय से पहले हल नहीं करता।
- issue: ἀφθαρσίαν का अर्थ
  choice: अविनाशिता
  alternative: अमरता
  rationale: यह शब्द मुख्यतः क्षय और विनाश से मुक्त दशा पर बल देता है; अधिक परिचित वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। पिछले पद से संबंध बनाए रखने के लिए आरंभ में ‘पर अब वह’ रखा गया है। एक अत्यधिक लंबा वाक्य टालने हेतु यूनानी कृदंतीय संरचना को दो हिन्दी वाक्यों में व्यक्त किया गया है।
