source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: hi
  text: तुम यह जानते हो कि आसिया[a] में रहनेवाले सभी लोगों ने मुझसे मुँह मोड़ लिया है[b], जिनमें फूगेलुस और हर्मोजेनेस हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आसिया” से आशय पश्चिमी एशिया माइनर के रोमी प्रान्त से है, आधुनिक एशिया महाद्वीप से नहीं।
    reason: cultural_note
  - marker: b
    text: या “मुझे छोड़ दिया है” या “मुझे त्याग दिया है।” यूनानी में अधिक शाब्दिक रूप से, “मुझसे मुँह मोड़ लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: तुम यह जानते हो कि
  rationale: यह स्वाभाविक हिन्दी में वर्तमान ज्ञान को व्यक्त करता है और ὅτι से आरम्भ होनेवाली विषय-वस्तु को स्पष्ट रूप से जोड़ता है।
- source_word: ἀπεστράφησάν με
  choice: मुझसे फिर गए हैं
  rationale: यह यूनानी क्रिया में निहित संबंध और समर्थन से मुड़ जाने की छवि को बनाए रखता है; ‘मुझे छोड़ दिया’ अधिक व्याख्यात्मक होता।
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: आसिया में रहनेवाले सभी लोग
  rationale: यह πάντες की व्यापकता बनाए रखता है, पर प्रसंग से सीमित समूह की सम्भावना को मुख्य पाठ में जोड़े गए स्पष्टीकरण से बंद नहीं करता।
- source_word: Ἀσίᾳ
  choice: आसिया
  rationale: यह रोमी प्रान्त के प्राचीन नाम का हिन्दी लिप्यंतरण है; आधुनिक महाद्वीप से इसका भेद पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὧν ἐστιν
  choice: जिनमें ... भी हैं
  rationale: यह बड़े समूह में से नामित व्यक्तियों को उदाहरण के रूप में पहचाननेवाले अंशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Φύγελος
  choice: फूगिलुस
  rationale: यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: Ἑρμογένης
  choice: हिरमुगिनेस
  rationale: यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: ‘आसिया में रहनेवाले सभी लोग’ का दायरा
  choice: मुख्य पाठ में ‘सभी’ की व्यापक शक्ति को यथावत रखना, जबकि उसका प्रसंगगत दायरा खुला छोड़ना
  alternative: इसे आसिया के प्रत्येक मसीही के बारे में पूर्ण और निरपेक्ष कथन मानना, अथवा इसे केवल अतिशयोक्ति कहकर नरम करना
  rationale: πάντες व्यापक है, पर पत्र के प्रसंग में उसका आशय पौलुस से जुड़े लोगों या समर्थकों से हो सकता है। अनुवाद न तो दायरा बढ़ाता है, न शिकायत को नरम करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रहनेवाले’ संयुक्त रूप में परियोजना-स्तरीय वर्तनी-संगति के अनुसार है; नाम मूल यूनानी के निकट लिप्यंतरित किए गए हैं।
