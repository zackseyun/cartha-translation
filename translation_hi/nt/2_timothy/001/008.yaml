id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: hi
  text: इसलिए हमारे प्रभु के विषय में गवाही[a] से, और मुझसे भी, जो उसका कैदी हूँ, लज्जित न हो; बल्कि परमेश्वर की सामर्थ्य के अनुसार सुसमाचार के लिए दुःख सहने में सहभागी हो[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे प्रभु की गवाही।” यूनानी संबंधकारक का यह अर्थ भी हो सकता है, पर यहाँ संभवतः प्रभु के विषय में गवाही अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या, “सुसमाचार के साथ दुःख सह।” यूनानी क्रिया में दूसरों के साथ दुःख उठाने में सम्मिलित होने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या, “परमेश्वर की सामर्थ्य से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν ἐπαισχυνθῇς
  choice: इसलिए ... लज्जित न हो
  rationale: οὖν पिछले कथन से निष्कर्षात्मक संबंध जोड़ता है; निषेध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के विषय में दी गई गवाही
  rationale: μαρτύριον को ‘गवाही’ और संबंधकारक को प्रसंगानुसार प्रभु के विषय में गवाही के रूप में लिया गया है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: मुझसे भी, जो उसका कैदी हूँ
  rationale: δέσμιος का सीधा अर्थ ‘कैदी’ है और αὐτοῦ का स्वामित्व/संबंध ‘उसका’ द्वारा बनाए रखा गया है।
- source_word: συγκακοπάθησον
  choice: दुःख सहने में सहभागी हो
  rationale: संयुक्त क्रिया का συν- तत्व दूसरों के साथ दुःख में भाग लेने का भाव देता है; यह हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: τῷ εὐαγγελίῳ
  choice: सुसमाचार के लिए
  rationale: यूनानी संबंध संक्षिप्त और कुछ हद तक खुला है; प्रसंग में सुसमाचार के कारण/हित में दुःख सहना स्वाभाविक हिन्दी अर्थ है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: κατὰ δύναμιν θεοῦ
  choice: परमेश्वर की सामर्थ्य के अनुसार
  rationale: κατά के मानक, माप या अनुरूपता के भाव को निकटता से रखता है और इसे केवल साधनवाचक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘गवाही’ और ‘हमारे प्रभु’ का संबंध
  choice: हमारे प्रभु के विषय में दी गई गवाही
  alternative: हमारे प्रभु की गवाही
  rationale: प्रसंग में मसीही गवाही का केंद्र प्रभु हैं; फिर भी यूनानी संबंधकारक कर्तृवाचक अर्थ भी दे सकता है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: पौलुस के कैदी होने का प्रभु से संबंध
  choice: उसका कैदी
  alternative: उसके कारण कैदी
  rationale: ‘उसका’ यूनानी αὐτοῦ की व्यापक संबद्धता को बनाए रखता है और कारण को पाठ से अधिक स्पष्ट करके नहीं जोड़ता।
- issue: सुसमाचार और दुःख का संबंध
  choice: सुसमाचार के लिए दुःख सहने में सहभागी हो
  alternative: सुसमाचार के साथ दुःख सह
  rationale: हिन्दी में ‘सुसमाचार के लिए’ आशय को स्वाभाविक बनाता है; συγκακοπάθησον का सहभागिता-भाव अलग से ‘सहभागी हो’ में रखा गया है।
- issue: परमेश्वर की सामर्थ्य की भूमिका
  choice: परमेश्वर की सामर्थ्य के अनुसार
  alternative: परमेश्वर की सामर्थ्य से
  rationale: ‘के अनुसार’ माप, अनुरूपता और समर्थकारी आधार के बीच यूनानी की अर्थगत खुलावट को अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘सुसमाचार’, ‘गवाही’, ‘सामर्थ्य’ और ‘लज्जित’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं। वाक्य की यूनानी संरचना का संबंध सुरक्षित रखते हुए हिन्दी प्रवाह के लिए पदक्रम समायोजित किया गया है।
