  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: hi
  text: 'तीमुथियुस, प्रिय संतान:


    परमेश्वर पिता और हमारे प्रभु मसीह यीशु[a] की ओर से तुम्हें अनुग्रह, दया और शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट यीशु।” यूनानी Χριστός एक उपाधि है, जिसका अर्थ “मसीह,” अर्थात “अभिषिक्त जन,” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: प्रिय
  rationale: यह ἀγαπητός के स्नेहपूर्ण और गरिमामय भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τέκνῳ
  choice: संतान
  rationale: τέκνον आत्मिक पारिवारिक संबंध को व्यक्त करता है और शाब्दिक रूप से ‘पुत्र’ की अपेक्षा अधिक व्यापक है; ‘संतान’ उस रूपक को बनाए रखता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में χάρις का स्थापित और अर्थपूर्ण हिन्दी समतुल्य है।
- source_word: ἔλεος
  choice: दया
  rationale: यह ἔλεος का सीधा और स्वाभाविक समतुल्य है तथा इसे अनुग्रह और शांति से अलग बनाए रखता है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह εἰρήνη के संबंधपरक और वाचा-संबंधी दोनों भावों को ग्रहण करने वाला प्रचलित अनुवाद है।
- source_word: θεοῦ πατρὸς
  choice: परमेश्वर पिता
  rationale: यूनानी पाठ में ‘हमारे’ शब्द पिता के साथ नहीं है; इसलिए कोई अतिरिक्त संबंधवाचक पद नहीं जोड़ा गया।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ उसके अभिषिक्त जन वाले अर्थ और हिन्दी बाइबलीय प्रयोग दोनों को बनाए रखता है।
- source_word: κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: ‘प्रभु’ κύριος की सत्ता और मसीह-संबंधी महत्ता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: Χριστός को यहाँ केवल ध्वन्यंतरण के रूप में नहीं, उपाधि के रूप में समझना उचित है। ‘मसीह’ हिन्दी पाठकों के लिए स्वाभाविक और अर्थवाही है; वैकल्पिक पारंपरिक रूप पाद-टिप्पणी में दिया गया है।
- issue: अभिवादन में क्रिया की पूर्ति
  choice: ‘तुम्हें … मिले’ जोड़ा गया
  alternative: 'क्रियारहित रूप: ‘अनुग्रह, दया और शांति’'
  rationale: यूनानी अभिवादन में क्रिया निहित है। हिन्दी में ‘मिले’ उसे स्पष्ट और स्वाभाविक बनाता है, बिना स्रोत के आशय को बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गरिमामय पत्रात्मक शैली रखी गई है। ‘प्रिय संतान’ आत्मिक पारिवारिक रूपक को बचाता है; ‘के नाम’ पत्र के प्राप्तकर्ता को स्वाभाविक ढंग से चिह्नित करता है।
