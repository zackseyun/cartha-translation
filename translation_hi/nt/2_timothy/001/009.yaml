  text: जिसने हमारा उद्धार किया और हमें पवित्र बुलाहट देकर बुलाया[a]—हमारे कर्मों के अनुसार नहीं, बल्कि अपने ही उद्देश्य और अनुग्रह के अनुसार। यह अनुग्रह हमें मसीह यीशु में युगों के आरम्भ से पहले[b] दिया गया था।
