- source_word: καλέσαντος
  choice: बुलाया
  rationale: यह समानांतर कृदन्त का सीधा अनुवाद है और परमेश्वर की बुलाहट का भाव बनाए रखता है।
- source_word: κλήσει ἁγίᾳ
  choice: पवित्र बुलाहट से
  rationale: करण कारक जैसा हिन्दी रूप यूनानी दत्तिव की साधन अथवा संबंधपरक शक्ति को पूरी तरह संकीर्ण किए बिना स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: हमारे कामों के अनुसार नहीं
  rationale: κατά के मानदंड अथवा आधार के भाव को निकटता से रखता है और पौलुस के प्रमुख शब्द ‘काम’ को बनाए रखता है।
- source_word: ἰδίαν πρόθεσιν
  choice: अपने ही उद्देश्य
  rationale: ἰδίαν की निजता और πρόθεσις के अभिप्राय/उद्देश्य दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: χάρις के लिए प्रचलित और धर्मवैज्ञानिक रूप से पर्याप्त हिन्दी पद है।
