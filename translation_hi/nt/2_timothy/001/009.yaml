- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को उपाधि के रूप में अर्थानुवादित करते हुए पौलुस की ‘में’ संरचना सुरक्षित रखी गई है।
- source_word: πρὸ χρόνων αἰωνίων
  choice: अनादि काल से पहले
  rationale: अभिव्यक्ति की कालातीत/अत्यन्त प्राचीन दिशा और ‘पहले’ की संरचना को आधुनिक, गरिमामय हिन्दी में रखता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
