  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: यहाँ Χριστός का उपाधिगत अर्थ सक्रिय माना गया है, इसलिए अर्थपूर्ण हिन्दी उपाधि ‘मसीह’ चुनी गई है।
- issue: πρὸ χρόνων αἰωνίων की कालगत अभिव्यक्ति
  choice: अनादि काल से पहले
