  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सामान्य पाठक के लिए सुबोध शैली। मूल यूनानी के एक दीर्घ वाक्यांश को स्पष्टता के लिए दो वाक्यों में बाँटा गया है; ‘यह अनुग्रह’ दोहराने से τὴν δοθεῖσαν का χάριν से संबंध स्पष्ट होता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
