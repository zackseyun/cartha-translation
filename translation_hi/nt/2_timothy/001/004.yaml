lexical_decisions:
- source_word: ἐπιποθῶν
  choice: लालसा रखते हुए
  rationale: वर्तमान कृदन्त प्रबल और निरन्तर व्यक्तिगत अभिलाषा व्यक्त करता है। यह चयन भावनात्मक तीव्रता बनाए रखते हुए आधुनिक और गरिमापूर्ण हिन्दी देता है।
- source_word: σε ἰδεῖν
  choice: तुमसे मिलने की
  rationale: शाब्दिक अर्थ ‘तुम्हें देखना’ है, पर इस व्यक्तिगत प्रसंग में हिन्दी का ‘तुमसे मिलना’ आमने-सामने देखने की अभिलाषा को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: μεμνημένος
  choice: याद करते हुए
  rationale: पूर्ण कृदन्त स्मरण की बनी हुई अवस्था दर्शाता है; ‘याद करते हुए’ वाक्य के प्रवाह में स्वाभाविक है।
- source_word: σου τῶν δακρύων
  choice: तुम्हारे आँसुओं को
  rationale: यह सीधा और अनिर्वचनात्मक अनुवाद है, जो आँसुओं को तीमुथियुस के आँसू बताता है।
- source_word: ἵνα
  choice: मैं ... चाहता हूँ
  rationale: ἵνα उद्देश्य अथवा अपेक्षित परिणाम का सम्बन्ध प्रस्तुत करता है। हिन्दी में इच्छा-सूचक मुख्य अभिव्यक्ति के साथ यह भाव स्वाभाविक ढंग से आता है।
- source_word: χαρᾶς
  choice: आनन्द से
  rationale: πληρόω के साथ सम्बन्ध को हिन्दी में ‘आनन्द से भरना’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: πληρωθῶ
  choice: भर जाना चाहता हूँ
  rationale: मूल रूप अओरिस्ट कर्मवाच्य संभावनार्थक है। उद्देश्य-वाक्य का भाव हिन्दी में ‘चाहता हूँ’ से स्वाभाविक बनता है, जबकि ‘भर जाना’ कर्मवाच्य अर्थ सुरक्षित रखता है।
