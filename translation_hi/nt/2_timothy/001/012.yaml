  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: hi
  text: इसी कारण मैं इन बातों को भी सहता हूँ; फिर भी मैं लज्जित नहीं हूँ, क्योंकि मैं जानता हूँ कि मैंने किस पर विश्वास किया है,[a] और मुझे दृढ़ विश्वास है कि वह मेरी अमानत[b] को उस दिन[c] तक सुरक्षित रखने में समर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं जानता हूँ कि मैंने किस पर भरोसा रखा है।”
    reason: lexical_alternative
  - marker: b
    text: “अमानत” उस वस्तु या जिम्मेदारी के लिए प्रयुक्त शब्द है जिसे सुरक्षित रखने के लिए किसी को सौंपा जाता है। इसका अर्थ वह हो सकता है जो पौलुस ने परमेश्वर को सौंपा है, या वह जो पौलुस को सौंपा गया है।
    reason: alternative_reading
  - marker: c
    text: अर्थात, भविष्य में परमेश्वर के अंतिम न्याय और न्यायोचित ठहराए जाने का दिन।
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: इसी कारण
  rationale: यह स्वाभाविक हिन्दी में पूर्ववर्ती कथन से स्पष्ट कारणात्मक संबंध बनाए रखता है।
- source_word: ταῦτα πάσχω
  choice: मैं ये दुःख भी सहता हूँ
  rationale: ‘ये’ संकेतवाचकता को बनाए रखता है और πάσχω को प्रसंगानुकूल, सहज हिन्दी में ‘दुःख सहता हूँ’ कहा गया है।
- source_word: οὐκ ἐπαισχύνομαι
  choice: मैं लज्जित नहीं हूँ
  rationale: यह वक्ता की वर्तमान मनोवृत्ति को व्यक्त करता है और मूल क्रिया का मानक अर्थ देता है।
- source_word: ᾧ πεπίστευκα
  choice: मैंने किस पर विश्वास किया है
  rationale: हिन्दी में ‘किस पर विश्वास’ व्यक्तिगत भरोसे को स्वाभाविक रूप से व्यक्त करता है; पूर्णकाल का स्थायी प्रभाव ‘किया है’ से बना रहता है।
- source_word: πέπεισμαι
  choice: मुझे पूरा भरोसा है
  rationale: पूर्ण निष्क्रिय रूप की स्थिर और दृढ़ आश्वस्तता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δυνατός ἐστιν
  choice: वह ... समर्थ है
  rationale: मूल में निहित सामर्थ्य को धार्मिक अतिव्याख्या के बिना बनाए रखता है।
- source_word: τὴν παραθήκην μου
  choice: मेरी धरोहर
  rationale: ‘धरोहर’ सुरक्षित रखने के लिए सौंपी गई वस्तु या जिम्मेदारी का भाव देता है और ‘मेरी’ की दिशात्मक अस्पष्टता को नहीं मिटाता।
- source_word: φυλάξαι
  choice: सुरक्षित रखने
  rationale: धरोहर के रूपक के साथ स्वाभाविक है और रक्षा तथा संरक्षण दोनों का भाव देता है।
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: उस दिन तक
  rationale: आगामी विशिष्ट दिन की ओर संकेत और कालगत सीमा दोनों को बनाए रखता है।
theological_decisions:
- issue: ᾧ का संदर्भ और δυνατός ἐστιν का निहित कर्ता
  choice: मुख्य पाठ में ‘किस पर’ और ‘वह’ रखकर व्यक्ति की पहचान को अनिर्दिष्ट रखा गया है।
  alternative: ‘परमेश्वर’ या ‘मसीह यीशु’ को स्पष्ट रूप से जोड़ना।
  rationale: यूनानी वाक्यांश इस उपवाक्य में नाम स्पष्ट नहीं करता; इसलिए अनुवाद संदर्भ से अधिक विशिष्ट पहचान नहीं जोड़ता।
- issue: παραθήκη μου का आशय
  choice: ‘मेरी धरोहर’ द्वारा मूल रूपक और अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘जो मैंने उसे सौंपा है’ अथवा ‘जो मुझे सौंपा गया है।’
  rationale: संबंधवाचक रूप यह निर्णायक रूप से नहीं बताता कि पौलुस ने कुछ परमेश्वर को सौंपा है या उसे स्वयं कुछ सौंपा गया है; दोनों संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: ‘उस दिन’ का संदर्भ
  choice: मुख्य पाठ में संकेतात्मक अभिव्यक्ति ज्यों की त्यों रखी गई है।
  alternative: मुख्य पाठ में इसे अंतिम न्याय और प्रतिफल का दिन कहना।
  rationale: मूल पाठ केवल ‘उस दिन’ कहता है; संभावित अंतकालीन संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘धरोहर’ मूल संरक्षण-रूपक को बनाए रखता है; वाक्य में अनावश्यक धार्मिक पारिभाषिकता नहीं जोड़ी गई।
