id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: hi
  text: परमेश्वर की इच्छा से मसीह यीशु का प्रेरित पौलुस—उस जीवन की प्रतिज्ञा के अनुसार, जो मसीह यीशु में है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में स्थापित और सहज रूप।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: पौलुस के आत्मपरिचय में यह एक विशिष्ट नियुक्त भूमिका को दर्शाता है; सामान्य ‘दूत’ की अपेक्षा ‘प्रेरित’ उस अर्थ को सुरक्षित रखता है।
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि का अर्थ बनाए रखता है; ‘मसीह’ हिन्दी में अभिषिक्त प्रतिज्ञात जन की उपाधि के रूप में स्थापित है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के साथ सम्बन्धकारक यहाँ पौलुस की प्रेरिताई के दैवी स्रोत अथवा अधिकार को व्यक्त करता है; यह हिन्दी में स्वाभाविक है।
- source_word: κατ’ ἐπαγγελίαν
  choice: प्रतिज्ञा के अनुसार
  rationale: κατά के अनुरूपता/सम्बन्धसूचक भाव को सीधे सुरक्षित रखता है, बिना यह तय किए कि वाक्यांश प्रेरिताई के उद्देश्य, मानक या व्यापक आधार को कितनी सीमा तक बताता है।
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: उस जीवन की ... जो मसीह यीशु में है
  rationale: विशेषणात्मक लेखयुक्त पदबंध उस जीवन को निर्दिष्ट करता है जो मसीह यीशु में है; ‘में’ ἐν की सम्बन्धात्मक और स्थानात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός में उपाधि का बल पहचाना जा सकता है। ‘मसीह’ आधुनिक हिन्दी पाठकों के लिए स्थापित है और मूल के उपाधिसूचक अर्थ को व्यक्त करता है।
- issue: κατ’ ἐπαγγελίαν का पौलुस की प्रेरिताई से सम्बन्ध
  choice: प्रतिज्ञा के अनुसार
  alternative: प्रतिज्ञा के लिए
  rationale: मूल पदबंध सम्बन्ध की सटीक प्रकृति को पूर्णतः नहीं खोलता। ‘के अनुसार’ उसकी औपचारिक अस्पष्टता को सुरक्षित रखता है; उद्देश्यसूचक ‘के लिए’ अर्थ को अधिक निश्चित कर देता।
- issue: मसीह यीशु ‘में’ जीवन
  choice: में है
  alternative: से मिलता है
  rationale: ‘में’ पौलुसी ἐν-वाक्यांश की धार्मिक और सम्बन्धात्मक गहराई को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है; ‘से मिलता है’ स्रोत का अर्थ जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। यूनानी पत्रारम्भ की अपूर्ण वाक्य-संरचना को अगले पद से जुड़ने देने के लिए अंत में डैश रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘मसीह’ मानक हिन्दी रूप है और वैकल्पिक लिप्यंतरण पाठ में उपयोगी भिन्न अर्थ नहीं जोड़ता।
