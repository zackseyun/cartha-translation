source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: hi
  text: मैं परमेश्वर का धन्यवाद करता हूँ, जिसकी मैं अपने पूर्वजों की तरह[a] शुद्ध अन्तःकरण से सेवा[b] करता हूँ। रात-दिन अपनी प्रार्थनाओं में मैं तुम्हें निरन्तर स्मरण करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अपने पूर्वजों से।” इसका भाव पूर्वजों के विश्वास और परमेश्वर की सेवा के साथ निरन्तरता का हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “आराधना।” यूनानी क्रिया परमेश्वर को अर्पित धार्मिक सेवा या आराधना, दोनों का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: मैं परमेश्वर का धन्यवाद करता हूँ
  rationale: यूनानी मुहावरा χάριν ἔχω और संप्रदान कारक धन्यवाद व्यक्त करने का स्वाभाविक ढंग है; हिन्दी में यह सीधा और सहज रूप है।
- source_word: ᾧ λατρεύω
  choice: जिसकी मैं ... सेवा करता हूँ
  rationale: λατρεύω परमेश्वर को अर्पित धार्मिक सेवा या आराधना दोनों का बोध करा सकता है। ‘सेवा’ इसकी व्यापक अर्थ-सीमा बनाए रखती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀπὸ προγόνων
  choice: अपने पूर्वजों से चली आई रीति के अनुसार
  rationale: शाब्दिक अर्थ ‘पूर्वजों से’ है और सन्दर्भ में पैतृक विश्वास तथा परमेश्वर की सेवा के साथ निरन्तरता व्यक्त होती है। यह रूप उस सम्बन्ध को स्पष्ट करता है, पर यह नहीं कहता कि हर पैतृक परम्परा ही आधार है।
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: शुद्ध विवेक से
  rationale: यह सेवा करने के ढंग को बताता है। ‘शुद्ध विवेक’ आधुनिक हिन्दी में नैतिक निष्कपटता का स्वाभाविक और गरिमापूर्ण बोध देता है।
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: मैं तुम्हें निरन्तर स्मरण करता हूँ
  rationale: शाब्दिक संज्ञात्मक रचना ‘तुम्हारे विषय में निरन्तर स्मरण रखता हूँ’ हिन्दी में बोझिल होती; क्रियात्मक रूप अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: अपनी प्रार्थनाओं में
  rationale: δέησις विशेषतः विनती या याचना की प्रार्थना हो सकती है, पर यहाँ सामान्य हिन्दी ‘प्रार्थनाओं’ में सन्दर्भानुकूल और सहज है।
- source_word: νυκτὸς καὶ ἡμέρας
  choice: रात-दिन
  rationale: यह निरन्तर नियमितता व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
theological_decisions:
- issue: ἀπὸ προγόνων में पौलुस और उसके यहूदी पैतृक विश्वास का सम्बन्ध
  choice: परमेश्वर की सेवा को पूर्वजों से चली आई विश्वास-परम्परा की निरन्तरता के रूप में व्यक्त किया गया है।
  alternative: ‘अपने पूर्वजों से’ या ‘जैसे मेरे पूर्वज करते थे’
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ निरन्तरता को सामने रखता है, जबकि पादटिप्पणी अधिक शाब्दिक सम्भावना बचाती है; इससे इस्राएल के विश्वास के त्याग या किसी विशिष्ट धार्मिक परम्परावाद का अनावश्यक दावा नहीं जुड़ता।
- issue: λατρεύω का धार्मिक आशय
  choice: सेवा
  alternative: आराधना
  rationale: इस क्रिया में परमेश्वर की आराधनापूर्ण सेवा का भाव है। ‘सेवा’ अर्थ को केवल उपासना-विधि तक सीमित नहीं करती, और ‘आराधना’ पादटिप्पणी में वास्तविक विकल्प के रूप में सुरक्षित है।
- issue: ὡς द्वारा धन्यवाद और स्मरण के बीच सम्बन्ध
  choice: दो वाक्यों में निकट सम्बन्ध बनाए रखते हुए कारण का स्पष्ट दावा नहीं किया गया।
  alternative: ‘क्योंकि मैं...’ या ‘जब मैं...’
  rationale: ὡς परिस्थिति, रीति या कारण-सदृश सम्बन्ध दिखा सकता है। इसे स्पष्टतः ‘क्योंकि’ कहना सम्भावित कारणार्थ को निश्चित कर देता; विराम और क्रम मूल की तनावपूर्ण अस्पष्टता बचाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज। ‘निरन्तर स्मरण’ और ‘शुद्ध विवेक’ जैसे परिचित धार्मिक पद रखे गए हैं। मूल यूनानी की लम्बी वाक्य-रचना को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर विचारों का क्रम और सम्बन्ध बनाए रखा गया है।
