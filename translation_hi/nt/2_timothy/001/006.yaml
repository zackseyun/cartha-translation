  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: hi
  text: इसी कारण मैं तुम्हें याद दिलाता हूँ कि परमेश्वर के उस वरदान को फिर से प्रज्वलित करो[a], जो मेरे हाथ रखने के द्वारा तुम में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से भड़का दो।” यूनानी क्रिया मंद पड़ती आग को दोबारा पूरी तरह भड़काने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: इसी कारण
  rationale: यह यूनानी कारणसूचक पदबंध का स्वाभाविक हिन्दी रूप है और पिछले संदर्भ से इसके संबंध को बनाए रखता है।
- source_word: ἀναμιμνῄσκω
  choice: मैं तुम्हें याद दिलाता हूँ
  rationale: वर्तमानकालीन क्रिया और उसके कर्म को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: σε ἀναζωπυρεῖν
  choice: कि ... फिर से प्रज्वलित करो
  rationale: क्रिया आग को दोबारा भड़काने या पूरी लौ में लाने का चित्र प्रस्तुत करती है; ‘फिर से प्रज्वलित करो’ उस नवीकरण के भाव को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: परमेश्वर के उस वरदान को
  rationale: χάρισμα को बिना अनावश्यक रूप से ‘आत्मिक वरदान’ निर्दिष्ट किए ‘वरदान’ कहा गया है; ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक जुड़ाव बनाता है।
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: जो ... तुममें है
  rationale: यह वरदान की वर्तमान उपस्थिति को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: मेरे हाथ रखने के द्वारा
  rationale: यह हाथ रखने की पहचानी जाने वाली क्रिया तथा διά के साधनात्मक अर्थ—‘के द्वारा’—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: पौलुस के हाथ रखने और वरदान के बीच संबंध
  choice: मेरे हाथ रखने के द्वारा
  alternative: मेरे हाथ रखने के अवसर पर
  rationale: ‘के द्वारा’ यूनानी διά के साधनात्मक बल को बनाए रखता है और पाठ में व्यक्त संबंध को कमजोर नहीं करता, फिर भी इससे आगे कोई विकसित संस्कारवादी व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। अग्नि-रूपक को मुख्य पाठ और पादटिप्पणी दोनों में बनाए रखा गया है; वाक्य विन्यास हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित है।
