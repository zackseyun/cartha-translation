    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: इसी के लिए
  rationale: यह पदबंध पिछले संदर्भ में बताए गए सुसमाचार की ओर संकेत करता है और उससे जुड़े उद्देश्य/कार्य को व्यक्त करता है। ‘इसी के लिए’ स्वाभाविक हिन्दी में उस पूर्वसंदर्भ और बल दोनों को बनाए रखता है।
- source_word: ἐτέθην
  choice: मैं ... ठहराया गया
  rationale: भूमिकाओं के साथ τίθημι का कर्मवाच्य रूप नियुक्त या निर्धारित किए जाने का भाव देता है। ‘ठहराया गया’ आयोग और नियुक्ति दोनों को गरिमापूर्ण, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: ग्रीक में स्पष्ट सर्वनाम हल्का बल देता है। हिन्दी में ‘मैं’ को व्यक्त करना पर्याप्त है; ‘मैं स्वयं’ अनावश्यक रूप से अधिक जोरदार होता।
- source_word: κῆρυξ
  choice: उद्घोषक
  rationale: κῆρυξ किसी अधिकृत सार्वजनिक घोषणा करने वाले व्यक्ति को दर्शाता है। ‘उद्घोषक’ इस औपचारिक, सौंपे गए प्रचार-कार्य को ‘उपदेशक’ की अपेक्षा अधिक सटीक रूप से व्यक्त करता है।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: पौलुस के आत्म-संदर्भ में यह मान्य प्रेरिताई पदनाम है; ‘प्रेरित’ हिन्दी बाइबलीय प्रयोग में स्थापित और सटीक है।
- source_word: διδάσκαλος
  choice: शिक्षक
  rationale: इसका सामान्य अर्थ ‘शिक्षक’ है, जो आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: κῆρυξ को पारंपरिक ‘उपदेशक/प्रचारक’ के रूप में अनुवाद किया जाए या अधिक शाब्दिक ‘उद्घोषक’ के रूप में
  choice: उद्घोषक
  alternative: उपदेशक या प्रचारक
  rationale: यहाँ पौलुस की नियुक्त भूमिकाएँ गिनाई गई हैं। ‘उद्घोषक’ यूनानी शब्द में निहित अधिकृत सार्वजनिक घोषणा के भाव को सामने लाता है और इसे बाद की किसी विशिष्ट कलीसियाई भूमिका तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। समानांतर संज्ञाओं की सूची को मूल के अनुरूप रखा गया है।
