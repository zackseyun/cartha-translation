translation:
  language: hi
  text: उस अच्छी अमानत की रक्षा उस पवित्र आत्मा के द्वारा करो, जो हम में निवास करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस उत्तम अमानत की’; अथवा ‘जो तुम्हें सौंपा गया है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उस पवित्र आत्मा से, जो हम में रहता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: उस अच्छी धरोहर
  rationale: ‘धरोहर’ ऐसी मूल्यवान वस्तु या जिम्मेदारी को स्वाभाविक हिंदी में व्यक्त करती है जो सुरक्षित रखने के लिए सौंपी गई हो। ‘अच्छी’ καλὴν का सीधा और संयत अर्थ रखता है; ‘उस’ निश्चित पदबंध को और पिछले संदर्भ से उसके संबंध को दर्शाता है।
- source_word: φύλαξον
  choice: रक्षा ... करो
  rationale: यह आज्ञा सक्रिय और सतर्क सुरक्षा की मांग करती है। ‘रक्षा करो’ सामान्य आधुनिक हिंदी में ‘संभालकर रखो’ से अधिक स्पष्ट रूप से संरक्षण का भाव देता है।
- source_word: διὰ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ साधन अथवा माध्यम व्यक्त करता है। ‘के द्वारा’ इस अर्थ को स्वाभाविक रूप से सुरक्षित रखता है, जबकि आत्मा की भूमिका को केवल मानवीय प्रयास तक सीमित नहीं करता।
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: जो हममें वास करता है
  rationale: वर्तमान कृदंत आत्मा की निरंतर उपस्थिति बताता है। ‘वास करता है’ गरिमापूर्ण और समझने योग्य है तथा ‘हममें’ आंतरिक उपस्थिति का सीधा अर्थ बनाए रखता है।
theological_decisions:
- issue: ‘अच्छी धरोहर’ का अभिप्रेत विषय
  choice: मुख्य पाठ में सामान्य और रूपकात्मक पदबंध ‘उस अच्छी धरोहर’ रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘सुसमाचार का संदेश’ या ‘सेवा का दायित्व’ कहना।
  rationale: संदर्भ प्रेरितीय संदेश की ओर संकेत करता है, पर यूनानी पदबंध स्वयं उसके विषय को स्पष्ट नहीं करता। इसलिए अनुवाद इस धर्मवैचारिक तनाव को नहीं सुलझाता।
- issue: ‘हममें’ का दायरा
  choice: सर्वनाम को ‘हममें’ ही रखा गया है।
  alternative: इसे केवल पौलुस और तीमुथियुस, अथवा स्पष्ट रूप से सभी विश्वासियों, तक सीमित करना।
  rationale: ἡμῖν का तात्कालिक और व्यापक सामुदायिक दोनों प्रकार से ग्रहण संभव है; अनुवाद किसी एक दायरे को आरोपित नहीं करता।
- issue: पवित्र आत्मा की साधनात्मक अथवा कर्तृवाचक भूमिका
  choice: ‘के द्वारा’ से साधन/माध्यम का भाव रखा गया है।
  alternative: ‘पवित्र आत्मा से’ अथवा अधिक स्पष्ट रूप से ‘पवित्र आत्मा की सामर्थ्य से’।
  rationale: διά के साथ संबंधकारक साधन या agency दोनों का भाव दे सकता है। ‘के द्वारा’ मूल की व्यापकता बचाता है और ‘सामर्थ्य’ जैसा अनुलिखित शब्द मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर बाइबलीय गरिमा बनाए रखने के लिए ‘धरोहर’ और ‘वास करता है’ चुने गए हैं। वाक्य विन्यास स्वाभाविक हिंदी के अनुरूप है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
