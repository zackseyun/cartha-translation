id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: hi
  text: प्रभु उनेसिफुरुस के घराने पर दया करे, क्योंकि उसने कई बार मुझे राहत दी और मेरी बेड़ी[a] से लज्जित नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे बंदी होने से”; शाब्दिक रूप से, “मेरी बेड़ी से।”
    reason: ‘बेड़ी’ मूल पाठ के ठोस बिंब को दर्शाती है, पर यहाँ वह पौलुस की कैद के लिए लाक्षणिक प्रयोग भी हो सकती है।
lexical_decisions:
- source_word: δῴη
  choice: करे
  rationale: एओरिस्ट ऑप्टेटिव प्रार्थना या कामना व्यक्त करता है; ‘प्रभु ... दया करे’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: ἔλεος
  choice: दया
  rationale: ईश्वर की ओर से संकट में दिखाई जाने वाली कृपा और करुणा के लिए यह मानक, स्पष्ट हिन्दी शब्द है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यहाँ κύριος प्रार्थनात्मक आशीष में ईश्वरीय उपाधि है; ‘प्रभु’ स्वाभाविक और पारंपरिक हिन्दी रूप है।
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: उनेसिफुरुस के घराने पर
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि परिवार या पूरे गृहसमुदाय को सूचित करता है; ‘घराना’ इस सामाजिक अर्थ को बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आशीष की कामना का कारण प्रस्तुत करता है।
- source_word: πολλάκις
  choice: कई बार
  rationale: बार-बार हुई क्रिया को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνέψυξεν
  choice: मुझे राहत दी
  rationale: क्रिया का अर्थ ताज़गी, ढाढ़स या राहत पहुँचाना है; प्रसंग में ‘राहत दी’ स्पष्ट है और सहायता तथा प्रोत्साहन दोनों को समेट सकता है।
- source_word: τὴν ἅλυσίν μου
  choice: मेरी बेड़ी
  rationale: एकवचन ठोस बिंब को सुरक्षित रखा गया है, यद्यपि यह पौलुस की कैद का लाक्षणिक संकेत भी हो सकता है।
- source_word: οὐκ ἐπαισχύνθη
  choice: लज्जित नहीं हुआ
  rationale: यह सामाजिक और नैतिक लज्जा के भाव को सीधे व्यक्त करता है और यूनानी निषेध को बनाए रखता है।
theological_decisions:
- issue: पौलुस की आशीष में ‘प्रभु’ का संदर्भ
  choice: केवल ‘प्रभु’ कहा गया है; संदर्भ को और विशिष्ट नहीं किया गया।
  alternative: इसे परमेश्वर पिता अथवा प्रभु यीशु के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ में केवल ὁ κύριος है। अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है और किसी एक धर्मवैज्ञानिक पहचान को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ परिवार से व्यापक गृहसमुदाय का अर्थ दे सकता है, और ‘बेड़ी’ मूल यूनानी के एकवचन बिंब को सुरक्षित रखती है।
