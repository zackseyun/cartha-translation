id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: hi
  text: तेरे निष्कपट विश्वास की याद दिलाए जाने पर, मुझे भरोसा है कि वह विश्वास पहले तेरी दादी लोइस और तेरी माँ यूनीके में बसा था, और तुझमें भी बसा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: मुझे ... की याद आई है
  rationale: इस कृदंत वाक्यांश का स्वाभाविक आधुनिक हिन्दी रूप; यह स्मरण कराए जाने या याद आने—दोनों की स्रोतगत छाया को अत्यधिक स्पष्ट किए बिना स्मरण का भाव देता है।
- source_word: ἀνυποκρίτου πίστεως
  choice: निष्कपट विश्वास
  rationale: ἀνυπόκριτος का अर्थ दिखावे या कपट से रहित है; ‘निष्कपट’ संक्षिप्त, dignified और सामान्य हिन्दी में बोधगम्य है।
- source_word: ἐνῴκησεν
  choice: बसा था / बसा है
  rationale: क्रिया का शाब्दिक भाव ‘निवास करना’ है। विश्वास के लिए ‘बसना’ हिन्दी में स्वाभाविक है और अंग्रेज़ी consultation layer के ‘lived’ की तुलना में यूनानी निवास-रूपक को अधिक निकटता से रखता है।
- source_word: μάμμῃ
  choice: नानी
  rationale: संदर्भानुसार लोइस यूनीके की माँ हैं, इसलिए तीमुथियुस के संबंध में ‘नानी’ सटीक और स्वाभाविक है; यूनानी शब्द स्वयं सामान्यतः दादी/नानी दोनों के लिए हो सकता है।
- source_word: πέπεισμαι
  choice: मुझे भरोसा है
  rationale: पूर्णकालिक रूप दृढ़, वर्तमान विश्वास व्यक्त करता है; ‘मुझे भरोसा है’ सहज हिन्दी में वही आश्वस्तता देता है।
theological_decisions:
- issue: विश्वास का पीढ़ियों में ‘बसना’
  choice: व्यक्तिगत विश्वास के साथ निवास-रूपक बनाए रखा गया
  alternative: इसे विरासत में मिला विश्वास कहना
  rationale: पाठ लोइस और यूनीके से तीमुथियुस को विश्वास के स्वतः हस्तांतरण का सिद्धांत नहीं बताता; वह एक ही प्रकार के निष्कपट विश्वास की उनमें उपस्थिति की पुष्टि करता है।
- issue: ὅτι καὶ ἐν σοί में क्रिया का लोप
  choice: ‘वह तुझमें भी बसा है’ कहकर पूर्ववर्ती क्रिया की पूर्ति
  alternative: ‘वह तुझमें भी है’
  rationale: यूनानी में पूर्व की ἐνῴκησεν क्रिया स्वाभाविक रूप से समझी जाती है; उसे दोहराने से हिन्दी में वाक्य स्पष्ट रहता और निवास-रूपक सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सरल। पौलुस और तीमुथियुस के निकट व्यक्तिगत संबंध के अनुरूप एकवचन आत्मीय ‘तेरे/तेरी/तुझमें’ रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं।
