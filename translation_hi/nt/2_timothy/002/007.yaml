base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: hi
  text: मैं जो कह रहा हूँ, उस पर विचार कर[a], क्योंकि प्रभु तुझे हर बात की समझ देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं जो कहता हूँ, उसे समझ।” यूनानी क्रिया का अर्थ “मन लगाकर सोचना” या “समझना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “प्रभु” को और स्पष्ट नहीं किया गया है; इससे विशेष रूप से प्रभु यीशु या व्यापक अर्थ में परमेश्वर अभिप्रेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: विचार कर
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया तीमुथियुस को सक्रिय मनन के लिए बुलाती है। ‘विचार कर’ स्वाभाविक हिन्दी में इस आग्रह को व्यक्त करता है और आगे प्रभु द्वारा समझ दिए जाने के वचन के साथ भी उचित बैठता है।
- source_word: ὃ λέγω
  choice: जो मैं कह रहा हूँ
  rationale: सम्बन्धवाचक सर्वनाम कथन की विषय-वस्तु की ओर संकेत करता है, और वर्तमानकालीन λέγω को ‘कह रहा हूँ’ तत्काल चल रहे उपदेश के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δώσει
  choice: देगा
  rationale: δίδωμι का भविष्यकाल एक प्रतिज्ञा व्यक्त करता है; ‘देगा’ इसका सीधा और सरल हिन्दी रूप है।
- source_word: γάρ
  choice: क्योंकि
  rationale: γάρ पहली आज्ञा का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस तार्किक सम्बन्ध को स्पष्ट रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यह रूप यूनानी पाठ की उपाधि को बनाए रखता है और यह तय नहीं करता कि यहाँ विशेष रूप से प्रभु यीशु अभिप्रेत हैं या व्यापक रूप से परमेश्वर।
- source_word: σύνεσιν
  choice: समझ
  rationale: σύνεσις का अर्थ समझ, अंतर्दृष्टि या अर्थ ग्रहण करने की क्षमता है। ‘समझ’ साधारण आधुनिक हिन्दी में व्यापक और स्पष्ट है।
- source_word: ἐν πᾶσιν
  choice: सब बातों में
  rationale: यह यूनानी वाक्यांश के व्यापक दायरे को बनाए रखता है और उसे केवल धर्मशिक्षा या किसी एक विषय तक सीमित नहीं करता।
theological_decisions:
- issue: ‘प्रभु’ (ὁ κύριος) का अभिप्रेत व्यक्ति
  choice: केवल ‘प्रभु’ कहना, बिना अधिक स्पष्ट किए
  alternative: ‘प्रभु यीशु’ अथवा ‘परमेश्वर’
  rationale: यूनानी पाठ केवल ‘प्रभु’ कहता है। पौलुस के प्रयोग में यह यीशु की ओर संकेत कर सकता है, पर इस पद में अभिप्रेत व्यक्ति स्पष्ट नहीं किया गया; इसलिए अनुवाद उस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन के लिए ‘तू’ रूप (‘कर’, ‘तुझे’) अपनाया गया है, जो बाइबलीय व्यक्तिगत उपदेश के प्रचलित हिन्दी स्तर के अनुरूप है; ‘समझ देगा’ मूल के सीधेसादे ‘देगा’ को सुरक्षित रखता है।
