source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: hi
  text: यीशु मसीह को स्मरण रखो, जो मरे हुओं में से जिलाए गए हैं और दाऊद के वंशज हैं, मेरे सुसमाचार के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μνημόνευε
  choice: स्मरण रखो
  rationale: वर्तमान काल की आज्ञा निरंतर ध्यान में रखने का भाव देती है। ‘स्मरण रखो’ आधुनिक, स्वाभाविक और आज्ञार्थक बल को सुरक्षित रखता है।
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: हिन्दी में ‘मसीह’ Χριστός का प्रचलित अर्थपूर्ण पद है और दाऊदी वंश के संदर्भ में उसकी पदवी का भाव भी बनाए रखता है।
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: मरे हुओं में से जिलाए गए
  rationale: पूर्ण निष्क्रिय कृदन्त दर्शाता है कि यीशु जिलाए गए और जीवित हैं। ‘जिलाए गए’ निष्क्रिय भाव सुरक्षित रखता है; ‘मरे हुओं में से’ ἐκ νεκρῶν का स्वाभाविक हिन्दी रूप है।
- source_word: ἐκ σπέρματος Δαυίδ
  choice: दाऊद के वंश से उत्पन्न
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर वंशावली के प्रसंग में ‘वंश से उत्पन्न’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: यह मेरे सुसमाचार के अनुसार है
  rationale: κατά का ‘के अनुसार’ और μου का ‘मेरे’ सीधा अनुवाद रखा गया है। स्पष्ट हिन्दी वाक्य-संबंध के लिए ‘यह ... है’ जोड़ा गया है, बिना इसे किसी अलग सुसमाचार के रूप में व्याख्यायित किए।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ पुनरुत्थान और दाऊदी वंश के साथ पदवी का मसीही अर्थ प्रमुख है। हिन्दी में ‘यीशु मसीह’ स्वाभाविक है और ‘मसीह’ को केवल कुलनाम बनाए बिना पदवी का अर्थ बनाए रखता है।
- issue: ἐγηγερμένον का निष्क्रिय और पूर्ण पक्ष
  choice: जिलाए गए
  alternative: जी उठे
  rationale: यूनानी निष्क्रिय रूप यीशु पर किए गए पुनरुत्थान के कार्य को व्यक्त करता है; ‘जी उठे’ अधिक अकर्मक होता। संक्षिप्त हिन्दी में पूर्ण पक्ष का पूरा स्थायी परिणाम प्रसंग से समझ में आता है।
- issue: ‘मेरे सुसमाचार’ का आशय
  choice: अधिकारवाचक रूप को ज्यों का त्यों रखना
  alternative: वह सुसमाचार जिसका मैं प्रचार करता हूँ
  rationale: पाठ में μου स्पष्टतः ‘मेरे’ है। मुख्य पाठ इसे किसी निजी या भिन्न सुसमाचार के रूप में न तो परिभाषित करता है, न उसका निषेध जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘स्मरण रखो’ निरंतर आग्रह को स्वाभाविक रूप देता है; डैश पुनरुत्थान और दाऊदी वंश के वर्णन को ‘मेरे सुसमाचार के अनुसार’ कथन से स्पष्ट रूप से जोड़ता है।
