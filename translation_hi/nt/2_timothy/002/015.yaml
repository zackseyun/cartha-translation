base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: hi
  text: अपने आपको परमेश्वर के सामने स्वीकृत व्यक्ति के रूप में प्रस्तुत करने का भरसक प्रयत्न कर—ऐसा कार्यकर्ता, जिसे लज्जित होने की कोई आवश्यकता न हो और जो सत्य के वचन को ठीक रीति से संभालता हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य के वचन को सही ढंग से सिखाता हो”; अधिक शाब्दिक रूप में, “सत्य के वचन को सीधा काटता हो।”
    reason: ὀρθοτομοῦντα एक दुर्लभ और रूपकात्मक क्रिया है; यह पादटिप्पणी अधिक व्याख्यात्मक तथा शाब्दिक दोनों विकल्प सुरक्षित रखती है।
lexical_decisions:
- source_word: σπούδασον
  choice: पूरा प्रयत्न कर
  rationale: आज्ञार्थक क्रिया गंभीर और तत्पर प्रयास की मांग करती है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी के बल को व्यक्त करती है।
- source_word: σεαυτὸν ... παραστῆσαι τῷ θεῷ
  choice: अपने आपको परमेश्वर के सामने ... सिद्ध करने के लिए
  rationale: παραστῆσαι का मूल भाव स्वयं को परमेश्वर के समक्ष प्रस्तुत करना है; हिन्दी में ‘परमेश्वर के सामने’ मूल्यांकन और सेवा—दोनों संदर्भों के लिए स्वाभाविक है।
- source_word: δόκιμον
  choice: परखा हुआ
  rationale: δόκιμος में परीक्षा में खरा उतरने और इस कारण स्वीकार्य सिद्ध होने का भाव है; ‘परखा हुआ’ उस परीक्षण-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: ἐργάτην
  choice: काम करनेवाला
  rationale: यह व्यावसायिक रूपक को सरल, आधुनिक और सामान्य हिन्दी में बनाए रखता है।
- source_word: ἀνεπαίσχυντον
  choice: जिसे लज्जित होने की कोई आवश्यकता न हो
  rationale: यह केवल लज्जा की मनोदशा नहीं, बल्कि लज्जित होने का कारण न होने का भाव व्यक्त करता है।
- source_word: ὀρθοτομοῦντα
  choice: ठीक रीति से प्रस्तुत करता हो
  rationale: दुर्लभ क्रिया का शाब्दिक चित्र ‘सीधा काटना’ है, पर संदर्भ में सत्य के वचन के सही और विश्वसनीय व्यवहार का व्यापक भाव है। ‘प्रस्तुत’ इसे केवल उपदेश देने तक सीमित नहीं करता; शाब्दिक और अधिक विशिष्ट विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: सत्य के वचन
  rationale: यह संबंधकारक संरचना और पौलुसी अभिव्यक्ति की धार्मिक प्रतिध्वनि को बनाए रखते हुए हिन्दी में परिचित और बोधगम्य है।
theological_decisions:
- issue: सेवकाई के संदर्भ में ὀρθοτομοῦντα का अर्थ
  choice: सत्य के वचन को ठीक रीति से प्रस्तुत करता हो
  alternative: सत्य के वचन को सही ढंग से सिखाता हो; अधिक शाब्दिक रूप में, सत्य के वचन को सीधा काटता हो
  rationale: यह क्रिया सम्भवतः सुसमाचार-संदेश के सही और विश्वसनीय व्यवहार को बताती है, पर उसका सटीक रूपक और दायरा विवादित है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी शाब्दिक तथा शिक्षण-संबंधी विकल्पों को सुरक्षित रखती है।
