translation:
  language: hi
  text: इसलिए, मेरे बच्चे, तुम उस अनुग्रह में सामर्थ्य पाते रहो जो मसीहा यीशु में है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट रूप से आया है और बलाघात लिए हुए है; हिन्दी में ‘तुम’ को प्रकट रखने से यह बल बना रहता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष अथवा संक्रमण दिखाता है; ‘इसलिए’ यहाँ सम्बन्ध को सहज और स्पष्ट रखता है।
- source_word: τέκνον μου
  choice: हे मेरे बच्चे
  rationale: τέκνον का मूल अर्थ ‘बच्चा/संतान’ है, केवल ‘पुत्र’ नहीं; सम्बोधन में ‘हे मेरे बच्चे’ पौलुस के आत्मीय आध्यात्मिक सम्बन्ध को व्यक्त करता है।
- source_word: ἐνδυναμοῦ
  choice: सामर्थी होते जाओ
  rationale: वर्तमानकालिक मध्य/कर्मवाच्य आज्ञार्थक रूप निरन्तर सामर्थ्य पाने का भाव दे सकता है। यह हिन्दी में ग्रहण की जाने वाली सामर्थ्य को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि ‘सामर्थी बनो’ भी सम्भव है।
- source_word: ἐν τῇ χάριτι
  choice: उस अनुग्रह में
  rationale: ‘में’ यूनानी ἐν के क्षेत्र और साधन—दोनों सम्भावित भावों को खुला रखता है; ‘उस’ आगे आने वाले विशेषणात्मक वाक्यांश से अनुग्रह को जोड़ता है।
- source_word: χάριτι
  choice: अनुग्रह
  rationale: ‘अनुग्रह’ आधुनिक हिन्दी बाइबलीय प्रयोग में χάρις के लिए प्रतिष्ठित शब्द है और ईश्वर की कृपा तथा सामर्थ्यदायी सहायता का भाव समेट सकता है।
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: जो मसीहा यीशु में है
  rationale: यह विशेषणात्मक पद उस अनुग्रह को मसीहा यीशु में स्थित या उनसे अभिन्न रूप से सम्बद्ध बताता है; संरचना मूल के निकट रहते हुए स्वाभाविक हिन्दी देती है।
- source_word: Χριστῷ
  choice: मसीहा
  rationale: Χριστός यहाँ उपाधि का अर्थ रखता है; ‘मसीहा’ उसके अभिषिक्त जन वाले अर्थ को सुरक्षित रखता है, न कि उसे केवल नाम जैसा बना देता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: Ἰησοῦς नाम का मानक हिन्दी रूप ‘यीशु’ है।
theological_decisions:
- issue: ἐνδυναμοῦ में वाच्य और सामर्थ्य का स्रोत
  choice: ‘सामर्थी होते जाओ’—सामर्थ्य प्राप्त करने और उसमें निरन्तर बढ़ने का भाव
  alternative: ‘सामर्थी बनो’ अथवा ‘बलवन्त हो’
  rationale: मध्य/कर्मवाच्य रूप ग्रहण की गई सामर्थ्य का भाव सम्भव बनाता है और आगे के ‘अनुग्रह में’ के अनुरूप है; अनुवाद इसे आत्मनिर्भर प्रयास नहीं बनाता।
- issue: Χριστός का अनुवाद
  choice: मसीहा यीशु
  alternative: मसीह यीशु
  rationale: ‘मसीहा’ यूनानी उपाधि Χριστός का अर्थ स्पष्ट रखता है। प्रचलित हिन्दी रूप ‘मसीह’ सम्भव है, पर वह कई पाठकों के लिए नाम-सदृश हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे मेरे बच्चे’ आत्मीय सम्बोधन को और ‘सामर्थी होते जाओ’ वर्तमान आज्ञार्थक के निरन्तर तथा ग्रहणशील भाव को व्यक्त करता है।
