source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: hi
  text: और वे शैतान के फंदे से निकलकर होश में आएँ—वे उसकी इच्छा पूरी करने के लिए उसके द्वारा जीवित पकड़ लिए गए हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके द्वारा बंदी बना लिए गए हैं।” यूनानी क्रिया अधिक विशिष्ट रूप से किसी को जीवित पकड़ने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी इच्छा” को शैतान की इच्छा समझा गया है। कुछ लोग इसे परमेश्वर की इच्छा का संकेत मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: होश में आकर
  rationale: यह क्रिया मूलतः फिर से संयत या सचेत होने का भाव रखती है। यहाँ “होश में आना” भ्रम से निकलकर स्पष्ट समझ पाने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: παγίδος
  choice: फंदे
  rationale: παγίς किसी को फँसाने वाले जाल या फंदे को दर्शाता है। “फंदा” शैतान द्वारा बाँध लिए जाने के रूपक को सहज और सजीव रखता है।
- source_word: διαβόλου
  choice: शैतान
  rationale: इस प्रसंग में διάβολος व्यक्तिगत दुष्ट सत्ता की उपाधि है; आधुनिक हिन्दी बाइबलीय प्रयोग में “शैतान” सर्वाधिक स्वाभाविक है।
- source_word: ἐζωγρημένοι
  choice: जीवित पकड़कर
  rationale: ζωγρέω विशेष रूप से जीवित पकड़ने का अर्थ देता है। पूर्ण निष्क्रिय कृदन्त से उत्पन्न और जारी अवस्था को “पकड़कर ... कर रखा है” के द्वारा व्यक्त किया गया है।
- source_word: ὑπ’ αὐτοῦ
  choice: उसी ने
  rationale: निकटतम पूर्वपद शैतान है। “उसी ने” सम्बन्ध स्पष्ट रखते हुए यूनानी सर्वनाम का बल भी व्यक्त करता है।
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: अपनी इच्छा के अधीन
  rationale: εἰς और θέλημα यहाँ पकड़े जाने के लक्ष्य या प्रयोजन को सूचित करते हैं। यह हिन्दी में स्वाभाविक है और किसी अनकहे क्रियार्थक पद को अत्यधिक विस्तार से नहीं जोड़ता; ἐκείνου के विवादित संदर्भ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα में ἐκείνου का संदर्भ
  choice: 'मुख्य पाठ में इसे शैतान के संदर्भ में लिया गया है: “अपनी इच्छा के अधीन।”'
  alternative: इसे परमेश्वर के संदर्भ में भी समझा जा सकता है—अर्थात वे शैतान की कैद से निकलकर परमेश्वर की इच्छा के लिए फिर प्राप्त हों।
  rationale: निकटतम व्याकरणिक संदर्भ διάβολος और αὐτοῦ है, इसलिए शैतान मुख्य पाठ में अधिक स्वाभाविक पूर्वपद है। फिर भी यूनानी में सर्वनाम का संदर्भ निर्विवाद नहीं है, अतः वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “होश में आना” सामान्य पाठक के लिए स्वाभाविक है; “फंदा” मूल रूपक बनाए रखता है। डैश दूसरे खंड को पहले के परिणाम और वर्तमान बंधन की व्याख्या के रूप में जोड़ता है।
