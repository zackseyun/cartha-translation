source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: hi
  text: इसी कारण मैं चुने हुओं[a] के लिए सब कुछ सहता हूँ, ताकि वे भी मसीहा यीशु[b] में जो उद्धार है, उसे अनन्त महिमा के साथ प्राप्त करें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्वाचित जन।” यूनानी शब्द ἐκλεκτούς है।
    reason: lexical_alternative
  - marker: b
    text: 'पारंपरिक अनुवाद: “ख्रीस्त यीशु।”'
    reason: alternative_reading
  - marker: c
    text: 'या: “ताकि वे भी उस उद्धार को प्राप्त करें जो मसीहा यीशु में है और अनन्त महिमा के साथ है।”'
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह वाक्यांश पिछले संदर्भ को पौलुस के धीरज का कारण बताता है; ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक रूप से इसका कारणवाचक बल रखता है।
- source_word: πάντα ὑπομένω
  choice: मैं ... सब कुछ सहता हूँ
  rationale: πάντα की व्यापकता और ὑπομένω के कठिनाइयों के नीचे दृढ़तापूर्वक टिके रहने के भाव को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: चुने हुओं के लिए
  rationale: διά के साथ कर्मकारक यहाँ हित अथवा उद्देश्य प्रकट करता है। ‘चुने हुए’ ἐκλεκτούς का सीधा और सामान्य हिन्दी रूप है तथा चुनाव संबंधी मूल पाठ की धर्मवैज्ञानिक गूंज को मिटाता नहीं।
- source_word: ἵνα καὶ αὐτοὶ
  choice: ताकि वे भी
  rationale: ‘ताकि’ उद्देश्यवाचक ἵνα को और ‘भी’ καί के योगात्मक बल को स्पष्ट रखता है; αὐτοί का आवश्यक बल ‘वे’ में पर्याप्त रूप से व्यक्त है।
- source_word: σωτηρίας τύχωσιν
  choice: उद्धार ... प्राप्त करें
  rationale: τυγχάνω के साथ संबंधकारक का अर्थ पाना अथवा प्राप्त करना है। ‘प्राप्त करें’ उद्देश्यवाचक संभाव्यता को स्वाभाविक हिन्दी में रखता है।
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: मसीहा यीशु में मिलनेवाला
  rationale: संबंधकारक पदबंध ‘उद्धार’ को विशेषित करता है। ‘में’ पौलुस की स्थान/संबंध वाली भाषा बचाता है, जबकि ‘मिलनेवाला’ हिन्दी वाक्य को सहज बनाता है और कोई अतिरिक्त साधनगत अर्थ नहीं जोड़ता।
- source_word: Χριστῷ
  choice: मसीहा
  rationale: Χριστός यहाँ अर्थपूर्ण उपाधि है; ‘मसीहा’ उसके अभिषिक्त राजा संबंधी अर्थ को ‘ख्रीस्त’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: μετὰ δόξης αἰωνίου
  choice: अनन्त महिमा के साथ
  rationale: μετά के साथ संबंधकारक संगति दर्शाता है। यह पद उद्धार के साथ आने वाली अनन्त महिमा को बिना अनावश्यक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ἐκλεκτούς का अनुवाद
  choice: चुने हुए
  alternative: निर्वाचित जन
  rationale: मूल विशेषण उन लोगों को दर्शाता है जिन्हें चुना गया है। ‘चुने हुए’ सामान्य पाठक के लिए स्पष्ट है और मूल पाठ की चुनाव-संबंधी धर्मवैज्ञानिक कसावट को किसी विशेष मत-पद्धति में नहीं बदलता।
- issue: Χριστῷ को उपाधि या पारंपरिक नामरूप के रूप में प्रस्तुत करना
  choice: मसीहा यीशु
  alternative: ख्रीस्त यीशु
  rationale: इस सूत्र में Χριστός कुछ हद तक नाम-जैसा हो सकता है, फिर भी उसका उपाधिगत अर्थ जीवित है। मुख्य पाठ में ‘मसीहा’ मूल अर्थ को सामने रखता है और पाद-टिप्पणी पारंपरिक रूप बताती है।
- issue: μετὰ δόξης αἰωνίου का संबंध
  choice: उद्धार की प्राप्ति के साथ अनन्त महिमा
  alternative: ‘उद्धार’ को सीधे ‘अनन्त महिमा सहित उद्धार’ के रूप में विशेषित करना
  rationale: यूनानी में यह वाक्यांश ‘प्राप्त करें’ की क्रिया अथवा ‘उद्धार’ की संज्ञा के साथ निकटता से समझा जा सकता है; दोनों में उद्धार और अनन्त महिमा की संगति बनी रहती है। हिन्दी मुख्य पाठ जानबूझकर इस संबंध को बहुत कठोरता से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘सहता हूँ,’ ‘चुने हुए,’ ‘उद्धार’ और ‘अनन्त महिमा’ जैसे परिचित धर्मग्रंथीय शब्द रखे गए हैं, पर वाक्य-विन्यास को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
