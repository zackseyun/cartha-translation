translation:
  language: hi
  text: जिसके लिए मैं दुःख सह रहा हूँ—यहाँ तक कि अपराधी के समान बेड़ियों में जकड़ा हुआ हूँ।[a] परन्तु परमेश्वर का वचन बँधा हुआ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
