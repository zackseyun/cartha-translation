    text: या, “जिसमें मैं दुःख सह रहा हूँ।” यूनानी पद सम्भवतः पिछले पद में बताए गए सुसमाचार की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: जिसके लिए
  rationale: सम्बन्धवाचक पद सम्भवतः पिछले पद में उल्लिखित सुसमाचार की ओर संकेत करता है और उसके कारण दुःख सहने का भाव देता है; हिन्दी में ‘जिसके लिए’ स्वाभाविक है।
- source_word: κακοπαθῶ
  choice: दुःख सह रहा हूँ
  rationale: वर्तमानकालीन क्रिया लगातार कठिनाई और पीड़ा झेलने का भाव व्यक्त करती है।
- source_word: μέχρι δεσμῶν
  choice: बेड़ियों तक
  rationale: μέχρι सीमा या पराकाष्ठा बताता है; ‘बेड़ियाँ’ कारावास की ठोस छवि बनाए रखती हैं।
- source_word: ὡς κακοῦργος
  choice: एक अपराधी के समान
  rationale: न्यायिक और कारावास के प्रसंग में κακοῦργος के लिए ‘अपराधी’ स्पष्ट आधुनिक हिन्दी है, जबकि तुलना का ὡς भी सुरक्षित रहता है।
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पौलुस की बेड़ियों और परमेश्वर के वचन के न बँधे होने के बीच प्रबल विरोध प्रकट करता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह प्रचलित और गरिमापूर्ण अभिव्यक्ति है तथा इसे केवल पवित्रशास्त्र या केवल सुसमाचार तक सीमित नहीं करती।
- source_word: οὐ δέδεται
  choice: बँधा हुआ नहीं है
  rationale: पूर्णकालिक कर्मवाच्य से बँधी हुई अवस्था का निषेध व्यक्त होता है; यह ‘बेड़ियों’ के साथ मूल रूपक और विरोध को बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ का आशय
  choice: व्यापक अभिव्यक्ति ‘परमेश्वर का वचन’ रखी गई
  alternative: ‘सुसमाचार का सन्देश’ अथवा ‘पवित्रशास्त्र’
  rationale: निकट प्रसंग सुसमाचार के प्रचार की ओर संकेत करता है, पर यूनानी पद अधिक व्यापक है; अनुवाद इस अस्पष्टता को संकुचित नहीं करता।
- issue: ἐν ᾧ का सम्बन्ध और अर्थ
  choice: ‘जिसके लिए’, अर्थात सम्भवतः सुसमाचार के कारण
  alternative: ‘जिसमें’
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद पिछले पद का ‘सुसमाचार’ होने की प्रबल सम्भावना है, और ἐν यहाँ क्षेत्र अथवा कारण दोनों का भाव दे सकता है; पादटिप्पणी विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘बेड़ियों’ तथा ‘बँधा’ को साथ रखकर मूल का जानबूझकर किया गया शब्द-चित्र सुरक्षित रखा गया है।
