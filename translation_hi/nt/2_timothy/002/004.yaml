  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: hi
  text: सैनिक के रूप में सेवा करने वाला कोई भी व्यक्ति रोज़मर्रा के जीवन के काम-काज में नहीं उलझता[a], ताकि वह उसे प्रसन्न कर सके जिसने उसे सेना में भर्ती किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘नागरिक जीवन के कामों में।’ यूनानी में सैन्य सेवा और सामान्य जीवन के काम-काज के बीच विरोध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई भी व्यक्ति नहीं
  rationale: यह अनिश्चित नकारात्मक सर्वनाम सार्वभौमिक निषेध व्यक्त करता है। हिंदी वाक्य-विन्यास में ‘कोई भी व्यक्ति ... नहीं’ स्वाभाविक और समावेशी है।
- source_word: στρατευόμενος
  choice: सैनिक के रूप में सेवा करने वाला
  rationale: वर्तमान कृदंत सैनिक सेवा में लगे रहने की निरंतर अवस्था दर्शाता है; यह अनुवाद सैन्य रूपक को स्पष्ट और आधुनिक हिंदी में बनाए रखता है।
- source_word: ἐμπλέκεται
  choice: उलझता
  rationale: क्रिया ऐसी संलग्नता का सजीव बिंब देती है जो स्वतंत्र कार्रवाई में बाधा बने; ‘उलझता’ उस रूपक को सुरक्षित रखता है।
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: रोज़मर्रा के जीवन के काम-काज में
  rationale: πραγματείαις व्यवसायों, कामों या मामलों को और βίου सामान्य सांसारिक जीवन अथवा जीविका को सूचित करता है। यह पदबंध सैन्य सेवा और सामान्य जीवन के कामों के बीच विरोध को सहज हिंदी में व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य सूचक संयोजक है; ‘ताकि’ हिंदी में प्रयोजन को स्पष्ट रूप से व्यक्त करता है।
- source_word: τῷ στρατολογήσαντι
  choice: जिसने उसे सेना में भर्ती किया है
  rationale: अओरिस्ट कृदंत भर्ती करने वाले व्यक्ति को दर्शाता है। यह रूप किसी ऐसे विशिष्ट सैन्य पद को नहीं जोड़ता जो यूनानी पाठ में नहीं है। हिंदी में पूर्ण क्रिया ‘किया है’ पूर्व घटना के वर्तमान-संबंध को सहज ढंग से व्यक्त करती है।
- source_word: ἀρέσῃ
  choice: प्रसन्न कर सके
  rationale: ἵνα के बाद प्रयुक्त संभावनार्थक रूप उद्देश्य व्यक्त करता है; ‘प्रसन्न कर सके’ उस लक्ष्य को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: सैन्य रूपक की सीमा
  choice: सैनिक के सामान्य जीवन के काम-काज में न उलझने और भर्ती करने वाले को प्रसन्न करने के चित्र को सीधे बनाए रखा गया है।
  alternative: इसे विशेष रूप से ‘नागरिक व्यवसायों’ से बचना कहना, या रूपक को सीधे सेवकाई की प्राथमिकताओं के सामान्य निर्देश में बदल देना।
  rationale: पद का अपना कथन सैन्य रूपक में है। अनुवाद उसके अनुप्रयोग को पहले से निर्धारित किए बिना उसी चित्र और उसके निहित तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘काम-काज’ व्यापक सामान्य गतिविधियों को व्यक्त करता है, जबकि पाद-टिप्पणी सैन्य बनाम नागरिक जीवन के अधिक स्पष्ट विकल्प को सुरक्षित रखती है।
