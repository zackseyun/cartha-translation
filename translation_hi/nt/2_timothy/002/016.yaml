    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: अपवित्र
  rationale: यह शब्द उस बात को दर्शाता है जो पवित्र नहीं, बल्कि ईश्वर के प्रति अनादरपूर्ण है; ‘अपवित्र’ इसके धार्मिक और नैतिक बल को बनाए रखता है।
- source_word: κενοφωνίας
  choice: खोखली बातों
  rationale: यह शब्द शाब्दिक रूप से खाली या सारहीन वाणी का बोध कराता है; ‘खोखली बातें’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: περιΐστασο
  choice: दूर रहो
  rationale: मध्यवाच्य आज्ञार्थक रूप ऐसी वाणी से बचकर रहने या उसके पास न जाने का निर्देश देता है; ‘दूर रहो’ इस सक्रिय सावधानी को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ πλεῖον
  choice: और भी अधिक
  rationale: यह वाक्यांश बढ़ती हुई मात्रा या आगे की प्रगति दर्शाता है; ‘और भी अधिक’ उस तीव्र होती दिशा को स्पष्ट करता है।
- source_word: προκόψουσιν
  choice: बढ़ेंगे
  rationale: मूल क्रिया आगे बढ़ने या प्रगति करने का अर्थ देती है; यहाँ नकारात्मक नैतिक दिशा को हिन्दी में ‘की ओर बढ़ेंगे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀσεβείας
  choice: अभक्ति
  rationale: यह ईश्वर के प्रति श्रद्धा के अभाव और अनादरपूर्ण आचरण को दर्शाता है; ‘अभक्ति’ धार्मिक-नैतिक अर्थ को संक्षेप में सुरक्षित रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले उपदेश के साथ विरोधात्मक मोड़ दिखाता है; ‘पर’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या चेतावनी केवल निरर्थक वाणी के विषय में है या धार्मिक-नैतिक रूप से दूषित वाणी के विषय में
  choice: ‘अपवित्र खोखली बातें’ द्वारा वाणी की सारहीनता और उसकी पवित्रता-विरोधी प्रकृति, दोनों को रखा गया है।
  alternative: ‘निरर्थक बातें’ या ‘ईश्वर-विरोधी बकवास’
  rationale: βεβήλους और κενοφωνίας साथ मिलकर केवल अनुपयोगी बातचीत नहीं, बल्कि ऐसी सारहीन वाणी बताते हैं जो पवित्रता के विरुद्ध है और अधिक ἀσέβεια की ओर ले जाती है।
- issue: προκόψουσιν का निहित कर्ता
  choice: ‘वे’ की अस्पष्टता बनाए रखी गई है, जो ऐसी बातें करने वाले लोगों की ओर संकेत कर सकती है।
  alternative: ‘ऐसी बातें’ स्वयं अभक्ति को बढ़ाएँगी
  rationale: यूनानी बहुवचन क्रिया का कर्ता संदर्भ से ग्रहण किया जाता है और उसे स्पष्ट रूप से सीमित नहीं किया गया; इसलिए अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। ‘अपवित्र’ धार्मिक भार बनाए रखता है, जबकि ‘खोखली बातें’ सारहीन वाणी का स्वाभाविक हिन्दी रूप है।
