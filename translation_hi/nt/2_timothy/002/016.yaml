  verdict: revise
  source_fidelity: The imperative ‘दूर रहो’ faithfully conveys περιΐστασο, and the implicit plural subject of ‘बढ़ेंगे’ appropriately remains unspecified. However, ‘अभक्ति’ can primarily suggest lack of devotional practice; ἀσέβεια more directly denotes impiety or irreverence toward God. ‘अधार्मिकता’ better preserves this moral-religious force.
  naturalness: Adding ‘और’ makes the paired descriptions of the speech more idiomatic and immediately clear in modern Hindi. The revised wording remains concise and suitably dignified.
  terminology: ‘अधार्मिक’ for βεβήλους and ‘अधार्मिकता’ for ἀσεβείας retain the source’s religious-moral sense without reducing βέβηλος to ritual impurity or ἀσέβεια to merely deficient devotion.
  issues:
  - severity: medium
    issue: ‘अभक्ति’ is not the most precise rendering of ἀσεβείας.
    rationale: In current Hindi, ‘अभक्ति’ often means absence or insufficiency of devotion. The Greek denotes impiety/godlessness, including irreverence toward God; ‘अधार्मिकता’ communicates this more reliably.
  - severity: low
    issue: The juxtaposition ‘अपवित्र खोखली बातें’ is slightly compressed in Hindi.
    rationale: The Greek construction is natural as adjective plus noun, but Hindi reads more smoothly when the two qualifying ideas are linked with ‘और’.
