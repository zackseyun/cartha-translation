  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: hi
  text: मेहनत करने वाले किसान को उपज में से सबसे पहले हिस्सा मिलना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परिश्रम करने वाले किसान को उपज में सबसे पहले हिस्सा पाना चाहिए।”
    reason: κοπιάω के लिए ‘परिश्रम करने वाले’ और μεταλαμβάνειν के लिए अधिक औपचारिक ‘हिस्सा पाना’ का वैकल्पिक शब्दांकन।
lexical_decisions:
- source_word: κοπιῶντα
  choice: मेहनत करनेवाले
  rationale: वर्तमान कृदंत कठिन और लगातार परिश्रम का भाव व्यक्त करता है; यह चुनाव सहज आधुनिक हिन्दी में उसी बल को बनाए रखता है।
- source_word: γεωργὸν
  choice: किसान
  rationale: भूमि जोतने और उपज उगानेवाले व्यक्ति के लिए यह स्पष्ट और प्रचलित आधुनिक हिन्दी शब्द है।
- source_word: δεῖ
  choice: चाहिए
  rationale: यहाँ δεῖ आवश्यकता अथवा दायित्व व्यक्त करता है; ‘चाहिए’ हिन्दी में इस कथन के नीतिसूचक स्वर को स्वाभाविक रूप से दर्शाता है।
- source_word: πρῶτον
  choice: सबसे पहले
  rationale: यह उपज में भाग पाने की प्राथमिकता बताता है, न कि केवल यह कि किसान खाने से पहले काम करे।
- source_word: τῶν καρπῶν
  choice: उपज में से
  rationale: कृषि-संदर्भ में καρποί खेत से प्राप्त समस्त पैदावार को सूचित कर सकता है; ‘उपज’ ‘फलों’ से अधिक व्यापक और स्वाभाविक है।
- source_word: μεταλαμβάνειν
  choice: हिस्सा मिलना
  rationale: क्रिया और संबंधकारक पद मिलकर उपज में सहभागी होने अथवा उसका अंश पाने का अर्थ देते हैं; ‘हिस्सा मिलना’ इसे स्पष्ट, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कहावत-सदृश कथन में πρῶτον का संबंध
  choice: किसान को उपज में सबसे पहले हिस्सा मिलना चाहिए।
  alternative: किसान को उपज खाने से पहले मेहनत करनी चाहिए।
  rationale: यूनानी वाक्य-विन्यास में πρῶτον का संबंध सबसे स्वाभाविक रूप से μεταλαμβάνειν, अर्थात हिस्सा पाने, से है। इसलिए कथन श्रम के फल में प्राथमिक सहभागिता पर बल देता है, केवल काम के बाद खाने के क्रम पर नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उपज’ कृषि-संदर्भ की व्यापकता बनाए रखता है और ‘हिस्सा मिलना’ साधारण पाठक के लिए सहभागिता का अर्थ स्पष्ट करता है।
