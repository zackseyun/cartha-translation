  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: hi
  text: यदि हम विश्वासहीन हों[a], तो भी वह विश्वासयोग्य बना रहता है[b], क्योंकि वह अपने आप का इनकार नहीं कर सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यदि हम विश्वास न करें’ अथवा ‘यदि हम विश्वास में खरे न उतरें।’ यूनानी क्रिया दोनों प्रकार का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भरोसेमंद।’ ‘विश्वासयोग्य’ मूल पाठ में ‘विश्वासहीन’ के साथ बने विरोध को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: हम विश्वासहीन हों
  rationale: ἀπιστέω अविश्वास करने या विश्वास में खरा न उतरने—दोनों अर्थ दे सकता है। ‘विश्वासहीन’ इस अर्थ-विस्तार को खुला रखता है और πιστός के साथ विरोध भी बनाए रखता है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह शब्द उसकी स्थिर निष्ठा और भरोसेमंद चरित्र दोनों को व्यक्त करता है; साथ ही ‘विश्वासहीन’ के साथ मूल का शब्दगत विरोध यथासंभव सुरक्षित रहता है।
- source_word: μένει
  choice: बना रहता है
  rationale: वर्तमान काल में जारी स्थिरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀρνήσασθαι
  choice: इनकार करना
  rationale: ἀρνέομαι का सीधा और प्रबल हिन्दी समतुल्य है; यहाँ अपने ही स्वरूप या चरित्र के प्रतिकूल होने का भाव खुला रहता है।
- source_word: ἑαυτὸν
  choice: अपने आप से
  rationale: यह कर्ता की ओर लौटने वाले आत्मवाचक सर्वनाम को स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐ δύναται
  choice: नहीं कर सकता
  rationale: यह केवल अनिच्छा नहीं, बल्कि असमर्थता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मानवीय विश्वासहीनता के संबंध में उसकी विश्वासयोग्यता का आशय
  choice: वचन केवल यह कहता है कि वह विश्वासयोग्य बना रहता है, क्योंकि वह अपने आप से इनकार नहीं कर सकता; यह स्पष्ट नहीं करता कि यहाँ मुख्य रूप से उद्धार, प्रतिज्ञा-पालन या न्याय में विश्वासयोग्यता अभिप्रेत है।
  alternative: इसे केवल दुर्बल विश्वासियों को बचाए रखने का आश्वासन मानना, या केवल धर्मत्यागियों पर न्याय की चेतावनी मानना।
  rationale: यूनानी पाठ ईश्वरीय स्थिरता की पुष्टि करता है, पर उसके तात्कालिक परिणाम को एक ही दिशा में सीमित नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तो भी’ यूनानी वाक्य में निहित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
