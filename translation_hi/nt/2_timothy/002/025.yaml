lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: नम्रता से
  rationale: यह पदबंध सुधारने के ढंग को बताता है। ‘नम्रता से’ आधुनिक और स्वाभाविक हिन्दी में कोमलता तथा संयम का भाव व्यक्त करता है, बिना इसे दुर्बलता मानने के।
- source_word: παιδεύοντα
  choice: सुधारता रहे
  rationale: यहाँ क्रिया का आशय दंड देना नहीं, बल्कि शिक्षा देते हुए गलती सुधारना है। पिछले वाक्य के आज्ञार्थक प्रवाह के अनुरूप ‘रहे’ रखा गया है।
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: विरोध करनेवालों को
  rationale: यूनानी कृदंत उन लोगों को दर्शाता है जो अपने को विरोध में खड़ा करते हैं। मूल में विरोध का कर्म स्पष्ट नहीं है, इसलिए मुख्य पाठ में कोई सर्वनाम नहीं जोड़ा गया।
- source_word: μήποτε
  choice: क्या जाने
  rationale: यह अभिव्यक्ति आशंकित संभावना अथवा अनिश्चित परिणाम को स्वाभाविक हिन्दी में बनाए रखती है और परमेश्वर के कार्य को निश्चित परिणाम के रूप में प्रस्तुत नहीं करती।
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: परमेश्वर उन्हें … प्रदान करे
  rationale: यहाँ δίδωμι का भाव किसी वस्तु को साधारण रूप से देने के बजाय अनुग्रहपूर्वक प्रदान करने का है; संभावनार्थक क्रियारूप को ‘करे’ से सुरक्षित रखा गया है।
- source_word: μετάνοιαν
  choice: मन फिराव
  rationale: ‘मन फिराव’ केवल खेद नहीं, बल्कि सोच और दिशा के बदलने का व्यापक भाव व्यक्त करता है। इससे पद में परमेश्वर द्वारा प्रदान किए जाने वाले प्रत्युत्तर का अर्थ बना रहता है।
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: जिससे वे सत्य को भली-भाँति जान लें
  rationale: εἰς यहाँ लक्ष्य या परिणाम बताता है और ἐπίγνωσις सत्य की पूर्णतर पहचान का भाव रखता है; यह अनुवाद दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन फिराव में परमेश्वर की क्रियाशीलता और मनुष्य का प्रत्युत्तर
  choice: पाठ स्पष्ट रूप से कहता है कि परमेश्वर मन फिराव प्रदान करे, जबकि ‘क्या जाने’ इस परिणाम की अनिश्चितता को बनाए रखता है।
  alternative: या तो इसे अनिवार्य ईश्वरीय निर्धारण मानना, अथवा मन फिराव में परमेश्वर की क्रियाशीलता को कम कर देना।
  rationale: यूनानी पाठ परमेश्वर को मन फिराव प्रदान करनेवाला बताता है, पर इस एक पद में ईश्वरीय प्रभुता और मानवीय उत्तरदायित्व के संबंध को व्यवस्थित रूप से नहीं समझाता। अनुवाद इस तनाव को अनसुलझा ही रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। यह अंश पिछले पद से व्याकरणिक रूप से जुड़ा है, इसलिए आरंभ और अंत में वाक्यांश का प्रवाह बनाए रखा गया है। ‘मन फिराव’ धार्मिक अर्थ को सुरक्षित रखते हुए मात्र भावनात्मक पछतावे से आगे दिशा-परिवर्तन का भाव देता है।
