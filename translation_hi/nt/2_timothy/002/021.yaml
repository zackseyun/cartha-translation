id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: hi
  text: इसलिए, यदि कोई अपने आपको इन बातों से शुद्ध करे, तो वह आदर के काम आनेवाला पात्र[a] होगा—पवित्र किया हुआ[b], स्वामी के लिए उपयोगी और हर अच्छे काम के लिए तैयार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आदर के लिए पात्र।”
    reason: lexical_alternative
  - marker: b
    text: या “अलग किया हुआ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए, यदि
  rationale: ‘इसलिए’ पिछले कथन से निकले निष्कर्ष को और ‘यदि’ शर्त को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τις
  choice: कोई
  rationale: यह अनिश्चित सर्वनाम सामान्य रूप से किसी भी व्यक्ति को सूचित करता है; ‘कोई’ उसके व्यापक प्रतिनिधिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: अपने आपको ... शुद्ध करे
  rationale: क्रिया में पूरी तरह साफ करने या अशुद्धता दूर करने का भाव है। आत्मवाचक रूप को स्पष्ट रखने के लिए ‘अपने आपको’ चुना गया है।
- source_word: ἀπὸ τούτων
  choice: इन बातों से
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछले प्रसंग की ओर लौटता है। ‘इन बातों से’ उस संदर्भ को बिना अधिक निश्चित किए सुरक्षित रखता है।
- source_word: σκεῦος
  choice: पात्र
  rationale: पिछली आयत के बड़े घर और उसके बर्तनों के रूपक को ‘पात्र’ बनाए रखता है और साथ ही व्यक्ति के रूपकात्मक उपयोग के लिए भी स्वाभाविक है।
- source_word: εἰς τιμήν
  choice: आदर के काम आनेवाला
  rationale: यह पिछले पद के अनादर वाले पात्रों से विरोध को व्यक्त करता है। हिन्दी में यह प्रयोग के उद्देश्य को स्वाभाविक रूप से बताता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἡγιασμένον
  choice: पवित्र किया हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदंत उस वर्तमान दशा को दर्शाता है जो पवित्र किए जाने के फलस्वरूप है। यह रूप क्रिया और परिणामी स्थिति दोनों को बनाए रखता है।
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: स्वामी के लिए उपयोगी
  rationale: ‘उपयोगी’ सेवा के योग्य होने का सीधा अर्थ देता है और ‘स्वामी’ घरेलू रूपक में अधिकार रखने वाले मालिक का भाव बनाए रखता है।
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: हर अच्छे काम के लिए तैयार
  rationale: यह मूल के व्यापक ‘हर अच्छे कार्य’ और तत्पर अवस्था को सरल, वर्तमान हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: ἡγιασμένον में पवित्र बनाए जाने और किसी उद्देश्य के लिए अलग किए जाने का संबंध
  choice: पवित्र किया हुआ
  alternative: अलग किया हुआ
  rationale: मुख्य पाठ पवित्रता से जुड़े यूनानी शब्द का प्रत्यक्ष धार्मिक भाव सुरक्षित रखता है; पादटिप्पणी उसका समर्पित या अलग रखे जाने वाला पहलू बताती है, पर दोनों को एक-दूसरे का पूर्ण पर्याय मानकर तनाव समाप्त नहीं करती।
- issue: δεσπότης का घरेलू रूपक और उसका ईश्वरीय संकेत
  choice: स्वामी
  alternative: मालिक
  rationale: ‘स्वामी’ अधिकार-संबंध और संभावित ईश्वरीय संदर्भ दोनों को बनाए रखता है, फिर भी पाठ में परमेश्वर या मसीह नाम जोड़कर संदर्भ को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: शर्त के कर्ता का सामान्य और एकवचन स्वरूप
  choice: यदि कोई अपने आपको ... शुद्ध करे, तो वह ... होगा
  alternative: यदि कोई स्वयं को ... शुद्ध करे, तो ऐसा व्यक्ति ... होगा
  rationale: यह यूनानी के एकवचन, आत्मवाचक और सार्वत्रिक आमंत्रण को बनाए रखता है; हिन्दी में ‘वह’ यहाँ किसी भी व्यक्ति के लिए प्रतिनिधिक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पात्र’ और ‘स्वामी’ घरेलू रूपक को बनाए रखते हैं; वाक्य के उत्तरार्ध में दीर्घ डैश समानांतर विशेषणों को स्पष्ट करता है।
