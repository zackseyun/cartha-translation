  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: hi
  text: यदि हम धीरज धरते रहें, तो उसके साथ राज्य भी करेंगे; यदि हम उसका इनकार करें[a], तो वह भी हमारा इनकार करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे अपना मानने से इनकार करें’; इसी प्रकार, ‘वह भी हमें अपना मानने से इनकार करेगा।’
    reason: ἀρνέομαι में केवल कथन का खंडन ही नहीं, किसी व्यक्ति को अस्वीकार करने या उससे संबंध न मानने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ὑπομένομεν
  choice: धीरज धरते रहें
  rationale: यह पदबंध परीक्षा या दुःख के बीच दृढ़ बने रहने का भाव व्यक्त करता है। ‘रहें’ वर्तमान काल की सततता को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: συμβασιλεύσομεν
  choice: उसके साथ राज्य भी करेंगे
  rationale: संयुक्त क्रिया का अर्थ ‘साथ राज्य करना’ है। प्रसंग से निहित मसीह को ‘उसके’ द्वारा स्पष्ट किया गया है, और ‘राज्य करना’ राजकीय बिंब बनाए रखता है।
- source_word: ἀρνησόμεθα
  choice: उसका इनकार करें
  rationale: ἀρνέομαι किसी व्यक्ति को नकारने, अस्वीकार करने या उससे संबंध न मानने का अर्थ दे सकता है। ‘इनकार करना’ अगले खंड में उसी क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: κἀκεῖνος
  choice: वह भी
  rationale: καὶ ἐκεῖνος का संक्षिप्त रूप पारस्परिक अनुरूपता दर्शाता है; ‘वह भी’ हिन्दी में सहज रूप से इसे व्यक्त करता है।
- source_word: ἀρνήσεται ἡμᾶς
  choice: हमारा इनकार करेगा
  rationale: पहले खंड के ‘इनकार’ को दोहराकर यूनानी की जानबूझकर की गई शब्द-पुनरावृत्ति और चेतावनी की शक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: दूसरे शर्तवाचक खंड में चेतावनी का स्वरूप
  choice: 'कथन को वास्तविक और गंभीर चेतावनी के रूप में सीधे अनूदित किया गया है: ‘यदि हम उसका इनकार करें, तो वह भी हमारा इनकार करेगा।’'
  alternative: इसे केवल प्रतिफल की हानि या अस्तित्वहीन काल्पनिक स्थिति के रूप में स्पष्ट कर देना।
  rationale: यूनानी पाठ दो संतुलित शर्तवाचक कथन प्रस्तुत करता है और इनकार किए जाने की गंभीरता को स्वयं परिभाषित नहीं करता। अनुवाद धर्मत्याग, धीरज या प्रतिफल संबंधी विवाद को तय किए बिना पाठ का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर रचना तथा दोनों खंडों में ‘इनकार’ की पुनरावृत्ति सुरक्षित रखी गई है।
