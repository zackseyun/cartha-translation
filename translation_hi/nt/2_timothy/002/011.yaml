  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: hi
  text: यह कथन विश्वसनीय है:[a] क्योंकि यदि हम उसके साथ मर गए, तो हम उसके साथ जीएँगे भी।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह वचन विश्वासयोग्य है’ अथवा ‘यह बात भरोसे के योग्य है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हम साथ मर गए’; यूनानी संयुक्त क्रिया मसीह के साथ साझा मृत्यु का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: c
    text: भविष्यकाल ‘उसके साथ जीएँगे’ मसीह के साथ पुनरुत्थान के जीवन, उसके जीवन में वर्तमान सहभागिता, या दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: भरोसे के योग्य
  rationale: यहाँ विशेषण λόγος को विश्वसनीय और स्वीकार करने योग्य बताता है। आधुनिक हिन्दी में यह वाक्यांश स्वाभाविक है और व्यक्तिगत निष्ठा का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ὁ λόγος
  choice: यह बात
  rationale: पास्टोरल पत्रियों में यह एक सूत्रवत् उक्ति का परिचय देता है। ‘यह बात’ सामान्य आधुनिक हिन्दी में संक्षिप्त और सहज है; ‘वचन’ यहाँ धार्मिक तकनीकी अर्थ का आभास दे सकता है।
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: ‘यदि’ शर्त को और ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: συναπεθάνομεν
  choice: हम उसके साथ मर गए
  rationale: संयुक्त क्रिया का συν- साझा मृत्यु का भाव देता है। प्रसंग में निहित सहचर मसीह है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘उसके साथ’ आवश्यक है।
- source_word: καὶ
  choice: भी
  rationale: दोनों संतुलित उपवाक्यों के परस्पर संबंध को स्वाभाविक हिन्दी में ‘भी’ स्पष्ट करता है।
- source_word: συζήσομεν
  choice: उसके साथ जीएँगे
  rationale: भविष्यकाल और συν- से व्यक्त साझा जीवन दोनों सुरक्षित रहते हैं। यह अनुवाद उस जीवन को केवल वर्तमान आत्मिक जीवन या केवल भावी पुनरुत्थान तक सीमित नहीं करता।
theological_decisions:
- issue: संयुक्त क्रियाओं में निहित सहचर
  choice: दोनों क्रियाओं में ‘उसके साथ’ जोड़कर मसीह की ओर संकेत किया गया है।
  alternative: 'निहित सहचर को अनकहा छोड़ना: ‘यदि हम मर गए, तो जीएँगे भी।’'
  rationale: यूनानी में अलग कर्म नहीं है, पर συν- साझा सहभागिता दर्शाता है और निकटवर्ती मसीह-केंद्रित प्रसंग उसके संदर्भ को स्पष्ट करता है। ‘उसके साथ’ अर्थ को व्यक्त करता है, नया सिद्धान्त नहीं जोड़ता।
- issue: मसीह के साथ जीने का कालगत और धर्मवैज्ञानिक विस्तार
  choice: ‘उसके साथ जीएँगे’ को व्यापक रखा गया है।
  alternative: इसे केवल भावी पुनरुत्थान के जीवन अथवा केवल वर्तमान आत्मिक जीवन के रूप में स्पष्ट करना।
  rationale: भविष्यकाल भावी जीवन की ओर स्वाभाविक संकेत करता है, पर अनुवाद मूल पाठ से अधिक संकीर्ण व्याख्या नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भरोसे के योग्य’ और ‘यह बात’ सामान्य पाठक के लिए स्पष्ट हैं; संतुलित शर्तीय संरचना तथा मूल की धर्मवैज्ञानिक व्यापकता सुरक्षित रखी गई है।
