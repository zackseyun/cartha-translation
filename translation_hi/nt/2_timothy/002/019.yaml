source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: hi
  text: 'फिर भी परमेश्वर की दृढ़ नींव कायम है और उस पर यह मुहर लगी है[a]: “प्रभु उन्हें जानता है जो उसके हैं,” और, “हर वह व्यक्ति जो प्रभु का नाम लेता है[b], अधर्म से दूर हो जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर यह लेख अंकित है।” “मुहर” के लिए प्रयुक्त शब्द मुहर पर बने उस पहचान-चिह्न या लेख को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो प्रभु का नाम पुकारता है।” यूनानी में शाब्दिक रूप से, “जो प्रभु के नाम का उच्चारण करता है” है; यह उसे पुकारने या उसके प्रति अपनी निष्ठा स्वीकार करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: फिर भी
  rationale: यह पिछले प्रसंग में झूठी शिक्षा के बावजूद एक प्रबल विरोधात्मक संक्रमण व्यक्त करता है।
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: परमेश्वर की दृढ़ नींव
  rationale: यह नींव की स्थिरता पर बल देता है; संबंधवाचक रूप यह खुला रखता है कि नींव परमेश्वर की ओर से है, उसकी है, या उससे पहचानी जाती है।
- source_word: ἕστηκεν
  choice: कायम है
  rationale: पूर्णकालिक क्रिया एक स्थापित और बनी हुई अवस्था बताती है; आधुनिक हिन्दी में ‘कायम है’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: उस पर यह मुहर लगी है
  rationale: यह पहचान और प्रामाणिकता की मुहर का रूपक बनाए रखता है; मुहर पर अंकित लेख का भाव पादटिप्पणी में दिया गया है।
- source_word: Ἔγνω κύριος τοὺς ὄντας αὐτοῦ
  choice: प्रभु उन्हें जानता है जो उसके हैं
  rationale: उद्धरण में अतीतकालीन यूनानी रूप का भाव स्थायी ईश्वरीय पहचान और ज्ञान है; हिन्दी वर्तमानकाल इस सतत सत्य को सहज रूप से व्यक्त करता है।
- source_word: Ἀποστήτω ἀπὸ ἀδικίας
  choice: अधर्म से दूर हो जाए
  rationale: आज्ञार्थक रूप निर्णायक अलगाव की मांग करता है; ‘अधर्म’ ἀδικία के व्यापक नैतिक और धार्मिक अर्थ को बनाए रखता है।
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: हर वह व्यक्ति जो प्रभु का नाम लेता है
  rationale: ‘नाम लेना’ हिन्दी में स्वाभाविक है और प्रभु को पुकारने अथवा उसके प्रति निष्ठा स्वीकार करने के मुहावरेदार भाव को समेट सकता है।
theological_decisions:
- issue: मुहर के दोनों कथनों में ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: दोनों स्थानों पर केवल ‘प्रभु’ रखा गया है।
  alternative: इसे स्पष्ट रूप से परमेश्वर पिता या मसीह के लिए प्रयुक्त बताना, अथवा दोनों कथनों में अलग-अलग अभिप्राय मानना।
  rationale: यूनानी पाठ κύριος के अभिप्राय को स्पष्ट नहीं करता। यह पुरालेखीय उद्धरण को मसीही प्रसंग में लागू करता है, इसलिए अनुवाद उसकी स्तरित धार्मिक अर्थवत्ता को बिना अनावश्यक समाधान के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नींव’, ‘मुहर’ और ‘अधर्म’ जैसे प्रमुख रूपकों और धार्मिक शब्दों को सुरक्षित रखते हुए वाक्य-विन्यास स्वाभाविक हिन्दी में दिया गया है।
