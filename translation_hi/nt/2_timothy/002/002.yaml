source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: hi
  text: और जो बातें तुमने बहुत-से गवाहों की उपस्थिति में मुझसे सुनी हैं[a], उन्हें विश्वासयोग्य मनुष्यों को सौंप दो[b], जो दूसरों को भी सिखाने में समर्थ होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से गवाहों के सामने।” यूनानी वाक्यांश संभवतः इस बात पर बल देता है कि पौलुस की शिक्षा अनेक गवाहों की उपस्थिति में सार्वजनिक रूप से दी गई थी; कम संभावना से इसका अर्थ “बहुत-से गवाहों के द्वारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में व्याकरणिक रूप पुल्लिंग है; इसका अनुवाद “विश्वासयोग्य पुरुषों” भी किया जा सकता है। यहाँ यह रूप प्रतिनिधिक अर्थ में विश्वासयोग्य लोगों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: जो बातें
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम उस शिक्षा-विषय की ओर संकेत करता है जिसे तीमुथियुस ने सुना; ‘जो बातें’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἤκουσας
  choice: तुमने ... सुनी हैं
  rationale: यूनानी एओरिस्ट पूर्व में ग्रहण की गई शिक्षा को बताता है; हिन्दी का पूर्ण भूतकाल इस संदर्भ में स्वाभाविक है।
- source_word: παρ’ ἐμοῦ
  choice: मुझसे
  rationale: ἀκούω के साथ παρά + संबंधकारक सुनने के स्रोत को व्यक्त करता है।
- source_word: διὰ πολλῶν μαρτύρων
  choice: बहुत-से गवाहों की उपस्थिति में
  rationale: διά + संबंधकारक यहाँ संभवतः उस सार्वजनिक परिस्थिति को दर्शाता है जिसमें अनेक गवाह उपस्थित थे; ‘के द्वारा’ वाला साधनार्थ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ταῦτα
  choice: उन्हें
  rationale: हिन्दी में सर्वनाम पूर्ववर्ती ‘जो बातें’ को स्वाभाविक रूप से पुनः ग्रहण करता है और यूनानी संकेतवाचक का संदर्भ बनाए रखता है।
- source_word: παράθου
  choice: सौंप दो
  rationale: आदेशात्मक क्रिया किसी वस्तु को दूसरे की देखरेख और जिम्मेदारी में देने का भाव रखती है; ‘सौंप दो’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: πιστοῖς
  choice: विश्वासयोग्य
  rationale: πιστός यहाँ शिक्षा को आगे पहुँचाने की भरोसेमंदी पर बल देता है; यह शब्द निष्ठा और विश्वसनीयता दोनों का भाव बनाए रखता है।
- source_word: ἀνθρώποις
  choice: मनुष्यों
  rationale: ἄνθρωπος सामान्यतः ‘मनुष्य/व्यक्ति’ भी हो सकता है; बहुवचन ‘मनुष्यों’ मूल के मानवीय संदर्भ को रखता है, जबकि व्याकरणिक पुल्लिंग और संभावित व्यापक प्रयोग की सूचना पादटिप्पणी में दी गई है।
- source_word: οἵτινες
  choice: जो
  rationale: यह गुणात्मक संबंधवाचक सर्वनाम अपेक्षित प्रकार के लोगों का परिचय देता है; हिन्दी में ‘जो’ स्वाभाविक है और गुण उनकी अगली विशेषता से स्पष्ट होता है।
- source_word: ἱκανοὶ
  choice: समर्थ
  rationale: ἱκανός पर्याप्त योग्यता या क्षमता बताता है; ‘समर्थ’ यहाँ शिक्षण-कार्य करने की क्षमता को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἔσονται
  choice: होंगे
  rationale: भविष्यकालीन क्रिया उनकी आगे की क्षमता को स्पष्ट रूप से बनाए रखती है।
- source_word: ἑτέρους
  choice: दूसरों
  rationale: यह अन्य लोगों को दर्शाने वाला सीधा बहुवचन कर्म है; ‘दूसरों’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: πιστοῖς ἀνθρώποις में लिंग का निरूपण
  choice: विश्वासयोग्य मनुष्यों
  alternative: विश्वासयोग्य पुरुषों
  rationale: ἄνθρωπος व्याकरणिक रूप से पुल्लिंग होते हुए भी सामान्य अर्थ में मनुष्यों या व्यक्तियों के लिए प्रयुक्त हो सकता है। संदर्भ स्वयं केवल पुरुषों तक अर्थ को निर्विवाद रूप से सीमित नहीं करता; इसलिए मुख्य पाठ में प्राकृतिक व्यापक अर्थ रखा गया है और पुल्लिंग-विशिष्ट विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट किंतु गरिमापूर्ण शैली। वाक्य का शिक्षण-सौंपने वाला क्रम और भविष्यकाल बनाए रखा गया है। ‘बहुत-से’ सामान्य पाठक के लिए सहज है; ‘गवाहों की उपस्थिति में’ मूल वाक्यांश की प्रमुख व्याख्या को स्पष्ट करता है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
