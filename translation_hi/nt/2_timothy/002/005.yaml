revisions:
- from: और यदि कोई खिलाड़ी प्रतियोगिता में भाग लेता है, तो उसे विजेता का मुकुट नहीं पहनाया जाता, जब तक कि वह नियमों के अनुसार प्रतियोगिता न करे।
  to: और यदि कोई खेल-प्रतियोगिता में भी प्रतिस्पर्धा करता है, तो जब तक वह नियमों के अनुसार प्रतिस्पर्धा न करे, उसे मुकुट नहीं मिलता[a]।
  rationale: Revision strengthens the rendering of ἀθλέω from mere participation to active athletic competition, retains the verbal repetition in both clauses, and uses idiomatic Hindi for the passive image of being crowned. The note preserves the lexical breadth of νομίμως without imposing an interpretation beyond the contest context.
