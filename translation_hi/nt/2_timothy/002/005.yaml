review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the athletic-contest image, the conditional structure, the requirement of compliance with rules, and the passive/result sense of receiving the crown. However, “प्रतियोगिता में भाग लेता है” can denote mere participation, whereas ἀθλέω denotes competing/contending. “विजेता का मुकुट” can also imply that the crown belongs to an already identified winner rather than expressing the act of being crowned.
  naturalness: The sentence is understandable, but repeated use of “प्रतियोगिता” with “भाग लेता है” is less direct than natural Hindi wording for athletic competition. “मुकुट नहीं मिलता” is idiomatic and adequately expresses the Greek passive in this context.
  terminology: “खेल-प्रतियोगिता में प्रतिस्पर्धा करता है” preserves the athletic image without importing a specific sport. “मुकुट” retains στεφανοῦται, and “नियमों के अनुसार” is the clearest contextual rendering of νομίμως. A footnote preserves the broader lexical sense “विधिपूर्वक/कानून के अनुसार.”
  issues:
  - severity: medium
    issue: “प्रतियोगिता में भाग लेता है” is weaker than the Greek athletic verb.
    rationale: It may describe simple entry or attendance rather than active competing. The repeated Greek verb is better represented by “प्रतिस्पर्धा करता है / प्रतिस्पर्धा न करे.”
  - severity: low
    issue: “विजेता का मुकुट नहीं पहनाया जाता” is somewhat overexplicit and slightly shifts the image.
    rationale: The Greek says that the competitor is not crowned, without calling the wreath “the winner’s crown.” Hindi “उसे मुकुट नहीं मिलता” is both natural and sufficiently faithful.
  revised_text: और यदि कोई खेल-प्रतियोगिता में भी प्रतिस्पर्धा करता है, तो जब तक वह नियमों के अनुसार प्रतिस्पर्धा न करे, उसे मुकुट नहीं मिलता[a]।
  revised_footnotes:
