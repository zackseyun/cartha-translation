  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: hi
  text: और यदि कोई खेल-प्रतियोगिता में भी प्रतिस्पर्धा करता है, तो जब तक वह नियमों के अनुसार प्रतिस्पर्धा न करे, उसे मुकुट नहीं मिलता[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विधिपूर्वक” या “कानून के अनुसार।” यूनानी शब्द का सामान्य अर्थ वैध या उचित रीति से है; यहाँ खेल-प्रतियोगिता के नियमों के अनुसार प्रतिस्पर्धा करना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: खिलाड़ी प्रतियोगिता में भाग लेता है / प्रतियोगिता करे
  rationale: दोनों रूपों में खेल-प्रतियोगिता का बिंब स्पष्ट रखा गया है और एक ही यूनानी क्रिया की पुनरावृत्ति को यथासंभव दर्शाया गया है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित सर्वनाम का सामान्य और सर्वसमावेशी अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: στεφανοῦται
  choice: उसे विजेता का मुकुट नहीं पहनाया जाता
  rationale: कर्मवाच्य और विजयी खिलाड़ी को मुकुट दिए जाने का प्राचीन खेल-संबंधी बिंब दोनों स्पष्ट रहते हैं।
- source_word: νομίμως
  choice: नियमों के अनुसार
  rationale: इस खेल-संदर्भ में इसका अर्थ वैध या निर्धारित रीति से, अर्थात प्रतियोगिता के नियमों के अनुसार, भाग लेना है।
- source_word: καὶ
  choice: भी
  rationale: आसपास दिए गए उदाहरणों की शृंखला में एक और उदाहरण जोड़ने वाला भाव बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यह पिछले उदाहरण से हल्का संक्रमण दिखाता है; हिन्दी में ‘और’ प्रवाह को स्वाभाविक रखता है।
theological_decisions:
- issue: मुकुट के बिंब का स्वरूप
  choice: इसे खिलाड़ी को मिलने वाले विजेता के मुकुट के रूप में बनाए रखा गया है, पर किसी विशिष्ट आत्मिक प्रतिफल की पहचान नहीं की गई।
  alternative: मुकुट को स्पष्ट रूप से अंतकालीन प्रतिफल या सेवकाई की स्वीकृति कहना।
  rationale: यूनानी पाठ खेल का रूपक देता है, किंतु इस पद में मुकुट का कोई अधिक विशिष्ट धर्मवैज्ञानिक अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘खिलाड़ी’ और ‘प्रतियोगिता’ खेल-संबंधी रूपक को प्रत्यक्ष रखते हैं; ‘विजेता का मुकुट’ στεφανοῦται के सांस्कृतिक आशय को केवल ‘सम्मानित’ कहने की अपेक्षा अधिक सटीक रूप से व्यक्त करता है।
