source:
  edition: SBLGNT
  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: hi
  text: और उनकी बात[a] गैंग्रीन की तरह फैलती जाएगी[b]। उन्हीं में हुमिनयुस और फिलेतुस हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वचन,’ ‘संदेश’ अथवा ‘शिक्षा।’
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘अपना विस्तार पाएगी’; आशय है कि वह विनाशकारी ढंग से फैलेगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: बात
  rationale: यहाँ λόγος झूठी शिक्षा देने वालों की कही हुई बात या शिक्षा को दर्शाता है। एकवचन ‘बात’ मूल के व्याकरण को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: यह λόγος के साथ संबंधसूचक सर्वनाम है और उन लोगों की ओर संकेत करता है जिनका उल्लेख पिछले संदर्भ में हुआ है।
- source_word: ὡς γάγγραινα
  choice: गैंग्रीन की तरह
  rationale: γάγγραινα शरीर के ऊतक को नष्ट करने वाली फैलती सड़न है। प्रचलित चिकित्सकीय शब्द ‘गैंग्रीन’ मूल रूपक को ‘कैंसर’ जैसे व्याख्यात्मक विकल्प से अधिक ठीक रखता है।
- source_word: νομὴν ἕξει
  choice: फैलती जाएगी
  rationale: इस मुहावरे का शाब्दिक भाव ‘अपना विस्तार/मार्ग पाना’ है; गैंग्रीन के रूपक में आशय लगातार विनाशकारी ढंग से फैलने का है।
- source_word: ὧν ἐστιν
  choice: उन्हीं में ... हैं
  rationale: यह संबंधवाचक रचना पहले बताए गए लोगों में से उदाहरण पहचानती है और हिन्दी में इसका स्वाभाविक आंशिक अर्थ देती है।
- source_word: Ὑμέναιος
  choice: हुमिनयुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: Φίλητος
  choice: फिलेतुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
theological_decisions:
- issue: रोग के रूपक का आशय
  choice: भ्रष्ट करने वाली बात को ऐसी विनाशकारी बीमारी के रूप में प्रस्तुत करना जो लगातार फैलती जाती है
  alternative: मुहावरे को अधिक शाब्दिक रूप में ‘अपना विस्तार पाएगी’ कहना
  rationale: ‘फैलती जाएगी’ समुदाय में झूठी शिक्षा के विनाशकारी प्रसार को स्पष्ट करता है, पर रूपक को उससे आगे किसी विशिष्ट धर्मवैज्ञानिक अर्थ में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गैंग्रीन’ प्रचलित चिकित्सकीय शब्द है और मूल के तीखे रोग-रूपक को सुरक्षित रखता है। पद के अगले वाक्य से जुड़े होने के कारण अंत में अल्पविराम रखा गया है।
