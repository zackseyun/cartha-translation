  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: hi
  text: और प्रभु के सेवक[a] को झगड़ालू नहीं होना चाहिए, बल्कि उसे सबके प्रति सौम्य, सिखाने में निपुण, और बुरा व्यवहार सहनेवाला होना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास।” यूनानी शब्द doulos (δοῦλος) का अर्थ संदर्भ के अनुसार “सेवक” या “दास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: सेवक
  rationale: δοῦλος का अर्थ संदर्भ के अनुसार ‘दास’ या ‘सेवक’ हो सकता है। यहाँ मुख्य बल प्रभु की सेवा करनेवाले व्यक्ति के आचरण पर है, इसलिए ‘सेवक’ आधुनिक हिन्दी में अधिक स्वाभाविक है; ‘दास’ को पादटिप्पणी में रखा गया है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: κυρίου संबंधवाचक रूप है; ‘प्रभु के सेवक’ हिन्दी में स्वाभाविक रूप से δοῦλον κυρίου को व्यक्त करता है।
- source_word: οὐ δεῖ μάχεσθαι
  choice: झगड़ा नहीं करना चाहिए
  rationale: δεῖ कर्तव्य या आवश्यकता व्यक्त करता है, और μάχεσθαι इस पासबानी संदर्भ में मुख्यतः विवादपूर्ण झगड़े को सूचित करता है।
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: सबके प्रति नम्र ... होना चाहिए
  rationale: ἤπιος को ‘नम्र’ कहना झगड़ालूपन के विपरीत सौम्य व्यवहार को सहज हिन्दी में व्यक्त करता है; πρὸς πάντας का सार्वभौमिक दायरा ‘सबके प्रति’ से सुरक्षित रहता है।
- source_word: διδακτικόν
  choice: सिखाने में निपुण
  rationale: διδακτικός का अर्थ शिक्षा ग्रहण करने योग्य नहीं, बल्कि शिक्षा देने में समर्थ या कुशल होना है; ‘सिखाने में निपुण’ योग्यता और दक्षता दोनों को व्यक्त करता है।
- source_word: ἀνεξίκακον
  choice: बुरा व्यवहार सहनेवाला
  rationale: यह दुर्लभ शब्द हानि या दुर्व्यवहार को बिना प्रतिशोध के धैर्यपूर्वक सहने का भाव रखता है। यह अनुवाद केवल सामान्य ‘धैर्यवान’ की अपेक्षा उस भाव को अधिक स्पष्ट करता है।
theological_decisions:
- issue: सेवकाई-संबंधी निर्देश में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: इस पद में सामाजिक बंधन की स्थिति से अधिक प्रभु की सेवा करनेवाले के आचरण पर बल है। ‘सेवक’ इसी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि स्रोत शब्द की अधिक कठोर सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: κύριος का संबोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: नए नियम के इस संदर्भ में κύριος के लिए ‘प्रभु’ मानक और धर्मवैचारिक रूप से खुला अनुवाद है; ‘स्वामी’ यहाँ δοῦλος के सामाजिक अर्थ को अनावश्यक रूप से प्रमुख कर सकता है।
- issue: ἀνεξίκακος में सहनशीलता का स्वरूप
  choice: बुरा व्यवहार सहनेवाला
  alternative: धैर्यवान
  rationale: स्रोत शब्द केवल सामान्य धैर्य नहीं, बल्कि बुराई या चोट सहने का संकेत देता है। स्पष्ट अनुवाद इस नैतिक तनाव को बनाए रखता है और प्रतिशोध न करने का निहित भाव प्रकट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। समांतर विशेषणों को स्वाभाविक हिन्दी वाक्य-विन्यास में जोड़ा गया है; ‘बुरा व्यवहार सहनेवाला’ दुर्लभ यूनानी विशेषण का अर्थ स्पष्ट करता है।
