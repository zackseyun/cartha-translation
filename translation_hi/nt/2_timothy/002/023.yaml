review_pass:
  verdict: revise
  source_fidelity: The command, causal participle, and metaphor of generating quarrels are conveyed accurately. However, “अज्ञानपूर्ण” is awkward in this collocation and does not clearly express ἀπαιδεύτους, which denotes being uninstructed or lacking sound learning. “अज्ञान पर आधारित” naturally conveys this quality as applied to disputes.
  naturalness: “मूर्खतापूर्ण और अज्ञान पर आधारित विवादों” is clear, idiomatic modern standard Hindi. The direct singular imperative and the contrastive “पर” fit the surrounding exhortational register.
  terminology: “विवादों,” “दूर रह,” and “झगड़ों को जन्म देते हैं” appropriately render ζητήσεις, παραιτοῦ, and γεννῶσι μάχας. The second footnote should identify “जनते हैं” as the literal image rather than calling “उत्पन्न करते हैं” literal.
  issues:
  - severity: medium
    issue: The expression “अज्ञानपूर्ण विवादों” is semantically imprecise and stylistically unnatural.
    rationale: ἀπαιδεύτους refers to disputes characterized by lack of instruction or sound understanding, not merely an abstract quality of ignorance. “अज्ञान पर आधारित” is a natural Hindi rendering that retains the contextual sense without treating sincere questions as the target.
  - severity: low
    issue: Footnote b describes “उत्पन्न करते हैं” as a literal meaning.
    rationale: γεννῶσι literally evokes begetting/giving birth; “उत्पन्न करते हैं” is an idiomatic contextual rendering, whereas “जनते हैं” retains the literal metaphor.
  revised_text: पर मूर्खतापूर्ण और अज्ञान पर आधारित विवादों[a] से दूर रह, क्योंकि तू जानता है कि वे झगड़ों को जन्म देते हैं[b]।
