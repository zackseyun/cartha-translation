  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: hi
  text: पर मूर्खतापूर्ण और अज्ञान पर आधारित विवादों[a] से दूर रह, क्योंकि तू जानता है कि वे झगड़ों को जन्म देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रश्नों’ अथवा ‘बहसों’; यूनानी शब्द खोजबीन या पूछताछ को भी दर्शा सकता है, पर यहाँ संभवतः सच्ची जिज्ञासा के बजाय झगड़ालू विवाद अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘जनते हैं’ या ‘जन्म देते हैं’; यहाँ झगड़े पैदा करने के लिए रूपक का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: मूर्खतापूर्ण
  rationale: यह शब्द विवेकहीन या निरर्थक होने का भाव देता है; ‘मूर्खतापूर्ण’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀπαιδεύτους
  choice: अज्ञानपूर्ण
  rationale: मूल शब्द प्रशिक्षण या शिक्षा के अभाव को दर्शाता है। विवादों के विशेषण के रूप में ‘अज्ञानपूर्ण’ हिन्दी में स्वाभाविक है और उन्हें केवल बौद्धिक जिज्ञासा मानने से बचाता है।
- source_word: ζητήσεις
  choice: विवादों
  rationale: यह शब्द प्रश्नों या खोजबीन को भी सूचित कर सकता है, पर इस संदर्भ में झगड़े पैदा करने वाली विवादात्मक चर्चाएँ अभिप्रेत हैं।
- source_word: παραιτοῦ
  choice: से दूर रह
  rationale: मध्यवाच्य आज्ञार्थक रूप इनमें भाग लेने से इनकार करने या बचने का निर्देश देता है; ‘से दूर रह’ हिन्दी में स्पष्ट और स्वाभाविक आज्ञा है।
- source_word: εἰδὼς
  choice: क्योंकि तू जानता है
  rationale: कृदन्त आज्ञा का कारण बताता है। हिन्दी में कारणसूचक उपवाक्य इसका आशय सहज ढंग से व्यक्त करता है।
- source_word: γεννῶσι
  choice: जन्म देते हैं
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘जन्म देना’ है और यहाँ झगड़े उत्पन्न करने के लिए रूपक रूप में प्रयुक्त है; हिन्दी में भी यह रूपक स्वाभाविक है।
- source_word: μάχας
  choice: झगड़ों
  rationale: यह शब्द लड़ाइयों या विवादात्मक टकरावों को दर्शाता है; इस मौखिक और संबंधपरक संदर्भ में ‘झगड़ों’ उपयुक्त है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन के साथ हल्का विरोध दर्शाता है; ‘पर’ इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
