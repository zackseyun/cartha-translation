  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: hi
  text: जो सत्य से भटक गए हैं[a], यह कहते हुए कि पुनरुत्थान पहले ही हो चुका है[b], और कुछ लोगों के विश्वास को डिगा रहे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सत्य के विषय में निशाना चूक गए हैं”; या “सत्य से हट गए हैं।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे दावा कर रहे थे कि भावी पुनरुत्थान पहले ही हो चुका है; पद यह नहीं बताता कि वे इस दावे को किस प्रकार समझाते थे।
    reason: theological_ambiguity
  - marker: c
    text: या “कुछ लोगों के विश्वास को उलट रहे हैं” अथवा “अस्त-व्यस्त कर रहे हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: जो
  rationale: यह पहले उल्लिखित झूठे शिक्षकों की ओर संकेत करने वाला संबंधवाचक सर्वनाम है; आधुनिक हिन्दी में ‘जो’ स्वाभाविक और पर्याप्त है।
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: सत्य से भटक गए हैं
  rationale: ἀστοχέω का मूल भाव लक्ष्य चूकना है, पर इस प्रसंग में यह सत्य से च्युत होने को व्यक्त करता है। ‘सत्य से भटक गए हैं’ मुहावरेदार हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: λέγοντες
  choice: वे कहते हैं कि
  rationale: कृदन्त झूठी शिक्षा की विषयवस्तु बताता है। हिन्दी में अलग वाक्य के साथ ‘वे कहते हैं कि’ अधिक स्वाभाविक है और पूर्ववर्ती ‘जो’ का संदर्भ स्पष्ट रहता है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यहाँ शब्द अंतिम समय के परिचित पुनरुत्थान की ओर संकेत करता है; हिन्दी मसीही और सामान्य धार्मिक प्रयोग में ‘पुनरुत्थान’ सटीक और प्रतिष्ठित शब्द है।
- source_word: ἤδη γεγονέναι
  choice: पहले ही हो चुका है
  rationale: ἤδη समयगत ‘पहले ही’ को और perfect infinitive पूर्ण हो चुकी घटना तथा उसके वर्तमान प्रभाव को व्यक्त करता है।
- source_word: ἀνατρέπουσιν
  choice: डिगा रहे हैं
  rationale: क्रिया का अर्थ उलट देना, अस्त-व्यस्त करना या नष्ट करना हो सकता है। विश्वास के साथ ‘डिगा रहे हैं’ चल रहे अस्थिरकारी प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना पूर्ण धर्मत्याग का दावा किए।
- source_word: τήν τινων πίστιν
  choice: कुछ लोगों का विश्वास
  rationale: τινων अनिश्चित ‘कुछ लोगों’ को दर्शाता है और πίστις के लिए ‘विश्वास’ इस प्रसंग में सबसे सीधा तथा कम व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: ‘पुनरुत्थान पहले ही हो चुका है’ का आशय
  choice: झूठे दावे को उसी रूप में प्रस्तुत किया गया है कि पुनरुत्थान पहले ही घट चुका है।
  alternative: इसे केवल आत्मिक पुनरुत्थान या भावी शारीरिक पुनरुत्थान के स्पष्ट निषेध के रूप में खोलकर कहना।
  rationale: यूनानी पाठ झूठी शिक्षा की विस्तृत प्रणाली नहीं बताता। अनुवाद दावे को सुरक्षित रखता है और फुटनोट केवल प्रसंगगत निहितार्थ स्पष्ट करता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: ‘विश्वास’ यहाँ व्यक्ति के भरोसे और विश्वासगत स्थिरता दोनों को खुला रखता है; ‘भरोसा’ अर्थ को कुछ अधिक मनोवैज्ञानिक बना सकता है।
- issue: ἀνατρέπουσιν की तीव्रता
  choice: डिगा रहे हैं
  alternative: उलट रहे हैं / नष्ट कर रहे हैं
  rationale: क्रिया गंभीर अस्थिरता दर्शाती है, पर पद अपने आप यह निश्चित नहीं करता कि उन लोगों का विश्वास पूरी तरह नष्ट हो चुका था।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘पुनरुत्थान’ पारंपरिक किंतु आज भी बोधगम्य धर्मशास्त्रीय पद है। यूनानी संबंधवाचक संरचना को हिन्दी की स्वाभाविकता के लिए दो वाक्यों में रखा गया है; ‘वे’ का संदर्भ पूर्ववर्ती ‘जो’ से स्पष्ट है।
