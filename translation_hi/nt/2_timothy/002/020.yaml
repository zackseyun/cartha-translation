  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: hi
  text: एक बड़े घर में सोने और चाँदी के बरतन ही नहीं होते, बल्कि लकड़ी और मिट्टी के[a] भी होते हैं; और कुछ आदर के लिए, तो कुछ अनादर के लिए[b] होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिट्टी के’ से आशय पकी मिट्टी या मृद्भांड से बने बरतनों से है।
    reason: cultural_note
  - marker: b
    text: अर्थात् ‘कुछ सम्मानजनक उपयोग के लिए और कुछ अपमानजनक उपयोग के लिए।’ यूनानी में अधिक शाब्दिक रूप से ‘आदर के लिए ... अनादर के लिए’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: एक बड़े घर में
  rationale: यह आकार अथवा प्रतिष्ठा वाले बड़े गृह की छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: σκεύη
  choice: बरतन
  rationale: घरेलू संदर्भ में यह व्यापक, सहज शब्द है और विभिन्न पदार्थों से बनी उपयोगी वस्तुओं की छवि स्पष्ट रखता है।
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: सोने और चाँदी के
  rationale: विशेषण इन बरतनों की निर्माण-सामग्री बताते हैं; हिन्दी में संबंधकारक रूप स्वाभाविक है।
- source_word: ξύλινα καὶ ὀστράκινα
  choice: लकड़ी और मिट्टी के
  rationale: ξύλινα का अर्थ लकड़ी से बने और ὀστράκινα का अर्थ पकी मिट्टी/मृद्भांड से बने हैं; संक्षिप्त हिन्दी में दोनों पदार्थ स्पष्ट हैं।
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: और कुछ ... तो कुछ ...
  rationale: यह μέν...δέ की परस्पर-विरोधी श्रेणियों को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: εἰς τιμήν
  choice: आदर के लिए
  rationale: अमूर्त संज्ञा τιμή को कार्य-विशेष में सीमित किए बिना उसके आदर/सम्मान के भाव सहित रखा गया है।
- source_word: εἰς ἀτιμίαν
  choice: अनादर के लिए
  rationale: यह ἀτιμία को उसके विलोम τιμή के समानांतर रखता और मूल का स्पष्ट शब्दगत विरोध बचाता है।
- source_word: δὲ (initial)
  choice: पर
  rationale: प्रारम्भिक δέ पिछले कथन के साथ संक्रमण और हल्का विरोध दर्शाता है; हिन्दी में 'पर' इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या τιμή/ἀτιμία को उपयोगगत अर्थ में समझाकर अनुवाद किया जाए या मूल के आदर/अनादर वाले अमूर्त विरोध को रखा जाए
  choice: मुख्य पाठ में ‘आदर के लिए ... अनादर के लिए’
  alternative: ‘सम्मानजनक उपयोग के लिए ... अपमानजनक उपयोग के लिए’ अथवा ‘विशेष काम के लिए ... साधारण काम के लिए’
  rationale: यद्यपि घरेलू रूपक उपयोग की ओर संकेत करता है, यूनानी पाठ अमूर्त संज्ञाएँ τιμή और ἀτιμία रखता है। शाब्दिक विरोध अगले पद से जुड़ी नैतिक और धर्मवैचारिक अर्थ-सम्भावना को समय से पहले सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली अपनाई गई है। ‘बरतन’ सामान्य पाठक के लिए ‘पात्र’ से अधिक स्वाभाविक है। मिट्टी से बने बरतनों का आशय पकी मिट्टी या मृद्भांड से है; मुख्य पाठ में अनावश्यक तकनीकीपन से बचा गया है।
