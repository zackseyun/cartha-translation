id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: hi
  text: इन बातों की याद उन्हें दिलाते रहो और प्रभु[b] के सामने उन्हें गंभीरतापूर्वक ताकीद करो कि वे शब्दों पर वाद-विवाद न करें; इसका कोई लाभ नहीं होता[a], बल्कि इससे सुननेवालों का विनाश होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह किसी काम का नहीं।”
    reason: lexical_alternative
  - marker: b
    text: “प्रभु” का संदर्भ यहाँ स्पष्ट रूप से निर्दिष्ट नहीं है; इसका अर्थ परमेश्वर या विशेष रूप से प्रभु यीशु हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: इन बातों की
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछली शिक्षाओं की ओर संकेत करता है; हिंदी में ‘इन बातों’ से उसका पूर्वसंदर्भ स्वाभाविक रूप से बना रहता है।
- source_word: ὑπομίμνῃσκε
  choice: याद उन्हें दिलाते रहो
  rationale: वर्तमानकालीन आज्ञार्थक का निरंतर या बार-बार किए जाने वाले कार्य का पक्ष ‘दिलाते रहो’ से व्यक्त होता है। ‘उन्हें’ प्रसंग से पूरित कर्म है।
- source_word: διαμαρτυρόμενος
  choice: गंभीरता से चेतावनी दो
  rationale: यह कृदंत दृढ़ और गंभीर आग्रह अथवा चेतावनी का भाव रखता है; हिंदी में यह पदबंध साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐνώπιον τοῦ κυρίου
  choice: प्रभु के सामने
  rationale: यह अभिव्यक्ति प्रभु को साक्षी मानकर दी गई गंभीर आज्ञा का भाव रखती है और κύριος के संदर्भ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: μὴ λογομαχεῖν
  choice: शब्दों को लेकर झगड़ा न करें
  rationale: λογομαχέω शब्दों पर विवाद या वाद-विवाद में उलझने को बताता है; चुनी हुई हिंदी स्वाभाविक है और उसके नकारात्मक भाव को बनाए रखती है।
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: इससे कोई लाभ नहीं होता
  rationale: यह वाक्यांश पूर्ण निष्फलता व्यक्त करता है; ‘कोई लाभ नहीं’ आधुनिक हिंदी में स्पष्ट है और इसे शब्द-विवाद से जोड़ता है।
- source_word: ἐπὶ καταστροφῇ
  choice: बल्कि ... का विनाश होता है
  rationale: καταστροφή गंभीर हानि, उलटाव या विनाश बताता है। ‘विनाश’ उसकी तीव्रता बनाए रखता है, जबकि पादटिप्पणी संभावित अर्थ-सीमा स्पष्ट करती है।
- source_word: τῶν ἀκουόντων
  choice: सुननेवालों का
  rationale: संज्ञात्मक वर्तमान कृदंत उन लोगों को दर्शाता है जो यह विवाद सुनते हैं; ‘सुननेवालों’ संक्षिप्त और स्वाभाविक हिंदी है।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: प्रभु
  alternative: परमेश्वर; प्रभु यीशु
  rationale: यूनानी पाठ केवल ‘प्रभु’ कहता है। यह पद विशेष रूप से परमेश्वर या प्रभु यीशु में से किसी एक को स्पष्ट नहीं करता, इसलिए वास्तविक संदिग्धता को बनाए रखा गया है।
- issue: καταστροφή की तीव्रता
  choice: विनाश
  alternative: बरबादी; गंभीर हानि
  rationale: मुख्य पाठ में यूनानी शब्द की गंभीरता सुरक्षित रखी गई है, पर इसका आशय अनिवार्यतः अंतिम आत्मिक दंड है या व्यापक नैतिक/आत्मिक क्षति—यह पाठ स्पष्ट नहीं करता; इसलिए पादटिप्पणी में अर्थ-सीमा बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘शब्दों को लेकर झगड़ा’ बोलचाल की स्पष्टता और मूल के नकारात्मक अर्थ, दोनों को व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
