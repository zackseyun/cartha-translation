id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: hi
  text: पर जवानी की अभिलाषाओं[a] से भागो और धार्मिकता[b], विश्वास[c], प्रेम और शान्ति के पीछे लगे रहो—उन लोगों के साथ, जो शुद्ध हृदय से प्रभु को पुकारते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जवानी की लालसाओं।’ यूनानी पदबंध युवावस्था की विशेषता मानी जाने वाली इच्छाओं को व्यापक रूप से बता सकता है; इसका अर्थ केवल यौन वासना नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय।’ यूनानी शब्द में नैतिक सहीपन के साथ सम्बन्धपरक या विधिक न्याय का भाव भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘विश्वासयोग्यता।’ यूनानी शब्द प्रसंग के अनुसार विश्वास, भरोसा या विश्वासयोग्यता बता सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: जवानी की अभिलाषाओं
  rationale: यह पदबंध युवावस्था से जुड़ी इच्छाओं या लालसाओं को व्यापक रूप में व्यक्त करता है; इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: φεῦγε
  choice: से भागो
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया निरन्तर और दृढ़तापूर्वक दूर रहने का सजीव भाव रखती है।
- source_word: δίωκε
  choice: के पीछे लगे रहो
  rationale: नैतिक सन्दर्भ में यह सक्रिय और निरन्तर प्रयास बताता है तथा ‘भागो’ के साथ मूल पाठ का प्रभावशाली विरोध बनाए रखता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह नैतिक रूप से सही जीवन का स्वाभाविक हिन्दी रूप है; यूनानी शब्द में न्याय का सम्बन्धपरक या विधिक भाव भी सम्भव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का सामान्य और प्रसंगानुकूल रूप; सद्गुणों की सूची में ‘विश्वासयोग्यता’ भी सम्भव अर्थ है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी रूप।
- source_word: εἰρήνην
  choice: शान्ति
  rationale: सद्गुणों की सूची में εἰρήνη का सीधा और स्वाभाविक रूप।
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: उन लोगों के साथ, जो ... प्रभु को पुकारते हैं
  rationale: μετά सहभागिता बताता है; यह रचना अन्य विश्वासियों के साथ मिलकर इन सद्गुणों का अनुसरण करने का भाव सुरक्षित रखती है।
- source_word: ἐκ καθαρᾶς καρδίας
  choice: शुद्ध हृदय से
  rationale: ἐκ आन्तरिक स्रोत को बताता है; हिन्दी में यह स्वाभाविक ढंग से निष्कपट आह्वान का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘νεωτερικὰς ἐπιθυμίας’ का दायरा
  choice: युवावस्था से जुड़ी व्यापक अभिलाषाएँ
  alternative: मुख्यतः यौन वासनाएँ
  rationale: यूनानी पदबंध अपने आप में केवल यौन इच्छा तक सीमित नहीं है; आसपास का प्रसंग चरित्र और आचरण से सम्बन्धित व्यापक नैतिक चेतावनी देता है।
- issue: δικαιοσύνη का अनुवाद
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’
  rationale: इस सद्गुण-सूची में नैतिक सहीपन प्रमुख है, फिर भी शब्द के न्यायसम्बन्धी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: πίστις का अनुवाद
  choice: मुख्य पाठ में ‘विश्वास’
  alternative: ‘विश्वासयोग्यता’
  rationale: दोनों अर्थ सम्भव हैं; व्यापक और प्रचलित अर्थ मुख्य पाठ में है, जबकि नैतिक सद्गुण के रूप में विश्वासयोग्यता की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘भागो’ और ‘पीछे लगे रहो’ मूल यूनानी की गतिशील आज्ञाओं और उनके विरोध को बनाए रखते हैं; ‘जवानी की अभिलाषाएँ’ अर्थ को अनावश्यक रूप से केवल यौन क्षेत्र तक सीमित नहीं करता।
