translation:
  language: hi
  text: मसीह यीशु के एक अच्छे सैनिक की तरह दुःख सहने में सहभागी बनो[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह यीशु के एक अच्छे सैनिक की तरह मेरे साथ कठिनाई सहो।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “ख्रिस्तोस यीशु”; “ख्रिस्तोस” एक उपाधि है, जिसका अर्थ “मसीह,” अर्थात् “अभिषिक्त जन,” है।
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: दुःख सहने में सहभागी हो
  rationale: यह एकवचन आज्ञार्थक क्रिया है। σύν- उपसर्ग दूसरों के साथ या साझे रूप में दुःख सहने का भाव देता है। इस अनुवाद में सहभागिता का भाव सुरक्षित है, पर यूनानी पाठ में स्पष्ट रूप से न आए ‘मेरे साथ’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ὡς
  choice: के समान
  rationale: यह तुलना और आचरण की रीति बताने वाला सामान्य अव्यय है।
- source_word: καλὸς
  choice: अच्छे
  rationale: सैनिक के संदर्भ में यह प्रशंसनीय गुण और उपयुक्तता का भाव व्यक्त करता है; ‘अच्छे’ सहज और पर्याप्त है।
- source_word: στρατιώτης
  choice: सैनिक
  rationale: यह सैनिक के लिए सामान्य शब्द है और पौलुस के रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिन्दी बाइबिलीय प्रयोग में इस उपाधि का स्वाभाविक और अर्थपूर्ण रूप है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: Ἰησοῦς नाम का मानक हिन्दी रूप; यहाँ Χριστοῦ के साथ संबंधकारक पदबंध में है।
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: यह पदबंध उपाधि और व्यक्तिगत नाम से बना है। ‘मसीह यीशु’ उपाधि का अर्थ और हिन्दी में उसका परिचित रूप दोनों सुरक्षित रखता है।
- issue: συγκακοπάθησον में सहभागिता किसके साथ है
  choice: दुःख सहने में सहभागी हो
  alternative: मेरे साथ कठिनाई सह
  rationale: क्रिया साझे दुःख का भाव रखती है, पर इस पद में सहभागी व्यक्ति स्पष्ट नहीं किया गया। मुख्य पाठ इस अस्पष्टता को बनाए रखता है; संदर्भ के आधार पर ‘मेरे साथ’ समझना संभव है और इसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन आज्ञार्थक ‘हो’ मूल संबोधन की प्रत्यक्षता बनाए रखता है। ‘दुःख सहने में सहभागी हो’ थोड़ा औपचारिक होते हुए भी σύν- उपसर्ग के साझे दुःख के भाव को स्पष्ट करता है।
