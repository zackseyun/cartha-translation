source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: hi
  text: क्योंकि ऐसा समय आएगा जब लोग खरी शिक्षा को सहन नहीं करेंगे,[a] बल्कि अपनी इच्छाओं के अनुसार अपने लिए शिक्षकों का ढेर लगा लेंगे, कान खुजलाते हुए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वस्थ शिक्षा को बर्दाश्त नहीं करेंगे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कान खुजलाते हुए।” यह बिंब वही सुनने की लालसा दर्शाता है जो मन को भाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: ऐसा समय
  rationale: यहाँ καιρός आने वाले एक विशेष समय या अवसर को दर्शाता है; ‘ऐसा समय आएगा’ भविष्यसूचक वाक्य में स्वाभाविक हिन्दी है।
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: खरी शिक्षा
  rationale: ὑγιαίνω का मूल बिंब ‘स्वस्थ’ होने का है और यहाँ रूपकतः सही तथा हितकारी शिक्षा का अर्थ देता है। ‘खरी शिक्षा’ आधुनिक हिन्दी में सहज है और अनावश्यक पारिभाषिक बोझ से बचती है।
- source_word: οὐκ ἀνέξονται
  choice: सहन नहीं करेंगे
  rationale: ἀνέχομαι का अर्थ सहना या बर्दाश्त करना है; ‘सहन नहीं करेंगे’ उनकी अस्वीकार करने की प्रवृत्ति को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: अपनी इच्छाओं के अनुसार
  rationale: ἐπιθυμίαι यहाँ व्यापक रूप से अपनी चाहतों या लालसाओं को दर्शाता है; इसे केवल कामवासना तक सीमित करना अनुचित होगा।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: यह आत्मवाचक सम्प्रदान कारक है और बताता है कि वे अपनी ही पसंद और प्रयोजन के लिए शिक्षक जुटाएँगे।
- source_word: ἐπισωρεύσουσιν
  choice: ढेर लगा लेंगे
  rationale: क्रिया में बड़ी मात्रा में जमा करने या ढेर लगाने का सजीव भाव है, जिसे इस वाक्यांश ने बनाए रखा है।
- source_word: διδασκάλους
  choice: शिक्षकों
  rationale: संदर्भ में साधारण अर्थ ‘शिक्षक’ पर्याप्त है; किसी विशेष धार्मिक पदनाम की आवश्यकता नहीं है।
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: क्योंकि उनके कान खुजलाते होंगे
  rationale: यह मुहावरेदार बिंब ऐसी सुनने की लालसा बताता है जिसमें लोग वही सुनना चाहते हैं जो उन्हें भाए। हिन्दी में ‘कान खुजलाना’ यूनानी बिंब को बनाए रखता है; ‘क्योंकि’ मुख्य क्रिया से इसका प्रेरक संबंध सहज बनाता है।
theological_decisions:
- issue: διδασκαλία का अनुवाद
  choice: शिक्षा
  alternative: सिद्धांत
  rationale: शब्द का अर्थ यहाँ दी जाने वाली शिक्षा है। ‘शिक्षा’ सामान्य पाठक के लिए अधिक सहज है और ऐसा पारिभाषिक या सम्प्रदायगत भार नहीं जोड़ती जो यूनानी में अनिवार्य नहीं है।
- issue: ὑγιαινούσης के रूपक का निर्वाह
  choice: खरी
  alternative: स्वस्थ
  rationale: ‘स्वस्थ शिक्षा’ अधिक शाब्दिक है, पर हिन्दी में कुछ अस्वाभाविक लग सकती है। ‘खरी शिक्षा’ सही, भरोसेमंद और हितकारी शिक्षा का आशय स्वाभाविक ढंग से देती है।
- issue: κνηθόμενοι τὴν ἀκοήν का संबंध
  choice: क्योंकि उनके कान खुजलाते होंगे
  alternative: कान खुजलाते हुए
  rationale: यूनानी वर्तमान कृदन्त का संबंध परिस्थितिजन्य अथवा प्रेरक समझा जा सकता है। मुख्य पाठ प्रेरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि टिप्पणी मूल बिंब और उसके आशय को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य में यूनानी के भविष्यकाल, विरोधसूचक संरचना और ‘ढेर लगाने’ तथा ‘कान खुजलाने’ के सजीव बिंब सुरक्षित रखे गए हैं।
