  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: hi
  text: क्योंकि देमास ने इस वर्तमान युग से प्रेम करके मुझे छोड़ दिया[a] और थिस्सलुनीके चला गया। क्रेस्केंस गलातिया गया और तीतुस दलमतिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस वर्तमान संसार से प्रेम करके मुझे त्याग दिया” भी संभव। यूनानी अभिव्यक्ति का अधिक शाब्दिक अर्थ वर्तमान युग या काल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: मुझे छोड़ दिया
  rationale: यह स्वाभाविक आधुनिक हिन्दी में किसी को संकट में छोड़ जाने की गंभीर और नकारात्मक भावना व्यक्त करता है, पर अपने-आप धर्मत्याग का दावा नहीं करता।
- source_word: ἀγαπήσας
  choice: से प्रेम करके
  rationale: कृदन्त Demas के वर्तमान युग से प्रेम और पौलुस को छोड़ने के बीच घनिष्ठ संबंध रखता है; हिन्दी में यह कारणसूचक अर्थ की संभावना बनाए रखते हुए सहज है।
- source_word: τὸν νῦν αἰῶνα
  choice: इस वर्तमान युग
  rationale: αἰών के कालगत और नैतिक अर्थ को सुरक्षित रखता है तथा इसे भौतिक संसार समझे जाने से बचाता है।
- source_word: ἐπορεύθη
  choice: चला गया
  rationale: गंतव्य की ओर जाने के साधारण कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Θεσσαλονίκην
  choice: थिस्सलुनीके
  rationale: यूनानी स्थान-नाम का स्रोत-सापेक्ष हिन्दी लिप्यंतरण।
- source_word: Κρήσκης
  choice: क्रेस्केंस
  rationale: यूनानी व्यक्तिगत नाम का स्पष्ट हिन्दी लिप्यंतरण।
- source_word: Γαλατίαν
  choice: गलातिया
  rationale: क्षेत्र के नाम का प्रचलित बाइबलीय हिन्दी रूप।
- source_word: Τίτος
  choice: तीतुस
  rationale: व्यक्तिगत नाम का प्रचलित बाइबलीय हिन्दी रूप।
- source_word: Δαλματίαν
  choice: दलमतिया
  rationale: क्षेत्र के नाम का स्रोत-सापेक्ष हिन्दी लिप्यंतरण।
- source_word: γάρ
  choice: क्योंकि
  rationale: पिछले प्रसंग में दिए गए अनुरोध के कारण या स्पष्टीकरण से इस कथन का संबंध स्पष्ट करता है।
theological_decisions:
- issue: क्या देमास के जाने को धर्मत्याग मानकर अनूदित किया जाए या केवल पौलुस को छोड़ना
  choice: “मुझे छोड़ दिया” द्वारा कार्य की नैतिक गंभीरता व्यक्त की गई, लेकिन धर्मत्याग स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ऐसा अधिक प्रबल अनुवाद जो देमास के विश्वास छोड़ देने का संकेत दे।
  rationale: पाठ कहता है कि देमास ने वर्तमान युग से प्रेम करके पौलुस को छोड़ा; वह उसके अंतिम आध्यात्मिक परिणाम को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यूनानी में क्रेस्केंस और तीतुस के साथ जाने की क्रिया लुप्त है; स्पष्ट हिन्दी के लिए “चले गए” जोड़ा गया है।
