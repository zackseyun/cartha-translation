    reason: यूनानी वर्तमान कृदंत ἀσθενοῦντα को हिन्दी में परिस्थितिवाचक उपवाक्य के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: Ἔραστος
  choice: इरास्तुस
  rationale: व्यक्तिवाचक नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: ἔμεινεν
  choice: रह गया
  rationale: यहाँ μένω का अर्थ किसी स्थान पर ठहरना या वहीं रह जाना है; यात्रा-वृत्तांत में ‘रह गया’ स्वाभाविक और स्पष्ट है।
- source_word: ἐν Κορίνθῳ
  choice: कुरिन्थुस में
  rationale: ἐν का स्थानीय अर्थ है और नगर के नाम के साथ हिन्दी में ‘में’ स्वाभाविक है।
- source_word: Τρόφιμον
  choice: त्रुफिमुस
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: δὲ
  choice: लेकिन
  rationale: δέ दोनों यात्रा-सूचनाओं के बीच हल्का विरोध दर्शाता है; ‘लेकिन’ उसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπέλιπον
  choice: मैं ... छोड़ आया
  rationale: ἀπολείπω के प्रथम पुरुष एकवचन भूतकालीन रूप का अर्थ यहाँ किसी व्यक्ति को एक स्थान पर छोड़कर आगे चले जाना है; ‘छोड़ आया’ हिन्दी में इस यात्रा-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν Μιλήτῳ
  choice: मिलेतुस में
  rationale: नगर के नाम के साथ ἐν का सामान्य स्थानीय अर्थ ‘में’ है।
- source_word: ἀσθενοῦντα
  choice: बीमार हालत में
  rationale: वर्तमान कृदंत त्रुफिमुस की उस समय की अवस्था बताता है जब पौलुस ने उसे छोड़ा; यह अनुवाद बीमारी और समकालिक परिस्थिति दोनों को स्पष्ट रखता है।
