source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: hi
  text: परन्तु प्रभु मेरे साथ खड़ा रहा और उसने मुझे सामर्थ्य दी, ताकि मेरे द्वारा सन्देश का प्रचार पूरा हो और सभी गैर-यहूदी लोग सुनें[a]; और मैं सिंह के मुँह से बचाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब राष्ट्र सुनें।” यूनानी शब्द ἔθνη का अर्थ “गैर-यहूदी लोग” या “राष्ट्र” हो सकता है; यहाँ सम्भवतः गैर-यहूदी लोगों तक सुसमाचार पहुँचने की बात है।
    reason: lexical_alternative
  - marker: b
    text: “सिंह के मुँह से” शायद किसी वास्तविक सिंह के बजाय प्राणघातक खतरे से बचाए जाने की आलंकारिक अभिव्यक्ति है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: परन्तु प्रभु
  rationale: δέ पिछले वचन से विरोध दिखाता है, और κύριος को बिना उसके संदर्भ को अधिक स्पष्ट किए पारंपरिक तथा स्वाभाविक रूप से ‘प्रभु’ कहा गया है।
- source_word: μοι παρέστη
  choice: मेरे साथ खड़ा हुआ
  rationale: यह केवल स्थानिक उपस्थिति नहीं, बल्कि संकट में सहायक उपस्थिति व्यक्त करता है; हिन्दी मुहावरा मूल चित्र को भी बनाए रखता है।
- source_word: ἐνεδυνάμωσέν με
  choice: उसने मुझे सामर्थ्य दी
  rationale: ἐνδυναμόω का अर्थ बलवान या समर्थ करना है; यह रूप आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ
  choice: मेरे द्वारा सन्देश का प्रचार पूरी तरह पूरा हो
  rationale: διά माध्यम को, κήρυγμα घोषित सन्देश और उसके प्रचार को, तथा πληροφορέω यहाँ प्रचार-कार्य के पूर्ण निष्पादन को व्यक्त करता है। यह अनुवाद केवल ‘सन्देश पूरा हो’ जैसे अस्पष्ट अर्थ से बचता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब गैर-यहूदी लोग
  rationale: पौलुस की सेवकाई के सन्दर्भ में ἔθνη का सम्भावित अर्थ गैर-यहूदी जनसमुदाय है; ‘सब राष्ट्र’ की वास्तविक शाब्दिक सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: ἐρρύσθην ἐκ στόματος λέοντος
  choice: मैं सिंह के मुँह से बचाया गया
  rationale: निष्क्रिय क्रिया और मूल की सजीव छवि दोनों सुरक्षित हैं; वाक्य यह तय नहीं करता कि सिंह शाब्दिक है या आलंकारिक।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: केवल ‘प्रभु’
  alternative: विशेष रूप से यीशु; अथवा सामान्यतः परमेश्वर
  rationale: निकट सन्दर्भ से अनेक पाठक इसे पुनरुत्थित प्रभु यीशु समझेंगे, पर मूल पद स्वयं नाम स्पष्ट नहीं करता; इसलिए अनुवाद उसकी अस्पष्टता बनाए रखता है।
- issue: ‘सिंह के मुँह से’ का आशय
  choice: मूल चित्र को यथावत रखना
  alternative: नीरो, शैतान, मृत्युदण्ड, अथवा सचमुच किसी सिंह के लिए स्पष्ट व्याख्या
  rationale: पद किसी एक ऐतिहासिक या धर्मवैज्ञानिक पहचान को निश्चित नहीं करता। शाब्दिक रूप से छवि बनाए रखने पर वास्तविक खतरे से छुटकारे का भाव और सम्भावित संकेत दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘सन्देश का प्रचार’ κήρυγμα के विषय और घोषणा—दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पाद-टिप्पणी चिह्न सम्बन्धित वाक्यांशों के बाद रखे गए हैं।
