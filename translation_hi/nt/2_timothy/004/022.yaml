  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: hi
  text: प्रभु तुम्हारी आत्मा के साथ हों। अनुग्रह तुम सब के साथ हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में पहले ‘तुम्हारी आत्मा’ एकवचन है, फिर ‘तुम सब’ बहुवचन है।
    reason: एकवचन से बहुवचन में मूल पाठ के परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: निश्चित पदवी के रूप में यह पौलुस के समापन आशीर्वाद में स्वाभाविक है और यूनानी पाठ से आगे बढ़कर ‘यीशु’ नहीं जोड़ता।
- source_word: μετὰ
  choice: के साथ हों / के साथ हो
  rationale: यूनानी में क्रिया व्यक्त नहीं है, पर आशीर्वचन की भावना को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘होना’ आवश्यक है। पहले वाक्य में आदरसूचक एकवचन ‘हों’ और दूसरे में बहुवचन ‘हो’ रखा गया है।
- source_word: πνεύματός
  choice: आत्मा
  rationale: ‘तुम्हारी’ के साथ यह तीमुथियुस की मानवीय आत्मा का संकेत देता है; इसलिए इसे पवित्र आत्मा के नाम के रूप में स्पष्ट नहीं किया गया।
- source_word: σου
  choice: तुम्हारी
  rationale: यूनानी एकवचन को सुरक्षित रखता है और पहला आशीर्वचन सीधे तीमुथियुस को संबोधित करता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह पौलुस के आशीर्वचनों का प्रचलित, अर्थपूर्ण और गरिमापूर्ण हिन्दी प्रतिशब्द है।
- source_word: ὑμῶν
  choice: तुम सब
  rationale: यूनानी बहुवचन को स्पष्ट करता है और पहले उपवाक्य के एकवचन से हुए बदलाव को बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: पौलुस के समापन आशीर्वाद के संदर्भ में प्रभु यीशु की ओर संकेत, पर अनुवाद में केवल ‘प्रभु’
  alternative: परमेश्वर का अधिक सामान्य संदर्भ
  rationale: पौलुस की पत्र-समापन शैली में ‘प्रभु’ सामान्यतः यीशु के लिए आता है, फिर भी यूनानी पाठ नाम नहीं जोड़ता; इसलिए अनुवाद भी अस्पष्टता की सीमा बनाए रखता है।
- issue: दोनों उपवाक्यों में वचन का परिवर्तन
  choice: पहला आशीर्वचन तीमुथियुस के लिए एकवचन में और दूसरा व्यापक समूह के लिए बहुवचन में
  alternative: दोनों को केवल तीमुथियुस के लिए मानकर हिन्दी में वचन-भेद अस्पष्ट करना
  rationale: यूनानी में σου एकवचन और ὑμῶν बहुवचन है; इस साहित्यिक और धर्मवैचारिक संकेत को स्पष्ट हिन्दी में बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन। ‘आप’ के बजाय ‘तुम’ बाइबलीय व्यक्तिगत संबोधन और एकवचन-बहुवचन भेद को स्पष्ट रखता है; ‘प्रभु’ के साथ आदरसूचक ‘हों’ स्वाभाविक हिन्दी सम्मान व्यक्त करता है।
