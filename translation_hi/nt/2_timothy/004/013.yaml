  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। यूनानी पदक्रम की कठोर नकल के बजाय समय-सूचक कृदंत और आज्ञा को हिन्दी के स्वाभाविक ‘जब...तो’ ढाँचे में रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं; विषय-संबंधी पादटिप्पणी [b] को वाक्य के अंत में रखा गया है ताकि वह ‘चोगा’ के वैकल्पिक अर्थ को बिना मुख्य पाठ बाधित किए दर्ज करे।
