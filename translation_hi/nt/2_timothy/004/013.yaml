base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: hi
  text: जब तुम आओ, तो वह चोगा[b], जिसे मैं त्रोआस में कारपुस के पास छोड़ आया था, और वे पुस्तकें[a] ले आना—विशेषकर वे चर्मपत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्क्रॉल”; यूनानी शब्द लिखित स्क्रॉलों या ऐसी ही लिखित सामग्री के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ व्याख्याकार “चोगा” को पुस्तकों का खोल या आवरण समझते हैं, पर यूनानी शब्द का सामान्य अर्थ ऊपर पहना जाने वाला वस्त्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: चोगा
  rationale: यह यूनानी संज्ञा सामान्यतः ऊपर पहना जाने वाला बाहरी वस्त्र दर्शाती है। ‘चोगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; पुस्तकें रखने के खोल का प्रस्तावित अर्थ कम संभावित है।
- source_word: ἀπέλιπον
  choice: छोड़ आया था
  rationale: प्रथम पुरुष एकवचन भूतकालीन क्रिया को हिन्दी में प्रसंगानुकूल रूप से व्यक्त करता है और यह संकेत देता है कि पौलुस उस वस्तु को वहाँ छोड़कर चला आया था।
- source_word: ἐν Τρῳάδι παρὰ Κάρπῳ
  choice: त्रोआस में कारपुस के पास
  rationale: ἐν स्थान को और παρά के साथ सम्प्रदान कारक किसी व्यक्ति के पास या उसकी देखरेख में होने को व्यक्त करता है।
- source_word: ἐρχόμενος φέρε
  choice: जब तुम आओ, तो ... ले आना
  rationale: कृदंत का समय-सूचक संबंध आज्ञार्थक क्रिया से है। गंतव्य वक्ता की ओर होने के कारण हिन्दी में ‘ले आना’ स्वाभाविक है।
- source_word: τὰ βιβλία
  choice: वे पुस्तकें
  rationale: βιβλία लिखित सामग्रियों, पुस्तकों या ग्रंथ-लपेटों को सूचित कर सकता है। मुख्य पाठ में व्यापक और सहज ‘पुस्तकें’ रखा गया है तथा भौतिक रूप की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: μάλιστα
  choice: विशेषकर
  rationale: यह अगले पद पर विशेष बल देता है; ‘विशेषकर’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: τὰς μεμβράνας
  choice: वे चर्मपत्र
  rationale: μεμβράνα पशु-चर्म से तैयार लिखने की सामग्री या उस पर लिखे दस्तावेज़ को दर्शाता है; ‘चर्मपत्र’ सटीक और प्रचलित हिन्दी रूप है।
