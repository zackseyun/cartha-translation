source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: hi
  text: सर्दी से पहले आने की पूरी कोशिश करना। यूबुलुस तुम्हें नमस्कार भेजता है, और पूदेंस, लीनुस, क्लौदिया और सभी भाई भी तुम्हें नमस्कार भेजते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभी भाई-बहन’; यूनानी पाठ में ‘भाई’ है, पर इस संदर्भ में यह विश्वासियों के व्यापक समुदाय के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: पूरा प्रयत्न करना
  rationale: आज्ञार्थक क्रिया में तत्परता और गंभीर प्रयास दोनों का भाव है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए उस आग्रह को बनाए रखती है।
- source_word: πρὸ χειμῶνος
  choice: सर्दी आने से पहले
  rationale: πρό के साथ संबंधकारक समय की उस सीमा से पहले का अर्थ देता है। हिन्दी में मौसम के लिए ‘सर्दी आने से पहले’ सहज और स्पष्ट है।
- source_word: ἐλθεῖν
  choice: आने
  rationale: यह infinitive Σπούδασον का पूरक है और तीमुथियुस के पौलुस के पास आने को बताता है; ‘आना’ इसका सीधा हिन्दी रूप है।
- source_word: Ἀσπάζεταί σε
  choice: तुम्हें नमस्कार कहता है
  rationale: पत्र के समापन में ἀσπάζομαι अभिवादन भेजने को व्यक्त करता है। ‘नमस्कार कहता है’ हिन्दी में स्वाभाविक पत्रात्मक प्रयोग है।
- source_word: Εὔβουλος
  choice: यूबुलुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: Πούδης
  choice: पूदेंस
  rationale: यूनानी व्यक्तिगत नाम का ऐसा देवनागरी रूप जो प्रचलित ‘Pudens’ स्वरूप को दर्शाता है।
- source_word: Λίνος
  choice: लीनुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: Κλαυδία
  choice: क्लौदिया
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: οἱ ἀδελφοὶ πάντες
  choice: सभी भाई
  rationale: मूल में पुल्लिंग बहुवचन ἀδελφοί है। मुख्य पाठ उसका प्रत्यक्ष रूप रखता है, जबकि सामुदायिक संदर्भ में स्त्री-पुरुष दोनों विश्वासियों की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: सम्भवतः मिश्रित मसीही समुदाय के लिए ἀδελφοί का अनुवाद
  choice: सभी भाई
  alternative: सभी भाई-बहन; सभी विश्वासी
  rationale: मूल यूनानी व्याकरणिक रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘भाई’ रखा गया है। फिर भी आरम्भिक मसीही पत्रों में यह शब्द व्यापक विश्वासी समुदाय को सूचित कर सकता है; इस वास्तविक अर्थगत सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। एकवचन ‘तुम्हें’ मूल के एकवचन सर्वनाम σε को दर्शाता है। नामों का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है।
