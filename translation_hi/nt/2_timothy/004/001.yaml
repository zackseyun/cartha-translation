source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: hi
  text: मैं परमेश्वर और मसीह यीशु के सामने—जो जीवितों और मरे हुओं का न्याय करने को है—और उसके प्रकट होने और उसके राज्य का वास्ता देकर तुम्हें गंभीरता से आज्ञा देता हूँ:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप से: “और उसके प्रकट होने और उसके राज्य को लेकर”; यूनानी में इन शब्दों का गंभीर आज्ञा-निर्देश से संबंध अधिक निहित है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: मैं तुम्हें गंभीर आदेश देता हूँ
  rationale: पत्र के इस नियुक्ति-संदर्भ में क्रिया साधारण गवाही नहीं, बल्कि अधिकारपूर्ण और गंभीर आदेश देने का भाव रखती है। यूनानी में निहित कर्म को स्वाभाविक हिन्दी के लिए ‘तुम्हें’ से स्पष्ट किया गया है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह परमेश्वर और मसीह यीशु की उपस्थिति तथा दृष्टि में कथन किए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: यहाँ Χριστός की उपाधिगत शक्ति सक्रिय है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता होने का भाव सुरक्षित रखता है।
- source_word: τοῦ μέλλοντος κρίνειν
  choice: जो ... न्याय करनेवाला है
  rationale: यह हिन्दी अभिव्यक्ति भावी न्याय को स्वाभाविक ढंग से बताती है और μέλλω के अपेक्षित/आसन्न भविष्य के तनाव को केवल सामान्य वर्तमान में नहीं बदलती।
- source_word: ζῶντας καὶ νεκρούς
  choice: जीवितों और मरे हुओं
  rationale: यह दोनों समूहों को समेटनेवाली यूनानी अभिव्यक्ति का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: ἐπιφάνειαν
  choice: प्रकट होने
  rationale: यह दृश्य प्रकटीकरण के भाव को सुरक्षित रखता है और ‘आगमन’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: βασιλείαν
  choice: राज्य
  rationale: यह βασιλεία का मानक और इस युगान्तकारी संदर्भ में स्वाभाविक अनुवाद है।
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: और उसके प्रकट होने और उसके राज्य की शपथ देकर
  rationale: कर्मकारक पदों को गंभीर आदेश की शपथ/अभ्यर्थना-विधि के विस्तार के रूप में समझकर हिन्दी में संबंध स्पष्ट किया गया है; यूनानी का अधिक निहित समन्वय पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: Χριστός का मसीही उपाधि के रूप में अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: इस गंभीर न्याय-संबंधी वर्णन में शब्द केवल नाम-जैसा नहीं, उपाधिगत अर्थ भी रखता है; ‘मसीह’ उस अर्थ को स्पष्ट और परिचित हिन्दी में सुरक्षित रखता है।
- issue: μέλλω के भावी/आसन्न अर्थ की शक्ति
  choice: जो ... न्याय करनेवाला है
  alternative: जो ... का न्याय करेगा
  rationale: चुना हुआ रूप निश्चित भावी भूमिका के साथ यूनानी की अपेक्षा का हल्का तनाव बनाए रखता है, बिना कोई समय-सारणी निर्धारित किए।
- issue: प्रकट होने और राज्य वाले कर्मकारकों का वाक्यगत संबंध
  choice: शपथ देकर गंभीर आदेश का आधार
  alternative: और उसके प्रकट होने और उसके राज्य को सीधे समन्वित रहने देना
  rationale: यूनानी वाक्यरचना कठिन है। शपथ/अभ्यर्थना का अर्थ संदर्भ में सुसंगत है, पर अधिक निहित शाब्दिक संबंध भी संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, अधिकारपूर्ण और कलीसियाई संदर्भ के योग्य शैली रखी गई है। ‘शपथ देकर’ वाक्यगत संबंध स्पष्ट करता है, जबकि पादटिप्पणी मूल यूनानी की वास्तविक अस्पष्टता सुरक्षित रखती है।
