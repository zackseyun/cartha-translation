source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: hi
  text: मैं अच्छी लड़ाई लड़ चुका हूँ, मैंने दौड़ पूरी कर ली है, मैंने विश्वास को बनाए रखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं विश्वासयोग्य बना रहा हूँ”; अथवा “मैंने विश्वास की रक्षा की है।” यूनानी पदबंध का अर्थ मसीही विश्वास को थामे रखना या विश्वासयोग्य बने रहना, दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: अच्छी लड़ाई
  rationale: ἀγών संघर्ष, प्रतियोगिता या लड़ाई का बोध कराता है; यहाँ खेल और युद्ध से जुड़ा रूपक है। ‘अच्छी लड़ाई’ स्वाभाविक, सशक्त और परिचित हिंदी अभिव्यक्ति है, जबकि καλός के ‘उत्तम/श्रेष्ठ’ भाव को भी बनाए रखती है।
- source_word: ἠγώνισμαι
  choice: लड़ चुका हूँ
  rationale: ἀγωνίζομαι का पूर्णकालिक रूप पूरे किए गए संघर्ष और उसके वर्तमान परिणाम को व्यक्त करता है। ‘लड़ चुका हूँ’ हिंदी में इस पूर्णता को स्पष्ट करता है।
- source_word: δρόμον
  choice: दौड़
  rationale: δρόμος दौड़ या उसके मार्ग को दर्शाता है। यहाँ प्रतियोगिता का रूपक होने के कारण ‘दौड़’ आधुनिक पाठक के लिए स्पष्ट और सजीव है।
- source_word: τετέλεκα
  choice: पूरी कर ली है
  rationale: τελέω का पूर्णकालिक रूप किसी काम को उसके लक्ष्य तक पहुँचाने का अर्थ देता है। ‘पूरी कर ली है’ पूर्ण हुई दौड़ और उसके स्थायी परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις यहाँ लेख के साथ है और ‘विश्वास’—संभवतः मसीही विश्वास—का अर्थ दे सकता है; साथ ही विश्वासयोग्यता का भाव भी संभव है। मुख्य पाठ में ‘विश्वास’ इस वास्तविक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τετήρηκα
  choice: बनाए रखा है
  rationale: τηρέω का अर्थ रखना, सुरक्षित रखना या पालन करना हो सकता है। ‘बनाए रखा है’ विश्वास को थामे रहने तथा विश्वासयोग्य बने रहने, दोनों संभावित भावों के लिए स्वाभाविक हिंदी देता है।
theological_decisions:
- issue: τὴν πίστιν का अर्थ
  choice: विश्वास को बनाए रखा है
  alternative: विश्वासयोग्य बना रहा हूँ; अथवा विश्वास की रक्षा की है
  rationale: सप्रत्यय τὴν πίστιν संदर्भ में सौंपे गए मसीही विश्वास की ओर संकेत कर सकता है, पर व्यक्तिगत निष्ठा या विश्वासयोग्यता का भाव भी संभव है। मुख्य पाठ ‘विश्वास’ रखता है और पादटिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और तीन समानांतर पूर्णकालिक कथनों की लय को यथासंभव सुरक्षित रखा गया है।
