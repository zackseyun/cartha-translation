lexical_decisions:
- source_word: Σπούδασον
  choice: पूरा प्रयत्न करो
  rationale: यह क्रिया केवल जल्दी करने की नहीं, बल्कि लगन और तत्परता से हर संभव प्रयास करने की आज्ञा देती है। यह अनुवाद ταχέως से व्यक्त शीघ्रता को अलग बनाए रखता है।
- source_word: ἐλθεῖν
  choice: आने
  rationale: πρός με (‘मेरे पास’) के साथ ἔρχομαι का स्वाभाविक हिन्दी रूप ‘आना’ है।
- source_word: πρός με
  choice: मेरे पास
  rationale: πρός और कर्मकारक सर्वनाम με यहाँ वक्ता की ओर गमन व्यक्त करते हैं; आधुनिक हिन्दी में ‘मेरे पास’ स्वाभाविक है।
- source_word: ταχέως
  choice: शीघ्र
  rationale: यह क्रियाविशेषण ‘जल्दी’ अथवा ‘शीघ्र’ का अर्थ दे सकता है। ‘शीघ्र’ आग्रह की तात्कालिकता बनाए रखता है और Σπούδασον में निहित प्रयत्न से इसे अलग व्यक्त करता है।
