    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: सावधान रहना
  rationale: वर्तमान मध्यवाच्य आज्ञार्थक निरंतर व्यक्तिगत सतर्कता का निर्देश देता है। ‘उससे सावधान रहना’ स्वाभाविक आधुनिक हिन्दी में चेतावनी की शक्ति बनाए रखता है।
- source_word: λίαν
  choice: बहुत
  rationale: यह क्रिया के विरोध की तीव्रता बढ़ाता है; ‘बहुत विरोध किया’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀντέστη
  choice: विरोध किया
  rationale: यह अपने को किसी के विरुद्ध खड़ा करने या प्रतिरोध करने का अर्थ देता है। ‘विरोध किया’ यहाँ दत्तिवाचक कर्म के साथ अर्थ को सहज रूप से व्यक्त करता है।
- source_word: τοῖς ἡμετέροις λόγοις
  choice: हमारी बातों
  rationale: λόγοι बोले गए शब्दों या कथनों की ओर संकेत करता है। ‘हमारी बातों’ मूल की बहुवचन अभिव्यक्ति के निकट रहते हुए स्वाभाविक हिन्दी है और इसे केवल संदेश या शिक्षा तक सीमित नहीं करता।
- source_word: ὃν
  choice: उससे
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद के सिकन्दर की ओर संकेत करता है; हिन्दी में ‘उससे’ सावधान रहने के निर्माण के अनुरूप है।
- source_word: καὶ σὺ
  choice: तुम भी
  rationale: καὶ के साथ बलयुक्त σὺ पौलुस के अतिरिक्त तीमुथियुस को भी विशेष रूप से चेताता है; ‘तुम भी’ यह बल बनाए रखता है।
theological_decisions:
- issue: ‘हमारी बातों’ का दायरा
  choice: इसे पौलुस और उसके सहकर्मियों द्वारा कही गई बातों के सामान्य अर्थ में रखा गया है, जो प्रेरितीय गवाही या शिक्षा हो सकती हैं।
  alternative: इसे विशेष रूप से अदालती गवाही, सुसमाचार-संदेश, या धर्मसैद्धान्तिक शिक्षा मानना।
  rationale: यूनानी वाक्यांश स्वयं प्रसंग को किसी एक औपचारिक श्रेणी तक सीमित नहीं करता। इसलिए अनुवाद अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष चेतावनी। ‘बातों’ बोलचाल में समझने योग्य है, जबकि पादटिप्पणी मूल के शाब्दिक रूप और सम्भावित अर्थों को स्पष्ट करती है।
