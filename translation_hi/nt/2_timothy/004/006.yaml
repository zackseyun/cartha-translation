  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: hi
  text: क्योंकि मैं तो पहले ही पेय-बलि के समान उंडेला जा रहा हूँ[a], और मेरे प्रस्थान[b] का समय आ पहुँचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं पहले ही उंडेला जा रहा हूँ।” यूनानी क्रिया बलिदान में पेय-बलि उंडेलने का बिंब जगाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुक्ति,” “बंधन खुलना,” अथवा “विघटन।” यहाँ “प्रस्थान” मृत्यु के लिए एक स्वाभाविक रूपक है।
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: अर्घ के रूप में उंडेला जा रहा हूँ
  rationale: क्रिया बलिदान में पेय-अर्घ उंडेलने का बिंब व्यक्त करती है। यह अनुवाद पौलुस की आसन्न मृत्यु से जुड़ी बलिदानात्मक उपमा को स्पष्ट रखते हुए मूल रूपक को बनाए रखता है।
- source_word: ἤδη
  choice: अभी से
  rationale: यह बताता है कि वर्णित क्रिया आरंभ हो चुकी है; आधुनिक हिन्दी में यह वर्तमान और आसन्नता दोनों का स्वाभाविक संकेत देता है।
- source_word: καιρός
  choice: समय
  rationale: यहाँ शब्द निर्णायक या नियत अवसर को सूचित करता है। ‘समय’ सहज है, और ‘आ पहुँचा है’ के साथ उस निर्णायक घड़ी का भाव प्रकट होता है।
- source_word: ἀναλύσεώς
  choice: प्रस्थान
  rationale: शब्द में प्रस्थान, बंधन खोलने या मुक्त होने के भाव संभव हैं। यहाँ ‘प्रस्थान’ मृत्यु के लिए प्रयुक्त शिष्ट रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐφέστηκεν
  choice: आ पहुँचा है
  rationale: पूर्णकालीन रूप उस समय के आ जाने और अब उपस्थित होने की स्थिति बताता है; ‘आ पहुँचा है’ इसे स्वाभाविक और सशक्त ढंग से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पौलुस की मृत्यु का रूपकात्मक वर्णन
  choice: आसन्न मृत्यु को अर्घ के रूप में उंडेले जाने और प्रस्थान के रूपकों से व्यक्त किया गया है।
  alternative: इसे सामान्य पीड़ा या सेवा में स्वयं को अर्पित करने का उल्लेख माना जा सकता है।
  rationale: σπένδομαι और ἀνάλυσις का संयुक्त प्रयोग आसन्न मृत्यु की ओर दृढ़ता से संकेत करता है, पर अनुवाद ‘मैं मरने वाला हूँ’ जैसा सपाट अर्थ न देकर मूल की बलिदानात्मक और प्रस्थान-संबंधी छवियाँ सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अर्घ’ धार्मिक-बलिदानात्मक बिंब को संक्षेप में व्यक्त करता है और पादटिप्पणी उसका अर्थ स्पष्ट करती है; ‘प्रस्थान’ मूल की शिष्ट अस्पष्टता और रूपक को बनाए रखता है।
