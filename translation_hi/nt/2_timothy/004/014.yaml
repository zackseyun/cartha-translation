lexical_decisions:
- source_word: Ἀλέξανδρος
  choice: सिकन्दर
  rationale: यूनानी नाम Ἀλέξανδρος का हिन्दी में प्रचलित बाइबलीय रूप ‘सिकन्दर’ स्वाभाविक और आसानी से पहचाना जाने वाला है।
- source_word: ὁ χαλκεὺς
  choice: धातु का काम करनेवाला
  rationale: χαλκεύς धातु, विशेषकर ताँबे या काँसे, पर काम करने वाले कारीगर को दर्शाता है। सामान्य अभिव्यक्ति धातु के प्रकार को अनिश्चित रहने देती है; अधिक विशिष्ट विकल्प पाद-टिप्पणी में है।
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: मेरे साथ बहुत बुराइयाँ कीं
  rationale: शब्दशः भाव ‘मेरे प्रति बहुत-सी बुरी बातें प्रदर्शित कीं’ है। हिन्दी में ‘मेरे साथ बहुत बुराइयाँ कीं’ κακά की नैतिक तीव्रता बनाए रखते हुए यूनानी मुहावरे का स्वाभाविक अर्थ देता है। ‘मुझे बहुत हानि पहुँचाई’ को अधिक व्याख्यात्मक विकल्प के रूप में सुरक्षित रखा गया है।
- source_word: ἀποδώσει αὐτῷ ὁ κύριος
  choice: प्रभु उसे ... बदला देगा
  rationale: भविष्यकालीन ἀποδώσει प्रतिफल अथवा प्रत्युत्तर देने को व्यक्त करता है। ‘बदला देगा’ यहाँ कर्मों के अनुरूप दैवी प्रतिदान का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: उसके कामों के अनुसार
  rationale: यह यूनानी वाक्यांश के निकट है और कर्मों के आधार पर प्रतिफल दिए जाने का भाव अक्षुण्ण रखता है।
theological_decisions:
- issue: ἀποδώσει को भविष्यवाणी के कथन के रूप में समझें या इच्छा/प्रार्थना के रूप में
  choice: प्रभु उसे उसके कामों के अनुसार बदला देगा
  alternative: प्रभु उसे उसके कामों के अनुसार बदला दे
  rationale: SBLGNT में ἀποδώσει भविष्यत् निर्देशार्थक रूप है, इसलिए मुख्य पाठ कथन देता है, न कि अभिशाप या प्रार्थना। कुछ पांडुलिपियों में प्रार्थनासूचक पाठ मिलता है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘धातु का काम करनेवाला’ अनावश्यक धातु-विशेष से बचता है; ‘बहुत बुराइयाँ कीं’ मूल के κακά की नैतिक शक्ति को बनाए रखता है। सभी पाद-टिप्पणी चिह्न संबंधित मुख्य-पाठ अंशों पर लगाए गए हैं।
