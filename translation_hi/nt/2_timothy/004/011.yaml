id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: hi
  text: केवल लूका मेरे साथ है। मरकुस को अपने साथ लेकर आना, क्योंकि सेवा के काम में वह मेरे लिए उपयोगी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λουκᾶς
  choice: लूका
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: μόνος
  choice: केवल
  rationale: यह स्पष्ट करता है कि इस समय पौलुस के साथ रहने वाला एकमात्र साथी लूका है; हिन्दी में यह सहज रूप से ‘लूका’ पर बल देता है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: सम्बन्धसूचक μετά के संगति या साथ होने के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Μᾶρκον
  choice: मरकुस
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: ἀναλαβὼν
  choice: अपने साथ लेकर
  rationale: कृदन्त का अर्थ मरकुस को साथ लेने और फिर लाने की पूर्ववर्ती क्रिया है; यह रूप उस क्रम को सहज हिन्दी में बनाए रखता है।
- source_word: ἄγε
  choice: आना
  rationale: μετὰ σεαυτοῦ और मरकुस को साथ लेने के निर्देश के साथ हिन्दी की संयुक्त अभिव्यक्ति ‘लेकर आना’ यूनानी आज्ञा ‘उसे साथ लाओ’ का स्वाभाविक रूप है।
- source_word: μετὰ σεαυτοῦ
  choice: अपने साथ
  rationale: तीमुथियुस को मरकुस को अपनी संगति में लाने का निर्देश सीधे व्यक्त करता है।
- source_word: γάρ μοι
  choice: क्योंकि ... मेरे लिए
  rationale: γάρ आदेश का कारण बताता है और μοι पौलुस के लिए उपयोगिता को दर्शाता है।
- source_word: εὔχρηστος
  choice: उपयोगी
  rationale: लाभदायक या काम आने योग्य होने का स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी समतुल्य।
- source_word: εἰς διακονίαν
  choice: सेवा के काम में
  rationale: διακονία के व्यापक ‘सेवा’ अर्थ को सुरक्षित रखता है और प्रसंग में किसी तकनीकी पद या औपचारिक कलीसियाई सेवकाई को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: διακονία का अर्थ
  choice: सेवा के काम में
  alternative: सेवकाई में
  rationale: यूनानी शब्द सामान्य सेवा अथवा सुसमाचार-संबंधी सेवाकार्य, दोनों को सूचित कर सकता है। ‘सेवा के काम में’ इस अर्थ-विस्तार को बनाए रखता है और किसी औपचारिक पद का संकेत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘लेकर आना’ हिन्दी में एक स्वाभाविक संयुक्त आज्ञा है, और ‘सेवा के काम में’ मूल की अर्थगत व्यापकता बनाए रखता है।
