id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: hi
  text: अब से मेरे लिए धार्मिकता का मुकुट रखा हुआ है[a], जिसे प्रभु, धर्मी न्यायाधीश, उस दिन मुझे देगा—और केवल मुझे ही नहीं, बल्कि उन सभी को भी जिन्होंने उसके प्रकट होने से प्रेम किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय का मुकुट।” यूनानी शब्द का अर्थ “धार्मिकता” और कुछ प्रसंगों में “न्याय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: अब से
  rationale: पिछले पद में दौड़ पूरी करने के कथन के बाद यह आगे शेष रखी हुई बात की ओर संकेत करता है; हिन्दी में इसका स्वाभाविक कालगत रूप ‘अब से’ है।
- source_word: ἀπόκειταί
  choice: रखा हुआ है
  rationale: क्रिया किसी वस्तु के अलग रखे या सुरक्षित होने की वर्तमान अवस्था बताती है और मूल रूपक को बनाए रखती है।
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: धार्मिकता का मुकुट
  rationale: यह संबंधकारक रचना को बिना यह तय किए सुरक्षित रखता है कि मुकुट धार्मिकता के लिए दिया जाता है, धार्मिकता से बना है, या अंतिम निर्दोष-ठहराव से जुड़ा है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह पौलुस की शब्दावली के लिए प्रचलित और व्यापक हिन्दी समतुल्य है; ‘न्याय’ की संभावित छाया पादटिप्पणी में रखी गई है।
- source_word: ἀποδώσει
  choice: देगा
  rationale: यह देय वस्तु प्रदान करने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; मुकुट के प्रसंग से पुरस्कार का भाव स्पष्ट है, जबकि ‘प्रतिफल देगा’ मूल से अधिक व्याख्यात्मक हो सकता है।
- source_word: ὁ δίκαιος κριτής
  choice: जो धर्मी न्यायी है
  rationale: यह पदबंध प्रभु की न्याय करने वाली भूमिका और उसके धर्मी चरित्र दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: उन सभी को ... जिन्होंने ... प्रेम किया है
  rationale: पूर्णकालिक कृदंत अब तक बनी हुई प्रेमपूर्ण प्रवृत्ति को सूचित करता है; हिन्दी का पूर्णकाल इसे उपयुक्त रूप से बनाए रखता है।
- source_word: ἐπιφάνειαν
  choice: प्रकट होने
  rationale: यह दृश्य अभिव्यक्ति या दर्शन के भाव को सीधे रखता है और इसे व्यापक ‘आगमन’ में नहीं मिला देता।
theological_decisions:
- issue: ‘धार्मिकता का मुकुट’ का अर्थ
  choice: संबंधकारक पदबंध को बिना निर्णायक व्याख्या के ज्यों का त्यों रखा गया है।
  alternative: धार्मिकता के लिए दिया जाने वाला मुकुट; धार्मिकता-रूपी मुकुट; न्याय अथवा निर्दोष-ठहराव का मुकुट
  rationale: यूनानी संबंधकारक अनेक अर्थ-संबंधों की अनुमति देता है; पाठ किसी एक को स्पष्ट रूप से निर्धारित नहीं करता।
- issue: ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है; प्रसंग इसे यीशु मसीह की ओर संकेत करता समझने देता है।
  alternative: सामान्य रूप से परमेश्वर
  rationale: ‘उसके प्रकट होने’ का निकट संदर्भ पासबानी पत्रियों में मसीह की ओर प्रबल संकेत करता है, फिर भी अनुवाद में मूल उपाधि से अधिक स्पष्ट नाम नहीं जोड़ा गया।
- issue: प्रकट होने से प्रेम
  choice: ‘उसके प्रकट होने से प्रेम किया है’ के असामान्य किन्तु अर्थपूर्ण भाव को बनाए रखा गया है।
  alternative: उसके प्रकट होने की लालसा रखी है
  rationale: ‘लालसा’ प्रसंगानुकूल व्याख्या है, पर मूल क्रिया सीधे प्रेम करने को कहती है और उस भाव की धर्मवैचारिक तीव्रता को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘मुकुट’, ‘धर्मी न्यायी’ और ‘प्रकट होना’ जैसे पारंपरिक किन्तु आज भी सुबोध बाइबलीय पद रखे गए हैं।
