  terminology: '“धार्मिकता,” “मुकुट,” “प्रभु,” and “प्रकट होने” are suitable and consistent theological terms. Replacing “न्यायी” with “न्यायाधीश” improves precision: κριτής denotes a judge, not merely a person who acts justly.'
