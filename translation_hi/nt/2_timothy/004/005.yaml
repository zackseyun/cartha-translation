source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: hi
  text: परन्तु तुम हर बात में सचेत रहो,[a] कठिनाई सहो, सुसमाचार सुनानेवाले का काम करो, और अपनी सेवा पूरी तरह निभाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर परिस्थिति में संयमित और सजग रहो।’ यूनानी क्रिया का शाब्दिक अर्थ नशे से मुक्त रहना है, पर नए नियम में इसका प्रयोग रूपक रूप से साफ सोचने, अपने ऊपर नियंत्रण रखने और दबाव में स्थिर बने रहने के लिए होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: परन्तु तुम
  rationale: δέ पिछले पदों में बताए गए लोगों के आचरण के साथ विरोध प्रकट करता है, और स्पष्ट सर्वनाम σὺ तीमुथियुस पर व्यक्तिगत बल देता है।
- source_word: νῆφε
  choice: सचेत रहो
  rationale: नए नियम में यह क्रिया रूपक रूप से मानसिक सजगता, आत्म-संयम और दबाव में स्थिरता का भाव देती है। ‘सचेत रहो’ आधुनिक हिन्दी में इस व्यापक आशय को सहजता से व्यक्त करता है।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: यह νῆφε से जुड़कर व्यापकता प्रकट करता है और यह अनिर्णीत रहने देता है कि विशेष बल सभी परिस्थितियों पर है या सभी अवसरों पर।
- source_word: κακοπάθησον
  choice: कठिनाई सहो
  rationale: आज्ञार्थक क्रिया दुःख या कठिनाई को स्वीकार कर उसमें दृढ़ बने रहने का आह्वान करती है।
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: सुसमाचार सुनानेवाले का काम करो
  rationale: यह पदबंध शुभ समाचार की घोषणा करनेवाले व्यक्ति के कार्य को बताता है। वर्णनात्मक हिन्दी ‘इंजीलवादी’ जैसे कम सर्वसुलभ या सम्भावित रूप से संस्थागत शब्द से अधिक स्पष्ट है।
- source_word: τὴν διακονίαν σου
  choice: अपनी सेवा
  rationale: διακονία का मूल भाव सौंपी गई सेवा है। ‘सेवा’ हिन्दी में स्वाभाविक है और इसे किसी विशेष कलीसियाई पद तक सीमित नहीं करती।
- source_word: πληροφόρησον
  choice: पूरी तरह निभाओ
  rationale: यह क्रिया सेवा को पूर्ण रूप से सम्पन्न करने का भाव देती है। ‘पूरी तरह निभाओ’ पूर्णता और विश्वसनीय निर्वाह दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διακονία में तीमुथियुस के दायित्व का स्वरूप
  choice: अपनी सेवा
  alternative: अपनी सेवकाई
  rationale: सन्दर्भ तीमुथियुस को सौंपे गए सुसमाचार-सम्बन्धी दायित्व का है, पर यूनानी शब्द स्वयं किसी विशिष्ट सम्प्रदायगत पदनाम को अनिवार्य नहीं करता। ‘सेवा’ अर्थ की व्यापकता और सन्दर्भगत दायित्व दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। चारों आज्ञाओं की संक्षिप्त, सीधी लय सुरक्षित है। ‘सुसमाचार सुनानेवाला’ अर्थ को पारदर्शी रखता है और ‘सेवा’ अनावश्यक संस्थागत या सम्प्रदायगत अर्थारोपण से बचाती है।
