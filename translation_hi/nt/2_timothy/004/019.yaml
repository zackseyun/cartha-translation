  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: hi
  text: प्रिस्का और अक्विला[a] को और उनेसिफुरुस के घराने को नमस्कार कहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘प्रिस्का’; अन्य स्थानों पर उन्हें ‘प्रिस्किल्ला’ भी कहा गया है (उदाहरण के लिए, प्रेरितों के काम 18:2, 18, 26)।
    reason: नाम के वैकल्पिक रूप को स्पष्ट करना
lexical_decisions:
- source_word: Ἄσπασαι
  choice: नमस्कार कहना
  rationale: यह ἀσπάζομαι का आज्ञार्थक रूप है और पत्र के अंत में अभिवादन पहुँचाने की सीधी आज्ञा देता है। ‘नमस्कार कहना’ आधुनिक हिन्दी में स्वाभाविक है और मूल क्रिया में स्पष्ट न की गई अतिरिक्त आत्मीयता नहीं जोड़ता।
- source_word: Πρίσκαν
  choice: प्रिस्का
  rationale: यूनानी पाठ में नाम का रूप Πρίσκαν है; इसलिए ‘प्रिस्का’ उसका सीधा लिप्यंतरण है। अन्य स्थानों पर मिलने वाला ‘प्रिस्किल्ला’ इसी नाम का वैकल्पिक रूप है।
- source_word: Ἀκύλαν
  choice: अक्विला
  rationale: यह यूनानी व्यक्तिगत नाम Ἀκύλας का प्रचलित और निकट हिन्दी लिप्यंतरण है।
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: उनेसिफुरुस के घराने को
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि उससे जुड़े परिवार और गृहस्थी के लोगों को दर्शाता है। ‘घराना’ इस सामाजिक अर्थ को सुरक्षित रखता है और इसे केवल रक्त-संबंधी परिवार तक सीमित नहीं करता।
