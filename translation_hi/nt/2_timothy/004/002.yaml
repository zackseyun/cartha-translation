base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: hi
  text: वचन का प्रचार करो; चाहे समय अनुकूल हो या प्रतिकूल, तत्पर रहो[a]; दोष दिखाओ, डाँटो और आग्रह करो[b]—पूरे धैर्य और शिक्षा के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डटे रहो’ अथवा ‘तत्काल जुटे रहो।’ यूनानी क्रिया में तैयार और उपस्थित रहने के साथ बात पर तत्परता से जोर देने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उत्साहित करो’ अथवा ‘समझाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: प्रचार करो
  rationale: यह सार्वजनिक और अधिकारपूर्ण घोषणा करने की आज्ञा है। ‘प्रचार करो’ आधुनिक हिन्दी में स्वाभाविक है और मूल क्रिया का भार बनाए रखता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: यहाँ λόγος उस संदेश की ओर संकेत करता है जिसे तीमुथियुस को घोषित करना है। ‘वचन’ मूल की व्यापकता और धर्मवैचारिक गहराई बनाए रखता है, बिना उसे केवल ‘सुसमाचार’ या ‘पवित्रशास्त्र’ तक सीमित किए।
- source_word: ἐπίστηθι
  choice: तत्पर रहो
  rationale: आज्ञार्थक क्रिया उपस्थित, तैयार और कार्य के लिए मुस्तैद रहने का भाव दे सकती है। ‘तत्पर रहो’ आगामी समय-संबंधी विरोधी युग्म के साथ सहज बैठता है।
- source_word: εὐκαίρως ἀκαίρως
  choice: चाहे समय अनुकूल हो या प्रतिकूल
  rationale: यह युग्म अवसर सुविधाजनक या असुविधाजनक होने, दोनों दशाओं में निरंतर तत्परता व्यक्त करता है। यह हिन्दी रूप अर्थ को स्पष्ट और संतुलित रखता है।
- source_word: ἔλεγξον
  choice: दोष दिखाओ
  rationale: क्रिया में गलत बात को उजागर करके उसका बोध कराने और सुधार की ओर ले जाने का भाव है। ‘दोष दिखाओ’ इस सुधारात्मक शक्ति को संक्षेप में व्यक्त करता है।
- source_word: ἐπιτίμησον
  choice: डाँटो
  rationale: यह पिछली क्रिया से अधिक कठोर फटकार का भाव रखती है। ‘डाँटो’ सीधा, स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: παρακάλεσον
  choice: समझाओ
  rationale: क्रिया आग्रह करने, उत्साहित करने या ढाढ़स देने तक का अर्थ रख सकती है। इस सेवकाई-संबंधी आज्ञा में ‘समझाओ’ earnest appeal का व्यापक, सहज हिन्दी रूप है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: पूरे धैर्य के साथ
  rationale: μακροθυμία लोगों के प्रति सहनशील और दीर्घ धैर्य को व्यक्त करता है; πάσῃ इसकी पूर्णता पर बल देता है।
- source_word: καὶ διδαχῇ
  choice: और शिक्षा के साथ
  rationale: διδαχή यहाँ सुधार और समझाने के साथ चलने वाली शिक्षात्मक रीति या विषयवस्तु को दर्शाती है। ‘शिक्षा’ संज्ञा-रूप और मूल की व्यापकता बनाए रखती है।
theological_decisions:
- issue: ‘वचन’ का आशय
  choice: मुख्य पाठ में ‘वचन’ रखा गया है।
  alternative: ‘संदेश’, ‘सुसमाचार’ या ‘पवित्रशास्त्र’
  rationale: निकट संदर्भ प्रेरितिक घोषणा और पवित्रशास्त्र दोनों से जुड़ा है, पर इस पद में λόγος स्वयं किसी एक अर्थ तक स्पष्ट रूप से सीमित नहीं है। इसलिए मूल की व्यापकता और धर्मवैचारिक तनाव को बनाए रखा गया है।
- issue: παρακάλεσον की भाव-सीमा
  choice: ‘समझाओ’
  alternative: ‘आग्रह करो’, ‘उत्साहित करो’ या ‘ढाढ़स दो’
  rationale: संदर्भ में गंभीर आग्रह प्रमुख है, पर क्रिया में प्रोत्साहन का भाव भी संभव है। मुख्य पाठ में व्यापक हिन्दी क्रिया और पादटिप्पणी में विकल्प देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में बहुवचन/सम्मानसूचक आज्ञार्थक रूपों का प्रयोग किया गया है। वाक्य की तीव्र, क्रमिक लय बनाए रखने के लिए तीन सुधारात्मक क्रियाएँ संक्षिप्त रखी गई हैं। भाषा गरिमापूर्ण है, पर अनावश्यक रूप से संस्कृतनिष्ठ नहीं।
