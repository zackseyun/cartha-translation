lexical_decisions:
- source_word: Τυχικὸν
  choice: तुखिकुस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; कर्मकारक का अर्थ वाक्य-विन्यास से व्यक्त होता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह संयोजक पिछले कथन से हल्का विरोध या प्रसंग-परिवर्तन दिखा सकता है; हिन्दी में ‘परन्तु’ उस सूक्ष्मता को बनाए रखता है, जबकि ‘और’ तथा ‘अब’ भी सम्भव हैं।
- source_word: ἀπέστειλα
  choice: भेजा है
  rationale: प्रथम पुरुष एकवचन एओरिस्ट क्रिया है। पत्र की वर्तमान परिस्थिति से जुड़े हाल के प्रेषण के लिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है, यद्यपि ‘भेजा’ भी सम्भव है।
- source_word: εἰς
  choice: इफिसुस
  rationale: नगर के नाम के साथ गन्तव्य-सूचक εἰς का अर्थ हिन्दी में स्थाननाम के अप्रत्यक्ष रूप से स्वाभाविक रूप में व्यक्त होता है; अलग ‘को’ लगाने की आवश्यकता नहीं।
- source_word: Ἔφεσον
  choice: इफिसुस
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
