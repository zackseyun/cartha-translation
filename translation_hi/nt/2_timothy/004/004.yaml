  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: hi
  text: और वे सत्य से कान फेर लेंगे और मिथकों[a] की ओर मुड़ जाएंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दंतकथाओं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: सत्य
  rationale: संदर्भ में यह पहचाने हुए प्रेरितीय सत्य की ओर संकेत करता है। हिन्दी में ‘सत्य’ स्वाभाविक रूप से निश्चित अर्थ व्यक्त करता है; ‘उस सत्य’ जोड़ना अनावश्यक रूप से संकेतात्मक होता।
- source_word: ἀκοὴν
  choice: अपने कान
  rationale: शाब्दिक अर्थ ‘सुनना/श्रवण’ है, पर हिन्दी में ‘सत्य से अपना सुनना फेरना’ अस्वाभाविक है। ‘कान फेर लेना’ सुनने से जानबूझकर इनकार करने के रूपक को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: ἀποστρέψουσιν
  choice: फेर लेंगे
  rationale: यह सक्रिय और जानबूझकर मुंह मोड़ने का भाव बनाए रखता है तथा ‘कान’ के साथ स्वाभाविक हिन्दी मुहावरा बनाता है।
- source_word: μύθους
  choice: मनगढ़ंत कथाओं
  rationale: यहाँ μῦθος सत्य के विपरीत अविश्वसनीय या गढ़ी हुई कथाओं को दर्शाता है। आधुनिक हिन्दी में केवल ‘मिथकों’ की अपेक्षा यह अर्थ अधिक स्पष्ट है; ‘दंतकथाओं’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: ἐκτραπήσονται
  choice: मुड़ जाएंगे
  rationale: मध्य/कर्मवाच्य रूप की एजेंसी को जरूरत से अधिक निश्चित किए बिना, दिशा बदलने का अकर्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: से ... और ... की ओर
  rationale: मूल के दिशात्मक विरोध—सत्य से दूर और कथाओं की ओर—को सहज हिन्दी समन्वय में सुरक्षित रखता है।
theological_decisions:
- issue: संदर्भ में ‘सत्य’ का स्वरूप
  choice: सत्य
  alternative: खरा उपदेश; सुसमाचार का सत्य
  rationale: निकट संदर्भ प्रेरितीय शिक्षा की ओर संकेत करता है, फिर भी मूल पद व्यापक शब्द ἀλήθεια का प्रयोग करता है। इसलिए अनुवाद इसे किसी संकीर्ण व्याख्या तक सीमित नहीं करता।
- issue: ἐκτραπήσονται में कर्तृत्व
  choice: मुड़ जाएंगे
  alternative: मोड़ दिए जाएंगे
  rationale: यह रूप मध्य या कर्मवाच्य समझा जा सकता है। हिन्दी का अकर्मक प्रयोग बाहरी कर्ता को आरोपित किए बिना मूल की संभावित अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने कान फेर लेंगे’ मूल के श्रवण-रूपक का स्वाभाविक हिन्दी रूप है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
