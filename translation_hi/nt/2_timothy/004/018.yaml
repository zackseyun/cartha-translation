reference: 2 Timothy 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: hi
  text: प्रभु मुझे हर बुरे काम से छुड़ाएगा और मुझे सकुशल अपने स्वर्गीय राज्य में पहुँचाएगा। उसी की महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥύσεταί
  choice: छुड़ाएगा
  rationale: ῥύομαι संकट या बुराई से बचाने अथवा छुड़ाने का भाव रखता है। यहाँ ‘छुड़ाएगा’ सहज हिन्दी में दैवी उद्धार का अर्थ व्यक्त करता है, पर शारीरिक मृत्यु से बचने की अनिवार्य प्रतिज्ञा नहीं जोड़ता।
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: हर बुरे काम से
  rationale: παντός का वितरणात्मक भाव ‘हर’ से और ἔργου πονηροῦ का नैतिक अर्थ स्वाभाविक हिन्दी ‘बुरे काम’ से व्यक्त होता है।
- source_word: σώσει εἰς
  choice: सकुशल ... में पहुँचाएगा
  rationale: σῴζω उद्धार और सुरक्षित रखने का भाव रखता है, जबकि εἰς लक्ष्य की ओर प्रवेश सूचित करता है। संयुक्त हिन्दी वाक्यांश भावी उद्धार और राज्य में सुरक्षित प्रवेश दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: अपने स्वर्गीय राज्य में
  rationale: αὐτοῦ को कर्ता ‘प्रभु’ के संदर्भ में स्वाभाविक हिन्दी ‘अपने’ से और ἐπουράνιον को ‘स्वर्गीय’ से व्यक्त किया गया है।
- source_word: ᾧ ἡ δόξα
  choice: उसी की महिमा ... होती रहे
  rationale: यूनानी आशीर्वचनात्मक स्तुतिवाक्य को सम्मानपूर्ण और प्रचलित हिन्दी रूप में रखा गया है। ‘उसी’ सर्वनाम प्रभु की ओर स्पष्ट संकेत करता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: शाब्दिक रूप ‘युगों के युगों तक’ अनंत काल का सामी-यूनानी मुहावरा है; ‘युगानुयुग’ उसका संक्षिप्त, गरिमामय और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀμήν
  choice: आमीन
  rationale: उपासना और बाइबिलीय हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
theological_decisions:
- issue: वर्तमान छुड़ाव और अंतिम उद्धार का संबंध
  choice: पहला खंड हर बुरे काम से दैवी छुड़ाव और दूसरा खंड स्वर्गीय राज्य में सुरक्षित प्रवेश व्यक्त करता है; इसे शारीरिक मृत्यु से अवश्य बचने की प्रतिज्ञा नहीं बनाया गया।
  alternative: प्रभु पौलुस को शारीरिक मृत्यु से बचाएगा।
  rationale: ῥύσεταί और σώσει के साथ ‘अपने स्वर्गीय राज्य में’ अंतिम उद्धार की दिशा दिखाता है। ‘सकुशल ... पहुँचाएगा’ इस भरोसे को बनाए रखता है कि बुराई अंतिम विजय नहीं पाएगी, चाहे पौलुस को शहीद होना पड़े।
- issue: σώσει का उद्धार-संबंधी भार
  choice: ‘सकुशल ... पहुँचाएगा’ द्वारा संरक्षण, उद्धार और राज्य में प्रवेश को संयुक्त रूप से व्यक्त किया गया।
  alternative: ‘अपने स्वर्गीय राज्य के लिए बचाए रखेगा’ या अधिक शाब्दिक ‘अपने स्वर्गीय राज्य में बचाएगा।’
  rationale: अधिक शाब्दिक विकल्प आधुनिक हिन्दी में अस्वाभाविक या लक्ष्यगत प्रवेश के विषय में अस्पष्ट हैं। चुना हुआ रूप अर्थ को सहज बनाता है, बिना अंतिम उद्धार की धारणा हटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमामय भक्तिपरक शैली। ‘हर बुरे काम’, ‘सकुशल ... पहुँचाएगा’ और ‘युगानुयुग’ साधारण पाठक के लिए स्पष्ट हैं तथा मूल यूनानी के अर्थ और धार्मिक तनाव को बनाए रखते हैं।
