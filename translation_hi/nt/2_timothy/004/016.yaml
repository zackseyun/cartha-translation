  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: hi
  text: मेरे पहले बचाव[a] में कोई भी मेरे साथ उपस्थित नहीं हुआ[b], पर सबने मुझे छोड़ दिया। यह उनके विरुद्ध न गिना जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी पहली सुनवाई” या “मेरे पहले कानूनी बचाव में।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में, “कोई भी मेरे साथ उपस्थित होने नहीं आया”; प्रसंग में भाव है कि पौलुस के समर्थन में कोई उपस्थित नहीं हुआ।
    reason: lexical_alternative
  - marker: c
    text: या, “यह उनके विरुद्ध दोष के रूप में न ठहराया जाए।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: कानूनी सफ़ाई
  rationale: न्यायिक संदर्भ में यह अधिकारियों के सामने दी गई औपचारिक सफ़ाई या बचाव को दर्शाता है; ‘कानूनी सफ़ाई’ आधुनिक हिंदी में इस अर्थ को स्पष्ट रखता है।
- source_word: πρώτῃ
  choice: पहली
  rationale: यह बचाव या सुनवाई के प्रथम अवसर अथवा चरण को सीधे व्यक्त करता है।
- source_word: παρεγένετο
  choice: मेरा साथ देने उपस्थित नहीं हुआ
  rationale: क्रिया का मूल अर्थ उपस्थित होना है, जबकि प्रसंग पौलुस के समर्थन में उपस्थित होने का भाव देता है; इस अनुवाद में दोनों पहलू सुरक्षित हैं।
- source_word: ἐγκατέλιπον
  choice: मुझे छोड़ दिया
  rationale: यह संकट की घड़ी में किसी को असहाय छोड़ देने का अर्थ देता है; सहज हिंदी में ‘छोड़ दिया’ प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: λογισθείη
  choice: विरुद्ध न गिना जाए
  rationale: निष्क्रिय विधिलिंग प्रार्थना-सदृश इच्छा व्यक्त करता है और हिसाब लगाने अथवा दोष ठहराने की रूपक-छवि बनाए रखता है।
theological_decisions:
- issue: पौलुस को छोड़ने वालों के प्रति अंतिम वाक्य का भाव
  choice: 'प्रार्थना-सदृश इच्छा: ‘यह उनके विरुद्ध न गिना जाए।’'
  alternative: 'अनुमतिसूचक भाव: ‘इसे उनके विरुद्ध न गिना जाए।’'
  rationale: μή के साथ λογισθείη स्वाभाविक रूप से इच्छा या प्रार्थना व्यक्त करता है। यह क्षमा-संबंधी प्रतिध्वनि को बनाए रखता है, पर यूनानी पाठ से आगे कोई विशिष्ट धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; न्यायिक संदर्भ स्पष्ट करने के लिए ‘कानूनी सफ़ाई’ और उपस्थिति तथा समर्थन—दोनों भाव रखने के लिए ‘मेरा साथ देने उपस्थित नहीं हुआ’ चुना गया है। अंतिम वाक्य संक्षिप्त, गरिमापूर्ण और प्रार्थना-सदृश रखा गया है।
