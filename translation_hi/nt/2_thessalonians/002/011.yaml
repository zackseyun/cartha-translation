source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: hi
  text: और इसी कारण परमेश्वर उन्हें भटकाव की प्रभावकारी शक्ति[a] भेजता है, ताकि वे उस झूठ पर विश्वास करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भटकाने वाला प्रभाव,’ ‘धोखे की प्रभावकारी क्रिया,’ अथवा पारंपरिक रूप से ‘प्रबल भ्रम।’
    reason: ἐνέργειαν πλάνης में कार्यरत/प्रभावकारी क्रिया तथा भटकाव, धोखे या भ्रम—दोनों की अर्थ-छाया है। मुख्य पाठ दोनों संज्ञाओं को यथासंभव अलग रखता है।
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद 10 में बताए गए सत्य से प्रेम न करने की ओर कारणात्मक ढंग से संकेत करता है; ‘इसी कारण’ उस संबंध को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: πέμπει
  choice: भेजता है
  rationale: यूनानी वर्तमान काल और परमेश्वर की प्रत्यक्ष कर्तृता—दोनों को बिना नरम किए सुरक्षित रखता है।
- source_word: ἐνέργειαν
  choice: सक्रिय शक्ति
  rationale: ἐνέργεια किसी कार्यरत, प्रभाव उत्पन्न करने वाली सामर्थ्य या क्रिया को दर्शाता है। ‘सक्रिय शक्ति’ साधारण हिंदी में उसके प्रभावकारी पक्ष को व्यक्त करती है, बिना उसे केवल मानसिक अनुभूति मानने के।
- source_word: πλάνης
  choice: भटकाव की
  rationale: πλάνη में भ्रम, धोखे और सत्य से भटक जाने के अर्थ जुड़े हैं। ‘भटकाव’ इस व्यापकता को रखता है और अगले वाक्यांश में झूठ पर विश्वास करने से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐνέργειαν πλάνης
  choice: भटकाव की सक्रिय शक्ति
  rationale: यह अभिव्यक्ति दोनों यूनानी संज्ञाओं को अलग पहचान देती है और इस अस्पष्टता को बनाए रखती है कि बात भटकाने वाले प्रभाव की है या भटकाव से चिह्नित प्रभावकारी क्रिया की।
- source_word: εἰς τὸ πιστεῦσαι
  choice: ताकि वे … विश्वास करें
  rationale: यह यूनानी रचना उद्देश्य और परिणाम, दोनों की छाया रख सकती है। ‘ताकि’ उसके लक्ष्यात्मक/परिणामात्मक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῷ ψεύδει
  choice: उस झूठ पर
  rationale: सवर्तिकल एकवचन किसी निश्चित झूठ की ओर संकेत करता है। ‘उस झूठ’ प्रसंगगत विशिष्टता को बनाए रखता है; ‘पर विश्वास करना’ मानक हिंदी प्रयोग है।
theological_decisions:
- issue: न्यायस्वरूप कठोरता में परमेश्वर की कर्तृता
  choice: परमेश्वर … भेजता है
  alternative: परमेश्वर भटकाव को आने देता है / परमेश्वर उन्हें भटकाव के हवाले कर देता है
  rationale: यूनानी पाठ में परमेश्वर πέμπει (‘भेजता है’) का स्पष्ट कर्ता है। अनुवाद इसे केवल अनुमति में नहीं बदलता, बल्कि सत्य को अस्वीकार करने के प्रत्युत्तर में आने वाले ईश्वरीय न्याय और मानवीय उत्तरदायित्व के बीच पाठ में उपस्थित तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य। ‘भटकाव की सक्रिय शक्ति’ कुछ औपचारिक है, पर मूल की दो संज्ञाओं और उनकी अर्थगत अस्पष्टता को सुरक्षित रखने के लिए चुना गया है।
