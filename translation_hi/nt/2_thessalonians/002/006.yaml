base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: hi
  text: और अब तुम जानते हो कि उसे क्या रोके हुए है[a], ताकि वह अपने ही समय[b] में प्रकट हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे क्या थामे हुए है।” यूनानी में यहाँ नपुंसकलिंग अभिव्यक्ति है और रोकनेवाली शक्ति की पहचान नहीं बताई गई है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने नियत समय में।” यूनानी पदबंध में उचित अथवा नियत समय का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: जो उसे रोके हुए है / उसे क्या रोके हुए है
  rationale: नपुंसकलिंग संज्ञीकृत कृदंत का अनुवाद किसी व्यक्ति या शक्ति की पहचान किए बिना किया गया है। हिंदी वाक्य-विन्यास में ‘उसे क्या रोके हुए है’ स्वाभाविक है और रोकने अथवा पीछे थामे रखने का भाव व्यक्त करता है।
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: यह क्रिया वर्तमान अर्थ में पहले से विदित बात को दर्शाती है; ‘तुम जानते हो’ सीधा और स्वाभाविक अनुवाद है।
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: ताकि वह ... प्रकट हो
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा यहाँ उद्देश्य या अपेक्षित परिणाम का भाव देती है। कर्मवाच्य अर्थ को ‘वह प्रकट हो’ से सहज हिंदी में सुरक्षित रखा गया है।
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: अपने ही समय में
  rationale: ἑαυτοῦ के आत्मवाचक बल को ‘ही’ से व्यक्त किया गया है। καιρός उचित या नियत अवसर का भाव रख सकता है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘नियत समय’ जोड़ने के बजाय मूल की व्यापकता रखी गई है।
- source_word: νῦν
  choice: अब
  rationale: सरल कालवाचक क्रियाविशेषण का स्वाभाविक हिंदी समतुल्य।
- source_word: αὐτόν
  choice: उसे / वह
  rationale: पुल्लिंग सर्वनाम पहले उल्लिखित उस व्यक्ति की ओर संकेत करता है जिसे प्रकट होना है; उसकी पहचान अनुवाद में नहीं जोड़ी गई।
theological_decisions:
- issue: रोकनेवाले तत्व या व्यक्ति की पहचान
  choice: ‘उसे क्या रोके हुए है’ कहकर पहचान खुली रखी गई है।
  alternative: रोमी शासन, पवित्र आत्मा, कोई स्वर्गदूत, अथवा परमेश्वर का विधान
  rationale: इस पद में τὸ κατέχον नपुंसकलिंग है और रोकनेवाले की पहचान नहीं बताता। किसी विशिष्ट धार्मिक व्याख्या को पाठ में लाना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: अंतकालीन संदर्भ में καιρός का अर्थ
  choice: ‘अपने ही समय में’
  alternative: ‘अपने नियत समय में’ अथवा ‘अपने उचित समय पर’
  rationale: καιρός में नियत या उपयुक्त समय का भाव संभव है, किंतु ‘अपने ही समय में’ मूल अभिव्यक्ति के निकट रहते हुए उसे अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: εἰς τό के उद्देश्य और परिणाम के बीच संबंध
  choice: ‘ताकि’
  alternative: ‘जिससे’ अथवा ‘उसके प्रकट होने के लिए’
  rationale: यह रचना उद्देश्य या परिणाम, दोनों की छाया रख सकती है। ‘ताकि’ आधुनिक हिंदी में वाक्य को स्पष्ट रखता है, पर इसे किसी विस्तृत कारणात्मक सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘प्रकट हो’ धार्मिक संदर्भ में स्वाभाविक है, जबकि रोकनेवाले की पहचान और समय की प्रकृति को व्याख्या द्वारा निश्चित नहीं किया गया है।
