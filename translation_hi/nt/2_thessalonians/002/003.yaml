source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: hi
  text: कोई तुम्हें किसी भी तरह धोखा न दे, क्योंकि वह दिन तब तक नहीं आएगा जब तक पहले वह विद्रोह[a] न हो जाए और अधर्म का वह मनुष्य[b] प्रकट न हो जाए—विनाश का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धर्मत्याग’।
    reason: alternative_reading
  - marker: b
    text: कुछ हस्तलिपियों में ‘अधर्म का मनुष्य’ के स्थान पर ‘पाप का मनुष्य’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: धोखा दे
  rationale: यह क्रिया छल देने या भटका देने का अर्थ रखती है। चेतावनी के प्रसंग में ‘धोखा दे’ स्वाभाविक और सटीक है।
- source_word: κατὰ μηδένα τρόπον
  choice: किसी भी तरह
  rationale: यह मुहावरा निषेध पर जोर देता है और धोखे के हर तरीके को समेटता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पिछली चेतावनी का कारण प्रस्तुत करता है; ‘क्योंकि’ तर्क-संबंध को स्पष्ट रखता है।
- source_word: ἐὰν μὴ ἔλθῃ
  choice: तब तक नहीं आएगा, जब तक ... न हो
  rationale: यूनानी में पिछले पद से ‘वह दिन’ समझा जाता है। हिंदी में उसे स्पष्ट रूप से जोड़कर आवश्यक पूर्वशर्त का भाव स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἡ ἀποστασία
  choice: वह विद्रोह
  rationale: ἀποστασία निर्णायक विद्रोह या धर्मत्याग का संकेत दे सकता है। मुख्य पाठ में व्यापक अर्थ ‘विद्रोह’ रखा गया है ताकि इसे केवल धार्मिक धर्मत्याग तक सीमित न किया जाए।
- source_word: πρῶτον
  choice: पहले
  rationale: यह घटनाओं का क्रम बताता है; ‘पहले’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ἀποκαλυφθῇ
  choice: प्रकट न हो
  rationale: कर्मवाच्य क्रिया उस व्यक्ति के उजागर या प्रत्यक्ष किए जाने को बताती है। ‘प्रकट’ हिंदी में स्वाभाविक है और प्रकाशन-संबंधी भाव बनाए रखता है।
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: अधर्म का मनुष्य
  rationale: SBLGNT में ἀνομίας का अर्थ व्यवस्था-विरोध, अधर्म या अराजकता है। ‘अधर्म’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए बोधगम्य है; एकवचन पुल्लिंग विशिष्ट व्यक्ति को दर्शाता है।
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: विनाश का पुत्र
  rationale: यह सामी शैली की अभिव्यक्ति है, जो विनाश से पहचाने जाने वाले या विनाश के लिए नियत व्यक्ति को सूचित कर सकती है। मूल रूप और उसकी अर्थगत खुली बनावट दोनों सुरक्षित रखी गई हैं।
theological_decisions:
- issue: ‘वह दिन’ को पिछले पद से स्पष्ट रूप से जोड़ना
  choice: मुख्य पाठ में ‘वह दिन’ जोड़ा गया
  alternative: यूनानी की तरह वाक्य को अध्याहारयुक्त छोड़ना
  rationale: यूनानी पाठ में कर्ता पिछले पद के ‘प्रभु के दिन’ से समझा जाता है। हिंदी में उसे व्यक्त करना वाक्य को स्पष्ट बनाता है, बिना निकटवर्ती संदर्भ से आगे कोई नई व्याख्या जोड़े।
- issue: ἀποστασία का अर्थ
  choice: वह विद्रोह
  alternative: धर्मत्याग; विश्वास से फिर जाना
  rationale: शब्द सामान्य विद्रोह और धार्मिक विमुखता दोनों का भाव रख सकता है। व्यापक अनुवाद विवादित अंत-कालीन पहचान को समय से पहले तय नहीं करता; वैकल्पिक धार्मिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: τῆς ἀνομίας का पाठांतर
  choice: SBLGNT के अनुसार ‘अधर्म का’
  alternative: कुछ हस्तलिपियों के अनुसार ‘पाप का’
  rationale: दिए गए मूल पाठ में ἀνομίας है, इसलिए मुख्य पाठ उसी का अनुवाद करता है। प्रसिद्ध पाठांतर को पारदर्शिता के लिए पादटिप्पणी में दर्ज किया गया है।
- issue: ὁ υἱὸς τῆς ἀπωλείας की व्याख्या
  choice: रूपक को ‘विनाश का पुत्र’ के रूप में सुरक्षित रखा
  alternative: ‘विनाश के लिए नियत व्यक्ति’ कहकर अर्थ खोलना
  rationale: मूल सामी अभिव्यक्ति चरित्र और नियति दोनों की ओर संकेत कर सकती है। शाब्दिक रूप उस वास्तविक अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और सार्वजनिक-पाठ योग्य रूप अपनाया गया है। ‘अधर्म का मनुष्य’ और ‘विनाश का पुत्र’ मूल की विशिष्ट उपाधियों तथा अर्थगत तनाव को सुरक्षित रखते हैं।
