id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: hi
  text: और स्वयं हमारे प्रभु यीशु मसीह और हमारे पिता परमेश्वर, जिन्होंने हमसे प्रेम किया और अनुग्रह के द्वारा हमें अनन्त प्रोत्साहन[a] और उत्तम आशा दिए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सांत्वना’ अथवा ‘दिलासा’।
    reason: παράκλησιν के अर्थ-क्षेत्र में प्रोत्साहन, सांत्वना और दिलासा सभी सम्मिलित हो सकते हैं।
lexical_decisions:
- source_word: Αὐτὸς
  choice: स्वयं
  rationale: यह गहनताबोधक प्रयोग है, जो इस प्रार्थनात्मक कामना में व्यक्तिगत कर्तृत्व पर बल देता है। इसे आरम्भिक संयुक्त कर्ता के साथ रखकर यूनानी वाक्य-विन्यास का बल यथासंभव बनाए रखा गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि पिछले कथन से प्रार्थनात्मक कामना की ओर हल्का संक्रमण दिखाता है; हिन्दी में ‘और’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: मसीही उपाधि के रूप में κύριος का मानक, प्रतिष्ठित और सहज हिन्दी प्रतिशब्द।
- source_word: Ἰησοῦς Χριστὸς
  choice: यीशु मसीह
  rationale: Χριστός यहाँ उपाधिगत अर्थ रखता है; हिन्दी में ‘मसीह’ स्वयं स्वाभाविक रूप से उपाधि व्यक्त करता है और अलग निश्चित उपपद की आवश्यकता नहीं होती।
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: यह पदबंध θεός और πατήρ दोनों को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक क्रम अपनाता है।
- source_word: ὁ ἀγαπήσας
  choice: जिन्होंने हमसे प्रेम किया
  rationale: कर्तृवाचक कृदन्त को सहज हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; भूतकालीन क्रिया को बिना अतिरिक्त कालगत व्याख्या के रखा गया है।
- source_word: δοὺς
  choice: दी
  rationale: यह ἀγαπήσας के साथ जुड़ी अओरिस्ट क्रिया है; ‘दी’ सरल भूतकाल और ‘आशा’ के स्त्रीलिंग के अनुसार स्वाभाविक है।
- source_word: παράκλησιν
  choice: प्रोत्साहन
  rationale: संदर्भ विश्वासियों को दृढ़ करने का है, इसलिए ‘प्रोत्साहन’ उपयुक्त है; ‘सांत्वना’ और ‘दिलासा’ की संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: αἰωνίαν
  choice: अनन्त
  rationale: यह αἰώνιος के स्थायी और कालातीत विस्तार को संक्षेप में व्यक्त करता है।
- source_word: ἐλπίδα ἀγαθὴν
  choice: उत्तम आशा
  rationale: यह विशेषण के सकारात्मक गुणात्मक बल को बनाए रखता है और आधुनिक हिन्दी में गरिमापूर्ण तथा सहज है।
- source_word: ἐν χάριτι
  choice: अनुग्रह के द्वारा
  rationale: यहाँ ἐν को साधनात्मक अथवा कारणात्मक समझना उपयुक्त है; ‘के द्वारा’ प्रोत्साहन और आशा के अनुग्रह से दिए जाने को स्पष्ट करता है।
theological_decisions:
- issue: एकवचन कृदन्तों का संयुक्त कर्ताओं—प्रभु यीशु मसीह और पिता परमेश्वर—से संबंध
  choice: एक ही संबंधवाचक खंड ‘जिन्होंने हमसे प्रेम किया और… दी’ रखा गया है, बिना यह स्पष्ट रूप से तय किए कि उसका संबंध केवल पिता से है या दोनों से।
  alternative: खंड को केवल ‘हमारे पिता परमेश्वर’ से जोड़ देना, अथवा विस्तार करके दोनों व्यक्तियों को अलग-अलग स्पष्ट कर्ता बनाना।
  rationale: यूनानी में संयुक्त कर्ता के बाद एकवचन कृदन्त आते हैं। हिन्दी का आदरसूचक/बहुवचन रूप ‘जिन्होंने’ निकटतम एकवचन आदरसूचक कर्ता या संयुक्त कर्ता—दोनों के साथ पढ़ा जा सकता है; इससे मूल की व्याकरणिक और धर्मवैज्ञानिक तनावपूर्ण अस्पष्टता अनावश्यक व्याख्या के बिना बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। पद 16 का वाक्य पद 17 में पूरा होता है, इसलिए मसौदा स्रोत की तरह अल्पविराम पर समाप्त होता है।
