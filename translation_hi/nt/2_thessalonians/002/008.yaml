  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: hi
  text: और तब वह अधर्मी प्रकट होगा, जिसे प्रभु यीशु अपने मुँह की साँस से मार डालेंगे[a] और अपने आगमन के प्रकटन से निष्प्रभावी कर देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मुँह की आत्मा से।” यूनानी शब्द का अर्थ “साँस” या “आत्मा” दोनों हो सकता है; यहाँ मुहावरे में “साँस” अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी उपस्थिति के प्रकटन से।” यहाँ यूनानी शब्द का सामान्य संदर्भगत अर्थ “आगमन” है, यद्यपि उसका अर्थ “उपस्थिति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: प्रकट होगा
  rationale: भविष्यत् कर्मवाच्य का स्वाभाविक हिन्दी रूप; यह बताता है कि अधर्मी सबके सामने प्रकट किया जाएगा, पर कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὁ ἄνομος
  choice: वह अधर्मी
  rationale: लेखयुक्त विशेषण का संज्ञात्मक प्रयोग है। ‘वह अधर्मी’ ज्ञात अंतकालीन विरोधी की ओर संकेत करता है और इस पद में न आए ‘मनुष्य’ शब्द को नहीं जोड़ता।
- source_word: ὁ κύριος Ἰησοῦς
  choice: प्रभु यीशु
  rationale: κύριος के उपाधिपरक अर्थ और Ἰησοῦς के प्रचलित हिन्दी नाम-रूप को सुरक्षित रखता है।
- source_word: ἀνελεῖ
  choice: मार डालेंगे
  rationale: यहाँ क्रिया वध करने या प्राण लेने का प्रबल अर्थ देती है; ‘मार डालेंगे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: अपने मुँह की साँस से
  rationale: πνεῦμα का अर्थ ‘साँस’ या ‘आत्मा’ दोनों हो सकता है; इस मुहावरे और यशायाह 11:4 की प्रतिध्वनि में ‘साँस’ अधिक स्वाभाविक है।
- source_word: καταργήσει
  choice: निष्प्रभावी कर देंगे
  rationale: καταργέω का अर्थ शक्ति या प्रभाव को समाप्त करना है। यह निर्णायक निराकरण व्यक्त करता है, बिना अनिवार्यतः अस्तित्व-मिटा देने का अर्थ थोपे।
- source_word: τῇ ἐπιφανείᾳ
  choice: प्रकट होने से
  rationale: ἐπιφάνεια दृश्य प्रकटन या अभिव्यक्ति को दर्शाता है; ‘प्रकट होना’ सहज और अर्थ-सटीक हिन्दी है।
- source_word: τῆς παρουσίας αὐτοῦ
  choice: अपने आगमन के
  rationale: अंतकालीन संदर्भ में παρουσία सामान्यतः आगमन को सूचित करता है, यद्यपि उसके अर्थ-क्षेत्र में ‘उपस्थिति’ भी है।
theological_decisions:
- issue: अंतकालीन विरोधी की पहचान और अभिव्यक्ति
  choice: वह अधर्मी
  alternative: अधर्म का मनुष्य
  rationale: इस पद में ὁ ἄνομος है, न कि निकटवर्ती संदर्भ का विस्तृत पदबंध। इसलिए इसी पद की संज्ञात्मक विशेषण-रचना को रखा गया है।
- issue: प्रभु यीशु की विजय का माध्यम
  choice: अपने मुँह की साँस से
  alternative: अपने मुँह की आत्मा से
  rationale: मुहावरे में ‘साँस’ अधिक संभावित है, पर πνεῦμα की वास्तविक शाब्दिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: καταργήσει की निर्णायकता
  choice: निष्प्रभावी कर देंगे
  alternative: नष्ट कर देंगे
  rationale: चुना हुआ रूप विरोधी की शक्ति और प्रभाव के निर्णायक अंत को व्यक्त करता है, पर क्रिया में आवश्यक न होने वाला पूर्ण अस्तित्व-विनाश नहीं जोड़ता।
- issue: παρουσία का अंतकालीन अर्थ
  choice: आगमन
  alternative: उपस्थिति
  rationale: इस संदर्भ में ‘आगमन’ सामान्य और संभावित अर्थ है; व्यापक शाब्दिक अर्थ ‘उपस्थिति’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘मार डालेंगे’ क्रिया का बल स्पष्ट रखता है; ‘निष्प्रभावी कर देंगे’ καταργέω की सूक्ष्मता बनाए रखता है। सर्वनाम-सहमति आदरसूचक ‘प्रभु यीशु ... देंगे’ के अनुसार रखी गई है।
