translation:
  language: hi
  text: तुम्हारे हृदयों को प्रोत्साहित करे[a] और हर अच्छे काम और वचन में दृढ़ करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे हृदयों को सांत्वना दे’; παρακαλέσαι का अर्थ ‘सांत्वना देना’ या ‘आग्रह करना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्थिर करे’ अथवा ‘पक्का करे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: प्रोत्साहित करे
  rationale: यह क्रिया प्रोत्साहन देने, सांत्वना देने या आग्रह करने के अर्थ रख सकती है। पद 16 के ‘अनन्त प्रोत्साहन’ के संदर्भ में ‘प्रोत्साहित करे’ इसका व्यापक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καρδίας
  choice: हृदयों
  rationale: ‘हृदय’ बाइबलीय रूपक को बनाए रखता है और केवल भावनाओं या बुद्धि तक अर्थ को सीमित नहीं करता; यहाँ यह भीतरी मनुष्य को दर्शाता है।
- source_word: στηρίξαι
  choice: दृढ़ करे
  rationale: क्रिया का मूल भाव किसी को स्थिर, मजबूत या पक्का करना है। ‘दृढ़ करे’ आधुनिक हिन्दी में इस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ἐν παντὶ
  choice: हर ... में
  rationale: ἐν के साथ दत्तिव यहाँ उस क्षेत्र को बताता है जिसमें दृढ़ता प्रकट होनी है।
- source_word: ἔργῳ
  choice: काम
  rationale: ἔργον किसी कार्य या कर्म को दर्शाता है। ‘काम’ साधारण पाठक के लिए स्वाभाविक है और ‘वचन’ के साथ आचरण तथा कथन की जोड़ी बनाता है।
- source_word: λόγῳ
  choice: वचन
  rationale: λόγος यहाँ काम के समानांतर कथन या बोली हुई बात को सूचित करता है। ‘वचन’ संक्षिप्त स्रोत-जोड़ी को बनाए रखता है, यद्यपि यहाँ उसका आशय सामान्यतः कही गई बात है।
- source_word: ἀγαθῷ
  choice: अच्छे
  rationale: यह विशेषण अर्थ की दृष्टि से काम और वचन दोनों की अच्छाई बताता है; हिन्दी में साझा विशेषण वाला संक्षिप्त विन्यास मूल की संरचना को निकटता से रखता है।
- source_word: ὑμῶν
  choice: तुम्हारे
  rationale: बहुवचन सम्बन्धवाचक सर्वनाम ‘हृदयों’ से जुड़ा है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों प्रार्थनात्मक क्रियाओं तथा काम-वचन की संज्ञा-जोड़ी को जोड़ता है।
theological_decisions:
- issue: καρδία को आधुनिक मनोवैज्ञानिक श्रेणी के रूप में समझाकर अनुवाद करना या बाइबलीय रूपक बनाए रखना
  choice: हृदयों
  alternative: मन या भीतरी व्यक्तित्व
  rationale: ‘हृदयों’ मूल की मानव-सम्बन्धी व्यापक और जानबूझकर रूपकात्मक भाषा को बनाए रखता है तथा इसे केवल विचारों या भावनाओं तक सीमित नहीं करता।
- issue: στηρίξαι में दृढ़ करने और स्थापित करने के बीच चयन
  choice: दृढ़ करे
  alternative: स्थिर करे या स्थापित करे
  rationale: ‘दृढ़ करे’ किसी को मजबूत और स्थिर किए जाने का भाव स्वाभाविक हिन्दी में देता है, बिना किसी विशेष सांप्रदायिक अर्थ को जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हृदयों’ बाइबलीय रूपक को सुरक्षित रखता है; ‘प्रोत्साहित करे’ और ‘दृढ़ करे’ साधारण पाठक के लिए समझने योग्य हैं। वाक्य पूर्ववर्ती पद से आने वाले कर्ता पर निर्भर प्रार्थनात्मक खंड है, इसलिए यहाँ नया कर्ता नहीं जोड़ा गया।
