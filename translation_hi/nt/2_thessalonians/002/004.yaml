source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: hi
  text: वह जो विरोध करता है और हर तथाकथित ईश्वर या उपासना की वस्तु से अपने आपको ऊँचा उठाता है, इतना कि वह परमेश्वर के मंदिर[a] में बैठ जाए और अपने आपको परमेश्वर होने का प्रदर्शन करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का पवित्र स्थान।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने आपको ऐसा प्रदर्शित करे कि वह एक ईश्वर है।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: जो विरोध करता
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त का निरन्तर विरोधी कार्य सहज हिन्दी में व्यक्त होता है; इसे किसी ऐसे तकनीकी नाम में नहीं बदला गया जो यूनानी में स्पष्ट नहीं है।
- source_word: ὑπεραιρόμενος ἐπὶ
  choice: से अपने आपको ऊँचा उठाता है
  rationale: मध्यवाच्य का आत्मोन्नयन वाला भाव और ἐπί के साथ श्रेष्ठता का अर्थ सुरक्षित रहता है।
- source_word: πάντα λεγόμενον θεὸν
  choice: हर तथाकथित ईश्वर
  rationale: ‘तथाकथित’ λεγόμενον का यह संकेत बनाए रखता है कि उसे ईश्वर कहा जाता है, पर कथन उसकी वास्तविक ईश्वरता की पुष्टि नहीं करता।
- source_word: σέβασμα
  choice: उपासना की वस्तु
  rationale: यह पद किसी देवता तक सीमित न होकर धार्मिक श्रद्धा या उपासना की हर वस्तु को समेटता है।
- source_word: ὥστε
  choice: यहाँ तक कि
  rationale: यहाँ परिणाम की पराकाष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: परमेश्वर के मन्दिर में
  rationale: ναός मन्दिर, विशेषतः उसके पवित्र भाग, को सूचित कर सकता है; मुख्य पाठ में ‘मन्दिर’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: καθίσαι
  choice: बैठकर
  rationale: परिणामस्वरूप घटने वाले बैठने के कार्य को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; सन्दर्भ में अधिकारपूर्ण आसन ग्रहण करने का संकेत बना रहता है।
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: अपने आपको ... के रूप में प्रदर्शित करता है
  rationale: यह सार्वजनिक रूप से स्वयं को वैसा दिखाने या प्रस्तुत करने का भाव रखता है, बिना इसे केवल मौखिक घोषणा मानने के।
- source_word: ὅτι ἔστιν θεός
  choice: परमेश्वर के रूप में
  rationale: सन्दर्भ में यह परमेश्वर होने का चरम, निन्दात्मक दावा व्यक्त करता है; यूनानी में पद के निर्धारक-रहित होने से सम्भव वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: अन्तिम θεός को ‘परमेश्वर’ माना जाए या ‘एक ईश्वर’
  choice: परमेश्वर
  alternative: एक ईश्वर
  rationale: परमेश्वर के मन्दिर में बैठने के सन्दर्भ में सर्वोच्च ईश्वरीय पद का दावा प्रमुख प्रतीत होता है। यह उस व्यक्ति के दावे का वर्णन है, उसकी वास्तविक ईश्वरता की पुष्टि नहीं। निर्धारक-रहित यूनानी संज्ञा के कारण दूसरा अर्थ सम्भव है और पाद-टिप्पणी में सुरक्षित है।
- issue: ναός का अनुवाद ‘मन्दिर’ हो या अधिक विशिष्ट ‘पवित्रस्थान’
  choice: मन्दिर
  alternative: परमेश्वर का पवित्रस्थान
  rationale: ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है और यह विवाद तय नहीं करता कि संकेत किसी भौतिक मन्दिर का है या रूपकात्मक पवित्र क्षेत्र का; ‘पवित्रस्थान’ यूनानी पद की अधिक विशिष्ट सम्भावना है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘ईश्वर’ तथाकथित देवताओं के लिए और ‘परमेश्वर’ सन्दर्भित सच्चे परमेश्वर तथा उस पद पर किए गए दावे के लिए रखा गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
