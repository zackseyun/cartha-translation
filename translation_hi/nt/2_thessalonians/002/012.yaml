  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: hi
  text: ताकि उन सबका न्याय हो जिन्होंने सत्य पर विश्वास नहीं किया, बल्कि अधार्मिकता में प्रसन्न हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोषी ठहराए जाएँ।” इस संदर्भ में यूनानी क्रिया प्रतिकूल न्याय का भाव दे सकती है, यद्यपि उसका अधिक शाब्दिक अर्थ “न्याय किया जाए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले संदर्भ से उद्देश्य अथवा परिणाम का संबंध जोड़ता है; ‘ताकि’ दोनों के बीच की संभावित अर्थ-छाया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: κριθῶσιν
  choice: का न्याय हो
  rationale: κρίνω के निष्क्रिय रूप का मूल न्यायिक अर्थ सुरक्षित रहता है। संदर्भ प्रतिकूल न्याय का संकेत देता है, पर मुख्य पाठ में ‘दोषी ठहराए जाएँ’ कहना यूनानी से अधिक स्पष्ट व्याख्या होता।
- source_word: πάντες
  choice: उन सभी
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और आगे आने वाले वर्णन से सहजता से जुड़ता है।
- source_word: οἱ μὴ πιστεύσαντες
  choice: जिन्होंने ... विश्वास नहीं किया
  rationale: आर्टिकल सहित एओरिस्ट कृदंत ‘वे जिन्होंने विश्वास नहीं किया’ के अर्थ में है; हिन्दी का संबंधवाचक रूप स्वाभाविक है।
- source_word: τῇ ἀληθείᾳ
  choice: सत्य पर
  rationale: πιστεύω के साथ प्रयुक्त संप्रदान कारक को हिन्दी में ‘पर विश्वास करना’ स्वाभाविक रूप से व्यक्त करता है; ‘सत्य’ संदर्भ में निश्चित सुसमाचारी सत्य की ओर संकेत करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: सत्य पर अविश्वास और अधार्मिकता में प्रसन्न होने के बीच तीखा विरोध व्यक्त करता है।
- source_word: εὐδοκήσαντες
  choice: से प्रसन्न हुए
  rationale: यह केवल बौद्धिक स्वीकृति नहीं, बल्कि रुचि, संतोष या आनंद लेने का भाव व्यक्त करता है।
- source_word: τῇ ἀδικίᾳ
  choice: अधार्मिकता
  rationale: ἀδικία के व्यापक नैतिक अर्थ—अन्याय, बुराई और धर्म-विरुद्ध आचरण—को पौलुस के धार्मिक-नैतिक संदर्भ में सुरक्षित रखता है।
theological_decisions:
- issue: κριθῶσιν का अनुवाद सामान्य ‘न्याय हो’ किया जाए या अधिक व्याख्यात्मक ‘दोषी ठहराए जाएँ’
  choice: का न्याय हो
  alternative: दोषी ठहराए जाएँ
  rationale: तात्कालिक संदर्भ प्रतिकूल निर्णय की ओर स्पष्ट संकेत करता है, फिर भी κρίνω अपने आप में व्यापक रूप से न्याय किए जाने को बताता है। मुख्य पाठ मूल शब्द की व्यापकता बनाए रखता है और अधिक स्पष्ट दंडात्मक अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और न्यायिक-धार्मिक भाव वाला वाक्य। ‘अधार्मिकता’ को ‘बुराई’ या ‘गलत काम’ की अपेक्षा चुना गया है, ताकि पौलुस की नैतिक-धार्मिक शब्दावली बनी रहे।
