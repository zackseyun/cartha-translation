translation:
  language: hi
  text: क्या तुम्हें याद नहीं कि जब मैं अभी भी तुम्हारे साथ था, तब मैं तुम्हें ये बातें बताता था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: याद नहीं
  rationale: वर्तमान काल के इस आलंकारिक प्रश्न में पाठकों से पहले दी गई शिक्षा स्मरण करने को कहा गया है; ‘याद’ सहज और आधुनिक हिन्दी है।
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: जब मैं तुम्हारे साथ था
  rationale: यह वाक्यांश पौलुस की उस समय की व्यक्तिगत उपस्थिति बताता है। हिन्दी में ‘जब मैं तुम्हारे साथ था’ स्वाभाविक रूप से कालगत अर्थ व्यक्त करता है; यहाँ ἔτι को अलग से ‘अभी भी’ कहना असहज और अनावश्यक होगा।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पद प्रसंग में पहले बताई गई बातों की ओर लौटता है; ‘ये बातें’ उसके बहुवचन को स्पष्ट और सहज रूप में रखता है।
- source_word: ἔλεγον
  choice: कहा करता था
  rationale: अपूर्ण भूतकाल पूर्व में जारी या बार-बार होने वाली क्रिया का संकेत दे सकता है; ‘कहा करता था’ इस पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὐ ... ὅτι
  choice: क्या तुम्हें याद नहीं कि
  rationale: यह रचना स्मरण की विषयवस्तु प्रस्तुत करने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या तुम्हें याद नहीं कि’ इसका सीधा और स्वाभाविक रूप है।
