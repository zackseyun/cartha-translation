translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में निकट, बहुवचन ‘तुम्हें/तुम्हारे/तुमसे’ रखा गया है। भाषा सरल किंतु गरिमापूर्ण है, और अपूर्ण भूतकाल का जारी या बारंबार अर्थ ‘कहा करता था’ से व्यक्त किया गया है।
