revisions:
- from: क्या तुम्हें याद नहीं कि जब मैं तुम्हारे साथ था, तब मैं तुमसे ये बातें कहा करता था?
  to: क्या तुम्हें याद नहीं कि जब मैं अभी भी तुम्हारे साथ था, तब मैं तुम्हें ये बातें बताता था?
  rationale: The revision restores the unrepresented force of ἔτι (‘still’) and replaces an unidiomatic verbal construction with natural modern Hindi. ‘बताता था’ preserves the imperfect’s ongoing or repeated past sense without overstating it.
