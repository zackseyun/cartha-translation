id: 2TH.2.10
reference: 2 Thessalonians 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: hi
  text: और नाश होनेवालों के लिए अधर्म के हर प्रकार के छल के साथ[a][b], क्योंकि उन्होंने सत्य के प्रेम को ग्रहण नहीं किया[c], ताकि वे बचाए जाएँ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्म के हर छल के साथ।’
    reason: lexical_alternative
  - marker: b
    text: या ‘नाश होनेवालों में’ अथवा ‘नाश होनेवालों के प्रति।’
    reason: lexical_alternative
  - marker: c
    text: या ‘स्वीकार नहीं किया’ अथवा ‘सत्य के प्रेम का स्वागत नहीं किया।’
    reason: lexical_alternative
  - marker: d
    text: या ‘उनके बचाए जाने के लिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: छल
  rationale: यह शब्द सक्रिय धोखे या छल को दर्शाता है; संदर्भ में ‘भ्रम’ की अपेक्षा ‘छल’ अधिक स्वाभाविक है।
- source_word: ἀδικίας
  choice: अधर्म के
  rationale: संबंधकारक पद छल के नैतिक स्वरूप को बताता है। ‘अधर्म के’ संज्ञात्मक रूप और धार्मिक-नैतिक बल को बनाए रखता है।
- source_word: τοῖς ἀπολλυμένοις
  choice: नाश होनेवालों के लिए
  rationale: दत्तिव पद को लक्ष्य अथवा संबंधित समूह के रूप में रखा गया है। वर्तमान कृदंत की जारी अवस्था ‘नाश होनेवालों’ से सुरक्षित रहती है।
- source_word: ἀνθ’ ὧν
  choice: क्योंकि
  rationale: यहाँ पद कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इसका स्वाभाविक causal अर्थ देता है।
- source_word: ἀγάπην τῆς ἀληθείας
  choice: सत्य के प्रेम
  rationale: मूल संबंधकारक रचना को सुरक्षित रखा गया है; संदर्भ में इसका प्रमुख आशय सत्य के प्रति प्रेम है, पर अनुवाद उसे व्याख्यात्मक ढंग से सीमित नहीं करता।
- source_word: ἐδέξαντο
  choice: ग्रहण नहीं किया
  rationale: δέχομαι के स्वीकार करने, प्राप्त करने या स्वागत करने के भाव को ‘ग्रहण करना’ स्वाभाविक और पर्याप्त रूप से औपचारिक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: जिससे वे बचाए जाते
  rationale: εἰς सहित infinitive के उद्देश्य/परिणाम संबंध को ‘जिससे’ व्यक्त करता है और passive ‘बचाए जाते’ को बनाए रखता है।
theological_decisions:
- issue: क्या ἀπολλυμένοις को निश्चित रूप से ‘दण्ड के लिए ठहराए हुए’ कहा जाए या जारी अवस्था के रूप में रखा जाए?
  choice: नाश होनेवाले
  alternative: नाश के लिए ठहराए हुए
  rationale: वर्तमान middle/passive participle जारी अवस्था दर्शाता है; चुना हुआ रूप किसी विशिष्ट पूर्वनियति-संबंधी निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: ‘सत्य के प्रेम’ का अर्थ सत्य के प्रति प्रेम है या सत्य का उनसे प्रेम?
  choice: सत्य के प्रेम
  alternative: सत्य के प्रति प्रेम
  rationale: संदर्भ वस्तुगत संबंध—सत्य से प्रेम—का प्रबल समर्थन करता है, फिर भी मूल संबंधकारक की बनावट बनाए रखने से वास्तविक व्याकरणिक तनाव अनावश्यक रूप से समाप्त नहीं होता।
- issue: εἰς τὸ σωθῆναι αὐτούς उद्देश्य बताता है या परिणाम?
  choice: जिससे वे बचाए जाते
  alternative: ताकि वे बचाए जाते
  rationale: ‘जिससे’ हिन्दी में उद्देश्य और परिणामी संभावना दोनों को खुला रखता है, जबकि passive अर्थ भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरम्भ में ‘और’ रखा गया है। ‘होनेवालों’ को प्रचलित संयुक्त वर्तनी में रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
