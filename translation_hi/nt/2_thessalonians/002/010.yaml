  verdict: revise
  source_fidelity: 'The draft accurately represents the deception, the unrighteous character of that deception, the group described as perishing, their refusal to receive the love of the truth, and the causal connection. However, “जिससे वे बचाए जाते” uses an imperfective present-passive sense (“by which they are being saved”), whereas εἰς τὸ σωθῆναι αὐτούς is a telic articular aorist infinitive: “so that/in order that they might be saved.”'
  naturalness: The wording is generally clear, dignified modern Hindi. “ताकि वे बचाए जाएँ” is both more natural in this construction and more faithful to the purpose nuance than “जिससे वे बचाए जाते.”
  terminology: “अधर्म,” “छल,” “सत्य के प्रेम,” “ग्रहण नहीं किया,” and “नाश होनेवालों” suitably preserve the source’s moral and theological register without forcing a doctrinal conclusion. The genitive in “सत्य के प्रेम” appropriately retains the source phrasing.
  issues:
  - severity: medium
    issue: The final purpose clause is rendered as “जिससे वे बचाए जाते।”
    rationale: This changes εἰς τὸ σωθῆναι αὐτούς from a purpose-oriented infinitival expression into an imperfective statement of ongoing salvation. “ताकि वे बचाए जाएँ” preserves the intended goal and passive voice.
