review_pass:
  verdict: revise
  source_fidelity: The draft correctly links οὗ to the previously mentioned lawless one and appropriately renders παρουσία as “आगमन.” However, “हर प्रकार की सामर्थ्य” is not idiomatic Hindi, and the wording has an unnecessary repeated “होगा.” The revision retains the comprehensive force of πάσῃ and the deliberately noncommittal force of ψεύδους.
  naturalness: “शैतान की क्रियाशीलता के अनुसार” and a single final finite verb produce clear, modern, dignified Hindi. “शक्ति” is more natural than “सामर्थ्य” after “हर प्रकार की.”
  terminology: “शैतान,” “आगमन,” “शक्ति,” and “चिन्ह” are suitable established biblical terms. “झूठ से जुड़े आश्चर्यकर्म” avoids deciding that the phenomena are merely fraudulent while retaining their association with falsehood.
  issues:
  - severity: medium
    issue: The expression “हर प्रकार की सामर्थ्य” is awkward in modern standard Hindi.
    rationale: Although it seeks to represent πάσῃ δυνάμει, Hindi more naturally says “हर प्रकार की शक्ति.”
  - severity: low
    issue: The sentence repeats “होगा” before and after the accompanying phrase.
    rationale: Greek has one main verbal construction; placing one final “होगा” makes the Hindi more fluent without changing meaning.
  revised_text: उसका आगमन शैतान की क्रियाशीलता के अनुसार, हर प्रकार की शक्ति, चिन्हों और झूठ से जुड़े आश्चर्यकर्मों के साथ होगा।[a]
