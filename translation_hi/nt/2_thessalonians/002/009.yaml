translation:
  language: hi
  text: उसका आगमन शैतान की क्रियाशीलता के अनुसार, हर प्रकार की शक्ति, चिन्हों और झूठ से जुड़े आश्चर्यकर्मों के साथ होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हर प्रकार की शक्ति और चिन्हों और झूठ के आश्चर्यकर्मों के साथ।” “झूठ के” का संबंध चिन्हों और आश्चर्यकर्मों से, और संभवतः पूरी शृंखला से, समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἐστιν ἡ παρουσία
  choice: उसका आगमन ... होगा
  rationale: सम्बन्धवाचक सर्वनाम οὗ पिछले पद के ‘अधर्मी’ की ओर संकेत करता है। παρουσία का यहाँ अंतकालीन संदर्भ में स्वाभाविक अर्थ ‘आगमन’ है; ‘उपस्थिति’ सम्भव होते हुए भी कम उपयुक्त है।
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: शैतान की सक्रियता के अनुसार
  rationale: κατά क्रियाशीलता के अनुरूप ढंग या मानक को व्यक्त करता है, और ἐνέργεια प्रभावी गतिविधि अथवा कार्यशीलता बताता है। ‘सक्रियता’ आधुनिक हिंदी में अर्थ को स्पष्ट और संक्षिप्त रखती है।
- source_word: ἐν πάσῃ δυνάμει
  choice: हर प्रकार की सामर्थ्य ... के साथ
  rationale: ἐν यहाँ साथ होने अथवा साधन का भाव देता है। πάσῃ को ‘हर प्रकार की’ कहना व्यापकता को व्यक्त करता है, जबकि δυνάμει को ‘चमत्कार’ तक सीमित न करके ‘सामर्थ्य’ रखा गया है।
- source_word: σημείοις καὶ τέρασιν
  choice: चिन्हों और ... अद्भुत कामों
  rationale: σημεῖον के लिए ‘चिन्ह’ मानक और अर्थपूर्ण है। τέρας विस्मय उत्पन्न करने वाली असाधारण घटना को दर्शाता है; साधारण पाठक के लिए ‘अद्भुत काम’ स्वाभाविक है।
- source_word: ψεύδους
  choice: झूठ से जुड़े
  rationale: सम्बन्धकारक ψεύδους इन प्रदर्शनों को झूठ/छल से संबद्ध बताता है, पर यह अनिवार्य रूप से तय नहीं करता कि वे केवल नकली करतब हैं। यह रूप मूल की व्यापकता और तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: शैतानी प्रदर्शनों की प्रकृति
  choice: सामर्थ्य, चिन्ह और अद्भुत काम झूठ से जुड़े हैं
  alternative: वे केवल नकली चमत्कार हैं; अथवा वे वास्तविक अलौकिक चमत्कार हैं
  rationale: यूनानी पाठ इन घटनाओं को शैतान की सक्रियता और ψεῦδος से जोड़ता है, लेकिन उनकी वास्तविकता की तत्त्वमीमांसक प्रकृति स्पष्ट नहीं करता। इसलिए अनुवाद किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण लेकिन सामान्य पाठकों के लिए सुबोध। ‘आगमन’, ‘सक्रियता’, ‘सामर्थ्य’ और ‘चिन्ह’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं, जबकि ψεύδους की वास्तविक अस्पष्टता फुटनोट सहित सुरक्षित है।
