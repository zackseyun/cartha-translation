base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: hi
  text: इसी के लिए उसने तुम्हें हमारे सुसमाचार के द्वारा बुलाया, ताकि तुम हमारे प्रभु यीशु मसीह की महिमा प्राप्त करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “महिमा प्राप्त करो” का अनुवाद “महिमा को अपने अधिकार में लो” या “महिमा में सहभागी हो” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: इसी के लिए
  rationale: यह पद 13 में बताई गई उद्धार और पवित्रीकरण की बात की ओर संकेत करता है। यह अनुवाद उद्देश्य अथवा लक्ष्य का भाव रखता है, पर उसके पूर्ववर्ती संदर्भ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐκάλεσεν
  choice: उसने ... बुलाया
  rationale: साधारण और व्यापक शब्दावली रखी गई है; न तो इसे केवल निमंत्रण बनाया गया है और न किसी विशिष्ट धर्मवैज्ञानिक प्रणाली के अनुसार अधिक स्पष्ट किया गया है।
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: हमारे सुसमाचार के द्वारा
  rationale: διά के साधनवाचक अर्थ को स्पष्ट रखता है। ‘हमारा सुसमाचार’ प्रेरितों द्वारा सुनाए गए सुसमाचार को दर्शाता है, किसी अलग सुसमाचार को नहीं।
- source_word: εἰς περιποίησιν
  choice: ताकि ... प्राप्त करो
  rationale: यूनानी संज्ञात्मक रचना को स्वाभाविक हिन्दी प्रयोजनवाचक उपवाक्य में व्यक्त किया गया है। περιποίησις में प्राप्ति अथवा अधिकार/भागीदारी का अर्थ हो सकता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: δόξης
  choice: महिमा
  rationale: यह प्रभु यीशु मसीह से संबंधित अंतकालीन महिमा को व्यक्त करता है; ‘महिमा’ स्थापित और गरिमापूर्ण हिन्दी शब्द है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: κύριος के उपाधिगत और धर्मवैज्ञानिक महत्व को स्थापित हिन्दी रूप ‘प्रभु’ से सुरक्षित रखा गया है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: हिन्दी में ‘मसीह’ Χριστός का अर्थपूर्ण और परंपरागत रूप है तथा यहाँ उपाधि के भाव को बनाए रखता है।
theological_decisions:
- issue: पौलुस के उद्धार-विचार में परमेश्वर के बुलावे का स्वरूप
  choice: ‘उसने ... बुलाया’
  alternative: ‘उसने प्रभावकारी रूप से बुलाया’ अथवा ‘उसने निमंत्रण दिया’
  rationale: मूल पाठ बुलावे को सुसमाचार के द्वारा हुआ बताता है, पर उसकी कार्यविधि पर किसी संप्रदाय-विशेष का निष्कर्ष आरोपित नहीं करता।
- issue: περιποίησις और महिमा का संबंध
  choice: महिमा प्राप्त करना
  alternative: महिमा को अधिकार में लेना अथवा महिमा में सहभागी होना
  rationale: मुख्य पाठ में लक्ष्य और प्राप्ति का सीधा भाव रखा गया है, जबकि यूनानी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: आधुनिक मानक हिन्दी में ‘मसीह’ अर्थपूर्ण, प्रचलित और उपाधिगत रूप है; ‘ख्रीस्त’ ध्वन्यात्मक और अपेक्षाकृत परंपरा-विशिष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। यूनानी वाक्य की उद्देश्यगत गति को स्वाभाविक हिन्दी में ‘ताकि’ से व्यक्त किया गया है; वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
