  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘परन्तु’, ‘उद्धार’, ‘पवित्र आत्मा’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। लंबे यूनानी वाक्य को डैश द्वारा व्यवस्थित किया गया है, पर उसके तर्क-संबंध सुरक्षित हैं।
