source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: hi
  text: परन्तु, हे भाइयो[b], जो प्रभु के प्रिय हो, हमारा कर्तव्य है कि हम तुम्हारे लिए सदा परमेश्वर का धन्यवाद करें, क्योंकि परमेश्वर ने तुम्हें उद्धार के लिए पहली उपज के रूप में[a] चुना है—पवित्र आत्मा के द्वारा पवित्रीकरण और सत्य पर विश्वास के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में: “क्योंकि परमेश्वर ने तुम्हें आरम्भ से उद्धार के लिए चुना।” मुख्य पाठ “पहली उपज के रूप में” (ἀπαρχήν) वाले पाठ का अनुसरण करता है; दूसरा पाठ ἀπ’ ἀρχῆς (“आरम्भ से”) है।'
    reason: textual_variant
  - marker: b
    text: “भाइयो” यूनानी के पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; यह संबोधन पूरे विश्वासी समुदाय को, स्त्रियों सहित, समेट सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: परन्तु ... हमें
  rationale: δέ पिछले प्रसंग के नाश होने वालों से विरोध दिखाता है, और स्पष्ट Ἡμεῖς पर बल को हिंदी के ‘हमें’ में बनाए रखा गया है।
- source_word: ὀφείλομεν
  choice: हमें ... देना चाहिए
  rationale: यह नैतिक दायित्व और उचित कर्तव्य व्यक्त करता है, बिना कठोर बाध्यता का भाव बढ़ाए।
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: तुम्हारे लिए सदा परमेश्वर को धन्यवाद देना
  rationale: यह पौलुस की धन्यवाद-विषयक अभिव्यक्ति का स्वाभाविक और अर्थनिष्ठ हिंदी रूप है।
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: हे भाइयो, प्रभु के प्रिय लोगो
  rationale: ‘भाइयो’ यूनानी पुल्लिंग बहुवचन को प्रत्यक्ष रखता है; ‘प्रभु के प्रिय लोगो’ संबोधन की आत्मीयता और निष्क्रिय भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἵλατο
  choice: चुना
  rationale: αἱρέομαι के मध्यम रूप का यहाँ सीधा अर्थ चुनना है; इससे पाठ से आगे कोई विशिष्ट चुनाव-सिद्धान्त नहीं जोड़ा जाता।
- source_word: ἀπαρχὴν
  choice: पहले फल के रूप में
  rationale: SBLGNT के मुद्रित पाठ ἀπαρχήν का रूपकात्मक अर्थ ‘पहला फल/पहली उपज’ है; प्रसिद्ध पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: εἰς लक्ष्य या परिणाम व्यक्त करता है; यह संक्षिप्त और स्पष्ट हिंदी है।
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: पवित्र आत्मा के द्वारा पवित्र किए जाने ... के माध्यम से
  rationale: ἐν यहाँ साधन का भाव दे सकता है; ἁγιασμός को प्रक्रिया के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है और संदर्भ में πνεῦμα को पवित्र आत्मा माना गया है।
- source_word: πίστει ἀληθείας
  choice: सत्य पर विश्वास करने
  rationale: ἀληθείας को πίστις का विषय मानते हुए ‘सत्य पर विश्वास’ किया गया है; यह आधुनिक हिंदी में स्पष्ट है।
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματος में πνεύματος का आशय
  choice: पवित्र आत्मा
  alternative: मनुष्य की आत्मा
  rationale: पौलुस के इस उद्धार-संबंधी संदर्भ में पवित्रीकरण का कर्ता पवित्र आत्मा होना अधिक स्वाभाविक है, यद्यपि यूनानी रूप अपने आप में ‘आत्मा’ भी पढ़ा जा सकता है।
- issue: εἵλατο ὑμᾶς ὁ θεὸς का धर्मवैज्ञानिक विस्तार
  choice: परमेश्वर ने तुम्हें ... चुना
  alternative: परमेश्वर ने तुम्हें नियुक्त किया / अपने लिए ग्रहण किया
  rationale: अनुवाद दिव्य चुनाव के कथन को बनाए रखता है, पर चुनाव की रीति या आधार के बारे में किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: ἀπαρχήν बनाम ἀπ’ ἀρχῆς
  choice: पहले फल के रूप में
  alternative: आरम्भ से
  rationale: मुख्य पाठ दिए गए SBLGNT के ἀπαρχήν का अनुसरण करता है; महत्वपूर्ण पांडुलिपीय पाठांतर पारदर्शिता हेतु पादटिप्पणी में दिया गया है।
