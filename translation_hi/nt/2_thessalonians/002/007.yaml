reference: 2 Thessalonians 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: hi
  text: क्योंकि अधर्म का रहस्य पहले ही से कार्य कर रहा है; केवल इतना है कि जो अभी रोक रहा है[a], वह तब तक रोकता रहेगा, जब तक वह रास्ते से हट न जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो अभी थामे हुए है”; यूनानी पाठ यह नहीं बताता कि रोकने वाला कौन है।
    reason: alternative_reading
  - marker: b
    text: या “जब तक वह बीच से हट न जाए” या “जब तक उसे हटा न दिया जाए।” यूनानी पाठ यह स्पष्ट नहीं करता कि यह कैसे होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: रहस्य
  rationale: यह पौलुस के उस प्रयोग को बनाए रखता है जिसमें कोई छिपी हुई वास्तविकता अब सक्रिय या प्रकट हो रही है; इसे केवल एक अनसुलझी पहेली नहीं बनाता।
- source_word: ἐνεργεῖται
  choice: सक्रिय है
  rationale: वर्तमान में जारी प्रभावी क्रिया को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: यह परमेश्वर की व्यवस्था और इच्छा के उल्लंघन का भाव रखता है तथा प्रसंग की धार्मिक-नैतिक गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μόνον
  choice: केवल
  rationale: पिछले कथन पर लगाई गई सीमा या शर्त को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: ὁ κατέχων
  choice: जो अभी रोक रहा है
  rationale: कृदन्तीय अभिव्यक्ति को बनाए रखता है और रोकने वाले की पहचान तय नहीं करता।
- source_word: ἄρτι
  choice: अभी
  rationale: रोकने की क्रिया के वर्तमान समय को सीधे व्यक्त करता है।
- source_word: ἕως ἐκ μέσου γένηται
  choice: जब तक वह रास्ते से हट न जाए
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है; परिणाम की अवस्था बताता है, पर यह तय नहीं करता कि वह स्वयं हटता है या कोई उसे हटाता है।
theological_decisions:
- issue: ὁ κατέχων (‘रोकने वाला’) की पहचान
  choice: इसे सामान्य रूप में ‘जो अभी रोक रहा है’ कहा गया है और उसकी पहचान नहीं बताई गई।
  alternative: इसे रोमी राज्य, मानव शासन, पवित्र आत्मा, किसी स्वर्गदूत, पौलुस या प्रेरितीय प्रचार के रूप में पहचानना।
  rationale: इस पद का यूनानी पाठ रोकने वाले का उल्लेख करता है, पर उसकी पहचान नहीं बताता; अनुवाद को इस विवादित युगांतशास्त्रीय प्रश्न को तय नहीं करना चाहिए।
- issue: ἕως ἐκ μέσου γένηται में हटने की कर्तृता
  choice: ‘जब तक वह रास्ते से हट न जाए’ रखा गया है।
  alternative: ‘जब तक उसे हटा न दिया जाए’ या ‘जब तक कोई उसे रास्ते से हटा न दे।’
  rationale: यूनानी अभिव्यक्ति किसी स्पष्ट बाहरी कर्ता का उल्लेख नहीं करती। चुना हुआ रूप यह खुला रखता है कि हटना कैसे होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऐसा करता रहेगा’ यूनानी वाक्य में निहित रोकने की जारी क्रिया को हिन्दी में पूरा करता है। दोनों पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
