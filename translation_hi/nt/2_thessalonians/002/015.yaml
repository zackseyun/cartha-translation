id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: hi
  text: इसलिए, भाइयो[a], दृढ़ बने रहो और उन परम्पराओं को मज़बूती से थामे रहो जिनकी शिक्षा तुम्हें दी गई थी—चाहे बोले हुए वचन के द्वारा, चाहे हमारी पत्री के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, पर सम्भवतः पूरी मण्डली को सम्बोधित किया गया है।
    reason: शाब्दिक रूप और सम्भावित समावेशी सन्दर्भ—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले कथन से निकलने वाले परिणाम को दर्शाता है। आधुनिक हिन्दी में ‘इसलिए’ इस संक्रमण को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी सम्बोधन का शाब्दिक रूप पुल्लिंग बहुवचन है। मुख्य पाठ में उसी रूप को रखा गया है, जबकि सम्भावित रूप से पूरी मण्डली के समावेश को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: στήκετε
  choice: दृढ़ बने रहो
  rationale: वर्तमानकालिक आज्ञार्थ निरन्तर स्थिरता और अटल बने रहने का भाव देता है। ‘दृढ़ बने रहो’ आधुनिक हिन्दी में यह भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κρατεῖτε
  choice: मज़बूती से थामे रहो
  rationale: क्रिया किसी बात को दृढ़ता से पकड़े रहने और उसका पालन बनाए रखने का अर्थ देती है। यह अनुवाद आज्ञा की तीव्रता को सुरक्षित रखता है।
- source_word: παραδόσεις
  choice: परम्पराओं
  rationale: यह संज्ञा उन बातों को दर्शाती है जो सौंप दी गई या आगे पहुँचाई गई हैं। ‘परम्पराओं’ से इस सौंपे जाने का भाव बना रहता है और मौखिक तथा लिखित, दोनों माध्यमों का संदर्भ सुरक्षित रहता है।
- source_word: ἐδιδάχθητε
  choice: जिनकी शिक्षा तुम्हें दी गई थी
  rationale: कर्मवाच्य रूप थिस्सलुनीकियों को शिक्षा पाने वालों के रूप में प्रस्तुत करता है। हिन्दी में यह वाक्यांश स्पष्ट और स्वाभाविक है।
- source_word: διὰ λόγου
  choice: बोले हुए वचन के द्वारा
  rationale: पत्री से विरोध के कारण λόγος यहाँ मौखिक संचार को सूचित करता है। ‘बोले हुए वचन’ उस विरोध को स्पष्ट करता है, बिना विषय-वस्तु को केवल सामान्य ‘शिक्षा’ में बदल दिए।
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: हमारी पत्री के द्वारा
  rationale: यह लिखित प्रेरितीय संचार को मौखिक वचन के साथ रखता है। ‘हमारी पत्री’ ἡμῶν के स्वामित्व-सूचक अर्थ को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: παράδοσις का अनुवाद, जिसका प्रयोग प्रेरितीय परम्परा पर होने वाली बाद की धर्मवैज्ञानिक बहसों में किया जाता है
  choice: परम्पराओं
  alternative: शिक्षाओं; निर्देशों
  rationale: यूनानी शब्द सौंपी या आगे पहुँचाई गई बातों को स्पष्ट रूप से सूचित करता है और इस पद में मौखिक तथा लिखित, दोनों माध्यमों को समेटता है। ‘परम्पराओं’ मूल शब्द के अर्थ को सुरक्षित रखता है, पर बाद की किसी साम्प्रदायिक धारणा के क्षेत्र या अधिकार को पद में नहीं जोड़ता।
- issue: सम्भवतः मिश्रित मण्डली के लिए ἀδελφοί का सम्बोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग बहुवचन रूप को रखा गया है। सम्भवतः पूरी मण्डली अभिप्रेत होने की बात पादटिप्पणी में दी गई है, जिससे स्रोत-रूप और सन्दर्भगत समावेशिता दोनों दिखाई देती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मण्डलीय पाठ के अनुकूल रूप। ‘परम्पराओं’ जैसे स्रोत-सन्निकट शब्द को रखा गया है, जबकि ‘दृढ़ बने रहो’ और ‘मज़बूती से थामे रहो’ आज के सामान्य पाठक के लिए स्वाभाविक हैं।
