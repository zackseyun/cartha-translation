id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: hi
  text: भाइयो[a], हमारे प्रभु यीशु मसीह[b] के आगमन और उनके पास हमारे एकत्र होने के विषय में हम तुमसे अनुरोध करते हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ पौलुस का सम्बोधन है; इस प्रसंग में सम्भवतः पूरी विश्वासी मण्डली—पुरुष और स्त्रियाँ—अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है; यूनानी शब्द Χριστός इसी उपाधि को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: हम तुमसे अनुरोध करते हैं
  rationale: यह क्रिया यहाँ आदेश नहीं, बल्कि आगे कही जाने वाली बात के लिए एक नम्र प्रेरितिक निवेदन प्रस्तुत करती है। ‘अनुरोध करते हैं’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया की अपेक्षाकृत कोमल शक्ति बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: δέ यहाँ मुख्यतः विषय-परिवर्तन का संकेत देता है। हिन्दी में पद की वाक्य-रचना स्वयं इस परिवर्तन को स्वाभाविक रूप से व्यक्त करती है; ‘अब’ जोड़ने से अनचाहा कालगत अर्थ निकल सकता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन का व्याकरणिक रूप पुल्लिंग है, इसलिए स्रोत-रूप को रखा गया है। पौलुस के प्रयोग में इससे सम्भवतः पूरी विश्वासी मण्डली अभिप्रेत है; यह बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: ὑπὲρ
  choice: के विषय में
  rationale: यहाँ ὑπέρ उस विषय का परिचय देता है जिसके सम्बन्ध में अनुरोध किया जा रहा है; ‘के विषय में’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: παρουσίας
  choice: आगमन
  rationale: यद्यपि παρουσία का अर्थ ‘उपस्थिति’ भी हो सकता है, यीशु से सम्बन्धित इस भावी-अन्तकालीन सन्दर्भ में ‘आगमन’ उसका उपयुक्त और प्रचलित अर्थ है।
- source_word: κυρίου
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος की अधिकारसूचक और धर्मवैज्ञानिक शक्ति को बनाए रखने वाला स्थापित हिन्दी रूप है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός यहाँ यीशु की उपाधि है। हिन्दी का स्थापित पद ‘मसीह’ उसके ‘अभिषिक्त जन’ के अर्थ को संकेतित करता है और केवल नाम की तरह लिप्यन्तरण करने से बचता है।
- source_word: ἐπισυναγωγῆς
  choice: हमारे एकत्र होने
  rationale: संज्ञा विश्वासियों के एक साथ प्रभु के पास एकत्र होने को व्यक्त करती है। ‘एकत्र होने’ स्वाभाविक हिन्दी में उसका सामूहिक भाव बनाए रखता है, बिना किसी संस्थागत अर्थ को जोड़ने के।
- source_word: ἐπ’ αὐτόν
  choice: उनके पास
  rationale: ἐπί और कर्मकारक यहाँ मसीह की ओर गमन अथवा अभिमुखता दर्शाते हैं। ‘उनके पास’ इस दिशा को स्पष्ट करता है और यीशु के लिए आदरसूचक सर्वनाम का प्रयोग करता है।
theological_decisions:
- issue: Χριστοῦ को मसीही उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस प्रसंग में Χριστός की उपाधिगत शक्ति सक्रिय है। ‘मसीह’ हिन्दी में अर्थपूर्ण और स्थापित रूप है; पादटिप्पणी उसके मूल अर्थ को बताती है।
- issue: ἀδελφοί के सम्बोधन का दायरा
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के पुल्लिंग सम्बोधन को सुरक्षित रखता है, जबकि पादटिप्पणी बताती है कि प्रसंग में पूरी विश्वासी मण्डली सम्भवतः अभिप्रेत है।
- issue: आगमन और एकत्र होने का परस्पर सम्बन्ध
  choice: दोनों को ‘और’ से समानान्तर रूप में जोड़ा गया
  alternative: उनके आगमन पर हमारा एकत्र होना
  rationale: यूनानी पाठ दोनों बातों को καί से जोड़ता है, पर उनके ठीक कालगत या तार्किक सम्बन्ध को परिभाषित नहीं करता। अनुवाद किसी विशेष अन्तकाल-विषयक योजना को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के अन्त में अल्पविराम इसलिए है कि यूनानी में यह अनुरोध अगले पद में पूरा होता है। यीशु के लिए ‘उनके’ आदरसूचक सर्वनाम चुना गया है।
