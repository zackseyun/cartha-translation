id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: hi
  text: कि तुम शीघ्र ही अपनी स्थिर समझ से न डगमगाओ और न घबराओ, चाहे किसी आत्मा[a] के द्वारा, किसी संदेश के द्वारा, या ऐसी चिट्ठी के द्वारा जो मानो हमारी ओर से हो, इस दावे से कि प्रभु का दिन आ चुका है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किसी आत्मा’ का अर्थ ‘किसी आत्मिक वचन’ या ‘भविष्यद्वाणी के प्रकाशन’ से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उपस्थित है।’ यूनानी पूर्णकाल का अर्थ यह दावा भी हो सकता है कि प्रभु का दिन पहले ही आ पहुँचा है और अब उपस्थित है।
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: शीघ्र ही
  rationale: क्रियाविशेषण चेतावनी देता है कि वे तुरंत या आसानी से विचलित न हों; ‘शीघ्र ही’ समयगत बल को स्वाभाविक हिन्दी में रखता है।
- source_word: σαλευθῆναι
  choice: डगमगाओ
  rationale: मूल के ‘हिलाए जाने’ के रूपक को बनाए रखते हुए मानसिक अस्थिरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπὸ τοῦ νοὸς
  choice: अपनी स्थिर समझ से
  rationale: शाब्दिक ‘मन से’ हिन्दी में अस्पष्ट हो सकता है; प्रसंग में आशय स्थिर सोच या विवेक से विचलित होने का है। ‘स्थिर’ अंतर्निहित भाव को स्पष्ट करता है।
- source_word: θροεῖσθαι
  choice: घबराओ
  rationale: यह शब्द व्याकुल या भयभीत हो जाने का भाव देता है; ‘घबराओ’ आधुनिक और सहज हिन्दी है।
- source_word: πνεύματος
  choice: किसी आत्मा
  rationale: अनिश्चित और बिना उपपद वाले πνεύματος का औपचारिक निकट रूप रखा गया है; सम्भावित भविष्यद्वाणी या आत्मिक प्रकाशन का अर्थ पादटिप्पणी में दिया गया है।
- source_word: λόγου
  choice: वचन
  rationale: यह चिट्ठी के विपरीत किसी मौखिक कथन या संदेश को सूचित कर सकता है। ‘वचन’ स्रोत की व्यापकता और धार्मिक प्रसंग दोनों को बनाए रखता है।
- source_word: ἐπιστολῆς
  choice: चिट्ठी
  rationale: लिखित पत्राचार के लिए साधारण आधुनिक हिन्दी का स्वाभाविक शब्द।
- source_word: ὡς δι’ ἡμῶν
  choice: जो मानो हमारी ओर से हो
  rationale: यह उस दावे को व्यक्त करता है कि कथित चिट्ठी पौलुस और उसके साथियों की ओर से आई थी, बिना उसे तथ्य मान लिए।
- source_word: ἐνέστηκεν
  choice: आ चुका है
  rationale: पूर्णकालीन क्रिया आगमन के फलस्वरूप वर्तमान उपस्थिति का बोध देती है। ‘आ चुका है’ दावे के ‘पहले ही घटित/उपस्थित’ होने के बल को स्पष्ट करता है; ‘उपस्थित है’ पादटिप्पणी में सुरक्षित है।
- source_word: ἡμέρα τοῦ κυρίου
  choice: प्रभु का दिन
  rationale: यह स्थापित युगान्त-संबंधी अभिव्यक्ति है; साप्ताहिक आराधना-दिवस का संकेत नहीं।
theological_decisions:
- issue: ἐνέστηκεν में प्रभु के दिन के विषय में किए गए दावे का अर्थ
  choice: आ चुका है
  alternative: उपस्थित है / पहले ही आ पहुँचा है
  rationale: यूनानी पूर्णकाल आगमन और उससे बनी वर्तमान स्थिति दोनों को समेट सकता है। मुख्य पाठ आगमन का भाव देता है, जबकि वर्तमान उपस्थिति की वैध सूक्ष्मता पादटिप्पणी में रखी गई है।
- issue: πνεύματος का आशय
  choice: किसी आत्मा
  alternative: किसी आत्मिक वचन / भविष्यद्वाणी के प्रकाशन
  rationale: मुख्य पाठ मूल की अनिश्चितता और शाब्दिक रूप को बनाए रखता है। प्रसंग में यह किसी दावे वाले आत्मिक या भविष्यद्वाणी-संबंधी संदेश का उल्लेख हो सकता है; इसे पादटिप्पणी में स्पष्ट किया गया है, पवित्र आत्मा के रूप में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी वाक्य के निषेध और तीन कथित माध्यमों की समानांतर संरचना को रखा गया है। पादटिप्पणी-चिह्न सम्बन्धित पदों के तुरंत बाद लगाए गए हैं।
