  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मंडली को संबोधन बहुवचन ‘तुम’ से व्यक्त है। ‘बुलाहट’, ‘विश्वास’ और ‘सामर्थ्य’ परिचित बाइबिलीय शब्द हैं; वाक्य-रचना को हिन्दी में स्वाभाविक बनाने के साथ मूल की समानांतर प्रार्थना-विनती और अर्थगत अस्पष्टताएँ सुरक्षित रखी गई हैं।
