  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: hi
  text: इसी उद्देश्य से हम भी तुम्हारे लिए सदा प्रार्थना करते हैं कि हमारा परमेश्वर तुम्हें बुलाहट के योग्य समझे[a] और भलाई के हर संकल्प[b] और विश्वास के काम[c] को सामर्थ्य के साथ पूरा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें बुलाहट के योग्य बनाए।” यूनानी क्रिया का अर्थ “योग्य समझना” या “योग्य बनाना” दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “भलाई की हर अभिलाषा” अथवा “भलाई के लिए हर संकल्प।”
    reason: lexical_alternative
  - marker: c
    text: “विश्वास के काम” का अर्थ “विश्वास से उत्पन्न काम” भी हो सकता है; यहाँ “विश्वास” के लिए “विश्वासयोग्यता” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: इसी उद्देश्य से हम भी
  rationale: यह पद पिछले विचार की ओर लौटते हुए उसके लक्ष्य को बताता है। ‘इसी उद्देश्य से’ εἰς ὃ की प्रयोजनात्मकता और ‘भी’ καὶ के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: तुम्हारे लिए सदा प्रार्थना करते हैं
  rationale: वर्तमान काल और πάντοτε नियमित, निरंतर प्रार्थना को दर्शाते हैं; ‘तुम्हारे लिए’ περὶ ὑμῶν का स्वाभाविक हिन्दी रूप है।
- source_word: ἀξιώσῃ
  choice: योग्य समझे
  rationale: यह क्रिया ‘योग्य माने/समझे’ अथवा ‘योग्य बनाए’ दोनों अर्थ दे सकती है। मुख्य पाठ में मूल्यांकनात्मक अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τῆς κλήσεως
  choice: बुलाहट के
  rationale: यूनानी में कोई स्पष्ट संबंधवाचक सर्वनाम नहीं है; इसलिए ‘उसकी’ या ‘तुम्हारी’ जोड़े बिना निश्चित ‘बुलाहट’ रखा गया है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हमारा परमेश्वर
  rationale: मूल पाठ का स्पष्ट संबंधवाचक भाव ज्यों का त्यों रखा गया है।
- source_word: πληρώσῃ
  choice: पूरा करे
  rationale: यह दोनों कर्मों—संकल्प और काम—के साथ सहज बैठता है तथा पूर्णतः सिद्ध करने का भाव देता है।
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: भलाई के हर संकल्प
  rationale: εὐδοκία यहाँ इच्छा, उद्देश्य या संकल्प का भाव दे सकता है और ἀγαθωσύνης उसे भलाई से संबंधित करता है। यह रूप अर्थ को स्पष्ट रखते हुए केवल भावनात्मक प्रसन्नता का संकेत नहीं देता।
- source_word: ἔργον πίστεως
  choice: विश्वास के हर काम
  rationale: ‘विश्वास का/के काम’ मूल संबंधकारक की संक्षिप्तता और खुलापन बनाए रखता है; πᾶσαν का वितरणात्मक प्रभाव हिन्दी में दूसरे समन्वित पद पर भी ‘हर’ रखकर स्पष्ट किया गया है।
- source_word: ἐν δυνάμει
  choice: सामर्थ्य के साथ
  rationale: यह परमेश्वर द्वारा संकल्प और काम को प्रभावी ढंग से पूरा करने के साधन या रीति को व्यक्त करता है, बिना अस्पष्ट रूप से किसी अन्य पद से बाँधे।
theological_decisions:
- issue: ἀξιώσῃ का अर्थ और बुलाहट के संबंध में परमेश्वर की क्रिया
  choice: तुम्हें बुलाहट के योग्य समझे
  alternative: तुम्हें बुलाहट के योग्य बनाए
  rationale: मुख्य पाठ मूल्यांकनात्मक अर्थ रखता है, पर यूनानी क्रिया रूपांतरणकारी अर्थ भी दे सकती है। पादटिप्पणी दोनों के बीच वास्तविक अर्थगत और धर्मवैज्ञानिक तनाव बनाए रखती है।
- issue: ἔργον πίστεως में πίστεως का संबंध
  choice: विश्वास के हर काम
  alternative: विश्वास से उत्पन्न हर काम; विश्वासयोग्यता का हर काम
  rationale: मूल का संबंधकारक यह खुला छोड़ता है कि काम विश्वास से उत्पन्न है या विश्वास से विशेषित है। मुख्य पाठ इसे संकुचित नहीं करता और विकल्प पादटिप्पणी में दिए गए हैं।
- issue: εὐδοκίαν ἀγαθωσύνης की व्याख्या
  choice: भलाई के हर संकल्प
  alternative: भलाई की हर अभिलाषा; भलाई के लिए हर संकल्प
  rationale: वाक्यांश उद्देश्य, इच्छा या भलाई से संबंधित संकल्प सूचित कर सकता है। मुख्य पाठ सुबोध अर्थ चुनता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
