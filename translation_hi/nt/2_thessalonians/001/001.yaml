source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: hi
  text: 'पौलुस, सिलवानुस और तीमुथियुस की ओर से, थिस्सलुनीकियों की कलीसिया के नाम, जो हमारे पिता परमेश्वर और प्रभु यीशु मसीह[a] में है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त।” यूनानी उपाधि Χριστός का अनुवाद “मसीह” किया जा सकता है; अधिक पारंपरिक रूप में इसे “ख्रीस्त” लिप्यंतरित किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल परंपरा में प्रचलित और पहचाना हुआ लिप्यंतरण।
- source_word: Σιλουανὸς
  choice: सिलवानुस
  rationale: मूल पाठ में आए पूरे नाम Σιλουανός का सीधा लिप्यंतरण रखा गया है; इसे प्रेरितों के काम में प्रचलित संक्षिप्त रूप 'सीलास' से समरूप नहीं किया गया।
- source_word: Τιμόθεος
  choice: तीमुथियुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: पौलुस के पत्रों में यह विश्वासियों के संगठित समुदाय को सूचित करता है; 'कलीसिया' आधुनिक हिन्दी मसीही प्रयोग में स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: Θεσσαλονικέων
  choice: थिस्सलुनीकियों की
  rationale: संबंधकारक बहुवचन नगर के बजाय उसके लोगों को सूचित करता है; इसलिए जनसमुदाय-सूचक रूप रखा गया है।
- source_word: ἐν
  choice: में
  rationale: मूल पूर्वसर्ग को बिना विस्तार से व्याख्यायित किए रखा गया है, जिससे क्षेत्र, संबंध अथवा एकता का संक्षिप्त धर्मवैज्ञानिक भाव खुला रहता है।
- source_word: θεῷ πατρὶ ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: ἡμῶν के स्पष्ट संबंधबोधक अर्थ को बनाए रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: यीशु की उपाधि के रूप में κύριος का मानक, गरिमापूर्ण हिन्दी अनुवाद।
- source_word: Χριστῷ
  choice: मसीह
  rationale: Χριστός की उपाधिगत शक्ति को व्यक्त करने वाला हिन्दी का स्थापित अनुवाद; पाठक के लिए पारंपरिक विकल्प 'ख्रीस्त' पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: Ἰησοῦ Χριστῷ में Χριστός का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: '''मसीह'' अभिषिक्त जन की उपाधि को हिन्दी में अर्थपूर्ण और स्वाभाविक रूप से व्यक्त करता है; पारंपरिक लिप्यंतरित रूप को वैकल्पिक पाठ के रूप में सुरक्षित रखा गया है।'
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ द्वारा व्यक्त संबंध
  choice: हमारे पिता परमेश्वर और प्रभु यीशु मसीह में
  alternative: हमारे पिता परमेश्वर और प्रभु यीशु मसीह से संबंध रखने वाली
  rationale: '''में'' मूल की संक्षिप्त और बहुअर्थी अभिव्यक्ति को बनाए रखता है तथा संबंध, आधार या एकता में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी में प्रेषकों के बाद सीधे संबोधन आता है; हिन्दी पत्र-शैली में इसे स्वाभाविक बनाने के लिए 'की ओर से' और 'के नाम' जोड़े गए हैं। पद के अंत का द्विबिंदु अगले पद में आने वाले अभिवादन की ओर संकेत करता है।
