  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: hi
  text: यह परमेश्वर के धर्मी न्याय का प्रमाण[a] है, ताकि तुम परमेश्वर के राज्य के योग्य समझे जाओ[b], जिसके लिए तुम दुःख भी सह रहे हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबूत’ अथवा ‘संकेत’।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि तुम्हें परमेश्वर के राज्य के योग्य समझा जाए’ अथवा ‘जिसके परिणामस्वरूप तुम परमेश्वर के राज्य के योग्य समझे जाओ।’ यूनानी रचना प्रयोजन या परिणाम, दोनों का भाव दे सकती है।
    reason: alternative_reading
  - marker: c
    text: या ‘जिसकी खातिर’ अथवा ‘जिसके पक्ष में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: प्रमाण
  rationale: यह शब्द ऐसी बात को दर्शाता है जो किसी वास्तविकता की ओर संकेत करती या उसे प्रमाणित करती है। हिंदी में ‘प्रमाण’ स्वाभाविक है; पादटिप्पणी में कम निर्णायक विकल्प भी दिए गए हैं। यूनानी वाक्यांश में क्रिया नहीं है, इसलिए पिछले पद से संबंध स्पष्ट करने हेतु ‘यह ... है’ जोड़ा गया है।
- source_word: δικαίας κρίσεως
  choice: धार्मिक न्याय
  rationale: यह विशेषण और संज्ञा दोनों को सीधे व्यक्त करता है तथा परमेश्वर के न्याय की नैतिक धार्मिकता को बनाए रखता है।
- source_word: εἰς τὸ καταξιωθῆναι
  choice: ताकि तुम ... के योग्य गिने जाओ
  rationale: निष्क्रिय क्रिया का अर्थ योग्य बनाया जाना नहीं, बल्कि योग्य माना या गिना जाना है। εἰς τὸ के साथ infinitive प्रयोजन अथवा परिणाम दोनों व्यक्त कर सकता है; मुख्य पाठ में सहज प्रयोजनात्मक रूप रखा गया और अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: यह संबंधकारक पदबंध का पारदर्शी और हिंदी बाइबलीय प्रयोग में परिचित अनुवाद है।
- source_word: ὑπὲρ ἧς
  choice: जिसके लिए
  rationale: ὑπέρ संबंधकारक के साथ ‘के लिए’, ‘की खातिर’ या ‘की ओर से’ का भाव दे सकता है। ‘जिसके लिए’ संक्षिप्त और स्वाभाविक रहते हुए संबंध को खुला रखता है।
- source_word: καὶ πάσχετε
  choice: तुम दुःख भी सह रहे हो
  rationale: वर्तमान काल चल रहे दुःख को व्यक्त करता है और ‘भी’ καί को सुरक्षित रखता है।
theological_decisions:
- issue: दुःख सहने और राज्य के योग्य गिने जाने का संबंध
  choice: उनका दुःख परमेश्वर के धार्मिक न्याय के संदर्भ में प्रमाण है और उनके योग्य गिने जाने के प्रयोजन या परिणाम से जुड़ा है; पाठ यह नहीं कहता कि दुःख राज्य में प्रवेश का मूल्य अर्जित करता है।
  alternative: दुःख सहना राज्य के योग्य होने को कमाता या उत्पन्न करता है।
  rationale: καταξιωθῆναι निष्क्रिय रूप में ‘योग्य गिना/माना जाना’ है, न कि अपने दुःख द्वारा अंतर्निहित योग्यता बना लेना। साथ ही εἰς τὸ की प्रयोजन-परिणाम संबंधी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य शैली। ‘धार्मिक न्याय’ परिचित बाइबलीय पदावली को बनाए रखता है; वाक्य को अनावश्यक धर्मसैद्धांतिक व्याख्या से नहीं भरा गया है।
