reference: 2 Thessalonians 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: hi
  text: ऐसे लोग अनन्त विनाश का दण्ड भुगतेंगे[a]—प्रभु की उपस्थिति से और उसके सामर्थ्य की महिमा से दूर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “ऐसे लोग उस अनन्त विनाश का दण्ड भुगतेंगे जो प्रभु की उपस्थिति और उसके सामर्थ्य की महिमा से आता है।” यूनानी पूर्वसर्ग का अर्थ अलगाव (“से दूर”) या स्रोत/उद्गम (“से आने वाला”)—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: ऐसे लोग
  rationale: यह पिछले पद में बताए गए लोगों की ओर संकेत करता है और ὅστις के हल्के गुणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δίκην τίσουσιν
  choice: दण्ड पाएँगे
  rationale: यह यूनानी न्यायिक पदबंध दण्ड भोगने या चुकाने का भाव देता है; ‘दण्ड पाएँगे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὄλεθρον αἰώνιον
  choice: अनन्त विनाश
  rationale: यह पदबंध न्याय की स्थायी और अंतिम गंभीरता को बनाए रखता है, पर विनाश के ठीक स्वरूप के विषय में कोई अतिरिक्त साम्प्रदायिक निष्कर्ष नहीं जोड़ता।
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: प्रभु की उपस्थिति ... से दूर
  rationale: πρόσωπον यहाँ मुहावरेदार रूप से ‘उपस्थिति’ है और ἀπό को मुख्य पाठ में अलगाव या बहिष्कार के अर्थ में लिया गया है।
- source_word: ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: उसके सामर्थ्य की महिमा से दूर
  rationale: δόξα के लिए ‘महिमा’ और ἰσχύς के लिए ‘सामर्थ्य’ गरिमापूर्ण तथा सुबोध हिन्दी हैं; दूसरा ἀπό भी अलगाव के समानांतर अर्थ में व्यक्त हुआ है।
theological_decisions:
- issue: अन्तिम न्याय के प्रसंग में ἀπό का अर्थ
  choice: 'अलगाव/बहिष्कार: ‘प्रभु की उपस्थिति ... से दूर’'
  alternative: 'स्रोत/उद्गम: विनाश प्रभु की उपस्थिति और उसके सामर्थ्य की महिमा से आता है'
  rationale: ἀπό अलगाव अथवा स्रोत—दोनों अर्थ दे सकता है। प्रसंग में अलगाव वाला पाठ प्रबल और स्वाभाविक है, किंतु स्रोत वाला अर्थ भी व्याकरण की दृष्टि से सम्भव है; इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ‘अनन्त विनाश’ का सटीक सिद्धान्तगत तात्पर्य
  choice: मूल पदबंध को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: इसे केवल पूर्ण उन्मूलन या केवल अनन्त सचेत दण्ड के रूप में स्पष्ट करना
  rationale: यह वाक्य दण्ड को ‘अनन्त विनाश’ कहता है, पर अपने आप में उसके स्वरूप से जुड़ा व्यापक सिद्धान्तगत विवाद निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। कानूनी भाव के लिए ‘दण्ड पाएँगे’, तथा धार्मिक मुहावरे के लिए ‘प्रभु की उपस्थिति’ और ‘सामर्थ्य की महिमा’ चुने गए हैं।
