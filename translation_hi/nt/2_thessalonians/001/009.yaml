review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the referents, judicial future, ‘eternal destruction,’ and the two parallel ἀπό phrases. However, rendering the final phrases as a separate coordinated future predicate (‘और ... दूर रहेंगे’) changes their syntactic attachment: in Greek they qualify/relate to the penalty of destruction, rather than state an additional action that the people will perform.'
  naturalness: ‘दण्ड पाएँगे’ is understandable, but ‘दण्ड भुगतेंगे’ more naturally conveys the judicial idiom δίκην τίσουσιν. A dash permits the closely related ‘away from’ qualification to remain linked with the penalty without adding an unwarranted separate verb.
  terminology: ‘अनन्त विनाश,’ ‘प्रभु,’ ‘उपस्थिति,’ ‘सामर्थ्य,’ and ‘महिमा’ are appropriate, clear, and suitably elevated. The alternative source/origin sense of ἀπό should remain explicitly preserved in the footnote.
  issues:
  - severity: medium
    issue: The clause ‘और प्रभु की उपस्थिति तथा उसके सामर्थ्य की महिमा से दूर रहेंगे’ makes separation a separate coordinated result/action.
    rationale: καὶ ἀπὸ τῆς δόξης continues the prepositional qualification associated with ὄλεθρον αἰώνιον. It does not contain a second finite verb. The Hindi should avoid converting it into ‘and they will remain away.’
  - severity: low
    issue: ‘दण्ड पाएँगे’ is less idiomatic for incurring a judicial penalty.
    rationale: ‘दण्ड भुगतेंगे’ naturally represents the penal force of δίκην τίσουσιν without introducing a doctrinal nuance.
  revised_text: ऐसे लोग अनन्त विनाश का दण्ड भुगतेंगे[a]—प्रभु की उपस्थिति से और उसके सामर्थ्य की महिमा से दूर।
  revised_footnotes:
  - marker: a
    text: या सम्भवतः, “ऐसे लोग उस अनन्त विनाश का दण्ड भुगतेंगे जो प्रभु की उपस्थिति और उसके सामर्थ्य की महिमा से आता है।” यूनानी पूर्वसर्ग का अर्थ अलगाव (“से दूर”) या स्रोत/उद्गम (“से आने वाला”)—दोनों हो सकता है।
    reason: alternative_reading
  revision_rationale: The revision retains the primary separation reading while keeping both ἀπό phrases grammatically connected to ‘अनन्त विनाश का दण्ड.’ The footnote preserves the viable source/origin reading without deciding the disputed theological implication of the phrase.
