revisions:
- from: ऐसे लोग अनन्त विनाश का दण्ड पाएँगे[a] और प्रभु की उपस्थिति तथा उसके सामर्थ्य की महिमा से दूर रहेंगे।
  to: ऐसे लोग अनन्त विनाश का दण्ड भुगतेंगे[a]—प्रभु की उपस्थिति से और उसके सामर्थ्य की महिमा से दूर।
  rationale: The revision retains the primary separation reading while keeping both ἀπό phrases grammatically connected to ‘अनन्त विनाश का दण्ड.’ The footnote preserves the viable source/origin reading without deciding the disputed theological implication of the phrase.
