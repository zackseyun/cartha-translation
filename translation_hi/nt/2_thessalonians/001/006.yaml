  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: hi
  text: क्योंकि परमेश्वर की दृष्टि में यह न्यायसंगत है कि जो तुम्हें क्लेश देते हैं, उन्हें वह बदले में क्लेश दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वास्तव में परमेश्वर के यहाँ यह धर्मसंगत है कि जो तुम्हें क्लेश देते हैं, उन्हें वह बदले में क्लेश दे।”
    reason: εἴπερ की औपचारिक शर्तात्मक अभिव्यक्ति तथा δίκαιον और παρὰ θεῷ के निकटतर वैकल्पिक अनुवाद को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: εἴπερ
  choice: क्योंकि
  rationale: यहाँ εἴπερ ऐसी बात को आधार बनाता है जिसे पौलुस सत्य मानकर प्रस्तुत करता है; इसलिए संदेहपूर्ण शर्त के बजाय ‘क्योंकि’ प्रसंग के तर्क को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δίκαιον
  choice: न्यायसंगत
  rationale: यह शब्द परमेश्वर के प्रतिफल की नैतिक और न्यायिक उचितता बताता है; आधुनिक हिन्दी में ‘न्यायसंगत’ इस संदर्भ को स्पष्ट रखता है।
- source_word: παρὰ θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: यह वाक्यांश परमेश्वर के मूल्यांकन या मानदंड के अनुसार न्यायसंगत होने का भाव देता है; ‘परमेश्वर की दृष्टि में’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀνταποδοῦναι
  choice: बदले में ... दे
  rationale: यह चयन किसी किए हुए कार्य के अनुरूप प्रत्युत्तर देने का अर्थ व्यक्त करता है और प्रतिशोधी बोलचाल की कठोरता से बचता है।
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: जो तुम्हें क्लेश देते हैं
  rationale: यह अनुवाद सताने या दबाव डालकर दुःख पहुँचाने का अर्थ रखता है और उसी धातु से आए θλῖψιν के साथ शब्दगत संबंध बनाए रखता है।
- source_word: θλῖψιν
  choice: क्लेश
  rationale: ‘क्लेश’ गंभीर पीड़ा और संकट को संक्षेप में व्यक्त करता है तथा ‘क्लेश देते हैं’ के साथ मूल पाठ की पुनरुक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय प्रतिफल का स्वरूप और समय
  choice: पद सामान्य रूप से कहता है कि परमेश्वर क्लेश देने वालों को न्यायपूर्वक क्लेश देगा।
  alternative: इसे केवल अंतिम न्याय तक सीमित करना, या वर्तमान ऐतिहासिक दंड और अंतिम न्याय दोनों को स्पष्ट रूप से शामिल करना।
  rationale: इस उपवाक्य में प्रतिफल के समय या रीति को पूर्णतः निर्दिष्ट नहीं किया गया है; इसलिए अनुवाद किसी संकीर्ण सिद्धान्तगत निष्कर्ष को नहीं जोड़ता।
- issue: εἴπερ की तार्किक शक्ति
  choice: इसे प्रसंग में सत्य मानी गई आधारभूत बात के रूप में ‘क्योंकि’ से व्यक्त किया गया है।
  alternative: ‘यदि वास्तव में’ द्वारा इसकी औपचारिक शर्तात्मक बनावट को अधिक प्रत्यक्ष रखना।
  rationale: प्रसंग में यह संदिग्ध संभावना नहीं, बल्कि बलपूर्वक मानी गई बात है; फिर भी औपचारिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्लेश’ की पुनरावृत्ति मूल यूनानी के θλίβουσιν/θλῖψιν शब्द-संबंध को जानबूझकर सुरक्षित रखती है।
