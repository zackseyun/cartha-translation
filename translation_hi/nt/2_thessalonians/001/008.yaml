    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: धधकती आग में
  rationale: यह दत्तिवाचक पदबंध की प्रज्वलित आग की सजीव छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और पिछले पद में प्रभु के प्रकट होने से जुड़ता है।
- source_word: διδόντος ἐκδίκησιν
  choice: प्रतिशोध लेते हुए
  rationale: शाब्दिक रूप से ‘प्रतिशोध देना’ हिन्दी में अस्वाभाविक है; यह यूनानी मुहावरा न्यायिक प्रतिकार लागू करने का अर्थ देता है। ‘प्रतिशोध लेते हुए’ उसकी सक्रियता और तीव्रता बनाए रखता है।
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: उन लोगों से ... जो परमेश्वर को नहीं जानते
  rationale: οἶδα का पूर्णरूपी कृदन्त यहाँ वर्तमान अवस्था व्यक्त करता है; यह अनुवाद उसी अर्थ को सहज हिन्दी में रखता है।
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: जो ... सुसमाचार को नहीं मानते
  rationale: ὑπακούω में सुनकर मानने और आज्ञापालन का भाव है। सुसमाचार के साथ ‘नहीं मानते’ हिन्दी में स्वाभाविक है और जानबूझकर इनकार करने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: τῷ εὐαγγελίῳ
  choice: सुसमाचार
  rationale: यह पौलुस के लेखन में बार-बार आने वाले पारिभाषिक शब्द का प्रचलित, स्पष्ट और सटीक हिन्दी रूप है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: हमारे प्रभु यीशु के
  rationale: यह सम्बन्धवाचक संरचना, सामुदायिक ‘हमारे’ और κύριος की उपाधि—तीनों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय में ἐκδίκησις का स्वरूप
  choice: प्रतिशोध
  alternative: न्यायोचित दण्ड
  rationale: मूल शब्द न्यायिक प्रतिकार की तीव्रता रखता है। ‘प्रतिशोध’ उस गंभीरता को कम नहीं करता, जबकि प्रसंग स्पष्ट करता है कि यह मनुष्य का आवेगपूर्ण बदला नहीं, प्रभु द्वारा किया गया न्याय है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए आरम्भिक पदबंध और कृदन्तीय प्रवाह को बनाए रखा गया है।
