source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: hi
  text: इसलिए हम स्वयं परमेश्वर की कलीसियाओं में तुम्हारे विषय में गर्व करते हैं—उन सभी सतावों और क्लेशों के बीच तुम्हारे धीरज और विश्वास[a] के कारण, जिन्हें तुम सह रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठा”; यहाँ πίστις का अर्थ विश्वास अथवा दुःखों के बीच अटल निष्ठा हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन के परिणाम को व्यक्त करता है; हिन्दी में ‘इसलिए’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: αὐτοὺς ἡμᾶς
  choice: हम स्वयं
  rationale: बलसूचक सर्वनाम पौलुस और उसके साथियों पर विशेष जोर देता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे विषय में
  rationale: गर्व करने की क्रिया के साथ यह उन लोगों को सूचित करता है जिनके कारण या जिनके विषय में गर्व किया जाता है।
- source_word: ἐγκαυχᾶσθαι
  choice: गर्व करते हैं
  rationale: यह क्रिया प्रबल रूप से गर्व करने को व्यक्त करती है; यह हिन्दी में स्वाभाविक है और पौलुस की अलंकारिक तीव्रता को बनाए रखती है।
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: परमेश्वर की कलीसियाओं में
  rationale: बहुवचन सभाओं और परमेश्वर से उनके संबंध को औपचारिक रूप से सुरक्षित रखता है।
- source_word: ὑπὲρ
  choice: के कारण
  rationale: यहाँ यह गर्व के आधार या कारण को प्रस्तुत करता है।
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: दबाव के अधीन टिके रहने और सहनशील दृढ़ता का भाव संक्षिप्त, परिचित हिन्दी में व्यक्त होता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का सामान्य अर्थ ‘विश्वास’ है; दुःख सहने के संदर्भ में ‘विश्वासयोग्यता’ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: उन सभी सतावों और क्लेशों के बीच
  rationale: ‘के बीच’ परिस्थितिजन्य ἐν को स्वाभाविक हिन्दी में व्यक्त करता है और सताव तथा व्यापक क्लेश के बीच भेद बनाए रखता है।
- source_word: διωγμοῖς
  choice: सतावों
  rationale: यह विश्वास के कारण होने वाले विरोध और उत्पीड़न का प्रचलित बाइबिलीय हिन्दी रूप है।
- source_word: θλίψεσιν
  choice: क्लेशों
  rationale: दबाव, दुःख और विपत्ति का गंभीर किंतु समझने योग्य भाव देता है।
- source_word: αἷς ἀνέχεσθε
  choice: जिन्हें तुम सह रहे हो
  rationale: वर्तमान काल जारी अनुभव को दिखाता है; ‘सह रहे हो’ ongoing endurance को स्पष्ट करता है।
theological_decisions:
- issue: दुःख के संदर्भ में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: शब्द परमेश्वर पर विश्वास और परीक्षाओं में अटल निष्ठा—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और वास्तविक अर्थगत संभावना पादटिप्पणी में दी गई है।
