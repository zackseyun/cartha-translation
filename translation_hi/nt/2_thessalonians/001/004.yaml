  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘कलीसिया’, ‘सताव’ और ‘क्लेश’ जैसे स्थापित बाइबिलीय शब्दों को ऐसे वाक्य-विन्यास में रखा गया है जो स्वाभाविक हिन्दी लगे।
