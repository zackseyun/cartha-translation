  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: hi
  text: पिता परमेश्वर और प्रभु यीशु मसीह[a] की ओर से तुम्हें अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘अभिषिक्त जन’; यूनानी उपाधि Χριστός का अनुवाद ‘मसीह’ या ‘मसीहा’ किया जा सकता है।
    reason: Χριστός की उपाधिगत अर्थवत्ता और वैकल्पिक हिन्दी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में यह शब्द सामान्य शुभकामना होने के साथ परमेश्वर की कृपा का गहरा धार्मिक भाव भी रखता है; ‘अनुग्रह’ दोनों पहलुओं को बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: समुदाय को संबोधित बहुवचन सर्वनाम का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह यूनानी अर्थ के साथ यहूदी अभिवादन में निहित कुशलता और संपूर्ण भलाई की प्रतिध्वनि को भी बनाए रखता है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यहाँ पूर्वसर्ग आशीष के स्रोत को बताता है; हिन्दी अभिवादन में ‘की ओर से’ स्वाभाविक है।
- source_word: θεοῦ πατρὸς
  choice: परमेश्वर पिता
  rationale: मुद्रित यूनानी पाठ में ‘हमारे’ के लिए कोई स्पष्ट शब्द नहीं है। हिन्दी में ‘परमेश्वर पिता’ स्वाभाविक और बोधगम्य है तथा अनावश्यक सर्वनाम जोड़े बिना संबंधसूचक भाव बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: उपाधि का बल और नए नियम में इसका प्रचलित धार्मिक प्रयोग सुरक्षित रहता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός की उपाधिगत अर्थवत्ता को बनाए रखने वाला प्रचलित हिन्दी रूप है और यहाँ नाम के साथ स्वाभाविक लगता है।
theological_decisions:
- issue: πατρὸς के साथ ‘हमारे’ जोड़ना, जबकि SBLGNT के मुद्रित पाठ में ἡμῶν नहीं है
  choice: परमेश्वर पिता
  alternative: हमारे पिता परमेश्वर
  rationale: हिन्दी में स्पष्ट स्वामिवाचक सर्वनाम के बिना यह पदबंध स्वाभाविक है, इसलिए मूल पाठ में अनुपस्थित ‘हमारे’ को जोड़ना आवश्यक नहीं।
- issue: Χριστός को उपाधि या नाम-सदृश पद के रूप में व्यक्त करना
  choice: मसीह
  alternative: मसीहा / अभिषिक्त जन
  rationale: ‘मसीह’ हिन्दी बाइबलीय भाषा में स्थापित है और यीशु की उपाधि को किसी अतिरिक्त संप्रदायगत व्याख्या के बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामुदायिक संबोधन वाली हिन्दी। यूनानी वाक्य में व्यक्त क्रिया न होने पर भी हिन्दी आशीर्वचन को स्वाभाविक बनाने के लिए ‘मिले’ का प्रयोग किया गया है। ‘शान्ति’ की वर्तनी औपचारिक बाइबलीय शैली के अनुरूप रखी गई है।
