id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: hi
  text: हे भाइयो[a], हमें तुम्हारे लिए परमेश्वर को सदा धन्यवाद देना चाहिए, जैसा कि उचित है, क्योंकि तुम्हारा विश्वास[b] बहुत बढ़ता जा रहा है और तुममें से हर एक का प्रेम एक-दूसरे के प्रति बढ़ता जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे भाइयो और बहनो”; यूनानी में “भाइयो” है, जो यहाँ पूरे विश्वासी समुदाय को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारी विश्वासयोग्यता”; यूनानी शब्द का अर्थ “विश्वास,” “भरोसा” या “विश्वासयोग्यता” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: हमें ... धन्यवाद देना चाहिए
  rationale: कर्तव्य और नैतिक उपयुक्तता का भाव व्यक्त करता है, पर इसे कठोर अनिवार्यता नहीं बनाता।
- source_word: πάντοτε περὶ ὑμῶν
  choice: तुम्हारे लिए ... सदा
  rationale: धन्यवाद के प्रसंग में περί का स्वाभाविक हिन्दी रूप ‘के लिए’ है; πάντοτε का कालगत बल ‘सदा’ से बना रहता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन के पुल्लिंग बहुवचन रूप को मुख्य पाठ में सुरक्षित रखा गया है; पूरी विश्वासी मण्डली को समावेशी रूप से संबोधित किए जाने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: καθὼς ἄξιόν ἐστιν
  choice: जैसा कि उचित है
  rationale: यह नैतिक औचित्य का स्वाभाविक और वर्तमान हिन्दी प्रयोग है।
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: तुम्हारा विश्वास बहुत बढ़ता जा रहा है
  rationale: संयुक्त क्रिया के तीव्र वृद्धि-सूचक बल और वर्तमान में जारी प्रक्रिया, दोनों को स्पष्ट करता है।
- source_word: πλεονάζει ἡ ἀγάπη
  choice: प्रेम ... बढ़ता जा रहा है
  rationale: प्रेम की निरन्तर वृद्धि को सहज हिन्दी में व्यक्त करता है।
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: तुममें से हर एक का प्रेम एक-दूसरे के प्रति
  rationale: यूनानी के वितरणात्मक और पारस्परिक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस प्रसंग में विश्वासियों के बढ़ते विश्वास का अर्थ सबसे स्वाभाविक है, लेकिन यूनानी शब्द में विश्वासयोग्यता का अर्थ भी सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοί
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग को दर्शाता है, जबकि पादटिप्पणी बताती है कि संबोधन पूरे विश्वासी समुदाय को समावेशी रूप से लक्षित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘बहुत बढ़ता जा रहा है’ मूल की तीव्र वृद्धि को व्यक्त करता है। वाक्य-विन्यास को हिन्दी के स्वाभाविक संबोधन और प्रवाह के अनुसार रखा गया है।
