source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: hi
  text: ताकि हमारे प्रभु यीशु का नाम तुममें[a] महिमा पाए, और तुम उसमें, हमारे परमेश्वर और प्रभु यीशु मसीह के अनुग्रह के अनुसार।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे बीच।” यहाँ यूनानी पूर्वसर्ग के दोनों अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश को एक निकटता से जुड़ी अभिव्यक्ति—“हमारे परमेश्वर और प्रभु यीशु मसीह”—के रूप में समझा जा सकता है; या इसे “हमारे परमेश्वर” और “प्रभु यीशु मसीह” के दो अलग संदर्भों के रूप में समझा जा सकता है। अनुवाद यूनानी की संक्षिप्त रचना को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह पिछले पद की प्रार्थना से निकलने वाले उद्देश्य या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνδοξασθῇ
  choice: महिमा पाए
  rationale: यह निष्क्रिय भाव और महिमा-संबंधी धार्मिक अर्थ को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: मूल रूपक को ज्यों का त्यों रखा गया है; यहाँ नाम व्यक्ति की प्रकट पहचान और प्रतिष्ठा का भी द्योतक हो सकता है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: हमारे प्रभु यीशु का
  rationale: स्वाभाविक हिन्दी शब्दक्रम में संबंध और उपाधि दोनों सुरक्षित हैं।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: ἐν के मूल रूप को निकटता से रखता है; बहुवचन के कारण ‘तुम्हारे बीच’ का सामुदायिक अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: और तुम उनमें
  rationale: 'समानांतर रचना सुरक्षित है: प्रभु का नाम विश्वासियों में महिमा पाता है और विश्वासी उनमें। αὐτῷ का सबसे स्वाभाविक संदर्भ प्रभु यीशु हैं।'
- source_word: κατὰ τὴν χάριν
  choice: अनुग्रह के अनुसार
  rationale: κατά के मानक या अनुरूपता के भाव को बिना उसे केवल साधन के अर्थ में सीमित किए व्यक्त करता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: पौलुस के धार्मिक संदर्भ में χάρις का स्थापित, अर्थपूर्ण हिन्दी प्रतिशब्द है।
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: हमारे परमेश्वर और प्रभु यीशु मसीह के
  rationale: यूनानी की संक्षिप्त और निकटता से जुड़ी रचना को अतिरिक्त निर्धारक शब्द डालकर किसी एक व्याख्या में बाध्य किए बिना सुरक्षित रखता है। Χριστοῦ को हिन्दी की प्रचलित उपाधि ‘मसीह’ से व्यक्त किया गया है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में उसका स्थापित और व्यापक रूप से समझा जाने वाला रूप है।
- issue: αὐτῷ का संदर्भ
  choice: उनमें—अर्थात प्रभु यीशु में
  alternative: उसमें—अर्थात नाम में
  rationale: पुल्लिंग सर्वनाम और परस्पर महिमा पाने की समानांतर रचना प्रभु यीशु की ओर संकेत करती है, यद्यपि ‘नाम’ से व्याकरणिक संबंध औपचारिक रूप से संभव है।
- issue: अंतिम संबंधकारक वाक्यांश का आशय
  choice: यूनानी की निकटता से जुड़ी अभिव्यक्ति को बनाए रखना
  alternative: ‘हमारे परमेश्वर के और प्रभु यीशु मसीह के अनुग्रह के अनुसार’ कहकर दो अलग संदर्भ स्पष्ट करना
  rationale: एक ही लेख के अंतर्गत θεοῦ और κυρίου Ἰησοῦ Χριστοῦ का καί से जुड़ना निकट संबंध बनाता है, पर इसके व्याख्यात्मक आशय पर मतभेद है। हिन्दी पाठ अतिरिक्त शब्दों द्वारा प्रश्न का अंतिम निर्णय नहीं करता; पादटिप्पणी दोनों संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और शास्त्रीय धार्मिक शब्दावली से परिचित पाठकों के लिए स्पष्ट शैली। ‘महिमा पाए,’ ‘प्रभु,’ ‘मसीह’ और ‘अनुग्रह’ जैसे स्थापित शब्द रखे गए हैं; अनावश्यक संस्कृतनिष्ठ जटिलता से बचा गया है।
