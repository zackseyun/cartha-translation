source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: hi
  text: उस दिन[b], जब वह अपने पवित्र लोगों के बीच[a] महिमा पाने और उन सभी के बीच, जिन्होंने विश्वास किया है, विस्मय का विषय बनने आएगा, क्योंकि तुमने हमारी उस गवाही पर विश्वास किया जो तुम्हें दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पवित्र लोगों में।” यूनानी पूर्वसर्ग का अर्थ यह हो सकता है कि वह उनके बीच महिमा पाएगा या उसकी महिमा उनमें प्रकट होगी।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी शब्दक्रम के अधिक निकट: “जब वह अपने पवित्र लोगों के बीच महिमा पाने और उन सभी के बीच, जिन्होंने विश्वास किया है, विस्मय का विषय बनने आएगा, क्योंकि तुमने हमारी उस गवाही पर विश्वास किया जो तुम्हें दी गई थी—उस दिन।”'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: जब वह ... आएगा
  rationale: ὅταν के साथ aorist subjunctive यहाँ भविष्य की एक निश्चित घटना बताता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐνδοξασθῆναι
  choice: महिमा पाने
  rationale: निष्क्रिय infinitive मसीह के आगमन का उद्देश्य/परिणाम व्यक्त करता है और दैवी महिमा का भाव बनाए रखता है।
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: अपने पवित्र लोगों के बीच
  rationale: ἅγιοι को साधारण पाठक के लिए स्पष्ट रूप से ‘पवित्र लोग’ कहा गया है। ἐν का ‘बीच’ सामुदायिक परिवेश व्यक्त करता है, जबकि ‘में’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: θαυμασθῆναι
  choice: विस्मय से देखा जाने
  rationale: यह निष्क्रिय infinitive आश्चर्य और श्रद्धापूर्ण प्रशंसा का भाव व्यक्त करता है, केवल सामान्य सराहना का नहीं।
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: उन सबके बीच ... जिन्होंने विश्वास किया है
  rationale: यह participle के क्रियात्मक बल और πᾶσιν की समावेशी व्यापकता को बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह थिस्सलुनीकियों के विश्वास करने वालों में सम्मिलित होने का कारण देता है।
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς
  choice: तुमने हमारी गवाही पर विश्वास किया
  rationale: यूनानी निष्क्रिय वाक्य को स्वाभाविक हिन्दी में कर्तृवाच्य बनाया गया है; अर्थ वही है कि उन्हें दी गई प्रेरितिक गवाही स्वीकार की गई।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: मानक कालवाचक अभिव्यक्ति को आरम्भ में रखकर पूरे आगमन-दृश्य का स्पष्ट समय-निर्धारण किया गया है।
theological_decisions:
- issue: अंतकालीन प्रसंग में ‘उसके पवित्र लोगों’ का संदर्भ और ἐν का बल
  choice: ‘अपने पवित्र लोगों के बीच’—अर्थात मसीह के विश्वास करने वाले लोग
  alternative: ‘अपने पवित्र लोगों में’, जिससे उनमें उसकी महिमा प्रकट होने पर अधिक बल पड़ता है
  rationale: निकटवर्ती समानांतर पदबंध ‘उन सब ... जिन्होंने विश्वास किया है’ लोगों को संदर्भ मानने का समर्थन करता है। ‘बीच’ सार्वजनिक और सामुदायिक दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है; ‘में’ का वास्तविक विकल्प पादटिप्पणी में रखा गया है।
- issue: πιστεύσασιν और ἐπιστεύθη में विश्वास का अर्थ
  choice: दोनों को सामान्य विश्वास-संबंधी भाषा से व्यक्त किया गया है
  alternative: ‘भरोसा किया’ या ‘विश्वास करने वाले’ जैसी संज्ञात्मक अभिव्यक्ति
  rationale: पाठ प्रेरितिक गवाही पर विश्वास की बात करता है; किसी विशेष सम्प्रदायगत अर्थ को जोड़ना आवश्यक नहीं है।
- issue: ἐν τῇ ἡμέρᾳ ἐκείνῃ का वाक्यगत संबंध
  choice: ‘उस दिन’ को वाक्य के आरम्भ में रखकर पूरे आगमन से जोड़ा गया है
  alternative: यूनानी शब्दक्रम के निकट इसे वाक्य के अंत में रखना
  rationale: दोनों विन्यास सम्भव हैं; आरम्भिक स्थान आधुनिक हिन्दी में अधिक स्पष्ट है, जबकि यूनानी का अंतिम स्थान उस दिन पर आलंकारिक बल डाल सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज रूप अपनाया गया है। ‘संतों’ के स्थान पर ‘पवित्र लोगों’ से सामान्य पाठक के लिए अर्थ स्पष्ट किया गया है। मुख्य पाठ में यूनानी निष्क्रिय ‘हमारी गवाही पर विश्वास किया गया’ को अधिक स्वाभाविक हिन्दी ‘तुमने हमारी गवाही पर विश्वास किया’ बनाया गया है।
