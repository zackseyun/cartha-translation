  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: hi
  text: और तुम जो सताए जा रहे हो, तुम्हें हमारे साथ राहत मिलेगी, जब प्रभु यीशु अपने सामर्थ्य के दूतों[a] के साथ स्वर्ग से प्रकट होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार रूप में, “अपने शक्तिशाली दूतों के साथ।”
    reason: संबंधकारक वाक्यांश का गुणात्मक अर्थ भी संभव है।
lexical_decisions:
- source_word: τοῖς θλιβομένοις
  choice: जो सताए जा रहे हो
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत जारी उत्पीड़न या क्लेश को व्यक्त करता है। ‘सताए जा रहे हो’ कर्मवाच्य भाव और वर्तमान पीड़ा, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄνεσιν
  choice: राहत
  rationale: यह दबाव, क्लेश या कष्ट से छुटकारे और चैन का बोध कराता है। प्रसंग में ‘राहत’ वर्तमान सताव के साथ स्पष्ट विरोध प्रस्तुत करता है।
- source_word: μεθ’ ἡμῶν
  choice: हमारे साथ
  rationale: μετά के साहचर्य भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है तथा पौलुस और उसके सहकर्मियों को उसी भावी राहत में सम्मिलित रखता है।
- source_word: ἐν τῇ ἀποκαλύψει
  choice: जब ... प्रकट होंगे
  rationale: घटना-सूचक संज्ञा के साथ ἐν यहाँ समय बताता है। हिन्दी में उपवाक्य रूप समय-संबंध को सहज बनाता है, जबकि यीशु के भावी प्रकटीकरण का अर्थ सुरक्षित रहता है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु
  rationale: κύριος के उपाधि-भाव और नए नियम के प्रचलित प्रयोग को ‘प्रभु’ बनाए रखता है।
- source_word: ἀπ’ οὐρανοῦ
  choice: स्वर्ग से
  rationale: ἀπό स्रोत या उद्गम को दर्शाता है; ‘स्वर्ग से’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: अपने सामर्थ्य के दूतों के साथ
  rationale: यह यूनानी के संक्षिप्त संबंधकारक विन्यास को दिखाई देने देता है और दूतों को प्रभु के सामर्थ्य से संबद्ध रखता है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ में संबंधकारक का अर्थ
  choice: अपने सामर्थ्य के दूतों के साथ
  alternative: अपने सामर्थी दूतों के साथ
  rationale: यूनानी वाक्यांश का अर्थ गुणात्मक रूप से ‘सामर्थी दूत’ हो सकता है, पर वह दूतों और प्रभु के सामर्थ्य के बीच संबंध भी व्यक्त कर सकता है। मुख्य पाठ निकटतर संरचना रखता है और मुहावरेदार विकल्प पादटिप्पणी में देता है।
- issue: ἐν τῇ ἀποκαλύψει का कालगत बल
  choice: जब प्रभु यीशु ... प्रकट होंगे
  alternative: प्रभु यीशु के ... प्रकटीकरण पर
  rationale: दोनों रूप राहत को यीशु के भावी प्रकटीकरण से जोड़ते हैं। उपवाक्य आधुनिक हिन्दी में अधिक स्पष्ट और स्वाभाविक है, बिना घटना की भावी तथा प्रकटकारी प्रकृति बदले।
- issue: ἄνεσιν के साथ निहित क्रिया
  choice: तुम्हें ... राहत देगा
  alternative: तुम्हारे लिए ... राहत
  rationale: यूनानी में क्रिया पिछले पद से समझी जाती है। स्वतंत्र पद के रूप में सुबोध हिन्दी के लिए ‘देगा’ को स्पष्ट किया गया है; इसका कर्ता पिछले संदर्भ से आता है, इसलिए यहाँ नया कर्ता नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य पर निर्भर है; हिन्दी में अर्थ-स्पष्टता के लिए निहित ‘देगा’ व्यक्त किया गया है। पादटिप्पणी-चिह्न उसी विवादित दूत-वाक्यांश पर रखा गया है, न कि ‘सताए जा रहे हो’ पर।
