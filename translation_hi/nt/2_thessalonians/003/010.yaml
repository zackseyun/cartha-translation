source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: hi
  text: 'क्योंकि जब हम तुम्हारे साथ थे, तब भी हम तुम्हें यह आज्ञा देते रहते थे: यदि कोई काम करना नहीं चाहता[b], तो वह खाए भी नहीं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो वह न खाए।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ का अर्थ “काम करना नहीं चाहता” है; बात अनिच्छा की है, असमर्थता की नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... तब भी
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और καί का बल ‘तब भी’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: जब हम तुम्हारे साथ थे
  rationale: πρός यहाँ व्यक्तियों की संगति या उपस्थिति में होने का भाव देता है; ‘तुम्हारे साथ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: हम तुम्हें यह आज्ञा देते रहते थे
  rationale: παρηγγέλλομεν अपूर्ण भूतकाल में है और बीते समय की जारी या बार-बार दी गई आज्ञा का संकेत कर सकता है; ‘देते रहते थे’ उस पक्ष को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι आगे आज्ञा की विषय-वस्तु प्रस्तुत करता है; हिन्दी में विसर्ग चिह्न इस संबंध को सहज ढंग से व्यक्त करता है।
- source_word: εἴ τις
  choice: यदि कोई
  rationale: यह अनिश्चित और सामान्य शर्त है; ‘यदि कोई’ उसके व्यापक दायरे को बनाए रखता है।
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: काम करना नहीं चाहता
  rationale: θέλει इच्छा या तत्परता बताता है, सामर्थ्य की कमी नहीं। ‘नहीं चाहता’ अनिच्छा को सरल आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: μηδὲ ἐσθιέτω
  choice: तो वह खाए भी नहीं
  rationale: μηδέ शर्त के अनुरूप निष्कर्ष में ‘भी नहीं’ का बल देता है, और तीसरे पुरुष का आज्ञार्थक भाव ‘वह खाए ... नहीं’ से संक्षिप्त तथा स्वाभाविक हिन्दी में बना रहता है।
theological_decisions:
- issue: क्या कथन काम करने में असमर्थता या काम करने की अनिच्छा के विषय में है
  choice: ‘यदि कोई काम करना नहीं चाहता’—यह अनिच्छा के विषय में है।
  alternative: ‘यदि कोई काम नहीं कर सकता’
  rationale: θέλει इच्छा और तत्परता से संबंधित है। इसे असमर्थता के रूप में अनुवाद करना यूनानी पाठ से अधिक कठोर सामाजिक सिद्धांत जोड़ देगा।
- issue: μηδὲ ἐσθιέτω में आज्ञा किसे संबोधित मानी जाए
  choice: ‘तो वह खाए भी नहीं’—व्यक्ति के लिए तीसरे पुरुष की आज्ञा।
  alternative: ‘तो उसे खाने भी न दिया जाए’—समुदाय को उसे भोजन न देने की आज्ञा।
  rationale: यूनानी तीसरे पुरुष का वर्तमान आज्ञार्थक दोनों प्रकार से समझा जा सकता है। मुख्य पाठ निकट और कम व्याख्यात्मक रूप रखता है; पादटिप्पणी सामुदायिक प्रवर्तन की संभावित छाया दिखाती है।
- issue: अनिश्चित एकवचन व्यक्ति का प्रतिनिधिक स्वरूप
  choice: ‘कोई ... वह’
  alternative: बहुवचन रूप
  rationale: τις और ἐσθιέτω एकवचन हैं। हिन्दी का ‘कोई ... वह’ लिंग-निरपेक्ष रहते हुए स्रोत के प्रतिनिधिक एकवचन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आज्ञा देते रहते थे’ बार-बार या निरंतर दिए गए निर्देश का भाव सुरक्षित रखता है। ‘खाए भी नहीं’ संक्षिप्त आज्ञार्थक शैली है; वैकल्पिक सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
