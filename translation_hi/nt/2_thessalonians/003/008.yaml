  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: hi
  text: और न हमने किसी से मुफ़्त में रोटी खाई,[a] बल्कि परिश्रम और कठिनाई उठाते हुए हम रात-दिन काम करते रहे, ताकि तुममें से किसी पर बोझ न बनें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न हमने किसी की रोटी बिना मूल्य चुकाए खाई।” यूनानी में “रोटी” शब्दशः है, हालाँकि यहाँ इसका संकेत व्यापक रूप से भोजन या भौतिक सहायता की ओर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: मुफ़्त में
  rationale: यह क्रियाविशेषण बिना मूल्य चुकाए या उपहार के रूप में पाने का भाव व्यक्त करता है; ‘मुफ़्त में’ आधुनिक और सहज हिन्दी है तथा आर्थिक आशय बनाए रखता है।
- source_word: ἄρτον
  choice: रोटी
  rationale: मूल अर्थ ‘रोटी’ है। यह व्यापक रूप से भोजन या भौतिक सहायता का संकेत भी दे सकता है, पर ठोस बिंब को मुख्य पाठ में बनाए रखा गया है।
- source_word: παρά τινος
  choice: किसी की
  rationale: παρά के साथ संबंधकारक स्रोत बताता है। हिन्दी में ‘किसी की रोटी’ स्वाभाविक रूप से उसी व्यक्ति से प्राप्त भोजन का अर्थ देता है और यूनानी मुहावरे की संरचना भी निकट से रखता है।
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: परिश्रम और कठिन मेहनत के साथ
  rationale: दोनों निकटार्थक शब्द श्रम की तीव्रता और उससे जुड़ी कठिनाई पर संचयी बल देते हैं। यह हिन्दी अभिव्यक्ति उस दोहरे बल को स्पष्ट रखती है।
- source_word: νυκτὸς καὶ ἡμέρας
  choice: रात-दिन
  rationale: यह समय-सूचक मुहावरा लगातार और व्यापक परिश्रम का भाव देता है; ‘रात-दिन’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ἐργαζόμενοι
  choice: काम करते रहे
  rationale: कृदन्त पौलुस और उसके साथियों की निरंतर गतिविधि बताता है। ‘काम करते रहे’ प्रसंग के आत्मनिर्वाह और जारी श्रम दोनों को सहज रूप से व्यक्त करता है।
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ताकि ... बोझ न बनें
  rationale: यह रचना उद्देश्य व्यक्त करती है। यहाँ क्रिया किसी पर आर्थिक या भौतिक भार डालने के अर्थ में है; हिन्दी में ‘किसी पर बोझ बनना’ स्वाभाविक है।
- source_word: τινα ὑμῶν
  choice: तुममें से किसी पर
  rationale: एकवचन अनिश्चयवाचक शब्द का वितरणात्मक अर्थ है; यह चयन ‘तुममें से किसी भी व्यक्ति’ का भाव संक्षेप में रखता है।
- source_word: οὐδὲ ... ἀλλ’
  choice: और न ... बल्कि
  rationale: 'यह नकार और तीव्र विरोध को बनाए रखता है: उन्होंने निःशुल्क सहायता नहीं ली, बल्कि स्वयं कठोर परिश्रम किया।'
