source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: hi
  text: प्रभु तुम्हारे हृदयों को परमेश्वर के प्रेम[a] की ओर और मसीह के धीरज[b][c] की ओर ले जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘परमेश्वर के प्रति प्रेम’ भी हो सकता है; यूनानी वाक्यांश ‘परमेश्वर का प्रेम’ भी दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: इसका अर्थ ‘मसीह का धीरज’ अथवा ‘मसीह के लिए धीरज’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में ‘ख्रीस्तोस’; यहाँ इसे ‘मसीह’ अनुवादित किया गया है, क्योंकि यह शब्द उपाधि के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक और प्रचलित बाइबलीय अनुवाद है तथा पद में प्रयुक्त ईश्वरीय/मसीही उपाधि का भार बनाए रखता है।
- source_word: κατευθύναι
  choice: ले जाए
  rationale: विधिलिंग-सदृश प्रार्थनात्मक कामना को ‘ले जाए’ स्वाभाविक हिन्दी में व्यक्त करता है और दिशा देने/मार्ग दिखाने का भाव रखता है।
- source_word: καρδίας
  choice: हृदयों
  rationale: यह मनुष्य के विचार, इच्छा और भावनाओं के केंद्र के लिए स्रोत का बाइबलीय रूपक सुरक्षित रखता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का सरल, सटीक और मानक हिन्दी प्रतिशब्द।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: संबंधकारक को यथासंभव खुला रखा गया है; संदर्भ परमेश्वर के प्रेम, परमेश्वर के प्रति प्रेम, अथवा परमेश्वरीय प्रेम के क्षेत्र की ओर संकेत कर सकता है।
- source_word: ὑπομονὴν
  choice: धीरज
  rationale: यह दबाव और कठिनाई में टिके रहने वाले स्थिर धैर्य को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि के रूप में है; ‘मसीह’ उसके अभिषिक्त जन के अर्थ और नए नियम की परिचित शब्दावली दोनों को बनाए रखता है। संबंधकारक की व्याख्या मुख्य पाठ में तय नहीं की गई।
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ में संबंधकारक की अस्पष्टता
  choice: ‘परमेश्वर के प्रेम’ रखा गया
  alternative: ‘परमेश्वर के प्रति प्रेम’ अथवा ‘परमेश्वर का प्रेम’
  rationale: यूनानी वाक्यांश कर्तृवाचक, कर्मवाचक या अधिक व्यापक संबंध व्यक्त कर सकता है; मुख्य पाठ किसी एक धर्मवैचारिक अर्थ को अनिवार्य नहीं बनाता।
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ में संबंधकारक की अस्पष्टता
  choice: ‘मसीह के धीरज’ रखा गया
  alternative: ‘मसीह का अपना धीरज,’ ‘मसीह के लिए धीरज,’ अथवा ‘मसीह जैसा धीरज’
  rationale: वाक्यांश मसीह के अपने धीरज, मसीह के लिए धीरज, या मसीह से पहचाने जाने वाले धीरज की ओर संकेत कर सकता है; इस तनाव को मुख्य पाठ में खुला रखा गया।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός एक उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में उसके अर्थ और पहचान को उचित रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘की ओर … की ओर’ की पुनरावृत्ति यूनानी के दोनों εἰς-वाक्यांशों को स्पष्ट करती है। आरंभ में कोई कालसूचक ‘अब’ नहीं जोड़ा गया, क्योंकि स्रोत में उसका स्पष्ट समकक्ष नहीं है।
