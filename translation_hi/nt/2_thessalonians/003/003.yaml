    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह प्रभु की भरोसेमंद निष्ठा को व्यक्त करता है और पिछले पद में मनुष्यों की अविश्वसनीयता के साथ विरोध बनाए रखता है।
- source_word: δέ
  choice: परन्तु
  rationale: यह पिछले कथन—सब लोगों में विश्वास नहीं है—के विपरीत प्रभु की विश्वासयोग्यता को स्पष्ट करता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: मूल की उपाधि को बिना उसके संदर्भ को अनावश्यक रूप से अधिक विशिष्ट किए सुरक्षित रखता है।
- source_word: στηρίξει
  choice: दृढ़ करेगा
  rationale: क्रिया के स्थिर करने, मजबूत बनाने और दृढ़ करने के अर्थ को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: φυλάξει
  choice: रक्षा करेगा
  rationale: निगरानी करके सुरक्षित रखने की सक्रिय भावना को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ
  choice: से
  rationale: जिस खतरे से बचाया जाता है, उससे दूरी या सुरक्षा का सामान्य अर्थ देता है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट
  rationale: सव्यक्ति अर्थ ‘दुष्ट जन’ को मुख्य पाठ में रखता है; यूनानी रूप का निर्वैयक्तिक अर्थ ‘बुराई’ भी संभव है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: τοῦ πονηροῦ का अभिप्राय
  choice: उस दुष्ट से
  alternative: बुराई से
  rationale: यूनानी विशेषण का यह रूप पुल्लिंग (‘दुष्ट जन’) या नपुंसकलिंग (‘बुराई’) दोनों समझा जा सकता है। मुख्य पाठ में सव्यक्ति अर्थ अपनाया गया है, पर वास्तविक व्याकरणिक और धर्मवैचारिक अस्पष्टता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘विश्वासयोग्य’, ‘दृढ़ करेगा’ और ‘रक्षा करेगा’ मूल के आश्वासनपूर्ण स्वर तथा समानांतर क्रियाओं को बनाए रखते हैं।
