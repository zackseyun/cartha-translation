  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: hi
  text: और यदि कोई इस पत्र के द्वारा दी गई हमारी बात न माने,[a] तो उस व्यक्ति को ध्यान में रखो[b] और उसके साथ मेल-जोल न रखो,[c] ताकि उसे लज्जा आए।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘इस पत्र के द्वारा’ या ‘इस पत्र में’ भी हो सकता है। यूनानी पदबंध उस माध्यम को दर्शा सकता है जिसके द्वारा निर्देश दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे चिह्नित करो’ अथवा ‘उसे पहचान लो।’
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके साथ संगति न रखो।’
    reason: lexical_alternative
  - marker: d
    text: इसका उद्देश्य सुधार है; पद 15 में ऐसे व्यक्ति को अब भी ‘भाई के रूप में’ चेतावनी देने को कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: न माने
  rationale: यहाँ क्रिया का अर्थ अधिकारपूर्ण प्रेरितिक निर्देश का पालन करना है; ‘न माने’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τῷ λόγῳ ἡμῶν
  choice: हमारी बात
  rationale: λόγος यहाँ किसी एक कथन के बजाय प्रेरितिक संदेश या निर्देश को दर्शाता है; ‘हमारी बात’ यूनानी अभिव्यक्ति की व्यापकता रखते हुए सहज हिन्दी देता है।
- source_word: διὰ τῆς ἐπιστολῆς
  choice: इस पत्र के द्वारा दी गई
  rationale: διά के साथ संबंधकारक माध्यम को व्यक्त करता है। ‘इस पत्र के द्वारा दी गई’ स्पष्ट करता है कि प्रेरितिक बात वर्तमान पत्र के माध्यम से पहुँच रही है।
- source_word: σημειοῦσθε
  choice: चिह्नित कर लो
  rationale: मध्यवाच्य आज्ञार्थक उस व्यक्ति को पहचानकर ध्यान में रखने का निर्देश देता है; यह केवल मानसिक रूप से ध्यान देने की अपेक्षा सामुदायिक पहचान के भाव को बेहतर बनाए रखता है।
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: उसके साथ मेल-जोल न रखो
  rationale: संबंधित यूनानी क्रिया का अर्थ किसी के साथ घुलना-मिलना या संगति रखना है। ‘मेल-जोल न रखो’ आधुनिक हिन्दी में स्वाभाविक है और अनुशासनात्मक सामाजिक दूरी का संकेत देता है।
- source_word: ἐντραπῇ
  choice: उसे लज्जा आए
  rationale: निष्क्रिय संभावनार्थक रूप उद्देश्य के रूप में लज्जा का अनुभव व्यक्त करता है; यह वाक्यांश दंडात्मक सार्वजनिक अपमान को अनावश्यक रूप से नहीं जोड़ता।
- source_word: τις / τοῦτον / αὐτῷ
  choice: कोई / उस व्यक्ति को / उसके साथ
  rationale: अनिश्चित सर्वनाम की सामान्य व्यापकता और बाद के एकवचन संदर्भ को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷ द्वारा आदेशित अनुशासन का स्वरूप
  choice: अवज्ञाकारी विश्वासी से सुधार के उद्देश्य से सामाजिक या सामुदायिक दूरी रखना
  alternative: कठोरतम औपचारिक अर्थ में पूर्ण बहिष्कार, अथवा बिना किसी सामुदायिक आयाम के केवल आकस्मिक परहेज
  rationale: अगली आयत उसे शत्रु न मानकर भाई के समान चेतावनी देने को कहती है। इसलिए अनुवाद सुधारात्मक दूरी को व्यक्त करता है, पर बाद की तकनीकी कलीसियाई श्रेणियाँ आरोपित नहीं करता।
- issue: ἐντραπῇ का आशय
  choice: ऐसी लज्जा जो सुधार की ओर ले जाए
  alternative: अपने-आप में लक्ष्य के रूप में सार्वजनिक अपमान
  rationale: उद्देश्यवाचक उपवाक्य और पद 15 का संदर्भ इस लज्जा को सुधारात्मक रूप देता है; मुख्य पाठ फिर भी केवल व्यक्त उद्देश्य ‘लज्जा आए’ ही कहता है और पश्चात्ताप को स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चिह्नित कर लो’ आदेश की सामुदायिक गंभीरता को बनाए रखता है, जबकि ‘मेल-जोल न रखो’ तकनीकी कलीसियाई शब्दावली आरोपित किए बिना सामाजिक दूरी व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
