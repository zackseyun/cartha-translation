source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: hi
  text: अंत में[a], भाइयो, हमारे लिए प्रार्थना करो कि प्रभु का वचन तेज़ी से फैले और आदर पाए, जैसा तुम्हारे बीच भी हुआ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शेष बातों के विषय में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दौड़े और महिमित हो, जैसा तुम्हारे बीच भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: अन्त में
  rationale: यह पत्र के समापन-खंड की ओर ले जाने वाला स्वाभाविक विचार-संकेत है; हिन्दी में ‘अन्त में’ स्पष्ट और प्रचलित है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक निरन्तर प्रार्थना का आग्रह कर सकता है; हिन्दी का सामान्य आज्ञार्थक रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी के व्याकरणिक रूप को मुख्य पाठ में सुरक्षित रखा गया है; यह सम्भवतः पूरी मंडली को प्रतिनिधिक रूप से सम्बोधित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: περὶ ἡμῶν
  choice: हमारे लिए
  rationale: प्रार्थना के सन्दर्भ में περί + संबंधकारक का सहज हिन्दी रूप ‘हमारे लिए’ है।
- source_word: ὁ λόγος τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: यह यूनानी संबंधसूचक पदबंध का पारदर्शी और बाइबलीय हिन्दी रूप है; ‘वचन’ प्रचारित सुसमाचार-सन्देश को सूचित कर सकता है।
- source_word: τρέχῃ
  choice: तेज़ी से फैले
  rationale: शाब्दिक अर्थ ‘दौड़े’ है, पर यहाँ रूपक प्रभु के वचन की तीव्र प्रगति बताता है; ‘तेज़ी से फैले’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: δοξάζηται
  choice: आदर पाए
  rationale: निष्क्रिय रूप उस सम्मान और ग्रहणशील प्रतिक्रिया को व्यक्त करता है जो प्रभु के वचन को मिलती है; ‘महिमित हो’ अधिक शाब्दिक विकल्प है।
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: ठीक वैसे ही जैसे तुम्हारे बीच हुआ
  rationale: यह थिस्सलुनीकियों के बीच पहले घटित वचन की प्रगति और सम्मान से तुलना करता है; सहज हिन्दी के लिए निहित क्रिया ‘हुआ’ जोड़ी गई है।
theological_decisions:
- issue: मंडली के सम्बोधन में ἀδελφοί का अनुवाद
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ में व्याकरणिक रूप सुरक्षित रखा गया है, जबकि सम्भावित समावेशी, प्रतिनिधिक प्रयोग को पादटिप्पणी में बताया गया है।
- issue: वचन की प्रगति के लिए τρέχῃ का रूपक
  choice: तेज़ी से फैले
  alternative: दौड़े
  rationale: मूल रूपक का आशय वचन की तीव्र और निर्बाध प्रगति है; optimal-equivalence के अनुसार स्पष्ट हिन्दी चुनी गई और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया।
- issue: δοξάζηται का अर्थ
  choice: आदर पाए
  alternative: महिमित हो
  rationale: वचन के विषय में यह अभिव्यक्ति उसके सम्मानपूर्वक ग्रहण किए जाने को दर्शाती है; शाब्दिक विकल्प को पादटिप्पणी में रखा गया है ताकि अर्थ-तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सहज शैली। ‘तुम्हारे’ मूल के द्वितीय पुरुष बहुवचन का स्वाभाविक सामुदायिक रूप है। वाक्य के अन्त का अल्पविराम मूल पाठ के अगले पद में जारी रहने वाले वाक्य को दर्शाता है।
