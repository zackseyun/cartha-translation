id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: hi
  text: और यह कि हम अनुचित और दुष्ट लोगों से बचाए जाएँ[a], क्योंकि विश्वास सबका नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेतुके और दुष्ट लोगों से।” यूनानी विशेषण का अर्थ “अनुचित,” “बेतुका” या “अविवेकी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि सभी लोग विश्वासयोग्य नहीं हैं।” यूनानी का शाब्दिक रूप है, “क्योंकि विश्वास सबका नहीं है।”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: हम ... बचाए जाएँ
  rationale: ἵνα के बाद आया अओरिस्ट कर्मवाच्य संभावनार्थक रूप उद्देश्य व्यक्त करता है। ‘बचाए जाएँ’ शत्रुतापूर्ण लोगों से छुड़ाए जाने का अर्थ सहज हिन्दी में देता है, पर बचाव के साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀτόπων
  choice: अनुचित
  rationale: ἄτοπος का अर्थ ‘अनुचित,’ ‘बेतुका’ या ‘अविवेकी’ हो सकता है। πονηρῶν के साथ ‘अनुचित’ दोनों विशेषणों का भेद बनाए रखता है और विरोधियों के विकृत आचरण की ओर संकेत करता है।
- source_word: πονηρῶν
  choice: दुष्ट
  rationale: यह सामान्य नैतिक शब्द बुराई या दुष्टता बताता है; ‘दुष्ट’ वर्तमान प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: ἀνθρώπων
  choice: लोगों
  rationale: बहुवचन ἀνθρώπων यहाँ विरोध करने वाले व्यक्तियों को सूचित करता है। हिन्दी में ‘लोगों’ स्वाभाविक है और यूनानी संज्ञा से अधिक लिंग-विशिष्ट दावा नहीं करता।
- source_word: πίστις
  choice: विश्वास
  rationale: πίστις का प्राथमिक अर्थ यहाँ ‘विश्वास’ है। निकटवर्ती प्रसंग सुसमाचार के विरोधियों का है, इसलिए विश्वास का अभाव सबसे संभावित अर्थ है; फिर भी ‘विश्वासयोग्यता’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: क्योंकि विश्वास सबका नहीं है
  rationale: यूनानी का शाब्दिक ढाँचा ‘क्योंकि विश्वास सबका नहीं’ है। यह हिन्दी वाक्य उस संक्षिप्तता और कुछ अस्पष्टता को बनाए रखते हुए स्वाभाविक अर्थ देता है कि सभी में विश्वास नहीं है।
theological_decisions:
- issue: 'πίστις का अर्थ: विश्वास या विश्वासयोग्यता'
  choice: विश्वास
  alternative: क्योंकि सभी लोग विश्वासयोग्य नहीं हैं
  rationale: प्रेरितों के संदेश के विरोध का प्रसंग ‘विश्वास’ को अधिक संभावित बनाता है। फिर भी πίστις ‘विश्वासयोग्यता’ भी व्यक्त कर सकता है, इसलिए वैकल्पिक अर्थ को दबाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘बचाए जाएँ’ उद्देश्यवाचक संरचना को स्वाभाविक रूप से व्यक्त करता है; ‘विश्वास सबका नहीं है’ मूल यूनानी की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है।
