  source_fidelity: 'The translation accurately represents the Greek purpose clause: “और यह कि” properly continues the preceding prayer request, and “हम ... बचाए जाएँ” reflects ἵνα with the aorist passive subjunctive ῥυσθῶμεν. “अनुचित और दुष्ट लोगों” retains the distinction between ἀτόπων and πονηρῶν without overstating either term. “क्योंकि विश्वास सबका नहीं है” is a faithful, appropriately compact rendering of οὐ γὰρ πάντων ἡ πίστις and preserves its idiomatic ambiguity.'
