id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: hi
  text: शान्ति का प्रभु स्वयं तुम्हें हर समय[a] हर प्रकार से[b] शान्ति दे। प्रभु तुम सबके साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निरन्तर”।
    reason: lexical_alternative
  - marker: b
    text: या “हर रीति से”।
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: स्वयं
  rationale: कर्ता पर दिए गए बल को स्वाभाविक और संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δέ समापन की आशीष की ओर हल्का संक्रमण कराता है; हिन्दी में नया वाक्य और प्रसंग स्वयं यह कार्य करते हैं। ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ उभर सकता है।
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: शान्ति का प्रभु
  rationale: सम्बन्धवाचक पदबंध और उपाधि-जैसी अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: δῴη
  choice: दे
  rationale: आशीर्वादात्मक प्रार्थना या कामना व्यक्त करने वाले यूनानी विधिलिंग का स्वाभाविक हिन्दी रूप।
- source_word: τὴν εἰρήνην
  choice: शान्ति
  rationale: हिन्दी में भाववाचक संज्ञा के साथ किसी अतिरिक्त निर्धारक की आवश्यकता नहीं है।
- source_word: διὰ παντὸς
  choice: हर समय
  rationale: पदबंध की कालगत व्यापकता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν παντὶ τρόπῳ
  choice: हर प्रकार से
  rationale: τρόπος के रीति या ढंग के अर्थ और अभिव्यक्ति की व्यापकता को सुरक्षित रखता है।
- source_word: μετὰ πάντων ὑμῶν
  choice: तुम सबके साथ
  rationale: πάντων की समावेशी व्यापकता को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: आशीष में ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: केवल ‘प्रभु’ रखा गया
  alternative: ‘प्रभु यीशु’ कहकर स्पष्ट करना, अथवा सामान्य रूप से परमेश्वर समझना
  rationale: यूनानी पाठ केवल ὁ κύριος कहता है। पौलुस के प्रसंग में प्रभु यीशु का संकेत सम्भावित है, पर अनुवाद पाठ से अधिक स्पष्ट पहचान नहीं जोड़ता।
- issue: अन्तिम क्रियारहित उपवाक्य का भाव
  choice: ‘प्रभु तुम सबके साथ रहे’—आशीषात्मक कामना
  alternative: ‘प्रभु तुम सबके साथ है’—वर्णनात्मक कथन
  rationale: प्रसंग में यह परम्परागत आशीष या कामना है; यूनानी में क्रिया न होने पर भी हिन्दी में ‘रहे’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनात्मक रूप अपनाया गया है। ‘शान्ति’ और ‘प्रभु’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
