  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह का अनुग्रह तुम सबके[a] साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठों में “तुम” नहीं है; तब वाक्यांश होगा, “सबके साथ रहे।”
    reason: 'पाठांतर: SBLGNT में ὑμῶν पर पाठभेद चिह्नित है।'
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस की आशीर्वचन-शैली में यह परमेश्वर की उदार कृपा और वरदान को सूचित करता है। ‘अनुग्रह’ इसका प्रचलित, गरिमापूर्ण और अर्थानुकूल हिन्दी रूप है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यीशु के अधिकार और सम्मान को व्यक्त करने वाली उपाधि के रूप में κύριος का स्वाभाविक हिन्दी अनुवाद ‘प्रभु’ है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Ἰησοῦς नाम को ‘यीशु’ और Χριστός की अभिषिक्त जन की उपाधि को प्रचलित हिन्दी रूप ‘मसीह’ से व्यक्त किया गया है।
- source_word: μετὰ πάντων ὑμῶν
  choice: तुम सबके साथ रहे
  rationale: μετά संबंधसूचक रूप में ‘साथ’ और πάντων ὑμῶν पूरी मंडली को समाविष्ट करते हुए ‘तुम सबके’ है। यूनानी में क्रिया निहित है; हिन्दी आशीर्वचन को स्वाभाविक बनाने के लिए ‘रहे’ जोड़ा गया है।
theological_decisions:
- issue: समापन आशीर्वचन में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός यीशु की अभिषिक्त जन वाली उपाधि को बनाए रखता है। ‘मसीह’ आधुनिक हिन्दी में अधिक सहज और व्यापक रूप से समझा जाने वाला रूप है; ‘ख्रीष्ट’ पारंपरिक लिप्यंतरण है, पर उपाधि का अर्थ कम स्पष्ट करता है।
- issue: आशीर्वचन में निहित क्रिया
  choice: ‘रहे’ जोड़कर कामनासूचक आशीर्वचन
  alternative: ‘तुम सबके साथ’ जैसा क्रियारहित वाक्यांश
  rationale: यूनानी पत्र-समापन में क्रिया निहित है। हिन्दी में ‘रहे’ उस आशीर्वचनात्मक भाव को स्पष्ट करता है, बिना यह तय किए कि अनुग्रह की उपस्थिति किस विशेष धार्मिक रीति से होती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। बहुवचन समुदाय को संबोधित करने के लिए ‘तुम सब’ चुना गया है; यह आत्मीय पत्र-शैली को बनाए रखता है और किसी एक व्यक्ति तक आशीर्वचन को सीमित नहीं करता।
