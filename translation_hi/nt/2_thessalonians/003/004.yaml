id: 2TH.3.4
reference: 2 Thessalonians 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: hi
  text: और प्रभु में हमें तुम्हारे विषय में भरोसा है कि जो आदेश हम तुम्हें देते हैं, उन्हें तुम मान रहे हो और आगे भी मानोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: हमें भरोसा है
  rationale: यूनानी पूर्णकाल वर्तमान में स्थापित और बने हुए विश्वास को व्यक्त करता है; यह सहज हिन्दी उस भाव को स्पष्ट रखती है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: 'मूल पाठ की धार्मिक आधार-सूचना को सीधे सुरक्षित रखता है: भरोसे का आधार प्रभु हैं।'
- source_word: ἐφ’ ὑμᾶς
  choice: तुम्हारे विषय में
  rationale: इस प्रसंग में इसका अर्थ पाठकों के संबंध में या उनके बारे में भरोसा होना है।
- source_word: παραγγέλλομεν
  choice: जो आदेश हम तुम्हें देते हैं
  rationale: παραγγέλλω का प्रामाणिक निर्देश देने का बल ‘आदेश’ से सुरक्षित रहता है; ‘तुम्हें’ हिन्दी में निहित कर्म को स्पष्ट करता है।
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: उन्हें तुम मान रहे हो और आगे भी मानोगे
  rationale: शाब्दिक ‘कर रहे हो और करोगे’ की अपेक्षा आदेशों के साथ हिन्दी में ‘मानना’ स्वाभाविक है; वर्तमान और भविष्य दोनों काल सुरक्षित हैं।
theological_decisions:
- issue: विश्वास का आधार और विषय
  choice: प्रभु में हमें तुम्हारे विषय में भरोसा है
  alternative: हमें प्रभु के द्वारा तुम पर भरोसा है
  rationale: ‘प्रभु में’ मूल ἐν κυρίῳ को बिना कारणात्मक अर्थ थोपे सुरक्षित रखता है, जबकि ‘तुम्हारे विषय में’ ἐφ’ ὑμᾶς का प्रसंगानुकूल संबंध बताता है।
- issue: आज्ञाकारिता की वर्तमान और भावी निरंतरता
  choice: मान रहे हो और आगे भी मानोगे
  alternative: करते हो और करोगे
  rationale: दोनों क्रियाकालों को बनाए रखते हुए आदेशों के पालन का आशय स्वाभाविक हिन्दी में व्यक्त होता है; यह निष्पापता या स्वतः सुनिश्चित आज्ञाकारिता का अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’ रखा गया है। शैली सरल, गरिमापूर्ण और मूल के आश्वस्त किंतु प्रभु-केंद्रित स्वर के अनुरूप है।
