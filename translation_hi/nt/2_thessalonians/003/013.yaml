  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: hi
  text: परन्तु हे भाइयो[a], तुम भलाई करते-करते हिम्मत न हारो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाइयो और बहनो”; यूनानी में “भाइयो” है, जो पूरी विश्वासी मंडली को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: परन्तु ... तुम
  rationale: δέ पिछले प्रसंग में आलसी लोगों की चर्चा के विपरीत भाव प्रकट करता है, और स्पष्ट ὑμεῖς पर बल है; ‘परन्तु ... तुम’ दोनों बातों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन का शाब्दिक रूप पुल्लिंग बहुवचन ‘भाइयो’ है। संभवतः यह पूरी विश्वासी मंडली को समावेशी रूप से संबोधित करता है; इस व्यापक अर्थ को मुख्य पाठ बदलने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: μὴ ἐγκακήσητε
  choice: हिम्मत न हारो
  rationale: μή के साथ अओरिस्ट सब्जंक्टिव निषेध व्यक्त करता है। ἐγκακέω का अर्थ किसी काम में लगे रहते हुए निरुत्साहित होना या हिम्मत हारना हो सकता है; ‘हिम्मत न हारो’ वर्तमान हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: καλοποιοῦντες
  choice: भलाई करते-करते
  rationale: वर्तमान कृदन्त लगातार जारी अच्छे कार्य को दर्शाता है। ‘भलाई करते-करते’ उस निरंतर गतिविधि और उसी के दौरान थककर हिम्मत हारने की संभावना दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मंडली को संबोधित करते समय ἀδελφοί का अनुवाद
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: यूनानी रूप पुल्लिंग बहुवचन है, पर पौलुस के ऐसे संबोधन में पूरी मंडली सम्मिलित हो सकती है। मूल रूप मुख्य पाठ में रखा गया है और उसके संभावित समावेशी आशय को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परन्तु’ प्रसंगगत विरोध को, ‘तुम’ मूल के बल को, और ‘भलाई करते-करते हिम्मत न हारो’ जारी सद्कर्म में दृढ़ बने रहने की आज्ञा को स्पष्ट करता है।
