id: 2TH.3.12
reference: 2 Thessalonians 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: hi
  text: ऐसे लोगों को हम प्रभु यीशु मसीह में आदेश देते और आग्रह करते हैं कि वे शान्ति से काम करते हुए अपनी ही रोटी खाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: ऐसे लोगों को
  rationale: यह पदबंध पिछले संदर्भ में बताए गए अव्यवस्थित और काम न करने वाले लोगों की ओर संकेत करता है। δέ का हल्का संक्रमण हिन्दी में प्रसंग से स्पष्ट है; अलग संयोजक जोड़ना आवश्यक नहीं।
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: हम ... आदेश देते और आग्रह करते हैं
  rationale: दोनों क्रियाएँ बनाए रखने से प्रेरित अधिकार और गंभीर pastoral विनती—दोनों का बल सुरक्षित रहता है।
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: प्रभु यीशु मसीह में
  rationale: ἐν को ‘में’ रखने से प्रभु के साथ संबंध तथा उनके अधिकार-क्षेत्र की मूल अस्पष्टता सुरक्षित रहती है। Χριστός यहाँ उपाधि है, इसलिए ‘मसीह’ स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: शान्ति से काम करते हुए
  rationale: यह अभिव्यक्ति शोर न करने मात्र के बजाय शांत, व्यवस्थित और हस्तक्षेप-रहित ढंग से काम करने को दर्शाती है; हिन्दी में क्रियाविशेषणीय रूप स्वाभाविक है।
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: अपनी ही रोटी खाएँ
  rationale: ‘रोटी’ मूल ठोस रूपक को सुरक्षित रखती है, जबकि प्रसंग में इसका अर्थ अपने श्रम से प्राप्त भोजन या जीविका है। ‘ही’ ἑαυτῶν के आत्मवाचक बल को स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में सक्रिय है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला पद है।
- issue: प्रेरितीय निर्देश का बल
  choice: ‘आदेश’ और ‘आग्रह’ दोनों को बनाए रखना
  alternative: केवल ‘समझाते हैं’ या ‘निर्देश देते हैं’
  rationale: मूल पाठ अधिकारपूर्ण आज्ञा और गंभीर अपील को साथ रखता है; एक ही सामान्य क्रिया से इस तनाव को समतल नहीं किया गया।
- issue: ἐν κυρίῳ का संबंध
  choice: ‘प्रभु यीशु मसीह में’
  alternative: ‘प्रभु यीशु मसीह के अधिकार से’
  rationale: ‘में’ मूल अभिव्यक्ति के संबंध, क्षेत्र और अधिकार के संभावित पहलुओं को खुला रखता है; केवल ‘के अधिकार से’ कहना अर्थ को एक दिशा में सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सीधा रूप। ‘शान्ति से’ शांत तथा व्यवस्थित जीवन-व्यवहार का भाव देता है; ‘अपनी ही रोटी’ मूल रूपक और आत्मनिर्भर श्रम पर दिए गए बल को बनाए रखता है।
