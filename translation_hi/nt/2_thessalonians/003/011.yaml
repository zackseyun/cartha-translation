base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: hi
  text: क्योंकि हम सुनते हैं कि तुम्हारे बीच कुछ लोग अव्यवस्थित ढंग से जीवन जी रहे हैं[a]—वे कोई काम नहीं करते, बल्कि दूसरों के मामलों में दखल देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आलस्य में जीवन जी रहे हैं” अथवा “अनुशासनहीन ढंग से रह रहे हैं।” यूनानी शब्द ऐसे व्यवहार को बता सकता है जो अव्यवस्थित हो या समुदाय की अपेक्षाओं के अनुसार काम न करने से जुड़ा हो।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में शब्द-क्रीड़ा है: वे “काम” नहीं करते, लेकिन इधर-उधर के मामलों में “काम करते” हैं—अर्थात दूसरों के मामलों में अनुचित दखल देते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: हम सुनते हैं
  rationale: वर्तमानकालीन क्रिया समुदाय के बारे में मिल रही मौजूदा या लगातार सूचना को व्यक्त करती है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट करता है।
- source_word: τινας
  choice: कुछ लोग
  rationale: यह समुदाय के भीतर एक अनिर्दिष्ट समूह को दर्शाता है।
- source_word: περιπατοῦντας
  choice: जीवन जी रहे हैं
  rationale: यहाँ ‘चलना’ जीवन-व्यवहार का रूपक है; हिन्दी में ‘जीवन जीना’ उसका स्वाभाविक और स्पष्ट अर्थ देता है।
- source_word: ἐν ὑμῖν
  choice: तुममें से
  rationale: वाक्य समुदाय के भीतर मौजूद कुछ व्यक्तियों की ओर संकेत करता है; ‘तुममें से’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἀτάκτως
  choice: अव्यवस्थित ढंग से
  rationale: शब्द ऐसे आचरण को दर्शाता है जो निर्धारित व्यवस्था या सामुदायिक अनुशासन के अनुरूप नहीं है; इसे केवल आलस्य तक सीमित नहीं किया गया।
- source_word: μηδὲν ἐργαζομένους
  choice: कोई काम नहीं करते
  rationale: यह किसी भी उपयोगी काम में न लगे होने पर बल देता है और स्वाभाविक हिन्दी में पूर्ण निषेध को व्यक्त करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह काम न करने और अनुचित रूप से व्यस्त रहने के बीच तीखा विरोध प्रकट करता है।
- source_word: περιεργαζομένους
  choice: दूसरों के कामों में दखल देते फिरते हैं
  rationale: यह अनुचित रूप से इधर-उधर के मामलों में व्यस्त रहने या हस्तक्षेप करने का भाव देता है। ‘देते फिरते हैं’ निरंतर व्यवहार को दिखाता है; ἐργάζομαι के साथ यूनानी शब्द-क्रीड़ा का संकेत पाद-टिप्पणी में रखा गया है।
