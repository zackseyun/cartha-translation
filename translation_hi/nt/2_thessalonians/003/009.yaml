review_pass:
  verdict: revise
  source_fidelity: ‘अपने आप को एक उदाहरण बनाएँ’ conveys the general purpose but weakens δῶμεν (‘give/present’) and can imply making themselves into something they were not. ‘अपने आपको ... प्रस्तुत करें’ more directly conveys the Greek expression while retaining the relation to the readers.
  naturalness: The revised wording is natural, modern, and suitably formal Hindi. ‘तुम्हारे लिए’ and ‘ताकि तुम’ clearly distinguish the presentation of the example from its intended imitation.
  terminology: ‘अधिकार’ appropriately renders ἐξουσίαν in this context. ‘उदाहरण’ and ‘अनुकरण’ accurately render τύπος and μιμεῖσθαι. The footnote alternative ‘शक्ति’ is more idiomatic and semantically direct for ‘power’ than ‘सामर्थ्य’.
  issues:
  - severity: medium
    issue: The rendering ‘अपने आप को एक उदाहरण बनाएँ’ for ἑαυτοὺς τύπον δῶμεν
    rationale: The Greek says literally to give/present themselves as an example. ‘बनाएँ’ can suggest that they make themselves into an example, rather than set themselves before the Thessalonians as one. ‘प्रस्तुत करें’ preserves the action and is idiomatic Hindi.
  - severity: low
    issue: Footnote a uses ‘सामर्थ्य’ as the alternative for ‘power’.
    rationale: ‘शक्ति’ is the more ordinary direct lexical alternative in modern Hindi; ‘सामर्थ्य’ more readily denotes capability or capacity.
