  to: यह इसलिए नहीं कि हमें अधिकार[a] नहीं है, बल्कि इसलिए कि हम तुम्हारे लिए अपने आपको एक उदाहरण[b] के रूप में प्रस्तुत करें, ताकि तुम हमारा अनुकरण करो।
