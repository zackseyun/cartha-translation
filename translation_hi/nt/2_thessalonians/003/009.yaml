source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: hi
  text: यह इसलिए नहीं कि हमें अधिकार[a] नहीं है, बल्कि इसलिए कि हम तुम्हारे लिए अपने आपको एक उदाहरण[b] के रूप में प्रस्तुत करें, ताकि तुम हमारा अनुकरण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सत्ता’ अथवा ‘शक्ति’। यहाँ संदर्भ किसी वैध हक या दावे के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आदर्श’ अथवा ‘नमूना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: संदर्भ में यह भौतिक सहायता पाने के वैध हक या दावे को व्यक्त करता है; ‘अधिकार’ व्यापक प्रेरिताई सत्ता का अनावश्यक अर्थ जोड़े बिना इस भाव को स्वाभाविक हिन्दी में पहुँचाता है।
- source_word: ἑαυτοὺς
  choice: अपने आप को
  rationale: यह पौलुस और उसके सहकर्मियों की ओर संकेत करने वाले आत्मवाचक सर्वनाम का बल बनाए रखता है।
- source_word: τύπον
  choice: एक उदाहरण
  rationale: यहाँ शब्द ऐसे आदर्श आचरण को दर्शाता है जिसका अनुकरण किया जाए; ‘उदाहरण’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: δῶμεν
  choice: बनाएँ
  rationale: यूनानी मुहावरे का शाब्दिक रूप ‘अपने आप को उदाहरण के रूप में दें’ हिन्दी में असहज है; ‘अपने आप को एक उदाहरण बनाएँ’ उसी आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ μιμεῖσθαι
  choice: ताकि तुम ... अनुकरण करो
  rationale: यह रचना उद्देश्य को व्यक्त करती है; ‘ताकि’ उस प्रयोजन को स्पष्ट रखता है।
- source_word: μιμεῖσθαι ἡμᾶς
  choice: तुम हमारा अनुकरण करो
  rationale: यह यूनानी क्रिया और उसके कर्म का सीधा अनुवाद है तथा केवल ‘हमारे उदाहरण पर चलो’ कहने की अपेक्षा मूल संरचना के निकट है।
- source_word: οὐχ ὅτι οὐκ
  choice: यह इसलिए नहीं कि ... नहीं
  rationale: यह दोहरा निषेध वक्ता के उद्देश्य के विषय में गलत धारणा को नकारता है और आगे आने वाले विरोधी उद्देश्य-वाक्य के लिए आधार बनाता है।
- source_word: ἀλλ’ ἵνα
  choice: बल्कि इसलिए कि
  rationale: यह पिछले निषेध के विपरीत वास्तविक उद्देश्य प्रस्तुत करता है और हिन्दी में प्रयोजन-संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἐξουσίαν में पौलुस और उसके सहकर्मियों के दावे का स्वरूप
  choice: उनके पास सहायता पाने का वैध अधिकार था, पर उन्होंने यहाँ स्वेच्छा से उसका उपयोग नहीं किया।
  alternative: यह शब्द अधिक व्यापक रूप से प्रेरिताई सत्ता या सामर्थ्य का उल्लेख कर सकता है।
  rationale: निकटवर्ती संदर्भ दूसरों पर बोझ न बनने के लिए काम करने का है। इसलिए ‘अधिकार’ व्यावहारिक और वैध दावे को व्यक्त करता है, पर अनुवाद इसे व्यापक प्रेरिताई सत्ता के किसी अतिरिक्त धर्मवैज्ञानिक दावे में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने आप को एक उदाहरण बनाएँ’ शाब्दिक यूनानी बिंब को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है; दोनों उद्देश्य-संबंधी खंड अलग और स्पष्ट रखे गए हैं।
