base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: hi
  text: क्योंकि तुम स्वयं जानते हो कि तुम्हें हमारा अनुकरण किस प्रकार करना चाहिए, क्योंकि हमने तुम्हारे बीच अनुशासनहीन आचरण नहीं किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस संदर्भ में अधिक विशेष रूप से, “हम तुम्हारे बीच निष्क्रिय नहीं रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: तुम स्वयं
  rationale: बलवाचक सर्वनाम का जोर बनाए रखता है कि थिस्सलुनीकी विश्वासी स्वयं यह जानते हैं।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: οἶδα का रूप पूर्णकालिक है, पर यहाँ सामान्य वर्तमान अर्थ रखता है।
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: कि तुम्हें किस प्रकार हमारा अनुकरण करना चाहिए
  rationale: यह रीति और दायित्व दोनों को स्वाभाविक हिन्दी में व्यक्त करता है तथा व्यक्तिगत कर्म ‘हमारा’ को बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उनके अनुकरणीय आचरण का आधार बताता है; कारणवाचक संबंध यहाँ संदर्भानुकूल है।
- source_word: οὐκ ἠτακτήσαμεν
  choice: हमने ... अनुशासनहीन आचरण नहीं किया
  rationale: ἀτακτέω के व्यापक अर्थ—अव्यवस्थित, अनुशासनहीन या नियम-विरुद्ध आचरण—को सुरक्षित रखता है और इसे केवल आलस्य तक सीमित नहीं करता।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: समुदाय के मध्य उनके व्यवहार को सहज और सटीक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: तात्कालिक संदर्भ में ἀτακτέω का अर्थ
  choice: मुख्य पाठ में व्यापक ‘अनुशासनहीन आचरण’
  alternative: विशेष रूप से ‘हम तुम्हारे बीच निकम्मे बनकर नहीं रहे’
  rationale: अध्याय में काम न करने का विषय प्रमुख है, फिर भी यूनानी क्रिया का अर्थ उससे व्यापक हो सकता है। मुख्य पाठ उस व्यापकता को रखता है और संदर्भगत विशिष्ट अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘अनुकरण’ पौलुस और उसके सहकर्मियों के उदाहरण का अनुसरण करने की सीधी अभिव्यक्ति है; ‘अनुशासनहीन आचरण’ मूल शब्द की व्यापकता बनाए रखता है।
