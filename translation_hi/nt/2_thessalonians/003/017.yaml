  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: hi
  text: यह अभिवादन मेरे अपने हाथ से है—पौलुस के हाथ से। यह हर पत्र में एक पहचान-चिह्न है; मैं इस प्रकार लिखता हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे अपने हाथ से—पौलुस के हाथ से—यह अभिवादन है, जो हर पत्र में एक पहचान-चिह्न है; इस प्रकार मैं लिखता हूँ।” अंतिम वाक्यांश का अधिक स्पष्ट अनुवाद, “यही रीति है जिससे मैं लिखता हूँ,” भी संभव है।
    reason: यूनानी वाक्य-विन्यास में ‘पौलुस’ की आत्म-पहचान और सम्बन्धवाचक उपवाक्य का निकट संबंध कुछ हद तक खुला है। οὕτως γράφω ‘इस प्रकार मैं लिखता हूँ’ अथवा ‘यही रीति है जिससे मैं लिखता हूँ’ हो सकता है; पाद-टिप्पणी इस सीमित अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: यह अभिवादन
  rationale: पत्र के समापन में ἀσπασμός के लिए ‘अभिवादन’ स्वाभाविक, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: मुझ पौलुस के अपने हाथ से लिखा हुआ
  rationale: दत्तिव पद व्यक्तिगत हस्तलेखन को सूचित करता है; ‘अपने हाथ से लिखा हुआ’ हिन्दी में इसका अर्थ स्पष्ट करता है, और Παύλου को आत्म-पहचान के रूप में ‘मुझ पौलुस’ से व्यक्त किया गया है।
- source_word: ὅ ἐστιν σημεῖον
  choice: यह मेरी पहचान है
  rationale: σημεῖον यहाँ प्रामाणिकता बतानेवाले पहचान-चिह्न के अर्थ में है। ‘मेरी पहचान’ साधारण हिन्दी में वही कार्य स्पष्ट करती है, बिना किसी अतिरिक्त धार्मिक अर्थ के।
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: हर पत्र में
  rationale: यह पौलुस के पत्रों में प्रचलित रीति का संकेत है; ‘पत्र’ आधुनिक पाठक के लिए ‘पत्री’ की अपेक्षा अधिक सहज है।
- source_word: οὕτως γράφω
  choice: मैं इसी तरह लिखता हूँ
  rationale: οὕτως रीति की ओर संकेत कर सकता है। यह अनुवाद हस्तलेखन के नमूने की ओर स्वाभाविक संकेत देता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पौलुस के स्वहस्तलेख का प्रामाणिकता-सूचक बल
  choice: वाक्य को पौलुस के निजी हस्तलेखन द्वारा पत्र की पहचान या प्रामाणिकता बताने के रूप में प्रस्तुत किया गया है।
  alternative: 'अंतिम उपवाक्य केवल वर्तमान अभिवादन की लेखन-क्रिया की ओर संकेत कर सकता है: ‘मैं इस प्रकार लिख रहा हूँ।’'
  rationale: ‘हर पत्र में ... पहचान’ का निकट संदर्भ प्रमाणीकरण की रीति का समर्थन करता है, पर οὕτως γράφω की संभावित संकीर्ण व्याख्या को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल लेकिन गरिमापूर्ण पत्रात्मक शैली। ‘मुझ पौलुस’ लेखक की आत्म-पहचान को स्वाभाविक हिन्दी में रखता है। मुख्य पाठ में ‘पहचान’ सहज है, जबकि पाद-टिप्पणी अधिक औपचारिक ‘पहचान-चिह्न’ और शाब्दिक विकल्प देती है।
