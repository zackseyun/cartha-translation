reference: 2 Thessalonians 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: hi
  text: भाइयों[a], हम अपने प्रभु यीशु मसीह[c] के नाम में तुम्हें आज्ञा देते हैं कि तुम हर उस भाई से अलग रहो[b], जो अव्यवस्थित जीवन जीता है[e] और उस परंपरा के अनुसार आचरण नहीं करता, जो उन्होंने हमसे ग्रहण की थी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयों” यूनानी के पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; पौलुस पूरी कलीसिया को संबोधित कर रहा है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने को उससे अलग कर लो”; यूनानी का अर्थ निकट संगति से अपने को दूर रखना है।
    reason: lexical_alternative
  - marker: c
    text: “मसीह” का अनुवाद “ख़्रीस्त” भी किया जा सकता है।
    reason: alternative_reading
  - marker: d
    text: कुछ हस्तलिपियों में “जो तुमने हमसे ग्रहण की थी” या “जो उसने हमसे ग्रहण की थी” है, जिससे “हर उस भाई” के बाद वाक्य-विन्यास सरल हो जाता है। मुद्रित यूनानी पाठ में “जो उन्होंने हमसे ग्रहण की थी” है।
    reason: textual_variant
  - marker: e
    text: “अव्यवस्थित जीवन जीता है” का शाब्दिक रूप “अव्यवस्थित ढंग से चलता है” है; इसका अर्थ अव्यवस्थित ढंग से जीवन बिताना है। निकट संदर्भ में इसमें आलस्य भी सम्मिलित है।
    reason: previous_rendering
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: हम ... आज्ञा देते हैं
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने का भाव रखती है; इसलिए केवल “समझाते हैं” की अपेक्षा “आज्ञा देते हैं” अधिक उपयुक्त है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन पुल्लिंग बहुवचन है। मुख्य पाठ में उसका रूप सुरक्षित रखा गया है और कलीसिया के समूचे समुदाय की ओर संकेत को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: अपने प्रभु यीशु मसीह के नाम में
  rationale: “नाम में” मूल मुहावरे और उसके अधिकारपूर्ण, गंभीर स्वर को बनाए रखता है। Χριστός को यहाँ उपाधि के रूप में “मसीह” किया गया है।
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: तुम ... अलग रहो
  rationale: मध्यवाच्य क्रिया अपने को निकट संगति से पीछे रखने का भाव देती है। “अलग रहो” अनुशासनात्मक बल बनाए रखता है, पर इसे औपचारिक बहिष्कार नहीं बनाता।
- source_word: παντὸς ἀδελφοῦ
  choice: हर उस भाई से
  rationale: एकवचन पुल्लिंग और विश्वासियों के पारिवारिक संबोधन दोनों को सुरक्षित रखा गया है।
- source_word: ἀτάκτως περιπατοῦντος
  choice: जो अव्यवस्थित चाल चलता है
  rationale: यह ἀτάκτως के व्यापक अर्थ—व्यवस्था या अनुशासन से बाहर—और περιπατέω के जीवन-चाल रूपक, दोनों को बनाए रखता है; निकट संदर्भ में आलस्य इसका एक विशेष रूप हो सकता है।
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: उस परंपरा के अनुसार नहीं चलता
  rationale: παράδοσις वह शिक्षा है जो सौंपकर आगे दी गई हो। “परंपरा” मूल शब्द की प्रत्यक्षता रखता है; संदर्भ इसे प्रेरितों से मिली परंपरा के रूप में सीमित करता है।
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: जो उन्होंने हमसे ग्रहण की थी
  rationale: SBLGNT का παρελάβοσαν तृतीय पुरुष बहुवचन है, इसलिए अपेक्षाकृत कठिन वाक्य-विन्यास को सुधारे बिना “उन्होंने” रखा गया है।
theological_decisions:
- issue: Χριστοῦ का मसीही उपाधि के रूप में अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός यीशु की उपाधि है; “मसीह” उसका स्वाभाविक और व्यापक हिन्दी रूप है।
- issue: στέλλεσθαι ὑμᾶς ἀπὸ द्वारा अपेक्षित दूरी का दायरा
  choice: अलग रहो
  alternative: अपने को अलग कर लो / दूर रहो
  rationale: पाठ निकट संगति से पीछे हटने की आज्ञा देता है, पर स्वयं इस पद में औपचारिक कलीसियाई निष्कासन का तकनीकी शब्द नहीं है।
- issue: ἀτάκτως का अर्थ
  choice: अव्यवस्थित
  alternative: आलसी / अनुशासनहीन
  rationale: आगे के संदर्भ में आलस्य प्रमुख है, फिर भी इस पद में शब्द का व्यापक अर्थ सुरक्षित रखा गया है ताकि उसे समय से पहले केवल काम न करने तक सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “चाल चलता है” पौलुस के जीवन-चाल रूपक को बचाता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है। हल्के संयोजक δέ के लिए कृत्रिम “अब” या विरोधसूचक “परन्तु” नहीं जोड़ा गया।
