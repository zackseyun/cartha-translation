  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: hi
  text: और उसे शत्रु न समझो, बल्कि भाई मानकर उसे समझाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाई’ से आशय किसी साथी विश्वासी से है; यह शब्द मसीही समुदाय के किसी सदस्य के लिए प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: समझो
  rationale: यह क्रिया किसी व्यक्ति को एक निश्चित दृष्टि या श्रेणी में मानने का भाव देती है। हिंदी में ‘शत्रु न समझो’ स्वाभाविक है और मूल्यांकन के इसी अर्थ को व्यक्त करता है।
- source_word: ἐχθρὸν
  choice: शत्रु
  rationale: यह उस व्यक्ति को विरोधी या दुश्मन की श्रेणी में रखने का निषेध करता है। ‘शत्रु’ स्पष्ट, dignified और प्रचलित हिंदी शब्द है।
- source_word: νουθετεῖτε
  choice: समझाओ
  rationale: संदर्भ में इसका अर्थ सुधार के उद्देश्य से चेताना और उचित मार्ग बताना है। ‘समझाओ’ आधुनिक सामान्य हिंदी में pastoral चिंता और सुधारात्मक बल दोनों व्यक्त करता है; केवल ‘सिखाओ’ बहुत हल्का और ‘डाँटो’ अनावश्यक रूप से कठोर होता।
- source_word: ἀδελφόν
  choice: भाई
  rationale: मूल में एकवचन पुल्लिंग संज्ञा है, जो यहाँ मसीही समुदाय के साथी सदस्य के लिए प्रयुक्त है। ‘भाई’ मूल रूप को बनाए रखता है; इसका प्रतिनिधिक सामुदायिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὡς
  choice: मानकर
  rationale: दूसरे खंड में ὡς उस संबंध या हैसियत को दर्शाता है जिसमें उसे समझाना है। ‘भाई मानकर’ हिंदी में स्वाभाविक रूप से यही भाव देता है।
- source_word: καὶ μὴ ... ἀλλὰ
  choice: और ... न ..., बल्कि ...
  rationale: यह पिछले निर्देश से संबंध और दोनों व्यवहारों के बीच स्पष्ट विरोध बनाए रखता है।
theological_decisions:
- issue: आज्ञा न मानने वाले विश्वासी के प्रति अनुशासनात्मक दृष्टिकोण
  choice: व्यक्ति को शत्रु न मानते हुए समुदाय के भाई के रूप में सुधार के उद्देश्य से समझाना है।
  alternative: इसे कलीसियाई अनुशासन के बजाय सामान्य पारस्परिक संघर्ष के विषय में व्यापक सलाह माना जा सकता है।
  rationale: 2 थिस्सलुनीकियों 3:14–15 का निकट संदर्भ समुदाय के भीतर आज्ञा न मानने वाले व्यक्ति से संबंधित है। ‘भाई’ कहना अनुशासन के बीच भी सामुदायिक संबंध को स्वीकार करता है, पर इससे अनुशासन की प्रकृति या अंतिम परिणाम के बारे में पाठ से अधिक कोई सांप्रदायिक निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘समझाओ’ सामान्य पाठक के लिए स्वाभाविक है और νουθετεῖτε के सुधारात्मक तथा चेतावनीपूर्ण आशय को संदर्भ में व्यक्त करता है। मुख्य पाठ में एकवचन ‘भाई’ मूल के लिंग और संख्या को बनाए रखता है; प्रतिनिधिक प्रयोग पादटिप्पणी में बताया गया है।
