revisions:
- from: राजा अग्रिप्पा, क्या आप भविष्यद्वक्ताओं पर विश्वास करते हैं?[a] मैं जानता हूँ कि आप विश्वास करते हैं।
  to: राजा अग्रिप्पा, क्या आप भविष्यद्वक्ताओं की बातों पर विश्वास करते हैं?[a] मैं जानता हूँ कि आप उनकी बातों पर विश्वास करते हैं।
  rationale: The revision makes the object of belief explicit in both clauses as the prophets’ testimony, which is the natural Hindi expression for πιστεύω with the prophets as the dative object in this context. It preserves Paul’s direct rhetorical question and confident assertion, without expanding the statement into obedience, general religiosity, or a doctrinal conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:55Z'
review_pass:
  verdict: revise
  source_fidelity: The question and assertion correctly retain the direct address, the interrogative form, and the repeated verb πιστεύεις. However, in Hindi the bare final clause “आप विश्वास करते हैं” can readily be understood as a general statement of religious belief rather than belief in the prophets. Retaining an anaphoric object better reflects the Greek repetition and its supplied object.
  naturalness: “भविष्यद्वक्ताओं पर विश्वास करना” is understandable, but “भविष्यद्वक्ताओं की बातों पर विश्वास करना” is more idiomatic modern Hindi for accepting prophetic testimony. The final clause is also clearer and more natural with “उनकी बातों पर.”
  terminology: “राजा अग्रिप्पा” is appropriate modern, respectful direct address. “भविष्यद्वक्ता” appropriately renders προφήτης. The revision expresses πιστεύω with respect to the prophets' testimony without importing obedience or a broader doctrinal claim.
  issues:
  - severity: medium
    issue: The final clause omits the object of “विश्वास करते हैं.”
    rationale: Although Hindi permits contextual ellipsis, here it can shift the sense toward generic religious belief. “उनकी बातों पर विश्वास करते हैं” preserves the specific referent and the rhetorical repetition of πιστεύεις.
  - severity: low
    issue: “भविष्यद्वक्ताओं पर विश्वास” is less idiomatic than belief in their words/testimony.
    rationale: The Greek dative refers to accepting the prophets as witnesses, not necessarily personal trust in them. Explicitly referring to their words makes this sense natural in modern Hindi while remaining within the contextual implication.
  revised_text: राजा अग्रिप्पा, क्या आप भविष्यद्वक्ताओं की बातों पर विश्वास करते हैं?[a] मैं जानता हूँ कि आप उनकी बातों पर विश्वास करते हैं।
  revised_footnotes:
  - marker: a
    text: या, “भविष्यद्वक्ताओं को स्वीकार करते हैं” अथवा “भविष्यद्वक्ताओं की बातों को सच मानते हैं।”
    reason: lexical_alternative
  revision_rationale: The revision makes the object of belief explicit in both clauses as the prophets’ testimony, which is the natural Hindi expression for πιστεύω with the prophets as the dative object in this context. It preserves Paul’s direct rhetorical question and confident assertion, without expanding the statement into obedience, general religiosity, or a doctrinal conclusion.
