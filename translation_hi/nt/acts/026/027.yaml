  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: hi
  text: राजा अग्रिप्पा, क्या आप भविष्यद्वक्ताओं की बातों पर विश्वास करते हैं?[a] मैं जानता हूँ कि आप उनकी बातों पर विश्वास करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भविष्यद्वक्ताओं को स्वीकार करते हैं” अथवा “भविष्यद्वक्ताओं की बातों को सच मानते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: विश्वास करते हैं
  rationale: वर्तमानकाल, कर्तृवाच्य, एकवचन का सीधा प्रश्न है। आदरसूचक ‘आप’ के साथ बहुवचन क्रिया-रूप स्वाभाविक आधुनिक हिन्दी है। ‘विश्वास करना’ भविष्यद्वक्ताओं की गवाही को सच मानने और स्वीकार करने का भाव रखता है।
- source_word: βασιλεῦ Ἀγρίππα
  choice: राजा अग्रिप्पा
  rationale: सम्बोधन को आधुनिक हिन्दी में बिना पुरातन ‘हे’ के स्वाभाविक रूप से रखा गया है; नाम का प्रचलित देवनागरी लिप्यंतरण ‘अग्रिप्पा’ है।
- source_word: τοῖς προφήταις
  choice: भविष्यद्वक्ताओं पर
  rationale: मूल में दत्तिव बहुवचन सीधे ‘विश्वास करना’ के साथ जुड़ा है। यह अनुवाद भविष्यद्वक्ताओं और उनकी गवाही दोनों की सम्भावित अभिव्यंजना बनाए रखता है।
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: पूर्णकालिक रूप का यहाँ वर्तमान अर्थ है; सीधा कथन पौलुस के दृढ़ दावे को बिना नरम किए व्यक्त करता है।
- source_word: ὅτι πιστεύεις
  choice: कि आप विश्वास करते हैं
  rationale: दोहराई गई क्रिया को बनाए रखा गया है। हिन्दी में यही पुनरावृत्ति कथन के बल को स्वाभाविक रूप से व्यक्त करती है; कोई अतिरिक्त सहायक बलसूचक शब्द आवश्यक नहीं है।
theological_decisions:
- issue: ‘भविष्यद्वक्ताओं पर विश्वास’ का स्वरूप
  choice: भविष्यद्वक्ताओं और उनकी गवाही पर विश्वास का खुला अर्थ रखा गया है।
  alternative: ‘भविष्यद्वक्ताओं की बातों को सच मानते हैं’ या ‘भविष्यद्वक्ताओं को स्वीकार करते हैं।’
  rationale: πιστεύω के साथ दत्तिव यहाँ भविष्यद्वक्ताओं की गवाही को मानने या स्वीकार करने का अर्थ दे सकता है। मुख्य पाठ किसी अधिक विस्तृत सिद्धान्त, आज्ञाकारिता, या सामान्य धार्मिकता को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। राजकीय सम्बोधन में आदरसूचक ‘आप’ रखा गया है, पर अनावश्यक पुरातन शैली से बचा गया है।
