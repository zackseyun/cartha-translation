source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: hi
  text: वे मुझे आरम्भ से जानते हैं[a]। यदि वे गवाही देना चाहें, तो वे यह गवाही दे सकते हैं कि मैंने हमारे धर्म के सबसे कठोर पंथ[b] के अनुसार एक फ़रीसी के रूप में जीवन बिताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रारम्भ से’ अथवा ‘बहुत समय से’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी αἵρεσις का अर्थ यहाँ ‘पंथ’, ‘सम्प्रदाय’ या ‘दल’ है; बाद के तकनीकी अर्थ में ‘विधर्म’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: जानते हैं
  rationale: संदर्भ पौलुस से उनके पहले से चले आ रहे परिचय का है; हिन्दी में वर्तमान काल के साथ ‘आरम्भ से’ इस निरंतर ज्ञान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνωθεν
  choice: आरम्भ से
  rationale: यहाँ अर्थ ‘ऊपर से’ नहीं, बल्कि आरम्भिक समय से है; अन्य सम्भव अर्थों को पादटिप्पणी में रखा गया है।
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: यदि चाहें तो गवाही दे सकते हैं
  rationale: θέλωσι इच्छा या तत्परता बताता है और μαρτυρεῖν न्यायिक प्रसंग में गवाही देने को; यह हिन्दी अभिव्यक्ति दोनों भावों को स्वाभाविक रूप से रखती है।
- source_word: ἀκριβεστάτην
  choice: सबसे कठोर
  rationale: धार्मिक आचरण की अत्यधिक कड़ाई और नियमबद्धता बताने के लिए ‘सबसे कठोर’ सहज और स्पष्ट है।
- source_word: αἵρεσιν
  choice: पंथ
  rationale: यहाँ शब्द यहूदी धर्म के भीतर मान्य फ़रीसी समूह के लिए है, बाद के तकनीकी अर्थ में ‘विधर्म’ के लिए नहीं।
- source_word: θρησκείας
  choice: धर्म
  rationale: इस प्रसंग में यह साझा यहूदी धर्म और उसकी धार्मिक व्यवस्था को सूचित करता है।
- source_word: ἔζησα Φαρισαῖος
  choice: एक फ़रीसी के रूप में जीवन बिताया
  rationale: यह पौलुस के पूर्व जीवन-आचरण और पहचान का स्वाभाविक हिन्दी सार प्रस्तुत करता है।
theological_decisions:
- issue: यहूदी ऐतिहासिक संदर्भ में αἵρεσις का अनुवाद
  choice: पंथ
  alternative: सम्प्रदाय; दल; विधर्म
  rationale: फ़रीसी यहूदी धर्म के भीतर एक पहचाना हुआ धार्मिक समूह था। ‘विधर्म’ बाद का नकारात्मक धर्मवैज्ञानिक अर्थ आरोपित करेगा; ‘पंथ’ ऐतिहासिक अर्थ को स्पष्ट और अपेक्षाकृत तटस्थ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, न्यायिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘फ़रीसी’ प्रचलित बाइबलीय रूप है और ‘पंथ’ को संभावित नकारात्मक आधुनिक अर्थ से बचाने के लिए पादटिप्पणी से स्पष्ट किया गया है।
