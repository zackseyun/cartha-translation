  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: hi
  text: पर पौलुस ने कहा, “मैं परमेश्वर से प्रार्थना करता कि चाहे थोड़े समय में, चाहे बहुत समय में,[a] न केवल आप, बल्कि वे सभी भी जो आज मेरी बात सुन रहे हैं, मेरे जैसे हो जाएँ—इन बेड़ियों को छोड़कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाहे लगभग, चाहे पूरी तरह से”; यूनानी अभिव्यक्ति कठिन है और मात्रा, प्रयास अथवा समय/विस्तार की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: मैं परमेश्वर से प्रार्थना करता हूँ
  rationale: संभावनासूचक प्रार्थनात्मक इच्छा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; τῷ θεῷ प्रार्थना के लक्ष्य के रूप में स्पष्ट रहता है।
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: चाहे थोड़े समय में, चाहे बहुत समय में
  rationale: कठिन यूनानी युग्म का संदर्भानुकूल कालगत अर्थ मुख्य पाठ में रखता है, जबकि इसकी वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: न केवल आप, बल्कि वे सभी भी जो आज मेरी बात सुन रहे हैं
  rationale: एकवचन संबोधन का आदरसूचक हिन्दी रूप और οὐ μόνον…ἀλλὰ καί की बलयुक्त तुलना दोनों बनाए रखता है।
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: मेरे जैसे हो जाएँ
  rationale: इच्छित परिणामी अवस्था को सहज, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: बस इन बेड़ियों को छोड़कर
  rationale: अपवाद का भाव और पौलुस की कैद का ठोस बिंब दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ का अर्थ और अग्रिप्पा के पिछले कथन से उसका संबंध
  choice: 'मुख्य पाठ में समय की व्यापक तुलना: “चाहे थोड़े समय में, चाहे बहुत समय में”'
  alternative: “चाहे लगभग, चाहे पूरी तरह से”; अथवा “चाहे थोड़े प्रयास से, चाहे बहुत प्रयास से”
  rationale: मुहावरा विवादित है और समय, मात्रा/पूर्णता या प्रयास की ओर संकेत कर सकता है। मुख्य पाठ एक संदर्भानुकूल अर्थ देता है, पर पादटिप्पणी अन्य संभावनाएँ देकर अस्पष्टता को छिपाती नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक “आप” से राजकीय संबोधन स्वाभाविक रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
