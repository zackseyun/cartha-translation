  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: hi
  text: मैं तुम्हें लोगों और गैर-यहूदियों[a] से छुड़ाते हुए उनके पास भेज रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें यहूदी लोगों और गैर-यहूदियों से छुड़ाते हुए उनके पास भेज रहा हूँ।”
    reason: ‘लोगों’ का संदर्भ, गैर-यहूदियों के साथ इस विरोध में, यहूदी लोगों से है।
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: बचाता रहूँगा
  rationale: वर्तमान कृदन्त यहाँ यीशु द्वारा पौलुस को विरोधी लोगों से छुड़ाने और आगे भी सुरक्षित निकालते रहने की क्रिया व्यक्त करता है। हिंदी में भविष्यकालीन मुख्य कथन के भीतर “बचाता रहूँगा” इस सतत संरक्षण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ λαοῦ
  choice: इस प्रजा
  rationale: यहूदियों और गैर-यहूदियों के स्पष्ट विरोध में इसका संदर्भ यहूदी प्रजा से है; फिर भी यूनानी पाठ केवल “प्रजा” कहता है। “इस प्रजा” निकट कथानक-संदर्भ और मूल की संक्षिप्तता दोनों बनाए रखता है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: यहूदी संदर्भ में ἔθνη यहाँ सामान्यतः अन्यजातियों, अर्थात गैर-यहूदियों, को दर्शाता है। “गैर-यहूदी” आधुनिक हिंदी में सबसे स्पष्ट और स्वाभाविक है।
- source_word: εἰς οὓς
  choice: जिनके पास
  rationale: भेजने की क्रिया के साथ εἰς οὓς गंतव्य बताता है। व्यक्तियों/समुदायों के लिए हिंदी में “जिनके पास” सहज है।
- source_word: ἀποστέλλω
  choice: मैं तुम्हें भेज रहा हूँ
  rationale: वर्तमान काल इस नियुक्ति की तात्कालिकता व्यक्त करता है; हिंदी का वर्तमान प्रगतिशील रूप इसे स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: “इस प्रजा” का संदर्भ
  choice: मुख्य पाठ में “इस प्रजा” रखा गया है, जिसका संदर्भ यहूदी प्रजा है।
  alternative: “यहूदी प्रजा” या “इस्राएल की प्रजा”
  rationale: गैर-यहूदियों के साथ विरोध से आशय स्पष्ट है, पर मूल पाठ में केवल λαός है। मुख्य पाठ में अपेक्षाकृत औपचारिक रूप रखने और पादटिप्पणी में संदर्भ स्पष्ट करने से मूल की अभिव्यक्ति और अर्थ दोनों सुरक्षित रहते हैं।
- issue: ἐξαιρούμενός का कालगत संबंध
  choice: “बचाता रहूँगा”
  alternative: “बचाते हुए” या “छुड़ाकर”
  rationale: यह कृदन्त मुख्य क्रिया “भेज रहा हूँ” से जुड़ा है और सेवकाई के दौरान संरक्षण का आश्वासन दे सकता है। हिंदी में “बचाता रहूँगा” वाक्य को स्वतंत्र पद के रूप में स्वाभाविक बनाता है, यद्यपि यूनानी व्याकरण कृदन्तीय संबंध को अधिक खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। “गैर-यहूदी” सामान्य पाठक के लिए “अन्यजाति” से अधिक पारदर्शी है।
