    text: या, “मैं तुम्हें यहूदी लोगों और गैर-यहूदियों से छुड़ाते हुए उनके पास भेज रहा हूँ।”
    reason: ‘लोगों’ का संदर्भ, गैर-यहूदियों के साथ इस विरोध में, यहूदी लोगों से है।
  revision_rationale: The revision replaces the added demonstrative and future-continuous promise with wording that reflects the Greek present participle’s close relation to the present commissioning. It preserves the source’s unexpanded ‘the people’ in the main text, while giving the contextually warranted ‘Jewish people’ in a lexical-alternative footnote.
