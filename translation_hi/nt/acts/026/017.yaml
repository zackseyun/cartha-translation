revisions:
- from: मैं तुम्हें इस प्रजा और गैर-यहूदियों[a] से बचाता रहूँगा, जिनके पास मैं तुम्हें भेज रहा हूँ।
  to: मैं तुम्हें लोगों और गैर-यहूदियों[a] से छुड़ाते हुए उनके पास भेज रहा हूँ।
  rationale: The revision replaces the added demonstrative and future-continuous promise with wording that reflects the Greek present participle’s close relation to the present commissioning. It preserves the source’s unexpanded ‘the people’ in the main text, while giving the contextually warranted ‘Jewish people’ in a lexical-alternative footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies ἔθνη as गैर-यहूदी and preserves the present force of ‘मैं ... भेज रहा हूँ.’ However, ‘इस प्रजा’ adds a demonstrative not present in τοῦ λαοῦ, while ‘बचाता रहूँगा’ changes the participial present action into an explicit future, ongoing promise. The revised wording retains the participial relation and avoids adding temporal specificity.
  naturalness: ‘प्रजा’ is intelligible but less natural in modern standard Hindi here. ‘लोगों’ is clear and idiomatic. ‘छुड़ाते हुए ... भेज रहा हूँ’ is a natural enough formal-scriptural rendering that preserves the linked actions without forcing a completed-before-sending sequence.
  terminology: ‘गैर-यहूदियों’ appropriately communicates τῶν ἐθνῶν in this Jewish/Gentile contrast. The footnote identifies the contextual reference of ‘लोगों’ as Jewish people without expanding the main text beyond the Greek wording.
  issues:
  - severity: medium
    issue: ‘बचाता रहूँगा’ introduces explicit future-continuing aspect.
    rationale: ἐξαιρούμενός is a present participle linked to ‘मैं ... भेज रहा हूँ’; it does not itself require a future ‘रहूँगा.’ This also makes the Hindi temporal relation more definite than the Greek.
  - severity: low
    issue: ‘इस प्रजा’ adds ‘इस’ and uses a relatively unnatural term.
    rationale: τοῦ λαοῦ means ‘the people’ and does not contain a demonstrative. In modern Hindi, ‘लोगों’ is more idiomatic while allowing the footnote to state the contextual Jewish referent.
  revised_text: मैं तुम्हें लोगों और गैर-यहूदियों[a] से छुड़ाते हुए उनके पास भेज रहा हूँ।
  revised_footnotes:
