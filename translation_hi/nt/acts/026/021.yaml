base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: hi
  text: इन्हीं बातों के कारण यहूदियों ने मुझे मंदिर में पकड़ लिया और वे मुझे मार डालने की कोशिश कर रहे थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस कारण” अथवा “इन बातों के कारण”।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मंदिर” के लिए प्रयुक्त यूनानी शब्द पूरे मंदिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: इन्हीं बातों के कारण
  rationale: यह पदबंध कारण बताता है और पौलुस की पिछली गवाही तथा कार्यों की ओर संकेत करता है। ‘इन्हीं’ उस पीछे की ओर संकेत करने वाले बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: με
  choice: मुझे
  rationale: यह συλλαβόμενοι का प्रथम पुरुष एकवचन कर्म है।
- source_word: Ἰουδαῖοι
  choice: यहूदियों ने
  rationale: यूनानी बहुवचन घटना में शामिल यहूदी विरोधियों को सूचित करता है, समस्त यहूदी लोगों को नहीं। हिन्दी में कर्ता के साथ ‘ने’ आवश्यक है; प्रसंग इसकी विशिष्टता स्पष्ट करता है।
- source_word: συλλαβόμενοι
  choice: पकड़ लिया
  rationale: कृदंत का अर्थ पकड़ना या अपने वश में करना है। शत्रुतापूर्ण प्रसंग में ‘पकड़ लिया’ स्वाभाविक है और औपचारिक गिरफ्तारी का अनावश्यक भाव नहीं जोड़ता।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: ἱερόν पूरे मंदिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में ‘मंदिर’ सहज है और सूक्ष्म भेद पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπειρῶντο
  choice: कोशिश करने लगे
  rationale: अपूर्णकाल भूतकाल में जारी प्रयास को व्यक्त करता है। संयुक्त वाक्य में ‘कोशिश करने लगे’ उस आरंभ और चलते प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαχειρίσασθαι
  choice: मार डालने
  rationale: इस प्रसंग में क्रिया का अर्थ हिंसापूर्वक जान से मारना है। ‘मार डालना’ स्पष्ट है और ‘हत्या करना’ जैसी अतिरिक्त विधिक-मूल्यांकनात्मक छाया नहीं जोड़ता।
theological_decisions:
- issue: विवाद-संवेदनशील प्रसंग में Ἰουδαῖοι का संदर्भ
  choice: ‘यहूदियों’ रखा गया है और इसे प्रसंगानुसार पौलुस को पकड़ने वाले विशिष्ट यहूदी विरोधियों के लिए समझा गया है।
  alternative: ‘कुछ यहूदियों’ या ‘यहूदी लोगों’
  rationale: मूल पाठ घटना में शामिल समूह को यहूदी कहता है। ‘कुछ’ जोड़ना मूल में निहित मात्रा को स्पष्ट से अधिक सीमित कर देता, जबकि ‘यहूदी लोगों’ से पूरे समुदाय पर सामान्य आरोप का भ्रम हो सकता है। प्रसंग स्वयं संदर्भ को सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कारणसूचक आरंभ, विरोधियों द्वारा पकड़ना और जारी जानलेवा प्रयास—तीनों को स्पष्ट रखा गया है।
