  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: hi
  text: तब अग्रिप्पा ने पौलुस से कहा, “थोड़े ही समय में तुम मुझे मसीही बनने के लिए मना रहे हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद यह भी हो सकता है, “लगभग तुम मुझे मसीही बनने के लिए मना लेते हो,” या संभवतः, “क्या तुम सोचते हो कि इतने थोड़े समय में मुझे मसीही बना दोगे?” यूनानी अभिव्यक्ति थोड़े समय या थोड़ी मात्रा की ओर संकेत कर सकती है, और अग्रिप्पा का स्वर गंभीर भी हो सकता है और व्यंग्यात्मक भी।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: तब अग्रिप्पा
  rationale: δέ हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग की स्वाभाविक प्रगति दिखाता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: πρὸς τὸν Παῦλον
  choice: ने पौलुस से कहा
  rationale: प्रत्यक्ष कथन के परिचय में πρός का आशय हिंदी में ‘से कहा’ द्वारा स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: Ἐν ὀλίγῳ
  choice: इतने थोड़े समय में
  rationale: यह यूनानी पद समय की अल्पता या मात्रा/सीमा की अल्पता जता सकता है। मुख्य पाठ में समय-संबंधी अर्थ रखा गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: με πείθεις
  choice: तुम मुझे ... मना रहे हो
  rationale: वर्तमानकालीन πείθεις तत्काल चल रहे मनाने के प्रयास या प्रभाव को दर्शाता है; ‘मना रहे हो’ आधुनिक हिंदी में इसे सहजता से व्यक्त करता है।
- source_word: Χριστιανὸν
  choice: मसीही
  rationale: Χριστιανός उस व्यक्ति की पहचान या स्थिति बताता है जो मसीह का अनुयायी है; ‘मसीही’ हिंदी में प्रचलित और संक्षिप्त समतुल्य है।
- source_word: ποιῆσαι
  choice: बनने के लिए
  rationale: यहाँ ποιῆσαι परिणामी पहचान को व्यक्त करता है। πείθεις के साथ हिंदी में ‘बनने के लिए मना रहे हो’ स्वाभाविक है और ‘मुझे मसीही बना रहे हो’ से कम कारणात्मक अतिव्याख्या करता है।
theological_decisions:
- issue: अग्रिप्पा के उत्तर का स्वर और आशय
  choice: मुख्य पाठ में अल्प समय में मनाए जाने का सीधा कथन
  alternative: ‘तुम मुझे लगभग मसीही बनने के लिए मना लेते हो,’ अथवा व्यंग्यात्मक प्रश्न, ‘क्या तुम सोचते हो कि इतने थोड़े समय में मुझे मसीही बना दोगे?’
  rationale: Ἐν ὀλίγῳ समय या मात्रा, दोनों की अल्पता व्यक्त कर सकता है, और लिखित वाक्य से अग्रिप्पा का स्वर निर्णायक रूप से स्पष्ट नहीं है। इसलिए मुख्य पाठ सतही व्याकरणिक अर्थ देता है और ईमानदार, टालने वाले या व्यंग्यात्मक स्वरों की संभावनाओं को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘इतने थोड़े समय में’ प्रसंग में वक्ता की प्रतिक्रिया को स्वाभाविक बनाता है; विस्मयादिबोधक चिह्न कथन की प्रतिक्रियात्मक शक्ति दिखाता है, पर स्वर की अंतिम व्याख्या पादटिप्पणी के लिए खुली रखी गई है।
