  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: hi
  text: हे राजा अग्रिप्पा, यहूदियों द्वारा मुझ पर लगाए गए सभी आरोपों के विषय में आज आपके सामने अपना बचाव प्रस्तुत करने वाला हूँ, इसलिए मैं अपने आपको सौभाग्यशाली[a] मानता हूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्य”; इस न्यायिक संदर्भ में आशय संभवतः “सौभाग्यशाली” या “विशेषाधिकार प्राप्त” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν ἐγκαλοῦμαι
  choice: मुझ पर लगाए गए सभी आरोपों के विषय में
  rationale: περί विषय का संकेत करता है और ἐγκαλοῦμαι औपचारिक आरोप का। हिंदी में यह संयुक्त रूप मूल अर्थ और न्यायिक संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπὸ Ἰουδαίων
  choice: यहूदियों द्वारा
  rationale: ὑπό आरोप लगाने वालों को कर्ता के रूप में चिह्नित करता है। संदर्भ में इसका आशय पौलुस पर आरोप लगाने वाले यहूदियों से है, समस्त यहूदी समुदाय से नहीं।
- source_word: βασιλεῦ Ἀγρίππα
  choice: हे राजा अग्रिप्पा
  rationale: संबोधन कारक को स्पष्ट और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करने के लिए ‘हे’ रखा गया है।
- source_word: ἥγημαι ἐμαυτὸν μακάριον
  choice: मैं अपने आपको सौभाग्यशाली मानता हूँ
  rationale: ἡγέομαι के ‘मानना/समझना’ और आत्मवाचक रचना को सुरक्षित रखा गया है। न्यायिक संदर्भ में μακάριον का अर्थ यहाँ ‘सौभाग्यशाली’ अधिक स्वाभाविक है।
- source_word: ἐπὶ σοῦ
  choice: आपके सामने
  rationale: सुनवाई के संदर्भ में ἐπί का अर्थ किसी अधिकारी की उपस्थिति में या उसके सामने उपस्थित होना है।
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: आज ... अपना बचाव प्रस्तुत करने का अवसर पाकर
  rationale: ἀπολογεῖσθαι का न्यायिक अर्थ ‘अपना बचाव प्रस्तुत करना’ है। μέλλων की आसन्न क्रिया को हिंदी में अवसर मिलने की स्वाभाविक रचना से व्यक्त किया गया है, जो पौलुस के स्वयं को सौभाग्यशाली मानने का आधार भी स्पष्ट करती है।
theological_decisions:
- issue: μακάριον का अर्थ
  choice: सौभाग्यशाली
  alternative: धन्य
  rationale: यहाँ पौलुस अग्रिप्पा के सामने कानूनी बचाव प्रस्तुत करने की अनुकूल परिस्थिति की बात कर रहा है; इसलिए ‘सौभाग्यशाली’ संदर्भानुकूल है। फिर भी ‘धन्य’ मूल शब्द की एक वास्तविक शाब्दिक संभावना है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। न्यायिक संदर्भ को ‘आरोप’ और ‘अपना बचाव प्रस्तुत करना’ से स्पष्ट किया गया है। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
