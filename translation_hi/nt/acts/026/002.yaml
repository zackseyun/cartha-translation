  terminology: “आरोप,” “आपके सामने,” and “अपना बचाव प्रस्तुत करना” are appropriate legal-register choices. “सौभाग्यशाली” appropriately renders μακάριον in this context; the footnote responsibly preserves “धन्य” as an alternative.
