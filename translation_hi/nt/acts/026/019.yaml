  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: hi
  text: इसलिए, हे राजा अग्रिप्पा, मैंने उस स्वर्गीय दर्शन[a] की अवज्ञा नहीं की,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग से प्राप्त दर्शन।”
    reason: οὐρανίῳ को दर्शन के स्वर्गीय उद्गम के रूप में स्पष्ट करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: Ὅθεν
  choice: इसलिए
  rationale: यह पिछले वृत्तांत में पौलुस को मिले दर्शन और आदेश से निकलने वाला निष्कर्ष व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रूप से इस तार्किक संबंध को बनाए रखता है।
- source_word: βασιλεῦ Ἀγρίππα
  choice: हे राजा अग्रिप्पा
  rationale: सम्बोधन कारक को स्पष्ट करते हुए सम्मानसूचक पदवी बनाए रखी गई है; न्यायिक भाषण के गरिमापूर्ण प्रसंग में ‘हे’ स्वाभाविक और उपयुक्त है।
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: मैंने ... अवज्ञा नहीं की
  rationale: शाब्दिक ‘मैं अवज्ञाकारी नहीं हुआ’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और दिए गए दिव्य आदेश का पालन करने का क्रियात्मक भाव ठीक से व्यक्त करता है।
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: उस स्वर्गीय दर्शन की
  rationale: ὀπτασία के अलौकिक दृश्य/दर्शन के अर्थ को ‘दर्शन’ व्यक्त करता है। οὐρανίῳ स्वर्गीय उद्गम अथवा स्वरूप—दोनों का संकेत दे सकता है; ‘स्वर्गीय’ इस अर्थ-व्याप्ति को बनाए रखता है। हिन्दी में ‘अवज्ञा करना’ के साथ सम्बन्धसूचक ‘की’ स्वाभाविक है।
theological_decisions:
- issue: दमिश्क के मार्ग पर पौलुस के अनुभव की प्रकृति
  choice: दर्शन
  alternative: स्वर्ग से मिला दृश्य / प्रकट होना
  rationale: ὀπτασία सीधे दर्शन या दिखाई देने की घटना को सूचित करता है। ‘दर्शन’ मूल पाठ की श्रेणी बनाए रखता है और अनुभव की प्रकृति के विषय में उससे अधिक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: οὐρανίῳ का सम्बन्ध—दर्शन का स्वरूप या उसका उद्गम
  choice: स्वर्गीय दर्शन
  alternative: स्वर्ग से मिले दर्शन
  rationale: 'विशेषण ‘स्वर्गीय’ मूल की वास्तविक अस्पष्टता बनाए रखता है: यह दर्शन के स्वर्गीय स्वरूप और स्वर्ग से उसके आने, दोनों का संकेत दे सकता है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक प्रतिरक्षा-भाषण के अनुकूल हिन्दी। ‘हे राजा अग्रिप्पा’ औपचारिक प्रत्यक्ष सम्बोधन को स्पष्ट करता है; वाक्यांश सरल और सामान्य पाठकों के लिए बोधगम्य रखा गया है।
