  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज अदालती भाषा रखी गई है। 'मुकदमे में खड़ा हूँ' न्यायिक प्रसंग को स्पष्ट करता है; 'पूर्वजों' के साथ पादटिप्पणी मूल के शाब्दिक रूप को सुरक्षित रखती है।
