lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह पद को पिछले कथन से जोड़ता है और पौलुस की वर्तमान न्यायिक स्थिति पर ध्यान लाता है।
- source_word: ἐπ’ ἐλπίδι
  choice: इसलिए ... कि मुझे ... आशा है
  rationale: ἐπί के साथ संबंधकारक यहाँ आधार अथवा कारण बताता है; यह हिंदी में मुकदमे का कारण स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा
  rationale: यह आशा से संबद्ध परमेश्वर की प्रतिज्ञा को दर्शाता है; धार्मिक संदर्भ में 'प्रतिज्ञा' सटीक और प्रचलित है।
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: उस प्रतिज्ञा ... जो ... हमारे पूर्वजों से की थी
  rationale: εἰς उस प्रतिज्ञा के प्राप्तकर्ताओं की ओर संकेत करता है; हिंदी में किसी से प्रतिज्ञा करना स्वाभाविक प्रयोग है।
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: जो परमेश्वर ने ... की थी
  rationale: कर्तृवाचक हिंदी रचना परमेश्वर की कर्तृता स्पष्ट रखते हुए यूनानी कृदंत का स्वाभाविक अनुवाद करती है।
- source_word: πατέρας ἡμῶν
  choice: हमारे पूर्वजों
  rationale: संदर्भ में यह इस्राएल के पुरखों को सूचित करता है। आधुनिक हिंदी में 'पूर्वजों' इस आशय को 'पिताओं' की अपेक्षा अधिक स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: ἕστηκα κρινόμενος
  choice: मुकदमे में खड़ा हूँ
  rationale: ἕστηκα का वर्तमान स्थितिवाचक बल और κρινόμενος का न्यायिक अर्थ दोनों इस स्वाभाविक अदालती अभिव्यक्ति में सुरक्षित हैं।
theological_decisions:
- issue: '''हमारे पूर्वजों'' की पहचान'
  choice: इस्राएल के पुरखे, जिनसे परमेश्वर ने प्रतिज्ञा की
  alternative: सामान्य अर्थ में यहूदी लोगों के सभी पूर्वज
  rationale: भाषण का संदर्भ इस्राएल की प्रतिज्ञा-परंपरा की ओर संकेत करता है, पर मुख्य पाठ विशेष कुलपतियों का नाम जोड़कर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- issue: आशा और प्रतिज्ञा का संबंध
  choice: प्रतिज्ञा से उत्पन्न अथवा उसमें निहित आशा
  alternative: केवल प्रतिज्ञा पूरी होने की व्यक्तिगत आशा
  rationale: यूनानी संबंधकारक 'प्रतिज्ञा की आशा' में कुछ अर्थगत खुलापन रखता है; अनुवाद उस संबंध को स्पष्ट सिद्धांत में बदलकर सीमित नहीं करता।
