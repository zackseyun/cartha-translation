  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: hi
  text: दोपहर के समय, मार्ग में, हे राजा, मैंने स्वर्ग से एक प्रकाश देखा, जो सूर्य की चमक से भी अधिक तेज था और मेरे तथा मेरे साथ यात्रा करने वालों के चारों ओर चमक रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: दोपहर के समय
  rationale: यह समयसूचक यूनानी मुहावरा दिन के मध्य को दर्शाता है; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: κατὰ τὴν ὁδὸν
  choice: मार्ग में
  rationale: वाक्यांश यात्रा के दौरान सड़क पर होने का स्थान-संदर्भ देता है; ‘मार्ग में’ संक्षिप्त और गरिमापूर्ण है।
- source_word: εἶδον
  choice: मैंने ... देखी
  rationale: प्रत्यक्ष देखने की साधारण भूतकालीन क्रिया को सहज हिंदी में व्यक्त करता है।
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: सम्बोधन कारक को औपचारिक किन्तु समझने योग्य हिंदी में सुरक्षित रखता है।
- source_word: οὐρανόθεν
  choice: स्वर्ग से
  rationale: यह केवल आकाशीय दिशा नहीं, ऊपर से आने वाली स्वर्गीय उत्पत्ति का संकेत भी रखता है।
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: सूर्य की चमक से भी अधिक तेज
  rationale: ὑπέρ के अतिक्रमण-बोध और λαμπρότης ‘चमक’ दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: φῶς
  choice: एक ज्योति
  rationale: दृश्य में पहली बार प्रकट होने वाले प्रकाश को ‘एक’ के साथ प्रस्तुत किया गया है; ‘ज्योति’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: περιλάμψαν
  choice: चारों ओर चमक उठी
  rationale: क्रिया में निहित चारों ओर प्रकाशित करने के भाव को स्पष्ट करता है और अकस्मात घटना के कथात्मक प्रभाव को बनाए रखता है।
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: मेरे साथ यात्रा करने वालों
  rationale: सहयात्रियों का अर्थ बिना अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: दर्शन-संदर्भ में οὐρανόθεν का अनुवाद
  choice: स्वर्ग से
  alternative: आकाश से
  rationale: लूका-प्रेरितों के काम में यह शब्द स्वर्गीय उत्पत्ति का धार्मिक-कथात्मक संकेत रख सकता है; ‘स्वर्ग से’ उस अर्थ को सुरक्षित रखता है, बिना घटना की प्रकृति पर अतिरिक्त सिद्धान्त थोपे।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘हे राजा’ मूल के प्रत्यक्ष औपचारिक सम्बोधन को बनाए रखता है। मूल यूनानी की तुलना ‘सूर्य की चमक से भी अधिक’ के रूप में पाठ में ही स्पष्ट है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
