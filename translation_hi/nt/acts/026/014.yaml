id: ACT.26.14
reference: Acts 26:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: hi
  text: जब हम सब भूमि पर गिर पड़े, तब मैंने एक आवाज़ सुनी, जो मुझसे इब्रानी भाषा में[a] कह रही थी, “शाऊल, शाऊल, तू मुझे क्यों सताता है? अंकुशों पर लात मारना तेरे लिए कठिन है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “अरामी भाषा में”; यूनानी अभिव्यक्ति का शाब्दिक अर्थ “इब्रानी भाषा/बोली में” है।
    reason: alternative_reading
  - marker: b
    text: 'यह एक कहावत है: बोलनेवाले का विरोध करते रहने से विरोध करनेवाला स्वयं ही चोट खाता है।'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: जब हम सब भूमि पर गिर पड़े
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य में व्यक्त किया गया है। πάντων और ἡμῶν का ‘हम सब’ तथा पूर्ण हुई पूर्ववर्ती क्रिया का भाव ‘गिर पड़े’ से सुरक्षित है।
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: मैंने एक आवाज़ सुनी, जो मुझसे ... कह रही थी
  rationale: प्रत्यक्ष वचन के कारण φωνή का अर्थ ‘आवाज़’ है, केवल कोई ध्वनि नहीं। कृदन्त λέγουσαν और πρός με को प्रवाहपूर्ण हिन्दी में सम्बद्ध उपवाक्य द्वारा व्यक्त किया गया है।
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: इब्रानी भाषा में
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति के सीधे अर्थ को रखता है। प्रेरितों के काम में इसे अरामी के अर्थ में समझने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: Σαοὺλ Σαούλ
  choice: शाऊल, शाऊल
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है और सम्बोधन की पुनरुक्ति यथावत रखी गई है।
- source_word: τί με διώκεις;
  choice: तू मुझे क्यों सताता है?
  rationale: διώκω का यहाँ अर्थ शत्रुतापूर्वक पीछा करना या उत्पीड़ित करना है। सीधे व्यक्तिगत सम्बोधन के लिए ‘तू’ हिन्दी में प्रसंगानुकूल और प्रभावशाली है।
- source_word: σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: अंकुशों पर लात मारना तेरे लिए कठिन है
  rationale: कहावत की ठोस छवि को बनाए रखते हुए σκληρόν σοι को ‘तेरे लिए कठिन’ और κέντρα को पशु हाँकने के नुकीले ‘अंकुशों’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ का भाषायी संकेत
  choice: इब्रानी भाषा में
  alternative: अरामी भाषा में
  rationale: यूनानी पाठ स्पष्ट रूप से ‘इब्रानी’ शब्द का प्रयोग करता है; इसलिए वही मुख्य पाठ में रखा गया है। पहली सदी के यहूदी भाषायी प्रयोग में इससे अरामी अभिप्रेत होने की सम्भावना को निश्चित बनाकर आरोपित करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: यीशु और शाऊल के बीच एकवचन सम्बोधन
  choice: तू / तेरे
  alternative: तुम / तुम्हारे
  rationale: यूनानी में एकवचन सम्बोधन है। इस तीव्र, प्रत्यक्ष दिव्य सम्बोधन में ‘तू’ स्वाभाविक है और अनादर सूचित करना आवश्यक नहीं; इससे वचन की निकटता और धार बनी रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘भूमि’, ‘इब्रानी’ और ‘अंकुश’ पाठ की ऐतिहासिक तथा रूपकात्मक गरिमा बनाए रखते हैं; वाक्य-संरचना को हिन्दी के स्वाभाविक प्रवाह के अनुसार ढाला गया है।
