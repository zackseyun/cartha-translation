  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: hi
  text: जब वह अपने बचाव में ये बातें कह रहा था, तब फ़ेस्तुस ने ऊँची आवाज़ में कहा, “पौलुस, तुम पागल हो! तुम्हारा बहुत अधिक अध्ययन तुम्हें पागलपन की ओर धकेल रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: अपने बचाव में ये बातें कह ही रहा था
  rationale: यह जनिटिव ऐब्सल्यूट समकालीन क्रिया व्यक्त करता है, और ἀπολογέομαι यहाँ न्यायिक अथवा औपचारिक बचाव देने के अर्थ में है। यह रूप हिन्दी में प्रसंग और जारी क्रिया दोनों को स्वाभाविक ढंग से रखता है।
- source_word: μεγάλῃ τῇ φωνῇ
  choice: ऊँची आवाज़ में
  rationale: दत्तिव पदबंध रीति बताता है; यह चयन फ़ेस्तुस के जोरदार हस्तक्षेप को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φησιν
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथन-शैली में भूतकाल अधिक स्वाभाविक है और अर्थ की कोई हानि नहीं होती।
- source_word: Μαίνῃ
  choice: तुम पागल हो गए हो
  rationale: μαίνομαι मानसिक संतुलन खोने अथवा पागल होने का आरोप व्यक्त करता है। यह हिन्दी में सीधा, वर्तमान और प्रबल है।
- source_word: τὰ πολλά ... γράμματα
  choice: तुम्हारी बहुत विद्या
  rationale: γράμματα यहाँ अक्षरों या दस्तावेज़ों के बजाय अध्ययन, शिक्षा अथवा विद्या का बोध कराता है। ‘बहुत विद्या’ मूल की मात्रा और अर्थ दोनों को संक्षेप में बनाए रखती है।
- source_word: εἰς μανίαν
  choice: पागलपन की ओर
  rationale: εἰς किसी अवस्था की दिशा या परिणति दर्शाता है; ‘की ओर’ उस गतिशील अर्थ को सुरक्षित रखता है।
- source_word: περιτρέπει
  choice: ले जा रही है
  rationale: यहाँ क्रिया किसी को एक अवस्था की ओर मोड़ने या पहुँचा देने का भाव रखती है। ‘ले जा रही है’ हिन्दी में कारण और जारी प्रक्रिया दोनों व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। फ़ेस्तुस के कथन की तीव्रता बनाए रखने के लिए विस्मयादिबोधक चिह्न रखा गया है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
