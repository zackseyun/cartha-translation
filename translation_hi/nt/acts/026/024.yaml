revisions:
- from: जब वह अपने बचाव में ये बातें कह ही रहा था, तब फ़ेस्तुस ने ऊँची आवाज़ में कहा, “पौलुस, तुम पागल हो गए हो! तुम्हारी बहुत विद्या तुम्हें पागलपन की ओर ले जा रही है।”
  to: जब वह अपने बचाव में ये बातें कह रहा था, तब फ़ेस्तुस ने ऊँची आवाज़ में कहा, “पौलुस, तुम पागल हो! तुम्हारा बहुत अधिक अध्ययन तुम्हें पागलपन की ओर धकेल रहा है।”
  rationale: 'The revision removes added emphasis, represents Festus’s present-tense accusation directly, and improves natural modern Hindi while preserving the Greek’s forensic, emphatic, and resultative elements. No footnote is necessary: the translation follows the contextual ‘learning/study’ sense reflected in the English audit trail, without asserting a disputed textual reading.'
