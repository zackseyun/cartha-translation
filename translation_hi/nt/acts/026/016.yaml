source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: hi
  text: पर उठ और अपने पैरों पर खड़ा हो जा; क्योंकि मैं तुझे इसी उद्देश्य से दिखाई दिया कि तुझे सेवक और गवाह ठहराऊँ—उन बातों का जिनमें तूने मुझे देखा है, और उन बातों का जिनमें मैं तुझे दिखाई दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य-रचना संक्षिप्त है। अधिक शाब्दिक रूप से: “जिन बातों में तूने मुझे देखा है और जिन बातों में मैं तुझे दिखाई दूँगा।” पहले खंड को “जो कुछ तूने मेरे विषय में देखा है” भी समझा जा सकता है; दूसरे खंड में यीशु के भविष्य में पौलुस को दिखाई देने की भाषा बनी रहती है।'
    reason: मूल की संक्षिप्त संबंधवाचक रचना और पहले खंड की संभावित व्याख्या को दिखाता है, बिना भविष्य के ‘मैं तुझे दिखाई दूँगा’ को ‘मैं तुझे कुछ दिखाऊँगा’ में बदले।
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: उठ और अपने पैरों पर खड़ा हो जा
  rationale: दोनों आज्ञाओं और दृश्य शारीरिक भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: क्योंकि मैं तुझे इसी उद्देश्य से दिखाई दिया हूँ
  rationale: εἰς τοῦτο का प्रयोजन-सूचक बल और ὤφθην का प्रकट होकर दिखाई देने का भाव सुरक्षित रहता है।
- source_word: προχειρίσασθαί σε
  choice: तुझे ... ठहराऊँ
  rationale: यह औपचारिक नियुक्ति या दायित्व सौंपे जाने का भाव व्यक्त करता है; केवल चुनाव का नहीं।
- source_word: ὑπηρέτην
  choice: सेवक
  rationale: अधीन रहकर सेवा करने वाले नियुक्त सहायक का सुलभ और गरिमापूर्ण हिन्दी रूप है; यह δοῦλος की विशिष्ट दास-शब्दावली को नहीं मिलाता।
- source_word: μάρτυρα
  choice: गवाह
  rationale: देखी और प्रकट की गई बातों की साक्षी देने वाले व्यक्ति के लिए सामान्य और सटीक आधुनिक हिन्दी शब्द है।
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: उन बातों ... जिनमें तूने मुझे देखा है और जिनमें मैं तुझे दिखाई दूँगा
  rationale: मूल की संक्षिप्त और कुछ असामान्य संबंधवाचक रचना को जानबूझकर पूरी तरह नहीं खोलता तथा दोनों खंडों में देखने/दिखाई देने की भाषा बनाए रखता है।
theological_decisions:
- issue: ὤφθην और ὀφθήσομαί में प्रकाशन का स्वरूप
  choice: दोनों को व्यक्तिगत रूप से ‘दिखाई दिया/दिखाई दूँगा’ कहा गया है।
  alternative: ‘मैंने अपने आपको प्रकट किया/करूँगा’ अथवा ‘मैं तुझे दिखाऊँगा’
  rationale: दिखाई देने की भाषा पुनर्जीवित यीशु के पौलुस के सामने प्रकट होकर उसे नियुक्त करने के वस्तुगत भाव को सुरक्षित रखती है, पर प्रकट होने की विधि के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ती।
- issue: ὧν के साथ संक्षिप्त यूनानी संबंधवाचक रचना
  choice: ‘उन बातों ... जिनमें’ के द्वारा मूल की असामान्यता और खुलापन कुछ हद तक बनाए रखा गया है।
  alternative: ‘जो कुछ तूने मेरे विषय में देखा है और जो कुछ मैं तुझे दिखाऊँगा’
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह दूसरे ὀφθήσομαί को ‘दिखाने’ में बदलकर व्यक्तिगत प्रकट होने के भाव को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रत्यक्ष संबोधन के कारण एकवचन ‘तू/तुझे’ रखा गया है। शैली गरिमापूर्ण पर सामान्य पाठक के लिए सुलभ है। ‘खड़ा हो जा’ तत्काल आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
