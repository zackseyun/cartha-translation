  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। ‘दुःख उठाना होगा’ भविष्यवाणी में नियति/आवश्यकता को सहजता से व्यक्त करता है। ‘मृतकों में से जी उठनेवालों में पहला’ मूल की संक्षिप्तता को कुछ खोलकर अस्पष्ट सम्बन्ध स्पष्ट करता है, जबकि उसकी धर्मवैज्ञानिक व्यापकता को अनिर्णीत रखता है।
