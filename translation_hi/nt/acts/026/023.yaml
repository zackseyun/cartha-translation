  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: hi
  text: कि मसीह को दुःख उठाना होगा[a] और वह, मृतकों में से जी उठने वाला पहला होकर, लोगों[b] और गैर-यहूदियों[c], दोनों को ज्योति की घोषणा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीस्त’। यूनानी उपाधि Χριστός का अनुवाद यहाँ ‘मसीह’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: यहाँ ‘लोगों’ से सम्भवतः यहूदी लोग अभिप्रेत हैं, जिनका उल्लेख ‘गैर-यहूदियों’ से अलग किया गया है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘जातियों’ या ‘राष्ट्रों’। इस प्रसंग में इसका अर्थ गैर-यहूदी लोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: दुःख उठाना होगा
  rationale: विशेषण का भाव यहाँ भविष्यवाणी के सार में मसीह के दुःख उठाने की नियति/आवश्यकता बताता है; यह स्वाभाविक हिन्दी है और दार्शनिक शब्दावली से बचता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός भविष्यद्वाणी में अभिषिक्त उद्धारकर्ता की उपाधि है; हिन्दी में प्रचलित शीर्षक ‘मसीह’ उपयुक्त है।
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: मृतकों में से जी उठनेवालों में पहला होकर
  rationale: यह रूप पुनरुत्थान में मसीह की प्राथमिकता को स्पष्ट रखता है, पर पहले हुए अस्थायी जीवन-प्रत्यावर्तनों के विषय में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- source_word: φῶς
  choice: ज्योति
  rationale: मूल बाइबलीय रूपक को बनाए रखता है, जिसमें प्रकाशन, उद्धार और आशा के अर्थ समाए रह सकते हैं।
- source_word: μέλλει καταγγέλλειν
  choice: संदेश सुनाएगा
  rationale: μέλλω और infinitive का भाव यहाँ भविष्य अथवा नियत कार्य है; καταγγέλλω सार्वजनिक घोषणा को व्यक्त करता है। ‘ज्योति का संदेश सुनाएगा’ हिन्दी में रूपक और घोषणा—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ τε λαῷ
  choice: प्रजा
  rationale: ἔθνεσιν के साथ विरोध में λαός सम्भवतः इस्राएली/यहूदी प्रजा को सूचित करता है। मुख्य पाठ अपेक्षाकृत अनिर्दिष्ट मूल शब्द को बनाए रखता है और टिप्पणी उसका सम्भावित संदर्भ स्पष्ट करती है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: यहूदी प्रजा के साथ स्पष्ट विरोध में ἔθνη का प्रसंगगत अर्थ अन्यजाति लोग है; आधुनिक सामान्य हिन्दी में ‘गैर-यहूदी’ अधिक तुरंत समझ आता है।
- source_word: τε ... καὶ
  choice: दोनों को
  rationale: यूनानी सहसंबंधी रचना के दोनों प्राप्तकर्ता समूहों को हिन्दी में स्पष्ट और सहज ढंग से जोड़ता है।
theological_decisions:
- issue: पुनरुत्थान में ‘पहला’ होने का आशय
  choice: मृतकों में से जी उठनेवालों में पहला
  alternative: अन्तिम पुनरुत्थान का प्रथम फल; फिर कभी न मरने के लिए जी उठनेवाला पहला
  rationale: मूल पाठ केवल पुनरुत्थान में प्राथमिकता व्यक्त करता है; मुख्य पाठ उस दावे को सुरक्षित रखता है और उससे आगे की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: ‘प्रजा’ का दायरा
  choice: मुख्य पाठ में ‘प्रजा’, टिप्पणी में सम्भावित यहूदी संदर्भ
  alternative: यहूदी प्रजा; इस्राएल
  rationale: λαός स्वयं अनिर्दिष्ट है, यद्यपि ‘गैर-यहूदियों’ के साथ विरोध उसके इस्राएली/यहूदी संदर्भ की ओर दृढ़ संकेत करता है।
