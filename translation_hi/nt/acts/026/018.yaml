source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: hi
  text: उनकी आँखें खोलने के लिए, ताकि वे अंधकार से प्रकाश की ओर और शैतान के अधिकार[a] से परमेश्वर की ओर फिरें, और पापों की क्षमा तथा उन लोगों के साथ विरासत में हिस्सा पाएँ जो मुझ पर विश्वास के द्वारा पवित्र किए गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शैतान की सामर्थ्य’ अथवा ‘शैतान का प्रभुत्व’। यूनानी शब्द अधिकार, शासन-शक्ति या प्रभुत्व-क्षेत्र का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्र बनाए गए हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: उनकी आँखें खोलने के लिए
  rationale: आँखें खोलने के ठोस रूपक को बनाए रखता है और उसे केवल ‘समझ देने’ के रूप में सीमित नहीं करता।
- source_word: τοῦ ἐπιστρέψαι
  choice: ताकि वे ... फिरें
  rationale: उद्देश्य व्यक्त करने वाले infinitive को स्वाभाविक हिन्दी में प्रस्तुत करता है और मन-परिवर्तन की दिशा का भाव सुरक्षित रखता है।
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: अन्धकार से ज्योति की ओर
  rationale: मूल रूपकात्मक विरोध को स्पष्ट और गरिमापूर्ण हिन्दी में ज्यों का त्यों रखता है।
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: शैतान के अधिकार
  rationale: ἐξουσία यहाँ शासन करने के अधिकार या प्रभाव-क्षेत्र का संकेत दे सकता है; ‘अधिकार’ इसका सीधा अर्थ है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἐπὶ τὸν θεόν
  choice: परमेश्वर की ओर
  rationale: गति और अभिमुखता का भाव व्यक्त करता है तथा समानान्तर ‘ज्योति की ओर’ के साथ स्वाभाविक बैठता है।
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा
  rationale: यह प्रचलित, स्पष्ट और समकालीन हिन्दी अभिव्यक्ति है।
- source_word: κλῆρον
  choice: विरासत में भाग
  rationale: κλῆρος के आवंटित भाग और परमेश्वर के लोगों की विरासत—दोनों भावों को स्वाभाविक हिन्दी में साथ रखता है।
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: उन लोगों के बीच ... जो ... पवित्र किए गए हैं
  rationale: पूर्ण निष्क्रिय कृदन्त के उस कार्य और उसके बने रहने वाले परिणाम, दोनों को व्यक्त करता है।
- source_word: πίστει τῇ εἰς ἐμέ
  choice: मुझ पर विश्वास के द्वारा
  rationale: πίστις को ‘विश्वास’ और εἰς ἐμέ को उसके व्यक्तिगत लक्ष्य के रूप में स्पष्ट रखता है; instrumental dative को ‘के द्वारा’ से व्यक्त किया गया है।
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ का सम्बन्ध और अर्थ
  choice: मुझ पर विश्वास के द्वारा पवित्र किए गए हैं
  alternative: मुझ पर भरोसे के द्वारा पवित्र किए गए हैं
  rationale: यहाँ εἰς ἐμέ विश्वास के लक्ष्य को स्पष्ट करता है। ‘विश्वास’ मानक और व्यापक हिन्दी धार्मिक शब्द है, पर ‘भरोसा’ भी सम्भव अर्थ है।
- issue: κλῆρος का उद्धार-सन्दर्भ में अर्थ
  choice: विरासत में भाग
  alternative: एक भाग / विरासत
  rationale: अकेला ‘विरासत’ वाचा और भावी प्रतिफल का भाव देता है, जबकि ‘भाग’ आवंटन का; संयुक्त अभिव्यक्ति मूल शब्द की अर्थ-व्याप्ति को बेहतर सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘ज्योति’ और ‘परमेश्वर’ गरिमापूर्ण बाइबलीय शैली बनाए रखते हैं, जबकि वाक्यरचना साधारण पाठकों के लिए स्पष्ट रखी गई है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से असंगत स्थानों पर थे; हिन्दी मसौदे में [a] को ‘अधिकार’ और [b] को ‘पवित्र किए गए हैं’ के बाद रखा गया है।
