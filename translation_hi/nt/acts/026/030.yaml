lexical_decisions:
- source_word: Ἀνέστη
  choice: उठ खड़ा हुआ
  rationale: यहाँ ἀνίστημι का अर्थ अपने आसन से शारीरिक रूप से उठना है; ‘उठ खड़ा हुआ’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: τε
  choice: तब … भी
  rationale: पहला τε कथा की अगली क्रिया को पिछले प्रसंग से जोड़ता है, जिसे ‘तब’ व्यक्त करता है; दूसरा τε समन्वित सूची में ‘भी’ के द्वारा स्वाभाविक हिन्दी में व्यक्त हुआ है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: मूल पाठ व्यक्तिगत नाम के बजाय पदवी का प्रयोग करता है, इसलिए पदवी ही रखी गई है।
- source_word: ὁ ἡγεμὼν
  choice: राज्यपाल
  rationale: प्रेरितों के काम के इस रोमी प्रशासनिक संदर्भ में ἡγεμών के लिए ‘राज्यपाल’ सटीक और सहज पदनाम है।
- source_word: Βερνίκη
  choice: बिरनीके
  rationale: यूनानी नाम Βερνίκη का निकट देवनागरी लिप्यंतरण ‘बिरनीके’ है; प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: उनके साथ बैठे लोग
  rationale: यह चयन साथ बैठने की मूल छवि को सुरक्षित रखता है और समूह की सामाजिक भूमिका के बारे में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: καὶ
  choice: और
  rationale: बार-बार आए καί सूची के व्यक्तियों और समूहों को जोड़ते हैं; हिन्दी में ‘और’ तथा अंतिम ‘भी’ इस संयोजन को स्वाभाविक रूप से व्यक्त करते हैं।
