lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: वहाँ से हट जाने के बाद
  rationale: अओरिस्ट कृदंत मुख्य बातचीत से पहले सभा-स्थल से अलग हो जाने की क्रिया बताता है; यह हिंदी में स्वाभाविक और क्रम-स्पष्ट है।
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: वे आपस में कहने लगे
  rationale: अपूर्ण काल जारी पारस्परिक बातचीत का संकेत देता है। ‘आपस में कहने लगे’ इसे स्वाभाविक हिंदी में व्यक्त करता है, बिना इसे केवल एक बार कही गई बात बनाने के।
- source_word: Οὐδὲν ... ἄξιον
  choice: ऐसा कुछ नहीं ... जो ... के योग्य हो
  rationale: यह रचना स्पष्ट करती है कि उस मनुष्य का कोई कार्य बताए गए दंडों के योग्य नहीं है।
- source_word: θανάτου ἢ δεσμῶν
  choice: मृत्युदंड या कैद
  rationale: न्यायिक संदर्भ में θάνατος मृत्युदंड और δεσμοί बंधन अथवा कारावास को सूचित करता है; मुख्य पाठ में ‘कैद’ आधुनिक पाठक के लिए आशय स्पष्ट करता है।
- source_word: τι πράσσει
  choice: ऐसा कुछ नहीं कर रहा
  rationale: वर्तमान काल और πράσσω के व्यापक अर्थ को बनाए रखता है; ‘अपराध कर रहा’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ὁ ἄνθρωπος οὗτος
  choice: यह मनुष्य
  rationale: पौलुस की ओर संकेत करने वाले पुल्लिंग एकवचन का सीधा और गरिमापूर्ण अनुवाद।
