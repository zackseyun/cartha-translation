  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: hi
  text: जिसे प्राप्त करने की आशा हमारा बारह-गोत्रीय समुदाय रखता है, जो रात-दिन बड़ी लगन से परमेश्वर की सेवा करता है। हे राजा, इसी आशा के विषय में मुझ पर यहूदियों द्वारा आरोप लगाया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν
  choice: जिसे प्राप्त करने
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद की प्रतिज्ञा की ओर संकेत करता है, और εἰς लक्ष्य की दिशा प्रकट करता है। हिंदी में यह प्रयोग उस प्रतिज्ञा को आशा के लक्ष्य के रूप में स्वाभाविक ढंग से रखता है।
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: हमारे बारहों गोत्र
  rationale: यूनानी पद सामूहिक एकवचन है और बारह गोत्रों वाले इस्राएली समुदाय को दर्शाता है। ‘हमारे बारहों गोत्र’ सहज हिंदी है; सामूहिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν ἐκτενείᾳ
  choice: लगन से
  rationale: यह पद तीव्रता, निष्ठा और निरंतर तत्परता का भाव देता है। ‘लगन से’ सामान्य आधुनिक हिंदी में यही भाव संक्षेप में व्यक्त करता है।
- source_word: νύκτα καὶ ἡμέραν
  choice: रात-दिन
  rationale: यूनानी शब्दक्रम और निरंतरता के मुहावरेदार अर्थ दोनों को सुरक्षित रखता है।
- source_word: λατρεῦον
  choice: परमेश्वर की सेवा करते हैं
  rationale: यह क्रिया परमेश्वर को अर्पित धार्मिक सेवा या आराधना के लिए प्रयुक्त होती है। संदर्भ से निहित कर्म ‘परमेश्वर’ को स्पष्ट करना हिंदी में अर्थ को सहज बनाता है।
- source_word: ἐλπίζει καταντῆσαι
  choice: प्राप्त करने की आशा ... रखते हैं
  rationale: καταντάω यहाँ किसी लक्ष्य तक पहुँचने या उसे प्राप्त करने का अर्थ देता है। ‘प्राप्त करने की आशा रखना’ प्रतिज्ञा के संदर्भ में स्वाभाविक है।
- source_word: περὶ ἧς ἐλπίδος
  choice: इसी आशा के विषय में
  rationale: περί के संबंधसूचक अर्थ को निकटता से रखता है और पहले उल्लिखित आशा से स्पष्ट संबंध जोड़ता है।
- source_word: ἐγκαλοῦμαι
  choice: मुझ पर आरोप लगाते हैं
  rationale: न्यायिक संदर्भ में निष्क्रिय यूनानी क्रिया का यह स्वाभाविक हिंदी रूप है।
- source_word: ὑπὸ Ἰουδαίων
  choice: यहूदी
  rationale: मूल में यह कानूनी संदर्भ में पौलुस के यहूदी आरोपकर्ताओं का वर्णन है। मुख्य पाठ सीधा अनुवाद रखता है और पादटिप्पणी स्पष्ट करती है कि आशय सभी यहूदियों से नहीं है।
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: सम्बोधन कारक की औपचारिकता और पौलुस के सीधे सम्बोधन को सुरक्षित रखता है।
theological_decisions:
- issue: λατρεῦον का निहित कर्म
  choice: ‘परमेश्वर की सेवा’ कहकर निहित कर्म स्पष्ट किया गया
  alternative: ‘सेवा करते हैं’ या ‘आराधना करते हैं’
  rationale: यद्यपि यूनानी वाक्यांश में परमेश्वर का नाम स्पष्ट रूप से नहीं है, इस्राएल की धार्मिक सेवा के संदर्भ में क्रिया का लक्ष्य परमेश्वर है। इसे स्पष्ट करना नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: आशा का संदर्भ
  choice: आशा को पिछले पद की परमेश्वर की प्रतिज्ञा से जोड़ा गया, पर इस पद में उसकी विषयवस्तु को और स्पष्ट नहीं किया गया
  alternative: मुख्य पाठ में पुनरुत्थान को स्पष्ट कर देना
  rationale: निकट संदर्भ आशा को परमेश्वर की प्रतिज्ञा तथा पौलुस के व्यापक पुनरुत्थान-विषयक बचाव से जोड़ता है, पर यह पद स्वयं उस विषय को दोहराता नहीं। इसलिए मूल की अंतर्पाठीयता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: ὑπὸ Ἰουδαίων का विस्तार
  choice: ‘यहूदी’ रखा गया और कानूनी-संदर्भगत सीमा पादटिप्पणी में बताई गई
  alternative: ‘कुछ यहूदियों’ या ‘यहूदी अगुओं’ को मुख्य पाठ में रखना
  rationale: मूल में ‘कुछ’ या ‘अगुए’ नहीं है। साथ ही यह वाक्य सभी यहूदियों के बारे में सार्वभौमिक कथन नहीं, बल्कि पौलुस के आरोपकर्ताओं का संदर्भगत वर्णन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लगन से’, ‘रात-दिन’ और ‘मुझ पर आरोप लगाते हैं’ स्वाभाविक हिंदी प्रयोग हैं। ‘हे राजा’ न्यायिक भाषण की औपचारिक सम्बोधन-शैली को बनाए रखता है।
