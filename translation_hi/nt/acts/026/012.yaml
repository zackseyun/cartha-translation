  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: hi
  text: इसी सिलसिले में[a], मैं प्रधान याजकों से अधिकार और आदेश लेकर दमिश्क जा रहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जिन बातों में”; यह पौलुस के पहले बताए गए कामों और इरादों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: इसी सिलसिले में
  rationale: यह पदबंध पिछली आयत में बताए गए पौलुस के कामों और इरादों की ओर संकेत करता है। यह हिंदी में उस संबंध को स्वाभाविक रूप से बनाए रखता है, बिना ‘जिन बातों में’ जैसे असहज शाब्दिक अनुवाद के।
- source_word: πορευόμενος
  choice: मैं … जा रहा था
  rationale: वर्तमान कृदंत उस समय जारी यात्रा को व्यक्त करता है; हिंदी में ‘जा रहा था’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: εἰς τὴν Δαμασκὸν
  choice: दमिश्क जा रहा था
  rationale: नगर की दिशा में गति के लिए हिंदी में ‘दमिश्क जा रहा था’ स्वाभाविक रूप है।
- source_word: μετ’ ἐξουσίας
  choice: अधिकार लेकर
  rationale: ἐξουσία यहाँ सामर्थ्य नहीं, बल्कि सौंपे गए वैधानिक अधिकार को दर्शाता है।
- source_word: ἐπιτροπῆς
  choice: आदेश लेकर
  rationale: यह औपचारिक रूप से सौंपे गए कार्य या निर्देश को दर्शाता है। ‘आदेश’ साधारण हिंदी में स्पष्ट है और ‘अधिकार’ से अर्थगत भेद भी बनाए रखता है।
- source_word: τῆς τῶν ἀρχιερέων
  choice: प्रधान याजकों से
  rationale: सम्बन्धकारक यहाँ अधिकार और आदेश के स्रोत को व्यक्त करता है; हिंदी में ‘से’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन इस पद में महायाजकीय नेतृत्व-वर्ग को दर्शाता है, न कि एक ही समय के अनेक पदासीन महायाजकों को; ‘प्रधान याजक’ प्रचलित और उपयुक्त पद है।
