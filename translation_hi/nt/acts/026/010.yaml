  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: hi
  text: और यरूशलेम में मैंने ऐसा ही किया। प्रधान याजकों से अधिकार पाकर मैंने बहुत-से पवित्र जनों[a] को जेलों में बंद कर दिया; और जब उन्हें मार डाला जाता था, तो मैंने भी उनके विरुद्ध अपना मत दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जन’ से आशय परमेश्वर के पवित्र लोग, अर्थात यीशु में विश्वास करने वाले लोग हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, ‘मैंने एक मत दिया।’ शब्द ψῆφος मूलतः मतदान में प्रयुक्त कंकड़ी और इस प्रकार ‘मत’ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: मैंने ऐसा ही किया
  rationale: यह वाक्यांश पिछले पद में बताए गए विरोध के काम की ओर संकेत करता है। ‘ऐसा ही किया’ यूनानी के पुनःसंदर्भ और καί के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: स्थान-नाम का मानक आधुनिक हिन्दी रूप।
- source_word: πολλούς τε τῶν ἁγίων
  choice: बहुत-से पवित्र जनों
  rationale: ἅγιοι यीशु के विश्वासियों, अर्थात परमेश्वर के लिए अलग किए गए लोगों, को दर्शाता है। ‘पवित्र जन’ बाद की औपचारिक संत-उपाधि का आभास दिए बिना मूल अर्थ बनाए रखता है।
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: जेलों में बंद कर दिया
  rationale: यह επιλογή κατακλείω के बंद करके रखने के अर्थ और φυλακαῖς के बहुवचन—दोनों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: प्रधान याजकों से अधिकार पाकर
  rationale: कृदन्तीय वाक्यांश पौलुस के कार्य करने का आधार बताता है। ‘अधिकार’ ἐξουσία का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: जब उन्हें मार डाला जाता था
  rationale: निष्क्रिय कृदन्त को कालसूचक उपवाक्य के रूप में रखा गया है। ‘मार डाला जाता था’ मृत्यु दिए जाने का अर्थ बताता है, पर किसी विशिष्ट कानूनी प्रक्रिया को अनावश्यक रूप से नहीं जोड़ता।
- source_word: κατήνεγκα ψῆφον
  choice: मैंने भी उनके विरुद्ध अपना मत दिया
  rationale: ψῆφος मूलतः मतदान में प्रयुक्त कंकड़ी और फिर ‘मत’ को दर्शाता है। हिन्दी मुहावरे में ‘मत दिया’ स्वाभाविक है; ‘उनके विरुद्ध’ प्रसंग में निहित विरोधी दिशा को स्पष्ट करता है, जबकि औपचारिक संस्था का स्वरूप अनिर्धारित रहता है।
theological_decisions:
- issue: प्रेरितों के काम में ἅγιοι का आशय
  choice: ‘पवित्र जन’—यीशु में विश्वास करने वाले समुदाय के सदस्य
  alternative: ‘संत’ अथवा ‘परमेश्वर के लोग’
  rationale: यह शब्द पूरे विश्वासी समुदाय के लिए है, केवल किसी विशिष्ट या बाद में मान्यता पाए वर्ग के लिए नहीं। ‘पवित्र जन’ मूल शब्द का धार्मिक अर्थ और सामुदायिक व्यापकता दोनों बनाए रखता है।
- issue: κατήνεγκα ψῆφον का बल
  choice: उनके विरुद्ध अपना मत देना
  alternative: उनकी मृत्यु से केवल सहमति जताना
  rationale: वाक्यांश मतदान की ठोस भाषा का प्रयोग करता है। अनुवाद व्यक्तिगत सहभागिता को सुरक्षित रखता है, लेकिन यह तय नहीं करता कि मतदान किस संस्था या औपचारिक प्रक्रिया में हुआ था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जेलों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘प्रधान याजक’, ‘पवित्र जन’ और ‘मत’ मूल के धार्मिक तथा न्यायिक संदर्भ को बनाए रखते हैं। यूनानी τε…τε की जोड़ने वाली संरचना को ‘और…तो मैंने भी’ से व्यक्त किया गया है; इसे अनिवार्य रूप से ‘न केवल…बल्कि’ बनाकर अधिक तीव्र नहीं किया गया।
