id: ACT.26.25
reference: Acts 26:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: hi
  text: पर पौलुस ने कहा, “महामहिम फेस्तुस[b], मैं पागल[a] नहीं हूँ, बल्कि सत्य और विवेक[c] की बातें कह रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विक्षिप्त।”
    reason: lexical_alternative
  - marker: b
    text: “महामहिम” किसी उच्च पदाधिकारी के लिए प्रयुक्त औपचारिक सम्मानसूचक संबोधन है।
    reason: cultural_note
  - marker: c
    text: या “संयत बुद्धि” अथवा “स्वस्थ मन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: पिछले पद में फेस्तुस के आरोप के साथ स्पष्ट विरोध दिखाता है और स्वाभाविक हिन्दी कथन में उपयुक्त है।
- source_word: μαίνομαι
  choice: मैं पागल नहीं हूँ
  rationale: यह क्रिया पागल या विक्षिप्त होने का अर्थ देती है; यह सीधा, आधुनिक और प्रसंगानुकूल अनुवाद है।
- source_word: φησίν
  choice: ने कहा
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है, जिसे हिन्दी कथा-शैली में स्वाभाविक रूप से भूतकाल में व्यक्त किया गया है।
- source_word: κράτιστε
  choice: महामहिम
  rationale: उच्च पदाधिकारी को संबोधित करने के लिए प्रयुक्त औपचारिक सम्मानसूचक शब्द का गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ἀληθείας
  choice: सत्य
  rationale: सम्बन्धकारक रचना का भाव ‘सत्य की बातें’ में सुरक्षित रहता है और पौलुस के कथन की सच्चाई पर बल देता है।
- source_word: σωφροσύνης
  choice: विवेक
  rationale: यह शब्द स्वस्थ बुद्धि, आत्मसंयम और समझ-बूझ से बोलने का भाव समेटता है; ‘विवेक’ आधुनिक हिन्दी में इस प्रसंग का संक्षिप्त और स्वाभाविक निर्वाह करता है।
- source_word: ῥήματα
  choice: बातें
  rationale: बहुवचन संज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ ‘शब्द’ की अपेक्षा ‘बातें’ मौखिक कथन के लिए अधिक सहज है।
- source_word: ἀποφθέγγομαι
  choice: कह रहा हूँ
  rationale: यह बोलने या स्पष्ट रूप से व्यक्त करने को दर्शाता है; वर्तमान प्रसंग में सहज हिन्दी रखते हुए यूनानी वर्तमान काल को सुरक्षित करता है।
theological_decisions:
- issue: σωφροσύνης में मानसिक स्वस्थता और नैतिक संयम—दोनों की अर्थछाया
  choice: विवेक
  alternative: संयत बुद्धि; स्वस्थ मन
  rationale: प्रसंग में फेस्तुस के पागलपन के आरोप का उत्तर प्रमुख है, पर शब्द में आत्मसंयम की अर्थछाया भी है। मुख्य पाठ में ‘विवेक’ दोनों को कुछ सीमा तक खुला रखता है और पादटिप्पणी विकल्पों को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। फेस्तुस के लिए औपचारिक राजकीय संबोधन बनाए रखा गया है, जबकि पौलुस का उत्तर सीधा और सामान्य पाठक के लिए सहज है।
