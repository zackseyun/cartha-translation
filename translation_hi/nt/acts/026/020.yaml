  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: hi
  text: बल्कि मैंने पहले दमिश्क के लोगों को, फिर यरूशलेम में और यहूदिया के पूरे प्रदेश में, और गैर-यहूदियों[a] को यह संदेश सुनाया कि वे मन फिराएँ, परमेश्वर की ओर मुड़ें और मन फिराव के अनुरूप काम करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अन्यजातियों’। मूल शब्द का शाब्दिक अर्थ ‘जातियों’ भी हो सकता है; यहाँ इसका आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मन फिराव के योग्य काम’। मूल वाक्यांश ऐसे कामों को बताता है जो मन फिराव के अनुरूप हों या उससे मेल खाते हों।
    reason: lexical_alternative
lexical_decisions:
