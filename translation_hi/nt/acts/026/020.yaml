  rationale: स्थानवाचक पद के साथ बहुवचन संप्रदान वहाँ रहने वाले लोगों को दर्शाता है।
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: पहले दमिश्क के लोगों को, फिर यरूशलेम में
  rationale: यह प्रचार के क्रम और अगले स्थान के जुड़ने को सहज हिन्दी में व्यक्त करता है, यद्यपि यूनानी संयोजन संक्षिप्त है।
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: यहूदिया के पूरे प्रदेश में
  rationale: χώρα का भौगोलिक अर्थ ‘प्रदेश’ यहाँ व्यापक और स्वाभाविक है; इसे केवल ग्रामीण क्षेत्र तक सीमित नहीं किया गया।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों को
  rationale: यरूशलेम और यहूदिया के साथ विरोध में यह पद गैर-यहूदी लोगों को सूचित करता है; यह आधुनिक पाठक के लिए ‘अन्यजातियों’ से अधिक प्रत्यक्ष है।
- source_word: ἀπήγγελλον
  choice: मैंने ... यह संदेश सुनाया
  rationale: मिशनरी संदर्भ में क्रिया सार्वजनिक रूप से घोषणा करने का भाव रखती है; ‘संदेश सुनाया’ सहज हिन्दी में वही अर्थ देती है।
- source_word: μετανοεῖν
  choice: मन फिराएँ
  rationale: यह केवल खेद अनुभव करने के बजाय सोच और दिशा के परिवर्तन का भाव रखता है तथा अगले पद ‘परमेश्वर की ओर मुड़ें’ से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: परमेश्वर की ओर मुड़ें
  rationale: ἐπί के साथ यह परमेश्वर की दिशा में मुड़ने को व्यक्त करता है; ‘लौटें’ गैर-यहूदियों के विषय में अनावश्यक पूर्व-संबंध का संकेत दे सकता था।
- source_word: ἄξια τῆς μετανοίας ἔργα πράσσοντας
  choice: मन फिराव के योग्य काम करें
  rationale: यह मन फिराव के अनुरूप और उससे मेल खाने वाले आचरण को व्यक्त करता है तथा कामों और मन फिराव के संबंध को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के बनाए रखता है।
theological_decisions:
- issue: मन फिराव, परमेश्वर की ओर मुड़ने और कामों का संबंध
  choice: कामों को मन फिराव के योग्य आचरण के रूप में प्रस्तुत किया गया है।
  alternative: कामों को मन फिराव की संपूर्ण परिभाषा या परमेश्वर द्वारा स्वीकार किए जाने का अर्जित आधार मानना।
  rationale: यूनानी वाक्य में ‘मन फिराएँ’ और ‘परमेश्वर की ओर मुड़ें’ घोषित प्रत्युत्तर हैं, जबकि कृदंत उस मन फिराव के अनुरूप किए जाने वाले कामों को बताता है। अनुवाद संबंध को सुरक्षित रखता है, पर योग्यता या कारण के विषय में पाठ से आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, स्पष्ट और गरिमापूर्ण शैली रखी गई है। ‘मन फिराएँ’ और ‘मन फिराव’ मूल के क्रिया-संज्ञा संबंध को बनाए रखते हैं; ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है।
