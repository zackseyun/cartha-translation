  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: hi
  text: मैंने तो स्वयं यह समझा था कि मुझे यीशु नासरी[a] के नाम के विरोध में बहुत-से काम करने चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘नासरत के यीशु।’
    reason: ‘नासरी’ का वैकल्पिक, स्थान-सूचक अनुवाद।
lexical_decisions:
- source_word: Ἐγὼ
  choice: मैंने स्वयं
  rationale: यूनानी में स्पष्ट सर्वनाम बल देता है; ‘स्वयं’ पौलुस की अपनी पूर्व धारणा पर पड़े इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह पद पिछले कथन से निष्कर्ष और आगे की बात से संबंध जोड़ता है। μέν का हल्का बल हिन्दी में ‘स्वयं’ और वाक्य-विन्यास से व्यक्त होता है; अलग शब्द जोड़ना वाक्य को अस्वाभाविक बनाता।
- source_word: ἔδοξα ἐμαυτῷ
  choice: यह समझा था
  rationale: यह मुहावरा व्यक्ति की अपनी भीतरी धारणा या निर्णय को व्यक्त करता है। ‘समझा था’ सहज हिन्दी है, जबकि आत्मवाचक भाव ‘स्वयं’ से भी स्पष्ट है।
- source_word: πρὸς τὸ ὄνομα
  choice: नाम के विरोध में
  rationale: ἐναντία और πρὸς का संयुक्त प्रयोग विरोधी दिशा में किए गए कार्यों को दर्शाता है। ‘नाम’ को बनाए रखने से व्यक्ति, प्रतिष्ठा और अधिकार से जुड़े बाइबलीय मुहावरे की व्यापकता सुरक्षित रहती है।
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: यीशु नासरी
  rationale: ‘नासरी’ यीशु की नासरत से जुड़ी पहचान को संक्षिप्त, परिचित और उपाधिसदृश रूप में व्यक्त करता है।
- source_word: δεῖν
  choice: करने चाहिए
  rationale: यह पौलुस की उस समय की समझ में नैतिक या व्यावहारिक कर्तव्य-बोध बताता है; ‘चाहिए’ बाहरी अनिवार्यता थोपे बिना उस भाव को व्यक्त करता है।
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: विरोध में बहुत-से काम करने
  rationale: यह अनुवाद कार्यों की बहुलता और उनकी विरोधी प्रकृति दोनों को सुरक्षित रखता है, पर उन कार्यों का स्वरूप पाठ से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: यीशु के संबंध में ‘नाम’ का अर्थ
  choice: ‘नाम’ के बाइबलीय मुहावरे को बनाए रखा गया है।
  alternative: ‘यीशु के अधिकार’ या ‘यीशु के उद्देश्य’ के विरोध में
  rationale: मूल पाठ ‘नाम’ को किसी एक व्याख्यात्मक अर्थ तक सीमित नहीं करता। इसे ज्यों का त्यों रखने से यीशु के व्यक्ति, सार्वजनिक पहचान और अधिकार से जुड़े अर्थ खुले रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नाम के विरोध में’ शास्त्रीय मुहावरे को बचाते हुए स्पष्ट हिन्दी देता है।
