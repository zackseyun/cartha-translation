  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: hi
  text: अब, मेरी युवावस्था से मेरी जीवन-चर्या[a] कैसी रही है—जो आरम्भ से ही मेरे अपने लोगों के बीच और यरूशलेम में रही—यह सभी यहूदी जानते हैं।
  philosophy: optimal-equivalence
  footnotes:
