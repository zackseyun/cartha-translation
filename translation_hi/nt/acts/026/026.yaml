source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: hi
  text: क्योंकि राजा इन बातों के बारे में जानते हैं, और मैं उनसे बेझिझक होकर बात करता हूँ। मुझे विश्वास है कि इन बातों में से कोई भी बात उनकी नज़र से नहीं बची है,[a] क्योंकि यह किसी कोने में नहीं हुआ है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनमें से कोई भी बात उनकी दृष्टि से नहीं बची” अथवा “उनसे अनजानी नहीं रही।”
    reason: lexical_alternative
  - marker: b
    text: “किसी कोने में नहीं हुआ” का अर्थ है कि यह गुप्त या लोगों की नज़र से दूर नहीं हुआ।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: जानते हैं
  rationale: यह क्रिया ज्ञान और परिचय दोनों का भाव रखती है; राजा के प्रति सम्मानसूचक बहुवचन के साथ ‘जानते हैं’ स्वाभाविक और सीधा है।
- source_word: περὶ τούτων
  choice: इन बातों को
  rationale: हिन्दी में ‘इन बातों के विषय में जानते हैं’ की अपेक्षा यह अधिक स्वाभाविक है और विषय-संदर्भ को सुरक्षित रखता है।
- source_word: παρρησιαζόμενος
  choice: निडर होकर खुलकर
  rationale: यूनानी कृदंत निर्भीक, स्पष्ट और स्वतंत्र वाणी का भाव देता है; दोनों क्रियाविशेषण मिलकर इसकी अर्थ-व्याप्ति व्यक्त करते हैं।
- source_word: πρὸς ὃν ... λαλῶ
  choice: मैं उनसे ... बोल रहा हूँ
  rationale: राजा के प्रति सम्बोधित वाणी को आधुनिक सम्मानसूचक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λανθάνειν ... αὐτὸν
  choice: उनकी जानकारी से छिपी नहीं रही
  rationale: यह हिन्दी मुहावरा किसी बात के ध्यान या जानकारी से बच निकलने का आशय देता है और यूनानी अभिव्यक्ति के अर्थ को स्पष्ट रखता है।
- source_word: οὐ πείθομαι οὐθέν
  choice: मुझे विश्वास है कि ... कोई भी बात ... नहीं
  rationale: यूनानी में वक्ता की दृढ़ धारणा और नकारात्मक संरचना है; हिन्दी में यह रूप सहज है और उस निश्चितता को बनाए रखता है।
- source_word: πεπραγμένον
  choice: हुआ है
  rationale: इस प्रसंग में यूनानी पूर्ण कृदंत घटित घटनाओं की ओर संकेत करता है; ‘हुआ है’ हिन्दी में स्वाभाविक है और पूर्णता का भाव रखता है।
- source_word: ἐν γωνίᾳ
  choice: किसी कोने में
  rationale: मूल रूपक को सुरक्षित रखता है; पादटिप्पणी इसके गोपनीयता अथवा अस्पष्टता संबंधी मुहावरेदार अर्थ को स्पष्ट करती है।
- source_word: τοῦτο
  choice: यह सब
  rationale: एकवचन संकेतवाचक यहाँ चर्चा की घटनाओं को सामूहिक रूप से समेटता है; ‘यह सब’ हिन्दी में स्वाभाविक रहते हुए उसके दायरे को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ‘यह’ का दायरा और घटनाओं का सार्वजनिक स्वरूप
  choice: इसे ‘यह सब’ कहकर चर्चा की सार्वजनिक रूप से ज्ञात घटनाओं की ओर व्यापक संकेत के रूप में रखा गया है।
  alternative: इसे केवल यीशु की मृत्यु और पुनरुत्थान, या पूरे मसीही आंदोलन और पौलुस के मुकदमे तक सीमित मानना।
  rationale: पद स्वयं संकेत के सटीक दायरे को परिभाषित नहीं करता; इसलिए अनुवाद किसी संकीर्ण धर्मवैचारिक पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। राजा के लिए सम्मानसूचक बहुवचन प्रयुक्त है। ‘निडर होकर खुलकर’ मूल शब्द की निर्भीकता और स्पष्टवादिता दोनों को व्यक्त करता है; मूल मुहावरे ‘किसी कोने में’ को पादटिप्पणी सहित सुरक्षित रखा गया है।
