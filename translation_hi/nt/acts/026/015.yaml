  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: hi
  text: तब मैंने कहा, “प्रभु[a], आप कौन हैं?” प्रभु ने कहा, “मैं यीशु हूँ, जिसे तुम उत्पीड़ित कर रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महोदय”; यूनानी संबोधन κύριε आदरपूर्वक किसी व्यक्ति को संबोधित करने के लिए भी प्रयुक्त हो सकता है। यहाँ स्वर्गीय दर्शन में प्रकट वक्ता तुरंत अपनी पहचान यीशु के रूप में बताता है, इसलिए मुख्य पाठ में “प्रभु” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: तब मैंने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिंदी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है; ἐγώ का स्पष्ट कर्ता ‘मैंने’ में सुरक्षित है, बिना अनावश्यक बल जोड़े।
- source_word: Τίς εἶ, κύριε;
  choice: हे प्रभु, आप कौन हैं?
  rationale: τίς εἶ का स्वाभाविक आधुनिक हिंदी रूप ‘आप कौन हैं?’ है। संबोधन में κύριε को ‘हे प्रभु’ किया गया है; आदरसूचक ‘आप’ स्वर्गीय वक्ता के प्रति शाऊल के सम्मान को व्यक्त करता है।
- source_word: ὁ δὲ κύριος εἶπεν
  choice: प्रभु ने कहा
  rationale: κύριος के निश्चित संदर्भ को ‘प्रभु’ से व्यक्त किया गया है। हिंदी में अलग निश्चित उपपद नहीं होता, और δέ को यहाँ अलग संयोजक से व्यक्त करना आवश्यक नहीं, क्योंकि वाक्यक्रम संबंध स्पष्ट करता है।
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: मैं यीशु हूँ
  rationale: यह सीधा आत्म-परिचय है। स्पष्ट Ἐγώ को सामान्य हिंदी ‘मैं’ पर्याप्त रूप से व्यक्त करता है; अतिरिक्त बल जोड़ना आवश्यक नहीं।
- source_word: ὃν σὺ διώκεις
  choice: जिसे तुम सता रहे हो
  rationale: διώκω यहाँ विरोधपूर्वक सताने या उत्पीड़ित करने के अर्थ में है। ‘सता रहे हो’ वर्तमान में जारी क्रिया को सहज, सामान्य हिंदी में व्यक्त करता है; σὺ को ‘तुम’ से स्पष्ट रखा गया है।
theological_decisions:
- issue: शाऊल के संबोधन κύριε और वक्ता के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: स्वर्गीय प्रकट होने के संदर्भ और अगले ही कथन में वक्ता की यीशु के रूप में पहचान के कारण मुख्य पाठ में ‘प्रभु’ उपयुक्त है। फिर भी संबोधन κύριε अपने आप में आदरसूचक ‘महोदय’ या ‘स्वामी’ भी हो सकता है; यह वास्तविक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। शाऊल के प्रश्न में आदरसूचक ‘आप’ और उत्तर में सीधे संबोधन का ‘तुम’ रखा गया है, जिससे मूल संवाद का संबंध और स्वर स्वाभाविक रूप से व्यक्त होता है।
