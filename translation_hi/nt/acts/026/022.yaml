source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: hi
  text: इसलिए, परमेश्वर से सहायता पाकर मैं आज तक खड़ा हूँ और छोटे-बड़े सभी लोगों[a] के सामने गवाही देता हूँ। मैं उन बातों के सिवा कुछ नहीं कहता जिनके होने की बात भविष्यद्वक्ताओं और मूसा ने कही थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छोटे-बड़े” का अर्थ हर सामाजिक स्तर के लोग है।
    reason: cultural_note
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “जिन बातों के होने की भविष्यद्वक्ताओं और मूसा ने बात कही थी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर से सहायता पाकर
  rationale: यह स्वाभाविक हिन्दी में सहायता के स्रोत और उसे प्राप्त करने, दोनों को व्यक्त करता है।
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: मैं आज के दिन तक अडिग खड़ा हूँ
  rationale: यूनानी पूर्णकाल से व्यक्त वर्तमान स्थिर अवस्था और अब तक बने रहने के भाव को स्पष्ट करता है।
- source_word: μαρτυρόμενος
  choice: गवाही दे रहा हूँ
  rationale: चल रही साक्ष्य-क्रिया तथा प्रसंग के न्यायिक स्वर, दोनों को बनाए रखता है।
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: छोटे-बड़े सभी लोगों के सामने
  rationale: मूल मुहावरे का रूप बनाए रखते हुए इसका सर्वसमावेशी आशय हिन्दी में स्पष्ट करता है।
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: उन बातों के सिवा कुछ नहीं कहता
  rationale: ἐκτός के 'सिवा/बाहर' अर्थ को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς
  choice: जिनके विषय में भविष्यद्वक्ताओं और मूसा ने कहा था कि वे होने वाली हैं
  rationale: यूनानी क्रम, संयुक्त कर्ताओं और भविष्य-सापेक्ष कथन को सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के धर्मग्रंथों के साथ पौलुस की गवाही की निरंतरता
  choice: पौलुस केवल उन्हीं होने वाली बातों की गवाही देने का दावा करता है जिनके विषय में भविष्यद्वक्ताओं और मूसा ने कहा था।
  alternative: पौलुस केवल सामान्य रूप से अपने संदेश को धर्मग्रंथ से सहमत बता रहा है।
  rationale: οὐδὲν ἐκτὸς का सशक्त निषेध केवल सामान्य समानता नहीं, बल्कि कथित विषय-वस्तु की स्पष्ट सीमा व्यक्त करता है; अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। ‘अडिग खड़ा हूँ’ वर्तमान अवस्था और अब तक टिके रहने का भाव देता है। पद को हिन्दी में दो वाक्यों में बाँटा गया है ताकि अर्थ स्पष्ट और मौखिक पठन स्वाभाविक रहे।
