source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: hi
  text: और सभी आराधनालयों में, उन्हें बार-बार दण्ड देते हुए, मैं उन्हें ईशनिन्दा करने के लिए विवश करने का प्रयत्न करता था; और उनके विरुद्ध अत्यन्त उन्मत्त होकर, मैं बाहर के नगरों तक भी उन्हें सताता रहा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “यहाँ तक कि बाहर के नगरों तक भी।” संभवतः आशय यहूदिया के बाहर के नगरों से है।
    reason: ἕως καὶ εἰς τὰς ἔξω πόλεις की शाब्दिक वैकल्पिक अभिव्यक्ति और संभावित भौगोलिक संदर्भ बताना।
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: सभी आराधनालयों में
  rationale: κατά के साथ कर्मकारक यहाँ स्थान-वितरण का भाव देता है—अलग-अलग आराधनालयों में बार-बार की गई कार्रवाई। यह हिंदी में स्वाभाविक रहते हुए व्यापकता बनाए रखता है।
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: उन्हें बार-बार दण्ड देते हुए
  rationale: πολλάκις पुनरावृत्ति और वर्तमान कृदन्त τιμωρῶν साथ-साथ चल रही कार्रवाई/साधन को व्यक्त करता है।
- source_word: ἠνάγκαζον
  choice: विवश करने का प्रयत्न करता था
  rationale: अपूर्ण भूतकाल निरन्तर या बार-बार किए गए दबाव को दर्शाता है; संदर्भ में यह अनिवार्य सफलता बताए बिना जबरन करवाने के प्रयास को व्यक्त करता है।
- source_word: βλασφημεῖν
  choice: परमेश्वर की निन्दा करने
  rationale: हिंदी में ‘निन्दा करना’ अकेले अस्पष्ट हो सकता है; ‘परमेश्वर की निन्दा’ βλασφημεῖν का धार्मिक अर्थ स्पष्ट करता है, पर यीशु अथवा किसी विशिष्ट कथन को कर्म के रूप में नहीं जोड़ता।
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: मैं उनके विरुद्ध क्रोध से इतना उन्मत्त था कि
  rationale: περισσῶς अत्यधिक मात्रा और ἐμμαινόμενος उग्र, लगभग उन्मत्त वैरभाव व्यक्त करता है। ‘क्रोध से उन्मत्त’ आधुनिक हिंदी में मानसिक रोग का कथन किए बिना तीव्रता बनाए रखता है।
- source_word: ἐδίωκον
  choice: उन्हें सताता रहा
  rationale: अपूर्ण भूतकाल जारी और दोहराए गए उत्पीड़न को दिखाता है; ‘सताता रहा’ हिंदी में उसका स्वाभाविक आस्पेक्ट व्यक्त करता है।
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: बाहर के नगरों तक जाकर
  rationale: ἔξω का मूल अर्थ ‘बाहर’ है। यह अनुवाद ‘विदेशी’ जैसी अधिक निश्चित भौगोलिक व्याख्या थोपे बिना सीमा से परे नगरों तक पीछा करने का भाव देता है।
theological_decisions:
- issue: βλασφημεῖν में निन्दा का लक्ष्य
  choice: ‘परमेश्वर की निन्दा करने’ कहा गया, पर यीशु या मसीही अंगीकार को स्पष्ट कर्म नहीं बनाया गया।
  alternative: ‘यीशु की निन्दा करने’ अथवा केवल ‘निन्दा करने’
  rationale: संदर्भ संभवतः यीशु या मसीही अंगीकार के विरुद्ध निन्दा की ओर संकेत करता है, पर यूनानी में कर्म अनुक्त है। हिंदी में धार्मिक अर्थ स्पष्ट करने के लिए परमेश्वर का उल्लेख किया गया, जबकि अधिक संकीर्ण लक्ष्य नहीं जोड़ा गया।
- issue: ἠνάγκαζον की सफलता या प्रयास
  choice: ‘विवश करने का प्रयत्न करता था’
  alternative: ‘विवश करता था’
  rationale: अपूर्ण भूतकाल बार-बार की गई जबरदस्ती को व्यक्त करता है और यह आवश्यक नहीं कि हर प्रयास सफल हुआ हो; चुना हुआ रूप इस खुलेपन को बचाता है।
- issue: ἔξω πόλεις का भौगोलिक दायरा
  choice: ‘बाहर के नगर’
  alternative: ‘विदेशी नगर’ या ‘यहूदिया के बाहर के नगर’
  rationale: मूल पाठ केवल ‘बाहर’ कहता है। मुख्य पाठ में सीमा को यहूदिया या किसी राष्ट्र से निश्चित रूप से जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप। ‘आराधनालय’, ‘दण्ड’, ‘विवश’, ‘परमेश्वर की निन्दा’ और ‘सताता रहा’ बाइबलीय संदर्भ के अनुकूल हैं, पर अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है। मुख्य पाठ में [a] चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
