  register: आधुनिक मानक हिन्दी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण कानूनी-कथात्मक शैली रखी गई है। वाक्य-विन्यास हिन्दी की सहज शर्तीय संरचना के अनुरूप है और मूल की प्रतिकल्पित संभावना को सुरक्षित रखता है।
