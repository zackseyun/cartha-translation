  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: hi
  text: तब अग्रिप्पा ने फेस्तुस से कहा, “यदि इस मनुष्य ने कैसर से अपील न की होती, तो इसे रिहा किया जा सकता था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाते हुए अग्रिप्पा की अंतिम टिप्पणी की ओर संक्रमण कराता है; ‘तब’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔφη
  choice: कहा
  rationale: φημί का अपूर्णकालीन रूप यहाँ सामान्य कथात्मक वाक्-परिचायक है; ‘कहा’ हिन्दी में सहज है और क्रिया-पक्ष पर अनावश्यक बल नहीं देता।
- source_word: Ἀπολελύσθαι
  choice: रिहा किया जा सकता था
  rationale: ἀπολύω का सिद्ध infinitive मुक्त या रिहा किए जाने की अवस्था बताता है। कानूनी प्रसंग में ‘रिहा’ उपयुक्त है, जबकि ‘निर्दोष ठहराया’ यूनानी से अधिक विशिष्ट होता।
- source_word: ἐδύνατο
  choice: किया जा सकता था
  rationale: δύναμαι यहाँ एक ऐसी भूतकालीन संभावना व्यक्त करता है जो पूरी नहीं हुई; हिन्दी का यह प्रयोग उस प्रतिकल्पित संभावना को स्पष्ट रखता है।
- source_word: ὁ ἄνθρωπος οὗτος
  choice: इस मनुष्य
  rationale: यह पद एक निश्चित पुरुष, पौलुस, की ओर संकेत करता है। ‘इस मनुष्य’ οὗτος के संकेतार्थ को बनाए रखता है और गरिमापूर्ण हिन्दी है।
- source_word: εἰ μὴ
  choice: यदि ... न ... होती
  rationale: यह प्रतिकल्पित शर्त प्रस्तुत करता है; हिन्दी में ‘यदि ... न ... होती’ उसके तर्क और अपूर्ण भूतकालीन स्थिति को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐπεκέκλητο
  choice: अपील न की होती
  rationale: रोमी कानूनी संदर्भ में ἐπικαλέω कैसर के न्यायाधिकार की अपील करने का तकनीकी अर्थ रखता है; ‘अपील’ आधुनिक पाठक के लिए सटीक और स्पष्ट है।
- source_word: Καίσαρα
  choice: कैसर
  rationale: Καῖσαρ ऐतिहासिक नाम/उपाधि है। ‘कैसर’ मूल कानूनी अभिव्यक्ति को बनाए रखता है; ‘सम्राट’ अधिक व्याख्यात्मक होता।
theological_decisions: []
