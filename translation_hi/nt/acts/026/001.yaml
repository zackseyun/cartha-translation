  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजकीय-कानूनी प्रसंग की औपचारिकता ‘अनुमति’ और ‘अपना पक्ष रखा’ से व्यक्त होती है, जबकि वाक्य सामान्य पाठक के लिए सहज बना रहता है।
