source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: hi
  text: 'तब अग्रिप्पा ने पौलुस से कहा, “तुम्हें अपनी ओर से बोलने की अनुमति है।” तब पौलुस ने हाथ बढ़ाकर अपना पक्ष रखा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: अग्रिप्पा
  rationale: व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की स्वाभाविक प्रगति व्यक्त करता है।
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: पौलुस से कहा
  rationale: बोलने की क्रिया के साथ πρὸς का स्वाभाविक हिन्दी रूप।
- source_word: Ἐπιτρέπεταί σοι
  choice: तुम्हें ... अनुमति है
  rationale: वर्तमान कर्मवाच्य का अर्थ सहज हिन्दी में रखते हुए औपचारिक सुनवाई का भाव बनाए रखता है।
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: अपनी ओर से बोलने
  rationale: ὑπέρ और आत्मवाचक सर्वनाम यहाँ अपने हित या पक्ष में बोलने का अर्थ देते हैं; यह अभिव्यक्ति कानूनी संदर्भ को अनावश्यक रूप से अधिक स्पष्ट नहीं करती।
- source_word: τότε
  choice: तब
  rationale: यूनानी पाठ में स्पष्ट कालानुक्रमिक क्रम को बनाए रखता है।
- source_word: ἐκτείνας τὴν χεῖρα
  choice: हाथ बढ़ाकर
  rationale: शारीरिक संकेत को सीधे और स्वाभाविक ढंग से व्यक्त करता है, बिना उसके प्रकार या आशय की अटकल लगाए।
- source_word: ἀπελογεῖτο
  choice: अपना पक्ष रखा
  rationale: मध्यवाच्य क्रिया औपचारिक प्रतिरक्षा या सफाई देने को सूचित करती है; ‘अपना पक्ष रखा’ आधुनिक हिन्दी में स्वाभाविक है और आरंभ होने की अतिरिक्त धारणा नहीं जोड़ता।
