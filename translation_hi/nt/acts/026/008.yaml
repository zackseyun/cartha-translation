  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: hi
  text: यदि परमेश्वर मरे हुओं को जिलाता है, तो आप लोग इसे अविश्वसनीय क्यों मानते हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται
  choice: क्यों मानते हैं
  rationale: ग्रीक का शाब्दिक रूप ‘क्यों ... आंका जाता है’ है; हिन्दी में सक्रिय रूप अधिक स्वाभाविक है और ‘आप लोगों के द्वारा’ का भाव बनाए रखता है।
- source_word: ἄπιστον
  choice: अविश्वसनीय
  rationale: यहाँ अर्थ ऐसी बात का है जिस पर विश्वास न किया जा सके, न कि व्यक्तिगत अविश्वास का।
- source_word: παρ’ ὑμῖν
  choice: आप लोग
  rationale: बहुवचन श्रोताओं को स्पष्ट करता है और उनके द्वारा ऐसा आकलन किए जाने का भाव सक्रिय वाक्य में व्यक्त करता है।
- source_word: νεκροὺς ἐγείρει
  choice: मरे हुओं को जिलाता है
  rationale: पुनर्जीवित करने के अर्थ को साधारण, वर्तमान हिन्दी में स्पष्ट रूप से व्यक्त करता है; ग्रीक वर्तमान काल को भी बनाए रखता है।
theological_decisions:
- issue: εἰ का अर्थ
  choice: यदि
  alternative: कि
  rationale: शर्तसूचक रूप को सुरक्षित रखा गया है; वाक्य परमेश्वर की सामर्थ्य पर संदेह नहीं जताता, बल्कि श्रोताओं के निर्णय को प्रश्न के घेरे में लाता है।
translation_notes:
  register: आदरपूर्ण बहुवचन ‘आप लोग’ और सरल, गरिमापूर्ण आधुनिक हिन्दी का प्रयोग किया गया है।
