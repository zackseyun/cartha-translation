  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: hi
  text: और परमेश्वर का वचन फैलता गया, और यरूशलेम में शिष्यों की संख्या बहुत बढ़ती गई। और याजकों की एक बड़ी भीड़ विश्वास के प्रति आज्ञाकारी होती जा रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “विश्वास की आज्ञा मान रहे थे” या “विश्वास के प्रति आज्ञाकारी हो रहे थे” भी हो सकता है। यूनानी अभिव्यक्ति केवल मन में भरोसा करने के बजाय मसीही संदेश के प्रति आज्ञापालन का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह प्रचलित बाइबलीय अभिव्यक्ति है और परमेश्वर की ओर से घोषित संदेश का अर्थ रखती है, बिना इसे केवल बोली, संदेश या सुसमाचार तक सीमित किए।
- source_word: ηὔξανεν
  choice: फैलता गया
  rationale: अपूर्ण काल निरंतर प्रगति दर्शाता है। वचन के विषय में हिन्दी में ‘फैलता गया’ स्वाभाविक है और संदेश के बढ़ते प्रसार को व्यक्त करता है।
- source_word: ἐπληθύνετο
  choice: बढ़ती गई
  rationale: अपूर्ण काल लगातार वृद्धि दिखाता है। हिन्दी में शिष्यों की संख्या के साथ ‘बहुत ही बढ़ती गई’ स्वाभाविक है और पहले क्रियापद से आवश्यक अर्थगत भेद बनाए रखता है।
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: शिष्यों की संख्या
  rationale: यह यूनानी रचना का स्पष्ट और स्वाभाविक हिन्दी रूप है तथा लूका के महत्त्वपूर्ण शब्द μαθηταί को ‘शिष्य’ के रूप में सुरक्षित रखता है।
- source_word: ἐν Ἰερουσαλὴμ
  choice: यरूशलेम में
  rationale: स्थानवाचक पद का सीधा अनुवाद।
- source_word: σφόδρα
  choice: बहुत ही
  rationale: यह तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πολύς τε ὄχλος
  choice: एक बड़ी भीड़ भी
  rationale: ὄχλος के सामूहिक अर्थ को ‘भीड़’ सुरक्षित रखता है और τε को ‘भी’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: τῶν ἱερέων
  choice: याजकों की
  rationale: यह यहूदी मंदिर के पुरोहितों के लिए प्रचलित और सटीक बाइबलीय हिन्दी पद है।
- source_word: ὑπήκουον
  choice: आज्ञाकारी होती जा रही थी
  rationale: अपूर्ण काल चल रही प्रक्रिया को दर्शाता है। यह रूप आज्ञापालन तथा उस ओर आते जाने—दोनों भावों को व्यक्त करता है।
- source_word: τῇ πίστει
  choice: विश्वास के प्रति
  rationale: सव्यंजक लेख और प्रसंग के कारण πίστις यहाँ माने और घोषित विश्वास-संदेश की ओर संकेत कर सकता है। ‘के प्रति’ दत्तिव संबंध और वस्तुगत अर्थ की संभावना बनाए रखता है।
theological_decisions:
- issue: τῇ πίστει में πίστις का अर्थ
  choice: विश्वास के प्रति
  alternative: विश्वास की आज्ञा मान रहे थे / मसीही विश्वास के प्रति
  rationale: यह पद केवल मन के भीतर भरोसा करने के बजाय स्वीकार किए गए विश्वास या घोषित मसीही संदेश के प्रति आज्ञापालन बता सकता है। मुख्य पाठ यूनानी की संक्षिप्तता और वास्तविक अर्थगत तनाव बनाए रखता है; पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। निरंतर क्रिया को ‘गया/गई’ और ‘जा रही थी’ से व्यक्त किया गया है। ‘परमेश्वर का वचन,’ ‘शिष्य,’ ‘याजक’ और ‘विश्वास’ जैसे स्थापित बाइबलीय पद सुरक्षित रखे गए हैं।
