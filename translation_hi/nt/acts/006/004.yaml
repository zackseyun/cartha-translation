  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: hi
  text: परन्तु हम प्रार्थना और वचन की सेवा[a] में निरन्तर लगे रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वचन की सेवकाई।’ यूनानी शब्द का अर्थ ‘सेवा’ या ‘सेवकाई’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: हम
  rationale: यूनानी में सर्वनाम स्पष्ट रूप से आया है और पहले बताए गए कार्य-विभाजन के साथ कर्ताओं का विरोध उभारता है; हिन्दी में ‘हम’ तथा ‘परन्तु’ मिलकर यह बल स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले प्रसंग में दूसरों को भोजन-वितरण का कार्य सौंपने के प्रस्ताव के विपरीत प्रेरितों की प्राथमिक जिम्मेदारी बताता है।
- source_word: τῇ προσευχῇ
  choice: प्रार्थना
  rationale: प्रसκαρτερέω के साथ यह समर्पित और निरन्तर लगे रहने के क्षेत्र/विषय को बताता है। हिन्दी वाक्य में ‘प्रार्थना ... में’ इसका स्वाभाविक रूप है।
- source_word: διακονίᾳ
  choice: सेवा
  rationale: शब्द का मूल अर्थ सेवा/सेवकाई है। ‘सेवा’ आधुनिक हिन्दी में सहज है और प्रचार के कार्य को पदानुक्रमित धार्मिक पद के रूप में प्रस्तुत किए बिना उसके सेवाभाव को बनाए रखता है।
- source_word: τοῦ λόγου
  choice: वचन की
  rationale: यहाँ λόγος परमेश्वर के सुनाए जाने वाले वचन अथवा संदेश की ओर संकेत करता है। ‘वचन’ आरम्भिक मसीही प्रयोग को बनाए रखते हुए प्रसंग में समझने योग्य है।
- source_word: προσκαρτερήσομεν
  choice: निरन्तर लगे रहेंगे
  rationale: भविष्यकालीन क्रिया स्थिरता, लगन और लगातार समर्पण को व्यक्त करती है; यह हिन्दी रूप उस सतत भाव को स्पष्ट और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: διακονία को भोजन की सेवा के निकटवर्ती विरोध में कैसे व्यक्त किया जाए
  choice: वचन की सेवा
  alternative: वचन की सेवकाई
  rationale: ‘सेवा’ यूनानी शब्द के व्यापक सेवाभाव को सुरक्षित रखती है और व्यावहारिक सेवा तथा वचन सुनाने की सेवा के बीच संबंध को नहीं मिटाती। ‘सेवकाई’ सम्भव है, पर कुछ पाठकों के लिए वह अधिक पारिभाषिक या कलीसियाई पद का संकेत दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। ‘निरन्तर लगे रहेंगे’ मूल क्रिया की दृढ़ तथा सतत प्रतिबद्धता व्यक्त करता है।
