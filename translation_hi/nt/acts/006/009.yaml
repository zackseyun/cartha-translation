source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: hi
  text: परन्तु ‘मुक्त जनों के नाम से प्रसिद्ध’ आराधनालय[a] के कुछ लोग—कुरेने और सिकंदरिया के निवासी तथा किलिकिया और आसिया[b] के लोग—उठ खड़े हुए और स्तिफनुस से वाद-विवाद करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द उन लोगों के लिए प्रयुक्त होता है जिन्हें दासत्व से मुक्त किया गया था; सम्भवतः इसमें ऐसे लोगों के वंशज भी शामिल थे।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘आसिया’ से आशय पश्चिमी एशिया माइनर में स्थित रोमी प्रान्त से है, आधुनिक एशिया महाद्वीप से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν δέ
  choice: परन्तु ... उठ खड़े हुए
  rationale: δέ कथा में विरोध की ओर मोड़ लाता है, और ἀνέστησαν के उठकर विरोध में खड़े होने के ठोस भाव को ‘उठ खड़े हुए’ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: आराधनालय के कुछ लोग
  rationale: 'यह τινες के साथ अंशसूचक संबंध को व्यक्त करता है: उस आराधनालय से जुड़े सभी लोग नहीं, बल्कि उनमें से कुछ।'
- source_word: συναγωγῆς
  choice: आराधनालय
  rationale: यह यहूदी सभा अथवा उसके मिलने के स्थान के लिए आधुनिक हिन्दी में प्रचलित और सुबोध पद है।
- source_word: τῆς λεγομένης Λιβερτίνων
  choice: ‘मुक्त जनों की सभा’ कहलाने वाले
  rationale: Λιβερτίνων रोमी सामाजिक संदर्भ में दासत्व से मुक्त किए गए लोगों या उनके वंशजों का संकेत करता है। अर्थानुवाद आधुनिक पाठक को भ्रामक लिप्यंतरण से बचाता है, जबकि टिप्पणी ऐतिहासिक आशय स्पष्ट करती है।
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: कुरेने और सिकन्दरिया के निवासी
  rationale: ये स्थान-सूचक जननाम हैं; हिन्दी में नगरों के नाम के साथ ‘निवासी’ कहना स्वाभाविक और स्पष्ट है।
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: किलिकिया और आसिया के लोग
  rationale: ἀπό यहाँ भौगोलिक मूल बताता है। ‘आसिया’ को ऐतिहासिक स्थाननाम के रूप में रखा गया है और टिप्पणी में उसका रोमी प्रान्त होना स्पष्ट किया गया है।
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: स्तिफनुस से वाद-विवाद करने लगे
  rationale: संदर्भ में συζητοῦντες तटस्थ चर्चा नहीं, बल्कि मौखिक विरोध और बहस बताता है। ‘करने लगे’ मुख्य क्रिया के बाद जारी गतिविधि को सहज हिन्दी में व्यक्त करता है।
