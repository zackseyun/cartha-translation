  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: hi
  text: तब बारहों ने चेलों के पूरे समूह को[a] एक साथ बुलाकर कहा, “यह उचित नहीं है[b] कि हम परमेश्वर का वचन छोड़कर मेज़ों की सेवा करें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चेलों की पूरी संख्या को” या “चेलों की बड़ी भीड़ को।”
    reason: lexical_alternative
  - marker: b
    text: या “यह ठीक नहीं है” या “यह हमारे लिए स्वीकार्य नहीं है।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात समुदाय के भोजन और संसाधनों के व्यावहारिक वितरण की व्यवस्था करना।
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: एक साथ बुलाकर
  rationale: मध्यवाच्य कृदन्त यहाँ चेलों के समुदाय को सभा के लिए अपने पास बुलाने का भाव देता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि पिछली घटना से आगे बढ़ती हुई कथा और प्रेरितों की प्रतिक्रिया को चिह्नित करता है।
- source_word: οἱ δώδεκα
  choice: उन बारहों
  rationale: यह यीशु द्वारा नियुक्त बारह जनों के स्थापित समूह-सूचक नाम को बनाए रखता है और मूल पाठ में न आए ‘प्रेरित’ शब्द को नहीं जोड़ता।
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: चेलों के पूरे समुदाय
  rationale: πλῆθος एक बड़ी सामूहिक सभा अथवा संपूर्ण समूह को सूचित कर सकता है; यह चयन सामूहिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: यह उचित नहीं है
  rationale: ἀρεστόν का मूल भाव ‘भानेवाला/स्वीकार्य’ है, पर इस प्रसंग में कथन दायित्वों की उपयुक्त प्राथमिकता के बारे में है; ‘उचित नहीं’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡμᾶς καταλείψαντας
  choice: कि हम ... छोड़कर
  rationale: यह यूनानी के कर्मकारक और क्रियार्थक संज्ञा वाले विन्यास का सहज हिन्दी रूप है; ‘छोड़कर’ वचन की सेवा से हट जाने की गंभीरता रखता है, पर अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह पारदर्शी और प्रचलित अनुवाद है, जो प्रेरितों के काम में परमेश्वर से प्राप्त और प्रचारित संदेश—दोनों की अनुगूँज बनाए रखता है।
- source_word: διακονεῖν
  choice: सेवा करें
  rationale: क्रिया व्यावहारिक सेवा को व्यक्त करती है; ‘सेवा करना’ सरल है और बाद की किसी विशिष्ट कलीसियाई पदवी को पाठ में नहीं लाता।
- source_word: τραπέζαις
  choice: मेज़ों पर
  rationale: मूल में केवल ‘मेज़ों’ का उल्लेख है। ‘मेज़ों पर सेवा’ भोजन अथवा संसाधन-वितरण के प्रसंग के लिए हिन्दी में समझने योग्य है और मूल की संक्षिप्तता तथा संभावित व्यापकता बनाए रखता है।
theological_decisions:
- issue: व्यावहारिक सेवा की तुलना में प्रेरितों की वचन-संबंधी प्राथमिकता
  choice: कथन को दायित्व और उपयुक्तता का प्रश्न मानते हुए ‘यह उचित नहीं है कि हम ...’ रखा गया है।
  alternative: ‘यह हमें स्वीकार्य नहीं है’ या ‘यह हमें अच्छा नहीं लगता कि हम ...’
  rationale: पद विभिन्न जिम्मेदारियों को अलग करता है, व्यावहारिक सेवा की गरिमा को कम नहीं करता। यह रूप प्रेरितों की वचन-संबंधी बुलाहट को प्राथमिक रखता है, पर मेज़ों की सेवा को हीन नहीं बताता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उन बारहों’ समूह-सूचक पद को बनाए रखता है; ‘मेज़ों पर सेवा’ मूल रूपक को सुरक्षित रखते हुए उसके सांस्कृतिक आशय को पादटिप्पणी में स्पष्ट करता है।
