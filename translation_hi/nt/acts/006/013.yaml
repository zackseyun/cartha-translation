  text: उन्होंने झूठे गवाह भी खड़े किए, जिन्होंने कहा, “यह आदमी इस पवित्र स्थान[a] और व्यवस्था के विरुद्ध बातें कहना[c] बंद नहीं करता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र स्थान।” इस प्रसंग में यह पद विशेष रूप से मंदिर को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “बोलना नहीं छोड़ता।”
    reason: lexical_alternative
  - marker: c
    text: या “बोलना”; शाब्दिक रूप से “बातें बोलना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: खड़े किए
  rationale: कानूनी प्रसंग में इसका अर्थ गवाहों को सामने लाना या गवाही के लिए प्रस्तुत करना है। ‘खड़े किए’ इस अर्थ के साथ सुनियोजित कार्रवाई की छाया भी बनाए रखता है।
- source_word: τε
  choice: भी
  rationale: यह पिछली कार्रवाइयों में एक और कार्रवाई जोड़ता है; आधुनिक हिन्दी में ‘भी’ इसका स्वाभाविक रूप है।
- source_word: μάρτυρας ψευδεῖς
  choice: झूठे गवाह
  rationale: यह झूठी गवाही देने वालों के लिए प्रचलित और स्पष्ट कानूनी पद है।
- source_word: λέγοντας
  choice: जिन्होंने कहा
  rationale: यूनानी कृदंत को हिन्दी के स्वाभाविक संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: यह आदमी
  rationale: यह आरोपियों की सीधी और कुछ हद तक तिरस्कारपूर्ण भाषा को बिना अनावश्यक कठोरता जोड़े व्यक्त करता है।
- source_word: οὐ παύεται
  choice: बंद नहीं करता
  rationale: वर्तमानकालीन रूप लगातार जारी रहने वाली क्रिया दिखाता है; ‘बंद नहीं करता’ आधुनिक और सहज हिन्दी है।
- source_word: λαλῶν ῥήματα
  choice: बातें करना
  rationale: ῥήματα के स्पष्ट होने को ‘बातें’ से दर्शाया गया है, जबकि ‘बातें बोलना’ जैसी अस्वाभाविक शब्दशः हिन्दी से बचा गया है।
- source_word: κατὰ
  choice: के विरुद्ध
  rationale: इस विरोधपूर्ण कानूनी आरोप में κατά का अर्थ किसी के विरोध में बोलना है।
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: इस पवित्र स्थान
  rationale: यूनानी में निश्चित पदबंध है; प्रसंग में उपस्थित और सबको ज्ञात यरूशलेम मंदिर की ओर संकेत होने के कारण हिन्दी में ‘इस’ स्वाभाविक है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: यहाँ यह मूसा की व्यवस्था को सूचित करता है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में νόμος का परिचित रूप है और केवल सामान्य नागरिक कानून का अर्थ देने से बचाता है।
theological_decisions:
- issue: ‘पवित्र स्थान’ और ‘व्यवस्था’ का संदर्भ
  choice: आरोप यरूशलेम के मंदिर और मूसा की व्यवस्था से संबंधित है।
  alternative: सामान्य रूप से किसी पवित्र स्थल और कानूनी परंपरा का उल्लेख
  rationale: निकटवर्ती कथा-प्रसंग स्तिफनुस पर मंदिर और मूसा से संबंधित आरोपों की बात करता है। अनुवाद आरोपियों के शब्दों को बनाए रखता है और मुख्य पाठ में उनकी व्याख्या का विस्तार नहीं करता।
- issue: आरोप की भाषा का स्तर
  choice: विरोधपूर्ण कानूनी स्वर रखा गया है, पर उसे यूनानी से अधिक तीखा नहीं बनाया गया।
  alternative: ‘निन्दा करता है’ या ‘अपमान करता है’ जैसे अधिक व्याख्यात्मक शब्द
  rationale: यूनानी पाठ ‘विरुद्ध बातें करने’ की बात कहता है, किसी अधिक प्रबल धर्मशास्त्रीय या कानूनी पद का प्रयोग नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘झूठे गवाह’ कानूनी स्वर बनाए रखता है; ‘यह आदमी’ आरोपियों की उपेक्षापूर्ण सीधाई को व्यक्त करता है, लेकिन बोलचाल की अधिक तिरस्कारपूर्ण अभिव्यक्ति से बचता है।
