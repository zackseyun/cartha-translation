source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: hi
  text: यह प्रस्ताव सारी सभा को अच्छा लगा, और उन्होंने स्तिफनुस को चुना, जो विश्वास[a] और पवित्र आत्मा से परिपूर्ण मनुष्य था; फिर फिलिप्पुस, प्रोखोरुस, नीकानोर, तीमोन, परमेनास और अन्ताकिया के निकोलाउस को, जो एक गैर-यहूदी था और यहूदी धर्म अपना चुका था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता।” यूनानी शब्द का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गैर-यहूदी” से आशय ऐसे व्यक्ति से है जिसने यहूदी धर्म अपना लिया था।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: यह प्रस्ताव
  rationale: सन्दर्भ में λόγος प्रेरितों द्वारा अभी रखी गई बात या योजना को दर्शाता है; ‘प्रस्ताव’ आधुनिक हिन्दी में ठोस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: पूरी सभा को अच्छा लगा
  rationale: यह मुहावरेदार हिन्दी में पूरे एकत्र समुदाय की स्वीकृति व्यक्त करता है; ‘सभा’ πλῆθος के सामूहिक अर्थ को बिना बाद की कलीसियाई पदावली थोपे रखता है।
- source_word: ἐξελέξαντο
  choice: उन्होंने ... चुना
  rationale: मध्यवाच्य क्रिया का सीधा और स्वाभाविक अर्थ ‘अपने लिए चुनना’ है।
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: जो विश्वास और पवित्र आत्मा से परिपूर्ण मनुष्य था
  rationale: वर्णन स्तिफनुस के चरित्र को बताता है। ‘परिपूर्ण’ πλήρης को व्यक्त करता है और ‘मनुष्य’ ἄνδρα को बनाए रखता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις का सबसे स्वाभाविक अर्थ परमेश्वर पर विश्वास/भरोसा है; सम्भव ‘विश्वासयोग्यता’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा
  rationale: प्रेरितों के काम में यह पद सामान्यतः दिव्य पवित्र आत्मा का निर्देश करता है।
- source_word: προσήλυτον Ἀντιοχέα
  choice: अन्ताकिया का यहूदी मत अपनाने वाला गैर-यहूदी
  rationale: प्रσήλυτος उस गैर-यहूदी व्यक्ति को दर्शाता है जिसने यहूदी धर्म/मत अपना लिया था; वर्णनात्मक हिन्दी तकनीकी ‘धर्मान्तरित’ से अधिक स्पष्ट है।
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: स्तिफनुस, फिलिप्पुस, प्रखुरुस, नीकानोर, तीमोन, परमिनास और निकुलाउस
  rationale: नामों का देवनागरी लिप्यन्तरण यूनानी रूपों के निकट और हिन्दी बाइबलीय नाम-परम्परा के अनुरूप रखा गया है।
theological_decisions:
- issue: स्तिफनुस के वर्णन में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: इस प्रसंग में ‘विश्वास’ प्रमुख और स्वाभाविक अर्थ है, पर यूनानी शब्द चरित्रगत विश्वासयोग्यता भी व्यक्त कर सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: πνεύματος ἁγίου का सन्दर्भ
  choice: व्यक्तिवाचक ‘पवित्र आत्मा’
  alternative: पवित्र आत्मिक गुण
  rationale: प्रेरितों के काम के निकटवर्ती और व्यापक प्रयोग में यह अभिव्यक्ति दिव्य पवित्र आत्मा को सूचित करती है, केवल किसी मनोवृत्ति को नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यूनानी की बार-बार आने वाली संयोजक संरचना को स्वाभाविक हिन्दी सूची में बदला गया है। स्तिफनुस के लम्बे विशेषण-वाक्य को डैशों के बीच रखा गया है ताकि सातों चुने हुए व्यक्तियों की एक ही सूची स्पष्ट रहे।
