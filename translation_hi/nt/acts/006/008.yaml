  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: hi
  text: स्तिफनुस[a] अनुग्रह और सामर्थ्य से परिपूर्ण था और लोगों के बीच बड़े-बड़े अद्भुत काम और चिह्न करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘अनुग्रह और सामर्थ्य से परिपूर्ण’ के स्थान पर ‘विश्वास और सामर्थ्य से परिपूर्ण’ है।
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, प्रबल विरोध नहीं। हिंदी में ‘और’ इसका स्वाभाविक प्रवाह बनाए रखता है।
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: अनुग्रह और सामर्थ्य से परिपूर्ण
  rationale: πλήρης के साथ संबंधकारक इन गुणों से भरे या इनके द्वारा विशेषित होने का भाव देता है। ‘अनुग्रह’ χάρις की धार्मिक और साहित्यिक प्रतिध्वनि बनाए रखता है, और ‘सामर्थ्य’ चमत्कारिक कार्यों के संदर्भ में δύναμις का स्वाभाविक हिंदी रूप है।
- source_word: ἐποίει
  choice: करता था
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली पिछली क्रिया दर्शाता है; ‘करता था’ इस पक्ष को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τέρατα καὶ σημεῖα
  choice: अद्भुत काम और चिह्न
  rationale: 'यह अनुवाद दोनों यूनानी शब्दों का भेद बचाता है: τέρατα विस्मय उत्पन्न करने वाले कार्यों पर और σημεῖα उनके संकेतात्मक अर्थ पर बल देता है।'
- source_word: μεγάλα
  choice: बड़े-बड़े
  rationale: बहुवचन युग्म पर लागू μεγάλα की व्यापक तीव्रता को ‘बड़े-बड़े’ सहज हिंदी में व्यक्त करता है।
- source_word: ἐν τῷ λαῷ
  choice: लोगों के बीच
  rationale: यह वाक्यांश उस समुदाय या क्षेत्र को दर्शाता है जिसमें ये कार्य हो रहे थे; ‘लोगों के बीच’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: χάριτος/πίστεως का पाठांतर
  choice: अनुग्रह
  alternative: विश्वास
  rationale: प्रदत्त SBLGNT पाठ में χάριτος (‘अनुग्रह’) है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। कुछ पांडुलिपियों का πίστεως (‘विश्वास’) पाठ अर्थपूर्ण पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘स्तिफनुस’ प्रचलित बाइबलीय नाम-रूप है; ‘करता था’ यूनानी अपूर्ण भूतकाल की निरंतर या सामान्य क्रिया को दर्शाता है।
