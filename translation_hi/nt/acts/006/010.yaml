  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: hi
  text: पर वे उस बुद्धि और उस आत्मा के सामने टिक नहीं पाते थे, जिसके द्वारा वह बोल रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी अपनी आत्मा,” यदि यहाँ “आत्मा” से पवित्र आत्मा नहीं, बल्कि स्तिफनुस की अपनी आत्मा का आशय हो।
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: नहीं कर पाते थे
  rationale: अपूर्णकाल यहाँ लगातार असमर्थता व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उस पहलू को बनाए रखता है।
- source_word: ἀντιστῆναι
  choice: सामना करना
  rationale: संदर्भ में इसका अर्थ स्तिफनुस की बात के विरुद्ध टिक पाना या प्रभावी प्रतिवाद कर पाना है; ‘सामना करना’ इस अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: σοφίᾳ
  choice: उस बुद्धि
  rationale: यूनानी निश्चित उपपद स्तिफनुस के बोलने में प्रकट विशिष्ट बुद्धि की ओर संकेत करता है; ‘उस’ यह विशिष्टता दर्शाता है।
- source_word: πνεύματι
  choice: उस आत्मा
  rationale: प्रसंग पवित्र आत्मा की ओर प्रबल संकेत करता है, पर यूनानी शब्द अपने आप में स्तिफनुस की आत्मा का अर्थ भी दे सकता है। हिंदी में ‘आत्मा’ दोनों संभावनाएँ खुली रखता है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ᾧ ἐλάλει
  choice: जिसके द्वारा वह बोल रहा था
  rationale: संबंधवाचक सर्वनाम का दैटिव यहाँ साधन अथवा समर्थकारी माध्यम को व्यक्त करता है, और अपूर्णकाल की जारी क्रिया ‘बोल रहा था’ में सुरक्षित है।
theological_decisions:
- issue: क्या πνεύματι पवित्र आत्मा को दर्शाता है या स्तिफनुस की अपनी आत्मा को
  choice: मुख्य पाठ में ‘आत्मा’, जिसे प्रसंगतः पवित्र आत्मा समझा जा सकता है
  alternative: ‘उसकी आत्मिक सामर्थ्य’ अथवा स्तिफनुस की अपनी आत्मा
  rationale: प्रेरितों के काम 6:5 और बुद्धि के साथ आत्मा का उल्लेख पवित्र आत्मा के अर्थ का समर्थन करते हैं। फिर भी शब्दगत रूप से मानवीय आत्मा की संभावना पूरी तरह समाप्त नहीं होती, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिंदी। ‘उस बुद्धि और उस आत्मा’ यूनानी के दोनों निश्चित पदों तथा उनके समांतर विन्यास को बनाए रखता है।
