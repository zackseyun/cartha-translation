source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: hi
  text: पर, भाइयो[a], अपने बीच में से ऐसे सात पुरुषों को चुन लो जिनके विषय में अच्छी गवाही हो और जो आत्मा और बुद्धि से परिपूर्ण हों[b]। हम उन्हें इस काम की ज़िम्मेदारी सौंप देंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी के पुल्लिंग संबोधन का अनुवाद है; यहाँ संबोधन में व्यापक विश्वासी समुदाय भी सम्मिलित हो सकता है।
    reason: cultural_note
  - marker: b
    text: या ‘पवित्र आत्मा और बुद्धि से परिपूर्ण हों।’ यूनानी पाठ में शाब्दिक रूप से ‘आत्मा और बुद्धि से परिपूर्ण’ है।
    reason: alternative_reading
  - marker: c
    text: ‘इस काम’ का संकेत आस-पास के प्रसंग में वर्णित प्रतिदिन के वितरण की व्यावहारिक व्यवस्था की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: चुन लो
  rationale: यह समुदाय को अपने बीच से योग्य व्यक्तियों को पहचानकर चुनने की आज्ञा देता है; ‘चुन लो’ स्वाभाविक आधुनिक हिन्दी में विचारपूर्वक चयन का भाव व्यक्त करता है।
- source_word: δέ
  choice: इसलिए
  rationale: पिछले पद में प्रेरितों के प्रस्ताव से समुदाय को दिए गए निर्देश की ओर बढ़ते हुए यह प्रसंग में निष्कर्षात्मक संक्रमण दिखाता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन व्याकरणतः पुल्लिंग है; हिन्दी का सीधा और गरिमापूर्ण संबोधन ‘भाइयो’ है। व्यापक विश्वासी समुदाय की सम्भावित समावेशिता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: ἀνήρ यहाँ सामान्य ‘लोगों’ के बजाय वयस्क पुरुषों को निर्दिष्ट करता है, इसलिए लिंग-सूचना सुरक्षित रखी गई है।
- source_word: ἐξ ὑμῶν
  choice: अपने बीच में से
  rationale: यह चयन उसी समुदाय के भीतर से होने का संकेत देता है; हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: μαρτυρουμένους
  choice: जिनके विषय में अच्छी गवाही हो
  rationale: कृदन्त दूसरों द्वारा अनुकूल गवाही दिए जाने का भाव रखता है। यह अनुवाद उस साक्ष्यात्मक अर्थ को ‘अच्छी प्रतिष्ठा’ जैसे सम्भव पर अपेक्षाकृत संक्षिप्त विकल्प से अधिक स्पष्ट रूप में बचाता है।
- source_word: ἑπτὰ
  choice: सात
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: आत्मा और बुद्धि से परिपूर्ण
  rationale: वाक्यांश को बिना ‘पवित्र’ शब्द जोड़े निकटता से रखा गया है। लूका-प्रेरितों के प्रसंग में ‘आत्मा’ का सम्भावित संकेत परमेश्वर के आत्मा की ओर है, पर मूल में ἁγίου नहीं है।
- source_word: καταστήσομεν
  choice: ज़िम्मेदारी सौंप देंगे
  rationale: ἐπὶ τῆς χρείας ταύτης के साथ मिलकर क्रिया औपचारिक रूप से किसी कार्य पर नियुक्त करने का भाव देती है। हिन्दी में यह संयोजन स्वाभाविक रूप से अधिकार और उत्तरदायित्व दोनों व्यक्त करता है।
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: इस काम की ज़िम्मेदारी
  rationale: χρεία यहाँ पिछले प्रसंग में वर्णित दैनिक वितरण से जुड़ी व्यावहारिक आवश्यकता या कार्य है; ‘इस काम की ज़िम्मेदारी’ अस्पष्ट संज्ञा को प्रसंगानुकूल रखते हुए entrusted responsibility का भाव देता है।
theological_decisions:
- issue: πνεύματος का अर्थ सामान्य मानवीय आत्मा है या परमेश्वर का आत्मा
  choice: आत्मा
  alternative: पवित्र आत्मा
  rationale: लूका-प्रेरितों में सेवकाई के लिए सामर्थ्य और बुद्धि के साथ यह प्रयोग सम्भवतः परमेश्वर के आत्मा को दर्शाता है। फिर भी यूनानी में ‘पवित्र’ शब्द नहीं है, इसलिए मुख्य पाठ में उसे जोड़े बिना ‘आत्मा’ रखा गया और विकल्प पादटिप्पणी में दिया गया।
- issue: ἀδελφοί संबोधन का दायरा
  choice: भाइयो
  alternative: भाइयो और बहनो / साथी विश्वासियो
  rationale: मूल रूप व्याकरणतः पुल्लिंग है, पर संबोधन सम्भवतः एकत्रित व्यापक विश्वासी समुदाय से है। मुख्य पाठ मूल रूप को रखता है और सम्भावित व्यापक दायरे को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। ‘ज़िम्मेदारी’ सामान्य पाठकों के लिए सहज है; वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में बाँटा गया है।
