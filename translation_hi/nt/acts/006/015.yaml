source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: hi
  text: और महासभा[a] में बैठे सभी लोगों ने उसकी ओर टकटकी लगाकर देखा और देखा कि उसका चेहरा स्वर्गदूत के चेहरे जैसा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सनहेद्रिन’। यूनानी शब्द यहूदियों की शासक परिषद को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: टकटकी लगाकर देखा
  rationale: यह शब्द साधारण दृष्टि डालने के बजाय एकाग्र और लगातार देखने का भाव व्यक्त करता है; यह हिन्दी में स्वाभाविक और कथात्मक है।
- source_word: πάντες οἱ καθεζόμενοι
  choice: बैठे सभी लोगों ने
  rationale: यह πάντες की समग्रता और καθεζόμενοι की बैठी हुई अवस्था, दोनों को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συνεδρίῳ
  choice: महासभा
  rationale: यहाँ शब्द यहूदी शासकीय और न्यायिक परिषद को दर्शाता है। ‘महासभा’ आधुनिक हिन्दी पाठक के लिए अर्थपूर्ण है, जबकि ‘सनहेद्रिन’ को पादटिप्पणी में सांस्कृतिक विकल्प के रूप में रखा गया है।
- source_word: πρόσωπον
  choice: चेहरा
  rationale: इस प्रसंग में πρόσωπον स्तिफनुस के दिखाई देने वाले चेहरे को सीधे दर्शाता है; ‘चेहरा’ स्पष्ट और आधुनिक हिन्दी है।
- source_word: ὡσεὶ
  choice: जैसा
  rationale: यह समानता या सदृशता बताता है और उस समानता के विशिष्ट गुण को निर्धारित नहीं करता।
- source_word: ἀγγέλου
  choice: स्वर्गदूत
  rationale: इस प्रसंग में ἄγγελος का अलौकिक अर्थ उपयुक्त है; केवल मानवीय ‘दूत’ का अर्थ अभिप्रेत होने की संभावना कम है।
theological_decisions:
- issue: ‘स्वर्गदूत के चेहरे जैसा’ तुलना का स्वरूप
  choice: स्तिफनुस के चेहरे की स्वर्गदूत के चेहरे से सामान्य समानता, बिना यह बताए कि वह समानता किस गुण में थी
  alternative: विशेष रूप से तेजोमय महिमा, शांत निर्दोषता या स्वर्गीय अधिकार का संकेत
  rationale: यूनानी पाठ समानता बताता है, पर यह निर्धारित नहीं करता कि उसका आशय चमक, शांति, प्रताप या इनमें से किसी मेल से है। इसलिए अनुवाद इस अस्पष्टता और धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘महासभा’ सामान्य पाठक के लिए बोधगम्य है और पादटिप्पणी ऐतिहासिक नाम स्पष्ट करती है। मुख्य वाक्य में तुलना की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
