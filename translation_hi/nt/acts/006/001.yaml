source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: hi
  text: उन दिनों, जब शिष्यों की संख्या बढ़ रही थी, हेलेनिस्तियों की ओर से इब्रानियों के विरुद्ध[a] शिकायत उठी, क्योंकि प्रतिदिन के वितरण में उनकी विधवाओं की अनदेखी हो रही थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में इन समूहों के लिए “हेलेनिस्ती” और “इब्रानी” शब्द हैं। सम्भवतः पहले यूनानी बोलने वाले यहूदी और दूसरे मुख्यतः अरामी या इब्रानी बोलने वाले यहूदी थे।
    reason: cultural_note
  - marker: b
    text: या “उपेक्षा की जा रही थी”; “वितरण” के लिए आया शब्द “सेवा” या “सेवकाई” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: उन दिनों
  rationale: यह समय-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है। δέ के हल्के कथात्मक संक्रमण को अलग शब्द से अनावश्यक रूप से प्रबल नहीं किया गया।
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: जब शिष्यों की संख्या बढ़ रही थी
  rationale: सम्बन्धवाचक स्वतंत्र रचना की पृष्ठभूमिगत परिस्थिति और जारी संख्यात्मक वृद्धि दोनों स्पष्ट रहती हैं।
- source_word: ἐγένετο γογγυσμός
  choice: शिकायत उठी
  rationale: यह γογγυσμός के असंतोष अथवा शिकायत के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना उसे केवल धीमी बड़बड़ाहट तक सीमित किए।
- source_word: τῶν Ἑλληνιστῶν
  choice: यूनानी-भाषी यहूदियों
  rationale: प्रथम शताब्दी के इस समूह का सम्भावित भाषाई-सांस्कृतिक अर्थ साधारण पाठक के लिए स्पष्ट किया गया है; पादटिप्पणी मूल समूह-संज्ञा की अनिश्चितता सुरक्षित रखती है।
- source_word: πρὸς τοὺς Ἑβραίους
  choice: इब्रानी-भाषी यहूदियों के विरुद्ध
  rationale: πρός शिकायत के लक्ष्य को सूचित करता है; 'के विरुद्ध' प्रसंग का सामाजिक तनाव दिखाता है। समूह का सम्भावित भाषाई अर्थ पाठ में पठनीय रूप से दिया गया है।
- source_word: παρεθεωροῦντο
  choice: अनदेखी हो रही थी
  rationale: अपूर्ण भूतकाल और कर्मवाच्य जारी परिस्थिति दर्शाते हैं। 'अनदेखी' उपेक्षा का अर्थ देता है, पर जानबूझकर भेदभाव का दावा अनिवार्य नहीं बनाता।
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: प्रतिदिन के वितरण में
  rationale: διακονία व्यापक रूप से सेवा हो सकता है, पर विधवाओं की भौतिक देखभाल और अगले पदों का प्रसंग यहाँ वितरण को उपयुक्त बनाता है।
- source_word: αἱ χῆραι αὐτῶν
  choice: उनकी विधवाओं
  rationale: सर्वनाम का स्वाभाविक निकटतम सम्बन्ध यूनानी-भाषी यहूदियों से है और मूल का सम्बन्धसूचक रूप बना रहता है।
theological_decisions:
- issue: Ἑλληνισταί और Ἑβραῖοι की सामाजिक-भाषाई पहचान
  choice: मुख्य पाठ में 'यूनानी-भाषी यहूदी' और 'इब्रानी-भाषी यहूदी', साथ में स्पष्टीकरणात्मक पादटिप्पणी
  alternative: लिप्यंतरित समूह-संज्ञाएँ 'हेलेनिस्ती' और 'इब्रानी'
  rationale: मूल शब्द ऐतिहासिक समूह-संज्ञाएँ हैं, पर आधुनिक हिन्दी में केवल लिप्यंतरण सामान्य पाठक के लिए अस्पष्ट होगा। भाषाई पहचान सम्भावित अर्थ है, इसलिए पादटिप्पणी में इसकी सम्भाव्यता और 'इब्रानी' के अरामी अथवा इब्रानी बोलने वालों की ओर संकेत—दोनों सुरक्षित रखे गए हैं।
- issue: παρεθεωροῦντο में उपेक्षा की प्रकृति
  choice: '''अनदेखी हो रही थी''—जारी स्थिति, पर जानबूझकर किए जाने का निर्णय नहीं'
  alternative: '''उपेक्षा की जा रही थी'''
  rationale: मूल जारी निष्क्रिय उपेक्षा बताता है, लेकिन कर्ता या मंशा स्पष्ट नहीं करता। मुख्य पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'शिकायत उठी', 'संख्या बढ़ रही थी' और 'अनदेखी हो रही थी' सामान्य हिन्दी में स्वाभाविक हैं। ऐतिहासिक समूहों को पाठक के लिए समझने योग्य बनाया गया है, जबकि पादटिप्पणी मूल पदों और उनकी सम्भावित पहचान की अनिश्चितता को सुरक्षित रखती है।
