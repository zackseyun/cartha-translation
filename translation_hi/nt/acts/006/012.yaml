    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: भड़का दिया
  rationale: यह क्रिया लोगों को भावनात्मक और सामाजिक रूप से उकसाकर कार्रवाई के लिए तैयार करने का भाव देती है। ‘भड़का दिया’ आधुनिक हिन्दी में स्वाभाविक है और हिंसा को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: τε
  choice: इसलिए
  rationale: τέ हल्का संयोजक है; प्रसंग में यह पिछली कार्रवाई के परिणामस्वरूप कथा को आगे बढ़ाता है। हिन्दी में ‘इसलिए’ उस संबंध को सहज रूप से व्यक्त करता है।
- source_word: τὸν λαὸν
  choice: लोगों
  rationale: λαός के सामान्य अर्थ ‘लोग’ को बनाए रखता है और इसे केवल भीड़ तक सीमित नहीं करता।
- source_word: τοὺς πρεσβυτέρους
  choice: पुरनियों
  rationale: यहाँ शब्द केवल अधिक आयु वाले पुरुषों के लिए नहीं, बल्कि यहूदी समुदाय के मान्य अगुओं के लिए है। ‘पुरनिये’ हिन्दी बाइबलीय प्रयोग में इस ऐतिहासिक पद को संक्षेप में व्यक्त करता है।
- source_word: τοὺς γραμματεῖς
  choice: शास्त्रियों
  rationale: यह मान्यता-प्राप्त धर्मशास्त्रीय और व्यवस्था-विषयक विद्वानों का ऐतिहासिक पद है; ‘शास्त्री’ औपचारिक पारदर्शिता बनाए रखता है।
- source_word: ἐπιστάντες
  choice: अचानक ... पर टूट पड़े
  rationale: ἐφίστημι का यह रूप आकस्मिक रूप से आ पहुँचने या दबोचने के लिए बढ़ने का भाव दे सकता है। प्रसंग में ‘पर टूट पड़े’ उस अचानक और शत्रुतापूर्ण अग्रसरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνήρπασαν
  choice: पकड़ लिया
  rationale: सशक्त ढंग से किसी को काबू में लेने का अर्थ देता है। ‘पकड़ लिया’ स्पष्ट और स्वाभाविक है; बलपूर्वकता निकटवर्ती ‘पर टूट पड़े’ से भी प्रकट होती है।
- source_word: ἤγαγον
  choice: ले गए
  rationale: ἄγω का सामान्य गतिशील अर्थ यहाँ ‘ले गए’ से सहज रूप में व्यक्त होता है; पहले की पकड़ से अनैच्छिकता स्पष्ट है।
- source_word: τὸ συνέδριον
  choice: महासभा
  rationale: यरूशलेम के इस न्यायिक प्रसंग में συνέδριον यहूदी सर्वोच्च शासकीय-न्यायिक परिषद को सूचित करता है। ‘महासभा’ हिन्दी में संस्था का अर्थ देता है, जबकि पादटिप्पणी वैकल्पिक ऐतिहासिक नाम स्पष्ट करती है।
theological_decisions:
- issue: συνέδριον का संस्थागत अर्थ
  choice: महासभा
  alternative: सन्हेद्रिन; परिषद
  rationale: यह मुख्यतः ऐतिहासिक और न्यायिक पहचान का विषय है। पुरनियों और शास्त्रियों की उपस्थिति तथा यरूशलेम का प्रसंग विशिष्ट यहूदी शासकीय परिषद की ओर संकेत करते हैं; फिर भी यूनानी शब्द का सामान्य अर्थ ‘परिषद’ भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘पुरनियों’ और ‘शास्त्रियों’ जैसे स्थापित ऐतिहासिक पद रखे गए हैं। स्पष्टता के लिए मूल में निहित सर्वनाम αὐτόν की पहचान ‘स्तिफनुस’ के रूप में दी गई है।
