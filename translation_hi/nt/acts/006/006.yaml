translation:
  language: hi
  text: उन्हें प्रेरितों के सामने प्रस्तुत किया; फिर प्रेरितों ने प्रार्थना करके उन पर हाथ रखे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हाथ रखने की यह क्रिया सार्वजनिक नियुक्ति या आशीष का संकेत हो सकती है; यहाँ यूनानी पाठ इस क्रिया का कलीसियाई अर्थ और अधिक स्पष्ट नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: इन लोगों को
  rationale: सम्बन्धवाचक सर्वनाम का संकेत पिछले पद में चुने गए सात व्यक्तियों की ओर है। हिन्दी में वाक्य को स्वाभाविक और स्पष्ट रखने के लिए इसका अनाफोरिक रूप प्रयोग किया गया है।
- source_word: ἔστησαν ἐνώπιον
  choice: सामने खड़ा किया
  rationale: ἵστημι का यहाँ सकर्मक अर्थ किसी को उपस्थित करना या सामने खड़ा करना है; ἐνώπιον उपस्थिति अथवा सम्मुख होने का भाव देता है।
- source_word: τῶν ἀποστόλων
  choice: प्रेरितों के
  rationale: प्रेरित हिन्दी बाइबलीय प्रयोग में इस पहचाने हुए समूह के पदनाम का स्वाभाविक और स्थापित समतुल्य है।
- source_word: προσευξάμενοι
  choice: प्रार्थना करने के बाद
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई प्रार्थना को दर्शाता है; यह रूप हिन्दी में क्रम को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: उन्होंने उन पर हाथ रखे
  rationale: यह यूनानी क्रिया-समूह हाथ रखने की क्रिया का वर्णन करता है। हिन्दी में बहुवचन कर्ता के कारण 'हाथ रखे' स्वाभाविक है, जबकि अर्थ में किसी विशिष्ट धर्म-संस्थागत विधि को जोड़ा नहीं गया।
theological_decisions:
- issue: हाथ रखने की क्रिया का स्वरूप
  choice: 'क्रिया का वर्णन मात्र: ''उन्होंने उन पर हाथ रखे'''
  alternative: '''उन्होंने उनका अभिषेक किया'' या ''उन्हें नियुक्त किया'''
  rationale: यूनानी पाठ हाथ रखने की क्रिया बताता है, पर इसी पद में उसके कलीसियाई अर्थ को अभिषेक, नियुक्ति, आशीर्वाद या अधिकार-सौंपने में से किसी एक के रूप में परिभाषित नहीं करता। इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: प्रार्थना करने वालों और हाथ रखने वालों की पहचान
  choice: हिन्दी में दोहराया गया 'उन्होंने' निकटतम स्वाभाविक कर्ता—प्रेरितों—की ओर संकेत करता है, पर पाठ से अधिक विस्तार नहीं जोड़ता
  alternative: स्पष्ट रूप से 'प्रेरितों ने प्रार्थना करके...'
  rationale: यूनानी में कृदन्त और मुख्य क्रिया का कर्ता समान है, और कथानक में प्रेरित ही स्वाभाविक कर्ता हैं; फिर भी अनुवाद में उनका नाम दोबारा जोड़कर अनावश्यक व्याख्या नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। 'सामने खड़ा किया' मूल क्रिया की दृश्यता को बनाए रखता है, जबकि पादटिप्पणी हाथ रखने की क्रिया पर किसी एक सम्प्रदायगत अर्थ को आरोपित करने से बचाती है।
