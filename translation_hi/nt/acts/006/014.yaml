source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: hi
  text: क्योंकि हमने उसे यह कहते सुना है कि यह यीशु नासरी[a] इस स्थान[b] को नष्ट कर देगा और उन रीति-रिवाजों[c] को बदल देगा जो मूसा ने हमें सौंपे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नासरत का यह यीशु।”
    reason: lexical_alternative
  - marker: b
    text: “इस स्थान” से आशय मंदिर है।
    reason: cultural_note
  - marker: c
    text: या, “उन परम्पराओं को जो मूसा ने हमें दी थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: हमने ... सुना है
  rationale: पूर्णकालिक रूप में अतीत में सुनने और उसके वर्तमान दावे—दोनों का भाव है; आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में दिए गए आरोप का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: αὐτοῦ λέγοντος
  choice: उसे यह कहते
  rationale: ἀκούω के साथ आए कृदन्त की प्रत्यक्ष सुनवाई का भाव सहज हिन्दी में बनाए रखता है।
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: यह नासरी यीशु
  rationale: οὗτος का संकेतात्मक जोर और आरोपियों की कुछ हद तक तिरस्कारपूर्ण अभिव्यक्ति सुरक्षित रहती है; Ναζωραῖος को प्रचलित पदनाम ‘नासरी’ से व्यक्त किया गया है।
- source_word: καταλύσει
  choice: नष्ट कर देगा
  rationale: मन्दिर से संबंधित ‘इस स्थान’ के संदर्भ में क्रिया का अर्थ गिरा देना या नष्ट करना है।
- source_word: τὸν τόπον τοῦτον
  choice: इस स्थान
  rationale: मूल पाठ के सामान्य शब्द ‘स्थान’ को बनाए रखता है और मुख्य पाठ में उसके संदर्भ को अनावश्यक रूप से ‘मन्दिर’ बनाकर स्पष्ट नहीं करता।
- source_word: ἀλλάξει
  choice: बदल देगा
  rationale: भविष्यकाल और परिवर्तन के सीधे अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἔθη
  choice: रीति-रिवाजों
  rationale: यह सामुदायिक रूप से चली आ रही धार्मिक-सामाजिक प्रथाओं का सहज और व्यापक हिन्दी पर्याय है।
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: जो मूसा ने हमें सौंपे थे
  rationale: παραδίδωμι में प्राप्त परम्परा या प्रथा को आगे सौंपने का भाव है; ‘सौंपे थे’ उसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘इस स्थान’ का संदर्भ
  choice: मुख्य पाठ में ‘इस स्थान’ रखा गया है।
  alternative: ‘इस मन्दिर’ या ‘इस पवित्रस्थान’
  rationale: संदर्भ से मन्दिर अभिप्रेत है, पर यूनानी पाठ केवल ‘इस स्थान’ कहता है; इसलिए स्पष्टता पाद-टिप्पणी में दी गई है और आरोपियों के शब्द मुख्य पाठ में सुरक्षित हैं।
- issue: यीशु के प्रति आरोपियों का लहजा
  choice: ‘यह नासरी यीशु’
  alternative: ‘नासरत का यीशु’ या ‘यीशु नासरी’
  rationale: यह रूप οὗτος के जोर को बनाए रखता है और बिना अतिरिक्त टिप्पणी जोड़े आरोपियों के प्रतिकूल लहजे को प्रकट होने देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नासरी’, ‘स्थान’ और ‘रीति-रिवाज’ मूल के शब्दार्थ और आरोप के लहजे को बनाए रखते हैं; आवश्यक संदर्भ तथा वैकल्पिक अर्थ पाद-टिप्पणियों में दिए गए हैं।
