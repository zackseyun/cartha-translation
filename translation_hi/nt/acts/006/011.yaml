  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: hi
  text: तब उन्होंने चुपके से पुरुषों को यह कहने के लिए उकसाया[a], “हमने उसे मूसा और परमेश्वर के विरुद्ध निन्दा की बातें बोलते सुना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुरुषों को भड़काया”; यूनानी क्रिया में छिपे या कपटपूर्ण ढंग से प्रेरित करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह सामान्य काल-सूचक संयोजक कथा में अगली घटना का परिचय स्वाभाविक रूप से देता है।
- source_word: ὑπέβαλον
  choice: चुपके से ... उकसाया
  rationale: इस प्रसंग में क्रिया गुप्त या कपटपूर्ण ढंग से किसी को कथन के लिए प्रेरित करने का भाव रखती है; यह केवल सामने लाने का अर्थ नहीं देती।
- source_word: ἄνδρας
  choice: कुछ पुरुषों को
  rationale: ἀνήρ यहाँ पुरुष व्यक्तियों को सूचित करता है; हिन्दी में अनिश्चित बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: λέγοντας
  choice: यह कहने के लिए
  rationale: मुख्य क्रिया के बाद कृदन्त प्रेरित किए गए कार्य की विषयवस्तु बताता है, जिसे हिन्दी में उद्देश्यसूचक रचना से स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: Ἀκηκόαμεν
  choice: हमने ... सुना है
  rationale: यूनानी पूर्णकाल पूर्व में सुनने के वर्तमान प्रासंगिक परिणाम को रखता है; हिन्दी का पूर्ण रूप इसे सुरक्षित रखता है।
- source_word: αὐτοῦ λαλοῦντος
  choice: उसे ... बातें बोलते
  rationale: श्रवण-क्रिया के साथ यह रचना चल रहे बोलने को दर्शाती है; ‘बोलते सुना’ हिन्दी में स्वाभाविक है।
- source_word: ῥήματα βλάσφημα
  choice: निन्दा की बातें
  rationale: यह धार्मिक-वैधानिक आरोप की गंभीरता को सामान्य आधुनिक हिन्दी में व्यक्त करता है और शब्दों/कथनों की बहुलता को भी बनाए रखता है।
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: मूसा और परमेश्वर के विरुद्ध
  rationale: इस शत्रुतापूर्ण आरोप के संदर्भ में εἰς अपराध या वाणी की दिशा बताता है, जिसके लिए ‘के विरुद्ध’ उपयुक्त है।
theological_decisions:
- issue: स्तिफनुस पर लगाए गए आरोप का स्वरूप
  choice: कथन को मूसा और परमेश्वर के विरुद्ध ‘निन्दा की बातें’ बोलने के आरोप के रूप में प्रस्तुत किया गया है, बिना उसे सत्य ठहराए या नरम किए।
  alternative: ‘मूसा और परमेश्वर की बदनामी करने वाली बातें’
  rationale: βλάσφημα का धार्मिक और वैधानिक भार ‘निन्दा’ में अधिक अच्छी तरह सुरक्षित रहता है। प्रसंग इसे उकसाए गए पुरुषों का कथन बताता है, इसलिए अनुवाद आरोप की रिपोर्ट करता है, उसका समर्थन नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘चुपके से ... उकसाया’ मूल क्रिया की गुप्त प्रेरणा को स्पष्ट करता है, जबकि ‘निन्दा की बातें’ आरोप के धार्मिक भार को बनाए रखता है।
