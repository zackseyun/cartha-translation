  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: hi
  text: और परमेश्वर में मेरी यह आशा है—जिसे ये लोग स्वयं भी मानते हैं—कि धर्मियों और अधर्मियों दोनों का पुनरुत्थान होने वाला है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी ये लोग स्वयं भी प्रतीक्षा करते हैं।” यहाँ प्रयुक्त क्रिया का अर्थ “मानना/स्वीकार करना” अथवा “प्रतीक्षा करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: परमेश्वर में मेरी यह आशा है
  rationale: यह स्वाभाविक आधुनिक हिन्दी में आशा के आधार और दिशा को व्यक्त करता है। प्रथम पुरुष अधिकारवाचक ‘मेरी’ यूनानी कृदन्त ἔχων के निहित कर्ता पौलुस को स्पष्ट करता है, बिना अर्थ बदले।
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: जिसे ये लोग स्वयं भी मानते हैं
  rationale: ‘ये लोग’ οὗτοι और ‘स्वयं भी’ καὶ αὐτοὶ के बल को बनाए रखते हैं। ‘मानते हैं’ न्यायिक प्रसंग में साझा विश्वास या स्वीकृति को स्वाभाविक रूप से व्यक्त करता है; ‘प्रतीक्षा करते हैं’ को वास्तविक शाब्दिक विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: मृतकों के फिर जीवित उठने के लिए यह प्रचलित, सटीक और गरिमापूर्ण हिन्दी पद है।
- source_word: μέλλειν ἔσεσθαι
  choice: होने वाला है
  rationale: यह भावी घटना की अपेक्षा को सुरक्षित रखता है और ऐसी अनावश्यक तात्कालिकता नहीं जोड़ता जो ‘अब होने ही वाला है’ से आ सकती थी।
- source_word: δικαίων τε καὶ ἀδίκων
  choice: धर्मियों और अधर्मियों, दोनों का
  rationale: यह τε καὶ के समावेशी ‘दोनों’ बल तथा दोनों समूहों के स्पष्ट नैतिक विरोध को बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान का दायरा
  choice: धर्मियों और अधर्मियों, दोनों का पुनरुत्थान
  alternative: नैतिक भेद पर बल दिए बिना एक सामान्य पुनरुत्थान
  rationale: यूनानी पाठ दोनों समूहों को स्पष्ट रूप से नाम देता है। अनुवाद उनके पुनरुत्थान के समय, क्रम या न्याय की प्रणाली के बारे में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: προσδέχονται में स्वीकृति और प्रतीक्षा की अर्थ-संभावना
  choice: मुख्य पाठ में ‘मानते हैं’
  alternative: ‘प्रतीक्षा करते हैं’
  rationale: इस वाद-विवाद के प्रसंग में पौलुस अपने विरोधियों के साथ साझा विश्वास पर बल देता प्रतीत होता है; फिर भी क्रिया प्रतीक्षा या बाट जोहने का भाव भी दे सकती है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। डैश से बीच की सम्बन्धवाचक टिप्पणी स्पष्ट होती है, और ‘दोनों’ को पश्च-स्थापित कर धर्मियों तथा अधर्मियों के समावेश पर स्वाभाविक हिन्दी बल दिया गया है।
