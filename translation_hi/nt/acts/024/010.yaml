  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: hi
  text: जब राज्यपाल ने पौलुस को बोलने का संकेत दिया, तब उसने उत्तर दिया, “मैं जानता हूँ कि आप बहुत वर्षों से इस राष्ट्र के न्यायाधीश रहे हैं; इसलिए मैं अपने विषय में सहर्ष[a] अपना पक्ष रखता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मविश्वास के साथ।” इस क्रियाविशेषण में तत्परता, साहस या प्रसन्न मन का भाव हो सकता है; केवल भावनात्मक प्रसन्नता ही आवश्यक नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: तब ... उसने उत्तर दिया
  rationale: ἀποκρίνομαι का स्वाभाविक अर्थ ‘उत्तर देना’ है; τε कथा को हल्के ढंग से आगे जोड़ता है, जिसे हिन्दी में ‘तब’ सहज रूप से व्यक्त करता है।
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: जब राज्यपाल ने पौलुस को बोलने का संकेत दिया
  rationale: सम्बन्धवाचक स्वतंत्र रचना को स्वाभाविक कालवाचक उपवाक्य बनाया गया है। νεύω सिर हिलाने या संकेत करने दोनों को व्यक्त कर सकता है; ‘संकेत दिया’ अनावश्यक रूप से संकेत की ठीक शारीरिक मुद्रा तय नहीं करता।
- source_word: ἡγεμόνος
  choice: राज्यपाल
  rationale: यहाँ शब्द रोमी प्रांतीय अधिकारी के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘राज्यपाल’ स्पष्ट और परिचित प्रशासनिक पदनाम है।
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: बहुत वर्षों से
  rationale: ἐκ के साथ कालसूचक पद अतीत से वर्तमान तक चली आ रही अवधि बताता है; हिन्दी में ‘बहुत वर्षों से’ इसका स्वाभाविक समतुल्य है।
- source_word: ὄντα σε κριτὴν
  choice: आप ... न्यायाधीश रहे हैं
  rationale: कृदन्तीय रचना दीर्घकाल से चली आ रही भूमिका को बताती है; आदरसूचक ‘आप’ और पूर्ण वर्तमान भाव वाला ‘रहे हैं’ प्रसंगानुकूल हैं।
- source_word: κριτὴν
  choice: न्यायाधीश
  rationale: κριτής का मूल अर्थ न्याय करने वाला है और कानूनी प्रसंग में ‘न्यायाधीश’ उपयुक्त औपचारिक शब्द है।
- source_word: τῷ ἔθνει τούτῳ
  choice: इस जाति के
  rationale: ἔθνος यहाँ यहूदी जनसमुदाय को राजनीतिक-सामुदायिक इकाई के रूप में इंगित करता है। ‘जाति’ बाइबलीय हिन्दी में ‘लोग/राष्ट्र’ का भाव रखती है; सम्बन्धकारक प्रयोग हिन्दी में न्यायिक दायित्व को स्वाभाविक बनाता है।
- source_word: ἐπιστάμενος
  choice: मैं जानता हूँ कि
  rationale: कृदन्त पौलुस के अपना पक्ष रखने के आधार को बताता है; हिन्दी में स्पष्ट कर्ता सहित उपवाक्य अधिक स्वाभाविक है।
- source_word: εὐθύμως
  choice: सहर्ष
  rationale: शब्द तत्परता, उत्साह, अच्छे मन या आत्मविश्वास का भाव दे सकता है। ‘सहर्ष’ गरिमापूर्ण और संक्षिप्त है, जबकि वैकल्पिक ‘निश्चिन्त होकर’ पादटिप्पणी में रखा गया है।
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: अपने विषय में
  rationale: यह पौलुस से सम्बन्धित आरोपों और मामलों को सूचित करता है; ‘अपने विषय में’ औपचारिक और स्वाभाविक है।
- source_word: ἀπολογοῦμαι
  choice: अपना पक्ष रखता हूँ
  rationale: ἀπολογέομαι न्यायिक प्रतिरक्षा प्रस्तुत करने का शब्द है। ‘अपना पक्ष रखता हूँ’ आधुनिक हिन्दी में न्यायालयीन अर्थ स्पष्ट करता है और केवल सामान्य आत्मरक्षा का भ्रम नहीं देता।
