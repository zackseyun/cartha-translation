lexical_decisions:
- source_word: συνεπέθεντο
  choice: आरोपों का समर्थन किया
  rationale: क्रिया में किसी के साथ मिलकर विरोध या आक्रमण में सम्मिलित होने का भाव है। न्यायिक प्रसंग में यह बताता है कि उपस्थित यहूदी तिरतुल्लुस के आरोपों के समर्थन में शामिल हुए।
- source_word: δὲ καὶ
  choice: और ... भी
  rationale: δὲ कथा को आगे बढ़ाने वाला हल्का संयोजक है और καὶ उनकी अतिरिक्त सहभागिता दिखाता है; आधुनिक हिन्दी में ‘और ... भी’ स्वाभाविक है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों ने
  rationale: यहाँ यह उस यहूदी समूह को सूचित करता है जो सुनवाई में अभियोग का समर्थन कर रहा था; मूल से अधिक विशिष्ट पहचान जोड़ना उचित नहीं।
- source_word: φάσκοντες
  choice: कहा
  rationale: यह कृदंत उनके समर्थन में दिए गए कथन का परिचय देता है। ‘दावा करते हुए’ भी सम्भव है, पर ‘कहा’ सहज है और अनावश्यक संशय नहीं जोड़ता।
- source_word: ταῦτα οὕτως ἔχειν
  choice: कि ये बातें ऐसी ही हैं
  rationale: यह यूनानी मुहावरा ‘इन बातों का ऐसा ही होना’ व्यक्त करता है। हिन्दी वाक्य मूल के व्यापक संकेत और उनके दृढ़ कथन दोनों को बनाए रखता है।
