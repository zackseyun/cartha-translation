lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: ने आकर
  rationale: यह भूतकालिक कृदन्त लूसियास के घटनास्थल पर आने को मुख्य क्रिया से जोड़ता है; ‘ने आकर ... छीन लिया’ स्वाभाविक हिन्दी कथन है।
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: शाब्दिक अर्थ ‘एक हज़ार का अधिकारी’ है और यहाँ रोमी सैन्य ट्रिब्यून का पद सूचित होता है। ‘सेनापति’ सामान्य पाठक के लिए सुबोध है और उच्च सैन्य पद को व्यक्त करता है।
- source_word: μετὰ πολλῆς βίας
  choice: बड़े बलपूर्वक
  rationale: वाक्यांश प्रबल शारीरिक बल के प्रयोग को सूचित करता है; यह अनिवार्य रूप से दुर्भावनापूर्ण हिंसा का अर्थ आरोपित नहीं करता।
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: उसे हमारे हाथों से छीन लिया
  rationale: ἀπάγω का अर्थ यहाँ किसी व्यक्ति को ले जाना है। ‘हमारे हाथों से छीन लिया’ यूनानी मुहावरे और आरोप लगाने वाले वक्ता की दृष्टि—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
