  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: hi
  text: और उन्होंने मुझे न तो मंदिर में किसी के साथ बहस करते हुए[a] पाया, न भीड़ को भड़काते हुए[b]—न आराधनालयों में और न नगर भर में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी के साथ तर्क-वितर्क करते हुए’ या ‘किसी से चर्चा करते हुए।’ यूनानी क्रिया विचार-विमर्श या वाद-विवाद दोनों का अर्थ दे सकती है; यहाँ पौलुस सार्वजनिक उपद्रव के आरोप का खंडन कर रहा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भीड़ इकट्ठी करते हुए।’ यूनानी अभिव्यक्ति भीड़ में हलचल या सार्वजनिक अशांति उत्पन्न करने का संकेत देती है, पर इसका अर्थ अनिवार्य रूप से दंगा कराना नहीं है।
    reason: lexical_alternative
