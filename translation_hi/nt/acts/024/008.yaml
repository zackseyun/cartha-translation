  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: hi
  text: उससे[a] आप स्वयं पूछताछ करके उन सब बातों के बारे में जान सकेंगे, जिन बातों का आरोप हम उस पर लगाते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जिससे आप स्वयं पूछताछ करके उन सब बातों के बारे में जान सकेंगे, जिन बातों का आरोप हम उस पर लगाते हैं।”'
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियों में पद 6 के बाद (अनेक परंपराओं में पद 7) एक अतिरिक्त वाक्यांश है: सेनापति लूसियास पौलुस को बलपूर्वक ले गया और उसने आरोप लगाने वालों को फेलिक्स के सामने आने की आज्ञा दी। SBLGNT के पाठ में वह वाक्यांश नहीं है।'
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: उसी से
  rationale: παρά के संबंधकारक रूप में यहाँ सूचना के स्रोत का भाव है। ‘उसी से’ स्वाभाविक हिन्दी में पौलुस की ओर संकेत और बल दोनों बनाए रखता है।
- source_word: δυνήσῃ
  choice: जान सकेंगे
  rationale: भविष्यकालीन δύναμαι सामर्थ्य व्यक्त करता है; हिन्दी में मुख्य क्रिया के साथ ‘सकेंगे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸς
  choice: आप स्वयं
  rationale: यह सर्वनाम बलाघाती है और राज्यपाल द्वारा व्यक्तिगत रूप से जाँच किए जाने पर जोर देता है।
- source_word: ἀνακρίνας
  choice: पूछताछ करके
  rationale: न्यायिक प्रसंग में ἀνακρίνω का अर्थ जाँच-पड़ताल या पूछताछ करना है। ‘पूछताछ करके’ पौलुस से प्रत्यक्ष प्रश्न करने की क्रिया को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: περὶ πάντων τούτων
  choice: उन सब बातों के बारे में
  rationale: περί संबंधकारक के साथ ‘के बारे में’ अर्थ देता है; πάντων τούτων की बहुवचन व्यापकता ‘उन सब बातों’ में बनी रहती है।
- source_word: ἐπιγνῶναι
  choice: जान सकेंगे
  rationale: कानूनी संदर्भ में इसका अर्थ तथ्यों का पता लगाना या जान लेना है। ‘जान सकेंगे’ सरल आधुनिक हिन्दी है और मूल से अधिक निश्चितता नहीं जोड़ता।
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: जिनका हम उस पर आरोप लगाते हैं
  rationale: κατηγορέω संबंधकारक के साथ किसी पर आरोप लगाने का कानूनी अर्थ रखता है। यह रूप मूल के संबंधवाचक निर्माण को निकटता से सुरक्षित रखता है।
