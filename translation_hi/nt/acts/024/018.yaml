base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: hi
  text: इन्हीं बातों के दौरान[a] उन्होंने मुझे मंदिर में शुद्ध अवस्था में पाया[b], न मेरे साथ कोई भीड़ थी, न कोई उपद्रव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: ‘जिनमें’ या, प्रसंग के अनुसार, ‘जिनके दौरान।’ यूनानी पद पिछली आयत में बताए गए कामों अथवा अवसरों की ओर संकेत करता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘शुद्ध’ होने का अर्थ यहूदी धार्मिक रीति के अनुसार विधिपूर्वक शुद्ध होना है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: इन्हीं बातों के दौरान
  rationale: स्त्रीलिंग बहुवचन सम्बन्धवाचक पद पिछले पदों में बताए गए कामों या अवसरों की ओर संकेत करता है। यह हिन्दी में उसके कालगत और प्रसंगगत सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: εὗρόν με
  choice: उन्होंने मुझे ... पाया
  rationale: प्रसंग में εὑρίσκω का सामान्य अर्थ किसी को एक अवस्था या स्थान में पाना है।
- source_word: ἡγνισμένον
  choice: शुद्ध अवस्था में
  rationale: पूर्ण निष्क्रिय कृदन्त पहले पूरी हो चुकी शुद्धि से उत्पन्न अवस्था बताता है। मूल शब्द की धार्मिक-विधिक पृष्ठभूमि पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν यहाँ पूरे मन्दिर-परिसर को सूचित कर सकता है; सामान्य हिन्दी में ‘मन्दिर’ सटीक और स्वाभाविक है।
- source_word: οὐ μετὰ ὄχλου
  choice: न मेरे साथ कोई भीड़ थी
  rationale: ὄχλος का तटस्थ अर्थ भीड़ है। हिन्दी वाक्य-विन्यास में ‘मेरे साथ’ पौलुस के साथ भीड़ न होने की बात स्पष्ट करता है, बिना उसे ‘उपद्रवी झुंड’ मान लेने के।
- source_word: οὐδὲ μετὰ θορύβου
  choice: न कोई उपद्रव
  rationale: θόρυβος शोर, हलचल या सार्वजनिक अव्यवस्था को दर्शाता है। कानूनी सफाई के इस प्रसंग में ‘उपद्रव’ उपयुक्त और सहज है।
theological_decisions:
- issue: ἡγνισμένον में शुद्धि का स्वरूप
  choice: मुख्य पाठ में ‘शुद्ध अवस्था में’, और पाद-टिप्पणी में धार्मिक-विधिक अर्थ की व्याख्या
  alternative: ‘विधिपूर्वक शुद्ध किया हुआ’
  rationale: मुख्य पाठ मूल की संक्षिप्तता और निष्क्रिय पूर्ण अवस्था को बनाए रखता है, जबकि टिप्पणी यह स्पष्ट करती है कि यहाँ नैतिक निष्पापता नहीं, यहूदी धार्मिक रीति के अनुसार शुद्धि अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कानूनी-वर्णनात्मक रूप अपनाया गया है। वाक्य को अनावश्यक संस्कृतनिष्ठता से बचाते हुए मूल के विरोधात्मक बल—न भीड़, न उपद्रव—को बनाए रखा गया है।
