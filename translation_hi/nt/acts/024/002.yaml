source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: hi
  text: 'जब उसे बुलाया गया, तो तिरतुल्लुस ने उस पर आरोप लगाना शुरू किया और कहा: “आपके कारण हमें बहुत शान्ति मिल रही है, और आपकी दूरदर्शिता[b] से इस राष्ट्र के लिए सुधार[a] हो रहे हैं,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुधारात्मक उपाय’ अथवा ‘उन्नतियाँ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रशासनिक सूझ-बूझ’ अथवा ‘पूर्वविचार’। यहाँ यूनानी शब्द πρόνοια किसी शासक की सोच-समझकर की गई व्यवस्था को दर्शाता है, अनिवार्य रूप से ईश्वरीय विधान को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: जब उसे बुलाया गया
  rationale: यह genitive absolute मुख्य क्रिया की परिस्थिति बताता है। αὐτοῦ के सर्वनाम को बनाए रखा गया है; प्रसंग में इसका संकेत पौलुस की ओर है। कानूनी संदर्भ में ‘बुलाया गया’ स्वाभाविक है।
- source_word: ἤρξατο κατηγορεῖν
  choice: आरोप लगाना शुरू किया
  rationale: आरम्भसूचक रचना को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है। ‘आरोप लगाना’ कानूनी अर्थ को व्यक्त करता है, जबकि ‘अभियोग चलाना’ आवश्यकता से अधिक व्याख्यात्मक होता।
- source_word: ὁ Τέρτυλλος
  choice: तिरतुल्लुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: λέγων
  choice: उसने कहा
  rationale: कृदन्त द्वारा आरम्भ किए गए भाषण को आधुनिक हिन्दी में अलग वाक्य बनाकर स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: हमें बहुत शान्ति मिल रही है
  rationale: τυγχάνω के किसी अवस्था या लाभ को प्राप्त करने/अनुभव करने के भाव को सहज हिन्दी में व्यक्त करता है और तिरतुल्लुस की प्रशंसापूर्ण भाषा बनाए रखता है।
- source_word: διὰ σοῦ
  choice: आपके कारण
  rationale: διά + संबंधकारक यहाँ माध्यम अथवा कर्तृता बताता है। शासक को संबोधित करते समय ‘आपके कारण’ स्वाभाविक हिन्दी है।
- source_word: διορθωμάτων
  choice: सुधार
  rationale: शब्द प्रशासनिक सुधार, उन्नति अथवा सुधारात्मक उपायों को सूचित कर सकता है। ‘सुधार’ राजनीतिक-प्रशासनिक संदर्भ में व्यापक और स्वाभाविक है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: γινομένων
  choice: हो रहे हैं
  rationale: मूल में सुधारों के घटित या अस्तित्व में आने का भाव है। ‘हो रहे हैं’ अनावश्यक रूप से किसी स्पष्ट कर्ता को जोड़े बिना इसे सुरक्षित रखता है।
- source_word: τῷ ἔθνει τούτῳ
  choice: इस राष्ट्र के लिए
  rationale: यहाँ ἔθνος रोमी शासन के अधीन यहूदी राजनीतिक समुदाय को दर्शाता है। ‘राष्ट्र’ न्यायिक-राजनीतिक प्रसंग के अनुकूल है और सम्प्रदान कारक के हितार्थ भाव को ‘के लिए’ व्यक्त करता है।
- source_word: διὰ τῆς σῆς προνοίας
  choice: आपकी दूरदर्शिता से
  rationale: πρόνοια यहाँ किसी मानवीय शासक की पूर्वविचारयुक्त प्रशासनिक योजना की प्रशंसा करता है। ‘दूरदर्शिता’ इस भाव को बिना ईश्वरीय विधान का संकेत दिए व्यक्त करती है।
theological_decisions:
- issue: मानवीय प्रशासन के संदर्भ में πρόνοια का अनुवाद
  choice: दूरदर्शिता
  alternative: प्रबन्धकारी सूझ-बूझ; पूर्वविचार; विधान
  rationale: इस प्रसंग में वक्ता फेलिक्स की प्रशासनिक योग्यता की चापलूसी कर रहा है। ‘विधान’ या ‘ईश्वरीय प्रबन्ध’ जैसा अनुवाद अनचाहा धर्मवैज्ञानिक अर्थ ला सकता है, इसलिए मानवीय पूर्वविचार का अर्थ स्पष्ट रखने के लिए ‘दूरदर्शिता’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और न्यायालयीन प्रसंग के अनुकूल है। फेलिक्स के लिए ‘आप’ का प्रयोग तिरतुल्लुस की औपचारिक, चापलूसी-भरी वाणी को बनाए रखता है। उद्धरण अगले पद में जारी रहने के कारण अन्त में अल्पविराम रखा गया है।
