source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: hi
  text: पर जब पौलुस धार्मिकता, आत्म-संयम और आने वाले न्याय के विषय में विचार-विमर्श कर रहा था, तो फ़ेलिक्स डर गया और उसने उत्तर दिया, “अभी के लिए जाओ। अवसर मिलने पर मैं तुम्हें बुलाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: विचार-विमर्श कर रहा था
  rationale: यह शब्द तर्कपूर्ण चर्चा या संवाद को व्यक्त करता है; केवल एकतरफ़ा उपदेश देने का अर्थ नहीं थोपता।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: नैतिक और न्यायसंगत आचरण से संबंधित व्यापक अर्थ को बनाए रखता है।
- source_word: ἐγκρατείας
  choice: आत्म-संयम
  rationale: अपनी इच्छाओं और व्यवहार पर नियंत्रण रखने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: आनेवाले न्याय
  rationale: भावी दैवी न्याय के अर्थ को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔμφοβος γενόμενος
  choice: डर गया
  rationale: फ़ेलिक्स के भयभीत हो जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: Τὸ νῦν ἔχον πορεύου
  choice: अभी के लिए जाओ
  rationale: वर्तमान समय के लिए विदा होने की आज्ञा का स्वाभाविक रूप।
- source_word: καιρὸν δὲ μεταλαβὼν
  choice: अवसर मिलने पर
  rationale: अनुकूल या उपयुक्त अवसर प्राप्त होने का अर्थ बनाए रखता है, बिना यह निश्चित किए कि वह अवसर कब आएगा।
- source_word: μετακαλέσομαί σε
  choice: मैं तुम्हें फिर बुलाऊँगा
  rationale: किसी को दोबारा अपने पास बुलवाने के भाव को स्पष्ट करता है।
theological_decisions:
- issue: आनेवाले न्याय की प्रकृति
  choice: आनेवाले न्याय
  alternative: भावी दंड
  rationale: κρίμα का यहाँ ‘न्याय’ अनुवाद निर्णय और न्यायिक प्रक्रिया की व्यापकता बनाए रखता है; केवल दंड तक अर्थ को सीमित नहीं करता।
- issue: δικαιοσύνη का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ‘धार्मिकता’ नैतिक सीधाई और परमेश्वर के सामने उचित आचरण—दोनों की सम्भावना बनाए रखती है; प्रसंग से अधिक विशिष्ट अर्थ नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पौलुस’ को स्पष्ट कर्ता के रूप में रखा गया है क्योंकि पद के यूनानी सर्वनाम का संदर्भ पिछले प्रसंग में पौलुस है। उद्धरण में फ़ेलिक्स की टालने वाली प्रतिक्रिया संक्षिप्त और स्वाभाविक हिन्दी में दी गई है।
