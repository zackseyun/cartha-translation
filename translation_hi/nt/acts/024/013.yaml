  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: hi
  text: और जिन बातों के विषय में वे अब मुझ पर आरोप लगा रहे हैं, उन्हें वे आपके सामने प्रमाणित भी नहीं कर सकते[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके सामने प्रस्तुत” अथवा “आपके सामने सिद्ध”; यूनानी क्रिया का अर्थ किसी बात को प्रस्तुत करना या स्थापित करना हो सकता है। यहाँ आशय न्यायिक आरोप को प्रमाणों से पुष्ट करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: भी नहीं
  rationale: यह निषेध पिछली बात से पौलुस के बचाव को आगे जोड़ता है; वाक्य के अंत में ‘भी नहीं’ आधुनिक हिन्दी में इस संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παραστῆσαι
  choice: प्रमाणित
  rationale: क्रिया का मूल अर्थ किसी बात को प्रस्तुत या स्थापित करना हो सकता है; यहाँ न्यायिक प्रसंग में आरोपों को प्रमाण सहित सिद्ध करने का भाव है।
- source_word: δύνανταί
  choice: कर सकते
  rationale: यह सामर्थ्य या क्षमता बताने वाली क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: σοι
  choice: आपके सामने
  rationale: द्वितीय पुरुष एकवचन का संबोधन न्यायाधिकारी फेलिक्स से है; ‘आपके सामने’ दत्तिव के साथ न्यायिक परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘आपको’ भी संभव है।
- source_word: περὶ ὧν
  choice: जिन बातों के विषय में
  rationale: यह सापेक्ष पदबंध आरोप से संबंधित विषयों की ओर संकेत करता है और यूनानी की औपचारिक संबद्धता को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: νυνὶ
  choice: अब
  rationale: यह वर्तमान समय में लगाए जा रहे आरोपों को सूचित करता है।
- source_word: κατηγοροῦσίν μου
  choice: वे ... मुझ पर आरोप लगा रहे हैं
  rationale: न्यायिक अर्थ वाली वर्तमानकालिक क्रिया को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
