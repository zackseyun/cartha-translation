source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: hi
  text: पाँच दिन बाद महायाजक हनन्याह कुछ बुज़ुर्गों और तिरतुल्लुस नाम के एक वक्ता[a] के साथ नीचे आया। उन्होंने राज्यपाल के सामने पौलुस के विरुद्ध आरोप लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तिरतुल्लुस नाम के एक अधिवक्ता”; यूनानी शब्द किसी सार्वजनिक वक्ता या कानूनी प्रतिनिधि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: पाँच दिन बाद
  rationale: μετά के साथ कर्मकारक बीते हुए समय के बाद को दर्शाता है। δέ का हल्का कथात्मक संबंध हिंदी के स्वाभाविक प्रवाह में अलग शब्द जोड़े बिना व्यक्त हो जाता है।
- source_word: κατέβη
  choice: नीचे आया
  rationale: καταβαίνω की दिशात्मकता सुरक्षित रखी गई है; यरूशलेम से कैसरिया की यात्रा के संदर्भ में ‘नीचे आया’ स्वाभाविक है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी महायाजकीय पद का मानक और स्पष्ट हिंदी रूप है।
- source_word: Ἁνανίας
  choice: हनन्याह
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: कुछ पुरनियों के साथ
  rationale: πρεσβύτεροι यहाँ यहूदी अगुओं को सूचित करता है और τινῶν की अनिश्चितता ‘कुछ’ से व्यक्त होती है।
- source_word: ῥήτορος Τερτύλλου τινός
  choice: तिरतुल्लुस नाम के एक वक्ता
  rationale: ῥήτωρ सार्वजनिक या न्यायिक प्रसंग के प्रशिक्षित वक्ता अथवा कानूनी प्रतिनिधि को सूचित कर सकता है। ‘वक्ता’ मूल अर्थ को रखता है और वैकल्पिक कानूनी अर्थ पादटिप्पणी में दिया गया है।
- source_word: οἵτινες
  choice: उन्होंने
  rationale: यह सर्वनाम पहले उल्लिखित पूरे समूह की ओर संकेत करता है; हिंदी में नया वाक्य और ‘उन्होंने’ स्पष्ट तथा स्वाभाविक है।
- source_word: ἐνεφάνισαν
  choice: आरोप लगाए
  rationale: न्यायिक संदर्भ में क्रिया का अर्थ औपचारिक रूप से किसी के विरुद्ध मामला या आरोप प्रस्तुत करना है।
- source_word: τῷ ἡγεμόνι
  choice: राज्यपाल के सामने
  rationale: ἡγεμών रोमी राज्यपाल को सूचित करता है; आरोप लगाने के साथ ‘के सामने’ स्वाभाविक न्यायिक अभिव्यक्ति है।
- source_word: κατὰ τοῦ Παύλου
  choice: पौलुस के विरुद्ध
  rationale: न्यायिक संदर्भ में κατά के साथ संबंधकारक विरोध या अभियोग को दर्शाता है।
