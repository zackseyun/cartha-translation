source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: hi
  text: फिर उसने सूबेदार को आदेश दिया कि पौलुस को हिरासत में रखा जाए, पर उसे कुछ छूट दी जाए,[a] और उसके अपने लोगों में से किसी को भी उसकी सेवा करने से न रोका जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे कुछ आराम दिया जाए” अथवा “उसे कुछ स्वतंत्रता दी जाए।” यूनानी शब्द कठोर बंदिश से राहत, सुविधा या सीमित स्वतंत्रता का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके अपने लोग” से आशय संभवतः पौलुस के साथी या समर्थक हैं, जिन्हें उसकी सहायता करने और उसकी जरूरतें पूरी करने की अनुमति थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: उसने ... आदेश दिया
  rationale: यूनानी कृदंत को स्वाभाविक हिन्दी कथन में मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: ἑκατοντάρχῃ
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के लिए हिन्दी बाइबल-परंपरा में परिचित और सामान्य पदनाम है।
- source_word: τηρεῖσθαι αὐτόν
  choice: पौलुस को हिरासत में रखा जाए
  rationale: यहाँ τηρέω का आशय निगरानी में कानूनी बंदी बनाए रखना है; स्पष्टता के लिए सर्वनाम के स्थान पर पौलुस का नाम रखा गया है।
- source_word: ἔχειν τε ἄνεσιν
  choice: उसे कुछ छूट दी जाए
  rationale: ἄνεσις कठोर बंदिश से राहत या सीमित स्वतंत्रता दर्शाता है, पूर्ण रिहाई नहीं। 'कुछ छूट' इस सीमा को सहज हिन्दी में बनाए रखता है।
- source_word: τε ... καὶ
  choice: पर ... और
  rationale: दो निर्देश जुड़े हुए हैं; हिरासत और रियायत के बीच व्यावहारिक विरोध को 'पर' स्वाभाविक रूप से व्यक्त करता है, जबकि 'और' दूसरे निर्देश को जोड़ता है।
- source_word: μηδένα κωλύειν
  choice: किसी को भी ... न रोका जाए
  rationale: यह κωλύω के रोकने/बाधा देने के अर्थ और सार्वभौमिक निषेध, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τῶν ἰδίων αὐτοῦ
  choice: उसके अपने लोगों में से
  rationale: मूल वाक्यांश संबंधियों, साथियों या समर्थकों में से किसी एक वर्ग को स्पष्ट रूप से निर्दिष्ट नहीं करता; यह अनुवाद उसी व्यापकता को बचाता है।
- source_word: ὑπηρετεῖν αὐτῷ
  choice: उसकी सेवा करने
  rationale: क्रिया का मूल अर्थ सहायता या सेवा देना है। मुख्य पाठ में संक्षिप्त और गरिमापूर्ण अभिव्यक्ति रखी गई है तथा पादटिप्पणी व्यावहारिक जरूरतें पूरी करने की संभावित भावना स्पष्ट करती है।
