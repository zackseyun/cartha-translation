  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: hi
  text: परन्तु जब दो वर्ष पूरे हो गए, तब फेलिक्स के स्थान पर पोर्कियुस फेस्तुस आया। फेलिक्स यहूदियों की कृपा पाना चाहता था[a], इसलिए उसने पौलुस को बँधा हुआ ही छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों पर उपकार करना।” यूनानी अभिव्यक्ति का अर्थ उनकी सद्भावना पाना या उन पर उपकार करना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: परन्तु जब दो वर्ष पूरे हो गए
  rationale: सम्बन्धवाचक स्वतंत्र रचना समय की परिस्थिति बताती है। यह अनुवाद πληρωθείσης के पूर्ण होने के भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: ἔλαβεν διάδοχον
  choice: के स्थान पर ... आया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘उत्तराधिकारी पाया’ है; हिन्दी में पद-परिवर्तन को ‘के स्थान पर ... आया’ कहना अधिक स्वाभाविक और स्पष्ट है।
- source_word: Πόρκιον Φῆστον
  choice: पुरकियुस फेस्तुस
  rationale: व्यक्तिनामों का देवनागरी में स्रोत-रूप के निकट लिप्यन्तरण किया गया है।
- source_word: θέλων
  choice: चाहा
  rationale: कृदन्त फेलिक्स की अगली कार्रवाई का उद्देश्य अथवा प्रेरणा बताता है; हिन्दी में इसे मुख्य क्रिया के साथ स्वाभाविक रूप दिया गया है।
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: यहूदियों का अनुग्रह पाना
  rationale: यह मुहावरा यहूदियों की सद्भावना अर्जित करने अथवा उन पर उपकार करने—दोनों अर्थ दे सकता है। प्रसंग में ‘अनुग्रह पाना’ फेलिक्स के स्वार्थपूर्ण उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है, जबकि दूसरा सम्भव अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: κατέλιπε
  choice: छोड़ दिया
  rationale: फेलिक्स ने पद छोड़ते समय पौलुस को उसी दशा में रहने दिया; ‘छोड़ दिया’ सरल और प्रसंगानुकूल है।
- source_word: δεδεμένον
  choice: बन्धन में ही
  rationale: पूर्ण निष्क्रिय कृदन्त पौलुस की जारी बँधी हुई अवस्था पर बल देता है। ‘बन्धन में ही’ किसी खास प्रकार की जंजीर का अनावश्यक अनुमान नहीं लगाता।
theological_decisions:
- issue: χάριτα καταθέσθαι की अर्थगत अस्पष्टता
  choice: यहूदियों का अनुग्रह पाना
  alternative: यहूदियों पर उपकार करना
  rationale: यूनानी अभिव्यक्ति उनकी सद्भावना अर्जित करने या उन्हें उपकृत करने, दोनों ओर संकेत कर सकती है। मुख्य पाठ में प्रसंगानुकूल पहला अर्थ चुना गया है और वास्तविक वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है; इसे किसी साम्प्रदायिक व्याख्या से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के स्थान पर ... आया’ प्रशासनिक उत्तराधिकार को स्वाभाविक हिन्दी में व्यक्त करता है। ‘बन्धन में ही’ पौलुस की निरन्तर अवस्था पर बल देता है।
