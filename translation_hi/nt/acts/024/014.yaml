  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: hi
  text: परन्तु मैं आपके सामने यह स्वीकार करता हूँ कि जिस मार्ग को वे पंथ[a] कहते हैं, उसी के अनुसार मैं पूर्वजों के परमेश्वर[b] की उपासना करता हूँ और व्यवस्था तथा भविष्यद्वक्ताओं में लिखी हुई हर बात पर विश्वास करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दल” अथवा “संप्रदाय।” यूनानी शब्द किसी समूह या गुट को सूचित कर सकता है; यहाँ “विधर्म” कहना बाद का तकनीकी अर्थ थोप देगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पैतृक” या “पूर्वजों से संबंधित परमेश्वर”; आशय उस परमेश्वर से है जिसकी उपासना इस्राएल के पूर्वज करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: मैं आपके सामने यह मानता हूँ
  rationale: यह पौलुस की खुली और औपचारिक स्वीकृति को व्यक्त करता है, पर अपराध मान लेने का अनावश्यक भाव नहीं लाता।
- source_word: κατὰ τὴν ὁδόν
  choice: जिस मार्ग ... उसी के अनुसार
  rationale: ‘मार्ग’ प्रेरितों के काम में आरम्भिक मसीही समुदाय का ऐतिहासिक नाम है; ‘उसी के अनुसार’ κατά के अनुरूपता-संबंधी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: αἵρεσιν
  choice: पंथ
  rationale: यहाँ शब्द किसी दल या संप्रदाय के लिए विरोधियों द्वारा लगाए गए नाम को दर्शाता है, न कि बाद के तकनीकी अर्थ में ‘विधर्म’ को।
- source_word: λατρεύω
  choice: उपासना करता हूँ
  rationale: यह परमेश्वर के प्रति धार्मिक सेवा और आराधना के भाव को स्पष्ट, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: τῷ πατρῴῳ θεῷ
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यूनानी विशेषण का अर्थ पूर्वजों से प्राप्त या उनके द्वारा उपासित परमेश्वर है; यह अनुवाद इस्राएल के विश्वास के साथ पौलुस की निरन्तरता स्पष्ट रखता है।
- source_word: πιστεύων
  choice: विश्वास करता हूँ
  rationale: हिन्दी में संयुक्त मुख्य क्रिया मूल कृदन्त का भाव स्वाभाविक रूप से देती है और उपासना के साथ विश्वास का संबंध बनाए रखती है।
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: लिखी हुई हर बात
  rationale: यह लिखे हुए सम्पूर्ण विषय की व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: व्यवस्था तथा भविष्यद्वक्ताओं में
  rationale: यह यहूदी पवित्रशास्त्र के इन मान्य विभागों को दर्शाता और दोनों के समानांतर संबंध को बनाए रखता है।
theological_decisions:
- issue: पौलुस का यहूदी विश्वास और ‘मार्ग’ से संबंध
  choice: ‘मार्ग’ के अनुसार उपासना को पूर्वजों के परमेश्वर की उपासना और व्यवस्था व भविष्यद्वक्ताओं पर विश्वास की निरन्तरता के रूप में रखा गया है।
  alternative: मसीही विश्वास को यहूदी विश्वास से अलग और विरोधी धर्म के रूप में प्रस्तुत करना।
  rationale: मूल पद स्वयं ‘मार्ग’ को इस्राएल के पूर्वजों के परमेश्वर और यहूदी पवित्रशास्त्र पर विश्वास से जोड़ता है; इसलिए बाद का धार्मिक विभाजन पाठ में आरोपित नहीं किया गया।
