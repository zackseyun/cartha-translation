  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’, और न्यायिक प्रसंग के अनुकूल औपचारिक किन्तु सहज शैली अपनाई गई है। ‘मार्ग’, ‘व्यवस्था’ और ‘भविष्यद्वक्ता’ को पवित्रशास्त्रीय पदों के रूप में रखा गया है।
