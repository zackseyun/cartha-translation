  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: hi
  text: पर एशिया[a] प्रांत के कुछ यहूदी हैं, जिन्हें आपके सामने उपस्थित होकर मुझ पर आरोप लगाना[b] चाहिए था, यदि उनके पास मेरे विरुद्ध कुछ होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “एशिया” से आशय एशिया माइनर के रोमी प्रांत से है, आधुनिक महाद्वीप एशिया से नहीं।
    reason: cultural_note
  - marker: b
    text: या “मेरे विरुद्ध अभियोग लगाना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: पर ... कुछ
  rationale: δὲ का प्रसंगगत विरोध ‘पर’ से और τινὲς की अनिश्चित बहुवचनता ‘कुछ’ से स्वाभाविक रूप में व्यक्त होती है।
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: एशिया प्रदेश से आए कुछ यहूदी
  rationale: Ἀσία यहाँ रोमी प्रांत है; मुख्य पाठ में ‘प्रदेश’ आधुनिक महाद्वीप से भ्रम घटाता है, जबकि पादटिप्पणी ऐतिहासिक अर्थ स्पष्ट करती है।
- source_word: ἔδει ἐπὶ σοῦ παρεῖναι
  choice: आपके सामने उपस्थित ... होना चाहिए था
  rationale: न्यायिक संदर्भ में ἐπὶ σοῦ का अर्थ अधिकारी के सामने और παρεῖναι का अर्थ उपस्थित होना है। ‘चाहिए था’ अपूर्ण ἔδει में निहित उस दायित्व को रखता है जो पूरा नहीं हुआ।
- source_word: κατηγορεῖν
  choice: मुझ पर आरोप लगाना
  rationale: यह न्यायिक क्रिया अभियोग या आरोप लगाने को दर्शाती है; यह चयन स्पष्ट, वर्तमान हिंदी में स्वाभाविक और विधिक संदर्भ के अनुरूप है।
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: यदि उनके पास मेरे विरुद्ध कुछ होता
  rationale: शर्तवाचक वाक्यांश को व्यापक ही रखा गया है और ‘कोई आरोप’ जोड़कर अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया; optative की संभाव्य/दूरस्थ छाया ‘होता’ से व्यक्त होती है।
