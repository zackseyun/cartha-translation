  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज न्यायिक कथन। यूनानी वाक्य की विरोधात्मक शुरुआत, अपूर्ण दायित्व और संभाव्य शर्त को सुरक्षित रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
