translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण न्यायिक स्वर रखा गया है। ‘आप’ राज्यपाल को संबोधन के अनुरूप है। वाक्य को सहज बनाने के लिए कालावधि को हिन्दी के ‘गए हुए ... दिन हुए हैं’ मुहावरे में व्यक्त किया गया है।
