  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: hi
  text: आप जाँचकर जान सकते हैं[a] कि मुझे यरूशलेम में उपासना करने के लिए गए हुए बारह दिन से अधिक नहीं हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप इसकी पुष्टि कर सकते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: आप स्वयं जाँचकर जान सकते हैं
  rationale: यह पदबंध राज्यपाल की तथ्य निर्धारित करने की क्षमता बताता है। ‘जाँचकर जान सकते हैं’ न्यायिक संदर्भ में सत्यापन का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘स्वयं’ यूनानी में अलग शब्द का अनुवाद नहीं, बल्कि सम्बोधित व्यक्ति की क्षमता पर पड़े बल को दर्शाता है।
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: मुझे ... गए हुए बारह दिन से अधिक नहीं हुए हैं
  rationale: यूनानी की शाब्दिक संरचना ‘मेरे लिए बारह से अधिक दिन नहीं हैं’ बीते समय का मुहावरा है। हिन्दी में ‘मुझे गए हुए ... दिन नहीं हुए’ उसी अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: ἀφ’ ἧς
  choice: गए हुए
  rationale: आरम्भ-बिन्दु से अब तक के समय को हिन्दी की ‘गए हुए’ रचना में समाहित किया गया है; इससे ‘जब से’ का भाव बना रहता है।
- source_word: ἀνέβην
  choice: यरूशलेम गए
  rationale: यरूशलेम की ओर जाने के लिए प्रयुक्त पारंपरिक ‘ऊपर जाना’ मुहावरा हिन्दी में केवल ‘गए’ करने से अधिक स्वाभाविक है; गन्तव्य और गति सुरक्षित रहते हैं, जबकि अनावश्यक भौगोलिक असहजता से बचा जाता है।
- source_word: προσκυνήσων
  choice: आराधना करने के लिए
  rationale: भविष्यकालिक कृदन्त उद्देश्य व्यक्त करता है। ‘आराधना करने के लिए’ उस उद्देश्य को स्पष्ट करता है और निहित कर्म ‘परमेश्वर’ को पाठ में नहीं जोड़ता।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: गति-सूचक ‘गए’ के साथ हिन्दी में गन्तव्य बिना परसर्ग के स्वाभाविक रूप से व्यक्त होता है।
