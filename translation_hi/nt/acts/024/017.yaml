  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: hi
  text: कई वर्षों के बाद मैं अपने लोगों के लिए दान[a] देने और भेंटें चढ़ाने आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात जरूरतमंदों की सहायता के लिए दिया जाने वाला दान।
    reason: ἐλεημοσύνας के विशेष परोपकारी अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: कई वर्षों के बाद
  rationale: διά के साथ संबंधकारक यहाँ बीते हुए समयांतराल के बाद का अर्थ देता है। πλειόνων प्रसंग में ‘कई’ वर्षों को व्यक्त करता है; हल्के संयोजक δέ को हिंदी में अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: ἐλεημοσύνας
  choice: दान
  rationale: यह शब्द जरूरतमंदों की सहायता के लिए दिए गए परोपकारी दान को दर्शाता है। ‘दान’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है; पादटिप्पणी इसका विशेष आशय स्पष्ट करती है।
- source_word: ποιήσων
  choice: देने
  rationale: ποιέω का शाब्दिक अर्थ ‘करना/बनाना’ है, पर ἐλεημοσύνας के साथ यह दान देने का मुहावरा बनाता है।
- source_word: εἰς τὸ ἔθνος μου
  choice: अपने लोगों के लिए
  rationale: ἔθνος यहाँ पौलुस के अपने यहूदी राष्ट्र अथवा समुदाय को दर्शाता है। ‘अपने लोगों’ से हिंदी में यही संबंध स्वाभाविक ढंग से व्यक्त होता है, जबकि ‘अपने राष्ट्र’ इस वाक्य में कृत्रिम लगता।
- source_word: παρεγενόμην
  choice: आया था
  rationale: παραγίνομαι यहाँ किसी स्थान पर आने या पहुँचने को दर्शाता है। हिंदी कथन में ‘आया था’ वर्तमान न्यायिक सुनवाई से पहले की यात्रा को सहज रूप से रखता है।
- source_word: προσφοράς
  choice: भेंटें चढ़ाने
  rationale: προσφοράς बहुवचन में धार्मिक भेंटों का संकेत देता है। ‘भेंटें’ मूल की व्यापकता बनाए रखता है और ‘चढ़ाने’ से मंदिर-संबंधी क्रिया स्वाभाविक हिंदी में व्यक्त होती है।
theological_decisions:
- issue: यरूशलेम में पौलुस के दान का स्वरूप
  choice: ‘दान’ को जरूरतमंदों के लिए सहायता के अर्थ में प्रस्तुत किया गया है।
  alternative: ‘भिक्षादान’ या ‘गरीबों के लिए उपहार’
  rationale: यह मुख्यतः शब्दार्थ का प्रश्न है। ‘दान’ स्पष्ट और प्रचलित है, जबकि पादटिप्पणी उसके परोपकारी आशय को सीमित रूप से स्पष्ट करती है और कोई सांप्रदायिक धारणा नहीं जोड़ती।
- issue: ἔθνος का संदर्भ
  choice: ‘अपने लोगों’
  alternative: ‘अपने राष्ट्र’
  rationale: यहाँ पौलुस अपने यहूदी लोगों की बात करता है। चयन सामुदायिक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, बिना आधुनिक राष्ट्र-राज्य की अनावश्यक छाया डाले।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक बचाव-वक्तव्य के अनुकूल रखी गई है। ‘दान देने’ और ‘भेंटें चढ़ाने’ से दोनों अलग क्रियाओं का भेद स्पष्ट रहता है।
