id: ACT.24.5
reference: Acts 24:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: hi
  text: क्योंकि हमने पाया है कि यह आदमी एक महामारी है—संसार भर में रहने वाले सभी यहूदियों के बीच दंगे भड़काता है और नासरियों के पंथ का अगुआ भी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμὸν
  choice: एक महामारी
  rationale: शाब्दिक रूप से ‘महामारी/घातक विपत्ति’; यहाँ व्यक्ति के लिए तीखा, अपमानजनक रूपक है। ‘उपद्रवी’ कहने से रूपक की धार खो जाती।
- source_word: κινοῦντα στάσεις
  choice: दंगे भड़काता है
  rationale: στάσεις राजनीतिक-सामाजिक विद्रोह, दंगे या अशांति को सूचित कर सकता है; अभियोग की तीव्रता के अनुरूप ‘दंगे’ और κινοῦντα के लिए ‘भड़काता है’ स्वाभाविक हैं।
- source_word: οἰκουμένην
  choice: संसार भर में
  rationale: रोमी दृष्टि से बसे हुए संसार का सामान्य मुहावरा; हिन्दी में अभियोग के व्यापक दावे को सहज रूप से व्यक्त करता है।
- source_word: πρωτοστάτην
  choice: अगुआ
  rationale: प्रमुख नेता या अग्रणी व्यक्ति; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक।
- source_word: αἱρέσεως
  choice: पंथ
  rationale: उस समय किसी दल या धार्मिक समूह के लिए प्रयुक्त शब्द; यहाँ आरोपकर्ता की दृष्टि का नकारात्मक रंग है, पर बाद के तकनीकी अर्थ ‘विधर्म’ को आरोपित नहीं किया गया।
- source_word: Ναζωραίων
  choice: नासरियों
  rationale: नासरत के यीशु के अनुयायियों के लिए समूह-संज्ञा; स्रोत के आरोपात्मक नामकरण को बनाए रखता है।
theological_decisions:
- issue: αἵρεσις को विधर्म मानना
  choice: पंथ
  alternative: विधर्मी संप्रदाय
  rationale: इस प्रसंग में शब्द मुख्यतः दल/पंथ का बोध देता है। ‘विधर्मी’ अनुवाद में बाद की धर्मसैद्धांतिक निंदा अनावश्यक रूप से जोड़ देगा।
- issue: λοιμός के रूपक की तीव्रता
  choice: एक महामारी
  alternative: मुसीबत खड़ी करने वाला
  rationale: आरोपकर्ता पौलुस को स्वयं एक व्यापक घातक संकट के रूप में चित्रित करता है; रूपक को नरम नहीं किया गया।
translation_notes:
  register: अदालती अभियोग की कठोर और अतिरंजित भाषा को आधुनिक, dignified हिन्दी में रखा गया है। वाक्य स्पष्ट है, पर आरोपकर्ता की नकारात्मक दृष्टि को कथावाचक का निर्णय नहीं बनाया गया।
