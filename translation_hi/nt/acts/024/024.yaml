source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: hi
  text: कुछ दिनों के बाद फ़ेलिक्स अपनी ही पत्नी द्रूसिल्ला के साथ आया, जो यहूदी थी। उसने पौलुस को बुलवाया और मसीह यीशु[a] पर विश्वास[b] के विषय में पौलुस की बात सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीष्ट यीशु।’ यूनानी Χριστός यहाँ उपाधि के रूप में प्रयुक्त है, इसलिए मुख्य पाठ में इसका अनुवाद ‘मसीह’ किया गया है।
    reason: alternative_rendering
  - marker: b
    text: या, ‘मसीह यीशु पर भरोसे।’ यूनानी πίστις में विश्वास या भरोसे—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: कुछ दिनों के बाद
  rationale: यह समय-सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है। δέ का हल्का कथात्मक संयोजक बल हिन्दी वाक्य-प्रवाह में निहित है; अलग से ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: παραγενόμενος
  choice: आया
  rationale: यह कृदन्त फ़ेलिक्स के आने या उपस्थित होने को बताता है; ‘आया’ सरल और कथानक के अनुकूल है।
- source_word: τῇ ἰδίᾳ γυναικὶ
  choice: अपनी ही पत्नी
  rationale: ‘ही’ ἰδίᾳ के स्वत्वसूचक और बलात्मक अर्थ को सुरक्षित रखता है।
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: जो यहूदी थी
  rationale: यह द्रूसिल्ला की यहूदी पहचान को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετεπέμψατο
  choice: बुलवा भेजा
  rationale: मध्यवाच्य क्रिया का अर्थ किसी को बुलाने के लिए संदेश भेजना है; यह हिन्दी में सहज और सटीक है।
- source_word: ἤκουσεν αὐτοῦ
  choice: उसकी बातें सुनीं
  rationale: ἀκούω के साथ संबंधकारक यहाँ पौलुस को सुनने का भाव देता है। बहुवचन ‘बातें’ हिन्दी में स्वाभाविक है और आगे दिए विषय से जुड़ता है।
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: मसीह यीशु पर विश्वास के विषय में
  rationale: περί विषय बताता है, जबकि πίστις के साथ εἰς विश्वास की दिशा या लक्ष्य व्यक्त करता है। हिन्दी में ‘पर विश्वास’ इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: Χριστὸν Ἰησοῦν
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है, इसलिए उसका अर्थ ‘मसीह’ दिया गया है और यूनानी शब्द-क्रम सुरक्षित रखा गया है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में πίστις का सबसे स्वाभाविक अर्थ मसीह यीशु की ओर निर्देशित विश्वास है; निकट अर्थ ‘भरोसा’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-जैसे रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु; यीशु मसीह
  rationale: इस वाक्यांश में Χριστός का उपाधि-संबंधी अर्थ सक्रिय है। ‘मसीह’ उसका अर्थ संप्रेषित करता है, जबकि ‘मसीह यीशु’ मूल शब्द-क्रम को भी बनाए रखता है।
- issue: τῆς εἰς Χριστὸν Ἰησοῦν πίστεως का संबंध
  choice: मसीह यीशु पर विश्वास
  alternative: मसीह यीशु पर भरोसा; मसीह यीशु की विश्वासयोग्यता
  rationale: πίστις के साथ εἰς + कर्मकारक सामान्यतः किसी की ओर निर्देशित विश्वास या भरोसा दर्शाता है। इसलिए इसे यीशु की अपनी विश्वासयोग्यता के रूप में लेना यहाँ व्याकरण की दृष्टि से कम संभावित है, पर ‘भरोसा’ का निकट अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और सम्मानपूर्ण कथात्मक शैली अपनाई गई है। वाक्य को हिन्दी की पठनीयता के लिए दो भागों में बाँटा गया है। ‘अपनी ही पत्नी’ मूल के बल को बनाए रखता है; ‘बुलवा भेजा’ साधारण पाठक के लिए स्पष्ट है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
