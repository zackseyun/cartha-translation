lexical_decisions:
- source_word: ὃς
  choice: उसने
  rationale: सम्बन्धवाचक सर्वनाम का संकेत पौलुस की ओर है। हिन्दी में इस खण्डित न्यायिक आरोप को स्वाभाविक ढंग से आगे बढ़ाने के लिए ‘उसने’ उपयुक्त है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καὶ आरोप की तीव्रता बढ़ाता है—उसने मन्दिर तक को अपवित्र करने की कोशिश की। हिन्दी में ‘भी’ इस बल को सहजता से व्यक्त करता है।
- source_word: τὸ ἱερὸν
  choice: मन्दिर
  rationale: ἱερόν यहाँ पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। सामान्य पाठक के लिए ‘मन्दिर’ स्पष्ट और प्रचलित है।
- source_word: ἐπείρασεν
  choice: कोशिश की
  rationale: यहाँ क्रिया का अर्थ किसी कार्य का प्रयास करना है। ‘कोशिश की’ आधुनिक, सहज हिन्दी है।
- source_word: βεβηλῶσαι
  choice: अपवित्र करने
  rationale: यह क्रिया किसी पवित्र वस्तु या स्थान की पवित्रता भंग करने का भाव रखती है। ‘अपवित्र करने’ से मन्दिर-शुद्धता सम्बन्धी आरोप स्पष्ट रहता है।
- source_word: ὃν
  choice: उसे
  rationale: कर्मकारक सम्बन्धवाचक सर्वनाम फिर पौलुस की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक है।
- source_word: ἐκρατήσαμεν
  choice: हमने उसे पकड़ लिया
  rationale: κρατέω में बलपूर्वक पकड़ने या अपने अधिकार में लेने का भाव है। ‘पकड़ लिया’ इस भाव को ‘गिरफ्तार किया’ की अपेक्षा अधिक प्रत्यक्ष रूप से बनाए रखता है।
theological_decisions:
- issue: प्रेरितों 24:6 का छोटा आलोचनात्मक पाठ और लम्बा बीजान्टिन पाठ
  choice: SBLGNT में दिए छोटे पाठ का ही अनुवाद, जो ‘और हमने उसे पकड़ लिया,’ पर समाप्त होता है
  alternative: कुछ हस्तलिपियों में आगे यह कथन मिलता है कि वे पौलुस का न्याय अपनी व्यवस्था के अनुसार करना चाहते थे, पर सेनापति लूसियास ने उसे उनके हाथों से छीन लिया।
  rationale: मुख्य पाठ दिए गए यूनानी आलोचनात्मक पाठ का अनुसरण करता है। परिचित लम्बे पाठ को मुख्य पाठ में मिलाने के बजाय पाठांतर के रूप में पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण न्यायिक-वर्णन। ‘मन्दिर’ सामान्य पाठक के लिए रखा गया है, यद्यपि यूनानी शब्द पूरे मन्दिर-परिसर को सूचित कर सकता है। वाक्य के अन्त का अल्पविराम अगले पद से इसके व्याकरणिक जुड़ाव को बनाए रखता है।
