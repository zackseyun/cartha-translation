  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: hi
  text: इसी कारण[a] मैं स्वयं भी परमेश्वर और मनुष्यों के सामने सदा निर्दोष विवेक रखने का प्रयत्न करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी में” अथवा “इस बात में।”
    reason: मूल यूनानी पदबंध कारणसूचक या परिस्थितिसूचक—दोनों ढंग से समझा जा सकता है।
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी कारण
  rationale: यह पदबंध पिछले प्रसंग में बताई गई आशा की ओर संकेत करते हुए निष्कर्ष या प्रेरणा व्यक्त करता है। शाब्दिक अर्थ ‘इसी में’ भी संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: καὶ αὐτὸς
  choice: मैं स्वयं भी
  rationale: ‘भी’ καί के योगसूचक बल को और ‘स्वयं’ αὐτός के बलाघात को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀσκῶ
  choice: प्रयत्न करता हूँ
  rationale: यह क्रिया अभ्यास करने, अपने को साधने या किसी लक्ष्य के लिए परिश्रम करने का भाव रखती है; यहाँ निरंतर नैतिक प्रयास के लिए ‘प्रयत्न करता हूँ’ सहज है।
- source_word: ἀπρόσκοπον συνείδησιν
  choice: निर्दोष विवेक
  rationale: ἀπρόσκοπος यहाँ ऐसे विवेक को दर्शाता है जिसमें ठोकर या अपराध का कारण न हो। ‘निर्दोष विवेक’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल हिन्दी है।
- source_word: ἔχειν
  choice: बनाए रखने
  rationale: यद्यपि मूल अर्थ ‘रखना/होना’ है, प्रयत्न के साथ हिन्दी में ‘बनाए रखने’ से निरंतर लक्ष्य का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: परमेश्वर और मनुष्यों के सामने
  rationale: πρός यहाँ संबंध और जवाबदेही का भाव देता है। ‘के सामने’ परमेश्वर तथा मानवों—दोनों के प्रति नैतिक उत्तरदायित्व स्पष्ट करता है। ‘मनुष्यों’ यहाँ समस्त मानवजाति के लिए व्यापक अर्थ में है।
- source_word: διὰ παντός
  choice: सदा
  rationale: यह पदबंध निरंतरता या हर समय का भाव व्यक्त करता है; ‘सदा’ स्पष्ट और संक्षिप्त समतुल्य है।
theological_decisions:
- issue: ἀνθρώπους का व्यापक प्रतिनिधिक अर्थ
  choice: मनुष्यों
  alternative: लोगों
  rationale: यूनानी बहुवचन यहाँ सामान्य रूप से सभी मानवों को समेटता है। हिन्दी में ‘मनुष्यों’ स्त्री और पुरुष दोनों के लिए स्वाभाविक व्यापक शब्द है और मूल संज्ञा से निकट भी रहता है।
- issue: ἐν τούτῳ का पिछले पुनरुत्थान-संबंधी कथन से संबंध
  choice: इसी कारण
  alternative: इसी में / इस बात में
  rationale: प्रसंग में पौलुस अपनी आशा के आधार पर अपने आचरण का निष्कर्ष बता रहा है। फिर भी यूनानी पदबंध का अधिक शाब्दिक, परिस्थितिसूचक अर्थ संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण स्तर रखा गया है। ‘मैं स्वयं भी’ मूल के योगसूचक और बलाघाती दोनों तत्वों को बचाता है; ‘निर्दोष विवेक’ सामान्य पाठक के लिए समझने योग्य पारंपरिक नैतिक अभिव्यक्ति है।
