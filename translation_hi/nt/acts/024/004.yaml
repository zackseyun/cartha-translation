  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: hi
  text: परन्तु, आपको और अधिक न रोकूँ,[a] इसलिए मैं आपसे विनती करता हूँ कि आप अपनी कृपालुता से हमारी बात संक्षेप में सुन लें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपको और देर तक न रोकूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी न्यायोचित नरमी के अनुसार।” यूनानी शब्द निष्पक्षता, सौम्यता, या न्याय करते समय उदारता का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: परन्तु ... न डालते हुए
  rationale: δὲ का हल्का विरोधात्मक संक्रमण ‘परन्तु’ से और ἵνα μή का नकारात्मक प्रयोजन स्वाभाविक हिन्दी कृदन्तीय रचना से व्यक्त होता है।
- source_word: ἐπὶ πλεῖόν σε ἐγκόπτω
  choice: आपके समय में और बाधा न डालते हुए
  rationale: ἐγκόπτω का मूल भाव बाधा डालना है; प्रसंग में इसका आशय राज्यपाल का और अधिक समय न लेना है। यह अनुवाद मूल रूपक और व्यावहारिक अर्थ दोनों बनाए रखता है।
- source_word: παρακαλῶ
  choice: मैं आपसे विनती करता हूँ
  rationale: न्यायिक और विनम्र संबोधन में यह साधारण अनुरोध से अधिक आदरपूर्ण अनुनय व्यक्त करता है।
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: कि आप ... हमारी ... बात सुन लें
  rationale: यूनानी रचना का सीधा अर्थ ‘आप हमें सुनें’ है; हिन्दी में ‘हमारी बात सुन लें’ कानूनी सुनवाई के प्रसंग में अधिक स्वाभाविक है।
- source_word: συντόμως
  choice: थोड़ी-सी बात
  rationale: क्रियाविशेषण भाषण की संक्षिप्तता बताता है; हिन्दी में यह अभिव्यक्ति सहज रूप से ‘संक्षेप में’ का भाव देती है।
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: अपनी उदारता से
  rationale: ἐπιείκεια में न्यायोचित नरमी, सौम्यता और कृपालु विचार का अर्थ-क्षेत्र है। ‘उदारता’ आधुनिक हिन्दी में विनम्र अपील को स्वाभाविक रखती है, जबकि न्यायिक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
