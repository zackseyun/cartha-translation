  text: परन्तु फ़ेलिक्स ने उन्हें टाल दिया,[a] क्योंकि उसे मार्ग के विषय में अधिक सही जानकारी थी। उसने कहा, “जब सेनापति लूसियास नीचे आएगा, तब मैं तुम्हारे मामले का निर्णय करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
