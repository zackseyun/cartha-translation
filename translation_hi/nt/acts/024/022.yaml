    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: उन्हें ... टाल दिया
  rationale: यूनानी क्रिया यहाँ न्यायिक कार्रवाई को स्थगित करने का भाव रखती है, जबकि αὐτούς सीधे उपस्थित पक्षों की ओर संकेत करता है। हिंदी में ‘उन्हें टाल दिया’ दोनों बातों को स्वाभाविक रूप से रखता है।
- source_word: ἀκριβέστερον εἰδὼς
  choice: अधिक ठीक-ठीक जानता था
  rationale: यह अनुवाद ἀκριβέστερον के तुलनात्मक अर्थ और εἰδὼς के ज्ञान-संबंधी भाव को बनाए रखता है।
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: इस मार्ग के विषय में
  rationale: प्रेरितों के काम में ‘मार्ग’ मसीही आंदोलन का आरंभिक नाम है। ‘इस मार्ग’ हिंदी में प्रसंगगत और स्वाभाविक है तथा इसे सामान्य रास्ते से अलग पहचानने में सहायता करता है।
- source_word: Ὅταν ... καταβῇ
  choice: जब ... यहाँ आएगा
  rationale: यह किसी अपेक्षित भावी आगमन को व्यक्त करता है। ‘यहाँ आएगा’ आधुनिक हिंदी में स्वाभाविक है; यूनानी ‘नीचे आए’ प्राचीन भौगोलिक यात्रा-वर्णन का मुहावरा है।
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी के लिए सुबोध आधुनिक पद है; ‘सहस्रपति’ अत्यधिक शाब्दिक और कम प्रचलित होता।
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: मैं तुम्हारे मामले का निर्णय करूँगा
  rationale: कानूनी संदर्भ में क्रिया विचार के बाद निर्णय करने को और शेष वाक्यांश संबंधित पक्ष के मामले को दर्शाता है।
