  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: hi
  text: साथ ही वह आशा कर रहा था कि पौलुस उसे धन देगा[a]; इसलिए वह उसे और भी अधिक बार अपने पास बुलवाकर उससे बातचीत करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या प्रसंग के अनुसार अधिक स्पष्ट रूप से, “वह आशा कर रहा था कि पौलुस उसे रिश्वत देगा।” यूनानी में केवल “धन” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: साथ ही
  rationale: यह पदबंध पिछली घटना के साथ-साथ चल रही आशा को व्यक्त करता है; ‘साथ ही’ आधुनिक हिन्दी में स्वाभाविक रूप से उस समकालिकता को दर्शाता है।
- source_word: ἐλπίζων
  choice: वह आशा कर रहा था
  rationale: वर्तमान कृदन्त फेलिक्स की जारी अपेक्षा बताता है, जिसे हिन्दी का अपूर्ण भूतकाल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χρήματα
  choice: कुछ धन
  rationale: यूनानी शब्द का सीधा अर्थ ‘धन/पैसा’ है। प्रसंग में रिश्वत का संकेत है, पर मूल शब्द स्वयं ‘रिश्वत’ नहीं कहता।
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: पौलुस उसे कुछ धन देगा
  rationale: हिन्दी में सक्रिय रचना अधिक स्वाभाविक है और पौलुस को अपेक्षित धनदाता तथा फेलिक्स को प्राप्तकर्ता स्पष्ट रखते हुए मूल अर्थ सुरक्षित रखती है।
- source_word: διὸ καὶ
  choice: इसलिए
  rationale: यह फेलिक्स की धन पाने की आशा और उसके बार-बार बुलाने के बीच परिणामात्मक संबंध स्पष्ट करता है; καί का बल प्रवाह में ‘और भी’ से व्यक्त होता है।
- source_word: πυκνότερον
  choice: और भी अधिक बार
  rationale: तुलनात्मक क्रियाविशेषण बढ़ी हुई आवृत्ति बताता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: μεταπεμπόμενος
  choice: उसे बुलवाकर
  rationale: मध्यवाच्य कृदन्त किसी को अपने पास बुलाने या बुलवा भेजने का अर्थ देता है; हिरासत के प्रसंग में ‘बुलवाकर’ उपयुक्त है।
- source_word: ὡμίλει αὐτῷ
  choice: उससे बातचीत करता था
  rationale: क्रिया औपचारिक भाषण के बजाय संवाद या वार्तालाप दर्शाती है; अपूर्ण भूतकाल बार-बार होने वाली बातचीत को व्यक्त करता है।
theological_decisions:
- issue: क्या फेलिक्स के भ्रष्ट उद्देश्य को मुख्य पाठ में ‘रिश्वत’ कहकर स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘धन’ रखा गया है और रिश्वत का प्रसंगगत संकेत पादटिप्पणी में दिया गया है।
  alternative: वह आशा कर रहा था कि पौलुस उसे रिश्वत देगा।
  rationale: प्रसंग भ्रष्ट उद्देश्य का प्रबल संकेत देता है, पर यूनानी में χρήματα अर्थात ‘धन’ है, रिश्वत के लिए कोई विशिष्ट शब्द नहीं। इसलिए पाठ की शब्दगत संयमिता और निहित तनाव दोनों बनाए रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पैसे’ की अपेक्षा ‘धन’ थोड़ा अधिक गरिमापूर्ण है, जबकि ‘बातचीत करता था’ बार-बार होने वाले निजी संवाद को स्वाभाविक रूप से व्यक्त करता है।
