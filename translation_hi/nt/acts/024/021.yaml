source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: hi
  text: 'या इस एक बात के विषय में, जिसे मैंने उनके बीच खड़े होकर ऊँची आवाज़ में कहा था: ‘मरे हुओं के पुनरुत्थान के विषय में आज आपके सामने मेरा न्याय हो रहा है।’[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बात’ के स्थान पर ‘पुकार’ या ‘आवाज़’ भी सम्भव है; यूनानी शब्द कही गई बात या उसे कहने वाली आवाज़/पुकार, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मृतकों में से पुनरुत्थान।’
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: बात
  rationale: περὶ के साथ और आगे दिए गए कथन की विषयवस्तु के कारण यहाँ शब्द केवल ध्वनि नहीं, बल्कि कही गई विशिष्ट बात को सूचित करता है। ‘बात’ आधुनिक हिन्दी में स्वाभाविक है और कथन की विषयवस्तु को स्पष्ट रखता है।
- source_word: ἐκέκραξα
  choice: मैंने ... ऊँची आवाज़ में कहा था
  rationale: κράζω ऊँची और सार्वजनिक आवाज़ में बोलने को दर्शाता है। यह हिन्दी प्रयोग उस बल को बनाए रखते हुए ‘चिल्लाया’ की अनावश्यक कठोरता से बचता है।
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: उनके बीच खड़े होकर
  rationale: यह पौलुस के बोलते समय की स्थिति और स्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναστάσεως νεκρῶν
  choice: मरे हुओं के पुनरुत्थान
  rationale: सम्बन्धकारक रचना का सीधा अर्थ सुरक्षित रहता है और विवाद के सामान्य विषय को यीशु के पुनरुत्थान तक सीमित नहीं किया जाता।
- source_word: κρίνομαι
  choice: मेरा न्याय हो रहा है
  rationale: वर्तमान कर्मवाच्य न्यायिक जाँच की चल रही क्रिया को दर्शाता है; यह मूल के निकट और हिन्दी में बोधगम्य है।
- source_word: ἐφ’ ὑμῶν
  choice: आपके सामने
  rationale: न्यायिक प्रसंग में यह किसी प्राधिकारी या न्यायपीठ के सामने उपस्थित होने का भाव देता है और श्रोताओं को अनिवार्यतः न्याय के कर्ता नहीं ठहराता।
- source_word: ἢ
  choice: या
  rationale: यह पिछले वाक्य से जुड़े वैकल्पिक अपवाद को मूल की तरह खुला रखता है।
- source_word: μιᾶς ταύτης
  choice: इस एक
  rationale: यह कथन की एकता और विशिष्टता दोनों पर बल देता है।
- source_word: σήμερον
  choice: आज
  rationale: यह समयसूचक क्रियाविशेषण का सीधा और आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: विवादित आरोप का स्वरूप
  choice: मुख्य पाठ में विषय को सामान्य रूप से ‘मरे हुओं के पुनरुत्थान’ के रूप में रखा गया है।
  alternative: इसे विशेष रूप से यीशु के पुनरुत्थान का संकेत मानना।
  rationale: यूनानी पदबंध περὶ ἀναστάσεως νεκρῶν सामान्य है। प्रेरितों के काम के व्यापक प्रसंग में यीशु का पुनरुत्थान महत्त्वपूर्ण है, पर इस पद में उस विशिष्टता को जोड़ना मूल से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक प्रसंग के अनुरूप गरिमापूर्ण, पर सामान्य पाठकों के लिए सहज। ‘आपके सामने’ सम्मानसूचक बहुवचन की सम्भावित अस्पष्टता बनाए रखता है।
