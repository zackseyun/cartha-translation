lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: पौल के बचाव में एक वैकल्पिक चुनौती प्रस्तुत करता है; ‘या’ यूनानी संयोजक का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: αὐτοὶ οὗτοι
  choice: ये लोग स्वयं
  rationale: संकेतवाचक और बलसूचक सर्वनाम, दोनों का जोर बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰπάτωσαν
  choice: बताएं
  rationale: तृतीय पुरुष आज्ञार्थक कानूनी चुनौती को सहज हिन्दी में व्यक्त करता है; यहाँ केवल बोलने से अधिक, आरोप स्पष्ट करने का भाव है।
- source_word: τί εὗρον
  choice: कौन-सा ... पाया था
  rationale: उनसे किसी विशिष्ट दोष या अपराध की पहचान करने को कहा गया है; ‘पाया था’ पूर्ण हुई पूर्व घटना के समय-संबंध को स्पष्ट करता है।
- source_word: ἀδίκημα
  choice: अपराध
  rationale: न्यायिक संदर्भ में गलत काम या दंडनीय दोष का अर्थ देता है। यह ‘अन्याय’ की अपेक्षा अधिक स्वाभाविक है, यद्यपि यूनानी शब्द हर स्थिति में तकनीकी अपराध तक सीमित नहीं है।
- source_word: στάντος μου
  choice: जब मैं ... खड़ा था
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है और पौल की महासभा के समक्ष उपस्थिति का भाव सुरक्षित रखता है।
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: महासभा के सामने
  rationale: यहाँ συνέδριον यहूदी शासकीय परिषद को सूचित करता है। ‘महासभा’ प्रचलित हिन्दी बाइबलीय पद है और ‘के सामने’ न्यायिक उपस्थिति व्यक्त करता है।
