  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: hi
  text: तब फ़िलिप्पुस दौड़कर उसके पास गया और उसने उसे यशायाह नबी की पुस्तक पढ़ते सुना। उसने कहा, “क्या आप जो पढ़ रहे हैं, उसे सचमुच समझते हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या आप जो पढ़ रहे हैं, उसे वाकई समझते हैं?” यूनानी प्रश्नवाचक अव्यय फ़िलिप्पुस के प्रश्न पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: दौड़कर उसके पास गया
  rationale: यह क्रिया रथ की ओर तेज़ी से बढ़ने का सजीव भाव देती है; ‘दौड़कर उसके पास गया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ क्रमिक प्रगति को सहज रूप से व्यक्त करता है।
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: उसने उसे ... पढ़ते सुना
  rationale: ἀκούω के साथ संबंधकारक कृदंत उस व्यक्ति को पढ़ने की क्रिया में सुने जाने का संकेत देता है। यूनानी में ‘ऊँचे स्वर से’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: यशायाह नबी की पुस्तक
  rationale: संदर्भ में व्यक्ति यशायाह के भविष्यद्वाणी-ग्रंथ का पाठ पढ़ रहा है। हिन्दी में केवल ‘यशायाह नबी को पढ़ते’ कहना अस्वाभाविक और व्यक्ति को पढ़ने जैसा लग सकता है, इसलिए अंतर्निहित ग्रंथ को स्पष्ट किया गया है।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: यह λέγω का सीधा और स्वाभाविक हिन्दी समतुल्य है; इसके बाद का प्रश्न वाक्य कथन के प्रश्नात्मक स्वरूप को स्पष्ट करता है।
- source_word: Ἆρά γε
  choice: क्या ... सचमुच
  rationale: दोनों अव्यय मिलकर प्रश्न में बल और जाँचने का भाव जोड़ते हैं; ‘क्या ... सचमुच’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: γινώσκεις
  choice: समझते हैं
  rationale: यहाँ अर्थ पढ़ी जा रही सामग्री के आशय को समझना है, केवल उससे परिचित होना नहीं।
- source_word: ἃ ἀναγινώσκεις
  choice: जो आप पढ़ रहे हैं
  rationale: संबंधवाचक सर्वनाम पढ़ी जा रही सामग्री को सूचित करता है और वर्तमान काल की जारी क्रिया ‘पढ़ रहे हैं’ से व्यक्त होती है।
