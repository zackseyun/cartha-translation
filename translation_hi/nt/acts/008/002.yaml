  text: परन्तु धर्मपरायण पुरुषों ने स्तिफनुस को दफ़नाया[a] और उसके लिए बड़ा विलाप किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्तिफनुस के शव को दफ़नाने के लिए तैयार किया’ अथवा ‘स्तिफनुस के शव को दफ़नाने के लिए ले गए’; यूनानी क्रिया दफ़नाने के साथ-साथ शव को सँभालने या ले जाने पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘बड़े विलाप’ में ऊँची आवाज़ में तथा सार्वजनिक रूप से प्रकट किया गया शोक भी शामिल हो सकता है; इसका अर्थ केवल मन का दुःख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: दफ़नाया
  rationale: सन्दर्भ में यह क्रिया स्तिफनुस की मृत्यु के बाद उसके शव को सँभालकर अन्त्येष्टि करने की ओर संकेत करती है। हिन्दी में ‘दफ़नाया’ इसका स्वाभाविक और संक्षिप्त परिणामसूचक अनुवाद है; क्रिया में शव को उठाकर ले जाने या दफ़नाने की तैयारी का भाव भी हो सकता है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: δέ
  choice: परन्तु
  rationale: 'यह पिछले वर्णन के साथ हल्का संक्रमण या विरोध दिखाता है: उत्पीड़न और स्तिफनुस की मृत्यु के बीच कुछ भक्त पुरुष उसका सम्मानपूर्वक अन्त्येष्टि करते हैं।'
- source_word: ἄνδρες εὐλαβεῖς
  choice: भक्त पुरुषों
  rationale: ἄνδρες का पुरुषवाचक अर्थ बनाए रखा गया है और εὐλαβεῖς की श्रद्धा तथा धर्मनिष्ठा को आधुनिक, सहज हिन्दी में ‘भक्त’ व्यक्त करता है।
- source_word: ἐποίησαν
  choice: किया
  rationale: यहाँ क्रिया κοπετόν के साथ मिलकर ‘विलाप करना’ का स्वाभाविक मुहावरा बनाती है।
- source_word: κοπετὸν μέγαν
  choice: बहुत विलाप
  rationale: कोपेतोस शोक की बाहरी, सम्भवतः सुनाई देने वाली अभिव्यक्ति को दर्शाता है और μέγαν उसकी तीव्रता बताता है। ‘बहुत विलाप’ सहज हिन्दी में दोनों भाव रखता है।
- source_word: ἐπ’ αὐτῷ
  choice: उसके लिए
  rationale: शोक के प्रसंग में यह स्तिफनुस के कारण या उसकी मृत्यु पर किए गए विलाप को दर्शाता है। हिन्दी में ‘उसके लिए’ स्वाभाविक है और व्यक्ति-केंद्रित अभिव्यक्ति बनाए रखता है।
