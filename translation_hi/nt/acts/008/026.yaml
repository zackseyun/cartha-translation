source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: hi
  text: प्रभु के एक स्वर्गदूत ने फिलिप्पुस से कहा, “उठो और दक्षिण[a] की ओर उस सड़क पर जाओ जो यरूशलेम से गाज़ा तक नीचे जाती है।” यह सड़क सुनसान है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोपहर के समय।” यूनानी पद दिशा (“दक्षिण”) या समय (“दोपहर”)—दोनों का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “यह मरुस्थल है।” इसका अर्थ यह भी हो सकता है कि यह मार्ग किसी मरुस्थलीय क्षेत्र से होकर जाता था, न कि सड़क स्वयं सुनसान थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος κυρίου
  choice: प्रभु के एक स्वर्गदूत
  rationale: अनिश्चित एकवचन को ‘एक’ से व्यक्त किया गया है। प्रसंग में ἄγγελος परमेश्वर की ओर से मार्गदर्शन करने वाला स्वर्गदूत है; ‘संदेशवाहक’ अनावश्यक रूप से व्यापक होगा।
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: फिलिप्पुस से कहा
  rationale: हिन्दी में ‘बोला...कहते हुए’ कृत्रिम और दोहरावपूर्ण होता। प्रत्यक्ष वचन के परिचय में ‘से कहा’ दोनों यूनानी अभिव्यक्तियों का स्वाभाविक अर्थ देता है।
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: उठो और ... जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को सरल, तत्काल और स्वाभाविक हिन्दी में रखा गया है।
- source_word: κατὰ μεσημβρίαν
  choice: दक्षिण की ओर
  rationale: गमन और सड़क के संदर्भ में दिशासूचक अर्थ अधिक संभावित है। ‘दोपहर के समय’ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: उस सड़क पर ... जो यरूशलेम से गाज़ा को जाती है
  rationale: καταβαίνουσαν यरूशलेम से नीचे उतरने की भौगोलिक धारणा रखता है, पर सामान्य आधुनिक हिन्दी में इस मार्ग के लिए ‘जाती है’ अधिक सहज है और गंतव्य-संबंध स्पष्ट रखता है।
- source_word: αὕτη ἐστὶν ἔρημος
  choice: यह सड़क सुनसान है
  rationale: स्त्रीलिंग αὕτη का स्वाभाविक पूर्वपद ὁδός है, इसलिए हिन्दी में ‘सड़क’ दोहराकर संदर्भ स्पष्ट किया गया। ἔρημος का ‘मरुस्थल’ अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘प्रभु के स्वर्गदूत’ की पहचान
  choice: पाठ के अनुसार उसे केवल प्रभु से संबद्ध स्वर्गदूत के रूप में प्रस्तुत किया गया है।
  alternative: इसे ‘परमेश्वर द्वारा भेजा गया स्वर्गदूत’ कहना या किसी विशिष्ट दिव्य प्रकट रूप के रूप में पहचानना।
  rationale: मूल पाठ दिव्य अधिकार और संबद्धता बताता है, पर इस स्वर्गदूत की कोई अधिक विशिष्ट धर्मवैज्ञानिक पहचान निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। प्रत्यक्ष वचन स्वाभाविक रखा गया है; वास्तविक यूनानी अस्पष्टताओं को मुख्य पाठ में जबरन हल करने के बजाय पादटिप्पणियों में सुरक्षित किया गया है।
