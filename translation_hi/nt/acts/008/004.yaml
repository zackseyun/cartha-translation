  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: hi
  text: इसलिए, जो लोग तितर-बितर कर दिए गए थे, वे जगह-जगह जाकर वचन का प्रचार करते रहे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वचन का प्रचार करते हुए जगह-जगह गए।”
