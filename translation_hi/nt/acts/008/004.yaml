  - marker: b
    text: यूनानी में “वचन”; अर्थात् यीशु के बारे में संदेश।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: इसलिए जो लोग
  rationale: οὖν पिछले प्रसंग में हुए सताव और बिखराव से परिणामात्मक संबंध दिखाता है। μέν यहाँ संवाद की गति को आगे बढ़ाता है और हिंदी में अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: διασπαρέντες
  choice: तितर-बितर कर दिए गए थे
  rationale: यह अओरिस्ट कर्मवाच्य कृदंत है और सताव के कारण पहले हो चुके बिखराव को दर्शाता है। यह रूप कर्मवाच्य और मुख्य क्रिया से पहले की घटना—दोनों को स्पष्ट रखता है।
- source_word: διῆλθον
  choice: जगह-जगह जाकर
  rationale: क्रिया यहाँ एक स्थान से दूसरे स्थान तक घूमते हुए जाने का भाव देती है। यह हिंदी में भ्रमणशील गतिविधि को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी अनुल्लिखित भौगोलिक क्षेत्र को जोड़ने के।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार के रूप में सुनाते रहे
  rationale: कृदंत यात्रा के साथ चलती हुई गतिविधि बताता है, और क्रिया में शुभ समाचार घोषित करने का अर्थ निहित है। ‘सुनाते रहे’ निरंतर गतिविधि को सहज हिंदी में व्यक्त करता है।
- source_word: τὸν λόγον
  choice: वचन को
  rationale: λόγος का संक्षिप्त लूकीय पद ‘वचन’ के रूप में सुरक्षित रखा गया है। ‘परमेश्वर का वचन’ कहना इस पद में अनुपस्थित शब्द जोड़ देता, जबकि केवल ‘संदेश’ कहना मूल अभिव्यक्ति को अधिक व्याख्यात्मक बना देता।
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον में क्रिया और कर्म का संबंध
  choice: वचन को शुभ समाचार के रूप में सुनाते रहे
  alternative: वचन का प्रचार करते रहे
  rationale: यूनानी में τὸν λόγον क्रिया का सीधा कर्म है, और εὐαγγελίζομαι में शुभ समाचार सुनाने का भाव है। चुना हुआ रूप दोनों तत्वों को बनाए रखता है तथा ऐसा संबंध नहीं बनाता मानो शुभ समाचार ‘वचन का’ कोई अलग विषय हो।
- issue: λόγος का आशय
  choice: मुख्य पाठ में ‘वचन’, टिप्पणी में यीशु के विषय का संदेश
  alternative: मुख्य पाठ में ‘यीशु का संदेश’
  rationale: मुख्य पाठ मूल की संक्षिप्तता और संभावित व्यापकता को बचाता है; टिप्पणी प्रसंगगत आशय स्पष्ट करती है, पर उसे मूल शब्दों के स्थान पर नहीं रखती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘तितर-बितर’ सामान्य पाठकों के लिए स्वाभाविक है; ‘वचन’ बाइबलीय शब्दावली को बनाए रखता है और टिप्पणी उसका प्रसंगगत अर्थ स्पष्ट करती है।
