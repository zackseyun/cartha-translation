- source_word: πολλὴ χαρά
  choice: बड़ा आनन्द
  rationale: πολλή अमूर्त संज्ञा χαρά की तीव्रता बताता है। ‘बड़ा आनन्द’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से ‘बहुत अधिक आनन्द’ का भाव रखता है।
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: उस नगर में
  rationale: πόλις के लिए ‘नगर’ और संकेतवाचक ἐκείνῃ के लिए ‘उस’ पिछले प्रसंग में उल्लिखित स्थान को स्पष्ट रूप से इंगित करते हैं।
